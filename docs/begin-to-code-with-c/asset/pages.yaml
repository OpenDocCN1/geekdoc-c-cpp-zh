  md: '# Falling off the end of an array


    When a program runs, it allocates exactly the right amount of memory needed for
    an array of a particular size. This can lead to problems. The next statement is
    trying to set the sales for the last ice-cream stand to 50.


    ```

    sales[10] = 50;

    Ch07_02_ArrayExceptions

    ```


    At first glance this looks okay. The array contains 10 elements, and we are accessing
    the tenth one. How can this fail? It turns out that this statement fails because
    the first element of the array has the index 0, which means the element has the
    index 9. (If you don''t believe me, count the array elements in Figure 7-1, and
    you''ll see that you have ten of them, numbered 0 to 9. There is no element in
    the array with an index value of 10 for the program so it does the only thing
    it can. It throws an exception.


    Throwing an exception is the software equivalent of kicking over the table if
    you are losing in a game of chess. The current activity is abandoned. If you are
    using Visual Studio to develop the program, you might see a scary description
    of what just happened. Figure 7-2 shows you the kind of information you see in
    Visual Studio if your program throws an exception.


    ![](img/547210b145d9948b1613255cf1ee9fa4_202_0.png)


    Figure 7-2 Exception details displayed by Visual Studio for an IndexOutOfRange
    exception.


    If the program is running outside Visual Studio, the user won''t see this message,
    but there is a very good chance that the program will just stop when the exception
    is thrown.


    You might think that this behavior is a bit extreme. All we did was get an index
    value wrong. Why such a fuss? The answer is very important. When a program goes
    wrong,'
