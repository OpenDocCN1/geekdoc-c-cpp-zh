  md: '# Reading a nonexistent contact


    The principle of the contacts app should be that the user stores something before
    they try to load it back. However we need to consider what would happen if the
    user tries to fetch a nonexistent item. This will happen in the case where the
    user types in the name of a contact that is not stored in the app.


    It turns out C# provides a value just for this purpose. The value is called null.
    The value null is a setting that we can give a C# variable if it is not sensitive
    for the variable to refer to anything. For example, the following statement sets
    the variable name to refer to the string "Rob":


    ```

    string name = "Rob";

    ```


    If we want to represent the situation where the name has not been set, we can
    write the following:


    ```

    string name = null;

    ```


    If a program tries to use a null reference, it will fail with an exception. Here
    are some state-ments that try to display a string that has been set to null. When
    they run, the program will be abandoned, and the exception in the following screenshot
    will be generated.


    ```

    string name = null;

    SnapsEngine.DisplayString(name);

    ```


    ![](img/547210b145d9948b1613255cf1ee9fa4_259_0.png)


    Whenever you create a behavior in a program, it is very important to consider
    that it could fail and the best thing for it is to do it if so. In the case of
    FetchFromStringLocalStorage, the method returns null if it''s asked to find an
    item that does not exist.'
