  md: '# Abstract methods and classes


    **Question:** The Update method is virtual, and the Reset method is abstract.
    What''s the difference?


    **Answer:** When we created the MovingSprite class, we decided that classes that
    extend the MovingSprite class might want to build on the Update behavior that
    makes a sprite move. Making a method virtual means that it can be overridden by
    a method in the child class. We have this in lots of classes. The RocketSprite
    overrides Update to provide a version the player controls the rocket, whereas
    the ChaserAlien class overrides Update to provide a version that moves the sprite
    toward the player at all times.


    Abstract is different. It says, "You need to do this in your code. I don''t know
    that you need to do it." In the context of our game, the declaration of an abstract
    Reset method expresses the need for every sprite to have some kind of reset behavior.


    **Question:** Why is the MovingSprite class not abstract?


    **Answer:** MovingSprite class is not abstract because the system can''t ever
    make an instance of it. If we did make an instance and somebody tried to use the
    Reset method on that, the program would not know what to do.


    **Question:** What does it mean if a class is abstract?


    **Answer:** Abstract means that the program never actually create a class of this
    type. The class serves as a template for other classes, which will extend the
    abstract class and provide implementations of the abstract elements.


    **Question:** Didn''t you make a virtual Reset method that can be overridden?


    **Answer:** Update method runs inside a sprite to update it in the game. We made
    the Update method so that it can be customized in other classes that extend the
    MovingSprite class. However, there is not always a need for a class to override
    a method from a parent. In other words, there''s nothing forcing a child class
    to provide an Update method. Making a method abstract means that the child class
    must provide it, forcing the developers to add one. It is very keen that people
    forget the Reset method (like I did), so I''m forcing them to remember it.


