- img_proc: true
  md: '# What makes a programmer?


    If you have not programmed before, don''t worry. Programming is not rocket science—it
    is, well, programming. The hard part about learning to program is what you get
    it at the start with a lot of ideas and concepts, and this can be confusing.


    However, if you think learning to program sounds like hard work and that you might
    not be able to do it, I''d strongly suggest that you put those thoughts aside.
    Programming is as easy as organizing a birthday party for a friend.


    # Programming and party planning


    If you were organizing a party, you''d have to decide who to invite. You''d have
    to remember who wanted vegetarian pizza and which kids can''t sit next to each
    other without trouble. You''d have to work out what presents the kids would take
    home and what everyone would do when they were at the party. And you''d have to
    organize the timing so that the magician or the band doesn''t arrive just as the
    food is being served. To help, you''d organize your party using lists like shown
    in Figure 2-1. Programming is just like this. It is all about organization.


    | Guest List | Menu | Guest Presents |

    |---|---|---|

    | Jim Simon | Crisps | 3:00 pm Arrival |

    | Anita Josh | Pizza | 3:30 Party Games Whistle (maybe) |

    | Mo Kevin | Lemonade | 4:00 Food Sweets |

    | Sunil Albert | Orange juice | 5:15 Magician Puzzle Book |


    **Figure 2-1** Party planning is a lot programming—you have to stay organized.


    If you organize a party, you can write a program. What happens in a program is
    a little different, but the basic principles are the same. And because a program
    contains elements you create and manage (unlike kids), you have control over exactly
    what happens. Once you''re vonce to doing some programming, you might start to
    approach all tasks in a systematic way, so a bit of programming experience can
    turn you into a better organizer overall.


    Programming is defined by most people as "earning huge sums of money doing something
    that nobody can understand." I define programming as "determining a solution to
    a given problem and expressing it in a form that a computer system can understand
    and execute." One or two things out of this:'
  merge: -1
  pgno: 44
- img_proc: true
  md: '+   • You need to be able to solve the problem yourself before you can write
    a program to do it.


    +   • The computer has to be made to understand what you are trying to tell it
    to do.


    You can think of a program as a bit like a recipe. If you don''t know how to bake
    a cake, you can''t tell someone how to do it. And if the person you are talking
    to doesn''t understand instructions such as "Fold the flour and sugar into the
    mix," you can''t tell them how to bake the cake.


    To create a program, you have to take a solution that you have worked out and
    write it down in simple steps that the computer can perform.


    # Programming and problems


    I also like to think of a programmer as a bit like a plumber. A plumber arrives
    at a job with a big bag of tools and spare parts. Having looked at the plumbing
    problem for a while, he opens his bag, takes out various tools and parts, fits
    the parts together, and solves your problem. Programming is like that. You are
    given a problem to solve, and you have a disposal big bag of tools, in this case
    a programming language. You look at the problem for a while, work out how to solve
    it, and fit the bits of the language together to solve the problem. The art of
    programming is knowing which bits you need to take out of your bag of tools to
    solve each part of the problem.


    The art of taking a problem and breaking it down into a set of instructions can
    give to a computer the interesting part of programming. However, learning to program
    is not simply a matter of learning a programming language. No program is a matter
    of coming up with a program that solves a problem. You must consider many things
    when writing a program, and not all of them are directly related to the problem
    at.


    To start, let''s assume that you''re writing your programs for a customer. He
    or she has a problem and would like you to write a program to solve it. We''ll
    also assume that the customer knows even less about computers than we do. Initially,
    you''re not even going to talk about the programming language, the type of computer,
    or anything like that; you are simply going to make sure you know what the customer
    wants. Because programmers pride themselves on their ability to come up with solutions,
    as soon as they are given a problem, they immediately start to think of ways to
    solve it—this is almost a reflex action. Unfortunately, many software projects
    have failed because the problem the customer doesn''t have is something that happens
    surprisingly often in the real world. The developers of the software quite did
    not find out what was required or desired. Instead, they created what they thought
    was required. The customers assumed that because the developers stopped asking'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'questions, the right solution was being built. Only at the final handoff was
    the awful truth revealed. It is very important that a programmer should hold off
    making something until he knows exactly what is required.


    The worst thing you can say to a customer right away is "I can do that." Instead,
    you should first think, "Is what the customer wants? Do I understand what the
    problem is? Asking these questions is a kind of self-discipline. Before you solve
    a problem, you should be sure that you have a watertight definition of what the
    problem is, which both you and the customer agrees on.


    In the real world such a definition is sometimes called a functional design specification,
    or FDS. An FDS tells you exactly what the customer wants. Both you and the customer
    sign it, and the bottom line is if you provide a system that behaves according
    to the specification, the customer must pay you. Once you have your design specification,
    you can think about ways of solving the problem.


    You might think that having a specification isn''t necessary if you are writing
    a program for yourself, but this is not true. Writing some of specification forces
    you to think about your problem at a very detailed level. It also forces you to
    think about what your system is not going to do. This need clarity when building
    something as much as you are working with a customer. The specification sets expectations
    right at the start.


    > PROGRAMMER''S POINT

    The specification must always be there


    I have written many programs for money. I would never write a program without
    getting a solid specification first. This is true even (or perhaps especially)
    when I do a job for friend.


    Modern development techniques put the customer at the heart of development and
    involve them in the design process in an ongoing way. These techniques reflect
    the assumption that it is very hard to get a definitive specification at the start
    of a project. As a developer, you don''t know much about the customer''s business,
    and the customer doesn''t know the limitations and possibilities of the technologies
    that can be used to solve the problem. With this mind, it''s a good idea to make
    a series of versions of the solution and discuss each version with the customer
    before moving on the next one. This is called prototyping.


    # Programmers and people


    Finding out what the customer wants is one of the most important aspects of any
    programming task. However, communication with other people is important in lots
    of'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'other situations, too. Perhaps you want to convince a wealthy backer that you
    have the idea for the next big thing or persuade a customer that you have the
    best solution to his problems.


    Not all programmers are great communicators at the start. The important thing
    to remember is that communication skills can be learned, just like a new programming
    language. This might mean going outside your comfort zone—nobody standing in front
    of an audience for the first time—but with practice you can master communication
    skills and vastly increase your chances of going a long way in this business.


    Effective communication also extends to writing. Being able to create text that
    other folks can read is a very useful skill, and again the best way to do this
    is with practice. My advice is to start writing a blog or a diary. It doesn''t
    matter that your mom reads your blog at first; the important thing is that you
    write regularly. If you write about something you are interested in (I write about
    programming—surprise, surprise—at www.robmiles.com), you will quickly become better
    at it.


    # PROGRAMMER''S POINT


    > Programmers who can communicate well get the most money and the interesting
    work


    It''s possible to make a good living from programming even if you can communicate
    only in single words and grunts—as long as you can code quickly that meets the
    given requirements. But the really interesting tasks go to developers who can
    communicate well. They are the ones who can sell their ideas and are best at talking
    to customers to find what the customer wants.


    # Computers as data processors


    Now that you know what programmers do, we can start to consider what a computer
    is and what makes it special.


    # Machines and computers and us


    The human race is a race of toolmakers. We invent things to make our lives easier,
    and we''ve been doing it for thousands of years. We started with mechanical devices,
    like the plough, which made farming more efficient, but in the last century we''ve
    moved into electronic devices. Figure 2-2 offers a quick summary.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '| Inputs | Outputs |

    | --- | --- |

    | Human Effort Steering | Ploughed fields |

    | Plough | |

    | Coal Steering | Gets you where you want to be |

    | Train | |

    | Electricity Program Data | More useful data |

    | Computer |


    **Figure 2-2** Machines that do things for us.


    Machines usually involve something going into them, or inputs, and they produce
    things or events that we want as outputs. A plough, with human effort and steering
    as inputs, provides a field that will grow more crops. Given coal and a track
    to follow, a train takes us where we want to go. A computer is given power, a
    program to tell it what to do, and some data to work on. It then outputs data
    that is useful.


    As computers become smaller and cheaper, they find their way around us, and many
    devices—the mobile phone, for example—are possible only because we can put a computer
    inside to make them work. But we need to remember what the computer actually does:
    there’s nothing particularly clever about a computer; it simply follows the instructions
    that it’s given. In this respect, a computer has a lot in common with a plough—it’s
    not conscious in any way. It is something that we can use to make our lives easier.


    A computer works on data in the same way that a sausage machine works on meat:
    something is put in one end, some processing is performed, and comes out the other
    end. You can think of a computer program as similar to the instructions that a
    coach gives to a football or soccer team before a play. The coach will say something
    like,“If they attack on the left, I want Jerry and Chris to run back, but if they
    kick the ball down the field, I want Jerry to chase the ball.” Then, when the
    game unfolds, the team will respond in a way that would let them outperform their
    opponents.


    However, there is one important distinction between a computer program and the
    way a team might behave in a football game. A football player would know that
    some instructions make no sense. If the coach says,“If they attack on the left,
    I want Jerry to'
  merge: -1
