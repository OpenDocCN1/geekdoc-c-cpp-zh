    **Figure 12-5** shows a ball that is one-tenth of the width of the screen. Most
    games work by setting the size of the objects when the game starts.


    ![](img/547210b145d9948b1613255cf1ee9fa4_411_0.png)


    **Figure 12-5** A smaller ball, drawn to scale.


    # Viewport widths and screen sizes


    **Question:** If you are thinking I''ve told you screen sizes before, you''re
    right. In Chapter 9, when we worked on the drawing program, we used a Snaps method
    named GetScreenSize which a program can use to determine the width and height
    of the screen. The method returns a SnapsCoordinate that has the X value set to
    the width of the screen and the Y value set to the height. How do we have two
    versions of getting the screen size?


    **Answer:** The GetScreenSize method returns the size of the window that the program
    is running inside of. However, when we make a game that runs in full-screen mode,
    the game takes over the entire screen display, and the window-size value is not
    correct in this situation. So we have two size methods.'
