    {\n    public void StartProgram() {\n        SnapsEngine.DisplayString(\"Start\"\
    );\n        SnapsEngine.Delay(10);\n        SnapsEngine.DisplayString(\"End\"\
    );\n    }\n}\n```\n\nThis program displays \"Start\", pauses for 10 seconds, and\
    \ then displays \"End\". The Delay method is different from DisplayString in the\
    \ type of data you want to provide to it. You give the DisplayString method the\
    \ string you want the program to display. You give the Delay method the number\
    \ of seconds you want the program to pause. This number can be a fraction if you\
    \ want the program to pause for less than a second:\n\n```\nSnapsEngine.SpeakString(\"\
    Tick\");\nSnapsEngine.Delay(0.5);\nSnapsEngine.SpeakString(\"Tock\");\n```\n\n\
    You can use Delay to make a program look like it is thinking about something or\
    \ to give the user time to read some information on the screen.\n\n# SetTextColor\n\
