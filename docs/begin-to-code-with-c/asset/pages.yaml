  md: "# # Making a time tracker\n\nPrograms have a habit of growing bigger. Sometimes\
    \ this occurs because you underestimate the scope of the problem (which is bad),\
    \ but it can also happen because your first program and comes back to you with\
    \ additional requests (which is good). In this chapter, the news is good. We heard\
    \ back from our friend the lawyer, who's using the tiny contact book we created\
    \ in Chapter 8. She now asks you to add to the program the capability to track\
    \ the amount of time she spends with a client so she has this information handy\
    \ for billing. She would also like to be able to discover which customers occupy\
    \ most of her time.\n\n# ## Creating a structure to hold contact information\n\
    \nA good start would be to improve the way that contact information for an individual\
    \ is stored. In the previous Tiny Contacts program, the information was stored\
    \ in a number of different strings—one for each item. For the updated program,\
    \ we can design a structure to hold contact information and store a collection\
    \ of objects built from the structure.\n\nHere is my design for a structure named\
    \ Contact. The structure contains four member values, which hold the name, address,\
    \ phone number, and time spent with a specific contact. The name, address, and\
    \ phone number items are held as strings, and the number of minutes spent with\
    \ the contact is held as an integer. The structure contains a constructor method\
    \ that a program can use to set up the values in the contact. Note that the MinutesSpent\
    \ value is set to 0 when the contact is created.\n\n```\nstruct Contact {\n  \
    \  public string ContactName;\n    public string ContactAddress;\n    public string\
    \ ContactPhone;\n    public int ContactMinutesSpent;\n\n    public Contact(string\
    \ name, string address, string phone) {\n        ContactName = name;\n       \
    \ ContactAddress = address;\n        ContactPhone = phone;\n        ContactMinutesSpent\
    \ = 0;\n    }\n}\n```"
