  md: '# Input sanitizing


    This contact application is so simple that your mother could use it. Although
    she might not like it very much if the program doesn''t always find people she
    knows is in the list. One reason for this is that she is trying to find contact
    information for "Rob" when the information was stored under the key "rob". Remember
    that the user has to enter the name exactly as it was originally entered, otherwise
    the program fails to find the contact.


    You can fix this by using something we''ve seen before. You can ask a string to
    return a version of itself converted to lowercase using a method named ToLower.
    The ToLower method converts any alphabetic characters in a string to their lowercase
    version so that contact details will now be found successfully.


    ```

    name = name.ToLower();

    ```


    At this point, you''re rather proud of your program, so you show it to your younger
    brother and invite him to try and break it—and he succeeds. He finds a way to
    enter a name that looks okay, but the name can''t be found by the program. You
    both know there is a contact stored for this person, the program doesn''t find
    it. You ask him to show how he does it, and he shows you the following search
    screen.


    ![](img/547210b145d9948b1613255cf1ee9fa4_262_0.png)


    If you look carefully at the screenshot, you''ll see that your brother broke the
    program by adding a space in front of "Rob", the program is searching for " Rob",
    with a leading space in front of the R. C# is a sticker for accuracy, these searches
    will fail. Fortunately, we can use another method to attack this problem. You
    can ask a string to "trim" itself by removing any leading and trailing spaces.
    This would change " Rob " to "Rob" and make the program work.


    The best way to solve these problems is to write a helper method that will use
    Trim ToLower to tidy up the text the user enters:


    ```

    string TidyInput(string input)

    ```'
