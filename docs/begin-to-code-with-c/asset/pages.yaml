  md: '# Losing data


    It is not obvious which statement in the temperature-conversion code is causing
    the problem. This raises some questions:


    **Question:** Where is the "double" value coming from?


    **Answer:** The double-precision element in this program is the literal value
    1.8. When the compiler sees a whole number literal, it regards it as an integer.
    When the compiler sees a value that contains a decimal point, it regards it as
    a double-precision number. When C# evaluates an expression, the result has the
    type of the "largest" type used in the expression. This means that an expression
    with a double-precision value will return a double-precision result.


    **Question:** Why is the compiler complaining?


    **Answer:** Converting a value from double precision to integer is not a problem
    for the computer. It is a simple operation for a program. However, the compiler
    is concerned that the programmer (that you might) lose valuable data in the conversion
    because the fractional part of the real number will be discarded. It is essentially
    saying, "I won''t just do this conversion; you have to explicitly tell me you
    want the program to do it."


    **Question:** What is this "cast" the error message refers to?


    **Answer:** If you cast a value, you have the job of deciding which actor will
    play which role. Once you decide, you can tell Kevin he is playing the role of
    Macbeth—and the best of luck to him. In programming terms, casting is rather similar.
    It is like saying, "I know that this value is a double-precision value, but for
    this statement I''d like to play the role of an integer." The compiler is happy
    that you are aware that a conversion is taking place and allows the operation
    to go forward casting later in this section.


    We can fix the error using double to change the type of the variable that holds
