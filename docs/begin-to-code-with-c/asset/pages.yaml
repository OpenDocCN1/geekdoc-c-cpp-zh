  md: '**Question:** What would this program display when it runs?


    **Answer:** The best way to determine this is to work through the program a statement
    at a time, just like the computer does it runs the program. Remember that when
    a method is complete, the program''s execution continues at the statement following
    the call of that method. The output from this program is exactly what you would
    expect—“The cat sat on the mat.”


    **Question:** What happens if a method calls itself, for example, if the StartProgram
    method called StartProgram?


    **Answer:** The effect is to see what you see inside two mirrors that face each
    other. In the mirrors, you see reflections going off infinity. When the StartProgram
    method calls itself, your computer will go quick for a few seconds and then run
    out of “stack space.” The stack overflow occurs each time a method is called;
    it stores the return address (the place it must go back to) on a data structure
    inside the computer (called a stack). When a program reaches the end of a method,
    it grabs the address on top of the stack and heads back to the address points.
    This means as methods are being called and returned, the stack grows and shrinks.


    However, when a method calls itself, the program repeatedly adds addresses on
    the stack. Each time the method calls itself, another address is added to the
    top of the stack. Eventually the stack grows too large for the memory space it
    was allocated, and the program is halted.


    Computer scientists have a name for that by calling itself. They call it recursion.
    It is occasionally useful in programs, particularly when the program is searching
    for values in large data structures. However, I have been programming for many
    years and have used recursion only a handful of times. I advise you to regard
    recursion as strong magic that you don''t need to use just now. You should hardly
    ever need to use recursion to repeat blocks of code


