  md: "# Adding some randomness to Keep Up!\n\nAt the moment, the Keep Up! game is\
    \ very predictable. When the game starts, the ball and the paddle are always in\
    \ the same place, the top-left corner of the viewport. It would make the game\
    \ more interesting if there was a bit of variation, and one way to add this is\
    \ to make the ball begin in a different position time the game starts. To do this,\
    \ we need to get a random number that is used to position the ball, and for this\
    \ we need to take a more detailed look at how to get random numbers into our game.\n\
    \nWe considered randomness in the past when we used the Snaps ThrowDice method\
    \ to return a value in the 1 to 6. Now we can take a look at how the ThrowDice\
    \ method works, with a view to using the same techniques to make random numbers\
    \ for our.\n\nHere is the ThrowDice code from the Snaps library. You can find\
    \ it in the NativeSnaps folder in the Snaps project.\n\n```\nusing System;\n\n\
    namespace SnapsLibrary\n{\n    public static partial class SnapsEngine\n    {\n\
    \        public static Random rand = new Random();\n\n        public static int\
    \ ThrowDice()\n        {\n            return rand.Next(1, 7);\n        }\n   \
    \ }\n\n```\n\nThe ThrowDice method uses a class Random that is located in the\
    \ System namespace. The class provides a variety of methods that return random\
    \ numbers for use by programs. The ThrowDice method uses the Next method. The\
    \ Next method is provided with two numbers--minimum value and an exclusive maximum\
    \ value. This means that the user of ThrowDice will get at least 1, but the largest\
    \ number they will get be 6 because the maximum is 7.\n\nThe Next method that's\
    \ used by ThrowDice can be used to generate an integer in any range you want.\
    \ Just specify the required start and end values, but remember that the end value\
    \ is exclusive in that you will never actually get that value."
