  md: '# Count vs. Length


    If you have a good memory, you''ll recall that a program can find out how many
    elements an array contains by asking for its Length property. With a list, the
    same information is supplied as a Count property.


    **Question**: Why have the designers of C# make things difficult by changing the
    name?


    **Answer**: I think this is quite clever. In an array, the number of elements
    can never change. So, when an array is created, the length is a fixed value. But
    when you use a list, the number of elements can change at any time. This means
    that you are counting the elements in the list at a specific time. Since the behavior
    is different, the designers of C# decided to make the name different, too.


    **Question**: What would be the count value for a brand-new List?


    **Answer**: A brand-new list would return a count of zero.


    # Lists and the index value


    You use an index value to specify particular element of an array you want to work
    with. You can also access elements of an array by using an index value:


    ```

    Contact startContact = contacts[0];

    ```


    This statement sets the variable startContact to contain the name of the first
    contact to be added to the list. If contacts have been stored and the list is
    empty, the statement would cause the program to fail with an "index out of range"
    exception. This is the same error you get if your program falls off the end of
    an array by using an invalid index value.


    # Lists of structures


    Lists are much easier to use than arrays. However, they do have one or two interesting
    foibles, particularly if you use a List to hold a collection of value types such
    as a structure. Because structures are managed by value and everything in a List
    must be managed by reference, a C# program does some fancy footwork to manage
    the structure'
  merge: -1
