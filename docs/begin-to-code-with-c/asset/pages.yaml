  md: '![](img/547210b145d9948b1613255cf1ee9fa4_465_0.png)


    **Figure 14-4** Game objects class diagram.


    This is called a class diagram. It shows a kind of family tree of the objects
    in the game. Parent classes are at the top of the diagram, with child classes
    beneath them. MovingSprite class is the parent class of all the game objects.
    It holds the image and position of the sprite. Each class beneath it builds on
    these items and adds extra data as required.


    # ## Taking a look at class diagrams


    **Question:** Which of the classes has the fewest abilities?


    **Answer:** We''ve already considered this issue. The class at the top of the
    diagram is the one that has the fewest abilities, although this is a bit counterintuitive
    because most diagrams that show organizations put the most powerful person (the
    king or the boss) at the top, with the less powerful people underneath. However,
    the way that abilities accumulate as you move down the diagram means that the
    classes with the widest range of behaviors will be at the bottom.


