  md: 'Information, on the other hand, is the interpretation of data by people to
    mean something. Strictly speaking, computers process data and humans work on information.
    As an example, the computer could hold the following bit pattern somewhere in
    memory:


    11111111 11111111 11111111 00000000


    You could regard this as meaning "You are $256 overdraften at the bank" or "You
    are 256 feet below the surface of the ground" or "Eight of the thirty-two light
    switches are off." The transition from data to information is usually made when
    a human reads the output.


    Why am I being so pedantic? Because it is vital to remember that a computer does
    not "know" what the data it is processing actually means. As far as the computer
    is concerned, data is just patterns of bits; it is the user who gives meaning
    to these patterns. Remember this when you get a bank statement that says you have
    $8,388,608 in your account!


