  md: '# # What you will learn


    Programmers have been creating games for as long as we''ve had computers. I think
    that you should try your hand at writing some games even if you don''t intend
    to go into game development. For one thing, getting good at programing is all
    about practice, and games give you a great place to write lots and lots of code.
    But the main reason is that developing games let you ''doodle'' with code with
    no fear of failure.


    When you create a game, you don''t have to worry about meeting a specification
    or implementing the ''right'' way to solve a problem. You can just write something
    that might be fun and then find out whether it is. If it doesn''t work as you
    expected, that can be interesting too. Writing games lets you experiment with
    coding, and that''s a lot of fun.


    In this chapter, you''ll discover how games operate and start working with the
    software elements that make up gameplay.


