  md: "# Compilation errors\n\nBefore a program can run, it must be checked by the\
    \ compiler. You can think of this process as a bit like the preflight checks performed\
    \ on aircraft. Before a flight, the captain must walk around the plane, count\
    \ the winds, ensure that all the tires have air in, and be sure that the craft\
    \ is safe to fly. In the same way, the compiler performs preflight checks on a\
    \ program before it can run. If the program does not adhere to the rules of C#,\
    \ the compiler will generate errors that you, the programmer, need to fix.\n\n\
    Unfortunately, the compiler is pickier about errors than humans. I can walk up\
    \ to someone and say “What are you doing?” I will get an answer, even though the\
    \ question I asked is not properly formed English. However, if I try to compile\
    \ the program, I will get errors:\n\n```\nusing SnapsLibrary;\n\npublic class\
    \ BadBrackets {\n    public void StartProgram()\n{\n        SnapsEngine.Speaking(\"\
    Hello world\");\n        SnapsEngine.Speaking(\"Goodbye chickens\");\n    }\n\
    }\n```\n\nThis code looks very similar to a program that we know, but there are\
    \ two mistakes in the text. The bad news is that they generate 11 highly confusing\
    \ errors, as shown in this screenshot.\n\n![](img/547210b145d9948b1613255cf1ee9fa4_82_0.png)\n\
    \nThe hard part is that none of these messages actually tell you what you did\
    \ wrong (or some of them look crazy). The compiler is a very clever program, but\
    \ it's not smart enough to say, “You used parentheses where you have used curly\n\
    \nChapter 3 Writing programs"
  merge: -1
