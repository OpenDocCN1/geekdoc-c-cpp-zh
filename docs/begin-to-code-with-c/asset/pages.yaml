  md: '# What you have learned


    In this chapter, you''ve learned how to store large amounts of data in a C# program
    through the use of arrays. An array is an area of computer storage of a fixed
    size. The programmer can create any array of C# type. The array contains a particular
    number of elements. Each element is equivalent to a single variable of the same
    type as the array. In other words, you can regard an integer array as a large
    number of integer variables held in one place.


    A program can specify particular element is to be used by adding an index value
    to the array. The element at the start of the array has index 0, and elements
    are numbered sequentially up to the length of the array. For example, a five-element
    array would have elements numbered 0,1,2,3,4. The index of an array can be expressed
    as a fixed value or by using the value of a variable. This makes it easy to use
    a loop construction to work through the elements in an array. The array provides
    a Length that can be used in a program to determine the number of elements in
    the array. The C# language provides an additional loop construction, called foreach,
    that can be used to enumerate the elements in an array.


    Arrays can have multiple dimensions. A one-dimensional array has size only in
    one direction. A two-dimensional array can be visualized as a table of values.
    One index of a two-dimensional array can be regarded as specifying the row in
    the table and the other index the column. The C# language is capable of supporting
    arrays of many dimensions, although in general programming, it is very unlikely
    that more than three dimensions will be used.


    Here are some points to ponder arrays.


    # Do we need really arrays?


    Yes. There are many situations where it would be impossible to create the program
    if arrays were not available. Very simple programs can use single variables, but
    to process large amounts of data you need to have an array.


    # How does an array work?


    When the program creates an array, a block of memory is reserved that is just
    the size for all the data elements in the array. When a program accesses an array
    element, the program first checks to see whether the requested element is in memory
    block (that is, it makes sure that you are not trying to use an element that does
    not exist). If the element can''t be found, the program is terminated with an
    exception. If the element is inside the array’s bounds, the program finds the
    base of the array and then moves down the block to find the selected element.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Why can''t array index errors be detected before the program runs, when it
    is being compiled?


    The compiler can only perform static analysis of the program code. This means
    the compiler can make a few assumptions based on the program that you have written,
    but it can''t know everything that will happen to values in variables when the
    program runs. For example, the compiler has no idea what number a user might type
    in when the program runs. Since array accesses happen when the program runs, there
    is no chance that the compiler can flag these errors.'
  merge: -1
