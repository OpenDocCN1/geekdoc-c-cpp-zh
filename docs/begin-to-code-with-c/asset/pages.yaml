    this is just how the numbers worked out. When the program does the calculation,
    it generates a result that is stored with this high level of precision, but this
    doesn''t mean that there is more detail in the data.


    For most of my programs I don''t use the double-precision type because I don''t
    need its level of precision. Instead I use the float type, which is for floating-point
    number. As I mentioned earlier, this holds numbers less accurately than double,
    but the values take up as much space in memory, and are much faster to calculate.
    These considerations can be important if you are thinking of running your programs
    on small devices like mobile phones.


    # PROGRAMMER''S POINT


    Don''t confuse precision with accuracy


    > It is very important to remember that numbers don''t become more accurate just
    because they are stored with more precision. Scientists in a laboratory measuring
    the length of ant legs will not be able to do this to more than a few digits of
    accuracy (unless they have some technology), so there is no point in using much
    higher precision to store and process their results. Using higher precision has
    the effect of slowing down the program and also means that the variables take
    up space in memory.


