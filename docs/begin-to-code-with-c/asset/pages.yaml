    # # What you have learned


    In this chapter, you''ve become more familiar with the Visual Studio environment
    in which you''re creating your programs. You''ve seen that a C# program is expressed
    as a sequence of statements that are performed in order when the program runs.
    You''ve also seen the high-level C# that you and I have written converted into
    lower-level instructions by a program called the compiler. Sometimes the code
    has compiled, so the program runs successfully, and sometimes the code hasn''t
    compiled because of errors.


    You''ve seen that the compiler ensures the program conforms to the rules of the
    C# language. The compiler will reject programs that don''t have statements that
    are completely correct. Whereas a human reader will tolerate missing or incorrect
    punctuation, the compiler will reject anything that does not obey the rules of
    the program language.


    The programs we have written so far make use of a set of Snaps provided by the
    Snaps library that lets us do things such as speak messages, display colors, and
    delay the execution of the program for a while. These components are provided
    as methods'
