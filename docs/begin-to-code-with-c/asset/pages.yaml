    a program that contains a mistake like this.


    **Question:** What will the fault cause the program to do?


    **Answer:** Since there is no number that is less than 1 and greater than 100,
    this means that the expression controlling the loop can never be true, which means
    that the loop will never repeat. In other words, it will regard every age value
    as a correct one. This is very dangerous because if you don''t test the program
    with invalid values, it will never notice this problem.


    # WHAT COULD GO WRONG


    # Always test failure behaviors along with successful ones


    This is a really important point to consider when you write software. You need
    to test the code that you are supposed to deal with errors. Software engineers
    talk about the "happy path" through a program, where the user enters the right
    values, the network connection works, there''s enough space on the disk drive,
    and the printer doesn''t jam. Programmers write software, they tend to focus on
    this happy path without giving too much to the dangerously large number of ways
    a program can go wrong. This is a dangerous way to write code. A great programmer
    will proactively look for things that can go wrong, build in the code to deal
    with the error conditions, and then—crucially—take the trouble to test that code.


    In the case of the age-reading program we''ve been looking at, I''d insist on
    testing it with the ages 0,15,100, and 101. These values let me be sure that the
    invalid ages (0 and 101) are rejected and that all the other ages (including the
    values on the boundaries) are accepted. In fact, I would find a way that I could
    test the code automatically so that I can perform the tests at regular intervals.'
