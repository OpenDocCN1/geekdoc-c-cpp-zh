  md: '# Drawing dots on the screen


    Before we code our program, we have to work out how we''re going to express the
    drawing positions we''re going to use. In computer graphics, the position values
    for drawing are frequently expressed in pixels. A pixel is an addressable dot
    on the screen of the device that you are using. Display manufacturers talk about
    displays that are 1280 pixels by 768 pixels, for example, and the resolution of
    a digital camera is also expressed in pixels. The more pixels a screen has, the
    more details it can show, although this is, of, affected by the size of the screen,
    too.


    As shown in Figure 9-3, for a given position on the screen, the value of X specifies
    how far the position is from the left edge, and the value of Y specifies how far
    the screen from the top edge. A specific location is expressed as (X, Y).


    ![](img/547210b145d9948b1613255cf1ee9fa4_292_0.png)


    Figure 9-3 Screen coordinates.


    # CODE ANALYSIS


    # Making sense of coordinates


    Question: Where on the screen is the coordinate (0,0)?


    > Answer: This position is sometimes called the origin of the coordinate system.
    When we draw on a computer screen, the origin is usually the top-left corner of
    the screen. Note that this is different from most graphs you draw on paper, which
    have their origin at the bottom-left corner.


    Question: If I increase the value of Y, which way do I move my position on the
    screen?


    > Answer: This is very important. Increasing the value of Y moves the position
    down the screen, not up, because the origin of the screen is the top-left corner.'
  merge: -1
