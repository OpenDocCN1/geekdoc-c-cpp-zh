    Ch08_04_AlertLevel


    The C# compiler matches the order in which arguments are given with the order
    of the parameters defined in the method. For the Alert method, that the compiler
    knows which value is for the message and which for the sound effect. But this
    can lead to problems if you make a mistake. Consider this method call:


    ```

    Alert(false, "Donuts have arrived");

    ```


    This call has the arguments in the wrong order, which confuses the compiler and
    produces errors when the program is compiled.


    ```

    Error 2 Argument 1: cannot convert from ''bool'' to ''string''

    Error 1 Argument 1: cannot convert from ''string'' to ''bool''

    ```


    The first error says always,"You have given me a Boolean value, and I wanted a
    string." The second error says the reverse. You will get similar errors if you
    tried to make incorrect calls to Snaps methods.


    One way to avoid this problem is not to put the parameters in the wrong order.
    Another way is to use named arguments, like this:


    ```

    Alert(urgent:false, message:"Donuts have arrived");

    ```


    Named arguments make the method call clearer.


    In this version of the call, I added the name of each argument before the value.
    This approach has two big advantages. First, now it doesn''t matter in which order
    I give the arguments. Second, it means that the program is much clearer to reading
    it. It is very obvious from the method call what values the method will be using
    when it runs.'
