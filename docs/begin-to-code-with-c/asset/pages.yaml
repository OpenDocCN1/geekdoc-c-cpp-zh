    # PROGRAMMERS POINT


    You can get a lot of credibility by making good test data


    Over the years I''ve watched a lot of demonstrations of software. Quite often
    will show me a system that is designed to handle thousands of customers, but their
    demo will show only five or six because "didn''t have time to enter lots of test
    data." I find it very hard to take such demonstrations. I''m much more impressed
    by a demonstration that contains thousands of customers. You can create lots of
    names by combining first names and surnames. Twenty first names and twenty surnames
    will give you four people to work with.


    Our program can create a set of test data when it starts running. Of course, we
