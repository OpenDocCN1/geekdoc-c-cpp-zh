  md: '# Working with numbers


    We have worked mainly with strings of text up to this point. Now it''s

    time to learn how a program can represent and manipulate numeric values.


    # Whole numbers and real numbers


    As far C# is concerned, there are two kinds of numbers, whole numbers and real

    numbers. Whole numbers have no fractional part. A computer stores the value of
    a

    whole number exactly. Real numbers, on the other hand, have a fractional element.
    As

    a programmer, you need to choose which kind of number you want to use to store
    a

    particular value.


    ![](img/547210b145d9948b1613255cf1ee9fa4_104_0.png)


    # Whole numbers vs. real numbers


    You can learn about the difference between whole numbers and real numbers by looking
    at

    a few situations when they might be used.


    **Question**: I''m building a device that can count the number of hairs on your
    head. Should I

    store this value as a whole number or a real number?


    **Answer**: This should be a whole number, since there is no such thing as half
    a hair.


    **Question**: I want to use my hair-counting machine on 100 people and work out
    aver-

    age number of hairs on all their heads. Should I store this value as a whole number
    or a real

    number?


    **Answer**: When you work out the result, you will find that the average has a
    fractional

    which means you should use a real number to store it.


    **Question**: I want to keep track of the price of a product in my program. How
    should I do it?

    **Answer**: This is actually very tricky. You might think that the price should
    be stored as a

    real number—for example, $1.50 (one and a half dollars). However, you could also
    store

    the price as the whole number, 150 cents. The type of number you use in a situation
    like

    dep on what you are using the number for. If you are just keeping track of the

    total amount of money you take selling in your product, you can use a whole number

    hold the price and the total. However, if you are also lending money to people
    to buy

    your product and you want to calculate the interest to charge them, you would
    need a

    fractional component to hold the number more precisely.'
