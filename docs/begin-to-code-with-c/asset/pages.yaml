  md: "If an object can do those two things, we don't really care what it is: we can\
    \ use it in our game. We can express these two abilities in the form of a C# interface:\n\
    \n```\ninterface IGameSprite // Name of the interface.\n{\n    void Reset(); //\
    \ Methods in the interface.\n    void Update();\n}\n```\n\nThis code creates an\
    \ interface named IGameSprite, which specifies the two methods that a class needs\
    \ to provide to be base in our game. Any class that contains Update and Reset\
    \ methods can tell the compiler that it implements the interface by adding the\
    \ interface name to the class name when it is declared:\n\n```\nabstract public\
    \ class MovingSprite : IGameSprite // Objects based on this class will contain\
    \ the methods in IGameSprite.\n{\n}\n```\n\nThis tells the compiler that the MovingSprite\
    \ class (and therefore any of its children) implements the IGameSprite interface.\
    \ It is a way of saying that objects in the hierarchy must contain a Reset and\
    \ Update method or the program will not be able to make an instance of that class.\
    \ Any class that wants to be treated like an IGameSprite can implement the interface.\
    \ A program can also create references of type IGameSprite, and the references\
    \ can refer to any class instance that implements the interface:\n\n```\nList<IGameSprite>\
    \ sprites = new List<IGameSprite>();\n```\n\nMy list of game objects is now a\
    \ list of IGameSprite objects—that is, things that update and reset. When the\
    \ program runs, it performs these actions on the objects irrespective of what\
    \ they are. All the background needs to add a Reset and an Update to her background\
    \ drawing classes, the compiler that the classes implement the IGameSprite interface,\
    \ and they can be used alongside the classes in our system. The interface has\
    \ defined precise ways in which completely different objects can interact.\n\n\
    Interfaces allow you to regard objects in terms of what they can do, not what\
    \ they are. They allow a lot more flexibility in program design. They allow you\
    \ to specify how how components can interact with each other and make it very\
    \ easy for us to swap one component for another, without the system complaining."
