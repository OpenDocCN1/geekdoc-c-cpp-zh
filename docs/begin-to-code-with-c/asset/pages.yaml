    # Using Visual Studio to follow the execution of your programs


    You can check your programs by working through them on your own, one line at a
    time, as we''ve done a couple of times before. But you can also use Visual Studio
    to view the actions of a program as it runs. To do this, use the Visual Studio
    debugger. As the name implies, the debugger is a tool that helps you find and
    remove bugs from your programs. You can use a debugger to track the path that
    your program is actually, rather than the one you think it is following.


    # Adding breakpoints


    We''ll start by adding a breakpoint to our program. A breakpoint doesn''t cause
    the program to break; it causes the program to "take a break". When a program
    reaches a statement designated as a breakpoint, Visual Studio pauses the program
    and hands control back to the programmer, who can then check that variable has
    the content that it should contain.


    A program can contain many breakpoints. The first breakpoint that the program
    reaches is the one that will pause the program. You can even set and remove breakpoints
    in any of your code or as the program is running. You can create a breakpoint
    in any of the samples that are part of the BeginToCodeWithCSharp solution.


