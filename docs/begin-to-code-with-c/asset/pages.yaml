  md: "# # Using the this reference when working with objects\n\nThe constructor method\
    \ for the Contact structure has a set of parameters that are passed into the method\
    \ when it's called. The names make it very easy to set the contents of a new Contact\
    \ structure value.\n\n```\nContact rob = new Contact(name: \"Rob\", address: \"\
    Rob's House\",\nphone: \"Rob's Phone\");\n```\n\nThe parameters to the constructor\
    \ are name, address, and phone, which makes sense. However, these are very similar\
    \ to the names of the members stored in the code, which are called ContactName,\
    \ ContactAddress, and ContactPhone. There is a danger that a developer might confuse\
    \ the constructor parameters and the members of the object and create a program\
    \ that doesn't work properly.\n\nIt would be useful if there was a way to use\
    \ variables that inside an object could explicitly specify when they are members\
    \ of the object. It turns out we can do this using a C# keyword that is confusingly\
    \ called this.\n\n```\npublic Contact(String address, string, string phone)\n\
    {\n  this.ContactName = name;\n  this.ContactAddress = address;\n  this.ContactPhone\
    \ = phone;\n  this.ContactMinutesSpent = 0;\n}\n```\n\nIn the preceding code,\
    \ the keyword this makes explicit that the members of the structure are being\
    \ initialized by the constructor parameters.\n\n# ## Broken constructor problems\n\
    \nThe best way to understand how this works is to take a look at a situation where\
    \ it is not used properly. The CupCake structure has been designed to hold cupcake\
    \ recipes for a baker. It holds the name, ingredients, and recipe."
  merge: -1
