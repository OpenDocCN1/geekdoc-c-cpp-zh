    # Get some pictures bouncing around the screen


    Now that you know how to scale images and position things on the screen, you can
    have some serious fun with images. You can slowly pan a sprite by moving it around
    the viewport, or zoom in by changing the size of the sprite. You can just make
    your brother''s friend''s bounce around the screen. There is a lot of fun to be
    by combining multi-ple images like this.


    # PROGRAMMER''S POINT


    Somewhat very simple behaviors need quite a bit of code


    Bouncing with that seems very simple. After all, if a rubber ball can bounce how
    hard can it be for a computer program? However, as you have seen, we actually
    have to do a fair bit of work to get the bouncing behavior to work correctly.
    Fortunately, modern computers perform thousands, if not millions, of such instructions
    every second, so it is not a problem for our game to repeatedly test the position
    of the ball and update the speed directions when required.


    # What you have learned


    In this chapter you have learned the fundamentals of computer games, what a game
    is, and how it actually runs. You''ve seen that a game works by repeatedly updating
    the objects that make up the game environment and redrawing these objects in'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'new positions. You have also discovered that the fundamental element of a two-dimensional
    game of the kind we are going to make (in which all the game objects are flat)
    the *sprite* and that a sprite is a container for an image that can be positioned
    and scaled by the game. Changes to the size and position of the sprite give the
    player impression of movement. The Snaps framework provide a game engine and we
    use `Sprite` class that can be used to manage sprites.


    You have also learned about how the coordinate system of computer displays works,
    with the origin (the point where the values of X and Y are 0) at the top-left
    corner of the screen. You now know that dimensions on a Windows display are expressed
    in pixels and that there are 96 pixels to the inch. This can lead to problems
    if a game is to run correctly on any range of devices, so you have also seen that
    there are Snaps methods that use ImageSprites so that their shape is preserved
    correctly.


    Finally, you have found out that playing around images and moving them around
    the screen is a lot of fun.


    Here are some questions that you might want to ponder about game development?


    # Do I really need a powerful computer to run these games?


    Not in my experience. The Snaps game engine has been tested on the most powerful
    Surface Book and also on a lowly seven-inch tablet. In both cases it seems to
    work fine. The key consideration is the number of sprites on the screen at any
    one time. It seems that the system can cope with up to 500, which is plenty for
    the kinds of games that we are going to write. The only device that does struggle
    with Snaps game engine is the Raspberry Pi device. Games actually run, but they
    update very slowly. This is due to the fact that at the time of writing, the embedded
    version of Windows 10 that runs on a Raspberry Pi does not support the graphics
    acceleration that is needed to provide a good update speed.


    # Do all game engines work like the Snaps game engine?


    The Snaps engine is massively simplified, and it actually runs on top of the graphical
    environment that underpins Windows Applications. It works as well as it is a tribute
    to the skill of many engineers. Most game engines are much more closely coupled
    to the underlying hardware, which means they can provide much, better performance.


    # This game development looks like fun. Where can I find a proper engine?


    My favorite C engine for writing games is called MonoGame. It is easy to learn
    and use, makes good use of the C# language, and can be used to write games for
    Windows 10, Android, and even Apple iOS. Once you have mastered the techniques
    in this book, I strongly advise you to look for MonoGame in your favorite search
    engine.'
