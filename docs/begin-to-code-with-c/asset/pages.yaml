    # MAKE SOMETHING HAPPEN


    # Display some pictures


    You can now make programs that display pictures. You can use the Delay method
    to provide a pause between each picture. You could add some sound effects and
    use buttons to let the user select the pictures they want to see. If you display
    text on the screen, you can use this to add captions to the pictures as they are
    displayed.


    # What you have learned


    In this chapter, you''ve learned that the C# if construction lets you change a
    program''s behavior depending on the data that it is given to work with. This
    allows a programmer to make software that might be considered "sensible" in that
    it can respond to input in a useful way.


    You also learned that the decision process in C# is based on the Boolean type,
    which allows programs to work with values that can only be true or false. C# conditions
    are controlled by the value of Boolean expressions, and the language provides
    a set of logical operators that can be used in programs to manipulate Boolean
    values. You can make things happen if two Boolean values are true by using the
    AND operator (&&). You can also make things happen if one or the other of two
    values is true by using the OR operator (||).


    You discovered how to write useful programs that work with logical conditions
    to create code that makes decisions. The best way to implement complex logic is
    to translate a plain description of the decision into C# conditional statements.
    For example, "If it is Saturday or Sunday or it is after 9:00 a.m., I must get
    out of bed" could be converted to a single logical expression that makes that
    decision.


    Finally, you have seen how to add and use assets in a program, making use of Visual
    Studio to manage the asset files and Snaps methods that let you use the images
    and'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'sound files. You have also seen how a unified resource locator string allows
    a program to load assets from the Internet.


    Here are some questions that you might like to ponder about the process of making
    decisions in programs:


    # Does the use of Boolean values mean that a program will always do the same given
    the same data inputs?


    It is very important, given that the same inputs, the computer does exactly the
    same each time. When the computer starts to behave in an inconsistent way, this
    makes it much less useful. When we random behavior from a computer (for example,
    when we are playing a game against a computer opponent), we have to obtain values
    that are explicitly random and make decisions based on those. Nobody wants a "moody"
    computer that changes its mind (although, of course, it might be fun to try and
    program by using random numbers).


    # Will the computer always do the right thing when we write programs that make
    decisions?


    It would be great if we could guarantee that the computer will always do the right
    thing. If something happens that the program was not expecting, this can cause
    it to do the wrong thing in response. For example, if a program was working out
    the cooking time for a bowl of soup and the user entered 10 servings rather than
    1, the program would set the cooking time to be too long (probably burn down the
    kitchen in the process). In that situation, you can blame the user (because he
    put in the wrong data), but there should probably also be a test in the program
    that checks to see whether the value entered was sensible. If the cooker can''t
    actually more than three servings, it would seem sensible to perform a test that
    limits the input to three. When you write a program, you need to anticipate what
    the user might do and create decisions that make your program behave sensibly
    in each situation.'
