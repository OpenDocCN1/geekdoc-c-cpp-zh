  md: "```\n{\n  SnapsEngine.StartGameEngine(fullScreen: false, framesPerSecond: 60);\n\
    \  while (true) {\n    SnapsEngine.DrawGamePage();\n  }\n}\n```\n\nA game can\
    \ run in full-screen mode or in a window on the display. The Start-GameEngine\
    \ method is given a Boolean value to select mode to use. The game engine is also\
    \ given the number of frames per second the game is to run at. If you run the\
    \ Ch12_01_EmptyGame Snaps application, you won't see anything on the screen just.\
    \ We'll add some objects to the screen in a moment.\n\n# CODE ANALYSIS\n\n# Frames\
    \ per second\n\nThe second parameter to the StartGameEngine method is the number\
    \ of frames per second that the game should aim to run.\n\n**Question:** What\
    \ do frames per second actually mean?\n\n**Answer:** The clue is in the name.\
    \ The frames-per-second value is the number of times the screen should be redrawn\
    \ each second. A game works by redrawing the entire screen at regular intervals.\
    \ Images on the screen appear to be moving because they are drawn at different\
    \ positions with each operation. If the time interval between successive redraws\
    \ increases, the images on the screen appear to move in larger steps, creating\
    \ a jerky display. Modern games usually try to run at 60 frames per second, although\
    \ this will vary depending on how many items are on the screen at one time. You\
    \ can experiment with this value to run and get a display that looks good to you.\
    \ I find that 60 is a good number to start with.\n\n# The game loop\n\nIf you\
    \ look at the code in **Ch12_01_EmptyGame**, you'll notice that it contains a\
    \ loop that will run forever but doesn't seem to do much."
