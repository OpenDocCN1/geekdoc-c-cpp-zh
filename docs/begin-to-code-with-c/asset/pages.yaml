    structures and classes that help encapsulate data into meaningful objects. In
    this chapter, you''ll expand your knowledge of object-oriented techniques by building
    a game. The techniques you''ll learn can be applied far beyond games, but games
    are very useful place to explore them.


    We''ll first look at inheritance, a technique that can save you from repeating
    code elements inside classes. Then we''ll explore how complex games can be created
