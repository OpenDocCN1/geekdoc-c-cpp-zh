  md: "# PROGRAMMER'S POINT\n\nHaving too many ideas can send you backward, not forward\n\
    \nI've spent a lot of time helping people write games. One of the most important\
    \ lessons that a budding game developer needs to learn is that ideas are not always\
    \ your best friends. When I'm chatting with teams that are developing games, I\
    \ often have a conversation that goes like this:\n\nME: \"How's the game coming\
    \ along?\"\n\nTEAM: \"It's going great, thanks. We just had a meeting, and we've\
    \ had six new ideas for the game. We're going to have rabbits with laser eyes,\
    \ flying monkeys, and deadly cheese. It's going to be great.\"\n\nME: \"How much\
    \ of the game you have actually got working?\"\n\nAt that point, I mark the team\
    \ as deorum and move on. The most important thing about writing a game (and many\
    \ other types of applications) is to get something working that you can build.\
    \ This way, you have a program that you can discuss and show people. If you keep\
    \ adding things to a game you're developing, all you do is increase the height\
    \ of the mountain you're trying to climb. Some point you start to feel badly about\
    \ made nothing so far, give up on that game, and start having ideas for the next\
    \ one.\n\nAdding features and behaviors doesn't always make an application better.\
    \ Some of the most popular games in the world are incredibly simple in design.\
    \ And anyway, if a player is having a great time playing a version of your game,\
    \ she is not going to care about the lack of laser-eyed rabbits you intended to\
    \ add. By all means ideas, and by all means write them down for, but once you\
    \ have an idea of what you are going to build, my advice is to get that going\
    \ and add to it.\n\nGiven we have different kinds of aliens, this is a good place\
    \ to think about class hierarchies. From discussions with your younger brother,\
    \ you've discovered that all of his ideas have a target (the rocket they are trying\
    \ to destroy) and they are either alive or dead. If we went and added a full set\
    \ of new alien sprite classes, we would repeat the target and status values for\
    \ each of these types. Furthermore, we need to separate lists for each alien type.\
    \ Instead, we can create an AlienSprite that holds the information and behaviors\
    \ that all aliens needs:\n\n```\npublic class AlienSprite : MovingSprite\n{\n\
    \    public bool AlienAlive = true;\n    public RocketSprite rocketValue;\n}\n\
    ```\n\n```\npublic AlienSprite(Sprite sprite, double xSpeed, double ySpeed,\n\
    \    RocketSprite target) :\n    base(sprite: sprite, xSpeed: xSpeed, ySpeed:\
    \ ySpeed)\n```\n\n![](img/547210b145d9948b1613255cf1ee9fa4_457_0.png)\n\nGames\
    \ and objects: Space Rockets in Space 433"
