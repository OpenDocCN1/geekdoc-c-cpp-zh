  md: '# Taking a look at ThrowDice


    There are some interesting questions raised by this look inside the Snaps framework.


    **Question:** Why is the SnapsEngine class marked as a partial class?


    **Answer:** Up until now, we have written all our classes as one single entity
    in the program file. However, C# lets you split the contents of a class across
    a large number of source files. If you do, each element of the class must be marked
    as partial to tell the compiler to assemble the whole class from the separate
    elements.


    Making parts of a partial has no effect on how the class works, but it can make
    it much easier for programmers to find their way around a very large program.
    Rather than having to look through lots of files to find the ThrowDice method,
    you just have to look through some files. It''s a good idea to do this for a class
    as large as the SnapsEngine class which provides all the Snaps behaviors.


    # The science of random-number generation


    Although you might not think so, computers are not very good at random behavior.
    The best that a program can do is start with a value (which is called the seed)
    and then apply some cunning calculations to number to produce the next number
    in the sequence. This process is repeated to provide each successive random value
    in turn. The Next method is therefore aptly named, in that it provides the next
    number in the sequence of random numbers managed by this random-number generator.
    This technology is called a pseudo-random generator because the numbers you get
    appear random, but they are actually completely predictable—as long as you know
    the seed value and the cunning calculations being used.


    At this point you might be asking yourself, "If the random-number generator can''t
    make random numbers, how does the random-number generator get the first number?"
    The answer is that it uses the system clock for the host computer, which is constantly
    updated many times a second. A program reads the time from the clock and uses
    this as the seed for the random-number generator. Each time a player runs the
    program, she gets a different sequence of random numbers.


    A program can also set a particular value as the seed for the random-number generator,
    like this:


    ```

    Random repeatable = new Random(1);

    ```'
