    build on the simple abilities of MovingSprite, which is what we will do.


    # Creating a FallingSprite based on a MovingSprite


    We want a star field based inside the game. The stars will fall continuously down
    the screen as the game is played, giving the impression of stars whirling past
    the viewport. When a star moves off the screen, it will place itself back at the
    top, for another pass down the screen. We can use this trick to make a rocket
    look like it is flying through a packed star field in fact we have a fixed number
    of stars that are making repeated passes down the screen.


    We create a FallingSprite to do the job for you. You can think of a FallingSprite
    as much like a MovingSprite, but when a FallingSprite gets to the bottom of the
    viewport, it moves back to the top at a random position and falls down the viewport.


    To create the FallingSprite, we will use a programming technique called inheritance,
    where a new type of object (a child) is created on an existing type (a parent).
    The child inherits all the behaviors and properties of the parent and can add
    new behaviors and customize existing ones as needed. This action is extending
    the parent class.


    > PROGRAMMER''S POINTS

    Inheritance is all about making things abstract


    It is important to understand what we are doing here. We have started with a fairly
    abstract idea of a "sprite that moves", and now we are making more-refined versions
    of this sprite to play specific rules in the game. A falling sprite is a specialized
    moving sprite that falls down the screen. The rocket sprite (when we create it)
    will be a specialized moving sprite that the player can steer around the screen.
    The alien sprite is a moving sprite that chases the player, and so on.


    The technique of inheritance works by making a fairly abstract parent class and
    creating classes that contain specific behaviors that fit the context of their
    use. In business, for example, if you would be building classes to implement a
    banking system, you would create a class called Account, which would hold all
    the general details of a bank account—like the name and address of the account
    holder and perhaps the balance value of the account. Then you would create more
    specialized child classes—such as checking account, credit'
  merge: -1
  pgno: 446
- img_proc: true
  md: 'card account, and mortgage account—that would contain the extra data and behaviors
    for their purposes. All of these accounts would use the core behaviors of the
    parent. If you find a bug in the code that makes the address of an account holder,
    you have to fix that bug only in the Account class, and all the child classes
    that use that behavior will be fixed as well.


    If you find yourself confused by some of the terms and explanations, just keep
    coming back to the reason why we are doing this. We want implement shared behaviors
    in a parent class and then each child class a set of behaviors that are specific
    to its purpose.


    Here is how you make a class that is a child of a parent. The child class is Falling-Sprite,
    and the parent class is MovingSprite. A FallingSprite can do all the things a
    MovingSprite can, if it has the extra functionality that returns it to the top
    of the screen when it falls off the bottom. This is why the FallingSprite extends
    its parent.


