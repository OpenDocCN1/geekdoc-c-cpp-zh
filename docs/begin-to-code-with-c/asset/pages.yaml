  md: "# Completing the program\n\nYou can implement the Downhill Mountain Run very\
    \ easily by using the same pattern as for the previous two rides. The final ride,\
    \ the Regurgitor, is more difficult. The ride is so extreme that the owner of\
    \ the fair is concerned for the health of people who use it and has a maximum\
    \ age restriction as well as a minimum age. The program must test users for those\
    \ who have an age greater than 70 as well as those with an age less than 12. We\
    \ have to design a sequence of controls to deal with this situation.\n\nThe code\
    \ that deals with the Regurgitor is the most complex piece of the program that\
    \ we have to write. To make sense of how it needs to work, you need to know about\
    \ the way that if constructions are used in programs. Consider the following code:\n\
    \n```\nif (ride == \"The Regurgitor\")\n{\n  // If we get here we are dealing\
    \ with the Regurgitor\n}\n```\n\nThe comment makes it clear that all the statements\
    \ we add inside this block will run only if the selected ride is the Regurgitor.\
    \ In other words, there is no need for any statement in block to ask the question,\
    \ \"Is the selected ride the Regurgitor?\" because the block is run only if this\
    \ is the case. The decisions leading up to a program determine determine the context\
    \ in which that statement will run. I like to add comments to make clear what\
    \ the content is, like this:\n\n```\nif (ride == \"The Regurgitor\")\n{\n  //\
    \ If we get here we are dealing with the Regurgitor\n  if (ageInt >= 12)\n  {\n\
    \    // If we get here the age is not too low\n    if (ageInt > 70)\n    {\n \
    \     // If we get here the age is too high\n      SnapsEngine.DisplayString(\"\
    I'm sorry. You are too old.\")\n    }\n    else\n    {\n      // If we get here\
    \ the age is in the correct range\n      SnapsEngine.DisplayString(\"You can go\
    \ on the ride\")\n    }\n  }\n}\n```"
