  md: '# What do the height and width values actually mean?


    We have been using numbers to specify the dimensions of our screen objects, and
    you may

    have noticed that, quite sensibly, when the numbers get bigger, the objects on
    the screen get

    bigger. But we need to consider just what these numbers mean and how they are
    used.


    **Question:** What do the size values actually mean?


    +   **Answer:** The position and size values are specified in pixels. In the first
    days of video

    games, a pixel exactly equal a single dot on the display. This would mean that
    the

    stretched ball image would be 400 dots wide and 100 dots high.

    Today, there are many different sizes and resolutions for displays, and it is
    not sensible to

    work in any order. On a Windows 10 display, a pixel is equal to around ninety-

    six of an inch, so the ball I showed earlier would be displayed slightly larger
    than an

    inch in size, irrespective of the type of display on the device that is running
    the program.


    If you intend to run your game on only one computer, you can use sprites that
    work for

    t display on that machine. However, if you want to make your game available for
    many

    users, perhaps via the Windows Store, you need to be sure that players get a good
    experience

    irrespective of the type of device they are using.


    A ball size around one inch would be perfect for a large-screen computer, but
    it would be

    a very bad idea for a small tablet PC or a Windows Mobile device. The way to solve
    this is to

    adapt the size of your sprites to fit the machine that the game is running on.


    # Adapting sprite size


    We want to make the game adapt to different screen sizes. Snaps provides you with

    properties that tell a program the dimensions of the viewport when using. You
    can think of a game as being drawn on an infinitely large space. The

    viewport is part of the space that is visible to the person playing the game.
    The

    t-left corner of this viewport is at coordinate 0,0, and the position of the bottom

    and the edge depends on the right of the viewport. Anything that is not

    visible in the viewport is not drawn.


    For a particular game, I might want the ball to be one-twentieth of the width
    of the

    viewport. The following statements use GameViewportWidth property to get the'
