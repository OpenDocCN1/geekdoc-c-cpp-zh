  md: '# Variables and computer storage


    For a program to be fully useful, it must be able to accept and work with data
    from an external source. Every time you press a key, the screen of your mobile
    phone, or move your mouse, you provide input to a program that is stored in a
    variable of some kind. Where is that variable stored?


    When a computer says "My computer has 16 gigabytes of RAM," what she is saying
    is the random access memory (RAM) in her computer contains a huge number (ten
    thousand) of individual memory locations, each of which can hold a tiny piece
    of data called a byte. Each memory location is numbered, and the computer can
    access any location at any time (which is why this is called random access memory).
    These memory locations are used to store the instructions given to the computer
    (the program) and the data that the program works on. As an example, when you
    use a word processor, some of the RAM in your computer is holding the word-processor
    program, and some of the RAM is holding the text being written.


    There is a difference between what is held in RAM and data stored on devices such
    as disks or drives. When you use a word processor, the program loads your document
    from the disk drive and copies it to RAM. When you save a document, it is copied
    from RAM back to the disk storage. Programs and data are held in RAM while you
    run them because that lets the data accessed extremely quickly. RAM is also volatile.
    When you exit a program or the computer is switched off, the contents of RAM are
    destroyed. (Later in this book, you''ll find out how to make a program store data
    on storage devices, but for now we are going to consider how programs can work
    with data held in RAM.)


    You can think of a variable as a location in memory that stores something the
    program is "thinking about." While a program is running, it works on the variables
    to generate a result, which the program outputs. Another way to think of a variable
    is as a "box with a name." In a program, the box is used to store stuff. The programmer
    provides a name for the variable and also specifies the kind of data (such as
    text or a number) that can be stored in.


    # Declaring a variable


    Let''s say we want to create a program that''s used to announce people who arrive
    at a posh party we are organizing. Using the program, each guest would enter his
    or her name. The person''s name would be stored in a variable defined in the program,
    and the program would then announce the person''s arrival by retrieving the variable'
