    **Question:** Does the using directive actually fetch the library that program
    wants to use?


    **Answer:** No. This might sound confusing, but the using directive tells the
    compiler where to look for the items that are available for use in a program.
    The resources available to a program are set up in the Visual Studio project.
    We can change the using directive to tell the compiler to use code from different
    places. This would be like telling the cook,"If you need to use some pastry, check
    the sink so that would use a resource from a different location.


    **Question:** If I add lots of using directives, will this make my program bigger?


    **Answer:** No. The directive just tells the compiler where to look for things.
    It doesn''t add anything to the size of the program.


