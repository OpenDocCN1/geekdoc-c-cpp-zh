    If you find this confusing, then consider it from the point of view of baking.
    You can think of the parent class as a cake, the child class as icing you put
    on the cake. We can''t have the icing on its; we have to have a cake to put the
    icing on. In the same way, constructing a FallingSprite must involve making MovingSprite
    first. We can do this by writing a constructor that creates a FallingSprite but
