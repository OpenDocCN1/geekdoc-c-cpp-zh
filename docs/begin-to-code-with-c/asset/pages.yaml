- img_proc: true
  md: '# PROGRAMMER''S POINT


    The way you store a variable depends on what you want to do with it


    It seems obvious that you would use a whole number to count the number of hairs
    on your head. However, one could argue that we could also use a whole number to
    represent the average number of hairs on 100 people''s heads. This is because
    the calculated average would be in the thousands, and fractions of a hair would
    not add much useful information. When you consider how you are going to represent
    data in a program, you have to take account how it it will be used.


    # C# whole number types


    As mentioned, whole numbers have no fractional part. They are frequently used
    in programs for counting things. Also, the value of a whole number is stored exactly
    by a computer program. In other words, every whole number is mapped into the computer''s
    memory in a way that perfectly preserves the value.


    When you use a whole number in a program, I intend to use the int type, which
    has a range up to 2,147,483,647. If the number is larger than this, I can use
    the long type, which has a range as large as 9,223,372,036,854,775,808. And if
    I want to count only as far as 32,767, I can use a type called short. All of these
    types have an equivalent negative range.


    Each type takes up a different amount of space in RAM. The long type takes up
    eight memory locations, whereas the short type takes up only two. In most of my
    C# programs I intend to use the int type because I am confident that I will never
    exceed its range.


    # WHAT COULD GO WRONG


    # Be careful that you don''t exceed the range of whole number types


    You might think that the computer would detect the range of a particular type
    is exceeded. In other words, you might expect a program to stop if it tries to
    put the value 32,768 into variable that is of short (which can store values only
    up to 32,767). However, this is not guaranteed to happen. You might find that
    the value in the variable becomes completely incorrect and the program continues
    on its way. This can lead to the most awful problems. The main reason I use the
    int type instead of the short type is that I can think of situations where I might
    want to store values that are more than 32,000, but it is very unlikely that I
    will exceed a value of 2,000,000,000.


    Working with numbers 81'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'When you are picking a type for a variable, it is important to consider the
    range of the type you are using. If you''re in doubt, pick a type with plenty
    of room. In a world where computers routinely have enormous amounts of RAM, it
    is unlikely that you need to save storage space by taking a risk with the size
    of the variable types you are using.


    # C# real number types


    Real number types have a fractional part, which is the part of the number after
    the decimal point. Real numbers are not always stored exactly. A particular real
    number is mapped to computer memory in a way that is as close as possible to the
    original. You can increase the accuracy of the storage process by using larger
    amounts of memory, but you are never able to hold all real values precisely.


    This is actually no problem. We are used to the fact that values such as pi never
    be held exactly because they "go on forever." (I''ve got a book that contains
    the value of pi to 11 decimal places, but I still cannot say that this is the
    exact value of pi. All I can say is the value in the book is many times as accurate
    as anyone will ever need.)


    When you create a variable to hold a whole number, you should start by considering
    how the variable will be used. Do the same thing when considering how to store
    real numbers in a program. Start by thinking about the range and precision that
    your application needs from the variable.


    Precision sets out how precisely the number is stored. As an example, C# provides
    a real number type called float that holds a number with seven digits of precision.
    A float variable could store 1234567 or 0.1234567, but it could not store 12345671234567
    because it does not have enough precision to hold 14 digits. The range of a real
    number type tells you the largest and smallest values that it can store. In the
    case of double, it holds a number with 38 digits (that''s a 1 followed by 38 zeros).


    If I want to store a value very precisely, I double gives me 15 or so digits of
    precision and is able to store numbers with over 300 digits. There is also a type
    called decimal, which has a lower range than double (it provides 28 digits of
    precision).


    Most of the time, float data type is enough accuracy for my needs. I would use
    double if my program was using a particular variable in calculations that would
    require millions of millions per second. In such a program, the float type would
    be unsuitable because calculation errors accumulate over time and become noticeable.
    I would use the decimal type if I was performing calculations on amounts of money.
    The high precision of the decimal type would be able to hold even very tiny amounts
    of interest accurately.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Variables are not perfect, but they are good enough


    You might think that your all-powerful computer should be able to hold all values
    precisely. It comes as a bit of a shock to discover that this is not true, and
    that a simple 10-digit pocket calculator can outperform your powerful PC.


    However, this lack of accuracy is not really a problem in programming because
    we usually have incoming data that is particularly precise anyway. For example,
    if I refine my hair-counting device to measure hair length, it would be very difficult
    for me to measure hair length with more than an inch of it (2.4 millimeters) of
    accuracy. This means that there is no point in storing hair in a variable of double
    because the data is simply not there in the first place.


    The important thing to remember is that with whole numbers, as well as real numbers,
    you should pick the type that you are going to use by considering what it will
    be used for.


    # Performing calculations


    You have seen how a program can manipulate strings by creating expressions that
    join them together. You can also create statements that contain expressions involving
    numbers. The expressions can be evaluated to produce a result, and you can use
    the result as you need in your program. Expressions can be as simple as a single
