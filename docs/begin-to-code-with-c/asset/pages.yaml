    # Using Windows local storage


    Up until now, the data in our programs has existed only while a program actually
    runs. As soon as the program stops, the data disappears. But to make the StoreContact
    method work, we need to store and retain data when the program stops so that it
    can be retrieved.


    The Windows 10 operating system provides local storage as a way to save data such
    as contact details. Windows assigns each application an area of local storage
    on the host device. You don''t need to know precisely how this works, but local
    storage provides a place where a program can store things. I created two Snaps
    methods that deal with local storage. One saves a string in local storage, and
    the other fetches it back.


    The Snaps method SaveStringToLocalStorage gives in two parameters. The name of
    the item to be stored, and the other is the actual string of text to be stored.


    | Item to be stored. |

    | SnapsEngine.SaveStringToLocalStorage(itemName:"password", itemValue:"12345")
    | |


    ![](img/547210b145d9948b1613255cf1ee9fa4_253_0.png)


    This would call the string "12345" in a location named "password". To get the
    password back from local storage, you would use FetchStringFromLocalStorage:


    ```

    string myPassword = SnapsEngine.FetchStringFromLocalStorage(itemName:"password");

    ```


    When the FetchStringFromLocalStorage method runs, Windows finds the "password"
    item in local storage and returns the contents of that item. This would result
    in the variable myPassword being set to 12345.'
