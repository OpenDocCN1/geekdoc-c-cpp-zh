  md: '# Simple assignment statements


    After a variable is declared, a program can give a variable value. Here''s an
    example:


    ![](img/547210b145d9948b1613255cf1ee9fa4_97_0.png)


    This type of statement is called an assignment. The variable on the left is assigned
    the value on the right. The result of a program running this statement is that
    the variable guestName would be made to hold the string "Rob".


    The equal sign between the variable and the value is not performing a comparison.
    Instead, it says that we want to make the variable on the left equal to the value
    on the right. I call this a *gozilla* operation, in that the value "goes into"
    the destination on the left.


    Assignment statements are a very important part of a program. Whenever a program
    is processing data, it does so by assigning values to variables. We will take
    a more detailed look at assignments later in the book.


    > WHAT COULD GO WRONG


    # Assignment issues


    An assignment statement is how a program gives a value to a variable. However,
    things can go wrong, and here are a few ways in which assignments can fail:


    ```

    newKidInTown = "Nowhere";

    ```


    This is a perfectly legal statement, as long as the variable newKidInTown has
    been declared. If it has not been declared, the compiler will generate an error.
    In C#, you must declare a variable if you are going to assign a value to it.


