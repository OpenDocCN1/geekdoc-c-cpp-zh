  md: '# Bug swatting


    The Pizza Picker program needs an if statement to test for each topping type.
    If I asked you to write this program, you might write the first statement, like
    the preceding one, and then copy that block of code to set the other condition
    tests. However, copying blocks of code like this can be dangerous. Take a look
    at this code:


    ```

    if (toppingChoice == "Cheese and Tomato")n  cheeseAndTomatoCount = cheeseAndTomatoCount
    + 1;


    if (toppingChoice == "Pepperoni")n  pepperoniCount = pepperoniCount + 1;


    if (toppingChoice == "Chicken")n  chickenCount = chickenCount + 1;


    if (toppingChoice == "Vegetarian")n  vegetarianCount = vegetarianCount + 1;

    ```


    The programmer who wrote this code is proud of how quickly he managed to write
    the program, but it contains a serious problem—which means that users will hate
    it. A bug being in a program that makes it do the wrong thing (One story is that
    the first time the term "bug" was used, an insect had flown into the circuitry
    of an early computer and caused it to fail. The programmer proudly wrote in her
    laboratory log book that he''d found a bug in the program, and the name stuck.)


    Question: Can you find the bug?


    Answer: The bug is in the very last statement. Rather than incrementing the vegetarian
    counter, the program sets the number of chicken pizzas plus 1. Depending on who
    you are, this could mean that you get a lot more or a few vegetarian pizzas than
    you expect.


    Question: How would you find the bug?


    Answer: The only way to spot this bug is to methodically work through the options
    and check the values each time you add to one of them. If you never added a vegetarian
    pizza during testing, you''ll never know that the program contains a bug. This
    is another cause of bugs: the programmer knows exactly what the code is supposed
    to do, but he made a typing mistake when he entered the code. But since he knows
    what the code is supposed to do, he assumes the code is perfect and doesn''t bother
    testing all the possibilities.'
