  md: "```\n{\n  public int XValue;\n  public int YValue;\n\n  public SnapsCoordinate(int\
    \ x, int y) {\n    XValue = x;\n    YValue = y;\n  }\n}\n```\n\nI'll say more\
    \ about the namespace keyword later, when we start creating large programs. Now,\
