    \    {\n        SnapsEngine.PickImage();\n    }\n}\n```\n\n# What you have learned\n\
    \nIn this chapter you've learned how to design and create new data types that\
    \ act as containers for a number of members. These new types can as data types\
    \ that are built into the C# language. Programs can create variables of these\
    \ new types—for example, descriptions of musical notes—and these variables can\
    \ be passed into methods and returned as the result of a method call. A structure\
    \ can have a constructor method that is used to create a new structure and set\
    \ the initial values of members inside the structure.\n\nThe data members inside\
    \ a structure can be accessed individually, and they can also be made private\
    \ or public. Public data members can be used by program code outside the structure.\
    \ Making data public means programs can have easy access to the contents of a\
    \ structure, but it also means that the structure cannot control the content of\
    \ the values it holds. A program can contain arrays of structure values, which\
    \ can be preset inside the program. The structures themselves can also contain\
    \ methods that allow a structure to perform actions when requested.\n\nYou've\
    \ seen seen how the data required to represent graphical coordinates, colors,\
    \ and even musical notes can be stored inside a single object. These structures\
    \ can also"
