    # PROGRAMMER''S POINT


    # Sprites and graphics are not just for games anymore


    If you are reading this part of the book and wondering why I''m telling you how
    to make a game when all you want to do is write useful applications, I''d advise
    you to keep reading. Modern applications contain a lot of behaviors that are very
    close to game elements. We have a generation of computer users who have grown
    up playing games, so they expect that the systems they use have the same slick
    graphics and animation as the games they play.


    While you, as a programmer, might not be expected to design these graphics, you
    still need to have a good understanding of how game-like behavior can be used
    to enhance your experience. And besides, it''s a lot of fun.


    # The Snaps ImageSprite class


    Now that we have an image file in our project, we need to attach it to a software
    object that will manage the image within the game. By now you should be familiar
    with the idea that a programmer can create a software object to represent things
    that their program will work with. We have created and used objects to represent
    musical notes and address books contacts, to name just two.


    Our games have a sprite on the screen that can display an image. I created an
    Image-Sprite class that will represent an image on the screen. In your programs,
    you can create a new ImageSprite instance at any time.


    ```

    ImageSprite ball = new ImageSprite(imageURL: "ms-appx:///Images/ball.png");

    ```


    There is a constructor for the ImageSprite class that accepts a single parameter,
    which is a string giving the location of the image to be displayed by the sprite.
    Once this statement has completed, it has created a reference named ball that
    refers to an ImageSprite instance that will produce the ball image when drawn
    in the game. The ball on its will will not do much—it has to be added to the game
    engine so that it can be displayed. The game acts as a container for all the sprites
    and manages how when they are drawn on the screen.


    If you''d rather make sprites in your games from images on the Internet, you can
    do this:'
