- img_proc: true
  md: "# **Question:** How do we prevent this corruption of the minutes value?\n\n\
    **Answer:** One way is to modify the AddMutes method so that it updates the contact-MinutesSpent\
    \ value only if the value being added is positive.\n\n```\npublic void AddMutes(int\
    \ timeValue)\n{\n    if(timeValue > 0)\n        contactMinutesSpent = contactMinutesSpent\
    \ + timeValue;\n}\n```\n\nThis version of the method contains a condition that\
    \ tests the value of the parameter and adds the time value only if the value being\
    \ added is greater than 0.\n\n# **PROGRAMMER'S POINT**\nYou need to think of errors\
    \ in the context of risk\n\nYou can use public and private C# features to control\
    \ what happens to a data member in an object, but you need to consider the broader\
    \ implications of their use. It might seem very sensible to protect data in the\
    \ way that you have just seen, but consider what would happen if the lawyer entered\
    \ a minutes value that was extraordinarily large, perhaps because of problems\
    \ with the keyboard. If the program was designed to prevent the minutes value\
    \ for a customer only from being reduced, there would be no way to fix this problem.\n\
    \nThis is all about managing risk. There is a risk that the user might enter an\
    \ invalid value, and there is also a risk that the application might attempt to\
    \ set the value incorrectly. As a developer, you need to consider the impact of\
    \ these events and act accordingly. This means asking the lawyer \"What's the\
    \ longest meeting you could have?\" and then setting upper limits on the size\
    \ of a session. It also means asking the \"How much effort do you want me to put\
    \ into making sure that rogue programs can't damage this data?\" The lawyer may\
    \ be that this data is protected, but she will also be keen on getting her program\
    \ written for the best possible cost.\n\nYou must also think about the ethical\
    \ responsibility of a programmer towards his or her customers, which is a bit\
    \ beyond the scope of this programming book but is something you really should\
