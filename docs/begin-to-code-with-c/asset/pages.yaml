  md: '# Displaying text in a game


    Any game needs to display text messages. The Snaps framework provides a special
    kind of sprite that can be used to display text.


    ```

    TextBlockSprite tinyTextSprite = new TextBlockSprite(

    text: "Hello. My Tiny Text in the default font",

    fontSize: 20,

    color: SnapsColor.Blue);


    SnapsEngine.AddSpriteToGame(tinyTextSprite);

    ```


    ![](img/547210b145d9948b1613255cf1ee9fa4_427_0.png)


    You can use a TextSprite everywhere you can use an ImageSprite. The major difference
    between text and image sprites is how their size is. For an image sprite, you
    set the width and height values, but for a TextSprite you have to use the FontSize
    setting when the sprite is created. The FontSize value is the height of the font
    in pixels. In this case, the height means the distance between the tallest character
    (perhaps the top of an A) and the bottom of the lowest character (perhaps the
    bottom of a g). Usually text is drawn and try to get types that look right.


    If you don''t specify a family name, text is drawn using the default font, which
    is Segoe UI. I like this font, but if you prefer a different one you can add a
