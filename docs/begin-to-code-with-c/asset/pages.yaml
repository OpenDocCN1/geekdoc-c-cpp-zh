    # The Snaps gamepad


    The Snaps framework provides methods that can be used to get the status of a "gamepad"
    that is managed by the Snaps game engine. To control the game, players can work
    with the Snaps gamepad in a variety of ways—with the keyboard, the touch-, a mouse,
    or even an Xbox One or Xbox 360 controller.


    The Snaps gamepad can detect five actions—Left, Right, Up, Down, and Fire. The
    directions are mapped to the arrow keys on your keyboard, and the fire action
    is mapped to the Spacebar. If you are using a controller, the directions are mapped
    to the d-pad, and the fire action is the A button.


    When the game is running, an on-screen gamepad is also displayed for mouse and
    touchscreen, as shown in **Figure 13-2**. You can activate the panels by resting
    the mouse pointer on the one that you want to trigger or by touching a panel on
    your touchscreen if you have one.


    ![](img/547210b145d9948b1613255cf1ee9fa4_421_0.png)


    **Figure 13-2** The on-screen gamepad.


    The game can read the settings of the Snaps gamepad and update the objects in
    the game appropriately. For example, the XPaddleSpeed variable holds the speed
    that the paddle moves when the player moves it. I''ve made it 15 in the following
    statement, which is quite a bit faster than the corresponding ball speed of 10.
    This is because it gives the player a chance to catch up with the ball. The closer
    this speed is to the speed of the ball, the more skillful the player must be.


    ```

    double XPaddleSpeed = 15;

    ```


    Of course, if you make the paddle move more than the ball, the game becomes unplayable
    because the player will never be able to catch up with the ball. This is a rather
    nasty thing to do to a player, but it might be fun to try.'
