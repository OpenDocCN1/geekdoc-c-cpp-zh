  md: "You write code for a task like this by creating a block of statements braces.\
    \ A block of statements is a sequence of C# statements enclosed in a pair of curly\
    \ braces—the { and } characters. You have already seen blocks of statements in\
    \ the programs we've examined and written; in those programs, the statements in\
    \ the StartProgram method are enclosed in a block. You can create a block anywhere\
    \ in a program, and it is equivalent to a single statement.\n\n```\nusing SnapsLibrary;\n\
    class Ch05_09_ColorfulGreeter\n{\n    public void StartProgram()\n    {\n    \
    \    string name;\n        name = SnapsEngine.ReadLine(\"What is your name?\"\
    );\n        string upperCaseName = name.ToUpper();\n        if (upperCaseName\
    \ == \"ROB\")\n        {\n            string dayOfWeek = SnapsEngine.GetDayOfWeekName();\n\
    \            string fullMessage = \"Hello Rob. Hope you are having a great \"\
    \ + dayOfWeek;\n            SnapsEngine.SetTextColor(SnapsColor.Blue);\n     \
    \       SnapsEngine.DisplayString(fullMessage);\n        }\n    }\n}\n```\n\n\
    This program will recognize you by name and display an uplifting message in your\
    \ favorite color. All the statements in the block are controlled by the single\
    \ condition defined in the if construction.\n\n# Local variables in blocks of\
    \ code\n\nIf you take a look at the ColorfulGreeter program, you'll notice that\
    \ the variables dayOfWeek and fullMessage are declared inside the block of code\
    \ controlled by the if condition. C# programmers say these variables are local\
    \ to this block of code, which means that these variables exist only inside this\
    \ block. Once the last statement in the block has completed and the program has\
    \ moved out of the block of statements controlled by the if condition, two variables\
    \ are discarded automatically. If the program reenters the block at a later time,\
    \ the variables will be created again. The part of a program within which it's\
    \ valid to use a particular variable is called the scope of that variable."
