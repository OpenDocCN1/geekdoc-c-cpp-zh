  md: 'that are passed data to tell them what to do. For example, the SpeakString
    method is given the text of the string that is to be spoken.


    Here are some questions you might like to ponder programs, statements, and compilers.


    # Does the user of the program need to have a copy of Visual Studio to run the
    program?


    No. Visual Studio can produce a program file that users can run without Visual
    Studio.


    # Do I have to know how every Visual Studio command works?


    No. You can get along by working with just a few of the buttons to start with.
    You will discover more features as you go through the book.


    # Is the compiler incompetent it is confused by invalid program code?


    You might think that the compiler is a silly bit, sometimes it does things like
    complain when it has seen the wrong character. You would be forgiven for wondering
    why the compiler does not substitute the right character and keep going. However,
    it turns out there is a very good reason for the compiler not to do this. If the
    compiler inserts that it thinks is missing, it is making an assumption about you,
    the programmer, were actually trying to do. We have already seen that assumptions
    are dangerous. It is much safer for the compiler to insist that you express exactly
    and completely what you want to the program.


    # Can any C# method accept any number of things to tell it what to do?


    No. Each method is custom-made to accept a specific set of information. The Delay
    method needs to be told how many seconds to delay. The SpeakString method needs
    a string of text to speak. The compiler knows what a method was built to accept,
    and it will feed only that kind of data into it. If you attempt to feed a string
    Delay, the program will not compile.


    # Are the statements in a program always performed in the order they are written
    in the program?


    Yes. You can think of a program as a story or a sequence of instructions. It would
    be meaningless for the steps to be performed in any order other than the one that
    has been set out.


    # Are the Snaps part of the C# language?


    No. The Snaps library and these methods have been provided to help you learn how
    to program and create simple applications. They are not part of C#, but they were
    created with C#. You will learn about other library classes and methods supplied
    with C# a little later in the book.'
