  md: '# Using a loop to make a pizza picker


    The Pizza Picker will be the first program we make that we can actually think
    about selling the public. You can use it when a group you''re with wants to order
    some pizzas. With this program, a user presses a button to select a piece of pizza
    with a particular topping. The program keeps count of how often each button is
    pressed and displays the totals on request. This program will also work on a Windows
    Mobile device, so you could pass your device around and get each person to tap
    the button that identifies he or she wants. Figure 6-1 shows what the program''s
    main menu will look like.


    # Select Pizza


    ![](img/547210b145d9948b1613255cf1ee9fa4_160_0.png)


    **Figure 6-1** The Pizza Picker.


    Each time a user presses a button, the count for that type of topping is increased.
    Then, the user can press the **Show Totals** button to see how many portions for
    each topping have been ordered. We''ll build the Pizza Picker program in two stages.
    We''ll start by writing the code that counts one-topping selection. After that,
    we''ll add a loop so that the program can accept multiple selections. As we build
    the program, you''ll get a chance to use some of the C# constructions you''ve
    learned about in earlier chapters.


    # Counting selections


    If you think about it, the Pizza Picker''s menu shown in **Figure 6-1** tells
    us the first thing we need to do in this program. We need a variable for each
    pizza topping that counts the number of requests for topping. The following statements
    create four `int` variables, with sensibly named identifiers, and set each of
    the variables to the value 0.


    ```

    int cheeseAndTomatoCount = 0;

    int pepperoniCount = 0;

    ```'
