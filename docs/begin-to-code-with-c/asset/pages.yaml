    # Classes and objects


    **Question:** Is a class definition the only way to define an object?


    **Answer:** No. There are other kinds of C# objects, which you will see later.


    **Question:** Defining a class actually create an object?


    **Answer:** Think of the class as the blueprint or design of an object, just like
    you might have plans for a treehouse. In the same way as having the plans for
    a treehouse doesn''t actually give you a treehouse, having a class definition
