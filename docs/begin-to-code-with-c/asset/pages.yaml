    - 2 produces 4.

    - 3 produces 6.

    - 0 produces 0.


    From these results I think that we can deduce the behavior of the program is to
    take the number coming in and double it.


    Programmers call this form of program examination *black-box testing*. The program
    is being treated as a black box that we can''t look inside of. Input values are
    fed into the black box, and the outputs are checked to see whether they match
    what we think the program should do.


    The idea behind black-box testing is to build confidence that the program actually
    does what we want. If someone offered to pay us large sums of money to produce
    a program that would double the value of the number that was entered, from the
    tests we have performed looks like we have something there that do the job.


    The tests we''ve seen some fairly convincing, but there is no way that we can
    be sure that the program always produces an output that is double the input unless
    we try every possible number. This illustrates a problem with this form of testing:
    it can prove that there is a fault in the program, but it can''t prove the absence
    of faults.


