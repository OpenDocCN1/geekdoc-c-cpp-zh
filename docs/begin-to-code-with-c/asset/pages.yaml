  md: '# What you have learned


    In this chapter, you have learned the difference between structures, which are
    managed by value, and classes, which are managed by reference. You know that when
    using a value type, all the data in a variable is copied from one object to another
    when assignment takes places, whereas working with references, an assignment will
    cause two references to the same object.


    You have seen you can use value types to hold specific values at a particular
    object—for example, the position of a space alien in a game. You have also seen
    how reference types make it easy for programs with very large objects without
    having to move around them in memory—for example, a reference to a very large
    object that holds all the bank account information for a customer or an image
    to be shared by many elements in a computer game.


    You have also discovered the List class, which is a part of set of resources that
    are supplied alongside the C# language. List works with references to provide
    a much flexible way of storing objects arrays. You have seen how C# namespaces
    allow programmers to give unique names to the objects that they create, and how
    the List class is part of the Collections namespace.


    Finally, you saw how JSON serialization makes it easy to convert a list of objects
    into a string of text that can be easily stored on the computer and how XML works
    in a simple way to encode and transfer data.


    Here are some questions that you might like to ponder:


    # Is it possible to write programs without using references?


    References are one of the hardest things to understand when you are writing programs.
    At least I found them to be that way. It is tempting to "stay with what you know"
    and try to write everything using structures. This is possible, but you will find
    that your programs are harder to understand and sometimes slower and larger than
    what they need to be. Both references and value types have their place, and you
    need to understand how and when are to be used. Think of a value as being something
    "about" an object—for example, the amount of money that is in a bank account.
    Think of reference as pointing to something that you''d not move around or something
    you want to share—for example, a large sound effect that is being used for the
    engine noise by many different spaceships in a game. If you make explicit choices
    during the design stage of your application, you will find that these are much
    easier to understand.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Does a namespace affect where your program files are stored?


    A namespace is a "space where names have meaning." In this way, you can think
    of it as being structured like a file store, where every file has a unique path
    that can be used to locate the file on a physical storage system somewhere. However,
    a name in a namespace is not physical. It is logical that it exists only in the
    mind of the programmer and the C# compiler. Elements in a namespace can be across
    many files in a C# application. We use namespaces to organize how we identify
    things, not precisely where they are stored on a disk. It is important to start
    thinking about in terms of their physical and logical properties when you create
    systems. A telephone has a physical number that is hard-wired into the circuitry,
    but we prefer to refer to a particular telephone as "Dad’s phone" rather than
    "0121 23432 3983". To make this work, the telephone contains a layer of software
    that looks up the physical number of "Dad’s phone" whenever we need to call it.
    In the same way, the C# compiler will search all the C# source files and libraries
    to find a class from a particular namespace. As a programmer, you don''t have
    to know precisely where the code lives, you just have to use the logical name
    of the item you want to work with.


    # Can writing software really make you rich and famous?


    Yes. We all know about Bill Gates and Mark Zuckerberg, who have built empires
    starting with their software crafts, but there are also a lot of people who have
    achieved fame and fortune from their code-writing skills. Many systems that we
    use every day by millions of companies have their roots in software that was written
    by "ordinary" developers who started coding at home and gave their software away.
    One of the best ways to start making a name for yourself is by contributing to
    an开源 project run by volunteers. This might not lead to riches, but it is a great
    way to practice and start to make a name for yourself. After all, you don''t need
    everyone to recognize your genius, just the person who will give you that job
    you really want.'
  merge: -1
  pgno: 359
