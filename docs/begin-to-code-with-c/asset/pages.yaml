    Because of the way computers hold data, another layer understands the mapping
    of numbers to letters. Each number is held by the computer as a unique pattern
    of on and off signals, or 0s and 1s. In the realm of computing, each 1 or 0 is
    a *bit*. (For a wonderful explanation of how computers operate at this level and
    of how these working form the basis for all coding, see Charles Petzold''s *Code:
    The Hidden Language of Computer Hardware and Software.*) The value 87, which we
    know as “uppercase W,” is held as the following pattern:


    ```

