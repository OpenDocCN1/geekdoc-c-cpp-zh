    \ to the game or make it completely silent. You can change the way the game works\
    \ so that you have to capture falling raindrops while being chased by an angry\
    \ wasp.\n\n# Interfaces and components\n\nIn the Space Rockets in Space game,\
    \ all the sprites are based on the MovingSprite type and all the objects on the\
    \ screen are held in a list of sprites.\n\n```\nList<MovingSprite> sprites = new\
    \ List<MovingSprite>();\n```\n\nThe list contains references to the stars, aliens,\
    \ rockets, and missiles. This works because MovingSprite is the parent for all\
    \ these object types and a MovingSprite reference can refer to any of them. Each\
