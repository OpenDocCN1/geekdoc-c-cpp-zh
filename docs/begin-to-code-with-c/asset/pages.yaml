  md: '# Starting with variables


    The programs we''ve worked with until now used data that was built in. For example,
    the following statement takes data (the text "Hello world") and then does something
    with it—in case, converting it to words the computer speaks.


    ```

    SnapsEngine.SpeakString("Hello world");

    ```


    Lots of programs have data built in this way—a video game, for example, includes
    images and sounds alongside the program code. This data comes from values that
    are "hard wired" into the program''s code. These values are known as *literals*.


    Literal values are fine for the fixed data in a program, but you need to do something
    if you want your code to be flexible. To change a literal in a program, you have
    to change the actual code ("Hello world") to the new message you want, for example)
    and then recompile the program. To make your code more flexible, use variables.
    Variables accept input from the user, and the program can then work with input.


    ![](img/547210b145d9948b1613255cf1ee9fa4_94_0.png)


    CODE ANALYSIS


    # Literal values


    **Question:** What is the literal value in the statement SnapsEngine.SpeakString("Hello
    world");?


    **Answer:** The literal value is the string "Hello world".


    **Question:** Is the method named SpeakString a literal value?


    **Answer:** No. To understand why, consider the difference between the code in
    a program that provides instructions (things that do the work) and the data in
    a program (things that the work is done on). SpeakString is the identifier of
    a method that enables the computer to speak a text string. "Hello world" is the
    literal string of text that we want the program to speak.


    **Question:** Are strings the only kind of literal values?


    **Answer:** No. Later in this chapter, you will learn about numeric literal values.'
