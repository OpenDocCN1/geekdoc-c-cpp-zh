  md: '# # What makes a method?


    A method is a block of C# code that you give a name to. When the C# compiler finds
    a method, it takes the statements that define the method and stores them away,
    ready for use. Take a look at the declaration of the StartProgram method that
    was examined in Chapter 3. The declaration of a method is also known as the method''s
    header. Compare it to Figure 8-1, which describes the general structure of a method''s
    header.


    ```

    public void StartProgram()

    ```


    | public | void | 0 |

    | --- | --- | --- |

    | method | StartProgram | parameters |

    | modifier | return type |


    **Figure 8-1** The structure of a method header.


    Let''s examine these elements in turn:


    The *method modifier* public means that the method is available outside the class
    in it''s declared. You make methods in a class public when you want programs outside
    the class to be able to use them. The StartProgram method must be public because
    it needs to be called to start the program running. (If the StartProgram method
    were not visible outside the class, there would be no way to start the program.)
    Later in the book, we will look at how a programmer can control the level of access
    to methods and other elements in a class.


    The method''s *return type* is identified as void in this case. This means that
    the method doesn''t return any information when it is called. Some methods return
    values, while others just perform a task—the StartProgram method is one that performs
    a task. The Snaps ThrowDice method is an example of a method that returns a value.
    In this example, you can see how ThrowDice is declared as a method that returns
    an integer value—the void has been replaced with the type int to indicate this.


    ```

    public int ThrowDice()

    ```


    The *method identifier* is the name given to the method. Methods are often named
    as verbs because they describe an action that the method will perform.'
  merge: -1
