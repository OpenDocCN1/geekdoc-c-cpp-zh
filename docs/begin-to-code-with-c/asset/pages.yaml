  md: 'The JSON conversion process creates a string that contains the value of each
    the members of the class, identifying the values by the names of the class members.
    The curly brackets ({ and }) mark the start and end of the object, and the double
    quotation marks ('''') mark the start and end of the names of each member of the
    class and the strings that form part of the data. Note that the ContactMinutesSpent
    member, which is a number, is stored as an integer value rather than a string
    of text.


    # WHAT COULD GO WRONG


    # Data and special characters


    You might wonder what happens if the data you are storing double quotation marks
    or curly characters itself. The designers of JSON thought of this too. If you
    look at the following JSON, you can see that the address string "House of Quotes",
    the quotation mark characters are preceded by an escape character\"


    ```

    "ContactName":"Rob"

    "ContactAddress":"\"House of Quotes\""

    "ContactPhone":"Rob''s Phone","ContactMinutesSpent":0

    ```


    This is the same technique that''s used in writing a program in which you want
    to include a double quotation mark inside a string. We can allow users of the
    Time Tracker to include any strange characters that they like, and these are always
    converted into safe versions.


    > PROGRAMMER''S POINT

    Be aware of the possibility of injection attacks

    So-called injection attacks occur when special characters like these are injected
    into program inputs. These attacks have resulted in many security breaches over
    the years. Whenever you create a solution that uses characters that have a special
    meaning, you must ensure that the solution can handle these characters if they
    appear in the data the program is processing.


    # The Newtonsoft JSON library


    Now that you know a bit about how JSON works, you need to find a way of converting
    program objects into JSON strings. It turns out there is a library of classes
    that will'
