    # WHAT COULD GO WRONG


    # Duplicate names


    There is actually a serious bug in the system that we created. It is possible
    to create a new contact with the same name as an existing one. And because the
    “duplicate” contact will be stored further down the array than the original one,
    it will never be used. The program will always find the original contact. This
    will result in one of elements being wasted. You might like to consider how you
    could modify the program so that it doesn''t have this problem.


    # PROGRAMMER''S POINT


    Look for problems when you are defining the specification


    When you talk to the lawyer about the Time Tracker application, there is no guarantee
    that problems such as duplicate contact names will be discussed. It is the job
    of the programmer to create the ways system can go wrong and add the extras to
    deal with these. There are a number of different ways to handle duplicate account
    names. You could rename to create “Rob Miles” and so on. You could make the system
    ask “Are you Rob Miles Huli?” when searching for an account, or you could create
    a contact that is unique for each contact. Giving items in a system a unique name
    means that they can be managed more precisely and also can be used to handle situations
    where the name of an item might change.


    You need to figure how the lawyer wants to handle the problem. The worst thing
    you can do in a situation like this is to assume what the customer would like
    the system to do. This will almost mean your solution will behave incorrectly
    when things goes wrong.


    Of course, you must also make sure that your system can manage the situation when
    your solution fails. Using a unique number for each contact is a great idea, but
    you will also need to add a way of dealing with the situation when the lawyer
    forgets the number for a particular contact.'
