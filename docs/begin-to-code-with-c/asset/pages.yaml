  md: '# Boolean expressions


    **Question:** What does the > character mean?


    **Answer:** If you''ve done any math in school, you''ll be familiar with the >
    character. It means greater than. In the same way that the + operator adds two
    operands together and returns their sum, the > operator compares two values and
    returns true if the value on the left of the operator is greater than the value
    on the right.


    **Question:** Why is the test "greater than 6" rather than "greater than 7"


    **Answer:** We used this because we need up to 7. Therefore, the expression must
    evaluate to true when hourValue is 7. If we used the "greater than 7," the expression
    would not become true until the hour value reached 8 (because 7 is not greater
    than 7).


    I think the best way to test your Boolean expressions is to say them out, replacing
    the variable with the actual value. If you say that the result of the expression
    would be true if "7" is greater than 7," you can tell it that it is wrong because
    it sounds wrong. Of course, it comes out that I''m in favor of software bugs that
    let me an extra hour in bed.


    **Question:** Can a program compare real numbers as well as wholes?


    **Answer:** Yes. For example, the greater-than (>) operator will work between
    two float values.


    **Question:** How would I make a test to determine whether I can stay in bed?


    **Answer:** C# provides a logical operator "less than" (<) that can be used to
    perform this test.


    ```

    bool ICanStayInBed = hourValue < 7;

    ```


