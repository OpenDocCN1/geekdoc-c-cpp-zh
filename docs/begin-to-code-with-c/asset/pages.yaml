- img_proc: true
  md: "```\npublic struct SongNote\n{\n    public int NotePitch;\n    public double\
    \ NoteDuration;\n}\n```\n\nThis is how we created and set up our first SongNote\
    \ value:\n\n```\nSongNote note\nnote.NotePitch = 0;\nnote.NoteDuration = 0.4;\n\
    ```\n\n![](img/547210b145d9948b1613255cf1ee9fa4_289_0.png)\n\nThe note is declared,\
    \ and the values in it are set. However, the fact that these values have been\
    \ marked with public means they can be changed by the program at any point in\
    \ the future. In the case of a SongNote, this is probably not a problem; it just\
    \ means that a nasty programmer could make a tune sound wrong. However, if we\
    \ were writing a program for a bank, it would be much more dangerous if programmers\
    \ were able to change the amount of money in account.\n\nThe C# language lets\
    \ you mark members of a structure as private. A private member of a structure\
    \ is not visible to code running outside the structure:\n\n```\npublic struct\
    \ SongNote\n{\n    private int notePitch;\n    private double noteDuration;\n\n\
    \    public void Play () {\n        SnapsEngine.PlayNote(notePitch, noteDuration);\n\
    \    }\n\n    public SongNote(int pitch, double duration) {\n        notePitch\
    \ = pitch;\n        noteDuration = duration;\n    }\n}\n```\n\n![](img/547210b145d9948b1613255cf1ee9fa4_289_1.png)\n\
    \n![](img/547210b145d9948b1613255cf1ee9fa4_289_2.png)\n\n![](img/547210b145d9948b1613255cf1ee9fa4_289_3.png)"
