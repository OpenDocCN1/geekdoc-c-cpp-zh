    \ are intersecting. | To be sure that the ball bounces only if it is going down\
    \ the screen. | Reverse direction. |\n\nWhen the ball and the paddle intersect,\
    \ the game reverses the direction of the Y speed, which causes the ball to appear\
    \ to bounce off the paddle. The player of our game can now \"hit\" the ball. If\
    \ you play with this for a while, you'll notice that sometimes the ball seems\
    \ to hit the paddle when it really shouldn't. **Figure 13-3** shows what is going\
    \ on.\n\nThe `IntersectsWith` method shown in the preceding code uses the width\
    \ and height of the objects on the screen to draw a box around each. If the boxes\
