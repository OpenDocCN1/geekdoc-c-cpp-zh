  - 6. 提供一个 `ASCIIArt` 类，其对象包含如下图形：
- - '##'
  - 7. 实现一个 `BitSequence` 类，该类存储存储一个封装在 `Long` 值中的 64 位序列。提供 `apply` 和 `update` 运算符来获取和设置单个位值。
- - '##'
  - 8. 提供一个 `Matrix` 类——你可以选择想要实现 2 × 2 矩阵、任意大小的方矩阵，还是 $m$ × $n$ 矩阵。提供操作 `+` 和 `*`。后者也应该支持与标量运算，例如
    `mat * 2`。可以通过 `mat(row, col)` 访问单个元素。
- - '##'
  - 9. 为 `RichFile` 类定义一个 `unapply` 操作，用于提取文件路径、名称和扩展名。例如，文件 `/home/cay/readme.txt`
    的路径为 `/home/cay`，名称为 `readme`，扩展名为 `txt`。
- - '##'
  - 10. 为 `RichFile` 类定义一个 `unapplySeq` 操作，提取所有的路径段。例如，对于文件 `/home/cay/readme.txt`，你应该产生包含三个段的序列：`home`、`cay`
    和 `readme.txt`。
