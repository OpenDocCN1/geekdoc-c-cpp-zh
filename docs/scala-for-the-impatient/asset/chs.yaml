  \ 部分函数 — 第 195 页\n- 14.18 练习 — 第 196 页\n\nScala 拥有一种强大的模式匹配机制，具有多种应用：switch 语句、类型查询以及解构（获取表达式的部）。此外，Scala\
  \ 还提供了样例类，这些类针对模式匹配进行了优化。\n\n本章的要点如下：\n\n- `match` 表达式是更好的 `switch`，且没有“贯穿（fall-through）”问题。\n\
  - 如果没有匹配项，会抛出 `MatchError`。使用 `case _` 模式可以避免这一点。\n- 模式可以包含任意条件，称为守卫（guard）。\n-\
  \ 你可以匹配表达式的类型；这优于 `isInstanceOf`/`asInstanceOf`。\n- 你可以匹配数组、元组和样例类，并将部分绑定到变量。\n\
  - 在 `for` 表达式中，不匹配的项会被跳过。\n- 样例类是编译器自动生成模式匹配所需的方法。\n- 样例类层级中的公共基类应该是 `sealed` 的。\n\
  - 对于可能不存在的值，使用 `Option` 类型——比 `null` 更安全。\n\n### 14.1 更好的 Switch\n\n这里是 Scala 中相当于\
  \ C 风格 `switch` 语句的代码：\n\n```scala\nvar sign = ...\nval ch: Char = ...\nch match\
  \ {\n  case '+' => sign = 1\n  case '-' => sign = -1\n  case _ => sign = 0\n}\n\
  ```\n\n`default` 等同于通用 `case _` 模式。拥有这样一个通用模式是个好主意。如果没有匹配项，将抛出 `MatchError`。\n\n\
  与 `switch` 语句不同，Scala 模式匹配没有“贯穿”问题。（在 C 及其衍生语言中，你必须在每个分支的末尾使用 `break` 语句来退出 `switch`，否则会执行到下一个分支。这既烦人又容易出错。）\n\
  \n![image](img/00015.jpeg) 注意\n\n在他有趣的书籍《Deep C》中，Peter van der Linden 报告了对 C 代码的研究，在\
  \ 97% 的情况下，贯穿行为是不受欢迎的。\n\n与 `if` 类似，`match` 是一个表达式而不是语句。前面的代码可以简化为：\n\n```scala\n\
  sign = ch match {\n  case '+' => 1\n  case '-' => -1\n  case _ => 0\n}\n```\n\n\
  你可以对任何类型使用 `match` 语句，而不仅仅是数字。例如：\n\n```scala\ncolor match {\n  case Color.RED =>\
  \ ...\n  case Color.BLACK => ...\n  ...\n}\n```\n\n### 14.2 守卫\n\n假设我们要扩展示例来匹配所有数字。在\
  \ C 风格的 `switch` 语句中，你只需要添加多个 `case` 标签，例如 `case '0': case '1': ... case '9':`。（当然，你不能使用\
  \ `...`，而是必须显式写出所有十种情况。）在 Scala 中，你为模式添加一个*守卫句（guard clause）*，如下：\n\n```scala\n\
  ch match {\n  case '+' => sign = 1\n  case '-' => sign = -1\n  case _ if Character.isDigit(ch)\
  \ => digit = Character.digit(ch, 10)\n  case _ => sign = 0\n}\n```\n\n守卫句可以是任何布尔条件。\n\
  \n注意，模式总是从上到下匹配的。如果带有守卫句的模式没有匹配，则会尝试通用模式。\n\n### 14.3 模式中的变量\n\n如果 `case` 关键字后跟着一个变量名，那么\
  \ match 表达式就会赋值给该变量。例如：\n\n```scala\nstr(i) match {\n  case '+' => sign = 1\n  case\
  \ '-' => sign = -1\n  case ch => digit = Character.digit(ch, 10)\n}\n```\n\n你可以将\
  \ `case _` 视为此功能的一个特殊情况，其中变量名是 `_`。\n\n你可以在守卫中使用变量名：\n\n```scala\nstr(i) match {\n\
  \  case ch if Character.isDigit(ch) => digit = Character.digit(ch, 10)\n  ...\n\
  }\n```\n\n![image](img/00018.jpeg) 注意\n\n\n\n\n遗憾的是，变量模式可能会与常量表达式发生冲突，例如：\n\n```scala\n\
  import scala.math._\n\nx match {\n  case Pi => ...\n  ...\n}\n```\n\nScala 如何知道\
  \ `Pi` 是一个常量而不是变量？规则是：变量必须以小写字母开头。\n\n如果你有一个小写的常量，请用反引号将其包括起来：\n\n```scala\nimport\
  \ java.io.File._\n\nstr match {\n  case `pathSeparator` => ...\n  ...\n}\n```\n\n\
  ### 14.4 类型模式 (Type Patterns)\n\n你可以对表达式的类型进行匹配，例如：\n\n```scala\nobj match {\n \
  \ case x: Int => x\n  case s: String => Integer.parseInt(s)\n  case _: BigInt =>\
  \ Int.MaxValue\n  case _ => 0\n}\n```\n\n在 Scala 中，这种形式形式优于使用 `isInstanceOf` 运算符。\n\
  \n注意模式中的变量名。在第一个模式中，匹配结果绑定到 `x`，类型为 `Int`；在第二个模式中，它绑定到 `s`，类型为 `String`。不需要 `asInstanceOf`\
  \ 强制类型转换！\n\n![image](img/00018.jpeg) 注意\n\n当你与类型进行匹配时，必须提供一个变量名。否则，你匹配的是对象本身：\n\
  \n点击此处查看代码图片\n\n```scala\nobj match {\n  case _: BigInt => Int.MaxValue // 匹配任意\
  \ BigInt 类型的对象\n  case BigInt => -1 // 匹配类型为 Class 的 BigInt 对象\n}\n```\n\n![image](img/00018.jpeg)\
  \ 注意\n\n匹配发生在运行时，且泛型类型在 Java 虚拟机中会被擦除。由于因此，你无法对特定的 `Map` 类型进行类型匹配。\n\n点击此处查看代码图片\n\
  \n```scala\ncase m: Map[String, Int] => ... // 不要这样做\n```\n\n你可以匹配一个泛型 map：\n\n\
  点击此处查看代码图片\n\n```scala\ncase m: Map[_, _] => ... // 正确\n```\n\n然而，数组不会被擦除。你可以匹配\
  \ `Array[Int]`。\n\n### 14.5 匹配数组、列表和元组 (Matching Arrays, Lists, and Tuples)\n\n\
  要根据数组的内容对其进行匹配，请在模式中使用 `Array` 表达式，如下：\n\n```scala\narr match {\n  case Array(0)\
  \ => \"0\"\n  case Array(x, y) => x + \" \" + y\n  case Array(0, _*) => \"0 ...\"\
  \n  case _ => \"something else\"\n}\n```\n\n第一个模式匹配包含 `0` 的数组。第二个模式匹配任何包含两个元素的数组，并将变量\
  \ `x` 和 `y` 绑定到这些元素。第三个模式匹配任何以零开头的数组。\n\n你可以用相同的方式匹配列表，使用 `List` 表达式。或者，你可以使用 `::`\
  \ 运算符：\n\n```scala\nlst match {\n  case 0 :: Nil => \"0\"\n  case x :: y :: Nil\
  \ => x + \" \" + y\n  case 0 :: tail => \"0 ...\"\n  case _ => \"something else\"\
  \n}\n```\n\n对于元组，在模式中使用元组符号表示法：\n\n```scala\npair match {\n  case (0, _) => \"0\
  \ ...\"\n  case (y, 0) => y + \" 0\"\n  case _ => \"neither is 0\"\n}\n```\n\n再次，注意变量是如何绑定到列表或元组的部分的。由于这些绑定让你能够轻松访问复杂结构的部分，这种操作被称为**解构**（destructuring）。\n\
  \n### 14.6 提取器 (Extractors)\n\n在前面的节中，你已经看到模式如何匹配数组、列表和元组。这些功能由**提取器**（extractors）提供——即具有\
  \ `unapply` 或 `unapplySeq` 方法的从对象中提取值的对象。这些方法的实现在第 11 章中介绍。`unapply` 方法用于提取固定数量的对象，而\
  \ `unapplySeq` 用于提取长度可变的序列。\n\n例如，考虑以下表达式：\n\n```scala\narr match {\n  case Array(0,\
  \ x) => ...\n  ...\n}\n```\n\n`Array` 伴生对象是一个提取器——它定义了一个 `unapplySeq` 方法。该方法是用正在匹配的表达式调用的，而不是用模式中看起来像参数的内容。调用\
  \ `Array.unapplySeq(arr)` 会产生一个值序列，即数组中的值。第一个值与 0 比较，第二个值赋值给 `x`。\n\n正则表达式提供了提取器的另一种很好的用例。当一个正则表达式包含分组时，你可以用提取器模式匹配每个分组。例如：\n\
  \n```scala\nval pattern = \"([0-9]+) ([a-z]+)\".r\n\"99 bottles\" match {\n  case\
  \ pattern(num, item) => ...\n  // 将 num 设置为 \"99\", 将 item 设置为 \"bottles\"\n}\n\
  ```\n\n调用 `pattern.unapplySeq(\"99 bottles\")` 会产生一个匹配分组的字符串序列。这些字符串被赋值给变量 `num`\
  \ 和 `item`。\n\n注意，这里的提取器不是伴生对象，而是正则表达式对象。\n\n### 14.7 变量声明中的模式 (Patterns in Variable\
