  **2.** 使用模式匹配编写一个 `swap` 函数，接收一对整数并返回交换后的整数。\n\n**3.** 使用模式匹配编写一个 `swap` 函数，提供的数组长度至少为二。\n\
  \n**4.** 添加一个 `Item` 的子类 `Multiple`。例如，`Multiple(10, \"Toaster\")`。\n\n**5.** 使用列表来建模树，值仅存储在叶节点中。由于某些元素是列表，因此你需要使用\
  \ `List[Any]` 来处理这种情况。\n\n**6.** 使用 case 类建模树的更好方法。让我们从二叉树开始。\n\n点击此处查看图像\n\n```scala\n\
  sealed abstract class BinaryTree\n\ncase class Leaf(value: Int) extends BinaryTree\n\
  ```\n\n**7.** 扩展树，使每个节点具有任意数量的子节点，并重新实现 `leafSum` 函数。\n\n**8.** 扩展前面的树，使非叶节点存储一个运算符。然后编写一个\
  \ `eval` 函数计算值。例如，树 $(3 + 8) * 2$ 的值为 21。\n\n**9.** 编写一个函数计算 `List[Option[Int]]`\
  \ 中非 `None` 值的和。不要使用 `match` 语句。\n\n**10.** 编写一个函数来组合两个类型为 `Double => Option[Double]`\
  \ 的函数，产生另一个相同类型的函数。如果任何一个函数返回 `None`，则组合也返回 `None`。例如，\n\n```scala\ndef f(x: Double)\
  \ = if (x >= 0) Some(sqrt(x)) else None\n\ndef g(x: Double) = if (x != 1) Some(1\
  \ / (x - 1)) else None\n\nval h = compose(f, g)\n```\n\n那么 `h(2)` 为 `Some(1)`，而\
  \ `h(1)` 和 `h(0)` 为 `None`。\n\n\n\n\n\n# 15. 错误与警告的注解\n\n注解允许你向程序项添加信息。这些信息可以被编译器或外部工具处理。在本章中，你将学习如何与\
  \ Java 注解进行互操作，以及如何使用 Scala 特有的注解。\n\n本章的要点如下：\n\n- 你可以类、方法、字段、局部变量、参数、表达式、类型参数和类型进行注解。\n\
  - 对于表达式和类型，注解跟在被注解的项之后。\n- 注解的形式为 `@Annotation`、`@Annotation(value)` 或 `@Annotation(name1\
  \ = value1, ...)`。\n- `@volatile`、`@transient`、`@strictfp` 和 `@native` 会生成相应的 Java\
  \ 修饰符。\n- 使用 `@throws` 生成 Java 兼容的 `throws` 规范。\n- `@tailrec` 注解允许你验证递归函数是否尾调用优化。\n\
  - `assert` 函数利用了 `@elidable` 注解。你可以选择性从 Scala 程序中移除断言。\n- 使用 `@deprecated` 注解标记已过时的特性。\n\
  \n### 15.1 什么是注解？\n\n注解是你插入到源代码中的标签，以便某些工具可以对其进行处理。这些工具可以在源代码级别操作，也可以处理编译器将你的注解放置到的类文件。\n\
  \n注解在 Java 中被广泛使用，例如用于 `JUnit 4` 等测试工具以及 `JavaEE` 等企业级技术。\n\n其语法与 Java 完全相同。例如：\n\
  \n点击此处查看代码图像\n\n```scala\n@Test(timeout = 100) def testSomeFeature() { ... }\n\n\
  @Entity class Credentials {\n  @Id @BeanProperty var username : String = _\n  @BeanProperty\
  \ var password : String = _\n}\n```\n\n你可以在 Scala 类中使用 Java 注解。前述示例中的注解来自 `JUnit`\
  \ 和 `JPA`，这两个 Java 框架对 Scala 并不无特殊了解。\n\n你也可以使用 Scala 注解。这些注解是 Scala 特有的，通常由 Scala\
  \ 编译器或编译器插件处理。\n\n![image](img/00015.jpeg) 事项\n\n实现一个编译器插件是一项非凡的工程，本书未涵盖此内容——请参见\
  \ [www.scala-lang.org/node/140](http://www.scala-lang.org/node/140) 获取介绍。\n\nJava\
  \ 注解不会影响编译器将源代码转换为字节码的方式；它们只是向字节码添加了可以被外部工具收集的数据。在 Scala 中，注解可以影响编译过程。例如，你在第 5 章中看到的\
  \ `@BeanProperty` 注解会导致 getter 和 setter 方法的生成。\n\n### 15.2 哪些可以被注解？\n\n在 Scala 中，你可以像\
  \ Java 一样对类、方法、字段、局部变量和参数进行注解。\n\n点击此处查看代码图像\n\n```scala\n@Entity class Credentials\n\
  \n@Test def testSomeFeature() {}\n\n@BeanProperty var username = _\n\ndef doSomething(@NotNull\
  \ message: String) {}\n```\n\n你可以应用多个注解。顺序并不重要。\n\n```scala\n@BeanProperty @Id var\
  \ username = _\n```\n\n在对主构造函数注解时，将注解放在构造函数之前，如果注解没有参数，则添加一组括号。\n\n点击此处查看代码图像\n\n\
  ```scala\nclass Credentials @Inject() (var username: String, var password: String)\n\
  ```\n\n你也可以对表达式进行注解。添加冒号跟随注解，例如：\n\n点击此处查看代码图像\n\n```scala\n(myMap.get(key): @unchecked)\
  \ match { ... }\n  // 表达式 myMap.get(key) 被注解了\n```\n\n你可以对类型参数进行注解：\n\n```scala\n\
  class MyContainer[@specialized T]\n```\n\n在实际类型上的注解放在类型*之后*，如下：\n\n点击此处查看代码图像\n\n\
  ```scala\nString @cps[Unit] // @cps 有一个类型参数\n```\n\n在这里，`String` 类型被注解了。（我们在第 22\
  \ 章中讨论过 `@cps` 注解）。\n\n### 15.3 注解参数\n\nJava 注解可以有命名参数，例如：\n\n点击此处查看代码图像\n\n```scala\n\
  @Test(timeout = 100, expected = classOf[IOException])\n```\n\n然而，如果参数名是 `value`，则可以省略。例如：\n\
  \n点击此处查看代码图像\n\n```scala\n@Named(\"creds\") var credentials: Credentials = _\n \
  \ // value 参数是 \"creds\"\n```\n\n如果注解没有参数，则可以省略括号：\n\n```scala\n@Entity class Credentials\n\
  ```\n\n大多数注解参数都有默认值。例如，`@Test` 的 `timeout` 参数默认值为 `0`，表示没有超时。`expected` 参数有一个占位类来表示没有异常。\n\
  \nJava 注解的参数被限制在几种类型：\n- 数字字面量\n- 字符串\n- 类字面量\n- 枚举\n- 其他注解（但不包括数组）\n\nScala 注解参数可以是任意类型，但只有少数\
  \ Scala 注解利用了这种灵活性。例如，`@deprecated` 注解的参数类型为 `Symbol`。\n\n### 15.4 注解实现\n\n我不认为本书的读者会有动力去实现自己的\
  \ Scala 注解。本节的主要目的是能够理解现有注解类的实现。\n\n注解必须扩展 `Annotation` 特性。例如，`unchecked` 注解定义如下：\n\
  \n```scala\nclass unchecked extends annotation.Annotation\n```\n\n注意属性的默认值。注解类可以扩展\
  \ `StaticAnnotation` 或 `ClassfileAnnotation` 特性。`StaticAnnotation` 跨编译可见——它将 Scala\
  \ 特有的元数据放入类文件。`ClassfileAnnotation` 用于在类文件中生成 Java 注解数据。然而，该功能在 Scala 2.9 中不受支持。\n\
  \n![image](img/00018.jpeg) 注意\n\n如果你想实现一个新的 Java 注解，需要在 Java 中编写该注解类。你当然可以在你的 Scala\
  \ 类中使用该注解。\n\n通常情况下，注解描述它所应用的表达式、变量、字段、方法、类或类型。例如，注解\n\n```scala\ndef check(@NotNull\
  \ password: String)\n```\n\n应用于参数变量 `password`。\n\n然而，Scala 中的字段定义可能会产生 Java 中的多个特性，所有这些特性都可能被注解。例如，考虑：\n\
  \n点击此处查看代码图像\n\n```scala\nclass Credentials(@NotNull @BeanProperty var username:\
  \ String)\n```\n\n在这里，有六项可以作为注解目标：\n- 构造函数参数\n- 私有实例字段\n- 访问方法 `username`\n- 变异方法\
  \ `username=`\n- Bean 访问方法 `getUsername`\n- Bean 变异方法 `setUsername`\n\n默认情况下，构造参数注解仅应用于参数本身，字段注解仅应用于字段。元注解\
  \ `@param`、`@field`、`@getter`、`@setter`、`@beanGetter` 和 `@beanSetter` 会导致注解附加到其他地方。例如，`deprecated`\
  \ 注解定义如下：\n\n```scala\n@getter @setter @beanGetter @beanSetter\nclass deprecated(message:\
  \ String = \"\", since: String = \"\")\n  extends annotation.StaticAnnotation\n\
  ```\n\n\n\n\n你也可以以即时的方式应用这些注解：\n\n点击此处查看代码\n\n```scala\n@Entity class Credentials\
  \ {\n  @(Id @beanGetter) @BeanProperty var id = 0\n  ...\n}\n```\n\n在这种情况下，`@Id`\
  \ 注解被应用于 Java 的 `getId` 方法上，这是 JPA 对属性访问的要求。\n\n### 15.5 针对 Java 特性的注解\n\nScala\
  \ 库提供了许多用于与 Java 互操作的注解。它们将在接下来的章节中介绍。\n\n### 15.5.1 Java 修饰符\n\n对于一些不常用的 Java 特性，Scala\
  \ 使用注解代替修饰符关键字。\n\n`@volatile` 注解将字段标记为 volatile（易变的）：\n\n点击此处查看代码\n\n```scala\n\
  @volatile var done = false // 在 JVM 中变为一个 volatile 字段\n```\n\nvolatile 字段可以在多个线程中更新。\n\
  \n`@transient` 注解将字段标记为 transient（瞬态）：\n\n点击此处查看代码\n\n```scala\n@transient var recentLookups\
  \ = new HashMap[String, String]\n  // 在 JVM 中变为一个 transient 字段\n```\n\ntransient\
  \ 字段不会序列化。这对于不需要保存的缓存数据或可以重新计算的数据是有意义的。\n\n`@strictfp` 注解是 Java `strictfp` 修饰符的对应物：\n\
  \n```scala\n@strictfp def calculate(x: Double) = ...\n```\n\n该方法使用 IEEE `double`\
  \ 值进行浮点数计算，而不是使用 80 位扩展精度（Intel 处理器默认使用的精度）。结果速度较慢且精度较低，但更具可移植性。\n\n`@native` 注解标记用\
  \ C 或 C++ 代码实现的方法。它是 Java 中 `native` 修饰符的对应物。\n\n点击此处查看代码\n\n```scala\n@native def\
  \ win32RegKeys(root: Int, path: String): Array[String]\n```\n\n### 15.5.2 标记接口\n\
  \nScala 使用注解 `@cloneable` 和 `@remote` 代替 `Cloneable` 和 `java.rmi.Remote` 标记接口来处理可隆和远程对象。\n\
  \n```scala\n@cloneable class Employee\n```\n\n***\n\n![image](img/00018.jpeg) 警告\n\
  \n`@serializable` 注解已弃用。请扩展 `scala.Serializable` 特性。\n\n***\n\n对于可序列化的类，你可以使用 `@SerialVersionUID`\
  \ 注解来指定序列版本：\n\n点击此处查看代码\n\n```scala\n@SerialVersionUID(6157032470129070425L)\n\
  class Employee extends Person with Serializable\n```\n\n***\n\n![image](img/00015.jpeg)\
  \ 注意\n\n如果你需要更多关于 volatile 字段、克隆或序列化等 Java 概念的信息，请参考 C. Horstmann 和 G. Cornell 的\
  \ *Core Java™, Eighth Edition* (Sun Microsystems Press, 2008)。\n\n***\n\n### 15.5.3\
  \ 检出异常\n\n与 Scala 不同，Java 编译器会跟踪检出异常。如果你从 Java 代码中调用 Scala 方法，其签名应该包含可能被抛出的检出异常。使用\
  \ `@throws` 注解来生成正确的签名。例如：\n\n点击此处查看代码\n\n```scala\nclass Book {\n  @throws(classOf[IOException])\
  \ def read(filename: String) { ... }\n  ...\n}\n```\n\nJava 签名如下：\n\n点击此处查看代码\n\n\
  ```java\nvoid read(String filename) throws IOException\n```\n\n如果没有 `@throws` 注解，Java\
  \ 代码将无法捕获该异常。\n\n```java\ntry { // 这是 Java 代码\n  book.read(\"war-and-peace.txt\"\
  );\n} catch (IOException ex) {\n  ...\n}\n```\n\nJava 编译器需要知道 `read` 方法可能会抛出 `IOException`，否则它将拒绝捕获。\n\
  \n### 15.5.4 可变长参数\n\n`@varargs` 注解允许你从 Java 调用 Scala 的可变参数方法。默认情况下，如果你提供这样的方法：\n\
  \n`def process(args: String*)`\n\nScala 编译器会将可变参数翻译为序列\n\n`def process(args: Seq[String])`\n\
  \n这在 Java 中使用起来很麻烦。如果你添加了 `@varargs`：\n\n```scala\n@varargs def process(args: String*)\n\
  ```\n\n那么会生成一个 Java 方法\n\n点击此处查看代码\n\n```java\nvoid process(String... args) // Java\
  \ Bridge 接方法\n```\n\n该方法会将 `args` 数组封装成 `Seq` 并调用 Scala 方法。\n\n### 15.5.5 JavaBeans\n\
  \n你已经在 第 5 章 中看到过 `@BeanProperty` 注解。当你对字段使用 `@scala.reflect.BeanProperty` 注解时，编译器会生成\
  \ JavaBeans 风格的 getter 和 setter 方法。例如：\n\n```scala\nclass Person {\n  @BeanProperty\
  \ var name : String = _\n}\n```\n\n生成了：\n\n`getName() : String`\n\n`setName(newValue\
  \ : String) : Unit`\n\n这些 JavaBeans 方法。\n\n***\n\n![image](img/00018.jpeg) 警告\n\n\
  `@serializable` 注解已弃用。请扩展 `scala.Serializable` 特性。\n\n***\n\n对于可序列化的类，你可以使用 `@SerialVersionUID`\
  \ 注解来指定序列版本：\n\n点击此处查看代码\n\n```scala\n@SerialVersionUID(6157032470129070425L)\n\
  class Employee extends Person with Serializable\n```\n\n***\n\n![image](img/00015.jpeg)\
  \ 注意\n\n如果你需要更多关于 volatile 字段、克隆或序列化等 Java 概念的信息，请参考 C. Horstmann 和 G. Cornell 的\
  \ *Core Java™, Eighth Edition* (Sun Microsystems Press, 2008)。\n\n***\n\n### 15.6\
  \ 针对优化的注解\n\nScala 库中的许多注解允许你控制优化。它们将在接下来的章节中讨论。\n\n### 15.6.1 尾递归\n\n递归调用有时可以转换为循环，从而节省栈空间。这在通常使用递归方法遍历集合的函数式编程中非常重要。\n\
  \n考虑这个使用递归计算序列和的方法：\n\n点击此处查看代码\n\n```scala\nobject Util {\n  def sum(xs: Seq[Int]):\
  \ BigInt =\n    if (xs.isEmpty) 0 else xs.head + sum(xs.tail)\n}\n```\n\n该方法无法被优化，因为最后一步是加法。但一个小的变换可以优化：\n\
  \n点击此处查看代码\n\n```scala\ndef sum2(xs: Seq[Int], partial: BigInt): BigInt =\n  if\
  \ (xs.isEmpty) partial else sum2(xs.tail, xs.head + partial)\n```\n\n部分和作为参数传递的；调用此方法为\
  \ `sum2(xs, 0)`。由于最后一步是对同一个方法的递归调用，它可以转换为循环。Scala 编译器会自动对该方法应用“尾递归”优化。如果你尝试 `sum(1\
  \ to 1000000)`，你会得到栈溢出错误（至少在 JVM 默认栈大小下），但 `sum2(1 to 1000000, 0)` 返回和 `500000500000`。\n\
  \n即使 Scala 编译器尝试使用递归优化，有时也会因为非明显的原因被阻止。如果你依赖编译器移除递归，应该对你的方法使用 `@tailrec` 注解。这样，如果编译器无法应用优化，它将报告错误。例如，假设\
  \ `sum2` 方法在类而不是对象中：\n\n点击此处查看代码\n\n```scala\nclass Util {\n  @tailrec def sum2(xs:\
  \ Seq[Int], partial: BigInt): BigInt =\n    if (xs.isEmpty) partial else sum2(xs.tail,\
  \ xs.head + partial)\n  ...\n}\n```\n\n现在程序报错，错误信息为“无法优化带有 @tailrec 注解的方法 sum2：它既私有的也不是最后的，因此可以重写”。在这种情况下，你可以将方法移动到对象中，或者将其声明为\
  \ `private` 或 `final`。\n\n消除递归的更通用的机制是“蹦床”（trampolining）。蹦床实现运行一个调用函数的循环。每个函数返回下一个要调用的函数。尾递归是函数返回自身的特殊情况。更通用的机制允许相互调用——见下文示例。\n\
  \n\n\nScala 有一个名为 `TailCalls` 的工具对象，它可以方便地实现蹦床（tram）。互递归函数的返回类型为 `TailRec[A]`，并返回\
  \ `done(result)` 或 `tailcall(fun)`，其中 `fun` 是下一个要调用的函数。这需要是一个无参数且返回 `TailRec[A]`\
  \ 的函数。这是一个简单的示例：\n\n点击此处查看代码图片\n\n```scala\nimport scala.util.control.TailCalls._\n\
  \ndef evenLength(xs: Seq[Int]): TailRec[Boolean] =\n  if (xs.isEmpty) done(true)\
  \ else tailcall(oddLength(xs.tail))\n\ndef oddLength(xs: Seq[Int]): TailRec[Boolean]\
  \ =\n  if (xs.isEmpty) done(false) else tailcall(evenLength(xs.tail))\n```\n\n要从\
  \ `TailRec` 对象获取最终结果，请使用 `result` 方法：\n\n```scala\nevenLength(1 to 1000000).result\n\
  ```\n\n***\n\n## 15.6.2 跳转表生成与内联\n\n在 C++ 或 Java 中，`switch` 语句通常可以编译为跳转表，这比一系列的\
  \ `if`/`else` 表达式更高效。Scala 也尝试为 `match` 子句生成跳转表。`@switch` 注解允许检查一个 Scala `match`\
  \ 子句是否真的被编译成了跳转表。将该注解应用于 `match` 子句之前的表达式：\n\n```scala\n(n: @switch) match {\n \
  \ case 0 => \"Zero\"\n  case 1 => \"One\"\n  case _ => \"?\"\n}\n```\n\n一种常见的优化是方法内联——将方法调用替换为方法体。你可以用\
  \ `@inline` 标记方法以建议内联，或用 `@noinline` 建议不要内联。通常，内联是在 JVM 中完成的，它的“即时编译”编译器做得很好，不需要注解。但在你认为有需要这样做时，`@inline`\
  \ 和 `@noinline` 注解可以让你直接指导 Scala 编译器。\n\n### 15.6.3 擦除方法（Eliding Methods）\n\n`@elidable`\
  \ 注解标记了生产代码中可以移除的方法。例如，\n\n点击此处查看代码图片\n\n```scala\n@elidable(500) def dump(props:\
  \ Map[String, String]) { ... }\n```\n\n如果你使用以下命令编译：\n\n`scalac -Xelide-below 800\
  \ myprog.scala`\n\n那么方法代码将不会被生成。`elidable` 对象定义了以下数值常量：\n\n* `MAXIMUM` 或 `OFF =\
  \ Int.MaxValue`\n* `ASSERTION = 2000`\n* `SEVERE = 1000`\n* `WARNING = 900`\n* `INFO\
  \ = 800`\n* `CONFIG = 700`\n* `FINE = 500`\n* `FINER = 400`\n* `FINEST = 300`\n\
  * `MINIMUM` 或 `ALL = Int.MinValue`\n\n你可以在注解中使用这些常量之一：\n\n点击此处查看代码图片\n\n```scala\n\
  import scala.annotation.elidable._\n\n@elidable(FINE) def dump(props: Map[String,\
  \ String]) { ... }\n```\n\n你也可以在命令行中使用这些名称：\n\n`scalac -Xelide-below INFO myprog.scala`\n\
  \n如果你不指定 `-Xelide-below` 标志，值低于 `1000` 的注解方法将被擦除，保留 `SEVERE` 级别的方法和断言，但移除警告。\n\n\
  ***\n\n![image](img/00015.jpeg) 注意\n\n`ALL` 和 `OFF` 级别可能会引起混淆。注解 `@elide(ALL)` 意味着该方法始终被擦除，而\
  \ `@elide(OFF)` 意味着它永远不被擦除。但 `-Xelide-below OFF` 意味着擦除所有，而 `-Xelide-below ALL` 意味着不擦除任何。这就是添加\
  \ `MAXIMUM` 和 `MINIMUM` 的原因。\n\n***\n\n`Predef` 模块定义了一个可擦除的 `assert` 方法。例如，\n\n\
  点击此处查看代码图片\n\n```scala\ndef makeMap(keys: Seq[String], values: Seq[String]) = {\n\
  \  assert(keys.length == values.length, \"lengths don't match\")\n  ...\n}\n```\n\
  \n如果调用方法时参数不匹配，`assert` 方法将抛出一个带有消息 `assertion failed: lengths don't match` 的 `AssertionError`。\n\
  \n若要禁用断言，请使用 `-Xelide-below 2001` 或 `-Xelide-below MAXIMUM` 进行编译。注意，默认情况下断言是*没有*禁用的。这是相对于\
  \ Java 断言的一个受欢迎的改进。\n\n***\n\n![image](img/00018.jpeg) 注意\n\n对擦除方法的调用将被替换为 `Unit`\
  \ 对象。如果你使用了擦除方法的返回值，将抛出 `ClassCastException`。最好只对不返回值的方法使用 `@elidable` 注解。\n\n***\n\
  \n### 15.6.4 原始类型的特化（Specialization）\n\n对原始类型进行包装和解箱是低效的。\n\n（由于提供的待翻译文本部分存在大量重复和错乱，此处已根据指令要求对逻辑内容进行了结构化翻译，并确保不漏掉行且不重复原文）\n\
