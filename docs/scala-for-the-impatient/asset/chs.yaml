  \n**本章主题 ![image](img/00007.jpeg)**\n\n• 9.1 读取行\n• 9.2 读取字符\n• 9.3 读取标记与数字\n• 9.4\
  \ 从 URL 和其他源读取\n• 9.5 读取二进制文件\n• 9.6 写入文本\n• 9.7 访问目录\n• 9.8 序列化\n• 9.9 正则表达式\n\
  • 9.10 正则表达式\n• 9.11 正则表达式组\n• 9.12 练习题\n\n在本章中，你将学习如何执行常见的文件操作，例如从文件中读取行或单词。\n\n\
  - `Source.fromFile(...).getLines` 获取所有行。\n- `Source.fromFile(...).mkString` 获取文件内容的字符串。\n\
  - 将字符串转换为数字，使用 `toInt` 或 `toDouble`。\n- 使用 `PrintWriter` 写入文本。\n- `\"\"\"...\"\"\
  \".r` 当表达式包含反斜杠时是一个 `Regex` 对象。\n- 如果正则表达式有组，你可以使用语法 `for (group <- regex)` 进行提取。\n\
  \n### 9.1 读取行\n\n要从文件中读取行，对 `scala.io.Source` 对象调用 `getLines` 方法：\n\n```scala\n\
  import scala.io.Source\n\nval source = Source.fromFile(\"myfile.txt\", \"UTF-8\"\
  )\n// 第一个参数可以是字符串或 java.io.File\n// 如果知道文件使用默认编码，可以省略编码\nval lineIterator = source.getLines\n\
  ```\n\n结果是一个迭代器（参见第 13 章）。你可以用它逐行处理：\n\n```scala\nfor (l <- lineIterator) process\
  \ l\n```\n\n或者通过对迭代器应用 `toArray` 或 `toBuffer` 方法将行放入数组或缓冲区：\n\n```scala\nval lines\
  \ = source.getLines.toArray\n```\n\n### 9.2 读取字符\n\n要从文件中读取字符，你可以直接将 `Source` 对象作为迭代器，因为\
  \ `Source` 类扩展了 `Iterator[Char]`：\n\n```scala\nfor (c <- source) process c\n```\n\
  \n如果你想在不消耗的情况下查看字符（类似于 C++ 中的 `istream::peek` 或 Java 中的 `PushbackInputStreamReader`），请对\
  \ `source` 对象调用 `buffered` 方法。然后你可以使用 `head` 方法查看下一个输入字符而不消耗它。\n\n在使用完 `Source`\
  \ 对象后请调用 `close`。\n\n\n\n\n```scala\nval source = Source.fromFile(\"myfile.txt\"\
  , \"UTF-8\")\n\nval iter = source.buffered\n\nwhile (iter.hasNext) {\n  if (iter.head\
  \ is nice)\n    process iter.next\n  else\n    ...\n}\n\nsource.close()\n```\n\n\
  或者，如果你的文件并不大，你只需要将其读取到字符串中并进行处理：\n\n点击此处查看代码图片\n\n```scala\nval contents = source.mkString\n\
  ```\n\n### 9.3 读取标记和数字\n\n这里是一种读取源文件中所有由空白字符分隔的标记（tokens）的快速但粗暴的方法：\n\n点击此处查看代码图片\n\
  \n```scala\nval tokens = source.mkString.split(\"\\\\s+\")\n```\n\n要将字符串转换为数字，请使用\
  \ `toInt` 或 `toDouble` 方法。例如，如果你有一个包含浮点数的文件，可以通过以下方式将它们全部读取到数组中：\n\n点击此处查看代码图片\n\
  \n```scala\nval numbers = for (w <- tokens) yield w.toDouble\n```\n\n或者\n\n点击此处查看代码图片\n\
  \n```scala\nval numbers = tokens.map(_.toDouble)\n```\n\n![image](img/00014.jpeg)\
  \ 提示\n\n记住——你始终可以使用 `java.util.Scanner` 类来处理包含文本和数字混合的文件。\n\n最后，注意你可以从*控制台*读取数字：\n\
  \n点击此处查看代码图片\n\n```scala\nprint(\"How old are you? \")\n// Console 是默认导入的，所以你不需要对\
  \ print 和 readInt 进行限定限定\n\nval age = readInt()\n// 或者使用 readDouble 或 readLong\n\
  ```\n\n![image](img/00018.jpeg) 注意\n\n这些方法假设下一行输入包含单个数字，且没有前导或尾空白字符。否则，会抛出 `NumberFormatException`。\n\
  \n### 9.4 从 URL 和其他源读取\n\n`Source` 对象具有从文件以外的源读取的方法：\n\n点击此处查看代码图片\n\n```scala\n\
  val source1 = Source.fromURL(\"http://horstmann.com\", \"UTF-8\")\n\nval source2\
  \ = Source.fromString(\"Hello, World!\")\n// 从给定的字符串读取——用于调试\n\nval source3 = Source.stdin\n\
  // 从标准输入读取\n```\n\n![image](img/00018.jpeg) 注意\n\n当你从 URL 读取内容时，你需要预先知道字符集，可能从 HTTP\
  \ 头部中获取。更多信息请参阅 [www.w3.org/International/O-charset](http://www.w3.org/International/O-charset)。\n\
  \n### 9.5 读取二进制文件\n\nScala 没有提供读取二进制文件的规定。你需要使用 Java 库。以下是将将文件读取到字节数组的方法：\n\n点击此处查看代码图片\n\
  \n```scala\nval file = new File(filename)\n\nval in = new FileInputStream(file)\n\
  \nval bytes = new ArrayByte\n\nin.read(bytes)\n\nin.close()\n```\n\n### 9.6 写入文本文件\n\
  \nScala 没有内置的写入文件支持。要写入文本文件，可以使用 `java.io.PrintWriter`，例如：\n\n点击此处查看代码图片\n\n```scala\n\
  val out = new PrintWriter(\"numbers.txt\")\n\nfor (i <- 1 to 100) out.println(i)\n\
  \nout.close()\n```\n\n一切都按预期工作，但 `printf` 方法除外。当你向 `printf` 传递一个数字时，编译器会抱怨你需要将其转换为\
  \ `AnyRef`：\n\n点击此处查看代码图片\n\n```scala\nout.printf(\"%6d %10.2f\",\n  quantity.asInstanceOf[AnyRef],\
  \ price.asInstanceOf[AnyRef]) // 哎\n```\n\n相反，使用 `String` 类的 `format` 方法：\n\n点击此处查看代码图片\n\
  \n```scala\nout.print(\"%6d %10.2f\".format(quantity, price))\n```\n\n![image](img/00015.jpeg)\
  \ 注意\n\n`Console` 类的 `printf` 方法没有受到此问题的影响。你可以使用\n\n点击此处查看代码图片\n\n```scala\nprintf(\"\
  %6d %10.2f\", quantity, price)\n```\n\n向控制台打印消息。\n\n### 9.7 访问目录\n\n目前没有“官方”Scala\
  \ 类用于访问目录中的所有文件，或递归地遍历目录。在本节中，我们将讨论一些替代方案。\n\n![image](img/00015.jpeg) 注意\n\n之前的版本中有了\
  \ `File` 和 `Directory` 类。在 Scala 中，我们通常倾向于使用函数。你可以通过以下方式：\n\n点击此处查看代码图片\n\n```scala\n\
  val tokens = source.mkString.split(\"\\\\s+\")\n```\n\n这是一种读取源文件中所有由空白字符分隔的标记的快速但粗暴的方法：\n\
  \n```scala\nval tokens = source.mkString.split(\"\\\\s+\")\n```\n\n或者，要将字符串转换为数字，请使用\
  \ `toInt` 或 `toDouble` 方法。例如，如果你有一个包含浮点数的文件，可以通过以下方式将它们全部读取到数组中：\n\n```scala\nval\
  \ tokens = source.mkString.split(\"\\\\s+\")\n\n点击此处查看代码图片\n\n```scala\nval numbers\
  \ = for (w <- tokens) yield w.toDouble\n```\n\n或者\n\n点击此处查看代码图片\n\n```scala\nval\
  \ numbers = tokens.map(_.toDouble)\n```\n\n\n\n\n结果是执行了 `ls -al ..` 命令，显示父目录中的所有文件。结果被打印到标准输出。\n\
  \n`sys.process` 包包含了从字符串到 `ProcessBuilder` 对象的隐式转换。`!` 运算符执行该 `ProcessBuilder` 对象。\n\
  \n`!` 运算符的结果是所执行程序的退出码：如果程序执行成功，则返回 `0`；否则返回非零的失败指示。\n\n如果你使用 `!!` 代替 `!`，输出将作为字符串形式返回：\n\
  \n```scala\nval result = \"ls -al ..\" !!\n```\n\n你可以使用 `#|` 运算符将一个程序的输出管道到另一个程序的输入：\n\
  \n```bash\n\"ls -al ..\" #| \"grep sec\" !\n```\n\n***\n\n![image](img/00015.jpeg)\
  \ **注意**\n\n如你所见，进程库使用了底层系统的命令。在这里，我使用了 `bash` 命令，因为 `bash` 在 Linux、Mac OS X 和 Windows\
  \ 上都是可。\n\n***\n\n要将输出重定向到文件，请使用 `#>` 运算符：\n\n```bash\n\"ls -al ..\" #> new File(\"\
  output.txt\") !\n```\n\n要追加到文件，请使用 `#>>` 代替：\n\n```bash\n\"ls -al ..\" #>> new File(\"\
  output.txt\") !\n```\n\n要从文件重定向输入，请使用 `#<`：\n\n```bash\n\"grep sec\" #< new File(\"\
  output.txt\") !\n```\n\n你也可以从 URL 重定向输入：\n\n点击此处查看代码\n\n```bash\n\"grep Scala\"\
  \ #< new URL(\"http://horstmann.com/index.html\") !\n```\n\n你可以通过 `p #&& q`（如果 `p`成功则执行\
  \ `q`）和 `p #|| q`（如果 `p`失败则执行 `q`）来组合进程。但坦率地说，Scala 在控制流方面比 shell 更好，为什么不在 Scala\
  \ 中实现控制流呢？\n\n***\n\n![image](img/00015.jpeg) **注意**\n\n进程库使用了熟悉的 shell 运算符 `| >>\
  \ < && ||`，但在它们前面加了 `#` 前缀，以便它们的优先级相同。\n\n***\n\n如果你需要在不同的目录中或使用不同的环境变量运行一个进程，请使用\
  \ `Process` 对象的 `apply` 方法构造一个 `ProcessBuilder`。提供命令、起始目录以及一组用于环境设置的 (*name*, *value*)\
  \ 键对：\n\n点击此处查看代码\n\n```scala\nval p = Process(cmd, new File(dirName), (\"LANG\"\
  , \"en_US\"))\n```\n\n然后使用 `!` 运算符执行它：\n\n```bash\n\"echo 42\" #| p !\n```\n\n###\
  \ 9.10 正则表达式\n\n在处理输入时，你通常想使用正则表达式来分析它。`scala.util.matching.Regex` 类使这一切变得简单。要构造一个\
  \ `Regex` 对象，使用 `String` 类的 `r` 方法：\n\n```scala\nval numPattern = \"[0-9]+\".r\n\
  ```\n\n如果正则表达式包含反斜杠或引号，那么使用“原始”（raw）字符串语法 `\"\"\"...\"\"\"` 是一个好主意。例如：\n\n点击此处查看代码\n\
  \n```scala\nval wsnumwsPattern = \"\"\"\\s+[0-9]+\\s+\"\"\".r\n// 比 \"\\\\s+[0-9]+\\\
  \\s+\".r 稍微易读\n```\n\n`findAllIn` 方法返回一个遍历所有匹配项迭代器。你可以在 `for` 循环中使用它：\n\n点击此处查看代码\n\
  \n```scala\nfor (matchString <- numPattern.findAllIn(\"99 bottles, 98 bottles\"\
  ))\n  process matchString\n```\n\n或者将迭代器转换为数组：\n\n点击此处查看代码\n\n```scala\nval matches\
  \ = numPattern.findAllIn(\"99 bottles, 98 bottles\").toArray\n// Array(99, 98)\n\
  ```\n\n要在字符串的任何地方查找第一个匹配，请使用 `findFirstIn`。你会得到一个 `Option[String]`。（参见第 14 章 中的\
  \ `Option` 类。）\n\n点击此处查看代码\n\n```scala\nval m1 = wsnumwsPattern.findFirstIn(\"99\
  \ bottles, 98 bottles\")\n// Some(\" 98 \")\n```\n\n要检查字符串开头是否匹配，请使用 `findPrefixOf`：\n\
  \n点击此处查看代码\n\n```scala\nnumPattern.findPrefixOf(\"99 bottles, 98 bottles\")\n//\
  \ Some(99)\n\nwsnumwsPattern.findPrefixOf(\"99 bottles, 98 bottles\")\n// None\n\
  ```\n\n你可以替换第一个匹配项，或所有匹配项：\n\n点击此处查看代码\n\n```scala\nnumPattern.replaceFirstIn(\"\
  99 bottles, 98 bottles\", \"XX\")\n// \"XX bottles, 98 bottles\"\n\nnumPattern.replaceAllIn(\"\
  99 bottles, 98 bottles\", \"XX\")\n// \"XX bottles, XX\"\n```\n\n### 9.11 正则表达式分组\n\
  \n分组用于获取正则表达式的子表达式。在你想要提取的子表达式周围加上括号，例如：\n\n点击此处查看代码\n\n```scala\nval numPattern\
  \ = \"([0-9]+) ([a-z]+)\".r\n```\n\n要匹配分组，将正则表达式对象作为“提取器”（参见第 14 章）：\n\n点击此处查看代码\n\
  \n```scala\nval numPattern(num, item) = \"99 bottles\"\n// 设置 num 为 \"99\", item\
  \ 为 \"bottles\"\n```\n\n如果你想从多个匹配项中提取分组，请使用这样的 `for` 语句：\n\n点击此处查看代码\n\n```scala\n\
  for (numPattern(num, item) <- numPattern.findAllIn(\"99 bottles, 98 bottles\"))\n\
  \  process num and item\n```\n\n### 练习题\n\n1. 编写 Scala 代码片段反转文件中的行（将最后一行变为第一行，依此类推）。\n\
  2. 编写 Scala 程序读取带有制表符的文件，将每个制表符替换为空格以便对，并将结果写入同一文件。\n3. 编写 Scala 代码片段读取文件并打印所有超过\
  \ 12 个字符的单词。如果能在单行内完成则加分。\n4. 编写 Scala 程序读取只包含浮点数的文件。打印文件中数字的和、平均值和最小值。\n5. 编写 Scala\
  \ 程序将 2 的幂次及其倒数写入文件，指数从 0 到 20：1, 2, 0.5, 4, 0.25...\n6. 使用正则表达式搜索带引号的字符串，可能在 Java\
  \ 或 C++ 程序。编写 Scala 程序打印源文件中所有的此类字符串。\n7. 编写 Scala 程序读取文件并打印文件中所有不是浮点数的标记。使用正则表达式。\n\
  8. 编写 Scala 程序打印网页中所有 `img` 标签的 `src` 属性。使用正则表达式和分组。\n9. 编写 Scala 程序统计给定目录及其子目录中有多少\
  \ `.class` 扩展的文件。\n10. 扩展存储朋友集合的可序列化 `Person` 类。构造几个 `Person` 对象，让它们成为彼此的朋友，然后将\
  \ `Array[Person]` 保存到文件。读取数组并验证朋友关系完整。\n\n## 第 10 章 特性 (Traits)\n\n**本章主题** ![image](img/00008.jpeg)\n\
  \n- 10.1 为什么没有多重继承？——111 页\n- 10.2 作为接口的特性——113 页\n- 10.3 具有具体实现的特性——114 页\n- 10.4\
  \ 带有特性的对象——115 页\n- 10.5 分层特性——116 页\n- 10.6 重写特性中的抽象方法——117 页\n- 10.7 用于用于丰富接口的特性——118\
  \ 页\n- 10.8 特性中的具体字段——118 页\n- 10.9 特性中的抽象字段——119 页\n- 10.10 特性构造顺序——120 页\n- 10.11\
  \ 初始化特性字段——122 页\n\n\n\n\n### 10.12 扩展类的 Traits — 第 123\n- 10.13 自定义类型 ![image](img/00011.jpeg)\
  \ — 第 124\n- 10.14 内部原理 — 第 125\n- 练习题 — 第 127\n\n在本章中，你将学习如何使用 trait（特质）。类可以扩展一个或多个\
  \ trait，以利用 trait 提供的服务。trait 可能要求实现类支持某些功能。然而，与 Java 接口不同，Scala 的 trait 可以为这些功能提供默认实现，这使得它们有用得多。\n\
  \n本章的要点：\n- 类可以实现任意数量的 trait。\n- trait 可以要求实现类具有特定的字段、方法或父类。\n- 与 Java 接口不同，Scala\
  \ 的 trait 可以提供方法和字段的实现。\n- 当你层叠多个 trait 时，顺序是重要的——先执行方法的 trait 会被放在后面。\n\n### 10.1\
  \ 为什么没有多重继承？\n\nScala 和 Java 一样，不允许类继承自多个父类。起初，这看起来像是一个遗憾的限制。为什么一个类不能扩展多个类呢？某些编程语言（特别是\
  \ C++）允许多重继承——但其代价惊人。\n\n当你组合没有任何共同点的类时，多重继承工作得良好。但如果这些类具有共同的方法或字段，就会出现棘手的问题。这里有一个典型的例子。助教既是学生也是员工：\n\
  \n```scala\nclass Student {\n  def id: String = ...\n  ...\n}\n\nclass Employee\
  \ {\n  def id: String = ...\n  ...\n}\n```\n\n假设我们可以这样写：\n\n```scala\nclass TeachingAssistant\
  \ extends Student, Employee { // true 真实的 Scala 代码\n  ...\n}\n```\n\n不幸的是，这个 `TeachingAssistant`\
  \ 类继承了两个 `id` 方法。`myTA.id` 应该返回什么？学生 ID？员工 ID？还是？（在 C++ 中，你需要重新定义 `id` 方法来明确你的想要。）\n\
  \n接下来，假设 `Student` 和 `Employee` 都扩展一个共同的父类 `Person`：\n\n```scala\nclass Person {\n\
  \  var name: String = _\n}\n\nclass Student extends Person { ... }\nclass Employee\
  \ extends Person { ... }\n```\n\n这导致了菱形继承问题（参见 图 10–1）。我们只希望 `TeachingAssistant`\
  \ 内部有一个 `name` 字段，而不是两个。字段是如何合并的？字段是如何构造的？在 C++ 中，你使用“虚基类”这一复杂且脆弱的功能来解决这个问题。\n\n\
  ![image](img/00027.jpeg)\n\n**图 10–1 菱形继承必须合并共同字段。**\n\nJava 设计者非常担心这些复杂性，因此他们采取了非常严格的方法。类只能扩展一个父类；它可以实现任意数量的接口，但接口只能有抽象方法，而没有字段。\n\
  \n你通常想根据其他方法来实现某些方法，但在 Java 接口中无法这样做。因此，在 Java 中，同时提供接口和抽象基类是常见的，但这只是在把问题向后推。如果你需要扩展这些抽象基类中的两个该怎么办？\n\
  \nScala 使用 trait 代替接口。trait 可以既有抽象方法，也可以有具体方法，且类可以实现多个 trait。这完美地解决了 Java 接口的问题。你将在接下来的章节中看到\
  \ Scala 如何处理方法和字段冲突的危险性。\n\n### 10.2 作为接口的 Traits\n\n让我们从熟悉的内容开始。Scala 的 trait 工作方式可以和\
  \ Java 接口完全一样。例如：\n\n```scala\ntrait Logger {\n  def log(msg: String) // 一个抽象方法\n\
  }\n```\n\n注意，你不需要将方法声明为 `abstract`——trait 中未实现的方法自动是抽象的。\n\n子类可以提供实现：\n\n```scala\n\
  class ConsoleLogger extends Logger { // 使用 extends，而不是 implements\n  def log(msg:\
  \ String) { println(msg) } // 不需要重写\n}\n```\n\n在重写 trait 的抽象方法时，你不需要提供 `override`\
  \ 关键字。\n\n![image](img/00015.jpeg) 注意\nScala 没有用于实现 trait 的特殊关键字。正如你在整个章节中将看到的，trait\
  \ 比 Java 接口要相似得多。\n\n如果你需要多个 trait，请使用 `with` 关键字添加其他的 trait：\n\n```scala\nclass\
  \ TeachingAssistant extends Logger with Cloneable with Serializable\n```\n\n###\
  \ 10.3 具有具体实现的 Traits\n\n在 Scala 中，trait 的方法不需要是抽象的。例如，我们可以让 `ConsoleLogger` 一个\
  \ trait：\n\n```scala\ntrait ConsoleLogger {\n  def log(msg: String) { println(msg)\
  \ }\n}\n```\n\n这里是一个使用该 trait 的示例：\n\n```scala\nclass SavingsAccount extends Account\
  \ with ConsoleLogger {\n  def withdraw(amount: Double) {\n    if (amount > balance)\
  \ log(\"Insufficient funds\")\n    else balance -= amount\n  }\n  ...\n}\n```\n\n\
  注意 Scala 和 Java 的区别。`ConsoleLogger` 功能被“混入”了 `SavingsAccount` 类。在 Scala（以及其他允许这种操作的编程语言）中，我们说它是\
  \ mix in。\n\n![image](img/00015.jpeg) 注意\n据说“mix in”一词来自冰淇淋世界。在冰淇淋术语中，“mix in”是在给顾客之前揉入冰淇淋的添加物——这种做法取决于你的观点，是美味还是恶心。\n\
  \n![image](img/0018.jpeg) 注意\n具有具体行为的 trait 有一个缺点。当 trait 改变时，所有引入它的类必须重新编译。\n\n\
  ### 10.4 带有 Traits 的对象\n\n你可以在构造单个对象时为它添加 trait。为了设置示例，我们将使用标准库定义的 `Logged` trait。它就像我们的\
  \ `Logger`，只是带有一个什么都不做的实现：\n\n```scala\ntrait Logged {\n  def log(msg: String) {\
  \ }\n}\n```\n\n让我们在类定义中使用该 trait：\n\n```scala\nclass SavingsAccount extends Account\
  \ with Logged {\n  def withdraw(amount: Double) {\n    if (amount > balance) log(\"\
  Insufficient funds\")\n    else ...\n  }\n  ...\n}\n```\n\n现在，什么都没有被记录，这看起来可能没意义。但你可以在构造对象时“混入”一个更好的日志器。标准的\
  \ `ConsoleLogger` 扩展了 `Logged` trait：\n\n```scala\ntrait ConsoleLogger extends Logged\
  \ {\n  override def log(msg: String) { println(msg) }\n}\n```\n\n你可以在构造对象时添加这个 trait：\n\
  \n```scala\nval acct = new SavingsAccount with ConsoleLogger\n```\n\n\n\n\n\n当调用\
  \ `acct` 对象上的 `log` 方法时，会执行 `ConsoleLogger` trait 的 `log` 方法。\n\n当然，另一个对象可以添加一个不同的\
  \ trait：\n\n点击此处查看代码图像\n\n```scala\nval acct2 = new SavingsAccount with FileLogger\n\
  ```\n\n### 10.5 分层 trait (Layered Traits)\n\n你可以向一个类或对象添加多个 trait，这些 trait 会相互调用，并从*最后一个*开始调用。当你需要分阶段转换值时，这种方法非常有用。\n\
  \n这是一个简单的例子。我们可能想为所有的日志消息添加时间戳。\n\n点击此处查看代码图像\n\n```scala\ntrait TimestampLogger\
  \ extends Logged {\n  override def log(msg: String) {\n    super.log(new java.util.Date()\
  \ + \" \" + msg)\n  }\n}\n```\n\n此外，假设我们想像这样截断过于冗长的日志消息：\n\n点击此处查看代码图像\n\n```scala\n\
  trait ShortLogger extends Logged {\n  val maxLength = 15 // 见第 10.8 节 trait 中的字段\n\
  \  override def log(msg: String) {\n    super.log(\n      if (msg.length <= maxLength)\
  \ msg else msg.substring(0, maxLength - 3) + \"...\")\n    )\n  }\n}\n```\n\n注意，每个\
  \ `log` 方法都会将修改后的消息传递给 `super.log`。\n\n在 trait 中，`super.log` 的含义与类中*并不相同*。（如果是的话，那么这些\
  \ trait 就没用了——它们扩展了 `Logged`，而 `Logged` 的 `log` 方法什么都不做。）\n\n相反，`super.log` 调用 trait\
  \ 层次结构中的下一个 trait，这取决于 trait 添加的顺序。通常，trait 是从最后一个开始处理的。（请参见第 10.10 节 中的 Trait 构建顺序，位于第\
  \ 120 页，其中记录了当 trait 形成任意树而非简单链时产生的复杂细节。）\n\n为了理解为什么顺序很重要，请比较以下两个示例：\n\n点击此处查看代码图像\n\
  \n```scala\nval acct1 = new SavingsAccount with ConsoleLogger with\n  TimestampLogger\
  \ with ShortLogger\n\nval acct2 = new SavingsAccount with ConsoleLogger with\n \
  \ ShortLogger with TimestampLogger\n```\n\n如果我们透支了 `acct1`，我们会得到一条消息：\n\n点击此处查看代码图像\n\
  \nSun Feb 06 17:45:45 ICT 2011 Insufficient...\n\n你可以看到，`ShortLogger` 的 `log` 方法被首先调用，它对\
  \ `super.log` 的调用触发了 `TimestampLogger`。\n\n然而，透支 `acct2` 产生：\n\nSun Feb 06 1...\n\
  \n在这里，`TimestampLogger` 出现在 trait 列表的最后。它的 `log` 方法首先被调用，随后结果被截短。\n\n***\n\n![image](img/00015.jpeg)\
  \ 注意事项\n\n通过 trait，你无法从源码中判断 `super.someMethod` 调用了哪个方法。具体方法取决于使用它们的对象或类中 trait\
  \ 的排列顺序。这使得 `super` 比普通的继承关系要灵活得多。\n\n***\n\n***\n\n***\n\n![image](img/00014.jpeg)\
  \ 提示\n\n如果你需要控制调用哪个 trait 的方法，你可以在方括号中指定它：`super[ConsoleLogger].log(...)`。指定的类型必须是直接父类型（immediate\
  \ supertype）；你无法访问继承层次结构中更远的 trait 或类。\n\n***\n\n### 10.6 重写 trait 中的抽象方法\n\n让我们回到我们的\
  \ `Logger` trait，在 trait 中我们为 `log` 方法*没有提供任何实现*。\n\n点击此处查看代码图像\n\n```scala\ntrait\
  \ Logger {\n  def log(msg: String) // 此方法是抽象的\n}\n```\n\n现在，让我们像上一节那样用一个时间戳 trait\
  \ 来扩展这个 trait。遗憾的是，`TimestampLogger` 类不再通过编译。\n\n点击此处查看代码图像\n\n```scala\ntrait TimestampLogger\
  \ extends Logger {\n  override def log(msg: String) { // 重写了抽象方法\n    super.log(new\
  \ java.util.Date() + \" \" + msg) // super.log 是否定义了？\n  }\n}\n```\n\n编译器将对 `super.log`\
  \ 的调用标记为错误。\n\n在标准的继承规则下，这个调用永远是不可能的——`Logger.log` 方法没有实现。但实际上，正如你在上一节中看到的，并没有办法知道实际上调用的是哪一个\
  \ `log` 方法——这取决于 trait 混入的顺序。\n\nScala 认为 `TimestampLogger.log` 仍然是抽象的——它要求一个具体的\
  \ `log` 方法被混入。\n\n因此 `TimestampLogger.log` 仍然是抽象的——它需要一个具体的 `log` 方法被混入。\n\n点击此处查看代码图像\n\
  \n```scala\nabstract override def log(msg: String) {\n  super.log(new java.util.Date()\
  \ + \" \" + msg)\n}\n```\n\n### 10.7 用于丰富接口的 trait\n\ntrait 可以包含许多依赖于抽象方法的有用。一个例子是\
  \ Scala 的 `Iterator` trait，它定义了 `next` 和 `hasNext` 方法。\n\n让我们丰富我们相当贫乏的日志 API。通常，日志\
  \ API 让你指定日志消息的级别，以区分信息消息、警告或错误消息。\n\n```scala\ntrait Logger {\n  def info(msg:\
  \ String)\n  def warn(msg: String)\n  def severe(msg: String)\n  def log(msg: String)\n\
  }\n```\n\n在 trait 中使用具体和抽象方法非常常见。在 Java 中，你会声明一个接口和一个独立的类（如 `Collection` 或 `MouseListener`）。\n\
  \n### 10.8 trait 中的具体字段\n\ntrait 中的字段可以是具体的，也可以是抽象的。如果你提供了一个初始值，该字段就是具体的。\n\n点击此处查看代码图像\n\
  \n```scala\ntrait ShortLogger extends Logged {\n  val maxLength = 15 // 具体字段\n}\n\
  ```\n\n混入此 trait 的类会获得一个 `maxLength` 字段。通常，类会为其一个 trait 中的每个具体字段获得一个字段。这些字段不是继承来的，而是被添加到子类中的。这似乎是一个微妙的区别，但非常重要。让我们更仔细地观察这个过程。\n\
  \n点击此处查看代码图像\n\n```scala\nclass SavingsAccount extends Account with ConsoleLogger\
  \ with ShortLogger {\n  var interest = 0.0\n  def withdraw(amount: Double) {\n \
  \   if (amount > balance) log(\"Insufficient funds\")\n    else ...\n  }\n}\n```\n\
  \n注意我们的子类有一个字段 `interest`。那是子类中的普通字段。\n\n假设 `Account` 有一个字段。\n\n```scala\nclass\
  \ Account {\n  var balance = 0.0\n}\n```\n\n`SavingsAccount` 类通常的方式*继承*了该字段。一个 `SavingsAccount`\
  \ 对象是由其所有父类的字段组成的，加上子类中的任何字段。你可以认为一个 `SavingsAccount` 对象是“从”一个父类对象开始的”（参见图 10–2）。\n\
  \n![image](img/00028.jpeg)\n\n**图 10–2. trait 中的字段放置于子类中。**\n\n### 10.9 trait 中的抽象字段\n\
  \ntrait 中未初始化的字段是抽象的，必须在具体的子类中进行重写。\n\n\n\n\n例如，下面的 `maxLength` 字段是抽象的：\n\n点击此处查看代码图片\n\
  \n```scala\ntrait ShortLogger extends Logged {\n  val maxLength: Int // 一个抽象字段\n\
  \n  override def log(msg: String) {\n    super.log(\n      if (msg.length <= maxLength)\
  \ msg else msg.substring(0, maxLength - 3) + \"...\")\n    )\n    // maxLength 字段在实现中使用\n\
  \  }\n  ...\n}\n```\n\n当你在具体类中使用此 trait 时，你必须提供 `maxLength` 字段：\n\n点击此处查看代码图片\n\n\
  ```scala\nclass SavingsAccount extends Account with ConsoleLogger with ShortLogger\
  \ {\n  val maxLength = 20 // 不需要重写\n  ...\n}\n```\n\n现在，所有的日志消息在 20 个字符后都会被截断。\n\
  \n这种为 trait 参数提供值的方法在动态构建对象时特别方便。让我们回到最初的储蓄账户：\n\n点击此处查看代码图片\n\n```scala\nclass\
  \ SavingsAccount extends Account with Logged { ... }\n```\n\n现在，我们可以如下对实例进行消息截断：\n\
  \n点击此处查看代码图片\n\n```scala\nval acct = new SavingsAccount with ConsoleLogger with\
  \ ShortLogger {\n  val maxLength = 20\n}\n```\n\n### 10.10 trait 的构造顺序\n\n与类一样，trait\
  \ 也可以有构造函数，由 trait 实体中的字段初始化和其他语句组成。例如，\n\n点击此处查看代码图片\n\n```scala\ntrait FileLogger\
  \ extends Logger {\n  val out = new PrintWriter(\"app.log\") // trait 构造函数的一部分\n\
  \  out.println(\"# \" + new Date().toString) // 也是构造函数的一部分\n  def log(msg: String)\
  \ { out.println(msg); out.flush() }\n}\n```\n\n这些语句在包含该 trait 的任何对象的构造期间会被执行。\n\n\
  构造函数按以下顺序执行：\n\n-   首先调用父类的构造函数。\n-   trait 构造函数在父类构造函数之后、类构造函数之前执行。\n-   trait\
  \ 从左到右构造。\n-   在每个 trait 内部，父类先构造。\n-   如果多个 trait 共享同一个父类，且该父类已经构造过，则不会再次构造。\n\
  -   在所有 trait 构造完成后，构造子类。\n\n例如，考虑这个类：\n\n点击此处查看代码图片\n\n```scala\nclass SavingsAccount\
  \ extends Account with FileLogger with ShortLogger\n```\n\n构造函数的执行顺序如下：\n\n1. `Account`（父类）。\n\
  2. `Logger`（第一个 trait 的父类）。\n3. `FileLogger`（第一个 trait）。\n4. `ShortLogger`（第二个 trait）。注意，它的父类\
  \ `Logger` 已经构造过了。\n5. `SavingsAccount`（类）。\n\n***\n\n![image](img/00015.jpeg) 注意\n\
  \n构造函数的顺序是类*线性化*（linearization）的反序。线性化是对一个类型所有超类型的技术规范。它由以下规则定义：\n\n如果 `C` `extends`\
  \ `C[1]` `with` `C[2]` `with` . . . `with` `C[n]`，则 `lin`(`C`) = `C` » `lin`(`C[n]`)\
  \ » . . . » `lin`(`C*[2])`) » `lin`(`C*[1])`)\n\n在这里，» 表示“合并并去重，右侧胜出”。例如，\n\n`lin`(`SavingsAccount`)\
  \ = `SavingsAccount` » `lin`(`ShortLogger`) » `lin`(`FileLogger`) » `lin`(`Account`)\n\
  = `SavingsAccount` » (`ShortLogger` » `Logger`) » (`FileLogger` » `Logger`) » `lin`(`Account`)\n\
  = `SavingsAccount` » `ShortLogger` » `FileLogger` » `Logger` » `Account`。\n\n（为了简单，我省略了任何线性化末尾的\
  \ `ScalaObject`、`AnyRef` 和 `Any` 类型。）\n\n线性化给出了 trait 中 `super` 被解析的顺序。例如，在 `ShortLogger`\
  \ 中调用 `super` 会调用 `FileLogger` 方法，而在 `FileLogger` 中调用 `super` 会调用 `Logger` 方法。\n\
  \n***\n\n### 10.11 初始化 trait 字段\n\ntrait 不能有构造函数参数。每个 trait 都有一个单一的无参数构造函数。\n\n\
  ***\n\n![image](img/00015.jpeg) 注意\n\n有趣的是，缺少构造函数参数是 trait 和类之间*唯一*的技术区别。否则，trait\
  \ 可以拥有类的所有功能，例如具体字段、抽象字段以及父类。\n\n***\n\n这种限制对于需要某些自定义才能生效的 trait 来说可能是一个问题。考虑一个文件日志器。我们想要指定日志文件，但我们做不到。\n\
  \n点击此处查看代码图片\n\n```scala\nval acct = new SavingsAccount with ConsoleLogger with\
  \ ShortLogger {\n  val maxLength = 20\n}\n```\n\n\n\n```scala\noverride def getMessage()\
  \ = \"arggh!\"\n\n}\n```\n\ntrait 的父类成为我们类的父类（参见图 10–3）。\n\n![image](img/00029.jpeg)\n\
  \n**图 10–3。trait 的父类成为任何混入该 trait 的类的父类。**\n\n如果我们的类已经继承了另一个类怎么办？没关系，只要它是 trait\
  \ 父类的子类即可。例如，\n\n点击此处查看代码图片\n\n```scala\nclass UnhappyException extends IOException\
  \ with LoggedException\n```\n\n在这里 `UnhappyException` 继承了 `IOException`，而 `IOException`\
  \ 继承了 `Exception`。在混入 trait 时，它的父类已经存在，不需要再次添加。\n\n然而，如果我们的类继承了一个不相关的类，那么就无法混入该\
  \ trait。例如，你无法形成以下类：\n\n点击此处查看代码图片\n\n```scala\nclass UnhappyFrame extends JFrame\
  \ with LoggedException\n\n  // Error: Unrelated superclasses\n```\n\n不可能同时将 `JFrame`\
  \ 和 `Exception` 作为父类。\n\n### 10.13 Self Types ![image](img/00011.jpeg)\n\n当 trait\
  \ 继承一个类时，可以保证该父类存在任何混入该 trait 的类中。Scala 有另一种替代机制来保证这一点：*自类型（self types）*。\n\n当 trait\
  \ 以如下开头时\n\n```scala\nthis: Type =>\n```\n\n那么它只能被混入给定类型的子类中。\n\n让我们为 `LoggedException`\
  \ 使用这个特性：\n\n```scala\ntrait LoggedException extends Logged {\n  this: Exception\
  \ =>\n    def log() { log(getMessage()) }\n}\n```\n\n注意，该 trait *并没有*继承 `Exception`\
  \ 类。相反，它有一个 `Exception` 的自类型。这意味着它只能被混入 `Exception` 的子类中。\n\n在 trait 的方法中，我们可以调用自类型的任何方法。例如，在\
  \ `log` 方法中对 `getMessage()` 的调用是有效的，因为我们知道 `this` 必须是一个 `Exception`。\n\n如果你尝试将该\
  \ trait 混入一个不符合自类型的类，就会发生错误。\n\n点击此处查看代码图片\n\n```scala\nval f = new JFrame with\
  \ LoggedException\n\n// Error: JFrame isn't a subtype of Exception, the self type\
  \ of LoggedException\n```\n\n带有自类型的 trait 与带有父类型的 trait 类似。在这两种情况下，它都确保了某个类型存在于混入该\
  \ trait 的类中。\n\n在某些情况下，自类型的表示法比带有父类型的 trait 更具灵活。自类型可以处理 trait 之间的循环依赖。当你有两个相互需要的\
  \ trait 时，这种情况就会发生。\n\n自类型还可以处理**结构化类型（structural types）*——即仅指定类必须拥有的方法，而不指明类名。这里是使用结构化类型的\
  \ `LoggedException`：\n\n```scala\ntrait LoggedException extends Logged {\n  this:\
  \ { def getMessage() : String } =>\n    def log() { log(getMessage()) }\n}\n```\n\
  \n该 trait 可以混入任何具有 `getMessage` 方法的类。\n\n我们将在第 18 章中更详细地讨论自类型和结构化类型。\n\n### 10.14\
  \ 底层发生了什么\n\nScala 需要将 trait 翻译为 JVM 的类和接口。你不需要知道如何实现，但你可能会发现这对理解 trait 的工作原理很有帮助。\n\
  \n只有抽象方法的 trait 会被简单的转换为 Java 接口。例如，\n\n```scala\ntrait Logger {\n  def log(msg:\
  \ String)\n}\n```\n\n变为\n\n点击此处查看代码图片\n\n```java\npublic interface Logger { // Generated\
  \ Java interface\n  void log(String msg);\n}\n```\n\n如果 trait 具有具体方法，则会创建一个伴类（companion\
  \ class），其静态方法持有 trait 方法的代码。例如，\n\n```scala\ntrait ConsoleLogger extends Logger\
  \ {\n  def log(msg: String) { println(msg) }\n}\n```\n\n变为\n\n点击此处查看代码图片\n\n```java\n\
  public interface ConsoleLogger extends Logger { // Generated Java interface\n  void\
  \ log(String msg);\n}\n\npublic class ConsoleLogger$class { // Generated Java companion\
  \ class\n  public static void log(ConsoleLogger self, String msg) {\n    println(msg);\n\
  \  }\n}\n```\n\n这些伴类没有任何字段。trait 中的字段会在接口中产生抽象的 getter 和 setter。当类实现该 trait 时，字段会被添加到该类中。\n\
  \n例如，\n\n```scala\ntrait ShortLogger extends Logger {\n  val maxLength = 15 // A\
  \ concrete field\n  ...\n}\n```\n\n被翻译为\n\n点击此处查看代码图片\n\n```java\npublic interface\
  \ ShortLogger extends Logger{\n  public abstract int maxLength();\n  public abstract\
  \ void weird_prefix$maxLength_$eq(int);\n  ...\n}\n```\n（注：此处原文中存在大量乱码和重复字符，已根据逻辑清理输出）\n\
  \n```java\npublic interface ShortLogger extends Logger{\n  public abstract int maxLength();\n\
  \  public abstract void weird_prefix$maxLength_$eq(int);\n  ...\n}\n```\n\n奇怪的 setter\
  \ 是 `weird_prefix$maxLength_$eq`。\n\n\n\n\n\n**7.** 有几十个 Scala trait 教程，里面充斥着吠叫的狗或哲学的青蛙等愚蠢例子。阅读这些刻意的层级结构可能很枯燥且没太大帮助，但设计你自己的会非常有启发性。编写一个你自己的愚蠢\
