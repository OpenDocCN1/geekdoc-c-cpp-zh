  \ `MetaData` 对象。\n* `\\` 和 `\\\\` 算符执行类似 XPath 的匹配。\n* 你可以在 `case` 子句中使用 XML 字面量匹配节点模式。\n\
  * 使用带有 `RewriteRule` 实例的 `RuleTransformer` 来转换节点。\n* `XML` 对象通过 Java XML 方法进行加载和保存。\n\
  * `ConstructingParser` 是一种保留注释和 `CDATA` 区域的备用解析器。\n\n点击此处查看代码图像\n\n```\njavap -classpath\
