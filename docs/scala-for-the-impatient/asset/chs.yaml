  ### 15.7 错误与警告的注解\n\n`@deprecated` 注解在每次使用功能时都会生成警告。该注解有两个可选参数：`message` 和 `since`。\n\
  \n点击此处查看代码图片\n\n```scala\n@deprecated(message = \"Use factorial(n) instead\", since\
  \ = \"2.10\")\ndef factorial(n: Int): Int\n```\n\n`@deprecatedName` 应用于参数，它指定了参数的旧名称。\n\
