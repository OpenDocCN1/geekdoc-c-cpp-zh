  val printer = new PrettyPrinter(width = 100, step = 4)\nval str = printer.formatNodes(nodeSeq)\n\
  ```\n\n### 16.12 命名空间\n\n在 XML 中，命名空间用于避免名称冲突，类似于 Java 或 Scala 中的包。然而，XML 命名空间是一个\
  \ URI（通常是 URL），例如：\n\n`http://www.w3.org/1999/xhtml`\n\n`xmlns` 属性声明命名空间，例如：\n\n\
  点击此处查看代码图片\n\n```xml\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n  <head>...</head>\n\
  \  <body>...</body></body></body>\n</html>\n```\n\n`html` 元素及其后代元素（`head`、`body`\
  \ 等）被放置在此命名空间中。\n\n后代元素可以引入自己的命名空间，例如：\n\n点击此处查看代码图片\n\n```xml\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ width=\"100\" height=\"100\">\n  <rect x=\"25\" y=\"25\" width=\"50\" height=\"\
  50\" fill=\"#ff0000\"/>\n</svg>\n```\n\n在 Scala 中，每个元素都有类型为 `NamespaceBinding` 的\
  \ `scope` 属性。该类的 `uri` 属性产生命名空间 URI。\n\n如果你想混合来自多个命名空间的元素，处理命名空间 URL 会非常繁琐。另一种方案是使用*命名空间前缀*。例如，标签：\n\
  \n点击此处查看代码图片\n\n```xml\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n   xmlns:svg=\"\
  http://www.w3.org/2000/svg\">\n```\n\n为命名空间 `http://www.w3.org/2000/svg` 引入了前缀 `svg`。所有带有\
  \ `svg:` 前缀的元素都属于该命名空间。例如：\n\n点击此处查看代码图片\n\n```xml\n<svg:svg width=\"100\" height=\"\
  100\">\n  <svg:rect x=\"25\" y=\"25\" width=\"50\" height=\"50\" fill=\"#ff0000\"\
  />\n</svg:svg>\n```\n\n回想 第 16.9 节修改元素和属性](#part0022.html_ch16lev1sec9)”，第 222 页提到的，每个\
  \ `Elem` 对象都是唯一的。\n\n\n\n\n\n在 Scala 中，你可以使用类型参数来实现可以处理多种类型的类和函数。例如，`Array[T]` 存储任意类型\
  \ `T` 的元素。基本原理非常简单，但细节可能会变得复杂。有时，你需要对类型进行限制。例如，为了对元素进行排序，`T` 必须提供排序规则。此外，如果参数类型发生变化，泛化类型会发生什么？例如，你可以将\
  \ `Array[String]` 传递给一个期望 `Array[Any]` 的函数吗？在 Scala 中，你可以指定类型如何根据其参数发生变化。\n\n本章的关键点是：\n\
  \n- 类、特质、方法和函数可以拥有类型参数。\n- 将类型参数放在名称之后，并括在方括号中。\n- 类型边界（Bounds）的形式为 `T <: UpperBound`、`T\
  \ >: LowerBound`、`T <% ViewBound`、`T : ContextBound`。\n- 你可以使用类型约束来限制方法，例如 `(implicit\
  \ ev: T <:< UpperBound)`。\n- 使用 `+T`（协变）表示泛型类型的子类关系与参数 `T` 的方向相同，或使用 `-T`（逆变）表示反方向。\n\
  - 协变适用于表示输出的参数，例如不可变集合中的元素。\n- 逆变适用于表示输入的参数，例如函数参数。\n\n### 17.1 泛型类\n\n与 Java 或\
  \ C++ 一样，类和特质可以拥有类型参数。在 Scala 中，你使用方括号作为类型参数，例如：\n\n点击此处查看代码图片\n\n```scala\nclass\
  \ PairT, S\n```\n\n这定义了一个拥有两个类型参数 `T` 和 `S` 的类。你在类定义中使用这些类型参数来定义变量、方法参数和返回值的类型。\n\
  \n带有一个或多个类型参数的类是泛型类。如果你用实际类型替换类型参数，就会得到一个普通类，例如 `Pair[Int, String]`。\n\n令人愉快的是，Scala\
  \ 尝试从构造参数中推断出实际类型：\n\n点击此处查看代码图片\n\n```scala\nval p = new Pair(42, \"String\") //\
  \ 它是一一个 Pair[Int, String]\n```\n\n你也可以自己指定类型：\n\n点击此处查看代码图片\n\n```scala\nval p2\
  \ = new PairAny, Any\n```\n\n### 17.2 泛型函数\n\n函数和方法也可以拥有类型参数。这里有一个简单的示例：\n\n点击此处查看代码图片\n\
  \n```scala\ndef getMiddleT = a(a.length / 2)\n```\n\n与泛型类一样，你将类型参数放在名称之后。\n\nScala\
  \ 从调用中的参数推断出实际类型。\n\n点击此处查看代码图片\n\n```scala\ngetMiddle(Array(\"Mary\", \"had\",\
  \ \"a\", \"little\", \"lamb\")) // 调用 getMiddle[String]\n```\n\n如果需要，你可以指定类型：\n\n\
  点击此处查看代码图片\n\n```scala\nval f = getMiddle[String] _ // 函数保存存在 f 中\n```\n\n### 17.3\
  \ 类型变量的边界\n\n有时，你需要对类型变量进行限制。考虑一个 `Pair` 类型，其中两个组件具有相同类型，如下所示：\n\n点击此处查看代码图片\n\n\
  ```scala\nclass PairT\n```\n\n现在我们想添加一个产生较小值的方法：\n\n点击此处查看代码图片\n\n```scala\nclass\
  \ PairT {\n  def smaller = if (first.compareTo(second) < 0) first else second //\
  \ 错误\n}\n```\n\n这是错误的——我们不知道 `first` 是否有 `compareTo` 方法。为了解决这个问题，我们可以添加一个上边界 `T\
  \ <: Comparable[T]`。\n\n点击此处查看代码图片\n\n```scala\nclass Pair[T <: Comparable[T]](val\
  \ first: T, val second: T) {\n  def smaller = if (first.compareTo(second) < 0) first\
  \ else second\n}\n```\n\n这意味着 `T` 必须是 `Comparable[T]` 的子类。\n\n现在我们可以实例化 `Pair[java.lang.String]`，但不能实例化\
  \ `Pair[java.io.File]`，因为 `String` 是 `Comparable[String]` 的子类，而 `File` 没有实现 `Comparable[File]`。例如：\n\
  \n```scala\nval p = new Pair(\"Fred\", \"Brooks\")\nprintln(p.smaller) // 打印 Brooks\n\
  ```\n\n***\n\n![image](img/00018.jpeg) 注意\n\n这个示例有点简单。如果你尝试 `new Pair(4, 2)`，你会被收到\
  \ de 对于 `T` = `Int`，边界 `T <: Comparable[T]` 不满足。与 `java.lang.Integer` 包装类型不同，Scala\
  \ 的 `Int` 类型没有实现 `Comparable`。然而，`RichInt` 实现了 `Comparable[Int]`。参见查看边界 获取有关隐式转换的信息。\n\
  \n***\n\n### 17.4 视图边界边界\n\n在前一节中，我们有一个上边界：\n\n```scala\nclass Pair[T <: Comparable[T]]\n\
  ```\n\n遗憾的是，如果你省略了下边界，编译器会抱怨 `Int` 不是 `Comparable[Int]` 的子类。解决方案是使用下边界。这里有一个尝试：\n\
  \n```scala\nclass PairT {\n  def smaller = if (first.compareTo(second) < 0) first\
  \ else second\n}\n```\n\n但我们可以做得更好。假设我们有一个 . 解决方案是使用这样的视图边界：\n\n```scala\nclass\
  \ Pair[T <% Comparable[T]]\n```\n\n`<%` 关系意味着 `T` 可以通过隐式转换转换为 `Comparable[T]`。\n\
  \n***\n\n![image](img/00015.jpeg) 备注\n\n使用 `Ordered` 特质会更好，它为 `Comparable` 添加了关系运算符：\n\
  \n点击此处查看代码图片\n\n```scala\nclass Pair[T <% Ordered[T]](val first: T, val second:\
  \ T) {\n  def smaller = if (first < second) first else second\n}\n```\n\n我在前一节中没有这样做是因为\
  \ `java.lang.String` 实现了 `Comparable[String]` 但没有实现 `Ordered[String]`。有了视图边界，这个问题就不存在了。字符串可以隐式转换为\
  \ `RichString`，它是 `Ordered[String]` 的子类。\n\n***\n\n### 17.5 上下文边界\n\n视图边界 `T <%\
  \ V` 要求存在从 `T` 到 `V`。*上下文边界*的形式为 `T : M`，其中 `M` 是另一个泛型类型。它要求存在类型为 `M[T]` 的“隐式值”。我们在第\
  \ 21 章中详细讨论。\n\n例如，\n\n```scala\nclass Pair[T : Ordering]\n```\n\n要求存在类型为 `Ordering[T]`\
  \ 的隐式值。该隐式值可以在类的方法中使用。当你声明使用该隐式值的方法时，你必须添加一个“隐式参数”。这里有一个示例：\n\n点击此处查看代码图片\n\n```scala\n\
  class PairT : Ordering {\n  def smaller(implicit ord: Ordering[T]) =\n}\n```\n\n\
  \n\n\n\n```scala\nif (ord.compare(first, second) < 0) first else second\n}\n```\n\
  \n正如你在第 21 章中所看到的，隐式值（implicit values）比隐式转换更灵活。\n\n### 17.6 显式上下文边界 (Manifest Context\
  \ Bound)\n\n为了实例化泛型 `Array[T]`，需要一个 `Manifest[T]` 对象。对于原始类型数组的正确工作是必要的。例如，如果 `T`\
  \ 是 `Int`，你希望在虚拟机中得到 `int[]` 数组。在 Scala 中，`Array` 是一个库类，编译器不会对其进行特殊处理。如果你编写了一个构造泛型数组的泛型函数，你需要帮助它并传递该\
  \ manifest 对象。由于它是构造函数的隐式参数，你可以使用上下文边界（context bound），如下：\n\n点击此处查看代码图片\n\n```scala\n\
  def makePairT : Manifest = {\n  val r = new ArrayT; r(0) = first; r(1) = second;\
  \ r\n}\n```\n\n如果你调用 `makePair(4, 9)`，编译器会找到隐式的 `Manifest[Int]` 并实际调用 `makePair(4,\
  \ 9)(intManifest)`。然后该方法调用 `new Array(2)(intManifest)`，返回一个原始数组 `int[2]`。\n\n为什么这些这么复杂？在虚拟机中，泛型类型被擦除了。只有一个\
  \ `makePair` 方法需要适用于所有类型 `T`。\n\n### 17.7 多重边界 (Multiple Bounds)\n\n一个类型变量可以同时拥有上界和一个下界。语法如下：\n\
  \n`T <: Lower >: Lower`\n\n你不能有多个上界或多个下界。然而，你仍然可以要求一个类型实现多个 trait（特征类），如下：\n\n点击此处查看代码图片\n\
  \n```scala\nT <: Comparable[T] with Serializable with Cloneable\n```\n\n你可以有多个一个视图边界（view\
  \ bound）：\n\n`T <% Comparable[T] <% String`\n\n你也可以有多个上下文边界：\n\n`T : Ordering :\
  \ Manifest`\n\n### 17.8 类型约束 ![image](img/00009.jpeg)\n\n类型约束为你提供了另一种限制类型的方法。你可以使用三种关系：\n\
  \n`T =:= U`\n\n`T <:< U`\n\n`T <%< U`\n\n这些约束测试 `T` 是否等于 `U`、是否是 `U` 的子类型，或者是否可以转换为\
  \ `U`。要使用此类约束，你需要如下所示添加一个“隐式证据参数”（implicit evidence parameter）：\n\n点击此处查看代码图片\n\n\
  ```scala\nclass PairT(implicit ev: T <:< Comparable[T])\n```\n\n***\n\n![image](img/00015.jpeg)\
  \ 注意\n\n这些约束并不是语言内置的。它们是 Scala 库的功能。请参第 21 章 获取对这种奇怪语法的解释，并分析类型约束的内部原理。\n\n***\n\
  \n在上面的示例中，使用类型约束相比于类型边界 `class Pair[T <: Comparable[T]]` 并没有优势。然而，类型约束在某些特殊情况下非常有用。在本节中，你将看到类型约束两种用法。\n\
  \n类型约束允许你在泛型类中提供一个方法，该方法只能在特定条件下使用。这里有一个例子：\n\n点击此处查看代码图片\n\n```scala\nclass PairT\
  \ {\n  def smaller(implicit ev: T <:< Ordered[T]) =\n    if (first < second) first\
  \ else second\n}\n```\n\n你可以形成一个 `Pair[File]`，即使 `File` 没有有序。只有当你调用 `smaller` 方法时才会得到错误。\n\
  \n另一个例子是 `Option` 类中的 `orNull` 方法：\n\n点击此处查看代码图片\n\n```scala\nval friends = Map(\"\
  Fred\" -> \"Barney\", ...)\nval friendOpt = friends.get(\"Wilma\") // 一个 Option[String]\n\
  val friendOrNull = friendOpt.orNull // 一个 String 或 null\n```\n\n`orNull` 方法在处理 Java\
  \ 代码时非常有用，因为在 Java 中通常将缺失值编码为 `null`。但它不能应用于像 `Int` 这样没有 `null` 作为有效值的取值类型。因为 `orNull`\
  \ 是使用约束 `Null <:< A` 实现的，只要这些这些实例使用 `orNull`，你仍然实例化 `Option[Int]`。\n\n类型约束的另一个用途是改进类型推断。考虑\n\
  \n点击此处查看代码图片\n\n```scala\ndef firstLast[A, C <: Iterable[A]](it: C) = (it.head,\
  \ it.last)\n```\n\n当你调用\n\n`firstLast(List(1, 2, 3))`\n\n你会收到一条消息，说明推断出的类型参数 `[Nothing,\
  \ List[Int]]` 不符合 `[A, C <: Iterable[A]]`。为什么是 `Nothing`？类型推断器无法从 `List(1, 2, 3)`\
  \ 确定 `A` 是什么，因为它在一步中同时匹配了 `A` 和 `C`。为了帮助它，首先匹配 `C` 然后匹配 `A`：\n\n点击此处查看代码图片\n\n```scala\n\
  def firstLastA, C(implicit ev: C <:< Iterable[A]) =\n  (it.head, it.last)\n```\n\
