  \n```scala\nfrequencies(c) = frequencies.getOrElse(c, 0) + 1\n```\n\n为什么这行不通？如果他改用以下代码，行得通吗？\n\
  \n点击此处查看代码图片 import scala.collection.JavaConversions.asScalaConcurrentMap\n\nval\
  \ frequencies: scala.collection.mutable.ConcurrentMap[Char, Int] =\n  new java.util.concurrent.ConcurrentHashMap[Char,\
  \ Int]\n```\n\n10. Harry Hacker 将文件读取到字符串中，并想使用并行集合来并发更新字符串部分的字母频率。他使用了以下代码：\n\n\
  ```scala\nval frequencies = new scala.collection.mutable.HashMap[Char, Int]\nfor\
