  \n[content]\n5. 编写一个 `Scala` 方法，返回一个包含文件所有行的字符串。在 Java 中调用它。\n\n6. 编写一个带有 `volatile`\
  \ `Boolean` 字段的 `Scala` 对象。让一个线程睡眠一段时间，然后将字段设置为 `true`，打印一条消息并退出。另一个线程将不断检查该字段是否为\
  \ `true`。如果是，则打印消息并退出；如果不是，则睡眠一小会儿并重试。如果变量不是 `volatile` 的，会发生什么？\n\n7. 给出一个例子，说明当方法可以被重写时，尾递归优化是无效的。\n\
  \n8. 向对象添加 `allDifferent` 方法，编译并查看字节码。`@specialized` 注解生成了哪些方法？\n\n9. `Range.foreach`\
  \ 方法被标记为 `@specialized(Unit)`。为什么？通过运行以下命令查看字节码\n\n点击此处查看代码图像\n\n```\njavap -classpath\
  \ /path/to/scala/lib/scala-library.jar\nscala.collection.immutable.Range\n```\n\n\
  并考虑 `Function1` 上的 `@specialized` 注解。在 Scaladoc 中点击 `Function1.scala` 链接查看它们。\n\n\
  10. 在 `factorial` 方法中添加 `assert(n >= 0)`。在启用断言的情况下编译，并验证 `factorial(-1)` 是否抛出异常。在不启用断言的情况下编译。发生了什么？使用\
  \ `javap` 检查断言调用发生了什么。\n\n## 第 16 章. XML 处理\n\n## 本章主题 ![image](img/00010.jpeg)\n\
  \n* 16.1 XML 字面量 — 第 214 页\n* 16.2 XML 节点 — 第 214 页\n* 16.3 元素属性 — 第 216 页\n* 16.4\
  \ 嵌入表达式 — 第 217 页\n* 16.5 属性中的表达式 — 第 218 页\n* 16.6 罕见节点类型 — 第 219 页\n* 16.7 类似\
  \ XPath 的表达式 — 第 220 页\n* 16.8 模式匹配 — 第 221 页\n* 16.9 修改元素和属性 — 第 222 页\n* 16.10\
  \ 转换 XML — 第 223 页\n* 16.11 加载与保存 — 第 223 页\n* 16.12 命名空间 — 第 226 页\n* 练习 — 第 227\
  \ 页\n\nScala 对 XML 字面量有内置支持，这使得在程序中生成 XML 片变得简单。Scala 库包含了对常用 XML 处理任务的支持。在本章中，你将学习如何利用这些功能来读取、分析、创建和写入\
  \ XML。\n\n\n\n\n如果你觉得在 XML 字面量中处理实体引用（entity references）不方便，可以使用字符引用：`<img alt=\"\
  San Jos&#233; State University Logo\" .../>`。\n\n* * *\n\n如果你确定属性中没有未解析的实体，可以简单地调用\
  \ `text` 方法将节点序列转换为字符串：\n\n```scala\nval url = elem.attributes(\"href\").text\n\
  ```\n\n如果属性不存在，`()` 运算符将返回 `null`。如果你不喜欢与 `null` 打交道，可以使用 `get` 方法，它返回一个 `Option[Seq[Node]]`。\n\
  \n遗憾的是，`MetaData` 类没有 `getOrElse` 方法，但你可以对 `get` 返回的 `Option` 应用 `getOrElse`：\n\n\
  点击此处查看代码图片\n\n```scala\nval url = elem.attributes.get(\"href\").getOrElse(Text(\"\
  \"))\n```\n\n要遍历所有属性，请使用\n\n```scala\nfor (attr <- elem.attributes)\n  process attr.key\
  \ and attr.value.text\n```\n\n或者，调用 `asAttrMap` 方法：\n\n点击此处查看代码图片\n\n```scala\n\
  val image = <img alt=\"TODO\" src=\"hamster.jpg\"/>\nval map = image.attributes.asAttrMap\
  \ // Map(\"alt\" -> \"TODO\", \"src\" -> \"hamster.jpg\")\n```\n\n### 16.4 嵌入表达式\n\
  \n你可以在 XML 字面量内部包含 Scala 代码块来动态计算项目。例如：\n\n点击此处查看代码图片\n\n```xml\n<ul><li>{items(0)}</li><li>{items(1)}</li></ul>\n\
  ```\n\n每个块都会被求值，其结果会被插到 XML 树中。\n\n如果块产生一个节点序列，这些节点将直接添加到 XML 中。其他所有内容都会转换为 `Atom[T]`，即类型\
  \ `T` 的容器。通过这种方式，你可以在 XML 树中存储任意值。你可以通过 `data` 属性从 `Atom` 节点获取值。\n\n在很多情况下，人们并不关心从原子中提取项目。当\
  \ XML 文档保存时，每个原子都会通过对 `data` 属性调用 `toString` 转换为字符串。\n\n* * *\n\n![image](img/00018.jpeg)\
  \ 注意事项\n\n可能让你惊讶的是，嵌入字符串不会转换为 `Text` 节点，而是转换为 `Atom[String]` 节点。这并不完全相同——`Text`\
  \ 是 `Atom[String]` 的子类。在保存文档时这并不重要。但如果你之后对 `Text` 节点进行模式匹配，匹配将失败。在这种情况下，你应该插入 `Text`\
  \ 节点而不是字符串：\n\n点击此处查看代码图片\n\n```xml\n<li>{Text(\"Another item\")}</li>\n```\n\n\
  * * *\n\n你不仅可以在 XML 中嵌套 Scala，嵌套的 Scala 代码也可以再次包含 XML 字面量。例如，如果你有一个项目列表，你将希望将每个项目放在\
  \ `li` 元素内部：\n\n点击此处查看代码图片\n\n```xml\n<ul>{for (i <- items) yield li>{i}</li>}</ul>\n\
  ```\n\n我们在 `ul` 元素内部有一个 Scala 块 `<ul>{...}</ul>`。该块产生一个 XML 表达式序列。\n\n```scala\n\
  for (i <- items) yield an XML literal\n```\n\n该 XML 字面量 `<li>...</li>` 另一个 Scala\
  \ 块！\n\n```xml\n<li>{i}</li>\n```\n\n这是 Scala 嵌套 XML 嵌套 Scala 嵌套 XML。如果有人去想它，大脑会眩晕。但如果不去想，这是一个非常自然的构造：创建一个\
  \ `ul`，为 `items` 中的每个元素包含一个 `li`。\n\n* * *\n\n![image](img/00015.jpeg) 注意\n\n要在\
  \ XML 字面量中放入左括号或右大括号，请使用双大括号：\n\n点击此处查看代码图片\n\n```xml\n<h1>The Natural Numbers {{1,\
  \ 2, 3, ...}}</h1>\n```\n\n这产生了：\n\n点击此处查看代码图片\n\n```xml\n<h1>The Natural Numbers\
  \ {1, 2, 3, ...}</h1>\n```\n\n* * *\n\n### 16.5 属性中的表达式\n\n你可以用 Scala 表达式计算属性值，例如：\n\
  \n点击此处查看代码图片\n\n```xml\n<img src={makeURL(fileName)}/>\n```\n\n在这里，`makeURL` 函数返回一个字符串，该字符串成为属性值。\n\
  \n* * *\n\n![image](img/00018.jpeg) 注意事项\n\n引号字符串内的大括号*不会*被评估。例如，\n\n```xml\n<img\
  \ src=\"{makeURL(fileName)}\"/>\n```\n\n这会将 `src` 属性设置为字符串 `\"{makeURL(fileName)}\"\
  `，这可能不是你想要的。\n\n* * *\n\n嵌入的块也可以产生节点序列。如果你想在属性中包含实体引用或原子，这可能是很有用的：\n\n```xml\n<a\
  \ id={new Atom(1)} />\n```\n\n如果嵌入的块返回 `null` 或 `None`，则属性未设置。例如：\n\n```xml\nval\
  \ url = elem.attributes(\"href\").text\n```\n\n（注：剩余文本包含重复/损坏的句子，已省略）。\n\n\n\n\n\
  ![image](img/00018.jpeg) 注意\n\n与 XPath 不同，你不能使用单个 `\\` 从多个节点中提取属性。例如，如果文档包含多一个 `img`\
  \ 元素，`doc \\\\ \"img\" \\ \"@src\"` 将无法工作。请改用 `doc \\\\ \"img\" \\\\ \"@src\"`。\n\
  \n* *\n\n`\\` 或 `\\\\` 的结果是一个节点序列。它可能是一个单个节点，但除非你确定知道这一点，否则你应该遍历该序列。例如：\n\n```\n\
  for (n <- doc \\\\ \"img\") process n\n```\n\n如果你直接对 `\\` 或 `\\\\` 的结果调用 `text`，则结果序列中的所有文本将合并在一起。例如：\n\
  \n点击此处查看代码图片\n\n```scala\n(<img src=\"hamster.jpg\"/><img src=\"frog.jpg\"/> \\\\\
  \ \"@src).text\n```\n\n返回一个字符串 `\"hamster.jpgfrog.jpg\"`。\n\n### 16.8 模式匹配\n\n你可以在模式匹配表达式中使用\
  \ XML 字面量。例如：\n\n```scala\nnode match {\n  case <img/> => ...\n  ...\n}\n```\n\n\
  如果 `node` 是一个带有*任何*属性且*没有*子元素的 `img` 元素，则第一个匹配将成功。\n\n处理子元素有点复杂。你可以通过以下方式匹配单个子元素：\n\
  \n```scala\ncase <li>{_}</li> => ...\n```\n\n然而，如果 `li` 有多个子元素，例如 `<li>An <em>important</em>\
  \ item</li>`，则匹配将失败。要匹配任意数量的项，请使用：\n\n```scala\ncase <li>{_*}</li> => ...\n```\n\
  \n注意大括号——它们可能会让你想起 XML 字面量的嵌入代码表示法。然而，在 XML 模式内部，大括号表示代码模式，而不是要评估的代码。\n\n你可以使用变量名代替通配符指示符。匹配结果将绑定到变量上。\n\
  \n```scala\ncase <li>{child}</li> => child.text\n```\n\n要匹配文本节点，使用类似类匹配（case class\
  \ match）：\n\n```scala\ncase <li>{Text(item)}</li> => item\n```\n\n要将变量绑定到节点序列，请使用以下语法：\n\
  \n点击此处查看代码图片\n\n```scala\ncase <li>{children @ _*}</li> => for (c <- children) yield\
  \ c\n```\n\n* *\n\n![image](img/00018.jpeg) 注意\n\n在这种匹配中，`children` 是一个 `Seq[Node]`\
  \ 而*不是* `NodeSeq`。\n\n* *\n\n你只能在 `case` 子句中使用一个节点。例如，以下是不合法的：\n\n```scala\ncase\
  \ <p>{_*}</p><br/> => ... // 不合法\n```\n\nXML 模式不能有属性。\n\n```scala\ncase <img alt=\"\
  TODO\"/> => ... // 不合法\n```\n\n要匹配属性，请使用守卫（guard）：\n\n点击此处查看代码图片\n\n```scala\ncase\
  \ n @ <img/> if (n.attributes(\"alt\").text == \"TODO\") => ...\n```\n\n### 16.9\
  \ 修改元素和属性\n\n在 Scala 中，XML 节点和节点序列是不可变的。如果你想编辑一个节点，必须创建它的副本，进行任何更改并复制未更改的内容。\n\n\
  要复制 `Elem` 节点，请使用 `copy` 方法。它有五个命名参数：熟悉的 `label`、`attributes` 和 `child`，以及用于命名空间的\
  \ `prefix` 和 `scope`（参见第 16.12 节命名空间，第 226 页）。你未指定的任何参数将从原始元素复制。例如：\n\n点击此处查看代码图片\n\
  \n```scala\nval list = <ul><li>Fred</li><li>Wilma</li></ul>\nval list2 = list.copy(label\
  \ = \"ol\")\n```\n\n这创建了 `list` 的副本，将 `label` 从 `ul` 改为 `ol`。子元素是共享的，但由于节点序列是不可变的，这没没的。\n\
  \n要添加子元素，可以这样调用 `copy`：\n\n点击此处查看代码图片\n\n```scala\nlist.copy(child = list.child\
  \ ++ <li>Another item</li>)\n```\n\n要添加或更改属性，请使用 `%` 运算符：\n\n点击此处查看代码图片\n\n```scala\n\
  val image = <img src=\"hamster.jpg\"/>\nval image2 = image % Attribute(null, \"\
  alt\", \"An image of a hamster\", Null)\n```\n\n第一个参数是命名空间。最后一个是额外的元数据列表。就像 `Node`\
  \ 扩展 `NodeSeq` 一样，`Attribute` 特性扩展了 `MetaData`。要添加多个属性，你可以链式调用它们：\n\n点击此处查看代码图片\n\
  \n```scala\nval image3 = image % Attribute(null, \"alt\", \"An image of a frog\"\
  ,\n  Attribute(null, \"src\", \"An image of a hamster\", Null))\n```\n\n\n\n\n\n\
