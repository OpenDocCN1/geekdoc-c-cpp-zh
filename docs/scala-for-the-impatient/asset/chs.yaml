  \n点击此处查看代码图片\n\n`<!-- unknown entity nbsp; -->`\n\n如果你恰好读取一个 XHTML 文件，可以使用 `XhtmlParser`\
  \ 子类：\n\n点击此处查看代码图片\n\n```scala\nval parser = new XhtmlParser(scala.io.Source.fromFile(\"\
  myfile.html\"))\nval doc = parser.initialize.document\n```\n\n否则，你需要将实体添加到解析器的实体映射中。例如：\n\
  \n点击此处查看代码图片\n\n```scala\nparser.ent ++= List(\n  \"nbsp\" -> ParsedEntityDecl(\"\
  nbsp\", IntDef(\"\\u00A0\")),\n  \"eacute\" -> ParsedEntityDecl(\"eacute\", IntDef(\"\
  \\u00E9\"))\n)\n```\n\n要将 XML 文档保存到文件，请使用 `save` 方法：\n\n```scala\nXML.save(\"myfile.xml\"\
  , root)\n```\n\n该方法接受三个可选参数：\n- `enc` 指定字符编码（默认为 `\"ISO-8859-1\"`）。\n- `xmlDecl`\
  \ 决定是否在输出开头生成 XML 声明（`<?xml...?>`）（默认为 `false`）。\n- `doctype` 是样例类 `scala.xml.dtd.DocType`\
  \ 的对象（默认为 `null`）。\n\n例如，为了写入一个 XHTML 文件，你可能会使用：\n\n点击此处查看代码图片\n\n```scala\nXML.save(\"\
  myfile.xhtml\", root,\n  enc = \"UTF-8\",\n  xmlDecl = true,\n  doctype = DocType(\"\
  html\",\n    PublicID(\"-//W3C//DTD XHTML 1.0 Strict//EN\",\n      \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  ),\n    Nil))\n```\n\n`DocType` 构造函数中的最后一个参数允许你指定内部 DTD 声明——这是一个晦僻的 XML 特性，我在这里不会讨论。\n\
  \n你也可以保存到 `java.io.Writer`，但那时你必须指定所有参数。\n\n点击此处查看代码图片\n\n```scala\nXML.write(writer,\
  \ root, \"UTF-8\", false, null)\n```\n\n![image](img/00015.jpeg) # Note\n\n在保存 XML\
  \ 文件时，没有内容的元素不会以自闭标签的形式写入。例如：\n\n```xml\n<img src=\"hamster.jpg\"></img>\n```\n\n\
  如果你更喜欢：\n\n```xml\n<img src=\"hamster.jpg\"/>\n```\n\n请使用\n\n点击此处查看代码图片\n\n```scala\n\
  val str = xml.Utility.toXML(node, minimizeTags = true)\n```\n\n![image](img/00014.jpeg)\
