  \ — 页面 95\n- 练习\n\n在本章中，我们学习了继承与 Java 之间最重要的区别：\n\n- `extends` 和 `final` 关键字。\n\
  - `override` 修饰符。\n- `class` 构造函数。\n\n### 8.1 扩展类\n\n在 Scala 中，你扩展类的方式和 Java 一样：\n\
  \n```scala\nclass Employee extends Person {\n  var salary: Int\n}\n```\n\n与 Java\
  \ 一样，`extends` 表示一个类继承自另一个类。在 Scala 中，你也可以声明一个类为 `final`，以便它不能被扩展。这与 Java 不同，在 Java\
  \ 中 `final` 也用于此目的。\n\n### 8.2 重写方法\n\n在 Scala 中，当你重写方法时，*必须*使用 `override` 修饰符。例如，\n\
  \n```scala\nclass Employee extends Person {\n  override def toString = getName +\
  \ \"[salary=\" + salary + \"]\"\n}\n```\n\n`override` 修饰符提供了很有用的作用，例如：\n\n- 当你拼错了方法名时\n\
  - 当你不小心提供了错误的类型时\n- 当你在超类中引入了一个与子类冲突的新方法时\n\n![image](img/0015.jpeg)\n\n在 Java 中，人们通常被建议通过将所有方法声明为\
  \ `final` 来“解决”这个问题，除非它们被显式设计为可重写。这在理论上听起来很好，但程序员讨厌无法进行细微更改时（例如添加日志调用）。这就是为什么 Java\
  \ 最后引入了可选的 `@Override` 注解。\n\n* *\n\n在 Scala 中调用超类方法与 Java 完全相同，使用关键字 `super`：\n\
  \n```scala\nclass Employee extends Person {\n  override def toString = super.toString\
  \ + \"[salary=\" + salary + \"]\"\n}\n```\n\n`super.toString` 调用超类的方法——即 `Person.toString`。\n\
  \n### 8.3 类型检查与强制转换\n\n要测试对象是否属于给定类，使用 `isInstanceOf` 方法。如果测试成功，你可以使用 `asInstanceOf`\
  \ 方法将引用转换为子类引用：\n\n```scala\nif (p.isInstanceOf[Employee]) {\n  val s = p.asInstanceOf[Employee]\
  \ // s 的类型为 Employee\n}\n```\n\n如果 `p` 指向 `Employee` 类或其子类（如 `Manager`）的对象，则 `p.isInstanceOf[Employee]`\
  \ 测试成功。\n\n如果 `p` 为 `null`，则 `p.isInstanceOf[Employee]` 返回 `false`，`p.asInstanceOf[Employee]`\
  \ 返回 `null`。\n\n如果 `p` 不是 `Employee`，则 `p.asInstanceOf[Employee]` 会抛出异常。\n\n\n\n\
  \n\n如果你想测试 `p` 是否指向一个 `Employee` 对象而不是子类，请使用\n\n```scala\nif (p.getClass == classOf[Employee])\n\
  ```\n\n`classOf` 方法定义在 `scala.Predef` 对象中，该对象是总是被导入的。\n\n表 8–1 显示了 Scala 和 Java\
  \ 类型检查与强制转换之间的对应关系。\n\n**表 8–1. Scala 和 Java 中的类型检查与转换**\n\n![image](img/00024.jpeg)\n\
  \n然而，模式匹配通常是使用类型检查和转换更好的替代方案。例如，\n\n点击此处查看代码图片\n\n```scala\np match {\n  case s:\
  \ Employee => ... // 将 s 处理为 Employee\n  case _ => ... // p 不是 Employee\n}\n```\n\
  \n请参阅第 14 章 以获取更多信息。\n\n### 8.4 受保护字段和方法\n\n与 Java 或 C++ 一样，你可以将字段或方法声明为 `protected`。此类成员可以在任何子类中访问，但不能从其他位置访问。\n\
  \n与 Java 不同，`protected` 成员*并不是*对类所属的整个包可见的。（如果你需要这种可见性，可以使用包修饰符——参见第 7 章）。\n\n还有一个\
  \ `protected[this]` 变体，它限制了对当前对象的访问，类似于第 5 章中讨论的 `private[this]` 变体。\n\n### 8.5\
  \ 超类构造\n\n回想第 5 章\n\n```scala\nclass Employee(name: String, age: Int, val salary\
  \ : Double) extends\n  Person(name, age)\n```\n\n这定义了一个子类\n\n点击此处查看代码图片\n\n```scala\n\
  class Employee(name: String, age: Int, val salary : Double) extends\n  Person(name,\
  \ age)\n```\n\n以及一个调用超类构造的主构造\n\n点击此处查看代码图片\n\n```scala\nclass Employee(name: String,\
  \ age: Int, val salary : Double) extends\n  Person(name, age)\n```\n\n类和构造函数的结合使得代码变得非常简洁。你可能会发现，将主构造函数的参数视为类的参数会有帮助。在这里，`Employee`\
  \ 类有三个参数：`name`、`age` 和 `salary`，其中两个被它“传递”给了超类。\n\n在 Java 中，等效代码要冗长得多：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Employee extends Person { // Java\n  private double salary;\n\
  \  public Employee(String name, int age, double salary) {\n    super(name, age);\n\
  \    this.salary = salary;\n  }\n}\n```\n\n***\n\n![image](img/00015.jpeg) 注意\n\n\
  在 Scala 构造函数中，你永远无法像 Java 那样通过 `super(params)` 来调用超类构造。\n\n***\n\n一个 Scala 类可以扩展\
  \ Java 类。它的主构造必须调用 Java 超类构造函数之一。例如，\n\n点击此处查看代码图片\n\n```scala\nclass Square(x:\
  \ Int, y: Int, width: Int) extends\n  java.awt.Rectangle(x, y, width, width)\n```\n\
  \n### 8.6 重写字段\n\n回想第 5 章，Scala 中的字段由一个私有字段*和*访问器/变变器方法组成。你可以用另一个同名的 `val` 字段重写一个\
  \ `val`（或无参数的 `def`）。子类拥有一个私有字段和一个公共的 getter，而该 getter 重写了超类的 getter（或方法）。\n\n例如，\n\
  \n点击此处查看代码图片\n\n```scala\nclass Person(val name: String) {\n  override def toString\
  \ = getClass.getName + \"[name=\" + name + \"]\"\n}\n\nclass SecretAgent(codename:\
  \ String) extends Person(codename) {\n  override val name = \"secret\" // 不想暴露 .\
  \ . .\n  override def toString = \"secret\" // . . . 或者类名\n}\n```\n\n这个例子展示了机制，但显得有些生硬。更常见的情况是用抽象的\
  \ `def` 重写抽象的 `def`。\n\n点击此处查看代码图片\n\n```scala\nabstract class Person {\n  def id:\
  \ Int\n}\n\nclass Student(name: String) extends Person {\n  override def id = name.length\n\
  }\n```\n\n这个例子展示了机制，但显得有些生硬。更常见的情况是用抽象的 `def` 重写抽象的 `def`。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```scala\nclass Employee(val id: Int) extends Person { // 子类拥有具体的 id 属性\n  var\
  \ name = \"\" // 拥有具体的 name 属性\n}\n```\n\n与方法一样，当你在子类中定义一个在父类中抽象的字段时，不需要 `override`\
  \ 关键字。\n\n你始终可以使用匿名类型来自定义一个抽象字段：\n\n```scala\nval fred = new Person {\n  val id\
  \ = 1729\n  var name = \"Fred\"\n}\n```\n\n### 8.10 构造顺序与早期定义 ![image](img/00009.jpeg)\n\
  \n当你在子类中重写一个 `val` 并在父类构造函数中使用该值时，产生的结果是不直观的。\n\n这里有一个示例。一个生物可以感知其环境的一部分。为了简单起见，我们假设该生物在一个一维世界中，感官数据用整数表示。默认的生物可以看到前方十个单位。\n\
  \n点击此处查看代码图像\n\n```scala\nclass Creature {\n  val range: Int = 10\n  val env: Array[Int]\
  \ = new ArrayInt\n}\n```\n\n然而，蚂蚁是近眼的：\n\n```scala\nclass Ant extends Creature {\n\
  \  override val range = 2\n}\n```\n\n遗憾的是，我们现在遇到了一个问题。`range` 值在父类构造函数中使用，而父类构造函数在子类构造函数之前运行。具体来说，发生的情况如下：\n\
  \n1. `Ant` 构造函数在执行自己的构造之前，调用了 `Creature` 构造函数。\n2. `Creature` 构造函数将它的 `range` 字段设置为\
  \ `10`。\n3. `Creature` 构造函数为了初始化 `env` 数组，调用了 `range()` getter。\n4. 该方法被重写，以返回 `Ant`\
  \ 类中（尚未初始化的）`range` 字段。\n5. `range()` 方法返回 `0`。（这是对象分配内存时所有整数字段的初始值。）\n6. `env`\
  \ 被设置为长度为 `0` 的数组。\n7. `Ant` 构造函数继续执行，将其 `range` 字段设置为 `2`。\n\n尽管 `range` 看起来是 `10`\
  \ 或 `2`，但 `env` 已经被设置为一个长度为 `0` 的数组。教训是，你不应该在构造体内部依赖 `val` 的值。\n\n在 Java 中，当你从父类构造函数调用方法时，也会遇到类似的问题。该方法可能在子类中被重写，并且可能不会按照你的方式执行。（事实上，这就是我们问题的根源——表达式\
  \ `range` 调用了 getter 方法。）\n\n有几种补救措施。\n\n- 将 `val` 声明为 `final`。这是安全的，但不灵活灵活。\n-\
  \ 在父类中将 `val` 声明为 `lazy`（见第 2 章）。这是安全的，但效率稍低。\n- 在子类中使用*早期定义语法*——见下文。\n\n“早期定义”语法允许你在执行父类代码之前初始化子类的\
  \ `val` 字段。这种语法非常丑陋，只有妈妈才会爱它。你将 `val` 字段放在 `extends` 关键字之后的代码块中，如下：\n\n```scala\n\
  class Bug extends {\n  override val range = 2\n} with Creature\n```\n\n注意父类名称之前的\
  \ `with` 关键字。该关键字通常与 trait 一起使用——见第 10 章。\n\n早期定义的右侧只能引用之前的早期定义，而不能引用该类的其他字段或方法。\n\
  \n***\n\n![image](img/00014.jpeg) 提示\n\n你可以使用 `-Xcheckinit` 编译器标志来调试构造顺序问题。该标志会生成代码，在访问未初始化的字段时抛出异常（而不是返回默认值）。\n\
  \n***\n\n***\n\n![image](img/00015.jpeg) 注意事项\n\n构造顺序问题的根源在于 Java 语言的一个设计决策——即允许在父类构造函数中调用子类方法。在\
  \ C++ 中，当父类构造函数执行时，对象的虚函数表指针被设置为父类的表。此后，指针被设置为子类的表。因此，在 C++ 中，无法通过重写来修改构造行为。Java\
  \ 的设计者认为这种细微差别是没有必要的，且 Java 虚拟机在构造期间不会调整虚函数表。\n\n***\n\n### 8.11 Scala 继承层次结构\n\n\
  图 8–1 显示了 Scala 类的继承层次结构。对应 Java 原始类型以及 `Unit` 类型的类继承自 `AnyVal`。\n\n![image](img/00026.jpeg)\n\
  \n**图 8–1. Scala 类的继承层次结构**\n\n所有其他类都是 `AnyRef` 类的子类，`AnyRef` 是 Java 或 .NET 虚拟机中\
  \ `Object` 类的别名。\n\n`AnyVal` 和 `AnyRef` 都继承自 `Any` 类，它是层次结构的根。\n\n`Any` 类定义了 `isInstanceOf`、`asInstanceOf`\
  \ 以及相等和哈希码的方法，我们将在第 8.12 节，“对象相等性](#part0014.html_ch08lev1sec12)”中查看这些方法，位于第 95\
  \ 页。\n\n`AnyVal` 没有添加任何方法。它只是值类型的标记标记。\n\n`AnyRef` 类增加了来自 `Object` 类的监器方法 `wait`\
  \ 和 `notify`/`notifyAll`。它还提供了一个带有函数参数的 `synchronized` 方法。该方法等于 Java 中的 `synchronized`\
  \ 块。例如，\n\n点击此处查看代码图像\n\n```scala\naccount.synchronized { account.balance += amount\
  \ }\n```\n\n***\n\n![image](img/00015.jpeg) 注意事项\n\n和 Java 一样，我建议你远离 `wait`、`notify`\
  \ 和 `synchronized`，除非你有充分理由使用它们而不是更高级的并发结构。\n\n***\n\n所有的 Scala 类都实现 `ScalaObject`\
  \ 接口，该接口没有任何方法。\n\n在层次结构的另一端是 `Nothing` 和 `Null`。\n\n`Null` 是唯一实例为 `null` 的类型。你可以将\
  \ `null` 赋值给任何引用，但不能赋值给值类型。例如，将 `Integer` 设置为 `null` 是可能的。\n\n`Nothing` 类型没有实例。它有时对泛型构造有用。例如，空列表\
  \ `Nil` 的类型为 `List[Nothing]`，它是任何 `List[T]` 的子类型。\n\n***\n\n![image](img/00018.jpeg)\
  \ 注意\n\n`Nothing` 类型与 Java 或 C++ 中的 `void` 完全不同。在 Scala 中，`void` 由 `Unit` 类型表示，值为\
  \ `()`。注意 `Unit` 不是其他类型的超类型。然而，编译器仍然允许将任何值替换为 `()`。考虑\n\n点击此处查看代码图像\n\n```scala\n\
  def printAny(x: Any) { println(x) }\ndef printUnit(x: Unit) { println(x) }\n\nprintAny(\"\
  Hello\") // 打印 Hello\nprintUnit(\"Hello\") // 将 \"Hello\" 替换为 () 并调用 printUnit(())，打印\
  \ ()\n```\n\n***\n\n### 8.12 对象相等性 ![image](img/00008.jpeg)\n\n在 Scala 中，`AnyRef`\
  \ 类的 `eq` 方法检查两个引用是否指向同一个对象。`AnyRef` 中的 `equals` 方法调用 `eq`。当你实现一个类时，应该考虑重写 `equals`\
  \ 方法为你的情况提供自然的相等性概念。\n\n例如，如果你定义了一个 `class Item(val description: String, val price:\
  \ Double)`，你可能希望当两个项目具有相同的描述和价格时认为它们相等。这里有一个合适的 `equals` 方法：\n\n点击此处查看代码图像\n\n```scala\n\
  final override def equals(other: Any) = {\n  val that = other.asInstanceOf[Item]\n\
  \  if (that == null) false\n  else description == that.description && price == that.price\n\
  }\n```\n\n***\n\n![image](img/00015.jpeg) 注意\n\n我们将方法定义为 `final`，是因为在子类中正确扩展相等性通常非常困难。问题在于对称性。你希望\
  \ `a.equals(b)` 的结果与 `b.equals(a)` 相同，即使 `b` 属于一个子类。\n\n***\n\n\n\n\n\n![image](img/00018.jpeg)\
  \ 注意事项\n\n请务必定义参数类型为 `Any` 的 `equals` 方法。以下代码是错误的：\n\n```scala\nfinal def equals(other:\
  \ Item) = { ... }\n```\n\n这是一个不同的方法，它并没有重写 `AnyRef` 的 `equals` 方法。\n\n* * *\n\n\
  当你定义 `equals` 时，请记住也要定义 `hashCode`。哈希值应该只根据你在等效性检查中使用的字段来计算。在 `Item` 示例中，将字段的哈希值组合：\n\
  \n点击此处查看代码图像\n\n```scala\nfinal override def hashCode = 13 * description.hashCode\
  \ + 17 * price.hashCode\n```\n\n* * *\n\n![image](img/00014.jpeg) 提示\n\n你并不强制要求重写\
  \ `equals` 和 `hashCode`。对于许多类来说，将不同的对象视为是不相等的。。例如，如果你有两个不同的输入流或单选按钮，你永远不会认为它们是相等的。\n\
  \n* * *\n\n在应用程序中，你通常不会调用 `eq` 或 `equals`。直接使用 `==` 运算符即可。对于引用类型，它会在对 `null` 操作数进行适当检查后调用\
