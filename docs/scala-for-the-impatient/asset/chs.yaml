  \n---\n\n### 11.1 标识符\n\n标识符是方法，其语法与熟悉的数学运算符相同的方法。\n\n在 Scala 中，你可以定义任何形式的运算符。运算符通常用于构建*领域特定语言*——即嵌入在\
  \ Scala 内部的微语言。*隐式**版本*（自动应用的类型转换函数）是另一种便于创建领域特定语言的工具。\n\n本章详细介绍了如何实现你自己的*运算符*——这些语法与熟悉的数学运算符相同的方法。\n\
  \n运算符通常用于构建*领域特定语言*——即嵌入在 Scala 内部的微语言。*隐式**版本*（自动应用的类型转换函数）是另一种便于创建领域特定语言的工具。\n\
  \n本章还讨论了：\n\n* 标识符。\n\n### 11.2 中间运算符\n\n中间运算符是具有两个参数的运算符。在 Scala 中，你可以通过 `a operator`\
  \ 来定义。例如，`a operator` 是一个方法调用。\n\n### 11.3 一元运算符\n\n只有一个参数的运算符称为一元运算符。如果它在参数之前，它是前缀运算符。例如，`-a`。\n\
  \n### 11.4 赋值运算符\n\n赋值运算符的形式为 `operator=b`，表达式 `a operator b` 等同于 `a operator(b)`。例如，`a\
  \ += b` 是常见的。\n\n这里有一些技术细节：\n\n* `<=`、>= 和 `!=` 不是赋值运算符。\n* `=` 开头的运算符永远不是赋值运算符（`==`,\
  \ `===`）。\n* 如果 `a` 有方法 `operator`，则直接调用它。\n\n### 11.5 优先级\n\n当你在没有括号的情况下使用多个运算符时，优先级更高的先执行。例如，在表达式\
  \ `1 + 2 * 3` 中，先执行 `*` 运算符。\n\n除了赋值运算符，优先级由运算符的第一个字符决定。Scala 可以有任意运算符，因此它使用了一种适用于所有运算符的方案，同时为标准运算符提供了熟悉的顺序。\n\
  \n### 11.6 结合性\n\n当你拥有一序列优先级相同的运算符时，*结合性*决定了它们是从左到右还是从右到左计算。例如，在表达式 17 – 2 – 9 中，计算的是\
  \ (17 – 2) – 9。– 运算符是左结合的。\n\n在 Scala 中，所有运算符都是左结合的，除了：\n\n* 以冒号（:`）结尾的运算符\n* 赋值运算符\n\
  \n特别是，用于构建列表的 `::` 运算符是右结合的。例如，`1 :: 2 :: Nil` 意味着 `1 :: (2 :: Nil)`。\n\n\n\n\n\n\
  `Nil.::(2)`\n\n### 11.7 apply 和 update 方法\n\nScala 允许你将函数调用语法\n\n```scala\nf(arg1,\
  \ arg2, ...)\n```\n\n扩展到除函数以外以外的值上。如果 `f` 不是函数或方法，则该表达式等价于调用：\n\n```scala\nf.apply(arg1,\
  \ arg2, ...)\n```\n\n除非它出现在赋值操作的左侧。表达式\n\n```scala\nf(arg1, arg2, ...) = value\n\
  ```\n\n对应于调用 `f.update(arg1, arg2, ..., value)`。这种机制用于数组（arrays）和映射（maps）。例如，\n\n\
  点击此处查看代码图像\n\n```scala\nval scores = new scala.collection.mutable.HashMap[String,\
  \ Int]\n\nscores(\"Bob\") = 100 // 调用 scores.update(\"Bob\", 100)\n\nval bobsScore\
  \ = scores(\"Bob\") // 调用 scores.apply(\"Bob\")\n```\n\n`apply` 方法也常用于伴侣对象（companion\
  \ objects），以便在不调用 `new` 的情况下构造对象。例如，考虑一个 `Fraction` 类。\n\n点击此处查看代码图像\n\n```scala\n\
  class Fraction(n: Int, d: Int) {\n}\n\nobject Fraction {\n  def apply(n: Int, d:\
  \ Int) = new Fraction(n, d)\n}\n```\n\n由于 `apply` 方法，我们可以使用 `Fraction(3, 4)` 来构造分数，而不是\
  \ `new Fraction(3, 4)`。这听起来是个小事，但如果你有许多 `Fraction` 值，这是一个非常欢迎的改进：\n\n点击此处查看代码图像\n\
  \n```scala\nval result = Fraction(3, 4) * Fraction(2, 5)\n```\n\n### 11.8 提取器 (Extractors)\n\
  \n提取器是一个拥有 `unapply` 方法的对象。你可以将 `unapply` 方法视为伴侣对象中 `apply` 方法的反操作。`apply` 方法接收参数并将其转换为对象。`unapply`\
  \ 方法接收一个对象并从中提取值——通常是构造该对象时使用的值。\n\n考虑前一节中的 `Fraction` 类。`apply` 方法根据分子和分母创建一个分数。`unapply`\
  \ 方法则提取分子和分母。你可以在变量定义中使用它 点击此处查看代码图像:\n\n```scala\nvar Fraction(a, b) = Fraction(3,\
  \ 4) * Fraction(2, 5)\n// a, b 用结果的分子和分母初始化\n```\n\n通常情况下，模式匹配可能会失败。因此，`unapply`\
  \ 方法返回一个 `Option`。它包含一个带有每个匹配变量对应值的元组。在我们的案例中，我们返回一个 `Option[(Int, Int)]`。点击此处查看代码图像:\n\
  \n```scala\nobject Fraction {\n  def unapply(input: Fraction) =\n    if (input.den\
  \ == 0) None else Some((input.num, input.den))\n}\n```\n\n为了展示这种可能性，当分母为零时，该方法返回\
  \ `None`，表示没有匹配。在前面的一个示例中，`apply` 和 `unapply` 方法是互逆的。然而，这并不是要求的。你可以使用提取器从任何类型的对象中提取信息。例如，假设你想从一个字符串中提取名和姓：点击此处查看代码图像:\n\
  \n```scala\nval author = \"Cay Horstmann\"\nval Name(first, last) = author // 调用\
  \ Name.unapply(author)\n```\n\n提供一个带有 `unapply` 方法的对象 `Name`，该方法返回一个 `Option[(String,\
  \ String)]`。如果匹配成功，返回一个包含名和姓的元组。元组的组件将绑定到模式中的变量上。否则，返回 `None`。点击此处查看代码图像:\n\n```scala\n\
  object Name {\n  def unapply(input: String) = {\n    val pos = input.indexOf(\"\
  \ \")\n    if (pos == -1) None\n    else Some((input.substring(0, pos), input.substring(pos\
  \ + 1)))\n  }\n}\n```\n\n注意：在这个示例中，没有 `Name` 类。`Name` 对象是 `String` 对象的提取器。\n\n每个\
  \ case 类（case class）都自动拥有 `apply` 和 `unapply` 方法。（case 类将在第 14 章讨论）。例如，考虑 点击此处查看代码图像:\n\
  \n```scala\ncase class Currency(value: Double, unit: String)\n```\n\n你可以这样构造一个 `Currency`\
  \ 实例：点击此处查看代码图像:\n\n```scala\nCurrency(29.95, \"EUR\") // 调用 Currency.apply\n```\n\
  \n你可以从 `Currency` 对象中提取值：点击此处查看代码图像:\n\n```scala\ncase Currency(amount) => println(\"\
  $\" + amount)\n```\n\n 11.9 单参数或无参数的提取器\n\n在 Scala 中，没有带有一个参数的元组。如果 `unapply` 方法提取单个值，它应该返回一个\
  \ `Option`。例如，点击此处查看代码图像:\n\n```scala\nobject Number {\n  def unapply(input: String):\
  \ Option[Int] =\n    try {\n      Some(input.parseInt(input))\n    } catch {\n \
  \     case _: NumberFormatException => None\n    }\n}\n```\n\n使用此提取器，你可以从字符串匹配数字：`val\
  \ Number(n) = \"12\"`。提取器可以测试任何输入，`unapply` 方法返回一个 `Boolean`。点击此处查看代码图像:\n\n```scala\n\
  object IsCompound {\n  def unapply(input: String): Option[Boolean] =\n    Some(input.contains(\"\
  \ \"))\n}\n```\n\n### 11.10 applySeq 方法\n\n为了提取序列值，`applySeq` 方法需要返回 `Option[A]`，其中\
  \ `A` 是目标类型。例如，点击此处查看代码图像:\n\n```scala\nobject Fraction {\n  def unapplySeq(input:\
  \ String): Option[Seq[Int]] =\n    val parts = input.split(\"/\")\n    if (parts.length\
  \ == 2) Some(parts.map(_.toInt).toList)\n    else None\n}\n```\n\n现在你可以匹配任何变量：`case\
  \ Fraction(n, d) = \"1/2\"`。\n\n### 练习\n\n1. 根据优先级规则，`3 + 4 ^ 5` 和 `3 ^ 4 + 5` 是如何求值的？\n\
