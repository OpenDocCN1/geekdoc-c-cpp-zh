  - 练习 — 第 152 页\n\nScala 将面向对象与函数式特性混合在一起。在函数式编程语言中，函数是一等公民，可以像任何其他数据类型一样被传递和操作。当你想要向算法传递某些细节操作时，这非常有用。在函数式语言中，你只需将该细节封装进函数中并将其作为参数传递。在本章中，你将看到如何利用使用或返回函数的来提高效率。\n\
  \n本章的亮点包括：\n\n- 函数在 Scala 中像数字一样是“一等公民”。\n- 你可以创建匿名函数，通常将它们交给其他函数。\n- 函数参数指定了稍后执行的行为。\n\
  - 许多集合方法接受函数参数，将函数应用于集合的值。\n- 存在一些语法快捷方式，允许你以简短且易读的方式表示函数参数。\n- 你可以创建处理代码块的函数，它们看起来非常像内置的控制语句。\n\
