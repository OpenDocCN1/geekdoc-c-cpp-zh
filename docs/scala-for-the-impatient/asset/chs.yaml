  \ • 墨西哥城\n\n\n\n\n\n\n\n\n\n\n\n```\n\n现在 `HashMap` 明确指代 `scala.collection.mutable.HashMap`，因为\
  \ `java.util.HashMap` 被隐藏了。\n\n### 7.10 隐式导入\n\n每个 Scala 程序隐式地开始于\n\n```scala\n\
  import java.lang._\nimport scala._\nimport Predef._\n```\n\n\n\n\n与 Java 程序一样，`java.lang`\
  \ 总是被自动导入的。接下来，导入了 `scala` 包，但其方式很特殊。与其他所有导入不同，这种导入允许覆盖先前的导入。例如，`scala.StringBuilder`\
  \ 覆盖了 `java.lang.StringBuilder` 而不是与其发生冲突。\n\n最后，导入了 `Predef` 对象。它包含了许多实用的函数。（这些函数完全可以被放在\
  \ `scala` 包对象中，但 `Predef` 是在 Scala 引入包对象之前就已经引入的。）\n\n由于 `scala` 包是默认导入的，你永远不需要编写以\
  \ `scala` 开头的包名。例如，\n\n`collection.mutable.HashMap`\n\n和 `scala.collection.mutable.HashMap`\
  \ 是一样的。\n\n### 练习题\n\n**1.** 编写一个示例程序来证明\n\n```\npackage com.horstmann.impatient\n\
  ```\n\n与以下代码不同：\n\n```\npackage com\n\npackage horstmann\n\npackage impatient\n\
  ```\n\n**2.** 写一个能让你的 Scala 朋友感到困惑的谜题，使用一个不在顶层的包 `com`。\n\n**3.** 编写一个包 `random`，包含函数\
  \ `nextInt(): Int`、`nextDouble(): Double` 和 `setSeed(seed: Int): Unit`。要生成随机数，使用线性同余生成器：\n\
  \n```\n`next = (previous * a + b) mod 2^n`\n```\n\n其中 `a = 1664525`，`b = 1013904223`，`n\
  \ = 32`，`previous` 的初始值为 `seed`。\n\n**4.** 你为什么认为 Scala 语言设计师提供了 `package object`\
  \ 语法，而不是简单让你向包添加函数和变量？\n\n**5.** `private[com] def giveRaise(rate: Double)` 的什么是什么？它有用吗？\n\
  \n**6.** 编写一个程序将 Java hash map 中的所有元素复制到 Scala hash map 中。使用导入来重命名这两个类。\n\n**7.**\
  \ 在上一个练习中，将所有导入移动到尽可能内部的作用域中。\n\n**8.** 以下代码的效果是什么：\n\n```scala\nimport java._\n\
  \nimport javax._\n```\n\n这是一个好主意吗？\n\n**9.** 编写一个程序，导入 `java.lang.System` 类，从 `user.name`\
  \ 系统属性读取用户名，从 `Console` 对象读取密码，如果密码不是 `\"secret\"`，则向标准错误流打印消息。否则，向标准输出流打印问候。不要使用任何其他导入，也不要使用任何限定名称（带点的名称）。\n\
  \n**10.** 除了 `StringBuilder` 之外，`scala` 包还覆盖了 `java.lang` 的哪些成员？\n\n## 第 8 章 继承\n\
