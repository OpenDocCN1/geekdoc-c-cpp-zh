  \n### 17.6 显式上下文边界\n\n为了实例化泛型 `Array[T]`，需要一个 `Manifest[T]` 对象。对于原始类型数组的正确工作是必要的。例如，如果\
  \ `T` 是 `Int`，你希望在虚拟机中得到 `int[]` 数组。在 Scala 中，`Array` 是一个库类，编译器不会对其进行特殊处理。如果你编写了一个构造泛型数组的泛型函数，你需要帮助它并传递该\
  \ manifest 对象。由于它是构造函数的隐式参数，你可以使用上下文边界，如下：\n\n点击此处查看代码图片\n\n```scala\ndef makePairT\
  \ : Manifest = {\n  val r = new ArrayT; r(0) = first; r(1) = second; r\n}\n```\n\
  \n如果你调用 `makePair(4, 9)`，编译器会找到隐式的 `Manifest[Int]` 并实际调用 `makePair(4, 9)(intManifest)`。然后该方法调用\
  \ `new Array(2)(intManifest)`，返回一个原始数组 `int[2]`。\n\n为什么这些这么复杂？在虚拟机中，泛型类型被擦除了。只有一个\
  \ `makePair` 方法需要适用于所有类型 `T`。\n\n### 17.7 多重边界\n\n一个类型变量可以同时拥有上界和一个下界。语法如下：\n\n\
  `T <: Lower >: Lower`\n\n你不能有多个上界或多个下界。然而，你仍然可以要求一个类型实现多个 trait，如下：\n\n点击此处查看代码图片\n\
  \n```scala\nT <: Comparable[T] with Serializable with Cloneable\n```\n\n你可以有多个一个视图边界：\n\
  \n`T <% Comparable[T] <% String`\n\n你也可以有多个上下文边界：\n\n`T : Ordering : Manifest`\n\
  \n### 17.8 类型约束 ![image](img/00009.jpeg)\n\n类型约束为你提供了另一种限制类型的方法。你可以使用三种关系：\n\n`T\
  \ =:= U`\n\n`T <:< U`\n\n`T <%< U`\n\n这些约束测试 `T` 是否等于 `U`、是否是 `U` 的子类型，或者是否可以转换为\
  \ `U`。要使用此类约束，你需要如下所示添加一个“隐式证据参数】：\n\n点击此处查看代码图片\n\n```scala\nclass PairT(implicit\
  \ ev: T <:< Comparable[T])\n```\n\n***\n\n![image](img/00015.jpeg) 注意\n\n这些约束并不是语言内置的。它们是\
  \ Scala 库的功能。请参阅第 21 章 获取对这种奇怪语法的解释，并分析类型约束的内部原理。\n\n***\n\n在上面的示例中，使用类型约束相比于类型边界\
  \ `class Pair[T <: Comparable[T]]` 并没有优势。然而，类型约束在某些特殊情况下非常有用。在本节中，你将看到类型约束两种用法。\n\
  \n类型约束允许你在泛型类中提供一个方法，该方法只能在特定条件下使用。这里有一个例子：\n\n点击此处查看代码图片\n\n```scala\nclass PairT\
  \ {\n  def smaller(implicit ev: T <:< Ordered[T]) =\n    if (first < second) first\
  \ else second\n}\n```\n\n你可以形成一个 `Pair[File]`，即使 `File` 没有有序。只有当你调用 `smaller` 方法时才会得到错误。\n\
  \n另一个例子是 `Option` 类中的 `orNull` 方法：\n\n点击此处查看代码图片\n\n```scala\nval friends = Map(\"\
  Fred\" -> \"Barney\", ...)\nval friendOpt = friends.get(\"Wilma\") // 一个 Option[String]\n\
  val friendOrNull = friendOpt.orNull // 一个 String 或 null\n```\n\n`orNull` 方法在处理 Java\
  \ 代码时非常有用，因为在 Java 中通常将缺失值编码为 `null`。但它不能应用于像 `Int` 这样没有 `null` 作为有效值的取值类型。因为 `orNull`\
  \ 是使用约束 `Null <:< A` 实现的，只要这些实例不使用 `orNull`，你仍然实例化 `Option[Int]`。\n\n类型约束的另一个用途是改进类型推断。考虑\n\
  \n点击此处查看代码图片\n\n```scala\ndef firstLast[A, C <: Iterable[A]](it: C) = (it.head,\
  \ it.last)\n```\n\n当你调用 `firstLast(List(1, 2, 3))` 你收到一条消息，说明推断出的类型参数 `[Nothing,\
  \ List[Int]]` 不符合 `[A, C <: Iterable[A]]`。为什么是 `Nothing`？类型推断器无法从 `List(1, 2, 3)`\
  \ 确定 `A` 是什么，因为它在一步中同时匹配了 `A` 和 `C`。为了帮助它，首先匹配 `C` 然后匹配 `A`：\n\n点击此处查看代码图片\n\n```scala\n\
  def firstLastA, C(implicit ev: C <:< Iterable[A]) =\n  (it.head, it.last)\n```\n\
  \n***\n\n![image](img/00015.jpeg) 注意\n\n你在第 12 章中见过类似的技巧。`corresponds` 方法检查两个序列是否具有对应的条目：\n\
  \n点击此处查看代码图片\n\n```scala\ndef correspondsB(match: (A, B) => Boolean): Boolean\n\
  ```\n\n`match` 谓词是一个柯里化参数，这样类型推断就可以工作。\n\n（注：原文后续存在大量重复文本，已按指令要求过滤）\n\n\n\n在上一节中，你看到函数在参数上是逆变的（contravariant），在结果类型上是协变的（covariant）。通常情况下，对于对象消耗的值使用逆变，对于它产生的值使用协变是有意义的。\n\
  \n如果一个对象同时具备这两者，那么该类型应该保持为 `invariant`（不变的）。这在可变数据结构中通常如此。例如，在 Scala 中，数组是不变变的。你不能将\
  \ `Array[Student]` 转换为 `Array[Person]`，反之亦然。这样做是不安全的。考虑以下代码：\n\n点击此处查看代码图片\n\n```\n\
  val students = new ArrayStudent\n\nval people: Array[Person] = students // 非，但假设它是\
  \ . . .\n\npeople(0) = new Person(\"Fred\") // 噢！现在 students(0) 不是 Student 了\n```\n\
  \n相反，\n\n点击此处查看代码图片\n\n```scala\nval people = new ArrayPerson\n\nval students: Array[Student]\
  \ = people // 非，但假设它是 . . .\n\npeople(0) = new Person(\"Fred\") // 噢！现在 students(0)\
  \ 不是 Student 了\n```\n\n***\n\n![image](img/00015.jpeg) Note\n\n在 Java 中，可以将 `Student[]`\
  \ 数组转换为 `Person[]` 数组，但如果你尝试向此类数组添加一个非学生对象，将抛出 `ArrayStoreException`。在 Scala 中，编译器会拒绝可能导致类型错误的程序。\n\
  \n***\n\n假设我们尝试声明一个协变的 `mutable` 元组。这是行不通的。它就像拥有两个元素的数组，其中可能会产生你刚刚看到的相同错误。\n\n事实上，如果你尝试\n\
  \n点击此处查看代码图片\n\n```scala\nclass Pair+T // 错误\n```\n\n你会得到一个错误，抱怨协变类型 `T` 在 setter\
  \ 方法中处于 `contravariant position`（逆变位置）\n\n```scala\nfirst_=(value: T)\n```\n\n参数是逆变位置，而返回类型是协变。\n\
  \n然而，在函数参数内部，变性会翻转——它的参数是协变的。例如，查看 `Iterable[+A]` 的 `foldLeft` 方法：\n\n```scala\n\
  foldLeftB(op: (B, A) => B): B\n             -      +  +      -    +\n```\n\n注意 `A`\
  \ 现在处于协变位置。\n\n这些位置规则简单且安全，但它们有时会阻碍某些本无风险的操作。考虑来自第 17.3 节“类型变量的边界”，位于第 232 页的不可变元组中的\
  \ `replaceFirst` 方法：\n\n点击此处查看代码图片\n\n```scala\nclass Pair+T {\n  def replaceFirst(newFirst:\
  \ T) = new PairT // 错误\n}\n```\n\n编译器拒绝了此，因为参数类型 `T` 处于逆变位置。然而，这个方法并不会破坏元组——它返回一个新的元组。\n\
  \n解决办法是为该方法引入第二个类型参数，如下：\n\n点击此处查看代码图片\n\n```scala\ndef replaceFirstR >: T = new\
  \ PairR\n```\n\n现在该方法是一个带有另一个类型参数 `R` 的泛型方法。但 `R` 是 `invariant` 的，所以它出现在逆变位置就没关系。\n\
  \n### 17.11 对象不能泛型\n\n给对象添加类型参数是不可能的。例如，考虑不可变列表。一个元素类型为 `T` 的列表要么是空的，要么是一个头部为 `T`\
  \ 尾部为 `List[T]` 的节点：\n\n点击此处查看代码图片\n\n```scala\nabstract class List[+T] {\n  def\
  \ isEmpty: Boolean\n  def head: T\n  def tail: List[T]\n}\n\nclass NodeT extends\
  \ List[T] {\n  def isEmpty = false\n}\n\nclass Empty[T] extends List[T] {\n  def\
  \ isEmpty = true\n  def head = throw new UnsupportedOperationException\n  def tail\
  \ = throw new UnsupportedOperationException\n}\n```\n\n***\n\n![image](img/00015.jpeg)\
  \ Note\n\n在这里我使用 `Node` 和 `Empty` 是为了让 Java 程序员更容易理解。如果你熟悉 Scala 列表，只需替换为 `::` 和\
  \ `Nil` 即可。\n\n***\n\n将 `Empty` 定义为一个类似乎很愚蠢。它没有状态。但你无法把它变成一个对象：\n\n```scala\nclass\
  \ Pair+T // 错误\n```\n\n\n\n\n在一个 `Pair[+T]` 中。问题在于，该方法可以以不安全的方式被重写。构造一个该问题的示例。定义\
  \ `Pair[Double]` 的子类 `NastyDoublePair`，它重写了 `replaceFirst` 以根据 `newFirst` 的平方根创建一个元对。然后在一个实际上是\
  \ `NastyDoublePair` 的 `Pair[Any]` 上构造 `replaceFirst(\"Hello\")` 的调用。\n\n**10.**\
  \ 给定一个可变的 `Pair[S, T]` 类，使用类型约束来定义一个 `swap` 方法，当类型参数相同时，可以调用该方法。\n\n## 第 18 章 高级类型\n\
  \n## 本章主题 ![image](img/00011.jpeg)\n\n• 18.1 单例类型 — 第 246 页 \n• 18.2 类型投影 — 第 247\
  \ 页 \n• 18.3 路径 — 第 248 页 \n• 18.4 类型别名 — 第 249 页 \n• 18.5 结构化类型 — 第 250 页 \n• 18.6\
  \ 复合类型 — 第 250 页 \n• 18.7 中间类型 — 第 251 页 \n• 18.8 存在性类型 — 第 252 页 \n• 18.9 Scala\
  \ 类型系统 — 第 253 页 \n• 18.10 自类型类型 — 第 254 页 \n• 18.11 依赖注入 — 第 255 页 \n• 18.12 抽象类型\
  \ ![image](img/00009.jpeg) — 第 257 页 \n• 18.13 家族多态 ![image](img/00009.jpeg) — 第\
  \ 259 页 \n• 18.14 高阶类型类型 ![image](img/00009.jpeg) — 第 263 页 \n• 练习 — 第 265 页 \n\n\
  在本章中，你将看到 Scala 提供的所有类型，包括一些更具技术性的类型。我们将对自类型和依赖注入的讨论结束。\n\n本章的要点是：\n\n• 单例类型对于方法链式调用和带有对象参数的方法非常有用。\n\
  • 类型投影包含了外部类所有对象的内部类实例。\n• 类型别名为类型提供了一个短名称。\n• 结构化类型等同于“鸭子类型”（duck typing）。\n• 存在性类型为泛型中的通配符参数提供了形式化。\n\
  • 使用自类型声明表示某个特征（trait）需要另一个类型。\n• “蛋糕模式”（cake pattern）使用自类型来实现一种依赖注入机制。\n• 抽象类型必须在子类中具体化。\n\
  • 高阶类型拥有一个本身是参数化类型的类型参数。\n\n### 18.1 单例类型\n\n对于任何引用 `v`，你都可以形成类型 `v.type`，它有两个值：`v`\
  \ 和 `null`。这听起来是一个奇怪的类型，但它有一些实用的用途。\n\n首先，考虑一个返回 `this` 的方法，以便你可以链式调用方法：\n\n点击此处查看代码图片\n\
  \n```scala\nclass Document {\n  def setTitle(title: String) = { ... }\n  def setAuthor(author:\
  \ String) = { ... }\n}\n```\n\n假设有如下类：\n\n```scala\nclass Pair+T {\n  def replaceFirst(newFirst:\
  \ @+T): Pair[T] = {\n    first = newFirst\n    this\n  }\n}\n```\n\n问题是，该方法可以以不安全的方式被重写。\n\
  \n```scala\nclass NastyDoublePair extends Pair[Double] {\n  def replaceFirst(newFirst:\
  \ Any): Pair[Any] = {\n    first = math.sqrt(newFirst.toDouble)\n    this\n  }\n\
  }\n```\n\n构造一个该问题的示例。定义 `Pair[Double]` 的子类 `NastyDoublePair`，它重写了 `replaceFirst`\
  \ 以根据 `newFirst` 的平方根创建一个元对。然后在一个实际上是 `NastyDoublePair` 的 `Pair[Any]` 上构造 `replaceFirst(\"\
  Hello\")` 的调用。\n\n**10.** 给定一个可变的 `Pair[S, T]` 类，使用类型约束来定义一个 `swap` 方法，当类型参数相同时，可以调用该方法。\n\
  \n```scala\nclass PairS, T {\n  def swap(): Unit = {\n    val tmp = first\n    first\
  \ = second\n    second = tmp\n  }\n}\n\nclass PairS extends Pair[S, S] {\n  def\
  \ swap(): Unit = {\n    val tmp = first\n    first = second\n    second = tmp\n\
  \  }\n}\n```\n\n使用类型约束：\n\n```scala\nclass SymmetricPairS, T where S <: T, T <:\
  \ S {\n  def swap(): Unit = {\n    val tmp = first\n    first = second\n    second\
  \ = tmp\n  }\n}\n```\n\n\n\n路径组件（path component）不能是一个类，因为正如你所看到的，嵌套类并不是单一类型，而是会为每个实例产生一个独立的类型。\n\
  \n此外，路径元素不能是 `var`。例如，\n\n点击此处查看代码\n\n```scala\nvar chatter = new Network\n\n...\n\
  \nval fred = new chatter.Member // Error—chatter is not stable\n```\n\n由于你可能会给 `chatter`\
  \ 分配不同的值，编译器无法为类型 `chatter.Member` 分配确定的含义。\n\n***\n\n![image](img/00015.jpeg) 注意\n\
  \n在内部，编译器会将所有的嵌套类型表达式 `a.b.c.T` 转换为类型投影（type projections）`a.b.c.type#T`。例如，`chatter.Member`\
  \ 变为 `chatter.type#Member`——即单例 `chatter.type` 内部的任何 `Member`。这通常不需要你去担心。然而，有时你会看到形式如\
  \ `a.b.c.type#T` 的类型错误消息。只需将其转换回 `a.b.c.T` 即可。\n\n***\n\n### 18.4 类型别名 (Type Aliases)\n\
  \n你可以使用 `type` 关键字为复杂的类型创建一个简单的 `alias`，如下：\n\n点击此处查看代码\n\n```scala\nclass Book\
  \ {\n\n  import scala.collection.mutable._\n\n  type Index = HashMap[String, (Int,\
  \ Int)]\n\n  ...\n}\n```\n\n然后你可以使用 `Book.Index` 代替繁琐的 `scala.collection.mutable.HashMap[String,\
  \ (Int, Int)]`。\n\n类型别名必须嵌套在类或对象内部。它不能出现在 Scala 文件的顶层。然而，在 REPL 中，你可以在顶层声明 `type`，因为\
  \ REPL 中的所有内容都隐式包含在一个顶层对象中。\n\n***\n\n![image](img/00015.jpeg) 注意\n\n`type` 关键字也用于在子类中具体化的*抽象类型*（abstract\
  \ types），例如：\n\n点击此处查看代码\n\n```scala\nabstract class Reader {\n\n  type Contents\n\
  \n  def read(fileName: String): Contents\n}\n```\n\n我们将在第 18.12 节 以及第 257 页 的“[抽象类型]”中讨论抽象类型。\n\
  \n***\n\n### 18.5 结构化类型 (Structural Types)\n\n“结构化类型”是对符合类型应该拥有的抽象方法、字段和类型的规范。例如，此方法具有结构化类型参数：\n\
  \n点击此处查看代码\n\n```scala\ndef appendLines(target: { def append(str: String): Any },\n\
  \    lines: Iterable[String]) {\n  for (l <- lines) { target.append(l); target.append(\"\
  \\n\") }\n}\n```\n\n你可以使用*任何*拥有 `append` 方法类的实例来调用 `appendLines` 方法。这比定义一个 `Appendable`\
  \ trait 更具活性，因为你可能并不总是能向正在使用的类添加该 trait。\n\n在底层，Scala 使用反射来执行 `target.append(...)`\
  \ 调用。结构化类型为你提供了一种安全且方便的方法来进行此类调用。\n\n然而，反射调用的开销*远比*普通方法调用大。因此，只有当你从无法共享 trait 的类中对共同行为建模时，才应该使用结构化类型。\n\
  \n***\n\n![image](img/00015.jpeg) 注意\n\n结构化类型类似于 JavaScript 或 Ruby 等动态类型编程语言中的“鸭子类型（duck\
  \ typing）”。在这些语言中，变量没有类型。当你写 `obj.quack()` 时，运行时会确定此时 `obj` 所指代的特定对象是否具有 `quack`\
  \ 方法。换句话说，只要它走得像鸭子、叫得也像鸭子，你就不需要将 `obj` 声明为 `Duck`。\n\n***\n\n### 18.6 复合类型 (Compound\
  \ Types)\n\n复合类型的格式为：\n\n`T[1] with T[2] with T[3] ...`\n\n其中 `T[1]`、`T[2]`、`T[3]`\
  \ 等都是类型。为了属于该复合类型，一个值必须属于所有的单个类型。因此，这种类型也被称为交叉类型（intersection type）。\n\n你可以使用复合类型来处理必须提供多个\
  \ trait 的值。例如：\n\n点击此处查看代码\n\n```scala\nval image = new ArrayBuffer[java.awt.Shape\
  \ with java.io.Serializable]\n```\n\n你可以通过 `for (s <- image) graphics.draw(s)` 绘制\
  \ `image` 对象。你可以序列化 `image` 对象，因为你知道所有元素都是可序列化的。\n\n当然，你只能添加既是形状又是可序列化的对象：\n\n点击此处查看代码\n\
  \n```scala\nval image = new ArrayBuffer[java.awt.Shape with java.io.Serializable]\n\
  ```\n（注：原文此处存在大量重复和乱码，已按核心逻辑整理翻译）\n\n***\n\n### 18.7 中缀类型 (Infix Types)\n\n中缀类型是带有两个参数的类型，使用“中缀”语法编写，类型名位于参数之间。例如，你可以写\
  \ `String Int` 代替 `[String, Int]`。\n\n所有中缀类型运算符具有相同的优先级。与普通运算符一样，除非以 `:` 结尾，否则它们是左结合。例如，`String\
  \ × Int` 表示 `((String, Int), Int)`。这种类型类似于但不同于 `(String, Int)`，后者在 Scala 中无法编写。\n\
  \n***\n\n![image](img/00015.jpeg) 注意\n\n中缀类型名可以是任何运算符字符序列，除了单个 `*`。此规则避免了与变量声明 `T*`\
  \ 的混淆。\n\n***\n\n### 18.8 存有类型 (Existential Types)\n\n存有类型是为了兼容 Java 通配符而引入 Scala\
  \ 的。存有类型是一个类型表达式后跟 `forSome { ... }`，大括号包含 `type` 和 `val` 声明。例如：\n\n点击此处查看代码\n\n\
  ```scala\nArray[T] forSome { type T <: JComponent }\n```\n\n这与你在第 17 章看到的通配符类型 `Array[_\
  \ <: JComponent]` 相同。\n\nScala 通配符是存有类型的语法糖。例如：\n\n```scala\nArray[_]\n```\n\n同于\
  \ `Array[T] forSome { type T }`。\n\n```scala\nMap[_, _]\n```\n\n同于 `Map[T, U] forSome\
  \ { type T; type U }`。\n\n`forSome` 符号允许比通配符表达更复杂的关系，例如：\n\n```scala\nMap[T, U]\
  \ forSome { type T; type U <: T }\n```\n\n你可以在 `forSome` 块中使用 `val` 声明，因为 `val`\
  \ 可以有自己的嵌套类型（参见第 18.2 节，“类型投影”）。例如：\n\n```scala\nn.Member forSome { val n: Network\
  \ }\n```\n\n这本身并不有趣——你可以直接使用类型投影 `Network#Member`。但是：\n\n```scala\ndef processM\
  \ <: n.Member forSome { val n: Network } = (m1, m2)\n```\n\n\n\nThis method will\
  \ accept members from the same network, but reject members from different ones:\n\
  \n```scala\nval chatter = new Network\nval myFace = new Network\nval fred = chatter.join(\"\
  Fred\")\nval wilma = chatter.join(\"Wilma\")\nval barney = myFace.join(\"Barney\"\
  )\n\nprocess(fred, wilma) // OK\nprocess(fred, barney) // Error\n```\n\n### 18.9\
  \ The Scala Type System\n\nThe Scala language reference gives an exhaustive list\
  \ of all Scala types, which is reproduced in Table 18–1, with brief explanations\
  \ for each type.\n\n**Table 18–1. Scala Types**\n\n![image](img/00044.jpeg)\n\n\
  * * *\n\n![image](img/00015.jpeg) Note\n\nThis table shows the types that you, the\
  \ programmer, can declare. There are a few types that the Scala compiler uses internally.\
  \ For example, a *method type* is denoted by `(*T[1], ..., T[n])*T` without a `=>`.\
  \ You will occasionally see such types. For example, when you enter\n\n```scala\n\
  def square(x: Int) = x * x\n```\n\nin the Scala REPL, it responds with\n\n```\n\
  square (x: Int)Int\n```\n\nThis is different from\n\n```scala\nval triple = (x:\
  \ Int) => 3 * x\n```\n\nwhich yields\n\n```\ntriple: Int => Int\n```\n\nYou can\
  \ turn a method into a function by appending a `_`. The type of `square _` is `Int\
  \ => Int`.\n\n* * *\n\n### 18.10 Self Types\n\nIn Chapter 10, you saw how a trait\
  \ can require that it is mixed into a class that extends another type. You define\
  \ the trait with a *self type* declaration:\n\n```scala\nthis: Type =>\n```\n\n\
  Such a trait can only be mixed into a subclass of the given type. In the following\
  \ example, the `LoggedException` trait can only be mixed into a class that extends\
  \ `Exception`:\n\nClick here to view code image\n\n```scala\ntrait Logged {\n  def\
  \ log(msg: String)\n}\n\ntrait LoggedException extends Logged {\n  this: Exception\
  \ =>\n    def log() { log(getMessage()) }\n    // OK to call getMessage because\
  \ this is an Exception\n}\n```\n\nIf you try to mix the trait into a class that\
  \ doesn’t conform to the self type, an error occurs:\n\nClick here to view code\
  \ image\n\n```scala\nval f = new JFrame with LoggedException\n  // Error: JFrame\
  \ isn't a subtype of Exception, the self type of LoggedException\n```\n\nIf you\
  \ want to require multiple types, use a compound type:\n\n```scala\nthis: T with\
  \ U with ... =>\n```\n\n* * *\n\n![image](img/00015.jpeg) Note\n\nYou can combine\
  \ the self type syntax with the “alias for enclosing `this`” syntax that I briefly\
  \ introduced in Chapter 5. If you give a name other than `this` to the variable,\
  \ then it can be used in subtypes by that name. For example,\n\n```scala\ntrait\
  \ Group {\n  outer: Network =>\n    class Member {\n      ...\n    }\n}\n```\n\n\
  The `Group` trait requires that it is added to a subtype of `Network`, and inside\
  \ `Member`, you can refer to `Group.this` as `outer`.\n\nThis syntax seems to have\
  \ grown organically over time; unfortunately, it introduces a great deal of confusion\
  \ for a small amount of added functionality.\n\n* * *\n\n* *\n\n![image](img/00018.jpeg)\
  \ Caution\n\nSelf types do not automatically inherit. If you define\n\nClick here\
  \ to view code image\n\n```scala\ntrait ManagedException extends LoggedException\
  \ { ... }\n```\n\nyou get an error that `ManagedException` doesn’t supply `Exception`.\
  \ In this situation, you need to repeat the self type:\n\nClick here to view code\
  \ image\n\n```scala\ntrait ManagedException extends LoggedException {\n  this: Exception\
  \ =>\n    ...\n}\n```\n\n* * *\n\n### 18.11 Dependency Injection\n\nWhen building\
  \ a large system out of components, with different implementations for each component,\
  \ one needs to assemble the component choices. For example, there may be a mock\
  \ database and a real database, or console logging and file logging. A particular\
  \ implementation may want the real database and console logging for running an experiment,\
  \ or the mock database and file logging for running an automated test script.\n\n\
  Usually, there is some dependency among the components. For example, the data access\
  \ component may require logging.\n\nJava has several tools that allow programmers\
  \ to express dependencies through frameworks such as Spring or module systems such\
  \ as OSGi. Each component describes on which other component interfaces it depends.\
  \ References to actual component implementations are “injected” when the application\
  \ is assembled.\n\nIn Scala, you can achieve a simple form of dependency injection\
  \ with traits and self types.\n\nFor logging, suppose we have a trait\n\n```scala\n\
  trait Logger { def log(msg: String) }\n```\n\nwith implementations `ConsoleLogger`\
  \ and `FileLogger`.\n\nThe user authentication trait has a logging dependency to\
  \ log authentication failures.\n\n\n\n在创建子类时，指定类型参数不会产生任何问题。但当存在许多类型依赖时，使用抽象类型（abstract\
  \ types）通常效果更好——你避免了长长的类型参数列表。例如：\n\n点击此处查看代码图像\n\n```scala\ntrait Reader {\n  type\
  \ In\n  type Contents\n  def read(in: In): Contents\n}\n\nclass ImageReader extends\
  \ Reader {\n  type In = File\n  type Contents = BufferedImage\n  def read(file:\
  \ In) = ImageIO.read(file)\n}\n```\n\n使用类型参数，`ImageReader` 将扩展 `Reader[File, BufferedImage]`。这仍然是可以的，但你可以看到，这种技术在更复杂的情况下扩展性并不好。\n\
  \n此外，抽象类型可以表达类型之间微妙的相互依赖关系。下一节将有一个示例。\n\n抽象类型可以像类型参数一样拥有类型界限（type bounds）。例如：\n\n\
  ```scala\ntrait Listener {\n  type Event <: java.util.EventObject\n  ...\n}\n```\n\
  \n子类必须提供一个兼容的类型，例如：\n\n点击此处查看代码图像\n\n```scala\ntrait ActionListener extends Listener\
  \ {\n  type Event = java.awt.event.ActionEvent // OK，它是子类型\n}\n```\n\n### 18.13\
  \ 族多态 (Family Polymorphism) ![image](img/00009.jpeg)\n\n建模共同变化、共享公共代码并保持类型安全的类型族是一个挑战。例如，考虑\
  \ Java 客户端中的事件处理。有不同类型的事件（如 `ActionEvent`、`ChangeEvent` 等）。每种类型都有对应的监听器接口（`ActionListener`、`ChangeListener`\
  \ 等）。这就是“族多态”的一个例子。\n\n让我们设计一个通用的监听器管理机制。我们将开始使用泛型类型，然后切换到抽象类型。\n\n在 Java 中，每个监听器接口在事件发生时调用的方法名称不同：`actionPerformed`、`stateChanged`、`itemStateChanged`\
  \ 等。我们将它们统一：\n\n```scala\ntrait Listener[E] {\n  def occurred(e: E): Unit\n}\n```\n\
  \n事件源需要一个监听器集合以及一个触发它们的所有方法：\n\n```scala\ntrait Source[E, L <: Listener[E]] {\n\
  \  private val listeners = new ArrayBuffer[L]\n  def add(l: L) { listeners += l\
  \ }\n  def remove(l: L) { listeners -= l }\n  def fire(e: E) {\n    for (l <- listeners)\
  \ l.occurred(e)\n  }\n}\n```\n\n现在考虑一个触发动作的按钮。我们定义一个监听器类型\n\n点击此处查看代码图像\n\n```scala\n\
  trait ActionListener extends Listener[ActionEvent]\n```\n\n`Button` 类可以混入 `Source`\
  \ 特质：\n\n点击此处查看代码图像\n\n```scala\nclass Button extends Source[ActionEvent, ActionListener]\
  \ {\n  def click() {\n    fire(new ActionEvent(this, ActionEvent.ACTION_PERFORMED,\
  \ \"click\"))\n  }\n}\n```\n\n任务完成：`Button` 类不需要复制监听器管理代码，且监听器是类型安全的。你不能向按钮添加一个\
  \ `ChangeListener`。\n\n`ActionEvent` 类将事件源设置为 `this`，但事件源的类型是 `Object`。我们可以通过自类型（self\
  \ type）使其具有类型安全性：\n\n点击此处查看代码图像\n\n```scala\ntrait Event[S] {\n  var source: S =\
  \ _\n}\n\ntrait Listener[S, E <: Event[S]] {\n  def occurred(e: E): Unit\n}\n\n\
  trait Source[S, E <: Event[S], L <: Listener[S, E]] {\n  this: S =>\n  private val\
  \ listeners = new ArrayBuffer[L]\n  def add(l: L) { listeners += l }\n  def remove(l:\
  \ L) { listeners -= l }\n  def fire(e: E) {\n    e.source = this // 这里需要自类型\n  \
  \  for (l <- listeners) l.occurred(e)\n  }\n}\n```\n\n注意在将源设置为 `this` 时所需的自类型 `this:\
  \ S =>`。否则，`this` 将仅仅是某个 `Source`，而不一定是 `Event[S]` 要求的那个。\n\n以下是如何定义按钮的：\n\n点击此处查看代码图像\n\
  \n```scala\nclass ButtonEvent extends Event[Button]\ntrait ButtonListener extends\
  \ Listener[Button, ButtonEvent]\nclass Button extends Source[Button, ButtonEvent,\
  \ ButtonListener] {\n  def click() { fire(new ButtonEvent) }\n}\n```\n\n你可以看到类型参数的激增。使用抽象类型，这看起来会好一点。\n\
  \n点击此处查看代码图像\n\n```scala\ntrait ListenerSupport {\n  type S <: Source\n  type E\
  \ <: Event\n  type L <: Listener\n  trait Event {\n    var source: S = _\n  }\n\
  \  trait Listener {\n    def occurred(e: E): Unit\n  }\n  trait Source {\n    this:\
  \ S =>\n    private val listeners = new ArrayBuffer[L]\n    def add(l: L) { listeners\
  \ += l }\n    def remove(l: L) { listeners -= l }\n    def fire(e: E) {\n      e.source\
  \ = this\n      for (l <- listeners) l.occurred(e)\n    }\n  }\n}\n```\n*(注：由于原文最后部分似乎存在格式错乱或重复，已根据上下文逻辑重构为清晰的抽象类型定义结构)*\n\
  \n\n\n为了在 `Iterable` 中实现 `map`，我们需要更多的支持。`Iterable` 需要能够产生一个包含任何类型 `F` 值的容器。让我们定义一个\
  \ `Container` 特性（trait）——它是可以向其中添加值的对象：\n\n```scala\ntrait Container[E] {\n  def\
  \ +=(e: E): Unit\n}\n```\n\n需要 `build` 方法来产生这样一个对象：\n\n点击此处查看代码图片\n\n```scala\n\
  trait Iterable[E, C[X] <: Container[X]] {\n  def build[F](): C[F]\n  ...\n}\n```\n\
  \n类型构造器 `C` 现在被限制为必须是一个 `Container`，因此我们知道可以向 `build` 返回的对象中添加项。我们不能再对 `C` 的参数使用通配符了，因为我们需要指示\
  \ `C[X]` 是同一个 `X` 的容器。\n\n***\n\n![image](img/00015.jpeg) 注意\n\n`Container` 特性是\
  \ Scala 集合库中使用的构建器机制（builder mechanism）的简化版本。\n\n***\n\n`map` 方法可以在 `Iterable` 特性中实现：\n\
  \n点击此处查看代码图片\n\n```scala\ndef mapF => F) : C[F] = {\n  val res = build[F]()\n  val\
  \ iter = iterator()\n  while (iter.hasNext) res += f(iter.next())\n  res\n}\n```\n\
  \n`Iterable` 类不再需要提供它们自己的 `map`。这里是 `Range` 类：\n\n点击此处查看代码图片\n\n```scala\nclass\
  \ Range(val low: Int, val high: Int) extends Iterable[Int, Buffer] {\n  def iterator()\
  \ = new Iterator[Int] {\n    private var i = low\n    def hasNext = i <= high\n\
  \    def next() = { i += 1; i - 1 }\n  }\n  def build[F]() = new Buffer[F]\n}\n\
  ```\n\n注意 `Range` 是一个 `Iterable`：你可以遍历它的内容。但它不是一个 `Container`：你不能向它添加值。\n\n相反，`Buffer`\
  \ 者兼之：\n\n点击此处查看代码图片\n\n```scala\nclass Buffer[E : Manifest] extends Iterable[E,\
  \ Buffer] with Container[E] {\n  private var capacity = 10\n  private var length\
  \ = 0\n  private var elems = new ArrayE // 查看注释\n  def iterator() = new Iterator[E]\
  \ {\n    private var i = 0\n    def hasNext = i < length\n    def next() = { i +=\
  \ 1; elems(i - 1) }\n  }\n  def build[F : Manifest]() = new Buffer[F]\n  def +=(e:\
  \ E) {\n    if (length == capacity) {\n      capacity = 2 * capacity\n      val\
  \ nelems = new ArrayE // 查看注释\n      for (i <- 0 until length) nelems(i) = elems(i)\n\
  \      elems = nelems\n    }\n    elems(length) = e\n    length += 1\n  }\n}\n```\n\
  \n***\n\n![image](img/00015.jpeg) 注意\n\n这个例子中还有一个额外的复杂度，它与高阶类型（higher-kinded types）无关。为了构造一个泛型的\
  \ `Array[E]`，类型 `E` 必须满足在 第 17 章 中讨论过的 `Manifest` 上文边界（context bound）。\n\n***\n\n\
  这个例子展示了高阶类型的典型用法。`Iterator` 依赖于 `Container`，但 `Container` 不是类型——它是产生类型的机制。\n\nScala\
  \ 集合库的 `Iterable` 特性没有用于创建集合的显式参数。相反，Scala 使用*隐式参数*（implicit parameter）来构造构建目标集合的对象。更多信息请参阅\
  \ 第 21 章。\n\n### 练习\n\n**1.** 实现一个 `Bug` 类，模拟一个沿水平线移动的虫子。`move` 方法沿当前方向移动，`turn`\
