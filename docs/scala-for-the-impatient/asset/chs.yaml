  \ 是其他物品的序列。注意在这个例子中 `_*` 是必须的。\n\n### 14.14 Sealed 类\n\n当你使用模式匹配匹配 case classes\
  \ 时，你希望编译器检查你是否涵盖了所有选项。你通过将公共父类声明为 `sealed` 来实现这一点：\n\n点击此处查看代码图片\n\n```scala\n\
  sealed abstract class Amount\ncase class Dollar(value: Double) extends Amount\n\
  case class Currency(value: Double, unit: String) extends Amount\n```\n\n密封类的所有子类必须定义在与该类相同的文件中。\n\
  \n当一个类是密封的，其所有的子类在编译时都是已知的，使得编译器能够检查模式句的完整性。\n\n### 14.15 模拟枚举\n\ncase class 允许你在\
  \ Scala 中模拟枚举类型。\n\n\n\n\n\n点击此处查看图像\n\n```scala\nsealed abstract class TrafficLightColor\n\
  \ncase object Red extends TrafficLightColor\n\ncase object Yellow extends TrafficLightColor\n\
  \ncase object Green extends TrafficLightColor\n\ncolor match {\n  case Red => \"\
  stop\"\n  case Yellow => \"hurry up\"\n  case Green => \"go\"\n}\n```\n\n注意父类被声明为\
  \ `sealed`，这使得编译器能够检查 `match` 子句是否是完整的。\n\n如果你觉得这种方法有点笨重，你可能更倾向于使用第 6 章描述过的 `Enumeration`\
  \ 辅助类。\n\n## 14.16 Option 类型\n\n标准库中的 `Option` 类型使用 case 类（case classes）来表示可能存在也可能的值。子类\
  \ `Some` 包装了一个值，例如 `Some(\"Fred\")`。case 对象 `None` 表示没有值。\n\n这比使用空字符串更不歧义，也比使用 `null`\
  \ 来表示缺失的值更安全。\n\n`Option` 是一个泛型类型。例如，`Some(\"Fred\")` 的类型是 `Option[String]`。\n\n\
  `Map` 类的 `get` 方法返回一个 `Option`。如果给定的键没有值，`get` 返回 `None`。否则，它会将值包装在 `Some` 中。\n\n\
  你可以使用模式匹配来分析此类值。\n\n```scala\nscores.get(\"Alice\") match {\n  case Some(score)\
  \ => println(score)\n  case None => println(\"No score\")\n}\n```\n\n但坦率说，这很繁琐。或者，你可以使用\
  \ `isEmpty` 和 `get`：\n\n点击此处查看图像\n\n```scala\nval alicesScore = scores.get(\"Alice\"\
  )\n\nif (alicesScore.isEmpty) println(\"No score\")\nelse println(alicesScore.get)\n\
  ```\n\n也很繁琐。最好使用 `getOrElse` 方法：\n\n点击此处查看图像\n\n```scala\nprintln(alicesScore.getOrElse(\"\
  No score\"))\n```\n\n如果 `alicesScore` 是 `None`，则 `getOrElse` 返回 `\"No Score\"`。事实上，这种情况非常常见，因此\
  \ `Map` 类也提供了一个 `getOrElse`：\n\n点击此处查看图像\n\n```scala\nprintln(scores.getOrElse(\"\
  Alice\", \"No score\"))\n```\n\n如果你想跳过 `None` 值，请使用 `for` 复合表达式：\n\n点击此处查看图像\n\n\
  ```scala\nfor (score <- scores.get(\"Alice\")) println(score)\n```\n\n如果 `get` 方法返回\
  \ `None`，则什么都不会发生。如果它是 `Some`，则 `score` 将绑定到它的内容。\n\n你也可以将 `Option` 视为一个可能为空或包含一个元素的集合，并使用\
  \ `map`、`foreach` 或 `filter` 等方法。例如，\n\n```scala\nscores.get(\"Alice\").foreach(println\
  \ _)\n```\n\n这会打印分数，或者在 `get` 返回 `None` 时什么都不做。\n\n## 14.17 部分函数 ![image](img/00011.jpeg)\n\
  \n大括号包围的一组 `case` 子句是一个*部分函数*——一个可能未对所有输入定义的函数。它是类 `PartialFunction[A, B]` 的实例。（`A`\
  \ 是参数类型，`B` 是返回类型）。该类有两个方法：`apply`，它根据匹配的模式计算函数值；以及 `isDefinedAt`，如果输入匹配至少一个模式则返回\
  \ `true`。\n\n例如，\n\n点击此处查看图像\n\n```scala\nval f: PartialFunction[Char, Int] = {\
  \ case '+' => 1 ; case '-' => -1 }\n\nf('-') // 调用 f.apply('-'), 返回 -1\n\nf.isDefinedAt('0')\
  \ // false\n\nf('0') // 抛出 MatchError\n```\n\n某些方法接受 `PartialFunction` 作为参数。例如，`GenTraversable`\
  \ 特性的 `collect` 方法将部分函数应用于所有已定义的元素上，并返回结果的序列。\n\n点击此处查看图像\n\n```scala\n\"-3+4\"\
  .collect { case '+' => 1 ; case '-' => -1 } // Vector(-1, 1)\n```\n\n***\n\n![image](img/00015.jpeg)\
  \ 注意\n\n部分函数表达式必须位于编译器可以推断返回类型的上下文中。当你将其赋值给一个类型化变量或将其传递给参数时，情况如此。\n\n***\n\n###\
