    \ return type. Here's an example:\n\n```cpp\nclass Rectangle {\npublic:\n    double\
    \ length;\n    double width;\n\n    // Constructor\n    Rectangle(double len,\
    \ double wid) {\n    length = len;\n    width = wid;\n    }\n};\n```\n\nIn this\
    \ example, we define a constructor for the `Rectangle` class that takes two parameters,\
    \ `len` and `wid`, to initialize the `length` and `width` attributes.\n\nA destructor\
    \ is used to clean up resources and perform any necessary finalization before\
    \ an object is destroyed. It has the same name as the class preceded by a tilde\
    \ (~) and is declared without parameters. Here's an example:\n\n```cpp\nclass\
    \ Rectangle {\npublic:\n    double length;\n    double width;\n\n    // Constructor\n\
    \    Rectangle(double len, double wid) {\n        length = len;\n        width\
    \ = wid;\n    }\n\n    // Destructor\n    ~Rectangle() {\n        // Cleanup code\
    \ here\n    }\n};\n...\n```\n\nIn this example, we add a destructor to the `Rectangle`\
    \ class. The destructor can be used to release any dynamically allocated memory\
    \ or perform any other cleanup tasks.\n\n### Encapsulation and Data Hiding\n\n\
    One of the key principles of OOP is encapsulation, which involves bundling data\
    \ and related functionality into a single unit (a class). Encapsulation allows\
    \ for the data to be hidden or protected from direct access and manipulation from\
    \ outside the class. Access to the data is controlled through methods, such as\
    \ getters and setters.\n\nHere's an example that demonstrates encapsulation and\
    \ data hiding:\n\n```cpp\nclass BankAccount {\n\nprivate:\n    std::string accountNumber;\n\
    \    double balance;\n\npublic:\n    // Getter for accountNumber\n    std::string\
    \ getAccountNumber() {\n        return accountNumber;\n    }\n\n    // Setter\
    \ for balance\n    void setBalance(double amount) {\n        if (amount >= 0)\
    \ {\n            balance = amount;\n        }\n    }\n};\n```\n\nIn this example,\
    \ the `accountNumber` attribute is marked as private, preventing direct access\
    \ to it from outside the class. The `getAccountNumber()` method is provided as\
    \ a public getter to access the account number. Similarly, the `balance` attribute\
    \ is marked as private, and the `setBalance()` method is provided as a public\
    \ setter to control access and validation of the balance attribute.\n\n### Inheritance\n\
    \nInheritance is a mechanism that allows a class to inherit the properties and\
    \ behaviors of another class. The class being inherited from is called the base\
    \ class or parent class, while the class inheriting from it is called the derived\
    \ class or child class. Inheritance promotes code reuse and allows for the creation\
    \ of class hierarchies.\n\nHere's an example of inheritance:\n\n```cpp\nclass\
    \ Shape {\npublic:\n    virtual double calculateArea() = 0;\n};\nclass Rectangle\
    \ : public Shape {\npublic:\n  double length;\n  double width;\n\n  double calculateArea()\
    \ override {\n    return length * width;\n  }\n};\n```\n\nIn this example, we\
    \ have a base class named `Shape` that defines a pure virtual method `calculateArea()`.\
    \ The `Rectangle` class is derived from the `Shape` class using the `public` access\
    \ specifier. It overrides the `calculateArea()` method to provide the specific\
    \ implementation for calculating the area of a rectangle.\n\n### Polymorphism\n\
    \nPolymorphism is the ability of objects of different classes to be treated as\
    \ objects of a common base class. Polymorphism allows for the use of a single\
    \ interface to represent multiple classes. It enables code to be written that\
    \ can work with objects of different types without needing to know their specific\
    \ types.\n\nHere's an example that demonstrates polymorphism:\n\n```cpp\nclass\
    \ Shape {\npublic:\n    virtual double calculateArea() = 0;\n};\n\nclass Rectangle\
    \ : public Shape {\n\npublic:\n    double length;\n    double width;\n\n    double\
    \ calculateArea() override {\n        return length * width;\n    }\n};\n\nclass\
    \ Circle : public Shape {\npublic:\n    double radius;\n\n    double calculateArea()\
    \ override {\n        return 3.14 * radius * radius;\n    }\n};\n\nvoid printArea(Shape*\
    \ shape) {\n    std::cout << \"Area: \" << shape->calculateArea() << std::endl;\n\
    }\n\nint main() {\n    Rectangle rect;\n    rect.length = 5.0;\n    rect.width\
    \ = 3.0;\n\n    Circle circle;\n    circle.radius = 4.0;\n\n    printArea(&rect);\n\
    \    printArea(&circle);\n\n    return 0;\n}\n```\n\nIn this example, we have\
    \ a base class `Shape` with a pure virtual method `calculateArea()`. The `Rectangle`\
    \ and `Circle` classes are derived from the `Shape` class and provide their own\
    \ implementations of `calculateArea()`. The `printArea()` function takes a pointer\
    \ to `Shape` object and calls its `calculateArea()` method, demonstrating polymorphic\
    \ behavior.\n"
