    \    }\n};\n...\n```\n\n在这个示例中，我们为 `Rectangle` 类添加了析构函数。析构函数可以释放任何动态分配的内存或执行任何其他清理任务。\n\
    \n### 封装与数据隐藏\n\n面向对象编程（OOP）的核心原则之一是封装，它将数据和相关功能打包到单个单元（类）中。封装允许数据被隐藏或防止从类外部直接访问和操作。对数据的访问通过方法（如\
    \ getter 和 setter）来控制。\n\n这是一个演示封装和数据隐藏的示例：\n\n```cpp\nclass BankAccount {\n\n\
    private:\n    std::string accountNumber;\n    double balance;\n\npublic:\n   \
    \ // 获取账号的 getter\n    std::string getAccountNumber() {\n        return accountNumber;\n\
    \    }\n\n    // 设置余额的 setter\n    void setBalance(double amount) {\n        if\
    \ (amount >= 0) {\n            balance = amount;\n        }\n    }\n};\n```\n\n\
    在这个示例中，`accountNumber` 属性被标记为 `private`（私有），防止从类外部直接访问它。提供了 `getAccountNumber()`\
    \ 方法作为公共 getter 来访问账号。。同样，`balance` 属性被标记为 `private`，并提供了 `setBalance()` 方法作为公共\
    \ setter 来控制 `balance` 属性的访问和验证。\n\n### 继承\n\n继承是一种允许类继承另一个类的属性和行为的机制。被继承的类被称为基类或父类，而继承它的类被称为派生类或子类。继承促进了代码复用并允许创建类层次结构。\n\
    \n这是一个继承的示例：\n\n```cpp\nclass Shape {\npublic:\n    virtual double calculateArea()\
    \ = 0;\n};\nclass Rectangle : public Shape {\npublic:\n  double length;\n  double\
    \ width;\n\n  double calculateArea() override {\n    return length * width;\n\
    \  }\n};\n```\n\n在这个示例中，我们有一个名为 `Shape` 的基类，它定义了一个纯虚方法 `calculateArea()`。`Rectangle`\
    \ 类使用 `public` 访问修饰符派自 `Shape` 类。它重写了 `calculateArea()` 方法，为计算矩形面积提供了具体的实现。\n\n\
    ### 多态\n\n多态允许将不同类的对象视为共同基类的对象。多态允许单一接口表示多个类。它使得代码能够处理不同类型的对象，而无需知道它们的具体类型。\n\n\
    这是一个演示多态的示例：\n\n```cpp\nclass Shape {\npublic:\n    virtual double calculateArea()\
    \ = 0;\n};\n\nclass Rectangle : public Shape {\n\npublic:\n    double length;\n\
    \    double width;\n\n    double calculateArea() override {\n        return length\
    \ * width;\n    }\n};\n\nclass Circle : public Shape {\npublic:\n    double radius;\n\
    \n    double calculateArea() override {\n        return 3.14 * radius * radius;\n\
    \    }\n};\n\nvoid printArea(Shape* shape) {\n    std::cout << \"Area: \" << shape->calculateArea()\
    \ << std::endl;\n}\n\nint main() {\n    Rectangle rect;\n    rect.length = 5.0;\n\
    \    rect.width = 3.0;\n\n    Circle circle;\n    circle.radius = 4.0;\n\n   \
    \ printArea(&rect);\n    printArea(&circle);\n\n    return 0;\n}\n```\n\n在这个示例中，我们有一个带有纯虚方法\
    \ `calculateArea()` 的基类 `Shape`。`Rectangle` 和 `Circle` 类派生自 `Shape` 类并提供了它们各自的\
    \ `calculateArea()` 实现。`printArea()` 函数接收一个 `Shape` 对象的指针并调用它的 `calculateArea()`\
    \ 方法，展示了多态行为。\n"
