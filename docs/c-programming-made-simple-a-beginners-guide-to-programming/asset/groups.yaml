    \ << \"Full name: \" << fullName << std::endl;\n```\n\n- Length: The `length()`\
    \ or `size()` member functions can be used to obtain the length of a string. Here's\
    \ an example:\n\n```cpp\nstd::string message = \"Hello, world!\";\nstd::cout <<\
    \ \"Length of message: \" << message.length() << std::endl;\n```\n"
