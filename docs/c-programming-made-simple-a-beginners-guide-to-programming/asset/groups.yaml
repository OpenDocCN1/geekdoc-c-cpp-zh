    ### Variable Names and Conventions


    When choosing variable names, it is important to follow certain conventions to
    ensure code readability and maintainability. Here are some common conventions:


    - Variable names should be descriptive and meaningful. For example, instead of
    using `x` or `a`, use names like `age`, `score`, or `isValid`.


    - Variable names should start with a lowercase letter. If the name consists of
    multiple words, we can use camel case or underscores to separate them. For example,
    `studentName`, `temperatureInCelsius`, or `is_valid`.


    - Avoid using reserved keywords as variable names. C++ has a set of reserved keywords
    that have pre-defined meanings in the language. Examples of reserved keywords
    include `int`, `float`, `char`, `bool`, and others.


    ### Scope and Lifetime of Variables


    Variables have a scope and lifetime within a program. The scope of a variable
    determines the portion of the program where the variable is accessible. The lifetime
    of a variable defines the duration for which the variable exists in memory.


    In C++, variables can have local scope or global scope. Local variables are defined
    within a specific block or function and are accessible only within that block
    or function. Global variables, on the other hand, are declared outside of any
    function and can be accessed from any part of the program.


    The lifetime of a local variable starts when it is declared and ends when the
    block or function containing it is exited. Global variables, on the other hand,
    exist for the entire duration of the program.


    It is good practice to limit the scope of variables as much as possible to avoid
    potential naming conflicts and improve code readability.


    ## Common Data Types in C++


    C++ provides various data types that allow us to work with different kinds of
    data. Let''s explore some commonly used data types:


    ### Integer Types


    Integer types are used to store whole numbers. C++ provides several integer types
    with different storage capacities. Here are some commonly used integer types:


    - `int`: Used for storing integers with a typical range of -2,147,483,648 to 2,147,483,647
    on most systems.


    - `short`: Used for storing shorter integers with a range of approximately -32,768
    to 32,767.


    - `long`: Used for storing longer integers with a range of approximately -2,147,483,648
    to 2,147,483,647.


    - `long long`: Used for storing even longer integers with a range of approximately
    -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807.


    Example:


    ```cpp

    int score = 100;

    short numStudents = 25;

    ```


    ```cpp

    long population = 789456123;

    long long veryLargeNumber = 9876543210123456789LL;

    ```


    ### Floating-Point Types


    Floating-point types are used to store decimal numbers. C++ provides two primary
    floating-point types:


    - `float`: Used for storing single-precision floating-point numbers with approximately
    6-7 significant digits.

    - `double`: Used for storing double-precision floating-point numbers with approximately
    15 significant digits.


    Example:


    ```cpp

    float pi = 3.14159f;

    double average = 85.5321;

    ```


    ### Character Types


    Character types are used to store individual characters. C++ provides two character
    types:


    - `char`: Used for storing single characters.

    - `wchar_t`: Used for storing wide characters, which can represent a broader range
    of characters, including those from non-ASCII character sets.


    Example:


    ```cpp

    char grade = ''A'';

    wchar_t euroSymbol = L''€'';

    ```


    ### Boolean Type


    The boolean type is used to represent logical values. It can have two possible
    values: `true` or `false`.


    Example:


    ```cpp

    bool isValid = true;

    bool isReady = false;

    ```


