  mdcn: "\n要创建一个类的对象，我们使用类名，后跟对象名称以及可选的括号。这是一个示例：\n\n```cpp\nRectangle rect1; // 创建一个\
    \ Rectangle 类的对象\n```\n```\n\n在这个示例中，我们为 `Rectangle` 类创建了一个名为 `rect1` 的对象。\n\n\
    ### 访问类成员\n\n要访问对象的成员（属性和方法），我们使用点 ( . ) 运算符。这是一个示例：\n\n```cpp\nRectangle rect1;\n\
    rect1.length = 5.0; // 访问并给 'length' 属性赋值\nrect1.width = 3.0; // 访问并给 'width'\
    \ 属性赋值\ndouble area = rect1.calculateArea(); // 访问并调用 'calculateArea' 方法\nstd::cout\
    \ << \"Area: \" << area << std::endl;\n```\n```\n\n在这个示例中，我们使用点运算符访问了 `rect1`\
    \ 对象的属性并为它们赋值。我们还调用了 `calculateArea()` 方法来计算矩形的面积。\n\n### 构造函数和析构函数\n\n构造函数和析构函数是类中的特殊成员函数，它们分别在对象创建和销毁时自动调用。\n\
    \n构造函数用于初始化对象的属性并执行任何必要的设置。它的名称与类名相同，且声明时不带返回值。这是一个示例：\n\n```cpp\nclass Rectangle\
    \ {\npublic:\n\ndouble length;\n\ndouble width;\n\n// 构造函数\nRectangle(double len,\
    \ double wid) {\n    length = len;\n    width = wid;\n}\n};\n```\n\n在这个示例中，我们为\
    \ `Rectangle` 类定义了一个构造函数，它接受两个参数 `len` 和 `wid`，用于初始化 `length` 和 `width` 属性。\n\n\
    析构函数用于在对象销毁之前清理资源并执行任何必要的终止。它的名称与类名相同，前面有一个波浪号 (~)，且声明不需要参数。这是一个示例：\n\n```cpp\n\
    class Rectangle {\npublic:\n    double length;\n    double width;\n\n    // 构造函数\n\
    \    Rectangle(double len, double wid) {\n        length = len;\n        width\
    \ = wid;\n    }\n\n // 析构函数\n~Rectangle() {\n    // 在此处编写清理代码\n}\n};\n```\n\n\
    在这个示例中，我们为 `Rectangle` 类添加了一个析构函数。析构函数可以释放任何动态分配的内存或执行任何其他清理任务。\n\n### 封装和数据隐藏\n\
    \n封装是面向对象编程（OOP）的一个核心原则，涉及将数据和相关功能封装在一个单元（类）中。它允许数据隐藏，使得类的内部细节对外部访问不可见。数据的访问通过方法（如\
    \ getter 和 setter）来控制。\n\n这里有一个演示封装和数据隐藏的示例：\n\n```cpp\nclass BankAccount {\n\
    private:\n    std::string accountNumber;\n    double balance;\npublic:\n    //\
    \ 获取 accountNumber 的 getter\n    std::string getAccountNumber() {\nreturn accountNumber;\n\
    }\n\n// 设置 balance 的 setter\nvoid setBalance(double amount) {\n    if (amount\
    \ >= 0) {\n        balance = amount;\n    }\n}\n};\n```\n\n在这个示例中，`accountNumber`\
    \ 属性被标记为 `private`，防止从类外部直接访问它。提供了 `getAccountNumber()` 方法作为公共 getter 来访问账户号码。同样，`balance`\
    \ 属性被标记为 `private`，并提供了 `setBalance()` 方法作为公共 setter 来控制对余额属性的访问和验证。\n\n### 成员函数\n\
    \n成员函数是在类内部定义的方法。它们封装了与类相关的行为和操作。成员函数可以访问并操作对象的属性。\n\n### 静态成员\n\n静态成员是类的所有实例所共享的类成员。它们独立于特定的对象，即使在没有创建类对象时也存在。可以使用类名访问静态成员，而不需要实例化。\n\
    \n```cpp\nclass Circle {\npublic:\n    static constexpr double PI = 3.14159;\n\
    \    static double calculateArea(double radius) {\n        return PI * radius\
    \ * radius;\n    }\n};\n```\n\n在这个示例中，`PI` 是 `Circle` 类的静态成员。它被类的所有对象共享，并可以使用类名\
    \ (`Circle::PI`) 进行访问。`calculateArea()` 方法也被声明为静态，可以使用类名 (`Circle::calculateArea()`)\
    \ 进行调用。\n\n### 友元函数\n\n友元函数不是类的成员，但可以访问类的私有和保护成员。它们可以在类内部被声明为友元，以授予它们特殊的访问权限。\n\
    \n```cpp\nclass Rectangle {\nprivate:\n    double length;\n    double width;\n\
    \npublic:\n\nRectangle(double len, double wid) {\n\n    length = len;\n    width\
    \ = wid;\n}\n\nfriend double calculateDiagonal(const Rectangle& rect);\n\n};\n\
    \ndouble calculateDiagonal(const Rectangle& rect) {\n    return std::sqrt(rect.length\
    \ * rect.length + rect.width * rect.width);\n}\n```\n\n在这个示例中，`calculateDiagonal()`\
    \ 被声明为 `Rectangle` 类的友元。它可以访问 `Rectangle` 的私有属性。\n\n## 结论\n\n在本章中，我们了类和对象。类作为定义属性和行为的蓝图或模板。是类的实例。我们学习了如何声明和定义类、创建对象、访问成员以及使用构造函数和析构函数。我们还讨论了封装和数据隐藏，通过\
    \ getter 和 setter 促进安全性和控访问。此外，我们还探索了类所有实例共享的静态成员，以及可以访问类私有和保护成员的友元函数。\n\n通过掌握类和对象，你可以设计出结构良好且可复的代码。在下一章中，我们将深入更高级的主题，包括继承、多态和抽象。\n"
