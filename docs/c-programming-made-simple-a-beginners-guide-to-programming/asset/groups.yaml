    \n## 函数\n\n函数是一个命名的代码块，用于执行特定任务或一组相关任务。函数通过将一系列语句封装到单个单元中，提供了一种代码模块化的方法。它们促进了代码的重用、可读性和维护性。\n\
    \n### 函数的声明与定义\n\n在 C++ 中定义函数，我们需要提供函数的签名，其中包含返回类型、名称以及它接受的任何参数。函数体包含调用函数时执行的语句。这里是一个函数声明和定义的示例：\n\
    \n```cpp\n// 函数声明\nint addNumbers(int a, int b);\n\n// 函数定义\nint addNumbers(int\
