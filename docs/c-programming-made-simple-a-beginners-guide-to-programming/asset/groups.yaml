- md: "\n# Chapter 14: Templates and Standard Template Library (STL)\n\nTemplates\
    \ and the Standard Template Library (STL) are powerful features of C++ that enhance\
    \ code reusability and provide a collection of useful data structures and algorithms.\
    \ In this chapter, we will explore templates and the STL and learn how to leverage\
    \ them in our programs.\n\n## Templates\n\nTemplates in C++ allow for generic\
    \ programming, where we can write code that works with different data types without\
    \ duplicating the code for each type. Templates provide a way to define classes\
    \ or functions that can operate on multiple types, known as template parameters.\n\
    \n### Function Templates\n\nFunction templates allow us to create generic functions\
    \ that can operate on different types. The syntax for a function template includes\
    \ the `template` keyword followed by the template parameter(s) in angle brackets\
    \ (`<>`). Here's an example:\n\n```\n```cpp\ntemplate <typename T>\nT add(T a,\
    \ T b) {\n    return a + b;\n}\n```\n```\n\nIn this example, we define a function\
    \ template `add()` that takes two arguments of type `T` and returns their sum.\
    \ The `T` is a placeholder for the actual type that will be used when the function\
    \ is called.\n\nWe can call the `add()` function template with different types,\
    \ and the compiler generates the appropriate code for each type:\n\n```\n```cpp\n\
    int result1 = add(3, 4); // Calling add() with int arguments\ndouble result2 =\
    \ add(2.5, 1.5); // Calling add() with double arguments\n```\n```\n\n### Class\
    \ Templates\n\nClass templates allow us to create generic classes that can work\
    \ with different types. The syntax for a class template is similar to that of\
    \ a regular class, with the template parameter(s) specified in angle brackets\
    \ (`< >`). Here's an example:\n\n```\n```cpp\ntemplate <typename T>\nclass Stack\
    \ {\nprivate:\n    std::vector<T> elements;\npublic:\n    void push(const T& value)\
    \ {\n        elements.push_back(value);\n    }\n};\n```\n```\n\n```\nvoid pop()\
    \ {\n  elements.pop_back();\n}\n\nT top() const {\n  return elements.back();\n\
    }\n\nbool empty() const {\n  return elements.empty();\n}\n\n```\n```\n\nIn this\
    \ example, we define a class template `Stack` that represents a stack data structure.\
    \ The elements of the stack are stored in a `std::vector` container, which is\
    \ a part of the STL.\n\nWe can create instances of the `Stack` class template\
    \ for different types:\n\n```cpp\nStack<int> intStack; // Stack of integers\n\
    Stack<double> doubleStack; // Stack of doubles\nintStack.push(42);\ndoubleStack.push(3.14);\n\
    ```\n```\n\n### Template Specialization\n\nTemplate specialization allows us to\
    \ provide a specialized implementation for specific types. It enables us to customize\
    \ the behavior of a template for specific cases. Here's an example of template\
    \ specialization for the `add()` function template:\n\n```\n```cpp\ntemplate <>\n\
    std::string add(std::string a, std::string b) {\n    return a + \" \" + b;\n}\n\
    ```\n```\n\nIn this example, we specialize the `add()` function template for the\
    \ `std::string` type. The specialized version concatenates two strings with a\
    \ space in between.\n\n## Standard Template Library (STL)\n\n### Containers\n\n\
    The STL provides various container classes that store collections of elements.\
    \ Some commonly used containers include:\n\n- `std::vector`: A dynamic array that\
    \ grows automatically as elements are added.\n- `std::list`: A doubly-linked list.\n\
    - `std::deque`: A double-ended queue.\n- `std::set`: A container that stores unique\
    \ elements in a sorted order.\n- `std::map`: An associative container that stores\
    \ key-value pairs.\n\n### Iterators\n\nIterators provide a way to traverse the\
    \ elements of a container. They act as generalized pointers and allow us to access\
    \ elements.\n\n### Algorithms\n\nSTL provides a wide range of algorithms that\
    \ operate on containers. Some commonly used algorithms include:\n\n- `sort()`:\
    \ Sorts elements of a container.\n- `find()`: Searches for a value in a container.\n\
    - `count()`: Counts the occurrences of a value.\n- `transform()`: Applies a function\
    \ to each element.\n- `accumulate()`: Calculates the sum of elements.\n\n### Function\
    \ Objects\n\nFunction objects (also known as functors) are objects that behave\
    \ like functions. They are often defined as classes or lambda expressions.\n\n\
    ```\n```cpp\nstruct Square {\n  int operator()(int x) const {\n    return x *\
    \ x;\n  }\n};\n```\n```\n\n```cpp\nstd::vector<int> numbers = {1, 2, 3, 4, 5};\n\
    \n// Using function object\nstd::transform(numbers.begin(), numbers.end(), numbers.begin(),\
    \ Square());\n\n// Using lambda expression\nstd::transform(numbers.begin(), numbers.end(),\
    \ numbers.begin(), [](int x) { return x * x; });\n```\n\n## Conclusion\n\nTemplates\
    \ and the STL are powerful features of C++ that enhance code reusability and provide\
    \ of useful data structures and algorithms. In this chapter, we explored templates\
    \ and the STL and learned how to leverage them in our programs. We covered function\
    \ templates, class templates, template specialization, and the key components\
    \ of the STL: containers, iterators, algorithms, and function objects, making\
    \ it easier to write efficient and reusable code.\n"
  mdcn: "\n\n# 第 14 章：模板与标准模板库 (STL)\n\n模板和标准模板库 (STL) 是 C++ 的强大特性，它们增强了代码的可用性，并提供了一系列有用的数据结构和算法。在本章，我们将探索模板和\
    \ STL，并学习如何在程序中使用它们。\n\n## 模板\n\nC++ 中的模板允许泛型编程，使得我们可以编写适用于不同数据类型的代码，而无需为每个类型重复代码。模板提供了一种定义可以在多种类型上操作的类或的方法，这些类型被称为模板参数。\n\
    \n### 函数模板\n\n函数模板允许我们创建处理不同类型的泛型函数。函数模板的语法包括 `template` 关键字，后跟尖括号 (`<>`) 中的模板参数。这里是一个示例：\n\
    \n```cpp\ntemplate <typename T>\nT add(T a, T b) {\n    return a + b;\n}\n```\n\
    ```\n\n在这个示例中，我们定义了一个函数模板 `add()`，它接受两个类型为 `T` 的参数并返回它们的和。`T` 是调用函数时将使用的实际类型的占位符。\n\
    \n我们可以使用不同的类型调用 `add()` 函数模板，编译器会为每个类型生成相应的代码：\n\n```cpp\nint result1 = add(3,\
    \ 4); // 使用 int 参数调用 add()\ndouble result2 = add(2.5, 1.5); // 使用 double 参数调用\
    \ add()\n``````\n\n### 类模板\n\n类模板允许我们创建处理不同类型的泛型类。类模板的语法与普通类相似，在尖括号 (`< >`) 中指定模板参数。这里是一个示例：\n\
    \n```cpp\ntemplate <typename T>\nclass Stack {\nprivate:\n    std::vector<T> elements;\n\
    public:\n    void push(const T& value) {\n        elements.push_back(value);\n\
    \    }\n};\n```\n\n```cpp\nvoid pop() {\n  elements.pop_back();\n}\n\nT top()\
    \ const {\n  return elements.back();\n}\n\nbool empty() const {\n  return elements.empty();\n\
    }\n\n```\n```\n\n在这个示例中，我们定义了一个表示栈数据结构的类模板 `Stack`。栈的元素存储在 `std::vector` 容器中，它是\
    \ STL 的一部分。\n\n我们可以为不同类型创建 `Stack` 类模板的实例：\n\n```cpp\nStack<int> intStack; //\
    \ 整数栈\nStack<double> doubleStack; // 双精度浮栈\nintStack.push(42);\ndoubleStack.push(3.14);\n\
    ``````\n\n### 模板特化\n\n模板特化允许我们为特定类型提供专门的实现。它允许针对特定情况自定义模板的行为。这里是对 `add()` 函数模板模板特化的示例：\n\
    \n```cpp\ntemplate <>\nstd::string add(std::string a, std::string b) {\n    return\
    \ a + \" \" + b;\n}\n``````\n\n在这个示例中，我们为 `std::string` 类型对 `add()` 函数模板进行了特化。特化版本在两个字符串之间拼接了一个空格。\n\
    \n## 标准模板库 (STL)\n\n### 容器\n\nSTL 提供了各种存储元素集合的容器类。常用的容器包括：\n\n- `std::vector`:\
    \ 随着元素添加而自动增长的动态数组。\n- `std::list`: 双向链表。\n- `std::deque`: 双端队列。\n- `std::set`:\
    \ 一个以排序顺序存储唯一元素的容器。\n- `std::map`: 一个存储键值对的关联容器。\n\n### 迭代器\n\n迭代器提供了一种遍历容器元素的方法。它们充当广义指针，允许我们访问元素。\n\
