    \n```cpp\nint result = addNumbers(5, 3);\n```\n\n在这个示例中，使用参数 5 和 3 调用了 `addNumbers`\
    \ 函数。函数的返回值（两个数字之和）被存储在变量 `result` 中。\n\n### 函数参数\n\n函数参数允许我们将值传递到函数中。参数在函数的作用范围内充当变量，其值可以在函数执行期间使用。这里是一个示例：\n\
    \n```cpp\nint multiplyNumbers(int a, int b) {\n    int product = a * b;\n    return\
    \ product;\n}\n```\n\n在这个示例中，`multiplyNumbers` 函数接受两个整数参数 `a` 和 `b`。它计算 `a` 和\
    \ `b` 的积并返回结果。\n\n### 函数返回值\n\n函数的返回类型指定了函数返回值的类型。它可以是任何有效的数据类型，包括基本类型、用户定义类型，或者如果函数不返回结果，可以是\
    \ `void`。这里是一个示例：\n\n```cpp\nvoid greet() {\n  std::cout << \"Hello, world!\"\
    \ << std::endl;\n}\n```\n\n在这个示例中，`greet` 函数的返回类型为 `void`，表示它不返回值。它只是向控制台打印 \"\
    Hello, world!\"。\n\n### 函数重载\n\n函数重载允许我们定义多个具有相同但参数列表不同的函数。C++ 根据调用时提供的参数来确定调用哪个函数。这里是一个示例：\n\
    \n```cpp\nint square(int number) {\n    return number * number;\n}\n\ndouble square(double\
    \ number) {\n    return number * number;\n}\n```\n\n在这个示例中，我们定义了两个 `square` 函数。一个接受整数，另一个接受双精度。\n\
    \n## 模块化编程\n\n模块化编程是一种强调将程序分解为称为函数的自包含单元的方法。每个函数执行特定的任务。\n\n### 模块化编程的优势\n\n模块化编程具有若干优点：\n\
    \n- **代码重用性**：函数可以在程序的多个部分被重用。\n- **可读性**：将程序分解为函数使代码更易读、更容易理解。\n- **易维护性**：通过模块化编程，修复程序中的错误变得更容易。\n\
    - **扩展性**：可以添加新函数或修改现有函数而不影响程序的其他部分。\n\n### 示例：使用函数的模块化编程\n\n让我们考虑这样一个示例：我们需要计算矩形的面积和周长。我们可以通过为每个任务定义单独的来实现程序的模块化：\n\
