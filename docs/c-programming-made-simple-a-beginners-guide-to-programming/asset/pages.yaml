    longer needed.


    C++ provides three types of smart pointers:


    +   - std::unique_ptr: Represents exclusive ownership of a dynamically allocated
    object. It ensures that only one `std::unique_ptr` can own the object, and when
    the owner is destroyed, the object is automatically deleted.


    +   - std::shared_ptr: Represents shared ownership of a dynamically allocated
    object. It allows multiple `std::shared_ptr` objects to point to the same object,
    and the object is deleted only when the last `std::shared_ptr` owning it is destroyed.'
