- pgno: 433
  md: '# Why Learn SQL?


    SQL (Structured Query Language) is a standardized language used by many software
    products.


    The SQL procedure in SAS


    +   - can be used to retrieve, join, and update data in tables

    - can perform more efficient join operations than DATA step merges in some cases

    - can replace the need for multiple DATA and PROC steps with one query.


    ![](img/d3bde6e6ab06b1fc622215d982111742_433_0.png)


    # Why Learn Macro?


    The SAS macro language permits code substitution as well as automatic code generation
    and execution.


    Macro programming makes more efficient use of a SAS programmer''s time by


    +   - simplifying program maintenance

    - generating flexible, customizable code

    - executing code iteratively.


    ![](img/d3bde6e6ab06b1fc622215d982111742_433_1.png)'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# # 11.2 Using the SQL Procedure


    # Objectives


    +   - Explain the purpose and syntax of the SQL procedure.

    - Use the SQL procedure to query a SAS data set.

    - Use the SQL procedure to create a SAS data set.

    - Use the SQL procedure to join SAS data sets.


    # Business Scenario


    The director of sales at Orion Star wants a report listing employee IDs, titles,
    and salaries for his direct reports. The employee data is stored in the orion.sales_mgmt
    table.


    ![](img/d3bde6e6ab06b1fc622215d982111742_434_0.png)


    Use a PROC SQL query to examine the table and create a report.'
