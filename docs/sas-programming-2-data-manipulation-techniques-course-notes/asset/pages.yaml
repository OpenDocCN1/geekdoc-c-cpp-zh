- pgno: 210
  md: '# TRANWRD Function: Details


    The TRANWRD function replaces or removes all occurrences of a given word (or a
    pattern of characters) within a character string.


    ```

    NewVar=TRANWRD(source,target,replacement);

    ```


    These details apply when you use the TRANWRD function:


    +   - The TRANWRD function does not remove trailing blanks from target or replacement.

    - If NewVar is not previously defined, it is given a length of 200.

    - If the target string is not found in the source, then no replacement occurs.


    Using the TRANWRD function to replace an existing string with a longer string
    might cause truncation of the resulting value if a LENGTH statement is not used.


