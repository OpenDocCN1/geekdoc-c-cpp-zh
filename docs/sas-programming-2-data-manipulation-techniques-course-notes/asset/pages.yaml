- pgno: 19
  md: '# Chapter 1 Introduction


    | SAS Enterprise Guide | SAS Windowing Environment |

    |---|---|---|

    | Editor | Program Editor | Enhanced Editor or Program Editor |

    | Formatting | Automatic | Manual |

    | Syntax Help | Context-sensitive | Menu- or function key-based |

    | Output | SAS Report | HTML |

    | Projects | Yes | No |

    | Autocomplete | Yes | No |

    | Program Flow Analysis | Yes | No |


    # What Is SAS Enterprise Guide?


    *SAS Enterprise Guide* is a powerful Windows client application that provides
    a GUI for transparently accessing the power of SAS.


    +   It provides the following:

    * a point-and-click interface with menus and wizards that enable the user to define
    tasks

    * SAS code generation and execution based on user selections

    * a full programming interface that can be used to write, edit, and submit SAS
    code


    This class uses the programming interface.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '1.2 Course Logistics


    1-9


    # What Is the SAS Windowing Environment?


    ![](img/d3bde6e6ab06b1fc622215d982111742_20_0.png)


    The SAS windowing environment consists of series of windows that you can use to
    edit and submit programs, and view the results.


    The SASing environment editor contains the following windows:


    +   - the Enhanced Editor and Program Editor windows for preparing and submitting
    a program

    - the Log window for viewing notes, warning messages, and error messages

    - the Output window, which contains the output generated by most SAS procedures


