    # Creating an Accumulating Variable


    By default, variables created with an assignment statement are initialized to
    missing at the top of each iteration of the DATA step.


    ```

    data mnthtot;

    set orion.aprsales;

    Mth2Dte=Mth2Dte+SaleAmt;

    run;

    ```


    Mth2Dte is an example of an accumulating variable that needs to keep its value
    from one observation to the next.'
  merge: -1
  img_proc: true
- pgno: 84
  md: "# Creating an Accumulating Variable\n\nRetain the values of Mth2Dte and set\
    \ an initial value.\n\n```\ndata mnthtot;\n  set orion.aprsales;\n  retain Mth2Dte\
    \ 0;\n  Mth2Dte=Mth2Dte+SaleAmt;\nrun;\nRETAIN variable-name <initial-value>...\n\
    ```\n\nIf you do not supply an initial value, all the values of Mth2Dte will be\
    \ missing.\n\n# RETAIN Statement: Details\n\nThe RETAIN statement\n\n+   - retains\
    \ the value of the variable in the PDV across iterations of the DATA step\n- initializes\
    \ the retained variable to missing or a specified variable before the first iteration\
    \ of the DATA step\n- is a compile-time-only statement.\n\n> The RETAIN statement\
    \ has no effect on variables read with SET, MERGE, or UPDATE statements. Variables\
    \ read from SAS data sets are retained automatically."
  merge: -1
  img_proc: true
