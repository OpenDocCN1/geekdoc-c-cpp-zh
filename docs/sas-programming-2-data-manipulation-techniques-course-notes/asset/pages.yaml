  md: '# Using the LIBRARY= Option


    If the LIBRARY= option specifies only libref, formats are stored permanently in
    a catalog named formats, referenced by libref.formats.


    ```

    proc format library=orion;

    PROC FORMAT LIBRARY=libref;

    ```


    ![](img/d3bde6e6ab06b1fc622215d982111742_410_0.png)


    # Using the LIBRARY= Option


    If the LIBRARY= option specifies libref.catalog, formats are stored permanently
    in that catalog.


    ```

    proc format library=orion.MyFmts;

    PROC FORMAT LIBRARY=libref.catalog;

    ```


    +   - Store frequently used formats in permanent catalogs.'
