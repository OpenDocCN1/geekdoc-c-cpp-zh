- pgno: 24
  md: '# Business Scenario


    Identify a location for the course data files and execute programs to create the
    files and define the location.


    ![](img/d3bde6e6ab06b1fc622215d982111742_24_0.png)


    # Creating Course Data Files


    cre8data


    The cre8data program creates data files for this course. The program must be executed
    once, at the start of the course.


    +   - Define target locations for your course data files. The default location
    for all course data is s:\workshop. If your data files are to be created in a
    location other than s:\workshop, you must identify a location for the course data
    files.


    Create the SAS data files here: C:\Workshop\PRG2


    +   - Select File -> Open -> Program.


    +   - Navigate to the data folder, select cre8data, and click Open. The program
    is displayed in an editor. Notice the default value for the %LET statement


    +   - If your files are to be created at a location other than s:\workshop, change
    the %LET statements as follows:


    Change the value assigned to PATH= to reflect the location of the SAS data files.


    +   - If your files are to be created in s:\workshop, then no change is needed.


    +   - Press F3 to submit the program.


    +   - View the Results window and verify that the output contains a list of data
    files.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Defining the Data Location\n\nlibname\n\nThe libname program tells SAS to\
    \ find the course data files. This program must be executed each time you start\
    \ a new session.\n\n+   1. Open the libname program. The LIBNAME statement starts\
    \ with an asterisk. This means it is commented out and SAS does not execute this\
    \ statement. At this point, you only want SAS to execute the %LET statement to\
    \ tell SAS where the data files are located. You learn about the LIBNAME statement\
    \ and the use of comments later in this course.\n\n```\n%let path=s:\\workshop;\n\
    *libname orion \"s:\\workshop\";\n```\n\n> The data location might be different\
    \ in your libname program. It is defined based on the data location specified\
    \ in credata.\n\n+   2. Submit the program. View the log and verify that there\
    \ are no errors or warnings.\n\n![](img/d3bde6e6ab06b1fc622215d982111742_25_0.png)\n\
    \nYou must complete the exercises to create the course data files. If you do not\
    \ create the data files, all programs in this course will fail.\n\n# Required\
    \ Exercise\n\n+   1. Creating Course Data\n   a. The default location for all\
    \ course data is s:\\workshop. If your data files are to be created in a location\
    \ other than s:\\workshop, you must identify a location for your course data files.\n\
    \      Create the SAS data files here: C:\\Workshop\\PR2\n   b. Select File ->\
    \ Program.\n   c. Navigate to the data folder, select credata, and click Open.\
    \ The program is displayed in an editor.\n\nObserve the default values for the\
    \ %LET statements.\n\n```\n/* Windows/UNIX */\n\n/* STEP 1: Note the default values\
    \ for the %LET statements. */\n/* STEP 2: If your files are not to be located\
    \ in S:\\workshop */\n/* change the value of PATH= %LET statement to */\n/* reflect\
    \ your data location. */\n\n/* STEP 3: Submit the program to create the course\
    \ data files. */\n/* STEP 4: Go to the Results-SAS Report tab in Enterprise Guide/**\
    \ */\n```"
  merge: -1
  img_proc: true
