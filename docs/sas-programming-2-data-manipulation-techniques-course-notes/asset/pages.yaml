- pgno: 158
  md: "# First Attempt: Unexpected Output\n\n```\nproc print data=salesQ1 noobs;\n\
    run;\n```\n\n| Sale ID | Location | Date | Amount |\n|---|---|---||}{\n| 101 |\
    \ USA | 18663 | 2908.74 |\n| 101 | USA | | 27891.00 |\n| 1345 | EUR | | |\n\n\
    To get the correct results, SAS needs some way to keep the second INPUT statement\
    \ from moving to the next line of raw data.\n\n# Mixed Record Types: Correct Program\n\
    \nThe single trailing @ holds a raw data record in the input buffer until SAS\
    \ does one of the:\n\n+   - executes an INPUT statement with no trailing @\n-\
    \ begins the next iteration of the DATA step\n\n```\ndata salesQ1;\ninfile \"\
    &path\\sales.dat\";\ninput SaleID $4. @ Location $3. @;\nif Location='USA' then\n\
    \ input @10 Date mmmddy10.\n @20 Amount 7.;\nelse if Location='EUR' then\n input\
    \ @10 Date date9.\n @20 Amount commax7.;\nrun;\n```\n\nNormally, each INPUT statement\
    \ in a DATA step reads a new data record into the input buffer. When you use a\
    \ trailing @ the following occur:\n\n+   - The pointer position does not change.\n\
    - No new record is read into the input buffer.\n- The next INPUT statement for\
    \ the same iteration of the DATA step continues to read the same record rather\
    \ than a new one."
  merge: -1
  img_proc: true
