- pgno: 435
  md: '11-6 Chapter 11 Other SAS® Languages


    # SQL Procedure


    The SQL procedure enables you to write ANSI standard SQL queries in a SAS program.


    ![](img/d3bde6e6ab06b1fc622215d982111742_435_0.png)


    This section focuses on accessing SAS data sets.


    With PROC SQL, you can access other DBMS tables with the appropriate SAS/ACCESS
    product license.


    # SQL Procedure


    The following table shows SAS terms and the equivalent SQL terminology:


    | SAS Term | SQL Term |

    |---|-|

    | Data Set | Table |

    | Observation | Row |

    | Variable | Column |


    When using SQL to access a table, remember that you are accessing a SAS data set.


    ![](img/d3bde6e6ab06b1fc622215d982111742_435_1.png)'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# 11.01 Multiple Choice Poll


    Which of the following best describes your experience level with the SQL procedure?


    +   - more than one year

    - six months to one year

    - less than six months

    - I have seen SQL code but not written any.

    - no experience with SQL


    # SQL Procedure: Syntax Overview


    PROC SQL statement signals the start of an SQL procedure.


    The QUIT statement ends an SQL procedure. A RUN statement is not needed because
    the query is executed when the semicolon is reached.


    ```

    options ls=80; PROC SQL;

    proc sql;

    select *

    from orion.sales_mgmt;

    quit;

    QUIT;

    ```


    The QUIT statement is omitted, the SQL procedure remains in memory to process
    subsequent queries. A QUIT statement or the start of another step terminates the
    SQL procedure and removes it from memory.'
  merge: -1
  img_proc: true
