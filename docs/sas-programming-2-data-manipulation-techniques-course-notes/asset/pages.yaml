    # SAS Variable Lists


    | Numbered range lists | x1-xn | Specifies all variables from x1 to xn inclusive.
    You can begin with any number and end with any number as long as you do not violate
    the rules for usersupplied variable names and the numbers are consecutive. |


    | Name range lists | x--a | Specifies all variables ordered as they are in the
    program data vector, from x to a |


    | | x-numeric-a | Specifies all numeric variables from x to inclusive. |


    | | x-character-a | Specifies all character variables from x to inclusive. |'
