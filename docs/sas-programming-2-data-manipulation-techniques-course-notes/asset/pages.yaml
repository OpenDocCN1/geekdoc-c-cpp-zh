  md: "# Business Scenario: Considerations\n\nRestructure the input data set, and\
    \ create a separate observation for each nonmissing quarterly contribution.\n\n\
    | Employee_ID | Qtr1 | Qtr2 | Qtr4 | Paid_By |\n|---|---|---|---|---||\n| 120265\
    \ | - | - | 25 | Cash or Check |\n| 120267 | 18 | 15 | 15 | Payroll Deduction\
    \ |\n| 120269 | 20 | 15 | 20 | Payroll Deduction |\n\n| Employee_ID | Period |\
    \ Amount |\n|---|---|--|\n| 120265 | Qtr4 | 25 |\n| 120267 | Qtr1 | 15 |\n| 120267\
    \ | Qtr2 | 15 |\n| 120267 | Qtr3 | 15 |\n| 120269 | Qtr1 | 20 |\n| 120269 | Qtr2\
    \ | 20 |\n| 120269 | Qtr3 | 20 |\n| 120269 | Qtr4 | 20 |\n\n+   The output data\
    \ set, rotate, should contain only Employee_ID, Period, and Amount.\n\n# Rotating\
    \ a SAS Data Set\n\nThe DATA step below rotates the input data set and outputs\
    \ an observation if a contribution was made in a given quarter.\n\n```\ndata rotate\
    \ (keep=Employee_Id Period Amount);\nset orion.employee donations\n  (drop-recipients\
    \ paid_by);\narray contrib{4} qtr1-qtr4;\ndoi i=1 to 4;\n  if contrib{i} ne .\
