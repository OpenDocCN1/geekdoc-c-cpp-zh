  md: "# Where Formats Are Stored\n\nBy default, formats are stored in the work.formats\
    \ catalog and exist only for the duration of the SAS session.\n\n![](img/d3bde6e6ab06b1fc622215d982111742_409_0.png)\n\
    \nCatalog entries have four-level names: libref.catalog.entry-name.type.\n\nThe\
    \ type for character formats is format. The type for numeric formats is format.\n\
    \n# Using the LIBRARY= Option\n\nUse the LIBRARY= option to control where the\
    \ format is stored.\n\n```\nproc format library=orion.MyFmts\n   cntlin=country;\n\
    \nLIBRARY=libref.catalog\n```"
