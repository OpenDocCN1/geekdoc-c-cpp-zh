    Name=catx('' '',scan(Name,2,'' ''),scan(Name,1,'' ''));

    City=scan(Address3,1,'' '')

    State=scan(address3,2,'' '')

    putlog $quote4.

    Zip=scan(Address3,3,'' '')

    putlog Zip $quote7;

