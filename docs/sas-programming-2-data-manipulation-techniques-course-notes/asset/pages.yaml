    # Creating Multiple SAS Data Sets


    Multiple data sets can be created in a DATA step by listing the names of the output
    data sets in the DATA statement.


    Create new data sets using: usa, australia, and other.


    ```

    DATA <SAS-data-set-1 ... SAS-data-set-n>;

    ```


    ```

    data usa australia;

    set orion.employee_addresses;

    if Country=''AU'' then output australia;

    else if Country=''US'' then output usa;

    else output other;

    run;

    ```


    You can direct output to a specific data set or data sets by listing the data
    set names in the OUTPUT statement.


    Data sets named in the OUTPUT statement must appear in the data statement.


    To specify multiple data sets in a single OUTPUT statement, separate the data
    set names with a space.


    ```

    data au us other;

    set orion.employee_addresses;

    if country (''AU'') then output us;

    else output other;

    run;

    ```'
