  md: "# Controlling Which Records Are Read\n\nThe FIRSTOBS= OBS= options can be used\
    \ in an INFILE statement when SAS reads from raw data files.\n\n```\ndata employees;\n\
    infile \"&path\\emps.dat\" firstobs=11 obs=15;\ninput @1 EmpID 8. @9 EmpName $40;\n\
    \  @153 Country $2;\n\nrun;\nproc print data=employees;\nrun;\n```\n\nThe syntax\
    \ is different. In an INFILE statement, the options are not enclosed in parentheses.\n\
    \n# Check the Output\n\nPartial SAS Log\n\n```\n45 data employees;\n46 infile\
    \ \"&path\\emps.dat\" firstobs=11 obs=15;\n47 input @1 EmpID 8. @9 EmpName $40.\
    \ @153 Country $2;\n48 run;\n\nNOTE: records were read from the infile 'emps.dat'.\n\
