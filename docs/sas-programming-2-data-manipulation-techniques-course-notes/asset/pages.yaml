  md: '# 3.2 Accumulating Totals for a Group of Data


    # 3.03 Short Answer Poll


    What are the values for First.Dept and Last.Dept when the DATA step is processing
    the observation indicated by the arrow?


    | Dept | Salary | First.Dept | Last.Dept |

    | --- | --- | --- | --- |

    | ADMIN | 20000 | | |

    | ADMIN | 100000 | | |

    | ADMIN | 50000 | | |

    | ENGINR | 25000 | | |

    | FINANC | 10000 | ? | |

    | FINANC | 12000 | | ? |


    # What Must Happen When?


    There is a three-step process for using the DATA step to summarize grouped data.


    +   * Step 1: Initialize: Set the accumulating variable to zero at the start of
    each BY group.


    +   * Step 2: Accumulate: Increment the accumulating variable with a sum statement
    (automatically retains).


    +   * Step 3: Output: Write only the last observation of each BY group.'
