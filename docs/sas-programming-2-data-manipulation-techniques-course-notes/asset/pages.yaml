- pgno: 58
  md: '# Controlling Variable Output (Review)


    In the DATA step, the DROP and KEEP statements can be used to control which variables
    are written to output data sets. The statements can be used when reading from
    a SAS data set or from a raw data file.


    ```

    data out1 out2;

    set in;

    drop x;


    out1

    Y Z

    ...

    PDV

    X Y Z


    out2

    Y Z

    ```


    # DROP Statement


    The DROP statement drops variables from every output set.


    ```

    data usa australia other;

    drop Street ID;

    set orion.employee_addresses;

    if Country=''US'' then output usa;

    else if Country=''AU'' then output australia;

    else output other;

    run;

    ```


