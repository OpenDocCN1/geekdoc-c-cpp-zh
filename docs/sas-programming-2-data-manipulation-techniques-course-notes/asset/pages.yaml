  img_proc: true
- pgno: 407
  md: '# Using a Control Data Set to Create a Format


    Use the CNTLIN= option to read the data and create the format.


    ```

    proc format cntlin=country;

    run;

    CNTLIN=SAS-data-set;

    ```


    The variables FmtName, Start, and Label are required in order to create a format
    from a CNTLIN data set.


    # Setup for the Poll


    The following DATA steps both create a SAS data set named country.


    | data country; keep Start Label FmtName; Program 1 |

    | retain FmtName ''$country''; |

    | set orion.country (rename=(Country=Start Country_Name=Label)); |

    | run; |


    | data country; keep Start Label FmtName; Program 2 |

    | FmtName=''$country''; |

    | set orion.country; start-Country; Label=Country_Name; |

    | run; |'
