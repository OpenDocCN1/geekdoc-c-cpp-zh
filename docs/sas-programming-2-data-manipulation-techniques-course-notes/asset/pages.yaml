  md: "# Using DO-END in a SELECT Group\n\nUse DO and END statements to execute multiple\
    \ statements when an expression is true.\n\n```\ndata usa other;\n  set orion.employee\
    \ addresses;\n  select (uppercase(country));\n    when ('US') do;\n      Benefits=1;\n\
    \      output usa;\n    end;\n    when ('AU') do;\n      Benefits=2;\n      output\
    \ australia;\n    end;\n    otherwise do;\n      Benefits=0;\n      output other;\n\
    \    end;\nrun;\n```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_53_0.png)\n\n\
