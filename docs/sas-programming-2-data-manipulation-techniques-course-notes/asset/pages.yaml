- pgno: 281
  md: '# Repetitive Coding


    ```

    data compound;

    Amount=50000;

    Rate=.045;

    Yearly=Amount*Rate;

    Quarterly+((QuarterlyAmount)*Rate/4);

    Quarterly+((QuarterlyAmount)*Rate/4);

    Quarterly+((QuarterlyAmount)*Rate/4);

    Quarterly+((QuarterlyAmount)*Rate/4);

    run;

    proc print data=compound noobs;

    run;

    ```


    | Amount | Rate | Yearly | Quarterly |

    | --- | --- | --- | --- |

    | 50000 | 0.045 | 2250 | 2288.25 |


    # Repetitive Coding


    What if the employee wants to determine annual and quarterly compounded interest
    for a period of 20 years (80 quarters)?


    ```

    data compound;

    Amount=50000;

    Rate=.045;

    Yearly +(Yearly+Amount)*Rate;

    20x;

    Yearly +(Yearly+Amount)*Rate;

    Quarterly+((QuarterlyAmount)*Rate/4);

    80x;

    Quarterly+((Quarterly+Amount)*Rate/4);

    run;

    ```'
  merge: -1
  img_proc: true
- pgno: 282
  md: "# DO Loop Processing\n\nUse DO loops to perform the repetitive calculations.\n\
    \n```\ndata compound (drop=i);\nAmount=50000;\nRate=.045;\ndo i=1 to 20;\n  Yearly\
    \ +(Yearly+Amount)*Rate;\nend;\ndo i=1 to 80;\n  Quarterly+((Quarterly+Amount)*Rate/4);\n\
    end;\n```\n\n> DO index-variable=start TO stop <BY increment>\nated SAS statements...\n\
    END;\n\n# Iterative DO Statement\n\nThe values of start, stop, and increment\n\
    \n+   - must be numbers or expressions that yield numbers\n- are established before\
    \ executing the loop\n- if omitted, increment defaults to 1.\n\nDetails of index-variable:\n\
    \n+   - The index-variable is written to the output data set by default.\n- At\
    \ the termination of the loop, the value of index-variable is one increment beyond\
    \ the stop value.\n\nstart specifies the initial value of the index variable.\n\
    \nstop specifies the ending value of the index variable.\n\nincrement specifies\
    \ a positive or negative number to control the incrementing of index-variable.\n\
    \nChanges to the values of stop or increment made within the DO loop do not affect\
    \ the number of iterations."
  merge: -1
  img_proc: true
