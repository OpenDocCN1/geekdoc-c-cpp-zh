- pgno: 9
  md: '# Course Description


    This course is for those who need to learn data manipulation techniques using
    SAS DATA and procedure steps to access, transform, and summarize SAS data sets.
    The course builds on the concepts that are presented in the SAS® Programming 1:
    Essentials course and is not recommended for beginning SAS software users.


    # To learn more...


    ![](img/d3bde6e6ab06b1fc622215d982111742_9_0.png)


    For information about other courses in the curriculum, contact the SAS Education
    Division at 1-800-333-7660, or send e-mail to training@sas.com. You can also find
    this information on the web at http://support.sas.com/training/ as well as in
    the Training Course Catalog.


    ![](img/d3bde6e6ab06b1fc622215d982111742_9_1.png)


    For a list of other SAS books that relate to the topics covered in this course
    notes, USA customers can contact the SAS Publishing Department at 1-800-727-3228
    or send e-mail to sasbook@sas.com. Customers outside the USA, please contact your
    local SAS office.


    Also, see the SAS Bookstore on the web at http://support.sas.com/publishing/ for
    a complete list of books and a convenient order form.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Prerequisites


    Before attending this course, you should have at least six months of experience
    writing SAS programs or have completed the SAS Programming 1: Essentials course
    and used SAS for at least one month. Specifically, you should be able to


    +   - submit a SAS program

    - diagnose and correct syntax errors

    - examine descriptor and data portions of a SAS data set

    - access SAS data libraries

    - read and create SAS data sets

    - read Excel spreadsheets

    - read delimited raw data files

    - examine data errors when reading raw data files

    - use SAS procedures to validate data

    - clean invalid data

    - create variables

    - combine SAS data sets

    - use global statements

    - use labels and formats, including user-defined formats

    - subset observations

    - produce summary reports using the FREQ and MEANS procedures.'
  merge: -1
  img_proc: true
