    # SAS Variable Lists (Review)


    An alternative method to entering variable names separately is to use a SAS variable
    list.


    ```

    data contrib;

    set orion.employee_donations;

    Total=sum(of Qtr1-Qtr4);

    if Total >= 50;

    ;

    ```


    +   - The keyword OF must precede the variable list.


    If the keyword OF is omitted from function calls that use SAS variable lists,
    the numbered and name range lists do not give a syntax error. Instead, the lists
    are interpreted as expressions. For example, sum(Qtr1-Qtr4) evaluates as Qtr4
    subtracted from Qtr1.'
