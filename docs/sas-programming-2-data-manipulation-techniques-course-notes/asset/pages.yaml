  md: '# Logic Errors


    A logic error occurs when the program statements follow the rules and execute
    but the results are not correct.

    No notes are written to the log, so logic errors are often difficult to detect.


    ![](img/d3bde6e6ab06b1fc622215d982111742_267_0.png)


    This section focuses on identifying logic errors.


    # Program and Partial Output


    ```

    data us mailing;

    set orion.mailing_list;

    drop Address3;

    length City $ 25 State $ 2 Zip $ 5;

    if find(catx('' '', Name,catx('' '', ''US'')),

    scan(Name,2,'',''),

    scan(Name,1,'',''));

    City=scan(Address3,1,'','');

    State=scan(address3,2,'','');

    Zip=scan(Address3,3,'','')

    ```


