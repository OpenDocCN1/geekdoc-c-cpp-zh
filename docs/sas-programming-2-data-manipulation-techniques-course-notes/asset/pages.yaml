    4. Use the$QUOTEw. in the PUTLOG statements to further examine the values of State
    and Zip.


    By default, the PUTLOG statement writes character values with the standard character
    format $w, where w is the length of the character variable. The standard character
    format left-justifies the value and removes leading blanks.


    The $QUOTEw formats the value enclosed in double quotation marks and preserves
    leading blanks. The quotation mark is displayed after the last non-blank character,
    so trailing blanks are not displayed.


    ```

    data us mailing:

    set orion.mailing_list (obs=10);

    drop Address3;

    length City $ 25 State $ 2 Zip $ 5

    putlog n=

    putlog "Looking for country"

    if find(Address3,''US'') > 0

