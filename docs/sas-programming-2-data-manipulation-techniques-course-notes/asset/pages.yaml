- pgno: 310
  md: "# Use Arrays to Simplify Repetitive Calculations\n\nAn array provides an alternate\
    \ way to access values in the PDV, which simplifies repetitive calculations.\n\
    \n```\ndata charity;\n  set orion.employee donations;\n  keep employee qtr1-qtr4;\n\
    \ Qtr1=qtr1*1.25;\n Qtr2=qtr2*1.25;\n Qtr3=qtr3*1.25;\n Qtr4=qtr4*1.25;\nrun;\n\
    proc print data=charity noobs;\nrun;\n```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_310_0.png)\n\
    \n| Employee_ID | Qtr1 | Qtr2 | Qtr3 | Qtr4 |\n\n# What Is a SAS Array?\n\nSAS\
    \ array\n\n+   - is a temporary grouping of SAS variables that are arranged in\
    \ a particular order\n- is identified by an array name\n- must contain all numeric\
    \ or all character variables\n- exists only for the duration of the current DATA\
    \ step\n- is **not** a variable."
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Why Use a SAS Array?


    Create an array named Contrib and use it to access the four numeric variables,
    Qtr1 – Qtr4.


    ![](img/d3bde6e6ab06b1fc622215d982111742_311_0.png)


    | PDV Employee_ID | Qtr1 | Qtr2 | Qtr3 | Qtr4 |

    |---|---|---|---|---|


    SAS arrays are different from arrays in many other programming languages. In SAS,
    an array is not a data structure. It is simply a convenient way of temporarily
    identifying a group of variables.


    # Array Elements


    Each value in an array is called an element.


    ![](img/d3bde6e6ab06b1fc622215d982111742_311_1.png)


    | PDV Employee_ID | Qtr1 | Qtr2 | Qtr3 | Qtr4 |

    |---|---|---|---|---|


    First element | Second element | Third element | Fourth element'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Referencing Array Elements


    Each element is identified by a subscript that represents its position in the
    array. When you use an array reference, the corresponding value is substituted
    for the reference.


    ![](img/d3bde6e6ab06b1fc622215d982111742_312_0.png)


    | PDV Employee_ID | Qtr1 | Qtr2 | Qtr3 | Qtr4 |

    |---|---|---|---|---|n| | Contrib{1} | Contrib{2} | Contrib{3} | Contrib{4} |


    # Defining an Array


    The ARRAY statement is a compile-time statement that defines the elements in an
    array.


    ```

    ARRAY array-name {subscript} $<> <length> <array-elements>;

    array Contrib{4} Qtr1 Qtr2 Qtr3 Qtr4;

    ```


    | PDV Employee_ID | Qtr1 | Qtr2 | Qtr3 | Qtr4 |

    |---|---|---|---|---|n| | Contrib{1} | Contrib{2} | Contrib{3} | Contrib{4} |


    array-name specifies the name of the array.


    {subscript} describes the number and arrangement of elements in the array using
    an asterisk, a number, numbers separated by commas (for multi-dimensional arrays),
    a range of numbers, or an expression. The subscript is enclosed in braces ({}).
    Brackets ([]) and parentheses () are also allowed.


    $ indicates that the elements in the array are character elements. The dollar
    sign is not necessary if the elements in the array were previously defined as
    character elements.


    length specifies the length of elements in the array that were not previously
    assigned a length.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'array-elements names the elements that make up the array. Array elements can
    be listed in any order.


    +   - Array references cannot be used in compile-time statements such as LABEL,
    FORMAT, DROP, KEEP, or LENGTH statements.


    If you use a function name as the name of the array, SAS treats parenthetical
    references that involve the name as array references, not function references,
    for the duration of the DATA step.


    +   - The four variables, Qtr1, Qtr2, Qtr3, and Qtr4, can now be referenced via
    the array name Contrib, with an appropriate subscript.


    ![](img/d3bde6e6ab06b1fc622215d982111742_313_0.png)


    +   - You can use special SAS name lists to reference variables that were previously
    defined in the same DATA step. The _CHARACTER_ variable list lists character values
    only. The _NUMERIC_ variable list lists numeric values.


    Avoid using the _ALL_ special SAS name list to reference variables, because the
    elements in an array must be either character or all numeric values.'
  merge: -1
  img_proc: true
