- pgno: 457
  md: "# Resulting Code: After Symbolic Substitution\n\nThe macro variable references\
    \ are resolved prior to compilation. The references are replaced with the corresponding\
    \ text value. The resulting code is sent to the compiler.\n\n```\nproc print data=orion.order\
    \ fact;\n  where year (order date) = 2007;\n  title \"Orders for 2007\";\nrun;\n\
    proc means data=orion.order mean;\n  where year (order date) = 2007;\n  class\
    \ order_type;\n  var total retail price;\n  title \"Average Retail Prices for\
    \ 2007\";\n  title2 \"by Order_Type\";\nrun;\n```\n\n# Examples of the %LET Statement\n\
    \n+   Macro variable values have the following characteristics:\n* Minimum length\
    \ is 0 characters (null value).\n* Maximum length is 65,534 characters (64K).\n\
    * Numbers are stored as text strings.\n* Mathematical expressions are not evaluated.\n\
    * Case is preserved.\n* Leading and trailing blanks are removed.\n* Quotation\
    \ marks, if any are stored as part of the value.\n\n%let year=2007;\n%let city=Dallas,\
    \ TX;\n\n| Name | Value |\n|---|---|\n| year | 2007 |\n| city | Dallas, TX |"
  merge: -1
  img_proc: true
