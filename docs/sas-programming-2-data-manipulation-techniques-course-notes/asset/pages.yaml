  md: '# Using a Control Data Set to Create a Format


    Partial orion.country


    | Country | Country_Name | Population | Country_ID | Continent_ID | Country_FormerName
    |

    |---|---|---|---|---||}{

    | AU | Australia | 20,000,000 | 160 | 96 | |

