    \n# DIM Function\n\nThe DIM function returns the number of elements in an array.\
    \ This value is often used as the stop value in a DO loop.\n\n```\ndata charity;\n\
    \  set orion.employee_donations;\n  keep Employee_ID Qtr1-Qtr4;\n  array Contrib{*}\
    \ qtr;\n  do i=1 to dim(Contrib);\n    Contrib{i}=Contrib{i}*1.25;\n  end;\nrun;\n\
    ```\n\n> DIM(array_name)\n\n![](img/d3bde6e6ab06b1fc622215d982111742_322_1.png)\n\
    \nThe HBOUND function returns the upper bound of an array. The LBOUND function\
    \ returns the lower bound of an array. The following DO loop processes every element\
    \ in an array:\n\n```\ndo i=lbound(items) to hbound(items);\n  *process items{i};\n\
    end;\n```\n\nIn most arrays, subscripts range from 1 to n, where n is the number\
    \ of elements in the array. The value 1 is a convenient lower bound. You do not\
    \ need to specify the lower bound. specifying both bounds is useful when the array\
    \ dimensions have a beginning point other than 1. For example, the following ARRAY\
    \ defines an array of 10 elements, with subscripts that range from 5 to 14:\n\n\
