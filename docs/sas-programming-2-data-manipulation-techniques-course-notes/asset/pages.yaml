- pgno: 376
  md: "# # 9.1 Using Data Manipulation Techniques with Match-Merging\n\n+   Objectives\n\
    - Review match-merging of SAS data sets.\n- Show examples of data manipulation\
    \ techniques with match-merging.\n- Show techniques to perform a match-merge for\
    \ these special cases:\n  - three or more SAS data sets that lack a single common\
    \ variable\n  - variable names that need to be altered to obtain the correct merge\
    \ results.\n\n## Match-Merging (Review)\nMatch-merging combines observations from\
    \ one or more SAS data sets into a single observation in a new data set, based\
    \ on the values of one or more common variables.\n\n![](img/d3bde6e6ab06b1fc622215d982111742_376_0.png)"
  merge: -1
  img_proc: true
- pgno: 377
  md: "# 9.01 Multiple Choice Poll\n\nWhich statement is true concerning match-merging?\n\
    \n+   a. The MERGE statement must refer to permanent data sets.\nb. The variables\
    \ in the BY statement can be in only one of the data sets. \nc. Only two data\
    \ sets can be specified in the MERGE statement.\nd. When you use the MERGE statement\
    \ with the BY statement, the data must be sorted or indexed on the BY variable.\n\
    \n# Match-Merging (Review)\n\nPartial SAS Log\n\n```\n729 proc sort data=or.order_fact\n\
    730     out=work.order_fact;\n731     by Customer_ID;\n732     where year(Order_Date)=2007;\n\
    733 run;\n```\n\nNOTE: There were 128 observations read from the data set ORIG.ORDER_FACT.\n\
    NOTE: WHERE(Order_Date)=2007.\nNOTE: The data set WORK.ORDER_FACT has 128 observations\
    \ and 12 variables.\n\n```\n734 data Custord;\n735     merge orig.customer\n736\
    \     work.order_fact;\n737     by Customer_ID;\n738 run;\n```\n\nNOTE: There\
    \ were 77 observations read from the data set ORIG.CUSTOMER.\nNOTE: There were\
    \ 128 observations read from the data set WORK.ORDER_FACT.\nNOTE: The data set\
    \ WORK.CUSTORD has 168 observations and 22 variables."
  merge: -1
  img_proc: true
- pgno: 378
  md: "# 9.1 Using Data Manipulation Techniques with Match-Merging\n\n# # Match-Merging\
