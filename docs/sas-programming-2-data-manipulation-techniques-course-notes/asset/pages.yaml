- pgno: 381
  md: "# OUTPUT Statement\n\nIn this program, the OUTPUT statement is used to direct\
    \ customers with matching orders to one data set and customers with no orders\
    \ to another data set.\n\n```\ndata orders noorders;\n  merge orion.customer\n\
    \  work.order_fact(in=order);\n  by Customer_ID;\n  if order=1 then output orders;\n\
    \  else output noorders;\nrun;\n```\n\nPartial SAS Log\n\n> NOTE: There were 77\
    \ observations read from the data set ORION.CUSTOMER.\nNOTE: There were 128 observations\
    \ read from the data set WORK.ORDER_FACT.\nNOTE: The data set WORK.ORDERS has\
    \ 128 observations and 22 variables.\nNOTE: The data set WORK.NOORDERS has 35\
    \ observations and 22 variables.\n\np209d02\n\n# DROP= and KEEP= Options\n\nYou\
    \ can use the DROP= and KEEP= data set options to determine which variables are\
    \ written to each output data set.\n\n```\ndata orders (keep=Customer Name Quantity\n\
    \  Product ID Total Retail Price)\n  noorders (keep=Customer Name Birth Date);\n\
    \  merge orion.customer\n  work.order_fact(in=order);\n  by Customer_ID;\n  if\
    \ order=1 then output orders;\n  else output noorders;\nrun;\n```\n\nPartial SAS\
    \ Log\n\n> NOTE: The data set WORK.ORDERS has 128 observations and 4 variables.\n\
    NOTE: The data set WORK.NOORDERS has 35 observations and 2 variables.\n\np209d02"
  merge: -1
  img_proc: true
- pgno: 382
  md: "# 9.03 Short Answer Poll\n\nWhat two temporary variables are created due to\
    \ the BY statement?\n\n```\ndata orders (keep=Customer Name Quantity\nProduct\
    \ ID Total Retail_Price)\nnoorders (keep=Customer Name Birth Date);\nmerge orion.customer\n\
    work.order_fact(in=order);\nby Customer ID;\nif order=1 then output orders;\n\
    else output noorders;\nrun;\n```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_382_0.png)\n\
    \n# First, and Last. Variables and Sum Statement\n\nThe First. and Last. variables\
    \ along with the sum statement can be used to create the values for the summary\
    \ data set. \n\n```\ndata orders (keep=Customer Name Quantity\nProduct ID Total\
    \ Retail_Price)\nnoorders (keep=Customer Name Birth Date)\nsummary (keep=Customer\
    \ Name NumOrders);\nmerge orion.customer\nwork.order_fact(in=order);\nby Customer\
    \ ID;\nif order=1 then do;\noutput orders;\nif first.Customer ID then NumOrders=0;\n\
    NumOrders+1;\nif last.Customer ID then output summary;\nend;\nelse output noorders;\n\
    run;\n```"
  merge: -1
  img_proc: true
