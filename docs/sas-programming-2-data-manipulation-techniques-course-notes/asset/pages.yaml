- pgno: 238
  md: "# 5.5 Converting Variable Type\n\n# # Converting a Variable to Another Data\
    \ Type\n\n**Step 1** Use the RENAME= data set option to rename.\n\n```\ndata hrdata;\n\
    \  set orion.convert(rename=(GrossPay=\nCharGross));\nrun;\nSAS-data-set(RENAME=(old-name=new-name))\n\
    ```\n\nold-name specifies the variable that you want to rename.\n\nnew-name specifies\
    \ the new name of the variable. It must be a valid SAS name.\n\nThe new name of\
    \ the variable that you want to convert is arbitrary. In this example, the existing\
    \ variable is renamed **CharGross** to emphasize that a character variable is\
    \ being converted.\n\nTo rename more than one variable from the same data set,\
    \ separate the variables that you want to rename with a space. For example, to\
    \ rename not only **GrossPay**, but also **ID**, use the following statement:\n\
    \n```\nset orion.convert(rename=(GrossPay=CharGross) ID=IDNum);\n```\n\n# # Converting\
    \ a Variable to Another Data Type\n\n**Step 2** Use the INPUT function in an assignment\
    \ statement to create a new variable with the original name of the variable that\
    \ you renamed.\n\n```\ndata hrdata;\n  set orion.convert(rename=(GrossPay=\nCharGross));\n\
    GrossPay=input(CharGross,comma6.);\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "# Converting a Variable to Another Data Type\n\n**Step 3** Use a DROP= data\
    \ option in the DATA statement to exclude the original variable from the output\
    \ SAS data set.\n\n```\ndata hrdata (drop=CharGross);\n  set orion.convert (rename=(GrossPay=\n\
    \  CharGross));\nGrossPay=input (CharGross,comma6.);\nrun;\n```\n\nThe compilation\
    \ for this program shows the PDV being created with a numeric GrossPay variable.\n\
    \n![](img/d3bde6e6ab06b1fc622215d982111742_239_0.png)\n\n# Converting a Variable:\
    \ Compilation\n\n```\ndata hrdata (drop=CharGross);\n  set orion.convert (rename=(GrossPay=\n\
    \  CharGross));\nGrossPay=input (CharGross,comma6.);\nrun;\n```\n\nPartial PDV\n\
    \n| ID | CharGross | Hired |\n| $5 | $6 | $7 |"
  merge: -1
  img_proc: true
