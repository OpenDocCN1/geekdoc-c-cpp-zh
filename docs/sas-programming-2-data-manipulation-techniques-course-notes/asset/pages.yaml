- pgno: 204
  md: "# Data Cleanup: Step 1\n\nUse the SUBSTR and FIND functions to change incorrect\
    \ product IDs for mittens.\n\n```\nPosition=FIND(string,substring<modifiers,startpos);\n\
    ```\n\n```\ndata correct;\n  set orion.clean_up;\n  if find(Product,'Mittens','I')>0\
    \ then do;\n    substr(Product_ID,9,1)='5';\n  end;\nrun;\n\nproc print data=correct\
    \ noobs;\nrun;\n```\n\n# FIND Function\n\nThe FIND function searches a target\
    \ string for a specified substring.\n\n```\nPosition=FIND(string,substring<modifiers,startpos);\n\
    ```\n\n+   * The starting position of the first occurrence of substring within\
    \ string, if substring is found.\n* 0, if substring is not found.\n* I for a case-insensitive\
    \ search\n* To ignore trailing blanks\n\nMore on modifiers and the startpos value:\n\
    \n+   * A modifier can be the I or T. These two values can be combined in either\
    \ order and in either case. If this argument is omitted, it is case sensitive\
    \ and trailing blanks are considered.\n* The startpos value indicates not only\
    \ the position at which the search should start but also the direction of the\
    \ search. A positive value indicates a forward (right) search. A negative value\
    \ indicates a backward (left) search. If this argument is omitted, the search\
    \ starts at position 1 and moves forward.\n* These two optional arguments can\
    \ be in either order (that is, startpos can precede modifier)."
