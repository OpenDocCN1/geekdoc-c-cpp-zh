  md: '# # 1.1 An Overview of SAS Foundation


    +   ## Objectives

    * Characterize SAS software.

    * Describe the functionality of Base SAS and SAS Foundation tools.


    # ## What Is SAS?


    SAS is a suite of business solutions and technologies to help organizations solve
    business problems.


    ![](img/d3bde6e6ab06b1fc622215d982111742_14_0.png)'
  merge: -1
