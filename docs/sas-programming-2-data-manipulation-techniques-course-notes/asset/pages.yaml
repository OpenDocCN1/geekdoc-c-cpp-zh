  md: '# 5.3 Manipulating Character Values (Part 2) 5-39


    # Other Functions That Remove Blanks


    | Function | Purpose |

    | --- | --- |

    | TRIM(string) | Removes trailing blanks from a character string. |

    | STRIP(string) | Removes all leading and trailing blanks from a character string.
    |

    | COMPBL(string) | Removes multiple blanks from a character string by translating
    each occurrence of two or more consecutive blanks into a single blank. |


    The TRIMN function is similar to the TRIM function. TRIMN returns a null string
    (zero blanks) if the argument is blank while TRIM returns a blank.


    The STRIP function returns a null string if the argument is blank.


    By default, the length of the value returned by the COMPBL function is the same
    as the length of the argument.


