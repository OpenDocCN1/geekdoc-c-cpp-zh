  md: '9.1 Using Data Manipulation Techniques with Match-Merging


    # Without a Common Variable: Step 1


    Merge orion.customer and work.order_fact by

    Customer_ID.


    ```

    proc sort data=orion.order_fact

    out=work.order_fact;

    by Customer_ID;

    where year(Order_Date)=2007;

    orion.customer is in

    order by Customer_ID

    data CustOrd;

    merge orion.customer(in=cust)

    work.order_fact(in=order);

    by Customer_ID;

    if cust=1 and order=1;

    keep Customer_ID Customer Name Quantity

    Total_Retail_Price Product_ID;

    run;

    ```


