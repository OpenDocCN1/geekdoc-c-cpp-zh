  md: "# 7.4 Using SAS Arrays\n\n# Creating a Temporary Lookup Table\n\nYou can use\
    \ the keyword _TEMPORARY_ in an ARRAY statement to indicate that the elements\
    \ are not needed in the output data set.\n\n```\ndata compare(drop=i);\n set orion.employee_donations;\n\
    \ array Contrib{4} Qtr1-Qtr4;\n array Diff{4};\n array Goal{4} temporary (10,20,20,15);\n\
    \ do i=1 to 4;\n Diff{i}=Contrib{i}-Goal{i};\n;\nrun;\n```\n\np207d17\n\nYou can\
    \ save memory if you do not need to access the individual array element variables\
    \ by name, the only way you can access the array elements is by array subscribing.\
    \ Arrays of temporary elements are useful when the only purpose for creating an\
    \ array is to perform a calculation. To preserve the result of the calculation,\
    \ assign it to a variable.\n\n# Output: Creating a Temporary Lookup Table\n\n\
    ```\nproc print data-compare noobs;\n var employee_id diff1-diff4;\nrun;\n```\n\
