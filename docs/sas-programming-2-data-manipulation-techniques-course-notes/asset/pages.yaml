  md: "# Controlling Which Observations Are Read\n\nBy default, SAS processes every\
    \ observation in a SAS data set, from the first observation to the last. The FIRSTOBS=\
    \ and OBS= data set options can be used to control which observations are processed.\n\
    \nThe FIRSTOBS= and OBS= options are with input data sets. You cannot use either\
    \ option with output data sets.\n\n# Using the OBS= Data Set Option\n\nThis OBS=\
    \ data set option causes the DATA step to processing after observation 100.\n\n\
    ```\ndata australia;\n  set orion.employee_addresses (obs=100);\n  if Country='AU'\
    \ then output;\nrun;\n```\n\n# Partial SAS Log\n\n```\nNOTE: There were 100 observations\
    \ read from the data set\nORION.EMPLOYEE_ADDRESSES.\nNOTE: The data set WORK.AUSTRALIA\
    \ has 24 observations and\n9 variables.\n```\n\nspecifies a positive integer that\
    \ is less than or equal to the number of observations in the data set, or zero."
