- pgno: 444
  md: '# Cartesian Product


    Each row in orion.sales_mgmt is combined with every row in orion.employee_addresses.


    | Partial orion.sales_mgmt | | orion.employee_addresses |

    |---|---|---|---|

    | 121143 Senior Sales Manager | $95,090 | 201044 Abbott, Ray |

    | 121144 Sales Manager | $83,505 | 201045 Alisbitt, Sandy |

    | 121145 Sales Manager | $84,240 | 207061 Akinfolarin, Tameaka |

    | | | 202056 Amos, Salley |


    # Partial Output


    | | | | |

    |---|---|---|---|

    | 1 | 121143 Abbott, Ray | Senior Sales Manager | $95,090 |

    | 2 | 121143 Alisbitt, Sandy | Senior Sales Manager | $95,090 |

    | 3 | 121143 Akinfolarin, Tameaka | Senior Sales Manager | $95,090 |

    | 4 | 121143 Amos, Salley | Senior Sales Manager | $95,090 |


    Conceptually, when two tables are specified in a join, each row of the first table
    is matched with every row of the second table to produce a Cartesian product,
    which is stored in an internal or intermediate table. The number of rows in the
    intermediate table is equal to the product of the number of rows in each of the
    source tables. The intermediate table becomes the input to the rest of the query,
    although some of its rows might be eliminated by the WHERE clause.


    # Joining on a Common Variable


    Obtaining the desired output requires matching the values of Employee_ID in both
    tables. This is referred to as an inner join.


    ![](img/d3bde6e6ab06b1fc622215d982111742_444_0.png)


    Employee_ID from orion.sales_mgmt = Employee_ID from orion.employee_addresses'
  merge: -1
  img_proc: true
- pgno: 445
  md: "# Joining on a Common Variable\n\nA WHERE clause is used to specify join criteria\
    \ and possibly other subsetting criteria. When the conditions are met, the rows\
    \ are displayed in the output.\n\n```\nproc sql;\nselect sales mgmt.Employee_ID,\n\
    \  Employee_Name,\n  Job Title,\n  Salary,\nfrom orion.sales mgmt,\n  orion.employee_addresses\n\
    where sales mgmt.Employee_ID =\n  employee_addresses.Employee_ID;\nquit; WHERE\
    \ join-condition(s)\n<AND other subsetting conditions>\n```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_445_0.png)\n\
    \nA WHERE clause can use logical operators to include join conditions as well\
    \ as other subsetting conditions.\n\nwhere sales mgmt.employee_id=employee_addresses.employee_id\
    \ and Salary > 90000;\n\n# Output: Joining on a Common Variable\n\nPROC SQL Output\n\
    \n| Employee ID | Employee_Name | Employee Job Title | Annual Salary |\n|---|---|---|--|\n\
    | 121144 | Capachitti, Renee | Sales Manager | $83,505 |\n| 121143 | Favaron,\
    \ Louis | Senior Sales Manager | $95,090 |\n| 121145 | Lansberry, Dennis | Sales\
    \ Manager | $84,260 |\n| 121147 | Sneed, Christine | Secretary II | $29,145 |\n\
    \nAn inner join is equivalent to a DATA step merge in which both data sets contribute\
    \ to the merge and include matching observations. The following program is an\
    \ equivalent process using the SORT procedure and a DATA step:"
  merge: -1
  img_proc: true
