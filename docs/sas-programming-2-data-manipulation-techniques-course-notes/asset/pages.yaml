    # Using an Array to Create Numeric Variables


    An ARRAY statement can be used to create new variables in the program data vector.


    ```

    array Pct{4} Pct1-Pct4;

    ```


    If Pct1 Pct4 do not exist in the PDV, they are created.


    This statement produces the same results:


    ```

    array Pct{4};

    ```


    PDV


    | Pct1 | Pct2 | Pct3 | Pct4 |

    |---|---|---|---||

    | N 8 | N 8 | N 8 | N 8 |


    # Using an Array to Create Character Variables


    Define an array named Month to create six variables to hold character values with
    a length of 10.


    ```

    array Month{6} $ 10;

    ```


    PDV


    | Month1 | Month2 | Month3 | Month4 | Month5 | Month6 |

    |---|---|---|---|---|---||

    | $ 10 | $ 10 | $ 10 | $ 10 | $ 10 | $ 10 |'
