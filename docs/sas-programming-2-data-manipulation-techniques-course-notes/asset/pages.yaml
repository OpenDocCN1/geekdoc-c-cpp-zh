  md: "# Adding a WHERE Statement\n\nWhen the FIRSTOBS= or OBS= option and the WHERE\
    \ statement are used together, the following occurs:\n\n+   - The subsetting WHERE\
    \ is applied first.\n- The FIRSTOBS= and OBS= options are applied to the resulting\
    \ observations.\n\nThe following step includes a WHERE statement and an OBS= option:\n\
    \n```\nproc data=orion.employee_addresses\n  (obs=10);\n  where Country='AU';\n\
    \  var Employee Name City Country;\nrun;\n```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_69_0.png)\n\
