- pgno: 271
  md: "# Processing at the End of a DATA Step\n\nThe END=option creates a temporary\
    \ variable that acts as an end-of-file indicator.\n\n+   - The option can be used\
    \ in SET and INFILE statements.\n- The variable is initialized to 0 and is set\
    \ to 1 when the last observation or record is read.\n\n```\ndata work.donate;\n\
    set orion.donate end=last;\n<additional SAS statements>\nif last=1 then do;\n\
    \  <additional SAS statements>\nend;\nrun;\n  SET SAS.data-set END=variable <options>;\n\
    ```\n\n# Using PUTLOG with Conditional Logic\n\nThe program below displays a message\
