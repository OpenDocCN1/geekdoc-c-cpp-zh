  md: "# 7.4 Using SAS Arrays\n\n# Using an Array as a Function Argument\n\nThe program\
    \ below passes an array to the SUM function.\n\n```\ndata test;\n  set orion.employee_donations;\n\
    \  array val{4} Qtr1-Qtr4;\n  Tot1=sum(of val*);\n  Tot2=sum(of val*);\nrun;\n\
    proc print data=test;\n  var Employee_ID Tot1 Tot2;\nrun;\n```\n\n# Partial PROC\
