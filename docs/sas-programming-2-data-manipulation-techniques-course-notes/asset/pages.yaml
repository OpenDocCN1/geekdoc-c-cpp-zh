- pgno: 32
  md: '# Explicit Output


    The explicit OUTPUT statement writes the contents of the program data vector (PDV)
    to the data set or data sets being created. The presence of an explicit OUTPUT
    statement overrides implicit output.


    ```

    data forecast;

    set orion.growth;

    Year=1;

    Total Employees=Total Employees*(1+Increase);

    output;

    Year=2;

    Total Employees=Total Employees*(1+Increase);

    output;

    OUTPUT <SAS-data-set-1 ... SAS-data-set-n>;

    run;

    ```


    ![](img/d3bde6e6ab06b1fc622215d982111742_32_0.png)


    Using an explicit OUTPUT statement without arguments causes the current observation
    to be written to all data sets that are named in the DATA statement.


    > The explicit OUTPUT statement causes immediate output but not an immediate return
    to the top of the DATA step. The implicit RETURN statement still occurs at the
    bottom of the step.


    # Compilation


    ```

    data forecast;

    set orion.growth;

    Year=1;

    Total Employees=Total Employees*(1+Increase);

    output;

    Year=2;

    Total Employees=Total Employees*(1+Increase);

    output;

    run;

    ```


    PDV - Program Data Vector


    | Department | Total Employees | Increase |

    | $ 20 | N 8 | N 8 |


    ![](img/d3bde6e6ab06b1fc622215d982111742_32_1.png)'
