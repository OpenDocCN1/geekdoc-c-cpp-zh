- pgno: 99
  md: "# BY-Group Processing\n\nThe BY statement in the DATA step enables\nSAS to\
    \ process data in groups.\n\n```\nproc sort data=orion.specialsals\n  out=salsort;\n\
    \  by Dept;\nrun;\nndata deptals (keep=Dept DeptSal)\n  set salsort;\n  by Dept;\n\
    \  <additional SAS statements>\nrun;\n```\n\nStep 1:\nSort by\nDept.\n\nStep 2:\n\
    Process\nby Dept\ngroups.\n\nFirst.BY-variable\nLast.BY-variable\n\nA BY statement\
    \ in a DATA step creates two temporary\nvariables for each variable listed in\
    \ the BY statement.\n\nWhen a BY statement is used with a SET statement, the data\
    \ must be sorted by the BY variable\nor have an index based on the BY variable(s).\n\
    \nThe SORT procedure\n\n+   - orders SAS data set observations by the values of\
    \ one or more character or numeric variables\n- replaces the original data set\
    \ or creates a new data set\n- produces only an output data set.\n\n# First. /\
    \ Last. Values: First DATA Step Iteration\n\n| Dept | Salary | First.Dept |\n\
    |---|---|-|\n| ADMIN | 20000 | 1 |\n| ADMIN | 100000 | |\n| ADMIN | 50000 | |\n\
    | ENGINR | 25000 | |\n| ENGINR | 20000 | |\n| ENGINR | 23000 | |\n| ENGINR | 27000\
    \ | |\n| FINANC | 10000 | |\n| FINANC | 12000 | |\n\n> Last.Dept\nHow can SAS\
    \ determine the value for Last.Dept?"
  merge: -1
  img_proc: true
