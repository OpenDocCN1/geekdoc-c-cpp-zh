  md: "# 9.1 Using Data Manipulation Techniques with Match-Merging\n\n# # Create Gift\
    \ List: Solution\n\nAccess the Excel workbook, specify the worksheet to use, and\
    \ release the workbook after the DATA step.\n\n```\nlibname bonus \"&path\\BonusGift.xls\"\
    ;\ndata CustOrdProd;\n  merge CustOrdProd(in=c)\n    bonus.Supplier$n(in=s)\n\
    \    rename=(SuppID=Supplier\n    Quantity=Minimum));\n  by Supplier;\n  if c=1\
    \ and s=1 and Quantity > Minimum;\nlibname bonus clear;\n```\n\nBoth SAS and Microsoft\
    \ Office offer both 32-bit and 64-bit versions. Different SAS/ACCESS engines are\
    \ needed based on matching and non-matching number of bits, also known as fitness.\
    \ If the bitness of both products is the same, use the default SAS/ACCESS Excel\
    \ engine. If the bitness differs, use the PC Files Server engine and specify PATH=\
    \ in front of *workbook-name*.\n\nDefault Engine:\n\n```\nLIBNAME libref <engine>\
    \ \"workbook-name.xls\" <options>;\n```\n\nExample:\n\n```\nlibname xyz \"C:\\\
    myfiles\\sales.xls\";\n```\n\nPC Files Server:\n\n```\nLIBNAME libref pcfiles\
    \ path=\"workbook-name.xls\" <options>;\n```\n\nExample:\n\n```\nlibname xyz pcfiles\
    \ path='C:\\myfiles\\sales.xls';\n```\n\nThe table below summarizes the possible\
    \ combinations and the appropriate engine to use for each.\n\n| Microsoft Office\
    \ | SAS/ACCESS Engine |\n| 9.4 | 32-bit | PC Files Server |\n| 9.4 | 64-bit |\
    \ Default |\n| 9.3 32-bit | 32-bit | Default |\n| 9.3 32-bit | 64-bit | PC Files\
