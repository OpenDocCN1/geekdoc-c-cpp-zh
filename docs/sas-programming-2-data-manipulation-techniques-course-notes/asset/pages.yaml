- pgno: 15
  md: '# What Can You Do with SAS?


    SAS software enables you to do the following:

    * access data across multiple sources

    * manage data

    * perform sophisticated analyses

    * deliver information across your organization


    ![](img/d3bde6e6ab06b1fc622215d982111742_15_0.png)


    # What Is Base SAS?


    Base SAS is the centerpiece of all SAS software.


    Base SAS is a product within the SAS Foundation set of products that provides

    * a highly flexible, highly extensible fourth-generation programming language

    * a rich library of encapsulated programming procedures

    * a graphic user interface for administering SAS tasks.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# About This Class


    This class focuses on manipulating data with the

    DATA step, including


    +   - creating multiple SAS data sets

    - accumulating totals and summarizing data

    - reading fixed column raw data files

    - manipulating variable values with functions

    - performing DO loop and SAS array processing

    - rotating data sets

    - merging data sets


    ![](img/d3bde6e6ab06b1fc622215d982111742_16_0.png)


    # 1.01 Poll


    Have you worked with the DATA step?


    +   - a. yes, just maintaining programs

    - b. no, not at all'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.2 Course Logistics


    # Objectives


    +   - Describe the data used in the course.

    - Designate the editors and processing mode available for workshops.

    - Specify the naming convention used for course files.

    - Define the three levels of exercises.

    - Discuss accessing the Help facility.


    # Orion Star Sports & Outdoors


    This course focuses on a fictitious global sports and outdoors retailer that has
    traditional stores, an online store, and a large catalog business.


