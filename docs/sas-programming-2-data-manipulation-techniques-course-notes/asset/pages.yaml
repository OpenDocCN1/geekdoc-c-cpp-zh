- pgno: 248
  md: "# 5.5 Converting Variable Type\n\n# CAT Functions and Numeric Conversion\n\n\
    The CAT family of functions converts any numeric argument to a character string\
    \ by using the BEST12 format and then removing leading blanks. No note is written\
    \ to the log.\n\nThis assignment statement using CAT:\n\n```\nPhone=cat(' ',Code,\
    \ ' ',Mobile);\n```\n\ngives equivalent results to this statement:\n\n```\nPhone=('\
    \ '!Code(3.)' '! ' '!Mobile);\n```\n\nNow you can write the complete SAS program\
    \ to convert the personnel data.\n\n# Convert HR Data: Complete Program\n\n```\n\
    data hrdata;\n  keep EmpID GrossPay Bonus Phone HireDate;\n  set orion.convert(rename=(GrossPay=\n\
    CharGross));\n  EmpID=input(ID, 5.)+11000;\n  GrossPay=input(CharGross,comma.);\n\
    \  Bonus=GrossPay*.10;\n  HireDate=input(Hire,mmddyy10.);\n  Phone=cat(' ',Code,\
    \ ' ',Mobile);\nrun;\n```\n\n```\nproc print data hrdata-noobs;\n  var EmpID GrossPay\
    \ Bonus Phone HireDate;\n  format HireDate mmddyy10;\nrun;\n```"
  merge: -1
  img_proc: true
