  md: "# Viewing Formats\n\nYou can use the SAS Explorer window to view formats stored\
    \ in a catalog.\n\n![](img/d3bde6e6ab06b1fc622215d982111742_411_0.png)\n\nYou\
    \ need the SAS Catalog Explorer Add-in for Enterprise Guide to view formats stored\
    \ in a catalog. For more information see: http://blogs.sas.com/content/sasdummy/2010/05/10/viewing-sas-catalogs-from-sas-enterprise-guide/\n\
    \n# CATALOG Procedure\n\nThe CATALOG procedure manages entries in SAS catalogs.\n\
    \n```\nproc catalog cat=orion.MyFmts;\n  contents;\nquit;\n```\n\n| # | Name |\
    \ Type | Create Date | Modified Date |\n|---|---|---|---|---||\n| 1 | DATES |\
    \ FORMAT | 20Jan08:16:26:39 | |\n| 2 | COUNTRY | FORMATC | 20Jan08:16:33:30 |\
    \ 29Jan08:16:33:30 |\n| 3 | COUNTRY_NAME | FORMAT | 20Apr09:15:30:14 | 20Apr09:15:30:14\
    \ |\n| 4 | EXTRA | FORMAT | 20Apr09:15:30:14 | 20Apr09:15:30:14 |"
  merge: -1
  img_proc: true
- pgno: 412
  md: "# Documenting Formats\n\nYou can use the FMTLIB option in the PROC FORMAT statement\
    \ to document the format.\n\n```\n```proc format library=orion.MyFmts fmtlib;\n\
    \  select $country;\nrun;```\n```\n\n| FORMAT NAME: SCOUNTRY LENGTH: 13 NUMBER\
    \ OF VALUES: 7 |\n| MIN LENGTH: 1 MAX LENGTH: 40 DEFAULT LENGTH 13 FUZZ: 0 |\n\
    | START | END | LABEL (VER. T7|VB) OSMAY2009:12:34:42 |\n| AU | AU | Australia\
    \ |\n| CA | CA | Canada |\n| DE | DE | Germany |\n| IL | IL | Israel |\n| TR |\
    \ TR | Turkey |\n| US | US | United States |\n| ZA | ZA | South Africa |\n\n![](img/d3bde6e6ab06b1fc622215d982111742_412_0.png)\n\
    \nYou can use either the SELECT or EXCLUDE statement to process specific formats\
    \ rather than an entire catalog.\n\n# Nesting Formats\n\nIn the VALUE statement,\
    \ you can specify that the format use a second format as the formatted value.\n\
    \nEnclose the format name in square brackets:\n\n```\n```proc format library=orion.MyFmts;\n\
    \  value $extra = 'Unknown'\n    other=[$country30];\nrun;\n  value=[existing-format];```\n\
    ```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_412_1.png)\n\nAvoid nesting formats\
    \ for more than one level. The resource requirements can increase dramatically\
    \ with each additional level."
  merge: -1
  img_proc: true
- pgno: 413
  md: "10-12 Chapter 10 Creating and Maintaining Permanent Formats\n\n# Using a Control\
    \ Data Set to Create a Format\n\np210d01\n\nThis demonstration illustrates how\
    \ to create a permanent format from a SAS data set, and start values.\n\n+   1.\
    \ Submit step 1 to create a SAS data set that contains the format name, labels,\
    \ and start values.\n\n+   a. The DATA step creates the control data set country.\n\
    \n+   b. Use PROC PRINT to view the new data set.\n\n```\n/* Step 1 */\n/* Make\
    \ a CNTLIN data set containing */\n/* the variables FMTNAME, START, and */\n/*\
    \ LABEL. */\n\ndata country;\n  keep Start Label FmtName;\n  retain Fmtname '$country'\n\
    \  set orion.(rename=(Country=Start\n  Country_Name=Label));\n\nrun;\n\nproc print\
    \ data=country noobs;\n  title 'Country';\nrun;\n```\n\n+   2. Submit Step 2 to\
    \ use a SAS data set to create the permanent format.\n\n+   a. The first PROC\
    \ FORMAT creates the format Scountry.\n\n+   b. Use PROC CATALOG to view the contents\
    \ of the catalog orion.formats.\n\n+   c. The second PROC FORMAT AUGMENTS Scountry\
    \ by creating a label for missing values.\n\n+   d. Use PROC FORMAT with the FMTLIB\
    \ option to document Scountry and Sextra.\n\n```\n/* Step 2 */\n/* Use the data\
    \ set COUNTRY TO */\n/* make the format $country. */\n\nproc format library=orion.MyFmts\
    \ cntlin=country;\n  run;\n\nproc catalog cat=orion.MyFmts;\n  contents;\nrun;\n\
    ```"
  merge: -1
  img_proc: true
