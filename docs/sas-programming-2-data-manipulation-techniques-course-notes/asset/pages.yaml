  md: "# Using a DO Loop to Process an Array\n\n```\ndata charity;\n  set orion.employee_donations;\n\
    \  keep Employee ID Qtr1-Qtr4;\n  array Contrib{4} Qtr1-Qtr4;\n  do i=1 to 4;\n\
    \    Contrib{i}=Contrib{i}*1.25;\n  end;\nrun;\n```\n\n```\nDO index-variable=1\
    \ TO number-of-elements-in-array;\n  <additional SAS statements>\nEND;\n```\n\n\
    To reference an element, the index variable is often used as a subscript: array-name{index-variable}\n\
    \nTo process particular elements of an array, specify these elements as the range\
    \ of the iterative DO statement.\n\nBy default, SAS includes index-variable in\
    \ the output data set. Use a DROP or KEEP statement or the DROP= or KEEP= data\
    \ set option to prevent the index variable from being written to the output data\
    \ set.\n\n# First Iteration of the DO Loop\n\n```\ndata charity;\n  set orion.employee_donations;\n\
    \  keep Employee ID Qtr1-Qtr4;\n  array Contrib{4} Qtr1-Qtr4;\n  do i=1 to 4;\n\
    \    Contrib{i}=Contrib{i}*1.25;\n  end;\nrun;\n```\n\n![](img/d3bde6e6ab06b1fc622215d982111742_315_0.png)"
