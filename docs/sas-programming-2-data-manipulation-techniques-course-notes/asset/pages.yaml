  md: '# Display Messages and Variable Values in the Log


    ```

    PUTLOG ''text'';

    PUTLOG variable-name=;

    PUTLOG variable-format-name=;

    PUTLOG ALL;

    ```


    # Query a Table with PROC SQL


    ```

    PROC SQL:

    SELECT var-1, var-2...

    FROM SAS-table-1-

    <WHERE where-expression>

    ```


    # Permanent Formats and Control Data Sets


    ```

    PROC FORMAT LIBRARY=output-sas-catalog

    FMTLIB CNTLININ=input-sas-data-set

    CNLOUT=input-sas-data-set;

    ```


    ```

    RUN;

    ```


    # PROC CATALOG


    ```

    PROC CATALOG CATALOG=libref.catalog;

    CONTENTS;

    ```


    ```

    RUN;

    ```


    # Create a Table with PROC SQL


    ```

    PROC SQL:

    CREATE TABLE table-name AS

    SELECT var-1, var-2...

    FROM SAS-table-1-

    <WHERE where-expression>

    ```


    ```

    QUIT;

    ```


    # System Options for Formatting


    ```

    OPTIONS FMTERR; NOFMTERR;

    OPTIONS FMTSEARCH=

    (item-1 item-2...,item-n);

    ```


    # Join Tables with PROC SQL


    ```

    PROC SQL:

    SELECT var-1, var-2...

    FROM SAS-table-1, SAS-table-2-

    <WHERE join-condition(s)>

    ```


    ```

    QUIT;

    ```


    # Iterative DO Loops


    ```

    DO index-variable=start TO stop <increment>;

    iterated SAS statements

    ```


    # PROC TRANSPOSE


    ```

    PROC TRANSPOSE DATA=input-data-set

    <OUT=output-data-set>

    <NAME=variable-name>;

    <BY <DESCENDING> variable-1

    <DESCENDING> var-n

    <NORTSORTED>;

    <VAR variable(s);

    <ID variable>;

    ```


    ```

    END;

    ```


    ```

    RUN;

    ```


    ```

    DO index-variable=item-1, ...,item-n>;

    iterated SAS statements

    ```


    ```

    END;

    ```


    # Conditional DO Loops


    ```

    DO WHILE (expression);

    <additional SAS statements>

    ```


    ```

    END;

    ```


    ```

    DO UNTIL (expression);

    <additional SAS statements>

    ```


    ```

    END;

    ```


    # Create a Macro Variable


    ```

    %LET variable=value;

    ```


