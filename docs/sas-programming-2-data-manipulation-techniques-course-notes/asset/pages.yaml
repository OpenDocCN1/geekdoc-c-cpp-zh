  md: "# 3.3 Solutions 3-41\n\n```\ntitle 'Customers Spending $100 or more in Retail\
    \ Sales';\nproc print data=work.discount1 noobs;\nformat TotSales dollar11.2;\n\
    run;\ntitle;\n```\n\n# 7 Identifying Extreme Values in Each Group of Data\n\n\
    ```\nproc sort data=orion.customer_dim out=work.customers;\n  by Customer_Type;\n\
    run;\ndata work.agecheck;\n  set work.customers;\n  by Customer_ID;\n  retain\
    \ oldest youngest o_ID y_ID;\n  if first.Customer Type=1 then do\n    oldest=Customer\
    \ BirthDate;\n    youngest=Customer BirthDate;\n    o_ID=Customer_ID;\n    y_ID=Customer_ID;\n\
    end;\n  if Customer BirthDate < oldest then do\n    o_ID=Customer_ID;\n    oldest=Customer\
    \ BirthDate;\nend;\n  else if Customer BirthDate > youngest then do\n    y_ID=Customer_ID;\n\
    \    youngest=Customer BirthDate;\nend;\n  if last.Customer Type=1 then do\n \
    \   age=(youngest-oldest)/365.25;\n    output;\nend;\n  keep Customer_Type oldest\
    \ youngest o_ID y_ID ageange;\n```\n\n```\ntitle 'Oldest and youngest Customers\
    \ of each Customer Type';\nproc print data=work.agecheck noobs;\nformat youngest\
    \ date9. ageange 5.1;\nntitle;\n```\n\nAlternate Solution\n\n```\nproc sort data=orion.customer\
    \ dim out=work.customers;\n  by Customer_Type Customer_BirthDate;\nrun;\ndata\
    \ work.agecheck;\n  set work.customers;\n  by Customer_Type;\n```\n\nCopyright\
