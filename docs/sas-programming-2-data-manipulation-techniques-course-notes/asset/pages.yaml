  md: '# 10.1 Creating Permanent Formats


    # Using the NOFMTERR System Option


    By default, the FMFTERR system option is in effect. If you use a format that SAS
    cannot load, SAS issues an error message and stops processing the step.


    To prevent the default action, change the system option FMTERR to NOFMTERR.


    ```

    OPTIONS FMTERR | NOFMTERR;

    ```


    # 10.03 Short Answer Poll


