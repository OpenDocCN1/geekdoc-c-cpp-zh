    # SAS Functions


    SAS provides a large library of functions for manipulating data during DATA step
    execution.


    A SAS function is often categorized by the type of data manipulation performed:


    +   - Array - Probability

    - Character - Random Number

    - Date and Time - Special

    - Descriptive Statistics - State and ZIP Code

    - Financial

    - Mathematical - Trigonometric


