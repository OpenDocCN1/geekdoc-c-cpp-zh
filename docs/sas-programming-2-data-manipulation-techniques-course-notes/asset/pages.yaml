  md: '# 2.3 Selecting Variables and Observations


    # Using DROP= in an Input Data Set


    When a DROP=data set option is used in an input data set, the specified variables
    are not read into the PDV and therefore are **not** available for processing.


    | old | data new1 new2; set old(drop=x); ... |

    | X Y Z | | | |


    | new1 |

    | Y Z |


    | PDV |

    | Y Z |


    | new2 |

    | Y Z |


    ![](img/d3bde6e6ab06b1fc622215d982111742_62_0.png)


    # Using KEEP= in an Input Data Set


    When a **KEEP=**data set option is used in an input data set, only the specified
    variables are read into the PDV and therefore are available for processing.


    | old | data new1 new2; set old(keep=y z); ... |

    | X Y Z | | | |


    | new1 |

    | Y Z |


    | PDV |

    | Y Z |


    | new2 |

    | Y Z |


    ![](img/d3bde6e6ab06b1fc622215d982111742_62_1.png)'
