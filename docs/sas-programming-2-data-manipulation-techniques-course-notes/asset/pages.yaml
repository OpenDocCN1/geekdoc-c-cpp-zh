  md: '# Automatic Numeric-to-Character Conversion


    ```

    data hrdata;

    keep Phone Code Mobile;

    set orion.convert;

    Phone=''('' !! Code !! '') '' !! Mobile;

    ```



    Partial PDV


    | Phone |

    | --- |

    | $ 23 (303) 393-0956 |


    To fix this, use the PUT function to explicitly control the numeric-to-character
    conversion.


    9 leading blanks


    # PUT Function: Example


    The PUT function returns the value produced when source is written with format.


    ```

    data conversion;\NVar1=614;\NVar2=550000;\NVar3=366;

    CVar1=put(NVar1,dollar7);

    CVar2=put(NVar2,dollar9);

    CVar3=put(NVar3,date9);

    CharVar=PUT(source,format);

    ```


    identifies the SAS variable or constant whose value you want to reformat. This
    argument can be character or numeric.


    contains the SAS format that you applied to the variable or constant that is in
    the source. It must agree with the source in type.


    The PUT function always returns a character string.


    Numeric formats right-align the results. Character formats left-align the results.'
  merge: -1
  img_proc: true
