- pgno: 460
  md: "# Substitution within a SAS Literal\n\nSuppose you need to reference a macro\
    \ variable within a SAS literal.\n\nrun;\n\n| Obs | Employee_ID | Employee_Name\
    \ |\n|---|---|---|\n| 2 | 120145 | Aisbitt, Sandy |\n| 24 | 120168 | Barcoe, Selina\
    \ |\n\nWill this program create this output?\n\n# Substitution within a SAS Literal\n\
    \nDouble quotation marks enable macro variable resolution and single quotation\
    \ marks prevent macro variable resolution.\n\n```\n%let site=Melbourne;\nproc\
    \ print data=orion.employee_addresses;\n  where City=\"&site\"\n  var Employee_ID\
    \ Employee_Name;\n  title 'Employees from &site'\nrun;\n```\n\nNOTE: There were\
    \ 41 observations read from the data set ORION.EMPLOYEE_ADDRESSES.\nWhere City='Melbourne':\n\
    \n![](img/d3bde6e6ab06b1fc622215d982111742_460_0.png)\n\n![](img/d3bde6e6ab06b1fc622215d982111742_460_1.png)\n\
    \n| Obs | Employee_ID | Employee_Name |\n|---|---|---|\n| 2 | 120145 | Aisbitt,\
    \ Sandy |\n| 24 | 120168 | Barcoe, Selina |"
  merge: -1
  img_proc: true
