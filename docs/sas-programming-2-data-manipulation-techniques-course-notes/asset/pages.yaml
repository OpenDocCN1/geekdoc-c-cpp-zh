- pgno: 112
  md: "# First. and Last. for Multiple BY Variables\n\nWhen you use more than one\
    \ variable in the BY statement, Last.BY-variable=1 for the primary variable forces\
    \ Last.BY-variable=1 for the secondary variable(s).\n\n| Proj | Dept | First.\
    \ Proj | Last. Proj | First. Dept | Last.Dept |\n|---|---|---|---|---|--|\n| A\
    \ | ADMIN | 1 | 0 | 1 | 0 |\n| A | ADMIN | 0 | 0 | 0 | 0 |\n| B | ADMIN | 0 |\
    \ 1 | 0 | 1 |\n| B | ADMIN | 1 | 0 | 1 | 1 |\n| B | ENGINR | 0 | 0 | 1 | 0 |\n\
    \n![](img/d3bde6e6ab06b1fc622215d982111742_112_0.png)\n\n# Multiple BY Variables\n\
    \nHere is the complete DATA step.\n\n```\ndata pdsals(keep=Proj Dept)\n  DeptSal\
    \ NumEmps);\n  set proj;\n  by Proj Dept;\n  if First.Dept then do;\n    DeptSal=0;\n\
    \    NumEmps=0;\n  end;\n  DeptSal+Salary;\n  NumEmps+1;\n  if Last.Dept\n```"
  merge: -1
  img_proc: true
