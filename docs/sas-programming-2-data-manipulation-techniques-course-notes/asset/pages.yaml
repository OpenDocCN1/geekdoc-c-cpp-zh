- pgno: 456
  md: '# Using User-Defined Macro Variables


    A developer manually changes the year values each time that the following program
    is submitted. Use user-defined macro variables to simplify program maintenance.


    ```

    proc print data=orion.order_fact;

    where year (order_ date)=2007;

    title "Orders for 2007";nrun;

    proc means data=orion.order_fact mean;

    where year (order_date)=2007;

    class order_type;

    var total_retail_price;

    title "Average Retail Prices for 2007";

    title2 "by Order Type";

    run;

    ```


    ![](img/d3bde6e6ab06b1fc622215d982111742_456_0.png)


    # Creating and Using a Macro Variable


    Use a %LET statement to create a user-defined macro variable, year, and a macro
    variable reference, &year, to obtain the value of the macro variable.


    ```

    %LET year=2007;

    proc print data=orion.order_fact;

    where year (order_ date)=&year;

    title "Orders for &year";

    run;

    proc means data=orion.order_fact mean;

    where year (order_date)=&year;

    class order_type;

