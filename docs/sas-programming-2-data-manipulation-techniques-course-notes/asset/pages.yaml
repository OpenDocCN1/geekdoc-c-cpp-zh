  md: '# Business Scenario


    Determine the difference between employee contributions and the quarterly goals
    of $10, $20, $20, and $15. Use a lookup table to store the quarterly goals.


    | Employee_ID | Qtr1 | Qtr2 | Qtr3 | Qtr4 |

    |---|---|---|---|--|

    | 120265 | | 15 | 15 | 25 |

    | 120267 | 15 | | 20 | 20 |

    | 120269 | 20 | 20 | | 15 |


    Diff1 = Qtr1 - 10

    Diff2 = Qtr2 - 20

    Diff3 = Qtr3 - 20

    Diff4 = Qtr4 - 15


    # Assigning Initial Values to an Array


    When the initial value list is specified, all elements behave as if they were
    named in a RETA statement. This is often used to create a lookup table, that is,
    a list of values to refer to during DATA step processing.


    > ARRAY array-name{subscript} <length>

    <array-elements>(<initial-value-list>);


    ```

    array Target{5} (50,100,125,150,200);

    ```


    | Target1 | Target2 | Target3 | Target4 | Target5 |

    |---|---|---|---|--|

    | 50 | 100 | 125 | 150 | 200 |


    (initial-value-list) lists the initial values for the corresponding array elements.
    The values for elements can be numbers or character strings. Character strings
    must be enclosed in quotation marks.


    Elements and values are matched by position. If there are more array elements
    than initial values, the remaining array elements are assigned missing values
    and SAS issues a warning.'
