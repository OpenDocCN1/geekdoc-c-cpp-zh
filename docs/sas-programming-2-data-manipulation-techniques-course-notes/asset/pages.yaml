- pgno: 268
  md: '# PUTLOG Statement


    The PUT statement can be used in the DATA step to display

    * the value(s) of one or more variables

    * messages in the log.


    ```

    PUTLOG <specifications>;

    data us mailing;

    set orion.mailing_list;

    drop Address;

    length City $ 25 State $ Zip $ 5;

    if find(Address,''US'')

    putlog ''Found us:

    Name-catx('', scan (Name,2,1''),

    scan (Name,1,1''),'');

    City=scan(Address,3,1,'''');

    State=scan(address,2,1'');

    Zip=scan(Address,3,1,'''');

    run;

    ```


    The PUT statement can be used to write to the SAS log in both batch and interactive
    modes. The PUT statement can also be used for this purpose. In addition, the PUT
    statement is used to write to an external file. If an external file is open for
    output, steps must be taken to ensure that debugging messages are written to the
    SAS log and not to the external file. documentation for more information about
    the PUT statement.


    # Using PUTLOG to Write the Value of a Variable


    To write the name and value of a variable to the log, use this form of the PUTLOG
    statement:


    ```

    PUTLOG variable-name=;

    ```


    For example, if the value of the variable City is San Diego, the statement


    ```

    putlog City=San Diego;

    ```


    writes City=San Diego to the log.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Using PUTLOG to Write Formatted Values


    To write the formatted value of a variable to the log,

    use this form of the PUTLOG statement:


    ```

    PUTLOG variable-name format-namew.;

    ```


    For example, if the value of the variable City is

    Philadelphia with a leading space, the statement


    ```

    putlog City $quote22;

    ```


    writes "Philadelphia" to the log.


    > The value of w should be wide enough to display

    t value of the variable and the quotation marks.


    # Using PUTLOG to Write Values of All Variables


    To write the current contents of the program data vector

    (PDV) to the log, use this form of the PUTLOG statement:


    ```

    PUTLOG _ALL_;

    ```


    # Partial SAS Log


    ```

    Name=Abbott, Address1=2267 Edwards Mill Rd Address3=Miami-

    Date, FL, 33135, US City= State= ERROR=_0 _N=1

    Name=Alberts, Sandy Address1=30 Bingera Street

