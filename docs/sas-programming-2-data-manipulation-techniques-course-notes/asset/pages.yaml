- pgno: 417
  md: '# Using the FMTSEARCH= System Option


    To use permanent formats or to search multiple catalogs, use the FMTSEARCH= system
    option to identify the catalog(s) to be searched for the format(s).


    ```

    options fmtsearch=(orion orion.MyFmts);

    OPTIONS FMTSEARCH=(item-1 item-2...item-n);

    ```


    # Using the FMTSEARCH= System Option


    ```

    options fmtsearch=(orion orion.MyFmts);

    ```


    +   1 formats supplied by SAS

    2 work.formats

    3 library.formats

    4 orion.formats

    5 orion.MyFmts


    Because orion is a libref without a catalog name, formats is assumed to be the
    catalog name.


    Formats supplied by SAS are always searched first. The work.formats catalog is
    always searched, unless it appears in the FMTSEARCH list. If the library libref
    is assigned, the library.formats catalog is searched after before anything else
    in the FMTSEARCH list, unless it appears in the list. To assign the library libref,
    use the code shown below:


    ```

    classname library ''SAS-data-library-containing-format-catalog'';

    ```'
  merge: -1
  img_proc: true
