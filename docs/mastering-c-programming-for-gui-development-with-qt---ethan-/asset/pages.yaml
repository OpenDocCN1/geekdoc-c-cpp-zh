  md: '# 6. Connecting Signals and Slots


    Qt''s signal-slot mechanism enables communication between objects in your application.
    Let''s connect the push button''s "clicked" signal to a slot that will display
    a message when the button is pressed.


    +   - Right-click on the push button and select "Go to slot..."

    - In the dialog box, choose the "clicked()" signal and click "OK".

    - Qt Creator will generate a slot function in your main window''s header and source
    files.

    - Inside the slot function, add the following code:


    C++


    ```

    QMessageBox::information(this, "Qt Greeting", "Hello from Qt!");

    ```


    # 7. Building and Running the Application


    With the user interface designed and the signal-slot connection established, it''s
    time to build and run your application.


    +   - Click on the green "Run" button in Qt Creator''s toolbar or press Ctrl+R.

