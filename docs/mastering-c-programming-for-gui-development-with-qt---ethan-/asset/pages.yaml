    QPushButton targets all button widgets.

    - **Class Selector**: Targets widgets that have a specific class name assigned
    to them. For example, .myButton targets all widgets with the class name "myButton."

    - **ID Selector**: Targets a specific widget with a unique ID. For example, #myButton
    targets the widget with the ID "myButton."

    - **Descendant Selector**: Targets widgets that are descendants of another widget.
    For example, QWidget QPushButton targets all push button widgets that are descendants
