  md: '+   1. Qt Core: The bedrock of the Qt framework, Qt Core provides essential
    non-GUI classes and functionalities that underpin the entire Qt ecosystem. It
    encompasses fundamental data types, containers, algorithms, input/output operations,
    and more. Qt Core is a mandatory component for any Qt project, serving as the
    foundation upon which other modules are built.


    +   2. Qt GUI: The core GUI module, Qt GUI, forms the backbone of Qt''s graphical
    user interface capabilities. It offers a comprehensive set of classes for creating
    and managing windows, widgets, layouts, events, and other GUI elements. Qt GUI
    is indispensable for building any Qt-based graphical application.


    +   3. Qt Widgets: A treasure trove of pre-built GUI widgets, Qt Widgets provides
    a rich collection of ready-to-use components for constructing user interfaces.
    From buttons and labels to tables and tree views, Qt Widgets offers a wide range
    of visual elements that accelerate development and streamline the creation of
    interactive interfaces.


    +   4. Qt QML: Qt QML introduces a declarative language for designing fluid and
    dynamic user interfaces. With its JavaScript-like syntax and intuitive structure,
    QML empowers you to describe the visual appearance and behavior of your UI in
    a concise and expressive manner. QML''s seamless integration with C++ allows you
    to leverage the power of both worlds, the performance of C++ with the flexibility
    of QML.


    +   5. Qt Quick: The module responsible for building QML-based applications, Qt
    Quick provides the runtime environment and infrastructure for executing QML code.
    It seamlessly integrates with Qt GUI, enabling you to combine traditional widgets
    with QML elements to create hybrid UIs that leverage the strengths of both approaches.'
