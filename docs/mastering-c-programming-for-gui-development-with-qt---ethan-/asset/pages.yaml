  md: "In this example, we define a Car class with properties color and numDoors,\
    \ and methods startEngine() and openDoor(). In the main() function, we create\
    \ an object myCar of the Car class, set its properties, and invoke its methods.\n\
    \n# Inheritance: Extending Functionality\n\nInheritance is a powerful OOP concept\
    \ that allows you to create new classes (derived classes) based on existing classes\
    \ (base classes). The derived class inherits the properties and methods of the\
