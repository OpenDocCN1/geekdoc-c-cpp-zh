  md: '# Loading Media


    To initiate playback, you first need to load a media file or network stream into
    the QMediaPlayer . Qt supports various media sources, including local files, URLs,
    and even custom data streams.


    C++


    ```

    QMediaPlayer* player = new QMediaPlayer(this);

    player->setMedia(QUrl::fromFile("my_video.mp4"));

    ```


    In this example, we create a QMediaPlayer object and load a local video file using
    the setMedia() function. Qt''s multimedia framework automatically handles the
    decoding and preparation of the media for playback.


    # Playback Controls


    The QMediaPlayer class offers a comprehensive set of methods for controlling playback:


    +   - play(): Starts or resumes playback.

    - pause(): Pauses playback.

    - stop(): Stops playback and resets the position to the beginning.

    - setPosition(): Seeks to a specific position within the media.'
