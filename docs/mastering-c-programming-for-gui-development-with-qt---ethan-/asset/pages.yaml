- img_proc: true
  md: 'Build System: A collection of tools and processes used to compile and link
    source code into an executable application. Qt supports various build systems,
    including qmake and CMake.


    C++: A high-performance, general-purpose programming language widely used for
    system-level programming, game development, and GUI applications.


    Class: In object-oriented programming, a class serves as a blueprint or template
    for creating objects, defining their properties (data) and methods (behavior).


    Client-Server Architecture: An architectural pattern in networked applications
    where clients initiate requests to a central server, which processes the requests
    and sends back responses.


    Coding Conventions: A set of guidelines and best practices for formatting, naming,
    and structuring code to ensure consistency, readability, and maintainability.


    Compiler: A software tool that translates human-readable source code into machine-executable
    code.


    Component: In Qt 3D, a component defines the properties and behaviors of an entity
    within a 3D scene.


    Context Property: A property that is accessible within a specific QML context,
    allowing data or functionality to be shared between QML and C++.


    Cross-platform Development: The practice of developing software that can run on
    multiple operating systems or platforms with minimal or no code modifications.'
