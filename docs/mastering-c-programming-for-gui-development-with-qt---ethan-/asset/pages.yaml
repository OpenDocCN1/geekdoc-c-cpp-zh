    their visual appearance, adding realism and detail to your scenes. Qt 3D supports
    a wide range of material types, including Phong, PBR (Physically Based Rendering),
    and custom shaders.


    +   - Lighting and Shadows: Illuminate your scene with various light sources,
    such as directional lights, point lights, and spot lights. Qt 3D also supports
    shadow mapping techniques to create realistic shadows cast by objects in the scene.


    +   - Cameras and Views: Control the perspective from which your scene is viewed
    using cameras. Qt 3D provides various camera types, including perspective cameras
    and orthographic cameras, allowing you to achieve different visual effects and
    perspectives.


    +   - Animations and Transformations: Animate the properties of 3D objects over
    time, creating dynamic and engaging scenes. Qt 3D supports keyframe animations,
    skeletal animations, and morph target animations, enabling you to bring your 3D
    models to life.'
