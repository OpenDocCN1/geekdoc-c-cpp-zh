  md: '# Smart Pointers to the Rescue


    Smart pointers offer a safer and more convenient approach to memory management
    in C++. They act as wrappers around raw pointers, automatically managing the lifetime
    of the allocated memory. When a smart pointer goes out of scope or is reassigned,
    it automatically deallocates the associated memory, eliminating the need for manual
    delete calls and significantly reducing the risk of memory leaks.


    # Types of Smart Pointers


    C++11 introduced three primary types of smart pointers:


    +   1. unique_ptr: Represents exclusive ownership of the managed object. Only
    one unique_ptr can point to a given object at any time. When a unique_ptr goes
    out of scope, it automatically deletes the owned object.

    2. shared_ptr: Enables shared ownership of the managed object. Multiple shared_ptr
    objects can point to the same object, and the object is deleted only when the
    last shared_ptr pointing to it is destroyed.

    3. weak_ptr: Provides a non-owning reference to an object managed by a shared_ptr.
    weak_ptr objects don''t contribute to the object''s reference count and can be
    used to observe an object without affecting its lifetime.


    # Smart Pointers in Qt'
