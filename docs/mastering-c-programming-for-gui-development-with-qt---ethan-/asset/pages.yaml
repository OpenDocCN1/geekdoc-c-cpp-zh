  md: 'Custom Delegate: A specialized component in Qt''s Model-View architecture that
    controls the rendering and editing of individual data items within a view.


    Custom Layout: A layout manager in Qt that is created by subclassing the QLayout
    class and implementing custom logic for widget arrangement and resizing.


    Custom Signal: A user-defined signal in Qt that can be emitted from a QObject
    -derived class to notify other objects about events or state changes.


    Custom Slot: A user-defined slot in Qt that can be connected to signals, enabling
    objects to respond to events and execute corresponding actions.


    Custom Widget: A user-defined widget in Qt that extends the functionality or appearance
    of existing widgets or creates entirely new GUI elements.


    Dangling Pointer: A pointer that points to a memory location that has been deallocated
    or is no longer valid, potentially leading to undefined behavior and crashes.


    Data Race: A condition in multithreaded programming where multiple threads access
    and modify the same data concurrently, potentially leading to data corruption
    or inconsistencies.


    Database Backend: The underlying database system used to store and manage data,
    such as SQLite, PostgreSQL, MySQL, or Oracle.'
