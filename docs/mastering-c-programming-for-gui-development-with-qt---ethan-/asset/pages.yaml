  md: 'Size policies govern how widgets resize within a layout. Each widget has both
    a horizontal and a vertical size policy, which can be set to one of the following
    values:


    +   - QSizePolicy::Fixed : The widget''s size remains fixed and does not change
    when the layout is resized.

    - QSizePolicy::Minimum : The widget''s size is at least its minimum size hint
    but can grow to accommodate its contents or the available space.

    - QSizePolicy::Maximum : The widget''s size is at most its maximum size hint but
    can shrink to accommodate its contents or the available space.

    - QSizePolicy::Preferred : The widget''s size is ideally its preferred size hint
    but can grow or shrink to accommodate its contents or the available space.

    - QSizePolicy::Expanding : The widget expands to fill all available space within
    the layout.


    Choose size policies carefully to control how widgets resize and ensure they maintain
    their usability and visual appeal across different screen configurations.


    # 4. Leverage Spacers and Stretch Factors


    Spacers and stretch factors provide additional control over space distribution
    within layouts. Spacers are invisible widgets that occupy space within a layout,
    allowing you to create gaps between other widgets. Stretch factors, assigned to
    individual widgets, influence their relative sizes when the layout is resized.


    By strategically using spacers and stretch factors, you can achieve balanced and
    visually pleasing layouts, even when the available space changes.'
