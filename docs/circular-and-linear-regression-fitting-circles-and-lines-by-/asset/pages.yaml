    $\mathbf{B}^{-1} (\mathbf{X}^{T} \mathbf{X})$.


    **Analysis of the eigenvalue problem.** Let us examine the eigensystem of $\mathbf{B}^{-1}
    (\mathbf{X}^{T} \mathbf{X})$. The matrix $\mathbf{X}^{T} \mathbf{X}$ is positive
    semi-definite, and in the generic case it is positive definite (the singular case
    is discussed below). The other matrix, $\mathbf{B}^{-1}$, is symmetric and has
    four real eigenvalues, one of them negative and three other positive (its spectrum
    is $\{1, 1, 0.5, -0.5\}$). Premultiplying (5.29) with $\mathbf{Y} = (\mathbf{X}^{T}
    \mathbf{X})^{1/2}$ transforms it into


    $\mathbf{Y} \mathbf{B}^{-1} \mathbf{Y} (\mathbf{Y} \mathbf{A}) - \eta (\mathbf{Y}
