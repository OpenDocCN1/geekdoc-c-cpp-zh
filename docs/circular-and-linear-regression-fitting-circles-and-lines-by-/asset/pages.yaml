    # 7.8 Bias reduction and consistent fits via Huber


    In Section 6.11 we mentioned some tricks that can be used to reduce the bias of
    the circle radius estimator. We also described a general procedure (called adjusted
    least squares) that produced asymptotically unbiased and consistent estimators,
    in the large sample limit n → ∞. That procedure works for the polynomial model
    only, where one fits a polynomial y = p(x) = β₀ + β₁x + ... + βₖxᵏ to data points.


    Here we describe similar procedures that work for implicit nonlinear models, in
    particular for circles and ellipses. These are based on fundamental ideas of Huber
    [85, 86, 87].


    **Unbiasing M-equations.** Note that the maximum likelihood estimate (MLE) of
    a parameter Θ is a solution to the maximum likelihood (ML) equation


    ∇_Θ(ln L(Θ)) = 0,    (7.59)


    where L(Θ) denotes the likelihood function and ∇_Θ the gradient. In the case of
    n independent observations xᵢ = (xᵢ, yᵢ), we have L(Θ) = ∏ᵢ₌₁ⁿ f(xᵢ; Θ), the product
    of the density functions; hence the equation (7.59) takes form


    ∑ᵢ₌₁ⁿ Ψ_MLE(xᵢ; Θ) = 0    (7.60)'
