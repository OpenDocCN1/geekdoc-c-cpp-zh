- pgno: 235
  md: 'Kanatani did not prove the convergence of his iterative scheme, but it was
    tested in many experiments by various researchers and turned out to be very reliable.


    Adaptation to circles. Kanatani actually developed his method for the more complicated
    problem of fitting ellipses, where the matrices **M** and **H** depended not only
    on the data, but also on the parameter vector **A**, hence they needed to be recomputed
    at every iteration. In our case **M** and **H** are independent of **A**, and
    then Kanatani’s first order problem (7.69) easily reduces to the generalized eigenvalue
    problem


    $\mathbf{M}\mathbf{A} = \hat{V}\mathbf{H}\mathbf{A}$.


    In other words, $\hat{V}$ is the smallest eigenvalue and $\hat{\mathbf{A}}$ is
    the corresponding eigenvector of the matrix pencil $\left(\mathbf{M}, \mathbf{H}\right)$;
    this problem can be solved in one step (by using matrix algebra software) and
    needs no iterations. In fact, its solution is nothing but our familiar Hyper fit,
    see Section 7.5. Thus in the case of fitting circles, Kanatani’s first order scheme
    coincides with the Hyperaccurate algebraic fit.


    # ### 7.12 Renormalization method of Kanatani: 2nd order


    **Second order renormalization.** This version keeps the second order term $8V^2\mathbf{I}_1$
    in place. The equation (7.70) now takes its full form


    ```

    $\lambda_{\min }(V)=\mathbf{A}_{V}^{T} \mathbf{M} \mathbf{A}_{V}-V \mathbf{A}_{V}^{T}
    \mathbf{H} \mathbf{A}_{V}+8 V^{2} \mathbf{A}_{V}^{T} \mathbf{I}_{1} \mathbf{A}_{V}=0$.
    (7.72)

    ```


    Kanatani proposes to solve (7.72) by the following iterative scheme. Given a current
    approximation $V_{k}$ to $\hat{V}$, he fixes the vector $\mathbf{A}_{V_{k}}$ and
    then approximates the function $\lambda_{\min }(V)$ by a quadratic polynomial,


    ```

    $\lambda_{\min }(V) \approx \beta_{0}+\beta_{1} V+\beta_{2} V^{2}$, (7.73)

    ```


    where


    ```

    $\begin{aligned} \beta_{0} &=\mathbf{A}_{V_{k}}^{T} \mathbf{M} \mathbf{A}_{V_{k}},
    \\ \beta_{1} &=-\mathbf{A}_{V_{k}}^{T} \mathbf{H} \mathbf{A}_{V_{k}}, \\ \beta_{2}
    &=8 \mathbf{A}_{V_{k}}^{T} \mathbf{I}_{1} \mathbf{A}_{V_{k}} \end{aligned}$.

    ```


    The next approximation to $\hat{V}$ is computed as the smaller root of (7.73),
    i.e.


    ```

    $V_{k+1}=\frac{-\beta_{1}-\sqrt{\beta_{1}^{2}-4 \beta_{0} \beta_{2}}}{2 \beta_{2}}$.
    (7.74)

    ```


    Kanatani takes the smaller root because he is aiming at the minimal eigenvalue
    of $\mathbf{M}_{\text{unbiased}}(V)$. Normally, the polynomial (7.73) has two
    real roots, and the smaller one is computed by (7.74).'
