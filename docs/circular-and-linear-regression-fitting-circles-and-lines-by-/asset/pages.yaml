  md: '![](img/86db288e3c266985d1648282179ae4b5_20_0.png)


    Figure 0.5: The structure of the book.


    schemes for circles, and analyzes the shape of the objective function to be minimized
    (culminating in the important Two Valley Theorem).


    Chapters 4 and 5 are devoted to practical circle fitting methods.


    In Chapter 4 circles are fitted by minimizing geometric distances from observed
    points to the fitting circle, which is a classical (or geometric) fit. This is
    a nonlinear problem that has no closed form solution, so all algorithms are iterative,
    thus computationally intensive and subject to occasional divergence. We describe
    all popular schemes, in a historic perspective, emphasizing relations between
    one another, highlighting their advantages and drawbacks.


    Chapter 5 deals with simplified circle fits, so called algebraic fits. They are
    fast, noniterative, and do not suffer from divergence. However, they are (in many
    cases) less accurate than the geometric fits of Chapter 4. Algebraic fits'
