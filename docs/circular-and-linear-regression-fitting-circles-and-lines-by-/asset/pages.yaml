- pgno: 217
  md: 'are all real, exactly three of them are positive and one is negative. In this
    sense the Hyper fit is similar to the Pratt fit, as the constraint matrix **P**
    also has three positive and one negative eigenvalues.


    **Invariance of the Hyper fit.** We note that the Hyper fit is invariant under
    translations and rotations. This follows from the fact that the constraint matrix
    **H** is a linear combination of two others, **T** and **P**, that satisfy the
    invariance requirements, as established in Sections 5.7 and 5.10.


    The Hyper fit is also invariant under similarities, which can be verified as in
    Section 5.10. Indeed, whenever $(x,y) \mapsto (cx, cy)$, we have $(A,B,C,D) \mapsto
    (A/c^2, B/c, C/c, D)$, and hence $\mathbf{A}^T \mathbf{H} \mathbf{A} \mapsto c^{-2}
    \mathbf{A}^T \mathbf{H} \mathbf{A}$. Thus the constraint $\mathbf{A}^T \mathbf{H}
    \mathbf{A} = 1$ will be transformed into $\mathbf{A}^T \mathbf{H} \mathbf{A} =
    c^2$, which is irrelevant as our parameter vector **A** only needs to be determined
    up to a scalar multiple.


    **Hyper fit versus Pratt fit.** Curiously, the Hyper fit and the Pratt fit return
    the same center of the circle^{1}. This can be seen as follows. Recall that the
    Pratt fit is mathematically equivalent to the Chernov-Ososkov fit, and both minimize
    the objective function (5.16), which is


    ```

    $$\mathcal{F}_{\text{Pratt}}(a, b, R) = \frac{\sum_{i=1}^{n} [(x_i - a)^2 + (y_i
    - b)^2 - R^2]^2}{4R^2}$$

    ```


    Now expressing the Hyper fit in the geometric parameters $(a,b,R)$ we can see
    that it minimizes the function


    ```

    $$\mathcal{F}_{\text{Hyper}}(a, b, R) = \frac{\sum_{i=1}^{n} [(x_i - a)^2 + (y_i
    - b)^2 - R^2]^2}{4n^{-1} \sum_{i=1}^{n} [2(x_i - a)^2 + 2(y_i - b)^2 - R^2]}$$

    ```


    One can differentiate both functions with respect to $R^2$ and solve the equations


    ```

    $$\frac{\partial \mathcal{F}_{\text{Pratt}}}{\partial R^2} = 0 \qquad \text{and}
    \qquad \frac{\partial \mathcal{F}_{\text{Hyper}}}{\partial R^2} = 0,$$

    ```


    thus eliminating $R^2$. Then we arrive at an objective function in terms of $a$
    and $b$, and it happens to be the same for both Pratt and Hyper fits:


    ```

    $$\mathcal{F}(a, b) = \left( \frac{1}{n} \sum_{i=1}^{n} [(x_i - a)^2 + (y_i -
    b)^2] \right)^\frac{1}{2} - \frac{1}{n} \sum_{i=1}^{n} [(x_i - a)^2 + (y_i - b)^2],$$

    ```


    up to irrelevant constant factors. Then its minimum gives the estimates of $a$
    and $b$, and it is the same for both fits. (The Taubin fit give a different estimate
    of the center.)


    Since the Hyper fit returns the same circle center $(\hat{a}, \hat{b})$ as the
    Pratt fit does, the Hyper fit estimates $(\hat{a}, \hat{b}, \hat{R})$ also have
    infinite moments (Chapter 6.4).


    > 1 This interesting fact was discovered by A. Al-Sharadqah.'
