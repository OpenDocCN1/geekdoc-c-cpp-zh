    # 6.11 Consistent fit and adjusted least squares


    Once statisticians realized that parameter estimators in the curve fitting problems
    were almost universally biased, and once they derived various approximate formulas
    for the bias, attempts were made to eliminate the latter. Many practitioners designed
    various "unbiasing" schemes and tricks, and claimed that they removed the bias.


    One needs to remember, however, that truly unbiased estimation in non-linear EIV
    problems is practically impossible. In fact, every known "bias removal" procedure
    only eliminates a part of the bias; for example one can remove the leading term
    in an asymptotic expansion for the bias, but higher order terms will persist.
    We will describe several such tricks below.


    **Simple bias reduction.** The bias of the radius estimate of the geometric circle
    fit is known to be $\frac{\sigma^2}{2R} + \mathcal{O}(\sigma^4)$, see (6.43).
    Thus one can construct an "unbiased" estimate by


    ```

    $$\hat{R}_{\text{''unbiased''}} = \hat{R} - \frac{\sigma^2}{2\hat{R}}, \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad(6.47)$$

    ```


    Here we assume, for simplicity, that $\sigma$ is known. Squaring (6.47) and ignoring
    higher order terms gives another version of essentially unbiased radius estimator:


    ```

    $$\hat{R}^2_{\text{''unbiased''}} = \hat{R}^2 - \sigma^2. \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad(6.48)$$

    ```


    Similar tricks are proposed by various authors, see e.g., [189]. For other tricks,
    see [33, 32, 195].


    Amemiya and Fuller [5] develop a more sophisticated procedure eliminating the
    essential bias of the maximum likelihood estimators, for a general problem of
    fitting arbitrary curves to data (again assuming that the noise level $\sigma$
    is known). One can check (we omit details) that for circles their procedure reduces
    to (6.48).'
