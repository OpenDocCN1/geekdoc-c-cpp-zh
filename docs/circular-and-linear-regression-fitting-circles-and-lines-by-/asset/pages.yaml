  md: '**Existence of a minimum.** From now on we work with the enlarged space containing
    all circles, lines, and singletons. On this space we define a topology by the
    same rule (3.17), in which $\mathbb{S}_i$ and $\mathbb{S}$ may denote either circles
    or lines or singletons.


    **Theorem 5** *Let* $\mathbb{B}$ *be a given bounding box containing all the data
    points. Then the* ‘enlarged’ *space of circles, lines, and singletons intersecting*
    $\mathbb{B}$ *is compact.*


    *Proof.* Let $\{\mathbb{S}_i\}$ be a sequence of objects (circles, lines, singletons)
    that intersect $\mathbb{B}$. If there are infinitely many singletons in $\{\mathbb{S}_i\}$,
    then a subsequence of those converges to a point in $\mathbb{B}$ because the latter
    is compact. If there are infinitely many nonsingletons, then each of them is represented
    by a vector $(A_i, B_i, C_i, D_i)$ with $A_i \geq 0$. The sequence $\{A_i\}$ contains
    a subsequence that either converges to a limit $A < \infty$ or diverges to infinity.
    In the latter case we have a sequence of circles in $\mathbb{B}$ whose radii converge
    to zero, then they have a limit point in $\mathbb{B}$ just as singletons do, see
    above. If $A = 0$, then we have a sequence of arcs whose radii grow to infinity,
    and it contains a subsequence converging to a line because the space of lines
    crossing $\mathbb{B}$ is compact (Section 2.2). Lastly, if $0 < A < \infty$, then
    we have a sequence of circles crossing $\mathbb{B}$ whose radii converge to $R
    = 1/(2A)$. Then their centers must stay within distance $2R$ from the box $\mathbb{B}$,
    hence there is a subsequence of these circles whose centers converge to a limit
    point $(a,b)$. Therefore our subsequence converges to the circle $(a,b,R)$. The
    theorem is proved. $\square$


    We remark that singletons need not really be involved, as they never provide the
    minimum of the objective function $\mathscr{F}$, unless all the data points collapse,
    but even in that case any line or circle through that collapsed data point would
    provide the best fit $\mathscr{F} = 0$ anyway.


    Next, again as in Section 2.2 suppose a circle $\mathbb{S}$ (or a line $\mathbb{L}$)
    does not cross the box $\mathbb{B}$. Then it cannot provide a minimum of $\mathscr{F}$,
    as one can just move $\mathbb{S}$ (or $\mathbb{L}$) closer to the box and thus
    reduce all the distances from the data points to $\mathbb{S}$ (or $\mathbb{L}$).
    So we can restrict our search of the minimum of $\mathscr{F}$ to the space of
    circles and lines that intersect the bounding box $\mathbb{B}$. Since it is compact
    we obtain:


    **Theorem 6** *The objective function* $\mathscr{F}$ *always attains its minimum,
    though it may be attained either on a circle or on a line.*


    This resolves the existence issue in a satisfactory way.


    # ### 3.4 Multivariate interpretation of circle fit


    The conclusions of the previous section can be illustrated by a multidimensional
    geometric construction similar to the one described in Section 1.5.'
