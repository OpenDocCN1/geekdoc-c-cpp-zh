  md: '# ### 8.2 Simple Riemann fits


    The previous section suggests the following circle fit, which was originally proposed
    in 1997 by Lillekjendie [123] and further developed by him and his co-authors
    in [175, 173]. It consists of three steps:


    **Step 1.** Map the data points $(x_i, y_i)$ onto the Riemann sphere according
    to formulas (8.1). This produces $n$ points $(x''_i, y''_i, z''_i)$ on the sphere.


    **Step 2.** Fit a circle to the points $(x''_i, y''_i, z''_i)$ on the sphere.
    Since a circle on the sphere is obtained by intersection of the sphere with a
    plane, one just needs to fit a plane to the points $(x''_i, y''_i, z''_i)$.


    **Step 3.** After finding the best fitting circle on the Riemann sphere, project
    it back onto the $xy$ plane and get a circle (or a line) fitting the original
    data set $(x_i, y_i)$.


    The last step is a straightforward exercise in elementary geometry. Suppose the
    plane obtained at Step 2 is given by equation


    $$\alpha x'' + \beta y'' + \gamma z'' + c = 0. \tag{8.2}$$


    Then the center $(a,b)$ of the circle fitting the original data set is computed
    by


