- pgno: 21
  md: 'are often used in mass data processing (especially in nuclear physics), where
    speed is of paramount importance. Algebraic fits are also used for initializing
    iterative geometric fitting procedures.


    The reader interested in only practical algorithms can find all the relevant information
    is Chapters 3–5.


    Chapters 6 and 7 make a sharp turn and plunge into statistical analysis of curve
    fitting methods. This is theoretical material, but I have tried to relate it to
    practice and explain all constructions and conclusions in practical terms. Chapter
    6 is devoted to general nonlinear EIV regression, i.e., it covers arbitrary curves.
    Chapter 7 focuses on the specific task of fitting circles and circular arcs.


    Chapters 6 and 7 may be of interest to professional statisticians.


    Lastly, Chapter 8 presents a sample of “exotic” circle fits, including some mathematically
    sophisticated procedures — they make use of complex numbers and conformal mappings
    of the complex plane. This chapter is best for scientists with a solid mathematical
    background. The ideas behind methods of Chapter 8 are quite intriguing and resulting
    fits look very promising. This may be a starting point for future development
    of this subject.


