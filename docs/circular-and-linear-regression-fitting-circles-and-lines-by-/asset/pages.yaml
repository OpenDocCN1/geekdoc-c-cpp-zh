  md: 'troversy. A. Madansky, for example, devotes a few pages of his 1959 paper [127]
    describing the shock of an average physicist who would learn about the unsolvability
    of the "simple" regression problem, and how statisticians could explain it to
    him.


    Later the insolvability of this problem was proved in mathematical terms. First,
    it was established in 1956 by Anderson and Rubin [9] (see also [73]) that even
    in the linear case $y = a + bx$ the likelihood function was unbounded (its supremum
    was infinite), thus maximum likelihood estimates could not be determined. Interestingly,
    the likelihood function has critical points, which have been occasionally mistaken
    for maxima; only in 1969 the issue was resolved: M. Solari [168] proved that all
    critical points were just saddle points.


    Second (and more importantly), it was shown in 1977 by Nussbaum [139] (see also
    page 7 in [40]) that no statistical procedure could produce strongly consistent
    estimates $\hat{a}$ and $\hat{b}$ (which would converge to the true values of
    $a$ and $b$ as $n \to \infty$). See also the discussion of identifiability in
    the book [40] by Cheng and Van Ness.


    To make the EIV regression model solvable, Kummel [117] assumed that


    the ratio $\kappa = \sigma_x / \sigma_y$ is known. (1.22)


    He justified his assumption by arguing that experimenters "usually know this ratio
    from experience." Later this assumption was commonly adopted in the statistics
    literature. Recently Fuller [66] called the EIV model satisfying the assumptions
    (1.9), (1.10), and (1.22) the "classical EIV model."


    ![](img/86db288e3c266985d1648282179ae4b5_45_0.png)


    Figure 1.5 *The EIV fit minimizes the sum of squares of "skeweed" distances from
    the data points to the line. Here $\kappa = 2$.*


    Now the EIV regression problem has a well defined solution. In 1879 Kummel [117]
    gave formulas for the best fitting line that involved $\kappa$. His line $y =
    a + bx$ minimizes


    $\mathscr{F} = \frac{1}{1+\kappa^{2}b^{2}} \sum_{i=1}^{n}(y_{i} - a - bx_{i})^{2}$
    (1.23)'
