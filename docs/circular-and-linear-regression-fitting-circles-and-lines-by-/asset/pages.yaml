    center = (7.4487, 22.7436),\n radius = 13.8251. (1)

    ```


    This does not seem challenging, as the arc in Fig. 0.3 is clearly visible to the
    naked eye, so one can even reconstruct a circle manually.


    ![](img/86db288e3c266985d1648282179ae4b5_17_1.png)


    Figure 0.4: A fragment of the arc shown in Fig. 0.3.


    Now suppose we can only see a small fragment of the above arc, with very few points
    on it. Fig. 0.4 shows a sample of merely 22 randomly chosen points from a tiny
    part of the original arc. Suppose we are to fit a circle to these points, without
    seeing the rest of the image. Is it possible?


    Visually, the 22 points in Fig. 0.4 do not even form a clear circular arc, they
    rather look like a shapeless string. Reconstructing a circle manually from these
    22 points appears an impossibility. However, the best computer algorithm returns
    the following parameters:


    ```

    center = (7.3889, 22.6645),\n radius = 13.8111. (2)

    ```


    Compare this to (1). The estimates are strikingly accurate!'
