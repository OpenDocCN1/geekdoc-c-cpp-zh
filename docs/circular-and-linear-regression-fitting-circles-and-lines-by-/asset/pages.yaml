  md: '**Newton-based solution of the quartic equation.** Equation (5.18) may have
    up to four different real roots, which are not easy to compute. However, Chernov
    and Ososkov [45] notice that if one sets $D = -\bar{z}$ (this is the value furnished
    by the Kása method) as the initial guess and applies a standard Newton procedure
    to solve (5.18), then the latter always converges to the root that corresponds
    to the minimum of (5.17).


    Besides, the convergence is fast: it takes 3 to 5 iterations, on the average,
    to find the desired root (with tolerance set to $10^{-12}$). It is important,
    though, that one uses the double-precision arithmetic to solve (5.18), as single
    precision round-off errors tend to ruin the accuracy of the final estimates.


    However, Chernov and Ososkov [45] did not provide a theoretical analysis of their
    modification; in particular they did not prove that their Newton procedure described
    above always converges to a root of (5.18), or that the root which it finds always
    corresponds to the minimum of (5.16). These facts were proved much later, in 2005,
    by Chernov and Lesort [43] based on the Pratt circle fit discussed in the next
    section.


    **Application in high energy physics.** The Chernov- Ososkov modification turned
    out to be more robust than the original Kása method in handling nearly singular
    cases, i.e., when the data points were sampled along small arcs (we will present
    experimental evidence in Section 5.7).


    This modification was designed for the use in high energy physics experiments
    and employed is several nuclear research centers for a number of years. In those
    experiments, one deals with elementary particles born in an accelerator that move
    along circular arcs in a constant magnetic field in a detector chamber (such as
    a bubble chamber); physicists determine the energy of the particle by measuring
    the radius of its trajectory; faster particles move along arcs of larger radius
    (lower curvature), thus the nearly singular circle fit occurs quite often in those
    experiments.


    **Drawbacks.** A disadvantage of the Chernov- Ososkov modification is the complexity
    of its algebraic formulas (5.17)–(5.19), which are not easy to program. Besides,
    the lack of theoretical analysis (until 2005) was disheartening.


    These issues were resolved in the late 1980s when Pratt (independently of Chernov
    and Ososkov) proposed a different algebraic circle fit [150] described in the
    next section. The Pratt fit turns out to be mathematically equivalent to the Chernov-
    Ososkov method, but it admits a simpler, more elegant, and numerically stable
    programming implementation; it is also much easier to analyze theoretically.'
