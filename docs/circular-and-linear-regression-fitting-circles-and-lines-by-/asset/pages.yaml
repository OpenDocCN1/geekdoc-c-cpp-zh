    local minima (but still below 15%) is recorded for n = 10 points, and it quickly
    decreases as n grows; for more than 100 points, samples with local minima are
    virtually nonexistent. Multiple local minima turn up very rarely, if at all. The
    maximal number of local minima observed in that large experiment was four, and
    that happened only a few times in millions of random samples tested.


    Generating points in a square with a uniform distribution produces completely
    irregular ("chaotic") samples without any predefined pattern. This is, in a sense,
    the worst case scenario, because different groups of random points presumably
    could line up along two or more different arcs thus leading to possibly distinct
    good fits. Still we see that this rarely happens; in > 85% of the samples the
    function ℱ has a unique minimum.


    More realistic probability distributions were tried in [43], too, in which random
    samples were generated along a circular arc with some noise. For example, if n
    = 10 points are sampled along a 90° circular arc of radius R = 1 with a Gaussian
    noise at level σ = 0.05, then the frequency of appearance of local minima was
    as low as 0.001. And this was one of the "worst" cases; in other realistically
    looking samples, local minima virtually never occurred.


    These studies clearly demonstrate that in typical applications the objective function
    ℱ is most likely to have a unique (global) minimum and no local minima. Thus local
    minima are not a real danger; it can be reasonably assumed that in ℱ has a unique
    (global) minimum.


    Does this mean that standard iterative algorithms, such as the steepest descent
    or the Nelder-Mead simplex or Gauss-Newton or Levenberg-Marquardt, would converge
    to the global minimum from any starting point? Unfortunately, this is not the
    case, as we demonstrate in the next section.


    ![](img/86db288e3c266985d1648282179ae4b5_94_0.png)


    Figure 3.7: A simulated data set of 50 points.


    # 3.7 Plateaus and valleys


    Here we describe the shape of the objective function ℱ(a, b) defined by (3.7)
    for typical samples in order to identify possible troubles that iterative algorithms
    may run into. We follow [43].'
