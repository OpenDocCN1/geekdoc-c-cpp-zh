  md: 'from a would be in the direction opposite to \(\nabla\mathscr{G}(\mathbf{a})\),
    where the function \(\mathscr{G}\) decreases most rapidly. This method is called
    the steepest descent. It can be described by a formula

    \[\mathbf{a}^{\prime}=\mathbf{a}-\eta\,\nabla\mathscr{G}(\mathbf{a}),\]

    where \(\eta>0\) is a factor. The choice of \(\eta\) is based on the following
    general considerations.


    # **Choosing the step length.**


    If \(\eta\) is too large, one may “overstep” the region where \(\mathscr{G}\)
    takes small values and land too far. If \(\eta\) is too small, the progress will
    be slow, but at least the function will decrease, i.e., one gets \(\mathscr{G}(\mathbf{a}^{\prime})<\mathscr{G}(\mathbf{a})\).


    The simplest approach is to set \(\eta=1\), compute \(\mathbf{a}^{\prime}\), and
    then check if it is acceptable. If \(\mathscr{G}(\mathbf{a}^{\prime})<\mathscr{G}(\mathbf{a})\),
    the value \(\mathbf{a}^{\prime}\) is accepted, otherwise one backtracks by trying
    smaller values of \(\eta\) (for instance, \(\eta=1/2\), then \(\eta=1/4\), etc.)
    until \(\mathbf{a}^{\prime}\) is acceptable.


    Other (clever but more expensive) methods of adjusting the factor \(\eta\) exist,
    such as golden section, Brent method, various line searches with derivatives;
    we refer the reader to standard books in numerical analysis, such as [151].


    Generally, the steepest descent is a reliable method, but it usually converges
    slowly (at best, linearly).


    # **Newton-Raphson method.**


    If the second derivatives of \(\mathscr{G}\) are available, one can compute both
    the gradient vector and the Hessian matrix of the second order partial derivatives:

    \[\mathbf{D}=\nabla\mathscr{G}(\mathbf{a}) \quad\quad\text{and}\quad\quad\mathbf{H}=\nabla^{2}\mathscr{G}(\mathbf{a})\tag{4.2}\]

    and approximate \(\mathscr{G}\) in a vicinity of \(\mathbf{a}\) by the quadratic
    part of its Taylor polynomial:

    \[\mathscr{G}(\mathbf{a}+\mathbf{h})\approx\mathscr{G}(\mathbf{a})+\mathbf{D}^{T}\mathbf{h}+\tfrac{1}{2}\mathbf{h}^{T}\mathbf{H}\mathbf{h},\tag{4.3}\]

    where \(\mathbf{h}=\mathbf{a}^{\prime}-\mathbf{a}\) denotes the step. Now one
    can choose \(\mathbf{h}\) as the critical point of this quadratic approximation,
    i.e., find \(\mathbf{h}\) by solving

    \[\mathbf{D}+\mathbf{H}\mathbf{h}=0.\tag{4.4}\]

    This is the Newton-Raphson method.


    It converges fast (quadratically) if the current iteration is already close enough
    to the minimum of \(\mathscr{G}\). However, this method may run into various problems.
    First, just as the steepest descent, it may overstep the region where \(\mathscr{G}\)
    takes small values and land too far, then one has to backtrack. Second, the matrix
    \(\mathbf{H}\) may not be positive-definite, then the quadratic approximation
    in (4.3) will not even have a minimum: the solution of (4.4) will be a saddle
    point or a maximum. In that case the quadratic approximation in (4.3) seems to
    be quite useless.


    Fortunately, the least squares problems allow an efficient way to get around the
    last trouble, see the next section.'
