  md: '**Taylor expansions.** The asymptotic properties of the estimates $\hat{A}$,
    $\hat{B}$, $\hat{C}$, to the leading order, can now be obtained easily from those
    of $\hat{\boldsymbol{\theta}}$ by using a Taylor approximation. We demonstrate
    this in the context of the Type A model.


    First, $A = \sin \boldsymbol{\theta}$ and $B = -\cos \boldsymbol{\theta}$, hence
    using Taylor expansion up to the third order terms, we get


    $A = \bar{A} - \bar{B}\, \delta\boldsymbol{\theta} - \frac{1}{2}\,\bar{A}\,(\delta\boldsymbol{\theta})^2
    + \frac{1}{6}\bar{B}\,(\delta\boldsymbol{\theta})^3 + \mathcal{O}\bigl((\delta\boldsymbol{\theta})^4\bigr)$


    $B = \bar{B} + \bar{A}\, \delta\boldsymbol{\theta} - \frac{1}{2}\,\bar{B}\,(\delta\boldsymbol{\theta})^2
    - \frac{1}{6}\bar{A}\,(\delta\boldsymbol{\theta})^3 + \mathcal{O}\bigl((\delta\boldsymbol{\theta})^4\bigr)$.


    **Means and variances of $\hat{A}$ and $\hat{B}$.** Taking mean values (recall
    that $\mathbb{E}(\delta\boldsymbol{\theta}) = \mathbb{E}(\delta\boldsymbol{\theta})^3
    = 0)$ gives


    $\mathbb{E}(\hat{A}) = \hat{A}\biggl[1 - \frac{\boldsymbol{\sigma}^2}{2S}\biggr]
    + \mathcal{O}(\boldsymbol{\sigma}^4)$,


    $\mathbb{E}(\hat{B}) = \hat{B}\biggl[1 - \frac{\boldsymbol{\sigma}^2}{2S}\biggr]
    + \mathcal{O}(\boldsymbol{\sigma}^4)$,


    i.e., the estimates $\hat{A}$ and $\hat{B}$ are biased toward zero. Taking variances
    gives


    $\mathrm{Var}\,\hat{A} = \frac{\boldsymbol{\sigma}^2\hat{B}^2}{S} + \mathcal{O}(\boldsymbol{\sigma}^4)$,


    $\mathrm{Var}\,\hat{B} = \frac{\boldsymbol{\sigma}^2\hat{A}^2}{S} + \mathcal{O}(\boldsymbol{\sigma}^4)$,


    $\mathrm{Cov}(\hat{A}, \hat{B}) = -\frac{\boldsymbol{\sigma}^2\hat{A}\hat{B}}{S}
    + \mathcal{O}(\boldsymbol{\sigma}^4)$.


    Note that the standard deviation of every estimate is $\mathcal{O}(\boldsymbol{\sigma})$,
    while its bias is $\mathcal{O}(\boldsymbol{\sigma}^2)$; hence the bias is of higher
    order of smallness. In other words, the bias is negligible when we, for instance,
    assess the mean squared error of an estimate, say


    $\mathrm{MSE}(\hat{A}) = \mathbb{E}\bigl[\bigl(\hat{A} - \bar{A}\bigr)^2\bigr]
    = \mathrm{Var}(\hat{A}) + \bigl[\mathbb{E}(\hat{A}) - \bar{A}\bigr]^2 = \frac{\boldsymbol{\sigma}^2\hat{B}^2}{S}
    + \mathcal{O}(\boldsymbol{\sigma}^4)$,


    so the bias is simply absorbed by the $\mathcal{O}(\boldsymbol{\sigma}^4)$ term.


    **Mean and variance of $\hat{C}$.** Lastly, by using $\hat{C} = -\hat{A}\bar{x}
    - \hat{B}\bar{y}$ one obtains


    $\mathbb{E}(\hat{C}) = \hat{C}\biggl[1 - \frac{\boldsymbol{\sigma}^2}{2S}\biggr]
    + \mathcal{O}(\boldsymbol{\sigma}^4)$,


    and


    $\mathrm{Var}\,\hat{C} = \boldsymbol{\sigma}^2\biggl[\frac{1}{n} + \frac{\bigl(\hat{A}\bar{y}
    - \hat{B}\bar{x}\bigr)^2}{S}\biggr] + \mathcal{O}(\boldsymbol{\sigma}^4)$.'
