  md: 'Direct geometric argument. We can also demonstrate the noncompactness of the
    space of straight lines in a geometric manner, without referring to any parameterization.


    Let us denote by $\mathfrak{L}$ the space of all lines in $\mathbb{R}^2$. First
    we need to introduce the right topology on $\mathfrak{L}$. We say that a sequence
    of lines $\mathbb{L}_i$ converges to a line $\mathbb{L}$ in the plane $\mathbb{R}^2$
    if for any closed disk $\mathbb{D} \subset \mathbb{R}^2$ we have


    $$\operatorname{dist}_{H}(\mathbb{L}_i \cap \mathbb{D}, \mathbb{L} \cap \mathbb{D})
    \to 0 \quad \text { as } i \rightarrow \infty$$


    where dist$_{H}(\cdot, \cdot)$ is the so-called Hausdorff distance between compact
    subsets of $\mathbb{R}^2$. The latter is computed by the rule


    $$\operatorname{dist}_{H}(E, F)=\max \left\{\max _{x \in E} \operatorname{dist}(x,
    F), \max _{y \in F} \operatorname{dist}(y, E)\right\},$$


    where $E, F \subset \mathbb{R}^2$ are two compact sets.


    Alternatively, one can compactify the plane $\mathbb{R}^{2}$ by mapping it onto
    the Riemann sphere (see details in Section 8.1), so that every line is transformed
    to a circle on the sphere (passing through the north pole), and then use the Hausdorff
    distance between the respective circles. Both constructions yield the same topology,
    which coincides with the topology induced by the parameters $\varphi, \mathcal{C}$
    (i.e., a sequence of lines $\mathbb{L}_{i}=\left(\varphi_{i}, \mathcal{C}_{i}\right)$
    converges to a line $\mathbb{L}=(\varphi, \mathcal{C})$ if and only if $\varphi_{i}
    \rightarrow \varphi$ and $\mathcal{C}_{i} \rightarrow \mathcal{C}$ ).


    Now compact spaces are characterized by the property that every sequence of its
    points contains a convergent subsequence. Hence one can demonstrate the noncompactness
    of the space of lines by producing a sequence of lines which has no convergent
    subsequences. To this end we can take, for example, lines $\mathbb{L}_{i}=\{x=i\}$,
    where $i=1,2,\ldots$


    Existence of a minimum. So everything tells us that our parameter space is not
    compact; hence an additional argument is needed to show the existence of the minimum
    of the objective function. We do this in two steps: first we reduce the space
    $\mathfrak{L}$ to a smaller space $\mathfrak{L}_{0}$, which is compact; second,
    we show that


    $$\inf _{\mathfrak{L}_{0}} \mathscr{F} \leq \inf _{\mathfrak{L}} \mathscr{F},$$


    thus we can restrict our search of the minimum of $\mathscr{F}$ to the subspace
    $\mathfrak{L}_{0}$. Since the set of data points $(x_{i}, y_{i})$ is finite, we
    can enclose them in some rectangle $\mathbb{B}$ (a “bounding box”). In many experiments,
    all data points are naturally confined to a window corresponding to the physical
    size of the measuring device, so the box $\mathbb{B}$ may be known in advance,
    before the data are collected.


    Now if a line $\mathbb{L}$ does not cross the box $\mathbb{B}$, it cannot provide
    a minimum of $\mathscr{F}$, see Fig. 2.2. Indeed, one can just move $\mathbb{L}$
    closer to the box and thus reduce all the distances from the data points to the
    line. We denote by $\mathfrak{L}_{0}$ the space of all lines crossing the box
    $\mathbb{B}$ and restrict our search of the minimum of $\mathscr{F}$ to $\mathfrak{L}_{0}$.'
