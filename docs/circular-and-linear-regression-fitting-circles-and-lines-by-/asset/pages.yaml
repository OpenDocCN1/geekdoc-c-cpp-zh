- pgno: 68
  md: 'The asymptotic behavior of the estimates might then depend on where those new
    points are placed, so certain assumptions on the asymptotic structure of the true
    points are necessary. For example, if the true points tend to cluster near a certain
    center, parameter estimates may have very poor asymptotic properties as $n \rightarrow
    \infty$.


    Furthermore, general statistical theorems that guarantee good asymptotical properties
    of maximum likelihood estimators (MLE), as $n \rightarrow \infty$, will not apply
    in this case, because these theories are not valid when the number of parameters
    changes with $n$. Therefore, the properties of the MLE must be investigated by
    nontraditional methods.


    **Nontraditional (small noise) approach.** Some statisticians prefer a different
    asymptotic model in regression analysis with latent parameters. They keep the
    number of true points, $n$, fixed but consider the limit $\sigma \rightarrow 0$.
    This is called the small-sigma (or small-disturbance) approach introduced in the
    early 1970s by Kadane [91, 92] and later used by Anderson [7] and others¹. This
    model does not require extra assumptions, though the asymptotic properties of
    the estimators may again depend on the (fixed) locations of the true points.


    **Comparative analysis.** Each asymptotic model has advantages and disadvantages.
    The classical model, where $n \rightarrow \infty$ but $\sigma$ is fixed, is perhaps
    more appropriate for applications in econometrics and sociology, where the very
    nature of statistical analysis consists of collecting and processing large samples
    of data, and to increase the accuracy one collects more data. At the same time
    each individual observation (such as the income of a family or the price of a
    house) may not fit the ideal model very well, and there is no way to make all
    (or most of) deviations from the model small.


    The other assumption, where $n$ is fixed but $\sigma \rightarrow 0$, is more appropriate
    for image processing applications. Given an image, there is a limited number of
    points that can be read (scanned) from it. One might suggest that using higher
    resolution produces more data points, but this is not true: increasing resolution
    would just refine the existing data points, rather than produce new ones.


    On the other hand, when points are marked on (or scanned from) an imperfect line
    or oval in an image, they are usually quite close to that line (or oval). Deviations
    are normally caused by technical reasons (an imperfect photograph, imprecise scanning),
    and improving technology allows one to reduce errors substantially, so the limiting
    assumption $\sigma \rightarrow 0$ is quite reasonable. Large deviations are regarded
    as abnormalities and often are eliminated by various methods (including manual
    preprocessing).


    ¹ Anderson [7] remarks that his small-sigma model is equivalent to the one where
    both $n$ and $\sigma > 0$ are held fixed, but instead one homotetically expands
    the set of the true points on the line. While not quite realistic, this picture
    caught imagination and was termed “a fascinating new concept of asymptotic theory,”
    see the discussion after [7], as well as [118].'
