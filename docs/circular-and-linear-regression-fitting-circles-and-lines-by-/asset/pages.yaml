    are plenty of iterative and approximative methods that solve this problem, which
    will be reviewed in the next two chapters.


    Here we do a “reconnaissance:” We see what may cause trouble in practi- cal computations.
    There are three major ways in which conventional iterative procedures may fail
    to find the (global) minimum of a given function $\mathscr{F}$:


    +   (a) they converge to a local minimum of $\mathscr{F}$;


    +   (b) they slow down or stall on a nearly flat plateau or in a valley;


    +   (c) they diverge to infinity if the domain of $\mathscr{F}$ is unbounded.


    Perhaps the option (a) is the most obvious and frequently discussed in the lit-
    erature. In many applications iterative procedures tend to be trapped by local
    minima and return false solutions.


