  md: '# ## Symbols and notation


    Here we describe some notation used throughout the book. First we describe our
    notational system for matrices and vectors:


    +   - $\mathbb{R}$ denotes the set of real numbers (real line), $\mathbb{R}^{n}$
    the $n$-dimensional Euclidean space, and $\mathbb{C}$ the complex plane.


    +   - Matrices are always denoted by capital letters typeset in bold face, such
    as **M** or **U**. The identity matrix is denoted by **I**.


    +   - Vectors are denoted by letters in bold face, either capital or lower case,
    such as **A** or **a**. By default, all vectors are assumed to be column vectors.
    Row vectors are obtained by transposition.


    +   - The superscript $T$ denotes the transpose of a vector or a matrix. For example,
    if **A** is a vector, then it is (by default) a column-vector, and the corresponding
    row-vector is denoted by $\mathbf{A}^{T}$.


    +   - $\operatorname{diag}\left\{a_{1}, a_{2}, \ldots, a_{n}\right\}$ denotes
    a diagonal matrix of size $n \times n$ with diagonal entries $a_{1}, a_{2}, \ldots,
    a_{n}$.


    +   - For any vector and matrix, $\|\mathbf{A}\|$ means its 2-norm, unless otherwise
    stated.


    +   - $\kappa(\mathbf{A}) = \|\mathbf{A}\|\|\mathbf{A}^{-1}\|$ denotes the condition
    number of a square matrix **A** (relative to the 2-norm).


    +   - Equation $\mathbf{A} \mathbf{x} \approx \mathbf{b}$, where **A** is an $n
    \times m$ matrix, $\mathbf{x} \in \mathbb{R}^{m}$ is an unknown vector, and $\mathbf{b}
    \in \mathbb{R}^{n}$ is a known vector ($n > m$), denotes the classical least square
    problem whose solution is $\mathbf{x} = \operatorname{argmin}\|\mathbf{A} \mathbf{x}
    - \mathbf{b}\|^{2}.$


    +   - The singular value decomposition (SVD) of an $n \times m$ matrix **A** is
    denoted by $\mathbf{A} = \mathbf{U} \Sigma \mathbf{V}^{T}$, where **U** and **V**
    are orthogonal matrices of size $n \times n$ and $m \times m$, respectively, and
    $\Sigma$ is a diagonal $n \times m$ matrix whose diagonal entries are real nonnegative
    and come in a decreasing order:


    $\sigma_{1} \geq \sigma_{2} \geq \cdots \geq \sigma_{p}, \quad p = \min \{m, n\}.$


    If $n > m$, then a short SVD is given by $\mathbf{A} = \mathbf{U}^{\prime} \Sigma^{\prime}
    \mathbf{V}^{\prime T}$, where $\mathbf{U}^{\prime}$ consists of the first (left)
    $m$ columns of $\mathbf{U}$ and $\Sigma^{\prime}$ consists of the first (top)
    $m$ rows of $\Sigma$.


    +   - $\mathbf{A}^{-}$ denotes the Moore-Penrose pseudoinverse of a matrix **A**.
    It is given by $\mathbf{A}^{-} = \mathbf{V} \Sigma^{-} \mathbf{U}^{T}$, where
    $\Sigma^{-}$ is a diagonal $m \times n$ matrix whose diagonal entries'
