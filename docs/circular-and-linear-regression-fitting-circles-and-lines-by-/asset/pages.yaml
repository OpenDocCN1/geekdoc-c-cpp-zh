    fit (GRAF), introduced in Section 6.5, is always asymptotically efficient, i.e.,
    its covariance matrix $\mathbf{V}$ attains the lower bound $\mathbf{V}_{\min }$.
    In fact, they showed in [42] that if one uses a general weighted algebraic fit
