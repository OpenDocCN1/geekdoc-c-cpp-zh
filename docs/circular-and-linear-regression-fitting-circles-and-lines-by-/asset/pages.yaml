  md: '(if we still have any) that we deal with a linear problem, it unmasks its truly
    nonlinear character.


    Imagine, for example, the task of projecting a point $\mathscr{X} \in \mathbb{R}^2$
    onto a quadric, say an ellipse $a^2 x^2 + b^2 y^2 = 1$. This is not a simple problem,
    its exact solution involves finding roots of a 4th degree polynomial [162]. In
    a sense, we are lucky that the projection of our data point $\mathscr{X} \in \mathbb{R}^{2n}$
    onto $\mathbb{P}$ reduces to just a quadratic equation (1.15).


    Besides, the projection may not be unique (for example when $\mathscr{X}$ lies
    on the major axis of the ellipse near the center, see Fig. 1.6). We will actually
    see that the orthogonal fitting line may not be unique either, cf. Section 2.3.


    To further emphasize the nonlinear nature of the EIV regression, suppose for a
    moment that the errors are heteroscedastic, i.e.


    ```

    $\delta_i \sim N(0, \sigma^2_{x_i}) \qquad \text{ and } \qquad \varepsilon_i \sim
    N(0, \sigma^2_{y_i})$,

    ```


    where the ratio of variances is known, but it differs from point to point, i.e.,
    we assume that


    ```

    $\kappa_i = \sigma_{x,i} / \sigma_{y,i}$

    ```


    is known for every $i = 1, \dots, n$. Recall that in the classical regression
    the heteroscedasticity of errors does not affect the linear nature of the problem.
    Now, in the EIV model, the best fitting line should minimize


    ```

    $\mathscr{F}(a, b) = \sum_{i=1}^n \frac{(y_i - a - bx_i)^2}{1 + \kappa_i^2 b^2}$,

    ```


    Despite its resemblance to (1.23), the minimization of this $\mathscr{F}$ cannot
    be reduced to a quadratic (or any finite degree) polynomial equation. Here “finite
    degree” means a degree independent of the sample size $n$. This is a hard-core
    nonlinear problem that has no closed form solution; its numerical solution requires
    iterative algorithms.


    In other words, the hidden nonlinear nature of the “linear” EIV fit may come in
    different ways at different stages. The more general assumptions on errors one
    makes the more serious difficulties one faces.


    Yet another explanation why the linear EIV regression has an essentially nonlinear
    character was given by Boggs et al., see [23].


    Overall, the linear EIV model, though superficially resembling the classical linear
    regression, turns out to be dissimilar in many crucial ways. The sharp contrast
    between these two models is now recognized by many authors. As the textbook [29]
    puts it, “Regression with errors in variables (EIV) … is so fundamentally different
    from the simple linear regression … that it is probably best thought of as a completely
    different topic.”'
