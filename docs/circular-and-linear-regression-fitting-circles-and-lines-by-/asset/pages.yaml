    \Theta)\).


    Huber [85, 86, 87] considers more general estimators defined by


    ```

    \begin{equation}\sum_{i=1}^{n} \Psi(\mathbf{x}_i; \Theta) = \mathbf{0} \tag{7.61}\end{equation}

    ```


    This equation is similar to (7.61), but here \(\Psi\) is not necessarily related
    to the likelihood function. He calls (7.61) *M-equation* and its solution *M-estimate*;
    here “M” stands for “maximum likelihood type.” Huber’s main purpose is constructing
    robust estimators (i.e., estimators insensitive to outliers), but as it turns
    out, Huber’s approach can be also used for construction of asymptotically unbiased
    (rather than robust) estimators. We describe it next.


    The M-equation (7.61) is said to be *unbiased* if for every observed point \(\mathbf{x}\)


    ```

    \begin{equation}\mathbb{E}[\Psi(\mathbf{x}; \widehat{\Theta})] = \mathbf{0} \tag{7.62}\end{equation}

    ```


    where \(\widehat{\Theta}\) again denotes the true parameter. (Note that we define
    the unbiasedness of *equation*, not *estimator*.)


    > **Theorem 12 (Huber [86])** *If the M-equation is unbiased, then under certain
    regularity conditions the corresponding M-estimator \(\widehat{\Theta}\) has an
    asymptotically normal distribution. Furthermore, \(n^{1/2}(\widehat{\Theta} -
    \widehat{\Theta})\) converges to a normal law with mean zero. In particular, \(\widehat{\Theta}\)
    is asymptotically unbiased and consistent, in the limit \(n \rightarrow \infty\).*


    We note that the M-estimator obtained from an unbiased M-equation is *not* truly
    unbiased, but its bias vanishes as \(n \rightarrow \infty\).


    Thus in order to obtain an asymptotically unbiased and consistent estimators,
    one needs to modify the M-equation (7.61) defining a given estimator to “unbias”
    it, i.e., to make it satisfy (7.62). This approach has been used in the IV regression
    analysis. In the case of fitting polynomials \(y = \sum_{i=0}^{k} \beta_i x^i\)
    to data, this was done by Chan and Mak [30]. In the case of fitting conics (ellipses,
    hyperbolas), it was done by Kukush, Markovsky, and van Huffel [114, 115, 130,
