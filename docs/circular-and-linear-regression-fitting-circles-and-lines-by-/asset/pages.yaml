  md: '**Final remarks.** We emphasize that the above theorem is very general, the
    “escape valley” exists whether data points are sampled along an incomplete circle
    (a small arc) or along an entire circle. Practically, however, in the latter case
    iterative algorithms are quite safe, as the escape valley lies far away from the
    data set, making it hard to get there.


    On the other hand, for data sampled along a short arc, the escape valley gets
    dangerously close to the data set, so an iterative algorithm can be easily trapped
    in that valley.


    # 3.9 Singular case


    Here we take a closer look at the singular case arising in the circle fitting
    problem (described in Section 3.2), i.e., when the data are sampled along a small
    arc.


    **A word of caution.** This is exactly the case where the conventional iterative
    algorithms are likely to be caught in the wrong (“escape”) valley and diverge.
    This is also the case where the best fitting circle may not even exist, i.e.,
    the best fitting line may “beat” all circles.


    This case must be handled with care. One possible strategy for dealing with the
    singular case is described here; we use the details of the proof of Two Valley
    Theorem given in the previous section.


    **Analytic classification of valleys.** First, we need to to center the coordinate
    system on the centroid of the data $\bar{x},\bar{y}$. In that coordinate system
    $\bar{x}=\bar{y}=0$. Then we align the $x$ axis with the major axis of the scattering
    ellipse, ensuring that $s_{xy}=0$ and $s_{xx}>s_{yy}$. Now the best fitting line
    is the $x$ axis (and on this line the function $\mathcal{F}$ takes value $\mathcal{F}=nf_{0}$,
    cf. (3.19)).


    In this (adjusted) coordinate system, the value


    $\overline{\boldsymbol{x}\boldsymbol{y}}=\frac{1}{n}\sum_{i=1}^{n}\boldsymbol{x}_{i}^{2}\boldsymbol{y}_{i}$


    plays a crucial role; it is the “signature” of the data set. Precisely, we have
    proved the following relations:


    +   (a) if $\overline{\boldsymbol{x}\boldsymbol{y}}>0$, then the center of the
    best fitting circle lies *above the $x$ axis*; the wrong valley lies *below the
    $x$ axis*;


    +   (b) if $\overline{\boldsymbol{x}\boldsymbol{y}}<0$, then the center of the
    best fitting circle lies *below the $x$ axis*; the wrong valley lies *above the
    $x$ axis*.


    These simple rules can be used to choose a safe initial guess for an iterative
    algorithm and help it avoid the wrong valley and direct it properly.


    **A relater issue: when lines beat circles.** Another important corollary of our
    analysis is'
