    # 2.2 Existence and uniqueness


    Before we solve the above minimization problem in the new parameters, let us divert
    our attention to two fundamental theoretical questions: Does the solution always
    exist? Is it always unique?


    **Noncompactness of the parameter space.** Our analysis here will involve mathematical
    concepts of continuity and compactness, which we will engage also in the next
    chapter to treat circles. The reader who is not so familiar with topology may
    go straight to the next section for a practical solution of the least squares
    problem, where the existence and uniqueness issues will be also resolved, in a
    different way.


    The function \(\mathscr{F}\) given by (2.6) is obviously continuous on the corresponding
    parameter space. It is known that continuous functions on compact spaces attain
    their minimum (and maximum) values. If our parameter space *were* compact, this
    would immediately guarantee the existence of the orthogonal fit. But the parameter
    space is *not* compact, as C may take arbitrarily large values.'
