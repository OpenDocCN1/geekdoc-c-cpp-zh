  md: 'We note that these tricks remove most of the bias (i.e., all the terms of order
    $\sigma^2$), but there remain leftover terms of higher order, i.e., $\sigma^4$.
    They may be small, but they do not vanish as $n \to \infty$, thus the resulting
    estimate is not asymptotically unbiased in the large sample limit. Thus, it is
    not consistent either.


    Several adjustments have been developed to ensure consistency as $n \to \infty$.
    One, designed for linear and polynomial EIV regression, is described below.


    # **Adjusted least squares: linear case.** To ensure not only a reduction of the
    bias, but an asymptotical unbiasedness and consistency in the large sample limit,
    one can make appropriate adjustments in the estimating procedure.


    Suppose one fits a straight line $y = \alpha + \beta x$ to the observed points.
    The classical regression estimates (Section 1.1) are obtained by the least squares
    method minimizing


    ```

    $\mathscr{F}(\alpha, \beta) = \frac{1}{n} \sum (y_i - \alpha - \beta x_i)^2$,

    ```


    which reduces to a system of linear equations


    ```

    $\begin{aligned} &\alpha + \beta \bar{x} = \bar{y} \\ &\alpha \bar{x} + \beta
    \bar{x}\bar{x} = \overline{xy}, \end{aligned}$   (6.49)

    ```


    where we use our “sample mean” notation $\bar{x} = \frac{1}{n} \sum x_i,\ \overline{xy}
    = \frac{1}{n} \sum x_i y_i$, etc.


    Now recall that both $x$ and $y$ are observed with errors, i.e., $x_i = \tilde{x}_i
    + \delta_i$ and $y_i = \tilde{y}_i + \epsilon_i$. In the limit $n \to \infty$,
    according to the central limit theorem, we have


    ```

    $\begin{aligned} \bar{x} &= \tilde{x} + \mathscr{O}_P(n^{-1/2}) \\ \bar{y} &=
    \tilde{y} + \mathscr{O}_P(n^{-1/2}) \\ \overline{xy} &= \tilde{x}\tilde{y} + \mathscr{O}_P(n^{-1/2}),
    \end{aligned}$

    ```


    i.e., three random terms in (6.49) converge to their “true” values. But the fourth
    one does not, because


    ```

    $\begin{aligned} \overline{xx} &= \frac{1}{n} \sum (\tilde{x}_i + \delta_i)^2
    \\ &= \frac{1}{n} \sum \tilde{x}_i^2 + \frac{1}{n} \sum \delta_i^2 + \frac{2}{n}
    \sum \tilde{x}_i \delta_i \\ &= \frac{1}{n} \sum \tilde{x}_i^2 + \sigma^2 + \mathscr{O}_P(n^{-1/2}),
    \end{aligned}$

    ```


    where we used the fact $\mathbb{E}(\delta_i^2) = \sigma^2$. That extra term $\sigma^2$
    is the origin of inconsistency and asymptotic biasedness. To eliminate it we adjust
    the system (6.49) as follows:


    ```

    $\begin{aligned} &\alpha + \beta \bar{x} = \bar{y} \\ &\alpha \bar{x} + \beta
    (\overline{xx} - \sigma^2) = \overline{xy}, \end{aligned}$   (6.50)

    ```'
