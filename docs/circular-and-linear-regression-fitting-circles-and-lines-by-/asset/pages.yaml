  md: 'which gives us the objective function


    ```

    $$\mathscr{F}_{\text {RTKD }}(A, B, C)=\sum_{i=1}^{n} \frac{\left[A x_{i}+B x_{i}+C
    y_{i}\right]^{2}}{B^{2}+C^{2}} . \tag{8.28}$$

    ```


    Comparing this to (8.19) we see that the RTKD inversion fit is obtained from the
    proper Riemann fit (which is identical to the Pratt fit) by setting $D=0$. The
    constraint $D=0$ simply forces the fitting circle to pass through the origin.
    Thus, the RTKD inversion fit is nothing but a constrained version of the classical
    Pratt fit, when the latter is reduced to circles passing through the origin.


    # 8.7  The iterative RTKD fit


    Here we describe an iterative procedure developed by Rusu, Tico, Kuosmanen, and
    Delp [159] that is based on their inversion method introduced in the previous
    section, but is capable of fitting circles without prior knowledge of a point
    on the circumference.


    First we observe that the weights $w_{i}=\left(x_{i}^{2}+y_{i}^{2}\right)^{2}$
    for the RTKD fit, cf. (8.25), are small for data points close to the origin (the
    pole); moreover, they vanish at the pole $(0, 0)$. This means that the influence
    of data points near the pole is severely suppressed. If there are several such
    points, then the sample size is effectively reduced, leading to an undesirable
    loss of information. This observation prompts the following considerations.


    **Position of the pole.** The authors of [159] examined how the accuracy of the
    fit depends on the location of the pole on the circle.


    Of course if the data points are samples from the entire circle uniformly, then
    any location is as good as another. So suppose the data points are sampled from
    a small arc $C$ of the true circle. Then the experiments reported in [159] show
    that


    +   * If the pole is placed on the arc $C$ (i.e., close to the data points), then
    the accuracy of the inversion fit is low.


    +   * If the pole is placed outside the arc $C$ (i.e., far from the data points),
    then the accuracy of the inversion fit is good.


    +   * If the pole is placed diametrically opposite to the arc $C$ (i.e., the farthest
    from the data points), then the accuracy of the inversion fit is the best.


    Fig. 8.5 illustrates these conclusions; we refer to [159] for a more detailed
    account on their experimental results.


    **Iterative scheme.** To avoid unfortunate locations of the pole close to the
    data points, the authors of [159] propose the following iterative scheme.


    **Step 1.** Set $k=0$. Suppose an initial pole $P_{0}$ is chosen.'
