    **Speed of convergence.** Many authors assert that the Gauss-Newton method, just
    like its Newton-Raphson prototype, converges quadratically, but this is not exactly
    true. The modification of **H**, however small, does affect the asymptotic speed
    of convergence, and it becomes linear, see [23]. Precisely, if $\mathbf{a}^{*}$
