- pgno: 18
  md: 'The algorithum that produced the estimates (2) is the Levenberg-Marquard geometric
    fit (minimizing the geometric distances from the given points to the circle);
    it is described in Section 4.5. One may naturally want to estimate errors of the
    returned values of the circle parameters, but this is a difficult task for the
    EIV regression problems. In particular, under the standard statistical models
    described in Chapter 6, the estimates of the center and radius of the circle have
    infinite variances and infinite mean values! Thus, the conventional error estimates
    (based on the standard deviations) would be absurdly infinite. An approximate
    error analysis developed in Chapter 7 can be used to assess errors in a more realistic
    way; then the errors of the estimates (2) happen to be $\approx 0.1$.


    We see that the problem of fitting circles and circular arcs to images has a variety
    of applications. It has attracted the attention of scientists, engineers, statisticians,
    and computer programmers. Many good (and not-so-good) algorithms were proposed;
    some to be forgotten and later rediscovered. For example, the Kása algorithm,
    see our Chapter 5, was published independently at least 13 times, the first time
    in 1972 and the last (so far) in 2006, see references in Section 5.1. But, despite
    the popularity of circle fitting applications, until the 1990s publications were
    sporadic and lacked a unified approach.


    An explosion of interest in the problem of fitting circles and other geometric
    shapes to observed points occurred in the 1990s when it became an agenda issue
    for the rapidly growing computer science community, because fitting simple contours
    (lines, circles, ellipses) to digitized images was one of the basic tasks in pattern
    recognition and computer vision. More general curves are often approximated by
    a sequence of segments of lines or circular arcs that are stitched together (“circular
    splines”); see [12, 145, 158, 164, 165].


    Since the early 1990s, many new algorithms (some of them truly brilliant) for
    fitting circles and ellipses have been invented; among those are circle fits using
    the Riemann sphere [123, 175] and conformal maps of the complex plane [159], “direct
    ellipse fit” by Fitzgibbon et al. [61, 63, 147] and Taubin’s eigenfit [176], a
    sophisticated renormalization procedure due to Kanatani [47, 94, 95] and a no
    less superb HEIV method due to Leedan and Meer [48, 49, 120], as well as the Fundamental
    Numerical Scheme by Chojnacki et al. [47, 48]. Chojnacki and his collaborators
    developed a unified approach to several popular algorithms [49] and did a remarkable
    job of explaining the underlying ideas.


    Theoretical investigation also led to prominent accomplishments. These include
    consistent curve and surface fitting algorithms due to Kukush, Markovsky, and
    van Huffel [114, 130, 167], “hyperaccurate” ellipse fitting methods by Kanatani
    [102, 104], and a rather unconventional adaptation of the classical Cramer-Rao
    lower bound to general curve fitting problems [42, 96].


    The progress made in the last 15 years is indeed spectacular, and the total output
    of all these studies is more than enough for a full size book on the subject.
    To the author’s best knowledge, no such book exists yet. The last book'
