  md: 'ways. Here we present a general method that maps the observed points onto the
    Riemann sphere.


    **Extended complex plane.** The complex plane is the regular *xy* plane where
    every point (*x*,*y*) becomes a complex number written as *z* = *x* + *iy*. Complex
    numbers are added and subtracted as 2D vectors


    ```

    *(a* + *ib*) ± (*c* + *id*) = (*a* ± *b*) + *i*(*c* ± *d*)

    ```


    but their multiplication and division use the fact that *i*² = −1:


    ```

    (*a* + *ib*)(*c* + *id*) = (*ac* − *bd*) + *i*(*bc* + *ad*)

    ```


    and


    ```

    *a*+*ib*/*c*+*id* = (*a*+*ib*)(*c*−*id*) / (*c*+*id*)(*c*−*id*) = (*ac*+*bd*)/*c*²+*d*²
    + *i* (*bc*−*ad*) / *c*²+*d*²

    ```


    The latter formula applies whenever *c*² + *d*² ≠ 0, i.e., the divisor *c* + *id*
    must differ from zero.


    It is convenient to add a special point, “infinity” (denoted by ∞), to the complex
    plane, and allow formulas like 1/0 = ∞ and 1/∞ = 0. That extra point makes the
    complex plane compact, in topological sense. More precisely, every sequence *zn*
    = *an* + *ibn* of complex numbers whose absolute values grow, i.e., |*zn*| = sqrt(*an*²
    + *bn*²) → ∞, now converges to that special point ∞.


    The complex plane is denoted by ℂ. The complex plane with the added point ∞ is
    denoted by ℂ̄ = ℂ ∪ {∞}, it is called the *extended complex plane*.


    **Stereographic projection.** One can conveniently map the extended complex plane
    onto a sphere by using stereographic projection illustrated in Fig. 8.1.


    Denote by


    ```

    𝕊 = {(*x*,*y*,*z*) : *x*² + *y*² + (*z* − 1/2)² = 1/4}

    ```


    the sphere in the *xyz* space (whose *xy* coordinate plane is identified with
    the complex plane) of radius *r* = 1/2 centered on the point (0, 0, 1/2). This
    is *Riemann sphere*. It “rests” on the complex plane: its south pole (0, 0, 0)
    is right at the origin of the *xy* plane, and its north pole (0, 0, 1) is right
    above it.


    Now every point (*x*,*y*,0) in the *xy* plane can be joined by a line with the
    north pole of the sphere. This line intersects the sphere in a unique point below
    the north pole. The coordinates of the intersection point are


    ```

    *x*′ = *x*/(1 + *x*² + *y*²)

    *y*′ = *y*/(1 + *x*² + *y*²)

    *z*′ = (*x*² + *y*²)/(1 + *x*² + *y*²).

    ```


    This defines a map from the *xy* plane onto the sphere 𝕊: it takes every point'
