- pgno: 67
  md: 'The other important observation is that the difference \( \hat{\theta} - \tilde{\theta}
    \) has distribution symmetric about zero, i.e.,


    \[ \mathrm{Prob}\{\hat{\theta} - \tilde{\theta} > t\} = \mathrm{Prob}\{\hat{\theta}
    - \tilde{\theta} < t\} \] (2.18)


    for every \( t \in (0, \pi/2) \) (recall that \( \theta \) is a cyclic parameter).
    Indeed, we can assume that \( \hat{\theta} = 0 \), see above. Now positive and
    negative values of the errors \( \delta_i \) are equally likely, hence \( \hat{\theta}
    \) is symmetric about zero.


    *Remark.* As an immediate consequence, we see that the estimator \( \hat{\theta}
    \) is unbiased, i.e., \( \mathbb{E}(\hat{\theta}) = \tilde{\theta} \).


    Now the density function of the estimator \( \hat{\theta} \) can be obtained by
    using (2.16) via the transformation (1.17). The final expression for that density
    is


    \[ \frac{e^{-S/2}}{2^{n-1}\sqrt{\pi}} \sum_{j=0}^{\infty} \frac{\Gamma(n+j)}{\Gamma(\frac{n}{2}+j)}
    \binom{S}{4}^j \sum_{i=0}^j \frac{\Gamma[\frac{i}{2}+1]}{\Gamma[\frac{n+1+j+i}{2}]
    i! (j-i)!} \cos^i 2(\hat{\theta} - \tilde{\theta}), \]


    where it is again assumed, for simplicity, that \( \sigma^2 = 1 \). This density
    formula for \( \hat{\theta} \) is obtained in the 1970s by Anderson and others
    [7, 10].


    **Other estimates.** Now one can easily derive the densities of the estimates
    \( \hat{A} = \cos \hat{\theta} \) and \( \hat{B} = \sin \hat{\theta} \) and the
    slope \( \hat{\beta} = -A/B \), they will be given by similar expressions. We
    do not provide them here because (as Anderson [7] remarked) they are not very
    useful for practical purposes.


    Instead, Anderson [7] and Kunimoto [118] derive various asymptotic formulas for
    the distribution functions of the estimates \( \hat{\theta} \) and \( \hat{\beta}
    \). Those asymptotic expressions were accurate enough to allow Anderson and others
    to obtain (rigorously) asymptotic formulas for the variance of \( \hat{\theta}
    \) (recall that \( \hat{\beta} \) has infinite moments, cf. Section 1.6). Also,
    Patefield [142] verified numerically how good those approximative formulas are,
    and under what conditions they cease to be valid.


    We present those asymptotic results in Section 2.6. We start by introducing various
    asymptotic models popular in the EIV regression analysis.


    # 2.5 Asymptotic models: Large n versus small \(\sigma\)


    The choice of an asymptotic model is an interesting issue itself in regression
    analysis, especially in the context of the functional model.


    **Traditional (large sample) approach.** It is common in statistics to study asymptotic
    properties of estimators as the sample size grows, i.e., as \( n \to \infty \).
    In the functional model, however, there is an obvious difficulty with this approach:
    increasing \( n \) requires introduction of more and more "true" points \( (\tilde{x}_i,
    \tilde{y}_i) \), thus increasing the number of parameters of the model (recall
    that the true points are regarded as "latent" parameters).'
