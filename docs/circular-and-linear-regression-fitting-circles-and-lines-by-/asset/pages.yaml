  md: 'Remark. The restriction on $d_{\mathrm{max}}$ here is a just technicality,
    it is not of a critical importance. If $d_{\mathrm{max}}$ is small, the data points
    cluster together, and in the limit $d_{\mathrm{max}} \rightarrow 0$ they merge
    into a single point. In this case the best fitting circle may have an arbitrarily
    small radius, so that $A$ is unbounded, but practically such situations rarely
    occur and do not cause serious trouble.


    # 3.3 (Non)existence


    As in the previous chapter, we turn to two fundamental theoretical questions:
    Does the best fitting circle always exist? Is it always unique? Strangely enough,
    these issues have not been discussed in the literature until recently. Only in
    the early 2000s have they been resolved, independently, in [43, 138, 196]. The
    answers to the above question happen to be far less straightforward than those
    we found in the case of fitting lines.


    Collinear data case. We begin with a rather unexpected fact: there are data sets
    for which the best fitting circle does not exist! The simplest example is a set
    of $n \geq 3$ collinear data points. No circle can interpolate more than two collinear
    points, so the function $\mathscr{F}$ in (3.1) is strictly positive for any $(a,
    b, R)$. On the other hand, one can approximate the collinear points by a circular
    arc of very large radius and make $\mathscr{F}$ arbitrarily small. Thus the function
    $\mathscr{F}$ does not attain its minimum value. In practical terms, this means
    that for any circular arc fitted to a set of collinear points one can find another
    arc that fits them even better, and that process never stops.


    Clearly, the best fit here is achieved by the line passing through all the data
    points (for that line $\mathscr{F} = 0$). This example suggests that if we want
    to fit circles to observed points we should try lines as well! Then the best fit
    should be chosen between all circles and lines, and the orthogonal least squares
    method may return either a circle or a line depending on the data set (this statement
    is made precise below).


    Another example. Collinear points are not the only example where lines “beat”
    circles. Consider four points: $(X, 0)$, $(-X, 0)$, $(0, 1)$, $(0, -1)$, with
    some large $X \gg 1$. In this case the best fitting line (the $x$ axis) provides
    $\mathscr{F} = 2$, and it can be easily seen that for any circular arc $\mathscr{F}
    > 2$.


    Practical remarks. Admittedly, such examples are quite rare. More precisely, if
    the data are sampled randomly from a continuous distribution, then the probability
    that the orthogonal least squares method returns a line, rather than a circle,
    is zero. This is a mathematical fact, it will be proved in Section 3.9, see Theorem
    8.


    This fact explains why lines are often ignored in practice and one works with
    circles only. On the other hand, if the data points are obtained from a digital
    image (say, one fits circles to pixels on a computer screen), then lines may appear
    with a positive probability and have really to be reckoned with.'
