    ```

    $$4\tilde{A}^{2}\tilde{R}^{2}\tilde{\mathbf{J}}\tilde{\mathbf{M}}\tilde{\mathbf{J}}^{T}
    = n (\mathbf{W}^{T}\mathbf{W})^{-1}.\qquad\qquad(7.50)$$

    ```


