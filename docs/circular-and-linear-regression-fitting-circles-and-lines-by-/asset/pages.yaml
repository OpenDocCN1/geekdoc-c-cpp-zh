  md: 'The method (6.14) is called the gradient weighted algebraic fit, or GRAF for
    brevity.


    # History and implementations of GRAF.


    The GRAF is known since at least 1974 when it was mentioned in Turner''s book
    [183]. It was applied specifically to quadratic curves (ellipses and hyperbolas)
    by Sampson [163] in 1982 and popularized by Taubin [176] in 1991. Now it has become
    standard in the computer vision industry; see [47, 95, 120, 198] and references
    therein.


    If $P(x, y; \Theta)$ is a polynomial in $x$ and $y$ and the parameter vector $\Theta$
    is made by its coefficients (such as in (6.9)), then both numerator and denominator
    in (6.14) are quadratic forms in $\Theta$, i.e.,


    $$\mathscr{F}_3(\Theta) = \frac{\sum_{i=1}^n \Theta^T \mathbf{M}_i \Theta}{\Theta^T
    \mathbf{N}_i \Theta},$$ (6.16)


    where $\mathbf{M}_i$ and $\mathbf{N}_i$ are positive semi-definite matrices computed
    from $(x_i, y_i)$. Note that both numerator and denominator in (6.16) are homogeneous
    quadratic polynomials in the parameters, hence $\mathscr{F}_3(\Theta)$ is invariant
    under rescaling of $\Theta$, so its minimization does not require any additional
    constraints.


    In most cases, the minimization of (6.16) is a nonlinear problem that has no closed
    form solution. There exist several powerful iterative schemes for solving it,
    though, and they will be described in the context of fitting ellipses. In any
    case, the computational cost of GRAF if much lower than that of the geometric
    fit (the MLE), so currently GRAF is the method of choice for practice fitting
    of ellipses or more complex curves.


    The statistical accuracy of GRAF is the same as that of the MLE, to the leading
    order, as we will see in Section 6.9.


    # GRAF for circles.


    The algebraic equation of a circle is

    $$P(x, y; \Theta) = A(x^2 + y^2) + Bx + Cy + D = 0,$$


    hence

    $$\nabla_x P(x, y; \Theta) = (2Ax + B, 2Ay + C)$$

    and

    $$\begin{aligned}\|\nabla_x P(x_i, y_i; \Theta)\|^2 = 4Az_i^2 + 4ABx_i + 4ACy_i
    + B^2 + C^2 \\ = 4A(Az_i + Bx_i + Cy_i + D) + B^2 + C^2 - 4AD.\end{aligned}$$


    Thus the GRAF reduces to the minimization of

    $$\mathscr{F}(A, B, C, D) = \sum_{i=1}^n \frac{[Az_i + Bx_i + Cy_i + D]^2}{4A(Az_i
    + Bx_i + Cy_i + D) + B^2 + C^2 - 4AD}$$ (6.17)


    Just like (6.16), this is a nonlinear problem that can only be solved iteratively.'
