  md: 'It may happen that the polynomial (7.73) has no real roots, which occurs whenever
    $\beta_1^2 < 4\beta_0\beta_2$. Then the quadratic approximation (7.73) is fruitless.
    In that case Kanatani goes back to the first order scheme and applies (7.71).
    Thus $V_{k+1}$ is found by


    ```

    $$V_{k+1} = \begin{cases} \frac{-\beta_1 - \sqrt{\beta_1^2 - 4\beta_0\beta_2}}{2\beta_2}
    & \text{if } \beta_1^2 \ge 4\beta_0\beta_2 \\ V_k + \frac{\hat{\lambda}_{min}(V_k)}{\hat{\mathbf{A}}_k^T
    \mathbf{H} \hat{\mathbf{A}}_k} & \text{otherwise} \end{cases}$$

    ```


    Once $V_{k+1}$ is found, Kanatani computes $\mathbf{A}_{V_{k+1}}$ as the corresponding
    unit eigenvector of the matrix $\mathbf{M}_{unbiased}(V_{k+1})$. These iterations
    continue until they converge. The initial guess is chosen again as $V_0 = 0$.
    Kanatani called this scheme the *second order renormalization method*.


    Kanatani did not prove the convergence of this iterative scheme, but just like
    his first order method it was tested in many experiments by various researchers
    and turned out to be very reliable.


    **Adaptation to circles.** Kanatani''s original work [93, 94, 95] treats general
    quadratic curves (ellipses and hyperbolas). His matrices $\mathbf{M}$ and $\mathbf{H}$
    depend on the parameter vector, hence they needed to be recomputed at every iteration.


    In our case $\mathbf{M}$ and $\mathbf{H}$ are independent of $\mathbf{A}$, and
    then Kanatani''s second order method can be greatly simplified. First, it reduces
    to the *quadratic generalized eigenvalue problem*


    ```

    $$\mathbf{M}\mathbf{A} - \hat{V}\mathbf{H}\mathbf{A} + 8\hat{V}^2\mathbf{I}_1\mathbf{A}
    = \mathbf{0} \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (7.75)$$

    ```


    In other words, $\hat{V}$ is the smallest eigenvalue and $\hat{\mathbf{A}}$ is
    the corresponding eigenvector of the *quadratic pencil* ($\mathbf{M}, \mathbf{H},
    -8\mathbf{I}_1$).


    The quadratic generalized eigenvalue problem (7.75) can be further reduced to
    a linear generalized eigenvalue problem by the following standard scheme, see
    e.g., [46, 47]:


    ```

    $$\begin{bmatrix} \mathbf{M} & -\mathbf{H} \\ \mathbf{0} & \mathbf{I} \end{bmatrix}
    \begin{bmatrix} \mathbf{A} \\ \mathbf{B} \end{bmatrix} = \hat{V} \begin{bmatrix}
    \mathbf{0} & -8\mathbf{I}_1 \\ \mathbf{I} & \mathbf{0} \end{bmatrix} \begin{bmatrix}
    \mathbf{A} \\ \mathbf{B} \end{bmatrix}, \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (7.76)$$

    ```


    where $\mathbf{I}$ is the $4 \times 4$ identity matrix. Note that the second line
    enforces $\mathbf{B} = \hat{V}\mathbf{A}$. (This scheme is similar to a standard
    reduction of a second order differential equation $y'''' = f(x, y, y'')$ to a
    first order system of equations $z'' = f(x, y, z)$ and $y'' = z$.)


    It is now tempting to solve the linear generalized eigenvalue problem (7.76) by
    using a standard matrix algebra software, for example by calling the function
    "eig" in MATLAB. We found, however, that the "eig" function tends to fail on (7.76)
    quite frequently (in 10 to 20% of simulated cases). The cause of failure is that
    the linear generalized eigenvalue problem (7.76) is *singular*; in fact, the double
    size ($8 \times 8$) matrix on the right-hand side of (7.76) has rank 5.'
