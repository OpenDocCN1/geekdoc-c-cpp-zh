    **An auxiliary formula.** Next you need a useful fact. Suppose a point $(x_{0},y_{0})$
    lies on the true circle $(\tilde{a},\tilde{b},\tilde{R})$, i.e.


    ```

    $$(x_{0}-\tilde{a})^{2}+(y_{0}-\tilde{b})^{2}=\tilde{R}^{2}\,,$

    ```


    In accordance with our early notation we denote $z_{0} = x_{0}^{2} + y_{0}^{2}$
    and $\mathbf{X}_{0} = (z_{0},x_{0},y_{0},1)^{T}$. We also put $u_{0} = (x_{0}-\tilde{a})/\tilde{R}$
    and $v_{0} = (y_{0}-\tilde{b})/\tilde{R}$, and consider the vector $\mathbf{Y}_{0}
    = (u_{0},v_{0},1)^{T}$. The following formula will be useful:


    ```

    $$2\tilde{A}\tilde{R}\tilde{\mathbf{M}}\tilde{\mathbf{X}}_{0} = -n (\mathbf{W}^{T}\mathbf{W})^{-1}
    \mathbf{Y}_{0},\qquad\qquad(7.49)$$

    ```


    where the matrix $(\mathbf{W}^{T}\mathbf{W})^{-1}$ appears in (7.9) and the matrix
    $\tilde{\mathbf{M}}$ appears in (7.29). The identity (7.49) is easy to verify
    directly for the unit circle $\tilde{a}=\tilde{b}=0$ and $\tilde{R}=1$, and then
    one can check that it remains valid under translations and similarities.


    Equation (7.49) implies that for every true point $(\tilde{x}_{i},\tilde{y}_{i})$


    ```

    $$4\tilde{A}^{2}\tilde{R}^{2}\tilde{\mathbf{J}}\tilde{\mathbf{M}}\tilde{\mathbf{X}}_{i}\tilde{\mathbf{X}}_{i}^{T}\tilde{\mathbf{M}}\tilde{\mathbf{J}}^{T}
    = n^{2} (\mathbf{W}^{T}\mathbf{W})^{-1}\mathbf{Y}_{i}\mathbf{Y}_{i}^{T} (\mathbf{W}^{T}\mathbf{W})^{-1},$$

    ```


    where $\mathbf{Y}_{i} = (\tilde{u}_{i},\tilde{v}_{i},1)^{T}$ denote the columns
