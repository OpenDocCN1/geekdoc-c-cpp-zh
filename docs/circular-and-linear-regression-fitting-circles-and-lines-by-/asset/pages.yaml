    Down to more practical issues, the estimates of parameters in nonlinear EIV regression
    cannot be found in closed form, by explicit formulas like (1.16). They can only
    be computed by numerical algorithms, i.e., approximately. Num- erical schemes,
    at best, converge to the desired estimate iteratively. However, in practice, the
    iterations may very well diverge, and even if they do converge, one never knows
