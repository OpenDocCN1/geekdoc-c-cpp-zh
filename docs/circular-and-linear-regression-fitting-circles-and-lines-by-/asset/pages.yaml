    **Three algebraic parameters.** These are compelling reasons to use an alternative
    equation of a line:


    $$Ax + By + C = 0.\tag{2.1}$$


    An additional restriction $A^{2}+B^{2}>0$ must be applied, as otherwise $A=B=0$
    and (2.1) would describe an empty set if $C \neq 0$, or the entire plane if $C=0$.


    Equation (2.1) represents all geometric lines in the plane, including vertical
    $(B=0)$ and horizontal $(A=0)$. Also, it allows us to keep the values $A, B, C$
    bounded, as we will prove in the next section. This also ensures finiteness of
    the moments of the estimates of the parameters, and helps to secure numerical
    stability in practical computations.


    **Constraints.** A little problem is a multiple representation: each line corresponds
    to infinitely many parameter vectors $(A, B, C)$, which are, obviously, all proportional
    to each other. This multiplicity can be eliminated by imposing a constraint


    $$A^{2}+B^{2}+C^{2}=1,\tag{2.2}$$


    or another constraint


    $$A^{2}+B^{2}=1.\tag{2.3}$$


    The former is used, e.g., in [93, 95], and the latter in [83, 143]. The constraint
    (2.3) is a bit better, as it automatically enforces the restriction $A^{2}+B^{2}>0$,
    see above. Besides, it allows clear geometric interpretation of the parameter
    space, see next. So we use (2.3) in what follows.


