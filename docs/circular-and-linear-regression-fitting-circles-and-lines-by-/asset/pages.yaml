    # ### 3.1 Introduction


    **Variety of applications.** The need of fitting circles or circular arcs to observed
    points arises in many areas. In medicine, one estimates the diameter of a human
    iris on a photograph [141] or designs a dental arch from an X-ray [21]. Archaeologists
    examine the circular shape of ancient Greek stadia [157] and mysterious megalithic
    sites (stone rings) in Britain [65, 177]; in other studies they determine the
    size of ancient pottery by analyzing potsherds found in field expeditions [44,
    80, 81, 190]. In industry, quality control requires estimation of the radius and
    the center of manufactured mechanical parts [119] (other interesting applications
    involve microwave engineering [54, 169] and the lumber industry [13]).


    In nuclear physics, one deals with elementary particles born in an accelerator
    — they move along circular arcs in a constant magnetic field; physicists determine
    the energy of the particle by measuring the radius of its trajectory; to this
    end experimenters fit an arc to the trace of the electrical signals the particle
    leaves in special detectors [53, 45, 106]. In mobile robotics, one detects round
    objects (pillars, tree trunks) by analyzing range readings from a 2D laser range'
