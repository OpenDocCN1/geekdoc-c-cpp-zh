    values as σ → 0. Moreover, the Pratt fit is asymptotically efficient (optimal)
    in that limit; see Chapter 7.


    **Invariance under translations and rotations.** Next we verify that the Pratt
    fit is invariant under translations and rotations. This fact is less obvious than
    a similar invariance of geometric fitting algorithms (established in Section 4.11)
    or the Kása method (Section 5.2), as the Pratt procedure is defined algebraically;
    thus we provide a detailed proof, following Taubin [176].


    Let us apply a translation


    ```

    $$\mathcal{T}_{c,d} : (x,y) \mapsto (x+c, y+d)$$

    ```


    by vector (c, d) to the data point coordinates. Then the data matrix **X** will
    be transformed to


    ```

    $$\mathbf{X}_{\text{new}}=\begin{bmatrix}\left(x_{1}+c\right)^{2}+\left(y_{1}+d\right)^{2}
    & x_{1}+c & y_{1}+d & 1 \\ \ddots & \ddots & \ddots & \ddots \\ \left(x_{n}+c\right)^{2}+\left(y_{n}+d\right)^{2}
    & x_{n}+c & y_{n}+c & 1 \end{bmatrix}. $$

    ```


    We can express this new data matrix as


    ```

    $$\mathbf{X}_{\text{new}}=\mathbf{X F},\tag{5.33}$$

    ```


    where


    ```

    $$\mathbf{F}=\begin{bmatrix}1&0&0&0\\2c&1&0&0\\2d&0&1&0\\c^{2}+d^{2}&c&d&1\end{bmatrix}.\tag{5.34}$$

    ```


    Observe also that


    ```

    $$\mathbf{B}=\mathbf{F}^{T}\mathbf{B F}\tag{5.35}$$

    ```


    Thus in the new coordinates the characteristic equation (5.28) takes form


    ```

    $$\mathbf{F}^{T}\left(\mathbf{X}^{T}\mathbf{X}\right)\mathbf{F}\mathbf{A}_{\text{new}}-\eta_{\text{new}}\mathbf{F}^{T}\mathbf{B
    F}\mathbf{A}_{\text{new}}=\mathbf{0} .$$

    ```


    Premultiplying by $\mathbf{F}^{-T}$ and comparing to (5.28) we conclude that $\eta_{\text{new}}=\eta$
