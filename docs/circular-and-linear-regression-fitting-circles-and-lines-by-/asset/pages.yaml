    3. For the current $\mathbf{a}_k$ and $\Delta_k$, determine $\lambda_k$.

    4. Compute $\mathbf{h}_k$ by solving equation $(\mathbf{J}_k^T \mathbf{J}_k +
    \lambda_k \mathbf{I})\mathbf{h}_k = -\mathbf{J}_k^T \mathbf{g}_k$.

    5. Find the ratio $r_k = \mathrm{Ared}_k/\mathrm{Pred}_k$.

    6. If $r_k < 0$, reset $\Delta_k := \frac{1}{2}\Delta_k$ and return to Step 3.

    7. If $r_k < 0.25$, update $\Delta_{k+1} = \frac{1}{2}\Delta_k$; if $r > 0.75$,
    update $\Delta_{k+1} = 2\Delta_k$.

    8. Update $\mathbf{a}_{k+1} = \mathbf{a}_k + \mathbf{h}_k$, increment $k$, and
    return to Step 2.


    Table 4.2: Trust region algorithm.


    **New updating rules.** This interpretation of $\Delta$ also leads to the following
    update strategy. After a step $\mathbf{h}$ is computed, one finds the ratio


    $$r = \frac{\mathrm{Ared}}{\mathrm{Pred}} = \frac{\mathscr{G}(\mathbf{a}) - \mathscr{G}(\mathbf{a}+\mathbf{h})}{\mathscr{G}(\mathbf{a})
    - \mathscr{Q}(\mathbf{a}+\mathbf{h})}$$


    of the *Actual reduction*, $\mathrm{Ared}$, and the *Predicted reduction*, $\mathrm{Pred}$,
    of the objective function. One should note that $\mathscr{G}(\mathbf{a}) = \mathscr{Q}(\mathbf{a})$,
    hence the denominator is always positive, but the numerator is positive only if
    the actual reduction occurs, in which case of course we should accept the step
    $\mathbf{h}$.


    However, we adjust $\Delta$ based on the value of $r$. A common strategy is as
    follows. If $r < 0.25$, then the quadratic approximation is not deemed quite reliable
    (despite the actual decrease of the objective function) and we *reduce* the size
    $\Delta$ before the next iteration (say, by $\Delta := \Delta/2$). Only if $r
    > 0.75$, then the approximation is regarded as sufficiently accurate and we *increase*
    $\Delta$ (by $\Delta := 2\Delta$). In the intermediate case $0.25 \le r \le 0.75$
    we leave $\Delta$ *unchanged*. Note that these rules are quite different (in a
    sense, more conservative) than the simplistic rules of updating $\lambda$ in the
    previous section!


    **The subproblem.** We summarize the main steps of the trust region scheme in
    Table 4.2. An attentive reader should notice that we have yet to specify Step
    3. This is known as the *trust region subproblem*: Given the size $\Delta > 0$
    of the trust region around the current approximation $\mathbf{a}$, determine the
    corresponding parameter $\lambda \ge 0$. There is a variety of solutions of this
