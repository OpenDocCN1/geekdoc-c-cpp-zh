    \mathbf{X}, \mathbf{B}\right)$. As the matrix $\mathbf{B}$ is invertible, we can
    rewrite (5.28) as


    $\mathbf{B}^{-1} (\mathbf{X}^{T} \mathbf{X}) \mathbf{A} - \eta \mathbf{A} = \mathbf{0},
    \quad (5.29)$


