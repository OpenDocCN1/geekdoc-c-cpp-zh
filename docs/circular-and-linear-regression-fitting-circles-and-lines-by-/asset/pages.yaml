    proof, which is quite complex.


    Analysis of the order of magnitude. We make a natural assumption that the estimate
    $\hat{\Theta}$ is balanced in the sense that every observation $\mathbf{x}_i$
    contributes to it equally. More precisely, the partial derivatives of $\hat{\Theta}(\mathbf{X})$
    with respect to the components of $\mathbf{X}$ must have the same order of magnitude.


    For example, all our circle fits are balanced, in this sense, as they are based
    on averaging observations. In particular, the geometric circle fit minimizes $a^2
    + b^2 - r^2$, recall (4.25). The Kåsa fit solves the system (5.5) that involve
    averages, too.


