    the circle parameters from the angular parameters and conduct the minimization
    of $\mathscr{F}$ alternatively with respect to $(a, b, R)$ and with respect to
    $(\varphi_{1}, \ldots, \varphi_{n})$. If we fix the angular parameters $(\varphi_{1},
    \ldots, \varphi_{n})$, the function $\mathscr{F}$ will be a quadratic polynomial
