  md: 'imply that the estimate is totally unreliable? Why did not anybody notice these
    bad features in practice? Can an estimate with infinite moments be practically
    better than others which have finite moments? These questions lead to further
    studies, see next.


    In the late 1970s, Anderson [7, 8], Patefield [142], and Kunitomo [118] compared
    the slope $\hat{\beta}$ of the orthogonal fitting line, given by (1.16), with
    the slope $\hat{\beta}$ of the classical regression line, given by (1.3) (of course,
    both estimates were used in the framework of the same model (1.9), (1.10), and
    (1.11)). They denote the former by $\hat{\beta}_M$ (Maximum likelihood) and the
    latter by $\hat{\beta}_L$ (Least squares). Their results can be summarized in
    two seemingly conflicting verdicts:


    +   (a) The mean squared error of $\hat{\beta}_M$ is infinite, and that of $\hat{\beta}_L$
    is finite (whenever $n \geq 4$), thus $\hat{\beta}_L$ appears (infinitely!) more
    accurate;

    (b) The estimate $\hat{\beta}_M$ is consistent and asymptotically unbiased, while
    $\hat{\beta}_L$ is inconsistent and asymptotically biased (it is consistent and
    unbiased only in the special case $\beta = 0$), thus $\hat{\beta}_M$ appears more
    appropriate.


    Going further, Anderson shows that


    $\text{Prob}\{|\hat{\beta}_M - \beta| > t\} < \text{Prob}\{|\hat{\beta}_L - \beta|
    > t\}$


    for all $t > 0$ that are not too large, i.e., for all $t > 0$ of practical interest.
    In other words, the accuracy of $\hat{\beta}_M$ dominates that of $\hat{\beta}_L$
    everywhere, except for very large deviations (large $t$). It is the heavy tails
    of $\hat{\beta}_M$ that make its mean squared error infinite, otherwise it tends
    to be closer to $\beta$ than its rival $\hat{\beta}_L$.


    ![](img/86db288e3c266985d1648282179ae4b5_50_0.png)


    Furthermore, when one observes values of $\hat{\beta}_M$ in practice, or in simulated
    experiments, nothing indicates that $\hat{\beta}_M$ has infinite moments; its
    values group around a certain center and have a seemingly normal distribution.
    Large deviations occur so rarely that they usually pass unregistered. However,
    those large deviations are, ultimately, responsible for the lack of moments. In
    order to make them visible, i.e., have them appear at a noticeable rate in computer'
