    \hat{\Theta} \|$, thus $\| \nabla_{\mathbf{x}} \hat{\Theta} \| \leq n^{-1/2}$,
    i.e., each component of $\nabla_{\mathbf{x}} \hat{\Theta}$ must be $\mathcal{O}(1/n)$.


