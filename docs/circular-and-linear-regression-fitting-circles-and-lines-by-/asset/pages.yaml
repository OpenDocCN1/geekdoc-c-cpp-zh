    # ## 2.8 Finite-size efficiency


    In this last section we discuss the efficiency of the parameter estimators. There
    are various approaches to this issue in the context of orthogonal (and more generally,
    EIV) regression.


    **Two approaches.** First, one can directly compute the classical Cramer-Rao lower
    bound and compare it to the actual variances of the parameter estimators. We do
    this below. As it happens, the maximum likelihood estimates are not exactly optimal,
    but their efficiency is close to 100% in various senses.


    Second, one may try to prove that the estimators are asymptotically efficient,
    in the context of the Type A model or the Type B model. There are, indeed, general
    results in this direction; we discuss them as well.


    **Cramer-Rao for finite samples.** We start with the classical Cramer-Rao lower
    bound; our analysis is an adaptation of [128] (pp. 402–403). We work in the context
    of the functional model (Section 2.4) with $n+2$ independent parameters: two principal
    parameters ($\theta$ and $C$) for the line and one “latent” parameter per each
    true point. We can describe the line by parametric equations


    ```

    $x=-C \sin \theta+t \cos \theta \quad y=C \cos \theta+t \sin \theta,$

    ```


    where $t$ is a scalar parameter, and specify the coordinates of the true points
    by


    ```

    $\bar{x}_i=-C \sin \theta+t_i \cos \theta, \quad \bar{y}_i=C \cos \theta+t_i \sin
    \theta.$

    ```


    Thus $t_1,\dots,t_n$ play the role of the (latent) parameters of the model.'
