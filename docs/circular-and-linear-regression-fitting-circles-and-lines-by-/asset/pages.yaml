    $\mathbf{B} = \begin{bmatrix} 0 & 0 & 0 & -2 \\ 0 & 1 & 0 & 0 \\ 0 & 0 & 1 & 0
    \\ -2 & 0 & 0 & 0 \end{bmatrix} . \quad (5.27)$


    Now introducing a Lagrange multiplier $\eta$ we minimize the function


    $\mathscr{G}(\mathbf{A}, \eta) = \mathbf{A}^{T} (\mathbf{X}^{T} \mathbf{X}) \mathbf{A}
    - \eta (\mathbf{A}^{T} \mathbf{B} \mathbf{A} - 1) .$


    Differentiating with respect to $\mathbf{A}$ gives the first order necessary condition


    $(\mathbf{X}^{T} \mathbf{X}) \mathbf{A} - \eta \mathbf{B} \mathbf{A} = \mathbf{0},
    \quad (5.28)$


