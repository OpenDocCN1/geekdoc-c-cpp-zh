    \ Kanatani arrived at the estimator (7.65)–(7.67); thus his method (theoretically)\
    \ coincides with that of Kukush, Markovsky, and van Huffel.\n\nKanatani did not\
    \ prove that the solution $\\hat{V}$ of the problem (7.65)–(7.66) existed or was\
    \ unique, but he proposed to solve the problem (7.65)–(7.66) by a relatively fast\
    \ iterative scheme that he called renormalization method. In fact, he designed\
    \ two versions of that method, we describe them next.\n\n**First order renormalization.**\
    \ In one (simpler) version, Kanatani drops the second order term $8V^2\\mathbf{I}_1$\
    \ from (7.65) and solves a reduced problem: find $V$ such that the matrix\n\n\
    ```\n$$\\mathbf{M}_{\\text{unbiased,1}}(V) = \\mathbf{M} - V\\mathbf{H}$$\n```\n\
    \nis positive semi-definite and singular. Then he computes $\\hat{\\mathbf{A}}$\
    \ as the eigenvector of this matrix corresponding to its zero eigenvalue.\n\n\
    Such an approximation still leads to an estimator $\\hat{\\mathbf{A}}$ with no\
    \ essential bias, but $\\hat{\\mathbf{A}}$ is no longer consistent, cf. Remark\
    \ in Section 7.9. (As consistency was not Kanatani’s concern, the approximation\
    \ (7.69) was legitimate for his purpose of reducing bias.)\n\nThen Kanatani rewrites\
    \ (7.69) as\n\n```\n$$\\mathbf{M}_{\\text{unbiased,1}}(V)\\mathbf{A}_V = \\mathbf{M}\\\
    mathbf{A}_V - V\\mathbf{H}\\mathbf{A}_V = \\lambda_{\\min}(V)\\mathbf{A}_V, \\\
    quad (7.69)$$\n```\n\nwhere $\\lambda_{\\min}(V)$ is the minimal eigenvalue of\
    \ $\\mathbf{M}_{\\text{unbiased,1}}(V)$ and $\\mathbf{A}_V$ the corresponding\
    \ unit eigenvector. Premultiplying by $\\mathbf{A}_V^T$ gives\n\n```\n$$\\mathbf{A}_V^T\\\
    mathbf{M}_{\\text{unbiased,1}}(V)\\mathbf{A}_V = \\mathbf{A}_V^T\\mathbf{M}\\\
    mathbf{A}_V - V\\mathbf{A}_V^T\\mathbf{H}\\mathbf{A}_V = \\lambda_{\\min}(V).\
    \ \\quad (7.70)$$\n```\n\nNow our goal is to solve equation $\\lambda_{\\min}(V)\
    \ = 0$, i.e., find a zero of the above function. It is a nonlinear function of\
    \ $V$, and Kanatani proposes to approximate its derivative by fixing the vector\
    \ $\\mathbf{A}_V$, which gives\n\n```\n$$\\lambda_{\\min}^{\\prime}(V) \\approx\
    \ -\\mathbf{A}_V^T\\mathbf{H}\\mathbf{A}_V.$$ \n```\n\nThen Kanatani applies the\
    \ standard Newton method: given a current approximation $V_k$ to $\\hat{V}$, he\
    \ finds the next one by\n\n```\n$$V_{k+1} = V_k + \\frac{\\lambda_{\\min}(V_k)}{\\\
    mathbf{A}_V^T\\mathbf{H}\\mathbf{A}_V}, \\quad (7.71)$$\n```\n\nthen he computes\
    \ $\\mathbf{A}_{V_{k+1}}$ as the corresponding unit eigenvector of $\\mathbf{M}_{\\\
