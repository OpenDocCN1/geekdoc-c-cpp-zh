  md: '# **1.6** Statistical properties of the orthogonal fit


    Our book is devoted to the orthogonal fitting problem, and from now on we adopt
    the statistical model assumptions (1.9), (1.10), and (1.11). Under these assumptions
    the orthogonal fit maximizes the likelihood function, i.e., provides the Maximum
    Likelihood Estimate (a formal proof of this fact will be given in Section 6.3).


    In this section we touch upon the basic statistical properties of the linear orthogonal
    fit, i.e., the behavior of the estimates $\hat{\alpha}$ and $\hat{\beta}$ of the
    parameters of the fitting line $y=\alpha+\beta x$ (we use $\alpha$ and $\beta$
    here, instead of the previous $a$ and $b$, to be consistent with the notation
    in the papers we will refer to).


    Our discussion will shed more light on a stark dissimilarity between the orthogonal
    fit and the classical regression, whose nice features we mentioned in Section
    1.1. Even a quick look reveals a totally different (and somewhat shocking) picture.


    To begin with, the distribution of the estimates $\hat{\alpha}$ and $\hat{\beta}$
    is not normal and does not belong to any standard family of probability distributions.
    Only in 1976, explicit formulas for their density functions were found by Anderson
    and others [7, 10]; see Section 2.4. Those expressions are overly complicated,
    involve double-infinite series, and Anderson [7] promptly conceded that they are
    not very useful for practical purposes. Instead, he and Kunitomo [118] derived
    various approximations to the distribution functions of $\hat{\alpha}$ and $\hat{\beta}$,
    which turned out to be practically accurate.


    Second, and worse, the estimates $\hat{\alpha}$ and $\hat{\beta}$ do not have
    finite moments, i.e.,


    $\mathbb{E}(|\hat{\alpha}|)=\infty \quad \text{and} \quad \mathbb{E}(|\hat{\beta}|)=\infty.$


    Thus they also have infinite mean squared errors:


    $\mathbb{E}((\hat{\alpha}-\alpha)^2)=\infty \quad \text{and} \quad \mathbb{E}((\hat{\beta}-\beta)^2)=\infty.$


    These stunning facts were also revealed in 1976 by Anderson [7]. Intuitively,
    one can see why this happens from (1.16), where the denominator can take value
    zero, and its probability density does not vanish at zero. We encourage the reader
    to closely examine this observation.


    Until Anderson’s discovery, researchers “approximated” the moments of the estimates
    $\hat{\alpha}$ and $\hat{\beta}$ as follows. They employed Taylor expansion, dropped
    higher order terms, and obtained some “approximate” formulas for the moments of
    $\hat{\alpha}$ and $\hat{\beta}$ (including their means and variances). Anderson
    demonstrated that all those formulas were fundamentally flawed, as the actual
    moments did not exist. Anderson said that those formulas should be regarded as
    “moments of some approximations,” rather than “approximate moments.”


    Once Anderson made his discovery, it immediately lead to fundamental methodological
    questions: how can one trust a statistical estimate that has an infinite mean
    squared error (not to mention infinite bias)? Should these facts'
  merge: -1
