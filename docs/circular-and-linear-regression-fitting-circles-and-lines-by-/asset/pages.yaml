  md: 'First we compare the Pratt and Taubin fits. For the Pratt fit, the constraint
    matrix is **N** = **Ñ** = **P**, hence its essential bias (7.36) becomes


    ```

    $$\mathbb{E}(\Delta_{2}\mathbf{A}_{\text{Pratt}}) \stackrel{\mathrm{ess}}{=} -4\sigma^{2}\vec{A}\,[0,0,0,1]^{T}
    . \tag{7.42}$$

    ```


    In other words, the Pratt constraint **N** = **P** cancels the first term in (7.41);
    it leaves the second term intact.


    For the Taubin fit, the constraint matrix is **N** = **T** and its “true” value
    is **Ñ** = **T̃** = $\frac{1}{n}\sum \tilde{\mathbf{T}}_{i}$. Hence the Taubin’s
    bias is


    ```

    $$\mathbb{E}(\Delta_{2}\mathbf{A}_{\text{Taubin}}) \stackrel{\mathrm{ess}}{=}
    -2\sigma^{2}\vec{A}\,[0,0,0,1]^{T} . \tag{7.43}$$

    ```


    Thus, the Taubin constraint **N** = **T** cancels the first term in (7.41) *and*
    a half of the second term; it leaves only a half of the second term in place.


    As a result, the Taubin fit’s essential bias is twice as small as that of the
    Pratt fit. Given that their main terms (variances) are equal, we see that the
    Taubin fit is statistically more accurate than that of Pratt; this difference
    might explain a slightly better performance of the Taubin fit, compared to Pratt,
    observed in our experiments in Chapter 5.


    In his original paper [176] in 1991, Taubin expressed the intention to compare
    his method to that of Pratt, but no such comparison was published. We believe
    our analysis presents such a comparison.


    # **Eliminating the essential bias.**


    Interestingly, one can design an algebraic fit that has no essential bias at all.
    Let us set the constraint matrix to


    ```

    $$\mathbf{N} = \mathbf{H} = 2\mathbf{T} - \mathbf{P} = \left[ \begin{array}{rrrr}
    8\bar{z} & 4\bar{x} & 4\bar{y} & 2 \\ 4\bar{x} & 1 & 0 & 0 \\ 4\bar{y} & 0 & 1
    & 0 \\ 2 & 0 & 0 & 0 \end{array} \right] . \tag{7.44}$$

    ```


    Then one can see that all the terms in (7.36) cancel out! The resulting essential
    bias vanishes:


    ```

    $$\mathbb{E}(\Delta_{2}\mathbf{A}_{\text{Hyper}}) \stackrel{\mathrm{ess}}{=} 0
    . \tag{7.45}$$

    ```


    We call this fit *hyperaccurate*, or “Hyper” for short. The term *hyperaccuracy*
    was introduced by Kanatani [102, 103, 104] who was first to employ Taylor expansion
    up to the terms of order $\sigma^{4}$ for the purpose of comparing various algebraic
    fits and designing better fits (he treated more general quadratic models than
    circles).


    The Hyper fit for circles is proposed in [4].


    We note that the matrix **H** is not singular, three of its eigenvalues are positive
    and one is negative (these facts can be easily derived from the following simple
    observations: det **H** = −4, trace **H** = 8z̄ + 2 > 1, and $\lambda = 1$ is
    one of its eigenvalues). If **M** is positive definite, then by Sylvester’s law
    of inertia the matrix $\mathbf{H}^{-1}\mathbf{M}$ has the same signature as **H**
    does, i.e., the eigenvalues $\eta$ of $\mathbf{H}^{-1}\mathbf{M}$'
