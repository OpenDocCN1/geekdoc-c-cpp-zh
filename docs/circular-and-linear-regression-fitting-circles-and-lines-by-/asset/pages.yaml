    may no longer be negligible and may have to be reckoned with. For instance, a
    simple configuration of 4 pixels making a $2 \times 2$ square satisfies (2.14),
    and thus the orthogonal fitting line is not uniquely defined.


    Another interesting exception occurs when the matrix **S** is singular. In that
    case 0 is its eigenvalue, and so $\mathscr{F}(A,B)=0$, which means a “perfect
    fit,” or “interpolation” (the data points are collinear). Thus we see that the
    criterion of collinearity is


    $\det \mathbf{S} = s_{xx} s_{yy} - s_{xy}^2 = 0.$


    # 2.4 Error analysis: Exact results


    No statistical estimation is complete without error analysis, whose main purpose
    is to determine the probability distribution and basic characteristics (such as
    the mean value and variance) of the respective estimators.


    **Linear functional model.** In order to analyze our estimators $\hat{A}$, $\hat{B}$,
    $\hat{C}$, and $\hat{\theta}$, we need to adopt a statistical model. We recall
    the one described in Section 1.2. Namely, we suppose there is a true (but unknown)
    line


    $\tilde{A}x + \tilde{B}y + \tilde{C} = 0$


    with $\tilde{A}^2 + \tilde{B}^2 = 1$ and $n$ true (but unknown) points $(\tilde{x}_1,
    \tilde{y}_1), \dots (\tilde{x}_n, \tilde{y}_n)$ on it. Since the true points lie
    on the true line, we have


    $\tilde{A}\tilde{x}_i + \tilde{B}\tilde{y}_i + \tilde{C} = 0, \quad i = 1, \dots,
    n.$'
