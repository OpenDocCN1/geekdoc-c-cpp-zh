    Sadly, things do get worse when one has to fit nonlinear functions to data with
    errors in variables. We only overview some new troubles here. First of all, the
    nonlinear fitting problem may not even have a solution. More precisely, if one
    fits a curve of a certain type (say, a circle) by minimizing the orthogonal distances
    to the data points, then such a curve may not exist; we will see examples in Section
    3.3. The nonexistence is a phenomenon specific to nonlinear problems only. Next,
    even if the best fitting curve exists, it may not be unique, there may be multiple
    solutions, all of which are “equally good,” see examples in Section 3.5. This
    leads to confusion in theoretical analysis.


    Furthermore, even when the best fit exists and is unique, nothing is known about
    the distribution of the resulting parameter estimates; there are no explicit formulas
    for their densities or moments. In fact, theoretical moments quite of- ten fail
    to exist. This happens even in the linear case, see Section 1.6. For the problem
    of fitting circles, see Section 6.4. The nonexistence of moments appears to be
    a common feature of the EIV regression and orthogonal fitting problems. To resolve
    these difficulties, statisticians have developed a nontradi- tional error analysis
    based on approximating distributions. We devote almost the entire Chapter 6 to
    those new statistical theories.


