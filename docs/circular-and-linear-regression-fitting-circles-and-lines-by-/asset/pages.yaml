    # 6.7 A model with small noise and “moderate sample size”


    Our approximate error analysis in Section 6.6 includes all the terms of order
    $\sigma^2$ and $\sigma^4$. In applications, one usually gets a large number of
    terms of order $\sigma^4$ given by complicated formulas; we will see examples
    in Chapter 7. Even the expression for the bias (6.22) alone may contain several
    terms of order $\sigma^2$. In this section we sort the higher order terms out
    to keep only the most significant ones. Our sorting method is motivated by Kanatani
    [104].


    **Kanatani’s treatment of higher order terms.** Kanatani [104] recently derived
    formulas for the bias of certain ellipse fitting algorithms. He kept all the terms
    of order $\sigma^2$, but in the end he noticed that some terms were of order $\sigma^2$
    (independent of $n$), while the others of order $\sigma^2/n$. The magnitude of
    the former was clearly larger than that of the latter, and when Kanatani made
    his final conclusions he ignored the terms of order $\sigma^2/n$. To justify this
    discretion, he simply noted that “in many vision applications $n$ is fairly large.”


    **Formal classification of higher order terms.** We formalize Kanatani’s prescription
    for treating higher order terms in the approximate error analysis, and adopt the
    following rules:


    +   - In the expression for the bias (6.22) we keep terms of order $\sigma^2$
    (independent of $n$) and ignore terms of order $\sigma^2/n$.

    - In the expression for the mean squared error (6.23) we keep terms of order $\sigma^4$
    (independent of $n$) and ignore terms of order $\sigma^4/n$.


    In the strict mathematical sense, to justify our rules we would need to assume
    that not only $\sigma \to 0$, but also $n \to \infty$, although $n$ may increase
    rather slowly. Precisely, $n$ need to grow slower that $1/\sigma^2$. For simplicity,
    however, we prefer to treat $\sigma$ as small variable and $n$ as a moderately
    large constant. We call this a *model with small noise and moderate sample size*.


    **Magnitude of various terms.** The main term $\sigma^2\mathbf{G}_m^T\mathbf{G}_m$
    in our expression for the mean squared error (6.23) is always of order $\sigma^2/n$;
    it will never be ignored. Out of the two higher order terms $\frac{1}{4}\,\sigma^4[\operatorname{tr}\mathbf{H}_m]^2$
    and $\frac{1}{2}\,\sigma^4\|\mathbf{H}_m\|_F^2$, the latter is always of order
    $\sigma^4/n$ (under certain natural conditions), hence it will'
