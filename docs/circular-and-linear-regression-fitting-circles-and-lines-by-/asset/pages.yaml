    # 8.3 Riemann fit: the SWFL version


    To relate the distances in the $xy$ plane to the distances on the Riemann sphere
    we invoke the following fact in complex analysis.


    **Conformality.** Let $\Phi$ denote the map from the $xy$ plane to the sphere
    $\mathbb{S}$ given by (8.1), i.e., we write $\Phi(x, y) = (x'', y'', z'')$. Let
    $D\Phi$ denote the derivative of the map $\Phi$, i.e., its linear part. Precisely,
    $D\Phi$ transforms tangent vectors $(dx, dy)$ to the $xy$ plane into tangent vectors
    $(dx'', dy'', dz'')$ to the sphere $\mathbb{S}$. Note that $D\Phi$ is a $3 \times
    2$ matrix consisting of partial derivatives of expressions in (8.1) with respect
    to $x$ and $y$.


    **Theorem 16** The map $\Phi$ is conformal at every point $(x, y)$. That is, its
    derivative $D\Phi$ satisfies two requirements:

    (i) *it preserves angles between tangent vectors and*

    (ii) *it contracts all tangent vectors uniformly.*

    More precisely, if $(dx'', dy'', dz'')^T = D\Phi(dx, dy)^T$, then


    ```

    $\|(dx'', dy'', dz'')\| = (1 + x^2 + y^2)^{-1}\|(dx, dy)\|$.

    ```


    *Note that the contraction factor* $(1 + x^2 + y^2)^{-1}$ *does not depend on
    the direction of the tangent vector* $(dx, dy)$.


    One can verify all these claims directly, by computing the matrix $D\Phi$ of partial
    derivatives of the formulas (8.1) with respect to $x$ and $y$. This can be done
    a little easier if one rewrites (8.1) in polar coordinates $(r, \theta)$ on the
    $xy$ plane:


    ```

    $\begin{aligned} x'' &= r \cos \theta / (1 + r^2) \\ y'' &= r \sin \theta / (1
    + r^2) \\ z'' &= r^2 / (1 + r^2). \end{aligned}$

    ```


    Now one can conveniently differentiate $x'', y'', z''$ with respect to $\theta$
    (in the tangent direction) and with respect to $r$ (in the radial direction).
    We leave the details to the reader.'
