- pgno: 258
  md: '![](img/86db288e3c266985d1648282179ae4b5_258_0.png)


    *Figure 8.5 Possible locations for the pole on the circle. The observed points
    (marked by crosses) are clustered on the right.*


    **Step 2.** Apply the RTKD inversion fit (Section 8.6) with the pole $P_{k}$,
    obtain a circle $\mathbb{O}_{k}$.


    **Step 3.** Place the new pole $P_{k+1}$ at point on the circle $\mathbb{O}_{k}$
    diametrically opposite to $P_{k}$ (recall that $P_{k} \in \mathbb{O}_{k}$ by the
    nature of the fit).


    **Step 4.** If $\operatorname{dist}(P_{k+1}, P_{k-1})$ is small enough, stop.
    Otherwise increment $k$ and return to Step 2.


    The underlying idea is that if the initial pole happens to be in a bad part of
    the circle (close to the data points), then the next location will be in a very
    good part of it (diametrically opposite to the data points), and then the locations
    will alternate between bad and very good; the latter will stabilize the fit. If
    the initial pole is in a good part of the circle, then its locations will remain
    in good parts.


    **Relaxing the constraint.** Next, Rusu, Tico, Kuosmanen, and Delp [159] realized
    that their RTKD iterative scheme can be applied without a prior knowledge of a
    point on the circumference.


    Indeed, suppose the initial pole $P_{0}$ at Step 1 is chosen away from the circle.
    Then the procedure will change the pole at every step, and the poles may get closer
    and closer to the circle. Thus the procedure may converge to a limit where pole
    will be on circle.


    Practically, the authors of [159] place the initial pole at one of the observed
    points, which is a very reasonable strategy (Section 8.5). In their numerical
    tests, the iterative procedure always converged to a circle that was quite close
    to the one returned by the geometric fit. The number of iterations was between
    5 and 15 in all reported cases.


    We call this algorithm the *iterative RTKD fit*.


    The authors of [159] also investigated the sensitivity of their iterative scheme
    to the choice of the initial pole in general, when the latter is selected anywhere
    in the plane. They discovered that when the pole was chosen inside the true circle
    or relatively close to it, then the scheme almost certainly converged. If the
    pole is selected far from the true circle, the picture is mixed.'
