    # 7.10 Kukush-Markovsky-van Huffel method


    **KMvH consistent estimator.** In the early 2000s Kukush, Markovsky, and van Huffel
    proposed a consistent estimator for the parameters of quadratic curves (and surfaces)
    that are fitted to observed data. They started with ellipses whose center was
    known [115], then went on to ellipsoids [130] and general quadratic surfaces [114];
    lastly, they provided complete and detailed mathematical proofs in [167]. Though
    they never treated the problem of fitting circles, we will adapt their approach
    to this task here. We abbreviate their algorithm as KMvH (after Kukush, Markovsky,
    and van Huffel).


    Their basic observation is that, as $n \to \infty$, the matrix $\mathbf{M}_{\text{unbiased}}$
    converges to its true (noise-free) value $\bar{\mathbf{M}}$; in fact,


    ```

    $$\mathbf{M}_{\text{unbiased}} = \bar{\mathbf{M}} + \mathcal{O}_p(n^{-1/2}),$$

    ```


    according to the classical central limit theorem. The true matrix $\bar{\mathbf{M}}$
    is positive semi-definite and singular; its only zero eigenvalue corresponds to
    the true parameter vector $\bar{\mathbf{A}}$, because $\bar{\mathbf{M}}\bar{\mathbf{A}}
    = \mathbf{0}$, cf. Section 7.3.


    Thus Kukush, Markovsky, and van Huffel estimate the unknown variance $V = \sigma^2$
    by a value $\hat{V}$ that makes the variable matrix


    ```

    $$\mathbf{M}_{\text{unbiased}}(V) = \mathbf{M} - V\mathbf{H} + 8V^2\mathbf{I}_1
    \quad (7.65)$$

    ```


    positive semi-definite and singular, i.e., they find $\hat{V}$ such that


    ```

    $$\mathbf{M}_{\text{unbiased}}(\hat{V}) \geq \mathbf{0} \quad \text{and} \quad
    \det \mathbf{M}_{\text{unbiased}}(\hat{V}) = 0. \quad (7.66)$$

    ```'
