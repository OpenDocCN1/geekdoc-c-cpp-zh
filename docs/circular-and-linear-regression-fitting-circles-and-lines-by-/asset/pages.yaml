  md: 'Each observed point $(x_i, y_i)$ is as a random perturbation of the true point
    $(\tilde{x}_i, \tilde{y}_i)$ by a random isotropic Gaussian noise, i.e.,


    ```

    $$x_i = \tilde{x}_i + \delta_i, \quad y_i = \tilde{y}_i + \varepsilon_i,$$

    ```


    where $\delta_i$ and $\varepsilon_i$ are independent random variables with normal
    distribution $N(0, \sigma^2)$. The value of $\sigma^2$ is not needed for the estimation
    of $A$, $B$, $C$, and $\theta$.


    The true values $\tilde{x}_i, \tilde{y}_i$ are regarded as fixed (nonrandom),
    and therefore must be treated as additional model parameters. They are called
    “incidental” or “latent” parameters (or “nuisance” parameters, as their values
    are normally of little interest). This constitutes the functional model, cf. Section
    1.2.


    **Distribution of the scatter matrix.** These are, perhaps, the simplest possible
    assumptions in the context of the orthogonal fit. Still, under these assumptions
    the distribution of the estimates of the regression parameters is overly complicated.
    Without going into the depth of statistical analysis, we will only take a glimpse
    at some formulas.


    For example, the components $s_{xx}$, $s_{yy}$, and $s_{xy}$ of the scatter matrix
    $\mathbf{S}$ have the noncentral Wishart distribution with joint density function


    ```

    $$\frac{e^{-S/2}e^{-(s_{xx}+s_{yy})/2}(s_{xx}s_{yy}-s_{xy}^2)^{(n-3)/2}}{2^n \pi^{1/2}\Gamma(\frac{n-1}{2})}
    \sum_{j=0}^{\infty} \frac{(\frac{s}{2})^{2j} s_{xx}^{j}}{j! \Gamma(\frac{n}{2}+j)},
    \quad (2.16)$$

    ```


    in the region $s_{xx} > 0$, $s_{yy} > 0$, and $s_{xy}^2 < s_{xx}s_{yy}$; see,
    e.g., [10]. In this expression, it is assumed, for simplicity, that the true line
    is horizontal and passes through the origin (i.e., $\tilde{A} = \tilde{C} = 0$)
    and $\sigma^2 = 1$. The density for general lines and $\sigma > 0$ can be obtained
    by a standard coordinate transformation.


    The parameter $S$ of the above distribution is defined by


    ```

    $$S = s_{\tilde{x}\tilde{x}} + s_{\tilde{y}\tilde{y}} \tag{2.17}$$

    $$= \sum_{i=1}^{n} \tilde{x}_i^2 - \frac{1}{n}\left[\sum_{i=1}^{n} \tilde{x}_i\right]^2
    + \sum_{i=1}^{n} \tilde{y}_i^2 - \frac{1}{n}\left[\sum_{i=1}^{n} \tilde{y}_i\right]^2,$$

    ```


    It characterizes the spread of the true points $(\tilde{x}_i, \tilde{y}_i)$ about
    their centroid. In fact, $S$ is the sum of squares of the distances from the true
    points to their centroid. Note that $S$ remains invariant under translations and
    rotations of the coordinate frame on the plane.


    **Estimation of $\theta$.** Next we turn our attention to the estimator $\hat{\theta}$
    and make two important observations, following Anderson [7]. First, the distribution
    of $\hat{\theta} - \bar{\theta}$ does not depend on $\bar{\theta}$ (the true value
    of $\theta$). Indeed, the model and the orthogonal fitting line are invariant
    under rotations, so we can rotate the line to achieve $\bar{\theta} = 0$.'
