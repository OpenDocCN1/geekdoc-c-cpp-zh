  md: 'where


    ```

    $$\tilde{\mathbf{T}}_{i}=\left[\begin{array}{cccc} 4 \tilde{z}_{i} & 2 \tilde{x}_{i}
    & 2 \tilde{y}_{i} & 0 \\ 2 \tilde{x}_{i} & 1 & 0 & 0 \\ 2 \tilde{y}_{i} & 0 &
    1 & 0 \\ 0 & 0 & 0 & 0 \end{array}\right] .$$

    ```


    Now we rewrite (7.28) as


    ```

    $$\begin{aligned} \mathbb{E}\left[\left(\Delta_{1} \mathbf{A}\right)\left(\Delta_{1}
    \mathbf{A}\right)^{T}\right] & =n^{-2} \tilde{\mathbf{M}}^{\leftarrow}\left[\sum_{i,
    j} \tilde{\mathbf{X}}_{i} \tilde{\mathbf{A}}^{T} \mathbb{E}\left[\left(\Delta_{1}
    \mathbf{X}_{i} \Delta_{1} \mathbf{X}_{j}^{T}\right) \tilde{\mathbf{A}} \tilde{\mathbf{X}}_{j}^{T}\right]
    \tilde{\mathbf{M}}^{\rightarrow} \\ & =n^{-2} \sigma^{2} \tilde{\mathbf{M}}^{\leftarrow}\left[\sum_{i}
    \tilde{\mathbf{X}}_{i} \tilde{\mathbf{A}}^{T} \tilde{\mathbf{T}}_{i} \tilde{\mathbf{A}}
    \tilde{\mathbf{X}}_{i}^{T}\right] \tilde{\mathbf{M}}^{\rightarrow} \end{aligned}$$

    ```


    Note that


    ```

    $$\tilde{\mathbf{A}}^{T} \tilde{\mathbf{T}}_{i} \tilde{\mathbf{A}}=\tilde{\mathbf{A}}^{T}
    \mathbf{P} \tilde{\mathbf{A}}=\tilde{B}^{2}+\tilde{C}^{2}-4 \tilde{A} \tilde{D}$$

    ```


    for each $i$, hence


    ```

    $$\sum_{i} \tilde{\mathbf{X}}_{i} \tilde{\mathbf{A}}^{T} \tilde{\mathbf{T}}_{i}
    \tilde{\mathbf{A}} \tilde{\mathbf{X}}_{i}^{T}=\sum_{i}\left(\tilde{\mathbf{A}}^{T}
    \mathbf{P} \tilde{\mathbf{A}}\right) \tilde{\mathbf{X}}_{i} \tilde{\mathbf{X}}_{i}^{T}=n\left(\tilde{\mathbf{A}}^{T}
    \mathbf{P} \tilde{\mathbf{A}}\right) \tilde{\mathbf{M}} .$$

    ```


    This gives


    ```

    $$\mathbb{E}\left[\left(\Delta_{1} \mathbf{A}\right)\left(\Delta_{1} \mathbf{A}\right)^{T}\right]=n^{-1}
    \sigma^{2} \tilde{\mathbf{M}}^{\leftarrow}\left(\tilde{\mathbf{A}}^{T} \mathbf{P}
    \tilde{\mathbf{A}}\right) . \quad \quad \quad \quad \quad \quad \quad \quad \quad
    \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad
    \quad \quad \quad \quad \quad \quad \quad \quad(7.29)$$

    ```


    Remarkably, the variance of algebraic fits does not depend on the constraint matrix
    $\mathbf{N}$, hence all algebraic fits have the same variance (to the leading
    order). In Section 7.6 we will derive the variance of algebraic fits in the natural
    circle parameters $(a,b, R)$ and see that it coincides with the variance of the
    geometric fit (7.6).


    **Bias of algebraic circle fits.** Since $\mathbb{E}\left(\Delta_{1} \mathbf{A}\right)=0$,
    it will be enough to find $\mathbb{E}\left(\Delta_{2} \mathbf{A}\right)$, and
    this will be done via (7.26). First we can write, following (7.23)


    ```

    $$\eta=\tilde{\eta}+\Delta_{1} \eta+\Delta_{2} \eta+\mathscr{O}_{P}\left(\sigma^{3}\right)
    .$$

    ```


    Premultiplying (7.22) by $\tilde{\mathbf{A}}^{T}$ yields


    ```

    $$\eta=\frac{\tilde{\mathbf{A}}^{T} \mathbf{M} \mathbf{A}}{\tilde{\mathbf{A}}^{T}
    \mathbf{N} \mathbf{A}}=\frac{\tilde{\mathbf{A}}^{T} \Delta_{2} \mathbf{M} \tilde{\mathbf{A}}+\tilde{\mathbf{A}}^{T}
    \Delta_{1} \mathbf{M} \Delta_{1} \mathbf{A}}{\tilde{\mathbf{A}}^{T} \tilde{\mathbf{N}}
    \tilde{\mathbf{A}}}+\mathscr{O}_{P}\left(\sigma^{3}\right) ,$$

    ```


    in particular we see that $\tilde{\eta}=\Delta_{1} \eta=0$ and $\eta=\mathscr{O}_{P}\left(\sigma^{2}\right)$.
    Thus by (7.26)


    ```

    $$\Delta_{2} \mathbf{A}=\tilde{\mathbf{M}}^{\leftarrow}\left(\frac{\tilde{\mathbf{A}}^{T}
    \mathbf{L}}{\tilde{\mathbf{A}}^{T} \tilde{\mathbf{N}} \tilde{\mathbf{A}}} \tilde{\mathbf{N}
    \tilde{\mathbf{A}}-\mathbf{L}}\right)+\mathscr{O}_{P}\left(\sigma^{3}\right),
    \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad
    \quad \quad \quad(7.30)$$

    ```


    where


    ```

    $$\mathbf{L}=\Delta_{2} \mathbf{M} \tilde{\mathbf{A}}+\Delta_{1} \mathbf{M} \Delta_{1}
    \mathbf{A} . \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad
    \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad \quad(7.31)$$

    ```'
