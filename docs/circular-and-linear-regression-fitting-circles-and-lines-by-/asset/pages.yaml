    be widely recognized by the applied community. It is rarely mentioned in the literature,
    and some authors rediscover it independently from time to time [34]. For the alternative
    radial functional model we could not locate a proof of this fact at all. Thus
    we provide a proof of the above theorem in full.


    **Proof.** The joint probability density function of the observations is


    ```

    $$

    \begin{aligned}

    f(x_1, y_1, \ldots, x_n, y_n) &= \frac{1}{(2\pi\sigma^2)^{m/2}} \exp \left[ -\frac{1}{2\sigma^2}
