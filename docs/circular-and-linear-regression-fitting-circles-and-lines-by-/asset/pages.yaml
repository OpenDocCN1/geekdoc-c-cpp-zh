  md: '**Relation between distances**. Let $P$ and $Q$ be two nearby points on the
    $xy$ plane and $d = \operatorname{dist}(P, Q)$. Denote by $d''$ the distance between
    their images $\Phi(P)$ and $\Phi(Q)$ on the sphere. According to the above theorem,
    $d''$ and $d$ are related by

    $$d''=(1+x^2+y^2)^{-1}d+\mathcal{O}(d^2)$$

    where $(x, y)$ are the coordinates of $P$ (or $Q$). Thus, to the first order,
    the distances between points are contracted by the factor of $(1+x^2+y^2)^{-1}$.

    Furthermore, if a point $P=(x, y)$ is the distance $d$ from a circle (or line)
    $\circled{O}$ on the plane, then its image $\Phi(P)$ is the distance

    $$d''=(1+x^2+y^2)^{-1}d+\mathcal{O}(d^2)\tag{8.6}$$

    from the circle $\Phi(\circled{O})$ on the sphere $\mathbb{S}$. Thus, to the first
    order, the distances to circles are contracted by the same factor of $(1+x^2+y^2)^{-1}$.

    Next, let gain $\Phi(\circled{O})$ denote a circle on the sphere $\mathbb{S}$
    and $\Phi(P)$ a nearby point a distance $d''$ from the circle $\circled{O}$. Let
    $\mathbb{P}$ denote the plane containing the circle $\circled{O}$ and

    $$\alpha x''+\beta y''+\gamma z''+c=0$$

    its equation in the spacial coordinates, as before. Let $d''''$ denote the *orthogonal*
    distance from the point $\Phi(P)$ to the plane $\mathbb{P}$. Then $d''''$ and
    $d''$ are related by

    $$d''''=\frac{\sqrt{\alpha^2+\beta^2-4 c(\gamma+c)}}{\sqrt{\alpha^2+\beta^2+\gamma^2}}d''+\mathcal{O}([d'']^2).\tag{8.7}$$

    We note that whenever the fitting plane (8.2) intersects the Riemann sphere, the
    distance from its center $(0,0,\frac{1}{2})$ to the plane is $\le \frac{1}{2}$,
    hence $\alpha^2+\beta^2-4 c(\gamma+c) \ge 0$, which guarantees that the first
    square root in (8.7) is well defined. Combining the above formulas (8.6) and (8.7)
    gives

    $$d''''=\frac{\sqrt{\alpha^2+\beta^2-4 c(\gamma+c)}}{\sqrt{\alpha^2+\beta^2+\gamma^2}}
    \times \frac{d}{1+x^2+y^2}+\mathcal{O}(d^2).$$

    If the point $\Phi(P)$ has coordinates $(x'', y'', z'')$, then

    $$d''''=\frac{|\alpha x''+\beta y''+\gamma z''+c|}{\sqrt{\alpha^2+\beta^2+\gamma^2}}$$

    Combining the above two formulas gives

    $$d=\frac{|(\alpha x''+\beta y''+\gamma z''+c)(1+x^2+y^2)|}{\sqrt{\alpha^2+\beta^2-4
