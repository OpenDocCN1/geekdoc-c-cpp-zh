  md: '**Theorem 8** *In the case* $\overline{\mathrm{xy}} \neq 0$ *the best fitting
    circle exists, i.e., the best fitting line cannot beat the best circle.*


    ![](img/86db288e3c266985d1648282179ae4b5_101_0.png)


    Figure 3.12: *Best circle beats the best line despite* $\overline{\mathrm{xy}}
    = 0$.


    On the other hand, even if $\overline{\mathrm{xy}} = 0$, the best fitting circle
    may still exist. For instance, let $n = 4$ data points be the vertices of a rectangle,
    see Fig. 3.12. Then the best fitting line cuts the rectangle in half, and one
    can easily see that in the adjusted coordinate system $\overline{\mathrm{xy}}
    = 0$ (due to the symmetry about the $x$ axis). However, the circumscribed circle
    interpolates all the four data points, so it provides a perfect fit ($\mathcal{F}
    = 0$), thus it beats any line.


    To summarize our theoretical conclusions, we see that


    +   (a) if $\overline{\mathrm{xy}} \neq 0$, then the best fitting circle always
    exists (and it beats any line);

    (b) if $\overline{\mathrm{xy}} = 0$, then the best fitting circle may or may not
    exist, depending on the data set; i.e., it is possible that the best fitting line
    beats all circles.


    Practically, this means that if $\overline{\mathrm{xy}} = 0$, then one should
    check the best fitting line (the $x$ axis) as a potential solution of the circle
    fitting problem. If $\overline{\mathrm{xy}} \neq 0$, then lines can be ignored.


    **Practical recommendations.** In fact, one should be very careful when the critical
    value $\overline{\mathrm{xy}}$ gets too close to zero. As it follows from the
    expansion (3.19),


    ```

    $R = \mathcal{O}(1 / \overline{\mathrm{xy}})$,

    ```


    i.e., if $\overline{\mathrm{xy}}$ is too close to zero, then the radius of the
    best fitting circle may be extremely large; in that case an attempt to compute
    $a, b$ and $R$ may cause the catastrophic loss of accuracy described in Section
    3.2.


    The following simple safety checkpoint may be adopted to avoid catastrophic results.
    Suppose our coordinates $x_i$''s and $y_i$''s are of order one; in that case if
    an iterative algorithm reaches values $R \geq 10^8$, then further calculations
    would be meaningless; hence the iterations should be terminated and the algorithm
    should return the best fitting line (the $x$ axis) as the solution of the circle
    fitting problem.


    This concludes our theoretical analysis of the circle fitting problem. It will
    be invaluable in the assessment of practical algorithms to which we turn next.'
