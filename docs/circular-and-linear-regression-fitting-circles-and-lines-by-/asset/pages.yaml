    Thus far we discussed two sides of the the circle fitting problem: its theoretical
    analysis (Chapter 3) and its practical solutions (Chapters 4 and 5). In a sense,
    the theoretical analysis of Chapter 3 was “pre-computational,” it prepared us
    for practical solutions. Chapters 4 and 5 were “computational.” Now we turn to
    the third, and last (“post-computational”) side of the problem: assessment of
    the accuracy of the circle fits. This brings us to statistical analysis of circle
    fits.


    In this chapter we survey basic statistical properties of curve fitting algorithms
    when both variables are subject to errors. This is a fairly advanced topic in
    modern statistics, so we assume the reader is familiar with the basic concepts
    of probability and statistics. Our discussion need not be restricted to lines
    and circles anymore, it applies to general curves; though for illustrations we
    still use lines and circles.


    We also need to make an important remark on the selection of material for this
    (and the next) chapter. The statistics literature devoted to the problem of fitting
    curves to data is vast, it encompasses all kinds of studies — from numer-'
