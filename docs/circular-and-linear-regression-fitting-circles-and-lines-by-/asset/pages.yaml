    \ that $\\mathbf{M}_{\\text{unbiased}}(V)$ would be positive semi-definite and\
    \ singular; i.e., he proposed to estimate $V$ by the rules (7.66). Lastly, he\
    \ proposed to compute $\\hat{\\mathbf{A}}$ as an eigenvector of $\\mathbf{M}_{\\\
