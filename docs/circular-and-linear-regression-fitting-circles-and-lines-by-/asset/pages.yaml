- pgno: 254
  md: 'The following modification of the inversion-based fit was proposed in 1988
    by Hansroul, Jeremie, and Savard [82] to account for the impact parameter. Let
    $(a,b,R)$ denote, as usual, the center and radius of the circle (track) and


    $$\delta = R^2 - a^2 - b^2$$


    be small, $|\delta| \ll R^2$, which guarantees that the circle passes close to
    the origin (the vertex is at the origin). Assume that the track is rotated so
    that it is almost parallel to the $x$ axis. Then the inversion (8.20) maps the
    circle $(a,b,R)$ to another, bigger circle, and the images $(x_i'',y_i'')$ of
    the data points are located along a nearly horizontal arc of that bigger circle.
    The authors of [82] approximate that arc by a parabola


    $$y'' = \alpha + \beta x'' + \gamma [x'']^2.$$


    Practically, they propose to fit a parabola to the points $(x_i'',y_i'')$ by the
    classical regression techniques; this is a linear problem that has an exact and
    simple solution. Then the track parameters can be computed by


    $$a = -\frac{\beta}{2\alpha}, \quad b = \frac{1}{2\alpha}, \quad \varepsilon =
    -\frac{\gamma}{(1+\beta^2)^{3/2}}, \quad R = \varepsilon + \sqrt{a^2+b^2},$$


    where $\varepsilon$ is the impact parameter. Thus one determines all the track
    characteristics.


    ![](img/86db288e3c266985d1648282179ae4b5_254_0.png)


    ![](img/86db288e3c266985d1648282179ae4b5_254_1.png)


    Figure 8.4 A track passing near the pole. Its image under the inversion map is
    an arc that can be approximated by a parabola.


    **Conclusions.** We see that the inversion-based fit, in its original form, is
    useful only in rather special applications where one knows a point that lies *on
    the desired circle or very close to it*. However, such applications are rare;
    in most cases one does not have the luxury of knowing a point near the desired
    circle. In the next sections we present inversion-based circle fits that can handle
    more general situations.'
