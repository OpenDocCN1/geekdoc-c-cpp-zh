    After all these magnificent achievements, the studies of the linear EIV regression
    seem to have subsided in the late 1990s; perhaps the topic exhausted itself. The
    statistical community turned its attention to nonlinear EIV models.


    For further reading on the linear EIV regression, see excellent surveys in [8,
    73, 126, 127, 132, 187], and books [66], [40], [128] (Chapter 10), and [111] (Chapter
    29). We give a summary of the orthogonal line fitting in Chapter 2.


    # 1.7 Relation to total least squares (TLS)


    The EIV linear regression is often associated with the so-called *total least
    squares* (TLS) techniques in computational linear algebra. The latter solve an
    overdetermined linear system


    ```

    $$\mathbf{A}\mathbf{x} \approx \mathbf{b}, \quad \mathbf{x} \in \mathbb{R}^{m},
    \ \mathbf{b} \in \mathbb{R}^{n}, \ n > m,$$

    ```


    where not only the vector $\mathbf{b}$, but also the matrix $\mathbf{A}$ (or at
    least some of its columns) are assumed to be contaminated by errors. If only $\mathbf{b}$
    is corrupted by noise, the solution of (1.26) is given by the ordinary least squares


    ```

    $$\mathbf{x} = \operatorname{argmin}\|\mathbf{A}\mathbf{x} - \mathbf{b}\|^{2},$

    ```


    where $\| \cdot \|$ denotes the 2-norm. Equivalently, it can be paraphrased by


    ```

    $$\mathbf{x} = \operatorname{argmin}\|\Delta\mathbf{b}\|^{2} \quad \text{subject
    to} \quad \mathbf{A}\mathbf{x} = \mathbf{b} + \Delta\mathbf{b}.$$

    ```


    If $\mathbf{A}$ has full rank, the (unique) explicit solution is


    ```

    $$\mathbf{x} = (\mathbf{A}^{T}\mathbf{A})^{-1}\mathbf{A}^{T}\mathbf{b}.$$

    ```


    If $\mathbf{A}$ is rank deficient, the solution is not unique anymore, and one
    usually picks the minimum-norm solution


    ```

    $$\mathbf{x} = \mathbf{A}^{-}\mathbf{b},$

    ```


    where $\mathbf{A}^{-}$ denotes the Moore-Penrose pseudoinverse.


    If both $\mathbf{b}$ and $\mathbf{A}$ are corrupted by noise, the solution of
    (1.26) is more complicated, and it is the subject of the TLS techniques. In the
    simplest case, where'
