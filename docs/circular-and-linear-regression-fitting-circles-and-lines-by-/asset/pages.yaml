    Invariance under translations and rotations. Lastly, we note that the Taubin fit,
    just like the Pratt and Kåsa fits, is invariant under translations, rotations,
    and similarities. This invariance can be proved in the same way as we did in Section
    5.7 for the Pratt fit; the only difference is that now we have a new constraint
    matrix, **T**, which is data-dependent, hence it changes under coordinate transformation.
    We just need to check that the new matrix, $\mathbf{T}_{\mathrm{new}}$, is obtained
    by the rule


    ```

    T_new = F^TTF

    ```


    where **F** is the matrix that describes the translations, see (5.34), or rotations,
    see (5.37) in Section 5.7. The above identity is an analogue of (5.35); it can
    be easily verified directly. The invariance of under similarities follows from
    the fact that whenever $(x,y) \mapsto (cx,cy)$, we have $(A,B,C,D) \mapsto (A/c^2,B/c,C/c,D)$,
    and hence $\mathbf{A}^T \mathbf{T A} \mapsto c^{-2}\mathbf{A}^T \mathbf{T A}$.
    Thus the constraint $\mathbf{A}^T \mathbf{T A} = 1$ will be transformed into $\mathbf{A}^T
    \mathbf{T A} = c^2$, which is irrelevant as our parameter vector **A** only needs
    to be determined up to a scalar multiple.


    In fact, Taubin proved that his method was invariant in a more general context
    of fitting ellipses to data; see his article [176].


