- pgno: 139
  md: 'Theoretical analysis of heavy bias. Unfortunately, it is a general fact: the
    Kåsa method substantially underestimates the radius and is heavily biased toward
    smaller circles when the data points are confined to a relatively small arc; this
    tendency has been noticed and documented by many authors, see [18, 45, 43, 42,
    53, 67, 82, 137, 150, 159] and our Section 5.7.


    The reason for this flaw of the Kåsa fit can be derived from (5.8). The method
    minimizes the average product of the smallest distance $d_i$ and the largest distance
    $D_i$ (squared). Reducing the size of the circle may increase $d_i$''s but decrease
    $D_i$''s, thus the minimum of $\mathscr{F}_1$ may be attained on a circle that
    does not necessarily minimize $d_i$''s but rather finds a best trade-off between
    $d_i$''s and $D_i$''s.


    To perform a more detailed analysis, observe that $D_i = d_i + 2R$, hence the
    Kåsa fit minimizes


    $$\mathscr{F}_1 = \sum_{i=1}^{n} d_i^2 (d_i + 2R)^2. \tag{5.14}$$


    Now if the data points are close to the circle, we have $|d_i| \ll R$ and


    $$\mathscr{F}_1 \approx 4R^2 \sum_{i=1}^{n} d_i^2. \tag{5.15}$$


    Suppose the data are sampled along an arc of length $L$ (subtending a small angle
    $\alpha = L/R$). Let $(a, b, R)$ denote the parameters of the true circle, then
    $\mathscr{F}_1(a, b, R) \approx 4R^2n\sigma^2$. If one reduces the arc radius
    by a factor of 2, see Fig. 5.5, then the arc will be displaced by $\sim L^2/R$,
    thus distance from the data points to the new arc will be of order $\sigma + L^2/R$;
    hence the new value of $\mathscr{F}_1$ will be


    $$\mathscr{F}_1 \approx 4(R/2)^2n(\sigma + L^2/R)^2.$$


    The algorithm will favor the new circle of the smaller radius $R/2$ as long as
    $\sigma > L^2/R = \alpha L$. Hence, the Kåsa method is subject to gross errors
    or breaking down whenever $\sigma R > L^2$.


    ![](img/86db288e3c266985d1648282179ae4b5_139_0.png)


    Conclusions. To summarize, the Kåsa algorithm is perhaps the simplest, fastest,
    and most elegant of all known circle fits. Its does an excellent job whenever
    the data points are sampled along a full circle or at least half a circle. It
    also works fine if the data points lie very close to a circle, i.e., when $\sigma
    \approx 0$.'
