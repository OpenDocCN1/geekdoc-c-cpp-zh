- pgno: 69
  md: 'An ardent advocate of the small-sigma model for image processing applications
    is Kanatani; we refer the reader to his well written articles [97, 98, 99].


    A hybrid model. Some authors combine the above two models and assume that


    $n \to \infty \quad$ and $\sigma \to 0$ (2.19)


    simultaneously. This is in fact a very strong assumption which allows one to derive
    the desired asymptotic properties more easily. Such hybrid models have been studied
    by Amemiya, Fuller and Wolter [5, 192] in the context of non-linear regression.
    In the linear case, we can do without them. We note that a somewhat simplified
    version of the above hybrid model will be involved in our statistical error analysis
    of Chapter 6.


    Terminology. Since our primary motivation is geometric fitting in image processing
    applications, the small-sigma model has a higher priority in our book. We call
    it the Type A model. The classical (large $n$) asymptotics is called the Type
    B model (this terminology was also used by Patefeld [142]):


    +   **Type A model:** The true points are fixed and $\sigma \to 0$. No additional
    assumptions are necessary.


    +   **Type B model:** The variance $\sigma^2 > 0$ is fixed, but $n \to \infty$.
    In addition we assume that


    $\lim_{n \to \infty} \frac{1}{n} S = s_{*} > 0,$


    where $S$ is the spread of the true points defined by (2.17). This assumption
    ensures that the line is identifiable.


    If $s_{*} = 0$, then the true points may “cluster” too tightly near a common center,
    and the parameter estimates may not even be consistent (see [76]). In the extreme
    case $S = 0$, for example, the estimate of the slope is obviously independent
    of the true slope.


    # 2.6 Asymptotic properties of estimators


    Theory. First we state two theorems describing the asymptotics of the estimate
    $\hat{\theta}$ in the Type A and Type B models.


    **Theorem 2 ([7])** *For the Type A model, the estimate* $\hat{\theta}$ *is asymptotically
    normal, and its limit distribution is described by*


    $\sigma^{-1}(\hat{\theta}-\vec{\theta}) \to_{L} N(0, S^{-1}).$ (2.20)


    Its variance satisfies


    $\operatorname{Var}(\hat{\theta}) = \frac{\sigma^{2}}{S} \left( 1 + \frac{(n-1)\sigma^{2}}{S}
    \right) + \sigma(\sigma^{6}).$ (2.21)'
