    **Possible extensions.** There are several ways to relax even the mild restriction
    (8.49). They are not discussed in Karimäki''s papers [106, 107], but we include
    them here in an attempt to extend the applicability of his fit.


    First, if all the observed points are close to the circle (i.e., $\sigma \ll R$),
    one can choose any of them as the origin. In other words, one can choose $1 \leq
    j \leq n$ and then transform $(x_i, y_i) \mapsto (x_i - x_j, y_i - y_j)$ for all
    $i = 1, \ldots, n$. This places the origin at the $j$th observed point. In most
    cases such a shift would guarantee the validity Karimäki''s main assumption (8.49).
    Furthermore, such a choice of the coordinate system does not reduce the size of
    the sample, as it did in the case of inversion-based fits, see Section 8.5. Even
    the $j$th point itself, where the origin is placed, effectively participates in
    the fitting procedure.


    Next, one can apply an iterative scheme analogous to that of Rusu, Tico, Kuosmanen,
    and Delp [159]; see Section 8.6. Namely, one can adjust the origin (pole) $P =
    (0,0)$ at every iteration. Precisely, suppose for the current origin $P_k$ (where
    $k$ is the iteration number) the Karimäki fit returns a circle $\mathcal{C}_k$.
    Then one can set the next origin (pole) $P_{k+1}$ at the point on $\mathcal{C}_k$
    closest to $P_k$; then one refits the circle $\mathcal{C}_{k+1}$, etc.


    This iterative scheme may converge much faster than the RTKD algorithm of Section
    8.6, because Karimäki''s circle is more flexible, so it is not rigidly constrained
    to pass through the current pole. On the other hand, repeating the Karimäki fit
    iteratively would instantly deprive it of its best asset—fast performance—because
    its computational time would double or triple.


