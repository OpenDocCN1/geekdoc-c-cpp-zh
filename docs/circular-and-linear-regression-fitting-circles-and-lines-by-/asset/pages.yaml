    be computed by QR or SVD (as we described in the end of the previous section).


    **History.** The Levenberg-Marquardt correction was introduced in the middle of
    the twentieth century: it was invented by Levenberg [122] in 1944, re-discovered
    and enhanced by Marquardt [131] in 1963. It was popularized in the 1970s; see
    e.g., [71]. This method and its variant called the *trust region*, see the next
    section, dominate the literature on least squares applications in the past decades.


    # 4.4 Trust region


    To complete our survey of general minimization schemes, we will describe the trust
    region method, which currently constitutes the state of the art.


    **Motivation.** The Levenberg-Marquardt algorithm is flexible enough to avoid
    obvious pitfalls of the classical minimization schemes and virtually guarantees
    convergence to a minimum of the objective function. Its drawback, though, is that
    the control parameter $\lambda$ is just an abstract variable whose values have
    no apparent relation to the problem at hand. Therefore it is hard to properly
    initialize $\lambda$. Also, the Levenberg-Marquardt simplistic rules for updating
    $\lambda$ (by arbitrarily chosen factors $\alpha$ and $\beta$) often cause erratic,
    suboptimal performance.


    A variant of the Levenberg-Marquardt method was developed in the 1970s that fixed
    the above drawback. It was popularized by Moré in his well written 1978 paper
    [133]. Eventually this method of came to be known as *trust region* and was adopted
    in nearly all standard software packages, such as $\mathbf{MATLAB}^{\text{R}}$
    Optimization Toolbox, MINPACK [134], ODRPACK [22, 23], etc. We describe its main
    ideas here, referring to [133] for further technical details.


    **Geometric description of Levenberg-Marquardt.** The Levenberg-Marquardt method
    can be interpreted geometrically as follows. Recall that an iteration of the Gauss-Newton
    method consists of minimization of the quadratic function


    ```

    $$\mathcal{L}(\mathbf{a}+\mathbf{h}) = \| \mathbf{g}(\mathbf{a}) + \mathbf{J}\mathbf{h}
    \|^2,$$

    ```


    which approximates the given function $\mathcal{G}(\mathbf{a}+\mathbf{h})$ in
