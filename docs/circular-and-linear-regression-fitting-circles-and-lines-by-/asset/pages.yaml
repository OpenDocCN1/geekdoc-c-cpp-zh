    hence $\eta$ is an eigenvalue of $\mathbf{Y} \mathbf{B}^{-1} \mathbf{Y}$; also
    note that $\mathbf{Y} = \mathbf{Y}^{T}$. Thus, by Sylvester’s law of inertia $[78]$
    the matrix $\mathbf{B}^{-1} (\mathbf{X}^{T} \mathbf{X})$ has the same signature
