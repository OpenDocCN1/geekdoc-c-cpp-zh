  md: 'and $\mathbf{I}_n$ denotes the identity matrix of order $n$. By using the block
    matrix inversion lemma (see, e.g., p. 26 in [128] we obtain


    ```

    $\left[\begin{array}{cc} \mathbf{E} & \mathbf{G}^{T} \\ \mathbf{G} & \mathbf{I}_n
    \end{array}\right]^{-1} = \left[\begin{array}{cc} \left(\mathbf{E}-\mathbf{G}^{T}
    \mathbf{G}\right)^{-1} & -\left(\mathbf{E}-\mathbf{G}^{T} \mathbf{G}\right)^{-1}
    \mathbf{G}^{T} \\ -\mathbf{G}\left(\mathbf{E}-\mathbf{G}^{T} \mathbf{G}\right)^{-1}
    & \left(\mathbf{I}_n-\mathbf{G} \mathbf{E}^{-1} \mathbf{G}^{T}\right)^{-1} \end{array}\right].$

    ```


    (One can easily verify this formula by direct multiplication.)


    The $2 \times 2$ top left block of this matrix is the most interesting to us as
    it corresponds to the principal parameters $\theta$ and $C$. This block is


    ```

    $\left(\mathbf{E}-\mathbf{G}^{T} \mathbf{G}\right)^{-1} = \left[\begin{array}{cc}
    \sum t_i^2 & \sum t_i \\ \sum t_i & n \end{array}\right]^{-1} = \frac{1}{nS}\left[\begin{array}{cc}
    n & -\sum t_i \\ -\sum t_i & \sum t_i^2 \end{array}\right],$

    ```


    because the determinant here is


    ```

    $n \sum t_i^2 - \left(\sum t_i\right)^2 = nS.$

    ```


    Therefore, the Cramer-Rao lower bound on the covariance matrix of the estimates
    of the principal parameters is


    ```

    $\operatorname{Cov}\left(\hat{\theta}, \hat{C}\right) \geq \frac{\sigma^2}{S}\left[\begin{array}{cc}
    \frac{1}{n} & -\frac{1}{n} \sum t_i \\ -\frac{1}{n} \sum t_i & \frac{1}{n} \sum
    t_i^2 \end{array}\right]. \quad (2.30)$

    ```


    In particular,


    ```

    $\operatorname{Var}\left(\hat{\theta}\right) \geq \frac{\sigma^2}{S}$

    ```


    which is exactly our first order approximation (2.24) to the actual variance of
    $\hat{\theta}$. In fact, all the components of the matrix (2.30) are equal to
    the leading terms of the actual variances and covariances obtained in Section
    2.6, because


    ```

    $\frac{1}{n} \sum t_i = \frac{1}{n}\left(\bar{A} \sum \bar{y}_i - \bar{B} \sum
    \bar{x}_i\right) = \bar{A} \bar{\bar{y}} - \bar{B} \bar{\bar{x}}$

    ```


    and


    ```

    $\frac{1}{n} \sum t_i^2 = \frac{S}{n} + \frac{1}{n^2}\left(\sum t_i\right)^2 =
    \frac{S}{n} + \left(\bar{A} \bar{\bar{y}} - \bar{B} \bar{\bar{x}}\right)^2.$

    ```


    **Concluding remarks.** Our analysis shows that, to the leading order, the estimators
    of $\theta$ and $C$ are optimal. However, the more accurate second order approximation
    (2.25) indicates that our estimates are not exactly optimal; in particular the
    (approximate) efficiency of $\hat{\theta}$ is


    ```

    $\left(1+\frac{(n-1)\sigma^2}{S}\right)^{-1}. \quad (2.31)$

    ```


    This is close to one when the ratio $(n-1)\sigma^2/S$ is small, i.e., when the
    deviations of the data points *from* the line are small compared to their spread
    *along* the line.'
