    of fitting circles, many researchers just drop it and use the slightly simplified
    rules


    $x'' = \frac{x}{x^2 + y^2}, \quad \quad y'' = \frac{y}{x^2 + y^2}. \quad \quad
    \quad (8.20)$


    From now on we will call this map the inversion $\mathscr{F}$. It has all the
    properties of the actual inversion mentioned above.


    The map $\mathscr{F}$ has many remarkable properties summarized next.


    **Theorem 17** *The map $\mathscr{F}$ is conformal at every point $(x, y)$, except
    the origin $(0, 0)$. This means that its derivative $D\mathscr{F}$ (the linear
    part of $\mathscr{F}$) preserves angles between tangent vectors and it expands
    (or contracts) all tangent vectors uniformly. Precisely, if $(dx, dy)$ is a tangent
    vector at $(x, y) \neq (0, 0)$, then its image $(dx'', dy'') = D\mathscr{F}(dx,
    dy)$ has length*


    $\|(dx'', dy'')\| = (x^2 + y^2)^{-1} \|(dx, dy)\|.$


    *Note that the factor $(x^2 + y^2)^{-1}$ does not depend on the direction of the
    tangent vector $(dx, dy)$.*


    We have seen conformal maps in Section 8.3. This theorem can be verified directly,
    by computing the matrix $D\mathscr{F}$ of partial derivatives of the formulas
    (8.20) with respect to $x$ and $y$, we leave this exercise to the reader.


    **Theorem 18** *The map $\mathscr{F}$ transforms every line into a line or a circle.
    It transforms every circle into a line or a circle. In particular, every circle
    passing through the origin $(0, 0)$ is transformed into a line not passing through
    the origin $(0, 0)$.*


    This theorem is illustrated in Fig. 8.2.


    **Inversion-based circle fit.** The key fact in the last theorem is that $\mathscr{F}$
    transforms *some* circles (precisely, those passing through the origin) to lines
    and back.


