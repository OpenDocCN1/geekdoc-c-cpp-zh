  md: '**General invariance under translations.** We present the final results omit-ting
    tedious details. Our analysis shows that an algebraic fit with constraint matrix
    **N** is invariant under translations $T_{c,d}$ whenever **N** = **F**$^{T}$**NF**,
    where the matrix **F** is given by (5.34). This happens precisely if **N** is
    a linear combination of **K** and **B**, i.e., **N** = $\alpha$**K** + $\beta$**B**,
    or


    **N** = $$\begin{bmatrix} \alpha & 0 & 0 & -2\beta \\ 0 & \beta & 0 & 0 \\ 0 &
    0 & \beta & 0 \\ -2\beta & 0 & 0 & 0 \end{bmatrix}$$.  (5.40)


    **General invariance under rotations.** Next, an algebraic fit with constraint
    matrix **N** is invariant under rotations $R_{\theta}$ whenever **N** = **F**$^{T}$**NF**,
    but now the matrix **F** is given by (5.37). This happens precisely if **N** has
    form


    **N** = $$\begin{bmatrix} \alpha & 0 & 0 & \gamma \\ 0 & \beta & 0 & 0 \\ 0 &
    0 & \beta & 0 \\ \gamma & 0 & 0 & \delta \end{bmatrix}$$,  (5.41)


    where $\alpha, \beta, \gamma, \delta$ are arbitrary constants. Thus the invariance
    under rotations requires a little less than that under translations.


    **General invariance under similarities.** Lastly, consider the invariance of
    an algebraic fit with constraint matrix **N** under similarities $(x,y) \rightarrow
    (cx, cy)$. In that case the parameter vector **A** = $(A,B,C,D)$ changes by the
    rule


    **A** = $(A,B,C,D) \rightarrow$ **A**$_{c}$ = $(A/c^{2}, B/c, C/c, D)$.


    Hence we need the expression $P(c) = $ **A**$_{c}^{T}$**NA**$_{c}$ to be a homogeneous
    polynomial in $c$ (i.e., all its terms must have the same degree with respect
    to $c$) so that $c$ could be just canceled out. For the matrix **N** in (5.40)
    we have


    $P(c) = $ **A**$_{c}^{T}$**NA**$_{c}$ = $\alpha A^{2}c^{-4} + \beta(B^{2} + C^{2}
    - 4AD)c^{-2}$.


    This expression is homogeneous in $c$ only if $\alpha = 0$ (which gives the Pratt
    fit) or $\beta = 0$ (which is the Kása fit).


    **Final conclusion.** The only algebraic fits with constraint matrix **N** that
    are invariant under translations, rotations, and similarities are Kása and Pratt
    fits. We should emphasize that our constraint matrix **N** is assumed to be constant;
    we will see other constraint matrices, which depend on **X**, later.


