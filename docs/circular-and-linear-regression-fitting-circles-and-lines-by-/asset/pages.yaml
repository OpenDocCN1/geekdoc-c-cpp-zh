    $$

    \bar{\bar{x}} = \sum_{i=1}^n \tilde{x}_i \quad \text{and} \quad \bar{\bar{y}}
    = \sum_{i=1}^n \tilde{y}_i

    $$

    are the sample means of the true values. The extra term $\frac{1}{n}$ in (2.26)
    comes from the fact that $\bar{x}$ and $\bar{y}$ (the sample means of the observations)
    are random variables correlated with $\hat{A}$ and $\hat{B}$.


    **Covariances**. For the sake of completeness, we include three more covariances

    $$

    \begin{aligned}

    \operatorname{Cov}(\hat{A}, \hat{C}) &= \frac{\sigma^2 \bar{B}(A\bar{\bar{y}}
    - \bar{B}\bar{\bar{x}})}{S} + \mathscr{O}(\sigma^4)\\

    \operatorname{Cov}(\hat{B}, \hat{C}) &= -\frac{\sigma^2 \bar{A}(A\bar{\bar{y}}
    - \bar{B}\bar{\bar{x}})}{S} + \mathscr{O}(\sigma^4)\\

    \operatorname{Cov}(\hat{\theta}, \hat{C}) &= -\frac{\sigma^2(A\bar{\bar{y}} -
    \bar{B}\bar{\bar{x}})}{S} + \mathscr{O}(\sigma^4).

    \end{aligned}

    $$


    **Practical remarks**. In practice, the true values that appear in the above formulas
    are not available. Normally, one makes further approximation replacing the true
    points with the observed ones and the true parameter values with their estimates
    (this does not alter the above expressions, the resulting errors are absorbed
    by the $\mathscr{O}(\sigma^4)$ terms). In the same fashion, one estimates $S$
    by

    $$

    \hat{S} = s_{xx} + s_{yy}

    $$

    and $\sigma^2$ by

    $$

    \hat{\sigma}^2 = \frac{1}{n} \sum_{i=1}^n (\hat{A}x_i + \hat{B}y_i + \hat{C})^2.
    \tag{2.27}

    $$

    Gleser [73] and Patefield [143] show that all these estimates are strongly consistent,
    thus their use in the construction of confidence intervals is justified.


    # ### 2.7 Approximate analysis


    **Taylor approximation versus rigorous proofs.** In the previous section, we used
    Taylor expansion to derive formulas for the variances and covariances of all important
    estimates based on the second order approximation (2.25) to the variance $\operatorname{Var}(\hat{\theta})$,
    whose proof was left “behind the scene” (we simply referred to the exact results
    by Anderson [7] and Kunitomo [118]).

    In this section we derive (2.25) itself by Taylor approximation without using
    the exact results. Thus we demonstrate that Taylor expansion, if properly used,
    is a powerful (albeit not rigorous) tool, which allows one to obtain correct approximations
    even including higher order terms. This will help us in the studies of nonlinear
    regression later, in particular circles and ellipses.'
