    tasks, one of them was fitting ellipses to data (the other, fundamental matrix
    computation, is not covered here). His method instantly captured attention of
    the computer vision community due to several well presented examples, in which
    an apparent bias was removed entirely. The effect of Kanatani’s first publications
    was spectacular. But the theoretical construction of his method was quite obscure,
    and for several years it remained surrounded by mystery [101, 182, 181].


    It took the community almost a decade to fully understand Kanatani’s method. In
    2001, Chojnacki et al. [47] published a lengthy article aptly titled “Rationalising
    the renormalisation method of Kanatani,” where they thoroughly compared Kanatani’s
    method to other popular fitting algorithms and placed all of them within a unified
    framework. By now technical aspects of Kanatani’s method are well understood,
    but its statistical properties and its relation to other statistical procedures
    are not yet fully determined.


    Here we reveal a surprising fact: the renormalization method of Kanatani and the
    consistent estimator by Kukush, Markovsky, and van Huffel (K MvH, Section 7.10)
    are identical, they are twins! This is all the more surprising because Kanatani
    never aimed at consistency, his only stated goal was bias reduction. Nonetheless
    his algorithm produces exactly the same results as the consistent K MvH; in fact
    its practical implementation is perhaps superior to that of the K MvH.


    **Kanatani’s method versus the K MvH algorithm.** Kanatani studied parameter estimators
    which were based on the solution of a generalized eigenvalue problem


    ```

    MA = ηNA,                                                                 (7.68)

    ```


    where A denotes the vector of unknown parameters, and M and N are some matrices
    that may depend on both data and unknown parameters. Many ellipse fitting methods
    and fundamental matrix computation fall into this category, and so do our algebraic
    circle fits; see (7.63).


    Just like Huber (see our Section 7.8), Kanatani realized that the main source
    of bias for the estimate Â, which solves (7.68), was the biasedness of the matrix
    M. Then he constructed an unbiased version of the matrix M, which in the circle
    fitting case is the matrix M\_{unbiased}(V) given by (7.64).'
