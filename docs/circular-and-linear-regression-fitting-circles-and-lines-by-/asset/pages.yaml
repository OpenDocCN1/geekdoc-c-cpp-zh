    point $(\tilde{x}_i, \tilde{y}_i)$, hence $m = n$.


    We note that $\Theta$ is not explicitly involved in (6.4), which calls for an
    indirect approach to the maximum likelihood estimation. For convenience, we introduce
    a parameter $t$ on the curve $P(x,y;\Theta) = 0$, then it can be expressed by
    parametric equations


    $$x = u(t;\Theta) \qquad \text{and} \qquad y = v(t;\Theta)$$


    (the functions $u$ and $v$ do not have to be known explicitly; it is enough that
    they exist). Then each $\tilde{x}_i$ can be replaced by the corresponding parameter
    value $\tilde{t}_i$, $i = 1,\ldots,n$. Note that $t_1,\ldots,t_n$ are unconstrained
    parameters.


    Now the negative log-likelihood function is


    $$\begin{align} -\log L(\Theta,\sigma^2,t_1,\ldots,t_n) &= \frac{1}{2\sigma^2}
    \sum_{i=1}^{n} \left( x_i - u(t_i; \Theta) \right)^2 + \left( y_i - v(t_i; \Theta)
    \right)^2 \\ &+ \ln (2\pi\sigma^2)\cdot m/2, \tag{6.5} \end{align}$$


    where $\Theta$ appears explicitly, along with the nuisance parameters $t_1,\ldots,t_n$.


    To minimize (6.5) we use the following simple *minimization-in-steps techniques*,
    as described by Chan [31]. If $h(X, Y)$ is a function on $A \times B$, where $X
    \in A$ and $Y \in B$, then


    $$\min_{A \times B} h = \min_{A} \left( \min_{B} h \right)$$


    (provided all the minima exist).


    Accordingly, we can minimize (6.5) in two steps:


    **Step 1. Minimize (6.5) with respect to $t_1,\ldots,t_n$ when $\Theta$ and $\sigma^2$
    are kept fixed.**


    **Step 2. Minimize the resulting expression with respect to $\Theta$ and $\sigma^2$.**


    In Step 1 the curve $P(x, y; \Theta) = 0$ is kept fixed, and the minimum of (6.5)
    with respect to $t_1, \ldots, t_n$ is obviously achieved if $(x(u(t_i; \Theta)),
    y(v(t_i; \Theta)))$ is the point on the curve closest to the observed point $(x_i,
    y_i)$, i.e.,


    $$\begin{align} \min_{t_1,\ldots,t_n} \sum_{i=1}^{n} \left( x_i - u(t_i;\Theta)
    \right)^2 + \left( y_i - v(t_i;\Theta) \right)^2 = \sum_{i=1}^{n} [d_i(\Theta)]^2,
    \tag{6.6} \end{align}$$


    where $d_i(\Theta)$ denotes the geometric (orthogonal) distance from the point
    $(x_i, y_i)$ to the curve $P(x, y; \Theta) = 0$. If the curve is smooth, then
    the line passing through the points $(x_i, y_i)$ and $(u(t_i;\Theta), v(t_i;\Theta))$
    crosses the curve orthogonally. The last fact is important for the radial model,
    as it requires that the point $(x_i, y_i)$ lies on the line orthogonal to the
    curve passing through the true point; we see that this requirement will be automatically
    satisfied.'
