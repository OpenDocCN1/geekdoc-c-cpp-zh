    or a small inaccuracy of the fitting procedure may result in the circle center
    being on the “wrong side” (see the dashed arc in Fig. 3.1).


    In addition, numerical computations become unreliable: a catastrophic loss of
    accuracy may occur when two large nearly equal quantities are subtracted in (3.3).
    We call this a $problematic$, or a $singular case$ of a circle fit. We will see
    shortly that in this case even more serious problems arise than catastrophic cancellations.


    ![](img/86db288e3c266985d1648282179ae4b5_83_0.png)


    **Karimäki’s parameters.** If experiments where incomplete arcs (partially occluded
    circles) are frequent, statisticians often adopt different parametrization schemes.
    For example, in nuclear physics Karimäki [106] proposes to replace $R$ with a
    signed curvature $\rho = \pm R^{-1}$ and the center $(a, b)$ with the distance
    of the closest approach ($d$) to the origin, and the direction of propagation
    ($\phi$) at the point of closest approach, see Fig. 3.2. We will describe these
    parameters more precisely in Section 8.8. The three parameters ($\rho, d, \phi$)
    completely (and uniquely) describe the fitting circular arc, and they never have
    to take dangerously large values (unless $R \approx 0$, hence $\rho \approx \infty$,
    which is actually not a bothersome event).


    Karimäki’s parameters have a clear geometric meaning, but expressing the objective
    function $\mathcal{F}$ in terms of $(\rho, d, \phi)$ leads to cumbersome formulas;
    see [106] and our Section 8.8. Another pitfall in Karimäki’s scheme is that for
    circles centered on the origin, the direction $\phi$ becomes indeterminate. If
    the center of the fitting circle gets close to the origin, numerical algorithms
    cannot handle the $\phi$ parameter adequately and may get stuck.


    **Algebraic parameters.** A more elegant scheme was proposed by Pratt [150] and
    others [67], which describes circles by an algebraic equation,


    ```

    A(x^{2} + y^{2}) + Bx + Cy + D = 0\tag{3.8}

    ```


    with an obvious constraint $A \neq 0$ (otherwise this equation describes a line)
    and a less obvious constraint


    ```

    B^{2} + C^{2} - 4AD > 0.\tag{3.9}

    ```'
