    **Different practical requirements.** All these applications involve fitting circles
    to planar images, but the character of data and the requirements may differ widely.
    In some cases one deals with data points sampled along a full circle (like in
    a human iris image or a log in lumber industry). In other cases the data are badly
    incomplete — one observes just a small arc of a big circle.


    In some applications (e.g., in medicine) the fit must be very accurate and the
    computational cost is not an issue. Others are characterized by mass data processing
    (for instance, in high energy physics, millions of particle tracks per day can
    be produced by an accelerator), and the processing speed is of paramount importance.
    These variations certainly dictate different approaches to the fitting problem,
    as we will see below.


    # ## 3.2 Parametrization


    **Standard parameters.** To fit a circle to observed points { (x_i, y_i) } by
    orthogonal least squares one minimizes the sum of squares


    ```

    $$ \mathscr{F} = \sum_{i=1}^{n} d_i^2, \quad\quad\quad (3.1) $$

    ```


    where d_i is the (geometric) distance from the data point (x_i, y_i) to the hypothetical
    circle. The canonical equation of a circle is


    ```

    $$ (x-a)^2+(y-b)^2=R^2, \quad\quad\quad (3.2) $$

    ```


    where (a, b) is its center and R its radius; then the (signed) distance is given
    by


    ```

    $$ d_i = \sqrt{(x_i-a)^2+(y_i-b)^2} - R. \quad\quad\quad (3.3) $$

    ```


    Note that d_i > 0 for points outside the circle and d_i < 0 inside it. Hence


    ```

    $$ \mathscr{F}(a, b, R) = \sum_{i=1}^{n} \big[\sqrt{(x_i-a)^2+(y_i-b)^2} - R\big]^2.
    \quad\quad\quad (3.4) $$

    ```


    **Elimination of R.** This function is just a quadratic polynomial in R, hence
    𝓕 has a unique global (conditional) minimum in R, when the other two variables
    a and b are kept fixed. That conditional minimum can be easily found. If we denote


    ```

    $$ r_i = r_i(a, b) = \sqrt{(x_i-a)^2+(y_i-b)^2}, \quad\quad\quad (3.5) $$

    ```'
