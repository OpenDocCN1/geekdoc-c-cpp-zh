  md: 'which is almost identical to the circles returned by the Pratt and Taubin fits;
    see Section 5.12.


    More experimental tests involving the Hyper fit are reported in Section 8.10.


    Summary. All the known circle fits (geometric and algebraic) have the same variance,
    to the leading order. The relative difference between them can be traced to higher
    order terms in the expansion for the mean squared error. The second leading term
    in that expansion is the essential bias, for which we have derived explicit expressions.
    Circle fits with smaller essential bias perform better overall. This explains
    a poor performance of the Kása fit, a moderate performance of the Pratt fit, and
    a better performance of the Taubin and geometric fits (in this order). We showed
    that there is no natural lower bound on the essential bias. In fact we constructed
    an algebraic fit with zero essential bias (the Hyper fit), which is nearly as
    accurate as the geometric fit, and sometimes exceeds it in accuracy.


    # 7.7 Inconsistency of circular fits


    We have seen in Section 6.10 that curve fitting methods are, generally, biased
    and inconsistent. Here we examine these features closely for our circle fits.


    Inconsistency of circular fits. In the late 1980s Berman and Culpin [17, 18] investigated
    the inconsistency of two popular circle fitting algorithms: the geometric fit
    and the algebraic Kása fit. We present their results here and add other circle
    fits for comparison.


    We use the notation and results of Section 6.10. According to Theorem 11, the
    limit point $(a^{*}, b^{*}, R^{*})$ of the geometric circle fit satisfies


    $$(a_g^{*}, b_g^{*}, R_g^{*}) = \operatorname{argmin} \int \left[ \left( \sqrt{(x-a)^2
    + (y-b)^2} - R \right)^2 d\mathbb{P}\sigma \right] \tag{7.54}$$


    (here the subscript “g” stands for “geometric”). One can easily minimize (7.54)
    with respect to $R$ and get


    $$R_g^{*} = \int \sqrt{(x-a_g^{*})^2 + (y-b_g^{*})^2} d\mathbb{P}\sigma.$$


    For the Kása fit, we have


    $$(a_\mathrm{K}^{*}, b_\mathrm{K}^{*}, R_\mathrm{K}^{*}) = \operatorname{argmin}
    \int \left[ (x-a)^2 + (y-b)^2 - R^2 \right]^2 d\mathbb{P}\sigma.$$


    Again, minimization with respect to $R^2$ gives


    $$(R_\mathrm{K}^{*})^2 = \int (x-a_\mathrm{K}^{*})^2 + (y-b_\mathrm{K}^{*})^2
    d\mathbb{P}\sigma.$$'
