  md: 'The exact meaning of the word “typical” will be clarified in the proof. Our
    proof is quite long, but it reveals many useful facts beyond the existence of
    the two valleys, so we present it in full in the next section.


    # **3.8 Proof of Two Valley Theorem**


    This section is devoted to the proof of Theorem 7. We will find the two valleys
    by examining the behavior of the objective function \mathscr{F} for large *a*
    and *b*, i.e., as a^2 + b^2 → ∞. In that case *R* → ∞ as well, due to (3.6), and
    the fitting arc is close to a straight line, so we can use some facts established
    in Chapter 2.


    **Taylor expansion.** We introduce a new variable D^2 = a^2 + b^2 and express
    a = D cos \varphi and b = D sin \varphi for some \varphi \in [0, 2\pi). Then (3.3)
    takes form


    ```

    d_i = \sqrt{(x_i - D \cos \varphi)^2 + (y_i - D \sin \varphi)^2} - R

    = \sqrt{z_i - 2 u_i D + D^2} - R,

    ```


    where we use shorthand notation


    ```

    z_i = x_i^2 + y_i^2 \quad \text{ and } \quad u_i = x_i \cos \varphi + y_i \sin
    \varphi.

    ```


    Expanding *d_i* into a Taylor series gives


    ```

    d_i = D - u_i + \frac{z_i - u_i^2}{2D} - R + \mathcal{O}(1/D^2).

    ```


    Note that


    ```

    z_i - u_i^2 = v_i^2 \quad \text{ where } \quad v_i = -x_i \sin \varphi + y_i \cos
    \varphi.

    ```


    Due to (3.6) we have $\sum d_i = 0$, hence


    ```

    D - R = \bar{u} - \frac{\overline{vv}}{2D} + \mathcal{O}(1/D^2),

    ```


    where we use “sample mean” notation $\bar{u} = \frac{1}{n} \sum u_i$, $\overline{vv}
    = \frac{1}{n} \sum v_i^2$, etc. Introducing another new variable $\delta = 1/D$
    we obtain


    ```

    d_i = -(u_i - \bar{u}) + \delta (v_i^2 - \overline{vv})/2 + \mathcal{O}(\delta^2).

    ```


    Squaring and averaging over *i* gives


    ```

    \frac{1}{n} \mathscr{F} = \overline{uu} - \bar{u}^2 - [\overline{vv} - \overline{uvv}]\delta
    + \mathcal{O}(\delta^2). \quad (3.19)

    ```


    This is a crucial expansion; we rewrite it, for brevity, as


    ```

    \frac{1}{n} \mathscr{F} = f_0 + f_1 \delta + \mathcal{O}(\delta^2).

    ```'
