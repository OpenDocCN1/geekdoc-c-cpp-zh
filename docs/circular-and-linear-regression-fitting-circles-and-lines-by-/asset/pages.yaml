    (7.66). For all $V<\hat{V}$ the matrix $\mathbf{M}_{\text{unbiased}}(V)$ is positive
    definite, and for all $V>\hat{V}$ that matrix is indefinite, i.e., it has at least
    one negative eigenvalue.*


    They actually proved that the minimal eigenvalue of the variable matrix $\mathbf{M}_{\text{unbiased}}(V)$,
    let us call it $\lambda_{\min}(V)$, is a continuous function of $V$ which is strictly
    positive for $V<\hat{V}$ and strictly negative for $V>\hat{V}$. Based on this
    theorem, Shklyar, Kukush, Markovsky, and van Huffel [167] propose to simultaneously
    estimate $\mathbf{A}$ and $V$ via the bisection method as follows:


    +   **Step 1.** Set $V_{\mathrm{L}}=0$ so that $\lambda_{\min}(V_{\mathrm{L}})
    \geq 0$. If $\lambda_{\min}(V_{\mathrm{L}})=0$, go to Step 4. Set $V_{\mathrm{R}}$
    to a large enough value such that $\lambda_{\min}(V_{\mathrm{R}})<0$. (It is shown
    in [167] that $V_{\mathrm{R}}$ may always be set to the minimum eigenvalue of
    the scatter matrix $\mathbf{S}$ defined by (1.5).)


    +   **Step 2.** Compute $V_{\mathrm{M}}=\frac{1}{2}(V_{\mathrm{L}}+V_{\mathrm{R}})$.


    +   **Step 3.** If $\lambda_{\min}(V_{\mathrm{M}}) \geq 0$, reset $V_{\mathrm{L}}=V_{\mathrm{M}}$,
    otherwise reset $V_{\mathrm{R}}=V_{\mathrm{M}}$. If $\lambda_{\min}(V_{\mathrm{L}})=0$
    or $V_{\mathrm{R}}-V_{\mathrm{L}}<\text{tolerance}$, go to Step 4. Otherwise return
    to Step 2.


