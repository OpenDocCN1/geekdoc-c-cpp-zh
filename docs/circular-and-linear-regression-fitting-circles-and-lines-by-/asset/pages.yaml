    # **7.9** Asymptotically unbiased and consistent circle fits


    Our construction of the unbiased versions of $\mathbf{M}$ and $\mathbf{N}$ for
    the algebraic circle fits is similar to that developed for more general quadratic
    models by Kanatani $[93, 94, 95]$ and by Kukush, Markovsky, and van Huffel $[114,
    115, 130, 167]$.


    First recall the structure of the matrix $\mathbf{M}$:


    ```

    $\mathbf{M} = \begin{bmatrix} \bar{zz} & \bar{xz} & \bar{yz} & \bar{z} \\ \bar{zx}
    & \bar{xx} & \bar{xy} & \bar{x} \\ \bar{zy} & \bar{xy} & \bar{yy} & \bar{y} \\
    \bar{z} & \bar{x} & \bar{y} & 1 \end{bmatrix}$ .

    ```


    A straightforward calculation shows that the mean values of its components are


    ```

    $\mathbb{E}(\bar{x}) = \tilde{x}$,   \qquad$ $\mathbb{E}(\bar{y}) = \tilde{y}$,   \qquad$
    $\mathbb{E}(\bar{xy}) = \tilde{x}\tilde{y}$,

    $\mathbb{E}(\bar{xx}) = \tilde{x}\tilde{x} + V$,   \qquad$ $\mathbb{E}(\bar{yy})
    = \tilde{y}\tilde{y} + V$,   \qquad$ $\mathbb{E}(\bar{z}) = \tilde{z} + 2V$,

    $\mathbb{E}(\bar{xz}) = \tilde{x}\tilde{z} + 4\tilde{x}V$,   \qquad$ $\mathbb{E}(\bar{yz})
    = \tilde{y}\tilde{z} + 4\tilde{y}V$,   \qquad$ $\mathbb{E}(\bar{zz}) = \tilde{z}\tilde{z}
    + 8\tilde{z}V + 8V^2$,

    ```


    where we denote, for convenience, $V = \sigma^2$, and our "sample mean" notation
    is applied to the true points, i.e., $\bar{x} = \frac{1}{n} \sum \tilde{x}_i$,
    etc.


    Now it follows immediately that


    ```

    $\mathbb{E}(\bar{xx} - V) = \tilde{x}\tilde{x}$,   \qquad$ $\mathbb{E}(\bar{yy}
    - V) = \tilde{y}\tilde{y}$,   \qquad$ $\mathbb{E}(\bar{z} - 2V) = \tilde{z}$,

    $\mathbb{E}(\bar{xz} - 4\tilde{x}V) = \tilde{x}\tilde{z}$,   \qquad$ $\mathbb{E}(\bar{yz}
    - 4\tilde{y}V) = \tilde{y}\tilde{z}$,   \qquad$ $\mathbb{E}(\bar{zz} - 8\tilde{z}V
    + 8V^2) = \tilde{z}\tilde{z}$.

    ```'
