  md: '**SVD-based Hyper fit.** A numerically stable implementation of the Hyper fit
    is very similar to the SVD-based Pratt fit developed in Section 5.5. First, one
    computes the (short) SVD, $\mathbf{X} = \mathbf{U}\mathbf{\Sigma}\mathbf{V}^{T}$,
    of the matrix $\mathbf{X}$. If its smallest singular value, $\sigma_{4}$, is less
    than a predefined tolerance $\epsilon$ (say, $\epsilon=10^{-12}$), then the solution
    $\mathbf{A}$ is simply the corresponding right singular vector (i.e., the fourth
    column of the $\mathbf{V}$ matrix). In the regular case ($\sigma_{4} \geq \epsilon$),
    one forms $\mathbf{Y} = \mathbf{V}\Sigma\mathbf{V}^{T}$ and finds the eigenpairs
    of the symmetric matrix $\mathbf{Y H}^{*-1}\mathbf{Y}$. Selecting the eigenpair
    $\left(\eta,\mathbf{A}_{*}\right)$ with the smallest positive eigenvalue and computing
    $\mathbf{A} = \mathbf{Y}^{-1}\mathbf{A}_{*}$ completes the solution. The corresponding
    MATLAB$^{\circled{R}}$ code is available from [84].


    **An improved Hyper fit.** Rangarajan and Kanatani [152] note that one can eliminate
    the entire $\widehat{O}\left(\sigma^{2}\right)$ bias by adopting the constraint
    matrix $\mathbf{N} = \mathbf{H}^{*}$ given by (7.40); this fact is clear from
    (7.39). The matrix $\mathbf{H}^{*}$ is computationally more complex than our $\mathbf{H}$
    (it requires finding the pseudo-inverse of $\mathbf{M}$), but numerical experiments
    [152] show that the accuracy of the resulting fit is higher than that of our Hyper
    fit for small $n$ (such as $n = 10$ or $n = 20$); for larger $n$''s there is apparently
    no difference in accuracy.


    # 7.6 Algebraic circle fits in natural parameters


    Our next goal is to express the covariance and the essential bias of algebraic
    circle fits in terms of the more natural geometric parameters $(a,b, R)$.


    **Transition between parameter schemes.** The conversion formulas between the
    algebraic circle parameters $(A,B,C,D)$ and its geometric characteristics $(a,b,
    R)$, see (3.11), are


    ```

    $a = -\frac{B}{2A}$, $b = -\frac{C}{2A}$, $R^2 = \frac{B^2 + C^2 - 4AD}{4A^2}$.
    (7.46)

    ```


    Taking partial derivatives gives a $3 \times 4$ "Jacobian" matrix


    ```

    $\mathbf{J} = \left[\begin{array}{cccc} \frac{B}{2A^2} & -\frac{1}{2A} & 0 & 0
    \\ \frac{C}{2A^2} & 0 & -\frac{1}{2A} & 0 \\ -\frac{R}{A} - \frac{D}{2A^2R} &
    \frac{B}{4A^2R} & \frac{C}{4A^2R} & -\frac{1}{2AR} \end{array}\right]$.

    ```


    Thus we have


    ```

    $\Delta_{1}\Theta = \ddot{\mathbf{J}}\Delta\mathbf{A}$ and $\Delta_{2}\Theta =
    \ddot{\mathbf{J}}\Delta\mathbf{2A} + \widetilde{O}_{P}\left(\sigma^{2} / n\right)$,
    (7.47)

    ```


    where $\ddot{\mathbf{J}}$ denotes the matrix $\mathbf{J}$ at the true parameters
    $\left(\bar{A}, \bar{B}, \bar{C}, \bar{D}\right)$. The remainder term $\widetilde{O}_{P}\left(\sigma^{2}
    / n\right)$ comes from the second order partial derivatives of $(a, b, R)$ with
    respect to $(A, B, C, D)$. For example


    ```

    $\Delta_{2} a = (\nabla a)^{T}(\Delta_{2}\mathbf{A}) + \frac{1}{2}\left(\Delta_{1}\mathbf{A}\right)^{T}\left(\nabla^{2}
    a\right)\left(\Delta_{1}\mathbf{A}\right)$, (7.48)

    ```'
