    This choice of the $w_{ij}$ conveniently cancels the denominator in (5.9) making
    the computations even simpler. Of course, generally speaking, the chord method
    is very impractical: as there $n(n-1)/2$ chords joining $n$ data points, the method
    takes $\mathcal{O}(n^2)$ flops, while all conventional circle fits require $\mathcal{O}(n)$
    flops.


    With weights defined by (5.10), the chord method happens to be equivalent to the
    Kåsa algorithm, they produce the same circle center $(a,b)$; this remarkable relation
    was noted and verified by Umbach and Jones [184].


    **Invariance under translations and rotations.** We see now that the Kåsa method
    can be defined geometrically (actually, in three different ways, as described
    above). This fact implies that the resulting fit is invariant under translations
    and rotations, which is a very important feature of any curve fitting algorithm,
    cf. Section 4.11. Therefore, without loss of generality, we can center the data
    set to ensure $\bar{x}=\bar{y}=0$ and rotate the coordinate axes to ensure $\overline{xy}=0$
    (this will make the system (5.5) diagonal).


    **Existence and uniqueness.** Next we investigate the existence and uniqueness
    of the Kåsa fit (5.1). The matrix of coefficients of the system (5.5) is $\mathbf{X}^T\mathbf{X}$,
    where


    ```

    $$\mathbf{X}=\begin{bmatrix}x_1&y_1&1\\\ddots&\ddots&\ddots\\x_n&y_n&1\end{bmatrix}\tag{5.11}$$

    ```


    is the $n \times 3$ “data matrix,” thus the system (5.5) is always positive semi-definite.


    It is singular if and only if there exists a nonzero vector $\mathbf{u}=(p,q,r)$
    such that $\mathbf{X}\mathbf{u}=\mathbf{0}$, i.e., $px_i+qy_i+r=0$ for all $i$.
    This means precisely that the data points $(x_i,y_i)$ are collinear. Hence, unless
    the data are collinear, the Kåsa system (5.5) is positive definite and admits
    a unique solution.


