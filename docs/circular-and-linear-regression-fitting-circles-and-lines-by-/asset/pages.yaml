    Table 5.3: Comparison of three algebraic circle fits.


    **General remarks on numerical stability.** It is common nowadays to require the
    use of numerically stable procedures (such as QR and SVD) in matrix computations
    and avoid fast but unstable solutions (e.g., forming "normal equations"). However
    in applied statistics the significance of numerical stability is diminished by
    the very nature of statistical problems, because round-off errors that occur in
    numerically unstable algorithms are often far smaller than uncertainties resulting
    from statistical errors in data.


    For algebraic circle fits, the issue of numerical stability surfaces only when
    the relevant matrices become nearly singular, which happens in two cases: (i)
    the data points are almost on a circle, i.e., $\sigma \approx 0$, and (ii) the
    fitting circular arc is nearly flat, i.e., $R \approx \infty$. Both cases are
    characterized by a small ratio $\sigma/R$.


    We have tested experimentally the performance of numerically stable (SVD-based)
    algebraic circle fits versus their unstable (Newton-based) counterparts and found
    that they performed almost identically under all realistic conditions. The difference
    between them becomes noticeable only when $\sigma/R \lesssim 10^{-12}$, which
    is an extremely rare case.


    Even in those extreme cases practical advantages of numerically stable fits are
    doubtful. For example, if $R \sim 1$ and $\sigma \sim 10^{-12}$, then stable fits
    determine the circle parameters to within $\sim 10^{-12}$, while unstable fits
    are accurate to within $10^{-6}$, which practically looks just as good. As another
    extreme, let $\sigma \sim 1$ and $R \sim 10^{12}$; in that case an accurate estimation
    of the circle radius and center seems rather pointless anyway; one can just as
    well fit the data with a straight line.


    In our MATLAB code bank, we supply both stable and unstable versions for algebraic
    circle fits.


