  md: 'turbed values:


    ```

    \begin{equation}

    x_i = \tilde{x}_i + \delta_i, \quad y_i = \tilde{y}_i + \varepsilon_i, \quad i=1,
    \ldots, n.

    \tag{1.9}

    \end{equation}

    ```


    Here $\delta_1, \ldots, \delta_n, \varepsilon_1, \ldots, \varepsilon_n$ are $2n$
    independent random variables with zero mean. In the simplest case, one can assume
    that $\delta_i$''s have a common variance $\sigma_\tilde{x}^2$ and $\varepsilon_i$''s
    have a common variance $\sigma_\tilde{y}^2$. Furthermore, it is common to assume
    that $\delta_i$ and $\varepsilon_i$ are normally distributed, i.e.


    ```

    \begin{equation}

    \delta_i \sim N(0, \sigma_\tilde{x}^2) \quad \text{ and } \quad \varepsilon_i
    \sim N(0, \sigma_\tilde{y}^2).

    \tag{1.10}

    \end{equation}

    ```


    We also need to make some assumptions about the true values $\tilde{x}_i$''s and
    $\tilde{y}_i$''s, as they are neither random observations nor the model parameters
    (yet). There are two basic ways of treating these ‘intermediate'' objects.


    First, the true values $\tilde{x}_i$''s and $\tilde{y}_i$''s may be regarded as
    fixed (nonrandom), then they have to be treated as additional parameters. They
    are sometimes referred to as ‘incidental'' or ‘latent'' parameters, or even ‘nuisance''
    parameters (as their values are normally of little interest). This interpretation
    of $\tilde{x}_i$''s and $\tilde{y}_i$''s is known as the *functional model*.


    Alternatively, one can regard $\tilde{x}_i$''s and $\tilde{y}_i$''s as realizations
    of some underlying random variables that have their own distribution. It is common
    to assume that $\tilde{x}_i$''s are sampled from a normal population $N(\mu, \sigma^2)$,
    and then $\tilde{y}_i$''s are computed by $\tilde{y}_i = g(\tilde{x}_i)$. In that
    case $\delta_i$ and $\varepsilon_i$ are usually assumed to be independent of $\tilde{x}_i$''s
    and $\tilde{y}_i$''s. The mean $\mu$ and variance $\sigma^2$ of the normal population
    of $\tilde{x}_i$''s can be then estimated along with the parameters of the unknown
    function $g(\tilde{x})$. This treatment of the true values is known as the *structural
    model*.


    This terminology is not quite intuitive, but it is currently adopted in the statistics
    literature. It goes back to Kendall''s works [109, 110] in the 1950s and became
    popular after the first publication of Kendall and Stuart''s book [111]. Fuller
    [66] suggests a simple way of remembering it: the model is Functional (F) if the
    true points are Fixed; and the model is Structural (S) if the true points are
    Stochastic.


    Before we turn to the solution of the EIV regression problem (which is typified
    by the iron density example), we describe a special version of the EIV model,
    which constitutes the main subject of this book.


    # 1.3 Geometric fit


    In the late 1800s statisticians encountered a special case of the EIV regression
    that arose in the analysis of images (photographs, drawings, maps). For example,
    given an imperfect line on an image, one wants to straighten it up, i.e., find
    an ideal line approximating the visible line contour. To this end, one can mark
    several points on the contour and try to fit a perfect straight line to the marked
    points.'
