    It is simply impossible to present it all here.


    This chapter can only serve as an introduction to the subject. When we selected
    topics for it, our main criterion was practical relevance. We avoid going into
    the depth of theoretical analysis and only cover topics that we deem most important
    for image processing applications; i.e., we describe statistical studies which
    may have direct effect on practical results and which can explain practical observations.


    # 6.1 Statistical models


    First we need to make assumptions about the underlying probability distribution
    of observations.


    **Curves.** We assume that the curves are defined by an implicit equation


    ```

    $$ P(x, y, \Theta)=0, \qquad\qquad\qquad\qquad\qquad\qquad\qquad (6.1) $$

    ```


    where $\Theta = (\theta _ {1}, \ldots, \theta _ {k}) ^ {T}$ denotes a vector¹
    of unknown parameters to be estimated. In many cases, $P$ is a polynomial in $x$
    and $y$, and its coefficients are parameters (or some functions of parameters).
    For example, a circle is given by


    ```

    $$ (x-a)^ {2} + (y-b)^ {2} - R^ {2} = 0, $$

    ```


    hence $\Theta = (a, b, R)^ {T}$ can be regarded as a 3D parameter vector.


    **Observed data.** Each observed point $(x _ {i}, y _ {i})$ is a random (noisy)
    perturbation of a *true point* $(\tilde {x} _ {i}, \tilde {y} _ {i})$, i.e.


    ```

    $$ x_ {i} = \tilde {x} _ {i} + \delta_ {i}, \qquad y_ {i} = \tilde {y} _ {i} +
    \varepsilon_ {i}, \qquad i = 1, \ldots, n, \qquad\qquad\qquad (6.2) $$

    ```


    where $\delta_ {i}$, $\varepsilon_ {i}$, $i = 1, \ldots, n$ are small random errors
    (noise).


    The true points $(\tilde {x} _ {i}, \tilde {y} _ {i})$ are supposed to lie on
    the *true curve*, i.e., satisfy


    ```

    $$ P(\tilde {x} _ {i}, \tilde {y} _ {i}, \widehat {\Theta}) = 0, \qquad i = 1,
    \ldots, n, \qquad\qquad\qquad\qquad\qquad (6.3) $$

    ```


    where $\widehat {\Theta}$ denotes the vector of *true* (unknown) parameters. We
    also use vector notation $\mathbf {x} _ {i} = (x _ {i}, y _ {i})^ {T}$ and $\tilde
    {\mathbf {x}} _ {i} = (\tilde {x} _ {i}, \tilde {y} _ {i})^ {T}.$


    **Disturbance vectors.** The noise vectors $\mathbf {e} _ {i} = \mathbf {x} _
    {i} - \tilde {\mathbf {x}} _ {i}$ are assumed to be *independent* and have *zero
    mean*. Both assumptions are standard in the literature². Two more specific assumptions
    on the probability distribution of the noise are described below. We use the terminology
    due to Berman and Culpin [18].


    ¹ All our vectors are column vectors, thus we have to put the transposition sign
    $T$.


    ²Dependent, or correlated error vectors are occasionally treated in the literature
    [44, 57, 58].'
