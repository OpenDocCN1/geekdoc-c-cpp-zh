  md: '# DISTRIBUTION AND MOMENTS OF THE MLE


    Now, since exact probability distributions of the MLE are unavailable, one has
    to follow Anderson [7, 10] and employ the Taylor expansion to construct reasonable
    approximations; we will do that in Section 6.6.


    **Moments of the MLE.** Because exact distributions of the MLE''s are intractable,
    one cannot derive explicit formulas for their moments either (with a few exceptions,
    though, see next). For example, if one fits a straight line


    $$x \cos \varphi + y \sin \varphi + C = 0,$$


    then the distribution of the MLE $\hat{\varphi}$ happens to be symmetric about
    its true value $\varphi$ (Section 2.4), hence $\mathbb{E}(\hat{\varphi}) = \varphi$;
    in this rare case the first moment can be found precisely. However, there are
    no explicit formulas for $\operatorname{Var}(\hat{\varphi})$ even in this case.
    There are no exact formulas for $\mathbb{E}(C)$ or $\operatorname{Var}(C)$ either,
    they can only be determined approximately, as we did in Chapter 2.


    Furthermore, there is an even more disturbing fact about the moments of MLE''s,
    which may not be easy to digest. Namely, if one describes the straight line by
    $y = \alpha + \beta x$, then the moments of the corresponding MLE, $\hat{\alpha}$
    and $\hat{\beta}$, do not even exist, i.e.,


    $$\mathbb{E}(|\hat{\alpha}|) = \mathbb{E}(|\hat{\beta}|) = \infty .$$


    This means that these estimators have no mean values or variances. This fact was
    established by Anderson [7] in 1976, see our Section 1.6.


    Anderson''s discovery was rather striking; it was followed by heated discussions
    and a period of acute interest in the linear EIV problem. The basic question was:
    are the MLE $\hat{\alpha}$ and $\hat{\beta}$ statistically acceptable given that
    they have infinite mean squared error? (Well, not to mention infinite bias...)
    And what does the nonexistence of moments mean anyway, in practical terms?


    To answer these questions, Anderson, Kunitomo, and Sawa [7, 10, 118] used Taylor
    expansions up to terms of order 3 and 4 to approximate the distribution functions
    of the MLE; and the resulting approximate distributions had finite moments. Those
    approximations remarkably agreed with numerically computed characteristics of
    the actual estimators (in simulated experiments), at least in all typical cases
    (see one exception below). Anderson and Sawa [10] noted that their approximations
    were "virtually exact." We will employ the approximation techniques to more general
    curves in Section 6.6.


