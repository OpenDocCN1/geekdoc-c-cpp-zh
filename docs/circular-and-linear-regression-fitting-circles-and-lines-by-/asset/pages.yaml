  md: 'While any choice of $b$ guarantees invariance under similarities, in practice
    one can adjust $b$ empirically, depending on the type of data. We found that $b
    = 0.5$ works quite well in most cases, see the last section in this chapter.


    **Proper Riemann fit.** On the other hand, the SWFL Riemann fit can be reorganized
    if one corrects a little mistake inadvertently made by its authors in [175]. Indeed,
    the denominator $\alpha^2 + \beta^2 - 4c(\gamma + c)$ in the formula (8.10) is
    independent of the data points, but it depends on the parameters, hence it is
    improper to discard it.


    Now let us keep the denominator and again change variables according to (8.14).
    This gives us the objective function


    ```

    $\mathcal{F}_{\mathrm{Riemann}}(A,B,C,D) = \sum_{i=1}^{n} \frac{\left[A x_i +
    B x_i + C y_i + D\right]^2}{B^2 + C^2 - 4AD}$. (8.19)

    ```


    Equivalently, one can minimize


    ```

    $\mathcal{F}(A,B,C,D) = \sum_{i=1}^{n} [A x_i + B x_i + C y_i + D]^2$

    ```


    subject to the constraint


    ```

    $B^2 + C^2 - 4AD = 1.$

    ```


    Perhaps, this should be called the *proper Riemann fit*.


    However, a closer look reveals that it is nothing but our familiar Pratt fit,
    see Section 5.5. Thus the proper version of the Riemann fit is just identical
    to the Pratt fit. It is one of the best circle fits, it is invariant under translations
    and rotations, and it has good statistical properties, in particular small bias.
    We have reported its properties in our extensive error analysis in Chapter 7 and
    numerous simulated experiments there and in Chapter 5. Everything we have said
    about the Pratt fit applies to the proper Riemann fit as well.


    # ### 8.5 Inversion-based fits


    In this and the next sections we describe some more specialized circle fitting
    schemes based on conformal mappings in the complex plane.


    **Inversion.** The transformation of the complex plane that takes $\mathbf{z}
    = x + i\mathbf{y}$ to


    ```

    $\mathcal{F}(\mathbf{z}) = \frac{1}{\mathbf{z}} = \frac{x - i\mathbf{y}}{x^2 +
    y^2}$

    ```


    is called *inversion*. One can define it on the extended complex plane $\mathbb{C}$
    by setting $\mathcal{F}(0) = \infty$ and $\mathcal{F}(\infty) = 0$. It is a one-to-one
    map of $\mathbb{C}$ onto itself (a bijection), which is continuous in both directions
    (a homeomorphism). It coincides with its inverse, i.e., $\mathcal{F}^{-1} = \mathcal{F}$.'
