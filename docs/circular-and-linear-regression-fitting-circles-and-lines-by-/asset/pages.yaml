    **Final conclusions**. In this last chapter, we have seen various sophisticated
    mathematical tools (conformal maps, stereographic projection, trigonometric change
    of parameters) applied to the circle fitting problem, in an attempt to simplify
    the original objective function (4.18), decouple its variables, and produce a
    fast and reliable minimization scheme. These attempts do achieve some success,
    they provide acceptable fits under certain conditions, especially when additional
    information is available (e.g., a point on the fitting circle is given).


    But a detailed analysis shows that most of the resulting fits turn out to be just
    approximations to the algebraic circle fit proposed by Pratt (Section 5.5).'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Actually one of the new fits—the proper Riemann fit (see Section 8.4)—is identical
    to the Pratt fit, while the RTKD inversion-based fit and the Karimäki fit only
    approximate it (to various degrees).


    A special note must be made on the “improper” SWFL Riemann fit. Its original version
    published in [175, 173] is not invariant under translations and similarities,
    thus it is unreliable. To remedy the situation, we have added two steps to the
    procedure—centering and rescaling of the data points (see Section 8.4)—to enforce
    invariance. With these additional steps, the fit turns out to be fairly robust
    and occasionally beats all the other fits in our studies. Its remarkable performance
    remains to be investigated theoretically... In any case, it serves as a good evidence
    that mathematically sophisticated fits described in this chapter have great potential
    and perhaps should be developed further.'
  merge: -1
  img_proc: true
