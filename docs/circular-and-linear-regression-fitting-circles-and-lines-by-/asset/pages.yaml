    # **Natural bounds on algebraic parameters.**


    Lastly, we show that $(A, B, C, D)$, just as Karimäki parameters $(\rho, d, \varphi)$,
    never have to take arbitrarily large values (under certain natural conditions).
    As in Section 2.2, let all the data points $(x_{i}, y_{i})$ be enclosed in a rectangle
    $\mathbb{B}$ (a “bounding box”). In many experiments, all data points are naturally
    confined to a window corresponding to the physical size of the measuring device,
    so the box $\mathbb{B}$ may be known in advance, before the data are collected.
    Also let


    ```

    $$d_{\max}=\max_{i, j} \sqrt{(x_{i}-x_{j})^{2}+(y_{i}-y_{j})^{2}}$$

    ```


    denote the maximal distance between the data points.


    # **Theorem 4**


    *The best fitting circle satisfies bounds*


    ```

    $$|A| < A_{\max}, |B| < B_{\max}, |C| < C_{\max}, |D| < D_{\max} \tag{3.16}$$

    ```


    *where $A_{\max}$, $B_{\max}$, $C_{\max}$, $D_{\max}$ are determined by the size
    and location of the bounding box $\mathbb{B}$ and by $d_{\max}$.*


    Thus whatever the configuration of the data points, the parameters $(A, B, C,
    D)$ of the fitted circle stay bounded.


    *Proof.* Due to (3.6), the best fitting circle has radius $R \geq d_{\max} / n$,
    hence


    ```

    $$|A| \leq A_{\max}=n / 2 d_{\max} .$$

    ```


    Let $L$ denote the distance from the origin to the most remote point of $\mathbb{B}$.
    Just like in Section 2.2, it is easy to see that the the best fitting line or
    circle must cross $\mathbb{B}$, thus the distance from it to the origin is less
    than $L$. Substituting $x = y = 0$ into (3.13)–(3.14) gives


    ```

    $$\frac{2|D|}{1+\sqrt{1+4 A D}} \leq L .$$

    ```


    Solving this inequality for $D$ gives


    ```

    $$|D| \leq D_{\max}=10 A_{\max} L^{2} .$$

    ```


    Lastly, (3.10) gives bounds on $B$ and $C$ with


    ```

    $$B_{\max}=C_{\max}=\sqrt{1+4 A_{\max} D_{\max}} .$$

    ```


    The theorem is proved.


    □'
