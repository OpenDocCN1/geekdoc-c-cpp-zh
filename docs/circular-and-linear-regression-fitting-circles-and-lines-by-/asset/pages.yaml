    rotation, the same curve (right) does not represent any explicit function.


    However, a rotation $R_{\theta}$ of the coordinate plane transforms a polynomial
    to a different function; it becomes an implicit polynomial curve, which may not
    even allow an explicit representation $y=g(x)$. Thus explicit polynomials are
    not suited for orthogonal (geometric) fitting. The same applies to any other class
    of nonlinear explicit functions $y=g(x)$: the graph of a nonlinear function can
    always be rotated so that the resulting curve does not represent any explicit
    functional relation; see Fig. 1.11.


    A natural class of models that remain invariant under rotations and translations
    consists of implicit polynomials of a certain degree $k \geq 1$. Polynomials of
    degree $k=1$ are given by equation


    ```

    $Ax+By+C=0,$

    ```


    which represents all straight lines on the plane (including vertical and horizontal
    lines). Polynomials of degree $k=2$ are given by equation


    ```

    $Ax^{2}+By^{2}+Cxy+Dx+Ey+F=0,$

    ```


    which represents all conic sections: ellipses, hyperbolas, and parabolas, in addition
    to straight lines. This class is large enough to cover a vast majority of the
    existing applications in computer vision and pattern recognition.


