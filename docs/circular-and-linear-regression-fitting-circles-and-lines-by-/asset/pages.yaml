- pgno: 42
  md: 'We call the fitting method based on minimization of the sum of squares of orthogonal
    (geometric) distances from the data points to the fitted contour *orthogonal fit*
    or *geometric fit*. Despite the natural appeal of the orthogonal fitting line,
    the early publications [1, 2, 117] in 1877–79 passed unnoticed. Twenty years later
    the orthogonal fitting line was independently proposed by Pearson [144], and another
    20 years later, by Gini [72].


    Pearson and Gini made another important observation: the line which minimizes
    (1.12) is the major axis of the scattering ellipse associated with the data set.
    The scattering ellipse is defined by equation


    ```

    $\begin{bmatrix} x - \bar{x} \\ y - \bar{y} \end{bmatrix}^T \mathbf{S} \begin{bmatrix}
    x - \bar{x} \\ y - \bar{y} \end{bmatrix} = 1,$

    ```


    its center is $ (x̄, ȳ) $ and its axes are spanned by the eigenvectors of the
    scatter matrix **S**. This fact establishes a link between the orthogonal fit
    and the principal component analysis of linear algebra.


    Pearson [144] also estimated the angle $\theta = \tan^{-1} b$ which the fitting
    line made with the *x* axis and found a simple formula for it:


    ```

    $\tan 2\theta = \frac{2s_{xy}}{s_{xx} - s_{yy}}.$

    ```


    We leave its verification to the reader as an exercise.


    Adcock and Pearson were motivated by geometric considerations and did not use
    probabilities. Only in the 1930s their method was incorporated into the formal
    statistical analysis. Koopmans [113] (see also Lindley [126]) determined that
    the orthogonal fit provided the maximum likelihood estimate under the assumptions
    (1.9)–(1.11). Recall that the classical least squares fit (1.2) also maximizes
    the likelihood in the ordinary regression model (1.1). Thus there is a deep analogy
    between the two regression models.


    The geometric nature of the orthogonal fit makes the resulting line independent
    of the choice of the coordinate system on the image. In other words, the geometric
    fit is invariant under orthogonal transformations (rotations and translations)
    of the coordinate frame.


    The invariance under certain transformations is very important. We say that a
    fitting line is invariant under translations if changing the data coordinates
    by


    ```

    $T_{c,d}: (x,y) \mapsto (x+c, y+d)$

    ```


    will leave the line unchanged, i.e., its equation in the new coordinate system
    will be $y + d = a + b(x + c)$. Similarly we define invariance under rotations


    ```

    $R_{\theta}: (x,y) \mapsto (x \cos \theta + y \sin \theta, -x \sin \theta + y
    \cos \theta)$

    ```


    and under scaling of variables


    ```

    $S_{\alpha,\beta}: (x,y) \mapsto (\alpha x, \beta y).$ (1.20)

    ```'
