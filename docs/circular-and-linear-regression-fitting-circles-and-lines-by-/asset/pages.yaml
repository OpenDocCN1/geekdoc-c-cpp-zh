  md: '# Matrix approximations. We use notation of Section 2.3 and focus on perturbations
    $\delta\mathbf{A} = \mathbf{A} - \tilde{\mathbf{A}}$, $\delta\mathbf{S} = \mathbf{S}
    - \tilde{\mathbf{S}}$, etc., where the tilde is used to denote the true values.
    The orthogonal fit minimizes


    $\mathscr{F}(\mathbf{A}) = \mathbf{A}^T\mathbf{S}\mathbf{A} = \mathbf{A}^T\mathbf{X}^T\mathbf{X}\mathbf{A}
    = (\tilde{\mathbf{A}} + \delta\mathbf{A})^T(\tilde{\mathbf{X}} + \delta\mathbf{X})^T(\tilde{\mathbf{X}}
    + \delta\mathbf{X})(\tilde{\mathbf{A}} + \delta\mathbf{A})$.


    Expanding, using the fact $\tilde{\mathbf{X}}\tilde{\mathbf{A}} = 0$, which follows
    from (2.15), and keeping only statistically significant terms³ gives


    $\mathscr{F}(\mathbf{A}) = \tilde{\mathbf{A}}^T\delta\mathbf{X}^T\delta\mathbf{X}\tilde{\mathbf{A}}
    + \delta\mathbf{A}^T\tilde{\mathbf{X}}^T\tilde{\mathbf{X}}\delta\mathbf{A} + 2\tilde{\mathbf{A}}^T\delta\mathbf{X}^T\tilde{\mathbf{X}}\delta\mathbf{A}
    + 2\tilde{\mathbf{A}}^T\delta\mathbf{X}^T\delta\mathbf{X}\delta\mathbf{A}$.


    Now the minimum of $\mathscr{F}$ is attained at $\partial \mathscr{F} / \partial
    \mathbf{A} = 0$, i.e., at


    $\tilde{\mathbf{X}}^T\tilde{\mathbf{X}}\delta\mathbf{A} + (\tilde{\mathbf{X}}^T\delta\mathbf{X}
    + \delta\mathbf{X}^T\delta\mathbf{X})\tilde{\mathbf{A}} = 0$,


    hence


    $\delta\mathbf{A} = -(\tilde{\mathbf{X}}^T\tilde{\mathbf{X}})^-(\tilde{\mathbf{X}}^T\delta\mathbf{X}
    + \delta\mathbf{X}^T\delta\mathbf{X})\tilde{\mathbf{A}}, \quad\quad\quad\quad\quad\quad\quad\quad\quad\quad\quad(2.28)$


    where $(\tilde{\mathbf{X}}^T\tilde{\mathbf{X}})^-$ denotes the Moore-Penrose generalized
    inverse of the matrix $\tilde{\mathbf{X}}^T\tilde{\mathbf{X}}$ (which is rank
    deficient because $\tilde{\mathbf{X}}\tilde{\mathbf{A}} = 0$).


    # A convenient assumption. Since the distribution of $\delta\boldsymbol{\theta}
    = \boldsymbol{\theta} - \tilde{\boldsymbol{\theta}}$ does not depend on $\tilde{\boldsymbol{\theta}}$
    (Section 2.4), we can simplify our calculation by assuming that the line is horizontal,
    i.e., $\tilde{\mathbf{A}} = (0,1)^T$. Then $\delta\mathbf{A} = (\delta\boldsymbol{\theta},
    0)^T$, to the leading order, and


    $\tilde{\mathbf{X}}^T\tilde{\mathbf{X}} = \begin{bmatrix} S & 0 \\ 0 & 0 \end{bmatrix},
    \quad \text{hence} \quad (\tilde{\mathbf{X}}^T\tilde{\mathbf{X}})^- = \begin{bmatrix}
    \frac{1}{S} & 0 \\ 0 & 0 \end{bmatrix}$.


    The matrix $\delta\mathbf{X}$ is


    $\begin{bmatrix} \delta_1 - \bar{\delta} & \boldsymbol{\epsilon}_1 - \bar{\boldsymbol{\epsilon}}
    \\ \vdots & \vdots \\ \delta_n - \bar{\delta} & \boldsymbol{\epsilon}_n - \bar{\boldsymbol{\epsilon}}
