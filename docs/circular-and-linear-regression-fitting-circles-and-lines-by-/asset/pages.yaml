  md: 'A similar problem arises when one fits ellipses [46, 47]. To remedy the situation
    one should change variables and reduce the dimension of the matrices until all
    of them become nonsingular, cf. an example in [46].


    In our case we can simply use the forth equation in (7.75), i.e.


    ```

    $A \tilde{z} + B \tilde{x} + C \tilde{y} + D = 2 V A$,

    ```


    as it allows us to replace 2VA in the last term of (7.75) by $A \tilde{z} + B
    \tilde{x} + C \tilde{y} + D$. As a result, (7.75) transforms to


    ```

    $\mathbf{M} \mathbf{A} = \mathbf{V} \mathbf{H}_{*} \mathbf{A}$, (7.77)

    ```


    where


    $\mathbf{H}_{*} = \begin{bmatrix} 4 \tilde{z} & 0 & 0 & -2 \\ 4 \tilde{x} & 1
    & 0 & 0 \\ 4 \tilde{y} & 0 & 1 & 0 \\ 2 & 0 & 0 & 0 \end{bmatrix}$ .


    Thus we reduce the quadratic generalized eigenvalue problem (7.75) to a *non-singular*
    linear generalized eigenvalue problem, (7.77). Both matrices in (7.77) are nonsingular.


    In fact, det$\mathbf{H}_{*}. = -4$, which guarantees that the matrix $\mathbf{H}_{*}$
    is well conditioned (unless the coordinates of the data points assume abnormally
    large values, which can be easily prevented by a proper choice of the coordinate
    scale). Therefore, the generalized eigenvalue problem (7.77) can be safely transformed
    to an ordinary eigenvalue problem


    ```

    $\mathbf{H}_{*}^{-1} \mathbf{M} \mathbf{A} = \mathbf{V} \mathbf{A}$, (7.78)

    ```


    which can be solved by standard matrix methods. Such a solution will be numerically
    stable; see Section 7.7 in [78]. In our numerical tests, we just called the MATLAB
    function "eig" to solve (7.77), and the obtained solution appeared to be stable
    and reliable.


    On the other hand, the matrix $\mathbf{H}_{*}$ is not symmetric, hence one cannot
    apply Sylvester''s law of inertia to determine the signs of the eigenvalues of
    (7.77). We found experimentally that in about 50% of our simulated samples all
    the eigenvalues were real and positive, and in the other 50% there were two complex
    eigenvalues and two real positive eigenvalues. We plan to look into this issue
    further.


    **Some more experimental tests.** We modified the experiment reported in Section
    7.6 to test the performance of various circle fits in the large sample limit,
    i.e., as $n \rightarrow \infty$ and $\sigma > 0$ fixed. We increased the sample
    size from $n = 20$ to $n = 50,000$. As before, for each $n$ we set $n$ true points
    equally spaced along a semicircle of radius $R = 1$ and generated random samples
    by adding a Gaussian noise at level $\sigma = 0.05$ to each true point.'
