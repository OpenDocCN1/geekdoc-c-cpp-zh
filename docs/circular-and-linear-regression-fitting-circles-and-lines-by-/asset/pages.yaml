    = b$. They have normal distributions with variances


    $\sigma_{\hat{a}}^{2} = \sigma^{2} \left( \frac{\bar{x}^{2}}{s_{xx}} + \frac{1}{n}
    \right), \quad \sigma_{\hat{b}}^{2} = \frac{\sigma^{2}}{s_{xx}}.$


    These variances are the smallest among the variances of unbiased estimators, i.e.,
    they coincide with the Cramer-Rao lower bounds. Hence the estimates $\hat{a}$
    and $\hat{b}$ are 100% efficient. All around, they are statistically optimal in
    every sense.


    Remark. Suppose the errors $\varepsilon_i$ are heteroscedastic, i.e., have different
    variances: $\varepsilon_i \sim N(0, \sigma_i^2)$. The maximum likelihood estimate
    of $\Theta$ is now obtained by the weighted least squares:


    $\mathscr{F}(\Theta) = \sum_{i=1}^{n} w_i \left[ y_i - g(x_i; \Theta) \right]^2,$


    where the weights are set by $w_i = \sigma_i^{-2}$. In the linear case, $y = a
    + bx$, the estimates are still given by (1.3), but now the formulas for the sample
    mean and the scatter matrix should incorporate weights, e.g.,


    $\bar{x} = \frac{1}{n} \sum_{i=1}^{n} w_i x_i, \quad \quad s_{xx} = \sum_{i=1}^{n}
    w_i (x_i - \bar{x})^2, \quad \text{etc.} \tag{1.7}$


    Thus, heteroscedasticity only requires minor changes in the regression formulas.


    # 1.2 Errors-in-variables (EIV) model


    Recall that the classical regression problem was solved in the early 1800s. In
    the late nineteenth century statisticians encountered another problem, which looked
    very similar, but turned out to be substantially different and far more difficult.
    In fact the superficial similarity between the two caused a great deal of confusion
    and delayed the progress for several decades.


    That new problem is reconstructing a functional relation $y = g(x)$ given observations
    $(x_1, y_1), \ldots, (x_n, y_n)$ in which both variables are subject to errors.
    We start with an example and describe a formal statistical model later.


    Suppose (see Madasnky [127]) we wish to determine $\rho$, the density of iron,
    by making use of the relation


    $\text{MASS} = \rho \times \text{VOLUME}. \tag{1.8}$


    We can pick $n$ pieces of iron and measure their volumes $x_1, \ldots, x_n$ and
    masses $y_1, \ldots, y_n$. Given these data, we need to estimate the coefficient
    $\rho$ in the functional relation $y = \rho x$. We cannot use the exact formula
    $y_i = \rho x_i$ for any $i$,'
