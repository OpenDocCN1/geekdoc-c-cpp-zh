    and Clarkson [196].


    **The unbiasedness restriction.** A few comments are in order regarding the practical
    relevance of the above result. The Cramer-Rao theorem only establishes the minimal
    variance for *unbiased* estimators. In the case of fitting nonlinear curves to
    data, there is no such luxury as unbiased estimators; in particular *all* circle
    fitting algorithms are biased to some extent (sometimes heavily); see Section
    6.10. Hence it is not immediately clear if the bound (7.13) has any practical
    value, i.e., if it applies to any circle fit.


    It actually does, as we explained in Section 6.9, if one restricts the analysis
    to the leading terms (of order \(\sigma^{2}\)). The right-hand side of (7.13)
    gives the lower bound for the *leading term* of the covariance matrix, i.e.,


    ```

    $$\mathbf{V} \geq\left(\mathbf{W}^{T} \mathbf{W}\right)^{-1}.\tag{7.14}$$

    ```


    This is true for any geometrically consistent circle fit, i.e., any fit satisfying
    (6.19). Thus (7.14) holds for the geometric circle fit and all known algebraic
    circle fits.'
