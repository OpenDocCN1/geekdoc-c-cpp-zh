  md: 'The log-likelihood function is


    $$\ln L = \text{const} - \frac{1}{2\sigma^2} \sum_{i=1}^{n} (x_i - \tilde{x}_i)^2
    + (y_i - \tilde{y}_i)^2. \qquad (2.29)$$


    According to the classical Cramer-Rao theorem, the covariance matrix of the parameter
    estimators is bounded below$^4$ by


    $$\text{Cov}(\hat{\theta}, \hat{C}, \hat{t}_1, \dots, \hat{t}_n) \geq \mathbf{F}^{-1}.$$


    where **F** is the Fisher information matrix


    $$\mathbf{F} = -\mathbb{E}(\mathbf{H})$$


    and **H** denotes the Hessian matrix consisting of the second order partial derivatives
    of lnL with respect to the parameters.


    # Computing the Cramer-Rao bound.


    Computing the second order partial derivatives of (2.29) with respect to $\theta$,
    $C$, $t_1$, $\dots$, $t_n$ (which is a routine exercise) and taking their expected
    values (by using the obvious rules $\mathbb{E}(x_i)=\tilde{x}_i$ and $\mathbb{E}(y_i)=\tilde{y}_i$)
    gives the following results (where we omit the common factor $\sigma^{-2}$ for
    brevity)


    $$\mathbb{E}\left[\frac{\partial^2 \ln L}{\partial \theta^2}\right] = -\sum t_i^2
    - nC^2, \qquad \mathbb{E}\left[\frac{\partial^2 \ln L}{\partial \theta \partial
    C}\right] = -\sum t_i, \qquad \mathbb{E}\left[\frac{\partial^2 \ln L}{\partial
    \theta \partial t_i}\right] = C,$$


    $$\mathbb{E}\left[\frac{\partial^2 \ln L}{\partial C \partial \theta}\right] =
    -\sum t_i, \qquad \mathbb{E}\left[\frac{\partial^2 \ln L}{\partial C^2}\right]
    = -n, \qquad \mathbb{E}\left[\frac{\partial^2 \ln L}{\partial C \partial t_i}\right]
    = 0,$$


    $$\mathbb{E}\left[\frac{\partial^2 \ln L}{\partial t_i \partial \theta}\right]
    = C, \qquad \mathbb{E}\left[\frac{\partial^2 \ln L}{\partial t_i \partial C}\right]
    = 0, \qquad \mathbb{E}\left[\frac{\partial^2 \ln L}{\partial t_i \partial t_j}\right]
    = -\delta_{ij},$$


    where $\delta_{ij}$ denotes the Kronecker delta symbol. The Fisher information
    matrix now has structure


    $$\mathbf{F} = \sigma^{-2}\left[\begin{array}{cc} \mathbf{E} & \mathbf{G}^T \\
    \mathbf{G} & I_n \end{array}\right],$$


    where


    $$\mathbf{E} = \left[\begin{array}{cc} \sum t_i^2 + nC^2 & \sum t_i \\ \sum t_i
    & n \end{array}\right]$$


    and


    $$\mathbf{G} = \left[\begin{array}{cc} -C & 0 \\ \vdots & \vdots \\ -C & 0 \end{array}\right]$$'
