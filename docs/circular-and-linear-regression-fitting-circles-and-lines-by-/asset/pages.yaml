    observations of each true point, all with unit variance $\sigma^2 = 1$. Then averaging
    those $k_m$ observations of each true point gives a single observation with variance
    $\sigma_m^2 = 1/k_m$. Now $m = k_m n_m = \sigma_m^{-2} n_m$ represents the total
    number of the original (replicated) observations.


    Next they assume that $n_m \to \infty$ and $\sigma_m \to 0$, as $m \to \infty$,
    so that


    ```

    $$\sigma_m^2 n_m \to 0 \qquad \text{as } m \to \infty,$$ i.e., $n$ grows more
    slowly than $1/\sigma^2$. In the strict mathematical sense, these assumptions
    are effectively equivalent to ours in Section 6.7, though we prefer to treat $n$
    as a (moderately large) constant, and not as a variable.

