  md: '**Newton-based Taubin fit.** If matrix algebra functions are not available,
    or if one is hunting for speed rather than numerical stability, one can find the
    smallest eigenvalue $\eta$ of the matrix $\mathbf{X}_0^T\mathbf{X}_0$ by solving
    its characteristic equation


    ```

    $\operatorname{det}(\mathbf{X}_0^T\mathbf{X}_0 - \eta\mathbf{I}) = 0. \qquad (5.58)$

    ```


    This is a polynomial equation of the 3rd degree in $\eta$, which can be written
    as


    ```

    $P(\eta) = c_3\eta^3 + c_2\eta^2 + c_1\eta + c_0 = 0, \qquad (5.59)$

    ```


    where


    ```

    $c_3 = 4\bar{z} \qquad$

    $c_2 = -\overline{zz} - 3\bar{z}^2 \qquad$

    $c_1 = \bar{z} (\overline{zz} - \bar{z}^2) + 4\bar{z} (\overline{xx}\overline{yy}
    - \overline{xy}^2) - \overline{xx}^2 - \overline{yy}^2 \qquad$

    $c_0 = \overline{xx}^2\overline{yy} + \overline{yy}^2\overline{xx} - 2\overline{xx}\overline{yy}\overline{xy}
    - (\overline{xx}\overline{yy} - \overline{xy}^2)(\overline{zz} - \bar{z}^2) \qquad
    (5.60)$

    ```


    where we use the same notation as in (5.31)-(5.32) (remember also that we again
    assume that the data set is centered, i.e., $\bar{x} = \bar{y} = 0$; the relation
    $\bar{z} = \overline{xx} + \overline{yy}$ is helpful, too). Interestingly, the
    formulas for $c_1$ and $c_0$ are identical in (5.32) and here.


    Since the eigenvalues of $\mathbf{X}_0^T\mathbf{X}_0$ are real and nonnegative,
    equation (5.59) always has three nonnegative real roots. Therefore $P(0) \leq
    0$. In the nonsingular case, we have $P(0) < 0$, and then $P''''''(\eta) < 0$
    in the interval between 0 and the first (smallest) root. Thus a simple Newton
    method supplied with the initial guess $\eta = 0$ always converges to the desired
    smallest root of (5.58).


    We call this algorithm *Newton-based Taubin fit*.


    When choosing an algorithm for practical purposes, recall our comments on the
    issue of numerical stability at the end of Section 5.6.


    **Experimental tests.** Computationally, the Taubin fit is slightly simpler, hence
    a bit less expensive than the Pratt fit. We also tested its accuracy experimentally,
    in the way described in Section 5.8. We recall that in that test, see Table 5.4,
    the Pratt and geometric fits showed a very similar performance, while the Kåsa
    method turned out to be much less reliable.


    Additional tests reveal that the performance of the Taubin fit closely follows
    that of Pratt and geometric fits, in fact in this picture it lies "in between".
    For the reader''s convenience, we summarize our results regarding these three
    algorithms in Table 5.5, where again $q_1$, $q_2$ and $q_3$ are the three quartiles
    of the radius estimates (recall that the true radius is $R = 1$).


    We note that on smaller arcs Taubin''s characteristics are closer to the (slightly
    less accurate) Pratt fit, on larger arcs, to the (more superior) geometric fit.
    However, the difference between these three fits is fairly small, so in most practical
    application any one of them would do a good job. One should'
