  md: 'corresponding to $b < 0$, has its bottom point right at the minimum of $\mathscr{F}$.
    The function $\mathscr{F}$ slowly decreases along the valley as it approaches
    the minimum. Hence, any iterative algorithm starting in that valley or getting
    there by chance should, ideally, find its way downhill and arrive at the minimum
    of $\mathscr{F}$.


    The other valley corresponds to $b > 0$, it is separated from the global minimum
    of $\mathscr{F}$ by a ridge. The function $\mathscr{F}$ slowly decreases along
    that valley as $b$ grows. Hence, any iterative algorithm starting in that valley
    or getting there “by accident” will be forced to move up along the $b$ axis, away
    from the minimum of $\mathscr{F}$, and diverge to infinity.


    ![](img/86db288e3c266985d1648282179ae4b5_96_0.png)


    **Wrong valley perils.** If an iterative algorithm starts at a randomly chosen
    point, it may go down either valley, and there is a chance that it will descend
    into the second (wrong) valley and then diverge. For the sample on Fig. 3.7, the
    authors of [43] applied the Levenberg-Marquardt algorithm starting at a randomly
    selected initial guess within the square $5 \times 5$ about the centroid $(\bar{x},\bar{y})$
    of the data. They found that the algorithm indeed escaped to infinity with probability
    about 50%.


    **Existence of the escape valley.** Unfortunately, such “escape valleys” are almost
    inevitable: a detailed theoretical analysis shows that for every typical data
    set the graph of $\mathscr{F}$ contains an escape valley. This is a mathematical
    theorem stated below.


    **Theorem 7 (Two Valley Theorem)** For every typical data set, there is a pair
    of valleys on the graph of the objective function $\mathscr{F}(a,b)$ stretching
    out in opposite directions, so that one valley descends to the minimum of $\mathscr{F}$,
    while the other valley descends toward infinity.'
