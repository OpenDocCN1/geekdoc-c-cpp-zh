    z_i$, etc.). Just like in Section 5.5, the solution $\mathbf{A}$ would be a generalized
    eigenvector of the matrix pair ($\mathbf{X}^T \mathbf{X}$, $\mathbf{T}$).


    **Taubin fit versus Pratt fit.** Taubin’s objective function (5.46) can be simplified
    in a different way. Observe that it is a quadratic polynomial in $D$, hence $\mathscr{F}_4$
    has a unique global (conditional) minimum in $D$, when the other three parameters
    $A, B, C$ are kept fixed, which gives


    ```

    $D = -A\tilde{z} - B\tilde{x} - C\tilde{y}$

    ```


    (notably, this solves the third Kåsa equation in (5.5), as in that case $A = 1$).
    Substituting (5.49) into the denominator of (5.46) gives


    ```

    $\mathscr{F}_4(A, B, C, D) = \frac{\sum [Az_i + Bx_i + Cy_i + D]^2}{B^2 + C^2
    - 4AD}$

    ```


    and this function is identical to the Pratt objective function (5.21); quite a
    surprising observation!


    So both Pratt and Taubin methods seem to minimize the same objective function
    $\mathscr{F}_2 = \mathscr{F}_4$, but are they really equivalent? No, because the
    Taubin method involves one extra relation, (5.49). We recall that Pratt’s minimization
    of (5.21) is equivalent to the minimization of (5.47) subject to the constraint


    ```

    $B^2 + C^2 - 4AD = 1,$

    ```


    cf. (5.22)-(5.23). Now the Taubin algorithm is equivalent to the minimization
    of (5.47) subject to *two constraints*: (5.51) *and* (5.49).


    One can think of the Pratt method as finding a minimum of the function $\mathscr{F}_3$
    restricted to the 3D manifold $\mathbb{P}_1$ defined by equation (5.51), while
    the Taubin method finds a minimum of the same function $\mathscr{F}_3$ but restricted
    to a smaller domain, the 2D surface $\mathbb{P}_2$ defined by two equations, (5.51)
    and (5.49). Obviously, $\mathbb{P}_2 \subset \mathbb{P}_1$, hence the Pratt’s
    minimum will be always smaller than (or equal to) the Taubin’s minimum.


    However, this does not mean that the Pratt fit is always better than the Taubin
    fit, as the real quality of each fit is measured by the sum of squared distances,
    $\sum d_i^2$. In our tests, we observed the Taubin fit actually beat the Pratt
    fit, in this sense, quite regularly. The statistical accuracy of both fits will
    be analyzed in Chapter 7.


    # **5.10 Implementation of the Taubin fit**


    **Elimination of parameter D.** For simplicity, let us assume, as usual, that
    the data set is centered, i.e., $\tilde{x} = \tilde{y} = 0$. Then (5.49) takes
    form


    ```

    $D = -A\tilde{z},$

    ```'
