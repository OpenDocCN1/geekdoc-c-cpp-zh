  md: 'of degree $k \geq 3$ remains extremely rare, as most practitioners prefer to
    divide complex shapes into small segments that can be well approximated by lines
    and arcs of conics, or even arcs of circles. What one gets in the end is a sequence
    of circular arcs stitched together (''circular splines''); see [12, 145, 158,
    164, 165]. Some authors plainly assert that "most of the objects in the world
    are made up of circular arc segments and straight lines;" see [146, 195].


    Thus fitting circles and conics to observed data is practically the most important
    task in image processing applications, besides fitting lines.


    We note that often one deals with objects in images that have rectangular or other
    polygonal shape, see e.g., [186, 189]. In that case a polygon of the right shape
    can be fit to data. Polygon consists of segments of straight lines, so that general
    line fitting algorithms can be used, but there are also vertices and corners that
    may require a special treatment. Such problems are not discussed in this book.


    To summarize, we see that in the nonlinear context, the two large topics, (i)
    the EIV regression used in general statistics and (ii) the geometric fit used
    in image processing, go separate ways and become very different. There is another
    significant distinction here: these topics adopt different asymptotic models.
    In the general EIV regression, it is common to study properties of estimators
    as the sample size grows, i.e., as $n \rightarrow \infty$ (at the same time the
    noise level $\sigma$ remains constant). In the image processing applications,
    the sample size is usually very limited, but the noise is quite small, hence a
    more appropriate asymptotic model is $\sigma \rightarrow 0$ while $n$ is fixed.
    This issue will be discussed at length in Section 2.5.


    We reiterate that our main subject is geometric curve fitting in image processing,
    i.e., the topic (ii) above. For a comprehensive presentation of the topic (i),
    i.e., the general nonlinear EIV regression, see a recent book [27] and its second
    edition [28], updated and expanded.'
