    # **4.7** A modification of Levenberg-Marquardt circle fit


    It is also tempting to compute the Hessian matrix **H** in (4.8) exactly, without
    discarding the second sum in it, thus possibly improving the convergence. Here
    we explore this approach.


    Expanding the squares in (4.23) gives


    $$\mathscr{F}(a,b) = \sum_{i=1}^{n} r_i^2 - n\bar{r}^2 = \sum_{i=1}^{n} (x_i^2
    + y_i^2) + n(a^2 + b^2 - \bar{r}^2). \quad (4.24)$$


    where we assume, to shorten our formulas, that the data are centered, i.e., $\bar{x}
    = \bar{y} = 0$ (some authors claim [53, 176] that centering the data prior to
    the fit helps reduce round-off errors).


    Since the first sum in (4.24) is independent of parameters, we can ignore it,
    along with the constant factor *n* in the second term, hence we arrive at the
    problem of minimizing a new function:


    $$\mathscr{F}_1(a,b) = a^2 + b^2 - \bar{r}^2. \quad (4.25)$$


    Differentiating with respect to *a* and *b* gives


    $$\frac{1}{2}\nabla\mathscr{F}_1 = \begin{bmatrix} a + \bar{u}\bar{r} \\ b + \bar{v}\bar{r}
    \end{bmatrix}. \quad (4.26)$$


    The second order partial derivatives are


    $$\begin{aligned} \frac{1}{2} \frac{\partial^2 \mathscr{F}_1}{\partial a^2} \quad
    & = \quad 1 - \bar{u}^2 + \bar{r} \frac{\partial \bar{u}}{\partial a} \\ \frac{1}{2}
    \frac{\partial^2 \mathscr{F}_1}{\partial b^2} \quad & = \quad 1 - \bar{v}^2 +
    \bar{r} \frac{\partial \bar{v}}{\partial b} \\ \frac{1}{2} \frac{\partial^2 \mathscr{F}_1}{\partial
    a \partial b} \quad & = \quad -\bar{u}\bar{v} + \bar{r} \frac{\partial \bar{u}}{\partial
    b}. \end{aligned} \quad (4.27)$$


    Using again the sample mean notation we have


    $$\begin{align*} -\frac{\partial \bar{u}}{\partial a} & = \frac{1}{n}\sum \frac{v_i^2}{r_i}
    = \overline{vv}/r \\ -\frac{\partial \bar{v}}{\partial b} & = \frac{1}{n}\sum
    \frac{u_i^2}{r_i} = \overline{uu}/r \end{align*}$$'
