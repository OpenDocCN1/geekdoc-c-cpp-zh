  md: 'A MATLAB implementation of the trust region algorithm for fitting circles can
    be found on our web page [84].


    # **4.5 Levenberg-Marquardt for circles: Full version**


    Fitting a circle to observed points involves the minimization of


    $$\mathscr{F}\left( a,b,R\right) =\sum_{i=1}^{n}\left[ \sqrt{\left( x_{i}-a\right)
    ^{2}+\left( y_{i}-b\right) ^{2}}-R\right] ^{2}. \tag{4.18}$$


    This is a relatively simple expression, so that the Levenberg-Marquardt procedure
    goes smoothly. Let us introduce shorthand notation:


    $$r_{i}=\sqrt{\left( x_{i}-a\right) ^{2}+\left( y_{i}-b\right) ^{2}} \tag{4.19}$$


    and


    $$u_{i}=-\partial r_{i}/\partial a=\left( x_{i}-a\right) /r_{i} \tag{4.20}$$


    and


    $$v_{i}=-\partial r_{i}/\partial b=\left( y_{i}-b\right) /r_{i}. \tag{4.21}$$


    Then one can compute directly


    $$\mathbf{J}=\left[ \begin{array}{ccc} -u_{1} & -v_{1} & -1 \\ \vdots & \vdots
    & \vdots \\ -u_{n} & -v_{n} & -1\end{array} \right]$$


    and then


    $$\mathbf{N}=n\left[ \begin{array}{ccc} \overline{uu} & \overline{uv} & \bar{u}
    \\ \overline{uv} & \overline{vv} & \bar{v} \\ \bar{u} & \bar{v} & 1\end{array}
    \right]$$


    as well as


    $$\mathbf{J}^{T}\mathbf{g}=n\left[ \begin{array}{c} R\bar{u}-\overline{ur} \\
    R\bar{v}-\overline{vr} \\ R-\bar{r}\end{array} \right] =n\left[ \begin{array}{c}
    R\bar{u}+a-\bar{x} \\ R\bar{v}+b-\bar{y} \\ R-\bar{r}\end{array} \right] , \tag{4.22}$$


    where, according to the previous section,


    $$\mathbf{g}=\left[ r_{1}-R,\ldots ,r_{n}-R\right] ^{T}.$$  Here we use our “sample
    mean” notation, for example $\overline{uu}=\frac{1}{n}\sum u_{i}^{2}$, etc.'
