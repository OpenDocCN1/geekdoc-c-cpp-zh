    **Karimäki’s assumption revisited.** Karimäki designed his fit under a seemingly
    restrictive assumption, $|d| \ll R$, but in fact his fit works well under a less
    restrictive condition:


    ```

    1 + $\rho d$ should not be close to 0.   (8.49)

    ```


    Indeed, let us expand the objective function (8.35) into Taylor series


    ```

    $\mathscr{F}(\Theta) = a_1 + \mathbf{D}_1^T (\Theta - \hat{\Theta}) + \frac{1}{2}
    (\Theta - \hat{\Theta})^T \mathbf{H}_1 (\Theta - \hat{\Theta}) + \dots$ (8.50)

    ```


    where higher order terms are omitted; here $\Theta$ denotes the vector of parameters,
    $\mathbf{D}_1$ is the gradient and $\mathbf{H}_1$ the Hessian of $\mathscr{F}$.
    Suppose that the expansion is made at the point $\hat{\Theta}$ where (8.35) takes
    its minimum, then $\mathbf{D}_1 = \mathbf{0}$. Note that $\hat{\Theta}$ is in
    fact Pratt’s estimate of the circle parameters (see Section 5.5).


    Karimäki’s objective function (8.36) can be written as $\mathscr{F}_{\mathrm{Kar}}
    = g \mathscr{F}$, where $g = (1 + \rho d)^{-2}$. Let us expand the extra factor
    $g$ into Taylor series, too:


    ```

    $g(\Theta) = a_2 + \mathbf{D}_2^T (\Theta - \hat{\Theta}) + \frac{1}{2} (\Theta
    - \hat{\Theta})^T \mathbf{H}_2 (\Theta - \hat{\Theta}) + \dots$

    ```


    Multiplying the above expansions gives Karimäki’s objective function (8.36):


    ```

    $\mathscr{F}_{\mathrm{Kar}}(\Theta) = a_1 a_2 + a_1 \mathbf{D}_2^T (\Theta - \hat{\Theta})
    + \frac{1}{2} (\Theta - \hat{\Theta})^T (a_1 \mathbf{H}_2 + a_2 \mathbf{H}_1)
    (\Theta - \hat{\Theta}) + \dots$

    ```


    The minimum of $\mathscr{F}_{\mathrm{Kar}}$ is taken at


    ```

    $\hat{\Theta}_{\mathrm{Kar}} = \hat{\Theta} - a_1 (a_1 \mathbf{H}_2 + a_2 \mathbf{H}_1)^{-1}
    \mathbf{D}_2 + \dots$

    ```


    where higher order terms are omitted. Let us examine how the minimum $\hat{\Theta}_{\mathrm{Kar}}$
    differs from the minimum $\hat{\Theta}$ of the function $\mathscr{F}$ given by
    (8.50).


    As usual, suppose the noise is Gaussian at a level $\sigma \ll R$; then the observed
    points are at distance $\mathcal{O}(\sigma)$ from the best fitting circle. Then
    $\mathscr{F} = \mathcal{O}(\sigma^2)$ at its minimum, hence $a_1 = \mathcal{O}(\sigma^2)$.
    Now the difference between the two minima $\hat{\Theta}_{\mathrm{Kar}}$ and $\hat{\Theta}$
    will be of order $\sigma^2$ provided the vector $(a_1 \mathbf{H}_2 + a_2 \mathbf{H}_1)^{-1}
    \mathbf{D}_2$ is not too large, i.e., if its magnitude is of order one. This vector
    depends on several factors which are hard to trace completely, but it appears
    that indeed its magnitude is of order one provided $g(\hat{\Theta}) = a_2$ is
    not too large, i.e., $1 + \rho d$ is not too close to zero, i.e., we arrive at
    the mild condition (8.49).


    Recall that the statistical error of the estimate $\hat{\Theta}$ (i.e., its standard
    deviation) is of order $\sigma$, hence an additional error of order $\sigma^2$
