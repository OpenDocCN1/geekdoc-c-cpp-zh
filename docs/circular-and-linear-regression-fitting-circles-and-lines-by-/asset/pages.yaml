    circle parameters $A, B, C, D$, in which the circle is defined by equation


    ```

    $Az+Bx+Cy+D=0, \quad \text{where} \quad z=x^2+y^2\,.$

    ```


    Now the limit point of the Pratt fit satisfies


    ```

    $$(A^{*}, B^{*}, C^{*}, D^{*})=\operatorname{argmin}\,\int [Az+Bx+Cy+D]^2\, d\mathbb{P}\sigma
    \qquad (7.55)$$

    ```


    subject to the constraint


    ```

    $$B^2+C^2-4AD=1. \qquad (7.56)$$

    ```


    The limit point of the Taubin fit, see (5.49)–(5.51), is obtained by minimizing
    the same integral (7.55), but subject to $two$ constraints: one is $(7.56)$ and
    the other is


    ```

    $$\int (Az+Bx+Cy+D)\, d\mathbb{P}=0,$$

    ```


    see Section 5.9. That additional constraint makes the limit point $(A_{\mathrm{T}}^{*},
    B_{\mathrm{T}}^{*}, C_{\mathrm{T}}^{*}, D_{\mathrm{T}}^{*})$ of the Taubin fit
    different from that of Pratt, $(A_{\mathrm{P}}^{*}, B_{\mathrm{P}}^{*}, C_{\mathrm{P}}^{*},
    D_{\mathrm{P}}^{*})$.


