  md: 'The Pratt and Taubin algorithms (Chapter 5) can be regarded as approximate
    solutions to this problem. Indeed, assuming that the data points $ (x_{i}, y_{i})
    $ lie close to the circle, one gets $ Az_{i} + Bx_{i} + Cy_{i} + D \approx 0 $.
    Thus one can simply discard this sum from the denominator of (6.17), which gives
    us the Pratt fit (5.21). Alternatively, one can averages all the denominators
    in (6.17), which gives us the Taubin fit; see (5.45).


    # 6.6 Error analysis: A general scheme


    In Section 6.4 we have shown that the exact statistical properties of the MLE
    in the curve fitting problems are intractable. Unfortunately, much the same remains
    true for algebraic fits as well, including GRAF. Here we develop an *approximative
    error analysis* for curve fitting algorithms. This analysis will allow us to determine
    their statistical characteristics, to a reasonable extend, and draw practically
    valuable conclusions.


    **Notation and assumptions.** Let $ \widehat{\Theta}(\mathbf{x}_{1}, \dots, \mathbf{x}_{n})
    $ be an estimate of the unknown parameter vector $ \Theta = (\theta_{1}, \dots,
    \theta_{k})^{T} $ based on $ n $ independent observations $ \mathbf{x}_{i} = (x_{i},
    y_{i}) $, $ i = 1, \dots, n $. We assume that it is a regular (at least four times
    differentiable) function of $ x_{i} $''s and $ y_{i} $''s.


    For brevity we denote by $ \mathbf{X} = (x_{1}, y_{1}, \dots, x_{n}, y_{n})^{T}
    $ the vector of all our observations, so that


    ```

    $$ \mathbf{X} = \widetilde{\mathbf{X}} + \mathbf{E}, $$

    ```


    where


    ```

    $$ \widetilde{\mathbf{X}} = (\tilde{x}_{1}, \tilde{y}_{1}, \dots, \tilde{x}_{n},
    \tilde{y}_{n})^{T} $$

    ```


    is the vector of the true coordinates and


    ```

    $$ \mathbf{E} = (\delta_{1}, \epsilon_{1}, \dots, \delta_{n}, \epsilon_{n})^{T}
    $$

    ```


    is the vector of their random perturbations. Recall that in the Cartesian functional
    model (Section 6.1) the components of $ \mathbf{E} $ are i.i.d. normal random
    variables with mean zero and variance $ \sigma^{2} $.


    **Taylor expansion.** We will use Taylor expansion to the second order terms.
    To keep our notation simple, we work with each scalar parameter $ \theta_{m} $
    of the vector $ \Theta $ separately:


    ```

    $$ \widehat{\theta}_{m}(\mathbf{X}) = \widehat{\theta}_{m}(\widetilde{\mathbf{X}})
    + \mathbf{G}_{m}^{T}\mathbf{E} + \frac{1}{2}\mathbf{E}^{T}\mathbf{H}_{m}\mathbf{E}
    + \mathcal{O}_{P}(\sigma^{3}). \tag{6.18} $$

    ```


    Here


    ```

    $$ \mathbf{G}_{m} = \nabla\widehat{\theta}_{m} \quad \text{and} \quad \mathbf{H}_{m}
    = \nabla^{2}\widehat{\theta}_{m} $$

    ```


    denote the gradient (the vector of the first order partial derivatives) and the
    Hessian matrix of the second order partial derivatives of $ \widehat{\theta}_{m}
    $, respectively, taken at the true vector $ \widetilde{\mathbf{X}} $.'
