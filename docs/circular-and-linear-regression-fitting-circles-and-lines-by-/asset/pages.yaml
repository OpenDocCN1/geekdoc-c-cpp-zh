  md: '# ## 1.5 Nonlinear nature of the “linear” EIV


    It may be enlightening to interpret the orthogonal regression problem geometrically
    in the space $\mathbb{R}^{2n}$ with coordinates $x_1, y_1, \dots, x_n, y_n$. We
    follow Malinvaud (Chapter 10 of [128]). Our observations $(x_1, y_1), \dots, (x_n,
    y_n)$ are represented by one point (we denote it by $\mathscr{X}$) in this multidimensional
    space. To understand the construction of the orthogonal fitting line, consider
    the subset $\mathbb{P} \subset \mathbb{R}^{2n}$ defined by


    $$(x_1, y_1, \dots, x_n, y_n) \in \mathbb{P} \iff \exists a, b: y_i = a + bx_i
    \ \forall i,$$


    i.e., $\mathbb{P}$ consists of all $(x_1, y_1, \dots, x_n, y_n) \in \mathbb{R}^{2n}$
    such that the $n$ planar points $(x_1, y_1), \dots, (x_n, y_n)$ are collinear.
    Note that the true values $\tilde{x}_1, \tilde{y}_1, \dots, \tilde{x}_n, \tilde{y}_n$
    are represented by one point (we denote it by $\tilde{\mathscr{X}}$) in $\mathbb{P}$,
    i.e., $\tilde{\mathscr{X}} \in \mathbb{P}$.


    The orthogonal fitting line minimizes the sum


    $$\sum_{i=1}^{n} (x_i - \tilde{x}_i)^2 + (y_i - \tilde{y}_i)^2,$$


    which is the square of the distance (in the Euclidean metric) between the points
    $\mathscr{X}$ and $\tilde{\mathscr{X}}$. Thus, the orthogonal fitting procedure
    corresponds to choosing a point $\tilde{\mathscr{X}} \in \mathbb{P}$ closest to
    the point $\mathscr{X} \in \mathbb{R}^{2n}$ representing the data. In other words,
    we simply project the given point $\mathscr{X}$ onto $\mathbb{P}$ orthogonally.
    Or is it that simple?


    It takes a little effort to verify that $\mathbb{P}$ is a *nonlinear* submanifold
    (‘surface’) in $\mathbb{R}^{2n}$. Indeed, it is specified by $n-2$ independent
    relations


    $$\frac{y_{i+1} - y_i}{x_{i+1} - x_i} = \frac{y_{i+2} - y_i}{x_{i+2} - x_i}, \quad
    i = 1, \dots, n - 2, \tag{1.25}$$


    each of which means the collinearity of the three planar points $(x_i, y_i)$,
    $(x_{i+1}, y_{i+1})$, and $(x_{i+2}, y_{i+2})$. The relations (1.25) are obviously
    quadratic, hence $\mathbb{P}$ is an $(n+2)$-dimensional *quadratic surface* (variety)
    in $\mathbb{R}^{2n}$.


    ![](img/86db288e3c266985d1648282179ae4b5_47_0.png)


    Figure 1.6: *Projection of the point* $\mathscr{X}$ *onto the quadratic manifold*
    $\mathbb{P}$.


    Projecting a point $\mathscr{X}$ onto a quadratic surface is not a trivial, and
    definitely not a linear, problem. This geometric interpretation should dispel
    our illusion'
