  md: 'Quite often, different numerical algorithms return different estimates. Fig.
    1.9 shows an example where an iterative procedure is trapped by a local minimum.
    Another example is shown in Fig. 1.10: there is no local minima, but the second
    (slow) algorithm takes a large number of steps to reach the area near the minimum.
    In computer programs the number of iterations is always limited (usually, the
    limit is set to 50 or 100), thus the returned estimate may be still far from the
    actual minimum.


    The estimates returned by different algorithms may even have seemingly different
    statistical characteristics (bias, variance, etc.). Thus the choice of the algorithm
    becomes a critical factor in practical applications, as well as in many theoretical
    studies. There is simply little point of studying an abstract "solution" that
    is not accessible in practice, while practical solutions heavily depend on the
    particular algorithm used to compute them.


    ![](img/86db288e3c266985d1648282179ae4b5_55_0.png)


    *Figure 1.10 Two algorithms minimizing a function F(x) with a unique minimum.
    One approaches it fast (from the left) and arrives in a vicinity of the minimum
    in 5-10 steps. The other moves very slowly (from the right); it may take 100 or
    1000 iterations to get near the minimum.*


    Thus the analysis of numerical schemes becomes an integral part of the research.
    Sizable portions of published articles and books are now devoted to computer algorithms,
    their underlying ideas, performance, limitations, numerical stability, etc. This
    is all unavoidable, due to the nature of the subject.


    # 1.9 Nonlinear models: EIV versus orthogonal fit


    So far we have discussed two large topics—the orthogonal (geometric) fit and the
    EIV regression (with the known ratio of variances)—in parallel. In the linear
    context, these models can be transformed to one another by a simple scaling the
    variables $x$ and $y$ (Section 1.4), and both models have very similar properties.


    In the nonlinear context, a strong link between these two models is lost. They
    can no longer be transformed to one another. The crucial disparity derives from
    the different requirements stated at the end of Section 1.4: the EIV regression
    must be invariant under scaling of the variables $x$ and $y$, and the orthogonal
    (geometric) fit — under rotations and translations on the $xy$ plane.'
