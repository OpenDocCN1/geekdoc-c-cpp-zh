  md: '(5.43) can be rewritten as


    $\mathscr{F}_1 \approx \frac{4}{n}\left[\sum_{i=1}^n(x_i-a)^2+(y_i-b)^2\right]^{\left[\sum_{i=1}^n
    d_i^2\right]}.\tag{5.44}$


    Since we actually want to minimize $\sum d_i^2$, we can achieve that goal (approximately)
    by minimizing the following function:


    $\begin{aligned}\mathscr{F}_4(a,b,R) &= \frac{\sum[(x_i-a)^2+(y_i-b)^2-R^2]^2}{4n^{-1}\sum(x_i-a)^2+(y_i-b)^2}
    \\&= \frac{\sum[z_i-2ax_i-2by_i+a^2+b^2-R^2]^2}{4n^{-1}\sum[z_i-2ax_i-2by_i+a^2+b^2]}\end{aligned}\tag{5.45}$


    At this point we switch to the algebraic circle parameters $A, B, C, D$ by the
    rules (3.11), i.e., we substitute


    $a = -\frac{B}{2A}, \qquad b = -\frac{C}{2A}, \qquad R^2 = \frac{B^2 + C^2 - 4AD}{4A^2}$


    and obtain


    $\mathscr{F}_4(A,B,C,D) = \frac{\sum[Az_i+ Bx_i+Cy_i+D]^2}{n^{-1}\sum[4A^2z_i+4ABx_i+4ACy_i+B^2+C^2]},\tag{5.46}$


    The minimization of (5.46) is proposed by Taubin [176]. He actually arrived at
    (5.46) differently, by using gradient weights; those will be discussed in Section
    6.5.


    **Taubin fit in matrix form.** The minimization of (5.46) is equivalent to the
    minimization of the simpler function


    $\mathscr{F}_3(A,B,C,D) = \sum_{i=1}^n(Az_i+ Bx_i+Cy_i+D)^2,\tag{5.47}$


    which first appeared in (5.22), subject to the constraint


    $4A^2\bar{z}+4A\bar{B}\bar{x}+4AC\bar{y}+B^2+C^2=1.$


    In matrix form, this means the minimization of


    $\mathscr{F}_3(\mathbf{A})=\|\mathbf{X}\mathbf{A}\|^2=\mathbf{A}^T(\mathbf{X}^T\mathbf{X})\mathbf{A},$


    in terms of (5.24), subject to the constraint $\mathbf{A}^T\mathbf{T}\mathbf{A}=1$,
    where


    $\mathbf{T}=\begin{bmatrix}4\bar{z} & 2\bar{x} & 2\bar{y} & 0\\2\bar{x} & 1 &
    0 & 0\\2\bar{y} & 0 & 1 & 0\\0 & 0 & 0 & 0\end{bmatrix}\tag{5.48}$'
