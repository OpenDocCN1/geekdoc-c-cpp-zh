    # 6.2  Comparative analysis of statistical models


    **Drawbacks of the functional model.** A major objection against the use of the
    functional model is that the number of its parameters grows with $n$, which makes
    the asymptotical analysis (as $n \to \infty$) of estimators difficult, cf. Chapters
    1 and 2, where we have discussed the line fitting problem at length. However,
    in image processing applications, it is more natural to keep $n$ fixed and consider
    the limit $\sigma \to 0$, see our discussion in Section 2.5; this asymptotic scheme
    causes no conflicts with the functional model.


    Another possible concern with the functional model is that the statistical properties
    of the estimates of the principal parameters $\theta_1, \ldots, \theta_k$ (in
    particular, formulas for their biases, covariance matrix, and Cramer-Rao lower
    bounds) depend on the location of the true points, which are unobservable. This,
    however, is not a major issue in applications; in practice it is common to substitute
    either the observed points $(x_i, y_i)$, or their projections onto the fitted
    curve, for the unknown $(\bar{x}_i, \bar{y}_i)$; and such a substitution gives
    a reasonable approximation.


    **Drawbacks of the structural model.** In the studies of fitting *straight* lines
    to data, many statisticians prefer the more elegant structural model to the somewhat
    cumbersome functional model. However, when one fits nonlinear contours, especially
    circles or ellipses, to data, the structural model becomes more awkward, see below.


    The main reason for the awkwardness of the structural model is that the true points
    $\bar{x}_i$''s and $\bar{y}_i$''s have to be chosen on the true contour (such
    as a circle or an ellipse); so they cannot have a normal distribution because
    their coordinates are restricted by the size of the contour. Thus one has to use
    other (nonnormal) distributions, which are concentrated on the contour (circle
    or ellipse). Perhaps the most natural choice would be a uniform distribution on
    the entire contour (with respect to the arc length on it), and indeed uniform
    distributions were used in early works [18, 31]. But they cannot cover many practically
    important cases, especially those where the data are observed along a small arc
    (this happens when only an occluded circle or ellipse is visible).


    **Von Mises distribution.** Circular statistics, which deals with probability
    distributions concentrated on a circle, offers an analogue of the normal law:
    the so-called *von Mises* distribution (also called *circular normal distribution*);'
