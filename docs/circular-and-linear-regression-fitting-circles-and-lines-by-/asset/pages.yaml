  md: 'This is another classical least squares problem, and its solution is


    \begin{equation}

    \Delta_2\boldsymbol{\hat{\Theta}} = \left(\mathbf{W}^T\mathbf{W}\right)^{-1}\mathbf{W}^T\mathbf{F},
    \tag{7.8}

    \end{equation}


    where $\mathbf{F} = (f_1, \ldots, f_n)^T$; of course this is a quadratic approximation
    which does not include $\varrho_B(\sigma^2)$ terms. In fact, the contribution
    from the first three (linear) terms in (7.7) vanishes, quite predictably; thus
    only the last two (quadratic) terms will matter.


    Taking the mean value gives, to the leading order,


    \begin{equation}

    \mathbb{E}(\Delta\boldsymbol{\hat{\Theta}}) = \mathbb{E}(\Delta_2\boldsymbol{\hat{\Theta}})
    \equiv \frac{\sigma^2}{2R}\left[\left(\mathbf{W}^T\mathbf{W}\right)^{-1}\mathbf{W}^T\mathbf{1}
    + \left(\mathbf{W}^T\mathbf{W}\right)^{-1}\mathbf{W}^T\mathbf{S}\right], \tag{7.9}

    \end{equation}


    where $\mathbf{1} = (1, 1, \ldots, 1)^T$ and $\mathbf{S} = (s_1, \ldots, s_n)^T$,
    here $s_i$ is a scalar given by


    $s_i = [-\tilde{v}_i, \tilde{u}_i, 0](\mathbf{W}^T\mathbf{W})^{-1}[-\tilde{v}_i,
    \tilde{u}_i, 0]^T.$


    The second term in (7.9) is of order $\varrho(\sigma^2/n)$, thus the essential
    bias is given by the first term only:


    $\mathbb{E}(\Delta\boldsymbol{\hat{\Theta}}) \stackrel{\text{ess}}{=} \frac{\sigma^2}{2R}(\mathbf{W}^T\mathbf{W})^{-1}\mathbf{W}^T\mathbf{1}.$


    In fact, this expression can be simplified. Since the last column of the matrix
    $\mathbf{W}^T\mathbf{W}$ coincides with the vector $\mathbf{W}^T\mathbf{1}$, we
    have $(\mathbf{W}^T\mathbf{W})^{-1}\mathbf{W}^T\mathbf{1} = [0, 0, 1]^T$; hence
    the essential bias of the geometric circle fit is


    \begin{equation}

    \mathbb{E}(\Delta\boldsymbol{\hat{\Theta}}) \stackrel{\text{ess}}{=} \frac{\sigma^2}{2R}
    \begin{bmatrix} 0 \\ 0 \\ 1 \end{bmatrix}. \tag{7.10}

    \end{equation}


    The same result can also be obtained from the general formula (6.39). Thus the
    estimates of the circle center, $\hat{a}$ and $\hat{b}$, have *no essential bias*,
    while the estimate of the radius has essential bias


    \begin{equation}

    \mathbb{E}(\Delta\hat{R}) \stackrel{\text{ess}}{=} \frac{\sigma^2}{2R}, \tag{7.11}

