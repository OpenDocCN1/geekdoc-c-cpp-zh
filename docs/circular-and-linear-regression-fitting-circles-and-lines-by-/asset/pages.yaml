  md: '**Noise distribution: Cartesian model.** A vast majority of statisticians assume
    that each **e**$_i$ is a two-dimensional normal vector with some covariance matrix
    **V**. In image processing studies, as we explained in Section 1.3, it is most
    natural to consider *isotropic noise*; then **V** = $\sigma^2$**I**, where **I**
    denotes the identity matrix. In this case all our errors $\varepsilon_i$ and $\delta_i$
    are i.i.d. normal random variables with zero mean and a common variance $\sigma^2$.
    This is called Cartesian model. It will be our standard assumption.


    **Noise distribution: Radial model.** An interesting alternative to the Cartesian
    model was proposed by Berman and Culpin [18]. They noted that only deviations
    of the observed points *from the curve* affect the fitting procedure, while their
    displacement *along the curve* does not matter. Thus they simplified the Cartesian
    model by assuming that deviations only occur in the normal direction, i.e., **e**$_i$
    = $z_i$**n**$_i$, where $z_i$ is a Gaussian random variable with zero mean and
    variance $\sigma^2$, and **n**$_i$ is a unit normal vector to the curve $P(x,
    y; \Theta) = 0$ at the point **x̃**$_i$.


    In both Cartesian and radial model, the value of $\sigma^2$ is unknown and should
    be regarded as a model parameter. Concerning the true points **x̃**$_i$, $i =
    1, \dots, n$, two assumptions are possible.


    **True points location: Functional model.** We can assume that the true points
    are fixed (but unobservable) and lie on the true curve. Their coordinates ($\tilde{x}_i$,
    $\tilde{y}_i$) are treated as additional parameters of the model (called *incidental*
    or *latent parameters*). Since the true points are constrained to lie on the true
    curve (6.3), their locations can be described by $n$ independent parameters (one
    per point). Now the model has the total of $k + 1 + n$ parameters: $k$ principal
    parameters $\theta_1, \dots, \theta_k$ of the unknown curve, the unknown $\sigma^2$,
    and the locations of the true points. This assumption is known as *functional
    model*.


    **True points location: Structural model.** We can assume that the true points
    **x̃**$_i$ are independent realizations of a random variable with a certain probability
    distribution concentrated on the true curve $P(x, y; \Theta) = 0$. For example,
    if the curve is a line, $y = \theta_0 + \theta_1 x$, then $\tilde{x}_i$ can have
    a normal distribution with some parameters $\mu_0$ and $\sigma_0^2$, and $\tilde{y}_i$
    is then computed by $\tilde{y}_i = \tilde{\theta}_0 + \tilde{\theta}_1 \tilde{x}_i$.
    In this model, the number of parameters is fixed (independent of $n$): these are
    the $k$ principal parameters $\theta_1, \dots, \theta_k$ of the unknown curve,
    the unknown $\sigma^2$, and the parameters of the underlying probability distribution
    on the true curve. This assumption is known as *structural model*.


