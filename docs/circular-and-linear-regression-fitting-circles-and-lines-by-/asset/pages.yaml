    # 6.5  General algebraic fits


    Here we discuss curve fitting methods that are different from maximum likelihood
    estimation, i.e., from geometric fitting. Such methods are used in two ways, as
    it is explained in the beginning of Chapter 5. First, they supply an accurate
    initial guess to the subsequent iterative procedures that find the MLE. Second,
    they provide a fast inexpensive fit in applications where the geometric fitting
    procedures are prohibitively slow.


    Simple algebraic fit. Perhaps the simplest nongeometric fit is the one minimizing


    ```

    $$\mathscr{F}_1(\Theta) = \sum_{i=1}^{n} [P(x_i, y_i; \Theta)]^2. \quad (6.8)$$

    ```


    To justify this method one notes that $P(x_i, y_i; \Theta) = 0$ if and only if
    the point $(x_i, y_i)$ lies on the curve; also, $[P(x_i, y_i; \Theta)]^2$ is small
    if and only if the point lies near the curve. If we fit a circle $P = (x-a)^2
    + (y-b)^2 - R^2$, then the minimization of (6.8) brings us back to the popular
    Kåsa fit described in Section 5.1.


