  md: '**Implementation.** Practically, one can solve (5.5) by Cholesky factoriza-
    tion; this is perhaps the most efficient way, but it may lead to unnecessarily
    large round-off errors if **X** is nearly singular. A numerically stable (albeit
    some- what more expensive) approach is to rewrite (5.5) as


    $$ \mathbf{X}^{T} \mathbf{X A} = -\mathbf{X}^{T} \mathbf{Z} \tag{5.12} $$


    where $\mathbf{A}=(B, C, D)^{T}$ denotes the parameter vector and $\mathbf{Z}=(z_{1},\ldots,
    z_{n})^{T}$. Then the solution of (5.12) is $$ \mathbf{A}=-\mathbf{X}^{-}\mathbf{Z}
    $$ where $\mathbf{X}^{-}$ denotes the Moore-Penrose pseudoInverse, and it can
    be computed by the QR decomposition or SVD of the matrix **X** (see details in
    the second remark in Section 4.2). The SVD solution will work smoothly even in
    the sin- gular case, where $\det\mathbf{X}^{T}\mathbf{X}=0$.


    **Multiple solutions.** In the singular case (collinear data) the system (5.5),
    i.e., (5.12), has multiple solutions. Indeed, we can rotate and translate the
    co- ordinate frame to enforce $y_{1}=\cdots=y_{n}=0$ as well as $\bar{x}=0$. It
    is then easy to see that the system (5.5) determines a uniquely, but $b$ is left
    unconstrained. The SVD-based algorithm should return the so-called "minimum-norm"
    solution.


    Nievergelt [137] points out, however, that in the collinear data case the SVD
    solution is no *longer* invariant under translations. He proposes some mod- ifications
    to enforce invariance; see [137] for more details.


    **Square root issue.** Lastly, note that in any case (singular or not) we have
    $$ B^{2}+C^{2}-4 D \geq 0 \tag{5.13} $$ thus the evaluation of the radius $R$
    in (5.6) does not run into complex numbers. Indeed, by a translation of the coordinate
    frame we can ensure that $\bar{x}=\bar{y}=0$, hence the third equation in (5.5)
    implies $D=-\bar{z} \leq 0$, so (5.13) holds.


