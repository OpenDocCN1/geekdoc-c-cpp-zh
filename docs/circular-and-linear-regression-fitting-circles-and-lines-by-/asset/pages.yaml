    map can be visualized as the complex plane $$\mathbb{C}$$ “wrapped around” the
    sphere S. The inverse map, taking the sphere back onto the plane, is called *stereographic
    projection*, it “unfolds” the sphere onto the plane under it.


    ![](img/86db288e3c266985d1648282179ae4b5_242_0.png)


    Figure 8.1 *Stereographic projection of the Riemann sphere onto the plane. Data
    points (hollow circles) are mapped onto the sphere (black dots).*


    The above map is not defined at the north pole of the sphere. The map becomes
    complete if we transform the north pole to the special point $$\infty \in \bar{\mathbb{C}}$$.
    This makes sense as complex numbers with large absolute values are mapped to points
    near the north pole on the sphere. This establishes a one-to-one correspondence
    (bijections) between the extended complex plane $$\bar{\mathbb{C}}$$ and the Riemann
    sphere S. This bijection is continuous in both directions; in mathematical terms,
    it is a homeomorphism.


    **Transformation of lines and circles.** An important property of the Riemann
    sphere is that lines and circles in the complex plane are transformed into circles
    on the Riemann sphere.


    **Theorem 15** *If* $$\mathbb{L} \subset \mathbb{C}$$ *is a line in the complex
    plane, then its image on the Riemann sphere is a circle (passing through the north
    pole). If* $$\mathbb{O} \subset \mathbb{C}$$ *is a circle in the complex plane,
    then its image on the Riemann sphere is a circle (not passing through the north
    pole). Conversely, every circle on the Riemann sphere is mapped onto a line or
    a circle in* $$\mathbb{C}$$.


    Thus, lines and circles in the xy plane uniquely correspond to circles on the
    Riemann sphere S.


    Recall that when one fits circles to observed data, then lines should be allowed
    as well, i.e., one should use the extended model consisting of lines and circles;
    see Chapter 3. On the Riemann sphere, both types of objects are conveniently represented
    by circles.'
