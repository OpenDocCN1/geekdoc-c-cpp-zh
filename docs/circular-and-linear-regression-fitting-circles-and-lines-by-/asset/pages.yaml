    [104] and our Chapter 7) reveal that the bias $\pmb{\sigma}^2\mathbf{B}$ is the
    sum of terms of two types: some of them are of order $\pmb{\sigma}^2$ and some
    others are of order $\pmb{\sigma}^2/n$, i.e.


    $\mathbb{E}(\Delta\hat{\pmb{\Theta}})=\pmb{\sigma}^2\mathbf{B}+\mathcal{O}(\pmb{\sigma}^4)=\pmb{\sigma}^2\mathbf{B}_1+\pmb{\sigma}^2\mathbf{B}_2+\mathcal{O}(\pmb{\sigma}^4)$,


    where $\mathbf{B}_1=\mathcal{O}(1)$ and $\mathbf{B}_2=\mathcal{O}(1/n)$.


    We call $\pmb{\sigma}^2\mathbf{B}_1$ the essential bias of the estimator $\hat{\pmb{\Theta}}$.
    This is its bias to the leading order, $\pmb{\sigma}^2$. The other terms (i.e.,
    $\pmb{\sigma}^2\mathbf{B}_2$, and $\mathcal{O}(\pmb{\sigma}^4)$) constitute nonessential
    bias; they can be dropped according to our adopted rules. Then (6.30) can be reduced
    to


    $\mathbb{E}\left[\left(\Delta\hat{\pmb{\Theta}}\right)\left(\Delta\hat{\pmb{\Theta}}\right)^T\right]=\pmb{\sigma}^2\mathbf{V}+\pmb{\sigma}^4\mathbf{B}_1\mathbf{B}_1^T+\cdots,
