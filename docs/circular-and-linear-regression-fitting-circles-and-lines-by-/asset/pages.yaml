    any constraint matrix $\mathbf{N}$, has poor statistical properties, because the
    values $[P(x_{i}, y_{i}; \Theta)]^{2}$ minimized by (6.8) have little or no relevance
    to the geometric distances from $(x_{i}, y_{i})$ to the curve, thus the resulting
    estimates have little or no relevance to the MLE.


    To improve the accuracy of (6.8), one usually generalizes it by introducing weights
    $w_{i}$ and minimizes


    $\mathscr{F}_{2}(\Theta)=\sum_{i=1}^{n}w_{i}\left[P(x_{i}, y_{i}; \Theta)\right]^{2}$

    (6.13)


    This modification of (6.8) is called the *weighted algebraic fit*. The weights
    $w_{i}=w(x_{i}, y_{i}; \Theta)$ may depend on the data and the parameters.


    A smart way to define weights $w_{i}$ results from the linear approximation


    $\frac{\left|P\left(x_{i}, y_{i}; \Theta\right)\right|}{\|\nabla_{\mathbf{x}}
    P\left(x_{i}, y_{i}; \Theta\right)\|}=d_{i}+O\left(d_{i}^{2}\right)$


    where $\nabla_{\mathbf{x}} P=\left(\partial P / \partial x, \partial P / \partial
    y\right)$ denotes the gradient vector. Thus one can construct an “approximate
    geometric fit,” to the leading order, by minimizing


    $\mathscr{F}_{3}(\Theta)=\sum_{i=1}^{n}\frac{\left[P\left(x_{i}, y_{i}; \Theta\right)\right]^{2}}{\|\nabla_{\mathbf{x}}
    P\left(x_{i}, y_{i}; \Theta\right)\|^{2}}.$

    (6.14)


    This is a particular case of the weighted algebraic fit (6.13) with weights set
    to


    $w_{i}=\frac{1}{\left\|\nabla_{\mathbf{x}} P\left(x_{i}, y_{i}; \Theta\right)\right\|^{2}}.$

    (6.15)'
