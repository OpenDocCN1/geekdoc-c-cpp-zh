- pgno: 255
  md: '# 8.6


    The RTKD inversion-based fit


    In 2003, an interesting inversion-based circle fit was developed by Rusu, Tico,
    Kuosmanen, and Delp [159]. First, it is fairly accurate procedure because it properly
    accounts for the distance change under the inversion map. Secondly, it can work
    iteratively without a prior knowledge of a point on the desired circle (this will
    be presented in the next section).


    **Relation between distances.** First, the authors of [159] introduced proper
    weights to stabilize the inversion-based fit and achieve a good accuracy. Their
    analysis is actually similar to the one presented in Section 8.3 for the Riemann
    fit.


    Let $P$ and $Q$ be two nearby points on the $xy$ plane and $d = \operatorname{dist}(P,
    Q)$. Denote by $d''$ the distance between their images $\mathscr{F}(P)$ and $\mathscr{F}(Q)$.
    According to Theorem 17,


    ```

    $d'' = (x^2 + y^2)^{-1}d + \mathcal{O}(d^2)$

    ```


    where $(x, y)$ are the coordinates of $P$ (or $Q$). Furthermore, if a point $P
    = (x, y)$ is the distance $d$ from a circle $\mathbb{O}$ passing through the pole,
    then its image $\mathscr{F}(P)$ is the distance


    ```

    $d'' = (x^2 + y^2)^{-1}d + \mathcal{O}(d^2)$ (8.22)

    ```


    from the line $\mathbb{L} = \mathscr{F}(\mathbb{O})$. If the line $\mathbb{L}$
    is given by equation $\alpha x'' + \beta y'' + c = 0$, then we can solve (8.22)
    for $d$ and get


    ```

    $d = \frac{|(\alpha x'' + \beta y'' + c)(x^2 + y^2)|}{[\alpha^2 + \beta^2]^{1/2}}
    + \mathcal{O}(d^2)$. (8.23)

    ```


    Thus, if one wants to minimize distances $d_i$ from the original points $(x_i,
    y_i)$ to the fitting circle, then one should minimize


    ```

    $\mathscr{F}_{\text{RTKD}}(\alpha, \beta, c) = \sum_{i=1}^{n} \frac{(x_i^2 + y_i^2)^2(\alpha
    x_i'' + \beta y_i'' + c)^2}{\alpha^2 + \beta^2}, (8.24)

    ```


    which would be accurate to the first order. We call this procedure the Rusu-Tico-Kuosmanen-Delp
    inversion-based fit, by the names of the authors of [159], and abbreviate it by
    RTKD.


    We call the above method the $\mathcal{RTKD}$ $inversion-based$ $fit$. This is
    perhaps the most accurate variant of the inversion-based fit.


    This method is similar to the gradient-weighted algebraic fit (GRAF) described
    in Section 6.5; it is also similar to the proper Riemann fit of Section 8.4, which
    minimizes (8.19). All these fits are based on the first order approximation to
    the geometric distances from data points to the fitting curve, which provides
    the best accuracy possible for noniterative (algebraic) fits.'
