    rather intuitively, but later it was determined that he actually found the maximum
    likelihood solution, cf. [113, 126].


    In the special case κ = 1, i.e., σ² x = σ² y, the vector (κb, −1) = (b, −1) is
    normal to the line y = a + bx, thus we arrive at the familiar orthogonal fit.
    Hence, the EIV linear regression (1.24) includes the orthogonal fit as a particular
    case.


    The slope b given by (1.24) is monotonically increasing with κ (this follows from
    the standard fact s² xy ≤ s xx s yy by some algebraic manipulations, which we
    leave to the reader as an exercise). In the limit κ → 0, the EIV regression line
    converges to the classical regression of y on x with the slope b = s xy /s xx,
    cf. (1.3). Similarly, in the limit κ → ∞, the EIV regression line converges to
    the classical regression of x on y with the slope b = s yy /s xy. Thus the classical
    regressions (of y on x and of x on y) are the extreme cases of the EIV regression.


    The EIV line minimizing (1.23) can be made invariant under rescaling of coordinates
    x↦αx and y↦βy, as the scaling factors α and β can be incorporated into the ratio
    κ by the obvious rule κ↦κα/β. This fact was pointed out in 1947 by Lindley [126],
    who concluded that the estimate (1.24) thus conformed to the basic requirement
    of the EIV model: it does not depend on the units in which the measurements x1,
    . . . , xn and y1, . . . , yn are recorded.


    Actually, if one rescales the coordinates by x↦x and y↦κy, then in the new variables
    we have κ = 1. Thus the EIV regression line can be transformed to the orthogonal
    fitting line. Therefore, the EIV linear regression model (with the known ratio
    κ = σ x /σ y) can be converted to the orthogonal regression model by a simple
    rescaling of the coordinates, and vice versa.


    But we emphasize that the general EIV regression and the orthogonal fit must conform
    to different requirements:


    +   - The EIV regression must be invariant under scaling of the variables x and
    y (resulting from the change of units in which these variables are measured).


    +   - The orthogonal fit (due to its geometric nature) must be invariant under
    rotations and translations of the coordinate frame on the xy plane, as well as
    under similarities resulting from a change of unit of length.


    This difference has important consequences for nonlinear regression discussed
    in Section 1.9.'
