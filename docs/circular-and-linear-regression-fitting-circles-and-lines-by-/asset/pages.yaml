  md: 'Assume for a moment that $\mathbf{H}^{\circ}$ is nonsingular. Then the quadratic
    expression

    $$\mathcal{L} (\mathbf{a}) + \mathbf{D}^{T} \mathbf{h} + \frac{1}{2} \mathbf{h}^{T}
    \mathbf{H}^{\circ} \mathbf{h}$$

    has a minimum, it is attained at $\mathbf{h}$ that satisfies equation

    $$\mathbf{D} + \mathbf{H}^{\circ} \mathbf{h} = \mathbf{0} \tag{4.10}$$

    Hence $\mathbf{h} = -(\mathbf{H}^{\circ})^{-1} \mathbf{D}$, and the next approximation
    is $\mathbf{a}'' = \mathbf{a} + \mathbf{h}$. **Applying methods of linear algebra.**
    Introducing matrix notation $\mathbf{g} = (g_1(\mathbf{a}), \dots, g_n(\mathbf{a}))^T$
    and

    $$\mathbf{J} = \begin{bmatrix} \frac{\partial g_1}{\partial a_1} & \dots & \frac{\partial
    g_1}{\partial a_k} \\ \dots & \dots & \dots \\ \frac{\partial g_n}{\partial a_1}
    & \dots & \frac{\partial g_n}{\partial a_k} \end{bmatrix} \tag{4.11}$$

    we obtain $\mathbf{D} = 2 \mathbf{J}^T \mathbf{g}$ and $\mathbf{H}^{\circ} = 2
    \mathbf{J}^T \mathbf{J}$. Therefore, $\mathbf{h}$ is the solution of

    $$\mathbf{J}^T \mathbf{J} \mathbf{h} = -\mathbf{J}^T \mathbf{g} \tag{4.12}$$

    This equation corresponds to the overdetermined linear system

    $$\mathbf{J} \mathbf{h} \approx -\mathbf{g} \tag{4.13}$$

    which is the classical least squares problem of linear algebra, cf. Section 1.7.
    Its (minimum-norm) solution is

    $$\mathbf{h} = -\mathbf{J}^{-} \mathbf{g} = - (\mathbf{J}^T \mathbf{J})^{-} \mathbf{J}^T
    \mathbf{g} = -(\mathbf{H}^{\circ})^{-} \mathbf{D} \tag{4.14}$$

    where $(\cdot)^{ - }$ denotes the Moore-Penrose pseudoinverse. This formula works
    whether $\mathbf{H}^{\circ}$ is singular or not.


    Remark. One can arrive at (4.12) differently. As our goal is to minimize $\mathcal{L}
    = \|\mathbf{g}\|^2$, one can replace $\mathbf{g}(\mathbf{a}+\mathbf{h})$ with
    its linear approximation $\mathbf{g}(\mathbf{a}) + \mathbf{J}\mathbf{h}$ and minimize
    $\|\mathbf{g}(\mathbf{a}) + \mathbf{J}\mathbf{h}\|^2$ with respect to $\mathbf{h}$;
    this is exactly the classical least squares problem (4.13), and its solution is
    given by (4.14).


    Remark. The system of “normal equations”

    $$\mathbf{J}^{T} \mathbf{J} \mathbf{h} = -\mathbf{J}^{T} \mathbf{g}$$

    can be solved numerically in several ways. A simple inversion of the matrix $\mathbf{J}^{T}
    \mathbf{J}$ or the Gaussian elimination method are not recommended, since they
    do not take advantage of the positive semi-definiteness of $\mathbf{J}^{T} \mathbf{J}$
    and are prone to large round-off errors. A better method is Cholesky factorization
    of $\mathbf{J}^{T} \mathbf{J}$, it is fairly fast and accurate. Its drawback is
    somewhat poor performance when'
