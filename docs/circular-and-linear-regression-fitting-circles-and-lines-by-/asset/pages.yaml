  md: '**Theorem 3** $([73, 118, 143])$ For the Type $B$ model, the estimate $\hat{\boldsymbol{\theta}}$
    is asymptotically normal, and its limit distribution is described by


    $\sqrt{n}(\hat{\boldsymbol{\theta}}-\tilde{\boldsymbol{\theta}}) \rightarrow_L
    N\left(0, \frac{\sigma^2}{s_*}\left(1+\frac{\sigma^2}{s_*}\right)\right). \tag{2.22}$


    *Its variance satisfies*


    $\operatorname{Var}(\hat{\boldsymbol{\theta}})=\frac{\sigma^2}{n s_*}\left(1+\frac{\sigma^2}{s_*}\right)+\mathcal{O}(n^{-3/2}).
    \tag{2.23}$


    Recall that the estimate $\hat{\boldsymbol{\theta}}$ is unbiased, i.e., $\mathbb{E}(\hat{\boldsymbol{\theta}})=\tilde{\boldsymbol{\theta}}$,
    cf. Section 2.4.


    *Remark.* In the Type $A$ model, the asymptotic normality $(2.20)$ is ensured
    by the assumed normal distribution of errors $\delta_i$ and $\varepsilon_i$. If
    errors have a different distribution, then the asymptotic normality of $\hat{\boldsymbol{\theta}}$
    may be lost. In that case one can still derive an asymptotic formula for $\operatorname{Var}(\hat{\boldsymbol{\theta}})$
    similar to $(2.21)$ assuming that the errors $\delta_i$ and $\varepsilon_i$ have
    finite moments of order four.


    *Remark.* In the Type $B$ model, the asymptotic normality $(2.22)$ follows, as
    usual, from the central limit theorem, and one does not need to assume any specific
    distribution of errors $[73]$. The formula $(2.23)$ is derived under the assumption
    of normally distributed errors, but perhaps that assumption can be relaxed.


    **Practical remark.** A more pragmatic question is: which approximation to $\operatorname{Var}(\hat{\boldsymbol{\theta}})$,
    $(2.21)$ or $(2.23)$, should one use in practice, where $\sigma>0$ and $n$ is
    finite? Well, note that the leading terms in these formulas are identical and
    give a *first order approximation*:


    $\operatorname{Var}_1(\hat{\boldsymbol{\theta}})=\frac{\sigma^2}{S}, \tag{2.24}$


    as we should obviously set $s_*=S/n$. The second order terms are almost identical;
    they differ only by the factor $n-1$ in $(2.21)$ versus $n$ in $(2.23)$. Thus
    both formulas give essentially the same result in practice, we record it as


    $\operatorname{Var}_2(\hat{\boldsymbol{\theta}})=\frac{\sigma^2}{S}\left(1+\frac{(n-1)\sigma^2}{S}\right).
    \tag{2.25}$


    **Numerical test.** We verified the accuracy of the approximations $(2.24)$ and
    $(2.25)$ to $\operatorname{Var}(\hat{\boldsymbol{\theta}})$ numerically. We generated
    $10^6$ random samples of $n$ points whose true positions on a line were equally
    spaced on a stretch of length $L$, i.e., the distances between the points were
    $L/(n-1)$. The noise level $\sigma$ changed$^2$


    > $^2$Because of invariance under rotations and similarities, the results of our
    experiment do not depend on the position of the true line in the plane or on the
    value of $L$.'
