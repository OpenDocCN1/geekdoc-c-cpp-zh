- pgno: 14
  md: '# # Preface


    This book is devoted to an active research topic in modern statistics—fitting
    geometric contours (lines and circles) to observed data, in particular, to digitized
    images. In such applications both coordinates of the observed points are measured
    imprecisely, i.e., both variables ($x$ and $y$) are subject to random errors.
    Statisticians call this topic the Errors-In-Variables (EIV) model. It is radically
    different, and much more complex, than the classical regression where only one
    variable (usually, $y$) is random.


    Fitting straight lines to observed data with errors in both variables is an old
    problem dating back to the 1870s [1, 2, 117], with applications in general statistics,
    sciences, econometrics, and image processing. Its studies have a colorful history
    (which we overview in Chapter 1) through the twentieth century, and its most active
    period perhaps lasted from 1975 to 1995. By the late 1990s all the major issues
    in the linear EIV problem appeared to be resolved, and now this topic is no longer
    an active research area.


    For a detailed and complete account of the linear EIV regression studies, see
    surveys [8, 73, 126, 127, 132, 187] and books [40], [66], as well as Chapter 10
    in [128] and Chapter 29 in [111]. We note that the linear EIV problem, despite
    its illusive simplicity, is deep and vast; entire books, such as [66] and [40],
    are devoted to this subject. We only overview it as much as it is related to our
    main theme — fitting circles and other curves.


    Fitting *nonlinear* models to data with errors in both variables has been studied
    by statisticians since the 1930s [50, 55]. This topic can be divided into two
    parts. In one, the main goal is to describe observed data by a nonlinear function
    $y = g(x)$, such as a polynomial, or an exponential function, etc. In those applications
    the $x$ and $y$ variables usually have different natures, measured in different
    units, and errors in $x$ and $y$ may have different magnitude. Such applications
    are common in statistics and econometrics. A detailed presentation of this type
    of nonlinear model can be found [27]; see also the latest edition [28], updated
    and expanded.


    The second type of nonlinear EIV problems is common in image processing applications.
    In those, data points come from a picture, photograph, map, etc. Both $x$ and
    $y$ variables measure length and are given in the same units; the choice of the
    coordinate system is often quite arbitrary, hence errors in $x$ and $y$ have the
    same magnitude, on average. Fitting explicit functions $y = g(x)$ to'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# PREFACE


    images is not the best idea; it inevitably forces a different treatment of the
    $x$ and $y$ variables, conflicting with the very nature of the problem. Instead,
    one fits geometric shapes that are to be found (or expected) on the given image.
    Those shapes are usually described geometrically: lines, rectangles and other
    polygons, circles, ovals (ellipses), etc. Analytically, the basic curved shapes—circles
    and ovals—are defined by implicit quadratic functions. More complicated curves
    may be approximated by cubic or quartic implicit polynomials [150, 176]; however,
    the latter are only used on special occasions and are rare in practice. Our book
    is devoted to fitting most basic geometric curves—circles and circular arcs—to
    observed data in image processing applications. This topic is different from the
    nonlinear EIV regression in other statistical applications mentioned above and
    covered in [27, 28]. Fitting ellipses to observed data is another important topic
    that deserves a separate book (the author plans to publish one in the future).


    ![](img/86db288e3c266985d1648282179ae4b5_15_0.png)


    Figure 0.1 The Brogar Ring on Orkney Islands [15, 178]. The stones are marked
    by pluses; the fitted circle is the dotted line.


    The problem of fitting circles and circular arcs to observed points in 2D images
    dates back to the 1950s. Its first instance was rather peculiar: English engineers
    and archaeologists examined megalithic sites (stone rings) in the British Isles
    trying to determine if ancient people who had built those mysterious structures
    used a common unit of length. This work started in the 1950s and continued for
    several decades [15, 65, 177, 178, 179]; see an example in Fig. 0.1, where the
    data are borrowed from [178].


    In the 1960s the necessity of fitting circles emerged in geography [155]. In the
    1970s circles were fitted to experimental observations in microwave engineering
    [54, 108]; see an example in Fig. 0.2, where the data are taken from'
  merge: -1
  img_proc: true
- pgno: 16
  md: '[15]. Since about 1980, fitting circles became an agenda in many areas of human
    practice. We just list some prominent cases below.


    In medicine, one estimates the diameter of a human iris on a photograph [141],
    or designs a dental arch from an X-ray [21], or measures the size of a fetus on
    a picture produced by ultrasound. Archaeologists examine the circular shape of
    ancient Greek stadia [157], or determine the size of ancient pottery by analyzing
    potsherds found in field expeditions [44, 80, 81, 190]. In industry, quality control
    requires estimation of the radius and the center of manufactured mechanical parts
    [119]. In mobile robotics, one detects round objects (pillars, tree trunks) by
    analyzing range readings from a 2D laser range finder used by a robot [197].


    ![](img/86db288e3c266985d1648282179ae4b5_16_0.png)


    But perhaps the single largest field of applications where circles are fitted
    to data is nuclear physics. There one deals with elementary particles born in
    accelerators and colliders. The newborn particles move along circular arcs in
    a constant magnetic field; physicists determine the energy of the particle by
    measuring the radius of its trajectory; to this end they fit an arc to a string
    of mechanical or electrical signals the particle leaves in the detector [45, 53,
    82, 106, 107, 136, 173, 174, 175]. Particles with high energy move along arcs
    with large radii (low curvature), thus fitting arcs to nearly straight-looking
    trajectories is quite common; this task requires very elaborate techniques to
    ensure accurate results.


    We illustrate our discussion by a real–life example from archaeology. To estimate
    the diameter of a potsherd from a field expedition, the archaeologist traces the
    profile of a broken pot — such as the outer rim or base — with a pencil on a sheet
    of graph paper. Then he scans his drawing and transforms it into an array of pixels
    (data points). Lastly, he fits a circle to the digitized image by using a computer.


    A typical digitized arc tracing a circular wheelmade antefix is shown in'
