    are small. That does not make the convergence quadratic, but with some degree
    of informality it can be described as *nearly* quadratic.


    # 4.3 Levenberg-Marquardt correction


    The Gauss-Newton method works well under favorable conditions, in which case its
    convergence is fast, but it may still overstep the region where $\mathcal{G}$
    takes small values, as we noted above, and its performance may be problematic
    if the design matrix $\mathbf{N}=\mathbf{J}^{T}\mathbf{J}$ happens to be near-singular.


    **Augmenting the design matrix.** The Levenberg-Marquardt correction aims at eliminating
    these drawbacks. The design matrix **N** is augmented to


    ```

    $\mathbf{N}_{\lambda}=\mathbf{N}+\lambda\mathbf{I},$ (4.15)

    ```


    where $\lambda>0$ is an additional control parameter and $\mathbf{I}$ is the $k
    \times k$ identity matrix. In other words, the diagonal entries of $\mathbf{N}$
    are increased by $\lambda$. Then, instead of (4.12), one solves the new system


    ```

    $\mathbf{N}_{\lambda} \mathbf{h}=-\mathbf{J}^{T} \mathbf{g}$ (4.16)

    ```


    to determine **h**. Note that the matrix $\mathbf{N}_{\lambda}$, with $\lambda>0$,
    is always positive definite (while $\mathbf{N}$ is only guaranteed to be positive
    semi-definite), and in fact all the eigenvalues of $\mathbf{N}_{\lambda}$ are
    $\geq\lambda$.


    **Checkpoint.** After **h** has been computed, the algorithm passes through a
    checkpoint. If the new approximation $\mathbf{a}''=\mathbf{a}+\mathbf{h}$ reduces
    the value of $\mathcal{G}$, i.e.,'
