    longer significant, as the unbiasing procedure guarantees the same statistical
    properties—the lack of essential bias and consistency—whichever fit we employ.
    So we will restrict our analysis to the simplest algebraic fit: the Kåsa fit.


    Thus we arrive at the following circle fitting algorithm: assuming that the noise
    level $V=\sigma^{2}$ is known, find \textbf{A} satisfying


    ```

    (\mathbf{M}-\mathbf{V H}+8 V^{2} \mathbf{I}_{1}) \mathbf{A}=\eta \mathbf{N A}

