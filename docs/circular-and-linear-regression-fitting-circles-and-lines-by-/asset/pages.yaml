    &= \frac{1}{(2\pi\sigma^2)^{m/2}} \exp \left[ -\frac{1}{2\sigma^2} \sum_{i=1}^{n}
    \|\mathbf{x}_i - \tilde{\mathbf{x}}_i\|^2 \right] \tag{6.4}

    \end{aligned}

    $$

    ```


