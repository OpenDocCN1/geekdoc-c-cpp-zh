    # ### 6.4 Distribution and moments of the MLE


    After adopting certain models for the distribution of observables (Sections 6.1
    and 6.2) and deriving the corresponding MLE (Section 6.3), we can proceed to the
    main goals of our statistical analysis. In traditional statistics, estimators
    of unknown parameters are characterized by their probability distributions and
    especially by their moments; the moments provide such important characteristics
    as the *bias*, *variance*, and *mean squared error* of an estimate.


    Unfortunately, this traditional approach runs into formidable difficulties arising
    from the nature of our problem; these difficulties are described and illustrated
    in this section. They prompt statisticians to develop alternative approaches based
    on various approximations, we will present them in the subsequent sections.


    **Exact distribution of the MLE.** Due to the complexity of the curve fitting
    problems the exact distributions and moments of the maximum likelihood estimators
    cannot be determined in most cases. Even for the simplest task of fitting a straight
    line


    ```

    $$y = \alpha + \beta x$$

    ```


    to observed points, the distributions of the MLE $\hat{\alpha}$ and $\hat{\beta}$
    are given by overly complicated expressions, which involve doubly infinite power
    series whose coefficients depend on incomplete Beta functions; see [7].


    Exact formulas for the density functions of $\hat{\alpha}$ and $\hat{\beta}$ were
    derived in 1976 by Andersson [7, 10] who readily admitted that they were “not
    very informative” [8] and “not very useful” [7]. Instead, Andersson employed Taylor
    expansion to approximate the distribution function of $\hat{\beta}$, which allowed
    him to investigate some practical features of this estimator; see our Chapter
    2 for a more detailed account.


    In the case of fitting nonlinear curves, such as circles and ellipses, there are
    no explicit formulas of any kind for the maximum likelihood estimators themselves,
    let alone their probability densities. To our best knowledge, no one has ever
    attempted to describe the exact distributions of the corresponding MLE (although
    for the circle fitting problem, some related distributions were studied in [6,
    18, 31]).'
