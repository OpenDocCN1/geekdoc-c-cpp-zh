    that


    ```

    $$\mathscr{F}(\mathbb{O}_{k+1}) = \underset{\mathbb{O} \ni P_{k+1}}{\operatorname{min}}
    \mathscr{F}(\mathbb{O}) \leq \mathscr{F}(\mathbb{O}_k)$$

