  md: 'However, the performance of the Kåsa method may substantially deteriorate when
    the data points are sampled along a small arc, in which case it tends to grossly
    underestimate the radius.


    # 5.4 Chernov-Ososkov modification


    In the early 1980s, Chernov and Ososkov [45] proposed a modification of the Kåsa
    fit to improve its performance.


    Modified objective function. Observe that it is the extra factor \(4R^2\) in (5.15)
    that is responsible for the impaired performance of the Kåsa method. Chernov and
    Ososkov [45] suggest to get rid of that factor by minimizing a modified function
    \(\mathscr{F}_{2} = (2R)^{-2}\mathscr{F}_{1}\), i.e.,


    \(\mathscr{F}_{2}(a,b,R) = (2R)^{-2}\sum_{i=1}^{n} [ (x_{i} - a)^{2} + (y_{i}
    - b)^{2} - R^{2} ]^{2}.\)  (5.16)


    This formula has some history. It was introduced in 1984, in [45], for the purpose
    of fitting circular arcs to tracks of elementary particles in high energy physics.
    In 1991, it was employed by Karimäki [106, 107] who called it a “highly precise
    approximation.” In 1998, it was independently derived by Kanatani [96] in the
    course of statistical analysis of circle fits.


    Next, changing parameters \(a,b,R\) to \(B,C,D\), as specified by (5.3) (i.e.,
    as in the Kåsa method) gives


    \(\begin{aligned}\mathscr{F}_{2} = & \frac{1}{B^{2}+C^{2}-4D}\sum_{i=1}^{n}(z_{i}+Bx_{i}+Cy_{i}+D)^{2}
    \\ & = \frac{\bar{z}\bar{z}+2B\overline{xx}+2C\overline{yy}+2D\bar{z}+B^{2}\bar{xx}+C^{2}\bar{yy}+2BC\overline{xy}+D^{2}}{B^{2}+C^{2}-4D}
    .\end{aligned}\)  (5.17)


    Here we assume, to shorten the above formula, that the data set has been centered
    so that \(\bar{x} = \bar{y} = 0\) (otherwise the numerator would contain two extra
    terms: \(+2BD\bar{x} + 2CD\bar{y}\)).


    Reduction to a quartic equation. Observe that \(\mathscr{F}_{2}\) is a quadratically
    rational function of the unknown parameters. Chernov and Ososkov [45] set its
    derivative to zero, eliminated \(B\) and \(C\) from the resulting equations, and
    arrive at a polynomial equation of degree 4 (i.e., a *quartic* equation) in \(D\):


    \(D^{4} + a_{3}D^{3} + a_{2}D^{2} + a_{1}D + a_{0} = 0,\)  (5.18)


    where


    \(\begin{aligned}a_{3} & = 4\bar{z} \\a_{2} & = 3\overline{xx}^{2} + 3\overline{yy}^{2}
    + 10\overline{xx}\overline{yy} - 4\overline{xy}^{2} - \bar{z}\bar{z} \\a_{1} &
    = 2\overline{xx}^{2} + 2\overline{yy}^{2} - 4\bar{z}\bar{z} \left(\overline{xx}
    + \overline{yy}\right) \\a_{0} & = 2\overline{xx}^{2}\left(\overline{xx} + 3\overline{yy}\right)
    + 2\overline{yy}^{2}\left(3\overline{xx} + \overline{yy}\right) - 8\bar{z}\bar{z}\overline{xx}\overline{xy}
    - \bar{z}\bar{z}\left(a_{2} + \bar{z}\bar{z}\right)\end{aligned}\)  (5.19)'
