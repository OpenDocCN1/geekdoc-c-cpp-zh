- pgno: 40
  md: 'More generally, one may want to approximate a round object on an image by a
    perfect circle, or an oval by a perfect ellipse, or a box by a perfect rectangle,
    etc. We call this task geometric fitting problem. It consists of approximating
    a visible contour on an image by a simple geometric figure (line, curve, polygon,
    etc). We discuss approximation by lines in this section.


    In a coordinate system, the given points on the visible contour can be recorded
    as (x₁, y₁), ..., (xₙ, yₙ), and one looks for the best fitting line in the form
    y = a + bx. Hence again the problem looks like a familiar regression. But a close
    look reveals that both xᵢ''s and yᵢ''s may be imprecise, hence we are in the framework
    of the EIV model.


    Furthermore, there is a novel feature here: due to the geometric character of
    the problem, the errors in x and y directions should have the same magnitude,
    on average, hence we have a special case of the EIV model characterized by


    ```

    $\sigma_x^2 = \sigma_y^2.$

    ```


    In this case the “noise” vector (δᵢ, εᵢ) has a normal distribution with zero mean
    and a scalar covariance matrix, i.e., the random noise is isotropic in the xy
    plane. The isotropy means that the distribution of the noise vector is invariant
    under rotations. This property is natural in image processing applications, as
    the choice of coordinate axes on the image is often arbitrary, i.e., there should
    not be any differences between the x, or y, or any other directions.


    Conversely, suppose that the random vector (δᵢ, εᵢ) has two basic properties (which
    naturally hold in image processing applications):


    +   (a) it is isotropic, as described above,


    (b) its components δᵢ and εᵢ are independent.


    Then it necessarily has a normal distribution. This is a standard fact in probability
    theory, see e.g., [14] or Section III.4 of [60]. Thus the assumption about normal
    distribution (1.10) is not a luxury anymore, but a logical consequence of the
    more basic assumptions (a) and (b).


    ![](img/86db288e3c266985d1648282179ae4b5_40_0.png)


    Figure 1.3 Orthogonal regression minimizes the sum of squares of orthogonal distances.


    A practical solution to the special case $\sigma_x^2 = \sigma_y^2$ of the EIV
    model was'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'proposed as early as in 1877 by Adcock [1] based on purely geometric (rather
    than statistical) considerations. He defines the fitting line $y = a + bx$ that
    is overall closest to the data points, i.e., the one which minimizes


    $\mathscr{F} = \sum_{i=1}^n d_i^2$,


    where $d_i$ denotes the geometric (orthogonal) distance from the point $(x_i,
    y_i)$ to the fitting line, see Fig. 1.3. By using elementary geometry, we obtain


    $\mathscr{F}(a,b) = \frac{1}{1+b^2} \sum_{i=1}^n (y_i - a - bx_i)^2$.


    Solving the equation $\partial \mathscr{F} / \partial a = 0$ yields


    $a = \bar{y} - b\bar{x}$,


    where $\bar{x}$ and $\bar{y}$ are the sample means, cf. Section 1.1. By the way,
    recall that (1.14) also holds in the classical case, cf. (1.3). Now eliminating
    $a$ from (1.13) gives us a function of one variable


    $\mathscr{F}(b) = \frac{s_{yy} - 2bs_{xy} + s_{xx}b^2}{1 + b^2}$,


    where $s_{xx}, s_{xy}, s_{yy}$ are the components of the scatter matrix, cf. Section
    1.1. Next, the equation $\partial \mathscr{F} / \partial b = 0$ reduces the problem
    to a quadratic equation,


    $s_{xy}b^2 - (s_{yy} - s_{xx})b - s_{xy} = 0$.


    It has two roots, but a careful examination reveals that the minimum of $\mathscr{F}$
    corresponds to the following one:


    $b = \frac{s_{yy} - s_{xx} + \sqrt{(s_{yy} - s_{xx})^2 + 4s_{xy}^2}}{2s_{xy}}$.


    This formula applies whenever $s_{xy} \neq 0$. In the case $s_{xy} = 0$, we need
    to set $b = 0$ if $s_{xx} > s_{yy}$ and $b = \infty$ if $s_{xx} < s_{yy}$. We
    encourage the reader to derive the formula (1.16) and carefully examine the special
    case $s_{xy} = 0$.


    The above solution may be elementary, by our modern standards, but it has a history
    showing its nontrivial character. It was first obtained in 1878 by Adcock [2],
    who incidentally made a simple calculational error. Adcock’s error was corrected
    the next year by Kummell [117], but in turn, one of Kummell’s formulas involved
    a more subtle error. Kummell’s error was copied by some other authors in the 1940s
    and 1950s (see [89, 126]). Finally it was corrected in 1959 by Madansky [127].
    Madansky’s work [127] is perhaps the most cited in the early studies on the EIV
    regression.'
