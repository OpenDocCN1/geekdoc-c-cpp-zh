  md: '# Introduction


    In Chapters 1 through 5, you learned how to take a collection of documents and
    convert them into a vector space model that represents features of each document
    using numeric values. In this chapter, we discuss how to take that vector space
    model and assign each document to a small number of groups, called clusters. The
    basic idea is that documents within a cluster should be similar to each other,
    and documents in different clusters should be dissimilar to each other. The similarity
    between two documents is based on the similarity of features (such as terms or
    words) between documents. In this context, we discuss latent semantic indexing
    (LSI), which provides a method for determining the similarity of words and passages
    by the analysis of large text corpora. Then, we discuss the concept of topic extraction
    from a collection of documents. A topic is conceptualized as a collection of terms
    that capture the main themes or ideas in the document. Unlike cluster groups,
    where each document is assigned to only one cluster, the same document can be
    assigned to multiple topics, depending on how many ideas are represented in a
    document.


    # What Is Clustering?


    Cluster analysis is a generic name for a group of related techniques (such as
    unsupervised pattern recognition, unsupervised classification analysis, numerical
    taxonomy, typology constructions, Q-analysis, and so on) that automatically try
    to natural groupings in the data. One crucial difference between clustering and
    a typical classification model is the absence of any target variable (where classes
    or groups are known a priori) in the data. In the context of textual data, this
    means that no labeled training examples are needed before documents can be clustered
    into groups. This is why clustering is often referred to as unsupervised classification.


    As a conceptual activity, the assignment of objects into groups is something humans
    do routinely all through their lives to reduce the complexity of the environment
    they have to work with. The natural grouping of objects and observations is extremely
    important to many disciplines (such as statistics, psychology, sociology, biology,
    engineering, economics, and business). Each of these disciplines, in turn, has
    its own label to describe cluster analysis. Although the names might differ across
    disciplines, all disciplines share the fundamental concept of separating data
    suggested by the natural groupings in the data. In essence, cluster analysis attempts
    to group objects so that each object in a cluster is similar to the other objects
    in the same cluster. However, objects in different clusters are dissimilar to
    each other. In the context of textual data, objects are the documents that must
    be assigned to clusters so that within a'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'cluster, documents are similar, but between clusters, documents are different.


    The term-by-document matrix has been presented in previous chapters with terms
    in rows and documents in columns. For clustering, it often helps to visualize
    the transpose of that matrix, where documents are in rows (representing observations
    or objects) and terms in columns (representing variables). The idea in clustering
    is to put documents (rows or observations) into groups so that within the groups,
    documents (observations) are similar and between the groups, documents (observations)
    are dissimilar.


    # Similarity Metrics


    To identify any natural groupings in the vector space of textual data, you must
    first define similarity between the documents. In statistics, similarity is often
    measured via three broadly defined methods: distance, correlation, and association.
    Of these methods, distance- and correlation-based methods typically require metric
    data, whereas association measures can work on nonmetric data.


    In the distance-based methods, dissimilarity is conceptualized as the distance
    between objects. That is, if two things are similar, the distance between them
    must be small. If two things are dissimilar, the distance between them must be
    large. There are many distance metrics in statistics literature. Two commonly
    used ones are Euclidean distance and Mahalanobis distance. The Euclidean and Mahalanobis
    distance metrics focus on the magnitude of the values and portray objects as similar
    when they are close together in the variable space. The Mahalanobis distance (also
    called the generalized distance) is defined as:


    ```

    $(X_i - X_j)^T \sum (X_i - X_j)

    ```


    In equation, $\tilde{Xi}$ and $\tilde{Xj}$ are the vectors of variables for cases
    $i$ and $j$, and $\Sigma$ is the pooled group variance-covariance matrix. Unlike
    the Euclidean distance, the Mahalanobis distance takes into account covariances
    among variables when calculating the metric. In fact, if all of the variables
    are uncorrelated with each other, then the Mahalanobis distance reduces to the
    Euclidean distance. In the SAS Text Cluster node, the Mahalanobis distance is
    used in the EM algorithm to measure the distance between a document and a cluster.
    The Euclidean distance is used to measure the distance between clusters in hierarchical
    clustering.


    In correlation-based methods (such as cosine similarity introduced in chapter
    5),'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'high correlations indicate similarity (correspondence of patterns across variables)
    between objects (documents). Low correlation indicates dissimilarity between objects
    (documents). Corational measures represent patterns rather than magnitudes. These
    measures are often used in document search and retrieval in SAS Text Miner as
    discussed in Chapter 5.


    The association-based measures of similarity are typically used for non-metric
    variables. An association metric generally assesses the degree of agreement or
    matching between two pairs of observations. The simple matching coefficient (that
    measures the percentage of times that the two objects in variables) is an example
    of an association measure. Although these metrics are often intuitively appealing,
    for most practical clustering problems, the term-by-document matrix is too large
    and too sparse to effectively apply these metrics.


    # Clustering Algorithms


    Broadly speaking, clustering algorithms can be divided into four groups: hierarchical,
    non-hierarchical (or partition), probabilistic (or spectral density), and neural
    network (SOM/Kohonen). For more information about advantages and disadvantages
    of each algorithm, refer to Cluster Analysis.


    In hierarchical clustering, the algorithm iteratively groups objects into cascading
    sets of clusters so that clusters within a step are nested within a cluster from
    a prior (or subsequent) step. This can be achieved in a top-down (divisive) or
    bottom-up (agglomerative) manner. Within each there are many variants (such as
    single linkage, complete linkage, average, centroid, and Ward''s method) that
    differ based on distances between clusters are calculated. In SAS Text Miner,
    the hierarchical clustering method uses Ward''s minimum variance method to calculate
    the distance between two clusters. However, all variants of hierarchical clustering
    algorithms are available via SAS codes in SAS Enterprise Miner environment.


    Unlike hierarchical algorithms, partitioning algorithms (such as k-means) are
    non-incremental and simultaneously assign all observations to clusters based on...
    The term “k-means” implies that k clusters are used. Typically, the algorithm
    selects k centers in the data space. Then, it assigns all observations that are
    close to each center. The centers are updated to reflect the assignments of observations
    (that is, a new center becomes the average of all observations assigned to each
    center). The algorithm iterates through this process of assigning observations
    that are close to the centers, updating centers based on assignments until a convergence
    criterion is reached. Although k-means is a very popular and widely used'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'algorithm for clustering numeric data and is available as a node in SAS Enterprise
    Miner, it is not currently used in SAS Text Miner.


    Probabilistic (or spectral density) clustering can be viewed as identifying dense
    regions of the data space. An efficient representation of the probability density
    function is the mixture model, which asserts that the data be thought of as a
    combination of k elements corresponding to k clusters. The expectation-maximization
    (EM) algorithm is one of the most well-known and effective techniques for estimating
    mixture models. The EM algorithm assumes a probability density function (typically
    joint normal distribution) of the variables in each cluster. Then, the algorithm
    applies an iterative optimization to estimate the probabilities for each observation
    to belong to each cluster. The EM algorithm consists of two steps: the expectation
    (E) step and the maximization (M) step. In the expectation (E) step, input partitions
    are selected similar to the k-means technique. In this step, each partition is
    given a weight or expectation for each partition. In the second step, maximization
    (M), the initial partition values are changed to the weighted average of the assigned
    observations, where weights are identified from the E step. This cycle is repeated
    until the partition values do not change significantly as identified by the likelihood
    of the iteration.


    Neural networks are most widely known for their use in supervised classification
    (where a target variable with classes exists) or prediction problems. Another
    variant of this type of network, the self-organizing map (SOM), originally developed
    by Teuvo Kohonen, is often used in unsupervised classification or clustering.
    The Kohonen network typically contains two layers. The input layer consists of
    p-dimensional observations. An output layer (represented by a grid) consists of
    k nodes for k clusters, each of which is associated with a p-dimensional weight.
    Each output node is initially assigned a random weight. These random weights are
    modified as the network learns the pattern of input data. Input observations are
    presented to the network, and each observation is provisionally assigned to one
    of the nodes on the shortest Euclidean distance between each observation and each
    node. The node weights are updated based on which input observations are assigned
    to each node. Then, the process repeats itself, and starts presenting input observations
    to the nodes containing revised weights. The iterative process eventually stabilizes
    with weights corresponding to cluster centers in a way that clusters are similar
    to one another are located in close proximity on the map (grid). The technique
    is appealing for large dimensional data because it does two things simultaneously.
    It finds similarity among observations and represents them in a lower dimensional
    space on the map. The SOM/Kohonen method is available in SAS Enterprise Miner,
    but not currently used in SAS Text Miner.'
  merge: -1
  pgno: 179
