  md: '# Summary


    In this chapter, we covered in detail the text parsing task, a key and fundamental
    step in the text mining process. You have seen the advantages and disadvantages
    of various linguistics operations performed in this process, such as stemming,
    part-of-speech tagging, entity extraction, etc. These operations significantly
    impact the number and types of terms that are extracted from the corpus. A higher
    number of terms poses analytical and computational challenges. Hence, these operations
    should be chosen very carefully. In many situations, the business problem will
    influence the property selections.


    Entity and concept extraction in SAS Text Miner were also discussed in this chapter.
    A detailed discussion on these topics using SAS Content Categorization Studio
    is provided in Chapter 7. The next chapters cover tasks that follow text parsing:
    text filtering, text clustering, and topic mining.'
