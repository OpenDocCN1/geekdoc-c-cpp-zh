    # Merging or Splitting Topics


    You can merge topics to simplify results when terms are similar. In this example,
    it makes sense to merge the topics that contain negative terms such as “order.”
    To merge topics, select two or more topics and either click the icon or right-click
    and select Merge Topics from the context menu (as shown in Display C8.5). Alternatively,
    you can split a topic. To split a topic, select it, and then either click the
