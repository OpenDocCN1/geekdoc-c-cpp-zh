    # NLP Based Sentiment Analysis


    Parts- speech (POS) tagging is often the most time consuming and challenging task
    before doing sentiment analysis of any text data. Online textual reviews are often
    short, non-grammatical sentences and contain slang terms, abbreviations, and symbols
    which make the POS tagging even more difficult. However, the text mining in SAS*
    Enterprise Miner 12.1 provided us with good insights into what consumers are talking
    about in reviews. Those insights will come in very handy as you conduct sentiment
    analysis via SAS* Sentiment Analysis Studio 12.1.


    +   1. Open SAS Sentiment Analysis Studio 12.1. Start a new project. Use default
    settings for both the rule-based model and the statistical model.

    2. In the “Corpus” white workspace, right click and select “New Corpus.” Type
    in a name such as App_Reviews.\n3. Right click on “Positive” and choose “Add a
    Directory”. Go to the folder (Case Studies ► Case Study 3 ► APP_SM ► model ► pos)
    where files for modeling the positive sentiments are stored and click “select
    folder.” You will see the 250 positive reviews (text files) imported and listed
    in the “Reference Files” workspace. To see the contents of any particular file,
    click and select it in the Reference Files space (See Display C3.18).


