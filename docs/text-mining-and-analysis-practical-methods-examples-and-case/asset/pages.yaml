  md: '# Document Classification


    Document classification is the process of finding commonalities in the documents
    in a corpus and grouping them into predetermined labels (supervised learning)
    based on the topical themes exhibited by the documents. Similar to the IR process,
    document classification (or text categorization) is an important aspect of text
    analytics and has numerous applications.


    Some of the common applications of document classification are e-mail forwarding
    and spam detection, call center routing, and news articles categorization. It
    is not necessary that documents be assigned to mutually exclusive categories.
    Any restrictive approach to do so might prove to be an inefficient way of representing
    the information. In reality, a document can exhibit multiple themes, and it might
    not be possible to restrict them to only one category. SAS Text Miner contains
    the text topic feature, which is capable of handling these situations. It assigns
    a document to more than one category if needed (See Display 1.5). Restricting
    documents to only one category might be difficult for large documents, which have
    a greater chance of containing multiple topics or features. Topics or categories
    can be either automatically generated by SAS Text Miner or predefined manually
    based on the knowledge of the document content.


    In cases where a document should be restricted to only one category, text clustering
    is usually a better approach instead of extracting text topics. For example, an
    analyst could get an understanding of a collection of classified ads when the
    clustering algorithm reveals the collection actually consists of categories such
    as Car Sales, Real Estate, and Employment Opportunities.


    # Display 1.5: Text Categorization Involving Multiple Categories per Document


    Document 1


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_31_0.png)'
