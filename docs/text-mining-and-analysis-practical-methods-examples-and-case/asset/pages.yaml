  md: '# Introduction


    Every year since its inception, SAS* and users of SAS* products have been actively
    making significant knowledge contributions to the SAS* user community using SAS*
    regional conferences and SAS* Global Forum as a platform. So far, thousands of
    papers have been published in these conference proceedings various topic sections.
    Each year the number of contributions increased to its previous year and this
    trend is likely to continue in future. The array of SAS products, industry solutions
    and its user base is growing across the globe. You can anticipate a growing library
    of SAS* conference papers serving as free educational material showcasing several
    innovative applications of SAS* put into practice. What you see in online proceedings
    are papers published after they were accepted through careful selection and scrutiny
    from a big pool of submissions every year.


    Several scholars, efficient and experienced professionals from industry are handpicked,
    appointed as leaders/heads of individual sections based on their area of expertise,
    experience and knowledge. These are bestowed with a huge task of reading through
    all the paper abstracts submitted and select those that qualify to be presented
    at the conference and later published in the conference proceedings. The number
    of paper abstracts submitted to SAS* Global Forum 2013 was rumored to be somewhere
    between 600 and 650. However, only about 90 of them were finally accepted. Paper
    acceptance criteria may depend on a lot of factors. Some of these factors include:


    +   - Type of submission (internal – submitted as a submission by SAS* employee
    or external – submitted by an external user of SAS*)

    - Choice and relevance of the topic to the current section.

    - Displaying theoretical accuracy and writing skills in the content.

    - Showcasing a possible solution for a recurring problem in an industry or technology.

    - Providing a business application using trending SAS* product(s) or technology.

    - Discussing an innovative idea or technique.

    - Preference pre-set by the section leaders and conference organizers for anticipation
    of attendees'' background and interests.

    - Range of competitive topics covered by other authors in their submissions for
    that section.


    Though this list may not be exhaustive and accurate that many of these factors
    play important roles in deciding the fate of an abstract'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'submission. Except for the range of competitive abstracts submitted in that
    section by other authors, authors can make their best possible efforts to work
    on all other factors to increase the chance of their submission being selected.
    Once authors have finished working on their abstract(s), the most important step
    that lies in their hands is to choose the appropriate section to submit their
    abstract. Some sections are so popular that they are often inundated with submissions,
    creating a tough challenge for the evaluators to make their decisions in the selection
    process. Experienced authors may find it easy to narrow down to their top section
    choices (2 or 3) in which they may fit well to the section description and the
    abstract topic. In such cases, their submission, though rejected in one section,
    may be accepted in other section due to one or more of the reasons we discussed
    earlier in selection process. For example, a paper abstract discussing the usage
    of a unique segmentation method to distinctly identify several customer groups
    for better marketing and sales strategy may be applicable for both the ‘Customer
    Intelligence’ and ‘Data Mining’ sections. A custom-written SAS macro to address
    a data integration issue may qualify for both the ‘Data Integration’ and ‘Coder’s
    Corner’ sections. Hence, it is critical for an author to determine the appropriate
    sections for submission.


    # Objective


    In this case study, we attempt to address the issue of determining the section
    membership of a paper abstract submission based on its content. For this purpose,
    we use SAS Text Miner and SAS Content Categorization Studio to develop a rule-based
    categorizer. This taxonomy would serve as an application to automatically score
    and identify the most relevant and appropriate conference section in which an
    abstract should be submitted for a better chance of acceptance.


    # Data


    For this case study, we collected SAS* abstracts from SAS* Global Forum proceedings
    http://support.sas.com/events/globalforum/previous/online.html. We downloaded
    466 papers from 2008 to 2012 encompassing 5 sections: ‘Business Intelligence’,
    ‘Reports’, ‘Data Mining’, ‘Statistical Analysis’ and ‘Systems Architecture’. Using
    the %TMFILTER macro, we converted these papers from the PDF file format to text
    file and parsed to retain the content only abstracts. We also created a SAS data
    set ‘SGFpapers_sectionwise.sas7dat’ to hold these abstracts, file names and names
    of the sections which they belong under three different columns. We use this data
    set in SAS* Text Miner to automatically build Boolean rules and use'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'them in building rule-based categorization models in SAS® Content Categorization
    Studio. In addition to this data set, we also provided plain text files containing
    these abstracts in individual folders. These are used to test the categorization
    models in SAS® Content Categorization Studio. The data needed for this case study
    is available in the data folder Case Studies 2 provided with this book. See the
    website for this book. Copy the folder to a location (say for example, C:\Data)
    on your laptop or PC hard drive or use data directly from the given folder.


    Note: We tried to provide you with the step-by-step instructions in this case
    study for you to follow. However, steps such as parsing and filtering extensive
    analysis of results and careful modification of keep terms, parts of speech tags,
    entry list, stop list, synonym list, etc. Thus, it may not be possible for us
    to explicitly specify or mention all of the changes we make to the text nodes
    in this case study. An analyst would typically perform a series of iterative modifications
    and re-run the process in a text analysis exercise such until a desired result
    is achieved. Hence, we would like to explicitly mention to you that following
    these instructions may not exactly yield the same results for you. If you would
    like to see exactly the same results, we suggest you open the EM project provided
    to you that includes the EM diagram and process flow used for this case study.
    You may follow same instructions provided at the end of Case Study 1 to open the
    SAS Enterprise Miner project ‘SGF_CS_2’


    # Step-by-Step Instructions


    +   1. Create a new project in SAS® Enterprise Miner and name it ‘SGF_CS_2’. Create
