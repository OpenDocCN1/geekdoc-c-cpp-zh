- img_proc: true
  md: 'The strength of association between two terms, A and B in a corpus of documents,
    is calculated as follows:


    $Strength = log_e(1/Prob_k)$


    $Prob_k = \sum_{r=k}^n [n!/[r!(n-r)!]] \cdot p^r (1-p)^{(n-r)}$


    In this formula, n is the number of documents that contain term A and B.


    $k$ is the number of documents that contain both term A and term B.


    $p=k/n$ is the probability that term A and term B co-occur, assuming that they
    are independent of each other.


    Concept links can be generated by right-clicking a term in the Terms tables the
    interactive filter viewer, and selecting View Concept Links. Display 5.12 shows
    an example of the concept links for the term “calcium” from our example corpus.


