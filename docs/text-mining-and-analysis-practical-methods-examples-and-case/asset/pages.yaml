    sportsmen 0 1 1

    tells 0 0 1

    how 0 0 1

    to 0 0 1

    command 0 0 1

    the 0 0 1

    sport 1 0 1


    There are many theories that discuss what numbers should go into the cells of
    this matrix. In the simplest approach, each cell of the term-by-document document
    matrix is allowed to contain the term frequency or the number of times a term
    appears in the document (as shown in Table 5.2). Another simple measure is the
    presence or absence of a term in the document. A detailed discussion about term
    weighting techniques appears in the next section. Once you have a table-like structure,
    traditional statistical methods can be comfortably applied to identify key inputs
    (terms) that differentiate or categorize the documents without having to use any
    grammar rules. Table 5.2 can be visualized as rows identified by documents and
    columns identified by terms. Even with a decent size corpus of a thousand documents,
    you can end up with thousands of unique terms, resulting in a large dimensional
    matrix. The size of a term-by-document matrix can grow exponentially with more
    documents and more terms being extracted. As you can see from Table 5.2, there
    are many zeros in this table. This is because rare words make up a significant
    portion of the text. Sparseness is a key characteristic of a term-by-document
    matrix compared to any typical table used for data mining. This is in-line with
    what is expected according to Zipf’s law. The other two features of this table
    that make it unique is the absence of non-negative values and missing values.
    Algorithms that process text data have been developed to comply with the properties
    of a term-by-document matrix: sparseness, non-negative values, and high dimensions.


    # Text Filter Node


    In SAS Text Miner, the Text Filter node is primarily used for filtering documents
    and configuring the term weight and frequency weight settings. An important'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'objective of text mining analysis is to differentiate the documents in the
    corpus. In this effort, the key task is to identify significant terms that can
    discriminate the documents. Research in the field of information retrieval has
    shown that using simple term frequencies do not help in document discrimination.
    Terms with low and high overall frequencies are found to be very bad discriminators.
    The best discriminators are those with neither too high nor low frequencies—with
    document frequencies between n/10 and n/100 for a corpus of n documents.


    Various techniques are available that use term frequency, document frequency,
    number of documents that the term occurs in, and the size of the corpus to derive
    a weight for each term. Terms that occur often in a document are assigned a higher
    weight and are considered important because they better describe the document.
    Terms that occur less frequently in the corpus are assigned a higher weight because
    they better discriminate the documents in the corpus. The value that goes into
    the term-by-document matrix is calculated using these weights. Two different types
    of weights are used. The first one is frequency weight, also called the local
    weight (within a document). Frequency weighting is the transformation of the frequency
    of the occurrence of the term in a document using a weighting function. The other
    one is term weight, also called global (corpus wide). A weight is assigned to
    the term based on the overall frequency and document frequency. The cell value
    in a term-by-document matrix is a weighted value derived by multiplying the local
    weight and the global weight. One of the most popular weighting schemes in the
    field of information retrieval is tf-idf (term frequency, inverse document frequency)
    (Salton and Buckley, 1988). The term frequency (tf) (or the local measure) is
    calculated with the following equation:


    ```

    tf = \frac{tf}{max tdf}

    ```


    In this equation, tdf is the document-specific frequency for a term, and max tidf
    is the frequency of the most frequent term in a document. Longer documents tend
    to have more terms (and, hence, a high tidf). These high frequencies are normalized
    using max tidf. The idf (Sparck Jones, 1972) portion of the weighting scheme is
    the global frequency measure, which is calculated with the following equation:


    ```

    idf = log(\frac{N}{df})

    ```


    In this equation, N is the size of the collection, and df, is the number of documents
    in which the term t appears. The tf-idf measure is simply the product'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'of the local weight and global weight. The following section discusses different
    weighting schemes available in SAS Text Miner.


    Let $f_{ij}$ be the raw frequency of $ith$ term in the $jth$ document. You first
    use a function $g(\cdot)$ to transform the raw frequency, $g(f_{ij})$. Let $w_i$
    be the weight of the $ith$ term. The weighted frequency of the $ith$ term for
    the $jth$ document in a term-document matrix is given by $g(f_{ij})^* w_i$.


    # Frequency Weightings


    SAS uses three different local frequency weighting property settings: log, binary,
    and none.


    **Log: $g(f_{ij}) = log(f_{ij} + 1)$**


    This is the default setting for this property and is used to control the effect
    of high frequency terms in a document.


    **Binary: $g(f_{ij}) = 1$**


    This is the equation if a term is present in a document. $g(f_{ij}) = 0$ is the
    equation if a term is absent in a document. This setting clearly doesn''t differentiate
    between documents where a term is heavily present and between documents where
    a term rarely occurs.


    **None: $g(f_{ij}) = f_{ij}$**


    With this setting, the raw frequency value is used as is with no transformation
    done. This does not mean that no frequency weighting method is used.


    # Term Weightings


    With thousands of terms extracted from each document, the key question is, “Are
    all the terms in a document important?” Frequency weights help only in understanding
    the composition of a document. They do not help in identifying the terms that
    discriminate the documents. Each term is assigned a weight using any of the three
    methods methods available in SAS. The fundamental assumption in assigning a weight
    to a term is that the term occurs in only a few documents, but it occurs many
    times in those few documents, and the term is significant in discriminating the
    documents. The three global frequency weighting methods available in SAS for assigning
    a weight to a term are entropy, mutual information, and inverse document frequency.


    # Entropy


    Entropy is a sophisticated metric derived from the concept of information gain
    in'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'the field of information theory developed by Claude Shannon in the 1940s. Shannon
    used the concept of entropy from statistics to solve the problems of maximizing
    information transmission over imperfect channels of communication. In statistical
    parlance, entropy measures the average uncertainty in a single random variable,
    X, and is usually denoted as the following:


    ```

    $-\sum p(x) \log_2 p(x)$

    ```


    In this equation, $p(x)$ is the probability that the random variable X takes the
    value of $x$. In text mining, this technique uses the random variable (which represents
    the distribution of words across the corpus) in the calculation of the weight
    for a term.


    With the entropy method, the weight for term $w_i$ is calculated using the following
    equation:


    ```

    $w_i = 1 + \sum_{j=1}^n \frac{(f_{ij}/g_i)\log_2(f_{ij}/g_i)}{\log_2(n)} \quad$
    (Equation 5.3)

    ```


    Here, $g_i$, is the number of times term $i$ appears in the document collection,
    and $n$ is the number of documents in the collection. Because the logarithms of
    zero are undefined, the product in the numerator of the formula is 0, if $f_{ij}=0$.


    Entropy weight for a term is exactly once in all of the documents.


    ```

    $w_i = 1 + \sum_{j=1}^n \frac{(1/n)\log_2(1/n)}{\log_2(n)} = 1 + \frac{n^{\frac{-1}{n}}-(*\log_2(n))}{\log_2(n)}
    = 1-0$

    ```


    Entropy weight for a term is 1 if the term appears only once in onedocument.


    ```

    $w_i = 1 + \sum_{j=1}^n \frac{(1/1)\log_2(1/1)}{\log_2(n)} = 1 + \frac{1\times
    0}{\log_2(n)}=1$

    ```


    For all other cases, the terms have a value between 0 and 1. Generally speaking,
    the terms that occur infrequently in a few documents get higher weights, meaning
    these terms are considered to be providing more information than terms with lower
    weights.


    # Inverse Document Frequency (IDF)


    It is essential to study the relevance of collection frequency and document frequency
    in identifying important terms. For example, it is obvious that the SAS Global
    Forum is dominated by terms such as "sas institute," "paper," "data," and "information,"
    which are present in all the documents. These terms definitely do not help discriminate
    the documents. As shown in Display 5.4, the'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'terms “macro” and “information” occur with approximately the same frequency
    (collection frequency) in the SAS Global Forum corpus, whereas the document frequency
    is considerably different for the two terms. Hence, it makes sense to use document
    frequency instead of collection frequency in calculating the scaling factor.


    # Display 5.4: Term and Document Frequencies for the Terms “macro” and “information”


    | Term | # Docs |

    |---|---||

    | + macro | 7701 | 466 |

    | + program | 7657 | 703 |

    | + information | 7536 | 976 |

    | + user | 7334 | 702 |


    IDF is another measure used as a scaling factor in assigning an importance weight
    to a term. As the names imply, IDF calculates importance as the inverse of frequency
    of occurrence of a term in documents. A term that appears infrequently is considered
    more important and is given a higher score, whereas a term with a high frequency
    of appearance is considered less important and is given a lower score.


    $w_i = \log_2(\frac{n}{df_i}) + 1 \quad \text{(Equation 5.4)}$


    In this equation, $df_i$ is the document frequency or the number of documents
    that contain the $i$th term. $n$ is the number of documents in the collection.


    If a term appears in every document, then the IDF weight for that term is the
    following:


    $w_i = \log_2(\frac{n}{n}) + 1 = 0+1=1$


    The maximum IDF weight for a term occurs when the term appears in exactly one
    document. However, no upper limit exists for the maximum IDF weight because it
    depends on the number of documents and is equal to $1+\log_2n$.


    An IDF value of zero indicates that the word air appear in all documents and has
    an insignificant effect on discriminating the documents.


    # Mutual Information


    Mutual information can be derived as the difference between the entropy of variable
    X and the entropy of variable Y with the condition that X knows Y. That is, the
    mutual information is the reduction in uncertainty of X due the'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'knowledge of variable Y. In statistical parlance, mutual information between
    two variables works out to a symmetric non-negative measure of commonality between
    two variables. In text mining, this can be thought of as a measure of how much
    the presence of one term in a document tells us about whether the document belongs
    to a particular category. In SAS Text Miner, using this metric requires that your
    data contain a categorical variable. In text mining problems where you have both
    structured and unstructured data, you will likely see a need for this metric because
    in most situations, you will have a target variable. Metric is defined as the
    following:


    ```

    $w_i = \max_{C_k} \left[ \log \left( \frac{P(t_i, C_k)}{P(t_i)P(C_k)} \right)
    \right] \quad \text{(Equation 5.5)}$

    ```


    In this equation, $P(t_i)$ is the proportion of documents that belong to category
    $C_k$, $P(t_i, C_k)$ is the proportion of documents that contain the term $t_i$
    and belong to category $C_k$, $log(\cdot)$ is 0 if $P(t_i, C_k) = 0$ or $P(C_k)
    = 0$.


    The weight is proportional to the similarity of the distribution of documents
    that contain the term to are contained in the respective category. That is, in
    general, a higher mutual information weight for a term implies that the term tends
    to occur more in documents with the same target category. We demonstrate the benefits
    of this technique in Case Study 2.


    # None


    With this setting, no term weight is applied ($w_i = \mathbf{1}$).


    Term weights are used to scale the frequency weighting for a term in a document.
    Although the basic purpose of the previous methods is the same, it is difficult
    to make a definitive statement about which weight is the best metric. In general,
    entropy and IDF are most used in text mining applications, with entropy being
    more effective for smaller documents and IDF for larger documents. In practice,
    you are advised to try all of the methods and compare the results. Display 5.5
    shows the property settings for term weightings from the Text Filter node Properties
    panel.


    # Display 5.5: Text Filter Node Properties Panel'
