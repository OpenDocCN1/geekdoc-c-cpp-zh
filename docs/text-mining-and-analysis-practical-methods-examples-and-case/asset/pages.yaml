    The statistical models are grouped under two broad sets of options: simple and
    advanced. Regardless of the option you select, the algorithm, by default, uses
    80% of the data for training and 20% for validation. The percentages of training
    and validation data can be changed by the user based on what''s appropriate in
    the context of the analysis. By default (if the best option is not selected),
    four statistical models are built using smoothed relative frequency text normalization
    combined with four versions of a feature-ranking algorithm in the simple model
    scenario. If the best option is selected, 16 models are built in the simple model
    scenario by combining four different text normalization methods (relative frequency,
    smoothed relative frequency, Okapi BM25, and pivoted length normalization) with
    four versions of a feature-ranking algorithm (none, risk ratio, chi-square, information
    gain).


    The idea behind text normalization is that of using just the raw frequency of
    feature words, the algorithm uses a weighted relative index of frequency that
    takes into account the variability in document lengths and the number of feature
    words per document. The four different text normalization methods vary in terms
    of how they correct for document length and the number of feature words per document.
    The none feature-ranking algorithm uses an approach based on Bayes'' theorem to
    derive the weights of the feature words during the training process. The risk
    ratio, chi-square, and information gain feature-ranking algorithms modify the
    weights calculated by the Bayesian model using different frequency ratios of positive
    and negative training examples and how the feature words appear or not appear
    in them. The exact calculations and formulas for these options are the intellectual
    property of SAS and are not shared in the product documentation.


    The training results from any model are displayed both textually and graphically.
    To understand the model statistics, consider the 2x2 table of Actual (Positive
