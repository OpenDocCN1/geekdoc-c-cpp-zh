    # Identifying Parts of Speech


    After the extraction of tokens from the text, SAS Text Miner identifies parts
    of speech for each token or term based on both the definition of the term and
    the context. This is complicated because a word can represent multiple parts of
    speech depending on the context. This type of ambiguity can be because of the
    lexical definition of the term or the syntactic usage. For example, the word “institute”
    is lexically ambiguous because it can either be a noun or a verb. A syntactic
    ambiguity occurs in a sentence such as, “I made her duck.” The sentence can mean
    the following:


    +   - I cooked waterfowl for.

    - I caused her to quickly lower her head or body.

    - I waved my magic wand and turned her into a waterfowl.


    A deep understanding of the adjacent terms in the sentence or it is required to
    resolve the ambiguities and correctly identify the part of speech for a term.
    The written word loses the discriminating features of the spoken language, such
    as volume and inflection. The POS tagging algorithms overcome these challenges
    to a certain extent by using predefined rules. The tagger algorithms determine
    whether the word is a common noun, verb, adjective, proper noun, adverb, and so
    on. The goal of POS tagging is to create a group of syntactically related terms.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'Using the part-of-speech feature results in a much larger bag of words for
    analysis. As seen in Display 4.9, the word “similar” is identified as an adjective,
    proposition, and adverb, which makes it three different words. SAS Text Miner
    provides an option to turn the part-of-speech feature off completely or ignore
    terms assigned specific part-of-speech tags. This depends on the analyst''s choice
    and the type of the study. One way to overcome the lexical ambiguity for a term
    is to forcibly assign a part of speech to the term. For example, in our corpus,
    the term “author” is identified as a noun and as a verb. You can force the tool
    to treat the term “author” as a noun only by adding the entry (as seen in Table
    4.2) to the synonym list. This enforces the condition that the term “author,”
    when parsed as a verb, is treated as a noun.


    Table 4.2: Creating a Custom Synonym for the Term “author”


    | Term Role | Parent | Parent Role |

    |---|---|---|

    | Author Verb | | Author Noun |


    The other way to fix the ambiguity is to use the Treat as Synonyms option from
    the interactive viewer window as Given there are thousands of terms extracted,
    correcting the part-of-speech tagging for the terms using these types of approaches
    requires substantial human intervention. By now, you can understand why it might
    sometimes preferable to disable part-of-speech tagging to reduce the complexity,
    even though that might result in loss of information. You can safely ignore identifying
    parts of speech in situations where you have grammatically incorrect textual data
    (for example, in online chat comments, text messages or places where incomplete
    sentences are often used).


    In addition to POS tagging, SAS Text Miner can identify noun groups based on linguistic
    relationships that exist within sentences. For example, the words “data” and “model”
    are parsed as individual terms and are also identified as a noun group, “data
    model.” A noun group acts as a single term along with the other parsed terms.
    If stemming is enabled, noun groups are also stemmed. For example, the term “data
    models” You can either enable or disable the Noun Groups feature for your analysis.


