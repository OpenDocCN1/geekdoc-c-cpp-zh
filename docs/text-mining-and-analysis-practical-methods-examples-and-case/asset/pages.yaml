    # Concept Extraction


    Concept extraction involves the process of identifying and extracting valuable
    bits of information (or concepts) from text document collections. Concepts can
    be interesting pieces of information such as the names of entities. Common entities
    of interest are people, places, events, organizations. Similar to categories,
    concepts are defined in SAS Content Categorization Studio in a taxonomy structure
    that can be flat (concepts only) or hierarchical (concepts and subconcepts). Concept
    definitions in SAS Content Categorization Studio can be broadly classified into
    two types: classifier and grammar.


    # Classifiers


    Classifiers are either literal strings or regular expressions. A literal string
    is a word or phrase representing the name of an entity. Classifier definitions
    should contain a match string followed by a mandatory comma. It can have a return
    string after the comma as follows:


    ```

    match_string_literal,<return_string>

    ```


