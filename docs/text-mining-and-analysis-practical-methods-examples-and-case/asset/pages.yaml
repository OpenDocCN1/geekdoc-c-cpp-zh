    "[Bb]ig" match Either or big. Similarly, the expression in parenthesis (| - )

    is to search for a space or a hyphen after the letters "[Bb]ig." To include the

    words "BIGDATA" or "bigdata" (no space or hyphen between the two words) in

    search, we use the ? metacharacter, which matches the previous sub-

    expression zero or one. The letter "i" after the last slash is used to match all

    types of cases (small, upper, and proper case) of the string.


    # Using Perl Regular Expressions to Replace Exact Text


    In many situations, the business application demands to anonymize words

    in your text before you it in text mining. Perl regular expressions are of great

    help in performing text substitutions. The Perl substitution function, which is
    in

    PRXPARSE function, looks like this:


    ```

    PRXPARSE("/s/ pattern to find / to substitute /\");"

    ```


    You need to specify the substitution s before the first slash in the regular

    expression. In the previous example, if you want to replace different forms of
    the

    string "big data" with the string "Big Data," you can do it using PRXPARSE

    and PRXCHANGE functions. You can anonymize all of these words with a different

    keyword if required. Here is the DATA step for completing this:


