    # %TMFILTER Macro


    The program that runs beside the Text Import node is %TMFILTER. Starting with
    SAS Miner 4.1, this macro is available as a node. If you are using an earlier
    version of SAS Miner, the same operations of filtering and web crawling can be
    performed using this macro. It is supported in all operating systems for filtering
    and on Windows for web crawling. Here is the syntax:'
  merge: -1
  pgno: 102
- img_proc: true
  md: '```

    %TMFILTER(DIR=path,

    URL=path <DATASET=libref.>output-data-set,

    DEPTH=n,

    DESTDIR=path,

    EXT=extension1 <extension2 extension3...,

    FORCE=anything,

    HOST=name | IP address,

    LANGUAGE=ALL |language1 <language2 language3...,

    NORESTRICT=anything,

    NUMBYTES=n,

    PORT=port-number,

    PASSWORD=password,

    USERNAME=username)

    ```


    All of the options are available as properties of the Text Import node, except
    for FORCE, HOST, and PORT. The FORCE option is used to let the macro run even
    if the Destination directory is not empty. If no value is set for the property,
    or the macro will terminate the Destination directory is not empty. The HOST and
    PORT options are necessary for the SAS Document Conversion server to function
    properly. The HOST property specifies the name or IP address of the machine to
    run the %TMFILTER macro. If you do not specify a value, then the macro assumes
    that the SAS Document Conversion server will use its own defaults. The PORT option
    is used to specify the number of the port on which the SAS Document Conversion
    server resides. It is more convenient for troubleshooting if you are using the
    %TMFILTER macro for importing text. For more technical information and examples
    of how to work with the macro, see the SAS Text Miner User Guide.


    # Importing XLS and XML Files into SAS Text Miner


    In the previous sections, we demonstrated how you can extract data from documents
    with file extensions such as .pdf, .html, or .txt into the SAS Text Import node
    feature in SAS Text Miner to import the data, it grabs all of the text in one
    row of the output data set. Data is truncated in the TEXT field if its length
    exceeds the value provided in the Text Size property for the Text Import node.
    However, this is not the output that you would expect to generate. It is important
    to import each of the review comments as separate rows in the output data set.
    Hence, you can use the File Import functionality in SAS Enterprise Miner, located
    on the Sample tab, to import data from an Excel file. Drag and drop the node onto
    the Diagram workspace, and change the Import File property to point to the location
    of the Excel file. (See Display 3.21.) Change the Delimiter property to SP, which
    represents that space character'
