    # Concept Links


    Concept links help in understanding the relationships between words based on the
    co-occurrence of words in the documents. You can identify and define concepts
    in the text by selecting a keyword and exploring the words that are associated
    with this keyword using concept links. Concept links are intuitive and easy to
    understand because they are presented as interactive graphs. In the graph, the
    selected term is connected to other highly associated terms with a hub-and-spoke
    structure. The connected term can be expanded to display the terms associated
    with it. The structure can resemble a social network in which we can define multi-order
    associations. The width of the line between the center term and a concept link
    represents how closely the terms are associated. A thicker line indicates a strength
    of association as calculated using binomial distribution. Here is the formula
    for calculating the strength measure explained in the SAS Text Miner: Reference
    Help.'
