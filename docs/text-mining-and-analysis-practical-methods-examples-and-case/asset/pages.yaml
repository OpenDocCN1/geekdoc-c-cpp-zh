    # Term-By-Document Matrix


    The fundamental idea of applying classical data mining techniques to text mining
    relies on transforming text data (unstructured) to numbers (structured). This
    numerical representation of the text takes the form of a spreadsheet-like structure
    called a term-by-document matrix. In this matrix, dimensions are determined by
    the number of documents and number of terms in the corpus. Here is the same example
    from Chapter 1 for a term-by-document matrix.


    Consider a collection of three reviews (documents) of a book as provided below.


    Document 1: I am an avid fan of this sport book. I love this book.

    Document 2: This book is a must for athletes and sportsmen.

    Document 3: This book tells how to command the sport.


    Parsing this document collection generates the following term-by-document matrix
    in Table 5.2.


    # Table 5.2: Term-By-Document Matrix


    | Term/Document | Document 1 | Document 2 | Document 3 |

    |---|---|---|--|

    | am | 1 | 0 | 0 |

    | an | 1 | 0 | 0 |

    | avid | 1 | 0 | 0 |

    | fan | 1 | 0 | 0 |'
  merge: -1
  pgno: 156
