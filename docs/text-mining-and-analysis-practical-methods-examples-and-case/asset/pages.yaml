    # C_CONCEPT Definition


    The C_CONCEPT definition has all of the capabilities of a CONCEPT definition with
    the ability to match persons with a concept and detect partial matches. The C_CONCEPT
    definition uses a context marker _c to identify the words and phrases indicating
    the context in which it should find matches. For example, if you want to highlight
    or match SAS in the context of the company SAS Institute Inc., not SAS Scandinavian
    Airlines, you can write'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'a C_CONCEPT rule like the following:


    C_CONCEPT: ~c{SAS> Institute Inc.


    The greater than symbol > after the context returns partial matches for all occurrences
    of the term SAS in a document if the complete rule is found at least once in the
    document.


    # Display 7.28: Example Showing Context-Based LITI Concept Definition


    | SAS Institute Inc. recently celebrated its 35th anniversary at their world headquarters
    in Cary, NC. SAS is a global market leader in Business Analytics |


    # CONCEPT_RULE Definition


    A CONCEPT_RULE definition can be interpreted as having all of the features in
    the C_CONCEPT definition, plus the ability to use Boolean operators in the definition.
    The CONCEPT_RULE definition mandatorily requires a word or a phrase with a context
    marker _c and at least one Boolean operator to work. The syntax for Boolean operators
    is similar to what we use in the Boolean rule-categorizer. For example, you can
    find matches only when certain keywords appear in the Title and Body fields of
    an XML document. The following simple example shows a concept rule to find matches
    only when the keywords Abstract and SAS* appear within 200 words and in the specified
    order. However, the context is to cases where SAS* is followed by any word or
    name of the enterprise software with version number.


    > CONCEPT_RULE:(ORDDIST_200,"Abstract",OR,\_c{SAS*_cap_cap_digit},"_c{SAS*_w}\))


    Using this rule, you can find matches where SAS is mentioned in the abstract of
    a technical paper. The context marker _c highlight the keyword SAS* and the rest
    of the pattern when there is a match. SAS* programs and SAS* Enterprise Miner
    6.1 are highlighted and returned as matches in the abstract of a paper (as shown
    in Display 7.29).


