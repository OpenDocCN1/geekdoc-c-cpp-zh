  md: '# Introduction


    The service industry has always relied on customer feedback for improving day-to-day
    business operations. Customer feedback is collected through surveys sent to the
    customer via mail, telephone and email. A survey can be used to collect different
    types of information. Typically a large portion of a survey contains closed-ended
    questions. When collecting service feedback, these questions expect customers
    to rate their experience on a scale, such as a Likert-scale. In addition, a small
    portion of the survey questionnaire is devoted for open-ended questions where
    a customer is allowed to write about things not included in the survey. Until
    the last decade these textual comments, commonly referred as unstructured data,
    was considered junk that was eating storage space. With the growth of text analytics
    technology, companies have realized the value of various business questions successfully
    answering using text analytics applications like information retrieval, trend
    analysis, sentiment analysis, etc.


    Sentiment analysis is used to classify a document as either positive, negative,
    or neutral based on the valence of the writer''s opinion in the text. In many
    situations a single textual comment such as a product review cannot be classified
    as purely positive or negative. A reviewer might be talking about two features
    of a product where he expresses satisfaction with one of the features and is disappointed
    with other. Extracting sentiment at the sentence level would require sophisticated
    tools like SAS* Sentiment Analysis Studio. However in the presence of data with
    pre-classified sentiment at the document level, a model can be developed that
    can be used to understand reasons for positive and negative sentiment and score
    new comments for sentiment without manual intervention. The Text Rule Builder
    in SAS* Text Miner can be used to develop rules that identify the reasons for
    sentiment in the text. These rules can be used as a starting point for further
    sentiment analysis using SAS Sentiment Analysis Studio or for content categorization.


    In this case we explore patient response collected via a survey by one of the
    largest university hospitals in USA. For privacy concerns the name of the hospital
    in the text is changed to “UCARE”. Names of places, persons and other entities
    are also anonymized in the data. The response to the question “What was your overall
    experience with the service” is analyzed using SAS* Text Miner. The textual responses
    analyzed in this study are related to one of the hospital departments and were
    collected during a specific time period. Each response was manually classified
    as positive, negative, or neutral by experts. Whenever a comment had both a positive
    and negative sentiment, it was rated as neutral. This classification will be used
    as the target variable for training a model that can be'
