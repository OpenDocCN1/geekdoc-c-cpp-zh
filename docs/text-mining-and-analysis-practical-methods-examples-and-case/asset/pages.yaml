    # ### Analysis Using the Text Rule-builder Node


    The Text Rule-builder node is available in the SAS* Enterprise Miner version

    12.1 and above. The Rule-builder node creates an ad hoc set of rules with user-

    defable outcomes. These rules are basically Boolean if-then-else type rules

    that be exported to SAS* Content Categorization Studio


    For this part of demonstration, you will use the following data sets.


    +   - All_model.sas7dat (a data set that combines positive and negative

    comments for building models. This data set has 90% of all comments)

    - All_test.sas7dat (a data set that combines positive and negative comments

    for testing models built. This data set has 90% of all comments)

    - Engdict.sas7dat


    +   1. Create a new project in SAS* Enterprise Miner and create a library

    pointing to the location where the data resides using the project start code

    or File ► New ► ► Library menu. Create a new diagram.

    2. Create a new Data source using All_model.sas7dat. Make sure to change

    the ‘Role’ of variable ‘Sentiment’ in Step 5 of ‘Data Source Wizard’ to


    374'
