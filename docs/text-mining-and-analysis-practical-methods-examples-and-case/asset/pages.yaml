  md: '# Introduction


    In this age, in this country, public sentiment is everything. With it, nothing
    can fail; against it, nothing can succeed. Whoever molds public sentiment goes
    deeper than he who enacts statutes, or pronounces judicial decisions.


    Abraham Lincoln, 1858


    It is clear from President Lincoln’s famous quote that politicians realized the
    power of public sentiment a long time ago. Although keeping track of the public’s
    opinions and sentiments about topics and events of general interests has been
    in the domain of political and social scientists, marketers and businesses are
    typically interested in a consumer’s opinions and sentiments that specifically
    relate to their products, services, and so on. Monitoring what consumers are saying
    about a company’s brands and products how they are expressing their opinions and
    sentiments to others has always been important to businesses. The difference now
    is the scale and scope of a consumer’s opinions and expressions and the toolset
    that is available to marketers compared to what existed just a few years ago.
    Until the last century, businesses used surveys and focus groups from time to
    time to track consumer sentiments. With the widespread adoption of the Internet,
    the proliferation of social media channels (such as Twitter, Facebook, and others),
    and the abundant opportunity for consumers to express their opinions and sentiments,
    monitoring sentiment continuously has become more critical. Conceptually, there
    is a difference between asking people questions about their feelings and sentiments
    and getting answers people expressing their opinions and sentiments freely without
    any prompting. Although companies still continue to capture a customer’s opinions
    and sentiments via regularly scheduled surveys and focus groups, those methods
    need to be supplemented by what is freely expressed by consumers on the Internet,
    particularly in social media.


    “Conventional marketing wisdom long held that a dissatisfied customer tells ten
    people; but in the age of new social media, or she has the tools to tell millions,”
    says Paul Gillin, author of The New Influencers: A Marketer’s Guide to the New
    Social Media. Therefore, it becomes imperative for companies to actively monitor
    conversations on the web among consumers about a company’s brands, products, services,
    and to gle information about what positive and negative sentiments are being expressed.
    This is a challenging task for many reasons, as too many sites on the Internet,
    too many formats in opinions and sentiments are stored and displayed on the web,
    idiosyncrasies in expressed opinions that are both time and domain dependent,
    and so on. In this chapter, sentiment analysis is used as an umbrella term that
    covers the analysis of people’s expressed opinions, expressions, emotions, and
    sentiments about'
  merge: -1
  pgno: 249
