    Scoring


    In the last five years, you learned to perform text mining analysis using SAS
    Text Miner. Like any typical data mining process, the task that follows modeling
    is scoring. A model is trained using development data, and then it is applied
    to customer records in a production or live system to calculate a score for each
    record. An appropriate business action is performed on the calculated score. Similarly,
    a text mining process can be scored on new textual data. In the context of text
    mining, scoring means assigning a document to a cluster or to a topic. The Score
    node in SAS Enterprise Miner is used for this purpose. A Score node can be connected
    to a Text Cluster node or Text Topic node. If the data for scoring resides on
    a different database system, you can take the score generated by any of these
    nodes (Text Cluster or Text'
