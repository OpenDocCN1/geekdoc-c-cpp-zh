    between the documents. For example, by treating the terms “airlines,” “aviation,”
    and “aero” as similar, we can say that the documents contain any of these words
    are related. The stemming functionality enables SAS Text Miner to automatically
    assign synonyms to terms that can be represented by their root word forms. However,
    in some cases, the unchecked application of stemming rules might group words that
    are semantically different. For example, the words “university” and “universal”
    might be grouped together by a stemmer. This will lead to a potential loss of
    information. A closer look at the results from the stemming process is required
    for any application of text mining. The algorithm that stemming is known as a
    stemmer. A stemmer based on rules identify and strip suffixes from the words and
    reduce terms. For example, a rule might be the following, “If the word ends in
    “ed,” then remove “ed.”. SAS Text Miner uses a default-based stemmer, which can
    significantly reduce the number of terms. Stemming can be turned on (Yes) or off
    (No) using the Stem Terms property as shown in Display 4.4. The default value
