    \nMandelbrot (1954) has extensively validated Zipf's law. He identified that the\
    \ law holds true only in a restricted range of the word distribution. He noted\
    \ that the distribution according to the law is a bad fit, especially for high\
    \ and low rank terms. Zipf's law belongs to the class of power laws ($y=kx^c$),\
    \ with $c=-1$. According to a power law, the plot of frequency of the word and\
    \ rank of the word on a logarithmic scale is approximately linear with slope -1.\
    \ Display 5.3 shows the plot of frequency of the word and the rank on a logarithmic\
    \ scale. You can clearly see a huge deviation from linear distribution for very\
    \ high ranks. To achieve a better fit, Mandelbrot modified Zipf's law and suggested\
    \ the relationship between rank and frequency as the following:\n\n$f=P(r+\rho)^\\\
    alpha$ or $\\log f=\\log P - B\\log(r+\rho)$ (Equation 5.2)\n\nIn this equation,\
    \ $P, B$ and $\rho$ are parameters of the text. For $B=1$ and $\rho=0$, Mandelbrot's\
    \ formula simplifies to Zipf's law.\n\n# Display 5.3: Term Frequency versus Term\
    \ Rank (Log Scale)"
