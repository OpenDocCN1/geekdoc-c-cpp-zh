    From the statistics table, you will find that the model misclassification rate
    in training and validation is 29% and 30%, respectively. With a three-level target
    variable, the misclassification rate around 30% may sound reasonable. Other important
    results of the text rule builder node are the rules extracted from text. The rules
    are nothing but key terms that were identified to be significantly associated
    with a particular level of target variable. These rules are listed in the ‘Rules
    Obtained’ table. You will see hours, room, pharmacy, rude, etc being identified
    as rules for the target negative. In this data, all the rules are of single terms.
    Rules could also be conjunctions of terms and their negations. The order of rules
    listed in the table is very important. The second rule in the table is extracted
    using the documents that were not satisfied with the first rule. Similarly the
    third rule is extracted using documents were not covered by the first two. On
    a scoring data set, the rules are applied in the same order.


    The tables include valuable statistics for each rule which indicate generalizability.
    Consider the rule, “rude” (see Display C91). The “Remaining Positive/Total” column
    has a value 198/901. This value indicates that the rule is extracted using 901
    documents which are not covered by any of the previous rules in the table and
