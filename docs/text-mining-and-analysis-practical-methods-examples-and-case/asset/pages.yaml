    Zipf''s law continue to generate interest even today. It is universally accepted
    that Zipf''s law gives a rough distribution of words in a corpus. You can always
    identify a small set of words that account for almost 50% of the words in the
    corpus and identify a large set of words that occur very infrequently. You will
    find that these rare words account for a considerable portion of the text. The
    law tends to explain two forces that are controlled by the speaker and the hearer.
    The speaker is trying to minimize his effort using fewer types of words most often,
    and the hearer is trying to minimize his effort by having a large number of rare
    words (Marie, 1992).


