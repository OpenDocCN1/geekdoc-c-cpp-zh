  md: '# Information Extraction


    In a relational database, data is stored in tables within rows and columns. A
    structured query on the database can help you retrieve the information required
    if the names of tables and columns are known. However, in the case of unstructured
    data, it is not easy to extract specific portions of information from the text
    because there is no fixed reference to identify the location of the data. Unstructured
    data can contain small fragments of information that might be of specific interest,
    based on the context of information and the purpose of extracting those fragments
    of data such as the names of people, organizations, places, addresses, dates,
    times, etc., from documents.


    Information extraction might yield different results depending on the purpose
    of the process and the elements of the textual data. Elements of the textual data
    within the documents play a key role in defining the scope of information extraction.
    These elements are tokens, terms, and separators. A document consists of a set
    of tokens. A token can be considered a series of characters without any separators.
    A separator can be a special character, such as a blank space or punctuation mark.
    A term can be defined as a token with specific semantic purpose in a given language.


    There are several types that can be performed on textual data.


    +   * Token extraction

    * Term extraction or term parsing

    * Concept extraction

    * Entity extraction

    * Atomic fact extraction

    * Complex fact extraction


    Concept extraction involves identifying nouns and noun phrases. Entity extraction
    can be defined as the process of associating nouns with entities. For example,
    although the word “white” is a noun in English and represents a color, the occurrence
    of “Mr. White” in a document can be identified as a person, not a color. Similarly,
    the phrase “White House” can be attributed to a specific location (the official
    residence and principal workplace of the president of the United States), rather
    than as a description of the color of paint used for the exterior of a house.
    Atomic fact extraction is the process of retrieving fact-based information based
    on the association of nouns with verbs in the content (i.e., subjects with actions).'
  merge: -1
  pgno: 35
