  md: "# Importing Textual Data into SAS\n\nAs discussed in Chapter 1, the first step\
    \ in the text mining process is collecting textual data and setting up what is\
    \ sometimes referred to as a corpus. Often, a text corpus usually represents documents\
    \ from a particular domain. For example, all papers published in a journal during\
    \ a year could be a document corpus. Though collecting data looks like a simple\
    \ task, this is one of the most tedious and challenging steps in the text mining\
    \ process. This is because the unstructured data exists in various forms that\
    \ cannot always be directly processed by SAS Text Miner. A data conversion step\
    \ usually takes place before the data is used in the text mining task unless the\
    \ data is readily available as a SAS data set.\n\nThe data collection step heavily\
    \ depends on the business problem. This involves answering simple questions such\
    \ as the following:\n\n+   * What data is needed for this project?\n  * Customer\
    \ reviews, application documents, news articles, e-mails, etc.\n* Where is it\
    \ available?\n  * Client directory, database, data warehouse, web, etc.\n* How\
    \ is it available?\n  * PDF files, XML pages, Word documents, web pages, etc.\n\
    * When should the data be collected (when collecting non-static data)?\n  * Before\
    \ or after a specific event, data from wikis or blogs that are frequently updated.\n\
    \nOnce the data that is needed to solve the current problem is identified, the\
    \ next challenge is to collect the data and convert it for SAS Text Miner to process.\
    \ It is possible that you will face any of the following situations in your project:\n\
    \n+   1. Data is readily available as a SAS data set.\n2. Data is available as\
    \ textual files (PDF, XML, HTML, Word, etc.) in a directory or in a database.\n\
    3. Data needs to be collected from the Internet.\n\nThe text mining process in\
    \ SAS requires that the data be available to exist as a SAS data set (see situations\
    \ 2 and 3 for other formats). In the first situation, you can directly create\
    \ a data source and perform text mining. In the latter situations, the source\
    \ data has to be converted into a SAS data set. There are various ways to create\
    \ a SAS data set from the data available in commercial databases using SAS access\
    \ features. Files in common formats such as comma-separated values (CSV) or Microsoft\
    \ Excel can be easily imported into SAS using the SAS Enterprise"
  merge: -1
  pgno: 92
- img_proc: true
  md: 'Guide Data Import Wizard or the File Import node in SAS Enterprise Miner. The
    challenging part is to create SAS data sets from textual files. SAS Text Miner
    has the capability to create SAS data sets dynamically from textual files available
    in a directory or the web. This is accomplished using the Text Import node in
    SAS Text Miner.


    In Chapter 2, you learned how to collect data from the web and local files using
    SAS Information Retrieval Studio. Data collected using SAS Retrieval Studio is
    fed into SAS Text Miner for further mining accomplishments. The following sections
    discuss in detail the different ways to collect textual data using SAS Text Miner.


    # Importing Data into SAS Text Miner Using the Text Import Node


    The Text import node in the Text Mining collection of nodes can be used to import
    data into SAS Text Miner as a SAS data set. The source data can exist in a directory
    in any proprietary file format type. The Text Import node requires the SAS Document
    Server be installed and running for performing document conversion. More than
    100 formats are supported by the Text Import node. Some of them include the following:


    +   * Microsoft Word (.doc, .docx)

    * Microsoft Excel (.xls, .xlsx)

    * Microsoft PowerPoint (.ppt, .pptx)

    * Rich Text Format (.rtf)

    * Adobe Acrobat (.pdf)

    * ASCII (.txt)


    The node requires a source directory (or Import File directory) that contains
    all of the source files and a destination directory to save all of the converted
    files. SAS Text Miner traverses the source directory, extracts the text from the
    files in this directory, and creates plain text files in the destination directory.
    Any source file in a format not readable by SAS Text Miner is omitted from the
    document conversion. Similarly, if the number of characters in each file exceeds
    32,000, the file is truncated. If source data is collected from the web, the node
    crawls the websites, retrieves files, and puts them in the source directory before
    the extraction process. The node can easily identify the language of the document
    and then transcode the document into the session encoding. Analysts who prefer
    programming can perform the same text import tasks. They can automate the process
    using the %TMFILTER macro. We will discuss the macro in the next section.


    # (a) Extract Text from PDF Files and Create a SAS Data Set'
