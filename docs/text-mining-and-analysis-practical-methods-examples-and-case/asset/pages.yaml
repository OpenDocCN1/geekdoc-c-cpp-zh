    It is very common that analyzing text requires processing and understanding words
    together. Multiple terms could include simple words like “as far as” or include
    non-decomposable idioms like “to kick the bucket.” SAS Miner extracts and processes
    as a single term. SAS uses a dictionary, a default multi-word list, for identifying
    the multi-word terms. User-defined word terms created in the custom synonym list
    are added to the default dictionary. In the same way a start list is defined and
    managed, the tool provides a facility to use custom multi-word lists. A default
    multi-word list is provided. Some of the multi-word terms extracted and processed
