    represent a particular industry. The occurrences of industry-specific terms across
    the four decades can be used to understand the trend for industry. A frequency
    value of "n" for a term means that particular term was mentioned in the abstracts
    of "n" distinct conference papers. The frequency here is not the overall occurrence
    of the term, but the number of documents that the term occurs. This value can
    be obtained from #Docs column in the Terms window of the Text Parsing or the Filter
    results window


