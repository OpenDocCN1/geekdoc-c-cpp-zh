    project.


    # Display 8.2: Statistical Model Settings


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_257_0.png)


    To build statistical models, known class examples of documents must be available.
    These are typically stored as text (.txt) files in separate folders for each class
    (such as positive, negative, neutral, or unclassified). At this time, only positive
    and negative sentiments can be classified via the statistical model. However,
    it is possible to import the training documents that express ambivalent opinions
    into the neutral folder, or to import the documents that have not been reviewed
    by domain experts into the unclassified folder. A typical folder and file structure
    is shown in Display 8.3.'
