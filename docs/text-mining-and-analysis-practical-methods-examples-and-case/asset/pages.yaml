    # Analysis Using SAS* Sentiment Analysis Studio


    SAS* Sentiment Analysis Studio classifies the feedback into positive and negative
    sentiments and categorizes them into features. SAS* Sentiment Analysis Studio
    has three different types of models: statistical model, rule based model, and
    hybrid model. Hybrid model is a combination of a statistical model and a rule
    based model. In practice, a statistical model is often used as a starting point
    in sentiment mining, because it provides a baseline model that can be set up quickly.
    Using it as a starting point, a rule based model can then be built, after each
    lexicon rule can be modeled and analyzed over and over again. A successful rule
    based model may not explain results very intuitively for managers who may not
    delve deeply into statistical analysis.


    # Building a Statistical Model


    +   1. Create a new project in Sentiment Analysis Studio using the default settings
    for rule-based and statistical models.

