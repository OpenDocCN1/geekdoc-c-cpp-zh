  md: '# Introduction to Information Extraction and Organization


    In a little less than two decades, we have witnessed how the Internet has evolved
    and become an integral part of a common man''s life. The emergence of many e-commerce
    websites and social media channels has quickly turned the web into a breeding
    powerhouse of massive data, mostly unstructured in nature. In a scientific study
    conducted in 2011, the IDC estimated that the digital world produced 1.8 zettabytes
    (equivalent to 1.8 trillion gigabytes) of information in that year. It is approximated
    that the amount of data will multiply at least 50 times by the year 2020. This
    figure applies not just to content on the web, but also to data in documents and
    files stored on PCs and servers across the globe. This irreversible explosion
    of data poses quite a challenge for organizations that like to tap into even portion
    of this data and transform it into a format suitable for text analytics. Advanced
    scientific methods such as NLP greatly help organizations in the process of discovering
    useful nuggets of information hidden within a gazillion bytes of data.


    As a first step, organizations should be able to separate useful information (signal)
    from vast piles of unstructured data (noise). This process can be termed “information
    extraction.” It should not be confused with the science of information retrieval.
    Information retrieval is an umbrella term that covers many advanced concepts and
    techniques such as page ranking, document clustering, etc., which are broader
    than information extraction. In this chapter we discuss how SAS proprietary software
    can be used to extract unstructured data stored on the web or in file systems
    in a systematic and efficient manner. The extracted data can be parsed, transformed,
    and even exported to other SAS tools, which can consume this information, analyze,
    and produce useful results.


    # SAS Crawler


    Businesses can have multiple needs with textual data. Although text mining serves
    as a generic process to explore textual data, it is not necessarily the only need.
    For example, a product firm might require extracting its user reviews and understanding
    the sentiment of its products or brands in the market. An online media company
    might choose to categorize its document base into various predefined themes to
    help its users easily navigate and locate relevant articles or files based on
    their topics of interest. Some organizations might like to gather information,
    build an index, and facilitate a search interface for their office staff to access
    the content in an efficient manner. With such diverse needs, almost all organizations
    face challenges in managing such large volumes of text data.


    To gather and manage such massive volumes of data in a systematic fashion, you'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'need sophisticated tools capable of extracting text from almost any data source
    or data format. SAS offers exclusive web crawlers capable of performing directed
    crawls on the web, files, and feeds to grab relevant content and store it in raw
    files. These raw files can be used by other SAS Text Analytics products such as
    SAS Text Miner for analysis.


    # SAS Search and Indexing


    SAS Search and Indexing helps you choose and then create either a simple or advanced
    index to efficiently handle user-submitted search queries to retrieve relevant
    information. Queries are submitted against these prebuilt indexes to return the
    most relevant matching documents. SAS provides additional components, which are
    used to parse, categorize, and export the crawled documents to other SAS applications.
    These components form the heart of the entire IR framework.


    # SAS Information Retrieval Studio Interface


    SAS web, file, and feed crawlers, SAS Search and Indexing, and other supporting
    components are all integrated on a single framework—SAS Information Retrieval
    Studio. SAS Information Retrieval Studio is a graphical user interface in which
    you can configure, control, and monitor the end-to-end information extraction
    process. The high-level architecture diagram of SAS Information Retrieval Studio
    provides a general overview of all of the components and how they interact with
    each other. (See Display 2.1.) Throughout this chapter, we discuss various components
    of the SAS Information Retrieval Studio based on version 12.1. Screenshots referring
    to these components are subject to slight changes in later versions.


    # Display 2.1: Simple Architectural Diagram of the SAS Information Retrieval Studio
    Graphical Framework'
  merge: -1
  pgno: 52
- img_proc: true
  md: '![](img/2c338747b5eaca8c1cd68dcd87c24126_53_0.png)


    # Components of SAS Crawler


    **Web Crawler** – Extracts text from web pages on the Internet or on intranet
    sites.


    **File Crawler** – Extracts text from files or documents stored locally on PCs,
    shared network drives, or else.


    **Feed Crawler** – Extracts text from web feed formats such as RSS or Atom.


    **Core Components of the SAS Information Retrieval Studio Interface**


    **Proxy Server** – Controls the flow of documents pushed by the web or file and
    crawlers to the pipeline server. Functions like a pressure valve to maintain a
    steady movement of files fed by crawlers into the pipeline server.


    **Pipeline Server** – Documents the flow into the pipeline server from the proxy
    server. The pipeline server performs actions such as parsing, modifying files,
    analyzing content, or on the documents. It passes them to either the indexing
    server or another SAS application. This is arguably the most important component
    of the SAS IR framework. It works like the heart for a human body. The main function
    of the heart is to purify and pump oxygenated blood to various parts of the body.
    Similarly, a pipeline server helps cleanse, parse, convert, extract, and pass
    meaningful content to various SAS applications for further processing.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Components of SAS Search and Indexing


    **Indexing Server** – Builds an index of documents to help with searching them
    using the query server.


    **Query Server** – Helps with searching the documents based on the index built
    using the indexing server.


    **Query Web Server** – Hosts the query interface to help users search documents
    interactively.


    **Query Statistics Server** – Monitor user search queries through the query server.


    **Virtual Indexing Server*** – Distributes documents across a set of multiple
    index segments and maintains them as if they are all under one single large index.


    **Virtual Query Server** – Distributes the influx of user-submitted queries to
    several back-end query servers.


    # Other Important Components


    **SAS Markup Matcher Server** – Helps create custom templates to target specific
    sections of HTML web pages or XML files and extract only the wanted content. For
    example, you can do a simple web crawl to extract the contents of articles posted
    on a blog site. However, web pages generally contain links to other sites, articles,
    advertisements, banners, and comments sections. As a result, you might end up
    retrieving additional unwanted content during the web crawl. The SAS Markup Matcher
    helps you control what you need to extract.


    **SAS Document Conversion Server** – Document Conversion is an essential component
    of the IR process. It provides a means to convert documents in various file formats
    into individual TXT files. Documents in formats such as HTML, PDF, PPT, MS Word,
    etc., need to be normalized and converted to a common format that is understood
    by other SAS applications and the indexing server. This step is crucial in situations
    where a file crawl or a web crawl potentially retrieve documents in one or more
    of these formats.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Web Crawler


    A web crawler is a software program that traverses pages on the World Wide Web
    and leverages the embedded linkage structure through which web pages are interconnected.
    Web crawlers require a web page link to begin crawling (also known as a seed page
    or entry point).


    A typical web crawler starts parsing a seed page and scans for links in the seed
    page that point to other web pages. The newly found pages are again searched,
    parsed, and scanned recursively until all links referenced in this way are searched
    and all links are collected. While parsing these web pages for links, the web
    crawler grabs the actual content from them and stores it as document files. These
    files are often passed to other programs that work in conjunction with web crawlers
    to build indexes based on the document files. These indexes are helpful in retrieving
    the information on search queries entered by users. Parsing generally involves
    cleaning up HTML and other tags scattered across the source code of the crawled
    pages. Display 2.2 shows how a typical web crawler works. In this scenario, the
    seed page references two hypertext links (Link 1 and Link 2). Each link points
    to web pages that refer to other links (for example, Page 1 refers to Links 3,
    4, and 5, and Page 2 refers to Links 6 and 7).


    Display 2.2: A Typical Web Crawler Traversing through Web Pages'
  merge: -1
  pgno: 55
- img_proc: true
  md: '![](img/2c338747b5eaca8c1cd68dcd87c24126_56_0.png)


    **Link and Page:** A link is nothing but a URL that acts as a pointer to a web
    page. When you click on a link, it retrieves the associated content from the web
    and displays it as a web page in a browser. Throughout this chapter, link $n$
    represents a reference to the web page $n$.


    **Child Page:** All web pages that are linked to the seed page directly or indirectly
    through the linkage structure are considered child pages. In this example, any
    of the links shown in Display 2.2 can be reached by traversing through the links
    starting from the seed page. They are all child pages in this example.


    **Modes of Crawl:** Primarily, there are two modes that represent the two different
    directions in which a crawler can be guided to move through the linked list of
    web pages and retrieve content.


    # Breadth First


    The first direction guides the web crawler to search through all of the child
    pages at Depth 1 referenced by the seed page. Then, it searches through all of
    the child pages at Depth 2 referenced by the pages in Depth 1. This process repeats
    until all of the child pages related to the seed page are'
  merge: -1
  pgno: 56
- img_proc: true
