    # Determining Category Membership


    Earlier in this chapter, we discussed how match ratio plays an important role
    in assigning categories to documents based on linguistic rules. There could be
    a scenario where a document might be qualified for more than one category based
    on the match ratio. In this case, the best category is determined by another criterion,
    relevancy type. There are three choices of relevancy type in SAS Content Categorization
    Studio: operator-based (default), frequency-based, and zone-based.


    A frequency-based relevancy type is based on the number of rule in the document.
    The category for which the document gets the highest score is the best match.
    For example, consider two linguistic rule-based subcategories. They are **Bollywood**
    (eight terms and a match ratio of 25%) and **Hollywood** (six terms and a match
    ratio of 50%) in the category **Movies** (as shown in Display 7.16). The minimum
    number of terms required for a match to Bollywood is 2 (25% * 8), and 3 (50% *
    6) for Hollywood. If a document surpasses the minimum number for both these categories,
    the relevancy score helps in breaking the tie to determine which category needs
    to be assigned to the document.


    # Display 7.16: Examples of Simple Linguistic Rule-Based Categories


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_221_0.png)


    A movie review passed the test for both of these categories based on the match
    ratio. (See Display 7.17). However, it is assigned to the category Bollywood based
    on the relevancy score. It is important to choose the frequency-based relevancy
    type by selecting **Project > Settings** for this.


    # Display 7.17: Example Showing Role of Match Ratio in Assigning a Category'
