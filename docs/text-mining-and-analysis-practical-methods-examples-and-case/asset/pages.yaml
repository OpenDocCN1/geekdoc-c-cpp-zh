  md: '# NO_BREAK Definition


    The NO_BREAK definition enables you to prevent partial matches where the context
    is not suitable for a match. For example, you can write a definition to match
    the name of a person while making sure it doesn''t return a match when the same
    name is used to mention a landmark, place, or city. The following example shows
    you can prevent a match return when the keywords Boone Pickens are followed by
    a noun indicating a non-match:


    ```

    CLASSIFIER:Boone Pickens

    NO_BREAK: _c{Boone Pickens :N}

    ```


    Boone Pickens is returned as a match detected as a person, but not when followed
    by the noun stadium (as shown in Display 7,30). Instead of part-speech tags in
    the NO_BREAK definition, you can reference a CLASSIER concept, listing all possible
    keywords to prevent partial matches.


    # Display 7.30: Example Showing Usage of NO_BREAK LITI Definition


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_234_0.png)


    # REMOVE_ITEM


    It helps to prevent a match concept when there is an overlapping match found by
    a match key. This requires the Boolean operator ALIGNED and a context marker to
    specify the concept. For example, Wall Street is a famous landmark in New York
    where the New York Stock Exchange and many financial giants are located. You can
    indicate Wall Street as one of the landmark locations in New York and avoid a
    match for the StreetName concept when it is found in the document. These concepts
    are defined as follows:


    # Landmark


    ```

    CLASSIFIER:Wall Street

    CLASSIFIER:Times Street

    CLASSIFIER:Brooklyn Bridge

    CLASSIFIER:Union Square

    ```


    # StreetName


    ```

    CONCEPT: _cap Street

    REMOVE_ITEM:(ALIGNED,“_c{StreetName}”, “Landmark”)

    ```'
