  md: '# Text Parsing Node in SAS Text Miner


    In the process flow, the Text Parsing node must be preceded by a node that exports
    a training data source. Typically, it is either a Data Source node or a Text Import
    node. A SAS Code node can act as a data source when using the %TMFILTER macro
    for data collection. The input data should contain at least one variable with
    Role Text, Text Location, or Web Address. In the previous chapter, there were
    two data collection methods. In one method, the snippet of the text is captured
    in a single cell. In the other method, in the latter case, you should use the
    FILTERED variable that captures the path to the full document. The role of the
    variable, FILTERED, must be set to Text Location in the Text Parsing node.


    Let''s go back to the data set that was created from the SAS Global Forum using
    the Text Import node in Chapter 3. Display 4.3 shows the variables accessible
    from the Text Parsing node when it is connected to the Text Import node. When
    this node is run, the text of all SAS Global papers is accessed using the path
    to the file available in the FILTERED variable.


    # Display 4.3: Input Variables for Text Parsing


    | (none) | not Equal to | Mining |

    |---|---|---||

    | Columns: | Name | Use | Report | Role | Level |

    | FILTERED | Default | No | Text Location | Nominal |

    | TEXT | Default | No | Text | Nominal |

    | uri | Default | No | Web Address | Nominal |


    The Text Parsing node starts with breaking down the text stream into tokens (or
    words). Various actions are performed on the identified word list based on the
    property values set in the Properties panels. These settings significantly impact
    the number of terms that will be used for analysis in the nodes. Remember that
    the larger the number of terms that are used for analysis, the more complicated
    the text mining turns into. The Text Parsing node features are invaluable in controlling
    the number of terms that are extracted for text mining. Most of the tasks performed
    through this node act as a preliminary method of reducing the dimensions of a
    document-by-term matrix. An in-depth discussion on the mathematical techniques
    for dimension reduction is provided in the next chapter.


    # Stemming and Synonyms


    Text mining mainly deals with the co-occurrence of the terms in a document and'
