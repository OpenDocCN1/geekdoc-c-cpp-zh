    The testing interface (as shown in Display 8.7) provides several options to customize
    the testing process and results. The first option, **Default test type**, allows
    users to select either a statistical or rule-based model. The **Probability threshold**
    is a cutoff value to classify a document as positive or negative. This is the
    same concept explained earlier in the advanced statistical model options. The
    **Activated statistical model** allows users to select a specific model from statistical
    models that might have been trained and validated in the current project. The
    **Relative weight of positive rules in rule-based model** determines how much
    importance is assigned to positive rules compared to negative rules in calculating
    an overall sentiment score for each document. The default value of 100% means
    both positive and negative rules are equally weighted. If you have built a hybrid
    model (a combination of statistical statistical and rule-based model), the **Weight
    of statistical model in hybrid model** enables you to designate the relative importance
    of the statistical model over the rule-based model.


