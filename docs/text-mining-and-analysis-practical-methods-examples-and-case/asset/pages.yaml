  md: '# An Introduction to SAS Enterprise Miner and SAS Text Miner


    SAS Enterprise Miner lets you build predictive and descriptive data mining models
    based on large volumes of data. The easy-to-use interface simplifies many tasks
    associated with applied data mining, including text mining. Text mining results
    can be easily integrated with the data mining model process flow to enhance model
    performance. SAS Enterprise Miner offers secure analysis management and provides
    a wide variety of tools with a consistent graphical interface. You can customize
    it by incorporating your choice of analysis methods and tools that you want to
    analyze. The interface window is divided into several functional components.


    +   * The menu bar and corresponding shortcut buttons perform the usual Windows
    tasks, in addition to starting, stopping, and reviewing analyses.

    * The Project panel manages and displays data sources, diagrams, results, and
    project users.

    * The Properties panel enables you to view and edit the settings of data sources,
    diagrams, nodes, and users.

    * The Help panel displays a short description of the property that you select
    in the Properties panel. Extended help can be found in the Help Topics option
    in the Help main menu.

    * In the Diagram workspace, process flow diagrams are built, edited, and run.
    The workspace is where you graphically sequence the tools that you use to analyze
    your data and generate reports. The Diagram workspace contains one or more process
    flows.


    A process starts with a data source and sequentially applies SAS Enterprise Miner
    tools to complete your analytic objective. A process flow contains several nodes.
    Nodes are SAS Enterprise Miner tools connected by arrows to show the direction
    of information flow in an analysis. The SAS Enterprise Miner tools available to
    your analysis are contained in the tools palette. The tools palette is arranged
    based on the SAS process for data mining, SEMMA (Sample, Explore, Modify, Model,
    and Assess). Additional tools are available in the Utility group. Other specialized
    groups (for example, Credit Scoring, Applications, Text Mining, and Time Series)
    are available if licensed. Each group of tools contains specialized tools for
    doing appropriate analysis. For example, the Text Mining group contains the following
    tools: Text Cluster, Text Filter, Text Import, Text Parsing, Text Topic, and Text
    Rule Builder.


    # Display 3.1: SAS Enterprise Miner Interface'
