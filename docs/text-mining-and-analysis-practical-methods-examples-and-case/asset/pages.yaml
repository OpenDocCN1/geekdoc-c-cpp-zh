    # Spell Checking


    Misspelled words often account for a major part of the noise that comes with text.
    Even a professionally written document can contain misspelled words. This type
    of noise is even more frequent in informal text like customer comments, emails,
    online discussion forums, etc. After text parsing is performed and terms are extracted,
    a dictionary can be used to spell check and correct misspelled words. When no
    dictionary is used, SAS Miner compares words with each other in the corpus to
    identify misspelled words. Most frequently occurring words are considered to be
    correctly spelled, and they are used to correct the less occurring words. When
    using a dictionary, any word that is in the dictionary is considered correctly
    spelled.


    The algorithm calculates a customized distance score using the SPED function from
    Base SAS. The distance score is the distance between the less frequently occurring
    word, called the child term, and all other frequently occurring words starting
    with the first letter, called the parent term. The distance score is the measure
    of how close the misspelled word is to the parent term in terms of spelling. The
    smaller the distance score, the closer the terms. Spell checking can can'
  merge: -1
  pgno: 140
