  md: '# Summary


    In this chapter, we discussed some of the key technical concepts in text mining
    analysis used for identifying clusters or topics in the textual corpus. We explained
    the mechanics of the different clustering algorithms available in SAS Text Miner.
    We demonstrated the topic extraction functionality in SAS Text Miner. Remember
    that text mining is an iterative and exploration-oriented analysis. There is no
    one specific clustering technique or topic extraction setting that yields the
    best results. Hence, often, an analyst is required to go back in analysis and
    modify property selections in the Text Parsing and Text Filter nodes. These changes
    can alter the term-by-document matrix considerably. Further, these changes have
    significant impact on the clusters and the topics extracted. Cluster analysis
    and topic extraction suffer from the curse of dimensionality in the term-by-document
    matrix. SVD is used to reduce the dimensionality in the term-by-document matrix.
    Although a higher number of SVDs can summarize the data better, they are not wanted
    due to computing limitations and the higher risk of fitting the noise. SAS Text
    Miner provides a user with the ability to control the number of SVDs to use in
    the analysis.'
