    # SEQUENCE AND PREDICATE_RULE Definitions


    These definitions are useful to locate and extract facts from textual data. A
    fact is a structured relationship between two or more concepts that is not known
    before analyzing documents. Concepts can be names of people, cities, locations,
    countries, etc. When concepts occur together in a sentence to form facts, they
    can be extracted using either SEQUENCE or PREDICATE_RULE definitions. SEQUENCE
    is useful to extract facts when the individual concepts are in a specific sequence.
    It requires at least two arguments to assign the returned matches based on the
    concepts found. For example, you can extract the names of people, their designations,
    and their affiliated organizations from a document without explicitly mentioning
    their names in the definition. Here is a list of concepts defined for this purpose:


    # Organizations


    +   - CLASSIFIER:SAS

    - CLASSIFIER:Apple

    - CLASSIFIER:Microsoft

    - CLASSIFIER:Google


    # Designations


    +   - CLASSIFIER:CEO

    - CLASSIFIER:Chief Executive Officer

    - CLASSIFIER:Chairman

    - CLASSIFIER:VP

    - CLASSIFIER:Vice President

    - CLASSIFIER:CTO

    - CLASSIFIER:Chief Technology Officer


    # Tags'
