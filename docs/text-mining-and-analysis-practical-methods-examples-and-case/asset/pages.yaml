- img_proc: true
  md: 'workbook. For example, the worksheet Sheet1 in TabletReviews.xls contains all
    of the review comments that we need. Data values in the first row of columns in
    the worksheet can be used to name the variables in the output data set.


    # Program 3.1: SAS Code to Import Data from an Excel File


    ```

    PROC IMPORT

    /* Library and name of the data set in which the output is stored */

    OUT=work.TabletReviews

    /* Physical path of the input file to read data */

    DATAFILE="C:\test\TabletReviews.xls"

    /* Data source identifier specifying the type of data to import */

    DBMS = XLS

    /* Overwrite SAS output data set, if it already exists */

    REPLACE;

    /* Name of the worksheet containing the data to import */

    SHEET = ''Sheet1'';

    /* Data values in first row used to name variables in SAS data set */

    GETNAMES=YES;

    ```


    RUN;

    If you run this code, you will find that the SAS data set TabletReviews has been
    created in your Work library with all of the review comments stored as individual
    rows. This is a very quick and efficient approach to import text data from an
    Excel file. You can import data from an Excel file using the SAS Import Wizard
    in SAS Enterprise Guide without writing any SAS code.


    Data is often stored in XML files. XML stands for Extensible Markup Language.
    XML files are typically composed of tags and values. XML file can either have
    a simple or complex structure, which mainly depends on how the tag hierarchies
    are defined. For example, a sample XML file, SAS_Books_Sample.xml, contains information
    about some of the SAS Press books. (See Display 3.23.) You can see information
    specific to each book enclosed in relevant tags. Tag book id appears as the parent
    tag under which all other tags (author, title, publisher and price) are formatted
    in the same level. This is a classic example of a very simple XML file structure
    that many websites typically follow.


