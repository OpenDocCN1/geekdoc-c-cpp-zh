  md: '# Overview of Text Analytics


    Text analytics helps analysts extract meanings, patterns, and structure hidden
    in unstructured textual data. The information age has led to the development of
    a wide variety of tools and infrastructure to capture and store massive amounts
    of textual data. In a 2009 report, the International Data Corporation (IDC) estimated
    that approximately 80% percent of the data in an organization is text based. It
    is not practical for any individual (or group of individuals) to process huge
    textual data and extract meanings, sentiments, or patterns out of the data. A
    paper written by Hans Peter Luh, “The Automatic Creation of Literature Abstracts,”
    is perhaps one of the earliest research projects conducted on text analytics wrote
    about applying methods to automatically generate an abstract for a document. In
    a traditional sense, the term “text mining” is used for automated machine learning
    and statistical methods that encompass a bag-of-words approach. This approach
    is typically used to examine content collections versus assessing individual documents.
    Over time, the term “text analytics” has evolved to encompass a loosely integrated
    framework by borrowing techniques from data mining, machine learning, natural
    language processing (NLP), information retrieval (IR), and knowledge management.


    Text analytics applications are popular in the business environment. These applications
    produce some of the most innovative and deeply insightful results. Text analytics
    is being implemented in many industries. There are new types of applications every
    day. In recent years, text analytics has been heavily used for discovering trends


    in textual data. Using social media data, text analytics has been used for crime
    prevention and fraud detection. Hospitals are using text analytics to improve
    patient outcomes and provide better care. Scientists in the pharmaceutical industry
    are it to mine biomedical literature to discover new drugs.


    Text analytics incorporates tools and techniques that are used to derive insights
    from unstructured data. These techniques can be broadly classified as the following:


    +   * information retrieval

    * exploratory analysis

    * concept extraction

    * summarization

    * categorization

    * sentiment analysis

    * content management'
  merge: -1
  pgno: 21
- img_proc: true
  md: '• ontology management


    In these techniques, exploratory analysis, summarization, and categorization are
    in the domain of text mining. exploratory analysis includes techniques such as
    topic extraction, cluster analysis, etc. The term “text analytics” is somewhat
    synonymous with “text mining” (or “text data mining”). Text mining can be conceptualized
    as a subset of text analytics that is focused on applying data mining techniques
    in the domain of textual information using NLP and machine learning. Text mining
    considers only syntax (the study of structural relationships between words). It
    does not deal with phonetics, pragmatics, and discourse.


    Sentiment analysis can be treated as classification analysis. Therefore, it is
    considered predictive text mining. At a high level, the application areas of techniques
    divide the text analytics market into two areas: search and descriptive and predictive
    analytics. (See Display 1.1.) Search includes numerous information retrieval techniques,
    whereas descriptive and predictive analytics include text mining and sentiment
    analysis.


    # Display 1.1: High-Level Classification of Text Analytics Market and Corresponding
    SAS Tools


    | Text Analytics | |

    |---|---|

    | Search (Information Organization and Access) | Descriptive and Predictive Analysis
    (Discovering Trends, Patterns, and Modeling) |

    | Information Retrieval | Content Categorization | Ontology Management | Text
    Mining | Sentiment Analysis |

    | ↓ | ↓ | ↓ | ↓ | ↓ |

    | SAS Text Analytics Suite | |

    | SAS Crawler, SAS Search and Indexing | SAS Enterprise Content Categorization
    | SAS Ontology Management | SAS Text Miner | SAS Sentiment Analysis Studio |

    | Chapter 2 | Chapter 7 | Not covered in this book | Chapters 3, 4, 5, and 6 |
    Chapter 8 |


    SAS has multiple tools to address a variety of text analytics techniques for a
    range of business applications. Display 1.1 shows the SAS tools that address different
    areas of text analytics. In a typical situation, you might need to use more than
    one tool for solving a text analytics problem. However, there is some'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'overlap in the underlying features that some of these tools have to offer.
    Display 1.2 provides an integrated view of SAS Analytics tools. It shows, at a
    high level, how they are organized in terms of functionality and scope. SAS Crawler
    can extract content from the web, file systems, or feeds, and then send it as
    input to SAS Text Miner, SAS Sentiment Analysis Studio, and SAS Content Categorization.
    These tools are capable of sending content to the indexing server where information
    is indexed. The query server enables you to search queries and retrieve relevant
    information from the indexed content.


    SAS Text Miner, SAS Sentiment Analysis Studio, and SAS Content Categorization
    form the core of the SAS Analytics tools arsenal for analyzing text data. NLP
    features such as tokenization, parts-of-speech recognition, stemming, noun group
    detection, and entity extraction are common among these tools. However, each of
    these tools has unique capabilities that differentiate them individually from
    the others. In the following section, the functionality and usefulness of these
    tools are explained in detail.


    # Display 1.2: SAS Analytics Tools: An Integrated Overview


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_23_0.png)


    The following paragraphs briefly describe each tool from the SAS Analytics suite
    as presented in Display 1.2:


    +   * **SAS Crawler, SAS Search and Indexing** – Useful for extracting textual
    content from the web or from documents stored locally in an organized way. For
    example, you can download news articles from websites and use SAS'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Text Miner to conduct an exploratory analysis, such as extracting key topics
    or themes from the news articles. You can build indexes and submit queries on
    indexed documents through a dedicated query interface.


    +   SAS Ontology Management – Useful for integrating existing document repositories
    and identifying relationships between them. This tool can help subject matter
    experts in a knowledge domain create ontologies and establish hierarchical relationships
    of semantic terms to enhance the process of search and retrieval on the document
    repositories.


    Note: SAS Ontology Management is not discussed in this book because we primarily
    focus on areas where the majority of current business applications are relevant
    for textual data.


    +   SAS Ontology Categorization – Useful for classifying a document collection
    into a structured hierarchy of categories and subcategories called taxonomy. In
    addition to categorizing documents, it can be used to extract facts from them.
    For example, news articles can be classified into a predefined set of categories
    such as politics, sports, business, financial, etc. Factual information such as
    events, names of people, dates, monetary values, etc., can be easily retrieved
    using this tool.


    +   SAS Text Miner – Useful for extracting the underlying key topics or themes
    in textual documents. This tool offers the capability to group similar documents—called
    clusters—based on terms and their frequency of occurrence in the corpus of documents
    and within each document. It provides a feature called “concept linking” to explore
    the relationships between terms and their strength of association.


    For example, textual transcripts from a customer center call can be fed into this
    tool to automatically cluster the transcripts. Each cluster has a higher likelihood
    of having similar problems reported by customers. The specifies of the problems
    can be understood by reviewing the descriptive terms explaining each of the clusters.
    A pictorial representation of these problems and the associated terms, events,
    or people can be viewed through concept linking, which shows strongly an event
    can be related to a problem.


    SAS Text Miner enables the user to define custom topics or themes. Documents can
    be scored based on the presence of the custom topics. In the presence of a target
    variable, supervised classification or prediction models can be built using SAS
    Text Miner. The predictions of a prediction model with numerical inputs can be
    improved using topics, clusters, or those that can be extracted from textual comments
    using SAS Text Miner.


    +   SAS Sentiment Analysis – Useful for identifying the sentiment toward an entity
    or the overall sentiment toward the entire document. An entity can be anything,
    such as a product, an attribute of a product, brand,'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'person, group, or even an organization. The sentiment evaluated is classified
    as positive or negative or neutral or unclassified. If there are no terms associated
    with an entity or the entire document that reflect the sentiment, it is tagged
    "unclassified."

    Sentiment analysis is generally applied to a class of textual information such
    as customers’ reviews on products, brands, organizations, etc., or to responses
    to public events such as presidential elections.

    This type of information is largely available on social media sites such as Facebook,
    Twitter, YouTube, etc.'
  merge: -1
