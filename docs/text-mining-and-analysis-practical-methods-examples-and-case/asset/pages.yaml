  md: 'SAS Content Categorization helps automatically categorize multilingual content
    available in huge volumes that is acquired or generated or exists in It has the
    capability to parse, analyze, and extract content such entities, facts, and events
    in a classification hierarchy. Document classification can be achieved using either
    SAS Content Categorization or SAS Text Miner. However, there are some fundamental
    differences between these two tools. The text extraction feature in SAS Text Miner
    completely relies on the quantification of terms (frequency of occurrences) and
    the derived weights of the terms for each document using advanced statistical
    methods such as SVD.


    On the other hand, SAS Content Categorization is broadly based on statistical
    and rule-based models. The statistical categorizer works similar to the text topic
    feature in SAS Text Miner. The statistical categorizer is used as a first step
    to the classification methodology, it is called a black box model. In rule-based
    models, you can choose to use linguistic rules by listing the commonly occurring
    terms most their importance. Boolean rule-based models use Boolean operators such
    as AND, OR, NOT, etc., to specify the conditions with which terms should occur
    within documents. This tool has additional custom-built operators to assess positional
    characteristics such as the distance between the two terms is within a distance
    of n terms, whether specific terms are found in a given sequence, etc. There is
    no limit on how complex these rules can be (for example, you can use nested Boolean
    rules).'
