  md: '# # Case Study 6 Opinion Mining of Professional Drivers’ Feedback


    Mantosh Sarkar

    Goutam Chakraborty


    # Introduction


    +   - Data

    - Analysis Using SAS® Text Miner

    - Analysis Using the Text Rule-builder Node


    # Summary'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Introduction


    The widespread adoption of mobile applications has tremendously expanded the scope
    of obtaining timely customer feedback. While many companies collect feedback from
    their customers via mobile apps, they often restrict their analysis to numeric
    data and ignore analyzing textual data because of perceived difficulties associated
    with analyzing text data. In this case study, you will analyze customer feedback
    by professional drivers sent via mobile devices. Currently, the company manually
    classify these textual feedbacks into positive and negative groups. Here, you
    will learn how to use SAS Text Miner to automatically generate and summarize topics
    from positive and negative feedbacks, as well as classify them into positive and
    negative groups. In addition, we also help you learn how to build rules in SAS
    Sentiment Analysis Studio to predict customer’s sentiment automatically, so that
    experts’ time can be used for more strategic purposes.


    # Data


    A leading & energy company with hundreds of truck stops located in most of the
    U.S. has kindly agreed to provide the data for this case study anonymously. It
    offers fuel, fast food, and convenience store services to its customers. In addition,
    it offers amenities such as food from natural restaurant chains as well as trucking
    supplies, showers, and RV dump stations. The data used in this case study is feedback
    obtained via a mobile phone app that is used by professional drivers to locate
    a store, find nearby fuel stations, and check loyalty reward reward balances.
    This feedback is free-form text comments from professional truck drivers talk
    about various topics related to their experience at the store, questions on required
    services, etc. Currently, company experts classify driver’s feedback into positive
    and negative by reading and analyzing it.


    For reasons of anonymity, the name of the company is masked in the text comments.
    After data cleaning and validation, 2,335 text comments were used for this case
    study. We decided to keep the data and analysis separate for positive and negative
    comments. You will start with SAS Text Miner to extract insights from topics the
    professional drivers are talking in their feedback.


    # Analysis Using SAS® Text Miner


    The data sets used for this analysis are:


