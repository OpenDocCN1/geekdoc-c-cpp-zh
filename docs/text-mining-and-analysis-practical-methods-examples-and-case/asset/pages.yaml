    # Entities


    Entity detection is one of the main features offered in SAS Text Miner. An entity
    is a piece of useful information contained in the textual data that is usually
    different from the general text. SAS Text Miner can identify various types of
    entities that are prebuilt into the software. Factual information such as a street
    or postal address, name of a person, phone number, name of an organization, e-mail
    address, name of a city, etc., are examples of some of the many standard entities
    that SAS Text Miner is capable of detecting automatically. If SAS Text Miner detects
    an entity that has one or more words, then each one of the words is analyzed by
    the software to find entities. The entity extraction'
