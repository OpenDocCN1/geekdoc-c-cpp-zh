  md: '# Rule-Based Categorizer


    A rule-based categorizer enables you to write your own rules for each category
    or subcategory in the taxonomy. Unlike the statistical categorizer, you can control
    the rules for each category individually independent of other categories. In fact,
    you can start writing rules for category without the need for training documents.
    However, you need to have sample documents for each category in the taxonomy for
    testing the rule-based categorizer. As shown in Display 7.5, there are fundamentally
    two types of rule-based methods, linguistic and Boolean.


    # Linguistic


    In the linguistic approach, use terms (word or phrases) that might uniquely represent
    a category in the taxonomy. In a simple linguistic method, a document is assigned
    to a category when a certain percentage of the rules is found in the document.
    For example, consider the category Inventions in Display 7.10, which contains
    20 linguistic rules. If you set 40% as the matching criteria percentage, then
    a document is assigned to this category only when at least eight of the rules
    are found. This threshold percentage for linguistic rules is called the Match
    Ratio, and can be set for each category individually in the Data tab (s shown
    in Display 7.11). By default, the match ratio for any category is 10%. A higher
    percentage might make the rules very rigid in assigning a document to a category.
    A lower percentage indicates that the rules are too liberal, which can cause a
    document to be assigned to more than one category. It is important to find an
    optimal value through testing.


    # Display 7.11: Setting for Match Ratio on the Data Tab of a Category


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_216_0.png)'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Rule terms can be modified using qualifiers. A qualifier is a special function
    that, when syntactically applied to a linguistic rule, performs a specific function
    (most of which is related to natural language processing). For example, a linguistic
    rule named “position”, when suffixed with a qualifier @V and changed to position@V,
    expands the term “position” to include all of its verb forms in the category rules.
    Thus, the following terms are included as part of the rules automatically generated
    during the execution of the classification algorithm:


    +   position

    positioned

    positioning

    positions


    In a weighted linguistic approach, rules are assigned different weights. A document
    is assigned to a particular category if the algebraic sum of the term exceeds
    a threshold value set for that category. You must follow a specific syntax to
    write these rules, and these rules cannot be mixed with either Boolean or simple
    linguistic rules within a category. The first line in this type of category should
    begin with two underscores and the keyword “THRESHOLD,” followed by a comma and
    a threshold value.


    _THRESHOLD,value


    Also, each of the following lines should have a linguistic rule and a weight separated
    by a comma without any spaces. For example, linguistic rules in the subcategory
    Football are assigned different weights. (See Display 7.12).


    # Display 7.12: Example of Weighted Linguistic Rules for a Category


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_217_0.png)


