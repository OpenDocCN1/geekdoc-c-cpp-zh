    To understand the results of the Topic Node, you need to understand the difference
    between term topic weight and document topic weight.


    **Term topic weight:** Each term is assigned a weight corresponding to each topic.
    If there are 25 topics extracted, there will be 25 term topic weights calculated
    for a single term. Because each topic is an SVD dimension, the term topic weights
    for a term are nothing but the coordinates of the SVD space. In Table 6.1, the
    coordinates 0.0876 and -0.105 corresponding to the term “love” are the term topic
    weights corresponding to the two SVD dimensions.


    **Document topic weight:** Similarly, every document in the collection is assigned
    a weight corresponding to each topic. If there are 25 topics extracted, there
    will be 25 document topic weights calculated for a single document. The document
    topic weight of a document towards a topic is the normalized sum of tf-idf weightings
    for each term in the document multiplied by their topic weights.


    Term topic and document topic weights are used to calculate cutoff scores for
    each multi-term topic.


    +   *Term cutoff:** This is the threshold score that determines whether a term
    belongs to a topic. This is equal to the mean + 1 standard deviation of term topic
    weights for that topic. Any term with an absolute topic weight greater than this
    cutoff is assigned to this topic.


    +   *Document cutoff:** This is the threshold score that determines whether a'
  merge: -1
