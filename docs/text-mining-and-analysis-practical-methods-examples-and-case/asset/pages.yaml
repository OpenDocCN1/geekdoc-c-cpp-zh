- img_proc: true
  md: '# Introduction


    HP reports more than 2.5 billion customer transactions per year, and health insurer
    Humana’s provider call center handles more than 1 million calls per month. The
    sheer volume of data makes it cost-prohibitive to rely humans alone to analyze
    the information in the call center agents’ notes. Companies large and small are
    eager to find common customer issues early while keeping costs down. SAS® Text
    Analytics Text Miner and SAS® Content Categorization are invaluable tools for
    tackling such problems. SAS continually strives to provide easier and quicker
    access to analysis of unstructured data, addressing both the volume and the variety
    of big data problems. Last year, SAS® Text Miner debuted the Text Rule Builder
    in support of active learning. This year, SAS is introducing these powerful features
    in a Unified Text Analytics Interface (UTAI), which is aimed at the business analyst
    who wants to understand unstructured data in a more automated and meaningful way.


    The SAS® UTAI combines the sophisticated term-clustering statistical methods of
    SAS® Text Miner with the rule-based natural language processing techniques of
    SAS® Content Categorization. Although those solutions are usually used by experts,
    the new web application provides a single, convenient interface that enables both
    business analysts and experts to interactively discover topics and build categorization
    models so that they can better respond to the problem of automatically detecting
    consumer issues in a timely and efficient manner.


    This case study uses a call center scenario for a fictitious online company to
    guide you through the process of topic discovery, rule generation, model refinement,
    and deployment. This example also shows how to use Boolean rules to tune the model
    and how to use the DS2 procedure to deploy this model. The case study also demonstrates
    how to view the results of the analysis in SAS® Visual Analytics.


    You can easily apply the process outlined in this case study to similar issues
    in other industries where data includes unstructured text that contains valuable
    information. Patient electronic records, physician notes, police records, and
    insurance claims are just a few examples in which valuable information is available
    only in unstructured text.


    # Data Description


    The scenario in this case study analyzes about 15,000 free-form responses from
    the call center of an online printing company. The goal is to find customers’
    most common complaints about the company’s products. This information enables
    you to classify future calls more accurately so that a call center agent can better
    resolve a customer issue on the first try. If the data is'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'originally stored in a directory on the file system, the UTA application automatically
    converts the files to text and loads them into a SAS data set library. The document
    conversion feature supports several common document formats: HTML, PDF, and Microsoft
    Office formats.


    # Step-by-step Software Instruction with Settings/Properties


    The UAI provides a convenient wizard that enables you to quickly set up a project
    to explore unstructured data.


    +   1. To create a new project, click the “New Project” icon to start the New
    Project wizard. In the wizard (shown in Display 1), type a name for your project
    in the Name field.

    2. To choose the data that you want to explore, select the document type from
    the Document Source list, where you can browse for files or select a SAS data
    set from a library. If you select a data set, you can focus on a particular column
    by selecting the Column list. Display 1 shows that this scenario focuses on the
    ''oe_comment'' column in the OPERPORTING set in the TM library. The system is
    automatically preconfigured with smart defaults for processing natural language
    in your text. An algorithm randomly splits the specified data into a training
    set and a testing set for this model-building exercise.


