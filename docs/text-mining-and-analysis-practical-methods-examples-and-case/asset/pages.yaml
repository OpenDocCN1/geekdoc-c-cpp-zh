    # Differences between Text Clustering and Content Categorization


    In Chapter 6, we discussed how text in SAS Text Miner helps in grouping documents
    of similar content. Although content categorization (or document classification)
    has a similar purpose (i.e., to organize documents of closely related content),
    it is not the same as text clustering. Let’s review the key distinguishing characteristics
    between the text clustering feature in SAS Text Miner and the content categorization
    methods in SAS Content Categorization Studio. The differences should help you
    understand which feature works best for organizing documents at your organization.


    # Table 7.2: Differences between Features in SAS Text Miner and SAS Content Categorization
    Studio


    | Text Clustering (SAS Text Miner) | Content Categorization (SAS Content Categorization
    Studio) |

    | --- | --- |

    | • Unsupervised learning. | • Statistical categorizer — Supervised learning,
    requires corpora of documents to train. |

    | • Categories not predefined. | • Rule-based categorizer — Unsupervised learning,
    requires users to write rules and test model. |

    | • Completely based on statistical techniques. | • Categories should be predefined.

    • Statistical categorizer based on statistical techniques.

    | • Uses latent semantic analysis and singular decomposition for dimension reduction.
    | • Rule-based categorizer based on natural language processing and advanced linguistic
    techniques.

    • Statistical categorizer — Uses complex statistical and algebraic methods. |

    | • Cannot disambiguate between words with distinct meanings. | • Rule-based categorizer
    — Not applicable. |

    | Example: In the sentence, "Mr. White found guilty in the trial," White refers
    to the name of a person. In the sentence, "He came to the office dressed in white,"
    white refers to a color. Both are nouns, but they represent different entities
    | Natural language processing methods provide the ability to build rules to disambiguate
    based on context. Example: For the same example, you can write a Boolean rule
    to check whether a certain topic suggesting any color (such as red, blue, black,
