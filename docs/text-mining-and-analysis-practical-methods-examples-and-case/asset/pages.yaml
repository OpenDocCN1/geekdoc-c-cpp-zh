    # ### Statistical Categorizer


    A statistical categorizer helps users automatically build a model for categorization
    without having to write any rules. It requires a set of pre-identified rules for
    each category in the taxonomy to train the model. When training the model for
    a particular category, documents from all categories are considered for analysis.
    A statistical categorizer tries to find uniquely identifiable terms that describe
    a category while making sure they do not match any other categories. As a result,
    any changes made to the training documents in any category impact the rules for
    other categories also. In this case, you need to rebuild the model. Once the model
    is trained, you can test it on other document to verify its accuracy. The underlying
    rules of a statistical categorizer cannot be viewed. This is why it is also called
    a black box model. The statistical categorizer performs well when the number of
    categories is limited and the categories are significantly different from each
    other with regard to their content. For example, if the categories are sports,
    media, events, and entertainment, the statistical categorizer might not be efficient
    in categorizing documents precisely. The biggest advantage of a statistical model
    is that it is the easiest to develop, requiring just a set of well-collected training
    documents.'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'However, due to the difficulty of matching concepts on the basis of a statistical
    measure, it is difficult to achieve a high level of accuracy, which is a major
    drawback for the statistical categorizer.


    Here is a brief demonstration on how to build a statistical categorizer-based
    model. For the statistical categorizer, you need a training set of documents to
    build the model. For this purpose, we have extracted 466 SAS Global Forum paper
    abstracts in the past three years from different sections. Stats (Statistics and
    Data Analysis), DataMining (Data Mining and Predictive Modeling), Reports (Reporting
    and Information Visualization), BusInt (Business Intelligence), and SysArch (Systems
    Architecture) are the five categories representing the 466 paper abstracts. These
    abstracts are split into Test and Train groups. Each group folder contains subfolders
    representing the five section-based categories and respective paper abstracts
    in raw files. SAS Content Categorization Studio requires input text comments in
    .xml or .txt format. If you have your data as a SAS data set, you need to create
    a unique .xml or .txt file for each textual comment in your data set. Refer to
    the section “Appendix” in this chapter for SAS code that creates each observation
    in the SAS data set as a separate text file.


