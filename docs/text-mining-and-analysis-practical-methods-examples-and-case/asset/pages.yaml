  md: '# Rule-Based Models in SAS Sentiment Analysis Studio


    The default settings for the rule-based model (displayed at the start of the project)
    are shown in Display 8.10. Although some of the options are similar to the options
    in statistical models (such as tokenizers and tagger), there are some new options
    as well. Some of the new options are needed because of the additional complexity
    in developing rule-based models that explicitly work on linguistic features in
    the documents compared to statistical models that are built using numerical data
    only. The advantage of the rule-based model over the statistical model is its
    ability to determine sentiment at a more granular level such as product features
    or attributes.


    # Display 8.10: Rule-Based Model Settings


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_263_0.png)


    To develop a good rule-based model, analysts must have some domain expertise and
    be willing to write, test, and modify different types of rules such as CLASSIFIER,
    CONCEPT, C_CONCEPT, CONCEPT_RULE, PREDICATE_RULE, and REGEX. Each of the different
    rule types enables user capabilities such as the following:


    +   * Match specific words or strings.

    * Match any word using _w and _cap markers.

    * Reference patterns of speech.

    * Reference defined entities with _def marker.

    * Use Boolean operators such as AND or SENT.

    * Use regular expressions to match patterns of characters and digits.


    All of these rule types are compatible with the definitions used in SAS Content'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'Categorization Studio. The SAS Sentiment Analysis Studio: User’s Guide provides
    detailed instructions and examples of each type of Rule. A brief description of
    the rule types and their typical use is given below.


    # CLASSIFIER Rule


    This rule consists of a word or string. When a match occurs with this, the entire
    string is highlighted in the input document. This rule is typically used in the
    definitions of tonal keywords to locate the terms that express sentiment.


    # CONCEPT Rule


    This rule specifies matched and highlighted terms the same way as the CLASSIFI
    rule. Add the _def marker to locate referenced concepts in an input document.
    Also, specify part-of-speech tags and the _cap and _w markers to locate types
    of terms.


    # C_CONCEPT Rule


    This rule is similar to a CONCEPT rule, but it is used to specify a coreference.
    Use a C_CONCEPT rule to locate matches within a specified context.


    # CONCEPT_RULE Rule


    Like the C_CONCEPT rule, the _c marker is required for a CONCEPT_RULE. However,
    a CONCEPT_RULE also requires Boolean operators. Use the _def marker and other
    markers to specify the matches that are returned by this rule.


    # PREDICATE_RULE Rule


    This rule is the most complex and exact of the rule types. You can specify arguments
    that return highlighted matches in a tested document. These matches include all
    of the strings from the first and last located arguments.


    # REGEX Rule


    Use this type of rule to locate information that follows a preset pattern such
    as price, percent, and various word spellings. Do not specify any of the Boolean
    operators or markers with this rule.


    Here is a general approach that is recommended for developing these rules. First,
    review a sample of documents to understand how products and features are mentioned
    and to identify how sentiments are expressed at the product or feature level in
    the documents. Use knowledge gained from this task to identify product features
    and tonal keywords that are basic building blocks for rule-based models. Build
    a statistical model (starting with the default options), and use that model as
    a starting point for identifying keywords in your documents and'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'for importing keyword-based classifier-type rules from the statistical model.
    Use your judgment and domain expertise to write different types of rules and,
    more importantly, to refine and refine those rules. You can use SAS Miner for
    the preliminary analysis of the textual corpus to identify themes and topics as
    explained in the next section. Case 3 demonstrates the advantage of performing
    text mining analysis as a precursor to sentiment analysis. Display 8.11 shows
    the SAS Sentiment Analysis Studio interface with tonal keywords depicting different
    types of rules and weights, intermediate entities, and products features for one
    of the case studies in this book. The weights reflect the relative degree of sentiment
    expressed. In this example, the word exceptional has a higher weight for positive
    sentiment than the word favorite.


    # Display 8.11: Rule-Based Model Interface


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_265_0.png)


    To a large extent, these weights need to be decided subject by the analyst, and
    then modified based on the results of rule evaluation and testing. The imported
    rules from the statistical model are best treated as a starting point only. To
    start modifying the weights, analysts need some idea about the degree of sentiment
    in words such as “outstanding” versus “good.” If “outstanding” is believed to
    be more positive than “good,” then higher weights are assigned to “outstanding”
    than “good.” Native English speakers might have some idea about the degree of
    sentiment in common English words, that knowledge is often inadequate for assigning
    relative weights to all the keywords in the documents. Often, analysts need to
    turn to other resources where many English words have been categorized by their
    valence and tagged properly. (For a comprehensive list of free resources for research
    purposes, see http://www.wjh.harvard.edu/~inquirer/homecat.htm, http://mpqa.cs.bitt.edu/,
    and http://sentiwordnet.cnr./)


    Once the rule-based model is developed and validated, it can be used to test new
    documents the same way as the statistical model. Test results can be'
