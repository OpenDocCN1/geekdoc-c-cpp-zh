- img_proc: true
  md: '# Summary


    Investigations and audits are typically accompanied by large volumes of text from
    multiple sources, and as the investigator, you face time-sensitive deadlines and
    an overwhelming amount of information. Perhaps one of the most time-consuming
    tasks is finding relevant information when you need it. SAS® Text Analytics uses
    natural language processing and pattern matching to facilitate timely fact extraction
    and data organization, giving you a holistic view of the information pertaining
    to your case.


    SAS empowers intelligent search and advanced text analytics, supporting key functions
    as such:


    +   * Multisource information retrieval and integration.

    * Advanced natural language processing to parse information.

    * Term stemming and misspelling identification.

    * Content categorization based on statistical and linguistic rules.

    * Fact and entity extraction based on part-of-speech tagging and pattern recognition.

    * Document filtering.


    What does this give you? Powerful tools that aid in the organization, exploration,
    and root-cause analysis of time-sensitive case evidence. This case study focuses
    on findings from analysis and information extraction of the Enron archive. Playing
    the role of investigator, the goal is to extract key evidence of the Enron Corporation''s
    suspicious practices. The Enron email archive contains more than 500,000 emails
    from 159 personal email accounts. The task of reading all these emails is unimaginable
    and impractical, not to mention how difficult it would be to identify patterns
    among key email accounts. SAS Text Analytics uses both statistical and linguistic
    technology to parse, explore and categorize the email collection.


    By using Enron emails as a test case, we have identified identified opportunities
    for investigators who need to understand large volumes of data as integrated evidence
    for their cases. Digging through large volumes of information is now an advantage
    for investigators because they are able to use SAS® Text Analytics to understand
    and categorize these documents.'
  merge: -1
  pgno: 400
