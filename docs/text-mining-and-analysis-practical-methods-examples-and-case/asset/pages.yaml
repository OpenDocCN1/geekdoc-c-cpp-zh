    Filtering Documents


    # Interactive Filter Viewer


    The interactive filter viewer is a handy feature of the Text Filter node to refine
    the results from parsing and filtering. You have seen the utility of this tool
    in Chapter 4for creating custom synonym list using the parsed terms. You have
    studied various strategies during text parsing to filter irrelevant terms to lessen
    the number of terms used in post-parsing text mining tasks. By applying all of
    these techniques, you can encounter useless terms being retained and important
    terms being dropped in the list of filtered terms. Using the interactive filter'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'viewer, you can browse through all of the parsed terms and manually modify
    the list by dropping or keeping terms. This is the most-time-consuming step in
    the text mining process flow. The results of the text mining analysis are very
    sensitive to the terms that are included in the analysis. Hence, it is essential
    to invest time and effort in refining the list of selected terms manually by using
    the interactive filter viewer.


