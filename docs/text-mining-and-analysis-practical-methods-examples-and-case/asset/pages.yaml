    # Text Topic Node


    The Text Topic node in SAS Text Miner discovers topics from text. Fundamentally,
    the node analyzes document contents and summarizes the collection by identifying
    topics. The Text Cluster node generates clusters where each document can belong
    to only one cluster. In a text topic analysis, each document can belong to many
    topics. The Text Topic node enables an analyst to create topics of interest using
    groups of terms identified in text parsing. The node can be configured to identify
    single-term topics or multi-term topics in the data. Topic extraction is a computer-intensive
    task because the node uses rotated SVD in the background to capture information
    from a sparse term-by-term matrix. We have discussed in detail the mechanics of
