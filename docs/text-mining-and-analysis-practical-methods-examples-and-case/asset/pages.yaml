  md: '# Ontology Management


    Ontology is a study about how entities can be grouped and related within a hierarchy.
    Entities can be subdivided based on distinctive and commonly occurring features.
    SAS Ontology Management enables you to create relationships between pre-existing
    taxonomies built for various silos departments. The subject matter knowledge about
    the purpose and meaning can be used to create rules for building information search
    and retrieval systems. By identifying relationships in an evolutionary method
    and making the related content available, queries return relevant, comprehensive,
    and accurate answers. SAS Ontology Management offers the ability to build semantic
    repositories and manage company-wide thesauri and vocabularies to build relationships
    between them.


    To explain its application, consider the simple use case of an online media house
    named ABC. (The name was changed to maintain anonymity.) ABC collects a lot of
    topics over a period of time. It stores each of these topics, along with metadata
    (properties), including links to images and textual descriptions. SAS Ontology
    Management helps ABC store relationships between the related topics. ABC regularly
    queries its ontology to generate a web page for each topic, showing the description,
    images, related topics, and other metadata that it might have to show. (See Display
    1.6.) ABC uploads the information from SAS Ontology Management to SAS Content
    Categorization, and then tags news articles with topics that appear in the articles
    using that it''s created. All tagged articles are included in a list on the topic
    pages.


    Display 1.6: Example Application of SAS Ontology Management from an Online Media
    Website'
