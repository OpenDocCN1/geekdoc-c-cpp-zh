  md: '# Singular Value Decomposition and Latent Semantic Indexing


    For most document collections, the term-by-document matrix is often very large
    and very sparse. This makes it difficult to use this matrix directly in clustering
    or in any other algorithms. What''s needed is a way to reduce the dimensionality
    of the data, retain most of the meaningful information. Addressing this curse
    of dimensionality is an age-old problem in statistics and data mining. Plenty
    of techniques have been developed to handle this issue. Some of the most commonly
    used and well known of these approaches are principal component analysis (PCA),
    factor analysis (FA), partial least squares (PLS), and latent semantic indexing
    (LSI). PCA, FA, and PLS are available as nodes in SAS Enterprise Miner. In Sas
    Miner, a form of LSI is used.


    LSI (sometimes referred to as latent semantic analysis (LSA)) is a dimensionality
    reduction technique that typically operates on the term-by-document matrix (or
    weighted term-by-document matrix using weights discussed in Chapter 5). It uses
    a well-known mathematical matrix decomposition technique called singular value
    decomposition (SVD) to break down the original data into linearly independent
    components. These components are, in a sense, abstraction away the noisy correlations
    in the original data to sets of values that best approximate the underlying structure
    of the data. The majority of the components usually have small values and can
    be ignored, which results in dimensionality reduction. Therefore, the LSI approach
    is very similar to factor analysis. Just as factor analysis is used to extract
    underlying dimensions multidimensional constructs via surveys, so LSI applied
    to extract underlying dimensions from large text corpora. Essentially, LSI combines
    surface information (the pattern of occurrences of words across the corpora) into
    a deeper abstraction (the latent semantic dimensions) that captures the mutual
    implications of words and documents. Thus, LSI provides dimensions with semantic
    meaning so that features in the same dimension are often typically related. This
    is why LSI is very attractive for analyzing text.


    # Mathematics of SVD


    Cluster algorithms rely on SVD to transform the original weighted term-by-document
    matrix into a dense, reduced, dimensional representation. Mathematically, a full
    SVD does the following. Consider that A (mxn) is the term-by-document matrix with
    m>n (more terms than documents) and where the entries in the matrix are real numbers
    (such as presence or absence of a term, entropy weight, etc.). SVD computes matrices
    U, S and V so that the original matrix can be re-created using the formula A =
    USVT. In this formula, the following is true:'
  merge: -1
  pgno: 180
- img_proc: true
  md: '+   • U is the matrix of orthogonal eigenvectors of the square symmetric matrix
    AA''.


    +   • S is the diagonal matrix of the square roots of eigenvalues of the square
    symmetric matrix AA''.


    +   • V is the matrix of orthogonal eigenvectors of the square symmetric matrix
    A''A''.


    The mathematical proof of the formula is available in any matrix algebra book.


