- img_proc: true
  md: 'Simple Search: In this format, you can specify the terms in a search query.
    They are used to look up the index of documents and to return results in which
    they occur. Operators such as a plus (+) sign and minus (-) sign can be used to
    either include or exclude a word or phrase in the search query. For example, a
    query like +sas -analytics performs a search on the index to return documents
    containing the term ‘sas’ but not when the term ‘analytics’ appears in the document.


    Advanced Search: You can use the fields and search terms together in the query
    expression. It enables you to use Boolean, positional, and counting operators
    in combination with the search words or phrases. This method improves the quality
    of search by narrowing down to return the most relevant results. In this case,
    only fields marked with a functionality of Search when building the index can
    be used. For example, a query like (AND, _body:“SAS”, _title:“analytics”) searches
    for the term ‘SAS’ in the body and ‘analytics’ in the title of the document. ‘AND’
    is a Boolean operator whereas body and title are the markers for body and title
    fields of the document, respectively.


    # Query Statistics Server


    This component can be used to analyze the patterns of user queries sent to the
    query server. The query statistics server helps you monitor the topmost submitted
    user queries by frequency. It also monitors matches which have been found in the
    indexed document repository. It lets you monitor monthly, daily, and hourly query
    rates.


    # SAS Markup Matcher


    SAS Markup Matcher is a component provided within the SAS Information Retrieval
    Studio framework to help you create custom templates for accessing and extracting
    specific portions of an XML or HTML document. SAS Markup Match enables you to
    specify rules so that whenever an XML or HTML file is sent to it, it can create
    a new document and add to that. Once you define a matcher, you can upload it to
    the SAS Markup Matcher Server and add it to the pipeline server as a processor.
    It applies the rules to incoming documents. The output document generated by the
    SAS Markuper can be either indexed or exported in XML or CSV file format. These
    output documents can be fed into other SAS applications as SAS Text Miner, SAS
    Content Categorization, and SAS Sentiment Analysis to conduct further analysis
    as required. It is important to remember that the fields are newly created by
    SAS Matchup Marker should be listed in the indexing server if you need to build
    indexes on these fields. In the later sections of this chapter, we will demonstrate
    a simple scenario explaining how to use SAS Markup Matcher. We'
