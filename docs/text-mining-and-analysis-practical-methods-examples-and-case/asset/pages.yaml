- img_proc: true
  md: '33. Highlight score and click on “Browse” as shown in Display C9.19.


    # Display C9.19 List of exported data sets from score node


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_430_0.png)


    You will find the documents in the score data set scored as positive, negative,
    or neutral in the Into: Rating column. This way the model can be used to identify
    the sentiment in any data set using key rules extracted from training data set.


    In the presence of a target variable, another approach to build a predictive model
    with textual data is by using the text topic/cluster node along with any typical
    modeling technique. Text topics from a topic node or SVDs from text cluster node
    can be used as inputs to a decision tree or neural network or any modeling node.
    However, a text rule builder provides an added advantage of having an active-learning
    facility and generates Boolean rules that can be used as starting points for content
    categorization. In this data set, text rule builder actually outperforms basic
    models built using the text cluster and text topic node as shown next.


    34. Attach the following nodes: Text Cluster, Text Topic (from Text Mining Tab),
    Metadata (from Utility Tab), Decision Tree, Regression, Decision Tree, and Neural
    Network (from Model Tab) as shown below to the Text Filter node (see Display C9.20).


    # Display C9.20 Text processing flow diagram


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_430_1.png)'
