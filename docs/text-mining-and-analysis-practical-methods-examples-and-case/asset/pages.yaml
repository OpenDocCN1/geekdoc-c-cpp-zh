    # Regular Expressions


    Regular expressions in LITI definitions are similar to those used in classifier
    concept definitions. The syntax slightly differs in a LITI definition with the
    keyword “REGEX:” prefixed for each regular expression written on every line. In
    LITI, regular expressions are used for pattern matching after the document is
    broken into individual tokens or terms. Hence, a pattern embedded within another
    term is not returned as a match in a LITI definition. In a classifier concept
    definition, regular expressions work in the document before terms are tokenized.
    Here, any embedded patterns are returned as a possible match.


    **Example:** REGEX: \d+lbs


    **Match Example:** I weigh 185lbs approximately.

    **Non-Match Example:** You should be 185lbsor


    In the case of a non-match, you can see that **185lbs** is embedded inside the
    token **185lbsbor**. This is a match if the classifier concept definition is used
    instead of a LITI definition.'
  merge: -1
