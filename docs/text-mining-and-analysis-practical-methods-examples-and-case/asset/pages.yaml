    ```


    In the full SVD method, there is no dimensionality reduction and, consequently,
    no loss of information. In practice, you typically use the first few of the eigenvalues
    (instead of all of the eigenvalues as in full SVD) so that the dimensionality
    is reduced. The eigenvalues are ordered from highest to lowest. These values can
    be plotted in a scree plot (against the eigenvalues) to identify an elbow in the
    plot for selecting a cutoff at the point where the eigenvalues fall dramatically.
    Of course, not using the entire set of eigenvalues means some loss of information.
    The idea is we are willing to trade some loss of information to get a more robust
    and simpler structure to represent the patterns in the data.


    So, in effect, the application of SVD to a term-by-document matrix matrix results
    in rearranging the original matrix so that the following is true:


    +   * The values in each column after SVD are a linear-weighted combination of
    the values in all columns of the original matrix.

    * Each column after SVD is uncorrelated with all other columns.

    * The first SVD dimension provides the best approximation of the original matrix
    that is possible with one dimension. The addition of the second SVD dimension
    provides the best possible representation in two dimensions, and so on.

    * The documents are represented in the SVD space by the column vector of the matrix
    V''.'
