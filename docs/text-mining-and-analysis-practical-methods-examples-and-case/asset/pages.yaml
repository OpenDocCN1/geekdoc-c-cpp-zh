    Istanbul or Malaysia or Utah |

    | MEASURE | Measurement or measurement expression | 100 miles or 25 sec |

    | ORGANIZATION | Name of a government or service agency | FBI – Bureau of Investigation
    or SEC – Securities and Exchange Commission |

