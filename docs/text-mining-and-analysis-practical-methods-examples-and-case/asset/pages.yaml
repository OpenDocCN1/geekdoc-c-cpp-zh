  md: '35. Make the following changes to the properties panel of each node (these
    changes are made based on trial-and-error with the data and using domain knowledge
    to get meaningful results).


    +   a. Text Cluster: Max SVD Dimensions 25, Number of Clusters 8


    +   b. Text Topic: Number of multi term topics 15


    +   36. Run the flow to the Text topic node.


    The Metadata node is useful in changing the roles of variables in the middle of
    a flow diagram. The Text Cluster and Text Topic nodes have created many different
    variables (such as cluster membership, topic flags etc.) that are now available
    as potential input variables in any predictive model.


    37. In the Metadata node make following changes (click on the ellipse button for
    variables under train) in the variable roles as shown in Display C92.21.


    # Display C9.21 Changing Variable Roles via Metadata Node


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_431_0.png)


    Essentially you have changed OVL_CMT to Rejected, TextCluster_cluster_to Input
    (from Segment) and all TextTopic_1 to TextTopic_15 to Input (from Segment).TextTopic_1
    through TextTopic_15 are binary variables with a default role of segment that
    needs to be changed to Input for use in the predictive models. The TextTopic_raw1
    to TextTopic_raw10 contains the actual weights to derive the binary variables
    with a default weight of Input. It is up to you'
