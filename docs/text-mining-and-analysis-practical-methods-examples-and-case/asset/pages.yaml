  md: '# Introduction


    Text Mining is mainly used for information retrieval and text categorization.
    With the growth of social media, the popularity of text mining as a technique
    to discover trends in topics has caught up tremendously. Given a set of documents
    with a time stamp, text mining can be used to identify different topics that exist
    in the text and how they change over time. In this case study we aim to demonstrate
    the application of text mining for understanding trends in conference proceedings.


    Many professional conferences or forums are held every year across the globe.
    The total number of papers presented each year at all the conferences is likely
    in the hundreds of thousands. While there are conferences which focus on only
    one specific field, there are many conferences which act as a platform for different
    fields. Unlike academic journals, which are heavily indexed and searchable, most
    conference papers are not indexed properly. In addition, there are many academic
    institutions that publish papers and many consulting firms that publish papers
    every year which are also not indexed. It may be possible to use a structured
    query to get a listing of papers published about a certain topic from indexed
    journals/conferences, it is virtually impossible to gain broad knowledge about
    the hundreds of topics that are presented or published during a time period and
    how such topics may have changed over time.


    # Data


    The data used in this case study are abstracts of all SAS conference papers published
    each year at SUGI/SAS Global Forum from 1976 to 2011. Initially, we considered
    three types of textual data for text mining,


    +   * Title of the paper

    * Abstract of the paper

    * Complete body of the paper


    The title of the paper may not be a good input because it is often restricted
    in length and not fully reflect the theme of the paper semantically. Considering
    the complete paper for analysis will likely add a lot of noise because a full
    paper can include tables, images, references, SAS programs, etc., which are problematic
    and may not add much value in text mining for topic extraction. We felt analyzing
    the abstract of a paper and does not contain extraneous items such as tables,
    images, etc. We are thankful to SAS for making available SUGI/Global Forum proceedings
    for all of the years the conference was held. We faced many'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'challenges starting from downloading papers in PDF format from the SAS website
    to preparing a final data set that contains only the abstract for each paper.
    We used the %TMFILTER macro for preparing SAS data sets from a repository of SAS
    papers in .pdf and .txt format. We had to make some strategic choices to prepare
    the data sets. For complete details refer to 2012 SAS Global forum paper ‘SAS
    Since 1976: An application of text mining to reveal trends’. In the paper, the
    authors created data sets, for each decade, with the number of observations (i.e.,
    paper abstracts) shown in Display C1.1.


    # Display C1.1 Number of paper abstracts in each decade


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_276_0.png)


    For this case study we went with the same four data sets with only one exception,
    the latest decade data set also includes papers from the 2012 SAS Global Forum
    conference.


    The four data sets used for this analysis are:


    +   * sas1976_1980

    * sas1981_1990

    * sas1991_2000

    * sas2000_2012


    The data sets are available in the folder Case Studies ► Case Study 1 provided
    with this book. See the website for this book.


    The following sections take you through the detailed, step-by-step text mining
    process from text parsing to cluster generation on each data set separately.


