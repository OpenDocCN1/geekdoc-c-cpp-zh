    # Concept


    A simple concept can be defined as a piece of information such as an entity (like
    name of a place, person, organization, location.). An example of a simple concept
    is a place like New York or an organization such as SAS Institute Inc. A relational
    concept can be two or more entities or terms in relation with each other. For
    example, CEO of SAS Dr. Jim Goodwin is a relational concept. One of the important
    features of SAS Content Categorization Studio is concept extraction. There are
    primarily two types of concept definitions that you can'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'create in SAS Content Categorization Studio.


    Classifier – A classifier concept is based on an independent word or string identified
    in the text. It can use regular expressions for pattern matching. Boolean rules
    can be written to perform concept extraction with disambiguation to distinguish
    between two contexts in which the same word is used. For example, Bing can be
    referred to as a search engine as well as a heap or pile in British dialect.


    Grammar – A grammar concept predominantly works based on the part-of-speech tags
    of the terms and special symbols to identify precise matches for patterns.'
  merge: -1
