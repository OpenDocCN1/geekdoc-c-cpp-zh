    In the second maintenance release for SAS 9.3, the AUTOMAP option became available
    with the XMLV2 LIBNAME engine. This feature enables you to create default XMLMap
    files in SAS without the need for XML Mapper. AUTOMAP= option accepts either REPLACE
    or REUSE as your value. If you REPLACE, an XMLMap file with the same name is overwritten
    with the new file if it exists in the same location. The REUSE value uses the
    XMLMap file with the same name if already exists, a new file is created. Using
    the sample file we used in the previous example SAS_Books_Sample.xml, you just
    need to run the following code to create the SAS data automatically using the
    XMLV2 LIBNAME engine and the AUTOMAP option. FILENAME create creates a temporary
    location for XMLMap file tempMap this example.


    # Program 3.2: SAS Code to Use XMLV2 LIBNAME Engine with the AUTOMAP Option


    ```

    libname out ''C:\test'';

    filename SASBooks ''C:\test\SAS_Books_Sample.xml'';

    filename tempMap temp;

    libname SASBooks xmlmv2 xmlfileref=out xmlmap=tempMap

    autmap=replace;

    data out.book; set SASBooks.book; run;

    ```


