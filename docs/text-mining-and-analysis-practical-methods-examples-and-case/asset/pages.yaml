    You can use PROC IMPORT to import data from an Excel file into a SAS data set.
    (See Program 3.1.) For this to work, you should have a license for SAS/ACCESS
    Interface to PC Files. This product enables SAS to treat an Excel spreadsheet
    as a database and a subset of its cells (also called a range) as a table. You
    can specifically point to and read a relevant worksheet in an Excel'
  merge: -1
