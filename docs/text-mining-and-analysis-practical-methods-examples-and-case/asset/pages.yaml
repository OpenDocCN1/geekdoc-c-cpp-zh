    to classify a document as positive or negative during the validation step. When
    SAS Sentiment Analysis Studio has a document, the text is assigned a probability
    score. The value of this score is between 0 and 1. Any document that has a probability
    score above the threshold is considered to be positive. A document that has a
    probability score falls below the score equal to the threshold is considered to
    be negative. The contextual extraction file enables users to use a noun-phrase
