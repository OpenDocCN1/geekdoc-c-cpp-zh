  md: '# Summary


    Rules identified from the Text Rule builder revealed valuable insights on reasons
    for positive and negative experiences with a hospital visit. These rules are easily
    interpretable and can serve as a starting point for a sophisticated sentiment
    analysis exercise. The Boolean rules can also be directly used with SAS Categorization
    Studio for further analysis. From the results it is very clear that the hospital
    needs to improve on rest room maintenance, rescheduling process, and waiting times.
    Most of the patients seemed to be satisfied with the care and consultation they
    received from the physician.


    Mistakes by experts in rating textual comments are expected (after all they are
    human!) and such mistakes may seriously impact model performance. In situations
    such as these the active-learning functionality in the rule-builder node can be
    used for improving model performance. In this case study, the text rule builder
    with active learning adjustments seems to outperform traditional data mining models
    (such as decision tree, regression, and neural network) built using output from
    text cluster and text topic nodes.'
