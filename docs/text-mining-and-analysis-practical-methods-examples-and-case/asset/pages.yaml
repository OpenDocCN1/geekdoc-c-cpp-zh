  md: '# Building Custom Entities Using SAS Contextual Extraction Studio


    One of the several important features that SAS Contextual Extraction Studio offers
    context-sensitive matching using complex advanced linguistic rules called LITI
    (or Language Interpretation/Text Interpretation). In this feature, concepts are
    matched with a specific context. For example, names of people are identified by
    SAS Text Miner automatically when the Find Entities property is set to Standard.
    However, suppose you are interested in only finding names of authors provided
    after the sub-header CONTACT INFORMATION in the text. (See Display 4.21.) In this
    case, SAS Text Miner is not able to exclusively exclude those names. You have
    to use SAS Contextual Extraction Studio and write a LITI rule to find matching
    entities with context.


    # Display 4.21: Partial Screen Capture of the Data Set Showing the Highlighted
    Content and Authors Names


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_147_0.png)


    In SAS Contextual Extraction Studio, define a classifier for the keywords CONTACT
    INFORMATION in the PREFIX concept as shown below. Also, define a AUTHOR concept
    using the concept in (C_CONCEPT) and use the PREFIX concept.


    Concept Name Entry

    CLASSIFIER: CONTACT INFORMATION

    AUTHOR

    C_CONCEPT: PREFIX_ c {f_cap_}


    _cap represents the symbol to match a word with a capital letter. _c is a context
    marker symbol to identify only the concepts in context. It means to identify the
    names of people and authors whose names are specified after the CONTACT INFORMATION
    sub-header, in the text they will be identified.


