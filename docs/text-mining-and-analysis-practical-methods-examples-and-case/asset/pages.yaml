  md: '# About This Book


    Purpose

    Analytics is the key driver of how organizations make business decisions to gain
    competitive advantage. While the popular press has been abuzz with Big Data, we
    believe in “it is the analysis, stupid.” Having Big Data means little if that
    data is not leveraged via analytics to create better value for all stakeholders.
    One of the primary drivers of Big Data is the advent of social media that has
    exponentially increased the rate at which textual data is generated on the Internet
    and the World Wide Web. In addition to data generated via the Internet and the
    web, organizations have large repositories of textual data collected via forms,
    reports, customer surveys, voice-of-customers, call-center records and so on.
    There are numerous organizations that simply collect and store large volumes of
    unstructured text data, which are yet to be explored to uncover hidden nuggets
    of useful information that can benefit their business. However, there are not
    a lot of resources available that can efficiently handle text data for the business
    analyst community. This book is designed to help industries leverage their textual
    data and SAS tools to perform comprehensive text analytics.'
  merge: -1
