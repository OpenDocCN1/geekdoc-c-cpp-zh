  md: '# Summary

    Including textual data in data analysis has changed the analytics landscape over
    the last few decades. You have witnessed how traditional machine learning and
    statistical methods to learn unknown patterns in text data are now replaced with
    much more advanced methods combining NLP and linguistics. Text mining (based on
    a traditional bag-of-words approach) has evolved into a much broader area (called
    text analytics). Text analytics


    is regarded as a loosely integrated set of tools and methods developed to retrieve,
    cleanse, extract, organize, analyze, and interpret information from a wide range
    of data sources. Several techniques have evolved, with each focused to answer
    a specific business problem based on textual data. Feature extraction, opinion
    mining, document classification, information extraction, indexing, searching,
    etc., are some of the techniques that we have dealt with great detail in this
    chapter. Tools such as SAS Text Miner, SAS Sentiment Analysis Studio, SAS Content
    Categorization, SAS Crawler, and SAS Search Indexing are mapped to various analysis
    methods. This information helps you distinguish and differentiate the specific
    functionalities and features that each of these tools has to offer while appreciating
    the fact that some of them share common features.


    In the following chapters, we use SAS Analytics tools (except SAS Ontology Management,
    which is not discussed in this book) to address each methodology discussed in
    this chapter. Chapters are organized in a logical sequence to help you understand
    the end-to-end processes involved in a typical text analysis exercise. In Chapter
    2, we introduce methods to extract information from various document sources using
    SAS Crawler. We show you how to deal with the painstaking tasks of cleansing,
    collecting, transforming, and organizing the unstructured text into a semi-structured
    format to feed that information into other SAS Text Analytics tools. As you progress
    through the chapters, you will get acquainted with SAS Text Analytics tools and
    methodologies that will help you adapt them at your organization.'
