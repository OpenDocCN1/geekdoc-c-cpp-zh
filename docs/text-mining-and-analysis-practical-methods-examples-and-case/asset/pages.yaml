- img_proc: true
  md: '# Introduction


    The United States Consumer Product Safety Commission (CPSC) is an independent
    agency in the United States that regulates the sale and manufacturing of more
    than 15,000 products in the United States. CPSC conducts research on products
    in the market and issues bans or recalls on unsafe products from use to prevent
    potential hazards. Consumers use the CPSC hotline or their website to report injuries,
    incidents or issues concerning the safety of products. In addition to these, CPSC
    operates the National Electronic Injury Surveillance System (NEISS), which collects
    Emergency Room data from 100 hospitals and use that to calculate probabilistic
    national estimates.


    # Objective


    In this case study, we attempt to explore, explain and analyze consumer complaints
    from the National Electronic Injury Surveillance System using SAS* Text Miner
    and SAS* Enterprise Content Categorization Studio. Through this analysis you can
    solve the following business problems and help to improve the search in a public
    records database about injuries:


    +   1. Determine the types of injuries sustained by people.

    2. Examine which actions lead to which types of injuries.

    3. Identify which products are specifically associated with which type of injuries.


    # Data Description


    For this case study, data is extracted from NEISS online query system containing
    consumer reported injury data. The following SAS data sets are provided to you
    for this case study.


    Neiss_school.sas7bdat – Data related to injuries and issues associated with Falls/Falling


    Neiss_sports.sas7bdat – Data related to injuries and issues associated with Sports


    Neiss_swallow.sas7bdat – Data related to injuries and issues associated with swallowing
    products


    These data sets are available in the folder Case Studies ► Case Study 4. See the
    website for this book. In addition to these data sets, we have also provided you
    with the raw files for each of these injury categories. SAS* Content Categorization
    project ‘CPSC_CC’ and SAS* Enterprise Miner project ‘CPSC’ are also made available
    in this folder for your reference.'
  merge: -1
  pgno: 334
