  md: '# Introduction


    In Chapter 2, we discussed how to extract content from a variety of data sources
    such as websites, blogs, feeds, local files, etc. In this chapter, we focus on
    how to organize and manage the data that we collect based on its content. Why
    is content management so important? Suppose hundreds of paper documents or files
    are scattered across your desk. You have encountered a task that you refer to
    a particular document, and you have absolutely no clue where document is located
    in the heap. It means that you have to manually sift through all of the documents
    to find what you need. If you had chosen to organize all of your files in separate
    folders and labeled them accordingly, you could have saved a lot of time searching.
    The same goes for digital documents stored on your laptop or PC. You are always
    better off creating a folder structure that makes logical sense to you storing
    your documents. This process is also called document classification. Document
    classification is often synonymously referred to as text classification or content
    categorization, indicating that we consider only the textual data in document
    content to perform classification. Objects such as images, graphics, or charts
    are ignored.


    Many of us classify documents at our workplace. We typically maintain a manageable
    number of folders (less than 100), and the total number of documents generally
    does not exceed more than few thousand. Assuming that you are the only person
    accessing your machine, this should be easy to manage. Extend this case to a large
    enterprise where the total number of documents is a few hundreds of thousands
    or even in the millions. What about a folder structure with more than a hundred
    folders and subfolders? What if there were an incremental flow of new documents
    added to the shared repository each day? In a typical enterprise, there are many
    knowledge workers contributing to the development of shared document repositories
    at any given time. This compounds the problem of managing and organizing document
    content in those repositories. At this point, you would want to automate the process
    of document classification. Organizing documents on this scale requires a lot
    of thought, planning, and work. It might appear to a simple task that you can
    do by yourself, which might be true if you are the only person benefiting from
    it. However, in reality, many users need to benefit from this preclassified repository.
    As a result, the logical arrangement of the folder structure should be meaningful
    and intuitive. This is the reason document classification has grown from being
    a simple administrative task to an amalgamation of both art and science.


    In the context of document classification, the folder structure is called taxonomy
    and the folders and subfolders are called categories and subcategories, respectively.
    In large enterprises, it is not efficient to navigate back and forth'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'through a huge folder structure to find documents of interest. It is worth
    mentioning that you can choose not to create a physical folder structure to organize
    your documents. All of your documents can be stored in one single storage location
    on a server. Instead of moving documents to folders, you opt to tag all of your
    documents with the information of the categories and subcategories to which they
    belong. These tags form the documents’ metadata, and they are useful in the document
    search and retrieval process. The process of tagging documents is technically
    termed in literature as content tagging or document tagging.


    If documents are stored in your company’s repository for your employees, but they
    are unable to find them, it can derail the progress of your workforce. Research
    studies show that the cost at an employee’s workforce of searching for a document
    and not finding it, in addition to the time and effort involved in creating a
    new document, add to approximately 12 million United States dollars per 1,000
    employees on average each year. Sometimes, the cost of not being able to find
    information can prove catastrophic. In a real-world example, a large pharmaceutical
    company failed to find a patent by by a competitor that was related to a similar
    drug that it envisioned to develop. As a result, five years of precious time and
    money went straight into the gutter!


    # Applications


    Organizations are increasingly showing interest in using text classification techniques
    for many business applications. Many media deploy document classification techniques
    to automatically categorize online news articles into various topics such as politics,
    business, science, sports, entertainment, etc. Spam filtering, automatic classification,
    and routing e-mails are well-known applications of text classification. Some websites
    provide automatic suggestions with links to similar or related content. Many universities
    set up their digital libraries and use abstracts or descriptions of articles,
    journals, and e-books to classify them into one or more categories. Automatic
    authorship attribution and identification of a document’s genre are some other
    classic cases of document classification techniques put into practice. In market
    research, open-ended responses or comments on a customer survey are automatically
    assigned predefined surveys for a qualitative study of data using text classification
    algorithms. An interesting but complex problem, automatic essay grading revealed
    how text classification programs can be developed to score student-written essays
    as closely as human graders. Needless to say, scientific advances in machine learning,
    natural language processing, and statistical techniques laid strong foundations
    for the evolution of sophisticated text classification methods.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Content Categorization


    Document classification (or content categorization as we refer to it for the remainder
    of this chapter) can be performed using SAS Content Categorization Studio. This
    tool offers two features, *categorization* and *concept extraction*, which are
    covered in great detail in this chapter. Content categorization (as the name implies)
    helps classify documents into a set of known subject areas or categories. Concept
    extraction helps extract important pieces of information from the documents called
    *concepts*. A concept can be the name of a person, place, organization, or event.
    A much more sophisticated feature, known as contextual extraction, is available
    if you obtain the Enterprise version of SAS Contextual Extraction Studio with
    SAS Content Categorization Studio. This feature incorporates the combined power
    of categories and concepts to extract complex factual information. The name of
    the president of a country, the date on which an article was published, etc.,
    are examples of complex facts. The distinguishing features of contextual extraction
    compared to concept extraction are discussed later in this chapter. Throughout
    this chapter, we discuss the features and functionalities of SAS Content Categorization
    Studio based on version 12.1. Screenshots of features are subject to slight changes
    in later versions.


    In Chapter 4, we showed how standard entities such as data, currency, address,
    etc., can be extracted using SAS Text Miner. However, SAS Text Miner cannot extract
    custom entities and complex facts from documents. For example, Display 7.1 shows
    a SAS Global Forum paper abstract in which SAS Add-In for Microsoft Office (a
    complex fact) represents the name of a SAS software product. To extract the names
    of software products used in the paper abstracts, you must write definition rules
    to find patterns in the documents with SAS as the prefix. In Display 7.1, the
    terms highlighted in red (intelligence and dashboard) are closely related to the
    field of Business Intelligence. As a result, they are helpful in the content categorization
    process.


    Before working in SAS Content Categorization Studio, the subject matter expert
    familiar with the document should define the taxonomy structure and categories/sub-categories
    into the documents are classified. A well designed taxonomy will help the end-users
    to easily narrow down to the specific folder in which they are likely to find
    a document of their interest. SAS Content Categorization Studio helps to build
    such taxonomies to organize information (content categorization) and identify
    facts (concept extraction). For these purposes, SAS Content Categorization Studio
    uses several natural language processing and advanced linguistic techniques. In
    SAS Content Categorization, you can develop rules for categories and concepts
    simultaneously, but in separate branches within the taxonomy.'
  merge: -1
  pgno: 207
