  md: "# Objective\n\nUnderstanding the actions and motives of fraudsters is a vital\
    \ part of predicting (and preventing) fraudulent activity. To gain an advantage,\
    \ you must incorporate analytics within your investigative process. The goal of\
    \ analytics is to turn data into actionable information. Unfortunately, most data\
    \ is unstructured, making it more challenging to analyze than traditional structured\
    \ data (such as demographic or transactional data). SAS Text Analytics processes\
    \ large volumes of text and provides useful analytics to support investigations.\
    \ The objective of this case study is to demonstrate how SAS Text Analytics can\
    \ be leveraged to extract meaningful information from textual data and to identify\
    \ patterns and trends across thousands of Enron email correspondences.\n\n# Enron\
    \ Description\n\nEnron data, used in this case study, is publicly released as\
    \ part of FERC’s Western Energy Markets investigation and has been converted to\
    \ industry standard formats by EDRM. The original data set consists of 1,227,255\
    \ emails with 493,384 attachments covering 151 customers. The email is provided\
    \ in Microsoft PST, IETF MIME, and EDRM XML files. This data was downloaded from\
    \ http://www.edrm.net/resources/data-sets/edrm-enron-data-set-v2 in an XML format.\n\
    \nThis case study was performed using the following SAS software:\n\n+   * SAS*\
    \ Enterprise Miner\n* SAS* Text Miner\n* SAS* Enterprise Content Categorization\n\
    * SAS* Crawler (SAS Information Retrieval Studio)\n\nStep-by-Step Software Installation\
    \ with Settings/Properties\n\n# Step 1: Information Retrieval and Parsing\n\n\
    As described above, we choose to download the files in XML format from the website\
    \ http://edrm.net/. The XML file looked something like this:\n\n```\n<xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<article>\n  <body>Attached is The weekly report from\
    \ 7/26/01-8/1/01. Lex Carroll Enron Power Marketing, Midwest Region 713-853-5426</html><title>Weekly\
    \ report|</title>\n  <id>60068</id>\n  <msgdate>02AUG2001 : 06:39:26</msgdate>\n\
    \  <from>Lex Carroll</from>\n  <to>William Abler</to>\n</body>\n</article>\n```\n\
    \nOur first objective is to convert the XML files into a structured format (a\
    \ SAS"
