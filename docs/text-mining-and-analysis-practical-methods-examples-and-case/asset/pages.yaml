    # Categorizing Content


    Now that you have examined topics to understand what is going on in the data,
    you can decide to promote some or all of those topics as categories to begin building
    taxonomy. Taxonomy is a hierarchical organization of categories that are useful
    for classifying (and organizing) unstructured data to your business needs. You
    can promote topics by right-clicking and selecting Add Topic as Category from
    the context menu or by clicking the icon, as shown in Display C8.6. In the Categories
    pane, you can rename and add new categories as you build the taxonomy. The taxonomy
    captures your business domain and organizes your rules for future categorization.


    The research community has approached classification through a variety of techniques
    in the areas of text mining, natural language processing,


