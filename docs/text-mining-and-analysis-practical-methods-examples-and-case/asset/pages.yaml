    \ the links at the next depth. Display 2.3 shows the web crawler path in breadth\
    \ first mode for this current example.\n\n# Display 2.3: Traversing Path of a\
    \ Web Crawler in Breadth First Mode\n\n![](img/2c338747b5eaca8c1cd68dcd87c24126_57_0.png)\n\
    \n| Page 1 | Page 3 | Page 8 | Page a |\n|---|---|---|-|\n| Page 2 | Page 4 |\
