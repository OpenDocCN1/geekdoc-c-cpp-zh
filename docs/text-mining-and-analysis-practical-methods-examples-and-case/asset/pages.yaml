  md: '# Clustering


    Cluster analysis is a popular technique used by data analysts in numerous business
    applications. Clustering partitions records in a data set into groups so that
    the subjects within a group are similar and the subjects between the groups are
    dissimilar. The goal of cluster analysis is to derive clusters that can have value
    with respect to the problem being addressed, but this goal is not always achieved.
    As a result, there are many competing clustering algorithms. The analyst often
    compares the quality of derived clusters, and then selects the method that produces
    the most useful groups. The clustering process arranges documents into nonoverlapping
    groups. (See Display 1.7.) Each document can fall into one topic area after classification.
    This is the key difference between clustering and the general text classification
    processes, although clustering provides a solution to text classification when
    groups must be mutually exclusive, as in the classified ads example.


    In the context of text mining, clustering divides the document collection into
    mutually exclusive groups based on the presence of similar themes. In most business
    applications involving large amounts of textual data, it is often difficult to
    profile each cluster by manually reading and considering all of the text in a
    cluster. Instead, the theme of a cluster is identified using a set of descriptive
    terms that each cluster contains. This vector of terms represents the weights
    measuring how the document fits into each cluster. Themes help in better understanding
    the customer, concepts, or events. The number of clusters that are identified
    can be controlled by the analyst.


    The algorithm can generate clusters based on the relative positioning of documents
    in the vector space. The cluster configuration is altered by a start and stop
    list.


    # Display 1.7: Text Clustering Process Assigning Each Document to Only One Cluster'
