  md: '# Text Mining Using SAS Text Miner


    A typical predictive data mining problem deals with data in numerical form. However,
    textual data is typically available only in a readable document form. Forms could
    be e-mails, user comments, corporate reports, news articles, web pages, etc. Text
    mining attempts to first derive a quantitative representation of documents. Once
    the text is transformed into a set of numbers that adequately capture the patterns
    in the textual data, any traditional statistical or forecasting model or data
    mining algorithm can be used on the numbers for generating insights or for predictive
    modeling.


    A typical text mining project involves the following tasks:


    +   Data Collection: The first step in any text mining research project is to
    extract, clean, and collect the textual data required for analysis.


    +   Text Parsing and Transformation: The next step is to extract, clean and create
    a dictionary of words from the documents using NLP. This includes identifying
    sentences, determining parts of speech, and stemming words. This step involves
    parsing the extracted words to identify entities, removing stop words, and spell-checking.
    In addition to extracting words from documents, variables associated with the
    text such as date, author, gender, category, etc., are retrieved.


    The most important task after parsing is text transformation. This step deals
    with the numerical representation of the text using linear algebra-based methods,
    such as latent semantic analysis (LSA), latent semantic indexing (LSI), and vector
