  md: '# Summary


    In this chapter, we discussed the transformation methods available in the Text
    Filter node that can be applied to a term-by-document matrix. You should experiment
    with different frequency weighting (count, log, and binary) and term weighting
    (entropy, IDF, and mutual Information) methods. Term weighting methods help in
    achieving the primary objective of text mining analysis—to discriminate documents—by
    assigning weights to terms. The relationships between terms based on their co-occurrences
    in documents can be explored using the concept links feature in this node. The
    Text Filter node also has a capability to filter documents from analysis using
    search queries. Like any typical search engine functionality, you can retrieve
    documents for viewing or for dropping from analysis.


    With a fully prepared term-by-document matrix, the next step in text mining analysis
    is applying traditional data mining techniques such as clustering or classification.
    Chapter 6 discusses in detail document clustering and topic extraction using SAS
    Text Miner.'
