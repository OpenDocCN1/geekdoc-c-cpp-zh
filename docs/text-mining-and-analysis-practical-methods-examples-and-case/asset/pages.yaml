  md: '# Summary


    Sentiment analysis plays an important role in understanding a customer’s experience
    with a product or service. In this chapter, you learned how SAS Sentiment Analysis
    Studio can be used to build sophisticated models to classify a consumer’s opinion
    or feedback toward an entity or attribute of an entity as positive, negative,
    or neutral. Using known examples of classes of sentiment, a quick sentiment analysis
    of data can be performed by building a statistical model. A rule-based model that
    uses advanced linguistic technologies can be built by creating different types
    of rules: CLASSIFIER, CONCEPT, C_CONCEPT, CONCEPT_RULE, PREDICATE_RULE, and REGEX.
    Rule-based models provide the enhanced capability to extract sentiment at a more
    granular level: as a sentence or product feature. A hybrid model can be created
    by integrating the results from a statistical model into a rule-based model, which
    can yield better results in many situations. Similarly, a better sentiment analysis
    model can be built by using the results from the SAS Text Miner Text Rule Builder
    node. The Boolean rules from the Text Rule Builder node can be a good starting
    point for developing tonal keywords, concepts, and features for use in SAS Sentiment
    Analysis Studio. Case Study 3 and Case Study 6 discuss in detail how to use SAS
    Sentiment Analysis Studio with SAS Text Miner to build better sentiment analysis
    models.'
