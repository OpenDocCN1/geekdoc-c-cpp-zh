    # Boolean


    A Boolean rule-based categorizer enables you to join linguistic terms using Boolean
    operators such as AND, OR, NOT; each method provides the ability to disambiguate
    rules between the same words that might'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'occur in different contexts. The result of a Boolean rule expression is always
    either true or false, indicating whether it has found a match in the document.
    This method is the most powerful of all categorization techniques available in
    SAS Content Categorization Studio. It often yields better results compared to
    all other methods. Boolean rules are the hardest to develop because they require
    the most sophisticated human effort.


    You can create symbolic links to refer to a category in the Boolean rules of another
    category. This mechanism proves efficient when you have a subcategory that should
    include the Boolean rules defined in your category. You can incorporate concept
    definitions in Boolean rules if they are defined within the same taxonomy. Similar
    to a linguistic rule, a Boolean rule allows for the modification of terms using
    qualifiers. Boolean rules are effective in finding matches in a structured document
    such as XML, where text data can be embedded inside tags. You can explicitly mention
    in the rules exactly where to look for the rule terms, such as in the body or
    title of the file.


    Boolean rules follow a particular syntax and structure. They always start with
    a Boolean operator, followed by one or more arguments. You can either choose to
    write rules manually in the prescribed syntax or to use the point-and-click interface
    to add the operators and arguments without having to remember the syntax. To use
    the point-and-click interface, change the rules window mode from Text to View
    on the **Rules** tab. (See Display 7.14.)


    # Display 7.14: Text View and View Options on the Rules Tab


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_219_0.png)


    The structure of Boolean rules facilitates the conditional matching of words or
    phrases. Rules can be defined to match categories with the occurrence of a term
    in the presence or absence of one or more terms. There are several types of Boolean
    operators available in SAS Content Categorization Studio. The biggest advantage
    of Boolean rule-based categorization is disambiguation. For example, consider
    the word “poker.” Poker is a well-known card game in which each player places
    bets, claiming to hold high-ranking cards. However, “poker” could mean a metal
    rod used to stir a fire in a fireplace. Linguistic rules are not capable of handling
    this scenario. Boolean rules can help you disambiguate the contexts when these
    types of words appear in documents. To distinguish the two contexts, you can write
    Boolean rules in the categorizer to look for closely related words in the proximity
    of the word “poker” as a game. (See Display 7.15.)'
