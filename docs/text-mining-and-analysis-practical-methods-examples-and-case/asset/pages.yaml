    | TIME_PERIOD | An expression of measured time | 10 days or 5 years |

    | TITLE | Title of a person or a position | Mr. or Ms. or Dr.

    | VEHICLE | Make, name, year, and color | Honda Accord EX 2005 Black |


    Raw entities found during the analysis are transformed into their normalized forms.
    SAS Text Miner performs normalization on the entities in certain instances. Entities
    in short form are normalized to their full form. For example, when the Text Parsing
    node finds “NASA” in the text, it is looked up against the dictionary, and its
    complete name “National Aeronautics and Space Administration” is returned. A prebuilt
    dictionary with a set of organization and company names is used to identify and
    associate each with a parent. As a generally accepted norm, the entity expanded
    in its most precise expanded form is used as the parent form. Entities found in
    the ISO (International Standardization for Organization) standard are normalized
    to replace the original term instead keeping the parent–child (original term)
    relation. Entities returned by SAS Text Miner can be changed by tweaking the synonym
    list. The original entity is placed in the Term column, the entity in the appropriate
    form in the Parent column, and the entity in the Category column before rerunning
    the node to achieve the results. Custom entities can be'
