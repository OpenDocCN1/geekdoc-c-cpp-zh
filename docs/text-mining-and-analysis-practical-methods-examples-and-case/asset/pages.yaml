  md: '# Summary


    Text is a largely unused asset in many organizations. Firms need to interpret,
    summarize, and report on information that is contained in documents. This case
    study demonstrates the convenience of a single user interface in a familiar call
    center scenario. It also helps you understand the benefits of a single web application
    that provides a framework for interactively discovering and building a content
    categorization model. In a single installation, the SAS® Unified Text Analytics
    Interface enables multiple users to access the combined power of the algorithms
    in SAS® Text Analytics and SAS® Content Categorization. It is a complementary
    solution in the SAS® Text Analytics product suite that is also tightly integrated
    with SAS® High-Performance Analytics technologies. SAS® Unified Text Analytics
    Interface is formally planned to be released under the name SAS® Contextual Analysis
    in Q3 2013.


    Although this case study focuses on call center data, the same principles apply
