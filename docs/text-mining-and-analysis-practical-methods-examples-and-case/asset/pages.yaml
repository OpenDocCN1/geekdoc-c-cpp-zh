    hardware architecture, analytics application architecture, and data processing
    methodologies, high-performance computing technology can handle the complexity
    of big data. SAS High-Performance Text Mining helps you decrease the computational
    time required for processing and analyzing volumes of text data significantly.
    It uses the combined power of multithreading, a distributed grid of computing
    resources, and in-memory processing. Using sophisticated implementation methodologies
    as symmetric multiprocessing (SMP) and massively parallel processing (MPP), data
    is distributed across computing nodes. Instructions are allowed to execute separately
    on each node. The results from each node are combined to produce meaningful results.
    This is a cost-effective and highly scalable technology that addresses the challenges
    posed by the three Vs. (variety, velocity, and volume) of big data.


    SAS High-Performance Text Mining consists of three components for processing very
    large unstructured data. These components are document parsing, term handling,
    and text processing control. In the document parsing component, several NLP techniques
    (such as parts-of-speech tagging, stemming, etc.) are applied to the input text
    to derive meaningful information. The term handling component accumulates (correct
    missed terms using synonyms list), filters (removes terms based on a start or
    stop list and term frequency), and assigns weights to terms. The text processing
    control component manages the intermediate results and inputs generated by the
    document parsing and term handling components. It helps generate the term-by-document
    matrix in a condensed form. The term-by-document matrix is summarized using the
    SVD method, which produces statistical representations of text documents. These
    SVD scores can be later included as numeric inputs to different types of models
    such as cluster or predictive models.


    # Voice Mining


    Customer feedback is collected in many forms—text, audio, and video—and through
    various sources—surveys, e-mail, call center, social media, etc. Although the
    technology for analyzing videos is still under research and development, analyzing
    audio (also called voice mining) is gaining momentum. Call centers (or contact
    centers) predominantly use speech analytics to the audio signal for information
    that can help call center effectiveness and efficiency. Speech analytics software
    is used to review, monitor, and categorize audio content. Some tools use phonetic
    index search techniques to automatically transform the audio signal into a sequence
    of phonemes (or)'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'sounds) for interpreting the audio signal and segmenting the feedback using
    trigger terms as "cancel," "renew," "open account," etc. Each segment is then
    analyzed by listening to each audio file manually, which is daunting, intensive,
    and unpredictable. As a result, analytical systems that combine data mining methods
    and linguistics techniques are developed to quickly determine what is most likely
    to happen (such as a customer’s likelihood to cancel or close the account). In
    this type of analysis, metadata from each voice call, such as call length, emotion,
    stress detection, number of transfers, etc., is captured by these systems that
    can reveal valuable insights.


    # Real-Time Text Analytics


    Another key focusing area that is being observed in text analytics technology
    development is real-time text analytics. Most of the applications of real-time
    text analytics are addressing data that is streaming continuously on social media.
    Monitoring public activity on social media is now a business necessity. For example,
    companies want to track topics about their brands that are trending on Twitter
    for real-time ad placement. They want to be informed instantly when their customers
    post something negative about their brand on the Internet. Less companies want
    to track feeds and blog posts for financial reasons. Government agencies are relying
    on real-time text analytics that collect data from innumerable sources on the
    web to learn and predict medical epidemics, terrorist attacks, and other criminal
    actions. However, real time can mean different things in different contexts. For
    companies involved in financial trading by tracking current events and news feeds,
    real time could mean milliseconds. For companies tracking customer satisfaction
    or monitoring board reputation, real time could mean hourly. For every business,
    it is of the utmost importance to react instantly before something undesirable
    occurs.


    The future of text analytics will surely include the next generation of tools
    and techniques with increased usefulness for textual data collection, summarization,
    visualization, and modeling. Chances are these tools become staples of the business
    intelligence (BI) suite of products in the future. Just as SAS Rapid Predictive
    Modeler today can be used by business analysts without any help from trained statisticians
    and modelers, so will be some of the future text analytics tools. Other futuristic
    trends and applications of text analytics are discussed by Berry and Kogan (2010).'
