  md: 'Suppose you want to analyze thousands of documents that are available in PDF
    format and stored on your desktop or on a network location. You want to represent
    each PDF file as a unit of analysis (i.e., the contents of one PDF file should
    reside in exactly one cell in your table or SAS data set as shown in Display 3.11).


    # ### Display 3.11: Mapping Each PDF Document to Each Cell in a SAS Data Set


    | Corpus of PDFs | SAS Data Set |

    | --- | --- |

    | | Doc Text |

    | | 1 | |

    | | 2 | |

    | | 3 | |

    | | 4 | |

    | | 5 | |

    | | 6 | |


    In this example, you can use the Text Import node to convert 1,000 SAS Global
    Forum papers available in PDF format to a SAS data set. After this step, you will
    have a SAS data set of 1,000 observations in which each observation corresponds
    to one Global Forum paper. A SAS data set cell can hold a maximum of 32,000 characters.
    Hence, it is not possible to include all the contents of a single paper in one
    cell. In this situation, a cell can take only the first 32,000 characters in the
    paper. The Text Import node provides a facility to capture the links to the actual
    papers instead of the content of the actual papers. The output data set contains
    a variable that the successor nodes use the document path information to access
    the full content of the papers. If you think you need only a certain number of
    bytes, set the node properties to fetch that number of bytes of text. Only text
    that is present in the documents is imported. To extract tables, check boxes,
    or any other objects from the documents requires additional preprocessing. If
    the PDF is produced by a scanner, you first need to convert the images to textual
    documents using any optical character recognition (OCR) software.


    Let’s see in detail how you can perform these operations using the Text Import
    node.


    We start by creating the two folders for the Text Import node to work right. We
    have a named folder Source created on our desktop that contains 1,000 SAS Global
