- img_proc: true
  md: '# Introduction


    In this chapter, we discuss the next step and perhaps the most important step
    in the text mining process flow—text parsing. In Chapters 2 and 3, we have seen
    how various methods collect and process textual documents. The next task is to
    convert the collected text documents (in unstructured form) to a vector representation
    (a structured form). Fundamentally, parsing is the first step in converting unstructured
    text to the familiar spreadsheet (structured) format for ease of analysis. Typically,
    this process involves tokenization, normalization of tokens (via lemmatization
    or stemming), part-of-speech (POS) tagging and so on.


    There are two broad-based approaches to analyzing the text. The first is the bag-of-words
    method, where the basic assumption is counting words in the text, plus understanding
    how these words are syntactically (structurally) related to each other in regard
    to laws of grammar, etc. This method is sufficient to summarize and classify text
    documents. The second approach, which is linguistic, posits that to truly understand
    and classify text, you have to move beyond syntax to semantics (meaning of words).
    For a detailed discussion of the similarities and differences between these approaches,
    as well as the philosophical debate over Chomsky’s empirical approach versus the
    behaviorist’s approach in the NLP field, see Manning and Schutte (2000) and Dale
    and Somers (2000). In order to apply either approach, the text document is first
    parsed to find the words contained in it.


    Term parsing was originally derived from the Latin word “pars oration,” meaning
    the identification of parts of speech. Parsers are now being extensively used
    in various disciplines. In the field of computer science, a computer program is
    parsed to identify the syntax of the code before it is compiled. In computational
    linguistics, parsing is used to identify the grammatical structure in regard to
    a structured language. In both cases, the text is first broken into pieces called
    tokens (for example, words), and then the structural relationships among the tokens
    (words) within the text are delineated. In this chapter, we demonstrate how to
    use the Text Parsing node for parsing a textual.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Tokens and Words


    Parsing begins by taking a stream of characters (such as a sequence of sentences
    in a text document) and breaking it down to tokens (to units, where a unit is
    either a word, a number, or a punctuation mark). This process is called tokenization.
    A term identified through tokenization might not be just a single word, but can
    be a group of words (for example, noun groups). Typically, the tokenization process
    involves applying commonly accepted delimiters such as a period, space, tab, new
    line, and so on, to unstructured text, and figuring out instances (occurrences)
    of each token. Consider sentence,"I love eating chocolate but I worry about how
    many calories are in each bite." In sentence, there are 15 tokens, but the token
    "I" appears twice. Strictly speaking, linguists refer to each token as an instance
    of a type. In that sense, we have two instances of the type "I" in the sentence.
    In this book, we use frequency of type and frequency of tokens interchangeably.


    In addition to identifying tokens, the purpose of various punctuation characters
    is deciphered during parsing. Although this process might seem simple for humans
    trained in a language, it is a difficult task for computers because of the complexities
    of the language and the variations based on contextual use. For example, comma
    might often be a delimiter, unless it appears in the middle of a string of numbers,
    in which case the comma often appears as a separator for thousands, millions,
    and so on, to make it easier for humans to quickly grasp the meaning. A period
    might be at the end of a sentence or part of an abbreviation (such as Mr.). A
    dash between two numbers might be a symbol of a subtraction operation or a separator
    as in a telephone number, 744-5000. Parsing faces problems with how to handle
    single apostrophes. For example, is "I''ll" a single token, or should be considered
    two tokens, "I" and "will"? There are no easy answers to any of these problems.


    # Lemmatization


    After tokens are found in a text document, the next step is often the normalization
    of tokens to reduce complexity. In any text, you will find different forms of
    the same word such as "play," "plays," and "playing" used for grammatical reasons.
    For computational purpose, it is useful to treat all variants of a word similarly.
    This process involves identifying the root terms in different variants of a token.
    Lemmatization and stemming are typically used for this purpose. These two methods
    have the same goal of reducing inflected or derived words to their stem or root
    forms, but they follows a crude heuristic process that chops off the ends of words.
    Lemmatization uses a standard vocabulary and morphological analysis of words for
    reducing an'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'inflectional form of the word to its base or dictionary forms, which is known
    as lemma.


    The basic idea is that reducing the frequency of the number of distinct types
    in a corpus, you can reduce the complexity of the document summarization task
    without much loss of information. This is possible because word categories are
    systematically related by morphological processes such as the singular and plural
    forms of nouns or different tenses of the same verb. One example is using the
    root term (lexeme) such as "run" to represent terms such as "ran," "runs," "running,"
    and so on. Another example of stemming is to use the singular form of a noun (such
    as car) as the root term for plural forms of the same noun (such as cars).


    When normalization is restricted to the grammatical variants of the tense forms
    or singular and plural, it is called stemming in morphological analysis. Derivation
    in morphological analysis occurs when a word is changed more radically from one
    syntactic category to another. An example is adding a suffix as "er" to the verb
    form of the word "teach" to convert it to the noun form "teacher." However, stemming
    should not be restricted to grammatical variants. It can be extended to include
    semantically equivalent words (synonyms). For example, a synonym-based lemmatization
    might use the word "car" as the root for semantically equivalent words such as
    automobile. Compounding in morphological analysis refers to the formation of a
    new word by merging two words. The most common examples are noun-noun compounds
    such as DVD disk, flash drive, college degree, and so on. In parsing, compounds
    can often be handled as entities or through phrase recognition.


    # POS Tags


    Once text is split into tokens and the tokens are normalized, the next logical
    step is to determine the POS for each token to perform additional linguistic analyses
    and extract more sophisticated features. POS tagging (often called tagging) is
    the task of labeling each token (word) in a sentence with its appropriate part
    of speech. That is, for each word in a sentence, the algorithm decides whether
    it is a noun, verb, adjective, preposition, conjunction, and so on. A commonly
    known tag set in English is the Brown tag set based on the American corpus of
    about one million English words (Brown et al., 1991). The Brown tag set is quite
    large with 179 tags. It is very common the same word can be identified as a different
    part of speech based on the context. In this situation, each combination of word
    and POS tag can be represented as a unique token. For example, the term "address"
    tagged as noun is different from the term "address" tagged as verb. Hence, a large
    set of tags causes the term space to grow vastly. In a computational world, often
    a smaller tag set (such as'
