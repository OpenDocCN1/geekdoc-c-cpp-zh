    part of speech, an entity classification, or the value Noun Group. Enabling the
    part-of-speech settings controls which form of a word is excluded or included.
    For example, if you have the term “duck” with the role Verb in your stop list,
    and you set the Different Parts of Speech property to Yes, then the word “duck”
    is excluded from parsing only when it is used as a verb. If no role is defined
    for the word “duck,” then any instance of the term “duck” is excluded from the
    parsing results. In this example, we have added custom terms to the stop list
