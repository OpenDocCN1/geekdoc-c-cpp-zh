  md: '# Emerging Directions


    Although the number of applications in text analytics has grown in recent years,
    there continues to be a high level of excitement about text analytics applications
    and research. For example, many of the papers presented at the Analytics 2011
    Conference and SAS Global Forum 2013 were based on different areas of text analytics.
    In a way, the excitement about text analytics reminds us of the time when data
    mining and predictive modeling was taking off at business and academic conferences
    in the late 90s and early 2000s. The text analytics domain is constantly evolving
    with new techniques and new applications. Text analytics solutions are being adopted
    at the enterprise level and are being used to operationalize and integrate the
    voice of the customer into business processes and strategies. Many enterprise
    solution vendors are integrating some of text analytics technology into their
    product line. This is evident from the rate of acquisitions in this industry.
    One of the key reasons that is the growth of the field of text analytics is the
    increasing amount of unstructured data that is being generated on the web. It
    is expected that 90% of the digital content in the next 10 years will be unstructured
    data.


    Companies across all industries are looking for solutions to handle the massive
    amounts of data, also popularly known as big data. Data is generated constantly
    from various sources such as transaction systems, social media interactions, clickstream
    data from the web, real-time data captured from sensors, geospatial information,
    and so on. As we already pointed out, by some estimates, 80% of an organization’s
    current data is not numeric!


    This means that the variety of data that constitutes big data is unstructured.
    This unstructured data comes in various formats: text, audio, video, and more.
    The constant streaming of data on social media outlets and websites means the
    velocity at which data is being generated is very high. The variety and the velocity
    of the data, together with the volume (the massive amounts) of the data organizations
    need to collect, manage, and process in real time, creates a challenging task.
    As a result, the three emerging applications for text analytics will likely address
    the following:


    +   1. Handling big (text) Data

    2. Voice mining

    3. Real-time text analytics


    # Handling Big (Text) Data


    Based on the industry’s current estimations, unstructured data will occupy 90%'
