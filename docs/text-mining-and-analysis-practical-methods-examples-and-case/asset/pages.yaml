    # Grammar


    Using grammar concept definitions, you can specify parts of speech or use wildcard
    searches to match any term. Select **Grammar** on the **Definitions** tab to write
    grammar concept definitions. The wildcare search symbols #w and #cap identify
    any words and words that begin with an uppercase letter, respectively. For example,
    some SAS products such as SAS Enterprise Guide, SAS Enterprise Miner, etc., can
    be identified by writing a rule like the following:


    #ROOT=*SASConcept

    *SASConcept=SAS #cap #cap


    All grammar rules have the format #ROOT=*<ConceptName> in its first line. Part-of-speech
    tags can be used to capture words or phrases used with a specific sequence in
    a sentence. For example, the following concept definition is capable of identifying
    a match when the sentence contains a phrase such as “exceptionally brilliant”
    or “charmingly intelligent” that follows the specific sequence of an adverb followed
    by an adjective (:A):


    #ROOT=*Concept1

    *Concept1 :=Adv :A


    Symbol :Adv represents an adverb and :A an adjective. Similarly, :digit represents
    a numeric value between 0 and 9. :Det represents a noun-modifying determinant
    like “the,” “a,” or “an.” :PN represents a proper noun, and so on. There are many
    symbols to use in concept definitions depending on the requirement. For a complete
    list of part-of-speech tags or symbols, see the'
