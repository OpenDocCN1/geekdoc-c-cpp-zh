  md: '# Case Study 5 Enhancing Predictive Models Using Textual Data


    Maheshwar Nareddy

    Goutam Chakraborty


    +   - Data Description

    - Step-by-Step Instructions

    - Summary


    While text mining customer responses can reveal valuable insights about a customer,
    plugging the results from text mining into a typical data mining model can often
    significantly improve the predictive power of the model. Organizations often want
    to use customer responses captured in the form of text emails, customer survey
    questionnaires, and feedback on websites for building better predictive models.
    One way of doing this is to apply text mining to reveal groups (or, clusters)
    of customers with similar responses or feedback. This cluster membership information
    about each customer may then be used as an input variable to augment the data
    mining model. With this additional information, the accuracy of a predictive model
    can improve significantly.


    The data used in this case study is hypothetical. But, it is created based on
    a real data set of a client company (Fuel Stop Company with 300+ gas stations
    in the US). Some of the text comments, variable names, and descriptions have been
    disguised to protect the identity of the client company.


    The hypothetical case involves customers calling the fuel company''s call center
    for many different reasons. Customers'' comments via phone were captured by call-center
    reps and typed into a form. These comments were later merged with numeric variables
    from the fuel company’s database about these customers (matching them the company’s
    loyalty card number).'
  merge: -1
  pgno: 351
