  md: '# Trend Analysis


    In recent years, text mining has been used to discover trends in textual data.
    Given a set of documents with a time stamp, text mining can be used to identify
    trends of different topics that exist in the text. Trend analysis has been widely
    applied in tracking the trends in research from scientific literature. It has
    also been widely applied in summarizing events from news articles. In this type
    of analysis, a topic or theme is first defined using a set of words and phrases.
    Presence of the words across the documents over a period of time represents the
    trend for this topic. To effectively track the trends, it is very important to
    include all related terms to (or synonyms of) these words.


    For example, text mining is used to predict the movements of stock prices based
    on news articles and corporate reports. Evangelopoulos and Woodfield (2009) show
    how movie themes trend over time, with male movies dominating the World War II
    and female movies dominating the Age of Aquarius. Another example, mining social
    networks to identify trends is currently a very hot application area. Google Trends,
    a publicly available website, provides a facility to identify the trends in your
    favorite topics over a period of time. Social networking sites such as Twitter
    and blogs are great sources to identify trends. Here is a screenshot of the trend
    for the topic “text mining” from Google Trends. It is clearly evident that the
    growth in search traffic and online


    posts for the term “text mining” peaked after 2007. This is when the popularity
    of text mining applications in the business world jump-started.


    # Display 1.8: Trend for the Term “text mining” from Google Trends


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_39_0.png)


