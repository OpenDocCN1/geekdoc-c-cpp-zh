    \ 12 |\n| | Page 13 |\n| | Page 14 |\n| | Page 15 |\n| | Page 16 |\n| | Page 17\
    \ |\n| | | | | Page z |\n\n# Depth First\n\nThe depth first option guides the\
    \ crawler to select one link first, and then completely go through all the child\
    \ links following it, until the end. Once all of child links within this link\
    \ are completely crawled, the control goes back to the next link, and follows\
