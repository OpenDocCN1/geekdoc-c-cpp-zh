  md: '# Introduction


    You saw in Chapter 4 that the first task of text mining analysis is to break down
    the text into a bag of words or tokens. Then, you apply various linguistic rules
    to identify the parts of speech, synonyms, noun groups, attributes, etc. Even
    before doing this, a good understanding of what is being talked about in a corpus
    can be obtained by looking at the counts of words extracted from the corpus. A
    current popular technique to visually represent prominent entities in text is
    using a word cloud or text cloud. This is an easy and visually appealing way of
    presenting the frequency of words as a weighted list. The font size of the words
    represents the frequency of the word. High frequency words appear in a bigger
    font size. There are various online resources available for free that can be used
    to generate a word cloud. Display 5.1 shows a word cloud for text from five random
    SAS Global Forums from our SAS Global forum corpus. It is clearly evident that
    the terms “data,” “SAS,” and “bivariate” appear frequently in this corpus.


    # Display 5.1: Word Cloud


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_153_0.png)


    Source: http://wordit.com


    # Zipf''s Law


    The most widely celebrated theory on the distribution of words in a large corpus
    is given by George Zipf, popularly known as Zipf''s law. This law was first stated
    by Estoup (1916), and later popularized by Zipf (1949). Manning and Schütze (1996)
    evaluate Zipf''s law using Mark Twain''s Tom Sawyer. According to Zipf''s law,
    if you rank the frequency of occurrence of the words in a'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'corpus, you can observe an approximate mathematical relationship between the
    position of the word (or the rank) and the frequency of occurrence of the word,
    as stated below:


    $f \alpha \frac{1}{r} \quad or \quad f \cdot r = k \quad (Equation 5.1)$


    In this equation, $f$ is the frequency of occurrence of the word, $r$ is the rank
    of the word, and $k$ is a constant.


    Zipf''s law was widely applied to study different types of human behavior. In
    many cases, it was observed that the law holds true only for small corpora within
    processing capabilities during that time. When this law was applied to the SAS
    Global Forum corpus, we saw a big deviation in the constant term (frequency*rank)
    as shown in Table 5.1.


    # Table 5.1: Applying Zipf''s law to SAS Global Forum Papers


    | Term | Frequency | Rank | Frequency*Rank |

    |---|---|---||

    | + be | 77920 | 1 | 77920 |

    | + institute | 42292 | 2 | 84584 |

    | + data | 42224 | 3 | 126672 |

    | + use | 25155 | 4 | 100620 |

    | + variable | 15218 | 5 | 76090 |

