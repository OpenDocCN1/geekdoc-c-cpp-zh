    A start or stop list controls the terms that are used in text mining. A stop list
    contains stop words that have little or no value in identifying a document or
    in comparing documents. Standard stop lists contain stop words (the, a, this),
    conjunctions (and, but, or), and prepositions (of, from, by). A custom stop list
    can be created to identify low information words, like the word “computer” in
    a collection of articles about computers. In contrast, a stop list contains the
    words that you want to include in the analysis. When using a start list, only
    the terms in the start list are included in the analysis.


    Start lists are mainly used when documents are dominated by technical jargon or
    in situations where adequate domain expertise is available. On the other hand,
    stop lists are used when documents are loosely related like news articles, business
    reports, and Internet searches or in situations where domain expertise is not
    available.


