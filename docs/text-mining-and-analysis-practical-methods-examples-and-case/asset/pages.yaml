  md: '![](img/2c338747b5eaca8c1cd68dcd87c24126_222_0.png)


    For the zone-based relevancy type, the entire document is divided into three equal
    segments. A document scanned for any rule matches in all three segments. If the
    first segment has a match with any of the category, it gets a high weight. If
    a match occurs in the third segment, it gets a low weight. The rationale behind
    this approach is that rarer terms representing a category are found in the beginning
    sentences of document, the probability that the document actually belongs to the
    category is high. If the rule terms are found in the last part of the document,
    there is a very low chance that the document belongs to the category. In this
    case, the rule terms might have occurred in the document in reference to some
    other document or in a different context altogether. This relevancy type might
    not be the most suitable for all types of data, but it generally works well for
    categorizing rules, news articles, and etc.


    The operator-based relevancy type boosts the Boolean rules that have greater coverage
    of the document content. Although the operator-based relevancy type for Boolean
    rules is most suitable it also works for linguistic rules. There are a few other
    factors such as relevancy cutoff, cutoff bias, and category bias that can influence
    relevancy calculations. Relevancy cutoff is the minimum threshold that the relevancy
    score must meet in order for a document to be matched against a category. This
    cutoff can be specified for each category separately on the Data tab. By default,
    its value is 0. If a document passes for a match on the match ratio, but fails
    to meet the relevancy cutoff, it is branded as conditionally passed. Relevancy
    bias helps in boosting the relevancy of one category over others in the case where
    the occurrence of certain terms in a document provide enough credibility to unequivocally
    decide its category membership. The default value for relevancy bias is 1. Similarly,
    category bias boosts the relevancy of one or more categories of an entire taxonomy
    to help in the information retrieval process to return the most relevant information.
    The primary difference between relevancy bias and category bias is that the former
    relies on the key terms of a category, and the latter gives more credibility to
    the categories of a particular taxonomy compared to the others of'
