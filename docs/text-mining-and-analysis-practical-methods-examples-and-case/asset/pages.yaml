    # (b) Retrieve Data from the Web and Create a SAS Data Set


    Analyzing the data available on the web can be a competitive advantage for almost
    any organization. A treasure trove of information about brands, customer preferences,
    stock prices, movie reviews, etc., can be found on the Wide Wide Web. This information
    from the Internet, in combination with internal data, can make your analysis more
    powerful and current. However, the challenging part of the task is to find a way
    to get this data into SAS. This can be easily achieved using a web crawler.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'A web crawler is a sophisticated computer program that crawls the web in a
    methodical and automated manner. Web crawling is used for various purposes by
    organizations. Internet search engines use crawlers to index web pages and stay
    current. Others use crawlers for automating maintenance tasks on websites. The
    web crawling process starts with a list of starting URLs or seed pages. The pages
    identified with these URLs are downloaded and any hyperlinks on these pages are
    extracted for further downloading.


    A web crawler undertakes the following four tasks:


    +   1. Starts with an URL from candidate URLs.

    2. Downloads the associated web pages.

    3. Extracts any hyperlinks on these web pages.

    4. Updates the candidate list with these hyperlinks for further downloading.


    There are different methods available in SAS to use the web crawler functionality.
    You can write a simple DATA program or use the Text Import node in SAS Enterprise
    Miner. SAS Crawler is a sophisticated tool with advanced web crawler capabilities
    discussed in Chapter 2. In this chapter, you will see how you can use the Text
    Import node for downloading web pages and creating DATA sets for text mining.
    SAS Crawler enables you to download different types of files such as HTML, PDF,
    PPT, DOC, etc., from the web which text can be extracted.


    For example, we show how to download the web pages from the website www.allanalytics.com.
    This website is a great resource for analytics professionals. It brings together
    professionals, researchers, and students working in the field of analytics to
    share their experiences and know-how on business intelligence, advanced analytics,
    and data management. This website is a good start if you want to understand the
    latest happenings in the recent past. However, numerous blogs and message boards
    on this website make it tough to read each page. An easy solution is to download
    the web pages and perform text mining to see what different topics were discussed
    and what was the trend for these topics.


    The Text Import node properties that need to be set for web crawling are shown
    in Display 3.18. Similar to importing PDF files (as seen in an earlier section),
    you need two folders, a Source folder for storing the downloaded HTML pages, and
    a Destination folder for storing the textual extracts. The paths to these two
    folders are set as property values for the Import File directory and the Destination
    directory.


    Import File Directory: C:\TextImport\Source

    Destination Directory: C:\TextImport\Destination'
  merge: -1
