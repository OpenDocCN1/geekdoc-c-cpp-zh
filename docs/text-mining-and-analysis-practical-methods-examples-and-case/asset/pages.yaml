    The CLASSIFIER definition is similar to the classifier concept definition that
    we discussed earlier. If word or phrase matches in a document. LITI definitions
    provide additional features such as coreferencing, XML field-specific matching,
    and exporting markets to other concepts. The basic structure of a CLASSIFIER LITI
    definition is


    CLASSIFIER:match_string_literal<return_string>. (See Display 7.22.)


