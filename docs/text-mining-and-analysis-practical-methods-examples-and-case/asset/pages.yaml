    # Data Types, Roles, and Levels in SAS Text Miner


    SAS Text Miner is a set of tools that allows you to collect textual data and analyze
    the data to extract information. In addition, because you can embed the SAS Text
    Miner node in a SAS Enterprise Miner process flow diagram, you can combine quantitative
    variables with unstructured text in the mining process. As a result, you are incorporating
    text mining with traditional data mining techniques. Therefore, data types in
    SAS Text Miner accommodate both structured (numeric) and unstructured (textual)
    data.


    Data roles are typically different based on data types. For unstructured (textual)
    data that you want to analyze, the role is usually set to Text and the measurement
    level to Nominal. For numeric data, there are many options depending on your analysis
    objectives. For example, you can set the role of a numeric variable to ID when
    you want to use that numeric variable to reflect the unique identification number
    for each value in the text data. You can set the role of a numeric variable to
    Time ID when you want to use that numeric variable to reflect the time stamp associated
    with each value in the text data. You can set the role of a numeric variable to
    Input when you want to use that variable as an input variable in any subsequent
    nodes. For example, if you created a flag variable to indicate the presence or
    absence of a graphics for each value in your text, and you want to use this flag
    variable in subsequent analysis, then you can assign the flag variable a role
    of numeric to


    85'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'variable to Target when you want to use that variable as a target variable
    in any subsequent modeling nodes such as Regression. For example, if you have
    a numeric variable positive, negative, or neutral sentiments expressed in text
    data, and you want to predict this sentiment variable using the text data, you
    can assign the sentiment variable a role of Target. For other data roles available
    for numeric data, see the online Help for SAS Enterprise Miner.


    For numeric data, there are five possible measurement levels, depending on the
    measurement scale used in creating or collecting the data. The level Unary is
    used when a variable has the same value for every observation in the data set.
    The level Binary is used when a categorical variable has two distinct values.
    The level Nominal is used when a categorical variable has three or more values
    and the measurement property reflects the observations with different values simply
    represent different categories. The level Ordinal is used when a categorical variable
    has three or more values and the measurement property of the attribute reflects
    different values present a natural ordering, but on which arithmetic-like operations
    can be performed. The level Interval is used when the variable has many numeric
    values and the measurement property of the attribute reflects meaningful and equal
    intervals in the scale.


    # Creating a Data Source in SAS Enterprise Miner


