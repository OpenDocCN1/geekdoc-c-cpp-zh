    The data is first parsed and then fed to the text filter node. The text filter
    node is then fed to the text topic node, which generates 25 multi-term topics
    by default (as shown in Display C6.4 and Display C6.6). Given the small data size,
    25 topics are deemed too many. Also, these 25 multi-terms have redundant themes.
    By changing “Number of Multi-term topics” in the property panel in a trial-and-error
    method, only 13 multi-term topics were retained for custom text topic node which
    uses the negative comments as input (as shown in Display C6.7) which uses the
    positive comments as input. In this data, the numbers of topics for complaints
    outperform the topics for appreciation, which is consistent with prior consumer
    research findings (conducted with the help of an external research agency) that
    people are more likely to complain than compliment. Note that in this case, you
    are configuring the text topic node to pick the number of topics and use appropriate
    terms to describe those topics. However, it is also possible to specify custom
    topics using user defined terms via the ‘user topics’ functionality.


    **Display C6.4. Text topic node results from positive comments with default settings'
