  md: '# Introduction


    Across industries, text analytics is opening the door for new, innovative ways
    to understand behavior, motives, interests, and trends buried within rich textual
    data. In most instances, this type of data is most advantageous when it is paired
    with structured data, such as demographic or transactional data, to enhance your
    view of the customer or party of interest. Text analytics is used across industries
    and can be applied to a variety of data such survey responses, call center notes,
    emails or chat messages, social media, news posts, forums, blogs, a document collection,
    warranty claims, and many more. This is why it is critical for an organization
    to take advantage of text analytics tools to extract relevant, insightful information
    from this type of data.


    In the world of fraud and criminal activity, investigators benefit from having
    as much as information as they can in order to solve the puzzle. But there are
    really two fundamental problems with this. First, they only have so much time
    in the day to review the information, having the right tools to analyze and sort
    through the volumes of data in the least amount of time is essential. Second,
    most of this information is in the form of documents, emails, and other textual
    formats.


    The Enron Corporation was an American energy, commodities, and services company
    based in Houston, Texas. In 2001, it filed for bankruptcy. Before Enron’s bankruptcy
    filing, Enron employed 20,000 staff. It was one of the world’s leading electricity,
    natural gas, communications, and pulp paper companies, with claimed revenues of
    $101 million in 2000. Later, it was discovered that many of Enron’s recorded assets
    and profits were inflated, or even wholly fraudulent and dishonest. For example,
    in 1999, Enron promised to pay a Merrill Lynch investment with interest in order
    to show a profit on its books. Debts and losses were placed in offshore accounts
    that were not included in the firm’s financial statements. More sophisticated
    and mysterious transactions between Enron and related companies were used to take
    unprofitable entities off the company’s financial records. “offshore” entities
    were limited partnerships between Enron and LJM Cayman LP and LJM2 Co-Investment
    LP, to create Enron’s poorly performing stocks to improve its financial statements.
    These two partnerships received funding of approximately $390 million from a group
    of investors. Enron created it called “Raptors” and transferred more than $1.2
    billion in assets to Raptor accounts, including millions of shares of Enron common
    stock, long-term rights to purchase millions shares, plus $150 million of Enron
    notes payable. It capitalized the Raptors and booked the notes payable issued
    on its balance sheet while increasing the shareholders’ equity for the same amount.'
  merge: -1
