  md: '# Managing Text Using Perl Regular Expressions


    SAS character functions lack flexibility and tend to be not very effective with
    dynamic text. In situations like these, regular expressions and routines give
    the programmer the power to define, locate, and extract patterns from highly unstructured
    text. They can make a complicated string manipulation task very simple by combining
    most of the steps, if not all, into one expression.


    SAS provides two types of regular expressions for pattern-matching: SAS regular
    expressions (the RX functions) and Perl regular expressions (the PRX functions).
    Regular expressions are popularly used to easily process large amounts of textual
    data. These expressions help in defining patterns that can be searched and extracted
    in a character string. Regular expressions are nothing but a string of standard
    characters and special characters, called metacharacters, which tell the program
    what type of patterns to find in the text. It is strongly suggested to comment
    any regular expression that you write because it is highly possible that it will
    be very difficult to interpret the ones you wrote yourself.


    Perl is a powerful text processing language widely amongst programmers. In this
    chapter, we briefly discuss how Perl regular expressions can be used for effectively
    preprocessing the data. A modified version of Perl regular expressions is implemented
    in SAS via a set of functions called PRX functions. Only Perl regular expressions
    are available in SAS, not the entire Perl language. You do not need to be an advanced
    SAS programmer to write Perl expressions. Basic knowledge of DATA step programming
    is sufficient. The examples discussed in the following sections can be easily
    modified to meet your requirements.


    # Using Perl Regular Expressions to Match Text in a Document


    The simplest use of Perl regular expressions is to locate a piece of text or a
    pattern in a textual document. You can write a regular expression to check whether
    a document contains text in the form (XXX) XXX – XXXX, indicating a phone number.
    Here, Xs are digits. You can use a regular expression to search for specific characters
    and other classes of characters (digits, letters, non-digits, etc.).


    Perl helps in defining and extracting common patterns in text like phone number


    Consider the corpus of web pages downloaded from the allanalytics.com'
