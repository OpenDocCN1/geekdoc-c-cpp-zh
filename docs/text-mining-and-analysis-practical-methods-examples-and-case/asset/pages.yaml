  md: '```

    data bigdata;

    set bigdata;

    if_N_=1 then pattern= PRXPARSE("s/[Bb]ig(|)??[Dd]ata / Big Data /i");

    retain pattern;

    call PRXCHANGE(pattern, -1, text);

    drop pattern;

    run;

    ```


    PRXCHANGE function is used to substitute one string for another. The function
    takes the return code from PRXPARSE as the first argument. The second argument
    is used to identify the number of times to search for and replace a. A value of
    -1 replaces all matches. The third argument is the string to be replaced. We have
    explained only the required arguments of the function in this example. For more
    information about this function, see the online SAS Help.

    The substitution approach can be heavily used for cleaning the data. If you can
    define the pattern of noise in the data to the best extent possible, you can create
    regular expressions and replace the matches with a blank space. This helps in
    generating cleaner data for further text mining.


