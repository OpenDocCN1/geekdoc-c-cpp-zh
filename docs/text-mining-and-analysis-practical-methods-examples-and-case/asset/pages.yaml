  md: '# Summary


    In this case study you applied text mining to figure out trends in research topics
    related to various industries in SAS/SUGI conference papers. This case study is
    intended to showcase the capabilities in SAS Text Miner to track trends of topics
    in text corpus from different periods of time. The concept links feature of SAS
    Text Miner is a great tool to discover the context in which a particular term/topic
    is frequently used. Generating a synonym list on the go makes the text mining
    analysis more objective. This analysis can be easily extended to find trends in
    research topics related to different methods or technology. A similar approach
    can also be used to analyze the many conference proceedings corpus that is available
    with various organizations across the globe.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Instructions for Accessing the Case Study Project


    Along with this book we provide you with both the data used and the SAS Enterprise
    Miner project created for this case study. The case study includes most of the
    steps performed in this analysis. However, it is highly impossible to include
    every single operation performed in text filtering stage. If you start with the
    data and follow the steps in the case study your results may not match the ones
    in the case study. Nevertheless, you can use the project to view the exact results
    presented in the case study. The following instructions will guide you on how
    to access the project.


    +   1. In the data provided with this book go to the folder Case Studies ► Case
    Study 1. You will find all the data sources needed for this case study and a folder
    SASGF_Case. The folder is the SAS Enterprise Miner project.

    2. Open SAS Enterprise Miner and click New Project.

    3. As shown below enter project name as SASGF_Case and enter the path to the folder
    and Click Next


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_291_0.png)


    4. You will see the below prompt window. Click Yes.

    If you do not see this prompt, then you may have used a different name/path and
    then this project may not work correctly.


