  md: '# Display 7.1: Screenshot of a SAS Global Forum Paper Abstract


    Business users rely on email for communication and collaborative decision making.
    Have you ever wondered if you could use your Microsoft Outlook environment beyond
    a simple communication tool and get value that keeps you more informed about your
    business? The integration of SAS into Microsoft Outlook provides a new outlook
    into your business. This integration of SAS provides informed decision making
    by giving business users intuitive access to reports, stored processes, and dashboards.
    Business users stay online while performing daily tasks. This paper highlights
