  md: '# Enhancing Predictive Models Using Exploratory Text Mining


    Although text mining customer responses can reveal valuable insights about a customer,
    plugging the results from text mining into a typical data mining model can often
    significantly improve the predictive power of the model. Organizations often want
    to use customer responses captured in the form of text via e-mails, customer survey
    questionnaires, and feedback on websites for building better predictive models.
    One way of doing this is to first apply text mining to reveal groups (or clusters)
    of customers with similar responses or feedback. Reveal this cluster membership
    information about each customer can be used as an input variable to augment the
    data mining model. With this additional information, the accuracy of a predictive
    model can improve significantly.


    For example, a large hospital conducted a post-treatment survey to identify the
    factors that influence a patient''s likelihood to recommend the hospital. By using
    the text mining results from the survey, the hospital was able to identify factors
    that showed an impact on patient satisfaction, which was not measured directly
    through the survey questions. Researchers observed a strong correlation between
    the theme of the cluster and the ratings given by the patient for the likelihood
    for the patient to recommend the hospital.


    In a similar exercise, a large travel stop company observed significant improvement
    in predicting models by using customers'' textual responses and numerical responses
    from a survey. Display 1.9 shows an example receiver operating characteristic
    (ROC) curve of the models with and without textual comments. The ROC curve shows
    the performance of a binary classification model. The larger the area under the
    curve (green), the better the model performance. The square-dashed curve (green),
    which is an effect of including results from textual responses, has a larger area
    under the curve compared to the long-dashed-dotted curve (red), which represents
    the model with numerical inputs alone.


    # Display 1.9: ROC Chart of Models With and Without Textual Comments'
