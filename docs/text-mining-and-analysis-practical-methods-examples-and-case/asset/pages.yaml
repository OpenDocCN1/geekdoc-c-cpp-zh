    Clearly, there are certain words that occur in all four decades, like system,
    information, paper, present, program, time, user and process. In fact we exclude
    all these terms from analysis since these are the common terms that can be easily
    expected to process in SAS proceedings. Terms like these do not help in trend
    detection. However, you will find terms like application, process, and code occurring
    in all the decades except 1970s. This shows that not a lot of oriented papers
    were published in 1970, rather the papers were more about explaining techniques
    available in SAS as at that time.


    Another way to identify important terms in the text corpus is by looking at the
    important terms identified by the term weighting methods. In this case we used
    default sets for term weighting methods. It is always recommended to try different
    settings and explore the results. With default settings, the important terms for
    four decades are identified as shown below. You can find these in the text filter
    node results. Just sort the terms by weight. Clearly, you will see a completely
    different set of terms identified as across the four data sets. The weight is
    calculated using the (default) technique when using document frequency along with
    the overall frequency of the terms.'
