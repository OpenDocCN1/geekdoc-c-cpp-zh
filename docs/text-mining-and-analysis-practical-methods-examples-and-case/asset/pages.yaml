    The entire process of taxonomy generation and deployment in real time is shown
    in Display 7.2.


    # Display 7.2: High-Level Process Flow Diagram for Using SAS Content Categorization
    Studio and SAS Content Categorization Server


    ![](img/2c338747b5eaca8c1cd68dcd87c24126_208_0.png)


    The developed taxonomy can be tested against a set of sample documents preclassified
    by category to verify the accuracy of classification. Taxonomy can be modified
    and tested iteratively until the appropriate accuracy is achieved. Model accuracy
    is generally assessed by the means of two measures, recall and precision. In a
    given category, recall indicates the percentage of documents that are correctly
    classified. Precision indicates the percentage of documents that are correctly
    classified out of all documents. However, these two measures often affect one
    another, making it difficult to assess model performance. A third measure, traditionally
    known as F-measure (or F-score), can be used to test model accuracy. F-measure
    is the harmonic mean of precision and recall. It can be calculated using'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'the following formula:


    F-measure = 2 * (p * r)/(p + r) (Equation 7.1)


    In this formula, $p$ and $r$ are the precision and recall measures of the model.
    The value of an F-measure ranges between 0 and 1. A higher value of the F-measure
    indicates a better classification model.


    For the purpose of testing category and concept rules, you should collect a significant
    number of documents (around 10 to 20) representing each category in the taxonomy.
    It is important to include documents that shouldn''t match a category. This helps
    the taxonomist to efficiently write rules so that documents belonging to one category
    are less likely to be assigned to another category. For example, documents containing
    the word "plant" in the context of industrial equipment shouldn''t be matched
    with the term "neem plant," which is a botanical term.


    Once the taxonomy is finalized, you can generate the compiled files representing
    the rules of the categories (.mco) and concepts (.concepts). These files are used
    in SAS Content Categorization Server to automatically apply rules to documents
    feeding from various data sources in real time. The output of this process is
    metadata information, such as document category and the facts found in the document.
    SAS Content Categorization supports approximately 30 international languages and
    many document formats such as HTML, HTM, plain text, XML, RTF, SGML, and XLS.
    SAS Content Categorization Studio does not support PDF documents or the Microsoft
    Word format. Hence, you need to convert them to plain text documents using SAS
    Document Conversion. SAS Content Categorization Studio does not recognize SAS
    data sets as a data source (unlike SAS Text Miner). Hence, you should use raw
    rules in recognizable file formats to train and test the models built using SAS
    Content Categorization Studio.


    # Types of Taxonomy


    Taxonomy can be simple or complex and flat or hierarchical in its structure. In
    a flat taxonomy, all categories are at the same level in the taxonomy and there
    are no children or subcategories for any category. For example, the taxonomy in
    Display 7.3 represents the structure of various departments within a typical firm.
    All categories appear at the same level, and there are no dependencies—it is a
    flat taxonomy. In the project, you need to add a language such as English, and
    then enable a categorizer to start building the taxonomy.


    # Display 7.3: Example of a Flat Taxonomy'
