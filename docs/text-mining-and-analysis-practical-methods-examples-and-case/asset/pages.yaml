    \ as the default method.\n\n# Display 2.4: Traversing Path of a Web Crawler in\
    \ Depth First Mode\n\n```\n[Depth-1] Page 1$\rightarrow$[Depth-2] Pages 3 through\
    \ 5$\rightarrow$[Depth-3] Pages 8 through 12$\rightarrow......till the end\n[Depth-1]\
    \ Page 2$\rightarrow$[Depth-2] Pages 6 through 7$\rightarrow$[Depth-5] Pages 13\
    \ through 17$\rightarrow......till the end\n```\n\nThough crawlers are also known\
