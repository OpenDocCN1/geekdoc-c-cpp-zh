  md: '# Component Servers of SAS Search and Indexing


    SAS Search and Indexing components fit into the overall architecture of the SAS
    Information Retrieval Studio framework.


    # Indexing Server


    Index (as the term suggests) is similar to the index provided at the end of a
    book. The index in book acts as a quick reference of all of the terms and points
    to the specific pages of the book in which they are found. Similarly, an index
    built in SAS Information Retrieval Studio is based on the data in the incoming
    documents from the pipeline server and the index helps quickly retrieve documents
    in which terms entered in the search query are found. This component in SAS Information
    Retrieval Studio helps build an index of the incoming documents to help in the
    search and retrieval process. You might opt out of indexing if the documents collected
    by the crawlers are immediately sent to other SAS applications.


    A document in the indexing server is in the field-value pair format. When documents
    in the pipeline server starting flow into the indexing server, fields are populated
    by matching similarly named fields. Though all three crawlers run simultaneously,
    passing documents to the indexing server via the pipeline server, it is possible
    to build only one index at a time. However, you can build indexes on various fields
    of the document. You might assign various predesigned functionalities to these
    fields to ensure that they are included in the search and query process. Choosing
    a specific functionality for a field controls the limitations for the types of
    queries that you can perform.


    Another component in SAS Information Retrieval Studio, the query server, assists
    in returning the relevant information by executing user queries on indexed documents.
    You might perform customized searches via a user search interface that runs on
    a query web server. You might perform searches using either a term or a combination
    of terms. An intuitive search is possible if you assign the required fields with
    the functionality label. By default, English is the language used in building
    indexes. Regardless of the language selection, documents in any language are indexed;
    indexes are optimized for the language selected.


    You should pay careful attention when building indexes because they are impacted
    by other components. Here are some of the caveats to consider whenever the indexing
    server is functional:


    +   - The same documents are gathered by the crawlers when they are started, stopped,
    and restarted. Thus, duplicate documents might flow into the'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'indexing server via the pipeline server. Each document indexed by the indexing
    server must have a unique identification field (ID), such as the URL of a web
    page. If two documents with the same ID are pushed to the indexing server, the
    document that comes in last overwrites the document that came in first, ensuring
    that only one copy of a unique document resides in the index.


    +   - Whenever document processors in the pipeline server are modified when the
    indexing server is running, be free to click Apply Changes located in the top
    pane.


    +   - When configuration properties of the indexing server are modified, it does
    not change the existing index, but it does affect the next index build. You can
    perform either of the following options to remedy this situation:


    +   - Delete the current index to allow the indexing server to build a new index
    with the modified properties whenever the crawlers are restarted.


    +   - Apply Changes while the indexing server is still running. This deletes the
    current index and restarts the indexing server to build a new index.


    # Query Server


    A query server takes the search query issued by the user, runs it against the
    document index server, and returns the matching documents as search results back
    to the user. You can execute these search queries using a query API in a custom-built
    program and pass the search queries to the query server. You also have the option
    to perform these search queries and review results in an interactive query interface.
    This web application runs on another component of SAS Information Retrieval Studio
    called the query server. Another component of SAS Information Retrieval Studio
    can be used to monitor, measure, and analyze query metrics periodically such as
    the frequency of searches and hit rate. By default, the query server is running
    behind the scenes all the time. Unlike other components of SAS Information Retrieval
    Studio, there are no configurable settings on this server that a user can modify.


    # Query Web Server


    The query web server lets you configure how the search results returned to the
    user should be displayed in the query interface. It helps you specify how documents
    should be matched against the search queries and sort results. It enables you
    to format labels, matched documents, and the theme of the search interface.


    There are primarily two types of searches possible on the indexed documents in
    SAS Information Retrieval Studio:'
