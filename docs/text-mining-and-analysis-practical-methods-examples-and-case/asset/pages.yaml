  md: '# Information Retrieval


    Information retrieval, commonly known as IR, is the study of searching and retrieving
    a subset of documents from a universe of document collections in response to a
    search query. The documents are often unstructured in nature and contain vast
    amounts of textual data. The documents retrieved should be relevant to the information
    needs of the user who performed the search query. Several applications of the
    IR process have evolved in the past decade. One of the most ubiquitously known
    is searching for information on the World Wide Web. There are many search engines
    such as Google, Bing, and Yahoo facilitating this process using a variety of advanced
    methods.


    Most of the online digital libraries enables users to search through their catalogs
    based on IR techniques. Many organizations enhance their websites with search
    capabilities to find documents, articles, and files of interest using keywords
    in the search queries. For example, the United States Patent and Trademark Office
    provides several ways of searching its database of patents and trademarks that
    it has made available to the public. In general, an IR system''s efficiency lies
    in its ability to match a user''s query with the most relevant documents in a
    corpus. To make the IR process more efficient, documents are required to be organized,
    metadata based on the original content of the documents. SAS Crawler is capable
    of pulling information from a wide variety of data sources. Documents are then
    processed by parsers to create various fields such as title, ID, URL, etc., which
    form the metadata of the documents. (See Display 1.4.) SAS Search and Indexing
    enables you to build indexes from these documents. Users can submit search queries
    on the indexes to retrieve information most relevant to the query terms. The metadata
    fields generated by the parsers can be used in the indexes to enable various types
    of functionality for querying.


    # Display 1.4: Overview of the IR Process with SAS Search and Indexing'
