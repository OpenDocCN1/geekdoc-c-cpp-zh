  merge: -1
  pgno: 57
- img_proc: true
  md: 'migrate from one physical location to another. Unlike other categories of software
    programs such as viruses, crawlers do not spread across networks, but reside and
    run on one. A web crawler does nothing but automatically follow links, send page
    requests, and fetch required information on machines over the Internet through
    a standard HTTP protocol.


    SAS Web Crawler has many configurable settings and features that are covered in
    great detail in SAS Information Retrieval Studio: Administration Guide. We discuss
    some of the key features when we walk you through a step-by-step demonstration
    on how to conduct web crawling toward this end.


    # Web Crawling: Real-World Applications and Examples


    There are many real-world applications of using a web crawler. Almost all search
    engines such as Google, Bing, etc., use crawlers to gather documents for building
    large indexes. Whenever a user submits a query to these search engines, the indexes
    are used to locate web pages with related information, and they are returned as
    a result of the search query. McCallum et al. used crawlers and built portals
    that were repositories of indexed research papers related to computer science.
    Site maps in a graphical layout can be developed by initiating a web crawl from
    the seed page going in the first mode, and connecting the related pages.


    Lieberman et al. developed a browsing agent, which monitors the real-time browsing
    patterns of users, understands which links the user is spending time with, and
    tries to suggest more links that might be suitable for the user''s interests and
    needs.


    The most prominent application of web crawling adapted by many companies in the
    contemporary business world is to crawl the competitors'' websites to collect
    information about their new products, future plans, investment strategies, etc.
    In the field of biomedical studies, researchers are often required to access huge
    volumes of literary content about genes. They deploy web crawling to gather gene-related
    information from various sources on the web. On a downside, a popular but rather
    litigious application of using web crawling is to extract the email addresses
    of individuals from various websites and spam their inboxes with phishing e-mails.
    Through phishing, hackers can gain access to individual passwords, credit card
    information, or personally identifiable data.


    # File Crawler


    A file crawler searches the files or documents located physically on local disk
    storage or on a shared network. It then downloads these files to send them to
    the pipeline server for processing. The file crawler can grab content'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'contained in document types such as PDF, HTML, Microsoft Word, XML, text files,
    etc. A document conversion process can be used to convert the data from these
    formats into raw text files. Remember to select Yes for the Encapsulate XML Files
    if you are crawling HTML or XML files and to include a markup_matcher document
    processor in the pipeline server for normalizing the text in the files.


    # Feed Crawler


    A feed crawler gathers information like news updates, weather updates, press releases,
    blog entries, etc., that are distributed on web feeds. It can gather either full
    text or a summary of the information. A feed crawler always pulls data from the
    web links found within the feeds, whereas a web crawler typically grabs content
    off standard web pages. Feeds are generally embedded as hyperlinks within web
    pages and sometimes users can confuse them with web pages. In the following subsections,
    we attempt to explain a feed, commonly used feed types in the industry, and a
    way to identify or distinguish them from web pages.


    # What Is a Feed?


    A feed can be technically described as a mechanism to publish frequently updated
    information about websites. Feeds (also term feeds) are simply formatted documents
    on the web (often built in an XML file format) containing web links redirecting
    to the information sources that are added at regular time periods. A software
    program called a feed reader (also called an aggregator) is required to read and
    pull information from these web feeds whenever they are updated with new information.
    A user can subscribe to a feed and monitor its updates from a web browser. Many
    browsers such as Internet Explorer and Google Chrome have built-in feed readers,
    which check the registered feeds for new posts and avoid the task of manually
    visiting all of the interested sites for information. SAS Feed Crawler in SAS
    Information Retrieval Studio performs the job of a feed reader and can be configured
    based on the user needs.


    # Types of Feeds


    Primarily, there are two types of feeds based on their format and structure—RSS
    and Atom. RSS stands for RDF Site Summary and is nicknamed Really Simple Syndication.
    The SAS Information Retrieval Studio feed reader is capable of reading content
    from both RSS and Atom feeds. Feeds can be classified depending on the content.
    Full content and summary only are the two major categories of feeds. Full content
    (as the name implies) refers to feeds that contain all of the information that
    is needed. Summary-only feeds contain only a short summary of the actual content.
    You need to click on the link within the feed'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'and navigate to the original web page where full information is available.


    # How to Identify Feeds?


    Generally, feeds are found in the websites with an icon next to the URL pointing
    to them. Remember, feeds are not web pages. Exercise caution and check whether
    the URL you provide in the tail is, indeed a feed URL or a web page. For example,
    the web page http://www.sas.com/rss provides a comprehensive list of all RSS feeds
    and their links. (See Display 2.5.)


