- img_proc: true
  md: '# Introduction


    Sentiment analysis, (also called sentiment or opinion mining), is a popular technique
    for summarizing and analyzing consumers'' textual reviews about products and services.
    Feature-based sentiment analysis is used to reveal customers'' sentiments not
    just at the overall product/brand level but also at the product/service specific
    feature level. There are two major approaches for performing sentiment analysis
    in SAS* Sentiment Analysis Studio: Statistical model-based approaches and Natural
    Language Processing (NLP) based approaches. In this case study we demonstrate
    both of these approaches.


    With the rapid evolution and growth of mobile devices, mobile products and services
    have become “must haves” in our lives. Every day new mobile products and services,
    often with different features or attributes, are entering the market. Consumers
    often write online reviews of these products and services and make comments not
    just about their overall sentiment about products and services but also about
    which feature or attribute of each product/service they like or dislike. In this
    case study, we use both SAS* Text Miner and SAS* Sentiment Analysis Studio to
    perform mining. For this purpose, we use artificial data created based on actual
    online customer reviews of apps for mobile devices.


    # Data


    We modified and anonymized six hundred actual customer reviews posted online and
    created an artificial data set. Five hundred of these reviews are used for building
    models


    Text Mining data sets:


    +   - Negative reviews: APP_TM\model\APP_neg.sas7bdat

    - Positive reviews: APP_TM\model\APP_pos.sas7bdat


    Sentiment Mining Model Data Folders:'
  merge: -1
  pgno: 312
- img_proc: true
  md: '• Negative reviews in folder: APP\APP_SM\model\neg

    • Positive reviews in folder: APP\APP_SM\model\pos


