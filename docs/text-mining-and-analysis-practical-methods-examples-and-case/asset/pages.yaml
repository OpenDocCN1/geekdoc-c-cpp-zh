- img_proc: true
  md: '# CONCEPT Definition


    A CONCEPT definition in LITI provides the combined capabilities of classifier
    and grammar extraction features. The CONCEPT definition enables you to reference
    concepts within other concepts and provide priorities in the case of overlapping
    concept matches. Overlapping matches are possible when the terms or phrases in
    a document are matched with definitions in more than one concept. For example,
    “Columbus” could be a reference to Christopher Columbus, the European explorer
    and navigator who sailed to America in the fifteenth century. However, it could
    also be a reference to one of many cities in the United States with the same name
    (for example, Columbus in the state of Ohio). There can be scenarios where references
    to Columbus, the city, and Columbus, the person, coexist in a single document.
    In this case, you might need to give priority to concept matches whenever there
    is an overlap. To deal with this case, you can create concepts like the following:


    # PERSON


    +   CLASSIFIER:[coref=he,His]:Columbus

    CONCEPT:PRIORITY=20:Christopher Columbus

    CONCEPT:PRIORITY=20:Columbus’s :V

    CONCEPT:PRIORITY=20:Columbus’s :Npl


    # CITY


    +   CONCEPT:StatesShrt

    CONCEPT:PRIORITY=20:Columbus, StateShrt

    CONCEPT:PRIORITY=20:city of Columbus

    CONCEPT:PRIORITY=20:Columbus city

    CONCEPT:PRIORITY=20:Columbus in States

    CONCEPT:PRIORITY=20:Columbus, States


    # States


    +   CLASSIFIER:Ohio

    CLASSIFIER:Georgia

    CLASSIFIER:Arizona

    CLASSIFIER:Mississippi

    CLASSIFIER:Montana

    CLASSIFIER:Michigan

    CLASSIFIER:Kansas'
  merge: -1
