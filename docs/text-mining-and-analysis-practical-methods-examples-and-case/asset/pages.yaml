  md: '# Summary


    +   • SAS® Text Miner and SAS® Enterprise Content Categorization Studio can be
    used to complement each other''s unique linguistic capabilities of the purpose
    of exploring, analyzing, and extracting valuable information from textual data.


    +   • The spell check feature in the text filter node can be utilized to provide
    the preliminary synonyms list for parsing the content and stemming stems. By following
    this method, you can significantly reduce the time required to verify misspelled
    words and accurately generate the term-by-document frequency occurrence matrix
    which is critical for deriving text topics.


    +   • The Interactive filter viewer in the text filter node helps you to identify
    the most important terms in a document corpus without spending significant effort.
    Important terms are retained and unimportant terms are dropped automatically based
    on their frequency of occurrence both within a document and the entire corpus.


    +   • The Text topic node automatically generates the key terms/themes that are
    significant in defining the document collection at a very high level. These results
    can help you understand different areas of causes/concerns in the data without
    digging through each document. They are also pivotal in helping you build the
    taxonomy to classify the document collection based on type of injury/cause of
    injury.


    +   • Content Categorizer in SAS® Enterprise Content Categorization Studio provides
    an easy-to-use graphical interface to quickly build a Boolean rule based model
    to identify and classify documents in various categories and sub-categories. The
    point and click feature helps you to avoid writing those rules in the syntax that
    the tool understands.'
