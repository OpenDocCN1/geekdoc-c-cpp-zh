    When you use the interactive filter viewer, you can save your changes, and the
    modified data is used in further analysis. An easy way to identify low-frequency
    words is by using the Minimum Number of Documents property setting. To exclude
    all of the terms that occur in less than 10 documents, enter a value of 10 for
    this property. The other property that can be used to control the number of terms
    is Maximum Number of Terms. Using this, you can set a maximum limit on the total
    number of terms that are kept in the analysis based on their frequency. These
    different types of filtering properties come in very handy in reducing the noise
    from the data.


    # Document Search and Retrieval


    In many situations when refining the terms and making a decision to include or'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'exclude term, you might want to quickly see the documents that contain that
    term. The interactive viewer contains a feature to search for documents in the
    corpus based on search expressions. A search expression can be a single term or
    a list of terms. Documents that match at least one of the terms are returned.
    The search results contain a relevance score for each document that indicates
    how well each document matches the search expression.


    The matching documents are retrieved using the vector space model, which is the
    fundamental technique used in many information retrieval operations. In this model,
    all documents and search expressions are represented as vectors in the term space.
    The vector components are defined by the term weights given to the terms in the
    document. A similarity measure between two documents, $d1$ and $d2$, is calculated
    using the dot product (or cosine similarity) of the two vectors, $V1$ and $V2$.


    $similarity (d1, d2) = \frac{V_1 \cdot V_2}{|V_1| |V_2|} \quad \text{(Equation
    5.6)}$


    The numerator in the equation represents the dot product between the two vectors.
    The denominator accounts for the various sizes of the documents by considering
    the Euclidean length of the document defined as the following:


    $|V_l| = \sqrt{V_l^2}$


    Consider the following unit vector:


    $v_i = \frac{V_l}{|V_l|}$


    Equation 5.6 can be rewritten as the following:


    $similarity (d1, d2) = v_1 \cdot v_2 \quad \text{(Equation 5.7)}$


    The search expression, in itself, is considered a short document. Term weights
    are calculated (also known as tf-idf weights) treating the search expression as
    a whole corpus. The tf-idf weight is the multiplication of term frequency and
    inverse document frequency. It has the following characteristics:


    +   1. The value of tf-idf is highest when the term occurs many times within a
    fewer number of documents (i.e., higher discriminatory ability).

    2. The value of tf-idf is lowest when the term occurs in almost all documents
    (i.e., lower discriminatory ability).'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Consider an example corpus with just two documents.


    Document 1: A vector space model uses a dot product to calculate similarity. This
    model defines vectors in the term space.


    Document 2: A giant model of a spacecraft is being built for a movie based on
    space.


    Consider the search expression (or query) "vector space model" used to retrieve
    matching documents from the corpus. Inverse document frequency is used as the
    technique to calculate term weights in the corpus. Sample weights for the terms
    in the query are calculated using frequency. Table 5.3 shows the common words
    and one non-common word, "movie," between the query and the documents.


    # Table 5.3: Weights for Words in the Sample Documents and Search Expression


    | Term Search | Document 1 | Document 2 |

    | --- | --- | --- | --- |

    | Expression | Weight Freq Doc Freq | TF*IDF Doc Freq | TF*IDF |

    | vector | 1 | 0.4 | 2 | 1 | 4 | 0 | 1 | 0 |

    | space | 1 | 0.4 | 2 | 2 | 2 | 2 | 2 | 2 |

    | model | 1 | 0.4 | 2 | 2 | 2 | 2 | 1 | 2 |

    | movie | 0 | 0 | 0 | 1 | 0 | 1 | 1 | 2 |


    Similarity between the search expression (Q) and document 1 (Doc1) is calculated
    using equation 5.7.


    Score (Q, Doc1) = (0.4 x 4) + (0.4 x 2) + (0.4 x 2) + (0 x 0) = 3.2


    Similarly, the score between the search expression and document 2 (Doc2) is calculated.


    Score (Q, Doc2) = (0.4 x 0) + (0.4 x 2) + (0.4 x 1) + (0 x 2) = 1.2


    We can conclude that document 1 is a better match with the query.


    In this example, the inverse document frequency method is used for calculating
    term weights. SAS Text Miner uses a different weighting scheme that is not configurable.
    A relevance measure, between 0 and 1, for every document searched with the search
    expression is calculated. A value of 1 indicates a better match in the collection.


    In the interactive filter viewer, you can enhance the search using the following
    techniques:


    +   - +term returns only documents that include the term.'
