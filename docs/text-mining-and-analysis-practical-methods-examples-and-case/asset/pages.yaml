  md: '# Understanding Core Component Servers


    Now that you understand how the web, file, and feed crawlers can work independently
    to fetch data from various sources, look at the core component servers and their
    functionalities.


    # Proxy Server


    The proxy server acts as an intermediary layer between the crawlers and the pipeline
    server. It receives documents from the crawlers and sends them to the pipeline
    server. The component proxy server that we are referencing should not be confused
    with the more traditional web proxy server. A web proxy server serves as a cache
    of web pages to quickly retrieve the web content when a client residing locally
    requests a web page. The proxy server in SAS Information Retrieval Studio fundamentally
    serves two purposes:


    +   a. Enables you to pause the flow of documents to the pipeline server. When
    paused, the incoming documents from the crawlers are queued until the proxy server
    is resumed. This is useful in situations where the pipeline server or other downstream
    servers require hoc changes (or maintenance work) without having to pause or stop
    the crawlers.

    b. Facilitates the creation of multiple pipeline servers to which copies of documents
    coming in from the crawlers can be sent. Each of these servers runs simultaneously
    on different machines and provides as a backup mechanism in case of emergencies
    such as hardware failure.


    # Pipeline Server


    The pipeline server is a critical component in SAS Information Retrieval Studio
    used to perform actions on the incoming documents from the proxy server based
    on your needs. These actions can be defined by document processors form the core
    components of the pipeline server and solve one or both of the following purposes:


    +   a. Process documents into an appropriate form that is ready to be used by
    other SAS applications such as SAS Text Miner (to analyze trends) or SAS Sentiment
    Analysis Workbench (to analyze sentiment).

    b. Send processed documents to another component of SAS Information Retrieval
    Studio such as an indexer to build indexes for these documents for information
    search and retrieval.


    # Document Processors'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'A document processor can be defined as a functional module designed to operate
    on documents to achieve the right result. The document processor can be used to
    execute simple text normalization tasks such as parsing documents, removing unwanted
    tags (for example, markup tags in HTML documents), modifying fields, exporting
    data in a different format (for example, exporting TXT file as CSV file), converting
    documents (for example, PDF to TXT), etc. Document processors can be used to perform
    tasks involving advanced semantic analysis such as content categorization, concept
    or fact extraction, All of these tasks and a few more can be accomplished using
    the available set of prebuilt document processors provided with SAS Information
    Retrieval Studio. If the tasks involved are more complex, users can build their
    own custom processors.


    Documents fed into the pipeline server go through at least one document processor
    before they are sent to other SAS applications or pushed to the indexing server.
    When more than one processor is required to act on the documents, you should exercise
    caution to ensure that the processors are in the proper order to obtain the right
    results. For example, a web crawler might gather HTML pages and send them to the
    pipeline server via a proxy server. First, these pages should be parsed using
    an appropriate document processor such as parse_html or heuristic_parse_html before
    exporting them to another SAS application. Adding processors in the wrong order
    might yield wrong results or stop the pipeline server in some cases. Each document
    passes through the pipeline server in a field-value pair format. A document can
    have many fields such as filename, body, ID, URL, etc. These fields form the metadata
    of the document, and actual content is assigned to the values for each of these
    fields. These fields can be configured for a prebuilt document processor added
    to the pipeline server based on the requirements of users. Many prebuilt document
    processors are readily available with SAS Information Retrieval Studio to use
    in the pipeline server. Some of these processors are described in this section.


    **document_converter**: Converts documents in sophisticated file formats such
    as PDF and MS Word into plain text documents using the SAS Conversion server.


    **extract_abstract**: Creates an abstract extracting the first 25 to 50 words
    from the body of the incoming document. Useful to create summaries of scientific
    journals, technical papers, etc., where generally the abstract or introduction
    is at the beginning of the document.


    **heuristic_parse_html**: Heuristically determines which sections of an HTML page
    can be ignored and which sections should be used to parse and extract the main
    content.


    **export_to_files**: Creates a copy of the incoming documents into separate files.'
