    # Scoring Category Rules and Concept Definitions


    As you build and test a taxonomy using SAS Content Categorization Studio, it is
    important that the rules defining the taxonomy are applied to all documents in
    the organization. Category rules, concept definitions, and LITI rules are compiled
    to generate binary files (.mco) concept files (.concepts), and LITI files (.li),
    respectively. These files can be uploaded to SAS Content Categorization Server
    to allow for automatic document categorization, concepts, and complex facts extraction
    in real time. SAS Content Categorization Server uses the SAS Conversion Converter
    to convert documents into other file formats such as PDF, XML, HTML, Excel, CSV,
    etc., to plain text files. Using the SAS Content Categorization Server Administration
    Web Page, you can monitor the statistics and matches for categorization rules
    and concept matches. This chapter focuses on building models and not on the scoring
    process. Refer to the SAS Content Categorization Single User Servers 12.1: Administrator’s
    Guide for complete information about how to score documents using SAS Content
    Categorization Server.


    # Automatic Generation of Categorization Rules Using SAS Text Miner


    Earlier in this chapter, we mentioned how precisely written Boolean rules in a
    rule-based categorizer can be very efficient in the categorization process. However,
    this is possible only if the analyst working on building the taxonomy has significant
    knowledge about the document content. It would be a great benefit for the analyst
    to have basic blocks for each category instead of writing them from the scratch.
    Starting in version 12.1, SAS Text Miner offers a'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'new feature called the Text Rule Builder that can be used to generate Boolean
    rules using important terms in the data to predict the categories. A sufficient
    set of documents separated by category is required in a SAS data set to train
    the model. To train the model, assign the role Target to the variable containing
    the pre-identified categories, and assign the role Text to the variable holding
    the content of the documents. The trained model generates Boolean expressions
    that represent one or more terms occurring in the presence or absence of one or
    more terms using the Boolean operators AND, OR, and NOT. These expressions are
    in the same syntax as the code used in SAS Content Categorization Studio to define
    categories. Thus, the rules generated by SAS Text Miner can be exported to SAS
    Content Categorization Studio as preliminary definitions for the Boolean-based
    categorizer. They can be subsequently modified to achieve the appropriate level
    of accuracy and precision. Users can choose to modify the values of the target
    category required to assist the model training process and achieve better accuracy.
    The important value added by this feature is its ability to show the terms explaining
    the reason why a document, based on its content, falls into a category.


