  md: '# Summary


    +   - SAS® Content Categorization Studio is an easy-to-use point and click interface
    used in quickly building models for automatic text categorization process.

    - Statistical categorizer utilizes a set of documents from each category in the
    taxonomy to train the model. However, in terms of model performance statistical
    categorizer often performs below par.

    - Boolean rule-based categorizer works well when the rule terms and Boolean operators
    are carefully chosen to categorize documents. You can iteratively build the model
    while testing the rules on a set of documents. It has an additional advantage
    that you don''t need a separate set of documents to train the model.

    - The Text rule builder node in SAS® Text Miner is a powerful feature useful to
    generate preliminary Boolean rule expressions that can be exported to SAS® Content
    Categorization Studio. It requires a set of documents separated by category to
    train the model and generate rules.'
