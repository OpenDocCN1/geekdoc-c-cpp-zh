  md: '# Sentiment Analysis


    The field of sentiment analysis deals with categorization (or classification)
    of opinions expressed in textual documents. Often these text units are classified
    into multiple categories such as positive, negative, or neutral, based on the
    valence of the opinion expressed in the units. Organizations frequently conduct
    surveys and focus group studies to track a customer’s perception of their products
    and services. However, these methods are time-consuming and expensive and cannot
    work in real time the process of analyzing text is done manually by experts. Using
    sentiment analysis, an organization can identify and extract customers’ attitude,
    sentiment, or emotions towards a product or service. This is a more advanced application
    of text analytics that uses NLP to capture the polarity of the text: positive,
    negative, or mixed. With the advent of social networking sites, organizations
    can capture enormous amounts of customers’ responses instantly. This gives real-time
    awareness to customer feedback and enables organizations to react fast. Sentiment
    analysis works on opinionated text while text mining is good for factual text.
    Sentiment analysis, in combination with other text analytics and data mining techniques,
    can reveal very valuable insights.


    Sentiment analysis tools available from SAS offer a very comprehensive solution
    to capture, analyze, and report customer sentiments. The polarity of the document
    is measured over the overall document and at the specific feature level.


    Here is an example showing the results of a sentiment analysis on a customer’s
    review of a new TV brand:


    > The TV is wonderful. Great size, great picture, easy interface. It makes a little
    song when you boost it up, and when you shut it off. I wanted to point out that
    the 43" does not in play videos over the USB. This is really annoying because
    that was one of the perks I wanted from a new TV. Looking at the product description
    now, I realize that the feature list applies to the K758 series as and that each
    model’s capabilities are identified below. Kind of a dubious oversight on part,
    but it’s easily stupid to put a description that does not apply on the listing
    for a very specific model.


    In the previous text, green color represents positive tone, red color represents
    negative tone, and product features and names are highlighted in blue and brown,
    respectively. In addition to extracting positive and negative sentiments, names
    of product models and their features are identified. This level of identification
    helps identify the sentiment of the overall document and tracks the sentiment
    at a product-feature level, including the characteristics and sub-attributes of
    features.


    "Chapter 8 Sentiment Analysis" discusses sentiment analysis using SAS Sentiment
    Analysis Studio through an example of tracking sentiment in feedback comments
    from customers of a leading stop company.'
