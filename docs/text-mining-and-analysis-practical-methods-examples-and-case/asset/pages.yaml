    # Topic Extraction


    In Chapter 5, you learned about and appreciated the benefits of concept links.
    They help in understanding between terms based on their occurrence in the documents.
    They are represented in the form of a hub-andoke structure, where the strength
    of the relationship is indicated by the width of the connecting line. The concept
    can be extended to understand how various documents are associated with a topic.
    A topic is a collection of terms every document in the corpus has a score that
    represents the strength of association for a topic. A document can contain zero,
    one, or many. The objective of creating a list of topics is to establish combinations
    of words that are of interest in the analysis. For example, a manufacturer might
    want to explore all product reviews to see negative comments on a particular feature,
    for example, the navigation system. The analyst can define a topic, “Negative
    Nav Sys,” using the terms “navigation,” “bad,” “malfunctioning,” “useless,” and
    “faulty.” You can get a sense of the possible negative terms for defining the
    topic by browsing the terms. Display 61.12 illustrates the difference between
    concept links and text topics by considering the term navigation and the topic
    “Negative Nav Sys.”


