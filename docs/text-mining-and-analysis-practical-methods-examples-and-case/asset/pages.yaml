    # Deploying a Model


    When you created the project, you specified a SAS library. When you add new documents
    to your library, you can score them interactively by rerunning the project for
    the model that you created. You can deploy this model in more automated environments
    by using a DS2 program and the DS2 procedure, or you can deploy the model on the
    grid for big data scenarios. The following section shows how you can use PROC
    DS2.


    # Using PROC DS2 for DEPLOYMENT


    DS2 is a new SAS programming language that uses packages and methods to provide
    data abstraction. DS2 either executes by using PROC DS2 within a SAS'
  merge: -1
  pgno: 411
- img_proc: true
  md: 'session or executes directly within selected databases where SAS* Embedded
    Process is installed. The DS2 packages included in UTAI at TKCAT TKTXTANIO. TKTXTANIO
    is a utility package that is required by TKCAT.


    # TKCAT Source Code Sample


    The following code illustrates how to use the TKCAT package to apply the model
    that you build in the SAS UTAI:


    ```

    libname mydata ''C:\SAS Data Sets'';

    proc ds2;

    require package tkcat; run;

    require package tktxtanio; run;

    /* oe_comment is the column that contains text in your data set */

    table result(drop=(oe_comment status current_concept total_concepts transact document
    settings model));


    dcl package tkcat cat(); /*TKCAT categorization engine package */

    dcl package tktxtanio tktxtanio();/*Utility package required by TKCAT*/*

    dcl binary(8) transact;

    dcl binary(8) document;

    dcl binary(8) settings;

    dcl binary(8) model;

    retain transact;

    retain settings;

    retain model;


    method init();

    /* Create a transaction to use for scoring documents */

    transact = cat.new_transaction();

    /* Create the default settings for the transaction */

    settings = cat.new_apply_settings();

    /* Set the model created in UTAI to apply to new documents */

    model = tktxtanio.new_local_file(\mytopypussesmodel\conf\rules.li'');

    status = cat.apply_model(settings, model);

    if status != 0 then put(''ERROR: binary fails'');

    /* Initialize the categorization engine with your model */

    status = cat.initialize_concepts(settings);

    if status != 0 then put(''ERROR: initialize fails'');

    end;

    run

    ```


    ```

    method run();

    set mydata.opereporting; /* Data set that contains text to analyze */

    ```'
