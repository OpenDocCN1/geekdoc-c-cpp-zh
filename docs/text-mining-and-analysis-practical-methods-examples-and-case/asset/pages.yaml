  md: '# SAS Content Categorization Studio 12.1: User''s Guide.


    # Contextual Extraction


    Contextual extraction, also known as LITI (Language Interpretation/Text Interpretation)
    definition, offers many advanced linguistic capabilities that are not available
    with concept extraction methods. It offers many more features combining the power
    of categorization and concept extraction to extract complex facts. Contextual
    extraction capabilities are available to use only if you have SAS Content Categorization
    Studio licensed and installed with SAS Content Categorization Studio. It is always
    better to use a LITI definition instead of a regular concept definition when you
    have SAS Contextual Extraction Studio. You can start writing LITI definitions
    after you select LITI on the Definitions tab. and each of them offers a variety
    of capabilities.


