    Trends of topics across data sets can be tracked by looking at frequency of words
    related to a topic in the four data sets. Another way to explore trends is by
    understanding the context in which a particular term is frequently used. This
    can be accomplished by looking at the concept links for a term. You can view the
    concept links from the interactive filter window (to activate the interactive
    viewer, in the properties panel for the text filter node, click on the ellipsis
    button next to Filter Viewer). In the terms window select the term of interest,
