  md: '# # Module 1


    # ## Hardware Components


    Processor, memory and Input/Output devices, are the important components of a
    digital computer. **Processor** will have ALU (Arithmetic Logic Unit) and Control
    Unit (CU) as its components. **Memory** can be subdivided into primary and secondary
    memory. **Input devices** accept data and control signals from the user. Examples
    of input devices are keyboard, mouse, pen based systems, data scanners, game controllers,
    voice recognition systems etc. **Output devices** communicate the processed data
    to the user. Examples of output devices are Monitor, Printer, Plotter, sound system
    etc.


    # ## Processor


    Central Processing Unit (CPU) -It is the brain of the computer. It performs the
    bulk of the data processing operations. The function of the processor is to fetch
    the instruction from memory, examine (decode) the instruction and execute the
    instructions. It consists of Control unit, Arithmetic Logic Unit (ALU) and registers.
    Control unit is responsible for fetching the instructions from memory and interpreting
    them. ALU performs arithmetic and logical operations. Registers are very high
    speed memory units for storing very small amount of data. Program counter, Instruction
    register, Memory address register, memory buffer register and accumulator are
    some examples of registers. Bus is a collection of wires. They may be unidirectional
    or bidirectional. Bus is used to connect different parts of a computer. Bus may
    be serial or parallel. USB is an example of a serial bus. Bus connecting computer
    and a dot matrix printer is normally a parallel bus. Parallel bus carries several
    bits at a time. These bits may indicate instruction, data, address or commands.
    Bus width and Bus speed are the two major components for performance measure of
    a computer.


    # ## Memory


    In the memory, the information is stored in terms of bits or bytes or words. Byte
    is made of 8 bits and word is a collection of 16, 32 or 64 bits. Memory can be
    volatile or non volatile. Information present in Volatile memory is lost as soon
    as the power is turned off. Figure-1 gives the classification of memory devices
    in a digital computer. Secondary memories are non volatile in nature. Examples
    of secondary memory include Hard disk, Pen drive, DVD-ROM, Recordable DVD, CD-RW,
    Blue-Ray, Magnetic tapes. Main memory devices are ones in which any memory location
    can be accessed in any order (not necessarily in a sequential order). RAM (Random
    Access Memory) and ROM (Read Only Memory) are the two types of main memory devices.
    RAM is also called Read-Write Memory. It is volatile memory. ROM is non-volatile
    memory. It is also considered an example of firmware. Cache memory is a memory
    placed between CPU and main memory. It contains a part of main memory content.
    Processor when needs some information, first looks in the cache. If not found
    in cache, the portion of memory containing the needed information is moved to
    the cache and is also read by the processor. Both internal and external cache
    memories are volatile in nature. External'
