    \ inside the body of \"if\"\nif(condition2){\n//Statements inside the body of\
    \ nested \"if\"\n}\nelse{\n//Statements inside the body of nested \"else\"\n}\n\
    }\nelse{\n//Statements inside the body of \"else\"\n}\n```\n\n# Example of nested\
