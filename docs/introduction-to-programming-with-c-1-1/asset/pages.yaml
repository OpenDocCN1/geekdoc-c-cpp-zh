  md: "Scope of an identifier is the part of the program where the identifier may\
    \ directly be accessible. In C, all identifiers are lexically (or statically)\
    \ scoped. C scope rules can be covered under following two categories.\n\n# Global\
    \ Scope: Can be accessed anywhere in a program.\n\n```\n// filename: file1.c\n\
    inta;\nintmain(void)\n{\n  a = 2;\n}\n// filename: file2.c\n// When this file\
    \ is linked with file1.c, functions of this file can access a\nexterninta;\nintmyfun()\n\
    {\n  a = 2;\n}\n```\n\nTo restrict access to current file only, global variables\
    \ can be marked as static.\n\n# Block Scope: A Block is a set of statements enclosed\
    \ within left and right braces ({ and } respectively). Blocks may be nested in\
    \ C (a block may contain other blocks inside it). A variable declared in a block\
    \ is accessible in the block and all inner blocks of that block, but not accessible\
    \ outside the block.\n\nWhat if the inner block itself has one variable with the\
    \ same name? If an inner block declares a variable with the same name as the variable\
    \ declared by the outer block, then the visibility of the outer block variable\
    \ ends at the pint of declaration by inner block.\n\n```\nintmain()\n{\n  {\n\
    \    intx = 10, y = 20;\n    {\n      // The outer block contains declaration\
    \ of x and y, so\n      // following statement is valid and prints 10 and 20\n\
    \      printf(\"x = %d, y = %d\\n\", x, y);\n      {\n        // y is declared\
    \ again, so outer block y is not accessible\n        // in this block\n      \
    \  inty = 40;\n```"
