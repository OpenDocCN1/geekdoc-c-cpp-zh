    \nStructures:\n\nA structure is a collection of one or more variables of same\
    \ data type or dissimilar data types, grouped together under a single name.\n\n\
    Example: A student information to be grouped may consists of Name of the student\
    \ University number Average marks\n\nThe general syntax of a structure:\n\n```\n\
    struct tagname\n{\n    Type1 member1;\n    Type2 member2;\n};\n```\n\n+   - Where\
    \ struct is a keyword which tells the compiler that structure is being defined\n\
    +   - Tagname is the name of the structure\n+   - Variables in a structure such\
    \ as member1,member 2 are called as the members of the structure of fields of\
    \ the structure.\n+   - Members can be int,float,char etc..\n+   - There should\
    \ be semicolon at the end of the closing brace.\n\nNote:\n\nThe structure definition\
    \ does not reserve any space in memory for the members. It is just a template.\n\
