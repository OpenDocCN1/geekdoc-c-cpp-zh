  md: "All section, except the main () function section may be absent when they are\
    \ not required.\n\n# 2) Writing first program:\n\nFollowing is first program in\
    \ C\n\n```\n#include <stdio.h>\nvoid main()\n{\n    printf(\"Welcome to C Programming!!\"\
    );\n}\n```\n\nOutput:\n\nWelcome to C Programming!!\n\nLet us analyze the program\
    \ line by line.\n\nLine 1: [ #include <stdio.h> ] In a C program, all lines that\
    \ start with # are processed by preprocessor which is a program invoked by the\
    \ compiler. In a very basic term, preprocessor takes a C program and produces\
    \ another C program. The produced program has no lines starting with #, all such\
    \ lines are processed by the preprocessor. In the above example, preprocessor\
    \ copies the preprocessed code of stdio.h to our file. The .h files are called\
    \ header files in C. These header files generally contain declaration of functions.\
    \ We need stdio.h for the function printf() used in the program.\n\nLine 2 [void\
    \ main() ] There must to be starting point from where execution of compiled C\
    \ program begins. In C, the execution typically begins with first line of main().\
    \ The void written before main indicates return type of main(). The value returned\
    \ by main indicates status of program termination.\n\nLine 3 and 6: [ { and }\
    \ ] In C language, a pair of curly brackets define a scope and mainly used in\
    \ functions and control statements like if, else, loops. All functions must start\
    \ and end with curly brackets.\n\nLine 4 [ printf(\"Welcome to C Programming!!\"\
    ); ] printf() is a standard library function to print something on standard output.\
    \ The semicolon at the end of printf indicates line termination. In C, semicolon\
    \ is always used to indicate end of statement.\n\n# Interesting Facts about Macros\
    \ and Preprocessors in C"
