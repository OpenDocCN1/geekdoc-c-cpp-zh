- pgno: 63
  md: 'It’s a pretest or entry controlled loop and hence the condition is evaluated
    first and body of the loop is executed only if the condition is true. Its also
    a condition controlled or event controlled loop.


    # Syntax


    ```

    initialization;


    while(condition)

    {

    Statement;

    updation;

    }

    Statement;

    ```


    # Working


    +   1. Initialization of loop control variable is done.

    +   2. Next condition is checked

    +   3. If the condition is evaluated to true then control enters the body of the
    loop and executes the statements in the body.

    +   4. Next updates the loop counter variable after which control goes back to
    the condition check. If the condition is true, again the body is executed.

