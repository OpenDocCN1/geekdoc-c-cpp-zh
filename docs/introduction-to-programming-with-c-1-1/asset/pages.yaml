  md: "**static:** static keyword is used to declare static variables which are popularly\
    \ used while writing programs in C language. Static variables have a property\
    \ of preserving their value even after they are out of their scope! Hence, static\
    \ variables preserve the value of their last use in their scope. So we can say\
    \ that they are initialized only once and exist till the termination of the program.\
    \ Thus, no new memory is allocated because they are not re-declared. Their scope\
    \ is local to the function to which they were defined. Global static variables\
    \ can be accessed anywhere in the program. By default, they are assigned the value\
    \ 0 by the compiler.\n\nSyntax:\n\n```\nstaticdata_typevar_name = var_value;\n\
    ```\n\n# How are variables scoped in C – Static or Dynamic?\n\nIn C, variables\
    \ are always statically (or lexically) scoped i.e., binding of a variable can\
    \ be determined by program text and is independent of the run-time function call\
    \ stack.\n\nFor example, output for the below program is 0, i.e., the value returned\
    \ by f() is not dependent on who is calling it. f() always returns the value of\
    \ global variable x.\n\n```\nint x = 0;\nint f()\n{\n    return x;\n}\nint g()\n\
    {\n    int x = 1;\n    return f();\n}\nint main()\n{\n    printf(\"%d\", g());\n\
    \    printf(\"\\n\");\n    getchar();\n}\n```\n\n# Scope rules in C"
