  md: '**pre processor(#):** The preprocessor is a macro processor that is used automatically
    by the compiler to transform your program before actual compilation.


    **Operators:** Operators are symbols that triggers an action when applied to C
    variables and other objects. The data items on which operators act upon are called
    operands. Depending on the number of operands that an operator can act upon, operators
    can be classified as follows:


    **Unary Operators:** Those operators that require only single operand to act upon
    are known as unary operators. For Example increment and decrement operators


    **Binary Operators:** Those operators that require two operands to act upon are
    called binary operators. **Binary operators are classified into :**


    +   1. Arithmetic operators

    +   2. Relational Operators

    +   3. Logical Operators

    +   4. Assignment Operators

    +   5. Conditional Operators

    +   6. Bitwise Operators


    **Ternary Operators:** These operators requires three operands to act upon. For
    Example Conditional operator(?:).


    # Variables and Keywords in C


    A **variable** in simple terms is a storage place which has some memory allocated
    to it. So basically a variable used to store some form of data. Different types
    of variables require different amounts of memory and have some specific set of
    operations which can be applied on them.


    **Variable**                                                                 **Declaration:**

    A typical variable declaration is of the form:


    ```

    typevariable_name;

    or for multiple variables:

    type variable1_name, variable2_name, variable3_name;

    ```


    A variable name can consist of alphabets (both upper and lower case), numbers
    and the underscore ` _ ` character. However, the name must not start with a number.


    # Difference b/w variable declaration and definition


    Variable declaration refers to the part where a variable is first declared or
    introduced before its first use. Variable definition is the part where the variable
    is assigned a memory location and a value. Most of the times, variable declaration
    and definition are done together


