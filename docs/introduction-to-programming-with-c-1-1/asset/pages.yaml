  md: "# Pass by address\n\nHere, when the function is called, the addresses of actual\
    \ parameters are sent. In the called function, the formal parameters should be\
    \ declared as pointers with the same type as the actual parameters. The addresses\
    \ of actual parameter are copied to formal parameter. Using these addresses, the\
    \ values of the actual parameters can be changed. This way of changing the actual\
    \ parameters indirectly using its address is called pass by address.\n\n```\n\
