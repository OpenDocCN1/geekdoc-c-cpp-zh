  md: "# Tagged structure:\n\nSynatx:\n\n```\nstruct tagname\n{\n    Type1 member1;\n\
    \    Type2 member2;\n};\n```\n\nExample:\n\n```\nstruct student\n{\n    char name[10];\n\
    \    int usn, marks;\n};\n```\n\n+   - Student is the name of the structure(tag\
    \ name)\n+   - Struct student together represent the data type.\n+   - To allocate\
    \ memory for structure ,variables must be declared.\n\nSyntax for structure variable\
    \ declaration:\n\n```\nstruct tagname v1,v2,...vn;\n```\n\nExample:\n\n```\nstruct\
    \ student s1,s2;\n```\n\nOnce the variable are declared , memory for the variables\
    \ s1 amd s2 are allocated. The number of bytes allocated for the variables s1\
    \ and s2 are 14 bytes respectively\n\n10 bytes for name\n\n2 bytes for usn\n\n\
    2 bytes for marks\n\nThe total size of the memory allocated is the sum of sizes\
    \ of individual members.\n\n# Structure without tag:\n\nThe structure without\
    \ a tag name is called structure without tag.\n\nSyntax:\n\n```\nstruct\n{\n \
    \   Type1 member1;\n    Type2 member2;\n}\n```"
