    # Type modifiers/qualifiers :


    A type modifiers alter the meaning of the base data type to yield a new type.
    There are four types of modifiers in C they are


    +   - signed

    +   - unsigned

    +   - short

    +   - long


    +   1. Each of these type modifiers can be applied to the base type int.

    +   2. Type modifiers signed and unsigned can also be applied to the base type
    char.

    +   3. In addition, long can be applied to double.


    | Data type | Format | Memory size | Accessibility range |

    |---|---|---|---|

