    # Looping (repetition)


    A set of statements may have to be repeatedly executed for a specified number
    of times or till a condition is satisfied. The statements that help us to execute
    a set of statements repeatedly are called looping or repetitive or iterative statements.


    There are 3 types of loops in C


    +   - while loop

    +   - for loop

    +   - do-while loop


    any looping construct will have to perform 3 tasks namely initialization, condition
    checking and incrementation. The difference between yhe three looping control
    constructs is the order in which they perform the 3 tasks i.i (initialization,
    increment, condition checking)


    # The while loop'
