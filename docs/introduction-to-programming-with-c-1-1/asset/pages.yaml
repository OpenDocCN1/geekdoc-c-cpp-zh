    \ In C language several kinds of statements are available, which can be classified\
    \ as\n\n+   1) **Expression Statements**\n+   2) **Compound Statements**\n+  \
    \ 3) **Control Statements**\n\n**Expression Statements:** Most of the statements\
    \ in a C program are expression statements. An expression statement consists of\
    \ an expression followed by a semicolon. The execution of an expression causes\
    \ the expression to be evaluated.\n\n**Examples:** 7 expression statements are\
    \ given below\n\n```\na=10;\na+=20;\nprintf(\"Hello,Goodmorning!\\n\");\ndisplay(a,b);\
    \        /*A function call*/\nc=a+b;               /* An assignment statement*/\n\
    c+sum(a+b);          /* A valid , but strange statement*/\n;                 \
    \   /*An empty or null statement*/\n```\n\n**Compound Statements:** A compound\
    \ statement (also called a “block”) typically appears as the body of another statement,\
    \ such as the if statement, for statement, while statement, etc\n\nIt consists\
    \ of several individual statements enclosed within a pair of braces { }. The individual\
    \ statements may themselves be expression statements, compound statements or control\
    \ statements. Unlike expression statements, a compound statements does not end\
    \ with a semicolon. A typical Compound statements is given below.\n\n```\n{\n\
    \    pi=3.14;\n    area=pi*radius*radius;\n}\n```\n\nThe particular compound statement\
    \ consists of two assignment-type expression statements.\n\n**Control Statements:**\
    \ Statements used to specify the flow of program control; ie, the order in which\
    \ the instructions in a program must be executed. It is possible to make decisions,\
    \ to perform tasks repeatedly or to jump from one section of code to another."
