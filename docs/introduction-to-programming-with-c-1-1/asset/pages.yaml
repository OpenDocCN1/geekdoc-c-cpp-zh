- pgno: 41
  md: "# MODULE 2\n\n# Branching (Conditional and Unconditional branching)\n\n# Control\
    \ Flow\n\nA program consists of a number of statements which are usually executed\
    \ in sequence. Programs can be much more powerful if we can control the order\
    \ in which statements are run. Statements fall into three general types;\n\n+\
    \   - Assignment statements, where values, usually the results of calculations,\
    \ are stored in variables.\n+   - Input / Output statements, data is read in or\
    \ printed out.\n+   - Control statements, the program makes a decision about which\
    \ statement should be executed next.\n\nControl statements can be\n\n**Branching:**\
    \ Selecting between optional sections of a program.\n\n**Looping:** Repeating\
    \ important sections of the program.\n\n# Branching:\n\n# 1) The Simple if statement\n\
    \n```\nif (testExpression)\n{\n    // statements\n}\n\nStatement x;\n```\n\nThe\
    \ `if` statement evaluates the test expression inside the parenthesis.\n\nIf the\
    \ test expression is evaluated to true (nonzero), statements inside the body of\
    \ `if` is executed.\n\nIf the test expression is evaluated to false (0), statements\
    \ inside the body of `if` is skipped from execution and control goes to statement\
    \ x"
  merge: -1
  img_proc: true
