    # ### e) getch()


    This is also an input function. This is used to read a single character from the
    keyboard like getchar() function. But getchar() function is a buffered function,
    getchar() function is a non-buffered function. The character data read by this
    function is directly assign to a variable rather it goes to the memory buffer,
    the character data directly assign to a variable without the need to press the
    Enter key.

    Another use of this function is to maintain the output on the screen till you
    have not press the Enter Key. The general syntax is as:


    ```

    v = getch();

    ```


    where v is the variable of character type.

    A simple C program to illustrate the use of getch() function:


    ```

    /*Program to explain the use of getch() function*/

    main()

    {

    char n;

    puts("Enter the Char");

    n = getch();

    puts("Char is :");

    putchar(n);

    getch();

    }

    ```


    **OUTPUT IS:**

    Enter the Char

    Char is L


