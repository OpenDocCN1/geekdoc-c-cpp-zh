  md: "# # C switch...case Statement\n\nThe `if...else...if` ladder allows you to\
    \ execute a block code among many alternatives. If you are checking on the value\
    \ of a single variable in `if...else...if`, it is better to use `switch` statement.\n\
    \nThe switch statement is often faster than nested `if...else` (not always)\n\n\
    # Syntax of switch...case\n\n```\n```c\nswitch (int_expr)\n\n{\n\ncase constant1:\n\
    \n    // code to be executed if n is equal to constant1;\n\nbreak;\n\ncase constant2:\n\
    \n    // code to be executed if n is equal to constant2;\n\nbreak;\n\n.\n\n.\n\
    \n.\n```\n```"
