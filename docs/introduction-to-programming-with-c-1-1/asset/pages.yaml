    # 5.4.3 Key points to remember about pointers in C:


    +   - Normal variable stores the value whereas pointer variable stores the address
    of the variable.

    +   - The content of the C pointer always be a whole number i.e. address.

    +   - Always C pointer is initialized to null, i.e. int *p = null.

    +   - The value of null pointer is 0.

    +   - & symbol is used to get the address of the variable.

    +   - * symbol is used to get the value of the variable that the pointer is pointing
    to.

    +   - If a pointer in C is assigned to NULL, it means it is pointing to nothing.

    +   - Two pointers can be subtracted to know how many elements are available between
    these two pointers.'
