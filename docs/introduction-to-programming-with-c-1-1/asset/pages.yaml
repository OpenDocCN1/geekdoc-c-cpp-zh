- pgno: 79
  md: '# Function body:


    The compound statement immediately following the function header is function body.
    It consists of 3 elements.


    +   - Declaration: all the variables used in the function body should be declared
    in the declaration part. But, the variables used in the function header should
    not be declared again.

    +   - Executable part: this part contains statements or instructions that perform
    the specified activity.

    +   - return: it’s a keyword. It’s used to return control to the calling function
    with/without a value.


    Note: if the function is not returning any value, then we need to specify the
    return type as void.


    If return type is not explicitly written, it’s assumed that return type is integer.
    So, integer is the default return value.


    # Function declaration


    The function should be declared before they are used. This process of declaring
    the functions before they are used is called function prototype or function declaration.


    Function declaration contains only the function header but terminated with semi
    colon. It informs the compiler about


    +   - The type of value returned by the function

    +   - The name of the function

    +   - The number of parameters passed to that function

    +   - The type of each parameter in the function header


    # Syntax:


    ```

    type function-name(type p1, type p2, ........ type pn);   /*semi colon is must*/

    ```


    where


    type – is type of the value returned from the function such as void, int, float
    etc.


    function name- name of the function


    p1,p2,........pn – are parameters. All the parameters have to be separately declared
    and each declaration should be separated by comma.'
