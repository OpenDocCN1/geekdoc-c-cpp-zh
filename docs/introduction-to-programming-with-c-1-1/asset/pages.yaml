  md: 'Where


    +   - Type can be a data type such as int, float, char etc

    +   - Array_name is the name of the array.

    +   - Expression is an integer and should be enclosed within square brackets.

    +   - v1,v2, are values and should be enclosed within ‘{‘ and ‘}’ separated by
    commas. The value v1 is stored in 0th location, v2 is stored in 1st location and
    soon.


    The various ways of initializing arrays are:


    +   - Initializing all specified memory locations

    +   - Partial array initialization

    +   - Initialization without size


    # Initializing all specified memory locations


    Ex:


    ```

    int a[6]={10,15,20,25,30};

    ```


    | 10 | 15 | 20 | 25 | 30 | 35 |

    | a[0] | a[1] | a[2] | a[3] | a[4] | a[5] |


    # Partial array initialization


    If the number of values to be initialized is less than the size of the array,
    then the elements are initialized in the order from 0th location. The remaining
    locations will be initialized to zero automatically.


    ```

    int a[5]={10,15};

    ```


    | 10 | 15 | 0 | 0 | 0 |

    | a[0] | a[1] | a[2] | a[3] | a[4] |


    # Initialization without size


    ```

    int a[]={10,20,30,40,50};

    ```


    | 10 | 20 | 30 | 40 | 50 |

    | a[0] | a[1] | a[2] | a[3] | a[4] |'
