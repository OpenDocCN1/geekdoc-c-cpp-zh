    # Strings


    A string is an array of characters terminated by NULL character which is denoted
    by the escape sequence ''\0''.


    Ex: “VTU” is stored as


    | V | T | U | \0 |


    Strings are treated as an array of characters. String variable can be declared
    as


    ```

    char a[20];

    ```


    the string variable a can hold maximum of 20 characters including null character.


    # String initialization


    # String input/output functions


    +   - Formatted input function (scanf)

    +   - Formatted output function (printf)

    +   - Unformatted input function (gets)

    +   - Unformatted output function (puts)


    # Formatted input and output function (scanf,printf)


    The format specifier used is %s.


    # Working


    +   - If white spaces are present before the string, then they are removed from
    the keyboard buffer

    +   - All nonwhite space characters are copied into the array till it finds another
    white space. Then the copied string is terminated by ''\0''. Remaining characters
    are left in the keyboard buffer.


    ```

    char s1[15];

    ```


    ```

    scanf("%s",s1);

    ```


    ```

    printf("%s\n",s1);

