  - '[PAGE 81]


    # Rules:


    +   - The number of arguments in the function call must be equal to the number
    of parameters in function prototype and header.

    +   - The type of the arguments arguments in the function call must be equal to
    the type of parameters in function prototype and header.

    +   - A void function doesn’t return a value. So, when a function is called, it
    can’t be used in an expression or print statement. It can be used only as statement.

    +   - If function return type is void, then it should not return any value. It
    results in syntax error.

    +   - Function can return at most one value


    # Formal parameters and actual parameters


    # Formal parameter/dummy parameter


    The variables defined in the function header of function definition are called
    formal parameters. All the variables must be separately declared and each declaration
    must be separated by commas. The formal parameters receive data from actual parameters.


    # Actual parameters/arguments


    The variables that are used in function call are called actual parameters. Using
    actual parameters, the data can be transferred to the function. The corresponding
    formal parameters in the function definition receive them. The actual parameter
    and formal parameter should match in number and type of data.


    # Categories of functions


    Based on the parameters and return value, the functions are categorized as follows:


    +   - Function with no parameters and no return values.

    +   - Function with no parameters and return values

    +   - Function with parameters and no return values

    +   - Function with parameters and return values


    # Function with no parameters and no return values


    This category is called “void function with no parameters”. There is no data transfer
    between the calling function and called function. So, calling function cannot
    send values and called function cannot receive the data.'
