    \n## 分支与循环\n\n### 循环（重复）\n\n一组语句可能需要重复执行指定的次数或直到满足条件为止。帮助我们重复执行一组语句的语句称为循环或重复或迭代语句。\n\
    \nC 中有 3 种类型的循环：\n\n- while 循环\n- for 循环\n- do-while 循环\n\n任何循环结构都必须执行 3 项任务，即初始化、条件检查和递增。三种循环控制结构之间的区别在于它们执行这\
    \ 3 项任务的顺序，即（初始化、递增、条件检查）。\n\n### while 循环\n\n它是一个预测试或入口控制循环，因此首先评估条件，并且只有当条件为真时才会执行循环体。它也是一个条件控制或事件控制循环。\n\
    \n#### 语法\n\n```c\ninitialization;\n\nwhile(condition)\n{\n    Statement;\n  \
    \  updation;\n}\nStatement;\n```\n\n#### 工作原理\n\n1. 对循环控制变量进行初始化。\n2. 接下来检查条件。\n\
    3. 如果条件评估为真，则控制进入循环体并执行体内的语句。\n4. 接下来更新循环计数器变量，之后控制返回到条件检查。如果条件为真，则再次执行体。\n5.\
    \ 只要条件评估为真，此过程就会重复。一旦条件评估为假，控制就会流向循环体外的语句。\n\n#### 示例\n\n```c\n/* program to display\
    \ numbers from 1-10 */\n\n#include<stdio.h>\n\nvoid main()\n{\n    int i;\n\n\
    \    i = 0;              /* initialization */\n    while(i <= 10)      /* condition\
    \ checking */\n    {\n        printf(\"%d\\n\", i);\n        i++;            /*\
    \ updation */\n    }\n    getch();\n}\n```\n\n**注意：** 研究相应的实验程序和理论课上给出的程序。\n\n\
    ### for 循环\n\n使用它我们可以重复执行一组语句指定的次数。所以它也称为计数器控制循环。它是一个预测试或顶部测试循环。\n\n#### 语法\n\n\
    ```c\nfor(initialization; condition check; updation)\n{\n    Statements\n}\n```\n\
    \n#### 工作原理\n\n1. 这里初始化、条件检查和更新都在同一语句中完成。\n2. 执行循环计数器的初始化。\n3. 检查条件。如果条件评估为真，则控制进入循环体。执行体内的语句。\n\
    4. 执行循环计数器的更新。之后控制再次返回到条件检查。如果条件为真，则再次执行体。\n5. 只要条件评估为真，此过程就会重复。一旦条件评估为假，控制就会流向循环体外的语句。\n\
    \n#### 示例\n\n```c\n/* program to display numbers from 1-10 */\n\n#include<stdio.h>\n\
    \nvoid main()\n{\n    int i;\n\n    for(i = 0; i <= 10; i++)\n    {\n        printf(\"\
    %d\\n\", i);\n    }\n\n    getch();\n}\n```\n\n**注意：** 研究相应的实验程序和理论课上给出的程序。\n\n\
    ### Do-while\n\n它是一个后测试或底部测试循环，因此首先执行循环体，然后再检查条件。\n\n#### 语法\n\n```c\nInitialization;\n\
    \ndo\n{\n    statement;\n    updation;\n} while(condition);  /* note: there is\
    \ a semi-colon at the end of while */\n\nstatements\n```\n\n#### 工作原理\n\n1. 首先执行初始化。\n\
    2. 然后一次又一次地执行循环体内的语句。\n3. 在体末尾执行更新，然后检查条件。\n4. 如果条件评估为真，则控制重新进入体并执行体内的语句。\n5.\
    \ 只要条件评估为真，此过程就会重复。\n6. 当条件变为假时，控制离开循环体。\n\n#### 示例\n\n```c\n#include<stdio.h>\n\
    \nvoid main()\n{\n    int i;\n\n    i = 0;                  /* initialization\
    \ */\n    do\n    {\n        printf(\"%d\\n\", i);\n        i++;             \
    \   /* updation */\n    } while(i <= 10);       /* condition checking */\n\n \
    \   getch();\n}\n```\n\n**注意：** 研究相应的实验程序和理论课上给出的程序。\n\n### while 循环与 do-while\
    \ 循环的区别\n\n|  | While 循环 | Do-while 循环 |\n|---|---|---|\n| **1** | **语法**<br><br><code>initialization;</code><br><br><code>while(condition)</code><br><br><code>{</code><br><br><code>Statement;</code><br><br><code>updation;</code><br><br><code>}</code><br><br><code>Statement;</code>\
