    \ condition check; updation)\n{\n    Statements\n}\n```\n\n#### Working\n\n1.\
    \ Here initialization, condition check, and updation are done in the same statement.\n\
    2. Initialization of the loop counter is performed.\n3. Condition is checked.\
    \ If the condition evaluates to be true, then the control enters the body of the\
    \ loop. The statements in the body are executed.\n4. Updation of the loop counter\
    \ is performed. After which again the control goes back to condition check. If\
    \ the condition is true, again the body is executed.\n5. This process repeats\
    \ as long as the condition evaluates to be true. Once the condition evaluates\
    \ to be false, the control flows to the statement outside the body of the loop.\n\
    \n#### Example\n\n```c\n/* program to display numbers from 1-10 */\n\n#include<stdio.h>\n\
    \nvoid main()\n{\n    int i;\n\n    for(i = 0; i <= 10; i++)\n    {\n        printf(\"\
    %d\\n\", i);\n    }\n\n    getch();\n}\n```\n\n**Note:** Study corresponding lab\
    \ programs and the programs given in theory class.\n\n### Do-while\n\nIt is a\
    \ post-test or bottom-test loop, and hence the body of the loop is executed first\
