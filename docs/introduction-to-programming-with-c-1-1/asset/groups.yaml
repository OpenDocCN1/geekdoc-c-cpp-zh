  md: "\n## break Statement\n\nThe break statement terminates the loop (`for`, `while`,\
    \ and `do...while` loop) immediately when it is encountered. The break statement\
    \ is used with decision-making statements such as `if...else`. In C programming,\
    \ the break statement is also used with the `switch...case` statement.\n\n###\
    \ Syntax of break statement\n\n```c\nbreak;\n```\n\n### Flowchart of break statement\n\
    \n![](img/bb6d48ce0279cc8c245e23e6b7e31d4d_56_0.png)\n\n### How break statement\
    \ works?\n\n```c\nwhile (test Expression)\n{\n    // codes\n    if (condition\
    \ for break)\n    {\n        break;\n    }\n    // codes\n}\n```\n\n```c\nfor\
    \ (init, condition, update)\n{\n    // codes\n    if (condition for break)\n \
    \   {\n        break;\n    }\n    // codes\n}\n```\n\n### Example #1: break statement\n\
    \n```c\n// Program to calculate the sum of maximum of 10 numbers\n// Calculates\
    \ sum until user enters positive number\n\n#include <stdio.h>\n\nvoid main()\n\
    {\n    int i;\n    double number, sum = 0.0;\n\n    for(i = 1; i <= 10; ++i)\n\
