    Let us analyze the program line by line.\n\nLine 1: [ #include <stdio.h> ] In\
    \ a C program, all lines that start with # are processed by preprocessor which\
    \ is a program invoked by the compiler. In a very basic term, preprocessor takes\
    \ a C program and produces another C program. The produced program has no lines\
    \ starting with #, all such lines are processed by the preprocessor. In the above\
    \ example, preprocessor copies the preprocessed code of stdio.h to our file. The\
    \ .h files are called header files in C. These header files generally contain\
    \ declaration of functions. We need stdio.h for the function printf() used in\
