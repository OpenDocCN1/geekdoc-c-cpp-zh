    n\");\n    scanf(\"%d%d\",&a,&b);\n    c=a+b;\n    printf(\"sum=%d\\n\",c);\n\
    \    return;      /*returns nothing*/\n}\n```\n\n## 有参数且无返回值的函数\n\n这称为“有参数的 void\
    \ 函数”。通过参数从调用函数向被调用函数进行数据传输。但，被调用函数到调用函数之间没有数据传输。\n\n```\n/*program to demonstrate\
    \ Function with parameter and no return values*/\n#include<stdio.h>\n\nvoid add(int\
