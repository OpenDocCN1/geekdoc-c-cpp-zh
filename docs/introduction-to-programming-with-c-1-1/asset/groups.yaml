    \ multiple blocks of requested memory.\n- `realloc()` reallocates the memory occupied\
    \ by `malloc()` or `calloc()` functions.\n- `free()` frees the dynamically allocated\
    \ memory.\n\nFor a complete tutorial of dynamic memory allocation refer to the\
    \ link below:\n\nhttps://www.youtube.com/watch?v=xDVC3wKjS64\n\n## 5.3 C - Preprocessors\n\
    \nThe **C Preprocessor** is not a part of the compiler, but is a separate step\
    \ in the compilation process. In simple terms, a C Preprocessor is just a text\
    \ substitution tool and it instructs the compiler to do required pre-processing\
    \ before the actual compilation. We'll refer to the C Preprocessor as CPP.\n\n\
