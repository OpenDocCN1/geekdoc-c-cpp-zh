    \nLine 3 and 6: [ { and } ] In C language, a pair of curly brackets define a scope\
    \ and mainly used in functions and control statements like if, else, loops. All\
    \ functions must start and end with curly brackets.\n\nLine 4 [ printf(\"Welcome\
    \ to C Programming!!\"); ] printf() is a standard library function to print something\
    \ on standard output. The semicolon at the end of printf indicates line termination.\
    \ In C, semicolon is always used to indicate end of statement.\n\n# Interesting\
    \ Facts about Macros and Preprocessors in C"
