    \ is the order in which they perform the 3 tasks, i.e. (initialization, increment,\
    \ condition checking).\n\n### The while loop\n\nIt is a pretest or entry-controlled\
    \ loop, and hence the condition is evaluated first and the body of the loop is\
    \ executed only if the condition is true. It is also a condition-controlled or\
