    The function-like macro looks like a function call. For example:\n\n```\n#define\
    \ MIN(a,b) ((a)<(b)?(a):(b))\n```\n\nHere, MIN is the macro name. Let's see an\
    \ example of function-like macros:\n\n```c\n#include <stdio.h>\n#define MIN(a,b)\
    \ ((a)<(b)?(a):(b))\nvoid main(){\nprintf(\"Minimum between 10 and 20 is: %d\\\
    n\",MIN(10,20));\n}\n```\n\n**Output:**\n\n```\nMinimum between 10 and 20 is:\
    \ 10\n```\n\n**Preprocessor Formatting**\n\nA preprocessing directive cannot be\
