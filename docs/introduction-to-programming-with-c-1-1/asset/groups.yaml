    \ /*two arguments are passed to the called function and result stored in c*/\n\
    ```\n```\n```\nprintf(\"sum=%d\\n\",c);\n}\n```\n\n```\nint add(int x, int y)\n\
    {\n    int z;\n    z=x+y;\n    return z;\n}\n```\n\n## 向函数传递参数\n\n向函数传递参数有两种方式\n\
    \n- 按值传递（按值调用）\n- 按地址传递\n\n## 按值传递\n\n这里，实际参数的值被复制到形式参数中，即形式参数仅包含实际参数的副本。因此，即使在被调用函数中形式参数的值发生变化，实际参数的值也不会改变。\n\
    \n优点：\n\n- 使函数更自成一体\n- 保护它们免受意外更改。\n\n缺点：\n\n它不允许通过参数将信息传回调用函数。\n\n```\n/*program\
    \ to demonstrate pass by value(swapping 2 numbers)*/\n```\n```c\n#include<stdio.h>\n\
    \nvoid exchange(int m,int n);\n\nvoid main()\n{\n    int a=10,b=20;\n    exchange(a,b);\n\
