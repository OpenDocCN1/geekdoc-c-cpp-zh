    ,PI);\n}\n```\n\n**Output:**\n\n```\nCompile Time Error: 'PI' undeclared\n```\n\
    \n**4. #ifdef**\n\nThe `#ifdef` preprocessor directive checks if a macro is defined\
    \ by `#define`. If yes, it executes the code.\n\n**Syntax:**\n\n```c\n#ifdef MACRO\n\
    //code\n#endif\n```\n\n**5. #ifndef**\n\nThe `#ifndef` preprocessor directive\
    \ checks if a macro is not defined by `#define`. If yes, it executes the code.\n\
    \n**Syntax:**\n\n```c\n#ifndef MACRO\n//code\n#endif\n```\n\n**6. #if**\n\nThe\
    \ `#if` preprocessor directive evaluates the expression or condition. If the condition\
