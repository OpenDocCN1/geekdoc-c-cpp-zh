    \ file is not found, the compiler renders an error. It has three variants:\n\n\
    **`#include <file>`**\n\nThis variant is used for system header files. It searches\
    \ for a file named `file` in a list of directories specified by you, then in a\
    \ standard list of system directories.\n\n**`#include \"file\"`**\n\nThis variant\
    \ is used for header files of your own program. It searches for a file named `file`\
    \ first in the current directory, then in the same directories used for system\
    \ header files. The current directory is the directory of the current input file.\n\
    \n**`#include anything else`**\n\nThis variant is called a computed `#include`.\
    \ Any `#include` directive whose argument does not fit the above two forms is\
    \ a computed include.\n\n**2. Macros (#define)**\n\nLet's start with macros. A\
    \ macro is a segment of code which is replaced by the value of the macro. A macro\
    \ is defined by the `#define` directive.\n\n**Syntax:**\n\n```\n#define token\
    \ value\n```\n\nThere are two types of macros:\n\n- Object-like Macros\n- Function-like\
