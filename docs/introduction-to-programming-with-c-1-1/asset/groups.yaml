    STUDENT S;\n```\n\nAccessing members:\n\n```\nS.name;\n```\n\n```\ns.marks[0];\n\
    ```\n\n```\ns.marks[1];\n```\n\n```\ns.marks[2];\n```\n\n## ARRAY OF STRUCTURES:\n\
