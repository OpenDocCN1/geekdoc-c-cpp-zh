    \ 这些运算符需要三个操作数来进行操作。例如条件运算符(?:)。\n\n# C 语言中的变量与关键字\n\n**变量**简单来说就是一个存储位置，它被分配了一些内存。所以基本上，变量用于存储某种形式的数据。不同类型的变量需要不同数量的内存，并且有一组特定的操作可以应用于它们。\n\
    \n**变量声明：**\n典型的变量声明形式如下：\n\n```\ntype variable_name;\n或者对于多个变量：\ntype variable1_name,\
