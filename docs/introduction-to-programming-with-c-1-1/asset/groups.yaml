    \ 2 3<br>1 2 3 4 | CO3 | L6 |\n\n## 模块 3\n\n## 数组、字符串和函数\n\n## 什么是函数？\n\n大型程序可以被划分为称为模块的可管理部分，其中每个模块执行特定任务。每个模块称为函数。它是一个自包含的小程序，称为程序段，用于执行某些特定且明确定义的任务。\n\
    \n它分为：\n\n- 库函数/预定义函数\n- 用户定义函数 UDF\n\n## 库函数\n\n由 C 编译器制造商编写的函数称为库函数。这些函数的实现细节对程序员来说是未知的。库函数也称为预定义或内置或内建或标准库函数。C\
    \ 库包含执行标准和预定义任务的各种函数集合。这些函数可供我们在程序中使用。\n\n- 例：sqrt(x) — 计算 x 的平方根\n- Printf()\
    \ — 用于在屏幕上打印数据\n- Scanf() — 用于从键盘读取数据\n\n```c\n/* program to demonstrate the use\
