    # MODULE 5:


    # 5.1 Data Structure in C


    **Data structures** are used to store data in a computer in an organized form.
    In C language Different types of data structures are; Array, Stack, Queue, Linked
    List, Tree.


    +   - **Array:** Array is collection of similar data type, you can insert and
    deleted element form array without follow any order.

    +   - **Stack:** Stack work on the basis of Last-In-First-Out (LIFO). Last entered
    element removed first.

    +   - **Queue:** Queue work on the basis of First-In-First-Out (FIFO). First entered
    element removed first.

    +   - **Linked List:** Linked list is the collection of node, Here you can insert
    and delete data in any order.

    +   - **Tree:** Stores data in a non linear form with one root node and sub nodes.


    # 5.1.1 Array in Data Structure


    An **Array** is a collection of similar data type value in a single variable.
    An array is a derived data type in C, which is constructed from fundamental data
    type of C language.


