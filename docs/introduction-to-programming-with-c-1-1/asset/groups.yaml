    \ 之前被调用。实际上，以下程序的输出取决于编译器。有关详细信息，请参阅此内容。\n\n```c\n// Associativity is not used\
    \ in the below program. Output is compiler dependent.\n\nint x = 0;\n\nint f1()\
    \ {\n    x = 5;\n    return x;\n}\n\nint f2() {\n    x = 10;\n    return x;\n\
    }\n\nint main() {\n    int p = f1() + f2();\n    printf(\"%d \", x);\n    return\
    \ 0;\n}\n```\n\n- 2) 所有具有相同优先级的运算符具有相同的结合性\n\n这是必要的，否则编译器将无法决定具有两个相同优先级但结合性不同的运算符的表达式的求值顺序。例如\
    \ `+` 和 `-` 具有相同的结合性。\n\n- 3) 后缀 `++` 和前缀 `++` 的优先级和结合性不同\n\n后缀 `++` 的优先级高于前缀\
    \ `++`，它们的结合性也不同。后缀 `++` 的结合性是左到右，前缀 `++` 的结合性是右到左。\n\n| Operator | Description\
    \ | Associativity |\n|---|---|---|\n| ( ) | Parentheses (function call) (see Note\
    \ 1) | left-to-right |\n| [ ] | Brackets (array subscript) |  |\n| . | Member\
    \ selection via object name |  |\n| -> | Member selection via pointer |  |\n|\
    \ ++ -- | Postfix increment/decrement (see Note 2) |  |\n\n"
