    \       struct subject marks;\n}STUDENT;\n```\n\nThe above structure consists\
    \ of a member marks whose type is struct subject(another structure). So this is\
    \ called as nested structure.\n\n```\nSTUDENT s;\n```\n\nWe can access the fields\
    \ suing the dot operator as follows:\n\n```\ns.name;\n\ns.usn;\n\ns.marks.marks1;\n\
    \ns.marks.marks2;\n\ns.marks.marks3;\n```\n\n## STRUCTURE CONTAINING ARRAYS:\n\
    \nA single or multi dimensional array of int, float,char and double can be used\
