  md: "# Operating Systems Overview\n\ncan be obtained by running the env command.\
    \ Some common environmental variables are as follows:\n\n+   - PATH: This variable\
    \ contains a list of default paths that the shell searches when a command is invoked.\
    \ For example, the env command mentioned above actually runs a program that is\
    \ (usually) located in the /usr/bin directory. Without a PATH variable, in order\
    \ to run this command, we would have to type the absolute path to the executable,\
    \ /usr/bin/env. Instead, if the PATH variable contains /usr/bin as one of its\
    \ paths (it usually does), the shell will automatically run /usr/bin/env when\
    \ it is invoked.\n- HOME: Contains the location of the user's home directory.\
    \ The files that belong to the current user, including configuration files. By\
    \ default, when a shell is invoked, it automatically navigates to the user's home\
    \ directory unless a configuration variable specifies otherwise.\n- PSI: This\
    \ sets the appearance of the prompt in Bash. The prompt is the text that precedes\
    \ every command that the user types. For example, if PSI is set to \"\\u W\",\
    \ the prompt will display the user name followed by the current directory, between\
    \ the square brackets and followed by the \"$\" sign and a space.\n- TEMP: Contains\
    \ the default location for temporary files.\n\nTo see the current value of a particular\
    \ environmental variable, you can use the echo command, discussed in a later section.\
    \ For example, $ echo PATH will output the contents of the PATH environmental\
    \ variable (in Unix-like systems, a \"$\" in front of a variable name causes the\
    \ variable to be replaced with the value stored within; running \"$ echo PATH\"\
    \ would simply output the word PATH:\n\n```\n$ echo $PATH\n/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin\n\
    ```\n\nIn Bash, environmental variables can be defined using the export command\
    \ (which makes the variable accessible to subprocesses), or by typing the variable\
    \ name followed by the equal sign \"=\" and the value of the variable. For example,\
    \ for user \"erik\", setting PSI=\"\\u rules\" would turn the prompt to \"erik\
    \ rules\":\n\n```\n$ whoami\nerik\n$ PSI=\"\\u rules: \" \nerik rules:\n```\n\n\
    Some environmental variables are defined in configuration files, which are stored\
    \ in the user's home directory and run every time the shell is invoked. These\
    \ files often have names prefixed with a dot \\.\\\n\n```\n$ ls -a\n.\n.DS_Store\n\
    Trash\n.Xauthority\n```"
