  md: "Introduction to Parallel Programming with MPI\n\n#  12.3.3 Potential Pitfalls\n\
    \nThere are few points where you need to be careful to avoid issues, such as hangs\
    \ or deadlocks with point-to-point operations. First, be sure that the value of\
    \ tag is the same on the receiving and sending sides. A solution to avoid this\
    \ problem is to use the macro MPI_ANY_TAG as tag. It will allow the receiver to\
    \ accept a message with any tag value. But be sure that your MPI tag does not\
    \ receive multiple messages with different values or it could lead to wrong results.\
    \ Second, a common issue is the deadlock.\n\n# LISTING 12.5 EXAMPLE USING MPI_Isend\
    \ AND MPI_Irecv\n\n```\nif (rank == 0) {\n  dest = 1;\n  source = 1;\n  MPI_Recv(&inmsg,\
    \ 1, MPI_CHAR, source, tag, MPI_COMM_WORLD, &Stat);\n  MPI_Isend(&outmsg, 1, MPI_CHAR,\
    \ dest, tag, MPI_COMM_WORLD);\n} else if (rank == 1) {\n  dest = 0;\n  source\
    \ = 0;\n  MPI_Recv(&inmsg, 1, MPI_CHAR, source, tag, MPI_COMM_WORLD, &Stat);\n\
    \  MPI_Send(&outmsg, 1, MPI_CHAR, dest, tag, MPI_COMM_WORLD);\n}\n```\n\nIf you\
    \ look at Listing 12.5, it will deadlock. Why? If you look carefully, both MPI\
    \ tasks are waiting for a message, and as it is a blocking receive, the program\
    \ will be blocked at this state until the reception of the message. Unfortunately,\
    \ the message is done after the reception. So, your code will hang until you stop\
    \ it. The order of your message is very important, and you have to be careful\
    \ with it. How do you fix it? You have to change the order on one side, as described\
    \ in Listing 12.6.\n\n# LISTING 12.6 EXAMPLE USING MPI_Isend AND MPI_Irecv\n\n\
    ```\nif (rank == 0) {\n  dest = 1;\n  source = 1;\n  MPI_Recv(&inmsg, 1, MPI_CHAR,\
    \ source, tag, MPI_COMM_WORLD, &Stat);\n  MPI_Send(&outmsg, 1, MPI_CHAR, dest,\
    \ tag, MPI_COMM_WORLD);\n} else if (rank == 1) {\n  dest = 0;\n  source = 0;\n\
    \  MPI_Send(&outmsg, 1, MPI_CHAR, dest, tag, MPI_COMM_WORLD);\n  MPI_Recv(&inmsg,\
    \ 1, MPI_CHAR, source, tag, MPI_COMM_WORLD, &Stat);\n}\n```\n\nNow, everything\
    \ will be fine."
