    # 9.3.4 Porting from 2 to 3


    In the design and release of Python 3, the development team made a significant
    decision to break backward compatibility with significant parts of Python 2. Ultimately,
    to make Python 3 a more consistent, easier-to-use, and more modern language. If
    beginning with Python 2, it is best to program in Python 3. There are many tools
    created to help with porting code from 2 to 3, such as the future module, the
    futurize script, and the 2to3 script. If using a recent version of Python 2, you
    can also import Python 3 syntax using the `from __future__` import. We now review
    the most important "2 to 3" differences related to computational science.


    The print function has changed. It now requires parentheses to enclose its argument,
    instead of adapting standalone strings. Division has changed. In Python 2, dividing
    two integers resulted in an integer (rounded down). In Python 3, it will result
    in a float, unless the operands are floating-point numbers. This is critically
    important for numerical work, especially when using a script someone else created
    in Python 2 to work in. A syntactically incorrect print statement will raise an
    error, but the change in division will silently give you different results. Iterating,
    such as in a `for` loop, has also changed. In Python 2, a commonly used generator
    is `xrange`, but in Python 3, the range function is now in place (and functionality
    equivalent to Python 2''s xrange). By default. In Python 2, string handling has
    changed, with all text strings being Unicode by default, but Python 3 has a bytes
    type to handle binary data. This change may affect users processing large amounts
    of strings for different purposes in their program. Python 3 has many backward
    incompatible changes, but they are often easier to deal with and extensively documented.
    When porting from 2 to 3, an extensive test suite should be prepared and code
    validation tools utilized.'
