  md: '# Introduction to Scientific and Technical Computing


    Instrumenting the code is just a fancy way of saying that you are asking the compiler
    to include human-readable stuff such as names, line numbers, and the code itself,
    so that you can refer back to the original program. When you compile code for
    production, this stuff is left out so that it is more efficient.


    -O0


    This option tells the compiler not to do any optimizations (literally, it tells
    it to use optimization level 0). Modern C compilers are capable of so much more
    than translating C into machine code. Higher optimization levels will do things
    such as unroll loops (write each iteration explicitly, from jumping back and incrementing
    a counter), rearrange the order of instructions (sometimes code can be made to
    run faster and deliver equivalent results), and delete instructions (e.g., if
    result is never used) and all sorts of black magic that has been determined to
    affect results, but that will distinctly not look as the same code that was written.
    So to keep things readable during debugging make sure to include this flag and
    tell the compiler not to optimize.


    23 October 2016


    # 5.4 Running the Program without the Debugger


    So you have compiled and instrumented your code and were careful not to include
    any optimizations. You now have a slow, bloated debugger-friendly code that you
    execute, so


