  md: '# 12.4 Collective Communication


    Collective communications are used when you need to communicate with more than
    two MPI processes. There are different kinds of schemes for collectives: one-to-many,
    many-to-one, and many-to-many.


    Since this is just an introduction to MPI, we will only describe four collectives
    that are generally used inside MPI code: *MPI_Bcast, MPI_Reduce, MPI_Scatter,
    and MPI_Gather*. It is important to note that all processes within the communicator
    group call the same collective function with matching arguments. And just like
    point-to-point, the size of the data sent match the size of the data received.
    The aim of this section is to explain the aim of collectives by describing a few
    of them. The next section shows an example using collectives, but if you are really
    interested in learning more about collectives, I invite you to look at the recommended
    books mentioned in the conclusion.


    # 12.4.1 MPI_Bcast


    ```

    MPI_Bcast( void *buffer, int count, MPI_Datatype datatype, int root, MPI_Comm
    comm )

    ```


    *MPI_Bcast* broadcasts (sends) the content of the buffer (*buffer*) from the process
    designated as “root” to all other processes in the group. The message is identical
    for all destinations and it can contain one or more elements. (It will depend
    on the value of count.)


    # 12.4.2 MPI_Reduce


    ```

    MPI_Reduce(const void *sendbuf, void *recvbuf, int count, MPI_Datatype datatype,
    MPI_Op op, MPI_Comm comm )

    ```


    *MPI_Reduce* applies a reduction operation (*op*) on all tasks on the communicator
    (*comm*) and places the result in the buffer (*recvbuf*) of the root task. MPI
    has predefined operations for *MPI_Reduce*. Figure 12.3 provides a list of some
    of the operations.


    | MPI Reduction Operation | Description |

    |---|---|n| MPI_MAX | Maximum |

    | MPI_MIN | Minimum |

    | MPI_SUM | Sum |

    | MPI_PROD | Product |


    FIGURE 12.3

    A list of some of the operations available with MPI_Send.'
