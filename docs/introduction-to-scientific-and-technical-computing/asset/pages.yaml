    # ##3.1 Introduction


    When working on a codebase, whether it is a decades-old linear algebra package
    or just a small experiment script, it is important to be able to work without
    losing data.

    One approach to preventing data loss is to save a copy of your files with a different
    name each time, usually appended with the date or revision number. Invariably,
    this ends up with a directory littered with files with names "sample_data_v2,"
    "preprocessor_final_rev_2," and "paper_draft_v2_2015_10_21_FINAL_3b." This can
    make finding the most authoritative version of a file difficult.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Introduction to Scientific and Technical Computing


    Another approach is to use e-mail to send copies of files being worked on back
    and forth between interested parties, grabbing the (hopefully) most recent version
    out of the message history and sharing that. This is error-prone, however, and
    makes it difficult to track which changes were made by people—at least for things
    like source code files.


    What we would like to have are that


    +   - Allow us to share our work with others

    - Prevent us from making accidental modifications to our work

    - Allow us to compare different versions of our work to see changes


    The best tools we have for this purpose are source control tools like cvs, svn,
    git, or any of alternatives. We will be focusing on git.


    Git is perhaps the most widely used tool in industry and open-source today, with
    a rich feature set and a large ecosystem built around it. Github is a member of
    this ecosystem and is currently the largest hosting provider for open-source and
    private projects.


    Git is also useful because it is a distributed version control system (DVCS),
    which means that it can be used on your local machine without needing a central
    server. This is a different approach from, say, svn, which requires you to have
    an available connection to your server to get meaningful work done. This is particularly
    useful while, for example, traveling.


    # 3.2 Basic Git


    # 3.2.1 A Simple Overview of Git


    It is helpful to have a basic mental model of git before trying to use it.


    A file directory and its subfolders are files checked into a repository. This
    is done by a .git folder with metadata being inserted into the top level of the
    directory tree.


    The repository is a hidden .git folder that exists at the top level of the directory
    you want under control. It contains the object store and other metadata about
    the project. The working directory is the normal form you do your work in, where
    you change files and do work. The index is where files that are ready to be committed
    are staged. The index is where you batch changes to go into a single commit


    There is an additional feature to git that sets something apart from version control
    systems like cvs or svn: the pervasive use of branches. A branch is a way of working
    on your code in an isolated context. When you are ready, you can merge branches
    together and add your progress to your main codebase. Other people can also maintain
    branches, and this makes it easy to share code with collaborators without ever
    having their changes (or yours!) unexpectedly break the code.'
