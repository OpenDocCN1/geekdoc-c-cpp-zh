    ```


    Again, we see that dynamically linked functions are defined outside of the executable
    (or another library) depends upon


    So, the ldd utility shows what libraries an executable (another library) depends
    upon to run, and nm gives information on specific functions that are either implemented
    in the file or are expected to be implemented elsewhere.


