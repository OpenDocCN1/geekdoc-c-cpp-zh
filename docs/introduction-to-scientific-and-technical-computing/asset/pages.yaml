  md: '# Introduction to Parallel Programming with MPI


    # 12.3.1 MPI_Send and MPI_Recv


    MPI_Send is a blocking send. It means the routine is blocked until it is safe
    to modify the application buffer for reuse. MPI_Recv is a blocking receive. It
    returns only after the data has arrived and are ready to be used by the program.

    The parameters of MPI_Send are the following:


    ```

    MPI_Send(const void *buf, int count, MPI_Datatype datatype, int

    dest, int tag, MPI_Comm comm)

    ```


    And the parameters of MPI_Recv are the as follows:


    ```

    MPI_Recv(void *buf, int count, MPI_Datatype datatype, int source,

    int tag, MPI_Comm comm, MPI_Status *status)

    ```


    There are few parameters, which are common or specific to a function. Let''s look
    at them:


    +   * buf is the initial address of the send or receive buffer.

    * counts the number of items to send or receive.

    * datatype is the MPI data type of item that you want to receive or send.

    * tag is like the message ID. You can only receive a message that matches your
    tag.

    * commi is the communicator, and of course, both sender and receiver need to be
    in the same communicator.

    * status returns information on the message received. It indicates the source
    and the tag of the message.

    * dest is the rank of the destination.

    * source is the rank of the source.


    These parameters are perhaps not be very clear, but we will see how they work
    exactly in an example. First though, I would like to raise a point. As you can
    see, there is a parameter for the MPI datatype. A classical question: Why do I
    need a specific datatype when there is one that already exists in C or Fortran?

    The answer is: MPI is designed to be able to run on heterogeneous systems, sometimes,
    you have 64-bit nodes exchanging messages with 32-bit nodes. The fact that MPI
    has its own datatype allows the MPI library to speak with all different systems
    in a common language. The MPI library takes care of the translation to convert
    the value in a different system.


    Table 12.1 provides an example of corresponding datatypes between MPI and language
    C. This point is important, and it illustrates that MPI_Send and MPI_Recv aims
    to be portable.

    Now, let''s look at an example using MPI_Send and MPI_Recv in Listing 12.3.'
