  md: '# Validation of Computational Models and Codes 271


    +   * What level of accuracy can be expected in the comparison? If the systems
    are quite disparate—for instance, due to computational cost, atomistic simulation
    models typically consider shorter polymers than what can be realized experimentally—then
    we may only be able to achieve qualitative agreement of trends between the two
    sets of results.


    +   * What properties does the model need to reproduce? If we are only interested
    in the behavior of a solid structure, it would be less important to validate that
    the model accurately reproduces the gaseous state. Furthermore, if we were to
    validate against only the gaseous state, and not the solid state, such validation
    would be essentially meaningless.


    When considering both experimental and simulation comparisons, we should also
    ask if the comparisons are themselves methodologically sound. This is particularly
    a concern for older results from both domains. Experimental results may have been
    overturned by new evidence or measurement techniques or because prior protocols
    were determined to be flawed. It is also possible that the experimental protocol
    can directly affect the conclusions of a paper in subtle ways; instance, if raw
    materials are supplied by different sources, resulting differences could be attributed
    to the differences in material preparation and purity rather than an intrinsic
    physical or material property being investigated. Similarly, there may be inherent
    issues with order simulation as result of small system size, insufficient convergence,
    or other "shortcuts" applied to overcome memory or time limitations that were
    more restrictive in the past than they are today. More significantly, such results
    may have been produced with "in-house" codes that are no longer available, compilable,
    or may not have been fully verified, making it difficult to ascertain the root
    causes of any discrepancies that may arise.

    As an example of validation through a model, considering validating the ReaxFF
    [14] forcefield for the elongation of gold nanowires. While ReaxFF forcefield
    was validated against bulk crystals and minimum energy clusters in prior studies
    [15], the dewo computationally relevant first principles density functional theory
    (DFT) calculations were performed for small gold nanowires (diameter, D=1, 1.5,
    and 1.9 nm) and several configurations representing nanowires undergoing mechanical
    deformation. These configurations were used as input to ReaxFF and the energy
    evaluated and compared to DFT. Figure 18.3 plots the DFT energy as a function
    of Reaction for identical structures, where this match occurs when points lie
    on the line y = x. ReaxFF predicts near-perfect agreement with DFT, in terms of
    quantitative values and also the trend of the data, where a least squares regression
    of the data yields a slope of 0.99 (an ideal match would be a slope of 1.0).

    As a further comparison, the same procedure was carried out the tight-binding
    second-moment approximation (TB-SMA) forcefield [17], also shown in Figure 18.3.
    For TB-SMA, significant deviations from the DFT energy are seen and the slope
    of the data is 1.63, demonstrating failure to provide either qualitative or quantitative
    agreement. We must conclude that given this data, ReaxFF is validated for these
    types of nanowires and TB-SMA fails validation. It is important to note that,
    if we invalidated models by relying on available data for bulk crystals, rather
    than performing calculations on the system of interest, that is, nanowires, ReaxFF
    and TB-SMA would pass validation, as both accurately reproduce bulk behavior [15,17],
    clearly highlighting the importance of choosing the appropriate data for validation.


