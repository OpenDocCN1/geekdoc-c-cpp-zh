  md: '# 9.1 Python 3 Essentials


    This section outlines several important aspects of Python 3 and aims to soften
    the transition to Python from languages such as C/C++ or Fortran. Similar to these
    other languages, we discuss types, statements, control flow, and object oriented
    functionality in the context of programming for scientific and technical purposes.
    Python also possesses useful components as modules that greatly aided the scientific
    programmer. With an understanding of these essentials, inexperienced programmers
    should be well on their way to writing their first script, while experienced programmers
    should feel comfortable diving right in the language and beginning to create useful
    code.


    # 9.1.1 Running a Python Script


    Python is a runtime compiled language, like Java and unlike C/C++ or Fortran.
    This means that to execute a Python script, the user must invoke the Python interpreter
    to parse, compile, and execute. This is all done in one invocation and usually
    performed in two ways. The first is by invoking the interpreter from the command
    line and passing the script, in this example, called my_script.py.


    ```

    [user@host ~]$ python3 my_script.py

    ```


    The second is by including the following line at the top of my_script.py to tell
    the command to call the interpreter:


    ```

    #!/usr/bin/env python3

    ```


    If the second method is chosen, the user can run the script directly and ensure
    it has executable permissions.


    ```

    [user@host ~]$ chmod +x my_script.py

    [user@host ~]$ ./my_script.py

    ```


    # 9.1.2 Built-In Types and Their Uses


    Below, we see some of the most useful and common Built-in types in Python. These
    will become the building blocks of your Python script or program, and have most
    analogs in C/C++, Java, and Fortran. What sets Python apart is that many of these
    common types have functions within them that take the place of commonly written
    code. The user does not have to declare any of these common types, as would occur
    in C/C++ or Java—just define them to start using your code. Once we have learned
    a few of the essential Built-in types, we will see how they can be used with statements
    and control flow to build more complex scripts or programs.


    # 9.1.2.1 Lists


    Lists are Python''s containers that hold objects in a given order. These might
    sound like arrays to C/C++ or Fortran followers; however, they are slightly different.
    The "array" in Python exists, with the addition of an external module, and will
    be covered later in this chapter. Experienced users of C++ will recognize a similar
    container from the Standard Library.'
