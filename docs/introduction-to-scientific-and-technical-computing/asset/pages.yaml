    or "single precision" uses 32 bits or 4 bytes to store a number. We are all agreed
    on that! Looking a little closer, we see that there are three groups of bits:
    the sign, the exponent, and the fraction (aka mantissa, to use a fancy term).
    The sign seems straightforward, like integers: think of numbers as positive and
    negative, and we use the first bit to say which is it. And it turns out that the
    standard says 0 means the number is positive, and 1 means it is negative. Might
    not seem intuitive. It is done this way for the same reason as negative numbers
    are stored two''s complement. It is just more convenient for the machine to handle
    addition and subtraction.


    To understand the exponent and mantissa, think scientific notation, instead of
    writing 2.1875 × 10⁻¹, it has to be in binary! In scientific notation, we are
    used to seeing a number written in terms of an exponent and powers of 10, for
    example, 2.1875 × 10⁻¹ = 2 × 10⁻¹ + 1 × 10⁻² + 8 × 10⁻³ + 7 × 10⁻⁵. Interpreting
    in terms of powers, 0.21875 becomes ... × 2⁻³ = (1 × 2⁻¹ + 1 × 2⁻² + 0 × 2⁻³ +
    0 × 2⁻⁴...) × 2⁻³. A little confusing, but let us not concern ourselves with this
    representation, only to convince ourselves it can be.


    So this gives us a value of the exponent = -3, and a set of ones and zeros for
    the mantissa = 1100.... To makes more confusing, the standard provides that the
    exponent be stored as an unsigned integer, but the value of zero being represented
    by the binary value 01111111 (decimal 127) or positive or negative exponent values
    counting up or down from there. This is done for machine efficiency, definitely
    not for clarity to the science student! Under this representation, our exponent
    value of -3 is represented by the binary 01111100.


    To store the mantissa, the binary number gets shifted left or right (and the exponent
