  md: '# Introduction to Scientific and Technical Computing


    The exercised code, or test code itself, causes an error, it is often treated
    as a separate outcome from that of an exercise that completed but whose result
    was incorrect. Tests can commonly be reported as one of three verifications: passed,
    failed, or error.

    As with setup, any expected value for comparison or assertion is most useful when
    it is accessible as directly as possible. Running calculations for comparison,
    risks introducing parts of the system under its own verification, invalidating
    its utility. Wherever possible, the storage of preprocessed expected values is
    desirable.


    # 17.3.1.4 Teardown


    The system is returned to its pre-setup state. Any records of test results or
    of computed values that need to be persisted should be written. In systems or
    languages with manual management of resources such as memory, file descriptors,
    database connections, network sockets, or like, freeing these resources should
    occur during this phase.


    # 17.3.2 Additional Testing Terminology


    # 17.3.2.1 Test Case


    When writing multiple tests for valid input (also called an edge case), for instance,
    to test behavior at the boundaries of valid input—often, the entire set of these
    are referred collectively as the tests, with each individual clause or subunit
    referenced as a test case to differentiate them.


    # 17.3.2.2 Test Harness


    A framework (flexible program library) that assists in setting up resources for
    tests and possibly provides advanced assertions not native to the language or
    environment is known as a test harness.

    For instance, rather than having every single suite connect to an external resource
    (database, third-party service, logging system) before each of the hundreds of
    tests in a test suite, a harness will set this up once on behalf of all tests,
    which are then executed in the environment the harness provides. Most harnesses
    help unify the output format of results. This is often a list of each test passing,
    failing, or having caused an error, they occur. More advanced harnesses might
    produce an itemized final report saved somewhere, as a shared web portal, for
    future reference by a team.


    # 17.3.2.3 Test Fixture


    Tests must be reproducible. While being able to run a test with the same input
    data is one important aspect of this. While a test harness provides common tools
    and procedures, test fixtures are sources that one or more test cases operate
    on (using as input).

    Fixtures work when stored as static data (so-called "hard coded values"), but
    this is not always possible. However, however data are dynamically generated,
    it must be reproducible with ease. The most common example of this is using a
    random number generator. When doing so, always use a seed value and provide method
    of specifying the seed value for a test run. Seeds allow for the same sequence
    of random numbers to be generated. Recording this seed value by including it in
    the test output will allow for reproducible successes and failures. A test suite
    with transient failures is simply not useful.'
