    Every action in a Unix-like system involves running a program, since shell commands
    are themselves programs. Processes (i.e., instances of execution of a program)
    can be run interactively or in the background. Interactive processes expect direct
    input from the user (if needed) and produce output directly to the terminal (unless
    redirected). While an interactive process is running, the user cannot run other
    commands unless the process is moved to the background. Processes running in the
    background, however, allow the user to run other commands while they are running.
    Note that, however, a utility such as nohup is used, background processes started
    within a shell will be automatically stopped when the user exits the shell.


    Every running process in a Unix-like system uses two outputs, standard output
    and standard error. As their name indicate, the standard output stream is used
    for the program''s normal output, whereas the standard error is used for error
    messages. In addition to these streams, processes can communicate with other processes
    via signals and pipes. Signals are notifications that processes send when particular
    events occur. Often, these events are raised to errors arise while executing,
    such as invalid mathematical operations (e.g., a division by zero), an illegal
    instruction, or by the process exceeding maximum file size or CPU time limits.
    Processes have defined signal handlers, which receive signals and respond to them.
    In some cases, signals trigger a core dump, which means a copy of the memory of
    the process is stored on the hard drive.


    Signals can be sent to running processes from the shell using the kill command.
    This command identifies processes by their process identifier (PID), which can
    be identified by name, or number. Some of the signals are used in managing processes
    with kill include the following:


