    # 14.1 Checkpointing and Restarting


    Checkpointing is a technique for providing fault-tolerance to a code, particularly
    when the code runs on a complex system with multiple potential points of failure,
    and which consumes considerable time and/or resources. It involves taking a snapshot
    of the state of the program and the values of all variables that change as the
    program continues to run and saving, typically to disk, so that if a failure (power
    outage, hardware fault, network outage, etc.) occurs, the program may be restarted
    from this saved state information. In the move ever more towards parallelism,
    the issues of fault tolerance become more poignant. The larger and more complex
    a computing system is, the more processors, circuits, and the greater the possibility
    of failure at some point in the system during the course of simulation.


    Major research computing facilities are typically one-of-a-kind installations
    and experience failures as a regular part of operations. As such, they now require
    that user code employ an appropriate level of checkpointing and will refuse to
    reimburse even if the failure is obviously due to the service provider. If a code
    runs for 10 minutes on a laptop, it probably doesn''t need the checkpointing and
    restart capabilities. However, if it runs for 100 hours on 1024 or more processors
    on a research cluster, it most certainly does.


    A typical checkpointing scheme might have the following requirements:


    +   * Ability to save the state of the simulation at regular intervals

    * Ability to restart the simulation, given the executable and a restart file

    * Ability to read simulation data and possibly restart on a different platform

    * Ability to examine contents of a restart file

    * Ease of implementation'
