    \ function _get_thread returns the integer id number of the thread. In this case,\
    \ each thread will call big _calc1, the store result in A[id], where is the thread\
    \ id, and wait at the barrier for the other threads to catch up. Once all the\
    \ threads arrive at the barrier, threads will start executing iterations from\
    \ the first loop. Threads will again wait at the implicit barrier at the end of\
    \ the first loop before proceeding to the final loop. For the final loop, the\
    \ threads have a nowait statement that bypasses the implicit barrier at the end\
    \ of the loop. Some threads might be executing big _calc4, while other threads\
    \ are performing iterations in big _calc2."
