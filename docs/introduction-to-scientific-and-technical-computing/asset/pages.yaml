    One very straightforward use of one byte is to store the value of a number. The
    simplest represents the nonnegative integers from 0 to 255. It would be an easy
    choice to say that 00000000 represents 0, 00000001 represents 1, 00000010 represents
    2, and so on. A lightly fancy encoder of the bits in a byte allows us to represent
    negative integers: We could say that if the first bit is zero, then the number
    is negative, for example, and that -1, the negative integer closest to zero, would
    be encoded by 10000000. Depending on the choice of how numbers are encoded into
    bits, operating on those numbers and interpreting those numbers can vary drastically.
    In order to avoid the headaches that arise from different encoders, the computing
    community has created encoding standards.


