    to make multiple substitutions by piping the output of one sed command to "|",
    which is often useful.


    Another useful command in sed is "d", which allows to delete a line if it matches
    an expression or a range of lines. For example, "$ sed ''/four/d'' potatoes.txt"
    will delete the second line in our example, whereas "$ sed ''1,3'' potatoes.txt"
    will delete lines 1 through 3 (leaving only the fourth line)


    Finally, another common use of sed is printing a particular range of lines in
    a file. This can be done using the -n option (which turns off printing every line)
    and using "p" to request printing lines that match a particular expression or
    range of lines. For example sed -n ''1,3/p'' will print lines 1 through 3 in the
    file, whereas sed -n ''3~5/p'' will print first line every fifth line starting
    with the third one (this works in GNU sed).


