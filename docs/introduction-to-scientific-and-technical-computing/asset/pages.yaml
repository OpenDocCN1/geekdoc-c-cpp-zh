  md: '# Makefiles, Libraries, and Linking


    Building a dynamic library is very similar to building a static library but requires
    a few additional options in the compile commands, namely, that -fPIC is specified
    when compiling each component (stands for position independent code):


    ```

    c_function.o: c_function.o c_function.h

    $ $(CC) -fPIC -c c_function.c

    ```


    ```

    c_function_d.o: c_function_d.c c_function_d.h

    $ $(CC) -fPIC -c c_function_d.c

    ```


    and the library is created from the .o files by the compiler using the -shared
    option:


    ```

    libmy_c_functions.so: c_function.o c_function_d.o

    $ $(CC) -shared -o libmy_c_functions.so c_function.o c_function_d.o

    ```


    Building the c_program itself uses the same command:


    ```

    $ $(CC) c_program -L -lmy_c_functions -o c_program

    ```


    The GNU Compiler will choose the .so by default both the .so and .a versions.
    An important tool for determining which shared libraries are used by a program
    is ldd (list dynamic dependencies), which will display the names of the dynamic
    libraries on which it depends. These typically include system libraries, the standard
    library (libc), as well as user-defined libraries:


    ```

    $ ldd c_program

    linux-gate.so.1 => (0xb76ec0000)

    libmy_c_functions.so => ./libmy_c_functions.so (0xb76e6000)

    libc.so.6 => /lib/i386-linux-gnu/libc.so.6 (0xb7523000)

    lib/ld-linux.so.2 (0xb76ed0000)

    ```


    Notice the dependence on our libmy_c_functions for the executable built with dynamic
    linking. By contrast, the statically linked version does not:


    ```

    $ make clean

    $ make -f Makefile.static c_program

    $ ldd c_program

    linux-gate.so.1 => (0xb77830000)

    libc.so.6 => /lib/i386-linux-gnu/libc.so.6 (0xb75bd0000)

    lib/ld-linux.so.2 (0xb77840000)

    ```


    # 6.3 Linking


    To summarize linking, consider the nm command, which allows the user to view symbols
    (functions, global variables, etc.) in an object file. For our c _function.o:


    ```

    $ nm c_function.o

    000000000 T c_function

    ```'
