    # 3.3 Basic Github


    Github (http://www.github.com) is where the majority of open-source development
    happens today. There are also other alternatives, like Bitbucket (https://bitbucket.org/).


    Github provides repository hosting, easy user management, issue tracking, and
    a way for easily allowing people to clone your codebase and submit back patches.


    # 3.3.1 Creating a Github Repository


    Once you have created a Github account, you can create a repository from the new
    repository page (https://github.com/new), which can be accessed directly or from
    the “Create Repository” option of the “Create new…” menu in the upper-right-hand
    corner. You will be prompted for


    +   - A repository name

    - A description of the repository

    - Whether or not the repository will be public (viewable by anyone) or private
    (only to added collaborators)

    - Whether to initialize it with a README file (containing the description of the
    repository)

    - What gitignore file to use, in order to block out common artifacts

    - What license file to include, in order to clarify how the code may be used and
    distributed'
