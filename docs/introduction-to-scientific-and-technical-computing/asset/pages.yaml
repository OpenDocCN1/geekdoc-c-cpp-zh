  md: '# Testing and Verification


    # 17.3.2.4 Test Coverage


    A test or test case is said to "cover" a piece of code if it executes the code
    and makes assertions about its functionality. The term test coverage or sometimes
    code coverage is often used to discuss what percentage of a project''s code is
    exercised by a full run of its tests. In practice, tools that help put a number
    on test coverage tend to be quite rudimentary, simply counting the lines of code
    involved in execution and comparing that to total lines of code.


    As an example of the shortcomings of this method, imagine a test suite for a project
    that implements basic arithmetic. A code coverage tool might count multiplication
    as being covered when a single test is run with inputs of 1 and 1, as in multiply(1,1).
    Despite this test suite having multiply it could be fooled by implementing multiply
    in a way that always produces the value 1. No sane programmer would be satisfied
    with that test, but it demonstrates that code coverage, while sometimes a useful
    heuristic, is not a true measure of the quality of a test suite.


    # 17.4 Major Types of Automated Software Testing


    With having grown so integral to much of research, never mind the broader society,
    one might easily be familiar with the phrases "stress testing" and "scalability
    testing" from the popular lexicon. However, these are less frequently aspects
    of software testing, relative to the most common three or four: unit tests, functional
    tests, integration tests, and system tests.


    This ambiguity of three or four arises because for programs or applications, there
    is little difference to be made between functional and integration tests. As will
    be explained, unit tests are the smallest scope of verifying program behavior,
    and system tests are the most expansive and all-encompassing. The space in between
    is not wide enough to discern categories of tests, but as applications grow, there
    arises a difference between functional and integration tests.


    Another note on ambiguity and terminology: software is a fairly young discipline,
    some literature or online invert the scale of functional and integration tests
    such that integration tests are proposed as a finer granularity than functional
    tests, or use "functional test" in place of "system test" as the largest scale
    of test. Presented here, is the common notion that the major types of tests, ordered
    from smallest scope to largest scope, are unit, followed by functional, then integration,
    and finally system tests.


    # 17.4.1 Unit Tests


    A unit typically exercises a single function. The goal is to have the finest granularity
    possible. For object-oriented systems, the unit may be a class, especially if
    that class has a limited public interface. Many unit test enthusiasts will adhere
    to a rule of one assertion per test case, but this is not a strict requirement
    for a test to be considered a unit test. It is nonetheless preferable to limit
    the number of assertions in each case and group together those assertions that
    are truly related within the project''s domain. Judicial division of assertions
    across multiple cases provides the most fine-grained, and thus most informative,
    feedback. This is particularly true when edge cases for a function or module are
    involved.'
