  md: 'Introduction to Scientific and Technical Computing


    There are many simple tasks that can be done easily with awk within the shell,
    which avoids having to transfer files and opening them with different programs.
    For example, a common task when running simulations calculating average values.
    A simple code that does this in awk


    ```

    awk ''BEGIN{tot=cnt=0}{tot+=$1;cnt}END{print tot/cnt}''

    ```


    This will print the average of the numbers on the first column in the file. You
    can pipe the output of the tail command in "ENERGY" example about this and it
    would return the average energy (replacing the $1 with $2). If you find yourself
    using a script like this, you can create an alias to your .bashrc file, for example:


    ```

    alias findavg=awk ''BEGIN{tot=cnt=0}{tot+=$1}\nEND{print tot/cnt}''

    ```


    You can automate similar tasks, such as calculating standard deviations and standard
    errors, in a similar way. In addition to simple arithmetic, awk has a number of
    special functions available, such as trigonometric functions, exponential, logarithm,
    and square root.


    There is much more to awk than what we have covered in this chapter, as it is
    a fully featured scripting language. However, as mentioned, for tasks that are
    much more complex, it is more efficient to use a language like Python, which is
    covered in a later chapter.


    The final command we will mention in this chapter is a simpler one: the character
    tr. This command provides the ability to substitute or delete characters from
    a text stream, including special characters such as the newline (represented as
    \n), carriage return (\r), tab (\t), and others. It can also be used to delete
    repeated instances of a character with the -s option, as illustrated in Section
    1.6. For simple substitutions or deletions, especially those involving newlines
    and other special characters, tr often has a simpler syntax than the sed or awk
    commands, which carry out the same tasks. As example, the command to replace newlines
    in a file with commas," would be, using tr:


    ```

    tr ''\n'' '':'' < file

    ```


    whereas achieving the same result in awk would require manipulating the record
    separators:


    ```

    awk ''BEGIN{RS="\n"; ORS=":"}print $0''

    ```


    which is much longer.


