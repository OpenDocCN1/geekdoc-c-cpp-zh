    This approach maximizes the freedom of all the individuals in the community to
    work with the code, to extend it, and so on. At the same time, it prevents commercialization
    of the code itself, although it does not prevent a commercial company charging
    for installation, support, training, and other activities around the software.
    This is indeed the business model of successful companies like RedHat and SUSE,
    building upon the open source Linux operating system. Clearly, such an approach
    works well when there is a large active community of users who can contribute
    to the project. It is less obvious when it works with a small community of users,
    where it might be hard to find enough users to support and develop the code. If
    you are thinking about leaving your code under a copyleft license the GPL, and
    you expect that the code will last for a long time, you should think whether you
    intend to maintain and develop the code for long time or if there will be a sufficient
    community to take it over. If the community is small, it is possible that they
    will change jobs or no longer be able to work on the code, in case it might die
    for lack of support. This happens all the time—there is a natural selection of
    software going on—which is not a problem unless your software should continue
    to live. If the community is small, will you be the main supporter of the code
    for a long time? They provide almost complete freedom to the initial users but
    not guarantee that subsequent users will have the same rights. Permissive licenses
    allow this by allowing you to redistribute the software under a different license,
    which can be anything from a copyleft license to a commercial license. A user
    can modify and the code but is not forced to give it back to the community. This
    is why the licenses are called “permissive”—a user can do anything with the code,
    including incorporating it into a commercial product. Of course, you might not
    like someone else taking your code and promoting from it, or not giving you the
    changes back to you. However, if the community is small, and your software has
    commercial value, using a permissive license does open another avenue if you want
    the code to continue living but you cannot or not to continue working on it.


    Partial copyleft licenses, like the Mozilla Public License (MPL-2) and the GPL,
    split the difference. If you use a license, your code can be incorporated into
    a larger work that might be under a different license, but your code and modifications
    to your code remain under a copyleft license where the changes must be made to
    the entire community. Typically, these licenses work at the level of source files,
    so any changes in the source files that you distribute remain public, but the
    GPL operates at the level of libraries, allowing an GPLed library to be linked
    with copyleft code differently. As with the permissive licenses, this increases
    the community of supporters for your software to include commercial software companies,
    although they would be obliged to publish modifications to your code, which is
    not the case with permissive licenses.


    The final type of license, the proprietary license, is self-explanatory. You maintain
    much control over your software as you wish and can forbid users from copying
    the software. This is the typical approach of commercial companies, who charge
    for the software and use to support and maintain the code, as well as for profits,
    and others.


