    "Packed" matrices are used to encode symmetric and Hermitian matrices, which are
    determined by half of their elements. "Banded" matrix formats are used to encode
    matrices where all elements are zero except for a band. That is, for nonzero integers
    p and q, the matrix elements $a_{ij}$ = 0 where $j < i-p$ and $j > i+q$.


    # 15.4.2 Parallelism


    Most processors on the market today are of a multicore design: each processor
