    \ version first to ensure that any errors are arising from the parallel execution\
    \ or not incorrectness of the algorithm itself. One strategy to assist in this\
    \ is to isolate the behavior of each concurrent thread or process through the\
    \ mechanism of concurrency.\n\nThe simplest example of this is to have the primary\
    \ behavior or calculation in one function, and another which orchestrates any\
    \ threads, processes, or other parallel mechanism. Depending on environment and\
    \ tools, even a simple solution as a separate function may come at a performance\
    \ cost, and thus, there may be a tradeoff between the ease of code organization\
    \ and the needs of a running system.\n\nIf tests are written when concurrent code\
    \ is explicitly interleaved (e.g., to expose a race condition), there must be\
