    # 18.4.3 Comparisons with Existing Results


    If we now consider the inputs to be accurately defined, we must determine if the
    model itself produces the correct behavior. As mentioned previously, sanity checks
    can help us eliminate models that are clearly wrong, but it does not provide us
    with knowledge of whether the model is actually correct. One of the best ways
    of validating a model is to compare its results to a “known” system. What constitutes
    a known system has evolved in decades from purely theoretical and experimental
    systems now include properly curated simulations. For many problems, there may
    now be an abundance of choices for sources which researchers can test their models
    and codes. However, given this proliferation of results, how can we decide which
    results, if any, are actually suitable for validation purposes?


    There are a number of questions we can ask to determine how useful an existing
    result will be for comparisons.


    +   - First, and most importantly, how similar are the systems that are being
    compared? For instance, even both diamond and graphite are allotforms of carbon,
    results for one model are unlikely to be in agreement with the results of other.
    Similarly, it is well known that various biomolecules behave very differently
    in pure water compared typical biological conditions (in a salt solution of strength
    about 0.150 M).

    - If the systems are compatible, the “operating conditions” compatible? It may
    be possible to use a model developed for a liquid at 300 K for a gas at 1000 K
    to compare with someone else’s results at 1000 K, but such comparisons make sense
    only if the computational model is known to be valid for a gas at 1000 K (i.e.,
    models may or not be fully transferable to different thermodynamic statepoints).'
