    Data scoping clauses are used to specify how OpenMP handles variables in parallel
    regions. They follow directives, take a list of variables as arguments, and take
    the following form:


    Commonly used scoping clauses include the following:


    +   * private(variable list): Each thread has its own copy of the specified variable.
    Variables are undefined after worksharing region.

    * shared(variable list): Threads share a single copy of the specified variable.

    * default(type): A default of private, shared, or none can be specified. Note
    that loop counter(s) of worksharing constructs are always private by default;
    everything else is shared by default

    * firstprivate(variable list): Like private, but copies are initialized using
    value from the master thread’s copy.

    * lastprivate(variable list): Like private, but the final value is copied out
    to the master thread’s copy. With for/do shares, the last iteration is copied,
    and with sections, the last section is copied.

    * reduction(op:variable): Each thread has its own copy of the specified variable.
    Reductions can appear only in reduction operation. All copies are “reduced” back
    into the original master thread’s variable.


