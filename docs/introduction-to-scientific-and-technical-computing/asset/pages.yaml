  md: '# 9.1.2.2 Tuples


    Tuples are another type of container for objects, that are immutable, or unchanging.
    Once created, their contents cannot be altered. They are made just like lists
    using the parentheses, (), and for a tuple called tnames = (''my'',''name'',''is'')
    or t123 = (1.0,2.0,3.0), setting tnames[0] = ''your'' or t123[2] = 4.0 would return
    an error.


    # 9.1.2.3 Strings


    Strings are objects that handle text within Python and are also the basic unit,
    or character, of text. Creating a string is simple in Python using single or double
    quotes, and printing the string is as just as simple.


    ```

    name = "John Clees"      # create a string

    print(name)               # John Cleese

    ```


    The string object is actually a list of immutable strings, each with a length
    of 1. So, printing name[0:4] would return John and setting name[0:4] = ''Brad''
    would return an error. If you would like to change John to Brad, we would need
    to create another string, such as ''Brad''+name[4]. There are also many Built-in
    functions. For example, to split a list of text into list of strings, one use
    ''''.split(name), or name.split() to operate on name and remove whitespace. To
    join an array of objects into a single string object, use ''''.join(name) or name.join().
    It is an example of this.


    ```

    >>>name = "John Cleesse"      # create a string

    >>>first_name = name.split()      # split string into a list

    >>>print(first_name)

    [''John'', ''Cleese'']

    >>>print(first_name[0])

    John

    >>>name2 = ''''.join(first_name)      # combine list of strings

    >>>print(name2)

    JohnCleese

    ```


    # 9.1.2.4 Dictionaries


    A dictionary in Python is not directly available in Fortran, and similar to the
    map container in the C++ Standard Library. It is useful if you want a container
    for your data and are able to access the data by a label. They consist of key/value
    pairs separated by a colon in array and are unordered. Dictionaries are similar
    to lists, but their syntax uses curly brackets, {}. The indices of a dictionary
    are the keys and can be immutable object, for a given dictionary name = {''spam'':1.0,
    ''parrot'':0.0}, the keys would be spam and parrot. To access an item in a dictionary,
    just use its key as the index: monte[''spam''] returns 1.0. The function .keys()
    operating on a dictionary will return a list of the dictionary''s keys.


    # 9.1.3 Statements and Control Flow


    Python controls the decisions that a computer can make in a similar way as other
    languages, through if/then/else statements and loop structures with specified
    termination'
