  md: '# Introduction to Scientific and Technical Computing


    To review a pull request, you will typically look at the summary of the changes
    in the form of changed files and commits. If you have changed many files, this
    can become difficult. In order to help avoid having small, focused pull requests,
    you can also comment on the request in its discussion thread, which can be useful
    for discussing changes.


