    # 17.6 Concrete Uses of Testing


    # 17.6.1 Understanding and Modifying Legacy Code


    When an existing project, one of the first steps to understanding the existing
    code is to run any existing tests. Reading the code for the tests pass can be
    a very useful step in understanding how the code was intended to be used.


    If there are no tests, before you modify any program behavior, it is useful to
    execute the code with several different sets of input and capture these as test
    cases. These are often called characterization tests, in that they characterize
    the state of the program without necessarily asserting that its behavior is correct
    or desirable. If the legacy system is known to be functioning correctly, these
    tests will help guide any changes. If the system is not known to be functioning
    correctly, there is at least a baseline to what functionality has been affected
    by any changes the programmer makes.


    # 17.6.2 A New Project with Many Unknowns


    In a new project that will require significant exploration (in terms of code,
    rather than science), or any situation where requirements may be unclear or rapidly
    evolving, it comes to pass that entire modules of code are thrown out and rewritten.
    This exploratory style of coding is called a code spike or simply a spike, and
    its goal is to learn more about the problem or domain, rather than to produce
    a specific, stable implementation.


    In projects or project phases using a spike, an excessive focus on unit testing
    is not always helpful as it would be in more stable projects. Loose integration
    or system tests can help the team decide when milestones have been reached. Unit
    tests and should still be implemented but can be delayed until requirements stabilize.'
