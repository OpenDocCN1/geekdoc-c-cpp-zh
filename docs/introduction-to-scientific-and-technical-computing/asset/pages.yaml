    A common workflow is to run a serial application (requiring a single core) across
    numerous nodes and cores allocated to a job. Each of the commands issued is identical
    but feeds different inputs to the application and hence may generate different
    outputs. Such a workflow may be used in a sweep of a parameter space, for example.
    This workflow is considered embarrassingly parallel; there is no communication
    required between the tasks (serial commands) that are executing simultaneously.
    If an embarrassingly parallel job takes 10 weeks on a single core, it will take
    approximately 1 week on 10 processors.'
