  md: '# Introduction to Scientific and Technical Computing


    A basic CMakeLists.txt file should contain the minimum required CMake version,
    specifies the name of the project, and specifies the code that will be compiled
    and executed (Listing 8.1). The add _ executable directive declares the name of
    the binary to compile and specifies the source files on which it depends, project
    specifies the project name, and cmake _ minimum _ required specifies within the
    src minimum acceptable CMake version.


    # LISTING 8.1 src/CMakeLists.txt: A Minimal Input Used by CMake to Manage a Project


    ```

    cmake minimum required(VERSION 2.6)

    project(Example)

    3 add executable(Example example.cpp)

    ```


    In this chapter, our example C++ code will double input given by the user (Listing
    8.2).


    # LISTING 8.2 src/example.cpp: A Program That Doubles a Number


    ```

    1 #include<iostream>

    2 int doubleNumber(int x){return 2*x;}

    3

    4 int main(int argc,char**argv)

    5 {

    6 using namespace std;

    7 int x = atoi(argv[1]);

    8 cout << doubleNumber(x) << endl;

    9 return 0;

    10 }

    ```


    Before compiling our project, we first create a build directory in the src directory
    and navigate into it:


    ```

    $ mkdir build

    $ cd build

    ```


    Building from within the build directory will avoid cluttering the src directory,
    making it easier to manage the files without, facilitating the use of version
    control software like git or svn.

    CMake uses CMakeLists.txt to create a Makefile that is customized for our build
    environment, which we subsequently use as input to the program make to actually
    build our project. To create the Makefile in the build directory we:


    ```

    $ cmake ../

    ```


    after which we see that CMakeCache.txt, CMakefiles/, Makefile, and cmake_install.cmake
    have been created in the build directory. The next step to building the Example
    executable (which we specified in CMakeLists.txt) is to invoke make, which makes
    the Makefile by default:


    ```

    $ make

    ```'
