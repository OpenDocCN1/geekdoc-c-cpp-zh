  md: '# viii


    # Foreword


    computing classes in programing for Fortran and C, performance optimization, visualization,
    data management, and other scientific computing skills. At TACC, we were at the
    forefront of computational science, and we volunteered our time to share our expertise
    by teaching classes so students could learn these skills, which were not addressed
    by the computer science curriculum. Our "scientific computing curriculum" courses
    were elective for students, but they increased in popularity as students in science
    and engineering at UT realized the need for such skills and understanding to pursue
    their degrees, especially in graduate research. The classes filled a gap in the
    curriculum for future scientists and engineers in training, and our course slides
    filled that gap addressed by textbooks.


    I am pleased that the curriculum pendulum is starting to swing back in the United
    States, with more universities now offering scientific computing classes: sometimes
    in science or engineering departments, sometimes in computer science departments,
    sometimes in new scientific computing/computational science programs. Public appreciation
    of the importance of computational science seems to be on the up. The advent of
    the "Big Data" era has impacted science as well as business; data-driven scientific
    discoveries such as the Higgs boson and confirmation of gravitational waves have
    made mainstream media headlines, as have research advances in medical research.
    The White House "National Strategic Computing Initiative," announced in 2015,
    has helped to increase public awareness of the need for "exascale" computing systems
    for new scientific discoveries, industry competitiveness, and national security.
    However, the general shortage of scientific computing classes at universities
    remains, as does the scarcity of high-quality, up-to-date textbooks. I am thus
    very proud that one of the very talented TACC (former) staff who volunteered his
    time to teach these skills led a team to prepare a comprehensive, up-to-date scientific
    computing textbook. For this effort, Frank deserves far more appreciation from
    scientists and engineers than he is likely to receive, as is usual for a textbook
    author. Nonetheless, I have high hopes that this textbook will enrich the education
    of many students, and enable many new classes to be taught at universities nation-
    and worldwide. Better trained scientists and engineers will use computing more
    effectively to do better science and engineering, producing discoveries and innovations
    in research, industry, and national security for which we all benefit—even if
    we don''t appreciate it, all the time.


    Jay Bisseau

    Vizias Computing

    Austin, Texas'
