    \nThis tells us in order to make the function name unique (for different types\
    \ of argument list) C++ compensates by mangling the function name in a unique\
    \ way. The function name is still there, but there is extra stuff that makes it\
    \ unique. But how do we know what to call? That is more complicated than just\
    \ adding an underscore. Frequently, C++ provides a solution in the form of extern.\n\
    \n# 7.5 External Linkage/Externing\n\nName mangling can be avoided by extern.\
    \ This is not to be confused with extern, a keyword applied as a variable modifier,\
    \ which indicates that the variable is to be allocated out of the side of the\
    \ current file. Declaring a function or block of code as \"extern C\" in a C++\
    \ file indicates that a C-style linkage be generated for the function name. When\
    \ C or C++ is compiled with the C++ compiler, the macro __cplusplus__ is defined,\
    \ allowing the preprocessor to handle bits of code differently. In this example,\
    \ we have used \"extern C\" to ensure that our C++ functions cpp_function() and\
    \ cpp_function_() will not have their names mangled by compilation, so that they\
    \ can be more easily called from C, or Fortran:\n\n```\n// cpp_function.hh\n```\n\
    \n```\n#ifdef __cplusplus\nextern \"C\"\n{\n#endif\nintcpp_function(int *);\n\
    intcpp_function_(int *);\n#ifdef __cplusplus\n}\n#endif\n```"
