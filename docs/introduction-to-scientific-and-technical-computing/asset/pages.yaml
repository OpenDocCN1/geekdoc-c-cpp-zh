    # 16.3 Intel Many Integrated Core Architecture


    The Many Integrated Core (MIC) architecture from Intel is another example of modern
    accelerator technology that pushes the envelope for parallel computing. It combines
    many smaller, lower-power Intel cores into a single chip to achieve a high degree
    of parallelism and better power efficiency. One advantage of the MIC-based accelerators
    over GPU accelerators is that the Xeon Phi has extended the x86 instruction set
    to support wide vector processing units and uses standard programming models,
    such as message passing interface (MPI), OpenMP, and hybrid MPI + OpenMP, which
    make development simpler. The current generation of the Xeon Phi is attached to
    the host via PCI Express bus on a heterogeneous node. The host processor drives
    both operation and computation of the accelerator. The next generation of Xeon
    Phi (Knights KNLI) offers a path to operate as a standalone processor and will
    be binary-compatible with ordinary Xeon processors.


    A typical KNC accelerator contains 60+ cores running at a lower clock speed (1.05–1.2
    GHz) for less power consumption. Each KNC is capable of four hardware threads,
    but a thread on a KNC core can only issue instructions every other cycle. Thus,
    a minimum of two threads per core is needed to fully utilize the resource. Each
    core supports 512-bit wide vector instructions, compared to 256-bit unit for a
    host processor, and has a 512 KB L2 cache. Each core delivers double-precision-floating-point
    operations per cycle. Memory on a chip is limited to 64 GB and is not shared with
    the host processors. Communication with the host processor has to go through the
    PCI Express bus.


