    the code, we stated that it would take one command argument, which would be the
    length of the array to be generated. Since we did not specify a value, atoi()
    received "null" and the program crashed and died. What is to be done? Turns out
    that gdb can do a postmortem on a dead program, and this will be our point of
    entry, but first, gdb needs one more thing: a core dump.


    # 5.5 Core Dump


    When a program terminates abnormally, the OS will attempt to “dump core” if permitted.
    A core dump is a snapshot of what the program looked like in memory when it was
    executing. When a program dies unexpectedly, the core contains information where
    and on the values of variables at that point. This is pretty handy information
    for an autopsy of the dead process.


    To examine a core dump, we first need to get a core file. Core files are large,
    and many system administrators will set up their systems so as not to allow core
    dumps'
