  md: '# Developing Git and Github


    Note that, first we git push origin <:branch name> to tell git to push the empty
    branch to the remote branch (deleting it). Next, we run git fetch origin -prune
    to make our local branches updated with the remote deletions. Finally, we run
    git branch -D test to completely remove local traces of the branch we wanted to
    delete. Without all of these steps (in order), you will still have a copy of the
    branch on your local machine, which can be confusing.


    # 3.5.2 Pull Requests


    Github has a handy way of dealing with branching and merging, a mechanism called
    pull requests. A pull request is a collection of changes to a branch on Github,
    authored against another branch. Github provides a simple interface for seeing
    what changes will be merged and merging them. To open a pull request, go to the
    branches page and select the “New pull request” button.


    ![](img/a7c22408154d0c003c87fe57465d2952_64_0.png)


    # Open a pull request


    Create a pull request by comparing changes across branches. If you need to, you
    can also compare forks.


    ![](img/a7c22408154d0c003c87fe57465d2952_64_1.png)


    From here, select the base branch to merge into and the compare branch to merge
    from. You may also get a description of the pull request, typically a simple explanation
    of what it changes and what issues (if any) it references.'
