    # 1.8 Advanced Text Manipulation


    Users often encounter situations when they need to carry out fairly complex or
    repetitive tasks involving text files. For example, we might want to run a lot
    of simulations where only a single parameter is changed (say, the temperature).
    Creating all the directories and input files by hand in this situation would be
    cumbersome, and it would be to have a mechanism to automatically generate the
    required files. This would require replacing text multiple times on a "master"
    file. Another example is processing output from simulation software. Very often,
    the information we are after is a subset of the lines in the output file and needs
    to be processed further (for example, properties should be averaged and their
    standard error computed). Unix-like systems allow for all of these tasks to be
    carried out directly within the shell. We have seen some of the commands that
    can be used for this purpose in the previous sections. In this section, we will
    briefly discuss two very powerful tools: the stream editor sed and the awk programming
    language. We will also discuss the character translator (tr), which enables additional
    functionality, especially in combination with other commands.


    The stream editor, sed, provides a very powerful language to manipulate and modify
    text. We will not necessarily cover all of its functionality, as this is enough
    to deserve a book by itself [4]. We will, however, cover some of the most common
    ways to use it. sed is a pattern-matching language. It allows the use of extended
    or regular expressions to find, print, and/or modify text. One of the most common
    uses of sed is to replace text on files. The syntax for this is sed ''s/string1/string2/''
    filename. This will replace the first instance of string1 on every line of "filename"
    with string2 and write the result to standard output. As usual, if you want to
    store the result in a file, you can redirect the output with ">"'
