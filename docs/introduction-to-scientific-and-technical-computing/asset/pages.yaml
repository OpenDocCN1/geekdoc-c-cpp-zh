    Data classes such as copy, copyin and copy give more control to the programmer
    to assert data locality. The copy class allocates space for a variable and copies
    it into the device and copies the results back to the host at the end of the data
    region. The copyin does the same operations as copy except copying the results
    to the host. On the other hand, allocate only copies the data back to the host.
    Because data movement between the host and the device is expensive, a programmer
    should benefit from these three operations by better understanding of data in
    their algorithm.


