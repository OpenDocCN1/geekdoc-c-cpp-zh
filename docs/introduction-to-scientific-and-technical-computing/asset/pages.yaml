    # 15.3 BLAS


    Just as there are three levels of hierarchy for problems solved by BLAS, LAPACK,
    and

    PETSc, the BLAS libraries themselves are decomposed into problems at three levels:


    +   * BLAS Level 1 operations work on vectors and have a typical complexity of
    n opera-

    tions for a vector of length n. Typical examples are vector addition, computing
    an\inner product, or applying Givens rotations [4].

    * BLAS Level 2 operations are of matrix-vector product, with $n^2$ complexity,
    such as

    the matrix-vector product.

    * Finally, BLAS Level 3 operations are between two matrices, the typical example

    being the matrix-matrix product, which has $O(n^3)$ complexity.


    There are hundreds of different BLAS routines, some of which are closely related.
    In

    order to help differentiate the routines while keeping the names of the routines

    relatively concise, BLAS employs a structured naming scheme for the form:


    ```

    X : precision

    XYZZZ: YY : matrix type

    ZZ : operation

    ```


    The "precision" character can be S for single, D for double, C for single-precision

    complex, and for double-precision complex. The two characters indicating matrix
    type

    describe both storage and mathematical properties. For instance, GE stands for
    general

    rectangular and GT for general triangular, while PB stands for positive definite
    band

    matrix and PO for positive definite. The (up to three) characters used to describe
    the opera-

    t are abbreviated with shorthands, like MM for matrix multiply or TR for tri-

    gular factorization. Knowing these rules helps with finding information about
