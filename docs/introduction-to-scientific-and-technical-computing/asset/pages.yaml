  md: '# 17.7.2.2 Property/Generative Testing


    Mutation tests, property tests test a project''s test suite and often operate
    on entire types or ranges of data. For example, a property test for code that
    operates on n-grams might run a function on all possible combinations of character
    data. This can then be brought back into the project''s unit tests as a specific
    test case. In some software communities, property testing is referred to as generative
    testing.


    Since both mutation tests and property tests require multiple runs of your test
    suite, they can be computationally prohibitive and are not appropriate for all
    projects. However, selective use in mature projects can be very powerful.


    # 17.7.3 Convincing Your Team


    Often, the situation arises where one member of a group or team is the first to
    see the light of testing and wishes to spread the good news in hopes of saving
    everyone time and improving quality for all. It is common to be met with apathy
    or dismissive attitudes, but the advocate need not lose hope!


    Setting a goal with one''s code and tests is always the first step. After that,
    providing the team with an explanation or guide to the chosen harness or framework
    can do much to alleviate any fear of the unknown that might have been taken.


    It is common for people who have coded for a long time without testing to view
    the project as a burden, undertaken after the “real work” as if to fulfill some
    bureaucratic checkbox. For these types, evidence such as TDD or BDD save time
    even in the short run, tends to be more persuasive.


    If else fails, writing high-level functional or integration tests for the project
    can help ease the team into a notion of automated testing. It is an unfair burden
    to have write unit tests for everyone else''s code, but after one''s integration
    tests save the project from a few bugs (often some else''s, overlooked edge cases),
    the argument for better testing tends to make itself.


    # Glossary


    **Abstraction**: A method of delegating or concealing details of code’s implementation
    so that the programmer can work at a higher, or more general, conceptual level
    while still benefiting from guarantees about specific functionality.


    **Behavior-Driven Development (BDD)**: A software development methodology that
    seeks to drive code functionality and software design goals by defining tests
    that make broader statements about application or domain logic. Compared with
    test-driven development, BDD tends to be seen as “top-down” in its approach.


    **Codebase**: The set of all source code in a project.


    **Code Spike**: A phase of exploratory coding whose intent is to learn more about
    a domain or problem, rather than produce stable, clean code. Code produced from
    a spike is often heavily in need of refactoring or perhaps thrown out and used
    only as a reference or rough draft for the actual implementation.'
