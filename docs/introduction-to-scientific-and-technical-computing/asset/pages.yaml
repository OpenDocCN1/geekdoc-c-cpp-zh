    The third common way to define list of values is by using brace expansion. A list
    of elements enclosed in braces {a..f} will expand to the list {a b c d e f}. Note
    that mixing numbers may enclose a list of arguments separated by commas,


    ```

    echo "Old MacDonald had a `{cow,chicken,dog}"`

    ```


    will produce the output:


    Old MacDonald had a cow. Old MacDonald had a chicken. Old MacDonald had a dog.


    When brace expansions are mixed, all possible combinations are generated. For
    example, [a..z][1..4] will expand to {a1 a2 a3 a4 b1 b2 b3 b4 ... z1 z2 z3 z4}.
    If this is not is intended (for you want to generate the list ''a b c d e 1 2
    3 4''), the braces must be nested and separated by commas, {{a..e},{1..4}}.


    The second way to define loops in Bash is using the while and until commands.
    In the first case, the commands within the loop are executed while a condition
    is true. In the second, they are executed until the condition becomes true (i.e.,
    while it is false). The syntax is as follows:


    ```

    while/until condition

    do\  commands

    done

    ```'
