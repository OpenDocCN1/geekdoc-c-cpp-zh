    # Variables and Substitution


    Like most other programming languages, Bash can use variables to store data. Bash
    is a typed language, where variables do not need to be explicitly defined. All
    Bash variables are strings of text, but depending on context, they may be interpreted
    as integer numbers. Bash does not allow operations with floating-point numbers
    directly, but floating-point operations can be handled through pipes to commands
    that allow them, such as bc or awk. Variables can, however, be declared as a particular
    type or special attributes using the declare command. In particular, a variable
    can be declared as an integer, as a read-only variable using declare -r, and as
    an array using declare -a. Declaring a variable allows simpler syntax for operations
    involving the variable. For example, if a variable is declared as integer, arithmetic
    expressions assigned to it are directly evaluated without arithmetic expansion.
    You can see the current attributes of a given variable using declare -p:


    ```

    $ declare -i MY_NUMBER

    $ declare -r MY_NUMBER

    $ declare -p MY_NUMBER

    declare -ir MY_NUMBER="

    ```


    To define a variable in Bash, simply use the equal sign, ''='', with no spaces
    before or after. For example, to define a variable called MY_AGE with a value
    of "20", you would write MY_AGE=20. Note that using the variable name does not
    replace the name with its value in Bash. For example, running echo MY_AGE would
    return "MY_AGE". To access the data stored in the variable, you must precede the
    variable name with a dollar sign, "$". In example, echo $MY_AGE would output "20".'
