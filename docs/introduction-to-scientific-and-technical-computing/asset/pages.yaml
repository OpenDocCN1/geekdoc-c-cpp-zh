  md: "# Machine Numbers and the IEEE 754 Floating-Point Standard\n\nis misinterpreted,\
    \ for example, an integer interpreted as a floating point in this C\nexample:\n\
    \n```\nmain()\n  // binary representation 0000000000000000000000000101\n  int\
    \ my_int = 5;\n  // interpreting as float gives subnormal\n  float my_float =\
    \ *(&my_int);\n  printf(\"My subnormal value is:%f\\n\", my_float);\n```\n\nThis\
    \ gives:\n\nMy subnormal value is: 7.00649e-45\n\nFor comparison, the smallest\
    \ representable normalized value is $2^{-126} \\approx 1.18 \\times 10^{-38}$.\
    \ When you discover a really small number, it is often because you have misinterpreted\
    \ an integer as a floating-point type. The above example is contrived, but once\
    \ you start messing with pointers and moving memory around, you are likely to\
    \ see this type of result at some point, and now you will know why.\n\nHere is\
    \ one example showing the consequences of adding disparate floating-point numbers.\
    \ To guess how many iterations will occur before the following loop will exit:\n\
    \n```\nmy_float = 1.0;\nwhile (my_float < 2.0) my_float += 1.0e-8;\n```\n\nThis\
    \ is, of course, a trick question. The result of adding 1.0 + 1.0e-8 will be rounded\
    \ down to 1.0 as a float records approximately seven decimal places of accuracy,\
    \ and therefore, the stored value will never increase, no matter how many iterations\
    \ are executed. For this reason, programmers are advised against using floating-point\
    \ types as variables rounding will affect the number of iterations. A similar\
    \ phenomenon occurs when operations are performed in an indeterminate order, for\
    \ example, in a parallel program. Adding small pieces first can generate larger\
    \ numbers that would not be rounded down, but adding small pieces to much larger\
    \ pieces may result in the small pieces being lost. If pieces are added in an\
    \ indeterminate order, different runs can produce different results. Adding small\
    \ numbers together before adding them to large numbers is something that needs\
    \ to be handled carefully in parallel computing, where it is not always easy to\
    \ specify the order in which parallel operations are performed.\n\n# 2.7 Summary\n\
    \nAs a computational scientist or engineer, knowing the pitfalls, implicit errors,\
    \ and limits of working with machine numbers is fundamental to performing numerical\
    \ calculations. Understanding the limits of representing decimals in machine code\
    \ also has implications for statistics calculations and error analysis. The curious\
    \ reader is directed to the IEEE 754 standard itself at http://standards.ieee.org/findstds/754-2008.html."
