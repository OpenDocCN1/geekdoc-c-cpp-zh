  md: 'copied from the host to the device at the beginning, and the from modifier
    specifies array unew of size NX*NY to be copied back from the device at the end
    computation. By default, the mapped data live only within the scope of the target
    region; that is, after execution, the mapped data (u, uold, unew) will be deleted
    from the device. The parallel execution on the device is governed by the parallel
    for directive on line 61, as defined by the usual OpenMP fork-join model. Without
    the target directive, the code is just a regular OpenMP code and can run on either
    the host or the Xeon Phi accelerator. The restrict keyword for the function arguments
    informs the compiler that there is no aliasing between the arguments. This allows
    the compiler to exploit vector parallelism for the inner loop at line 63, which
    is very important for performance, especially on Xeon Phi.


    The major overhead in the offload model is the data transfer between the host
    and the device. To remedy the situation, OpenMP provides a few options to reduce
    the transfer cost. One option is to use the target construct to define a coarser
    data region on the device in which to use the previously mapped data without data
    remapping and transfer. If necessary, one can use the always to map the clause
    or the target construct to force data transfer. The second option for reducing
    the overhead is to overlap data (via the target update) with host computation
    by wrapping such asynchronous tasks. The taskwait directive and task dependencies
    can then be used to perform task synchronization. For readers who are interested
    in this topic, please refer to other references, such as advanced OpenMP tutorial
    by Terhoven et al. [10].


    The code snippet in Listing 16.3 illustrates the use of the target construct for
    the time loop that calls the solver routine multiple times. Data are copied for
    arrays (u, uold, unew) from the host to the device before the time loop. Within
    the time loop, the solver routine in solveWave() is offloaded by the target construct
    to the device for execution without data remapping of the mapped arrays. At the
    end of the target region, array u is copied from the device to the host.


    # 16.8 Parallel Implementation with CUDA for GPUs


    It would be fair to say that CUDA, introduced in 2006, was a game-changing technology
    and a catalyst for several efforts in parallel computing. GPUs have long been
    appreciated for their potential for parallel computing, but general purpose computing
    on GPUs has been a difficult task for scientists and engineers who were not experts
    in CUDA graphics programming. From the introduction of CUDA, scientific computing
    on GPUs was a tricky exercise using OpenGL or DirectX due to limitations in the
    ability to process floating-point data and write at arbitrary memory locations
    on the GPU. CUDA enabled general purpose computing on GPUs by supporting read
    and write operations to arbitrary memory locations and complying with the IEEE
    754 standard for floating-point calculations for single- and double-precision
    data (i.e., for compute capacity 2.0 and higher).


    Unlike OpenMP and OpenACC directives, CUDA is a language extension. Today, we
    have CUDA extension to the C and Fortran programming languages. In this chapter,
    our focus is on CUDA C. We will cover a few CUDA features to get started with
    scientific computing on GPUs. For further usage, such as “Professional CUDA C
    Programming” by Cheng and Grossman dedicated to CUDA programming for a complete
    introduction to the API.'
