  md: '# Editors


    **Frank T. Willmore, PhD**, became interested in chemistry and computers growing
    up in Oak Park, Illinois. He quickly augmented his chemistry knowledge and apparatus
    beyond his toy chemistry set by regular trips to the public library to find additional
    books and shopping at local hardware and drug stores for chemicals. He became
    interested in computers after purchasing a book on video game programming at a
    fifth-grade book fair. He enjoyed writing his own games and wrote the same space
    invaders-like several times before purchasing a cassette recorder to save his
    work. He learned 6809 assembly code that he could make his games run faster.


    Dr. Willmore graduated with a BS in chemistry with minors in math and physics
    from Valparaiso University (Indiana) and went on pursue an MS in chemical engineering
    at Iowa State University, where his simulation-based research in catalysis was
    published in Physical Review E. He learned to program in C on IRIX and Ultrix
    systems, and went to work on software for the next 4 years. For several start-ups,
    including Evite.com, where he implemented new features and minded user data.


    In 2003, Dr. Willmore returned to graduate school to study molecular modeling
    and published four more papers, completing a PhD in 2006 under the direction of
    Isaac Sanchez at The University of Texas. Upon graduating, he performed his research
    to fund an LLC and built three energy-efficient houses and, in 2009, completed
    a five-star (highest rating) career in home Austin, Texas. With the completion
    of that project, he returned to research, completing postdoctoral work at the
    National Institute of Standards and Technology and joining the Texas Advanced
    Computing Center as research staff.


    **Eric Jankowski, PhD**, joined the Materials Science and Engineering Department
    at Boise State University (Idaho) in January 2015. The overall goal of his work
    is to leverage thermodynamics for societal good. This means understanding the
    factors that govern molecular self-assembly and using knowledge to engineer materials
    for generating energy, data, or curing disease. The approach taken by his lab
    is to create and use computational tools that efficiently generate configurations
    of molecules. The goals of these computational models are to (1) provide fundamental
    insight into material structure when physical characterization is inadequate,
    and (2) to identify the most promising candidates when there are many choices.


    Dr. Jankowski earned a PhD in chemical engineering from the University of Michigan
    in 2012, where he developed computational tools to study the self-assembly of
    nanoparticles. These tools leverage graphics processors to accelerate computations
    and provide insight into systems of both theoretical and practical importance.
    He began focusing on renewable energy generation during his postdoctoral positions
    at the University of Colorado and the National Renewable Energy Laboratory. At
    these postdocs, he applied techniques developed during his thesis to understand
    factors determine the ordering of molecules in organic solar cells. Dr. Jankowski
    also enjoys cycling and an ancient board game (go) and can easily be convinced
    to discuss how themes of efficiency and combinatorics overlap these hobbies and
    his professional interests.'
