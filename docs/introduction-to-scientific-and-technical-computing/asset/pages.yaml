  md: "# Introduction to OpenMP\n\n# 13.8.2 Environment Variables\n\nWe have already\
    \ encountered the OMP_NUM_THREADS environment variable, which controls the number\
    \ of threads created in parallel regions. Other environment variables are available\
    \ and can be used to change the behavior of OpenMP constructs within the application\
    \ without having to recompile the source code.\n\nIt is worth mentioning that\
    \ environment variables typically have the lowest priority of all OpenMP constructs.\
    \ For example, if the code internally sets the number of threads with omp_set_num_threads(),\
    \ changing the number of threads with the OMP_NUM_THREADS environment variable\
    \ will not change the number of threads that the application is run with.\n\n\
    The following environment variables are available in most OpenMP environments:\n\
    \n| OMP_DYNAMIC | Specifies whether the OpenMP runtime library can adjust the\
    \ number of threads in a parallel region |\n| OMP_NESTED | If enabled, nested\
    \ for and loops are distributed across threads |\n| OMP_NUM_THREADS | Sets the\
    \ maximum number of threads in a parallel region |\n| OMP_SCHEDULE | Modifies\
    \ the default scheduling clause for all schedule (runtime) workloads |\n\nA typical\
    \ use case for OMP_SCHEDULE would be to benchmark an OpenMP application with omp_get_wtime()\
    \ and different scheduling strategies: static, dynamic, and guided. This remove\
    \ the need to recompile the source code for every experiment.\n\n```\n#include\
    \ <stdio.h>\n#include <comp.h>\nint main(int argc, char ** argv)\n{\n    double\
    \ tick, to;\n    tick = omp_get_wtime();\n    #pragma omp for schedule(runtime)\n\
    \    #pragma for (int i = 0; i < 1000; ++i) // some big loop\n    {\n        /*\
    \ do some work */\n    }\n    to = omp_get_wtime();\n    printf(\"The time difference\
    \ was: %f\\n\", to-tick);\n    return 0;\n}\n```\n\nThere are other environments\
    \ that are available to specific compilers (GNU Intel compilers) and specific\
    \ machines (Cray systems). Some are for more advanced users as OMP_STACK_SIZE,\
    \ which control the size of the stack for created (i.e., not master) threads,\
    \ and are used only for debugging purposes (GOMP_DEBUG). For these advanced and\
    \ compiler/system-specific environment variables, good programming practices ought\
    \ to be followed: keep it simple, and apply judiciously."
