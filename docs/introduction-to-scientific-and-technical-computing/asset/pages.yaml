  md: '# 14.8 A Note on Stochastic Methods and Restart


    The reproducibility of a result for a stochastic simulation depends on the reproducibility
    of the results of the random number generator, and in the case of parallel computing,
    may depend on the order in which the elements of a reduction operation are combined.
    In this example, the state of the random number generator was not saved. This
    means that in this simulation, the results will be statistically equivalent but
    not identical. This is relevant to here and best addressed under the broader topics
    of stochastic simulation, but it bears mentioning here. If you like, take it as
    an exercise and add, as as a feature, the ability to specify a new seed value,
    and then create a new restart file for a new time step.'
