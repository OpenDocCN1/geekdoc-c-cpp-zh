    # 13.1 What Is OpenMP?


    Open Multi-Processing (OpenMP) [1] is a set of compiler directives, environment
    variables, and a runtime library that extend C, C++, and Fortran languages to
    share memory parallelism or multithreading. OpenMP allows users to write code
    that “forks” a team of threads and distributes the workload among them, thereby
    reducing the overall time to completion. The number of threads is usually equal
    to the number of cores available on the system that each runs on or all cores
    utilized. Server and workstation processor design trends in the past 15 years
    have been focused on adding more cores per chip. Multithreading using OpenMP offers
    a convenient, scalable means of improving application performance especially with
    the higher core count on a single machine.


    In this chapter, we will introduce OpenMP and highlight its strengths and weaknesses.
    The OpenMP statements commonly used to add parallelism to typical scientific'
