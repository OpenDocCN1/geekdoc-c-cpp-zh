    # 13.2 OpenMP and Multithreading


    Other programming platforms and libraries that use multithreading include threads
    (POSIX threads), CoArray, TBB (Thread Building Blocks [2]), and Cilk [3]. Threads
    relies on manual synchronization objects (mutex and semaphore objects) in C/C++,
    making them difficult to use in Fortran. Furthermore, programming at this level
    of fine grain control makes pthreads difficult to implement and debug. CoArray
    Fortran is, as the name suggests, limited to certain Fortran compilers but offers
    high-level controls over parallelism. TBB, the Thread Building Blocks library,
    offers the same high-level control over threads but is C++ only. Cilk, on the
    other hand, is easy to learn and offers high-level controls with its own C-like
    programming language. In summary, it is fair to say that OpenMP is not unique
    in its approach to parallelism (i.e., multithreading); it is, however, supported
    on most architectures, by most compilers, and is widely used in scientific applications.


    The advantages of using OpenMP over other parallelism methodologies include the
    following:


    +   * Portability: OpenMP is supported by open-source and commercial compilers
    on Unix-like environments and Windows.

    * Efficiency: OpenMP threads are lightweight and implementations have low overhead.

    * Ease of use: Incrementally adding OpenMP parallelism to existing codes, increasingly
    loop intensive codes, is straightforward and unobtrusive.

    * Control over the level of parallelism: Coarsely, threads are created at application
    start and throughout. Finely, threads are created and destroyed in the intensive
    (aka "hot") loops.

    * Prevalence of multicore hardware: Cell phones, entry-level laptops, accelerators
    (graphics processing units, Many Integrated Core [MIC] cards), and of course,
    supercomputers all have multiple processing cores in the same processor, often
    multiple processors.


    There are, however, some limitations:


    +   * OpenMP will scale but is limited in scalability by the memory architecture.

    * Overhaul of a large and complex serial code to OpenMP can be challenging.


    From a systems point of view, the application is process with many threads. Each
    thread has access to the entire memory allocated to the process and is given some
    private memory that is available only to that thread. The concurrent execution
    of computational'
