    It is not recommended to cover every possible combinatorial outcome of the inputs
    through functional tests. Even a half-dozen functions coordinated would make the
    number of such tests prohibitively large. Instead, choosing one or two "happy
    path" cases and several prominent error cases will suffice to guard against major
    changes in the interoperability and coordination of the units under.


    In the example, despite GreeterFunctionalTests not being comprehensive, if determineLanguage
    was altered to identify languages with simple number codes, this would be caught
    by GreeterFunctionalTests because the protocol of exchange between determineLanguage
    and buildGreeting would be altered.


    A logical extension of this is that project will tend to have fewer functional
    tests than unit tests, but that they cannot be relied on for comprehensive correctness.


    # 17.4.3 Integration Tests


    While functional tests may verify that several functions cleanly hand off data
    from each other, integration tests can be thought of as a more human-scale assertion.
    These are especially relevant to a project with a graphical user interface (GUI)
    layer, which itself to having distinct user actions, or to integrate with external
    resources or services, such as a database or third-party application programming
    (API).


    Integration tests may also be useful for monolithic projects whose many orthogonal
    functions are not grouped in the same codebase. In this case, an integration test
    can be useful to someone outside the research team who is expected to frequently
    interact with the system or its code which may not have full understanding of
    its construction at a low level.


    Most of all is a property that integration tests share with functional tests:
    they help maintain a sense of what correctness means at a high level, allowing
    the details of implementation to vary as the researcher''s or programming skills
    change. If a program is written to test a concept and a year later is rewritten
    such that the algorithm at its core changes (for performance reasons, to test
    a different model, or to simply clean up code for collaboration), then its functionality
    can be compared to the original version simply by running the existing integration
    tests.


    A revealing example is image similarity. Whether or not any two images are similar
    can be calculated by many methods, each of varying quality when compared to how
    a human might judge the similarity of images. A very straightforward method is
    to measure the average color. This does not end up being a useful program, especially
    for photographs, which tend to cluster around grays and browns when averaged.
    A refinement program might use k-means clustering to find the so-called dominant
    colors of an image and consider images similar if out of four dominant colors
    are very close to each other.


    At a high level, a program might accept a list of images and return a list of
    mappings, specifying true or false for whether an image is similar to other image
    in the list.


    An integration test for such a program might have two tests:


    +   1. Find that an image is similar to itself


    +   2. For a set of three images, with two deemed similar, test that similarity
    is correctly determined'
