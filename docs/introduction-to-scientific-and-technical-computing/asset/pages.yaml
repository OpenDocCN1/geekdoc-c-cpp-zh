    # 11.2.1 Memory, Processes, and Threads


    Currently running processes may or may not communicate directly with each other.
    If they communicate with each other, they may or not have access to the same regions
    of memory. Regions of memory where multiple processes can read and write are known
    as shared memory, while regions where only a single process can read and write
    are known as private memory. Memory that is local to a node may be shared or private.
    Memory that is nonlocal to a node is always accessed as private memory and is
    called distributed memory. The vast majority of clusters lack any hardware mechanisms
    to maintain coherence between processes between different nodes, and this must
    be implemented by the software.


    An instance of a process executing on a Linux system is called a process or thread.
    In Linux, each process has its own address space in memory that is visible to
    only it—it is private. Any signal or data that are exchanged with other tasks
    must be explicitly sent and received by each task participating in the communication.
    Within each task, however, be multiple lightweight units of execution called threads.
    The threads are created and destroyed within a task and can access the same address
    space, that is shared memory. Therefore, explicit communication between threads
    within a process is not necessary. Mechanisms must be used to avoid multiple threads
    accessing data asynchronously to avoid race conditions. A race condition occurs
    when multiple threads are reading and writing to the same data, such that the
    data visible to any given thread is unpredictable.


    In shared and distributed memory applications, programmers use multiple tasks
    or threads in order to implement parallel computation. Each task or thread can
    be assigned to specific cores in a multicore processor. The operating system is
    capable of performing this assignment, although it doesn''t always do so in an
    optimal manner. Therefore, the programmer or user of an application will manually
    associate tasks and/or threads with cores. This is known as assigning processor
    affinity.


    # 11.2.2 Distributed Memory Programming and MPI


    The majority of distributed memory applications developed for HPC systems use
    implementations of the Message Passing Interface (MPI) Standard, developed by
    the MPI forum (http://www.mpi-forum.org). MPI implementations provide a library
    of routines that can'
  merge: -1
