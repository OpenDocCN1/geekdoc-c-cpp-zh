  md: 'The most common way of mathematically describing the van der Waals interactions
    between particles is the 12-6 Lennard-Jones potential in Equation 18.1, which
    describes the pair interaction potential, $U$, between two particles as a function
    of their separation $r$:


    ```

    $$U(r) = 4\epsilon \left[\left(\frac{\sigma}{r}\right)^{12} - \left(\frac{\sigma}{r}\right)^{6}\right]$$$

    ```


    where $\epsilon$ controls the strength of the interaction and $\sigma$ controls
    the particle diameter; these two adjustable parameters vary based upon the chemical
    species being considered. The Lennard-Jones form is only one of many possible
    interaction potentials that can be used to describe the nonbonded interactions
    between atoms. The Morse potential in Equation 18.2 is another description, where
    $D_0$ represents the characteristic energy, $r_0$ sets the location of the potential
    minimum, and $a$ adjusts the shape of the curve.


    ```

    $$U(r) = D_0[e^{-2a(r-r_0)} - 2e^{-a(r-r_0)}]$$

    ```


    Simplified interactions, such as the square-well potential in Equation 18.3, can
    also be used to capture the van der Waals interactions, where systems have three
    adjustable parameters: $\epsilon$, which sets the interaction strength; $\sigma$,
    which sets the particle diameter; and $\lambda_$, which sets the range of the
    interaction.


    ```

    $$U(r) = \begin{cases} \infty, & r \le \sigma \ \epsilon, & \sigma > r \le \lambda\sigma
    \ 0, & r > \lambda\sigma \end{cases}$$$

    ```


    In the context of this chapter, the scientific details of these models are relatively
    unimportant. The key takeaway messages, however, are the following:


    +   - Are often multiple ways of mathematically describing the same phenomena.

    - Models typically have many fitting parameters that can be tuned to produce specific
    behavior.

    - Which model use depends on which behaviors we are trying to capture and the
    computational efficiency required.


    In general, defining a molecular model in a simulation package requires a user
    to do the following:


    +   1. Define which pair potential to use. Note, users typically do not have to
    mathematically define this function; instead, the form of the function is generally
    specified by the developers of the forcefield. The end user needs to ensure that
    the mathematical form is supported by the simulation tool.

    2. Define all parameters required by the pair potential, such as $\sigma$ and
    $\epsilon$ for the Lennard-Jones potential.

    3. Define the initial position and type of all atoms in the system (as well as
    any bonds, angles, etc.), required for more complex models).'
