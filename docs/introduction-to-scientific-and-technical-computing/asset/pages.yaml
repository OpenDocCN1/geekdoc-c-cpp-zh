    The Message Passing Interface (MPI) has been the facto parallel programming model
    for the past two decades, has been very widely adopted to write high-performance
    scientific applications. What can a programmer do with MPI? A programmer can call
    functions from the MPI library to organize parallel computations on multiple processors
    and communication between processes.


    This chapter will provide you with the basic foundation for understanding and
    building MPI codes. Before studying how to work MPI, I believe it is important
    to learn about its origin. Section 12.1 provides a historic introduction for understanding
    why and when MPI was created. Section 12.2 introduces you to the first MPI commands,
    explaining how to build and execute an MPI code. But as MPI uses messages to exchange
    data between processes, it is important to know how to do this. What we will start
    to see in Section 12.3, which will introduce point-to-point communications before
    describing collective communications in Section 12.4. As learning is always better
    with examples, an example of code using MPI to compute $\pi$ is provided in Section
    12.5. If you are interested in learning more about MPI, Section 12.6 provides
    a list of books and websites that can help improve your knowledge.'
