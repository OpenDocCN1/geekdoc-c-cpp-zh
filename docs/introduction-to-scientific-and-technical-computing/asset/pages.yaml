    # 1.7 Shell History and Shortcuts


    Shells in Unix-like systems have mechanisms to recall commands that have been
    previously executed, which saves a lot of time, especially when executing long
    commands. The history command can be used to bring up a list of the most recent
    commands executed by the current user. The commands are preceded by numbers and
    sometimes by the time of execution. In Bash, the history is typically stored in
    a (hidden) file called .bash_history in the user''s home directory, unless HISTORYFILE
    environment variable is set (in that case, the variable contains the location
    of the history file). A useful feature of the history is that it enables storing
    commands in a particular session over a given file, which may be useful to recall
    how you did something. For example, running the command history --filename will
    copy the current history to the file with the given name. The current history
    can be deleted by running history -c.


    Commands in the user''s history can be recalled, and this is usually a time saver.
    In some systems, this can be done using the fc command, which opens a text editor
    editing and rerunning commands from it. Alternatively, the history can be navigated
    in another way. The up and down keys can be used to bring up commands in the history.
    The up arrow brings the previous command, whereas the down arrow brings the next
    one (CTRL-P and CTRL-N can be used instead of the arrow keys). It is also possible
    to recall commands by pressing CTRL-R and then typing a string that was present
    in the original command. For example, a command starting with "grep" can be invoked
    by typing CTRL-Rgrep. If multiple commands contain the string, it is possible
    to switch from one to another by pressing CTRL-R again after typing the string.


