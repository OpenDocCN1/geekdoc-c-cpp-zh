    Register memory is private to a thread. There are 64,000 registers per multiprocessor
    and 255 per thread on devices of compute capability 3.0 and higher. Registers
    are very fast memory. Variables declared locally in the kernel are stored on registers.
    When there are not enough registers, which is referred to as "register pressure,"
    registers can spill over the local memory, which is also private to a thread but
    stored in the device memory. Therefore, access if low memory is not cached in
    L1. Register pressure can be alleviated by using the constant memory for read-only
    variables in the kernel. Constant memory can be read and written by the host.
    Constant memory, as the name implies, is ideal for constant parameters in a computation.
    The total size of constant memory is 64 KB.


    The last type of memory that is available in CUDA is texture memory, which can
    be advantageous for some applications. Texture memory is a read-only memory that
    is accessible by all threads. It is cached on chip. It can be advantageous for
    applications where memory access pattern has spatial locality.


