  md: 'Test-Driven Development (TDD): A software development methodology that em-phas
    short cycles of feedback between unit tests and the code being written in order
    to guide code functionality and the software’s design toward the project’s goals.
    When compared to behavior-driven development, TDD can be thought of as a “bottom-up”
    approach.


    Test Fixture: Data sources, usually static, that one or more test cases may use
    as input. When dynamic, there must be a manner of seeding any random element or
    rese-lecting the same dynamic values, in order to reproduce any test failures.


    Test Harness: A framework (or program library) that assists in one or more of
    the follow-ing: setting up resources for tests, providing assertion capabilities,
    or providing the presentation of test results, from simple console output to more
    advanced reports.


    Unit Test: The most granular test type, typically exercising a single function.'
