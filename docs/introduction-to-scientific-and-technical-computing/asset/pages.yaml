    to either. Feedback from the integration test in fact assists further refinement
    of the code.


    It follows that if the project''s expectations change significantly, the tests
    codifying those እንደሚ might be expected to change. If at a later time, the researcher
    decided to implement the Shape Context algorithm as a measurement of similarity,
    this would likely have such a different result than color-based similarity that
    new test data and new expectations could be.


    # 17.4.4 System Tests


    Sometimes colloquially referred to as "end-to-end tests," system tests attempt
    a full run of all code under known conditions and assert only a final result.
    For a program with sufficiently narrow scope, integration tests and system tests
    may be one and the same. For larger projects, system tests are to integration
    as functional tests are to unit tests: they assert proper interoperability across
    over-larger components, compared to the more focused test type.


    In the case where final results need to be verified against the expectations of
    a theoretical model, any automation in that process almost certainly qualifies
    as a system test.


    # 17.5 Knowing What, When, and to How


    Testing is only useful insofar as it helps a project succeed. Having too much
    documentation, rare is the project that has too many tests. But certainly, some
    tests end up more valuable than others for a specific research project or for
    a certain phase in a project''s lifespan.


    # 17.5.1 Separating Function Concerns


    If we categorize functions based on their responsibilities, they can fall into
    two broad categories:


    +   - Query functions, whose purpose is to return a result, sometimes referred
    as "data-in, data-out" functions (e.g., compute the Jacobian of a matrix, identify
    the country of a geographic coordinate). Tests for queries are the simpler of
    the two; they only need to make assertions about the result of the function call.'
