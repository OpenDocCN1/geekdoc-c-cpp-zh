  md: '# 13.9 Practical Issues


    # 13.9.1 Race Conditions


    A race condition is a subtle error where multiple threads may potentially update
    the same memory location, causing a wrong result. The application will run successfully
    but on occasion returning the wrong results. This is a very dangerous error to
    encounter and can go easily undetected. The following tests can help expose and
    diagnose this sort of error:


    +   - Running the OpenMP application repeatedly produces different results.

    - Running the application with different numbers of threads produces different
    results, specifically from the single thread (OMP_NUM_THREADS=1) to any number
    of threads.

    - Changes to the scheduling procedure produces different results.

    - Using the ordered clause in a do/for works construct produces the correct result,
    but removing it produces different results.

    - Adding a call to sleep (to simulate processor load or increased workload) in
    one OpenMP construct affects the result.


    A simple example of a race condition would be follows:


    | Fortran | C/C++ |

    | --- | --- |

    | program main | #include<stdio.h> |

    | implicit none | int main(int argc, char **argv) |

    | integer count | { |

    | count=0 | int count=0; |

    | !$omp parallel | #pragma omp parallel |

    | count=count+1; | { count=count+1); |

    | !$omp end parallel | printf("count is: %d\n", count); |

    | write (*,) count is: "", count | } |

    | end program main | }


    Since count is shared across threads and appears in both the left- and right-hand
    sides of an assignment operation, one might be reading it while updating it, leading
    to an inconsistent value. The same effect can appear in C/C++ with an increment
    operator: count++ or count++. To fix this race condition, a single or master class
    must be added around so that the operation happens only to yield the same result
    as running the application sequentially without OpenMP.

    Similarly, consider the following code snippet, where [a], [b], c[], and d[] are
    all N-sized arrays initialized to 1.


    ```

