    a terminal window is closed, all processes that were started by that terminal
    are sent this signal. Usually, this causes those processes to terminate (an exception
    is daemons). It is possible to avoid having a process terminated by the hangup
    signal by using the nohup command. The name comes from the days of dialing up
    a computer via a phone line.

    - Interrupt: This signal is identified as INT (SIGINT) or by the number 2. This
    signal is sent to a process that was started interactively from a terminal window
    when down (typically, this is by pressing Control-C from the terminal).

    - Kill: This signal is identified as KILL (SIGKILL) or by the number 9. The kill
    signal immediately terminates a running process, and it cannot be caught, handled,


