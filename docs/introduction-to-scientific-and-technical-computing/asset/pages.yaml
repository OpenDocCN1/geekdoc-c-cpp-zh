    # 17.3 The Mechanics of an Automated Test


    # 17.3.1 The Four-Phase Pattern


    There are several methods of enumerating the common steps of software tests: setup,
    exercise, verify, and teardown. The oldest and most common explains testing in
    four phases. These steps are repeated for each test, regardless of its scope or
    scale. As will be discussed later, a single test may refer to testing just one
    aspect of one function or testing an entire program, and there are reasons to
    have tests in both categories.


    # 17.3.1.1 Setup


    A system under test is constructed. The phrase “system under test” is a way of
    saying “the function, module, or program that this cares about.” This often refers
    to assembling or specifying the input data for which a programmer later verify
    produces a particular output or side effect. Examples of this include hard-coded
    values (numeric or otherwise), computationally creating input data, or retrieving
    known test data from an external source, such as the file system or a database.


    In cases, this step may be shared across cases to avoid prohibitively expensive
    computation time. If possible, keeping intermediate, precalculated input values
    is desirable to recomputing across multiple cases from some raw source data.


    # 17.3.1.2 Exercise


    In this step, the system under test is executed or invoked. Depending on the scale
    of the system under test and the goal of the test, this may range from a single
    function call to a sequence of two or more.


    # 17.3.1.3 Verify


    The act of verifying a test consists of one or more assertions, which cause the
    test to be marked as passed or failed. In the case of a failed test, it is useful
    to provide a detailed message as to what specific expectation was not met. The
    level of detail may need correspond to the scale of the system under test.


    It is not common to provide detailed feedback for passing tests.'
