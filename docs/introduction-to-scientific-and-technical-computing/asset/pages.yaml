  md: '# Introduction to Scientific and Technical Computing


    We add a tag to the makefile:


    ```

    c_function_d.o: c_function_d.c c_function_d.h

    $ (CC) -c c_function_d.c

    ```


    And a line to build the static (.a) library:


    ```

    libmy_c_functions.a: c_function.o c_function_d.o

    ar -cvq libmy_c_functions.a c_function.o c_function_d.o

    ```


    To use the library, add the following code to c program.c:


    ```

    #include "c_function_d.h"

    ...

    double d_val = (double)val;

    c_function_d(&d_val);

    printf("c_function_d_returns with d_val = %lf\n", d_val);

    ```


    And we no longer need the .o files, since their functionality is contained in
    the library.


    ```

    $(CC) c_program.c -lmy_c_functions -L.- -o c_program

    ```


    We are no longer including the step of compiling c_program.c to produce the intermediary
    c_program.o object. The only object files are used in the library, referenced
    with the -lmy_c _functions option. The compiler expects specifying -lxx at the
    command line to mean ''look'' for a library named libxx.a or libxx.so in one of
    the places it knows to look for libraries. The -L option tells the compiler to
    look in the directory ''./'', which is the current directory. Note that if your
    code requires -L[some directory] at compile time in order to find a shared library,
    then the environment variable LD_LIBRARY_PATH will need to be set [some directory]
    at runtime.


    Since the library was a static library, it means that the entire contents of the
    .a file will be included in the executable and loaded into memory when the program
    is loaded in preparation for it to be run. The biggest difference using static
    and dynamic libraries is that statically linked code is incorporated directly
    into the executable. This means that statically linked libraries will be larger
    than dynamically linked ones. It also means that the library calls will be loaded
    and resident in memory, so when calls are made to them, there is no waiting for
    the library to be loaded. The downloads that are larger take longer to load, and
    loading multiple programs (or instances of programs) that use mean each has its
    own copy loaded in memory, consuming more system resources. Dynamic libraries
    are loaded as needed (i.e., they are actually called by the code) and can be loaded
    explicitly using dlopen(). They are slightly more complicated to use and are generally
    the best choice. One practical concern that arises when a code consists of multiple
    components that depend on different versions of the same dynamic library can sometimes
    be built by linking static versions of the needed libraries for different components.
    This can result from either poor management or from the integration of code bases
    from different projects.'
