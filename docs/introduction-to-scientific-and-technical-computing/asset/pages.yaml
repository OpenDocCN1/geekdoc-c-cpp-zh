    different. Just a small sampling of available job schedulers is listed below:


    +   * Moab Cluster Suite with TORQUE

    * Portable Batch System (PBS)

    * LoadLeveler

    * Condor

    * Simple Utility for Resource Management (Slurm)

    * Univa Grid Engine (previously known as Sun Grid Engine)


    For purposes of this section, when implementation-specific details are mentioned,
    the Slurm scheduler nomenclature will be used. The Slurm methods and examples
    described have direct access to other job schedulers. There are two categories
    of scheduling types available in Slurm that encompass most capabilities of other
    schedulers: basic and multifactor. Basic is simply a first in, first out (FIFO)
    scheme, where the first job submitted to the queue is the first to begin. Multifactor
    has many more options to determine in what order, or what priority, a job will
    be run.


    # 11.3.2 Job Priority


    A job priority determines when it will be run by the scheduler, with higher priorities
    run before lower priorities. In Slurm (and similarly in other schedulers), there
    are five major factors used to calculate a job priority, all of which range from
    0 to 1.0:


    +   * 1. Age—This factor increases on how long the job has been in the queue and
    in a state to be run.

    * 2. Fair-share—What percentage of user''s or project''s share of the total resources
    has been consumed in a given time window is a factor in priority. There are many
    ways to calculate this and determine the time, but typically, underserved users
    and projects are granted higher priority than oversubscribed users and projects.

    * 3. Job size—The number of nodes a job requests. This may be configured to give
    higher priority to jobs requesting greater or lesser number of nodes.

    * 4. Partition—The partition a job is submitted to may modify the job’s priority.
    A partition is a set of nodes defined in the scheduler configuration and is typically'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Introduction to High-Performance Computing Systems


    established based on resource differences (large memory, presence of accelerators)

    nor by ownership of the resources. There can be multiple partitions on a HPC system.


    5. Quality of service (QOS)—Special classes of groups, users, and jobs can have
    their

    priorities and resource limits modified based on QOS values. Jobs that use a par-

    ticular of service may have a higher or lower priority.


    Slurm computes priorities from a linear combination of the above five factors:


    ```

    Priority = w_iAge + w_iFairshare + w_iSize + w_iPartition + w_iQOS,

    ```


    w_i is a weight assigned to each factor. All of the above factors are set in the
    conf-

    ation file in Slurm, slurm.conf.


    # 11.3.3 Additional Scheduling Methods


    Running jobs strictly in the order of their priority has limitations that can
    be overcome

    by employing additional scheduling techniques. With execution times based strictly
    on

    priority, the jobs are run in the order of their priority as soon as the requested
    resources

    come available. This may leave many nodes idle on a cluster. For example, assume
    that

    a100-node system has Job A running on 51 nodes for one day. Job B requires 50
    nodes and

    tnext priority job. Forty-nine nodes will be idle for the entire day because

    all lower priority nodes must wait for Job B to begin before they are considered

    execution. Backfill scheduling solves this problem by searching for and executing
    jobs

    with lower priority jobs that can run on the available resources and complete
    before the highest

    priority jobs would be able to start. The scheduler can compute this because it
    knows the

    start time and requested runtime of all jobs in the queue.


    Some combination of jobs may consume all of the resources and have runtimes of
    hours

    or more jobs submitted to and waiting in the queue may run only seconds or

    it It is important for the workload goals that those jobs with very

    short times are allowed to run much more frequently than waiting for the long-runtime

    jobs to complete would allow. Gang scheduling circumvents this problem by scheduling

    time windows in different. In a system with gang scheduling enabled, a given job
    will run for

    preconfigured window and then the scheduler will check if there are any waiting

    jobs that can run on those resources. The scheduler will suspend the currently
    job

    and begin the next job for the configured time window. There may be numerous

    jobs subjected to this scheduling and sharing computing resources.


    # 11.3.4 Job Submission Scripts


    A job, or batch, submission script is used to convey the job scheduler all of
    the informa-

    it needs to schedule, execute, and record accounting information for a job. A
    sub-

    mission may require none or all of the following to be specified in the script
    when

    ubmitting a job, depending on what defaults are set for a given cluster:


    +   1. Queue—The job or partition that is submitted to. Queue will correspond

    a a subset of nodes available on a cluster, and a job submitted to it may be sub-

    jected to restrictions such as minimum/maximum node count and runtimes.


    +   2. Nodes—The number of nodes to allocate for a job.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Introduction to Scientific and Technical Computing


    3. Cores/tasks—The total number of cores or MPI tasks requested for a job. The
    exact definition of this parameter is dependent on the scheduler and cluster configuration.
    It may define the number of cores per node to use for a job or it may define the
    total number of cores to use. The layout of those total cores across the requested
    nodes will depend on the cluster and scheduler configuration.


    4. Runtime—The maximum time the job will run. If the job exceeds this, the job
    will be terminated by the scheduler.


    5. Output/error files—stout and stder from the job will be directed to these files.
    This enables users to track the progress of their job.


    6. Dependencies—Delays the start of a job until previously jobs have completed
    successfully.


    7. Allocation/project—This specifies the account to which a job is charged. This
    information is used to compute the fair-share factor in the job scheduler and
    to limit the time granted to a project. Once this limit is exceeded, users will
    no longer be able to submit jobs to the project.


    8. Command line(s)—These are the actual commands run during the job. They are
    typically executed on a single node allocated to the job. It is then the task
    of the MPI libraries or other scripts to distribute the commands across allocated
    nodes.


    Items 1-7 in the list above are specified by a single line in the submission script.
    Item 8 could require any number of lines and any valid script commands. An example
    of a Slurm job submission script is shown in Figure 11.4. An example of the output
    from the ibrun hostname command in Figure 11.4 follows,


    ```

    c445-003

    c445-004

    ```


    where the command was run on each host (once for each MPI task).

    Most clusters will provide a script, such as ibrun in Figure 11.4, to aid in the
    distribution of the commands and MPI tasks over multiple nodes and cores. In this,
    ibrun runs a single MPI task on each node, where each called the hostname command.
    Note the flexibility in the types of commands that can be run. A command may be
    a single command or a single application using MPI to distribute and coordinate


