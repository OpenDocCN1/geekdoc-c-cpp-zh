  md: '# 16.7 Parallel Implementation with OpenMP for Intel Xeon Phi


    OpenMP is a high-level, directive-based model for parallel programming on sharedmemory
    systems. Support for accelerators, such as Intel Xeon Phi, has been added in the
    4.0 release of OpenMP. Similar to OpenACC, the model provides language directives
    to annotate code and data to be offloaded to an accelerator for execution in a
    host-centric paradigm—the host drives computation and data movement. OpenMP provides
    the target construct for offloading an accelerator code region and the map clause
    for mapping data between the host and the device. Mapping involves the creation
    of a device copy of the data if the data do not exist on the device and the transfer
    of the data content between the host and the device. The declare target directive
    can be used to map global data to the device.


