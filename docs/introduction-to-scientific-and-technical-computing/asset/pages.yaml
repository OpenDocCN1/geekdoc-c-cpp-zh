    # 11.1.4 Node-Level Parallelism


    The node level is the highest mode of parallelism in the HPC system hierarchy.
    The nodes are connected by a network, with each node running an instance of an
    operating system and capable of acting as its own independent computer. The network
    can be organized into different topologies: a particular arrangement of nodes
    and connections. The topologies of networks with more than few nodes also include
    one or more layers of switches to connect the nodes, where switches are devices
    that route signals from one node or switch to another. The switches are connected
    so as to minimize the number of hops or distance that a signal or data transmission
    is required to make.


    The most common topology used for HPC systems is the Clos or Fat-Tree topology.
    This topology consists of one or more cores, which connect to other switches,
    and multiple leaf switches, which connect to multiple nodes and switches. The
    number of cables used between the nodes and leaf switches and leaves cores is
    chosen so as to maintain a constant or near-constant bandwidth at all levels of
    the tree. For this reason, it is often called constant bisection bandwidth topology.
    A two-level Fat-tree network is shown in Figure 11.3.


    Most networks are based on either Ethernet and/or Infiniband architectures. Ethernet
    is a TCP/IP-based networking technology used in a diverse range of contexts from
    connecting single laptops to the Internet to interconnecting large HPC systems.
    The Infiniband Architecture (IBA) is a specification for specialized hardware
    and software designed for low-latency communications. While Ethernet is used over
    the OS and, the processor to manage communications, IBA has hardware that implements
    multiple layers of communication with supporting features such as remote direct
    memory access (RDMA) and multicasting. RDMA allows one node to read or write to
    a target node''s memory directly without the target node''s participation. significantly
    reducing latency and creating opportunities for computation and communication
    overlap the target node. Multicasting refers to communications involving multiple
    nodes as a function that broadcasts a particular variable to all nodes. The hardware
    implementation of multicasting has lower latency than the software support implementation
    does.


    The hardware support provided by IBA allows it to generally achieve lower latencies
    than Ethernet is currently capable of reaching. In particular, RDMA can be supported
    by hardware implementing the internet Wide Area RDMA (iWARP) protocol. In any
    case, Ethernet communications


