    # Software Licensing and Distribution


    Paul Saxe


    The previous chapters in this book have covered the many aspects that you need
    to think about as you develop code to solve the problem at hand, how to make it
    perform well on current machines, and so on. In this chapter, we will make a complete
    change of direction and assume that you have written a useful and valuable code.
    You have tested it and found that it does what you want, and you are proud of
    what you have achieved. Now what? If you want other people to use your code, you
    can post it on your website, e-mail it to friends and colleagues, post a note
    on a mail list, or talk about it at a conference. People will ask you if they
    can have a copy of your code. That is wonderful! Your work will help others, and
    you may add it to all and make it better.


    However, before you let your creation grow into the world, it is worth stopping
    and thinking about what you want to accomplish and what will happen as you distribute
    your code. This is where licensing comes in. How you use your code will determine
    what others can—and cannot—do with it. You may well be thinking that this sounds
    like a kind of legal mumbo-jumbo that is not worth the effort and is besides needed.
    After all, you are just going to give your code to people who you know and trust
    and they will be able to recognize your work. The reality is that you don''t actually
    know what is going to happen in the future. What if the code you give to it goes
    to people who don''t know you? What if the code grows into a major code over time,
    a code that is useful to many people? It is a good idea to think about what you
    want to accomplish before you start your code, you set the conditions under which
    others can use the code. You can find or create a license that allows almost anything
    you want—it can apply many restrictions or none at all—but it sets a framework
    so that there are no accidental misunderstandings or doing things like buying
    insurance for your car or house. It may not be something you enjoy doing, and
    you hope that it will never ever need. But it is something you should do, something
    that can prevent problems down the road. And unlike home insurance, it doesn''t
    cost you anything except a small amount of time.


    Before we go further, there is a necessary disclaimer: the author of this chapter
    is not a lawyer and this is not legal advice. It is not complete and may not be
    correct, so please consult your lawyer for questions about licensing your code.
    The intent of this chapter is to give you an introduction to licenses and prompt
    you to think about some of the issues, the rest is up to you.


    Also, to make sure it is clear, you are licensing the code itself, not the results
    it produces. When you license the code, which means either the source or the binary
    executables generated from the source, the license is based on copyright laws.
