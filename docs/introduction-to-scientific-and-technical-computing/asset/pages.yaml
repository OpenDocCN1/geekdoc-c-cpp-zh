    # 17.1 Programs Grow and Become Software


    Occasionally, computer science faculty will bemo a mind-set among students best
    summarized as the "homework mentality"; the perception that code is written, once
    run to receive a grade, and never seen again. A student might look back fondly
    on a project because it received a high grade, even if a month later they might
    not be able to decipher the line-by-line details of their own code. On actual
    projects, when the humble grows and becomes living software, this nonchalance
    is dangerous as mistakes don''t simply disappear.


    This also manifests in research as a sort of "publishing mentality"; a perception
    that success in publishing a paper justifies any sloppy practices in the code
    it relies on.


    Within long-lived projects, when code completed in a rush is messy or buggy it
    also does not go away after the deadline. In fact, the researcher''s next project
    needs to interact with or teams working on projects built by these successive
    layers of deadline-driven development, eventually, more time is spent deciphering
    or fixing the mess than adding new research.


    The single greatest tool to avoid this needless burden is the creation and upkeep
    of automated tests.


    Here we present the best practices and standards to testing code, developed over
    the last decades of software engineering, and which are gaining similar importance
    in scientific projects as their dependence on programmatic tools grows.


    # 17.2 Why Test?


    It obvious that tests, first and foremost, contribute to a sense of correctness,
    that a program functions as it is intended to. Manual use of the program by a
    human can verify correctness after it has run, and while this is technically a
    form of feedback that could be considered a test of the program, the use of the
    term testing in a programming context almost universally assumes tests. Where
    testing is run entirely by a person, it is explicitly called as manual testing.


    For some, the promise of spending more time on active research and less timed
    in a headache of indecipherable code written by a teammate or one''s past self
    is motivation enough. For those who remain unconvinced, the additional merits
    of automated tests are presented here.


    In software development, a test suite refers to all tests related to a specific
    program or all tests related to entire project, which might itself be comprised
    of multiple programs. Rest assured that the benefits of a test suite, of any size,
    are far-reaching.'
