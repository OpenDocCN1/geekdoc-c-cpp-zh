  md: '# Foreword


    In the relatively brief history of electronic computers—roughly seven decades—we
    have seen exponential increases in capability and reductions in size, enabled
    by tremendous advances in technology. These exponential rates of change in capability
    and cost-efficiency produced the PC revolution, and now the "post-PC" revolution
    of "smartphones" and other smart mobile devices, and now are driving us towards
    an "Internet of Things" in which computing devices of all types are ever-present
    in our homes, cities, transportation, and perhaps even clothes and bodies. It
    is easy to understand how computing could now be taken for granted. Computing
    devices are now pervasive; they are not only on our desks and in our laps, but
    in our cars and in our pockets, and even on our wrists. Most people interact with
    computers daily, hourly, or ever constantly for enjoyment or for productivity,
    without ever pausing to wonder how they work. In fact, the term "computer" isn''t
    even applied generally to most of the computers in our lives. This is perfectly
    fine, for the most part. However, computers are also important instruments of
    science and engineering, necessary for helping us make discoveries and innovations.
    For scientists, engineers, and other technical professionals in universities,
    labs, and companies, computers are increasingly powerful tools for research and
    development (R&D). Sometimes, powerful computers—often called “supercomputers”—make
    headlines for their role in enabling groundbreaking research. However, scientific
    computing systems are out of the awareness, even more invisible than the pervasive
    devices we use.


    The tremendous success of computing in supporting our businesses, running our
    infrastructure, and enriching our lives in companies that provide these products
    and services has created a huge demand for computing professionals. The business
    and consumer markets need experts in cloud computing, data analytics, mobile applications,
    devices, networking, and so on. The explosion in business—and consumer-focused
    computing during the past two decades—the World Wide Web made computing access
    desirable to everyone—and changed the focus on computer science programs. The
    days of scientific computing skills and technology are long gone, though computing
    is more important than ever in science and engineering. The majority of computer
    science curricula have undoubtedly evolved with markets for computing technologies.


    For these reasons, I created and started teaching a course on parallel computing
    for scientists and engineers when I worked at the San Diego Supercomputer Center
    (SDSC) in the late 1990s, and taught it at the University of California, San Diego
    (UCSD). The class was based on a 2 to 3 day workshop we offered to SDSC users,
    most of whom were faculty and postdocs needed supercomputers in their research
    but had no formal education on how to use them. After I taught the Texas Advanced
    Computing Center (TACC) at The University of Texas (UT) in 2001, we started teaching
    a similar class at UT—and then discovered the need for additional, more basic
    scientific'
