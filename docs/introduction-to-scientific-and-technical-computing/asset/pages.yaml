    # 13.6.2 Scheduling Constructs


    The distribution of the iterations across the threads is controlled by the scheduling
    clause. The syntax would be as follows:

    parallel do/for schedule(schedule-type, chunk size)


    There are four schedule types: static, dynamic, guided, and runtime.


    +   - schedule (static, chunk): Threads receive chunks of iterations in thread
    order, round-robin, and the number of iterations is as equal as possible if no
    chunk size is specified. Static scheduling is good if every iteration contains
    the same amount of work and it keeps parts of an array in the processor cache,
    making it very desirable for blocked array and stencil operations.

    - schedule (dynamic, chunk): Threads receive iterations in chunks as the thread
    becomes available for more work. The workload is balanced across the threads,
    and this scheduling is best used with workloads that vary per iteration. There
