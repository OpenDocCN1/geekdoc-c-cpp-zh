  md: '# Testing and Verification


    # 17.2.1 Guarding against regressions


    In software, the term regression is often used as shorthand for regression bug,
    a situation where a software feature that once functioning properly was affected
    by a change, often an upgrade or elsewhere within a large system, such that the
    previous correct feature no longer functions properly. It is worth pointing out
    that fixing a bug, even a regression, is itself another change that might introduce
    yet more regressions. Programmer humor is rich with references to how often fixing
    one bug introduces another.


    A robust suite is one that confirms that even slight modifications to an existing
    unit of code do not break one or more other units (functions, modules, classes,
    depending on language) that rely on that newly modified code.


    # 17.2.2 Speed and Confidence


    A robust test suite is one that allows for quick feedback about the state of all
    major features and required functionality. Depending on the definition of "quick
    feedback" may refer to a few seconds, or many minutes. It is quick, almost without
    exception, it is fast to run a test suite than to have human orchestrate tens
    or hundreds of manual runs of the program to ensure that every detail is correct.


    This type of quick feedback is essentially simple at the dump of any new project,
    especially for those not used to writing automated tests. Manual testing is simple.
    As time goes on, feature lists increase, complexity grows, and the time required
    for manual testing diverges greatly from the time necessary to maintain and run
    automated tests.


    Any team that has added a test script or checklist to be manually verified after
    any changes to their project clearly have their heart in the right place. However,
    the presence of such a checklist is a sure sign that they are past point of divergence
    and would benefit from immediately introducing automated tests.


    Done well, tests accrue into a tangible sense of confidence in the project''s
    code from many angles: confidence in results, confidence in making changes, confidence
    in adding new features, and confidence in any estimated project timeline.


    # 17.2.3 Refactoring


    In any long-lived software project, sections of code that represent a general
    piece of work might move around, be generalized, or as is often cleaned up, which
    tends to be a catch-all term used to make easier to understand. In software, the
    process of this sort of movement, change, and cleanup in the project of easier-to-understand
    code is called refactoring.


    For instance, in a simple program that implements its own matrix logic, one would
    expect functions for computing a determinant. Initially, these might be written
    in text of explicit functions such as det and det2. For convenience, a savvy coder
    might create a generalized function, which defines the matrix size (in languages
    where this is available) and delegates to the appropriate dimension-aware function.
    New code is written using this generalized function, but old code remains with
    uses of dimension-specific versions. This is fine, so long as those functions
    also remain.


    As time goes on, even an {senior} team member improves the generalized det function.
    Instead of delegating to the dimension-specific functions, it now runs the proper
    summation across permutations of the elements. Seeing that det2 and det3 are no
    longer needed, he or she removes them. Tests will reveal any features that code
    relies on the original versions, and these can be replaced with the generalized
    version.'
