    # 7.2 Fortran Calling C


    Let''s begin with the C function we wrote in the previous chapter, the one that
    multiplies by 2 and returns. Something needs to be noted about forran is that
    it is written to pass by reference, not by value. The reason for this is, in Fortran,
    all functions pass by reference, so for any function call to be compatible with
    Fortran, it must also pass by reference. This does not mean every function in
    the code needs to pass by reference, just the ones that interact with Fortran.
    So, to make our c_function callable from Fortran, we add a wrapper function called
    c_function().


    ```

    /* c_function.h */

    ```


    ```

    // original function

    intc_function(int *);


    // fortran wrapper

    intc_function(int *);

    ```'
