  md: 'Command functions, whose purpose is to cause a persistent side effect (or state
    change) rather than deliver a computed value. Tests for command functions will
    need to inspect values where the state is stored in order to compare with an expected
    result. This may be an output file, a complex global data structure, an object''s
    instance variable, or any other number of locations where program state is recorded.


    Although there are sometimes performance reasons to do so, it is preferable to
    avoid writing functions that mix the responsibilities of both a query and a command.
    The benefits of avoiding this are ease of reuse and ease of testing. And when
    testing is made easier, it is more likely to get done!


    # 17.5.2 Testing Styles


    There are a handful of methods for including tests in the day-to-day workflow
    of programming that have risen to popularity over the years. Two prominent examples
    are discussed here.


    # 17.5.2.1 Test-Driven Development


    “outside-in” or “bottom-up” flavor of testing with a focus on unit tests goes
    by the name test-driven development, or simply TDD. Particular emphasis is placed
    on writing unit tests at the same time one writes the relevant functions, modules,
    or classes. A workflow seen in TDD, and depicted in Figure 17.1, is known as “red,
    green, refactor,” wherein a test for a function is written before the code itself.


    +   - Initially, the test case fails, as the function under test does not exist.

    - Green: The programmer then writes the relevant function and runs the test time
    he or she believes to has succeeded. The programmer knows that he or has the correct
    code when the test cases finally pass.

    - Refactor: With the code writing, it can be cleaned up (and validated by keeping
    the tests passing) before moving on to writing another function.


    # 17.5.2.2 Behavior-Driven Development


    “outside-in” or “top-down” style of testing, which begins with integration or
    functional tests, is known as behavior-driven development, or BDD. This style
    does not eschew unit tests but adds them when one needs to codify finer points
    of logic. Often, the red, green, refactor strategy is applied, but at a level
    that encompasses more code at once and the jump from red to green (i.e., failing
    tests to passing tests) will take longer. A visualization of the difference between
    TDD and BDD is depicted in Figure 17.2.


    One might wonder, why start at the integration or functional level and not even
    higher, such as system tests, when used in a project large enough to set apart
    from integration tests, are normally too high of a level to provide useful feedback
    during development, and integration tests tend to provide a more balanced place
    to start.'
