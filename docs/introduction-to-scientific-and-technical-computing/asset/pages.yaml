    #SBATCH -n                        # total number of mpi tasks requested

    #SBATCH -p development          # queue (partition)

    #SBATCH -t 01:30:00                # run time (hh:mm:ss) - 1.5 hours


    ibrun hostname                   # run the hostname command in each MPI task

    ibrun . /a.out                   # run the MPI executable named a.out

    ```


