    # 18.4 Validation


    As previously discussed, a key goal of validation is to avoid the "garbage, garbage
    out" phenomenon. In this chapter, we make the assumption that the underlying software
    has been correctly implemented (verified) and all sources of error reside in the
    model itself. Note that while numerical or round-off error may also cause a model
    to fail validation, such factors will not be considered here as this topic is
    discussed in Chapter 2. Let''s consider two main causes for the failure of a model:


    +   1. Input parameters or equations passed to the code are not expected. (Did
    we give the correct information?)

    2. The parameters and equations are passed to the code correctly, but the model
    itself does a poor job of capturing the underlying phenomena. (Are we modeling
    the right system?)


    # 18.4.1 Validation of Model Inputs


    Let''s first consider the process of validating that we have defined the model
    inputs correctly for a piece of software. At the most basic level, validation
    of a model involves manually checking, and often re, the associated input parameters
    for accuracy. In this regard, several pertinent questions must be considered.


    Are the units correct? Are there any typographic errors?


    For models or parts of a model with only a few inputs, these checks are fast and
    manageable. For example, a simple model will require the definition of a few dozen
    input parameters for the various bonded and nonbonded interactions, which can
    be manually validated with minimal time commitment.


    Is the formatting correct?


    Beyond validating the numerical values, it is important to take note of the expected
    formatting of the parameters. Many pieces of software are inflexible and require
    values to be defined in a specific order, often with little context. For example
    in Listing 18.1, consider the script commands used to define the ε and σ parameters
    for the Lennard-Jones potential, in the syntax for large-scale atomic/molecular
    massively parallel simulator (LAMMPS) [10] and highly optimized object-oriented
    molecular dynamics (HOOMD)-Blue [11] simulation engines.'
