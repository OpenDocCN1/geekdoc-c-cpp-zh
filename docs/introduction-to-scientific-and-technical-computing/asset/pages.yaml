    The wrapper function name is the same as the original but appends an underscore
    (_) to the end of the name. The reason for this is, when a Fortran function is
    compiled, the compiler appends an underscore to the end of the name. Thus, the
    first step in making c_function callable from Fortran is to make it look like
    a Fortran function. Note that if you were writing a new C function to be called
    from Fortran, you would just name it with the trailing underscore. We are showing
    how to wrap an existing C function here.


    We keep the exact function definition as before for the c_function, but we need
    to define the Fortran wrapper in c_function.c.


    ```

    #include <c_function.h>

    ```


    ```

    intc_function(int *val) {

    *val = *val * 2;

    return 0;

    }

    ```


    ```

    // Fortran wrapper

    intc_function_(int *val) {

    return c_function(val);

    }

    ```


    It takes the argument and calls the original c_function. Simple! To include this
    function to our Fortran program, we add the following to the declarations at the
    beginning of the program:


    integer, external :: c_function


    This takes the place of the header file with prototype, which Fortran does not
    use. To invoke the function, we add the following call, and examine the output
    with a print statement:


    ```

    return_val = c_function(val)

    print *, "c_function returns val = %", val

    ```


    Take the c_function.o object file from the C compiler and fortran_program.o object
    file from the Fortran compiler and link them together. Brilliant! But with which
    compiler do we do the linking? Remember the final linking to execute requires
    certain system to be handled, whichever compiler was used to write the main program
    should be used to do the final linking. In this case, it is the Fortran compiler:


    ```

    $ gfortran_function.oftran_program.o -o fortran_program

    ```


    Because the function arguments to both C and Fortran functions are passed by reference,
    the effect of calling c_function(), which multiplies by 2, and fortran_function(),
