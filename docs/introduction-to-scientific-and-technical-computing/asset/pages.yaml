    # 3.4 Intermediate Git


    What we have covered thus far is basic tools usage. There are some more advanced
    workflows that git and Github support, as well as a few things that you can do
    to make your life easier.


    # 3.4.1 Housekeeping


    When working on a project, especially one with a lot of compiled artifacts (say,
    the .a and .out files in a C project), it is a good idea to leave those artifacts
    out of source control. Git and similar tools are designed to be most effective
    with text files, and generally, binary artifacts only result in merge conflicts
    that have to be resolved at every commit. Debuggers and Integrated Development
    Environment (IDEs) may also create configuration and autosave files (like .swp
    files from vim and .s files from Visual Studio).


    Git can be told to ignore these files by the addition of a .gitignore to the root
    repository. This file is a simple example of the form:


    ```

    .out

    bin/

    ```


    which will cause files named .out and anything in a directory named bin to be
    ignored. Each line is a different pattern to ignore, either a filename or directory.
    Once ignored, files matching that pattern will not show up and cannot be added
    to the repository. Subdirectories may have their own .gitignore files as well
    if you do not want to have long paths in the root .gitignore.


    It is important to make sure that you are writing useful commit messages. A good
    summary of how to write good commit messages is available at Torvalds (https://github.com/torvalds/subsurface/blob/master/README#L82-109)
    and yields commits of the following form:'
