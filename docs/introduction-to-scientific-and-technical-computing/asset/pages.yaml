  md: '# Software Licensing and Distribution


    If you are thinking about using an open source license, this is the key question
    that you have to answer when deciding what open source license to use. If you
    choose a copyleft license and the community is too small, your code will live
    as long as you work on it. If you choose a permissive license and the community
    is large, you may miss opportunities to benefit from the work of others in the
    community.


    You are not subject to your own license: it applies to end users. However, you
    can license your software in multiple ways, and you can change the license for
    your software. However, you cannot take back a license, if you have licensed your
    software under an open source license and decide to change the license to a commercial
    license, then the last version that you released under the open source license
    will remain available, least through other end users. If you have incorporated
    others'' code into yours or have incorporated others that make back into your
    code, you cannot change the license without their permission. If many people have
    changed the code, it may be difficult to contact them, let alone get everyone
    to change the license. Thus, for large, complicated codes that have had many contributors,
    it becomes difficult, if not practically impossible, to change the license. This
    is one of the reasons to be careful to choose the right license early.


    Hopefully, this has given you some ideas and enough understanding to decide the
    type of license to use for your software. Open source does not just mean the GPL!
    Many people seem to think that GPL is open source and open source is GPL, but
    there are many other licenses available, one of which might suit you better. While
    GPL and similar licenses have been very useful and effective where there is a
    large community, scientific and technical software labs creating open source codes
    are often based on funding from grants. This is a very different situation to
    the large open source projects like Linux. If a code is dependent on grants, what
    will happen when the funding shifts? This may be an issue with the copyleft licenses,
    for large codes with many contributors. If the funding dries up but the community
    is not large enough to support the code without grants, there may be no way to
    maintain the code, and with many contributors, it may not be possible to change
    the license. The software released under a permissive open source license instead,
    and is of enough utility, it might be possible to fund it commercially, either
    by selling it or starting a software company, or by working with an established
    company, providing possible options for growing the software and making it part
    of comprehensive software solutions.


    As a final note, the institution that you work for have rules about licensing
    software, as managing grants. For example, software developed by employees of
    the U.S. government is automatically in the public domain and cannot be licensed.
    Also, the European Commission has released documents about software development
    and licensing that you may find useful.* You need to check with your institution
    and also understand any requirements connected with grants and other funding sources
    to make sure that you abide by their policies with respect to software and licensing.
    An excellent source for further information on open source and various licenses
    is the Open Source Initiative.


    > * The European Materials Modelling Council (EMMC) Guidance on Quality Assurance
    for Academic Materials software engineering, http://emmmc.info/wp-content/uploads/2015/06/Quality-of-Materials
    -Modelling-Software_V3_201502264.pdf, accessed October 14, 2015.


    > † Open Source Initiative, http://opensource.org, accessed October 14, 2015.'
