    # 14.4 Installing and Using HDF5


    Installing HDF5 is system specific, and if you are running at a large service
    provider, it is likely that they already have an installed and supported version.
    If you maintain your own system, you will need to install either the parallel
    or serial version (depending on your setup and needs) or the Python interface;
    for example, on a Debian Linux system, this should be as simple as


    ```

    $ sudo apt-get install libhdf5-serial-dev

    $ sudo apt-get install hdf5-tools

    $ sudo apt-get install python3-h5py

    ```


    This will install the underlying HDF5 library, the tools and the h5py interface.
    It is worth noting that when working directly with the C or C++ language interfaces,
    HDF5 includes some helpful scripts (h5cc, h5cff, and h5cpp) that wrap the compiler
    so that the correct libraries, headers, and others, are included. This can also
    be done by hand, but these scripts are handy and work analogously to mpi wrapper
    scripts mpicc, mpif90, and others, with which you may already be familiar.


