  md: '# Getting Started with Python 3


    Python lists possess several Built-in functions to operate on themselves, which
    can alleviate some of your coding burden. Creation and access of a list in your
    script are simple using square brackets [], with an index beginning at 0 (Python
    lists are “zero-indexed”). Lists can span multiple dimensions as well, by creating
    nested lists. Keep in mind, if you create multiple lists and then a nested list
    from them, your nested list will contain pointers to your original lists. Any
    change in the original lists will change your nested list. You can check the length
    of a list using the len() function. The example below illustrates many of these
    points. Examples may be run in an interactive prompt, we will use the symbols
    >>> to denote the interpreter and any lines without symbols represent output.


    ```

    >>>dates = []  # create a list called dates

    >>>dates.append(1991) # add an element with integer 1991

    >>>dates.append(1992)

    >>>dates.append(1993)

    >>>dates.append(1992)

    print(dates)

    [1991, 1992, 1993, 1992]

    >>>print(dates[1])

    1992

    >>>print(len(dates))

    4

    >>>dates.remove(1992) # remove first element containing 1992

    print(dates)

    [1991, 1993]

    >>> sixties = [1960, 1961, 1962] # create and fill sixties

    >>>seventies = [1970, 1971, 1972]

    >>>eighties = [1980, 1981, 1982]

    ```


    ```

    # set the zeroth element in dates equal to the sixties

    >>>dates[0] = sixties

    >>>dates[1] = seventies

    >>>dates[2] = eighties

    ```


    ```

    >>>print(dates)

    [[1960, 1961, 1962], [1970, 1971, 1972], [1980, 1981, 1982]]

    >>>print(dates[1])

    [1970, 1971, 1972]

    >>> sixties.remove(1961) # remove element from a nested list

    >>>print(dates[0])

    [1960, 1962]

    ```


    A fast way to specify and access certain portions of a list is through a technique
    called slicing. Using a colon to denote a range, get back a smaller list. The
    first index is inclusive, while the second index is exclusive; this is written
    mathematically as [a:b]. If you want a range starting from the beginning or finishing
    at the end, you do not have to use a first or second index respectively. For example,
    if we have a list of nine elements, we get the first four elements—[0], [1], [2],
    and [3]—using pizza[:4] (which is the same as pizza[0:4]). Similarly, with the
    last elements, we use pizza[5:]. If we just want the middle 3, we call pizza[3:6],
    where the slice stops before index 6. Python allows for negative numbers in indices
    as well, where pizza[-1] will give you the last entry and pizza[:-1] returns everything
    but the last entry. Accordingly, pizza[-2:] will give you the last entry.'
