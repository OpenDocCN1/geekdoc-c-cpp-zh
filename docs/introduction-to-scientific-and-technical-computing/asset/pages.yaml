  md: '# Parallel Computing with Accelerators


    OpenACC is its portability; it is not restricted to a specific accelerator. Currently,
    it supports GPUs from NVIDIA and AMD corporations. To maintain portability into
    the future, OpenACC supports multiple levels of parallelism and a memory hierarchy.
    OpenACC provides directives to offload data and computation from a host device
    to an accelerator. In a typical situation, the host would be the CPU and the accelerator
    would be the GPU. CPU and GPU have different memory spaces; however, OpenACC provides
    directives to manage data movement between the host and the accelerator. Unlike
    the common practice in CUDA to declare separate pointers, OpenACC can manage different
    memory spaces through a single declaration of pointers, which simplifies parallel
    programming, debugging, and code maintenance tasks significantly. Programmers
    who are experienced with OpenMP will find OpenACC familiar. In our wave example,
    the serial code remained unchanged, and with a few lines of directives to be added
    for parallel computing on the GPU, it would be better to say that OpenACC is less
    intrusive in terms of porting code to accelerators than CUDA.


    The common syntax of OpenACC is the keyword acc followed by a directive and optional
    clauses. In C/C++, the directives are represented by `#pragma`. The keyword acc
    informs the compiler that the directives follow are from the OpenACC application
    programming interface (API). The directives can follow a block of code contained
    by clauses ((..)).


    Porting a scientific simulation code to a parallel computing platform can be a
    daunting task. A significant effort is needed to identify compute-intensive sections
    of a code. Because of scope and page limitations, we will not delve into the details
    of such laborintensive efforts. As a best practice for parallel computing on accelerators,
    a programmer should minimize peripheral interconnect expense (PCI) data transfers
    between the host and the accelerator. It is difficult for a programmer to detect
    data locality and to copy local data back only when needed. In the finite difference
    solution of the wave equation, we need the wave amplitude at t at t-1, t, and
    t+1 (i.e., variables u, and uold). In the function solvewave, u is updated at
    each step on the accelerator, and pointers are swapped before moving to the next
    step. To ensure performance wise, offload this data to the accelerator once and
    copy it back when needed. OpenACC provides a data region to achieve this. The
    data region is shown in Listing 16.2a at line 189. Note that the data region is
    outside of the timeframe-loop to keep local data on the accelerator during time
