    should be free and open: "the users have the freedom to run, copy, distribute,
    and improve without limitation." This is the reason that copyleft licenses insist
    that the license apply to any modifications or additions to that are redistributed.
    If you use copyleft as part of your software, then you have no choice but to license
    your software—it is a "derivative" work—using a compatible copyleft license. In
    practice, this means that you incorporate GPL-licensed code into yours, either
    directly as source code or by linking to the GPL code, you need to use the GPL
    as the license. This also means that if you use a strong copyleft license like
    the GPL, then anyone who adds to your code must distribute their version under
    the same license, typically the GPL.


