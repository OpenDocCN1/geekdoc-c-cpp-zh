    to test whether a variable name has been used or not. The variable to be tested
    should be at the left of the dash, the parameter to evaluate, if it does not exist,
    it should be at the right. For example, if we have set the value of MY_NAME to
    "Erik", the expression ${MY_NAME-Batman} will evaluate to "Erik", whereas the
    variable MY_NAME has not been defined, the same expression will evaluate to "Batman":


