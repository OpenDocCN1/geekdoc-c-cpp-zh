    \ memory atomically, atomic directives are cheaper to execute than critical directives.\n\
    \n| Critical directive | Atomic directive |\n|---|---|\n| !$omp parallel shared(sum,x,y)\
    \ | !$omp parallel |\n| ... | ... |\n| !$omp critical | !$omp atomic |\n| call\
    \ update(x) | sum=sum+1 |\n| call update(y) | |\n| sum=sum+1 | |\n| !$omp end\
    \ critical | !$omp end parallel |\n| !$omp end parallel | |\n\nNote that atomic\
    \ applies to the “sum=sum+I” operation only and cannot be used with a more complex\
    \ statement.\nOpenMP barriers are placed within parallel regions to synchronize\
    \ threads. No thread will proceed past the barrier until all threads arrive at\
    \ the barrier. Consider the following example:\n\n```\n#pragma omp parallel shared\
    \ (A, B, C) private(id)\n{\n  id=omp_get_thread_num();\n  A[id] = big_calc1(id);\n\
    \n#pragma omp barrier // explicit barrier\n#pragma omp for\nfor(i=0;i<N;i++) {\n\
    \  C[i]=big_calc3(i,A,N);\n} // implicit barrier\n#pragma omp for nowait\nfor(i=0;i<N;i++)\
