  md: '# Testing and Verification


    **Code Under Test:** The code that is being executed by a test case and whose
    correctness is the subject of the said test. Often used in the context of unit
    tests or functional tests.


    **Command Function:** Functions whose purpose is to maintain a persistent side
    effect or observable state change. One of two broad categories of functions, from
    the per-pective of testing strategies.


    **Edge Case:** A situation or behavior that occurs at the boundary of the acceptable
    parameters for code or system. Often used to draw attention to potential sources
    of errors or oversights in program logic.


    **Functional Test:** A test that encompasses multiple units, verifying that they
    interoperate as the programmer intended.


    **Integration Test:** A test that verifies the correctness of code at a higher
    conceptual level, often describing an entire feature or user action that might
    involve dozens of functions, classes, or external resources. Integration tests
    maintain human-scale assertions about the program.


    **Liskov Substitution Principle (LSP):** A mathematical description of strong
    behavioral subtyping in object-oriented languages. It says that an instance of
    a subclass should be able to stand in for any instance of its superclass (in test
    cases, for example). Adhering to the LSP contributes to the clarity of a program’s
    design.


    **Memoization:** Storing the result of a particular computation, especially expensive
    operations, for reuse rather than recalculation.


    **Mock Object:** A type of test that provides known, "dummy data" responses instead
    of executing the code of the object that it stands for.


    **Mutation Testing:** Testing that begins by mutating a source code and runs the
    entire test suite, expecting a failure. If no failures occur, this indicates a
    weakness or omission in the test suite.


    **Object Graph:** In object-oriented languages, the execution will come to consist
    of many objects that contain references to each other in a graph structure.


    **Property Test:** A type of testing that runs series of integration-like tests,
    but across programmatic ranges of input data in hopes of identifying overlooked
    edge cases or other problematic issues.


    **Query Function:** Functions that only serve to return a result for their input
    parameters.


    **Refactoring:** A reorganization of code that does not alter its behavior, with
    a goal of increased clarity. Sometimes called "cleaning up" the code. Identifying
    and generalizing new abstractions are common tasks in the process of refactoring.


    **Seed Value:** In tools such random number generators, seed values are inputs
    to the algorithm for the same sequence of numbers to be generated each time the
    same seed is provided.


    **System Test:** A test that attempts a full run of all major codes under known
    conditions, asserting only a final result. Sometimes called "end-to-end tests.\
    For small projects, systems may be indistinguishable from integration tests.


    **System Under:** Related to code under test, but describing a larger unit, often
    at a scale of an entire feature or application. It would be unusual to call a
    single function "system under test in the context of a unit test.


    **Test Case:** The individual clause that describes a specific assertion about
    the code (or system) under.


    **Double:** In object-oriented languages, test doubles help isolate the parts
    of the system currently under from other parts upon which it may depend, but whose
    detailed behavior is unrelated to the particular test.'
