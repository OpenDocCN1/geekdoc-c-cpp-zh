  md: '# 17.6.3 A Project with Certainty in Its Goals


    This applies to both adolescent projects, whose behavior is well-established,
    and to new projects that have high certainty in their requirements. As with the
    previous, integration and system tests still help track progress toward milestones.
    Unlike projects with more uncertainty, any expectations or details that are known
    at the time of writing code should be captured in unit tests.


    # 17.7 Realities of Testing in the Project


    Even a reader who is excited by the confidence, simplicity, and clarity that an
    automated test suite may still have lingering questions about the feasibility
    of the extra work involved. In fact, a common criticism from undisciplined programmers
    tends to be that tests slow down development because they require writing as much
    as code.


    # 17.7.1 Does Testing Take a Lot of Time?


    Writing software is a discipline. It is a muscle that must be developed and, like
    any muscle, becomes quicker and feels more natural over time. More experienced
    programmers and software engineers tend to be among the most adamant about testing.
    This is no coincidence. Testing often pays in the short run and always pays off
    in the long


    The type of tests chosen for the project, the amount, and what code is tested
    by lies on a spectrum of usefulness. The notion of “code coverage” introduced
    in Section 17.3.2.4 does not have a direct correlation with software reliability.
    As discussed in Section 17.6, some projects gain from a looser set of integration
    or functional tests, while other projects benefit greatly from rigorous unit testing
    of any significant function in the system.


    # 17.7.2 How Many Tests Are Enough?


    The sky is the limit, but it is important to consider what is useful to the project.
    Diligently keeping code coverage at 100% can feel rewarding (almost like game),
    but major projects can be of functionality at 85% or 95% coverage. Avoid tests
    that are actually testing the environment, the language itself, or any third-party
    libraries (especially when those have their own test suites).


    For those wishing to push the limit on software quality, two advanced tools are
    introduced in Sections 17.7.2.1 and 17.7.2.2.


    # 17.7.2.1 Mutation Testing


    Mutation tests work by analyzing a project''s source code; changing a single constant,
    symbol, or comparison operator; and running the full test suite. If all tests
    pass the code having been “mutated”, there must be a case that the tests do not.
    For instance, a mutation test must change a < comparison to a <=, causing an iteration
    to proceed longer than it ought. In this way, mutation testing is a test for a
    project''s test suite.'
