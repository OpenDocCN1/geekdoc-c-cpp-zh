  md: '# Makefiles, Libraries, and Linking


    This simple code could have been written in a single file and compiled with a
    single command. Most codes are not so simple. Most research codes are the product
    of many collaborators, contain many components, and are written with testing and
    extensibility in mind, and we break out the individual steps here to illustrate
    the level of detail that should go into designing a good system. The design, implementation,
    and maintenance of a sound mechanism to manage development, dependencies, and
    compilation, across multiple platforms, are called build engineering. A good myfile
    can be an important part of the build engineering design for a given code.


    Let''s see what a myfile might look like the same project. We will take the build
    commands from the script above, show what they would look like a myfile, then
    add some details about how it work before the script. To started, we introduce
    the idea of targets. Target is something that the myfile understands how to make,
    and every myfile should have at least one target. For c _program, one of the targets
    would be the ''_o'' object file, and the way we would specify that target would
    be


    ```

    c_program.o: c_program.c

    gcc -c c_program.c

    ```


    c _program is the target. It appears to be the left of the colon. The things on
    which the target depends are dependencies and appear as a list to the right of
    the colon. The second line is the rule. The rule gets executed when you ask to
    update a target, but only if the dependency has been modified recently than the
    target. Let''s say that you have a myfile with just the above two lines. If you
    execute a command to update c _program:o:


    ```

    $ make c_program.o

    ```


    Let''s see what a good myfile might look like, implementing all the rules of our
    script, plus a few extras:


    ```

    #!/usr/env make

    # Beginning a line with a ''#'' makes it a comment.

    # Comments are great for leaving notes for yourself

    # and anyone else who might read your Makefile

    ```


    ```

    # If you don''t tell what target to build (you just type ''make'')

    # then it will attempt to update the first target in the file.

    # I specify a default target, just in case I don''t want it to run,

    # say, what would be the first target ''clean'' which will delete stuff.

    # Deleting stuff is scary.

    ```'
