    # 4.3.2 Fixing Mistakes


    Even the best programmers makes mistakes. The entire reason we have version control
    systems is to mitigate these. If you changed a file and not committed it, you
    can use git checkout to reset the file to its previous version:


    ```

    -cretel/test_repo$ echo "OOPS" >> new_file.txt -cretel/test_repo$ git

    status

    # On branch master

    # Changes not staged for commit:

    # (use "git add <file>..." to update what will be committed)

    # (use "git checkout <file>..." to discard changes in working

    directory)

    ## modified: new_file.txt

    #no changes added to commit (use "git add" and/or "git commit -a")

    -cretel/test_repo$ git checkout new_file.txt

    -cretel/test_repo$ git status

    # On branch master

    nothing to commit (working directory clean)

    -cretel/test_repo$

    ```


    This command can be done on an entire entity at once as well. It will replace
    the contents of the file with whatever was at the time of the most recent commit,
    so be careful if you want to save the data.


    If you have accidentally added a file you had not meant to, you can use git rm
    --cached <filename> to remove it from the index. If you want to remove it from
    the working directory, you can use git rm -f <filename>.


    This technique works only if the file has not already been committed. In the case
    it will be, you need to use amend the previous commit. This can be done by running
    the git commit --amend command.


    In order to use this, make the changes that you need to your repository, add them
    as usual, and then run the git commit --amend command. As usual you will be given
    a chance to update the commit message, and the most recent commit will be modified
    to reflect your new changes.


    Note that this should not be done to commits that have been shared with your collaborators
    because it can create a repository history inconsistent with their local copies.
    Only do it for cleaning up local commits prior to sharing them.


    More advanced cleanups can be handled with the git rebase command. Consult the
    git documentation on rebase, as it is involved and outside the scope of this chapter.


