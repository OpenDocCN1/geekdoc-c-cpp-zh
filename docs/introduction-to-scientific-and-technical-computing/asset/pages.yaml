    In addition to the, there are three commands in Bash that are useful for flow
    control: continue, break, and exit. The continue command will skip the rest of
    a loop and continue with the following step. In the case of a for loop, the iterating
    variable will take its next value, and in the case of while/until, the condition
    will be checked again. When used in a nested loop, continue skips to the next
    iteration of the innermost loop. It is possible to skip to the next iteration
    of an outer loop by using continue number. For example, continue 2 will skip to
    the next iteration of the loop containing the innermost.


    The break command is similar to continue, but it immediately exits the loop instead
    of skipping to the next iteration. As continue, break will immediately exit the
    loop inside a set of nested loops, break number can be used to break out of the
    enclosing loop(s).

