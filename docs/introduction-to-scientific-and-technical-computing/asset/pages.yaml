    It is not relevant to our simple finite difference example, but let''s assume
    that a different algorithm might need to operate on unew. Unlike computing, we
    cannot simply use unew for a different calculation within the same kernel, CUDA
    does not allow synchronization of independent blocks within a kernel. We have
