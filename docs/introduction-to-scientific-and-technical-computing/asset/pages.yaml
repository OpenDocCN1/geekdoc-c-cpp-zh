  md: '# Libraries for Linear Algebra


    engineering applications, matrices are sparse, meaning that they may have many
    zero elements that you may want to adopt a specialized format to prevent storing
    the zeroes and operating on them. There have been some efforts to standardize
    operations on sparse matrices, but none of these have taken hold. Consequently,
    each sparse matrix package has its own internal format. In this chapter, you will
    see a library that differs applications and is of a different design, with smaller
    routines that are used as a toolbox.


    The Portable Extendable Toolkit for Scientific Computing (PETSc) and LAPACK both
    consider linear systems to be a common concern, but instead of dense systems,
    it arising from finite element (FE) calculations. While LAPACK is exclusive for
    shared memory, PETSc can be used on a single processor or in distributed memory
    through its use of Message Passing Interface (MPI).


    Sparse systems of equations are harder to deal with dense ones for a number of
    reasons. One is that software is not standardized: there is no sparse equivalent
    of BLAS or LAPACK. Another is the irregularity of the problems makes programming
    in parallel much more difficult than the dense case. For such reasons, powerful
    libraries like PETSc (notable competitors are Trilinos and Hypre) have the basis
    of most computational research in computational fluid dynamics (CFD) and related
    fields.


    In this chapter, you will see some basics of PETSc, its linear system solving
    facilities, and some remarks about how the library interacts with other software
    packages.


    # 15.5.1 What is in PETSc?


    The PETSc library is used primarily if you have a linear algebra problem to solve
    that comes from typical engineering applications. For instance, there is support
    for building coefficient matrices and Jacobians from finite differences and finite
    elements. Then, there is a large collection of linear and nonlinear system solvers,
    for the type of sparse systems from finite differences and elements. These are
    all highly customizable.


    Additionally, PETSc has support for debugging and profiling, and it contains various
    utility tools in support of the linear algebra.


    The main mode of parallelism is through MPI, but there is support for GPUs and
    threads.


    # 15.5.2 The PETSc Workflow


