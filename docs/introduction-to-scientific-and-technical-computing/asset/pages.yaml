    +   - The colon character, '':'' can be combined with ''-'' to test whether the
    variable is null in its existence. For example, if MY_AGE is set to a null string,
    the expression ${MY_AGE-Undefined} would return the null string, ${MY_AGE-Undefined}
    would return UNDEFINED:


