    In addition, a node may have what an accelerator. An accelerator may be Intel''s
    Xeon Phi Coprocessor or a graphics processing unit (GPU) such as is available
    from Nvidia. Accelerators have thousands of cores capable of performing large
    numbers of floating or integer operations in parallel. These cores are specialized
    for specific and very regular computational tasks, allowing them to be less complex,
    cheaper, and more efficient than a processor''s. Conversely, accelerators are
    less flexible than a processor and perform poorly at general tasks such as control
    flow and memory management.


    There is also hardware on the node that adds in off-node communications. For example,
    Infiniband Architectures (to be discussed in the next section) have a host channel
    adapter (HCA) or target channel adapter (TCA) on each node that manages most tasks
    related to interconnect communication. The HCA and TCA cards, in addition to being
    highly specialized for communication tasks, free up the processors during communication
    and allows computational and communication tasks to be overlapped.


    Currently, most accelerators and HCAs are accessible by the processors through
    a Peripheral Component Interconnect Express (PCIe) bus. PCIe is an interconnect
    or bus used in nodes to interface with many different devices, ranging from hard
    drives to memory to the aforementioned connections. Similarly, there are specialized
    interconnects available that connect the processors and memories of individual
    sockets, such as Intel''s Quick Path Interconnect (QPI) and AMD''s HyperTransport
    interconnect, and are used for tasks such as maintaining across-socket cache coherency.


