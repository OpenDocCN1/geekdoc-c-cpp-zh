    expensive, anytime you could save a bit, you did. It was an awful of electrical
    cleverness tied up in all of this, which is not obvious to a programmer coming
    from a different background. The takeaway points to remember are the:


    +   There are 8 bits of information allocated to saying where the decimal point
    should be placed.


    +   There are (effectively) 24 bits of information allocated to storing the number
    precisely as possible.


    +   There is a single bit allocated to say whether the number is positive or negative.


    Additionally, exponent values of 00000000 are used to indicate subnormal numbers
    (provides below) and 11111111 to indicate NaN (with a mantissa nonzero) as well
    as +/- infinity (with mantissa zero). See the entry for single precision in "Wikipedia"
    for more details.


    * https://en.wikipedia.org/wiki/Single-precision_floating-point-format.


    22 October 2016'
