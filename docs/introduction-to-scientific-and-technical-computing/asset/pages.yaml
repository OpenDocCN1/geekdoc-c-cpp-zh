    \ We make the briefest of introductions here, just to show what is possible. There\
    \ are several bindings available, including ctypes and simplified wrapper and\
    \ interface generator (SWIG). We choose to use boost:python because it is considerably\
    \ flexible.\n\nTake this simple example of passing an array of floating-point\
    \ values from Python into compiled C++ code (and, by extension, to C or Fortran)\
    \ and receiving their summed value back.\n\nNote that you will need to have Python,\
    \ boost, and numpy installed.\n\n```\n// in_out.cpp\n\n// The header file contains\
    \ definitions needed to generate the\n// interface.\n\n#include <boost/python.hpp>\n\
    \n// This function will be implemented in C++, but called from python.\nfloat\
    \ sumvals(intarray_length, boost::python::numeric::array in) {\n    float value\
    \ = 0.0f;\n    // Note that before values can be used, they must first be extracted\n\
    \    // via the boost:python machinery\n    for (unsigned int i = 0; i<array_length;\
    \ i++) {\n        value += boost::python::extract<float>(in[i]);\n    }\n    return\
    \ value;\n}\n\n// This is where we declare C++ functions(s) will appear in the\n\
    // python module.\nBOOST_PYTHON_MODULE(in_out) {\n    boost::python::numeric::array::set_module_and_type(\"\
    numpy\", \"ndarray\");\n    def(\"sumvals\", sumvals);\n}\n```\n\nThat's it! The\
    \ def() function is defined in boost:python and exports the sumvals C++ function\
    \ to the Python interpreter. It gets more complicated when working with objects\
    \ and handling exceptions, but you get the idea. This code compiles to the in_out.object\
    \ file. The object file gets added to a shared (.so) library. Notice that we do\
    \ not link because we do not have or need a main() function. Launching a C code\
    \ from a shell process requires main(): launching a boost:python code from a Python\
    \ process replaces that paradigm.\n\nBelow is the Makefile. Remember that paths\
    \ may be different on your system, or will probably need to edit the Makefile\
