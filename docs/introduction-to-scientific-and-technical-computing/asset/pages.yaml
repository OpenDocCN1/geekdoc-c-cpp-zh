  md: '# 12.4.3 MPI_Scatter


    | MPI_Scatter(const void *sendbuf, int sendcount, MPI_Datatype sendtype, void
    *recvbuf, int recvcount, MPI_Datatype recvtype, int root, MPI_Comm comm) |


    Contary to MPI_Bcast, MPI_Scatter distributes distinct messages from a single
    source task (sendbuf) to each task (recvbuf) in the communicator. If you want,
    for example, to distribute the different components of a vector to different MPI
    tasks (like for Matrix multiplication), MPI_Scatter is the function to use.


    # 12.4.4 MPI_Gather


    | MPI_Gather(const void *sendbuf, int sendcount, MPI_Datatype sendtype, void *recvbuf,
    int recvcount, MPI_Datatype recvtype, int root, MPI_Comm comm) |


    MPI_Gather is the reverse of MPI_Scatter and gathers distinct messages from each
    task (sendbuf) in the communicator (comm) to a single destination task (recvbuf).
    Be aware that the recvcount parameter is the count of elements received per process,
    not the total summation of counts from all the processes.


