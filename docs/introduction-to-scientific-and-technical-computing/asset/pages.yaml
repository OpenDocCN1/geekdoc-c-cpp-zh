    they operate on the same memory. There is a further type of parallelism that is
    used in cluster computers: distributed memory parallelism. For the latter type
    of parallelism, there are further libraries; we mention the Scalap [2] and Elemental
    [3] libraries.


    Shared memory parallelism is supported by the BLAS and LAPACK libraries, and in
    fact with the same API. For instance, the Intel MKL library is multithreaded versions
