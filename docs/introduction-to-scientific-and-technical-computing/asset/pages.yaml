    # 14.2 HDF5


    Hierarchical Data Format in its fifth incarnation (HDF5) is an emergent standard
    for the

    storage, retrieval, and sharing of data, scientific and otherwise, in much the
    same spirit as

    PDF is a standard for digitization of a printable document, and RDBMS for the
    storage

    encoding, retrieval of relational data, XML is a standard for a readable markup
    of document

    tar-zip is for a file archive, and so on. In addition to data, a file in HDF5
    also

    stores metadata, and one file can hold as many datasets as necessary. The primary
    purpose

    ofDF5 is to abstract the hardware layer away from the user. Instead of worrying
    about

    endianness, you are free to work on your science, financial analysis, and oth-

    ers, and let the good folks at the HDF Group* do the heavy lifting when it comes
    to the

    hardware. By writing data to an HDF formatted file, you can be assured that

    yours, collaborators, rival researchers, and perhaps some future version of

    yyourself will be able to read the HDF data file you wrote, regardless of what
    hardware

    use, what operating system you run, or in what language you code. The example

    in this chapter uses Python because the h5Py Python to HDF5 interface is very
    easy to use

    and illustrates the capabilities. Application programming interface (API) is exist
    for Python,

    C, C++, Fortran, and Java, are others being developed. Also, HDF5 is developed
    with

    future compatibility in mid, so work a file written in HDF5 and read 10–20 years
    later has

    a reasonable expectation of still being fully legible and compatible.


    Although the calls in this example are written in Python, the underlying library
    doing

    the complicated memory access is written in C, and the performance is inherently
    opt-

    imized at the C language level, which is very close to the hardware. Considering
    that sup-

    port parallel I/O is also handled at this same level, there is a lot of I/O optimization
    you

    re leveraging using HDF5.


    # 14.3 H Is for Hierarchical


    Flat files are a great tool, and in combination with standard posix utilities
    can do a great

    deal of work. But at some point, you will need to increase your level of sophistication,
    and

    HDF5 allows you to store numbers, images, sound recordings, video, simulation
    results,

    and literally any other digital information in a flexible and convenient format,
    in a single,

    modifiable file, in parallel, and gives the best of promising allowing such information
    to be

    read at a later.


    HDF uses a HDF5 POSIX path syntax. It not only looks like a filesystem on the

    inside ("/path/to/data") but is in fact possible to store files as well as other
    digital objects

    (photos, audio, etc.) in that tree and to attach attributes, or metadata, that
    describe import-

    tant information about the data, such as what, how it was collected, what the
