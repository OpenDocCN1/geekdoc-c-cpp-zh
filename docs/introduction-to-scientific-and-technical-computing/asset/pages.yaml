- img_proc: true
  md: '# Introduction to High-Performance Computing Systems


    be used to coordinate tasks and communicate between them. MPI is available for
    most distributed memory architectures and implementations exist in C, C++, and
    Fortran, with interfaces to these implementations developed for other languages.
    Multiple open-source (Open MPI, MPICH, and MVAPICH2) and vendor (Intel MPI and
    Cray MPI) implementations of the MPI standard exist.


    MPI does not perform the actual sending and receiving of data but rather an accessible
    public interface (API) that calls routines in the underlying network protocol,
    for example, TCP/IP or Infiniband, which handles the transport and reliability
    of data. Infiniband-supported MPI has two types of communication: channel semantics
    and memory semantics. Channel semantics require the sending and receiving tasks
    post a send and receive request, respectively. The send request will not complete
    until the receiver expects to receive a message. Conversely, memory semantics
    require a dedicated buffer to be in place at all times. Memory semantics use one-sided
    RDMA to send and receive. Involvement of the target host''s processor is unnecessary—the
    target has located buffers ready for reading and writing by other hosts. Memory
    semantics require more memory but incur lower latency than channel semantics.


    # 11.2.3 Shared Memory Programming and OpenMP


    Similarly to how the MPI specification supports distributed memory programming,
    shared memory programming is supported by the OpenMP specification. The OpenMP
    specification is maintained by a large number of hardware and software vendors.
    OpenMP implementations exist for C, C++, and Fortran, with wrappers for additional
    languages. OpenMP''s API supports the creation and management of threads in parallel.


    In parallel regions of OpenMP-supported code can be declared shared or private.
    Shared data are visible and accessible to all threads, while private data is a
    copy of a variable that is visible and accessible to each thread. Synchronization
    is often required in both cases. Shared data should be accessed in a way that
    is consistent with all orderings of the instructions executed by the threads because
    execution is asynchronous. The private data must be communicated to the other
    threads at the beginning or ending of the parallel region.


    OpenMP also supports three types of scheduling in parallel regions of code loops.
    Static scheduling assigns an equal number of loop iterations, or chunks, to each
    thread in a round-robin fashion. Dynamic scheduling assigns a chunk to each thread,
    with thread returning for new chunks after it completes its assigned iterations.
    Guided scheduling is similar to dynamic scheduling; the size of the chunks decreases
    exponentially each time thread returns for more work. Static scheduling has very
    little overhead and should be used for tasks where each iteration requires a similar
    amount of work. Dynamic and guided scheduling should be used where some iterations
    significantly longer than others.


