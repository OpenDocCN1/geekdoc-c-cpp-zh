    # 7.6 Some Notes on Best Practices


    +   - You now know that you can compile different parts of code with different
    compilers and link the results. In theory, it should also be possible to use multiple
    C compilers (e.g., PGI [Portland Group], Intel, and GPU) assuming that everything
    is being done according to the same standards. Unfortunately, this is often not
    the case, and the subtleties encountered can be very, well, subtle. Linking codes
    from different compilers does not guarantee failure, but do not assume success.
    Always test.

    - Mixing I/O from different languages is not recommended. I/O buffers are allocated
    differently, even between C and C++. (File pointers are not transferable; buffering
    may be different) and even if I/O appears to work on one platform (e.g., CentOS
    on hardware X), do not assume that it will work the same across all platforms
    (e.g., Android, MacOS, or Busybox on embedded hardware).


