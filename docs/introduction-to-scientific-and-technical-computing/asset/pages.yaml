    Scientific models certainly exist on length scales beyond atoms and molecules.
    Examples are diverse, including mathematical models developed to capture the impact
    of signaling hormones on the bone remodeling process [4], galaxy formation [5],
    traffic patterns [6], and the manufacturing processes of composite materials [7].
    Given the diversity of models in scientific computing, it is not possible to define
    a single list of validation steps that will work for all models. Instead, we focus
    on providing several general validation schemes that highlight the thought processes
    that should be considered when validating a specific model. To provide a more
    tangible basis, these schemes will be discussed in the context of molecular models
    as a prototypical example of a scientific model. As such, we will first provide
    a basic overview of molecular models.


    # 18.3 Molecular Models


    When coupled with molecular simulation tools, molecular models (also called “force
    fields") have enabled researchers to gain understanding of atomistic- and molecular-level
    interactions and mechanisms that underlie natural and manmade materials and processes.
    Such models typically consist of a set of parameters and equations that describe
    how atoms (or more generally, particles) interact with each other. While molecular
    models typically include a large number of equations and parameters mean to capture
    both the nonbonded (van der Waals and electrostatics) and bonded (bonds, angles,
    and dihedrals) interactions, for simplicity, we will focus only on van Waals interactions
    between atoms to provide a very detailed overview of molecular modeling and simulation.'
