  md: "# Introduction to OpenMP\n\nA single thread running each code will set a[]\
    \ to 2 (1+1) and d[] to 2 (2*). Running in parallel will yield different values\
    \ for some d[]. This is because a[] is shared across OpenMP constructs and appears\
    \ in both the left- and right-hand sides of assignment operations and two or more\
    \ threads are computing to update-and-use its value.\n\nAs a best practice guideline,\
    \ it is critical to understand the data scoping of every variable that appears\
    \ in an OpenMP construct. Manually assigning the data scoping rules, what is private,\
    \ what is shared, and what is reduced, helps enforcing about race conditions and\
    \ the pitfalls of parallelism in code execution, especially for variables such\
    \ as a[], which appear on both the left- and right-hand sides of assignment.\n\
    \nTo solve the race condition, one should employ synchronization through a barrier\
    \ (implicit or explicit), a critical/atomic, or an OpenMP lock. The simplest solution\
    \ would be to restore the implicit barrier by removing the nouait clause.\n\n\
    This is not to say that there are no tools available for syntactic and dynamic\
    \ code analysis to detect possible race conditions some tools, with varying capabilities,\
    \ do exist. However, none of them can guarantee full race condition detection.\
    \ There is simply no substitute to fully understanding code behavior and adequately\
    \ frequent testing.\n\n# 13.9.2 Reducing Errors\n\nCode development is an error-prone\
    \ process, and multithreaded code is even more due to the complexity of parallelism.\
    \ The following is an incomplete list of common beginner errors.\n\n+   - Missing\
    \ compiler option (forgot -openmp or -fopenmp).\n  - The program executes sequentially,\
    \ therefore slower than expected.\n  - Manifests in 0 valued time reports from\
    \ omp_get_wtime().\n- Missing parallel keyword, no threads created, therefore\
    \ program executes sequentially.\n- Missing omp keyword: Compiler directives are\
    \ comments, therefore no performance.\n- Missing do/for keyword: Loops are not\
    \ distributed across threads, poor performance.\n- Missing/forgotten reduction:\
    \ Results depend on the number of threads used.\n- Missing/forgotten private class\
    \ or incorrect variables.\n- Misuse of the lastprivate/firstprivate clause.\n\
    - Unnecessary or unintentional parallelism: This can reduce performance for small\
    \ loops (use conditions) or cause race conditions.\n- Concurrent use of a shared\
    \ variable on both sides of assignment: This is a race condition.\n- Uninitialized\
    \ local variables in a dynamic scope.\n- Parallel array processing without iteration\
    \ ordering when the order of iterations is important: Adding/removing the ordered\
    \ clause will highlight this issue."
