  md: "# Introduction to Scientific and Technical Computing\n\nThe “language” uses\
    \ compiler directives (not to be confused with compiler flags), which programmers\
    \ have to write in the source code. These directives are treated as comments if\
    \ the compiler is not given the necessary OpenMP flag. OpenMP compiler directives\
    \ are classified into three main categories: the sentinel, construct, and clause(s).\n\
    \n| OpenMP Directives: | Sentinel, construct and clauses | C/C++ |\n|---|---|---|\n\
    | #pragma omp | construct [clause [[],clause] ...] | F90 |\n| !omp | construct\
    \ [clause [[],clause] ...] | F90 |\n\nFor example:\n\n| #pragma omp | parallel\
    \ num threads(4) | C/C++ |\n|---|---|---|\n| !omp | parallel num threads(4) |\
    \ F90 |\n\nFunction prototypes and types are in the file:\n\n#include <omp.h>\
    \ | C/C++\nuse omp_lib | F90\n\nMost OpenMP constructs apply to a “structured\
    \ block,” that is a block of one or more statements with one point of entry at\
    \ the top and one point of exit at the bottom. A good example of an OpenMP directive\
    \ is the directive to create a team of threads to execute sections of code in\
    \ parallel. In Fortran:\n\n```\n!omp parallel\n... < perform statements here in\
    \ parallel\n!omp end parallel\n```\n\nand in C/C++:\n\n```\n#pragma omp parallel\n\
    {\n perform statements here in parallel\n}\n```\n\nNote that in Fortran, parallel\
    \ regions are enclosed by directives, and in C/C++, the parallel regions are enclosed\
    \ with curly brackets. The following example prints the message “Hello I am a\
    \ thread” from each thread executing the parallel region.\n\n| Fortran | C/C++\
    \ |\n|---|---|\n| program main | #include<stdio.h> |\n| implicit none | int main(int\
    \ argc, char **argv) |\n| | {\n| !omp parallel | #pragma omp parallel |\n| write\
    \ (*,\"Hello I am a thread” | printf(\"Hello I am a thread\\n\"); |\n| !omp end\
    \ parallel | |\n| | return 0; |\n| end program main | |"
