    High-performance computing (HPC) systems, harness tens to thousands of computers
    working in order to perform more computation in less time than would be feasible
    a single computer. The computational power provided by HPC systems may be applied
    to problems that are too large to run on a single computer or used to reduce the
    runtime required to complete a problem of fixed size. HPC systems are used in
    a broad range of research pursuits including both scientific and oriented fields.
    The community of people that run applications on an HPC system are commonly referred
    to as the *users* of that system.


