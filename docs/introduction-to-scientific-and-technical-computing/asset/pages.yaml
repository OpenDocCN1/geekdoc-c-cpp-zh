    # 1.3 Interacting with Remote Computers


    More than not, when running simulation packages, you will be running them on a
    remote computer (usually a computing cluster/supercomputer). This subchapter will
    cover some of the different ways to interact with remote computers.


    There are several different protocols that can be used to interact with a remote
    computer. At the most basic level there are protocols that allow the user to run
    shell commands on the remote computer and protocols that allow exchanging files
    between different computers. The most basic example of this is telnet, which allows
    a user to start a shell session in a remote computer. The simplest example of
    the protocol is ftp (file transfer protocol), which allows for downloading/uploading
    files from/to a remote server. Both telnet and ftp were widely used in the early
    years of Unix-like systems but have been largely superseded by ssh and scp/ftp
    for security reasons: both transmit data, and particularly, across the network
    in plain text, that is, without any encryption. This means that an intruder monitoring
    network traffic could have access to user passwords and data. For this reason,
    in modern Unix-like systems, these commands are disabled.


    As a result of the security issues with telnet and ftp, more modern connection
    protocols were developed to achieve the same results. The most widely used of
    these are based on RSA encryption, named after Ron Rivest, Adi Shamir, and Leonard
    Adleman, who developed the method. This encryption method allows users and computers
    to freely exchange information across a network while ensuring that only the intended
    recipient can read the information. The RSA cryptystem uses pairs of passwords,
    or “keys,” that are separately used for encryption and decryption. The encryption
    key for a particular user/computer is visible to everyone (and is often called
    the “public key”), whereas the corresponding decryption key is known only to the
    user (“private key”). RSA works as follows: imagine that Alice wants to send a
    file to the user called Bob. Alice will encrypt the file using Bob’s public key,
    which is visible to everyone, and sends the encrypted file to Bob. To decrypt
    the file, Bob uses his private key, which is known only to him. RSA can also be
    used to “sign” files, enabling Bob to verify that Alice was indeed the originator
    of the message. The mathematics behind RSA is fascinating but beyond the scope
    of this'
