    # 11.1 Hardware-Based Parallelism in HPC Systems


    An HPC system is organized into a multilevel hierarchy with a new mode of computational
    parallelism introduced at each level. This hierarchy can be defined in any number
    of ways, but here, we decompose it into four levels:


    +   1. Node-level parallelism—An HPC system has multiple nodes working in parallel.

    2. Processor-level parallelism—A node has multiple processors working in parallel.

    3. Core-level parallelism—A processor has multiple cores working in parallel.

    4. Instruction-level parallelism—A core can execute multiple instructions in parallel.


    A schematic of this hierarchy with the magnitude of parallelism introduced at
    each level is displayed in Figure 11.1. At the node level, an HPC system consists
    of multiple nodes connected to each other over a network. Each one of these nodes
    is a computer running its own operating system (OS). The processor arises from
    the multiple sockets contained on each node, each socket has its own processor
    and memory in addition to other specialized computing and I/O hardware. At the
    core level, each processor has multiple interconnected cores with private and
    shared memory capable of independent computation. Finally, at the lowest level,
    each core is composed of multiple subunits capable of executing instructions in
    parallel. The rest of this section will describe each level of parallelism in
    greater detail.


    ![](img/a7c22408154d0c003c87fe57465d2952_159_0.png)


    **FIGURE 11.1**

    Parallelism appears at multiple levels in HPC systems. The lowest level is instruction
    execution within a core, the next level is due to multiple cores, the next is
    due to multiple sockets within a node and the highest is to nodes connected through
    a network.'
