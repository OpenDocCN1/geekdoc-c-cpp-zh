  md: "# 12.1 The Origin of MPI\n\nDuring the 1980s, many companies were already building\
    \ and selling parallel computers. Their programming environments were composed\
    \ of a sequential programming language (C or Fortran) and a message-passing library\
    \ to allow the different programming processes to communicate. Unfortunately,\
    \ each builder had their own message-passing library, which led to many issues.\
    \ In fact, a parallel code developed on nCUBE/10 did not compile and run on an\
    \ Intel iPSC. Rewriting/modifying the code was required every time a different\
    \ architecture was used. It was a big concern because parallel codes were not\
    \ portable. There was a need to a standard for all these different message-passing\
    \ libraries.\n\nThis is what happened with the creation of the Message Passing\
    \ Interface (MPI) standard and its initial version in 1992. This standard defined\
    \ an accessible public interface (API) that is now used by all MPI libraries to\
    \ exchange messages. Version 1.0 of the standard appeared in 1994. The MPI standard\
    \ is still improving, and multiple versions have been released over the years.\
    \ The most recent version is 3.1, released in June 2015.\n\n# 12.2 A Little MPI\
    \ Program to Start\n\nMPI is a library that uses specific instructions but also\
    \ specific commands to compile and execute the parallel code. In this section,\
    \ we will introduce and explain the first instructions that you need to know,\
    \ but we will also learn how to build and launch an MPI code.\n\n# 12.2.1 From\
    \ Serial to Parallel\n\nFirst, let's take the classical \"Hello world\" example,\
    \ which can be found in the C Programming Language book by Kernighan and Ritchie.\n\
    \nLISTING 12.1 “HELLO WORLD” IN C\n\n```\n#include <stdio.h>\n\nmain ()\n{\n \
    \   printf (\" Hello world \\n\");\n}\n```\n\nIf you compile and run this program,\
    \ only one process will print \"Hello world.\"\nThe usage of MPI will allow you\
    \ to execute your program on multiple processes at the same time. Thus, a parallel\
    \ version of the classical \"Hello world\" can be written as shown\nin Listing\
    \ 12.2."
