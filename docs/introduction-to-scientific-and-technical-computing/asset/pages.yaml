    # 18.2 What Is a Model?


    In the general sense, a model consists of a set of rules designed to mimic the
    key features of a system, phenomenon, or process. The rules in a model may be
    simple or complex, numerous or few, all depending on the application and what
    behaviors the model aims to capture. In the realm of scientific computing, we
    typically focus on mathematical models, whose rules are codified and associated
    fitting parameters.


    As an example, considering the model codifying the set of rules that describe
    the motion of the ball falling from rest. The simplest model would include gravity
    (ie the kinematic equations). This model could be made complex, and presumably
    more accurate, by adding rules that account for air resistance or the inelastic
    collision of the ball with the ground or by taking into account the rotation of
    the ball by time. The level of detail required depends on which properties we
    are interested in and how accurately we intend to reproduce them. For example,
    a model that takes into account air resistance would be unnecessary if we simply
    wanted to reproduce the behavior of a ball falling a short distance, where effects
    are negligible. Note that while the kinematic equations are the essential component
    of the model, the model does not necessarily provide the algorithm for solving
    these equations. A standard equation solver, such as Mathematica or MATLAB, is
    capable of mathematically evaluating the model irrespective of which phenomena
    the equations are actually modeling. Again, the model and software can typically
    decouple, allowed validation and verification to be performed independently.


    In scientific computing, models can be developed from a variety of sources, including
    the following:


    +   * Knowledge of the underlying physics of a model

    * Low-level first-principles calculations

    * Other more complex or costly models

    * Experimental measurements or observations

    * Some combination thereof


    For example, first-principle calculations can be performed to capture the energy
    required to form a bond between a gold atom and a sulfur atom; these measurements
    can be used to develop a much simpler and computationally cheaper model [3]. In
    an example, model validation would include both how accurately the model captures
    the first-principles calculations and how accurately the model reproduces experimental
    behavior, such as enthalpy or entropy changes. The specific metrics used to validate
    the output of the model will depend on the system or process that is being modeled.


    Figure 18.1 shows a conceptualization of how mathematical models and experiment
    are often intertwined. Experiments, or more sophisticated calculations, yield
    hypotheses that'
