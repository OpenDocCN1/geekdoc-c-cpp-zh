    # 16.2 NVIDIA CUDA Architecture


    Modern GPUs are massively parallel computing platforms ideal for fine-grained
    parallelism, where many threads are processed simultaneously. GPUs impress with
    their high number of cores and high bandwidth. NVIDIA''s Tesla K40 has 2880 cores
    with a memory bandwidth of 288 GB/s. A key distinguishing feature of CUDA is its
    ability to create many threads with little overhead. The number of threads on
    a GPU can greatly exceed the number of cores. GPU threads are lightweight compared
    to CPU threads because they do not store their own state. CUDA gives the programmer
    control over the number of threads and the organization of memory on the GPU;
    it allows a skilled programmer to utilize the GPU hardware optimally for a particular
    program. So requires detailed knowledge of how the threads are scheduled for execution
    and the latencies with each type of memory (see CUDA User Guide for more details),
    but certain rules-of-thumb can help achieve good performance.


    CUDA introduces a thread hierarchy, allowing a multithreaded program to be expressed
    as a grid of thread blocks. Each block of thread is then scheduled before the
    scenes to be processed on a streaming multiprocessor (SM) as space becomes available.
    This feature is key to the scalability of computations on a GPU. An SM is a group
    of cores on a GPU put together to process a thread block. The 2880 cores of Tesla
    K40 are distributed over 15 SMs, each having 192 cores. In addition to thread
    blocks, a configuration of 32 threads is called a warp. A warp calculates a single
    instruction in lockstep on an SM. Another concept is the half-warp in which global
    memory accesses are coalesced in a single transaction. However, it is beneficial,
    performance wise, to create thread blocks that are multiple of 16 threads. That
    the maximum number of threads per multiprocessor is 2048 for Tesla K40, and the
    best practice for performance is to have 256 or 512 threads per thread block.


    In addition to a thread hierarchy, CUDA provides a memory hierarchy. There are
    separate memory spaces that can be fast or slow with different read and write
    performances. The global memory on the device can be quite large (e.g., 12 GB
    on Tesla K40). It can be read and written from the host (i.e., CPU) and the device
    (i.e., GPU). All threads have access to global memory, but access can be slow.
    Therefore, coalescing the accesses help the latency.


    Shared memory is fast, but small in size. Only the threads within the same block
    have read and write capabilities to the shared memory. In NVIDIA''s Kepler architecture,'
