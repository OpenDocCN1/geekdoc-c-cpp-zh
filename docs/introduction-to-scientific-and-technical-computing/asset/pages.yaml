    Most of the computing resources available to run large simulations using Unix-like
    systems. This is not a coincidence, the Unix™ paradigm has proven to be ideal
    for managing systems with a large number of users and includes powerful tools
    to manage and process complex dataset. In this chapter, we will introduce some
    of the basic features of Unix-like systems (which include Linux and the Mac OS
    X Port, Darwin). This chapter is not meant to be a comprehensive guide or a system
    administrator guide, but an introduction covering many of the tools that you are
    likely to use on a regular basis. More information on additional tools may be
    found at the end of the chapter [1,2].


    #  1.1 Introduction: The Kernel, Shells, Processes, and Environment Variables


    All Unix-like operating systems have at their core a process called the kernel.
    The kernel is the first program that is loaded into memory upon booting and is
    in charge of all the low-level communications between running processes and the
    hardware, as well as controlling basic functions such as memory management, process
    management, scheduling, file management, input/output, and network management.
    The kernel has full control over everything happens in the system, and it must
    run continuously while the computer is in operation.

    An instance of running a program is called a process, and it is identified in
    Unix-like systems by a unique number called a process identifier (PID). Note that
    a program itself is not a process, but rather a file containing a collection of
    instructions to be executed.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction to Scientific and Technical Computing


    program may run multiple times (or by different users), give to multiple processes.
    A special process is the init process, which is executed by the kernel and is
    in charge of starting and managing other processes. The init process has a PID
    of 1, and subsequent processes are numbered sequentially as they are created.
    A file is a collection of data contained in any storage media (such as a hard
    drive or optical disk). Files can also be abstractions for system devices (such
    as a drive or a network card) and communications between processes.


    There are couple of special types of process that have special names: daemons
    and shells. Daemons are processes running in the background that provide different
    functions to the operating system and do not usually interact with users. For
    example, the http daemon enables a web server to respond to requests (such as
    a remote requesting to load a web page). The system-logging daemon enables the
    writing of system messages to files, which can be used to diagnose potential problems.
    Usually, daemon have names ending with the letter "d"; for example, the http daemon
    is called httpd, and the system-logging daemon is syslog. There, however, exceptions
    to this rule; the daemon in charge of scheduling processes is called cron, and
    the daemon that provides e-mail is called sendmail.


    Shells are processes that enable the interaction between a user and the operating
    system. A shell provides a set of commands that allow a user to do things like
    running other processes and managing files. The particular set of commands is
    not unique, as there are several different shells available in Unix-like systems.
    Some of the shells are as:


    +   - csh/tcsh: The C shell (csh) and its modern successor, tcsh, are designed
    to use a syntax akin to the C programming language. Although some operating systems
    use tsh as their default shell, it is not the easiest to use for beginners and
    it is a suboptimal choice for scripting (discussed in a later chapter). The C
    shell has been largely replaced by Bash (see below) in most systems.

    - sh/Bash: The Bourne shell (sh) and its modern successor, Bash (Bourne-again
    shell), are designed to allow scripting, which will be covered in a later chapter.
    The Bourne shell was the original Unix shell. Most Unix-like systems use Bash
    or another modern successor of sh called the Alquist shell (ash).


    Other shells include the Korn shell (ksh), which is based on the Bourne shell
    but includes features from the C shell, and the increasingly popular z shell (zsh),
    a modern scriptoriented shell that incorporates features from Bash, ksh, and tsh.
    The rest of this chapter will cover Bash commands, as this is the most widely
    used of all.

    Users often interact with Unix-like systems (especially remote systems) via text-based
    interfaces, such as term (in a Unix-like system) or the terminal application (in
    Mac OS). Many applications have been designed to run via such interfaces and are
    usually called consoles. Console apps lack a sophisticated graphical user interface
    (GUI), which may make them unattractive at first, but they have fewer hardware
    requirements, are simpler and often allow the user to carry out complex tasks
    quickly. Some common consoles are pine/alpine (a text-based email client), vim,
    and emacs (widely used text editors). Most popular software packages, including
    mathematical simulation software, are designed to run from a text-based interface.

    Every running process in a Unix-like system (including the shell) has access to
    a set of environmental variables. These variables are used to store user preferences
    or to communicate between processes. A list of all the defined environmental variables


