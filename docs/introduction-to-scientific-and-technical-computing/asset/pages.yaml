    to reuse that module or function in other parts of the project. Thus, in writing
    a test is not simply to burden a grind and bear but is a sign that the code under
    test could be made simpler, for instance, deconstructing the assumptions of a
    code that groups together into smaller units, changing a data structure, or simply
    verifying the assumptions of a code that groups together functions that might
    not belong.


    This feedback about the simplicity of code is especially useful when a programmer
    can both code and test in short iterations, that alternating between code writing
    and tests often identify coding for several hours (or days) and writing tests
    only after major milestones. This feedback is one of the advantages of test-driven
    development, the topic in Section 17.5.1.


    Code that is difficult to understand is less useful as time passes from its moment
    of writing. Consider the idea of writing code in a manner so that it requires
    the upper limit of one''s understanding to decipher. To write this code is to
    make an assumption that everyone should find natural. It assumes that all the
    moments in the future (e.g., years later, during a thesis defense), the same programmer
    must be clever just to understand what he or she had produced.


    On the topic of complexity, an attitude shared by far too many researchers, scientists,
    and especially software engineers is the attitude of taking pride in producing
    complexity. This is not natural, as in all technical fields, being of understanding
    complexity is held in high regard. It is key to realize, however, that domain
    complexity is not an excuse for code complexity! Being on the scientific cutting
    edge and doing research does not excuse shoddy, messy or indecipherable code.
    People need to understand each other''s code in order to have confidence in their
