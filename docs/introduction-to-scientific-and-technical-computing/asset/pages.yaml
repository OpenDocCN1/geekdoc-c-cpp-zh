    is shown in Figure 11.2. The memory in each socket is visible to every other socket
    and appears to the programmer as a single memory space. The sockets are connected
    by on-node interconnects that allow the multiple sockets to maintain cache and
    memory coherence. It is, however, additional latency associated with accessing
    memory is not local to a processor''s socket. The access of data nonlocal to a
    processor is known as nonuniform memory access (NUMA). In contrast, uniform memory
    access (UMA) refers to accessing memory local to a socket; for example, all cores
    within a processor access the local socket''s memory in an identical manner. The
