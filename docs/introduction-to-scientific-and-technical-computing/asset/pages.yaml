  md: '# Operating Systems Overview


    the string "ENERGY:", discarding the first 100 lines. We achieved this with the
    following command:


    ```

    $ grep "ENERGY:" file.log | tail -n +101 | tr -s '' '' ''\''

    cut -d '' '' -f 1,12,13

    ```


    With awk, this is shortened to:


    ```

    $ grep "ENERGY:" file.log | tail -n +101 | \

    awk ''{print $1,$12,$13}''

    ```


    which is much simpler.


    In general, an awk command has the following structure:


    ```

    awk ''BEGIN{commands}>{commands}END{commands}>'' file

    ```


    Each of the three sections within the curly brackets may contain commands with
    a syntax similar to that of the C programming language. Commands are separated
    by semicolons; ". It is possible for the program to span multiple lines, although
    for complex tasks requiring many lines of code, it is easier to write a script
    (see Chapter 9). The commands within the BEGIN section are executed at the beginning
    of execution, the commands within END are executed at the end, and the commands
    within the middle brackets are executed on every line of the input file. Numbers
    preceded by a dollar sign, "$", becomes the field on as in the example above.
    Also, "0" stands for the entire line. There are also a few variables that have
    special meaning in awk. Commonly used ones are the following:


    +   - FS (field separator): This variable contains the character or characters
    that separate the fields on each line. By default, it is whitespace, and it can
    be set to any character or sequence of characters, including a regular expression.
    For example, setting FS=['';''] will make commas and semicolons both as field
    separators. As with everything else, to recover the value of FS, there must be
    a dollar sign front.

    - RS (record separator): This variable contains the character or characters that
    separate the different "lines.\ By default, it is a newline character. RS is not
    commonly used as FS.

    - NF (number of fields): This contains the number of fields in the current line.
    Usually, this is written as NF, if it is read from the input file, not set.

    - NR (number of records): This contains the number of "lines," or records, in
    the file. As with NF, typically this is read, not set.

    - OFS and ORS: These are like FS and RS, but they control the behavior of the
    fields in the output, OFS is the character (or characters) separating the fields
    in the output, and ORS is the (record line) separator.


    In addition to changing the field separator by setting the value of the FS variable,
    it is also possible to change it from the command line using the -F option. For
    example, awk -F '','' will cause the field separator to be a comma (the quotation
    marks are optional); awk -F would also work.'
