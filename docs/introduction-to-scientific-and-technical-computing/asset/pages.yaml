  md: "# Makefiles, Libraries, and Linking\n\nmight say you too many. Most codes have\
    \ too few. Err on the side of including too many comments. Your collaborators\
    \ will benefit, even if they complain about it. Actually, I have never heard anyone\
    \ complain about too many comments.\n\nYou should be able to write a simplemakefile\
    \ now. A very important detail to remember is that the whitespace before the update\
    \ rule (the indented lines following a dependency) is a tab (ASCII character 0x09).\
    \ It is not five spaces, eight spaces, and so on, and if you are copying and pasting\
    \ (e.g., from this book) to create a 말이, be aware that it may not be copied correctly.\
    \ Always use a tab!\n\n# Libraries\n\nNow that we are experts in using a makefile\
    \ to build a simple program with a single function, let's introduce function libraries,\
    \ which you have most certainly been using, but which may not have yet written.\
    \ A canonical example of a function library is the standard library, which contains\
    \ implementations of standard mathematical functions (square, root, etc.) and\
    \ whose interface is defined in the commonly #included math.h header file.\n\n\
    Some characteristics of a function library are the following:\n\n+   - Its interface\
    \ is defined in a header file.\n- It exists as either .a (static) or .so (dynamic/shared)\
    \ binary file in a library directory.\n- It is built from one or more .o binary\
    \ files.\n- It is named libxxx.so and lives in a .../lib directory.\n- It is referenced\
    \ by a compile command with the -l and -L options.\n\nAs an example, we will extend\
    \ the above code to include a second C function c_function_d, which does the same\
    \ thing as c_function, but for a double, and we will put both of these functions\
    \ into both static (.a) and a dynamic (.so) library.\nFirst, the function definition\
    \ (prototype):\n\n```\n/* c_function_d.h */\nvoid c_function_d(double *);\n```\n\
    \nThe C-language file containing the function implementation:\n\n```\n/* c_function_d.c\
    \ */\n#include \"c_function_d.h\"\n/* multiply the input value by 2.0 */\nvoid\
    \ c_function_d(double *d_val) {\n    *d_val = *d_val * 2.0;\n}\n```"
