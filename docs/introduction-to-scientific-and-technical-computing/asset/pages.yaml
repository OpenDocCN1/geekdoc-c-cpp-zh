    # 11.1.1 Instruction-Level Parallelism


    At the lowest level of the computational hierarchy are the execution units in
    the cores with which instructions are executed. Different types of processor instructions
    (e.g., move, add, and multiply) require different execution units and numbers
    of processor cycles to complete. Most modern processors used in HPC systems are
    referred to as superscalar, which effectively means they can pipeline instructions
    through the execution units. Pipelining is the ability of a processor to start
    a new instruction before a previously issued instruction has completed. Instruction
    pipelining allows processors to complete multiple instructions in the same number
    of cycles as a single instruction. This is what is known as instruction-level
    parallelism and represents the lowest stage of the HPC computational hierarchy.


    In addition to instruction-level parallelism arising through pipelining, many
    processors have one or more vector processing units (VPUs). VPUs are a particular
    execution capable of executing a single instruction on multiple elements simultaneously.
    The number of elements depends on the processor and currently varies from two
    to double-precision floating-point numbers (real numbers represented by 64 bits).
    VPUs are often utilized in programming patterns dominated by loops performing
    floating-point operations such as addition, subtraction, and multiplication. For
    example, in such a loop, a single vector addition instruction might perform the
    simultaneous addition of eight floating-point values, reducing the number of loop
    iterations by eight, and consequently, the overall runtime required for the loop.
    The most recent generation of processors has VPUs capable of addition on the multiple
    elements simultaneously, which in some calculations doubles the number of floating-point
    operations per second (FLOPS).


    # 11.1.2 Core-Level Parallelism


    The next level of parallelism in the hierarchy is introduced by the use of multiple
    cores on a given processor. Most modern processors are multicore processors between
    2 and 12 cores, where each core has identical capabilities and can perform independent
    computations. In modern processors, these cores typically have their own private
    L1 (Level 1) and L2 (Level 2) cache and a shared L3 (Level 3) cache and memory.
    There are a variety of protocols that processors use to maintain coherency between
    the private and shared caches and main memory.


    These coherence protocols are implemented in the processor''s hardware and are
    transparent to the programmer. The purpose of a cache coherency protocol is to
    ensure that the data in each core''s private cache are consistent with the shared
    cache and memory. For example, if one core modifies the value of a particular
    variable, all other cores must be notified of this modification and wait to read
    it until the new value is available. The new value may have to be written to shared
    cache or memory or be propagated directly to the core''s private cache that it
    requires. A detailed discussion of cache coherence protocols is beyond the scope
    of this chapter.


    # 11.1.3 Processor-Level Parallelism


    The next level in the hierarchy arises at the socket level. Commodity servers
    often have multiple, for example, two to four sockets within a node, where each
    socket has a single processor with its own memory. A possible layout of such a
    node with two sockets'
