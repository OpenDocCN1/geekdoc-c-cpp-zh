    If you need to make a pull request, simply continue committing the compare branch.
    Once the commits are pushed to github, the pull request will be updated. In order
    to merge a pull request, you need only to push the "Merge request" button at the
    bottom of the summary page.


    If the request cannot automatically be merged, you will need to first merge the
    base branch back into the compare branch, fixing the merge conflicts. Then, commit
    and push those changes back to the compare branch. The pull request will be updated,
    and then you can merge.


    # 3.6 Tips


    +   - Commit frequently. It is cheap to do so and lets you backtrack easily if
    you change your approach.


    +   - Good commit messages—Follow the directions put out by Torvalds (https://github.com/torvalds/subsurface/blob/master/README#L82-109).
    This will make you and your collaborators lives easier.


    +   - Create one branch per feature or bugfix. That makes it easier to apply changes
    and to isolate unstable code.


    +   - Never ever amend commits or rebase branches that have been or could have
    been seen outside your local system. This can cause weird errors for other people
    sharing your code, as their branch history may become out of sync.


    +   - Don''t check large binary files into the repository. Git is not optimized
    for that workload.'
