    # 18.5 Summary


    A few items to remember when considering validation processes for computational
    models and codes include:


    +   - Successful execution of a code does not guarantee that the results of the
    code are correct for a given problem.

    - Proper validation requires a “well sourced” set of data, that is both accurate
    and appropriate, which can be used to check the results obtained from a model.

    - Errors can be introduced by either choosing the wrong model to solve a problem
    or providing incorrect values for parameters that are as inputs to the model.

    - Validation should be completed before production runs start, if at all possible.

    - Creating adequate documentation and using/developing automated tools to perform
    sanity checks for input files can reduce errors and minimize the time and effort
    required for debugging and troubleshooting.


