    \ that CMake will use to generate a header. Listing 8.3 contains #define statements\
    \ and looks nearly a syntactically correct C++ header, except for the word @VERSION\
    \ NUMBER#. The pair of @ symbols in Listing 8.3 wraps the name of a variable that\
    \ can be set in CMakeLists.txt and is used by CMake to insert custom values into\
    \ the header that we generate.\n\nLISTING 8.3 src/ExampleConfig.h in: Header Template\n\
    \n```\n // configured options and settings for Example\n#define VERSION @VERSION_NUMBER@\n\
    ```\n\nNext, we create a CMakeLists.txt file (Listing 8.4), where lines 3–15 are\
    \ added to Listing 8.1. The set directive on line 5 takes two arguments: the name\
    \ of a CMake variable and the value to set it, respectively. The configure _file\
    \ directive takes two arguments: a string the path to an input file and a string\
    \ specifying the path to an output file. The configure _file directive tells CMake\
    \ to copy the input file to the output file but substitute the variables specified\
    \ in the input file. In line 9, we also use the @ symbols of CMake variables with\
    \ the ${PROJECT_SOURCE_DIR} and ${PROJECT_BINARY_DIR}; The values stored in the\
    \ CMake Variables DIR and DIR will be inserted into the strings on lines 9 and\
    \ 10. In this example, we never use PROJECT_SOURCE DIR or BINARY_DIR explicitly;\
    \ they are implicitly defined by the location in which CMakeLists.txt is stored\
    \ and where cmake is invoked, respectively. The include _directories adds the\
    \ paths specified by the argument to the list of directories that CMake looks\
    \ into searching for header files. In this example, we include the PROJECT_ BINARY_DIR\
    \ in the list of “include” directories because that is the directory in which\
    \ we have specified our ExampleConfig.h header file to be created."
