    # 13.3 Compiling Applications with OpenMP\n(GCC, Intel, PGI), Fortran, and C\n\
    \nCompiling applications with OpenMP support is straightforward from the command\
    \ on Unix/Linux and BSD systems. No special hardware is required; however, for\
    \ the highest performance, a high-core-count (and high-bandwidth) machine would\
    \ be recommended. Most/workstation grade systems have more than eight cores today\
    \ and most laptops have four or better. Given a compiler, the suitable compiler\
    \ flag can be found in the following:\n\n| GNU [4] (gcc,g++,gfortran) | -fopenmp\
    \ |\n| Intel (icc,icpc,ifort) | -openmp |\n| Portland Group (pgcc,pgCC,pgf77,pgf90)\
    \ | -mp |\n\nOn Windows, the flags are slightly different:\n\n| GNU (gcc,g++,gfortran)\
    \ | -fopenmp |\n| Intel (icc,icpc,ifort) | /Openmp |\n| MS Visual Studio | /openmp\
    \ |\n\nThe following examples in C and Fortran 90 are complete OpenMP applications\
    \ print the message \"Hello World\" from different threads and provide the thread\
    \ count. HelloWorld.c C example:\n\n```\n#include<stdio.h>\n#include<omp.h>\n\n\
    int main(int argc, char **argv) {\n    #pragma omp parallel\n    {\n        int\
    \ thread_id = omp_get_thread_num();\n        int thread_count = omp_get_num_threads();\n\
    \        printf(\"Hello from thread number: %d out of: %d\\n\",\n            \
    \   thread_id, thread_count);\n    }\n    return 0;\n}\n```"
