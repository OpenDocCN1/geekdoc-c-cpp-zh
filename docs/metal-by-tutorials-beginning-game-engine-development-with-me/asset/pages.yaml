  md: '# SceneKit shaders


    To run a Metal shader on a node, you create an SCNProgram object and attach it
    to the node.


    Once you do this, even you are fully responsible for transforming vertices, lighting
    and other shading, and if you only want to change the fragment color, you have
    to create both a vertex shader and a fragment shader. However, to make it easier,
    SCNProgram will create uniform values, such as the model matrix or camera position,
    that you can access in your shaders.


    > Note: If you''re only performing a simple shader operation, as changing the
    fragment color, look at SCNShader where you can provide short strings of shader
    code instead of taking control of transformations and lighting. The downside is
    that these compile at run-time, so app will load slower, and you won''t have the
    benefit of seeing compiler errors if you make a syntax error.


    In viewDidLoad(), just after configuring ship.eulerAngles, add this:


    ```

    let program = SCNProgram()

    program.vertexFunctionName = "shipVertex"

    program.fragmentFunctionName = "shipFragment"

    ```


    This creates a program and tells it what the shader names will be.


    Shaders go with materials so that you can render each of your model''s materials
    differently. The jet only has one material, so this to set the program on the
    jet''s material:


    ```

    let material = ship.childNodes[0].geometry?.firstMaterial {

    material.program = program

    }

    ```


    For your first SceneKit shader, you''ll create the most basic shader possible
    and render the jet in red. Create a new Metal file named Shaders.metal.


    So you can access the SceneKit buffers and uniforms, and add this:


    ```

    #include <SceneKit/scn_metal>

    ```


    Vertex attributes are available to the vertex shader using a struct. Add this
    to:


    ```

    struct VertexIn {

    float4 position [[attribute(SCNVertexSemanticPosition)]];

    };

    ```


    ![](img/8d763acb335ab213ea9213a628f7d844_612_0.png)'
