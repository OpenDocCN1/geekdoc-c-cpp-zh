  md: 'Build and run the project, and you''ll see a lot more lights now:


    ![](img/8d763acb335ab213ea9213a628f7d844_410_0.png)


    What a fantastic journey through multipass rendering!


    You''ve seen, tried and learned so much. Let''s recap:


    +   - You started with a simple shadow pass where you learned that rendering is
    not always from a camera''s position but also possible from the light''s position.


    +   - Then, you learned about multipass rendering and how you can use a shadow
    map that was saved in a first pass during a second pass.


    +   - Next, you learned what a G-buffer is and how deferred rendering works.


    +   - You also learned how to improve your app''s performance by processing lights
    based on the visibility of the fragments affected.


    +   - Finally, you learned there''s another type of command encoder other than
    the rendering one — the blit command encoder.


    # Where to go from here?


    If you''re trying to improve your app performance, you can try a few approaches.
    One approach is to render the lights as light volumes and use stencil stencils
    to select only lights that are affecting the fragments and only render those lights
    instead of all.


    In the next chapter, you''re in for some more advanced GPU topics!'
