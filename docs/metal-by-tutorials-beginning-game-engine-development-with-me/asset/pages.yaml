  md: '# Metal by Tutorials | Chapter 20: Advanced Lighting


    This technique is also a significant performance boost as half of the geometry
    will not need to get processed by the shaders anymore.


    For the reflection texture, you only need to render half the scene, flip it, and
    add it to the final render.


    ![](img/8d763acb335ab213ea9213a628f7d844_565_0.png)


    Placing the clipping plane in the center of the view ensures that only half the
    scene geometry is rendered.


    In **Common.h**, add a new member to Uniforms:


    ```

    vector_float4 clipPlane;

    ```


    In **Skybox.metal**, add a new member to the VertexOut struct:


    ```

    float clip_distance [[ clip_distance ]] [1];

    ```


    Notice the MSL attribute, `[[ clip_distance ]]`, which is one of the built-in
    attributes used exclusively by vertex shaders. The clip_distance built-in attribute
    is an array of distances, and the [1] argument represents its size — a 1 in this
    case because you declared this variable as one float only.


    > Note: You can read more about this in the Metal Shading Language specification,
    in Section 4.9.1 "Vertex-Fragment Signature Matching."


    You may have noticed that, and in **Shaders.metal**, FragmentIn is a duplicate
    of VertexOut. `[[ clip_distance ]]` is a vertex-only attribute, so you duplicate
    the struct so the fragment shader can use it.


    Keep the same as VertexOut, and add a new member to the FragmentIn struct:


    ```

    float clip_distance;

    ```


