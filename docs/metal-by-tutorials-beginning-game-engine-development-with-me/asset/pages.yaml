    #import \"../Utility/Common.h\"\n\nstruct VertexOut {\n    float4 position [[\
    \ position ]];\n    float3 worldPosition;\n    float3 worldNormal;\n    float4\
    \ shadowPosition;\n};\n\nstruct GBuffer {\n    float4 albedo [[ color(0) ]];\n\
    \    float4 normal [[ color(1) ]];\n    float4 position [[ color(2) ]];\n}\n```\n\
    \nVertexOut is the same as in Main.metal.\n\nGBufferOut is returned from the fragment\
    \ function. Instead of returning a float4 containing the color of the fragment,\
    \ you'll return a color for each of the render pass descriptor attachments. That's\
    \ what the [[ color(i) ]] attribute indicates.\n\nAdd the fragment function:\n\
    \n```\nfragment GBufferOut GbufferFragment(VertexOut in [[stage_in]],\n    depth2d<float>\
    \ shadow_texture [[texture(0)]],\\n    constant Material &material [[buffer(1)]])\
    \ {\n    GBufferOut out;\n    // 1\n    out.albedo = float4(material.baseColor,\
    \ 1.0);\n    out.albedo.a = 0;\n    out.normal = float4(normalize(in.worldNormal),\
    \ 1.0);\n    out.position = float4(in.worldPosition, 1.0);\n    // 2\n    // copy\
    \ from fragment_name\n    float2 xy = in.shadowPosition.xy;\n    xy = xy * 0.5\
    \ + 0.5;\n    xy.y = 1 - xy.y;\n    constexpr sampler s(coord::normalized, filter::linear,\n\
    \        address::clamp_to_edge, compare_func::less);\n    float shadow_sample\
    \ = texture.sample(s, xy);\n    float current_sample = in.shadowPosition.z / in.shadowPosition.w;\n\
    \    // 3\n    if (current_sample > shadow_sample) {\n        out.albedo.a = 1;\n\
    \    }\n```\n\n![](img/8d763acb335ab213ea9213a628f7d844_401_0.png)\n\n402"
