  md: '# 3. Convert tangent and bitangent values to world space


    Just as you converted the model''s normals to world space, you need to convert
    the tangents and bitangents to world space in the vertex function.


    In Common.h, add this to enum Attributes:


    ```

    Tangent = 3,

    Bitangent = 4

    ```


    In Shaders.metal, add these new attributes to struct VertexIn:


    ```

    float3 tangent [[ attribute(Tangent) ]];

    float3 bitangent [[ attribute(Bitangent) ]];

    ```


    Add new properties to struct Vertex so that you can send the values to the fragment
    function:


    ```

    float3 worldTangent;

    float3 worldBitangent;

    ```


    In vertex_main, after calculating out.worldNormal, move the tangent and bitangent
    values into world space:


    ```

    out.worldTangent = uniforms.normalMatrix * vertexIn.tangent;

    out.worldBitangent = uniforms.normalMatrix * vertexIn.bitangent;

    ```


    # 4. Calculate the new normal


    Now that you have everything in place, it''ll be a simple matter to calculate
    the new normal.


    Before the normal calculation, consider the normal color value that you''re reading.
    Colors are between 0 and 1, and normal values range from -1 to 1.


    In fragment_main, after reading the normal from the texture, but before normalizing
    it, add:


    ```

    normalValue = normalValue * 2 - 1;

    ```


    This redistributes the normal value to be within the range -1 to 1.


    Further down in the function, replace:


    ```

    float3 normalDirection = normalize(in.worldNormal);

    ```'
