    # # Refraction


    Refraction is another common interaction between light and objects that you often
    see in nature. While it''s true that most objects in nature are opaque — thus
    absorbing most of the light they get — the few objects that are translucent, or
    transparent, allow for the light to propagate through them.


    The law of refraction is a little more complicated than mere equality between
    the incoming and outgoing light vector angles.


    ![](img/8d763acb335ab213ea9213a628f7d844_553_0.png)


    Refraction is dictated by Snell''s law which states that the ratio of angles equals
    the reversed ratio of indices of refraction:


    $\frac{\sin \theta_2}{\sin \theta_1} = \frac{\nIOR of media 1}}{\nIOR of media
    2}}$


    The index of refraction (IOR) is a constant that defines how fast light propagates
    through various media. IOR is defined as the speed of light in a vacuum divided
    by the phase velocity of light in that particular medium.'
