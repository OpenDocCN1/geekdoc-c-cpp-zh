    combined with the initial renderer.


    Add this to the end of mtView(_drawableSizeWillChange:). Remember, you call this
    method at the end of init(metalView), and every time the view resizes:


    ```

    outputTexture = createTexture(pixelFormat: .colorPixelFormat, size: .size)

    finalTexture = createTexture(pixelFormat: .colorPixelFormat, size: .size)

    ```


    You create the MTLTextures using a helper method. This will be able to read, and
    render to these textures.


    # Image Threshold To Zero


    Using the following, MPSImageThresholdToZero is a filter that returns either the
    original value for each pixel having a value greater than a specified brightness
    threshold or 0:


    ```

    destinationColor = sourceColor > thresholdValue ? sourceColor : 0

    ```


    This has the effect of making darker areas black, while the lighter areas retain
    their original color value.


    In draw(_), look for // MPS brightness filter, and then line, an MPS kernel to
    render a texture with a brightness threshold set to 0.2:


    ```

    let brightness = MPSImageThresholdToZero(device: Renderer.device, thresholdValue:
    0.2, linearGrayColorTransform: nil)

    brightness.label = "MPS brightness"

    brightness.encode(commandBuffer: commandBuffer, sourceTexture: drawable.texture,
    destinationTexture: outputTexture)

    ```'
