  md: '# # Where to go from here?


    In this chapter, you learned about various rendering techniques such as ray casting,
    ray tracing, path tracing, and raymarching. You learned about signed distance
    fields and how to find objects in the scene with them. You learned about noise
    and how useful it is to define random volumetric content that cannot be easily
    defined using traditional geometry (meshes). Finally, you learned how to use rayarching
    and random noise to create dynamic clouds.


    With this knowledge, you can render anything you want — classic shapes, such as
    spheres and cubes, to complex natural phenomena and scenes. The sky is the limit.
    No, literally! Once your ray hits the sky, you need to stop following it and cast
    another one.


    In **references.markdown**, there''s a list of articles about rendering with rays
    and creating amazing content.'
