    }\n\nstruct Light {\n    float3 position;\n}\n```\n\nNothing new or worth noting,\
    \ except that for a plane, all you need to know is its Y-coordinate because it's\
    \ a horizontal plane.\n\nNext, create few distance operation functions to help\
    \ you determine distances between elements of the scene:\n\n```\nfloat distToSphere(Ray\
    \ ray, Sphere s) {\n    return length(ray.origin - s.center) - s.radius;\n}\n\n\
    float distToPlane(Ray ray, Plane plane) {\n    return ray.origin.y - plane.yCoord;\n\
    }\n\nfloat differenceOp(float d0, float d1) {\n    return max(d0, -d1);\n}\n\n\
    float unionOp(float d0, float d1) {\n    return min(d0, d1);\n}\n```"
