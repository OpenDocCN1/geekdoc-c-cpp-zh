    # Velocity


    Velocity is a vector made up of two other vectors: direction and speed. The speed
    is the magnitude or length of the vector, and the direction is given by the linear
    equation of the line on which the vector lies.


    ![](img/8d763acb335ab213ea9213a628f7d844_475_0.png)


    In Emitter.swift, add a new member at the end of the Particle struct:


    ```

    var velocity: float2

    ```


    Inside the particle loop, add this before the last line where you advance the
    pointer:


    ```

    let velocity = float2(random(10), random(10))

    pointer.pointee.velocity = velocity

    ```


    This gives the boid (boid) a random direction and speed that ranges between 0
    and 10.


    In Shaders.metal, add velocity as a new member of the Boid struct:


    ```

    float2 velocity;

    ```


    In secondPass, add this code after the line where you define position:


    ```

    float2 velocity = boid.velocity;

    position += velocity;

    boid.position = position;

    boid.velocity = velocity;

    boids[id] = boid;

    ```


    This gets the current velocity, updates the current position with the velocity,
    and updates the boid data before storing the new values.'
