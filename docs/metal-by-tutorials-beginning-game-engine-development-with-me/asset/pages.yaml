  md: '# Metal by Tutorials


    # Chapter 3: The Rendering Pipeline


    When the GPU fetches the vertex buffer, the MTLRenderEncoder draw call tells the
    GPU whether the buffer is indexed. If the buffer is not indexed, the GPU assumes
    the buffer is an array and reads in one element at a time in order.


    In the previous chapter, you saw how Model I/O imports .obj files and sets up
    their buffers by submesh. This indexing is important because vertices are cached
    for reuse. For example, a cube has twelve triangles and eight vertices (at the
    corners). If you don''t index, you''ll have to specify the vertices for each triangle
    and thirty-six vertices to the GPU. This might not sound like a lot, but in a
    model that has several thousand vertices, vertex caching is important!


    There is also a second cache for shaded vertices so that vertices are accessed
    multiple times are only shaded once. A shaded vertex is one to which color was
    already applied. But that happens in the next stage.


    A special hardware unit called the Scheduler sends the vertices and their attributes
    to the Vertex Processing stage.


    # Vertex Processing


    In this stage, vertices are processed individually. You write code to calculate
    per-vertex lighting and color. More importantly, you send vertex coordinates through
    various coordinate spaces to reach their position in the final framebuffer.


    You learned briefly about shader functions and about the Metal Shading Language
    (MSL) in Chapter 1, "Hello!" Now it''s time to see what happens under the hood
    at the hardware level. Take a look at this modern architecture of an AMD GPU:


    | Graphics Command Processor |

    | Shader Engine | Shader Engine | Shader Engine | Shader Engine |

    | --- | --- | --- | --- |

    | CU | CU | CU | CU |

    | CU | CU | CU | CU |

    | CU | CU | CU | CU |

    | CU | CU | CU | CU |

    | CU | CU | CU | CU |

    | CU | CU | CU | CU |'
  merge: -1
