  md: '# Core Image Metal kernels


    This is an excellent excuse to try out a Core Image kernel written in Metal.


    You''ll take the two images into the kernel and return the correct pixel from
    each, at the same time converting the sRGB value to linear.


    There are few pre-defined kernels you can use with Core Image:


    +   - CIKernel: a custom filter.

    - CIColorKernel: process color information.

    - CIWarpKernel: process geometry (pixel position) information.

    - CIBlendKernel: blend two images.


    Each of these expects a different data type in the function arguments. It''s the
    last of these you''ll use: CIBlendKernel. This takes two inputs of type sample_t
    for each of the images.


    # Create a Metal library for Core Image


    Create a new file using the Metal template named CIBlend.metal. Include the Core
    Image headers:


    ```

    #include <CoreImage/CoreImage.h>

    ```


    To access the Core Image types, wrap your functions inside the coreimage namespace:


    ```

    extern "C" { namespace coreimage {

    }}

    ```


    # Pre-multiplied alpha blending


    In this example, the HUD texture has anti-aliasing, where the texture is partially
    transparent around the edge of the letters:


    ![](img/8d763acb335ab213ea9213a628f7d844_632_0.png)


    ![](img/8d763acb335ab213ea9213a628f7d844_632_1.png)'
  merge: -1
  pgno: 632
- img_proc: true
  md: '# Metal by Tutorials


    # Chapter 22: Integrating SpriteKit & SceneKit


    Checking the HUD texture on the GPU debugger, you can see that the anti-aliased
    texture has been pre-multiplied with the alpha value:


    ![](img/8d763acb335ab213ea9213a628f7d844_633_0.png)


    In this image, where the solid yellow value in BGRA format is (2, 254, 251, 255),
    when the anti-aliasing alpha becomes 174, then the multiplied BGR is (1, 173,
    171).


    When you blend with a pre-multiplied color, the blend formula is:


    ```

    destination.rgb = source.rgb + (destination.rgb * (1 - source.a))

    ```


    Inside the core namespace, adding the new blending function:


    ```

    float4 hudBlend(sample_t hudTexture, sample_t drawableTexture) {

    float4 color = (1 - hudTexture.a) * drawableTexture + hudTexture;

    color = float4(srgb_to_linear(color.rgb), 1);

    return color;

    }

    ```


    This function takes in two images and performs pre-multiplied alpha blending.
    It also converts this pixel from sRGB to linear and return it.


    > Note: Core Image has its own Kernel Language reference at https://developer.apple.com/metal/CoreImageKernelReference11.pdf.
    srgb_to_linear() is an example of the color functions included in the Core Image
    Kernel Language.


    # Compiling and linking a Core Image kernel


    You can build the kernel to check that it has no syntactic errors, however, because
    it''s wrapped up in the Core Image namespace, it won''t be available at runtime
    from your default Metal library.'
