  md: '# Metal by Tutorials


    # Chapter 15: Performance Optimization


    Build and run the project for iOS target this, then capture a new GPU frame. In
    the Debug navigator, select “View Frame Performance” using the “Frame in different
    ways”. You can now see how much each pipeline took during the frame.


    ![](img/8d763acb335ab213ea9213a628f7d844_426_0.png)


    > Your notes: times and percentages will vary depending on your iOS device, Xcode
    and iOS version.


    The entire pipeline takes 12.16ms to complete. It consists of 3.99ms for the vertex
    shader and 8.17ms for the fragment shader.


    Drilling down the cost tree, the most of the fragment shader execution time is
    taken by the sample() function (4.15ms) and the normalize() function (3.05ms).


    As you select the pipeline, the central pane also updates to show the shaders,
    and more importantly, a convenient column with times and percentages for the lines
    that affected the cost most.


    The line where the shader starts will show the total time that shader took to
    complete. Inside the shader for each impactful line, you''ll see the percentage
    link out of that time. In the case of the sample() line, those 4.15ms corresponds
    to 33.43% of the 8.17ms total shader.


    On iOS devices from the family 4 (iPhone X) or later, the shader profiler will
    even show you a pie chart with activities displayed as slices representing the
    total time an activity took to complete.


    Hover over the cost to disclose the pie chart.


    ![](img/8d763acb335ab213ea9213a628f7d844_426_1.png)


