  md: "# # The Bl Command Encoder\n\nBlit means to copy from one part of memory to\
    \ another. You use a bl command encoder on resources such as textures and buffers.\
    \ It's generally used for image processing, but you can (and will) use it to copy\
    \ image data that is rendered offscreen.\n\nAdd this code to draw(in:) // blit:\n\
    \n```\nguard blitEncoder = commandBuffer.makeBlitCommandEncoder() else {\n   \
    \ return\n}\nEncoder.pushDebugGroup(\"Blit\")\nblitEncoder.label = \"Blit encoder\"\
    \nlet origin = MTLOriginMake(0, 0, 0)\nlet size = MTLSizeMake(Int(view.drawableSize.height),\
    \ 1)\nblitEncoder.copy(from: albedoTexture, sourceSlice: 0, sourceLevel: 0,\n\
    \                  sourceOrigin: origin, sourceSize: size,\n                 \
    \ to: drawable, destinationSlice: 0, destinationOrigin: origin)\nblitEncoder.endEncoding()\n\
    blitEncoder.popDebugGroup()\n```\n\nHere, you create a blit command encoder and\
    \ copy from the albedo texture to the view's current drawable.\n\nIn init(metalView:),\
    \ add this line to allow the view to render blitted textures:\n\n```\nmetalView.framebufferOnly\
    \ = false\n```\n\nBuild and run the project, and you should see the albedo texture\
    \ rendered to the window this time:\n\n![](img/8d763acb335ab213ea9213a628f7d844_403_0.png)"
