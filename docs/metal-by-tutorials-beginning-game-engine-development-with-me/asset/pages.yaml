  md: 'Metal by Tutorials


    Chapter 14: Multipass & Deferred Rendering


    You''ll do two render passes:


    ![](img/8d763acb335ab213ea9213a628f7d844_388_0.png)


    +   - **First pass**: Using a separate view matrix holding the sun''s position,
    you''ll render from the point of view of the light. Because you''re not interested
    in color at this stage, only the depth of objects that the sun can see, you''ll
    only render a depth texture in this pass. This is a grayscale texture, with the
    gray value indicating depth. Black is close to the light and white is far away.


    +   - **Second pass**: You''ll render using the camera as usual, but you''ll compare
    the camera fragment with each depth map fragment. If the fragment''s depth is
    lighter in color than the depth map at that position, it means the fragment is
    in the shadow. The light can “see” the blue x in the above image, so it is not
    in shadow.


