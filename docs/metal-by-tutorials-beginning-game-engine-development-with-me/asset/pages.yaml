  md: 'Just as in the song Dem Bones: “the toe bone’s connected to the foot bone,”
    this is how a typical rigged figure’s joint hierarchy might look:


    ![](img/8d763acb335ab213ea9213a628f7d844_220_0.png)


    In character animation, it’s (usually) all about rotation — your bones don’t translate
    unless you have some kind of disjointing skeleton. With this hierarchy of joints,
    you rotate one joint, all the child joints follow.


    Try bending your elbow without moving your wrist. Because your wrist is lower
    in the hierarchy, even though you haven''t actively changed the wrist''s position
    and rotation, it still follows the movement of your elbow.


    This movement is called forward kinematics and is what you’ll be using in this
    chapter. It’s a fancy name for making all joints follow.


    > Note: Inverse kinematics allows the animator to make actions, such as cycles,
    more easily. Place your hand on a table or in a fixed position. Now, rotate your
    elbow and shoulder joint with your hand fixed. The hierarchical chain no longer
    moves your hand as in forward kinematics. As opposed to forward kinematics, the
    mathematics of inverse kinematics is quite complicated.


    Your Blender skeleton has a limited rig for simplicity. It only has four bones:
    the body, left arm, left forearm and left hand. Each of these joints controls
    a group of vertices.'
