  md: 'Using its visual layout, it''s easy to identify redundant command encoders
    or passes that you could have missed in the code or in the draw calls list.


    For each command encoder in the graph, you''ll see the execution time, the number
    of draw calls, the bound resources and based on the type of the encoder, either
    the number of vertices processed or the number of thread dispatches. A line going
    to another command encoder indicates dependency for it.


    # Metal System Trace


    The last and most essential profiling tool is the Metal System Trace (MST) which
    is a specialized Instruments template for Metal.


    There are two ways of launching an MST session:


    +   - Build and run your app in Xcode. Launch the Instruments and from the profiling
    templates window, choose Metal System Trace. In the Instruments window, from the
    devices list, choose your Mac and then your running app you want to profile.

    - While Xcode, instead of building and running your app, choose Product menu >
    Profile. This will open Instruments. Choose the Metal System Trace template and
    then Instruments will auto-select your running app.


    > Note: There''s also a Game Performance template that''s an even more advanced
    Metal-based template. You should use one for a complex game with multiple command
    encoders and many resources.


    Either way, the next step applies to both approaches. Click the big white dot
    on the top left side of Instruments.


    ![](img/8d763acb335ab213ea9213a628f7d844_432_0.png)


    This starts recording your app running in windowed mode. After about 10 seconds
    or so, stop the recording and review the results.'
