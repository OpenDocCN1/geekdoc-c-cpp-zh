    # Interpolation


    It''s a lot of work inputting a value for each frame. If you''re just moving an
    object from point A to B in a straight line, you interpolate the value. Interpolation
    is where you can calculate a value given a range of values and a current location
    within the range. When animating, the current location is the current time as
    a percentage of the animation duration.


    To work out the time percentage, use this formula:


    ```

    $time = \frac{(currentTime - min)}{(max - min)}$

    ```


    This results in a time value between 0 and 1.


    For example, if you have a start value of 5, an end value of 10 and a duration
    of 2 seconds, after 1 second has passed, the interpolated value is 7.5.


    ```

    $time = \frac{(1.0 - 0)}{(2.0 - 0)}$

    value = (10 - 5) \times time + 5$

    ```


    That''s a linear interpolation. However, there are other ways of interpolating
    using different formulas.


    ![](img/8d763acb335ab213ea9213a628f7d844_210_0.png)


    ![](img/8d763acb335ab213ea9213a628f7d844_210_1.png)


    Linear


    Ease in / ease out


    In the above image, linear interpolation is on the left. The x-axis is time, and
    the y-axis is value. You sample the value at the appropriate time. The previous
    ball example was mechanical and can be improved using the ease in and out interpolation
    on the right.


    raywenderlich.com


