- img_proc: true
  md: 'For each joint in the skin''s joint node array, you create the joint matrix
    palette transform by combining the inverse bind pose and the node''s current global
    transform.


    ![](img/8d763acb335ab213ea9213a628f7d844_235_0.png)


    You then create a MTLBuffer containing the joint matrix palette ready for the
    vertex function.


    The glTF importer created a vertex descriptor that described all of the vertex
    attributes, but you''ll need to match these in the vertex function.


    In the **Metal Shaders** group, in **Common.h**, add this to the Attributes struct:


    ```

    Color = 5,

    Joints = 6,

    Weights = 7

    ```


    The vertex function that your Character uses in **CharacterShaders.metal**. Joint
    animation is all about the vertices, so Character uses the same fragment function
    as Prop.


    Open **CharacterShaders.metal**, and add this to VertexIn:


    ```

    float4 color [[attribute(Color)]];\ushort4 joints [[attribute(Joints)]];

    float4 weights [[attribute(Weights)]];

    ```


    Earlier, you created a new MTLBuffer containing the joint matrices at buffer index
    21, so add this as a parameter to character_vertex_main:


    ```

    constant float4x *jointMatrices [[ buffer(21) ]]

    ```


    Inside character_vertex_main, at the comment // skinning code here, add this:


    ```

    float4 weights = vertexIn.weights;\ushort4 joints = vertexIn.joints;

    float4x x * skinMatrix =

    weights.x * jointMatrices[joints.x] +

    weights.y * jointMatrices[joints.y] +

    weights.z * jointMatrices[joints.z] +

    weights.w * jointMatrices[joints.w];

    ```'
