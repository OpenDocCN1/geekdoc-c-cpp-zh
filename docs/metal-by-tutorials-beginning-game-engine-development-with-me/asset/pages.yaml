    #  7. Add smoothness using a depth texture


    The light propagation varies for different transparent media, but for water, the
    colors with longer wavelengths (closer to infrared) quickly fade away as the light
    ray goes deeper. The bluish colors (closer to ultraviolet) tend to be visible
    at greater depths because they have shorter wavelengths.


    At very shallow depths, however, most light should still be visible. You''ll make
    the water look smoother as depth gets smaller. You can improve the water surface
    blends with the terrain by using a depth map.


    In RendererDraws.swift, add this code to renderWater(renderEncoder:) before the
    for


    loop:


    ```

    renderEncoder.setFragmentTexture(refractionRenderPass.depthTexture, index: 4)

    ```


    As well as sending the refraction texture from the refraction pass, you''re now
    sending the depth texture too.


    In Renderer, add this code to buildPipelineStateState() before you create waterPipelineState:


    ```

    guard let attachment = descriptor.colorAttachments[0] else { return

    attachment.isBlendingEnabled = true

    attachment.rgbBlendBlendOperation = .add

    attachment.sourceRGBBlendFactor = .sourceAlpha

    attachment.destinationRGBBlendFactor = .oneMinusSourceAlpha

    ```


    Here, you configure the blending options on the color attachment as you just did
    back in Chapter 10, "Fragment post-processing."'
