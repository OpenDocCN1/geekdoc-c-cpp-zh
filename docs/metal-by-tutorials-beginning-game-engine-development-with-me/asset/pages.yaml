  md: '# Metal by Tutorials


    Before examining the bones further, right-click on the skeleton''s head and press
    the

    Tab key to go into Edit Mode:


    ![](img/8d763acb335ab213ea9213a628f7d844_219_0.png)


    Here, you can see all of the skeleton''s vertices. This is the original model
    which you can

    export as a static .obj file. It''s in what''s called the bind pose with the arms
    stretched

    out. This is a standard pose for figures as it makes it easy to add animation
    bones to the

    figure.


    Press the Tab key to go back to Object Mode. To animate the figure, you need to
    have

    control of groups of vertices. For example, to rotate the head, you''d need to
    rotate all of

    t head''s vertices. Rigging a figure means creating an Armature with a hierarchy
    of

    Joints. Joints and bones are generally used synonymously, but a bone is just a
    visual cue

    to see which joint affects which vertices.


    The general process of creating a figure for animation goes like this:


    +   1. Create the model.


    +   2. Create an armature with a hierarchy of joints.


    +   3. Apply the armature to the model with automatic weights.


    +   4. Use weight painting to change which vertices go with each joint.'
