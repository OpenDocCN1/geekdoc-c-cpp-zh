  md: '# Where to go from here?


    You''ve dipped a toe into the water of the great sea of realistic rendering, and
    you''ll read about more advanced concepts of lighting and reflectivity in Chapter
    20, “Advanced Lighting.” If you want to explore more about realistic rendering,
    references.markdown for this chapter contains links to interesting articles and
    videos.


    This chapter did not touch on spherical harmonics, which is an alternative method
    to using an irradiance texture map for diffuse reflection. Mathematically, you
    can approximate that irradiance map with 27 floats. Hopefully, the links in references.markdown
    will get you interested in this amazing technique.


    Before you try to achieve the ultimate realistic render, one question you should
    ask yourself is whether your game will benefit from realism. One way to stand
    out from the crowd is to create your own rendering style. Games such as Fortnite
    aren''t entirely realistic and have a style of all their own. Experiment with
    shaders to see what you can create.'
