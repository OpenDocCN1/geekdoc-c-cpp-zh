    On the left is the result you see after moving the camera up its Y-axis; on the
    right is the reflection texture from the reflection render pass. If you want,
    you can see this texture in the GPU debugger.


    As the main camera moves up the Y-axis, the reflection camera moves down the Y-axis
    to below the terrain surface which blocks the view to the sky. You could temporarily
    solve this by culling the terrain''s back faces when you render, but this will
    introduce other rendering artifacts. A better way of dealing with this issue is
    to clip the geometry you don''t want to render.


    # 3. Clipping planes


    A clipping plane, as its name suggests, clips the scene using a plane. It''s hardware
    accelerated, meaning that if geometry is not within the clip range, the GPU immediately
    discards it and doesn''t put it through the rasterizer.'
