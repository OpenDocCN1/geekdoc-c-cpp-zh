  md: 'Only the union function is new here, which lets you join two areas together.


    ![](img/8d763acb335ab213ea9213a628f7d844_525_0.png)


    Then, create the distanceToScene() function, which gives you the closest distance
    to any object in the scene. You can use this function to generate a shape that
    looks like a hollow sphere with holes in it.


    ```

    float distToScene(Ray r) {

    // 1

    Plane p = Plane{0.};

    float dzp = distToPlane(r, p);

    // 2

    Sphere s1 = Sphere(float3(2.0), 2.0);

    Sphere s2 = Sphere(float3(0.0, 4.0, 0.0), 4.0);

    Sphere s3 = Sphere(float3(0.0, 4.0, 0.0), 3.9);

    // 3

    Ray repeatRay = r;

    repeatRay.origin = fract(r.origin / 4.0) * 4.0;

