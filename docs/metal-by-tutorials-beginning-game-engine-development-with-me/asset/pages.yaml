  md: '# Metal by Tutorials


    You can''t use the [[ point_size ]] attribute here here because you''re not rendering
    in the traditional sense. Instead, you''re writing pixels in a kernel function
    directly to the drawable''s texture.


    The trick is to "paint" the surrounding neighbors of each boid, which makes the
    current boid seem larger than it really is.


    ![](img/8d763acb335ab213ea9213a628f7d844_474_0.png)


    In Shaders.metal, add this code at the end of the secondPass kernel function:


    ```

    output.write(color, location + uint2( 1, 0));

    output.write(color, location + uint2( 0, 0));

    output.write(color, location - uint2( 1, 0));

    output.write(color, location - uint2( 0, 0));

    output.write(color, location + uint2(-1, 1));

    output.write(color, location - uint2(-1, 1));

    output.write(color, location + uint2( 1, -1));

    output.write(color, location - uint2( 1, -1));

    ```


    This code modifies the eight neighbors of the boid and creates a visual effect
    which causes the boid to appear larger.


    Build and run, and you''ll see that the boids are more distinguishable now.


