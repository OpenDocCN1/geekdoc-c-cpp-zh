  md: "# Metal by Tutorials\n\n# Chapter 1: Hello, Metal!\n\nThe device and the command\
    \ queue should be set up at the start of your app, and you should use the same\
    \ device and command queue throughout.\n\nOn each frame, you'll create a command\
    \ buffer and at least one render command encoder. These are lightweight objects\
    \ that point to other objects, as shader functions and pipeline states, that you\
    \ set up only once at the start of the app.\n\n![](img/8d763acb335ab213ea9213a628f7d844_32_0.png)\n\
    \n# Shader Functions\n\nShader functions are small programs that run on the GPU;\
    \ you write them in the Metal Shading Language which is a subset of C++.\n\nNormally,\
    \ you create a separate file with a .metal extension specifically for shader functions\
    \ but for now, create a multi-line string containing the shader function code\
    \ and add it to your playground:\n\n```\nlet shader = \"\"\"\n#include <metal_stdlib>\n\
    using namespace metal;\nstruct VertexIn {\n    float4 position [[ attribute(0)\
    \ ]];\n};\nvertex float4 vertex_main(const VertexIn vertex_in [[ stage_in ]])\
    \ {\n    return vertex_in.position;\n}\nfragment float4 fragment_main() {\n  \
    \  return float4(1, 0, 0, 1);\n}\n\"\"\"\n```\n\nThere are two shader functions\
    \ in here: a vertex function named vertex_main and a fragment function named fragment_main.\
    \ The vertex function is where you usually manipulate vertex positions and the\
    \ fragment function is where you specify the pixel color.\n\n![](img/8d763acb335ab213ea9213a628f7d844_32_1.png)"
