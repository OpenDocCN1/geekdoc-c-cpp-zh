  md: 'In this image, the blue arrows are vectors.


    ![](img/8d763acb335ab213ea9213a628f7d844_88_0.png)


    The left blue arrow is a vector with a value [-1, 2]. Coincidentally, the right
    blue arrow, partially behind the cat, is also a vector with a value [-1, 2].


    Positions (points) are locations in space, whereas vectors are displacements in
    space; in other words, a vector contains the amount and direction to move.


    If you were to displace the cat by the blue vector, it would end up at point (2,
    4). That''s the cat''s position (3, 2) plus the vector [-1, 2].


    This 2D vector is a 1x2 matrix. It has one column and two rows.


    > Note: Metal matrices are constructed in column-major order.


    A matrix is a two-dimensional array. Even the single number 1 is a 1×1 matrix.
    In fact, the number 1 is unique in when you multiply a number by 1, the answer
    is always that. Square matrices — where the array width is the same as the array
    height — have a matrix with this same property. It''s called the identity matrix.
    Any vector or matrix multiplied by an identity matrix returns the same value.'
