  md: '# The rendering pipeline


    You finally get to investigate the GPU pipeline! In the following diagram, you
    can see the stages of the pipeline.


    ![](img/8d763acb335ab213ea9213a628f7d844_68_0.png)


    The graphics pipeline takes the vertices through multiple stages during which
    the vertices have their coordinates transformed between various spaces. You''ll
    read more about coordinate spaces in Chapter 4, "Coordinate Spaces."


    As a Metal programmer, you''re only concerned about the Vertex and Fragment Processing
    stages since they''re the only programmable stages. Later in the chapter, you''ll
    write both a vertex shader and a fragment shader. For all the non-programmable
    pipeline stages, such as Vertex Fetch, Primitive Assembly and Rasterization, the
    GPU has specially designed hardware units to serve those stages.


    Next, you''ll go through each of the stages.


    # 1 - Vertex Fetch


    The name of this stage varies among graphics Application Programming Interfaces
    (APIs). For example, DirectX calls it Input Assembly.


    To start rendering 3D content, you first need a scene. A scene consists of models
    that have meshes of vertices. One of the simplest models is the cube which has
    6 faces (12 triangles).


    As you saw in the previous chapter, you need a vertex descriptor to define the
    way vertices will be read in along with their attributes as position, texture
    coordinates, normal and color. You have the option not to use a vertex descriptor
    and just send an array of vertices in an MTLBuffer, however, if you decide not
    to use one, you''ll need to know how the vertex buffer is organized ahead of time.'
  merge: -1
