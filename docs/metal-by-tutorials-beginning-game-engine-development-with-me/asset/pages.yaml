  md: '# Introduction


    Welcome to Metal by Tutorials!


    Metal is a unified application programming interface (API) for the graphics processing
    unit, or GPU. It''s unified because it applies to all 3D graphics and data-parallel
    computation paradigms. Metal is a low-level API because it provides programmers
    near-direct access to the GPU. Finally, Metal is a low-overhead API because it
    reduces the central processing unit (CPU) cost by multi-threading and pre-compiling
    of resources.


    But beyond the technical definition, Metal is the most appropriate way to use
    the GPU''s parallel processing power to visualize data or solve numerical challenges.
    It''s also tailored to be used for machine learning, image/video processing or,
    as this this book describes, graphics rendering.


    # About this book


    This book introduces you to low-level graphics programming in Metal — Apple’s
    framework for programming on the graphics processing unit (GPU). As you progress
    through this book, you''ll learn many of the fundamentals that go into making
    a game engine and gradually put together your own engine. Once your game engine
    is complete, you''ll be able to put together 3D scenes and program your own simple
    3D games. Because you''ll have built your 3D game engine from scratch, you''ll
    be able to customize every aspect of what you see on your screen.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# How did Metal come to life?


    Historically, you had two choices to take advantage of the power of the GPU: OpenGL
    and the Windows-DirectX. In 2013, the GPU vendor AMD announced the Mantle project
    in an effort to revamp GPU APIs and come up with an alternative to Direct3D (which
    is part of DirectX) and OpenGL. AMD were the first to create a true-overhead API
    for low-level access to the GPU. Mantle promised to be able to generate up to
    9 times more calls (the number of objects drawn to the screen) than similar APIs
    and also introduced asynchronous command queues that graphics and compute workloads
    could run in parallel. Unfortunately, the project was terminated before it could
    become a mainstream API.


    Metal was announced at the Worldwide Developers Conference (WWDC) on June 2, 2014
    and was initially made available on A7 or newer GPUs. Apple created a new language
    to program the GPU directly via shader functions. This is the Metal Shading Language
    (MSL) based on the C++11 specification. A year later at WWDC 2017, Apple announced
    two Metal sub-frameworks: MetalKit and Metal Performance Shaders


    The API has to evolve, and WWDC 2017 introduced an exciting new version of the
    API: Metal 2 adds support for Virtual Reality (VR), Augmented Reality (AR) and
    accelerated machine learning (ML), among many new features. Fall 2017 brought
    new features to Metal including image blocks, tile shading and threadgroup sharing,
    which are available on iOS devices powered by the A11 Bionic chip, which comes
    with the first GPU ever designed in-house by Apple. MSL was also updated to version
    2.0 in Fall 2017 and is now based on the C++14 specification.


    # Why would you use Metal?


    Metal is a top-notch graphics API. That means Metal can empower graphics pipelines
    and, more specifically, game engines as the following:


    +   - **Unity and Unreal Engine**: The two leading cross-platform game engines
    today are ideal for game programmers who target a range of console, desktop and
    mobile devices. However, these engines haven''t kept pace with new features in
    Metal. For example, Unity announced that tessellation on iOS was to be released
    in 2018, despite it being demonstrated live at WWDC 2016. If you want your game
    to use cutting-edge Metal developments, you can''t always depend on third-party
    engines.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '**The Witness**: This award-winning puzzle game has a custom engine that runs
    on top of Metal. By taking advantage of Metal, the iPad version is every bit as
    stunning as the desktop version and is highly recommended for puzzle game fans.


    **Many Others**: From notable game titles such as Hitman, BioShock, Deus Ex, Mafia,
    Starcraft, World of Warcraft, Fortnite, Unreal Tournament, Batman and even the
    beloved Minecraft.


    Metal is not limited to the world of game. There are many apps that benefit from
    GPU acceleration for image and video processing:


    +   * Procreate: An app for sketching, painting and illustrating. Since converting
    to Metal, it runs four times faster than it did before.


    +   * Astropad: An app for drawing using Apple Pencil. The most notable improvements
    since adding Metal show a 50% increase over wifi and two times faster overall
    performance on Macs.


    +   * Pixel: A Metal-based app that provides image distortion tools. In fact,
    they were able to implement a new painting engine and dynamic paint blending technology
    powered by Metal 2.


    +   * Affinity Photo: A recent release, available on the iPad. According to the
    developer Serif, "Using Metal allows users to work easily on large, super high-resolution
    photographs, or complex compositions with potentially thousands of layers."


    Metal, and in particular, the MPS sub-framework, is incredibly useful in the realm
    of machine and deep learning on convolutional neural networks. Apple presented
    a practical machine learning application at WWDC 2016 that demonstrated the power
    of CNNs in high-precision machine recognition.


    # Why should you use Metal?


    GPUs belong to a special class of computation that Flynn''s taxonomy terms Single
    Instruction Multiple Data (SIMD). Simply, GPUs are processors that are optimized
    for throughput (how much data can be processed in one unit of time), while CPUs
    are optimized for latency (how much time it takes a single unit of data to be
    processed). Most programs execute serially: when they receive input, process it,
    provide output and then the cycle repeats.'
  merge: -1
