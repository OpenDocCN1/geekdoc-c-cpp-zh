  md: '# # Chapter 3: The Rendering Pipeline


    By Marius Horga


    In this chapter, you''ll take a deep dive through the rendering pipeline and create
    a Metal app that renders a red cube. Along the way, you''ll discover all of the
    hardware chips responsible for taking the 3D objects and turning them into the
    gorgeous pixels that you see on the screen.


    # ## The GPU and the CPU


    All computers have a Central Processing Unit (CPU) that drives the operations
    and manages the resources on a computer. They also have a Graphics Processing
    Unit (GPU).


    A GPU is a specialized hardware component that can process images, videos and
    massive amounts of data really fast. This is called throughput. The throughput
    is measured by the amount of data processed in a specific unit of time.


    A CPU, on the other hand, can''t handle massive amounts of data really fast, but
    it can process many sequential tasks (one after another) really fast. The time
    necessary to process a task is called latency.


    The ideal setup includes low latency and high throughput. Low latency allows for
    the serial execution of queued tasks so the CPU can execute the commands without
    the system becoming slow or unresponsive; and high throughput lets the GPU render
    videos and games asynchronously without stalling the CPU. The GPU has a highly
    parallelized architecture, specialized in doing the same task repeatedly, and
    with little or no data transfers, it''s able to process larger amounts of data.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 3: The Rendering Pipeline


    The following diagram shows the major differences between the CPU and the GPU.


    ![](img/8d763acb335ab213ea9213a628f7d844_60_0.png)


    The CPU has a large cache memory and a few **Arithmetic Logic Unit (ALU)** cores.
    The low latency cache memory on the CPU is used for fast access to temporary resources.
    The GPU does not have much cache memory and there''s room for more ALU cores which
    only do calculations without saving partial results to.


    Also, the CPU typically only has a handful of cores while the GPU has hundreds
    — thousands of cores. With more cores, the GPU can split the problem into many
    smaller parts, each running on a separate core in parallel, thus hiding latency.
    At the end of processing, the partial results are combined and the final result
    returned to the CPU. But cores aren''t the only thing that matters!


    Besides being slimmed down, GPU cores also have special circuitry for processing
    geometry and are often called **shader cores**. These shader cores are responsible
    for the beautiful colors you see on the screen. The GPU writes a whole frame at
    a time to fit the entire rendering window. It will then proceed to rendering the
    next frame as quickly as possible to maintain a good frame rate.


    ```

    setRenderPipelineState

    setVertexBytes

    setVertexBuffer

    drawIndexedPrimitives

    drawIndexedPrimitives

    ```


    ![](img/8d763acb335ab213ea9213a628f7d844_60_1.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'The CPU continues to issue commands to the GPU to keep it busy, but at some
    point, either the CPU will finish sending commands or the GPU will finish processing
    the commands it received. To avoid stalling, Metal on the CPU queues multiple
    commands in buffers and will issue new commands, sequentially, for the next frame
    without having to wait for the GPU to finish the first frame. This way, no matter
    who finishes the work first, there will be more available to do.


    The GPU part of the graphics pipeline starts once it''s received all of the commands
    and resources.


    # The Metal project


    You''ve been using Playgrounds to learn Metal. Playgrounds are great for testing
    and learning new concepts. In fact, you''ll be using Playgrounds in the next few
    chapters, however, it''s important to understand how to set up a full Metal project.
    Because the iOS simulator doesn''t support Metal, you''ll use a macOS app.


