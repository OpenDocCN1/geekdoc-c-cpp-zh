  md: '# # Chapter 21: Metal Performance Shaders

    By Marius Horga


    In Chapter 11, “Tessellation and Terrains,” you had a brief taste of using the
    Metal Performance Shaders (MPS) framework. MPS consists of low-level, fine-tuned,
    high-performance kernels that run off the shelf with minimal configuration. In
    this chapter, you''ll dive bit deeper into the world of MPS.


    # ## Overview


    The MPS kernels make use of data-parallel primitives that are written in such
    a way that they can take advantage of each GPU family’s characteristics. The developer
    doesn''t have to care about which GPU the code needs to run on, because the MPS
    kernels have multiple versions of the same kernel written for every GPU you might
    use. Think of MPS kernels as convenient black boxes that work efficiently and
    seamlessly with your command buffer. Simply give it the desired effect, a source
    and destination resource (buffer or texture), and then encode GPU commands on
    the fly!


    The Sobel filter is a great way to detect edges in an image. In the projects folder
    for this chapter, open and run `sobel.playground` and you''ll see such an effect
    (left: original image, right: Sobel filter applied):


    ![](img/8d763acb335ab213ea9213a628f7d844_577_0.png)'
