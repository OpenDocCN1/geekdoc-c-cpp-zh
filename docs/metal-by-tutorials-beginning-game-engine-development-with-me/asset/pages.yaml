    # Where to go from here?


    Procedural systems are fun to create. Later in this book, you''ll encounter Perlin
    noise, and if you use this noise for your randomness, you can generate infinite
    terrains, or even dynamic wind or animation.


    You''re currently generating your systems on the CPU, but in a few chapters, you''ll
    learn how to compute kernels, and you''ll be able to create more massive systems
    in parallel. A particle system is an excellent example of a procedural system,
    and in just a few chapters you''ll also master particles.


    One of the sections in references.markdown is about Lindenmayer systems. Using
    L-systems for creating plants is interesting and approachable. Now that you know
    how to manipulate vertices more comfortably, you might want to try your hand at
    generating 3D plants.


    The next chapter will take you further into lighting techniques. You''ll find
    out how to render to a texture without immediately putting it onto the screen.'
