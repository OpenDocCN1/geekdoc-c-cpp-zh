    # Representing color


    The physics of light is a vast, fascinating topic with many books and a large
    part of the internet dedicated to it. However, in this book, you''ll learn the
    necessary basics to get rendering light, color and simple shading. You can find
    further reading in **references.markdown** in the Resources directory of this
    chapter.


    In the real world, the reflection of different wavelengths of light is what gives
    an object its color. A surface that absorbs all light is black. In the computer
    world, pixels display color. The more pixels, the better and the resulting image
    clearer. Each pixel is made up of subpixels. These are a predetermined single
    color, either red, green or blue. By turning on and off these subpixels, depending
    on the color depth, the screen can display most of the colors visible to the human
    eye.


    In Swift, you can represent a color using the RGB values for that pixel. For example
    float3(1, 0, 0) is a red pixel, float3(0, 0, 0) is black and float3(1, 1, 1) is
    white.


