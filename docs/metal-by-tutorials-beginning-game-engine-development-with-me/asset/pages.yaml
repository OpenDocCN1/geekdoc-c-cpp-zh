  md: "# Chapter 9: The Scene Graph\n\nThe first method, add(childNode), adds the\
    \ node to the array of children and sets the child node's parent to the current\
    \ node.\n\nThe second method, remove(childNode), has to adjust the parent/child\
    \ relationship before removing the node. It does this by adding any children of\
    \ the removed node to the children of the current node. When that's all done,\
    \ it sets the parent of these nodes to the current node.\n\n> Note: You can read\
    \ up on tree structures at https://www.raywenderlich.com/138190/swift-algorithm-club-swift-tree-data-structure\n\
    \nYou can now create a hierarchy of Nodes in your Scene.\n\nWhile the hierarchy\
    \ is a parent-child relationship, rendering is not. Later, you may want to render\
    \ objects in a particular order — keeping them in a flat array makes this task\
    \ easier and more flexible.\n\nIn Scene.swift, add these properties to Scene:\n\
    \n```\nlet rootNode = Node()\nvar renderables: [Renderable] = []\nvar uniforms\
    \ = Uniforms()\n```\n\nIt's time to replace the current update(deltaTime:) in\
    \ Renderer with one you'll add to Scene. These new update methods will handle\
    \ updating the nodes before they are rendered, which requires traversing through\
    \ the hierarchy.\n\nStill in Scene.swift, add the following methods to handle\
    \ updating the nodes:\n\n```\nfunc update(deltaTime: Float) {\n    uniforms.projectionMatrix\
    \ = camera.projectionMatrix\n    uniforms.viewMatrix = camera.viewMatrix\n   \
    \ updateScene(deltaTime: deltaTime)\n    update(nodes: rootNode.children, deltaTime:\
    \ deltaTime)\n}\n\nprivate func update(nodes: [Node], deltaTime: Float) {\n  \
    \  nodes.forEach { node in\n        node.update(deltaTime: deltaTime)\n      \
    \  update(nodes: node.children, deltaTime: deltaTime)\n    }\n}\n\nfunc updateScene(deltaTime:\
    \ Float) {\n    // override this to update your scene\n}\n```\n\nraywenderlich.com\n\
