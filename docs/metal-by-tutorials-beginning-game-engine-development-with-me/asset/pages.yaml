  md: '![](img/8d763acb335ab213ea9213a628f7d844_15_0.png)


    To follow along with the tutorials in this book, you need the following:


    +   - A Metal-capable Mac running macOS Mojave 10.14 or later. All Macs built
    since 2012 should run Metal, although not all of them will be able to run the
    most recent features in Metal 2.

    - Xcode 10.0 or later.

    - [optional] A Metal-capable iPhone or iPad running iOS 12 or later. Any iOS device
    running the A7 chip or later will run Metal. The latest features, such as tiling
    shading and imageblocks, will only run on the A1 (or later) chipset. The projects
    will build and run on your Mac, so using an iOS device is optional. If you wish
    to make an iOS game, the game engine you build while reading this book will have
    an iOS target as well.


    Many of the examples throughout this book use a playground to demonstrate the
    subject matter. At the time of this writing, Metal does not work on the iOS Simulator
    you''ll be creating these playgrounds for macOS. The Metal API, with a few exceptions,
    works the same on macOS as it does on iOS so it won''t be difficult to add an
    iOS target to your project later on.'
  merge: -1
