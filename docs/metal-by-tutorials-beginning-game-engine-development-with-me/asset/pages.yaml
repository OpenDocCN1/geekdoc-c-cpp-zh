  md: 'You can improve the realism of texture effects in at least a couple of ways.
    One of them is to attach a sprite or a texture to each particle. Instead of a
    dull point, you''ll then be to see a textured point which looks much more lively.


    You can practice this technique in the next particle endeavor: a snowing simulation.


    # Particle systems


    Open up the Particles starter project. You''ll get a warning compile message,
    but that will disappear when you start adding code.


    This project contains the pipeline states you''ll need, in addition to an Emitter
    class similar to the struct in your fireworks playground.


    Particle systems can be very complex with many different options for particle
    movement, colors and sizes, but this Emitter class is a fairly simple example
    of a generic particle system where you can create many types of particles.


    For example, you''re going to create snow falling, but also a fire blazing upwards.
    These particle systems will have different speeds, textures and directions.


    In Emitter.swift, you have a ParticleDescriptor. To create a particle system,
    you create a descriptor that describes all the characteristics of your particle
    system. Many of the properties in ParticleDescriptor are ClosedRanges.


    For example, as well as position, there is a positionXRange and positionYRange.
    This allows you to specify a starting position also allows randomness within limits.
    If you specify a position of [10, 0], and a positionXRange of 0...180, then each
    particle will be within the range of 10 to 190.


    Emitter also has a birthRate property. This allows you to slowly release particles
    (like a gentle flurry) or send them out more quickly (like a blazing fire).'
