    loads object properties, normals and colors into separate arrays. Call this method
    with OBJ files to add objects to the scene.


    In Renderer:


    +   - createScene() loads a default scene.


    +   - createBuffers() creates buffers from the OBJ file arrays, sets up the uniforms
