- img_proc: true
  md: '# # What is rendering?


    The Oxford Dictionary describes computer rendering as:


    > > the processing of an outline image using color and shading to make it appear
    solid and three-dimensional.


    There are many ways to render a 3D image, but most must start with a model built
    in a modeling app such as Blender or Maya. Take, for example, this train model
    that was built in Blender:


    ![](img/8d763acb335ab213ea9213a628f7d844_27_0.png)


    This model, like all other models, is made up of vertices. The number of vertices
    in a model may vary from a handful, such as in a cube, to thousands or even millions
    in more complex models. You''ll learn more about 3D models in the next chapter,
    but for now, and to understand rendering, know that a vertex is the imaginary
    point in space where two or more lines, curves or edges of a geometrical shape.
    A 3D renderer will read these vertices using model loader code, which parses the
    list of vertices. The renderer then passes the vertices to the GPU, where shader
    functions process the vertices to create the final image or texture to be sent
    back to the CPU and displayed on the screen.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'The following render uses the 3D train model and some different shading shading
    techniques to make it appear as if the train were made of shiny copper:


    ![](img/8d763acb335ab213ea9213a628f7d844_28_0.png)


    The entire process from importing a model''s vertices to generating the final
    image on your screen, is commonly known as a *rendering pipeline*. The rendering
    pipeline is a list of commands sent to the GPU, along with resources (vertices,
    materials and lights) that make up the final image. The pipeline includes programmable
    and non-programmable functions; the former, known as **vertex functions** and
    **fragment functions**, are where you manually influence the final look of your
    rendered models. You will learn more about each later in the book.


    # # What is a frame?


    A game wouldn''t be much fun if it simply rendered a single still image. Moving
    a character around the screen in a fluid manner requires the GPU to render a still
    image roughly 60 times a second.


    Each still image is known as a **frame** and the speed at which the images appear
    is called the **frame rate**. When your favorite game appears to stutter, it''s
    usually because of a decrease in the frame rate, especially if there''s an excessive
    amount of background processing eating away at the GPU.


    When designing a game, it''s important to balance what you want with what the
    hardware can deliver. While it might be cool to add real-time shadows, water reflections'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'and millions of blades of animated grass — all of which you''ll learn how to
    do in this book — finding the right balance between what is possible and what
    the GPU can process in 1/60th of a second can be tough.


    # Your first Metal app


    In your first Metal app, the shape you''ll be rendering will look more like a
    flat circle than a 3D sphere. That''s because your first model will not include
    any perspective or shading; however, its vertex mesh contains the full three-dimensional
    information.


    The process of Metal rendering is much the same no matter the size and complexity
    of your app, and you''ll become familiar with the following sequence of drawing
    your models on the screen:


    ![](img/8d763acb335ab213ea9213a628f7d844_29_0.png)


    You''ll learn more about each step of the process as you work through this book.
    For now, concentrate on getting your first Metal app running.


    # Getting started


    Start Xcode and create a new playground by selecting File -> New -> Playground
    from the main menu. When prompted for a template, choose macOS Blank.


    ![](img/8d763acb335ab213ea9213a628f7d844_29_1.png)'
