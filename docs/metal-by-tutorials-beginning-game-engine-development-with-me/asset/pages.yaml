  md: '# Toon shading


    A full toon shader consists of an edge detection algorithm and a cel shader where
    you reduce the color palette. Generally, shading is a gradient from light to dark,
    but the shading in this rocket demonstrates cel shading where abrupt steps in
    the gradient occur:


    ![](img/8d763acb335ab213ea9213a628f7d844_617_0.png)


    Edge detection is difficult. One way of creating a solid outline is to render
    the model twice, one larger than the other. Render the larger one in black (or
    the outline color) behind the smaller model. That will give a solid outline around
    the model, but it won''t take into account curves within the outline.


    In Chapter 11, "Tessellation and Terrain", you used the Sobel filter on a height
    map to find the difference in slope. If you render the entire screen to a texture,
    you could run a Sobel filter which convolutes the image and locates edges, but
    during a fragment shader, so far, you''ve only been able to access the current
    rendered fragment, and you have no idea whether that fragment is an edge.


    # The fwidth function


    In fragment shaders, you have access to the current fragment, but you also have
    access to the change in slope from neighboring fragments. Fragments pass through
    the rasterizer in a 2 x 2 arrangement, and the partial derivatives of each fragment
    can be derived from the other fragment in the group of four.


    dfdx() and dfdy() return the horizontal and vertical changes in slope, and fwidth()
    gives you the absolute derivative of the combined dfdx() and dfdy().'
