  md: "This code extracts the camera position from the view matrix and sends it, along\
    \ with the model matrix, the control points buffer and the terrain information\
    \ to the tessellation kernel.\n\nTo accept these buffers, add these parameters\
    \ to the tessellation kernel function header in **Shaders.metal:\n\n```\nconstant\
    \ float4&camera_position [[ buffer(3) ]]\nconstant float4x&modelMatrix [[ buffer(4)\
    \ ]]\nconstant float3*control_points [[ buffer(5) ]]\nconstant Terrain&terrain\
    \ [[ buffer(6) ]]\n```\n\nWith these constants, you can compute the distance of\
    \ the edges from the camera.\n\nYou'll set the edge and inside tessellation factors\
    \ differently for each patch edge instead of sending a constant 4 for all of the\
    \ edges. The further the patch is from the camera, the lower the tessellation\
    \ on that edge. These are the edge and control point orders for each patch:\n\n\
    ![](img/8d763acb335ab213ea9213a628f7d844_310_0.png)\n\nTo calculate the tessellation\
    \ of an edge, you need to know the transformed mid-point of two control points.\
    \ To calculate edge 2, for example, you get the midpoint of points 1 and 2 and\
    \ find out the distance of that point from the camera. Where two patches join,\
    \ it's imperative to keep the tessellation level for the joined edges the same;\
    \ otherwise you get cracks. By calculating the distance of the mid-point, you\
    \ end up with the same result for the overlapping edges.\n\nIn **Shaders.metal**,\
    \ create a new function *before* `tessellation_main`:\n\n```\nfloat calc_distance(float3\
    \ pointA, float3 pointB, float4x4 modelMatrix) {\n  float3 positionA = (modelMatrix\
    \ * float4(pointA, 1)).xyz;\n  float3 positionB = (modelMatrix * float4(pointB,\
    \ 1)).xyz;\n  float3 midpoint = (positionA + positionB) * 0.5;\n  float camera_distance\
    \ = distance(camera_position, midpoint);\n  return camera_distance;\n}\n```"
