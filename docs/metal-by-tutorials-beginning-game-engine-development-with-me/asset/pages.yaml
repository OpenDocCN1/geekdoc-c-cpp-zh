  md: '# # Chapter 16: Particle Systems

    By Marius Horga


    One of the many ways to create art and present science in code is by making use
    of particles. A **particle** is a tiny graphical object that carries basic information
    about itself such as color, position, life, speed and direction of movement.


    Nothing explains a visual effect better than an image showing what you''ll be
    able to achieve at the end of this chapter.


    ![](img/8d763acb335ab213ea9213a628f7d844_444_0.png)


    Particle systems are widely used in:


    +   - Video games and animation: hair, cloth, smoke, water, snow.

    - Modeling of natural phenomena: fire, smoke, water, snow.

    - Scientific simulations: galaxy collisions, cellular mitosis, fluid turbulence.'
  merge: -1
  pgno: 444
- img_proc: true
  md: 'Note: William Reeves is credited as being the “father” of particle systems.
    While Lucasfilm, Reeves created the Genesis Effect in 1982 while working on the
    movie Star Trek II: The Wrath of Khan. Later, he joined Pixar Animation Studios
    where he''s still creating amazing animations using particles.


    In a moment, you''ll get your feet wet trying out one such practical application:
    fireworks. But first, what exactly is a particle?


    # # Particle


    Newtonian dynamics describe the relationship between any small body — a particle
    — and the forces acting upon it, as well as its motion in response to those forces.
    Newton''s three laws of motion define the relationship between them.


    The first two laws define motion as a result of either inertia or force interference
    upon the particle''s current state of motion (stationary or moving). You''ll be
    working with them in this chapter.


    The third law, however, defines motion as a reaction of two or more particles
    interacting with each other. You''ll work with this in Chapter 17, “Particle Behavior.”


    A fourth law, if you wish, is the law of life. It''s not one of the Newtonian
    motion laws, but it does indeed apply to particles. Particles are born; they move
    and interact with the environment; and, then, they die.


    # Particle Life

    Color changes from dark (birth) to white (death)


    ![](img/8d763acb335ab213ea9213a628f7d844_445_0.png)


    You need a particle system to create fireworks. First, however, you need to define
    a particle that has — at a minimum — a position, direction, speed, color and life.'
