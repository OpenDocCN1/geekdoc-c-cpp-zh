  md: '# # Section II: The Scene


    With the low basics under your belt, you can move on to creating game scenes with
    scenery, skies and terrains. You''ll be able to add multiple models to a scene,
    and move around the scene and explore it.


    +   - Chapter 9: The Scene Graph: Organize your scene models into a scene and
    use different scenes for different levels of your game. You''ll drive a car around
    a large scene and create a simple collision engine to prevent you driving straight
    through trees.


    +   - Chapter 10: Fragment Post-Processing: Some simple techniques will improve
    your renders with transparency, antialiasing and blending.


    +   - Chapter 11: Tessellation and Terrain: The hardware tessellator can add vertices
    to a low poly model during rendering. Find out how to create mountainous terrains
    with just a few vertices, a texture and tessellation.


    +   - Chapter 12: Environment: Add a 360° sky to your scene. Using the sky to
    help your models will integrate more into their environment. Understand more about
    physically based rendering and how it can improve the look of your game.


    +   - Chapter 13: Instancing and Procedural Generation: Create a vegetation system
    where you can render hundreds of thousands of blades of grass in your scene. Use
    morph targets to add variety to rock shapes and create your own procedural system
    to generate random buildings.'
