    # Matrices on the GPU


    You may have noticed that this vertex processing code is taking place on the CPU.
    This is serial processing, which is much more inefficient compared to parallel
    processing. There''s another place where each vertex is being processed — the
    GPU. You can pass the GPU your transformation matrix and multiply each vertex
    by the matrix by the vertex shader. The GPU is optimized for matrix calculation.


    Replace the code:


    ```

    vertices = vertices.map {

    var vertex = float4($0.x, $0.y, $0.z, 1)

