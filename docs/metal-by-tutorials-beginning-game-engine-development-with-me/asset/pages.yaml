  md: 'Metal by Tutorials


    Chapter 10: Fragment Post-Processing


    When you move closer to the tree — using either the scroll wheel or the two-finger
    gesture on your trackpad — you’ll notice the leaves have an unpleasant look. In
    the playground’s Resources folder, take a look at treeColor.png. The area of the
    texture surrounding the leaf is transparent.


    ![](img/8d763acb335ab213ea9213a628f7d844_273_0.png)


    To make the leaves look more natural, you’ll render the white part of the texture
    as transparent. However, before changing anything, it’s important to understand
    the difference between transparent objects and those that are translucent.


    # Alpha testing


    An object that is transparent allow light to entirely pass through it. A translucent
    object, on the other hand, will distort light when it passes through. Objects
    like water, glass, and plastic are all translucent. Objects can also be opaque.
    In fact, most objects in nature are opaque, meaning they don’t allow any light
    to pass through, like trees and rocks.


    All digital colors are formed as a combination of the three primary colors: red,
    green and blue. Here the color scheme RGB. There''s a fourth component that is
    added to the color definition. It''s called alpha and it ranges from 0 (fully
    transparent) to 1 (fully opaque). A common practice in determining transparency
    is checking the alpha property and ignoring values below a certain threshold.
    This is alpha testing.


    Because the trees will have additional modifications, you need to create different
    shaders, which means you also need several different pipeline states for each
    shader combination.


