  md: 'Metallic: a surface is either a conductor of electricity — in which case it''s
    a metal; or it isn''t a conductor — in which case it''s a dielectric. Most metal
    textures consist of 0 (black) and 1 (white) values only: 0 for dielectric and
    1 for metal.


    Roughness: A grayscale texture that indicates the shininess of a surface. White
    is rough, and black is smooth. If you have a scratched shiny surface, the texture
    might consist of mostly black or dark grey with light scratch marks.


    Ambient Occlusion: A grayscale texture that defines how much light reaches a surface.
    For example, less light will reach nodes and crannies.


    Included in the starter project is a fragment function that uses a Cook-Torrance
    model for specular lighting. It takes as input the above textures, as well as
    the color and normal textures.


    > Note: The PBR fragment function is an abbreviated version of a function from
    Apple''s sample code LODwithFunctionSpecialization. This is a fantastic piece
    of sample code to examine, complete with a gorgeous truck model. As a challenge,
    you can import the fragment into your renderer to see how it looks. Remember,
    though, that you haven''t yet implemented great lighting and reflection.


    # PBR workflow


    First, change the fragment function to use the PBR calculations. In Submesh.swift,
    change makePipelineState() to "fragment_mainPBR".


    Open PBR.metal. In the File inspector, add the file to the macOS and iOS targets.


