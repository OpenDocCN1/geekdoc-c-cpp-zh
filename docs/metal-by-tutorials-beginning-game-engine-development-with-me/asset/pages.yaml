  md: '# Projection


    So far you haven''t applied any perspective to your render. Perspective is where
    close objects appear bigger than objects that are farther away.


    ![](img/8d763acb335ab213ea9213a628f7d844_107_0.png)


    When you render a scene, you''ll have to take into account:


    +   - How much of that scene will fit on the screen. Your eyes have a field of
    view of about 200°, and within that field of view, your computer screen takes
    up to 70°.

    - How far you can see by having a far plane. Computers can''t see to infinity.

    - How close you can see by having a near plane.

    - The aspect ratio of the screen. Currently, your train changes size when the
    screen size changes. When you take into account the width and height ratio, this
    won''t happen.


    The above shows all these. The shape created from the near to the far plane is
    a cut-off pyramid called a frustum. Anything in your scene that is located outside
    the frustum will not render.


    Compare the rendered image against the scene setup. The rat in the scene does
    not render because he is in front of the near plane.'
