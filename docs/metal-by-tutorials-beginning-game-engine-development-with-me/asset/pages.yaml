    \ shaders, they are compiled when you compile your project which is more efficient\
    \ than compiling on the fly. The result is stored in the library.\n\nNow, create\
    \ the pipeline state:\n\n```\nlet pipelineDescriptor = MTLRenderPipelineDescriptor()\n\
    pipelineDescriptor.vertexFunction = vertexFunction\npipelineDescriptor.fragmentFunction\
    \ = fragmentFunction\npipelineDescriptor.vertexDescriptor = MTKVertexDescriptorFromModelI0(mdlMesh.vertexDescriptor)\n\
    pipelineDescriptor.colorAttachments[].pixelFormat = metalView.colorPixelFormat\n\
    do {\n  pipelineState = try device.makeRenderPipelineState(descriptor: pipelineDescriptor)\n\
    } catch let error {\n  fatalError(error.localizedDescription)\n}\n```\n\nThis\
