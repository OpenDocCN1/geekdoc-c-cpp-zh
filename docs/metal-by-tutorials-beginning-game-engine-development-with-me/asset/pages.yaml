  md: '# Profiling


    Always profile early and do it often.


    There are a few ways to monitor and tweak your app''s performance. You''ll be
    looking at each of these next.


    # GPU history


    GPU history is a tool provided by the macOS operating system via its Activity
    Monitor app, so it is not inside Xcode. It shows GPU activity in real time for
    all of your GPUs. If you''re using eGPUs, it''ll show activity in there.


    Open Activity Monitor, and from the Window menu, choose GPU History; a window
    will pop up containing separate graphs for each GPU, showing the GPU usage in
    real time.


    You can change how often the graph is updated from the View Update Frequency menu.
    The graph moves right-to-left at the frequency rate you set.


    Here''s a screenshot taken from a MacBook Pro that has a discrete GPU — AMD Radeon
    Pro 450 — and an integrated Intel HD Graphics 530:


    ![](img/8d763acb335ab213ea9213a628f7d844_424_0.png)


    The system is using the integrated Intel GPU for regular tasks, and it switches
    to the discrete AMD GPU when running a graphics-intensive task such as this Xcode
    project you''re working on.


    The GPU History tool offers a quick way to see overall GPU usage, but it''s not
    helpful with showing GPU usage for individual running apps and processes.


    # The GPU report


    Build and run your app again, then capture a GPU frame. On the Debug navigator,
    click FPS gauge on the left side.'
  merge: -1
  pgno: 424
- img_proc: true
  md: 'The GPU report shows in the central pane and contains three major GPU metrics.


    ![](img/8d763acb335ab213ea9213a628f7d844_425_0.png)


    The first GPU report metric is Frames Per Second and represents the current frame
    rate of your app. Your target should be 60 FPS or better.


    The second GPU report metric is Utilization which shows how busy your GPU is doing
    useful work. A healthy app will have the GPU always utilized to some extent. Having
    it sit idle might be an indication that the CPU has not given it enough work to
    do.


    On iOS and tvOS, the GPU utilization is separated into geometry processing (tiler)
    and pixel processing (renderer). The third column includes both utilization values.


    ![](img/8d763acb335ab213ea9213a628f7d844_425_1.png)


    The third GPU report metric is Frame Time and represents the actual time processing
    the current frame on the CPU and the GPU. What''s most important here is that
    the frame does not take longer than 16.6ms which corresponds to 60 FPS.


    Your app is running at 60 FPS (16.6ms), and the GPU is not sitting idle. So far
    so good!


    # The shader profiler


    This perhaps the most profiling tool for the shader code you are writing. It has
    nothing to do with the rendering code the CPU is setting up, or the passes you
    run or the resources you''re sending to the GPU. This tool tells you how your
    MSL code is performing line-by-line and how long it took to finish.


    Unfortunately, the shader profiler shows you the individual line execution times
    (per-line cost) on iOS devices only.'
  merge: -1
  pgno: 425
