  md: 'The vertex, joint animation data are in buffers in an accompanying binary file
    skeletonWave.bin, and entries in the .gtlf file point to the locations of the
    vertex and attribute data in each buffer.


    Also included in your starter project is a bare-bones glTF importer that takes
    the place of the Model I/O .obj importer for loading Characters. The glTF importer
    imports simple animations but does not support all of the features that glTF supports.
    Once you import the glTF model, you''ll be able to access:


    +   - Buffers containing vertices with information about their position, normals,
    which they are attached to, and the weighting of the vertices to each joint.

    - A hierarchy of nodes consisting of mesh nodes and joint nodes.

    - The mesh nodes will point to a list of submeshes with material properties.

    - The imported buffers will also contain animation clips. These animation clips
    hold an animation for each joint node.


    ![](img/8d763acb335ab213ea9213a628f7d844_225_0.png)


