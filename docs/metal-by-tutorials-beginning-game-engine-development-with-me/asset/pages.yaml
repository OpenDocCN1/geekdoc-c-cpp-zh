  md: '+   point: For each vertex rasterize a point. You can specify the size of a
    point that has the attribute ([point_size]) in the vertex shader.


    +   line: For each pair of vertices rasterize a line between them. If a vertex
    was already included in a line, it cannot be included again in other lines. The
    last vertex is ignored if there are an odd number of vertices.


    +   lineStrip: Same as a simple line except that the line strip connects all adjacent
    vertices and forms a poly-line. Each vertex (except the first) is connected to
    the previous vertex.


    +   triangle: For every sequence of three vertices, rasterize a triangle. The
    last vertices are ignored if they cannot form another triangle.


    +   triangleStrip: Same as a simple triangle except the triangle adjacent vertices
    can be connected to other triangles as well.


    There is one more primitive type called a patch but this needs a special treatment
    and cannot be used with the indexed draw call function. You will read more about
    patches in Chapter 11, "Tessellation and Terrains."


    As you read in the previous chapter, the pipeline specifies the winding order
    of the vertices. If the winding order is counter-clockwise, and the triangle vertex
    order is counter-clockwise, it means they are front-faced. Otherwise, they are
    back-faced and can be culled since we cannot see their color and lighting.


    Primitives will be culled when they are totally occluded by other primitives,
    however, when they are only partially off-screen, they''ll be clipped.


    ![](img/8d763acb335ab213ea9213a628f7d844_74_0.png)'
