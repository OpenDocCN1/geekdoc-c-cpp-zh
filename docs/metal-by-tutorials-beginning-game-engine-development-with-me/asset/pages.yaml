  md: "from 0 to 1, sRGB colors are not linear. Humans are more able to discern between\
    \ lighter values than darker ones.\n\nsRGB\nLinear\n\nUnfortunately, it's not\
    \ easy to do the math on colors in a non-linear space. If you multiply a color\
    \ by 0.5 to darken it, the difference in sRGB will vary along the scale.\n\nYou're\
    \ currently loading the texture as sRGB pixel data and rendering into a linear\
    \ space. When you're sampling a value of, 0.2 which in sRGB space is mid-gray,\
    \ the linear space will read that as de-gray.\n\nTo approximately convert the\
    \ color, you can use the inverse of gamma 2.2:\n\n```\nsRGBColor = pow(linearColor,\
    \ 1.0/2.2);\n```\n\nIf you use this formula on baseColor before returning from\
    \ the fragment function, your house texture will look about the same as the original\
    \ sRGB texture. However, a better way of dealing with this is not to load the\
    \ texture as sRGB at all. In Texturable.swift,\n\n```\nlet textureLoaderOptions:\
    \ [MTKTextureLoader.Option: Any] = \n    [.origin: MTKTextureLoader.origin.bottomLeft]\n\
    ```\n\nAnd change it to:\n\n```\nlet textureLoaderOptions: [MTKTextureLoader.Option:\
    \ Any] = \n    [.origin: MTKTextureLoader.origin.bottomLeft, \n    sRGB: false]\n\
    ```\n\nBuild and run, and the texture will now load with the linear color pixel\
