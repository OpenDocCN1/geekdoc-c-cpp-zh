  md: "# Metal by Tutorials\n\nAdd this function to Shaders.metal:\n\n```\nfloat differenceOperator(float\
    \ d0, float d1) {\n    return max(d0, -d1);\n}\n```\n\nThis yields a value that\
    \ can be used to calculate the difference result from the previous image, where\
    \ the signed distance is subtracted from the first. The result of this function\
    \ is a signed distance to a compound boundary. It'll only be negative inside the\
    \ first shape, but outside the second.\n\nNext, design a scene:\n\n```\nfloat\
    \ distanceToScene(float2 point) {\n    // 1\n    Rectangle r1 = Rectangle(float2(0.0),\
    \ float2(0.3));\n    float d21 = distanceToRectangle(point, r1);\n    // 2\n \
    \   Rectangle r2 = Rectangle(float2(0.05), float2(0.04));\n    float mod2 = point\
    \ - 0.1 * floor(point / 0.1);\n    float d22 = distanceToRectangle(mod, r2);\n\
    \    // 3\n    float diff = differenceOperator(d21, d22);\n    return diff;\n\
    }\n```\n\nGoing through the code:\n\n+   1. Create a rectangle, and get the distance\
    \ to it.\n2. Create a second, smaller rectangle, and get the distance to it. The\
    \ difference here is that the area is repeated every 0.1 points — which is a 10th\
    \ of the size of the scene — using a modulo operation. See the note below.\n3.\
    \ Subtract the second repeated rectangle from the first rectangle, and return\
    \ the resulting distance.\n\n> Note: The fmod() function in MSL uses trunc() instead\
    \ of floor(), so you create a custom operator because you also want to get the\
    \ negative values. The GLSL specification for mod() which is x - y * floor(x/y).\
    \ You need the modulus operator to draw many small rectangles mirrored with a\
    \ distance of 0.1 from each other.\n\nFinally, use these functions to generate\
    \ a shape that looks a bit like a fence or a trellis."
