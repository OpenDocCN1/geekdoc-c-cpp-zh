- img_proc: true
  md: 'There are various algorithms to interpolate these control points, but here,
    A, B and C are the control points. As point P travels from A to B, point Q travels
    from B to C. The half way point between P and Q describes the blue curve.


    ![](img/8d763acb335ab213ea9213a628f7d844_298_0.png)


    To create the curved patch surface, the vertex function interpolates vertices
    to follow this parametric curve.


    > Note: Because the mathematics of curved surfaces is quite involved, you''ll
    only be working with four control points per patch in this chapter.


    # Tessellation factors


    For each patch, you need to specify inside edge factors and outside edge factors.
    The four-point patch in the following image shows different edge factors for each
    edge — specified as [2, 4, 8, 16] — and two different inside factors — specified
    as [8, 16], for horizontal and vertical respectively.


    ![](img/8d763acb335ab213ea9213a628f7d844_298_1.png)'
