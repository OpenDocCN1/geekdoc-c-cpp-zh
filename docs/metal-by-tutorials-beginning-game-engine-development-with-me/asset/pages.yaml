  md: 'The sky texture in the starter project already contains the prefiltered environment
    maps.


    ![](img/8d763acb335ab213ea9213a628f7d844_346_0.png)


    # BRDF look-up table


    During runtime, you supply a look-up table with the actual roughness of the model
    and the current viewing angle and receive back scale and bias for the Fresnel
    geometric attenuation contributions to the final color. You can represent this
    two-dimensional look-up table as a texture that behaves as a two-dimensional array.
    One axis is the roughness value of the object, and the other is the angle between
    the normal and the view direction. You input these two values as the UV coordinates
    and receive back a color. The red value contains the scale, and the green value
    contains the bias.


    ![](img/8d763acb335ab213ea9213a628f7d844_346_1.png)


    The more photorealistic you want your scene to be, the higher the level of mathematics
    you''ll need to know. In **references.markdown**, there are links with suggested
    reading that explain the Cook-Torrance microfacet specular shading model. The
    starter project contains functions provided by Epic Games to create the BRDF look-up
    texture. You can find these in the **Utilities** group.'
