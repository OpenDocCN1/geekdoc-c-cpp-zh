  md: '# Cube textures


    Cube textures are similar to the 2D textures that you''ve already been using.
    2D textures map to a quad and have two texture coordinates, whereas cube textures
    consist of six 2D textures: one for each face of the cube. You sample the textures
    with a 3D vector.


    The easiest way to load a cube texture into Metal is to use Model I/O''s MDLTexture
    initializer. When creating cube textures, you can arrange the images in various
    combinations:


    ![](img/8d763acb335ab213ea9213a628f7d844_333_0.png)


    Alternatively, you can create a cube texture in an asset catalog and load the
    six images there. Back in your starter project, open Textures.xcassets in the
    Textures group. This is pre-loaded with a sky texture complete with mipmaps. The
    sky should render on the basemap level 0, but you''ll see later how to use the
    other mipmaps. Aside from there six images to one texture, moving the images into
    the asset catalog and creating the mipmaps is the same process as described in
    Chapter 7, "Maps and Materials".


    ![](img/8d763acb335ab213ea9213a628f7d844_333_1.png)'
