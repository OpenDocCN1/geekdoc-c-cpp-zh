  md: 'Metal by Tutorials


    Chapter 12: Environment


    See the difference in the light''s reflection:


    ![](img/8d763acb335ab213ea9213a628f7d844_345_0.png)


    In Chapter 7, "Maps and Materials", you had a forestaste of physically based rendering
    using the Cook-Torrance microfacet specular shading model. This model is defined
    as:


    ```

    $$f(l, v) = D(h)F(v, h)G(l, v) / (n \cdot l)(n \cdot v)$

    ```


    Where you provide the light direction **(l)**, view direction **(v)** and the
    half vector **(h)** between **I** and **v**. As described in Chapter 7, "Maps
    and Materials", the functions are:


    +   - **D**: Geometric slope distribution

    - **F**: Fresnel

    - **G**: Geometric attenuation


    Just as with the diffuse light, to get the accuracy of the incoming specular light,
    you need to take many samples, which is impractical in real-time rendering. Epic
    Game''s approach in their paper Real Shading in Unreal Engine 4 is to split the
    sky cube model calculation. The prefilter filter the sky cube texture with the
    geometry distribution for various roughness values. For each roughness level,
    the texture gets smaller and blurrier, and you can store these prefiltered environment
    maps as different mipmap levels in the sky cube texture.


