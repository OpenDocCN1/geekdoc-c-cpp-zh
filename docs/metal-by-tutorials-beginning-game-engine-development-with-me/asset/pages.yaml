  md: "# Metal by Tutorials\n\n# Chapter 18: Rendering with Rays\n\nTo smooth out\
    \ the noise pattern, you'll make use of pixel neighborhoods, also known as convolution\
    \ kernels in the world of image processing. One such famous convolution grid is\
    \ the Von Neumann neighborhood:\n\n| 0 | 1/B | 0 |\n| 1/8 | 1/2 | 1/8 |\n| 0 |\
    \ 1/8 | 0 |\n\nNeighborhood averaging produces a blurry result. You can easily\
    \ express this grid with code.\n\nIn Shaders.metal, create a new function:\n\n\
    ```\nfloat smoothNoise(float2 p) {\n  // 1\nfloat2 north = float2(p.x, p.y + 1.0);\n\
    float2 east = float2(p.x + 1.0, p.y);\nfloat2 south = float2(p.x, p.y - 1.0);\n\
    float2 west = float2(p.x - 1.0, p.y);\nfloat2 center = float2(p.x, p.y);\n  //\
    \ 2\n  float sum = 0.0;\n  sum += randomNoise(north) / 8.0;\n  sum += randomNoise(east)\
    \ / 8.0;\n  sum += randomNoise(south) / 8.0;\n  sum += randomNoise(west) / 8.0;\n\
    \  sum += randomNoise(center) / 2.0;\n  return sum;\n}\n```\n\nGoing through the\
    \ code:\n\n+   1. Store the coordinates for the central pixel and the neighbors\
    \ located at the four cardinal points relative to the central pixel.\n\nraywenderlich.com\n\
    \n508"
  merge: -1
