  md: '# Reflection


    Reflection is one of the most common interactions between light and objects. Imagine
    looking into a mirror. Not only would you see your image being reflected, but
    you''d also see the reflection of any nearby objects.


    Reflection, like any other optical phenomenon, has an equation that depends on
    three things: the incoming light vector, the incident angle and the normal vector
    for the surface.


    ![](img/8d763acb335ab213ea9213a628f7d844_547_0.png)


    The law of reflection states that the angle at which an incident light hits the
    surface of an object will be the same as the angle of the light that''s being
    reflected off the normal.


    But enough with the theory for now. Time to have some fun coding!


