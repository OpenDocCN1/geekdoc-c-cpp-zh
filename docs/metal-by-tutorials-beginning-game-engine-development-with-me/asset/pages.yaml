  md: '# The 12 principles of animation


    Unfortunately, no matter how fascinating, this is not the place to discuss the
    principles of animation. Two Disney animators, Frank Thomas and Ollie Johnston,
    wrote a brilliant full-colored book called The Illusion of Life wherein they popularized
    12 principles.


    At the moment, the ball does not conform to the first principle of animation:
    **squash and stretch**. With squash and stretch, the ball should slightly stretch
    when falling and flatten when it hits the ground. The amount of squash and stretch
    indicates to the viewer the elasticity of an object. Clever animators can impart
    personality using exaggeration.


    It''s time to implement a simple, quick and dirty squash and stretch (bearing
    no relation to physics). Add a new property to Renderer:


    ```

    var maxVelocity: Float = 0

    ```


    In update(deltaTime:), after calculating ballVelocity, add the following to find
    out the maximum velocity achieved:


    ```

    maxVelocity = max(maxVelocity, abs(ballVelocity))

    ```


    Replace the collision conditional in update(deltaTime:) with:


    ```

    if ball.position.y <= ball.size.y / 2 // collision with ground

    ball.position.y = ball.size.y / 2

    ballVelocity = ballVelocity * -1 * bounciness

    ball.scale.y = max(0.5, 1 - 0.8) * abs(ballVelocity) / maxVelocity

    ball.scale.z = 1 + (ball.scale.y) / 2

    ball.scale.x = ball.scale.z

    ```


    Here, depending on the velocity of the ball, squash the ball on the y-axis, and
    to maintain the mass of the ball, expand the ball on the x and z axes.


    After the ball hits the ground and starts to head back up, you will need to gradually
    scale it, so add the following:


    ```

    if ball.scale.y < 1 {

    let change: Float = 0.07

    ball.scale.y +=

    ball.scale.z -= change / 2

    ball.scale.x = ball.scale.z

    if ball.scale.y > 1 {

    ball.scale = [1, 1, 1]

    }

    }

    ```'
