  md: 'After the for loop, add this to set the two inside tessellation factors to
    be an average of the total tessellation for the patch:


    ```

    factors[pid].insideTessellationFactor[0] = totalTessellation * 0.25;

    factors[pid].insideTessellationFactor[1] = totalTessellation * 0.25;

    ```


    Lastly, you need to revise some of the default render pipeline state tessellation
    parameters.


    In Renderer.swift, in buildRenderPipelineState(), add this before creating the
    pipeline state:


    ```

    // 1

    descriptor.tessellationFactorStepFunction = .perPatch

    // 2

    descriptor.maxTessellationFactor = Renderer.maxTessellation

    // 3

    descriptor.tessellationPartitionMode = .fractionalEven

    ```


    +   1. The step function was previously set to a default .constant, which sets
    the same edge factors on all patches. By setting this to .perPatch, the vertex
    function uses each patch''s edge and inside factors information in the tessellation
    factors array.

    2. You set the maximum number of segments per patch for the tessellator.

    3. The partition mode describes how these segments are split up. The default is
    .pow2, which rounds up to the nearest power of two. Using .fractionalEven, the
    tessellator rounds up to the nearest even integer, so it allows for much more
    variation of tessellation.


    Build and run, and zoom your patches. As you reposition the patches, the tessellator
    recalculates its distance from the camera and tessellates accordingly. Tessellating
    is a neat superpower!


