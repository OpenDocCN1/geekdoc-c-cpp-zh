  md: '# Rasterized Water


    From this point on, and until the end of the chapter, you''ll work on adapting
    an exemplary algorithm for creating realistic water developed by Michael Horsch
    in 2005 (for more information, see references.markdown). This realistic water
    algorithm is purely based on lighting and its optical properties, as opposed to
    having a water simulation based on physics.


    Here''s the plan on how you''ll proceed:


    +   1. Create a horizontal quad that will be the surface of the water.

    2. Render the scene to a reflection texture.

    3. Use a clipping plane to limit what geometry you render.

    4. Distort the reflection using a normal map to create ripples on the surface.

    5. Render the scene to a refraction texture.

    6. Apply the Fresnel effect so that the dominance of each texture will change
    depending on the viewing angle.

    7. Add smoothness to the water depth visibility using a depth texture.


