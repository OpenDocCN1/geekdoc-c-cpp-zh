  md: '# Clip space


    The main reason for doing all this math is to turn a three-dimensional scene with
    perspective into a two-dimensional scene. Clip space is a cube that is ready for
    flattening.


    ![](img/8d763acb335ab213ea9213a628f7d844_99_0.png)


    > Note: If you want to render engineering drawings, for example, you might use
    orthographic or isometric projection instead of perspective projection.


    # NDC space


    Projection into clip space creates a half cube of w size. During rasterization,
    the GPU will convert the w into normalized coordinate points between -1 and 1
    for the x-axis and y-axis and 0 and 1 for the z-axis.


    # Screen space


    Now that the GPU has a normalized cube, it will flatten clip space and convert
    into screen coordinates ready to display on the device''s screen.


    In this image, the dog is the same size as the cat, but it''s further away from
    the camera.


    ![](img/8d763acb335ab213ea9213a628f7d844_99_1.png)'
  merge: -1
