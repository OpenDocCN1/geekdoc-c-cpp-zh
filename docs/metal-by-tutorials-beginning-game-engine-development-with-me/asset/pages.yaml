  md: '# 2. Update the shader attributes


    In Shaders.metal, the vertex function vertexIn parameter uses the stage_in attribute
    which relies on the vertex descriptor layout. By simply updating VertexStruct
    with the new texture coordinate attribute, the vertex function will read in the
    texture data.


    Add this to struct VertexIn:


    ```

    float2 uv [[ attribute(UV) ]];

    ```


    This matches your previous entry in the vertex descriptor attributes.


    You''ll also need to pass along these coordinates to the fragment function. Add
    this to struct VertexOut:


    ```

    float2 uv;

    ```


    In vertex_main(), set this variable at the end of the function before return out;


    ```

    out.uv = vertexIn.uv;

    ```


    As with all of the other values in VertexOut, the rasterizer will interpolate
    the correct UV coordinate for each fragment so the shader will read the appropriate
    value from the texture — that''s why you''re sending the UVs through the vertex
    shader and not straight to the fragment shader.


