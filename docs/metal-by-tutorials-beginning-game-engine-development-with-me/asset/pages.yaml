    With:


    ```

    renderEncoder.setBytes(&matrix,

    length: MemoryLayout<float4x4>.stride, index: 1)

    ```


    Here, you''re sending the matrix to the vertex function definition


    In Shaders.metal, change the vertex function definition to:


    ```

    vertex VertexOut vertex_main(constant float3 *vertices [[ buffer(0) ]],

    constant float4x4 &matrix [[ buffer(1) ]],

    uint id [[ vertex_id ]])

    ```


    This will receive your matrix into your vertex function via buffer index 1.


    Replace:


    ```

    vertex_out.position = float4(vertices[id], 1);

    ```


    With:


    ```

    vertex_out.position = matrix * float4(vertices[id], 1);

    ```


    This is where you multiply each vertex by the transformation matrix.'
