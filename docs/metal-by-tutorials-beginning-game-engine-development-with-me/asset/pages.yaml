  md: '# Ambient occlusion maps


    Ambient occlusion is a technique that approximates how much light should fall
    on a surface. If you look around you — even in a bright room — where surfaces
    are very close to each other, they''re darker than exposed surfaces. In Chapter
    19, "Advanced Shadows", you''ll learn how to generate global ambient occlusion
    using ray marching, but assigning pre-built local ambient occlusion maps to models
    is a fast and effective alternative.


    Apps as Substance Painter can examine the model for proximate surfaces and produce
    an ambient occlusion map. This is the AO map for the car, which is included in
    the starter project:


    ![](img/8d763acb335ab213ea9213a628f7d844_351_0.png)


    The white areas on the left, with a color value of 1.0, are UV mapped to the car
    paint. These are fully exposed areas. When you multiply the final render color
    by 1.0, it''ll be unaffected. However, you can identify the wheel at the bottom
    right of the AO map, where the spokes are recessed. These areas have a color value
    of perhaps 0.8, which darkens the final render color.


    The ambient occlusion map is all set up in the starter project and ready for you
    to use. In fragment_IBL, just before the final return, add this:


    ```

    color *= ambientOcclusion;

    ```'
