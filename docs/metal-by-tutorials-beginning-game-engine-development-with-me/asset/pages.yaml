    As you see, models have various requirements. Some models need a color texture;
    some models need a roughness texture; and some models need normal maps. It''s
    up to you to check conditionally in the fragment function there are textures or
    constant values. You also don''t want to be sending spurious textures to the fragment
    function if your models do not use textures. You can fix this dilemma with **function
    constants.**


    # Function specialization


    Over the years there has been much discussion about how to render different materials.
    Should you create separate fragment shaders for the differences? Or should you
    have one long "uber" shader with all of the possibilities listed conditionally?
    Function specialization deals with this problem, and allows you to create one
    shader that the compiler turns into separate shaders.


    When you create the model''s pipeline state, you set the Metal functions in the
    Metal Shading library, and the compiler packages them up. At this stage, you can
    create booleans to indicate whether your model''s submesh material requires particular
    textures. You can then pass these booleans to the Metal library when you create
    the shader functions. The compiler will then examine the functions and generate
    specialized versions of them.'
