- img_proc: true
  md: '# Metal by Tutorials


    Analyze the percentages for each GPU activity. A high number might indicate an
    opportunity for performance optimization.


    Looking at the various GPU activities and their percentages, notice how the ALU
    took 31.99% of the total shader time processing the various types and calculations
    involving them.


    Here''s the first opportunity for optimization using shader profiling. Notice
    that processing floats seems to take more time than processing other types. As
    you might know, a half is well, half the size of a float, so you can optimize
    this one.


    Change all of the floats to halves everywhere in the fragment shader, as well
    as in the sunlight definition above the fragment shader.


    When done, Reload Shaders. The pie chart will also update in real time, as well
    as the Attachments content if you also have the assistant editor open.


    ![](img/8d763acb335ab213ea9213a628f7d844_427_0.png)


    Well, look at that! Now you eliminated the cost of processing Floats, but you
    also reduced the shader execution time from 8.17ms to 7.35ms (almost 1ms).


    Great job for some effort!


    Other ALU optimizations you can does replacing ints with shorts, simplifying complex
    instructions such as trigonometry functions (sin, cos, etc.) and other arithmetic
    calculations.


    Next, you can look into Synchronization issues. The biggest concern here is the
    Wait Memory time which is taking a quarter of all the shader time (24.80%).


    This is happening because some instructions are waiting for dependent memory accesses
    that take place in previous instructions.


    The sample() function is a good candidate for this bottleneck because the mix()
    function heavily depends on it. You''ll deal with synchronization later in the
    chapter.'
