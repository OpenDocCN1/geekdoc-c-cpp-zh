    You’ve now loaded all of the joints’ individual positions and rotations in their
    own joint space. To create a matrix that you can re-position the vertices in the
    vertex function during the render, it’s time to take into account the position
    and rotation of the joint in the bind pose in model space.


    # # The inverse bind pose


    The glTF importer imports an inverse bind matrix for each joint. This matrix transforms
    vertices into the local joint space.


    ![](img/8d763acb335ab213ea9213a628f7d844_232_0.png)


    When all the joint transforms are set to identity, that’s when you’ll get the
    bind pose. If you apply the inverse bind matrix to each joint, it will move to
    the origin. The following image shows the skeleton’s joints all multiplied by
    the inverse bind pose:


    ![](img/8d763acb335ab213ea9213a628f7d844_232_1.png)'
