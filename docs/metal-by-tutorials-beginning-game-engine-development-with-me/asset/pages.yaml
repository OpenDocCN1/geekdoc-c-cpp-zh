  md: "In Shaders.Metal, add the fragment function to the end of the file:\n\n```\n\
    fragment float4 fragment_main() {\n    return float4(1, 0, 0, 1);\n}\n\n```\n\n\
    This is the simplest fragment function possible. You return the interpolated color\
    \ red in the form of a float4. All the fragments that make up the cube will be\
    \ red.\n\nThe GPU takes the fragments and does a series of post-processing tests:\n\
    \n+   - alpha-testing determines which opaque objects are drawn and which are\
    \ not based on depth testing.\n\n+   - In the case of translucent objects, alpha-blending\
    \ will combine the color of the new object with that already saved in the color\
    \ buffer.\n\n+   - scissor testing checks whether a fragment is inside of a specified\
    \ rectangle; this test is useful for masked rendering.\n\n+   - stencil testing\
    \ checks how the stencil value in the framebuffer where the fragment is stored,\
    \ compares to a specified value we choose.\n\n+   - In the previous stage early-Z\
    \ testing ran now a late-Z testing is done to solve visibility issues; stencil\
    \ and depth tests are also useful for ambient occlusion and shadows.\n\n+   -\
    \ Finally, antialiasing is also calculated here that final images that get to\
    \ the screen do not look jagged.\n\nYou will learn more about post-processing\
    \ tests in Chapter 10, \"Fragment Post-Processing.\"\n\n# 6 - Framebuffer\n\n\
    As fragments have been processed into pixels the Distributor unit sends them to\
    \ the Color Writing unit. This unit is responsible for writing the final color\
    \ in a special memory location called the framebuffer. From here, the view gets\
    \ its colored pixels refreshed every frame. But that means the color is to the\
    \ framebuffer while being displayed on the screen?\n\nA technique called double-buffering\
    \ is used to solve this situation. While the first buffer is displayed on the\
    \ screen, the second one is updated in the background. Then, the two buffers are\
    \ swapped, and the second one is displayed on the screen while the first one is\
    \ updated, and the cycle continues."
