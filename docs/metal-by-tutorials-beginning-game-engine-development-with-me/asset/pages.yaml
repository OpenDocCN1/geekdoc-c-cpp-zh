  md: '# Coordinate spaces


    Now that you know about matrices, you''ll be able to convert models and entire
    scenes between different coordinate spaces. Coordinate spaces map different coordinate
    systems, and by multiplying a vertex by a particular matrix, you can convert the
    vertex to a different space.


    A vertex on its trip through the pipeline will pass through (usually) six spaces:


    +   - Object space

    - World space

    - Camera space

    - Clip space

    - NDC (Normalized Device Coordinate) space

    - Screen space


    This is starting to sound like a description of Voyager leaving our solar system,
    so take a closer conceptual look at each space.


    # Object space


    You may be familiar with Cartesian coordinates from your graphing days. This image
    is a 2D grid showing possible vertices mapped out in Cartesian coordinates.


    ![](img/8d763acb335ab213ea9213a628f7d844_97_0.png)


    The positions of these vertices are in relation to the origin of the dog, which
    is at (0,0). They are in what''s called object space (or local or model space).'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# World space


    In the following picture, the direction arrows mark the origin. This is the center
    of world space at (0, 0, 0). In world space, the dog is at (1, 0, 1) and the cat
    is at (-1, 0, -2).


    ![](img/8d763acb335ab213ea9213a628f7d844_98_0.png)


    However, cats are always the center of their universe, so in cat space, the cat
    thinks that he is at (0, 0, 0). This would make the dog''s position relative to
    the cat (2, 0, 3). When the cat moves, in his universe he is always at (0, 0,
    0) and the position of everything else in the world changes relative to the cat.


    > Note: Cat space is not recognized as a traditional 3D coordinate space, but
    mathematically, you can create your own space and use any position in the universe
    as the origin. Every other point in the universe is now relative to that origin.
    In a later chapter, you''ll discover other spaces beside the ones described here.


    # Camera space


    For the dog, the center of his universe is the person holding the camera behind
    the picture. In camera space, the camera is at (0, 0, 0), and the dog is approximately
    (-3, -2, 8). When the camera moves, it stays at (0, 0, 0), but the positions of
    the dog and cat move relative to the camera.'
  merge: -1
