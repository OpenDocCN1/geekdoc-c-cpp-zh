    \ https://developer.apple.com/documentation/scenekit/scnprogram\n\nYour shader\
    \ has to multiply the vertex by the current model-view-projection matrix. You\
    \ can access this and other transform data by declaring a struct and binding it\
    \ to [[buffer(1)].\n\nAdd this new struct:\n\n```\nstruct Uniforms {\n    float4x\
    \ modelViewProjectionTransform;\n};\n```\n\nAdd the struct containing the data\
    \ that you'll output from the vertex shader and input to the fragment shader:\n\
    \n```\nstruct VertexOut {\n    float4 position [[position]];\n};\n```\n\nAdd the\
    \ vertex function:\n\n```\nvertex VertexOut shipVertex(VertexIn in [[stage_in]],\n\
    \    constant Uniforms& uniforms [[buffer(1)]]) {\n    VertexOut out;\n    out.position\
    \ = uniforms.modelViewProjectionTransform * in.position;\n    return out;\n}\n\
