  md: '# Rendering the skybox


    Your project should now compile.


    Still in Skybox.swift, create a new method to perform the skybox rendering:


    ```

    func render(encoder: MTLRenderCommandBuffer, uniforms: Uniforms) {

    }

    ```


    Add these render encoder commands to the new method:


    ```

    renderEncoder.pushDebugGroup("Skybox")

    renderEncoder.setPipelineState(pipelineState)

    // renderEncoder.setDepthStencilState(depthStencilState)

    renderEncoder.setVertexBuffers(mesh.vertexBuffers[0]).buffer,

    offset: 0, index: 0)

    ```


    Here, you set up the render encoder with all the properties you initialized. Leave
    the depth stencil line commented out for the moment.


    After this code, set your uniforms:


    ```

    var viewMatrix = uniforms.viewMatrix

    viewMatrix.columns.3 = [0, 0, 0, 1]

    var viewProjectionMatrix = uniforms.projectionMatrix * viewMatrix

    renderEncoder.setBytes(viewProjectionMatrix,

    length: MemoryLayout<float4x>.stride,

    index: 1)

    ```


    As a reminder, when you render a scene, you multiply each model''s matrix with
    the view matrix and the projection matrix. When you move through the scene, it
    appears as the camera is moving around the scene, but in fact, the scene is moving
    around the camera. You don''t want the skybox to move, so you zero out column
    3 of viewMatrix to remove the camera''s translation.


    However, you do still want the skybox to rotate with the rest of the scene, and
    also render with projection, so you multiply the view and projection matrices
    and send them to the GPU.


    Following the previous code, do the draw:


    ```

    let submesh = mesh.meshes[0]

    renderEncoder.drawIndexedPrimitives(type: triangle,

    indexCount: submesh.indexCount,

    indexType: submesh.indexType,

    indexBuffer: submesh.indexBuffer,

    indexBufferOffset: 0)

    ```'
