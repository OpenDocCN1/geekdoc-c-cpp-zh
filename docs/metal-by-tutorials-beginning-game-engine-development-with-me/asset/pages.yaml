- img_proc: true
  md: '# Converting between spaces


    You may have already guessed it: you use transformation matrices to convert from
    one space to another.


    For example, in the following image, the vertex on the dog''s ear, was (-1, 4,
    0) in object space, now, looking at the picture, at about (0.75, 1.5, 1) in world
    space.


    ![](img/8d763acb335ab213ea9213a628f7d844_100_0.png)


    To move the dog vertices from object space to world space, using a transformation
    matrix, you''d translate (move) them, and scale them down.


    There are four spaces that you control, so there are three corresponding matrices
    that you''ll shortly construct:


    | Object space | Model matrix | World space | View matrix | Camera space | Projection
    matrix | Clip space |


    +   - model matrix: between object and world space

    * view matrix: between world and camera space

    * projection matrix: between camera and clip space


    # Coordinate systems


    Different graphics APIs use different systems. You already found out that Metal''s
    NDC (Normalized Device Coordinates) use 0 to 1 on the z-axis. You may already
    be familiar with OpenGL, which uses 1 to -1 on the z-axis.


    In addition to being a different size, OpenGL''s z-axis points in the opposite
    direction from Metal''s z-axis. OpenGL''s system is called a right-handed coordinate
    system, and Metal''s is a left-handed coordinate system.'
