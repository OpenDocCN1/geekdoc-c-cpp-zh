    # # Procedural systems


    With the techniques you''ve learned so far, you have the power to load random
    objects into your scene and make each scene unique. However, you''re currently
    limited to having a single mesh size. In games such as No Man''s Sky, each planet
    and all of the animals that you meet on the planets are procedurally generated
    using many different meshes.


    Procedural generation essentially means that you send a system some random parameters,
    such as integers or even noise, and the system generates a new and unique model
    or game level.


    In this section, you''ll use a similar technique to procedural animal generation
    in No Man''s Sky and create a house system consisting of a row of houses.


    ![](img/8d763acb335ab213ea9213a628f7d844_376_1.png)'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'Metal by Tutorials | Chapter 13: Instancing & Procedural Generation


    Each house will have a random number of floors, and each floor will use a random
    model. However, even though the system might use a floor model or a roof model
    several times in different houses, for better efficiency, there will only be one
    instance of the model geometry.


    # Rules


    The secret to procedural systems is having a set of rules. For example, if you''re
    procedurally generating animals out of multiple parts, you don''t want to be attaching
    heads to leg joints; this isn''t The Island of Doctor Moreau after all.


    ![](img/8d763acb335ab213ea9213a628f7d844_377_0.png)


    So, in this case, you''d have a rule that heads only attach to head joints.


    Your houses will consist of a first (ground) floor, middle floors and an optional
    roof. The rules for the house system are:


    +   - First floors are a ground model.

    - Roofs are only on the top floor.

    - Maximum number of floors.

    - Minimum and maximum gap between the houses.

    - Maximum number of houses.


    These are the models for each floor type, created by Kenney at https://kenney.nl:


    ![](img/8d763acb335ab213ea9213a628f7d844_377_1.png)


    raywenderlich.com | 378'
