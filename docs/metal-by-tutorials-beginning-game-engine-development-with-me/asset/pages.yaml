- img_proc: true
  md: '# Section I: The Player


    It takes a wealth of knowledge to render a simple triangle on the screen or animate
    game characters. This section will guide you through the necessary basics of vertex
    wrangling, lighting, textures and character animation; and if you''re worried
    about the math, don''t be! Although computer graphics is highly math-intensive,
    each chapter explains everything you need, and you''ll get experience creating
    and rendering models.


    Specifically, you''ll learn:


    +   - Chapter 1: Hello Metal!: This is a quick start overview to Metal. Create
    a render of a red ball in a playground that touches on everything you need to
    render a model. Metal is a complex API, so don''t worry if everything isn''t immediately
    crystal clear. Later chapters will expand on each concept introduced.


    +   - Chapter 2: 3D Models: 3D assets are what makes your game stand out from
    all the others. Whether your game style is simple cuboids or detailed animated
    zombies, you should understand how 3D models are put together. Explore Blender
    and see how to reshape models by moving vertices, and recolor them by adding materials.


    +   - Chapter 3: The Rendering Pipeline: Find out how the GPU works and discover
    all the stages in the graphics pipeline. You''ll find out what parts of the pipeline
    are hard-wired and what parts you can control with shader functions.


    +   - Chapter 4: Coordinate Spaces: Understanding of vectors and metrics is critical
    to positioning all scenery and characters in your game. Take your game into the
    third dimension with projection matrices.


    +   - Chapter 5: Lighting Fundamentals: The Phong lighting model is an easy entry
    into understanding how you can add lighting effects. Color each individual pixel
    of your rendered models by exploring light and shade.


    +   - Chapter 6: Textures: Make your models more detailed by wrapping them in
    a texture. These textures can be realistic using photo imagery, or hand-painted
    in a paint program. Once you have a few hundred models in your game with thousands
    of textures, you will appreciate what the asset catalog can do for you.'
  merge: -1
