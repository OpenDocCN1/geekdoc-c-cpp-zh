  md: '# # Chapter 10: Fragment Post-Processing


    By Marius Horga


    Before embarking on complex complex features like tessellation and instancing,
    it’s best to start with simple techniques to improve your render quality. After
    the fragments have been processed in the pipeline, a series of operations run
    on the GPU. These operations are sometimes referred to as [Per-sample Processing](https://www.khronos.org/opengl/wiki/Per-Sample_Processing),
    and include: Alpha testing; Depth testing; Stencil testing; Scissor testing; Blending;
    and Anti-aliasing.


    As you go through this chapter, you’ll learn most of these.


    # ## Getting started


    In the projects directory for this chapter, open the starter playground. Then,
    run the playground and you’ll see this image:


    ![](img/8d763acb335ab213ea9213a628f7d844_272_0.png)'
