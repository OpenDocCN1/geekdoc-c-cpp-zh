  md: 'You also know from Chapter 5, "Lighting Fundamentals," that to calculate diffuse
    light, you need to take the dot product of two vectors: the direction of light
    and the surface normal. If that did not make you say "A-ha!" then take another
    look at this line:


    ```

    float3 sunlight = normalize(in.worldNormal);

    ```


    Change the previous line to:


    ```

    float3 normal = normalize(in.worldNormal);

    ```


    Then, update this line:


    ```

    float diffuseIntensity = saturate(dot(lightDirection, sunlight));

    ```


    To use the proper vector:


    ```

    float diffuseIntensity = saturate(dot(lightDirection, normal));

    ```


    Click Reload Shaders on the debug bar and review the result:


    ![](img/8d763acb335ab213ea9213a628f7d844_420_0.png)


    The diffuse intensity is now properly calculated and contributing to the light
    in the scene. Look at the main app window to see:'
