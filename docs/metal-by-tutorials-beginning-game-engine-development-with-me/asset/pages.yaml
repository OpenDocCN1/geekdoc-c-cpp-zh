  md: '# Where to go from here?


    This chapter took you through the basics of character animation. But don''t stop
    here! There are so many different topics that you can investigate. For instance,
    you can:


    +   - Learn how to animate your characters in Blender and import them into your
    renderer. Start off with a simple robot arm, and work upward from there.


    +   - Examine the glTF importer. Writing an importer gives you a better understanding
    of the parts that make up the model and animation. Kronos has an excellent specification
    and instructions; there are links in references.markdown in the Resources folder
    for this chapter.


    +   - Watch Disney and Pixar movies... call it research. . No, seriously! Animation
    is a skill all of its own. Watch how people move; good animators can capture personality
    in a simple walk cycle.


    Congratulations, you reached the end of the first section, and you now have a
    rendering engine in which you can render props and characters. Sweet!


    In the next section, you''ll move on to creating a game engine where you can build
    game scenes with their own logic. You''ll also discover how to improve your scenes
    environments with terrains and skyboxes. Then, you''ll examine alternative lighting
    methods and how to improve performance and use every millisecond available.'
