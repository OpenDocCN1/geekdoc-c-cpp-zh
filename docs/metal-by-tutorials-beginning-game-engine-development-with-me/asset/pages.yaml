  md: '# # Chapter 1: Hello, Metal!


    By Caroline Begbie & Marius Horga


    You''ve been formally introduced to Metal and discovered its history and why you
    should use it. Now you''re going to try it out for yourself in a Swift playground.
    To get started, you''re going to render this sphere on the screen:


    ![](img/8d763acb335ab213ea9213a628f7d844_26_0.png)


    It may not look exciting, but this is a great starting point because it lets you
    touch on every part of the rendering process. But before you get started, it''s
    important to understand the terms **rendering** and **frames**.'
  merge: -1
