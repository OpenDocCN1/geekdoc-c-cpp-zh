    By Caroline Begbie


    Everything you see on your device''s screen, from the characters you type to the
    digital art you admire, is under the surface all math.


    We''d all love to be math geniuses, but some of us lost the opportunity early
    in life. Fortunately, to use math, you don''t always have to know what''s under
    the hood. In this chapter, you''re going to become a matrix master, and you''ll
    learn matrices can do for you and how to manipulate them painfully.


