    # Alignment


    **Alignment** is the last of the three steering behaviors Reynolds used for his
    flocking simulation. The main idea is to calculate an average of the velocities
    for a limited number of neighbors. The resulting average is often referred to
    as the *desired velocity*.


    With alignment, a steering force gets applied to the current boid''s velocity
    to make it align with the group.


    ![](img/8d763acb335ab213ea9213a628f7d844_482_1.png)


    To get this working, add two global constants:


    ```

    constant float neighbors = 8;

    constant float alignmentWeight = 3.0;

    ```


