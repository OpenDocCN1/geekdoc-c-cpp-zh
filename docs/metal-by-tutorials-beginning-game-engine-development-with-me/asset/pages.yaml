- img_proc: true
  md: "The edge factors specify how many segments an edge will be split into. An edge\
    \ factor of 2 has two segments along the edge. For the inside factors, look at\
    \ the horizontal and vertical centers. In this example, the horizontal center\
    \ has eight segments, and the vertical center has sixteen.\n\nAlthough only four\
    \ control points (shown in red) went to the GPU, the hardware tessellator a lot\
    \ more vertices. However, creating more vertices on a flat plane doesn't make\
    \ the render any more interesting.\n\nLater, you'll find out how to move these\
    \ vertices in the vertex function to make a bumpy terrain. First, you'll discover\
    \ how to tessellate a single patch.\n\nIn Renderer.swift, in Renderer, create\
    \ a constant for the number of patches you're going to create, in this case, one:\n\
    \n```\nlet patches = (horizontal: 1, vertical: 1)\nvar patchCount: Int {\n   \
    \ return patches.horizontal * patches.vertical\n}\n```\n\npatchCount is a convenience\
    \ property that returns the total number of patches.\n\nSet up the edge and inside\
    \ factors as Float array properties:\n\n```\nvar edgeFactors: [Float] = [4]\n\
    var insideFactors: [Float] = [4]\n```\n\nThese variables indicate four segments\
    \ for edges along each edge, and four in the middle.\n\nYou can specify different\
    \ factors for different edges by adding them to the array. For each patch, the\
    \ GPU processes these edge factors and places the amount to tessellate into a\
    \ buffer.\n\nCreate a lazy property to produce a buffer of the current length:\n\
    \n```\nlazy var tessellationFactorsBuffer: MTLBuffer? = {\n    // 1\n    let count\
    \ = patchCount * (4 + 2)\n    // 2\n    let size = count * MemoryLayout<Float>.size\
    \ / 2\n    return Renderer.device.makeBuffer(length: size,\n        options: .storageModePrivate)\n\
    }()\n```\n\n+   1. This is the number of patches multiplied by the four edge factors\
    \ and two inside factors."
