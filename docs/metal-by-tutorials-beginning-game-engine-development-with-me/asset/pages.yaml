  md: 'Photoshop, naturally, is not the only solution for texturing a model. You can
    use any image editor for painting on a flat texture. In the last few years, several
    other apps that allow painting directly on the model have become mainstream:


    +   - Blender (free)


    +   - Substance Designer and Substance Painter by Allegorithmic ($$): In Designer,
    you can create complex materials procedurally. Using Painter, you can paint these
    materials on the model. The yellow house you''ll encounter in the next chapter
    was textured in Substance Painter.


    +   - 3DCat by 3Dcoat ($$)


    +   - Mudbox by Autodesk ($$)


    +   - Mari by Foundry ($$$)


    In addition to texturing, using Blender, 3Dcoat or Mudbox, you can sculpt models
    in a similar fashion to ZBrush and create low poly models from the high poly sculpt.


    As you''ll find out in the next chapter, color is not the only texture you can
    paint using these apps, so having a specialized texturing app is invaluable.


