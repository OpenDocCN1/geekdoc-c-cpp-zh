  md: 'It would be more efficient to render a quad onto the screen and the blending
    during the quad''s fragment shader. However, Core Image, with its huge number
    of filters, gives you great flexibility in how your final scene looks. These Core
    Image filters use Metal Performance Shaders under the hood, so they are blazing
    fast.


    > Note: The Core Image Filter reference lists all the filters: https://developer.apple.com/library/mac/documentation/GraphicsImaging/Reference/CoreImageFilterReference/index.html.
    Each of the filters shows the parameters you can use with it.


    First, you''ll see how it is to render your scene as a cartoon in real time.

    HudNode.swift, in postProcess(inputTexture:), replace with:


    ```

    guard let commandBuffer = Renderer.commandBuffer else { return }

    let drawableImage = CIImage(mtlTexture: inputTexture)

    ```


    Add the Image filter you want to:


    ```

    let filter = CIFilter(name: "CIComicEffect")

    filter.setValue(drawableImage, forKey: kCIInputImageKey)

    let outputImage = filter.outputImage

    ```


    CIComicEffect will detect edges and render a half-tone effect. There''s only one
    parameter for CIComicEffect: the input set. The input image on the filter and
    extract the output image.


    outputImage is of type CIImage, so you need to render it to a new MTLTexture before
    you can use it in your renderer.


    So that you don''t have the overhead of creating a new MTLTexture every frame,
    create a new property in HudNode for this texture:


    ```

    var outputTexture: MTLTexture

    ```


    In init(size:), before calling super.init(), use RenderPass''s type method to
    create the texture:


    ```

    outputTexture = RenderPass.buildTexture(size: size,

    label: "output texture",

    pixelFormat: renderPass.texture.pixelFormat,

    usage: [.shaderWrite])

    ```


    The size of this texture will change when the view changes size, so repeat this
    line in sceneSizeWillChange(to:).


    ![](img/8d763acb335ab213ea9213a628f7d844_629_0.png)'
  merge: -1
  pgno: 629
- img_proc: true
  md: '# Metal by Tutorials


    # Chapter 22: Integrating SpriteKit & SceneKit


    Back at the end of postProcess, create a CIContext and render outputImage to your
    new outputTexture. Add this:


    ```

    let context = CIContext(mtDevice: Renderer.device)

    let colorSpace = CGColorSpaceCreateRGB(

    context.render(outputImage, to: outputTexture,

    commandBuffer: commandBuffer,

    bounds: outputImage.extent,

    colorSpace: colorSpace)

    ```


    If you specify nil for the commandBuffer, the context will create its own command
    buffer. In this situation, you''re in the middle of a frame renderer, so ensure
    that you use the current command buffer in Renderer.


    To see outputTexture on the screen, blit the texture to the view''s drawable.
    Add this to the end of postProcess(inputTexture):


    ```

    let blitEncoder = commandBuffer.makeBlitCommandEncoder())

    let origin = MTLOrigin(x: 0, y: 0, z: 0)

    let size = MTLSize(width: inputTexture.width, height:

    inputTexture.height, depth: 1)

    blitEncoder.copy(from: outputTexture, sourceSlice: 0, sourceLevel: 0,

    to: inputTexture, sourceSize: size,

    inputTexture: origin, destinationSlice: 0,

    destinationLevel: 0, destinationOrigin: origin)

    blitEncoder.endEncoding()

    ```


    You''ve created a few blit encoders along the way, and there''s nothing new here.
    You blit outputTexture to inputTexture.


    Build and run, and you''ll get a runtime error:


    ```

    frameBufferOnly not supported for compute

    ```


    This means that you haven''t set the view''s current drawable texture to be writable.
    For efficiency, Metal sets up as read-only by default. However, if you''re really
    sure you want to write to the drawable, even if it slows down, then you


    can. In Renderer.swift, in init(metalView), add this:


    ```

    metalView.frameBufferOnly = false

    ```


    raywenderlich.com


    631'
