    # Importing the asset


    One major problem to overcome is how to import animation from 3D apps. In Chapter
    2, "3D Models," you learned about various file types. A popular up-and-coming
    export format developed by the Kronos Group is glTF (GL Transmission Format).
    Kronos opened the source format so that anyone can use it in their engines. http://www.sketchfab.com
    is a major provider and showcase of 3D models; all of their downloadable models
    are available in the glTF format.


    glTF is the format that you will use to import animations from Blender.


    > Note: To export animated models using glTF and Blender, you''ll need to install
    Blendergtf from https://github.com/Kupoman/blendergtf. Follow the installation
    instructions given.


    # The glTF file format


