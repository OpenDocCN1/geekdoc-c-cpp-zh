    # Specular reflection


    The irradiance map provides the diffuse and ambient reflection, but the specular
    reflection is a bit more difficult.


    You may remember from Chapter 5, "Lighting Fundamentals," that whereas the diffuse
    reflection comes from all light directions, specular reflection depends upon the
    angle of view and the roughness of the material.'
