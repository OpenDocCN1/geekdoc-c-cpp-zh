  md: '# Shading by slope


    The snow line in your previous render is unrealistic. By checking the slope of
    the mountain, you can show the texture in flatter areas, and show the cliff texture
    where the slope is steep.


    An easy way to calculate slope is to run a Sobel filter on the height map. A Sobel
    filter is an algorithm that looks at the gradients between neighboring pixels
    in an image. It’s useful for edge detection in computer vision and image processing,
    but in this case, you can use the gradient to determine the slope between neighboring
    pixels.


    # Metal Performance Shaders


    The Metal Performance Shaders framework contains many useful, highly optimized
    shaders for image processing, matrix multiplication, machine learning and raytracing.
    You’ll read more about them in Chapter 21, "Metal Performance Shaders."


    The shader you’ll use here is MPSImageSobel which takes a source image texture
    and outputs the filtered image into a new grayscale texture. The whiter the pixel,
    the steeper the slope.


    > Note: In the challenge for this chapter, you’ll use the Sobel-filtered image,
    and apply the textures to your mountain depending on slope.


    At the top of Renderer.swift, import the Metal Performance Shaders framework:


    ```

    import MetalPerformanceShaders

    ```


    Create new method to process the height map:


    ```

    static func heightToSlope(source: MTLTexture) -> MTLTexture {

    }

    ```


    Next, you’ll send the height map to this method and return a new value. To create
    the new texture, you first need to create a texture descriptor where you can assign
    the size, pixel format and tell the GPU how to use the texture.


    Add this to heightToSlope(source:):


    ```

    let descriptor = MTLTextureDescriptor.texture2DDescriptor(pixelFormat:

    source.pixelFormat,

    width:source.width,

    height:source.height,

    ```'
