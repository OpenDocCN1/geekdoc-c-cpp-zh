  md: '# # Specular reflection


    Last, but not least, the specular reflection. Your train is starting to look great,
    but now you have a chance to put a coat of shiny varnish on it and make it spec(-tac)-ular.
    The specular highlight depends on the position of the observer. If you pass a
    shiny car, you''ll only see the highlight at certain angles.


    ![](img/8d763acb335ab213ea9213a628f7d844_135_0.png)


    The light comes in (L) and is reflected (R) about the normal (N). If the viewer
    (V) is within a particular cone around the reflection (R), then the viewer will
    see the specular highlight. That cone is an exponential shininess parameter. The
    shinier the surface, the smaller and more intense the specular highlight.


    In your case, the viewer is your camera so you''ll need to pass the camera coordinates,
    again in view position, to the fragment function. Earlier, you set up a cameraPosition
    in fragmentuniforms, and this is what you''ll use to pass the camera position.


    > Note: If you were using camera space for the light and vertex positions rather
    than world space, the camera position would be (0, 0, 0, 0).


    In Renderer.swift, in draw(in:), before uniforms.viewMatrix = camera.viewMatrix,
    add this:


    ```

    fragmentUniforms.cameraPosition = camera.position

    ```


    camera.position is already in world space, and you''re already passing fragmentUniforms
    to the fragment function, so you don''t need to take further action here.'
