    \    skin.jointMatrixPalette[i] = jointNode.globalTransform * \n      jointNode.globalTransform\
    \ * \n      jointNode.inverseTransform\n  }\n  let length = MemoryLayout<float4x>.stride\
    \ * \n    skin.jointMatrixPalette.count\n  let buffer = \n    Renderer.device.makeBuffer(bytes:\
    \ &skin.jointMatrixPalette,\n      length: length, options: [])\n  renderEncoder.setVertexBuffer(buffer,\
    \ offset: 0, index: 21)\n}\n```\n\nTo create the joint matrix palette for each\
    \ node, this method is using two computed properties on CharacterNode. You'll\
    \ find these in GLFTyypes.swift:\n\n+   - localTransform: Returns the transform\
    \ matrix consisting of translation, rotation and scale.\n- globalTransform: Returns\
    \ the transform of the node combined with all the parent nodes."
