  md: '# Sending constant data to shaders


    You''ve rendered a textured, unit model, but if you want to do lighting, then
    you have to set it yourself, with the usual light positions, model normals and
    lighting calculations. Although SceneKit keeps uniform values for the transformation
    matrices, you''ll have to send light constants to the shaders by setting a value
    on the material.


    In GameViewController.swift, in the conditional block where you set up the material,
    add this:


    ```

    let lightPosition = lightNode.position

    material.setValue(lightPosition, forKey: "lightPosition")

    ```


    lightNode.position is of type SVector3. SceneKit will convert this to a Metal
    float. If you need to send other data types, you can convert them to a Data type
    and pass that.


    In Shaders.metal, add this parameter to shipFragment:


    ```

    constant float3& lightPosition [[ buffer(0) ] ]

    ```


    Add the normal data to the vertex function. In VertexOut, add this:


    ```

    float3 normal;

    ```


    To transform the normal, you''ll need the inverse transpose of the model-view
    matrix. Fortunately, SceneKit provides this. Add this field to Uniforms:


    ```

    float4x4 normalTransform;

    ```


    Add the normal transform calculation to shipVertex, before return:


    ```

    out.normal = (scnNode.normalTransform * float4(in.normal, 0)).xyz;

    ```


    In shipFragment, replace the return line with:


    ```

    float diffuseIntensity = dot(normalize(in.normal),

    normalize(LightPosition);

    return half4(baseColor * diffuseIntensity);

    ```


    Build and run, and your jet is now shaded.


    Obviously, you didn''t go through all of this to work reproduce the SceneKit renderer
    does, but now you can send constants, textures, and do anything in the shader
    that you care to, like what you''re about to see.'
