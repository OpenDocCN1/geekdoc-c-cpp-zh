    # Scissor testing


    If you only want to render part of the screen, you can tell the GPU to only render
    within a particular rectangle. This is much more efficient than rendering the
    whole screen. The scissor test checks whether a fragment is inside a defined 2D
    area called the scissor rectangle. If a fragment falls outside of this rectangle,
    it''s discarded.


