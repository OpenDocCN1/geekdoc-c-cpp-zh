  md: "To transform Node into a hierarchical tree, you need to add parent and child\
    \ properties.\n\n![](img/8d763acb335ab213ea9213a628f7d844_245_0.png)\n\nOpen **Node.swift**\
    \ and add these properties to Node:\n\n```\nvar parent: Node?\nvar children: [Node]\
    \ = []\n```\n\nEach Node can now have a single parent Node and multiple child\
    \ Nodes.\n\nNext, add the following methods to handle adding and removing nodes\
    \ from the tree structure:\n\n```\nfinal func add(childNode: Node) {\n    children.append(childNode)\n\
    \    childNode.parent = self\n}\n\nfinal func remove(childNode: Node) {\n    for\
    \ child in childNode.children {\n        child.parent = self\n        children.append(child)\n\
    \    }\n    childNode.children = []\n    guard let index = (children.index {\n\
    \        $0 == childNode\n    }) else { return }\n    children.remove(at: index)\n\
    \    childNode.parent = nil\n}\n```"
