    | lowpoly-house-color.png | Texture 0 | 1024 × 1024 | BGRANorm(baseColorTexture)|

    | Fragment Bytes | Buffer (2) | 128 bytes [lights] | |

    | Fragment Bytes | Buffer (3) | 92 bytes [FragmentUniforms] | |

    | fragment_main | Fragment Function | | Library 0x5000017659c0 [Precompiled] |

    | Attachment | | | |

    | Texture 0x0125c9c0 | Color 0 | 2390 × 1394 | BGRANorm |

    | MTKView Depth | | 2390 × 1394 | Depth32Float


    Double-click on each vertex resource to see what''s in the buffer:


    +   - **MDL_OBJ_Indices**: The vertex indices.

    - **Buffer 0x0000000**: The vertex position, normal and texture coordinate data,
    matching the attributes of your VertexIn struct.

    - **Vertex Bytes**: The uniform matrices.

    - **Vertex Attributes**: The incoming data from VertexIn, and the VertexOut return
    data from the vertex function.

    - **vertex_main**: The vertex function. When you have multiple vertex functions,
    this is very useful to make sure that you''ve got the correct pipeline set state.

    - **lowpoly-house-color.png**: The house texture in texture slot 0.

    - **Fragment Bytes**: You have two of them: one holds the lights array, and the
    other holds the fragment uniforms count.

    - **fragment_main**: The fragment function.

    - **Texture 0x0000000**: The result of the encoding in color attachment 0. In
    this case, this is the view''s current drawable. Later, you''ll use multiple color
    attachments.

    - **MTKView Depth**: The depth buffer. Black is closer and white is farther. The
    farther rasterizer uses the depth map.


    You can see from this list that the GPU is holding the texture as BGR8Unorm.'
