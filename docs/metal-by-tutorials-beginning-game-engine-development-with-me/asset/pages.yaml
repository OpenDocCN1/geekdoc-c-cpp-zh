  md: '# Chapter 19: Advanced Shadows


    Now that you have normals, you can calculate lighting for each pixel in the scene.


    Create a new function named lighting():


    ```

    float lighting(Ray ray, float3 normal, Light light) {

    // 1

    float3 lightRay = normalize(light.position - ray.origin);

    // 2

    float diffuse = max(0.0, dot(normal, lightRay));

    // 3

    float3 reflectedRay = reflect(ray.direction, normal);

    float specular = max(0.0, dot(reflectedRay, lightRay));

    // 4

    specular = pow(specular, 200.0);

    return diffuse + specular;

    }

    ```


    Going through the code:


    +   1. Find the direction to the light ray by normalizing the distance between
    the light position and the current ray origin.

    2. For diffuse lighting, you need the angle between the normal and lightRay, that
    is, the dot product of the two. Also, make sure you''re never using negative values
    by making 0 always the minimum value possible.

    3. For specular lighting, you need reflections on surfaces, and they depend on
    the angle you''re looking at. You first cast a ray into the scene, reflect it
    from the surface, and measure the angle between the reflected ray and LightRay.

    4. Finally, take a high power of that value to make it much sharper and return
    the combined light.


