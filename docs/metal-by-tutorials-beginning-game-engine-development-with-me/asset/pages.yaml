- img_proc: true
  md: "Along the way, you'll work through:\n\n+   * Hard shadows.\n* Soft shadows.\n\
    * Ambient Occlusion.\n* Percentage Closer Filtering.\n\nRasterization does not\
    \ excel at rendering shadows and light because there's no geometry that a vertex\
    \ shader could precisely process. So now you'll learn how to do it differently.\n\
    \nTime to conjure your raymarching skills from the previous chapter, and use them\
    \ to create shadows.\n\n# Hard shadows\n\nIn this section, you'll create shadows\
    \ using raymarching instead of using a shadow map like you did in Chapter 14,\
    \ \"Multipass and Deferred Rendering\". A shadow map is a non real-time tool that\
    \ requires you to bake the shadows in a previous pass.\n\nWith raymarching, you're\
    \ making use of signed distance fields (SDF). An SDF is a real-time tool that\
    \ provides you with the precise distance to a boundary.\n\nThis makes calculating\
    \ shadows as easy as they come for \"free\", meaning all of the information you\
    \ need to compute shadows already exists and is available because of SDF.\n\n\
    The principle is common to both rendering methods: If there's an occlud between\
    \ the light source and the object, the object is in the shadow; otherwise, it's\
    \ lit.\n\nGreat! Time to put that down in code.\n\nOpen the starter playground,\
    \ and select the Hard Shadows playground page. In the Resources folder, open Shaders.metal.\n\
    \nAdd a new struct, so you can create rectangle objects:\n\n```\nstruct Rectangle\
    \ {\n    float2 center;\n    float2 size;\n};\n```"
  merge: -1
