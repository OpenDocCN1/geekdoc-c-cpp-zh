  md: '# Metal by Tutorials


    # Chapter 3: The Rendering Pipeline


    Going top-down, the GPU has:


    +   - 1 Graphics Command Processor: This coordinates the work processes.

    - 4 Shader Engines (SE): An SE is an organizational unit on the GPU that can serve
    an entire pipeline. Each SE is a geometry processor, a rasterizer and Compute
    Units.

    - 9 Compute Units (CU): A CU is nothing more than a group of shader cores.

    - 64 shader cores: a shader core is the basic building block of the GPU where
    all of the shading work is done.


    In total, the story is 36 CUs have 2304 shader cores. Compare that to the number
    of cores in your quad-core CPU. Not fair, I know! :


    For mobile devices, the story is a little different. For comparison, take a look
    at the following image showing a GPU similar to those in recent iOS devices. Instead
    of having SEs and CUs, the PowerVR GPU has Unified Shading Clusters (USC). This
    particular GPU model has 6 USCs and 32 cores per USC for a total of only 192 cores.


    ![](img/8d763acb335ab213ea9213a628f7d844_70_0.png)


    > Note: The iPhone X had the first mobile GPU entirely designed in-house by Apple.
    Unfortunately, Apple has not made the GPU hardware specifications public.


    What can you do with that many cores? Since these cores are specialized in both
    vertex and fragment shading, one obvious thing to do is give all the cores to
    work in parallel so that the processing of vertices or fragments is faster. There
    are a few rules, though. Inside a CU, you can only process vertices or fragments
    at one time. Good thing there''s thirty-six of those! Another rule is that you
    can only process one shader function per SE. Having four SE''s lets you combine
    work in interesting and useful ways. For example, you can run one fragment shader
    on one SE and a second


    raywendlicher.com


    71'
