  md: '# # Chapter 18: Rendering with Rays

    By Marius Horga


    In previous chapters, you worked with a traditional pipeline model, a raster-model,
    which uses a rasterizer to color the pixels on the screen. In this chapter, you''ll
    learn about another, somewhat different rendering technique, a ray-model, which
    you''ll use to render clouds.


    ![](img/8d763acb335ab213ea9213a628f7d844_489_0.png)


    # ## Getting started


    In the world of computer graphics, there are two main approaches to rendering
    graphics: The first one is geometry -> pixels.


    This approach transforms geometry into pixels using the raster-model.'
  merge: -1
  pgno: 489
- img_proc: true
  md: "The raster-model assumes you know all of the models and their geometry (triangles)\
    \ beforehand.\n\n![](img/8d763acb335ab213ea9213a628f7d844_490_0.png)\n\nA pseudo-algorithm\
    \ for the raster-model might look something like this:\n\n```\nfor each triangle\
    \ in the scene:\nif visible:\n    mark triangle location\n    apply triangle color\n\
    if not visible:\n    discard triangle\n```\n\nThe second one is pixels -> geometry.\
    \ This approach involves shooting rays from the camera, out of the screen and\
    \ into the scene, using the ray-model which is what you'll be using for the remainder\
    \ of this chapter.\n\nA pseudo-algorithm for the ray-model may look something\
    \ like this:\n\n```\nfor each pixel on the screen:\nif there's an intersection\
    \ (hit):\n    identify the object hit\n    change pixel color\noptionally bounce\
    \ the ray\nif there's no intersection (miss):\n    discard ray\n    leave pixel\
    \ unchanged\n```\n\nIn ideal conditions, light travels through the air as a ray\
    \ following a straight line until it hits a surface. Once the ray hits something,\
    \ any combination of the following events may happen to the light ray:\n\n+  \
    \ - Light gets absorbed into the surface."
  merge: -1
  pgno: 490
- img_proc: true
  md: "Metal by Tutorials\n  Chapter 18: Rendering with Rays\n\n+   - Light gets reflected\
    \ by the surface.\n- Light gets refracted through the surface.\n- Light gets scattered\
    \ from another point under the surface.\n\nWhen comparing the two models, the\
    \ raster-model is a faster rendering technique, highly optimized for GPUs. This\
    \ model scales well for larger scenes and implements antialiasing with ease. If\
    \ you are creating highly interactive rendered content, such as 1st- and 3rd-person\
    \ games, the raster-model might be the better choice since pixel accuracy is not\
    \ paramount.\n\nIn contrast, the ray-model is more parallelizable and handles\
    \ shadows, reflection and refractions more easily. When you're rendering static,\
    \ far away scenes, using a ray-model might be the better choice.\n\nThe ray-model\
    \ has a few variants; among the most popular are ray casting, ray tracing, path\
    \ tracing and raymarching. Before you get started, it's important to understand\
    \ each.\n\n# Ray casting\n\nIn 1968 Arthur Appel introduced ray casting, making\
    \ it one of the oldest ray-model variants. However, it wasn't until 1992 that\
    \ it became popular in the world of gaming — that's Id Software's programmer,\
    \ John Carmack, used it for their Wolfenstein 3D game.\n\nWith ray casting, the\
    \ main idea is to cast rays from cameras into the scene looking for surfaces the\
    \ ray can hit. In Wolfenstein 3D, they used a floor map to describe all of the\
    \ surfaces in the scene. Because the object height was usually the same across\
    \ all objects, scanning was fast and simple — only one ray needs to be cast for\
    \ each vertical line of pixels (column).\n\n![](img/8d763acb335ab213ea9213a628f7d844_491_0.png)\n\
    \nraywenderlich.com  492"
  merge: -1
  pgno: 491
- img_proc: true
  md: "But there's more to the simplicity and fast performance of this algorithm than\
    \ objects having the same height!\n\nThe walls, ceiling and floor each had one\
    \ specific color and texture, and the light source was known ahead of time. With\
    \ that information, the algorithm could quickly calculate the shading of an object,\
    \ especially since it assumes that when a surface faces the light, it will be\
    \ lit (and not hiding in the shadows).\n\nIn its rawest form, a ray casting algorithm\
    \ states this:\n\nFor each cell in the floor map, shoot a ray from the camera,\
    \ and find the closest object blocking the ray path.\n\nThe number of rays cast\
    \ tends to equal the screen width:\n\n```\nFor each pixel from 0 to width:\nCast\
    \ ray from the camera\nIf there's an intersection (hit):\n  Color the pixel in\
    \ object's color\n  Stop ray and go to the next pixel\nIf there's no intersection\
    \ (miss):\n  Color the pixel in the background color\n```\n\nRay casting has a\
    \ few advantages:\n\n+   - It's a high-speed rendering algorithm because it works\
    \ with scene constraints such as the number of rays being equal to the width of\
    \ the screen — about a thousand rays.\n\n+   - It's suitable for real-time, highly\
    \ interactive scenes where pixel accuracy is not essential.\n\n+   - The size\
    \ occupied on disk is small because scenes don't need to be saved since they're\
    \ rendered so fast.\n\nThere are also disadvantages to this algorithm:\n\n+  \
    \ - The quality of the rendered image looks blocky because the algorithm uses\
    \ only primary rays that stop when they hit an object.\n\n+   - The scene is limited\
    \ to basic geometric shapes that can be easily intersected by rays.\n\n+   - The\
    \ calculations used for intersections are not always precise.\n\nTo overcome some\
    \ of these disadvantages, you'll learn about another variant of the ray-model:\
    \ ray tracing."
