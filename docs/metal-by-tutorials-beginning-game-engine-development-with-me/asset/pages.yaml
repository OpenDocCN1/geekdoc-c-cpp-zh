  md: '# Match SceneKit names


    When you''re using Metal with SceneKit, you''ll find that parameter names must
    match what SceneKit is expecting. Here, in the vertex function, SceneKit expects
    the Uniform buffer to be named scn_node. When you give a parameter name scn_node,
    you name the struct Uniform any name, and give the buffer index any, and SceneKit
    will recognize the buffer as being the uniform values.


    Replace uniforms with scn_node in two places, build and run, and you''ll see the
    jet rendered in red.


    ![](img/8d763acb335ab213ea9213a628f7d844_614_0.png)


    You just learned the basics of how to integrate SceneKit with Metal shaders, but
    there are a couple of tricks to send textures and constants to the shaders.


    # Send a texture to the fragment shader


    In Shaders.metal, add these attributes to VertexIn:


    ```

    float3 normal [[attribute(SCNVertexSemanticNormal)]];

    float2 uv [[attribute(SCNVertexSemanticTextcoord)]]];

    ```


    These properties will allow you to access normals and uv coordinates.


    Add the uv to VertexOut:


    ```

    float2 uv;

    ```


    At the end of shipVertex, before return, to send the uv coordinates to the fragment
    shader, add:


    ```

    out.uv = in.uv;

    ```'
