    # # The asset catalog


    As its name suggests, the asset catalog can hold all of your assets, whether they
    be data, images, textures or even colors. You''ve probably used the catalog for
    app icons and images. Textures differ from images in that the GPU use them, and
    thus they have different attributes in the catalog. To create textures, you add
    a new texture set to the asset catalog.


    You''ll replace the textures for the low poly house and ground use textures from
    a catalog. Create a new file using the Asset Catalog template and name it Textures.
