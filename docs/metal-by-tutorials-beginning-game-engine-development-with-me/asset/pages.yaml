    ```

    F(X,Y) = X^2 + Y^2 - R^2

    ```


    ![](img/8d763acb335ab213ea9213a628f7d844_497_0.png)


    The function that describes a sphere of radius R is straightforward as well:


    ```

    F(X,Y,Z) = X^2 + Y^2 + Z^2 - R^2

