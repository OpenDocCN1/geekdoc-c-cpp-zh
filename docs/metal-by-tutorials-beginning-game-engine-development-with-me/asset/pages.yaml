  md: '# # Chapter 11: Tessellation & Terrains

    By Caroline Begbie


    So far you''ve used normal map trickery in the fragment function to show the fine
    details of your low poly models. To achieve a similar level of detail without
    using normal maps requires a change of model geometry by adding more vertices.
    The problem with adding more vertices is that when you send them to the GPU, it
    chokes up the pipeline. A hardware tessellator in the GPU can create vertices
    on the fly, and thereby a greater level of detail and thereby using fewer resources.


    In this chapter, you''re going to create a detailed terrain using a small number
    of points. You''ll send a flat ground plane with a grayscale texture describing
    the height, and the tessellator will create as many vertices as needed. The vertex
    function will then read the texture and displace these new vertices vertically;
    in other words, move them upwards.


    ![](img/8d763acb335ab213ea9213a628f7d844_295_0.png)


    Notice how many vertices the tessellator creates. In this example, the number
    of vertices depends on how close the control points are to the camera. You''ll
    learn more about that later.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Tessellation


    Instead of sending vertices to the GPU, you send patches. These patches are made
    up of control points — a minimum of three for a triangle patch, or four for a
    quad. The tessellator can convert each quad patch into a certain number of triangles:
    up to 4,096 triangles on recent iMac and 256 triangles on an iPhone that''s capable
    of tessellation.


    > Note: Tessellation is available on all Macs since 2012 and on iOS 10 GPU Family
    3 and up; this includes the iPhone 6s and newer devices.


    With tessellation, you can:


    +   - Send less data to the GPU. Because the GPU doesn''t store tessellated vertices
    in graphics memory, it''s more efficient on resources.

    - Make low poly objects look less low poly by curving patches.

    - Displace vertices for fine detail instead of using normal maps to fake it.

    - Decide on the level of detail based on the distance from the camera. The closer
    an object is to the camera, the more vertices it contains.


    # The starter project


    Before creating a tessellated terrain, you''ll tessellate a single four-point
    patch. Open and run the starter project for this chapter. The code in this project
    is the minimum needed for a simple render of six vertices to create a quad.


    ![](img/8d763acb335ab213ea9213a628f7d844_296_0.png)'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# Metal by Tutorials | Chapter 11: Tessellation & Terrains


    Your task is to convert this quad to a tessellated patch made up of many vertices.


    Instead of sending vertices to the GPU, you''ll send the positions of the four
    corners of the patch. You''ll give the GPU edge factors and inside factors which
    tell the tessellator how many vertices to create. So can you see the vertices
    added by the tessellator, you''ll render in line mode.


    To convert the quad, you''ll do it the following on the GPU side:


    ![](img/8d763acb335ab213ea9213a628f7d844_297_0.png)


    On the GPU side, you''ll set up a tessellation kernel that processes the edge
    and inside factors. You''ll also set up a post-tessellation vertex shader that
    handles the vertices generated by the hardware tessellator.


    ![](img/8d763acb335ab213ea9213a628f7d844_297_1.png)


    # Tessellation patches


    A patch consists of a certain number of control points, generally:


    +   - bilinear: Four control points, one at each corner

    - biquadratic: Nine control points

    - bicubic: Sixteen control points


    ![](img/8d763acb335ab213ea9213a628f7d844_297_2.png)


    The control points make up a cage which is made up of spline curves. A spline
    is a parametric curve made up of control points.


    raywenderlich.com | 298'
