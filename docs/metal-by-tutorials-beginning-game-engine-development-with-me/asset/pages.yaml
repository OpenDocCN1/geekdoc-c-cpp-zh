  md: '# # Chapter 22: Integrating SpriteKit & SceneKit

    By Caroline Begbie & Marius Horga


    Now that you have mastery over rendering, you can put your knowledge to use in
    other APIs.


    SceneKit, SpriteKit and Core Image all have some integration with Metal shaders
    and Metal rendering.


    There may be times when you don''t want to write a full-blown 3D Metal app, but
    you want to take advantage of SceneKit. Or perhaps all you want is a 2D layer
    in your Metal app — for that, you can use SpriteKit. And even though you have
    less control over your final output with SceneKit and SpriteKit, you can still
    incorporate shaders to give your games a unique look.


    In this chapter, you''ll have a look at a collection of APIs that integrate with
    Metal. You''ll first create a toon outline and cel shader for the jet in Apple''s
    SceneKit template.


