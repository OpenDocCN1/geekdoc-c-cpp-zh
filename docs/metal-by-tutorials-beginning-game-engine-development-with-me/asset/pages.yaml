  md: "# Signed distance functions\n\nSigned Distance Functions (SDF) describe the\
    \ distance between any given point and the surface of the object in the scene.\
    \ An SDF returns a negative number if the point is inside that object or postwise\
    \ otherwise.\n\nSDFs are useful because they allow for reducing the number of\
    \ samples used by ray tracing. The difference between the two techniques is in\
    \ ray tracing, the intersection is determined by a strict set of equations, while\
    \ in rayarching the intersection is approximated.\n\nUsing SDFs, you can march\
    \ along the ray until you get close enough to an object. This is inexpensive to\
    \ compute compared to precisely determining intersections.\n\nAll right, time\
    \ to finally write some code!\n\nRun the starter playground included with this\
    \ chapter, and you'll see a light-blue background.\n\nClick on the SDF page, and\
    \ inside the Resources folder, open Shaders.metal. Within the kernel center, add\
    \ this code below // SDF:\n\n```\n// 1\nfloat radius = 0.25;\nfloat2 center =\
    \ float2(0.0);\n// 2\nfloat distance = length(uv - center) - radius;\n// 3\nif\
    \ (distance < 0.0) {\n  color = float4(1.0, 0.85, 0.0, 1.0);\n}\n```\n\nGoing\
    \ through the code:\n\n+   1. Define the radius and center of the circle.\n\n\
    +   2. Create an SDF that can find the distance to this circle from any point\
    \ on the screen.\n\n+   3. Check the sign of the distance variable. If it's negative,\
    \ it means the point is inside the circle, so change the color to yellow.\n\n\
    > Note: You learned earlier that the function that describes a circle is F(X,Y)\
    \ = X^2 + Y^2 - R^2 which is what you used for the SDF. Since the center is at\
    \ (0,0) you can easily recognize the function in this reduced form instead: dist\
    \ = length(uv) - radius."
