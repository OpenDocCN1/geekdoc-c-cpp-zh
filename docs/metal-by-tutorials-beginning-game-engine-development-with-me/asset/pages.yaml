  md: "The formula for alpha blending:\n\n# $$\\vec{C}_b = \\alpha_1 * \\vec{C}_s\
    \ + \\alpha_2 * \\vec{C}_d$$\n\nGoing over this formula:\n\n+   - Cs: Source color.\
    \ The current color you just added to the scene.\n- Cd: Destination color. The\
    \ color that already exists in the framebuffer.\n- Cb: Final blended color.\n\
    - $a1$ and $$\\alpha_2$: The alpha (opacity) factors for the source and destination\
    \ color, respectively.\n\nThe final blended color is the result of adding the\
    \ products between the two colors and their opacity factors. The source color\
    \ is the fragment color you put in front, and the destination color is the color\
    \ already existing in the framebuffer.\n\nOften the two factors are the inverse\
    \ of each other transforming this equation into linear interpolation:\n\n# $$\\\
    vec{C}_b = \\alpha * \\vec{C}_s + (1 - \\alpha) * \\vec{C}_d$$\n\nAll right, time\
    \ to install a glass window in front of the tree.\n\nIn *Renderer.swift*, create\
