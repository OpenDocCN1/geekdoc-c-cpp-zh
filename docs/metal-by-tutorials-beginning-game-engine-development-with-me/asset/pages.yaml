  md: 'This concludes the raymarching section of the chapter. For the remainder of
    the chapter, you''ll look into a shadow technique that applies to rasterized content.


    # Percentage closer filtering


    If you remember from Chapter 14, “Multipass & Deferred Rendering”, you implemented
    a shadow map.


    ![](img/8d763acb335ab213ea9213a628f7d844_541_0.png)


    Even though this technique is quite fast, as you can notice there is a fair amount
    of aliasing, especially noticeable if you zoom in on the tree shadow. You can
    easily see all those jaggies on the shadow contour.


    Fortunately, there''s a technique known as percentage closer filtering (PCF) that
    lets you improve its quality by taking into account the shadow contribution of
    the neighboring pixels.


    In Chapter 14, “Multipass & Deferred Rendering”, you learned that the shadow map
    contains depth values for each pixel which determine whether pixel is in the shadow
    or not based on a threshold you set. As an example, you could decide that each
    pixel with a depth value of z > 10 is in the shadow, and all others are lit.'
