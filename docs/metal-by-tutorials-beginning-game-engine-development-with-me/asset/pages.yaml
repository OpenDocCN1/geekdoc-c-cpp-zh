  md: "# Metal by Tutorials\n\n# Chapter 14: Multipass & Deferred Rendering\n\n> **Note:**\
    \ In a real-world project, this would be a common function, but duplicate it for\
    \ convenience.\n\n**Composition.metal** create a new fragment function:\n\n```\n\
    fragment float4 compositionFrag(VertexOut in [[stage_in]],\n    constant FragmentUniforms\
    \ &fragmentUniforms [[buffer(3)]],\n    constant Light *lightsBuffer [[buffer(2)]],\n\
    \    texture2d-float albedoTexture [[texture(0)]],\n    texture2d-float normalTexture\
    \ [[texture(1)]],\n    texture2d-float positionTexture [[texture(2)]],\n    depth2d-float\
    \ shadowTexture [[texture(4)]]) {\n// 1\nconstpr sampler filter::linear, mag_filter::linear);\n\
    float4 albedo = albedoTexture.sample(s, texCoords);\nfloat3 normal = normalTexture.sample(s,\
    \ texCoords).xyz;\nfloat3 position = positionTexture.sample(s, texCoords).xyz;\n\
    float3 baseColor = albedo.rgb;\n// 2\nfloat3 diffuseColor = compositeLighting(normal,\
    \ position,\n    fragmentUniforms, lightsBuffer, baseColor);\n// 3\nfloat shadow\
    \ = albedo.a;\nif (shadow > 0) {\n    diffuseColor *= 0.5;\n}\nreturn float4(diffuseColor,\
    \ 1);\n}\n```\n\nGoing through this code, you:\n\n+   1. Create a sampler and\
    \ read the values from the passed-in textures.\n2. Call the same lighting function\
    \ as you did in the main pass. This time you're sending values from the textures\
    \ as parameters.\n3. Look at the value of the albedo's alpha channel where the\
    \ shadow information is, and if this value is non-negative, make the diffuse color\
    \ darker.\n\nraywenderlich.com\n\n408"
