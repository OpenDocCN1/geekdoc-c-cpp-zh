    # 3D file formats


    Here''s an overview of what each offers:


    +   - **obj**: This format, developed by Wavefront Technologies, has been around
    for awhile; almost every 3D app supports importing and exporting this format.
    You can specify materials (textures and surface properties) but not animation.

