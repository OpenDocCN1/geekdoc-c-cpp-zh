- img_proc: true
  md: 'Sphere-to-sphere: The simplest volume collision test where you add the radius
    of each sphere and where the calculation is greater than the distance between
    the objects'' positions. This is fast and efficient. However, as you''ll see when
    colliding the car, when you have rectangular objects, the collision is not very
    accurate.


    AABB: Axis-aligned bounding box. The AABB is the smallest cubic volume that contains
    the object. AABB checking is also fast, but if you have many odd rotated shapes,
    it''s not too accurate.


    OBB: Oriented bounding box. This is where the bounding volume rotates with the
    character. It''s much more difficult to check the collision.


    ![](img/8d763acb335ab213ea9213a628f7d844_266_0.png)


    You''ll be doing spherical collision using the bounding box provided by Model
    I/O. The bounding sphere will have a diameter of the widest side.


    > Note: glTF import currently doesn''t create an axis aligned bounding box, but
    you can set up one for the skeleton with this code if you want to check skeletal
    collisions: skeleton.boundingBox = MDLAxisAlignedBoundingBox(maxBounds:[0.4, 1.7,
    0.4], minBounds:[-0.4, 0, -0.4]). You''ll have to import ModelIO in your scene
    if you haven''t already.


    If you have many objects in your scene and test collision for every object against
    every other object, the calculation can seriously overwhelm your processing allowance.
    If you have this scenario, you would generally separate your game objects into
    sections using a space partitioning algorithm such as an octree. You''d set this
    up ahead of time so that you''d only check collisions for objects in the same
    sections.'
