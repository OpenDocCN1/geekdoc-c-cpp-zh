    \ values: material color (or albedo), world space normals and positions and shadow\
    \ information.\n\n+   - A third and final pass using a full-screen quad combines\
    \ all of this information into one final composite texture.\n\n# The G-buffer\
    \ pass pass\n\nAll right, time to build G-buffer up! First, create four new textures.\
    \ Add this code at the top of Renderer:\n\n```\nvar albedoTexture: MTLTexture!\n\
