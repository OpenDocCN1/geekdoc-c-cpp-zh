    # Chapter 21: Metal Performance Shaders


    The MPS framework provides a high performance MPSRayInteractor class specifically
    created to accelerate ray-triangle intersection tests on the GPU.


    The MPSRayInteractor object uses two inputs: a ray buffer and an acceleration
    structure. It outputs into another buffer all the intersections it finds for each
    ray cast.


    ![](img/8d763acb335ab213ea9213a628f7d844_590_0.png)


    MPSTrialAccelerationStructure is the class used to build the acceleration structure
    from vertices that describe the triangles in a scene. You pass the structure to
    the intersector.


