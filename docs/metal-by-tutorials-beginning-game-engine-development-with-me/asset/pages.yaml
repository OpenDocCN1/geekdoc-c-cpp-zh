  md: "# The Blit Command Encoder\n\nYou'll copy each morph vertex buffer into the\
    \ single MTLBuffer using a **blit** operation. You were introduced to a render\
    \ command encoder in Chapter 1, “Introduction to Metal,” and here to briefly create\
    \ an encoder in Chapter 11, “Tessellation.” You are now learning about another\
    \ type of encoder. A blit command encoder does a fast copy between resources as\
    \ textures and buffers. Just like an MTLRenderCommandEncoder, you create an MTLCommandBufferEncoder\
    \ and issue commands to the command buffer.\n\nAfter the previous code, add this\
    \ to create the command buffer and blit encoder:\n\n```\nlet commandBuffer = Renderer.commandQueue.makeCommandBuffer()\n\
    let blitEncoder = commandBuffer?.makeBlitCommandEncoder()\n```\n\nProcess all\
    \ the OBJ files and blit each vertex buffer into the single MTLBuffer.\nContinue\
    \ with this:\n\n```\nfor i in 0..morphTargetNames.count {\n    guard mesh = Nature.LoadMesh(name:\
    \ morphTargetNames[i]) else {\n        fatalError(\"morph target not loaded\"\
    )\n    }\n    let buffer = mesh.vertexBuffers[0].buffer\n    blitEncoder?.copy(from:\
    \ buffer, sourceOffset: 0,\n        to: vertexBuffer,\n        destinationOffset:\
    \ buffer.length * i,\n        size: buffer.length)\n}\n```\n\nThe offset of each\
    \ morph target vertex buffer is the length of the original morph target buffer\
    \ multiplied by the current morph target array index.\n\nFinish off the blit operation\
    \ as you would a render pass:\n\n```\nblitEncoder?.encoding()\ncommandBuffer?.commit()\n\
    ```\n\n> **Note:** If you build and run now, click the Capture GPU Frame icon\
    \ and inspect the vertex buffer in the Rocks folder, you'll see that the buffer\
    \ contains 4947 entries, which is 3 times 1649 vertices."
