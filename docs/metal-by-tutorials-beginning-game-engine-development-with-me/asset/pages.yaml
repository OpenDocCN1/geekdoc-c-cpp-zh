    var currentCameraIndex = 0\nvar camera: Camera {\n    return cameras[currentCameraIndex]\n\
    }\n```\n\nFor the moment, you only have one camera, but later you'll set up another\
    \ camera with an alternative viewing position.\n\n# The scene graph\n\nIn your\
    \ game, you may want to have trees, houses and animated characters. Some of these\
    \ objects may depend upon other objects. For example, a car may contain a driver\
    \ and its passengers. As the car moves, its occupants should move along at the\
    \ same speed, as if they were inside the car.\n\nWhile it's possible to move each\
    \ individual object, you can (and in most cases, should) only move the car, getting\
    \ the people to automatically follow along. The scene graph is a transform hierarchy\
    \ that defines the spatial relationships of objects in the scene.\n\nAny children\
    \ of a parent will move with the parent; however, children can still have their\
    \ own independent movement within the parent."
