  md: '# The right texture for the right job


    Using asset catalogs gives you complete control over how to deliver your textures.
    Currently, you only have two color textures. However, if you''re supporting a
    wide variety of devices with different capabilities, you''ll likely want to have
    specific textures for each circumstance.


    For example, here is a list of individual textures you can assign by checking
    the different options in the Attributes inspector, for the Apple watch, 1x, 2x
    and 3x sizes, and sRGB and P displays.


    ![](img/8d763acb335ab213ea9213a628f7d844_172_0.png)


    # Texture compression


    In recent years, people have put much effort towards compressing textures to save
    both CPU and GPU memory. There are various formats you can use, such as ETC and
    PVTC. Apple has embraced ASTC as being the most high-quality compressed format.
    ASTC is available on the A8 chip and newer.


    Using textures within the asset catalog allows you to determine for which which
    is the best format to use.'
