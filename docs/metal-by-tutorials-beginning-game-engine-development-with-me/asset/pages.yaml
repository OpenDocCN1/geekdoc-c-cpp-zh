    Going through the code:


    +   1. Build the checkerboard if the selected object is the plane.


    +   2. Get the position of the camera ray in the horizontal XZ plane since you''re
    interested in intersecting the floor plane only.


    +   3. Create squares. You first alternate between 0s and 1s on both X and Z axes
    by applying the modulo operator. At this point, you have a series of pairs containing
    0s or 1s or both. Next, add the two values together from each pair, and apply
    the modulo operator again. If the sum is 2, roll it back to 0; otherwise, it will
    be 1.


    +   4. Apply color. Initially, it''s a solid white color. Multiply by 0.5 to tone
    it down, and add 0.5 back, so you can have white and grey squares.


    If you were to run the playground now, you''d notice a red flag for the missing
    mod function. However, before adding the missing function, take a moment to understand
    why you need to implement a simple modulo operation.


    The fmod function, as implemented by the Metal Shading Language, performs a truncated
    division where the remainder will have the same sign as the numerator:


    ```

    fmod = numerator - trunc(numerator / denominator)

    ```


    A second approach, missing from MSL, is floored division where the remainder has
    the same sign as the denominator:


    ```

    mod = numerator - floor(numerator / denominator)

    ```


    These two approaches could have entirely different results. When calculating pos,
    the values need to alternate between 0s and 1s, so taking the floor of the truncated
    division is enough. However, when you add the two coordinates to determine the
    check value on the next line, you will need to take the floor of their sum.'
