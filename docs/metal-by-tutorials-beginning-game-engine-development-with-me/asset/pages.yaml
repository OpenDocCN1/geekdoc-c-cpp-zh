  md: '# Metal by Tutorials


    # Chapter 20: Advanced Lighting


    To do this, you''ll first create a render pass.


    In Renderer.swift, add this property to Renderer:


    ```

    let reflection(metalView: RenderPass

    ```


    In init(metalView:), before calling super.init(), add this:


    ```

    reflectionRenderPass = RenderPass(name: "reflection",

    size: metalView.drawableSize)

    ```


    RenderPass will create a render pass descriptor with a texture and a depth texture.


    You need reflectionRenderPass to update the size of these textures on resize of
    the view, in mtkView(_:drawableSizeWillChange:), add:


    ```

    reflectionRenderPass.updateTextures(size: size)

    ```


    Now that you have set up the render pass, create an encoder, and render the whole
    scene to the reflection pass texture.


    In draw(in:), add this code // Water render:


    ```

    // 1

    let reflectEncoder =

    commandBuffer.makeCommandEncoder(

    descriptor: reflectionRenderPass.descriptor)!

    reflectEncoder.setDepthStencilState(depthStencilState)

    // 2

    reflectCamera.transform = camera.transform

    reflectCamera.transform.position.y = -camera.transform.position.y

    reflectCamera.transform.rotation.x = -camera.transform.rotation.x

    uniforms.viewMatrix = reflectionCamera.viewMatrix

    // 3

    renderEncoder(renderEncoder: reflectEncoder)

    renderTerrain(renderEncoder: reflectEncoder)

    renderSkybox(renderEncoder: reflectEncoder)

    reflectEncoder.endEncoding())

    ```


    Going through the code:


    +   1. Create a new command encoder for reflection, and set its depth stencil
    state.


    +   2. This is the unique part about rendering. You use a separate camera specially
    for reflection, and you set its position to the main camera''s negated values
    because you want the camera to be below the surface of the water and capture what''s
    above the surface of the water.


    +   3. Render all the elements of the scene before ending the rendering encoding.


    raywendlicher.com


