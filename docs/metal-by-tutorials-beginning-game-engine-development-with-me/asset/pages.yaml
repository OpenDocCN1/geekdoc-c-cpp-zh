  md: 'Take note, because in this chapter, you''ll be creating that scene. Along the
    way, you''ll learn a few key concepts, such as:


    +   - Shadow maps

    - Multipass rendering

    - Deferred rendering with a G-buffer

    - The blit command encoder


    You''ll start with shadows first.


    # Shadow maps


    A shadow represents the absence of light on a surface. A shadow is present on
    an object when another surface or object obscures it from the light. Having shadows
    in a project makes your scene look more realistic and provides a feeling of depth.


    Shadow maps are nothing more than textures containing shadow information about
    the scene. When a light shines on an object, anything that is behind that object
    gets a shadow cast on it.


    Typically you render the scene from the location of your camera, but to build
    a shadow map, you need to render your scene from the location of the light source
    - in this case the sun.


    ![](img/8d763acb335ab213ea9213a628f7d844_387_0.png)


    The image on the left shows a render from the position of the camera with the
    directional light pointing down. The image on the right shows a render from the
    position of the directional light. The eye shows where the camera was positioned
    in the first image.'
