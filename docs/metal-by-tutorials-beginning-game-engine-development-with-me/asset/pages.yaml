  md: "# Metal by Tutorials\n\nexpected to be there. For example, with different colors\
    \ that make them seem\nmisplaced among neighboring pixels.\n\nNoise is useful\
    \ in creating procedural content such as fog, fire or clouds. You'll\nwork on\
    \ creating layers, but first you need to learn how to handle noise.\n\nNoise has\
    \ many variants such as Value noise and Perlin noise; however, for the sake of\n\
    splicity, you'll only work with value noise in this chapter.\n\nValue noise uses\
    \ a method that creates a lattice of points which are assigned random\nvalues.\
    \ The noise function returns a number based on the interpolation of values of\
    \ the\nsurrounding lattice points.\n\nOctaves are used in calculating noise to\
    \ express the multiple irregularities around us.\nFor each octave, you run the\
    \ noise functions with a different frequency (the period at\nwhich data is sampled)\
    \ and amplitude (the range at which the result can be).\n\nMultiple octaves of\
    \ noise can be generated and then summed together to create a\nof fractal noise.\n\
    \nThe most apparent characteristic of noise is randomness. Since the Metal Shading\n\
