  md: 'The offset is the position in the buffer where the vertex information starts.
    The index is how the GPU vertex shader function will locate this buffer.


    The mesh is made of submeshes. When the artist creates a 3D model, they design
    it with different material groups. These translate to submeshes. For example,
    if you were rendering a car object, you might have a shiny car and rubber tires.
    One material is a shiny paint and another material rubber. On import, Model I/O
    will create two different submeshes that index to the correct vertices for that
    group. One vertex can be rendered multiple times by different submeshes. This
    sphere has only one submesh, so you''ll just use one.


