  md: 'Fog is quite useful in rendering a couple of reasons. First, it serves as a
    far delimiter for rendered content. The renderer can ignore objects that get lost
    in the fog they''re not visible. Second, fog helps avoiding the popping-up effect
    for objects that just appeared in the scene from a distance, making their appearance
    into the scene more gradual.


    As before, you''ll add a toggle for fog.


    In Renderer.swift, add this property to the top of the class:


    ```

