  md: "# Multpass rendering\n\nA render pass consists of sending commands to a command\
    \ encoder. The pass ends when you end encoding on that command encoder. Multipass\
    \ rendering uses multiple command encoders and facilitates rendering content in\
    \ one pass and using the output of this pass as the input of the next pass.\n\n\
    Why would you need two passes? Because in this case, you'll render the shadow\
    \ from the light's position, not from the camera's position. You'll then save\
    \ the output to a shadow texture and give it to the next pass which combines the\
    \ shadow with the rest of the scene to make up a final image.\n\nSince you have\
    \ already created code that renders the scene, you can easily refactor this code\
    \ into a new function that you can reuse for shadows as well.\n\n# The shadow\
    \ pass\n\nDuring the shadow pass, you'll be rendering from the point of view of\
    \ the sun, so you'll need a new view matrix.\n\nIn Common.h,add this to the Uniforms\
    \ struct:\n\n```\nmatrix_float4x shadowMatrix;\n```\n\nYou'll also need a new\
    \ pipeline state to hold the different vertex function you'll be calling.\n\n\
    Add this to Renderer:\n\n```\nvar shadowPipelineState: MTLRenderPipelineState!\n\
    ```\n\nCreate a new method at the end of Renderer:\n\n```\nfunc renderShadowPass(renderEncoder:\
    \ MTLRenderCommandEncoder) {\n    renderEncoder.pushDebugGroup(\"Shadow pass\"\
    )\n    renderEncoder.label = \"Shadow encoder\"\n    renderEncoder.setVertexBuffer(model)\n\
    \    renderEncoder.setDepthStencilState(depthStencilState)\n    // 1\n    renderEncoder.setDepthBias(0.01,\
    \ slopeScale: 1.0, clamp: 0.01)\n    // 2\n    uniforms.projectionMatrix = float4x4(orthoLeft:\
    \ -8, right: 8, bottom: -8, top: 8, near: 0.1, far: 16)\n    let position: float3\
    \ = [-sunlight.position.x, -sunlight.position.y, -sunlight.position.z]\n    let\
    \ center: float3 = [0, 0, 0]\n```"
