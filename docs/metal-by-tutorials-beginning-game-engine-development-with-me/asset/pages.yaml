    # Channel packing


    Open PBR.metal.


    Later on, you''ll again be using the PBR fragment function for rendering. Even
    if you don''t understand the mathematics, understand the layout of the function
    and the concepts used.


    When loading models built by various artists, you''re likely going to come up
    against a variety of standards. Textures may be a different way up; normals might
    point in a different direction; sometimes you may find three textures magically
    contained in a single file, a technique called channel packing. Channel packing
    is an efficient way of managing external textures.


    To understand how it works, look at the code where the fragment function reads
    single floats: roughness, metallic and ambient occlusion. When the function reads
    the texture for each of these values, it''s only reading the red channel. For
    example:


    ```

    roughness = roughnessTexture.sample(textureSampler, in.uv).r;

    ```


    Available within the roughness file are green and blue channels that are currently
    unused. As an example, you could use the green channel for metallic and the blue
    channel for ambient occlusion.


    Included in the Resources folder for this chapter is an image named channel-packed.png.


