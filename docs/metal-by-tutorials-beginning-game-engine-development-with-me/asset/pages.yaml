  md: '# # Chapter 17: Particle Behavior


    By Marius Horga


    As you learned in the previous chapter, particles have been at the foundation
    of computer animation for years. In computer graphics literature, three major
    animation paradigms are not well defined and have rapidly evolved in the last
    two decades:


    +   - Keyframe animation: Starting parameters are defined as initial frames, and
    then an interpolation procedure is used to fill the remaining values for in-between
    frames. This topic was covered in Chapter 8, "Character Animation."


    +   - Physically based animation: Starting values are defined as animation parameters,
    such as a particle''s initial position and velocity, but intermediate values are
    not specified externally. This topic was covered in Chapter 16, "Particle Systems."


    +   - Behavioral animation: Starting values are defined as animation parameters.
    In addition, a cognitive process model describes and influences the way intermediate
    values are later determined.


    In this chapter, you''ll focus on the last paradigm as you work through:


    +   - Behavioral animation.


    +   - Swarming behavior.


    +   - Velocity and bounds checking.


    +   - Behavioral rules.'
  merge: -1
  pgno: 470
- img_proc: true
  md: 'By the end of the chapter, you''ll build and control a swarm exhibiting basic
    behaviors

    You might see in nature.


    ![](img/8d763acb335ab213ea9213a628f7d844_471_0.png)


    # Behavioral animation


    You can broadly split behavioral animation into two major categories:


    +   - Cognitive behavior: This is the foundation of artificial life which differs
    from artificial intelligence in AI objects do not exhibit behaviors or have their
    own preferences. It can range from a simple cause-and-effect based system to more
    complex systems, known as *agents*, that have a psychological profile influenced
    by the surrounding environment.


    +   - Aggregate behavior: Think of this as the overall outcome of a group of agents.
    This behavior is based on the individual rules of each agent and can influence
    the behavior of neighbors.


    In this chapter, you''ll keep your focus on aggregate behavior.


    There''s a strict correlation between the various types of aggregate behavior
    entities and their characteristics. In the following table, notice how the presence
    of a physics system or intelligence varies between entity types.'
  merge: -1
  pgno: 471
- img_proc: true
  md: 'Metal by Tutorials


    Chapter 17: Particle Behavior


    | Type | Elements | Physics | Intelligence |

    |---|---|---|---|n| Particles | Millions | | None |

    | Flocks | Thousands | Some | Some |

    | Crowds | Hundreds | Few | Much |


    +   - **Particles** are the largest aggregate entities and are mostly governed
    by the laws of physics, but they lack intelligence.

    - **Flocks** are an entity''s well-balanced between size, physics and intelligence.

    - **Crowds** are smaller entities that are rarely driven by physics rules and
    are highly intelligent.


    Working with crowd animation is both a challenging and rewarding experience. However,
    the purpose of this chapter is to describe and implement a flocking-like system,
    or to be more precise, a swarm of insects.


    # # Swarming behavior


    Swarms are gatherings of insects or other small-sized beings. The swarming behavior
    of insects can be modeled in a similar fashion as the flocking behavior of birds,
    the herding behavior of animals or the shoaling of fish.


    You know from the previous chapter that particle systems are fuzzy objects whose
    dynamics are mostly governed by the laws of physics. There are no interactions
    between particles, and usually, they are unaware of their neighboring particles.
    In contrast, swarming behavior uses the concept of neighboring quite heavily.


    The swarming behavior follows a set of basic movement rules developed in 1986
    by Craig Reynolds in an artificial flocking simulation program known as Boids.
    Since this chapter is heavily based on his work, the term will be used throughout
    the chapter instead of ''particle''.


    Initially, this basic set only included three rules: cohesion, separation and
    alignment.


    ![](img/8d763acb335ab213ea9213a628f7d844_472_0.png)


