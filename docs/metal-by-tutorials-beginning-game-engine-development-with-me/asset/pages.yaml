  md: 'When you view an object, at the viewing angle of 90°, the surface becomes nearly
    100% reflective. For example, when you look across the water, it''s reflective;
    but when you look straight down into the water, it''s non-reflective.


    ![](img/8d763acb335ab213ea9213a628f7d844_349_0.png)


    Most dielectric (non-metal) materials have an F0 of about 4%, so most rendering
    engines use this amount as standard. For metals, F0 is the base color.


    Add this after the previous code:


    ```

    float3 f0 = mix(0.04, baseColor.rgb, metallic);

    float3 specularIBL = f0 + envBRDF.r + envBRDF.g;

    ```


    Here, you choose f0 as 0.04 for non-metals and the base color for metals. metallic
    **should** be a binary value of 0 or 1, but it''s best practice to avoid conditional
    branching in shaders, so you use mix(). You then calculate the second part of
    the rendering equation using the values from the look-up table.


    Replace the return line to include the diffuse and base colors:


    ```

    float3 specular = prefilteredColor * specularIBL;

    float4 color = diffuse + float4(baseColor, 1) + float4(specular, 1);

    return color;

    ```


    Build and run.


    Your car render is almost complete. Non-metals take the roughness value — the
    seats are matte, and the car paint is shiny.'
