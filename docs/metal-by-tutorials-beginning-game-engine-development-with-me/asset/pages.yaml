  md: '# Metal by Tutorials


    # Chapter 4: Coordinate Spaces


    To scale a point such as (1, 2, 3), you can have a fourth component: (1, 2, 3,
    3). Divide by that last w component to get (1/3, 2/3, 3/3, 1). The xyz values
    are now scaled down. These coordinates are called homogeneous. (Homogeneous means
    of the same kind.)


    The projection matrix projected the vertices from a frustum to a cube in the range
    -w to w. After the vertex leaves the vertex function along the pipeline, the GPU
    will perform a perspective divide and divide the x, y and z values by their w
    value. The higher the w value, the further back the coordinate is. The result
    of this is that all visible vertices now be within NDC.


    > Note: To avoid a divide by zero, the projection near plane should always be
    a value slightly more than zero.


    In the following picture, the dog and the cat are the same height — perhaps a
    y value of 2 for example. With projection, as the dog is further back, it should
    appear smaller in the final render.


    ![](img/8d763acb335ab213ea9213a628f7d844_110_0.png)


    After projection, the cat might have a w value of ~1 and the dog a w value of
    ~8. Dividing by w would give the cat a height of 2 and the dog a height of 1/4
    which will make the dog appear smaller.


    # NDC to screen


    Lastly, the GPU converts from normalized coordinates to whatever the device screen
    size is. You may already have done something like this at some time in your career
    when converting between normalized coordinates and screen coordinates.'
