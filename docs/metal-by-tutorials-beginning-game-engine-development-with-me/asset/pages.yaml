    # Alpha blending


    Alpha blending is different from alpha testing in that the latter only works with
    total transparency. In that case, all you have to do is discard fragments. For
    translucent or partially transparent objects, discarding fragments is not the
    solution anymore because you want the fragment color to contribute to a certain
    extent to the existing framebuffer color. You don''t want to just replace it.'
