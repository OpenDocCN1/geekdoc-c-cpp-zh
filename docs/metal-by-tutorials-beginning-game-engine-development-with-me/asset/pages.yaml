  md: '# Metal by Tutorials


    # Chapter 8: Character Animation


    Why is this useful? Each joint will rotate around its base. To rotate an object
    around a particular point, you first need to translate the point to the origin,
    then do the rotation, then translate back again.(Review Chapter 4, “Coordinate
    Spaces” if you''re unsure of this rotation sequence.)


    In the following image, the vertex is located at (4, 1) and bound 100% to Bone
    2. With rotations 10° on Bone 1 and 40° Bone 2, the vertex should end up at about
    (3.2, 0) as shown in the right-hand image.


    ![](img/8d763acb335ab213ea9213a628f7d844_233_0.png)


    # Before applying the pose


    # After applying the pose


    When you currently render your vertices, you multiply each vertex position by
    the projection, view and model matrices in the vertex function. To get this example
    vertex in the correct position for the right-hand image, you''ll also have to
    multiply the vertex position by both Bone 1''s transform and Bone 2''s transform.


    The sequence to get the final matrix is, for each joint:


    +   1. Calculate all the local joint transforms (you''ve already done this in
    update(deltaTime):).

    2. Position each joint at the origin using the joint''s inverse bind matrix.

    3. Multiply each joint''s transform by the transforms of all the joints upstream
    in the hierarchy.


    # Joint matrix palette


    There''s one more thing to take into consideration: the weights. When rigging
    your model, during weight painting, assign each vertex to one or more joints.
    The glTF importer will create MTLBuffers containing four joints and four weights
    for each vertex.


    This set of four joints and weights is called the joint matrix palette.'
