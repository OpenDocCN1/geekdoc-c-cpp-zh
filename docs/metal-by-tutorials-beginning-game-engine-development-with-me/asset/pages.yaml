  md: 'On the console list, you can click any entry, and it takes you to that frame
    on the graph bars above which displays a similar message:


    Thread blocked waiting for next drawable.


    That means there''s no synchronization between threads needing to use shared resources.


    Also, notice the gaps between command encoders on the graph bars. There''s no
    parallelism between the CPU and the GPU, so none of them are being kept busy.


    The largest gaps are between two consecutive frames. You can see on the Metal
    Application graphs bars that the render encoder (the blue, red and green dots)
    finishes its work before the frame ends.


    You can take at two actions here. First, you should synchronize the CPU and GPU
    shared access to resources. Second, you should run your encoders on multiple threads.


    For the remainder of this chapter, you''ll be working on taking your project to
    a highly parallelized state.


    # CPU-GPU synchronization


    Always aim to minimize the idle time between frames.


    Managing dynamic data can be highly beneficial. Take the case of Uniforms. You''re
    changing them usually once per frame. That means you''ll re-create the buffers
    every frame and that can be a waste of resources and frame time.


    Instead of having 60 buffers during 60 FPS of a frame, it''s possible to simply
    have a pool of reusable buffers that you update multiple times a frame.


    Triple buffering is a well-known technique in the realm of threading and synchronization.
    The idea is to use three buffers at a time. While the CPU writes a later one in
    the pool, the GPU reads from the earlier one, preventing synchronization issues.


    You might ask, why three and not just two or a dozen? With two buffers, there''s
    a high risk that the CPU will try to write the first buffer before the GPU finished
    reading it even once. With too many buffers, there''s a high risk of performance
    issues.


    All right, time to implement that triple buffering pool like a champ!'
