  md: '# # Chapter 5: Lighting Fundamentals

    By Caroline Begbie


    In this chapter, you''ll learn basic lighting. However, more importantly, you''ll
    learn how to manipulate data in shaders and be on the path to mastering shader
    artistry. Lighting, shadows, non-photorealistic rendering — these are all techniques
    that start with the methods you''ll learn in this chapter.


    One of the simplest methods of lighting is the **Phong reflection model**. It''s
    named after Bui Tong Phong who published a paper in 1975 extending older lighting
    models. The idea is not to attempt duplication of light and reflection physics
    but to generate pictures that look realistic.


    This model has been popular for over 40 years and is a great place to start learning
    how to fake lighting using a few lines of code. All computer images are fake,
    but there are more modern real-time rendering methods that model the physics of
