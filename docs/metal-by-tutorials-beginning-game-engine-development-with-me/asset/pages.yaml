  md: "# Metal by Tutorials\n\nMake sure that you move the compiled .metallib file\
    \ to the correct CarGame-macOS or CarGame-iOS group. You can delete the .air file.\n\
    \nYou can now use the compiled kernel in your app.\n\nIn HudNode.swift, create\
    \ a new property for the kernel:\n\n```\nlet kernel: CIBlendKernel\n```\n\nIn\
    \ init(name:size), before calling super.init(), initialize kernel:\n\n```\n//\
    \ 1\nlet url = Bundle.main.url(forResource: \"CIBlend\",\n    withExtension: \"\
    metallib\")\n// 2\nlet data = try Data(contentsOf: url)\n// 3\nkernel = try CIBlendKernel(functionName:\
    \ \"hudBlend\",\n    fromMetalLibraryData: data)\n} catch {\n    fatalError(\"\
    Kernel not found\")\n}\n```\n\nWith this code,\n\n+   1. Get the URL for the .metallib\
    \ resource.\n2. Load the library data.\n3. Get the kernel from the library.\n\n\
    In postProcess(inputTexture:), remove the three lines that initialize filter,\
    \ and replacereplace:\n\n```\nlet outputImage = filter.outputImage!\n```\n\nWith:\n\
    \n```\nlet extent = hudImage.extent\nlet arguments = [hudImage, drawableImage]\n\
    let outputImage = kernel.apply(extent: extent, arguments: arguments)\n```\n\n\
    +   - extent is a CGRect that provides the size of the image.\n- arguments match\
    \ the two arguments that you set up in hudBlend:\n\n```\nfloat4 hudBlend(sample_t\
    \ hudTexture, sample_t drawableTexture)\n```"
