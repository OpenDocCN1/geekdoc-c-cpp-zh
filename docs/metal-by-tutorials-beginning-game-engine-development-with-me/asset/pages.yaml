  md: '# GPU instances


    You can access the instance array on the GPU side, you''ll change the vertex shader.

    In Shaders.metal, add these parameters to vertex_main:


    ```

    constant Instances *instances [[ buffer(BufferInstances) ]];

    uint instanceID [[ instance_id ]]

    ```


    The first parameter is the array of matrices, and the second — with the \ [[ instance_id
    ]] Metal Shading Language attribute — holds the index into the instances array.


    > Note: If you''re rendering a grid of plants, for example, you could also use
    [[ instance_id ]] to calculate the position in the grid instead of seeding data
    in a buffer.


    Change the assignments to include the matrices for the particular instance:


    ```

    Instances instance = instances[instanceID];

    out.position = uniforms.projectionMatrix * uniforms.viewMatrix

    * uniforms.modelMatrix * instance.modelMatrix

    * vertexIn.position

    out.worldPosition = (uniforms.modelMatrix) * vertexIn.position

    * instance.modelMatrix.xy;

    out.worldNormal = uniforms.normalMatrix * instance.normalMatrix

    * vertexIn.normal;

    out.worldTangent = uniforms.normalMatrix * instance.normalTangent

    * vertexIn.tangent;

    out.worldBitangent = uniforms.normalMatrix * instance.normalBitangent

    * vertexIn.bitangent;

    ```


    You include the matrices for each instance in the position and normal calculations.

    With this separation of Prop modelMatrix and instance modelMatrix, you can treat
    the nProp as a group. By changing the transform of the Prop, it will affect all
    the instances, so that you can, for example, move one patch of grass or a forest
    on each. Each instance is then identified by its own modelMatrix.


    You''ve completely setting up an instance system, and you can now use it in your
    scene.

