  md: '# Where to go from here?


    You''ve covered a lot of lighting information in this chapter. You''ve done most
    of the critical code in the fragment shader, and this is where you can affect
    the look and style of your scene most.


    You''ve done some weird and wonderful calculations by passing values through the
    vertex function to the fragment function and working out dot products between
    surface normals and various light directions. The formulas you used in this chapter
    are a small cross-section of computer graphics research that various brilliant
    mathematicians have come up with over the years. If you want to read more about
    lighting, in **references.markdown** in the Resources folder for this chapter
    you''ll find some interesting sites.


    In the next chapter, you''ll learn another important method of changing a surface
    looks: Texturing.'
