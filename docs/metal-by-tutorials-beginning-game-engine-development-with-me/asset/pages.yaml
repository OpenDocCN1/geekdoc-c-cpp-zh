    ![](img/8d763acb335ab213ea9213a628f7d844_571_0.png)


    The holy grail of realistic water, however, is having a Fresnel effect that harmoniously
    combines reflection and refraction based on the viewing angle.


    # 6. The Fresnel effect


    The Fresnel effect is a concept you''ve met with previous chapters. As you may
    remember, the viewing angle plays a significant role in the amount of reflection
    you can see. What''s new in this chapter is that the viewing angle also affects
    refraction but in inverse proportion:


    +   - The steeper viewing angle is, the weaker the reflection and the stronger
    the refraction.


    +   - The shallower viewing angle is, the stronger the reflection and the weaker
    the refraction.'
