    +   **Node:** This is the base class for everything that needs a transform matrix.
    The .obj models, camera and lights will all need position information, so they
    will eventually be subclasses of Node. The transform information in Node abstracts
    away the matrices. So you just set the position, rotation and scale of a Node,
    and Node will automatically update its model matrix.


    +   **Camera:** All the code dealing with the view matrix and the projection matrix
    is now abstracted into a Camera class. By having Camera as a subclass of Node,
    you can give the camera position which will automatically update the view matrix.
    This will make it easier, later on, to move about the scene or have a First or
    Third Person camera. In Camera, you can also update field of view and aspect ratio
    properties which will affect the projection matrix.


    +   **Model:** Most of the code from Renderer''s init(metalView:) that set up
    the train is now in Model. You can simply set a Model instance with a name and
    Model will load the .obj file into a mesh with submeshes.


    +   **Submesh:** The submeshes are in a class of their own. Submesh will later
    hold surface material information.


    Renderer now has a models property which is an array of Models. You''re no longer
    limited to just one train. To render a second model, you create a new instance
    of Model, specifying the .obj file. You can then append the model to Renderer''s
    models array and change the new model''s position, rotation and scale at any time.


