  md: "Take a look at fragment_main() in Shaders.metal. Currently, you're defining\
    \ the color of the model using baseColor as a constant float3(1, 1, 1) (white).\
    \ In this chapter, you'll replace that constant with a pixel color from a texture.\
    \ Initially, you'll use lowpoly-house-color.png included in the group Models >\
    \ LowPolyHouse.\n\nTo read the image in the fragment function, these are the steps\
    \ you'll take:\n\n+   1. Add texture UV coordinates to the model's vertex descriptor.\n\
    2. Add a matching UV coordinates attribute to the shader's VertexStruct.\n3. Load\
    \ the image using a protocol extension method.\n4. Pass the loaded texture to\
    \ the fragment function before drawing the model.\n5. Change the fragment function\
    \ to read the appropriate pixel from the texture.\n\n# 1. Add UV coordinates to\
    \ the vertex descriptor\n\nAs you learned previously, when you unwrap a model\
    \ in Blender (or the modeling app of your choice), you set the UV coordinates\
    \ with the model. To load this in your app, Model I/O needs to have a texture\
    \ coordinate attribute set in the vertex descriptor.\n\nFirst, set up the index\
    \ number for the texture coordinate attribute in Common.h. Find the Attributes\
    \ enum and change it to:\n\n```\ntypedef enum {\n    Position = 0,\n    Normal\
    \ = 1,\n    UV = 2\n} Attributes;\n```\n\nSaving on typing, UV references TextureCoordinates.\n\
    In Model.Swift, add a new attribute to the de-fault defaultVertexDescriptor:\n\
    \n```\nvertexDescriptor.attributes[Int(UV.rawValue)] = =\nMDLVertexAttribute(name:\
    \ MDLVertexAttributeTextureCoordinate,\nformat: .float2,\noffset: 24, bufferIndex:\
