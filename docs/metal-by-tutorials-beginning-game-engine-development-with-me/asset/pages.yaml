  md: '# Physically based rendering


    To achieve spectacular scenes, you need to have good textures, but lighting plays
    an even more significant role. In recent years, the concept of physically based
    rendering (PBR) has become much more popular than the simplistic Phong shading
    model. As its name suggests, PBR attempts realistic interaction of light with
    surfaces. Now that Augmented Reality has become part of our lives, it''s even
    more important to render your models to match their physical surroundings.


    The general principles of PBR are:


    +   * Surfaces should not reflect light than they receive.

    * Surfaces can be described with known, measured physical properties.


    The Bidirectional Reflectance Distribution Function (BRDF) defines how a surface
    responds to light. There are various highly mathematical BRDF models for both
    diffuse and specular, but the most common are Lambertian diffuse; and for the
    specular, variations on the Cook-Torrance model (presented at SIGGRAPH 1981).
    This takes into account:


    +   * **microfacet slope distribution:** You learned about microfacets and how
    light bounces off surfaces in many directions in Chapter 5, "Lighting Fundamentals.\n*
    **Fresnel:** If you look straight down into a clear lake, you can see through
    it to the bottom, however, if you look across the surface of the water, you only
    see a reflection like a mirror. This is the Fresnel effect, where the reflectivity
    of the surface depends upon your viewing angle.

    * **geometric attenuation:** Self-shadowing of the microfacets.


    Each of these components have different approximations, or models written by many
    clever people. This is a vast and complex topic! In the Resources folder for this
    chapter, **references.markdown** contains a few places where you can learn about
    physically based rendering and the calculations involved. You''ll also learn more
    about BRDF and Fresnel in Chapter 20, "Advanced Lighting."


    Artists generally provide some textures with their models that supply the BRDF
    values. Here are the most common:


    +   * **Albedo:** You already met the albedo map in the form of the base color
    map. Albedo is originally an astronomical term describing the measurement of diffuse
    reflection of solar radiation, but it has come to mean in computer graphics the
    surface color without any shading applied to it.


    ![](img/8d763acb335ab213ea9213a628f7d844_196_0.png)'
