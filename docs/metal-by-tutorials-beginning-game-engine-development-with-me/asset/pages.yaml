  md: '# Deferred rendering


    Before this chapter you''ve been using forward rendering but assume you have a
    hundred models (or instances) and a hundred lights in the scene. Suppose it''s
    a metropolitan downtown where the number of buildings and street lights could
    easily de amount to the number of the objects in this scene.


    With forward rendering, you render all of the models and process all of the lights
    in the fragment shader, for every single fragment, even though the final render
    may exclude a particular fragment. This can easily become a quadratic runtime
    problem that seriously decreases the performance of your app.


    Deferred rendering, on the other hand, does two things:


    +   It collects information such as material, normals and positions from the models
    and stores them in a special buffer — traditionally named the G-buffer where G
    is for Geometry — for later processing in the fragment shader; by time, the GPU
    only sees visible fragments, unnecessary calculation does not occur.


    +   It processes all of the lights in a fragment shader, but only on the final
    visible fragments.


    ![](img/8d763acb335ab213ea9213a628f7d844_397_0.png)


    This approach takes the quadratic runtime down to linear runtime since the lights''
    processing loop is only performed once, and not for each model.'
