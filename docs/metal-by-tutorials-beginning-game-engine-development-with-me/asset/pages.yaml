- img_proc: true
  md: 'The house started as a cube but has four extra vertices, two of which raise
    the roof.


    ![](img/8d763acb335ab213ea9213a628f7d844_147_0.png)


    To texture the model, you first have to flatten it using a process called UV unwrapping.
    With unwrapping, you create a UV map by unfolding the model; this unfolding can
    be done by marking and cutting seams using your modeling app. The following image
    is the result of UV unwrapping the house in Blender and exporting the UV map:


    ![](img/8d763acb335ab213ea9213a628f7d844_147_1.png)


    The walls of the house have been marked as seams so they can lie flat; the roof
    has also been separated out by marking seams as well. If you print this UV map
    on paper and cut it out, you can fold it back into the house model. In Blender,
    you have complete control'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'of where the seams are, and how to cut up your mesh. Blender automatically
    unwraps the model by cutting the mesh at these seams, but if necessary, you can
    also move every vertex in the UV Unwrap window to suit your texture.


    Now that you have a flattened map, you can paint on it using the UV map exported
    from Blender as a guide. This is the house texture made in Photoshop. It was created
    by cutting up a photo of a real house.


    ![](img/8d763acb335ab213ea9213a628f7d844_148_0.png)


    Note how the edges of the texture aren''t perfect, and there''s a copyright message.
    In the spaces where there are no vertices in the map, you can put whatever you
    want, as it won''t show up on the model. It''s a good idea not to match the UV
    edges exactly, but to let the color bleed, sometimes computers don''t accurately
    compute floating point numbers.


    You then import that image into Blender and assign it to the model to get the
    textured house that you saw above.


    When you export a UV mapped model to an .obj file, Blender adds the UV coordinates
    to the file. Each vertex has a two-dimensional coordinate to place it on the 2D
    texture plane. The top-left is (0, 1) and the bottom-right is (1, 0).'
