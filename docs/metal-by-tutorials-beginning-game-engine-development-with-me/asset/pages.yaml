  md: '# Metal by Tutorials


    # Chapter 13: Instancing & Procedural Generation


    This usually means that the struct format in the vertex shader doesn''t match
    the contents of the MTLBuffer, which you''ll fix now.


    # Packed floats


    In Apple''s Metal Shading Language Specification, available at https://developer.apple.com/metal/Metal-Shading-Language-Specification.pdf,
    you can see the size and alignment of vector data types.


    | Type | Size (in bytes) | Alignment (in bytes) |

    | --- | --- | --- |

    | float3 | 16 | 16 |

    | float4 | 16 | 16 |

    | packed_float3 | 12 | 4 |

    | packed_float4 | 16 | 4 |


    A float3 has an alignment of 16 bytes; each field of the struct must start at
    the alignment offset, and the compiler inserts padding where needed. This will
    change the size of the stride of VertexIn, so the vertex shader doesn''t read
    the data correctly. Your VertexIn struct currently contains float types, and you''ll
    need to change these to packed_float types.


    The packed_float3 type has an alignment of only 4 bytes with a size of 12 bytes,
    the stride will be consistent with the actual data in the buffer.


    | 0 | 1 | Pad | 0 | 0.5 | Pad | 0.2 | 0.1 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | | float3 | | float3 | | float2 |

    | | | | | | | | | | | packed_float3 | packed_float3 | packed_float2 |


    This is one problem; however, there is another problem: The vertex descriptor
    has a stride of 40 bytes, as you may have noticed printing out in the debug console.
    The actual stride in the buffer is 32 bytes: 12 + 28.


    In Nature.swift, where you define the mdlVertexDescriptor property, after:


    ```

    var offset = 0

    ```


    Add this:


    ```

    let packedFloat3Size = MemoryLayout<Float>.stride * 3

    ```


    raywenderlich.com


    368'
