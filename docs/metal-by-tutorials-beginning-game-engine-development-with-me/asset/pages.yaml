    # # Loading the animation


    Before rendering the posed mesh on each frame, you need to get the skeleton''s
    joints calculated for the current time.


    Getting the joints is similar to loading keyframes (as you did with the ball earlier
    in the chapter). The main difference is that you''ll do this for all of the joints.
    You''ll iterate through the joint hierarchy and calculate the rotation and translation
    in joint space, starting at the root joint node.


    For example, in this animation, the forearm swings by 45°. All the other joints''
    rotations and translations will be 0.


    ![](img/8d763acb335ab213ea9213a628f7d844_230_1.png)'
