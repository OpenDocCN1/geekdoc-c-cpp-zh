  md: '![](img/8d763acb335ab213ea9213a628f7d844_533_0.png)


    # Ambient occlusion


    Ambient occlusion (AO) is a global shading technique, unlike the Phong local shading
    technique you learned about in Chapter 5, "Lighting Fundamentals". AO is used
    to calculate how exposed each point in a scene is to ambient lighting which is
    determined by the neighboring geometry in the scene.


    AO is, however, a weak variant of global illumination. It looks like a scene on
    a rainy day and feels like a non-directional, diffuse shading effect. For hollow
    objects, AO makes the interior look darker because the light is even more occluded
    inside. As you move towards the edges of the object, it looks lighter and lighter.


    Only large objects are taken into consideration when computing the amount of ambient
    light, such as the sky, walls or any other objects that would normally be big
    enough to cast a shadow if they were lit. AO is usually a fragment post-processing
    technique. However, you are looking into it in this chapter because AO is a type
    of shadow.'
