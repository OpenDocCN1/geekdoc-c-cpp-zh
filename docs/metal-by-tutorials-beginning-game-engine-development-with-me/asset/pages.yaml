  md: '# # Chapter 9: The Scene Graph


    By Caroline Begbie


    In this chapter, you''ll modify your rendering engine and begin architecting your
    game by abstracting rendering code away from scene management. Game engines can
    include features such as physics engines and sound. The game engine you''ll produce
    in this chapter doesn''t have any high-end features, but it''ll help you understand
    how to integrate other components as well as give you the foundation needed to
    add complexity later.


    For this exercise, you''ll create a scene with a drivable car and a controllable
    player. This should whet your appetite and provide inspiration for making your
    own games, which is after all, but this book is all about!


    # ## Scenes


    A scene can consist of one or more cameras, lights and models. In the scene you''ll
    be building, each model can be a prop or a character.


    ![](img/8d763acb335ab213ea9213a628f7d844_240_0.png)'
