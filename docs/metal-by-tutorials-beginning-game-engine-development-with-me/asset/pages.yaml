  md: 'For efficiency, you should set winding order and enable back-face culling in
    the pipeline state.


    At this point, primitives are fully assembled from connected vertices and they
    move on to the rasterizer.


    # 4 - Rasterization


    There are two modern rendering techniques currently evolving on separate paths
    but sometimes used together: **ray tracing** and **rasterization**. They are quite
    different; both have pros and cons.


    Ray tracing — which you''ll read more about in Chapter 18, "Rendering with Rays"
    — is preferred when rendering content that is static and far away, while rasterization
    is preferred when the content is closer to the camera and more dynamic.


    With ray tracing, for each pixel on the screen, it sends a ray into the scene
    to see if there''s an intersection with an object. If yes, change the pixel color
    to that, but only if the object is closer to the screen than the previously saved
    object for the current pixel.


    Rasterization works the other way around: for each object in the scene, send rays
    back into the screen and check which pixels are covered by the object. Depth information
    is kept the same way as ray tracing, so it will update the pixel color if the
    current object is closer than the previously saved one.


    At this point, all connected vertices sent from the previous stage need to be
    represented on a two-dimensional grid using their X and Y coordinates. This step
    is known as the **triangle setup**.


    Here is where the rasterizer needs to calculate the slope or steepness of the
    line segments between any two vertices. When the three slopes for the three vertices
    are known, the triangle can be formed from these edges.


    Next, a process called **scan conversion** runs on each line of the screen to
    look for intersections and to determine what is visible and what is not. To draw
    on the screen this point, only the vertices and the slopes they determine are
    needed.'
