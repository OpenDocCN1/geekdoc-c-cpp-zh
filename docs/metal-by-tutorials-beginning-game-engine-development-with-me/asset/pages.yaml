  md: "# Metal by Tutorials\n\n# Chapter 21: Metal Performance Shaders\n\n> **Note:**\
    \ For a complete list of MPS kernels, consult Apple's official page at https://developer.apple.com/documentation/metalperformancesshaders/image_filters.\
    \ If you want to implement your own filters, you can get inspired by Gimp's list\
    \ at https://docs.gimp.org/filters/html.\n\nAn RGB image is nothing but a matrix\
    \ with numbers between 0 and 255 (when using 8-bit color channels). A grayscale\
    \ image has only one such matrix because it has only one channel. For color images,\
    \ there are three separate RGB channels (red, green, blue) so consequently three\
    \ matrices, one for each channel.\n\nOne of the most important operations in image\
    \ processing is **convolution** which is an operation consisting of applying a\
    \ much smaller matrix, often called the kernel, to the original image and obtaining\
    \ the desired effect as a result. As an example, this matrix is used for obtaining\
    \ Gaussian blur:\n\n```\n```\n 1 2 1\n 2 4 2\n 1 2 1\n```\n```\n\n> **Note:**\
    \ You can find a list of common kernels at https://en.wikipedia.org/wiki/Kernel_(image_processing)\n\
    \nHere's a diagram showing how the kernel is applied to two pixels:\n\n![](img/8d763acb335ab213ea9213a628f7d844_579_0.png)\n\
    \nAnd here's how the result shown in green was calculated:\n\n```\n```\n(6 * 1\
