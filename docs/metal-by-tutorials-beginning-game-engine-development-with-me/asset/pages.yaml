  md: '# Metal by Tutorials


    # Chapter 21: Metal Performance Shaders


    Notice how only half of the tree and part of the train were bright enough to make
    it to this texture. These white areas are all you need to create the bloom effect.


    Before using this texture, you need to add a little fuzziness to it which will
    make the model edges appear to glow. You can accomplish this with another MPS
    kernel — the Gaussian blur.


    # Gaussian blur


    MPSImageGaussianBlur is a filter that convolves an image with a Gaussian blur
    with a given sigma value (the amount of blur) in both the X and Y directions.


    In Renderer.swift, in draw(in:), locate MPS blur filter, and add this code:


    ```

    let blur = MPSImageGaussianBlur(device: Renderer.device, sigma: 9.0)

    blur.label = "MPS blur"

    blur.encode(commandBuffer: commandBuffer, inPlaceTexture: &outputTexture, fallbackCopyAllocator:
    nil)

    ```


    In-place encoding is a special type of encoding where, the curtains, the input
    texture is processed, to a temporary texture and finally written back to the input
    texture without the need for you to designate an output texture.


    The fallbackCopyAllocator argument allows you to provide a closure where you can
    specify what will happen to the input image should the in-place normal encoding
    fail.


    Build and run the project, and you will see the result of this blur.


    ![](img/8d763acb335ab213ea9213a628f7d844_584_0.png)


    # Image add


    The final part of creating the bloom effect is to add the pixels of this blurred
    image to the pixels of the original render.'
