  md: '# The starter project


    Of course, you can add these objects in your Renderer, but what happens when you
    add to some game logic or have them interact with other things? One option is
    to add this interaction in update(deltaTime): However, doing so tends to get impractical
    as additional interactions are needed. A better way is to create a Scene class
    and abstract the game logic from the rendering code.


    To accomplish this, you will first recreate the starter project''s initial render
    using a Scene class. Once you have that, you will be able to move the skeleton
    and drive the car without worrying about what Metal and the GPU are doing behind
    the curtain.


    The starter project for this chapter. For the most part, this project is similar
    to the previous chapter; however, there are a few changes.


    +   - The main addition is an input controller located in the Utility group.

    - The storyboard''s MTKView is subclassed to be a GameView, which captures key
    presses.

    - GameView passes the user interaction to InputController (more on that later!),
    which then handles the key presses. In this chapter, the iOS target is not included,
    however, there is a combined-targets sample project that uses Core Motion for
    steering in iOS.


    The other significant change is in Character. In the previous chapter, you were
    only able to play one animation. With a few small changes, you can now play, pause
    and stop named animations, of which the skeleton has four: sit, walk, idle and
    wave. Blender prefixes these names with the name of the armature; for example,
    walk is named "Armature-walk".


    Build and run the starter project. If all goes well, you''ll see the ground and
    car Props, as well as the skeleton Character with a paused, single frame “Armature-idle"
    animation.'
