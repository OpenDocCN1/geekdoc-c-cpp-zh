- img_proc: true
  md: "# Metal by Tutorials\n\nIn Character.swift, in the Renderable extension, create\
    \ this recursive method:\n\n```\nfunc calculateJoints(node: CharacterNode, time:\
    \ Float) {\n  // 1\n  if let nodeAnimation = animations[].nodeAnimations[node.index]\
    \ {\n    // 2\n    if let translation = nodeAnimation.translation(time: time)\
    \ {\n      node.translation = translation\n    }\n    if let rotationQuaternion\
    \ = nodeAnimation.getRotation(time: time) {\n      node.rotationQuaternion = rotationQuaternion\n\
    \    }\n    // 3\n    for child in node.children {\n      calculateJoints(node:\
    \ child, time: time)\n    }\n  }\n```\n\nGoing through the code:\n\n+   1. Get\
    \ the animation for the current node if there is one.\n2. Set the translation\
    \ and rotation for the current node at the current time, just as you did for the\
    \ ball.\n3. Do the same for all node's children (recursively).\n\nStill in Character.swift,\
    \ add a property to contain the current time:\n\n```\nvar currentTime: Float =\
    \ 0\n```\n\nin update(deltaTime:), add this:\n\n```\nguard animations.count >\
    \ 0 else { return }\ncurrentTime += deltaTime\nlet time = fmod(currentTime, animations[].duration)\n\
    ```\n\nHere, you check for an animation and use modulo to find out the current\
    \ position within the animation. For example, if the current time is 4.5, and\
    \ the animation duration is 3.0, the current time in the animation will be 1.5.\n\
    \nNow, continue in update(deltaTime:), and process each mesh node:\n\n```\nfor\
    \ node in meshNodes {\n  if let rootNode = node.skin?.skeletonRootNode {\n   \
    \ calculateJoints(node: rootNode, time: time)\n  }\n}\n```\n\n![](img/8d763acb335ab213ea9213a628f7d844_231_0.png)"
