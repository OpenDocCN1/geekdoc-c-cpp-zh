    Going through the code:


    +   1. Check whether you''re inside the sphere. On the first intersection, the
    ray is now inside the sphere, so turn inside to true and the refraction. On the
    second intersection, the ray now leaves the sphere, so turn inside to false, and
    refraction no longer occurs.


    +   2. Set the index of refraction (IOR) based on the ray direction. IOR for water
    is 1.33. The ray is first going-to-water, then it''s going-to-air in which case
    the IOR becomes 1 / 1.33.


    Add this function to your kernel compute function:


    ```

    Camera refractRay(Camera cam, float3 n, float eps, float ior) {

    cam.ray.origin -= n * eps * 2.0;

    cam.ray.dir = refract(cam.ray.dir, n, ior);

    return cam;

    }

    ```


    The MSL standard library also provides refract() function, so you''re just building
    a convenience function around it. Subtract the distance this time because the
    ray is inside the sphere.


    You also double the eps value, which is enough to move far enough inside to avoid
    another collision.'
