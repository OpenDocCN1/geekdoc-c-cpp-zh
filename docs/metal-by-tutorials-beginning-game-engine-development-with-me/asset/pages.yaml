  md: '# Metal by Tutorials


    Resize the two vectors into unit vectors – that''s vectors with a length of 1.
    You can do this using the normalize() function. If the unit vectors are parallel
    with the direction, the dot product result will be 1. If they are parallel opposite
    directions, the result will be -1. If they are at right angles (orthogonal), the
    result will be 0.


    ![](img/8d763acb335ab213ea9213a628f7d844_129_0.png)


    Looking at the previous diagram, if the yellow (sun) vector is pointing straight
    down, and the blue (normal) vector is pointing straight up, the dot product will
    be -1. This value is the cosine angle between the two vectors. The great thing
    about cosines is that they are always values between -1 and 1 you can use this
    range to determine how bright the light should be at a certain point.


    Take the following example:


    ![](img/8d763acb335ab213ea9213a628f7d844_129_1.png)


    The sun is pouring down from the sky with a direction vector of [2, -2, 0]. Vector
    A is a normal vector of [-2, 2, 0]. The two vectors are pointing in opposite directions,
    so when you turn the vectors into unit vectors (normalize them), the dot product
    of them will be -1.


    Vector B is a normal vector of [0.3, 2, 0]. Sunlight is a directional light, so
    uses the same direction vector. Sunlight and B when normalized have a dot product
    of -0.59.'
