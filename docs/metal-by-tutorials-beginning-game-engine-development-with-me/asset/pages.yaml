  md: '# # Chapter 13: Instancing & Procedural Generation

    By Caroline Begbie


    Now that you have an environment with a sky that you can populate with terrain,
    characters and props, you''ll need to add some random objects. Trees and grass
    make the scene more natural, but they can take up a lot of valuable resources
    without adding any player action to your game.


    In this chapter, you''ll find out how to efficiently render many trees and blades
    of grass using **instancing**. You''ll then render instanced rocks, and you''ll
    use **morphing** for different shapes. Finally, you''ll create a procedural house
    system that will create a row of houses whose size and style will change every
    time you run the app.


    As well as all that, you''ll improve your versatility and proficiency in handling
    GPU resources which will enable you to access any data in MTLBuffers with confidence.


    # ## The starter project


    Open the starter project for this chapter. This is almost the same project as
    the previous chapter, but it includes a new GameScene that renders twenty-five
    trees in random places. Each tree consists of 9,119 vertices, with a color texture
    of 8 MB and 2048×2048 pixels.


    > Note: You generally wouldn''t spend 9,119 vertices just on a tree, unless you
    wanted some fine detail. Low-poly trees are much more efficient. However, this
    example will show you how important instancing is.


    The project also contains two other scenes with supporting files for later sections
    in which you''ll create a rock system and perform procedural house generation.'
