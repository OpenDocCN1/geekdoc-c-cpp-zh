  md: '# Metal by Tutorials


    # Chapter 3: The Rendering Pipeline


    The scan algorithm determines if all the points on a line segment, or all the
    points inside of a triangle are visible, in which case the triangle is filled
    with color entirely.


    ![](img/8d763acb335ab213ea9213a628f7d844_76_0.png)


    For mobile devices, the rasterization takes advantage of the tiled architecture
    of PowerVR GPUs by rasterizing the primitives in a 32x32 tile grid in parallel.
    In this case, 32 is the number of screen pixels assigned to a tile but this size
    perfectly fits the number of cores in USC.


    What if one object is behind another object? Can the rasterizer determine which
    object to render? This hidden surface removal problem can be solved by using stored
    depth information (early-Z testing) to determine whether each point is in front
    of other points in the scene.


    After rasterization is finished, three more specialized hardware units take the
    stage:


    +   * A buffer called Hierarchical-Z is responsible for removing fragments that
    were marked for culling by the rasterizer.


    +   * The Z and Stencil Test then removes non-visible fragments by comparing them
    against the depth and stencil buffer.


    +   * Finally, the Interpolator takes the remaining visible fragments and generates
    fragment attributes from the assembled triangle attributes.


    At this point, the Scheduler unit again dispatches work to the shader cores, but
    this time it''s the rasterized fragments sent for Fragment Processing.'
