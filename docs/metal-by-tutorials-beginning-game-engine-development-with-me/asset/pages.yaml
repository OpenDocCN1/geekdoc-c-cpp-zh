  md: 'A rule, when you compile and link your Metal shaders, internally, the Xcode
    compiler builds to a .air file. The linker then this .air file to a .metallib
    file and includes it with the app resources. The default library with all the
    Metal shader functions is called default.metallib.


    > Note: To view your default library in Finder, build your project, and under
    the Products group Ctrl-click CarGame-macOS.app. Choose Show In Finder. Ctrl-click
    the app file in Finder and Choose Package Contents. Under Contents Resources,
    you''ll find the Metal library with compiled shaders default.metallib.


    Core Image kernels require extra flags when compiling and linking. If you create
    a project that doesn''t already use Metal, you can set these flags in the Target
    Build Settings, however, in this project, those Build Settings would conflict
    with your existing Metal shaders.


    The answer is to compile and link the kernel through the command line in Terminal.

    Open a window and navigate to the directory that contains CIBlend.metal.


    Run these two commands to compile and link the Core image kernel:


    ```

    xcrun -sdk macos metal -c -fcikernel CIBlend.metal -o CIBlend.air

    xcrun -sdk macos metal -c -fcikernel CIBlend.air -o CIBlend.metallib

    ```


    Alternatively, for iOS:


    ```

    xcrun -sdk iphoneos metal -c -fcikernel CIBlend.metal -o CIBlend.air

    xcrun -sdk iphoneos metal -c -fcikernel CIBlend.air -o CIBlend.metallib

    ```


