  md: 'Assuming you already created a device object, a command queue, a command buffer
    and a texture object for the input image, there are only two lines of code you
    need to apply the Sobel filter to your input image:


    ```

    let shader = MPSImageSobel(device: device)

    shader.encode(commandBuffer:commandBuffer,

    sourceTexture:inputImage,

    destinationTexture:drawable.texture)

    ```


    MPS kernels are not thread-safe, so it''s not recommended to run the kernel on
    multiple threads that are all writing to the same command buffer concurrently.


    Moreover, you should always allocate your kernel to only one device, because the
    kernel''s init(device:) method could allocate resources that are held by the current
    device and might not be available to another device.


    > Note: MPS kernels provide a copy(with:device:) method that allows them to be
    copied to another device.


    The MPS framework serves a variety of purposes beyond image filters. One of those
    areas is Neural Networks, which is not covered in this book. Instead, you''ll
    stay focused on:


    +   1. Image processing.

    2. Matrix/vector mathematics.

    3. Ray tracing.


    # # Image processing


    There are few dozen MPS image filters, among the most common being:


    +   - Morphological (area min, area max, dilate, erode).

    - Convolution (median, box, tent, Gaussian blur, Sobel, Laplacian, and so on).

    - Histogram (histogram, histogram equalization, histogram specification).

    - Threshold (binary, binary inverse, to zero, to zero inverse, and so on).

    - Manipulation (conversion, Lanczos scale, bilinear scale, transpose).'
