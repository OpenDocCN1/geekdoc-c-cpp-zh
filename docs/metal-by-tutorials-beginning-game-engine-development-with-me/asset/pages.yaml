  md: "# The skybox shader functions\n\nIn the Metal Shaders group, add a new Metal\
    \ file named Skybox.metal. Again, add this file to both the macOS and iOS targets.\n\
    \nAdd the following code to the new file:\n\n```\n#import \"Common.h\"\nstruct\
    \ VertexIn {\n    float4 position [[ attribute(0)]];\n};\nstruct VertexOut {\n\
    \    float4 position [[ position ]];\n};\n```\n\nThe structures are so far — you\
    \ need a position in and a position out.\n\nAdd the shader functions:\n\n```\n\
    vertex VertexOut vertexSkybox(const VertexIn in [[stage_in]],\n    constant float4x4\
    \ &vp [[buffer(1)]])\n{\n    VertexOut out;\n    out.position = (vp * in.position).xyww;\n\
    \    return out;\n}\n\nfragment half4 fragmentSkybox(VertexOut in [[stage_in]])\
    \ {\n    return half4(1, 1, 0, 1);\n}\n```\n\nTwo simple shaders — the vertex\
    \ function moves the verts to the projected position, and the fragment function\
    \ returns yellow. This is a temporary color, which is startling enough that you'll\
    \ be able to see where the skybox renders.\n\nNotice in the vertex function that\
    \ you swizzled the xyzw position to xyww. To place the sky as far away as possible,\
    \ it needs to be at the very edge of NDC.\n\nDuring the change from clip space\
    \ to NDC, the coordinates are all divided by w during the perspective divide stage.\n\
    \nThis will now result in the z coordinate being 1, which will ensure that the\
    \ skybox renders behind everything else within the scene."
  merge: -1
