  md: '# Metal by Tutorials


    # Chapter 15: Performance Optimization


    A naive way to attempt solving the synchronization issue you''re having is to
    use the waitUntilCompleted() function on your command buffer. A more performant
    way, however, is the use of a synchronization primitive called a semaphore, which
    is a convenient way of keeping track of the available resources — your triple
    buffer in this.


    The way a semaphore works is you:


    +   - Initialize it to a maximum value that represents the number of resources
    in your pool (3 buffers here).


    +   - Inside the draw call the thread tells the CPU to wait until a resource is
    available and if one is, it takes and decrements the semaphore value by one.


    +   - If there are no more available resources, the current thread is blocked
    until the semaphore has at least one resource available.


    +   - When a thread finishes using the resource, it will signal the semaphore
    by increasing its value and releasing the hold on the resource.


    Time to put this theory into practice.


    At the top of the Renderer, add this new property:


    ```

    var semaphore: DispatchSemaphore

    ```


    In init(metalView), add this line before super.init():


    ```

    semaphore = DispatchSemaphore(value: Scene.buffersInFlight)

    ```


    Add this line at the top of draw(in):


    ```

    _ = semaphore.wait(timeout: .distantFuture)

    ```


    At the end of draw(in), before committing the command buffer, add this:


    ```

    commandBuffer.addCompletedHandler { _ in

    self.semaphore.signal()

    }

    ```


    Build and run the project again, making sure everything still renders fine as
    before.


    ![](img/8d763acb335ab213ea9213a628f7d844_437_0.png)


    438'
