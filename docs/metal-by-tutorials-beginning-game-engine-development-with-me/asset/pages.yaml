    # Diffuse reflection


    Light comes from all around us. Sunlight bounces around and colors reflect. When
    rendering an object, you should take into account the color of the light coming
    from every direction.


    ![](img/8d763acb335ab213ea9213a628f7d844_341_0.png)


    This is somewhat of an impossible task, but you can use convolution to compute
    a cube map called an irradiance map from which you can extract lighting information.
    You won''t need to know the mathematics behind this: Model I/O comes to the rescue
    again!


    Included in the starter project is a fragment shader already set up in IBL.metal.
    Look at fragment_IBL in that file. The shader reads all of the possible textures
    for a Prop and sets values for:


    +   - base color


    +   - normal


    +   - roughness


    +   - metallic (this should be 0 or 1)


    +   - ambient occlusion'
