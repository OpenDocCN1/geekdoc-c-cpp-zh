    # # Quaternions


    Multiplying x, y and z rotations without compelling a sequence on them is impossible
    unless you involve the fourth dimension. In 1843, Sir William Rowan Hamilton just
    just that! He inscribed his fundamental formula for quaternion multiplication
    on to a stone on a bridge in Dublin:


    ```

    i² = j² = k² = ijk = -1

    ```


    The formula uses four-dimensional vectors and complex numbers to describe rotations.
    The mathematics is complicated, but fortunately, you don''t have to understand
    how quaternions work to use them. The main benefit of quaternions are:


    +   - They interpolate correctly when using spherical linear interpolation (or
    slerp).

    - They never lose any axes of control.

    - They always take the shortest path between two rotations unless you specifically
    for the longest path.


    > Note: If you''re interested in studying the internals of quaternions, references.markdown
    contains further reading.


    You don''t have to write any complicated interpolation code, as simd has quaternion
    classes and methods that handle it all for you using simd_lerp(). The quaternions
    perform a spherical interpolation along the shortest path as described here:


    ![](img/8d763acb335ab213ea9213a628f7d844_215_0.png)


    raywenderlich.com


    216'
