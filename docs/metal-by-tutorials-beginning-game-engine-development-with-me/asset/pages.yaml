  md: "# Winding order\n\nThe vertex order, also called winding order, is important\
    \ here. This vertex order is counter-clockwise, as is the default .obj winding\
    \ order. With a counter-clockwise winding order, triangles that are defined in\
    \ counter-clockwise order are facing towards you. Any triangles that are in clockwise\
    \ order are therefore facing away from you.\n\nIn the next chapter, you'll go\
    \ down the graphics pipeline and you'll see that the GPU can cull triangles that\
    \ are not facing you, thus saving valuable processing time.\n\n# Render submeshes\n\
    \nCurrently, you're only rendering the first submesh, but because the train has\
    \ several material groups, you'll need to loop through the submeshes to render\
    \ them all.\n\nAt the end of the playground, change:\n\n```\nguard let submesh\
    \ = mesh.submeshes.first else {\n    fatalError()\n}\nrenderEncoder.drawIndexedPrimitives(\n\
    \    type: .triangle,\n    indexCount: submesh.indexCount,\n    indexType: submesh.indexType,\n\
    \    indexBuffer: submesh.indexBuffer.buffer,\n    indexBufferOffset: 0\n)\n```\n\
    \nto:\n\n```\nfor submesh in mesh.submeshes {\n    renderEncoder.drawIndexedPrimitives(\n\
    \        type: .triangle,\n        indexCount: submesh.indexCount,\n        indexType:\
    \ submesh.indexType,\n        indexBuffer: submesh.indexBuffer.buffer,\n     \
    \   indexBufferOffset: submesh.indexBuffer.offset\n    )\n}\n```\n\nThis loops\
    \ through the submeshes and issues a draw call for each. The mesh and submeshes\
    \ are in MTLBuffers, and the submesh holds the index listing of the vertices in\
    \ the mesh."
