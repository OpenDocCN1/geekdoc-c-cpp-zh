    Going through the code:


    +   1. Calculate the view direction and the view direction reflected about the
    surface normal.

    2. Read the skybox texture along this reflected vector as you did earlier. Using
    the extra parameter level(n), you can specify the mip level to read. You sample
    the appropriate mipmap for the roughness of the fragment.

    3. Calculate the angle between the view direction and the surface normal, and
    use this as one of the UV coordinates to read the BRDF look-up texture. The other
    coordinate is the roughness of the surface. You receive back the red and green
    values which you''ll use to calculate the second part of the Cook Torrance equation.


    # Fresnel reflectance


    When light hits an object straight, some of the light is reflected. The amount
    of reflection is called Fresnel zero, and F0, and you can calculate this from
    the material’s index of refraction, or IOR.


