- img_proc: true
  md: 'Next, add a function that gets the distance from any point on the screen to
    a given

    rectangle boundary. If its return value is positive, a given point is outside
    the rectangle;

    all other values are inside the rectangle.


    ```

    float distanceToRectangle(float point, Rectangle rectangle) {

    // 1

    float2 distances = abs(point - rectangle.center) - rectangle.size / 2;

    return

    // 2

    all(sign(distances) > 0)

    ? length(distances)

    // 3

    : max(distances.x, distances.y);

    }

    ```


    Going through the code:


    +   1. Offset the current point coordinates by the given rectangle center. Then,
    get the

    symmetrical coordinates of the given point by using the abs() function, and

    calculate the signed distance to each of the two edges.


    +   2. If those two distances are positive, then you''ll need to calculate the
    distance to the

    corner.


    +   3. Otherwise, return the distance to the closer edge.


    > Note: In this case, rectangle.size / 2 is the distance from the rectangle center

    to an edge, similar to what a radius is for a circle.


    Next is a handy function that lets you subtract one shape from another. Think
    about Set

    Theory from back in your school days.


    ![](img/8d763acb335ab213ea9213a628f7d844_517_0.png)


    > Note: You can find out more about Set Theory here: https://en.wikipedia.org/wiki/Complement_(set_theory)#Relative_complement'
