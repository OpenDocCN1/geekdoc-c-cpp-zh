    \nAdd the following code to Scene:\n\n```\nfinal func add(node: Node, parent:\
    \ Node?) = nil, render: Bool = true) {\n    if let parent = parent {\n       \
    \ parent.add(childNode: node)\n    } else {\n        rootNode.add(childNode: node)\n\
    \    }\n    guard render == true,\n    let renderable = node as Renderable else\
    \ {\n        return\n    }\n    renderables.append(renderable)\n}\n```\n\nThis\
    \ method adds a node to the scene. When adding objects to the scene, you can optionally\
