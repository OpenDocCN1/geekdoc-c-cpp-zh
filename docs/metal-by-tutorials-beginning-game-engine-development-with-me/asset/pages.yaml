  md: 'Metal by Tutorials


    Chapter 16: Particle Systems


    In this example, the threads and threadgroups work out evenly across the grid,
    but if the size of your data does not match the size of the grid, you may have
    to perform boundary checks in the kernel function.


    In the following example, with a threadgroup size of 32 by 16 threads, the number
    of threadgroups necessary to process the image would be 10 by 13. You''d have
    to check that the threadgroup is not using threads that are off the edge of the
    image.


    Threads: 32 x 16


    Grid: 300 x 200 pixels


    Threadgroups: 10 x 13 threads (9.375 x 12.5)


    ![](img/8d763acb335ab213ea9213a628f7d844_452_0.png)


    ![](img/8d763acb335ab213ea9213a628f7d844_452_1.png)


    ![](img/8d763acb335ab213ea9213a628f7d844_452_2.png)


    The threads that are off the edge, are **underutilized threads**; that is, threads
    that you dispatched but there was no work for them to do.


    In the most recent version of iOS and macOS, it''s now possible to only specify
    the size of your grid and the size of a threadgroup. From there, Metal will figure
    out the number of threadgroups for you to use.


    | 4 by 4 | 4 by 4 | 3 by 4 |

    |---|---|---|

    | 4 by 3 | 4 by 3 | 3 by 3 |


