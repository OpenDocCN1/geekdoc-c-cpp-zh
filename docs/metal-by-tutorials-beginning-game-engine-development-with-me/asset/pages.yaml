  md: "inside factors. Next, you need to create a compute command encoder. This encoder\
    \ is similar to a render command encoder in you add commands to the encoder and\
    \ then send it off to the GPU.\n\nIn draw(in), locate the comment // tessellation\
    \ pass, and add commands to the compute command encoder.\n\nAdd this block to\
    \ create the compute encoder:\n\n```\nlet computeEncoder = commandBuffer.makeComputeEncoder()\\\
    ncomputeEncoder.setPipelineState(tessellationPipelineState)\\ncomputeEncoder.setBytes(&edgeFactors,\n\
    \    length: MemoryLayout<Float>.size * edgeFactors.count,\n    index: 0)\ncomputeEncoder.setBytes(&insideFactors,\n\
    \    length: MemoryLayout<Float>.size * insideFactors.count,\n    index: 0)\n\
    computeEncoder.setBuffer(tessellationFactorsBuffer, offset: 0, index: 2)\n```\n\
    \nThis creates a compute encoder and binds the edge and inside factors to the\
    \ compute function (the tessellation kernel).\n\nIf you have multiple patches,\
    \ the compute function will operate in parallel on each patch, with different\
    \ threads.\n\nTo tell the GPU how many threads you need, add the following code:\n\
    \n```\nlet width = min(patchCount, tessellationPipelineState.executionWidth)\n\
    tessellationthreadgroups(MTLSizeMake(patchCount, 3, 1),\n    threadsPerThreadgroup:\
    \ MTLSizeMake(width, 1, 1))\ncomputeEncoder.endEncoding(encoding)\n```\n\nMTLSize\
    \ defines a three-dimensional grid with width, height and depth. The number of\
    \ patches you have is small, so you use only one dimension. If you are processing\
    \ pixels in an image, you'd use both width and height.\n\nWith the commands GPU\
    \ needs for the compute function in place, you end the encoder by calling endEncoding().\n\
    \nBefore changing the render encoder so it'll draw patches instead of vertices,\
    \ you'll create the tessellation kernel.\n\n# The tessellation kernel\n\nOpen\
