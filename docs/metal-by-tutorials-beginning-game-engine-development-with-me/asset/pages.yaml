  md: '+   Diffuse: In theory, light coming at a surface bounces off at an angle reflected
    off the surface normal at that point. However, surfaces are microscopically rough,
    so light bounces off in all directions as the picture indicates. This produces
    a diffuse color where the light intensity is proportional to the angle between
    the incoming light and the surface normal. In computer graphics, this model is
    called Lambertian reflectance named after Johann Heinrich Lambert who died in
    1777. In the real-world, this diffuse reflection is generally true of dull, rough
    surfaces, the surface with the most Lambertian property is human-made: Spectralon
    (https://en.wikipedia.org/wiki/Spectralon), which is used for optical components.


    +   Specular: The smoother the length, the shinier it, and the light bounces off
    the surface in fewer directions. A mirror completely reflects the surface normal
    without deflection. Shiny objects produce a visible highlight and rendering specular
    lighting can give you hints about what sort of surface an object is — whether
    a is an old wreck or fresh off the shelf.


    +   Ambient: In the real-world, light bounces around all the place, as a shadowed
    object is rarely entirely black. This is the ambient reflection.


    A surface color is made up of an emissive surface color contributions from ambient,
    diffuse and specular. For diffuse and specular, to find out how much light the
    surface should receive at a particular point, all you have to do is find out the
    angle between the incoming light direction and the surface normal.


    # The dot product


    Fortately, there''s a straightforward mathematical operation to discover the angle
    between two vectors called the dot product.


    ```

    $A \cdot B = a_1b_1 + a_2b_2 + a_3b_3$

    ```


    And:


    ```

    $A \cdot B = ||A|| ||B|| \cos(\Theta)$

    ```


    Where $||A||$ means the length (or magnitude) of vector A.


    Even more fortunately, both simd and Metal Shading Language have a function dot
    () to get the dot product, so you don''t have to remember the formulas.


    As well as finding out the angle between two vectors, you can use the dot product
    for checking whether two vectors are pointing in the same direction.'
