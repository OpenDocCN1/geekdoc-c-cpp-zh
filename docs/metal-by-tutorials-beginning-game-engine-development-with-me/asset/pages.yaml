- img_proc: true
  md: '# # Chapter 6: Textures

    By Caroline Begbie


    Now that you have light in your scene, the next step is to add color. The easiest
    way to add fine details to a model is to use an image texture. Using textures,
    you can make your models to life!


    In this chapter, you''ll learn about:


    +   - UV coordinates: How to unwrap a mesh so that you can apply a texture to
    it.

    - Texturing a model: How to read the texture in a fragment shader.

    - Samplers: Different ways you can read (sample) a texture.

    - Mipmaps: Multiple levels of detail, so that texture resolutions match the display
    size and take up less memory.


    +   - The asset catalog: How to organize your textures.


    #  Textures and UV maps


    The following image shows a simple house model with twelve vertices. So you can
    experiment, the Blender and .obj files are included in the Resources ▸ LowPolyHouse
    folder for this chapter. The textured model is on the left, and the wireframe
    is on the right which shows all of the vertices.'
