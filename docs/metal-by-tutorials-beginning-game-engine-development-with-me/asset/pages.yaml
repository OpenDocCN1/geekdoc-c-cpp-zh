    # The rendering equation


    Two academic papers — one by James Kajiya and the other by David Immel et al.
    — introduced the rendering equation in 1986. In its raw form, this equation might
    look intimidating.


    ```

    $L_o(x, ω, λ, t) = L_e(x, ω, λ, t) + \int_{\Omega} f_r(x, \omega, \lambda, t)
    L_i(x, \omega, λ, t) (\omega \cdot n) d\omega$

    ```


    > Note: A friendlier of it was written recently by Pixar''s Julian Fong in a tweet.
    Check references.markdown for more information.


    The rendering equation is based on the law of conservation of energy, and in simple
    terms, it translates to an equilibrium equation where the sum of all source lights
    must equal the sum of all destination lights:


    incoming light + emitted light = transmitted light + outgoing light


    If you rearrange the terms of the equilibrium equation, you get the most basic
    form of the rendering equation:


    outgoing light = emitted light + incoming light — transmitted light


    The incoming light — transmitted light part of the equation is subject to recursion
    because multiple lights bounces at that point. That recursion translates to an
    integral over a unit hemisphere that''s centered on the normal vector at the point
    and which contains all the possible values for the negative direction of the incoming
    light.


    Although the rendering equation might be a bit intimidating, think of it like
    this: all the light leaving an object is what remains from all the lights coming
    into the object after some of them were transmitted through the object.


    The transmitted light can be either absorbed by the surface of the object (material),
    changing its color; or scattered through the object, which leads to a range of
    interesting optical effects such as refraction, subsurface scattering, total internal
    reflection, caustics and so on.'
