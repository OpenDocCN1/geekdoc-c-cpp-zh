  md: '# Point lights


    Point lights shoot out light rays in all directions.


    ![](img/8d763acb335ab213ea9213a628f7d844_138_0.png)


    Instead of defining a direction vector for the light, you define a position. You
    also specify attenuation where a ray of light doesn''t travel infinitely far.
    A light bulb will only light an area of a certain radius, beyond which everything
    is dark.


    ![](img/8d763acb335ab213ea9213a628f7d844_138_1.png)


    Light attenuation can occur abruptly or gradually. The formula for attenuation
    is:


    ```

    1.0

    x + y * distance + z * distance3

    ```


    This formula gives the curved fall-off. You''ll represent xyz with a float3. No
    attenuation at all will be float3(1, 0, 0) - substituting x, y and z into the
    formula results in a value of 1.'
