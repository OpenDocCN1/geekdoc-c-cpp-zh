    \ that conform to Renderable.\n\nReplace update(deltaTime:) with:\n\n```\nfunc\
    \ update(deltaTime: Float) {\n  for model in models {\n    model.update(deltaTime:\
    \ deltaTime)\n  }\n}\n```\n\n![](img/8d763acb335ab213ea9213a628f7d844_227_0.png)"
