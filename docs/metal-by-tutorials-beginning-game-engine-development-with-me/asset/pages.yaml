    # # Multithreading


    Build all known pipelines up front and asynchronously.


    The biggest performance gain will come from running different command buffers
    on different threads. You can split one encoder into new smaller encoders and
    run them on multiple threads using MTLParallelRenderEncoder.


    Assume in your project you have grass that takes 10ms to render; you have trees
    that take another 7ms to render; and you have rocks + skybox + ground that take
    all 5ms to render.


    Instead of having an encoder that takes 22ms to finish, you could split the encoder
    into three smaller new encoders and run them in parallel on an MTLParallelRenderEncoder
    that would have all three threads finish by the time the longer running thread
    finishes (10ms).


