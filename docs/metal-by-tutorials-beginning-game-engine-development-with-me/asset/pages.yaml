    # Integrating the skybox into the scene


    Open Scene.swift, and add a new property to Scene:


    ```

    var skybox: Skybox?

    ```


    Open SkyScene.swift This is the scene that contains the car and the ground. Add
    a skybox at the top of setUpScene():


    ```

    skybox = Skybox(textureName: nil)

    ```


    You haven''t written the code for the skybox texture yet, but soon you''ll set
    it up so that nil will give you a physically simulated sky, and a texture name
    will load a sky texture.


    In Renderer.swift, in draw(in:), toward the end of the method, locate // render
    skybox. Add this:


    ```

    scene.skybox?.render(renderEncoder: renderEncoder, uniforms: scene.uniforms)

    ```


    It may seem odd that you''re rendering the skybox last, after rendering the models,
    when it''s going to be the object''s behind everything else. Remember early-Z
    testing from Chapter 3, “The Rendering Pipeline”: when objects are rendered, most
    of the skybox fragments will be behind them and will fail the depth test. Therefore,
    it''s more efficient to render the skybox last.


    You''ve now integrated the skybox into the rendering process.'
