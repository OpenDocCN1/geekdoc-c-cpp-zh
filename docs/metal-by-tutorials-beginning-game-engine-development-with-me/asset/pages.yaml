  md: "Metal by Tutorials\n\nChapter 1: Hello, Metal!\n\n```\nlet library = try device.makeLibrary(source:\
    \ shader, options: nil)\nlet vertexFunction = library.makeFunction(name: \"vertex_main\"\
    )\nlet fragmentFunction = library.makeFunction(name: \"fragment_main\")\n```\n\
    \nThe compiler will check that these functions exist and make them available to\
    \ a pipeline descriptor.\n\n# The Pipeline State\n\nIn Metal, you set up a pipeline\
    \ state for the GPU. By setting up this state, you're telling the GPU that nothing\
    \ will change the state, and the GPU can run more efficiently. The pipeline state\
    \ contains all sorts of information that the GPU needs, such as pixel format it\
    \ should use and whether it should render with depth. The pipeline state also\
    \ holds the vertex and fragment functions that you created.\n\nHowever, you don't\
    \ create a pipeline state directly, rather you create it through a descriptor.\
    \ This descriptor holds everything the pipeline needs to know, and you only change\
    \ the necessary properties for your particular rendering situation.\n\nAdd this:\n\
    \n```\nlet descriptor = MTLRenderPipelineState()\ndescriptor.colorAttachments[0].pixelFormat\
    \ = .bgra8Unorm\ndescriptor.vertexFunction = vertexFunction\ndescriptor.fragmentFunction\
    \ = fragmentFunction\ndescriptor.vertexDescriptor = MTKLVertexDescriptorFromModel(mesh.vertexDescriptor)\n\
    ```\n\nThis sets up the descriptor with the correct shader functions and a vertex\
    \ descriptor. As its name says, the vertex descriptor describes how the vertices\
    \ are laid out in a Metal buffer. Model I/O automatically created a vertex descriptor\
    \ when it loaded the sphere mesh, so you can just use that one.\n\nCreate the\
    \ pipeline state from the descriptor:\n\n```\nlet pipelineState =\n    try device.makeRenderPipelineState(descriptor:\
    \ descriptor)\n```\n\nCreating a pipeline state takes valuable processing time,\
    \ so all of the above should be a one-time setup. In a real app, you might create\
    \ several pipeline states to call different shading functions or use different\
    \ vertex layouts.\n\nraywenderlich.com\n\n34"
