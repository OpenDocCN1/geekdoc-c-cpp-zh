    \ shader from your fragment shader and have them run in parallel but on different\
    \ SEs.\n\nCreate a new file using the Metal File template and name it Shaders.metal.\
    \ Then, add this code at the end of the file:\n\n```\n// 1\nstruct VertexIn {\n\
    \    float4 position [[ attribute(0)]];\n};\n\n// 2\nvertex float vertex_main(const\
    \ VertexIn [[ stage_in]]) {\n    return vertexIn.position;\n}\n```\n\nGoing through\
    \ this code:\n\n+   1. Create a struct VertexIn to describe the vertex attributes\
    \ that match the vertex descriptor you set up earlier. In this case, just position.\n\
    \n+   2. Implement a vertex shader, vertex_main, that takes in VertexIn structs\
    \ and returns vertex positions as float types.\n\nRemember that vertices are indexed\
    \ in the vertex buffer. The vertex shader gets the current index via the [[ stage_in\
    \ ]] attribute and unpacks the VertexIn struct cached for the vertex at the current\
    \ index.\n\nCompute Units can process (one at a time) batches of vertices up to\
    \ their maximum number of shader cores. This batch can fit entirely in the CU\
    \ cache and vertices can thus be reused as needed. The batch will keep the CU\
    \ busy until the processing is done but other CUs should become available to process\
    \ the next batch."
