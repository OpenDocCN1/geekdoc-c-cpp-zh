- img_proc: true
  md: 'The grid is defined in three dimensions: width, height and depth — but often,
    especially when you''re processing images, you''ll only work with a 1D or 2D grid.
    Every point in the grid runs one instance of the kernel function, each on a separate
    thread.


    In this example, you have an image of 512 by 384 pixels. The grid is split up
    into 384 threadgroups — that''s 16 by 24 threadgroups. Each threadgroup has 512
    threads — that''s 32 by 16 threads.


    # Grid: 512 x 384 pixels


    # 16 x 24 threadgroups


    ![](img/8d763acb335ab213ea9213a628f7d844_450_0.png)


    ![](img/8d763acb335ab213ea9213a628f7d844_450_1.png)


    32 x 16 threads


    See how a threadgroup can only affect a tiny part of the grid and process it independently
    from other threadgroups?


    Threadgroups have the advantage of executing a group of threads together and also
    share a small chunk of memory. Even though sometimes threads run independently
    of each other, it''s also common to organize threads into threadgroups so they
    can work on smaller parts of the problem, independently from other threadgroups.'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'You can choose how you split up the group. In the following image, a 16 by
    12 grid is split first into 2×3 threadgroups and secondly into 4×4 thread groups.


    # Grid: 16 x 12


    ![](img/8d763acb335ab213ea9213a628f7d844_451_0.png)


    Threadgroups: 2 x 3


    Threadgroups: 4 x 4


    Within each grid, you can locate each pixel. The red pixel in both grids is located
    at (11, 1). You can also uniquely identify each thread within the threadgroup.
    The blue threadgroup on the left is located at (1, 0), and on the right at (2,
    0). The red pixels in both grids are threads located within their threadgroup
    at (3, 1).


    You control over the number of threadgroups. However, you need to add an extra
    threadgroup to the size of the grid to make sure at least one threadgroup will
    execute.


    The following code demonstrates how you could set up the threads and threadgroups
    to process the cat image above. and you don''t need to put it into your project:


    ```

    let width = 32

    let height = 16

    let threadsPerThreadgroup = MTLSizeMake(width, height, 1)

    let gridWidth = Int(drawableSize.width)

    let gridHeight = Int(drawableSize.height)

    let threadgroupCount = MTLSizeMake((gridWidth + width - 1) / width, (gridHeight
    + height - 1) / height, 1)

    computeEncoder.dispatchThreads(threadgroupCount, threadsPerThreadgroup: threadsPerThreadgroup)

    ```


    You specify the threads per threadgroup. In this case, the threadgroup will consist
    of 32 threads, 16 width and 1 thread depth. This is a typical threadgroup for
    processing a 2D image. You calculate the threadgroup count from the grid (image)
    width and height. In this case, the image size is 512 by 584 pixels, so threadgroupCount
    will be calculated as (16, 24, 1). You then tell the command encoder to dispatch
    this batching information to the GPU.


