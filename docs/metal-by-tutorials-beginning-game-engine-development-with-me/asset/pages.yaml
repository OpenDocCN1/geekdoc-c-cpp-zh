  md: '# Rendering


    From now on, the code should be performed every frame. MTKView has a delegate
    method that runs every frame, but as you''re doing a simple renderer will simply
    fill out a static view, you don''t need to refresh the screen every.


    MTKView provides a render pass descriptor and a drawable, both of which you''ll
    use to help render the sphere. Add this code to the end of the playground:


    ```

    ```

    // 1

    gard let commandBuffer = commandQueue.makeCommandBuffer()

    // 2

    let descriptor = view.currentRenderPassDescriptor

    // 3

    let renderEncoder = commandBuffer.makeRenderEncoder(descriptor: descriptor)

    else { fatalError() }

    ```

    ```


    Here you''ve created:


    +   1. A command buffer. This stores all the commands that the GPU to run.

    2. You''ve obtained a reference to the view''s render pass descriptor. This descriptor
    holds data for a number of render destinations, called ''attachments''. Each attachment
    will need such information as a texture to store to, and whether to keep the texture
    throughout the render pass. The render pass descriptor is used to create the render
    command encoder.

    3. A render encoder. This holds all the information necessary to send to the GPU
    so that the GPU can draw vertices.


    If the system fails to create a metal object, such as the command buffer or render
    encoder, that''s a fatal error. The view''s currentRenderPassDescriptor may not
    be available in a particular frame, and usually you''ll just return from the rendering
    delegate method. Since you''re only asking for it in this playground, it''s a
    fatal error here.


    Give the render encoder the pipeline state that you set up:


    ```

    ```

    renderEncoder.setRenderPipelineState(pipelineState)

    ```

    ```


    The sphere mesh you loaded earlier holds a buffer containing a simple list of
    vertices. Give this to the render encoder:


    ```

    ```

    renderEncoder.setVertexBuffer(mesh.vertexBuffers[].buffer, offset: 0, index: 0)

    ```

    ```'
