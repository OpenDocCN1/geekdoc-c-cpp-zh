  md: '# Procedural skies


    Yellow skies might be appropriate on a different planet, but how about a procedural
    sky? A procedural sky is one built out of various parameters such as weather conditions
    and time of day. Model I/O provides a procedural generator that creates physically
    realistic skies.


    Before exploring this API further, open and run skybox.playground. This scene
    contains only a ground plane and a skybox. Use your mouse or trackpad to reorient
    the scene, and experiment with the sliders to see how you can change the sky depending
    on:


    +   - turbidity: Haze in the sky. 0.0 is a clear sky. 1.0 spreads the sun’s color.

    - sun elevation: How high the sun is in the sky. 0.5 is on the horizon. 1.0 is
    overhead.

    - upper atmosphere scattering: Atmospheric scattering influences the color of
    the sky from reddish orange tones to midday.

    - ground albedo: How clear the sky is. 0 is clear, 10 can produce intense colors.
    It''s best to keep turbidity and upper atmosphere scattering low if you have high
    albedo.


    As you move the sliders, the result is printed in the debug console so you can
    record these values for later use. See if you can create a sunrise:


    ![](img/8d763acb335ab213ea9213a628f7d844_332_0.png)


    This playground uses Model I/O to create an MDLSkyCubeTexture. From this, the
    playground creates an MTLTexture and applies this as a cube texture to the sky
    cube. You’ll do this in your starter project.'
  merge: -1
