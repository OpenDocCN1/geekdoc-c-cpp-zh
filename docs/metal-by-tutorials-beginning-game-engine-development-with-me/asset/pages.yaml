    # Antialiasing


    Often rendered models show slightly jagged edges that are visible if you zoom
    in a few times. This is called antialiasing and is caused by the rasterizer generating
    the fragments. If you look at the edge of a triangle, or any straight line — especially
    one with a slope — you will notice the line doesn''t go precisely through the
    center of a pixel; some pixels will be colored the line and below it.


    The solution to fixing aliasing is called antialiasing, as you might have guessed,
    and consists of techniques to render smoother edges. By default, the pipeline
    uses one sample point (subpixel) for each pixel that is close to the line to determine
    if they meet. It is, however, possible to use 4 or more points for increased accuracy
    of intersection determination. This is called Multisample Antialiasing (MSAA),
    and it is more expensive to compute.


    Next, you''re going to configure the fixed-function MSAA on the pipeline and enable
    antialiasing on the tree and the windows.


    In Renderer.swift, add these properties to Renderer:


    ```

    var antialiasingEnabled = false

    var treePipelineStateAA: MTLRenderPipelineState!

    var windowPipelineStateAA: MTLRenderPipelineState!

    ```


    You''ll create two different pipeline states for the tree (same for the windows)
    so that you can toggle between aliased and antialiased.


    raywendlich.com


    289'
