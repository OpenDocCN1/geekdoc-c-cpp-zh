    # Chapter 6: Textures


    There''s one more thing to change: the sampler state. In Model.swift, in buildSamplerState(),
    add this before creating the sampler state:


    ```

    descriptor.mipFilter = .linear

    ```


    The default for mipFilter is .notmipmapped; however, if you provide either .linear
    or .nearest, the GPU will sample the correct mipmap.


    Build and run. The noise from the building and the ground should be gone when
    you zoom and rotate.


    Using the GPU Frame Capture tool, you can inspect the mipmaps. Double-click a
    texture, and at the bottom-left, you can choose the MIP level. This is MIP level
    5 on the house texture:


    ![](img/8d763acb335ab213ea9213a628f7d844_167_0.png)


    Your rendered ground is looking a bit muddy and blurred. This is due to anisotropy.
    Anisotropic surfaces change depending on the angle at which you view them, and
    when the GPU samples a texture at an oblique angle, it causes aliasing.


    In Model.swift, in buildAnisotropy(), add this before creating the sampler state:


    ```

    descriptor.maxAnisotropy = 8

    ```


    Metal will now take 8 samples from the texel to construct the fragment. You can
    specify up to 16 samples to improve quality. Use as few as you can to obtain the
    quality you need because the sampling can slow down rendering.'
