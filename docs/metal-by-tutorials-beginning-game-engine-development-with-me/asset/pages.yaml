  md: '# Ray tracing


    Ray tracing was introduced in 1979 by Turner Whitted. In contrast to ray casting
    — which shoots about a thousand rays into the scene — ray tracing shoots a ray
    for each pixel (width * height), which can easily amount to a million rays!


    Advantages of using ray tracing:


    +   - The quality of images rendered is much better than those rendered with ray
    casting.

    - The calculations used for intersections are precise.

    - The scene can contain any type of geometric shape, and there are no constraints
    at all.


    Of course, there are also disadvantages of using ray tracing:


    +   - The algorithm is much slower than ray casting.

    - The rendered images need to be stored on disk because they take a long time
    to render again.


    ![](img/8d763acb335ab213ea9213a628f7d844_493_0.png)


    Whitted''s approach changes what happens when a ray hits a surface.'
  merge: -1
  pgno: 493
- img_proc: true
  md: 'He''s algorithm on the screen:


    ```

    For each pixel on the screen:

    For each object in the scene:

    If there''s an intersection (hit):

    Select the closest object

    Recursively trace reflection/refraction rays

    Color the pixel in the selected object''s color

    ```


    The recursive step of the ray tracing algorithm is what adds more realism and
    quality to ray-traced images. However, the holy grail of realistic rendering is
    path tracing!


    # Path tracing


    Path Tracing was introduced as a Monte Carlo algorithm to find a numerical solution
    to an integral part of the rendering equation. James Kaji presented the rendering
    equation in 1986. You''ll learn more about the rendering equation in Chapter 20,
    "Advanced Lighting" and you''ll implement a path tracer in Chapter 21, "Metal
    Performance Shaders".


    The main idea of the Monte Carlo integration — also known as the Russian Roulette
    method — is to shoot multiple primary rays for each pixel, and when there''s a
    hit in the scene, shoot J more secondary rays (usually just one more) in a random
    direction for each of the primary rays shot:


    ![](img/8d763acb335ab213ea9213a628f7d844_494_0.png)'
  merge: -1
  pgno: 494
- img_proc: true
  md: 'The path tracing algorithm looks like this:


    ```

    For each pixel on the screen:

    Reset the pixel color C.

    For each sample (random direction):

    Shoot a ray and trace its path.

    C += incoming radiance from ray.

    C /= number of samples

    ```


    Path tracing has a few advantages over other ray-model techniques:


    +   - It''s a predictive simulation, so it can be used for engineering or other
    areas that need precision.

    - It''s photo-realistic if a large number of rays are used.


    There are some disadvantages too:


    +   - It''s slow compared to other techniques, so it is mostly used in off-line
    rendering as for animated movies.

    - It needs precisely defined lights, materials and geometry.


    Ah, wouldn''t it be great to have a sweet spot where rendering is still close
    to real-time, and the image quality is more than acceptable? Enter raymarching!


    # Raymarching


    Raymarching is one of the newer approaches to the ray-model. It attempts to make
    rendering faster than ray tracing by jumping (or marching) in fixed steps along
    the ray, making the time until an intersection occurs shorter.


    ![](img/8d763acb335ab213ea9213a628f7d844_495_0.png)'
  merge: -1
  pgno: 495
- img_proc: true
  md: "The last jump might end missing the target. When that happens, you can make\
    \ another jump back out of a smaller size. If you miss the target again, make\
    \ another jump even smaller than the previous one, and so on until you are getting\
    \ close enough to the target.\n\nThe algorithm is straightforward:\n\n```\nfor\
    \ each step up to a maximum number of steps:\nTravel along the ray and check for\
    \ intersections.\nIf there's an intersection (hit):\n  Color the pixel in object's\
    \ color\nIf there's no intersection (miss):\n  Color the pixel in the background\
    \ color\nAdd the step size to the distance traveled so far.\n```\n\nIn case the\
    \ last step is missing the target often, you can retry with a smaller-sized step\
    \ in the algorithm above. A smaller step improves the accuracy for hitting the\
    \ target, but it slows down the marching time.\n\nIn 1996, John Hart introduced\
    \ sphere tracing which is a faster raym technique used for rendering implicit\
    \ surfaces; it uses geometric distance. Sphere tracing marches along the ray toward\
    \ the first intersection in steps guaranteed not to go past an implicit surface.\n\
    \nTo make a distinction between explicit and implicit surfaces, you need to remember\
    \ that the raster-model works with geometry stored explicitly as a list of vertices\
    \ and indices before rendering.\n\nAs you can see in the following image, the\
    \ rasterized circle is made of line segments between vertices:\n\n![](img/8d763acb335ab213ea9213a628f7d844_496_0.png)\n\
    \nImplicit surfaces, on the other hand, are shapes described by functions rather\
    \ than by geometry stored before rendering."
  merge: -1
