  md: '# Where to go from here?


    In this chapter, you only looked into fixed-function blending and antialasing.
    Fragment or per-sample **programmable blending** is possible by using the [[ color
    ]] attribute, which identifies the color attachment, as an argument to the fragment
    function. For further reading, you can review section 4.8 Programmable Blending
    of the Metal Shading Language specification document at https://developer.apple.com/metal/Metal-Shading-Language-Specification.pdf


    Similarly, **programmable antialasing** is possible via programmable sample positions
    which allow you to set custom sample positions for different render passes, unlike
    fixed-function antialasing which the same sample positions apply to all render
    passes. For further reading, you can review the Programmable Sample Positions
    page at https://developer.apple.com/documentation/metal/graphics_rendering/render_targets/using_programmable_sample_positions.'
