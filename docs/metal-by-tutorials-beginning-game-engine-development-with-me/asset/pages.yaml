  md: '# # Chapter 14: Multipass & Deferred Rendering


    By Marius Horga


    Up to this point, you''ve been running projects and playgrounds that only had
    one render pass. In other words, you used a single command encoder to submit all
    of your draw calls to the GPU.


    For more complex apps, you may need multiple render passes before presenting the
    texture to the screen, letting you use the result of one pass in the next one.
    You may even need to render content offscreen for later use.


    With multiple render passes, you can render a scene with multiple lights and shadows,
    like this:


