    \nThis is not a smooth edge, but it gives an artistic touch to a toon.\n\n# Cel\
    \ shading\n\nWhen you render non-photorealistic toons, you generally use a minimal\
    \ color range. Instead of having a smooth gradient for shading, you use a stepped\
