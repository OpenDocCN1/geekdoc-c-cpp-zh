  md: "This function takes in two points, the camera position and the model matrix,\
    \ finds the mid-point between the two points and calculates the distance from\
    \ the camera.\n\nRemove all of the code from tessellation_main.\n\nAdd this to\
    \ calculate the correct index into the tessellation factors array:\n\n```\nuint\
    \ index = pid * 4;\n```\n\n4 is the number of control points per patch, and pid\
    \ is the patch ID. To index into the control points array for each patch, you\
    \ skip over four control points at a time.\n\nAdd this to keep a running total\
    \ of tessellation factors:\n\n```\nfloat totalTessellation = 0;\n```\n\nAdd a\
    \ for loop for each of the edges:\n\n```\nfor (int i = 0; i < 4; i++) {\n    int\
    \ pointAIndex = i;\n    int pointBIndex = i + 1;\n    if (pointAIndex == 3) {\n\
    \        pointBIndex = 0;\n    }\n    int edgeIndex = pointBIndex;\n}\n```\n\n\
    With this, you're cycling around four corners: 0, 1, 2, 3. On the first iteration,\
    \ you calculate edge 1 from the mid-point of points 0 and 1. On the fourth iteration,\
    \ you use points 3 and 0 to calculate edge 0.\n\nAt the end of the loop, call\
    \ the distance calculation function:\n\n```\nfloat cameraDistance = calc_distance(control_points[pointAIndex]\
    \ + index,\n                              control_points[pointBIndex] + index,\n\
    \                              camera_position.xyz,\n                        \
    \      modelMatrix);\n```\n\nNow, set the tessellation factor for the current\
    \ edge:\n\n```\nfloat tessellation = max(4.0, terrain.maxTessellation / cameraDistance);\n\
    factors[pid].edgeTessellationFactor[edgeIndex] = tessellation;\ntotalTessellation\
    \ += tessellation;\n```\n\nYou set a minimum edge factor of 4. The maximum depends\
    \ upon the camera distance and the maximum tessellation amount you specified for\
    \ the terrain."
