  md: 'Metal by Tutorials


    Introduction


    Those cycles sometimes perform computationally-intensive tasks, as as large matrix
    multiplication, which would take CPUs a lot of time process serially, even in
    a multithreaded manner on a handful of cores. In contrast, GPUs have hundreds
    or even thousands of cores which are smaller and have less memory than CPU cores,
    but perform fast parallel mathematical calculations.


    Choose Metal when:


    +   You want to render 3D models as efficiently as possible.


    +   You want your game to have its own unique style, perhaps with custom lighting
    and shading.


    +   You will be performing intensive data processes, such as calculating and changing
    the color of each pixel on the every frame, as when you are processing images
    and video.


    +   You have large numerical problems, such as scientific simulations, that you
    can partition into independent sub-problems to be processed in parallel.


    +   You need to process multiple large datasets in parallel, such as when you
    train models for deep learning.


    # Who this book is for


    This book is for intermediate Swift developers interested in learning 3D graphics
    or gaining a deeper understanding of how game engines work. If you don''t know
    Swift, you can still follow along, as all the code instructions are included in
    the book. You''ll gain general graphics knowledge, but it would be less confusing
    if you cover Swift basics first. We recommend the Swift Apprentice book, available
    from our store:


    https://store.raywenderlich.com/products/swift-apprentice


    A mattering of C++ knowledge would be useful to. The Metal Shader Language that
    you''ll use when writing GPU shader functions is based on C++. But, again, all
    the code you''ll need is included in the book.


    raywenderlich.com


    23'
