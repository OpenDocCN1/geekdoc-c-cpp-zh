  md: '# Metal by Tutorials


    # Chapter 22: Integrating SpriteKit & SceneKit


    Your HUD will be a non-rendering node. To be able to render the SpriteKit scene,
    you''ll render it to a separate texture. You then have the choice of rendering
    the texture onto a quad, or, as you''ll do in this chapter, blend the SpriteKit
    scene texture with the view''s current drawable texture.


    In sceneSizeWillChange(to:), add the following line so the HUD will update the
    label positions when the screen size changes:


    ```

    hud.sceneSizeWillChange(to: size)

    ```


    # SKRenderer


    Generally, when you create a SpriteKit app, you hook up the SKScene with an SKView.
    The SKView takes care of all the rendering and places the scene onto the view.
    SKRenderer takes the place of SKView, allowing you to control updating and rendering
    of your SpriteKit scene.


    Instead of allowing the view''s current drawable to render straight to the scene,
    you''ll intercept the renderer to blend the SpriteKit scene texture with the drawable
    in a post-processing stage.


    ![](img/8d763acb335ab213ea9213a628f7d844_625_0.png)


    To refresh how this will work in your engine, at each frame, Renderer currently
    calls update on the current scene. The current scene then updates all nodes. Renderer
    then renders all the nodes that conform to Renderable.'
