  md: '# Chapter 7: Maps & Materials


    By Caroline Begbie


    In the previous chapter, using Model I/O, you imported and rendered a simple house
    with a flat color texture. But if you look at the objects around you, you''ll
    notice how their basic color changes according to how light falls on them. Some
    objects have a smooth surface, and some have a rough surface. Heck, some even
    might be shiny metal!


    In this chapter, you''ll find out how to use material groups to describe a surface,
    and how to design textures for micro detail. This is also the final chapter on
    how to render still models.


    # Normal maps


    The following example best describes normal maps:


    ![](img/8d763acb335ab213ea9213a628f7d844_175_0.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'On the left, there''s a lit cube with a color texture. On the right, there''s
    the same low poly cube with the same color texture and lighting, however, it also
    has a second texture applied to it, called a normal map. With the normal map,
    it looks as if the cube is a high poly cube with all of the nooks and crannies
    modeled into the object. But this is just an illusion!


    For this illusion to work, it needs a texture, like this:


    ![](img/8d763acb335ab213ea9213a628f7d844_176_0.png)


    All models have normals that stick out perpendicular to each face. A cube has
    six faces, and each face''s face normal points in a different direction. Also,
    each face is flat. If you wanted to create the illusion of bumpiness, you need
    to change a normal in the fragment shader.


    In the following image, on the left is a flat surface with normals in the fragment
    shader. On the right, you see perturbed normals. The texels in a normal map supply
    the direction vectors of these normals through the RGB channels.


    ![](img/8d763acb335ab213ea9213a628f7d844_176_1.png)'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Metal by Tutorials


    # Chapter 7: Maps & Materials


    Take a look at this single brick split out into the red, green and blue channels
    that make up an RGB image.


    ![](img/8d763acb335ab213ea9213a628f7d844_177_0.png)


    Each channel has a value between 0 and 1, and you generally visualize them in
    grayscale as it''s easier to read color values. For example, in the red channel,
    a value of 0 is no red at all, while a value of 1 is full red. When you convert
    0 to an RGB color (0, 0, 0), that results in black. On the opposite spectrum,
    (1, 1, 1) is white, and in the middle you have need (0.5, 0.5, 0.5) which is mid-gray.
    In grayscale, all three RGB values are the same, so you only need refer to a grayscale
    value by a single float.


    Take a closer look at the edges of the red brick. Look at the left and right edges
    in the grayscale image. The red channel has the darkest color where the normal
    values of fragment should point left (-X, 0, 0), and the lightest color where
    it should point right (+X, 0, 0).


    Now look at the green channel. The left and right edges have equal value but are
    different for the top and bottom edges of the brick. The green channel in the
    grayscale image has darkest for pointing down (0, -Y, 0) and lightest for pointing
    up (0, +Y).


    Finally, the blue channel is mostly white in the grayscale image because the brick
    — except for a few irregularities in the texture — points outward. The edges of
    the brick are the only places where the normals should point away.


    > Note: Normal maps can be either right-handed or left-handed. Your renderer will
    expect positive y to be up, but some apps will generate normal maps with positive
    y. To fix this, you can take the normal map into Photoshop and invert the green
    channel.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'The base color of a normal map — where all normals are “normal” (orthogonal
    to the face) — is (0.5, 0.5, 1).


    ![](img/8d763acb335ab213ea9213a628f7d844_178_0.png)


    This is an attractive color but was model''s not chosen arbitrarily. RGB colors
    have values between 0 and 1, whereas a model''s normal values are -1 and 1. A
    color value of 0.5 in a normal map translates to a model normal of 0.


    The result of reading a flat texture from a normal map should be a z value of
    1 and the x and y values as 0. Converting these values (0, 0, 1) into the colorspace
    of a normal map results in the color (0.5, 0.5, 1). This is why normal maps appear
    bluish.


    # Creating normal maps


    To create successful normal maps, you need a specialized app. In the previous
    chapter, you learned about texturing apps, such as Substance Designer and Mari.
    Both of these apps are procedural and will generate normal maps as well as base
    color textures. In, the brick texture in the image at the start of the chapter
    was created in Substance Designer.


    Sculpting programs, such as ZBrush, 3D-Coat, Mudbox and Blender will all generate
    normal maps from your sculpts. You sculpt a detailed high poly mesh; then, the
    app looks at the cavities and curvatures of your sculpt, and bakes a normal map.
    Because high poly meshes with tons of vertices are resource-efficient in games,
    you should create a low poly mesh and then apply the normal map to this mesh.


    Photoshop CC (from 2015), CrazyBump and BitmapMaterial can generate a normal map
    from a photograph or diffuse texture. Because these apps look at the shading and
    calculate the values, they aren''t as good as the sculpting or procedural apps,
    but it can be quite amazing to take a photograph of a real-life, personal object,
    run it through one of these apps, and render out a shaded model. Here''s a normal
    map that was created using Allegorithmic''s Bitmap2Material:'
  merge: -1
  pgno: 178
- img_proc: true
  md: '![](img/8d763acb335ab213ea9213a628f7d844_179_0.png)


    # Tangent space


    You send the normal map to the fragment function in the same way as a color texture,
    and you extract the normal values using the same UVs. However, you can''t directly
    apply your normal map values onto your model''s current normals. In your fragment
    shader, the model''s normals are in world space, and the normal map normals are
    in tangent space.


    Tangent space is a little hard to wrap your head around it. Think of the brick
    cube with all its six faces pointing in different directions. Now think of the
    normal map with all the bricks the same color on all the faces. If a cube face
    is pointing toward negative x, how does the normal map know to point in that direction?


    ![](img/8d763acb335ab213ea9213a628f7d844_179_1.png)


    Using a sphere as an example, every fragment has a tangent — that''s the line
    that touches the sphere at that point. The normal vector in this tangent space
    is thus relative to the surface. You can see that all of the arrows are at right
    angles to the tangent. So if you took all of the tangents and laid them out on
    a flat surface, the blue arrows would point upward in the same direction. That''s
    tangent space!'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'The following image shows a cube''s normals in world space.


    ![](img/8d763acb335ab213ea9213a628f7d844_180_0.png)


    To convert the cube''s normals to tangent space, you create a TBN matrix - that''s
    a Tangent Bitangent Normal matrix that''s calculated from the tangent, bitangent
    and normal value for each vertex.


    ![](img/8d763acb335ab213ea9213a628f7d844_180_1.png)


    In the TBN matrix, the normal is the perpendicular vector as usual; the tangent
    is the vector that points along the horizontal surface; and the bitangent is the
    vector — as calculated by the cross product — that is perpendicular to both the
    tangent and the normal.


    > Note: the cross product is an operation that gives you a vector perpendicular
    to two other vectors.


    The tangent can be at right angles to the normal in any direction; however, to
    share normal maps across different parts of models, and even entirely different
    models, there are two standards:'
  merge: -1
