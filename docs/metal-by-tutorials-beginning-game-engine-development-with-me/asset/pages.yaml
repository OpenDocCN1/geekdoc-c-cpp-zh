  md: 'In this example, 16 represents the weight, and it’s not a randomly chosen number
    — it’s the sum of the numbers from the convolution kernel.


    When you need to apply convolution to the border pixels, you can apply padding
    to the input matrix. For example, when the center of a 3×3 convolution kernel
    overlaps with the image element at position (0, 0), the image matrix needs to
    be padded with an extra row and extra column of zeros. However, if the bottom
    right element of the convolution kernel overlaps with the image element at position
    (0, 0), the image matrix needs to be padded with two extra rows and two extra
    columns of zeros.


    | 0 | 0 | 0 | 0 | 0 |

    |---|---|---|---|--|

    | 0 | 6 | 7 | 3 | 7 |

    | 0 | 4 | 9 | 8 | 5 |

    | 0 | 9 | 2 | 3 | 5 |

    | 0 | 2 | 1 | 1 | 2 |

    | 0 | 5 | 0 | 3 | 8 |


    Image


    Kernel


    | 6 | 2 | 1 |

    |---|---|--|

    | 2 | 4 | 2 |

    | 1 | 2 | 1 |


    Output


    Applying the convolution kernel to an image matrix padded with an extra row, and
    extra column of zeros, gives you this calculation for a 3×3 kernel:


    ```

    ( 0 * 1 + 0 * 2 + 0 * 1 + +

    ( 0 * 2 + 6 * 4 + 7 * 2 + +

    ( 0 * 1 + 4 * 2 + 9 * 1 ) / 9 = 6

    ```


    In this case, the weight, 9, is the sum of the numbers from the convolution kernel
    that are affecting only the non-zero numbers from the image matrix (4 + 2 + 2
    + 1).


    Something like this is straightforward, but when you need to work with larger
    kernels and multiple images that need be done by hand and apply convolution to
    an image might become non-trivial.


    You know how to calculate and apply convolution to an image — and at the very
    beginning of the chapter you saw an MPS filter on an image too — but how about
    using MPS in your engine? If you were to implement bloom in your engine?


    # Bloom


    The bloom effect is a spectacular one. It amplifies the brightness of objects
    in the scene and makes them look luminous as if they’re emitting light themselves.'
