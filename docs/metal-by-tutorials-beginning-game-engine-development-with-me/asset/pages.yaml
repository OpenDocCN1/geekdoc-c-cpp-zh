    \ projection, add this to the end of Camera.swift:\n\n```\nclass OrthographicCamera:\
    \ Camera {\n    var rect = Rectangle(left: 10, right: 10,\n                  \
    \       top: 10, bottom: 10)\n\n    override init() {\n        super.init()\n\
    \    }\n\n    init(rect: Rectangle, near: Float, far: Float) {\n        super.init()\n\
    \        self.rect = rect\n        self.near = near\n        self.far = far\n\
    \    }\n\n    override var projectionMatrix: float4x4 {\n        return float4x4(orthographic:\
    \ rect, near: near, far: far)\n    }\n}\n```\n\nThis creates a camera similar\
