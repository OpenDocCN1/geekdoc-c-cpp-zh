  md: 'Moiré is a rendering artifact that happens when you''re undersampling a texture.


    ![](img/8d763acb335ab213ea9213a628f7d844_165_0.png)


    As you rotate the scene, there''s also distracting noise on the grass toward the
    horizon, almost as if it''s sparkling. You can solve these artifact issues by
    sampling correctly using resized textures called mipmaps.


    # # Mipmaps


    Check out the relative sizes of the roof texture and how it appears on the screen:


    ![](img/8d763acb335ab213ea9213a628f7d844_165_1.png)


    The pattern occurs because you''re sampling more texels than you have pixels.
    The ideal would be to have the same number of texels to pixels, meaning that you''d
    require smaller and smaller textures the further away an object. The solution
    is to use mipmaps which let the GPU sample the texture at a suitable size.


    **Mip** stands for *multum in parvo* — a Latin phrase meaning “*much in small*.


    Mipmaps are texture resized down by a power of 2 for each level, all the way down
    to 1 pixel in size. If you have a texture of 64 pixels by 64 pixels, then a complete
    mipmap set consist of:


    **Level 0:** 64 x 64, **1:** 32 x 32, **2:** 16 x 16, **3:** 8 x 8, **4:** 4 x
    4, **5:** 2 x 2, **6:** 1'
