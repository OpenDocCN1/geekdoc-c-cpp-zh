    \ uniforms: Uniforms)\n}\n```\n\nRenderer will process each Renderable object\
    \ and first call update(deltaTime:) to set the current position and rotation for\
    \ each model. This is where you'll update the matrices for your character. Renderer\
    \ will then call render(renderEncoder:uniforms:) to perform the render of the\
    \ mesh.\n\nIn Prop, find the extension and change it to conform to Renderable,\
    \ adding in update(deltaTime):\n\n```\nextension Prop: Renderable {\n  func update(deltaTime:\
