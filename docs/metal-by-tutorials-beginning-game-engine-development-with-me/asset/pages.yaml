  md: "The vertex function will sample from each of these joint matrices, and using\
    \ the weights, will apply the transformation matrix to each vertex.\n\nThe following\
    \ image shows a vertex that is assigned 50% to joint 2 and 50% to joint 3. The\
    \ other two joint indices are unused.\n\n| Position | Joints | Weights |\n| ---\
    \ | --- | --- |\n| P P P | 2 3 0 0 | 0.5 0.5 0 |\n\nBone 2 Joint Matrix\nBone\
    \ 3 Joint Matrix\n\nIn the vertex function, after multiplying the vertex by the\
    \ projection, view and model matrices, the vertex function will multiply the vertex\
    \ by a weighting of each of the joint transforms. Using the example in the image\
    \ above, the vertex is multiplied with a weighting of 50% of Bone 2's joint matrix\
    \ and 50% of Bone 3's joint matrix.\n\nIn render(renderEncoder:uniforms:), at\
    \ the start of the first loop, after the guard statement, add:\n\n```\nif let\
