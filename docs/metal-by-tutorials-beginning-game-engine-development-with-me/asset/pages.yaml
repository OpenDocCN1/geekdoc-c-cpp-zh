  md: '# Metal by Tutorials


    # Chapter 4: Coordinate Spaces


    To convert Metal NDC (Normalized Device Coordinates) which are between -1 and
    1 to a device, you could use code like this:


    ```

    converted.x = point.x * screenWidth/2 + screenWidth/2

    converted.y = point.y * screenHeight/2 + screenHeight/2

    ```


    However, you can also do this with a matrix by scaling the screen size and translating
    by the screen size. The clear advantage of this is that you can set up a transformation
    matrix and multiply any normalized point by the matrix to convert it into the
    correct screen space using code like this:


    ```

    converted = matrix * point

    ```


    As you can see in MatrixCalculator, this transformation matrix transforms a normalized
    point to iPhone X (375×812) space:


    ![](img/8d763acb335ab213ea9213a628f7d844_111_0.png)


    The rasterizer on the GPU takes care of this matrix calculation for you.


