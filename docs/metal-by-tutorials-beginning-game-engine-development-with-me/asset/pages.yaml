  md: "# Euler angle rotations\n\nNow that you have the ball translating through the\
    \ air, you probably want to rotate it as well. To express rotation of an object,\
    \ you currently hold a float3 with rotation angles on x, y and z axes. These are\
    \ called Euler angles after the mathematician Leonard Euler. Euler is the one\
    \ behind Euler's rotation theorem, a theorem which states that any rotation can\
    \ be described using three rotation angles. This is OK for a single rotation,\
    \ interpolating between these three values doesn't work in a way that you might\
    \ think.\n\nTo create a rotation angle, you've been calling this function, hidden\
    \ in the math library in MathLib.swift:\n\n```\ninit(rotation angle: float3) {\n\
    \  let rotationX = float4x(rotationX: angle.x)\n  let rotationY = float4x(rotationY:\
    \ angle.y)\n  let rotationZ = float4x(rotationZ: angle.z)\n  self rotation = rotationX\
    \ * rotationY * rotationZ\n}\n```\n\nHere, the final rotation matrix is made up\
    \ of three rotation matrices multiplied in a particular order. This order is not\
    \ set in stone and is one of six possible orders. Depending on the multiplication\
    \ order, you'll get a different rotation.\n\n> Note: Sometimes, for example in\
    \ flight simulators, these rotations are referred to as the Yaw-Pitch-Roll. Depending\
    \ on your frame of reference, if you're using the y-axis as up and down (remember\
    \ that's not universal), then Yawing is about the y-axis, Pitching is about the\
    \ x-axis and Rolling is about the z-axis.\n\nFor static objects within one rendering\
    \ engine, this is fine. The main problem comes with animation and interpolating\
    \ these angles.\n\nAs you proceed through a rotation interpolation if two axes\
    \ become aligned you get the terrifically named gimbal lock.\n\n![](img/8d763acb335ab213ea9213a628f7d844_214_0.png)"
