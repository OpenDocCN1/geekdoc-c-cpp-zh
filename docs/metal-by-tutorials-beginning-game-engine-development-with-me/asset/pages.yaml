    | Betas-iOS-Metal: shaders beta staff xcrun metal -c -fcikernel CIBlend.metal
    -o CIBlend.air |

    | Betas-iOS-Metal: shaders beta xcrun metal -c -fcikernel CIBlend.air -o CIBlend.metallib
    |

    | Betas-iOS-Metal: shaders beta ls -l |

    | -rw-r-- 1 beta staff 3532 Sep 16 15:55 CIBlend.air |

    | -rw-r-- 1 beta staff 1980 Sep 16 15:35 CIBlend.metallib |

    | -rw-r-- 1 beta staff 3564 Jun 19 15:25 CharacterShaders.metal |

    | -rw-r-- 1 beta staff 3015 Jun 14 15:57 HUD.metal |

    | -rw-r-- 1 beta staff 2775 14 Sep 15:87 Common.h |

    | -rw-r-- 1 beta staff 6058 Jun 14 15:29 Shaders.metal |

    | Betas-iOS-Metal: shaders beta |


    Two new files will appear in the directory: CIBlend.air and CIBlend.metallib.


    Add CIBlend.metallib to your project, checking only the target, either macOS or
    iOS, that you compiled. Whenever you change the Core Image kernel, you''ll have
    to recompile and relink this .metallic file.


