    \ factor which shows how the map spreads.\n\nAdd a new struct:\n\n```\nstruct\
    \ Camera {\n    float3 position;\n    Ray ray{float3(0), float3(0)};\n    float\
    \ rayrayDivergence;\n};\n```\n\nHere, you're setting up a camera using the look-at\
    \ technique. This requires the camera to have a forward direction, an up direction\
    \ and a left vector. If you're using a right-handed coordinate system, a right\
    \ vector instead.\n\nAdd this function before the kernel:\n\n```\nCamera setupCam(float3\
    \ pos, float3 target, float fov, float2 uv, int x) {\n    // 1\n    uv = fov;\n\
    \    // 2\n    float3 cw = normalize(target - pos);\n    // 3\n    float3 cp =\
    \ float3(0.0, 1.0, 0.0);\n    // 4\n    float3 cu = normalize(cross(cw, cp));\n\
    \    // 5\n    float3 cv = normalize(cross(cu, cw));\n    // 6\n    Ray ray =\
    \ Ray{pos, normalize(uv.x * cu + uv.y * cv + 0.5 * cw)};\n    // 7\n    Camera\
    \ cam = Camera{pos, ray, fov / float(x)};\n    return cam;\n}\n```\n\nGoing through\
    \ the code:\n\n+   1. Multiply the uv coordinates by the field of view.\n2. Calculate\
    \ a unit direction vector cw for the camera's forward direction.\n3. The left\
    \ vector will point orthogonally from an up and forward vector. cp is a temporary\
    \ up vector.\n4. The cross product gives you an orthogonal direction, so calculate\
    \ the left vector cu using the forward and up vectors.\n5. Calculate the correct\
    \ up vector cv using the left and forward vectors."
