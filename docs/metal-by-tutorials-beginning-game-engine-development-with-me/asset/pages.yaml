  md: '# 5 - Fragment Processing


    Time for a quick review of the pipeline.


    ![](img/8d763acb335ab213ea9213a628f7d844_77_0.png)


    +   - The Vertex Fetch unit grabs vertices from the memory and passes them to
    the Scheduler unit.

    - The Scheduler unit knows which shader cores are available so it dispatches work
    on them.

    - After work is done, the Distributor unit knows if this work was Vertex or Fragment
    Processing.

    - If it was Vertex Processing work, it sends the result to the Primitive Assembly
    unit. This path continues to the Rasterization unit and then back to the Scheduler
    unit.

    - If it was Fragment Processing work, it sends the result to the Color Writing
    unit.

    - Finally, the colored pixels are sent back to the memory.


    The primitive processing in the previous stages was sequential because there is
    only one Primitive Assembly unit and one Rasterization unit. However, as soon
    as fragments reach the Scheduler unit, work can be forked (divided) into many
    tiny parts, and each part is given to an available shader core.


