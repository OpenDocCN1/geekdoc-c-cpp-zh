  md: 'The vertices are generally ordered into triangles because GPU hardware is specialized
    to process them. The GPU''s core instructions are expected to see a triangle.


    Of all possible shapes, a triangle?


    +   - A triangle has the least number of points of any polygon that can be drawn
    in two dimensions.

    - No matter which way you move the points of a triangle, the three points will
    always be on the same plane.

    - When you divide a triangle starting from any vertex, it always becomes two triangles.


    When you''re modeling in a 3D app, you generally work with quads (four point polygons).
    Quads work well with subdivision or smoothing algorithms.


