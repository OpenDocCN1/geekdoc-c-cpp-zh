    Enter compute encoding!


    # Compute


    What is compute? Simply put, compute programming is the only other way to use
    a GPU besides rendering. Compute is also widely known as General Purpose GPU (GPGPU)
    programming.


    GPUs transitioned about a decade ago from a fixed-pipeline architecture to programmable
    pipelines, enabling the many-core GPU architectures to speed up parallel computation
    needs such as image/video processing, scientific simulations and more recently,
    machine learning.


    Compute uses a compute command encoder which is the fourth (and last) command
    encoder the Metal framework provides. You were gradually introduced to the other
    in Chapter 3 (render command encoder), Chapter 14 (blit command encoder) and Chapter
    15 (parallel render command encoder).


    All right, time to write some compute code!


    In Renderer, add this property to the top of the class:


    ```

    let pipelineState: MTLComputePipelineState!

    ```'
