  md: '# Vertex descriptors and stage_in


    So far, to render OBJ models, you''ve been using the [[ stage_in ]] attribute
    to describe vertex buffers in the vertex shader function.


    The following shows what Model I/O reads into the vertex MTLBuffer:


    | | Vertex 1 | | Vertex 2 | |

    |---|---|---|---|---|---|---|---|---|---|---|---||

    | 0 | 1 | -1 | 0 | 0 | 0.5 | 0.4 | 0.2 | 0.1 | 0.2 | -1 | 0 | 0.2 |

    | float3 | float3 | float2 | float3 | float3 | float2 |

    | Position | Normal | Texture Coordinates | Position | Normal | Texture Coordinates


    ```

    struct VertexDescriptor {

    float4 position [[ attribute(Position) ]];

    float3 normal [[ attribute(Normal) ]];

    float2 uv [[ attribute(UV) ]];

    };

    ```


    There are two float3s and a float2 for each vertex. The MTLVertexDescriptor describes
    this layout and assigns the position, normal and texture coordinate fields. The
    vertex descriptor stride describes the number of bytes between the start of one
    vertex and the start of the next.


    When you use a parameter with a stage_in attribute, the vertex shader uses the
    layout from the vertex descriptor to read the buffer. These don''t have to be
    the same lengths as the data in the buffer, as the shader will automatically convert.
    Note that, whereas the position is a float3 in the buffer, the vertex shader can
    map it to the Position attribute and read it as a float4.


    You''re going to be using one of three different vertex buffers for the three
    differently shaped rocks, and the stage_in conversion can only be used on one
    buffer. Because of this, you''ll read the buffer bytes in the vertex shader. You''ll
    have to match the actual format of the buffer data in the shader, not the struct
    format in VertexIn that the shader currently uses.'
