  md: '# Chapter 21: Metal Performance Shaders


    Remember that with the Monte Carlo integration you shoot primary rays for each
    pixel, and when there''s a hit in the scene, you shoot one more secondary ray
    in a random direction for each primary ray shot.


    ![](img/8d763acb335ab213ea9213a628f7d844_589_0.png)


    Ray tracing and path tracing are known for photorealistic rendering and accurate
    shadows, reflection, refraction, ambient occlusion, area lights, depth of field,
    and so on.


    The path tracing algorithm looks like this:


    +   For each pixel on the screen:

    Reset the pixel color C.

    For each sample (random direction):

    Shoot a ray and trace its path.

    C += incoming radiance from ray.

    C /= number of samples


    The outline of this section is as follows:


    +   1. Primary rays

    2. Shadow rays

    3. Secondary rays


    All right, that''s a plan. Ready, set, go!


    # 1. Primary rays


    Primary rays render the equivalent of a rasterized scene, but the most expensive
    part of ray tracing is finding all of the intersections between rays and triangles
    in the scene.'
