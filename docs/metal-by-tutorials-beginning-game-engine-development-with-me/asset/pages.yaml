  md: '# Particle dynamics


    Particle dynamics makes heavy use of Newton''s laws of motion. Particles are considered
    to be small objects approximated as point masses.


    Since volume is not something that characterizes particles, scaling or rotational
    motion will not be considered. Particles will, however, make use of translation
    motion so they’ll need to have a position.


    Besides position, particles might also have a direction and speed of movement
    (velocity), forces that influence them (e.g., gravity), a mass, a color and an
    age.


    Since the particle footprint is so small in memory, modern GPUs can generate 4+
    million particles, and they can follow the laws of motion at 60 fps!


    For now, you''re going to ignore gravity, so its value will be 0. Time in this
    example won''t change so it will have a value of 1. As a consequence, velocity
    will always be the same. You can also assume the particle mass is always 1, for
    convenience.


    To calculate the position, you use this formula:


    > $X_2 = X_1 + V_1t + \frac{1}{2}at^2$$


    Where x2 is the new position, x1 is the old position, v1 is the old velocity,
    t is time, and a is acceleration.


    This is the formula to calculate the new velocity from the old one:


    > $V_2 = V_1 + at$$


    However, since the acceleration is 0 in this case, the velocity will always have
    the same value.


    As you might remember from Physics class, the formula for velocity is:


    ```

    velocity = speed * direction

    ```


    Plugging all this information into the first formula above gives you the final
    equation in use in the kernel. Again, for the second formula, since acceleration
    is 0, the last term cancels out:


    ```

    newPosition = oldPosition * velocity

    ```'
