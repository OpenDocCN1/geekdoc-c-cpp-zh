  md: 'This is a good start. However, it''s not yet how ambient occlusion should look.


    Ambient means that the light does not come from a well-defined light source, but
    is rather coming from other objects in the scene, all contributing to the general
    scene light. Occlusion means how much of the ambient light is blocked.


    The main idea about ambient occlusion is to use the point where the ray hits the
    surface and look at what''s around it. If there''s an object around it, that will
    block most of the light nearby, so this will be a dark area. If there''s nothing
    around it, then the area is well lit. For in-between situations, however, you
    need more precision about how much light was occluded.


    Cone tracing is a technique that uses a cone instead of a ray. If the cone intersects
    an object, don''t just have a simple true/false result. You can find out how much
    of the cone covers at that point. Tracing a cone might be a challenge though.
    You could make using spheres aligned along a line, small at one end and big at
    the other end. This would be a good cone approximation to use. Since you''re doubling
    the sphere size at each step, you travel out from the surface very fast, so you
    need few iterations. That also gives you a nice wide cone.


    Inside the ao(t), replace the line with this:


    ```

    // 1

    float eps = 0.01;

    // 2

    pos += n * eps * 2.0;

    // 3

    float occlusion = 0.0;

    for (float i = 1.0; i < 10.0; i++) {

    // 4

    float d = distToScene(Ray(pos, float(3)));

    float coneWidth = 2.0 * eps;

    // 5

    float occlusionAmount = max(coneWidth - d, 0.0);

    float occlusionFactor = occlusionAmount / coneWidth;

    // 7

    occlusionFactor *= 1.0 - (i / 10.0);

    // 8

    occlusion = max(occlusion, occlusionFactor);

    // 9

    eps *= 2.0;

    pos += n * eps;

    }

    // 10

    return max(0.0, 1.0 - occlusion);

    ```'
