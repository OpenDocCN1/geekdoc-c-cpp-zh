  md: '# Metal by Tutorials


    Build and run, and you''ll see thirty point lights in your scene rendering — without
    a glitch!


    ![](img/8d763acb335ab213ea9213a628f7d844_409_0.png)


    So far so good, but what if you wanted to render hundreds of light instead of
    just a few dozen?


    To render more lights, you first need to replaceFragmentBytes(_:length:index:)
    with setFragmentBuffer(_:offset:index:) in renderCompositionPass(renderEncoder:)
    because you''re only allowed to send up to 4KB in an exemplary buffer.


    Add a new buffer for lights at the top of the Renderer:


    ```

    var lightsBuffer = MTLBuffer!

    ```


    At the end of init(metaView:) initialize the buffer:


    ```

    lightsBuffer = Renderer.device.makeBuffer(bytes: lights, length: MemoryLayout<Light>.stride
    * lights.count, options: [])

    ```


    Replace theFragmentBytes(_:length:index:) line for lights with the line below
    in renderCompositionPass(renderEncoder):


    ```

    renderEncoder.setFragmentBuffer(lightsBuffer, offset: 0, index: 2)

    ```


    In init(metaView:) you should now be able to render 300 lights instead of just
    30:


    ```

    createPointLights(count: 300, min: [-10, 0.3, -10], max: [10, 2, 20])

    ```'
