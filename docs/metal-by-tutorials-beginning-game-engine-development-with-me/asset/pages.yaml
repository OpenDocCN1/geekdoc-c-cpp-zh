  md: 'To quickly see how this can be of use in edge detection, use a constant value
    for the

    camera position, and replace the entire contents of shipFragment:


    ```

    float3 v = normalize(float3(0, 0, 10)); // camera position

    float3 n = normalize(in.normal);

    return fwidth(dot(v, n));

    ```


    Here, you take the product of the camera position and the fragment’s normal and

    run it through fwidth().


    Build and run to see the effect.


    ![](img/8d763acb335ab213ea9213a628f7d844_618_0.png)


    You’re seeing the slope of the dot product. White is a steep slope, where the
    fragment

    normal is at almost 90° to the camera, and black is front on to the camera with
    no

    at all. Reverse the color, and widen the line. Replace the return with:


    ```

    float edge = step(fwidth(dot(v, n)) * 10.0, 0.4);

    return edge;

    ```


    Here, you take the slope of the dot product, multiply it by 10 to increase it,
    and if

    slope is greater than a threshold of 0.4, return a black line. Otherwise, return
    white.


    The step function returns 0.0 when the first argument value is greater than the
    second

    and 1.0 if the first argument value is less than the second.'
