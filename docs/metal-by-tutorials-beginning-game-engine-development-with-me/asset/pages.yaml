  md: 'Build and run, and you''ll see your HUD overlaying the rendered scene:


    ![](img/8d763acb335ab213ea9213a628f7d844_636_0.png)


    # # Challenge


    Currently, you''re printing out "updating HUD" in the debug console. This print
    comes from update(:) in the SpriteKit scene class Hud. Your challenge is to update
    the HUD, keeping track of the oilcans that the player has collected. To achieve
    this, in GameScene, on colliding with an oilcan, you''ll tellNode to update Hud
    using oilCount. As always, you''ll find a solution in the challenge directory
    for this project.


    # # Where to go from here?


    In this chapter, you created two simple examples that you can experiment with
    further. Fragment shaders, and to a lesser extent vertex shaders, are endlessly
    fascinating. Examine contributions for each shader type:


    +   - Fragment shader: https://www.shadertoy.com

    - Vertex shader: https://www.vertexshader.com


    After looking things over, try to express the shader in the Metal Shading Language.

    For Core Image filters, the-to (free for now) book is Core Image for Swift by
    Simon Gladman available at https://itunes.apple.com/us/book/core-image-for-swift/id1073029980?mt=13.
    You will learn how to chain filters together and explore your creativity.


    Finally, in references.markdown for this chapter there are some interesting links
    for Non-Photorealistic Rendering.'
