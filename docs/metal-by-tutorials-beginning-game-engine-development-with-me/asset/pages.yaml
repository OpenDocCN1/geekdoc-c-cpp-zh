  md: '# SpriteKit rendering in Metal


    Apple’s WWDC 2017 video, “Going beyond 2D with SpriteKit” shows an example of
    a 3D rendered video game machine showing a playable 2D SpriteKit scene on the
    machine''s


    Another example of why you might want to use a SpriteKit scene rendered in Metal
    is a HUD — that''s a head-up display. A HUD is an overlay that shows scores or
    other 2D information you might want to show the player. This term originated from
    war-time military aviation, where the flight data was projected onto the airplane’s
    windshield. This meant the pilot didn’t have to look over from the action to read
    the instruments.


    SpriteKit is an excellent solution for a HUD because you can put it together quickly
    with very little code, and render the SpriteKit scene to a texture that you overlay
    on your 3D scene.


    Open the starter project CarGame. This is a similar project to the one at the
    end of Chapter 9, “Scene Graph.” Relevant changes are:


    +   - Renderer holds the current command buffer as a class property.

    - Scene maintains the complete node tree in a flattened array called alNodes.

    - RenderPass allows you to hold separate render passes.


    The main scene is GameScene.swift, which is where you set up the trees and oilcans
    and perform the game logic, as collision testing. Building and run to remind yourself
    what the scene does. Use the keyboard controls W and S for forward and back and
    QR for rotate (or left and right arrow).'
