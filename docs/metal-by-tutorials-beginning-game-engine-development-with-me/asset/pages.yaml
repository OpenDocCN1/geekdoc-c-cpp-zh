- img_proc: true
  md: "# Metal by Tutorials\n\n# Chapter 19: Advanced Shadows\n\nYou’d construct a\
    \ grid with the depth value of neighboring pixels. This method will still create\
    \ an aliased line between pixels that are in the shadow and those that are lit,\
    \ but now you can compare the pixel depth value to those of all the neighboring.\n\
    \nThen, you’d take the average of these values and obtain a filter value. By taking\
    \ multiple samples around the pixel, you’ll know how much the pixel is in the\
    \ shadow.\n\nLook at the following shadow map.\n\n| 40 | 40 | 40 |\n|---|---|---|\n\
    | 40 | 20 | 20 |\n| < 30 | 0 | 1 | 1 |\n| 40 | 20 | 20 |\n\nIn this example, you\
    \ set the shadow threshold to 30. Every depth value from the shadow map that’s\
    \ higher than the threshold is considered in shadow, so in the new grid, give\
    \ it a value of 0. Everything else is considered list, so get a value of 1.\n\n\
    The PCF method assumes you’ll do the average of these values, which is 4 / 9 =\
    \ 0.44, since you have four nodes and a total of nine grid cells. The value, 0.44,\
    \ is what the current pixel will store.\n\nThis method helps you draw a smoother\
    \ line between light and shadow that’s not aliased anymore, because neighboring\
