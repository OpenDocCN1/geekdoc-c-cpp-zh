  md: "Now that you've moved on to processing patches, you need to fetch new attribute\
    \ data for every control point.\n\n# Kernel (compute) functions\n\nYou're accustomed\
    \ to setting up a pipeline state for rendering, but compute allows you to do different\
    \ tasks on different threads.\n\nNote: The kernel function you'll create in this\
    \ section is quite simple. However, in Chapter 16, \"Particle Systems,\" you'll\
    \ investigate compute in depth.\n\nVertex and fragment shaders run the same task\
    \ on all vertices or pixels, so there is no granular control over each thread.\
    \ You'll need to set up a compute pipeline state that points to a tessellation\
    \ kernel shader function.\n\nAdd this new method to Renderer:\n\n```\nstatic func\
    \ buildComputePipelineState() -> MTLComputePipelineState {\n    guard let kernelFunction\
    \ =\n        Renderer.library?.makeFunction(name: \"tessellation_main\") else\
    \ {\n        fatalError(\"Tessellation shader function not found\")\n    }\n \
    \   return try!\n    Renderer.makeComputePipelineState(function: kernelFunction)\n\
    }\n```\n\nThis creates a compute pipeline state and expects a function that is\
    \ of a kernel type rather than a vertex or fragment type. With kernel functions,\
    \ you can, for example, process data in Metal buffers before rendering them.\n\
    \nNext, a new property to Renderer:\n\n```\nvar tessellationPipelineState: MTLComputePipelineState\n\
    ```\n\nIn init(mtKView), before super.init(0), add this:\n\n```\ntessellationPipelineState\
    \ = Renderer.buildComputePipelineState()\n```\n\nHere you instantiate the pipeline\
    \ state for the compute pipeline to use.\n\n# Compute pass\n\nYou've set up a\
    \ compute pipeline state and an MTLBuffer containing the patch data. You also\
    \ created an empty buffer which the the tessellation kernel will fill with the\
    \ edge"
