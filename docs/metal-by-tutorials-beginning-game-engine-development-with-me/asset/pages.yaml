  md: '# Chapter 9: The Scene Graph


    The scene you''re about to create will have a scene graph that looks like this:


    ![](img/8d763acb335ab213ea9213a628f7d844_244_0.png)


    Scene will hold a rootNode, which is the top of the hierarchy. The objects, Prop,
    Camera and Character, are all derived from the Node class, which you already have.
    Most nodes are Renderable, meaning you''ll render a prop and a character, but
    not a camera.


    Using this tree structure, you''ll be able to group Nodes together.


    A group is a non-renderable Node that lets you move the group, and all of its
    children along with it, while still letting you move each node independently within
    the group.


    > Note: To better understand groups and their movement, let''s say you create
    a swarm of killer bees and want each to have its own flight pattern within the
    swarm. Scene graphs and groups, you can do exactly that.


    In the following image, on the left-hand side, the skeleton and the car move independently
    of one another.


    On the right, as the car moves, so does the skeleton. However, as in the bee example,
    the skeleton inside the car still has independent movement (and should be able
    to duck when those killer bees attack!).'
