  md: '# Metal by Tutorials


    # Chapter 3: The Rendering Pipeline


    The fragment processing stage is another programmable stage. You create a fragment
    shader function that will receive the lighting, texture coordinate, depth and
    color information that the vertex function output.


    The fragment shader output is a single color for that fragment. Each of these
    fragments will contribute to the color of the final pixel in the framebuffer.
    All the attributes are interpolated for each fragment.


    ![](img/8d763acb335ab213ea9213a628f7d844_78_0.png)


    For example, to render this triangle, the vertex function would process three
    vertices with the colors red, green and blue. As the diagram shows, each fragment
    that makes this triangle is interpolated from these three colors. Linear interpolation
    simply averages the color at each point on the line between the two endpoints.
    If one endpoint is red color, and the other has green color, the midpoint on the
    line between them will be yellow. And so on.


    The interpolation equation is parametric and has this form, with parameter **p**
    the percentage (or a range from 0 to 1) of one color''s color:


    ```

    newColor = p * oldColor1 + (1 - p) * oldColor

    ```


    Color is easy to visualize, but all the other vertex function outputs are also
    similarly interpolated for each fragment.


    > **Note:** If you don''t want a vertex output to be interpolated, add the attribute
    `[[ flat ]]` to its definition.


    raywenderlich.com


    79'
