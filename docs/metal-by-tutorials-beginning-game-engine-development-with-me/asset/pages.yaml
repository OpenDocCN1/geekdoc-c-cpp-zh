    \ However, the holy grail of Deferred Rendering is having multiple lights in the\
    \ scene, so time to work on lights next!\n\n# The Lighting pass\n\nUp to this\
    \ point, you've rendered the scene color attachments to multiple render targets,\
    \ saving them for later use in the fragment shader. This assured that only the\
    \ visible fragments get processed, reducing the amount of calculation that you\
    \ would have otherwise done for all the geometry models in the scene.\n\nComputing\
    \ hundreds or thousands of lights would not be possible in a forward renderer\
    \ while also preserving performance.\n\nBy rendering a full-screen quad, you'll\
    \ need to render every fragment on the screen. This allows you to process each\
    \ fragment from your three textures and calculate lighting for each fragment.\
    \ The results of this composition will pass end up in your drawable.\n\nAt the\
