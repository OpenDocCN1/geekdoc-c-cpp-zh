    to be in the fog.


    In draw(in:), before the first draw call, add this:


    ```

    renderEncoder.setFragmentBytes(&fogEnabled, length: MemoryLayout<Bool>.size, index:
    1)

    ```


    This sets the fogEnabled variable to the GPU index: 1. Because no other resource
    is using this index, it''ll stay in the argument table at index for all the subsequent
    draw calls.


