    \ 1, 1, 1);\nreturn color * i;\n```\n\nIf you're not on an edge, calculate the\
    \ lighting. Generally, you'd use diffuseIntensity for the shading, but by flooring\
    \ the value and subtracting the remainder, you can manipulate the gradient value\
    \ to be stepped.\n\nraywenderlich.com\n\n620"
