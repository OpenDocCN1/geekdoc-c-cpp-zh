    \ skyTexture, options: nil)\n    } catch {\n        print(error.localizedDescription)\n\
    \    }\n    return texture\n}\n```\n\nAll that's left is creating a procedurally\
    \ generated sky texture! Call this method at the end of (textureName):\n\n```\n\
