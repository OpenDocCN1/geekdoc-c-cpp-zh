  trans: "\n\n*   `strstr()` 函数用于在另一个字符串中搜索子字符串的首次出现位置。它返回剩余字符串作为一组新的字符集或字符串。\n* \
    \  `strrchr()` 函数用于从字符串右侧筛选字符串以查找特定字符。\n*   `strchr()` 函数用于在字符串中搜索特定字符的首次出现位置。\n\
    \n由于我们只是在学习 C++ 编程语言的基础知识，我们不会深入探讨所有的函数。然而，了解它们以及它们的作用是重要的。让我们通过上述列表中的第二个字符串函数进行练习。\n\
    \n将以下代码输入到编译器文件中：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ main()\n{\nchar *Make = \"Suzuki \";\nchar *Model = \"Wagon\";\ncout << \"Historically,\
    \ Make = \" << Make;\n\nstrcat(Make, Model);\n\ncout << \"\\n\\nAfter concatenating,\
    \ Make = \" << Make << endl;\n\nreturn 0;\n}\n```\n\n编译这段代码并运行它。输出是什么？\n\n输出将是：Historically,\
    \ Make = Suzuki\nAfter concatenating, Make = Suzuki Wagon\n\n你现在已经学习了 C++ 数组、指针和字符串中的重要基础，使你能够编写简单的代码。\n\
    \n在下一章中，我们将通过 C++ 的文件 I/O 和类来完成本书。\n\n# 第 8 章\n\n## C++ 中的文件 I/O 和类\n\n### 文件\
    \ I/O\n\n在本章中，我们将学习文本文件的文件 I/O。注意，这个主题比我在这里涵盖的内容要更高级。\n\nC++ 中有两个基本类负责处理文件。它们包括分别写作\
    \ `ifstream` 和 `ofstream` 的流。在程序中使用这两个类时，必须使用 `fstream` 头文件。\n\n虽然我们可以使用 `ifstream`\
    \ 从文件中读取或将数据输入文件，但 `ofstream` 则便于写入文件或文件输出。\n\n#### 声明文件 I/O 类\n\n按如下方式声明两个类之一的\
    \ `ifstream` 或 `ofstream`：\n\n`ifstream a_file;` 或 `ofstream a_file;`\n\n或者\n\n\
    `ifstream a_file (\"nameoffile\");` 或 `ofstream a_file (\"nameoffile\");`\n\n\
    如果你在两个类中都将文件名作为参数或变量，文件实际上会被打开。这两个类也使用 `open` 和 `close` 命令。\n\n`(a_file.open())`\
    \ 是打开命令，而 `a_file.close())` 是两个类都使用的关闭命令。\n\n然而，由于程序在终止时会自动调用 `close` 命令，因此你不需要使用它。但是当需要在程序终止之前关闭文件时，它非常有用。\n\
    \n让 C++ 在文件处理方面具有吸引力的是其文件 I/O 函数的简单性。在类实例之前使用 `<<` 和 `>>` 是可能的，因为 C++ 支持运算符重载。实际上，在文件流打开后，我们可以将它们作为\
    \ `cin` 和/或 `cout`。\n\n清除编译器文件并输入以下代码：\n\n```cpp\n#include <fstream>\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main()\n{\n  char str[10];\n  // 创建一个\
    \ ofstream 实例并打开 variables.txt\n  ofstream a_file ( \"variables.txt\" );\n  //\
