  raw: 'Data storage and retrieval are critical when it comes to computing.Programs
    and applications aren’t just developed to manipulate data, but also use them.
    Computer memory is where data storage takes place.


    If you want to retrieve data, you must know the memory location where it’s stored.
    With variables, you can easily access stored data. They act as placeholders.


    Variables are data stored in applications and programs. You can easily change
    or manipulate them. In C++, if you need storage for values, variables come in
    handy. In this language, you can interpret variables (data) in many ways.


    Compilers allocate memory locations based on data types. Variables are these locations
    allocated in computer memory. Every variable declaration has a unique function
    and memory requirements.


    Therefore, variables are names used to refer to memory locations as references
    by data value identifiers that you can easily change or manipulate in an app or
    program. Data types are the many ways in which data is stored in memory.


    ### Variable Data Types


    Here are the five major data types in C++:


    Char–this data type is used to store variable ASCII characters. These are usually
    enclosed in single quotes.


    ‘c’ ‘x’ ‘a’ ‘*’  etc


    Float–this data type is used to store decimal numbers, also known as floating
    point numbers.These numbers comprise of integer and fractional parts with a decimal
    point separating the two. What’s more, they can either be negative or positive
    numbers.


    .9   199955.68    0.6   10.2    etc


    Int–this data type is used to store whole numbers or those with integral values.
    Although these can either have a negative or positive sign, use of commas aren’t
    allowed.


    10     4    -35    22 -40   etc


    Bool–this data type is used to store Boolean values which are either true or false.


    Double–this data type is used to store double or large floating point values.


    #### Variable Data Type Variations


    The five data types also come in different variations for better control.


    Short int– this is an integer that ranges from -45589 to 45589\. Unlike normal
    integers, their short variations occupy less space.


    Unsigned int– these are positive integers, but double the range of normal positive
    integers.


    Constants–constants are given values prior to being declaredand once they’re declared,
    they remain fixed. Place‘const’ before a data type to declare a constant despite
    the variable being declared.


    C-string–although this is neither a data type nor is it declared, they showcase‘c-like’strings.They’re
    character arrays that can hold data with more than a single character.


    Although the last two variable types aren’t critical now, they’re generally essential
    in other programming areas of application.


    #### Practical Use/Example


    Let’s now learn this by example.


    Launch CodeBlocks and locate the‘File’ menu.Under the new sub-menu that pops up,
    select‘New’then‘Project’.


    Find‘Console Application’within the options available in the new window that opens
    up. Using the default options in the compiler, create your C++ practical project
    and type the name‘Variables’. Do this for each chapter, naming the project the
    respective chapter title.


    On the active compiler window’s side bar, locate‘Expand Variables’. Click on it
    then select the‘Expand Sources’option. Under the new lists, double click on‘main.cpp’.


    Once the file opens, delete all the items that appear. Begin your practice by
    typing the following code in the file:


    #include <iostream>


    Using namespace std;


    int main()


    {


    int apartments = 5; // declare variable “apartments”, give it a value


    cout << “I have” << apartments << “ apartments!\n “; //print


    return o;


    }


    Next, you need to compile your code then run it.


    Your console should read: “I have 5 apartments!”


    That’s right.


    You did so well. Keep it up.


    ### Comments


    The double slash is used to denote comments, which come in two variations: single
    line and multi-line comments.


    Single Line Comments–these can go anywhere within your program code. They tell
    the compile to ignore anything after that code line. For instance,


    //this is your comment


    Multi-line Comment– these start with a /* and end with */. Whereas /* indicates
    the beginning of the comment to the compile, */ terminates or ends it. Without
    indicating the end of your comments with */, the compiler treats everything that
    come after /* as comments. For instance,


    /* this is


    your multi-line


    comment */


    Based on our comments in the code above, it’s clear that the variable we declared
    is known as‘apartments’. It was of the data type integer and we gave it a value
    5.


    ### Variable Manipulation


    Next, you need to learn and practice how to manipulate variables. For instance,
    change the value of the integer from 5 to any other number, let’s say 10.


    You’ll notice the program will display“I have 10 apartments!”after compiling and
    running the changed code.


    You can also ask your users the number of apartments they own. Here’s where you’ll
    have more fun!


    To do this, first delete everything on the file. Don’t worry about it because
    you’re not just learning more, but also having even much more fun.


    Type the code below in the file:


    #include <iostream>


    Using namespace std;


    int main()


    {


    int apartments;


    cout << “ How many apartments do you have?\n”;


    cin >>” << apartments;


    cout << “Oh My God! You have “ << apartments << “ apartments!“;


    return 0;


    }


    You’re probably wondering, “What’s going on here?” Don’t worry, just read on to
    understand this new code.


    We have declared apartments as a variable, but in this case, no value was assigned
    to it. Although we can assign a value as in the previous code example, we seek
    a different result here hence we don’t need variable values in this case.


    Since our aim is to ask our user(s) the number of apartments they own, we have
    used cout in the code to indicate ‘console out’ because it’s a standard method
    for outputs. We achieved this by adding a print out line to our code.


    We need to enable users to input data for them to respond to the question asked.
    This is where the use of cin and (>>) come in. Whereas the former stands for ‘console
    in’, the latter is placed before the variable we expect from the user and acts
    as a stream operator of input.


    Once we receive the user data or information, it’s printed back on the user console.
    Whatever the user enters or types and goes into the output stream is written to
    the console by cout. This is indicated by the (<<) stream output operator added
    to our code. Everything within quotes is a text string to be printed on the console
    just as it is.


    Therefore, we use cout to imply an output stream. This means our program variables
    and/or strings can be printed out if everything is linked to each other.


    What if you’re interested in more things other than just apartments owned. Let’s
    say you need to find more information about detached houses, condos, bungalows,
    etc.


    If you need to ask a user(s) the number of apartments, detached houses, bungalows
    or even condos they won, here’s what to do in C++:


    #include <iostream>


    Using namespace std;


    int main()


    {


    int apartments, detached houses, bungalows, condos;


    cout <<“How many apartments do you have?\n”;


    cin >> apartments;


    cout <<“How many detached houses do you have?\n”;


    cin >> detached houses;


    cout <<“How many bungalows do you have?\n”;


    cin >> bungalows;


    cout <<“What about condos?\n”;


    cin >> condos;


    cout  <<“Oh My God! You have”<< apartments <<“apartments,“ << detached houses
    <<“bungalows, and“<< condos <<“ condos!\n”;


    return 0;


    }


    Similarly, just as we’ve used the output stream to link various variables to each
    other, we can also use it to retrieve a stream of data.


    For instance, check out the practical example below:


    #include <iostream>


    Using namespace std;


    int main()


    {


    int apartments, detached houses, bungalows, condos;


    cout <<“Enter the number of apartments you own, followed by detached houses, bungalows
    and finally condos.\n”;'
