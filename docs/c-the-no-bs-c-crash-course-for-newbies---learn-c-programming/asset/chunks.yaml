  trans: "\n在计算领域，数据存储和检索至关重要。程序和应用程序不仅是为了处理数据，也是为了使用数据。计算机内存是数据存储的地方。\n\n如果你想检索数据，必须知道它存储的内存位置。通过变量，你可以轻松地访问存储的数据。它们充当占位符。\n\
    \n变量是存储在应用程序和程序中的数据。你可以轻松地更改或操作它们。在 `C++` 中，如果你需要为值提供存储，变量会非常有用。在这种语言中，你可以以多种方式解释变量（数据）。\n\
    \n编译器根据数据类型分配内存位置。变量就是分配在计算机内存中的这些位置。每个变量声明都有独特的功能和内存需求。\n\n因此，变量是某些名称，通过数据值标识符作为内存位置的引用，你可以在应用或程序中轻松地更改或操作它们。数据类型是存储在内存中的多种方式。\n\
    \n### 变量数据类型\n\n以下是 `C++` 中的五种主要数据类型：\n\n- **Char**–此数据类型用于存储变量 ASCII 字符。这些字符通常被包含在单引号中。\n\
    \  `'c'` `' 'x'` `'a'` `'*'` 等。\n- **Float**–此数据类型用于存储小数，也称为浮点数。这些数字由整数部分和小数组成，用小数点将两者分开。此外，它们可以是负数也可以是正数。\n\
    \  `.9` `199955.68` `0.6` `10.2` 等。\n- **Int**–此数据类型用于存储整数或具有整数值的数字。虽然这些数字可以是负号也可以是正号，但不允许使用逗号。\n\
    \  `10` `4` `-35` `22` `-40` 等。\n- **Bool**–此数据类型用于存储布尔值，即真（true）或假（false）。\n\
    - **Double**–此数据类型用于存储双精度或较大的浮点值。\n\n#### 变量数据类型变体\n\n五种数据类型还有不同的变体以便更好地控制。\n\n\
    - **Short int**–这是一个从 `-45589` 到 `45589` 的整数。与普通整数不同，短整型占据的空间更少。\n- **Unsigned\
    \ int**–这些是正整数，但范围是普通正整数的两倍。\n- **Constants**–常量在声明之前被赋予值，一旦声明，它们就会保持不变。在数据类型之前放置\
    \ `const` 可以声明一个常量，尽管该变量已被声明过。\n- **C-string**–虽然这既不是数据类型也不被声明，但它们展示了 `c-like`\
    \ 字符串。它们是字符数组，可以包含多个单个字符的数据。\n\n虽然最后两种变量类型现在并不至关重要，但在其他编程应用领域通常是必不可少的。\n\n###\
    \ 实际用途/示例\n\n让我们现在通过示例来学习。\n\n启动 CodeBlocks 并定位到 `File` 菜单。在弹出的新子菜单下，选择 `New`\
    \ 然后 `Project`。\n\n在打开的新窗口的可用选项中找到 `Console Application`。使用编译器的默认选项，创建你的 `C++`\
    \ 实践项目并输入名称 `Variables`。对每个章节执行此操作，将项目命名为相应的章节标题。\n\n在活动编译器窗口的侧边栏上，找到 `Expand\
    \ Variables`。点击它然后选择 `Expand Sources` 选项。在新列表中，双击 `main.cpp`。\n\n文件打开后，删除出现的所有项目。开始在文件中输入以下代码进行练习：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int\
    \ apartments = 5; // 变量 \"apartments\", 给它赋一个值\n    cout << \"I have\" << apartments\
    \ << \" apartments!\\n \"; //打印\n    return 0;\n}\n```\n\n接下来，你需要编译你的代码然后运行它。\n\
    \n你的控制台应该显示：“I have 5 apartments!”\n\n没错。\n\n你做得很好。请继续努力。\n\n### 注释\n\n双斜杠用于表示注释，注释有两种变体：单行注释和多行注释。\n\
    \n**单行注释**–它们可以出现在程序代码的任何地方。它们告诉编译器忽略该代码行之后的任何内容。例如，\n`//this is your comment`\n\
    \n**多行注释**–它们以 `/*` 开始，以 `*/` 结束。其中 `/*` 向编译器指示注释的开始，而 `*/` 则终止或结束它。如果不用 `*/`\
    \ 指定注释的结束，编译器会将 `/*` 之后的所有内容视为注释。例如，\n\n```cpp\n/* this is\nyour multi-line\n\
    comment */\n```\n\n根据我们上面代码中的注释，很清楚我们声明的变量被称为 `apartments`。它的数据类型是整数，我们给它赋值为 `5`。\n\
    \n### 变量操作\n\n接下来，你需要学习并练习如何操作变量。例如，将整数的值从 `5` 更改为其他数字，比如 `10`。\n\n你会注意到在编译和运行更改后的代码后，程序将显示“I\
    \ have 10 apartments!”\n\n你还可以询问用户他们拥有多少公寓。这里将你会有更多乐趣的地方！\n\n要做到这一点，首先删除文件上的所有内容。不要担心，因为你不仅在学习更多，而且还在获得更多的乐趣。\n\
    \n在文件中输入以下代码：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n    int apartments;\n\n    cout << “ How many apartments do you have?\\n”;\n\
    \    cin >> apartments;\n    cout << “Oh My God! You have “ << apartments;\n \
    \   return 0;\n}\n```\n"
- fmt: "\n```cpp\ncin >> apartments >> detached houses >> bungalows >> condos;\n\n\
    cout <<“Oh My God! You have”<< apartments <<“apartments,“<< detached houses <<“bungalows,\
    \ and”<< condos <<“condos!\\n”;\n\nreturn 0;\n\n}\n```\n\nAs you can see, C++\
    \ is not just easy to use, but also comprehensible.\n\nIt’s also important that\
    \ you know about enumerators. They might come in handy as you continue to learn\
    \ this programming language.\n\n### Enumerators\n\nAlso known as iterators, enumerators\
    \ enable programmers (you) to come up with‘state’ statements. Although they’re\
    \ simply integer values, you can easily utilize them to make comparisons. I’ll\
    \ show you how to use enumerators in the next chapter.\n\nCheck below how you\
    \ can declare enumerators:\n\n```cpp\nEnum houses { apartments, detached houses,\
    \ bungalows, condos };\n```\n\n# Chapter 4\n\n## Conditions and Loops\n\nI promise\
    \ you that this chapter is even more interesting. You’ll definitely enjoy it!\n\
    \n### Control Flow\n\nStatements are executed from the first to the last. Executions\
    \ begin from the first statement, followed by the second statement, then 3rd and\
    \ so forth. This goes on until the last statement is executed. At this point,\
    \ the program terminates.\n\nIf your program runs or executes similar statements\
    \ sequentially, it would actually be useless. Depending on prevailing circumstances\
    \ and what you want to do, your program should enable you to make necessary statement\
    \ changes or select the ones to be executed.\n\nA good example is when your program\
    \ is designed to count the number of a specific word in a document. Irrespective\
    \ of the document you want checked, your program should easily check any given\
    \ file for any specific word, giving the correct number of that particular word.\n\
    \nThis is what’s known as control flow. You’re able to change how your program\
    \ executes statements. If you want your program to behave in accordance to your\
    \ input, there should be a way for you to examine the latter. This is where conditions\
    \ come in.\n\nWith a condition, your program checks variable values, and depending\
    \ on specific statements known as conditions, execution either takes place or\
    \ not. The two main conditional structures used in C++ are:\n\n`If` and `switch\
    \ case`\n\nBefore we discuss these two conditional structures and I show you how\
    \ they’re used practically, let’s have a look at operators.\n\n### Operators\n\
    \nOperators can either be logical or relational. With these operators, compiler\
    \ can determine if a condition in a statement is either true or false.\n\nRelational\
    \ Operators–these help ascertain the relationship between any two expressions.\
    \ Examples of relational operators as follows:\n\n- `>` means greater than\n-\
    \ `>=` means equal or greater than\n- `<` means less than\n- `<=` means equal\
    \ or less than\n- `==` means equal to\n- `!=` means not equal to\n\nAlthough relational\
    \ operators work like arithmetic operators, the former examines the relationship\
    \ between two expressions, returning a Boolean value to indicate whether it’s\
    \ true or false. Note that a Boolean expression is one that returns the true or\
    \ false values.\n\nLogical Operators–logical operators, on other hand, combine\
    \ simple relational expressions to come up with complex Boolean expressions. Here\
    \ are examples of logical operators you need to:\n\n- `&&` means‘and’\n- `||`\
    \ means‘or’\n- `!` means‘not’\n\nHere’s an example of the logic returning true\
    \ or false:\n\n| Apartments | Condos | Apartments && Condos |\n| :--- | :--- |\
    \ :--- |\n| True | True | True |\n| True | False | False |\n| False | True | False\
    \ |\n| False | False | False |\n\nThe `!` operator (!) negates the value of a\
    \ single argument. Here’s a simple practical example (`Apartments = 10` and `Condos\
    \ = 4`):\n\n- `!(Apartments > 6)` → False\n- `(Apartments > Condos) && (Condos\
    \ > 0)` → True\n- `(Apartments < Condos) && (Condos > 0)` → False\n- `(Apartments\
    \ < Condos) || (Condos > 0)` → True\n\nIn Boolean expression, any statement with\
    \ a value of 0 is false whereas that with any other value than 0 is true.\n\n\
    #### If, If-else and Else-if\n\nThe‘if’ condition is an expression with a value\
    \ that’s being examined. Your statements get executed if the condition is true\
    \ prior to your program continuing. However, if the condition isn’t true, the\
    \ compiler ignores the statements. You can write the‘if’ condition in the following\
    \ format:\n\n```cpp\nif (condition to be met)\n{\n    Statement 1\n    Statement\
    \ 2\n…\n}\n```\n\nIn case of a single statement, don’t have to use the curly braces.\
    \ Check out the example below:\n\n```cpp\nif (condition to be met)\nStatement\n\
    ```\n\nThe `if-else` condition comes in handy when you need to examine two sequential\
    \ statements in a block. In case the‘if’ condition is ascertained to be true,\
    \ the block statements corresponding to it gets executed. Conversely, if the condition\
    \ is false, the‘else’ statement is executed. In this scenario, only a single statement\
    \ block gets executed because the condition can either be met or not. The `if-else`\
    \ condition is written in the following format:\n\n```cpp\nif (condition)\n{\n\
    \    Statement 1a\n    Statement 1b\n…\n}\nelse\n{\n    Statement 2a\n    Statement\
    \ 2b\n…\n}\n```\n\nHowever, omit the curly braces if your code has only a block\
    \ statement as in the following example:\n\n```cpp\nif (condition)\n    Statement\
    \ 1a\nelse\n    Statement 2a\n```\n\n### Else\n\nWhen your code has many conditions\
    \ to be met with at least two block statements to be executed, the `else-if` condition\
    \ comes in handy. A block statement in correspondence with the first condition\
    \ is executed if the latter is met. However, if the first condition isn’t met,\
    \ only the block statement in correspondence to the‘else-if’ condition is executed\
    \ when the second condition is met. Here’s the format of the `else-if` condition:\n\
    \n```cpp\nif (condition1)\n{\n    Statement1a\n    Statement1b\n…\n}\nelse if\
    \ (condition2)\n{\n    Statement2a\n    Statement2b\n…\n}\n```\n\nIt’s possible\
    \ for your C++ code to have at least one `else if` condition, each with a condition\
    \ to be met. The moment a block statement is executed after its corresponding\
    \ condition is met, the compiler ignores any other `else if` conditions. This\
    \ means that if your code has an `if-else-if` condition, either no block statement\
    \ or one is executed. Though rarely, a C++ code can also have an `if-else-if-else`\
    \ condition. In this scenario, the last `else` condition’s corresponding block\
    \ statement is executed if none of the previous conditions are met. Just like\
    \ in a normal `if-else` condition, at least one block of corresponding statement\
    \ must be executed.\n\nEnough of the talking and theory, let’s do one practically.\
    \ Go back to your CodeBlocks compiler. Delete everything in the file and type\
    \ the code below:\n\n```cpp\n#include <iostream>\n\nUsing namespace std;\n\nint\
    \ main()\n{\n    int Apartments = 6;\n    int Condos = 3;\n    if (Apartments\
    \ > Condos)\n        cout <<“Apartments are more than Condos\\n”;\n    else if\
    \ (Condos > Apartments)\n        cout <<“Condos are more than Apartments\\n”;\n\
