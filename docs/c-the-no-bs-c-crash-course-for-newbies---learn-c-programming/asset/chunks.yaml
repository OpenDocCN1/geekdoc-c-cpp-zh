    \ the new lists, double click on `main.cpp`.\n\nOnce the file opens, delete all\
    \ the items that appear. Begin your practice by typing the following code in the\
    \ file:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n    int apartments = 5; // declare variable \"apartments\", give it a value\n\
    \    cout << \"I have\" << apartments << \" apartments!\\n \"; //print\n    return\
    \ 0;\n}\n```\n\nNext, you need to compile your code then run it.\n\nYour console\
    \ should read: “I have 5 apartments!”\n\nThat’s right.\n\nYou did so well. Keep\
    \ it up.\n\n### Comments\n\nThe double slash is used to denote comments, which\
    \ come in two variations: single line and multi-line comments.\n\n**Single Line\
    \ Comments**–these can go anywhere within your program code. They tell the compile\
    \ to ignore anything after that code line. For instance,\n`//this is your comment`\n\
    \n**Multi-line Comment**– these start with a `/*` and end with `*/`. Whereas `/*`\
    \ indicates the beginning of the comment to the compile, `*/` terminates or ends\
    \ it. Without indicating the end of your comments with `*/`, the compiler treats\
    \ everything that come after `/*` as comments. For instance,\n\n```cpp\n/* this\
    \ is\nyour multi-line\ncomment */\n```\n\nBased on our comments in the code above,\
