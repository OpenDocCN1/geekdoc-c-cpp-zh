  trans: "\n\n```cpp\ncin >> apartments >> detached houses >> bungalows >> condos;\n\
    \ncout <<“Oh My God! You have”<< apartments <<“apartments,“<< detached houses\
    \ <<“bungalows, and”<< condos <<“condos!\\n”;\n\nreturn 0;\n\n}\n```\n\n如你所见，C++\
    \ 不仅易用，而且易于理解。\n\n了解枚举器（enumerators）同样重要。在你继续学习这门编程语言时，它们可能会派上用场。\n\n### 枚举器\n\
    \n枚举器也称为迭代器（iterators），它们允许程序员（你）编写“状态”（state）语句。虽然它们仅仅是整数值，但你可以轻松地利用它们进行比较。我将在下一章向你展示如何使用枚举器。\n\
    \n查看下文了解如何声明枚举器：\n\n```cpp\nEnum houses { apartments, detached houses, bungalows,\
    \ condos };\n```\n\n# 第 4 章\n\n## 条件与循环\n\n我向你保证，这一章更加有趣。你一定会喜欢的！\n\n### 控制流\n\
    \n语句从第一条到最后一条执行。执行从第一语句开始，接着是第二条，然后是第三条，以此类推。一直持续到最后一条语句执行。此时，程序终止。\n\n如果你的程序只是按顺序运行或执行类似的语句，它实际上是毫无用的。根据实际情况和你想做的操作，你的程序应该允许你进行必要的语句更改或选择要执行的语句。\n\
    \n一个很好的例子是你的程序设计用于统计文档中特定单词的次数。无论你想检查哪个文档，你的程序都应该轻松地检查任何给定文件是否存在特定单词，并给出该单词的正确数量。\n\
    \n这就是所谓的控制流（control flow）。你能够改变程序执行语句的方式。如果你希望程序的行为符合你的输入，那么就应该有一种方法来检查后者。这就是条件（conditions）用用场。\n\
    \n通过条件，你的程序会检查变量的值，并根据被称为条件的特定语句，决定是执行还是不执行。C++ 中使用的两种主要条件结构是：\n\n`If` 和 `switch\
    \ case`\n\n在我们讨论这两个条件结构并向你展示如何实际使用它们之前，让我们先来看运算符。\n\n### 运算符\n\n运算符可以是逻辑的，也可以是关系的。通过这些运算符，编译器可以判断语句中的条件是真是假。\n\
    \n关系运算符——这些有助于确定任何两个表达式之间的关系。关系运算符的示例例如：\n\n- `>` 意味着大于\n- `>=` 意味着大于或等于\n- `<`\
    \ 意味着小于\n- `<=` 意味着小于或等于\n- `==` 意味着等于\n- `!=` 意味着不等于\n\n虽然关系运算符的作用与算术运算符类似，但前者检查两个表达式之间的关系，返回一个布尔值来指示真假。注意，布尔表达式是返回真或假值的表达式。\n\
    \n逻辑运算符——另一方面，逻辑运算符组合简单的关系表达式以产生复杂的布尔表达式。以下是你需要的逻辑运算符示例：\n\n- `&&` 意味着“与”（and）\n\
    - `||` 意味着“或”（or）\n- `!` 意味着“非”（not）\n\n这是一个逻辑返回真或假的示例：\n\n| Apartments | Condos\
    \ | Apartments && Condos |\n| :--- | :--- | :--- |\n| True | True | True |\n|\
    \ True | False | False |\n| False | True | False |\n| False | False | False |\n\
    \n`!` 运算符否定单个参数的值。这是一个简单的实际示例（`Apartments = 10` 且 `Condos = 4`）：\n\n- `!(Apartments\
    \ > 6)` → False\n- `(Apartments > Condos) && (Condos > 0)` → True\n- `(Apartments\
    \ < Condos) && (Condos > 0)` → False\n- `(Apartments < Condos) || (Condos > 0)`\
    \ → True\n\n在布尔表达式中，任何值为 0 的语句均为假，而任何非 0 值的语句均为真。\n\n#### If, If-else 和 Else-if\n\
    \n‘if’条件是一个带有待检查值的表达式。如果在程序继续运行之前，条件为真，则你的语句将执行执行。然而，如果条件为假，编译器将忽略这些语句。你可以按照以下格式编写‘if’条件：\n\
    \n```cpp\nif (condition to be met)\n{\n    Statement 1\n    Statement 2\n…\n}\n\
    ```\n\n如果是单个语句，不需要使用大括号。查看下例示例：\n\n```cpp\nif (condition to be met)\nStatement\n\
    ```\n\n`if-else` 条件在需要在一个块中检查两个顺序语句时非常有用。如果‘if’条件被确定为真，则相应的块语句将被执行。相反，如果条件为假，则执行‘else’语句。在这种情况下，只有一个语句块被执行，因为条件可能满足，也可以不满足。`if-else`\
    \ 条件按以下格式编写：\n\n```cpp\nif (condition)\n{\n    Statement 1a\n    Statement 1b\n\
    …\n}\nelse\n{\n    Statement 2a\n    Statement 2b\n…\n}\n```\n\n然而，如果你的代码仅有一个块语句（如下例所示），则省略大括号：\n\
    \n```cpp\nif (condition)\n    Statement 1a\nelse\n    Statement 2a\n```\n\n###\
    \ Else\n\n当你的代码有许多条件需要满足时，且至少有两个块语句需要执行时，`else-if` 条件非常有用。如果第一个条件满足，则执行对应的块语句。相反，如果第一个条件不满足，则在第二个条件满足时执行对应的语句。‘else\
    \ if’ 条件的格式如下：\n\n```cpp\nif (condition)\n{\n    Statement1a\n    Statement1b\n\
    …\n}\nelse if (condition)\n{\n    Statement2a\n    Statement2b\n…\n```\n\nC++\
    \ 代码可以至少有一个 `else if` 条件，每个条件都有待满足。一旦某个条件满足并执行了相应的块语句，编译器将忽略其他的 `else if` 条件。这意味着如果你的代码有\
    \ `if-else-else` 条件，在这种情况下，如果之前的所有条件都不满足，则执行最后一个 `else` 条件对应的块语句。就像普通的 `if-else`\
    \ 条件一样，至少有一个对应的块语句被执行。\n\n空谈理论够了，让我们实际操作一下。回到你的 CodeBlocks 编译器。删除文件中的所有内容并输入以下代码：\n\
    \n```cpp\n#include <iostream>\n\nUsing namespace std;\n\nint main()\n{\n    int\
    \ Apartments = 6;\n    int Condos = 3;\n    if (Apartments > Condos)\n       \
    \ cout <<“Apartments are more than Condos\\n”;\n    else if (Condos > Apartments)\n\
    \        cout <<“Condos are more than Apartments\\n”;\n    else\n        cout\
    \ <<“Apartments and Condos are equal in number\\n”;\n    return 0;\n}\n```\n\n\
    编译并运行这个程序；看看发生了什么。代码返回 `Apartments are more than Condos`。如果你交换 `Apartments` 和\
    \ `Condos` 的值（`apartments=3` 和 `Condos=6`），程序将输出 `Condos are more than Apartments`。如果你给每个变量分配相似的值，例如\
    \ `Apartments =6` 和 `Condos =6`，程序输出 `Apartments and Condos are equal in number`。\n\
    \n#### Switch-Case 条件\n\n就像我们上面讨论的‘if, if-else and else-if’条件一样，switch-case 条件在相应条件满足时执行某些语句，或者不执行。然而，这两种类型之间的区别在于\
    \ switch-case 独特的行为和语法。\n\n```cpp\nswitch (expression)\n{\n    case constant1:\n\
    \        statement1a\n        statement1b\n        …\n        break;\n    case\
    \ constant2:\n        statement2a\n        statement2b\n        …\n        break;\n\
    \    …\n    default:\n        statement3a\n}\n```\n\n"
