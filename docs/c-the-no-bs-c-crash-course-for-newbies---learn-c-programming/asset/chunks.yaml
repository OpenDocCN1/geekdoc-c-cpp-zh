    In our program code above, `switch` tests expression. All the statements that
    come after `case constant1` get executed, if `constant1` and `expression` are
    equal, until the compiler finds a `break`.


    However, `expression` is compared to `constant2` if it’s not equal to `constant1`.
    All the statements after `case constant2` are executed, if `case constant2` and
    `expression` are equal, until the compiler finds a `break`.


    Otherwise, the process repeats for all the constants, one after another. If no
    match is found, all the statements that come after `default` get executed.


    Note that in this instance, curly braces are important when it comes to enclosing
    the whole `switch-case`, but not when there’s at least a single statement; we
    attribute this to the distinct switch-case behavior.


    Although you can use `if-else` condition equivalents in a `switch-case`, you can
    express the behavior in a better way.


    It’s time for practice so let’s get back to our compiler.


    Delete anything that’s on the file and type the following code:


    ```cpp

    #include <iostream>


    Using namespace std;


    int main()


    {


    int Apartments=10;


    switch (Apartments)

    {


    case 1:

    cout << “Apartments are 1\n”;

    break;

    case2:

    case3:

    cout << “Apartments are 2 or 3”;

    break;

    default;

    cout << “Apartments are not 1, 2, or 3”;

    }


    return 0;


    }

    ```


    Compile the code and run it. See what happens.


    This program will output `Apartments are not 1, 2, or 3`. Replace `Apartments=10`
    with `Apartments=2` and note the new program output.


    It will print out `Apartments are 2 or 3`.


    ### Loops


    Loops can help you repeatedly execute or run several statements until a certain
    condition is met. The given statements are run sequentially until a specified
    condition is declared as true.


    The sequence of statements is held within a loop body, curly braces. Each time
    the loop body is executed, the compiler checks whether the statement is true or
    false. If it’s false, the loop body is executed again. This continues until the
    condition is ascertained to be true.


    #### Types of Loops


    Loops are available in three forms: `while`, `do-while` and `for`.


    ##### while and do-while


    The `while` loop –thisloop is the same as the ‘`if`’ condition we discussed above.
    The code is written as follows:


    ```

    while (condition)

    {


    statement1

    statement2

    …

    }

    ```


    Statements in a block are executed one after another, repeatedly, until a condition
    is met. You don’t have to use curly braces if there’s just a single statement
    in your code.


    It’s clear now that every time we practice with a new code, you need to clear
    the compiler file to create room for our new program. I’m sure by now you’ve mastered
    this and find yourself automatically removing the code we worked on previously.


    Well, let’s move on.


    Type in the following code:


    ```cpp

    #include <iostream>


    Using namespace std;


    int main()


    {


    int Apartments=0;


    while (Apartments are less than 10)

    Apartments=Apartments + 1;

    cout << “Apartments are” << Apartments << “\n”;


    return 0;


    }

    ```


    What’s your program output after compiling and running this code? It should read
    something like:


    `Apartments are 10.`


    The `do-while` loop – this is a loop variation that ensures block statements are
    executed at least one time. You can code this loop as follows:


    ```

    do

    {


    Statement1

    Statement2

    …

    }


    while (condition);

    ```


    If the condition is met, the block statements get executed, after which the program
    goes back to the beginning of the block. In this instance, you must use curly
    braces.


    Note that the program ends with a semicolon just next to the `while` condition
    to be met.


    ##### for


    `for` loop – this is similar to the `while` loop except for its different syntax.
    Check out the following code:


    ```cpp

    for (initialization; condition; increment)

    {


    statement1

    statement2

    …

    }

    ```


    This loop enables an initialized counter variable at the point where the loop
    starts with an increase in every loop iteration. If your program has a single
    statement, consider not using curly braces.


    We have to type a new code into the compiler file to remove everything on there.


    ```cpp

    #include <iostream>


    Using namespace std;


    int main()


    {


    for (int Apartments = 0; Apartments < 10; Apartments = Apartments +1)

    cout << Apartments << “\n”;


    return 0;


    }

    ```


    Compile and run the code. What’s the output?


    The numbers 0 to 9 will be printed out, each value on its own line.


    If you’ve pre-defined the counter variable, there’s no need for a new definition
    in the `for` loop’s initialization part. The following program code, therefore,
    is valid:


    Clear your compiler file and type the following:


    ```cpp

    #include <iostream>


    Using namespace std;


    int main()


    {


    int Apartments = 0;


    for (; Apartments < 10; Apartments = Apartments + 1)

    cout << Apartments << “\n”;


    return 0;


    }

    ```


    The first semicolon instance within the `for` loop’s parentheses is necessary.
    You can express a ‘for’ loop as a `while` loop, and the latter as the former.
    With the `for` loop structure or form we’ve already written above, let’s write
    a `while` loop that’s equivalent as follows:


    ```

    Initialization


    while (condition)

    {


    Statement1

    Statement2

    …


    Increment

    }

    ```


    Based on our `for` loop example, we can write a `while` loop that’s equivalent
    as follows:


    ```cpp

    #include <iostream>


    Using namespace std;


    int main()


    {


    int Apartments = 0;


    while (Apartments < 10)

    {


    cout << Apartments << “\n”;

    Apartments = Apartments + 1;

    }


    return 0;


    }

    ```

