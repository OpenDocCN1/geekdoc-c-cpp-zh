    \ Type` – 函数起着返回变量类型的作用。它可以是一个字符串，也可以是一个整数。\n* `Parameters` – 这些是函数可以接收的元素。此外，你可以使用函数轻松修改参数。\n\
    \n### 接收和返回整数\n\n函数可以接收一个整数 `Apartments` 并返回一个整数，如下：\n\n```cpp\nint return_int\
    \ (int Apartments)\n{\n    return Apartments;\n}\n```\n\n在上面的代码中，`int` 是我们的返回类型，而\
    \ `return_int` 是函数名称。`Integer Apartments` 是我们的参数。简单来说，这个函数接收整数 `Apartments` 并返回整数\
    \ `Apartments`。\n\n### 在 main 中调用函数\n\n我们将在 `main` 中调用上面的函数。让我们开始吧。\n\n创建一个整数\
    \ `Studio`。我们将它作为 `return-int` 输出。我们的函数将接收一个 `6`。现在来写这段代码；清除你的编译器文件并输入以下代码：\n\n\
    ```cpp\n#include <iostream>\n\nint return_int (int Apartments)\n{\n    return\
    \ Apartments;\n}\n\nint main ()\n{\n    int Studio = return_int (6);\n    std:cout<<“Hello\
    \ World, I’m Here Now!\\n”;\n}\n```\n\n在测试代码之前，让我们将 “Hello World, I’m Here Now!\\\
    n” 替换为 `Studio`。你的新代码应该如下：\n\n```cpp\n#include <iostream>\n\nint return_int (int\
    \ Apartments)\n{\n    return Apartments;\n}\n\nint main ()\n{\n    Int Studio\
    \ = return_int (6);\n    std:cout << Studio;\n}\n```\n\n你的输出控制台中显示了什么？它应该是 ‘6’。\n\
    \n### 一个接收整数 `Apartments` 和 `Condos` 并返回它们的和（结果也是整数）的函数\n\n在清除编译器文件中的所有内容后，在文件中输入以下代码：\n\
    \n```cpp\n#include <iostream>\n\nint add_ints (int Apartments, int Condos)\n{\n\
    \    int Houses = Apartments + Condos;\n    return Houses;\n}\n\nint main ()\n\
    {\n    Int Homes = add_ints (6, 5);\n    std:cout << Homes;\n}\n```\n\n我们的函数会将\
    \ `6` 加 `5`，并将输出 `11` 存储在变量 `Homes` 中以便打印。编译并运行它。它应该输出 `11`。\n\n### 字符串函数\n\n\
    让我们写一段接收两个字符串并将它们相加的代码。我们将使用函数 `combine_strings` 来合并字符串 `Apartments` 和 `Condos`。你会发现它与之前的代码有些相似之处；我们只是在各处修改了几个地方。\n\
    \n在清空的编译器文件中输入以下代码：\n\n```cpp\n#include <iostream>\n\nstd: string combine_strings\
    \ (std:: string Apartments, std:: string Condos)\n{\n    std:: string combined\
    \ = Apartments + Condos;\n    return combined;\n}\n\nint main ()\n{\n    Std::\
    \ string Houses = combine_strings(“Apartments”,“Condos”);\n    std:cout << Houses;\n\
    }\n```\n\n在这段代码中，我们的字符串 `Apartments` 和 `Condos` 将相加；这与我们之前相整数相似。两个字符串将被合并并打印结果；这就是\
    \ `return combined` 函数的作用。\n\n在计算中，这种组合或相加被称为“拼接”（concatenation）。\n\n现在编译并运行程序。显示了什么？`Apartments`\
    \ 和 `Condos` 按该顺序出现。\n\n### 函数与 if 语句\n\n让我们多创建一个函数，让它接收两个整数 `Apartments` 和 `Condos`\
    \ 并返回一个整数。\n\n```cpp\n#include <iostream>\n\nint more (int Apartments, int Condos)\n\
    {\n    if (Apartments > Condos)\n    {\n        return Apartments;\n    }\n  \
    \  else\n    {\n        return Condos;\n    }\n}\n```\n\n我们的 `more` 函数在参数中接收两个整数\
    \ `Apartments` 和 `Condos` 并对它们进行比较。它只返回较大的那个整数。例如，如果 `Apartments` 多于 `Condos`，它返回后者。反之亦然。\n\
    \n在编译器中运行代码之前，让我们先为我们的 `main` 函数定义一个整数。我们将创建一个整数 `Houses` 来存储 `more` 函数的结果。它会像这样：\n\
    \n`int Houses = more (12, 6);`\n\n我们的最终代码将如下所示（清除编译器文件并输入它，因为我们现在需要测试它）：\n\n```cpp\n\
    #include <iostream>\n\nint more (int Apartments, int Condos)\n{\n    if (Apartments\
    \ > Condos)\n    {\n        return Apartments;\n    }\n    else\n    {\n     \
    \   return Condos;\n    }\n}\n\nint main ()\n{\n    int Houses = more (12, 6);\n\
    \    std:cout << Houses;\n}\n```\n\n编译并运行代码。两个整数经过比较，你的程序将显示 `12` 作为输出。\n\n###\
    \ Void 函数（空函数）\n\n虽然我们刚刚探索了字符串和整数函数，但函数也可以接收并返回双精度浮点数、float、字符甚至布尔值。在本章结束之前，让我向你展示如何编写一个\
    \ void 函数。\n\nvoid 函数不返回任何值。当我们期望代码或程序不返回结果时使用它。\n"
