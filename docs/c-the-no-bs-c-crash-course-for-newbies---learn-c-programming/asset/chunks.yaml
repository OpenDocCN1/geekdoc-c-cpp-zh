    # Chapter 1


    ## The Origin of C++


    C++ has its origin dating back to 1979. This was a time when an employee at Bell
    AT & T, Bjarne Stroustrup, began working on C programming language and its classes.
    Bjarne borrowed various desirable features from other languages such as CLU, Simula,
    ML, ALGOL 68 and Ada.


    This means that C++ is made up of C programming language features, including strong
    type checking, basic inheritance, classes and default function argument. Initially
    known as C with classes, it got its name C++ in 1983. The language specification
    standards for C++ were released by ANSI-ISO in 1998.


    A new standard for C++ known as C++11 was released in mid 2011. It came about
    as a result of a major influence from the Boost libraries. It’s from these libraries
    that C++ sourced many of its new corresponding modules.


    Some of the features sourced from these libraries include atomics support, a comprehensive
    randomization library, container classes, auto keyword, a standard threading library,
    regular expression support, array-initialization lists, improved unions support,
    a new C++ time library and new templates.


    In December 2014, C++14 was released with minor bug fixes and enhancements over
    C++11.


    ## Why Learn C++

