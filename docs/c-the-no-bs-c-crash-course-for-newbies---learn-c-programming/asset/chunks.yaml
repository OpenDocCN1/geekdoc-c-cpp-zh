    # 第 1 章


    ## C++ 的起源


    C++ 的起源追溯到 1979 年。那是贝尔 AT&T 的员工比雅恩·斯特拉斯鲁普（Bjarne Stroustrup）开始研究 C 编程语言及其类的时候。比雅恩从
    CLU、Simula、ML、ALGOL 68 和 Ada 等语言中借用了各种理想特性。


    这意味着 C++ 由 C 编程语言特征组成，包括强类型检查、基础继承、类和默认函数参数。它最初被称为“带类的 C”，在 1983 年更名为 C++。C++
    语言规范标准由 ANSI-ISO 在 1998 年发布。


    名为 C++11 的 C++ 新标准于 2011 年中期发布。它的出现受到了 Boost 库的重大影响。正是通过这些库，C++ 引入了许多新的对应模块。


    从这些库引入的一些特性包括原子支持、全面的随机数库、容器类、`auto` 关键字、标准线程库、正则表达式支持、数组初始化列表、改进的联合支持、新的 C++
    时间库和新模板。


    2014 年 12 月，发布了 C++14，在 C++11 的基础上进行了微小的错误修复和增强。


    ## 为什么要学习 C++

