    In this chapter, we’re going to learn about file I/O in text files. Note that\
    \ this topic is more advanced than what I’ll cover here.\n\nThere are two basic\
    \ classes in C++ responsible for dealing with files. These include `ifstream`\
    \ and `ofstream` streams written as respectively. You must use the header file\
    \ `fstream` when using these two classes in your program.\n\nWhereas we can use\
    \ `ifstream` to read from files or input data into files, `ofstream` facilitates\
    \ writing to files or file output.\n\n#### Declaring File I/O Classes\n\nDeclare\
    \ either of the two classes, `ifstream` and `ofstream`, as follows:\n\n`ifstream\
    \ a_file;` or `ofstream a_file;`\n\nor\n\n`ifstream a_file (\"nameoffile\");`\
    \ or `ofstream a_file (\"nameoffile\");`\n\nIf you pass the file name as an argument\
    \ or variable in both classes, a file is actually opened. Both classes also use\
    \ `open` and `close` commands.\n\n`(a_file.open())` is an open command whereas\
    \ `a_file.close())` is a close command used by both classes.\n\nHowever, since\
    \ programs automatically call the `close` command when they terminate, you don’t\
    \ have to use it. However, it comes in handy when there’s a need to close a file\
    \ before the program terminates.\n\nWhat makes C++ appealing when it comes to\
    \ file handling lies in the simple nature of the file I/O functions. Using `<<`\
    \ and `>>` before a class instance is possible because overloading operators are\
    \ supported in C++. Actually, after file streams are opened, we can use them as\
    \ `cin` and/or `cout`.\n\nClear the compiler file and type the following code:\n\
    \n```cpp\n#include <fstream>\n#include <iostream>\n\nusing namespace std;\n\n\
    int main()\n{\n  char str[10];\n  //Creates an ofstream instance, and opens variables.txt\n\
    \  ofstream a_file ( \"variables.txt\" );\n  // Outputs to variables.txt via a_file\n\
    \  a_file<<\"This text will be inside variables.txt\";\n  // Close the file stream\
    \ completely\n  a_file.close();\n  //Opens for file reading\n  ifstream b_file\
    \ ( \"variables.txt\" );\n  //Reads a single string in the file\n  b_file>> str;\n\
    \  //Outputs 'This'\n  cout<< str <<\"\\n\";\n  cin.get();    // Nothing happens\
    \ until a key is pressed\n  // b_file closes completely at this point\n}\n```\n\
    \nCompile and run this code to see what happens.\n\nBy creating an `ofstream`\
    \ that’s not in existence, you activate file opening in default mode. However,\
    \ if the `close` command construct exists, clear or delete everything. It’s also\
    \ possible to declare a second variable to define how you want the compiler to\
    \ handle the file.\n\nConsider the following:\n*   File appending using `ios::app`\n\
    *   Setting the prevailing position at the end using `ios::ate`\n*   Deleting\
    \ all the items in a file using `ios::trunc`\n\nYou can append new data upon opening\
    \ a file without tampering with its contents. Use the function below:\n\n`ofstream\
    \ a_file (\"variables.txt\", ios::app );`\n\nIf you were not able to open a file,\
    \ don’t use the function to open it. Use the code below to test it first:\n\n\
    `ifstream a_file ( \"variables.txt\" );`\n\nif ( !a_file.is_open() )\n{\n  //\
    \ The file couldn’t open\n}\nelse\n{\n  // Use the file stream safely\n}\n\n###\
    \ Classes\n\nWith classes, you can create custom or tailored data types. The keyword\
    \ `class` is used. Classes can either be empty or assigned values. Once created,\
    \ classes are used just like normal built-in data types such as `char`, `int`,\
    \ `bool`, etc.\n\nFor instance, let’s declare the class `Books` in the code below:\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass Books\n{\nint numberOfpages;\n\
    };\n\nint main()\n{\nreturn 0;\n}\n```\n\nIf you want to declare an empty class,\
    \ remove the function below from the code above:\n\n```cpp\n{\nint numberOfpages;\n\
    };\n```\n\nPublic (accessible to functions within and outside a class), protected\
    \ (accessible to functions within a class only) and private (similar to protected)\
    \ are the three restriction levels in C++. You can declare them using their respective\
    \ keywords and ending them with a semicolon.\n\nRestrictions make classes easier\
    \ to use. Constructors and destructors must be featured in a class. Whereas the\
    \ former initializes variables, the latter cleans up memory to free space.\n\n\
    Compilers also create default constructors, if you don’t need them in your program.\
    \ The same applies to destructors. This means that constructors are called automatically\
    \ whenever you declare a class instance.\n\nWhen a scope is reached, your program\
    \ terminatesor allocated memory deleted, the destructor is automatically called.\
    \ What’s important now is that you understand the concept of constructors and\
    \ destructors. Note that both of don’t return variables or arguments so you wouldn’t\
    \ want to use them for that purpose.\n\nGive destructors and constructors a public\
    \ restriction to enable you create classes. This is attributed to the fact that\
    \ every time a class is created, the constructor is called. Doing otherwise brings\
    \ about compiling errors.\n\nOur lesson ends here!\n\nI wish to congratulate you\
    \ for having completed studying this book. Although the book ends here, learning\
    \ doesn’t end here. Go through the book as many times as you can and have fun\
    \ each time!\n\n# Conclusion\n\nThank you again for downloading this book!\n\n\
    I hope this book was able to help you to learn important yet basic C++ programming\
    \ skills you need as a beginner developer. Note that every concept discussed in\
    \ each chapter is basic knowledge you need as you embark on your journey to becoming\
    \ a seasoned C++ programmer.\n\nThe next step is to practice, practice and practice.\
    \ Use the codes in this book to practice and even try to write your own. I also\
