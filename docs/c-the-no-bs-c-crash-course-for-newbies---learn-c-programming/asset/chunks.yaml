    Type the following code in the compiler file:


    ```cpp

    #include <iostream>


    using namespace std;


    int main()

    {

    double weight[] = {34.66, 450.45, 23.58, 5.33, 54.04};

    cout << “1stmember =“<< weight[0] << endl;

    cout << “3rdmember =“<< weight[2] << endl;

    return 0;

    }

    ```


    Compile the code and run it. What’s the ouput?


    It should display:

    1st member = 34.66

    3rd member = 23.58


    If you want to access all the items or array members, just do the same, listing
    the items from the first to the last in the array list.


    ### Pointers


    When you declare a variable, the computer reserves memory space for it, utilizing
    its name to refer to the space reserved in memory. In computing, this space is
    referred to using an address. This means that all declared variables have an address.
    The address of declared variables can be found.


    When you find the address of your variable, you can use it. Every time we pass
    an argument (variable) to a function, just like a reference, its address is used.
    As a result, the calling function accesses the variable’s address to directly
    use its value. This means that we can change the value of a variable through the
    calling function.


    In normal scenarios, the previous variable value is maintained once you exit the
    calling function. However, with pointers, a called function can return many values
    even if it was initially declared as `void`.


    When arrays are declared, their dimensions must be defines. Unlike arrays, pointers
    can help us code without the need to know or find array dimensions. This is because
    they’re better memory managers.


    Since arrays can comprise of whole texts and long characters, pointers come in
    handy due to their ability to hold arrays of different sizes. This means, we can
    use pointers instead of arrays, eliminating the need to know the size of the given
    array. This is taken care of by the compiler.


    As in the case of arrays, functions can take in pointers and return altered values
    even the case of `void` functions.


    Pointers are ideal when we need to work with multi-dimensional arrays. Instead
    of direct referral to the address of a variable, we can declare another variable
    to do the reference.


    Therefore, pointers are variables that reference or refer to the address of other
    variables. Just like any other variable, pointers must be declared and initialized
    prior to utilizing it.


    #### Declaring Pointers


    We use an identifier (data types), an asterisk (`*`), pointer name and semi-colon
    (`;`) in that order, to declare a pointer.


    The format is as follows:


    `Datatype * Pointername;`


    The data type or identifier you pick should be that of the variable whose address
    is to be referenced. This means that if the variable is an integer, the data type
    becomes an integer. The asterisk identifies the variable being declared as a pointer.


    The asterisk must come before every variable to be declared as a pointer, each
    separated by a coma as follows:


    `Datatype* pointer1, *pointer2;`


    You can also declare them in different lines as follows:

    `Datatype* pointer1;`

    `Dataype * pointer2;`


    It doesn’t matter how you append the asterisk, as long as it appears between the
    identifier and the variable to be declared as a pointer. In case you place the
    asterisk before each variable to be declared as a pointer, only the first variable
    is considered a pointer and the rest normal variables.


    Check this out:

    `Datatype * pointer1, pointer2;`


    `pointer2` isn’t a pointer, but a normal variable.


    #### Naming and Initializing Pointers


    Since pointers are variables, they use the same naming system we used in a previous
    chapters when covered variables.


    When we initialize a pointer, just like in the case of variables, we tell the
    compiler what it’ll do.


    `int* pointer;` a pointer declared in this way is initialized as follows:


    `int* pointer = &Variable;` (removing the asterisk in the initialization but keeping
    the `&` before the variable also works when you need to do the initialization
    in a different line.)


    Let’s practice a bit: type the following code in the compiler file.


    ```cpp

    #include <iostream>


    using namespace std;


    int main()

    {

    int value = 22;

    int* pointer = &value;

    cout <<“Value is at:”<< Value <<“\n”;

    cout <<“Pointer is at:”<< *Pointer;

    cout << “\n\n”;

    return 0;

    }

    ```


    Compile this code and run it. The program outputs the following results:

    Value is at: 22

    Pointer is at: 22


    You can also initialize the pointer as follows: the result will be the same.


    ```cpp

    #include <iostream>


    using namespace std;


    int main()

    {

    int value = 22;

    int* pointer;

    cout <<“Value is at:”<< Value <<“\n”;

    pointer = &value;

    cout <<“Pointer is at:”<< *Pointer;

    cout << “\n\n”;

    return 0;

    }

    ```


    We can also declare the variables first then and do the initialization later as
    follows:


    ```cpp

    #include <iostream>


    using namespace std;


    int main()

    {

    int value;

    int* pointer;

    value = 22;

    pointer = &value;

    cout <<“Value =“<< Value <<“\n”;

    cout <<“*Pointer =“<< *Pointer <<“\n”;

    cout << “\n”;

    return 0;

    }

    ```


    We can change the value of a variable that was initially declared and assigned
    a new value as follows:


    ```cpp

    #include <iostream>


    using namespace std;


    int main()

    {

    int value;

    int* pointer;

    pointer = &value;

    value = 56;

    cout << “Value =”<< value << “\n”;

    cout << “*Pointer =”<< *pointer << “\n”;

    value = 15;

    cout << “Value =”<< value << “\n”;

    *pointer = 10;

    return 0;

    }

    ```


    Let’s now type the following code into the compiler and see what happens.


    ```cpp

    #include <iostream>


    using namespace std;


    int main()

    {

    int value;

    int* pointer;

    pointer = &value;

    value = 100;

    cout << “Value =”<< value << “\n”;

    cout << “*Pointer =”<< *pointer << “\n”;

    cout << “\n”;

    return 0;

    }

    ```


    Compile the code and run it. The output should read:

    Value = 100

    *Pointer = 100


    ### Strings


    An array of characters ending with a terminating null character (`\0`) makes up
    a string. The `std` namespace string library is commonly used when you want to
    define a string.


    There are many string functions you can use to manipulate strings. They include
    the following:


    *   `strlen()` function used to determine the length of a string.

    *   `strcat()` function used to append or add the character of two strings.

    *   `strncat()` function used to append or add specific characters from the source
    string to those in the destination string.

    *   `strcpy()` function used to copy one string into another, replacing the latter.

    *   `strncpy()` function used to copy specific characters from a source string
    to a destination string, replacing the latter.

    *   `strdup()` function used to make a duplicate or copy of a string.

    *   `strcmp()` function used to compare a couple of strings, returning an integer
    as an outcome of the comparison.

    *   `strncmp()` function used to compare specific characters of a string with
    those of another string. It returns an integer as an outcome of the comparison.

    *   `stricmp()` function used to compare two strings irrespective of their case,
    meaning it doesn’t matter whether capital and small letters are mixed or not.

    *   `strincmp()` function used to compare two strings irrespective of their case,
    meaning it doesn’t matter whether capital and small letters are mixed or not.
    However, the comparison is based on a specific number of characters.

    *   `sprintf()` function used to format strings and defines the manner in which
    they should be displayed.

    *   `strupr()` function used to change or convert a string in small letters to
    uppercase letters.

    *   `strlwr()` function used to change or convert a string in capital letters
    to lowercase letters.

