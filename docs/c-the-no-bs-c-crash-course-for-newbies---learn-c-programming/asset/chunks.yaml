- fmt: '

    Although C++ is a language with its origins in the 80s, it’s still a popular programming
    language that keeps evolving to meet modern developer requirements. There are
    five major reasons why C++ is an important language hence worth your time and
    money as a programmer.


    * High Portability – `C++` is highly portable. This means that you can use it
    to develop multi-platform and multi-device applications.

    * Features a Function Library – `C++` has a library rich in functions you’ll need
    when developing programs.

    * Object-Oriented – `C++` is an object oriented language for programming. This
    simply means that it features inheritance, data abstraction, classes, encapsulation
    and polymorphism.

    * Efficient, Powerful and Fast – `C++` is not just efficient and powerful, but
    also a powerful programming language. Use it to develop various programs or applications,
    ranging from games and 3D graphics to real-time mathematical simulations and GUI
    apps. It comes in handy when you need direct access to your hardware, and efficient
    and fast program execution.


    Hobbyists have developed open-source games using `C++` (wholly or partially).
    For instance, whereas `openTTD` was developed using `C++`, `Raspberry Pi Units`
    and `Arduino` circuits are programmed in `C++` and `C`.


    The language is readable and highly functional, enabling you to do anything you
    want, but within the capability of a language.


    * Functions Overloading & Exception Handling – Unlike `C` programming language,
    you can easily overload functions and handle exceptions in `C++`.


    ### So, what’s C++?


    `C++` is pronounced as‘C plus-plus’. It’s an object-oriented programming language
    for general purposes. As mentioned earlier, it’s founded on `C` programming language
    and was started by `Bjarne Stroustrups` with its first release in 1983.


    Many applications were developed using `C++`, including Microsoft applications,
    part of `Mac OS/X`, `Adobe` and `MongoDB` databases, among other programs or apps.
    `C++` is the best programming language when it comes to developing apps whose
    performance is critical such as processing of audio/video or development of‘twitch’games.


    App development in `C++` continues to benefit businesses, both small and large,
    worldwide depending on their goals. With constant updates, the range of apps or
    programs you can develop using `C++` continues to grow.


    `C++` is the most widely used language for programming. However, its popularity
    slightly dropped over the years due the increasing prevalence of natural and less
    esoteric languages such as `C#` and `Java`. `Ruby`, `Python` and `Perl` scripting
    languages have also become more prevalent, dropping `C++` down the rank.


    `C++` is still an important low-level programming language. Since the language
    is universal, learning it can help you maintain its legacy codes.


    As a beginner developer, learning `C++` is no doubt a good foundation for your
    programming career. It bridges higher-level and lower-level languages such as
    `Python` or `Java` and `C`, respectively.


    With this knowledge about `C++` and why you need to learn it, you can now graduate
    to the next chapter. Get started and write your first `C++` program.


    # Chapter 2


    ## Getting Started – Write Your First Program in C++


    The instructions I’ve provided in this eBook are pretty straightforward because
    I’m aware you’re a beginner. I’m setting you up with this simple guide to enable
    you start coding as soon as possible. I will give you all the information you
    need to get your programming career started.


    ### Choose a Compiler and IDE to Use


    You need a compiler and `IDE` to get started with `C++` as a novice or beginner.
    An integrated development environment (`IDE`) is a platform on which you write
    your codes. Depending on the `IDE` you choose, you can perform various functions
    on the coding environment, ranging from debugging your programs to running the
    codes you’ve written, among other roles.


    Humans and machines understand different languages. Whereas humans use natural
    languages based on words, machines (devices or hardware) comprehend machine language
    based on codes. Therefore, it’s important to convert your written programs into
    a language that machines can understand.


    This is where compilers come in. A compiler is a translator, playing the role
    of translating the programs you write into a machine language (codes), a form
    machines can easily read and comprehend.


    In many cases, `IDEs` come with in-built compilers. However, `IDEs` aren’t necessary
    in writing your programs. This is attributed to the fact that you can use a text
    editor to theoretically write your code, save it as a `.cpp` file and run it on
    a compiler. However, I wouldn’t advice you, a beginner, or any other programmer,
    irrespective of the coding language in question, to use text editors in place
    of `IDEs`.


    We’ll use `CodeBlocks IDE` for this beginner guide. However, feel free to use
    any other `IDE` of your liking as you practice your programming skills. If you
    wish to use a real-time web-based compiler, consider `Rextester.com`. Otherwise,
    visit [www.codeblocks.org](http://www.codeblocks.org) to access this integrated
    development environment.


    Locate the page for‘downloads’, and click on the link that reads‘download the
    binary release’. Pick the rightversion for your operating system. If you’re using
    Windows, look out for the file titled‘codeblocks-(version written here) mingw-setup.exe’.
    Do the same for `Mac OS/X`, `Linux` or any other operating system.


    Access the executable file in the‘Downloads’folder and double click on it. Click
    `OK` to run the file.Launch the program upon successful installation and select
    the compiler you’d like to use. Note that `MinGW/GCC` compiler is selected by
    default. Since we’re going to use it, simply clickon the‘ok’button.


    With everything regarding the `IDE` program set, and its window still active on
    your computer’s desktop, locate‘file’on the taskbar and click on it. Hover your
    mouse over it and select the‘New’submenu that pops up. Finally, select the‘empty
    file’option.


    ```cpp

    #include <iostream>


    using namespace std;


    int main()


    {


    cout <<”Hello World! I’m Here Now\n”;


    return 0;

    }

    ```


    When done, locate the icon bar just below the taskbar on the same IDEIDE window.
    It has a set of icons including a play, a gear and combinational play/gear buttons.
    The play button will enable you to run your programs, the gear button is what
    you need to compile your code and the combinational play/gear button performs
    both functions.


    Note that in `C++`, you must first compile your program before running or executing
    it.


    Play around with each button and see what happens to the code. Click on the gear
    button and see what happens. Do the same with the other icon buttons.


    And there you go! That was just your first `C++` program. Hold down the `ctrl`
    key and hit `S` to save the file or click on the‘Edit’menu then‘Save’submenu to
    do the same. Name the file as‘FirstCplusplus.cpp’.


    Watch what happens to your first `C++` code.


    Wow! It has some color, and of course life. This is exactly what your `IDE` is
    purposed to do, provide you with an ideal environment to write your `C++` code.What
    you see in color is what’s known as syntax highlighting, the segmentation of your
    program into various distinct parts.


    There you are, having your development environment and first `C++` program right
    before you. Can this get more exciting? Will see about that!

