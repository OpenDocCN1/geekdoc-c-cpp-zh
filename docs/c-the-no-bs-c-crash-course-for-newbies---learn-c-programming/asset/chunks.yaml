- fmt: "\nData storage and retrieval are critical when it comes to computing. Programs\
    \ and applications aren’t just developed to manipulate data, but also use them.\
    \ Computer memory is where data storage takes place.\n\nIf you want to retrieve\
    \ data, you must know the memory location where it’s stored. With variables, you\
    \ can easily access stored data. They act as placeholders.\n\nVariables are data\
    \ stored in applications and programs. You can easily change or manipulate them.\
    \ In `C++`, if you need storage for values, variables come in handy. In this language,\
    \ you can interpret variables (data) in many ways.\n\nCompilers allocate memory\
    \ locations based on data types. Variables are these locations allocated in computer\
    \ memory. Every variable declaration has a unique function and memory requirements.\n\
    \nTherefore, variables are names used to refer to memory locations as references\
    \ by data value identifiers that you can easily change or manipulate in an app\
    \ or program. Data types are the many ways in which data is stored in memory.\n\
    \n### Variable Data Types\n\nHere are the five major data types in `C++`:\n\n\
    - **Char**–this data type is used to store variable ASCII characters. These are\
    \ usually enclosed in single quotes.\n  `'c'` `' 'x'` `'a'` `'*'` etc.\n- **Float**–this\
    \ data type is used to store decimal numbers, also known as floating point numbers.\
    \ These numbers comprise of integer and fractional parts with a decimal point\
    \ separating the two. What’s more, they can either be negative or positive numbers.\n\
    \  `.9` `199955.68` `0.6` `10.2` etc.\n- **Int**–this data type is used to store\
    \ whole numbers or those with integral values. Although these can either have\
    \ a negative or positive sign, use of commas aren’t allowed.\n  `10` `4` `-35`\
    \ `22` `-40` etc.\n- **Bool**–this data type is used to store Boolean values which\
    \ are either true or false.\n- **Double**–this data type is used to store double\
    \ or large floating point values.\n\n#### Variable Data Type Variations\n\nThe\
    \ five data types also come in different variations for better control.\n\n- **Short\
    \ int**– this is an integer that ranges from `-45589` to `45589`. Unlike normal\
    \ integers, their short variations occupy less space.\n- **Unsigned int**– these\
    \ are positive integers, but double the range of normal positive integers.\n-\
    \ **Constants**–constants are given values prior to being declared and once they’re\
    \ declared, they remain fixed. Place `const` before a data type to declare a constant\
    \ despite the variable being declared.\n- **C-string**–although this is neither\
    \ a data type nor is it declared, they showcase `c-like` strings. They’re character\
    \ arrays that can hold data with more than a single character.\n\nAlthough the\
    \ last two variable types aren’t critical now, they’re generally essential in\
    \ other programming areas of application.\n\n### Practical Use/Example\n\nLet’s\
    \ now learn this by example.\n\nLaunch CodeBlocks and locate the `File` menu.\
    \ Under the new sub-menu that pops up, select `New` then `Project`.\n\nFind `Console\
    \ Application` within the options available in the new window that opens up. Using\
    \ the default options in the compiler, create your `C++` practical project and\
    \ type the name `Variables`. Do this for each chapter, naming the project the\
    \ respective chapter title.\n\nOn the active compiler window’s side bar, locate\
