    data from a linked list always examine the front and back data to determine if
    each is NULL. If so, then the function knows the linked list does not contain
    any nodes.


    If the node is *not* the only node on the linked list, the removeNode() function
    must determine if the node being removed is at the front of the linked list. It
    determines this by examining the previous member of the node. If the node is at
    the front of the linked list, then the previous member is NULL, and the removeNode()
    function takes the following steps to remove the node:


    +   1. The node pointed to the deleted node''s next member is assigned to the
    front data of the LinkedList class. This makes the front of the linked list.


    +   2. The previous member of the node that is now at the front of the linked
    list is assigned a NULL value, indicating there is no previous node because you
    removed its previous node. Here''s how this is done. It might look a little confusing,
    but it''s easy to understand if you take part this statement:


    node->next->previous = NULL;


    +   3. Say that you are removing Node D. The next node is Node E. Now substitute
    the numbers for the terms in this statement:


    Node->Node E->previous = NULL;


    It''s clear that the previous member belongs to Node E.

    in the third process, the removeNode() function determines if the node being removed
    is at the back of the linked list. It does this by comparing the value of the
    next member of the node to NULL. If the next member is NULL, then the node being
    removed is the last node on the linked list.


    The value of the previous member of the node is then assigned to the back member
    of the LinkedList class. This moves the previous node to the back of the linked
    list and in effect removes the node that is passed to the removeNode() function
    from the linked list.


    The value of the next member of the previous node is then set to NULL, indicating
    there isn''t another node because it is at the back of the list. The statement
    that this might seem confusing, but by replacing references to node and previous
    with the node number should clear up any confusion. Here''s the statement:


    node->previous->next = NULL;


    Say that you''re removing NodeC. The previous node is NodeB. Now substitute the
    numbers for the terms in this statement:


    NodeC->NodeB->next = NULL;'
