  md: '# # What Is an Array?


    Computer memory is like a small town—or a large town, depending on the amount
    of memory available in the computer. Each byte of memory is a building that has
    its own address called a memory address, and the town''s people are bits of data
    living in those buildings. The small town inside your computer is a neighboring
    place. A program refers to buildings by name rather than by address, and puts
    Mary''s grade in the memory building. However, being personable is troublesome
    when you need to come up with hundreds of names for these buildings. That is,
    unless you use an array. You''ll explore multidimensional arrays, pointer arrays,
    and an array of pointers to pointers in this chapter.


    # An Array


    An array is a way to refer a series of memory locations using the same name. Each
    memory location is represented by an array element. An array element is similar
    to one variable except it is identified by an index value instead of a name. An
    index value is a number used to identify an array element.'
