  md: '# A Queue


    In Chapter 5, you learned that a queue is a sequential organization of data where
    data is accessible on a first in, first out (fifo) basis, which is similar to
    the line that you stand in by concert tickets.


    The queue in Chapter 5 was created using an array to store data. As you''ll recall,
    the array is assigned to elements of the Array. The queue itself consists of two
    variables called front and back. Each points to the array element that is at the
    front of the queue or at the back of the queue. When data is removed from the
    front of the queue, the program changes the value of the front variable to point
    to the next array element. However, the data removed from the queue remains assigned
    to the Array. That is, data isn''t removed from memory.


    There is a serious problem with using arrays to store data: you must know the
    size of the array when you write the program. An array can store only a maximum
    number of elements at any point in time, similar to an architect designing a specific
    space for a box office that can accommodate a maximum number of fans at any time.


    However, there is a difference between exceeding the number of elements and overflowing
    the space around the box office: unlike the stadium, there is no parking lot for
    fans to gather while waiting in the queue to purchase tickets inside a computer.


    Programmers work around the size issue by using a linked list instead of an array
    when creating a queue. As you learned in previous chapters, a linked list can
    grow and shrink at runtime based on the needs of the application.


    # The Linked List Queue


    Conceptually, a linked queue is the same as a queue built using an array. Both
    store data. Both place data at the front of the queue and remove data from the
    front of the queue. However, in an array, data is stored in an array element.
    In a linked list queue, data is stored in a node of a linked list. The linked
    list consists of three major components: the node, the LinkedList class definition,
    and the LinkedList class definition. Collectively, they are assembled as organized
    data into a queue.


    As you''ll recall from Chapter 6, a node is created in C++ as a user-defined data
    type that contains three elements. These are the data and pointers to the previous
    node and the next node on the linked list (Figure 8-1). The next code snippet
    is the user-'
