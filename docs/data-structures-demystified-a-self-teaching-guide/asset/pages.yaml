    # Why Use a Binary Tree?


    Programmers use a binary tree to quickly look up data at each node on the binary
    tree. Let''s say that you need to find a student ID in a list of a million student
    IDs. What is the maximum number of comparisons that you''ll need to make before
    finding the student ID?


    You could make a maximum of a million comparisons if you sequentially searched
    the list of a million student IDs. More than a million comparisons are necessary
    if you randomly select student IDs from the list and then replaced those that
    didn''t match back into the list.


    However, you''d need to make a maximum of only 20 comparisons if student IDs were
    stored in a binary tree. This is because the way data is organized in a binary
    tree. Data stored on the left node is less than data stored on all the right nodes
    at any current node.


    This might sound a little confusing, but an example will make this concept clear.
    Suppose you have a list of five student IDs: 101, 102, 103, 104, and 105. These
    student IDs are stored in a binary tree so that the center student ID is the root
    node, the student ID that is less than the current node is stored on the left
    child node, and the student ID that is more than the current node is stored on
    the right child node, as shown in Figure 10–4.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_201_0.png)


    Figure 10-4 The left child node is always less than the parent node, and the right
    child node is always greater than the parent node.


    The same pattern is applied to each child node. Thus, student ID 101 is the left
    child of the node that contains student ID 102 because student ID 101 is less
    than student ID 102. Likewise, student ID 105 is the right node of student ID
    104 because student ID is greater than student ID 105.


    Let''s say you want to locate student ID 101 on the binary tree. First, you compare
    the value of the root node to student ID 101. There''s no match. Because student
    ID 101 is less than student ID 103, your next comparison uses the left node. This
    eliminates the need to compare all the nodes to the right of the node that contains
    student ID 103. You can ignore half the student IDs because you know that student
    ID 101 isn''t the right node or a child of the right node.


    After comparing student ID 101 to student ID 102, you notice two things. First,
    they don''t match. Second, student ID 102 is greater than student ID 101. This
    means you compare the left child node to student ID 101. You ignore the right
    child node and subsequent child nodes because they are greater than student ID
    101. There aren''t any right nodes of student ID 102 in this example. The next
    comparison results in a match. So, in a large binary tree, each time you do a
    comparison, you eliminate half of the remaining nodes from the search. If you
    had 1 million nodes in the tree, you would divide 1 million by 2 about 20 times
    to reduce it to one node (2^20 is about 1 million). This way, you can find the
    node you''re looking for by doing about 20 comparisons.'
