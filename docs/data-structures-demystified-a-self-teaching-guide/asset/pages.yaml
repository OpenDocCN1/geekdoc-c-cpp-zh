    # Accessing Elements of a User-Defined Data Type


    Elements of a data structure are accessed using the name of the instance of the
    structure and the name of the element separated by a dot operator. Let''s say
    you want to assign the grade A to the grade of the myStudent instance of the StudentRecord
    structure. Here''s how you would write the assignment statement:


    ```

