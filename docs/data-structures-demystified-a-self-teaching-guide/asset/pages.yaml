  md: '# CHAPTER 3 What Is an Array?


    Avoid making a common rookie mistake. Previously in this chapter you learned that
    the index for the first array element is zero, not one. Therefore, the tenth array
    element has the index 9, not 10.


    Some programmers confuse the index with the total number of array elements. That
    is, they use the value 9 within the square brackets when declaring an array because
    they assume they are declaring 10 elements. In reality, they are declaring an
    array of 9 elements. The confusion stems from the fact that 9 is the index to
    reference the tenth array element.


    With a little practice you can avoid this mistake. Remember that the value within
    the square brackets in the statement that creates an array is not an index, although
    it represents an index. This value is the number of elements you need. That is,
    you insert the number 10 within the square brackets if you need 10 array elements.
    You use the index value 9 if you want to access the tenth element.


    To allocate memory at compile time, you must know the number of array elements
    you need. Sometimes you don''t know this, especially if your program loads the
    array with data stored in a database. The amount of data stored in a database-typically
    fluctuates.


    The solution in Java is to allocate memory at runtime. Programmers call this dynamically
    allocating memory. You dynamically allocate memory using the new operator when
    declaring the array, as shown here:


    ```

    int grades[] = new int[10];

    ```


    This example looks a little strange, but it creates the same array as is created
    in the previous example. There are three things happening in this statement.


    First, the new operator tells the computer to reserve 10 array elements, each
    the size of an int data type. The new operator returns a reference to the allocated
    memory.


    Next to a reference of int type called grades is declared (int grades[]). Last,
    the reference to the memory returned by the new operator is assigned to the reference
    declared in the program.


    This can be confusing for experienced programmers to understand. If you''re confused,
    remember your visitor''s locker room: a stadium has a locker room with "Visitors"
    on the door. This is similar to the reference grades[].The visitor''s locker room
    refers to the visiting team similar to the way grades[] refers to allocated memory:
    each game brings in a different visiting team who is assigned to the visitor''s
    locker room. This is similar to assigning allocated memory to the reference grades[].'
