    # # Array of Pointers to Pointers


    The supercharger of pointers is an array of pointers to pointers because an array
    of pointers to pointers enables you to reorganize data in memory by simply referring
    to memory addresses. You were introduced to arrays of pointers to pointers at
    the beginning of this chapter. You''ll learn the ins and outs of using them.


    Be warned: an array of pointers to pointers is one of the most abstract concepts
    to grasp in programming. Therefore, it is critical that you draw a picture of
    computer memory as you analyze a program that uses an array of pointers to pointers;
    otherwise, you are bound to become unnecessarily frustrated.


    Let''s begin by recalling the basics. It probably seems that you read these times
    less in the last and this chapter, but these terms are so important to understand
    an array of pointers to pointers that we''ll talk about one more time.


    A *variable* is a reference to a memory location used to store data that is described
    in a data type. A *pointer variable* is the same as a variable except its contents
    are the memory address of another variable. A *pointer to a pointer*, which you
    learned about in Chapter 2, is a pointer variable. The contents of the pointer
    variable is a memory address of another pointer variable.'
