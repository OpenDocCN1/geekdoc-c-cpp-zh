    If the node being deleted isn''t the only node on the linked list and isn''t the
    node at the front or back of the linked list, the only other possibility is that
    the node is some-where in the middle of the linked list.


    The fourth process is to remove a node in the middle of the linked list and then
    link together the previous and next nodes. I will illustrate this with an example
    because this operation can be confusing.


    Say you''re removing NodeC. The previous node is NodeB and the next node is NodeD,
    first link NodeB to NodeD using the following statement:


    ```

    node->previous->next = node->next;

    ```


    Replace node, previous, and next with the name of the actual node to better under-stand
    this operation:


    ```

    NodeC->NodeB = NodeC->NodeD;

    ```


    Now that NodeB is linked to NodeD, you need to link NodeD to NodeB:


    ```

    node->next->previous = node->previous;

    ```


    Again, replace the node, shown, and previous with names of nodes to see how this
    operation works:


    ```

    NodeC->NodeD->previous = NodeC->NodeB;

    ```


    Both NodeB and NodeD are linked to each other, and NodeC is removed from the linked
    list.


    Although the node to the removeNode() function is no longer on the linked list,
    it remains in memory. Therefore, you need to remove the node from calling delete.
    The final step is to adjust the size member of the LinkedList to reflect one less
    node on the linked list. You do do this by decrementing the value of the size.


