  md: '# CHAPTER 9 Stacks and Queues: Insert, Delete, Peek, Find


    Sometimes you may not know the index of the node you want to remove from the linked
    list. In that case, you need to define another function that removes a node based
    on the data of the node, the node''s index. You can call this function delete().
    The deleteNode() differs from the removeNodeAt() function by the way the function
    identifies the node to remove from the linked list. The removeNodeAt() function
    locates the node to remove by using the node''s index, which is passed to the
    deleteNode() function.


    So far in this book, you''ve accessed nodes on a linked list in sequential order.
    How-ever, nodes are accessed randomly in some real-world applications. The next
    function that you will define for the LinkedList class enables you to access a
    specific node. This function is called find(), and it is used when you know the
    data contained in the node. To locate the node, you provide the function with
    the data stored in the node. The find() returns the index of the node.


    The original LinkedList class is capable of appending a new node to the linked
    list. There will be situations when you will want to insert a new node somewhere
    in the middle of the linked list. To do this, you need the insertNodeAt() function.
    The insertNodeAt() function will require two parameters. The first parameter is
    the index of the node that will be moved in the linked list to make room for the
    new node. This becomes the index of the new node. The second parameter is the
    data that will be assigned to the new node. The insertNodeAt() function creates
    the new node and adjusts references within the linked list to link the new node
    to other nodes in the list.


    Another enhancement to the LinkedList class is to retrieve data that is stored
    at a specific node. Two display functions were the only functions that you could
    use to see the data in the linked list (these function did not return anything,
    they just count the nodes). Both print all the data stored in a linked list. Call
    the new peek(). The peek() function requires that you pass the index of the node
    that contains the data you want to retrieve. It returns the data stored at node.


    The last enhancement that you''ll make to the LinkedList class is to define a
    function that returns the number of nodes on the linked list. Call this function
    getSize() and whenever you need to determine the size of the linked list.


    The following example is the revised LinkedList.h file that contains the definitions
    of the node structure and the enhanced LinkedList class. Notice that the size
    data member and the removeNode() member function are placed within the protected
    access area of the class definition. This is neither directly used by the application.
    Instead, they are used by member functions of the LinkedList class and member
    functions that inherit from the LinkedList class.'
