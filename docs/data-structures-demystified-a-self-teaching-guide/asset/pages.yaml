  md: '# Data Structures Demystified


    Once the insertNodeAt() knows that index is valid, it proceeds to create the new
    node and then insert the node in the linked list. This process begins creating
    an instance of the node structure and assigning the data to the function as an
    argument. The instance is assigned to the new_node pointer.


    Next, it must determined if there are any nodes in the linked list. You do this
    by evaluating the value of the size member of the LinkedList class. If the value
    is zero, the linked list is empty and the new node will become the only node in
    the list.


    You place the new node in the list by assigning the new_node pointer to both the
    front member of the LinkedList class and to the back member of the LinkedList
    class. The previous and next members of the node are already set to NULL by default,
    so you don''t have to do anything to the new node.


    ```

    front = new_node;

    back = new_node;

    ```


    If the linked list has one or more nodes, the insertNodeAt() function determines
    if the new node is to be inserted into the first position in the linked list by
    evaluating the value of the index passed to the function. If the index value is
    zero, the new node will become the first node on the linked list.


    Here''s how this. The new_node is assigned to the previous member of the node
    assigned to the front member of the LinkedList class. Next, the next member of
    new_node is assigned to the front member of the LinkedList class. Finally, the
    new_node is assigned to the front member.


    ```

    front->previous = new_node;

    new_node->next = front;

    front = new_node;

    ```


    If the new is not going to become the first node on the linked list, the insertNodeAt()
    function decides if the node will become the last node on the linked list by comparing
    the index to the size member of the LinkedList. If these values are equal, then
    the new node is placed at the back of the linked list. Remember that index 0 is
    the front of the list and index (size -1) is the back of the list.


    Here''s how this done. The new_node is assigned to the node that is the back of
    the linked list. Next, the node at the back is assigned to the previous member
    of the new_node. Finally, the new_node is assigned to the back member of the LinkedList
    class.


    ```

    back->next = new_node;

    new_node->previous = back;

    back = new_node;

    ```


    At this point, if the new node hasn''t been inserted in either the front or back
    of the linked list, the insertNodeAt() function assumes that the new node is to
    be inserted into the middle of the linked list.


