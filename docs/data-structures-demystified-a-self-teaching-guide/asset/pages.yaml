  md: '# # CHAPTER

    # Queues Using an Array


    You probably never thought that waiting in line in the supermarket would help
    you become a whiz at data structures, but it''s a big help: the checkout line
    at a supermarket is similar to the way data structures are organized. We''re the
    “things” organized by the supermarket line, and the same kind of organization
    is used for data within your program. The checkout line in your program is called
    a queue. In this chapter, you''ll learn the ins and outs of implementing a queue
    within your program.


    # ## A Queue


    A queue is like the checkout line at the supermarket where the first customer
    is at the front of the line, the second customer is next in line, and so on until
    you reach the last customer who is at the back of the line. Customers check out
    of the supermarket in'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Data Structures Demystified


    the order they arrive in the line. That is, the first customer is the first one
    to check out. This is referred to as first, first out (fifo).


    The same concept applies to a queue in your program. A queue is a sequential organization
    of data. Data is accessible by your program. That is, the first data in the queue
    is the first data that is accessible by your program. In this chapter, you will
    explore the simplest type of queue, a fixed size, first in, first out using an
    array. In Chapter 8, you will learn how to build a priority queue using a linked
    list. With a priority queue, the elements are removed based on two factors, the
    order they were placed in the queue and the priority of the element.


    # A Simple Queue vs. Priority Queue


    Programmers use one of kinds of queues depending on the objective of the program,
    a simple queue or a priority queue. A simple queue organizes items in a line where
    the first item is at the beginning of the line and the last item is at the back
    of the line. Each item is processed in the order in which it appears in the queue.
    The first item in line is processed first, followed by the second item and then
    the third until the last item on the line is processed. There isn''t any way for
    an item to cut the line and be processed out of order.


    A priority queue is similar to a simple queue that items are organized in a line
    and processed sequentially. However, items on a priority queue jump to the front
    of the line if they have priority. Priority is a value that is associated with
    each item placed in the queue. The program processes the queue by scanning the
    queue for items with high priority. These are processed regardless of their position
    in the line. All the other items are then processed sequentially after high priority
    items are processed.


    You''ll learn how to create and use a priority queue in Chapter 8. For now, we''ll
    keep things simple by creating and using a simple queue.


    # The Business of Queues


    Queues are very important in business applications that require items to be processed
    in the order they are received. The supermarket checkout line is a queue that
    most of us have experienced, but you won''t be creating a supermarket checkout
    line in a program unless the program is designed to simulate a checkout line.


    In the real world, queues are used in programs that process transactions. Transaction
    is a set of information such as an order form. Transaction information is received
    by a program and then placed in a simple queue waiting to be processed by another
    part of the program.'
