  md: "# Enqueue\n\nThe enqueue() member function of the QueueLinkedList class is\
    \ called whenever a new node is placed on the queue. As you see from the function\
    \ definition in the next code snippet, the enqueue () member function is sparse\
    \ because it contains only one statement, which calls the appendNode() member\
    \ function of the LinkedList class.\n\nYou don't have to include statements to\
    \ the enqueue() member function because placing a node on the queue is the same\
    \ process as appending a node to the linked list. Each new node is placed at the\
    \ back of the linked list. Therefore, the appendNode() member function is all\
    \ you need.\n\nYou may wonder why the new node is being placed on the back of\
    \ the queue, it's just because you're reusing the same code in the LinkedList\
    \ class. The new node will be placed on the back of the queue like a line at the\
    \ grocery store. Nodes are pulled off the front.\n\nThe enqueue() member function\
    \ has one argument, which is the data that is assigned to the node. In this example,\
    \ the node is used to store an integer. However, you can store any type of data\
    \ in a node. In fact, the data can be a pointer to a set of data as such information.\
    \ To change this example from integer data to another type of data, you'd need\
    \ to change the data element in the Node structure to reflect the type of data\
    \ you want to store in the node.\n\nData received by the enqueue() member function\
    \ is passed to the appendNode() member function. Figure 8-2 illustrates how the\
    \ appendNode() member function places a new node at the back of the linked list.\
    \ At the top of the illustration is a list that contains two nodes. The appendNode()\
    \ is then called to add a new node to the back of this linked list.\n\nThe first\
    \ step in this process assigns a reference to the new node to the next member\
    \ of the front node. The front node is Node 2 and is assigned the reference Node\
    \ 3 as the value of the new node in the linked list. This makes Node 3 the back\
    \ of the linked list.\n\nThe second step assigns reference to Node 2 as the value\
    \ of the previous node in Node 3 to know which node comes before Node 3 in the\
    \ linked list.\n\nThe last step is to assign Node 3 as the new value of the back\
    \ data member of the LinkedList class.\n\n```\nvoid enqueue(int x) {\n    appendNode(x);\n\
    }\n```"
