  md: '# Multidimensional Arrays


    The array described in this chapter is referred to as a one-dimensional array
    because the array consists of one series of elements. However, an array can have
    more than one series of elements. This is called a multidimensional array.


    A multidimensional array consists of two or more arrays defined by sets of array
    elements, as shown in Figure 3-2. Each set of array elements is considered the
    primary array, and the second and subsequent sets of array elements are considered
    subarrays.


    There are two arrays in the multidimensional array shown in Figure 3-2. Each element
    of the first array points to a corresponding array. For example, letters[1] in
    Figure 3-2 points to the array beginning with array element letters[1] [0] where
    the zero is the first element of the second array.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_59_0.png)


    | 0 | 0 |

    |---|---|n| 0 | 1 |

    | 0 | 2 |

    | 1 | 1 |

    | 1 | 2 |

    | 2 | 0 |

    | 2 | 1 |


    **Figure 3-2** A two-dimensional array is a multidimensional array consisting
    of two arrays.


    Although you can create an array with any size multidimension, many programmers
    limit an array to two dimensions. Any size greater than two dimensions becomes
    unwieldy to manage.


    An analogy we find helpful is visualizing a table (rows and columns) for a two-dimensional
    array and a cube (or similar figure) for a three-dimensional array.


