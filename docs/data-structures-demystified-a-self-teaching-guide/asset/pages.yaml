    ```


    You use elements of a structure the same way you access a variable in your program
    except you must reference the name of the instance and the name of the element
    in order to access the element. The combination of instance name and element name
    is the alias for the memory location of the element.


    # User-Defined Data Type and Classes


    Structures are used in procedure languages such as C. Object-oriented languages
    such as C++ and Java use both structures and classes to group together unlike
    primitive types into a cohesive unit.'
