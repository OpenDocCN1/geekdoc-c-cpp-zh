- img_proc: true
  md: '# Data Structures Demystified


    The branch node is the fork in the road that links the root node to two branches.
    Each branch terminates with a child node. Programmers call these the left branch
    and the right branch.

    As you can see, a binary tree defines a parent-child relationship among nodes.
    A parent-child relationship is relative to a node. All nodes except the root node
    have a parent node. However, some nodes have no children, other nodes have one
    or two child nodes. Programmers determine the parent-child relationship by selecting
    a node, which is called the current node. The node that spawns the current node
    is called the current node''s parent node. The node or nodes spawned by the current
    node is called the child node.

    The child node is also referred to as the left node or the right node, on which
    direction the branch nodes come from the current node. If the current node doesn''t
    have any child nodes, then the current node is referred to as the leaf node. A
    leaf node is located at the bottom of the tree. If you look at your favorite tree,
    you''ll notice the end of every branch is either another branch (child node) or
    a leaf, and that''s why programmers call a node with no child nodes a leaf node.


    # Depth and Size


    A binary tree is described using two measurements: tree depth and tree size (see
    Figure 10-3). Depth is the number of levels in the tree. A new level is created
    each time a root node branches to a child node. For example, one level is created
    when the root nodes branch into child nodes.


    The size of a tree is the number of nodes in the tree. For example, in Figure
    10-3 has one node, which is the root node. The second level has up to two nodes,
    the third level may have up to four nodes. Programmers estimate the size of a
    tree by using the following formula.


    ```

    size ≈ 2^depth

    ```


    Let''s say the binary tree has five levels, which is a depth of 5. Here''s how
    you estimate the size of the tree:


    ```

    32 ≈ 2^5

    ```


    The size is an approximation because the tree may or may not be balanced. A balanced
    tree is a binary tree where each current node has two children. An unbalanced
    tree is a binary tree where one or more current nodes have fewer than two child
    nodes. This formula gives you a rough idea of how well balanced the tree is. Binary
    trees are usually used for very large data sets. The formula is not terribly accurate
    for the small tree shown in Figure 10-3.'
