  md: '# CHAPTER 10 What Is a Tree?


    Programmers think of every node as the root node and all subsequent nodes as its
    own subtree. They approach nodes in this way because functions that deal with
    trees are recursive. A function works on a child node and performs the same functionality
    as the child is the root node of the entire tree. That is, the value of the child
    node is compared to the value of its left node and right node to determine which
    branch of the tree to pursue.


    # The Key


    Each node of a tree contains a key that is associated with a value similar to
    the relationship between a primary key of a database and a row within a table
    of the database. A key is a value that is used to search criteria. If the index
    and the search criteria match, the application retrieves data stored in the row
    that corresponds to the key. The data is referred to as the value of the node,
    as shown in Figure 10-5.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_202_0.png)


    Figure 10-5 Each node has an index and a value; the index uniquely identifies
    the node and retrieves the value of a node.


    Any data type can be used as the key. We use a string as the key in examples in
    this chapter, but we could have chosen any data type. Unlike the primary key of
    a database, the key to the tree doesn''t have to be in natural order. That is,
    the key doesn''t have to be in alphabetical order or numerical order. In a typical
    tree implementation,'
  merge: -1
