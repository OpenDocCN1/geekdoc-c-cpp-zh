- img_proc: true
  md: '# Data Structures Demystified


    # A Stack


    When you hear the term "stack" used outside the context of computer programming,
    you might envision a stack of dishes on your kitchen counter. This organization
    is structured in a particular way: the newest dish is on top and the oldest is
    on the bottom of the stack.


    Each dish in a stack is accessed using fifo: first in, first out. The only way
    to access each dish is from the top of the stack. If you want the third dish (the
    third oldest on the stack), you must remove the two dishes from the top of the
    stack. This places the third dish at the top of the stack making it available
    to be removed.


    There''s no way to access a dish unless the dish is at the top of the stack. You
    might be thinking stacks are inefficient, and you''d be correct if the objective
    was to randomly access things on the stack. There are other data structures that
    are ideal for random access, which you''ll learn about this book.


    However, if the object is to access things in the order they were placed on the
    stack, as computer instructions, stacks are efficient. In these situations, using
    a stack makes a lot of sense.


    > NOTE: Stacks and arrays are often bantered about in the same discussion, can
    easily lead to confusion, but they are really two separate things (see Figure
    4-1). An array stores values in memory; which array element is the top of the
    stack. When a value is popped off the stack, the value remains in memory because
    the value is still assigned to an array element. Popping it only changes the array
    element that is at the top of the stack.


    # Inside a Stack


    Programmers use arrays to store values that are referenced by a stack. As you''ll
    recall from Chapter 3, an array consists of a series of array elements, each of
    which is similar in concept to a variable. The stack contains the index of the
    array element that is at the top of the stack.


    Figure 4-1 is the way we envision an array used with a stack. This example shows
    an array called with 8 array elements. The entire array contains values that are
    referenced by the stack. Three array elements are assigned values, while the other
    array elements are empty and can be used when new items are placed on the stack
    (see the upcoming section "Push").


    Mike is the first value placed on the stack. You know this because Mike is at
    the bottom of the stack. Bob is the last item placed on the stack because Bob
    is the top item of the stack.'
