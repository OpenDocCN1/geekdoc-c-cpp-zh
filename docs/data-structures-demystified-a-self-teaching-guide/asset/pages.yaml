    application. However, you probably noticed that the parameter passed to the add()
    method is somewhat different from the parameter to the appendNode() member function.
    The parameter to the appendNode() member function is an integer, which is a primitive
    data type. However, the add() member method requires an object and not a primitive
    data type.


    As you''ll remember from your Java programming class, Java has a wrapper class
    for primitive data types. A wrapper class definition contains a data member that
