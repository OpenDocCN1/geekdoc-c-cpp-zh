    the actual data for the entry of the hashtable.


    Each user-defined structure is assigned to a specific array element based on the
    user-defined structure''s key. The key is translated into a number that the array
    index uses. This number is called a *hash value* and is created by the process
    called *hashing*. The hash value becomes the array index of the array element
    that points to the user-defined structure whose key is hashed. Each index in Figure
    11-1 is the hash value of the key of the user-defined structure.


    You can think of hashing as a way to come up with index of the array element associated
    with an entry in the hashtable. You''ll learn how to perform hashing in your application
    layer this chapter.


    Hashing achieves an even distribution of index values, which makes formation faster
    than if a string of bits is in a natural order. In a natural order, words and
    names follow a predictable pattern. By shuffling the bits that make words and
    names, a program no longer treats bits as a text and instead randomizes the bits
    to make them more efficient to search.


    Hashing is a high-speed scheme for taking a key that has natural sequence (alphabetic
    or numerical) and pseudo-randomizing. If the key is a name, certain letters appear
    more than other letters, and sequences of characters occur more frequently than
    other characters. Hashing moves the bits around to produce an even distribution
    of hash values, which is needed to quickly search a hashtable.


    The result of hashing is a number that has no real significance, but it is used
    as an array index to store and retrieve information that is associated with an
    entry that is stored in a hashtable. Indices in Figure 11-1 are hash values of
    the corresponding key of the user-defined structure pointed to by the array element.


    # Problems with Hashing


    Hashing is not perfect. Occasionally, a collision occurs when two different keys
    hash into the same hash value and are assigned to the same array element. Programmers
    have come up with various techniques for dealing with this conflict.


    A common way to deal with a collision is to create a linked list of entries that
    have the same hash value. For example, say that the key of each entry hashes to
    the same hash value, and this results in both being assigned to the same array
    element of the hashtable, as shown in Figure 11-2.


    Because two entries cannot be assigned the same array element, the programmer
    creates a linked list. The first user-defined structure is assigned to the pointer
    in the array element. The second is not assigned to any array element and is instead
    linked to the first user-defined structure, thereby forming a linked list.'
