  md: '# Declaring Variables and Objects


    Memory is reserved by using a data type in a declaration statement. The form of
    a declaration statement varies depending on the programming language you use.
    Here is a declaration statement for C, C++, and Java:


    ```

    int myVariable;

    ```


    There are three parts to this declaration statement:


    +   * Data type Tells how much memory to reserve and the kind of data that will
    be stored in that memory location

    * Variable name A name used within the program to refer to the contents of that
    memory location

    * Semicolon Tells the computer this is an instruction (statement)


    # Primitive Data Types and User-Defined Data Types


    In Chapter 1, you were introduced to the concept of abstract data types, which
    are used to reserve memory. Abstract data types are divided into two categories,
    primitive data types and user-defined data types. A primitive data type is defined
    by the programming language, such as the data types you learned in the previous
    chapter. Some programmers call these built-in data types.


    The other category of abstract data type, a user-defined data type, is a group
    of primitive data types defined by the programmer. For example, let''s say you
    want to store students'' grades in memory. You''ll need to store 4 data elements:
    the student''s ID, first name, last name, and grade. You could use primitive data
    types for each element, but primitive data types are not grouped; each exists
    as separate data elements.


    A better approach is to group primitive data types into a user-defined data type
    to form a record. You probably heard the term "record" when you learned about
    databases. Remember that a database consists of one or more tables. A table is
    similar to a spreadsheet consisting of columns and rows. A row is also known as
    a record. A user-defined data type defines columns (primitive data types) that
    comprise a record (a user-defined data type).


    The form used to define a user-defined data type varies depending on the programming
    language used to write the program. Some programming languages, such as Java,
    do not support user-defined data types. Instead, attributes of a class are used
    to group together primitive data types; this is discussed later in this chapter.'
