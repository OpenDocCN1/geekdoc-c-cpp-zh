  md: '# The Structure of a Linked List


    Each entry in a linked list is called a node. Think of a node as an entry that
    has three subentries. One subentry contains the data, which may be one attribute
    or many attributes. Another points to the previous node, and the last points to
    the next node. When you enter a new item in a linked list, you allocate the new
    node and set the pointers to previous and next nodes.


    Programmers create a node in C++ by using either a structure or a class object;
    our example uses a user-defined type. As you recall from your C++ programming
    course, a structure is a user-defined data type. The following example is a structure
    used to define a node. Figure 6-2 shows a node.


    ```

    typedef struct Node {

    struct Node(int data) {

    this->data = data; previous = NULL; next = NULL;

    int data;\struct Node* previous;

    struct Node* next;

    } NODE;

    ```


    The structure might look a bit strange even if you are familiar with structures
    because this example uses a pointer to the structure itself as two of its attributes.
    We''ll clear up any confusion by taking apart this example. The structure is called
    Node.


