  md: '# CHAPTER 9 Stacks and Queues: Insert, Delete, Peek, Find


    This process begins by declaring a pointer called temp and assigning the node
    at the front of the linked list. Next, the function finds the node at the index.
    This node will be moved to the right. However, it''s not set to the node previous,
    it''s set to the index position and the node in that is moved to the right. It
    does this using a loop. For each iteration, the node is assigned to the next member
    of the temp node is assigned to the temp node. This sounds confusing, but will
    be clearer if you examine what is happening.


    Say there are five nodes on the linked list, as shown in Figure 9-1. The front
    node is NodeA, and the initial value of temp is NodeA. Say you want to insert
    NodeN at index 2.


    Before the first iteration, temp = NodeE. During the first iteration, here''s
    what happens:


    ```

    temp = temp->next

    temp = NodeA->NodeB

    temp = NodeB

    ```


    After the first iteration, temp is assigned NodeB and the value of i is 1, which
    is less than the value of the index, so another iteration executes. Here''s what
    happens:


    ```

    temp = temp->next

    temp = NodeB->NodeC

    temp = NodeC

    ```


    The temp pointer now points to NodeC, and the value of i is 2, which is equal
    to the value of the index, so there are no additional iterations and the temp
    pointer points to NodeC.


    Now you''re at the desired location within the linked list, it is time to switch
    pointers around insert the new node into the list. Here''s how to do it:


    ```

    new_node->next = temp;

    new_node->previous = temp->previous;

    temp->previous->next = new_node;

    temp->previous = new_node;

    ```


    Confused? If you''re not alone, because is what is happening isn''t intuitive.
    I''ll clarify the code by substituting nodes for pointers.


    ```

    new_node->next = NodeC;

    new_node->previous = NodeC->NodeB;

    NodeC->NodeB->next = new_node;

    NodeC->previous = new_node;

    ```


    Figure 9-3 shows the linked list after the new node is inserted into index 2 position
    of the list. I''ve called the new node NodeN.'
