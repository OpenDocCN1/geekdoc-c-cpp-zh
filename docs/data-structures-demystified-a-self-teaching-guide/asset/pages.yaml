  md: '# Assigning an Address to a Pointer


    An address of a variable is assigned to a pointer by using the address operator
    (&). Before you learn about dereferencing a variable, let''s review an assignment
    statement. The following assignment statement tells the computer to copy the value
    stored at the memory location that is associated with the oldGrade variable and
    the value into the memory location associated with the oldGrade variable:


    ```

    oldGrade = grade;

    ```


    An assignment statement implies that you want the contents of a variable and not
    the address of the variable. The address operator tells the computer to ignore
    the implied assignment and assign the address of the variable and not the content
    of the variable.


    The next example tells the computer by using the address operator to copy the
    address of the variable to the pointer variable. That is, memory address of the
    grade variable is copied to the ptGrade pointer variable, and the memory address
    of the studentNumber is assigned to the ptStudentNumber pointer:


    ```

    ptGrade = &grade;

    ptStudentNumber = &studentNumber;

    ```


    Figure 2-4 depicts memory after the previous two statements execute. Notice that
    the grade variable is an alias for memory address 3 and the studentNumber variable
    is the alias for memory address 1. The content of ptGrade pointer is 3, which
    is the memory address of the grade variable. Likewise, the content of pointer
    ptStudentNumber is 1, which is the memory address of studentNumber.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_43_0.png)


