    # Push


    Programmers use the term “push” to place an item on a stack. Push is the direction
    that data is added to the stack. Think of this as pushing down the stack to move
    items already on the stack to make room for the next item.

    Here’s what happens. The new value is assigned to the next available array element
    and the index of that array element becomes the top of the stack, as shown in
    Figure 4-2. The program increments the current index of the stack by 1. In example,
    the index is incremented by 1, resulting in index 3 being at the top of the stack,
    which is the index of the new values assigned to the array.


    | Array | Stack |

    | --- | --- |

    | stack[0] | New Value 2 Top |

    | stack[1] | Bob 1 |

    | stack[2] | Mary |

    | stack[3] | New Value | Mike 0 Index |

    | stack[4] | | |

    | stack[5] | | |

