    # Dequeue


    dequeue() member function of the QueueLinkedList class removes a node from the
    front of the queue. Unfortunately, there aren''t any member functions in the LinkedList
    class that remove a node from the back of the linked list. Therefore, the dequeue()
    member function must do the job.


    The dequeue() function begins by determining if there are any nodes on the queue
    by calling isEmpty(). The isEmpty() member function returns a Boolean true if
    the queue is empty, in which case the dequeue() returns -1. A Boolean false is
    returned if there is at least one node on the queue.


    Figure 8-3 shows how dequeue() works. There are three nodes on the queue, so the
    isEmpty() member function returns a Boolean false, causing the program to remove
    the front node from the queue.'
