    # Why not an Array?


    There are two important differences between an array element and a variable, and
    those differences make working with large amounts of data a breeze. Suppose you
    had to work with 100 grades to calculate the average grade. How would you do this?
    You know


    The challenge isn''t applying the formula for an average. The challenge is to
    come up with 100 variable names and refer all those variable names in a program.


    First, you''d need to sum all the grades by writing a statement similar to the
    following.(We''d stop at three variables because it''s difficult to identify 100
    variables—and we''d run out of space on this page.)


    ```

    sum = myGrade + bogGrade;

    ```


    Now, here''s a smart programmer meets this challenge using array:


    ```

    sum = 0;

    for (int i = 0; i < 100; i++)

    sum = sum + grades[i];

    ```


    Big difference. The variable of the for loop is the index for the array element,
    enabling the program to quickly walk through all array elements in two lines of
    code.(The first statement has nothing to do with walking through all array elements.
    It only initializes the sum variable with the total grades.)


    The other difference between an array and a variable is that all the array elements
    are next to each other. Variables can be anywhere in memory. For example, grades[0]
    is next to grades[1] in memory, grades[1] is next to grades[2] and so on. In contrast,
    myGrade and bogGrade variables can be anywhere in memory, even if they are declared
    in the declaration statement.


    You might be scratching your head right now thinking, that''s an interesting bit
    of computer trivia. So what? The location of array elements is important when
    pointers (see Chapter 2) are used to manipulate data stored in memory. It is more
    efficient to point array elements than variables because the computer moves to
    the next memory location where you point to pointers.


    # Arrays and Data Structures


    Some programmers might say that arrays are the backbone of data structures because
    an array enables a programmer to easily reorganize hundreds of values stored in
    memory by using an array of pointers.'
