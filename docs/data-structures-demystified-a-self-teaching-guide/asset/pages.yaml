  md: '# Declaring and Using an Array of Pointers to Pointers


    An array of pointers to pointers is declared nearly the same way as you declare
    an array of pointers, except two asterisks (**) are used before the name of the
    array,

    shown here:


    ```

    string **ptStudents[3];

    ```


    The data type of an array of pointers to pointers is used a little differently
    than the data type of an array of pointers. Previously in this chapter, you learned
    that the data type of an array of pointers refers to the data type stored at memory
    addresses that are assigned to elements of the pointer array.


    Suppose you declared an array of strings and an array of pointers to strings and
    assigned memory addresses of the string array to the pointer array. The data type
    of the pointer array is a string type, which tells the computer that elements
    of the pointer array contain memory addresses of strings.


    The data type of an array of pointers corresponds to the data type of the pointers
    that are assigned to elements of the array of pointers to pointers. Let''s say
    you assign elements of the pointer array to elements of the array of pointers
    to pointers. Because the pointer array points to strings, the array of pointers
    to pointers must also use the string data type.


    The data type of an array of pointers tells the computer that the memory address
    contains a memory address that is a pointer. This pointer contains a memory address
    of a string or whatever data type specified when the pointer is declared.


    # Assigning Values to Elements of an Array of Pointers to Pointers


    You assign a value to an element of an array of pointers to pointers the same
    way you assign a value to an element of an array of pointers. That is, use the
    address operator (&) to refer this pointer variable or an element of an array
    of pointers, shown here:


    ```

    ptStudents[0] = &ptStudents[0];

    ```


    You''ll recall that the address operator tells the computer to assign the memory
    address of a pointer variable or array element to the element of the array of
    pointers to pointers, not the value stored at that address. The previous example
    assigns the memory address of a pointer array to the element of the array of pointers
    to pointers. It does not assign the contents of the ptStudents[0], which is also
    a memory address.'
