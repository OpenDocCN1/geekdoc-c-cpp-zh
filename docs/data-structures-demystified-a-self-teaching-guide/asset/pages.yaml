    # An Array of Pointers


    Previously, you learned that pointers are the backbone of data structures. Some
    programmers feel that an array of pointers, also known as a pointer array, is
    the backbone of pointers. An array of pointers is an array whose elements are
    pointers. That is, the value of each element is a memory address similar to a
    pointer variable, which you learned about Chapter 2.


    The benefit of using an array of pointers instead of several pointer variables
    is that you can use a for loop to step through each element of the array to access
    memory addresses that are assigned to the array. You''ll need to to efficiently
    access and reorder values stored in memory.


    An array of pointers is not available in all programming languages. For example,
    Java doesn''t let programmers use pointers, so you won''t be able to create an
    array of pointers in Java. However, you can create an array of pointers in C and
    C++.


    > NOTE: It is technically incorrect to say that Java doesn''t use pointers. Java
    does use pointers, but a programmer doesn''t explicitly declare them. You can
    declare an array whose data type is a Java object, and this is in fact an array
    of pointers. The value of each array element is an object. When you switch these
    values to other array elements, you are moving memory addresses and not the object
    itself.'
