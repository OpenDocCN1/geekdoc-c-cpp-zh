  md: '# CHAPTER 1 Memory, Abstract Data Types, and Addresses


    Since each byte of memory has its own memory address, you might assume a short
    has two memory addresses because it uses 2 bytes of memory. That''s not the case.
    The computer uses the memory address of the first byte to reference any abstract
    data type that reserves multiple bytes of memory.

    Let''s say that space was reserved in memory for a short abstract data type (see
    Figure 1-10). Two memory locations are reserved, memory addresses 400 and 401.
    However, only memory address 400 is used to reference the short. The computer
    automatically knows that the value stored in memory address 401 is part of the
    value stored in memory address 400 because the space was reserved using an short
    abstract data type. Therefore, the computer copies all the bits from memory address
    400 and all the bits from memory address 401 whenever a request is made by the
    program to copy the integer stored at memory address 400.


