  md: '# CHAPTER


    # # What Is a Tree?


    If you are going to tour your school (Columbia University), you travel down the
    road a bit before seeing a fork in the road. You then have two choices: bear left
    and you''ll be on campus; bear right and you''ll be lost. What does this have
    to do with a tree data structure? Everything. A tree data structure is similar
    to the road because it provides you with a series of forks in the road that lead
    you down a path to reach a decision. In this chapter, you''ll learn about the
    concept of trees, and we''ll show you how to build your own tree data structure.


    # ## A Tree


    When you read the word “tree” in the title of this chapter, you probably imagined
    your favorite tree covered with a full coat of green leaves. However, this doesn''t
    truly represent the tree that we''ll be talking about Instead, envision a tree
    barren of leaves, where all you can see are branches stretched in all directions.
    Each stem terminates with only two branches, similar to a fork in the road. Those
    branches lead to other stems and other forks.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_196_0.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Data Structures Demystified


    This type of tree is a binary tree. Binary means two, as you learned when you
    studied the binary numbering systems in your first computer course. The binary
    numbering system consists of two digits, zero and one.


    A binary tree is a tree where each stem has no more than two branches (see Figure
    10-1). Typically, the stem has two branches, but there can be situations when
    the stem has one or simply terminates, resulting in no additional branches.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_197_0.png)


    Figure 10-1 A binary tree is a tree where each stem has no more than two branches.


    # Why Use a Binary Tree?


    Programmers use a binary tree as a model to create a data structure to encode
    logic used to make complex decisions. Here''s how this works. Let''s say that
    a stem consists of a set of program instructions. At the end of the stem, the
    program evaluates a binary expression. You''ll recall that a binary expression
    evaluates to either true or false. Based on the evaluation, the program proceeds
    down one of two branches. Each branch has its own set of program instructions.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# CHAPTER 10 What Is a Tree?


    The basic concept of a binary tree isn''t new to you because it uses Boolean logic
    that you learned to implement using an if statement in your program. An if statement
    evaluates an expression that results in a Boolean value. Depending on the Boolean
    value, the if statement executes one of two sets of instructions. However, a binary
    tree is much more than an if statement, as you''ll learn in this chapter.


    # Parts of a Binary Tree


    Although we introduced the concept of a binary tree with terms commonly used when
    referring to a tree, programmers established different terms to refer to parts
    of a binary tree. Let''s take a moment to become familiar with those terms. "Node"
    is the term used to describe a termination point. There are three kinds of termination
    points in a binary tree (see Figure 10-2): the starting node, the ending node,
    and the branch node. The starting node is called the *root node*, which is the
    top-level node in the tree. The stem leading from the root node leads to the branch
    node.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_198_0.png)


    Figure 10-2 A binary tree is comprised of several nodes, each of which are related
    to other nodes on the tree.'
  merge: -1
