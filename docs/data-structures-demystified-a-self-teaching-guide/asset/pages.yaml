    a memory address. You could say that those seven boxes share the memory address
    of box 423.


    # # Real Memory Addresses


    Memory addresses are represented so far throughout this chapter as a decimal value,
    as as "box 423." In reality, memory addresses are a 32-bit or 64-bit number, depending
    on the computer''s operating system, and are represented as a hexadecimal value.


    Hexadecimal is a numbering system similar to the decimal and binary numbering
    systems. That is, hexadecimal values are used to count and they are used in arithmetic.
    The hexadecimal system has 16 digits from 0 through 9 and A through F, which represents
    10 through 15. Here is how memory address 258,425,506 is represented in hexadecimal
    notation 0x0F6742A2.


    # # Abstract Data Types and Memory Addresses


    Previously in this chapter you learned that you reserve memory for data by using
    an abstract data type. Some abstract data types reserve memory in a size that
    is greater than 1 byte. For example, the short abstract data type in Java reserves
    2 bytes of memory.'
