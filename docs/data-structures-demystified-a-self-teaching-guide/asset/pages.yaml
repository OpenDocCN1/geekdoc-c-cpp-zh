    internal workings of the tree.


    # Creating a Binary Tree


    Let''s create a binary tree by first defining a structure. Call the structure
    Metadata be-

    cause it describes data that is used in the binary tree, and "metadata" refers
    to data that

    describes other data, such as how an employee ID can be used to get the employees

    name. Metadata typically refers to name/value pairs, or in our case, key/value
    pairs.


    Each instance of the data structure is a node on the binary tree and contains
    four

    data elements. The first two data elements are the key and the value. In this
    example-

    ble, the key and value are char arrays. The size of these arrays is determined-

    nined by the #define preprocessing directive at the top of this example. You set
    the

    ray size by using the preprocessing directive you can easily change the

    value in one place within the application without having to locate every place
    in

    the code where array sizes are used.


    The other two data elements of the metadata structure are pointers called left

    right. Each of these points to a metadata structure. In other words, they point

    to the next node on the left and on the right of the current node. This enables
    the ap-

    lication to do two things. First, the application can move to the next level of
    the tree.

    it can also access both the key and the value of nodes at the next level.


    You might become confused when looking at the example of the structure defini-

    cation the structure itself uses to initialize data elements of the structure.

    Here''s what''s happening. A key and related value are paired to the metadata
    stru-

    ture an instance of the metadata structure is declared, that is, when a new node

    is inserted into the binary tree. Both of these are passed as char pointers because

    they are arrays.


    The application copies the key and the value to the data elements of the instance
    of

    the structure using the strcpy() function. The strcpy() function

    copies the second parameter to the first parameter. Notice the this operator is
    used

    in example. As you''ll recall from your programming course, the this operator

    tells the compiler that you want to refer to the data element of this instance
    of the

    structure instead of the parameter that was passed in.


    The last two data to be initialized are the left and right pointers. Both of

    these are set to NULL because the new node doesn''t have a child node when the
    new

    node is created. Later in this chapter, you''ll define a function that adds a
    child node

    and replaces the NULL with reference to an actual.


