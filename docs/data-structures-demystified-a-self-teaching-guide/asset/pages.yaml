  md: '# CHAPTER 5 Queues Using an Array


    Let''s return to a supermarket to see how this works. The cash register is a computer
    that runs a transaction program that, among other things, processes the bar code
    on each product scanned at the checkout counter.


    One of the first steps to processing the bar code is to look up the price. There
    could be 20 or more cash registers in a busy supermarket all trying to look up
    at the same time. However, the computer can process only one bar at a time. The
    program looks up prices manages the demand by using a simple queue in which each
    new request is placed at the back of the queue, and the program looks up the bar
    code that is at the front of the queue.


    Many other applications use a simple queue to maintain the order in which process
    items. These include programs that process stock and bond trades and those that
    students registering for a course. Queues are also used within a computer to manage
    printing.


    # The Array and the Queue


    Data organized by a queue may be stored in an array. The queue determines the
    array element that is at the front and back of the queue. The array is not the
    queue. Likewise, the queue is not the array. Both are two separate things. This
    is an important concept to grasp and one that may be difficult to understand at
    first.


    Take a look at Figure 5-1 and you will see how an array and a queue are different
    and yet linked together to organize data. The array is pictured as a block of
    elements.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_98_0.png)


    Figure 5-1 The queue is different from the array used to store data that appears
    in the queue.'
