  md: '# Data Structures Demystified


    # Pop


    Popping is the reverse process of pushing: it removes an item from the stack.
    It is important to understand that popping an item off the stack doesn''t copy
    the item. Once an item is popped from the stack, the item is no longer available
    on the stack, although the value remains in the array.


    Here''s really what happens. Remember that the top of the stack contains an index
    of the array element whose value is at the top of the stack. In Figure 4-2, index
    3 is at the top of the stack, which means New Value in array element 3 is at the
    top of the stack.


    When you pop New Value from the stack, you decrement the index at the top of the
    stack. That is, you make your index 2 instead of 3. This makes Bob the new value
    at the top of the stack (see Figure 4-3). Notice that New Value and array element
    3 remains untouched in the array popping a value from the stack only alters the
    stack, not the underlying array.


    | Array | Stack |

    | --- | --- |

    | stack[0] | Bob 2 ← Top |

    | stack[1] | Mary 1 |

    | stack[2] | Bob |

    | stack[3] | Mike 0 Index |

    | stack[4] | New Value |

    | stack[5] |

    | stack[6] |

    | stack[7] |


    **Figure 4-3** All values move toward the top of the stack when the top item is
    popped off the stack.


    # Creating a Stack in C++


    You can create a stack in C++ by defining a stack class and declaring an instance
    of the class. The Stack class requires three attributes and several member functions,
    which are defined as you learn about them. You''ll begin by defining a basic stack
    class that has only the components needed to create the stack.'
