  md: '# # A Linked List


    A linked list is a data structure that makes it easy to rearrange data without
    having to move data in memory. Sound a little confusing? If so, picture a classroom
    of students who are seated in no particular order. A unique number identifies
    each seat, as shown in Figure 6-1. We''ve also included the relative height of
    each seat, which we''ll use in the next exercise.


    Students


    | Seat 1 | Seat 2 | Seat 3 |

    | --- | --- | --- |

    | Bob | Mary | Adam |

    | Short | Tail | Medium |


    | Alphabetical list | Size list |

    | --- | --- |

    | 3 | 2 |

    | 1 | 3 |

    | 2 | 1 |


    **Figure 6-1** Students are seated in a classroom in random order.


    Let''s say that a teacher needs to place students names in alphabetical order
    so she can easily find a name on the list. One option is to have students change
    their seats so that Adam sits in seat 1, Bob sits in 2, and Mary in seat 3. However,
    this can be chaotic if there are a lot of students in the class.


    Another option is to leave students seated and make a list of seat numbers that
    corresponds to the alphabetical order of students. The list would look like this:
    3, 1, and 2, as shown in Figure 6-1. The student in seat 3 is the first student
    who appears in alphabetical order, followed by the student seated in seat 1, and
    so on. Notice this option doesn''t disrupt the class.


    Suppose you want to rearrange students in size order. There''s a pretty good chance
    that you won''t move students around the classroom. Instead, you''d create another
    list of seat numbers that reflect each student''s height. Here''s the list: 1,
    3, and 2, which is illustrated in Figure 6-1. The list can be read from bottom
    to top for the shortest to tallest or vice versa for tallest to shortest.


    Once the list is created, the teacher can simply go down the list to see which
    contains the next student. To quiz students in alphabetical order, the teacher
    would use the alphabetical list to see that the student sitting in seat 3 is alphabetically
    first, followed by seat 1. The teacher can be tricky and call on the previous
    student by looking at the list to determine the student''s seat.'
