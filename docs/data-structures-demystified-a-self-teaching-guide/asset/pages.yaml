  md: '# The Enhanced LinkedList Class


    nYou might wonder why you need to enhance the LinkedList class that was defined
    in previous chapters. The simple answer is that you can increase the efficiency
    of the LinkedList class and make it easier to use if you increase the functionality
    of the class.


    As you recall, the LinkedList class creates an instance of the Node structure
    as defined in LinkedList.h. The Node structure has three elements: the data stored
    in the node, a reference to the next node, and the previous node on the linked
    list.


    The LinkedList class that you used in previous chapters contains two members and
    six member functions. The data members are references to the node that is at the
    front of the linked list and reference to the node that is at the back of the
    linked list.


    The LinkedList has member functions that can append a node to the linked list
    and display data assigned to nodes in forward or reverse order, as well as a function
    to destroy the linked list. The LinkedList has a constructor and destructor.


    These data members and member functions are the barebones that are necessary for
    the LinkedList class to operate. Now you''ll take a few steps forward and increase
    the functionality of the LinkedList class to make it more useful when working
    with a linked list application.


    The first enhancement is to define a new data member size. The size data member
    is an integer that represents the number of nodes that are in the linked list.
    The index is used, but size determines whether the list is empty or you passed
    an invalid index. It can be used any time the application needs to know the size
    of the linked list.


    Next, you will define additional member functions, first of which is the removeNode()
    function which enables you to move a node from the linked list by specifying a
    reference to the node. The removeNode() function then removes the node and relinks
    the linked list. This function is protected because it''s only used internally.
    The user of this class would not know the pointers to the individual nodes. This
    is a convenient function to remove nodes.


    Another function that you''ll define is removeNodeAt(), which removes a node at
    a particular location in the linked list. The order in which nodes appear on the
    list is referred to as the index order. The index is passed to the removeNodeAt()
    function to specify the node that is to be removed from the linked list. The removeNodeAt()
    function removes the node and relinks the linked list. The node on the front of
    the list is index 0; it then increments by one, moving towards the back of the
    list. The appendNode() function adds nodes to the back of the linked list, so
    you can think of this as a dynamic array moving from front to back.'
