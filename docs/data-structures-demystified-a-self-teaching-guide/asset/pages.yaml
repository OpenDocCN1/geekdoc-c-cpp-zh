  md: '# CHAPTER 6 What Is a Linked List?


    Programmers call this sort of list a linked list because each item on the list
    is linked to the previous item and the next item. That is, the seat of the current
    student is linked to the seat of the previous student and the seat of the next
    student by the list.


    # The Real World and Linked Lists


    It is very important to keep the real world in mind as you learn how to use a
    linked list; otherwise, you''ll fall into the trap of thinking that a linked list
    is an abstract concept that has little use in the real world. Actually, linked
    lists play a critical role in applications that help companies and governments
    manage data dynamically.


    There are two versions of a linked list, a single link and a double link. A single
    link enables a program to move through the list in one direction, which is usually
    from the front of the list moving to the end of it. A doubly linked list enables
    the program to move through the list in both directions. We''ll focus on the doubly
    linked list for most of the examples in this chapter and then discuss the single
    link list toward the end of the chapter.


    Although we''ve mentioned that an entry in a linked list contains data and pointers
    to the previous and next entries in the list, this is an oversimplification. The
    data we''re talking about is typically a set of data such as customer information.
    Customer information could be a customer ID, customer first name, customer name,
    customer street address, customer city, customer state, customer ZIP, and so on.
    Programmers call this a record. This means that an entry in a linked list may
    contain several data elements. In our example, we''ll store only a single value
    of integer so that we can focus on the principle of how a linked list works. In
    reality, you can add as many additional attributes to each node as you need.


    Programmers choose linked lists over an array because linked lists can grow or
    shrink in size during runtime. Another entry can be placed at the end of the last
    entry on the linked list by simply assigning reference to the new entry in the
    last entry on the linked list.


    Likewise, the last entry can be removed from the linked list by simply removing
    reference to it the next element of the second-to-last entry on the linked list.
    This is more efficient than using an array and resizing at runtime.


    If you change the size of the array, the operating system tries to increase the
    array by using memory along the array. If this location is unavailable, the operating
    system finds another location large enough to hold elements of the array and new
    array elements. Elements of the array are then copied to the new location.


    If you change the size of a linked list, the operating system changes references
    to the previous item and the next item on the list, which is fewer steps than
    changing the size of an array.'
