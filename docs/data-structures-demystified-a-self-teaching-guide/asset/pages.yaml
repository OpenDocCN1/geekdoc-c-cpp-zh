  md: '# CHAPTER 3 What Is an Array?


    # More on an Array of Pointers to Pointers


    Before we show you how to use an array of pointers to pointers, let''s be sure
    that you understand how arrays, arrays of pointers, and arrays of pointers to
    pointers join forces to rearrange tons of data efficiently.


    Think of an array as the storage place for the tons of data. The last thing you
    want to do is to physically reorganize a lot of data in computer memory it is
    inefficient.

    Think of an array of pointers as the storage place for memory addresses of data
    stored in an array. This is like a notepad where you jot down addresses of data.


    Think of an array of pointers as the place where you reorganize the data contained
    in the array by indirectly rearranging memory addresses contained in the array
    of pointers. You can have any number of arrays of pointers to pointers, indirectly
    ordering the content of the array of pointers in a different order.


    Let''s say that you have a list of three names, as shown in Figure 3-10. Each
    name is assigned to elements of an array in reverse alphabetical order. You can
    reorder those names without changing their order in the array by using an array
    of pointers and an array of pointers to pointers.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_68_0.png)


    **Figure 3-10** An array of pointers to pointers reorganizes names without changing
    the order of the array that contains the names.


    In Figure 3-10, elements of the array of pointers are assigned the memory addresses
    of each element of the array. Elements of the array of pointers to pointers are
    assigned the memory addresses of elements of the array of pointers. Notice that
    these memory addresses are assigned in the reverse order that they appear in the
    array of pointers, which indirectly references the array of names in reverse order—that
    is, in alphabetical order.'
