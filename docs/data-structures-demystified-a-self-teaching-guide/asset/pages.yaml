    # What Is a Hashtable?


    Hashtable is one of those programming terms whose definition is illusive. Hash
    means "mishmash," and a table is the organization of data into columns and rows,
    but a table containing mishmash data seems useless to an application. Not necessarily!
    Programmers use a hashtable to store and retrieve large amounts of information
    efficiently. You’ll learn how this is done and how to use hashtables in your application
    in this chapter.


    # A Hashtable


    Object-oriented applications that mimic real life must store and retrieve large
    amounts of information. Previously in this book, you learned that information
    is associated with an object and stored in an instance of a class that represents
    the object within the application.'
