    into the hashtable; otherwise, a Boolean `false` is returned.


    As you recall, each key must be unique. Before the new entry is placed in the
    hashtable, the `put()` function determines if the key already exists by calling
    the `find()` member function and passing `find()` the key.


    The keys stored in the hashtable are exactly the same as the key passed into the
    `find()`. The hash determines which bucket it goes in, and then `find()` compares
