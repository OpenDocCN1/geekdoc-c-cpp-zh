    # # The Binary Numbering System


    A *numbering system* is a way to count things and perform arithmetic. For example,
    humans use the decimal numbering system, and computers use the binary numbering
    system. Both these numbering systems do exactly the same thing: they enable us
    to count things and perform arithmetic. You can add, subtract, multiply, and divide
    using the binary numbering system and you''ll arrive at the same answer as you
    used the decimal numbering system.


    However, there is a noticeable difference between the decimal and binary numbering
    systems: the decimal numbering system consists of 10 digits (0 through 9) and
    the binary numbering system consists of 2 digits (0 and 1).


    To jog your memory bit, remember back in elementary school when the teacher showed
    you how to “carry over” a value from the right column to the left column when
    adding two numbers. If you had 9 in the right column and add 1, you changed the
    9 to a 0 and placed a 1 to the left of the 0 to give you 10:


    ```

    9

    +1

    10

    ```


    The same “carry over” technique is used when adding numbers in the binary numbering
    system except you carry over when the value in the right column is 1 instead of
    9. If you have 1 in the right column and add 1, you change the 1 to a 0 and place
    a 1 to the left of the 0 to give you 10:


    ```

    1

    +1

    10

    ```


    Now the confusion begins. Both the decimal number and the binary number seem to
    have the same value, which is ten. Don''t believe everything you see. The decimal
    number represents the number 10. However, the binary number 10 isn''t the value
    10 but the value 2.'
  merge: -1
