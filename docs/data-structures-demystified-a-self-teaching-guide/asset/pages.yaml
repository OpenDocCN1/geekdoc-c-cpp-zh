    The value of Node 2 is assigned to the retVal variable, which is the value returned
    by the pop( ) member function if there is a node on a stack. This pops the value
    from the stack.


    Next, the address of the back node, which is Node 2, is assigned to a temporary
    pointer. The node temporary points to is removed from memory with the delete operator
    at the end of the pop( ) function.


    Next, if you make this determination by seeing if the previous attribute of the
    node is NULL. then the only node in the linked list. If the previous pointer on
    the back of the list is NULL, this indicates that there''s only one node in the
    linked list.


    Be careful when analyzing the pop( ) member function. Remember that the back of
    the linked list is the top of the stack and that the bottom of the stack is the
    top of the linked list.


    If the pop( ) member function is removing the only node on the stack, then the
    front and back attributes of the LinkedListClass are set to NULL, indicating that
    there are no nodes on the linked list after the pop( ) is executed.


    However, if there is at least one node on the stack, the statements within the
    else statement are executed, as in Figure 7-2. The first statement assigns the
    previous attribute of back back to the new back. In Figure 7-2, the previous attribute
    is 1. This tells you that Node 1 comes before Node 2. You assign Node 1 as the
    new back of the stack.


    Remember that isn''t a next node on the stack because you are always working with
    the back of the linked list. Therefore, you need to assign NULL to the next attribute
    of the back node, which is Node 1 at the top of the stack.


    Next to last statement removes the node from memory using the delete operator.
    The temporary pointer points to the memory address of the node that was removed
    from the stack. The last statement returns the value of the node that was removed
    from the stack.


    # If The Stack Is Empty


    The pop( ) member function must determine if the stack is empty, or it will attempt
    to remove a node that isn''t on the stack. The pop( ) member function determines
    if the stack is empty by calling the isEmpty() member function, which you must
    define part of the StackLinkedList class.


    The isEmpty() member function is a simple function, as shown next. It determines
    if the stack is empty by seeing the value of the front attribute of the LinkedList
    is NULL. If so, then a Boolean is returned; otherwise, a Boolean false is returned.
    If the stack is empty, both front and back are equal to NULL but you only need
    to check one of them.'
