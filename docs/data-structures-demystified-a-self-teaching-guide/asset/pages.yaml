  md: 'The queue is pictured as a circle. The empty boxes are where values are stored
    in the queue, and the numbers correspond to the index of the array that is associated
    with the queue. To the right of the circle are three values. The front and back
    values store the index of the front and back of the queue. The size value is the
    number of elements in the queue, which is 8 in this example.


    # Enqueue


    A value is placed in the queue by performing the enqueue process, which consists
    of two steps. The first step is to identify the array element that is at the back
    of the queue. However, this is not necessarily the last element of the array.
    Remember that the queue is not the array. The back of the queue is calculated
    using the following formula:


    ```

    back = (back+1) % size

    ```


    5-2 shows how to use the formula and gives the values for the front, back, and
    size of the queue. The front and back variables are set to zero because the queue
    is empty, and size is set to 8 because the array has 8 elements.


    The next box shows the formula that identifies back of the queue and assigns it
    the value 90. To the right of this box is the same formula with variables replaced
    by actual values. Let''s take a closer look at this and see how the back of the
    queue is calculated.


    The first operation occurs within the parameters, where 1 is added to the value
    of the back. The modulus operator determines which next element should be placed
    in the queue by performing an integer division and returning the remainder of
    the division.


    Although we''ve described a queue as a checkout line in the supermarket, a queue
    is actually circular. This is illustrated in the calculation used to determine
    the back of the queue, as shown here:


    ```

    (7 + 1) % 8

    ```


    When you get the last element in the array at index 7, the calculation returns
    0 (divided by 8 is 1 and the remainder is 0). So after the last element in the
    array, you come around to the beginning of the array as the back of the queue.
    As you''ll see in the "Queues Using an Array in C++" section of this chapter,
    you''ll check to see if you''re at the front of the queue before placing an item
    at the back of the queue so you don''t overwrite the item at the front and corrupt
    the queue.'
