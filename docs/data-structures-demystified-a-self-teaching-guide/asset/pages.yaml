    to the root node. As long as the root node isn''t NULL, the removeAllNodes() function
    calls itself each time, passing the left child node and the right child node as
    the root node. The ordering of these calls is important. Remember that the root
    node is either the root of the tree or the root of a subtree. You must remove
    all nodes before removing the parent. You recurse the left tree, recurse the right
    tree, then, when it returns to the caller, it''s safe to delete the current node
    (root node) because all the children have been deleted. With all recursive functions,
    you have to define a stopping point. In this case, if you are at a leaf node,
    the left and right pointers would be NULL and the calls to removeAllNodes() would
    return (they would not continue the recursion) because the node would be NULL.'
