    # Dequeue


    Dequeue is the process that removes a value from the front of the queue. It is
    important to understand that the value is removed from the queue, not the array.
    The value always remains assigned to the array until the value is either overwritten
    or the queue is abandoned. You’ll see how to overwrite later in this chapter.'
