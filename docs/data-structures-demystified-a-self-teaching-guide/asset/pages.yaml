  md: '# CHAPTER


    # # What Is a Linked List?


    Sports fans probably don''t realize the coach uses a linked list all the time
    during the game when switching players. In fact, the coach probably doesn''t realize
    it either. Many teams have three strings of players. For example, in football,
    there''s the starting quarterback, a backup quarterback, and a third string quarterback.
    The coach has a list of elements that point to data (current quarterback), the
    previous (starter) if the starter takes a hard hit, the coach looks at the list
    for the number of the next quarterback. When the backup quarterback can''t do
    the job, the coach looks at the list again and chooses either the previous quarterback
    (back) or the next quarterback (third string).


    As you probably surmised, the coach uses a linked list because it links quarterbacks
    to the order in which they are called to play in the game. A linked list is a
    list of elements that point to the current data (current quarterback), previous
    data (quarterback who just left the game), and the next data (quarterback who
    hasn''t entered the game). In this chapter, you''ll learn about single linked
    lists and doubly linked lists and how linked lists work. In the next chapters,
    you''ll learn common uses for linked lists.'
