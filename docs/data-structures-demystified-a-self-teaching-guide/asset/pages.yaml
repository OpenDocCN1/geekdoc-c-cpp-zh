  md: '# Data Structures Demystified


    # # A Stack


    As you''ll recall from Chapter 4, a stack is a data structure that organizes data
    similar to how you organize dishes in a stack on your kitchen counter. The newest
    dish is on top and the oldest is on the bottom of the stack.


    When accessing dishes, the last disk on the stack is the first dish removed from
    the stack. If you want the third dish, you must remove the first two dishes from
    the top of the stack so that the third dish becomes the bottom of the stack and
    you can remove it. There is no way to remove a dish from anywhere other than the
    top of the stack. You''d need to use a different kind of data structure (or stocking
    system) if you wanted to randomly access dishes.


    A stack is useful whenever you need to store and retrieve data in last, first
    order. For example, your computer processes instructions using a stack in which
    the next instruction to execute is at the top of the stack.


    # # LinkedList Class


    Although we discuss data as being stacked like a stack of dishes, it isn''t physically
    stacked at all. Instead, data is linked together sequentially in a list, where
    the last data always appears at the front of the list. Data is removed only from
    the front of the list.


    You create this sequential list by using a linked list. In Chapter 6, you learned
    that a linked list contains called nodes. A node has three subentries, data and
    two pointers. The data subentry is stored on the stack. Pointers point to the
    previous node and the next node (Figure 7-1). When you enter a new node on a linked
    list, you allocate the new node and then set the pointers to the previous and
    next nodes.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_133_0.png)


    **Figure 7-1** A node contains references to the previous node and the next node
    in the linked list and contains data that is associated with the current node.'
