    Queues Using Linked Lists


    Did you ever get ready to queue up to buy tickets for a hot concert, only to stand
    in the parking lot because there wasn''t room at the ticket counter to accommodate
    all the fans? This is a common scenario, but you may not realize that programmers
    experience a similar problem storing data using queues: there is not enough room
    on the queue for all the data (just like the problem with all the fans) that must
    be processed. Box office staff'' still wrestle with this problem, but programmers
    have arrived with a solution: they use a linked list to create a queue. In this
    chapter, you''ll learn how and when to use a linked list to queue data.


