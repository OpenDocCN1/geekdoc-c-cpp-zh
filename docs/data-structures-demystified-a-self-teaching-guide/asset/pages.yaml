  md: '# CHAPTER

    Stacks and Queues: Insert, Delete, Peek, Find


    When you began learning about programming, you probably started with a barebones
    computer and then, once you learned how to program, you probably traded up for
    a system that had all the bells and whistles. Learning how to use the LinkedList
    class works in a similar way. The LinkedList class has basic functionality that
    is useful when working with stacks and queues. However it lacks powerful features
    that are required to build industrial-strength applications. Now it is time to
    learn how to use these features and upgrade the LinkedList class. We''ll teach
    you how to do that in this chapter by introducing insert, peek, delete, and find
    functionality to the LinkedList class and showing you how to use them in your
    stack and queue applications.'
