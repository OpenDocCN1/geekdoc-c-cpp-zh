- img_proc: true
  md: '# Data Structures Demystified


    memory works. In this chapter, you''ll explore what computer memory is and why
    only zeros and ones are stored in memory. You''ll also learn what a Java data
    type is and how to select the best Java data type to reserve memory for data used
    by your program.


    # # A Tour of Memory


    Computer memory is divided into three sections: main memory, cache memory in the
    central processing unit (CPU), and persistent storage. *Main memory*; also called
    random access memory (RAM), is where instructions (programs) and data are stored.
    Main memory is volatile; that is, instructions and data contained in main memory
    are lost when the computer is powered down.


    *Cache memory* in the CPU is used to store frequently used instructions and data
    that either, is or has been used by the CPU. A segment of the CPU''s cache memory
    is called a register. A *register* is a small amount of memory within the CPU
    that is used to temporarily store instructions and data.


    A bus connects the CPU and main memory. A *bus* is a set of etched wires on the
    motherboard that is similar to a highway and transports instructions and data
    between the CPU, main memory, and other devices connected to a computer (Figure
    1-1).


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_21_0.png)


    Figure 1-1 A bus connects the CPU, main memory, persistent storage, and other
    devices.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# CHAPTER 1 Memory, Abstract Data Types, and Addresses


    Persistent storage is an external storage device such as a hard disk that stores
    instructions and data. Persistent storage is nonvolatile; that is, instructions
    and data remain even when the computer is powered down.


    Persistent storage is commonly used by the operating system as virtual memory.
    Virtual memory is a technique an operating system uses to increase the main capacity
    beyond the random access memory (RAM) inside the computer. When main memory capacity
    exceeds, the operating system temporarily copies the contents of a block of memory
    to persistent storage. If a program needs access to instructions or data contained
    in the block, the operating system switches the block stored in persistent storage
    with a block of main memory that isn''t being used.


    CPU cache memory is the type of memory that has the fastest access speed. A close
    second is main memory. Persistent storage is a third because persistent storage
    devices usually involve a mechanical process that inhibits the quick transfer
    of instructions and data.


    Throughout this book, we''ll focus on main memory because this is the type of
    memory used by data structures (although the data structures and techniques presented
    can also be applied to file systems on persistent storage).


    # Data and Memory


    Data used by your program is stored in memory and manipulated by various data
    structure techniques, depending on the nature of your program. Let''s take a look
    at main memory and how data is stored in memory before exploring how to manipulate
    data using data structures.


    Memory is a bunch of electronic switches called transistors that can be placed
    in one of two states: on or off. The state of a switch is meaningless unless you
    assign a value to each state, which you do using the binary numbering system.


    The binary numbering system consists of two digits called binary digits (bits):
    zero and one. A switch in the off state represents zero, and a switch in the on
    state represents one. This means that one transistor can represent one of two
    digits.


    Two digits do not provide with sufficient data to do anything but store the zero
    or one in memory. You can store more data in memory by grouping together switches.
    For example, two switches enable you to store two binary digits, which gives you
    four combinations, as Table 1-1, and these combinations can store numbers 0 through
    3. Digits are zero-based, meaning that the first digit in the binary numbering
    system is zero, not 1. Memory is organized into groups of eight bits called a
    byte, enabling 256 combinations of zeros and ones that can store numbers from
    0 through 255.'
  merge: -1
