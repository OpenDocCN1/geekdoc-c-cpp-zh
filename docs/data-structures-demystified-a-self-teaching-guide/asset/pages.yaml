    by referencing the hash value of the entry. The hash value is the index of the
    array element that points to the entry. You can probably see the dilemma: the
    index points only to the first entry, not the second.


    Programmers work around this problem by having the program read the key of the
    first entry. If the key isn''t the one the program seeks, the program looks at
    the next entry in the linked list. It continues down the linked list until the
    program finds the desired entry or reaches the end of the linked list.


    # # Developing a Hashtable


    Creating and using a hashtable in your application is a two-step process. The
    first step is to define a user-defined structure similar to the way you define
    nodes in a tree or a linked list. The second step is to define a Hashtable class.
    The **Hashtable** class declares an instance of the user-defined structure and
    defines member data and member functions that are used to add, remove, and manipulate
    information stored in the hashtable.'
