  md: '# Data Structures Demystified


    Objects are stored using one of a number of data structures. The choice of data
    structure depends on the nature of the application. A hashtable is a common data
    structure to store objects that have a key/value relationship.


    A hashtable is an array of pointers to data. Data takes the form of a user-defined
    structure that consists of up to three elements: the key, the value, and a pointer
    to the instance of the next structure in the hashtable. The pointer is used only
    if your collisions are handled in the manner described in this chapter; otherwise,
    it is not required.


    The key uniquely identifies the value. Each user-defined structure in the hashtable
    must have a unique key. The value is data that is associated with the key, and
    it can appear more than once in the hashtable. Think of a key as a student ID
    and the corresponding value as a student''s name. Each student is assigned a unique
    ID, but two or more students can have the same name.


    What makes a hashtable interesting is the way in which the program assigns a user-defined
    structure to an array element of the hashtable. The program hashes the key of
    user-defined structure to determine which array element is assigned the user-defined
    structure.


    A bit confused? If so, you''re not alone, because this concept isn''t intuitive.
    To clear up any confusion, look at Figure 11-1, which shows three entries in the
    hashtable. I simplified this illustration using blocks to represent each instance
    of the user-defined structure that contains the key/value of the entry. Later
    in this chapter, you''ll see the actual user-defined structure used for hashtable
    entries.


    | | key | value | Next |

    |---|---|---|--|

    | array[0] | "0987" | "tom" | NULL |

    | array[1] | "4321" | "Bob" | NULL |

    | array[2] | | | NULL |

    | array[3] | "5585" | "Mary" | NULL |


    User-defined structures


    **Figure 11-1** The hashtable is an array whose elements point to user-defined
    structures that contain data.'
