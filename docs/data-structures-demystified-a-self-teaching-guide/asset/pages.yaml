  md: '# CHAPTER 1 Memory, Abstract Data Types, and Addresses


    The digits in the binary numbering system represent the state of a switch. A computer
    performs arithmetic by using the binary numbering system to change the state of
    sets of switches.


    # Reserving Memory


    Although a unit of memory holds a byte, data used in a program can be larger than
    a byte and require 2, 4, or 8 bytes to be stored in memory. Before any data can
    be stored in memory, you must tell the computer how much space to reserve for
    data by using an abstract data type.


    An abstract data type is a keyword of a programming language that specifies the
    amount of memory needed to store data and the kind of data that will be stored
    in memory location. However, an abstract data type does not tell the computer
    how many bytes to reserve for data. The number of bytes reserved for abstract
    data type varies, depending on the programming language used to write the program
    and the type of computer to compile the program.


    Abstract data types in Java have a fixed size in order for programs to run in
    Java runtime environments. In C and C++, the size of an abstract data type is
    based on the register size of the computer used to compile the program. The short
    data type and float data types are the size of the register. A short data type
    is half the size of an int, and a long data type is double the size of an int.


    Think of an abstract data type as the term "case of tomatoes." You call the warehouse
    manager and say that you need to reserve enough shelf space to hold five cases
    of tomatoes. The warehouse manager knows how many shelves to reserve because she
    knows the size of a case of tomatoes.


    The same is true about an abstract data type. You tell the computer to reserve
    space for an integer by using the abstract data type int. The computer already
    knows how much memory to reserve to store an.


    The abstract data type tells the computer the kind of data that will be stored
    at abstract data types differently than data of other abstract data types. This
    is similar to how the warehouse manager treats a case of paper plates differently
    than a case of tomatoes.


    Table 1-2 contains a list of abstract data types. The first column contains keywords
    for each abstract data type. The second column lists the number of bits that are
    reserved in memory for a Java program. The third column shows the range of values
    that can be stored in the abstract data type. And the last column is the group
    within which the abstract data type belongs.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Data Structures Demystified


    You choose the abstract data type that best suits the data that you want stored
    in memory, then use the abstract data type in a declaration statement to declare
    a variable. A variable is a reference to the memory location that you reserved
    using the declaration statement (Chapter 2).


    You should always reserve the proper amount of memory to store data because you
    might lose data if you reserve too small space. This is like telling ten cases
    of tomatoes to the warehouse you only reserved space for five cases. If you do
    this, the other five cases will get tossed aside.


    | Data Type | Data Type Size in Bits | Range of Values | Group |

    |---|---|---|--|

    | byte | 8 | -128 to 127 | Integers |

    | short | 16 | -32,768 to 32,767 | Integers |

    | int | 32 | -2,147,483,648 to 2,147,483,647 | Integers |

    | long | 64 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 | Integers
    |

    | char | 16 (Unicode) | 65,536 (Unicode) | |\ |

    | float | | 3.4e-038 to 3.4e+038 | Floating-point |

    | double | 64 | 1.7e-308 to 1.7e+308 | Floating-point |

    | boolean | 1 | 0 or 1 | Boolean |


    Table 1-2 Simple Java Data Types


    # Abstract Data Type Groups


    You determine the amount of memory to reserve by determining the appropriate abstract
    data type group and then deciding which abstract data type within the group is
    right for the data.


    There are four data type groups:


    +   * Integer stores numbers and signed numbers. Great for storing the number
    of dollars in your wallet when you don''t need a decimal value.

    * Floating-point stores real numbers (fractional values). Perfect for storing
    bank deposits where pennies (fractions of a dollar) can quickly add up to a few
    dollars.

    * Character stores a character. Ideal for storing names of.

    * Boolean stores a true or false value. The correct choice for storing yes or
    no or true or false response to a question.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# CHAPTER 1 Memory, Abstract Data Types, and Addresses


    # Integers


    The integer abstract data type group consists of four abstract data types used
    to reserve memory to store whole numbers: byte, short, int, and long, as described
    in Table 1-2.


    Depending on the nature of the data, sometimes an integer must be stored using
    a positive or negative sign, such as a +10 or –5. Other times an integer is assumed
    to be positive so there isn''t need to use a positive sign. An integer that is
    stored with a sign is called a signed number; an integer that isn''t stored with
    a sign is called an unsigned number.


    What''s all this about signed numbers? The sign takes 1 bit of memory that could
    otherwise be used to represent a value. For example, a byte has 8 bits, of which
    can be used to store an unsigned number from 0 to 255. You can store a signed
    number in the range of –128 to +127.


    C and C++ support unsigned integers. Java does not. An unsigned integer is a value
    that is implied to be positive. All integers in Java are represented with a zero.
    Zero is stored as a positive number.


    # byte Abstract Data Type


    The byte abstract data type is the smallest abstract data type in the integer
    group and is declared by the keyword byte (see Figure 1-2). Programmers typically
    use a byte abstract data type when sending data to and receiving data from a file
    or across a network. The byte abstract data type is also commonly used when working
    with binary data that may not be compatible with other abstract data types. Choose
    a byte whenever you need to move data to and from a file or across a network.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_26_0.png)


    Figure 1-2 A byte abstract data type in Java reserves 8 bits of memory.


    # short Abstract Data Type


    The short abstract data type is ideal for programs that run on 16-bit computers.
    However, most of computers are on the trash heap and have been replaced by 32-bit
    and 64-bit computers! (See Figure 1-3). Therefore, the short is the least used
    integer abstract data type. Choose a short if you ever need to store an integer
    in a program that runs on a very old computer.'
  merge: -1
