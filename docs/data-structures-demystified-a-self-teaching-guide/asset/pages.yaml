    # # Stacks Using an Array


    The term "stack" is one of the magical and sometimes imposing terms used in computer
    programming that seems to imply an abstract concept that only a Ph.D. from MIT—whoops,
    we should say Columbia University—can understand. Yet we actually know all about
    stacks because you use a stack when playing cards, making pancakes, and storing
    laundry. A *stack* is the way you groups things together by placing one on top
    of another and then removing ones at a time from the top of the stack. It is amazing
    that something this simple is a critical component of nearly every program that
    is written. In this chapter, you''ll learn how to create and use a stack in your
    programs.


    ![](img/9d4e3b4f2864cf2e0756eefc7e2e4b3e_74_0.png)'
  merge: -1
