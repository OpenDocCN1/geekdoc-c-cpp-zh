    # MODEL FOR EVALUATING VIRTUALIZED TECHNOLOGY ADOPTION IN LIBRARIES


    Our data show that libraries are using cloud and virtualized platforms in different
    ways, but that overall the view of these technologies is positive. Whereas our
    review of literature found a wide range of issues one should consider when moving
    to an internally or externally sourced virtual solution, participants in this
    study focused on issues of vendor compliance, cost-benefit analysis, and positive
    impacts of cloud computing on efficiency and flexibility rather than on security,
    business continuity, privacy, or liability. Likewise, the high frequency of libraries
    citing a positive view of virtualization and cloud platforms but expressing hesitancy
    given current local IT infrastructure points to a real need for library and perhaps
    organizational IT departments to expand their capacity to support cloud-based
    services. Some other common barriers to cloud adoption included the presence of
    legacy systems, vendor requirements that prevent virtualization or cloud adoption,
    internal organizational issues, current investment in technology, and lack of
    expertise. Despite these inhibiting factors, primary motivations tended to be
    perceived improvement in service, interest in resource (cost, staff time) efficiency,
    and interest in new services. These factors could prove to be good measures of
    whether a cloud or virtualized platform is a good fit for a given service and
    could certainly help libraries make educated decisions about the potential advantage
    or liability of cloud choices.


    Perhaps the most difficult part of moving to any IT solution is understanding
    how to weigh the positive and negative issues surrounding a platform. Some participants
    used their qualitative response to discuss a decision process or compare issues
    in this manner. For example, one library recognized the risk of vendor lock-in
    when moving to SaaS platforms but indicated that service efficiency outweighed
    the risk. Likewise, several libraries indicated interest in migrating but were
    moving slowly to be sure that they adopted a platform only after the market had
    tested its viability. Despite some rich exploration of organizational and'
