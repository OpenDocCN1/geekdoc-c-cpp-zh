  - '[PAGE 164]


    services that were once the bread and butter of library IT departments, ILSs,
    and electronic resource management systems. Likewise, new library services such
    as large-scale discovery, resource recommendation, and resource sharing depend
    on network-based services to such an extent that they work only as an SaaS solution.


    # Build Support for the Migration


    Some of the major internal limitations of moving to cloud computing include local
    policy, staff expertise, lack of cooperation with organizational IT, lack of funding,
    and lack of satisfaction with provider terms. Many of these issues require administrative-level
    work with providers; nevertheless, understanding and addressing the limitations
    of current staff expertise through new recruitment or training can dramatically
    improve an organization’s ability to adopt cloud solutions. It is not necessarily
    easy, but building internal capacity for software programming, IT service, and
    server administration increases the number of options in IT adoption and facilitates
    management of SaaS as well as PaaS and IaaS solutions.


    Organizational resistance to cloud migration can be difficult to overcome. Marketing
    the shift as an opportunity to redefine service relations between libraries and
    organizational IT or to enable new collaborations can help resistant departments
    see how cloud adoption can benefit them. Libraries moving to the cloud are likely
    to depend on some key services from their organization’s IT, including DNS resolution,
    firewall support (for both incoming and outgoing ports as needed), and advice
    on IT issues. It makes sense for libraries to be well informed about legal and
    policy issues before heading to IT departments and to be prepared to take on the
    liability of service uptime and capacity planning in a formal document. Often,
    IT organizations are guided by a need to define and understand service boundaries.
    By recognizing these boundaries and taking appropriate responsibility, libraries
    can often be successful in renegotiating a relationship with organizational IT
    management that is beneficial for both parties.


    # Leverage Vendor-Provided Tools


    One of the key advantages of adopting cloud services is the built-in service infrastructure
    that comes with even the most basic services. For example, Amazon has a site dedicated
    to informing cloud customers about value-added applications (http://aws.amazon.com/customerapps/).
    These services include mobile AWS management tools such as iAWSManager and value-added
    services such as'
  - '[PAGE 165]


    LabSlice—a virtual computing lab (VCL) management tool designed to facilitate
    the design and deployment of VCL infrastructure on AWS. Many of the SaaS, PaaS,
    and IaaS platforms discussed in this book feature robust web-based management
    interfaces that are designed with mobile device utilization in mind. For those
    services that do not work well in a web-based mobile interface, there are often
    mobile device applications that provide access. For example, Linode services include
    an iPhone management application called Linode Manager, and Android apps that
    were not developed by Linode but leverage the Linode API suite are available.


    Choosing applications to tie into or provide advanced services on top of cloud
    providers can be difficult. Mobile management tools, alternative client-based
    access tools such as Cyberduck, and application monitoring and auditing tools
    are of high value and pose little risk to the core cloud services. As in the case
    of cloud-based digital object storage, however, it can be difficult to use some
    cloud functions without relying heavily on third-party products. Perhaps the most
    important consideration is not whether a service adds value, since most of them
    do, but rather whether there is a second pathway away from the service if there
    is some failure of the primary application. For example, though using Amazon S3
    as a file system through Cyberduck or S3-Fuse (http://sourceforge.net/projects/s3fuse/)
    serves a valuable need, adopters need some method by which they can recover their
    data if the selected service fails. In this case, there are several tools, not
    the least of which is Amazon’s own API toolkit, which can help with object recovery.


    # Stand on the Shoulders of Giants


    One of the great advantages of moving to the cloud is gaining access to enterprise-level
    IT services with very little overhead. Another important advantage is the ability
    to tap into support communities in both the cloud and library IT world. Many of
    the cloud providers discussed in this book make their tutorials available freely
    and even provide free levels of service for new adopters. In addition, there are
    companies such as Alestic (http://alestic.com) and willing experts in the library
    community (e.g., Code4Lib, LITA, and ALA Cloud Computing interest group) that
    can help answer questions, give advice, or solve specific technical problems.
    There is also an abundance of white papers, guides, tutorials, best-practice recommendations,
    and getting-started documents available to new and experienced cloud users.


    A challenge that staff new to server administration in general are likely to encounter
    is developing an understanding of how to work with the many'
  - '[PAGE 166]


    moving parts of system security, performance, application management, and IT service.
    Linode''s system documentation and Mitchell''s AWS-focused 2011 LITA preconference
    tutorials (http://erikmitchell.info/lita_2011_aws/aws_tutorials.pdf) can serve
    as initial guides through these environments. Many companies also publish a series
    of higher-level guides, video tutorials, and webinars intended to help adopters
    implement secure services. For example, Amazon''s white paper series (http://aws.amazon.com/whitepapers)
    includes operational checklists, case studies on backup and recovery, and overviews
    of security and compliance procedures. Linode also offers a wide range of useful
    tutorials (http://library.linode.com). Linode''s documentation library naturally
    focuses on managing Linode''s infrastructure, but it includes platform-agnostic
    tutorials on how to create high-availability applications, set up system security,
    and deploy application frameworks. Because Linode''s documentation often includes
    tailored tutorials for Ubuntu, Fedora, CentOS, and other flavors of Linux, it
    helps readers understand both the broad concepts of system administration and
    the specific practices associated with a given platform. For users seeking to
    take advantage of PaaS solutions, both Heroku (http://devcenter.heroku.com/) and
    Amazon (http://aws.amazon.com/articles) include platform-specific tutorials on
    deploying applications in their environment.


    # Get Started


    This book outlines several approaches to cloud computing or virtualization, focusing
    on technical, organizational, and environmental factors that influence decision
    making in this area. For those libraries seeking to implement new services, cloud
    computing can provide a way to implement those services quickly and without considerable
    overhead for organizational IT. In contrast, libraries that are looking toward
    cloud computing as a way to transform existing IT practice are best served by
    examining their current IT service environment as well as the functional needs
    of their user community and then selecting cloud solutions that will both improve
    service quality and create room for new information services.


    Library-specific systems are moving toward the cloud, and there are new opportunities
    for libraries to engage with industry-standard applications. The trend toward
    cloud computing has become mainstream in both the library and wider information
    community, and, although library adoption of cloud computing lags behind the corporate
    world, a robust range of services is available. Libraries are more frequently
    turning to SaaS than to PaaS or IaaS solutions. It should not be surprising that
    libraries are finding SaaS solutions attractive, given the benefits of'
  - "[PAGE 167]\n\neconomies of scale, potential cost savings, and improved service\
    \ offerings. Issues of expertise, local capacity, organizational policy, and desired\
    \ end-user service outcomes are also heavily influencing these choices. This trend\
    \ toward SaaS poses both opportunities for libraries and challenges to open-data\
    \ and open-source communities in the library world. In fact, as libraries turn\
    \ increasingly to cloud solutions, they are helping redefine our industry’s view\
    \ of distinctive library services and shaping the design of new information systems.\
    \ If nothing else, the shift to SaaS platforms is demonstrating that just about\
    \ every library service can be turned into a generalized commodity whose primary\
    \ purpose is to support high-quality, user-facing services. Still, issues of data\
    \ ownership, resource sharing, and interoperability pose continued challenges\
    \ for these communities as library IT vendors seek to offer more comprehensive\
    \ service frameworks that discourage multivendor adoption.\n\nIn contrast, PaaS\
    \ and IaaS solutions provide a great level of flexibility, independence, and assurance\
    \ of privacy at lower cost but at the expense of more local investment and expertise.\
    \ There are few ready-to-use library-specific applications in these environments.\
    \ This points to a real opportunity for open-source communities, consortia, and\
    \ commercial providers to expand their support for PaaS and IaaS solutions and\
    \ to help libraries make use of a wider range of cloud services.\n\n# REFERENCES\n\
    \n+   Addy, Rob. 2007. *Effective IT Service Management: To ITIL and Beyond!*\
    \ New York: Springer.\n+   \n+   Amazon. 2012. “Deploying Applications: AWS CloudFormation.”\
    \ *Amazon Web Service Documentation*. http://docs.amazonaws.com/AWSCloudFormation/latest/UserGuide/deploying.applications.html.\n\
    +   \n+   Chan, Jason. 2012. “Cloud Security @ Netflix.” *SVForum Cloud and Virtualization\
    \ SIG*, March 27, 2012. www.slideshare.net/jason_chan/cloud-security-at-netflix.\n\
    +   \n+   Chang, May. 2010. “An Agile Approach to Library IT Innovations.” *Library\
    \ Hi Tech* 28 (no. 4): 672–89. doi:10.1108/07378831011096303.\n+   \n+   Cockcroft,\
    \ Adrian. 2012. “Cloud Architecture at Netflix: How Netflix Built a Scalable Java\
    \ Oriented PaaS Running on AWS.” *SVForum*, March 27, 2012. www.slideshare.net/adrianco/netflix-in-the-cloud-at-sv-forum.\n\
    +   \n+   Cockcroft, Adrian, Cory Hicks, and Greg Orzell. 2011. “Lessons Netflix\
    \ Learned from the AWS Outage.” *Netflix Tech Blog*, April 2011. http://techblog.netflix.com/2011_04_01_archiv.html.\n\
    +   \n+   Department of Justice. 2003. Department of Justice Systems Development\
    \ Life Cycle Guidance Document. January. www.justice.gov/jmd/irm/lifecycle/table.htm."
