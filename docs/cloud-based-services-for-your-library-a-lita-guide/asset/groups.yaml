    \ services.\n\nLibrary-specific systems are moving toward the cloud, and there\
    \ are new opportunities for libraries to engage with industry-standard applications.\
    \ The trend toward cloud computing has become mainstream in both the library and\
    \ wider information community, and, although library adoption of cloud computing\
    \ lags behind the corporate world, a robust range of services is available. Libraries\
    \ are more frequently turning to SaaS than to PaaS or IaaS solutions. It should\
    \ not be surprising that libraries are finding SaaS solutions attractive, given\
    \ the benefits of\n\neconomies of scale, potential cost savings, and improved\
    \ service offerings. Issues of expertise, local capacity, organizational policy,\
    \ and desired end-user service outcomes are also heavily influencing these choices.\
    \ This trend toward SaaS poses both opportunities for libraries and challenges\
    \ to open-data and open-source communities in the library world. In fact, as libraries\
    \ turn increasingly to cloud solutions, they are helping redefine our industry’s\
    \ view of distinctive library services and shaping the design of new information\
    \ systems. If nothing else, the shift to SaaS platforms is demonstrating that\
    \ just about every library service can be turned into a generalized commodity\
    \ whose primary purpose is to support high-quality, user-facing services. Still,\
    \ issues of data ownership, resource sharing, and interoperability pose continued\
    \ challenges for these communities as library IT vendors seek to offer more comprehensive\
    \ service frameworks that discourage multivendor adoption.\n\nIn contrast, PaaS\
    \ and IaaS solutions provide a great level of flexibility, independence, and assurance\
    \ of privacy at lower cost but at the expense of more local investment and expertise.\
    \ There are few ready-to-use library-specific applications in these environments.\
    \ This points to a real opportunity for open-source communities, consortia, and\
    \ commercial providers to expand their support for PaaS and IaaS solutions and\
    \ to help libraries make use of a wider range of cloud services.\n\n## REFERENCES\n\
    \n- Addy, Rob. 2007. *Effective IT Service Management: To ITIL and Beyond!* New\
    \ York: Springer.\n- \n- Amazon. 2012. “Deploying Applications: AWS CloudFormation.”\
    \ *Amazon Web Service Documentation*. http://docs.amazonaws.com/AWSCloudFormation/latest/UserGuide/deploying.applications.html.\n\
    - \n- Chan, Jason. 2012. “Cloud Security @ Netflix.” *SVForum Cloud and Virtualization\
    \ SIG*, March 27, 2012. www.slideshare.net/jason_chan/cloud-security-at-netflix.\n\
    - \n- Chang, May. 2010. “An Agile Approach to Library IT Innovations.” *Library\
    \ Hi Tech* 28 (no. 4): 672–89. doi:10.1108/07378831011096303.\n- \n- Cockcroft,\
    \ Adrian. 2012. “Cloud Architecture at Netflix: How Netflix Built a Scalable Java\
    \ Oriented PaaS Running on AWS.” *SVForum*, March 27, 2012. www.slideshare.net/adrianco/netflix-in-the-cloud-at-sv-forum.\n\
    - \n- Cockcroft, Adrian, Cory Hicks, and Greg Orzell. 2011. “Lessons Netflix Learned\
    \ from the AWS Outage.” *Netflix Tech Blog*, April 2011. http://techblog.netflix.com/2011_04_01_archiv.html.\n\
    - \n- Department of Justice. 2003. Department of Justice Systems Development Life\
    \ Cycle Guidance Document. January. www.justice.gov/jmd/irm/lifecycle/table.htm.\n\
