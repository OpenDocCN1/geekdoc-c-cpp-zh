    Digital preservation systems require a consideration of digital object preservation
    features, network bandwidth, and long-term platform viability. In selecting both
    a platform and a provider, libraries must be aware of the balance of responsibility
    that comes with different solutions and be prepared to migrate to new systems
    in the future. In turning to cloud providers, libraries must also focus on the
    creation of an efficient and economical cloud infrastructure. In a highly outsourced
    or SaaS environment, for example, libraries may find that they cannot avoid duplicating
    resources or overbuying capacity (e.g., paying for extra disk space on multiple
    platforms or paying for support for multiple web service front-end systems). In
    the coming chapters we explore these issues and see specifically how libraries
    can both benefit from the advantages and mitigate the risks that come with cloud
    computing adoption.


