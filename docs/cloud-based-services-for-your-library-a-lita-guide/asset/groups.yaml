    # Selecting and

    Implementing Solutions


    In this chapter we look at technical, organizational, legal, and staffing/expertise
    issues in more detail and consider library-specific factors that influence adoption
    of cloud-based services. This examination is based on the responses of participants
    in the chapter 2 survey, on approaches described in the literature on cloud computing
    (e.g., Reese 2009; Rittinghouse and Ransome 2009), and on case studies of library
    adoption of cloud computing and virtualization (Fox 2009; Han 2010; Mitchell 2010).


    Our survey found variation in cloud computing adoption rates and different motivating
    and inhibiting factors with regards to organizational issues, technical/functional
    requirements, and perceived benefits. This points to the likelihood that there
    is not a “one-size-fits-all” solution for cloud computing in libraries but rather
    a need to find the best fit for each institution. Although it was difficult to
    compare the context of cloud adoption between libraries and other information
    organizations, there was a clear emphasis on privately virtualized or completely
    outsourced (e.g., SaaS) approaches in both our survey and other research reported
    in chapter 2. There were common themes mentioned that contextualized this trend,
    including lack of IT support or local expertise and concerns over the ability
    to sustain complex IT systems. These concerns are significant given the fact that
    as libraries are adopting new information services they are often faced with choices
    that require distinguishing between cloud, virtualized, and traditional IT approaches.
    Breedings (2011) work in particular has focused on this issue in regards to the
    ILS. He found not only a continued shift toward cloud solutions using'
