    ## PLATFORM-AGNOSTIC APPROACHES TO CLOUD SERVICES


    The idea of mixing and matching cloud service providers to find an optimal mix
    of cost, control, and service quality may not seem particularly groundbreaking.
    In practice, though, finding the right mix of service outsourcing, local management,
    and platform-specific migration can be difficult. In this section we explore some
    areas in which moving to SaaS or specific IaaS platforms can affect service quality
    and costs positively. Such approaches are not likely to solve all problems posed
    in the previous sections, but they may be right for organizations seeking a balance
    between wholly outsourced and internally managed cloud services. As a framework
    for this discussion, we should remind ourselves of the NIST reference model with
    its range of service roles associated with cloud platforms, including auditor,
    broker, provider, and consumer (see figure 1.1). In addition, this architecture
    explores elements that contribute to a well-run cloud service, including service
    provisioning and management and service monitoring.


    Though it is important to understand each of these roles and to be able to identify
    service providers that fill them, it is also important to consider what combination
    of service providers and functions best fits a particular library''s cloud service
    needs. For example, as important as it is to have monitoring, replication, and
    auditing services, small cloud deployments may be able to utilize a single provider
    that meets these needs whereas larger deployments may need to seek out providers
    with more complex capabilities. Here again, the adage “The perfect is the enemy
    of the good” can be worth considering when bringing together cloud systems to
    support your information services. In general, a cloud service needs approaches
    to service provision (e.g., resource allocation and integration), service monitoring/auditing
    (e.g., service uptime, system security/privacy, service cost), and service management
    (e.g., staff access, service create/start/stop/terminate, service aggregation)
    that are easy to use and sustainable.


    ## Hybrid IaaS Provider Examples


    Many of the previously reviewed providers including Amazon, Linode, Google Apps,
    and Heroku offer monitoring, auditing, and cost management services, and it is
    possible that these services will work well in a limited cloud architecture. There
    are other services, however, that support cross-platform provisioning, monitoring,
    and auditing services. This section explores cloud services that can provide libraries
    with alternative or hybrid approaches to creating a robust cloud-based infrastructure.
    Three classes of service are of particular interest: multiplatform IaaS solutions,
    SaaS solutions for effective IT service management, and a mix of cloud resources
    for point-of-need services.


