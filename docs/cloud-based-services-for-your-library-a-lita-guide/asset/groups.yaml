    ## 图书馆虚拟化技术采纳评估模型


    我们的数据显示，图书馆以不同的方式使用云和虚拟化平台，但总体上对这些技术的看法是积极的。虽然我们对文献的回顾发现了在转向内部或外部提供的虚拟解决方案时应考虑的广泛问题，但本研究中的参与者更关注供应商合规性、成本效益分析和云计算对效率和灵活性的积极影响，而非安全、业务连续性、隐私或责任问题。同样，图书馆高度频繁地表示对虚拟化和云平台持积极看法，但由于当前本地
    IT 基础设施而表示犹豫，这表明图书馆乃至组织 IT 部门需要真正扩大其支持基于云服务的容量。云采纳的其他常见障碍包括遗留系统的存在、阻止虚拟化或云采纳的供应商要求、内部组织问题、当前技术投资以及缺乏专业知识。尽管存在这些制约因素，主要动机往往是
    perceived 服务改善、对资源（成本、员工时间）效率的兴趣以及对新服务的兴趣。这些因素可能成为衡量云或虚拟化平台是否适合特定服务的良好指标，也能帮助图书馆就云选择的潜在优势或风险做出明智决策。


    也许转向任何 IT 解决方案最困难的部分是理解如何权衡平台周围的正面和负面问题。一些参与者利用其定性回应来讨论决策过程或以这种方式比较问题。例如，一个图书馆认识到转向
    SaaS 平台时存在供应商锁定风险，但表示服务效率超过了风险。同样，多个图书馆表示有迁移兴趣，但正在缓慢推进，以确保仅在市场验证其可行性后才采纳平台。尽管对组织和环境问题进行了一些丰富探索，但对网络化数据、开放数据或开源软件在
    IT 决策中的作用讨论甚少。同样，安全和隐私问题，尽管在文献中常被视为关键关注点（Grant 2011, 47; Velte et al. 2009, 35），但并未以与技术和组织问题相同的具体程度进行讨论。这种侧重点可能确实是由于研究对象或问题的风格所致，但它提出了一个关于专业人士对虚拟化和云计算环境中法律、政策和安全问题的看法的好问题。


    尽管本研究的主要目标是帮助确定一个图书馆可用于评估自身云采纳水平并考虑影响其 IT 决策的因素的模型，但值得将我们的结果与其他云计算采纳研究进行比较。例如，Aberdeen
    Group 于 2011 年进行的一项研究发现，在云采纳者中，68% 已转向私有云和内部虚拟化服务，50% 已转向 SaaS 解决方案（Brink 2011,
