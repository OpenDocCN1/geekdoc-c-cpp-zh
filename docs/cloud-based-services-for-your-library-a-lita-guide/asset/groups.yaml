    使用内部加密来保护服务器上的数据，并使用虚拟专用网络（VPN）在IT基础设施周围创建额外的安全层级。内部IT安全政策应包括可接受的使用、监控、隐私远程访问、网络连接和日志保留政策（Limoncelli等人，2001年，第124页）。此外，实施外部虚拟化或基于云服务的组织应获取或定义策略，以确保数据完整性、保留云中资源的本地所有权，并确保整个云平台的完整性。尽管在公共或社区云环境中运行存在风险，但云虚拟化系统旨在确保虚拟机的隔离。供应商保证有助于减轻对公共或社区云平台的感知风险，并且是制定本地安全策略的良好基础。例如，亚马逊已获得认证和认可，证明其提供安全云服务的能力（http://aws.amazon.com/security/#certifications）。以这些认证作为评估基础设施安全性的基准，可以帮助组织识别合适的云候选方案。此外，深入了解这些安全策略的细节可以帮助组织将工作重点放在其他易受攻击的领域。本章的法律和政策部分将更详细地讨论提供商级别的安全和保证。


    云计算平台可能带来的一个复杂性是，需要在每个采用的平台或供应商中复制安全措施。因此，对于已采取的措施及其实施方式（例如，用户账户的创建、管理和审计方式）制定明确且一致的政策，有助于简化新计算环境的采用。这不一定意味着安全责任的集中化，而是整个组织需要充分了解云环境中所需的实际风险和管理实践。例如，在SaaS环境中，将这些任务委托给中级管理用户而不是通过IT部门处理可能是合理的。相比之下，在IaaS环境中正确管理用户账户所需的访问权限和专业知识水平可能意味着这些任务需要由熟悉流程和相关风险的人员来管理。然而，在这两种情况下，创建分层安全策略有助于将访问权限扩展到适当的级别，同时防止妥协。例如，在Amazon
    EC2环境中，安全组用作云环境级别的防火墙，允许将服务器分组到访问组中。这种安全级别是在服务器级防火墙选项之外提供的，并允许采用分布式安全管理策略，在这种策略中，中级管理员对服务器资源拥有更高级别的访问权限，因为他们不太可能从组织虚拟服务器基础设施的外部使系统易受攻击。


    NIST云计算模型强调了确保云安全所需执行的几项重要任务。这些包括上面提到的要素（例如，管理访问、通过防火墙减轻常见IT使用相关的风险、检测入侵），以及设计利用云功能来增强而不是削弱安全性的应用程序。还有客户端要素，如Web浏览器安全性和客户端/服务器安全证书的使用，如果实施得当，可以确保更高级别的客户端/服务器安全性（Fang等人，2011年，第39页）。最后一个关键领域，尤其是在集成IaaS和PaaS环境时，是身份验证密钥和账户的共享。特别是RightScale，依赖于通过与IaaS云平台使用管理账户和访问密钥建立可信关系。值得注意的是，一旦建立了这些信任关系，RightScale服务中的用户就能够在非常细粒度的级别上控制那些其他环境中运行的服务。同样，许多Amazon应用程序编程接口（API）服务依赖于预共享密钥。如果这些密钥保存在客户端机器上，则该机器的任何用户都可以直接访问Amazon
    IaaS元素。云提供商开始提供使用身份管理工具对资源访问进行分区管理的方法，这些工具允许系统管理员监控哪些用户访问基础设施级资源，并根据登录或密钥凭据限制访问。


    ## 图书馆特定IT支持


    确定实施和管理云资源的本地能力，基于对人员技能、时间可用性、技术需求和财务资源的理解。这些因素需要与预计的服务成本和影响进行比较，以了解特定服务或云平台的重要性。正如我们对基础设施、应用程序和平台管理的探索所示，技术技能和能力在选择、实施和管理服务方面发挥着重要作用。同样，取决于所选的云服务，该特定系统的容量可能存在上限。正如我们在第5章对IaaS提供商的探索所示，在这些平台上实现可扩展服务的方法和成本差异很大。例如，Netflix将Amazon
    EBS平台中的延迟视为容量限制因素，因此重新设计了其Web服务以利用Amazon S3（Cockcroft等人，2011年）。尽管该示例强调了IaaS提供商根据需求进行扩展的能力，但它回避了本地专业知识、物理基础设施或灾难管理的局限性，这些局限性可能使利用这些功能变得困难。因此，熟悉IT服务管理、安全性和本地能力的要素非常重要，以便确定本地和基于云的能力并选择合适的系统。


    图书馆转向云系统的一个常见原因是需要比本地可用的更强大的IT支持。在某些情况下，需求集中在特定平台上；在其他情况下，需求集中在本地IT部门无法提供的数据问题或可扩展性要求上。然而，在选择迁移到云解决方案时，图书馆需要了解必须由本地IT提供的IT服务。图书馆所需服务支持的一些示例包括网络基础设施和互联网接入、域名服务（DNS）解析、组织身份验证、组织用户或读者数据，以及防火墙或VPN服务。特别是，能够与组织IT合作为外部服务器定义新的DNS条目、开放防火墙规则以允许内部服务器和基于云的服务器之间更轻松地通信，以及使用VPN作为限制服务器访问的手段，这三个关键服务有助于迁移到云平台。这些服务既在组织IT与图书馆之间建立了可信关系，也展示了图书馆IT所请求的支持范围的界限。一份明确概述所支持的服务类型和责任范围的服务水平协议（SLA），对于重新定义图书馆与组织IT部门的关系以及解决最初看似无法克服的担忧大有帮助。


    ## 组织因素


    尽管本地IT资源或技术专长可能会影响图书馆考虑哪些云解决方案，但组织因素（包括风险承受能力、财务和预算环境、可用的人员资源，以及云解决方案与整体服务目标的契合度）可能同样重要。越来越多的图书馆能够找到适合其特殊需求和组织文化的云解决方案（尤其是SaaS）。这些不仅包括基于SaaS的供应商服务

