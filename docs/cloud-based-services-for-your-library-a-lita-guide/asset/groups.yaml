    **弹性：** 弹性指 IT 服务根据需求进行伸缩的能力。对于 PaaS 和 SaaS 服务都应该评估弹性，以确保所选平台对于组织的规模来说既大小合适又具有可扩展性。


    **环境：** 环境通常在容器语境中讨论，它定义了 PaaS 服务中的服务所运行的软件栈。环境通常由其脚本/编程平台（如 PHP、Java、Ruby）和 Web
    服务器平台（如 Apache、Nginx、Tomcat）来定义。


    **事件：** SaaS、PaaS 和 IaaS 服务应提供某种形式的事件日志作为服务的一部分。这通常是所执行操作及系统对这些操作响应的日志。


    **插件/附加组件：** SaaS 和 PaaS 环境在可插拔应用架构中提供增值服务作为资源或附加组件。插件设计为通过最小配置添加到服务中，可能包括数据库、消息传递或日志服务。


    **仓库：** 在 PaaS 环境中，此术语通常指已开发代码的软件源代码仓库。本书探讨的 PaaS 解决方案中最流行的分发仓库是 Git，它在名为 GitHub
    的托管服务上实现。


    **版本控制：** PaaS 平台通常依赖版本控制，以确保能够轻松控制分发。PaaS 提供商通常支持通过插件向流行的版本控制平台分发软件服务。


    ## SaaS 图书馆解决方案


    对于希望规避与 IT 服务相关的风险、专业知识和维护问题的图书馆来说，SaaS 解决方案往往很有吸引力；而且由于集中管理数据集（如链接解析器知识库和书目数据库）的使用，它们也越来越受欢迎。图书馆正在转向云平台来提供数据密集型和新服务，如链接解析器、数字参考服务、研究指南和大规模发现系统，而对在线目录、网站和数字资产管理系统等复杂系统的采用则较慢；总体趋势是采用
    SaaS 解决方案。尽管 SaaS 解决方案显然提供了诸多好处——例如企业级 IT、快速实施以及对图书馆 IT 人员影响最小——但它们可能更昂贵，定制化程度有限（与
    PaaS 和 IaaS 解决方案相比），并且具有其他云服务平台所没有的长期承诺。下面讨论的特定于图书馆的 SaaS 解决方案反映了这些特点，这些特点与 PaaS
    和 IaaS 解决方案的示例明显不同；因此，这里的案例研究按系统类型而非供应商平台进行分组。


    ## SaaS 供应商示例


    与本章中的其他云解决方案相比，SaaS 解决方案更侧重于图书馆特定的应用程序。虽然也存在非图书馆特定的服务，如托管内容管理系统（例如 wordpress.com）和客户关系系统（例如
    Salesforce.com），但这些系统并未像图书馆特定的 SaaS 服务那样被广泛采用。这里讨论的许多服务更符合“托管”和“外包”的广义定义；将其纳入此处反映了这样一种理念：它们是在无需任何基础设施、平台或应用级管理要求的情况下提供的。总的来说，SaaS
    与 PaaS 的区别在于它更符合系统开发的“交钥匙”方法。


    可以从 Breeding 的图书馆自动化网站调查（www.librarytechnology.org）中得出一个良好的图书馆系统类型和供应商分类。Breeding
    将系统分为十一种类型：图书馆服务平台、发现产品与服务、联合检索、移动产品、数字图书馆管理系统、电子资源管理支持、机构知识库、OpenURL 链接应用、资源共享系统、RFID
    系统和档案管理系统。除此之外，图书馆还倾向于使用知识库、数字参考服务工具、内容管理系统，当然还有订阅大量在 SaaS 环境中交付的聚合信息资源。本综述从三个大类审视系统：下一代基于云的
    ILS、DAMS 和面向公众的服务。


    ## 下一代基于云的 ILS


    越来越常见的是，ILS 供应商将云计算宣传为其 ILS 的关键方面。这可能包括完全基于云的解决方案，或仅仅是虚拟化托管或知识库同步。到目前为止，最常见的云功能是由供应商和
    ILS 托管公司为传统 ILS 目录提供 SaaS 托管。ILS 系统的托管可以采用 PaaS 或 SaaS 模式，具体取决于提供商和客户之间的管理任务分工。这些系统通常作为专用机器或在仅服务提供商和客户可访问的虚拟化服务器上实现。除了商业
    ILS 供应商外，还有基于云的开源 ILS 系统支持服务，包括 Evergreen（http://open-ils.org）和 Koha（http://koha.org）。也有一些联盟利用开源
    ILS 平台作为在全州范围内进行托管的机会。值得注意的是佐治亚州的 Pines 系统（http://gapines.org）和一个印第安纳州图书馆联盟（www.in.gov/library/evergreen.htm），后者正在虚拟化平台上使用
    Evergreen。


    传统 ILS 平台的 SaaS 托管不同于新的综合资源管理平台（CRMP）。这些资源管理系统更接近基于 Web 服务的 SaaS 环境。它们通常具有共享书目数据库，强调系统和数据集之间的互操作性，并通过图形化
    Web 服务提供对公共和工作人员工具的访问。该市场的主要供应商包括 OCLC（WorldShare Management Services，www.oclc.org/webscale/）、Ex-Libris（Alma，www.exlibrisgroup.com/category/AlmaOverview）和
    SerialsSolutions（Intota，www.serialssolutions.com/en/services/intota）。OCLC 进军 ILS
    和 CRMP 平台源于其长期以来为图书馆提供基于网络服务的悠久历史。它在 2010 年推出基于云的 ILS，标志着从提供 MARC 记录管理和规范控制服务等基础服务向提供全面的图书馆级服务的转变。该服务的最新示例包括
    Pepperdine（Bryant 和 Ye 2012）和特拉华大学（OCLC 2012）的系统。


    正如信息行业在数据托管和所有权中发现了巨大价值一样，图书馆自动化供应商不仅发现图书馆愿意为管理的、基于云的知识库付费，而且发现这个知识库可以被重新用于各种用途。OCLC
    的产品不仅利用了其在过去四十年中构建的现有书目和馆藏数据库，还利用社区创建的程序和外部订阅的数据集，将传统 ILS 的功能与电子资源带来的新管理需求结合在一起。其结果是仅作为云应用运行的新一代系统。


    ## 数字档案管理系统


    正如我们对 PaaS 和 IaaS 服务的探索所显示的，从完全传统的 IT 实践转向“Web 规模”意味着模糊个人和社区数据库与数据集之间的界限，重新设计服务以优化
    Web 界面，并拥抱社区共享的内容。


    基于云的数字档案管理系统（DAMS）包括诸如 ContentDM（www.oclc.org/contentdm/）、托管式开源归档服务如 DuraCloud（http://duracloud.org）、来自
    Open Repository 的 DSpace 托管（www.openrepository.com）以及数字出版工具如 Omeka（http://omeka.net）等产品。与
    ILS 系统一样，商业产品可提供为托管服务，但不一定设计为 SaaS 平台。对这些系统的 SaaS 云支持尚未达到 ILS、CRMS 等系统的成熟度，这可能是由于
    DAMS 平台的复杂性和快速演进。同时，DAMS 因其相对复杂性也给图书馆带来了挑战。在 DAMS 开源市场中，开发社区使用基于客户端的虚拟机发布测试平台的做法已变得越来越普遍。这些机器镜像通常并非为生产安装而设计，因为它们硬编码了密码，并将数据库、管理和公共服务功能集成到单个虚拟机中。然而，它们正日益成为开源项目与潜在采用者建立联系的一种流行方式。包括
    Islandora（http://islandora.ca）、Archivematica（http://archivematica.org）和 DAITSS
    数字保存仓库软件（http://daitss.fcla.edu）在内的系统都可以直接下载，并能轻松导入虚拟机环境。


    随着数字保存服务的使用不断演变，用于存储、比特检查和其他保存服务的 SaaS 选项已被开发出来，以帮助图书馆管理数字对象。例如，DuraCloud（http://duracloud.net）基于
    DSpace 和 Fedora 平台，为图书馆提供云代理、数据保存、数据复制和在线共享服务。DSpace 和 Fedora 都具有便于与 DuraCloud
    集成的内置服务。


    鉴于 DuraCloud 专注于保存服务，其他平台如 Omeka 和 Viewshare（http://viewshare.org) 则提供了一个易于使用的托管数字出版平台。Omeka
    既可作为可下载的开源应用程序，也可作为托管的 SaaS 云解决方案提供，其功能包括存储、多个发布站点、预设计的功能插件（例如，地理定位、社交书签、


