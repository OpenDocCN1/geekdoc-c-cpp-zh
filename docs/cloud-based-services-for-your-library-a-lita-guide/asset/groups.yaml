    a dedicated PaaS environment needs to include an application platform, a persistent
    digital object storage platform, and a database platform. In a sufficiently distributed
    architecture, each of these systems should persist without depending on the other.
    This enables the application to be upgraded, scaled, and redeployed without affecting
    valuable data and digital objects. One benefit of PaaS application environments
