    2009；Rittinghouse 和 Ransome 2009），以及图书馆采用云计算和虚拟化的案例研究（Fox 2009；Han 2010；Mitchell
    2010）。


    我们的调查发现云计算采用率存在差异，并且在组织问题、技术/功能要求和感知收益方面存在不同的推动和制约因素。这表明图书馆的云计算可能没有“一刀切”的解决方案，而需要为每个机构找到最佳契合。虽然很难比较图书馆与其他信息组织之间云计算采用的背景，但在我们的调查和其他第
    2 章报告的研究中，都明显强调了私有虚拟化或完全外包（例如 SaaS）方法。提到的共同主题将这一趋势置于背景中，包括缺乏 IT 支持或本地专业知识，以及对维持复杂
    IT 系统能力的担忧。鉴于图书馆在采用新信息服务时往往面临需要区分云、虚拟化和传统 IT 方法的选择，这些担忧是重大的。Breeding（2011）的研究特别关注了
    ILS 方面的这一问题。他发现不仅继续向使用 SaaS 和 PaaS 平台的云解决方案转变，而且这些系统的结构也在重新构想，包括对书目和其他数据管理的改变方法，以及对数据和服务互操作性的关注。在评估这些系统时，图书馆必须了解其决策的
    IT 服务和功能影响。此外，随着图书馆采用或迁移到基于云的平台，需要考虑新的问题，如服务质量和服务水平协议（SLAs），以及对传统问题的新的看法，如供应商锁定和系统功能。


    ## Chapter Three


    本书的一个目标是为图书管理员提供评估和比较云、虚拟化和非虚拟化 IT 环境所需的工具。通过对可用的虚拟化和云计算类型以及这些平台附带的所需支持服务有深入的了解，图书管理员能够做出更明智的系统选择。本章重点关注与技术采用相关的问题，而非系统功能，但后者也是一个非常现实的担忧。在权衡系统之间的技术差异和组织/环境因素时，考虑组织单位、IT
    系统、IT 服务和终端用户信息需求之间的关系也很有价值。例如，在 IT 服务环境中，对容量（技术和组织）、风险管理和服务或终端用户目标之间的关系有相当大的关注（Addy
    2007, 45）。图书馆不应假设他们对这些要素的看法，甚至其定义，与组织 IT 中的对应者完全相同。Schaffhauser（2010）观察到，图书馆使用不同于
    IT 部门的衡量标准来定义服务并评估价值、影响和风险，并区分了图书馆和 IT 对“终端用户”的观点。这种差异会对图书馆 IT 产生连锁效应，并可能成为图书馆中心和组织范围
    IT 部门之间不和的原因。虽然转向云或虚拟化平台可能被视为弥合这些差异的一种方式，但它也可能导致更复杂和相互依存的关系。


    弥合这一差距的一种方法是让图书馆选择与 IT 部门有共同点的服务评估模型，同时也为这些差异留出空间。尽管它们可能从 IT 为中心的世界观开始，但 IT 服务模型在这一领域很有用，因为它们包括区分内部和外部客户的方法，并包含对容量和风险的考虑，同时保持对用户服务期望的关注。一个为这些讨论提供共同词汇的模型是
