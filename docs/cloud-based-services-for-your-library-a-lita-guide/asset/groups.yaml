    # Infrastructure Administration


    The administration of infrastructure-level services focuses on core elements including
    network, server, and operating systems. Infrastructure-level administration often
    comes with beginning-to-end responsibility for an information service and requires
    the ability to design and deploy a hardware (both virtualized or physical) infrastructure,
    install and configure software, secure and maintain distinct IT components (e.g.,
    server, network, security), and manage change in service configuration and deployment.
    This requires a familiarity with security measures (e.g., firewalls, user access,
    and system updates) and IT service management (e.g., service configuration, deployment,
    backup, failover, and depreciation) and a granular understanding of the implications
    of system design on the information service. In a cloud environment this also
    means a wider familiarity with cloud service elements that constitute an IaaS
    environment (e.g., server images, volume snapshots, security groups). The NIST
    reference model expands on infrastructure-level skill requirements with ten technical
    factors to be considered in relation to cloud computing adoption (Fang et al.
    2011):


    +   1. Creating, accessing, updating, and deleting data objects in clouds

    +   2. Moving virtual machines and virtual appliances between clouds

