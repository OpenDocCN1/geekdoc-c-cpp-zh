    # Public-Facing Services


    Libraries are increasingly turning to SaaS options for public-facing discovery,
    reference, and fulfillment services. Discovery platforms such as SerialsSolutions
    Summon, WorldCat Local (www.oclc.org/worldcatlocal/), and EBSCO Discovery Service
    (www.ebscohost.com/discovery) offer an integrated search platform that includes
    cloud-indexed print and electronic (licensed) resources. Although libraries have
    yet to abandon traditional catalogs entirely, the relative popularity of these
    new systems poses real challenges to locally managed discovery systems including
    the OPAC.


    In addition to discovery services, libraries are turning to virtualized reference
    services such as OCLC’s QuestionPoint (http://questionpoint.org) or SpringShare’s
    LibAnswers (http://springshare.com/libanswers/) or to statewide services such
    as OhioLINK’s KnowItNow service (http://knowitnow.org). Libraries are also turning
    to self-service information portals such as LibGuides (http://libguides.com) and
    are leveraging consumer-grade multimedia services such as YouTube and Vimeo to
    integrate streaming video into online information resources. By deconstructing
    a complex information service into SaaS-based discrete components, librarians
    are able to create complex information services with little overhead. Companies
    including SpringShare are working to provide a diverse set of web services that
    fit this approach and could easily fill in the gaps left from enterprise DAMS
    and ILS. The most common form this approach takes is video-based instruction or
    tutorials. For example, Loo (2010) created and published a series of video tutorials
    on doing research using PubChem. The video series was recorded using simple client-based
    screen casting, is hosted on YouTube, and is tightly integrated into multiple
    web services on an as-needed basis.


    As our review of SaaS solutions illustrates, it is realistic for libraries to
    assemble an entire IT suite using SaaS components. Each of the services represented
    in figure 4.1 has multiple robust SaaS cloud options, though options may be limited.
    It is worth noting that, although there are library-specific commercial providers
