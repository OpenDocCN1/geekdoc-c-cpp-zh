    图 4.7

    Windows Azure（Used with permission from Microsoft）


    因此，云开发人员可以使用该平台为其他订阅者提供服务。这与 Salesforce 和 Amazon 等其他公司的做法类似，它们支持商业云服务部署。


    ## Issues


    正如对 PaaS 提供商的审查所示，所支持的服务、平台和管理工具的范围各不相同，因此依赖现成软件的图书馆可能很难利用这些工具。然而，专用的 PaaS 平台为寻求创建和测试新应用程序的开发人员提供了相当大的能力，并且未来可能会被图书馆系统供应商和开源开发社区更广泛地采用。除了缺乏对现成图书馆软件的支持外，这些类型的
    PaaS 系统还需要对 SSL 配置、DNS 名称映射、系统备份以及应用程序配置和部署采用新方法。所需的技术通常意味着解决方案比使用传统基于服务器的 IT
    方法时更持久，但学习和整合这些技术可能很困难，特别是因为 IT 部门传统上依赖更接近 IaaS 环境的基于服务器的模型。出于这些原因，除非图书馆能够投入必要的时间来修改和管理应用程序使其在此环境中工作，否则他们可能无法使用这种类型的
    PaaS 平台。尽管目前存在采用问题，但专用的 PaaS 解决方案提供了规模经济、低成本或免费使用级别，以及一种耐用性水平，而在不投入大量专业知识和时间和资源的情况下，使用其他方法很难实现。


    ## Expertise Required


    除了管理 PaaS 应用程序所需的服务器类型管理专业知识外，专用的 PaaS 解决方案还需要对所实施系统的专业知识、熟悉版本管理解决方案以及了解如何在非服务器环境中实现和管理数据库结构。例如，Heroku
    允许使用几种不同的数据库平台，每个平台都有其自身的优点和缺点。能够在数据库和软件平台之间进行区分以及通过命令行工具管理和部署应用程序，可以使开始使用专用 PaaS
    系统比使用基于服务器的 PaaS 或 IaaS 解决方案更困难。正如许多审查的服务所指出的那样，这些系统面向需要其应用程序的生产级支持但没有时间和资源来管理所需基础设施的软件开发人员。


    ## Service Complexity, Sustainability, and Durability


    PaaS 解决方案往往比传统 IT 系统更复杂。通常需要更多的依赖项，并且每个平台对应用程序的部署、配置和管理采用独特的方法。至少，专用的 PaaS 环境需要包括应用程序平台、持久数字对象存储平台和数据库平台。在足够分布式的架构中，每个系统都应独立于其他系统而持久存在。这使得应用程序可以在不影响有价值的数据和数字对象的情况下进行升级、扩展和重新部署。PaaS
    应用程序环境的一个好处是它们往往包含内置的监控、复制和扩展功能。尽管这些功能的默认级别可能足以满足大多数图书馆的需求，但了解如何扩展这些服务或重新配置它们以支持在多个
    PaaS 平台上部署应用程序对于大规模应用程序是必要的。此外，对于寻求利用多个 PaaS 提供商使应用程序更持久的图书馆，必须采用外部 DNS 系统以便轻松从一个服务提供商切换到另一个服务提供商。


    尽管图书馆在使用专用 PaaS 平台时必须考虑多个问题，但这些系统的关键优势在于它们内置的能力，可在服务中断期间进行扩展和持久化。例如，Amazon 的 Elastic
    Beanstalk 包括自动扩展以处理增加的流量的能力，并具有多区域冗余功能，以确保即使云基础设施的部分发生故障，应用程序仍保持运行。同样，Heroku 提供自动复制和可扩展性，使测试和部署系统更新变得更容易。最后，PaaS
    环境通过使用共享云服务获得快速配置速度和灵活性。例如，Zend PaaS（http://zend.com）框架与 RightScale 紧密集成，以启动和管理部署多个客户的基础设施级服务。这使得关于系统耐用性和长期可持续性的选择变得更加复杂，并且取决于诸如本地专业知识、对提供商锁定容忍度以及在多个云提供商上实施服务的能力等因素。


    ## Service Cost


    而 PaaS 服务器解决方案提供某种形式的持续订阅成本，专用的 PaaS 解决方案寻求通过允许订阅者仅在任何给定时间使用所需的服务，使这些服务更实惠和可定制。此外，许多产品，如
    Heroku、RedHat OpenShift Express 和 Google Apps Engine 提供免费服务级别，可能吸引中小型图书馆。专用的 PaaS
    提供商倾向于根据附加组件和使用的 IT 资源收费。由于每个提供商使用不同的衡量标准，因此很难比较各提供商之间的成本。例如，Heroku 使用称为“dynos”的前端和后端进程衡量标准，这将很难与
    Amazon 的 Elastic Beanstalk 实例进行比较。相比之下，Google 采用多方面的计费模式，包括 CPU 时间、带宽和数据存储元素。尽管有一些研究比较了云服务的总拥有成本，但这种形式的
    PaaS 环境引入了新元素，需要更深入的探索。


    ## Service Portability and Interoperability


    专用 PaaS 解决方案的复杂定制要求意味着它们可能难以迁移到新提供商。某些平台，如 Heroku 和 Amazon 的 Elastic Beanstalk
    允许应用程序包部署在其他平台上。相比之下，使用定制技术堆栈的平台，如 Google App Engine，如果没有额外的应用程序开发，迁移到另一个平台将很困难甚至不可能。


    ## CONCLUSION


    本章探讨了在探索云计算和虚拟化时需要考虑的两种广泛平台类型。对 SaaS 提供商的审查主要集中在图书馆特定解决方案上，但也突出了更广泛信息用途的 SaaS
    服务。WordPress 和 Salesforce 等提供商可能非常适合图书馆，但应在其整体 IT 框架内考虑。事实上，如果图书馆寻求使用 SaaS 解决方案来取代其所有信息服务基础设施，这些选项应被视为在图书馆特定和通用基于
    Web 的信息服务之间架起桥梁的方式。至少，图书馆转向 SaaS 解决方案时需要考虑如何计划监控这些服务、管理联系和访问信息以及为迁移离开 SaaS 提供商做准备。


    本章还探讨了两种形式的 PaaS 解决方案——基于服务器和基于应用程序。两种解决方案都是本地开发的优秀选择


