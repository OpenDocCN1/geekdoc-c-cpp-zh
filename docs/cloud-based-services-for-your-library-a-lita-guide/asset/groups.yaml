    # TECHNICAL FACTORS


    Of all issues to consider when exploring cloud-based and virtualized services,
    technical issues are likely to take center stage. Understanding the technical
    work required when a library takes on virtualized and cloud computing is an important
    first step that can help guide decisions about capacity and long-term sustainability.'
