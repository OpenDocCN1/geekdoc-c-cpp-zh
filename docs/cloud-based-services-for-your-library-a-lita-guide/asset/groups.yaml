    第二个关键的财务考虑因素是，图书馆当前的软件许可和平台是否支持迁移到云端。软件许可在服务器操作系统和更高级别的应用程序中都很重要。在某些情况下，特别是专有或托管操作系统（http://aws.amazon.com/windows/;
    http://aws.amazon.com/rhel/），云计算需要新的许可。在其他情况下，特定服务以SaaS模式（http://salesforce.com）获得许可。在极端情况下，如果许可条款严格绑定到传统IT范式（例如，按CPU、按用户或许可证服务器模式），则可能无法在云环境中实施软件。尽管更高级别的图书馆应用程序许可可能不会受到云计算环境实施的影响，但进行检查仍然很重要，尤其是在可能选择可创建额外软件运行时副本的扩展基础设施时。


    值得注意的是，尽管向云计算转变给图书馆采用开源带来了问题，但鉴于缺乏许可问题，开源软件也简化了在云平台上实施IT的过程。完全有可能创建完全基于开源平台（包括操作系统、Web发布系统以及一系列图书馆特定应用程序）的云基础设施。在IaaS和PaaS环境中可以仅使用开源解决方案，但使用SaaS解决方案则不太可能。此外，当图书馆将操作系统和核心基础设施元素（例如系统备份和Web服务器）转向开源时，它们可能还需要承担额外的系统管理责任。这种情况下最重要的领域之一是必须选择具有定期安全和功能更新的开源组件。亚马逊通过在其服务器模板中提供经过认证的Linux版本（http://aws.amazon.com/amazon-linux-ami/）来努力使这一过程更具可持续性。Ubuntu和CentOS等其他社区也提供定期更新。此外，Red
    Hat（http://redhat.com）等开源平台为基于Linux的操作系统提供付费支持级别。


    ## 确定实际成本与投资回报率


    本节探讨的两种ROI模型来自Reese（2009）关于云采用的研究和Feldman（2012）对云订阅者使用ROI的探讨。Reese（2009,50）使用了一个ROI工作表，其中包含与传统和基于云的IT相关的前期、人工、经常性、资本、许可和订阅成本类别。他建议估算三年期间的成本，以便与传统的IT服务进行比较。


    ## 选择与实施方案


    Reese的方法侧重于详细列出硬件成本并将人工成本合并为单项总和，并包括对性能损失成本的估算，这可能是选择云容量的一个因素（例如，组织可能会选择刚好满足当前需求的中容量云服务器，而不是为物理服务器过度购买容量）。这种性能损失成本可以通过设计可扩展系统来缓解，实际上也可以从另一个角度来看（例如，未使用容量的资本成本）。


    相比之下，Feldman（2012,19）的ROI方法将资本成本、运营成本、未来资本成本（例如用于节省）、人员配置影响、非IT员工的时间节省、资源调配（例如硬件获取/设置时间）、网络费用、实施成本和公用事业成本作为因素。Reese的计算描述了一种完全本地或完全基于云的IT基础设施，其中云部署实现的资本投资节省导致云服务总体总成本降低，而Feldman的ROI分析则表明，最经济的方法侧重于使用支持公有云突发（例如Eucalyptus、OpenStack或CloudStack）的私有云服务，并将长期投资与短期容量需求区分开来。


    ### 云爆发


    云爆发是指使用私有云中采用的相同工具和标准，将计算和存储资源从私有云快速扩展到公有云或社区云环境的能力。特别是Amazon和Rackspace两家提供商，使用不同的私有云平台支持云爆发。2012年3月，Amazon宣布与Eucalyptus达成正式协议，使用Amazon首次部署的相同应用程序编程接口工具设计来设计其云系统（Eucalyptus
    2012）。同样，Rackspace在OpenStack的开发和发布中发挥了关键作用，并正在构建将私有OpenStack部署轻松迁移到Rackspace服务的能力（Moorman
    2011）。此外，Internap（http://internap.com）等数据中心开始提供使用OpenStack平台的私有云平台，从而实现一种新型的外部来源的私有和公有云架构。


    这些结论显示了计算云服务ROI的难度，并引入了三种不同的方法：非虚拟化、私有/公有云、完全公有/社区云。值得注意的是，在提出这一论点时，Feldman指的是DreamWorks和Zynga等大型公司，这两家公司的“突发级”容量需求远远超过大多数图书馆数年的持续资源需求（例如，1000万CPU小时）（Feldman
    2012, 6）。这意味着许多图书馆可能会发现他们的计算更接近Reese的观点，即组织通过对单一类型的计算平台进行集中投资来节省资源。图3.1将其中一些潜在成本组合在一个单一的ROI矩阵中。


    图3.1将成本区域分为四个部分：初始成本、持续成本、服务管理和人工成本。每个区域的具体内容取决于机构的资源，但可能包括防火墙、负载均衡、网络交换机、互联网流量费用和硬件服务器。这种模型作为清单很有用，但在图书馆这样的组织中（通常作为更大组织内的一个子单位运作）可能会导致复杂的成本计算。例如，图书馆通常要处理一定水平的IT基础设施，这些基础设施要么不可替代，要么没有直接成本（例如组织防火墙），但可能会根据服务器采购需求产生直接成本。在这种情况下，在物理环境和云环境中详细列出IT服务的成本可能很困难，但可能有助于分解与基于云的选项相关的不同成本。


    | 成本 |  | 内部非虚拟化 | 私有云 | 外部PaaS/IaaS | 外部SaaS |

    |------|---|------------------------|---------------|--------------------|---------------|

    | 前期资源 | 网络 |  |  |  |  |

    |  | 服务器 |  |  |  |  |

    |  | 存储 |  |  |  |  |

    |  | 软件许可 |  |  |  |  |

    | 持续资源 | 网络 |  |  |  |  |

    |  | 服务器 |  |  |  |  |

    |  | 存储 |  |  |  |  |

    |  | 软件许可 |  |  |  |  |

    | 支持服务 | 服务监控 |  |  |  |  |

    |  | 服务审计 |  |  |  |  |

    |  | 服务调配 |  |  |  |  |

    | 人工 | IT人工 |  |  |  |  |

    |  | 非IT人工 |  |  |  |  |


    **图3.1** 通用成本计算模板


    另一个使云成本计算复杂化的因素是所实施服务的预期持续时间。Reese建议预测三年期间的成本；Feldman则区分“初创”和“企业”采用，认为随着组织向企业级迈进，他们可能会在运行具有公有云突发能力的私有云环境中找到更多成本节省。图书馆可能不应从初创与企业角度思考，而应考虑信息服务的预期寿命。这可以帮助组织了解在短期和长期服务中，前期资本投资与持续云投资相比的潜在成本节省。同时，它也可能使ROI的计算更加复杂。这可能涉及选择或遵循折旧计划，并详细了解在云服务中会消失和不会消失的技术成本。为帮助进行这些计算，Reese提供了公式来计算服务生命周期内的成本并确定当前技术价值（2009,53,12）。云提供商，特别是IaaS提供商，可能会提供成本计算器——例如，Amazon（http://calculator.s3.amazonaws.com/calc5.html）、Microsoft
    Azure（www.microsoft.com/windowsazure/pricing-calculator/）和RightScale（www.rightscale.com/tco-calculator/）。


    成本计算中的另一个重要因素，尤其是对图书馆而言，是数据存储和数据传输成本。随着时间的推移规划备份成本的常用方法是估计一个月内预期数据变化量，并将总存储量乘以该百分比（例如，如果您预计一个月内有15%的变化，则您的备份费用是存储成本的1.15倍）。备份数据在云服务上被完全复制这一事实会使存储成本看起来非常昂贵，但包括Amazon
    S3和Glacier服务在内的许多云服务将自动复制和冗余作为存储服务的一部分。这并不能消除备份需求，但对于熟悉这种存储方法的组织来说，使用版本控制和具有有限归档历史的唯一备份可以降低整体存储成本。


