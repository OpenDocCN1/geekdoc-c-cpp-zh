  mdcn: "\n\n## 图书馆中的云计算与虚拟化\n\n本书借用了云计算和虚拟化的术语来描述相关服务。尽管虚拟化和云计算的技术定义与外包和服务托管的操作性定义有很大不同，但本书有意模糊了基于云的方法（如软件即服务，SaaS）与图书馆IT供应商提供的SaaS式服务托管之间的界限。这使我们能够比较这些方法，并讨论创建一种更符合图书馆中常见的多样化供应商和平台组合的IT服务基础设施。从基于云的虚拟化IT对应物的角度讨论外包和托管，也使我们有机会使用常见的IT衡量标准来评估托管和外包服务的技术与服务质量。在开始探索这些广泛主题之前，我们必须定义并思考云计算与虚拟化之间的差异。\n\
    \n## 云计算\n\nGartner和美国国家标准与技术研究院（NIST）这两个组织被认为给出了定义完善的云计算概念。两者都通过讨论云计算服务的不同方面来进行定义（Mell\
    \ and Grance 2011; Smith 2010）。NIST将云计算广泛定义为“一种模型，用于实现对可配置计算资源（例如网络、服务器、存储、应用和服务）共享池的普遍、便捷、按需网络访问，这些资源可以以最少的管理工作或服务提供商交互快速供应和释放”（Hogan\
    \ et al. 2011）。此外，它还通过三种服务模型来限定云计算：SaaS、平台即服务（PaaS）和基础设施即服务（IaaS）。NIST云计算框架定义了所有云计算环境共有的特征，并将云服务模型与云部署模型区分开来（Mell\
    \ and Grance 2011）。\n\n表1.1列出了NIST对云环境定义的特征和模型。理解这一点很有用：尽管所有云解决方案都采用一种服务模型、一种部署模型和多种服务特征，但每种解决方案很可能包含不同的服务特征和部署模型组合。例如，Microsoft\
    \ Azure和Amazon Web Services（AWS）都提供PaaS和IaaS解决方案的混合，而RightScale和Rackspace则帮助用户在公有云和私有云之间搭建桥梁。此外，云提供商使用“即服务”模型为安全、IT管理、身份管理和其他信息服务定义定制云解决方案已日益普遍。这种碎片化可能使用户难以区分服务类型，并指向了构成特定云服务的复杂关系集合。\n\
    \n**表1.1**  \n**NIST云计算要素**\n\n| 基本特征 | 服务模型 | 部署模型 |\n|---|---|---|\n| 按需自助服务\
    \ | SaaS | 私有云 |\n| 广泛网络接入 | PaaS | 社区云 |\n| 资源池化 | IaaS | 公有云 |\n| 快速弹性 |  |\
    \ 混合云 |\n| 可测量或计量 |  |  |\n\n### 基本特征\n\nNIST模型包含几个有助于区分云服务的基本特征。这些特征描述了一种环境：终端用户可以分配IT服务（如按需自助服务），可以根据需要扩展（如快速弹性），并且通过订阅付费而非一次性购买费用（如可计量服务）。NIST的基本特征还描述了一种环境：服务可通过网络获得，IT资源集中放置以促进共享和扩展。相比之下，传统IT环境侧重于通过一次性资本支出购买的本地托管硬件、计划容量而非按需容量，以及静态或变化较慢的服务产品。在考察云解决方案时，考虑这些特征（如弹性、可扩展性、按需性）很重要，但同样重要的是考虑在特定服务中哪些特征更可取。例如，在图书馆市场中，外包或托管的IT服务以及专门的SaaS提供商通常提供的云服务既不是按需的，也不具备弹性，但可能利用这些特征来创建和管理其底层云基础设施。\n\
    \n### 服务模型\n\nSaaS、PaaS和IaaS服务模型是云计算定义中最常讨论的模型，但在某些情况下它们之间的区别并不清晰。“即服务”的云计算方法包括数据库即服务（DaaS；Howe\
    \ et al. 2011）、安全即服务（SECaaS；Hussain and Abdulsalam 2011）和身份即服务（Krüger and Grabski\
    \ 2009）。缩略词的重复使用以及云计算定义的不断扩展，可能使信息组织难以识别和选择服务。与此同时，公司能够提供小众服务，而这些服务对于较小的组织来说实施起来可能很困难或过于昂贵。例如，CloudFlare（www.cloudflare.com）通过跨多个云提供商管理域名系统（DNS）和服务复制来抵御拒绝服务攻击和流量激增，而无需此类服务通常所需的负载均衡和安全配置。利用此类服务，信息组织可以在其IT配置中构建健壮性，而无需承担传统IT环境中必然产生的成本。正如我们在第4章和第5章中对这些服务模型的探讨所示，图书馆选择的模型在很大程度上取决于本地专业知识、IT服务要求、组织策略和本地偏好等因素。\n\
    \n### 部署模型\n\nNIST的四种部署模型（Fang et al. 2011）区分了内部和外部环境，并考察了服务于特定社区的云计算方法。在该模型中，私有云被定义为客户对其计算服务拥有独占物理或虚拟访问权的环境。这些服务可能在现场运行，或由云提供商远程托管，但通常涉及专用硬件，并且只能通过私有物理或虚拟网络访问。在社区云环境中，一组相关客户对计算服务拥有共享访问权。尽管实际计算服务可能在内部运行或由云提供商运行，但社区云通常具有对云环境中部分或全部资源的共享访问特征。政府云或教育云是社区云和私有云的很好例子。这些环境可能在专用硬件和网络上运行（如私有云的情况），但也可能在服务于其他云客户的硬件上运行，但具有虚拟隔离。Amazon政府计算云只是众多可用的社区/私有云解决方案之一。与私有云和社区云相比，公有云解决方案的特点是向公众提供云计算服务和基础设施。尽管公有云平台对所有订阅者开放，但它们通常具有安全层，允许订阅者创建与私有云一样安全的虚拟私有环境。例如，AWS平台主要作为公有云解决方案运行，但其设计使客户IT资源与Amazon员工和其他订阅者实现虚拟隔离。混合云是“包罗万象”的模型，因为它包含两种或多种云系统（公有云、私有云或社区云）的特征，但为了数据或应用共享而绑定在一起。\n\
    \n每种部署方法都有相应的风险和规模优势。例如，在物理安全和虚拟隐私至关重要的环境中，公有云可能不是最佳解决方案。同样，在规模经济性和互操作性很重要的情况下，私有云可能不太适合。熟悉这些模型很重要；理解它们有助于为云计算采用的方案提供背景信息。多位作者（Mell\
    \ and Grance 2011; Metz 2011）已经准备了聚焦于服务模型和部署模型交叉点的优秀解释，并进一步说明了它们之间的差异。\n\n除了理解服务模型和部署模型之间的区别外，理解云提供商和订阅者的角色也很重要。这些角色包括常见的角色，如云采用者和云提供商，以及新兴角色，如云审计员和云代理。图1.1中的NIST参考模型展示了这些参与者之间的关系，并探讨了\n\
    \n![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_21_0.png)\n\n**图1.1**  \nNIST云参考模型\n\
    \n"
