    platform to manage both the reserved storage space and application server. The
    Relational Database Service (RDS) is an independently managed service with its
    own backup and monitoring services. In this example, persistent data are stored
    as separate 100 GB EBS volumes (e.g., digital images, essential documents, website
    files) that can be detached from the application server and reattached to a new
    server if required. Storing important data on EBS volumes rather than on storage
    associated with the machine instance both makes it easier to migrate this data
    onto new servers and provides additional levels of redundancy that reduce the
    risk associated with hosting important files on cloud services.


    In this environment, CloudFormation configuration services would be used to document
    server configuration. The CloudFormation service supports both initialization
    and setup of Amazon resources (e.g., EC2 instances, EBS volumes, Security Group
    definitions) and installation and configuration of specific server applications.
    To accomplish this, the CloudFormation service uses a package management service
    called cloud-init that is designed to facilitate server configuration during initial
    start-up. A good “getting-started” guide for this service is in Amazon’s documentation
    on CloudFormation (Amazon 2012). Reid (2012) suggests using Chef (www.opscode.com/chef/)
    along with CloudFormation to create an automatic configuration tool that is independent
    of platform and operating system.


    Linode and Rackspace offer similar functionality for scripting resource creation
    and management. Figure 6.2 shows a similar cloud implementation using Linode as
    the sole cloud provider. Like Amazon, Linode supports multiple cloud regions and
    has its own customized scripting language, called Lish, to facilitate server management.
    Linode’s monitoring service, like Amazon’s, focuses on server health as opposed
    to application health. Linode uses StackScripts to support automatic configuration
    and deployment of servers and features version control for scripts to allow easy
    testing and restoration of services.


    Chapter 5 examines the costs associated with a single-vendor model. Tables 5.2
    and 5.3 show budgets that generally fit the configurations outlined in figures
    6.1 and 6.2. The budgets include a comparison of costs for on-demand and reserved
    instances but omit charges for services that libraries may want to include from
    outside vendors (e.g., managed backups, region replication, or application monitoring).


    Some benefits of this single-vendor cloud are tight integration between Amazon
    services; consistent monitoring, configuration, and backup services; built-in
    ability to scale or replace application server easily without impacting database
    or digital object storage; and ability to migrate one or more services into new
