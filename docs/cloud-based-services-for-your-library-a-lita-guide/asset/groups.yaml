    等服务通过支持跨多个提供商复制服务器的机制简化了这一过程。同样，Amazon 提供了通过命令行工具迁移服务的选项。作为这一过程的一部分，了解在可用区中断情况下可用的服务非常重要。


    IT 部门中正在获得支持的另一种服务器复制方法是自动配置和服务器部署，而不依赖云提供商。Puppet 和 Chef 等服务器配置工具用易于部署的配置脚本取代了“金蛋”方法。这些脚本记录了服务器创建和配置过程中的每个步骤，直到数据恢复和投入生产为止。使用这种“可操作”的配置文档，IT
