    LVM 需要配置文件和静态磁盘集。在云环境中，镜像、增加、分离和重新附加卷要容易得多。这在一定程度上削弱了 LVM 提供的优势，并具有额外的好处，即能够在无需跟踪
    LVM 配置文件和卷关联的情况下轻松镜像、复制和恢复磁盘映像。


