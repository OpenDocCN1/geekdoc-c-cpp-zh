    IT 系统类型，需要从表 3.1 中讨论的视角考虑其中一个或多个领域。这使得比较传统的非虚拟化环境（其中四个技术层中的每一个都可能由图书馆管理）与外包或 SaaS
    应用变得困难。以下各节更详细地探讨了这些因素中的一些，可以作为正在考虑 IT 替代方案的图书馆的起点。


    ## 技术因素


    在探索基于云和虚拟化服务时需要考虑的所有问题中，技术问题可能占据中心地位。了解图书馆采用虚拟化和云计算时所需的技术工作是重要的一步，可以帮助指导关于容量和长期可持续性的决策。


    ### 基础设施管理


    基础设施级服务的管理由核心要素组成，包括网络、服务器和操作系统。基础设施级管理通常伴随着对信息服务的从头到尾的责任，需要能够设计和部署硬件（虚拟化或物理）基础设施、安装和配置软件、安全维护不同的
    IT 组件（例如，服务器、网络、安全），并管理服务配置和部署的变更。这需要熟悉安全措施（例如，防火墙、用户访问和系统更新）和 IT 服务管理（例如，服务配置、部署、备份、故障转移和折旧），以及对系统设计对信息服务影响的细粒度理解。在云环境中，这还意味着对构成
    IaaS 环境的云服务元素的更广泛熟悉（例如，服务器镜像、卷快照、安全组）。NIST 参考模型在 Fang 等人（2011）的研究中扩展了基础设施级技能要求，提出了与云计算采用相关的十个技术因素：


    - 1. 在云中创建、访问、更新和删除数据对象

    - 2. 在云之间移动虚拟机和虚拟设备

    - 3. 为私有外部托管云选择最佳 IaaS 供应商

    - 4. 用于监控和管理多个云的工具

    - 5. 在云之间迁移数据

    - 6. 对多个云的单点登录访问

    - 7. 跨云的编排流程

    - 8. 发现云资源

    - 9. 评估 SLA 和罚则

    - 10. 审计云


    其中一些任务技术性很强，需要基础设施级专业知识。例如，创建、管理和迁移虚拟机需要了解如何分配基础设施资源并配置系统和应用程序。其他任务包括评估 SLA、发现新的云资源以及审计云服务，对所有云计算方法都很重要。鉴于这些技术因素固有的复杂性，可能有必要选择在特定环境中更重要的因素。例如，虽然馆员隐私和服务质量在图书馆中是主要问题，但在选择基于云的信息服务时，单点登录或完全互操作的云环境可能并非必要。


    图书馆可能很难在内部找到管理技术基础设施的资源，但也可能发现云提供商正在降低这些系统的复杂性并降低实施和管理这些服务的成本（财务和运营）。尽管所需技能清单可能令人望而生畏，但鉴于图书馆倾向于从不同供应商或开源社区采用信息服务，管理基础设施级服务的能力对图书馆有所帮助。对于寻求在基础设施管理方面培养专业知识的图书管理员来说，熟悉本地虚拟化平台（如
    Oracle 的 VirtualBox (http://virtualbox.org)）以及 IaaS 提供商提供的云虚拟化平台（例如，Amazon、Rackspace
    或 Microsoft）是一个良好的第一步。这些技能很容易转移，因为使用 Amazon 平台所需的概念理解在其他提供商中得到体现（例如，对基于 CPU 时间计费、存储资源、防火墙资源、监控服务、身份验证服务的理解）。尽管具体服务取决于部署的平台或应用程序，但对基础设施级容量的理解有助于图书管理员或
    IT 管理员在设计基于云或虚拟化系统时。


    ### 平台管理


    平台支持的技术方面通常侧重于构成面向终端用户应用程序的软件组件。例如，运行在 WordPress 上的内容管理系统需要熟悉 Apache、MySQL、PHP
    和 WordPress 插件，并且可能需要熟悉身份验证系统（例如，LDAP、Shibboleth）和安全 Web 连接（例如，SSL）。根据所选平台，可能需要其他技能，包括编程熟悉度、对
    Web 服务架构的理解，或对服务器基础设施的更细粒度理解。


    在 PaaS 云环境中，平台管理可能需要熟悉特定套件或 Web 服务配置。例如，Google App Engine (http://code.google.com/appengine/)
    要求用户在其特定的框架内设计应用程序，该框架包括数据库平台、编程框架和 Web 服务部署架构。由于图书馆通常 IT 资源有限，它们可能会发现平台和应用程序管理比基础设施管理更容易接近。On


    管理系统的意义在于，图书馆可能能够保留定制用户界面和应用程序功能的能力，同时也依赖 SaaS 解决方案来提供应用程序。然而，这并不总是可能的；许多提供商承诺能够定制终端用户体验，但图书馆需要就其寻求的界面修改提出具体问题。


