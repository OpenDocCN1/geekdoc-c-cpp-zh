  - '[PAGE 155]


    result in better service or a more durable or manageable system. Systems that
    rely on more than one provider to function run the risk of reduced stability and
    increased downtime as the SLAs of both vendors come into play. There is also a
    risk with turning key infrastructure functions such as backup over to SaaS options.
    This creates the same vendor lock-in risk discussed in our first model and requires
    that IT departments view these services as core elements of their IT infrastructure.
    For this reason, the services easiest to adopt in this environment are those whose
    temporary or permanent failure would not compromise the integrity of core library
    services. Finally, the SaaS services described in this model rely on IaaS vendor
    APIs and shared keys. Although it may ultimately make sense to use an SaaS service
    to benefit from economies of scale, it can be equally valuable to invest in developing
    local expertise for working with the command line tools instead.


    # APPROACH THREE:

    REDUNDANT AND SCALABLE

    MULTICLOUD DEPLOYMENTS


    Like our second approach, the third uses multiple providers and SaaS but adds
    abstracting service configuration and deployment to an SaaS provider. IaaS providers
    tend to do a good job creating a durable cloud framework but in exchange may focus
    less on simple IT administration services. Learning the API framework of IaaS
    providers is useful for ensuring a high-quality cloud infrastructure, but it can
    be difficult for a small IT environment to learn to work with multiple IaaS platforms
    using this approach.


    Approach three seeks to balance the benefits of using multiple cloud IaaS providers
    while limiting the challenges associated with managing services without focusing
    on which IaaS provider runs each service. Two resources discussed in chapter 5
    seek to serve this need: RightScale and KOALA. These services use a configuration
    and resource deployment platform to enable IT administrators to move services
    easily between cloud providers. This process means that certain services such
    as DNS resolution and server configuration tools are offloaded to these cloud
    services, but in exchange RightScale manages replication across multiple cloud
    providers. Figure 6.4 shows a potential configuration using RightScale to monitor
    and manage cloud services on Amazon, Rackspace, and a private cloud running Eucalyptus.
    It also shows the use of Cloudability to audit cost and resource utilization across
    these providers.'
