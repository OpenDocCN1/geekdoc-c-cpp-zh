    small environments of one to three IT support staff (n=47). The overall size of
    library staff showed a more equal distribution, with an emphasis on slightly small
    and medium-sized libraries (29.9 percent with 40 or fewer staff) versus large
    (14.9 percent with 41–119 staff) and very large (19.4 percent with 120 or more
    staff). Patron population size varied, with over 32 percent of respondents serving
    15,000 or more patrons and 22.4 percent of libraries serving between 3,000 and
    15,000 patrons. There was also a mix of branch sizes, with 27 percent (n=37) of
    respondents supporting a single library branch and 21 percent (n=29) supporting
    two to five branches. The number of participants supporting larger branch organizations
    was much smaller (6–20 branches, n=13; 21–30 branches, n=4; 31 or more, n=8).


    ## State of Adoption of Cloud Services for Library IT Services


    The survey found a variety of adoption rates and adoption platforms for each system.
    In some cases (e.g., ILS), adoption trended toward nonvirtualized solutions; in
    others (e.g., research guides), internally and externally virtualized/cloud solutions
    predominated. Table 2.2 shows the various adoption rates of each platform/system.
    Tables 2.3 and 2.4 group systems by platform based on frequency of adoption. Table
    2.3 shows service/platform groupings used by 20 percent or more of participants.


    Table 2.4 shows service/platform groupings used by 10–19 percent of participants.
    Services are listed multiple times (e.g., website) if their adoption rate met
    the range associated with the table in multiple categories.


    These adoption levels indicate some common trends in the libraries surveyed. For
    example, older systems such as ILS and library OPACs tended to be both widely
    adopted and run only in a nonvirtualized environment. Likewise, client computing
    tended to be nonvirtualized (e.g., public client computers and staff client computers),
    but there were instances of desktop virtualization for both client and staff solutions.
    In contrast, more recently developed systems (e.g., discovery services) and data-centric
    systems (e.g., OpenURL resolvers) tended to be virtualized using in-house or external
    cloud systems or outsourced completely. For example, Table 2.2 shows that 24 percent
    of respondents ran a discovery service as an outsourced service, an additional
    11 percent ran the service using some form of virtualized or cloud platform, and
    3 percent indicated that these services were run as a nonvirtualized service.
    Although several systems grouped around nonvirtualized and outsourced solutions,
    it was interesting to note that the only service that showed a substantial locally
    or cloud-based (but not outsourced) virtualized solution was the library website
    (31 percent).


    As table 2.3 shows, some systems fit into multiple implementation platforms. For
    example, both OPAC and library website systems fit under both internally virtualized
    and nonvirtualized platforms. It is interesting that this view of the data shows
    a grouping of systems under either nonvirtualized or outsourced solutions. This
    gap in adoption points to an interesting trend in cloud adoption toward outsourced
    solutions. Table 2.4, which shows that fewer libraries use internal and external
    virtual/cloud systems, supports this trend and indicates that libraries less frequently
    adopt internal virtualization and external PaaS/IaaS cloud solutions as compared
    to nonvirtualized or SaaS solutions. The lack of use of externally virtualized
    (e.g., PaaS or IaaS) services raises questions about the factors that influence
    library adoption of technology platforms and could have a considerable impact
    on the development of new library systems (particularly open-source solutions)
    in the coming years.


    A second trend in the data is the prevalence of data-intensive and new genres
    of systems in the outsourced category while traditional systems (e.g., the ILS)
    remain nonvirtualized. Participant responses regarding the motivations for implementing
    systems in nonvirtualized environments indicate that libraries are shifting these
    systems toward cloud-based solutions but are still considering options or have
    yet to find cloud solutions that meet all of their needs. The ILS is the most
    representative system of this type, seeing relatively low levels of implementation
    in each of the three virtualized categories, with 14 percent of libraries reporting
    using an ILS on a virtualized platform, 10 percent using some form of external
    cloud provider, and just over 16 percent using an outsourced or SaaS solution.
    Though individual approaches showed relatively low percentages, it is worth noting
    that over 40 percent of libraries had turned to some internally or externally
    virtualized solution. This trend was seen across most systems. When grouped into
    virtualized and nonvirtualized solutions, it was common, with the exception of
    client computing, to see a relatively high level of virtualized use. This trend
    included server virtualization as well, with 41 percent of libraries using internally
    virtualized resources.


    ## Perceptions of Cloud Computing and Virtualization


    In addition to exploring the landscape of cloud computing adoption, the survey
    also explored the participants’ view of the potential impact of cloud computing
    and virtualization. Participants were asked to indicate their agreement with two
    statements about both cloud computing and virtualization: “Cloud computing/virtualization
    is a current priority of the administration,” and “Cloud computing/virtualization
    has the potential to transform library IT in the short term.” Figures 2.2 through
    2.5 show participant responses for these questions.


    The data from these questions show a largely positive view of the impact of both
    cloud computing and virtualization. Likewise, survey participants largely viewed
    cloud computing and virtualization as priorities of the administration. There
    was some variation in participant views of the priority of cloud computing and
    virtualization, indicating that participants are bullish on cloud computing and
    virtualization but more positive about the latter.


    ## Motivating and Inhibiting Factors of Cloud Computing and Virtualization


    The survey also collected qualitative data on the motivating and inhibiting factors
    related to the use of cloud computing and virtualization resources. For each series
    of qualitative responses, codes were generated from responses and then mapped
    onto the survey analysis framework. Statements were coded into TAM areas (value
    and ease of use) when the participant stated a perception (e.g., nonvirtualized
    is easier) as opposed to a situation (e.g., current IT policy inhibits cloud migration).

