    启用或抑制云采用。总共评估了十四类图书馆系统：


    - 1. 数字资产管理系统（DAMS，例如 DSpace、Fedora、CONTENTdm）

    - 2. 发现服务（例如 Summon、Primo、Encore）

    - 3. 电子资源管理系统

    - 4. 电子保留系统

    - 5. 馆际互借系统

    - 6. 综合图书馆系统（ILS）

    - 7. 图书馆读者客户端计算机

    - 8. 图书馆工作人员客户端计算机

    - 9. 图书馆服务器

    - 10. 图书馆网站

    - 11. OPAC/发现层（书籍、媒体、连续出版物）

    - 12. OpenURL 解析器

    - 13. 研究指南

    - 14. 员工内网


    参与者还可选择包含额外的系统类别。基于他们对各类系统整体虚拟化类别之一的选择，参与者被要求对影响其选择的促进和抑制因素发表评论。参与者并非被具体询问系统，而是被一般性询问（例如，“您表示某些服务运行在内部虚拟化环境中…”）。


    ## 结果


    总共，调查收到了 111 份回复。调查中的所有问题均为可选，因此每个问题的回复总数可能不同。调查数据被分为三个主要领域：人口统计信息、云计算采用的定量结果以及云计算采用的定性结果。


    调查数据在受图 2.1 所示框架指导的情况下进行编码，但可根据参与者产生的主题进行增补和解释。编码重点在于识别影响云计算和虚拟化技术采用的主题和构念。代码经过细化并有助于开发一个扩展框架，重点探索考虑新
    IT 服务时重要的因素和构念。定量数据被分析以提供云计算采用的描述性统计以及机构类型和规模、服务类型（例如数字图书馆、参考服务）与采用的技术平台（例如云、虚拟化、传统）之间关系的推断统计。


    ## 人口统计


    回复调查的图书馆大多数为学术图书馆（n=57）。其他图书馆包括公共图书馆（n=13）和法律或医学图书馆（n=7）。值得注意的是，六名参与者代表图书馆的联合体
    IT 支持，且有图书馆服务于多个群体，包括学术/公共（n=2）和学术/医学（n=1）。非学术图书馆回复数量较少限制了这些发现的普遍性。事实上，人口统计显示研究人群以中型学术机构为主，所提出的组织和环境问题应在该背景下考虑。


    大多数受访者还表示其图书馆的 IT 支持人员环境相对较小，为一至三人（n=47）。图书馆工作人员整体规模分布较为均衡，略偏向小型和中型图书馆（40 人或以下占
    29.9%）对比大型（41–119 人占 14.9%）和超大型（120 人或以上占 19.4%）。读者群体规模各异，超过 32% 的受访者服务 15,000
    名或以上读者，22.4% 的图书馆服务 3,000 至 15,000 名读者。分支机构规模也各不相同，27%（n=37）的受访者支持单一图书馆分支，21%（n=29）支持两至五个分支。支持更大分支组织的参与者数量要少得多（6–20
    个分支，n=13；21–30 个分支，n=4；31 个或以上，n=8）。


    ## 图书馆 IT 服务云服务采用现状


    调查发现每个系统的采用率和采用平台各不相同。在某些情况下（例如 ILS），采用趋势倾向于非虚拟化解决方案；在其他情况下（例如研究指南），内部和外部虚拟化/云解决方案占主导。表
    2.2 显示了每个平台/系统的各种采用率。表 2.3 和 2.4 按采用频率将系统按平台分组。表 2.3 显示了 20% 或以上参与者使用的服务/平台分组。


    表 2.4 显示了 10–19% 的参与者使用的服务/平台分组。服务在多个表中列出（例如网站），如果其采用率在多个类别中达到与该表相关的范围。


    这些采用水平表明受访图书馆存在一些共同趋势。例如，像 ILS 和图书馆 OPAC 这样较旧的系统往往既被广泛采用又仅在非虚拟化环境中运行。同样，客户端计算往往是非虚拟化的（例如公共客户端计算机和工作人员客户端计算机），但客户端和工作人员解决方案均存在桌面虚拟化的实例。相比之下，更近期开发的系统（例如发现服务）和以数据为中心的系统（例如
    OpenURL 解析器）往往使用内部或外部云系统虚拟化或完全外包。例如，表 2.2 显示 24% 的受访者将发现服务作为外包服务运行，另外 11% 使用某种形式的虚拟化或云平台运行该服务，3%
    表示这些服务作为非虚拟化服务运行。尽管多个系统围绕非虚拟化和外包解决方案分组，但值得注意的是，唯一显示出大量本地或云端（但非外包）虚拟化解决方案的服务是图书馆网站（31%）。


    正如表 2.3 所示，一些系统适合多个实施平台。例如，OPAC 和图书馆网站系统均属于内部虚拟化和非虚拟化平台。有趣的是，这一数据视图显示系统分组在非虚拟化或外包解决方案之下。采用中的这一差距指向云采用向外包解决方案发展的有趣趋势。表
    2.4 显示较少图书馆使用内部和外部虚拟/云系统，支持这一趋势并表明图书馆采用内部虚拟化和外部 PaaS/IaaS 云解决方案的频率低于非虚拟化或 SaaS
    解决方案。对外部虚拟化（例如 PaaS 或 IaaS）服务使用的缺乏引发了关于影响图书馆技术平台采用的因素的问题，这可能对未来几年新图书馆系统（特别是开源解决方案）的开发产生相当大的影响。


    数据中的第二个趋势是数据密集型和新类型系统在外包类别中占主导，而传统系统（例如 ILS）仍保持非虚拟化。参与者关于在非虚拟化环境中实施系统的动机回复表明，图书馆正将这些系统转向基于云的解决方案，但仍在考虑选项或尚未找到满足其所有需求的云解决方案。ILS
    是这种类型的最具代表性的系统，在三个虚拟化类别中的实施水平相对较低，14% 的图书馆报告在虚拟化平台上使用 ILS，10% 使用某种形式的外部云提供商，略高于
    16% 使用外包或 SaaS 解决方案。尽管单个方法显示的百分比相对较低，但值得注意的是，超过 40% 的图书馆已转向某种内部或外部虚拟化解决方案。这一趋势在大多数系统中均可见。当分组为虚拟化和非虚拟化解决方案时，除客户端计算外，虚拟化使用水平相对较高较为常见。这一趋势还包括服务器虚拟化，41%
    的图书馆使用内部虚拟化资源。


    ## 对云计算和虚拟化的认知


    除了探索云计算采用格局外，调查还探讨了参与者对云计算和虚拟化潜在影响的看法。参与者被要求对关于云计算和虚拟化的两个陈述表示同意与否：“云计算/虚拟化是管理层的当前优先事项”，以及“云计算/虚拟化有潜力在短期内改变图书馆
    IT”。图 2.2 至 2.5 显示了参与者对这些问题的回复。


    这些问题的数据显示出对云计算和虚拟化影响的总体积极看法。同样，调查参与者普遍认为云计算和虚拟化是管理层的优先事项。参与者对云计算和虚拟化优先级的看法存在一定差异，表明参与者对云计算和虚拟化持乐观态度，但对后者更为积极。


    ## 云计算和虚拟化的促进与抑制因素


    调查还收集了与云计算和虚拟化资源使用相关的定性数据促进和抑制因素的定性数据。对于每个定性回复系列，代码从回复中生成，然后映射到调查分析框架。陈述被编码为 TAM
    领域（价值和易用性），当参与者陈述一种感知（例如非虚拟化更容易）而不是一种情况（例如当前 IT 政策抑制云迁移）时。


