    four basic methods of approaching larger-scale migrations to cloud computing that
    leverage a mix of the platforms and services reviewed in the previous chapters.
    The four approaches are based on a simple cloud architecture that features an
    application server, persistent storage space, and a separate database server or
    database service. The sizes of the server, database, and storage space are not
    specified; this architecture could scale for small, medium-sized, or large libraries
    and is capable of hosting multiple applications.


    Each approach features common functions, including automatic server configuration,
    automated backups, a separate database service, a single application server, service
    monitoring, and cost auditing. Though it is common to find these services in IaaS
    providers, there the services are not always automated or monitored to the extent
    needed. Likewise, these services are implemented in PaaS and SaaS environments
    as well, but there they often focus on distinct applications and cannot be configured
    to monitor multiple platforms or providers. To stay focused on high-level issues,
    I do not include in the comparison of approaches the specific functions of monitoring,
    auditing, firewall services, administrative user access, service growth planning,
    and budgeting. This certainly does not minimize the importance of designing a
    cloud infrastructure that includes these highly functional features, for they
    may be a compelling reason to adopt or reject a platform.


    ## APPROACH ONE:

    SINGLE-VENDOR CLOUD DEPLOYMENT


    A common approach to cloud computing is to select a single vendor and implement
    a category of cloud services (e.g., all discovery services, all website services)
    within that vendor''s environment. This applies to SaaS, PaaS, and IaaS environments
    and may be appropriate for specific categories of services. In this case, the
    single-vendor cloud is used to deploy our hypothetical application/database server
    environment. Single-vendor implementations can be easier to accomplish and have
    the benefit of enabling the library to work with a single suite of APIs and administrative
    interfaces. In the SaaS environment, a single-vendor cloud also likely includes
    tightly integrated services and efficient data management features. Single-vendor
    clouds do come with risks of vendor lock-in and service downtime if the cloud
    service fails, but many vendors have designed multiregion cloud platforms that
    operate independently, helping customers mitigate the risk of working with a single
    provider.


    As an example, figure 6.1 illustrates an example set of services implemented in
    the Amazon EC2 cloud environment. This approach uses configuration,


