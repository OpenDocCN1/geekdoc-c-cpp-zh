    2 GHz 的 Intel Xeon CPU，并具有 6–8 GB 的 RAM。研究人员在所有三个服务器平台上使用名为 Bonnie++（www.coker.com.au/bonnie++）的输入/输出文件测试系统、MySQL
    数据库加载例程以及 ImageMagick（www.imagemagick.org）对 1000 万张图像进行图像处理例程，以比较服务器性能。他们的测试发现，Amazon
