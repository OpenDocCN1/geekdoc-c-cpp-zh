    relationship between activities (e.g., cloud use, development, deployment) and
    auditing, managing, and functions such as service deployment, resource allocation,
    and physical/virtual security.


    The NIST model also defines the limits of expertise and responsibility that should
    be expected of the various players in a cloud computing solution. It is worth
    noting that the roles of consumer, auditor, provider, carrier, and broker may
    not apply in all cloud computing adoption frameworks; nevertheless, they are valuable
    roles to consider when exploring new IT systems. For example, in many cases libraries
    (e.g., the cloud consumer) interact directly with cloud providers rather than
    working through a cloud broker. In this case the process of working with and auditing
    service layers, security, privacy, and service-level agreements (SLAs) falls on
    the cloud consumer. The NIST model also provides a taxonomy of cloud features
    (Fang et al. 2011) that describes the issues cloud consumers should be aware of
    when selecting and implementing a cloud solution. This taxonomy defines the activities
    (e.g., service creation, publishing, auditing), components (e.g., processes, actions,
    tasks), and subcomponents (e.g., service provision, service decommission) that
    may be helpful for organizations seeking to understand relationships and interactions
    important in cloud computing adoption.


    ## Virtualization


    In contrast to cloud computing, virtualization is defined as “the abstraction
    of IT resources in a way that masks the physical nature and boundaries of those
    resources from resource users” (Gartner 2011). Virtualization enables creation
    of multiple virtual machines on a shared hardware platform; enhances flexibility
    in CPU, memory, and storage allocations between machines; and is designed to be
    portable across hardware platforms (Smith and Nair 2005). This is a broad definition
    that includes the virtualization of servers, clients, network-attached storage,
    and any number of other computing resources. Common server platforms include Xen
    (http://xen.org), Citrix (http://citrix.com), and VMware (http://vmware.com).
    Each virtualization platform has historically supported its own virtualization
    format (e.g., Kernel Virtual Machine, Bare Metal, VMware VMDK), but there is also
    a movement to support an open virtualization standard that would enable easy interoperability
    among virtualization platforms. These solutions can be a valuable tool for libraries,
    but they often come with a requirement for technical infrastructure and expertise
    that commonly is not held by libraries.


    ## Cloud Computing and Virtualization in Libraries


    ![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_26_0.png)


    the parent organization rather than the library. This can mean that important
    IT decisions are made at an organizational rather than departmental level, including
    selection of server hardware, operating systems, and software stacks—all of which
    influence software selection in other areas of the organization. This situation
    has the potential to limit the IT solutions libraries can pursue when exploring
    new systems and can be frustrating as libraries adopt new digital services.


    At the same time, libraries are adopting systems that include large-scale data
    management components and are turning to a wider range of information service
    providers. Systems such as electronic resource management systems and recommender
    services are key examples of data-rich services being implemented in new Data
    as a Service (DaaS) solutions. For Breeding, this trend toward expanded services
    and new ILSs “addresses the fundamental changes that libraries have experienced
    over the course of the last decade or so toward more engagement with electronic
    and digital content” (2011a).


    ## Factors Influencing Service Choices


    The shift in IT implementation practices away from traditional in-house solutions
    to cloud-based, hosted, or outsourced solutions means that libraries must consider
    new issues when making IT selections. Fortunately, libraries have practice in
    working with contract negotiation, online service evaluation, data access and
    preservation, subscription pricing models, and network-based authentication practices
    from their experience in migrating to digital subscription-based research tools
    and e-journals (Zambare et al. 2009). This is particularly true in the case of
    library electronic content licenses, which often include assurances on technical
    elements of the service. Key aspects of the standard license terms for resources
    licensed by the California Digital Library, for example, include server availability
    and performance criteria, authentication and authorization practices, confidentiality
    and privacy policies, customer support provisions, and access to data criteria
    (Lavery 2010). Similar provisions in cloud computing and hosting licenses include
    SLAs; security and access provisions; data integrity guarantees; data export and
    migration support; and confidentiality, privacy, and legal indemnification policies
    (Zhou et al. 2010).


    Although libraries seeking to implement these new data-rich and network-centric
    services can benefit from being able to look outside traditional in-house IT solutions
    for hosting and platform support, they often find themselves exchanging one set
    of complications for another. New factors to be considered when evaluating a cloud-based
    service provider include security, confidentiality and privacy, legal liability,
    and organizational stability. Table 1.2 lists each of these categories along with
    common issues associated with them.


    **Table 1.2 Evaluation of Cloud Computing**


    | Evaluation category | Specific issues |

    |---|---|

    | Technology | Platform suitability, control, service stability, required expertise,
    fit with organizational goals |

    | Security | Adherence to authentication and authorization standards, suitable
    firewall provisions, fit with local authorization and authentication practices
    (SAS 70, ISO/IEC 27001) |

    | Privacy | Adherence to local, state, and federal regulations; impact of system
    structure/topography on privacy concerns (HIPAA, FERPA, Patriot Act) |

    | Legal | Domains of legal liability, data ownership provisions, data access provisions
    |

    | Organizational stability | Risk of organizational stability, structures for
    handling service in case of organizational failure |


    It is important to recognize that these technologies are still in their early
    stages and are defined more by “best-practice” approaches and less by accepted
    standards. In addition to NIST, organizations including the Cloud Security Alliance
    (https://cloudsecurityalliance.org), Open Grid Forum (www.ogf.org), Open Cloud
    Computing Interface (OCCI; http://occi-wg.org), and Organization for the Advancement
    of Structured Information Standards (www.oasis-open.org) are working on turning
    these best-practice approaches into industry standards. At this point libraries
    are likely to have to make choices with an understanding of the impact proprietary
    and nonstandard practices will have as they migrate to cloud solutions. Although
    libraries have historically worked with proprietary systems, the rapid deployment
    and migration that often accompanies virtualized and cloud services means that
    adherence to standards and practices that ensure data and service portability,
    as well as data backup and recovery, are considerations that need to be part of
    the discussion of cloud and virtualization adoption.


    ## Genres of Cloud-Based or Virtualized Information Services


    Cloud computing can be grouped into categories by service type (e.g., SaaS, PaaS,
    IaaS, DaaS), described using specific features (e.g., subscription, metered, scalable),
    and used in different deployment models (e.g., public, private, community, hybrid).
    As our initial exploration of these relationships shows, it can be difficult to
    compare IT systems from a functional perspective, let alone understand the implications
    of choosing an IT platform along with a system. In addition, libraries turning
    to outsourced and hosted solutions need to be prepared to evaluate the technological
    foundation of those services. Therefore, having a firm understanding of the basic
    functions of these cloud platforms is crucial in making an informed decision.


    Libraries support a wide range of information systems including ILSs, link resolvers,
    digital asset management systems (DAMS), websites, research guides, internal intranets,
    and archival information systems. Cloud computing works well for most libraries
    and library services, but the right balance of platform, deployment environment,
    and adoption goals naturally drives libraries toward different solutions. It can
