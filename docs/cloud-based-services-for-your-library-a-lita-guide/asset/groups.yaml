    how to weigh the positive and negative issues surrounding a platform. Some participants
    used their qualitative response to discuss a decision process or compare issues
    in this manner. For example, one library recognized the risk of vendor lock-in
    when moving to SaaS platforms but indicated that service efficiency outweighed
    the risk. Likewise, several libraries indicated interest in migrating but were
    moving slowly to be sure that they adopted a platform only after the market had
    tested its viability. Despite some rich exploration of organizational and environmental
    issues, there was little discussion of the roles of networked data, open data,
    or open-source software in making IT decisions. Likewise, security and privacy
    issues, though often represented as key concerns in the literature (Grant 2011,
    47; Velte et al. 2009, 35), were not discussed at the same level of specificity
    as technical and organizational issues. This emphasis may well be due to the population
    or the style of the questions, but it raises a good question about professional
    perceptions of legal, policy, and security concerns in virtualized and cloud computing
