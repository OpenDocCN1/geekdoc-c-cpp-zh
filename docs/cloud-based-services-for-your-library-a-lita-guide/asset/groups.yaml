    **埃里克·米切尔**是马里兰大学学院公园分校信息研究学院的助理教授。除了研究图书馆中信息技术的采用和使用外，埃里克还研究图书情报学中的元数据问题和专业发展。在加入马里兰大学之前，埃里克在维克森林大学Z.
    Smith Reynolds图书馆担任技术服务部助理主任，工作了十二年。在此期间，他协调了多种图书馆系统的开发、实施和管理，最近负责将Reynolds图书馆的IT服务迁移到基于云的平台。埃里克是*《网络图书馆学杂志》*的专栏作家，并就图书馆IT、元数据使用和教学方法发表过文章和演讲。他拥有北卡罗来纳大学教堂山分校的信息与图书馆学博士学位、南卡罗来纳大学的MLS学位以及Lenoir-Rhyne学院的文学学士学位。


