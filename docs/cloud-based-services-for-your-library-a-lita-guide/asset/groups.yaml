    # Community Virtualization/Cloud Providers


    Cloud hosting for library-specific applications is offered by commercial providers
    such as Equinox (http://equinox.com) and ByWater Solutions (http://bywaterwsolutions.com)
    and by nonprofit providers such as Lyrasis (http://lyrasis.org). Many of these
    providers support multiple systems and open-source platforms. This approach is
    also being explored by Amigos Library Services, which is piloting a virtualized
    deployment of the Koha open-source library system with partner libraries (www.amigos.org/node/837).
    The Amigos project is considering both the technical aspects of virtualized service
    hosting and the logistics of providing data migration and other ILS-specific services
    in a hosted environment. Another library cooperative, Lyrasis, provides support
