  mdcn: "\n云环境中，托管在组织内部的私有云或基于订阅的私有云（如亚马逊的虚拟专用服务器环境）是更稳健的选择。\n\n如果成本、用户隐私或其他问题超过了云提供商的预期收益，图书馆可能更希望使用专用物理服务器。希望在专用物理服务器上运行的图书馆也可以考虑购买硬件并支付订阅费以将硬件托管在数据中心的选择。这种方法通常提供更高级别的服务，可能包括额外收费的系统管理形式，但也使图书馆能够受益于数据中心的强大功能，如网络冗余、环境质量和异地备份冗余，同时不放弃拥有运行其网络服务的硬件的好处。如果图书馆采用了它们不熟悉的平台上的\
    \ IT 服务，这一点可能特别有吸引力。\n\n值得注意的是，Salesforce、Heroku 或 GoogleApps 等其他 PaaS 解决方案不包括在上述三种\
    \ PaaS 托管中。这些解决方案专注于支持高度定制化的信息服务，如客户管理、站点发布和内容管理，而无需承担服务器管理任务的开销。因此，这些功能比这里提到的以服务器为中心的解决方案更具可扩展性，但要求应用程序与托管环境之间更紧密的耦合。这些\
    \ PaaS 解决方案将在本章后面进行评述。\n\n在选择提供商时，重要的是查看每家公司的客观评价，并根据对您本地组织重要的要素来选择提供商。这些要素可能包括受支持的服务器软件、平台安全性、系统管理任务和\
    \ SLA 选项。图 4.2 提供了一个可用于比较 PaaS 提供商的初步清单。此外，比较这些解决方案的实际成本也很重要，考虑到某些提供商对系统备份、SSL\
    \ 支持和专用 IP 地址等服务额外收费，这一过程可能很困难（参见下文“服务成本”中的表 4.1）。\n\n## 问题\n\n尽管以服务器为中心的 PaaS\
    \ 解决方案为云计算提供了简单的入门途径，但它们可能无法在大型 IT 环境中良好扩展，因此可能给长期使用带来挑战。本节重点介绍相对可定制的 PaaS 服务器，这些服务器具有固定容量，并提供基于\
    \ Web 的管理\n\n## 图 4.2\nPaaS 服务器评估清单\n\n- 软件版本\n  - 数据库类型和版本\n  - 脚本语言类型和版本\n \
    \ - 安装其他脚本语言库的能力\n  - Web 服务器类型和版本 (Apache)\n- 系统管理\n  - 数据库备份类型\n  - 文件系统备份类型\n\
    \  - 数据恢复方法\n- 服务级别\n  - 正常运行时间保证\n  - 联系支持人员的方法\n  - 响应时间\n  - 支持 SLA 的基础设施（例如，冗余服务器、备份、可用区）\n\
    - 安全功能\n  - 提供商级防火墙支持\n  - 系统级防火墙支持\n  - 同一文件系统上存在其他用户\n  - 文件系统权限控制\n  - 创建/管理用户的能力\n\
    \  - 委派访问权限的能力\n\n工具和专门的客户支持。在下一节中，我们将探讨高度可扩展的平台栈（例如，Amazon Elastic Beanstalk、Heroku），这些平台栈放弃了服务器模型，转而采用应用程序托管框架。正如您所料，这两类\
    \ PaaS 平台面向不同的 IT 需求。例如，基于服务器的 PaaS 解决方案在通用 LAMP 环境中运行良好，在这种环境中，可扩展性不如访问具有某些自动化管理功能（例如，配置、备份、安全性）的应用程序栈重要。相比之下，基于应用程序的\
    \ PaaS 环境最适合高度定制的应用程序栈和开发环境。无论如何，这两种形式的基于服务器的 PaaS 解决方案都没有得到现成的图书馆信息系统的广泛支持。同样，固定的应用程序栈以及在某些情况下有限的管理访问权限可能会限制基于服务器的\
    \ PaaS 解决方案的潜在用途，并可能使其仅限于测试或小型生产部署。\n\n## 所需专业技能\n\n基于服务器的 PaaS 解决方案所需的专业技能差异很大，在很大程度上取决于所选的\
    \ PaaS 平台和所实施的服务。本节回顾了有效使用托管服务器型 PaaS 服务所需的首要技能。\n\n### 使用基于 Web 的控制面板\n\n基于 Web\
    \ 的控制面板旨在支持可在托管站点上管理的许多服务。两个最流行的平台是 Plesk (http://plesk.com) 和 cPanel (http://cpanel.com)，但还有其他许多解决方案。\n\
    \n### 理解 DNS\n\nDNS 是将服务器 IP 地址解析为主机名的方式。向 PaaS 提供商注册时，您可以选择建立新域名或将现有域名映射到您的服务器。对于作为较大机构一部分运营的图书馆，很可能需要与组织\
    \ IT 部门合作，将 PaaS 服务器的 IP 地址与组织管理的 DNS 服务器关联起来。为此，图书馆应选择在订阅中提供专用 IP 地址的 PaaS 提供商；仅当图书馆希望使用与较大机构相关的域名（例如\
    \ myschool.edu）而不是独立域名（例如 library.com）时，才需要这样做。DNS 是一个复杂的过程，包括创建子域、基于名称配置重定向流量以及支持\
    \ SSL 证书的能力。如果您的机构希望提供自己的 DNS 支持，可以在 Liu 和 Albitz (2006) 中找到关于 DNS 的很好的概述。\n\n\
    ### 理解服务配置\n\n基于服务器的 PaaS 环境所依托的支持使得安装、配置和部署应用程序变得更加容易。许多 PaaS 提供商支持一键安装常见的内容管理系统，如\
    \ WordPress 和 Drupal。虽然这些功能使您的网站更容易启动和运行，但同样重要的是了解这些应用程序的文件和数据库所在位置，并了解应用程序升级是如何处理的。尤其重要的是要了解托管提供商如何支持向流行的内容管理系统添加可选模块。这通常需要\
    \ SSH 和 SFTP 访问，以及设置用户权限、解压文件和在 Web 界面之外完成其他配置任务的能力。\n\n### 理解 SSH/SFTP\n\n要利用\
    \ PaaS 解决方案，需要 SSH 和 SFTP 来与您的服务器之间传输文件并与之交互。选择支持 SSH 和 SFTP 的提供商对于实现自动化、配置和资源传输非常重要。许多站点支持某种形式的\
    \ SSH，但在激活此服务之前还需要额外的安全措施。在选择提供商时，值得了解它是否支持多个 SSH 账户，以及是否有某种规定使用防火墙限制来限制可以 SSH\
    \ 到托管服务器的 IP 地址。\n\n### 理解数据库\n\nWeb 应用程序最重要的元素之一是其数据库。许多 Web 服务（如 WordPress 或\
    \ Drupal）需要特定的数据库平台，并可能需要与这些数据库进行手动交互。\n\n在选择提供商时，重要的是检查支持的数据库平台以及数据库版本和与应用程序平台的集成。同样重要的是了解您的\
    \ PaaS 提供商是否支持基于 Web 的数据库管理工具，例如 phpMyAdmin 或 phpPgAdmin (http://phppgadmin.sourceforge.net)。这些工具使配置、管理和备份数据库变得更加容易。了解\
    \ PaaS 提供商带来的大小限制、数据库实例限制、备份和恢复方法也很重要。除了这些技能之外，了解数据库设计、SQL 以及数据库与 Web 服务的集成对于应用程序开发至关重要。\n\
    \n### 管理防火墙\n\n基于服务器的 PaaS 解决方案的一个优势是它们提供提供商管理的安全、网络和操作系统更新。一个好的 PaaS 提供商应该防范拒绝服务攻击和权限方面的安全漏洞，并且默认情况下应阻止对服务器端口的访问。对于希望除了传统\
    \ Web 服务器（例如 Tomcat 或 SOLR）之外还实施服务的图书馆来说，管理服务器上打开的端口可能很重要。虽然可以通过主 Web 服务器端口（端口\
    \ 80）提供对这些其他服务的访问，但在 PaaS 环境中可能无法进行配置。在这些情况下，在控制面板中访问某种形式的防火墙控制是很有用的。在控制面板界面中管理防火墙规则比直接在服务器上管理它们容易得多。这带来了额外的好处：尽管错误应用的规则可能会阻止对服务器实例的访问，但不太可能阻止您访问管理控制面板。相比之下，在\
    \ IaaS 环境中管理的防火墙服务可能更加困难，并且在激活之前更需要测试。\n\n## 服务复杂性、可持续性和持久性\n\n由于 PaaS 解决方案提供技术支持并简化了\
    \ Web 托管服务的实施和管理，它们最适合简单的基于 Web 的服务，例如图书馆网站、内容管理服务和定制 Web 服务。鉴于其技术栈通常有限且环境大多受管，基于服务器的\
    \ PaaS 环境通常无法作为复杂服务的托管环境，也可能无法很好地服务多个应用程序。提供商可能不允许 root 用户访问，并且只支持定期执行的自动化任务。因此，基于服务器的\
    \ PaaS 环境仅能提供有限的图书馆 IT 容量扩展能力。此外，虽然通常提供无限带宽和磁盘容量，但它们往往带有限制，阻止安装图书馆专用软件，如 Koha、Evergreen、DSpace\
    \ 或 Fedora。\n"
