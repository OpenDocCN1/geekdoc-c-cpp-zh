    发现云计算的整体采纳率（81%）远高于包含图书馆云计算使用评估的已发表研究。例如，《图书馆资源指南》关于图书馆资金优先事项的报告发现，2011 年图书馆的整体云计算采纳率为
    7%，2012 年为 12%（McKendrick 2012）。相比之下，我们发现采纳率超过 90%。


    《图书馆资源指南》调查还发现，图书馆倾向于不将 IT 作为节省开支的手段；只有 13% 的受访者表示他们将在 2011 年减少 IT 支出，2012 年为
