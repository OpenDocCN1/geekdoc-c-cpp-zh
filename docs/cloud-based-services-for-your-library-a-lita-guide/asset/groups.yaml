    ## 服务复杂性、可持续性与持久性


    SaaS 解决方案常被选中的原因在于，它们能以简单的管理要求提供功能强大的服务。通过将系统正常运行时间、持久性、安全性和升级的责任转移给供应商，图书馆无需再自行管理这些任务。SaaS
    系统最大的复杂性来源往往在于尝试连接多个系统和供应商，或尝试实施利用某项 SaaS 服务能力的新服务。在这种情况下，可能有必要编写数据转换或传输应用程序，而这些应用程序本身也会带来复杂的问题。


    SaaS 服务的另一个关键优势在于，提供服务的供应商会保证其持久性。这方面的一个主要风险是服务的可持续性，以及图书馆在采用最终消失的 SaaS 服务时可选择的范围有限。尽管付费服务中这种情况较少见，但免费服务经常变更条款或功能，有时甚至彻底消失。因此，图书馆在采用那些无法保证长期稳定性或仍处于开发阶段的
    SaaS 服务时应保持谨慎。


    ## 服务成本


    由于 SaaS 服务通常具有较长的订阅期限（例如按年计算而非按月计算），计算 SaaS 服务的成本和投资回报率（ROI）可能比 PaaS 和 IaaS 服务更容易。然而，由于难以识别隐性成本或软性成本，将
    SaaS 服务的成本与 PaaS、IaaS 及其非虚拟化同类服务进行比较可能会很困难。不过，图书馆很可能具备处理这类订阅模式的专业经验，应当能够预测多年期的成本。这种长期成本预测有助于图书馆判断
    SaaS 解决方案是否比其他替代方案更合适。


    ## 服务可移植性与互操作性


    SaaS 解决方案与其他系统集成的能力在很大程度上取决于这些系统所具备的功能。在规模较大的、面向图书馆的 SaaS 供应商中，实施可访问数据和后端服务元素的
    API 已越来越普遍。从 SaaS 解决方案迁移出去可能很困难，因为如果组织已经失去（或从未拥有）处理相关数据的能力，获取和管理与该服务关联的数据的过程就会变得更加困难。


    ## 使用传统服务器型托管的 PaaS


    PaaS 为寻求定制解决方案的图书馆提供了实施基于 Web 的服务的机会，而无需了解系统管理的复杂内部运作。传统的 PaaS 解决方案提供不同级别的 IT
    系统访问权限，并且往往具备某种形式的 LAMP（Linux、Apache、MySQL 和 PHP）支持。使用传统服务器托管平台的 PaaS 倾向于自动化系统管理，但通常不提供专用服务器访问权限、root
    访问权限，也无法安装新的系统级工具（例如数据库平台、脚本语言）。因此，应仔细评估 PaaS 解决方案，以确保其支持的服务符合要求，并提供系统备份支持、在供应商层面有足够的安全措施，且使用该服务不会引发隐私或数据所有权问题。


    本节介绍的服务器式解决方案与其他 PaaS 解决方案的不同之处在于，它们侧重于提供有限的计算能力和存储空间，但提供相对广泛的 IT 服务。这些服务通常包括数据库管理、防火墙保护、域名系统（DNS）解析、电子邮件托管以及其他核心
    IT 服务。这些基于服务器的解决方案提供图形化管理界面（例如 cPanel）平台，简化了 Web 服务（例如 WordPress、数据库应用、自行开发的 PHP、Perl
    或 Python 应用）的实施和管理。这些解决方案通常基于某种 LAMP 环境或其他常见的 Web 应用框架（Ruby on Rails、Python/Django）。这些解决方案提供了强大的
    IT 框架，最适合网站托管和定制应用，但也可用于运行更复杂的应用，例如小规模图书馆目录、DAMS（数字资产管理系统）以及其他图书馆特定服务。这些解决方案可分为三种类型：共享
    Web 托管、虚拟专用服务器托管和专用服务器托管。每种类型都有其优势和劣势。


    ### 服务类型与供应商


    PaaS 供应商为网站托管、内容管理系统托管、利用特定资源开发 Web 服务，以及临时将系统用于开发或其他单一用途提供了良好的环境。商业供应商包括 DreamHost
    (http://dreamhost.com)、HostMonster (http://hostmonster.com) 和 BlueHost (http://bluehost.com)，以及专为图书馆环境运行的服务，如
    LISHost。这些系统对于中小型图书馆、初次探索虚拟化计算的图书馆，以及希望为拥有 IT 技能但时间有限的员工赋能的图书馆尤其有用。PaaS 服务器供应商使用的图形控制面板简化了配置任务，消除了承担基础设施级
    IT 管理任务（如操作系统维护、硬件管理和 LAMP 栈维护）的必要。同时，它保留了配置后端应用的能力。然而，并非每个供应商都提供这些功能，而且服务和选项的差异可能使选择供应商变得困难。


    总体而言，重要的是关注所需功能（例如托管功能、账户/数据隐私、服务器位置和数据中心质量、有保障的容量以及公司的长期生存能力），并选择适合这些需求的解决方案。PaaS
    服务器供应商可能会过度销售容量，向客户保证“无限数据和带宽”，但这些保证通常附带限制内容或托管服务的警告和约束（例如不允许流式传输视频、不提供长期对象存储），从而降低了这些功能的价值。低成本
    PaaS 供应商往往避免严格的 SLA 协议，但可能会提供“服务级别说明”，其中不包含停机补偿条款，也不对正常运行时间作出任何硬性保证。价格较高的 PaaS
    供应商则支持详尽的 SLA，将服务器访问权限扩大到更高级别的管理访问（例如 root 或超级用户访问），并且不倾向于过度销售容量，而是向订阅者租用特定数量的磁盘空间、CPU
    容量和应用内存。以下三节将更详细地探讨三大类 PaaS 供应商。


    ### 共享虚拟服务器


    共享虚拟服务器使您能够在虚拟化平台上获得预留的存储资源。这些供应商可能会提供“无限”磁盘空间和带宽，但对其 SLA 的审查表明，磁盘空间仅限于为托管在该服务器上的
    Web 服务提供支持，并且不包括用于文件服务的备份或存储。此外，这些供应商可能会限制 CPU 使用，且不保证可用内存，因此这些解决方案最适合网站服务、小规模数据库托管或其他不消耗大量
    CPU 或 RAM 的服务。由于这些特点，共享虚拟服务器在 PaaS 环境中风险最高，但成本最低。在共享虚拟服务器环境中，可能难以确定数据中心的稳健性或地理位置/法律位置，而且这些环境中的访问权限通常仅限于基于
    Web 的控制面板或 SSH。


    ### 专用虚拟服务器


    专用虚拟服务器是用户账户拥有独占访问权的服务器。专用虚拟服务器可能拥有基于 Web 的管理控制台，并且更有可能允许对系统进行大量访问，以更改应用程序配置和版本。同时，专用虚拟服务器通常由托管公司在操作系统层面进行管理，并提供定制支持，包括教程、指南，甚至实时协助。专用虚拟服务器包含
    CPU、内存和磁盘空间分配，并具有共享虚拟服务器环境所不具备的用户隔离级别。与共享虚拟服务器环境一样，应充分了解专用虚拟服务器环境的安全性、隐私性、复制和管理功能。在专用虚拟服务器环境中运行所带来的法律和技术风险意味着，供应商必须具有自动故障转移能力，以确保专用虚拟服务器不依赖于特定硬件。


    专用虚拟服务器环境能够运行小规模的图书馆特定应用程序，但对于需要大量内存和磁盘存储的发现服务或 DAMS 服务而言，可能规模过小。专用虚拟服务器环境最适合那些在共享虚拟服务器环境中托管无法满足其特定需求，但又不想承担专用服务器或
    IaaS 解决方案所带来的成本或专业知识的图书馆。


    ### 专用物理服务器


    与本书讨论的其他云计算和虚拟化模型相比，专用物理服务器更接近托管数据中心模式。许多供应商提供专用物理服务器，作为寻求更大容量或隔离性但在托管环境中运行的组织的一种替代方案。这种管理级别可能包括基于
    Web 的控制面板和机器的超级用户访问权限，并且其容量确实比专用虚拟服务器更高。物理隔离很可能也伴随着虚拟网络隔离，因此数据中心中的其他客户无法访问自己的服务器。如果对安全性和隐私性有重大担忧，这可能是一个优势，但这些优势很可能被与绑定到特定
    IT 硬件相关的风险所抵消。对于寻求在 IaaS 中获得物理隔离优势的组织


