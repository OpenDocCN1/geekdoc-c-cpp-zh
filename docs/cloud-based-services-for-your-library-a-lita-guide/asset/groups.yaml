    ## CONCLUSION


    This survey of virtualization, cloud computing, and outsourcing adoption in libraries
    both underscores the current interest in cloud computing and virtualization and
    demonstrates which views are prevalent among adopters. The gaps found between
    library and IT literature and survey participants indicate that the questions
    about cloud computing and virtualization may be different for different audiences
    or perhaps are shifting as cloud computing matures. The survey also demonstrates
    a growing reliance on outsourced library IT as opposed to PaaS or IaaS approaches
    and indicates a slow but growing trend to migrate older and core library systems
    (e.g., the ILS) to these environments. These survey results should not be overgeneralized,
    but the evaluative model represented in figure 2.1 and the grouped themes presented
    in tables 2.4 and 2.5 may help libraries understand their own IT environment in
    more detail.


