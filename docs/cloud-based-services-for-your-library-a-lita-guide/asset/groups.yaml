    ## The Landscape of Cloud Computing and Virtualization Adoption


    Libraries are at a crossroads in IT adoption because of rapid changes in purchasing,
    collection development, information management, and public service expectations
    (Attis et al. 2012). These changes have been accompanied by changing approaches
    to metadata standards, authority control, and information management systems (Seikel
    and Steele 2011). The shift in IT environments has included the proliferation
    of systems for different services (e.g., digital reference, resource management,
    digital libraries) and an emergence of new vendor and open-source community services
    that are virtualized, hosted, or cloud-based (Breeding 2011). In particular, LIS
    vendors are redefining their services to leverage cloud computing in the “next-generation”
    of LIS systems. In addition to the vendor-driven shift of the ILS to the cloud,
    libraries are turning to cloud computing to address a wider range of information
    system needs.


    Much of the research in library adoption of cloud computing focuses on specific
    uses or platforms. For example, Malpas (2011) explored the role of cloud computing
    in large-scale digital text collections and Schonfeld and Housewright (2010) explored
    the impact of “network-scale” learning and resource use on academic teaching and
    scholarship. Both studies found a growing reliance on network-based technologies
    and Internet-accessible digital text collections by both academic libraries and
    their constituents. Some research has focused on how to incorporate cloud computing
    into IT planning (Reeves 2010), and academic institutions are increasingly incorporating
    virtualized technologies in strategic plans (Furman University 2011). In addition
    to organization-focused studies,

