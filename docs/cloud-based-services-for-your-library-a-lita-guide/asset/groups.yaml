    ## Windows Azure


    Windows Azure 是 Microsoft 提供的 PaaS 和 IaaS 服务，专注于面向 Web 服务的 Windows 平台（图 4.7）。而其他审查的平台倾向于平台无关的方法，但强调包括
    Tomcat、Apache 和 Nginx 在内的 Web 服务器，Windows Azure 提供对 .NET 框架、Microsoft SQL Server
    和 ASP.NET 应用程序的支持。服务使用 Microsoft 的 Internet Information Server 平台托管。


    与其他服务一样，Windows Azure 支持负载平衡、数据库集成、应用程序版本管理和开发环境集成。与 Heroku 不同，Windows Azure 具有持久的数字对象存储，使其成为许多
    PaaS 提供商支持的 Amazon S3 平台的替代方案。Windows Azure 还提供对 SaaS 开发和部署的支持


