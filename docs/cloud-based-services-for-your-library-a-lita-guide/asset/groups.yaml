    # Factors Influencing Service Choices


    The shift in IT implementation practices away from traditional in-house solutions
    to cloud-based, hosted, or outsourced solutions means that libraries must consider
    new issues when making IT selections. Fortunately, libraries have practice in
    working with contract negotiation, online service evaluation, data access and
    preservation, subscription pricing models, and network-based authentication practices
    from their experience in migrating to digital subscription-based research tools
    and e-journals (Zambare et al. 2009). This is particularly true in the case of
    library electronic content licenses, which often include assurances on technical
    elements of the service. Key aspects of the standard license terms for resources
    licensed by the California Digital Library, for example, include server availability
    and performance criteria, authentication and authorization practices, confidentiality
    and privacy policies, customer support provisions, and access to data criteria
    (Lavery 2010). Similar provisions in cloud computing and hosting licenses include
    SLAs; security and access provisions; data integrity guarantees; data export and
    migration support; and confidentiality, privacy, and legal indemnification policies
    (Zhou et al. 2010).


    Although libraries seeking to implement these new data-rich and network-centric
    services can benefit from being able to look outside traditional in-house IT solutions
    for hosting and platform support, they often find themselves exchanging one set
    of complications for another. New factors to be considered when evaluating a cloud-based
    service provider include security, confidentiality and privacy, legal liability,
    and organizational stability. Table 1.2 lists each of these categories along with
    common issues associated with them.


    It is important to recognize that these technologies are still in their early
    stages and are defined more by “best-practice” approaches and less by accepted
    standards. In addition to NIST, organizations including the Cloud Security Alliance
    (https://cloudsecurityalliance.org), Open Grid Forum (www.ogf.org), Open Cloud
    Computing Interface (OCCI; http://occi-wg.org), and Organization for the Advancement
    of Structured Information Standards (www.oasis-open.org) are working on turning
    these best-practice approaches into industry standards. At this point libraries
    are likely to have to make choices with an understanding of the impact proprietary
    and nonstandard practices will have as they migrate to cloud solutions. Although
    libraries have historically worked with proprietary systems, the rapid deployment
    and migration that often accompanies virtualized and cloud services means that
    adherence to standards and practices that ensure data and'
