    fit with your library. There are several ways to approach this discussion, but
    two models in particular inform organizational understanding of technology adoption:
    the “technology acceptance model” (TAM; Davis 1989) and the “technology, organization
    and environments model” (TOE; Tornatzky et al. 1990). These models provide frameworks
    for understanding the relationship between technologies and their use by individuals
    or organizations. Another model often used in technology adoption studies is “diffusion
    of innovation theory” (Rogers 2003), which explores technology adoption by examining
    factors including advantage, compatibility with other systems, and system complexity
    and focuses on qualifying adoption patterns. In contrast, the TOE and TAM models
    explore factors that influence technology adoption and more directly speak to
    the types of organizational decision making that are key in library IT decisions.


    These models take somewhat different approaches to understanding technology adoption.
    The TAM model explores the natural tension between the perceived usefulness and
    ease of use of technologies. In contrast to TAM’s perception-based model, the
    TOE model examines various contexts that influence technology adoption (e.g.,
    organizational and environmental). These two perspectives help shed light on factors
    that influence individual and organizational assessment of the value of technologies
    (e.g., ease of use, perceived value, social context, organizational values). Specifically,
    the TAM model provides a structure for understanding the individual, social, and
    technological context surrounding technology adoption. In contrast, the TOE model
    provides a framework for understanding the interaction of organizational, technological,
    and external (to the organization) factors.


    Previous studies have also used these models to explore cloud adoption in educational
    and technology environments. For example, the TAM model has been used to examine
    the factors that influence cloud computing adoption in community college systems
    (Behrend et al. 2011), and the TOE model has been used to explore the organizational
    factors that influence the adoption of technology in different contexts (Daylami
    et al. 2005). The inclusion of both models helps frame the research in terms of
    the participant’s perceptions of cloud computing and situates their use of cloud
    computing within the organization. The analysis of survey responses looked for
    elements of each model, including personal views of ease of use/value (i.e., TAM)
    and personal views of environmental, organizational, and technical factors (i.e.,
    TOE) in relation to four computing platforms. Figure 2.1 shows the coding framework
    that was used in this survey.


    |  | Non-virtualized | Internal/private cloud virtualized | Public/community cloud
    virtualized | Outsourced |

    |---|---|---|---|---|

    | Personal views (e.g., perceived value, ease of use) |  |  |  |  |

    | Environmental influence (e.g., industry support, professional standards, community
    needs) |  |  |  |  |

    | Organizational influence (e.g., privacy, legal, financial perspective, staff
    expertise, service focus) |  |  |  |  |

    | Technical influence (e.g., technical capacity to address service need, technical
    fit with organizational goals) |  |  |  |  |


