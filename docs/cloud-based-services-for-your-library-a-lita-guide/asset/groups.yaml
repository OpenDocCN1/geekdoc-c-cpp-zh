    ## 材料组织


    第1章定义了虚拟化和云计算，考察了这些平台的具体解决方案，并讨论了一些平台采用的常见方法。本章考察了云计算模型，并利用这些模型为本书其余部分的讨论奠定基础。


    第2章报告了图书馆虚拟化和云计算采用情况调查的结果。调查于2011年秋季进行，数据使用技术采用模型进行分析。本章的发现为本书其余部分中用于考察具体云计算解决方案的模型提供了实证基础。


    第3章详细探讨了与IT采用相关的因素和问题。本章按技术、组织和环境因素分组，并引导读者进行系统评估和实施规划。本章还包括对IT服务管理在系统设计中作用的重点关注。


    第4章考察了与图书馆信息系统相关的软件即服务（SaaS）和平台即服务（PaaS）解决方案。本章包括相关技术概念概述、使用SaaS的信息系统的探索，以及影响这些服务决策的因素的考察。


    与第4章类似，第5章考察了云服务，但特别关注基础设施即服务（IaaS）和多平台解决方案。本章包括相关技术概念概述、使用IaaS的信息系统的探索，以及影响这些服务决策的因素的考察。


    第6章回顾了本书中探讨的模型和第4章和第5章中考察的系统，并提出了四种可用于系统设计的通用模型：一个完整的SaaS环境、一个纯IaaS环境，以及两种探索混合模型方法创建的模型。本章以将云计算和虚拟化纳入您的IT环境的建议作结。


    ## 致谢


    撰写本书的动机始于这样一个想法：图书馆的最佳服务方式是其IT采用速度和灵活性与服务需求相匹配。在探索如何利用云计算实现这一目标时，我依靠了我的同行图书馆员的知识、IT专家的
    know-how 和耐心，以及Wake Forest大学Z. Smith Reynolds图书馆同事的支持。特别感谢Tim Mitchell、Kevin Gilbertson和Barry
