    # Chapter Three


    SaaS and PaaS platforms but also a reevisioning of the structure of these systems
    including changing approaches to bibliographic and other data management and a
    focus on data and service interoperability. In evaluating these systems libraries
    must understand both the IT service and functional implications of their decisions.
    In addition, as libraries adopt or migrate to cloud-based platforms, new issues
    such as service quality and service-level agreements (SLAs) and new takes on traditional
    issues such as vendor lock-in and system functionality need to be considered.


