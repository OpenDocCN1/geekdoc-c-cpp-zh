    # Interpreting Contracts


    Interpreting a cloud computing contract may involve a new area of expertise for
    IT staff. As always, consulting legal counsel, collections management, or administrative
    staff can be helpful. Some key areas to focus on in SLAs and terms of service
    include these:


    +   - Duration of contract and termination procedures: What constitutes subscription
    and termination? How are renewals handled?

    +   - Payment methods: What payment methods are supported, and what payment terms
    are extended? What is the procedure for termination if payment lapses?

    +   - Legal jurisdiction: What jurisdiction and laws apply to the contract, and
    what limits are placed on issues of arbitration and liability?

    +   - Indemnification, warranty, and service assurance: What warranties does the
    provider agree to and how do these assurances relate to the SLA? What liabilities
    does the provider recognize?

    +   - Privacy policy: Under what conditions are customer data made available to
    external organizations?

    +   - Data ownership and retention upon service discontinuation: Who owns data
    located on the cloud service, and what happens to that data when the service agreement
    is discontinued?

    +   - Service integrity: What does the provider define as a complete service,
    and how does it assure that its service remains operational?

    +   - Data disclosure and service monitoring: Does the provider regularly disclose
    data regarding customers? Does it monitor traffic, stored data, or processes?

    +   - Data and service location: Where are the data housed by the cloud provider
    physically located? What implications does this have for your organization’s adherence
    to organizational policy and legal regulations?


    A thorough exploration of these topics would easily fill a chapter, but good resources
    include policy papers by Jaeger et al. (2008, 2009) and Bradshaw et al. (2010).'
