    # Things to Look for in a PaaS Contract


    Understanding service contracts for PaaS providers is of particular importance
    because one''s web applications depend on the hardware, software, and IT management
    services provided by the hosting company. Searching for the following items in
    provider SLA and license agreements may help guide platform selection:


    +   **System uptime:** What system uptime is assured or indicated? Are there specific
    guidelines or restrictions to this assurance? Are there contractual dependencies?


    +   **Service features:** What IT services are provided? Are there restrictions
    to specific services (e.g., SSH access)? Does the provider specify a means for
    managing software versions, dependencies, and other platform-specific functions?


    +   **Data ownership and privacy:** Does the provider give any assurance of data
    ownership or system isolation? Is the service located on its own hardware, or
    is it shared with other subscribers? Does the provider have policies regarding
    the monitoring of subscribers? What legal recourse is provided for subscribers
