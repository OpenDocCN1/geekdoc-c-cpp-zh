    # Service Cost


    Table 5.2 shows the projected cost of an Amazon service running all applications
    on a medium-size server (2 GB RAM, 410 GB instance storage, 100 GB permanent storage,
    2 CPUs), a MySQL database running on the Amazon RDS service, and the required
    backups and estimates for data transfer (150 GB per month). To save resources
    the application server could be configured using the Amazon CloudFormation service
    and monitored using Amazon and free instance-monitoring tools.


    This level of architecture, though not as robust as other solutions, capitalizes
    on economies of scale with monitoring, auditing, and configuration services within
    the Amazon cloud and preserves the ability to launch highly customized information
    platforms. Tables 5.3 and 5.4 provide a high-level cost estimate for Linode and
    Rackspace running two servers (one database server, one application server) with
    the same levels of storage space.


    Amazon’s reserved instance configuration is the cheapest ($1,626), but it comes
    with the longest agreement—a one-year server reservation. Although the reservation
    does not require that you run the service, it does lock you into server types.
    Amazon does have a marketplace in which subscribers can purchase and sell reservations,
    offering opportunities to purchase and sell instances with other Amazon customers.
    In contrast, Rackspace is much cheaper than Amazon for on-demand resource costs
    and is a good fit for short-term capacity. It is worth noting that Linode and
    Rackspace, though more expensive, do come with built-in customer support levels
    that fall under “premium” support contracts with Amazon.


