    在研究和撰写本书的过程中，我依靠了会议研讨会参与者和在线图书馆社区成员的专业知识和反馈，包括Code4Lib和LITA。感谢你们的新想法和技术建议。还要感谢采用调查的参与者，他们为我提供了对图书馆云采用情况的更广泛理解。我也有机会与全国各地的社区谈论我的工作，并感谢他们倾听和反馈的慷慨。特别感谢我的编辑Marta
    Deyrup，她的耐心和指导使本书在变化的世界中不断推进，以及将本书付印的Neal-Schuman团队。还要感谢马里兰大学信息学院的同事们，他们在我开始职业生涯新篇章时帮助我保持写作。最后，如果没有Jeffery
    Loo的启发和支持，我不可能写出这本书，他的指导、乐于助人的能力以及从一堆想法中创造出深刻结论的非凡能力使本书成为现在这个样子。


    ## 图书馆中的云计算和虚拟化


    图书馆采用云计算是图书馆创新更大趋势的一部分，这种趋势正在改变图书馆分配财务、IT和人员资源的方式。这种转变既受图书馆运营其他领域的驱动，也在影响这些领域，包括编目和元数据管理、数字信息服务、社区对信息空间的贡献以及数字馆藏管理。与所有这些趋势一样，云计算和虚拟化不仅可以从根本上改变图书馆提供服务的方式，还可以改变它们定义核心和增值功能的方式。正如图书馆将互联网作为公共服务交付改变了馆员对图书馆的看法一样，网络化书目数据的新趋势、对数字参考服务日益增长的需求以及电子馆藏的出现再次改变了服务及其交付方式。这些变化促使图书馆寻找方法使信息技术更高效、更广泛地渗透到图书馆运营中，并在不断变化的环境中更具灵活性。云计算及其父技术——虚拟化——正在帮助图书馆将其服务和馆藏塑造为实现这些目标，并如本书所示，为图书馆带来独特挑战和机遇。


    这些技术带来的机遇对图书馆来说是独特的，因为图书馆本身与其他信息机构不同。图书馆在公共服务和文化保存之间取得平衡。它们通常在上级组织的管辖下运作，并且经常发现自己在地方技术、预算和运营


    限制的背景下运作。图书馆经常许可或购买服务，其唯一目的是以最有效和最以客户为中心的方式提供它们。正如没有一种类型的图书馆一样，图书馆转向虚拟或基于云的服务也没有单一原因。也许最常见的动机来自资源限制或对新颖创新服务的兴趣。有时它来自于希望提供高质量的信息服务，这些服务超越了本地IT基础设施或专业知识的能力。在这些方法中，图书馆正在拥抱初创组织的精神，适应不断变化的商业模式，对服务部署采取“永久测试版”方法，关注服务不足的人群和机会，并将资源转向成功的实验。


    在过去二十年里，图书馆服务越来越依赖于基于互联网的技术。虽然对图书馆用户有利，但将互联网和其他计算资源与传统图书馆服务一起交付越来越难以为继（Bertot
    et al. 2011）。为了在IT丰富服务的基础上构建并以新的方式覆盖多元化人群，图书馆正在尝试社交媒体和移动应用程序（Blowers 2010），寻求服务的新的IT平台（Schrier
    2011），将传统系统迁移到基于云的环境（Breeding 2011b; Fitzpatrick 2010），使用基于云的服务来吸引学生群体（Behrend
    et al. 2011），并研究包括网络规模信息系统在内的数字图书馆的新方法（Kimpton and Baker 2011）。


    ## 云计算和虚拟化概述


    云计算和虚拟化是互补技术，虽然技术上非常不同，但通常被视为解决共同问题相似的方法。本书考察这两个概念，因为决定将IT服务虚拟化或部署在云环境中的决定归结为服务规模、组织因素或机构能力问题，而不是技术本身的问题。例如，虽然许多图书馆选择外包链接解析服务，但图书馆如果有复杂的内部数据需求，这些需求不符合托管OpenURL服务提供商的数据模型，则通常会在内部运行此服务。这一例子指出了一个现实问题，需要在本书记载之初就注意——图书馆经常讨论外包和托管


