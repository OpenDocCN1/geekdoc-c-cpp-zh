    ## 虚拟化


    与云计算相比，虚拟化被定义为“以掩盖 IT 资源的物理性质和边界的方式对 IT 资源进行抽象，使其对资源使用者不可见”（Gartner，2011）。虚拟化能够在共享硬件平台上创建多个虚拟机；增强机器之间
    CPU、内存和存储分配的灵活性；并设计为可跨硬件平台移植（Smith 和 Nair，2005）。这是一个广义的定义，包括服务器、客户端、网络附加存储以及许多其他计算资源的虚拟化。常见的服务器平台包括
    Xen（http://xen.org）、Citrix（http://citrix.com）和 VMware（http://vmware.com）。每个虚拟化平台历来都支持自己的虚拟化格式（例如内核虚拟机、裸机、VMware
    VMDK），但也有人倡导支持开放虚拟化标准，以实现虚拟化平台之间的轻松互操作。这些解决方案对图书馆来说可能是有价值的工具，但它们通常需要图书馆通常不具备的技术基础设施和专业知识。


    ## 图书馆中的云计算与虚拟化


    ![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_26_0.png)


    上级组织而非图书馆。这可能意味着重要的 IT 决策是在组织层面而非部门层面做出的，包括服务器硬件、操作系统和软件栈的选择——所有这些都会影响组织其他领域的软件选择。这种情况有可能限制图书馆在探索新系统时可以采用的
    IT 解决方案，并且在图书馆采用新的数字服务时可能令人沮丧。


    与此同时，图书馆正在采用包含大规模数据管理组件的系统，并转向更广泛的信息服务提供商。电子资源管理系统和推荐服务等系统是在新的数据即服务（DaaS）解决方案中实施的数据丰富服务的关键示例。对于
    Breeding 来说，这种向扩展服务和新 ILS 发展的趋势“回应了图书馆在过去十年左右经历的向更多电子和数字内容参与的根本性变化”（2011a）。


    ## 影响服务选择的因素


    IT 实施实践从传统的内部解决方案转向基于云的、托管的或外包的解决方案，这意味着图书馆在做出 IT 选择时必须考虑新的问题。幸运的是，图书馆在向基于数字订阅的研究工具和电子期刊迁移的过程中，积累了许多经验，涉及合同谈判、在线服务评估、数据访问和保存、订阅定价模型以及基于网络的认证实践（Zambare
    等，2009）。这在图书馆电子内容许可的情况下尤其如此，这些许可通常包含对服务技术要素的保证。例如，加州数字图书馆许可的标准许可条款的关键方面包括服务器可用性和性能标准、认证和授权实践、机密性和隐私政策、客户支持条款以及数据访问标准（Lavery，2010）。云计算和托管许可中的类似条款包括
    SLA；安全和访问条款；数据完整性保证；数据导出和迁移支持；以及机密性、隐私和法律赔偿政策（Zhou 等，2010）。


    尽管寻求实施这些新的数据丰富且以网络为中心的服务，图书馆可以通过在传统内部 IT 解决方案之外寻找托管和平台支持而受益，但它们常常发现自己是在用一种复杂性换另一种复杂性。评估基于云的服务提供商时需要考虑的新因素包括安全性、机密性和隐私性、法律责任以及组织稳定性。表
    1.2 列出了这些类别中的每一个以及与之相关的常见问题。


    **表 1.2 云计算评估**


    | 评估类别 | 具体问题 |

    |---|---|

    | 技术 | 平台适用性、控制、服务稳定性、所需专业知识、与组织目标的一致性 |

    | 安全 | 是否符合认证和授权标准、适当的防火墙规定、与本地授权和认证实践的一致性（SAS 70、ISO/IEC 27001） |

    | 隐私 | 是否符合地方、州和联邦法规；系统结构/拓扑对隐私问题的影响（HIPAA、FERPA、爱国者法案） |

