  - '[PAGE 141]


    configuration services so that IaaS platforms can plug into a robust IT infrastructure.
    These services, including RightScale, Cloudability, and Monitor.Us, do have free
    service levels, though organizations managing several servers likely need to commit
    to a premium service level. A complicating factor in this area is that the library
    IT vendor community as a whole is not included as auditable services in these
    providers. Despite the inability to audit security and cost for these providers,
    it is still possible to monitor service uptime and integrate access rules into
    an IT management system.


    By approaching cloud services without focusing on using them as you would traditional
    servers, it becomes possible to leverage cloud resources in new ways. For example,
    instead of running dedicated servers for database, web, and other services, consider
    employing a database or web service that features built-in redundancy and multizone
    availability. Amazon’s RDS, for example, features numerous cloud-based advantages
    including continuous data protection, automatic multizone redundancy, and automatic
    management. There are costs associated with running an RDS instance (essentially
    a small server instance), and your library must run an RDS instance for each database
    platform required (e.g., MySQL or Oracle), but the quality and stability of the
    database service can ultimately lead to lower costs and higher quality of service
    overall.


    # Issues


    Although a holistic or enterprise-level approach solves some of the issues raised
    by SaaS, PaaS, and IaaS solutions, it also raises issues of its own. First, a
    multizone or multiplatform solution is likely to be more expensive than other
    solutions. A multiplatform solution scales very well for small, medium-sized,
    and large libraries running multiple platforms and application bundles but leads
    to an overall more complex system with more cost.


    Taking a multiplatform approach also requires a high level of IT expertise that
    may not be common in even dedicated IT organizations. This requirement can be
    mitigated through the use of SaaS providers for monitoring, auditing, and configuration
    services but, as with PaaS solutions, adopting a prebuilt infrastructure means
    that staff must develop expertise in these systems. And though this is a significant
    issue, it is important to remember that this expertise may lead to cost savings
    in other areas. By leveraging SaaS infrastructure services to enable the use of
    PaaS and IaaS platforms, IT organizations can more closely tune platform cost
    and scale to the information service. For example, implementing an open-source'
  - '[PAGE 142]


    DAMS in an IaaS environment may be less expensive and offer more future migration
    options than going with SaaS options. Similarly, though the cost of IaaS solutions
    may appear high for the first service, with proper use of management tools organizations
    can adopt multiple IaaS-based services at a much lower cost and with less organizational
    fragmentation than adopting multiple SaaS services.


    # Expertise Required


    In addition to requiring the skills discussed in the previous sections, personnel
    expecting to really capitalize on cloud services using IaaS resources need to
    understand fully system architecture in the cloud. This means understanding how
    to configure servers automatically, how to set up load balancing services, and
    how to set up durable database and storage services while capitalizing on creating
    disposable servers. Coming up with a distributed and durable cloud architecture
    may seem overwhelming at first, but there are a variety of documented models and
    setup scripts discussed by the providers discussed in this chapter. In addition,
    there are valuable case studies from companies such as SlideShare (Mayank 2011)
    and Netflix (Cockcroft et al. 2011) that discuss the process of regular testing
    of infrastructure to ensure that the cloud environment is durable and secure.


    # Service Complexity, Sustainability, and Durability


    Though IT services in this environment are necessarily complex, the tradeoff for
    simpler ongoing server management is worth noting. For example, institutions that
    can turn to a hosted database service (e.g., Amazon RDS) can offload the work
    required to ensure high-quality uptime for their database services. This may lead
    to a more complex configuration but also pays off in the form of operational simplicity.
    For libraries seeking to make IT management an ongoing operation that persists
    outside of personnel and organizational change, implementing and documenting processes
    in actionable systems (e.g., automatic configuration tools) as opposed to documentation
    systems (e.g., wikis, blogs, knowledge management tools) benefit the organization
    long term.


    Although libraries that implement cloud services on multiple providers must also
    come to terms with the legal and organizational policy issues associated with
    adoption, it also means that they can realistically look toward their cloud provider
    solution to be a longer-term solution. With the proper IT and operational support,
    a multifaceted cloud solution offers better sustainability and durability than
    any single model, largely due to the fact that the library is in more control
    of the service and can migrate portions of it without migrating the entire system.'
