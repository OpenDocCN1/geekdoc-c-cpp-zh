    costs. For example, Iglesias and Meesangnil (2010) used Amazon S3 as a storage
    source for an OAIS-compliant digital object archival system. In combining local
    and cloud implemented resources they found an inexpensive alternative to SaaS
    offerings that amounted to a two-thirds reduction in cost per year. Because cloud
    services involve recurring costs, finding solutions that result in savings of
    this magnitude can shift the argument away from SaaS solutions. Since this work,
    Amazon has begun offering an automatic data synchronization service called Amazon
    Storage Gateway that offers the ability to synchronize locally stored data to
    Amazon S3 storage automatically.


    Whereas Amazon’s focus is on simplifying the synchronization of data at the server
    level, there are also providers that offer client-level cloud-based data and file
    system tools. Cyberduck (http://cyberduck.ch), for example, is a multiprotocol
    file transfer and storage mounting service that supports a wide range of cloud
    storage services including Amazon, Google storage, Rackspace, and Windows Azure
    (figure 5.9).


    Amazon S3 in particular supports advanced file storage service including access
    control, version control, and event logging. S3 is not a traditional file system,
    and it can be difficult to use S3 services without a secondary layer or client
    to facilitate access. Along with server tools that implement S3 integration (e.g.,
    Amanda and KOALA) there are client-centric tools such as CloudBerry (http://cloudberrylab.com),
    JungleDisk (http://jungledisk.com), and BucketExplorer (http://bucketexplorer.com)
    that facilitate access to S3 by both implementing FTP, WebDav, or traditional
    file system volume/disc mounting services and managing services that otherwise
    can be difficult to manage including file deletion, version control, and access
    services.


