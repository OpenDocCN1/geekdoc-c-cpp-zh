    # Issues


    As the review of PaaS providers shows, the range of services, platforms, and management
    tools supported varies, and as a result it may be difficult for libraries that
    rely on off-the-shelf software to leverage these tools. Dedicated PaaS platforms,
    however, provide considerable capabilities for developers seeking to create and
    test new applications and likely will be more widely adopted by library system
    vendors and open-source development communities in the future. In addition to
    the lack of support of off-the-shelf library software, these types of PaaS systems
    require new approaches to SSL configuration, DNS name mapping, system backups,
    and application configuration and deployment. The techniques required often mean
    that the solutions are more durable than when working with traditional server-based
    IT approaches, but it can be difficult to learn and incorporate these techniques,
    particularly because IT departments have traditionally relied on server-based
    models that more closely match IaaS environments. For these reasons, libraries
    may find themselves unable to use this type of PaaS platform unless they can dedicate
    the time required to modify and manage applications so that they work in this
    environment. Despite this current issue with adoption, dedicated PaaS solutions
    offer economies of scale, low-cost or free use levels, and a level of durability
    that can be difficult to achieve without considerable expertise and investment
    of time and resources using other approaches.


    # Expertise Required


    In addition to the expertise required for server-type management of PaaS applications,
    dedicated PaaS solutions require specialized knowledge of the system being implemented,
    familiarity with version management solutions, and an understanding of how to
    implement and manage database structures in a nonserver environment. For example,
    Heroku allows one to use several different database platforms, each of which has
    its own advantages and drawbacks. Being able to differentiate between database
    and software platforms as well as manage and deploy applications via command line
    tools can make getting started with dedicated PaaS systems more difficult than
    working with server-based PaaS or IaaS solutions. As many of the reviewed services
    point out, these systems are geared toward software'
