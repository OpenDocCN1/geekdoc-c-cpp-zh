    programming interface (API) services rely on preshared keys. If these keys are
    saved on client machines, direct access to Amazon IaaS elements is available to
    any user of that machine. Cloud providers are beginning to offer ways to compartmentalize
    access to resources using identity management tools that allow system administrators
    to monitor which users access infrastructure-level resources and limit access
    based on login or key credentials.


    # Library-Specific IT Support


    Determining local capacity for implementing and administering cloud resources
    is grounded in an understanding of personnel skill and time availability, technical
    needs, and financial resources. These factors need to be compared with projected
    service cost and impact to get an understanding of how important a given service
    or cloud platform is. As our exploration of infrastructure, application, and platform
    administration shows, technical skill and capacity play a large role in selecting,
    implementing, and managing a service. Likewise, depending on the cloud service
    selected, there may be upper limits to the capacity of that given system. As our
    exploration of IaaS providers in chapter 5 shows, the approach to and costs of
    implementing a scalable service on these platforms vary widely. For example Netflix'
