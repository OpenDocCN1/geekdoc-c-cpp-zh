- pgno: 10
  md: '# Preface


    In 2009, I began the process of migrating the IT infrastructure of Wake Forest
    University''s Z. Smith Reynolds Library to "the cloud." We moved to the cloud
    because we believed our library IT systems needed to be as flexible as the services
    we wanted to deliver, and we suspected that the cloud, although not necessarily
    cheaper at that point in time, would help us be more agile in the coming years.
    We were also committed to open-source solutions and viewed the cloud as an environment
    that would enable us to work with the best open-source library information systems.
    I took on this migration with the support of my colleagues at the library, a collaborative
    spirit with campus IT, a good measure of vendor support for our proprietary systems,
    and healthy doses of optimism and openness toward what the cloud is and what it
    would take to be successful. Over the course of a year my technology team and
    I learned much about cloud architecture, system administration, application administration,
    and IT service for libraries.


    My goal in writing this book is to help libraries considering cloud computing
    to start their exploration of these systems with a more informed perspective.
    In speaking with librarians I found that, although many libraries shared our enthusiasm,
    there was little in the way of formal works and guidance available to help them
    on this path. Because of this need, this book explores the broad area of virtualization
    and cloud computing adoption but makes an effort to focus on their use in library
    environments. To do this, I take a wide-reaching approach by defining cloud computing,
    by examining models to assess its adoption in libraries, and by exploring specific
    examples of cloud computing and virtualization to serve as a practical guide.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# AUDIENCE AND SCOPE


    This book is written for both librarians and IT staff. It includes broad discussions
    about legal and policy issues as well as specific information about the technical
    requirements, capabilities, and limitations of different cloud approaches. In
    chapters 4 and 5 there are sections that define basic technical concepts as well
    as discussion sections that examine the range of skills and IT service capacity
    required to implement each solution. One of the goals of this book is to help
    bridge the gap between technical and organizational issues in technology adoption
    and to suggest approaches that work well in a virtualized environment.


    This book provides readers with several cloud computing frameworks, potential
    real-world solutions, and evaluative models to assess the fit of these items with
    their own organization, concluding with an exploration of potential virtualization
    and cloud computing approaches for libraries and a discussion of examples already
    in use in the library world. In getting the reader to this point, the book seeks
    to answer some of the central questions in technology evaluation. For example,
    chapter 2 examines the state of cloud computing adoption in academic libraries,
    and chapter 3 builds on this work to explore the process of evaluating the impact
    of technical, organizational, and environmental factors when selecting an IT platform.
    Using the factors identified in chapter 2, the exploration of cloud computing
    approaches in chapters 3 and 4 examine issues specific to each platform (e.g.,
    SaaS, PaaS and IaaS), staff expertise requirements, methods for evaluating service
    cost, and factors important in evaluating the service including complexity, reliability,
    sustainability, portability, and interoperability. In addition to discussing these
    concepts in relation to specific approaches, chapter 3 addresses factors important
    in cloud and virtualization adoption using the “technology, organization and environment”
    (TOE) model explored in chapter 2, including IT service management issues and
    IT service adoption issues such as expertise, budgeting and expense analysis,
    legal policy factors, and service level agreements. Though not a complete replacement
    for a full work on IT service management or the legal and organizational issues
    relevant to a move to a new IT environment, the chapter provides readers with
    a framework with which to examine issues critical to the success of the cloud
    in their environment.


    The material in this book was drawn from numerous sources, including my expertise
    in cloud adoption, a survey of library-specific uses of cloud computing, relevant
    literature in IT service management, vendor interviews, platform testing, and
    technical and case study literature in the library IT field. Although I selected'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'particular projects, vendors, and platforms to highlight, I also found that
    the number of systems and options in this area is growing rapidly, so it is likely
    that some popular systems and services are not covered in this book.


    # ORGANIZATION OF MATERIAL


    Chapter 1 defines virtualization and cloud computing, examines specific solutions
    for these platforms, and discusses some common approaches to platform adoption.
    This chapter examines cloud computing models and uses these models to set up the
    discussion in the remainder of the book.


    Chapter 2 reports the results of a survey of virtualization and cloud computing
    adoption in libraries. The survey was conducted in the fall of 2011, and the data
    were analyzed using technology adoption models. The findings of this chapter are
    an empirical grounding for the model used to examine specific cloud computing
    solutions in the remainder of the book.


    Chapter 3 explores factors and issues related to IT adoption in detail. The chapter
    is grouped by technical, organizational, and environmental factors and takes the
    reader through system evaluation and implementation planning. This chapter also
    includes a focus on the role of IT service management in system design.


    Chapter 4 examines software-as-a-service (SaaS) and platform-as-a-service (PaaS)
    solutions that are relevant to library information systems. The chapter includes
    an overview of relevant technical concepts, an exploration of information systems
    that use SaaS, and an examination of factors that influence decision making for
    these services.


    Like chapter 4, chapter 5 examines cloud services but focuses specifically on
    infrastructure-as-a-service (IaaS) and multiplatform solutions. The chapter includes
    an overview of relevant technical concepts, an exploration of information systems
    that use IaaS, and an examination of factors that influence decision making for
    these services.


    Chapter 6 reviews the models explored in the book and the systems examined in
    chapters 4 and 5 and presents four generic models that can be used in system design:
    an entire SaaS environment, a pure IaaS environment, and two models that explore
    the creation of a mixed-model approach. The chapter concludes with suggestions
    for incorporating cloud computing and virtualization into your IT environment.'
  merge: -1
  img_proc: true
