- pgno: 159
  md: 'management of providers; and achievement of rich information services without
    dependence on local IT resources. Although these solutions may be preferable for
    many libraries, the market is still somewhat limited in terms of product selection,
    and consolidating the number of vendors in this model comes at the expense of
    product selection. At the present time, libraries seeking to adopt SaaS solutions
    exclusively find themselves making decisions on both system functionality and
    vendor services. This is likely to change in the coming years as LIS providers
    optimize their software to run efficiently in the cloud.


    For libraries seeking to use SaaS solutions to fill these gaps, there are an increasingly
    large number of case studies that explore SaaS alternatives to traditional library
    solutions. For example, Wilson (2011) explores the use of Drupal, Basecamp (http://basecamphq.com),
    and MIRA (http://atlassian.com/software/jira) as an alternative platform for electronic
    resource management systems. Wilson explores the challenges associated with adapting
    these platforms to serve a very specific function, as opposed to the implications
    of using an SaaS platform for this service, but the reported success of all three
    services point to an opportunity for these types of tools to have a dramatic impact
    on library IT decisions.


    Perhaps the largest challenge in this adoption environment is managing the budgetary,
    license, identity management, and functional interoperability of these systems.
    Although many providers feature some form of integration through web-based plug-ins,
    back-end indexing, or automated data loading, making these services work together
    can be challenging, particularly for libraries interested in offloading as much
    technical work as possible. Unfortunately, these challenges may not emerge until
    a specific system is implemented or need found, and it can be difficult for libraries
    without in-house IT staff to identify potential solutions.


    These data and interoperability problems do not have easy one-size-fits-all solutions,
    but there are potentially useful options. For example, Peter Murray (personal
    communication, March 2012) observed that Lyrasis tunes its hosting services based
    on library need and worked with outside consultants to bring data migration services
    to the table for libraries adopting its hosted IT services. In addition, there
    are IaaS providers whose primary purpose is to enable interoperability in an SaaS
    environment. Two examples are SnapLogic (http://snaplogic.com) and Jitterbit (http://jitterbit.com).
    These providers support data connections using a range of data sources (e.g.,
    XML, CSV, ODBC), include a data migration design interface, and support HTTP endpoint
    services in which data queries and publishing actions can be activated by REST-based
    HTTP requests. These services require detailed data analysis skills; still, they
    may enable libraries'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'to avoid costly IT infrastructure implementations for otherwise lightweight
    data transformation services.


    These four approaches emphasize different strengths and weaknesses in cloud solutions
    and can serve as a starting point for libraries turning to the cloud. Approach
    one emphasizes the simplicity and control that comes with using a single cloud
    provider but recognizes the risk associated with being locked in through extensive
    use of provider APIs. Approach two seeks to mitigate some of this risk by using
    multiple providers and leveraging SaaS solutions to monitor, manage, and audit
    these providers. This approach illustrates the benefit of keeping track of cloud
    infrastructure and expenditures and suggests that SaaS solutions are a way to
    provide infrastructure management support. Approach three focuses on services
    that seek to abstract system design and implementation from IaaS providers and
    demonstrates the benefits of being able to use multiple cloud platforms easily;
    still, it is complex and likely to require IT and monetary resources beyond those
    of approaches one and two. Approach four recognizes that libraries may very likely
    turn to entirely SaaS-based solutions to address technology needs. In this case
    operational, administrative, and service quality issues are more important than
    technical issues.


    In the real world, it is likely that libraries will employ more than one of these
    approaches. In fact, most libraries already rely to some extent on an SaaS provider
    or outsourced information service. In deciding whether to expand those roles or
    to consider other approaches when moving new services to the cloud, issues of
    local resources, expertise, IT support capacity, organizational policy, and service
    need are useful factors that can make one approach more viable than another. Regardless
    of the approach selected, IT service elements such as capacity planning, quality
    of service monitoring, service integration, and resource utilization monitoring
    are important elements of a sustainable IT infrastructure. The remainder of this
    chapter examines these issues and provides suggestions for getting started with
    cloud computing.


    # PREPARING FOR CLOUD COMPUTING ADOPTION


    Library IT departments have grown in response to specific library needs such as
    client support, ILS support, and DAMS support. It is still common to find'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'IT librarians with backgrounds outside IT disciplines, but there is also a
    trend documented in library conferences and literature surrounding the adoption
    of industry-standard IT software development and service management approaches
    (Chang 2010; Dougherty 2009). These articles discuss the fact that libraries are
    adopting IT service models including formal models such as Information Technology
    Infrastructure Library (ITIL) (www.itil-officialsit e.com) and less formal models
    such as ITSM (www.itsm.info/ITSM.htm). Even for libraries that have not used such
    models, there is use of service management portals (McHale 2010) and a growing
    awareness of the responsibility of community-driven software development (Reese
    2012).


    As our exploration of cloud approaches emphasizes, there is a need for formal
    IT management practices. For libraries turning mostly to SaaS solutions, the emphasis
    on IT management should be on maintaining an intranet of service providers and
    support information. For libraries turning more to PaaS and IaaS solutions, a
    more formal support strategy helps make the implementation and management of solutions
    sustainable. There are a variety of models from which to choose, including ITIL,
    the Systems Development Lifecycle (Department of Justice 2003), Control Objects
    for Information and Related Technology (ISACA 2011), and Microsoft Operations
    Framework (Microsoft 2011). These models help IT organizations approach system
    selection, development, implementation, management, and decommissioning of IT
    services in systematic ways and are helpful for libraries of any type. Although
    each model has its own distinct features, there have been attempts to find parallel
    processes and common ground (Pollard et al. 2009; Susanto et al. 2011) among them.
    Critics of these models point out that IT service model adoption has not demonstrated
    improvements in IT service and assert that they create administrative overhead
    and can lead to the creation of arbitrary boundaries (Addy 2007, 4).


    Service management is a broad concept, defined as “a set of specialized organizational
    capabilities for providing value to customers in the form of services” (ITIL 2011,
    11). The ITIL service life cycle describes the process of developing, delivering,
    and managing services and focuses in particular on knowledge management, SLAs,
    and standardization. Service management models can provide standardized measures
    of success including time to resolution, ratio of open and closed incidents, number
    of supported services, and time commitment of IT staff.


    The ITIL service model, for example, discusses three stages of service: development,
    transition to production, and operational support. Each of these'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'processes involves a wide range of discrete service components including defining
    service-level requirements, appraising IT support capacity, defining security
    requirements, and documenting user expectations. Addy (2007, 50) provides a full
    list of areas that require definition, including users, user requirements, expected
    deliverables, information or data provided by user, methods of service delivery,
    roles and responsibilities, contractual requirements, measures of success, definitions
    of service availability, measures of service capacity, security standards, and
    cost requirement/fulfillment. Although readers who are at the stage of incorporating
    formal IT service management approaches are best served by exploring each of these
    areas in more depth, it is important to be aware of these issues, if even informally,
    as your organization explores cloud solutions.


    Each of the IT service models mentioned here work well in a cloud environment,
    but some are exploring issues specific to cloud adoption. The Microsoft Operations
    Framework (2011), for example, explores which system elements (e.g., networking,
    storage, data, applications) are locally or remotely managed in SaaS, PaaS, and
    IaaS environments. The best-practice recommendations for adopting common IT service
    guidelines to a cloud environment include changes to communication, servicing,
    and problem resolution. For example, the Microsoft guidelines suggest adding elemental
    cloud services to the service catalog to ensure that users understand what core
    cloud services are available and what their implementation costs and parameters
    are. Having documentation about the cloud platforms with which an organization
    has experience can help guide discussions and decisions surrounding IT service
    adoption and may prevent the use of multiple cloud service providers in a disjointed
    way. Microsoft''s guidelines also suggest automating service and leveraging the
    self-service features of cloud platforms where possible.


    For libraries engaged in a reappraisal of IT services, exploring a shift to cloud
    resources, or simply interested in finding ways to redesign their IT service approach,
    an understanding of IT service models and standards can help guide organizational
    change. This may lead to a centralized library IT, particularly in organizations
    that turn to PaaS or IaaS solutions, or it may lead to a more decentralized IT
    environment. In both cases the use of some form of service catalog, knowledge
    management system, and service ticket system can help libraries keep track of
    IT developments and make well-informed decisions about changes to their IT services.
    Despite the motivation to design the perfect system, system administrators should
    be tuned to the risk of overcommitting to complex system configurations and management
    practices. In fact, by using cloud environments to host service'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'catalogs and knowledge management and ticket management systems, library IT
    departments can both capitalize on the efficiency benefits of SaaS solutions and
    demonstrate that they are willing to “eat their own dog food.” The exercise of
    moving these internal services to the cloud or of deploying them in the cloud
    in the first place can also be a good testing ground for the implications of cloud
    service adoption in a library environment.


    Although it is difficult to quantify the service capacity in an IT service department,
    the measures and frameworks that are part of IT service models can help measure
    the use of applications and resources. Likewise, when applied judiciously, these
    IT service models can expand the strengths of an IT department, enabling a small
    IT staff to manage an onslaught of requests more easily. Perhaps the most important
    principle of these service models is the view that IT service providers set boundaries
    and expectations that work for both customers and service providers. Although
    this is often formalized in SLAs, those agreements do not necessarily need to
    be complex and at the least can help avoid miscommunication and mismatches in
    customer expectations.


    # Make Room for New Services


    For organizations exploring the cloud, one of the important questions is how cloud
    computing can help libraries support new or different services. There are several
    important IT and organizational issues to consider here, including service requirements,
    user expectations, IT platform options, cost considerations, and legal/organizational
    policies. Understanding where constraints and surpluses exist may help guide the
    discussion and help organizations understand where their energy is best allocated.
    For example, staffing constraints and lack of expertise may mean that libraries
    are tempted to turn to SaaS solutions. As the previous section points out, the
    use of SaaS solutions does not eliminate the need for IT service management tasks.
    In contrast, as libraries turn to more SaaS solutions, the need for a cross-departmental
    service catalog and knowledge/ticket management system increases. This need is
    even greater in organizations where the licensing, management, and deployment
    of SaaS services are distributed among multiple departments.


    For organizations that find that the need for customized or localized services
    means the use of PaaS or IaaS, it can be useful to identify common or nondifferentiating
    services that are both high in resource utilization and low in impact and shift
    those services to SaaS solutions. This may include systems and'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'services that were once the bread and butter of library IT departments, ILSs,
    and electronic resource management systems. Likewise, new library services such
    as large-scale discovery, resource recommendation, and resource sharing depend
    on network-based services to such an extent that they work only as an SaaS solution.


    # Build Support for the Migration


    Some of the major internal limitations of moving to cloud computing include local
    policy, staff expertise, lack of cooperation with organizational IT, lack of funding,
    and lack of satisfaction with provider terms. Many of these issues require administrative-level
    work with providers; nevertheless, understanding and addressing the limitations
    of current staff expertise through new recruitment or training can dramatically
    improve an organization’s ability to adopt cloud solutions. It is not necessarily
    easy, but building internal capacity for software programming, IT service, and
    server administration increases the number of options in IT adoption and facilitates
    management of SaaS as well as PaaS and IaaS solutions.


    Organizational resistance to cloud migration can be difficult to overcome. Marketing
    the shift as an opportunity to redefine service relations between libraries and
    organizational IT or to enable new collaborations can help resistant departments
    see how cloud adoption can benefit them. Libraries moving to the cloud are likely
    to depend on some key services from their organization’s IT, including DNS resolution,
    firewall support (for both incoming and outgoing ports as needed), and advice
    on IT issues. It makes sense for libraries to be well informed about legal and
    policy issues before heading to IT departments and to be prepared to take on the
    liability of service uptime and capacity planning in a formal document. Often,
    IT organizations are guided by a need to define and understand service boundaries.
    By recognizing these boundaries and taking appropriate responsibility, libraries
    can often be successful in renegotiating a relationship with organizational IT
    management that is beneficial for both parties.


    # Leverage Vendor-Provided Tools


    One of the key advantages of adopting cloud services is the built-in service infrastructure
    that comes with even the most basic services. For example, Amazon has a site dedicated
    to informing cloud customers about value-added applications (http://aws.amazon.com/customerapps/).
    These services include mobile AWS management tools such as iAWSManager and value-added
    services such as'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'LabSlice—a virtual computing lab (VCL) management tool designed to facilitate
    the design and deployment of VCL infrastructure on AWS. Many of the SaaS, PaaS,
    and IaaS platforms discussed in this book feature robust web-based management
    interfaces that are designed with mobile device utilization in mind. For those
    services that do not work well in a web-based mobile interface, there are often
    mobile device applications that provide access. For example, Linode services include
    an iPhone management application called Linode Manager, and Android apps that
    were not developed by Linode but leverage the Linode API suite are available.


    Choosing applications to tie into or provide advanced services on top of cloud
    providers can be difficult. Mobile management tools, alternative client-based
    access tools such as Cyberduck, and application monitoring and auditing tools
    are of high value and pose little risk to the core cloud services. As in the case
    of cloud-based digital object storage, however, it can be difficult to use some
    cloud functions without relying heavily on third-party products. Perhaps the most
    important consideration is not whether a service adds value, since most of them
    do, but rather whether there is a second pathway away from the service if there
    is some failure of the primary application. For example, though using Amazon S3
    as a file system through Cyberduck or S3-Fuse (http://sourceforge.net/projects/s3fuse/)
    serves a valuable need, adopters need some method by which they can recover their
    data if the selected service fails. In this case, there are several tools, not
    the least of which is Amazon’s own API toolkit, which can help with object recovery.


    # Stand on the Shoulders of Giants


    One of the great advantages of moving to the cloud is gaining access to enterprise-level
    IT services with very little overhead. Another important advantage is the ability
    to tap into support communities in both the cloud and library IT world. Many of
    the cloud providers discussed in this book make their tutorials available freely
    and even provide free levels of service for new adopters. In addition, there are
    companies such as Alestic (http://alestic.com) and willing experts in the library
    community (e.g., Code4Lib, LITA, and ALA Cloud Computing interest group) that
    can help answer questions, give advice, or solve specific technical problems.
    There is also an abundance of white papers, guides, tutorials, best-practice recommendations,
    and getting-started documents available to new and experienced cloud users.


    A challenge that staff new to server administration in general are likely to encounter
    is developing an understanding of how to work with the many'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'moving parts of system security, performance, application management, and IT
    service. Linode''s system documentation and Mitchell''s AWS-focused 2011 LITA
    preconference tutorials (http://erikmitchell.info/lita_2011_aws/aws_tutorials.pdf)
    can serve as initial guides through these environments. Many companies also publish
    a series of higher-level guides, video tutorials, and webinars intended to help
    adopters implement secure services. For example, Amazon''s white paper series
    (http://aws.amazon.com/whitepapers) includes operational checklists, case studies
    on backup and recovery, and overviews of security and compliance procedures. Linode
    also offers a wide range of useful tutorials (http://library.linode.com). Linode''s
    documentation library naturally focuses on managing Linode''s infrastructure,
    but it includes platform-agnostic tutorials on how to create high-availability
    applications, set up system security, and deploy application frameworks. Because
    Linode''s documentation often includes tailored tutorials for Ubuntu, Fedora,
    CentOS, and other flavors of Linux, it helps readers understand both the broad
    concepts of system administration and the specific practices associated with a
    given platform. For users seeking to take advantage of PaaS solutions, both Heroku
    (http://devcenter.heroku.com/) and Amazon (http://aws.amazon.com/articles) include
    platform-specific tutorials on deploying applications in their environment.


    # Get Started


    This book outlines several approaches to cloud computing or virtualization, focusing
    on technical, organizational, and environmental factors that influence decision
    making in this area. For those libraries seeking to implement new services, cloud
    computing can provide a way to implement those services quickly and without considerable
    overhead for organizational IT. In contrast, libraries that are looking toward
    cloud computing as a way to transform existing IT practice are best served by
    examining their current IT service environment as well as the functional needs
    of their user community and then selecting cloud solutions that will both improve
    service quality and create room for new information services.


    Library-specific systems are moving toward the cloud, and there are new opportunities
    for libraries to engage with industry-standard applications. The trend toward
    cloud computing has become mainstream in both the library and wider information
    community, and, although library adoption of cloud computing lags behind the corporate
    world, a robust range of services is available. Libraries are more frequently
    turning to SaaS than to PaaS or IaaS solutions. It should not be surprising that
    libraries are finding SaaS solutions attractive, given the benefits of'
  merge: -1
  img_proc: true
- pgno: 167
  md: "economies of scale, potential cost savings, and improved service offerings.\
    \ Issues of expertise, local capacity, organizational policy, and desired end-user\
    \ service outcomes are also heavily influencing these choices. This trend toward\
    \ SaaS poses both opportunities for libraries and challenges to open-data and\
    \ open-source communities in the library world. In fact, as libraries turn increasingly\
    \ to cloud solutions, they are helping redefine our industry’s view of distinctive\
    \ library services and shaping the design of new information systems. If nothing\
    \ else, the shift to SaaS platforms is demonstrating that just about every library\
    \ service can be turned into a generalized commodity whose primary purpose is\
    \ to support high-quality, user-facing services. Still, issues of data ownership,\
    \ resource sharing, and interoperability pose continued challenges for these communities\
    \ as library IT vendors seek to offer more comprehensive service frameworks that\
    \ discourage multivendor adoption.\n\nIn contrast, PaaS and IaaS solutions provide\
    \ a great level of flexibility, independence, and assurance of privacy at lower\
    \ cost but at the expense of more local investment and expertise. There are few\
    \ ready-to-use library-specific applications in these environments. This points\
    \ to a real opportunity for open-source communities, consortia, and commercial\
    \ providers to expand their support for PaaS and IaaS solutions and to help libraries\
    \ make use of a wider range of cloud services.\n\n# REFERENCES\n\n+   Addy, Rob.\
