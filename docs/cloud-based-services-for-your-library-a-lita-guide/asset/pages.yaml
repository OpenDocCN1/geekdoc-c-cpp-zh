    # Service Cost


    IaaS services often cost less than their SaaS and PaaS counterparts, primarily
    because the latter include value-added services such as IT management, data management,
    and premium service levels. At the very least, a service cost comparison should
    include the hard costs of server run-time, storage space, bandwidth, backup, and
    related infrastructure (e.g., monitoring, documentation, software licensing).
    A full cost consideration also needs to include hidden or soft costs including
    those for personnel time, infrastructure management, replication and redundancy
    plans, and data management. Though planning for and incorporating such soft costs
    is difficult, even a basic attempt can help organizations fully understand the
    long-term costs of cloud computing. There are SaaS services such as Cloudability
    (http://cloudability.com) whose primary focus is on monitoring the use of common
    SaaS, PaaS, and IaaS services and triggering notifications when services are likely
    to expire or exceed limits.


    # Service Portability and Interoperability


    Although interoperability between applications in an IaaS environment is less
    of an issue than in SaaS or PaaS environments, given the control an IT department
    has over the infrastructure, ensuring IT system portability and interoperability
    with other systems is a more complex issue. Operations such as firewall administration,
    user account management, and service management enable application interoperability
    and data transfer. The larger issue with IaaS platforms is the challenge of moving
    the entire service to a new platform. This capability has seen increasing support
    in recent years, and now many IaaS systems support some form of system migration.
    In addition, services such as RightScale offer configuration management services
    that help replicate cloud platforms and data across multiple providers. At the
    very least, a cloud computing plan should include short-term replication and long-term'
