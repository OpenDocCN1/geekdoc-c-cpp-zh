    # Budgeting and Service Subscription


    Libraries turning to library-specific virtualization and cloud solutions often
    find that the budgeting and subscription terms provided by the vendor recognize
    the approaches typical of that industry, but they may also find that cloud providers
    from other areas are not used to working with libraries and other nonprofit institutions.
    In many of the cloud services explored in chapters 4 and 5, subscription terms
    are measured in hours or months rather than annually based. This can make budgeting
    and cost prediction more difficult and challenging. In addition, many cloud providers
    including Amazon and Microsoft rely primarily on credit cards as a form of payment
    and do not support purchase orders or other long-term subscription models by default.


    Several PaaS and SaaS solutions are specifically for libraries. These include
    for-profit companies such as SerialsSolutions (http://serialssolutions.com), LibLime
    (http://liblime.com), Equinox (http://esilibrary.com), and ByWater Solutions (http://bywatersolutions.com/)
    as well as nonprofit organizations such as Lyrasis (http://lyrasis.org), OCLC
    (http://oclc.org), DuraCloud (http://duracloud.org), and Omeka (http://omeka.net).
    These nonprofit organizations (with the exception of OCLC) support the implementation
    of open-source platforms (e.g., DSpace and Omeka) that might not otherwise be
    implementable by libraries. For libraries interested in non-library-specific application
    hosting, there are companies such as LisHost (http://lishost.org) that focus on
    providing more generalized web hosting services for libraries. Selecting one of
    these cloud providers sidesteps some of the budgeting and payment issues libraries
    are likely to encounter with other cloud providers but also limits the platforms
    available for cloud adoption. Whether this is an issue depends entirely on organizational
