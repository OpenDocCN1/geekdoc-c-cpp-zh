- pgno: 120
  md: 'a specified amount of ephemeral storage space that can be expanded or entirely
    replaced with the use of EBS volumes. EBS volumes are durable virtual volumes
    that are not permanently tied to machine instances like ephemeral storage is and
    are easily managed through the web console.


    An important strength of Amazon’s service is its seven different cloud regions,
    which make it possible for customers to implement a geographically separated cloud
    infrastructure. In fact, multiregion replication is a recommended practice for
    Amazon customers and is often offered as a component of Amazon’s managed services
    including Elastic Beanstalk and RDS. On the other hand, a potential limitation
    of Amazon is that its services are designed to be implemented in a self-service
    environment. Amazon does not provide the individualized service that librarians
    are used to receiving from SaaS providers, and they may find it difficult to get
    answers to questions and feel confident about adopting a service that lacks a
    personal level of customer service. In response, Amazon has implemented basic
    support levels that come bundled with cloud services in addition to premium service
    levels that operate on a monthly subscription model. The four levels of support
    include an enhanced SLA that defines support request response time, types of support
    activities, and scope of systems supported. The Amazon premium support costs,
    ranging from $49 per month to over $15,000 per month, illustrate why IaaS services
    tend to be cheaper than PaaS or SaaS services.


    # Linode


    Linode provides an IaaS service similar in scope to many of Amazon’s services
    (figure 5.2). Like Amazon, Linode offers different server levels, from 512 MB
    to 20 GB RAM. Unlike Amazon, which charges for resources by the hour, Linode charges
    on a monthly basis. Linode nodes (or servers) come with a specified level of included
    storage and CPU resources and can be deployed in one of six zones in the United
    States, Great Britain, or Japan. Linode uses a customized language to deploy and
    manage servers using the Xen virtualization platform. All Linode nodes include
    premium support services. Unlike some other IaaS providers discussed in this chapter,
    Linode offers automated backup and restoration services as well as node-balancing
    services. By facilitating the process of backup and balancing, Linode helps users
    capitalize on cloud features with little required knowledge or effort. In addition
    to backups, Linode offers add-on services that include extra computing resources
    (e.g., RAM, hard-disk space, bandwidth, or IP addresses). It supports internal
    cloning of servers and features configuration profiles to help manage server builds.


    ![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_121_0.png)


    # FIGURE 5.2


    Linode web console (Courtesy of Linode)


    Linode supports multiple users on an account and supports multiple Linux distributions
    including Debian, Fedora, Ubuntu, and CentOS. Unlike other IaaS services, Linode
    supports rescue mode booting and other rescue methods. It also focuses on a more
    limited set of company-managed operating systems than are found on other IaaS
    providers. The key advantage to this approach is that by keeping the operating
    system distribution list closed Linode can offer assurances regarding its base
    platforms.


    # Rackspace


    Rackspace (http://rackspace.com) provides a range of both PaaS and IaaS IT hosting
    services (figure 5.3). Like Amazon, Rackspace supports several server platforms
    including Windows and Linux distributions. These cloud servers range in scale
    from 256 MB to 30 GB RAM and are licensed on a hourly basis. In addition to providing
    unmanaged server instances, Rackspace provides premium support including managed
    IT resources, PaaS services including e-mail services and web-hosting services
    (CloudSites), and private cloud services.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# FIGURE 5.3


    Rackspace (Copyright Rackspace US, Inc. Used under license)


    Rackspace offers a wide range of managed and unmanaged hosting services and features
    customization options similar to Linode’s. It offers a limited selection of machine
    images but provides support services as part of the hourly server charge and offers
    a graphical interface for backup configuration and management. Rackspace’s support
    for very small servers (256 MB RAM, 10 GB hard drive space) means that organizations
    can employ a multilevel architecture that scales servers down when possible to
    save computing resources. At current prices, the smallest server at Rackspace
    can operate for approximately $11 per month. In addition to low-cost servers,
    Rackspace offers managed servers that include load balancing and automatic scaling.


    Like Amazon, Rackspace includes server metrics and monitoring services as part
    of the run-time server costs. The inclusion of an infrastructure-level backup
    service and built-in support services can make it an appealing option for libraries
    seeking more control over their server infrastructure but unsure about server
    management elements such as operating system and backup management.


    # Private Cloud IaaS Platforms


    Along with public, community, and hybrid clouds there are private cloud systems
    from both commercial and open-source providers that offer organizations opportunities
    to benefit from cloud computing even if they are not comfortable moving their
    IT resources to an external provider. For example, Microsoft offers'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'both public (Azure) and private cloud platforms, and Citrix (http://citrix.com)
    and VMWare (www.vmware.com) offer commercial private cloud systems. Open-source
    products include Eucalyptus (www.eucalyptus.com), CloudStack (www.cloudstack.org),
    and OpenNebula (http://opennebula.org). In addition to these private cloud applications,
    there are private cloud storage systems such as Walrus (http://open.eucalyptus.com)
    and Nimbus (www.nimbusproject.org) that work directly with private cloud platforms.


    Implementing private cloud services is a complex task and requires considerable
    infrastructure and IT expertise. Libraries may find that their parent organizations
    are exploring or managing these services or that the scale required results in
    an overall decrease in cost for the organization. Private clouds may also be a
    good option for organizations seeking to run their services largely in the cloud
    while keeping a local backup of resources. Conversely, private clouds can be a
    good solution for organizations that seek to run their services largely in-house
    but also want to be able to “burst” into the cloud as needed (see “Cloud Bursting”
    sidebar, chapter 3).


    # IaaS Examples in Libraries


    Although the survey presented in chapter 2 found that IaaS was not often adopted
    by libraries seeking to implement cloud solutions, there are a few that have,
    including Wake Forest University (Mitchell 2010), the District of Columbia Public
    Library (Tonjes 2011), and the University of Arizona (Han 2010). For example,
    the Z. Smith Reynolds Library at Wake Forest turned to the AWS platform to implement
    its entire IT server infrastructure. Amazon services were used to deploy web server,
    discovery, DAMS, and other services, and PaaS and SaaS solutions were selected
    for the ILS, OpenURL, and other data-rich services. By using IaaS resources, the
    ZSR Library was able to implement services based on customer demand rather than
    on platform support limitations.


    This had both positive and negative outcomes: the library was able to increase
    service offerings but also found itself supporting Ruby on Rails, PHP, Java, and
    Python applications using MySQL, PostgreSQL, and Oracle databases. In addition,
    when implementing licensed software, the library found that it had to implement
    a separate server running CentOS as opposed to its commonly used Ubuntu server
    operating system. This example illustrates some of the complexity that can come
    with this approach, but there are also features of IaaS platforms that greatly
    simplify IT management, including central backup and management services. For
    example, although the ZSR Library was managing four servers, each with a'
  merge: -1
  img_proc: true
- pgno: 124
  md: <!-- no content -->
  merge: -1
