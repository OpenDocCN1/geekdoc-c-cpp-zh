    # Service Capacity


    Libraries are unique adopters of cloud computing in that their main focus is on
    providing information services rather than on managing information technology.
    Libraries also tend to adopt multiple platforms to fill the needs of their patrons
    and may encounter challenges when attempting to gain support for these systems
    within their organizations. Though virtualized and cloud solutions can help with
    this situation, they can also create an environment in which library IT service
    is fragmented onto multiple providers and platforms.


    IT service organizations familiar with service management approaches such as ITIL
    or ITSM may have ways of measuring the impact of a selected information system
    on an organization''s IT support capacity. Common measures include available IT
    infrastructure, IT staff support availability, and application administration
    capacity. These departments may view virtualization and cloud computing as a way
    to improve local capacity from the perspective of either infrastructure or IT
    staff time. As a library or IT department turns toward cloud or virtualized solutions
    that involve direct system or application management, it is important that it
    take a systematic approach that leverages literature on IT service management.
    For example, before implementing multiple IaaS or PaaS solutions, libraries should
    also design a service management and replication plan that accounts for staff
    resources, IT resources, and ongoing expenses. A core part of this consideration
    is workflow integration and operational overlap. In regards to service capacity,
    it is important to consider challenges to sharing data, compatibility issues in
    workflow integration, and loss of efficiency that may come when working with multiple
    virtualized or cloud solutions. For example, data access over an Internet-based
    network connection is likely to see more latency than when accessed over an internal
    network connection. This may not be problematic for short bursts of data, but
    it can be challenging when interacting with large amounts of data or when streaming
    audio or video materials over a cloud connection. To work around the latency issue
    in particular, cloud providers may offer dedicated network connections for upload/download,
    may allow the subscriber to ship large datasets on physical storage media to a
    data-loading department, and may feature'
  merge: -1
