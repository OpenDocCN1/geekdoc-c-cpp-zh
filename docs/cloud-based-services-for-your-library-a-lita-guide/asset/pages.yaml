- pgno: 148
  md: '# Best Practice and Recommendations


    In this chapter we discuss ways to get stared with cloud computing by exploring
    four basic methods of approaching larger-scale migrations to cloud computing that
    leverage a mix of the platforms and services reviewed in the previous chapters.
    The four approaches are based on a simple cloud architecture that features an
    application server, persistent storage space, and a separate database server or
    database service. The sizes of the server, database, and storage space are not
    specified; this architecture could scale for small, medium-sized, or large libraries
    and is capable of hosting multiple applications.


    Each approach features common functions, including automatic server configuration,
    automated backups, a separate database service, a single application server, service
    monitoring, and cost auditing. Though it is common to find these services in IaaS
    providers, there the services are not always automated or monitored to the extent
    needed. Likewise, these services are implemented in PaaS and SaaS environments
    as well, but there they often focus on distinct applications and cannot be configured
    to monitor multiple platforms or providers. To stay focused on high-level issues,
    I do not include in the comparison of approaches the specific functions of monitoring,
    auditing, firewall services, administrative user access, service growth planning,
    and budgeting. This certainly does not minimize the importance of designing a
    cloud infrastructure that includes these highly functional features, for they
    may be a compelling reason to adopt or reject a platform.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# APPROACH ONE:

    SINGLE-VENDOR CLOUD DEPLOYMENT


    A common approach to cloud computing is to select a single vendor and implement
    a category of cloud services (e.g., all discovery services, all website services)
    within that vendor''s environment. This applies to SaaS, PaaS, and IaaS environments
    and may be appropriate for specific categories of services. In this case, the
    single-vendor cloud is used to deploy our hypothetical application/database server
    environment. Single-vendor implementations can be easier to accomplish and have
    the benefit of enabling the library to work with a single suite of APIs and administrative
    interfaces. In the SaaS environment, a single-vendor cloud also likely includes
    tightly integrated services and efficient data management features. Single-vendor
    clouds do come with risks of vendor lock-in and service downtime if the cloud
    service fails, but many vendors have designed multiregion cloud platforms that
    operate independently, helping customers mitigate the risk of working with a single
    provider.


    As an example, figure 6.1 illustrates an example set of services implemented in
    the Amazon EC2 cloud environment. This approach uses configuration,


    ![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_149_0.png)


    FIGURE 6.1

    Sample Amazon server configuration'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Best Practice and Recommendations


    monitoring, machine imaging, and storage snapshot services built into the AWS
    platform to manage both the reserved storage space and application server. The
    Relational Database Service (RDS) is an independently managed service with its
    own backup and monitoring services. In this example, persistent data are stored
    as separate 100 GB EBS volumes (e.g., digital images, essential documents, website
    files) that can be detached from the application server and reattached to a new
    server if required. Storing important data on EBS volumes rather than on storage
    associated with the machine instance both makes it easier to migrate this data
    onto new servers and provides additional levels of redundancy that reduce the
    risk associated with hosting important files on cloud services.


    In this environment, CloudFormation configuration services would be used to document
    server configuration. The CloudFormation service supports both initialization
    and setup of Amazon resources (e.g., EC2 instances, EBS volumes, Security Group
    definitions) and installation and configuration of specific server applications.
    To accomplish this, the CloudFormation service uses a package management service
    called cloud-init that is designed to facilitate server configuration during initial
    start-up. A good “getting-started” guide for this service is in Amazon’s documentation
    on CloudFormation (Amazon 2012). Reid (2012) suggests using Chef (www.opscode.com/chef/)
    along with CloudFormation to create an automatic configuration tool that is independent
    of platform and operating system.


    Linode and Rackspace offer similar functionality for scripting resource creation
    and management. Figure 6.2 shows a similar cloud implementation using Linode as
    the sole cloud provider. Like Amazon, Linode supports multiple cloud regions and
    has its own customized scripting language, called Lish, to facilitate server management.
    Linode’s monitoring service, like Amazon’s, focuses on server health as opposed
    to application health. Linode uses StackScripts to support automatic configuration
    and deployment of servers and features version control for scripts to allow easy
    testing and restoration of services.


    Chapter 5 examines the costs associated with a single-vendor model. Tables 5.2
    and 5.3 show budgets that generally fit the configurations outlined in figures
    6.1 and 6.2. The budgets include a comparison of costs for on-demand and reserved
    instances but omit charges for services that libraries may want to include from
    outside vendors (e.g., managed backups, region replication, or application monitoring).


    Some benefits of this single-vendor cloud are tight integration between Amazon
    services; consistent monitoring, configuration, and backup services; built-in
    ability to scale or replace application server easily without impacting database
    or digital object storage; and ability to migrate one or more services into new
    availability'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_151_0.png)


    # FIGURE 6.2


    Sample Linode cloud deployment


    zones. In addition, the close relationship between database instance, long-term
    stored data, and application servers in this approach allows automation of many
    tasks. For example, it may be highly desirable to configure and deploy application
    servers automatically but not database and EBS resources. In addition, learning
    the technical elements of a configuration system pays great dividends in efficient
    IT service management, documentation, and service quality as the information service
    matures.


    The approach detailed in figure 6.1 also brings technical and configuration challenges.
    For example, because Amazon does not provide a mechanism for automatic backups
    in its web console, users must implement a solution using an external vendor or
    Amazon’s command line tools to take regular snapshots of their server resources.
    Fortunately, because this is a common issue several approaches are available.
    For customers seeking to keep backup service scheduling on their server, a simple
    backup script written using one of the available AWS command line tool platforms
    (http://aws.amazon.com/articles/) works easily. The AWS tutorial at libcc.org
    (http://libcc.org) features a backup script using the Python BOTO'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'library (http://code.google.com/p/boto/). Likewise, because Linode does not
    offer a managed database service, an extra server is included as the database
    server. This actually may be preferable for libraries that use multiple database
    platforms in their information systems. Although this solution requires that libraries
    take on database management, it also offloads backup responsibilities. Linode''s
    managed backup service takes care of the backup scheduling and rotation.


    Cloud providers do experience occasional downtime, and this is a considerable
    risk with a single-vendor cloud. There are ways of mitigating this risk, however,
    for vendors that include multiple independent cloud zones. In the difficulty experienced
    in 2011, Amazon customers found out how important a redundant and easily replicated
    cloud infrastructure can be (Cockcroft et al. 2011; Tonjes 2011). In fact, Netflix''s
    approach was to build a PaaS environment using the Amazon platform as a way of
    addressing this issue (Cockcroft 2012). In the Netflix architecture, emphasis
    was put on designing scalability, application publishing, and management using
    continuous integration tools, database storage using Cassandra (http://cassandra.apache.org),
    and prebuilt AMIs to deploy operational instances (Chan 2012; Cockcroft 2012).
    One of the interesting outcomes noted in Cockcroft''s presentation on system architecture
    was a realignment of IT development away from system management roles (e.g. database
    administration, system administration).


    Another challenge with this approach is the inability to move to a new cloud provider
    without considerable development time and expense. Although these providers support
    machine and data exports, the reliance on vendor-provided management services
    means that migration includes considerable learning and design work. Finally,
    as our cost analysis shows, relying on a single vendor may push libraries into
    paying for more capacity than they need in certain areas. Vendors have different
    cost models for network traffic, storage space, server size, and core versus add-on
    services. A single-vendor cloud would make it difficult to manage these costs
    over time as service needs change.


    # APPROACH TWO:

    MIXED-CLOUD MANAGEMENT WITH SAAS


    Our first approach ties all applications to a single server, requiring the library
    to manage multiple application stacks and select a server capable of serving all
    applications. It can be preferable to isolate applications onto separate servers
    so that downtime or problems with one system do not hinder the others. In addition,'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'libraries may instead want to use a mix of PaaS and IaaS providers to separate
    out applications on the basis of platform or scalability need.


    Although this may lead to a more durable architecture and more efficient use of
    resources, it can also make it difficult to monitor, audit, and manage these services.


    To address these concerns there are an increasing number of vendors that provide
    value-added support on top of IaaS and PaaS services. Some key areas these SaaS
    services address are service auditing, server and application monitoring, service
    management automation/simplification, and administrative notification. In our
    second cloud model, the Amazon cloud described in the first section is retained
    but another application is deployed on the Heroku platform. The platform may be
    in use because of Heroku''s ability to scale services easily, because of a good
    fit with an application stack (e.g., Ruby on Rails), or simply to build in a level
    of vendor redundancy. In this example, database and digital object storage services
    continue to be offered via the Amazon RDS and EBS services. Figure 6.3 illustrates
    this deployment and shows how SaaS services such as Ylastic and Cloudability can
    be used for monitoring, auditing, backup, and replication.


    ![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_153_0.png)


    FIGURE 6.3

    SaaS-managed cloud computing'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'This model uses Ylastic to provide application monitoring for both Amazon and
    Heroku cloud platforms and backup and region migration services for the Amazon
    platform. Cloudability provides cost auditing for both Amazon and Heroku. By monitoring
    cost and resource utilization, Cloudability allows administrators to get a consistent
    cross-provider view of their environment. Although it focuses exclusively on Amazon,
    Ylastic is able to provide advanced auditing for orphan resources such as unattached
    EBS volumes. This approach capitalizes on adding value to IaaS platforms by tracking
    overreserved resources and automating complex functions. For example, our first
    model highlighted the lack of a simplified backup service in the AWS web console.
    To address this, Ylastic provides a managed backup service for both EBS volumes
    and AMI creation services. As figure 5.7 shows, Ylastic offers automated and scheduled
    tasks that can facilitate server management. In addition, it provides a graphical
    interface for service replication across multiple AWS regions. Given the fact
    that Amazon''s SLA is based on the ability of subscribers to redeploy services
    in another region, having a service that facilitates this process could be valuable.
    The automatic scalability of Heroku, the region replication services of Ylastic,
    and the resource use notification functions of Cloudability are all features that
    can save money and simplify IT environments by allowing libraries to scale their
    services on demand. In a traditional IT model, IT service capacity is centered
    around the notion of “n+1”—that is, always having more capacity than needed. In
    a well-managed cloud environment, services can scale up or down based on need
    or can be replicated into new regions when required, making it possible to provide
    services “just in time.”


    Although Ylastic charges for its basic service, some SaaS services do come at
    no cost for smaller users. Cloudability, for example, provides free cost-auditing
    services for subscribers with less than $2,500 in cloud expenditures. Likewise,
    cloud configuration/monitoring services like RightScale and monitoring services
    including Monitor.Us include a free subscription level. Nevertheless, free services
    may not be desirable given the lack of local control that often comes with them
    (see chapter 3).


    The benefits of this approach include selective redundancy across multiple cloud
    providers; automation of infrastructure-level tasks (e.g., backups); clearer understanding
    of cost and resource utilization; ability to support otherwise unavailable services
    via SaaS solutions; and automatic scaling, replication, and notification features
    that allow libraries to move away from the “just in case” models of IT planning
    to a “just in time” model. There are also some challenges with this approach.
    The added complexity of using multiple providers needs to'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'result in better service or a more durable or manageable system. Systems that
    rely on more than one provider to function run the risk of reduced stability and
    increased downtime as the SLAs of both vendors come into play. There is also a
    risk with turning key infrastructure functions such as backup over to SaaS options.
    This creates the same vendor lock-in risk discussed in our first model and requires
    that IT departments view these services as core elements of their IT infrastructure.
    For this reason, the services easiest to adopt in this environment are those whose
    temporary or permanent failure would not compromise the integrity of core library
    services. Finally, the SaaS services described in this model rely on IaaS vendor
    APIs and shared keys. Although it may ultimately make sense to use an SaaS service
    to benefit from economies of scale, it can be equally valuable to invest in developing
    local expertise for working with the command line tools instead.


    # APPROACH THREE:

    REDUNDANT AND SCALABLE

    MULTICLOUD DEPLOYMENTS


    Like our second approach, the third uses multiple providers and SaaS but adds
    abstracting service configuration and deployment to an SaaS provider. IaaS providers
    tend to do a good job creating a durable cloud framework but in exchange may focus
    less on simple IT administration services. Learning the API framework of IaaS
    providers is useful for ensuring a high-quality cloud infrastructure, but it can
    be difficult for a small IT environment to learn to work with multiple IaaS platforms
    using this approach.


    Approach three seeks to balance the benefits of using multiple cloud IaaS providers
    while limiting the challenges associated with managing services without focusing
    on which IaaS provider runs each service. Two resources discussed in chapter 5
    seek to serve this need: RightScale and KOALA. These services use a configuration
    and resource deployment platform to enable IT administrators to move services
    easily between cloud providers. This process means that certain services such
    as DNS resolution and server configuration tools are offloaded to these cloud
    services, but in exchange RightScale manages replication across multiple cloud
    providers. Figure 6.4 shows a potential configuration using RightScale to monitor
    and manage cloud services on Amazon, Rackspace, and a private cloud running Eucalyptus.
    It also shows the use of Cloudability to audit cost and resource utilization across
    these providers.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_156_0.png)


    # FIGURE 6.4


    # Multiple managed cloud services


    This model is agnostic to the types of services run on each cloud provider but
    instead focuses on distributed service replication. The model may still use the
    Amazon RDS service or may use a continual backup and replication service to host
    the database on different cloud providers. This is made possible through RightScale''s
    use of multicloud templates and images that automatically replicate or back up
    services onto multiple cloud systems. For example, RightScale publishes a managed
    MySQL database server that runs on multiple cloud platforms, backs up to Amazon
    S3 and Rackspace CloudFiles, and includes tools to assist with database recovery
    and firewall management. In this model the private cloud (e.g., Eucalyptus) may
    be used as the primary service or simply as a redundant service in case the other
    providers experience difficulties. This model does not include PaaS providers,
    but it would be possible to build PaaS solutions into this framework as well.


    An alternative approach to this configuration is to use KOALA as the federated
    system configuration and management tool. KOALA was designed as an open-source
    product that can be implemented in a PaaS environment using the Google'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Apps engine. KOALA focuses on different cloud services and is valuable because
    it provides a consistent management interface for both public cloud services like
    Amazon and private cloud services such as Eucalyptus. The KOALA framework would
    emphasize a common toolkit over managed images and replication services but would
    provide adapters with a simple-to-use platform that solved the API discrepancies
    between providers.


    The benefits of this approach include the highly distributed use of cloud vendors;
    automated replication of services and management of DNS that can be tied into
    monitoring tools; incorporation of private cloud functions; abstraction of server
    configuration from specific providers; and automatic configuration of enterprise-scale
    database and application services. At the same time, this distributed vendor model
    is more complex than the other approaches and may lead to overall higher costs.
    As seen in chapter 5, many IaaS providers are designing systems that tightly integrate
    with private cloud platforms through common APIs and cloud bursting functionality.
    This is a useful development, but libraries without large IT departments or with
    applications designed to run in traditional server environments may not be able
    to take advantage of these features.


    # APPROACH FOUR:

    DISTRIBUTED SAAS ENVIRONMENTS


    The three approaches reviewed above are based on the premise that libraries will
    turn to PaaS and IaaS solutions for specific services. This is not to say that
    library-specific SaaS solutions are not yet mature enough for widespread adoption.
    There are now many options for libraries seeking SaaS solutions for all of their
    services. Existing vendors are expanding both their use of cloud approaches and
    their product suites, and new companies have emerged to provide website, virtual
    reference, media hosting, and other information services. In fact, every key information
    system including the ILS, DAMS, link resolver, digital reference, discovery, resource
    fulfillment, electronic resource management systems, and websites are available
    in SaaS forms. In figure 6.5 a hypothetical library relies on a mix of commercial
    and consortial providers for system support. In each case, the system is offered
    in a managed SaaS environment, and the library is responsible for ensuring that
    systems that need to connect to each other do so. In addition, to provide some
    measure of resource tracking and monitoring ability the library uses an SaaS monitoring
    service to keep track of system uptime and'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Best Practice and Recommendations\n\n![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_158_0.png)\n\
    \nFigure 6.5  \nDistributed SaaS cloud services\n\ndeploys both its website and\
