- pgno: 47
  md: 'positive and negative among the platform types indicates that libraries are
    highly cost conscious when making IT service selections. There was also variation
    in how libraries used these platforms to either connect with or distance themselves
    from organizational IT. These issues appear to have little to do with the benefits
    or drawbacks of the platform itself and more to do with the internal operations
    of these organizations.


    # MODEL FOR EVALUATING VIRTUALIZED TECHNOLOGY ADOPTION IN LIBRARIES


    Our data show that libraries are using cloud and virtualized platforms in different
    ways, but that overall the view of these technologies is positive. Whereas our
    review of literature found a wide range of issues one should consider when moving
    to an internally or externally sourced virtual solution, participants in this
    study focused on issues of vendor compliance, cost-benefit analysis, and positive
    impacts of cloud computing on efficiency and flexibility rather than on security,
    business continuity, privacy, or liability. Likewise, the high frequency of libraries
    citing a positive view of virtualization and cloud platforms but expressing hesitancy
    given current local IT infrastructure points to a real need for library and perhaps
    organizational IT departments to expand their capacity to support cloud-based
    services. Some other common barriers to cloud adoption included the presence of
    legacy systems, vendor requirements that prevent virtualization or cloud adoption,
    internal organizational issues, current investment in technology, and lack of
    expertise. Despite these inhibiting factors, primary motivations tended to be
    perceived improvement in service, interest in resource (cost, staff time) efficiency,
    and interest in new services. These factors could prove to be good measures of
    whether a cloud or virtualized platform is a good fit for a given service and
    could certainly help libraries make educated decisions about the potential advantage
    or liability of cloud choices.


    Perhaps the most difficult part of moving to any IT solution is understanding
    how to weigh the positive and negative issues surrounding a platform. Some participants
    used their qualitative response to discuss a decision process or compare issues
    in this manner. For example, one library recognized the risk of vendor lock-in
    when moving to SaaS platforms but indicated that service efficiency outweighed
    the risk. Likewise, several libraries indicated interest in migrating but were
    moving slowly to be sure that they adopted a platform only after the market had
    tested its viability. Despite some rich exploration of organizational and'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'environmental issues, there was little discussion of the roles of networked
    data, open data, or open-source software in making IT decisions. Likewise, security
    and privacy issues, though often represented as key concerns in the literature
    (Grant 2011, 47; Velte et al. 2009, 35), were not discussed at the same level
    of specificity as technical and organizational issues. This emphasis may well
    be due to the population or the style of the questions, but it raises a good question
    about professional perceptions of legal, policy, and security concerns in virtualized
    and cloud computing environments.


    Although the primary goal of this research was to help identify a model that libraries
    could use to evaluate their own level of cloud adoption and consider the factors
    that are influencing their IT decisions, it is worth comparing our results with
    other cloud computing adoption studies. For example, a 2011 study by the Aberdeen
    Group found that among cloud adopters 68 percent had turned to private cloud and
    internal virtualization services and 50 percent had turned to SaaS solutions (Brink
    2011, 2). Like Brink’s study, the research presented in this chapter also found
    higher rates of private cloud and SaaS adoption and much lower rates of PaaS (22
    percent) and IaaS (31 percent) adoption. Overall, Brink found much higher overall
    adoption of cloud computing (81 percent) than was found in published studies that
    included assessment of library cloud computing use. For example, the Library Resource
    Guide report on funding priorities in libraries found an overall cloud computing
    adoption level of 7 percent in libraries in 2011 and 12 percent in 2012 (McKendrick
    2012). In contrast, we found an adoption rate over 90 percent.


    The Library Resource Guide survey also found that libraries were tending not to
    turn to IT as a means for saving money; only 13 percent of respondents indicated
    that they would reduce IT expenditures in 2011 and 11 percent in 2012. Similarly,
    that study found that only 1 percent of libraries were planning to increase spending
    on cloud computing in the coming year (McKendrick 2012, 11, 15).


    The variation between findings, at the least, points to a need for more formal
    study of cloud computing adoption rates. The results may also indicate a gap between
    library views of cloud computing and their movement in funding cloud initiatives.


    Our study did not focus on patron service requirements, but they may help explain
    why libraries are moving to new IT platforms. For example, the Public Library
    Funding and Technology Access Survey of 2010 reported expanded interest in a wide
    range of digital services including technology training, e-government services,
    licensed electronic resources, and digital reference services (Bertot et'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'al. 2011). Bertot and colleagues also found considerable increases in library
    IT service use in the previous year including public workstations, Wi-Fi, electronic
    collections, and training. This gap between patron demand demonstrated by Bertot
    and the allocation of resources discussed by McKendrick indicates that there may
    be room for libraries to leverage cloud computing and virtualization platforms
    to save resources and improve services.


    # CONCLUSION


    This survey of virtualization, cloud computing, and outsourcing adoption in libraries
    both underscores the current interest in cloud computing and virtualization and
    demonstrates which views are prevalent among adopters. The gaps found between
    library and IT literature and survey participants indicate that the questions
    about cloud computing and virtualization may be different for different audiences
    or perhaps are shifting as cloud computing matures. The survey also demonstrates
    a growing reliance on outsourced library IT as opposed to PaaS or IaaS approaches
    and indicates a slow but growing trend to migrate older and core library systems
    (e.g., the ILS) to these environments. These survey results should not be overgeneralized,
    but the evaluative model represented in figure 2.1 and the grouped themes presented
    in tables 2.4 and 2.5 may help libraries understand their own IT environment in
    more detail.


