    # Configuration


    Because this section focuses on combining SaaS, PaaS, and IaaS services to create
    an IT infrastructure, it is worth spending some time exploring which services
    need to be present in a cloud-based IT environment. These services include application
    monitoring, automatic configuration, cross-system backup/restoration, IT management
    documentation, and service and cost auditing. Although it is unlikely that libraries
    or IT departments are in the position to put all of these elements into place
    before adopting cloud-based services, they should ensure that these services are
    in place before moving toward complex IT service deployments in the cloud. For
    high-quality and sustainable IT service, these aspects must be accomplished:


    +   - Optimize monitoring, backup, restoration, auditing, and service documentation
    functions; ensure that these services are bulletproof.

    +   - Implement service documentation and ticket management systems on systems
    separate from the main service system. When production systems experience downtime,
    having access to documentation and management tools is essential to calm and quick
    service restoration.

    +   - Design a cloud infrastructure that balances the need to replicate production
    servers on multiple providers with the need to keep service architecture simple.
    Although it can be enticing to replicate services on multiple platforms, it is
    worth considering whether this approach will lead to more uptime or simply more
    cost and IT management work.


    Whereas many providers focus on offering a specific platform or enable wider use
    of infrastructure level services, a few providers also offer IT management services
    that automate or simplify the process of working with core infrastructure-level
    components. For organizations that may need IaaS platforms for specific services,
    it may be worth identifying SaaS providers for monitoring, auditing, and'
