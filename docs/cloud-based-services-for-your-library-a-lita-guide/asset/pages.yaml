- pgno: 82
  md: '# Software as a Service and Platform as a Service


    In this chapter we examine three specific forms of cloud computing and virtualization:
    SaaS applications by library-specific providers, PaaS using traditional server-type
    hosting, and PaaS using dedicated application hosting. I discuss providers that
    exemplify each model and evaluate each using four broad criteria: expertise required
    to implement and manage the service; service complexity, sustainability, and durability;
    service cost; and service migration and portability.


    Before exploring each of these concepts in depth, it is useful to define a few
    technical concepts:


    Containers: PaaS solutions deploy services in a construct called a container or
    environment. This construct defines the available resources, security, and scalability
    associated with a service distribution. Although containers may be started, or
    “spun-up,” this does not mean that they are running on distinct server resources.


    Deployments/distributions: PaaS and SaaS environments offer scalability and simplicity
    by bundling services into a package that can be deployed as a whole on the IT
    infrastructure. PaaS services specifically tend to support the concept of version
    control in conjunction with distributions, which makes it easy to test multiple
    versions of the same service.


    Development toolkit: PaaS and SaaS services may offer some command line or direct
    application programming interface (API) access to the creation,'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'deployment, and decommissioning functions of a service. These may be offered
    through a development toolkit that has been integrated into a development environment
    (e.g., Eclipse) or distribution platform (e.g., Git).


    **Elasticity:** Elasticity refers to the ability of an IT service to scale up
    or down in response to demand. Elasticity should be evaluated for both PaaS and
    SaaS services to ensure that the platform selected is both properly sized and
    scalable for an organization''s size.


    **Environment:** Often discussed in the context of containers, environments define
    the software stack on which services in a PaaS service run. Environments are typically
    defined by their scripting/programming platform (e.g., PHP, Java, Ruby) and web
    server platform (e.g., Apache, Nginx, Tomcat).


    **Events:** SaaS, PaaS, and IaaS services should offer some form of event logging
    as part of the service. This tends to be a log of the actions taken and system
    response to those actions.


    **Plug-in/add-on:** SaaS and PaaS environments make value-added services available
    as resources or add-ons in a pluggable application architecture. Plug-ins are
    designed to be added to a service with minimal configuration and may include database,
    messaging, or logging services.


    **Repository:** In PaaS environments, this term tends to refer to software source
    repositories for developed code. The most popular distribution repository for
    PaaS solutions explored in this book is Git as implemented on a hosted service
    called github.


    **Version control:** PaaS platforms tend to rely on version control to ensure
    the ability to control distributions easily. PaaS providers typically support
    distribution of a software service via a plug-in to popular version control platforms.


    # SAAS LIBRARY SOLUTIONS


    SaaS solutions are often attractive to libraries seeking to offload the risk,
    expertise, and management issues associated with IT services and are increasingly
    popular'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'given the use of centrally managed data sets (e.g., link resolver knowledge
    base and bibliographic databases). Libraries are turning to cloud platforms for
    data-intensive and new services such as link resolvers, digital reference services,
    research guides, and large-scale discovery systems, with slower adoption of complex
    systems such as online catalogs, websites, and digital asset management systems;
    in general, the tendency is to adopt SaaS solutions. And although SaaS solutions
    clearly provide benefits—such as enterprise level IT, fast implementation, and
    minimized impact on library IT staff—they may be more expensive, offer limited
    customization (compared to PaaS and IaaS solutions), and feature long-term commitments
    not found in other cloud service platforms. The SaaS library-specific solutions
    discussed below reflect these characteristics, which are markedly different from
    the examples discussed for PaaS and IaaS solutions; for this reason, case studies
    here are grouped into system types rather than vendor platforms.


    # SaaS Provider Examples


    More so than other cloud solutions in this chapter, SaaS solutions tend to focus
    on library-specific applications. Although there are nonlibrary-specific services,
    such as hosted content management systems (e.g., wordpress.com) and customer relations
    systems (e.g., Salesforce.com), these systems are not as widely adopted as library-specific
    SaaS services. Many of the services discussed here more closely fit the broad
    terms hosted and outsourced; their inclusion here reflects the idea that they
    are made available without any infrastructure, platform, or application-level
    management requirements. In general, SaaS is distinguished from PaaS in that it
    more closely fits the “turnkey” approach to systems development.


    A good taxonomy of library system types and vendors can be drawn from Breeding’s
    website survey of library automation (www.librarytechnology.org). Breeding categorizes
    systems into eleven types: library services platforms, discovery products and
    services, federated search, mobile products, digital library management systems,
    electronic resource management support, institutional repositories, OpenURL linking
    applications, resource sharing systems, RFID systems, and archives management
    systems. In addition to these, libraries tend to use knowledge bases, digital
    reference service tools, content management systems, and, of course, subscriptions
    to a host of aggregated information resources that are delivered in an SaaS environment.
    This review examines systems from three broad categories: next generation cloud-based
    ILS, DAMS, and public-facing services.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Next Generation Cloud-Based ILS


    It is increasingly common to see ILS vendors advertize cloud computing as a key
    aspect of their ILS. This may include a wholly cloud-based solution or simply
    virtualized hosting or knowledge base synchronization. By far the most common
    cloud feature is the provision of SaaS hosting for traditional ILS catalogs by
    vendors and ILS hosting companies. Hosting for ILS systems can follow either a
    PaaS or SaaS model, depending on the division of management tasks between provider
    and customer. These systems are typically implemented as dedicated machines or
    on a virtualized server that is accessible only by the service provider and customer.
    In addition to commercial ILS vendors, there are also cloud-based support services
    for open-source ILS systems including Evergreen (http://open-ils.org) and Koha
    (http://koha.org). There are also consortiums that have used the open-source ILS
    platform as an opportunity to engage in statewide hosting. Of note are the Georgia
    Pines system (http://gapines.org) and an Indiana consortium of libraries (www.in.gov/library/evergreen.htm)
    that is using Evergreen on virtualized platforms.


    SaaS hosting of traditional ILS platforms is different from the new comprehensive
    resource management platforms (CRMPs). These resource management systems more
    closely model a web-service-based SaaS environment. They often feature a shared
    bibliographic database, emphasize interoperability among systems and data sets,
    and provide access to both public and staff tools via graphical web services.
    Key vendors in this market include OCLC (WorldShare Management Services, www.oclc.org/webscale/),
    Ex-Libris (Alma, www.exlibrisgroup.com/category/AlmaOverview), and SerialsSolutions
    (Inota, www.serialssolutions.com/en/services/intota). OCLC’s foray into ILS and
    CRMP platforms comes from its long history of providing network-based services
    for libraries. Its introduction of a cloud-based ILS in 2010 marked a shift from
    providing elemental services such as MARC record management and authority services
    to providing comprehensive librarywide services. Recent examples of this service
    include systems at Pepperdine (Bryant and Ye 2012) and the University of Delaware
    (OCLC 2012).


    Just as the information industry has found considerable value in data hosting
    and ownership, library automation vendors have found not only that libraries are
    willing to pay for a managed, cloud-based knowledge base but that this knowledge
    base can be repurposed for a variety of uses. OCLC’s product not only leverages
    the existing bibliographic and holdings database it has built over the past forty
    years but also uses community-created programs and externally subscribed data
    sets to bring together the features of the traditional ILS and the new management
    demands brought on by electronic resources. The result is a new generation of'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Digital Archival Management Systems


    systems that work only as cloud applications. As our exploration of PaaS and IaaS
    services shows, shifting away from wholly traditional IT practice to “webscale”
    means blurring the lines between individual and community databases and data sets,
    redesigning services to optimize web interfaces, and embracing community-shared
    content.


    Cloud-based digital archival management systems (DAMS) include products such as
    ContentDM (www.oclc.org/contentdm/), hosted open-source archiving services such
    as DuraCloud (http://duracloud.org), and DSpace hosting from Open Repository (www.openrepository.com),
    as well as digital publishing tools such as Omeka (http://omeka.net). As with
    ILS systems, commercial offerings are available as hosted services but are not
    necessarily designed as an SaaS platform. SaaS cloud support for these systems
    has not yet reached the maturity of ILS, CRMS, and other systems, perhaps due
    to the complexity and rapid evolution of DAMS platforms. At the same time, the
    DAMS poses challenges for libraries due to its relative complexity. In the DAMS
    open-source market it has become more common for development communities to publish
    test platforms using client-based virtual machines. These machine images are typically
    not designed for production installation because they hard-code passwords and
    integrate database, administrative, and public service functions into a single
    virtual machine. They are, however, an increasingly popular way for open-source
    projects to connect with potential adopters. Systems including Islandora (http://islandora.ca),
    Archivematica (http://archivematica.org), and DAITSS Digital Preservation Repository
    Software (http://daitss.fcla.edu) are available as simple downloads and can easily
    be imported into a virtual machine environment.


    As use of digital preservation services has evolved, SaaS options for storage,
    bit checking, and other preservation services have been developed to help libraries
    manage digital objects. For example DuraCloud (http://duracloud.net) offers cloud
    broker, data preservation, data replication, and online sharing services for libraries
    based on the DSpace and Fedora platforms. Both DSpace and Fedora have built-in
    services that facilitate integration with DuraCloud.


    Whereas DuraCloud focuses on preservation services, other platforms such as Omeka
    and Viewshare (http://viewshare.org) provide a platform for easy-to-use hosted
    digital publishing. Available both as a downloadable open-source application and
    as a hosted SaaS cloud solution, Omeka features storage, multiple publishing sites,
    predesigned functional plug-ins (e.g., geolocation, social bookmarking,'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Google Analytics), and predesigned interface themes on yearly subscription
    terms. Like Omeka, Viewshare is available both as an open-source platform, called
    Recollection (http://sourceforge.net/projects/loc-recollect/), and as an SaaS-hosted
    cloud platform. Unlike Omeka, Viewshare focuses on complex metadata and linked
    data models. Thus it features robust data import, cleanup, and linking services
    similar in scope to other products such as Google Refine (http://google.com/refine)
    or Google Fusion Tables (www.google.com/fusiontables/Home/).


    # Public-Facing Services


    Libraries are increasingly turning to SaaS options for public-facing discovery,
    reference, and fulfillment services. Discovery platforms such as SerialsSolutions
    Summon, WorldCat Local (www.oclc.org/worldcatlocal/), and EBSCO Discovery Service
    (www.ebscohost.com/discovery) offer an integrated search platform that includes
    cloud-indexed print and electronic (licensed) resources. Although libraries have
    yet to abandon traditional catalogs entirely, the relative popularity of these
    new systems poses real challenges to locally managed discovery systems including
    the OPAC.


    In addition to discovery services, libraries are turning to virtualized reference
    services such as OCLC’s QuestionPoint (http://questionpoint.org) or SpringShare’s
    LibAnswers (http://springshare.com/libanswers/) or to statewide services such
    as OhioLINK’s KnowItNow service (http://knowitnow.org). Libraries are also turning
    to self-service information portals such as LibGuides (http://libguides.com) and
    are leveraging consumer-grade multimedia services such as YouTube and Vimeo to
    integrate streaming video into online information resources. By deconstructing
    a complex information service into SaaS-based discrete components, librarians
    are able to create complex information services with little overhead. Companies
    including SpringShare are working to provide a diverse set of web services that
    fit this approach and could easily fill in the gaps left from enterprise DAMS
    and ILS. The most common form this approach takes is video-based instruction or
    tutorials. For example, Loo (2010) created and published a series of video tutorials
    on doing research using PubChem. The video series was recorded using simple client-based
    screen casting, is hosted on YouTube, and is tightly integrated into multiple
    web services on an as-needed basis.


    As our review of SaaS solutions illustrates, it is realistic for libraries to
    assemble an entire IT suite using SaaS components. Each of the services represented
    in figure 4.1 has multiple robust SaaS cloud options, though options may be limited.
    It is worth noting that, although there are library-specific commercial providers
    in this'
