- pgno: 89
  md: 'a community-based virtualization platform. Lyrasis started its work in virtualized
    hosting of these services for libraries based on the results of a member survey
    that found both an interest in open-source software and a need from libraries
    for infrastructure and hosting support for these software platforms. This work,
    which has also grown into an open-source site registry known as FOSS4LIB (http://foss4lib.org),
    has been directed at supporting library adoption of open-source software and filling
    member demand for specific platform needs.


    It is less typical for providers like Lyrasis to provide on-demand or rapidly
    elastic services. Instead, Lyrasis works with clients to define a customized SLA,
    negotiate specific access terms and application management agreements, and work
    with more traditional payment and subscription terms than may be available in
    other cloud or virtualized platforms. These techniques are much more common from
    community cloud providers such as Lyrasis. These benefits can be a motivating
    factor for libraries seeking to leverage cloud-based and virtualized resources
    to implement new services or manage existing services. Another important advantage
    of community-specific cloud and virtualization providers of open-source software
    is improved ability to migrate between providers. For example, FOSS4LIB has four
    providers listed for the open-source ILS Koha, and Evergreen has multiple providers.
    Libraries seeking to change providers would likely not have significant issues
    with data migration and service setup as libraries faced with choosing new systems
    in addition to new providers.


    # Issues


    Despite the fact that there are a wide range of SaaS platforms for libraries seeking
    to move to the cloud, adoption of SaaS platforms is not without its own issues.
    Moving large elements of IT services to SaaS solutions can lead to a fragmented
    IT environment in which it is difficult to make systems work well together. This
    can lead to loss of data but more likely to loss of service control and data ownership
    or access. Likewise, as libraries move toward more data-rich systems, their ability
    to migrate away from these solutions diminishes. Because there are few standards
    governing the exiting of a library from these cloud services, vendor lock-in is
    becoming a significant concern, particularly given the fact that a new breed of
    tightly integrated knowledge bases and service layers is being developed and licensed
    to libraries as “black boxes.” In this licensing model it is easy for libraries
    to lose control of the resources that are included and excluded in the subscription.
    Libraries have become tolerant of this situation, but the growing centrality of'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'subscription resources means that these shifts are poised to have greater impact
    in the coming years.


    Whether cost is an enabling or inhibiting factor depends on a wide range of issues
    including subscription scale, negotiations, local firm/soft costs, and other IT
    infrastructure elements. In fact, many libraries are using free services to test
    and in some cases deploy staff and public-facing services. Although free services
    are appealing, if libraries adopt them for production-level work they also need
    to engage in a careful study of the terms of use, exit options, and security system.
    There are, of course, cloud services such as Facebook, Flickr, and YouTube that
    are already common in libraries and are known for offering somewhat controversial
    terms of service to their users.


    As libraries opt to spend more resources on outsourced or SaaS services as opposed
    to developing and maintaining these services in-house, they create an environment
    in which they may not have the expertise to migrate to new systems or completely
    capitalize on current systems. There are companies that offer IT support in an
    as-a-service subscription environment, but these services are often focused on
    common IT services such as network and client support services. Further, as libraries
    shift to SaaS solutions they increasingly need monitoring and auditing services
    that help them ensure that they are both receiving all of their subscribed services
    and in compliance with organizational policy and legal regulations. As of now
    there is no service that offers this type of support and few models in the library
    world that would support such as service. We see some examples of these types
    of services in chapter 5 as we explore the implementation of IaaS solutions.


    # Expertise Required


    Expertise in adopting and managing SaaS solutions is rather different from that
    of other platforms. Familiarity with license negotiation and organizational policy
    becomes a key issue. By turning to a vendor for a wholly hosted service, libraries
    open themselves up to more legal and privacy issues and need a more solid foundation
    in negotiating skill. In addition, the key IT skills required for libraries that
    make extensive use of SaaS solutions include the ability to design and manage
    metadata and web services that enable system interoperability. This may include
    working with campus IT to enable system authentication or access and is likely
    to include staff training and project management tasks. Finally, SaaS solutions
    often require libraries to have a firm understanding of authentication, access
    (e.g., proxy access for off-campus users), service management, and problem resolution
    processes and third-party negotiation.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Service Complexity, Sustainability, and Durability


    SaaS solutions are often selected because they offer a highly functional service
    with simple administrative requirements. By moving the responsibility for system
    uptime, durability, security, and upgrades to the vendor, the library removes
    the need to manage these tasks itself. The greatest source of complexity for SaaS
    systems often comes when trying to connect multiple systems and vendors, or trying
    to implement new services that leverage the abilities of an SaaS service. In these
    cases it may be necessary to write data transformation or transfer applications
    that pose their own complex problems.


    Another key advantage to SaaS services is that the vendor providing the service
    assures their durability. A key risk in this area is the sustainability of a service
    and the limited number of options for libraries that adopt SaaS services that
    eventually disappear. Though less common for paid services, free services often
    change terms or functions and in some cases disappear altogether. Thus libraries
    should be cautious with regards to using SaaS services that offer no assurance
    of long-term stability or are still in the development stage.


    # Service Cost


    Calculating costs and ROI for SaaS services can be easier than with PaaS and IaaS
    services, given the fact that SaaS services often feature a longer subscription
    term (e.g., year-to-year terms rather than month-to-month terms). However, it
    can be difficult to compare the costs of SaaS services with those of PaaS, IaaS,
    and their nonvirtualized counterparts, given the difficulty of identifying hidden
    or soft costs. Libraries are, however, likely to have expertise in handling these
    types of subscription models and should be able to project costs over a multiyear
    period. This longer-term cost projection can be useful in helping libraries decide
    if an SaaS solution is a better fit than other alternatives.


    # Service Portability and Interoperability


    The ability to integrate SaaS solutions with other systems depends largely on
    the functions associated with the systems. In larger library-focused SaaS providers
    it is increasingly common to implement APIs that enable access to data and back-end
    service elements. Migrating away from SaaS solutions can be difficult because
    the process of acquiring and managing the data associated with the service can
    be made more difficult if the organization has lost (or never had) the capacity
    to work with that data.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# PAAS USING TRADITIONAL SERVER-TYPE HOSTING


    PaaS offers libraries seeking customized solutions an opportunity to implement
    web-based services without having to understand the complex inner workings of
    system administration. Traditional PaaS solutions offer varying levels of access
    to an IT system and tend to feature a form of LAMP (Linux, Apache, MySQL, and
    PHP) support. PaaS using a traditional server hosting platform tends to automate
    system management but often does not include dedicated server access, root access,
    or the ability to install new system-level tools (e.g., database platforms, scripting
    languages). Because of this, PaaS solutions should be carefully evaluated to ensure
    that the services supported match those required and that there is support for
    system backups, sufficient security measures at the vendor level, and no privacy
    or data ownership issues raised by using the service.


    The server-style solutions featured in this section differ from other PaaS solutions
    in that they focus on providing limited computational power and storage space
    but a relatively wide range of IT services. These services often include database
    management, firewall protection, domain name system (DNS) resolution, e-mail hosting,
    and other core IT services. These server-based solutions feature a graphical administrative
    interface (e.g., cPanel) platform that simplifies the implementation and management
    of web services (e.g., WordPress, database applications, custom-developed PHP,
    Perl, or Python applications). Often these solutions are based on some form of
    a LAMP environment or some other common web application framework (Ruby on Rails,
    Python/Django). These solutions provide a robust IT framework that is best suited
    to website hosting and customized applications but can also be adapted to run
    more complex applications such as small-scale library catalogs, DAMSs, and other
    library-specific services. These solutions can be grouped into one of three types:
    shared web hosting, virtual private server hosting, and dedicated server hosting.
    Each of these types has strengths and weaknesses.


    # Service Types and Providers


    PaaS providers offer a good environment for website hosting, content management
    system hosting, development of web services using specific resources, and ad-hoc
    use of systems for development or other single-purpose uses. Commercial providers
    include DreamHost (http://dreamhost.com), HostMonster (http://hostmonster.com),
    and BlueHost (http://bluehost.com), as well as services run specifically'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'for library environments such as LISHost. These systems are particularly useful
    for small to medium-sized libraries, libraries exploring virtualized computing
    for the first time, and libraries seeking to empower staff who have an IT-focused
    skill set but limited time. The graphical control panel used by PaaS server providers
    simplifies configuration tasks and eliminates the need to take on infrastructure-level
    IT management tasks such as operating system maintenance, hardware management,
    and LAMP stack maintenance. At the same time, it preserves the ability to configure
    back-end applications. Not every vendor offers these functions, however, and the
    variation of services and options can make it difficult to select a provider.


    Generally speaking, it is important to focus on required features (e.g., hosting
    functionality, account/data privacy, server location and data center quality,
    guaranteed capacity, and long-term company viability) and select a solution that
    fits those needs. PaaS server providers may oversell capacity, assuring customers
    “unlimited data and bandwidth,” but these assurances typically come with caveats
    and restrictions on content or hosting services (e.g., no streaming of video,
    no long-term object storage) that reduce the value of these features. Low-cost
    PaaS providers tend to avoid strict SLA agreements but are likely to provide a
    “service-level indication” without any clauses for compensation for downtime or
    any firm guarantee of uptime. More expensive PaaS providers support elaborated
    SLAs, expand access to the server to include higher levels of administrative access
    (e.g., root or super-user access), and shy away from overselling capacity, instead
    leasing a specific amount of disk space, CPU capacity, and application memory
    to subscribers. The following three sections explore three broad types of PaaS
    providers in more detail.


    # Shared Virtual Server


    A shared virtual server entitles you to reserved storage resources on a virtualized
    platform. These providers may feature “unlimited” disk space and bandwidth, but
    review of their SLAs show that the disk space is limited to the provision of web
    services hosted on the box and that they do not include backups or storage for
    file serving purposes. In addition, these providers may restrict CPU use and may
    not guarantee available memory, making these solutions best suited for website
    services, small-scale database hosting, or other services that do not consume
    large amounts of CPU or RAM. Because of these features, shared virtual servers
    come with the highest amount of risk in a PaaS environment but at the lowest cost.
    In shared virtual server environments it can be difficult to determine the robustness'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'or geographic/legal location of the data center, and access in these environments
    is typically limited to web-based control panels or SSH.


    # Dedicated Virtual Server


    A dedicated virtual server is a server to which a user account has exclusive access.
    Dedicated virtual servers are likely to have a web-based management console and
    are more likely to allow substantial access to the system for changes to application
    configuration and versions. At the same time, a dedicated virtual server is likely
    to be managed at the operating system level by the host company and to feature
    customized support including tutorials, guides, and even real-time assistance.
    Dedicated virtual servers include CPU, memory, and disk space allocations along
    with a level of separation from users not found in shared virtual server environments.
    As with shared virtual server environments, care should be taken to understand
    fully the security, privacy, replication, and management features of a dedicated
    virtual server environment. Legal and technical risks associated with running
    in a dedicated virtual server environment mean that it is important for providers
    to have automatic failover capabilities to ensure that a dedicated virtual server
    is not tied to specific hardware.


    Dedicated virtual server environments are capable of running small-scale library-specific
    applications but are likely too small for discovery or DAMS services that require
    significant memory and disk storage. Dedicated virtual server environments are
    best suited for libraries with specific needs not met by hosting in a shared virtual
    server environment but that also do not want the cost or expertise requirements
    that come with dedicated server or IaaS solutions.


    # Dedicated Physical Server


    Dedicated physical servers more closely match a managed data center model than
    the other cloud computing and virtualization models discussed in this book. Many
    vendors offer dedicated physical servers as an alternative for organizations seeking
    more capacity or isolation but in a managed environment. This management level
    is likely to include web-based control panels and super-user access to the machine
    and does have even higher capacity than dedicated virtual servers. The physical
    isolation is likely to come with virtual network isolation as well, so that one''s
    server is not accessible by other customers in the data center. This can be an
    advantage if there are significant concerns over security and privacy, but these
    advantages are most likely outweighed by the risks associated with being tied
    to specific IT hardware. For organizations seeking the benefits of physical isolation
    in an IaaS'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'cloud environment, private clouds hosted inside the organization or subscription-based
    private clouds such as Amazon’s virtual private server environment are more robust
    options.


    Libraries may desire dedicated physical servers if cost, subscriber privacy, or
    other issues outweigh the anticipated benefits of cloud providers. Libraries that
    want to operate on dedicated physical servers may also want to consider options
    in which the library purchases hardware and pays a subscription fee for hosting
    its hardware in a data center. This approach often comes with higher levels of
    service, which may include forms of system administration for additional fees,
    but also enables libraries to benefit from robust data center features such as
    network redundancy, environment quality, and off-site backup redundancy without
    giving up the benefits of owning the hardware on which their web services operate.
    This may be particularly attractive if libraries have adopted an IT service that
    operates on a platform with which they are not familiar.


    It is worth noting that other PaaS solutions such as Salesforce, Heroku, or GoogleApps
    are not included in the three types of PaaS hosting mentioned above. These solutions
    focus on supporting highly customized information services such as customer management,
    site publishing, and content management without the overhead of server management
    tasks. As a result, these features are more scalable than the server-focused solutions
    mentioned here but require a tighter coupling between application and hosting
    environment. These PaaS solutions are reviewed later in this chapter.


    When you are selecting a provider it is important to look for objective reviews
    of each company and to choose a provider based on elements important to your local
    organization. These elements likely include supported server software, platform
    security, system management tasks, and SLA options. Figure 4.2 provides an initial
    checklist that can be used to compare PaaS providers. In addition, it is important
    to compare real-world costs of these solutions, a process that can be difficult
    given the fact that some providers charge extra for services such as system backup,
    SSL support, and dedicated IP addresses (see table 4.1 in “Service Cost,” below)


    # Issues


    Although server-focused PaaS solutions offer a simple introduction to cloud computing,
    they may not scale well in large IT environments and, as a result, can pose challenges
    for long-term use. This section focuses on relatively customizable PaaS servers
    that feature a fixed capacity along with web-based administrative'
  merge: -1
  img_proc: true
