  md: '# Acknowledgments


    The motivation to write this book began with the idea that libraries are best
    served when their adoption of IT matches the speed and flexibility of their service
    needs. In exploring how to accomplish this using cloud computing, I relied on
    the knowledge of my fellow librarians, the know-how and patience of IT experts,
    and the support of my colleagues at the Z. Smith Reynolds Library at Wake Forest
    University. Special thanks go to Tim Mitchell, Kevin Gilbertson, and Barry Davis,
    who all took the leap into cloud computing with me and who made the cloud a success
    at our library. Thank you as well to Susan Smith, Lynn Sutton, and the entire
    staff and faculty of the library, whose trust of our team made it all possible.
    Thanks go to my helpful colleagues from across the Wake Forest campus, including
    Paul Whitener, Jeremy Kindy, Seth Stein, and Odi Lancu, whose knowledge, patience,
    and collaboration made our experiment with cloud computing a reality.


    In researching for and writing this book I relied on the expertise and feedback
    of my conference workshop participants and the members of the online library communities,
    including Code4Lib and LITA. Thank you for your new ideas and technical advice.
    Thank you also to the participants of the adoption survey, who provided me with
    a wider understanding of cloud adoption in libraries. I also had the chance to
    talk with communities from around the country about my work and am grateful to
    them for listening and for the generosity of their feedback. Many thanks go to
    my editor, Marta Deyrup, whose patience and guidance kept this book moving through
    a world of change and to the Neal-Schuman team who got this book to press. Thanks
    also go to my colleagues at the College of Information Studies at the University
    of Maryland, who helped me keep writing as I started a new chapter of my career.
    Finally, I could not have written this book without the inspiration and support
    of Jeffery Loo, whose mentorship, capacity for help, and uncanny ability to create
    an insightful conclusion from a jumble of ideas made this book what it is.'
  merge: -1
  img_proc: true
