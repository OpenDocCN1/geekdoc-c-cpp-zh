- pgno: 142
  md: 'DAMS in an IaaS environment may be less expensive and offer more future migration
    options than going with SaaS options. Similarly, though the cost of IaaS solutions
    may appear high for the first service, with proper use of management tools organizations
    can adopt multiple IaaS-based services at a much lower cost and with less organizational
    fragmentation than adopting multiple SaaS services.


    # Expertise Required


    In addition to requiring the skills discussed in the previous sections, personnel
    expecting to really capitalize on cloud services using IaaS resources need to
    understand fully system architecture in the cloud. This means understanding how
    to configure servers automatically, how to set up load balancing services, and
    how to set up durable database and storage services while capitalizing on creating
    disposable servers. Coming up with a distributed and durable cloud architecture
    may seem overwhelming at first, but there are a variety of documented models and
    setup scripts discussed by the providers discussed in this chapter. In addition,
    there are valuable case studies from companies such as SlideShare (Mayank 2011)
    and Netflix (Cockcroft et al. 2011) that discuss the process of regular testing
    of infrastructure to ensure that the cloud environment is durable and secure.


    # Service Complexity, Sustainability, and Durability


    Though IT services in this environment are necessarily complex, the tradeoff for
    simpler ongoing server management is worth noting. For example, institutions that
    can turn to a hosted database service (e.g., Amazon RDS) can offload the work
    required to ensure high-quality uptime for their database services. This may lead
    to a more complex configuration but also pays off in the form of operational simplicity.
    For libraries seeking to make IT management an ongoing operation that persists
    outside of personnel and organizational change, implementing and documenting processes
    in actionable systems (e.g., automatic configuration tools) as opposed to documentation
    systems (e.g., wikis, blogs, knowledge management tools) benefit the organization
    long term.


    Although libraries that implement cloud services on multiple providers must also
    come to terms with the legal and organizational policy issues associated with
    adoption, it also means that they can realistically look toward their cloud provider
    solution to be a longer-term solution. With the proper IT and operational support,
    a multifaceted cloud solution offers better sustainability and durability than
    any single model, largely due to the fact that the library is in more control
    of the service and can migrate portions of it without migrating the entire system.'
