    # Service Portability and Interoperability


    The complex customization requirements of dedicated PaaS solutions mean that they
    can be difficult to migrate to new providers. Certain platforms such as Heroku
    and Amazon’s Elastic Beanstalk allow application packages to be deployed on other
    platforms. In contrast, platforms that use a customized technology stack such
    as Google App Engine make migrating to another platform difficult if not impossible
    without additional application development.


    # CONCLUSION


    This chapter explores two broad platform types important to consider when exploring
    cloud computing and virtualization. The review of SaaS providers focuses largely
    on library-specific solutions but also highlights SaaS services for broader information
    uses. Providers such as WordPress and Salesforce may very well be suitable solutions
    for libraries but should be considered within the overall IT framework required.
    Indeed, if libraries are seeking to use SaaS solutions to replace all of their
    information service infrastructure, these options should be considered as ways
    of bridging the gap between library-specific and general web-based information
    services. At the very least, however, libraries that turn to SaaS solutions need
    to consider how they plan to monitor these services, manage contact and access
    information, and prepare for migration away from SaaS providers.


    This chapter also explores two forms of PaaS solutions—server based and application
    based. Both solutions are excellent choices for locally developed'
