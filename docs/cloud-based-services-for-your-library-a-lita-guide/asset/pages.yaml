    on specific software elements and versions or on multiple configuration elements
    (e.g., DNS, database, firewall, web server) are much more difficult to migrate
    when compared to other cloud platforms.


    # USING PAAS SOLUTIONS AS AN APPLICATION PLATFORM


    In this approach to PaaS, services are geared not toward providing a broad web-hosting
    platform but rather toward supporting a specific technology stack hosting specific
    web services. Examples include Google Apps Engine, Heroku, Salesforce, and certain
    elements of Amazon Web Services (AWS) (e.g., Elastic Beanstalk). These services
    focus on the “single-platform” method, often supporting limited web application
    frameworks, databases, and database connection methods. Though the IT stack is
    limited, the service can provide a more robust cloud infrastructure, ability to
    scale in response to user requests, and ability to integrate closely with a development
    environment. For example, Google Apps Engine restricts the developer to versions
    of Java, Python, and Go and further limits development options by supporting only
    an NoSQL database on its platform. These tradeoffs enable Google to offer a highly
    scalable service at very low cost to subscribers. Likewise, Amazon Elastic Beanstalk
    supports limited deployment frameworks including Java, PHP, Python, and .NET and
    relies on databases and persistent data to run on other parts of the AWS service
    infrastructure. By supporting a specific type of deployment, Amazon is able to
    incorporate the benefits of PaaS environments such as replication and automatic
    scaling in response to service load. Likewise, by supporting a specific approach
    to packaging and deploying applications, Elastic Beanstalk enables support version
    control over the application, enabling easy testing and deployment of new application
    versions.'
