- pgno: 32
  md: '# The Landscape of Cloud Computing and Virtualization Adoption


    Libraries are at a crossroads in IT adoption because of rapid changes in purchasing,
    collection development, information management, and public service expectations
    (Attis et al. 2012). These changes have been accompanied by changing approaches
    to metadata standards, authority control, and information management systems (Seikel
    and Steele 2011). The shift in IT environments has included the proliferation
    of systems for different services (e.g., digital reference, resource management,
    digital libraries) and an emergence of new vendor and open-source community services
    that are virtualized, hosted, or cloud-based (Breeding 2011). In particular, LIS
    vendors are redefining their services to leverage cloud computing in the “next-generation”
    of LIS systems. In addition to the vendor-driven shift of the ILS to the cloud,
    libraries are turning to cloud computing to address a wider range of information
    system needs.


    Much of the research in library adoption of cloud computing focuses on specific
    uses or platforms. For example, Malpas (2011) explored the role of cloud computing
    in large-scale digital text collections and Schonfeld and Housewright (2010) explored
    the impact of “network-scale” learning and resource use on academic teaching and
    scholarship. Both studies found a growing reliance on network-based technologies
    and Internet-accessible digital text collections by both academic libraries and
    their constituents. Some research has focused on how to incorporate cloud computing
    into IT planning (Reeves 2010), and academic institutions are increasingly incorporating
    virtualized technologies in strategic plans (Furman University 2011). In addition
    to organization-focused studies,'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'other research is finding that library patrons including students in academic
    environments and the general public are increasingly adopting cloud-based, social,
    and mobile information technologies (Anderson and Rainie 2010; Smith 2010). These
    studies highlight issues of perceived value, organizational impact, and environmental
    influence in relation to cloud computing adoption. At the same time, they highlight
    many of the challenges associated with this process including technical, legal,
    operational, and financial pressures.


    Although there have been several library IT adoption surveys, including Breeding’s
    research on library automation systems (www.librarytechnology.org), there has
    been little research that examines virtualized and cloud computing adoption across
    the range of library IT services. On the basis of a survey conducted in 2011,
    this chapter seeks to close this gap and identify factors that influence cloud
    adoption.


    # SURVEY FRAMEWORK


    Understanding the factors that enable and inhibit IT change can be an important
    element of change management and can facilitate the exploration of tools and their
    fit with your library. There are several ways to approach this discussion, but
    two models in particular inform organizational understanding of technology adoption:
    the “technology acceptance model” (TAM; Davis 1989) and the “technology, organization
    and environments model” (TOE; Tornatzky et al. 1990). These models provide frameworks
    for understanding the relationship between technologies and their use by individuals
    or organizations. Another model often used in technology adoption studies is “diffusion
    of innovation theory” (Rogers 2003), which explores technology adoption by examining
    factors including advantage, compatibility with other systems, and system complexity
    and focuses on qualifying adoption patterns. In contrast, the TOE and TAM models
    explore factors that influence technology adoption and more directly speak to
    the types of organizational decision making that are key in library IT decisions.


    These models take somewhat different approaches to understanding technology adoption.
    The TAM model explores the natural tension between the perceived usefulness and
    ease of use of technologies. In contrast to TAM’s perception-based model, the
    TOE model examines various contexts that influence technology adoption (e.g.,
    organizational and environmental). These two perspectives help shed light on factors
    that influence individual and organizational assessment of the value'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'of technologies (e.g., ease of use, perceived value, social context, organizational
    values). Specifically, the TAM model provides a structure for understanding the
    individual, social, and technological context surrounding technology adoption.
    In contrast, the TOE model provides a framework for understanding the interaction
    of organizational, technological, and external (to the organization) factors.


    Previous studies have also used these models to explore cloud adoption in educational
    and technology environments. For example, the TAM model has been used to examine
    the factors that influence cloud computing adoption in community college systems
    (Behrend et al. 2011), and the TOE model has been used to explore the organizational
    factors that influence the adoption of technology in different contexts (Daylami
    et al. 2005). The inclusion of both models helps frame the research in terms of
    the participant’s perceptions of cloud computing and situates their use of cloud
    computing within the organization. The analysis of survey responses looked for
    elements of each model, including personal views of ease of use/value (i.e., TAM)
    and personal views of environmental, organizational, and technical factors (i.e.,
    TOE) in relation to four computing platforms. Figure 2.1 shows the coding framework
    that was used in this survey.


    | | Non-virtualized | Internal/private cloud virtualized | Public/community cloud
    virtualized | Outsourced |

    |---|---|---|---|---|

    | Personal views (e.g., perceived value, ease of use) |  |  |  |  |

    | Environmental influence (e.g., industry support, professional standards, community
    needs) |  |  |  |  |

    | Organizational influence (e.g., privacy, legal, financial perspective, staff
    expertise, service focus) |  |  |  |  |

    | Technical influence (e.g., technical capacity to address service need, technical
    fit with organizational goals) |  |  |  |  |


    FIGURE 2.1

    Framework of factors influencing cloud computing adoption'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Figure 2.1 includes four categories of virtualized/cloud computing that were
    created using the NIST model. These four models (nonvirtualized, internal noncloud
    or private cloud virtualization, public or community cloud virtualization, and
    outsourced) represent a mix of deployment contexts (e.g., public, community, private)
    and service models (SaaS, PaaS, IaaS) and were selected because they have common
    real-world examples in library IT environments.


    One of the challenges with this study framework was finding a suitable way to
    categorize cloud platforms that made sense to a large population of participants.
    Although the study focused on library IT personnel, the population surveyed included
    a mix of highly technical and nontechnical librarians. To control for this variation,
    the categories were informally tested with technical and nontechnical librarians
    and refined to be as understandable as possible. In this study framework, nonvirtualized
    refers to traditional library IT systems that run on dedicated hardware within
    the organization. In contrast, internally virtualized or private cloud refers
    to IT systems that are run within the organization but use a specific form of
    virtualization. It is important to differentiate the virtualization of multiple
    machines on a single hardware stack (virtualization) from a new range of software
    platforms that “unify server, storage and network resources into a common resource
    pool” (Marko 2012, 4). The study grouped external cloud computing adoption into
    two genres, “public/community cloud” and “outsourced.” In category testing with
    librarians the term outsourced, though not truly representative of the SaaS technical
    concept, was more representative of the form of SaaS solutions adopted by libraries
    and was a commonly understood concept among nontechnical librarians. Table 2.1
    provides detailed explanations of each platform. Although conflating service


    # TABLE 2.1


    # Cloud Computing/Virtualization Adoption Platforms


    | Implementation type | Type of system |

    |---|---|

    | Virtualized using in-house systems | PaaS or IaaS in a private cloud environment
    |

    | Virtualized using cloud resources run by library IT | PaaS or IaaS in a public
    or community cloud environment |

    | Outsourced to external providers | Outsourced solutions described primarily
    as SaaS cloud solutions |

    | Run in-house (not virtualized) | IT system run on dedicated hardware in a nonvirtualized
    configuration |

    | Not supported at my library |  |'
