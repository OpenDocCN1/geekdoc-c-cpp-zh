    # CONCLUSION


    Many libraries are already leveraging SaaS solutions for common data- and labor-intensive
    tasks. But because libraries often run specialized and relatively small services,
    it can be difficult for them to find SaaS or PaaS solutions that fit their needs
    economically. As chapters 4 and 5 demonstrate, libraries looking to develop their
    own applications or host relatively common applications such as content management
    or customer relations systems are likely to find PaaS solutions that fit their
    needs, and libraries seeking to implement customized library-focused systems such
    as DAMS or ILS are likely to need SaaS or IaaS solutions. In this chapter, we
    see that libraries seeking to use cloud computing as a simple disposable service
    have a variety of options, including application-specific PaaS and managed IaaS.
    These approaches are transformative in nature and can help IT departments create
    more durable, economical, and powerful service deployments.


