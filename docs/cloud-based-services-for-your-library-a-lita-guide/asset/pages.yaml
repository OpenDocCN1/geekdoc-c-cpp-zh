  md: '**ERIK MITCHELL** is an assistant professor at the College of Information Studies
    at the University of Maryland, College Park. In addition to studying information
    technology adoption and use in libraries, Erik examines metadata issues and professional
    development in library and information science. Before joining the University
    of Maryland, Erik served as the assistant director for Technology Services in
    the Z. Smith Reynolds Library at Wake Forest University, where he worked for twelve
    years. During this time he coordinated the development, implementation, and management
    of a variety of library systems and most recently was responsible for the migration
    of the Reynolds Library IT services to cloud-based platforms. Erik is a columnist
    for the *Journal of Web Librarianship* and has published and presented on library
    IT, metadata use, and pedagogical approaches. He holds a PhD in information and
    library science from the University of North Carolina at Chapel Hill, an MLS from
    the University of South Carolina, and a BA in literature from Lenoir-Rhyne College.


