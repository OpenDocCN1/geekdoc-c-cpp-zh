    (e.g., service uptime, system security/privacy, service cost), and service management
    (e.g., staff access, service create/start/stop/terminate, service aggregation)
    that are easy to use and sustainable.


    # Hybrid IaaS Provider Examples


    Many of the previously reviewed providers including Amazon, Linode, Google Apps,
    and Heroku offer monitoring, auditing, and cost management services, and it is
    possible that these services will work well in a limited cloud architecture. There
    are other services, however, that support cross-platform provisioning, monitoring,
    and auditing services. This section explores cloud services that can provide libraries
    with alternative or hybrid approaches to creating a robust cloud-based infrastructure.
    Three classes of service are of particular interest: multiplatform IaaS solutions,
    SaaS solutions for effective IT service management, and a mix of cloud resources
    for point-of-need services.


