- pgno: 52
  md: '# Selecting and

    Implementing Solutions


    In this chapter we look at technical, organizational, legal, and staffing/expertise
    issues in more detail and consider library-specific factors that influence adoption
    of cloud-based services. This examination is based on the responses of participants
    in the chapter 2 survey, on approaches described in the literature on cloud computing
    (e.g., Reese 2009; Rittinghouse and Ransome 2009), and on case studies of library
    adoption of cloud computing and virtualization (Fox 2009; Han 2010; Mitchell 2010).


    Our survey found variation in cloud computing adoption rates and different motivating
    and inhibiting factors with regards to organizational issues, technical/functional
    requirements, and perceived benefits. This points to the likelihood that there
    is not a “one-size-fits-all” solution for cloud computing in libraries but rather
    a need to find the best fit for each institution. Although it was difficult to
    compare the context of cloud adoption between libraries and other information
    organizations, there was a clear emphasis on privately virtualized or completely
    outsourced (e.g., SaaS) approaches in both our survey and other research reported
    in chapter 2. There were common themes mentioned that contextualized this trend,
    including lack of IT support or local expertise and concerns over the ability
    to sustain complex IT systems. These concerns are significant given the fact that
    as libraries are adopting new information services they are often faced with choices
    that require distinguishing between cloud, virtualized, and traditional IT approaches.
    Breedings (2011) work in particular has focused on this issue in regards to the
    ILS. He found not only a continued shift toward cloud solutions using'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Chapter Three


    SaaS and PaaS platforms but also a reevisioning of the structure of these systems
    including changing approaches to bibliographic and other data management and a
    focus on data and service interoperability. In evaluating these systems libraries
    must understand both the IT service and functional implications of their decisions.
    In addition, as libraries adopt or migrate to cloud-based platforms, new issues
    such as service quality and service-level agreements (SLAs) and new takes on traditional
    issues such as vendor lock-in and system functionality need to be considered.


    One goal of this book is to give librarians the tools they need to assess and
    compare cloud, virtualized, and nonvirtualized IT environments. By having a strong
    understanding of the types of virtualization and cloud computing that are available
    along with the required support services that come with these platforms, librarians
    are better prepared to make well-informed system selections. This chapter focuses
    on issues related to technology adoption as opposed to system functionality, but
    the latter is a very real concern as well. In weighing the technical differences
    between systems and organizational/environmental factors it is also worth considering
    the relationships between organizational units, IT systems, IT services, and end-user
    information needs. In IT service environments, for example, there is considerable
    focus on the relationships between capacity (both technical and organizational),
    risk management, and service or end-user goals (Addy 2007, 45). Libraries should
    not assume that their view of these elements, or even their definition, is identical
    to their counterparts’ in organizational IT. Schaffhauser (2010) observes that
    libraries define service and assess value, impact, and risk using different measures
    than IT departments and differentiates library and IT perspectives on an “end
    user.” This difference can have a cascading effect on library IT and can be a
    cause of discord between library-centric and organization-wide IT departments.
    Although the move to cloud or virtualized platforms may be seen as a way to bridge
    these differences, it can also lead to more complicated and interdependent relationships.


    One way of bridging this gap is for libraries to select service assessment models
    that share common ground with IT departments while also leaving room for these
    differences. Despite the fact that they may start with an IT-centric world view,
    IT service models are useful in this area because they include ways to differentiate
    internal and external customers and include considerations for capacity and risk
    while keeping a focus on user service expectations. One model that provides a
    common vocabulary for these discussions is Addy’s “Components of a Service” model
    (2007, 51), which uses concentric circles to show the relationship among the concepts
    of capacity, control, and metrics derived from a single-level relationship (e.g.,
    IT to organizational unit support). Addy’s model places user requirements'
  merge: -1
  img_proc: true
- pgno: 54
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 55
  md: 'impact of term-of-service life cycle. Measuring the quality and impact of these
    services can be more difficult than measuring cost or ROI, but they may be better
    measures of an organization’s view of the value of an information service and
    can be helpful in guiding decision making for IT platform adoption. Measures that
    can be useful in quantifying service value include desired service uptime as compared
    to real-world availability, the opportunity cost of service downtime, absolute
    or relative service utilization measures (e.g., through log file analysis or Google
    Analytics), and an analysis of system relationships and dependencies.


    Several issues in table 3.1—such as access levels, administration, accountability,
    responsibility boundaries, coadministration, and coaccess—likely require complex
    agreements in cases where the library seeks to share administrative roles with
    an organizational or external IT department. In addition, negotiating SLAs that
    are tuned toward assuring a level of support focused on end-user or public operations
    (e.g., evening and weekend support for research tools) as opposed to staff-focused
    or business operations (e.g., Monday–Friday business hours) can be key to high-quality
    service deployment. Finally, it is worth noting that the factors listed in table
    3.1 also need to be considered within the context of the service or service component
    being analyzed. All IT services include infrastructure (e.g., computing hardware,
    operating systems, networking, power, and cooling), platform (e.g., operating
    system, software stacks, development, and deployment frameworks), application
    (e.g., an information system that fills a single or multiple roles), and service
    elements (e.g., an end-point resource that provides some form of information service
    based on the functions of the application). Depending on the type of IT system
    being examined, one or more of these areas will need to be considered from the
    perspectives discussed in table 3.1. This can make comparing a traditional nonvirtualized
    environment (in which each of the four technology levels may be administered by
    the library) with an outsourced or SaaS application difficult. The following sections
    explore some of these factors in more detail and can serve as a starting point
    for libraries considering IT alternatives.


    # TECHNICAL FACTORS


    Of all issues to consider when exploring cloud-based and virtualized services,
    technical issues are likely to take center stage. Understanding the technical
    work required when a library takes on virtualized and cloud computing is an important
    first step that can help guide decisions about capacity and long-term sustainability.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Infrastructure Administration


    The administration of infrastructure-level services focuses on core elements including
    network, server, and operating systems. Infrastructure-level administration often
    comes with beginning-to-end responsibility for an information service and requires
    the ability to design and deploy a hardware (both virtualized or physical) infrastructure,
    install and configure software, secure and maintain distinct IT components (e.g.,
    server, network, security), and manage change in service configuration and deployment.
    This requires a familiarity with security measures (e.g., firewalls, user access,
    and system updates) and IT service management (e.g., service configuration, deployment,
    backup, failover, and depreciation) and a granular understanding of the implications
    of system design on the information service. In a cloud environment this also
    means a wider familiarity with cloud service elements that constitute an IaaS
    environment (e.g., server images, volume snapshots, security groups). The NIST
    reference model expands on infrastructure-level skill requirements with ten technical
    factors to be considered in relation to cloud computing adoption (Fang et al.
    2011):


    +   1. Creating, accessing, updating, and deleting data objects in clouds

    +   2. Moving virtual machines and virtual appliances between clouds

    +   3. Selecting the best IaaS vendor for a private externally hosted cloud

    +   4. Tools for monitoring and managing multiple clouds

    +   5. Migrating data between clouds

    +   6. Single sign-on access to multiple clouds

    +   7. Orchestrated processes across clouds

    +   8. Discovering cloud resources

    +   9. Evaluating SLAs and penalties

    +   10. Auditing clouds


    Some of these tasks are highly technical and require infrastructure-level expertise.
    For example, creating, managing, and migrating virtual machines requires understanding
    how to allocate infrastructure resources and configure systems and applications.
    Other tasks including evaluating SLAs, discovering new cloud resources, and auditing
    cloud services are important for all approaches to cloud computing. Given the
    complexity inherent in many of these technical factors, it may be necessary to
    choose those that are more important in a particular environment. For example,
    whereas patron privacy and quality of service are major'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'issues in libraries, single sign-on or fully interoperable cloud environments
    may not be necessary when selecting cloud-based information services.


    Libraries can find it challenging to locate the resources in-house to manage technology
    infrastructure but also may find that cloud providers are reducing the complexity
    of these systems and lowering the costs (both financial and operational) to implement
    and manage these services. Though this list of required skills may be daunting,
    the ability to manage infrastructure-level services can be helpful for libraries
    given their tendency to adopt information services from different vendors or open-source
    communities. For librarians seeking to develop expertise in infrastructure administration,
    becoming familiar with local virtualization platforms such as Oracle''s VirtualBox
    (http://virtualbox.org) and with cloud virtualization platforms offered by IaaS
    providers (e.g., Amazon, Rackspace, or Microsoft) is a good first step. These
    skills transfer easily, since the conceptual understanding required to use Amazon''s
    platform is mirrored in other providers (e.g., the understanding of CPU time-based
    charging, storage resources, firewall resources, monitoring services, authentication
    services). Although specific services depend on the platform or application deployed,
    having an understanding of infrastructure-level capacity helps when librarians
    or IT administrators are faced with the process of designing a cloud-based or
    virtualized system.


    # Platform Administration


    Technical aspects of platform support typically include an emphasis on the software
    components that constitute an end-user-facing application. For example, a content
    management system running on WordPress requires familiarity with Apache, MySQL,
    PHP, and WordPress plug-ins and may require familiarity with authentication systems
    (e.g., LDAP, Shibboleth) and secure web connections (e.g., SSL). Depending on
    the platform selected, other skills may be required including programming familiarity,
    an understanding of web service architecture, or a more granular understanding
    of server infrastructure.


    In a PaaS cloud environment, platform administration may require familiarity with
    a specific suite or configuration of web services. For example, Google Apps Engine
    (http://code.google.com/appengine/) requires users to design their applications
    within a specific framework that includes a database platform, programming framework,
    and web-service deployment architecture. Because libraries often have limited
    IT resources, they may find platform and application administration to be more
    approachable than infrastructure administration. On'
  merge: -1
  img_proc: true
- pgno: 58
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 59
  md: 'management systems, means that libraries may be able to hold onto the ability
    to customize user interfaces and application functionality while also relying
    on SaaS solutions for applications. This is not always possible, however; many
    providers promise the ability to customize the end-user experience, but it is
    important for libraries to ask specific questions in relation to the interface
    modifications they are seeking.


    # Security


    There are a host of security issues that affect both the comfort level for adoption
    of cloud services and also the sustainability of a cloud-based service once it
    is selected. In general, the goal of system security is to prevent unauthorized
    access to IT infrastructure, administrative services, and user-facing services.
    It also includes preventing interruptions in connectivity and the hardening of
    systems against intrusion attempts using open ports, cracked passwords, software
    vulnerabilities, and back-door and man-in-the middle attacks. The work in this
    area includes a necessary focus on traditional IT security measures including
    active monitoring, firewall and application control, penetration testing, and
    incident management and response, but it also involves new security issues related
    specifically to cloud platforms, such as virtual private networking, multiplatform
    monitoring, data center certification, and trusted user authentication (Constantin
    2011). For librarians interested in learning more about security management, Limoncelli
    et al.’s (2001) guide to system administration provides a foundation for approaching
    IT security issues and includes a focus on the role of policy and auditing in
    ensuring consistent and durable system security.


    A central policy and procedure checklist may help organizations with security
    monitoring, but other areas in a cloud environment also need attention. For example,
    the addition of multiple platforms in a cloud computing environment means that
    security concerns need to be assessed both for individual systems and for the
    connections between systems. In addition to the common security risk areas of
    authentication, server isolation, and data protection, cloud-centric risk areas
    include security holes in the selected hypervisor platform, the risks associated
    with running in a common virtualized environment, and the risks associated with
