    One reason often cited for libraries moving to cloud systems is the need for greater
    IT support than is available locally. In some cases the need focuses on specific
    platforms, and in others the need focuses on data issues or scalability requirements
    that are not available in a local IT shop. In choosing to migrate to cloud solutions,
    however, libraries need to be aware of the IT services that must be provided by
    local IT. Some examples of service support required by libraries include network
    infrastructure and Internet access, domain name service (DNS) resolution, organizational
    authentication, organizational user or patron data, and firewall or VPN service.


    In particular, having the ability to work with organizational IT to define new
    DNS entries for external servers, to open firewall rules to allow easier communication
    between internal and cloud-based servers, and to employ VPN as a means to limit
    access to the servers are three key services that facilitate the migration to
    cloud platforms. These services both form a trusted relationship between organizational
    IT and the library and demonstrate the limit of support requested by library IT.
    An SLA that explicitly outlines the types of services supported and the limits
    of responsibility can go a long way toward redefining the relationship of the
    library to the organization''s IT department and addressing concerns that can
    initially seem insurmountable.


    # ORGANIZATIONAL FACTORS


    Although local IT resources or technical expertise may drive which cloud solutions
    a library considers, organizational factors including risk tolerance, finance
    and budgeting environment, available staff resources, and fit of cloud solutions
    with overall service goals may be equally important. Increasingly, libraries are
    able to find cloud solutions (particularly SaaS) that fit their specialized needs
    and organizational culture. These include not only SaaS-based vendor services'
