    and platform-specific migration can be difficult. In this section we explore some
    areas in which moving to SaaS or specific IaaS platforms can affect service quality
    and costs positively. Such approaches are not likely to solve all problems posed
    in the previous sections, but they may be right for organizations seeking a balance
