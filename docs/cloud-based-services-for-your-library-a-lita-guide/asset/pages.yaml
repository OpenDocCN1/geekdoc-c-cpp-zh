    # Service Complexity, Sustainability, and Durability


    PaaS solutions tend to be more complex than traditional IT systems. There are
    commonly more dependencies required, and each platform takes a unique approach
    to the deployment, configuration, and management of applications. At the least,
    a dedicated PaaS environment needs to include an application platform, a persistent
    digital object storage platform, and a database platform. In a sufficiently distributed
    architecture, each of these systems should persist without depending on the other.
    This enables the application to be upgraded, scaled, and redeployed without affecting
    valuable data and digital objects. One benefit of PaaS application environments
    is that they tend to include built-in monitoring, replication, and scaling features.
    Though the default levels of these functions are likely to suffice for most libraries,
    understanding how to scale these services or reconfigure them to support application
    deployment on multiple PaaS platforms is necessary for large-scale applications.
    In addition, for libraries seeking to utilize multiple PaaS providers to make
    their applications more durable, an external DNS system must be employed to enable
    easy switching from one service provider to another.


    Although there are several issues that libraries must consider when using dedicated
    PaaS platforms, a key advantage of these systems is their built-in ability to
    scale and persist across service outages. Amazon’s Elastic Beanstalk, for example,
    includes the ability to scale automatically to handle increased traffic and features
    multizone redundancy to ensure that an application remains operational even if
    portions of the cloud infrastructure fail. Likewise, Heroku offers automatic replication
    and scalability that make it easier to test and deploy system updates. Finally,
    PaaS environments get their quick configuration speed and flexibility by using
    shared cloud services. The Zend PaaS (http://zend.com) framework, for example,
    integrates tightly with RightScale to launch and manage infrastructure-level services
    onto which are deployed multiple customers. This makes choices about system durability
    and long-term sustainability more complex and dependent on factors such as local
    expertise, tolerance for provider lock-in, and ability to implement services on
    multiple cloud providers.


    # Service Cost


    Whereas PaaS server solutions offer some form of ongoing subscription cost, dedicated
    PaaS solutions seek to make these service both more affordable and'
