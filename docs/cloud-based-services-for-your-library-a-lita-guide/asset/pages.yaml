- pgno: 66
  md: '# Selecting and Implementing Solutions


    In addition to maintaining suitable backups of data, in the cloud environment
    it is also important to develop a means to back up and restore server configurations.
    In an optimal situation the backup and replication approach includes the ability
    to deploy servers and data onto different cloud providers. Although this is likely
    to be an issue only for libraries adopting PaaS and IaaS solutions, it is important
    for libraries looking toward SaaS solutions to determine whether service providers
    have a plan for managing backup, recovery, and replication of services. There
    is an emerging set of businesses focused on service replication across cloud providers
    that fall into the NIST category of cloud broker. One example is RightScale (http://rightscale.com).
    This service supports multiple IaaS providers and synchronizes data and services
    back to a local private cloud environment or to other public clouds.


    Regardless of the type of cloud or virtualized solution selected, replication
    and backup are key issues. Some important considerations in these decisions: (1)
    How important is a secondary cloud or localized service backup? (2) Which service
    works best with local capacity? (3) How important are short-, mid-, and long-term
    backups? (4) Is continuous data protection more important than durable long-term
    backups? (5) How important are industry standard backup platforms as compared
    to proprietary systems?


    This fifth consideration can be a major stumbling block for libraries seeking
    to store data in the cloud. For example, libraries that are using the cloud as
    their primary digital object and metadata storage platform need to identify a
    solution that relies on traditional storage, version control, and bit-checking
    methods. In contrast, cloud and virtualization platforms make it much easier to
    take snapshots of file systems and save space by recording only the difference
    between versions of a file system. This process is highly efficient both for taking
    backups and restoring them, but it creates issues for organizations that want
    to have access to archived data using traditional file system tools (e.g., mountable
    file system and compression tools).


    # Service-Level Agreements and Terms of Service


    SLAs and terms of service are important documents that define the relationship
    between cloud computing providers and subscribers. SLAs define the level of service
    assured with a cloud service, including elements such as system uptime, system
    security, support contacts, and response-time agreements. Libraries may be familiar
    with SLA elements given their experience negotiating with electronic resource
    vendors. In contrast, terms of service focus on higher-level issues such as liability,
    legal recourse, and the general use of the service by subscribers. Terms'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Chapter Three


    of service and SLAs serve different purposes but in general address how a service
    can be used and what behaviors are acceptable for both providers and subscribers.
    Limoncelli et al. (2001) list several considerations in negotiating SLAs, including
    response times in various service situations, nonperformance issues, performance
    assessment, guaranteed system performance, and service uptime/backup routines.
    Trappler (2010) expands this list to include infrastructure capacity, security,
    and error correction time.


    With so many measures it can be difficult to understand which are essential and
    what the real meaning of uptime assurances is. As a good example, Conry-Murray
    (2009) documented uptime guarantees by different cloud providers in a 2009 report
    and found them ranging from 99.7 percent to 100 percent depending on provider.
    Though 99.7 percent might seem good enough, it leaves room for over two hours
    of downtime per month. Reese (2009, 5.5) rightly observes that even a short period
    of downtime may have major implications for information services. In addition,
    because cloud services are often based on multiple service providers, measuring
    service quality can be very uncertain. This difference in perspective became apparent
    when Amazon experienced service downtime in one zone early in 2011 and caused
    downtime for services that had not been designed to operate in multiple availability
    zones (Leong 2011). In fact, Amazon’s availability definition is only for services
    that operate in multiple availability zones, meaning that organizations are not
    fully supported unless they configure their cloud services in the specified manner.


    An additional challenge with SLAs is the difficulty of working with multiple vendors
    and agreements while trying to implement a sustainable and consistent service
    architecture. Making this process more difficult is the fact that libraries can
    find it difficult, if not impossible, to negotiate the SLA with large cloud providers.
    IaaS providers in particular provide an SLA for a broad system infrastructure
    and are not in the business of providing tailored support. Although not always
    realistic, there are ways around this one-size-fits-all approach. First, government
    organizations are gaining access to specialized IaaS environments that operate
    under specialized terms through Amazon and other IaaS providers. It may pay to
    find a community cloud provider that recognizes issues unique to your institution.
    Additionally, educational organizations can often negotiate with corporations
    for enterprise-wide solutions or can choose to (in the case of Amazon) pay for
    a higher level of service support. Finally, paying attention to built-in support
    levels and the availability of customer service can help libraries find the right
    fit in an IaaS provider. These providers all offer similar services, but their
    approaches to customer service vary considerably.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Terms of service, SLAs, and other use agreements between subscriber and cloud
    provider can be daunting to say the least. These agreements spell out areas of
    legal liability, recourse, indemnification, and other issues that may seem excessive
    for


    # Interpreting Contracts


    Interpreting a cloud computing contract may involve a new area of expertise for
    IT staff. As always, consulting legal counsel, collections management, or administrative
    staff can be helpful. Some key areas to focus on in SLAs and terms of service
    include these:


    +   - Duration of contract and termination procedures: What constitutes subscription
    and termination? How are renewals handled?

    +   - Payment methods: What payment methods are supported, and what payment terms
    are extended? What is the procedure for termination if payment lapses?

    +   - Legal jurisdiction: What jurisdiction and laws apply to the contract, and
    what limits are placed on issues of arbitration and liability?

    +   - Indemnification, warranty, and service assurance: What warranties does the
    provider agree to and how do these assurances relate to the SLA? What liabilities
    does the provider recognize?

    +   - Privacy policy: Under what conditions are customer data made available to
    external organizations?

    +   - Data ownership and retention upon service discontinuation: Who owns data
    located on the cloud service, and what happens to that data when the service agreement
    is discontinued?

    +   - Service integrity: What does the provider define as a complete service,
    and how does it assure that its service remains operational?

    +   - Data disclosure and service monitoring: Does the provider regularly disclose
    data regarding customers? Does it monitor traffic, stored data, or processes?

    +   - Data and service location: Where are the data housed by the cloud provider
    physically located? What implications does this have for your organization’s adherence
    to organizational policy and legal regulations?


    A thorough exploration of these topics would easily fill a chapter, but good resources
    include policy papers by Jaeger et al. (2008, 2009) and Bradshaw et al. (2010).'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'low-level cloud adoption. There are several issues to consider, though, and
    libraries are best served by following up with legal counsel if the reading and
