- pgno: 114
  md: '# Infrastructure as a Service


    For libraries with a background in managing traditional IT resources, an IaaS
    approach to cloud computing is likely to be a good fit. IaaS providers simplify
    the process of reserving, starting, and managing IT resources including servers,
    storage space, network tools, and monitoring tools. This makes it possible for
    libraries to create an IT infrastructure tuned to specific needs and applications.
    In addition, these systems often support customization of specific resources such
    as operating system, application platform, disk space, and memory.


    Like dedicated PaaS systems, IaaS systems require a level of investment in the
    computing environment and have some complicated elements that require familiarity
    with IT systems and development platforms that are not common skill sets in libraries.
    With this expertise, the ability to use IaaS resources to create and manage a
    flexible and robust computing environment can be transformative for libraries
    seeking new ways to address their IT needs. This also means that IaaS solutions
    require greater attention to security, backup, and service restoration procedures
    than PaaS or SaaS solutions and place the burden of ensuring scalability and sustainability
    on the library rather than the cloud service provider.


    In this chapter we review IaaS solutions from two perspectives: using IaaS resources
    to replicate traditional service architectures, and using them to create cloud-aware
    service architectures. Before we explore these solutions in depth, it is worth
    defining a few generic resource types that are common to each of the IaaS solutions.
    The following list may be familiar, but here they contextualize the discussion
    of IaaS examples throughout the chapter.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '**32 bit vs. 64 bit operating system:** These numbers refer to the underlying
    architecture on which the operating system runs. These different hardware architectures
    require different versions of the operating system, capable of different levels
    of CPU and memory management. Many IaaS providers base the type of operating system
    on the server size selected and use some method to automatically scale a 32 bit
    system to a 64 bit system. Amazon does, however, support operating 64 bit computing
    images on 32 bit platforms, making it preferable to select a 64 bit operating
    system distribution if scaling to larger servers is a potential need.


    **Application programming interface (API):** In cloud environments, an API is
    a standardized programmatic mechanism for interacting with a web service. All
    IaaS providers have some form of API and often provide enhanced service and functionality
    through programmatic tools that implement the API functions. There is some effort
    to begin standardizing cloud API using open-source approaches.


    **Backup/restore:** IaaS providers typically have some systemwide method for handling
    server and storage space backups. Some vendors provide a managed backup solution
    (e.g., Linode); others simply provide cloud infrastructure backup tools (e.g.,
    Amazon).


    **Bandwidth/transfer in and out:** IaaS vendors monitor and charge for traffic
    to and from server instances. It is becoming less common for vendors to charge
    for incoming traffic, but all vendors discussed in this chapter charge for outgoing
    traffic. Some vendors (e.g., Linode) include base data transfer levels with server
    instances.


    **Cloud file system:** Cloud file systems are differentiated from traditional
    file systems in that they are accessible via APIs rather than via traditional
    disk or mounting mechanisms. Cloud file systems may feature automatic replication,
    version control, and other value-added services that make them more reliable than
    traditional storage.


    **Configuration profile:** Configuration profiles are sets of instructions that
    facilitate the configuration and deployment of cloud resources. This is an emerging
    feature of IaaS providers and is implemented differently in each IaaS solution
    explored in this chapter. The basic concept is similar to automatic configuration
    platforms such as Puppet and Chef, except'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'that they tend to be used only during system launching rather than on an ongoing
    basis.


    **Domain name service (DNS):** DNS is a global Internet application that resolves
    domain names (mycompany.com) to IP addresses (10.10.10.10). Cloud providers offer
    DNS solutions that are turned to the specific needs of cloud users, such as multiregion
    routing.


    **Endpoint:** In cloud computing, an endpoint is the point at which the private
    cloud meets the Internet. Amazon offers multiple cloud regions, each of which
    serves as an endpoint for traffic from its internal cloud.


    **File bucket/container:** The bucket or container is a unit of storage related
    to cloud-based file systems. Files can be uploaded only once identified with a
    specific bucket or container. Cloud providers may also associate access control
    with a bucket or container.


    **Load balancers:** Cloud providers often support some automated method for implementing
    a load-balanced application. Load balancers monitor traffic on a given service
    and reroute traffic or scale server resources as needed.


    **Machine images:** Machine images are the root of the launched servers in IaaS
    environments. Some providers (e.g., Amazon) allow users to upload, publish, and
    download images in a community portal; others (e.g., Rackspace, Linode) offer
    a smaller suite of vetted machine images. All services offer some mechanism by
    which customized machine images can be saved to the customer''s cloud service
    and reused or repurposed.


    **Messaging or queuing service:** These services provide independent means for
    sending messages to users or applications. Amazon offers multiple forms including
    Simple Email Service (SES) and Simple Notification Service (SNS). Messaging services
    can replace the need to run traditional e-mail and other messaging services on
    a machine image.


    **Mountable volume:** Some IaaS providers offer a more traditional form of storage
    that can be mounted as a disk or volume on server resources. Amazon''s form of
    this storage (elastic block storage, EBS) features user-controlled size, format,
    attach/detach services, and long-term storage.


    **Public/private keys:** In addition to password-based security, cloud providers
    may support the generation or use of public/private keys for resource'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'access. Of note, all initial access to Amazon-launched resources is via these
    keys.


    **Regions:** IaaS providers may offer services in multiple cloud regions. A cloud
    region should be independent both physically and virtually from other regions
    in a cloud provider''s network but should also be accessible via high-speed private
    networks for data and service replication. Providers may use region replication
    as a method to assure a high level of uptime in their SLA.


    **Security groups:** IaaS providers typically offer some form of infrastructure-based
    security. Some limit this to delegated user access to view, modify, or create
    IaaS resources; others offer a fully functional firewall service.


    **Server instance:** A server instance is an operational server in an IaaS environment.
    It utilizes an operating system, storage resource, and CPU/memory resources. It
    may or may not be located on its own hardware (see discussion of public and private
    clouds in chapter 3).


    **Snapshots:** Snapshots are common in IaaS environments and set a “point in time”
    backup of a server or storage resource. In the Amazon environment, snapshots are
    incremental, meaning that each successive snapshot stores only the changes from
    the previous snapshot. This speeds backup times and saves considerable storage
    space.


    **Virtual private network (VPN):** IaaS providers may support the creation of
    a virtual network that limits access to servers based on IP addresses. Users may
    want to leverage VPN resources in their organizational environment to limit access
    to sensitive ports (e.g., port 22—SSH).


    # USING IAAS IN A TRADITIONAL IT APPROACH


    Although considering IaaS from “traditional” and “cloud-aware” perspectives may
    seem artificial, it provides a means to explore the functional implications of
    different approaches to IT service management in an IaaS environment. As with
    the wide range of PaaS platforms, IaaS can include a confusing array of options
    and certainly requires a close examination of the issues explored in chapters
    2 and 3, not least of which are the staff expertise, organizational policy, and
    legal issues associated with moving to cloud services.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "In this section we explore platforms that emphasize the traditional server\
    \ life cycle model (configure, secure, deploy, manage, upgrade, and decommission).\
    \ The five examples included here are prevalent in the professional literature\
    \ but are certainly not exhaustive.\n\n# IaaS Provider Examples\n\nThere are many\
    \ public or community cloud providers for IaaS services. This book focuses on\
    \ three in particular (Amazon, Rackspace, and Linode), but there are a host of\
    \ other providers including GoGrid (http://gogrid.com), Internap (http://internap.com),\
    \ and Hexagrid (www.hexagrid.com). There are IaaS brokers and value-added service\
    \ providers such as RightScale and Cloudability. In the private cloud environment,\
    \ solutions include Eucalyptus, Cloud Foundry, VMWare, and OpenStack.\n\n# Amazon\
    \ Web Services\n\nAmazon Web Services (AWS, http://aws.amazon.com) is perhaps\
    \ the best known IaaS cloud provider (figure 5.1). Amazon supports a wide range\
    \ of services including server hosting (EC2), cloud storage (S3, EBS), service\
    \ monitoring, notification services (SES, SQS), Relational Database Services (RDS),\
    \ and DNS (Route 53), and service templating (CloudFormation) and monitoring (CloudWatch).\
    \ In addition, Amazon provides support for public, private, and community cloud\
    \ environments.\n\n![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_118_0.png)\n\n**FIGURE\
    \ 5.1**  \nAmazon Web Services"
  merge: -1
  img_proc: true
