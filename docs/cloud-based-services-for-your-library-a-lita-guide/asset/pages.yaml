- pgno: 74
  md: 'may provide some assistance in breaking down different costs associated with
    cloud-based options.


    Another factor that complicates cloud cost calculation is the expected duration
    of the service being implemented. Reese recommends projecting costs over a three-year
    period; Feldman differentiates “start-up” and “enterprise” adoptions and argues
    that as organizations move to an enterprise level they are likely to find more
    cost savings in running a private cloud environment with public cloud bursting
    capacity. Rather than think in terms of start-up versus enterprise, libraries
    may want to consider the projected longevity of an information service instead.
    This can help an organization understand the potential cost savings from up-front
    capital investments versus ongoing cloud investments in short- and long-term services.
    It also can make the calculation of ROI more complex. This likely involves choosing
    or adhering to a depreciation schedule and having a detailed understanding of
    the technology costs that will and will not go away in a cloud service. To help
    with these calculations, Reese provides formulas to calculate cost over the life
    of the service and to determine current technology value (2009, 53, 12). Cloud
    providers, particularly IaaS providers, may provide cost calculators—for example,
    Amazon (http://calculator.s3.amazonaws.com/calc5.html), Microsoft Azure (www.microsoft.com/windowsazure/pricing-calculator/),
    and RightScale (www.rightscale.com/tco-calculator/).


    Another important factor in cost calculation, particularly for libraries, is data
    storage and data transfer costs. A common method for planning for backup costs
    over time is to estimate the amount of change in data expected over a month and
    multiply total storage by that percentage (e.g., if you expect a 15 percent change
    in a month, your backup charges are 1.15 times storage costs). The fact that backed-up
    data are entirely replicated on cloud services can make storage costs seem very
    expensive, but many cloud services including Amazon’s S3 and Glacier services
    include automatic replication and redundancy as part of the storage service. This
    does not eliminate the need for backups, but for organizations comfortable with
    this approach to storage the use of version control and unique backups with limited
    archiving history can lower the overall costs of storage.


    # Legal and Policy Issues


    When libraries are adopting a cloud service, there are policies that need to be
    considered both within the provider/subscriber relationship and between the subscribers
    and outside organizations. These relationships are often discussed'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'as terms of service, acceptable use policies, and privacy policies. There are
    often multiple versions of these policies, particularly for free and paid versions
    of cloud services. Libraries interested in using free cloud services may find
    that the default terms of the service pose significant barriers in relation to
    FERPA, HIPPA, or USA PATRIOT Act regulations. In paid cloud services there are
    opportunities to negotiate these terms, and libraries can minimize risk by adopting
    cloud platforms that avoid thorny privacy policy terms or by blocking provider
    access to subscriber data.


    Navigating this range of terms, policies, and agreements can be difficult, if
    only because of the number of ways agreements can be published or made available.
    In fact, organizations do not always publish distinct documents and may include
    privacy policy issues in terms of service document and vice versa (Bradshaw et
    al. 2010). Outside of the terms of service and acceptable use policies, libraries
    face legal and policy issues when examining cloud-based or virtualized IT solutions.
    Although these issues are not largely different from those encountered in a traditional
    IT environment, cloud computing brings the complications of working with an external
    vendor. A survey of new IT solutions should include examining government regulations
    (e.g., HIPPA, FERPA, Patriot Act), software and service licensing issues, and
    IT standards compliance (Reese 2009, 63). In addition, Gartner’s Hype Cycle report
    (Smith 2010) focuses on privacy issues including personal data and the implications
    of hardware ownership in public clouds. Jaeger et al. (2009) add data confidentiality
    and privacy, liability, intellectual property, ownership of data, and auditability
    as concerns. Trappler (2010) mentions other legal and policy issues including
    the disposal of data, handling of security breaches, geographic or political location
    of data, and compliance with legal or governmental requests for data.


    These issues are international in scope and complicated by the fact that cloud
    computing environments can span multiple jurisdictions. Resse (2009, 104) explores
    three broad factors that should be considered for a given regulation: “How” (e.g.,
    how does an application need to operate to comply with a standard), “Where” (e.g.,
    where can data be stored), and “What” (e.g., what specific elements need to be
    included in an infrastructure). This approach can help libraries dissect an agreement
    and better understand the implications.


    Cloud computing is also creating difficulties for organizations seeking to use
    tools that may be located in other countries. In particular, European laws protecting
    data privacy (Europa 2011) and regulations on data protection and retention (Europa
    2010) have specific requirements regarding user consent for data storage'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'and provisions regarding the disposal of unneeded personal data. These regulations
    pose challenges for vendors seeking to move cloud operations into Europe (O''Brien
    2010). In the United States, key federal regulations include HIPPA, FERPA, Patriot
    Act, Gramm-Leach-Bliley Act, Stored Communications Act, and Sarbanes-Oxley (Jaeger
    et al. 2008, 2009; Reese 2009). These regulations need to be reviewed to make
    sure that the migration to the cloud does not compromise organizational adherence
    to relevant policies.


    Although most cloud solutions libraries are likely to work with feature adequate
    security and privacy assurances, some policies such as the Patriot Act and National
    Security Letters leave library data vulnerable, given the ability for law enforcement
    to seize data without notifying the person whose data are requested (Gorham-Oscilowski
    and Jaeger 2008). This complex legal environment means that libraries must be
    aware of the risks they assume when moving resources to the cloud. Some suggested
    approaches include using encryption before sending data to cloud providers, ensuring
    limited data retention policies, and using system configuration options to prevent
    retention of private data. In addition, these legal issues have implications for
    local policy and practice for libraries adopting cloud solutions. For example,
    data retention is not only an issue for patron circulation data or log data but
    also applies to stored backups and archives. For libraries that will be responsible
    for managing their backups in the cloud, there is a real need to be aware of the
    legal obligation to provide archived data if required.


    There are a variety of ways of addressing locally important legal and privacy
    concerns. First, if an organization seeks absolute privacy, adoption of a private
    cloud environment is an option that ensures continued local control over services
    while benefiting from cloud computing. Second, there are community cloud services
    such as Amazon''s GovCloud that offer specialized services for a specific community.
    In addition, some providers support private cloud options in a public or community
    cloud. For example, Amazon offers a Virtual Private Cloud environment (http://aws.amazon.com/vpc/)
    that gives customers the ability to implement cloud infrastructure in a virtual
    environment that they define. In addition to this virtual isolation, Amazon also
    supports physical isolation for an additional hourly reservation fee (http://aws.amazon.com/dedicated-instances/).


    Despite the procedural and legal concerns raised here, there are ways to handle
    the risk associated with putting private or sensitive data in the cloud. First,
    libraries need to implement cloud solutions in a way that guarantees that redundancy
    and replication are easy to implement and administer. Second, libraries need to
    have policies that govern loss of access to data and legal issues that may arise
    from being'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'in the cloud. Finally, although I group legal, policy, and licensing issues
    under environmental considerations, libraries are likely to find themselves working
    with organizational standards and organizational data compliance requirements
    as well. These policies may require data management or nondisclosure agreements
    to be signed with external providers prior to the sharing of sensitive data such
    as patron lists or financial account information. The best way to be prepared
    for such agreements is to engage the management and IT entities in your organization
    that are responsible for defining and enforcing these policies early on.


    # PLANNING FOR IMPLEMENTATION


    It can be easy to get swept up in the potential cost and efficiency savings outcomes
    with cloud computing, particularly when focusing on a new service or the opportunity
    to solve a long-standing problem. For organizations with little existing technical
    or staffing capacity and no overriding legal or complicating organizational factors,
    the decision to move to the cloud may be easy. But this situation is likely not
    the norm, and the choice to move to cloud solutions can be difficult and time
    consuming. At the same time, libraries are approaching IT issues with a need for
    highly customized solutions and a need to minimize IT costs while delivering high-quality
    IT services. For small and medium-sized libraries these choices may frequently
    focus on SaaS, simple PaaS, or DaaS (a data subscription service supporting a
    key information system) solutions but may also require advanced PaaS or IaaS solutions
    for heavily customized or niche services.


    For libraries that want to develop expertise in managing IT resources, there are
    a variety of options. Hosting companies offer platform-specific tutorials focused
    on launching and managing services (http://aws.amazon.com/articles; http://support.rightscale.com;
    www.microsoft.com/windowsazure/learn/tutorials/). In addition to platform-specific
    skills, a general understanding of IT support models helps provide a framework
    for designing and managing services. Limoncelli et al. (2001) provide a good overview
    of IT support methods, as does IT Service Management resources (www.itsm.info/).
    For librarians seeking to understand the elements required to install and configure
    specific library information systems, there are specialized resources for open-source
    platforms including DSpace (www.dspace.org/quick-start-guide), Vufind (http://vufind.org/wiki/),
    Fedora (http://fedora-commons.org), Evergreen (http://open-ils.org), and Koha
    (http://koha.org).'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# REFERENCES


    An important element of cloud computing design and adoption is a full understanding
    of the additional IT architecture elements required in a cloud environment. Unfortunately,
    libraries that choose to take on their own IT service management responsibilities
    run the risk of failing to capitalize on the benefits of cloud computing. Regardless
    of the solution adopted, it is important to understand the service assurances
    a provider makes, the requirements a platform must meet to be protected under
    those assurances, the backup and service restoration options available, and the
    required administrative activities (e.g., infrastructure, platform, application).
    For example, because cloud computing often uses commodity hardware, extra attention
    should be paid to system architecture to ensure that system migration, failover,
    and restoration are replicable and sustainable. Likewise, it is important to design
    cloud services that automate these processes as much as possible. These elements
    are important; still, it is worth keeping in mind the adage “The perfect is the
    enemy of the good.”


    Although the process of adopting cloud computing or virtualized solutions is largely
    similar to the selection and implementation of any IT service, evaluating cloud-based
    alternatives and fitting the selected service into the wider library IT infrastructure
    are important steps that tend to add complication. In general, a new cloud platform
    or service should be evaluated by considering the goal of an information service;
    available staff, IT, and financial resources to support the service; availability
    of cloud-based (e.g., SaaS, PaaS, IaaS, DaaS) platforms; and how these alternatives
    fit with local resources and goals.


    The issues explored here can seem overwhelming, but testing a small and minimal-impact
    service can mitigate the technical complexities, legal/policy risks, and service
    costs. For those interested in systematic system implementation and management
    guides, detailed plans are available in Limoncelli et al. (2001), Velte et al.
    (2009), and Rittinghouse and Ransome (2009).


