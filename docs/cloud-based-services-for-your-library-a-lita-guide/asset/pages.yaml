    The NIST cloud computing model emphasizes several important tasks to undertake
    to ensure proper cloud security. These include elements mentioned above (e.g.,
    managing access, mitigating risk associated with common IT use through firewalls,
    and detecting intrusion) in addition to designing applications that leverage cloud
    features to enhance, rather than undermine, security. There are also client elements
    such as web browser security and the use of client/server security certificates
