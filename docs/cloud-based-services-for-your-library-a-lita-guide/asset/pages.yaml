- pgno: 16
  md: '# Cloud Computing and Virtualization in Libraries


    The adoption of cloud computing in libraries is part of a larger trend of library
    innovation that is changing how libraries allocate financial, IT, and personnel
    resources. This shift both is driven by and is influencing other areas of library
    operations, including cataloging and metadata management, digital information
    services, community contribution to information spaces, and digital collections
    management. Like all of these trends, cloud computing and virtualization can fundamentally
    transform not only how libraries provide services but also how they define their
    core and value-added functions. Just as the delivery of the Internet as a public
    service in libraries transformed patron views of libraries, new trends of networked
    bibliographic data, an increasing demand for digital reference services, and the
    emergence of electronic collections are again changing both the services and their
    delivery method. These changes are motivating libraries to find ways to make information
    technology more efficient, more diffused throughout library operations, and more
    flexible in a changing environment. Cloud computing and its parent—virtualization—are
    helping libraries shape their services and collections toward these goals and,
    as this book shows, pose unique challenges and opportunities for libraries.


    The opportunities that come from these technologies are unique for libraries because
    libraries are themselves unique from other information institutions. Libraries
    balance the roles of public service and cultural preservation. They often operate
    under the auspices of parent organizations and often find themselves functioning
    within the context of local technical, budgetary, and operational'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'constraints. Libraries frequently license or purchase services with the sole
    intent of giving them away in the most efficient and customer-friendly way possible.
    Just as there is no one type of library, there is no single reason why libraries
    turn to virtual or cloud-based services. Perhaps the most common motivation comes
    from resource constraints or an interest in new and innovative service. Other
    times it comes from a desire to deliver high-quality information services that
    surpass the capacity of local IT infrastructure or expertise. In these approaches
    libraries are embracing the spirit of start-up organizations, adapting to changing
    business models, taking a “permanent-beta” approach to service deployment, focusing
    on underserved populations and opportunities, and shifting resources toward successful
    experiments.


    Over the past twenty years library services have become increasingly tied to Internet-based
    technologies. Though beneficial to library patrons, the delivery of Internet and
    other computing resources along with traditional library services is increasingly
    difficult to sustain (Bertot et al. 2011). In efforts to build on IT-rich services
    and reach diverse populations in new ways, libraries are experimenting with social
    media and mobile applications (Blowers 2010), seeking new IT platforms for services
    (Schrier 2011), migrating traditional systems to cloud-based environments (Breeding
    2011b; Fitzpatrick 2010), using cloud-based services to engage student populations
    (Behrend et al. 2011), and investigating new approaches to digital libraries that
    include network-scale information systems (Kimpton and Baker 2011).


    # OVERVIEW OF CLOUD COMPUTING

    AND VIRTUALIZATION


    Cloud computing and virtualization are complementary technologies which, although
    technically very different, are often seen as similar approaches to solving a
    common problem. This book examines both concepts because a decision to either
    virtualize an IT service or deploy it in a cloud environment comes down to issues
    of service scale, organizational factors, or institutional capacity rather than
    to issues of the technologies themselves. For example, although many libraries
    choose to outsource link resolution services, libraries that have complex internal
    data needs that do not fit the data models of hosted OpenURL service providers
    often run this service in-house. This example points to a real-world issue that
    is important to note early in this book—that libraries often discuss outsourced
    and hosted'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Cloud Computing and Virtualization in Libraries


    services using the terminology of cloud computing and virtualization. Although
    the technical definitions of virtualization and cloud computing are very different
    from the operational definitions of outsourcing and service hosting, this book
    intentionally blurs the lines between cloud-based approaches such as software
    as a service (SaaS) and SaaS-style service hosting as provided by library IT vendors.
    This allows us to compare these approaches and to discuss the creation of an IT
    service infrastructure that more closely matches the diverse suite of providers
    and platforms that is typical in libraries. Discussing outsourcing and hosting
    in terms of their cloud-based and virtualized IT counterparts also provides us
    with opportunities to assess the technical and service quality of hosted and outsourced
    services using common IT measures. To begin our exploration of these broad topics,
    we must define and consider the differences between cloud computing and virtualization.


    # CLOUD COMPUTING


    Two organizations, Gartner and the National Institute of Standards and Technology
    (NIST), are regarded as having created well-formed definitions of cloud computing.
    Both approach this definition by discussing different facets of cloud computing
    services (Mell and Grance 2011; Smith 2010). NIST broadly defines cloud computing
    as “a model for enabling ubiquitous, convenient, on-demand network access to a
    shared pool of configurable computing resources (e.g., networks, servers, storage,
    applications and services) that can be rapidly provisioned and released with minimal
    management effort or service provider interaction” (Hogan et al. 2011). It additionally
    qualifies cloud computing through the use of three service models: SaaS, platform
    as a service (PaaS), and infrastructure as a service (IaaS). The NIST cloud computing
    framework defines features common to all cloud computing environments and differentiates
    cloud service models from cloud deployment models (Mell and Grance 2011).


    Table 1.1 lists the characteristics and models of the NIST definition of a cloud
    environment. It is useful to understand that, although cloud solutions all employ
    a service model, a deployment model, and service features, each solution will
    likely include a different combination of service features and deployment models.
    For example, both Microsoft Azure and Amazon Web Services (AWS) offer a mix of
    PaaS and IaaS solutions, and RightScale and Rackspace help users bridge between
    public and private clouds. In addition, it is increasingly common for cloud'
  merge: -1
  img_proc: true
- pgno: 19
  md: '**TABLE 1.1**


    **NIST Elements of Cloud Computing**


    | essential characteristic | Service model | Deployment model |

    |---|---|---|

    | On demand self-service | SaaS | Private cloud |

    | Broad network access | PaaS | Community cloud |

    | Resource pooling | IaaS | Public cloud |

    | Rapid elasticity |  | Hybrid cloud |

    | Measured or metered |  |  |


    providers to define custom cloud solutions for security, IT management, identity
    management, and other information services using the “as-a-service” model. This
    fragmentation can make it difficult for users to differentiate service types and
    points to the complex set of relationships that underlie a given cloud service.


    # Essential Characteristics


    The NIST model features several essential characteristics that can be used to
    help differentiate cloud services. These characteristics describe an environment
    in which IT services can be allocated by the end user (e.g., on-demand self service),
    can be scaled as needed (e.g., rapid elasticity), and which are paid for by a
    subscription as opposed to a one-time purchase fee (e.g., measured service). NIST
    essential characteristics also describe an environment in which services are available
    across the network and IT resources are colocated to facilitate sharing and scaling.
    In contrast, traditional IT environments focus on locally hosted hardware purchased
    through one-time capital expenditures, planned as opposed to on-demand capacity,
    and static or more slowly changed service offerings. It is important to consider
    these features (e.g., elasticity, scalability, on-demand) when examining cloud
    solutions, but it is equally important to consider which features are preferable
    for a given service. For example, in the library marketplace outsourced or hosted
    IT services and dedicated SaaS providers often offer cloud services that are neither
    on-demand nor elastic but which may make use of these characteristics to create
    and manage their underlying cloud infrastructure.


    # Service Models


    SaaS, PaaS, and IaaS service models are the most common ones discussed in cloud
    computing definitions, but there are situations in which the distinctions'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'between them are unclear. The “as-a-service” approach to cloud computing includes
    database as a service (DaaS; Howe et al. 2011), security as a service (SECaaS;
    Hussain and Abdulsalam 2011), and identity as a service (Krüger and Grabski 2009).
    The reuse of acronyms as well as a broadening of definitions in cloud computing
    can make it difficult for information organizations to identify and select services.
    At the same time, companies are able to provide niche services that would be difficult
    or too expensive for smaller organizations to implement. For example, CloudFlare
    (www.cloudflare.com) protects against denial of service and traffic load spikes
    by managing domain name service (DNS) and service replication across multiple
    cloud providers without the required load balancing and security configuration
    required for this type of service. By taking advantage of such a service, an information
    organization can built robustness into its IT configuration without the costs
    that would have been a necessity in more traditional IT environments. As our exploration
    of these service models in chapters 4 and 5 shows, the model a library chooses
    largely depends on factors such as local expertise, IT service requirements, organizational
    policy, and local preference.


    # Deployment Models


    NIST’s four deployment models (Fang et al. 2011) differentiate internal and external
    environments and examine approaches to cloud computing that serve specific communities.
    In this model, private clouds are defined as an environment in which the customer
    has exclusive physical or virtual access to its computing services. These services
    may be on-site or remotely hosted by a cloud provider, but typically they involve
    dedicated hardware and are available only via private physical or virtual networks.
    In community cloud environments a group of related customers have shared access
    to computing services. Although the actual computing services may be run in-house
    or by the cloud provider, community clouds tend to feature shared access to some
    or all resources in the cloud environment. Government clouds or educational clouds
    are good examples of community and private clouds. These environments may be run
    on dedicated hardware and networks, as in the case of private clouds, but may
    also be run on hardware that serves other cloud customers but with virtual isolation.
    The Amazon government computing cloud is just one of many community/private cloud
    solutions available. In contrast to private and community clouds, public cloud
    solutions feature a cloud-computing service and infrastructure that is made available
    to the general public. Though public cloud platforms are open to all subscribers,
    they often feature security layers that allow'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Chapter One\n\nsubscribers to create virtually private environments that\
    \ are as secure as private clouds. For example, the AWS platform operates largely\
    \ as a public cloud solution but is designed so that customer IT resources are\
    \ virtually isolated from Amazon employees and other subscribers. Hybrid clouds\
    \ are the “catch-all” of models in that they include features of two or more types\
    \ of cloud systems (public, private, or community) but are bound together for\
    \ data or application sharing.\n\nThere are both risks and advantages of scale\
    \ that go with each deployment approach. For instance, in environments where physical\
    \ security and virtual privacy are of utmost importance, public clouds are likely\
    \ not the best solution. Likewise, where economies of scale and interoperability\
    \ are important, private clouds are not likely to be best suited. It is important\
    \ to be familiar with these models; understanding them helps contextualize options\
    \ for cloud computing adoption. Good explanations that focus on the intersection\
    \ between service models and deployment models have been prepared by various authors\
    \ (Mell and Grance 2011; Metz 2011) and further inform on the differences between\
    \ them.\n\nIn addition to understanding the distinction between service and deployment\
    \ models, it is important to understand the roles of cloud providers and subscribers.\
    \ These include common roles such as cloud adopter and cloud provider as well\
    \ as emerging roles such as cloud auditor and cloud broker. The NIST reference\
    \ model in figure 1.1 shows the relationships among these participants and explores\
    \ the\n\n![](img/f597dcda42d1ecd1c6edb1e8e00d8ca1_21_0.png)\n\n**FIGURE 1.1**\
    \  \nNIST cloud reference model"
  merge: -1
  img_proc: true
- pgno: 22
  md: 'relationship between activities (e.g., cloud use, development, deployment)
    and auditing, managing, and functions such as service deployment, resource allocation,
    and physical/virtual security.


    The NIST model also defines the limits of expertise and responsibility that should
    be expected of the various players in a cloud computing solution. It is worth
    noting that the roles of consumer, auditor, provider, carrier, and broker may
    not apply in all cloud computing adoption frameworks; nevertheless, they are valuable
    roles to consider when exploring new IT systems. For example, in many cases libraries
    (e.g., the cloud consumer) interact directly with cloud providers rather than
    working through a cloud broker. In this case the process of working with and auditing
    service layers, security, privacy, and service-level agreements (SLAs) falls on
    the cloud consumer. The NIST model also provides a taxonomy of cloud features
    (Fang et al. 2011) that describes the issues cloud consumers should be aware of
    when selecting and implementing a cloud solution. This taxonomy defines the activities
    (e.g., service creation, publishing, auditing), components (e.g., processes, actions,
    tasks), and subcomponents (e.g., service provision, service decommission) that
    may be helpful for organizations seeking to understand relationships and interactions
    important in cloud computing adoption.


    # VIRTUALIZATION


    In contrast to cloud computing, virtualization is defined as “the abstraction
    of IT resources in a way that masks the physical nature and boundaries of those
    resources from resource users” (Gartner 2011). Virtualization enables creation
    of multiple virtual machines on a shared hardware platform; enhances flexibility
    in CPU, memory, and storage allocations between machines; and is designed to be
    portable across hardware platforms (Smith and Nair 2005). This is a broad definition
    that includes the virtualization of servers, clients, network-attached storage,
    and any number of other computing resources. Common server platforms include XEN
    (http://xen.org), Citrix (http://citrix.com), and VMware (http://vmware.com).
    Each virtualization platform has historically supported its own virtualization
    format (e.g., Kernel Virtual Machine, Bare Metal, VMWare VMDK), but there is also
    a movement to support an open virtualization standard that would enable easy interoperability
    among virtualization platforms. These solutions can be a valuable tool for libraries,
    but they often come with a requirement for technical infrastructure and expertise
    that commonly is not held by libraries.'
