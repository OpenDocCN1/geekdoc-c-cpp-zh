    When selecting a PaaS solution, it is important to understand what system migration
    options exist and to document the process for implementing your production environment
    in a selected PaaS provider. These elements include


    # Creating a Fail-Forward Plan


    Having a good fail-back and fail-forward plan is key to taking on the responsibility
    of managing your own IT services. A good fail-forward plan should include documentation
    on


    +   - Application elements

    +   - Core application requirements (e.g., Linux, MySQL, PHP, additional libraries)

    +   - Application version and dependencies

    +   - Application backups (e.g., executable scripts, customized files, database
    files)

    +   - System configuration (e.g., DNS mapping, user account creation)


    This documentation should not just be abstract but should include a plan for implementing
    your service in a new environment. This may seem unnecessarily complex, but if
    you are depending on a PaaS server environment it is important to be prepared
    to migrate to a new provider if the current provider has significant technical
    problems or goes out of business.'
