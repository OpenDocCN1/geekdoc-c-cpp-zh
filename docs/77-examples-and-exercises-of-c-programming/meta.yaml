    \ by parties that act or refrain from acting as a result of information in this\
    \ publication.\n\nPerpustakaan Negara Malaysia\nCataloguing-in-Publication Data\n\
    Md. At-Tarmizimi Abu Hassan, Ts., 1985-\n77 EXAMPLES & EXERCISES OF C PROGRAMMING\
    \ /\nAuthor Ts. Mohd At-Tarmizimi Bin Abu Hassan.\nMode of access: Internet\n\
    eISBN 978-967-2860-38-9\n1. C (Computer program language).\n2. Programming languages\
    \ (Electronic computers).\n3. Government publications--Malaysia.\n4. Electronic\
    \ books.\n\nTitle.\n005.133\n\nPublished by:\nPoliteknik Sultan Idris Shah,\n\
    Sungai Lang,\n45100 Sungai Air Tawar,\nSelangor Darul Ehsan.\nNo. Tel: 03 3280\
    \ 6200\nNo. Fax: 03 3280 6400\n\nWebsite: https://psis.polymycc.edu.my/index.php/interaktif/penerbitan\
    \ @ Ts. Mohd At-Tarmizimi Bin Abu Hassan.\n\n# ACKNOWLEDGEMENTS\n\nI would like\
    \ to acknowledge the assistance and encouragement of our families, friends and\
    \ top management of Politeknik Sultan Idris Shah who have actively contributed\
    \ to the successful publication of this book.\n\nTs. Mohd At-Tarmizi Bin Abu Hassan\n\
    \n# PREFACE\n\nThis book is dedicated to all students of Electrical Engineering\
    \ at the polytechnic who take the subject DEC20012 - Fundamental Programming.\
    \ The content is designed to enhance C programming understanding and skills through\
    \ variations of examples and exercises. \"Practice makes perfect!\"\n\n# TABLE\
    \ OF CONTENTS\n\n| Topic | Page |\n| :--- | :--- |\n| Acknowledgements | iii |\n\
    | Preface | iv |\n| Table of Contents | v |\n| 77 Examples of C Programming -\
    \ Sequences Structure | 1-16 |\n| 77 Examples of C Programming - Selection Structure\
    \ | 17-35 |\n| 77 Examples of C Programming - Repetition Structure | 36-49 |\n\
    | 77 Examples of C Programming - Array | 50-60 |\n| 77 Examples of C Programming\
    \ - Function | 61-77 |\n| 77 Examples of C Programming - Pointer | 78-79 |\n|\
    \ 77 Examples of C Programming - Applications | 80-86 |\n| 77 Exercises of C Programming\
    \ | 87-103 |\n| References and Further Studies | vi |\n\n# 77 EXAMPLES OF C PROGRAMMING\n\
    \n# 1. SEQUENCE STRUCTURE\n\n## 1. HelloWorld.c source code\n\n```c\nHelloWorld.c\n\
    #include <stdio.h>\nvoid main() {\n    printf(\"Hello world! \\nwelcome to C Programming\
    \ ;\");\n}\n```\n\n## 1. HelloWorld.c output file\n\n```\nHello World!\nWelcome\
    \ to C Programming ;\n```\n\n## 2. WelcomeKEPSIS.c source code\n\n```c\nWelcomeToKEPSIS.c\n\
    #include <stdio.h> //header file\nvoid main() // function\n{ // curly bracket\
    \ for begin function\nprintf(\"welcome to\\t\"); // output to computer screen,\
    \ \\t = Horizontal tab\nprintf(\"Electrical Engineering Department \\nPolytechnic\
    \ Sultan Idris Shah.\\n\") // \\n = Newline\nprintf(\"Good luck!\\n\");\ngetchar();\n\
    } // closed bracket for end function\n```\n\n## 2. WelcomeToKEPSIS.c output file\n\
    ```\nWelcome Electrical Engineering Department\nPolytechnic Sultan Idris Shah.\n\
    Good Luck!\n```\n\n## 3. ComputerGenie_getch.c source code\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n    char num;\n    printf(\"I am your computer genie!\\n\");\n\
    \    printf(\"Enter a number from 0 to 9: \");\n    num = getch();\n    printf(\"\
    \\nYou typed in %c!\\n\",num);\n    printf(\"The genie knows all, sees all!\\\
    n\");\n    return(0);\n}\n```\n\n## 3. ComputerGenie_getch.c output file\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_7_0.png)\n\
    \n## 4. ComputerGenie_getchar.c source code\n\n```c\n#include <stdio.h>\nint main()\n\
    {\n    char num;\n    printf(\"I am your computer genie!\\n\");\n    printf(\"\
    Enter a number from 0 to 9: \");\n    num = getch();\n    printf(\"\\nYou typed\
    \ in %c!\\n\",num);\n    printf(\"The genie knows all, sees all!\\n\");\n    return(0);\n\
    }\n```\n\n## 4. ComputerGenie_getchar.c output file\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_7_1.png)\n\
    \n## 5. ComputerGenie_getche.c source code\n\n```c\n5_ComputerGenie_getche.c\n\
    #include <stdio.h>\nint main()\n{\n    char num;\n    printf(\"I am your computer\
    \ genie!\\n\");\n    printf(\"Enter a number from 0 to 9: \");\n    num = getche();\n\
    \    printf(\"\\nYou typed in %c!\\n\",num);\n    printf(\"The genie knows all,\
    \ sees all!\\n\");\n    return(0);\n}\n```\n\n## 5. ComputerGenie_getche.c output\
    \ file\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_8_0.png)\n\n## 6. Understand_Various_Data_Types.c\
    \ source code\n\n```c\nUnderstand_Various_Data_Types.c\n/* various data types\
    \ allowing others to better understand what the code intended\nto accomplish and\
    \ greatly helping in debugging.\nComments are especially important in projects\
    \ containing hundreds\nor thousands of lines of source code or which many contributors\
    \ are working on the code*/\n#include <stdio.h>\nint main() {\n    char c = 'B';\n\
    \    char name[30] = \"C Programming\"; // spaces between words\n    float f =\
    \ 1.23456789;\n    int num = 15;\n    printf(\"Character is %c \\n\", c); // single\
    \ character only 'B'\n    printf(\"Name is %s\\n\", name);\n    printf(\"Float\
    \ value is %.2f\\n\", f); // output up to 2 decimal places\n    printf(\"Integer\
    \ value is %d\\n\", num); // source code\n    return 0;\n}\n```\n\n## 6. Understand_Various_Data_Types.c\
    \ output\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_9_0.png)\n\n## 7. Draw_Guns_in_the_specified_format.c\
    \ source code\n\n```c\nDraw_Guns_in_the_specified_format.c\n// Draw gun in the\
    \ specified format\n#include <stdio.h>\nmain() {\n    printf(\"-------\");\n \
    \   printf(\"\\n|      |       0\");\n    printf(\"\\n|------\");\n    printf(\"\
    \\n|      ____\");\n    printf(\"\\n / XXXXX / |\");\n    printf(\"\\n / XXXXX\
    \ / /\");\n    printf(\"\\n / XXXXX/-------\");\n    printf(\"\\n / XXXXX /\\\
    n\");\n    printf(\"\\n / XXXXX /\\n\");\n    printf(\"(      ())\");\n    printf(\"\
    \\n-------\");\n}\n```\n\n## 7. Draw_Guns_in_the_specified_format.c output file\n\
    ![](img/e92476a5d6aa5bdedf97a2e75f15734b_10_0.png)\n\n## 8. Basic_Calculator.c\
    \ source code\n\n```c\n// Basic Arithmetic / Mathematical Operators\n// This program\
    \ demonstrates binary expression\n#include <stdio.h> // header file\nvoid main(void)\
    \ // main function\n{\n    int num1; // define identifier 'num1' as integer value,\
    \ num1 = variable name\n    int num2=5; // define identifier 'num2' as integer\
    \ value, constant name num2 = 5;\n    printf(\"Please enter a value for number\
    \ 1: %d\\n\",\n    // console input (usually assigned to the screen computer)\n\
    \    scanf(\"%d\", &num1);\n    // console input assigned to the keyboard\n  \
    \  // addition process\n    printf(\"%d + %d = %d\\n\", num1, num2, num1+num2);\n\
    \    // subtraction process\n    printf(\"%d - %d = %d\\n\", num1, num2, abs(num1-num2));\n\
    \    // multiplication process\n    printf(\"%d * %d = %d\\n\", num1, num2, num1*num2);\n\
    \    // division process\n    printf(\"%d / %d = %d\\n\", num1, num2, num1/num2);\n\
    \    // refer to modulo or \"hasil bagi\"\n    printf(\"%d %% %d = %d\\n\", num1,\
    \ num2, num1%num2);\n} // // closed bracket\n```\n\n## 8. Basic_Calculator.c output\
    \ file\n\n| Please enter a value for number 1: 25 |\n| 25 + 5 = 30 |\n| 25 - 5\
    \ = 20 |\n| 25 * 5 = 125 |\n| 25 / 5 = 5 |\n| 25 % 5 = 0 |\n"
  mdcn: "\n\n# C语言编程的77个示例与练习\n\n作者\nTs. Mohd At-Tarmizi Bin Abu Hassan\n\n出版者\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_1_0.png)\n\
