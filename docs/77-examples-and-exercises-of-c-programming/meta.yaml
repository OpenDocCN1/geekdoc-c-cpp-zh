    \ /\n作者 Ts. Mohd At-Tarmizimi Bin Abu Hassan.\n访问模式：互联网\neISBN 978-967-2860-38-9\n\
    1. C（计算机程序语言）。\n2. 编程语言（电子计算机）。\n3. 政府出版物--马来西亚。\n4. 电子书。\n\n标题。\n005.133\n\n\
    出版单位：\nPoliteknik Sultan Idris Shah,\nSungai Lang,\n45100 Sungai Air Tawar,\n\
    Selangor Darul Ehsan.\n电话：03 3280 6200\n传真：03 3280 6400\n\n网站：https://psis.polymycc.edu.my/index.php/interaktif/penerbitan\
    \ @ Ts. Mohd At-Tarmizimi Bin Abu Hassan.\n\n# 致谢\n\n我要感谢我们的家人、朋友以及Sultan Idris\
    \ Shah理工学院高管理层的帮助与鼓励，他们对本书的成功出版做积极贡献。\n\nTs. Mohd At-Tarmizi Bin Abu Hassan\n\n\
    # 序言\n\n本书献给理工学院所有修读 DEC20012 - 基础编程课程的电气工程学生。内容旨在通过各种示例和练习来增强对 C 编程的理解和技能。“熟能生巧！”\n\
    \n# 目录\n\n| 主题 | 页码 |\n| :--- | :--- |\n| 致谢 | iii |\n| 序言 | iv |\n| 目录 | v |\n\
    | C语言编程的77个示例 - 顺序结构 | 1-16 |\n| C语言编程的77个示例 - 选择结构 | 17-35 |\n| C语言编程的77个示例 -\
    \ 循环结构 | 36-49 |\n| C语言编程的77个示例 - 数组 | 50-60 |\n| C语言编程的77个示例 - 函数 | 61-77 |\n\
    | C语言编程的77个示例 - 指针 | 78-79 |\n| C语言编程的77个示例 - 实例 | 80-86 |\n| C语言编程的77道练习 | 87-103\
    \ |\n| 参考文献与进一步学习 | vi |\n\n# C语言编程的77个示例\n\n# 1. 顺序结构\n\n## 1. HelloWorld.c 源代码\n\
    \n```c\nHelloWorld.c\n#include <stdio.h>\nvoid main() {\n    printf(\"Hello world!\
    \ \\nwelcome to C Programming ;\");\n}\n```\n\n## 1. HelloWorld.c 输出文件\n\n```\n\
    Hello World!\nWelcome to C Programming ;\n```\n\n## 2. WelcomeKEPSIS.c 源代码\n\n\
    ```c\nWelcomeToKEPSIS.c\n#include <stdio.h> //头文件\nvoid main() // 函数\n{ // 函数开始的左括号\n\
    printf(\"welcome to\\t\"); // 输出到电脑屏幕， \\t = 水表符\nprintf(\"Electrical Engineering\
    \ Department \\nPolytechnic Sultan Idris Shah.\\n\") // \\n = 换行\nprintf(\"Good\
    \ luck!\\n\");\ngetchar();\n} // 函数结束的右括号\n```\n\n## 2. WelcomeToKEPSIS.c 输出文件\n\
    ```\nWelcome Electrical Engineering Department\nPolytechnic Sultan Idris Shah.\n\
    Good Luck!\n```\n\n## 3. ComputerGenie_getch.c 源代码\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n    char num;\n    printf(\"I am your computer genie!\\n\");\n\
    \    printf(\"Enter a number from 0 to 9: \");\n    num = getch();\n    printf(\"\
    \\nYou typed in %c!\\n\",num);\n    printf(\"The genie knows all, sees all!\\\
    n\");\n    return(0);\n}\n```\n\n## 3. ComputerGenie_getch.c 输出文件\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_7_0.png)\n\
    \n## 4. ComputerGenie_getchar.c 源代码 \n\n```c\n#include <stdio.h>\nint main()\n\
    {\n    char num;\n    printf(\"I am your computer genie!\\n\");\n    printf(\"\
    Enter a number from 0 to 9: \");\n    num = getch();\n    printf(\"\\nYou typed\
    \ in %c!\\n\",num);\n    printf(\"The genie knows all, sees all!\\n\");\n    return(0);\n\
    }\n```\n\n## 4. ComputerGenie_getchar.c 输出文件\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_7_1.png)\n\
    \n## 5. ComputerGenie_getche.c 源代码 \n\n```c\n5_ComputerGenie_getche.c\n#include\
    \ <stdio.h>\nint main()\n{\n    char num;\n    printf(\"I am your computer genie!\\\
    n\");\n    printf(\"Enter a number from 0 to 9: \");\n    num = getche();\n  \
    \  printf(\"\\nYou typed in %c!\\n\",num);\n    printf(\"The genie knows all,\
    \ sees all!\\n\");\n    return(0);\n}\n```\n\n## 5. ComputerGenie_getche.c 输出文件\n\
    ![](img/e92476a5d6aa5bdedf97a2e75f15734b_8_0.png)\n\n## 6. Understand_Various_Data_Types.c\
    \ 源代码 \n\n```c\nUnderstand_Various_Data_Types.c\n/* 各种数据类型允许他人更好地理解\nvarious data\
    \ types allowing others to better understand what\nto accomplish and greatly helping\
    \ in.\nComments of code or especially\nlines of source code or which many contributors\n\
    #include <stdio.h>\nint main() {\n    char c = 'B'; // single character only 'B'\n\
    \    char name[30] = \"C\";\n    float f = 1.23456789; // decimal places\n   \
    \ int num = 15; // integer value\n    printf(\"Character is %c \\n\", c);\n  \
    \  printf(\"Name is %s\\n\", name);\n    printf(\"Float value is %.2f\\n\", f);\n\
    \    printf(\"Integer value is %d\\n\", num);\n    }\n*/\n```\n\n## 6. Understand_Various_Data_Types.c\
    \ 输出\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_9_0.png)\n\n## 7. Draw_Guns_in_the_format.c\
    \ 源代码 \n\n```c\nDraw_Guns_in_the_format.c\n// Draw gun in the specified format\n\
    #include <stdio.h>\nmain() {\n    printf(\"-------\");\n    printf(\"\\n|    \
    \  |\");\n    printf(\"\\n|______|\n    printf(\"\\n|______\");\n    printf(\"\
    \\n / XXXXX |\");\n    printf(\"\\n / XXXXX /\");\n    printf(\"\\n / XXXXX/-------\"\
    );\n    printf(\"\\n / XXXXX /\\n\");\n    printf(\"\\n / XXXXX /\\n\");\n   \
    \ printf(\"(())\");\n    printf(\"\\n-------\");\n}\n```\n\n## 7. Draw_Guns_in_the_format.c\
    \ 输出文件\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_10_0.png)\n\n## 8. Basic_Calculator.c\
    \ 源代码\n\n```c\n// Basic Arithmetic / Mathematical Operators\n// This program demonstrates\
    \ binary expression\n#include <stdio.h> // 头文件\nvoid main(void) // 主函数\n{\n  \
    \  int num1; // 定义标识 'num1' 为整数值, num1 =变量名\n    int num2=5; // 定义标识 'num2' 为整数值,\
    \ 常数名 num2 = 5;\n    printf(\"Please enter a value for number 1: %d\\n\",\n  \
    \  // 控制台输入（通常分配到电脑屏幕）\n    scanf(\"%d\", &num1); // 控制台输入到键盘\n    // 加法运算\n \
    \   printf(\"%d + %d = %d\\n\", num1, num2, num1+num2);\n    // 减法运算\n    printf(\"\
    %d - %d = %d\\n\", num1, num2, abs(num1-num2));\n    // 乘法运算\n    printf(\"%d\
    \ * %d = %d\\n\", num1, num2, num1*num2);\n    // 除法运算\n    printf(\"%d / %d =\
    \ %d\\n\", num1, num2, num1/num2);\n    // 参考模运算或“余数”\n    printf(\"%d %% %d =\
    \ %d\\n\", num1, num2, num1%num2);\n} // // 关闭的括号\n```\n\n## 8. Basic_Calculator.c\
    \ 输出文件\n\n| Please enter a value for number 1: 25 |\n| 25 + 5 = 30 |\n| 25 - 5\
    \ = 20 |\n| 25 * 5 = 125 |\n| 25 / 5 = 5 |\n| 25 % 5 = 0 |\n\n"
