  md: "# 10 - Understanding_Precedence.c source code\n\n```\nUnderstanding_Precedence.c\n\
    //Understanding_Precedence\n//Examine the effect of precedence on an expression.\n\
    #include <stdio.h>\nvoid main() {\n    int a = 10, b = 20, c = 30; // (10*20)\
    \ + 30 = 230\n    printf(\"a * b + c is: %d\\n\", a * b + c); // 30 + (10*20)\
    \ = 230\n    printf(\"a * (b + c) is: %d\\n\", a * (b + c)); // 10 * (20+30) =\
    \ 500\n    printf(\"b / a * c is: %d\\n\", b / a * c); // (20/10) * 30 = 60\n\
    \    printf(\"b / (a * c) is: %d\\n\", b / (a * c)); // (20 / (10*30)) = 0\n \
    \   printf(\"(b / a) * c) is: %d\\n\", (b / a) * c); // ((20/10)*30) = 60\n  \
    \  printf(\"\\n\");\n```\n\n# 10 - Understanding_Precedence.c output file\n\n\
