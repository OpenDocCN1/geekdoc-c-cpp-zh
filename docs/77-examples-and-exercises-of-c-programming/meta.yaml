- md: "\n# 77 EXAMPLES & EXERCISES OF C PROGRAMMING\n\nAuthor\nTs. Mohd At-Tarmizi\
    \ Bin Abu Hassan\n\nPublisher\n![](img/e92476a5d6aa5bdedf97a2e75f15734b_1_0.png)\n\
    \n# 77 Examples & Exercises of C Programming\n\nToutes droits réservés. Without\
    \ the author's explicit written consent, portion of this book may be duplicated,\
    \ saved for later retrieval, or converted into any form or by any method, mechanical,\
    \ electronic, refilming and recording, etc.\n\nThe views or opinions expressed\
