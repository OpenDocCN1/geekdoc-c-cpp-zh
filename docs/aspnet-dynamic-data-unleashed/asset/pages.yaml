- pgno: 158
  md: "If the user enters a search string for Title, the second Where method is called,\
    \ and the SQL query looks like the following:\n\n```\nselect * from Customers\
    \ where ContactTitle = @Title\n```\n\nOnly if the user entered both City and Title\
    \ search strings, both Where methods are called, and the SQL query includes conditions\
    \ for both columns:\n\n```\nselect * from Customers where City = @City and ContactTitle\
    \ = @Title\n```\n\nIn other words, with the help of LINQ, you can build focused\
    \ queries that include only those conditions required for the search values supplied\
    \ by the user. This helps the database server choose a more efficient execution\
    \ plan than a typical hand-coded SQL (shown next) that tries to handle both search\
    \ options and usually requires the database server to perform a full table scan:\n\
    \n```\nselect * from Customers\nwhere City = ISNULL(@City, City)\n  and ContactTitle\
    \ = ISNULL(@Title, ContactTitle)\n```\n\n# Creating a Filter Template\n\nA filter\
    \ template is a user control that encapsulates both presentation and data access\
    \ logic necessary to implement query filtering for a single column. In traditional\
    \ search pages, this logic is usually spread over the markup and code-behind files.\
    \ Consider the filtering logic required for the City column in our Customer search\
    \ page (see the markup in Listing 5.1).\n\n# LISTING 5.1   Simple Search Page\
    \ (Markup)\n\n```\n<%@ Page Title=\"\" Language=\"C#\"\n    MasterPageFile=\"\
    ~/Site.master\" CodeBehind=\"SamplePage.aspx.cs\"\n    Inherits=\"WebApplication.Samples.Ch05.LinqFilter.SamplePage\"\
    \ %>\n\n<asp:Content ContentPlaceHolderID=\"main\" runat=\"server\">\n    Customer\
    \ City: <asp:TextBox runat=\"server\" ID=\"cityFilter\" />\n    Title: <asp:TextBox\
    \ runat=\"server\" ID=\"titleFilter\" />\n    <asp:Button runat=\"server\" Text=\"\
    Find\" OnClick=\"Find_Click\" />\n    <asp:GridView ID=\"gridView\" runat=\"server\"\
    \ />\n</asp:Content>\n```\n\nThe traditional page includes a TextBox control where\
    \ the user can enter a value to search for in the City column. The data access\
    \ logic for filtering rows based on this value is a part of the Find_Click event\
    \ handler shown in Listing 5.2."
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Distributed Systems Architecture for Real-Time Data Processing at Scale


    Modern data-intensive applications demand low-latency processing of high-velocity
    streams while maintaining fault tolerance and horizontal scalability. Traditional
    batch-oriented architectures have proven insufficient for use cases such as fraud
    detection, IoT telemetry, and recommendation engines, which require continuous
    ingestion and analysis of millions of events per second.


    # 1. Introduction


    This paper explores a layered architecture that decouples ingestion, processing,
    storage, and serving. The ingestion layer acts as a durable buffer that absorbs
    bursts and replays data on demand. Processing engines run distributed computations
    with exactly-once semantics, while the serving layer provides indexed access to
    stateful views for applications and dashboards.


    +   - **Key design goals:**

    +     - Low latency (p99 < 100 ms)

    +     - Exactly-once state semantics

    +     - Elastic partitioning across commodity hardware

    +     - Automatic failover and rebalancing


    # 2. Related Work


    > > "The fundamental challenge is not processing speed, but coordinated state
    management across partitions."

    > > — M. Chen, 2023


    Existing frameworks such as Apache Flink, Kafka Streams, and Spark Streaming adopt
    different trade-offs between latency, throughput, and state consistency. Our work
    extends these foundations with a unified log-based storage model and adaptive
    partitioning strategies.


    # 3. System Overview


    ![](img/11b373b78859e17d318fd76939a0df9d_159_0.png)'
