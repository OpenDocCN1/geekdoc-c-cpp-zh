- pgno: 345
  md: "```\n}\n}\n}\n```\n\nThe OnInit method populates the list of items in the DropDownList\
    \ control using a static array of U.S. state abbreviations and initializes the\
    \ validators by calling the SetUpValidator method provided by the FieldTemplateUserControl\
    \ base class. The OnDataBinding method provides the initial selection for the\
    \ DropDownList based on the state value previously stored in the database, and\
    \ the ExtractValues method returns the new value selected by the user to the data\
    \ source control when it is time to save the customer entity in the database.\n\
    \n```\n<unl:UnleashedControl runat=\"server\" DataField=\"Region\" UIHint=\"State\"\
    \ />\n```\n\nWith the new custom field template created, you can now modify the\
    \ Customer entity template as just shown to use it for the Region property instead\
    \ of the default field template.\n\n> **NOTE**\n> \n> Value of the UIHint property\
    \ of the DynamicControl class should not include the _Edit suffix used in the\
    \ name of the field template. As explained in Chapter 4, Dynamic Data automatically\
    \ adds this suffix to the UIHint value when looking for the field template, and\
    \ had you set UIHint to State_Edit, it would be looking for a field template called\
    \ State_Edit_Edit.\n\n# Implementing Interaction Between Field Templates\n\nUnfortunately,\
    \ as you start using the new State field template, you soon discover that it does\
    \ not work well for international customers. Northwind Traders does business with\
    \ customers in Europe also, but only United States and Canada use states, or more\
    \ appropriately, regions, in their mailing addresses. Moreover, for the United\
    \ States and Canada, you also need the users to see only the regions appropriate\
    \ for a particular country. In other words, the field template for the Region\
    \ property of the Customer entity must somehow work together with the field template\
    \ for the Country property to provide the required user experience.\n\nYou can\
    \ start tackling this problem by renaming the custom field template from State_Edit\
    \ to Region_Edit to more accurately reflect that it is being used not only for\
    \ customers in the U.S., but in other countries as well. Because the list of regions\
    \ is no longer static, you cannot pretend to know all possible regions in all\
    \ countries and need to go back to using a TextBox as a data entry control. However,\
    \ to keep data entry easy for the most common countries, you can use the AutoCompleteExtender\
    \ from the AJAX"
  merge: -1
  img_proc: true
- pgno: 346
  md: "control toolkit to suggest a list of well-known regions to users based on the\
    \ countries they enter.\n\n```\n```aspx\n<asp:TextBox ID=\"textBox\" runat=\"\
    server\" Text=\"<%# FieldValueEditString %>\"/>\n<ajax:AutoCompleteExtender ID=\"\
    autoCompleteExtender\" runat=\"server\"\n    TargetControlID=\"textBox\" ServicePath=\"\
    /RegionCompletionService.svc\"\n    ServiceMethod=\"GetCompletionList\" />\n```\n\
    ```\n\nThe AutoCompleteExtender requires a web service method to get the list\
    \ of suggested values. This web service, shown in Listing 10.13, defines a single\
    \ method, GetCompletionList, that will be called by the client-side JavaScript\
    \ code generated by the AutoCompleteExtender based on the ServicePath and ServiceMethod\
    \ attributes. Although the method name itself is configured in markup, the names\
    \ and the order of the parameters have to match exactly what the AutoCompleteExtender\
    \ implementation expects. In particular, the prefixText parameter receives the\
    \ current value user entered in the Region text box, the count specifies the number\
    \ of matching items that should be returned, and the contextKey will be the value\
    \ user entered in the Country field.\n\n# LISTING 10.13 RegionCompletionService\
    \ Implementation\n\n```\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.ServiceModel;\n\nnamespace WebApplication\n{\n\
    \    [ServiceContract]\n    public class RegionCompletionService\n    {\n    \
    \    private static readonly Dictionary<string, string[]> regionsByCountry =\n\
    \            new Dictionary<string, string[]>(StringComparer.InvariantCultureIgnoreCase)\n\
    \        {\n            { \"Canada\",\n                new[] {\n             \
    \       \"ON\", \"QC\", \"NS\", \"NB\", \"MB\", \"BC\", \"PE\", \"SK\", \"AB\"\
    , \"NL\",\n                    \"NT\", \"UT\", \"NU\"\n                }\n   \
    \         },\n            { \"USA\",\n                new[] {\n              \
    \      \"AL\", \"AK\", \"AZ\", \"AR\", \"CA\", \"CO\", \"CT\", \"DE\", \"FL\"\
    , \"GA\",\n                    \"HI\", \"ID\", \"IL\", \"IN\", \"IA\", \"KS\"\
    , \"KY\", \"LA\", \"ME\", \"MD\",\n                    \"MA\", \"MI\", \"MN\"\
    , \"MS\", \"MO\", \"MT\", \"NE\", \"NV\", \"NH\", \"NJ\",\n```\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: "```\n\"NM\", \"NY\", \"NC\", \"ND\", \"OH\", \"OK\", \"OR\", \"PA\", \"RI\"\
    , \"SC\",\n    \"SD\", \"TN\", \"TX\", \"UT\", \"VT\", \"VA\", \"WA\", \"WV\"\
    , \"WI\", \"WY\"\n  }\n}\n};\n\n[OperationContract]\npublic string[] GetCompletionList(\n\
    \    string prefixText, int count, string contextKey)\n{\n    var country = contextKey\
    \ ?? string.Empty;\n    string[] regions;\n    if (regionsByCountry.TryGetValue(country,\
    \ out regions))\n    {\n        var ignoreCase = StringComparison.InvariantCultureIgnoreCase;\n\
    \        return regions\n            .Where(r => r.StartsWith(prefixText, ignoreCase))\n\
    \            .Take(count)\n            .ToArray();\n    }\n    return new string[0];\n\
    }\n}\n```\n\nThe RegionCompletionService uses a Dictionary object to store a list\
    \ of regions for each known country. The GetCompletionList method performs lookup\
    \ in the dictionary to find an array of regions for the given country and returns\
    \ only those regions that start with the prefix entered by the user. Both dictionary\
    \ lookup and the prefix filtering are implemented to ignore case.\n\nWith WCF,\
    \ implementing a service is only half the battle; endpoint configuration is crucial\
    \ to allow the client code (which in this case is JavaScript) to call the service\
    \ successfully. In the sample project, this is done by specifying the WebScriptServiceHostFactory\
    \ in the @ServiceHost directive of the .SVC file, which takes care of configuring\
    \ the HTTP endpoint based on the location of the SVC file and accepting JSON-formatted\
    \ method calls generated by the AutoCompleteExtender.\n\n# LISTING 10.14 RegionCompletionService.svc\n\
    \n```\n<%@ ServiceHost Language=\"C#\" Debug=\"true\" Service=\"WebApplication.RegionCompletionService\"\
    \ CodeBehind=\"RegionCompletionService.svc.cs\" Factory=\"System.ServiceModel.Activation.WebScriptServiceHostFactory\"\
    \ %>\n```"
