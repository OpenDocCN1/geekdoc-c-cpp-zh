- pgno: 229
  md: "# # The MetaForeignKeyColumn Class\n\nThe MetaForeignKeyColumn class is a specialized\
    \ descendant of the MetaColumn class that represents many-to-one and one-to-one\
    \ navigation properties, such as the Supplier property of the Product entity in\
    \ the Northwind data model. These “foreign key” columns in the Dynamic Data metadata\
    \ API have additional attributes that you can access through this class.\n\n```\n\
    ```csharp\npublic MetaTable ParentTable { get; }\n```\n```\n\nThe ParentTable\
    \ property returns a MetaTable object describing the parent entity referenced\
    \ by the foreign key. In case of the Supplier property of the Product entity,\
    \ the ParentTable property returns the MetaTable object describing the Supplier\
    \ entity. This property serves an important role in implementing filtering and\
    \ navigation functionality. In particular, it is used by the ForeignKey field\
    \ and filter templates to retrieve the rows from the parent table for display\
    \ in a drop-down list.\n\n```\n```csharp\npublic ReadOnlyCollection<string> ForeignKeyNames\
    \ { get; }\n```\n```\n\nThe ForeignKeyNames property of the MetaForeignKeyColumn\
    \ class returns a collection of the primitive entity properties that form the\
    \ foreign key. For the Supplier property of the Product entity, this property\
    \ returns a collection with a single column name—SupplierID. The collection returned\
    \ by this property has multiple items only if the parent table has a compound\
    \ primary key and the foreign key includes multiple primitive properties.\n\n\
    # ## Presentation Logic\n\nThe remaining properties and methods of the MetaForeignKeyColumn\
    \ class provide support for implementing presentation logic in Dynamic Data applications.\n\
    \n```\n```csharp\npublic bool IsPrimaryKeyInThisTable { get; }\n```\n```\n\nThe\
    \ IsPrimaryKeyInThisTable property of the MetaForeignKeyColumn class returns true\
    \ if any of the primitive components of the foreign key is a member of the primary\
    \ key of the entity itself. For example, the Order_Detail entity in the Northwind\
    \ data model has a compound primary key that consists of OrderID and ProductID\
    \ properties. The Order navigation property is represented by a MetaForeignKeyColumn\
    \ whose IsPrimaryKeyInThisTable returns true because OrderID is a part of the\
    \ primary key of the Order_Detail entity.\n\n> **NOTE**\n> \n> Dynamic Data does\
    \ not allow editing primary key values by default and uses the IsPrimaryKeyInThisTableProperty\
    \ property to display read-only field templates for foreign key columns that are\
    \ a part of a primary key in Edit mode.\n\n```\n```csharp\npublic IList<object>\
    \ GetForeignKeyValues(object row);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The GetForeignKeyValues method of the MetaForeignKeyColumn class returns a
    list values of the primitive entity properties that form the foreign key of a
    given row or entity instance. Using the Products table of the Northwind database
    as an example, the product called “Chai” has a SupplierID equal to 1; calling
    the GetForeignKeyValues method for this row returns a list with a single Int32
    value (1). The order of values returned by this method matches the order of column
    names returned by the ForeignKeyNames property.


    ```

    public string GetForeignKeyPath(string action, object row);

    public string GetForeignKeyPath(string action, object row, string path);

    ```


    The GetForeignKeyPath methods of the MetaForeignKeyColumn class extract the list
    of foreign key values from the specified row by calling the GetForeignKeyValues
    method and then pass it to the GetActionPath method of the ParentTable. The action
    parameter is typically specified using one of the values defined in the PageAction
    static class. The row parameter is an instance of the entity that contains the
    foreign key. And path can be specified when additional query parameters need to
    be specified in the query string.


    Similar to the GetActionPath method of the MetaTable class, the GetForeignKeyPath
    methods are used when a hyperlink is needed to navigate from a child entity to
    a parent entity. This is how the read-only ForeignKey field template generates
    the URL of its hyperlink.


    ```

    public string GetForeignKeyString(object row);

    ```


    The GetForeignKeyString method calls the GetForeignKeyValues method to obtain
    values of the primitive foreign key columns and converts them to a string where
    individual values are separated by commas. For the Supplier foreign key of the
    Product entity, this would return a single SupplierID value, such as “1” for the
    “Chai” product.


    This method serves as a counterpart for the GetPrimaryKeyString method of the
    MetaColumn class discussed earlier. The ForeignKey_Edit field template uses the
    GetPrimaryKeyString method to generate values for the drop-down list items representing
    rows from the parent table. To select the current value of the foreign key property
    in the drop-down list, it calls the GetForeignKeyString method.


    ```

    public void ExtractForeignKey(IDictionary dictionary, string value);

    ```


    The ExtractForeignKey method is the opposite of the GetForeignKeyString. It takes
    a comma-separated list of foreign key-Edit values and extracts them into a dictionary.
    Field templates use this method to implement data-binding logic, extract a current
    foreign key value from their web controls, and pass it to a data source control.
    In particular, if the “Exotic Liquids” is selected as a supplier for the “Chai”
    product, the ExtractForeignKey method will receive a string that contains ID of
    the supplier - “1” and add value 1 with key “SupplierID” to the dictionary.'
