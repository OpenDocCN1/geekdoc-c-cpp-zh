    # Class-Level Validation Methods\n\nYou might have noticed that the VerifyOrderDate\
    \ method actually creates a problem for orders that have already been placed.\
    \ Imagine that a customer placed an order on Monday night, and on Tuesday morning,\
    \ an employee ships the order and needs to change its status to Fulfilled. Because\
    \ the OrderDate is already in the past, the application will not allow the employee\
    \ to change the order.\n\nThe flaw in the original implementation of the VerifyOrderDate\
    \ is that the value of OrderDate is checked separately from other properties of\
    \ the Order entity. You still want to make sure that new orders are not submitted\
    \ with a date in the past, but you also want to allow employees to update the\
    \ order status later. One possible way to solve this problem is to check the OrderDate\
    \ property only when the OrderStatus is null, which should be the case for the\
    \ newly created Order entities before they are marked Submitted.\n\nTo perform\
    \ a validation check that involves more than one property, change the VerifyOrderDate\
    \ method so that instead of the OrderDate property value, it validates the entire\
    \ Order entity instance. Begin by moving the CustomValidationAttribute from the\
    \ OrderDate property to the Metadata class inside of the Order entity:\n\n```\n\
    [CustomValidation(typeof(Order), \"ValidateOrderDate\")]\nprivate abstract class\
    \ Metadata\n{\n    [Required]\n    [Display(Name = \"Order Date\")]\n    public\
    \ object OrderDate { get; set; }\n}\n```"
