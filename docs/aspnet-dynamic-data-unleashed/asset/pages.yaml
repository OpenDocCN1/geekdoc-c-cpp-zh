  md: "# Improving Encapsulation of Field Templates\n\nAlthough the current implementation\
    \ of the Region field template satisfies your immediate requirements, it also\
    \ suffers from a serious problem. By accessing the DataControl of the Country\
    \ field template directly and casting it down to the TextBox type, the Region\
    \ field template assumes that the Country field template will always use a TextBox\
    \ as its data control. Although this assumption is correct today, it easily breaks\
    \ as soon as you decide to change what is really an internal implementation of\
    \ how the Country property is presented on the web page. You could decide to create\
    \ a custom field template with a DropDownList so that users can pick a country\
    \ instead of typing its name. You could also decide to change the Text_Edit field\
    \ template to use a third-party control instead of the built-in TextBox. Any number\
    \ of changes like this breaks the Region_Edit field template.\n\nAs the number\
    \ of dynamic and custom field templates increases, improving encapsulation helps\
    \ to keep their maintenance simple. The need to access the current field value\
    \ and detect its changes is a common problem. You can solve it by introducing\
    \ an extended base class for field templates that provides a common way to access\
    \ this information without having to take a dependency on the specific implementation\
    \ details of a particular template. In the sample solution accompanying this book,\
    \ this new base class is called UnleashedFieldTemplate; you can see its complete\
    \ source code in Listing 10.16.\n\n# LISTING 10.16 UnleashedFieldTemplate Base\
    \ Class\n\n```\n```csharp\nusing System;\nusing System.Collections.Specialized;\n\
    using System.ComponentModel;\nusing System.Web.DynamicData;\nusing System.Web.UI;\n\
    using System.Web.UI.WebControls;\n\nnamespace Unleashed.DynamicData\n{\n    public\
    \ class UnleashedFieldTemplate : FieldTemplateUserControl\n    {\n        private\
    \ static readonly object FieldValueChangedEvent = new object();\n\n        public\
    \ virtual bool AutoPostBack { get; set; }\n\n        public override object FieldValue\n\
    \        {\n            get { return base.FieldValue; }\n            set\n   \
    \         {\n                if (base.FieldValue != value)\n                {\n\
    \                    base.FieldValue = value;\n                    this.OnFieldValueChanged(EventArgs.Empty);\n\
    \                }\n            }\n        }\n```\n```"
