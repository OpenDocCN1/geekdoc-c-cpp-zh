  md: '![](img/11b373b78859e17d318fd76939a0df9d_47_0.png)


    FIGURE 1.17 QueryExtender and QueryableFilterRepeater Sample.


    You might be disappointed to see that only three filters were generated for the
    entire Products table that contains almost a dozen of different columns. That
    is because Dynamic Data project template offers only three filter templates out
    of the box—Boolean, Enumeration, and ForeignKey. However, as you will see in Chapter
    5, it is straightforward to create your own filter templates for other data types.


    # Page Templates and URL Routing


    By now, you have been introduced to the major building blocks Dynamic Data offers
    for creating CRUD pages. Field and entity templates are used to build pages for
    inserting, editing, and displaying a single record. Filter templates and the field
    generator are used to build list pages that allow search and display of multiple
    records. If you look back at the code samples, you might notice that the only
    thing tying them to a particular table is the configuration of the EntityDataSource
    control in page markup. By simply changing the page to initialize the EntitySetName
    property of the EntityDataSource programmatically, perhaps based on a URL parameter,
    you could reuse a single page for any number of different tables. This is precisely
    what the Dynamic Data page templates do.


    Out of the box, Dynamic Data project template offers five page templates, which
    are shown in Figure 1.18.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "![](img/11b373b78859e17d318fd76939a0df9d_48_0.png)\n\nFIGURE 1.18 Page templates\
    \ in a Dynamic Data project.\n\nPage templates rely on URL routing to determine\
    \ the table they need to display and require additional setup. Listing 1.19 shows\
    \ how this is done in the Global.asax file of the web application.\n\n# LISTING\
    \ 1.19 Registering Dynamic Data URL Route in Global.asax.cs\n\n```\nusing System;\n\
    using System.Web.DynamicData;\nusing System.Web.Routing;\nusing DataModel;\n\n\
    namespace WebApplication\n{\n    public class Global : System.Web.HttpApplication\n\
    \    {\n        public static readonly MetaModel DefaultModel = new MetaModel();\n\
    \n        void Application_Start(object sender, EventArgs e)\n        {\n    \
    \        var modelConfiguration = new ContextConfiguration();\n            modelConfiguration.ScaffoldAllTables\
    \ = true;\n            DefaultModel.RegisterContext(typeof(NorthwindEntities),\
    \ modelConfiguration);\n            RouteTable.Routes.Add(new DynamicDataRoute(\"\
    {table}/{action}.aspx\"));\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 49
  md: 'In particular, you need to create a DynamicDataRoute and register it in the
    global RouteTable. The route object defines a special URL format where the traditional
    QueryString parameters become a part of the virtual path. In this example, the
    route defines a {table} parameter, so instead of a URL like


    ```

    http://server/DynamicData/PageTemplates/Edit.aspx?table=Products

    ```


    you could simply type


    ```

    http://server/Products/Edit.aspx.

    ```


    Another parameter in this route is {action}. Action usually matches the name of
    one of the available page templates, such as the built-in List, Details, Edit,
    and Insert.


    In Listing 1.19, you might have also noticed that in this code the NorthwindEntities
    data model is registered with a ContextConfiguration object. The ContextConfiguration
    allows you to provide additional information to Dynamic Data regarding the data
    model, such as specify that all tables should be scaffolded by default. Scaffolding
    a table means making it visible to the user in the UI generated by Dynamic Data.
    Usually, you scaffold only those few tables you want your user to be able to view
    and edit directly. However, in this example, all of them are scaffolded to illustrate
    the use of page templates.


    Figure 1.19 shows the default home page provided for web applications by the Dynamic
    Data project template.


    ![](img/11b373b78859e17d318fd76939a0df9d_49_0.png)


    FIGURE 1.19 Default home page of a Dynamic Data Web Application.'
  merge: -1
  img_proc: true
