  md: "```\n[Display(Name = \"Order Date\")]\n[CustomValidation(typeof(Order), \"\
    ValidateOrderDate\")]\npublic object OrderDate { get; set; }\n```\n\nThe first\
    \ parameter of the CustomValidationAttribute constructor specifies the type of\
    \ class that implements the custom validation method, and the second specifies\
    \ the name of the method itself. Here is the definition of the ValidateOrderDate\
    \ method taken from the Order class:\n\n```\npublic static ValidationResult ValidateOrderDate(\n\
    \    DateTime? orderDate, ValidationContext context)\n{\n    if (orderDate !=\
    \ null && orderDate.Value < DateTime.Today)\n    {\n        return new ValidationResult(\n\
    \            string.Format(\"{0} cannot be in the past\", context.DisplayName),\n\
    \            new string[] { context.MemberName });\n    }\n\n    return ValidationResult.Success;\n\
    }\n```\n\nA validation method must be static and must return a ValidationResult.\
    \ As its first parameter, the validation method takes the value that needs to\
    \ be validated, such as the value of the OrderDate property. The type of the first\
    \ method parameter must either have the same type as the property, Nullable<DateTime>\
    \ in this example, or be of type object. The validation method can also have an\
    \ optional second parameter of type ValidationContext, which provides additional\
    \ information about the property being validated.\n\n# ValidationResult\n\nIf\
    \ the value is correct, the validation method should return ValidationResult.Success,\
    \ a special constant for null, defined to make validation methods easier to understand.\
    \ If the value is invalid, the method should return an instance of the ValidationResult\
    \ class with detailed information about the error. The Validator class will use\
    \ the information in the ValidationResult to initialize the ValidationException\
    \ it will throw when the errors are detected.\n\nThe ErrorMessage property of\
    \ the ValidationResult contains the error message that is reported by the exception.\
    \ This property is initialized by the first argument of the ValidationResult constructor.\
    \ This same error message is displayed to the users by the DynamicValidator controls\
    \ in Dynamic Data web applications. Notice how in this validation method, the\
    \ DisplayName property of the ValidationContext object is used instead of hard-coding\
    \ the property name in the error message. The DisplayName is initialized with\
    \ the display name specified in the DisplayAttribute applied to the entity property\
    \ or the name of the property itself if no display name was specified explicitly."
