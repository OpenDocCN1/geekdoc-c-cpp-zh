- pgno: 140
  md: '# Composite Entity Templates


    There is no requirement to have a single entity template per entity. You can create
    multiple entity templates for a single entity, where each template contains presentation
    of the entire entity or just a part of it. This is particularly useful for large
    entities, where it makes sense to present the information on multiple pages or
    on multiple tabs of a single page. You can further decompose the Customer entity
    template by separating contact and address information into separate entity templates
    shown in Listing 4.6 and Listing 4.7, respectively.


    # LISTING 4.6 Contact Entity Template (Markup)


    ```

