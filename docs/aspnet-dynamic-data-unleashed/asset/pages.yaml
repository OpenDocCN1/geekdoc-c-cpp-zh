- pgno: 67
  md: "# Lazy and Eager Loading\n\nBy default in version 4 of Entity Framework, a\
    \ newly created entity model has the Lazy Loading option enabled. This allows\
    \ you to traverse the navigation properties and query-related entities without\
    \ actually writing any queries at all.\n\n```\nvar query = from p in context.Products\n\
    \    select p;\nforeach (Product p in query)\n    Console.WriteLine(p.ProductName\
    \ + \" \" + p.Supplier.CompanyName);\n```\n\nIn the preceding example, there is\
    \ only one explicit query, which returns all products. However, when enumerating\
    \ the Product objects it returns, the code also prints out the name of the Supplier\
    \ for each product. The simple act of referencing the Supplier property of a Product\
    \ instance causes the related Supplier entity to be loaded from the database by\
    \ the ObjectContext.\n\nCode that takes advantage of lazy loading is very clean\
    \ and works great when loading of related entities is infrequent. However, a separate\
    \ query is sent to the database engine every time the Supplier property is referenced.\
    \ Even though the individual queries can be small and return little data, in a\
    \ loop, it might be faster to retrieve all Suppliers along with their Products\
    \ in a single query. This is called eager loading. Entity Framework allows you\
    \ to do it by calling the Include method and specifying the name of the navigation\
    \ property that needs to be eager-loaded.\n\n```\nvar query = from p in context.Products.Include(\"\
    Supplier\")\n    select p;\nforeach (Product p in query)\n    Console.WriteLine(p.ProductName\
    \ + \" \" + p.Supplier.CompanyName);\n```\n\nThis version of the code only executes\
    \ a single database query at the beginning of the foreach loop. The query retrieves\
    \ both Product and their associated Supplier entities from the database. No additional\
    \ requests are sent to the database when the Supplier's company name is printed\
    \ out in the loop.\n\n# Projections\n\nWhen a query returns entities, it needs\
    \ to retrieve values of all of its properties from the database. It is an equivalent\
    \ of SELECT * SQL statement. When you are only interested in a particular set\
    \ of columns, you can significantly reduce the amount of data returned and improve\
    \ performance with the help of projections, or in common terms, by “selecting”\
    \ only those columns you are interested in. The following code sample only needs\
    \ the CompanyName and City values of the Supplier entity, so instead of returning\
    \ an entire entity, it returns instances of an anonymous type that includes just\
    \ the required properties."
  merge: -1
  img_proc: true
- pgno: 68
  md: "```\nvar query = from s in context.Suppliers\n             select new { s.CompanyName,\
    \ s.City };\nforeach (var item in query)\n    Console.WriteLine(item.CompanyName\
    \ + \" \" + item.City );\n```\n\nAn anonymous type is declared in-place, with\
    \ property names inferred from the names of the Supplier properties that provide\
    \ the values. It serves as a Data Transfer Object (DTO) that holds Supplier property\
    \ values in place of the actual Supplier instances. This particular code could\
    \ be also rewritten to use an explicitly defined DTO class, like so:\n\n```\n\
    class SupplierProjection\n{\n    public string CompanyName;\n    public string\
    \ City;\n}\n\nvar query = from s in context.Suppliers\n            select new\
    \ SupplierProjection\n            {\n                CompanyName = s.CompanyName,\n\
    \                City = s.City\n            };\n```\n\nAs you can see, the version\
    \ based on the anonymous type is much more concise and closely resembles the SQL\
    \ syntax. However, visibility of anonymous types is limited to the methods where\
    \ they are defined. You need to declare the projection classes explicitly if you\
    \ need to pass the DTOs to another function for further processing.\n\n> **NOTE**\n\
    > \n> Projection objects are not entity instances. They do not participate in\
    \ the identity management process of the ObjectContext and cannot be used to change\
    \ the underlying database records.\n\n# Sorting\n\nThe orderby LINQ keyword can\
    \ be used to sort query results. Here is how you could sort the list of Products\
    \ in the order of UnitPrice, from highest to lowest:\n\n```\nvar query = from\
    \ p in context.Products\n            orderby p.UnitPrice descending\n        \
    \    select p;\n```\n\nBy default, orderby acts like its counterpart in SQL: Sorting\
    \ is performed in ascending order. To reverse the sort order for a property, use\
    \ the descending LINQ keyword after the"
  merge: -1
  img_proc: true
