- pgno: 384
  md: "# LISTING 11.1 Continued\n\n```\n}\n    return dictionary;\n}\n}\n```\n\nImplementation\
    \ of the overridden FieldValueString property getter is straightforward. It calls\
    \ the GetEnumDictionary method to retrieve the dictionary with display names and\
    \ values of the enum items and uses it to find the display name that matches the\
    \ current field value. However, it also has to support a couple of edge cases.\
    \ One of them is when the field value is null and you have to call the inherited\
    \ getter to properly handle formatting options for null values. The other is when\
    \ the field value does not match any known enum item and you, again, call the\
    \ inherited getter, which converts it to string based on the property's formatting\
    \ options.\n\nThe PopulateListControl method uses the new keyword because this\
    \ method is not virtual in the base class, FieldTemplateUserControl. However,\
    \ this should not be a problem because the method will not be called polymorphically.\
    \ Consistently with its implementation in the base class, the PopulateListControl\
    \ method also converts enum values to their underlying integral equivalents for\
    \ use in the list items. So instead of a longer \"PartTime\", the value of the\
    \ enum item will be simply \"1\". This reduces the size of HTML and post-back\
    \ data used by the page.\n\nTo take advantage of the new base class, you need\
    \ to modify the Enumeration.ascx.cs and the Enumeration_Edit.ascx.cs code-behind\
    \ files that come with the enumeration field templates out of the box so that\
    \ they inherit from UnleashedEnumerationFieldTemplate instead of the built-in\
    \ FieldTemplateUserControl. Because PopulateListControl is a direct replacement\
    \ for the inherited method, no further changes are needed in the Enumeration_Edit\
    \ field template. It automatically starts showing the annotation-based display\
    \ names as illustrated in Figure 11.4.\n\n![](img/11b373b78859e17d318fd76939a0df9d_384_0.png)\n\
    \n# FIGURE 11.4 Extended Enumeration_Edit Field template.\n\nIn addition to inheriting\
    \ from the UnleashedEnumerationFieldTemplate base class, the Enumeration field\
    \ template also needs to be modified to use the overridden FieldValueString instead\
    \ of the EnumFieldValueString property that was defined in this template out of\
    \ the box. Markup of the modified version of the Enumeration field template is\
    \ shown in Listing 11.2."
  merge: -1
  img_proc: true
- pgno: 385
  md: "# LISTING 11.2 Modified Enumeration Field Template (Markup)\n\n```\n<%@ Control\
    \ Language=\"C#\" CodeBehind=\"Enumeration.ascx.cs\" Inherits=\"WebApplication.DynamicData.FieldTemplates.EnumerationField\"\
    \ %>\n<asp:Literal runat=\"server\" ID=\"literal\" Text=\"<%# FieldValueString\
    \ %>\" />\n```\n\nOverall, the implementation of the Enumeration field template\
    \ becomes much simpler because you are mostly removing unnecessary code. The new\
    \ version of the code-behind is shown in Listing 11.3.\n\n# LISTING 11.3 Modified\
    \ Enumeration Field Template (Code-Behind)\n\n```\nusing System.Web.UI;\nusing\
    \ Unleashed.DynamicData;\n\nnamespace WebApplication.DynamicData.FieldTemplates\n\
    {\n    public partial class EnumerationField : UnleashedEnumerationFieldTemplate\n\
    \    {\n        public override Control DataControl\n        {\n            get\
    \ { return this.literal; }\n        }\n    }\n}\n```\n\nFigure 11.5 shows how\
    \ the modified version of the Enumeration field template looks on a page; as you\
    \ can see, the display name of the EmployeeType is shown, not its internal (PascalCased)\
    \ name.\n\n![](img/11b373b78859e17d318fd76939a0df9d_385_0.png)\n\nFIGURE 11.5\
    \ Extended Enumeration field template.\n\nEnum types help to reduce complexity\
    \ of entity models and improve performance of the application. This simple extension\
    \ to the built-in Enumeration field templates to support display name annotations\
    \ eliminates one of the most common reasons why developers introduce lookup tables\
    \ in their applications. This allows you to take full advantage of enums today\
    \ and prepare for the upcoming 4.5 release of the Entity Framework where you get\
    \ first class support in both Entity Designer and LINQ to Entities."
  merge: -1
  img_proc: true
- pgno: 386
  md: "# Custom Data Types and UI Hints\n\nThe DataType enumeration does not define\
    \ all possible business data types you might need in your entity models. For instance,\
    \ the Region property of the Employee entity is of type string, a low-level technical\
    \ type; however, from a business perspective, you could consider it to have a\
    \ high-level type state, which limits its potential values to a list of about\
    \ 50 states and territories used by the U.S. Postal Service. You can indicate\
    \ this design in the entity model by applying the DataTypeAttribute to the Region\
    \ property and specifying a custom type name instead of a predefined value from\
    \ the DataType enumeration.\n\nHere is an example:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [DataType(\"State\")]\n        public object Region { get; set; }\n    }\n\
    }\n```\n\n> NOTE\n> As you might want to point out, you could also have created\
    \ an enumerated type to represent the USPS list of states and territories. For\
    \ the sake of this example, let's continue with the assumption that using a string\
    \ type makes more sense. As you see shortly, this is not a final design of the\
    \ Region property anyway.\n\nDynamic Data treats custom data type names as first-class\
    \ citizens. During field template lookup, it tries to find a template with the\
    \ name matching the custom type specified in the DataTypeAttribute and falls back\
    \ to the physical type only if it does not find the match. As it happens, a field\
    \ template called State_Edit.ascx was created back in Chapter 10, which displays\
    \ a drop-down list and allows users to select a valid state. Dynamic Data automatically\
    \ uses it for the Region property of the Employee entity based on the data annotation\
    \ in the preceding sample code.\n\n![](img/11b373b78859e17d318fd76939a0df9d_386_0.png)\n\
    \nFIGURE 11.6 Web page generated by State field template."
  merge: -1
  img_proc: true
