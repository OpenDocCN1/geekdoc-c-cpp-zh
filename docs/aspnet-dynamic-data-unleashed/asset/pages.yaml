- pgno: 212
  md: "If you need to access the list of all tables, you can use the Tables property.\
    \ It is a read-only collection of MetaTable instances, which you can iterate through\
    \ using a foreach loop or interrogate using LINQ to Objects. If you are interested\
    \ only in tables that will be visible to the current user, you can use the VisibleTables\
    \ property.\n\n> NOTE\n> \n> The VisibleTables property of the MetaModel class\
    \ returns a read-only list of tables, despite its type, List<MetaTable>, which\
    \ implies the ability to change it. Any changes you make to the VisibleTables\
    \ list are ignored, and you should treat it as a read-only collection.\n\nKeep\
    \ in mind that iterating through the list of tables at runtime can be costly,\
    \ so if you need a particular table, use one of the methods the MetaModel class\
    \ provides for that purpose instead:\n\n```\npublic MetaTable GetTable(string\
    \ uniqueTableName);\npublic MetaTable GetTable(Type entityType);\n```\n\nThe GetTable\
    \ method that takes a string that contains a table name is the most efficient\
    \ way to retrieve a specific table from the MetaModel. This method retrieves the\
    \ MetaTable from the dictionary of table names and objects that MetaModel maintains\
    \ internally. You typically use one of these methods when building custom pages\
    \ that don't rely on dynamic data URL routing:\n\n```\nMetaTable table = Global.DefaultModel.GetTable('Products');\n\
    MetaTable table = Global.DefaultModel.GetTable(typeof(Product));\n```\n\nAlthough\
    \ using the GetTable overload that takes an entity Type is more elegant (because\
    \ it allows you to avoid using hard-coded literals or string constants to specify\
    \ the table name), it is actually less efficient as it iterates through the entire\
    \ list of tables to find the one with a matching type. Although the performance\
    \ impact of a single table lookup might not be noticeable, keep in mind that it\
    \ quickly increases as your data model becomes more complex and as the number\
    \ of users accessing your application increases.\n\n> NOTE\n> \n> The GetTable(string)\
    \ method is also used by the DynamicDataRouteHandler when routing dynamic URLs\
    \ to page templates. It extracts the table name from the URL, calls the GetTable\
    \ method of the MetaModel, and stores the MetaTable object it returns in the Items\
    \ dictionary of the HttpContext. If you simply need the MetaTable object for the\
    \ current request, the fastest way to access it is by calling the static GetRequestMetaTable\
    \ method of the DynamicDataRouteHandler class, as shown here:\n> \n> MetaTable\
    \ table = DynamicDataRouteHandler.GetRequestMetaTable(Page.Context);"
  merge: -1
  img_proc: true
- pgno: 213
  md: "The GetTable methods throws an ArgumentException if you specify a name or type\
    \ of a table that does not belong to the current MetaModel. In the unlikely scenario\
    \ your code expects to find non-existent tables, you can use the TryGetTable methods\
    \ instead:\n\n```\npublic bool TryGetTable(string uniqueTableName, out MetaTable\
    \ table);\npublic bool TryGetTable(Type entityType, out MetaTable table);\n```\n\
    \nThe TryGetTable methods return a Boolean value that indicates whether or not\
    \ the table was found. The MetaTable itself is returned via the second output\
    \ parameter. It will be null if the method returns false. This follows a common\
    \ .NET pattern and mimics the TryGetValue method of the generic Dictionary class:\n\
    \n```\nMetaTable table;\nif (Global.DefaultModel.TryGetTable(\"Products\", out\
    \ table))\n{\n    // use the table here ...\n}\n```\n\n# Global Model Registration\n\
    \nBy default, when a new MetaModel instance is created, it is registered globally,\
    \ making it available through the Default property of the MetaModel class as well\
    \ as its GetModel method. Both of them are static, thus making the model available\
    \ to any page or control in your web application:\n\n```\npublic static MetaModel\
    \ Default { get; }\npublic static MetaModel GetModel(Type contextType);\n```\n\
    \nThe Default property gives you an application-independent way to access the\
    \ default model, which you would normally get to via the DefaultModel property\
    \ of the Global class defined in Global.asax.cs. In other words, in a typical\
    \ application, the following lines of code produce the same result:\n\n```\nMetaModel\
    \ model = Global.DefaultModel;\nMetaModel model = MetaModel.Default;\n```\n\n\
    When multiple data contexts have been registered with Dynamic Data, you can also\
    \ use the static GetModel method of the MetaModel class to retrieve a globally\
    \ registered MetaModel using its context type:\n\n```\nMetaModel model = MetaModel.GetModel(typeof(NorthwindEntities));\n\
    ```\n\nWhen using Dynamic Data in a large web application that interacts with\
    \ multiple databases and has multiple models, you might want to avoid global registration\
    \ to reduce chances of having different parts of the application affecting each\
    \ other. For this purpose, MetaModel class provides an overloaded constructor\
    \ that takes a Boolean value as a parameter. Passing false to this constructor\
    \ prevents the model from being globally registered:\n\n```\npublic MetaModel(bool\
    \ registerGlobally);\n```"
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Scaffolding Support


    Several properties of the `MetaModel` class are not related to metadata, but instead
    provide support for dynamic scaffolding of the different template types used by
    Dynamic Data applications:


    ```

    ```csharp

    public IFieldTemplateFactory FieldTemplateFactory { get; set; }

    public EntityTemplateFactory EntityTemplateFactory { get; set; }

    public FilterFactory FilterFactory { get; set; }

    ```

    ```


    The `FieldTemplateFactory` property gets or sets an object responsible for creating
    field templates. The `EntityTemplateFactory` is responsible for creating entity
    templates, and the `FilterFactory` is responsible for filter templates. All three
    of these properties are writable, allowing you to replace the built-in factories
    when stock functionality is insufficient.


    One particular example of when such a replacement would be beneficial is the limitation
    of the built-in filter factory, which supports only Boolean, ForeignKey, and Enumeration
    filters. However, this topic deserves a lot of attention and will be revisited
    in Chapter 13.


    ```

    ```csharp

    public string DynamicDataFolderVirtualPath { get; set; }

    ```

    ```


    The `DynamicDataFolderVirtualPath` property determines where the template factories
    look for templates. By default, this property is set to "~/DynamicData" but can
    be changed to a different location if needed.


    # The MetaTable Class


    The main purpose of the `MetaTable` class is to help page templates generate user
    interface for different entities in the data model. A single `MetaTable` instance
    describes an entire entity class, including its type, properties, attributes,
    presentation, data access logic, and security permissions.


    # Entity Definition


    Each table in the model is identified by a name, which you can access using the
    `Name` property of the `MetaTable` class:


    ```

    ```csharp

    public string Name { get; }

    ```

    ```


    Table name usually matches the name of the object context property you would normally
    use to query the data. In the NorthwindEntities context class, you use the `Products`
    property to retrieve instances of the Product entity class from the Products database
    table. The `MetaTable` instance describing the Product entity would have the name
    Products, the same as the name of the NorthwindEntities property.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'You can access the list of table columns using the Columns property of the
    MetaTable class:


    ```

    public ReadOnlyCollection<MetaColumn> Columns { get; }

    public MetaColumn GetColumn(string columnName);

    public bool TryGetColumn(string columnName, out MetaColumn column);

    ```


    The Columns property returns a collection of read-only MetaColumn objects, which
    are discussed in detail later in this chapter. When you need to get a particular
    table column, the most effective way to do it at run time is by calling the GetColumn
    or the TryGetColumn methods, which take advantage of the internal dictionary of
    columns that the MetaTable class maintains. This is much faster than a typical
    foreach loop, which is always a good thing in a web application where CPU is a
    precious resource. As you would expect, the GetColumn method throws an exception
    if a column with the specified name cannot be found, and the TryGetColumn method
    returns false and does not throw an exception:


    ```

    public TableProvider Provider { get; }

    ```


    The individual column objects are created by the MetaTable using definitions returned
    by a table provider, which extracts information from the underlying data access
    framework. Although normally you should be able to get everything you need directly
    through the MetaTable and MetaColumn objects, you have the option of accessing
    the original provider, which was used to create and configure the table using
    the Provider property of the MetaTable class:


    ```

    public Type EntityType { get; }

    ```


    The EntityType property of the MetaTable class returns a Type object that describes
    the entity class, such as Product. The Type class provides access to the .NET
    runtime metadata describing the entity class, including its properties, methods,
    events, and so on. Compared to the MetaTable class itself, the information available
    through the Type class is very low-level, and you will rarely need to use it in
    Dynamic Data applications:


    ```

    public Type RootEntityType { get; }

    ```


    The RootEntityType property, on the other hand, returns a Type object that describes
    the root base class of the entity. There is no example of this in the NorthwindEntities
    data model here, and diving into this topic would exceed the scope of this book,
    but you can imagine a CRM system that derives entity classes Prospect and Customer
    from a common base class called Contact. In this scenario, the MetaTable describing
    the Customer entity would return typeof(Customer) as the EntityType and typeof(Contact)
    as the RootEntityType.


    # NOTE


    When working with derived entity classes, remember that context class generated
    by the data model does not have a separate property for querying Customers and
    another one for querying Prospects. This changes how Dynamic Data determines the
    names for the MetaTable instances describing these entities. For a base class
    like Contact, the MetaTable name will be Contacts, plural. However, for a derived
    class like Prospect, the MetaTable name will be Prospect, singular.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Data Annotations


    Entity classes used by Entity Framework and LINQ to SQL can be decorated with
    a number of different .NET attributes. Some of these attributes have special meaning
    for Dynamic Data and are represented as distinct properties in the MetaTable class:


    ```

    public virtual bool Scaffold { get; }

    ```


    The Scaffold property of the MetaTable class determines whether the table will
    be visible (or scaffolded) in the pages generated by Dynamic Data. This includes
    not only the default main page that simply displays a list of all tables, but
    also the pages that might include hyperlinks to particular tables. For example,
    if the Suppliers table is not scaffolded, you will not be able to navigate to
    it from the Product details page:


    ```

    using System.ComponentModel.DataAnnotations;


    [ScaffoldTable(false)]

    partial class Supplier { }

    ```


    By default, the Scaffold property value is determined by the value of the ScaffoldAllTables
    property of the ContextConfiguration object used to register the context. However,
    it can be also modified by applying the ScaffoldTableAttribute to a specific entity
    class as just shown:


    ```

    public virtual bool IsReadOnly { get; }

    ```


    The IsReadOnly property of the MetaTable class determines whether users are allowed
    to modify it. The page templates created by Dynamic Data projects in Visual Studio
    use this property to hide links that would normally allow users to insert, modify,
    and delete the table rows:


    ```

    using System.ComponentModel;


    [ReadOnly(true)]

    partial class Supplier { }

    ```


    By default, the IsReadOnly property returns true for tables that don''t have a
    primary key, which could be the case if the MetaTable represents an entity class
    that was created for a database view, for which the Entity Framework and LINQ
    to SQL cannot automatically determine the primary key columns. You can also apply
    the ReadOnlyAttribute to the entity class as just shown to explicitly specify
    the value based on your needs:


    ```

    public virtual string DisplayName { get; }

    ```


    The DisplayName property of the MetaTable class determines the text Dynamic Data
    page templates display when a human-readable name of the table is required on
    a dynamically generated web page. By default, the DisplayName property returns
    the same value as the Name property. If, however, the table name is not user-friendly,
    such as the Order_Details'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'table in the Northwind database, it can be changed by applying the DisplayNameAttribute
    to the entity class as shown here:


    ```

    using System.ComponentModel;


    [DisplayName("Order Items")]

    partial class Order_Detail { }

    ```


    Last, the MetaTable class has a set of three properties that determine how the
    actual data retrieved from the database table needs to be displayed by the user
    interface elements generated by Dynamic Data:


    ```

    public virtual MetaColumn DisplayColumn { get; }

    public virtual MetaColumn SortColumn { get; }

    public virtual bool SortDescending { get; }

    ```


    The DisplayColumn property returns a MetaColumn object that represents the property
    whose value would allow a user to identify a particular entity instance or table
    row. For the Supplier entity class in the Northwind database scenario, this would
    normally be the CompanyName property; for the Product entity class, it would be
    the ProductName. The read-only ForeignKey field template uses the DisplayColumn
    to provide text for a hyperlink it generates, so that contact name of a Supplier
    is displayed on the Product details page.


    The SortColumn property returns a MetaColumn that should be used to sort the items
    retrieved from the database by default, and the SortDescending property indicates
    whether the rows should be sorted in ascending or descending order of the SortColumn
    values. The ForeignKey_Edit field template uses these properties to sort the items
    in the drop-down list it generates, making the Suppliers appear in the order of
    their CompanyName:


    ```

    using System.ComponentModel.DataAnnotations;


    [DisplayColumn("CompanyName", "CompanyName", false)]

    partial class Supplier { }

    ```


    By default, MetaTable uses a heuristic algorithm to guess the right display column.
    All three of these properties, DisplayColumn, SortColumn, and SortDescending,
    can also be specified explicitly by applying the DisplayColumnAttribute to the
    entity class as just shown. Its constructor takes the name of the display column,
    the name of the sort column, and a Boolean value that indicates whether default
    sorting should be performed in descending order.'
  merge: -1
