    \            MetaTable table = Global.DefaultModel.GetTable(this.dataSource.EntitySetName);\n\
    \            this.gridView.SetMetaTable(table);\n            this.dataSource.Include\
    \ = table.ForeignKeyColumnsNames;\n        }\n    }\n}\n```\n```\n\nAs you can\
    \ see, having the Parent field template at your disposal makes implementing list\
    \ pages that display information from multiple related entities almost as easy\
    \ as creating custom pages for a single entity. The Parent field template works\
    \ equally well in single-item pages built with the FormView control and entity\
