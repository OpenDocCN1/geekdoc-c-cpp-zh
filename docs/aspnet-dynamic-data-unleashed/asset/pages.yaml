- pgno: 105
  md: "Code-behind files perform most of the work required to make the generated web\
    \ pages dynamic. In this simplest example, the template overrides the DataControl\
    \ property defined by the base class. Entity templates (see Chapter 4, “Entity\
    \ Templates”) use this property when dynamically generating entity forms, to associate\
    \ each field template with a matching Label control.\n\n# Field Value Display\
    \ Format\n\nIn addition to the FieldValueString property, the FieldTemplateUserControl\
    \ class also provides another property called FieldValue, which returns the raw\
    \ value object. At a cursory glance, the FieldValue property could be used to\
    \ bind the Literal control as well. However, it is important to use the FieldValueString\
    \ property as it automatically takes into account additional display format properties\
    \ when converting the raw field value to a string:\n\n+   - DataFormatString specifies\
    \ a .NET format string that will be passed to the String.Format method to convert\
    \ the field value to a display string.\n+   - NullDisplayText specifies a replacement\
    \ string that will be used when the raw field value is null.\n+   - ConvertEmptyStringToNull\
    \ is a Boolean value that determines whether an empty string value should treated\
    \ as null and if the NullDisplayText will be used as a replacement for empty strings\
    \ as well as null values. This property is true by default.\n+   - HtmlEncode\
    \ is a Boolean value that determines whether any special HTML symbols in the raw\
    \ field value, such as '<' or '>', will be encoded using escape sequences, such\
    \ as &lt; and &gt;. This property is true by default.\n\nDisplay format properties\
    \ can be specified in the data model by applying the DataTypeAttribute or the\
    \ DisplayFormatAttribute to a particular column, as shown in Listing 3.3. The\
    \ DisplayFormatAttribute, applied to the OrderDate column, specifies a long date\
    \ {0:D} format string, The DataTypeAttribute, applied to the RequiredDate column,\
    \ does not have its own DataFormatString property. Instead, it offers the DisplayFormat\
    \ property, which gets a default DisplayFormatAttribute generated, based on the\
    \ specified data type. For DataType.Date, the default data format string will\
    \ be a short date {0:d}.\n\n# LISTING 3.3 Specifying Display Format Using Data\
    \ Annotations\n\n```\n```csharp\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace DataModel\n{\n    [MetadataType (typeof(Order.Metadata))]\n    partial\
    \ class Order\n    {\n\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: "# LISTING 3.3 Continued\n\n```\npublic class Metadata\n{\n    [DisplayFormat(DataFormatString\
    \ = \"{0:D}\")]\n    public object OrderDate;\n\n    [DataType(DataType.Date)]\n\
    \    public object RequiredDate;\n}\n}\n```\n\nDisplay format properties can be\
    \ also specified in page markup by setting the corresponding properties of the\
    \ DynamicControl or DynamicField classes, similar to the properties of the “non-dynamic”\
    \ BoundField. Listing 3.4 shows an example where a DynamicField is used in a GridView\
    \ control and specifies a custom date format string {0:MM/dd/yy} for the ShippedDate\
    \ column.\n\n# LISTING 3.4 Specifying Data Format Using DynamicField\n\n```\n\
    <%@ Page Language=\"C#\"\n    MasterPageFile=\"~/Site.master\" CodeBehind=\"SamplePage.aspx.cs\"\
    \n    Inherits=\"WebApplication.Samples.Ch03.DataFormatString.SamplePage\" %>\n\
    \n<asp:Content ContentPlaceHolderID=\"ContentPlaceHolder1\" runat=\"server\">\n\
    \    <asp:GridView ID=\"gridView\" runat=\"server\" DataSourceID=\"dataSource\"\
    \n        AutoGenerateColumns=\"false\" AllowPaging=\"true\">\n        <columns>\n\
    \            <asp:DynamicField DataField=\"OrderDate\" />\n            <asp:DynamicField\
    \ DataField=\"RequiredDate\" />\n            <asp:DynamicField DataField=\"ShippedDate\"\
    \ DataFormatString=\"{0:MM/dd/yy}\" />\n        </columns>\n    </asp:GridView>\n\
    \    <asp:EntityDataSource ID=\"dataSource\" runat=\"server\"\n        ConnectionString=\"\
    NorthwindEntities\"\n        DefaultContainerName=\"NorthwindEntities\" EntitySetName=\"\
    Orders\" />\n</asp:Content>\n```\n\nFigure 3.1 shows the web page generated by\
    \ this code. As you can see, the OrderDate values use the long format specified\
    \ in the DisplayFormatAttribute in the model; the RequiredDate values use the\
    \ short format provided by the DataTypeAttribute; and the ShippedDate values use\
    \ the custom format specified in the page markup."
