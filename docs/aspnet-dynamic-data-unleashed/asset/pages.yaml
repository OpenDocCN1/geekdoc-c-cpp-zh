- pgno: 186
  md: "The Page_Init event handler performs the familiar tasks of finding the MetaTable\
    \ describing the current entity type using information in the URL route, updating\
    \ the page title with the display name of the entity, and configuring the EntityDataSource.\
    \ However, this code also performs an important additional step, which was not\
    \ necessary in the Details and Edit page templates discussed so far.\n\nThe code\
    \ in the Page_Init event handler calls the GetColumnValuesFromRoute method of\
    \ the MetaTable class to obtain a dictionary of property names and values from\
    \ the request URL. This is important when the user navigates to a list page by\
    \ clicking a “View Children” link on any of the other dynamically generated pages,\
    \ such as the View Order Items link on the Product list page in Figure 6.4. In\
    \ this scenario, the primary key of the parent entity is passed to the page template\
    \ in a request URL similar to the one shown here:\n\n```\nhttp://localhost:49212/Order_Details/List.aspx?ProductID=1\n\
    ```\n\nWhen the dictionary of property names and values has been obtained, the\
    \ Page_Init code calls the SetMetaTable extension method defined in the DynamicDataExtensions\
    \ class to associate both the MetaTable object and the dictionary of what it calls\
    \ default values with the GridView control. The filter templates rely on this\
    \ information to provide initial values in filter controls (see the DefaultValue\
    \ property of the QueryableFilterUserControl class).\n\n> **NOTE**\n> \n> Normally\
    \ it is not necessary to call the SetMetaTable extension method if you have a\
    \ DynamicDataManager control associated with a databound control, such as the\
    \ GridView in this example. The DynamicDataManager calls this method automatically,\
    \ but in this case, the template calls it explicitly to pass the default values\
    \ to filter templates.\n\nThe rest of the code in the Page_Init event handler\
    \ deals with initializing the Insert new item hyperlink at the bottom of the page.\
    \ Using the same dictionary of property names and values, this code generates\
    \ a link to the dynamic Insert page, with the default values in the URL. As you\
    \ see shortly, the Insert page template also supports column values passed through\
    \ the request URL and relies on them to prepopulate some of the field values.\n\
    \nThe Label_PreRender method handles the PreRender event of the Label controls\
    \ generated by the QueryableFilterRepeater. It associates each label with the\
    \ filter control generated by its matching DynamicFilter. This makes the generated\
    \ label behave like a true control label as opposed to regular selectable text\
    \ content on the page. Clicking a label in the web browser automatically selects\
    \ the corresponding control.\n\nThe DynamicFilter_FilterChanged method handles\
    \ the FilterChanged event of the DynamicFilter controls, which fires any time\
    \ the user changes the filter criteria. Although the QueryableFilterRepeater automatically\
    \ notifies the EntityDataSource control and causes the query to be reloaded, this\
    \ method flips the GridView to the first page to avoid confusion and errors when\
    \ the new filter criteria makes the number of pages in the result set less than\
    \ the current page number."
  merge: -1
  img_proc: true
