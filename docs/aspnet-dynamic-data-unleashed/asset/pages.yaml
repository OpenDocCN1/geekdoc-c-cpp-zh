- pgno: 318
  md: "Obviously, a yellow page of death is not acceptable in a production-ready web\
    \ application, and you need to change it to report the error consistently with\
    \ other validation results implemented in the application code. In particular,\
    \ you need to catch the appropriate exceptions and rethrow them wrapped inside\
    \ of ValidationException instances. Here is how you can override the SaveChanges\
    \ method of the NorthwindEntities class to do this:\n\n```\npublic override int\
    \ SaveChanges(SaveOptions options)\n{\n    try\n    {\n        return base.SaveChanges(options);\n\
    \    }\n    catch (UpdateException e)\n    {\n        HandleSqlException(e);\n\
    \        throw;\n    }\n}\n```\n\nThe new version of the SaveChanges method puts\
    \ the call to the base method inside of a try/catch block to intercept database\
    \ errors reported as instances of the UpdateException class by the Entity Framework.\
    \ The UpdateException itself provides a very generic error message saying that\
    \ an error has occurred when trying to save changes; however, the underlying database\
    \ error is still available through its InnerException property used in the HandleSqlException\
    \ method shown here:\n\n```\nprivate static void HandleSqlException(Exception\
    \ e)\n{\n    SqlException error = e.InnerException as SqlException;\n    if (error\
    \ != null)\n    {\n        if (error.Number == 547)\n            HandleReferenceConstraintViolation(error);\n\
    \        else if (error.Number == 2627)\n            HandleUniqueKeyConstraintViolation(error);\n\
    \    }\n}\n```\n\nIn this example, Microsoft SQL Server is used, so the inner\
    \ exception will be of type SqlException defined in the System.Data.SqlClient\
    \ namespace. You can determine what kind of error has occurred by looking at the\
    \ SQL error Number, which for the violation of a UNIQUE KEY constraint will be\
    \ 2627 and for a FOREIGN KEY violation will be 547."
  merge: -1
  img_proc: true
- pgno: 319
  md: "# NOTE\n\nThe Microsoft SQL Server documentation does not offer a comprehensive\
    \ list of error numbers and suggests querying the sys.messages view for details.\
    \ You might find this impractical for finding an error number based on an error\
    \ type given the list includes more than 8,000 messages for a single language.\
    \ It is often easier to find a specific error code by triggering the error condition\
    \ with a SQL script and getting it from the actual error reported by the SQL Server.\n\
    \nIf you are using a database platform other than Microsoft SQL Server, you need\
    \ to rely on the low-level exceptions, error messages, and error codes provided\
    \ by your database vendor because the current version of the Entity Framework\
    \ does not allow accessing this information in a generic fashion.\n\n# NOTE\n\n\
    Error codes, such as 547 and 2627 in the previous example, are difficult to understand\
    \ and remember. Just like with any hard-coded literals, it is usually a good idea\
    \ to use constants that encapsulate them instead. Unfortunately, the .NET SQL\
    \ Client does not offer ready-to-use constants. In this case, they are left as\
    \ literals because HandleSqlException method is the only place in the sample application\
    \ where they are being used. They also appear next to the HandleReferenceConstraintViolation\
    \ and HandleUniqueKeyConstraintViolation methods, which help to explain their\
    \ meaning.\n\nWhen you detect an expected database exception, such as the violation\
    \ of a UNIQUE KEY constraint, you can wrap it in a ValidationException, which\
    \ the DynamicValidator controls in the application web pages display to the users.\
    \ Because different database errors require slightly different handling logic,\
    \ there is a separate method for each expected type of error, such as the HandleUniqueKeyConstraintViolation\
    \ method shown here:\n\n```\nprivate static void HandleUniqueKeyConstraintViolation(SqlException\
    \ error)\n{\n    throw new ValidationException(error.Message);\n}\n```\n\nThe\
    \ initial implementation of the unique key violation error handler simply throws\
    \ a ValidationException with the low-level error message reported by the database.\
    \ Although this prevents the yellow page of death, the error message is not very\
    \ helpful and will say something along these lines:\n\n```\nViolation of UNIQUE\
    \ KEY constraint 'UK_Products'. Cannot insert duplicate key in object 'dbo.Products'.\n\
    ```"
  merge: -1
