- pgno: 41
  md: "![](img/11b373b78859e17d318fd76939a0df9d_41_0.png)\n\nFIGURE 1.13 GridView\
    \ page with dynamic field columns.\n\nSimilar to DynamicControl, DynamicField\
    \ uses column metadata to automatically select and load an appropriate field template.\
