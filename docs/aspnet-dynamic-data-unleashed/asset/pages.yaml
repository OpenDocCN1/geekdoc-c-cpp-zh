- pgno: 367
  md: '# CHAPTER 11


    # Building Dynamic Forms


    The biggest advantage Dynamic Data offers is the dramatic reduction in the amount
    of code in your application. Consider the number of ASPX files a web application
    would need to have for the Northwind Traders sample database. If you were using
    WebForms, you could manually create two ASPX files per entity—one multipurpose
    “form” page for inserting, editing, displaying, and deleting single rows, plus
    another “list” page for searching for and browsing through all rows. With 11 distinct
    entity types in the Northwind database, this means that 22 separate ASPX pages
    would have to be created. With ASP.NET MVC, you typically have separate single-purpose
    views, requiring five ASPX files per entity, increasing the total number of ASPX
    files to 55, more than doubling the number of hand-written ASPX pages with WebForms.
    With Dynamic Data, which generates code at run time, the application can be built
    with only four ASPX files (page templates), regardless of the number of entity
    types.


    Dynamic Data gives you a working application as soon as the initial version of
    the entity/data model is available. You can immediately begin sharing it with
    the business and collecting feedback on functioning web pages as opposed to UML
    diagrams or screen mockups. With a good set of dynamic templates, you can refine
    the entity model and solicit additional feedback in rapid successive iterations
    without the penalty of maintaining the presentation logic. If a particular entity
    requires a custom user interface that cannot be generated dynamically, you can
    hand-code it using either the WebForms or the MVC framework, when the entity model
    is stable.


    By helping to postpone the hand-coding of the user interface and making the application
    size smaller, Dynamic Data


    # IN THIS CHAPTER


    +   - Basic Form Layout

    +   - Configuring Appearance of Labels

    +   - Configuring Field Templates

    +   - Configuring Appearance of Values

    +   - Enum Properties and Enumeration Templates

    +   - Custom Data Types and UI Hints

    +   - Specifying Field Template Parameters

    +   - Field Template Interaction in Dynamic Forms

    +   - Creating Additional Dynamic Entity Templates'
  merge: -1
  img_proc: true
- pgno: 368
  md: "helps your project stay agile, reduces waste, and enables you to focus on the\
    \ most important aspect of the information system—its domain model. After all,\
    \ the biggest risk on any development project is building the wrong thing. If\
    \ your domain model is wrong, your application will be wrong, no matter how pretty\
    \ it looks. This is the most important reason you might want to master the metadata-driven\
    \ development of web applications with Dynamic Data. This chapter focuses on how\
    \ to do this effectively, points out some of the pitfalls and shortcomings you\
    \ might encounter, and discusses how to work around them.\n\n# Basic Form Layout\n\
    \nWhen creating custom forms, you control their layout by explicitly creating\
    \ table or other HTML elements. You determine which entity properties appear on\
    \ the form and where they are displayed by creating a DynamicControl for each\
    \ property and placing it in the required location.\n\nWith the default entity\
    \ template, Dynamic Data generates a single-column form for any entity type, with\
    \ labels on the left side and data entry fields on the right side. Unless you\
    \ specify otherwise, Dynamic Data uses a heuristic algorithm to display all appropriate\
    \ properties it supports. In particular, this list does not include the generated,\
    \ custom, and foreign key properties. Generated properties, such as properties\
    \ mapped to identity columns in a Microsoft SQL Server database, typically contain\
    \ information not suitable for display to end users. Custom properties, such as\
    \ a FullName property that could be defined in a contact entity class to concatenate\
    \ the FirstName, LastName, and MiddleInitial properties, cannot be used in LINQ\
    \ filters with Entity Framework and would break list pages. Foreign key properties,\
    \ such as a CustomerId, are not only inappropriate for users to see or edit directly,\
    \ they are a part of navigation properties, such as Customer, which are already\
    \ displayed, usually with a ForeignKey field template.\n\nIf this default set\
    \ of properties selected for display by Dynamic Data does not meet your requirements,\
    \ you can explicitly show or hide a particular property with the help of the DisplayAttribute.\
    \ The code snippet next illustrates how to show the EmployeeID and hide the Orders\
    \ properties of the Employee entity:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [Display(AutoGenerateField = true)]\n        public object EmployeeID { get;\
    \ set; }\n\n        [Display(AutoGenerateField = false)]\n        public object\
    \ Orders { get; set; }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 369
  md: "The AutoGenerateField property affects both single-item forms and list pages\
    \ generated by Dynamic Data. For list pages, you can also set the AutoGenerateFilter\
    \ property in the DisplayAttribute to explicitly specify whether the QueryableFilterRepeater\
    \ control will generate a DynamicFilter control instance for this property.\n\n\
    # NOTE\n\nDisplayAttribute is the main data annotation attribute you use to control\
    \ the layout and appearance of dynamic forms in version 4.0 or later of ASP.NET\
    \ Dynamic Data. It was designed to replace several other data annotation attributes,\
    \ including DisplayNameAttribute, DescriptionAttribute, ScaffoldColumnAttribute,\
    \ and ReadOnlyAttribute, that were used by the original version of Dynamic Data\
    \ released with ASP.NET 3.5 SP1. These attributes are still supported; however,\
    \ with rare exceptions, you should consider using the DisplayAttribute as it combines\
    \ multiple annotations into a single, easy-to-discover attribute class.\n\nBy\
    \ default, properties appear on a dynamic form in the order they are defined in\
    \ the entity model. If this does not match what you need, ideally you want to\
    \ change the order of properties in the entity model. This is easy to do if you\
    \ are using the code-first approach with Entity Framework. If you are using the\
    \ model-first approach, you can do this by editing the raw XML in the EDMX file\
    \ in a text editor. If you are using the data-base-first approach, you need to\
    \ reorder columns in the database table and regenerate the model. Controlling\
    \ order of data entry controls on dynamic forms by reordering properties in the\
    \ entity model is ideal because it eliminates ambiguity and keeps the model simple.\
    \ After all, if you had a custom form laid out with an HTML table, you would want\
    \ to move a particular row to its new location, keeping the order of elements\
    \ in the markup in sync with their appearance on screen. Same idea applies to\
    \ controlling order of controls in dynamically generated forms.\n\nHowever, in\
    \ the real world, you have to deal with the less than ideal tools and larger than\
    \ ideal databases. When changing the order of properties in the entity model becomes\
    \ impractical, you can specify it explicitly by setting the Order property of\
    \ the DisplayAttribute. Here is an example that shows how to do this for the FirstName\
    \ and LastName properties of the Employee entity:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [Display(Order = 110)]\n        public object FirstName { get; set; }\n\n \
    \       [Display(Order = 120)]\n        public object LastName { get; set; }\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 370
  md: 'When specifying order numbers explicitly, give yourself a little room by starting
    with appropriate gaps between neighboring properties. In the example just shown,
    the FirstName and LastName properties that sit next to each other have a gap of
    10 in their order numbers. If you need to insert another property, perhaps the
    MiddleInitial, between them in the future, you will be able to do it without having
    to renumber all properties. Start with a gap of 100 for larger entities that have
    20 or more properties. This allows you to move entire groups of properties without
    renumbering. When the entity design stabilizes, you can either renumber the properties
    to have a uniform gap or create a custom entity template and remove order numbers
    from the metadata entirely.


    All properties with an explicit display order are displayed first. Properties
    that do not have DisplayAttribute or don''t have the Order property specified
    are displayed at the end of the list. This logic is currently implemented by giving
    properties a default order of 10,000. Keep this in mind when working with large
    entities—you don''t want your explicit order numbers to exceed this number.


    Even though gaps allow you to change the order of properties on dynamic pages
    without having to renumber all of them, it is still a good idea to have the property
    order in the actual source file match the order of their order numbers. This makes
    it easier to understand how the dynamic page will look and make maintaining order
    numbers simpler.


    # Configuring Appearance of Labels


    In custom forms, the text elements and labels that appear on pages are specified
    explicitly in their markup. In dynamically generated pages, Dynamic Data uses
    the internal name of entities and their properties by default. When the internal
    name does not match what you want to appear on screen, your first choice should
    be to adjust the internal name in the entity model. For instance, if your entity
    model has a Customer entity, such as the one from the Northwind Traders sample
    shown in Figure 11.1, you might have properties such as ContactName and CompanyName
    that use PascalCase or another naming convention to concatenate multiple words
    into a single identifier.


    ![](img/11b373b78859e17d318fd76939a0df9d_370_0.png)


    FIGURE 11.1 Customer entity in Entity Designer.'
  merge: -1
  img_proc: true
- pgno: 371
  md: "Although business users can easily understand the term ContactName, it is not\
    \ a proper English word; it would be unprofessional to show it in the application.\
    \ You already know from the previous chapters in this book that you can easily\
    \ extend metadata information to specify that Name is the proper display name\
    \ for the ContactName property. However, before you add a DisplayAttribute to\
    \ the model, take this opportunity to stop and think about why the internal property\
    \ name does not match its display name. This can be a sign of a mismatch between\
    \ the domain terminology of your business users and the internal technical terminology\
    \ you use in the implementation of the app. In this example, you might speculate\
    \ that you cannot use the term Name because you want to distinguish between the\
    \ name of the person and the name of his or her company: Thus, technical terms\
    \ ContactName and CompanyName were chosen to distinguish them. But why is there\
    \ ambiguity here in the first place? Does your company, Northwind Traders, serve\
    \ consumers or businesses? If you are a consumer-focused company, you can reinforce\
    \ this fact in your entity model by renaming the ContactName property to simply\
    \ Name and changing the CompanyName property to simply Company, making it one\
    \ of the address properties.\n\nIt is very important to keep internal entity and\
    \ property names accurate. When names displayed on screen do not match expectations\
    \ of your business users, the first choice should be to change the entity model\
    \ to match terminology of your business domain. Ideally, you want to propagate\
    \ these name changes all the way down to the database level and have the names\
    \ of tables and columns consistent with the names of entities and properties.\
    \ Refactoring tools in Visual Studio make this task possible today, even with\
    \ significant amounts of .NET and SQL code. Getting in the habit of applying domain\
    \ terminology throughout the application helps to reduce the cost of ongoing maintenance\
    \ and helps the entire development team, including the new members, to understand\
    \ the application better.\n\nWhen the internal name of a property is consistent\
    \ with the business terminology but still not appropriate for display to users,\
    \ you can use data annotations to specify proper names that should be used instead.\
    \ Of course, you might also have to resort to this approach when renaming properties\
    \ in your entity model and columns in your database becomes too difficult. You\
    \ can start by setting the Name property of the DisplayAttribute—Dynamic Data\
    \ uses this value whenever a display name is required for the entity property,\
    \ including form labels, grid column headers, and validation error messages. If\
    \ a single display name is not enough, you can also specify a separate value in\
    \ the ShortName property of the DisplayAttribute, which is automatically used\
    \ in grid column headers. The code snippet for the HomePhone property of the Employee\
    \ entity in the Northwind sample:\n\n```\n```csharp\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [Display(Name = \"Home Phone\", ShortName = \"Home #\")]\n        public object\
    \ HomePhone { get; set; }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 372
  md: "> **NOTE**\n> It is not necessary to specify both ShortName and Name properties\
    \ of the DisplayAttribute if they have the same value. If the ShortName is not\
    \ specified, Dynamic Data automatically uses the Name instead.\n\n# Prompt Annotation\n\
    \nThe DisplayAttribute includes several additional properties that can be used\
    \ to further tune the appearance of the entity property in dynamically generated\
    \ pages, although not all of them are supported by the Dynamic Data out of the\
    \ box. In particular, the Prompt property of the DisplayAttribute could be used\
    \ to provide a custom string for use in form labels, similar to how the ShortName\
    \ property specifies display name for grid column headers. To implement this,\
    \ you can simply change the dynamic entity template, Default.ascx, to use the\
    \ prompt string if it was specified and otherwise fall back to using the display\
    \ name string, as shown next:\n\n```\nprotected void Label_Init(object sender,\
    \ EventArgs e)\n{\n    var label = (Label)sender;\n    label.Text = this.currentColumn.Prompt\n\
    \        ?? this.currentColumn.DisplayName;\n}\n```\n\n> **NOTE**\n> Here and\
    \ in the rest of this chapter, assume dynamic entity templates Default.ascx, Default_Edit.ascx,\
    \ and Default_Insert.ascx have been combined into a single, multimode template,\
    \ Default.ascx, as discussed in Chapter 10, “Building Custom Forms.”\n\nThis code\
    \ first appeared in Listing 10.6 and was discussed in detail in Chapter 10. The\
    \ Label_Init method handles the Init event of the Label control the entity template\
    \ generates for each entity property. The currentColumn field contains a reference\
    \ to the MetaColumn object describing the current entity property for which a\
    \ label and a data entry control are being generated. The original version of\
    \ this code initialized the label Text using only the DisplayName property of\
    \ the MetaColumn object. The new version just shown first tries to initialize\
    \ the label text using the Prompt before falling back to the DisplayName."
  merge: -1
  img_proc: true
- pgno: 373
  md: "# NOTE\n\nAs discussed in Chapter 7, \"Metadata API,\" the MetaColumn class\
    \ encapsulates data annotation attributes applied to the entity property. Although\
    \ it allows accessing data annotation attributes, using its Attributes property,\
    \ it also provides strongly typed properties to access specific annotations directly.\
    \ For example, the DisplayName and Prompt properties of the MetaColumn class return\
    \ values specified in the Name and Prompt properties of the DisplayAttribute,\
    \ respectively. Using these properties is not only easier, it is also faster due\
    \ to metadata caching performed by Dynamic Data.\n\n# NOTE\n\nThe ?? operator\
    \ is a C# null-coalescing operator. It's a powerful shortcut but can be confusing\
    \ if you are not familiar with it. Here is how a single line of code from the\
    \ snippet just shown can be replaced with a more verbose, but straightforward,\
    \ if statement:\n\n```\nif (this.currentColumn.Prompt != null)\n    label.Text\
    \ = this.currentColumn.Prompt;\nelse\n    label.Text = this.currentColumn.DisplayName;\n\
    ```\n\nAfter implementing support for the Prompt annotation in the dynamic entity\
    \ template, you can further refine the definition of the Employee entity and specify\
    \ a custom string for use with the HomePhone property in form labels as shown\
    \ next. Also the RequiredAttribute is added to the HomePhone property to help\
    \ illustrate the fact that the Name annotation is still important because it is\
    \ used to generate validation error messages.\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [Required]\n        [Display(Name = \"Home Phone\", ShortName = \"Home #\"\
    ,\n        Prompt = \"Home Phone Number:\")]\n        public object HomePhone\
    \ { get; set; }\n    }\n}\n```\n\nNotice how the Name, ShortName, and Prompt annotations\
    \ look in a dynamically generated UI in Figure 11.2. At the top of the picture,\
    \ you can see a fragment of a dynamic form where the Prompt annotation appears\
    \ as a label to the left of the phone number text box."
  merge: -1
  img_proc: true
- pgno: 374
  md: "At the bottom of the picture, a fragment of a dynamic grid shows the home phone\
    \ column where the ShortName annotation appears in the column header. On the right\
    \ side, you can see the validation error message generated by the RequiredAttribute,\
    \ which includes the Name annotation.\n\n![](img/11b373b78859e17d318fd76939a0df9d_374_0.png)\n\
    \nFIGURE 11.2 Name, ShortName, and Prompt annotations in dynamic UI.\n\n# Description\
    \ Annotation\n\nThe DisplayAttribute also defines Description property, which\
    \ most of the built-in field templates supplied by Dynamic Data use to provide\
    \ a tooltip for their data controls. The Description annotation offers a good\
    \ way to store documentation describing the entity properties during initial development\
    \ of the entity model. During active development, descriptions in code help up!\
    \ remember the intent of different properties; the tooltips in the user interface\
    \ make discussing them with the business users easier as well. When the entity\
    \ model design is stable, you refine the descriptions to serve as interactive\
    \ hints for users during data entry. The code snippet that follows illustrates\
    \ the last scenario; you can see how it looks in Figure 11.3:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [Display(Prompt = \"Home Phone Number:\",\n            Description = \"Please\
    \ enter a 10-digit Phone Number\")]\n        public object HomePhone { get; set;\
    \ }\n    }\n}\n```\n\n![](img/11b373b78859e17d318fd76939a0df9d_374_1.png)\n\n\
    FIGURE 11.3 Description annotation in Dynamic UI."
  merge: -1
  img_proc: true
- pgno: 375
  md: "In field templates, this annotation is available via the Description property\
    \ of the MetaColumn class. Field templates typically use it in Load event handlers\
    \ to set the ToolTip property of their data control, such as a TextBox or a DropDownList.\
    \ The Boolean_Edit, ForeignKey_Edit, and ManyToMany_Edit field templates do not\
    \ support the Description annotation out of the box. However, it is easy enough\
    \ to fix this problem by adding code similar to the following snippet. This example\
    \ was taken from the Boolean_Edit field template in the source code accompanying\
    \ this book:\n\n```\nprotected void Page_Load(object sender, EventArgs e)\n{\n\
    \    this.checkBox.ToolTip = this.Column.Description;\n}\n```\n\n# NOTE\n\nBy\
    \ design, the DisplayAttribute cannot be applied to classes; it contains many\
    \ properties that simply would not be applicable. To provide a human-readable\
    \ name for an entity type, you need to use the DisplayNameAttribute, as shown\
    \ in here:\n\n```\n[DisplayName(\"Order Items\")]\npartial class Order_Detail\n\
    {\n}\n```\n\n# Configuring Field Templates\n\nAfter specifying which properties\
    \ of an entity should appear on a dynamic form, in what order they should appear,\
    \ and what labels they should display, you might also need to specify which field\
    \ templates will be used for data entry and how they should be configured.\n\n\
    # Making Properties Read-Only\n\nOne of the important decisions to make when designing\
    \ entities in your application is whether a particular property can be modified\
    \ by the user or supplied by the system and displayed to the user in Read-only\
    \ mode. In a custom page or template, you can specify whether an Edit mode or\
    \ a Read-only field template will be loaded by setting the Mode property of the\
    \ DynamicControl or DynamicField explicitly in markup:\n\n```\n<asp:DynamicControl\
    \ runat=\"server\" DataField=\"SubmittedDate\" Mode=\"ReadOnly\" />\n```\n\nWhen\
    \ the DynamicControl instances are generated dynamically, the field template mode\
    \ needs to come from the model. If you were using a code-first or model-first\
    \ approach in"
  merge: -1
  img_proc: true
- pgno: 376
  md: "your entity model, your first choice should be making that property Read-only\
    \ in the entity model. Here is an example of doing this with a code-first approach:\n\
    \n```\npublic DateTime SubmittedDate { get; internal set; }\n```\n\nNotice that\
    \ the property setter has internal visibility, which, assuming your entity model\
    \ is in a separate project, will make it read-only in the Dynamic Data web application.\
    \ With the model-first approach, you can change property visibility in the Entity\
    \ Designer and have it generate the property with an internal setter.\n\nAlthough\
    \ it is also possible to use the Entity Designer to change property visibility\
    \ with the database-first approach, you might want to avoid doing this because\
    \ customization made to the generated entity model by hand quickly becomes difficult\
    \ to maintain. With the database-first approach, when the EDMX is regenerated\
    \ every time the database schema changes, your best option is to apply the EditableAttribute\
    \ to the property in the metadata class. Here is how you can do this for the Order\
    \ entity:\n\n```\n[MetadataType(typeof(Metadata))]\npartial class Order\n{\n \
    \   abstract class Metadata\n    {\n        [Editable(false)]\n        public\
    \ object SubmittedDate { get; set; }\n    }\n}\n```\n\nWhether you make a particular\
    \ property read-only in the entity model or use the EditableAttribute, Dynamic\
    \ Data (or more specifically the DynamicControl) uses the metadata information\
    \ to load a read-only version of the field template, even if the mode of the form\
    \ itself is Edit or Insert.\n\nThe EditableAttribute can be also used to selectively\
    \ change whether a particular property can be edited in the Insert mode. For instance,\
    \ if you wanted to allow your customers to enter the RequiredDate for their orders\
    \ only when submitting the order but prevent them from changing it later, you\
    \ could specify false as the AllowEdit property of the EditableAttribute, but\
    \ true as its AllowInitialValue property. Here is an example:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Order\n{\n    abstract class Metadata\n    {\n        [Editable(false,\
    \ AllowInitialValue = true)]\n        public object RequiredDate { get; set; }\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 377
  md: "# Overriding Default Field Templates\n\nDynamic Data chooses an appropriate\
    \ field template for each property based on its type. If you find yourself in\
    \ a situation where you need to change the field template Dynamic Data selected,\
    \ it is best to stop and ask yourself if the property has an appropriate type.\
    \ For instance, if you have a string property and want to force Dynamic Data to\
    \ use an integer field template, there is a good chance that the property type\
    \ is incorrect. The best course of action in that situation would be to correct\
    \ the problem at the source—in the entity model and the database.\n\nIf the property\
    \ does have an appropriate type, but the .NET type is not specific enough for\
    \ your needs, your next choice is to apply the DataTypeAttribute to the property\
    \ in the metadata class. For example, the HomePhone property of the Employee entity\
    \ is of type string; however, it is very different from another string property,\
    \ Notes. The first stores phone numbers; the second stores one or more lines of\
    \ text. Here is how you can clarify this distinction in the entity model by applying\
    \ the DataTypeAttribute:\n\n```\n[MetadataType(typeof(Metadata))]\npartial class\
    \ Employee\n{\n    private abstract class Metadata\n    {\n        [DataType(DataType.PhoneNumber)]\n\
    \        public object HomePhone { get; set; }\n\n        [DataType(DataType.MultilineText)]\n\
    \        public object Notes { get; set; }\n    }\n}\n```\n\nBy applying the DataTypeAttribute,\
    \ you are giving Dynamic Data a more specific type it can use to choose a more\
    \ appropriate field template, such as the MultilineText_Edit field template that\
    \ comes with Dynamic Data out of the box and the PhoneNumber_Edit field template\
    \ created in Chapter 3, “Field Templates.”\n\n> NOTE\n> \n> Applying the DataTypeAttribute\
    \ to specify MultilineText type for a string property should not be necessary\
    \ in many circumstances. Dynamic Data is smart enough to automatically recognize\
    \ properties mapped to database columns of type VARCHAR(MAX) or TEXT as MultilineText.\
    \ Therefore, treat it with suspicion and remember that it is better to address\
    \ a mismatch by changing the entity model instead of applying a data annotation\
    \ attribute."
  merge: -1
  img_proc: true
- pgno: 378
  md: "# Configuring Appearance of Values\n\nWhen building custom forms with Dynamic\
    \ Data components, you can explicitly control appearance of values by specifying\
    \ the DataFormatString, NullDisplayText, and HtmlEncode properties of the DynamicControl\
    \ and DynamicField controls directly in markup. With the TextBox-based field templates,\
    \ you can also control appearance of values in Edit and Insert mode by setting\
    \ the ApplyFormatInEditMode and ConvertEmptyStringToNull properties. Here is an\
    \ example used in Chapter 3, which covers this topic in detail, to display the\
    \ ShippedDate property of the Order entity in MM/dd/yy format:\n\n```\n<asp:DynamicField\
    \ DataField=\"ShippedDate\" DataFormatString=\"{0:MM/dd/yy}\" />\n```\n\nYou can\
    \ also specify these values in the metadata, by applying the DisplayFormatAttribute\
    \ to entity properties as shown here:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Order\n{\n    abstract class Metadata\n    {\n        [DisplayFormat(DataFormatString\
    \ = \"{0:MM/dd/yy}\")]\n        public object SubmittedDate { get; set; }\n  \
    \  }\n}\n```\n\n# NOTE\n\nUnder the hood, the DynamicControl uses properties of\
    \ the DisplayFormatAttribute applied to the column to initialize its own. In other\
    \ words, if you have a DataFormatString annotation specified in the metadata and\
    \ in markup, the value specified in markup takes precedence, as you would expect.\n\
    \nIf you need values of a particular property to appear consistently on multiple\
    \ pages of your web application, the DisplayFormatAttribute works great because\
    \ it allows you to specify the format string in a single place. However, because\
    \ this logic falls in to the presentation category, you should use this attribute\
    \ with caution. You can often avoid using the DisplayFormatAttribute and embedding\
    \ the presentation logic in the business layer by using the DataTypeAttribute\
    \ instead. For Date, Time, and Currency data types, this attribute provides default\
    \ format strings, which are sufficient in many cases. Here is how you could modify\
    \ metadata of the SubmittedDate property to use the DataType annotation instead:\n\
    \n```\n[MetadataType(typeof(Metadata))]\npartial class Order\n```"
  merge: -1
  img_proc: true
- pgno: 379
  md: "```\n{\n    abstract class Metadata\n    {\n        [DataType(DataType.Date)]\n\
    \        public object SubmittedDate { get; set; }\n    }\n}\n```\n\nFor DataType.Date,\
    \ the DataTypeAttribute provides a default format string {0:d}, which with English\
    \ (United States) regional settings is equivalent to the custom format string\
    \ {0:M/d/yyyy}. If you can live with a four-digit year format for the SubmittedDate,\
    \ using the DataTypeAttribute instead of the DisplayFormatAttribute is better.\
    \ It is not only simpler, but also keeps the presentation logic out of the entity\
    \ model and keeps the metadata at the (higher) business level. Otherwise, using\
    \ the DisplayFormatAttribute might still be preferable to embedding this information\
    \ in multiple custom pages throughout the application.\n\n# Enum Properties and\
    \ Enumeration Templates\n\nIn entity design, you often come across the need to\
    \ have a property with a fixed list of possible values. A common way to present\
    \ such properties to users is a drop-down list or a group of radio-buttons. Discovering\
    \ a need for such a control is another opportunity for you to stop and carefully\
    \ consider how this information should be presented in the entity model.\n\nIf\
    \ the list of possible values for a property will grow over time and the application\
    \ will not need any special logic for each new value, it is best to make this\
    \ property a foreign key and store the values in a separate table/entity. Dynamic\
    \ Data automatically uses the ForeignKey field templates for foreign key properties,\
    \ and the users see a drop-down list populated with values from the lookup table.\n\
    \nOn the other hand, if the list of possible values for a property is fixed and\
    \ especially if the application will have different business rules for different\
    \ values, it is best to define the list of values as an enumerated type, such\
    \ as the EmployeeType enum shown in the code in this example:\n\n```\npublic enum\
    \ EmployeeType: byte\n{\n    Fulltime = 0,\n    PartTime = 1,\n    Temporary =\
    \ 2\n}\n```\n\nBecause the Entity Framework does not support enumerated types\
    \ in .NET version 4, you also have to rely on the EnumDataTypeAttribute to associate\
    \ the enum type with an integral entity property as shown here:"
  merge: -1
  img_proc: true
- pgno: 380
  md: "```\n```csharp\n[MetadataType(typeof(Metadata))]\npartial class Employee\n\
    {\n    private abstract class Metadata\n    {\n        [EnumDataType(typeof(EmployeeType))]\n\
    \        public object EmployeeType { get; set; }\n    }\n}\n```\n```\n\nAs you\
    \ recall from Chapter 3, Dynamic Data automatically uses the Enumeration field\
    \ templates for all properties that have the EnumDataTypeAttribute applied. In\
    \ Edit mode, the enum items are displayed in a DropDownList control that looks\
    \ identical to the drop-down list produced by the foreign key template.\n\nThere\
    \ is a wide gray area between these two extremes, and you will often need to make\
    \ a judgment call on whether a particular property should be an enum or a foreign\
    \ key. On one hand, using a lookup table and a foreign key is more flexible—you\
    \ could add new values without recompiling the application—and implementing reports\
    \ at the database level is easier. On the other hand, using enum properties is\
    \ much simpler, especially when you need to have business rules attached to different\
    \ values.\n\nWhen in doubt, it is best to start with the simplest solution and\
    \ change it when you have a better understanding of the business domain. With\
    \ this in mind, start with an enum because this approach reduces the number of\
    \ entities and relationships in your entity model as well as the number of tables\
    \ and foreign keys in your database. It also simplifies the application code because\
    \ there is no need to load lookup values from a table or define special constants.\
    \ Later, if you discover that business users will want to add new values to the\
    \ list regularly, you can create a lookup entity and introduce a foreign key then.\n\
    \n# Extending the Enumeration Field Templates\n\nUnfortunately, Dynamic Data web\
    \ applications do not support display name annotations for enum items out of the\
    \ box. For instance, if your enum items need to have compound names, such as PartTime,\
    \ the built-in Enumeration_Edit field templates display the internal names to\
    \ the users. Obviously, this looks unprofessional, and you might be tempted to\
    \ convert the enum property to a foreign key and introduce a lookup table just\
    \ to store the display names. Luckily, it is easy to solve this problem by extending\
    \ the built-in templates and taking advantage of the data annotation attributes.\
    \ This is a small, one-time investment of effort that will provide ongoing savings\
    \ in cost and complexity over the lifetime of your application.\n\nTo specify\
    \ display names for enum items, you can either create a new or reuse an existing\
    \ data annotation attribute. As it turns out, the DisplayAttribute can be applied\
    \ not only to entity properties, but to enum items as well. The following code\
    \ shows how to modify the definition of the EmployeeType enum to specify display\
    \ names for all its values:"
  merge: -1
  img_proc: true
- pgno: 381
  md: "```\npublic enum EmployeeType: byte\n{\n    [Display(Name = \"Full-time\")]\
    \ Fulltime = 0,\n    [Display(Name = \"Part-time\")] PartTime = 1,\n    [Display(Name\
    \ = \"Temporary\")] Temporary = 2\n}\n```\n\n# NOTE\n\nReusing an existing .NET\
    \ framework type is always better when it fits your needs because it helps keep\
    \ the solution smaller and simpler. In this example, reusing the DisplayAttribute\
    \ to provide display names for enum items offers not only consistency with entity\
    \ properties, but also allows you to take advantage of the built-in localization\
    \ support and use additional display name properties, such as the ShortName and\
    \ Description. However, always be cognizant of the side effects from reusing a\
    \ type for an unintended purpose. The AutoGenerateField and AutoGenerateFilter\
    \ properties of DisplayAttribute will not be applicable to enum items, possibly\
    \ causing confusion for other developers. In this scenario, the benefits of reuse\
    \ and consistency outweigh the added complexity of creating a new attribute. However,\
    \ use your own judgment to make similar tradeoffs in your projects.\n\nHaving\
    \ decided on how display names of enum items will be specified in the model, you\
    \ now need to modify the Enumeration.ascx and Enumeration_Edit.ascx field templates\
    \ to access the additional metadata. To make this task easier, as well as to enable\
    \ reuse of this logic in additional field templates (you might need another field\
    \ template that displays a list of radio-buttons instead of a drop-down list),\
    \ the sample solution implements it in a new base class with the two enumeration\
    \ field templates to inheriting from it.\n\nListing 11.1 shows the complete source\
    \ code of the new base class, called UnleashedEnumerationFieldTemplate to follow\
    \ the naming convention established in this book. This class inherits from the\
    \ UnleashedFieldTemplate (a class introduced in Chapter 10) and overrides the\
    \ FieldValueString property and the PopulateListControl method inherited from\
    \ the ultimate base class of field templates—the FieldTemplateUserControl provided\
    \ by Dynamic Data.\n\nAs you are reviewing the implementation of this class, notice\
    \ that the BuildEnumDictionary method is responsible for collecting the metadata\
    \ information describing a given enum type. It uses reflection API to examine\
    \ each item defined in the enum type, determine its display name, and store the\
    \ enum names and values in an OrderedDictionary object. This specialized collection\
    \ class was chosen because, on one hand, you need a dictionary to support fast\
    \ lookup of a display name based on an enum value. On the other hand, you want\
    \ to preserve the original order of enum items when showing their display names\
    \ in a drop-down list. The OrderedDictionary class from the System.Collections.Specialized\
    \ namespace is the only dictionary class provided by the .NET framework that also\
    \ preserves the order of its items."
  merge: -1
  img_proc: true
- pgno: 382
  md: "The GetEnumDictionary method is responsible for calling the BuildEnumDictionary\
    \ method to extract metadata the first time a particular enum type is processed\
    \ by the application, caching the results to improve performance. This is a common\
    \ and important pattern when working with metadata. You want to cache the extracted\
    \ metadata because it requires multiple sequential loops and reflection calls\
    \ to collect. You definitely want to avoid doing this unnecessarily as it will\
    \ have a significant negative impact on overall performance of the web application.\
    \ In a worst-case scenario, where you have a page with a GridView control that\
    \ displays multiple enumeration columns and a large number of rows, the performance\
    \ hit might be noticeable even with a single user accessing the system. By storing\
    \ the extracted metadata in a static ConcurrentDictionary object, the UnleashedEnumerationFieldTemplate\
    \ ensures that any given enum type is processed only in the application's lifetime,\
    \ minimizing any performance impact of reflection.\n\n# LISTING 11.1 UnleashedEnumerationFieldTemplate\
    \ Base Class\n\n```\n```csharp\nusing System;\nusing System.Collections;\nusing\
    \ System.Collections.Concurrent;\nusing System.Collections.Specialized;\nusing\
    \ System.ComponentModel.DataAnnotations;\nusing System.Linq;\nusing System.Reflection;\n\
    using System.Web.DynamicData;\nusing System.Web.UI.WebControls;\n\nnamespace Unleashed.DynamicData\n\
    {\n    public class UnleashedEnumerationFieldTemplate : UnleashedFieldTemplate\n\
    \    {\n        private static readonly ConcurrentDictionary<Type, IOrderedDictionary>\n\
    \            enumCache = new ConcurrentDictionary<Type, IOrderedDictionary>();\n\
    \n        public override string FieldValueString\n        {\n            get\n\
    \            {\n                object fieldValue = this.FieldValue;\n       \
    \         Type enumType = this.Column.GetEnumType();\n                if ((fieldValue\
    \ != null && enumType != null)\n                {\n                    fieldValue\
    \ = Enum.ToObject(enumType, fieldValue);\n                    IOrderedDictionary\
    \ enumDictionary = GetEnumDictionary(enumType);\n                    var enumName\
    \ = (string)enumDictionary[fieldValue];\n                    if (!String.IsNullOrEmpty(enumName))\n\
    \                        return enumName;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 383
  md: "```\n```csharp\n}\n    return base.FieldValueString;\n}\n}\n\nprotected new\
    \ void PopulateListControl(ListControl listControl)\n{\n    Type enumType = this.Column.GetEnumType();\n\
    \    Type underlyingType = Enum.GetUnderlyingType(enumType);\n    IOrderedDictionary\
    \ enumDictionary = GetEnumDictionary(enumType);\n    foreach (DictionaryEntry\
    \ entry in enumDictionary)\n    {\n        var enumName = (string)entry.Value;\n\
    \        object enumValue = Convert.ChangeType(entry.Key, underlyingType);\n \
    \       listControl.Items.Add(new ListItem(enumName, enumValue.ToString()));\n\
    \    }\n}\n\nprivate static IOrderedDictionary GetEnumDictionary(Type enumType)\n\
    {\n    IOrderedDictionary enumDictionary;\n    if (!enumCache.TryGetValue(enumType,\
    \ out enumDictionary))\n    {\n        enumDictionary = BuildEnumDictionary(enumType);\n\
    \        enumCache.TryAdd(enumType, enumDictionary);\n    }\n\n    return enumDictionary;\n\
    }\n\nprivate static IOrderedDictionary BuildEnumDictionary(Type enumType)\n{\n\
    \    var dictionary = new OrderedDictionary();\n    FieldInfo[] enumFields = enumType.GetFields(\n\
    \        BindingFlags.Static | BindingFlags.GetField | BindingFlags.Public);\n\
    \    foreach (FieldInfo enumField in enumFields)\n    {\n        object enumValue\
    \ = enumField.GetValue(null);\n        DisplayAttribute annotation = enumField\n\
    \            .GetCustomAttributes(typeof(DisplayAttribute), false)\n         \
    \   .OfType<DisplayAttribute>().FirstOrDefault();\n        string enumName = annotation\
    \ != null\n            ? annotation.GetName()\n            : enumValue.ToString();\n\
    \        dictionary.Add(enumValue, enumName);\n```\n```"
