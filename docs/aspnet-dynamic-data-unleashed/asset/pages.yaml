- pgno: 317
  md: "products with a given name, followed by another request to insert a new record.\
    \ However, if you create a UNIQUE KEY constraint for the Products table in the\
    \ database, the application only needs to send a single request to insert the\
    \ new record and can rely on the database server to verify that the ProductName\
    \ of the new record is unique. Both implementations require the same number of\
    \ logical operations; however, the database implementation requires fewer server\
    \ requests, results in less data sent back and forth, and allows the database\
    \ server to choose the best way to enforce the uniqueness rule.\n\n# Integrating\
    \ Database Validation in Dynamic Data Applications\n\nHere is a T-SQL script you\
    \ can use to implement validation of the ProductName uniqueness at the database\
    \ level:\n\n```\nALTER TABLE [dbo].[Products]\n    ADD CONSTRAINT [UK_Products]\n\
    \    UNIQUE (ProductName)\n```\n\nWithout additional changes, an attempt to create\
    \ a new Product with a duplicate name through the Dynamic Data web application\
    \ results in a yellow screen of death, as shown in Figure 9.9.\n\n![](img/11b373b78859e17d318fd76939a0df9d_317_0.png)\n\
    \nFIGURE 9.9 Default error page generated for database exceptions."
