- pgno: 504
  md: "```\n_Suppliers = base.CreateObjectSet<Supplier>(\"Suppliers\");\nreturn _Suppliers;\n\
    }\n}\nprivate ObjectSet<Supplier> _Suppliers;\n```\n\nNow the code in the first\
    \ snippet peforms authorization check and throws a SecurityException when the\
    \ application tries to access the Suppliers property and the current user does\
    \ not have the permission to read it.\n\n> NOTE\n> \n> You cannot change implementation\
    \ of the entity set properties directly in the code generated by the Entity Designer\
    \ without losing the changes the next time the code is regenerated. As discussed\
    \ in Chapter 8, you need to replace the built-in generator with a T4-based template\
    \ provided by the ADO.NET team and modify the template logic responsible for generating\
    \ these properties.\n\nUnfortunately (from the perspective of implementing security),\
    \ you could also retrieve suppliers throught the Products object set, with the\
    \ help of the Supplier navigation property:\n\n```\nusing (var context = new NorthwindEntities())\n\
    {\n    var supplierInformation = context.Products.Select(p => p.Supplier);\n}\n\
    ```\n\nAnd if that weren't enough, you could also use projection and return supplier\
    \ information in objects of an anonymous type:\n\n```\nusing (var context = new\
    \ NorthwindEntities())\n{\n    var supplierInformation = context.Products\n  \
    \      .Select(p => new { p.Supplier.CompanyName, p.Supplier.Address });\n}\n\
    ```\n\nCode in the last two examples is compiled into LINQ expressions. You cannot\
    \ inject the authorization logic by simply changing implementation of the Supplier\
    \ navigation property of the Product entity because the property getter will not\
    \ be called during query execution. At this time, you have to leave this problem\
    \ unsolved because in the current version, the Entity Framework does not provide\
    \ extensibility mechanisms that would allow implementing Read authorization in\
    \ all possible scenarios."
