    \ \"Filters/\");\n}\n\npublic override string GetFilterVirtualPath(\n    MetaColumn\
    \ column, string filterHint)\n{\n    foreach (string candidate in this.GetFilterCandidates(column,\
    \ filterHint))\n    {\n        string path = VirtualPathUtility.Combine(\n   \
    \         this.filtersFolder, candidate + \".ascx\");\n        if (BuildManager.GetObjectFactory(path,\
    \ false) != null) return path;\n    }\n    return base.GetFilterVirtualPath(column,\
    \ filterHint);\n}\n\nprivate IEnumerable<string> GetFilterCandidates(\n    MetaColumn\
