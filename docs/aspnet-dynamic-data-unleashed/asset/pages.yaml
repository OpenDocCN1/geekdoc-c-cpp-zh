    \ {\n        var supplier = new Supplier();\n        supplier.CompanyName = \"\
    Test Supplier\";\n        supplier.HomePage = \"http://www.contoso.com\";\n  \
    \      context.Suppliers.AddObject(supplier);\n        context.SaveChanges();\n\
    \    }\n}\n```\n\n```\n[TestMethod]\n[ExpectedValidationException(MemberName =\
    \ \"HomePage\")]\npublic void HomePage_RejectsInvalidUrl()\n{\n    using (new\
    \ TransactionScope())\n    using (var context = new NorthwindEntities())\n   \
    \ {\n        var supplier = new Supplier();\n        supplier.CompanyName = \"\
    Test Supplier\";\n        supplier.HomePage = \"invalid://url\";\n        context.Suppliers.AddObject(supplier);\n\
    \        context.SaveChanges();\n    }\n}\n```\n\nUnlike with most other validation\
