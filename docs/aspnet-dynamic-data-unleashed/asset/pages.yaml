  md: "with its dynamic equivalent.\n\n```\nIQueryable query = // ...\nquery = query.Where(\"\
    City == @0\", \"London\");\n```\n\nThe dynamic Where method parses the string\
    \ and creates a strongly-typed LINQ expression tree that can be used by a LINQ-enabled\
    \ data access framework, such as the ADO.NET Entity Framework in this example.\
    \ Following is the equivalent code that uses LINQ expression classes to accomplish\
    \ the same result:\n\n```\nIQueryable query = // ...\n```\n\n```\nParameterExpression\
    \ parameter = Expression.Parameter(\n    query.ElementType, string.Empty);\nExpression\
    \ property = Expression.PropertyOrField(parameter, \"City\");\nExpression comparison\
    \ = Expression.Equal(\n    property, Expression.Constant(\"London\"));\nLambdaExpression\
    \ lambda = Expression.Lambda(\n    comparison, new ParameterExpression[] { parameter\
    \ });\n\nMethodCallExpression where = Expression.Call(\n    typeof(Queryable),\
    \ \"Where\",\n    new Type[] { query.ElementType },\n    new Expression[] { query.Expression,\
    \ Expression.Quote(lambda) });\n\nquery = query.Provider.CreateQuery(where);\n\
    ```\n\nCompared to raw expressions, dynamic LINQ extensions make implementing\
    \ filter templates much, much easier. However, parsing strings requires additional\
    \ CPU resources on the web server, and you might want to consider implementing\
    \ filter templates with LINQ expressions as an optimization. You might also need\
    \ to use LINQ expressions if the dynamic extensions do not support the LINQ functionality\
    \ you need in your filter template, such as joins. However, this topic is too\
    \ vast and complex to cover here; it is revisited in Chapter 12, “Building Custom\
    \ Search Pages.”\n\n# Building Search Pages with Filter Templates\n\nNow that\
    \ you have implemented the filter template, Text.ascx, and saved it in the DynamicData/Filters\
    \ folder of this web project, you can rewrite the sample search page to take advantage\
    \ of its functionality. Compare Listing 5.5, which shows the markup of the new\
    \ version of this page, with Listing 5.1, which shows the original version."
  merge: -1
