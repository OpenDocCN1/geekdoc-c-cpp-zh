    page generated with the new field template; Listing 10.11 shows its markup.


    ![](img/11b373b78859e17d318fd76939a0df9d_343_0.png)


    FIGURE 10.4 Web page with a custom State field template.


    # LISTING 10.11 State_Edit Field Template (Markup)


    ```

    <% Control Language="C#" CodeBehind="State_Edit.ascx.cs" Inherits="WebApplication.DynamicData.FieldTemplates.StateEditField"
    %>


