- pgno: 25
  md: '![](img/11b373b78859e17d318fd76939a0df9d_25_0.png)


    FIGURE 1.4  Data model templates.


    The data model includes some or all tables in a single database, so when naming
    the data model file, it is a good idea to use the name of the database it will
    represent. In this book, Northwind sample database is used, and the entity data
    model file is *Northwind.edmx*.


    # NOTE


    The Northwind sample database for SQL Server is available for download from Microsoft
    at the following address:


    http://www.microsoft.com/downloads/en/details.aspx?FamilyID=06616212-0356-46a0-8da2-eebc53a68034


    Originally developed for SQL Server 2000, it works with versions 2005 and 2008.


    The installation program, SQL2000SampleDb.msi, extracts the database files and
    scripts in the “C:\SQL Server 2000 Sample Databases” directory on your computer.
    You can create the Northwind database by running the following commands in the
    Command Prompt window:


    ```

    ```text

    c:

    cd "SQL Server 2000 Sample Databases"

    sqlcmd -S .\sqlexpress -E -i instnwnd.sql

    ```

    ```


    Note that in this example, -S .\sqlexpress refers to a local installation of the
    Express edition of SQL Server. If you have a default installation of the Developer
    or another edition on your computer, you need to change this parameter to . or
    specify the actual name your SQL Server.'
  merge: -1
  img_proc: true
