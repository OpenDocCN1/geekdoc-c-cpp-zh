- pgno: 89
  md: "# Mapping Entity Type to Multiple Tables\n\nA fairly common problem in database\
    \ applications is the mismatch between the shape of database tables and entity\
    \ types. For example, a common database optimization technique is to separate\
    \ frequently accessed columns from rarely accessed ones by placing them in two\
    \ separate tables. The idea is to reduce the amount of data that has to be read\
    \ from disk during table or index scan operations. This scenario can be illustrated\
    \ by splitting the Customers table from the Northwind database in two—Customer\
    \ and CustomerAddress:\n\n```\n```sql\ncreate table split.Customer(\n    CustomerID\
    \ nchar(5) not null primary key,\n    CompanyName varchar(40),\n    ContactName\
    \ nvarchar(30) not null,\n    ContactTitle nvarchar(30)\n);\n```\n```\n\n```\n\
    ```sql\ncreate table split.CustomerAddress(\n    CustomerID nchar(5) not null\
    \ primary key,\n    Address nvarchar(60),\n    City nvarchar(15),\n    Region\
    \ nvarchar(15),\n    PostalCode nvarchar(10),\n    Country nvarchar(15),\n   \
    \ Phone nvarchar(24),\n    Fax nvarchar(24)\n);\n```\n```\n\nEven though the Customer\
    \ information is now split in two tables, definition of the Customer entity in\
    \ the conceptual model does not have to change—it continues to have both contact\
    \ and address properties. You can map it to two tables instead of one; Figure\
    \ 2.12 shows how this looks in the Mapping Details window of the Entity Designer.\
    \ When the entity mapping has been modified, you can continue working with it\
    \ in the application code as if it were still mapped to a single table:\n\n```\n\
    ```csharp\nvar query = from c in context.Customers\n            select c;\nforeach\
    \ (Customer c in query)\n    Console.WriteLine(c.ContactName + \" \" + c.Address);\n\
    ```\n```\n\nUnder the hood, the Entity Framework automatically generates the SQL\
    \ join queries required to retrieve the customer information from what is now\
    \ two tables, allowing you to keep a holistic view of the Customer entity in the\
    \ application code."
  merge: -1
  img_proc: true
- pgno: 90
