- pgno: 410
  md: '![](img/11b373b78859e17d318fd76939a0df9d_410_0.png)


    # FIGURE 11.8 TwoColumn entity template.


    # NOTE


    Although it is hard to tell by just looking at the code in the OnLoad method of
    the TwoColumn entity template, the Order annotation is still as relevant here
    as it is in the Default (single-column) template. Because the GetScaffoldColumns
    method returns MetaColumn objects sorted by the Order value, the controls are
    instantiated and added to the two PlaceHolder controls in the proper order, as
    specified in the metadata. Keep in mind that both entity templates (single-item
    forms) and list page templates use the Order annotation to determine order of
    controls and columns respectively. Dealing with a large number of properties can
    be still difficult when it comes to the GridView columns.


    The approach used to create the TwoColumn entity template can also work for advanced
    page layouts that have more "zones" than just two, such as the popular "two columns
    with a footer" layout used by many applications including the Work Item Form in
    Visual Studio Team Explorer. It typically has two columns with small data controls
    that occupy the top half of the page and a combined footer area contains big data
    controls, such as multiline text boxes, that need to be much wider than a single
    column would allow.


    To support a more complex form layout, you would simply need to create a new entity
    template with an appropriate structure of HTML table (or div, if you prefer using
    CSS) elements and place a PlaceHolder control in locations where you want the
    data controls'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'to appear and give them appropriate names, such as “Left”, “Right”, “Bottom”,
    and so on. As long as you use the matching names in the GroupName annotations,
    the FindGroupPlaceHolder method will be able to find them, no matter how complex
    the form is.


    # Summary


    The ability to build user interfaces based on metadata is one of the key advantages
    Dynamic Data offers. It dramatically reduces the amount of presentation code you
    have to write and maintain over the lifetime of an application and, when used
    judiciously, significantly increases the speed of development. By postponing implementation
    of the user interface, Dynamic Data allows you to focus on the most important
    part of the application—its entity model. You can then refine it through short
    successive iterations, collecting feedback from business users based on actual
    working applications instead of diagrams, and greatly reduce risk and uncertainty
    in the project.


    Out of the box, Dynamic Data offers robust capabilities for building single-column
    forms through metadata. The DisplayAttribute allows you to control display names
    and order of entity properties on forms and in grids. The DisplayFormatAttribute
    offers configuration options to control appearance of values in both Read-only
    and Edit mode. The DataTypeAttribute and the UIHintAttribute can be used to override
    the default rules Dynamic Data uses when selecting a field template for a particular
    property. The EnumDataTypeAttribute can be applied to an integral property to
    associate it with a list of predefined values that are presented to the users
    as a DropDownList control by the Enumeration field template.


    This chapter discussed in detail how to overcome some of the limitations of Dynamic
    Data. The Enumeration field templates can be extended to take advantage of the
    DisplayAttribute to specify human-readable display name for enum items. Dynamic
    Data controls can be also extended to support field template parameters specified
    declaratively with the UIHintAttribute. Although it should be done with great
    caution, interaction between field templates can be configured through the metadata.
    Finally, additional dynamic entity templates can be implemented to take advantage
    of extended data annotations, such as the EntityUIHintAttribute discussed in this
    chapter.'
  merge: -1
  img_proc: true
