- pgno: 311
  md: "Saving changes inside of business rule methods also makes maintenance of automated\
    \ tests more difficult. Although the TransactionScope-based approach to enforcing\
    \ test isolation discussed in Chapter 8 will continue to work, saving changes\
    \ from a method under test requires additional disk access and makes the test\
    \ slower. As the number of automated tests increases, their performance becomes\
    \ more and more important. By keeping saving logic out of business rule methods,\
    \ you reduce disk access and speed up the tests.\n\nAlthough there are no hard\
    \ rules against this, it is usually a good idea to keep the persistence logic\
    \ out of the business rule methods and entity classes. Instead, it is better to\
    \ save changes in the business process code, which is usually implemented outside\
    \ of the Entity Framework context and invoked by the user. For example, a web\
    \ page or a console application is a better place to save changes.\n\n# Managing\
    \ Transactions\n\nAlthough the TransactionScope supports hierarchical transactions\
    \ and you could put one inside of a business rule method, you need to remember\
    \ that transactions do not apply to changes made in the memory of the application.\
    \ For instance, you could modify the FulfillOrder method to update the Order and\
    \ Product entities inside of a TransactionScope:\n\n```\nusing (var transaction\
    \ = new TransactionScope())\n{\n    order.OrderStatus = (byte)DataModel.OrderStatus.Fulfilled;\n\
    \    order.ShippedDate = DateTime.Now;\n    IQueryable<Order_Detail> orderItems\
    \ = this.Order_Details\n        .Include(\"Product\")\n        .Where(od => od.OrderID\
    \ == order.OrderID);\n    foreach (Order_Detail orderItem in orderItems)\n   \
    \     orderItem.Product.UnitsInStock -= orderItem.Quantity;\n    transaction.Complete();\n\
    }\n```\n\nHowever, remember that the Order and Product entities are not saved\
    \ to the database here; they are merely modified in memory. The TransactionScope\
    \ in this example encompasses only the query that retrieves the Order_Detail and\
    \ Product entities from the database. Because Microsoft SQL Server and other database\
    \ servers already execute SQL queries in transactions by default, using an explicit\
    \ transaction here would only increase complexity without adding any benefits.\
    \ Instead, it is better to implement transaction logic in the same place as the\
    \ persistence logic—outside of the business rule methods, as shown in the following\
    \ example:\n\n```\nusing (var transaction = new TransactionScope())\nusing (var\
    \ context = new NorthwindEntities())\n{\n    int orderId = // ...\n```"
