  md: '# CHAPTER 10


    # Building Custom Forms


    # IN THIS CHAPTER


    +   - Multimode Entity Templates

    +   - Configuring Field Templates

    +   - Creating Custom Field Templates

    +   - Implementing Interaction Between Field Templates

    +   - Improving Encapsulation of Field Templates

    +   - Using Entity Templates to Control Field Templates


    Dynamic Data offers two different, complementary approaches for implementing user
    interface. On one hand, you can use data annotation attributes, such as Display
    and UIHint, to modify the metadata describing entity types in your data model.
    The dynamic entity and page templates use this metadata information to generate
    functional pages for displaying, inserting, and editing the entity instances at
    runtime. On the other hand, you can accomplish the same task by using the Dynamic
    Data components to build custom field, entity, and page templates as well as custom
    pages.


    Custom user interfaces work well for the majority of information systems, where
    the challenge is to provide a good experience for users working with a relatively
    small number of entity types. On the other side of this spectrum are specialized
    applications, such as document management systems, where the challenge is to support
    a large number of entity types with acceptable experience. This is a different
    type of complexity, and a metadata-focused approach becomes more appropriate as
    it results in smaller codebase and maintenance effort.


    Although the metadata-focused approach to user interface has unique advantages,
    it is significantly more complex and difficult to understand. Not only does a
    developer need to understand how the Dynamic Data components interpret the built-in
    metadata, but they also have to understand the custom attributes and templates
    built by other developers on their team. The template-focused approach, on the
    other hand, is much closer to the traditional ASP.NET architecture of pages and
    user controls. It is also easier to understand'
