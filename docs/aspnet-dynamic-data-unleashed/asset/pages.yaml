- pgno: 235
  md: '# CHAPTER 8


    # Implementing Entity Validation


    # IN THIS CHAPTER


    +   - Validation Framework

    +   - Customizing Entity Framework Code Generation

    +   - Automated Testing

    +   - Declarative Validation

    +   - Imperative Validation

    +   - Validating Multiple Rules

    +   - Validating Entity State Changes


    Validation of entities is one of the key aspects of business logic. The .NET Framework
    introduced a new validation framework in Service Pack 1 of version 3.5, at the
    same time the first version of Dynamic Data was released. This framework is implemented
    in the System.ComponentModel.DataAnnotations namespace and contains a set of attributes
    and classes for validating objects and their properties.


    The Data Annotations namespace is defined in a separate assembly called System.ComponentModel.DataAnnotations,
    installed in the global assembly cache. This assembly is referenced by default
    when you create a new Dynamic Data project in Visual Studio. If, however, your
    entity classes are located in a separate project, make sure it references this
    assembly as well.


    # Validation Framework


    At the core of the validation framework is an abstract base class called ValidationAttribute.
    It defines a virtual method called IsValid, which takes an object to validate
    and returns true if it is valid and false if it is not. Concrete descendants of
    this class, such as the RequiredAttribute, override the IsValid method to perform
    the actual validation.


    The validation attributes are applied to the things they validate, such as properties,
    fields, or entire classes. Consider the following example that defines a simple
    Product entity class with a required property called ProductName:'
  merge: -1
  img_proc: true
- pgno: 236
  md: "```\npublic class Product\n{\n    [Required]\n    public string ProductName\
    \ { get; set; }\n}\n```\n\nThe .NET runtime does not invoke the validation attributes\
    \ automatically. Some code in your application must detect them and invoke the\
    \ validation logic explicitly. As you might recall from the discussion in Chapter\
    \ 3, “Field Templates,” and Chapter 6, “Page Templates,” the DynamicValidator\
    \ is responsible for doing this in ASP.NET Dynamic Data applications, when this\
    \ control is used in field templates and its ColumnName property specifies the\
    \ name of the entity property to which validation attributes have been applied.\n\
    \nThe Data Annotations namespace also provides a helper class, called Validator\
    \ that uses .NET reflection to validate any object based on the validation attributes\
    \ applied to its class and individual properties. Here is how to validate an instance\
    \ of the Product entity class we just defined:\n\n```\nvar product = new Product();\n\
    var context = new ValidationContext(product, null, null);\nValidator.ValidateObject(product,\
    \ context, true);\n```\n\nThe ValidationContext object contains information about\
    \ the object being validated. The ValidateObject method passes it to each validation\
    \ attribute along with the property value to validate. ValidationContext allows\
    \ implementation of sophisticated validation logic that is not limited to a single\
    \ property value. Following is the constructor used in the preceding example to\
    \ create this object:\n\n```\nValidationContext(object instance, IServiceProvider\
    \ serviceProvider,\nIDictionary<object, object> items)\n```\n\nThe first parameter,\
    \ instance, is the object being validated. The second, serviceProvider, and third,\
    \ items, parameters of the constructor are used in advanced scenarios, some of\
    \ which will be discussed later. For simple cases, they can be null.\n\nThe ValidateObject\
    \ method of the Validator class takes the object to validate as its first parameter\
    \ and throws a ValidationException for the first validation attribute whose IsValid\
    \ method returns false. The actual signature of the ValidateObject method is shown\
    \ here:\n\n```\nvoid ValidateObject(object instance, ValidationContext validationContext,\n\
    bool validateAllProperties)\n```\n\nDespite what its name implies, the validateAllProperties\
    \ parameter of the ValidateObject method actually determines whether all validation\
    \ attributes will be evaluated or only the instances of the RequiredAttribute.\
    \ You want to specify true in most circumstances."
  merge: -1
  img_proc: true
- pgno: 237
  md: "> **NOTE**\n> \n> Validation attributes applied to properties and fields are\
    \ evaluated before the attributes applied to the class. However, you should not\
    \ rely on the order of validation within these two groups. The .NET Framework\
    \ does not guarantee that the order of properties or attributes returned by the\
    \ reflection APIs will match the order of their appearance in the source code.\
    \ Even though, in many cases, the order of validation appears to match the order\
    \ of attributes, there will be exceptions. If the order of validation rules is\
    \ important, instead of attributes, you need to rely on coded validation discussed\
    \ in the *Imperative Validation* section of this chapter.\n\nIf you want to validate\
    \ an object without throwing a `ValidationException`, you can call the `TryValidateObject`\
    \ method of the `Validator` class instead:\n\n```\nbool TryValidateObject(object\
    \ instance, ValidationContext validationContext,\n    ICollection<ValidationResult>\
    \ validationResults, bool validateAllProperties)\n```\n\nThis method returns a\
    \ Boolean value that indicates whether or not the object is valid and populates\
    \ the collection you supply in the `validationResults` parameter with a separate\
    \ `ValidationResult` object for each error detected.\n\n# Validation Error Messages\n\
    \nIn addition to performing the validation itself, the validation attributes are\
    \ responsible for generating error messages if the validation fails. Each concrete\
    \ validation attribute, such as `RequiredAttribute`, discussed so far, provides\
    \ a default error message. For instance, with the following definition of the\
    \ `ProductName` property, the `RequiredAttribute` generates an error message “The\
    \ ProductName field is required.”\n\n```\n[Required]\npublic string ProductName\
    \ { get; set; }\n```\n\nObviously, this error message is very technical and might\
    \ not be appropriate for business users. You can replace the internal name of\
    \ the field in the error message with its human-readable form by applying the\
    \ `DisplayAttribute` as shown here:\n\n```\n[Required]\n[Display(Name = \"Product\
    \ Name\")]\npublic string ProductName { get; set; }\n```\n\nWith this updated\
    \ definition, the `RequiredAttribute` generates the error message as “The Product\
    \ Name field is required,” which in many instances will be acceptable for display.\
    \ However, if this is still not enough, you can completely replace the error message\
    \ by specifying the `ErrorMessage` property in the validation attribute explicitly:"
