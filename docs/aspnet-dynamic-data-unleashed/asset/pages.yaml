  md: "# Extending DynamicControl (Again)\n\nThe UnleashedControl class introduced\
    \ in the beginning of this chapter takes care of initializing its Mode property\
    \ based on the mode of the entity template that hosts it. This control can provide\
    \ several additional properties and methods to make manipulating field templates\
    \ easier. Listing 10.21 shows the final version of this class. With the exception\
    \ of the first half of the OnInit method, the rest of its code is new.\n\nLISTING\
    \ 10.21 Final Version of the UnleashedControl\n\n```\n```csharp\nusing System;\n\
    using System.ComponentModel;\nusing System.Web.DynamicData;\nusing System.Web.UI.WebControls;\n\
    \nnamespace Unleashed.DynamicData\n{\n    public class UnleashedControl : DynamicControl\n\
    \    {\n        private static readonly object FieldValueChangedEvent = new object();\n\
    \n        public new UnleashedFieldTemplate FieldTemplate\n        {\n       \
    \     get { return (UnleashedFieldTemplate)base.FieldTemplate; }\n        }\n\n\
    \        [Browsable(false)]\n        public object FieldValue\n        {\n   \
    \         get { return this.FieldTemplate.FieldValue; }\n            set { this.FieldTemplate.FieldValue\
    \ = value; }\n        }\n\n        public event EventHandler FieldValueChanged\n\
    \        {\n            add\n            {\n                this.Events.AddHandler(FieldValueChangedEvent,\
    \ value);\n                if (this.FieldTemplate != null)\n                 \
    \   this.FieldTemplate.FieldValueChanged += value;\n            }\n          \
    \  remove\n            {\n                this.Events.RemoveHandler(FieldValueChangedEvent,\
    \ value);\n                if (this.FieldTemplate != null)\n                 \
    \   this.FieldTemplate.FieldValueChanged -= value;\n            }\n        }\n\
    \    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 362
  md: "# LISTING 10.21 Continued\n\n```\n}\nprotected override void OnInit(EventArgs\
    \ e)\n{\n    if (this.Mode == DataBoundControlMode.ReadOnly)\n    {\n        EntityTemplateUserControl\
    \ entityTemplate =\n            this.TemplateControl as EntityTemplateUserControl;\n\
    \        if (entityTemplate != null)\n        {\n            this.Mode = entityTemplate.Mode;\n\
    \            this.ValidationGroup = entityTemplate.ValidationGroup;\n        }\n\
    \    }\n\n    base.OnInit(e);\n\n    var eventHandler = (EventHandler)this.Events[FieldValueChangedEvent];\n\
    \    if (eventHandler != null)\n        this.FieldTemplate.FieldValueChanged +=\
    \ eventHandler;\n}\n}\n```\n\nIn the built-in DynamicControl class, the FieldTemplate\
    \ property returns an object of type Control. The UnleashedControl redefines this\
    \ property to return a strongly typed instance of the UnleashedFieldTemplate class.\
    \ This helps to reduce the amount of typecasting in this class as well as in entity\
    \ templates that need to access the field templates directly.\n\nThe FieldValue\
    \ property provides a convenient way of getting and setting the FieldValue property\
    \ of the underlying field template programmatically. It is not intended to be\
    \ used from markup.\n\nThe FieldValueChanged event is also a convenience wrapper.\
    \ It can be used to assign event handlers for the field template's FieldValueChanged\
    \ event. Unlike the FieldValue property, this event is intended for use in markup,\
    \ although it can be used programmatically as well. To support assigning event\
    \ handlers from markup, when the field template has not been instantiated yet,\
    \ the event handlers are stored in the Events list of the UnleashedControl itself.\
    \ When the field template has been created in the OnInit method, the event handlers,\
    \ if any, are assigned to the field template's own event."
