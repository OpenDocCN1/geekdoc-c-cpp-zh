    \ runat=\"server\" />\n    <asp:FormView ID=\"form\" runat=\"server\" DataSourceID=\"\
    dataSource\">\n        <ItemTemplate>\n            <asp:DynamicEntity runat=\"\
    server\" />\n        </ItemTemplate>\n    </asp:FormView>\n    <asp:EntityDataSource\
    \ ID=\"dataSource\" runat=\"server\"\n        ConnectionString=\"name=NorthwindEntities\"\
    \ AutoGenerateWhereClause=\"true\"\n        DefaultContainerName=\"NorthwindEntities\"\
    \ EntitySetName=\"Customers\">\n        <WhereParameters>\n            <asp:QueryStringParameter\
    \ QueryStringField=\"ID\" Name=\"CustomerID\" />\n        </WhereParameters>\n\
