  md: "# Validating Multiple Rules\n\nYou can use multiple validation methods and\
    \ multiple instances of the CustomValidationAttribute to implement different validation\
    \ rules. However, if some of the validation rules are related, it might be easier\
    \ to implement them together in a single method. Continuing this example of validating\
    \ orders, suppose the Northwind Traders Company allows customers to specify a\
