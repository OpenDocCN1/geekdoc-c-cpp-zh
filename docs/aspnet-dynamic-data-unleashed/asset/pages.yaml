  md: "# NOTE\n\nThis is where name of the EntityTemplate control becomes confusing\
    \ because it collides with the concept of entity templates represented by the\
    \ EntityTemplateUserControl base class. The EntityTemplate control defines a markup\
    \ template used to create a DynamicControl and a Label for a single entity property,\
    \ whereas the EntityTemplateUserControl defines markup for all properties of the\
    \ entire entity class. Perhaps ColumnTemplate would have been a better name for\
    \ the EntityTemplate control.\n\n# LISTING 11.14 TwoColumn Entity Template (Code-Behind)\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel.DataAnnotations;\n\
    using System.Linq;\nusing System.Web.DynamicData;\nusing System.Web.UI.WebControls;\n\
    \nnamespace WebApplication\n{\n    public partial class TwoColumnEntityTemplate\
    \ : EntityTemplateUserControl\n    {\n        private MetaColumn currentColumn;\n\
    \n        protected override void OnLoad(EventArgs e)\n        {\n           \
    \ IEnumerable<MetaColumn> scaffoldColumns =\n                this.Table.GetScaffoldColumns(this.Meta,\
    \ this.ContainerType);\n            foreach (MetaColumn column in scaffoldColumns)\n\
    \            {\n                this.currentColumn = column;\n               \
    \ var container = new NamingContainer();\n                this.entityTemplate.ItemTemplate.InstantiateIn(container);\n\
    \                PlaceHolder placeHolder = this.FindGroupPlaceHolder(column);\n\
    \                placeHolder.Controls.Add(container);\n            }\n       \
    \ }\n\n        protected void Label_Init(object sender, EventArgs e)\n       \
    \ {\n            ((UnleashedLabel)sender).DataField = this.currentColumn.Name;\n\
    \        }\n    }\n```"
