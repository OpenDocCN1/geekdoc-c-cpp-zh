- pgno: 76
  md: 'lambda expressions are not compiled directly into IL instructions. Instead,
    they are parsed into Expression objects and passed to the Entity Framework, which
    translates them to SQL statements and sends them to database engine for execution.


    Where is only one of the many LINQ extension methods available for use with Entity
    Framework. This list includes methods like Average, Min, Max, Sum, and Count,
    which have similar names and work like the aggregate functions in SQL. Other methods,
    such as Any and Contains, also have direct counterparts in SQL with very different
    names. Any is LINQ''s equivalent of the EXISTS operator, and Contains is an equivalent
    of the IN operator in SQL. Yet some methods have no direct counterparts in SQL
    at all, such as the All method, which returns true if all elements of a sequence
    match the specified criteria.


    Table 2.1 provides a summary of the LINQ extension methods. Take a minute to review
    the list to get an idea of what is available. However, a complete discussion of
    LINQ operators and extension methods deserves much more time and pages than can
    be allotted here.


    # TABLE 2.1 LINQ Extension Methods


    | Method | Description |

    |---|---|

    | Aggregate | Applies an accumulator function over a sequence. |

    | All | Determines whether all the elements of a sequence satisfy a condition.
    |

    | Any | Determines whether a sequence contains any elements that satisfy a condition.
    |

    | Average | Computes the average of a sequence of numeric values. |

    | Cast | Converts the elements of a sequence to the specified type. |

    | Concat | Concatenates two sequences. |

    | Contains | Determines whether a sequence contains a specified element. |

    | Count | Returns the number of elements in a sequence. |

    | DefaultIfEmpty | Returns the elements of the specified sequence or a default
    value in a singleton collection if the sequence is empty. |

    | Distinct | Returns distinct elements from a sequence. |

    | ElementAt | Returns the element at a specified index in a sequence. |

    | ElementAtOrDefault | Returns the element at a specified index in a sequence
    or a default value if the index is out of range. |

    | Except | Returns elements from the first sequence except those that are also
    in the second sequence. |

    | First | Returns the first element of a sequence. |

    | FirstOrDefault | Returns the first element of a sequence or a default value
    if the sequence contains no elements. |

    | GroupBy | Groups the elements of a sequence. |

    | Intersect | Returns elements from the first sequence that are also in the second
    sequence. |

    | Join | Performs an inner join of two sequences. |

    | Last | Returns the last element in a sequence. |'
