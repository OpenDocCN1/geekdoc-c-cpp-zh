- pgno: 152
  md: 'If the Mode property is set to Insert, Dynamic Data will also try Insert mode
    templates in the order shown in Table 4.1.


    Notice that in Insert mode, the lookup algorithm breaks the pattern used in Read-only
    and Edit modes. Instead of trying different template names for Insert mode first,
    such as `Contact_Insert.ascx`, `Customers_Insert.ascx`, and `Default_Insert.ascx`
    and then repeating the process with Edit mode, it tries Insert and Edit modes
    for each template name. This is unfortunate because it makes the lookup algorithm
    much more confusing and difficult to understand. On the other hand, this twist
    allows you to reuse Edit mode templates in Insert mode. If it were not in place,
    the `Default_Insert.ascx` field template would always be used in Insert mode unless
    you defined `Contact_Insert.ascx` or `Customers_Insert.ascx`.


    **TABLE 4.1** Example of Entity Template Lookup


    | Mode="Insert" | Mode="Edit" | Mode="ReadOnly" |

    |---|---|---|

    | `Contact_Insert.ascx` | `Contact_Edit.ascx` | `Contact.ascx` |

    | `Contact_Edit.ascx` | `Customers_Edit.ascx` | `Customers.ascx` |

    | `Customers_Insert.ascx` | `Default_Edit.ascx` | `Default.ascx` |

    | `Customers_Edit.ascx` | `Contact.ascx` |  |

    | `Default_Insert.ascx` | `Customers.ascx` |  |

    | `Default_Edit.ascx` | `Default.ascx` |  |

    | `Contact.ascx` |  |  |

    | `Customers.ascx` |  |  |

    | `Default.ascx` |  |  |


    # Built-in Entity Templates


    Out of the box, Dynamic Data projects offer three dynamic entity templates, one
    for each mode:


    +   - `Default.ascx`

    +   - `Default_Edit.ascx`

    +   - `Default_Insert.ascx`


    All three dynamic entity templates generate a table with two columns, where the
    left column contains Label controls and the right column contains DynamicControl
    instances. One table row is generated for each scaffolded column in the entity
    MetaTable. Aside from the Mode property of the DynamicControl, which they set
    to ReadOnly, Edit, and Insert, respectively, these three entity templates are
    nearly identical and designed to present a consistent view of the entity in all
    three different modes.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Summary


    Entity templates are a special type of ASP.NET user control, used by Dynamic Data
    to encapsulate presentation logic of displaying a single entity instance or, using
    database terminology, a single row from database table. Entity templates are used
    with web pages that display a single item at a time, typically in a form-based
    format.


    By default, Dynamic Data expects to find entity templates in the `DynamicData\EntityTemplates`
    folder of the web application. A set of default entity templates is provided out
    of the box in this folder by the Dynamic Data web project templates in Visual
    Studio 2010. The default templates dynamically generate labels and controls for
    any given entity based on the metadata information extracted from a LINQ-based
    data model, such as Entity Framework or LINQ to SQL.


    Metadata information defines the list of columns that should be displayed based
    on the `DisplayAttribute` in the `System.ComponentModel.DataAnnotations` namespace.
    Data annotation attributes can be used to change display names and order of the
    columns on a page produced by the default entity templates. When fine-grained
    control of the form layout is required, custom entity templates can be created.'
  merge: -1
  img_proc: true
