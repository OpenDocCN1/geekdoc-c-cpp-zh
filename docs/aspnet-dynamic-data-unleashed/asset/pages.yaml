  md: '# Taking Advantage of the UnleashedControl in Entity Templates


    With the new version of the UnleashedControl, you only need to make minimal changes
    to the Customer entity template. Listing 10.22 shows the final version of the
    markup file with the changes highlighted with bold font.


    # LISTING 10.22 Final Version of the Customer Entity Template (Markup)


    ```

    <%@ Control Language="C#" CodeBehind="Customers.ascx.cs" Inherits="WebApplication.DynamicData.EntityTemplates.CustomerEntityTemplate"
    %>


    <unl:UnleashedLabel runat="server" DataField="CustomerID" />

    <unl:UnleashedControl runat="server" DataFields="CustomerID" />

    <unl:UnleashedLabel runat="server" DataField="ContactName" />

    <unl:UnleashedControl runat="server" DataField="ContactName" />


    <fieldset>

    <legend>Address</legend>

    <unl:UnleashedLabel runat="server" DataField="Address" />

    <unl:UnleashedControl runat="server" DataField="Address" Columns="65" />

    <br />

    <unl:UnleashedLabel runat="server" DataField="City" />

    <unl:UnleashedControl runat="server" DataField="City" />

    <unl:UnleashedLabel runat="server" DataField="Region" />

    <unl:UnleashedControl ID="regionControl" runat="server" DataField="Region" UIHint="Region"
    />

    <unl:UnleashedLabel runat="server" DataField="PostalCode" />

    <unl:UnleashedControl runat="server" DataField="PostalCode" />

    <unl:UnleashedLabel runat="server" DataField="Country" />

    <unl:UnleashedControl ID="countryControl" runat="server" DataField="Country" AutoPostBack="True"
    OnFieldValueChanged="Country_FieldValueChanged" />

    </fieldset>

    ```


    As you can see, IDs for both Country and Region controls are specified to make
    them easier to work with in the code-behind. The Country control also takes advantage
    of the new capabilities of the UnleashedControl to specify the OnFieldValueChanged
    event handler.


    The code-behind, shown in Listing 10.23, performs the logic that used to be implemented
    by the Region field template. Now that it no longer has to access the Country
    field template directly, the UpdateRegionCountry method gets the current FieldValue
    from the Country field template and assigns it to the Region template''s Country
    property. The UpdateRegionCountry method is called twice—the first time during
    the data binding stage (from the OnDataBinding method), when the initial value
    of the Country field is retrieved from the database, and second time during post-backs
    (from the Country_FieldValueChanged method), when this value is modified by the
    user.'
