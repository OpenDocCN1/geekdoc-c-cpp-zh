- pgno: 132
  md: '# ForeignKey


    ![](img/11b373b78859e17d318fd76939a0df9d_132_0.png)


    The ForeignKey.aspx is used for foreign key columns in Read-only mode. It contains
    a HyperLink control that displays the field value of the “display” column of the
    parent table. You can specify the display column explicitly by applying the DisplayColumnAttribute
    to the parent entity class, or it can be selected automatically based on the Dynamic
    Data heuristics. Users can click the link generated by the control to navigate
    to the List.aspx page of the parent table.


    # ForeignKey_Edit


    ![](img/11b373b78859e17d318fd76939a0df9d_132_1.png)


    The ForeignKey_Edit.ascx field template is used for foreign key columns in Edit
    and Insert modes. It contains a DropDownList control that displays all rows from
    the parent table. The display column of the parent table determines the Text of
    each ListItem, and its primary key columns determine its Value.


    # Integer_Edit


    ![](img/11b373b78859e17d318fd76939a0df9d_132_2.png)


    The Integer_Edit.ascx field template is used for Byte, Int16, Int32, and Int64
    columns in Edit and Insert modes. It contains a TextBox control, accompanied by
    a CompareValidator, which is used to ensure that values entered in the TextBox
    are valid numbers. It also contains a RequiredFieldValidator, used to enforce
    values for columns marked with the RequiredAttribute; a RangeValidator, used to
    enforce range of values for columns marked with the RangeAttribute; a RegularExpressionValidator,
    used to enforce regular expression patterns for columns marked with the RegularExpressionAttribute;
    and a DynamicValidator, used to enforce all other validation attributes applied
    to the column.


    # ManyToMany


    ![](img/11b373b78859e17d318fd76939a0df9d_132_3.png)


    The ManyToMany.aspx field template is used for children columns in a many-to-many
    relationship, such as the Employees column of the Territory entity in the Northwind
    sample database. This template contains a Repeater control that generates a DynamicHyperLink
    for every child entity. On the actual page, this looks like a list of hyperlinks
    that the user can click to navigate to the Details.aspx page of a particular child
    entity.


    > > **NOTE**

    > >

    > > Many-to-many relationships are natively supported in Entity Framework but
    not in LINQ to SQL. Therefore, only the Entity Framework flavors of the Dynamic
    Data project templates in Visual Studio include the ManyToMany field template.
    Unlike other field templates, which work equally well with both data access frameworks,
    the ManyToMany field template uses Entity Framework APIs directly.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'LINQ to SQL natively supports only one-to-many relationships and requires you
    to have an explicit many-to-many entity in the model. However, it is possible
    to mimic many-to-many relationships by implementing a simple coding pattern as
    Eric Smith and Shannon Davidson describe in the article published on the Code
    Project, which can be found at the following location online:


    http://www.codeproject.com/KB/linq/linq-to-sql-many-to-many.aspx


    It is possible to create Dynamic Data many-to-many field templates for LINQ to
    SQL based on this approach. However, this exercise is outside the scope of this
    chapter.


    # ## ManyToMany_Edit


    ![](img/11b373b78859e17d318fd76939a0df9d_133_0.png)


    The ManyToMany_Edit.ascx field template is used for many-to-many children columns
    in Edit and Insert modes. This template contains a CheckBoxList control that generates
    a check box for every entity the user can check to add it to the list of children.


    # ## MultilineText_Edit


    ![](img/11b373b78859e17d318fd76939a0df9d_133_1.png)


    The MultilineText_Edit.ascx field template is used for long string columns in
    Edit and Insert modes. It contains a TextBox control with TextMode property set
    to MultiLine. It also contains a RequiredFieldValidator, used to enforce values
    for columns marked with the RequiredAttribute, a RegularExpressionValidator, used
    to enforce regular expression patterns for columns marked with the RegularExpressionAttribute
    and a DynamicValidator, used to enforce all other validation attributes applied
    to the column.


    String columns are considered long when they do not have maximum length specified
    in the data model, such as the Notes column of the Employee entity in the Northwind
    sample, which has type NTEXT. You can also force Dynamic Data to use the MultilineText_Edit
    field template for columns that do have maximum length by applying the DataType(DataType.MultilineText)
    attribute to their properties in the data model.


    # ## Text


    ![](img/11b373b78859e17d318fd76939a0df9d_133_2.png)


    Due to the data type fallback used during template lookup, the Text.ascx field
    template can be used in Read-only mode for columns of all primitive types with
    the exception of Boolean and DateTime columns, for which Dynamic Data provides
    specific templates. This field template includes a Literal control that displays
    the field value converted to a string.'
  merge: -1
  img_proc: true
