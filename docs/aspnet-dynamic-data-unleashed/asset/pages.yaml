  md: "# LISTING 3.11  PhoneNumber_Edit Field Template (Markup)\n\n```\n```aspx\n\
    <%@ Control Language=\"C#\" CodeBehind=\"PhoneNumber_Edit.ascx.cs\"\n    Inherits=\"\
    WebApplication.DynamicData.FieldTemplates.PhoneNumberEditField\" %>\n\n<asp:TextBox\
    \ ID=\"textBox\" runat=\"server\" Text='<%# FieldValueEditString %>'/>\n\n<ajax:FilteredTextBoxExtender\
    \ TargetControlID=\"textBox\" runat=\"server\"\n    FilterType=\"Custom\" ValidChars=\"\
    ()+-1234567890\" />\n\n<asp:RequiredFieldValidator runat=\"server\" ID=\"requiredFieldValidator\"\
    \n    ControlToValidate=\"textBox\" Enabled=\"false\" />\n<asp:RegularExpressionValidator\
    \ runat=\"server\" ID=\"regularExpressionValidator\"\n    ControlToValidate=\"\
    textBox\" />\n<asp:DynamicValidator runat=\"server\" ID=\"dynamicValidator\"\n\
    \    ControlToValidate=\"textBox\" />\n```\n```\n\nAs you can see, the PhoneNumber_Edit\
    \ field template is similar to the DateTime template discussed earlier. It has\
    \ a TextBox control used to enter the phone number, a FilteredTextBoxExtender,\
    \ another AJAX control used to prevent users from entering symbols that would\
    \ not be valid in a phone number, as well as several validator controls.\n\nAlthough\
    \ having a single DynamicValidator control is sufficient to enforce all validation\
    \ attributes applied to the column in the data model, this control performs validation\
    \ only on the server side, which requires a post-back before the error can be\
    \ reported. Other ASP.NET validation controls, such as the RequiredFieldValidator,\
    \ are optional, but because they also offer client-side validation logic, it’s\
    \ best to include them in field templates to provide immediate feedback to the\
    \ user, and improve the data entry experience.\n\nListing 3.12 shows the code-behind\
    \ of the PhoneNumber_Edit field template.\n\n# LISTING 3.12  PhoneNumber_Edit\
    \ Field Template (Code-Behind)\n\n```\n```csharp\nusing System;\nusing System.Collections.Specialized;\n\
    using System.ComponentModel.DataAnnotations;\nusing System.Linq;\nusing System.Web;\n\
    using System.Web.DynamicData;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
    \nnamespace WebApplication.DynamicData.FieldTemplates\n{\n    public partial class\
    \ PhoneNumberEditField : FieldTemplateUserControl\n    {\n        public override\
    \ Control DataControl\n        {\n```\n```"
