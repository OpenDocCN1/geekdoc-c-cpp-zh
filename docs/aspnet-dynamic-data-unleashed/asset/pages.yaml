    \ override void OnDataBinding(EventArgs e)\n        {\n            base.OnDataBinding(e);\n\
    \            this.UpdateRegionCountry();\n        }\n\n        protected void\
    \ Country_FieldValueChanged(object source, EventArgs e)\n        {\n         \
    \   this.UpdateRegionCountry();\n        }\n\n        private void UpdateRegionCountry()\n\
    \        {\n            var regionTemplate = (RegionEditField)this.regionControl.FieldTemplate;\n\
    \            regionTemplate.Country = (string)this.countryControl.FieldValue;\n\
    \        }\n    }\n}\n```\n\nBy extracting the interaction logic from the Region\
    \ field template into the Customer entity template, you have improved the field\
    \ template's encapsulation and made it more flexible. Overall, this makes it a\
    \ better component, allowing you to reuse it in more scenarios, such as when building\
    \ a custom Order entity template. Although it might seem that implementing the\
    \ interaction between the Region and Country fields in every custom entity template\
    \ unnecessarily increases the development effort, the fact that the internal dependency\
    \ between two field templates has been eliminated makes them much easier to understand\
    \ and maintain independently of each other.\n\nPlacing the interaction code in\
    \ entity templates also makes it much easier to understand and maintain the entity\
    \ templates because it makes the interaction between field templates clearly visible.\
    \ Imagine having to fix a bug in a complex form that has several dozen field templates,\
    \ many interacting with each other under the covers. In fact, this approach implements\
    \ the classic Model-View-Controller (MVC) pattern designed to solve common problems\
    \ that arise in implementations of complex user interfaces. The entity template\
    \ plays the role of a Controller coordinating the field templates playing the\
    \ role of Views while the entity instance plays the role of a Model."
  merge: -1
  img_proc: true
- pgno: 365
  md: '# NOTE


    The MVC design pattern should not be confused with the ASP.NET MVC framework.
    The ASP.NET MVC framework is simply one of many possible implementations of the
    MVC pattern. The MVC framework is neither superior to other implementations, nor
    is it required to use to reap the benefits of the MVC pattern. Both the MVC framework
    and the approach described here are simply different tools that you can choose
    to solve various problems.


    # Summary


    Custom entity templates are ideal for implementing form layout when you want to
    provide the best possible user interface for a particular entity in your data
    model. Unfortunately, the entity template lookup rules combined with the built-in
    implementation of the dynamic entity templates forces you to create at least two
    versions of each custom template to implement a particular form layout in Edit,
    Insert, and Read-only modes. By combining the built-in dynamic entity templates
    in a single, multimode Default.aspx template, you enable creation of custom entity
    templates that support multiple modes as well as significantly reduce the amount
    of effort required to implement and maintain custom templates in general. A simple
    custom control, UnleashedLabel1, can be created to display field labels based
    on the metadata information and avoid hard-coding it in custom entity templates.


    Custom field templates are the best way to implement unique presentation requirements
    for a particular entity property, such as the Region property, one of several
    properties that store address information. You can configure public properties
    of both custom and general-purpose field templates declaratively by specifying
    custom attributes for the DynamicControl in template markup and programmatically
    by handling the Load event of the DynamicControl.


    The best place to implement interaction between field templates, such as the filtering
    of the list of Regions based on the Country value entered by the user, is in custom
    entity templates. This helps to maximize reuse of field templates and makes it
    easier to understand and maintain dependencies between field templates in the
    long term. The built-in implementation of DynamicControl and FieldTemplateUserControl
    classes provided by Dynamic Data requires accessing internal implementation details
    of individual field templates to determine the current field values and detect
    their changes. With simple extensions of these classes, such as the UnleashedControl
    and UnleashedFieldTemplate provided in the sample solution, you can improve encapsulation
    of the field template and make accessing field values easier.'
  merge: -1
  img_proc: true
