- pgno: 322
  md: "![](img/11b373b78859e17d318fd76939a0df9d_322_0.png)\n\nFIGURE 9.10 Custom error\
    \ generated for an expected database exception.\n\n# Implementing Validation Rules\
    \ in Triggers\n\nBy optimizing LINQ queries and performing validation checks only\
    \ when they are appropriate in the life cycle of the business entity, such as\
    \ validating that product inventory is sufficient only when the order status changes\
    \ from Draft to Submitted, you should be able to reach adequate performance in\
    \ most validation methods of your application. However, if you find that further\
    \ optimization is necessary, you can reimplement I/O-bound validation logic in\
    \ database triggers. Here is a trigger that implements the validation rule for\
    \ checking product inventory at the database level:\n\n```\nCREATE TRIGGER [Order_CheckOutOfStockProducts]\n\
    ON [dbo].[Orders] FOR INSERT, UPDATE AS\nBEGIN\nSET NOCOUNT ON;\n\nDECLARE @productName\
    \ NVARCHAR(50);\nSELECT @productName = product.ProductName\nFROM [Order Details]\
    \ AS item\nJOIN inserted ON item.OrderID = inserted.OrderID\nJOIN Products AS\
    \ product ON item.ProductID = product.ProductID\nWHERE inserted.OrderStatus =\
    \ 1\n  AND product.UnitsInStock < item.Quantity;\n```"
  merge: -1
  img_proc: true
- pgno: 323
  md: "```\nIF @productName <> null\nBEGIN\n    DECLARE @errorMessage NVARCHAR(MAX)\
    \ = @productName + ' is out of stock';\n    RAISERROR (@errorMessage, 11, 0);\n\
    END;\nEND;\n```\n\nJust like the last version of the Order validation logic that\
    \ was implemented using LINQ in the application code, this T-SQL code executes\
    \ a single query, joining the Order Details and the Products tables to find order\
    \ items for products out of stock. The only notable difference in the query logic\
    \ is the use of the inserted pseudo-table, which in this trigger provides access\
    \ to the rows of the Orders table that were inserted or updated. The query sets\
    \ the @productName variable with the name of an out-of-stock product, and the\
    \ trigger calls the RAISERROR system function if any such products are found.\n\
    \nThe first parameter of RAISERROR is the error message that will be reported\
    \ to the application. The second parameter, severity, indicates the type of error.\
    \ Severity values between 11 and 16 indicate user errors and throw a SqlException\
    \ in .NET applications. The third parameter, state, provides additional information\
    \ about where the error has occurred, and you can simply use zero, if you don't\
    \ plan to use it.\n\nCustom validation errors implemented this way can be handled\
    \ similarly to the built-in errors, such as the UNIQUE KEY and FOREIGN KEY constraint\
    \ violations discussed earlier. All that is needed is to change the HandleSqlException\
    \ method of the NorthwindEntities class, as shown next, to handle the SqlException\
    \ instances thrown by RAISERROR:\n\n```\nprivate static void HandleSqlException(Exception\
    \ e)\n{\n    SqlException error = e.InnerException as SqlException;\n    if (error\
    \ != null)\n    {\n        if (error.Number == 547)\n            HandleReferenceConstraintViolation(error);\n\
    \        else if (error.Number == 2627)\n            HandleUniqueKeyConstraintViolation(error);\n\
    \        else if (error.Number >= 50000 && error.Class <= 16)\n            throw\
    \ new ValidationException(error.Message);\n    }\n}\n```\n\nThe HandleSqlException\
    \ method wraps all SqlException instances with error codes 50000 and above and\
    \ severity levels 16 and below in ValidationException instances. These error codes\
    \ and severity levels distinguish the user errors reported by calling RAISERROR\
    \ from informational messages and system errors. Informational messages have severity\
    \ level 10 or lower and do not throw a SqlException. System errors have severity\
    \ level 17 or higher, and although they also throw SqlException, system errors\
    \ are not expected during normal execution of the application and thus should\
    \ not be reported as validation errors."
