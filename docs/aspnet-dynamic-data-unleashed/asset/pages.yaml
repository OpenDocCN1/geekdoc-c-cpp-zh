- pgno: 388
  md: "# NOTE\n\nRemember that by using the UIHintAttribute, you add presentation\
    \ logic to the business layer of your application. Although placing business logic\
    \ code in the code-behind files of a web application clearly is undesirable as\
    \ it quickly leads to code duplication and makes automated testing difficult,\
    \ combining presentation and business models is not necessarily a bad idea. You\
    \ could argue that consistently using a UIHint instead of a DataType annotation\
    \ helps to clarify your design intent in the model—a tangible benefit. However,\
    \ every time you use the UIHint annotation, more and more of the presentation\
    \ logic is mixed in with the business logic, making the model more complex. Use\
    \ this as an opportunity to stop and consider whether creating a custom page or\
    \ template for the given entity and separating the presentation logic from the\
    \ business model would make the overall design simpler and easier to maintain.\n\
    \n# Specifying Field Template Parameters\n\nAs discussed in Chapter 10, DynamicControl\
    \ can initialize custom properties of field templates using matching attributes\
    \ specified in markup. As an example, the built-in Text_Edit field template was\
    \ extended with a custom Columns property that can be used to set the Columns\
    \ property of the TextBox control it contains. If you had created a custom entity\
    \ or page template for the Employee entity, you could make the Address text box\
    \ wider and accommodate longer addresses by using the following markup:\n\n```\n\
    <asp:DynamicControl runat=\"server\" DataField=\"Address\" Columns=\"65\" />\n\
    ```\n\nThe UIHintAttribute also supports custom property values. They are exposed\
    \ for consumption via its ControlParameters property, which returns an IDictionary<string,\
    \ object>, and have to be specified as a sequence of names and values in the UIHintAttribute\
    \ constructor, following the hint and presentation layer parameters. It is easier\
    \ to explain this with an example; following is how you could specify the Columns\
    \ parameter for the Address property in the metadata:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    private abstract class Metadata\n    {\n      \
    \  [UIHint(\"Text\", \"WebForms\", \"Columns\", 65)]\n        public object Address\
    \ { get; set; }\n    }\n}\n```\n\nIn this example, \"Text\" is the hint, the name\
    \ of a field template; \"WebForms\" is the name of the presentation layer for\
    \ which the UIHint is intended; and \"Columns\" is the name of the first control\
    \ parameter followed by 65, its value. The UIHintAttribute constructor has"
  merge: -1
  img_proc: true
- pgno: 389
  md: "an open-ended array as its last argument, so if you needed to specify additional\
    \ control parameters, you would simply add more names and values to this list.\n\
    \n# NOTE\n\n> Specifying \"WebForms\" as the presentation layer in the UIHintAttribute\
    \ constructor is only required when you need separate UIHint annotations for different\
    \ presentation frameworks, such as MVC and WebForms, for the same property. In\
    \ that case, Dynamic Data picks the UIHint where the presentation layer is specified\
    \ as \"WebForms\". Otherwise, it uses the UIHint for \"MVC\" or the one where\
    \ the presentation layer is not specified. If you are not planning to use UIHint\
    \ annotations with multiple platforms, leaving it null might be the best option.\n\
    \nUnfortunately, the built-in DynamicControl does not support custom control parameters\
    \ specified in the UIHintAttribute the way it supports its own custom attributes\
    \ specified in markup. However, you can easily work around this limitation by\
    \ extending the dynamic entity templates. As discussed in Chapter 4, \"Entity\
    \ Templates,\" and later in Chapter 10, the dynamic entity templates rely on the\
    \ Init event handler to initialize each DynamicControl it creates. Extending this\
    \ event handler is the simplest way to implement support for custom parameters.\
    \ Here is how you can extend the Init event handler implemented in Default.aspx.cs,\
    \ the code-behind file of the combined entity template created in Chapter 10:\n\
    \n```\n```csharp\nprotected void DynamicControl_Init(object sender, EventArgs\
    \ e)\n{\n    var dynamicControl = (DynamicControl)sender;\n    dynamicControl.DataField\
    \ = this.currentColumn.Name;\n    dynamicControl.Mode = this.Mode;\n    dynamicControl.ValidationGroup\
    \ = this.ValidationGroup;\n\n    var hint = this.currentColumn.Attributes.OfType<UIHintAttribute>()\n\
    \        .FirstOrDefault();\n    if (hint != null)\n    {\n        foreach (KeyValuePair<string,\
    \ object> p in hint.ControlParameters)\n            dynamicControl.SetAttribute(p.Key,\
    \ p.Value.ToString());\n    }\n}\n```\n```\n\nThe new code (indicated by bold\
    \ font) tries to find a UIHintAttribute applied to the current column (a MetaColumn\
    \ object describing an entity property for which a field template needs to be\
    \ created). If the attribute was found, it uses the names and values in the ControlParameters\
    \ dictionary to set custom attributes for the DynamicControl. The DynamicControl,\
    \ which has not created the field template yet, takes care of the rest and"
  merge: -1
  img_proc: true
- pgno: 390
  md: "uses the custom attribute values to set the public properties defined by the\
    \ field template class, like the Columns property defined by the Text_Edit field\
    \ template. Figure 11.7 shows how the Address text box, dynamically configured\
    \ by this code, is now much wider than text boxes for other string properties.\n\
    \n![](img/11b373b78859e17d318fd76939a0df9d_390_0.png)\n\nFIGURE 11.7 Address TextBox\
    \ with Columns parameter.\n\n# Extending Dynamic Data to Support Control Parameters\n\
    \nAlthough the current solution allows you to continue evolving the Employee form\
    \ with metadata, at some point, you might need to create a custom entity or page\
    \ template. In a custom template, having to specify the Init event handler for\
    \ every DynamicControl instance becomes a nuisance you would rather avoid. You\
    \ also have a problem with the dynamic list pages that display data with the help\
    \ of GridView control because it does not offer an easy way to access the DynamicControl\
    \ instances.\n\nThis section shows how the Dynamic Data controls can be extended\
    \ to implement consistent support for metadata-driven control parameters.\n\n\
    # Extending DynamicControl to Support Control Parameters\n\nThe UnleashedControl\
    \ was introduced in Chapter 10 to encapsulate some of the functionality necessary\
    \ to implement field template interaction. You can further extend it to support\
    \ control parameters. Here is an extract from UnleashedControl.cs (without the\
    \ rest of the implementation reviewed in Chapter 10, which is not relevant to\
    \ this discussion):\n\n```\nprotected override void OnInit(EventArgs e)\n{\n \
    \   // ...\n    this.Init += this.InitializeControlParameters;\n    base.OnInit(e);\n\
    \    // ...\n}\n\nprivate void InitializeControlParameters(object sender, EventArgs\
    \ args)\n{\n    MetaColumn column = this.Column ?? this.Table.GetColumn(this.DataField);\n\
    \    var hint = column.Attributes.OfType<UIHintAttribute>().FirstOrDefault();\n\
    \    if (hint != null)\n    {\n        foreach (KeyValuePair<string, object> p\
    \ in hint.ControlParameters)\n```"
  merge: -1
  img_proc: true
- pgno: 391
  md: "```\nthis.SetAttribute(p.Key, p.Value.ToString());\n}\n}\n```\n\nNotice that\
    \ you cannot implement this logic directly in the overridden OnInit method of\
    \ the UnleashedControl. On one hand, you do not know which entity property this\
    \ control represents before the inherited OnInit method is called because the\
    \ Init event handler in the dynamic entity template has not had a chance to initialize\
    \ the DataField property yet. On the other hand, after the inherited OnInit method\
    \ is finished, the field template has already been created, and calling the SetAttribute\
    \ method will have no effect. To solve this problem, the custom attributes are\
    \ set in the InitializeControlParameters method. This method is added as the last\
    \ handler to the Init event, which fires at the appropriate moment—after the initialization\
    \ code in the dynamic entity templates but before the field template is created.\n\
    \nAlthough implementing initialization of field template parameters in the UnleashedControl\
    \ is a little more involved, it offers a better encapsulation and allows you to\
    \ simplify the implementation of the default entity template. This becomes more\
    \ important as you begin implementing additional dynamic entity templates later\
    \ in this chapter. Consider the final version of the Default.ascx entity template\
    \ in Listing 11.4.\n\n# LISTING 11.4 Final Version of Default Entity Template\
    \ (Markup)\n\n```\n<%@ Control Language=\"C#\" CodeBehind=\"Default.ascx.cs\"\
    \ \nInherits=\"WebApplication.DynamicData.EntityTemplates.DefaultEntityTemplate\"\
    \ %>\n<table class=\"DDDetailsTable\">\n  <asp:EntityTemplate runat=\"server\"\
    \ ID=\"entityTemplate\">\n    <ItemTemplate>\n      <tr>\n        <td class=\"\
    DDLightHeader\">\n          <unl:UnleashedLabel runat=\"server\" OnInit=\"Label_Init\"\
    \ />\n        </td>\n        <td>\n          <unl:UnleashedControl runat=\"server\"\
    \ OnInit=\"DynamicControl_Init\" />\n        </td>\n      </tr>\n    </ItemTemplate>\n\
    \  </asp:EntityTemplate>\n</table>\n```\n\nBecause the UnleashedControl and UnleashedLabel\
    \ (also introduced in Chapter 10) controls are designed to work with minimum configuration\
    \ in both custom and dynamic entity templates, you only need to initialize their\
    \ respective DataField properties with the name of the entity property for which\
    \ the controls are being generated. The controls"
