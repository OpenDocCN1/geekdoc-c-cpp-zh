- pgno: 70
  md: "```\nvar query = from c in context.Customers\n    join s in context.Suppliers\
    \ on c.City equals s.City\n    select new {\n        c.City,\n        Customer\
    \ = c.CompanyName,\n        Supplier = s.CompanyName\n    };\nforeach (var item\
    \ in query)\n    Console.WriteLine(item.City + \" \" + item.Customer + \" \" +\n\
    \        item.Supplier);\n```\n\nThe example just displayed uses the join keyword,\
    \ which mimics the JOIN operator introduced by the SQL-92 standard. You can also\
    \ use syntax that resembles the “old-style” joins as well:\n\n```\nvar query =\
    \ from c in context.Customers\n    from s in context.Suppliers\n    where c.City\
    \ == s.City\n    select new {\n        c.City,\n        Customer = c.CompanyName,\n\
    \        Supplier = s.CompanyName\n    };\n```\n\n# Composing Queries\n\nAn additional\
    \ benefit of having LINQ queries compiled in LINQ expressions is that they can\
    \ be further modified before execution. This is often beneficial when constructing\
    \ a query based on options specified by the user.\n\n```\nstring city = \"London\"\
    ;\nbool sortByContactName = true;\n\nvar query = from c in context.Customers select\
    \ c;\n\nif (city != null)\n    query = from c in query where c.City == city select\
    \ c;\n\nif (sortByContactName)\n    query = from c in query orderby c.ContactName\
    \ select c;\nelse\n    query = from c in query orderby c.CompanyName select c;\n\
    \nforeach(Customer c in query)\n    Console.WriteLine(c.CompanyName + \" \" +\
    \ c.ContactName);\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "In this example, the query returns Customer objects dynamically, based on the\
    \ values of two variables. The values are hard-coded here for simplicity, but\
    \ in a real application they would be entered by a user.\n\nLINQ allows any IQueryable\
    \ to appear in the from part of another query, and this code takes advantage of\
    \ this to augment the original query with additional operators. Notice that the\
    \ original query simply returns all customers. If the city parameter is specified,\
    \ the code adds a where clause to filter customers based on the specified value\
    \ and replaces the original query. You can also sort the query results based on\
    \ the value of the sortByContactName variable—by ContactName if it is true or\
    \ by CompanyName if it is false.\n\nBecause of the delayed execution, the final\
    \ query is sent to the database only once, when the foreach statement enumerates\
    \ it after all of the query modifications have been made. Composing LINQ queries\
    \ in this fashion allows you to create the most specific query required for your\
    \ scenario and helps to ensure its correctness, thanks to the thorough validation\
    \ performed by the C# compiler.\n\n> **NOTE**\n> \n> It is also possible to create\
    \ LINQ queries dynamically, from strings that contain property names and operators.\
    \ Chapter 5, “Filter Templates,” provides a detailed discussion on this topic.\n\
    \n# SQL Translation\n\nThe Entity Framework translates LINQ queries into actual\
    \ SQL statements based on the information in the data model and sends them for\
    \ execution to the database server. Because LINQ query syntax is significantly\
    \ different from SQL syntax, you might find it helpful to see the actual SQL statements\
    \ your Entity Framework application executes.\n\nThe easiest and least obtrusive\
    \ way to do this with Microsoft SQL Server is by using the SQL Server Profiler,\
    \ which is as part of the Management Tools—Complete feature you can select during\
    \ SQL client installation. Alternatively, you can change your application code\
    \ to do it as well.\n\n```\nvar query = from c in context.Customers\n        \
    \    where c.City == \"London\"\n            orderby c.CompanyName\n         \
    \   select c;\nObjectQuery objectQuery = (ObjectQuery)query;\nConsole.WriteLine(objectQuery.ToTraceString());\n\
    ```\n\nThe IQueryable objects produced by the C# compiler when compiling LINQ\
    \ to Entities queries are actually of the type ObjectQuery. This class is provided\
    \ by the Entity Framework and offers a ToTraceString method that can be used to\
    \ get the actual SQL statement to which the LINQ query will be translated. The\
    \ LINQ query in the example just shown is translated into the SQL statement shown\
    \ next. Although slightly more"
  merge: -1
  img_proc: true
- pgno: 72
  md: "verbose than a typical hand-written SQL would be, it is recognizable and easy\
    \ enough to read:\n\n```\nSELECT\n[Extent1].[CustomerID] AS [CustomerID],\n[Extent1].[CompanyName]\
    \ AS [CompanyName],\n[Extent1].[ContactName] AS [ContactName],\n[Extent1].[ContactTitle]\
    \ AS [ContactTitle],\n[Extent1].[Address] AS [Address],\n[Extent1].[City] AS [City],\n\
    [Extent1].[Region] AS [Region],\n[Extent1].[PostalCode] AS [PostalCode],\n[Extent1].[Country]\
    \ AS [Country],\n[Extent1].[Phone] AS [Phone],\n[Extent1].[Fax] AS [Fax]\nFROM\
    \ [dbo].[Customers] AS [Extent1]\nWHERE N'London' = [Extent1].[City]\nORDER BY\
