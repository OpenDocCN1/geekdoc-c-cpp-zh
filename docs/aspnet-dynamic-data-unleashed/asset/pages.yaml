- pgno: 108
  md: 'The Edit field templates are significantly more complex than their read-only
    counterparts. Consider Listing 3.5, which shows the Edit version of the DateTime
    field template.


    # LISTING 3.5 DateTime_Edit Field Template (Markup)


    ```

    <%@ Control Language="C#" CodeBehind="DateTime_Edit.ascx.cs" Inherits="WebApplication.DynamicData.FieldTemplates.DateTime_EditField"
    %>


    <asp:TextBox ID="textBox" runat="server" Text=''<%# FieldValueEditString %>''
    Columns="20" />


    <asp:RequiredFieldValidator runat="server" ID="requiredFieldValidator" ControlToValidate="textBox"
    Enabled="false" />

    <asp:RegularExpressionValidator runat="server" ID="regularExpressionValidator"
    ControlToValidate="textBox" Enabled="false" />

    <asp:DynamicValidator runat="server" ID="dynamicValidator" ControlToValidate="textBox"
    />


    <asp:CustomValidator runat="server" ID="dateValidator" ControlToValidate="textBox"
    EnableClientScript="false" Enabled="false" OnServerValidate="DateValidator_ServerValidate"
    />

    ```


    In addition to the data entry control, the edit field templates typically have
    one or more validation controls. The DateTime_Edit template includes a RequiredFieldValidator,
    a RegularExpressionValidator, a DynamicValidator, and a CustomValidator control.
    Notice that with the exception of the DynamicValidator, these controls are not
    enabled by default. They are configured dynamically by the Page_Load event handler
    defined in the code-behind file shown in Listing 3.6.


    Each validator control is configured by a call to the SetUpValidator method of
    the FieldTemplateUserControl base class. This method enables and configures the
    validator if the column metadata contains an appropriate data annotation attribute.
    In particular, the RequiredFieldValidator will be enabled when the column is marked
    with a RequiredAttribute that does not allow empty strings, and the RegularExpressionValidator
    will be enabled when the column is marked with a RegularExpressionAttribute. In
    addition to enabling the validator, the SetUpValidator method also assigns its
    ErrorMessage and ToolTip properties with an error message either explicitly specified
    in the data annotation attribute or generated based on the column''s display name.


    DynamicValidator is a special validation control provided by Dynamic Data. It
    ensures all validation attributes applied to the column are invoked to verify
    its value is correct. This andincludes not only the well-known RequiredAttribute,
    RangeAttribute, and CustomValidationAttribute, but also all other descendants
    of the ValidationAttribute that may be applied to the column and are not covered
    by a specific ASP.NET validator control in this field template.'
  merge: -1
  img_proc: true
- pgno: 109
  md: "The CustomValidator control in this field template performs the job you would\
    \ normally expect the DataTypeAttribute to do. Even though DataTypeAttribute inherits\
    \ from the ValidationAttribute class, it does not actually perform any validation.\
    \ Its IsValid method always returns true, which is why the DateTime_Edit template\
    \ uses the CustomValidator control to ensure that the value entered by the user\
    \ matches the type specified by the DataTypeAttribute. The SetupCustomValidator\
    \ method enables the validator if the column was marked with a DataTypeAttribute\
    \ and the DateValidator_ServerValidate method performs the actual validation.\n\
    \n# LISTING 3.6 DateTime_Edit Field Template (Code-Behind)\n\n```\n```csharp\n\
    using System;\nusing System.Collections.Specialized;\nusing System.ComponentModel.DataAnnotations;\n\
    using System.Web;\nusing System.Web.DynamicData;\nusing System.Web.UI;\nusing\
    \ System.Web.UI.WebControls;\n\nnamespace WebApplication.DynamicData.FieldTemplates\n\
    {\n    public partial class DateTime_EditField : FieldTemplateUserControl\n  \
    \  {\n        private static DataTypeAttribute DefaultDateAttribute =\n      \
    \      new DataTypeAttribute(DataType.DateTime);\n\n        public override Control\
    \ DataControl\n        {\n            get { return this.textBox; }\n        }\n\
    \n        protected void Page_Load(object sender, EventArgs e)\n        {\n  \
    \          this.textBox.ToolTip = this.Column.Description;\n\n            this.SetupValidator(this.requiredFieldValidator);\n\
    \            this.SetupValidator(this.regularExpressionValidator);\n         \
    \   this.SetupValidator(this.dynamicValidator);\n            this.SetupCustomValidator(this.dateValidator);\n\
    \        }\n\n        protected override void ExtractValues(IOrderedDictionary\
    \ dictionary)\n        {\n            dictionary[Column.Name] = this.ConvertEditedValue(this.textBox.Text);\n\
    \        }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 110
  md: "# LISTING 3.6 Continued\n\n```\n```csharp\nprotected void DateValidator_ServerValidate(object\
    \ source,\n    ServerValidateEventArgs args)\n{\n    DateTime dummyResult;\n \
    \   args.IsValid = DateTime.TryParse(args.Value, out dummyResult);\n}\n\nprivate\
    \ void SetUpCustomValidator(CustomValidator validator)\n{\n    if (this.Column.DataTypeAttribute\
    \ != null)\n    {\n        switch (this.Column.DataTypeAttribute.DataType)\n \
    \       {\n            case DataType.Date:\n            case DataType.DateTime:\n\
    \            case DataType.Time:\n                this.EnableCustomValidator(validator,\
    \ this.Column.DataTypeAttribute);\n                break;\n        }\n    }\n\
    \    else if (this.Column.ColumnType.Equals(typeof(DateTime)))\n    {\n      \
    \  this.EnableCustomValidator(validator, DefaultDateAttribute);\n    }\n}\n\n\
    private void EnableCustomValidator(CustomValidator validator,\n    DataTypeAttribute\
    \ attribute)\n{\n    validator.Enabled = true;\n    validator.ErrorMessage = HttpUtility.HtmlEncode(\n\
    \        attribute.FormatErrorMessage(this.Column.DisplayName));\n}\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Field Value Edit Format


    You might have noticed that the `DateTime_Edit` template uses the `FieldValueEditString`
    property of the `FieldTemplateUserControl` base class. This property is similar
    to the `FieldValueString` property discussed earlier in that it respects the `FormattingOptions`
    when converting the raw column value to a display string. However, it was specifically
    designed for use in the Edit mode templates, and an additional property is used
    to control its behavior.


    +   - ApplyFormatInEditMode is a Boolean value that determines whether the DataFormatString,
    NullDisplayText, ConvertEmptyStringToNull, and HtmlEncode display format properties
    will be used in Edit mode. This property is false by default.


    Similar to using the FieldValueString property when implementing Read-only field
    templates, it is also important to rely on the FieldValueEditString property as
    much as possible when implementing the Edit and Insert mode templates. This helps
    the field templates to behave consistently and allow the application developers
    to change presentation aspects of column values using metadata attributes as well
    as explicit configuration in page markup.


    # Changing Existing Field Template


    Dynamic Data uses the same field template for all matching columns in the model.
    The `DateTime_Edit` field template is automatically used for all columns of type
    DateTime in the Northwind data model, including OrderDate, RequiredDate, and ShippedDate
    columns of the Order table as well as BirthDate and HireDate columns of the Employee
    table. By changing definition of the field template, you affect all web pages
    where it is used. Figure 3.2 shows how the experience of entering date values
    can be improved by allowing the users to select a date from a calendar drop-down.'
