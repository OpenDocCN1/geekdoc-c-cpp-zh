- pgno: 320
  md: "This error message contains technical terms, such as the table name, as opposed\
    \ to the business terms used by the application user interface. It also does not\
    \ explain what a “duplicate key” means for Products—is it the Product Name alone,\
    \ a Product Name from a particular Supplier, or perhaps a Product Name within\
    \ a particular Category? And last, but not least, it reveals the low-level technical\
    \ details that can help an attacker access the database directly.\n\nDetailed\
    \ metadata information about database constraints, such as which columns constitute\
    \ a particular UNIQUE KEY, is available in the SQL Server database itself. You\
    \ could extract it with the help of the SQL Server Management Objects API provided\
    \ in the Microsoft.SqlServer.Smo assembly by the SQL Server client. Knowing the\
    \ database columns, you could then use the Entity Framework mapping schema to\
    \ determine the entity properties mapped to these columns and then determine their\
    \ display names with the help of the TypeDescriptor.\n\nAs you can imagine, the\
    \ metadata-driven approach requires a lot of work. In addition to using the metadata\
    \ APIs for both SQL Server and Entity Framework, you would have to parse the Entity\
    \ Framework mapping schema (MSL) in raw XML form because it has no public API\
    \ at this time. Even if you go through all this trouble, the resulting error message\
    \ you could generate automatically will probably be very technical, dry, and difficult\
    \ for business users to understand. Instead, you can display a custom error message\
    \ when a particular database constraint is violated, which is both easier to implement\
    \ and provides more meaningful messages to the users.\n\n> **NOTE**\n> \n> Because\
    \ database error messages are application-specific, the sample solution accompanying\
    \ this book implements them in the NorthwindEntities class (application) and not\
    \ in the UnleashedObjectContext base class (infrastructure).\n\n```\nstatic readonly\
    \ Dictionary<string, ValidationResult> ConstraintErrors =\n    new Dictionary<string,\
    \ ValidationResult>()\n    {\n        { \"UK_Products\", new ValidationResult(\n\
    \            \"Product Name must be unique.\", new string[] { \"ProductName\"\
    \ } ) },\n        { \"FK_Order_Details_Products\", new ValidationResult(\n   \
    \         \"Product is referenced in one or more Orders and\"+\n            \"\
    cannot be deleted.\") }\n    };\n```\n\nConstraintErrors is a static dictionary,\
    \ defined in the NorthwindEntities class to store constraint names and ValidationResult\
    \ objects that represent their violation errors. A ValidationResult object allows\
    \ you to not only provide a meaningful error message, but also associate it with\
    \ a particular property, such as the ProductName, which the DynamicValidator controls\
    \ can use to display an asterisk next to the offending field"
