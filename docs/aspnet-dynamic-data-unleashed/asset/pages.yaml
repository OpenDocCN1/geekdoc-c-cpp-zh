  md: "# LISTING 6.7 Insert Page Template (Markup)\n\n```\n<%@ Page Language=\"C#\"\
    \ MasterPageFile=\"~/Site.master\" CodeBehind=\"Insert.aspx.cs\" Inherits=\"WebApplication.DynamicData.PageTemplates.Insert\"\
    \ %>\n\n<asp:Content ContentPlaceHolderID=\"main\" runat=\"Server\">\n    <asp:DynamicDataManager\
    \ runat=\"server\">\n        <DataControls>\n            <asp:DataControlReference\
    \ ControlID=\"formView\" />\n        </DataControls>\n    </asp:DynamicDataManager>\n\
    \    <h2>Add new entry to table <%= table.DisplayName %></h2>\n\n    <asp:UpdatePanel\
    \ runat=\"server\">\n        <ContentTemplate>\n            <asp:ValidationSummary\
    \ runat=\"server\" HeaderText=\"List of validation errors\"/>\n            <asp:DynamicValidator\
    \ runat=\"server\" ControlToValidate=\"formView\" Display=\"None\" />\n\n    \
    \        <asp:FormView runat=\"server\" ID=\"formView\" DataSourceID=\"dataSource\"\
    \ DefaultMode=\"Insert\" OnItemCommand=\"FormView_ItemCommand\" OnItemInserted=\"\
    FormView_ItemInserted\">\n                <InsertItemTemplate>\n             \
    \       <asp:DynamicEntity runat=\"server\" Mode=\"Insert\" />\n             \
    \       <div class=\"DDFormActions\">\n                        <asp:LinkButton\
    \ runat=\"server\" CommandName=\"Insert\" Text=\"Insert\" />\n               \
    \         <asp:LinkButton runat=\"server\" CommandName=\"Cancel\" Text=\"Cancel\"\
    \ CausesValidation=\"false\" />\n                    </div>\n                </InsertItemTemplate>\n\
    \            </asp:FormView>\n\n            <asp:EntityDataSource ID=\"dataSource\"\
    \ runat=\"server\" EnableInsert=\"true\" />\n        </ContentTemplate>\n    </asp:UpdatePanel>\n\
    </asp:Content>\n```\n\nThe most important difference between the code-behinds\
    \ of the Insert (see Listing 6.8) and Edit (see Listing 6.4) page templates is\
    \ the additional initialization step the Insert page templates performs for the\
    \ FormView control. Just like the List page template, it extracts the names and\
    \ values of the entity properties from the request URL and associates them with\
    \ the FormView control by calling the SetMetaTable extension method. The field\
    \ templates generated by the DynamicEntity control use this information to provide\
    \ default field values in their data entry controls. The FieldValue and FieldValueEditString\
    \ properties of the FieldTemplateUserControl class respect the default values\
    \ associated with"
