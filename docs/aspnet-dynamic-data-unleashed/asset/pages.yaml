  img_proc: true
- pgno: 84
  md: "retrieves and manipulates a relatively small number of entities at a time.\
    \ However, web applications and applications working with large numbers of entities\
    \ in batch mode can increase performance by disabling the change tracking and\
    \ identity management as shown here:\n\n```\n```csharp\ncontext.Products.MergeOption\
    \ = MergeOption.NoTracking;\n```\n```\n\n```\n```csharp\nvar chaiQuery = from\
    \ p in context.Products\n    where p.ProductName == \"Chai\"\n    select p;\n\
    ```\n```\n\nThe MergeOption property is defined in the ObjectQuery<T> base class\
    \ and thus can be specified for the Products ObjectSet. It affects all entities\
    \ returned by the query, which in this case includes only Product entities. The\
    \ NoTracking value instructs the ObjectContext to bypass the identity and property\
    \ value tracking for the query results, which can be illustrated by running the\
    \ following code:\n\n```\n```csharp\nProduct chai1 = chaiQuery.First();\nProduct\
    \ chai2 = chaiQuery.First();\nif (!object.ReferenceEquals(chai1, chai2))\n   \
    \ Console.WriteLine(\"chai1 and chai2 are different objects\");\n```\n```\n\n\
    When running this code, notice that chai1 and chai2, initialized by two different\
    \ executions of the same query, are actually two different objects. Had you not\
    \ modified the MergeOption for this query, the object context would have detected\
    \ that the Chai entity had already been retrieved and returned the same entity\
    \ for both query executions.\n\n# Entity Model in Depth\n\nThe Entity Model consists\
    \ of three different sections, each describing a separate aspect of the model.\
    \ This is best illustrated by opening a newly created EDMX file in a text editor.\
    \ When stripped of actual content, it looks similar to this:\n\n```\n```xml\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<Edmx Version=\"2.0\" xmlns=\"http://schemas.microsoft.com/ado/2008/10/edmx\"\
    >\n    <Runtime>\n        <StorageModels/>\n        <ConceptualModels/>\n    \
    \    <Mappings/>\n    </Runtime>\n</Edmx>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: '# NOTE


    The EDMX files contain plain XML and work well with most modern source control
    systems. However, unless you are working on a trivial project with just a handful
    of tables and only one developer, eventually you will need to look at the EDMX
    in its raw XML form instead of relying on the Entity Designer. If you have multiple
    developers on your team, at some point you will need to merge the changes made
    by different developers at the same time, and even if you are the only developer
    working with the EDMX, it is always a good idea to review changes made by the
    Update Wizard in a large model before checking them in. For these reasons, it
    is important for developers to be familiar with the entity model XML schema, which
    is why some of its concepts are introduced here.


    The *storage model* describes the database schema as it was captured by the Entity
    Designer last time when the Update Wizard was used to update model from the database.
    It includes definitions of tables and their foreign key relationships, as well
    as views and stored procedures. You can examine the storage model with the help
    of the Model Browser, a tool window you can open by right-clicking the surface
    of the Entity Designer and selecting Model Browser from the context menu. Figure
    2.9 shows an example of the storage model definition of the Products table.


    ![](img/11b373b78859e17d318fd76939a0df9d_85_0.png)


    FIGURE 2.9 Storage model.


    The raw XML definition of the Products table looks similar to what''s shown next.
    The Property elements define the individual columns, and Key element includes
    PropertyRef elements for all columns in the primary key:'
  merge: -1
  img_proc: true
- pgno: 86
  md: "```\n<EntityType Name=\"Products\">\n  <Key>\n    <PropertyRef Name=\"ProductID\"\
    \ />\n  </Key>\n  <Property Name=\"ProductID\" Type=\"int\" Nullable=\"false\"\
    \ StoreGeneratedPattern=\"Identity\" />\n  <Property Name=\"ProductName\" Type=\"\
    nvarchar\" Nullable=\"false\" MaxLength=\"40\" />\n  <Property Name=\"SupplierID\"\
    \ Type=\"int\" />\n  <Property Name=\"CategoryID\" Type=\"int\" />\n  <Property\
    \ Name=\"QuantityPerUnit\" Type=\"nvarchar\" MaxLength=\"20\" />\n  <Property\
    \ Name=\"UnitPrice\" Type=\"money\" />\n  <Property Name=\"UnitsInStock\" Type=\"\
    smallint\" />\n  <Property Name=\"UnitsOnOrder\" Type=\"smallint\" />\n  <Property\
    \ Name=\"ReorderLevel\" Type=\"smallint\" />\n  <Property Name=\"Discontinued\"\
    \ Type=\"bit\" Nullable=\"false\" />\n</EntityType>\n```\n\nThe conceptual model\
    \ describes the entities from the application standpoint. You can also examine\
    \ the conceptual model using the Model Browser. It displays the conceptual model\
    \ at the top of the tree view (Figure 2.10 shows an example of the conceptual\
    \ model generated from the Northwind sample database). However, the Entity Designer,\
    \ which presents the conceptual model in a UML-like diagram, might be a better\
    \ option for working with the conceptual model, especially when the number of\
    \ entities is not large.\n\n![](img/11b373b78859e17d318fd76939a0df9d_86_0.png)\n\
    \nFIGURE 2.10 Conceptual model."
  merge: -1
