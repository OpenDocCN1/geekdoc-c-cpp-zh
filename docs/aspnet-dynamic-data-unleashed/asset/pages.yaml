    # Filtering Based on Related Entities


    Now that the building blocks are in place, let''s get back to the original goal
    of building a page that displays information from multiple entities. The earlier
    example you used the Parent field template, which allows displaying values from
    any property of a parent entity in the same GridView or DetailsView with its children.
    However, when building search screens, you often need to not only display, but
    also allow users to filter based on information from related entities. Consider
    the web page shown in Figure 12.4, which displays a list of products and their
    countries of origin. Although the product name comes from the ProductName property
    of the Product entity, the country of origin comes from the Country property of
    the Supplier entity. The Supplier and Product entities form a parent-child relationship,
    connected by the Supplier foreign key property of the Product entity.'
