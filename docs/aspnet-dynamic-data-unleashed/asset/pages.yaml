- pgno: 205
  md: 'generate a web page. Dynamic page templates typically rely on special controls,
    such as *DynamicEntity* and *DynamicFilter*, to generate user interface based
    on metadata information describing the entity type. When dynamically generated
    user interface is not sufficient, custom page templates can be used to create
    a unique user interface required for a particular entity type. Page templates
    do not replace the regular, custom ASP.NET web pages that still need to be used
    for screens such as home page, login, dashboards, and so on.


    Compared to the traditional multi-purpose WebForms pages, which tend to be verbose
    and have a large number of simple controls, Dynamic Data page templates are typically
    much smaller and rely on a number of advanced controls, such as *DynamicEntity*,
    *DynamicFilter*, and *QueryExtender*. By their nature, dynamic controls are much
    more abstract than the traditional TextBox and DropDownList and therefore can
    be harder to understand for developers who are new to Dynamic Data.


    *Dynamic* page templates work well for applications that need to display a large
    number of similar-looking pages, which tends to be the case for internal enterprise
    applications. *Custom* page templates, on the other hand, are better suited when
    unique functionality is required for a particular entity type, such as when implementing
    a public-facing web site.'
  merge: -1
