- pgno: 423
  md: '# UnleashedFilterRepeater


    The UnleashedFilterRepeater control is a replacement for the built-in QueryableFilterRepeater.
    As you recall from Chapter 6, this control is used by the List page template to
    automatically generate filters for all filterable properties of a given entity
    class. It allows you to define an ItemTemplate markup, typically containing a
    Label1 and a DynamicFilter controls that are dynamically instantiated for every
    filterable property. QueryableFilterRepeater control is responsible for initializing
    the DynamicFilter instances it generates. Because the UnleashedFilter is not related
    to the built-in DynamicFilter, the QueryableFilterRepeater cannot initialize it
    dynamically, which is why it had to be replaced with the UnleashedFilterRepeater.
    For compatibility, the replacement control defines both ItemTemplate and DynamicFilterContainerId
    properties that work exactly like they do in the QueryableFilterRepeater.


    Similarly to the UnleashedFilter, the UnleashedFilterRepeater class defines DataSource
    and Table properties, allowing you to configure it programmatically. It also does
    not rely on the Page events, which makes it possible to use inside of other filter
    templates.


    # UnleashedFilterExpression


    The UnleashedFilterExpression is a replacement for the built-in DynamicFilterExpression.
    As you recall from Chapters 5 and 6, this class is used in page markup to associate
    DynamicFilter and QueryableFilterRepeater controls with a QueryExtender control.
    DynamicFilterExpression is responsible for supplying the filter controls with
    the IQueryableDataSource instance (an EntityDataSource or LinqDataSource) received
    from the query extender. The DynamicFilterExpression works with the built-in controls
    and just like the controls themselves, does not allow extension by inheritance,
    forcing a complete replacement.


    # UnleashedFilterTemplate


    The UnleashedFilterTemplate base class is a replacement for the built-in QueryableFilterUserControl.
    Unlike the other filter classes, however, the QueryableFilterUserControl provides
    a fair amount of utility methods used in the enumeration and foreign key filter
    templates. As a compromise between quality of design and code reuse, the UnleashedFilterTemplate
    inherits from the QueryableFilterUserControl and exposes the properties and methods
    required for initialization via .NET Reflection.


    Using .NET Reflection in a web application is far from ideal. Aside from being
    fragile in face of potential future changes in the .NET framework, Reflection
    requires the web application to run in full-trust mode, which can be a problem
    in a shared hosting environment. If that is a concern, you might need to reimplement
    the QueryableFilterUserControl entirely.


    # Using Replacement Filter Controls


    The beginning of this section discussed several limitations in the implementation
    of the build-in DynamicFilter control, including its reliance on the Page events
    and lack of support for custom attributes and metadata-driven control parameters.
    In the next section,'
