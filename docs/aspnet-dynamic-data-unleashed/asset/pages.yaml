    \ it. When these errors are detected, the EntityDataSource control collects all\
    \ errors for a given entity object and throws the EntityDataSourceValidationException,\
    \ which implements the IDynamicValidatorException interface. In the presentation\
    \ layer, the DynamicValidator controls check all exceptions thrown by the data\
    \ source control, and if a particular exception implements the IDynamicValidatorException\
    \ interface, the validator controls use its InnerExceptions dictionary to find\
    \ exceptions that apply to the entity properties they validate.\n\nUnfortunately,\
    \ the IDynamicValidatorException is defined in the System.Web.Extensions assembly\
