    \        foreach (Order_Detail orderItem in orderItems)\n            orderItem.Product.UnitsInStock\
    \ -= orderItem.Quantity;\n    }\n}\n```\n\nAlthough the second version of the\
    \ FulfillOrder feels more “object-oriented” in that it takes an Order object as\
    \ a parameter instead of a primitive primary key value, your choice of design\
    \ approach should be driven by the concrete scenarios you need to implement. If\
    \ the orders will be marked as fulfilled one at a time from an ASP.NET web page,\
    \ and the calling code only has the primary key value stored in the ViewState\
    \ of the page, and the first version of the FulfillOrder method will work best.\
    \ The more elegant second version of the FulfillOrder method might work better\
    \ only in a scenario where *multiple* orders have already been loaded from the\
    \ database and the overhead of making an additional database call to retrieve\
    \ the order instance will not be incurred. In other words, the second style of\
    \ methods works better for implementing granular business rules that are a part\
    \ of a larger business process.\n\n> **NOTE**\n> \n> Implementing entity interaction\
    \ rules in object context methods and removing dependency on lazy loading helps\
    \ improve not only *performance*, but also *correctness* of the application. Unless\
    \ the code reliant on lazy loading explicitly checks that it is enabled, the lazy\
    \ loading option could be accidentally or intentionally turned off, making an\
    \ order appear empty when, in fact, its items and products simply have not been\
    \ loaded from the database.\n> \n> On the downside, implementing business rules\
    \ as context methods can feel awkward depending on where you think the method\
    \ belongs. For instance, if you feel strongly that fulfillment is the behavior\
    \ of the Order class, moving the Fulfill method to the NorthwindEntities class\
    \ would mean breaking its encapsulation."
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Implementing business rules as context methods works well with simple entity
    models where the amount of business logic is small. As the size and complexity
    of the model grows, the number of business rule methods reaches the point where
    maintaining them in a single class becomes problematic. When that happens, you
    can start extracting methods into separate classes to group them by entity type
    to which they apply (table modules) or business process they implement (services).
    However, it is best to avoid making this design decision too early in the development
    of the application. Without having a solid understanding of the business domain
    and required functionality, the premature architectural decisions are often wrong
    and lead to unnecessary complexity and increased cost.


    # Validation Rules


    As a form of business logic, validation rules are susceptible to many of the same
    potential problems. As the number of validation rules increases, complexity of
    the code grows rapidly and, if you are not careful, can have a significant impact
    on performance of the application as well as your ability to maintain it. Just
    like with the business logic in general, it helps to keep the validation rules
    simple and well encapsulated.


    To help understand validation rules, they can be separated in two large categories:


    +   - Persistence validation

    +   - Transition validation


    Rules in the persistence category determine conditions that an entity must meet
    to be successfully saved in the database. Most often, validation rules in this
    category apply to properties entered directly by the users of the application.
    For instance, a shipping address (ShipAddress, ShipCity, ShipRegion, and other
    properties) is required for an Order to be accepted by the Northwind Traders.


    Transition rules, on the other hand, determine conditions that allow an entity
    to change from one state to another. For instance, if the Northwind Traders Company
    requires customers to pre-pay their orders, an Order entity must have OrderStatus
    of Paid before it can change to Fulfilled. The OrderStatus property is different
    from the other properties of the Order entity in that it determines its current
    state.


    Entity states might not only have different transition rules; they often have
    different persistence rules as well. For instance, when saving an Order in Submitted
    state, you may want to validate that you have enough Products in stock for all
    items in the order; however, this rule does not apply to Fulfilled orders because
    you might keep them in your system for years after the boxes have left the warehouse.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Validation Rule Design


    To find a reasonable compromise between code reuse, complexity, and performance,
    without having to do a lot of refactoring later, try the following rules of thumb
    when designing validation logic in your application:


    +   - Implement persistence validation rules with data annotations

    +   - Make state properties of entities read-only

    +   - Implement state transitions and validation in business rule methods

    +   - Implement state-specific persistence validation in separate validation methods


    # Implement Persistence Validation Rules with Data Annotations


    The validation framework discussed in Chapter 8 offers a great way to implement
    persistence validation rules by applying pre-built validation attributes or writing
    custom validation methods for individual properties or entire entities. You can
    quickly apply the RequiredAttribute to the shipping address properties of the
    Order entity to ensure that the order is valid before saving it to the database.


    # Make State Properties of Entities Read-Only


    You do not want the users of your application (neither the customers nor the employees)
    to edit the OrderStatus property directly, even if they initiate the state transition.
    Customers will submit orders by clicking a Submit button on a check-out page,
    and a background process handling credit card payments will mark the orders as
    paid. The best way to ensure that state properties of an entity cannot be changed
    through the user interface of the application is to make them read-only.


    With Entity Framework, you can use the Entity Designer to make the setter of the
    OrderStatus property internal, as shown in Figure 9.7.'
  merge: -1
  img_proc: true
- pgno: 300
  md: "![](img/11b373b78859e17d318fd76939a0df9d_300_0.png)\n\nFIGURE 9.7 Changing\
    \ visibility of entity property setter.\n\nIn the code generated by the Entity\
    \ Designer, the OrderStatus property now looks similar to the following pseudo-code:\n\
    \n```\nproperty OrderStatus { get; internal set; }\n```\n\nChanging visibility\
    \ of a property setter to internal makes the property read-only outside of the\
    \ assembly where its class is defined. As a result, the presentation layer, the\
    \ WebApplication project in our sample, can continue using a read-only property\
    \ for display and filtering purposes. However, only the business logic layer,\
    \ the DataModel project in our sample, can change its value.\n\n> **NOTE**\n>\
    \ \n> Making state properties of entities read-only does not offer bulletproof\
    \ protection against malicious code. For instance, in a full-trust application,\
    \ this particular security block can be circumvented using Reflection. However,\
    \ combined with other security measures, some of which are discussed in Chapter\
    \ 14, “Implementing Security,” this approach helps to improve security of a well-written\
    \ application.\n\n# Implement State Transitions and Validation in Business Rule\
    \ Methods\n\nWhen state properties cannot be modified outside of the business\
    \ layer, validation of state transition can be separated from validation of entity\
    \ persistence. You can validate state transitions in the business rule methods,\
    \ leaving the responsibility for persistence validation to the entities.\n\nFor\
    \ example, because the OrderStatus property is now read-only, you do not need\
    \ to worry about somebody (a user) or something (incorrect code) changing it from\
    \ Fulfilled back to Paid when validating the Order entity. To ensure that an order\
    \ can be fulfilled only once, you can have the FulfillOrder method check that\
    \ the current OrderStatus is Paid:"
  merge: -1
  img_proc: true
- pgno: 301
  md: "```\npublic partial class NorthwindEntities\n{\n    public void FulfillOrder(int\
    \ orderId)\n    {\n        Order order = this.Orders\n            .Include(\"\
    Order_Details\").Include(\"Order_Details.Product\")\n            .First(o => o.Order_ID\
    \ == orderId);\n\n        if (order.OrderStatus != (byte)DataModel.OrderStatus.Paid)\n\
    \        {\n            throw new ValidationException(\n                new ValidationResult(\n\
    \                    \"Order status must be Paid for the order to be fulfilled\"\
    ,\n                    new[] { \"OrderStatus\" }),\n                null, order.OrderStatus);\n\
    \        }\n\n        order.OrderStatus = (byte)DataModel.OrderStatus.Fulfilled;\n\
    \        order.ShippedDate = DateTime.Now;\n        foreach (Order_Detail orderItem\
    \ in order.Order_Details)\n            orderItem.Product.UnitsInStock -= orderItem.Quantity;\n\
    \    }\n}\n```\n\nBusiness rule methods should report *expected* error conditions\
    \ consistently with the regular validation errors reported when entities are saved\
    \ to the database. Notice how in the example just shown, the `FulfillOrder` method\
    \ throws a `ValidationException` if the `OrderStatus` property of the order has\
    \ an unexpected value. This is important because you want to reuse the existing\
    \ infrastructure for error handling already implemented in the Dynamic Data web\
    \ pages.\n\nIt is equally as important to ensure that *unexpected* error conditions\
    \ are *not* reported as `ValidationException` instances. If something unexpected\
    \ happens, you want the application to fail fast, log detailed information on\
    \ the server, and display a generic error message to the user without revealing\
    \ any potentially exploitable technical information about the system. For instance,\
    \ if the `orderId` is incorrect and there is no matching order in the database,\
    \ the LINQ extension method `First` throws an `InvalidOperationException` saying,\
    \ “Sequence contains no elements.” This error should not occur under normal circumstances\
    \ and needs to be investigated by developers, so wrapping it in a `ValidationException`\
    \ would only make the problem harder to notice."
