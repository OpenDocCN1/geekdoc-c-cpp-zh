- pgno: 413
  md: '# CHAPTER 12


    # Building Custom Search Pages


    # IN THIS CHAPTER


    +   - Displaying Information from Related Entities

    +   - Building Custom Search Pages

    +   - Filtering Based on Related Entities


    Dynamic Data offers powerful and flexible building blocks for creating list pages
    and search screens—common features in most enterprise applications. As discussed
    in Chapter 6, "Page Templates," DynamicField can be used with the standard GridView
    control to quickly build pages that display data in tabular format. By relying
    on the same rich set of field templates used by the DynamicControl, the DynamicField
    allows you to significantly improve code reuse and create field templates for
    both list and single-item pages. The DynamicFilter along with the QueryExtender
    controls discussed in Chapter 5, "Filter Templates," can be used to quickly build
    powerful search screens that rely on an extensible set of filter templates and
    generate LINQ queries, translated by the Entity Framework to SQL statements and
    executed directly by the database servers.


    Although the data entry pages typically display information about a single entity,
    read-only pages in general and list pages in particular often need to combine
    information from several related entities on a single page. For instance, a product
    search page might need to display and allow users to search for products by the
    country of origin. In the Northwind Traders sample database, this means combining
    information from the Product and Supplier entities on the same screen because
    in this entity model, the product''s country is determined by the address of the
    supplier. In this chapter, you look at extending the capabilities of Dynamic Data
    to handle some of the common scenarios of working with related entities in list
    pages and search screens.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# Displaying Information from Related Entities


    The first example is a page that displays a list of items a customer previously
    ordered from the Northwind Traders website. For each item, the page displays name
    of the product, quantity, date of the order, and the order status. You can see
    how this page will look in Figure 12.1. Of course, in a real-world application,
    this page might also allow users to reorder items by clicking a link or selecting
    a check box next to each item. However, to keep the example simple, this particular
    functionality is not implemented.


    ![](img/11b373b78859e17d318fd76939a0df9d_414_0.png)


    FIGURE 12.1 List page with columns from multiple related entities.


    This page displays properties of three related entities: Order_Detail, Product,
    and Order. As you can see by looking at the Northwind entity model, the Order_Detail
    entity has two foreign key (also known as navigation) properties called Product
    and Order that point to the respective parent entities. On the sample page in
    the figure, the first column displays the ProductName property of the parent Product
    entity, and the last two columns display the OrderDate and OrderStatus properties
    of the parent Order entity.


    Consider how this page could be implemented with the built-in controls and field
    templates provided by Dynamic Data. For the ProductName, you could have used the
    built-in ForeignKey field template, which would display product names as hyperlinks.
    However, there is no way to display both OrderDate and OrderStatus using just
    the field templates that Dynamic Data offers out of the box. The ForeignKey field
    template can display value of only one property, the one specified in the DisplayColumnAttribute
    applied to the parent entity class, so you could display either the OrderDate
    or the OrderStatus, but not both.


    To solve this problem, the sample solution includes a new field template called
    Parent (for consistency with the built-in Children template). This template can
    be used with foreign key columns and allows you to set the DisplayField attribute
    to any column from the parent entity to display. Following is an example of using
    this template with the Order property of the Order_Detail entity to display the
    OrderDate property of the parent Order entity. Listing 12.4 later in this section
    shows a complete markup of the sample page.'
  merge: -1
  img_proc: true
- pgno: 415
  md: "```\n<unl:UnleashedField DataField=\"Order\" UIHint=\"Parent\"\nDisplayField=\"\
    OrderDate\"/>\n```\n\n> NOTE\n> \n> UnleashedField is an extended version of the\
    \ built-in DynamicField, which was introduced in Chapter 11, \"Building Dynamic\
    \ Forms.\" For the purposes of this discussion, they are the same.\n\nListing\
    \ 12.1 shows the markup of the Parent field template. Notice that unlike the built-in\
    \ ForeignKey template, which determines the value of the parent column directly\
    \ and displays it in a HyperLink control, the Parent field template uses a nested\
    \ UnleashedControl, which as you recall inherits from the DynamicControl provided\
    \ by Dynamic Data. In other words, the Parent field template uses another field\
    \ template to display the parent property. That field template will be located\
    \ based on the metadata information describing the parent property. This allows\
    \ you to reuse the logic already implemented in the numerous built-in and custom\
    \ field templates for different types of properties, including enumeration, foreign\
    \ key, and Boolean, which you otherwise would have to reimplement.\n\n# LISTING\
    \ 12.1 Parent Field Template (Markup)\n\n```\n<%@ Control Language=\"C#\" CodeBehind=\"\
    Parent.ascx.cs\" %>\nInherits=\"WebApplication.DynamicData.FieldTemplates.ParentFieldTemplate\"\
    \ %>\n<unl:DataItemContainer runat=\"server\" ID=\"container\">\n<unl:UnleashedControl\
    \ runat=\"server\" ID=\"control\" OnInit=\"Control_Init\" />\n</unl:DataItemContainer>\n\
    ```\n\nField templates rely on ASP.NET data binding to extract values of their\
    \ columns from the entity object provided by the EntityDataSource control. Although\
    \ the Parent field template itself is bound to the child entity, Order_Detail\
    \ in this example, the nested field template created by its UnleashedControl,\
    \ needs to be bound to the parent entity, Order or Product. To accomplish this,\
    \ the Parent field template wraps the UnleashedControl inside of the DataItemContainer,\
    \ a simple control, shown in Listing 12.2, that implements the IDataItemContainer\
    \ interface defined by ASP.NET Framework in the System.Web.UI namespace and allows\
    \ switching the data binding context for its child controls.\n\n# LISTING 12.2\
    \ DataItemContainer Control\n\n```\nusing System.Web.UI;\n\nnamespace Unleashed.DynamicData\n\
    {\npublic class DataItemContainer: Control, IDataItemContainer\n{\npublic object\
    \ DataItem { get; internal set; }\n}\n```"
