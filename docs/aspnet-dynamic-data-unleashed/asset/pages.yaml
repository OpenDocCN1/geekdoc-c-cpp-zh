- pgno: 473
  md: '# CHAPTER 14


    # Implementing Security


    # IN THIS CHAPTER


    +   - Table Scaffolding

    +   - Route Constraints

    +   - Web.Config Authorization Rules

    +   - Metadata Security API

    +   - Implementing Row-Level Security

    +   - Security Annotations


    Dynamic Data includes an extensible security system that enables you to secure
    metadata-driven web applications at several different levels. At the top level,
    you can control whether a particular entity, such as Customer or Product, is accessible
    through the pages dynamically generated from page templates. At the next level
    down, you can configure any given entity type to allow or deny users to perform
    specific actions, or in other words, access the dynamically generated List, Details,
    Insert, and Edit pages. At the lowest level, the framework provides limited support
    for row-level security and allows you to limit the set of rows a user will be
    able to see through the dynamically generated web pages, such as allowing a customer
    to see only the orders they submitted and not everyone else''s.


    In this chapter, you learn the specifics of different approaches for implementing
    security in Dynamic Data applications. The simplest and most straightforward approach
    is to specify authorization rules in the Web configuration file. Based on the
    standard location-based configuration syntax, this approach should be already
    familiar to ASP.NET developers building WebForms and MVC applications. This approach
    supports both entity- and action-level access control.


    The second option to implementing security is based on metadata information. Although
    the Web.config-based authorization rules work to prevent unauthorized access,
    they are not easily accessible in the dynamic templates. Having simple programmatic
    access to rule definitions, dynamic templates can not only prevent unauthorized
    access, but also trim the dynamically generated web pages to hide inaccessible
    information and actions.'
  merge: -1
  img_proc: true
- pgno: 474
  md: "Dynamic Data has built-in support for access control only at the *entity* level.\
    \ However, it also provides extension points that you can take advantage of to\
    \ implement more granular access control at the *action* level.\n\nThe last option\
    \ in implementing security is to do it in *code*. Entity- and action-level access\
    \ rules can be stored in a custom database and loaded by the application at runtime.\
    \ Code is the only option available when it comes to implementing row-level security,\
    \ and you see how this can be done in the last section of this chapter.\n\n# Table\
    \ Scaffolding\n\nYou can control whether or not *all* users have access to a particular\
    \ table through the dynamically generated web pages by applying the `ScaffoldTable`\
    \ attribute to the entity class. Here is an example of explicitly disabling scaffolding\
    \ for the Customer entity:\n\n```\n```csharp\n[ScaffoldTable(false)]\npartial\
    \ class Customers\n{\n    //...\n}\n```\n```\n\nBy default, scaffolding is turned\
    \ off and has to be enabled on a per-entity basis. This is a safe default; it\
    \ prevents you from accidentally viewing users access to all of the application\
    \ data. However, you can also change the default scaffolding option during registration\
    \ of the entity model. This can be useful in the early stages of a web application\
    \ project when you want to collect as much feedback about the entity model from\
    \ the business as possible. Listing 14.1 shows the code in Global.asax.cs that\
    \ enables scaffolding of all tables.\n\n# LISTING 14.1 Scaffolding Configuration\
    \ in Global.asax.cs\n\n```\n```csharp\nusing System;\nusing System.Web;\nusing\
    \ System.Web.DynamicData;\nusing System.Web.Routing;\nusing DataModel;\nusing\
    \ Unleashed.DynamicData;\n\nnamespace WebApplication\n{\n    public class Global\
    \ : HttpApplication\n    {\n        public static readonly UnleashedMetaModel\
    \ DefaultModel;\n        private void Application_Start(object sender, EventArgs\
    \ e)\n        {\n            DefaultModel = new UnleashedMetaModel();\n      \
    \      var modelConfiguration = new NewConfiguration {ScaffoldAllTables = true};\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 475
  md: '```

    DefaultModel.RegisterContext(typeof(NorthwindEntities), modelConfiguration);

    RouteTable.Routes.Add(new DynamicDataRoute("{table}/{action}.aspx"));

    }

    }

    ```


    When scaffolding is turned off for a particular table, users cannot access it
    through the dynamically generated web pages. For example, based on the DynamicDataRoute
    registration in Listing 14.1, you would normally expect to be able to access the
    dynamic Customer web pages by navigating to a URL that looks like this:


    http://localhost:2103/Customers/List.aspx


    However, with scaffolding for the Customer entity disabled, Dynamic Data returns
    the HTTP error 404 (Resource cannot be found) when you try to access this address
    in a browser (see Figure 14.1).


    ![](img/11b373b78859e17d318fd76939a0df9d_475_0.png)


    FIGURE 14.1 Resource cannot be found error page.


    As a security mechanism, the table scaffolding option alone is too crude—it controls
    access only at the entity level and does not allow distinguishing between different
    users or roles. However, turning off scaffolding for a given table disables only
    its dynamic routing, not metadata. This allows you to create custom pages that
    use rich Dynamic Data controls to display data for entities that are not accessible
    through the dynamically generated web pages. With custom pages, you can use the
    standard authentication and authorization functionality of ASP.NET and implement
    security the same way you would for a traditional WebForms application.


    # Route Constraints


    Route constraints are a more powerful and granular access control mechanism than
    table scaffolding options. They allow you to control access not only to entities,
    but to actions as well. Here is how to change the route registration code from
    Listing 14.1 to enable only the dynamic List pages and only for the Product and
    Category entities.'
  merge: -1
  img_proc: true
- pgno: 476
  md: "```\nRouteTable.Routes.Add(new DynamicDataRoute(\"{table}/{action}.aspx\")\
    \ {\n    Constraints = new RouteValueDictionary {\n        { \"table\", \"Products|Categories\"\
    \ },\n        { \"action\", \"List\" },\n    }\n});\n```\n\nAs you might recall\
    \ from a discussion in Chapter 6, \"Page Templates,\" route constraint is specified\
    \ as a RouteValueDictionary object that contains regular expressions for validating\
    \ route parameters with the matching names. In this example, you have a regular\
    \ expression pattern \"Products|Categories\" that will be used to validate the\
    \ \"table\" parameter, accepting only \"Products\" or \"Categories\" values, and\
    \ rejecting all others. \"List\" is also a regular expression pattern, a very\
    \ simple one; it matches only \"List\" values for the \"action\" parameter.\n\n\
    If the actual value of any route parameter does not match the regular expression\
    \ pattern specified in the route constraint, Dynamic Data returns the HTTP error\
    \ code 404 (Resource cannot be found), and the user sees an error page similar\
    \ to that shown back in Figure 14.1.\n\nSimilar to scaffolding options discussed\
    \ in the previous section, route constraints can be used to selectively enable\
    \ or disable dynamic web pages for specific entities in your model. Route constraints\
    \ can be used in combination with the default scaffolding option. For instance,\
    \ having the default scaffolding turned on, you can use route constraints instead\
    \ of the ScaffoldTableAttribute to allow access only to specific tables. However,\
    \ like the scaffolding options, the route constraints lack the ability to implement\
    \ authorization rules based on identity or roles of the application users.\n\n\
    # Web.Config Authorization Rules\n\nYou can also specify authorization rules for\
    \ dynamic pages generated by Dynamic Data in the web configuration file. As you\
    \ are well aware, ASP.NET allows you to define authorization rules for a given\
    \ folder of the web application by creating a Web.config file in it and placing\
    \ <allow/> and <deny/> elements inside of an <authorization/> element. Here is\
    \ a configuration file that prevents unauthenticated users from accessing any\
    \ page:\n\n```\n<?xml version=\"1.0\"?>\n<configuration>\n    <system.web>\n \
    \       <authorization>\n            <deny users=\"*\"/>\n        </authorization>\n\
    \    </system.web>\n</configuration>\n```"
  merge: -1
  img_proc: true
- pgno: 477
  md: "Web configuration files are hierarchical; folders inherit authorization rules\
    \ from their parents and can override them with their own Web.config files. So\
    \ with traditional ASP.NET WebForms web applications, you would typically implement\
    \ security by placing pages that can be accessed only by certain users in a separate\
    \ subfolder and giving it its own Web.config file. For example, you could have\
    \ created a subfolder called Customers, and placed all custom pages that display\
    \ customer information in it, along with the following Web.config file, to allow\
    \ access only for users in the Manager role:\n\n```\n```xml\n<?xml version=\"\
    1.0\"?>\n<configuration>\n  <system.web>\n    <authorization>\n      <allow roles=\"\
    Manager\"/>\n      <deny users=\"*\"/>\n    </authorization>\n  </system.web>\n\
    </configuration>\n```\n```\n\nBecause Dynamic Data applications rely on URL routing,\
    \ there are no physical folders that represent entities—and no Customers folder\
    \ in the sample application. Therefore, you cannot simply create new configuration\
    \ files for them. Instead, you can specify authorization rules in the main Web.config\
    \ of the application, with the help of the <location> element. Here is a configuration\
    \ file that implements the same authorization rules: Only authenticated users\
    \ are allowed to access the root of the application, and only users in the Manager\
    \ role are allowed to access the Customers pages:\n\n```\n```xml\n<?xml version=\"\
    1.0\"?>\n<configuration>\n  <system.web>\n    <authorization>\n      <deny users=\"\
    ?\"/>\n    </authorization>\n  </system.web>\n  <location path=\"Customers\">\n\
    \    <system.web>\n      <authorization>\n        <allow roles=\"Manager\"/>\n\
    \        <deny users=\"*\"/>\n      </authorization>\n    </system.web>\n  </location>\n\
    </configuration>\n```\n```\n\nYou can further tailor access rights for the Customer\
    \ entity by creating authorization rules for specific dynamically generated pages.\
    \ For instance, by adding the following configuration snippet to this Web.config\
    \ file, you can extend the authorization rules and allow users in the Employee\
    \ role to access the dynamic Customers/List.aspx page. In other"
  merge: -1
  img_proc: true
- pgno: 478
  md: "words, managers will be allowed to access all dynamic pages for the Customer\
    \ entity, and employees will be able to access only its List page.\n\n```\n<location\
    \ path=\"Customers/List.aspx\">\n  <system.web>\n    <authorization>\n      <allow\
    \ roles=\"Employee\" />\n    </authorization>\n  </system.web>\n</location>\n\
    ```\n\nWhen processing authorization rules, ASP.NET starts with the <authorization/>\
    \ section closest to the URL in question. If no matching rule is found, it continues\
    \ with the next available parent configuration until it finds a matching rule.\
    \ This works the same with both physical Web.config files and <location/> elements\
    \ as well. In this particular example, when an unauthenticated user is trying\
    \ to access the Customers/List.aspx, ASP.NET first evaluates the <allow roles=\"\
    Employee\" /> rule defined specifically for this dynamic page. Because the rule\
    \ does not match the unauthenticated user, ASP.NET continues with the <allow roles=\"\
    Manager\" /> rule defined for the dynamic Customers folder. Because this rule\
    \ does not match either, it then evaluates the <deny users=\"*\" /> rule defined\
    \ for the folder. This last rule does match, and ASP.NET denies the unauthenticated\
    \ user access to the dynamic Customers/List.aspx page.\n\n# NOTE\n\nIf a matching\
    \ authorization rule cannot be found all the way up to the root of the web application,\
    \ ASP.NET allows access by default. In a dynamic web application, where new entities\
    \ can be added without creating physical folders, it is easier to overlook missing\
    \ authorization rules and allow access by accident. If you want to rely on Web.config\
    \ files to implement security, you might want to deny access by default as a precaution.\
    \ Here is an example that does that:\n\n```\n<?xml version=\"1.0\"?>\n<configuration>\n\
    \  <location path=\"Default.aspx\">\n    <system.web>\n      <authorization>\n\
    \        <allow users=\"*\" />\n      </authorization>\n    </system.web>\n  </location>\n\
    \  <system.web>\n    <authorization>\n      <deny users=\"*\" />\n    </authorization>\n\
    \  </system.web>\n</configuration>\n```"
  merge: -1
  img_proc: true
- pgno: 479
  md: "Having access denied by default forces you to modify the Web.config for every\
    \ new entity you want to access through the dynamically generated web pages. In\
    \ other words, if you decide to enable dynamic pages for the Customer entity,\
    \ you have to create authorization rules for it in the Web.config before you can\
    \ test it in the browser.\n\n# Limitations of Configuration-Based Rules\n\nWeb\
    \ configuration files allow you to implement a complete authorization system for\
    \ Dynamic Data applications. You can configure access rules based on entities,\
    \ actions, users, and roles. However, there are several significant drawbacks\
    \ associated with this approach as well. On one hand, configuring a set of rules\
    \ for a sizable entity model is often very verbose. You must create a separate\
    \ <location/> element for every entity and potentially for every action that needs\
    \ different authorization rules. With at least seven lines of XML configuration\
    \ for every location element, the size of configuration can quickly reach hundreds\
    \ of lines.\n\nA bigger problem with configuration-based approach is that enforcing\
    \ access rules at the page level is often not granular enough. Take a dynamic\
    \ search page for the Product entity as an example. Suppose you want all your\
    \ customers and even unauthenticated users to browse the product catalog. However,\
    \ you also want to restrict access to Suppliers so that only employees of your\
    \ company can see them. To enforce these rules, you could try implementing the\
    \ following authorization rules in the Web.config file:\n\n```\n```xml\n<location\
    \ path=\"Products\">\n    <system.web>\n        <authorization>\n            <allow\
    \ users=\"*\"/>\n        </authorization>\n    </system.web>\n</location>\n<location\
    \ path=\"Suppliers\">\n    <system.web>\n        <authorization>\n           \
    \ <allow roles=\"Manager,Employee\"/>\n            <deny users=\"*\"/>\n     \
    \   </authorization>\n    </system.web>\n</location>\n```\n```\n\nThese authorization\
    \ rules prevent customers from seeing the Suppliers page itself. However, they\
    \ can still see supplier names on the dynamic Products page. The Product entity\
    \ has a navigation property, Supplier, and Dynamic Data automatically generates\
    \ a foreign key field template for it. Figure 14.2 shows an example."
  merge: -1
  img_proc: true
- pgno: 480
  md: '![](img/11b373b78859e17d318fd76939a0df9d_480_0.png)


    FIGURE 14.2 Products page displaying inaccessible suppliers.


    To prevent inaccessible entity information from appearing in pages of related
    entities completely, the dynamic page templates must somehow hide it. Implementing
    this functionality, sometimes also referred to as security trimming, by reading
    complex authorization rules from the Web configuration is challenging. Instead,
    it is often more practical to simply create a custom page or page template for
    the entity, such as Product in this example, that requires trimming.


    # Metadata Security API


    The metadata API provides a good foundation for implementing entity-level security
    with both access control and trimming. As discussed in Chapter 7, “Metadata API,”
    the MetaTable class defines the following methods that encapsulate action-level
    authorization rules for individual entities based on the identity and roles of
    a given user:


    ```

    public virtual bool CanDelete(IPrincipal principal);

    public virtual bool CanInsert(IPrincipal principal);

    public virtual bool CanRead(IPrincipal principal);

    public virtual bool CanUpdate(IPrincipal principal);

    ```


    As implemented in the built-in MetaTable class, the permission methods always
    return true, allowing any user to access any entity by default. However, because
    these methods are virtual, you can override them and implement your own authorization
    rules.


    In simplest form, you could hard-code the authorization rules. The example that
    follows demonstrates implementation of the CanRead method, which allows all users
    to access the Product and Category entities and only users in role Employee to
    access the Suppliers and other tables:'
  merge: -1
  img_proc: true
- pgno: 481
  md: "```\n```csharp\npublic override bool CanRead(IPrincipal principal)\n{\n   \
    \ if (this.Name == \"Products\") return true;\n    if (this.Name == \"Categories\"\
    ) return true;\n    return principal.IsInRole(\"Employee\");\n}\n```\n```\n\n\
    Hard-coding the authorization rules in the permission methods is straightforward\
    \ and helps consolidate security settings. It usually produces a much more compact\
    \ definition of authorization rules than the Web.config-based approach (how much\
    \ more depends on you code formatting style, of course). On the other hand, hard-coding\
    \ the rules, by definition, means that they cannot be changed at run time. And\
    \ perhaps the more important drawback is that the size and complexity of the permission\
    \ methods also continue to grow as the size of your entity model increases.\n\n\
    To allow changing the authorization rules at run time, you could define much more\
    \ granular, action-level roles for each entity and require a user to be in a corresponding\
    \ role to perform the action. For example, the Product entity could have corresponding\
    \ roles called CanDeleteProducts, CanInsertProducts, CanReadProducts, and CanUpdateProducts.\
    \ With similar roles defined for all other entities, implementation of the CanRead\
    \ and other methods in the MetaTable descendant could be as simple as the one\
    \ shown here:\n\n```\n```csharp\npublic override bool CanRead(IPrincipal principal)\n\
    {\n    return principal.IsInRole(\"CanRead\" + this.Name);\n}\n```\n```\n\nBy\
    \ defining granular, action-level roles, you can make the permission methods simpler,\
    \ but only at the cost of having to manage more roles at run time. If you are\
    \ using the built-in ASP.NET web configuration tool, the large number of roles\
    \ required with this approach is usually too much to handle. If runtime configuration\
    \ of the authorization rules is required in your application, you might want to\
    \ consider using the Microsoft Authorization Manager (AzMan), which allows you\
    \ to define entity actions as low-level “operations” instead of the high-level\
    \ roles. AzMan provides a powerful configuration console that allows mapping operations\
    \ to roles and assigning roles to individual users or groups.\n\nSome applications\
    \ have their own authentication and authorization systems, often with user information\
    \ and their access permissions stored in a database. If that is the case in your\
    \ application, you can also reuse your existing security system when implementing\
    \ the MetaTable permission methods. Keep in mind, however, that these methods\
    \ can be called multiple times for each page request. It is important to cache\
    \ the authorization rules in memory and avoid hitting the database every time\
    \ to make rule evaluation as fast as possible."
  merge: -1
  img_proc: true
- pgno: 482
  md: '# Modifying Dynamic Templates to Support the Security API


    Dynamic Data offers limited support for the MetaTable permission methods out of
    the box. The VisibleTables property of the MetaModel class returns only the MetaTable
    objects whose CanRead method returns true for the current user; the Default page
    relies on this property to display a list of tables he is allowed to see. Figure
    14.3 shows how it looks when authorization was implemented to allow unauthenticated
    users and customers to access only the Product and Category entities.


    ![](img/11b373b78859e17d318fd76939a0df9d_482_0.png)


    FIGURE 14.3 Default page showing only accessible tables.


    The GetScaffoldColumns and GetFilteredColumns methods of the MetaTable class also
    exclude the foreign key columns if the current user does not have the permission
    to read his parent table. So if you override the CanRead method to allow only
    users in the Employee role to read the Supplier entity, the dynamic Products page
    no longer displays the Supplier column to unauthenticated users and looks similar
    to what is shown in Figure 14.4.


    ![](img/11b373b78859e17d318fd76939a0df9d_482_1.png)


    FIGURE 14.4 Products page displaying inaccessible actions.'
  merge: -1
  img_proc: true
- pgno: 483
  md: "Aside from using MetaTable permission methods to hide the foreign key columns\
    \ the user is not allowed to read, Dynamic Data doesn't do anything else out of\
    \ the box. In other words, it ignores the values returned by the CanInsert, CanUpdate,\
    \ and CanDelete methods; in fact, it never calls them. For example, if you try\
    \ to prevent unauthorized users from making changes in any of the tables by implementing\
    \ the three permission methods similar to this\n\n```\npublic override bool CanUpdate(IPrincipal\
    \ principal)\n{\n    return principal.IsInRole(\"Employee\");\n}\n```\n\n...the\
    \ dynamic Products will still display the Edit, Delete, and Insert new item links\
    \ shown in Figure 14.4. Even more importantly, if the unauthorized user actually\
    \ clicks one of these links, he can access it. He can even access the dynamic\
    \ Suppliers page by typing its address directly in the address bar of their web\
    \ browser, even though the Products page might not display the Supplier hyperlinks\
    \ for them. Luckily, with just a few changes, you can make the dynamic page templates\
    \ support the permission methods completely and implement both access control\
    \ and UI trimming.\n\n# Modifying Page Templates to Prevent Unauthorized Access\n\
    \nThe Insert page template generates web pages that allow users to create new\
    \ entity instances, or in database terms, insert new records in a particular table.\
    \ To determine whether the current user is authorized to perform this action,\
    \ it needs to call the CanInsert method of the MetaTable object describing the\
    \ entity type. Here is a code snippet that shows how access security can be implemented\
    \ in this template:\n\n```\npublic partial class Insert : Page\n{\n    protected\
    \ MetaTable table;\n    protected override void OnPreInit(EventArgs e)\n    {\n\
    \        base.OnPreInit(e);\n        this.table = DynamicDataRouteHandler.GetRequestMetaTable(this.Context);\n\
    \        if (!this.table.CanInsert(this.User))\n        {\n            FormsAuthentication.RedirectToLoginPage();\n\
    \            this.Response.End();\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
