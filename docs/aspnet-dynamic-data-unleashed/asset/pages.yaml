- pgno: 508
  md: "Notice that the type of the Customers property is now the IObjectSet<T> interface\
    \ and not the concrete class, ObjectSet<T>. The property getter no longer returns\
    \ the built-in object created by the CreateObjectSet method provided by the Entity\
    \ Framework. Instead, it returns an instance of the FilteredObjectSet, a custom\
    \ class created to modify the default Customers query. This class reimplements\
    \ the IObjectSet<T> interface by wrapping an original ObjectSet<T> instance, delegating\
    \ most of the properties and methods to the original and augmenting the functionality\
    \ of the IQueryable properties based on the CustomQueryAttribute. In other words,\
    \ the FilteredObjectSet class implements the Decorator pattern to add row-level\
    \ security to the built-in ObjectSet class. Listing 14.2 shows its entire source\
    \ code with important areas highlighted in bold.\n\n# LISTING 14.2 FilteredObjectSet\
    \ Implementation\n\n```\nusing System;\nusing System.Collections;\nusing System.Collections.Generic;\n\
    using System.ComponentModel;\nusing System.Data.Objects;\nusing System.Linq;\n\
    using System.Linq.Expressions;\nusing Unleashed.DataAnnotations;\n\nnamespace\
    \ DataModel\n{\n    public class FilteredObjectSet<T> : IObjectSet<T> where T\
    \ : class\n    {\n        private static readonly CustomQueryAttribute customQueryAttribute\
    \ = TypeDescriptor.GetAttributes(typeof(T)).OfType<CustomQueryAttribute>().FirstOrDefault();\n\
