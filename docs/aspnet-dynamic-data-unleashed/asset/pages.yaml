- pgno: 149
  md: "```\n<label>Street:</label>\n<asp:DynamicControl runat=\"server\" DataField=\"\
    Address\" Mode=\"Edit\" /><br />\n<label>City:</label>\n<asp:DynamicControl runat=\"\
    server\" DataField=\"City\" Mode=\"Edit\" />\n<label>State:</label>\n<asp:DynamicControl\
    \ runat=\"server\" DataField=\"Region\" Mode=\"Edit\" />\n<label>Zip:</label>\n\
    <asp:DynamicControl runat=\"server\" DataField=\"PostalCode\" Mode=\"Edit\" />\n\
    </fieldset>\n```\n\nAlthough you could easily create the Insert mode template\
    \ as well, the only difference between them would be the Insert mode specified\
    \ for DynamicControl instances. As discussed in Chapter 3, Dynamic Data automatically\
    \ falls back to use an Edit field template when an Insert template for a particular\
    \ field is not available. In case of the Customer entity template, it means that\
    \ the Text_Edit field template instances will be used in both Insert and Edit\
    \ modes. Therefore, defining a separate entity template for Insert mode would\
    \ be redundant in this case. Luckily, you can take advantage of the fact that\
    \ Dynamic Data uses a similar fallback algorithm for entity templates as well,\
    \ which allows you to reuse Edit templates, such as Customers_Edit in Insert mode.\
    \ You need only define Insert entity templates when they need to look and work\
    \ differently from their Edit mode counterparts.\n\n# Entity Template Lookup Rules\n\
    \nWhen looking for an entity template, Dynamic Data looks in the DynamicData\\\
    EntityTemplates folder of the web application and tries to find the best match\
    \ based on the template name and mode. Template file names consist of the template\
    \ name, followed by the optional mode suffix:\n\n```\nDynamicData\\EntityTemplates\\\
    {TemplateName}{_Mode}.ascx\n```\n\n# Template Name\n\nBy default, the template\
    \ name is determined by the name of the MetaTable describing the entity class.\
    \ This name usually matches the name of the property provided by the context class\
    \ that you would use to query it. In the Northwind sample, the context class,\
    \ NorthwindEntities, has a property called Customers that you would normally use\
    \ to query Customer entities, as illustrated here. Therefore, for the Customer\
    \ entity, the table name and the default template name is Customers, plural:\n\
    \n```\nusing (NorthwindEntities context = new NorthwindEntities())\n{\n    var\
    \ customers = from c in context.Customers\n                    select c;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 150
  md: "In data models that use inheritance, derived entity classes are represented\
    \ slightly differently. Imagine a CRM (Customer Relationship Management) system\
    \ that has a base class Contact and derived classes Prospect and Customer. Even\
    \ though both Prospect and Customer entities might be stored in the same database\
    \ table called Contacts, Dynamic Data provides a separate MetaTable object for\
    \ each entity class. The name of each MetaTable matches the name of the derived\
    \ class, so for the Prospect entity, the MetaTable name and the default template\
    \ name is Prospect, singular:\n\n```\n```csharp\nusing (CrmEntities context =\
    \ new CrmEntities())\n{\n    var prospects = from p in context.Contacts.OfType<Prospect>()\n\
    \                    select p;\n}\n```\n```\n\nTemplate name can also be specified\
    \ explicitly by setting the UIHint attribute of the DynamicEntity control, in\
    \ which case it does not have to match the table name of the entity class at all:\n\
    \n```\n```aspx\n<asp:DynamicEntity runat=\"server\" UIHint=\"Contact\"/>\n```\n\
    ```\n\nAn explicitly specified template name is a more specific match than the\
    \ table name. Therefore, if the previous code snippet is used for the Customer\
    \ entity, the Contact.ascx entity template is used even though the Customers.ascx\
    \ entity template is also available.\n\nIf a matching template cannot be found\
    \ based explicitly on the specified template name or the table name, Default is\
    \ used. Because Dynamic Data projects come with a set of default entity templates\
    \ out of the box, this guarantees that a matching template exists for any entity.\n\
    \n# ## Template Mode\n\nSimilar to the control mode for field templates, template\
    \ mode defines the context where the entity template will be used. It is defined\
    \ by the members of the ASP.NET DataBoundControlMode enumeration and used by Dynamic\
    \ Data to determine the suffix of the template file name:\n\n+   - ReadOnly templates\
    \ are used to implement the `ItemTemplate` of the FormView and ListView controls.\
    \ Read-only entity templates have no mode-based suffix in their file names.\n\
    +   - Edit templates are used to implement the `EditItemTemplate` of the FormView\
    \ and ListView controls. Edit templates have `_Edit` at the end of their file\
    \ names, such as `Default_Edit.ascx`.\n+   - Insert templates are used to implement\
    \ `InsertItemTemplate` of the FormView and ListView controls and have `_Insert`\
    \ at the end of their file names, such as `Default_Insert.ascx`."
  merge: -1
  img_proc: true
