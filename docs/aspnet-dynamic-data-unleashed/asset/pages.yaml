    \ mode; trying to edit properties of parent entities at the same time with the\
    \ child entities would be not only challenging to implement, but also confusing\
    \ for the application's users.\n\n# Column Sorting Across Related Entities\n\n\
    The GridView control allows users to click the column headers to sort the rows\
    \ in ascending or descending order of the column values. With LINQ-enabled data\
    \ source controls, this functionality takes advantage of server-side sorting by\
    \ generating LINQ queries that have an ORDER BY clause when translated to SQL.\
