- pgno: 283
  md: "You can also select all entities of a particular type by using the OfType LINQ\
    \ extension method, such as the next query, which returns all entities of Customer\
    \ type:\n\n```\nvar customers = from c in context.Users.OfType<Customer>()\n \
    \   select c;\n```\n\nAlthough these LINQ queries work with all three types of\
    \ inheritance mapping, it is important that you understand how each type of mapping\
    \ is implemented at the database level, how each type of LINQ queries are translated\
    \ into SQL, and how they affect the performance of your application. If you are\
    \ considering using inheritance in your entity model, carefully review the tradeoffs\
    \ described in this section and measure the impact of inheritance on the performance\
    \ of your system by profiling it. Do not assume that simple LINQ queries will\
    \ be fast.\n\n![](img/11b373b78859e17d318fd76939a0df9d_283_0.png)\n\nFIGURE 9.1\
    \ Conceptual model with inheritance hierarchy.\n\n# Table-per-Concrete Type Mapping\n\
    \nWith table-per-concrete type mapping, each concrete class in the inheritance\
    \ hierarchy gets its own table. The Employees and Customers tables in the database\
    \ diagram shown in Figure 9.2 include columns for storing not only the concrete\
    \ types, Employee and Customer, respectively, but also the abstract base type,\
    \ User. Notice how both of these tables include the FirstName and LastName columns.\n\
    \n![](img/11b373b78859e17d318fd76939a0df9d_283_1.png)\n\nFIGURE 9.2 Table-per-concrete\
    \ type mapping."
  merge: -1
  img_proc: true
- pgno: 284
  md: "Because database designers most commonly use this type of entity modeling,\
    \ table-per-concrete type looks like a good way to extract the commonality into\
    \ a base class. However, although this type of mapping offers good performance\
    \ for queries against specific concrete types, it has a significant performance\
    \ penalty for querying across all base types because it relies on the UNION operator\
    \ to combine results of multiple queries. Table 9.1 shows the examples.\n\n**TABLE\
    \ 9.1  SQL Generated with Table-per-Concrete Type Mapping**\n\n| LINQ | SQL |\n\
    |---|---|\n| `from u in context.Users`<br>`select u;` | `SELECT * FROM Employees`<br>`UNION\
    \ ALL`<br>`SELECT * FROM Customers` |\n| `from c in context.Users.OfType<Customer>()`<br>`select\
    \ c;` | `SELECT * FROM Customers` |\n\n> **NOTE**\n> \n> Examples of SQL queries\
    \ generated by the Entity Framework in this section show pseudo-code, which was\
    \ significantly modified to reduce size and make it easy to compare with LINQ\
    \ code. The Entity Framework does not generate SELECT * SQL statements.\n\nWhereas\
    \ in plain SQL, the UNION statement has to be used explicitly, with LINQ to Entities,\
    \ the query looks as if it spans only one table, making it easy to write queries\
    \ that will perform poorly due to excessive unionions.\n\n# Table-per-Type Mapping\n\
    \nWith *table-per-type* mapping, each class, regardless of whether it is concrete\
    \ or abstract, gets its own table in the database. Figure 9.3 shows an example\
    \ of this type of mapping. As you can see, the User class is mapped to the Users\
    \ table, with Employee and Customer classes mapped to the Users_Employee and Users_Customer\
    \ tables, respectively.\n\n![](img/11b373b78859e17d318fd76939a0df9d_284_0.png)"
  merge: -1
  img_proc: true
- pgno: 285
  md: 'With table-per-type of mapping, iterating over the entities of the base class
    User requires an outer join with all other tables in the hierarchy because Entity
    Framework has to instantiate entities of appropriate type, Customer and Employee.
    Querying for instances of a derived type Customer will be more efficient as it
    results in an inner join of the tables where its data is stored.


    TABLE 9.2 SQL Generated with Table-per-Type Mapping


    | LINQ | SQL |

    |------|-----|

    | from u in context.Users

    select u; | SELECT * FROM Users

    LEFT OUTER JOIN Users_Customer

    ON Users.Id = Users_Customer.Id

    LEFT OUTER JOIN Users_Employee

    ON Users.Id = Users_Employee.Id |

    | from c in context.Users.OfType<Customer>()

    select c; | SELECT * FROM Users

    JOIN Users_Customer

    ON Users.Id = Users_Customer.Id |

    | from u in context.Users

    select new { u.FirstName, u.LastName }; | SELECT FirstName, LastName FROM Users
    |


    Again, the complexity of the actual SQL statement is hidden from the developer
    writing the LINQ query, making it easy to write queries that are inefficient due
    to excessive joins. It is possible to optimize these queries with the help of
    projections, which can reduce or eliminate joins from the generated SQL; however,
    as a developer you need to understand what is going on.


    # Table-Per-Hierarchy Mapping


    With table-per-hierarchy mapping, all classes in a given hierarchy are mapped
    to the same database table, with a particular column storing a discriminator value
    that determines the entity type. Figure 9.4 shows a table called Users, which
    stores both Customer and Employee entities, using the UserType column to distinguish
    between them.


    ![](img/11b373b78859e17d318fd76939a0df9d_285_0.png)


    FIGURE 9.4 Table-per-hierarchy mapping.


    The table-per-hierarchy mapping offers a good performance tradeoff between queries
    across the base types and the queries across the derived types. The SQL generated
    with this mapping approach is also much closer to the original LINQ code developers
    write. As you can see in the second example of Table 9.3, the OfType extension
    method is translated into a straightforward WHERE clause.'
  merge: -1
  img_proc: true
