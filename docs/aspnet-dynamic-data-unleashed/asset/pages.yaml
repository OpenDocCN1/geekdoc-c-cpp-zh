- pgno: 94
  md: '![](img/11b373b78859e17d318fd76939a0df9d_94_0.png)


    FIGURE 2.15 Stored procedure in storage section of the entity model.


    In the Add Function Import dialog (see Figure 2.16), you can specify the name
    of the function that will be added to the conceptual model. By default, it will
    match the name of the stored procedure, but you have the option of changing it.
    It is common for organizations to use the Hungarian naming convention for stored
    procedure names, with prefixes such as usp_ to distinguish custom stored procedures
    from system stored procedures, which have prefix sp_. However, the Hungarian notation
    is discouraged in .NET applications to improve readability of the code. Function
    import mapping option in Entity Framework allows you to follow .NET naming conventions
    in the application code without having to rename the stored procedure.


    In addition to the function name, another design decision you need to make when
    importing a stored procedure is to specify the type of objects returned by the
    stored procedure. The Get Column Information button allows you to quickly see
    the definition of its result set. In this case, the GetProductsToReorder procedure
    returns a set of Products, and you can have the function return a collection of
    Product entities. If the set of columns returned by a stored procedure does not
    match any of the entity types defined in the model, you can choose the option
    to return a collection of complex (non-entity) objects and have the tool automatically
    create a new complex type definition. Function imports returning collections of
    complex objects are similar to LINQ queries that use projection to return sets
    of anonymous or named objects. Similar to projection, having a stored procedure
    return a specific set of columns helps to reduce the size of the result set but
    does not take advantage of the identity tracking, which is only supported for
    entities.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/11b373b78859e17d318fd76939a0df9d_95_0.png)


    # FIGURE 2.16 Add function import.


    When you click the OK button in the Add Function Import dialog, the function import
    is added to the conceptual section of the model. You can find it under Entity
    Container/Function Imports in the model browser; Figure 2.17 shows an example.


    ![](img/11b373b78859e17d318fd76939a0df9d_95_1.png)


    # FIGURE 2.17 Function import in the conceptual section of model browser.


    For each function import, the Entity Designer generates a strongly-typed method
    in the ObjectContext class. Following is an example of using the newly added GetProductsToReorder
    method to list all products returned by the stored procedure:'
  merge: -1
  img_proc: true
- pgno: 96
  md: "```\nusing (NorthwindEntities context = new NorthwindEntities())\n{\n    IEnumerable<Product>\
    \ products = context.GetProductsToReorder();\n    foreach (Product p in products)\n\
    \        Console.WriteLine(p.ProductName);\n}\n```\n\nThe generated method returns\
    \ an IEnumerable and not an IQueryable. Although you can use the familiar LINQ\
    \ operators to manipulate it further, keep in mind that these operations are performed\
    \ in the application memory and not by the database server. Instead, it is often\
    \ best to modify the definition of the stored procedure itself and have it return\
    \ a more focused result set.\n\n# Insert, Update, and Delete Stored Procedures\n\
    \nThe Entity Framework also allows you to use stored procedures to perform insert,\
    \ update, and delete operations instead of generating SQL statements dynamically.\
    \ When combined with restriction of the application permissions to only read data,\
    \ this technique can help reduce accidental data corruption and locking due to\
    \ casual browsing, when developers or administrators use a tool, such as SQL Server\
    \ Management Studio to interactively explore live data in a production system.\n\
    \nHere's an example of the stored procedure that inserts a new Product entity\
    \ into the Products table:\n\n```\nCREATE PROCEDURE [dbo].[Products_Insert]\n\
    @ProductName nvarchar(40), @SupplierID int,\n@QuantityPerUnit nvarchar(20), @UnitPrice\
    \ money, @UnitsInStock smallint,\n@UnitsOnOrder smallint, @ReorderLevel smallint,\
    \ @Discontinued bit\nAS\nBEGIN\n    INSERT INTO Products\n    (ProductName, SupplierID,\
    \ CategoryID,\n    QuantityPerUnit, UnitPrice, UnitsInStock,\n    UnitsOnOrder,\
    \ ReorderLevel, Discontinued)\n    VALUES\n    (@ProductName, @SupplierID, @CategoryID,\n\
    \    @QuantityPerUnit, @UnitPrice, @UnitsInStock,\n    @UnitsOnOrder, @ReorderLevel,\
    \ @Discontinued);\n    \n    SELECT SCOPE_IDENTITY() as ProductID;\nEND\n```\n\
    \nNotice that this stored procedure takes a set of parameters, each representing\
    \ a particular table column, such as ProductName and SupplierID. The stored procedure\
    \ performs the INSERT statement and a SELECT statement to return the ProductID\
    \ value of the newly inserted row."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'For the Entity Framework to take advantage of this stored procedure, it needs
    to be added to the storage section of the entity model, similar to the GetProductsToReorder
    stored procedure discussed earlier. However, instead of adding it as a function
    import to the conceptual model, right-click the Product entity in the Entity Designer
    and select Stored Procedure Mapping from the context menu. You will see the Mapping
    Details window similar to that shown in Figure 2.18.


    ![](img/11b373b78859e17d318fd76939a0df9d_97_0.png)


    FIGURE 2.18 Insert function mapping.


    The Functions tab of the Mapping window allows you to map the stored procedure
    parameters (shown on the left) to the entity properties (shown on the right).
    In this example, the generated ProductID value is mapped in the Result Column
    Bindings section.


    The Update stored procedures are somewhat more complex because they need to implement
    the optimistic locking normally performed by the Entity Framework. In addition
    to the primary key value required to uniquely identify the target row and the
    current values of all fields, the update procedure needs to provide a separate
    parameter for each entity property that has Concurrency Mode set to Fixed in the
    entity model. In the following example, the Products_Update procedure provides
    a separate set of parameters for all properties, one set for the new values, used
    to update the row, and the other set of old values, used to make sure that the
    entity has not been modified since it was last retrieved from the database.


    The update stored procedure also needs to be added to the model and used to map
    the Product entity as shown in Figure 2.19. Each property of the Product entity
    is mapped twice—first to the parameter that receives the “old” value of the entity
    property as it was originally retrieved from the database and then to the parameter
    that receives the “new” value that needs to be persisted. Notice that the @RowsAffected
    output parameter of the stored procedure, which returns the number of rows actually
    modified by the stored procedure, has a checkbox in the Rows Affected Parameter
    column. This parameter is used by the Entity Framework to determine if the optimistic
    locking was performed successfully and throw the OptimisticConcurrencyException
    if it returns zero.'
  merge: -1
  img_proc: true
- pgno: 98
  md: <!-- no content -->
