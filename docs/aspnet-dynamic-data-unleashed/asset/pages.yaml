- pgno: 87
  md: "Usually the entities in the conceptual model are closely related to the tables\
    \ and views in the storage model. However, entity types are higher-level constructs\
    \ and do not necessarily match the database tables they represent. In particular,\
    \ the Product entity has a singular name, but the Products table name is plural.\
    \ It also has navigation properties that allow you to traverse entity relationships\
    \ without having to immediately resort to joins in LINQ queries.\n\nFollowing\
    \ is the raw XML definition of the Product entity. Notice that the XML element\
    \ names, EntityType, Key, and Property, are similar to those used in the storage\
    \ model definition. The NavigationProperty element, on the other hand, is used\
    \ only in the conceptual model:\n\n```\n<EntityType Name=\"Product\">\n    <Key>\n\
    \        <PropertyRef Name=\"ProductID\" />\n    </Key>\n    <Property Name=\"\
    ProductID\" Type=\"Int32\" Nullable=\"false\" annotation:StoreGeneratedPattern=\"\
    Identity\" />\n    <Property Name=\"ProductName\" Type=\"String\" Nullable=\"\
    false\" MaxLength=\"40\" Unicode=\"true\" FixedLength=\"false\" />\n    <Property\
    \ Name=\"SupplierID\" Type=\"Int32\" />\n    <Property Name=\"CategoryID\" Type=\"\
    Int32\" />\n    <Property Name=\"QuantityPerUnit\" Type=\"String\" MaxLength=\"\
    20\" Unicode=\"true\" FixedLength=\"false\" />\n    <Property Name=\"UnitPrice\"\
    \ Type=\"Decimal\" Precision=\"19\" Scale=\"4\" />\n    <Property Name=\"UnitsInStock\"\
    \ Type=\"Int16\" />\n    <Property Name=\"UnitsOnOrder\" Type=\"Int16\" />\n \
    \   <Property Name=\"ReorderLevel\" Type=\"Int16\" />\n    <Property Name=\"Discontinued\"\
    \ Type=\"Boolean\" Nullable=\"false\" />\n    <NavigationProperty Name=\"Supplier\"\
    \ FromRole=\"Product\" ToRole=\"Supplier\" Relationship=\"NorthwindModel.FK_Products_Suppliers\"\
    \ />\n    <NavigationProperty Name=\"Category\" FromRole=\"Product\" ToRole=\"\
    Category\" Relationship=\"NorthwindModel.FK_Products_Categories\" />\n    <NavigationProperty\
    \ Name=\"Order_Details\" FromRole=\"Product\" ToRole=\"Order_Detail\" Relationship=\"\
    NorthwindModel.FK_Order_Details_Products\" />\n</EntityType>\n```\n\nSome database\
    \ tables, such as the EmployeeTerritories in the Northwind sample database, might\
    \ not have corresponding entity types at all. The many-to-many association between\
    \ the Employees and the Territories tables requires a third table, sometimes called\
    \ a “junction table,” to implement in a relational database system. However, in\
    \ the conceptual entity model, the many-to-many association between the Employee\
    \ and Territory entities can be supported directly by their Territories and Employees\
    \ navigation properties."
  merge: -1
  img_proc: true
