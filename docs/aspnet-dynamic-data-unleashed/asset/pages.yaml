- pgno: 73
  md: 'Generation of the parameterized SQL is important for two reasons. On one hand,
    it improves application performance as database servers can reuse the execution
    plan with different parameter values. If the parameter values were embedded in
    the SQL text, each parameter value would make a unique new query for which the
    server would have to recalculate and cache the execution plan, consuming additional
    CPU and RAM resources. On the other hand, parameterized SQL statements are immune
    to SQL injection attacks, very common in applications that generate dynamic SQL
    statements as strings. Here is an example that illustrates the problem:


    ```

    string city = ''''; drop database Northwind; select '''';\nstring sql = string.Format(\n    "select
    * from Customers where City = ''{0}''", city);\nConsole.WriteLine(sql);

    ```


    Imagine that in the code snippet just shown the value of the city variable is
    supplied by the user and the application uses it to create a query that returns
    only the customers in the specified city. With this naive implementation, a malicious
    user could enter a specially constructed string that modifies the original SQL
    statement the developer intended to execute and injects one or more unexpected
    SQL statements, allowing him to destroy data or get access to restricted information.
    Following is the SQL statement this code generates. Notice that instead of an
    innocent SELECT statement, we have a DROP DATABASE injected in an otherwise valid
    SQL batch:


    ```

    select * from Customers where City = '''';\ndrop database Northwind;\nselect ''''

    ```


    However, in the SQL statement generated by the Entity Framework, the city value
    is passed to the database server as a parameter, making it impossible to modify
    the original SQL statement and inject a malicious payload. Even if the value was
    hard-coded in the application like in the first example in this section, the automatic
    encoding of literal values performed by the Entity Framework would still prevent
    the injection.


    # Compiled Queries


    It takes a certain amount of CPU and time resources for Entity Framework to translate
    the LINQ queries into their equivalent SQL statements before they can be executed.
    When a particular query is executed repeatedly, you can improve application performance
    by precompiling it, as shown in the following example:


    ```

    static Func<NorthwindEntities, string, IQueryable<Customer>>\n    customersByCity
    =\n    CompiledQuery.Compile<NorthwindEntities, string, IQueryable<Customer>>(\n        (context,
    city) =>\n            from c in context.Customers\n            where c.City ==
    city\n            select c\n    );

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: "In this code snippet, a familiar LINQ query is compiled with the help of the\
    \ `Compile` method of the `CompiledQuery` class and stored in a static field called\
    \ `customersByCity`. The compiled query itself is a lambda expression, which takes\
    \ an object context as its first parameter, a city as its second, and returns\
    \ an `IQueryable` of `Customer`. Typically, a compiled query like this is stored\
    \ in a static field of a class that performs the data access and can benefit from\
    \ compiled queries.\n\nThe data access code based on compiled queries is similar\
    \ to the traditional LINQ queries in that it still needs to create an `ObjectContext`,\
    \ like `NorthwindEntities` in this ongoing example. However, instead of using\
    \ LINQ queries directly, it calls the `Invoke` method of one or more of the compiled\
    \ query objects as shown here:\n\n```\n```csharp\nusing (NorthwindEntities context\
    \ = new NorthwindEntities())\n{\n    var customers = customersByCity.Invoke(context,\
    \ \"London\");\n    foreach (Customer c in customers)\n        Console.WriteLine(c.ContactName);\n\
    }\n```\n```\n\nThe work required to translate the compiled LINQ query into SQL\
    \ statement is performed the first time the compiled query is executed. So the\
    \ program will still take the performance hit the first time the compiled query\
    \ is executed in an AppDomain; however, all subsequent executions of the compiled\
    \ query will take advantage of the information cached by the Entity Framework\
    \ the first time and run faster.\n\nQuery composition defeats the caching logic\
    \ the Entity Framework uses and negates the benefits of query compilation. To\
    \ keep the benefits of query compilation, you need to compile the *entire* query\
    \ and avoid modifying it in any way. As an example, consider the code that follows,\
    \ which adds an orderby clause to the same compiled query used in the previous\
    \ sample:\n\n```\n```csharp\nvar customers = customersByCity.Invoke(context, \"\
    London\");\ncustomers = from c in customers\n            orderby c.ContactName\n\
    \            select c;\nforeach (Customer c in customers)\n    Console.WriteLine(c.ContactName);\n\
    ```\n```\n\nThe actual LINQ query executed in this sample is different from the\
    \ compiled query and cannot take advantage of the Entity Framework caching logic.\n\
    \nTo avoid doing this by accident, you can change the compiled query to return\
    \ an `IEnumerable` instead of an `IQueryable`.\n\n```\n```csharp\nstatic Func<NorthwindEntities,\
    \ string, IEnumerable<Customer>>\n    customersByCity =\n    CompiledQuery.Compile<NorthwindEntities,\
    \ string, IEnumerable<Customer>>(\n        (context, city) =>\n            from\
    \ c in context.Customers\n```\n```"
