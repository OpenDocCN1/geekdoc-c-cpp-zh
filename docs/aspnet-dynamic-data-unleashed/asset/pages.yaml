- pgno: 494
  md: "the GetQueryable method of the UnleashedMetaTable class associated with the\
    \ page. The same code samples are not repeated here; you can find the complete\
    \ details in the sample project accompanying this book.\n\n> NOTE\n> \n> The page\
    \ in Figure 14.9 does not display the grid columns and filters for the Employee\
    \ foreign key column of the Orders table. This is a result of the entity-level\
    \ authorization rules implemented by overriding the CanRead method of the MetaTable\
    \ class discussed earlier. In this example, the CanRead method allows reading\
    \ Employee entity information only to users in the Employee role. Combined with\
    \ the row-level filtering just implemented, the entity- and action-level authorization\
    \ gives you the ability to create a search page that is both dynamic and secure\
    \ at the same time.\n\n# Security Annotations\n\nTo recap what has been discussed\
    \ so far in this chapter, Dynamic Data offers two major methods for implementing\
    \ security. With Web configuration, you can define authorization rules on per-entity\
    \ and per-action basis and reject users who do not have appropriate permissions\
    \ to access dynamically generated pages. You can also extend the Dynamic Data\
    \ metadata API by overriding the available CanRead, CanInsert, CanUpdate, CanDelete,\
    \ and GetQuery methods. Unlike the web configuration alone, extending the meta\
    \ model not only prevents unauthorized access, but also performs UI trimming and\
    \ hides information and commands the users are not authorized to see.\n\nExtending\
    \ the metadata is clearly a superior way to implement security in Dynamic Data\
    \ web applications. However, real-world applications usually have a substantial\
    \ number of non-dynamic pages, implemented with ASP.NET WebForms or MVC. Any authorization\
    \ rules hard-coded into the custom CanRead, GetQuery, and other methods of the\
    \ MetaTable class are not useful to the rest of the application. On the other\
    \ hand, implementing authorization with web configuration does not allow you to\
    \ take full advantage of the Dynamic Data framework and pushes you to developing\
    \ custom pages much earlier than you might want.\n\nThis tradeoff is not unique\
    \ to security. You face a similar dilemma when implementing business rules; you\
    \ can solve this problem with the help of data annotations—general-purpose .NET\
    \ attributes that can be used by any presentation layer. As you recall from the\
    \ discussion in Chapter 8, “Implementing Entity Validation,” Dynamic Data makes\
    \ heavy use of validation and other attributes in the System.ComponentModel.DataAnnotations\
    \ namespace. The MVC framework supports the validation attributes as well, and\
    \ by using them, you can implement business rules in a way that works with both.\
    \ Moreover, by extending the Entity Framework’s ObjectContext, NorthwindEntities\
    \ class in this example, you can extend these benefits to all applications that\
    \ might need to access the Northwind database."
  merge: -1
  img_proc: true
- pgno: 495
  md: "By defining authorization rules and row-level security as data annotation attributes\
    \ applied to entity classes, you can implement a security system that is independent\
    \ of the specific presentation framework and equally useful in Dynamic Data as\
    \ well as traditional web pages of the application. Although no built-in attributes\
    \ enable you to accomplish this task, creating custom attributes is not difficult.\
    \ In this section, you learn about two custom attributes from the sample solution\
    \ that comes with this book—AuthorizationAttribute and CustomQueryAttribute—and\
    \ how the Dynamic Data and Entity Framework can be extended to take advantage\
    \ of them.\n\n> **NOTE**\n> \n> The accompanying sample solution illustrates the\
    \ security annotations discussed here to implement different levels of access\
    \ to the Northwind Traders website. You might want to refer to the running application\
    \ while reading this section.\n> \n> The web application uses Forms authentication\
    \ and defines three roles the users might have: Customer, Employee, and Manager.\
    \ Visitors can log in by clicking the \"Login\" link in the upper-right corner\
    \ of any web page. The login page lists several sample user accounts that can\
    \ be used to access the application in different roles.\n> \n> The unauthenticated\
    \ site visitors can only see the \"product catalog\"—the dynamic web pages for\
    \ the Product and Category entities. They cannot insert, update, or delete any\
    \ entities. This is implemented by applying the AuthorizationAttribute to every\
    \ entity class in the model and denying anonymous access to all entities with\
    \ the exception of Product and Category. Only these two entity classes allow Read\
    \ action for all users.\n> \n> When logged in, the users in the Customer role\
    \ can see not only the product catalog, but also their past orders and profile\
    \ information—the Order and Customer entities. The CustomQueryAttribute is used\
    \ with both of these entities to implement row-level security. Even though Northwind\
    \ Traders application assigns an employee for each order, customers cannot access\
    \ this information because they have no read access to the Employee entity. Customers\
    \ cannot modify any information.\n> \n> Users in the Employee role can read all\
    \ entities in the model; however, they can only change the Customer, Order, and\
    \ Order_Detail entities. Only the users in the Manager role can perform all actions—Read,\
    \ Insert, Update, and Delete for all entities in the model.\n\n# AuthorizationAttribute\n\
    \nAuthorizationAttribute is a custom .NET attribute you find in the Unleashed.DataAnnotations\
    \ project of the sample solution accompanying this book. It enables you to define\
    \ authorization rules for a given entity class or its actions similar to how you\
    \ would normally do it in the web configuration file. As you recall from the earlier\
    \ discussion in this chapter, here is how to configure security to allow only\
    \ users in Manager or Employee roles to access the dynamic Suppliers pages in\
    \ the sample application:"
  merge: -1
  img_proc: true
- pgno: 496
  md: "```\n<location path=\"SUPPLIERS\">\n  <system.web>\n    <authorization>\n \
    \     <allow roles=\"Manager, Employee\"/>\n      <deny users=\"*\"/>\n    </authorization>\n\
    \  </system.web>\n</location>\n```\n\nYou can define the same authorization rules\
    \ by applying the AuthorizationAttribute to the Supplier entity class, as shown\
    \ here:\n\n```\n[Authorization(\n  Allow.Roles, \"Manager\", \"Employee\",\n \
    \ Deny.Users, \"*\")]\npartial class Supplier { ... }\n```\n\nThe AuthorizationAttribute\
    \ constructor takes an open array of parameters, which can be used to define one\
    \ or more authorization rules. Rules start with values from one of the two enumerated\
    \ types—Allow or Deny, both of which have the same two items defined, Roles and\
    \ Users. In other words, the rules begin with Allow.Users, Allow.Roles, Deny.Users,\
    \ or Deny.Roles, followed by one or more strings that specify names of users or\
    \ roles, respectively. This allows you to mimic the web configuration rules such\
    \ as <allow roles=\"...\"/> with C# code that looks like this: Allow.Roles, \"\
    ...\". Although this is not a requirement, by convention, you place different\
    \ rules on different lines of code to make the rules easier to read.\n\n# NOTE\n\
    \nOnly one instance of the AuthorizationAttribute is allowed per class. Having\
    \ to define multiple authorization rules in a single attribute is not ideal. It\
    \ would be much cleaner if you could define authorization rules with separate\
    \ Allow and Deny attributes, similar to this:\n\n```\n[Allow(Roles = \"Manager,\
    \ Employee\")]\n[Deny(Users = \"*\")]\npartial class Supplier { ... }\n```\n\n\
    Unfortunately, the .NET runtime does not guarantee that the order of attributes\
    \ retrieved via reflection match the order of attributes in code. In this example,\
    \ the Deny attribute could have been returned first, which would deny access to\
    \ all users.\n\nThe .NET Framework also prevents attributes from having properties\
    \ of user-defined types, which rules out the possibility of defining the authorization\
    \ rules as custom Allow or Deny classes and using them similar to this:"
  merge: -1
  img_proc: true
- pgno: 497
  md: "```\n```csharp\n[Authorization(\n    new Allow(Roles = \"Manager, Employee\"\
    ),\n    new Deny(Users = \"*\")]\n```\n```\n\nWithout the ability to use multiple\
    \ attributes and custom types, you are left only with the primitive types, like\
    \ strings and enumerations, which can be used in constant expressions.\n\nThe\
    \ AuthorizationAttribute also enables you to define action-level permissions by\
    \ including one or more Actions in the rule. For instance, here is how to permit\
    \ employees to access suppliers in Read-only mode while still giving the managers\
    \ full access:\n\n```\n```csharp\n[Authorization(\n    Allow.Roles, \"Manager\"\
    ,\n    Allow.Roles, \"Employee\", Actions.Read,\n    Deny.Users, \"*\")]\npartial\
    \ class Supplier { ... }\n```\n```\n\nActions is an enumerated type shown next.\
    \ Notice that it represents a bit field, which enables you to specify multiple\
    \ actions in the same rule using the bitwise or operator (| in C#). For instance,\
    \ you could have employees allowed to read and update Suppliers by specifying\
    \ actions as Actions.Read | Actions.Update. Unless an Actions value is specified\
    \ in a rule explicitly, the AuthorizationAttribute assumes it to be All, which\
    \ is why the rule just described gives managers permission to perform all actions\
    \ and limits customers to read only access:\n\n```\n```csharp\n[Flags]\npublic\
    \ enum Actions\n{\n    None   = 0x00,\n    Read   = 0x01,\n    Insert = 0x02,\n\
    \    Update = 0x04,\n    Delete = 0x08,\n    All = Read | Insert | Update | Delete\n\
    }\n```\n```\n\nAs you can see, the AuthorizationAttribute enables you to express\
    \ entity- and action-level permissions on per-user or per-role basis. The resulting\
    \ annotations closely mimic the structure of the <authorization> configuration\
    \ section with the exception of the Actions parameter, which is not available\
    \ in the <allow/> and <deny/> elements. Although this difference may be confusing\
    \ at first, the resulting definitions of authorization rules is much more compact\
    \ than the typical web configuration needed for action-level rules due to the\
    \ need to create separate <location/> sections for each action. Attribute-based\
    \ authorization rules also allow you to change routing configuration without having\
    \ to update the rules in web.config."
  merge: -1
  img_proc: true
- pgno: 498
  md: "Now take a closer look at how this attribute is implemented and how it can\
    \ be used to extend the Dynamic Data meta model:\n\n```\n```csharp\n[AttributeUsage(AttributeTargets.Class)]\n\
    public class AuthorizationAttribute : Attribute\n{\n    public AuthorizationAttribute(params\
    \ object[] rules);\n    public ReadOnlyCollection<AuthorizationRule> Rules { get;\
    \ }\n    public bool IsAuthorized(IPrincipal principal, Actions actions);\n}\n\
    ```\n```\n\nThe main access point of the AuthorizationAttribute is the IsAuthorized\
    \ method. It takes an IPrincipal object, which represents a user of the application,\
    \ one or more Actions the user needs to perform, and returns a Boolean value that\
    \ indicates if he is permitted to do it. Before evaluating the rules for the first\
    \ time in a given attribute, the IsAuthorized method parses the open array of\
    \ objects specified in the constructor into a collection of AuthorizationRule\
    \ objects, exposed by the Rules property.\n\n```\n```csharp\npublic class AuthorizationRule\n\
    {\n    public bool Authorize { get; }\n    public Actions Actions { get; }\n \
    \   public ReadOnlyCollection<string> Roles { get; }\n    public ReadOnlyCollection<string>\
    \ Users { get; }\n}\n```\n```\n\nAlthough the main purpose of the AuthorizationRule\
    \ class is to assist in rule evaluation, you might find it useful when implementing\
    \ administrative functionality in your application. For instance, the metadata\
    \ explorer built into the sample application uses it to display security information\
    \ about entity types.\n\n> **NOTE**\n> \n> To mimic the default behavior of the\
    \ configuration-based authorization rules, the IsAuthorized method returns true\
    \ unless one or more of the requested actions are explicitly denied by a matching\
    \ rule. Just as discussed earlier in this chapter, it is important to include\
    \ a wild-card deny rule after specifying all appropriate allow rules to prevent\
    \ unauthorized access.\n\n# Implementing MetaTable Permission Methods with AuthorizationAttribute\n\
    \nYou can take advantage of the AuthorizationAttribute when overriding the CanRead,\
    \ CanInsert, CanUpdate, and CanDelete methods in your custom MetaTable class.\
    \ Here is how the CanDelete method is implemented in the UnleashedMetaTable (which\
    \ you can find in the Unleashed.DynamicData project of the sample solution accompanying\
    \ this book):"
  merge: -1
  img_proc: true
- pgno: 499
  md: "```\n```csharp\npublic partial class UnleashedMetaTable : MetaTable\n{\n  \
    \  private readonly AuthorizationAttribute authorizationAttribute;\n\n    public\
    \ UnleashedMetaTable(\n        UnleashedMetaModel model, TableProvider provider)\n\
    \        : base(model, provider)\n    {\n        this.authorizationAttribute =\
    \ this.Attributes\n            .OfType<AuthorizationAttribute>().FirstOrDefault();\n\
    \    }\n\n    private bool IsAuthorized(IPrincipal user, Actions actions)\n  \
    \  {\n        if (this.authorizationAttribute == null) return true;\n        return\
    \ this.authorizationAttribute.IsAuthorized(user, actions);\n    }\n\n    public\
    \ override bool CanDelete(IPrincipal user)\n    {\n        return base.CanDelete(user)\
    \ && this.IsAuthorized(user, Actions.Delete);\n    }\n}\n```\n```\n\nNotice how\
    \ the UnleashedMetaTable constructor tries to find the AuthorizationAttribute\
    \ that might be applied to the entity class this meta table object represents\
    \ and stores it in the authorizationAttribute field. Performing this step only\
    \ once, when the meta table object is created, is important to improve performance\
    \ of the application as the permission methods are called multiple times for each\
    \ page request.\n\nThe IsAuthorized method is responsible for determining whether\
    \ a given user is allowed to perform one or more Actions. This method is responsible\
    \ for checking whether the entity class has the AuthorizationAttribute applied\
    \ and if so, delegating the authorization to the attribute. If the entity class\
    \ does not have the AuthorizationAttribute, the method assumes that all users\
    \ are allowed to perform all actions for the entity and returns true. Although\
    \ this might not be very secure, it is consistent with the behavior of authorization\
    \ rules in the Web configuration file.\n\nThe overridden CanDelete method simply\
    \ calls the inherited implementation and the IsAuthorized method and returns true\
    \ if both of them return true. Implementation of the CanInsert, CanUpdate, and\
    \ CanRead methods is very similar. They only differ in the Actions values they\
    \ pass to the IsAuthorized method, for instance, the CanRead method uses the Actions.Read\
    \ instead of the Actions.Delete."
  merge: -1
  img_proc: true
- pgno: 500
  md: "```\npublic override bool CanRead(IPrincipal user)\n{\n    return base.CanRead(principal)\
    \ && this.IsAuthorized(user, Actions.Read);\n}\n```\n\nImplementation of the MetaTable\
    \ permission methods is much shorter with the AuthorizationAttribute than the\
    \ initial implementation with hard-coded rules for multiple entities within a\
    \ single method. Compare the last code snippet with the one here, which you saw\
    \ earlier in this chapter:\n\n```\npublic override bool CanRead(IPrincipal principal)\n\
    {\n    if (this.Name == \"Products\") return true;\n    if (this.Name == \"Categories\"\
    ) return true;\n    return principal.IsInRole(\"Employee\");\n}\n```\n\nOf course,\
    \ the code did not disappear; it simply moved from the meta model to the individual\
    \ entity classes:\n\n```\n[Authorization(\n    Allow.Roles, \"Manager\",\n   \
    \ Allow.Users, \"\", Actions.Read,\n    Deny.Users, \"*\")]\npartial class Product\
    \ { ... }\n```\n\nAlthough the security system with rules applied to entities\
    \ is more verbose and not as encapsulated, it is actually easier to maintain.\
    \ With the centralized, hard-coded implementation, there is always a risk of affecting\
    \ rules of unrelated entities with any change you make, and the real-world implementation\
    \ of security for an entity model of decent size would be many times bigger and\
    \ more complex than what we have in this sample. However, the more important benefit\
    \ is being able to enforce it consistently across dynamic and regular web pages\
    \ as well as other applications.\n\n# Extending ObjectContext to Authorize Insert,\
    \ Update, and Delete Actions\n\nYou can extend the Entity Framework ObjectContext\
    \ class to take advantage of the AuthorizationAttribute and prevent unauthorized\
    \ Insert, Update, and Delete actions. Doing so enables you to enforce the same\
    \ security rules in the custom pages of your web application that are already\
    \ enforced by the dynamic pages.\n\nBack in Chapter 8, the UnleashedObjectContext\
    \ base class was introduced to perform validation at the ObjectContext level.\
    \ Because authorization logic is so similar to validation, you can use the same\
    \ approach to implement it. Specifically, the authorization needs to happen in\
    \ the overridden SaveChanges method of the ObjectContext class before the inherited\
    \ implementation is called to persist the changes. Here is how this looks in the\
    \ UnleashedObjectContext class in the sample project:"
  merge: -1
  img_proc: true
- pgno: 501
  md: "```\npublic override int SaveChanges(SaveOptions options)\n{\n    IEnumerable<ObjectStateEntry>\
    \ stateEntries = this.ObjectStateManager\n        .GetObjectStateEntries(ChangedEntityStates)\n\
    \        .Where(stateEntry => !stateEntry.IsRelationship);\n\n    foreach (ObjectStateEntry\
    \ stateEntry in stateEntries)\n        this.BeforeSaveChanges(stateEntry);\n\n\
    \    return base.SaveChanges(options);\n}\n```\n\nWhen the SaveChanges method\
    \ is called, you could have multiple entities that were added, modified, and deleted.\
    \ The modifications are stored in the ObjectContext but not saved in the database\
    \ yet. The BeforeSaveChanges method ensures that each of these changes is valid\
    \ according to the business rules defined by the entity type. Authorization, being\
    \ a specialized form of business rules, fits this pattern as well and you can\
    \ extend the code to perform it. Here is a new version of this method with the\
    \ changes highlighted in bold font:\n\n```\nprivate void BeforeSaveChanges(ObjectStateEntry\
    \ stateEntry)\n{\n    Authorize(stateEntry.Entity.GetType(),\n        EntityStateToAction(stateEntry.State));\n\
    \n    var savable = stateEntry.Entity as ISavableObject;\n    if (savable != null)\n\
    \        savable.BeforeSave(stateEntry);\n\n    if (stateEntry.State != EntityState.Deleted)\n\
    \        this.Validate(stateEntry);\n}\n```\n\nFor each added, modified, or deleted\
    \ entity, the BeforeSaveChanges method now calls the Authorize method, passing\
    \ it the type of the entity and the action performed. Notice that the State property\
    \ of the ObjectStateEntry defines the action performed on an entity as a value\
    \ of the built-in enum type EntityState; however, the AuthorizationAttribute relies\
    \ on the custom Actions enum type instead. To translate between the two types,\
    \ you need a simple function, EntityStateToAction, shown here:\n\n```\nprivate\
    \ static Actions EntityStateToAction(EntityState state)\n{\n    switch(state)\n\
    \    {\n        case EntityState.Added:      return Actions.Insert;\n        case\
    \ EntityState.Modified:   return Actions.Update;\n        case EntityState.Deleted:\
    \    return Actions.Delete;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 502
  md: "```\n```csharp\ndefault: throw new ArgumentException(\"state\");\n}\n}\n```\n\
    ```\n\nThe Authorize method is responsible for throwing SecurityException (a built-in\
    \ exception class defined in the System.Security namespace) if the current user\
    \ is not authorized to perform a given set of actions for the specified entity\
    \ type. Here is how this method is implemented in the UnleashedObjectContext class:\n\
    \n```\n```csharp\nprivate static void Authorize(Type entityType, Actions action)\n\
    {\n    IPrincipal user = Thread.CurrentPrincipal;\n    if (!IsAuthorized(user,\
    \ entityType, action))\n    {\n        throw new SecurityException(string.Format(\n\
    \            \"User '{0}' is not authorized to {1} entities of type '{2}'.\",\n\
    \            user.Identity.Name, action, entityType.Name));\n    }\n}\n```\n```\n\
    \nTo obtain the IPrincipal object representing the current user of the application,\
    \ the Authorize method relies on the static property of the Thread class called\
    \ CurrentPrincipal. This is different from how you implemented the authorization\
    \ logic in the dynamic page templates earlier. There, you used the User property\
    \ of the Page class, and although the static User property of the HttpContext\
    \ class would be a closer alternative, using the Thread.CurrentPrincipal in the\
    \ UnleashedObjectContext avoids adding dependency on the ASP.NET to the business\
    \ layer.\n\nThe Authorize method delegates the task of evaluating the authorization\
    \ rules to the IsAuthorized method, which takes a user, an entity type, and a\
    \ set of actions as parameters and returns a boolean value, which indicates whether\
    \ the user is permitted to perform them. This method tries to find the AuthorizationAttribute\
    \ that might be applied to the entity class and, if found, calls its IsAuthorized\
    \ method to evaluate the authorization rules. If the AuthorizationAttribute cannot\
    \ be found, IsAuthorized method returns true, following the ASP.NET convention\
    \ of allowing access unless it is explicitly denied.\n\n```\n```csharp\nprivate\
    \ static readonly ConcurrentDictionary<Type, AuthorizationAttribute>\n    authorizationAttributes\
    \ = new ConcurrentDictionary<Type,\n        AuthorizationAttribute>();\n\nprivate\
    \ static bool IsAuthorized(IPrincipal user, Type entityType,\n    Actions action)\n\
    {\n    var authorizationAttribute = authorizationAttributes.GetOrAdd(\n      \
    \  entityType,\n        type => TypeDescriptor.GetAttributes(type)\n         \
    \   .OfType<AuthorizationAttribute>().FirstOrDefault());\n```\n```"
