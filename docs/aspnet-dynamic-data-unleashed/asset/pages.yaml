- pgno: 308
  md: "```\nthrow new ValidationException(\"Only draft orders can be deleted\");\n\
    }\n}\n```\n\nAs you recall from the previous discussion, a good rule of thumb\
    \ when designing validation logic is to implement persistence validation with\
    \ data annotations and transition validation with business rule methods. From\
    \ the validation standpoint, deletion is an odd ball because it can fit in either\
    \ of these two categories depending on your point of view. It may be helpful,\
    \ however, to treat entity deletion as a form of state transition. From this point\
    \ of view, the BeforeSave method becomes a special business rule method that can\
    \ be used to implement property interaction rules and validation of deletion.\n\
    \n# Reusing Entity Validation in Business Rule Methods\n\nWould it be possible\
    \ or beneficial to reuse the entity validation rules in business rule methods?\
    \ For instance, you have already implemented validation rules to prevent submitting\
    \ orders for out-of-stock items. Should the FulfillOrder method also check that\
    \ all items are in stock before updating the product inventory? Invoking entity\
    \ validation rules from a business rule method is certainly possible and could\
    \ be a good idea.\n\nAs discussed in Chapter 8, the UnleashedObjectContext class\
    \ was extended to perform validation of all entities before they are saved in\
    \ the database. It defines a method called Validate (see Listing 9.2), which takes\
    \ an ObjectStateEntry as a parameter and validates a single entity object. To\
    \ make invoking validation rules in business rule methods more clean and convenient,\
    \ UnleashedObjectContext also provides an overloaded version of this method (shown\
    \ next) that takes an entity object as a parameter. This method retrieves its\
    \ ObjectStateEntry from the ObjectStateManager, and calls the main Validate method.\n\
    \n```\npublic partial class UnleashedObjectContext\n{\n    protected void Validate(object\
    \ entity)\n    {\n        ObjectStateEntry stateEntry =\n            this.ObjectStateManager.GetObjectStateEntry(entity);\n\
    \        this.Validate(stateEntry);\n    }\n}\n```\n\nWith the new Validate method,\
    \ you could modify the FulfillOrder business rule method to check the order before\
    \ trying to fulfill it and ensure that it is valid according to all property-\
    \ and entity-level validation attributes and coded rules implemented for the Order\
    \ entity class.\n\n```\npublic partial class NorthwindEntities\n{\n    public\
    \ void FulfillOrder(Order order)\n    {\n```"
