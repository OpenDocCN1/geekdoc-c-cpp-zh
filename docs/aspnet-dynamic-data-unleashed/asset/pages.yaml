- pgno: 55
  md: '# CHAPTER 2


    # Entity Framework


    # IN THIS CHAPTER


    +   - Understanding Entity Model

    +   - LINQ to Entities

    +   - Entity Lifecycle

    +   - Entity Model in Depth

    +   - Stored Procedures


    Although it is possible to build ASP.NET Dynamic Data applications with plain
    ADO.NET data access components, some of its features, such as foreign key templates
    and filtering, require a modern, LINQ-enabled data access framework such as LINQ
    to SQL or Entity Framework.


    LINQ to SQL was introduced in Visual Studio 2008 and .NET Framework 3.5 as a database-specific
    implementation of LINQ—Language Integrated Query functionality in C# and Visual
    Basic. LINQ allows developers to use SQL-like queries directly in the application
    code as opposed to calling stored procedures or passing SQL statements as strings
    for execution to a database server. LINQ to SQL was quickly followed by the ADO.NET
    Entity Framework, released with .NET Framework 3.5 Service Pack 1. LINQ to SQL
    was designed for simplicity and close integration with Microsoft SQL Server; the
    Entity Framework was designed for maximum flexibility and multiple database platforms.


    Although LINQ-based data access code is much simpler than the traditional code
    based on ADO.NET, it represents a significant paradigm shift compared to the approach
    .NET and database developers have been trained to use for over a decade. The ways
    you retrieve and manipulate data and the way you submit changes and implement
    business logic are very different with LINQ-based data access frameworks, and
    using some of the old tricks and habits can lead you in the direction where you
    are fighting the framework instead of letting it help you.


    Because the ASP.NET Dynamic Data relies heavily on LINQ, developers need to have
    a working knowledge of the underlying data access framework to understand how
    its web controls work and how to customize them effectively.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'this chapter, you are given an overview of the ADO.NET Entity Framework from
    a pure data access perspective, avoiding the specifics related to ASP.NET web
    applications in general or Dynamic Data in particular. If you are already familiar
    with Entity Framework or LINQ to SQL, you can probably skip this chapter.


    # Understanding Entity Model


    The ADO.NET Entity Framework is an Object-relational mapping (ORM) framework developed
    by Microsoft as part of the .NET Framework. It allows developers to define entities,
    properties, and associations and map them to the underlying database tables and
    columns. In version 4.0, you typically create the entities and mappings using
    the Entity Designer in Visual Studio, which generates the application classes
    that can be used to query the database with LINQ and manipulate database records
    in a form of .NET objects.


    # Creating Entity Model


    To get started, you first need to add a new Entity Framework data model to your
    project (in this chapter, we work with a simple Console Application project template).
    Select the ADO.NET Entity Data Model item from the Data template category in the
    Add New Item dialog of Visual Studio, as shown in Figure 2.1.


    ![](img/11b373b78859e17d318fd76939a0df9d_56_0.png)


    FIGURE 2.1  Adding ADO.NET Entity Data Model to a project.


    After entering the file name and clicking Add, you see the Entity Data Model Wizard
    shown in Figure 2.2, which prompts you to either generate the model from an existing
    database or create an empty one. If the database already exists, choose the option
    to generate the model. You can choose the option to create an empty model if you
    are lucky enough to be working on a “green field” project for which the database
    does not yet exist and you want to rely on the Entity Framework to generate the
    database for you. In this'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'discussion, assume the first scenario and generate the model from the Northwind
    sample database.


    ![](img/11b373b78859e17d318fd76939a0df9d_57_0.png)


    FIGURE 2.2  Choosing to generate model from database.


    After clicking Next on the Choose Model Contents page of the Entity Data Model
    Wizard, your next step is to choose a connection that will be used to access the
    database, as shown in Figure 2.3. If you already defined a connection to the Northwind
    database in Visual Studio’s Server Explorer, you can choose it from the list of
    available connections. Otherwise, create a new connection that points to your
    Northwind sample database.


    Notice that the entity connection string includes information about the underlying
    database provider that will be used to connect to the database. Entity Framework
    relies on the ADO.NET providers for low-level database connectivity, and you can
    see the familiar connection information, such as Data Source and Initial Catalog,
    as part of the “provider connection string.”


    Just like with traditional ADO.NET applications, you have the option of storing
    the Entity Framework connection string in the application configuration file.
    This is usually a good idea: It avoids specifying the database server name and
    other connection information explicitly in application code. The Entity Framework
    does not relieve you from the duty of protecting database credentials. In this
    example, we are using integrated security and do not need to worry about a username
    and password in plain text in the configuration file. If you choose to specify
    database credentials, you need to secure the configuration file appropriately,
    such as by encrypting the connection string section.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/11b373b78859e17d318fd76939a0df9d_58_0.png)


    # FIGURE 2.3 Choosing Data Connection.


    When you have configured the connection and clicked Next on the Choose Your Data
    Connection page of the Entity Data Model Wizard, you are prompted to select the
    database objects to include in the model as shown in Figure 2.4. You can choose
    any number of existing Tables, Views, and Stored Procedures the wizard detects
    in the database. For now, choose a single table, Products, and click Finish.


    Usually you want to accept default values for the remaining options on this page.
    The option to Pluralize or singularize generated object names instructs the wizard
    to automatically determine appropriate entity names based on the table names.
    For databases, such as Northwind, where table names are in plural form (Products),
    the generated entity name will be singular (Product). This is desirable because
    in .NET applications, names of classes that represent a single object are usually
    in singular form, helping to distinguish them from collections that can have multiple
    items.


    The option to Include foreign key columns in the model determines whether columns
    like SupplierID of the Products table will be available in the application code.
    This is particularly useful for web applications that have to be stateless and
    cannot preserve entity objects between requests. The first version of Entity Framework
    released in .NET 3.5 SP1 did not support this option, and it exists today only
    for backward compatibility, allowing you to turn it off. Keep this option on unless
    you are working with a model created using previous versions of the framework.


    The Model Namespace setting refers to an internal namespace used by the model
    itself. It has nothing to do with the namespace of your application classes, and
    you can safely ignore it, leaving the default value suggested by the tool.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/11b373b78859e17d318fd76939a0df9d_59_0.png)


    FIGURE 2.4 Choosing database objects.


    When you click Finish, the Entity Data Model Wizard creates a new EDMX file, adds
    it to the project, and opens it in an Entity Designer window shown in Figure 2.5.


    The diagrams used by the Entity Framework should be familiar to most database
    developers because they closely resemble database and UML diagrams. The newly
    created entity, Product, is displayed as a rectangle with a list of scalar properties
    derived from the columns of the Products table.


    The Entity Designer relies on the Properties window of Visual Studio to display
    and allow you to modify various elements of the model, such as the names of the
    entity types, their access/visibility, properties, and so on. Explore the new
    entity model by selecting the entity and its property items in the Entity Designer
    and observing the information available in the Property Window. Notice that in
    addition to the names, data types, and other attributes, the Entity Designer also
    allows you to specify a short Summary and/or a Long Description for every item
    in the model, making it a reasonably good place to store developer-focused documentation
    of the data model—even though this information is not available in Dynamic Data
    applications by default.'
