- pgno: 138
  md: "# Creating an Entity Template\n\n*Entity Template* is a special type of user\
    \ control used by Dynamic Data to encapsulate presentation logic for a single\
    \ entity or a class that represents a single row from a database table. You can\
    \ create a custom entity template for the Customers table by simply extracting\
    \ the highlighted code from Listing 4.1 and placing it into a new user control,\
    \ `Customers.ascx`, in the `DynamicData\\EntityTemplates` folder of the web project,\
    \ which is where Dynamic Data looks for entity templates by default. Listing 4.3\
    \ shows markup of the new entity template.\n\nLISTING 4.3    Customer Entity Template\
    \ (Markup)\n\n```\n<%@ Control Language=\"C#\" CodeBehind=\"Customers.ascx.cs\"\
    \n    Inherits=\"WebApplication.DynamicData.EntityTemplates.CustomEntityTemplate\"\
    \ %>\n<label>ID:</label>\n<asp:DynamicControl runat=\"server\" DataField=\"CustomerID\"\
    \ />\n<label>Name:</label>\n<asp:DynamicControl runat=\"server\" DataField=\"\
    ContactName\" />\n<fieldset><legend>Address</legend>\n    <label>Street:</label>\n\
    \    <asp:DynamicControl runat=\"server\" DataField=\"Address\" /><br />\n   \
    \ <label>City:</label>\n    <asp:DynamicControl runat=\"server\" DataField=\"\
    City\" />\n    <label>State:</label>\n    <asp:DynamicControl runat=\"server\"\
    \ DataField=\"Region\" />\n    <label>Zip:</label>\n    <asp:DynamicControl runat=\"\
    server\" DataField=\"PostalCode\" />\n</fieldset>\n```\n\nAside from the `<%@\
    \ Control %>` directive, markup of the new Customers entity template is a true\
    \ copy and paste of the code from Listing 4.1.\n\n> **NOTE**\n> \n> Note that\
    \ the name of the control file, Customers.ascx, is significant. The file name,\
    \ without extension, needs to match the name of the MetaTable that describes the\
    \ Customer entity in the metadata, which is *Customers* (plural).\n\nThe user\
    \ control must inherit from a special class provided by the Dynamic Data, called\
    \ `EntityTemplateUserControl`, as shown in Listing 4.4. This simple base class\
    \ provides several properties, including Table, which returns a `MetaTable` instance\
    \ describing the entity and Mode, which could be Read Only, Insert, or Edit."
  merge: -1
  img_proc: true
- pgno: 139
  md: "# LISTING 4.4  Customer Entity Template (Code-Behind)\n\n```\n```csharp\nusing\
    \ System.Web.DynamicData;\n\nnamespace WebApplication.DynamicData.EntityTemplates\n\
    {\n    public partial class CustomerEntityTemplate : EntityTemplateUserControl\n\
    \    {\n    }\n}\n```\n```\n\nHaving defined the entity template, you can modify\
    \ the Customer Information page to take advantage of it by replacing the entire\
    \ contents of the FormView with a DynamicEntity control, as shown in Listing 4.5.\n\
    \n# LISTING 4.5  Customer Information Page with Entity Template (Markup)\n\n```\n\
    ```aspx\n<%@ Page Language=\"C#\"\n    MasterPageFile=\"~/Site.master\" CodeBehind=\"\
