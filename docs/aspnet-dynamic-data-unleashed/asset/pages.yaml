- pgno: 221
  md: 'When a user clicks one of the dynamic hyperlinks, page templates typically
    have to extract column values from the request query string. This is done with
    the help of the GetColumnValuesFromRoute method, which is used by the list page
    template and the GetDataKeyFromRoute method, which does the same thing for single-item
    templates.


    ```

    public virtual string GetDisplayString(object row);

    ```


    When a human-readable string representing a row or an entity is needed, you can
    use the GetDisplayString method. This is how the ForeignKey field and filter templates
    set the Text property of the ListItem objects for their DropDownList controls.
    This method takes into account the DisplayColumn of the MetaTable to locate the
    column whose value will serve as the display string.


    ```

    public string GetPrimaryKeyString(IList<object> primaryKeyValues);

    public string GetPrimaryKeyString(object row);

    ```


    If you need a string that can be used to uniquely identify an entity and enable
    retrieving it from database later, you can use one of the GetPrimaryKeyString
    overloads. This is how the ForeignKey field and filter templates generate the
    Value property of the ListItem objects in their DropDownList controls.


    # Security Support


    Last, but not least, the MetaTable class includes a set of virtual methods that
    can be used to implement table-level authorization. The default implementation
    of these methods returns true, making all tables accessible for all users, as
    long as these tables are scaffolded. Chapter 14 discusses how Dynamic Data applications
    can take advantage of this extensibility mechanism to implement role-based UI
    trimming:


    ```

    public virtual bool CanDelete(IPrincipal principal);

    public virtual bool CanInsert(IPrincipal principal);

    public virtual bool CanRead(IPrincipal principal);

    public virtual bool CanUpdate(IPrincipal principal);

    ```


    # The MetaColumn Class


    The MetaColumn class describes a single property of an entity class. In the Northwind
    data model, where the Product entity class represents the Products database table,
    Dynamic Data creates a separate instance of the MetaColumn class for each property
    the Product entity class defines, including primitive properties, like ProductID,
    ProductName, CategoryID, and SupplierID as well as navigation properties like
    Category and Supplier.


    The navigation properties of entity classes are represented by the MetaForeignKeyColumn
    and MetaChildrenColumn classes derived from the MetaColumn class. These classes
    are discussed later in this chapter; this section focuses on the common properties
    of all meta columns and their specialized descendants.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# Property Definition\n\nA .NET property is defined by its name, type, and\
    \ accessibility of its getter and setter.\n\n```\n```csharp\npublic string Name\
    \ { get; }\n```\n```\n\nThe Name property of the MetaColumn class returns the\
    \ name of the entity property. It is a raw, internal string that can be used to\
    \ identify the column but might not be appropriate for display to end users.\n\
    \n```\n```csharp\npublic Type ColumnType { get; }\npublic TypeCode TypeCode {\
    \ get; }\n```\n```\n\nThe ColumnType property returns a Type object that represents\
    \ the .NET type of the entity property. For the ProductName property of the Product\
    \ entity, this would be a typeof(string). The TypeCode property, on the other\
    \ hand, returns one of the members of the TypeCode enumeration, and for the ProductName\
    \ column, this would be TypeCode.String.\n\n```\n```csharp\npublic bool IsBinaryData\
    \ { get; }\npublic bool IsFloatingPoint { get; }\npublic bool IsInteger { get;\
    \ }\npublic bool IsLongString { get; }\npublic bool IsString { get; }\n```\n```\n\
    \nA set of convenience properties is also available to determine a higher-level\
    \ group of the property's data types. For example, the IsFloatingPoint property\
    \ returns true for Float, Double, and Decimal columns; the IsInteger property\
    \ works similarly for Byte, Int16, Int32, and Int64 columns. The IsLongString\
    \ property returns true if the MaxLength of the string exceeds one billion characters\
    \ (1,073,741,819 to be exact). In practical terms, this means memo columns, TEXT\
    \ and NTEXT in Microsoft SQL Server, and determines whether a MultiLineText field\
    \ template will be used for this column by default.\n\n```\n```csharp\npublic\
    \ int MaxLength { get; }\n```\n```\n\nFor binary and string columns, the MaxLength\
    \ property returns the maximum length allowed for the column values in the data\
    \ model. For example, the ProductName column of the Products table is limited\
    \ to 40 characters, and the MaxLength property would return 40 by default.\n\n\
    ```\n```csharp\nusing System.ComponentModel.DataAnnotations;\n\n[MetadataType(typeof(Product.Metadata))]\n\
    partial class Product\n{\n    public class Metadata\n    {\n```\n```"
