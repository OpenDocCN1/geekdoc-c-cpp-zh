- pgno: 224
  md: 'The Provider property of the MetaColumn class returns the original ColumnProvider
    that was used to create the current MetaColumn instance from the information extracted
    from the data model by the metadata provider. Though you should not need to access
    the underlying column provider directly, it is accessible through this property.


    # Property Kind


    In addition to the name and type of the entity property, Dynamic Data also needs
    to know what kind of property it is, or in other words, if the property plays
    a special role in the entity class.


    ```

    public bool IsPrimaryKey { get; }

    ```


    The IsPrimaryKey property of the MetaColumn class returns true for entity properties
    that are a part of the entity''s primary key. With surrogate primary keys being
    prevalent in database design today, most entity classes have a single property
    in their primary keys. However, compound primary keys are also supported. Primary
    key columns can be accessed quickly using the PrimaryKeyColumns property of the
    MetaTable class.


    > **NOTE**

    > An entity class must have a primary key for Entity Framework and LINQ to SQL
    to be able to update rows in its database table. When reverse-engineering an existing
    database into a data model, Visual Studio can automatically determine the primary
    keys for tables but not views. If your data model must include views, you might
    have to edit the model manually to provide the missing information about primary
    keys.


    ```

    public bool IsForeignKeyComponent { get; }

    ```


    The IsForeignKeyComponent property of the MetaColumn class returns true for those
    primitive properties that are a part of one or more navigation foreign key properties.
    For example, the SupplierID property of the Product entity is a component of a
    foreign key represented by the Supplier navigation property and the IsForeignKeyComponent
    property of the MetaColumn object describing the SupplierID property returns true.


    The foreign key component properties have a special meaning in Dynamic Data applications
    because they should not be presented to the users under normal circumstances.
    It would not be very helpful to have a TextBox for entering SupplierID values
    in raw integer form. Instead, the navigation property, Supplier in this case,
    is presented as a DropDownList, or another appropriate control, with which users
    can choose a supplier instead of having to enter their IDs.


    ```

    public bool IsGenerated { get; }

    ```


    The IsGenerated property of the MetaColumn class returns true for those properties
    whose values are automatically generated by the database server. With Microsoft
    SQL Server, this includes IDENTITY columns for which the server generates an incremental
    value for each'
  merge: -1
  img_proc: true
