    > > **NOTE**

    > >

    > > Neither of the two approaches to metadata types discussed here is perfect.
    The nested classes approach results in the best encapsulation; there are no additional
    types that are introduced at the assembly level. This helps to reduce confusion
    and makes metadata classes impossible to misuse. The interfaces approach makes
    maintaining the metadata types easier but results in additional interface types
    introduced in the data model assembly. The interfaces can be declared as internal,
    but they will still be visible and possible to misuse in the data model assembly
    itself. In the end, the decision on whether to use nested classes or interfaces
    for data annotations will probably depend on your personal taste.


