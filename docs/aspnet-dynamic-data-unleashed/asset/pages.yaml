- pgno: 21
  md: '# CHAPTER 1


    # Getting Started


    Dynamic Data is an extension of the ASP.NET WebForms framework. It includes a
    number of new controls for rendering common UI elements dynamically, including
    data entry fields, forms, lists, and search criteria. These controls complement
    the standard ASP.NET controls—GridView, FormView, DetailsView, and ListView—and
    serve as building blocks for creating new or improving existing web pages.


    Dynamic controls are not a black box. They rely on templates included in the Web
    projects and can be customized by developers. At run time, the dynamic controls
    rely on metadata to locate and render the templates appropriate for a particular
    model element. For example, when rendering a data entry control for a foreign
    key column, Dynamic Data chooses a template with a drop-down list. However, when
    rendering control for a string column, it chooses a template with a text box.


    Dynamic Data supports a number of existing LINQ-based data models, including LINQ
    to SQL and Entity Framework. In addition to the powerful and easy-to-use data
    access functionality, these frameworks also provide rich metadata APIs that get
    you detailed information about tables in the data model, including their names,
    attributes, data types, and relationships. Because these APIs are different, Dynamic
    Data provides its own metadata API that hides the inconsistencies and exposes
    information most relevant to user interface development. This approach helps to
    keep the user interface code largely independent from the underlying data access
    framework. With the exception of the many-to-many field template, unique to the
    Entity Framework, most


