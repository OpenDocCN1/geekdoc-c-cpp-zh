- pgno: 418
  md: "The code-behind file, shown in Listing 12.5, performs not only the required\
    \ step of associating a MetaTable object with the GridView control, but also initializes\
    \ the Include property of the EntityDataSource control. In dynamic page templates,\
    \ this step is performed by the DynamicDataManager control. In this sample page,\
    \ it is required to eagerly load the parent entities, Product and Order, referenced\
    \ by the foreign key properties of the child Order_Detail entity. Implementation\
    \ of the Parent field template assumes that the parent entity object is available\
    \ during data binding. Without eager loading, this would either result in an error,\
    \ if the lazy loading option was turned off, or multiple queries would be sent\
    \ to the database to retrieve parent entities individually.\n\n# LISTING 12.5\
    \ List Page with Columns from Multiple Related Entities (Code-Behind)\n\n```\n\
    ```csharp\nusing System;\nusing System.Web.DynamicData;\n\nnamespace WebApplication.Samples.Ch12.ParentFieldTemplate\n\
    {\n    public partial class SamplePage : System.Web.UI.Page\n    {\n        protected\
