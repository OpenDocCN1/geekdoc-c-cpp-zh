  md: "# LISTING 6.10 Continued\n\n```\n    Total: <asp:Literal ID=\"totalLiteral\"\
    \ runat=\"server\" />\n    </td>\n    </tr>\n</table>\n</asp:Content>\n```\n\n\
    Note that unlike in the generic List page template, the GridView in this custom\
    \ page does not rely on the DynamicDataManager control for initialization. The\
    \ main reason is that the DynamicDataManager determines which MetaTable to associate\
    \ with its target controls based on the information in the URL route. In this\
    \ case, the URL route contains the table name Orders, but you need to associate\
    \ the GridView control with the Order Details table and need to do this in the\
    \ code-behind, as shown in Listing 6.11.\n\nYou also do not want to rely on the\
    \ DynamicDataManager to initialize the GridView control because we need a specific\
    \ set of columns to display the order details. You could display them all by assigning\
    \ the DefaultAutoFieldGenerator to the ColumnsGenerator property of the GridView\
    \ control; however, this would also include the Order column, which you can see\
    \ on the default List page of the Order Details table back in Figure 6.8. Because\
    \ the entire Order will be already displayed on the new page, including this column\
    \ would be redundant. Although you could hide it by manipulating the entity metadata,\
    \ it is important to remember that this custom page template does not have to\
    \ be dynamic. This task is much easier to accomplish by specifying the required\
    \ Columns explicitly in the page markup, as the DynamicField instances for the\
    \ Product, UnitPrice, and Quantity properties we want to display.\n\nAnother important\
    \ difference here is that initialization of the gridDataSource instance of the\
    \ EntityDataSource control is performed directly in markup, with ConnectionString,\
    \ DefaultContainerName, EntitySetName, and Include properties being \"hard-coded\"\
    \ for the purposes of this custom page, where you know exactly which entity it\
    \ needs to query and don't need to make the code dynamic. However, this code continues\
    \ to rely on the DynamicRouteExpression in the second QueryExtender control, which\
    \ conveniently limits the set of Order Details instances retrieved from the database\
    \ based on the OrderID column value extracted from the page request URL.\n\n#\
    \ LISTING 6.11 Custom Order Details Page Template (Code-Behind)\n\n```\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Data.Objects;\nusing\
    \ System.Linq;\nusing System.Web.DynamicData;\nusing System.Web.UI.WebControls;\n\
    using DataModel;\n```"
