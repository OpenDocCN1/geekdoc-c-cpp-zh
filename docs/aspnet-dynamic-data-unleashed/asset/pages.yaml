  md: "# The MetaModel Class\n\nThe MetaModel class serves as a root access point\
    \ for Dynamic Data components to find information about the tables. In particular,\
    \ the dynamic URL routing functionality relies on the MetaModel to determine if\
    \ the incoming request is valid and route it to the appropriate page template.\
    \ Although multiple instances are supported, a typical Dynamic Data application\
    \ contains a single MetaModel, created and initialized in the Global.asax as shown\
    \ in the following example:\n\n```\npublic class Global : HttpApplication\n{\n\
    \    public static readonly MetaModel DefaultModel = new MetaModel();\n    void\
    \ Application_Start(object sender, EventArgs e)\n    {\n        DefaultModel.RegisterContext(typeof(NorthwindEntities));\n\
    \    }\n}\n```\n\n# Data Model Registration\n\nThe MetaModel instance is initially\
    \ empty and requires a call to one of the RegisterContext methods to populate\
    \ it with MetaTable objects:\n\n```\npublic void RegisterContext(Type contextType);\n\
    public void RegisterContext(Func<object> contextFactory);\npublic void RegisterContext(DataModelProvider\
    \ dataModelProvider);\n```\n\nIn the simplest case, you can initialize the MetaModel\
    \ by calling the RegisterContext method that takes a type object such as typeof(NorthwindEntities)\
    \ in the example just shown. MetaModel has built-in support for Entity Framework\
    \ and LINQ to SQL and expects a type derived from ObjectContext or DataContext,\
    \ respectively. Using this type, Dynamic Data creates a new instance of the context\
    \ class whenever a context is required at run time. Any context class registered\
    \ this way must have a default constructor.\n\nIf your context class doesn't have\
    \ a default constructor or if you need to perform additional initialization steps,\
    \ you can use the RegisterContext method that takes a context factory delegate\
    \ as a parameter:\n\n```\npublic static readonly MetaModel DefaultModel = new\
    \ MetaModel();\nvoid Application_Start(object sender, EventArgs e)\n{\n    DefaultModel.RegisterContext(this.CreateContext);\n\
    }\n\nprivate object CreateContext()\n{\n    NorthwindEntities context = new NorthwindEntities();\n\
    ```"
