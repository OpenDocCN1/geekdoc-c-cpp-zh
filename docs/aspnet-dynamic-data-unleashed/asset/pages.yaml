    \nFIGURE 8.4  Generating static constructor in the text template.\n\n# Automated\
    \ Testing\n\nDue to its importance and relatively low rate of change, business\
    \ logic in general and the validation logic in particular are good candidates\
    \ for automated testing. Encapsulating the business logic in the context and entity\
    \ classes partially generated by the Entity Framework enables focused testing\
    \ directly at the business level. Unlike testing through the user interface, which\
    \ depends on a particular presentation layer, such as the ASP.NET WebForms, and\
    \ often requires manual testing or use of specialized tools, testing at the business\
    \ level can be done through the application’s internal APIs with general-purpose\
    \ frameworks, such as NUnit or the Visual Studio unit-testing framework.\n\nAutomated\
    \ testing is one of the most powerful tools you can use to improve and maintain\
    \ the quality of your application. However, like many expensive and powerful tools,"
