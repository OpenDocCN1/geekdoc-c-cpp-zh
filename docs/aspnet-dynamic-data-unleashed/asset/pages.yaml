    \nHowever, the MaxLength property can also be changed by applying the StringLengthAttribute\
    \ to the entity property in code, as just shown.\n\n```\npublic virtual bool IsReadOnly\
    \ { get; }\n```\n\nThe IsReadOnly property of the MetaColumn class returns true\
    \ if the entity property value cannot be set by users. A property can be read-only\
    \ if its setter is not accessible or doesn't exist. The latter option does not\
    \ apply to entity classes generated by Entity Framework and LINQ to SQL, where\
    \ a property must have a setter for the framework to be able to set its value\
    \ based on information retrieved from the database. Both of these frameworks,\
    \ however, support lower visibility (protected or internal) for property setters.\n\
    \nIn addition to changing definition of the entity property in the model, you\
    \ can also make it read-only by applying the EditableAttribute defined in the\
    \ System.ComponentModel.DataAnnotations namespace.\n\n```\nusing System.ComponentModel.DataAnnotations;\n\
    ```\n\n```\n[MetadataType(typeof(Product.Metadata))]\npartial class Product\n\
    {\n    public class Metadata\n    {\n        [Editable(false)]\n        public\
    \ object ProductName { get; set; }\n    }\n}\n```\n\nYou can also achieve the\
    \ same effect and make a property read-only for Dynamic Data purposes by applying\
    \ the ReadOnlyAttribute defined in the System.ComponentModel namespace. However,\
    \ the EditableAttribute also allows providing additional metadata information\
    \ to allow editing separately for Insert and Update modes.\n\n```\npublic PropertyInfo\
    \ EntityTypeProperty { get; }\n```\n\nThe EntityTypeProperty of the MetaColumn\
    \ class returns an instance of the PropertyInfo class defined in the System.Reflection\
    \ namespace. PropertyInfo contains a low-level .NET metadata describing the property.\
    \ It also allows you to dynamically get or set the value of the entity property\
    \ by calling the GetValue and SetValue methods of the PropertyInfo class.\n\n\
    ```\npublic ColumnProvider Provider { get; }\n```"
