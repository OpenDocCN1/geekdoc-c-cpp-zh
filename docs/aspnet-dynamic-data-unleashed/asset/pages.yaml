    \ Figure 9.6 shows how this text template was modified to automatically generate\
    \ a `DefaultValueAttribute` for each property that has a default value defined\
    \ in the model.\n\n![](img/11b373b78859e17d318fd76939a0df9d_289_0.png)\n\n**FIGURE\
    \ 9.6**  Entity Framework text template modified to generate `DefaultValueAttribute`.\n\
    \nYou can locate the part of the text template responsible for generating declarations\
    \ of primitive properties, such as the `UnitsInStock`, by searching for the `WritePrimitiveTypeProperty`\
