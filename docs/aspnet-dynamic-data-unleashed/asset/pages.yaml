  md: 'For consistency with the built-in implementation in the DynamicField, the getter
    of the overridden SortExpression property is a bit more verbose than it could
    have been had you simply called the inherited implementation. It first checks
    the ViewState to determine if the value was set explicitly, such as when the SortExpression
    attribute was specified in page markup. Otherwise, the getter looks for the CustomPropertyAttribute
    applied to the property and returns its Expression property, Supplier.Country
    in this example. In the absence of the CustomPropertyAttribute, the getter falls
    back to the default sort expression supplied by the MetaColumn, which matches
    the name of the entity property—Country. The inherited getter implementation was
    not called because it wouldn''t allow to distinguish between a SortExpression
    specified explicitly and a default value determined based on the property name.


    With the CustomPropertyAttribute implemented and UnleashedField updated to support
    it, you enable Dynamic Data list pages to support sorting of columns based on
    custom properties. Figure 13.7 shows a screenshot of the Products list page that
    was sorted by clicking the header of the Country column. Notice that thanks to
    the EntityDataSource control, processing of both sorting and paging is still delegated
    to SQL Server. In other words, it is performed without fetching all data from
    the database, even when you click a column that represents a custom property.


