- pgno: 486
  md: "cannot simply check the delete permission in the OnPreInit method of the page\
    \ because that would prevent users without the delete permission from being able\
    \ to access it at all. Instead, you can handle the ItemDeleting event of the FormView\
    \ control or the RowDeleting event of the GridView control and check user permissions\
    \ there. Alternatively, to make implementation simpler and more consistent between\
    \ the Details and List page templates, you can also handle the Deleting event\
    \ of the EntityDataSource control, which works the same way with both UI controls.\
    \ Here is the markup:\n\n```\n<asp:EntityDataSource ID=\"dataSource\" runat=\"\
    server\" EnableDelete=\"true\" OnDeleting=\"DataSource_Deleting\" />\n```\n\n\
    In the event handler, you simply call the CanDelete method of the MetaTable object\
    \ associated with the page, redirect users without the delete permission to the\
    \ login page, similar to the one shown back in Figure 14.5, and terminate further\
    \ request processing:\n\n```\nprotected void DataSource_Deleting(object sender,\
    \ EventArgs e)\n{\n    if (!this.table.CanDelete(this.User))\n    {\n        FormsAuthentication.RedirectToLoginPage();\n\
    \        this.Response.End();\n    }\n}\n```\n\n# Modifying Page Templates to\
    \ Hide Inaccessible Actions\n\nThe dynamic List page displays links that allow\
    \ users to Insert, Edit, Delete, and see Details of entities. Likewise, the Details\
    \ page displays the links that allow users to Edit and Delete the current entity.\
    \ If you want the users of the application to see these links regardless of whether\
    \ they are authorized to perform the actions, nothing else needs to be changed.\
    \ The out-of-the box page templates already display them, and if the user tries\
    \ to perform an unauthorized action, with the changes already put in place in\
    \ the previous section, he is redirected to a login page similar to that shown\
    \ in Figure 14.5. However, if you want to implement security trimming and hide\
    \ the actions that users cannot perform, several additional changes in the page\
    \ templates are required.\n\nIn the List page template, the Details link takes\
    \ the user to the Details page where they can “read” a single record or entity\
    \ instance of the same entity type. Like the List page itself, it requires the\
    \ user to have the CanRead permission. Therefore, if the user is authorized to\
    \ see the List page, she is also authorized to see the Details page, and you don't\
    \ need to worry about hiding or showing the Details link dynamically. The Edit,\
    \ Insert, and Delete actions, however, require the CanUpdate, CanInsert, and CanDelete\
    \ permissions, respectively, and you need to hide the links if the user is not\
    \ authorized to perform them.\n\nHere is the (abbreviated) markup to recap how\
    \ the List page template implements the action links:"
  merge: -1
  img_proc: true
- pgno: 487
  md: "```\n<asp:GridView ID=\"gridView\" runat=\"server\">\n  <Columns>\n    <asp:TemplateField>\n\
    \      <ItemTemplate>\n        <asp:DynamicHyperLink runat=\"server\" Action=\"\
    Edit\" Text=\"Edit\" />\n        <asp:DynamicHyperLink runat=\"server\" Action=\"\
    Delete\" Text=\"Delete\" />\n        <asp:DynamicHyperLink runat=\"server\" Text=\"\
    Details\" />\n      </ItemTemplate>\n    </asp:TemplateField>\n  </Columns>\n\
    </asp:GridView>\n\n<asp:DynamicHyperLink ID=\"insertLink\" runat=\"server\">\n\
    \  Insert new item\n</asp:DynamicHyperLink>\n```\n\nThe Edit and Delete hyperlink\
    \ controls are generated dynamically, a separate instance for each row displayed\
    \ in the GridView control. The best way to manipulate them in this scenario is\
    \ by specifying an OnInit event handler. Here is how you need to modify markup\
    \ of the Edit hyperlink:\n\n```\n<asp:DynamicHyperLink runat=\"server\" Action=\"\
    Edit\" Text=\"Edit\" OnInit=\"EditLink_Init\" />\n```\n\nIn the code-behind, you\
    \ access the dynamically generated control through the sender argument the event\
    \ handler receives. To determine if the user should see the Edit link, call the\
    \ CanUpdate of the MetaTable object associated with the current page. Based on\
    \ the boolean value it returns, you simply set link's Visible property to show\
    \ or hide it:\n\n```\nprotected void EditLink_Init(object sender, EventArgs e)\n\
    {\n    ((DynamicHyperLink)sender).Visible = this.table.CanUpdate(this.User);\n\
    }\n```\n\nSimilar changes are needed for the Delete and Insert hyperlinks in the\
    \ List page template as well. In other words, in page markup, you need to specify\
    \ the OnInit event handlers for both of these controls. In the code-behind, create\
    \ the event handlers and implement them by calling CanDelete and CanInsert methods\
    \ of the MetaTable class, respectively. Because the code is so similar to what\
    \ was done for the Edit link, it is not shown here; you can find it in the sample\
    \ project accompanying the book."
