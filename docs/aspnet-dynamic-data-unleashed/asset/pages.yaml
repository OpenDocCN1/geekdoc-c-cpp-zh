- pgno: 202
  md: "runtime. In particular, notice the Routes collection is used to generate a\
    \ dynamic URL and not a single particular route object. This is significant because\
    \ the Routes collection evaluates routes one by one, in the order they were registered,\
    \ looking for the route matching the supplied set of parameter values. As soon\
    \ as the match is found, the further evaluation is stopped, and the matching route\
    \ is used to generate the URL.\n\nA similar evaluation process occurs when the\
    \ ASP.NET runtime needs to find a page template to handle an incoming web request.\
    \ It starts with the route that was registered first and goes down the list until\
    \ it finds the first match. All other routes that were registered after the first\
    \ match are ignored.\n\nKeeping in mind how the route evaluation process works,\
    \ register the most specific routes first, leaving the more generic routes until\
    \ the end. For example, if you had registered the following two routes in this\
    \ order, your web application would always ignore the second route when generating\
    \ dynamic hyperlinks:\n\n```\n```csharp\nRouteTable.Routes.Add(new DynamicDataRoute(\"\
    {table}/{action}.aspx\"));\nRouteTable.Routes.Add(new DynamicDataRoute(\"{table}\"\
    )\n{\n    Action = PageAction.List\n});\n```\n```\n\nIn other words, a Product\
    \ List hyperlink would always be presented to users as http://localhost/Products/List.aspx\
    \ and never as http://localhost/Products. However, when handling incoming requests,\
    \ the second URL would not match the first route, “fall through,” and still get\
    \ picked up by the second route.\n\nChanging the order of route registrations\
    \ gives you a fair amount of control over the URL resolution process. However,\
    \ when this is insufficient, you can use route constraints to make it more specific.\
    \ Route constraints are defined in the Constraints dictionary of a route object\
    \ as pairs of two string values, where first is a parameter name, and second is\
    \ a regular expression pattern that the parameter value must match. The following\
    \ example defines a route where the table parameter value can be either Products\
    \ or Orders:\n\n```\n```csharp\nRouteTable.Routes.Add(new DynamicDataRoute(\"\
    {table}\")\n{\n    Action = PageAction.List,\n    Constraints = new RouteValueDictionary(){{\"\
    table\",\"Products|Orders\"}}\n});\nRouteTable.Routes.Add(new DynamicDataRoute(\"\
    {table}/{action}.aspx\"));\n```\n```\n\nBased on the route definitions in this\
    \ last example, only the Products and Orders tables will have the List URLs generated\
    \ as http://localhost/Products or http://localhost/Orders. All other tables will\
    \ use the second route and have URLs similar to http://localhost/Suppliers/List.aspx."
  merge: -1
  img_proc: true
- pgno: 203
  md: "# ViewName Route Parameter\n\nIn the examples of URL routing discussed so far,\
    \ the action parameter has always matched the name of the page template configured\
    \ to handle it, such as the Details.aspx page template, which handled the Details\
    \ page action, and the List.aspx page template, which handled the List action.\
    \ Having a page template implement a single action makes it focused and easy to\
    \ maintain. Compared to a traditional ASP.NET WebForms approach (where a single\
    \ page often tries to support all three item-level actions—Insert, Edit, and Details),\
    \ single-action page templates are usually simpler. However, you are not limited\
    \ to having one-to-one relationships between actions and page templates.\n\nIf\
    \ this makes sense in your application, you can have a single page template handle\
    \ multiple actions. Visual Studio project templates for Dynamic Data web applications\
    \ include an example of such a page template called ListDetails.aspx. This template\
    \ combines a GridView control similar to the one in the List page template and\
    \ a FormView control that displays details of the row currently selected in the\
    \ grid. This page template can be registered to handle both List and Details actions\
    \ as shown in this example:\n\n```\nRouteTable.Routes.Add(new DynamicDataRoute(\"\
    {table}\")\n{\n    Action = PageAction.List,\n    ViewName = \"ListDetails\"\n\
    });\n\nRouteTable.Routes.Add(new DynamicDataRoute(\"{table}\")\n{\n    Action\
    \ = PageAction.Details,\n    ViewName = \"ListDetails\"\n});\n```\n\nIt is actually\
    \ the ViewName property of the DynamicDataRoute class that determines the name\
    \ of the page template that will be used to handle the request. If the ViewName\
    \ was not provided by the route definition, Dynamic Data will assume it to be\
    \ the same as the Action parameter. Separation of Action from ViewName allows\
    \ Dynamic Data web applications to change implementation of page templates without\
    \ breaking the navigation in existing ASPX pages.\n\n# Page Template Lookup Rules\n\
    \nFigure 6.10 summarizes the algorithm Dynamic Data uses to find an appropriate\
    \ page template and handle an incoming web request. Most of the power and flexibility\
    \ in this process comes from the ASP.NET routing."
