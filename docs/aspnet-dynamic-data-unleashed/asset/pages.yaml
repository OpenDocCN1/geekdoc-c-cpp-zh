  md: "The code-behind only needs to associate the required `MetaTable` object with\
    \ the `GridView` control. This allows the `DynamicFilter` control to locate the\
    \ `MetaColumn` objects based on the column names specified in their `DataField`\
    \ properties.\n\n# QueryableFilterRepeater Control\n\nThe DynamicFilter control\
    \ is the right choice for implementing filtering functionality if you need to\
    \ build a custom search page with specific search criteria. However, if you need\
    \ to build an advanced search page where users can search for data using any of\
    \ the supported columns or a dynamic search page that can work for different tables,\
    \ you can also use the QueryableFilterRepeater control. Listing 5.7 shows how\
    \ you can modify the search page to take advantage of it.\n\n**LISTING 5.7** Search\
    \ Page with QueryableFilterRepeater Control (Markup)\n\n```\n```aspx\n<%@ Page\
    \ Title=\"\" Language=\"C#\"\n    MasterPageFile=\"~/Site.master\" CodeBehind=\"\
    SamplePage.aspx.cs\"\n    Inherits=\"WebApplication.Samples.Ch05.QueryableFilterRepeater.SamplePage\"\
    \ %>\n\n<asp:Content ContentPlaceHolderID=\"main\" runat=\"server\">\n    <asp:QueryableFilterRepeater\
    \ runat=\"server\" ID=\"filterRepeater\">\n        <ItemTemplate>\n          \
    \  <%# Eval(\"DisplayName\") %>:\n            <asp:DynamicFilter ID=\"DynamicFilter\"\
    \ runat=\"server\" />\n        </ItemTemplate>\n    </asp:QueryableFilterRepeater>\n\
    \    <asp:Button runat=\"server\" Text=\"Find\" />\n    <asp:GridView ID=\"gridView\"\
    \ runat=\"server\" DataSourceID=\"dataSource\" />\n    <asp:EntityDataSource runat=\"\
    server\" ID=\"dataSource\"\n        ConnectionString=\"name=NorthwindEntities\"\
    \n        DefaultContainerName=\"NorthwindEntities\" EntitySetName=\"Customers\"\
    \ />\n    <asp:QueryExtender runat=\"server\" TargetControlID=\"dataSource\">\n\
    \        <asp:DynamicFilterExpression ControlID=\"filterRepeater\" />\n    </asp:QueryExtender>\n\
    </asp:Content>\n```\n```\n\nSimilar to the regular Repeater control, QueryableFilterRepeater\
    \ enables you to define a markup template that it will use to generate filtering\
    \ controls for each supported column in the table. Each instance of the ItemTemplate\
    \ it defines is bound to a MetaColumn object describing a column that can be filtered\
    \ by Dynamic Data. This allows you to use ASP.NET data-binding syntax `<%# Eval(\"\
    DisplayName\") %>` to generate a text label for each column. Inside of the ItemTemplate,\
    \ you also need to have a single instance of the DynamicFilter control that has\
    \ ID property set to \"DynamicFilter\". This allows the QueryableFilterRepeater\
    \ to find the DynamicFilter control inside of each ItemTemplate instance and configure\
    \ it based on the current MetaColumn; the QueryableFilterRepeater will initialize\
    \ the filter control at run time."
