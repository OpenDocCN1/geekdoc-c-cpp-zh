- pgno: 40
  md: "Some visual aspects of entity templates, such as display names of the columns\
    \ and their order, can be controlled using metadata attributes. However, the overall\
    \ layout of the default template is fundamentally a single column of labels on\
    \ the left and the data entry controls on the right. When this layout is insufficient,\
    \ you can create custom entity templates to fit your requirements.\n\n# Grid Columns\
    \ and Dynamic Fields\n\nSo far, only data entry forms have been discussed, where\
    \ a single record or entity is displayed at a time. However, Dynamic Data offers\
    \ great productivity enhancements for list type pages that display multiple records.\n\
    \n# LISTING 1.13 GridView and DynamicField Sample (Markup)\n\n```\n```asp\n<%@\
    \ Page Language=\"C#\"\n    MasterPageFile=\"~/Site.master\" CodeBehind=\"SamplePage.aspx.cs\"\
    \n    Inherits=\"WebApplication.Samples.Ch01.DynamicField.SamplePage\" %>\n\n\
    <asp:Content ContentPlaceHolderID=\"main\" runat=\"server\">\n    <asp:ValidationSummary\
    \ runat=\"server\" />\n    <asp:GridView ID=\"gridView\" runat=\"server\" DataSourceID=\"\
    dataSource\"\n        DataKeyNames=\"ProductID\" AutoGenerateEditButton=\"true\"\
    \n        AllowPaging=\"true\" AutoGenerateColumns=\"false\" >\n        <columns>\n\
    \            <asp:DynamicField DataField=\"ProductName\" />\n            <asp:DynamicField\
    \ DataField=\"UnitsInStock\" />\n        </columns>\n    </asp:GridView>\n   \
    \ <asp:EntityDataSource ID=\"dataSource\" runat=\"server\"\n        ConnectionString=\"\
    name=NorthwindEntities\" EnableUpdate=\"true\"\n        DefaultContainerName=\"\
    NorthwindEntities\" EntitySetName=\"Products\" />\n</asp:Content>\n```\n```\n\n\
    DynamicField is a data control field that can be used with both GridView and DetailsView\
    \ controls, allowing them to take advantage of the rich field templating functionality\
    \ offered by Dynamic Data. Figure 1.13 shows how this page looks at runtime."
  merge: -1
