  md: 'The Dynamic Data controls use the metadata information to automatically load
    and display appropriate templates. DynamicControl can be used with the FormView
    and ListView controls to load an appropriate field template. DynamicField serves
    a similar purpose; however, it is designed for use with the GridView and DetailsView
    controls. The DynamicEntity control automatically loads an appropriate entity
    template, and the DynamicFilter control automatically loads an appropriate filter
    template. Although these controls are used extensively in the Dynamic Data templates,
    developers can use them in regular pages and controls of WebForms applications
    as well.


    This chapter has barely scratched the surface of the functionality offered by
    the ASP.NET Dynamic Data. The remaining chapters of Part I offer a closer look
    at each of these areas.'
