- pgno: 510
  md: "Notice that the FilteredObjectSet constructor takes the original ObjectSet\
    \ instance as a parameter and stores it in the private field. Most of the properties\
    \ and methods, such as AddObject, simply call the same method on the original\
    \ instance. However, the Expression, ElementType, and Provider properties that\
    \ implement the IQueryable interface are different; they also take into account\
    \ the CustomQueryAttribute that might be applied to the entity type. Instead of\
    \ delegating their implementation directly to the original ObjectSet, these properties\
    \ delegate to the object returned by the GetQueryable method, which returns the\
    \ original if the entity type has no CustomQueryAttribute or the modified query\
    \ if it does.\n\n# NOTE\n\nBy having FilteredObjectSet class reimplement the IObjectSet\
    \ interface instead of inheriting from the built-in ObjectSet class, you lose\
    \ the ability to access some of the additional APIs the Entity Framework provides\
    \ on top of the plain LINQ, such as the Include method discussed in Chapter 2,\
    \ \"Entity Framework.\" Although it is usually possible to work around the loss\
    \ of this particular extension and others, you might find this approach impractical\
    \ if your application uses them pervasively.\n\nWith the FilteredObjectSet implemented\
    \ and the T4 template modified to generate object set properties based on it,\
    \ you now have row-level security available in any application using the NorthwindEntities\
    \ object context. For instance, the following pseudo-code returns just one Customer\
    \ entity when the current user of the application is in the Customer role and\
    \ all entities when the current user is a Manager or an Employee:\n\n```\nusing\
    \ (var context = new NorthwindEntities())\n{\n    var customers = context.Customers;\n\
    }\n```\n\nThe automatic filtering will work with LINQ queries as well, so the\
    \ following pseudo-code will not allow a customer from New York to access records\
    \ of customers in London:\n\n```\nusing (var context = new NorthwindEntities())\n\
    {\n    var customers = context.Customers.Where(c => c.City == \"London\");\n}\n\
    ```\n\nHowever, just like authorization of Read access discussed in the previous\
    \ section, this limited implementation of row-level security can be circumvented\
    \ by LINQ queries that do not use the Customers object set directly. Queries that\
    \ return Customer information via navigation properties or projection allow unrestricted\
    \ access, and if you plan to take advantage of this functionality in your applications,\
    \ keep in mind you cannot rely on it exclusively."
  merge: -1
  img_proc: true
- pgno: 511
  md: '**NOTE**


    Changing the strongly typed object set properties to implement row-level security
    does not remove the need to handle QueryCreated event in dynamic page templates
    and call the GetQueryable method of the UnleashedMetaTable class. Unfortunately,
    the EntityDataSource control does not rely on ObjectSet properties of the generated
    ObjectContext classes, such as the NorthwindEntities in this sample project. Instead,
    it calls the CreateObjectSet method directly, bypassing any logic you might have
    in the property getters. Because this method is defined in ObjectContext class
    as nonvirtual, you cannot override it and have to resort to the event handlers
    and code-behind.


    # Summary


    Dynamic Data offers several options for implementing security. Table scaffolding
    enables you to specify whether all or specific entities will be accessible for
    all users through the dynamically generated web pages. Route constraints can be
    used to specify not only the entities, but also the actions (the types of dynamic
    pages) that will be accessible. Neither of these two options alone is robust enough
    to allow implementing a true role-based security system. However, they can be
    used in combination with custom pages where security is enforced with standard
    ASP.NET capabilities, such as the authorization rules in web configuration files.


    Web configuration files can be used to apply standard authorization rules to the
    dynamically generated URLs using the `<location/>` element. This approach enables
    you to specify flexible authorization rules for entities, actions, users, and
    roles. However, the resulting configuration is rather verbose and quickly reaches
    the volume where ongoing maintenance becomes difficult.


    The metadata API provided by Dynamic Data includes security-focused methods that
    can be overridden to implement a fully featured authorization system based on
    entities, actions, users, and roles, plus limited support for row-level security.
    A significant advantage of using the security APIs is the ability to not only
    prevent unauthorized access to entire web pages, but also to perform UI trimming
    and hide inaccessible information and actions from dynamic pages as well.


    Although the metadata API is the best way to implement security in Dynamic Data
    web pages, it is not directly applicable to the custom WebForms and MVC pages
    that most real-world applications still need to get the job done. With the help
    of *security annotations*, custom attributes similar to data annotations, you
    can define security rules that can be equally accessible from web pages based
    on Dynamic Data and other ASP.NET frameworks. You can also take it a step further
    and extend the Entity Framework''s ObjectContext to support these security annotations
    and enable reuse of the same security rules in other types of applications as
    well.'
  merge: -1
