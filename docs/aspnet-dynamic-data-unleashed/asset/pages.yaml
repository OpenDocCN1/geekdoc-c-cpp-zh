- pgno: 124
  md: '# ## Control Mode


    Control mode defines the context where the field template will be used. It can
    be one of the members of the ASP.NET `DataBoundControlMode` enumeration:


    +   - `ReadOnly` templates are used by the `Details.aspx` page template or custom
    pages to display field values in Read-only mode.

    +   - `Edit` templates are used by the `Edit.aspx` page template or custom pages
    to change field values of an existing row.

    +   - `Insert` are used by the `Insert.aspx` page template or custom pages to
    collect field values for a new row.


    When looking for a `ReadOnly` field template for the ShippedDate column of the
    Order table, which has DateTime data type and no additional metadata attributes
    in the sample data model, Dynamic Data finds the `DateTime.ascx` template. Edit
    mode is considered more specific because it requires the field template to not
    only display the current field value, but also allow changing it. Therefore, when
    looking for an Edit field template for the ShippedDate column, Dynamic Data chooses
    the template called `DateTime_Edit.ascx` if it exists. Note that Dynamic Data
    uses the "_Edit" suffix for Edit templates and no suffix for the ReadOnly templates.
    The Insert mode is even more specific because it might require special logic to
    deal with rows that have not been submitted to the database, and Dynamic Data
    chooses the template called `DateTime_Insert.ascx` if it exists.


    # ## Mode Fallback


    If there is no matching field template for a particular control mode, Dynamic
    Data uses fallback logic to find another template for a more generic mode. In
    this ongoing example, when looking for an Insert template for the ShippedDate
    column, Dynamic Data will first try to find the template called `DateTime_Insert.ascx`.
    Because there is no field template with this name, it falls back from the Insert
    to the Edit mode and ends up using the template called `DateTime_Edit.ascx`, assuming
    it can handle both Edit and Insert modes. Similarly, if an Edit mode template
    cannot be found, Dynamic Data falls back to Read-only mode.


    However, before Dynamic Data falls back to the next mode, it performs the type
    fallback. Consider `Int16` column from the Products table. When looking for an
    Edit template for this field, it tries using `System.Int16_Edit.ascx` and `Int16_Edit.ascx`
    templates first, but because they do not exist, it falls back to type `Int32`
    and checks for `System.Int32_Edit.ascx` and `Int32_Edit.ascx` and eventually finds
    `Integer_Edit.ascx`. If Dynamic Data performed the mode fallback first, it would
    skip this template and try to look for a ReadOnly template called `System.Int16.ascx`
    instead.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Navigation Columns


    So far, our discussion has been about the lookup rules Dynamic Data uses for columns
    of *primitive* types that can be stored using built-in system types like Int32
    and String. The Dynamic Data metadata API represents them using the `MetaColumn`
    class.


    Navigation columns, on the other hand, are columns that provide access to one
    or more entities that are defined as custom classes in the data model itself.
    There are three types of navigation columns from the Dynamic Data prospective:


    +   - **MetaForeignKeyColumn** represents a navigation property that returns a
    single entity referenced by the underlying foreign key field. In the Northwind
    example, Product is a foreign key column of the Order_Detail entity that represents
    the Product entity referenced by the ProductID foreign key field.

    +   - **MetaChildrenColumn** is an opposite of a foreign key. In the Northwind
    example, Order_Details column of the Product entity returns all Order_Detail items
    that reference a particular product instance.

    +   - **Many-to-Many column** is a special case of a MetaChildrenColumn where
    the IsManyToMany property is set to true. In the Northwind example, the Territories
    column of the Employees entity returns all territories assigned to a particular
    employee. Likewise, the Employees column of the Territory entity returns all employees
    assigned to work in a particular Territory. Dynamic Data considers both of these
    columns as Many-to-Many.


    Navigation columns get special treatment during field template lookup. Unless
    the developer already placed a UIHintAttribute on a navigation property, Dynamic
    Data uses the rules shown in Table 3.3 to come up with a default UI Hint.


    TABLE 3.3 Navigation Column Rules


    | Column Type | UI Hint |

    |---|---|

    | MetaForeignKeyColumn | ForeignKey |

    | MetaChildrenColumn | Children |

    | MetaChildrenColumn, IsManyToMany = true | ManyToMany |


    In this example, it means that for the Product column of the Order_Details table,
    Dynamic Data uses a template called ForeignKey.ascx; for the Order_Details column
    of the Product table, it uses a template called Children.ascx; and for both Employee.Territories
    and Territory.Employees columns, it uses the template called ManyToMany.ascx.


    Effectively, there is no type fallback during template lookup for navigation columns.
    However, Dynamic Data does perform mode fallback, so if your page needs a foreign
    key template in Insert mode, it first tries ForeignKey_Insert.ascx, then ForeignKey_Edit.ascx,
    and then ForeignKey.ascx if necessary. The default Dynamic Data project template'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'actually takes advantage of this to disable user interface for the children
    columns in Insert mode. If you open the `Children_Insert.aspx` field template,
    you see that it is empty. If this empty field template did not exist, `Children.aspx`
    would be used in its place, causing runtime errors because this template is not
    prepared to handle the scenario when the parent row does not exist.


    # Field Template Lookup Algorithm


    Although the lookup rules for field templates might seem complex at a first, they
    are based on common-sense logic, and when you understand the idea behind them,
    the results will feel intuitive. Just remember that Dynamic Data tries to choose
    the most specific field template based on the column definition and control mode,
    and if such a field template does not exist, it gradually relaxes the matching
    rules until it finds a match or reports an error. The resulting behavior allows
    you to easily add new field templates where unique behavior is required to support
    a particular column type while allowing you to reuse existing templates with common
    behavior such as displaying read-only field values. Figure 3.4 shows the actual
    algorithm used by Dynamic Data. `FieldTemplateFactory`, a special class defined
    in the `System.Web.DynamicData` namespace, performs this task.


    ![](img/11b373b78859e17d318fd76939a0df9d_126_0.png)


    FIGURE 3.4 Field template lookup algorithm.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'As an example, consider Table 3.4, which shows the sequence of template file
    names Dynamic Data will try when looking for a matching field template for the
    HomePhone property of the Employee entity.


    # TABLE 3.4 Example of Field Template Lookup for String Column


    | Mode="Insert" | Mode="Edit" | Mode="ReadOnly" |

    |---|---|---|

    | PhoneNumber_Insert.ascx | PhoneNumber_Edit.ascx | PhoneNumber.ascx |

    | System.String_Insert.ascx | System.String_Edit.ascx | System.String.ascx |

    | String_Insert.ascx | String_Edit.ascx | String.ascx |

    | Text_Insert.ascx | Text_Edit.ascx | Text.ascx |

    | PhoneNumber_Edit.ascx | PhoneNumber.ascx |  |

    | System.String_Edit.ascx | System.String.ascx |  |

    | String_Edit.ascx | String.ascx |  |

    | Text_Edit.ascx | Text.ascx |  |

    | PhoneNumber.ascx |  |  |

    | System.String.ascx |  |  |

    | String.ascx |  |  |

    | Text.ascx |  |  |


    Because the HomePhone property has no UIHintAttribute and UIHint property is not
    specified for DynamicControl or DynamicField in page markup, the search sequence
    does not include the file names based on the UIHint. However, the HomePhone property
    does have the DataType specified in the data model using the [DataType(DataType.PhoneNumber)]
    attribute.


    In Insert mode, the FieldTemplateFactory checks to see if PhoneNumber_Insert.ascx,
    System.String_Insert.ascx, String_Insert.ascx, and Text_Insert.ascx field templates
    exist before finding the PhoneNumber_Edit.ascx template created earlier in this
    chapter. If this template didn''t exist, the FieldTemplateFactory would continue
    checking for System.String_Edit.ascx, String_Edit.ascx, and eventually find the
    Text_Edit.ascx field template provided by Dynamic Data projects out of the box.


    In Edit mode, the FieldTemplateFactory starts with PhoneNumber_Edit.ascx and because
    it exists, uses it immediately. Likewise, had this field template not been defined,
    it would continue the search and eventually find the Text_Edit.ascx template provided
    by Dynamic Data.


    In ReadOnly mode, the FieldTemplateFactory starts with PhoneNumber.ascx. Because
    the read-only version of the phone number field template does not exist, it continues
    by trying System.String.ascx and String.ascx and finally finds the Text.ascx field
    template provided by Dynamic Data out of the box.


    Table 3.5 shows another example of field template lookup sequence, this time for
    the UnitsInStock property of the Product entity. This column is of type Int32
    and, unlike the HomePhone in the previous example, doesn''t have a DataTypeAttribute
    applied to it.'
  merge: -1
  img_proc: true
- pgno: 128
  md: "Instead, this field template takes advantage of the fallback logic Dynamic\
    \ Data uses for types and modes.\n\n# TABLE 3.5 Example of Field Template Lookup\
    \ for Integer Column\n\n| Mode=\"Insert\" | Mode=\"Edit\" | Mode=\"ReadOnly\"\
    \ |\n|---|---|---|\n| System.Int32_Insert.ascx | System.Int32_Edit.ascx | System.Int32.ascx\
    \ |\n| Int32_Insert.ascx | Int32_Edit.ascx | Int32.ascx |\n| Integer_Insert.ascx\
    \ | Integer_Edit.ascx | Integer.ascx |\n| System.String_Insert.ascx | System.String_Edit.ascx\
    \ | System.String.ascx |\n| String_Insert.ascx | String_Edit.ascx | String.ascx\
    \ |\n| Text_Insert.ascx | Text_Edit.ascx | Text.ascx |\n| System.Int32_Edit.ascx\
    \ | System.Int32.ascx |  |\n| Int32_Edit.ascx | Int32.ascx |  |\n| Integer_Edit.ascx\
    \ | Integer.ascx |  |\n| System.String_Edit.ascx | System.String.ascx |  |\n|\
    \ String_Edit.ascx | String.ascx |  |\n| Text_Edit.ascx | Text.ascx |  |\n| System.Int32.ascx\
    \ |  |  |\n| Int32.ascx |  |  |\n| Integer.ascx |  |  |\n| System.String.ascx\
    \ |  |  |\n| String.ascx |  |  |\n| Text.ascx |  |  |\n\nIn Insert mode, the FieldTemplateFactory\
    \ starts with the most specific template name (System.Int32) and mode (Insert).\
    \ It tries System.Int32_Insert, Int32_Insert, and Integer_Insert before falling\
    \ back to the next type—String. It continues trying System.String_Insert, String_Insert,\
    \ and Text_Insert before falling back to the next mode, Edit, and repeating the\
    \ steps starting with the most specific template name, System.Int32. Eventually,\
    \ it finds Integer_Edit.ascx, the built-in field template provided by Dynamic\
    \ Data for integer columns.\n\n> **NOTE**\n> \n> For the UnitsInStock column,\
    \ Dynamic Data uses both type aliases during the lookup sequence—Integer, which\
    \ represents Int32, and Text, which represents String.\n\nThe Edit mode lookup\
    \ sequence for the UnitsInStock column is very similar to that of Insert mode's.\
    \ It starts with System.Int32_Edit and finds the built-in Integer_Edit template.\
    \ The Read-only mode is different, however. Because Dynamic Data doesn't provide\
    \ a built-in read-only template for integer columns, the FieldTemplateFactory\
    \ falls back from Integer to String data type and eventually finds Text.ascx,\
    \ a read-only template that can display field values of all types."
