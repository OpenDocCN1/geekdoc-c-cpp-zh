- pgno: 468
  md: "# Generating Metadata Attributes\n\nData annotations or, more correctly, the\
    \ data annotation attributes, were created out of a necessity to extend the metadata\
    \ information supplied by the raw entity classes of the underlying data access\
    \ frameworks. Entity classes are simply not expressive enough to provide all metadata\
    \ required for Dynamic Data to generate the user interface. For instance, the\
    \ .NET type String does not allow you to specify maximum length, which is a pervasive\
    \ requirement when storing string values in relational tables. As a result, the\
    \ metadata API and the larger Dynamic Data framework in general, rely on the data\
    \ annotations, such as the StringLengthAttribute, to get the additional information\
    \ they need.\n\n> NOTE\n> \n> The metadata limitation applies not only to the\
    \ code generated by the Entity Framework and LINQ to SQL but also to code written\
    \ by developers using the code-first approach to create the entity model as well.\n\
    \nIn some instances, the required information, such as the maximum string length,\
    \ is available in the model definitions, the .EDMX, or .DBML files, but is not\
    \ publicly exposed by the data access framework through the generated entity classes.\
    \ To avoid having to specify the same information twice—once in the Entity Designer\
    \ and second time in the metadata data classes, the Dynamic Data providers can\
    \ generate data annotation attributes automatically. For instance, if you have\
    \ an entity property, such as the ProductName in the Product class, which is mapped\
    \ to a database column with a \"not null\" constraint, the Dynamic Data model\
    \ provider will automatically add a RequiredAttribute to the list of attributes\
    \ in the ColumnProvider that represents it.\n\nA somewhat similar situation exists\
    \ with the custom properties. The Country property defined in the Product class\
    \ needs a UIHintAttribute and a FilterUIHintAttribute to use the right templates,\
    \ but also a CustomPropertyAttribute to support sorting. As you can see in the\
    \ following code sample, the required data annotations are quite verbose and,\
    \ if you need a fair number of custom properties, having to specify all this information\
    \ in the entity model quickly becomes less practical than creating custom pages:\n\
    \n```\n[CustomProperty(Expression = \"Supplier.Country\")]\n[UIHint(\"Parent\"\
    ,\n    \"ForeignKeyField\", \"Supplier\",\n    \"DisplayField\", \"Country\")]\n\
    [FilterUIHint(\"Parent\",\n    \"ForeignKeyField\", \"Supplier\",\n    \"DisplayField\"\
    , \"Country\")]\npublic string Country { get { return this.Supplier.Country; }\
    \ }\n```\n\nBecause the UI and Filter hints can be inferred from the custom property\
    \ expression, you can generate the UIHintAttribute and FilterUIHintAttribute automatically\
    \ in the model provider, leaving only the need to supply the CustomPropertyAttribute,\
    \ like so:"
  merge: -1
  img_proc: true
- pgno: 469
  md: "```\n[CustomProperty(Expression = \"Supplier.Country\")]\npublic string Country\
    \ { get { return this.Supplier.Country; } }\n```\n\n> **NOTE**\n> Eliminating\
    \ the UIHintAttribute and FilterUIHintAttribute from the entity model not only\
    \ reduces the amount of code you must write, but also changes the nature of this\
    \ code. Unlike the low-level hint annotations, the CustomPropertyAttribute does\
    \ not include hard-coded UI information.\n\nGenerating attributes is actually\
    \ quite simple. If you have already created a class that extends the built-in\
    \ MetaColumn, you can do it by overriding the virtual BuildAttributeCollection\
    \ method, which, by default, simply returns the attributes collection of the MetaColumn.Provider\
    \ object. However, because the sample solution already has an extended ColumnProvider,\
    \ the easiest way to generate attributes is by overriding its Attributes property.\
    \ The following snippet shows an extract from the UnleashedColumnProvider source\
    \ code that demonstrates how to do this:\n\n```\npartial class UnleashedColumnProvider\
    \ : ColumnProvider\n{\n    public override AttributeCollection Attributes\n  \
    \  {\n        get\n        {\n            var attributes = base.Attributes.Cast<Attribute>().ToList();\n\
    \            var customProperty = attributes.OfType<CustomPropertyAttribute>()\n\
    \                .FirstOrDefault();\n            if (customProperty != null &&\n\
    \                customProperty.Expression.Contains('.'))\n            {\n   \
    \             string[] fields = customProperty.Expression.Split('.');\n      \
    \          string foreignKeyField = fields[0];\n                string displayField\
    \ = fields[1];\n                if (!attributes.OfType<UIHintAttribute>().Any())\n\
    \                {\n                    attributes.Add(new UIHintAttribute(\"\
    Parent\", null,\n                        \"ForeignKeyField\", foreignKeyField,\n\
    \                        \"DisplayField\", displayField));\n                }\n\
    \                if (!attributes.OfType<FilterUIHintAttribute>().Any())\n    \
    \            {\n                    attributes.Add(new FilterUIHintAttribute(\"\
    Parent\", null,\n                        \"ForeignKeyField\", foreignKeyField,\n\
    \                        \"DisplayField\", displayField));\n                }\n\
    \            }\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 470
  md: "```\n}\n    return new AttributeCollection(attributes.ToArray());\n}\n}\n```\n\
    \nNotice that the overridden getter first calls the inherited Attributes property\
    \ to obtain the initial list of attributes. This includes all default attributes\
    \ already discovered by the column provider, which in the case of UnleashedColumnProvider\
    \ includes the attributes returned by the PropertyDescriptor object that represents\
    \ the custom entity property. If the list of attributes includes a CustomPropertyAttribute,\
    \ the getter parses the names of the foreign key and the display fields from its\
    \ Expression value and adds a UIHintAttribute and a FilterUIHintAttribute to the\
    \ list. In the end, the combined list of attributes is used to create a new AttributeCollection\
    \ object, which the getter returns.\n\nEven when generating attributes, such as\
    \ the UIHintAttribute and FilterUIHintAttribute in this example, it is important\
    \ to still allow specifying these attribute explicitly. On one hand, you might\
    \ need to specify more information than can be inferred programmatically. But\
    \ more importantly, imagine trying to troubleshoot a problem caused by the model\
    \ provider silently replacing the attributes you applied in code when the application\
    \ runs. If you are careful, however, the automatic generation of attributes fits\
    \ well in the convention-based development experience offered by Dynamic Data—out\
    \ of the box, it just works, but you can change it if you want.\n\n# Summary\n\
    \nThe approach to developing metadata-driven list pages is similar to building\
    \ dynamic forms. You want to provide enough information in the entity model to\
    \ generate a reasonably good UI dynamically, eliminating or postponing the need\
    \ to create and maintain custom pages. You do that by specifying data annotation\
    \ attributes, such as the FilterUIHintAttribute, for entity classes and their\
    \ properties in the entity model. With the additional metadata information, you\
    \ can take advantage of the built-in capabilities of Dynamic Data controls or\
    \ extend the framework to eliminate its shortcomings.\n\nOne of the biggest shortcomings\
    \ in the built-in support for filter templates in Dynamic Data is the simplistic\
    \ algorithm used to look up filter templates. Unlike the sophisticated algorithm\
    \ used for field templates, the filter template algorithm assumes the existence\
    \ of only three filter templates that come with Dynamic Data out of the box. By\
    \ replacing the built-in FilterFactory with the UnleashedFilterFactory, you can\
    \ bring the filter lookup functionality up to the same level with field templates\
    \ and eliminate the need to specify the FilterUIHintAttribute for every filterable\
    \ property in the entity model."
  merge: -1
  img_proc: true
- pgno: 471
  md: 'The built-in model provider can be extended to enable support for custom entity
    properties in Dynamic Data. With their help, you can define calculated entity
    properties and properties that return information from related entities. With
    the first-class support in Dynamic Data, including templating, sorting, and filtering,
    custom properties allow you to postpone the need to create custom pages further
    and reduce the time and cost of developing web applications. Custom properties
    are not limited to list pages; they can be used in dynamic forms just as well.


    Last, you learned about automatic generation of data annotation attributes in
    the model provider based on existing metadata. Whenever higher-level metadata
    already exists, perhaps in the underlying entity model or supplied by the developer
    as another annotation, generating the low-level annotations helps you not only
    reduce the amount of code you have to write, but also improve the quality of the
    entity model.'
  merge: -1
  img_proc: true
