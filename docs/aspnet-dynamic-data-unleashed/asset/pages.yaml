  md: "# Using the Parent Filter Template\n\nWith the Parent filter template implementation\
    \ completed, you can finally create the sample page shown back in Figure 12.4.\
    \ As you recall, it includes a GridView control with one column showing product\
    \ names and the other column showing their countries of origin. At the top of\
    \ the page, you have two dynamic filters, one based on the ProductName property\
    \ of the Product entity and the other based on the Country property of the parent\
    \ Supplier entity. Listing 12.10 shows a complete markup of the sample page.\n\
    \n# LISTING 12.10 Product Search Page Filtered by Supplier Country (Markup)\n\n\
    ```\n<%@ Page Title=\"\" Language=\"C#\" \nMasterPageFile=\"~/Site.master\" CodeBehind=\"\
    SamplePage.aspx.cs\" \nInherits=\"WebApplication.Samples.Ch12.ParentFilterTemplate.SamplePage\"\
    \ %>\n<asp:Content ContentPlaceHolderID=\"main\" runat=\"server\">\n    <unl:UnleashedFilter\
    \ runat=\"server\" ID=\"productNameFilter\" FilterUIHint=\"Text\" \nDataField=\"\
    ProductName\" Columns=\"100\"/>\n    <unl:UnleashedFilter runat=\"server\" ID=\"\
    originFilter\" \nDataField=\"Supplier\" FilterUIHint=\"Parent\" DisplayField=\"\
    Country\"/>\n    <asp:GridView runat=\"server\" ID=\"gridView\" DataSourceID=\"\
    dataSource\" \nAutoGenerateColumns=\"false\">\n        <Columns>\n           \
    \ <unl:UnleashedField DataField=\"ProductName\"/>\n            <unl:UnleashedField\
    \ DataField=\"Supplier\" HeaderText=\"Origin\" \nUIHint=\"Parent\" DisplayField=\"\
    Country\" />\n        </Columns>\n    </asp:GridView>\n    <asp:EntityDataSource\
    \ runat=\"server\" ID=\"dataSource\" \nConnectionString=\"name=NorthwindEntities\"\
    \ \nDefaultContainerName=\"NorthwindEntities\" EntitySetName=\"Products\"/>\n\
    \    <asp:QueryExtender runat=\"server\" TargetControlID=\"dataSource\">\n   \
    \     <unl:UnleashedFilterExpression ControlID=\"productNameFilter\"/>\n     \
    \   <unl:UnleashedFilterExpression ControlID=\"originFilter\"/>\n    </asp:QueryExtender>\n\
    </asp:Content>\n```\n\nNotice the UnleashedFilter control associated with the\
    \ Supplier column of the Product entity. Its FilterUIHint is set to \"Parent\"\
    , the name of the new filter template, and the DisplayField custom attribute is\
    \ set to \"Country\", the name of the property from the parent Supplier entity\
    \ for users to filter the list of products by."
