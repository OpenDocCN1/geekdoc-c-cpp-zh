- pgno: 400
  md: "# LISTING 11.10 Continued\n\n```\n{\n    Control parent = this.Parent;\n  \
    \  while (parent != null)\n    {\n        if (parent is GridViewRow ||\n     \
    \       parent is FormViewRow ||\n            parent is DetailsViewRow)\n    \
    \        break;\n        parent = parent.Parent;\n    }\n\n    return parent;\n\
    }\n\nprivate static Control FindControlRecursively(Control parent, string id)\n\
    {\n    Control control = parent.FindControl(id);\n    if (control != null)\n \
    \       return control;\n\n    foreach (Control child in parent.Controls)\n  \
    \  {\n        control = FindControlRecursively(child, id);\n        if (control\
    \ != null &&\n            0 == string.Compare(control.ID, id, StringComparison.OrdinalIgnoreCase))\n\
    \            return control;\n    }\n\n    return null;\n}\n}\n```\n\nThe reimplemented\
    \ FindOtherFieldTemplate method first tries to call the inherited version, which\
    \ succeeds if this field template was created in a custom page and the built-in\
    \ logic was sufficient to find the template. If the template was not found, the\
    \ FindOtherFieldTemplate first locates the ultimate parent of all field templates\
    \ of the current entity. It does that by calling the FindParentOfAllFieldTemplates\
    \ method, which walks up the parent chain until it finds a known container, which\
    \ could be a GridViewRow, a FormViewRow, or a DetailsViewRow, depending on the\
    \ type of control used to create the UI—a GridView, a FormView, or a DetailsView,\
    \ respectively. Having located the ultimate parent, the FindOtherFieldTemplate\
    \ calls the FindControlRecursively method, which traverses the hierarchy of controls\
    \ recursively until it finds the target field template."
  merge: -1
  img_proc: true
- pgno: 401
  md: "A couple of odd points in the FindOtherFieldTemplate method are worth special\
    \ attention. First, the ID of the target field template is determined by concatenating\
    \ two underscore characters with the column name. This is how DynamicControl generates\
    \ IDs of field templates in the current version, and the UnleashedFieldTemplate\
    \ is forced to do it explicitly because this API is not publicly accessible. If\
    \ the implementation changes in a future version of Dynamic Data, this code will\
    \ be broken. Hopefully, the original FindOtherFieldTemplate actually works by\
    \ then and you can simply remove this workaround instead of fixing it.\n\nThe\
    \ other odd point in the FindOtherFieldTemplate method is the additional check\
    \ performed by the FindControlRecursively method to ensure that the ID of the\
    \ field template actually matches the ID you are looking for. This is done to\
    \ ignore the false positive matches from the CheckBoxList and RadioButtonList\
    \ controls, which override the FindControl method and always return self, regardless\
    \ of the control ID value that was passed in.\n\n# Creating Additional Dynamic\
    \ Entity Templates\n\nThe Default entity template gives your forms a plain single-column\
    \ layout with labels on the left and data controls on the right. You can control\
    \ display names and order of properties on this form as well as specify which\
    \ field templates should be loaded for different properties. This is often adequate\
    \ for simple entities that have a relatively small number of properties. For larger\
    \ entities, such as the Employee entity, this simplistic approach to form layout\
    \ can produce a rather long web page with extra space available on the right side.\
    \ Normally, when this happens, consider creating a custom entity template and\
    \ specify a more appropriate layout, perhaps with two columns of labels and data\
    \ controls. However, it is also possible to create a more sophisticated entity\
    \ template that will do it dynamically based on the metadata.\n\nDisplayAttribute\
    \ defines a property called GroupName, which can be used to specify arbitrary\
    \ strings for grouping controls on a dynamically generated page. For instance,\
    \ you could use values like \"Contact\", \"Address\", and \"Organization\" to\
    \ generate HTML fieldset controls that display labels and data controls in group\
    \ boxes similar to Windows applications. Alternatively, you could also use group\
    \ names such as \"Left\" and \"Right\" to assign each of the properties of the\
    \ Employee entity one of two columns that display side-by-side. Here is a fragment\
    \ of the Employee metadata class that shows an example of the second approach:\n\
    \n```\n[MetadataType(typeof(Metadata))]\npartial class Employee\n{\n    private\
    \ abstract class Metadata\n    {\n        [Display(GroupName = \"Left\", Order\
    \ = 100)]\n        public object FirstName { get; set; }\n```"
  merge: -1
