    \ of the property to use as a label, initializing the mode of the field template\
    \ based on the mode of the entity template, and so on. Listing 11.5 shows the\
    \ updated code-behind. Notice how the Label_Init and DynamicControl_Init methods\
    \ shrink to a mere one line of code each, and the Label_PreRender method, responsible\
