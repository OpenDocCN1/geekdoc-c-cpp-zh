    # Entity Deletion Rules\n\nBecause persistence validation rules are designed to\
    \ ensure that entities are saved in a valid state, most of them are not applicable\
    \ and should not be evaluated when entities are deleted. For example, suppose\
    \ you have a requirement to prevent deletion of orders after they have been submitted.\
    \ Even though you implemented a custom validation method that requires the OrderDate\
    \ not to be in the past, from deletion standpoint, you only care about the value\
    \ of the OrderStatus property. Evaluating the validation rules for the OrderDate\
    \ and other properties would prevent deletion of an entity that should have otherwise\
    \ been allowed.\n\nBecause persistence validation rules are not applicable to\
    \ entity deletion, the BeforeSaveChanges method of the UnleashedObjectContext\
    \ class validates only added and modified entities. On the other hand, the ISavableObject\
    \ interface is not bound by the same constraints as the validation logic. The\
    \ UnleashedObjectContext class calls the BeforeSave method of all entities, including\
    \ the deleted ones, which allows you to implement validation of entity deletion\
    \ without introducing conflicts with the validation of entity persistence. Here\
    \ is how you can implement the BeforeSave method in the Order class to allow deleting\
    \ only Draft orders:\n\n```\n```csharp\npartial class Order: ISavableObject\n\
    {\n    public void BeforeSave(ObjectStateEntry stateEntry)\n    {\n        if\
    \ (stateEntry.State == EntityState.Deleted &&\n            this.OrderStatus !=\
    \ (byte)DataModel.OrderStatus.Draft)\n```\n```"
