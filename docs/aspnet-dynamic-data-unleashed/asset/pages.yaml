- pgno: 115
  md: "FieldValueEditString converts the field value to a string in Edit or Insert\
    \ mode, using the formatting options specified in the data model or page markup.\
    \ It is an equivalent of calling FormattingOptions.FormatEditField(FieldValue).\n\
    \nDuring a post-back, a field template itself does not actually save the new column\
    \ value back in its Row object. Instead, the FieldTemplateUserControl class implements\
    \ the IBindableControl interface and relies on the parent FormView, DetailsView,\
    \ and GridView controls to perform this task. When the parent control is handling\
    \ an Insert or an Update command, it iterates through the list of its child controls\
    \ and calls the ExtractValues of each child that implements IBindableControl interface.\n\
    \n```\nprotected override void ExtractValues(IOrderedDictionary dictionary)\n\
    {\n    dictionary[this.Column.Name] =\n        this.ConvertEditedValue(this.textBox.Text);\n\
    }\n```\n\nThe ExtractValues method receives a dictionary object used to store\
    \ column name and value pairs. The extract from the DateTime_Edit field template\
    \ just shown is a typical implementation of this method. The ConvertEditedValue\
    \ method is provided by the FieldTemplateUserControl base class. It can automatically\
    \ convert the field value to null based on the ConvertEmptyStringToNull and NullDisplayText\
    \ formatting options.\n\nNotice that by providing the dictionary argument, ExtractValue\
    \ method allows a field template to return values of other columns or even multiple\
    \ column values. This capability is important for the foreign key templates used\
    \ for navigation properties, such as the Customer property of the Order class\
    \ in the Northwind data model, that need to return values of the corresponding\
    \ primitive properties, such as CustomerID. Consider Listing 3.9, which shows\
    \ the markup of the ForeignKey_Edit template.\n\n# LISTING 3.9 ForeignKey_Edit\
    \ Field Template (Markup)\n\n```\n<%@ Control Language=\"C#\" CodeBehind=\"ForeignKey_Edit.ascx.cs\"\
    \n    Inherits=\"WebApplication.DynamicData.FieldTemplates.ForeignKey_EditField\"\
    \ %>\n\n<asp:DropDownList ID=\"dropDownList\" runat=\"server\"/>\n\n<asp:RequiredFieldValidator\
    \ runat=\"server\" ID=\"requiredFieldValidator\"\n    ControlToValidate=\"dropDownList\"\
    \ Enabled=\"false\" />\n<asp:DynamicValidator runat=\"server\" ID=\"dynamicValidator\"\
    \n    ControlToValidate=\"dropDownList\" />\n```\n\nNotice that the ForeignKey_Edit\
    \ template uses a DropDownList control, which allows users to select from a list\
    \ of items created programmatically, in the Page_Load method shown in Listing\
    \ 3.10. Each ListItem object in the DropDownList represents a single foreign key,\
    \ with Text property storing value of the display column from the referenced"
  merge: -1
  img_proc: true
- pgno: 116
  md: "table and Value property storing a comma-separated list of its primary key\
    \ columns. This code relies on the convenience method, called PopulateListControl,\
    \ provided by the FieldTemplateUserControl base class, which does all the heavy\
    \ lifting required to query the referenced table, create the ListItem objects,\
    \ and add them to the DropDownList.\n\n# LISTING 3.10 ForeignKey_Edit Field Template\
    \ (Code-Behind)\n\n```\nusing System;\nusing System.Collections.Specialized;\n\
    using System.Web.DynamicData;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
    \nnamespace WebApplication.DynamicData.FieldTemplates\n{\n    public partial class\
    \ ForeignKey_EditField : FieldTemplateUserControl\n    {\n        public override\
    \ Control DataControl\n        {\n            get { return this.dropDownList;\
    \ }\n        }\n\n        protected void Page_Load(object sender, EventArgs e)\n\
    \        {\n            if (this.dropDownList.Items.Count == 0)\n            {\n\
    \                if (this.Mode == DataBoundControlMode.Insert || !this.Column.IsRequired)\n\
    \                    this.dropDownList.Items.Add(new ListItem(\"[Not Set]\", string.Empty));\n\
    \                this.PopulateListControl(this.dropDownList);\n            }\n\
    \n            this.SetUpValidator(this.requiredFieldValidator);\n            this.SetUpValidator(this.dynamicValidator);\n\
    \        }\n\n        protected override void OnDataBinding(EventArgs e)\n   \
    \     {\n            base.OnDataBinding(e);\n            string selectedValueString\
    \ = this.GetSelectedValueString();\n            if (this.dropDownList.Items.FindByValue(selectedValueString)\
    \ != null)\n                this.dropDownList.SelectedValue = selectedValueString;\n\
    \        }\n    }\n}\n```"
