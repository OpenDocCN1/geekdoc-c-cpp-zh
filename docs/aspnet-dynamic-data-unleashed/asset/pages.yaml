- pgno: 129
  md: '> **NOTE**

    > Although the field template lookup algorithm might seem complex and require
    numerous file existence checks, in reality, Dynamic Data performs it only when
    a field template is needed for a particular column the first time. The results
    are stored in a hash table, and all subsequent lookups for this column are memory-based
    and very fast.


    # Built-in Field Templates


    Dynamic Data web project templates in Visual Studio 2010 include a large number
    of ready-to-use field templates.


    # Boolean


    The Boolean.ascx field template is used for Boolean columns in Read-only mode.
    It contains a disabled CheckBox control, checked when the field value is true.


    ![](img/11b373b78859e17d318fd76939a0df9d_129_0.png)


    # Boolean_Edit


    The Boolean_Edit.ascx field template is used for Boolean columns in Edit and Insert
    modes. It contains a CheckBox control users can use to set field value to true
    or false. This field template does not support null values and, unlike other well-behaved
    field templates, does not perform validation.


    ![](img/11b373b78859e17d318fd76939a0df9d_129_1.png)


    # Children


    The Children.ascx field template is used in Read-only and Edit modes for navigation
    properties that represent the many side of one-to-many relationships between entities.
    For example, the Customer entity in the Northwind sample data model has a children
    navigation property called Orders, which returns a collection of all orders placed
    by a given customer. In Read-only and Edit modes, the Children.ascx entity template
    displays a hyperlink to the dynamic List.aspx page that displays all child rows
    of the parent entity.


    ![](img/11b373b78859e17d318fd76939a0df9d_129_2.png)


    # Children_Insert


    The Children_Insert.ascx field template is empty. Because the dynamic List.aspx
    page cannot display child rows of a parent entity that has not been submitted
    to the database, this template prevents the Children.ascx field template from
    being used in Insert mode.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# DateTime


    ![](img/11b373b78859e17d318fd76939a0df9d_130_0.png)


    The DateTime.ascx field template is used in Read-only mode to display DateTime
    field values. This field template contains a Literal control that injects the
    field value directly into the web page without any adorning HTML elements. This
    template is nearly identical to the Text.ascx template described in the following
    sections and could be removed, making Text.ascx responsible for displaying DateTime
    field values in Read-only mode as well.


    # DateTime_Edit


    ![](img/11b373b78859e17d318fd76939a0df9d_130_1.png)


    The DateTime_Edit.ascx field template is used for DateTime columns in Edit and
    Insert mode. It contains a TextBox control, accompanied by a CustomValidator,
    used to make sure that the value entered in the TextBox is a valid DateTime. It
    also contains a RequiredFieldValidator, used to enforce values for columns marked
    with the RequiredAttribute, a RegularExpressionValidator, used to enforce regular
    expression patterns for columns marked with the RegularExpressionAttribute and
    a DynamicValidator, used to enforce all other validation attributes applied to
    this column.


    # Decimal_Edit


    ![](img/11b373b78859e17d318fd76939a0df9d_130_2.png)


    The Decimal_Edit.ascx field template is used for Decimal, Float, and Double columns
    in Edit and Insert mode. It contains a TextBox control, accompanied by a CompareValidator,
    used to ensure that values entered in the TextBox are valid numbers. It also contains
    a RequiredFieldValidator, used to enforce values for columns marked with the RequiredAttribute;
    a RangeValidator, used to enforce range of values for columns marked with the
    RangeAttribute; a RegularExpressionValidator, used to enforce regular expression
    patterns for columns marked with the RegularExpressionAttribute; and a DynamicValidator,
    used to enforce all other validation attributes applied to this column.


    # EmailAddress


    ![](img/11b373b78859e17d318fd76939a0df9d_130_3.png)


    The EmailAddress.ascx field template is a read-only template used for String columns
    marked with the DataType(DataType.EmailAddress) attribute. It includes a HyperLink
    control that displays the field value as a link with the URL scheme “mailto:”.
    When the user clicks this link, most web browsers launch the default e-mail client
    installed on the computer and create a new message with the field value automatically
    added in the “To” list.


    # Enumeration


    ![](img/11b373b78859e17d318fd76939a0df9d_130_4.png)


    The Enumeration.ascx field template is used for enumeration columns in Read-only
    mode. It contains a Literal control that displays the underlying integral field
    value converted to its equivalent enumerated value and then converted to a String.'
  merge: -1
  img_proc: true
- pgno: 131
