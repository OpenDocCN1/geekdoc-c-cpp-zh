- pgno: 337
  md: "# Extending DynamicControl\n\nUp until now, you had to specify the Init event\
    \ handler for every instance of DynamicControl in each multimode entity template.\
    \ For custom templates, especially the more complex ones, this is not only tedious\
    \ and error prone, it also increases the size of template markup, making it less\
    \ readable.\n\nTo make implementation of custom multimode templates even easier,\
    \ the UnleashedControl (in the sample Unleashed.DynamicData project) extends the\
    \ built-in DynamicControl to set its own Mode property based on the mode of the\
    \ parent entity template. Instead of the following markup\n\n```\n<asp:DynamicControl\
    \ runat=\"server\" DataField=\"ContactName\" OnInit=\"DynamicControl_Init\"/>\n\
    ```\n\nyou would simply write\n\n```\n<unl:UnleashedControl runat=\"server\" DataField=\"\
    ContactName\"/>\n```\n\nand not have to worry about specifying the Init event\
    \ handler. Listing 10.9 includes the complete source code of the UnleashedControl.\n\
    \n# LISTING 10.9 UnleashedControl Implementation\n\n```\nusing System;\nusing\
    \ System.Web.DynamicData;\nusing System.Web.UI.WebControls;\n\nnamespace Unleashed.DynamicData\n\
    {\n    public class UnleashedControl : DynamicControl\n    {\n        protected\
    \ override void OnInit(EventArgs e)\n        {\n            if (this.Mode == DataBoundControlMode.ReadOnly)\n\
    \            {\n                var entityTemplate = this.TemplateControl as EntityTemplateUserControl;\n\
    \                if (entityTemplate != null)\n                {\n            \
    \        this.Mode = entityTemplate.Mode;\n                }\n            }\n\
    \            base.OnInit(e);\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 338
  md: 'As you can see, all work in the UnleashedControl is done by its only method
    called OnInit. In the base class, DynamicControl, this virtual method is responsible
    for finding an appropriate field template and instantiating it inside of the dynamic
    control. This overridden method performs the additional initialization steps before
    calling the inherited version.


    First, it checks to see if the Mode property is different from the default value
    ReadOnly; you do not want to silently overwrite the value specified by the developer
    in template markup. If the mode has not been specified explicitly, the code probes
    the TemplateControl property to find the parent entity template, an instance of
    the EntityTemplateUserControl class. If the parent entity template was found,
    the code initializes the Mode property of the dynamic control based on the Mode
    property of the parent entity template.


    With the UnleashedControl and UnleashedLabel controls, you can modify the custom
    multimode template for the Customer entity to look similar to what is shown in
    Listing 10.10. This new version no longer requires additional initialization logic
    in the code behind and does not hardcode display names of the properties in template
    markup. At this point, it has no plumbing that would unnecessarily obscure the
    intent of the markup—it only contains logic defining the form layout and does
    not duplicate any information from the entity metadata.


    # LISTING 10.10 Customer Entity Template with Extended Controls (Markup)


    ```

    <%@ Control Language="C#" CodeBehind="Customers.ascx.cs" Inherits="WebApplication.DynamicData.EntityTemplates.CustomerEntityTemplate"
    %>


    <unl:UnleashedLabel runat="server" DataField="CustomerID" />

    <unl:UnleashedControl runat="server" DataField="CustomerID" />

    <unl:UnleashedLabel runat="server" DataField="ContactName" />

    <unl:UnleashedControl runat="server" DataField="ContactName" />

    <fieldset>

    <legend>Address</legend>

    <unl:UnleashedLabel runat="server" DataField="Address" />

    <unl:UnleashedControl runat="server" DataField="Address" />

    <br />

    <unl:UnleashedLabel runat="server" DataField="City" />

    <unl:UnleashedControl runat="server" DataField="City" />

    <unl:UnleashedLabel runat="server" DataField="Region" />

    <unl:UnleashedControl runat="server" DataField="Region" />

    <unl:UnleashedLabel runat="server" DataField="PostalCode" />

    <unl:UnleashedControl runat="server" DataField="PostalCode" />

    </fieldset>

    ```'
