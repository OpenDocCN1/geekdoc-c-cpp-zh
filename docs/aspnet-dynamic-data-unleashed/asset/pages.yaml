  md: "```\nget { return this.textBox; }\n}\n\nprotected void Page_Load(object sender,\
    \ EventArgs e)\n{\n    this.textBox.ToolTip = this.Column.Description;\n\n   \
    \ this.SetUpValidator(this.requiredFieldValidator);\n    this.SetUpValidator(this.dynamicValidator);\n\
    \    this.SetUpRegexValidator(this.regularExpressionValidator);\n}\n\nprotected\
    \ override void ExtractValues(IOrderedDictionary dictionary)\n{\n    dictionary[this.Column.Name]\
    \ = this.ConvertEditedValue(this.textBox.Text);\n}\n\nprivate void SetUpRegexValidator(RegularExpressionValidator\
    \ validator)\n{\n    RegularExpressionAttribute attribute = this.Column.Attributes\n\
    \        .OfType<RegularExpressionAttribute>().FirstOrDefault();\n    if (attribute\
    \ == null)\n    {\n        attribute = new RegularExpressionAttribute(@\"^\\(\\\
    d{3}\\) \\d{3}-\\d{4}\");\n        attribute.ErrorMessage = \"The field {0} must\
    \ be a valid phone number.\";\n    }\n\n    validator.Enabled = true;\n    validator.Text\
    \ = \"*\";\n    validator.ValidationExpression = attribute.Pattern;\n    validator.ErrorMessage\
    \ = HttpUtility.HtmlEncode(\n        attribute.FormatErrorMessage(this.Column.DisplayName));\n\
    \    validator.ToolTip = validator.ErrorMessage;\n\n    this.IgnoreModelValidationAttribute(attribute.GetType());\n\
    }\n```\n\nMost of the phone number validation in the new field template is performed\
    \ by the standard ASP.NET control, RegularExpressionValidator, which ensures that\
    \ the value entered by the user matches the regular expression pattern that defines\
    \ a valid phone number. In addition to the server-side validation based on the\
    \ .NET implementation of regular expressions in the System.Text.RegularExpressions\
    \ namespace, it also works on the client side taking advantage of the regular\
    \ expression functionality in JavaScript."
