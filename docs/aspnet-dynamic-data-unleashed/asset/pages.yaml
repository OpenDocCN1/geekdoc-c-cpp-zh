- pgno: 36
  md: "# LISTING 1.9 Extending Product Metadata Using Data Annotations\n\n```\nusing\
    \ System;\nusing System.ComponentModel.DataAnnotations;\n\nnamespace DataModel\n\
    {\n    [MetadataType(typeof(Product.Metadata))]\n    partial class Product\n \
    \   {\n        public abstract class Metadata\n        {\n            [Display(Name\
    \ = \"Units in Stock\")]\n            public object UnitsInStock { get; set; }\n\
    \        }\n    }\n}\n```\n\nNotice that the Product class is declared with the\
    \ partial keyword. This effectively extends the definition of the Product entity\
    \ class generated by the Entity Framework designer, making everything in this\
    \ code snippet a part of the generated Product class. This is necessary because\
    \ you cannot place the DisplayAttribute directly on the generated UnitsInStock\
    \ property. Any changes made in the generated code by hand will be lost the next\
    \ time the code is regenerated. Instead, you define a separate class (called Metadata\
    \ in this example) and use the MetadataTypeAttribute to associate it with the\
    \ entity class, Product. Any data annotation attributes placed on the properties\
    \ of the Metadata class will have the same effect as if they were placed on the\
    \ actual properties of the Product class, such as the UnitsInStock in this example.\
    \ After making these changes, the error message displayed by the Integer_Edit\
    \ field template when the user enters alphabetic symbols in the UnitsInStock field\
    \ will include the human-readable display name.\n\n# Entity Templates\n\nMetadata\
    \ used by Dynamic Data includes not only information about individual columns,\
    \ but also the information about entire tables. If you need to build a data entry\
    \ page that includes all fields of the Products table, you can replace all individual\
    \ DynamicControl instances with a single DynamicEntity control.\n\n# LISTING 1.10\
    \ DynamicEntity and Entity Template Sample (Markup)\n\n```\n<%@ Page Language=\"\
    C#\" MasterPageFile=\"~/Site.master\" CodeBehind=\"SamplePage.aspx.cs\" Inherits=\"\
    WebApplication.Samples.Ch01.EntityTemplate.SamplePage\" %>\n<asp:Content runat=\"\
    server\" ContentPlaceHolderID=\"main\">\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "```\n<asp:ValidationSummary runat=\"server\" />\n<asp:FormView ID=\"formView\"\
    \ runat=\"server\" DataSourceID=\"dataSource\" DataKeyNames=\"ProductID\" DefaultMode=\"\
    Edit\">\n  <EditItemTemplate>\n    <asp:DynamicEntity Mode=\"Edit\" runat=\"server\"\
    \ />\n    <tr><td>\n      <asp:LinkButton Text=\"Update\" CommandName=\"Update\"\
    \ runat=\"server\" />\n    </td></tr>\n  </EditItemTemplate>\n</asp:FormView>\n\
    <asp:EntityDataSource ID=\"dataSource\" runat=\"server\" ConnectionString=\"name=NorthwindEntities\"\
    \ EnableUpdate=\"true\" DefaultContainerName=\"NorthwindEntities\" EntitySetName=\"\
    Products\" />\n</asp:Content>\n```\n\nDynamicEntity is another control provided\
    \ by Dynamic Data. Based on the table associated with the FormView control to\
    \ which it belongs as well as its own Mode property, the control will choose and\
    \ load an appropriate entity template. With the Products table in this example,\
    \ the resulting web page will look similar to the one shown in Figure 1.11.\n\n\
    ![](img/11b373b78859e17d318fd76939a0df9d_37_0.png)\n\nFIGURE 1.11 Dynamic Data\
    \ entry page with entity template.\n\nOut of the box, Dynamic Data project templates\
    \ offer three default entity templates that implement a simple, single-column,\
    \ top-down form layout. These entity templates (see Figure 1.12) are used for\
    \ all types of entities by default unless the developer provides a custom template\
    \ for a particular entity."
