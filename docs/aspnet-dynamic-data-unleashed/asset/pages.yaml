- pgno: 80
  md: 'When you run this code, you might notice that the second user (represented
    by context2) submits the changes last and the changes made by the first user are
    lost.


    To prevent data loss, database applications have traditionally relied on record
    locking. When a user starts editing a particular record, the application would
    lock it, preventing others from modifying it at the same time. This approach works
    better when the number of users is small and the number of records is large, thus
    reducing the chance of contention. However, physical locking can prevent other
    users not only from changing but also from reading the locked records. This can
    lead to significant performance degradation and is generally considered a bad
    practice.


    The Entity Framework has built-in support for an alternative strategy, called
    Optimistic Concurrency Control. When saving modified entities, the ObjectContext
    generates UPDATE statements with a WHERE clause that ensures that changes are
    made only if the entity has not changed since the last time it was retrieved from
    the database. In other words, the framework assumes that chances of contention
    are low and, optimistically, allows you to modify the entity without locking the
    record. If somebody else modified the same record in the meantime, you simply
    get an exception when calling the SaveChanges method.


    To take advantage of the optimistic concurrency support, first you need to modify
    the definitions of the properties in the Entity Designer to set their Concurrency
    Mode values to Fixed, as shown in Figure 2.8. You need to do this for all properties
    you want the Entity Framework to check for modifications before saving the entity.


    ![](img/11b373b78859e17d318fd76939a0df9d_80_0.png)


    FIGURE 2.8 Setting Property Concurrency Mode.


    When the model has been modified, calling the SaveChanges for context1 in the
    previous code example generates the following SQL statement:


    ```

    ```sql

    exec sp_executesql N''update [dbo].[Products]

    set [UnitsInStock] = @0

    where (([ProductID] = @1) and ([UnitsInStock] = @2))''

    ,''N''@0 smallint,@1 int,@2 smallint'',''@0=50,@1=1,@2=20

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: "It is a dynamic, parameterized update statement that sets the UnitsInStock\
    \ column to its new value, 50 (specified as the @0 parameter), but only if its\
    \ current value (specified as the @2 parameter) is still the same as the original\
    \ value 20 saved when the Product entity was retrieved from the database. If the\
    \ current value of the UnitsInStock column does not match the original value,\
    \ no records are updated, and the SaveChanges method of the ObjectContext class\
    \ throws the OptimisticConcurrencyException.\n\n> **NOTE**\n> \n> If you are using\
    \ Microsoft SQL Server, you can take advantage of the ROWVERSION (formerly known\
    \ as TIMESTAMP) column type, designed specifically for optimistic concurrency\
    \ control. When any changes are made to a row, the server automatically updates\
    \ its ROWVERSION column value. If your entity has a property mapped to a ROWVERSION\
    \ column, it is the only one whose Concurrency Mode needs to be set to Fixed.\
    \ Otherwise, you will want to set it for all entity properties and avoid partial\
    \ data loss.\n\nWhat does your application need to do when it encounters an OptimisticConcurrencyException?\
    \ Usually you simply want to let the current user know that somebody else has\
    \ already changed the record he is trying to modify, let him take note of the\
    \ changes he was trying to make, and refresh the record to see the other users'\
    \ modifications. The following code illustrates this scenario from the pure data\
    \ access point of view:\n\n```\n```csharp\nProduct product = context.Products.First(p\
    \ => p.ProductName == \"Chai\");\nproduct.UnitsInStock = 50;\ntry\n{\n    context.SaveChanges();\n\
    }\ncatch (OptimisticConcurrencyException e)\n{\n    context.Refresh(RefreshMode.StoreWins,\n\
    \        e.StateEntries.Select(s => s.Entity));\n}\n```\n```\n\nNotice how after\
    \ catching an OptimisticConcurrencyException, the code calls the Refresh method\
    \ of the ObjectContext. This method takes a RefreshMode enumeration, which determines\
    \ whose changes will be preserved and an IEnumerable of entity objects that need\
    \ to be refreshed. The RefreshMode.StoreWins value means that changes made by\
    \ the other users will be preserved. You can also pass the ClientWins value, which\
    \ would ignore changes of other users and keep the modifications made by the current\
    \ user. The exception object itself provides a list of entities that failed to\
    \ save—it is retrieved with the help of the StateEntries property, which returns\
    \ a collection of the familiar ObjectStateEntry objects, providing access to their\
    \ entities."
