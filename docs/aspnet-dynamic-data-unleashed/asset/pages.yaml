- pgno: 399
  md: "As you can see, very few changes were required in the Region field template\
    \ to support dynamic interaction with the country property. In fact, it is similar\
    \ to the initial implementation created in Chapter 10, where the name of the country\
    \ property was hardcoded. With the knowledge of the property name extracted outside\
    \ of the field template, it is now generic enough to support any region property\
    \ in the Northwind entity model and could be reused on other projects.\n\n# Fixing\
    \ the FindOtherFieldTemplate Method\n\nUnfortunately, the FindOtherFieldTemplate\
    \ method provided by Dynamic Data does not work in the dynamically populated FormView\
    \ and GridView controls and simply returns null. It is possible that this method\
    \ was created for the initial release of Dynamic Data in service pack 1 of the\
    \ .NET Framework 3.5 and has not been updated to work with the entity templates\
    \ introduced in version 4.0. As a workaround, this method was reimplemented in\
    \ the UnleashedFieldTemplate base class. Listing 11.10 shows a partial listing\
    \ of the class, with just the code relevant to the current discussion.\n\n# LISTING\
    \ 11.10 FindOtherFieldTemplate Method in UnleashedFieldTemplate\n\n```\nusing\
    \ System;\nusing System.Collections.Specialized;\nusing System.ComponentModel;\n\
    using System.Web.DynamicData;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
    \nnamespace Unleashed.DynamicData\n{\n    public partial class UnleashedFieldTemplate\
    \ : FieldTemplateUserControl\n    {\n        protected new UnleashedFieldTemplate\
    \ FindOtherFieldTemplate(string columnName)\n        {\n            var template\
    \ = (UnleashedFieldTemplate)\n                base.FindOtherFieldTemplate(columnName);\n\
    \n            if (template == null && !string.IsNullOrEmpty(columnName))\n   \
    \         {\n                Control parent = this.FindParentOfAllFieldTemplates();\n\
    \                template = (UnleashedFieldTemplate)\n                    FindControlRecursively(parent,\
    \ \"__\" + columnName);\n            }\n\n            return template;\n     \
    \   }\n\n        private Control FindParentOfAllFieldTemplates()\n```"
