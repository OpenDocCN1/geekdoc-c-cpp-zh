    \ exception is not a ValidationException or if it specifies an unexpected MemberName.\n\
    \n# Integration Testing Versus Unit Testing\n\nDevelopers familiar with automated\
    \ testing will quickly point out that tests created with the approach described\
    \ here are integration tests and not unit tests. Testing purists frequently frown\
    \ upon the idea of testing the business and data access logic together like this,\
    \ citing poor precision, performance, and reliability of tests and their results.\
    \ By design, the integration tests are less precise than unit tests because they\
    \ exercise multiple units of code and might not allow you to differentiate between\
    \ test failures caused by data access errors and those caused by business logic\
    \ errors. Because integration tests access an external database, they are slower\
    \ than unit tests that access only objects in memory. When implemented incorrectly,\
    \ the integration tests might be dependent on shared test data, which leads to\
    \ incorrect or unrepeatable test execution results.\n\nIn theory, testing the\
    \ business logic with pure unit tests, separately from the data access logic,\
    \ improves test precision, performance, and reliability. With this approach, the\
    \ data access logic needs to be replaced with test doubles, such as stubs or mocks,\
    \ allowing you to differentiate business logic errors from data access errors.\
    \ However, by making tests more precise, you also reduce the test coverage. The\
    \ unit tests of the business logic alone will not let you know when something\
    \ breaks due to a problem in the data access layer, which is a much more common\
    \ problem in applications created with object-relational mappers like the Entity\
    \ Framework. The rulebook answer to this problem is that you should create unit\
    \ tests for your data access in addition to the unit tests for the business logic.\
    \ In practice, the resulting volume and complexity of automated tests created\
