- pgno: 339
  md: "# Configuring Field Templates\n\nWhen creating custom entity templates, you\
    \ have a good control over placement of the field templates. You can arrange DynamicControl\
    \ instances using HTML table or div tags and CSS if that is what you prefer. However,\
    \ there is no obvious way to control appearance of controls within the field templates.\
    \ Take a look at Figure 10.1, which shows a web page generated by the custom entity\
    \ template for the Customer entity.\n\n![](img/11b373b78859e17d318fd76939a0df9d_339_0.png)\n\
    \nFIGURE 10.1 Web page with default address field template.\n\nNotice how the\
    \ Address text box cuts off a long string even though there is plenty of space\
    \ available on the right side of the control. Had this page been built with traditional\
    \ ASP.NET controls, you could have easily changed the Columns property of the\
    \ address TextBox control and made it wider. How do you configure a field template\
    \ instantiated by a DynamicControl?\n\n# Specifying a Field Template Explicitly\n\
    \nYou can choose a specific field template to be created by a DynamicControl by\
    \ setting its UIHint property. In this example, you might want to try using the\
    \ MultilineText field template for the Address property as it creates a wider\
    \ TextBox in Edit mode:\n\n```\n<asp:DynamicControl runat=\"server\" DataField=\"\
    Address\" UIHint=\"MultilineText\"/>\n```\n\nThe UIHint property is usually assigned\
    \ in page or template markup. However, it can be initialized programmatically\
    \ as well, by handling the Init event of the DynamicControl as shown next:\n\n\
    ```\nprotected void DynamicControl_Init(object sender, EventArgs e)\n{\n    var\
    \ dynamicControl = (DynamicControl)sender;\n    dynamicControl.UIHint = \"MultilineText\"\
    ;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 340
  md: "Figure 10.2. shows how the Customer edit page looks with the `MultilineText`\
    \ field template used for the Address property.\n\n![](img/11b373b78859e17d318fd76939a0df9d_340_0.png)\n\
    \nFIGURE 10.2  Web page with multiline address field template.\n\nUnfortunately,\
    \ the attempt to use the `MultilineText` template does not give the right solution.\
    \ The TextBox control generated by this field template is simply too big. With\
    \ several rows of empty space, it not only takes too much real estate, but can\
    \ also mislead the users into thinking that they can put the entire address, including\
    \ city, state, and zip code, into the same field.\n\n# Configuring Field Templates\
    \ Declaratively\n\nDynamicControl also allows you to configure the field template\
    \ at instantiates. You can set any public property of the field template by specifying\
    \ *custom attributes* for its parent `DynamicControl`.\n\nFirst, you need to modify\
    \ the appropriate field template to define a property you want to assign. In this\
    \ example, the `Text_Edit` field template is used for the Address property of\
    \ the Customer entity by default. The new property will be called Columns and\
    \ allow you to set the Columns property of the TextBox control created by this\
    \ template. Following is an extract from `Text_Edit.ascx.cs` that defines this\
    \ property:\n\n```\npublic partial class Text_EditField : FieldTemplateUserControl\n\
    {\n    public int Columns { get; set; }\n}\n```\n\nThere are several different\
    \ ways to initialize the Columns property of the TextBox control created by this\
    \ field template. The simplest approach is to use an ASP.NET data binding expression\
    \ and modify the markup file, `Text_Edit.ascx`, as shown here:"
  merge: -1
  img_proc: true
- pgno: 341
  md: "```\n<asp:TextBox ID=\"textbox\" runat=\"server\" Text='<%# FieldValueEditString\
    \ %>' Columns='<%# Columns %>'/>\n```\n\nWith these changes made, you can now\
    \ change the custom Customer entity template to specify the Columns value for\
    \ the Address field:\n\n```\n<unl:UnleashedControl runat=\"server\" DataField=\"\
    Address\" Columns=\"65\"/>\n```\n\n> **NOTE**\n> \n> This example is using the\
    \ UnleashedControl created earlier in this chapter. However, this technique works\
    \ just as well with the built-in DynamicControl provided by Dynamic Data.\n\n\
    Figure 10.3 shows the web page generated by the Customer entity template with\
    \ these changes implemented. Notice how much wider the Address text box is now,\
    \ allowing the entire address value to be displayed without cutting it off.\n\n\
    ![](img/11b373b78859e17d318fd76939a0df9d_341_0.png)\n\nFIGURE 10.3 Web page with\
    \ configured Address field template.\n\nAlthough the layout of the Customer form\
    \ is still far from perfect, with this approach you can continue working on the\
    \ Text_Edit field template to expose the properties necessary to configure the\
    \ TextBox size to meet your requirements and personal taste. This could include\
    \ the Width property of the TextBox control or perhaps the CssClass or Style properties.\
    \ Essentially, this is the same process you would follow to design and implement\
    \ a traditional UserControl that encapsulates a TextBox and needs to provide sufficient\
    \ means to configure its appearance.\n\n# Configuring Field Templates Programmatically\n\
    \nYou can also configure the field templates and their data controls programmatically.\
    \ Instead of specifying custom attributes for DynamicControl as discussed in the\
    \ previous"
  merge: -1
  img_proc: true
- pgno: 342
  md: "section, you could have used the following method to handle the Load event\
    \ of the Address control in this custom Customer entity template:\n\n```\n```csharp\n\
    protected void Address_Load(object source, EventArgs e)\n{\n    var addressControl\
    \ = (DynamicControl)source;\n    var template = (FieldTemplateUserControl)addressControl.FieldTemplate;\n\
    \    var addressTextBox = (TextBox)template.DataControl;\n    addressTextBox.Columns\
    \ = 65;\n}\n```\n```\n\nGiven an instance of the DynamicControl, you can access\
    \ the field template it creates via its FieldTemplate property. Unfortunately,\
    \ this property is of type Control, so you must downcast the value it returns\
    \ to the FieldTemplateUserControl class to access the DataControl property, which\
    \ returns the actual TextBox that displays the address. Having located the actual\
    \ data control, you can programmatically configure any of its properties, such\
    \ as the Columns property used in this example.\n\nThe declarative and programmatic\
    \ approaches of configuring field templates have different tradeoffs. The declarative\
    \ approach requires you to modify each field template to expose the properties\
    \ you need to configure in entity templates. However, when the properties are\
    \ defined, their use in template markup is more concise. Unfortunately, neither\
    \ Visual Studio nor ASP.NET runtime warns you if you mistype or try setting a\
    \ non-existent field template property as a custom attribute of DynamicControl.\
    \ Custom attributes that do not match field template properties are silently ignored.\n\
    \nThe programmatic approach requires no changes to the field templates but more\
    \ code for each customization. It also has negative impact on the page size by\
    \ unnecessarily increasing the size of field template's ViewState. Finally, by\
    \ accessing the data control directly instead of a specific property exposed by\
    \ the field template, you might be breaking its internal assumptions, which can\
    \ have unexpected side effects when the implementation of the field template changes.\n\
    \n# Creating Custom Field Templates\n\nSuppose you have a requirement to allow\
    \ users entering Customer information to select State values from a drop-down\
    \ list. In the sample data model, State values are stored as strings in the Region\
    \ column of the Customers table. Based on this information, Dynamic Data chooses\
    \ the Text_Edit field template for this column and displays a simple TextBox control,\
    \ which is not what you need. Although the ForeignKey_Edit field template looks\
    \ promising, as it creates a DropDownList control, it requires a foreign key column\
    \ referencing a lookup table, which you do not have in the data model.\n\nWhen\
    \ functionality of the available built-in field templates is not sufficient, you\
    \ can create a custom field template to meet your requirements. In the sample\
    \ project, a custom field template called State_Edit was added to the DynamicData\\\
    FieldTemplates of the"
  merge: -1
  img_proc: true
