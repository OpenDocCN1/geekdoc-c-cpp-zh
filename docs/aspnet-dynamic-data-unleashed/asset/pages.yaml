- pgno: 78
  md: "# Entity Lifecycle\n\nAs you already know, in addition to its formidable querying\
    \ capabilities, the Entity Framework also helps you implement typical data access\
    \ scenarios, such as creating a new entity, finding an existing entity, and modifying\
    \ or deleting it. To do this, the ObjectContext keeps track of all entities throughout\
    \ their lifecycles—from creation to modification to deletion.\n\n# Tracking Changes\n\
    \nWhen a new entity instance is added to an ObjectContext, the context records\
    \ its state as Added. The following code shows how to examine entity state changes:\n\
    \n```\nProduct p = new Product() { ProductName = \"Mukuzani\" };\ncontext.Products.AddObject(p);\n\
    Console.WriteLine(context.ObjectStateManager.GetObjectStateEntry(p).State);\n\
    context.SaveChanges();\nConsole.WriteLine(context.ObjectStateManager.GetObjectStateEntry(p).State);\n\
    ```\n\nThe ObjectStateManager property of the ObjectContext class returns the\
    \ actual object, keeping track of all new entities that have been added to the\
    \ context or existing entities retrieved from the database. In this code, we use\
    \ its GetObjectStateEntry method to retrieve an ObjectStateEntry object that represents\
    \ the newly added Product entity:\n\n```\n[Flags]\npublic enum EntityState\n{\n\
    \    Detached = 1,\n    Unchanged = 2,\n    Added = 4,\n    Deleted = 8,\n   \
    \ Modified = 16\n}\n```\n\nThe State property of the ObjectStateEntry returns\
    \ an EntityState enumeration value, which for newly created objects has the value\
    \ Added until we call the SaveChanges method of the ObjectContext, at which point\
    \ the new entity is submitted to the database and the entity state becomes Unchanged.\n\
    \nIn the next example, when an existing Product entity is retrieved from the database,\
    \ its state is initially Unchanged. Then, as soon as the Category property is\
    \ assigned, it becomes Modified. After the SaveChanges method is called and the\
    \ changes are submitted to the database, the entity state becomes Unchanged again:"
