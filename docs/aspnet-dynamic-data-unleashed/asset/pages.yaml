- pgno: 281
  md: '# CHAPTER 9


    # Implementing Business Logic


    # IN THIS CHAPTER


    +   - Entity Design

    +   - Default Property Values

    +   - Property Interaction Rules

    +   - Entity Interaction Rules

    +   - Validation Rules

    +   - Saving Changes

    +   - Invoking Business Rules in Web Applications

    +   - Business Rules in the Database


    Business logic, also known as *domain logic*, is code that implements a developer''s
    interpretation of a business domain where the application is intended to solve
    one or more problems and address opportunities. Because a particular business
    domain can be described from different points of view, there are different definitions
    of what constitutes the business logic. This chapter discusses implementation
    of logic related to real-life *entities*, such as Customers, Products, and Orders,
    as well as *rules* that determine how these entities interact with each other.


    The entities and rules are not directly related to any particular software application;
    instead, they describe the business itself. Similar to how a retailer could be
    selling products from a brick-and-mortar store directly to customers, accept orders
    by phone, allow customers to pick products up, or provide a website where customers
    submit orders that will be shipped to them by mail, different software applications
    can implement the same business logic as well. A sales clerk at a physical store
    could use a Windows-based point-of-sale application to sell a product, and a customer
    could use a Web-based application to place the order online. In both instances,
    the order needs to be checked to make sure that the product is in stock, order
    total must be calculated, product inventory needs to be updated, out-of-stock
    products need to be reordered, and so on.


    In part due to the common need to support the same business services through different
    applications and in part due to their relative stability, there is a wide agreement
    in the software development industry that separating the business logic from its
    presentation is beneficial as it allows reusing'
  merge: -1
  img_proc: true
- pgno: 282
  md: "the business logic in multiple applications. Separation of business logic from\
    \ presentation is especially important in ASP.NET Dynamic Data applications. Because\
    \ virtually the entire user interface of a web application can be generated dynamically,\
    \ embedding the business logic directly in the web pages of the application is\
    \ not only less attractive but also more cumbersome. To take advantage of the\
    \ productivity improvements Dynamic Data offers, you as a web developer need to\
    \ know how to implement business logic *outside* of the web pages.\n\n# Entity\
    \ Design\n\nEntities are abstractions of things in the business domain. They are\
    \ implemented as classes in the application and as tables in the database. Although\
    \ some similarities exist (class properties are similar to table columns for instance),\
    \ the object-oriented and relational models are very different. The ADO.NET Entity\
    \ Framework, LINQ to SQL, and other frameworks attempt to bridge the gap between\
    \ these two radically different ways of representing information by implementing\
    \ object-relational mapping.\n\nGood entity design requires application of both\
    \ object-oriented and relational design principles. It would be foolish to try\
    \ addressing both of these vast topics in this chapter, or even in this book.\
    \ It is assumed that you already know how to create a class that represents a\
    \ real-world object or person and use encapsulation and abstraction principles\
    \ to expose its key attributes as properties. It is also assumed that you know\
    \ how to create a table to store this information in the database and use normalization\
    \ techniques to reduce duplication. With these assumptions in mind, this section\
    \ focuses on practical application of the object-oriented and relational design\
    \ principles and some of the common pitfalls developers encounter with the Entity\
    \ Framework.\n\n# Measure Impact of Inheritance on Query Performance\n\nInheritance\
    \ is one of the most powerful concepts in object-oriented design, allowing a much\
    \ higher level of reuse and encapsulation than the relational model provides.\
    \ With the Entity Framework supporting *table-per-type*, *table-per-type*, *table-per-concrete\
    \ type*, and *table-per-hierarchy* methods of mapping class hierarchies to database\
    \ tables, using inheritance in your entity model becomes a very attractive option.\n\
    \nBeware! Although the Entity Framework makes LINQ queries over type hierarchies\
    \ look deceptively simple, there are significant performance costs associated\
    \ with the use of inheritance in your conceptual model. Consider the conceptual\
    \ model shown in Figure 9.1, where you have an abstract base class called User\
    \ and two concrete classes inheriting from it—Customer and Employee. The Entity\
    \ Framework allows you to select both Customer and Employee entities by writing\
    \ a simple LINQ query like this:\n\n```\n```csharp\nvar users = from u in context.Users\n\
    \            select u;\n```\n```"
  merge: -1
