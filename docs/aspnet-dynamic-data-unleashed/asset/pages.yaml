- pgno: 99
  md: "![](img/11b373b78859e17d318fd76939a0df9d_99_0.png)\n\nFIGURE 2.19  Update function\
    \ mapping.\n\nThe Delete stored procedures are similar to the update stored procedures\
    \ in that they also need to implement optimistic locking and make sure that the\
    \ deleted entity has not been modified since it was last retrieved from the database.\
    \ However, because there are no new values to persist, their parameter lists are\
    \ usually much shorter. Here is an example of the delete procedure for the Product\
    \ entity:\n\n```\n```sql\nCREATE PROCEDURE [dbo].[Products_Delete]\n    @ProductID\
    \ int, @ProductName nvarchar(40), @SupplierID int, @CategoryID int,\n    @QuantityPerUnit\
    \ nvarchar(20), @UnitPrice money, @UnitsInStock smallint,\n    @UnitsOnOrder smallint,\
    \ @ReorderLevel smallint, @Discontinued bit,\n    @RowsAffected int out\nAS\n\
    BEGIN\n    DELETE FROM Products\n    WHERE\n        ProductID = @ProductID AND\n\
    \        SupplierID = @SupplierID AND\n        CategoryID = @CategoryID AND\n\
    \        QuantityPerUnit = @QuantityPerUnit AND\n        UnitPrice = @UnitPrice\
    \ AND\n        UnitsInStock = @UnitsInStock AND\n        UnitsOnOrder = @UnitsOnOrder\
    \ AND\n        ReorderLevel = @ReorderLevel AND\n        Discontinued = @Discontinued;\n\
    \n    SET @RowsAffected = @@ROWCOUNT\nEND\n```\n```"
  merge: -1
