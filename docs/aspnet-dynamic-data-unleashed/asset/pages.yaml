- pgno: 189
  md: "their parent databound control, such as the FormView in this example. This\
    \ is why the Supplier drop-down list generated by the ForeignKey_Edit field template\
    \ in Figure 6.6 has been prepopulated with Exotic Liquids.\n\n# LISTING 6.8 Insert\
    \ Page Template (Code-Behind)\n\n```\n```csharp\nusing System;\nusing System.Web.DynamicData;\n\
    using System.Web.UI.WebControls;\n\nnamespace WebApplication.DynamicData.PageTemplates\n\
    {\n    public partial class Insert : System.Web.UI.Page\n    {\n        protected\
    \ MetaTable table;\n\n        protected void Page_Init(object sender, EventArgs\
    \ e)\n        {\n            this.table = DynamicDataRouteHandler.GetRequestMetaTable(Context);\n\
    \            this.Title = this.table.DisplayName;\n            this.dataSource.EntityTypeFilter\
    \ = table.EntityType.Name;\n            this.formView.SetMetaTable(this.table,\n\
    \                this.table.GetColumnValuesFromRoute(Context));\n        }\n\n\
    \        protected void FormView_ItemCommand(object sender, FormViewCommandEventArgs\
    \ e)\n        {\n            if (e.CommandName == DataControlCommands.CancelCommandName)\n\
    \                Response.Redirect(this.table.ListActionPath);\n        }\n\n\
    \        protected void FormView_ItemInserted(object sender, FormViewInsertedEventArgs\
    \ e)\n        {\n            if (e.Exception == null || e.ExceptionHandled)\n\
    \                Response.Redirect(this.table.ListActionPath);\n        }\n  \
    \  }\n}\n```\n```\n\nThe FormView_ItemCommand event handler in the Insert page\
    \ template serves the same function the method with this name performs in the\
    \ Edit page template—redirecting the user back to the List page when she clicks\
    \ Cancel. The FormView_ItemInserted event handler also does that when a new entity\
    \ has been successfully saved in the database."
