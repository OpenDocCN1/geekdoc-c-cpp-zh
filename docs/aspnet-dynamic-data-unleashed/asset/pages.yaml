    \n```\nusing System;\nusing System.Linq;\nusing System.Linq.Dynamic;\nusing System.Web.DynamicData;\n\
    using System.Web.UI;\n\nnamespace WebApplication.DynamicData.Filters\n{\n    public\
    \ partial class TextFilter : QueryableFilterUserControl\n    {\n        public\
    \ override IQueryable GetQueryable(IQueryable query)\n        {\n            if\
    \ (!string.IsNullOrEmpty(this.textBox.Text))\n            {\n                string\
    \ filter = this.Column.Name + \" == @0\";\n                query = query.Where\
    \ (filter, this.textBox.Text);\n            }\n\n            return query;\n \
