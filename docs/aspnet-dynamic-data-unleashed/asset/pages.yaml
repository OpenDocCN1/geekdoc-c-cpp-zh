    \ are generated by a helper method with the same name. You can find the complete\
    \ implementation of this method in the source code accompanying the book. Here\
    \ is how the modified text template generates the `UnitsInStock` property:\n\n\
    ```\n```csharp\n[EdmScalarPropertyAttribute(EntityKeyProperty=false, IsNullable=true)]\n\
    [DataMemberAttribute(), DefaultValue(typeof(global::System.Int16), \"0\")]\npublic\
    \ Nullable<global::System.Int16> UnitsInStock\n{\n    get\n    {\n        return\
    \ _UnitsInStock;\n    }\n    set\n    {\n```\n```"
