    );\n_UnitsInStock = StructuralObject.SetValidValue(value);\nReportPropertyChanged(\"\
    UnitsInStock\");\nOnUnitsInStockChanged();\n}\n}\nprivate Nullable<global::System.Int16>\
    \ _UnitsInStock = 0;\n```\n\n> NOTE\n> \n> When writing code by hand, you would\
    \ typically and rely on the compiler to choose a DefaultValueAttribute constructor\
    \ that matches the type of default value directly, such as the DefaultValueAttribute(Int16)\
    \ for the UnitsInStock property. However, generating this code programmatically\
    \ is challenging. To keep implementation simple, the text template in this sample\
    \ always generates the DefaultValueAttribute(Type, String) overload.\n\n# Property\
    \ Interaction Rules\n\nInformation systems commonly have a requirement to track\
    \ information regarding important changes in the state of an entity. In the case\
    \ of the Northwind Traders web application, you might need to keep track of when\
    \ each particular order was submitted in the SubmittedDate property of the Order\
    \ entity. Here is a test that illustrates the expected behavior:\n\n```\n[TestMethod]\n\
    public void OrderStatus_SetsSubmittedDate()\n{\n    using (new TransactionScope())\n\
    \    using (var context = new NorthwindEntities())\n    {\n        var order =\
    \ new Order();\n        order.OrderDate = DateTime.Today;\n        order.OrderStatus\
    \ = (int)OrderStatus.Submitted;\n        context.Orders.AddObject(order);\n  \
    \      context.SaveChanges();\n        Assert.IsNotNull(order.SubmittedDate);\n\
    \        Assert.AreEqual(DateTime.Today, order.SubmittedDate.Value.Date);\n  \
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 291
  md: 'This type of logic is an example of business rules that define interaction
    between different properties of a single entity. This particular rule could have
    been defined as “Set SubmittedDate to date and time when the OrderStatus changes
    from Draft to Submitted.”


    # OnPropertyChanging Partial Methods


    The Entity Framework generates a partial OnPropertyChanging method for each property,
    such as the OnOrderStatusChanging method for the OrderStatus property shown here:


    ```

    partial void OnOrderStatusChanging(byte? value);

    ```


    When implemented by a developer, this method receives the new value of the entity
    property as the parameter and can access the original value through the entity
    property itself. At first, it looks like an ideal place to implement the code
    to set the SubmittedDate when the new value of OrderStatus property is Submitted.
    Unfortunately, this approach does not work in web pages that rely on the EntityDataSource
    control, such as the page templates in our Dynamic Data web application.


    The data source control does not keep the entity object alive between page requests,
    nor does it serialize the object to the server- or client-side state storage.
    Instead, it puts the original values of its properties in a hash table and stores
    the hash table in the ViewState when the page is first rendered. During the post-back,
    when the data source control needs to save changes, instead of reloading the original
    entity from the database, it simply creates a brand-new entity object, applies
    the original values from the ViewState, and calls the AcceptChanges method of
    its ObjectStateEntry. Then it makes a second pass to apply the current values
    of the entity properties received from data entry controls on the page. In other
    words, every OnPropertyChanging partial method is called when any property of
    the entity changes.


    To put this in a specific example, imagine changing the shipping address on an
    already submitted order. Even though the OrderStatus property itself does not
    change, the OnOrderStatusChanging method will still be called as if the OrderStatus
    changed from null to Submitted. Therefore, if we try to set the SubmittedDate
    in the OnOrderStatusChanging method, it would always store the date of the last
    change made to the order.


    # ISavableObject Interface


    Instead of implementing the partial OnPropertyChanging methods, rely on the ObjectStateEntry
    class and explicitly compare the original property values it stores with the current
    values of the entity properties. This approach is similar to the approach discussed
    in Chapter 8 to implement validation rules based on property value changes. In
    fact, you could have implemented this logic in a custom validation method, but
    mixing the interaction logic, which changes property values, with the validation
    logic, which verifies them, is not a good idea. You have no control over the order
    in which the validation methods are called and might end up with validation code
    for a particular property executing before the code that changes it, leaving the
    entity in an invalid state.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "Instead, change the ObjectContext class in your project so that it notifies\
    \ the entity objects before they are saved and allows the entity objects to execute\
    \ property interaction rules before the validation is performed. For example,\
    \ the Unleashed.EntityFramework assembly in the sample solution accompanying this\
    \ book defines an interface called ISavableObject (for consistency with the built-in\
    \ IValidatableObject interface), that entity classes can implement when they require\
    \ property interaction logic.\n\n```\n```csharp\ninterface ISavableObject\n{\n\
    \    void BeforeSave(ObjectStateEntry stateEntry);\n}\n```\n```\n\nIn the Order\
    \ entity class, you can now implement this interface and have the BeforeSave method\
    \ get the original value of the OrderStatus property from the ObjectStateEntry,\
    \ compare it to the current value in the OrderStatus property itself, and set\
    \ the SubmittedDate property with the system date and time.\n\n```\n```csharp\n\
    partial class Order : ISavableObject\n{\n    public void BeforeSave(ObjectStateEntry\
    \ stateEntry)\n    {\n        byte? oldStatus = (byte)DataModel.OrderStatus.Draft;\n\
    \        if (stateEntry.State == EntityState.Modified)\n            oldStatus\
    \ = stateEntry.OriginalValues.Get(() => this.OrderStatus);\n\n        if (this.OrderStatus\
    \ == (byte)DataModel.OrderStatus.Submitted &&\n            oldStatus == (byte)DataModel.OrderStatus.Draft)\n\
    \        {\n            this.SubmittedDate = DateTime.Now;\n        }\n    }\n\
    }\n```\n```\n\nThe UnleashedObjectContext class calls the BeforeSave method of\
    \ each entity object that implements the ISavableObject interface.\n\n```\n```csharp\n\
    partial class UnleashedObjectContext\n{\n    private void BeforeSaveChanges(ObjectStateEntry\
    \ stateEntry)\n    {\n        var savable = stateEntry.Entity as ISavableObject;\n\
    \        if (savable != null)\n            savable.BeforeSave(stateEntry);\n\n\
    \        if (stateEntry.State != EntityState.Deleted)\n            this.Validate(stateEntry);\n\
    \    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 293
  md: 'As discussed in Chapter 8, the overridden `SaveChanges` method of the `UnleashedObjectContext`
    class calls the `BeforeSaveChanges` method for every added, modified, or deleted
    entity before submitting changes to the database. This method receives an `ObjectStateEntry`
    that stores both current and original property values of an entity. It checks
    if the entity implements the `ISavableObject` interface, calls its `BeforeSave`
    method.


    When your object context class inherits from the `UnleashedObjectContext` or has
    an equivalent functionality, property interaction rules are automatically invoked
    when an entity object is saved to the database. In other words, whenever a new
    page changes an `Order` entity through the `NorthwindEntities` context, the `SubmittedDate`
    is updated automatically based on the value of the `OrderStatus` property. No
    changes are required in the web page itself, whether it is a custom page created
    for editing Order entities or the dynamic Edit page template.


    > > **NOTE**

    > >

    > > The `ISavableObject` interface and its `BeforeSave` method work a lot like
    the UPDATE triggers in Microsoft SQL Server and other relational database management
    systems. Although you could have indeed implemented this logic in a database trigger,
    working at the entity level gives you more flexibility and better tools for implementing
    business rules. You still have the option of using triggers as an optimization
    step (see *Business Rules in the Database* later in this chapter).


    # Entity Interaction Rules


    Complex interaction rules might not be limited by a single entity object or even
    a single entity type. For example, when an order is fulfilled, the system needs
    to update the product inventory to decrement the number of items in stock by the
    number of items shipped to the customer. In the Northwind sample, this means that
    when the `OrderStatus` property of the Order entity changes to `Fulfilled`, values
    of the `Quantity` property of the `Order_Detail` entities need to be subtracted
    from the `UnitsInStock` properties of the corresponding Product entities. In other
    words, the fulfillment business rule spans three classes, `Order`, `Order_Detail`,
    and `Product`, and fits into the category of *entity interaction rules*.


    There are several different approaches you can take when implementing entity interaction
    rules with Entity Framework, including (but not limited to):


    +   - Implementing Entity Interaction Rules as BeforeSave Methods

    +   - Implementing Entity Interaction Rules as Entity Methods

    +   - Implementing Entity Interaction Rules as Context Methods'
  merge: -1
  img_proc: true
- pgno: 294
  md: "This section discusses these approaches and some of the trade-offs you must\
    \ take into consideration when choosing how to implement entity interaction rules\
    \ in your application.\n\n# Implementing Entity Interaction Rules in BeforeSave\
    \ Methods\n\nYou can use the BeforeSave “trigger” methods to implement not only\
    \ property interaction rules, but entity interaction rules as well. For instance,\
    \ you could change the BeforeSave method of the Order entity class to detect if\
    \ the OrderStatus property changed from Paid to Fulfilled and update the UnitsInStock\
    \ property of all Product entities purchased in this Order. The code example that\
    \ follows illustrates how the implementation could look:\n\n```\n```csharp\npartial\
    \ class Order : ISavableObject\n{\n    public void BeforeSave(ObjectStateEntry\
    \ stateEntry)\n    {\n        byte? oldStatus = (byte)DataModel.OrderStatus.Draft;\n\
    \        if (stateEntry.State == EntityState.Modified)\n            oldStatus\
    \ = stateEntry.OriginalValues.Get(() => this.OrderStatus);\n\n        if ((this.OrderStatus\
    \ == (byte)DataModel.OrderStatus.Submitted &&\n            oldStatus == (byte)DataModel.OrderStatus.Draft)\n\
    \        {\n            this.ShippedDate = DateTime.Now;\n            foreach\
    \ (Order_Detail orderItem in this.Order_Details)\n                orderItem.Product.UnitsInStock\
    \ -= orderItem.Quantity;\n        }\n    }\n}\n```\n```\n\nAlthough this approach\
    \ is viable for trivial scenarios such as in this example, it quickly becomes\
    \ overwhelmingly difficult to maintain as the number of rules and their complexity\
    \ increases. One of the reasons this happens is because the code is guessing what\
    \ the presentation layer is trying to accomplish. When only the OrderStatus property\
    \ is changing from Paid to Fulfilled, it is easy to see what is going on, but\
    \ what if another property of the Order entity changes as well? For example, you\
    \ could have another business rule tied to the ShipVia property of the Order entity\
    \ to calculate the shipping fee (the Freight property) depending on the shipping\
    \ option selected by the customer. If the OrderStatus changes to Fulfilled at\
    \ the same time with the ShipVia property, does it mean an employee has chosen\
    \ a different shipper to expedite the customer's order at no additional cost or\
    \ that the customer stopped by to pick up the order from our physical store and\
    \ you need to refund the shipping fee? It is impossible to answer this question\
    \ in the business layer of the application because it depends on how the presentation\
    \ layer is implemented."
  merge: -1
  img_proc: true
- pgno: 295
  md: Implementing complex business rules, such as order fulfillment, in BeforeSave
    methods (or database triggers for that matter) leads you down the path where you
    begin that users can see is more important than total duration of the operation.
    The ObjectContext can also be a long-living object in a desktop application, automatically
    caching previously loaded entities in memory and improving performance of subsequent
    operations. However, in web applications, where a new ObjectContext is created
    for each page request and users do not see anything until all data access is complete
    and the entire page is generated, lazy loading can significantly affect performance
    for all users of the system. To avoid the performance hit caused by loading the
    individual Product entities separately, take advantage of the Include method of
    the ObjectQuery class and load all Order_Detail and Product entities with the
    order in a single database query.
  merge: -1
  img_proc: true
- pgno: 296
  md: "```\nvar order = context.Orders\n    .Include(\"Order_Details\")\n    .Include(\"\
    Order_Details.Product\")\n    .First(o => o.OrderID == orderId);\norder.Fulfill();\n\
    ```\n\nYou need to place code like this, however, in every page that needs to\
    \ execute the Fulfill business rule, spilling the data access logic into the presentation\
    \ layer, which is, in most circumstances, not a good idea. One of the reasons\
    \ to avoid it is that the Entity Framework 4 forces you to hard-code the names\
    \ of the entity classes and their properties as string literals, which are fragile\
    \ and prone to typos. Even if you address this problem with string constants,\
    \ it still means hard-coding the knowledge of all entities and relationships necessary\
    \ for a particular business rule in the presentation layer, possibly in multiple\
    \ places where the same method is called.\n\n# Implementing Entity Interaction\
    \ Rules as Context Methods\n\nWhen performance is important and data access logic\
    \ needs to be encapsulated, it can be beneficial to implement business rules in\
    \ methods of the object context class instead of the entity class. Here is how\
    \ to reimplement the order fulfillment business rule in the NorthwindEntities\
    \ class:\n\n```\npublic partial class NorthwindEntities\n{\n    public void FulfillOrder(int\
    \ orderId)\n    {\n        Order order = this.Orders\n            .Include(\"\
    Order_Details\").Include(\"Order_Details.Product\")\n            .First(o => o.OrderID\
    \ == orderId);\n        order.OrderStatus = (byte)DataModel.OrderStatus.Fulfilled;\n\
    \        order.ShippedDate = DateTime.Now;\n        foreach (Order_Detail orderItem\
    \ in order.Order_Details)\n            orderItem.Product.UnitsInStock -= orderItem.Quantity;\n\
    \    }\n}\n```\n\nThe FulfillOrder method takes OrderID as a parameter and retrieves\
    \ the Order entity, all of its Order_Detail objects, and the related Product entities\
    \ in a single roundtrip to the database. When all entities are loaded in the context,\
    \ the code performs the same steps implemented in the Fulfill method earlier—update\
    \ OrderStatus and ShippedDate and decrement UnitsInStock.\n\nThis version of the\
    \ FulfillOrder method assumes that the caller does not already have the Order\
    \ instance loaded from the database, so taking its primary key value as a parameter\
    \ is the best option. However, if the Order instance is already loaded, you can\
    \ change or"
