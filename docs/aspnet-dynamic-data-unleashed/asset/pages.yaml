- pgno: 103
  md: '# CHAPTER 3


    # Field Templates


    # IN THIS CHAPTER


    +   - Read-Only Templates

    +   - Field Value Display Format

    +   - Edit and Insert Mode Templates

    +   - Field Value Edit Format

    +   - Changing Existing Field Template

    +   - Data Binding

    +   - Creating a New Field Template

    +   - Field Template Lookup Rules

    +   - Built-in Field Templates


    Enterprise applications deal with employees, managers, emergency contacts, prospects,
    customers, suppliers, and vendors—in other words, people and organizations, who
    all have names, addresses, and phone numbers. Implementing data entry logic for
    these attributes is repetitive, and for years, the ASP.NET developers have been
    developing user controls to reduce the code duplication. It is common to see user
    controls with text boxes and validators for entering street, city, state, and
    postal code in many web applications today.


    Although they are a great mechanism for reusing presentation and validation logic,
    user controls require a certain amount of plumbing before they can be used on
    a web page. At the very minimum, user controls must be registered, and because
    even the simplest controls need to provide slightly varying functionality in different
    contexts, they also usually have one or more properties that need to be configured.
    As the user controls get more and more granular, the amount of plumbing work required
    to apply them increases. It quickly reaches the point of diminishing returns,
    and developers usually stop short of implementing user controls for the individual
    data entry fields.


    Field template is a special type of ASP.NET user control that encapsulates presentation
    and validation logic for a single field. Unlike the traditional user controls,
    field templates do not require registration. Instead, a simple DynamicControl
    or a DynamicField placed on a web page automatically loads and configures an appropriate
    field template based on the column name and metadata.'
  merge: -1
  img_proc: true
