- pgno: 198
  md: "# URL Routing\n\nDynamic Data web applications rely on the general-purpose\
    \ URL routing capabilities built into ASP.NET. Routes are typically configured\
    \ at the application start time, in the `Application_Start` event handler located\
    \ in the `Global.asax` file.\n\n```\nRouteTable.Routes.Add(new DynamicDataRoute(\"\
    {table}/{action}.aspx\"));\n```\n\nAs discussed in the beginning of this chapter,\
    \ `{table}` and `{action}` are placeholders for the two route parameters that\
    \ have special meaning in ASP.NET Dynamic Data. The first parameter supplies the\
    \ name of the table whose data needs to be displayed by a dynamic page, and the\
    \ second determines what kind of page needs to be displayed, or perhaps more precisely,\
    \ how the table data needs to be presented to the user. Dynamic Data expects the\
    \ table parameter to match the name of one of the MetaTable objects that describe\
    \ entity types registered in the global MetaModel, whereas the action parameter\
    \ provides the information necessary to find the appropriate page template to\
    \ handle the request. The route definition just shown allows Dynamic Data to determine\
    \ that the following page request URL applies to the table called Products and\
    \ the page template called List:\n\n```\nhttp://localhost/Products/List.aspx\n\
    ```\n\n# Action Route Parameter\n\nRoutes do not have to include the action parameter\
    \ as a part of the URL itself. Instead, it can be specified by explicitly setting\
    \ the Action property of the DynamicDataRoute class as shown here:\n\n```\nRouteTable.Routes.Add(new\
    \ DynamicDataRoute(\"{table}\")\n{\n    Action = PageAction.List\n});\n```\n\n\
    Given this route definition, the URL for displaying a list of products will not\
    \ include the name of the page template at all and look like this instead:\n\n\
    ```\nhttp://localhost/Products\n```\n\n# Table Route Parameter\n\nSimilarly, the\
    \ table parameter does not have to come from the URL either; it can be specified\
    \ using the Table property of the DynamicDataRoute class. Notice how in the following\
    \ example, the route definition does not include any parameters and simply hard-codes\
    \ the URL to \"Product\" (singular), which does not match the plural name of the\
    \ table."
  merge: -1
  img_proc: true
- pgno: 199
  md: "```\nRouteTable.Routes.Add(new DynamicDataRoute(\"Product\")\n{\n    Action\
    \ = PageAction.Details,\n    Table = 'Products'\n});\n```\n\nBased on this route\
    \ definition, the Dynamic Data web application can use the following URL:\n\n\
    http://localhost/Product?ProductID=1\n\ninstead of the more verbose and less user-friendly:\n\
    \nhttp://localhost/Products/Details.aspx?ProductID=1\n\n# URL Parameters Versus\
    \ Query Parameters\n\nURL parameters are an alternative to the Query parameters\
    \ used by traditional ASP.NET WebForms applications. Whereas the traditional query\
    \ parameters require both names and values to be present in the query string,\
    \ the URL parameters allow web applications to determine parameter names automatically,\
    \ based on the position of their values in the URL. Consider the following route,\
    \ which replaces the ProductID query parameter with a positional URL parameter:\n\
    \n```\nRouteTable.Routes.Add(new DynamicDataRoute(\"Product/{ProductID}\")\n{\n\
    \    Action = PageAction.Details,\n    Table = 'Products'\n});\n```\n\nThis route\
    \ definition allows the web application to implement the product catalog without\
    \ query parameters and support URLs similar to that shown below. This not only\
    \ makes the URLs shorter and easier for users to read, but also makes it easier\
    \ for the search engines to index dynamic pages, which is very important for public-facing\
    \ web sites:\n\nhttp://localhost:49212/Product/3\n\nDynamic Data still supports\
    \ traditional Query parameters, which you can activate by registering a route\
    \ that does not include any URL parameters and does not specify parameter values\
    \ explicitly:\n\n```\nRouteTable.Routes.Add(new DynamicDataRoute(\"Dynamic\"));\n\
    ```\n\nThe route registered just shown makes Dynamic Data use URLs that look like\
    \ this instead:\n\nhttp://localhost/Dynamic?Table=Products&Action=List"
  merge: -1
  img_proc: true
- pgno: 200
  md: "# Dynamic Hyperlinks\n\nRoutes have a dual purpose. In addition to helping\
    \ the ASP.NET runtime determine which ASPX page will be used to handle a particular\
    \ incoming request, they also determine how hyperlinks pointing to the dynamic\
    \ pages will be generated. There are several different methods for generating\
    \ hyperlinks in ASP.NET web applications. One of them involves the DynamicHyperLink\
    \ control supplied by Dynamic Data. This control inherits from the ASP.NET HyperLink\
    \ control and allows you to generate hyperlinks to dynamic pages. In the following\
    \ example, the name of the table and the required action are explicitly specified.\n\
    \n```\n```aspx\n<asp:DynamicHyperLink runat=\"server\"\n    ContextTypeName=\"\
    DataModel.NorthwindEntities\"\n    TableName=\"Products\" Action=\"List\" Text=\"\
    Show all\" />\n```\n```\n\nThe TableName property specifies the name of the MetaTable\
    \ describing the target entity, and the ContextTypeName specifies the name of\
    \ the context class where the target entity is defined. Depending on how the routing\
    \ is configured, this control generates different URLs without you having to modify\
    \ any of its markup. Table 6.1 shows examples of the different route definitions\
    \ and URLs this control would generate based on them.\n\nTABLE 6.1  Examples of\
