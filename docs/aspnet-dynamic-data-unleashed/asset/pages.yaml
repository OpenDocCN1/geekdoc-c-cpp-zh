    \ c)\n{\n    // Validation logic specific to fulfilled orders\n    return new\
    \ ValidationResult[0];\n}\n}\n```\n\nValidation rules that are shared by all states\
    \ of an entity can be implemented either declaratively by applying validation\
    \ attributes or in the main Validate method of the entity class. For complex entities\
    \ that need to support large number of validation rules, you might want to consider\
    \ using the Strategy pattern (Design Patterns: Elements of Reusable Object-Oriented\
    \ Software by Eric Gamma, Richard Helm, Ralph Johnson, and John Vlissides) and\
    \ moving validation rules specific to a particular state to a separate validation\
    \ class. However, for simple entities, where the number of rules is relatively\
    \ small, a simple switch statement showed in this example can do the same job\
    \ without the overhead of introducing separate validation classes.\n\n# Validation\
    \ of Related Entities\n\nIt might be challenging to determine the right place\
    \ to implement validation logic that requires information from related entities.\
    \ And although it might seem that the Order_Detail entity should be responsible\
    \ for validating its Quantity property against the"
