- pgno: 23
  md: 'Figure 1.1 shows how these templates appear in the New Web Site dialog of Visual
    Studio. These project templates are nearly identical, so you should choose one
    based on the data access technology you want to use. If your project, like the
    sample project accompanying this book, uses Entity Framework, choose the ASP.NET
    Dynamic Data Entities project flavor.


    ![](img/11b373b78859e17d318fd76939a0df9d_23_0.png)


    **FIGURE 1.1**   Dynamic Data website templates.


    You can choose either Visual Basic or Visual C# flavors of the Dynamic Data project
    templates depending on your language preference. Aside from Visual Basic being
    slightly more verbose than C# when it comes to defining lambda expressions, both
    languages work equally well.


    In Visual Studio, you also have a choice of creating either a *Web Application*
    project or a *Web Site*. A Web Site is simply a folder that contains page (.aspx),
    control (.ascx), and code-behind files. This type of Visual Studio project is
    appropriate for web applications where content is stored primarily in the page
    files, as it enables developers to change and deploy one page at a time. A Web
    Application project, on the other hand, is more appropriate for applications where
    content is stored primarily in a database and the page files contain only the
    logic required to retrieve and display it.


    Although Dynamic Data offers both Web Site and Web Application project templates,
    its intent fits closer with the Web Application project model. Figure 1.2 shows
    the Dynamic Data project templates in the New Project dialog of Visual Studio.
    The sample project accompanying this book is based on the ASP.NET Dynamic Data
    Entities Web Application project template.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/11b373b78859e17d318fd76939a0df9d_24_0.png)


    FIGURE 1.2  Dynamic Data Web Application project templates.


    Figure 1.3 shows an example of a new Dynamic Data web application project, which
    as you can see, is similar to a regular Web Application project; it includes a
    default master page (Site.master), a cascading style sheet (Site.css), and a landing
    page (Default.aspx). However, it is not quite ready to run.


    ![](img/11b373b78859e17d318fd76939a0df9d_24_1.png)


    FIGURE 1.3  Dynamic Data Web Application project.


    # Creating a Data Model


    Your first task after creating a new Dynamic Data project is to create a data
    model. Because the sample project in this book is based on Entity Framework, you
    would choose the *ADO.NET Entity Data Model* template from the Data folder in
    the Add New Item dialog (see Figure 1.4).'
