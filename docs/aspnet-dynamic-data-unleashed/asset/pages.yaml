- pgno: 505
  md: "# CustomQueryAttribute\n\nCustomQueryAttribute is another attribute you can\
    \ find in the Unleashed.DataAnnotations project in the sample solution accompanying\
    \ this book. It enables you to implement limited row-level security at the entity\
    \ class level. The code snippet that follows illustrates how to use this attribute\
    \ to allow users in Customer role to see only their own Customer records:\n\n\
    ```\n[CustomQuery(typeof(Customer), \"GetQueryable\")]\npartial class Customer\n\
    {\n    public static IQueryable GetQueryable(IQueryable query)\n    {\n      \
    \  IPrincipal user = Thread.CurrentPrincipal;\n        if (user.IsInRole(\"Customer\"\
    ))\n        {\n            query = query.Cast<Customer>().Where(\n           \
    \     customer => customer.EmailAddress == user.Identity.Name);\n        }\n \
    \       return query;\n    }\n}\n```\n\nSimilar to the built-in CustomValidationAttribute\
    \ discussed in detail back in Chapter 8, the CustomQueryAttribute takes two parameters—name\
    \ of a static “GetQueryable” method and the type where it is implemented. This\
    \ method is similar to the GetQueryable method used by the dynamic filter templates\
    \ and the GetQueryable method implemented in the UnleashedMetaTable class earlier.\
    \ It takes an entity query as a parameter and modifies it based on the permissions\
    \ of the current user. In this example, the GetQueryable method adds a where clause,\
    \ filtering out customer records that the current user should not be able to access.\n\
    \nImplementation of the CustomQueryAttribute is quite simple. Aside from the constructor,\
    \ the main API of this attribute is the GetQueryable method, which uses reflection\
    \ to invoke the actual method specified in the arguments of the attribute’s constructor:\n\
    \n```\n[AttributeUsage(AttributeTargets.Class)]\npublic class CustomQueryAttribute:\
    \ Attribute\n{\n    public CustomQueryAttribute(Type type, string method);\n \
    \   public IQueryable GetQueryable(IQueryable source);\n}\n```\n\n# Implementing\
    \ MetaTable.GetQuery with CustomQueryAttribute\n\nYou can take advantage of the\
    \ CustomQueryAttribute when implementing the GetQuery method of the MetaTable\
    \ class. The code snippet that follows illustrates how this was"
