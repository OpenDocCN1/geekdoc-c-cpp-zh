- pgno: 447
  md: "The overridden GetFilteredColumns method calls the GetScaffoldColumns method\
    \ of the MetaTable to get a list of all properties that can be displayed in a\
    \ list page in read-only mode. In other words, only columns already displayed\
    \ in a dynamic GridView control are candidates for filtering. This eliminates\
    \ some low-level properties, such as the generated primary keys and primitive\
    \ components of foreign keys that are not displayed in list pages by default.\
    \ From the end-user perspective, it would be strange to see an option to filter\
    \ a Product page by the ProductID or the SupplierID columns, which are not displayed\
    \ in the grid.\n\nThe initial list of properties returned by the GetScaffoldColumns\
    \ method is further reduced by calling the IsFilterable method and leaving only\
    \ those MetaColumn objects for which it returns true. This method mimics the rules\
    \ used by the GetScaffoldColumns method itself, only as they apply to filtering\
    \ of property values, not their display. For instance, if the property has a FilterUIHintAttribute\
    \ applied to it, assume that it is filterable. Likewise, if the property has a\
    \ DisplayAttribute applied with an explicitly specified AutoGenerateFilter value,\
    \ this value determines whether the property is considered filterable (true or\
    \ false). All other types of properties, with the exception of custom properties\
    \ and “children” navigation properties, are considered filterable by default.\n\
    \n# Extending the MetaModel Class\n\nThe MetaModel class serves as a root object\
    \ for accessing the metadata information in Dynamic Data web applications. Its\
    \ default implementation creates and exposes the built-in FilterFactory and MetaTable\
    \ classes. The UnleashedMetaModel extends the built-in class to create the UnleashedFilterFactory\
    \ and UnleashedMetaTable instances instead. Listing 13.3 shows a complete implementation\
    \ of the new class.\n\nLISTING 13.3 Unleashed.DynamicData\\UnleashedMetaModel.cs\n\
    \n```\n```csharp\nusing System;\nusing System.Web.DynamicData;\nusing System.Web.DynamicData.ModelProviders;\n\
    \nnamespace Unleashed.DynamicData\n{\n    public class UnleashedMetaModel : MetaModel\n\
    \    {\n        public UnleashedMetaModel()\n        {\n            this.FilterFactory\
    \ = new UnleashedFilterFactory(this);\n        }\n\n        protected override\
    \ MetaTable CreateTable(TableProvider provider)\n        {\n            return\
    \ new UnleashedMetaTable(this, provider);\n        }\n    }\n}\n```\n```"
