    \ MetaTable table;\n    protected override void OnPreInit(EventArgs e)\n    {\n\
    \        base.OnPreInit(e);\n        this.table = DynamicDataRouteHandler.GetRequestMetaTable(Context);\n\
    \        if (!this.table.CanRead(this.User) || !this.table.CanUpdate(this.User))\n\
    \        {\n            FormsAuthentication.RedirectToLoginPage();\n         \
    \   this.Response.End();\n        }\n    }\n}\n```\n```\n\nThe *Delete* page template\
    \ created in Chapter 6 is similar to the Edit page template in that it allows\
    \ users to perform two distinct actions: “read” or “delete” existing records.\
    \ Implementing authorization checks is also similar to the Edit page template—you\
    \ need to call the CanRead and CanDelete methods of the MetaTable object associated\
    \ with the page and redirect the user to the login page if either one of them\
    \ returns false.\n\nAt first glance, the *Details* and *List* page templates are\
    \ simple. They generate web pages that allow users to “read” existing records\
    \ and should prevent user access when the CanRead method of the MetaTable object\
    \ derived from the URL route returns false. You already know how to implement\
    \ access security for page templates that perform a single action. Here is how\
    \ you would do it in the code-behind of the Details page template:\n\n```\n```csharp\n\
    public partial class Details : Page\n{\n    protected MetaTable table;\n    protected\
    \ override void OnPreInit(EventArgs e)\n    {\n        base.OnPreInit(e);\n  \
    \      this.table = DynamicDataRouteHandler.GetRequestMetaTable(this.Context);\n\
    \        if (!this.table.CanRead(this.User))\n        {\n            FormsAuthentication.RedirectToLoginPage();\n\
    \            this.Response.End();\n        }\n    }\n}\n```\n```\n\nHowever, unless\
    \ your application has a separate Delete page template, both the Details and the\
    \ List page templates also allow users to *delete* the existing records as well.\
    \ You"
