- pgno: 503
  md: "```\nreturn authorizationAttribute == null\n    || authorizationAttribute.IsAuthorized(user,\
    \ action);\n}\n```\n\nIn any performance-critical method, such as IsAuthorized,\
    \ it is important to minimize the amount of reflection-based code executed repeatedly.\
    \ This code relies on the TypeDescriptor API to locate the AuthorizationAttribute\
    \ and, to minimize the performance impact, caches the search results in the static\
    \ authorizationAttributes dictionary. When the AuthorizationAttribute for a given\
    \ entity type has been located, next time it is retrieved from the dictionary,\
    \ resulting in a much faster execution.\n\nThe IsAuthorized method can be executed\
    \ by several different threads simultaneously, especially in a web application,\
    \ and has to be thread-safe. To implement thread-safe caching, this code uses\
    \ the ConcurrentDictionary type from the System.Collections.Concurrent namespace,\
    \ which offers a specialized method GetOrAdd for safely retrieving an existing\
    \ value from the dictionary or adding it if it does not exist. As its second parameter,\
    \ this method takes a function that is executed if the dictionary does not contain\
    \ a value for the given key; the value it returns is stored in the dictionary\
    \ and returned to the caller of the GetOrAdd method. It is this anonymous function\
    \ (this example uses the shorter lambda syntax to define it) where the code calls\
    \ the TypeDescriptor.GetAttributes method to find the AuthorizationAttribute.\n\
    \n# Extending ObjectContext to Enforce Read Permission\n\nThe SaveChanges method\
    \ of the ObjectContext allows you to enforce only the Insert, Update, and Delete\
    \ permissions. Because this method does not have to be called by code retrieving\
    \ entities from the database, you cannot enforce the Read permission here. It\
    \ is actually quite challenging to authorize the Read actions properly because\
    \ there are so many different ways of reading the entity information. First, there\
    \ is the straightforward access through the ObjectSet properties, which can be\
    \ illustrated with code like this:\n\n```\nusing (var context = new NorthwindEntities())\n\
    {\n    var supplierInformation = context.Suppliers;\n}\n```\n\nYou can implement\
    \ Read authorization for the Suppliers object set by changing implementation of\
    \ its property. Here is the default implementation of the Suppliers property in\
    \ the NorthwindEntities class generated by the built-in Entity Framework code\
    \ generator, which was modified to call the Authorize method of the UnleashedObjectContext\
    \ base class:\n\n```\npublic ObjectSet<Supplier> Suppliers\n{\n    get\n    {\n\
    \        Authorize(typeof(Supplier), Actions.Read);\n        if (_Suppliers ==\
    \ null)\n```"
