    Listing 11.14 shows the code-behind file of the TwoColumn entity template with
    the differences from the default entity template shown in bold font. The main
    difference from the default entity template is located in the OnLoad method of
    the TwoColumnEntityTemplate. Notice how instead of adding the dynamically created
    controls to the EntityTemplate itself, it calls the FindGroupPlaceHolder method
    and adds them to the PlaceHolder control it returns. In other words, the Default
    entity template uses the EntityTemplate control as both a template to create the
    dynamic controls and a container to host them. The TwoColumn template, however,
    uses the EntityTemplate control only as a template, and the two PlaceHolder controls
    serve as containers for the generated controls.'
