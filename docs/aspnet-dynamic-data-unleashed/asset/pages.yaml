    \ pages and websites possible. The second part explains how to solve real-world\
    \ problems—implementing business logic while keeping it separate from the presentation,\
    \ extending Dynamic Data components and metadata to make them even more powerful,\
    \ and much more. I hope you find it useful.\n\nOleg Sych  \nFebruary 2012  \n\
    Oldsmar, Florida"
