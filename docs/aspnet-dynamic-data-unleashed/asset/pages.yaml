    http://localhost/Products/Details.aspx?ProductID=1\nhttp://localhost/Products/List.aspx?ProductID=1\n\
    ```\n```\n\nDynamic hyperlinks can be also generated with the help of the RouteUrl\
    \ markup expression. This is a special syntax that ASP.NET parser recognizes and\
    \ uses to generate a dynamic URL based on parameter values you specify:\n\n```\n\
    ```aspx\n<asp:HyperLink runat=\"server\" Text=\"Show all\"\n    NavigateUrl=\"\
    <%$RouteUrl:table=Products, action=List%>\" />\n```\n```\n\nUnder the hood, both\
    \ the RouteUrl markup expression and the DynamicHyperLink control rely on the\
    \ low-level API the ASP.NET provides for routing. The next code sample illustrates\
    \ how they work by creating a dynamic hyperlink programmatically. It creates a\
    \ RouteValueDictionary to hold the Table and Action parameter values and then\
    \ calls the GetVirtualPath method of the global Routes collection to generate\
    \ the URL in a form of a virtual path:\n\n```\n```csharp\nHyperLink hyperLink\
    \ = // ...\n\nRequestContext context =\n    DynamicDataRouteHandler.GetRequestContext(HttpContext.Current);\n\
    \nRouteValueDictionary routeValues = new RouteValueDictionary();\nrouteValues[\"\
    table\"] = \"Products\";\nrouteValues[\"action\"] = \"List\";\n\nVirtualPathData\
    \ pathData = RouteTable.Routes.GetVirtualPath(\n    context, routeValues);\n\n\
    hyperLink.NavigateUrl = pathData.VirtualPath;\n```\n```\n\n# Route Evaluation\
    \ and Constraints\n\nAlthough you will probably never need to write code that\
    \ creates dynamic hyperlinks programmatically, it is important to understand how\
    \ they are generated by the ASP.NET"
