  md: "```\n```csharp\npublic interface IDynamicValidatorException\n{\n    IDictionary<string,\
    \ Exception> InnerExceptions { get; }\n}\n```\n```\n\nThe built-in EntityDataSource\
    \ control takes advantage of this interface when reporting errors that occur when\
