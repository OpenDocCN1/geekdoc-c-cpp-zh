    \ the Get extension method uses the () => order.OrderStatus lambda expression\
    \ to determine the name of the property, OrderStatus, which it passes to the indexer\
    \ of the DbDataRecord object to retrieve the original property values. If the\
    \ original value is DBNull, the Get method returns a default value of the property\
    \ type—a value that an uninitialized variable of that type would have. In case\
    \ of the OrderStatus property, whose type is Nullable<Byte>, the default value\
    \ is null; for a non-nullable type, such as Byte, the default value would have\
    \ been 0. If, however, the original value retrieved from the DbDataRecord object\
    \ is not DBNull, the Get method returns the actual value after casting it to the\
    \ type of the property itself.\n\nThe Get extension method offers several advantages.\
    \ On one hand, it allows you to avoid having to write special logic to handle\
    \ DBNull values. On the other hand, it allows you to specify properties as strongly-typed\
    \ lambda expressions as opposed to hard-coded string literals or constants. They\
    \ are not only easier to write (with the help of IntelliSense in the Visual Studio\
    \ editor), but if you ever need to rename the property, the compiler ensures that\
    \ all references are properly updated.\n\n# Summary\n\nThe System.ComponentModel.DataAnnotations\
    \ namespace offers a robust validation framework, which allows implementing validation\
    \ rules declaratively by placing data annotation attributes, or imperatively,\
    \ by writing code.\n\nThe validation framework is fully integrated in Dynamic\
    \ Data web applications; a helper class, Validator, can be used to integrate validation\
    \ with other frameworks as well. Version 4.0 of Entity Framework does not support\
    \ the validation framework out of the box, and additional steps are necessary\
    \ to extend object context classes to automatically validate entity objects before\
    \ they are submitted to the database.\n\nAutomated testing allows you to improve\
    \ the quality of your applications without significant additional effort. With\
