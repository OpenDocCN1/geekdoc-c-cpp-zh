- pgno: 287
  md: 'Regardless of the approach you choose to developing your entity model—database-first,
    model-first, or code-first—you want to minimize the amount of work you spend on
    the secondary model. In other words, if you start by developing the database model
    first, you want to spend the least amount of work on maintaining your conceptual
    model and application classes. Likewise, if you start by developing the application
    classes first, you want to spend as little time as possible tweaking the database
    tables the Entity Framework generates for you.


    The best way to keep the conceptual and storage models in sync over the life of
    the application is to reduce the differences between them. Ideally, you want to
    be able to regenerate your entire secondary model without having to make any tweaks
    manually. This could require introducing some of the database principles in the
    class design or taking object-oriented principles into account when designing
    the tables. For instance, you might want to sacrifice some of the normalization
    rules or break some of your DBA''s favorite naming conventions to make the generated
    classes easier to use in a .NET language.


    This advice might feel counter-intuitive and go against the selling points of
    the O/R mapping frameworks in general and the Entity Framework in particular.
    It is based on the lessons learned in real-world projects and realization that
    additional flexibility rarely justifies the added cost of troubleshooting problems
    caused by modeling mistakes and confusion caused by the differences between the
    models. Unless your project has an unlimited budget, you want to avoid paying
    this price until it becomes a true necessity.


    # Default Property Values


    Setting default values of entity properties presents a surprising challenge in
    the Dynamic Data applications. Although the Entity Framework allows you to specify
    default values directly in the model, the Dynamic Data metadata API ignores this
    information. Figure 9.5 shows an example of setting zero as the default value
    of the UnitsInStock property of the Product entity in the Properties window of
    Visual Studio.


    ![](img/11b373b78859e17d318fd76939a0df9d_287_0.png)


    FIGURE 9.5 Setting default property value with Entity Designer.'
  merge: -1
  img_proc: true
- pgno: 288
  md: "Based on this information from the conceptual model, the Entity Designer generates\
    \ special initialization code that assigns the default value to the backing field\
    \ of the entity property. Here is how the code looks if you open the generated\
    \ `NorthwindEntities.cs`:\n\n```\n```csharp\n[EdmScalarPropertyAttribute(EntityKeyProperty=false,\
    \ IsNullable=true)]\n[DataMemberAttribute()]\npublic Nullable<global::System.Int16>\
    \ UnitsInStock\n{\n    get { return _UnitsInStock; }\n    set\n    {\n       \
    \ OnUnitsInStockChanging(value);\n        ReportPropertyChanging(\"UnitsInStock\"\
    );\n        _UnitsInStock = StructuralObject.SetValidValue(value);\n        ReportPropertyChanged(\"\
    UnitsInStock\");\n        OnUnitsInStockChanged();\n    }\n}\nprivate Nullable<global::System.Int16>\
    \ _UnitsInStock = 0;\n```\n```\n\nThis works great when a new entity is created\
    \ explicitly, such as in the following unit test, but unfortunately, it has no\
    \ effect in Dynamic Data insert pages:\n\n```\n```csharp\n[TestMethod]\npublic\
    \ void UnitsInStock_IsZeroByDefault()\n{\n    var product = new Product();\n \
    \   Assert.AreEqual((short)0, product.UnitsInStock);\n}\n```\n```\n\nThe Dynamic\
    \ Data insert page template does not actually create a new entity instance. Instead,\
    \ the individual field templates set the initial value of their data controls\
    \ in Insert mode based on the `DefaultValue` property of the `MetaColumn` class\
    \ describing their respective properties. As you recall from Chapter 7, “Metadata\
    \ API,” to determine the default property value, the `MetaColumn` class checks\
    \ if a `DefaultValueAttribute` was applied to the property. In other words, the\
    \ Entity Framework initializes the default property values in code, but Dynamic\
    \ Data expects this information to be provided via data annotation attributes,\
    \ forcing you to maintain property default values in two separate places.\n\n\
    > **NOTE**\n> \n> The current version of the Dynamic Data provider for Entity\
    \ Framework ignores the default property values defined in the model. Another\
    \ possible solution for this problem is to create a custom model provider. More\
    \ on this in Chapter 13, “Building Dynamic List Pages.”"
  merge: -1
  img_proc: true
- pgno: 289
