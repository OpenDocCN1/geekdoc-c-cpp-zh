    \ ThrowValidationException method (shown next) uses the validation results to\
    \ create a list of ValidationException objects. If multiple validation results\
    \ were reported, it throws the AggregateException. Otherwise, it throws the ValidationException\
    \ to mimic the simple behavior implemented earlier:\n\n```\nprotected static void\
    \ ThrowValidationException(\n    object entity, IEnumerable<ValidationResult>\
    \ results)\n{\n    var exceptions = new List<ValidationException>();\n    foreach\
    \ (ValidationResult result in results)\n        exceptions.Add(new ValidationException(result,\
    \ null, entity));\n\n    if (exceptions.Count == 1)\n        throw exceptions[0];\n\
    \n    throw new AggregateException(exceptions);\n}\n```\n\n> **NOTE**\n> The AggregateException\
    \ does not inherit from the ValidationException class. Now that the SaveChanges\
    \ method can throw two different exception types, many of the automated tests\
