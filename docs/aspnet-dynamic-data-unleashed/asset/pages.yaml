- pgno: 91
  md: "```\n<EntitySetMapping Name=\"Users\">\n    <EntityTypeMapping TypeName=\"\
    IsTypeOf(NorthwindModel2.User)\">\n        <MappingFragment StoreEntitySet=\"\
    Customers\">\n            <ScalarProperty Name=\"ContactTitle\" ColumnName=\"\
    ContactTitle\" />\n            <ScalarProperty Name=\"ContactName\" ColumnName=\"\
    ContactName\" />\n            <ScalarProperty Name=\"CustomerID\" ColumnName=\"\
    CustomerID\" />\n        </MappingFragment>\n    </EntityTypeMapping>\n    <EntityTypeMapping\
    \ TypeName=\"IsTypeOf(NorthwindModel2.Customer)\">\n        <MappingFragment StoreEntitySet=\"\
    CustomerAddress\">\n            <ScalarProperty Name=\"Fax\" ColumnName=\"Fax\"\
    \ />\n            <ScalarProperty Name=\"Phone\" ColumnName=\"Phone\" />\n   \
    \         <ScalarProperty Name=\"Country\" ColumnName=\"Country\" />\n       \
    \     <ScalarProperty Name=\"PostalCode\" ColumnName=\"PostalCode\" />\n     \
    \       <ScalarProperty Name=\"Region\" ColumnName=\"Region\" />\n           \
    \ <ScalarProperty Name=\"City\" ColumnName=\"City\" />\n            <ScalarProperty\
    \ Name=\"Address\" ColumnName=\"Address\" />\n            <ScalarProperty Name=\"\
    CustomerID\" ColumnName=\"CustomerID\" />\n        </MappingFragment>\n    </EntityTypeMapping>\n\
    </EntitySetMapping>\n```\n\nWith these conceptual and mapping model definitions,\
    \ you can easily query all users (this returns both User and Customer entity objects):\n\
    \n```\nvar query = from u in context.Users\n    select u;\n```\n\nOn the other\
    \ hand, if we are interested only in Customers, we can use the OfType extension\
    \ method, which returns only the entities of a given type:\n\n```\nvar query =\
    \ from c in context.Users.OfType<Customer>()\n    select c;\n```\n\n# Inheritance\
    \ Mapping\n\nThree different approaches to mapping inheritance hierarchies to\
    \ database tables exist—table-per-type, table-per-concrete-type, and table-per-hierarchy.\n\
    \nWith the table-per-type approach, used in the previous example, each entity\
    \ type in the conceptual model is mapped to a separate database table. To retrieve\
    \ a derived entity such as Customer, the Entity Framework performs a SQL join\
    \ of all tables storing properties of parent entity types.\n\nWith the table-per-concrete-type\
    \ approach, each nonabstract type in the inheritance hierarchy gets its own table\
    \ with a full set of columns necessary to store properties of the entity type\
    \ itself and all of its parent types. This allows the Entity Framework to query\
    \ only one"
  merge: -1
  img_proc: true
- pgno: 92
  md: "table to retrieve entity of any given type. However, if you query instances\
    \ of a base type, such as User in the previous example, the Entity Framework has\
    \ to perform a SQL union of all tables to which the derived entity types are mapped.\n\
    \nWith the *table-per-hierarchy* approach, all entity types derived from a common\
    \ base are stored in a single table, with one or more columns serving as discriminators\
    \ that identify the entity type stored in each particular row. This approach results\
    \ in having columns required to store all properties of all types in a hierarchy\
    \ in a single table, which could easily become quite wide as the number of entity\
    \ types increases.\n\nEach of these approaches has unique trade-offs that can\
    \ have a significant effect on performance and data storage requirements of your\
    \ application. Assess them carefully before making a decision. See Chapter 9,\
    \ “Implementing Business Logic,” for a closer look at this advanced topic.\n\n\
    # Stored Procedures\n\nAlthough LINQ to Entities is a very powerful mechanism\
    \ for creating database queries, you might find yourself in a situation where\
    \ it is not enough and use of database stored procedures is desirable. The most\
    \ common reasons for using stored procedures in database applications are performance\
    \ optimization and security. Both of these reasons are still applicable but not\
    \ as relevant as in classic ADO.NET applications because Entity Framework generates\
    \ well-performing and secure SQL code out of the box. When optimizing performance,\
    \ your first choice should be to simplify and speed-up the LINQ queries. Making\
    \ sure that LINQ queries take advantage of indexes, return a minimal number of\
    \ rows, and use projections to limit the size of result sets goes a long way to\
    \ improve application performance. Although stored procedures are fully supported\
    \ by the Entity Framework, they require additional effort to implement and maintain,\
    \ so you should resort to using them for improved performance only after exhausting\
    \ the LINQ optimization options.\n\nConsider the following LINQ query that returns\
    \ products that need to be re-ordered:\n\n```\nvar query = from p in context.Products\n\
    \            where p.UnitsInStock < p.ReorderLevel\n            select p;\n```\n\
    \nSimilar logic can be implemented using T-SQL in the following stored procedure:\n\
    \n```\nCREATE PROCEDURE dbo.GetProductsToReorder\nAS\n    SELECT * FROM dbo.Products\n\
    \    WHERE UnitsInStock < ReorderLevel;\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: "> **NOTE**\n> \n> Code in this example would not benefit from using a stored\
    \ procedure. Any performance improvement from rewriting it in a stored procedure\
    \ using raw T-SQL would not be noticeable. It is used here only for simplicity.\n\
    \nHaving this procedure defined in the Northwind database, you can import its\
    \ definition as a *function* to the model. To do that, open the Update Wizard\
    \ that was discussed earlier by right-clicking the design surface in Entity Designer\
    \ and selecting the Update Model from Database item from the context menu. On\
    \ the Add tab of the Update Wizard, shown in Figure 2.14, expand Stored Procedures,\
    \ select the GetProductsToReorder stored procedure, and click the Finish button.\n\
    \n![](img/11b373b78859e17d318fd76939a0df9d_93_0.png)\n\nFIGURE 2.14 Adding stored\
    \ procedures to the entity model.\n\nWhen the Update Model wizard closes, the\
    \ stored procedure is added to the storage section of the entity model shown in\
    \ Figure 2.15. However, before it can be used in the application code, you must\
    \ add it as a *function* import to the conceptual section of the entity model.\
    \ Right-click the stored procedure in the storage section of the Model Browser\
    \ and select Add Function Import from the context menu—this opens a dialog similar\
    \ to that shown in Figure 2.16."
  merge: -1
