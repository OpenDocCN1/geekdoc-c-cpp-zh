- pgno: 61
  md: "# ObjectContext and Simple Queries\n\nAnother class automatically generated\
    \ by the Entity Designer is the ObjectContext called `NorthwindEntities`, shown\
    \ here in pseudo-code form:\n\n```\npublic partial class NorthwindEntities : ObjectContext\n\
    {\n    public ObjectSet<Product> Products { get; }\n}\n```\n\nAn ObjectContext\
    \ encapsulates a database connection, allows you to query the database using LINQ\
    \ (Language Integrated Query), and manipulate data rows using entity classes instead\
    \ of the general-purpose DataRow objects used with classic ADO.NET. Here is how\
    \ we can retrieve a list of products for which the number of units in stock dropped\
    \ below the reorder level:\n\n```\nusing (NorthwindEntities context = new NorthwindEntities())\n\
    {\n    var query = from p in context.Products\n                where p.UnitsInStock\
    \ < p.ReorderLevel\n                select p;\n\n    foreach (Product p in query)\n\
    \        Console.WriteLine(p.ProductName);\n}\n```\n\nThe Products property of\
    \ the NorthwindEntities class encapsulates the Products database table. It returns\
    \ an ObjectSet of Product instances, which can be used in LINQ queries such as\
    \ the one in the example just displayed.\n\n# Associations\n\nThe entity model\
    \ can also define associations between entities. In the database, relationships\
    \ are represented as foreign keys, such as the one from the SupplierID column\
    \ of the Products table referencing the SupplierID column of the Suppliers table.\
    \ To take advantage of this capability of the Entity Framework, you need to add\
    \ the Suppliers table to the entity model. The easiest way to do this with an\
    \ existing database is by using the Update Wizard. Simply right-click the surface\
    \ of the Entity Designer and choose Update Model from Database.... This brings\
    \ up an Update Wizard dialog, similar to the one shown in Figure 2.6."
  merge: -1
  img_proc: true
- pgno: 62
  md: "![](img/11b373b78859e17d318fd76939a0df9d_62_0.png)\n\nFIGURE 2.6 Adding database\
    \ objects to the model.\n\nThe Update Wizard is very similar to the Entity Data\
    \ Model Wizard you used to create the model initially. It uses the connection\
    \ string stored in the application configuration file to retrieve the list of\
    \ database tables, views, and stored procedures that exist in the target database\
    \ but have not been added to the entity model yet. Any tables that were previously\
    \ included in the model are refreshed automatically, meaning that database schema\
    \ changes are merged in the model. For this example, add the Suppliers table and\
    \ click the Finish button.\n\n> NOTE\n> \n> Note that the Update Wizard uses the\
    \ pluralization and foreign key column options you selected when creating the\
    \ model. Avoid changing these options; it results in inconsistently named entity\
    \ classes and object set properties.\n\nWhen the Update Wizard finishes updating\
    \ the model, you see the new entity types, Supplier in this case, displayed in\
    \ the Entity Designer along with the association (shown as a dotted line) that\
    \ was created based on the SupplierID foreign key, similar to what is shown in\
    \ Figure 2.7.\n\nThe Entity Framework supports several different types of associations.\
    \ What we have in this case is a one-to-many association between Supplier and\
    \ Product entities. In other words, for each Supplier instance there might be\
    \ zero or more Product instances as indicated by the * symbol on the design surface.\
    \ The SupplierID property is nullable, so a Product does not have to have a Supplier\
    \ specified, which is indicated by the 0..1 multiplicity in the model. If the\
    \ SupplierID column did not allow null values, making a"
  merge: -1
