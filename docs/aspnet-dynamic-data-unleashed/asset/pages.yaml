  md: 'NOTE


    The read-only field templates do not include validators by default. With less
    than ten read-only field templates included in a Dynamic Data project out of the
    box, you can add the UnleashedValidator controls to the field templates and improve
    display of property-specific errors. However, if you choose to do it, make sure
    the validators are hidden when there are no errors; otherwise, the increase in
    the size of generated HTML and JavaScript could have a significant impact on performance
    of all read-only pages in the application.


    # Business Rules in the Database


    Some of the business logic discussed in this chapter is similar to what you can
    do with database stored procedures, triggers, and check constraints. It is indeed
    possible to implement robust business rules directly at the database level; however,
    doing so has an immediate impact on performance and scalability of the overall
    system, which are especially important for high-volume web applications.


    A system scales up when its performance can be increased by installing faster
    or additional CPUs and RAM on a single physical computer. On the other hand, a
    system scales out when its performance can be increased by adding more computers.
    Scaling up is expensive; the cost of both hardware and software grows exponentially
    as the number of CPUs and amount of RAM increases beyond typical commodity levels.
    In practice, this means that performance you can get out of a database server
    has a practical limit, sometimes called a glass ceiling, which would require unreasonably
    high costs to break through. Scaling out is much cheaper, as the cost of adding
    commodity servers to the system grows only linearly. Unfortunately, most relational
    database management systems that exist today scale up much better than they scale
    out; in fact, scaling out a database server is nearly impossible without redesigning
    the system itself.


    In general, scalability of an information system can be improved by performing
    CPU-bound tasks on the application servers (such as a web server in our example)
    and I/O-bound tasks on the database server. Most of the business rules discussed
    so far are CPU-bound, or in other words, they only need CPU cycles to execute
    and do not need to access the database. Therefore, implementing them in the entity
    classes of the application allows you to scale out the system by adding application
    servers and leaving the precious resources of the database server available for
    compiling queries and calculating execution plans.


    However, some types of business logic, such as validation of uniqueness or referential
    integrity, are I/O-bound. They require access to data and can be implemented more
    efficiently on the database server. Suppose that all products in the Northwind
    database must have unique names. If you implement this validation logic in the
    Product entity class, the application would need to send one request to the server
    to query the Products table for'
