- pgno: 64
  md: "# Querying Across Associations\n\nLINQ supports queries that take advantage\
    \ of associations defined in the model. Here is how you could write a query that\
    \ returns all Products where the Supplier is located in London:\n\n```\nvar query\
    \ = from p in context.Products\n            where p.Supplier.City == \"London\"\
    \n            select p;\n```\n\nNotice how the Supplier navigation property of\
    \ the Product entity allows you to filter based on the City property of the Supplier\
    \ entity. This query could be rewritten to more closely resemble a traditional\
    \ SQL query, as follows:\n\n```\nvar query = from p in context.Products\n    \
    \        from s in context.Suppliers\n            where p.SupplierID == s.SupplierID\n\
    \            && s.City == \"London\"\n            select p;\n```\n\nAlthough the\
    \ first version of the query might look strange to someone used to working with\
    \ SQL statements, it is simply a more elegant and concise way of expressing a\
    \ join query in LINQ.\n\n# Modifying and Saving Entities\n\nTo create new and\
    \ modify existing rows in a database table with the Entity Framework, you need\
    \ to manipulate the entity instances. In the example that follows, the code retrieves\
    \ a specific Product instance, updates its UnitsInStock property value, and then\
    \ submits changes to the database by calling the SaveChanges method of the ObjectContext:\n\
    \n```\nusing (NorthwindEntities context = new NorthwindEntities())\n{\n    var\
    \ query = from p in context.Products\n                where p.ProductName == \"\
    Outback Lager\"\n                select p;\n    Product outbackLager = query.First();\n\
    \    outbackLager.UnitsInStock += outbackLager.UnitsOnOrder;\n    context.SaveChanges();\n\
    }\n```\n\nThe SaveChanges method uses information in the entity model, the primary\
    \ key definitions in particular, to generate an appropriate UPDATE SQL statement\
    \ necessary to modify the UnitsInStock field value of the row in the Products\
    \ table."
  merge: -1
  img_proc: true
- pgno: 65
  md: "To insert a new row into a database table, you need to create a new entity\
    \ instance and add it to the context as shown below. For newly added entities,\
    \ the object context automatically generates INSERT SQL statements.\n\n```\n```csharp\n\
    using (NorthwindEntities context = new NorthwindEntities())\n{\n    Product p\
    \ = new Product() { ProductName = \"Mukuzani\" };\n    context.Products.AddObject(p);\n\
    \    context.SaveChanges();\n}\n```\n```\n\n# LINQ to Entities\n\nLanguage Integrated\
    \ Query functionality is not unique to the Entity Framework. It is a general purpose\
    \ feature of the C# and Visual Basic programming languages that takes advantage\
    \ of the .NET classes in the System.Linq namespace that define the various query\
    \ expressions and operations. Entity Framework implements a LINQ flavor, called\
    \ LINQ to Entities, that allows translating .NET queries into the underlying SQL\
    \ queries for Microsoft SQL Server and other database engines.\n\n# Query Execution\n\
    \nLINQ queries are objects that implement an IQueryable<T> interface and store\
    \ the query compiled in a form of a LINQ expression:\n\n```\n```csharp\nIQueryable<Product>\
    \ query = from p in context.Products\n                             where p.Supplier.City\
    \ == \"London\"\n                             select p;\nConsole.WriteLine(query.Expression);\n\
    ```\n```\n\nThe query is not executed until it is actually accessed by enumeration,\
    \ as in this example:\n\n```\n```csharp\nforeach (Product p in query)\n    Console.WriteLine(p.ProductName);\n\
    ```\n```\n\nor with one of the LINQ extension methods, such as First.\n\n```\n\
    ```csharp\nProduct product = query.First();\n```\n```\n\nThe query object itself\
    \ does not store the entities retrieved from the database. This is important mainly\
    \ for performance reasons—every time you access the query by enumerating its entities\
    \ it returns or call one of the LINQ extension methods, a new SQL query is sent\
    \ to the database engine. If you need to access the query results multiple times,\
    \ it would be much faster to store the entities the query returns in a list and\
    \ access the list, which does not trigger the query execution:"
  merge: -1
  img_proc: true
