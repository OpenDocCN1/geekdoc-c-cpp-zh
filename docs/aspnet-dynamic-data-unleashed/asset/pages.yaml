- pgno: 490
  md: "# Implementing Row-Level Security\n\nIn addition to the entity- and action-level\
    \ authorization rules, the metadata API also has a limited provision for implementing\
    \ row-level security. In particular, the MetaTable class defines the following\
    \ virtual method you use to implement row-level security for read operations:\n\
    \n```\npublic virtual IQueryable GetQuery(object context);\n```\n\nThe GetQuery\
    \ method receives an instance of the ObjectContext class, such as the NorthwindEntities\
    \ in this example, and returns a LINQ query object that will be used by the dynamic\
    \ templates to load data of the entity for display.\n\n> **NOTE**\n> \n> Because\
    \ Dynamic Data supports multiple data access frameworks, Entity Framework, and\
    \ LINQ to SQL out of the box, and allows third-party vendors to create their own\
    \ providers, the actual context object passed to the GetQuery method varies based\
    \ on the framework used by application. This is why the type of the context parameter\
    \ is object instead of a more strongly typed ObjectContext. With LINQ to SQL,\
    \ the argument would be of type DataContext, and the only common ancestor they\
    \ have with Entity Framework's ObjectContext is object.\n\nSimilar to the permission\
    \ methods, you can override the GetQuery method in the custom descendant of the\
    \ MetaTable class. The next code snippet shows how you could implement this method\
    \ and allow users in role Customer to access only their own customer record and\
    \ orders. Notice how it relies on the EntityType property to determine which entity\
    \ class the MetaTable object represents. Knowing the entity class, you can cast\
    \ the untyped IQueryable object to a strongly-typed IQueryable<T> and use LINQ\
    \ to filter out records that the user does not have access to:\n\n```\npublic\
    \ override IQueryable GetQuery(object context)\n{\n    IQueryable query = base.GetQuery(context);\n\
    \    IPrincipal user = HttpContext.Current.User;\n    if (user.IsInRole(\"Customer\"\
    ))\n    {\n        if (this.EntityType == typeof(Customer))\n        {\n     \
    \       query = query.Cast<Customer>()\n                .Where(customer => customer.EmailAddress\
    \ == user.Identity.Name);\n        }\n        else if (this.EntityType == typeof(Order))\n\
    \        {\n            query = query.Cast<Order>()\n                .Where(order\
    \ => order.Customer.EmailAddress == user.Identity.Name);\n        }\n    }\n```"
  merge: -1
  img_proc: true
