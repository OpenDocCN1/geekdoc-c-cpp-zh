- pgno: 430
  md: "Notice how much easier it is to filter Product entities based on Supplier entity\
    \ properties with LINQ than it is with plain SQL. LINQ allows you to traverse\
    \ the Supplier navigation property and specify filter criteria for the parent\
    \ entity without having to implement an explicit join. Here is an equivalent query\
    \ that looks closer to the INNER JOIN SQL statement you would have to create without\
    \ LINQ:\n\n```\nIQueryable<Product> query =\n    from p in context.Products\n\
    \    join s in context.Suppliers.Where(s => s.Country == \"UK\")\n        on p.SupplierID\
    \ equals s.SupplierID\n    select p;\n```\n\nObviously, this query is more verbose\
    \ and difficult to understand; it is unlikely you would have chosen this approach\
    \ when implementing custom filtering logic. However, it does offer an important\
    \ advantage over its predecessor when it comes to building queries dynamically.\
    \ By using an explicit join operator, this new query helps you to see that you\
    \ can combine two completely independent queries, context.Products and context.Suppliers.Where(s\
    \ => s.Country == \"UK\"), to return a set of child, Product, and entities filtered\
    \ by search criteria applied to its parent entity, Supplier.\n\nThis is exactly\
    \ how the Parent filter template works to fit into the constraints of the Dynamic\
    \ Data filtering architecture. The template receives the child query, context.Products,\
    \ has the nested filter template generate the parent query, context.Suppliers.Where(s\
    \ => s.Country == \"UK\"), combines them with a join, and uses a select to return\
    \ just the child entities.\n\nUnfortunately, Dynamic LINQ does not support the\
    \ join operator, so you have to implement this logic from ground up with the LINQ\
    \ expression API. This is, by far, the most complex, error-prone, and time consuming\
    \ programming task you will encounter when building dynamic web applications.\
    \ On the bright side, it helps you to gain a new level appreciation of the heavy\
    \ lifting that the C# and Visual Basic compilers do for you when converting the\
    \ magically simple LINQ queries to expressions.\n\nTo build a LINQ query dynamically,\
    \ you have to be familiar with the extension method syntax (as opposed to the\
    \ language-integrated syntax) of building LINQ queries. LINQ expressions are an\
    \ object model that represents queries built with LINQ extension methods. Because\
    \ the language-integrated query syntax is a higher-level abstraction on top of\
    \ the extension methods, it is easier to make a mental jump from the LINQ extension\
    \ methods to LINQ expressions. Here is the same query, expressed with the LINQ\
    \ extension method, Join:\n\n```\nIQueryable<Product> query = Queryable.Join(\n\
    \    context.Products,\n    context.Suppliers.Where(s => s.Country == \"UK\"),\n\
    \    p => p.SupplierID,\n    s => s.SupplierID,\n    (p, s) => p);\n```"
  merge: -1
  img_proc: true
- pgno: 431
  md: "To eliminate ambiguity, here the static Join method of the Queryable class\
    \ is called explicitly, not as an extension method. This is the lowest-level code\
    \ you can write in C# to create a LINQ query, but it still hides a lot of complexity.\
    \ As you can see from its declaration shown next, the Join method is generic:\n\
    \n```\npublic static IQueryable<TResult> Join<TOuter, TInner, TKey, TResult>(\n\
    \    this IQueryable<TOuter> outer,\n    IEnumerable<TInner> inner,\n    Expression<Func<TOuter,\
    \ TKey>> outerKeySelector,\n    Expression<Func<TInner, TKey>> innerKeySelector,\n\
    \    Expression<Func<TOuter, TInner, TResult>> resultSelector\n)\n```\n\nIt is\
    \ a bit overwhelming trying to understand something so abstract. You might find\
    \ it helpful to look at the Join method with specific parameters, which you can\
    \ do by writing a sample query in Visual Studio and pointing the mouse cursor\
    \ at the method name to see the tooltip while stepping over it in debugger. Here\
    \ is what the debugger displays for this sample query:\n\n```\nIQueryable<Product>\
    \ queryable.Join<Product, Supplier, int?, Product> (\n    IQueryable<Product>\
    \ outer,\n    IEnumerable<Supplier> inner,\n    Expression<Func<Product, int?>>\
    \ outerKeySelector,\n    Expression<Func<Supplier, int?>> innerKeySelector,\n\
    \    Expression<Func<Product, Supplier, Product>> resultSelector)\n```\n\nTo break\
    \ it down into smaller pieces, the outer parameter is the query that returns child\
    \ entities, and the inner parameter is the query that returns parent entities—in\
    \ this example, products and suppliers, respectively. When no additional filter\
    \ criteria is applied to either query, these parameters could be simply context.Products\
    \ and context.Suppliers, respectively, resulting in a join performed between the\
    \ two entire tables. From the stand-point of the Parent filter template, you do\
    \ not need to worry about constructing these parameters with LINQ expression objects.\
    \ The GetQueryable method receives the first query as its argument, and the nested\
    \ filter template builds the second query.\n\nThe outerKeySelector parameter is\
    \ a lambda expression that takes a Product entity as a parameter and returns value\
    \ of its SupplierID property. In the original query, this looks simply like p\
    \ => p.SupplierID; however, with LINQ expression objects, building the key selector\
    \ is a little more involved. Here is how you could do it:\n\n```\nParameterExpression\
    \ parameter = Expression.Parameter(typeof(Product));\nMemberExpression property\
    \ = Expression.Property(parameter, \"SupplierID\");\nLambdaExpression productKeySelector\
    \ = Expression.Lambda(\n    property, parameter);\n```\n\nThe innerKeySelector\
    \ parameter is very similar, only it takes a Supplier entity as a parameter and\
    \ returns value of its SupplierID property. In the original query, it looked like\
    \ this: s => s.SupplierID. What you don’t see, however, is that the compiler automatically"
  merge: -1
  img_proc: true
- pgno: 432
  md: "converted the int value of the SupplierID property of the Supplier entity to\
    \ the int? type expected by the Join method for compatibility with the SupplierID\
    \ property of the Product entity, which is nullable. With LINQ expression objects,\
    \ this key selector could be built like this:\n\n```\nParameterExpression parameter\
    \ = Expression.Parameter(typeof(Supplier));\nMemberExpression property = Expression.Property(parameter,\
    \ \"SupplierID\");\nUnaryExpression converted = Expression.Convert(property, typeof(int?));\n\
    LambdaExpression supplierKeySelector = Expression.Lambda(\n    converted,\n  \
    \  parameter);\n```\n\nFinally, the resultSelector parameter is a lambda expression\
    \ that takes a Product and a Supplier objects as parameters and returns the Product\
    \ object. In the original query, the lambda expression looked like this: (p, s)\
    \ => p. With LINQ expression objects, this lambda can be constructed as such:\n\
    \n```\nParameterExpression product = Expression.Parameter(typeof(Product));\n\
    ParameterExpression supplier = Expression.Parameter(typeof(Supplier));\nLambdaExpression\
    \ resultSelector = Expression.Lambda(\n    product, product, supplier);\n```\n\
    \n> **NOTE**\n> \n> The order of arguments in the Expression.Lambda method is\
    \ a little confusing. The body of the lambda expression is specified as the first\
    \ argument, followed by a parameter array (C# keyword params), that specifies\
    \ parameters of the lambda expression. In other words, the order of arguments\
    \ is a reverse of what you might intuitively expect. Remembering this and carefully\
    \ inspecting each expression object in Visual Studio debugger can help you to\
    \ avoid this gotcha when programming LINQ expressions.\n\nAt this point, you know\
    \ how to provide all arguments to the Queryable.Join method; what is left to do\
    \ is construct the method call itself. Keep in mind that the Join operator will\
    \ be translated to SQL by the Entity Framework and executed by the database server.\
    \ In other words, the Join extension method will not be called by the application\
    \ itself, and you need to construct it as a MethodCallExpression object. You can\
    \ accomplish this task with the help of the the Expression.Call factory method,\
    \ or more specifically, with this particular overload:\n\n```\npublic static MethodCallExpression\
    \ Call(\n    Type type,\n    string methodName,\n    Type[] typeArguments,\n \
    \   params Expression[] arguments\n)\n```\n\nThe type parameter represents type,\
    \ whose method you need to call, Queryable in the example. The methodName parameter\
    \ is a string containing the name of the method to be"
  merge: -1
  img_proc: true
- pgno: 433
  md: "called, \"Join\" in this example. The typeArguments is an array of the type\
    \ arguments that will be used by the .NET runtime to create a specific implementation\
    \ of the generic Join method. The arguments parameter is an array of Expression\
    \ objects that represent the arguments that will be passed to the method. With\
    \ the selectors built earlier, here is how the Join LINQ expression can be created\
    \ in code:\n\n```\n```csharp\nMethodCallExpression joinCall = Expression.Call(\n\
    \    typeof(Queryable),\n    \"Join\",\n    new Type[] {\n        typeof(Product),\n\
    \        typeof(Supplier),\n        typeof(int?),\n        typeof(Product)\n \
    \   },\n    new Expression[] {\n        productQuery.Expression,\n        supplierQuery.Expression,\n\
    \        productKeySelector,\n        supplierKeySelector,\n        resultSelector\n\
    \    }\n)\n```\n```\n\n> **NOTE**\n> \n> It is easy to confuse typeArguments with\
    \ arguments. With the dozen or so different overloads that the Expression.Call\
    \ method defines, this results in compiler errors that make very little sense\
    \ and do not help to understand the problem. When working with MethodCallExpression\
    \ objects, remember that in a generic method call, the typeArguments are the things\
    \ that go between < >, and arguments are the things that go between ( ).\n\nThe\
    \ final step in constructing a LINQ query with expression objects is to convert\
    \ the LINQ expression to an IQueryable object and replace the original query.\
    \ Here is how this can be done in the example with products and suppliers:\n\n\
    ```\n```csharp\nIQueryProvider queryProvider = productQuery.Provider;\nproductQuery\
    \ = queryProvider.CreateQuery(joinCall);\n```\n```\n\nHere you use the IQueryProvider\
    \ object returned by the Provider property of the original product query. The\
    \ IQueryProvider interface defines a CreateQuery method that takes a lambda expression\
    \ object as a parameter and returns an IQueryable object that represents the new\
    \ query. By passing a MethodCallExpression to the CreateQuery method of the query\
    \ provider, you create a new IQueryable (that is, a new LINQ query) that returns\
    \ results of a join between Product and Supplier queries."
