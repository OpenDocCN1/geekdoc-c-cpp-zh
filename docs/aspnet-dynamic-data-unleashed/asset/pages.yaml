    \ as CHAR and VARCHAR. However, the errors it reports when encountering values\
    \ that are too long to be stored in the underlying database column without data\
    \ truncation do not include the actual column name. This makes debugging of truncation\
    \ errors unnecessarily difficult. Fortunately, the StringLengthAttribute can be\
    \ used to validate the string length before the data is sent to the database server.\
    \ Here is how you can extend the ProductName property of the Product entity class:\n\
    \n```\n```csharp\n[Required]\n[StringLength(40, MinimumLength = 2)]\npublic object\
    \ ProductName;\n```\n```\n\nThe StringLengthAttribute allows you to specify both\
    \ minimum and maximum length that a string value can have. The *maximum* length\
    \ is required and specified as the first argument of the constructor. The *minimum*\
    \ length is optional and has to be specified explicitly by including the name\
    \ of the MinimumLength property in the constructor.\n\nThe following test method\
    \ verifies how the StringLengthAttribute works by initializing the ProductName\
    \ property with a string that consists of 41 characters—one character too long.\
    \ As you would expect from a validation attribute, this code throws a ValidationException,\
    \ which unlike the low-level SqlException includes the display name of the column\
    \ that caused the problem:\n\n```\n```csharp\n[TestMethod]\n[ExpectedValidationException(MemberName\
    \ = \"ProductName\")]\npublic void ProductName_MustBe40CharactersOrLess()\n{\n\
    \    using (new TransactionScope())\n    using (var context = new NorthwindEntities())\n\
    \    {\n        var product = new Product();\n        product.ProductName = new\
