    }

    ```


    Out of the box, Dynamic Data applications use the GetQuery method of the MetaTable
    class in the implementation of the foreign key templates (both field and filter)
    as well as in the many-to-many field template. So when users open the DropDownList
    generated by the ForeignKey filter template, they will only see those records
    from the parent table that were returned by the GetQuery method provided. You
    can see how the Customer filter control looks in Figure 14.8 when a customer,
    Alfreds Futterkiste in this example, accesses it. Notice that the drop-down list
    contains only one item.


    ![](img/11b373b78859e17d318fd76939a0df9d_491_0.png)


    FIGURE 14.8 Orders List page with the customer filter showing GetQuery results.


    Unfortunately, the page templates, such as the List template in the last screenshot,
    do not use the GetQuery method. Even though the foreign key filter list might
    be correct, the page itself still displays all records. If you take a closer look
    at the Ship Name column in Figure 14.8, you will notice that it lists orders shipped
    to various customers, not just the Alfreds Futterkiste the GetQuery method returns
    for the current user of the application.


    # NOTE


    Neither EntityDataSource nor LinqDataSource controls allow replacing the default
    logic for creating queries. This is a bit surprising because both of these controls
    define a ContextCreating event. The dynamic page templates handle this event to
    have the data source control use the context object returned by the metadata API,
    or more specifically, the CreateContext method of the MetaTable class. The absence
    of a similar QueryCreating event might explain why the GetQuery method is ignored
    by Dynamic Data out of the box.'
  merge: -1
  img_proc: true
- pgno: 492
  md: "You can work around this limitation with the help of the QueryCreated, the\
    \ same event used by the QueryExtender control and dynamic filters. This event\
    \ enables you to modify the query object already created by the data source control;\
    \ you need to extract the actual row filtering logic from the GetQuery into a\
    \ separate method. For consistency with dynamic filters and to avoid naming collisions\
    \ with the main GetQuery, in the UnleashedMetaTable class that comes with this\
    \ book, the new method is called GetQueryable,\n\n```\npublic override IQueryable\
    \ GetQuery(object context)\n{\n    IQueryable query = base.GetQuery(context);\n\
    \    return this.GetQueryable(query);\n}\n```\n\n```\npublic IQueryable GetQueryable(IQueryable\
    \ query)\n{\n    IPrincipal user = HttpContext.Current.User;\n    if (user.IsInRole(\"\
    Customer\"))\n    {\n        if (this.EntityType == typeof(Customer))\n      \
    \  {\n            query = query.Cast<Customer>()\n                .Where(customer\
    \ => customer.EmailAddress == user.Identity.Name);\n        }\n        else if\
    \ (this.EntityType == typeof(Order))\n        {\n            query = query.Cast<Order>()\n\
    \                .Where(order => order.Customer.EmailAddress == user.Identity.Name);\n\
    \        }\n    }\n    return query;\n}\n```\n\nNotice that the main GetQuery\
    \ still calls the new GetQueryable, which keeps the foreign key and other templates\
    \ respecting the row-level security rules it implements. But now you can modify\
    \ the dynamic page templates to also call it from the QueryCreated event handlers.\
    \ For example, in the List page template, you need to modify markup of the EntityDataSource\
    \ control and hook up the event handler, like so:\n\n```\n<asp:EntityDataSource\
    \ ID=\"dataSource\" runat=\"server\"\nEnableFlattening=\"false\"\nOnQueryCreated=\"\
    DataSource_QueryCreated\"/>\n```\n\nAs you might recall from the discussion of\
    \ filter templates in Chapter 5, “Filter Templates,” the QueryCreated event handler\
    \ receives a QueryCreatedEventArgs object as its second parameter. Through this\
    \ object’s Query property, you can get the original"
  merge: -1
  img_proc: true
- pgno: 493
