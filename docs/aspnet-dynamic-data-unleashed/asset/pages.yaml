  md: "# LISTING 1.8 Integer_Edit Field Template (Code-behind)\n\n```\n```csharp\n\
    using System;\nusing System.Collections.Specialized;\nusing System.Web.DynamicData;\n\
    using System.Web.UI;\n\nnamespace WebApplication.DynamicData.FieldTemplates\n\
    {\n    public partial class Integer_EditField : FieldTemplateUserControl\n   \
    \ {\n        public override Control DataControl\n        {\n            get {\
    \ return this.textBox; }\n        }\n\n        protected void Page_Load(object\
    \ sender, EventArgs e)\n        {\n            this.textBox.ToolTip = this.Column.Description;\n\
    \n            this.SetupValidator(this.requiredFieldValidator);\n            this.SetupValidator(this.compareValidator);\n\
    \            this.SetupValidator(this.regularExpressionValidator);\n         \
    \   this.SetupValidator(this.rangeValidator);\n            this.SetupValidator(this.dynamicValidator);\n\
    \        }\n\n        protected override void ExtractValues(IOrderedDictionary\
    \ dictionary)\n        {\n            dictionary[this.Column.Name] = this.ConvertEditedValue(this.textBox.Text);\n\
    \        }\n    }\n}\n```\n```\n\nField templates are incredibly flexible. This\
    \ particular template, Integer_Edit, can be reused for other integer columns in\
    \ the Product table, such as UnitsOnOrder and ReorderLevel, as well as integer\
    \ columns in all other tables in the data model. The field template will even\
    \ configure the RangeValidator based on the range of values appropriate for a\
    \ data type of the particular column, such as Int16 or Int32. All you need to\
    \ do is place a DynamicControl on your page and specify its DataField and Mode\
    \ properties."
