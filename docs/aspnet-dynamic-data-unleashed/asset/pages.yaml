- pgno: 438
  md: '# Summary


    In this chapter, you saw some of the techniques for building custom pages that
    display information in tabular format and allow users to search for information
    by filtering and sorting the data. You reviewed some of the limitations of the
    built-in templates and controls that Dynamic Data provides out of the box and
    focused on the commonly requested need to display read-only information from several
    related tables on a single page. Unlike displaying data from a single entity,
    which Dynamic Data does very well, this type of functionality is not provided
    out of the box but not difficult to implement.


    The UnleashedFilter control created in this chapter along with the UnleashedFilterTemplate
    base class for filter templates and the supporting UnleashedFilterExpression eliminates
    the limitations unnecessarily imposed by the built-in DynamicFilter control in
    version 4.0 of ASP.NET. In particular, by avoiding the Page events, the UnleashedFilter
    allows you to create advanced filter templates that use nested field controls
    to generate powerful queries that span multiple related entities. Similar to the
    DynamicControl, the UnleashedFilter also accepts custom attributes and automatically
    initializes the matching public properties of the filter template it creates.
    Consistently with the extended functionality of the UnleashedControl created earlier
    in this book, the UnleashedFilter also recognizes control parameters specified
    in the FilterUIHint attribute that might be applied to the property in the entity
    model and uses them to initialize the matching public properties of the filter
    template as well.


    To enable building pages that display and allow filtering by properties from multiple
    related entities, a field template and a filter template (both called Parent)
    were created. Both templates are designed for use with foreign key navigation
    properties, like the Supplier property of the Product entity. In custom pages,
    you can use these templates explicitly by setting the UIHint or FilterUIHint properties
    of the UnleashedControl or the UnleashedFilter controls, respectively. Both templates
    define a property called DisplayField, which specifies the name of the property
    in the parent entity that you want to display on the page and, in the case of
    the Parent filter template, allow users to filter by.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# CHAPTER 13


    # Building Dynamic List Pages


    # IN THIS CHAPTER


    +   - Extending Filter Lookup Rules

    +   - Building Dynamic UI with Custom Properties

    +   - Implementing Support for Custom Properties

    +   - Sorting of Custom Properties

    +   - Generating Metadata Attributes


    Just like when building metadata-driven forms in Chapter 11, “Building Dynamic
    Forms,” during development of the metadata-driven list pages the goal is to get
    the best possible, not perfect, dynamic UI based on the information in the entity
    model and data annotations you supply.


    Dynamic forms and list pages rely on a lot of common metadata. In a typical dynamic
    form, entity properties appear in a vertical list of labels and controls, and
    in a dynamic list page, they appear in a horizontal list of GridView columns.
    The DisplayAttribute is used by both to determine the human-readable display names
    as well as order of appearance on the page. Using this and other data annotation
    attributes to configure dynamic list pages is similar to the process and techniques
    discussed in previous chapters.


    There are, however, significant differences between form and list pages. Some
    of them are fundamental, such as the absence of the equivalent for entity templates.
    Because DynamicField does not inherit from Control, placing instances of this
    class in a separate user control without the parent GridView control is impossible.
    Other differences, such as the algorithms used by Dynamic Data to look up field
    and filter templates, are the result of the implementation limitations of the
    built-in components of the framework.


    One of these limitations was solved in the previous chapter by introducing the
    UnleashedFilter control to replace the built-in DynamicFilter. It enables you
    to specify custom parameters for filter templates directly in the entity model
    by applying the FilterUIHintAttribute to entity properties.'
  merge: -1
  img_proc: true
- pgno: 440
  md: "```\n[MetadataType(typeof(Metadata))]\npartial class Product\n{\n    private\
    \ abstract class Metadata\n    {\n        [UIHint(\"Text\", null, \"Columns\"\
    , 100)]\n        [FilterUIHint(\"Text\", null, \"Columns\", 100)]\n        public\
    \ object ProductName { get; set; }\n    }\n}\n```\n\nJust like the UnleashedControl,\
    \ which was extended in Chapter 11 to automatically initialize matching public\
    \ properties of the field templates based on the control parameters specified\
    \ in the UIHintAttribute, the UnleashedFilter initializes public properties of\
    \ the filter templates based on the information specified in the FilterUIHintAttribute,\
    \ such as the Columns property in this example.\n\nThis chapter centers discussion\
    \ on eliminating some of the shortcomings in Dynamic Data that make building metadata-driven\
    \ list pages more difficult than they really need to be. It also continues the\
    \ discussion of how to build list pages that display and allow searching information\
    \ from multiple related entities, this time dynamically. To accomplish these goals,\
    \ the sample solution extends the metadata information, which was reviewed in\
    \ Chapter 7, “Metadata API.”\n\n# Extending Filter Lookup Rules\n\nAs you might\
    \ recall from a discussion in Chapter 3, “Field Templates,” Dynamic Data uses\
    \ a sophisticated algorithm to locate field templates based on the metadata information\
    \ describing entity properties. It first checks the entity property for presence\
    \ of the UIHintAttribute, which can specify the name of a field template explicitly.\
    \ If the property does not have a UI hint, Dynamic Data then checks it for the\
    \ DataTypeAttribute, which can specify a business-level name of the property type,\
    \ such as EmailAddress or Date, and look for field templates with the matching\
    \ name. In the absence of a high-level data type, Dynamic Data uses a low-level\
    \ type of the entity property, such as String or DateTime, to look for the matching\
    \ field template. If a direct match is not immediately available, Dynamic Data\
    \ uses a fallback algorithm to try more and more generic types, such as going\
    \ from Float to decimal to string.\n\nThe lookup algorithm used for field templates\
    \ makes it easier to develop dynamic pages because it significantly reduces the\
    \ amount of additional data annotation attributes needed in the entity model.\
    \ Unfortunately, Dynamic Data does not implement the same fallback-based rules\
    \ for locating filter templates. In fact, it hard-codes the lookup rules to the\
    \ three types of filter templates that come out of the box—Boolean, Enumeration,\
    \ and ForeignKey. For all other types of properties—String, Int32, DateTime, and\
    \ so on—the filter template name has to be specified explicitly."
  merge: -1
  img_proc: true
- pgno: 441
  md: 'When building custom search screens, the overhead of specifying the filter
    templates is not significant—you simply need to specify the `FilterUIHint` attribute
    for any instance of the `DynamicFilter` (or the `UnleashedFilter`) control that
    needs it. The custom page template encapsulates the presentation logic for a particular
    entity, and having filter templates specified there explicitly is not a problem.
    However, when building search pages dynamically, you must specify the `FilterUIHintAttribute`
    directly in the entity model. Figure 13.1 shows a Product list page, which has
    a typical selection of built-in filter templates. With only Boolean, Enumeration,
    and ForeignKey filters supported out of the box, this means having to use the
    `FilterUIHintAttribute` a lot, not only increasing the amount of code you have
    to write and maintain, but also forcing you to hardcode the presentation logic
    in the business layer of the application.


    ![](img/11b373b78859e17d318fd76939a0df9d_441_0.png)


    FIGURE 13.1 Product list page with default filter lookup algorithm.


    Luckily, Dynamic Data allows replacing the filter lookup algorithm, and it can
    be brought up to par with the field templates. The `MetaModel` class defines a
    property called `FilterFactory` that stores an object responsible for locating
    and instantiating the filter templates. However, it is the `MetaTable` class,
    with the help of the `GetFilterableColumns` method, that determines whether a
    particular `MetaColumn` is considered filterable, before the filter factory gets
    involved. In this section, you learn how to extend the built-in `FilterFactory`,
    `MetaModel`, and `MetaTable` classes to implement a fall-back algorithm for filter
    templates that closely mimics the default algorithm used for field templates.


    # Extending the FilterFactory Class


    `FilterFactory` is a simple class defined in the `System.Web.DynamicData` namespace.
    In addition to its constructor, it defines only two public methods—`CreateFilterControl`
    and `GetFilterVirtualPath`:'
