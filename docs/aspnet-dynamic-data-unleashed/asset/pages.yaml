- pgno: 403
  md: "```\n[AttributeUsage(AttributeTargets.Class, AllowMultiple = false)]\npublic\
    \ class EntityUIHintAttribute : Attribute\n{\n    public EntityUIHintAttribute(string\
    \ entityUIHint)\n    {\n        this.EntityUIHint = entityUIHint;\n    }\n\n \
    \   public string EntityUIHint { get; private set; }\n}\n```\n\nThis attribute\
    \ is applied to an entity class or its associated metadata class. Its constructor\
    \ takes a string that serves as the entity UI hint and stores it in the EntityUIHint\
    \ property, which is accessed by the page templates. Here is how definition of\
    \ the Employee entity class looks with the new hint applied:\n\n```\n[MetadataType(typeof(Metadata))]\n\
    partial class Employee\n{\n    [EntityUIHint(\"TwoColumn\")]\n    private abstract\
    \ class Metadata\n    {\n        [Display(GroupName = \"Left\", Order = 100)]\n\
    \        public object FirstName { get; set; }\n\n        [Display(GroupName =\
    \ \"Left\", Order = 110)]\n        public object LastName { get; set; }\n\n  \
    \      [Display(GroupName = \"Right\", Order = 200)]\n        public object Address\
    \ { get; set; }\n\n        [Display(GroupName = \"Right\", Order = 210)]\n   \
    \     public object City { get; set; }\n    }\n}\n```\n\nSimilar to the field\
    \ template hint specified with the UIHintAttribute, the entity hint is a name\
    \ of a particular template you want Dynamic Data to use instead of the default.\
    \ In this example, TwoColumn is the name of the new dynamic entity template created\
    \ shortly to implement a simple two-column form layout."
  merge: -1
  img_proc: true
- pgno: 404
  md: "> NOTE\n> Because the EntityUIHintAttribute is applied to entity classes, it\
    \ has to be accessible from the project where your EDMX (entity model) is defined.\
    \ As you can tell by looking at the namespace declaration, this attribute is defined\
    \ in the Unleashed.DataAnnotations project of the sample solution accompanying\
    \ this book. It is referenced by the DataModel project, which contains the entity\
    \ model itself.\n\n# Extending Page Templates to Support EntityUIHintAttribute\n\
    \nTo support the entity UI hints, you need to extend the built-in page templates\
    \ that come with Dynamic Data project templates to initialize the UIHint property\
    \ of the DynamicEntity control programmatically. Similar to other dynamic controls,\
    \ this task has to be performed in the Init event handler before the control loads\
    \ the template. You can modify markup of the three built-in page templates—Details,\
    \ Insert, and Edit, plus the Delete page template created in Chapter 6, to define\
    \ the Init event handler:\n\n```\n<asp:DynamicEntity runat=\"server\" OnInit=\"\
    DynamicEntity_Init\" />\n```\n\nMake sure you leave the Mode attribute as is (the\
    \ Edit and Insert page templates set it to Edit and Insert, respectively). The\
    \ Init event handler itself is shown next. As you can see, it tries to find the\
    \ EntityUIHintAttribute in the MetaTable object describing the entity class. If\
    \ the attribute is found, the code sets the UIHint property of the DynamicEntity\
    \ control:\n\n```\nprotected void DynamicEntity_Init(object sender, EventArgs\
    \ e)\n{\n    var entityUIHintAttribute = this.table.Attributes\n        .OfType<EntityUIHintAttribute>().FirstOrDefault();\n\
    \    if (entityUIHintAttribute != null)\n        ((DynamicEntity)sender).UIHint\
    \ = entityUIHintAttribute.EntityUIHint;\n}\n```\n\n# UnleashedEntity Control\n\
    \nYou can reimplement the DynamicEntity initialization logic in all four of the\
    \ dynamic page templates. With a small number of page templates, this will not\
    \ be a big effort. However, it is always a good idea to avoid code duplication.\
    \ One of the ways to do it is to create an extended version of the DynamicEntity\
    \ control, such as the UnleashedEntity in the sample solution. Listing 11.12 shows\
    \ its source code."
  merge: -1
  img_proc: true
- pgno: 405
  md: "# LISTING 11.12 UnleashedEntity Implementation\n\n```\n```csharp\nusing System;\n\
    using System.Linq;\nusing System.Web.DynamicData;\nusing Unleashed.DataAnnotations;\n\
    \nnamespace Unleashed.DynamicData\n{\n    public class UnleashedEntity: DynamicEntity\n\
    \    {\n        protected override void OnLoad(EventArgs e)\n        {\n     \
    \       this.Load += this.InitializeFromMetadata;\n            base.OnLoad(e);\n\
    \        }\n\n        private void InitializeFromMetadata(object sender, EventArgs\
    \ e)\n        {\n            if (string.IsNullOrEmpty(this.UIHint))\n        \
    \    {\n                MetaTable table = this.FindMetaTable();\n            \
    \    var attribute = table.Attributes.OfType<EntityUIHintAttribute>()\n      \
    \              .FirstOrDefault();\n                if (attribute != null)\n  \
    \                  this.UIHint = attribute.EntityUIHint;\n            }\n    \
    \    }\n    }\n}\n```\n```\n\nThe DynamicEntity control creates the entity template\
    \ in its OnLoad method; the UnleashedEntity overrides it and relies on the Load\
    \ event handler called InitializeFromMetadata to initialize the UIHint property.\
    \ Because the DynamicEntity control does not offer a Table property, the MetaTable\
    \ object describing the current entity has to be located by calling the FindMetaTable\
    \ extension method. This method is actually defined in the DynamicDataExtensions\
    \ class, but calling it with the extension syntax makes the code a lot shorter."
  merge: -1
  img_proc: true
- pgno: 406
  md: "> NOTE\n> \n> Creating the UnleashedEntity control just for the sake of initializing\
    \ its UIHint might seem excessive compared to other, simpler ways you could encapsulate\
    \ this functionality. However, there are other reasons to extend this control\
    \ as well. Recall the capability implemented in the UnleashedControl to inherit\
    \ its Mode property from the parent entity template. The UnleashedEntity control\
    \ implements similar logic, which enables using generic templates discussed in\
    \ Chapter 4 inside of multimode templates from Chapter 10 without having to implement\
    \ additional initialization. Refer to the source code accompanying this book to\
    \ see how this was accomplished.\n\nWith all four page templates modified to use\
    \ the UnleashedEntity instead of the DynamicEntity control, you now have support\
    \ for metadata-driven entity UI hints in your Dynamic Data web application and\
    \ can begin implementing additional form layouts as in separate dynamic entity\
    \ templates.\n\n# Building a Dynamic Two-Column Entity Template\n\nAs you might\
    \ recall, the idea of the two-column entity template is that you specify the name\
    \ of the column where you want a particular property to display using the GroupName\
    \ property of the DisplayAttribute applied to it in the metadata. In the following\
    \ code snippet, the FirstName and LastName properties need to be in the column\
    \ called “Left”, and the Address and City properties need to be in the column\
