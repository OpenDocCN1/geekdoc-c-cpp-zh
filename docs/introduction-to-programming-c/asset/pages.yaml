    # Working of the do-while Loop


    The do-while loop is similar to the while loop only but here the condition is
    evaluated after the statement is executed. Its flowchart is as follows:


    ![](img/42939e3827776e586a0db54ad80037b2_96_0.png)


    Please note that it is important to place a semicolon (;) after closing the Boolean
    expression in the do-while loop construct. This loop construct executes the statement
    part in the loop before the boolExpr is evaluated. Also note that it is because
    of this reason that the minimum number of times the do-while loop is executed
    is one. The loop is terminated when the boolExpr yields a false value. Because
    the condition is tested after execution of the body of the loop, it is also known
    as a post-tested loop.


    # Notes


    +   1. The do-while loop is the same as the repeat-until control construct of
    PASCAL language except that the loop is terminated when the test condition returns
    a false value.'
