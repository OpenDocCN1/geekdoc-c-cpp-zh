  md: '# Example 3: Write the steps to implement a self-referential structure—a linked
    structure.


    Solution 3: When a member of a structure is declared as a pointer to the structure
    itself, then the structure is called a self-referential structure.


    For example,


    ```

    struct link

    {

    int data;

    struct link *p;

    };

    ```


    This means the structure link consists of two members: data and p. The member
    data is a variable of type int whereas the member p is a pointer to a structure
    of type link. Thus, the structure link has a member that can point to a structure
    of type link. This type of self-referential structure can be shown as follows:


    | p | | A | B |

    |---|---|---|---|


    Since the pointer p can point to a structure variable of type link, we can connect
    two such variables, A and B, to obtain a linked structure as shown above. This
    linked structure can be obtained by the following procedure:


    +   S1: Declare structure-link.


    +   S2: Declare variable A and B of type link.


    +   S3: Assign the address of structure B to member p of structure A.'
