  md: 'ARRAYS AND POINTERS • 213


    ally small. Bigger programs, called monolithic programs, should therefore be avoided.


    # Characteristics of a Module


    +   1. A module contains a series of program instructions in some programming
    language.

    2. A module is terminated by some special markers required by the syntax of the
    language.

    3. A module as a whole has a unique name.

    4. A module has only one entry point to which control is transferred from the
    outside and only one exit point from which control is returned to the calling
    module.

    5. Structured programming involves modularization of a program structure.


    Top-down analysis is a method of problem solving and problem analysis. It involves
    two main tasks:


    +   (a) Subdivision of the problem

    (b) Hierarchy of tasks


    The top-down method carries out a process of division and subdivision, creating
    a hierarchy of tasks until these tasks can no longer be decomposed (i.e., they
    become atomic).


    # 3.3 FUNCTIONS


    As noted, a module is developed to make a program more approachable. In languages
    like PASCAL, we call these modules procedures, FORTRAN calls them subfunctions
    and subprocedures, but C calls them functions. A subprogram or function is a name
    given to a set of instructions that can be called by another program or a subprogram.
    This simplifies the programming as functions can be called again and again as
    desired. Understand that a function is a complete program in itself, similar to
    the C main() function, except that the name main() is replaced by the name of
    the function that is given by the programmer.'
