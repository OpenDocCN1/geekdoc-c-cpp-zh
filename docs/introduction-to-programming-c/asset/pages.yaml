  md: "Another variant of the break statement has the following syntax:\nbreak label_name;\n\
    \nFor example:\n\n```\n{\n  Statement;\n  break kk;\n}\nkk:\n```\n\nHere, label_name\
    \ is an identifier and not a number. There is no need for declaring these labels\
    \ as they are just user-defined labels. When the compiler encounters the break\
    \ (kk in this example), control jumps to the statement labeled kk and executes\
    \ the statements following that label. If these statements appear before a break\
    \ statement, the flow is backward. If the statements appear after a break statement,\
    \ the flow is forward.\n\n# The continue Statement\n\nA continue statement is\
    \ used within loops to end execution of the current iteration and proceed to the\
    \ next iteration. Thus, it provides a method of skipping the remaining statements\
    \ in that iteration after the continue statement. Please note that a continue\
    \ statement should be used only in loop constructs and not in selective control\
    \ constructs. Also note that using a continue statement in selective control constructs\
    \ results in a compilation error.\n\n# Continue Statement Syntax\n\ncontinue;\n\
    In a while loop. The program jumps to the Boolean expression at the top of the\
    \ loop. If the expression is still true, the next iteration begins.\n\nIn a do-while\
    \ loop. The program jumps to the boolean expression at the bottom of the loop,\
    \ which determines whether the next iteration will begin.\n\nIn a for loop. Causes\
    \ the update expression (i.e., increment/decrement part of the for loop) to be\
    \ executed and then the test expression is evaluated."
