  md: '(a) Declare an array


    (b) Instantiate an array


    The syntax for declaration of an array depends on the shape and number of dimensions.
    Only declared arrays can be instantiated. It is worth mentioning here that it
    is also possible to combine declaration and instantiation in a single statement.


    In C, a one-dimensional array is declared as follows:


    ```

    datatype arrayname[];

    ```


    For example, the following statements declare an array of integers:


    ```

    int marks[];

    ```


    Note that this statement just declares that ‘marks'' is an array variable; no
    array actually exists.


    Arrays can also be initialized (for example, the first 6 elements) as follows:
    int marks [] = {10, 20, 30, 40, 50, 60};


    Please note that in this case the array will automatically be created large enough
    to hold the number of elements that you specify in the array initializer. Also
    note that there is no need of using new operator when you initialize an array.
    You can access an array element by specifying its index within square brackets.
    For example, you can access the fourth element of an array ‘marks'' as marks[3].


    Remember the points:


    +   1. The square brackets follow the data type and not the array name.


    +   2. It is also possible to have the square brackets follow the array name.


    +   3. The above syntax declares references to the arrays of a specific data type.


    +   4. These references are initialized with default null values.


    +   5. Thus, memory is not allocated for an array by the declaration alone.


    +   6. The data type of elements and the rank of the array are identified by the
    declaration.


    +   7. The size of an array representing the length of dimension is not part of
    the array’s type. That is why the size of the array is not mentioned in its declaration.'
