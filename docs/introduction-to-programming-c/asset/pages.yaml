    a reference to the address of a float is made. When the compiler encounters an
    address of a float, it automatically sets a flag to have linker link in the floating
    point emulator. That is why these statements prevent the linking of the floating
    point emulator into a program. Thus, to prevent this error, include the statement
    in the beginning of your programs.


