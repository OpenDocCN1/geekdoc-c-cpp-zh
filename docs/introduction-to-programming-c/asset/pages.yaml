    6. An array name followed by a subscript enclosed within the square brackets refers
    to the individual elements in it.


    7. The subscript can be *byte, short, char, or int.* it cannot be **long type**.


    8. The elements are stored in **consecutive/successive memory locations.**


    9. Subscript array variables are treated as ordinary variables.


    10. Subscript array variables use the subscript enclosed within square brackets
    whereas ordinary variables do not have any subscript.


    11. By incrementing the value of the subscript by 1, the data stored in the subsequent
    memory location is obtained. **Please note here that this is not true of ordinary
    variables.**


    12. Accessing an array element is similarly easy irrespective of the size of the
    array. **The value of the subscript gives the position of the element in the array.**


    13. Arrays may be **one-dimensional or multidimensional.**


    14. Arrays may be **regular or ragged.**


    15. In 2D arrays, all rows have the same number of columns.


    16. A 1D ragged array may have rows with equal or different column sizes.


    17. An array instance created is always an array type.


    18. When an instance of an array is created, the rank and size of each dimension
    are specified and **remain constant throughout the lifetime of the instance. It
    is not possible to change the rank and size of the dimensions of an existing array.**


    19. Sizes must be constant values.


    20. An array is a reference data type.'
