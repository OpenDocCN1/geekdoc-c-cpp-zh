  md: '# CHAPTER 5


    # FILE HANDLING IN C


    # 5.0 INTRODUCTION


    Files have long been used for storing data. Files are traditional data structures.
    They are useful for sequential operations like reading from or writing to a file.
    You need to create a file, open it, and finally close the file. You can also read
    from a file. When the data of a file is stored in the form of readable and printable
    characters, the file is called a text file. On the other hand, if a file contains
    nonreadable characters in binary code, the file is called a binary file. For example,
    the program files that are created by an editor are stored as text files whereas
    executed files generated by a compiler are stored as binary files.


    # 5.1 FILE POINTERS


    First, we have to open a file. As we open a file a link is established between
    the program and the OS. Thus, the OS now comes to know the name of the file, the
    data structure, and the mode in which the file is to be opened (reading or writing:
    text mode or binary mode). The filename can have any extension like .docx, .xlsx,
    .txt, and so on. Note that the data structure of a file is defined as FILE, which
    is present in the <stdio.h> header file.


    Syntax (of declaring a file pointer)


    ```

    FILE *fp;

    ```'
