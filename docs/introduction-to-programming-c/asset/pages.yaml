    # Type Qualifiers


    A type qualifier is used to refine the declaration of a variable, function, and
    parameters by specifying whether the value of a variable can be changed or the
    value of a variable must always be read from memory rather than a register. In
    C they are of two types:


    +   1. const

    2. volatile


    Let us discuss them by one.


    # I. const Qualifier


    A const qualifier tells the C compiler that the value of a variable cannot be
    changed after its initialization. For example,


    float pi = 3.1417.


    That is, now pi cannot be changed throughout the program.


    Another way of doing this is using the #define preprocessor directive as follows:


    define PI 3.1417


    But please remember that const and #define are different. #define constants are
    declared at the beginning of the program, even before main(). On the other hand,
    const variables can be placed anywhere within the program. So const has fewer
    control over #define. #define cannot be placed anywhere in the program. This gives
    an error.


