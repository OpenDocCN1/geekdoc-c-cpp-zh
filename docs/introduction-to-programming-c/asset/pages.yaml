    # Rules for Using if Statements


    +   Rule 1: The conditionally executed statement should appear on the line after
    the if statement.


    +   Rule 2: The conditionally executed statement should be indented one level
    from the if statement.


    Recall that in most editors, when you press the tab key, you are indenting by
    one level. By indenting the conditionally executed statement, you are causing
    it to stand out visually. This is so you can tell at a glance what part of the
    program the if statement executes. This is the standard way of writing statements.


    # NOTE


    +   1. Don''t put semicolons after the if(testcondition) portion, because the
    if statement is incomplete without its conditional part. But if you place a semicolon
    there, the compiler assumes that you have terminated the statement. No error will
    be displayed but the compiler will assume an empty statement does nothing. Also
    note that the null statement (an empty statement that does nothing) will become
    the conditionally executed statement. The statement that you intended to be conditionally
    executed will be disconnected from the if statement and will always execute. For
    example:


    ```

    int u=5, v=10;

    ```


    ```

    if ( u>v); System.out.println("u is greater than v" + u);

    ```'
