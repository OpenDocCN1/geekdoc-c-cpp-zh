    **Example 14: Write random short notes on random access files.**


    **Solution 14:** In random access files, it may be possible to access a particular
    data item from any position in the file. There is a restriction for random access—all
    data items must be of the same size or record length must be fixed. In the case
    of random access, the file pointer is used. By controlling the file pointer, random
    access of a file can be made possible. Here, *random* means that data can be read
    from or written to any position in a file without reading or writing all of the
    preceding data. For random access to files of re-c, the following functions are
    used:


    +   1. `seek()`—moves the file pointer to a new location in the file

    2. `ftell()`—finds the current position and sends it to a new location in the
    file

    3. `rewind()`—positions the file pointer to the beginning of the file


    # Summary


    Despite the popularity of databases today, the concept of files still exists.
    This is because files perform certain tasks that are done better using that format,
    like sequential processing of records. All data and programs are stored in files.
    Even the editor you use, like tc editor or tc++ editor, uses and works on files
    only. Even when you are sending attachments in an email, these are files that
    are attached and sent.


