  md: '# 5.6 BLOCK (OR RECORD) I/O FUNCTIONS


    Block or Record I/O functions are used to read or write a structure or an array
    from a file. These functions are basically used to read or write database files—for
    instance, if we want to read or write a complete record of an employee from a
    file in the form of structure.


    # Writing Data to a File


    To write a block of data into a file, we use the fwrite( ) function:


    Syntax

    fwrite(ptr, m, n, fp);


    where ptr is an address of a structure or an array written into a file, m is the
    size of structure or an array, n is the number of structures or arrays to be written,
    and fp is a file pointer. After writing the block, the function returns the number
    of data items written. If less than requested, an error has occurred. In this
    case, the file must be opened in binary mode.


    # Reading Data from a File


    To read a block from a file, we use the read( ) function:


    Syntax

    read(ptr, m, n, fp);


    where ptr is the address of a structure or array read from a file, m is the size
    of the structure or array, n is the number of structures or arrays to be read,
    and fp is a file pointer.


