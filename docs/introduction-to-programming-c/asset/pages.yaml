    Every C program starts with some preprocessor directives or commands. These are
    special instructions to the preprocessor to tell it how to prepare a program for
    compilation. In every C program, we use a preprocessor directive named include.
    This command tells the preprocessor that we need information from selected libraries
    known as header files. By the time we type our C program (in some editors), all
    the preprocessor allocations have taken place automatically. This means that the
    preprocessor actually analyzes these statements before the analysis of the C program
    itself takes place.


    Preprocessor statements are identified by the presence of a pound sign, #, which
    must be the first nonzero character on the line.


    In C, a programmer gives a directive #include<stdio.h> that tells the preprocessor
    to include the header file stdio.h at this point in the program.


    Then a programmer can give global declarations (if any). Global declarations are
    those that are visible to all parts of the program. We shall study these a bit
    later.


    Then comes the main where the actual execution of the program starts. We know
    that the actual work of the program is carried out by its functions, which are
    blocks of code that accomplish tasks within a program. Only one function can be
    a main function in any program. All functions in a program (also the main) are
    subdivided into two sections—the declaration section and the statement section.


    The declaration section is at the beginning of the function. It specifies the
    data that you will be using in the function. Declarations in a function are known
    as local declarations because they are visible only to the function that contains
    them.


    The statement section follows the declaration section. This section contains some
    instructions that cause something to be performed, such as defining variables.


    Let us consider the simplest C program that explains its structure.


    ```

    /* My first C program */

    1. #include<stdio.h>

    2. int main (void)

    3. {

    4. printf("Hello World! \n");

    5. return 0;

    6. }

    ```'
