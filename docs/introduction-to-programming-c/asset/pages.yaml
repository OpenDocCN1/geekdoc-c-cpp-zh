    ```

    (*eptr).age;

    ```


    ```

    (*eptr).salary;

    ```


    It is mandatory to use parentheses here because the dot operator (.) has a higher
    precedence than that of the dereferencing operator (*). If you omit the parentheses,
    these expressions are interpreted as follows:


    ```

    (*eptr.name);

    ```


    ```

    (*eptr.age);

    ```


    ```

    (*eptr.salary);

    ```


