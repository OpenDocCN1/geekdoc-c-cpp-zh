    # 1.2 FLOWCHARTS


    A flowchart is defined as a pictorial representation of an algorithm. It serves
    as a means of recording, analyzing, and communicating information. Programmers
    often use a flowchart before writing a program, although this is not always mandatory.
    Practically speaking, sometimes drawing of the flowchart and writing of the code
    in a high-level language go by side. Flowcharts are of two types.


    +   (a) Program flowchart


    +   (b) System flowchart


    A flowchart (or simply a flowchart) shows the detailed processing steps within
    one computer program and the sequence in which those steps must be executed. Different
    notations are used in a flowchart to denote the different operations that take
    place in a program.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# C OVERVIEW • 9


    On the other hand, system flowcharts show the procedures involved in converting
    data on input media to data in output form. Here, the focus is on the data flow
    into or out of a program, the forms of input, and the forms of the output. Please
    understand that a system flowchart makes no attempt to depict the function-oriented
    processing steps within a program. system flowchart may be constructed by the
    system analyst as part of problem definition. Note that algorithms in data structures
    are always expressed in the form of flowcharts.


    This difference is clear from Figures 1.1a and 1.1b.


    ![](img/42939e3827776e586a0db54ad80037b2_20_0.png)


    Figure 1.1a A System Flowchart Example


    Contrast this with a program flowchart.


    ![](img/42939e3827776e586a0db54ad80037b2_20_1.png)


    Figure 1.1b A Program Flowchart Example'
  merge: -1
