  md: '# CHAPTER 3


    # ARRAYS AND POINTERS


    # 3.0 INTRODUCTION


    As we wish to store the marks of 3000 students at our college; if I use variables,
    more than 3000 variables are required. This is very tedious and cumbersome. So
    to solve this type of problem, we use an array that has a common name with a subscript
    representing the index of each element. Thus, an array is an ordered sequence
    of finite data items of the same data type that share a common name. The common
    name is the array name and each individual data item is known as an element of
    the array.


    An array is defined as a set of a similar type of elements that are stored continuously
    in memory. This means that the elements of an array are stored in the subsequent
    memory locations starting from the first memory location of the block of memory
    created for the array. Each element of an array can be referred to by an array
    name and a subscript or index. Please note that all elements of an array should
    be of similar type. Arrays can have more than one dimension—one-dimensional (1D),
    two-dimensional (2D), or multidimensional. A one-dimensional array uses a single
    index and a two-dimensional array uses two indexes, and so on. A 1D array can
    be used to represent a list of data items and is also known as a vector or a list.
    Similarly, a 2D array can be used to represent a table of data items consisting
    rows and columns. It is also known as a matrix. A 3D array can be used to represent
    a collection of tables. The concept can go beyond three dimensions also.'
