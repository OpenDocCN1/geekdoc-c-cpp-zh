  md: "# 2.10 SWITCH AND BREAK\n\nC provides an extremely handy **switch-case construct**\
    \ to facilitate selecting between multiple alternatives. Within the block of code\
    \ controlled by a **switch statement**, the programmer can place **case statements**\
    \ and (optionally) a **de-fault statement**. For example,\n\n```\nswitch (x) {\n\
    \    case 0 : str = \"none\"; break;\n    case 1 :\n      str = \"single\"; break;\n\
    \    case 2 :\n      str = \"pair\";\n      break;\n      default : str = \"many\"\
    ;\n}\n```\n\nEach case keyword is followed by an integer constant, followed by\
    \ a colon. **Note that the code block belonging to each *case* can immediately\
    \ follow the colon on the same line or on separate lines.** If the value of x\
    \ is not one of the values provided for case statements, the **default statement**\
    \ code is executed. **Also note that if there is no default statement and no exact\
    \ match, execution resumes after the *switch* block of code.**\n\nIn the program\
    \ example above, break statements are used to terminate the code for each *case*\
    \ and cause execution to continue after the **switch code block**. **Understand\
    \ that if a break does not appear, execution falls-through to execute code in\
    \ subsequent cases.** For example,\n\n```\nswitch (x) {\n    case 0 : printf(\"\
    A, \");\n    case 1: printf(\"B, \");\n    default: printf(\"C\");\n}\n```\n\n\
    Herein, a value of x would cause output of \"A, B, C.\"\n\nAlso understand that\
    \ most of the errors that occur when we work with switch structures seem to be\
    \ related to forgetting fall-through. **Therefore, we must always carefully check\
    \ for the *break state-ments* whenever we write a program using a *switch statement*.**\
    \ The block of code associated with **each case** can be as simple as a single\
    \ statement or it can be hundreds of lines of code. Moreover, this code block\
    \ can have another switch statement. But for better readability we should convert\
    \ any"
