    # 3.4 PARAMETER TRANSMISSION TECHNIQUES—CALL BY VALUE AND CALL BY REFERENCE


    There are two ways in which data can be made available to a program. One is to
    declare global data. This type of data will be available throughout the program.
    The other method is by passing data through and across functions. This method
    is better than the first one as in the first method (global variables) the privacy
    of the data is lost.


    The ultimate aim of the program is that data should be available to other functions.
    This can be done two ways—one is to declare data (variables) as global variables
    and the other way is to pass the data to the functions.


    Arguments can generally be passed to functions in one of two ways:


    +   (a) Sending the values of the arguments

    (b) Sending the addresses of the arguments


    Three methods are used: pass by value, pass by address, and pass by reference.


    # I. Pass by Value


    We know that the function header is always formal and thus its arguments are called
    formal arguments. Whenever a portion of the program is calling a function with
    a formal argument, control will be transferred from the main to the calling function
    and the value of the actual argument is copied into the function. Within the function,
    the actual value copied from the calling portion of the program may be altered
    or changed. Please note that when control is transferred back from the function
    to the calling portion of the program, the altered values are not transferred
    back. This way of passing formal arguments to a function is called call by value.
    The only limitation of call by value is that the value of the actual argument
    remains unchanged. This situation is useful where we do not want to change the
    values of the arguments. In other situations call by value is not as appropriate.'
