    # Working of the for Loop


    The working of the for loop is as follows:


    +   1. expr1 is evaluated.

    2. boolExpr is evaluated to check for the condition for execution. If it returns
    a true value, then

    (a) a statement in the loop is executed.

    (b) Expr2 is evaluated.

    (c) Control is then transferred to step 2.

    3. If the boolExpr returns a false value, the loop is terminated.


    This means the working of the for loop is as follows:


    ![](img/42939e3827776e586a0db54ad80037b2_99_0.png)


    That is, first, expr1 is evaluated. The condition is checked. Then the loop enters
    into the body (the brace) and executes the state-within it. After one iteration
    ever, control goes back to expr2 and then again the boolExpr condition is checked.
    This is the process by which a for loop works. Also note that any one, two, or
    all of the three expressions can be omitted in a loop but the semicolons (;) must
    placed separating the expressions. Also, expr1 and expr2 can be lists of expressions
    separated by a comma. Thus, expr1 or expr2 may become compound statements also.


    Remember the following points for loops:


    +   1. A for loop can also be written equivalently using while or do-while loops
    as follows:

    For loop implementation using while loop:'
