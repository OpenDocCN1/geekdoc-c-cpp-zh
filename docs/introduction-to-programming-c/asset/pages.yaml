  md: 'The continue statement should be used sparingly because, like the break statement,
    it also bypasses the loop''s logic and makes the code difficult to understand
    and debug.


    Most repetitive algorithms can be written with any of the loops discussed above.
    But each loop works best in different situations.


    +   1. The while loop: As we have seen, a *while loop* is a pretest loop. **This
    loop is ideal when you do not want the loop to iterate if the condition is false
    from the beginning.** It is also ideal if you want to use a sentinel value to
    terminate the loop. A *sentinel value is a special value that cannot be mistaken
    as a member of the list and signals that there are no more values to be entered.*
    When the user enters the sentinel value, the loop terminates.


    +   2. The do-while loop: As we have seen, a *do-while loop* is a sort of posttest
    loop. This loop is ideal for situations where you always want the loop to iterate
    at least once.


    +   3. The for loop: As we have seen, the *for loop* is a pretest loop that has
    inbuilt expressions for initializing, testing, and updating. These expressions
    make it very convenient to use a loop control variable as a counter. **The for
    loop is ideal in situations where the exact number of iterations is known.**


    # The Return Statement


    A return statement is used only in methods (functions in C and member-functions
    in C++ are known as methods in Java). It terminates the method''s execution by
    transferring control to the calling method. Thus, if a method has to return a
    value, you may write:


    ```

    return expression;

    ```


    On the other hand, for a void type of method that does not return any value, the
    following syntax is used:


    ```

    return;

    ```


    A return statement unconditionally transfers control to the calling method from
    the called method. This means that all statements between the return statement
    and the end of the method are skipped. That is why such a statement is normally
    placed at the end of a method; it is also possible to use it when specific conditions
    apply and an early termination is required. Using a return statement at the end
    of the method is essential in the case of methods that return a type different
    from void.'
