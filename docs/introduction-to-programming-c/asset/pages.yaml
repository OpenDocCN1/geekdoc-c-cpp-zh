  md: "# V. Recursions\n\nRecursion is defined as a process in which a function calls\
    \ itself again and again. It is a technique of defining a problem in terms of\
    \ one or more smaller versions of the same problem. The solution to the problem\
    \ is built on the results from the smaller versions. A recursive function is one\
    \ which calls itself directly or indirectly to solve a smaller version of its\
    \ task until a final call does not require a self-call.\n\nFor example:\n\n```\n\
    Add ( )\n{\n  Add ( );\n}\n```\n\nThis means that function add() calls itself.\n\
