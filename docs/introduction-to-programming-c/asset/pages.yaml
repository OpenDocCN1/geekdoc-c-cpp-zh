  md: '# 318 • C PROGRAMMING


    where FILE is the data structure included in stdio.h and fp is a file pointer

    which points to the start of the file.


    # Syntax (of opening a file)


    fp = fopen("filename", "mode");


    where fp is a pointer to a structure of FILE type. fopen() is a library function

    having two arguments; one is the filename and the other is the mode in

    which we want to open the file. It is defined in stdio.h and returns a pointer

    known as a file pointer to the FILE structure for the specified file, which we

    store in a pointer variable fp. Table 5.1 lists the different file-opening modes:


    Table 5.1: File-Opening Modes


    | Mode | Purpose |

    |---|---|

    | r | Opens a file for reading. If the file exists, it sets up a pointer

    points to the first character in it, it returns NULL. |

    | w | Opens a file for writing. If the file exists, its contents are

    overwritten, a new file is created with a pointer pointing to

    t first position. |

    | a | Opens a file for adding data at the end of an already existing

    file. If the file does not exist, a new file is created with a pointer

    pointing to the first character, else data is added at end. |

    | r+ | Opens a file for both reading and writing. Possible operations

    are reading existing contents, writing new contents, and

    modifying existing contents. Returns NULL if file does not exist. |

    | w+ | Opens a file for both reading and writing. Possible operations

    are writing new content or modifying existing

    content. If file does not exist, it will be created for update. |

    | a+ | Opens a file for both reading and appending. Possible operations

    are reading existing contents and adding new contents

    the end of the file; cannot modify existing contents. If file does

    not exist, it will be created. |

    | rb, wb, ab, rb+, wb+, ab+ | Binary files of the preceding modes, each with the
    same

    characteristics as its respective text file mode. |


    For example,

    fp = fopen("text.dat", "w");


    The OS will now open the file text.dat and prepare it for writing,'
