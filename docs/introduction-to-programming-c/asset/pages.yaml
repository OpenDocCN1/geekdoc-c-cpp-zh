    \ 10: What are fields in structures? Give examples.\n\nSolution 10: Bit fields\
    \ allow the packing of data in a structure. This is especially useful when memory\
    \ or data storage is at a premium. An integer takes 2 bytes in memory but sometimes\
    \ it happens that integer values to be stored less than 2 bytes, wasting memory.\
    \ By using these fields we can save a lot of memory.\n\n# Syntax (for bit-fields):\n\
    \n```\nstruct name\n{\n    data_type var1 : bit_length;\n    data_type var2 :\
    \ bit_length;\n    ...\n};\n```\n\nHere, data_type can be int or unsigned int;\
    \ var1, var2, ... are the names of the variables, and bit_length is the number\
    \ of bits used for a particular variable. **Note that the maximum value of a bit-field\
    \ of length n is 2<sup>n-1</sup>**.\n\nFor example:\n\n+   Packing several objects\
    \ into a machine word like 1-bit flags can be compacted—symbol tables in compilers."
