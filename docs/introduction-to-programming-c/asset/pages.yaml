  md: '# 142 • C PROGRAMMING


    The dimension of the array is known as its rank. For instance, a 1D array has
    rank 1, a 2D array has a rank of 2, and so on. The number of subscripts is determined
    by the rank of an array. The size or length of each dimension is represented by
    an integral value greater than or equal to 0. The total number of elements in
    an array is the product of the sizes of each dimension in an array. If one or
    more of the dimensions have size 0, the array is known as an empty array. An array
    may be regular or jagged. A ragged/jagged array is a 1D array which contains arrays
    as elements. A regular array is a multidimensional array where each dimension
    contains the same number of elements, which is not generally true for jagged arrays.


    NOTE 2D regular arrays are also known as rectangular arrays.


    Note that the size of an array is not part of the array data type.

