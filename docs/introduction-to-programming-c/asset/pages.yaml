    Alternatively, you can also access the structure members through a pointer variable
    using the dot operator. For this you have to first dereference the structure pointer
    using the ''*'' pointer and then use the dot operator.


    For example, if eptr is a structure pointer of type structure Emp, you can access
    the structure member''s name, age, and salary as follows:


    ```

    (*eptr).name;

