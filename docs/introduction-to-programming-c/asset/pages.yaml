  md: 'The arguments that are passed from main( ) are known as actual arguments. The
    actual arguments may be constants, variables, or more complex expressions.


    Each actual argument must be of the same type as its corresponding formal argument.


    It is the value of each actual argument that is transferred into the function
    and assigned to the corresponding formal argument.


    If the return type of the function is not specified, then by default it is assumed
    to be type int.


    Formal arguments cannot be constants or expressions.


    Rules for naming a function are the same as for variable names.


    The return type in the main or in the function must be of the same type.


    The function is known as a called function while the main( ) function that calls
    it is known as a calling function.


    Just as variables are declared, similarly functions needs to be declared as follows:


    <type> <name> (arguments);


    This is essentially a function prototype. If you are working in C on a UNIX platform,
    it may not be necessary to write the prototype first, but if you are running your
    program with a C++ compiler, it is necessary. Every C program can be run on a
    C++ compiler, too, as C is subset of C++.


    For example,

    fact(int n);


    Here, ''n'' is an actual argument and there is no return value in this function
    call. It ends with a semicolon. On the other hand, consider


    ```

    result = fact(int n);

    ```


    This function will return some value in the ''result'' variable.


    We can even write the following:


    ```

    fact();

    ```


    This means that the function has nothing to return now and has no arguments.'
