    # 5.2 CHARACTER INPUT/OUTPUT WITH FILES


    Just as we can read and write data from the keyboard using getchar() and putchar()
    functions, we can read or write one character at a time using character I/O operations.


    # Writing to a File


    Before writing to a file we must open it in write mode.


    # Syntax


    ```

    fputc(ch, fp);

    ```


    where ch is a character variable or constant and fp is a file pointer.


    # Reading Data from a File


    The data that is written into a file can also be read from the same file using
    the getchar() function.


    # Syntax


    ```

    ch = fgetc(fp);

    ```


    where ch is a character variable and fp is a file pointer.


    The getchar() function is used to read one character at a time from a file to
    which fp is pointing. It gives either the read character or the end-of-file (EOF).'
