    step between the English-like problem definition and C. This intermediate step
    is known as a pseudocode (pseudo=false). Pseudocode is a restatement of the problem
    as a list of lists, in an English-like format, describing what must be done to
    solve it. Using the pseudocode, a programmer writes the actual program. In a nutshell
    we can say that pseudocode consists of statements that are a combination of English
    and C, in which pseudocode is not quite C but can be easily translated. It can
    be refined and gradually made more precise. The practicality of this approach
    is the pseudocode used at one stage of the development process will often be a
