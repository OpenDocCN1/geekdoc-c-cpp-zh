  md: '# 12 * PROGRAMMING


    Let us now distinguish between a flowchart and an algorithm.


    | Flowchart | Algorithm |

    |---|---|

    | 1. The graphical or pictorial representation of the logic of the problem in
    hand | 1. Step-by-step finite procedure of solving the problem in hand |

    | 2. Use of different shapes that are joined by flow lines | 2. Written step by
    step |

    | 3. Use of flow lines | 3. Flow control moves from top to bottom |

    | 4. The task to be performed within boxes in English | 4. All instructions written
    in English |

    | 5. Easily converted into algorithm or program in high-level language | 5. Easily
    converted into flowchart or program in high-level language |

    | 6. Drawn after writing algorithm. | 6. Normally written before flowchart |


