  md: "(b) Reading external file formats—nonstandard file formats could be read in\
    \ like 9-bit integers.\n\nC allows us to do this in a structure definition by\
    \ putting bit length after the variable:\n\n```\nstruct packed_struct {\n    unsigned\
    \ int f1;\n    unsigned int f2;\n    unsigned int f3;\n    unsigned int f4;\n\
    \    unsigned int type:4;\n    unsigned int funny_int:9;\n} pack;\n```\n\nNote\
    \ that packed_struct contains 6 members: four 1-bit flags (f1 ... f3), a 4-bit\
    \ type, and a 9-bit funny_int. Also note that C automatically packs these fields\
    \ as compactly as possible, provided that the maximum length of the field is less\
    \ than or equal to the integer word length of the computer. If this is not the\
    \ case then some compilers allow memory overlap for fields while other would store\
    \ the next field in the next word. You can access members as usual:\n\n```\npack.type\
    \ = 6;\n```\n\nBut please keep the following points in mind while using bit fields:\n\
    \n+   1. Only lower n bits will be assigned to an n-number. Thus, you cannot take\
    \ values larger than 15 (4 bits long).\n2. Bit fields are always converted to\
    \ integer type for computation.\n3. You are allowed to mix “normal” types with\
    \ bit fields.\n4. Bit fields save memory.\n5. The unsigned definition is important—ensuring\
    \ that no bits are used as a flag.\n6. Bit fields lack portability between platforms.\
    \ Several reasons exist for this:\n    * Integers may be signed or unsigned.\n\
    \    * Many compilers limit the maximum number of bits in the field to the size\
    \ of an integer."
