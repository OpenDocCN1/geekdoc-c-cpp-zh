  md: "# Q2. Compare text files and binary files.\n\n[Hint:]\n\n| Text Files | Binary\
    \ Files |\n| Newline is converted into carriage return and linefeed combination\
    \ before being written to the disk and converted into newline when read from disk.\
    \ It will count 2 characters instead of 1 in text mode (i.e., one for carriage\
    \ return and the other for line feed). | No conversion takes place. Only one character\
    \ is counted for newline. |\n End of file is indicated by the EOF signal. | No\
    \ EOF signal exists. The end of file is checked by counting the number of characters\
    \ in the directory entry of the file. |\n In text mode, the number of characters\
    \ is stored as a character-by-character format (1234 will take 4 bytes; 1234.56\
    \ will take 7 bytes on disk). Numbers with more digits require more disk space.\
    \ For example, fscanf() and fprintf() use text mode. | Numbers can be stored by\
    \ changing them into binary format. Each number will occupy the same number of\
    \ bytes as it occupies in memory. Thus, storage of numbers in binary files is\
    \ more efficient. For example, fread() and fwrite() use binary mode. |\n\nQ3.\
    \ What are command arguments? Why do we use them? How are they passed to main?\
