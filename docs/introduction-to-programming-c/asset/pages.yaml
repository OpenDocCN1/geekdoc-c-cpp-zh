  md: "# Other Statements of C\n\n# The break Statement\n\nWhen a break statement\
    \ is executed inside a loop, it skips the remaining statements of that loop and\
    \ control is immediately transferred outside the loop.\n\n# Syntax\n\nbreak;\n\
    \nFor example,\n\n```\nvoid main()\n{\n    int i, j;\n    for(i=1; i<=3; i++)\
    \ {\n        for(j=1; j<=3; j++) {\n            if (i = j)\n                break;\n\
    \            else\n                printf(\"%d\\t %d\", i, j);\n        }\n  \
    \  }\n}\n```\n\n# OUTPUT (after running):\n\n+   2 1\n3 1\n3 2\n\n> Please note\
    \ that when a break statement appears inside a loop or in switch statement, it\
    \ terminates execution at that point and transfers execution control to the statement\
    \ immediately following the loop or switch statement. Thus, it does an early exit\
    \ from any loop or switch statement. Also note that when multiple statements are\
    \ nested within each other, a break transfers control to the immediate outer level.\n\
    \nHowever, break statements should be avoided in loops (whenever possible) because\
    \ they bypass the loop's logic and make the code difficult to understand and debug."
