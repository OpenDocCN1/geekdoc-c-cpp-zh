    For example, consider the following statement:


    total = x * y/z;


    The evaluation computes the value of x * y and divides z into that value and assigns
    the result value to ''total'' (the variable). **Also note that to override this
    associativity, put parentheses around the expression as follows:


    total = x * (y/z);


    This expression now computes (y/z) first, multiplies x by that value, and assigns
    the result value to ''total'' (the variable). Sometimes we do not need the default
    precedence to produce the desired result. For example,


    total = x + y * z;


    Here, since the multiplication operator has a higher precedence over addition,
    the expression calculates y*z first and adds this value to x. On the other hand,
    if you want to compute x+y first and then multiply that by z, use parentheses
    as follows:


    total = (x + y) * z;


    The rule can be stated as follows: “Parentheses are required whenever you want
    to override associativity as the default precedence. Within a pair of parentheses,
    the same hierarchy (as in Table 2.11) is operative. Also, if you have a nested
    set of parentheses, the operation within the innermost parentheses will be performed
    first, followed by the operation within the next innermost pair of parentheses,
    and so on.”'
