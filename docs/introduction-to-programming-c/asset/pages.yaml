    # Preprocessor Directive/Command


    As discussed earlier, a preprocessor is a part of the C compilation process that
    recognizes special statements that might be interspread throughout a C program.
    It actively analyzes these statements before analysis of the C program starts.
    The preprocessor is a section of the compiler which looks over the C program before
    it is compiled.


    # Working of Preprocessor


    When you issue the command to compile a C program, the program is run automatically
    with the preprocessor. The preprocessor is a program that modifies the C source
    program according to the directives supplied in the program. An original source
    program is usually stored in a file. The preprocessor does not modify this program
    file but creates a new file that contains the processed version of the program.
    This new file is then submitted to the compiler.


    When we compile this program, the compiler shows the number of lines compiled
    to be greater than 6. This is because during the preprocessing stage, the **include**
    preprocessor directive (line 1) searches the **stdio.h** in the prescribed list
    of directories and if the header file is found, the include directive is replaced
    by the entire content of the header file. If the included header file contains
    another include directive, it will also be processed. This processing carried
    out recursively until either no include directive remains or the maximum translation
    limit is achieved (ISO specifies a maximum of 15 nested levels of include files).**
    Thus, one line of source code gets replaced by multiple lines of the header file.
    During the compilation stage, these added lines will also be compiled. Thus, the
    compiler shows the number of lines to be greater than 6.


    > NOTE Some compilers enable the programmer to run only the preprocessor on the
    source program and to view the results of the preprocessor stage.'
