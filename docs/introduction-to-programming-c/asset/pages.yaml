  md: '# 10 • C PROGRAMMING


    A flowchart is a tool to show the logic flow of a program. Programmers use flowcharts
    to design a complete program. The primary purpose of a flowchart is to show the
    design of an algorithm. The flowchart frees a programmer from the syntax and details
    of a programming language while allowing focus on the details of the problem to
    be solved.


    A flowchart is a combination of symbols. Symbols enhance the readability of the
    flowchart. They do not directly show instructions (or commands). They show the
    start and stop points, the order and sequence of actions, and how one part of
    a flowchart is connected to another.


    # Golden Rule


    +   1. Each algorithm should only have one entry point and one exit point.

    2. A null statement is shown by a flow line; there is no symbol for null.


    Some of the notations used are shown in Figure 1.2.


    An oval shows the beginning or ending of an algorithm.


    Flow lines show the order or sequence of actions in a program.


    A connector is used when we reach the end of a page. It is also used when we need
    to show the logic details that do not fit in the flow.


    Assignment statements are shown using a rectangle, as in the following:


    Variable ← Expression


    A parallelogram shows any input read or output produced. A rectangle with two
    vertical bars inside represents a module call.


    Selection statements (Decisions) may be two-way or multi-way selections. In both
    cases, the statement ends with a connector where the true and false flows join.
    In this case, the connector has nothing in it. This is applicable to switch statements
    or even for, while, and do-while loops of C (to be discussed later).'
  merge: -1
