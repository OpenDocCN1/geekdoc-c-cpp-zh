  md: '# 2 • C PROGRAMMING


    This chapter discusses some basic terminology related to C and also explains the
    process of compiling a program written in the C language.


    # 1.1 THE CONCEPT OF ALGORITHMS AND PSEUDOCODES


    A computer is a dead piece of hardware if it is not loaded with software. It may
    be application software, system software, embedded software, or other types of
    software. The **basic operations of a computer system form the computer’s instruction
    set.** Now in order to solve a problem using a computer, you will have to express
    the solution to the problem in terms of the instructions for the particular computer.
    We define a computer program as a collection of instructions necessary to solve
    a specific problem. **The approach or method that is used to solve the problem
    is known as an algorithm. For example**, if you want to find the factorial of
    a number, then the set of statements that solves the problem becomes a **program**.
    You first express the solution to the problem in terms of an **algorithm** and
    then *develop a program that implements that*. A program may be written in any
    programming language of your choice, such as C/C++, JAVA2, Visual Basic 9, and
    so on.


    An algorithm is a formal step-by-step method for solving problems. Let us look
    now at the characteristics of algorithms:


    +   1. An algorithm consists of an **ordered sequence of instructions.**

    2. Each step of the algorithm should be unambiguous—that is, it should not have
    many meanings.

    3. It should have a **finite number of steps.**

    4. It should **terminate/stop** after this finite number of steps.

    5. It should have **some input** and may or not produce any **output.**


    Algorithms should be concise and compact to facilitate verification of their correctness.
    Verification involves observing the performance of an algorithm with a good quality
    of test cases.

    **For example,** we might want to write an algorithm to find the maximum from
    a set of n positive numbers. We assume that the numbers are stored in an array
    X.'
