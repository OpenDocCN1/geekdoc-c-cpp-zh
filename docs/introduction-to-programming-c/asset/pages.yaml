    \ provides two more user-defined data types—structures and unions. They are called\
    \ user-defined data types as users define them as per their needs. We define structure\
    \ as a collection of heterogeneous (dissimilar) elements that are stored contiguously\
    \ in memory. Understand that a structure is a collection of a fixed number of\
    \ elements that are accessed by name, not by index (as arrays are done). The elements\
    \ of a structure may be of different data types.\n\nSay we want to store a current\
    \ date—let's call it March 24, 2016—in a program. We take three different variables\
