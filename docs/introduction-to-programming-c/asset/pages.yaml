    the control or detection of the compiler, like a variable updated by the system
    clock. This prevents the compiler from optimizing code referring to the object
    by storing the object''s value in a register and reloading it rather than from
    memory, where it may have changed. Please understand that the volatile modifier
    is a directive to the compiler''s optimizer that operations involving this variable
    should not be optimized in certain ways. A volatile modifier may be used in two
