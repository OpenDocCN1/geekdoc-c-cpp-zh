  md: '# CHAPTER 1


    # OVERVIEW


    # 1.0 INTRODUCTION


    The C programming language was developed by Dennis Ritchie at AT&T Bell Laboratories
    in the early 1970s. Soon after, Bell Laboratories developed a new operating system,
    called UNIX. About 90% of the code for the Unix operating system (OS) was exclusively
    in C. As C gained popularity, more and more vendors joined the race and developed
    their own compilers. This was necessary because until the late 1970s, only Bell
    Laboratories had a C compiler.


    In the early 1980s, realizing the need to standardize the C language, the American
    Standards Institute (ANSI), an organization that handles such matters, began the
    task. In 1990, the first ANSI standard of C was published. Soon C became omnipresent
    and thus there was a need of further standardization. The International Standards
    Organization (ISO) adopted a standard ISO/IEC 9899:90. After 1990, many additional
    changes were made in the C language. In 1993, an ANSI committee (known as XJ11)
    was formed to standardize C. The most recent standard was adopted in 1999. It
    is known as ANSI C99 or ISO/IEC 9899:1999. Since then, C has been implemented
    on a wide variety of computers, including IBM-compatible personal computers (PCs),
    mainframes, microcomputers, and workstations.


    C is a higher-level language that nevertheless allows the programmer to deal with
    hardware at a much lower level. Please note that C is a general-purpose programming
    language, it was designed with systems programming applications in mind. So it
    provides a lot of power and flexibility.'
  merge: -1
