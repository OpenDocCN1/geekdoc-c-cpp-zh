  md: '# 2.8 TYPE CASTING (OR COERCION) IN C


    C supports different data types like int, float, long, double, and so on. Each
    of these has a different range of values because of their size and their signed/unsigned
    properties. In practice, an expression can have an operation between two different
    data types (one can be an integer and another be a float or vice versa). To handle
    such situations, C provides certain rules of type conversion in these cases. Please
    understand that when a compiler encounters different types of operands in the
    same expression, the smaller type is promoted to a larger type variable. The order
    of inbuilt data types is shown in Table 2.12.


    Table 2.12: Inbuilt Data Types


    | Data Type | Number of Bytes | Order |

    |---|---|---|

    | long double | 10 | 6 (largest) |

    | double | 8 | 5 |

    | float | 4 | 4 |

    | long | 4 | 3 |

    | int | 2 | 2 |

    | char | 1 | 1 |


    Thus, if you assign a variable of a smaller type—say, an int—to a larger type—say,
    a float—then the (int) smaller value is promoted to a (float) larger value. On
    the other hand, if you assign a variable of a larger type—say, a float—to a smaller
    type—say, an int—then the larger value is demoted and excess data can be truncated
    or, in some cases, the compiler will warn you unless you implicitly type cast
    it.


    This is done by the compiler automatically. But sometimes a programmer can also
    do type casting, which is a technique which you can convert one type to another
    type explicitly. Typecasting/coercion in C is done as follows:


    ```

    type(expression);

    ```


    Here, ''type'' is any valid data type in C to which conversion is to be performed.'
