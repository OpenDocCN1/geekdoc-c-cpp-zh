  md: '# C OVERVIEW • 17


    In the first step of the compilation process, the compiler examines each of the
    program statements contained in the source program and checks to ensure that each
    conforms to the syntax and semantics (meaning) of the language. Practically, the
    C compiler normally makes a prepar of the program looking for special statements.
    This is also known as a preprocessing phase. If any mistakes are discovered by
    the compiler during this phase, they are reported to the user and the compilation
    process ends right there. Then the errors have to be corrected in the source program
    using an editor and the compilation process must be restarted. Typical errors
    reported during this phase of compilation might be due to an expression that has
    unbalanced parentheses (syntax error) or to the use of a variable that is not
    defined (i.e., semantic error).


    When all the syntactic and semantic errors have been removed from the program,
    the compiler proceeds to take each statement of the program and translate it into
    lower form. This means that each statement is translated by the compiler into
    the equivalent statement or statements in assembly language to perform the task.


    After the program has been translated into an equivalent assembly language, the
    next step in the compilation process is to translate the assembly language statements
    into actual machine instructions. This step might not involve the execution of
    a separate process known as an assembler. In most systems, the assembler is executed
    automatically as part of the compilation process. The assembler takes each language
    statement and converts it into a binary format known as object code which is then
    written into another file on the system. This file typically has the same name
    as the source file under Unix, with the last letter "obj" (for object) instead
    of a "c". In Windows, the suffix typically replaces the file extension.


    After the program has been translated into object code, it is ready to be linked
    or gcc command is issued under Unix. Also understand that the purpose of the linking
    phase is to get the program into a final form for execution on the computer. If
    the program uses other programs that were previously processed by the compiler,
    then during this phase the programs are linked together. Programs that are used
    from the system''s program library are also searched and linked together with
    the object program during this phase. The process of compiling and linking a program
    is known as building. The final linked file, which is in an executable object
    code format, is stored in another file on the system, ready to be run or executed.


    Under Unix, this is called a.out (by default).'
