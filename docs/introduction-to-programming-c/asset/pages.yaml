    include directive or till the maximum limit is achieved (ISO specifies a maximum
    of 15 nested levels of include files). Thus, one line of source code gets replaced
    by multiple lines of the header file. During the compilation stage, these added
    lines will also be compiled. Thus, the compiler shows the number of lines to be
    greater than 6.


