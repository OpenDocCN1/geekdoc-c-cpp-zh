  md: '# 2.12 STORAGE CLASSES: AUTO, STATIC, EXTERN, AND REGISTER


    Variables in C have a data type. But they also have a storage class that provides
    information about their location and visibility. The storage class divides the
    portion of the program within which the variables are recognized. The following
    are the storage classes:


    # I. Auto


    The auto storage class is a local variable known only to the function in which
    it is declared.


    Auto is the default storage class. The auto keyword places the specified variable
    into the stack area of memory. This is usually implicit in most variable declarations
    like int i;


    The default storage class for all local variables is auto.


    For example,


    ```

    int counter;

    auto int i;

    ```


    Both the variables are here defined with the same storage class; auto can only
    be used within functions (i.e., local variables).


    # II. Static


    The static storage class is a local variable which exists and retains its value
    even after control is transferred to the calling function.


    A static variable is the one that does not initialized again and again. The static
    keyword is useful for extending the lifetime of a particular variable. Please
    note if you declare a static variable inside a function, the variable remains
    even after the function call is long gone (the variable is placed in the altered
    area of memory). Also note that the static keyword is overloaded. It is also used
    to declare variables to be private to a certain file when declared with global
    variables. Static variables can also be used with functions, making those functions
    visible only the file itself. Static is the default storage class for global variables.


    For example,


    ```

    static int count;

    ```'
