  md: "This is an infinite loop. Here, the Boolean literal true is used in place of\
    \ a boolExpr. It may also be written as follows to form an infinite loop:\n\n\
    ```\nwhile (! false) {\n  Stmt;\n}}\n```\n\nThus, if a loop does not have a way\
    \ of stopping, it is called an infinite loop.\nAn infinite loop continues to repeat\
    \ until the program is interrupted.\nFor example,\n\n```\nint numb =1;\nwhile\
    \ (numb <=5) {\n  printf(\"Hello\");\n}\n```\n\nThis is an infinite loop because\
    \ it does not contain a statement that changes the value of the numb variable.\
    \ Each time the Boolean expression is tested, numb will contain the value 1.\n\
    \nNow, say, by mistake the programmer has a semicolon at the end of the while\
    \ loop as follows:\n\n```\nwhile(numb <=5);\n```\n\nPlease note here that the\
    \ semicolon at the end of the first line is assumed to be a null statement and\
    \ disconnects the while statement from the block that comes after it. This while\
    \ loop will forever execute the null statement, which does nothing.\n\nNow, say,\
    \ you forget to put the braces after the while header as follows:\n\n```\nint\
    \ numb =1;\nwhile (numb <=5)\n  printf(\"Hello\");\nnumb++;\n```\n\nHere, the\
    \ numb++ statement is not in the body of the loop. Because the braces are missing,\
    \ the while statement only executes the statement that immediately follows. This\
    \ loop will also execute infinitely because there is no code in its body that\
    \ changes the numb variable.\n\nThe rules that you must follow can be stated as\
    \ follows:\n\nRule 1: If there is only one statement repeated by the loop, it\
    \ should appear on the line after the while statement and is indented one additional\
    \ level."
