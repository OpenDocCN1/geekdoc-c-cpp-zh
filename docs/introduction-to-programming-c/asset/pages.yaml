    # The Issue of Copying Arrays


    An array is an object. There is a difference between an array and the variable
    that references it. Thus, that array and the reference variable are separate entities.
    This difference becomes essential when you wish to copy the contents of one array
    to another. The following is the wrong way of copying an array:


    ```

    int a1[] = {1, 3, 5, 7};

    int a2[] = a1; //error, no copying will be done.

    ```


    These two statements will not copy the contents of a1 to a2. Instead a copy of
    the address stored in a1 is stored in a2. After this state executes, both the
    a1 and a2 variables will reference the same array. Recall that this is also known
    as shadow copying.


    # Correct Method


    We observed from the preceding example that we cannot copy by assigning one array
    reference variable to another. Please remember that to copy an array you need
    to copy the individual elements of one array as follows:


    ```

    int[] = {1, 2, 3, 4, 5, 6, 7, 8, 9};

    int[] = secondArray[9];

    for(int i=0; i < n; i++)

    secondArray[i] = firstArray[i];

    ```


    The loop in this code copies each element of firstArray to the corresponding element
    of secondArray.


