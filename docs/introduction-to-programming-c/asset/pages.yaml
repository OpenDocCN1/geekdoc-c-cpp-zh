  md: "# Syntax\n\n```\n<type> name (arguments)\n{\n    ....\n    ....\n    <statements>\n\
    }\n```\n\n‘type’ is the value returned by the function. If no value is returned\
    \ back from the function, the keyword void is used.\n\n‘name’ is the user-defined\
    \ name of the function. A function can be called from anywhere with this name\
    \ only.\n\n‘arguments’ is a list of parameters. If there are no parameters, then\
    \ just two parentheses () are placed.\n\nThe program segment enclosed within the\
    \ opening and closing brace is called a function body.\n\nFor example, in C every\
    \ program starts with main(). The program of every program within C also starts\
    \ with main() only. All functions you define must be called from main(), or else\
    \ they will not work.\n\n# Example\n\n```\nname()\n{\n    printf(\"\\n My name\
    \ is Dr. Rajiv Chopra\");\n}\nvoid main()\n{\n    clrscr();\n    printf(\"\\nGood\
    \ Morning\");\n    name();  /* function call */\n    getch();\n}\n```\n\nHere,\
    \ too, program execution starts from main(). It displays the message “Good Morning”\
    \ and then calls the function name(). Control goes to the function name(). It\
    \ displays “My name is Dr. Rajiv Chopra”. And then control goes back to the main\
    \ program."
