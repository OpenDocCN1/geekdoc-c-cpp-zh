    The following points may be made regarding switch statements:


    +   1. The expression in a switch statement must evaluate to one of the 32-bit
    or smaller integer types: byte, char, short, or int. The compiler checks that
    the legal range of the integer type covers all of the constants used in the case
    statements in the switch code block.


    +   2. The compiler throws an error if the legal range of the integer type in
    the switch statement does not cover all of the constants used in the case statements.


    +   3. Each case statement must have a literal constant or a value the compiler
    can evaluate as a constant of a 32-bit or smaller integer type.


    +   4. It cannot have a float constant, a long constant, a variable, an expression,
    a string, or any other object.


    +   5. The compiler checks that the constant is in the range of the integer type
    in the switch statement.


    +   6. If you are using a byte variable in the switch statement, the compiler
    objects to it if it finds case statement constants outside the -128 through 127
    range that a byte primitive can have.


    +   7. The code block associated with a case must be complete within the case.
    That is, it cannot have an if-else or loop structure that spreads across multiple
    case statements.


    +   8. Constants in case statements can be integer literals or they can be variables
    defined static and final.


    +   9. If a continue label is used instead of a break in a switch statement, the
    next statement following it will not be executed; rather, it will resume the loop
    with the next value of the iterator.


    +   10. The switch statement is an alternative to an if-else or if-else-if construct.


    +   11. The expressions and case labels are restricted to the following types:
    byte, short, char, int, and enum.'
