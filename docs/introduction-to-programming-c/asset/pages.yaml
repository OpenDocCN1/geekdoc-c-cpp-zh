    \ and year_of_purchase. This means we need another set of three variables. This\
    \ consumes a lot of memory. Structures are helpful here. Thus, we can declare\
    \ a structure of date as:\n\n```\nstruct date\n{\n    int month;\n    int day;\n\
    \    int year;\n}\n```"
