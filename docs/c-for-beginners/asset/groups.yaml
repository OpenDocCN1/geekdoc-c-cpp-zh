    ## Chapter 3: Variables and Data Types


    We have talked about how low-level programming closely resembles machine language,
    but they differ because they still use elements that are reminiscent of human
    languages like syntax, structures, and variables. Variables are a mathematical
    concept that humans use to convey meaning to machines. A huge chunk of computer
    science is recognizing that speech is a series of mathematical concepts. This
    includes AND OR gates that enable machines to make decisions on a single data
    bit level. At a very small scale, bitwise functions can help with many computing
    processes, from controlling displays to switching traffic on a server. We will
    discuss these advanced topics later in chapter 4. For now, let''s deepen our understanding
    of c++ by looking at variables.


    Variables are one of the most important aspects of any programming language -
    functions, and other operations of a programming language, generally operate on
    variables. We have said that not all programs will have some variable that they
    are working on or there is nothing to work on. The outcome of a function is always
    a state change. A state change is when a machine changes from one decision or
    operational phase to another. This term was used to describe operations in old
    mainframe computers, but we still use it in computer science to describe how programs
    work. In our example, the IDE started with an initialized main() state before
    the program ran. Then it switched states to execute the output command.


    State changes are discussed often in lower-level languages because of how close
    they are to machine language. Lower-level languages are also called compiled languages
    because they are compiled into machine language. This is in contrast to high-level
    languages like Python. If you remember, we spoke of how higher-level languages
    do not need variables to be declared with their data types because of their built-in
    libraries. For instance, Python uses a Python environment to recognize variables
    and their data types. In c++ variables and the data types have to be declared.
    A data type tells the compiler how to treat the data. Data types make more sense
    when you think of vectors in math; unlike integers, which tell us the size and
    direction of space. Therefore, vectors are a different data type than an integer.
    Properties like these are used in software like Photoshop to help with rendering.


    Note: Vector-based images can be manipulated without losing the quality of the
    image. This is because files like jpeg or .png store pixel location of an image
    as integers on a grid. Vector files such as svg or .pdf vectors to describe their
    pixel locations. Therefore, when the image is made larger, the vectors indicate
    how the colors should expand while the regular image files do not. This is what
    causes the pixelation and distortion when manipulating non-vector image files.


    ## Input and output: Declaring Variables


    In the previous chapter, we declared some things as we were learning how to use
    cout. In this section, we are going to look at examples of data types and how
    they are declared. Below are examples of variable declarations and what they stand
    for (“C++ Variables,” n.d.). Keep in mind that variables essentially store types
    of data:


    - "int": Keyword is short for "integer" and stores whole numbers, without decimals.
    This keyword includes positive and negative integers.

    - "double": Stores numbers with decimals, both positive and negative numbers.

