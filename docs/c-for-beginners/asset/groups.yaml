    \ 6.26);\n    cout << \"int: \" << myint << \"\\n\";\n    cout << \"double: \"\
    \ << mydouble << \"\\n\";\n    return 0;\n}\n```\n\n## 没有函数重载的程序\n\n可以使用 URL 访问我们保存的工作空间的副本：https://ide.geeksforgeeks.org/qkpHHzZqq5。函数在文件的顶部声明并定义，以便我们更好地观察它们。你将使用此文件进行函数重载。记住，如果在编辑期间代码受损，你可以随时返回此工作空间。\n\
    \n上面的程序声明了两个执行相似计算的函数。在大型程序中，这浪费空间且效率低下。\n\n这使得编辑代码变得困难，因为在较大的程序中，这两个函数不太位于同一个地方。为了提高效率，我们应该将这些函数合并到一个名称下，并“堆叠”数据类型。以下是你可以的方法：\n\
