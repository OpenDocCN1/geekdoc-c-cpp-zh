    AND 和 OR 门，它们使机器能够在单个数据位层面上做出决策。在非常小的尺度上，位运算可以帮助许多计算过程，从控制显示器到切换服务器上的流量。我们将在第
    4 章讨论这些高级主题。现在，让我们通过观察变量来深对 C++ 的理解。


