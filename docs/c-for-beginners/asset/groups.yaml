    \ Ubuntu 16.04 (Ubuntu Tutorial for Beginners), n.d.）。Gedit 是一种 Linux 编程文本编辑器工具，为多种编程语言提供了语法高亮和标签页间距功能。请确保从高亮的下拉菜单中选择了“c++”。你可以通过点击“保存”按钮在\
