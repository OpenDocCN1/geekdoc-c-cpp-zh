    \ filename.cpp”打开程序文件并修复该行代码。\n- 3. 运行程序文件\n编译器将名为“test”的可执行文件来运行该程序。你可以在终端中输入“\
    \ ./test”来执行它。\n\n## 在 Ubuntu 中测试、编译和运行 .cpp 文件\n\n此截图展示了在 gedit 中编写的示例代码的测试、编译和运行（[在\
    \ Linux 中运行 c, c++ 程序](https://example.org) Ubuntu 16.04 (Ubuntu Tutorial for\
    \ Beginners), n.d.）。\n\nLinux 发行版是详细的基于控制台的系统，大多数系统都可以通过终端处理任何语言的编程。学习在 Linux\
    \ 环境工作是有利的，因为它让你接触到服务端编程。\n\n**注意：** 在 centos 上安装 Gcc 的过程类似。要进行安装，你应该改用 \"yumgroupinstall\"\
    \ DevelopmentTools。此命令也会自动安装所需的库。\n\n编写、编译、测试和运行程序的步骤都是相同的。\n\n创建你自己的编程环境可以帮助你应对现实世界的场景，这是在线编程空间无法提供的。在本书中，我们将使用在线\
    \ IDE。这是因为每个人都将拥有相同输出和接口的学习环境。这简化了问题。\n\n## 第 2 章：c++ 基础、编程原理\n\n编程语言与其他任何人类语言一样：它们有结构、语法和规则。仅仅知道另一种人类语言的词汇是不够的。了解如何使用它们以及它们在该语言中如何运作，是在该语言中有效通信不可或缺的一部分。编程语言的功能相同，但它们试图帮助的通信是人与机器之间的。虽然机器（至少在今天）永远不会像我们这样聪明干练，但它们可以以我们无法想象的速率和效率理解很多内容。所有的编程都是一套指令。这些指令可以是规则，可以是你想要机器执行的操作，或者是其他什么。但这一切之所以可能，是因为我们遵循了编程语言的规则。\n\
    \n编程规则（或语法）是一列用于通信程序方面（如函数和变量）的边界符号。语法对于编译器来说非常重要，因为它告诉编译器应该向机器下达什么指令。\n\n在我们开始之前，值得记住几点。与\
    \ Python 或其他高级编程语言不同，c++ 并不容易像人类语言。像 JS、Python 和 c# 等高级语言之所以这样设计是因为这有利于易于阅读和管理。c++\
    \ 尽管如此，但它更容易被机器理解，恰恰是因为它没有那么抽象。这就是为什么在处理 c++ 工作时，你只需要编译器和文本编辑器，而像 Python 这样的语言需要安装它们的环境。\n\
    \n## 编程原理\n\nc++ 有许多方法完成相同的任务。就像人类语言一样，有许多方式可以表达相同的意思，但某些方式更适合某些场合，而另一些则不然。c++\
    \ 也是如此；某些方法非常棒，因为它们减少了程序开销。许多开发者会希望如此，因为这提高了整个应用程序的性能，这就是编程的第一条原则：用尽可能少的函数完成任务。不要让事情变得比需要它们更复杂。在大多数情况下，这意味着以节约的方式使用循环或\
    \ switch 语句。\n\n做到此点的最佳方法是首先理解问题的本质以及如何最好实现解决方案。换句话说，你需要编写一个算法——一列你希望机器遵循以解决问题的指令。\n\
    \n你的设计应该始终从你想让程序做的事情开始。这还包括你的算法，或者至少是你的算法将解决的问题。算法始终看起来像这样：\n\n- 4. 输入：传入的数据（如适用）\n\
    - 5. 处理：对数据执行的操作以及变量的声明\n- 6. 输出：结果，或你想要执行的操作。\n\n这是一个详细的 c++ 示例，用于显示“Hello World”：\n\
    \n```cpp\n// 显示 \"Hello World\" 的简单 c++ 程序\n// 输入输出头文件\n#include<iostream>\n\n\
    using namespace std;\n// 主函数\n// 程序执行的地方\nint main()\n{\n// 打印 hello world\ncout<<\"\
    Hello World\";\n\nreturn 0;\n}\n```\n\n这里是结构：\n\n- 调用输入输出头文件\n- 调用主函数\n- 打印 Hello\
    \ World\n- 指示状态的终止语句\n\n我们可以看到 c++ 是多么详细，因为大部分步骤涉及执行代码所需的后端方面，例如调用库文件。通常情况下你的算法不需要这么详细。\n\
    \n尽管很简单，这个算法说明了开发者如何将任务翻译成代码。在下一章中，我们将使用该算法编写我们的程序。\n\n正如你在示例中注意到的，代码中有注释说明了代码部分的作用。这些注释以\
    \ // 开头。编译器不会读取任何以 // 开头的代码，因为它们不会产生任何影响，只是帮助处理代码的人理解代码的功能。\n\n## c++ 语法概述\n\n\
    我们讨论了语法对编译器的重要性，但理解编程语言的语法同样重要，因为它允许你调试代码。就像人类语言一样，如果你了解语言的规则，出错时就可以轻松纠正。调试是发现并消除代码错误和异常的过程，称为“bug”（[什么是调试？](https://example.org)\
    \ n.d.）。这是一个修正的过程。\n\nIDE 拥有突出代码错误位置的调试工具，但这些工具并不总是可靠。例如，漏掉终止代码行的分号是一个常见错误，但调试器会在\
    \ (.h) 文件中突出错误，而不是程序文件 (.cpp) 中发生错误的地方。大多数调试器并不智能到可以检测内容的缺失，而是会抛出编译器在未终止行违反库规则时给出的详细错误。然而，程序员只需在注意到某一行缺少红色分号行分隔符时就能发现错误。\n\
    \n![](img/76e155a654962a3de26649c22b574ec2_39_0.png)\n"
