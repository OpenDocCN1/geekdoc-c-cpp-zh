    # Using cout


    The cout object uses the << operator to print values and text, and we can have
    as many of them as we like. Using the IDE in your browser, change the code to
    print out:


    Hello World

    I am learning C++


    Like this:


    ![](img/76e155a654962a3de26649c22b574ec2_48_0.png)


    # Adding cout objects


    This screenshot is the successful run of our edited “Hello World” program in split-screen
    mode. While the program ran without any errors, it didn’t produce the result we
    wanted. observing the output, the printed text is missing a new line. We will
    have to instruct the compiler to add the new line to get the desired result.


    Adding lines can be done in several ways: we can add delimiters within the strings
    or use another manipulator object from the iostream library.


    # Using Escape Sequences


    Although it might be tempting to write string within cout and enter a line, it
    will not work. It will break the code and it will not run. Don''t believe me?
    Test it!


    You can add a new line by using an escape sequence. Escape sequences are used
    in many instances where you need to introduce special characters within strings
    and character streams. It can also add lines, like so:


    ![](img/76e155a654962a3de26649c22b574ec2_50_0.png)


    # Using in-string escape sequences to delimit and manipulate the output


    This are the successful run of our edited “Hello World” program in split-screen
    mode. Using \n, we were able to get our expected output.


    As you look at the code, you can see that doubles quotes are used. So, if you
    want to add double quotes in a string, you will have to use an escape sequence
    so that the compiler knows that is not a part of the code. Not doing so may cause
    unforeseen errors or bugs. This is why escape sequences matter. Here is a list
    of the many instances where they can be used (“Escape sequences—cppreference.com,”
    n.d.):


    - '''': Used for single quotes

    - ''\"'': Used for double quotes

    - "?": Used for question marks

    - "\": Used for backslashes

    - "f": Stands for "form feed" and is used to go to the next "page"

    - "\n": Stands for "line feed" and is used to go to the next line

    - "\t": Stands for "horizontal tab" and adds 5 spaces horizontally

    - "v": Stands for "vertical tab" and is used for spacing in vertical languages


    **Note:** If you decide to try different escape sequences as text delimiters,
    be sure to only use the Run button. This will save the workspace.


    If you want to save some of your results for later, you can use the Run + URL...
    button to save your work at another URL to return to later. To return to our exercise,
    you can use our saved IDE workspace URL (https://ide.geeksforgeeks.org/PsgBLSHE4h).
    You can also access this code in the index.


    # Using endl: Input/output Manipulators


    Like we have said, programming languages are as versatile as human language. You
    can express one instruction in many ways, and terminating a string is no exception.
    The difference between an escape sequence and endl is that endl flushes and refreshes
    the buffer used to store the string. Programmers use endl to clear memory after
    printing a lot of text. You can see why this is useful in memory management. endl
    is an example of an input/output manipulator. Input/output manipulators are functions
    that allow you to control input/output streams using the “<<” operator or the
    “>>” operator (“Input/output manipulators—cppreference.com,” n.d.).


    ![](img/76e155a654962a3de26649c22b574ec2_53_0.png)


    # Using an input/output manipulator to delimit and manipulate the output.


    This screenshot is the successful run of our edited “Hello World” program in split-screen
    mode. Using endl we were able to get our expected output. In a program this small,
    it is difficult to see the effects of using a memory manipulator. Manipulators
    only begin to make a difference when using them in called functions. You can access
    the code at this URL: https://ide.geeksforgeeks.org/htcfFytK71.


    Like escape sequences, there are many input/output manipulators that give programmers
    more control over data types or strings. Many of them will make sense once we
    talk about data types and structuring classes. Here are some some of them (“Input/output
    manipulators—cppreference.com,” n.d.):


    - boolalpha / "noboolalpha": Switches between using "0/1" to false/true" for Boolean
    values

    - showbase / "noshowbase": For mathematical outputs, controls whether a prefix
    is used to indicate a numeric base

    - showpos / "noshowpos": Controls whether the " + " sign is used to indicate non-negative
    numbers

    - uppercase / "uppercase": controls the usage of uppercase characters with particular
    output formats

    - "ends": Outputs "\0"

    - "flush": Flushes the output stream

    - "endl": Outputs "\n" and flushes the output stream

    - "get_money": Receives an input as a monetary value

    - "put_money": Formats and outputs a monetary value

    - "get_time": Receives an input as a date/time value according to a specified
    format

    - "put_time": Receives an input as a date/time value according to a specified
    format


    **Note:** Recall our conversation about c++11 and c++14. As of this writing, most
    programming IDEs use c++11 as their default version. The "get/put..." functions
    are all in c++11. If you receive an error trying to use these manipulators, check
    to see if your setup is using c++11.


    Additionally, "quoted" is a manipulator that is in c++14 only. This manipulator
    allows you to insert and extract quoted strings ("Input/output_manipulators--cpppreference.com,"
    - n.d.).


    # omitting Namespace


    We have already spoken about using namespace statements. We said it helps declare
    strings globally, but when it comes to a small program like "Hello World" it is
    not so important. For larger programs that use several functions, it is good practice
    to use the statement to declare each string separately. This saves space in the
    compiler, or you will find yourself in a situation where the compiler is bogged
    down unnecessarily, having to pull the entire string namespace library to print
    code. Declaring each string separately might make your code wordier, but it will
    reduce compiler overhead, and it focuses your instructions. Std namespace has
    multiple objects and definitions that can make it difficult for the computer to
    find the appropriate way to manipulate and define a string. The namespace convention
    is important when you have functions that are going to be called by multiple programs.
    So putting it in there unnecessarily has the potential of making your functions
    poorly defined and causing errors between them.


    Let''s make our code more efficient by removing the namespace from our code.


    ![](img/76e155a654962a3de26649c22b574ec2_56_0.png)


    # Testing Stability: Using a comment to remove "using namespace"


    This screenshot is an unsuccessful test run of the "Hello World" program with
    using namespace std; removed. You can access this saved IDE space through the
    following URL: https://ide.geeksforgeeks.org/VgoboAodiX.


    "commenting out" lines of code is a highly efficient way of testing the stability
    of code. You can delete the double slashes to remove the line of code at any time.
