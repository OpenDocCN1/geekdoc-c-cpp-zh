    There are three logical operators (Jaggi, 2015b):


    “”: the logical “AND” operator returns a Boolean true when both the conditions
    are met and false if they aren’t.


    “||”: the logical “OR” operator returns a Boolean true when one (or both) of the
    conditions are met, and false if none of the conditions are met.


    “!”: the logical “NoT” operator returns a Boolean true if the conditions in consideration
    are not satisfied. If one of the conditions is true, then it returns a Boolean
    false.


    Logical operators are used a lot in machines. Imagine a “NoT” operator in the
    security system of a bank. Let’s say locked doors are “0“[false], and unlocked
    doors are “1”. Because the bank should stay secure, our default value is “0.”
    This is called a failed closed system, because if things go wrong the doors will
    be closed (the default). All signals that go to the door are controlled by a “NoT”
    signal: If nothing is going on, the doors should remain locked, and if there is
    robbery they should also remain locked. Doors that open during a robbery will
    get a “NoT” signal to fail-close. But in a fire, these doors should open, so the
    fail-closed “NoT” signal will return true to open doors.'
