  mdcn: "\n每秒处理的数据以及需要实时渲染的游戏引擎：它们必须在利用这些控制特性的同时减少开销。坦率地说，这可以通过使用位运算符来实现。\n\n## 位运算符\n\
    \n在电路层面，机器通过使用 AND（与）门和 OR（或）门进行通信。这使它们在单个比特位上具有了决策能力。位运算符利用这些微观层面的计算在机器层面访问计算过程，从而绕过对象编程。换句话说，它们是在二进制层级对数字操作的逻辑运算符。\n\
    \n要使用它们，你需要了解二进制。人类使用十进制（也称为十位制）来概念化数字。例如，像543这样的数字被理解为5百、3十和4个个位。在十进制中，它看起来是这样的：\n\
    \n```\n5 * 10² + 3 * 10¹ + 4 * 10⁰ = 534\n```\n\n在二进制中，同一个数字看起来像 0b1000010110\
    \ —— “0b”只是为了让我们人类理解这是一个二进制数。二进制数是二制的，只是看起来不同。所有二进制数都呈现为比特流，可以处于两种状态：1 或 0。就像十进制一样，数字的位置决定了它的值。534的示例显示了一个长度为10位的二进制数。仔细观察534的比特流，我们可以看到第2、第3、第4和第10位比特是开启的（从右向左），所有其他比特都是关闭的（1为开启，0为关闭）。在二进制中，我们这样计算：\n\
    \n```\n2^9 + 2^4 + 2^2 + 2^1 = 534\n```\n\n对我们人类来说，计算它并不容易，但这就是计算机通信的方式，通过数据比特流进行。它们识别和计数这些数字非常熟练，就像人类处理十进制数字一样容易。因此，使用在计算机自然层面运行的位运算符可以提高速度和性能（Killian,\
    \ 2012），因为它跳过了从对象编程到机器语言的翻译。这就是为什么你会发现位运算经常用于竞争性编程。以下是 c++ 位运算符的列表（《c/c++ 中的位运算符》，2014）：\n\
    \n-    \"|\" 位与（Bitwise AND）接收两个数字（操作数），并在数字流中的每个比特上运行 AND 运算。如果两者都为1，则 AND 流的结果为1。\n\
    -   \"|\" 位或（Bitwise OR）接收两个数字（操作数），并在数字流中的每个比特上运行 OR 运算。如果两者中任一为1，则 OR 流的结果为1。\n\
    -   \"^\" 位异或（Bitwise XOR）接收两个数字作为操作数，并在两个数字流的每个比特上执行异或 运算。如果两个比特不同，则异或结果流的结果为1。\n\
    -   \"<<\" 左移运算符接收两个数字，并将第一个操作数的比特向左移动。第二个操作数用于确定移动的位数。\n-   \">>\" 右移运算符接收两个数字，并将第一个操作数的比特向右移动。\n\
    -   \"~\" 位取反（Bitwise Not）运算符接收一个数字并切换所有比特的状态（1变0，0变1）。\n\n注意：机器使用寄存器和缓冲区来存储用于计算的比特。寄存器只是一个存储数组，每个比特在数组中都有自己的位置。如果你将这些数据流看作一个数组，将帮助你理解许多位运算符，特别是移位运算符。\n\
    \n让我们写一个位运算程序。首先，我们需要创建一个位寄存器并研究比特流。这需要 `<bitset>` 库中的 `bitset<x>()` 函数。它允许你打印长度为\
    \ `<x>` 的二进制流。按照指令操作：\n\n-   1. 打开一个新的 IDE c++ 工作空间\n-   2. 除了 `<iostream>`，务必也调用\
    \ `<bitset>` 库\n-   3. 声明操作数变量及其值：\n  unsigned int a = 60; // 00111100\n  unsigned\
    \ int b = 13; // 00001101\n-   4. 为计算声明寄存器 c：\n  int c = 0;\n-   5. 打印操作数值及其寄存器：\n\
    \  cout << \"Operand a: \" << a << \" and b: \" << b;\n  cout << \"\\nregistera:\
    \ 0b\" << bitset<8>(a);\n  cout << \"\\nregisterb: 0b\" << bitset<8>(b) << endl;\n\
    \n**注意：** 由于所有数字都小于255，我们将在整个练习中使用长度为 `<8>` 的比特流。\n\n-   6. 在寄存器 c 中计算 a 和 b 的位与运算：\n\
    \  c = a & b; // 00000100\n-   7. 打印操作数值及其寄存器...\n  **注意：** 由于所有数字都小于255...\n\
    -   8. 在寄存器 c 中计算 a 和 b 的位或运算：c = a | b; // 00111101\n-   9. 打印结果和寄存器：\n-   10.\
    \ 计算 a 和 b 的位异或运算：c = a ^ b; // 00111001\n-   11. 打印结果和寄存器：\n-   12. 计算 a 的位取反：c\
    \ = ~a; // 11000011\n-   13. 打印结果和寄存器：\n-   14. 打印 a 的寄存器比较：\n-   15. 计算 a 的左移运算：c\
    \ = a << 2; // 11110000\n-   16. 打印结果和寄存器：\n-   17. 计算 a 的右移运算：c = a >> 2; //\
    \ 00011111\n-   18. 打印结果和寄存器：\n\n## 带有寄存器打印的位运算\n\n此截图是位运算程序的成功运行。输出显示了寄存器的直观视图。这将允许你看到位运算是如何计算的以及它是如何改变寄存器的。这是一个输出较长的程序。为了完整学习，可以通过此\
    \ URL 访问我们的保存工作空间：https://ide.geeksforgeorg/JgnAlVwo\n\n## 注意：\n\n此程序使用了命名空间 `std`\
    \ 来简化程序。良好的做法是省略命名空间并单独声明 `cout` 和位对象。\n\n我们将讨论的最后二进制运算符是赋值运算符。赋值运算符用于赋值值和动态更改值。在编程原理中，我们讨论过程序需要尽可能高效且指令尽可能。高级赋值运算符结合等赋值和各种操作来减少代码行。它们都是原子操作，意味着它们允许操作变量中存储的值并重新赋值。以下是常见的赋值运算符列表（Prabhu,\
    \ 2018）：\n\n-   = 等赋值运算符将值分配给左侧变量。\n-   += 原子加法运算符，用于结合 `+` 和 `=` 运算符。该运算符将左侧变量的值加上右侧的值，然后将结果保存到左侧变量。例如，`x\
    \ += y` 是 `x = x + y` 的更短写法，无需使用单独的算术运算符。\n-   -= 原子减法运算符，用于结合 `-` 和 `=` 运算符。该运算符从右侧的值减去左侧变量的值，然后将结果保存到左侧变量。\n\
    -   *= 原子乘法运算符，用于结合 `*` 和 `=` 运算符。该运算符将左侧变量的值乘以右侧的值并将结果保存到左侧变量。\n-   /= 原子除法运算符是\
    \ `/` 和 `=` 运算符的组合。该运算符将左侧的值除以右侧的值，并将结果保存到左侧变量。例如，`x /= y` 是 `x = x/y` 的更短写法，无需使用单独的算术运算符。\n"
