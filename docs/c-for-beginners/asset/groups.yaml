    # “Hello World” program in GeeksforGeeks IDE without a line delimiter


    This screenshot features “Hello World” with a missing delimiter. Immediately you
    will notice that the IDE has different syntax highlighting for c++ than the programming
    environments we explored in the previous chapter. Syntax can vary from platform
    to platform. This is why we are standardizing the process with GeeksforGeeks IDE.
    In our chosen IDE, semicolons are not highlighted. However, the IDE can make up
    for this by recognizing and annotating missing semicolons, as highlighted in the
    screenshot. You can practice and explore this program by going to its generated
    URL: https://ide.geeksforgeeks.org/mzzbuPP46S.


    It is easy to see this when the code is small, but when working on a larger project
    the task can be difficult. I have heard of programmers who spend a week or more
    trying to find or fix a line in their code only to discover that it is something
    very minuscule like a missing letter or mismatch in case. To make debugging easier,
    it is advised that you separate code into smaller modules (“What is Debugging?”
    n.d.). Many errors can be found and easily dealt with this way.


    Let us look at the “Hello World” program and study its syntax in detail. While
    syntax highlighting may vary across different platforms, these aspects of code
    are consistently highlighted on all platforms.


    - **comments:** As I said, these are the lines of code that the compiler will
    ignore. They are used to annotate code and leave helpful explanations for other
    programmers. This is great because normally when we code we collaborate with others.
    It is advised that you leave comments in your algorithm to simplify it for others.
    In most platforms comments will be highlighted green. comments are always preceded
    with (//).


    - **Header File Library:** Lines that start with (#) are used by the compiler
    to call library functions. These lines are very essential, so they appear in every
    program. In the “Hello World” example we call a library that is used to manage
    strings. These lines of code will be highlighted in different colors across different
    platforms. In GeeksforGeeks the color is purple.


    - **Statements:** Statements describe the beginning of a line of code with instructions
    that the compiler recognizes. This includes declaration handling instructions,
    like “using...” or “return...” in our Hello World program. They are also highlighted
    differently across multiple platforms. GeeksForGeeks they are highlighted purple.


    - **Functions:** This is code that encapsulates instructions. It may take inputs
    and output a result. Every function is written like this: “[function_name] ()
    “followed by curly braces {}. Anything in the curly braces is the set of instructions
    that will be executed. In our example, main() is the function that initiates the
    instructions that will output “Hello World” with cout<<. In a .cpp program, int
    main () must always appear for the program to function.


    > Note: Recalling our discussion about algorithms from the previous section, your
    algorithm will mainly describe what instructions occur within the curly brackets
    of intmain(). More detailed algorithms may explain the sorts of data types needed
    for inputs, outputs, and other data. We''ll discuss types in detail in Chapter
    3.


    - **Data:** These are variables and other kinds of data functions and statements.
    In the GeeksforGeeks IDE, they are highlighted blue.


    ![](img/76e155a654962a3de26649c22b574ec2_43_0.png)


    # comparison of “Hello World” program in the GeeksforGeeks IDE and the GeeksforGeeks
    Embedded Program Articles


    This screenshot features a successful run of “Hello World” with the memory used
    to run the program. This IDE has light syntax highlighting, focusing mainly on
    comments, statements, and operand data. compared to GeeksforGeeks’ embedded code
    in their articles, their embedded code is much more detailed (“Writing – first
    – c++ – program,” – 2017). The two screenshots on the right feature the “light-mode”
    and “dark-mode” views of the same code embedded in their articles. These views
    are more detailed, highlighting comments, functions, and distinguishing different
    statements. For example, data types such as int are distinguished with a different
    color from other statements such as using namespace. Also the embedded views,
    unlike the IDE, distinguish strings from other data. This is a perfect example
    of how syntax highlighting can vary across different platforms.


    Earlier we saw a code::Block example with an error in it. Below is the very same
    code next to that is corrected. Immediately you can begin to appreciate the syntax
    and what went wrong in the code::Block example.


    ![](img/76e155a654962a3de26649c22b574ec2_44_0.png)


    # comparison of “Hello World” in code::Blocks with GeeksforGeeks IDE


    This screenshot features a side-by-side comparison of the previous example, “Hello
    World” in code::Blocks with errors, and the same corrected code in GeeksforGeeks
    IDE. Upon studying both, you should be able to see that the last instruction in
    the intimain()function was incorrectly entered in the code::Blocks. As a result,
    the compiler could not recognize the return statement.


    I will admit that it is not as impressive in a few code lines like this, but being
    able to notice errors and explain them is one of the most important skills for
    programmers. At this point you should not worry much about being able to do this.
    The more you code and learn, the better equipped you will be to notice and fix
    errors. Software and web development are industries with a high failure rate because
    of. To succeed as a developer you need to solve problems quickly, find bugs efficiently,
    and fix them. This also applies on the administrative side, because being able
    to find, fix, and explain bugs is a large part of desk service level agreements.


