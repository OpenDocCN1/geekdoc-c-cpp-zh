    \n## 函数重载\n\n所有定义的对象和类必须有唯一的名称。你不能运行具有两个相同变量的程序，否则将抛出错误。你可能在之前处理例程和演示时已经见过这种情况。所以请记住：声明两次的变量会导致错误。但奇怪的是，只要参数不同，多个函数可以与其他函数具有相同的名称。这在函数返回不同数据类型的情况下是允许的。因此，重载函数以返回多个数据类型是更好的。这就是函数重载；程序员组合函数以接收多个数据类型的过程。为什么？因为它简化并合并了代码。看以下代码：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint plus(int x, int y)\
