    # conclusion


    Learning programming is a cognitive journey, one that is stimulating, exciting,
    and sometimes frustrating. As we come to the end of this book, it is important
    to go over some of the important lessons learned. They are also going to be accompanied
    by final thoughts and suggestions that are meant to equip you with all you need
    to continue growing in this field.


    # Expanding Your Practice: Preparing Your coding Environment


    We have used an online IDE to make it so that everyone has the same experience.
    If you want to save your work you can use the Run+URL button to save it in another
    URL. You can also bookmark all these for later reference using your saved IDE
