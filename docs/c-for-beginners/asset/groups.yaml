    There are many distros that provide a GUI-based desktop for many users. Most of
    them are open source, free to download and install. We highly recommend centOS,
    a free Linux distro server management. centOS uses many of Red Hat Enterprise
    Linux (RHEL) components. It is the best distro for preparing to work in Red Hat
    server management environments.


    # coding Best Practices: ownership of Learning and collaboration


    In our time together we have seen many techniques and best practices for software
    development. In the first chapter, we talked about how programs should fulfill
    their tasks with little code as possible. Frankly, with each new version of C++,
    more ways of doing this are added. The majority of beginner programming courses
    teach older, less efficient methods of implementing common programming tasks like
    parsing arrays, conditional statements, and calling functions. You will find most
    of these techniques are never used in actual programming situations. Most beginner
    courses are focused on equipping beginners with a strong grasp of the basics -
    the foundation of your knowledge is often as important as how you are going to
    progress. As you grow you will find more efficient ways of solving problems with
    your code, but this can only happen if you practice and study.


    If you want to improve as a programmer you have to take ownership of your learning.
    Learn pre-development tools like algorithms. It is all about learning to fix problems.
    There are other pre-development tools you can try, like diagramming. Diagramming
    is good for individuals who are visual learners. All of these are great for growing
    as a programmer; it does not matter which you choose, as long as pre-development
    tools are something you take advantage of.


    Turning back to algorithms, more detailed algorithms will explain all sorts of
    data types required for inputs, outputs, and other data. The advantage of algorithms
    is that you can use them as a shorthand. You can also annotate and manage your
    code. These habits will help keep your code ordered and coherent to your team
    members. All these practices will enhance how you see and think about programs.


    Software developers work in teams, with several people working on the same piece
    of code at the same time. The importance of annotating your code becomes very
    apparent in such situations.


    It also happens that working with others will accelerate your growth. When coding
    with others you learn from their experience and knowledge. As we have said, c++
    has a variety of library objects, statements, and other tools. It is as rich as
    vocabulary in human languages because there are many ways of doing the same things.
    Your way of fixing a problem will depend on your ability to see efficient ways
    of doing so. But ultimately all programming and software developments are creative
    endeavors. Working with others will increase your programming “vocabulary” – you
    will learn from creatively they fix problems and you will find insights of your
    own in the process. You should always keep in mind that everyone can contribute
    something and what they contribute is heavily influenced by the amount of experience
    they have. So even if you are new to c++, you still have a unique experience and
    approach to solving problems that other people don’t have because you think differently.
