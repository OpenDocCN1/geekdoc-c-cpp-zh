    \ print the result\n- 6. Atomically multiply 10 and print the result\n- 7. Atomically\
    \ divide our variable by 10 and print the result\n\nHere is how it looks:\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // Assigning\
    \ value 10 to a\n    // using = operator\n    int a=10;\n    cout<<\"this program\
    \ will atomically multiply a\";\n    cout<<\"value of a is \"<<a;\n\n    // Assigning\
    \ value by adding 10 to a\n    // using += operator\n    a += 10;\n    cout<<\"\
    Atomically +10: value of a is \"<<a;\n\n    // Assigning value by subtracting\
    \ 10 from a\n    // using -= operator\n    a -= 10;\n    cout<<\"Atomically -10:\
    \ value of a is \"<<a;\n\n    // Assigning value by multiplying 10 to a\n    //\
    \ using *= operator\n    a *= 10;\n    cout<<\"Atomically *10: value of a is \"\
    <<a;\n\n    return 0;\n}\n```\n\n# Assignment Routine\n\nThis screenshot is a\
    \ successful run of our assignment routine program. This program has a sequential\
    \ output, which means that each instruction impacts the result of the next instruction.\
    \ This means if we were to change the order of the atomic operations applied to\
    \ a that the output would be different. To study it fully, you can access it on\
    \ our saved workspace using: https://ide.geeksforgeeks.org/Fbc63b0u1E\n\nThese\
    \ binary assignment operators combine assignments and arithmetic functions. They\
    \ work well when controlling loops and conditional statements, too. Atomic assignment\
    \ operators are closely related to unary arithmetic operators. Both are frequently\
    \ used to control loops. Let’s take a look at unary operations.\n\n# Unary operations\n\
    \nBefore we discuss unary operations, let's look at code that uses them.\n\n![](img/76e155a654962a3de26649c22b574ec2_109_0.png)\n\
    \n# While Loop featuring a Un operator\n\nThis screenshot is of a simple while\
    \ loop that prints the value of the counter, i i. The unary operation performs\
    \ i= 1 + i for each iteration until i = 5 and the while loop ends. Omitting i++\
    \ will cause an error as the while loop would not be able to advance. We will\
    \ talk about loops extensively in the decision making chapter. To study it fully,\
    \ you can access it on our saved workspace using this URL: https://ide.geeksforgeeks.org/MgMpb\n\
    \nThe i = 1 + i is the same as i++. Using the unary form makes the code nearer\
    \ because it precludes the + arithmetic operator and the = assignment operator.\
    \ We can also use an atomic addition operator to complete the code: i+=1 is the\
    \ same as i++. But a format like that would require the compiler to store and\
    \ operate on an additional operand. Unary operators are there to simplify code\
    \ by only having one operand. Remember, unary operators are those operators that\
    \ use one operand. Here are some of the other examples of unary operators (Kumar,\
    \ 2017):\n\n- ++: Increment operator used to increase the value of an integer\
    \ by 1. It can be placed in front of a variable to increment the value immediately\
    \ after or to temporarily save the value before increment.\n- --: Decrement operator\
    \ used to decrease the value of an integer by 1. Similar to the increment, programmers\
    \ can also implement pre-decrement and post-decrement instructions.\n- -: Unary\
    \ minus operator that is used to change the sign of a variable or argument. Performing\
    \ a unary minus operation on a negative integer will make it positive and vice\
    \ versa.\n- !: NOT operator is used to reverse the Boolean logical state of an\
    \ operand. For example, if a variable x has a Boolean value of false, x will be\
    \ true.\n- &: Address of operator that is used to point to the address of a variable.\n\
    \nLet's make a unary operator routine to see how the pre- and post-instructions\
