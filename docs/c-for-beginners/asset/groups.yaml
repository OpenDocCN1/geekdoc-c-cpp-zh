    ## 核心收获：C++ 中的计算机科学概念


    除了编程，我们还探索了一些基础的计算机科学概念。我们研究了机器及其语言的行为。我们讨论了学习编程如何像学习一种新语言：语法和规则确保了通信的可能性。C++
    是一种后端语言，用于管理控制海量数据的服务器。与 Python 等更具人性化的高级语言不同，C++ 要求程序员在代码中写得更详细。在函数中，每个变量必须是唯一的，否则将会出错。所有函数和语句都是大小敏感的，并有遵循它们的特定规则。我们实现了许多
    `if...else` 语句，并制作了嵌套的 `if...else` 语句。我们看到像 `if()` 这样的条件语句可以在没有 `else` 的情况下执行，但如果条件为假，缺少
    `else` 语句会导致错误。正如缺少动词表示句子不完整一样，没有 `if()` 就无法实现 `else` 语句。


    我们看到了计算机如何使用逻辑数学通过二进制数进行通信。我们看到了位函数如何在位位上工作，完成像 AND（与）、OR（或）和 NOT（非）这样的逻辑数学计算。其他基于对象的
    C++ 函数必须由编译器翻译成机器语言。但位函数更快，因为它们跳过了那一步直接与机器通信。它们通常被部署在竞争性编程中以制作高度敏捷的程序和例。在竞争性编程之外，位函数在管理大数据方面也有一些功能。


    位函数的挑战在于它们是二进制的，人类非常难理解。为了看到计算机看到的内容，我们上了一个关于二进制和二进制数学的短期计算机科学课。我们用位程序创建了一个“字节级”的寄存器流，并创建了动态缓冲区来存储位运算的位。这些虚拟缓冲区和寄存器就是服务器管理
    TB级数据的方式。想想：我们的缓冲区和寄存器长度都是一个字节，但一个 TB 比我们的缓冲区大 $10^{12}$ 倍：1,000,000,000,000 字节。对于
    YouTube 这种基于 C++ 进行后端计算的网站来说，这些数字很小。YouTube 处理的数据是天文数字。


    在 2018 年，数据量为 5.25 泽字节（$10^{21}$ 字节）。它服务了超过 350 亿小时的内容（“How much data does YouTube
    store? - Quora,” n.d.）。位函数赋予这些服务器在不中断或大规模延迟的情况下处理这种负载的能力。这是 C++ 力量及其处理复杂系统能力的最佳示例之一。它是程序员学习的一门有用语言。如果你将这些数据流可视化为具有
    8 个槽位的数组，你将更容易理解许多位运算符，特别是移位运算符。


    除了二进制编程外，我们还处理了不同类型的数据，并探索了对象编程的不同方面。我们做了很多处理字符串的练习，例如。事实上，我们在每一个练习中都使用并部署了字符串。我们看到字符串也是数据数组，可以像对象一样进行操作，但少数方式除外。字符串有长度、大小，并与
    `<string>` 库中的各种对象配对。考虑任何类型、向量（vector）或数组的拷贝构造函数组合，你需要一个带有地址运算符（Addressof operator）元素的
    `for()` 循环。该任务在 `<string>` 库中有一个专门的函数，你只需要正在解析的项的索引即可。如果说你从书中应该学到的一点，那就是熟练处理字符串：跳出转义序列、通过数组索引处理字符串以及将字符串传递给不同的函数。


    我们还学习并讨论了功能和设计考量。例如，我们讨论了何时以及如何使用循环。我们的银行安全示例通过在故障关闭（fail-close）系统中的退出控制循环示例得到了最好的说明。正如我们所说，银行应该始终保持门锁好并关闭；它们是故障关闭的。银行的大多数事件都需要门和出口在故障时关闭，只有在火灾时才应该打开。系统应该保持一切处于控制中，在例程执行之后测试条件。退出控制循环在其他领域也有用，例如数据控制。YouTube
    将数据修正作为正常操作的次要程序。这确保了系统始终运行，不会被数据请求阻塞。


    由于 C++ 是一种后端语言，它必须处理和操作多种类型的数据。当我们讨论基于向量的图像作为对象类及其其他对象属性时，进行了简要讨论。像 Photoshop
    这样的图像处理软件是用 C++ 程序的，其中图像处理等方面充分利用了程序的力量。向量允许在不损失质量的情况下进行图像操作，而 `.jpg` 或 `.png`
    则是像素数组。像 `.svg` 或 `.pdf` 的向量使用向量容器来描述它们的像素位置，这在 C++ 中更多的类特征，允许保留图像。


