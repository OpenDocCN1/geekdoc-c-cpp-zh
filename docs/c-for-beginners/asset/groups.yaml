    在程序运行之前从初始化的 main() 状态开始。然后它切换状态来执行输出命令。


    由于低级语言与机器语言非常接近，因此经常讨论状态改变。低级语言也被称为编译语言，因为它们被编译成机器语言。这与 Python 等高级语言形成对比。如果你还记得，我们讨论过高级语言由于其内置库的存在，不需要在声明变量时指定其数据类型。例如，Python
    使用 Python 环境来识别变量及其数据类型。在 C++ 中，变量和数据类型必须被声明。数据类型告诉编译器如何处理数据。当你考虑到数学中的向量（vectors）时，数据类型更有意义；与整数不同，整数告诉我们空间的大小和方向。因此，向量是整数不同的数据类型。这类属性被用于
