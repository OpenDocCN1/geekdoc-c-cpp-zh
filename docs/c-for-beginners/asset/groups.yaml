    version of c++ is 17 but the most supported is c++14. c++ 14 is the evolved version
    of c++ and it features more comprehensible language features. c++14 is more intelligible
    to humans than its predecessor and you can expect this trend to continue. The
    oldest, widely available c++ version in most programming environments is c++11.


