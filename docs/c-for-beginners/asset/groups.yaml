    After you select a template, the guide will present options for the command-line
    tool. Here, you can name the project, add your organization’s name, use a bundle
    identifier, and select a programming language.


    ![](img/76e155a654962a3de26649c22b574ec2_21_0.png)'
- md: '

    ## 2. command Line Tool options: Language > Select c++


    Xcode''s command-line tool can handle Microsoft''s proprietary languages like
    Swift. This program can run alongside c-based languages in Mac compilers, including
    c++. Swift is selected by default.


    In the same window, you will be required to add an organization identifier. Remember
    that Xcode''s command-line tool is a programming template for proprietary macOS
    operating systems, so the organization identifier is used to create a unique idea
    for your program in Apple databases: the Apple Developer Website and icoud container,
    iTunes connect portal in the Appstore. This will streamline your app into a proprietary
    macOS framework.


    ![](img/76e155a654962a3de26649c22b574ec2_22_0.png)


    ![](img/76e155a654962a3de26649c22b574ec2_23_0.png)


    ## 3. command Line Tool options: organization Identifier > “cpp”


    The organization''s identifier is a naming convention that helps programmers integrate
    their projects into Apple’s proprietary software development scheme. Here, we
    are using “cpp” as our identifier, which generates “cpp.HelloWorld” as our bundle
    identifier. once we indicate an identifier, the guide allows us to proceed to
    the next step.


    Now, save your project in a directory of your choice. on the left-hand side pane,
    Xcode will be able to open the file. You will have to select main.cpp to access
    the global c++ file for your program in Xcode. If you so desire, you can upload
    cpp files into the directory, and edit them.


    ## 3. Xcode command Line Tool: “main.cpp”


    This screenshot features the IDE style Xcode command Line Tool workspace. It has
    the main.cpp opened in the text editor (Patel, 2017).


    once once you have written some code and you want to run it, you select Product
    and click on Run. Also, you can run and build the program by selecting the button.


    ![](img/76e155a654962a3de26649c22b574ec2_24_0.png)


    ![](img/76e155a654962a3de26649c22b574ec2_24_1.png)


    ## 4. Xcode command Line Tool: “Hello World” Build and Run


    Similar to the code::Blocks IDE, you will also have to build and then run your
    program. This screenshot also features the results of “Hello World” and the return
    value (Patel, 2017).


    If you are a programmer who sees themselves working with Apple devices, working
    and practicing in Xcode is a good investment. For instance, Apple has a healthy
    share of the market in a wide variety of consumer goods and services like streaming
    services and devices. With that said, you should keep in mind that c++ is used
    mostly as a server-side language. Server-side programming is code that controls
    content is delivered to a dynamic website like YouTube. Most server-side programming
    is done on Linux machines.


    ## Linux compiler Installation


    Linux is a console-based operation system, so it does not need a text editor.
    Instead, we will focus on installing and setting up a programming compiler. Mac
    and Windows automatically initialize a compiler within the IDE, but in Linux,
    a more hands-on approach is required. You will be required to execute a backend
    initialization. It might seem like a lot of work, but in the great scheme of things,
    it allows those working with Linux to have full control of the development procedure
    and unlock more computing power.


    Because Linux is an operating system that uses a console interface, it will be
    strange to beginners or anyone who is used to Windows or Mac. This is because
    users are often used to a GUI. The GUIlessness of Linux allows more computing
    power to be freed for programming - a GUI takes some computing power to produce
    and maintain. This is why many servers and other programming environments have
    console interfaces. Also, many of them use Linux distributions.


    A Linux distribution (distro) is an operating system made from Linux kernel-based
    software collection and package management system for installing additional software.


    The following are instructions for installing and initializing a compiler. This
    will be for Ubuntu, a popular Linux distro for beginners. These installations
    will be similar in any Linux distro you will be using.


    Note: There are many distributions of Linux that provide a GUI based desktop experience
    that many users love. Most of these are open-source and free to download and install.
    You can explore these distros and create console interfaces to practice on. one
    free distro to consider is CentOS, which is based on Red Hat for server management
    (“centos-faq | open-source-community.” – n.d.). Red Hat Enterprise Linux (RHEL)
    is used in many server management setups and is not free. However, CentOS uses
    many of its components and is an excellent distro for preparing to work in Red
    Hat environments.


    In this example, we will use the GNU collection compiler on Linux. The GNU collection
    compiler is a Linux-based compiler that supports c++ and other various languages
    like Fortran, Ada, and Java (“Gcc 7 Release Series—changes, New Features, and
    Fixes—GNU Project—Free Software Foundation (FSF),” n.d.). To install GNU Gcc,
    follow these steps:


    - In the console, enter the following commands:


    check first if there is a version already installed on your machine by entering
    this command: gcc -v


    ### A. check for GNU Gcc in Ubuntu console


    You should check your system for a copy of the Gcc. This screenshot features a
    system with Gcc already installed (Patel, 2014). After using the command, if there
    is no copy of Gcc in your system, it will be missing this line. If there is a
    copy, it will have a similar line. Most likely, your version will be more recent.


    The following commands will install Gcc on your system (Agarwal, 2017b):


    sudo apt-get update


    sudo apt-get install Gcc


    ![](img/76e155a654962a3de26649c22b574ec2_28_0.png)


    ### B. Install GNU Gcc in Ubuntu console


    In the screenshot, a GNU Gcc is already present. Running the highlighted command
    will install the GNU Gcc on your system if it isn’t there (Patel, 2014). The console
    will prompt you to type “Y” for it to begin the installation. You also are offered
    package management features like the ability of the terminal to. The following
    command will install all the libraries required to compile and run c++:


    sudo-get update && sudo apt-get install g++

    '
  mdcn: '


    ## 2. 命令行工具选项：语言 > 选择 c++


    Xcode 的命令行工具可以处理像 Swift 这样的微软专用语言。该程序可以在 Mac 编译器中与基于 C 的语言一起运行，包括 c++。默认选择 Swift。


    在同一个窗口中，你将被要求添加一个组织标识符（organization identifier）。请记住，Xcode 的命令行工具是针对专有 macOS 系统的编程模板，因此组织标识符用于在
    Apple 数据库中为你的程序创建一个唯一的 ID：Apple 开发者网站和 iCloud 容器、App Store 中的 iTunes Connect 门户。这将你的应用程序精简为专有的
    macOS 框架。


    ![](img/76e155a654962a3de26649c22b574ec2_22_0.png)


    ![](img/76e155a654962a3de26649c22b574ec2_23_0.png)


    ## 3. 命令行工具选项：组织标识符 > “cpp”


    组织标识符是一种命名规范，帮助程序员将他们的项目集成到 Apple 的专有软件开发方案中。在这里，我们使用“cpp”作为标识符，它生成“cpp.HelloWorld”作为我们的包标识符（bundle
    identifier）。一旦指定了标识符，指南允许我们继续进行下一步。


    现在，在你选择的目录中保存项目。在左侧窗格中，Xcode 将打开该文件。你必须选择 `main.cpp` 以访问 Xcode 中你程序的全局 c++ 文件。如果你愿意，可以将
    cpp 文件上传到目录并对其进行编辑。


    ## 3. Xcode 命令行工具：“main.cpp”


    此截图展示了 IDE 风格的 Xcode 命令行工具工作空间。它在文本编辑器中打开了 `main.cpp` (Patel, 2017)。


    一旦你写了一些代码并想要运行它，请选择 Product（产品）并点击 Run（运行）。你也可以通过选择该按钮来运行和构建程序。


    ![](img/76e155a654962a3de26649c22b574ec2_24_0.png)


    ![](img/76e155a654962a3de26649c22b574ec2_24_1.png)


    ## 4. Xcode 命令行工具：“Hello World” 构建与运行


    与 code::Blocks IDE 类似，你必须先构建后运行你的程序。此截图还展示了“Hello World”的结果和返回值 (Patel, 2017)。


    如果你是一个认为自己未来会在 Apple 设备上工作的程序员，那么在 Xcode 中工作和实践是一项明智的投资。例如，Apple 在各种消费品和和服务（如流媒体服务和设备）方面拥有健康的市场份额。尽管如此，你应该记住
    c++ 主要用作服务器端语言。服务端编程是控制内容传输送到 YouTube 这样的动态网站的代码。大多数服务端编程是在 Linux 机器上完成的。


    ## Linux 编译器安装


    Linux 是一个基于控制台的操作系统，因此它不需要文本编辑器。相反，我们将重点关注安装和设置编程编译器。Mac 和 Windows 会在 IDE 中自动初始化编译器，但在
    Linux 中，需要更注重操作的方法。你将被执行后端初始化。这看起来可能有很多工作，但从大局来看，它允许那些使用 Linux 的人员对开发过程有完全的控制，并释放更多的计算能力。


    由于 Linux 是一个使用控制台界面的操作系统，对于初学者或习惯 Windows 或 Mac 的人来说会很奇怪。这是因为用户通常习惯 GUI（图形用户界面）。Linux
    无 GUI 可以释放更多计算能力用于编程——GUI 需要一些计算能力来生成和维护。这就是为什么许多服务器和其他编程环境拥有控制台界面。此外，它们中的许多使用
    Linux 发行版。


    Linux 发行版（distro）是一种基于 Linux 内核的软件集合和用于安装额外软件软件包系统的操作系统。


    以下是安装和初始化编译器的指令。这适用于 Ubuntu，一个受初学者流行的 Linux 发行版。这些安装在你使用的任何 Linux 发行版中都是相似的。


    注意：有许多 Linux 发行版提供了许多用户喜爱的基于 GUI 的桌面体验。其中大多数是开源的，并可以免费下载和安装。你可以探索这些发行版并创建控制台界面进行练习。可以考虑的免费发行版是
    CentOS，它基于 Red Hat 用于服务器管理（“centos-faq | open-source-community.” – n.d.）。红帽企业
    Linux (RHEL) 用于许多服务器管理设置且不是免费的。然而，CentOS 使用了它的许多组件，是准备在红帽环境下工作的极发行版。


    在示例中，我们将使用 Linux 上的 GNU 编译编译器。GNU 编译编译器是一个基于 Linux 的编译器，支持 c++ 以及 Fortran、Ada
    和 Java 等其他语言（“Gcc 7 Release Series—changes, New Features, and Fixes—GNU Project—Free
    Software Foundation (FSF),” n.d.）。要安装 GNU Gcc，请遵循以下步骤：


    - 在控制台中，输入以下命令：


    首先通过输入此命令 `gcc -v` 检查机器上是否已经安装了版本：


    ### A. 在 Ubuntu 控制台中检查 GNU Gcc


    你应该检查你的系统是否有一份 Gcc 副本。此截图展示了一个已经安装了 Gcc 的系统 (Patel, 2014)。使用命令后，如果系统中没有 Gcc 副本，它将缺失此行。如果有副本，它将有一类似的行。大多数情况下，你的版本会更更新。


    以下命令将在你的系统中安装 Gcc (Agarwal, 2017b)：


    sudo apt-get update


    sudo apt-get install Gcc


    ![](img/76e155a654962a3de26649c22b574ec2_28_0.png)


    ### B. 在 Ubuntu 控制台中安装 GNU Gcc


    在截图中，已经存在 GNU Gcc。如果系统中不存在，运行高亮显示的命令将在你的系统中安装 GNU Gcc (Patel, 2014)。控制台会提示你输入“Y”以开始安装。你还提供了软件包管理功能，例如终端的能力。以下命令将安装编译和运行
    c++ 所需的所有库：


    sudo-get update && sudo apt-get install g++


    '
