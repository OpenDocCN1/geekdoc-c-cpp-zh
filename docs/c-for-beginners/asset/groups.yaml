    \ \"This program will go through a sequential\"\n    cout << \"\\nlist of numbers\
    \ 2 through 4 and pick the \"\n    cout << \"\\ngreatest none using two methods:\"\
    \n    cout << \"\\na nested if-else and a nested ternary operator\"\n    cout\
    \ << \"\\nNested If-else Greatest number:\\n\\t\";\n    if ( 2 > 3 ) {\n     \
    \   cout << \"2\";\n    } else if ( 3 > 4 ) {\n        cout << \"3\";\n    } else\
    \ {\n        cout << \"4\";\n    }\n    cout << \"\\nNested ternary operator Greatest\
    \ number:\\n\\t\";\n    int a = 2 > 3 ? 2 : 3 > 4 ? 3 : 4;\n    return 0;\n}\n\
    ```\n\n# Switch 示例\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n// 初始化变量\nint x = 2;\n// 打印说明\ncout << \"This program prints a choice given\
    \ x.\\n\"\ncout << \"\\n Variable x is equal to:\" << x\ncout << \"\\n\\t\";\n\
    // 程序 switch\nswitch (x)\n{\ncase 1:\ncout << \"choice is 1\";\nbreak;\ncase 2:\n\
    cout << \"choice is 2\";\nbreak;\ncase 3:\ncout << \"choice is 3\";\nbreak;\n\
    default:\ncout << \"Program Exit\";\nbreak;\n}\nreturn 0;\n}\n```\n\n# 函数 示例\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n// 函数声明\nvoid myFunction();\n\
    // 主方法\nint main() {\n    myFunction(); // 调用函数\n    return 0;\n}\n// 函数定义\nvoid\
    \ myFunction() {\n    cout << \"I just got executed!\";\n}\n```\n\n# 带参数传递的函数\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n// 声明函数\nint max(int x,\
    \ int y);\n// 主\nint main() {\n    int a = 10, b = 20;\n\n    // 调用上述函数寻找 'a'\
    \ 和 'b' 的最大值\n    int m = max(a, b);\n\n    cout << \"m is \" << m;\n    return\
    \ 0;\n}\n// 定义函数\nint max(int x, int y)\n{\n    if (x > y)\n        return x;\n\
    \    else\n        return y;\n}\n```\n\n# 无函数重载的程序\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint plusFuncInt(int x, int y) {\n    return x + y;\n}\n\
    double plusFuncDouble(double x, double y) {\n    return x + y;\n}\nint main()\
    \ {\n    int myNum1 = plusFuncInt(8, 5);\n    double myNum2 = plusFuncDouble(4.3,\
    \ 6.26);\n    cout << \"Int: \" << myNum1 << \"\\n\";\n    cout << \"Double: \"\
    \ << myNum2;\n    return 0;\n}\n```\n\n### 函数重载\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint plusFuncInt(int x, int y) {\n    return x + y;\n}\n\
