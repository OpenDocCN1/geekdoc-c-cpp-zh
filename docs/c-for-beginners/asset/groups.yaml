- md: "\nBecause Linux has a built-in text editor you will have to use the following\
    \ command to access the GUI for the text editor:\ngedit\n\nYou will be free to\
    \ write your program as you see fit. Remember to save the programs with the \"\
    .cpp\" extension so that they will be compiled correctly.\n\n```cpp\n#include<iostream>\n\
    using namespace std;\n\nint main() {\n    int a=0,b=0,sum;\n    cout<<\"Enter\
    \ any two Numbers \";\n    cin>>a>>b;\n    sum=a+b;\n    cout<<\"sum is \" <<sum;\n\
    \    return 0;\n}\n```\n\n## Gedit in Ubuntu\n\nThis screenshot features Linux’s\
    \ built-in text-editor, Gedit ([Running c, c++ Programs in Linux] Ubuntu 16.04\
    \ (Ubuntu Tutorial for Beginners), n.d.). Gedit is a Linux programming text editor\
    \ utility that has syntax highlighting and tabbed spacing features for a diverse\
    \ array of programming languages. Be sure to have \"c++\" selected from the highlighted\
    \ dropdown menu. You can save your program file in the GUI by clicking the “save”\
    \ button. Be sure to list which directory you have your file saved, as you will\
    \ have to point the compiler to that directory to compile and run the code.\n\n\
    To test and run your code you must follow these instructions:\n\n- 1. Lead the\
    \ terminal to the files directory To do this use this command. Enter it in the\
    \ directory repeatedly until the .cpp file is revealed.\n- 2. compile and test\
    \ the program file\nUse these commands to do so:\ng++ -o test filename.cpp\n\n\
    If there are any any errors this command will tell you which line contains the\
    \ error just like you would expect from an IDE. Then you can open the program\
    \ file through “gedit filename.cpp” and fix the line of code.\n- 3. Run the program\
    \ file\nThe compiler will create an executable file called “test” that will run\
    \ the program. You can execute it by entering “ ./test” in the terminal.\n\n##\
    \ Testing, compiling and Running a .cpp file in Ubuntu\n\nThis screenshot features\
    \ the terminal testing, compiling, and running the example code written in gedit\
    \ (Running c, c++ Programs in Linux] Ubuntu 16.04 (Ubuntu Tutorial for Beginners),\
    \ n.d.).\n\nLinux distros are verbose console-based systems and most of them can\
    \ handle programming in any language through the terminal. Learning to work in\
    \ the Linux environment is beneficial as it exposes you to server-side programming.\n\
    \n**Note:** The process for installing Gcc on centos is similar. To install, you\
    \ instead use \"yumgroupinstall\" DevelopmentTools. This command automatically\
    \ installs the needed libraries as well.\n\nThe steps for composing, compiling,\
    \ testing, and running the program are all the same.\n\ncreating your own programming\
    \ environment helps prepare you for real-world scenarios in a way that online\
    \ coding spaces cannot. In this book, we will be using an online IDE. This is\
    \ because everyone will have the same learning environment with standardized outputs\
    \ and interfaces. It simplifies things.\n\n## chapter 2: Basics of c++, Principles\
    \ of Programming\n\nProgramming languages are like any other human language: they\
    \ have structure, syntax, and rules. It is not enough to know the words of another\
    \ human language. Knowing how to use them and how they function in that language\
    \ is an integral part of communicating effectively in that language. Programming\
    \ languages function the same way, but the communication they care about trying\
    \ to help is between man and machine. While machines, at least today, can never\
    \ be as clever and capable as we are, there is a lot they can understand at a\
    \ rate and with an efficacy that is alien to us. All programming is a set of instructions.\
    \ These instructions can be rules, they can be actions you want the machine to\
    \ perform, or something else. But all this communication is possible because we\
    \ follow the rules of a programming language.\n\nProgramming rules, or syntax,\
    \ are a list of delineating symbols used to communicate aspects of a program like\
    \ functions and variables. Syntax is important to the compiler because it tells\
    \ the compiler what instructions it should give to the machine.\n\nBefore we start,\
    \ it is worth keeping a few things in mind. Unlike Python or other high-level\
    \ programming languages, c++ does not resemble the language of humans quite easily.\
    \ High-level languages like JS, Python, and c# are made this way because it makes\
    \ them easy to read and manage. c++, despite being this, is easier for machines\
    \ to understand precisely because it is not so abstracted. This is why when working\
    \ with c++ you only need a compiler and text editor, whereas languages like Python\
    \ need their environments installed.\n\n## Principles of Programming\n\nc++ has\
    \ many ways of completing the same task. Just like with human languages, there\
    \ are many ways of saying the same thing, but some ways are best suited for certain\
    \ occasions and some aren't. c++ is the same way; some methods are great because\
    \ they reduce program overhead. Many developers will want that because it increases\
