    ## Take Away: computer Science concepts in c++


    In addition to programming, we also explored some basic computer science concepts.
    We looked at the behavior of machines and their language. We talked about how
    learning programming is like learning a new language: both syntax and rules that
    ensure communication is possible. c++ is a back-end language that is used for
    managing servers that control oceans of data. Unlike high-level languages like
    Python, which are more human, c++ wants programmers to be more detailed in their
    code. Each variable must be unique in a function or we will have an error. All
    functions and statements are case sensitive and have specific rules that govern
    them. We have implemented many if...else statements and made nested if...else
    statements. We saw that conditional statements like if() can be executed without
    the else, but a missing else statement can cause an error if the condition is
    false. And just as a missing verb indicates a sentence is incomplete, else statements
    cannot be implemented without an if().


    We saw how computers communicate in binary numbers using logical math. We saw
    bitwise function work at the bit level, completing logical math computations like
    AND, OR, and NOT. All the other c++ functions that are object-based must be translated
    by the compiler into machine language. But bitwise functions are faster because
    they skip that step and communicate directly to the machine. They are often deployed
    in competitive programming to make highly agile programs and routines. outside
    of competitive programming, bitwise functions have some functionality in managing
    big data.


    The challenge with bitwise functions is that they are very difficult for humans
    to understand because they are binary. To see what computers see had a brief computer
    science lesson on binary and binary math. We made a “byte-sized” stream of register
    with our bitwise program and we made dynamic buffers to store bits for bitwise
    computations. Those virtual buffers and registers are how servers manage terabytes
    of data. Think about this; our buffers and registers were all one byte long, but
    a terabyte $10^{12}$ times larger than our buffer: 1,000,000,000,000 bytes. These
    numbers are small for websites like YouTube which bases its back-end computing
    on C++. The data YouTube deals with is astronomical.


    In 2018 it was 5.25 zettabytes ($10^{21}$ bytes). It was serving over 35 billion
    hours of content (“How much data does YouTube store? - Quora,” n.d.). Bitwise
    functions give these servers the ability to work with this load without interruption
    or massive delays. This is one of the best examples of the power of c++ and its
    ability to handle big complex systems. It is a useful language for programmers
    to learn. If you visualize these data streams as arrays of 8 slots, it will be
    easier for you to rationalize many bitwise operators, especially shift operators.


    In addition to binary programming, we worked with different kinds of data and
    explored different aspects of object programming. We did plenty of exercises where
    we dealt with strings, for example. In fact, we used and deployed strings in every
    one of our exercises. We saw that strings are also arrays of data, and can be
    manipulated like objects except in a few ways. Strings have a length, size and
    can be pared with various objects in the <string> library. Think of the copy constructor
    call combination of any type, vector or array, you need a for()loop with an Addressof
    operator element. That task has a dedicated function in the <string> library where
    all you need is the index of the item you are parsing. If there is one thing you
    should take away from this book it is proficiency in handling strings: breakout
    escape sequences, handling strings through array indexing, and passing strings
    to different functions.


    We also learned and discussed functionality and design considerations. We talked,
    for instance, about how and when to use loops. our bank security example was best
    illustrated by our exit controlled loop example in a fail-close system. Banks,
    as we said, should always have their doors locked and closed; they fail-close.
    Most events in the bank require doors and exits to fail-close and the only time
    they should open it in a fire. The system should keep everything in check, where
    a condition is tested AFTER the routine. The exit control loops are also useful
    in other areas, like in data control. YouTube does data corrections as a secondary
    routine of normal operations. This makes sure the system is always running, not
    hunkered by data requests.


    As C++ is a backend-language it has to handle and work with multiple types of
    data. We have had a brief discussion about this when we spoke of vector-based
    images as an object class and their other object properties. Photo manipulation
    software like Photoshop is programmed in C++ where aspects like image manipulation
    take full use of the program’s power. Vectors allow image manipulation without
    loss of quality, unlike .jpg or .png that are arrays of pixels. Vectors like .svg
    or .pdf use vector containers to describe their pixel locations, which has more
    class features in C++ that allows preservation of the image.


