    \ Github will allow you to host your entire project on their site, while Pastebin\
    \ only allows code snippets. on these platforms, you can save code in a variety\
    \ of languages.\n\nThey are very useful to programmers because they allow programmers\
    \ to share code, collaborate, test, and so forth. Learning how to deploy a project\
    \ to Github is one of the most important things in programming because it has\
    \ become standardized. So, maintaining a Github profile also become important,\
    \ as it holds all the projects you are working on, have worked on, and your activity\
    \ (Peshev, 2017). To a potential employer or collaborator, this information is\
    \ invaluable.\n\n```\n#include <stdio.h>\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main() {\n    int num = 0;\n    int result = 0;\n    cin >> num;\n\
    \    for (int i=1; i<=num; ++i) {\n        result += i;\n    }\n    cout << result\
    \ << endl;\n    system(\"pause\");\n    return 0;\n}\n```"
- md: "\n# c++ code Syntax Example\n\nThis is a screenshot from Paste Bin with syntax\
    \ highlighting enabled (\"c++ code.,\" 2015). Syntax highlighting and tabbed spacing\
    \ help with making the code more comprehensible. All text editors with syntax\
    \ highlighting will use this scheme: libraries in green, and functions, data types,\
    \ and data in blue. Strings will show up as red.\n\nWhen you are working locally\
    \ you will not have luxuries like these readily available. The first text editor\
    \ you will find on your system if you are using windows is Notepad. Wordpad is\
    \ another one that has more GUI features. What you will notice as you open these\
    \ programs is how plain and boring they are. They are like Word but worse, because\
    \ they shouldn’t be simple word processors if writing efficient, elegant code\
    \ is important to us. Their word processor-like aspects make them more suitable\
    \ for writing words in them, not code, although you can code in them.\n\n```cpp\n\
    #include <stdio.h>\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    int num = 0;\n    return 0;\n}\n```\n\n### Side-by-side comparison of\
    \ Windows’ Notepad utility and Wordpad utility\n\nThis is a screenshot that features\
    \ two of Windows’ built-in utilities, Notepad on the left and Wordpad on the right.\
    \ Wordpad has more Microsoft suite GUI features that may be more recognizable\
    \ to you, including Microsoft’s quick access bar located above the highlighted\
    \ \"File\" tab. Notepad is very bare-bones in comparison. Both utilities, unlike\
    \ word processors, allow you to save in different file extensions. However, Wordpad\
    \ is more similar to a word processor than Notepad, saving files in rich text\
    \ format (.rtf). Wordpad will warn you that you will lose formatting if you save\
    \ in an extension other than rich text format.\n\nWhat makes Notepad and Wordpad\
    \ unique is that they can save files in a variety of file extensions, while word\
    \ processors cannot. File extensions are important because they tell the compiler\
    \ how to interpret what is written in the file, and that leads to the machine\
    \ having a set of instructions it can understand and execute.\n\nDespite their\
    \ abilities, these two programs lack crucial text editor features like syntax\
    \ highlighting. You might think this is no big deal, but it is; the same words\
    \ in code can mean different things because of how and when they appear, so highlighting\
    \ helps us distinguish what they refer to. So if everything is plain, black and\
    \ white, you have to work harder to figure out what a piece of code refers to.\
    \ It sounds complex now, but once you code this will become obvious and necessary.\n\
    \nNotepad++, not to be confused with Windows' Notepad, has highlighting features\
    \ but you will have to activate them like so:\n\n![](img/76e155a654962a3de26649c22b574ec2_15_0.png)\n\
    \n# Screenshot of Notepad++ with c++ Syntax\n\nNotepad++ is free and, as the name\
    \ suggests, was programmed in c++. This screenshot illustrates how to enable language\
    \ syntax. c++ syntax can specifically be enabled by going to language > \"c\"\
    \ > and navigating to c++. Notepad++ is only available on the Windows platform\
    \ (Orin, n.d.).\n\nBluefish is a more advanced text editor that comes with more\
    \ features (“Bluefish Editor: Features,” n.d.). Unlike Notepad++, Bluefish is\
    \ available on multiple platforms other than Windows. But I would not recommend\
    \ Bluefish for beginners because it has a lot of features that can be overwhelming\
    \ a complete beginner. If you are not new to programming you can give it a shot;\
    \ you will find that many of the GUI features typical of an IDE text editor.\n\
    \nonce in the text editor, you must select a compiler. Now let me show you how\
    \ you would set up your local environment on three platforms: Windows, Linux,\
    \ and Mac.\n\n# Windows IDE Installation and Setup\n\nAll you need to do is to\
    \ install an IDE. Just remember that it has to have a text editor and a compiler\
    \ within it. **code::Blocks** is a useful, open-source IDE made for c++ and it\
    \ easily fits with a variety of compilers including Microsoft’s Visual c++. Installing\
    \ code::Block is easy. You just have to go to their downloads page http://www.codeblocks.org/downloads/26\
    \ and select the latest version.\n\n# code::Blocks Download Page\n\nAs of this\
    \ writing, code::Blocks has version 20.03 for Windows and Linux distributions.\
    \ The page also includes helpful notes for installation.\n\nonce the program is\
    \ installed, you are set. You can use it to write c++ programs. To do so you have\
    \ to follow three steps: creating a file, building the program, and running the\
    \ program.\n\ncreating a new file is a bit more nuanced. Here is what you have\
    \ to do:\n\n- Go to File > New\n- Select \"create an empty file\" and input your\
    \ code\n- Save the file with a \".cpp\" extension\n\nAnd, needless to say, you\
    \ have to build a program before you can run it. You can do this by going to Build\
    \ > “Build and Run” in the menu.\n\n![](img/76e155a654962a3de26649c22b574ec2_17_0.png)\n\
    \n![](img/76e155a654962a3de26649c22b574ec2_18_0.png)\n\n# Screenshot of “Hello\
    \ World” in code::Blocks\n\nThis is a live screenshot of our \"Hello World\" program\
    \ in code blocks. After this program is run, an error shows up in the Build Messages\
    \ of the code. code::Blocks highlights the error on line 6. Given your knowledge\
    \ of c++ syntax from the earlier section, you should see how to repair the code.\
    \ How can we repair the code?\n\n*Hint: Data and functions are supposed to show\
    \ up in blue.* By the way, this program is very lightweight for the amount of\
    \ work it allows you to do. code::Block is available on Windows and Linux, but\
    \ there is no Mac version.\n\n## Mac OS IDE Installation and Setup\n\nFor Mac,\
    \ you will need to get Xcode. It is a free IDE software development suite for\
    \ macOS. You can get it on the Mac App Store. Xcode supports a variety of other\
    \ languages like Java, Python, and Ruby.\n\nIt is geared towards developing software\
    \ for macOS operating systems; this can be for the tvOS for AppleTV, watchOS for\
    \ Apple watches, and the iPadOS for iPad tablets (“What’s New in Xcode 9,” n.d.).\
    \ Xcode offers a variety of software development kits (SDKs) for different macOS\
    \ platforms to help programmers through Apple’s proprietary programming schemes.\
    \ SDKs are a set of tools, provided by hardware and software vendors, used for\
    \ developing applications (“What’s New in Xcode 9,” n.d.). Mac uses proprietary\
    \ compilers that only work with Xcode, so if you are on Mac you have little choice\
    \ but to develop with c++ using Xcode. You can download and install Xcode by following\
    \ this link:\n\nhttps://apps.apple.com/us/app/xcode/id497799835?mt=12\n\nonce\
    \ the file is downloaded and installed, open Xcode and click on the “create a\
    \ new Xcode” icon. Then select “New Project” in the initial window.\n\n# Initial\
    \ Screen for Xcode: Select a new project\n\nThese screenshots feature an Xcode\
    \ build from version 8.3.3 (Patel, 2017). Therefore, our examples might look different\
    \ from a more up-to-date build. As of this writing, the most current version is\
    \ 12.1, which mostly includes updates to the various macOS platforms. Despite\
    \ these differences, these screenshots will still help you orient yourself in\
    \ the current build. our instruction will still yield results.\n\nAfter you do\
    \ this, a prompt window will appear that will ask you to choose a template. This\
    \ window will guide you through the rest of the setup. Select the macOS sections\
    \ and go to the Application section; in there, choose the command Line Tool.\n\
    \nIt looks something like this:\n\nimg/76e155a654962a3de26649c22b574ec2_20_0.png)\n\
    \n# 1. Project Selection Screen: macOS Application > command Line Tool\n\nXcode\
    \ has many built-in code utilities for running programs on various Apple platforms.\
    \ Therefore, to run a test program you would have to select macOS for it to run\
    \ on your program. Further, to access assembly language software development needed\
    \ for c++, you would have to use Xcode’s command-line tool. This command-line\
    \ tool can handle objective-c and c languages as well.\n\nAfter you select a template,\
    \ the guide will present options for the command-line tool. Here, you can name\
    \ the project, add your organization’s name, use a bundle identifier, and select\
    \ a programming language.\n\nimg/76e155a654962a3de26649c22b574ec2_21_0.png)\n"
  mdcn: "\n\n# c++ 代码语法示例\n\n这是一个开启了语法高亮的 Paste Bin 截图（“c++ code.”，2015）。语法高亮和制表符间距有助于使代码更易理解。所有带有语法高亮的文本编辑器都会使用此方案：库显示为绿色，函数、数据类型和数据显示为蓝色。字符串将显示为红色。\n\
    \n你在本地工作时，无法轻松获得这些便利功能。如果你使用的是 Windows，在系统上找到的第一个文本编辑器是记事本（Notepad）。Wordpad 是另一个具有更多\
    \ GUI 特性的编辑器。当你打开这些程序时，你会发现它们是多么的单调和无聊。它们像 Word 但更糟，因为如果编写高效、优雅的代码对我们来说很重要，那么它们就不应该是简单的文字处理器。它们类文字处理器的特性使得它们更适合编写文字而不是代码，尽管你可以在它们写代码。\n\
    \n```cpp\n#include <stdio.h>\n#include <iostream>\n\nusing namespace std;\n\n\
    int main() {\n    int num = 0;\n    return 0;\n}\n```\n\n### Windows 记事本与 Wordpad\
    \ 工具的并排对比\n\n这是一个显示 Windows 两个内置工具的截图，左侧是记事本，右侧是 Wordpad。Wordpad 具有更多微软套件 GUI\
    \ 特性，你可能对这些更熟悉，包括位于高亮“文件”标签上方的微软快速访问栏。相比之下，记事本非常简陋。与文字处理器不同，这两个工具都允许你以不同的文件扩展名保存文件。然而，Wordpad\
    \ 比记事本更像文字处理器，它以富文本格式 (.rtf) 保存文件。如果你使用富文本格式以外的扩展名保存，Wordpad 会警告你将丢失格式。\n\n让记事本和\
    \ Wordpad 独特之处在于它们可以以各种文件扩展名保存文件，而文字处理器则不能。文件扩展名非常重要，因为它们告诉编译器如何解释文件中的内容，从而让机器拥有一套它可以理解并执行的指令集。\n\
    \n尽管有这些能力，这两个程序仍然缺乏语法高亮等关键文本编辑器功能。你可能认为这没什么大碍，但事实如此；代码中相同的单词因为它们出现的方式和时间而可能意味着不同的含义，因此高亮有助于我们区分它们所指的内容。所以，如果一切都是单调的黑白，你必须花更多努力来理解某段代码指的是什么。现在听起来很复杂，一旦你开始编写代码，这将变得明显且必要。\n\
    \nNotepad++（不要与 Windows 的记事本混淆）具有高亮功能，但你必须这样激活它们：\n\n![](img/76e155a654962a3de26649c22b574ec2_15_0.png)\n\
    \n# Notepad++ 的 c++ 语法截图\n\nNotepad++ 是免费的，正如其名，它是用 c++ 的。这张截图说明了如何启用语言语法。可以通过进入语言\
    \ > \"c\" > 并导航到 c++ 来专门启用 c++ 语法。Notepad++ 仅适用于 Windows 平台（Orin, n.d.）。\n\nBluefish\
    \ 是更高级的文本编辑器，带有更多功能（“Bluefish Editor: Features,” n.d.）。与 Notepad++ 不同，Bluefish\
    \ 在 Windows 外的多个平台上可用。我不向初学者推荐 Bluefish，因为它有很多让完全完全初学者感到无从措的功能。如果你不是编程新手，可以尝试一下；你会发现许多\
    \ IDE 文本编辑器的典型 GUI 功能。\n\n进入文本编辑器后，你必须选择一个编译器。现在让我向你如何在三个平台（Windows、Linux 和 Mac）上设置本地环境。\n\
    \n# Windows IDE 安装与设置\n\n你所做的就是安装一个 IDE。记住，它必须包含一个文本编辑器和一个编译器。**code::Blocks**\
    \ 是一个为 c++ 设计的有用开源 IDE，它可以轻松适配各种编译器，包括微软的 Visual c++。安装 code::Block 很容易。你只需要访问他们的下载页面\
    \ http://www.codeblocks.org/downloads/26 并选择最新版本即可。\n\n# code::Blocks 下载页面\n\n\
    截至本文编写，code::Blocks 有适用于 Windows 和 Linux 发行版的 20.03 版本。该页面还包含了对安装有帮助说明。\n\n程序安装完成后，你就准备好了。你可以使用它来编写\
    \ c++ 程序。要做到这一点，你需要遵循三个步骤：创建文件、构建程序和运行程序。\n\n创建新文件稍微复杂一点。以下是你需要做的：\n\n- 进入 文件\
    \ (File) > 新建 (New)\n- 选择“创建一个空文件”并输入你的代码\n- 使用 \".cpp\" 扩展名保存文件\n\n而且，不用说，在运行程序之前你必须构建程序。你可以通过进入菜单中的\
    \ 构建 (Build) > “构建并运行 (Build and Run)” 来完成。\n\n![](img/76e155a654962a3de26649c22b574ec2_17_0.png)\n\
    \n![](img/76e155a654962a3de26649c22b574ec2_18_0.png)\n\n# code::Blocks 中的“Hello\
    \ World”截图\n\n我们在 blocks 中“Hello World”程序的实时截图。运行此程序后，代码构建消息（Build Messages）中会出现一个错误。code::Blocks\
    \ 高亮了第 6 行的错误。根据你之前章节对 c++ 语法的知识，你应该能看到如何修复代码。我们如何修复代码？\n\n*提示：数据和函数应该显示为蓝色。*在这种情况下，code::Blocks\
    \ 适用于 Windows 和 Linux，但没有 Mac 版本。\n\n## Mac OS IDE 安装与设置\n\n对于 Mac，你需要获取 Xcode。它是面向\
    \ macOS 的软件开发套件。你可以从 App Store 获取它。Xcode 支持多种语言，如 Java、Python 和 Ruby。\n\n它是面向\
    \ macOS 系统、tvOS（Apple TV）、watchOS（Apple Watch）以及 iPadOS（Apple iPad）的软件开发工具。Mac\
    \ 使用专有编译器，因此如果你在 Mac 上，你只能选择使用 Xcode 来开发 c++。你可以通过此链接下载并安装 Xcode：\n\nhttps://apps.apple.com/us/app/xcode/id49779835?mt=12\n\
    \n一旦文件下载并安装，打开 Xcode 并点击“新建 Xcode”图标。然后在初始窗口中选择“新建项目”。\n\n# Xcode 新项目界面\n\n这些截图采用是\
    \ 8.3.3 版本的 Xcode（Patel, 2017）。因此，我们的示例与最新版本有所不同。截至本文编写，最新版本是 12.1，主要包含了对各种 macOS\
    \ 平台的更新。尽管存在差异，这些截图仍能帮助你在当前版本中定位。我们的指令仍然会有结果。\n\n在此操作后，将弹出一个窗口要求你选择模板。该窗口将引导你完成剩余的设置。选择\
    \ macOS 部分并进入应用程序部分；在其中，选择命令行工具 (command Line Tool)。\n\n看起来像这样：\n\nimg/76e155a654962a3de26649c22b574ec2_20_0.png)\n\
    \n# 1. 项目选择界面：macOS 应用程序 > 命令行工具\n\n"
