  md: '# Introduction


    This book is fit for beginners and for coders who are interested in getting into
    backend programming. Although c++ is sometimes portrayed as a specter of days
    past, the language is still with us and it continues to be behind some of the
    biggest technologies we use today-not mentioning its imprint in the gaming world.
    Its power and versatility continue to make it one of the most important languages
    of our time. It is not going anywhere and learning it will expand your horizons.


    C++ is often utilized as a backend language because of its little processing overhead.
    companies like Spotify, Adobe, YouTube, and Amazon power their backend with c++,
    and you will soon see why.


    C++ is also behind powerful gaming engines. Gaming engines allow programmers to
    build a game without coding everything from scratch and to effectively render
    content. The Unity Game Engine and the Unreal Engine are examples of gaming engines
    that run on c++.


    C++ is a beautiful, efficient language because of the favorable power/hardware
    ratio: it uses little hardware for the amount of power it gives us. This is why
    those who learn it love it.


    In this book we will cover the following topics:


    +   - Programming terminology and principles in programming'
