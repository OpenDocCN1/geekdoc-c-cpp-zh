- pgno: 76
  md: "# Chapter 3\n\n# How the Developing World may Participate\nin in the Global\
    \ Internet Economy:\nInnovation Driven by Competition\n\nBy Rohan Samarajiva¹\n\
    \nFull participation in the global Internet Economy requires electronic\nconnectivity\
    \ of increasing complexity. Today, due to a wave of liberalisation and\ntechnological\
    \ and business innovation, much of the world is electronically\nconnected, albeit\
    \ not at levels that support full participation. This chapter\namines the contributions\
    \ made by competition and business innovation to\nachieving current levels of\
    \ connectivity and the possibilities for extrapolation to\nensure widespread participation\
    \ in the global Internet Economy.\n\nThe biggest challenge facing the developing\
    \ world in this area is connecting\nlow-income groups. Solutions to this problem\
    \ will make finding solutions to others\neasier. In addressing the challenge of\
    \ connectivity, this chapter draws extensively\nfrom research conducted in South\
    \ and Southeast Asia. In the concluding section,\npolicy implications – including\
    \ articulations with tax and other policies that must\be aligned if access is\
    \ to translate into wealth creation – are discussed."
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 76 – 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY


    The OECD Seoul Declaration on the Future of the Internet Economy covers a full
    range of Internet-supported economic, social and cultural activities and related
    ICTs which will strengthen the capacity of countries to improve the quality of
    life of all their citizens by:


    +   * Providing new opportunities for employment, productivity, education, health
    and public services as well as addressing environmental and demographic concerns.


    +   * Acting as a key driver for the creation of enterprises and communities and
    stimulating closer global co-operation.


    +   * Enabling new forms of civic engagement and participation that promote diversity
    of opinions and enhance transparency, accountability, privacy and trust.


    +   * Empowering consumers and users in online transactions and exchanges.


    +   * Reinforcing a circle of security which applies to information systems and
    networks, and their users.


    +   * Developing an increasingly important platform for research, international
    science co-operation, creativity and innovation in many different sectors.


    +   * Creating opportunities for new economic and social activities, applications
    and services through ubiquitous and seamless access to communication and information
    networks.


    +   * Promoting a global information society based on fast, secure and ubiquitous
    networks which connect billions of people, machines and objects.


    The fact that the OECD held a ministerial-level meeting on the Internet Economy
    resolved to promote ubiquitous access to ICTs to advance its realisation indicates
    that the Global Internet Economy has not yet been fully realised, even within
    OECD countries. It is even less a reality for the billions living in developing
    countries, especially those who are poor. The Seoul Declaration takes this into
    account explicitly, declaring that it seeks to make the Internet Economy truly
    global through policies that:


    +   * Support expanded access to the Internet and related ICTs, for people in
    developing countries.


    +   * Recognize the potential of the Internet and related technologies to provide
    enhanced services to people with disabilities and special needs.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY
    – 77


    +   Recognise the importance of a competitive environment for the successful growth
    of the Internet Economy and the opportunities this can bring for development,
    particularly for people and regions with the most limited economic means.


    +   Promote use of Internet and related ICT networks by all communities as well
    as the creation of local content and multi-language translations to improve economic
    and social inclusion of people with different capabilities, education, and skills,
    and to preserve cultural and linguistic diversity.


    +   Facilitate the introduction of internationalised domain names (IDNs) while
    ensuring the integrity and stability of the Internet.


    +   Increase cross-border co-operation of government and enforcement authorities
    in the areas of improving cyber-security, combating spam, as well protecting privacy,
    consumers and minors.


    +   Harness the potential of the Internet to tackle global challenges such as
    improving energy efficiency and addressing climate change.


    Key for the purposes of this chapter is the third bullet point flagging the importance
    of a competitive environment for the flourishing of the Internet Economy, especially
    for people and regions with the most limited economic means. The massive progress
    achieved in the past few decades in bringing connectivity to the developing world
    was indeed made possible by opening up the market for connectivity services, allowing
    varying degrees of competition. Success in expanding that to broadband networks
    will require equal adherence to the principle of competition and increased emphasis
    on its effective implementation.


    # What is the Internet?


    A common mental image of the Internet features a desktop or laptop computer connected
    by wire or wirelessly to an access path with adequate capacity to allow non-stop
    downloads and uploads at certain speeds or to a broadband connection. However,
    awareness of the importance of the mobile as an alternative pathway is increasing,
    as acknowledged in the World Economic Forum''s 2008-09 Global Information Technology
    Report, and Aspen India''s 2008 “M-Powering India: Mobile Communications for Inclusive
    Growth.” The Economist noted, in September 2008:


    [T]he of mobile phones that can access the Internet is growing at a phenomenal
    rate, especially in the developing world. In China, for example, over 73m, or
    29% of all Internet users in the country, use mobile phones to get online. And
    the number of people doing so'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'grew by 45% in the six months to June—far higher than the rate of access growth
    using laptops, according to the China Internet Network Information Centre. (The
    Economist, 2008)


    Broadband has been defined by the Partnership for Measuring ICT for Development
    as an Internet service of at least 256 kbps in one or both directions. The US
    Federal Communications Commission also seeks to develop a definition of broadband.
    Separate definitions are given for fixedline and mobile broadband—a distinction
    that probably would not have been made ten years ago. The incomplete nature of
    the definitions indicates that the phenomenon is inchaotic.


    There is value in thinking of the Internet, or the cluster of technologies enabling
    the Internet Economy, as a bundle of functions rather than as the composite, common-sense
    image just described. Functions currently include:


    +   - communication in multiple forms (synchronous/asynchronous), oneto-one/one-to-many,
    etc.);


    +   - information retrieval, including search;


    +   - publication;


    +   - transactions (including payments);


    +   - remote computing.


    This hierarchy moves from simple to complex. It is no surprise that a sophisticated
    user sitting at the end of a multi-megabyte pipe can use all the aforementioned
    functions easily, especially if they possess a credit/debit card. What is truly
    surprising is that many people who have never come in contact with a standard
    computer are already performing some of these functions electronically.


    For example, when a poor person with a prepaid mobile connection types in a short
    code to check his account balance, they are engaging in one of the more complex
    current Internet functions: remote computing. Downloading a ringtone and paying
    for it from the “load” on a prepaid phone is a transaction that includes an electronic
    payment — again, something quite.


    Mobile devices are used for all forms of communication, including text-based (SMS)
    and context-based (“missed calls”) communication. These functions can be performed
    with the simplest of today’s second-generation mobile handsets in countries that
    have yet to release the frequencies needed for third generation (3G) or sophisticated
    data-friendly services. In other words, billions of poor people in developing
    countries are also'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY
    – 79


    participating in the Internet Economy, albeit in somewhat constrained and unfamiliar
    forms.


    As countries introduce 3G mobile networks, the migration of high-end phones to
    low-income users will accelerate. As of October 2008, the modal value of new phones
    amongst socio-economic classification (SEC) groups D and E in Bangladesh was USD
    43 (mean USD 58). The modal value of second-hand phones was USD 29 (mean USD 35).
    Qualitative research conducted as part of LIRNEAsia''s Teleuse@BOP study showed
    that many of the second-hand phones were quite sophisticated. Both types were
    being used to transfer music from one phone to another using Bluetooth, to listen
    to music, watch play games, obtain news and employment information (sometimes
    the sole source), and to keep records of transactions. The range and frequency
    of uses was much higher amongst the poor in Sri Lanka, the Philippines and Thailand,
    countries with relatively higher levels of disposable income, literacy and penetration.


    It is becoming clear that agricultural information is better on when it is available
    and whenever the user wants rather than in kiosks with opening and closing hours
    or in homes. Innovative companies such as Cellazaar in Bangladesh are introducing
    rudimentary e-commerce to bottom of the pyramid (BOP) users who might otherwise
    never get access to such services, using SMS and WAP (Wireless Access Protocol).
    Information on candidates in the 2009 Indian general election, such as their particular
    assets and liabilities, educational attainment and whether they had criminal records,
    was available through SMS. BuzzCity and Gushup are creating social networking
    in the mobile space. Once the regulatory issues of m-payments are resolved, it
    is likely that mobile phones, not credit cards, will become the main mode of payment
    in the developing world, as is already the case in some parts of Africa.


    # Preconditions for inclusion


    Billions of poor people becoming electronically connected and capable of using
    some of the functions of the Internet is for celebration, but not for complacency.
    The present capabilities of 2G networks and handsets used by most poor people
    do not, for example, for the complex search and information retrieval activities
    taken for granted in conventional desktop/laptop-based Internet use. Publishing,
    in the sense of posting on websites and blogs, is quite cumbersome on a simple
    mobile handset, Twitter excepted. The qualitative research conducted as part of
    the LIRNEasia Teleuse@BOP study showed that heavy users used both modes: downloading
    music at cafés, transferring it via Bluetooth and listening on mobile handsets,
    for example.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# 80 – 3. HOW THE DEVELOPING WORLD MAY PARTICIP IN THE GLOBAL INTERNET ECONOMY


    There is little question then access to broadband from both mobile handsets and
    computers must be improved if the emerging Internet Economy is inclusive. Governments
    the world over must give priority to expedite spectrum reforming and transparently
    free releases to enable operators to offer 3G technologies and beyond. Looking
    at spectrum solely as a source of government revenue at point of release is not
    conducive to broad deployment or long-term government revenue generation.


    The value of wireless in the access network or the “last mile” does not negate
    the fundamental importance of wireguides in the backhaul component. Been each
    WiFi hotspot is a series of wireguides that connect us to the Internet cloud,
    in most cases the continental United States. In the same way that the strength
    of a chain is determined by its weakest link, the overall performance of one’s
    Internet connection is determined by the slowest component in the connection.
    LIRAsia-IIT Madras research on broadband quality of service experience (QoS) has
    shown that the real bottleneck for most users in developing countries is the international
    segment, where undersea cable and satellite capacity appear to be under-provisioned
    by operators (Figure 3.1).


    Figure 3.1: Return trip time (RTT) to yahoo.com, 24 July 2009 1350hrs


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_81_0.png)


    Y-axis indicates the return time (RTT) to a server. Up to 60 hop IP addresses
    are within Sri Lanka (whowhois.net); the “leap” is from a local server to the
    first entry point to USA.


