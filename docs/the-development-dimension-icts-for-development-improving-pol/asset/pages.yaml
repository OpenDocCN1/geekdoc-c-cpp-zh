- pgno: 34
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 33


    # Question 3: Is there coherence between ICT policy and development goals?


    Just as we have seen the focus of policy changing over time between different
    parts of the value chain, so we can also see changes over time in the relation
    between typical ICT policies and development (Heeks 2009).


    Twenty-five years ago, ICTs were pretty much off the policy agenda; largely ignored
    by development agencies and all but a few developing country governments. With
    the advent of the microcomputer ICTs became too much of a phenomenon to ignore,
    the vast bulk of strategists and policy-makers were unfamiliar with the new technology.
    So ICTs were somewhat ostrised; they might occasionally be mentioned but were
    kept isolated from the development policy mainstream, dealt with by a very small
    and separate team of specialists.


    When the Internet fully arrived on the scene in the late 1990s, this worldview
    flip-flipped and ICTs were placed centre stage and even idolised as a saviour
    that could deliver development goals. Recently, a more level-headed approach has
    seen agencies and governments integrating ICTs into their network of policy tools.


    We can therefore chart out a “4Is” chronology. In the days before ICT4D was called
    ICT4D, ICT was often ignored and then isolated, with only a limited perceived
    contribution to development. When ICT4D began in the late 1990s, it was first
    idolised by some, and then integrated into the mainstream of development policy.


    This “mainstreaming” approach has come to be seen as the appropriate relation
    between ICTs and development policy. However, one could ask whether an “innovate”
    view – adding a fifth “I” – would be better; one sees ICTs not just one tool among
    many, but as a unique technology with a transformative potential for development.


    +   - Mainstreaming traps ICTs in individual development goal silos; and an “innovate”
    view sees them as a cross-cutting, linking technology for development.


    +   - Mainstreaming loses the sense of excitement, motivation and hope that ICTs
    can bring; an “innovate” view captures and channels these sentiments.


    +   - Mainstreaming accepts the current rules of the game; an “innovate” view
    recognises that ICTs can transform development.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 34 - 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    On this last point, we can find increasing ways in which ICTs are transformative
    of the way we do development; ushering in new development models and offering
    the possibility of “Development 2.0”.


    This is recognised in the OECD''s Shaping Policies for the Future of the Internet
    economy, which underlines the catalyst role that ICTs play, especially around
    promoting creativity and innovation (OECD 2008). We can see this in “micro-giving”
    models such as Kiva. Such models disintermediate by cutting out the institutions
    that traditionally sit between the global North who want to help, and in the global
    South who want investments. They reintermediate by allowing entry to new types
    of development actors such as Kiva itself and the microfinance partners through
    whom it works.


    The policy coherence problem arises when we need a worldview for today and tomorrow,
    but development policies for yesterday. Most obvious policies that ignore or isolate
    ICTs they cannot effectively contribute to development. But what about policies
    that have mainstreamed and integrated ICTs? Do we instead to be taking a more
    “Development 2.0” policy view that recognises the cross-cutting, innovative and
    transformative nature of digital technology?


    # Question 4: Do we have the necessary content, structure and process to deliver
    coherent, effective policy?


    Effective policy requires paying attention to three things: the content of policy;
    the formal and informal institutional structures through which policy is made
    and implemented; and the processes by which policy is made and implemented.


    To date has been too much focus on policy content, somewhat to the exclusion of
    the other two components: structure and process. A more balanced view is needed.
    For example, recent research on e-government policy in Sri Lanka finds the initial
    content of policy relatively little in the overall evaluation. Instead, it is
    the nature of the stakeholders involved, their interests and the way in which
    they form a policy network more determines the outcome and impact of policy (Stanforth
    2009).


    # ICT4D 0.0 to ICT4D 1.0 to ICT4D 2.0


    The first digital computer to use in a developing country was installed in Kolkata
    in 1956 at the Indian Institute of Statistics for numerical calculation work.
    From that early start until the 1990s, there were two application emphases in
    the use of computing for development. Initially,...'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 35


    government was the key actor, and IT (as it was then referred to, rather than
    ICT was applied mainly to international administrative functions of the public
    sector in developing countries. During the 1980s,multinationals and other firms
    came to the fore, and IT – epitom by the advent of the microcomputer and its associated
    software – was seen as a tool for economic growth in the private sector. We might
    christ “ICT4D 0.0” period IT4G – information technology for growth, overtaken
    by information technology for growth.


    Two things happened in the 1990s that gave birth to what might recognibly be called
    ICT4D 1.0. The first was general availability of the Internet. The second was
    the Millennium Development Goals (MDGs).


    The Internet sparked an upscale of interest in ICTs, including a reinvigorated
    interest in how they might be applied in developing countries. At the same time,
    international development began to make up the political agenda. This move was
    given impetus by the search for concrete targets, emerging first as the International
    Development Goals in 1996 and then formalised as the MDGs in the September 2000
    Millennium Declaration, which sought particularly to reduce poverty and improve
    health and education equality.


    The digital technologies of the 1990s, were new tools in search of a purpose.
    Development goals were new targets in search of a delivery mechanism. These two
    should find each other was not unexpected. Together they produced “ICT4D”, born
    in a flurry of publications, bodies, events, programs and project funding: the
    1998 World Development Report from the World Bank, highlighting the role of information,
    knowledge and ICTs in development; the creation by the G8 countries of the Digital
    Opportunities Task Force in 2000, setting an agenda for action on ICT4D; and the
    World Summits on the Information Society held in Geneva in 2003 and Tunis in 2005,
    acting as key learning and policy formation points along the ICT4D path.


    The key actors became international development organisations and NGOs, and the
    priority application of ICTs was to be the MDGs. Centrally, the MDGs are about
    improving the lives of others Prahalal has called the “bottom of the pyramid”:
    the 3 billion on the planet who live on an average of less than USD 2 per day.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 36 - 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    # Box 2.1. Addressing the needs of the poor


    There are three ways in which development actions can address needs of the poor:


    +   * Inclusive: improving opportunities and services that cover all people, including
    the poor;

    * Enabling: supporting the policies or context that will improve the lives of
    the poor;

    * Focused: specifically targeting the rights, interests and needs of the poor.


    The initial phase of ICT4D incorporated all of these. For example, there were
    inclusive e-government initiatives aiming to increase delivery of public services
    via the Internet. There were enabling actions on ICT governance, seeking to ensure
    that poor countries'' interests were included in the global regimes that control
    the Internet and telecommunications traffic and tariffs. But most energies were
    reserved for focused projects: these those that took ICTs into poor communities
    and sought to deliver information and services that might address poverty, health,
    education and gender quality – the four areas that form the bulk of the MDGs.
    It is likely that this combined approach – inclusive, enabling, and focused –
    will remain under ICT4D 2.0. We may, though, see some rebalancing, with more recognition
    given to the importance of governance in shaping the outcomes of ICT4D.


    # What happened during ICT4D 1.0?


    With timescales short and pressure to show tangible delivery, the development
    actors involved with ICT4D did what everyone does in such circumstances. They
    looked for a quick, off-the-shelf solution that could be replicated in poor communities
    in developing countries.


    Given that most poverty is located in rural areas, the model that fell into everyone''s
    lap was the rural telecottage or telecentre which had been rolled out in the European
    and North American periphery during the 1980s and early 1990s. Seems to mean a
    room or building with one or more Internet-connected PCs, this could be installed
    fairly quickly, provide tangible evidence of achievement and deliver information,
    communication and services to poor communities (and provide sales for the ICT
    companies who were partners in most ICT4D forums). Thus a host of colourfully-named
    projects began rolling out, from InForCauca in Colombia to CLICS in Mali and Gyandoot
    in India.


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 37


    Naturally, ICT4D 1.0 was not solely restricted to telecentre projects. But the
    telecentre was the archetype for this period, stretching from the mid/late-1990s
    to the mid/late-2000s.


    What has been the outcome? Painting with a broad brush, we can sum up with three
    words: failure, restriction, and anecdote. Each of these has led to specific lessons
    and new watchwords:


    +   - Sustainability: given the failure of many ICT4D projects to deliver and/or
    survive, there is a new emphasis on ensuring the longevity of such projects.


    +   - Scalability: given the limited reach of individual telecentre projects,
    there is a search for scalable ICT4D solutions.


    +   - Evaluation: that ICT4D 1.0 was often held aloft by hype and uncorroborated,
    self-interested stories, there is a new concern with objective evaluation of impacts.


    More generally, these outcomes of the first decade of ICT4D have led to a rolling-appraisal
    of priorities, processes, and purposes. There is no sharp divide to mark out the
    first from the second phase of ICT4D – the latter began as the first lessons were
    learned back in the 20th century. and there is no consensus on what ICT4D 2.0
    looks like – the discussion is ongoing.


    Nonetheless, let us sketch out of its component parts – a task that will be taken
    up in the rest of this chapter.


    # ICT4D 2.0’s new technological priorities


    Figure 2.2 provides an overview of the technology and processes of ICT4D. Before
    plunging into how some these are likely to change in the coming years, though,
    we will take a step back.


    In his book Shock of the Old, David Edgerton argues that we have been too obsessed
    with technology-as-invention, and too little focused on technology-in-use. Yet
    it is the latter that has made much of a difference to people’s lives.


    The ICT4D field has certainly been prone to this. It has sought to surf each wave
    of “novelty”. ICT4D 1.0 initially took an invention-down approach – bringing new
    technologies into development contexts – much more than it took a use-up approach
    of understanding how existing technologies were being applied poor communities.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Figure 2.2: The technologies and processes of ICT4D


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_39_0.png)


    Source: Richard Heeks.


    If ICT4D 2.0 does shift the invention-use balance, it would mean:


    +   - Less emphasis on what might be used (the Internet and PCs) and more on what
    is actually used (mobiles, radio, television).

    - Less emphasis on fundamental technical innovation and more on application and
    business model innovation.

    - Less emphasis on piloting and sustaining new applications and more on assessing
    and scaling existing applications.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 39


    # Box 2.2. ICT4D impact assessment and evaluation


    Impact assessment and evaluation have always been seen as the neglected children
    of the development family. We fear looking back at the current project lest, like
    Lot''s wife, we should be turned into pillars of salt. Hasten on the next project.
    Part of the problem is motivation, which is hard to alter, but part of the problem
    in ICT4D has been lack of guidance. Initiatives such as the Compendium on Impact
    Assessment of ICT-for-Development Projects, and the Global Impact Study will help
    provide guidance for ICT4D 2.0.


    # New hardware


    As we stand on the threshold of ICT4D 2.0, a key question to be answered is how
    will we deliver the Internet to the remaining 5 billion?


    Back in the 1990s, the initial model was serving the global North: a PC connected
    via a landline. But attempted roll-out faced major hurdles as the South''s bottom
    of the pyramid proved harder to reach. The model was too costly to be sustainable
    or scalable, and/or the necessary power and telecommunications foundations were
    often absent. Pushing forward, the Internet-connected PC will require hardware
    innovations in:


    +   Terminals: there are ongoing efforts to develop the type of low-spec, low-cost,
    robust terminal devices that could work in large numbers of poor communities.
    The most high-profile of these is the One per Laptop (OLPC) project''s XO. Not
    coincidentally, a slew of relatively similar devices is forth. Some – like the
    PixelQi and the Intel Classmate – have a similar intention to target developing
    countries. Others – Linutop, InkMedia, Elonex ONE, Asee Eee and many more – are
    more generalised commercial products. Despite twenty years of overpromising and
    underdelivering from the ‘People’s PC’ to the Simputer – it appears that low-cost
    terminals will be a central part of ICT4D 2.0.


    +   Telecommunications: wireless has the delivery method of choice to provide
    connectivity into poor communities in the global South. Interest in satellite-based
    forms such as VSAT during the 1980s and 1990s has given way to a focus on land-based
    transmission systems. In the same way, attention is turning from WiFi-based systems
    and innovation to WiMAX. The overriding innovation remains the relatively low
    traffic demand and population density of rural poverty, requiring solutions that
    can deliver broader at lower cost than current technology.'
