    # Box 2.11. Needs vs. wants on ICT4D projects


    During ICT4D 1.0, it seemed that project designers often focused ICT application
    on a top-down determination of needs, rather than a bottom-up statement of wants.
    Projects were designed around a standard information needs template that said
    communities needed better access to information on health, education, governance,
    etc. However, when community members freely discuss what they want from ICTs,
    priority items are often a mix of help with new income and employment, and entertainment.


    The Namma Dhwani project in South India exemplifies the contrast. Community radio
    loudspeakers were wired around the village to broadcast "developmental" information.
    Villagers were not happy about this and, at some point, the wires were linked
    up to a mobile system to broadcast music as a statue of Lord Ganesha was paraded
    around the village for a local festival. The former use of ICT was seen as one
    the community needed. The latter was what they wanted.


    Where projects focus on needs, they can suffer from low usage (and hence low impact),
    submersion and a lack of sustainability. Where projects – as, for example, in
    the case of some N-Logue kiosks in India – allow ICT usage to focus on wants,
    the opposite tends to.


    Of there is a balance to be struck, but a less paternalistic view of project beneficiaries
    will be valuable in ICT4D 2.0, which is an understanding that fulfilment of wants
    – as already noted, we think of this in terms of Amartya Sen’s “development as
    freedom” – can be at least developmental.


    New Techniques: designing-reality gaps. Analysis of ICT4D 1.0 project failures
    also shows that a single underlying model can be used to explain failure: the
    design-reality gap model. This demonstrates that failures are associated with
    a large gap between design expectations and the actual realities of the project
    and its context. For problematic projects such large gaps are found on one or
    more of a set of dimensions, summarised by the ITPOSOS acronym and shown in Figure
    2.3.


    Drawing from the model, techniques to identify ICT4D project risks can be applied
    before, during and after the project. At all three times, the scores obtained
    can be used for risk identification. In the first two cases, they can also be
    used to predict likely project outcome, and to identify risk mitigation actions.'
