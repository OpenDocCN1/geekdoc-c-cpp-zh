- pgno: 188
  md: '# 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA – 187


    central repository for e-learning content for teachers and students and to provide
    incentives for content development.


    # Nepal


    The Nepal IT Policy 2000 highlights the need to have “computer education for all
    by 2010”. It proposes a phased introduction of ICTs as a subject at the secondary
    level. Nepal’s Open Learning Exchange (OLE) is a non-profit organisation dedicated
    to assisting the Government of Nepal in meeting its goals by developing accessible,
    open-source ICT-based educational teaching and learning materials. OLE has set
    a digital library, E-Pustakalaya, which includes all required curriculum textbooks
    in local language.


    # Box 7.1. Content and curriculum development: summary


    +   - Curriculum for ICTs as a subject is prescribed in almost all focus countries
    at the secondary level (India, Sri Lanka, Pakistan, Bhutan, Nepal, Bangladesh,
    Maldives and Afghanistan).

    - At the primary level, curriculum focuses on general ICT literacy and improving
    facility with technology.

    - Use ICTs as an instructional aid is emphasised in the policies of some countries
    (India, Pakistan, Bangladesh (2009) and Sri Lanka).

    - Strategies for content development are articulated in very few countries (India
    and Bhutan), though many do have specific initiatives (e.g. Shilpa Sayura in Sri
    Lanka).

    - Pakistan’s NICT is the only policy that clearly emphasises the need for overall
    curriculum reform in light of tools and pedagogical techniques made available
    through ICTs.


    Constraints in developing relevant content:


    +   - lack of IT professionals in the country;

    - lack of funding, infrastructure and resources;

    - lack of local content development initiatives;

    - no clearly defined standards for digital educational content;

    - no focus on digital content in traditional curriculum.


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
