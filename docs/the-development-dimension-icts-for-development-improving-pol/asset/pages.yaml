- pgno: 193
  md: '# 192 – 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA


    system software and, most importantly, connectivity. Trends on all these parameters
    show a mixed bag of results in terms of government success in ensuring effective
    infrastructure availability. While a relatively high standard of education and
    ICT infrastructure is available in countries like Maldives and Sri Lanka, their
    application and content development is slower than, say, India, which has patchy
    infrastructure but a rapidly ICT industry able to develop many new applications
    and content for education. Bhutan and Nepal face geographical and climatic challenges
    to providing basic infrastructure.


    In addition to geographical concerns, unstable political terrain in Afghanistan
    and Pakistan is an impediment to adequate infrastructure development. Bangladesh
    also has a poor track of infrastructure availability.


    Policy attentions for improving infrastructure have been made in almost all the
    focus countries, including policies for ICT, education, ICTs for education and
    infrastructure, depending on the country. The essential components of infrastructure
    are connectivity, hardware, software and enablers such as electricity, classrooms,
    etc.


    According to the India’s draft policy, ICT requirements for each school will be
    determined by their size and norms articulated by the state government. The draft
    policy envisages that all states will begin with appropriate, adequate, cost-effective-of-the-art
    ICTs and other enabling infrastructure in all secondary schools. This will include
    computer labs with adequate hardware and software, AV rooms with digital still
    and video cameras, music and audio devices, digital microscopes and telescopes,
    digital probes for investigation of various physical parameters, adequate hardware
    for EDUSAT terminals etc.


    Each school will have a LAN in place and dedicated broadband connectivity of at
    least 2 Mbps. In addition to Internet connectivity in the computer labs, connectivity
    will be provided to school libraries, teachers’ common rooms and school administrators
    offices. An EDUSAT network will be planned in each state with interactive terminals
    and receive-only terminals. At least 1000 terminals could be planned for each
    state.


    A joyous mix of software will be introduced at the secondary stage, comprising
    a range of software from the standard office to graphics and animation, desktop
    publishing, web designing, databases and programming tools. To enable cost effective
    software usage and development, free and open source software applications are
    preferred.


    India’s draft policy also emphasises the enabling infrastructure required to efficiently
    maintain ICT facilities will be defined, established


