- pgno: 141
  md: 'The United Nations Department of Economic and Social Affairs estimates in Africa
    there are 300 million reachable adults with no current access to formal financial
    services; a variety of mobile services are springing up to address their needs.
    Rather than true mobile banking, but with the aim of evolving toward full banking
    services in the future, most of these services offer a subset of banking known
    as ‘branchless banking’, ‘2G (second generation) banking’, ‘mobile payments’,
    ‘mobile money transfer’ or ‘mobile banking’ – the term used depends on the audience.
    For the purpose of this chart, the term “mobile banking” is used.


    # Figure 5.1: Mobile banking, current and potential services


    | Payments | Savings | Insurance | International Remittances | Credit | Bill Payments
    | SME Wages |

    | --- | --- | --- | --- | --- | --- | --- |


    | Mobile Banking |

    | Agents | Branches ATM, POS |


    Source: Consult Hyperion.


    Financial services delivered through the mobile channel are, in essence, no different
    than those delivered through conventional banking channels and agent channels
    emerging in a number of developing markets. However, as the mobile channel can
    reach a mass market beyond conventional banking networks, financial services offered
    across mobile will be optimised to serve that market: microfinance rather than
    traditional banking credit, and ad hoc bill payments (e.g. school fees) in addition
    to regular utility payments and low-cost saving products.


    Many of the mobile initiatives are partially – in some cases wholly – led by non-bank
    organisations traditionally outside the scope of financial regulation and with
    whom the financial regulator has had little or no contact. This has naturally
    led to concern amongst regulators, and for better or worse, threatens to disrupt
    the regulation of the financial sector in many of the countries concerned.'
