- pgno: 130
  md: '# 4. WHAT ROLE SHOULD GOVERNMENTS PLAY IN BROADBAND DEVELOPMENT? – 129


    # Ensuring equitable access for all


    In broad terms, the second major role of governments in the provision of broadband
    is ensuring equitable access for all. This focuses on equity counterbalances the
    emphasis on efficiency just outlined. Most governments have taken a pro-active
    approach to stimulating rollout in rural and other underserved areas. This was
    traditionally done through internal cross-subsidisation by the state-owned monopoly
    operator. Following market liberalisation, this approach has been replaced by
    explicit subsidy mechanisms as Universal Service Funds.


    As an example, between 1998 and 2000, Canada achieved the world''s highest broadband
    penetration levels despite very low population density. The problem of providing
    service in rural and remote Canada was studied by the Independent Telecommunications
    Review Panel, which in an annex to their 2006 report, argued that the government
    should set a goal of providing affordable and reliable broadband services in all
    regions of the country by 2010. The panel mapped the availability of broadband
    and estimated that just under 90% of Canadians could access it by 2007, leaving
    around 3 million people without it. For the approximately 300000 of those living
    in the most remote communities, satellite would be the most practical solution.
    Areas with fewer than 1200 people within a 5km radius from a broadband point of
    presence were found to be unconomic to serve; this was further aided by terrain.
    WiMAX could reduce the number that could not be served economically by 1.2 million,
    but for the remaining 1.5 million (plus the 300 000 to be served only by satellite)
    some form of targeted cost-subsidy would be necessary to achieve the goal of universal
    broadband service by 2010.


    One of the most high-profile initiatives is a scheme to provide broadband to Canadians
    in the far North, in Nunavut and Northern Territories. The Nunavut Broadband Development
    Corporation has been established as a not-for-profit, federally registered corporation
    with multistholder membership whose goal is to bring broadband to 25 underserved
    communities. Under a five-year plan signed in January 2009 (as part of Canada’s
    economic stimulus programme), matching funds from Infrastructure Canada and local
    customers will raise some CAD 43.2 million to bring broadband by satellite to
    the region.


    Providing broadband in rural areas poses significant economic and technical challenges.
    Costs in areas of low population density are high and, unlike other ICTs, the
    provision of broadband (e.g. digital subscriber line technologies) has technical
    constraints which speeds diminish as distance from a central location. The rapid
    growth of the broadband market has therefore focused primarily on urban centres,'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 130 – 4. WHAT ROLE SHOULD GOVERNMENTS PLAY IN BROADBAND DEVELOPMENT?


    leaving the majority of people in rural areas underserved. As public and private
    services are increasingly provided online, the inability of some parts of the
    population to access broadband becomes a critical public policy problem. Once
    broadband usage reaches a critical mass (e.g. 25%) it will be considered indispensable
    if balanced development is to be achieved without discrimination based on geographical
    location.


    This has led governments to consider a more active approach to ensuring broadband
    is available throughout their territories. In Korea, the government adopted a
    comprehensive strategy which focused on providing financial incentives to operators
    to invest in their networks. In Europe, countries such as Sweden and France have
    used a mix of demand aggregation, public/private partnerships and USO approaches
    to ensure broadband coverage. A government plan in Norway subsidises the roll-out
    of broadband infrastructure in areas where none exists. The Norwegian government’s
    goal is to connect 99% of their population through fixed broadband coverage.


    Most recently, broadband investment has featured in fiscal stimulus plans around
    the world. Australia has committed around USD 33 billion, while the US administration
    has set aside USD 7.2 billion for rural broadband (Figure 4.8). Broadband is seen
    as providing a quick win in the these stimulus plans because on the supply side
    it stimulates investment and employment, while on the demand side it creates opportunities
    for entrepreneurship and spill-over effects that benefit the general economy.'
