    # Mitigating other environmental pressures


    Developing economies are often dependent on agriculture and fishing for both cash
    crops and subsistence; water can be a more pressing issue than energy use in emerging
    and developing economies. Deforestation can be a major concern in some regions.
    Hence, mapping, monitoring and managing lands, forests and waterways are crucial
    to the efficiency and sustainability of key sectors. Geographic Information Systems
    provide major opportunities in Egypt and land waterway monitoring and management
    in Egypt (IISD 2005), Africa and South East Asia and the Himalayan region (IISD
    2009). As elsewhere, information is the key to enabling people to make more sustainable
    choices and realise benefits from their actions, as well as for education, awareness
    and support.


    Observational data are increasingly available to users around the world through
    a range of portals and systems allowing for observation and prediction. Examples
    include the Earth Observation Portal¹ and Climate Change Prediction Net², while
    conservation is the focus of the Society for Conservation''s portal³. There is
    a growing tendency to make geo-spatial environmental information more readily
    available through the use of common interfaces such as Google Earth and Microsoft
    Virtual Earth. This enables information holders to make geo-specific information
    available to users through a standard web interface at low cost. Examples include
    The Tropical Ecology Assessment and Monitoring Network,⁴ Climate Change in our
