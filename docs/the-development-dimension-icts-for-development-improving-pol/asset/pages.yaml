- pgno: 52
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 51


    # Box 2.10. Jugaad – Poverty is the method of invention


    As well as asking what and how to innovate, we could also ask: “why innovate?”
    For those working in and with poor communities the answer is: because you have
    to. Technologies from the “outside world” fail to work at all, fail to work properly,
    and break. The North Indian concept of jugaad – the improvised quick-fix to get
    or keep technology working within an environment of relative poverty and resource
    constraints.


    Although remedy may be localised, we can see jugaad in poor communities worldwide:
    minor innovations conducted within an environment of constraints. And that can
    lead one step further, taking up the observation that resource poverty may be
    more of a spur to innovation resource abundance.


    We thus arrive at the notion for ICT4D 2.0 of constraint-driven innovation – what
    Prahlad pictures as innovation within a sandbox of constraining walls that delivers
    specialised solutions which match the available resources in a way that “mainstream”
    innovations fail to do. They are lower in price, lower in capital intensity, lower
    in skill intensity, make greater use of local materials and are more adaptable
    to sporadic availability. In sum, they close the “design-reality gaps” that other
    innovations suffer, and demonstrate that poverty can drive innovation.


    # ICT4D 2.0’s new implementation models


    The two previous sections have focused mainly on the technologies of ICT4D 2.0:
    the main platforms, the applications and the ways in which these will be innovative.
    We now look at how these new technologies will be put into action, focusing on
    various aspects of the way in which ICT4D will be implemented.


    # Funding ICT4D 2.0


    ICT4D 1.0 was driven by money from a relatively small number of international
    development agencies. ICT4D 2.0 looks to be funded by a much more eclectic range
    of sources.


    Private sector. Private firms are increasingly investing in ICT4D for reasons
    which appear to be the rather murky interface between CSR (corporate social responsibility)
    and BOP (seeing the poor as bottom of the pyramid). The investments of multinationals
    like Cisco, Hewlett-Packard, Intel and Microsoft in shifting kit into poor communities
    are well known. A bit less recognised are the growing developmental investments
    of IT firms from the South like Datacom and Wipro. There are also'
