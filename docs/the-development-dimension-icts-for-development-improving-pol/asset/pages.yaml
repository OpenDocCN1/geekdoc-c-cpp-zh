    60% of the population do not have a laptop.


    # The role of the donor community


    The donor community can play a role in helping develop broadband strategies and
    develop their broadband services. By sharing information, benchmarking, providing
    technical assistance and support in regulation, international organisations can
    help governments improve the functioning of markets, stimulate investment and
    learn from the experiences of other countries. In this context, it is important
    to establish a baseline of broadband indicators for international comparisons.
    The OECD has set the place in this area with its broadband indicators portal (www.oecd.org/sti/ict/broadband),
    but there is a need to expand this coverage to the developing world, especially
    for comparisons of prices and service offers.


    The World Bank can help, for instance in providing financing for strategic investments
    to support the development of key parts of the infrastructure. International submarine
    cables, cross-border connectivity and high-capacity backbone networks are all
    examples of areas in which World Bank investments can play a catalytic role, crowding-in
    private sector investment and improving service delivery. The World Bank currently
    supports governments in overcoming key infrastructure bottlenecks through public/private
    partnerships such as the EASY cable along the East coast of Africa and the RCIP
    programme throughout Eastern and Southern Africa.


    Broadband is an area of growth in the project portfolio of both public and private
    sector investment projects. The more than USD 1 billion currently committed to
    ICT investment projects has been a catalyst in raising some USD 7 billion in investment
    capital. The World Bank is'
