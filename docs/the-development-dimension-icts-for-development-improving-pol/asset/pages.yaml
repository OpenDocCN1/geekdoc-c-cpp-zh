- pgno: 67
  md: '# 66 – 2. WHERE NEXT FOR ICTs? AND INTERNATIONAL DEVELOPMENT?


    +   - Availability: how can we roll-out ICTs to the poor to help them

    become users?

    - Uptake: in what ways can we implement and apply ICT to make it

    useful?

    - Impact: how can we use ICTs to make the greatest developmental

    impact?


    # Figure 2.7: Changing ICT4D issues over time


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_67_0.png)


    Source: Richard Heeks.


    Of course, readiness and availability and uptake issues will remain

    relevant for at least a generation; indeed forever as new waves of technology

    emerge. And they present ongoing needs for innovation in infrastructure,

    hard and software. While mobiles are already a reality, and Internet-

    connected PCs are a growing possibility, particularly for the urban and peri-

    urban poor. Where ICT4D 1.0 was about getting the foundations in place,

    and proof of concept such as piloting largely supply-based uptake, ICT4D

    2.0 can turn part of its attention elsewhere.


    It can thinking solely about pilots, and can instead think more about

    sustainability, scalability and impact. It can stop thinking from a mono-

    disciplinary perspective, and can instead think more from a tri-disciplinary

    perspective that combines computer science, information systems and


    ICT FOR DEVELOPMENT: IMPROVING POLICY COHERENCE – OECD 2009'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'development studies. And it can stop thinking solely about ‘needs’ – often
    defined from outside poor communities in rather paternalistic terms. Instead,
    it can also think about “wants” – what is it that the poor themselves actually
    demand? How do and would poor communities use digital technologies if left to
    their own devices?


    In conclusion and above above all, we can see that ICT4D 2.0 is about reframing
    the poor. Where ICT4D 1.0 marginalised them, allowing a supply-driven focus, ICT4D
    2.0 centralises them, creating a demand-driven focus. Where ICT4D 1.0 – fortified
    by the bottom of the pyramid concept – characterised largely as passive consumers,
    ICT4D 2.0 sees the poor as active producers and active innovators.


    Three overarching questions for this next phase therefore emerge. How can the
    poor be producers of digital content and services? How can they create new incomes
    and job through ICTs? And how can we recognise and scale the ICT-based innovations
    they produce?'
