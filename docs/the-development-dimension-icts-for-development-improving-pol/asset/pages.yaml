- pgno: 30
  md: '# Chapter 2


    # Where Next for ICTs and International Development?


    By Richard Heeks¹


    > There are problems with the coherence of Information and Communication for Development
    (ICT4D) policies today. This chapter identifies some of those problems and proposes,
    if not solutions, at least a shape or framework for moving forward. It then charts
    the logic and chronology of applying ICTs to developing countries.


    ¹ Prof. Richard Heeks is Director of the Centre for Development Informatics, University
    of Manchester, UK. www.manchester.ac.uk/cdi.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 30 – 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    # Overall policy coherence challenges


    The constant novelty and innovation of digital technology brings a constant stream
    of policy challenges. For example, Manchester’s Centre for Development Informatics
    has been studying barriers to diffusion of “m-finance”; i.e. the use of mobile
    phones to help bring financial transactions and services to the poorest communities
    (Duncombe 2009).


    An immediate policy barrier arises due to sectoral convergence. When mobile phones
    become mobile wallets, information and communication technology (ICT) policy crashes
    into financial policy. Some countries lack a helicopter view of multiple policies
    – the kind necessary to see the bigger picture of their impact on development.
    For instance financial regulations may allow only banks to undertake formal financial
    transactions, yet banks are currently among the least-trusted of financial institutions.
    Furthermore, such regulations restrict competition – keeping mobile operators
    and thirdparty innovators out of the market, restricting the spread of m-finance,
    and thus damaging development.


    Some countries, by contrast, lack a grassroots view of policy – they do not understand
    the roadblocks that individuals within poor communities face when trying to make
    use of ICTs. Taking the example of m-finance, three key barriers prevent the poor
    from making use of services even when available: affordability, lack of financial
    literacy, and lack of trusted intermediaries. To address these would, again, require
    coherence across a set of policy areas including taxation, telecommunications
    policy, education, and financial regulation.


    The OECD/infoDev Policy Coherence in the Application of Information and Communication
    Technologies for Development workshop focused on the need for coherence around
    particular applications of ICTs, such as the m-banking example. But there are
    more generic Information and Technology for Development (ICT4D) policy coherence
    challenges, which can be grouped into four questions.


    # Question 1: Is coherence in ICT4D policy between the global North and the global
    South?


    Of course, some commentators would argue that there is complete coherence: rich
    nations’ policies benefit rich nations, and policies forced onto poor nations
    also benefit rich nations. The current struggles in World Trade Organization negotiations
    suggest that things are not quite so simple these days, as some of the nations
    in the global South become more'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT – 31


    economically and politically powerful. Nonetheless, the question of who benefits
    from ICT4D policies – the global North, the global South, particular stakeholders?
    – is still asking.


    # Question 2: Is there coherence – balance – in policy amongst the various parts
    of the ICT-for-development value chain?


    In simple terms, the ICT4D value chain traces the transformation of technological
    inputs into development outputs (Figure 2.1). In more detail, it is divided into
    four focal areas:


    +   - Readiness: countries require a set of precursor systems as legal foundations
    and human and technological infrastructures. Through strategic actions – including
    policy – these become specific programme and project inputs such as money and
    technology, and softer inputs as motivation and political support.


    +   - Availability: inputs implemented into a set of programme-specific deliverables;
    intermediate items as a telecentre or mobile phone system.


    +   - Uptake: the actual adoption and use of digital technology, including questions
    of the sustainability and scalability of particular ICT4D programmes.


    +   - Impact: the familiar threes of outputs, outcomes and development impacts;
    outputs the immediate behavioural changes that an ICT4D project causes; outcomes
    being the individual and community benefits that ensue; and development impacts
    being the extent to which ICTs help wider development goals to be achieved.


    How has the focus of ICT4D policy changed over time the value chain? For many
    years – and in some agencies, for some policies, today – attention has been given
    to the foundations. Only recently have policies begun extend themselves fully
    to look at what and how people use those foundations and, most important, what
    contribution the technology is making to development.


    ICT for development might lack coherence if they only focus on the early parts
    of the value chain. So when we analyse policy, we can ask – what is it covering?
    Is it only looking at the foundations – at issues of readiness and availability
    – or does it have the whole soup-to-nuts coherence that includes not laying down
    the railway tracks and buying the trains but also ensuring that someone uses them,
    and that the buying helps national development?'
  merge: -1
  img_proc: true
