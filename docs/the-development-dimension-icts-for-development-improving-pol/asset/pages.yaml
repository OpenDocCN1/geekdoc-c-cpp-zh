  md: '# 6. ICTs AND THE ENVIRONMENT IN DEVELOPING COUNTRIES: OPPORTUNITIES AND DEVELOPMENTS
    – 153


    impacts can come from dematerialisation and online delivery, transport and travel
    substitution, hasty of monitoring and management applications, greater energy
    efficiency in production and use, and product stewardship and recycling. Negative
    impacts can come from energy consumption and the materials used in the production
    and distribution of ICT equipment, energy consumption in direct use and cooling,
    short product life cycles and e-waste, and exploitative applications (e.g. remote
    sensing for unsustainable over-fishing (Daly 2003).


    The impacts of ICTs on the environment can be direct (energy consumption and e-waste),
    indirect (applications such as intelligent transport systems, and smart grids)
    or third-order and rebound (those enabled by the direct or indirect use of ICTs,
    as greater use of more energy efficient transport). Exactly what the impacts of
    ICTs are, and to what extent there may rebound effects (Box 1), are widely discussed
    topics. However, it is clear that attempts to measure the impacts of ICTs on the
    environment should take account of the potential rebound effects and the entire
    life cycle rather than simply the direct impacts of the product or application
    itself (Pplepsy 2002; Yi and Thomas 2007; Hilty 2008; etc.).


    Estimates of the direct impacts of ICT industries vary with the definition of
    the industry and coverage of ICT-related uses, but the production and use of ICT
    equipment is estimated to be equivalent to 1% to 3% of global CO2 emissions (including
    embedded energy) with a higher and growing share of electricity use. In 2006 it
    was estimated that ICT equipment (excluding broadcasting) contributed around 2%
    to 2.5% of worldwide greenhouse gas (GHG) emissions – of which 40% was reported
    to be due to the energy requirements of PCs and monitors, 23% to data centres,
    24% to fixed and mobile telecommunications and 6 to printers (Kumar and Mieritz
    2007). More recent life cycle assessments produce broadly results (Malmodin 2009).
    Data centres are a particular focus. Koomey (2007) estimated that worldwide electricity
    use for servers between 2000 and 2005 and suggested that consumption would increase
    by a further 40% by 2010.


    Nevertheless, the indirect impacts of ICTs are greater, and a number of studies
    have identified their potentially significant role in climate change mitigation.
    For example, The Climate Group (2008) identified key areas of enabling impacts
    that could potentially lead to global emissions reductions by 2020 five times
    that of the ICT sector’s direct footprint (Figure 6.3).


