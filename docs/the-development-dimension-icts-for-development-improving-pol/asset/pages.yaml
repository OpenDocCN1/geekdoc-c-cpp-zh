    able to determine the most profitable market to transport products to, circumventing
    middlemen who usually offer much lower prices and reducing the tendency to transport
    goods from market to search for buyers. Other initiatives include the use of geographical
    information systems in the Lake Victoria basin (Mungai 2005) and the Nile basin
    (Sobeih 2005) to support resource management and local development. These systems
    can be supplemented by location or eco-system specific information kits such as
    the Mekong and Nile River Awareness Kits. Integrated eco-system monitoring, sensing
    and modelling is also increasingly common (e.g. the Pearl River Delta (Chan 2009)).


    Noting the vulnerabilities of rural communities in Southeast Asia and the Himalayan
    regions, their dependence on ecosystems and pressures from unsustainable and over
    use, Tyler and Fajber (2009) highlighted the importance of access to information
    and a number of innovative projects. For example:


    +   - Indonesia, Bogor Agricultural University is working with farmers to use
    climate forecasts through climate field schools. When seasonal forecasts suggested
    a drier than normal crop season in 2006-07, farmers stored a larger proportion
    of their first rice crop in anticipation of higher prices due to dry conditions
    for the.

    - In the Philippines, the Manila Observatory (MO) has partnered with SMART, one
    of the country’s mobile phone service providers, for a pilot project providing
    telemetric rain gauges and phones in disaster areas. Local farmers read the rain
    gauges and phone the information to the Observatory, and the Observatory uses
    the phones to issue early storm warnings to farmers. Farmers can also use the
    phones to access market information.


    # Adaptation: managing the unavoidable


    Adaptation refers to actions designed to reduce the negative impacts of climate
    change that are already occurring. As the most vulnerable are at most risk, the
    developing world is where ICTs are likely to play an important role in climate
    change monitoring and adaptation (infoDev 2009).


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
