    # International co-operation


    Environmental issues are, by their nature, global, and while local action is required,
    international co-operation is essential. Key areas include: providing and operating
    infrastructure for monitoring and early warning; collecting, analysing and disseminating
    information necessary to ensure governments and other agencies to manage, mitigate
    and adapt to climate change; capacity building, transferring technology and the
    funding necessary to enable its use.


    # Technology transfer


    The Bali Action Plan included the commitment to help developing countries undertake
    nationally appropriate mitigation actions in the context of sustainable development
    without compromising growth, by transferring finance and technology from developed
    countries in a measurable, reportable and verifiable manner (World Bank 2008).
    While there are many examples of technology awareness and transfer activities,
    the transfer of technology and funding are among the most challenging and pressing
    issues.


    clear is a technology information clearinghouse operated by the UNFCCC expert
    group on technology transfer. It offers a web-based sharing platform for access
    to a variety of sources of information including case studies.27 The objective
    is to provide useful


