- pgno: 189
  md: '# 188 – 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA


    # Capacity building


    Human resource development is an important aspect of capacity building for integrating
    ICTs into education. Teachers, administrators and managers all need to be adequately
    equipped to maximise the potential of ICTs in improving training and learning
    practices.


    Policies in all of the focus countries include some sort of articulation for teacher
    training in ICTs. Training institutes are being equipped to provide this service.


    India''s Draft National Policy on ICT in School Education underscores the need
    to reform pre-service training curricula for teachers to include ICT courses.
    Furthermore, ICT competency will form part of the eligibility criteria for teacher
    appointments. Appropriate ICT infrastructure will be made available at all teacher
    training institutions. The draft policy recognises periodic in-service training
    comprising induction and refresher courses will be key to the widespread infusion
    of ICT-enabled practices in the school system. Training will cover initial sensitisation
    through operational skills and ICT-enabled subject training skills, after which
    teachers will be encouraged to join online professional groups and associations
    in order to keep abreast of latest developments, share and develop relevant content
    and engage with a larger community of experts.


    Recognising the significance of bringing school leaders and administrators on
    board to ensure optimum adoption and utilisation of ICT-enabled training and learning,
    it is proposed that all heads of schools will be given orientation in ICTs and
    ICT-enabled education training programmes. Schools will be encouraged to automate
    their processes in administration, management and monitoring of systems. To this
    end, school leaders will be provided adequate training in order to be able to
    contribute to the successful development and implementation of a School Education
    Management Information System (SEMIS).


    Quite often, government personnel working in education departments at various
    levels – national, state and district – not have adequate knowledge of ICTs. India''s
    draft national policy states that training will be provided to government personnel
    in order to encourage them to use ICTs in day-to-day activities. Specific training
    would also be provided on any management information system for schools and general
    maintenance and upkeep of ICT infrastructure.


    In Pakistan, the NICT places great emphasis on using ICTs to strengthen teachers''
    professional development and educational management. The strategy highlights the
    need to maximise opportunities for professional development through different
    ICT media such as IRI, television, ODL and'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA – 189


    online resources. This will prove particularly useful in geographically remote
    areas and where face-to-face interaction for professional development is difficult
    and not cost-effective. Teachers will learn ICT skills as well as how to teach
    ICTs as a subject and integrate it within the curriculum, such that ICT training
    is not merely about skill development but enabling new instructional methodologies
    (e.g. project oriented, and collaborative learning). The policy recognises that
    while skill training in ICT is essential, ICTs as a separate subject should not
    be the focus. It is more important for teachers to know how to teach with ICTs
    than how to use ICTs, and such instruction should be integrated within basic courses
    at teacher training colleges.


    The NCT highlights the importance of making the correct technology available to
    teachers based on their assessed needs. It also suggests exploring internationally-available
    standards, such as those provided by the International Society for Technology
    in Education (ISTE), and adapting them for teacher training in local conditions.


    The policy further highlights the need to provide adequate resources to teachers
    through various platforms to enable them to develop their own teaching materials.
    A national education portal is envisaged to enable teachers to communicate with
    each other, learn from each other''s experiences and have access to subject matter
    specialists to improve their own understanding. Training of administrators and
    education managers should be part of a planned programme to make school environments
    conducive to maximum use of ICTs.


    In Sri Lanka the NAPITSE articulates the need to provide training and education
    to all teachers in government schools to make them competent in using ICTs for
    teaching purposes. It also reiterates the need to introduce ICTs into- and in-service
    teacher development and training programmes to create opportunities for system-wide
    professional development of teachers. The policy envisages training for government
    officers managing education systems and encourages use of school-based ICT resources
    by the out-of-school population to provide general ICT literacy for the community.
    The Intel Tech programme is aimed at enabling teachers to better exploit the full
    education potential of the technology age. Response from education administrators,
    principals, and teachers has been exceptionally encouraging; over 7500 teachers
    have already been trained.


    The National ICT Policy 2009 in Bangladesh identifies the shortage of trained
    and qualified teachers and therefore proposes to leverage ICT tools to provide
    effective teacher training programmes and mitigate the shortage of quality teachers.
    The policy underscores the need to incentivise acquiring ICT skills for teachers
    and strengthen all primary and secondary'
