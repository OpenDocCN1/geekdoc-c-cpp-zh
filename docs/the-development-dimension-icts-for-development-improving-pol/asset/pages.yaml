    # Conclusion


    Many millions of poor people are engaging in Internet-based activities such as
    information retrieval, payments and remote computing using relatively simple mobile
    handsets. A new budget telecom network business model has enabled gains in voice
    connectivity as well as the beginnings of more-than-voice applications over mobiles.
    Widespread broadband access among the poor is likely to be achieved by extending
    this model. It could also serve as the basis of coherent and efficacious policy
    and regulatory responses that would serve connectivity goals.


    This chapter demonstrates that voice connectivity was achieved for a majority
    of the world’s people, including substantial numbers of the poor, because governments
    removed or lowered barriers to participation in the supply of telecom services
    and created conditions conducive to competition.


    Where enough suppliers existed, intense competition, the critical step in implementing
    the budget telecom network model, occurred. The resultant, radically lower prices
    attracted more minutes of use, which in turn made further reductions possible.
    Operators were able to load their networks'
