  md: '# 186 – 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA


    language barrier is another feat. The DIT, the National Library and the Institute
    of Language and Cultural Studies are collaborating to establish the National Digital
    Library of Bhutan (NDLB), which aims to present aspects of Bhutanese life, traditions
    and culture and provide resources for scholars.


    The other countries focus, Afghanistan, Maldives, Bangladesh and Nepal, while
    stressing the importance of locally relevant content, do not have separately articulated
    strategies for developing it. Instead they are focused on creating qualified ICT
    professionals in order to boost their local ICT industries, which will in turn
    create local capacity for content development. In addition, ongoing initiatives
    focus on creating locally relevant content in local languages.


    # Afghanistan


    Afghanistan''s ICT Policy highlights the need to promote effective ICT training
    courses at the secondary and tertiary levels. It focuses on creating curricula
    and developing material for teacher training and trainers. Content development
    capacity in Afghanistan is still being developed, with a focus on training faculty,
    IT professionals and supporting the general ICT industry. International content
    may be accessed through distance education centres. Partnerships for content development
    are also encouraged; for example, the Ministry of Education, with assistance from
    The Asia Foundation, has undertaken digitalisation of science subjects for grades
    10-12 in the form of DVDs.


    # Maldives


    In Maldives, the Ministry of Planning and National Development’s Seventh National
    Development Plan is dedicated entirely to expanding current ICT levels. It highlights
    the need to provide access to computers for all students, at the secondary level,
    and to develop a national curriculum for primary and secondary education focusing
    on ICT skills and usage including the Internet.


    # Bangladesh


    Likewise, the Bangladesh National ICT Policy 2009 stresses the need to produce
    more trained ICT professionals through improvement of curriculum of ICTs as a
    subject. The policy has strategic focus areas for use of ICTs in education and
    research from primary to tertiary levels. Content development is highlighted as
    important, including the need to create a


