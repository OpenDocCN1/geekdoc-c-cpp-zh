    particular cheap and reliable leased lines. In this mode workers do not have to
    separate themselves from families for long periods and the money they and the
    firms they employ generate circulates in the local economy, creating further wealth.
    Workplaces and worker movements create pressure on infrastructure, but the long-term
    result is generally the building of adequate infrastructure that benefits more
    than the service export companies.


    More than developing service industries serving the domestic market, ICT-enabled
    industries that export their services create wealth and pull more people out of
    poverty. Of course, the modern business practices that allow for differentiation
    of functions and the outsourcing of non-core activities will eventually seep into
    the domestic economy as well, creating conditions for inshoring as opposed to
    offshoring or the export of services. This results in domestic firms becoming
    more efficient and/or customer responsive and jobs being created outside the major
    urban agglomerations.


    Offshoring and inshoring have been flourishing in Southern and West India since
    the 1990s. It is generally accepted that these regions make a disproportionate
    contribution to the Indian economic growth story. Unpacking the specific contributions
    of services trade made by ICTs and various other factors such as the demographic
    dividend is beyond the scope of this chapter. Suffice to say that the growth of
    the organised and export-oriented service industries made by ICTs has made a significant
    contribution to India''s recent economic growth and the resultant escape from
    poverty by large numbers of Indians, and that these lessons may be extrapolated
    to other countries.


    # Policy and regulation conducive to the Internet Economy


    The traditional conception of policy and regulation derives policy frameworks
    and regulatory instruments from public administration theory, with contributions
    from explicit or implicit theories of the state. In the case of developing countries,
    the state was as lacking certain elements or attributes – for example, adequate
    respect for sanctity of contract. After case, investors would be given promises
    and assurances, but once investments were in place and the investors'' negotiating
    power atrophied, assurances would disappear or outright or administrative expropriation
    would take place. Investment insurance was seen as a remedy, as was the creation
    of sector-specific regulatory agencies and regimes to govern specific industries,
    especially those in capital-intensive infrastructure that were especially vulnerable
    to administrative expropriation.'
