    Broadband is currently offered in prepaid form in South Asia. Interestingly, these
    offer come to mobile providers using HSPA/HSDPA rather than from fixed broadband
    (ADSL or WiMAX) operators. Questions related to “net neutrality” take on a different
    complexity in the mobile setting. By definition, one cannot provide identical
    experiences to those connecting fixed, nomadic or mobile networks.^7 Unlike with
    wired and wireless networks, access to broadband via mobile networks is not fixed.
    Variation in the numbers of users using a base transceiver station (BTS) and the
    associated network resources results in variable quality of service experience.
    Fixed networks may be dimensioned to accommodate fixed numbers of users for components
    of the access network (through contention ratios), but users of broadband services
    offered by mobile operators may be subject to rationing rules that are automatically
