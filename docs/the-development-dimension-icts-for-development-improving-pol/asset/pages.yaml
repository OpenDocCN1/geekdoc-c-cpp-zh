    # Interconnection


    In the early days of regulation, most experts agreed to name three top priorities
    answered “interconnection, interconnection and interconnection”. In the budget
    telecom network model, the highest priorities are market entry and spectrum management.


    Research on customer behaviour has shown that workarounds for imperfect interconnection
    have been devised. The incumbent fixed operator’s refusal to offer interconnection
    to mobile operators in Bangladesh and the failure of the regulator to compel interconnection
    did not prevent the people of that country from connecting to mobile networks
    at a CAGR of over 100% in 2002-07 and enjoying some of the lowest prices in the
    world. Furthermore, there is an increasing tendency for customers to carry multiple
    SIMs, switching them on the same handset or dual SIM handsets to keep track of
    their calls “on-net”, thereby benefiting from the various discounts offered for
    friends-and-family calling within networks. This suggests that conventional interconnection
    is being worked around, at least by those willing to suffer the additional inconvenience
    of multiple SIM


    This is not to say cost-based, non-discriminatory interconnection is irrelevant.
    It is, especially in terms of reducing the differences between on-net and off-net
    calls and the intended or unintended effects on illegal termination of international
    calls. Indeed, the oft-neglected issues of wholesale access to backhaul and essential
    facilities require even greater regulatory attention in light of the requirements
    of the budget telecom network model. As other input costs are driven down, backhaul
    costs become even more significant.


    # Regulation of anti-competitive practices


    This topic is the greatest importance in the GATS Protocol 4 Reference Paper.
    Yet, many policy frameworks contain lacunae in terms of enforcing prohibitions
    on anti-competitive practices and many regulatory instruments that deal with it
    are blunt and crude. In markets defined by the budget telecom network model, success
    rests on ever thinner margins of cost differentials. Therefore, the effects of
    anti-competitive practices such as cross-subsidies and tied sales become even
    more potent.


    As firms increasingly offer bouquets of services, in some cases including entertainment
    offerings, there is a need to ensure that cross subsidisation does not get out
    of control. The best control, of course, is to ensure that firms do not enjoy
    market power in any line of business. As retail prices continue to be driven down,
    the possibilities for anti-


