    # Box 6.1. Rebound effects?


    > There is concern that lower energy costs coming from efficiency gains may result
    in increased use, such that the potential emissions reductions are lost to "rebound
    effects". These can be direct (e.g. fuel efficient vehicle enabling longer trips
    at no additional cost), or indirect (e.g. fuel costs saved being spent on other
    energy-intensive activities such as a long distance air travel).


    In one of the most comprehensive reviews of the evidence on rebound effects, Sorrell
    (2007) noted, inter alia, that:


    +   Both direct and indirect effects appear to vary widely between technologies,
    sectors and income groups and cannot be quantified with much confidence. However,
    the evidence does not suggest that improvements in energy efficiency routinely
    lead to economy-wide rebound increases in energy consumption. At the same time,
    the evidence suggests that economy-wide rebound effects will be at least 10% and
    often higher.


    +   There are few studies of rebound effects from energy efficiency improvements
    in developing countries. Rebound effects may be expected to be larger in developing
    countries where demand for energy services is far from saturated.'
