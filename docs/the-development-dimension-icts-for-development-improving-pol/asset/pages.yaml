  md: '# 106 – 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET
    ECONOMY


    high volumes of revenue-yielding minutes because they succeeded in reducing the
    transaction costs of dealing with low-volume customers. Prepaid, which accommodates
    the needs of those with irregular earning patterns, was also a critical element
    because it allowed exploitation of longterm markets by reducing transaction costs.
    Along with these business innovations, the exponents of the budget telecom network
    model also succeeded in drastically reducing costs, effectively operating expenses.


    The new model makes ARPU irrelevant because what many revenue-yielding minutes
    are carried on a network, not how much money is earned from customers. In the
    same way that airlines such as Ryanair and Air Asia make profit while conventional
    carriers lose money, budget telecom networks make more money than conventional
    operators despite offering lower prices. However, the budget telecom network model
    does increase the volatility of earnings and results in lower quality of service.


    The extension of the budget telecom network model to broadband requires that small,
    prepaid irregular payments be allowed, which is a significant deviation from dominant
    always-all-can-eat models. It appears that the former is already emerging in mobile-based
    broadband offerings such as HSPA. Of course, there is more content that is desirable
    to low-income consumers.


    Accessing the Internet over mobile networks, whether from fixed locations, nomadically
    or actually mobile, will become a major, if not the dominant, mode. This fits
    with the present trend where many Internet functions, such as communication, information
    retrieval and remote computing, are increasingly accessed over mobile networks
    through relatively modest and inexpensive mobile handsets. There is evidence that
    more-than-value applications that foreshadow participation in the Internet Economy
    are beginning to gain ground among the poor, especially the younger generation.
    It may expected that these uses will increase as the business model is refined
    and more services are offered.


    If process innovations by competition are solving the challenge of electronically
    connecting billions of poor people, what is the role of government? When a business
    model, rather than direct government action, is delivering the goods, the most
    appropriate government action is that which supports the business model. Policy
    and regulatory actions must be derived more from analysis of the business model
    and less from public administration theory. Early in the present form the cycle
    needs to adopt policy and regulatory solutions that fit the specific institutional
    circumstances was identified – yet in actual practice, policy and regulatory


