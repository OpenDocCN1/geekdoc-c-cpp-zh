  md: '# Principal technical issues


    There are one or two technical issues branchless banking solutions that impinge
    on their regulation. They revolve around security and concern the mobile handset''s
    SIM and end-to-end encryption, essential for bank-grade security of transactions.


    As technology stands today, there is only one way of providing end-to-end encryption
    for branchless banking: using the SIM. As SIMs are under the control of the mobile
    operator, this effectively means that only a mobile operator-led scheme can offer
    full security. There are two means of resolving this situation:


    +   Relaxation of SIM controls. It has been argued that the SIM will, at some
    point in the relatively near future, achieve the status of a public utility. This
    would imply that complete control of the SIM should be taken away from mobile
    operators and some portion of its capabilities made available, through mobile
    operators, to third parties.


    +   Relaxation of security. Without access to the SIM, comprehensive security
    is not possible – but it is unacceptable that mobile operators should be the soleveyors
    of branchless banking solutions. Perhaps the lower security of SIM-less schemes
    should be accepted, subject to suitable controls as a maximum number of customers,
    a smaller maximum transaction size and enhanced server-based controls.


    These are not purely technical issues. They demonstrate the intricate connections
    between issues of public policy and technical minutiae, and that neither should
    be fixed without consideration for the other.


    # Principal regulatory issues


    The principal issues around branchless banking and its regulation can be summarised
    as:


    +   Risk of a high-profile failure. If a high-profile scheme were to fail, the
    reputation of all branchless banking schemes would inevitably be sullied and the
    sector could be set back by years.


    +   Non-bank institutions leading schemes. Provided a scheme can demonstrate regulator-suitable
    visibility and necessary levers, why must it be bank-led? After all, one trusts
    a mobile operator not to lend their money to an unidentified third party – the
    same cannot'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 5. REGULATORY ISSUES AROUND MOBILE BANKING – 147


    necessarily be said of banks. What’s more, a mobile operator can offer geographical
    traceability of transactions that a bank never could. A customer sends money over
    his or her phone, so the mobile operator knows exactly to whom it was sent and
    where and when it was received.


    +   - Suitability of KYC regulation. KYC requirements are undoubtedly holding
    back the branchless banking sector. While they are, in some form, absolutely necessary,
    consideration should be given to whether their current application is appropriate.
    For example, should someone sending USD 20 per week to relatives up-country be
    subjected to the same KYC checks as someone who wants to send USD 10? Perhaps
    a more limited form of KYC could be applied to the poorest customers, up to a
    certain transaction threshold, at which point full KYC would apply. It is difficult
    to imagine how a relaxation of regulation in this type of security would increase
    the risk of terrorist attacks.


    Regulators in general, and the AFI in particular, need to give consideration to
    these issues. They also need to be convinced that branchless banking schemes are
    trustworthy, i.e.:


    +   - that the appropriate reporting channels are in place and that the regulator
    will have access to the necessary levers;

    - that a scheme is fully auditable, with KYC/AML controls in place;

    - that a scheme is properly secure and presents little risk to customers.


    With regard to this final point, there is a clear market opportunity for one or
    more large insurance organisations, though concerns they might have about entering
    such a nascent market are understandable. Hopefully a means of addressing this
