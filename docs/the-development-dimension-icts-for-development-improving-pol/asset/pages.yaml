  md: 'competitive vertical price squeezes grow. The success of the budget telecom
    network model rests on price flexibility as well as protection from tactics such
    as vertical price squeezes.


    # Tariff regulation


    Old-style tariff regulation is inappropriate for the effective deployment of the
    budget telecom network model. In any case, price or revenue regulation is difficult
    to apply when each firm offers bundles of services in tens or not hours. In practice,
    what is done is de facto forbearance, where all tariffs are more or less routinely
    approved or, at most, asymmetrical regulation, wherein only the SMP (significant
    market power) operator’s tariffs are regulated. The weakness in this course of
    action is that SMP determinations and the resultant regulatory actions are extraordinarily
    complex and most developing country regulatory agencies are incapable of implementing
    them. The end result can be regulatory paralysis, to the unintended benefit of
    incumbent operators.


    Banded forbearance, where a country will choose to be benchmarked against prices
    of peer countries, is a possible solution. Here, flexibility is granted to all
    operators, including the incumbent, within a defined set by benchmarking. If prices
    go below the lower threshold they will trigger a review based on stated competition-related
    criteria. The thresholds will be periodically readjusted based on external factors
    such as taxes or price movements in peer countries.


    # Quality-of-service regulation


    In the same way that one cannot expect silver service on RyanAir, one cannot expect
    premium service from budget telecom networks. All operators are likely to offer
    sub-optimal quality because of the need to squeeze much traffic. Strict and aggressive
    QOS regulation is inimical to the model. However, it is also naive to expect competition
    to prevent operators from letting QoS fall to unacceptable levels. Therefore,
    gentle supervision of QOS, focusing primarily on publishing performance against
    benchmarks and ensuring that barriers to unhappy customers switching suppliers
    are kept low, would be the most appropriate.


    # Universal service


    The idea of making universal service obligations transparent by replacing vague
    commitments to extend services to the un- and underserved through cross subsidies
    with universal service funds was a good idea in'
