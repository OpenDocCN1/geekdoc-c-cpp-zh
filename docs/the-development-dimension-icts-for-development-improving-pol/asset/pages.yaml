    elections. From here forward it means further functionality such as “banking the
    unbanked”: using mobiles to deliver financial and banking services to those currently
    excluded from the mainstream.


    # Box 2.7. Beyond the MDGs to ICTs for resilient development


    Three major issues that have worked their way up the development agenda in the
    years since the start of ICT4D 1.0 are:


    +   * Security, including terrorism.

    * Economic growth, including its variability and fragility as demonstrated by
    the post-credit-crunch recession and slow recovery.

    * Environmental sustainability, particularly climate change.


    In the medium term of ICT4D 2.0, climate change may well form the largest item
    on the development agenda. But all three issues can be grouped together the notion
    of “resilient development”, and they drive some questions for the next phase of
    ICT4D 2.0.


    +   * How ICTs ensure development that is resilient in the face of threats such
    as insecurity, economic fluctuation, and climate change?

    * How ICTs provide development that is sustainable?


    ICTs will form a key part of development agenda beyond doubt. For example, ICTs
    have been central to both the organisation of terrorism and counter-terrorism;
    ICT-based enterprise and use of ICTs in enterprise is now a keystone for economic
    growth and recovery; ICTs are an integral part of “greener” technologies (though
    also the growing issue of e-waste), of mapping climate change, and in assisting
    communities adapting to climate change.'
