    Southern governments. Previously – and still somewhat – reliant on donor funding
    in this area, some in the South are starting to invest their own funds in ICT4D,
    drawn by the push of community demand and the pull of perceived benefits.


    New 21st century is seeing a new wave of Southern donors emerging. Countries such
    as China, India and South Korea are now active in development aid and – given
    their own economies and expertise – have been particularly keen on funding ICT4D,
    arguably more than so Northern donors.


    Revived old donors. Funding for ICT4D from Northern and international (i.e. Northern-dominated
    donors has followed a dot.com-like cycle. It rallied up massively from the late
    1990s, fell away after the 2005 Tunis World Summit on the Information Society,
    and showed signs of reviving from 2008, for example, the UK’s Department for International
    Development placing ICTs back into its agenda and the World Bank doubling its
    funding for African ICT initiatives.


    As new enter, there are signs that they are repeating the mistakes of the past.
    A key task for ICT4D’s second phase will be finding ways to incentivize and facilitate
    learning by new entrants.


    This is vital in a broader sense because of the large sums spent. Development
    agencies like the World Bank, the US Agency for International Development, Japan’s
    International Cooperation Agency, etc. spend at least USD 2 billion per year on
    ICTs for developing countries. Private sector investments in ICTs and developing
    countries – not least the mobile infrastructure – are far larger; for example,
    USD 10 billion per year in Africa on mobile. And the overall figures are far higher
    still. In 2007, for example, low- and middle-income countries spent around 6%
    of GDP on ICTs, totalling more than USD 800 billion.


    # Implementing ICT4D 2.0


    New Actors. ICT4D 1.0 was largely implemented by international or national NGOs.
    They will continue to play a key role in ICT4D 2.0, but seem to be joined by:


    Private firms. As ICT4D investment and infrastructure growth, more commercial
    implementers are entering the fray to stand alongside the typical donor-funded
    consultants. In addition to firms already mentioned would be firms like Fundamento
    in South Africa and Globe in the Philippines, which'
