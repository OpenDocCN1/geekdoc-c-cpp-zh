    diversion to be costless. Aker (2009), in a subsequent study of grain trade in
    Niger, factored in transport costs and arrived at similar conclusions.


    In the same way it took the best economists and statisticians working with high-quality
    data more than a decade to establish the contribution of ICTs to productivity
    in the US economy, it will take substantial effort to make the case in the developing
    world.


    # ICTs and trade in services


    The significance of access to telecom and the Internet for wealth generation may
    also be discussed in relation to making services tradable. There are four accepted
    modes of services trade, as set out in the General Agreement on Trade in Services
    (GATS):


    +   **Mode 1**, where the seller remains in Country A and the buyer remains in
    Country B and takes places. This is most like trade in goods.


    +   **Mode 2**, where the buyer travels to Country A, where the seller is. The
    trade occurs in Country A.


    +   **Mode 3**, where the seller in Country A establishes a non-natural person
    (a company) in Country B to supply services to customers in Country B. The trade
    may or may not involve the movement of natural persons from Country A to Country
    B.


    +   **Mode 4**, where natural persons from Country A travel to Country B to supply
    services to buyers in Country B. This may occur in conjunction with Mode 3 trade
    or independently.


    In many developing countries the principal mode of services trade is Mode 4, where
    skilled and unskilled workers travel to labour-deficit countries to sell their
    services and remit the earnings back. Beyond the social problems caused by family
    separations (particularly amongst the unskilled, when only the worker is permitted
    entry), economies do not get the spin-off benefits of large workplaces and wage
    earners within their territories. In addition, Mode 4 is generally not governed
    by rules and resisted by nationalists and protectionists to some extent, brings
    the large workplaces closer to the buyers of services, though this does not provide
    as many employment opportunities as Mode 4.


    Mode 1 has the greatest potential to alleviate the negative aspects of Mode 4.
    It allows firms and workers in Country A to sell services to buyers in Country
    B without physically moving there. Mode 1 is enabled by ICTs,'
