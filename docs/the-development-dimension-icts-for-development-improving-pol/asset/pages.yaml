    ECONOMY


    # Taxation


    Taxation was not included in the GATS Protocol 4 Reference Paper and until recently
    was routinely ignored in discussions of telecom policy and regulation. This is
    no longer possible because the taxation tail has begun to wag the regulatory dog.
    Certain policy or regulatory actions are understandable only when one posits taxation
    as the principal purpose and the provision of telecom services as the secondary
    purpose.


    Studies conducted by an industry lobbyist devote, the GSM Association, show that
    for every 100 units of currency spent on mobile service, as much as 44% is extracted
    as tax (including licence fees, spectrum fees, universal service obligations,
    equipment important levies, sales tax, etc.), with the operator acting as tax
    collector. This is obviously inimical to the efficacy of the budget telecom network
    model. Some taxes, such as those on handsets and SIMs, are regressive and constitute
    entry barriers to the poor. Kenya is an exception, recently reduced such taxes.


