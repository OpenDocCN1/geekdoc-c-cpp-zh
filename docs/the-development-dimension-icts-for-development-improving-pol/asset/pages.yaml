- pgno: 16
  md: '# I. WHY ICTs MATTER FOR DEVELOPMENT – 15


    Indeed, many developing economies are now leapfrogging OECD counterparts in SIM
    card ownership, and in the UAE being the first economy to exceed two SIM cards
    per citizen. In the broadband world, however, the traditional digital divide still
    holds true. This is reinforced by differences in the unit cost of broadband between
    developing and developed countries, with the latter being up to ten times more
    expensive.


    Mobile phones becoming increasingly affordable and accessible has assisted in
    the creation of new sources of income and employment as well as encouraging innovation
    at meeting local requirements. On the other hand, key infrastructures may not
    exist or are underutilised. More than half the world’s countries do not have an
    Internet Exchange Point (IXP) where local traffic can be exchanged and, as consequence,
    face relatively high charges for transiting this through the developed world.


    Internet Protocol (IP) addresses are critical to the development of the Internet,
    as all connected devices—including routers, computers, or IP phones—must have
    an IP address. Africa’s growing Internet usage is driving demand for IP addresses:
    the current ratio is only 0.36 Internet addresses per user, with only 3% of global
    IP addresses (compared with 10% of the world’s population). Within Africa, the
    disparities are even more marked, with almost two-thirds of IPv4 addresses having
    been allocated to South Africa for its important role in the early development
    of the Internet.


    # Figure 1.2: IPv4 address distribution in Africa


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_16_0.png)


    Source: workshop presentation by Adiel Akplogan, CEO, AfricNic and Chair, Number
    Resource Organization.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'IPv4 address exhaustion is likely to occur as early as 2011 globally, and 2013-2014
    in Africa, which will affect new users connecting to the Internet as well as businesses
    requiring IP addresses for their growth. To date, deployment of the newer version
    of the Internet protocol, IPv6, has been much slower than expected.


    Most African countries still rely on satellite connectivity and typically served
    by USD 2 000-500 per Mb per month for international bandwidth. The continent was
    traditionally served by two cables (SAT3 and SAFE), but they also charged high
    prices. Recently, two new cables serving the East African region have come online
    (SEACOM and TEAMS) and are soon to be joined by a third (EASSy). These will certainly
    have a beneficial effect on pricing, but other challenges – as the lack of interconnection,
    high operating costs and legal and regulatory barriers – are also factors.


    There are two basic models for exchange of Internet traffic: peering and transit.
    The former is much more beneficial for Internet service providers. The optimal
    solution, therefore, is to develop local Internet Exchange Points (IXPs). All
    that is required a switch, and infrastructure costs are relatively low. This keeps
    a higher percentage of traffic load and facilitates the provision of value-added
    services. For instance, Google traffic is peered locally, backhaul Internet costs
    are typically cut by around 40%. This also reduces average transmission delays
    from 1.2 seconds to less than 100 milliseconds. The ripple effect of this improved
    performance benefits other developmental applications.


    One solution for meeting the challenge of the developing world is the "budget
    network telecom model" presented in Chapter 3. Akin to low-cost airlines as EasyJet
    or RyanAir, this model has already been successful in driving the mobile success
    story and can now be applied to broadband. A key feature is reliance on pre-paid
    billing. In South Asia, the total cost of ownership of a mobile is typically below
    USD 5 per month, compared with average for developing economies of over USD 13.
    The budget network telecom model does not appear to have negatively impacted the
    profitability of local operators.


    # Broadband policy development


    The number of broadband subscribers around the globe, on either fixed or mobile
    connections, is likely to exceed 1 billion for the first time during 2009. This
    means that the vast majority of Internet users now enjoys at least four times
    faster than ordinary dial-up connections, making many new applications possible.
    But what are the implications for developing'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'countries? Why should governments go further than simply creating enabling
    regulatory environments and including broadband within their national economic
    stimulus packages? Answers to these questions may be found in Chapter 4.


    Although broadband cannot really be considered a public good, it is nevertheless
    the primary means of access to information, which has the characteristics of non-excludability
    and non-rivalry. Information, therefore, may be considered a public good.


    Recognising this, governments around the world are including broadband as part
    of national stimulus packages. OECD countries have committed almost USD 50 billion
    to future public sector investments, with the Australian government, having committed
    AUD 43 billion to a national broadband network, being the standout case.


    A useful tool for comparing broadband connectivity is the Nokia Siemens Networks’
    Connectivity Scorecard and Broadband Impact Study. The Study measures “useful
    connectivity” between “innovation-driven economies” (mainly developed) and “resource
    and efficiency-driven economies” (mainly developing).'
  merge: -1
  img_proc: true
