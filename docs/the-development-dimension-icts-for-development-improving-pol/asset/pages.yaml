- pgno: 42
  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 41


    Most likely, in dealing with the “remaining 5 billion” issue, ICTD 2.0 will simultaneously
    push along the PC and the mobile route. But some have asked whether the Internet
    should be the focus, or whether we should look at the poor have “voted with their
    wallets” and explore whether the simpler, cheaper technologies already in use
    can deliver ICT functionality? Rather than with handset and bandwidth upgrades
    to allow mobile Internet access, what can be achieved for development through
    calls and SMS? And what about older technologies? Access (as opposed to ownership
    or geographical coverage) figures are hard to come by, but we can estimate that
    something like 80% of the population in developing countries has access to a radio,
    and 50% to a television. Hence, early in ICT4D’s history, the reinterpretation
    of ICTs to incorporate radio and television.


    Hence, too, the role that convergence will play in ICT4D 2.0. In practice, this
    means looking at the technologies that already penetrate – mobiles, radios, televisions
    – seeking ways to add computing and Internet functionality. Pilot projects are
    already underway. Community radio stations answer to listener questions via e-mail
    and the Web and broadcast the response, as seen in Kothale in Sri Lanka. Telecentre
    databases allow farmers searches in the field with mobile phone, as seen in Warana
    in India. Many other hub-and-spoke innovations are likely to find a valuable application
    in future.


    # Box 2.4. ICT4D 2.0 and the rise of the individual


    There has been a central difference between the application of ICTs in industrialized
    and developing countries. In the global North the dominant ICT ownership and use
    model of the past decades has been the first household and then the individual.
    In the global South, contrast, the ownership and use model have been the community
    group.


    This model has inherited conceptually and practically within almost every ICT4D
    1.0 project. It helped ensure far greater reach-per-device than simple extrapolations
    of Northern suggest. The digital divide in the South has thus been overestimated,
    because shared access to ICT multiplies many times the basic technology ownership
    figures. This model has also been the source of broader benefits of some projects,
    which have helped to form or strengthen community groups. Such groups – often
    facilitated by an “infomiation” trained from within the local community –consider
    the implications of information received (e.g. about child health or agricultural
    improvements) or, latter, participate in creating their own digital content.'
