  md: '4. Environmental management and protection: involves everything related to
    managing and mitigating impacts on the environment as well as helping adapt to
    given environmental conditions. This includes resource and energy conservation
    and management systems, GHG emission management and reduction systems and controls,
    pollution control and management systems and related methodologies, including
    mitigating the ill effects of pollutants and man-made environmental hazards.


    5. Impact and mitigating effects of ICT utilisation: producing, using and disposing
    of ICTs require materials and energy and generate waste, including some toxic
    waste in the form of heavy metals. ICT can mitigate environmental impacts directly
    by increasing process efficiency and as a result of dematerialisation, and indirectly
    use on human activities, which in turn reduce the impact of humans on the environment.


    6. Environmental capacity building: efforts to improve environmental conditions
    rely on the actions of individuals and organisations. Capacity building includes
    efforts to increase public awareness of environmental issues and priorities, the
    development of professionals, and integrating environmental content into formal
