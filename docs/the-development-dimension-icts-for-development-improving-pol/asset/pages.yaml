- pgno: 20
  md: '# 1. WHY ICTS MATTER FOR DEVELOPMENT – 19


    The analysis permits a comparison with each country’s performance in GDP per capita.
    It shows, for instance, that Sweden and Ireland are doing much better than their
    GDP would suggest, while Greece and Spain are doing less well.


    Egypt''s relative success can be attributed to a public/private partnership between
    the policy-maker (MCIT), the regulator (NTRA), and the private sector. The main
    elements of the policy include an attempt to widen access to, and awareness of,
    ADSL services; rolling out Wi-Fi; a programme to extend the use of PCs in households
    and small businesses, the “free Internet” bundled into the price of dial-up minutes);
    and other initiatives such as PC clubs and the Egypt PC2010 project. Such initiatives
    have succeeded in reducing the price of broadband to the point where the average
    cost Mb per month is now around USD 24.


    Government investment in broadband as a part of stimulus packages should be balanced
    with policy objectives. Initiatives could include unbinding the local loop, making
    sufficient spectrum available and ensuring allments supported by government funds
    are accessible to competitors via open access. For example, Mexico’s government
    announced in May 2009 it will open up the national electric company’s network
    to competitive telecom service providers.


    Fixed-line fibre networks have a huge theoretical capacity (i.e. for instance,
    a single fibre strand could allow every single person in the world to hold a simultaneous
    conversation). But such networks are lacking in developing countries and therefore
    the focus is more likely to be on the provision of mobile broadband.


    # Mobile payments


    Several billion people in the developing world have limited or no access to any
    form of financial services. Increasingly, mobile phones are being used as a channel
    for money transfers or to buy and sell products and services. This is providing
    affordable financial services for the first time to many people with extremely
    limited means, while offering them greater security and efficiency than traditional
    alternatives.


    The pace of mobile payment development is uneven across different countries, perhaps
    reflecting the fact the disruption attends innovation is not always welcomed by
    all stakeholders and that lessons can be learned from countries with the most
    successful roll-out of services. At the same time, the convergence of communications
    and financial services'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 20 – 1. WHY ICTs MATTER FOR DEVELOPMENT


    has brought into play separate regulatory authorities whose practices need to
    be examined for overall coherence in meeting policy objectives.


    The development of the money transfer service M-PESA, initially deployed in Kenya,
    is described in Chapter 5. Though originally intended for remittances, the service
    has evolved to include new financial services such as micro-finance, micro-insurance,
    and school fee payment. The logical next step is to integrate public sector services
    into the system; however, regulatory positions are often too inconsistent or incoherent
    with no best practice.


    The difference in mobile phone coverage between OECD and developing countries
    is relatively small, but the gap in number of bank branches and especially cash
    machines is much wider. This provides the strongest case for m-banking. Generally
    speaking, where there are multiple money transfer operators (as in the US, Spain
    and UK) the average transaction cost (USD 6.6 per USD 200) is much lower than
    in countries where there are relatively few (such as Japan, France, Canada and
    the Netherlands), where the average transaction cost is USD 15.5 per USD 200.
    Mobile phone operators like M-PESA can reduce these transaction costs substantially.


    # Figure 1.4: Network coverage in selected regions (% of population)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_21_0.png)


    Source: Presentation by Laura Recuerdo Virto, Economist, Development Centre, OECD.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'In some developing countries the volume of remittances greatly exceeds the
    value of formal donor aid. Innovations such as M-PESA, which improve efficiency
    and reduce the margins of remittances, may have a marked beneficial effect. However,
    while m-banking opens up many new opportunities for development, it also creates
    scope for fraud. Thus there is a pressing need for policy coherence amongst ministries,
    regulators, donors and service providers.


    # Security considerations in ICTs for development


    The globally interrelated nature of the Internet means that policies and practices
    adopted in one country have the ability to affect the security and stability of
    network use in others. In this context, the development of a culture of security
    which benefits all users around the world, and the funding of expenditure necessary
    to sustain that environment, will be particularly challenging for the next billion
    Internet users.


    Before 2003 the majority of viruses came from developed countries, with the main
    motivation being a distorted sense of fun and fame. Today the biggest hotspots
    worldwide are Russia, China and Brazil, and the most common motivation is credit
    card scams, especially using loggers which are largely a thing of the past. Now
    the biggest hotspots worldwide are keystroke loggers which are almost invisible
    to the user. Another common form of hacking is to capture computers around the
    world as botnets to launch denial of service attacks, which are then used to force
    ransom payments from online shopping sites. In terms of securing developing countries,
    it is likely that the initiative will need to come from international co-operation.
    Ironically, one of the main forms of protection developing countries currently
    have is their slow connection speeds, which make their systems less attractive
    to hackers.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'ICT FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'balance between security and privacy concerns, especially in areas such as
    online shopping, smart grids and online searches.


    Security concerns are the same in both developed and developing countries. A number
    of tools are available to address them, but the problem lies in a lack of implementation
    and cross-border co-operation. The lack of awareness and interest amongst young
    people to follow ICT security as a possible career path is a particular lacuna,
    especially in developing countries.


    There is a role for capacity-building, as well as for striking an appropriate
    balance between security and privacy. The sequence of priorities should be prevention,
    followed by mitigation and then prosecution.


    # ICTs and the environment


    One of the key tasks facing all stakeholders is how to harness ICTs to improve
    environmental performance and mitigate climate across all sectors of the economy.
    This challenge is discussed in detail in Chapter 6.


    It has been estimated that ICTs account for 2-2.5% of global greenhouse emissions,
    with a forecast that these emissions will rise in future. On the other hand, ICTs
    have the potential to mitigate greenhouse gas emissions in other sectors by five
    times their direct polluting impact. There is also the question of “rebound effects”
    from energy efficiency improvements (e.g. cheaper and more widespread energy causing
    usage to go up). This phenomenon is not well studied in developing countries environments
    present.


    A broader issue is whether today’s developing countries follow a long-term development
    model similar to that of developed countries, from agriculture to manufacturing
    to services. Is it possible for developing countries to leapfrog directly to ICT-enabled
    services? Issues to consider include:


    +   - access to data;

    - understanding life-cycle impacts;

    - managing possible rebound effects;

    - technology transfer.


    An example of the impact of ICTs on the environment can be found in Hong Kong
    and the Pearl River Delta. The burgeoning growth of data centres in the region,
    each of which can consume the equivalent energy of a small town, has sparked green
    initiatives covering four main areas:'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'conservation, water treatment and conservation, green building materials and
    ensuring quality of life.


    Efforts at greening data centres include improving processing power while reducing
    power consumption, better server consolidation and a more eco-friendly approach.
    According to the US Environmental Protection Agency, it should be possible to
    improve power efficiency compared with the current technology curve by up to ten
    times in the next five years.


    In terms of developing new strategies, an appropriate approach is to reuse existing
    strategies and adapt them, for instance by using the Data Centre Code of Conduct.
    Many organisations have long-term contracts for ICT supply which may constrain
    opportunities for green innovation. Flexibility is required, as well as setting
    definite targets to be achieved. Product design is an important area to address,
    especially for reducing power requirements for cooling. Emphasis should be put
    on “pop-out” and “upgrade” technology. “Dirty ICT” products are becoming increasingly
    hard to process without waste disposal.


    “Green ICTs” have been defined as the intersection between environmental and efficiency
    goals within an enterprise. In other words, so much about greening processes the
    ICT sector alone, but using green initiatives to improve sector-wide goals. Typical
    applications for green ICTs are in power and logistics management. Although PCs
    are switched off, LANs are rarely active and their weekend power consumption is
    typically 95% of that on weekdays. Computer centre managers need to be educated
    to identify opportunities for power- and cost-saving.


    There is a tendency to overlook the very urgent need to address the ICT sector’s
    own greenhouse emissions in the enthusiasm to promote their potential to reduce
    emissions in other industries and improve environmental performance through applications
    across economies.


    # ICTs for education


    Greater use of ICTs in schools can help achieve development goals related to universal
    primary education and the elimination of gender inequality in education. However,
    doubts remain as the priority ICTs should be afforded relative to other educational
    needs.


    There has been a tendency to overs the benefits of ICTs for education; in reality,
    the evidence base is still sparse. The knowledge maps of ICT for education published
    by infoDev in 2005 were rather alarming in exposing how little is known to date
    and provable about direct benefits.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The results of regional studies commissioned by infoDev on ICTs for education
    in Africa (2008) and the Caribbean (2009) show their increasing use in different
    places at different speeds.


    In Africa, Ghana, Rwanda and Senegal might be considered as leading the way, while
    in post-conflict situations, like Liberia or Sudan, are lagging. As many as 48
    of the 53 African countries have policies in place, but in general civil society
    and the private sector are setting the pace. There is a lack of implementation
    capacity as well as infrastructure for both supply and ICTs. Gender equity is
    also lacking. Macro trends include public/private partnership, digital content
    development, open source software, regional initiatives, national research and
    educations networks, international connectivity and wireless networks.


    By contrast, the Caribbean forms a more cohesive region in terms of understanding
    trends. ICTs are perceived as a way of effecting change. The focus is on ICT skills
    development. There is a regional ICT exam and broadband is typically rolled out
    to schools without additional costs.


    The preliminary outcomes of the newest regional survey commissioned by infoDev
    covering India and South Asia are presented in Chapter 7. The eight countries
    of the region are at different stages of development, but it is nevertheless possible
    to generalise an ICTs for education (ICT4E) ecosystem and identifies aspects that
    need to be defined as a “policy plus” approach.


    The OECD’s Programme for International Student Assessment (PISA) finds a link
    between frequency of use of computers at home and improved student performance
    (Figure 1.6). It is more difficult, however, to show the same relationship between
    computer use in schools and improved student performance. Indeed, when the influence
    of socio-economic status of students is taken out of the equation, any relationship
    begins to disappear. The evidence seems to be that of ICTs further benefits those
    who already have good performance, and not harm those who do not.


    There is a gap between the lives of students at home and in school. The average
    15-year-old in OECD countries spends about two hours per day at home in front
    of a computer and less than one hour per week on a computer in school. The question
    arises: is it worth investing more in ICTs for education? Will there be a pay-off,
    financially and in terms of equity?'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Figure 1.6: Relationship between technology use and educational attainment
    in science (2006 PISA survey)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_27_0.png)


    Source: workshop presentation by Frances Pedro and William Thomas, OECD.


    The real challenge is to develop better measurement. Students in OECD countries
    are already exposed to an information-rich environment and therefore improvements
    from use of ICTs in schools are likely to be marginal. One might expect a bigger
    impact in developing countries. A particular challenge is to understand how computers
    are used in school. For the most part, they seem to be aimed at developing ICT
    skills rather than using ICTs as a medium for learning in other subjects.


    There are a huge number of initiatives in the field of ICT4E. They do not necessarily
    come from donors, but from NGOs and national governments. The education donor
    community has been quite conservative in their education development policies.
    However, the demand for ICT4E in developing countries is growing quickly.


    Access from developed countries to Internet knowledge resources such as Wikipedia
    or information search has greatly facilitated learning. The lack of access in
    developing countries means a growing knowledge gap is inevitable. Seventy cent
    or more of the population in OECD countries have access to the Internet, while
    in close to 100 developing countries the figure is less than 10%. In developing
    countries, the primary platform for access is the mobile phone, with mobiles increasingly
    used for e-learning and video instruction. Mobile computing platforms coming down
    in and becoming widely available in developing countries will have a huge impact
    on access.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'The rapid growth of open source learning management systems and availability
    of open education resources driven by initiatives like the Massachusetts Institute
    of Technology’s OpenCourseWare are changing how people think about the value of
    educational content – that it is in the delivery rather than the IPR of the course
    content itself. Trends in technology – e.g. rapid improvement in the capacity
    of memory storage compared with relatively slow improvement in connectivity –
    suggest that more educational content could be stored locally rather than accessed
    over expensive networks.


    A variation on Solow’s paradox might say, “We see the computer age everywhere
    in schools, except in educational improvement”. This suggests that we need to
    rethink how we use technology in schools. The new digital divide is not about
    access but about differences in the type and quality of use.'
  merge: -1
  img_proc: true
