  md: '# ORGANISATION FOR ECONOMIC CO-OPERATION AND DEVELOPMENT


    The OECD is a unique forum where the governments of 30 democracies work together
    to address the economic, social and environmental challenges of globalisation.
    The OECD is also at the forefront of efforts to understand and help governments
    respond to new developments and concerns, such as corporate governance, the information
    economy and the challenges of an ageing population. The Organisation provides
    a setting where governments can compare policy experiences, seek answers to common
    problems, identify good practice and to coordinate domestic and international
    policies.


    The OECD member countries are: Australia, Austria, Belgium, Canada, the Czech
    Republic, Denmark, Finland, France, Germany, Hungary, Iceland, Ireland, Italy,
    Japan, Korea, Luxembourg, Mexico, the Netherlands, Norway, Portugal, the Slovak
    Republic, Spain, Sweden, Sweden, Turkey, the United Kingdom and the United States.
    The Commission of the European Committees takes part in the work of the OECD.


    OECD disseminates widely results of the Organisation''s statistics gathering and
    research on economic, social and environmental issues, as well as the conventions,
    guidelines and standards agreed by its members.


