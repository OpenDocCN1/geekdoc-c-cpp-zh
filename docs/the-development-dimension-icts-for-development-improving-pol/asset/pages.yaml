    # ### Market entry


    Across countries, the key to growth was significant market entry. This took the
    form of transparent entry in Pakistan, opaque licensing in Bangladesh and “back
    door” entry by so-called fixed operators in the mobile space in Nepal. The common
    factor was a sufficiently significant number of suppliers with at least one willing
    to engage in disruptive competition. Different operators assumed this role in
    different countries. In India, Reliance created a disruption and caused to follow.
    In Thailand, the acquisition of a Thai-owned operator by a foreign operator served
    as the trigger. In Sri Lanka, late entry of the incumbent operator into the mobile
    space through an acquisition set off the least rapid growth phase.


    # ### Investment


    Growth in connectivity cannot occur without investment. The relaxation of government
    barriers to market entry resulted in increased investment,'
