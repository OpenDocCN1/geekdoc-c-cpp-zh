  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 65


    # Table 2.1: Summary of ICT4D phases


    | Issue / Phase | ICT4D 0.0 | ICT4D 1.0 | ICT4D 2.0 |

    |---|---|---|---||

    | | (1960s – mid–1990s) | (mid-1990s – mid–2000s) | (mid-/late-2000s onwards)
    |

    | Iconic Technology | PC Database | Telecentre | Mobile Phone |

    | Key Application | Data Processing | Content (& Interaction) | Services & Production
    |

    | The Poor | | Consumers | Innovators & Producers |

    | Key Goal | Organisational Efficiency | MDGs | ?Growth & Development? |

    | Key Issue | Technology''s Potential | Readiness & Availability | Uptake & Impact
    |

    | Key Actor | Government | Donor & NGOs | All Sectors |

    | Attitude | Ignore -> Isolate | Idolise -> Integrate | Integrate -> Innovate
    |

    | Innovation Model | Northern | Pro-Poor -> Poor | Para-Poor -> Per-Poor |

    | Dominant Discipline | Information Systems | Informatics / Development Studies
    | Tribrid of CS, IS and DS |

    | Development Paradigm | Modernisation | Human Development | ?Development 2.0?
    |


    What, when, might we argue are the key differences between ICT4D 1.0 and 2.0?
    In answering this, we could draw parallels with the concept of Web 2.0. For example,
    ICT4D 2.0 is about the world’s “long tail” – using digital technologies to draw
    on the capacities of the 80% who hold only 20% of the world’s resources. Or, using
    Eric Schmidt’s “don’t fight the internet” characterisation, we can see ICT4D 2.0’s
    slogan “don’t fight the poor”. Where 1.0 imposed pre-existing designs and expects
    the poor to adapt to them, 2.0 designs around the specific resources, capacities
    and demands of the poor. Or, we can transform “network is the platform” to argue
    that while ICT4D 1.0 used ICTs as tool for development, the second phase uses
    ICTs as the platform for development.


    Alternatively, we could break things down into a chronology of ICT4D issues, as
    represented in Figure 2.7:


    +   * Readiness: do we have the policies and infrastructure to make ICT availability
    possible?'
