  img_proc: true
- pgno: 124
  md: '# 4. WHAT ROLE SHOULD GOMENTS PLAY IN BROADBAND DEVELOPMENT? – 123


    helps to assess the role(s) that governments will need to play in using broadband
    as a tool in ICTs for development (ICT4D). Traditionally, governments have played
    a “push” role, ensuring a favourable environment for the provision of ICT infrastructure
    and development of the domestic ICT sector. This might be practised as Policy
    1.0 (Figure 4.3). Increasingly, governments will need to move towards “pull” strategies
    aimed at promoting digital literacy, establishing environments, providing including
    local content. This might be practised as Policy 2.0, corresponding to popular
    concepts such as Web 2.0 or Mobile 2.0.


    # Figure 4.3: Evolution of government approaches to ICTs for development


    | Strategies | ICT4D | Approach |

    | --- | --- | --- |

    | Push | Infrastructure | |

    | | ICT Sector | 1.0 |

    | | (Digital) Literacy | |

    | Pull | Enabling Environment Applications (content and services) | 2.0 |


    Source: Adapted from Peña-López, Ismael (2009), “Measuring Digital Development
    for Policy-Making: Models, Stages, Characteristics and Causes”, unpublished PhD
    thesis, UOC, Barcelona.


    Governments have taken very different views on whether or not to establish national
    broadband strategies. Generally, countries with coherent national strategies have
    tended to be more successful in fostering broadband diffusion. Most of the OECD
    countries that lead broadband penetration, including Denmark, the Netherlands,
    Norway, Korea, Sweden and Finland, have such strategies. But even pre-market economies
    that initially resisted defining a central government role have now crossed the
    fence. For instance, the UK government’s 2009 Digital Britain report included
    a radical proposal to charge a levy of GBP 6 (around USD 10) per fixed-line telephone
    subscriptions in order to generate a fund for high-speed broadband services'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 124 — 4. WHAT ROLE SHOULD GOVERNMENTS PLAY IN BROADBAND DEVELOPMENT?


    across the country. Similarly, in the United States, after ten years of debate
    – during time which the US has fallen from second to fifteenth in OECD broadband
    rankings – the new government has announced the development of a National Broadband
    Plan, kicking off with a series of discussions hosted by the regulator, the Federal
    Communications Commission (FCC).


    What should be the role of government in the provision of broadband? The basic
    principle is that governments should intervene only based on sound economic principles
    and where the benefits of such intervention outweigh the costs. There are essentially
    two different roles for the public sector: making markets work more efficiently
    and ensuring equitable access for all.


    # Making markets work more efficiently


    Already by 2008, broadband service was available in 182 economies (Figure 4.4)
    and by the start of 2009 the combined total of global broadband users on fixed
    and mobile networks exceeded 1 billion. As the vast majority of these connections
    have been supplied by privately-operated companies, it could be assumed that the
    broadband market is working quite effectively with no market failures.


    > Figure 4.4: Number of economies with commercially-available broadband, 2002-2008


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_125_0.png)


    Note: Broadband is defined as speeds equal to or in excess of 256 kbit/s.

    Source: ITU.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 4. WHAT ROLE SHOULD GOVERNMENTS PLAY IN BROADBAND DEVELOPMENT? – 125


    There are, however, market failures in broadband. As with many other markets,
    they concern the provision of public infrastructure. The structure of the broadband
    market itself has sometimes created problems for the development of service. The
    most common form of market failure is the persistence of monopoly-type structures
    in the provision of broadband infrastructure even when no legal monopoly exists.
    In many countries, the dominance of incumbent public telecommunications operators
    is one of the key obstacles to the development of effective competition. Other
    market failures may be associated with lack of economies of scale. Difficulties
    in obtaining legal permission to operate, inefficient allocation of radio spectrum,
    poor information and limited capital markets are all further examples of market
    failures.


    Market failures in the ICT sector have been widely recognised by governments around
    the world. They are typically addressed through regulatory policy: liberalising
    licences facilitating access to radio spectrum and regulating access to dominant
    operators’ networks are all corners of policies that have provided the foundation
    for the rapid expansion of broadband services. In Europe and some developing countries,
    broadband policies have focused on providing regulated access to the incumbent
    operator’s network (“unbundling the local loop”). Other economies have focused
    on providing low-cost access to existing infrastructure facilities such energy
    and transport networks.


    In France, for instance, a “ladder of investment” approach can be seen in the
    evolution of the broadband market At the lowest “rung” is resale of the incumbent’s
    capacity, which required interconnection at only one point in a network. Later,
    bitstream access was offered at a regional level, whereby the entrant interconnected
    at multiple regional points and constructed a backbone network. As full unbundling
    of the local loop mandated, full-service operators such as Iliad (free.fr) further
    generated growth in direct competition to the incumbent, France Télécom (Figure
    4.5) while building their own networks.'
  merge: -1
  img_proc: true
