- pgno: 168
  md: '# Sustainable ICT value and supply chains


    The very processes of development and globalisation have drawn farflung regions
    into global distribution and logistics networks, making international co-operation
    essential in areas such as standardization of energy efficiency monitoring and
    labelling, and international trade in electronic waste (e-waste).


    # Cross-border trade in e-waste


    Electronic waste or e-waste is a growing problem and the United Nations has estimated
    that 20-50 million tonnes of e-waste are generated each year, and recent European
    studies suggest that e-waste is increasing around three times faster than the
    total waste stream, accounting for around 8% of all municipal waste (Vetter and
    Creech 2008).


    While miniaturisation and the trend towards the use of mobile devices and LCD
    screens reduces the energy consumption of ICT equipment, its rapid adoption in
    households and developing and emerging economies, together with short product
    life cycles, is contributing to continuing increases in energy use and the production
    of e-waste. This is exacerbated by the increasing use of electronics in motor
    vehicles, home appliances and almost all forms of industrial and consumer equipment
    (Bio Intelligence 2008).


    There have been major gains in reducing the use of materials of concern in electronic
    equipment but much of that collected is still leading to sub-standard treatment
    plants or illegally exported.³32 Greenpeace reported that inspections of 18 European
    seaports in 2005 found that as much as 47% of waste destined for export, including
    ewaste, was illegal. Despite attempts by governments to ban the illegal export
    and import of e-waste, India, China and Africa (e.g. Ghana and Nigeria) remain
    major destinations.³33


    Many of the major ICT and electronics firms are trying to clean up the e-problem
    with pro-active return and re-cycling initiatives, but these do affect local recycling
    more than the international trade in e-waste. International co-operation can help
    stop the illegal trade and ensure that recycling operations meet appropriate standards.
    This could be through updating the Basel Convention, regional or bi-lateral agreements,
    tracing and monitoring or other regulatory mechanisms. The problem is however,
    is not easy to solve, as banning trade and forcing local recycling would likely
    raise the cost of, and thereby discourage recycling. It may be that local'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'implementation and monitoring of internationally agreed standards for

    recycling is the only effective course of action (Shinkuma and Huong 2009).


    # Summary and conclusions


    ICTs are all but ubiquitous and the potential uses and impacts of ICTs

    on the environment are numerous and varied. Only a few examples have

    been provided here. However, it is possible to note some of the key areas of

    imact and potential in more general terms, highlighting some of the major

    issues arising for policy coherence.


    There are a number of crucial tasks and tools, including:


    +   - Earth observation, remote sensing and monitoring, communications

    networks, grid and cloud computing, data collection, analysis and

    modelling, database management and decision support systems;


    +   - Geographic information systems (GIS) and earth browsers (e.g.

    Google Earth and Microsoft Visual Earth);


    +   - Web-based clearhouse sites for communicating technology and

    learning, education and capability building;


    +   - Monitoring and reporting on, and operation of, transaction systems

    and trading.


    Specific applications include:


    +   - Detection and early warning (e.g. for storms, floods, earthquakes

    and tsunami);


    +   - Energy efficiency applications (e.g. intelligent building systems,

    intelligent transport systems, smart grids and home automation);


    +   - Information, education and capability building (e.g. technology

    awareness and transfer, public education and support), with the key

    to realising potential benefits being behavioural change at the

    househouseold and individual level.


    Key issues for emerging and developing countries include:


    +   - Access to infrastructure and ways to enable investments in smarter,

    greener energy, transport and building infrastructures, as well as

    to broadband networks and the ICT equipment and services

    necessary to enable their operation;


    +   - Access to data and how the masses of data collected can be brought

    together to provide a holistic picture of an ecosystem or'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'environment (i.e. who owns the data, who can use it and what it can be used
    for);


    +   - Affordability and how emerging and new technologies can be implemented in
    contexts of severe budgetary constraint;


    +   - Capability and how the necessary skills can be brought to bear on environmental
    issues in developing and emerging economies.


    Areas for concern for developing and emerging economies include:


    +   - Understanding life cycles in the many different contexts and circumstances
    that exist in developing and emerging economies, and not assuming that developed
    country life cycle assessments apply, while operating within the constraints of
    available data (e.g. insufficient national statistical collections to support
    input-output analysis and life cycle assessments);


    +   - Managing possible rebound effects, which are likely to be greater in rapidly
    growing markets where there is unmet demand for energy and resources, and the
    related difficulties of establishing an equitable international price for carbon
    and regulating for appropriate price signals;


    +   - Ensuring there is sufficient technology transfer and enabling funding flows
    to developing countries.


    Fundamentally, ICTs are about information and communication – these roles are
    vital. Data must be collected, analysed and interpreted, transformed into information
    that enables individuals to make smarter, greener choices, and communicated in
    such a way as to inform and educate, influence and change behaviours. It is not
    simply a matter of price signals shaping behaviour (even if it is possible to
    get those signals right) but also of informing, monitoring performance and providing
    non-price feedback in such a way as to motivate and reward individuals and communities
    for creating sustainable livelihoods.


    As Pleyp (2002) noted: “...it is necessary to look at both ecological and social
    dimensions.” The positive ecological dimension rests on ICT''s potential to deliver
    greener products, optimise the ways of their delivery, and increase consumption
    efficiency through dematerialisation, substitution, green marketing, ecological
    product life optimisation, etc. The environmental potential offered by the ecological
    dimension will be fully utilised only under an optimised social dimension, which
    deals with the behavioural issues of consumption.'
