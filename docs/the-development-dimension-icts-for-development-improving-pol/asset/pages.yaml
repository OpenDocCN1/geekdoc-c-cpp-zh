  md: '# Chapter 5


    # Regulatory Issues around Mobile Banking


    By Paul Makin¹


    > The rise of the mobile phone in emerging markets, particularly Africa and large
    parts of Asia, is well documented, as is its use in a growing number of initiatives
    to increase the availability and variety of financial services in emerging economies.
    This chapter explores relevant issues by recounting the experience of the IT consultancy
    firm Consult Hyperion in the conception, development and deployment of M-PESA,
    a mobile payment service in Kenya and Tanzania, as well as their conversations
    with a range of financial regulators from around the world.


    ¹ Paul Makin is Principal Consultant, Consult Hyperion. paul.makin@chyp.com. www.chyp.com.'
