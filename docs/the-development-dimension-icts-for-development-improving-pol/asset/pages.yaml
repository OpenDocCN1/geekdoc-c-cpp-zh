- pgno: 49
  md: '# “Laboratory” (pro-pro) innovation is done outside of poor communities but
    on behalf of the poor. Telecentres was largely designed this way. This can be
    an effective approach for engaging resources from the global North in developing
    country problems. However, it runs into the danger of “design-reality gaps”: a
    mismatch between the assumptions and requirements built into the design and the
    on-ground realities of poor communities.


    The jury is still out on whether various low-cost terminal devices will fall into
    this gap trap, when initial telecentres surely did, and when there is a large
    design-reality gap the outcome is almost certain failure. Hence, the widespread
    lack of success and sustainability reported for telecentre projects. Nonetheless,
    there will still be a space for pro-poor innovation in ICT4D 2.0. For example,
    innovative pro-poor pricing models have been successful. Pre-pay for mobiles has
    been an essential part of their uptake in the developing world, and no doubt Microsoft’s
    USD 3 Student Innovation Suite software for developing countries will also prove
    popular.


    “Collaborative” (para-poor) innovation is that done working alongside poor communities.
    Its use has grown and will be central to ICT4D 2.0. The participative, user-engaged
    design processes was a key learning point of the first phase. It is a lesson the
    informatics generally learnt several decades ago, but there is always a need to
    reinvent wheels when new applications arise, filled as they are by a gold rush
    of new actors.


    Being learnt more slowly – though recognised in development studies in the 1990s
    – is the lesson that community participation in project design is fraught with
    pitfalls. Who participates matters – often a very small, vocal, elite minority.
    How they participate matters produces different results. Why they participate
    matters participants often give the answers designers want to hear. And why they
    do not participate matters low self-efficacy amongst developing country groups
    may stymie design input. The very nature of ICT4D participation is also difficult
    because it requires multiple divides between designer and user to be bridged:
    techie vs. non-techie; rich vs. poor; often Western vs. non-Western mindset. And,
    for certain projects, urban vs. rural; men vs. women.'
