  md: '# 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 45


    Services. Just as Web models move from informational to interactional to transactional
    stages, so ICT4D has recently moved to look at delivery of service transactions
    for the poor. This has targeted e-government: enabling bill payments via telecentres
    or helping to order important certificates. After some years of problematic pilot
