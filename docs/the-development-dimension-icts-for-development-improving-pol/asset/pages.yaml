    # Developing country case studies


    Examples of developing country broadband development strategies are less than
    for developed countries because there remains a significant digital divide in
    broadband development between nations. Indeed, because mobile communication has
    leapt significantly ahead of fixed line communication in most developing countries,
    it is likely that broadband will develop on a wireless rather than fixed line
    platform. Egypt is a case in point. As of mid-2009, Egypt''s 49.4 million mobile
    subscribers outnumbers its 11.6 million line subscribers by more than four to
    one. The number of fixed-line subscribers began to decline for the first time
    in the first half of 2009. Furthermore, the fixed-line market is still largely
    a monopoly of the state-owned incumbent, Telecom Egypt, the mobile market is highly
    competitive, with a third entrant, Etisalat Mis, licensed in 2006. All three operators
    have 3G allowing them to offer mobile broadband services. NTRA, the national regulator,
    estimates as of 2008 just half of Egypt''s Internet users had broadband access,
    but there were fewer than one million ADSL subscribers in total (a'
