    thus acting as a more general guide to ICT4D 2.0 good practice. Examples would
    include:


    +   - Mapping project realities: finding ways to expose the true situation within
    the project context and integrate it into implementation processes. One example
    would be the use of soft systems techniques such as "rich pictures", which have
    a good track record of mapping realities.

    - Using Hybrids: hybrid ICT4D professionals are those who combine an understanding
    of technology, systems and development (Figure 2.5), and thus help to recognise
    and reduce gaps.

    - Being incremental: breaking the overall ICT4D project down into smaller steps
    and therefore reducing the extent of the gap between design and reality that is
