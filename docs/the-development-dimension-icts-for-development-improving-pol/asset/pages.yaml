  md: '# 150 – 6. ICTS AND THE ENVIRONMENT IN DEVELOPING COUNTRIES: OPPORTUNITIES
    AND DEVELOPMENTS


    This chapter examines the status of current and emerging environmentally friendly
    technologies, equipment and applications in supporting programmes aimed at addressing
    climate change and improving energy efficiency.


    An overview is given of role of ICTs in: *i)* climate change mitigation (e.g.
    investing in smart transport and energy efficient infrastructure); *ii)* mitigating
    other environmental pressures (e.g. biodiversity loss, water and soil pollution);
    *iii)* climate change adaptation (e.g. adapting to rising levels, droughts, desertification)
    and *iv)* international co-operation (e.g. technology transfer and the development
    of sustainable ICT value chains). Examples of current activities and opportunities
    are provided for each of these areas.


    # ICTs and the knowledge-based economy


    A major feature of the knowledge-based economy is the impact that ICTs have had
    on industrial structure, namely a rapid growth of services and relative decline
    of manufacturing. Services are typically less energy intensive and less polluting,
    so countries with a high and increasing share of services see declining energy
    intensity of production – with the emergence of the Knowledge Economy ending the
    linear relationship between output and energy use (i.e. partially de-coupling
    growth and energy use).


    Estimating that around one-third of the increase in energy efficiency in the United
    States could be attributed to structural change in the economy, with the remaining
    two-thirds to improved energy efficiency, Romm et al. (2000) concluded that forecasts
    for energy consumption and CO2 emissions to 2010 for the North American economy
    should be adjusted down by 5% due to the rapid impact of the Internet. More recently,
    Lautner and Ehrhardt-Martinez (2008) estimated that for every extra kilowatt hour
    of electricity used to power ICTs, the US economy has increased its overall energy
    savings by a factor of 10. This gain in energy efficiency (energy productivity)
    has enabled the US to meet 75% of the demand for new energy services through energy
    efficiency gains.


    Traditional development models have focused on a shift from agriculture to manufacturing,
    the development of free markets and encouraging exports and industrialisation
    in labour-intensive consumer – a good model born out in The East Asian Miracle
    (World Bank 1993) and the emergence of China as the world’s largest exporter of
    ICTs and related consumer equipment. Sheehan (2008) suggests a re-think, based
    on the evidence from the emergence of India and the thrust of China’s Eleventh


