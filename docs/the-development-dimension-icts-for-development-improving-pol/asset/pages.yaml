- pgno: 184
  md: '# 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA – 183


    strategies for content development in the focus countries are articulated to varying
    degrees.


    # India


    The Draft National Policy on ICT in School Education, published by the Ministry
    of Human Resource Development in 2009, stresses the significance of achieving
    general ICT competency for all school levels, appropriate curriculum for ICTs
    as a subject at the higher secondary level, and the need for ICT-enabled teaching
    and learning practices. The policy outlines requirements of different levels of
    ICT literacy and competency from basic to advanced, and provides an implementation
    strategy to ensure these levels are achieved. It also articulates the need to
    develop modular courses in different areas of ICTs at the higher secondary level.


    Given India''s linguistic, cultural and social diversity, the policy recognises
    the significance of good quality, locally relevant content in multiple languages.
    It spells out a strategy to develop content in a phased manner by focusing first
    on the more difficult to teach and understand concepts and making quality digital
    resources available for all classes and disciplines, moving finally towards a
    model of highly interactive digital resources such as virtual laboratories. National
    and state level web-based digital repositories are envisaged that will host content
    for students and teachers in a range of formats from question banks to activities,
    notes, etc. Appropriate licensing norms to facilitate open and free access to
    resources will be highlighted, with knowledge of issues such as copyright and
    restrictions on content reused by all users. Further, educational standards and
    instructional design models will be widely distributed to ensure quality in the
    digital content being produced by different agencies.


    School libraries will be revamped to function as gateways to quality digital content,
    thereby playing a crucial role in cataluing of digital resources in all classes.
    Libraries will have adequate Internet connectivity and move towards digital cataluing
    and automation.


    Content development is entrusted to the public and private domain. Agencies such
    as CIET, NCERT, Indira Gandhi National Open University (IGNOU), State Institutes
    of Educational Technology (SIETs) and Doordarshan (National Broadcasting) have
    dedicated resources for developing and disseminating digital content at various
    levels for a variety of objectives from informal educational messages to structured
    course modules. Private companies such as EduComp, Evernon, NIIT, Aptech, IL &
    FS, Intel and Zee Interactive systems are working extensively to develop and deliver
    quality digital content. These'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 184 – 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA


    companies, in addition to selling their products to individuals and schools, have
    entered into MoUs with various state governments in order to design and deliver
    content through well-defined initiatives focusing on government schools.


    # Sri Lanka


    Sri Lanka’s 2002 National Policy on Information Technology in School Education
    (NAPSITE) was formulated to “envisage and foresee the future global challenges
    in IT education and lay the foundation for appropriate human resource development
    to meet such challenges”. Additionally, it seeks to improve the information literacy
    of all its citizens, create learning opportunities through the school system and
    enable the use of ICTs as a tool in teaching and learning at all levels of general
    school education. Specifically, the NAPSITE articulates the need to:


    +   - Introduce, sustain and enhance ICT involvement in general education in schools
    and create opportunities for ICT-based learning and teaching.


    +   - Introduce IT into pre- and in-service teacher development and training programs
    and create opportunities for system-wide professional development of teachers.


    +   - The NAPSITE also mentions the need to set up a multimedia software and web
    development centre.


    Recognising the lack of relevant content in local languages as an impediment to
    adoption of ICTs by a large number of people, the Government of Sri Lanka (ICTA),
    through its Information and Communications Technology Agency has launched the
    Shilpa Surya Project to create digital content in Sinhalese. Shilpa Surya enables
    students to use ICTs at telecentres to study eight subjects in order to prepare
    for national examinations. In addition, the National ICT Literacy Project aims
    to increase the e-literacy level of the population by providing training through
    a network of rural service delivery centres called nensalas.


    # Pakistan


    The 2005 National Information and Communications Technology Strategy for Education
    (NICT) stresses the use of ICTs both as a subject and critical instructional aid.
    It aims to improve student learning using ICTs through locally relevant content
    created by teachers who develop their own teaching and learning materials. It
    also suggests distribution of CD-ROM-based software (including items from and
    links to relevant'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA – 185


    websites and education portals) to schools, professional development centres and
    teacher training institutions to help pre- and in-service teachers expand their
    content knowledge.


    The NICT also articulates the need for overall curriculum reform in light of tools
    and pedagogical techniques made available through ICTs so as to enrich education
    at every level. It stresses the need to use ICTs to provide access to internationally
    or nationally produced quality content to supplement existing textbooks and materials.
    This content, by being flexible, interactive and multi-modal (radio/TV etc.),
    will improve student learning.


    The policy suggests that ministries, education departments and district education
    offices established limited search engines – online database collections of appropriate
    content for use by students. International open educational resources and models
    for curriculum and content development may be used after adapting them to national
    requirements based on guidelines.


    # Bhutan


    Bhutan’s 2004 Information and Communication Technology Policy and Strategies (BIPS)
    aims to create appropriate curriculum for ICTs as a subject based on market needs,
    as well as curriculum for general ICT literacy and competency for all school students.


    The 26th Education Policy Guidelines & Instructions (EPGI-2007) state the government’s
    intention to make teachers and students who complete basic education (i.e. class
    X) ICT literate. To this end, since April 2007 Bhutan Telecom has all dial-up
    Internet packages free. Therefore, schools with computer and Internet facilities
    are urged to introduce relevant ICT programmes for students and encourage Internet
    for learning, especially after school hours and during weekends when the facilities
    are often underutilised and students have ample time to practise and learn. The
    Department of Education’s Curriculum and Professional Support Division has developed
    a standard ICT literacy framework which schools are urged to initiate and carry
    out ICT programmes.


    A strategic component of local content development is the Dzongkha localisation
    project currently being executed by the Department of Information Technology (DIT).
    A beta version of Dzongkha Linux was released in 2006 with the capacity to undertake
    common desktop computing tasks such as word-processing, spreadsheets and PowerPoint
    presentations in Dzongkha, Bhutan’s national language. This symbolises the beginning
    of a commitment towards open source software development. Diminishing the'
