- pgno: 41
  md: '# 40 – 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    +   * Power: with only 15% of rural households in sub-Saharan Africa having access
    to electricity, three areas of innovation continue to be required: new, low-cost
    devices for local electricity generation; better ways to store, carry and transmit
    electricity; and lower power consumption by ICT devices.


    But, in some ways, we stand at a fork in the Internet access road. Do we continue
    heading down the PC-based route less than 0.5% of African villages have so far
    got a link this way? Or do we jump ship to mobile telephony, which already reaches
    out to two-thirds of the African population? The requirement for hardware innovations
    appears to be relatively limited, but offerings from multinational firms appear
    to be diffusing fairly readily. Half the world''s population is mobile phone users;
    a greater number have access to a mobile; and growth rates are currently fastest
    in the poorest regions.


    Current growth rates will carry usage to over 90% of the world''s population,
    leaving the questions of reaching the last half-billion, and the spread of Internet-enabled
    phones, given that most phones in poor communities are currently calls-and-SMS-only.
    For both, the need for hardware innovation may re-emerge. There are also likely
    to be innovations as iPhone-and-apps-type on mobiles converge with notebook-type
    to produce lower-cost PC-like terminal devices, ending with something like a “Blackberry-for-Development”.


    # Box 2. Broadband: new hope/new divide


    Broadband is already an integral part of ICT usage in the global North. In the
    US (one of the poorer performers), by 2008 there were 25 broadband subscriptions
    per 100 citizens, and 55% of households had broadband, representing around 90%
    of all Internet connections. By contrast, the subscription rates for most African
    countries, including Ethiopia, Ghana, Kenya, and Uganda, were under 0.1% of the
    population. Tiny Andorra had roughly as many broadband subscriptions as Africa’s
    most populous country, Nigeria.


    So as we start seeing digital devices closing around Internet access and mobile
    phone ownership, a new broadband device is growing. This does and will continually
    require a strategic response, if not led, must at least be coordinated by government.
    And as where this happens, the development results will be impressive. Broadband
    uptake is associated at the macro level with growth in indicators such as employment
    and GDP, and at the micro level there are many new employment- and productivity-enhancing
    opportunities.'
