  md: '# 44 - 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    community radio and, to a lesser extent, community television – very localised
    broadcasting that allows community input. There is growth of participatory video
    – the creation of video content by the local community and its presentation at
    individual screenings for community groups. We are also likely to see more content
    creation with an external purpose. This means use of locally-created data to raise
