- pgno: 121
  md: '# Why broadband?


    Broadband is a key driver of economic growth and the competitiveness of nations.
    A boost of 1.38 percentage points on GDP growth in developing countries can be
    attributed to every ten percentage points'' increase in broadband penetration
    (Figure 4.1).


    # Figure 4.1: Impact of a 10% increase in penetration of selected ICTs on GDP
    per capita


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_121_0.png)


    Note: Based on an analysis of 120 economies, 1980-2006.


    Source: Adapted from World Bank (2009), *Information and Communication for Development:
    Extending Reach and Increasing Impact.*


    Broadband is a General Purpose Technology (GPT) that is having a major impact
    on the way we live and work. Companies use broadband to improve productivity through
    remote monitoring, logistics management and'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 4. WHAT ROLE SHOULD GOVERNMENTS PLAY IN BROADAND DEVELOPMENT? – 121


    online procurement. It is also used to provide services such as media content,
    online shopping and electronic banking.


    Increasing, broadband is the primary mechanism for accessing information – a public
    good essential for all forms of economic activity and good governance. It provides
    access to new technologies and allows companies to explore new business opportunities,
    interact with customers and obtain information about market prices. Better access
    to information makes markets work more efficiently and raises producer incomes.
    Ready access to information about the performance of government and politicians
    helps government accountability and quality of service provision.


    Finally, broadband networks are increasingly used to deliver public services.
    Electronic voting, financial services, health care and electronic land registration
    are all examples of services that were previously delivered manually but are now
    automated and delivered over broadband networks, often substituting online interaction
    for travel or the physical displacement of goods.


    Despite rapid growth in broadband that has already taken place, broadband is still
    in the early stages of deployment. The future will see wider deployment, increased
    capacity and a shift towards a wireless platform which will enable mobility. Broadband
    in developing countries are likely to follow a similar path with a greater emphasis
    on wireless networks.


    # Broadband as an “ecosystem”


    Broadband is typically defined as a “high-speed communications network” that connects
    users at data transfer speeds greater than some minimum (e.g. 256 kbit/s). While
    this is a popular definition, it is incomplete. Rather, broadband can be considered
    as an “ecosystem” differing elements that use high-speed connectivity to interact
    in different ways (Figure 4.2). By contrast with relatively passive dial-up Internet
    users, broadband users have the ability to create and share multimedia content
    in a variety of formats. This interactivity is an important factor that differentiates
    broadband from other high-bandwidth, but essentially passive, networks such as
    multi-channel TV. It also creates many new opportunities for value creation and
    innovation.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Figure 4.2: The virtuous circle for broadband: connecting the elements


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_123_0.png)


    Source: World Bank (forthcoming) “Broadband Policy Development in Developing Countries”.


    The growth of so-called Web 2.0 services and applications that are dynamic and
    collaborative in nature depends on the ability of users to interact with each
    other, but also has implications for network development. For instance, networks
    previously offered updates at lower speeds than downloads because this reflected
    typical use of applications such as e-mail and web-browsing. Users of today’s
    two-way multimedia services, however, demand high speeds in both directions. Worries
    about a deluge of bandwidth-hungry services overwhelming the Internet, but these
    predictions have only come to pass in isolated incidents. The global Internet
    seems remarkably robust in terms of scaling to a larger number of users, more
    demanding applications and higher speeds.


    Hence, the network is part of an ecosystem that is evolving and includes more
    demanding users and applications. Simultaneously, users creating and sharing more
    content and applications that require more bandwidth should drive the supply of
    broadband, forming a virtuous circle. Thus, in this note the “broadband ecosystem”
    is defined as a multi-layered system of interconnected high-capacity communications
    networks, bandwidth-intensive services and applications, and users.


    # The role of government


    Defining broadband as an ecosystem rather than simply as a network'
