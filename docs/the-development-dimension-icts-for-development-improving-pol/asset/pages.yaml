- pgno: 181
  md: 'India, Sri Lanka and Pakistan have either developed or are in the process of
    developing distinct ICTs for education policies. A common feature is the importance
    of ICTs both as a subject and as an instructional aid.


    India''s policy-making process was initiated through a stakeholder dialogue on
    formulating a Draft National Policy on ICT in School Education, led by the Ministry
    of Human Resource Development, the Global e-Schools Initiative (GESCI) and the
    Centre for Science, Development and Media Studies (CDSMS). Based on feedback received,
    the draft policy has now been published for comments and revision. However, even
    before focused action, ICTs had been mainstreamed in several education initiatives
    and flagship programmes of the government.


    Sri Lanka''s National Policy on Information Technology in Education (NAPITSE)
    was formulated in 2002, where ICTs would be used both in education and management
    of education systems.


    Pakistan formulated its National Information and Communication Strategy for Education
    (NICT) through a consultative process in 2004-05. The policy recognises the importance
    of ICTs for creating access, improving quality of learning, strengthening teacher
    education and improving student achievement.


    For all these countries, policy/strategy documents need to be backed with detailed
    implementation plans. Sri Lanka had a strategic plan of action from 2002-2007,
    but the targets set out in their ambitious policy have yet to be realised. Further
    separate financial allocations must be made in support of the initiatives outlined.
    Very few countries'' policy documents have extensively outlined a monitoring and
    evaluation methodology to gauge the success of the initiatives or tools used.


    ICTs for education initiatives in the different focus countries are successful
    precisely because they are able to pull together many different elements, supported
    by a robust yet flexible policy framework. A broad graphical depiction of what
    may be understood as "ICTs for education ecosystem" is depicted in Figure 7.2.
    Core infrastructure policies provide for electrification and physical facilities,
    ministries of education have responsibility for articulating larger education
    policies and ministries of ICT instigate broad communications policies and policies
    on developing hardware, software and connectivity.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Figure 7.2: ICTs for Education ecosystem


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_182_0.png)


    Source: PriceWaterhouseCoopers India.


    These policies may then be translated into initiatives and schemes by public and
    private providers through different mechanisms. Initiatives specific to ICTs for
    education have several critical elements such as capacity building, content development
    and monitoring and evaluation strategies. Together these are geared towards the
    student in his or her environment, ensuring that ICT initiatives actually result
    in improved teaching and learning. In addition to these elements, factors such
    as detailed implementation plans, financial allocations, institutional capacity
    and community demand for ICTs are all essential in ensuring that ICTs are effectively
    integrated into the education system.


    # Major elements of ICTs for education policy


    Use of ICTs for education is a horizontal activity that requires the coming together
    of elements from different verticals to enable meaningful learning experiences
    for students. The following need to be included in any ICTs for education policy:


    +   - curriculum;'
  merge: -1
  img_proc: true
- pgno: 183
  md: "+   - content/digital resources;\n- infrastructure;\n- capacity building;\n\
    - monitoring and evaluation frameworks;\n- ICTs for education management;\n- Policy\
    \ Plus:\n  - implementation plans;\n  - financial allocations;\n  - political\
    \ and administrative will;\n  - community demand for ICT.\n\n# Content and curriculum\
    \ development\n\nThis is the most significant aspect of ICTs for education. Whether\
    \ ICT applications can yield meaningful results will depend primarily on the quality\
    \ of the content and curriculum being offered in classrooms. There is a need to\
    \ ensure that ICTs are not used simply to teach the old curriculum using computers\
    \ and other tools at hand, but that concepts are taught in a fundamentally new\
    \ way by leveraging the advantages of ICTs provide. Visualisation, experimentation\
    \ and learning-by-doing are some of the hallmarks of this new method.\n\nIntroduction\
    \ of ICTs into the learning environment is therefore an opportunity to rethink\
    \ the teaching and learning paradigm. As models of learning change, what is taught\
    \ in class and at what level should also be rethought. This is an opportunity\
    \ to instill 21st century teaching and learning skills.\n\nContent needs to be\
    \ designed that is relevant to the target group. Content development and curriculum\
    \ reform are important pillars – if these are illdesigned it will be difficult\
    \ to see any utilisation or performance improvement through ICTs, even if all\
    \ other aspects are in place.\n\nThe policies of almost all countries underscore\
    \ the need for appropriate curriculum and content. Curriculum is usually prescribed\
    \ for ICTs as a subject starting at the secondary school level; the primary level\
    \ goal is to improve general ICT literacy and facility with technology. There\
    \ is also mention of using ICTs as a tool for teaching other subjects, though"
