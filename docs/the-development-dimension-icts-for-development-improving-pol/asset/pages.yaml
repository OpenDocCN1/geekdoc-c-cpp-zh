- pgno: 50
  md: '# Box 2.9. ICT4D’s new innovation intermediaries


    A variety of organisational arrangements can exist between ICT system designers
    and would-be users in poor communities. Traditionally, these have been temporary
    – an informal grouping that lasts during the period of design and initial implementation,
    and then dissolves.


    However, the growth of ICT4D and the growth of the poor as a market for ICT systems
    has led to emergence of some more permanent organisational forms: what we can
    call ICT4D’s “new innovation intermediaries”. Taking one of the world’s ICT4D
    hubs – Bangalore – we can cite three archetypes that are likely to play a growing
    role during ICT4D 2.0:


    +   Direct sector. Microsoft Research (India) has developed relations with a set
    of poor communities through which innovations can be piloted. Learning from such
    pilots can then be fed back to other parts of Microsoft.


    +   Indirect sector. The Centre for Knowledge Societies is a contractor that works
    on behalf of large private firms. Using a mix of anthropological and technological
    study methods within poor communities, it can report back to its clients on ICT
    design and use issues.


    +   NGO sector. IT Change works actively in a small number of rural communities.
    It can then partner with outside agencies – typically international development
    agencies – to offer guidance on design good practice.


    A mention should also go to the work of the technology-focused Practical Action.
    Starting with a UK-based model of pro-poor innovation, it moved during the 1980s
    and 1990s to a collaborative, pro-poor model. It has now begun, for example through
    the PROLINNOVA programme, to capture and disseminate the inventions of local innovators.
    This is not yet in the ICT field but it offers a model for the role intermediary
    organisations can play in grassroots, pro-poor innovation.


    “Grassroots” (per-poor) innovation is innovation by and within poor communities.
    In the 1990s, it was hardly a possibility – there was insufficient contact between
    poor users and the new technologies; old information technologies such as radio
    and TV provided no innovative'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'space. But this has changed in the last few years. As mobiles have arrived,
    and as PCs and the Web start to arrive, the poor have themselves become innovators.
    Not in the traditional laboratory/research and development sense of the term,
    but in the sense of adapting and applying the technology in new ways.


    By and large we have only anecdotes to date about:


    +   * New processes: e.g. beeping (or flashing) that allows a message to be communicated
    without the call being completed. Street vendors use this to receive “I want to
    buy now” messages from known customers.

    * New business models: e.g. use of airtime as currency has allowed mobile phones
    to metamorphose into mobile wallets. Those whose phones in poor communities have
    therefore been able to use them for payments or for receipt of remittances from
    distant relatives.

    * New products: e.g. back-street recharging of phones. Informalsector enterprises
    are emerging that strip and resell the circuitry from high-end phones, replacing
    it with basic calls-and-SMS-only functionality. They then sell the resulting high-end-body-with-low-end-organs
    as a unique hybrid for those who want the latest look but lack the budget to match.


    The weight of such anecdotes grows there will be pressure within ICT4D 2.0 for
    more systematic means to “harvest” grassroots innovations. This is something well-practised
    within the appropriate technology movement. This movement has already been dreamed
    through its cascade from pro-para- to-peer innovation, and has evolved methods
    for capture, assessment and scaling of new ideas from poor communities. Such methods
    may arguably be enhanced during ICT4D 2.0 by adding features from open source
    and Web 2.0 innovation models.'
