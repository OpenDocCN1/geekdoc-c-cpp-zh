    Treatment Action Campaign currently do.


    # Box 2.6. Falling barriers to data conversion


    One of the informational barriers faced by developing countries is that useful
    data content is in the wrong format for effective use. New technologies are reducing
    – and through innovation during ICT4D 2.0 will increasingly reduce those barriers.
    Examples include:


    +   * Audio/digital conversion through spoken dialogue and interactive voice response
    systems to offer development information, or speech recognition systems for literacy
    training.


    +   * Text/digital conversion either directly by scanning to improve data entry
    speed and accuracy or enabling conversion to digital speech or Braille output.


    +   * Conversion of mental representations to digital maps to capture local knowledge.


    +   * Conversion of physical measurement data to digital format on low-cost sensor
    devices as for blood tests, heart monitoring and agricultural management.


    Interaction. There was quite a fuss in this domain about dealing with “ICTs not
    IT” – i.e. technology “now with added C”. Despite this, use of technology for
    communication – at least, for interactive communication – has been a late arrival.
    This may be because, faced with the telecentre model, interaction e-mail, and
    the poor had no one to message. Their social networks were seen as small, local
    and informal. In fact, take-up of mobile phones proved, these networks have been
    extended by rural-to-urban and international migration. They might be extended
    further by the new technology, thus adding to the social capital of the marginalised
    majority. How this can be done, and how the interactive communications capabilities
    of digital media can be exploited, remains a growing task for ICT4D 2.0.'
