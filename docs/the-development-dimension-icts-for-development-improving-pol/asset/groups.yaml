    # Why broadband?


    Broadband is a key driver of economic growth and the competitiveness of nations.
    A boost of 1.38 percentage points on GDP growth in developing countries can be
    attributed to every ten percentage points'' increase in broadband penetration
    (Figure 4.1).


    # Figure 4.1: Impact of a 10% increase in penetration of selected ICTs on GDP
    per capita


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_121_0.png)


    Note: Based on an analysis of 120 economies, 1980-2006.


    Source: Adapted from World Bank (2009), *Information and Communication for Development:
    Extending Reach and Increasing Impact.*


