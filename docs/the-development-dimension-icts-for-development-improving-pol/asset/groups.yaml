    4. 环境管理与保护：涉及所有与管理和减轻对环境的影响，以及帮助适应给定的环境条件的内容。这包括资源节能管理系统、温室气体（GHG）排放管理与减少系统及控制、污染控制与管理系统及相关方法，包括减轻污染物和人为环境危害的有害影响。


    5. 信息通信技术（ICT）利用的影响与缓解作用：ICT 的生产、使用和处置需要材料和能量，并会产生废物，包括重金属形式的某些毒废物。ICT 可以通过提高流程效率以及去物质化（dematerialisation）的结果直接缓解环境影响，并间接通过应用在人类活动中，从而减少人类对环境的影响。


    6. 环境能力建设：改善环境状况的努力取决于个人和组织的行动。能力建设包括提高公众对环境问题和优先事项意识的努力、培养专业人才以及将环境内容整合到正式教育中。


    ## 图 6.4：ICT 应用分类


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_158_0.png)


    来源：ITU (2008) 《面向电子环境的 ICT：发展中国家的指南，重点关注气候变化》，ITU，日内瓦，第 25 页。


    ## 缓解：避免不可管理的因素


    缓解活动旨在减少气候变化对环境的负面影响，对于实现排放目标至关重要。此类活动可以侧于直接缓解气候变化，也可以关注一系列其他环境影响（例如水可用性和盐度、荒漠化和森林砍伐）。


    ## 气候变化缓解


    ICT 有许多方法可以用于缓解环境影响，包括通过其在测量、监测和管理方面的贡献，以及通过去物质化实现更高效的资源利用和基础设施运行（例如报纸、书籍和音乐等内容的在线交付）、交通替代（例如电话和视频会议）以及智能交通系统、物流和货运合理化、智能建筑和家庭自动化。许多研究和报告强调了
    ICT 能够对环境产生重大影响的领域，根据部门能源消耗的份额和趋势以及应用机会，许多研究指出建筑能效、通过去物质化实现的交通合理化与替代、电话和视频会议以及远程办公是主要的影响领域（例如《气候风险
    2008》）。


    ## 图 6.5：美国各部门交付能源消耗


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_159_0.png)


    来源：EIA (2009)，《2009 年能源展望》，EIA，华盛顿特区。CSES 分析。


    随着经济增长，发展中和新兴经济体在提供基础设施方面面临许多挑战，对可靠电力供应、交通基础设施和商业建筑的需求迅速增加。满足这些需求所面临的巨大困难正在并推动投资转向更高效的能源解决方案。气候集团
    (2008) 引用了几个例子：


    - 能源基础设施：智能电网意味着通过引入 ICT 和传感器网络技术实现配电网的现代化。智能电网能够实现对作为供应链的能源网络的改进监测和控制，这意味着减少能量损耗、提高网络运行效率、提高能源供应的质量和可靠性、增强客户对能源使用的控制、更良好地管理高度分布的发电源（例如增加更多的太阳能和风能发电），并减少温室气体排放。智能电表增加了供应商和用户之间进行双向通信和供应的可能性（Access
    Economics 2009），并在让能源和环境问题对家庭消费者可见方面发挥着关键作用，从而告知并赋能消费者，实现行为改变。


    发电能力的限制以及电网输配损耗正在驱动印度和中国智能电网的发展，这正在提高能源效率并减缓燃煤系统的扩张速度。发电占印度总排放量的 57%；随着需求的快速增长，预计排放量每年增长
    4%，是全球平均水平的两倍。估计有 32% 的发电损耗了（Climate Group 2008）。


    随着未来 20 年的基础设施投资正在进行，现在有机会“跨越”发展到减少损失和停电的智能电网系统。鉴于此，印度和中国正寻求投资智能系统以实现更高的效率。


    ### 框 6.1. 反弹效应？


    人们担心效率提高带来的价格下降可能导致使用量增加，例如反弹效应。这些效应可以是直接的（例如节能汽车）或间接的（例如如航空旅行等高能耗活动）。在对反弹效应的最全面的综述之一中，Sorrell
    (2007) 指出等：直接和间接影响似乎在不同技术、部门和收入组之间存在巨大差异，并且无法很有把握地进行量化。然而，证据并未表明能源效率通常会导致全经济范围内能源消耗的增加。关于发展中国家能效提高引起的反弹效应的研究较少，这种效应可能至少达到
    10%。在能源服务需求远未饱和的发展中国家，预计反弹效应更大。


    来源：Sorrell, S. (2007) 《反弹效应：全经济能源节约的证据评估》，UKERC。www.ukerc.ac.uk


    电机：系统将电能转换为机械能。虽然对我们大多数人来说是不可见的，但它们对制造业的能源使用至关重要。如果电机无论负载如何都以满负荷运行，其效率就会低下。当电机可以通过变频和智能电机控制器将其功率使用调整为所需的输出时，它就是“智能”的。估计中国的电机系统占工业用电量的
    70%，效率比西方国家低 20%。到 2020 年，中国的工业电机系统预计将消耗电量的 34% 并产生碳排放的 10%，占全球排放量的 1–2%。通过提高电机系统的效率，中国的工业能源消耗可以减少
    10%，因为仅通过优化即可在 2020 年减少 2 亿吨二氧化碳排放——相当于荷兰 2006 年的排放量（气候集团 2008）。意识到这一潜力，中国政府实施了中国电机系统节能计划以实现其能效目标。如果没有此类倡议，不太进行必要的投资。


    建筑：建筑的能源消耗由两个因素驱动——能源强度和表面积。基于 ICT 的监测、反馈和优化工具可用于减少建筑生命周期的每个阶段，从设计、施工到使用和拆除。能源建模软件可以帮助建筑师确定设计能耗。建筑商可以使用软件将能源模型与实际施工进行比较。建筑完成后，ICT
    可以测量并基准化其性能，并将实际情况与预测的能效进行比较。住户可以安装建筑管理系统（BMS）来自动化照明、采暖和冷却等建筑功能。如果建筑用途发生变化，可以使用
    ICT 重新设计能源模型并衡量变化的影响。据估计，此类工具可以在 2020 年将建筑排放减少 15%（The）。


