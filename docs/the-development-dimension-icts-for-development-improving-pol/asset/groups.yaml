    ## 44 - 2. ICT 与国际发展的下一步在何方？


    社区广播以及在较小程度上的社区电视——是一种允许社区参与的非常本地化的广播形式。参与式视频正在增长——即由当地社区创作视频内容，并针对社区群体通过单场放映活动进行展示。我们还可能看到更多具有外部目的的内容创作。这意味着利用本地创建的数据来向外部团体提高意识、采取行动或募集资金，正如
    Kiva 和治疗行动联盟（Treatment Action Campaign）等组织目前所做那样。


    ## Box 2.6. 数据转换障碍的减少


    发展中国家面临的信息障碍之一是，有用的数据内容格式不对，无法有效使用。新技术正在减少这些障碍，并且通过 ICT4D 2.0 期间的创新将不断减少这些障碍。示例包括：


    - 通过对话和交互语音响应系统进行音频/数字转换，以提供发展信息，或用于识字培训的语音识别系统。

    - 文本/数字转换，直接通过扫描提高数据输入的速度和准确性，或实现转换为数字语音或盲文输出。

    - 将心理表征转换为数字地图，以捕捉当地知识。

    - 将物理测量数据转换为低成本传感器设备上的数字格式，例如血检、心率监测和农业管理。


    交互。在该领域曾关于“ICT 非 IT”引起过不小的波动——即“现在增加了 C（通信，Communication）”的技术讨论。尽管如此，但利用技术进行通信——至少是交互式通信——还是来得晚了。这可能是因为，在面对远程中心模型、交互式电子邮件时，穷人没有可以发信息的人。他们的社交网络被认为是小规模、局部且非正式的。事实上，手机的普及证明，这些网络已经通过农村到城市的迁移以及国际迁移得到了扩展。它们可能会通过新技术得到进一步扩展，从而增加边缘化大多数群体的社会资本。如何实现这一点，以及如何利用数字媒体的交互式通信能力，仍然是
    ICT4D 2.0 一项日益增长的任务。


    ## 2. ICT 与国际发展的下一步在何方？ – 45


    服务。正如 Web 模型从信息阶段转向交互阶段，再到交易阶段一样，ICT4D 近期也转向关注为贫困人口提供服务交易交付。这针对的是电子政府：允许通过远程中心支付账单，或帮助订购重要的证书。在经历了若干年问题重重的试点项目后，现在似乎正在产生可衡量的效益。然而，此类创新的影响范围有限，而
    ICT4D 2.0 似乎在推进“移动发展（m-development）”：寻找在不断增长的移动平台上挂相关服务的方法。目前，这意味着利用现有功能，例如使用短信处理各种任务，从提醒生活有艾滋病毒的人群服用抗转录病毒药物到监控选举。从这里开始，它意味着进一步的功能，例如“为没有银行账户的人提供银行服务”：使用手机为目前被排除在主流之外的人提供金融和银行服务。


    ## Box 2.7. 跨越千年发展目标（MDGs），实现韧性发展的 ICT


    自 ICT4D 1.0 开始以来，多年来进入发展议程的三个主要问题是：


    - 安全，包括恐怖主义。

    - 经济增长，包括其波动性和脆弱性（正如信贷危机后的衰退和缓慢恢复所证明的那）。

    - 环境可持续性，特别是气候变化。


    在 ICT4D 2.0 的中期，气候变化很可能成为发展议程中最大的项目。但所有三个问题都可以归类为“韧性发展”这一概念，并且它们为 ICT4D 2.0 的下一阶段驱动了一些问题。


    - ICT 如何确保在面对不安全、经济波动和气候变化等威胁时实现具有韧性的发展？

    - ICT 如何提供可持续的发展？


    毫无疑问，ICT 将成为发展议程的关键组成部分。例如，ICT 一直是恐怖主义组织和反恐主义活动的核心；基于 ICT 的企业以及企业对 ICT 的使用现在是经济增长和恢复的基石；ICT
    是“更绿色”技术不可或缺的一部分（尽管还有日益增长的电子垃圾问题）、气候变化制图以及协助社区适应气候变化的重要部分。


    ## 46 – 2. ICT 的下一步在何方？以及国际发展的下一步在何方？


    生产。ICT 似乎被地认为是向世界穷人提供信息和服务的工具。到目前为止较少被理解的是，穷人如何利用它们来创造新的收入和工作机会。这种新的生产观点部分包含了穷人作为数据内容参与者的角色，正如社区广播和参与式视频项目所示。在交付相关内容的同时，这些项目还通过让参与者成为参与式创造者，使他们能够控制
    21 世纪的这些手段，从而赋予他们力量。这现在可以进一步扩散到涵盖 Web 2.0 的一切吗？博主、整合者和 Wiki 编写可以从世界上最弱势的人群中选拔吗？这需要新的应用程序来实现吗？


    来自内容带来的赋权感和包容感是有价值的。但穷人的首要任务通常是收入和就业。我们在这里才开始意识到这些可能性。手机随处可见。穷人已经创造了既围绕技术（销售配件和预付卡）又通过技术（销售或接听电话）的收入。但是是否存在可以开发的
    ICT 赋能微型项目？这已经在社交和农村远程中心发生了，通过“社会外包”：即将 ICT 服务外包给贫困社区的社会企业。但 ICT4D 2.0 的首要任务将是构思新的应用程序和商业模式，利用不断增长的
    ICT 基础（手机、远程中心等）来创造就业。


    ## Box 2.8. ICT4D 与创意产业


    “创意经济”——“一个巨大且异质的领域，处理创意活动之间的相互作用，范围从传统手工艺、出版、音乐、视觉和表演艺术到更具技术密集性和面向服务的活动组，如电影、电视和广播、新媒体和设计”——被认为为发展中国家提供了日益增长的机会。这些国家已经拥有丰富的传统创意产业，并正在为新创意产业提供低成本基础。


    在 ICT4D 2.0 期间，数字技术可能会为该领域这两个部分的增长提供基础。ICT 已经应用于传统领域，例如手工艺品的更广泛营销以及音乐的录制和销售。ICT
    也是新媒体工作的基石，包括动画、游戏等领域外包工作的增长。


    ## 2. ICT 与国际发展的下一步在何方？ – 47


    ## ICT4D 2.0 的新创新模型


    Box 2.7 中讨论的背后是关于技术和发展的两种不同观点——或者说，是连续体上的两个极端。在的一端，我们有“被动扩散”观点。以移动电话的快速传播为借鉴，这种观点认为，如果
    ICT 对穷人具有发展价值，那么私人公司对利润的追求加上穷人对价值的追求将使其成为现实。任何从外部干预的尝试都是愚蠢且浪费的：一种强加的不适当事物，只会导致混乱的监管。相反，“主动创新”观点认为市场无法交付——或者对穷人来说交付太慢。因此，需要以新创新的形式进行干预以帮助实现目标。


    本章没有详细比较这些观点。在 ICT4D 1.0 期间，主动创新确实遭受了打击。人们认为国际援助机构资助了不可持续的事物，并且围绕供应型发展的远程中心点忙碌，而忽视了市场驱动的移动浪潮。另一方面，非市场干预是许多随后市场化技术的根源。从第一批电脑到互联网的起源，再到
    OLPC 所青睐的竞争对手，主动创新一直是被动扩散的基础。最后，当私人公司将金字塔底部的概念融入心中并开始专门为贫困消费者设计产品时，两种观点汇合了（随着他们改变了术语从“发展中国家”变为“新兴市场”）。


    我们得出的结论是，主动创新的某些元素可能会留在 ICT4D 领域。在这种，出现了两个关键问题：


    首先，创新什么。正如 OLPC 经验所示，专门针对金字塔底端的大规模硬件和操作系统创新是风险巨大的创业，属于极勇敢或极愚蠢的人。在温和程度上，这适用于大型私人部门参与。相反，大多数
    ICT4D 2.0 创新似乎是在较小规模上，无论是通过适应还是应用现有技术发生的。另一种方式是，随着从新的电信/电力基础设施移动到新的硬件、软件、新的数据内容，到新的商业模式和流程时，创新似乎更加可行（尽管可能更本地化）。


    其次，如何创新。在创新过程方面，我们可以诱导出三种不同的模式，在这里标记为实验室型（亲贫）、协作型（并贫）和草根型（依贫）。

