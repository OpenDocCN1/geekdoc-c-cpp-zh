    # Figure 1.6: Relationship between technology use and educational attainment in
    science (2006 PISA survey)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_27_0.png)


    Source: workshop presentation by Frances Pedro and William Thomas, OECD.


    The real challenge is to develop better measurement. Students in OECD countries
    are already exposed to an information-rich environment and therefore improvements
    from use of ICTs in schools are likely to be marginal. One might expect a bigger
    impact in developing countries. A particular challenge is to understand how computers
    are used in school. For the most part, they seem to be aimed at developing ICT
    skills rather than using ICTs as a medium for learning in other subjects.


    There are a huge number of initiatives in the field of ICT4E. They do not necessarily
    come from donors, but from NGOs and national governments. The education donor
    community has been quite conservative in their education development policies.
    However, the demand for ICT4E in developing countries is growing quickly.


    Access from developed countries to Internet knowledge resources such as Wikipedia
    or information search has greatly facilitated learning. The lack of access in
    developing countries means a growing knowledge gap is inevitable. Seventy cent
    or more of the population in OECD countries have access to the Internet, while
    in close to 100 developing countries the figure is less than 10%. In developing
    countries, the primary platform for access is the mobile phone, with mobiles increasingly
    used for e-learning and video instruction. Mobile computing platforms coming down
    in and becoming widely available in developing countries will have a huge impact
    on access.'
  - '[PAGE 28]


    The rapid growth of open source learning management systems and availability of
    open education resources driven by initiatives like the Massachusetts Institute
    of Technology’s OpenCourseWare are changing how people think about the value of
    educational content – that it is in the delivery rather than the IPR of the course
    content itself. Trends in technology – e.g. rapid improvement in the capacity
    of memory storage compared with relatively slow improvement in connectivity –
    suggest that more educational content could be stored locally rather than accessed
    over expensive networks.


    A variation on Solow’s paradox might say, “We see the computer age everywhere
    in schools, except in educational improvement”. This suggests that we need to
    rethink how we use technology in schools. The new digital divide is not about
    access but about differences in the type and quality of use.'
