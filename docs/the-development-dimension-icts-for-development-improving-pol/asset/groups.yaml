    ICT 的投资——尤其是移动基础设施——要多得多；例如，非洲每年在移动领域的投入达 100 亿美元。而整体数字则更高。例如，2007 年，中低收入国家在 ICT
    支出占 GDP 的约 6%，总量超过 8000 亿美元。


    ## 实施 ICT4D 2.0


    **新参与者。** ICT4D 1.0 大程度上由国际或国家非政府组织（NGO）实施。它们将在 ICT4D 2.0 中继续发挥关键作用，但似乎还有以下者的加入：


    - **私营公司。** 随着 ICT4D 投资和基础设施的增长，越来越多的商业实施者加入竞争，与典型的捐赠资助顾问并肩作战。除了上述提到的公司外，还包括南非的
    Fundamento 和菲律宾的 Globe 等公司，它们作为“移动开发”（m-development）应用的基础。在基层层面，可能会更加注重微型企业，因此，关于电话中心（telecentres）的讨论可能会减少，而关于微咖啡馆（microcafés）的讨论会增加。


    - **伙伴关系。** “伙伴关系”一直是发展领域的热词，但它们推动了 ICT4D 程。存在公私伙伴关系，例如黎巴嫩电子教育、电子政府、电子企业计划中政府与私营实施者之间的合作。还有多利益相关者伙伴，例如为实施联合国西亚经济社会委员会“智慧社区”项目而建立的伙伴，其成员来自国家和地方政府、当地非政府组织和社区代表。


    - **如今的虚拟化。** 虽然有些“出乎意料”，但虚拟化允许活动远程进行。Kiva 允许连接互联网的人向发展中国家的企业家提供贷款。在线志愿者允许对 ICT4D
    项目进行类似的虚拟化贡献。


    随着新参与者及其新组织形式在 ICT4D 中发挥更大的作用，认识到他们带来了不同的利益以及与用户社区不同的关系将是非常关重要的。


    **新方法：从蓝图到过程。** ICT4D 1.0 项目失败的一些关键原因可以总结出来。这些包括：完全基于设计者理解而非用户的项目设计；极其僵化的项目实施，不偏离初始的自上而下计划；无法建立能够帮助项目的适当知识；对外部资源的狭隘依赖；以及糟糕的项目领导。这些也是对发展项目中“蓝图”方法的共同批评，该方法表明
    ICT4D 2.0 项目可以从采取更多“过程”式的方法中获益。


    ICT4D 项目的过程化方法应包括：


    - 受益者参与 ICT4D 项目的设计和/或建设。

    - ICT4D 项目实施过程中的灵活性和即兴发挥。

    - 为了改进 ICT4D 项目的实施而进行的学习（包括从过去的经验中学习以及项目期间的迭代边做边学）。

    - 利用和建设当地能力，包括当地机构的能力。

    - ICT4D 项目的胜任领导，能够促进其他四个要素。


    ## 框 2.11. ICT4D 项目中的“需求”与“想要”


    在 ICT4D 1.0 期间，项目设计者往往将 ICT 应用侧重于自上而下的需求确定，而非自下而上的意愿表达。项目是根据标准信息需求模板设计的，该模板认为社区需要获得关于健康、教育、治理等方面的更好信息。然而，当社区成员自由讨论他们想要从
    ICT 中获得什么时，优先事项通常是获得新收入和就业的帮助，以及娱乐的混合。


    南印度的 Namma Dhwani 项目阐明了这种对比。社区广播扬声器布满了整个村庄的线路，以广播“发展性”信息。村民对此并不满意，在某个时刻，这些电线连接到了移动系统，在当地节日期间，甘尼神（Lord
    Ganesha）塑像在村庄巡游时播放音乐。前者 ICT 使用方式被视为社区“需要”的；而后者是他们“想要”的。


    如果项目关注“需求”，可能会面临使用率低（从而影响较小）、被淹没和缺乏可持续性的问题。而如果项目（例如印度的一些 N-Logue 亭亭）允许 ICT 使用关注“想要”，情况则往往会相反。


    如果需要达成一种平衡，那么在 ICT4D 2.0 中，一种较少家长式的项目受益人观点将非常有价值，即理解满足“想要”——正如已经提到的，我们认为这可以用阿马蒂亚·森的“作为自由的发展”来理解——至少是可以发展意义的。


    **新技术：设计与现实的差距。** 对 ICT4D 1.0 项目失败的分析还表明，可以使用单一的基础模型来解释失败：设计-现实差距模型。这证明了失败与设计预期与项目及其背景实际现实之间的巨大差距有关。对于有问题的项目，这种巨大的差距出现在某一组维度中的一个或多个维度上，这些维度由
    ITPOSOS 缩写总结，并如图 2.3 所示。


    根据该模型，识别 ICT4D 项目风险的技术可以在项目之前、期间和之后应用。在所有三个时间点，获得的得分都可以用于风险识别。在前两种情况下，它们还可用于预测可能的结果，并识别风险缓解措施。


    此类行动可能是针对特定维度的：例如改变技术设计，或提高现有技能的水平。这些行动也可以更具通用性，从而作为 ICT4D 2.0 良好实践的通用指南。示例包括：


    - 绘制项目现实：找到揭项目背景内真实情况并将其整合到实施过程的方法。一个示例是使用“丰富图”（rich pictures）等软系统技术，这些技术在绘制现实方面记录良好。

    - 使用混合型人才：混合型 ICT4D 专业人士是指那些结合了技术、系统和发展理解的人（图 2.5），有助于缩小差距。

    - 渐进式方法：将整个 ICT4D 项目分解为较小的步骤，从而减少在任何时候经历的设计与现实之间的差距。


    ## 图 2.3：ICT4D 项目中的设计—现实差距


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_56_0.png)


    来源：Richard Heeks。


