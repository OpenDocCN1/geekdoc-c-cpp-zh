    friends back home, spending USD 48 per month to keep in touch, as compared with
    USD 15 by Indians.


    Bangladeshi migrants mostly work West and East/Southeast Asia. On average, they
    earn approximately USD 485 a month, of which 203 is sent home. The most popular
