    # Rebound effects? (continued)


    Energy efficiency may be encouraged through policies that raise energy prices,
    such as carbon taxes, or through non-price policies such as building regulations.
    Both should continue to play an important role in energy and climate policy. However,
    where rebound effects are expected to be large, there may be a greater need for
    policies that increase energy prices.


    Source: Sorrell, S. (2007) The Rebound Effect: An Assessment of the Evidence for
    Economy-wide Energy Savings from Improved Energy Efficiency, UKERC. www.ukerc.ac.uk.


    Motor: systems convert electricity into mechanical power. While invisible to most
    of us, they are crucial to the manufacturing sector’s energy use. Motors can be
    inefficient if they operate at full capacity regardless of load. A motor is “smart”
    when it can adjust its power usage to a required output through a variable speed
    and intelligent motor controller. It is estimated that motor systems in China
    represent 70% of total industry electricity consumption and are 20% less efficient
    than those in Western countries. By 2020, industrial motor systems in China will
    be responsible for an estimated 34% of power consumption and 10% of carbon emissions,
    or 1–2% of global emissions. Industrial energy use in China could be reduced by
    10% by improving the efficiency of motor systems, as their optimisation alone
    could reduce China’s emissions by 200 MTCoe by 2020 – comparable to 2006 emissions
    from the Netherlands (The Climate Group 2008). Recognising this potential, China’s
    government has implemented the China Motor Systems Energy Conservation Program
    to reach its energy efficiency targets. It is unlikely that the necessary investments
    would be made without such initiatives.


    Buildings: Energy consumption in buildings is driven by two factors – energy intensity
    and surface area. ICT-based monitoring, feedback and optimisation tools can be
    used to reduce at every stage of a building’s life cycle, from design and construction
    to use and demolition. Energy modelling software can help architects determine
    how design energy use. Builders can use software to compare energy models with
    actual construction. Once the building is complete, ICTs can measure and benchmark
    its performance and compare actual to predicted energy efficiency. Occupants can
    install a building management system (BMS) to automate building functions such
    as lighting, heating and cooling, and if a building undergoes a change of use,
    ICTs can be used to redesign its energy model and measure the impacts of the change.
    It has been estimated that such tools could reduce emissions from buildings by
    15% by 2020 (The)


