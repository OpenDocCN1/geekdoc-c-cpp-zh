    # 4. WHAT ROLE SHOULD GOVERNMENTS PLAY IN BROADBAND DEVELOPMENT? – 125


    There are, however, market failures in broadband. As with many other markets,
    they concern the provision of public infrastructure. The structure of the broadband
    market itself has sometimes created problems for the development of service. The
    most common form of market failure is the persistence of monopoly-type structures
    in the provision of broadband infrastructure even when no legal monopoly exists.
    In many countries, the dominance of incumbent public telecommunications operators
    is one of the key obstacles to the development of effective competition. Other
    market failures may be associated with lack of economies of scale. Difficulties
    in obtaining legal permission to operate, inefficient allocation of radio spectrum,
    poor information and limited capital markets are all further examples of market
    failures.


    Market failures in the ICT sector have been widely recognised by governments around
    the world. They are typically addressed through regulatory policy: liberalising
    licences facilitating access to radio spectrum and regulating access to dominant
    operators’ networks are all corners of policies that have provided the foundation
    for the rapid expansion of broadband services. In Europe and some developing countries,
    broadband policies have focused on providing regulated access to the incumbent
    operator’s network (“unbundling the local loop”). Other economies have focused
    on providing low-cost access to existing infrastructure facilities such energy
    and transport networks.


    In France, for instance, a “ladder of investment” approach can be seen in the
    evolution of the broadband market At the lowest “rung” is resale of the incumbent’s
    capacity, which required interconnection at only one point in a network. Later,
    bitstream access was offered at a regional level, whereby the entrant interconnected
    at multiple regional points and constructed a backbone network. As full unbundling
    of the local loop mandated, full-service operators such as Iliad (free.fr) further
    generated growth in direct competition to the incumbent, France Télécom (Figure
    4.5) while building their own networks.'
