    # Executive Summary


    The Organisation for Economic Co-operation and Development (OECD) and the World
    Bank''s Information for Development (infoDev) programme joined forces to organise
    a workshop on Policy Coherence in the Application of Information and Communication
    Technologies for Development (ICT4D), held 10-11 September 2009 in Paris. There
    were a number of initiatives that led to this meeting, including:


    +   - The OECD''s Policy Coherence for Development initiative (www.oecd.org/development/policycoherence);

    - The OECD Summit on the Future of the Internet Economy, held in Seoul in May
    2008 (www.oecd.org/futureinternet);

    - The 2009 edition of the World Bank''s Information and Communication for Development
    report, which looks at extending reach and increasing impact;

    - The OECD/World Bank workshop on Innovation and Sustainable Growth in a Globalised
    World, held in November 2008, which identified ICTs as a General Purpose Technology
    (GPT) but also highlighted the need for a co-ordinated and coherent approach to
    maximise the effectiveness of ICTs as a tool for development.


    The workshop identified keys for action:


    **Access to ICTs and the Internet:** Lack of access and capacity are still major
    constraints in promoting the use of ICTs for development. There is a need to improve
    the coherence of different sectoral policies, such as taxation and competition,
    to promote wider access.


    **Broadband policy development:** Governments need to develop clear broadband
    strategies, as broadband''s importance as an economic stimulus and the social
    benefits it brings are widely accepted. Strategies should provide balance between
    government intervention and private sector investment and ensure a strong regulatory
    environment to allow competition to flourish.'
  - '[PAGE 13]


    # 12 – EXECUTIVE SUMMARY


    Strategies should recognise the importance of rolling out fibre in its own right
    also in its role as a backbone network to support wireless. In many developing
    countries broadband access will be via mobiles, so governments should make adequate
    spectrum available at reasonable prices. Governments should themselves take full
    advantage of broadband by making their services available online, increasing awareness
    and improving access.


    Mobile payments: True banking transactions (m-banking) should be distinguished
    from basic money transfers (m-payments). There is a need to reconcile the need
    to regulate international money transactions (e.g. to prevent money laundering
    or terrorism financing) with promoting the use of mobiles for affordable access
    to money for the poor. Collecting existing best practices would be a useful way
    to share knowledge and address current challenges.


    Security considerations: Key challenges include a co-ordinated approach, lack
    of implementation of existing best practices and lack of cross-border co-operation.
    Awareness needs to be raised and an appropriate balance between security and privacy
    concerns. Capacity-building in particular is needed to provide a flow of newly
    educated security professionals in developing countries who can help co-ordinate
    international action.


    ICTs for the environment: Opportunities for ICTs lie not only in reducing their
    share of greenhouse emissions, but also in using them to reduce emissions in other
    sectors and to address systemic change and rebound effects. Intellectual property
    rights, technology transfer and local capacity-building warrant particular attention.
    There is scope for improving ICT performance throughout the whole life cycle,
    from purchase to disposal, with potential for governments to lead by example.


    ICTs for education: A main focus should be on improving learning and education
    ICT skills/resources available for teachers as for students. There is a need for
    better information about what is happening at the national level as well as a
    better understanding of technological and pedagogical trends, reflecting the overall
    need for better empirical evidence as to the benefits of investment in ICTs for
    education (ICT4E) and their broader on society.


    The workshop proceedings, including the agenda, presentations and background documents,
    are available at: www.oecd.org/ict/4d.'
