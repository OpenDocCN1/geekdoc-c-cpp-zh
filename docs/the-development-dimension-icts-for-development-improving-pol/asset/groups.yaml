    \n# 发展维度\n面向发展的 ICT\n提高政策协调性\n\n信息通信技术（ICTs）对于减少贫困、改善医疗和教育服务的获取，以及为贫困人口创造新的收入和就业来源至关重要。能够获取和使用\
    \ ICT 已成为驱动竞争力、经济增长和社会发展的主要因素。在过去的十年中，ICT（尤其是手机）为思想和意见的自由传播辟了新渠道，促进了民主和人权。\n\n\
    OECD 和 infoDev 在 2009 年 9 月 10-11 日的一次研讨会上合作，探讨了减少发展中国之间在 ICT 获取和使用差异方面的一些主要挑战。研讨会讨论了更具协调性和协作性的最佳实践，以支持旨在实现千年发展目标的减贫工作。\n\
    \n在提高政策协调性方面仍有大量工作要做，并且需要与伙伴国家积极互动。充分发挥 ICT 的作用需要将其视为发展创新的一部分，而不仅仅是另一种发展工具。\n\n\
    本出版物探讨了 ICT 作为其使用前提的情况：宽带互联网接入以及政府在提供接入方面的作用；移动支付的发展；ICT 安全问题；用于改善环境的 ICT；以及 ICT\
    \ 在教育中的相对优先级。\n\n更多信息\n\n- OECD/infoDev 面向发展的 ICT 研讨会：www.oecd.org/ICT/4D\n- OECD\
    \ 关于发展中政策协调性的工作：www.oecd.org/development/policycoherence\n- infoDev：www.infoDev.org\n\
