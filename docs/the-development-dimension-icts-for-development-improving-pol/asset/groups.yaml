    ## 5. REGULATORY ISSUES AROUND MOBILE BANKING – 145


    security and controls to its customers. At the end of the process, M-PESA was
    given a clean bill of health, and continues to operate.


    It is only a matter of time before M-PESA is brought under the full regulatory
    umbrella of Kenya’s laws, and it will likely be regulated as electronic money
    issuer. This is expected to be some short of full regulation as a bank – M-PESA
    does not offer credit or lend out (multiples of) customers’ funds. Europe’s approach
    in creating a separate regulatory category “payment institutions” – and separating
    the regulation of payment services from that of credit institutions could be a
    very useful model in this.


    In what might be perceived as a quid pro quo, Kenya’s banks will be allowed to
    offer their services through agents rather than being required to limit them to
    their own branches, with the substantial costs entails. Again, this is nothing
    new: this approach has reaped substantial benefits for both banks and customers
    in a number of countries, with Brazil having a particularly high profile in this
    regard. If banks grant this opportunity to Kenyans, especially if they can begin
    to see M-PESA as an opportunity rather than a competitor. If banks chose to offer
    their services – loans, savings accounts, etc. – to M-PESA customers via mobile
    phone, they would instantly have access to more than 11 000 access points across
    Kenya, with cash handling and movements in and out of their accounts carried out
    by M-PESA, potentially saving the banks significant amounts of money.


    Meanwhile, in India, the development of the branchless banking sector has stalled.
    Around a year ago, the Reserve Bank of India introduced regulatory changes for
    the sector, as well as requiring that schemes be operated by a bank, also introduced
    a requirement for end-to-end encryption (something only a mobile operator can
    offer using current technology), thus creating an insoluble problem. This effectively
    closed the door for all new market entrants, and a number of schemes that were
    close to launch were cancelled or put on hold. The Indian situation de facto could
    be contrasted with that of Mexico, where the central bank has said that, including
    banks and retailers, can open mobile banking accounts for their customers because
    agent networks are seen as key to financial inclusion given the scarcity of branches
    in rural and semi-urban areas.


    The establishment of the Alliance for Financial Inclusion (AFI) at the end of
    2008, funded by the Bill & Melinda Gates Foundation, is a positive development.
    As a forum for financial regulators and others representing emerging markets,
    it presents an opportunity for policy-makers to review issues around areas as
    branchless banking.


    ## Principal technical issues


    There are one or two technical issues branchless banking solutions that impinge
    on their regulation. They revolve around security and concern the mobile handset''s
    SIM and end-to-end encryption, essential for bank-grade security of transactions.


    As technology stands today, there is only one way of providing end-to-end encryption
    for branchless banking: using the SIM. As SIMs are under the control of the mobile
    operator, this effectively means that only a mobile operator-led scheme can offer
    full security. There are two means of resolving this situation:


    - Relaxation of SIM controls. It has been argued that the SIM will, at some point
    in the relatively near future, achieve the status of a public utility. This would
    imply that complete control of the SIM should be taken away from mobile operators
    and some portion of its capabilities made available, through mobile operators,
    to third parties.

    - Relaxation of security. Without access to the SIM, comprehensive security is
    not possible – but it is unacceptable that mobile operators should be the sole
    providers of branchless banking solutions. Perhaps the lower security of SIM-less
    schemes should be accepted, subject to suitable controls as a maximum number of
    customers, a smaller maximum transaction size and enhanced server-based controls.


    These are not purely technical issues. They demonstrate the intricate connections
    between issues of public policy and technical minutiae, and that neither should
    be fixed without consideration for the other.


    ## Principal regulatory issues


    The principal issues around branchless banking and its regulation can be summarised
    as:


    - Risk of a high-profile failure. If a high-profile scheme were to fail, the reputation
    of all branchless banking schemes would inevitably be sullied and the sector could
    be set back by years.

    - Non-bank institutions leading schemes. Provided a scheme can demonstrate regulator-suitable
    visibility and necessary levers, why must it be bank-led? After all, one trusts
    a mobile operator not to lend their money to an unidentified third party – the
    same cannot necessarily be said of banks. What’s more, a mobile operator can offer
    geographical traceability of transactions that a bank never could. A customer
    sends money over his or her phone, so the mobile operator knows exactly to whom
    it was sent and where and when it was received.

    - Suitability of KYC regulation. KYC requirements are undoubtedly holding back
    the branchless banking sector. While they are, in some form, absolutely necessary,
    consideration should be given to whether their current application is appropriate.
    For example, should someone sending USD 20 per week to relatives up-country be
    subjected to the same KYC checks as someone who wants to send USD 10? Perhaps
    a more limited form of KYC could be applied to the poorest customers, up to a
    certain transaction threshold, at which point full KYC would apply. It is difficult
    to imagine how a relaxation of regulation in this type of security would increase
    the risk of terrorist attacks.


    Regulators in general, and the AFI in particular, need to give consideration to
    these issues. They also need to be convinced that branchless banking schemes are
    trustworthy, i.e.:


    - that the appropriate reporting channels are in place and that the regulator

    - that the scheme is auditable

    - that the scheme is properly secure


