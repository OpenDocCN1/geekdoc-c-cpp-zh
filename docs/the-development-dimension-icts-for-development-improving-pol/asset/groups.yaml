    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5)

    来源：Frances Pedro 和 William Thomas 在 OECD 的研讨会演示。


    真正的挑战是开发更好的衡量方法。经合组织国家的学生已经暴露在信息丰富的环境中，因此使用 ICT 带来的改进可能是微乎其微的。人们可能会在发展中国家看到更大的影响。一个特别挑战是理解电脑在学校是如何被使用的。在大多数情况下，它们似乎旨在开发
    ICT 技能，而不是将 ICT 作为其他学科学习的媒介。


