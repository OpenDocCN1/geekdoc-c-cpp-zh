    ## 84 - 3. 发展中国家如何参与全球互联网经济


    这种良好的表现是如何实现的？如图3.4所示，流入巴基斯坦电信行业的外商直接投资（FDI）在2002-07年间大幅增加。从2002年的微不足道的604万美元增加到2006年的19亿0506.0万美元（占外商直接投资总额的50%以上），并在2007年增加到18亿2425.0万美元（接近40%）。重大的改革在2004年开始生效，其中通过了极具典范的许可框架并举行了移动许可证拍卖。从那时起，移动业务呈爆炸式增长，外商直接投资也是如此。


    ## 图 3.4: 2002-07年巴基斯坦主要部门的外商投资


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_85_0.png)


    注：2004年电力部门的外商直接投资为负1,424万美元。


    来源：巴基斯坦国家银行（2008）经济数据。检索自http://www.sbp.org.pk/ecodata/NIFP_Arch/index.asp


    ## 移动业务成功故事对宽带的启示


    在国内，对于全球很大一部分贫人口来说，连接性并不意味着网络使用率低。事实上，印度的平均使用分钟是OECD国家的两倍。印度网络低廉的价格和高使用率指向了过去十年连接数十亿人的成功的核心解释：发现并应用了“廉价电信网络模型”，这是一种全新的南亚模型，类似于亚洲航空和瑞航等航空公司实施的廉价航空模型。


    ## 廉价电信网络模型


    廉价电信网络模型最早出现在孟加拉国、印度、巴基斯坦和斯里兰卡等南亚市场，事实证明了它们的总拥有成本在2007年是最低，低于5美元，而77个新兴经济体的平均成本为13.15美元。南亚地区的运营商在息税、税前、折旧和摊销前利润（EBITDA）方面往往是盈利的，尽管存在相当大的波动。


    表 3.1: 选定南亚市场的运营商收入、EBITDA及EBITDA利润率（2005）


    | 国家 | 收入（美元） | EBITDA（美元） | EBITDA利润率 (%) |

    |---|---|---|---|

    | 斯里兰卡 | 259,041,928 | 124,833,464 | 48 |

    | 印度 | 26,723,674,194 | 9,938,340,523 | 37 |

    | (2007) | (2007) | (2007) | |

    | 孟加拉国* | 655,000,000 | 344,500,000 | 54 |

    | 巴基斯坦 | 978,802,178 | n/a | n/a |


    *数据仅针对三个主要的移动服务提供商：Graphphone、Aktel和Banglink，它们在2005年的总市场份额达到93%。


    来源：斯里兰卡：公司年度报告、公司新闻稿；Malik, P. (2008),《印度电信监管与政策环境：2008年TRE调查结果与分析》；孟加拉国电信监管委员会（2007）年度报告。美林银行报告的孟加拉国收入和EBITDA利润率不同。巴基斯坦电信管理局（2005），年度报告。


    该地区复杂的政策和监管环境以及客户较低的购买力似乎迫使运营商进行创新，既包括将运营成本降至最低，也包括为每月仅使用几分钟的“长尾”客户服务。后者的创新依赖于降低与预付费客户相关的交易成本，预付费客户占了Teleuse@BOP研究中SEC
    D和E细段的绝大多数（图3.5）。预付费这一简单事实避免了或或不可避免产生的产生和传输月账单费用，降低了整体交易成本，在每位客户收入非常低时，这是一项非常有价值的减少。


    ## 图 3.5: 金字塔底层的预付费移动连接（社会经济分类D和E级移动所有者的百分比）


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_87_0.png)


    来源：LINREasia (2009) Teleuse@BOP3调查发现。


    预付费允许客户在能够或需要使用服务时付费。这符合穷人的需求，他们许多人有不稳定的收入模式。低面值充值卡和特殊的电子充值引入提供了最大的支付灵活性，这对于该模式的运作具有特殊意义。


    本质上，廉价电信业务模式是由激烈竞争驱动的创新，并作为对南亚国家严格的监管环境和低购买力的回应。如果没有竞争，这种创新就不会发生。该模型在尼泊尔得到了证实，该国拥有2900万人口，与南亚国家有许多相似之处。尼泊尔2008年的移动价格相对较高，但在2009年，尽管没有授予执照，所有移动运营商的价格都大幅下降。原因被发现不是传统的类型，而是一种准入形式，某些无线接入进入了该市场。


    ## 宽带的启示


    廉价电信网络模型带给我们什么启示？期望全天候宽带连接数十亿穷人是现实的，正如传统的电话业务成功连接了穷人一样，这在印度恒河平原、非洲和印度洋地区是至关重要的，那里有巨大的改进空间，特别是运营成本必须大幅降低。


