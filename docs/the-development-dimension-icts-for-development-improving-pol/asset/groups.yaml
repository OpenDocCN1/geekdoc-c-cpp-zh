    # 前言


    信息和通信技术（ICTs）对于改善医疗和教育服务的获取以及为贫困人口创造新的收入和就业机会至关重要。能够获取和使用ICTs已成为推动竞争力、经济增长和社会发展的主要因素。特别是手机，为连接开辟了新通道，并对思想意见的自由流动做出贡献。


    本出版物基于“促进发展的信息通信技术应用中的政策一致性”研讨会的讨论论文，该会议由OECD和infoDev/世界银行联合举办，于2009年9月11-12日在巴黎举行。该工作由OECD的Raili
    Lahalnampi、Sam Paltridge、Karine Prset以及infoDev/世界银行的Tim Kelly启动并协调。


    研讨会探讨了缩小国家间ICTs差距及ICTs使用差异的一些主要挑战。它还为更具一致性和协作性的方法提供了最佳实践建议，以支持减贫和实现千年发展目标。


    感谢以下人士贡献：Tim Kelly（infoDev/世界银行首席ICT政策专家）、Richard Heeks（曼彻斯特大学发展信息中心主任）、Rohan
    Samarajiva（LRNEAsia主席兼首席执行官）、Victor Mulas（顾问）、Siddhartha Raja、Christine Zhen-Wei
    Qiang（经济学家）以及Mark Williams（高级经济学家），均来自世界银行全球信息技术部；Paul Makin（Consult Hyperion首席顾问）、John（Consult
    Hyperion首席顾问）、以及John Watson。本出版物由……编制和编辑。


