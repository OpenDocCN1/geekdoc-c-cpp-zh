    # 第一章


    ## 为什么 ICT 对发展至关重要


    要充分发挥信息与通信技术（ICTs）对发展的全部效益，需要将其视为一种发展创新，而不仅仅是另一种发展工具。本章概述了在 OECD/infoDev 研讨会上讨论的六种支持
    ICT的应用，概述了每种应用如何为发展做出贡献，并介绍了目前实施这些技术的国家所面临的一些挑战。


    ## 14 - 1. 为什么 ICT 对发展至关重要


    “发展中 ICT 应用政策协调性”研讨会的六场实质性会议讨论了信息通信技术促进发展（ICT4D）中政策协调性问题的不同方面，以及加速减贫进展、减少包括数字鸿沟在内的不平等以及实现千年发展目标的需求。每场会议都包含了背景报告的陈述，其中部分报告以后续章节的形式在此呈现。特别是第二章提出了关键问题以及
    ICT4D 迄今的演变。


    ## ICT 和互联网的接入


    全球移动用户数量已超过 40 亿，其中发展中国家占该数字的三分二。


    图 1.1：全球手机数量，2000-2008


    | | | | | | | | | | | |

    |---|---|---|---|---|---|---|---|---|---|---|

    | 4,500 | | | | | | | | | | |

    | 4,000 | | | | | | | | | | |

    | 3,500 | | 发展中国家 | | | | | | | |

    | 3,000 | | | 发达国家 | | | | | | | |

    | 2,500 | | | | | | | | | | |

    | 2,000 | | | | | | | | | | | |

    | 1,500 | | | | | | | | | | | |

    | 1,000 | | | | | | | | | | | |

    | 500 | | | | | | | | | | | |

    | 0 | 2000 | 2001 | 2002 | 2003 | 2004 | 2005 | 2006 | 2007 | 2008 |


    来源：Mohsen Khalil，世界银行/国际金融公司全球 ICT 部门（GICT）负责人。


    ## I. 为什么 ICT 对发展至关重要 – 15


    事实上，许多发展经济体在 SIM 卡拥有上已经超过了 OECD 对应国家，阿联酋是第一个人均拥有两张 SIM 卡的经济。然而，在宽带领域，传统的数字鸿沟仍然存在。发展中国家与发达国家之间宽带单位成本的差异加强了这一点，后者的价格可能是者的十倍。


    手机变得越来越便宜且容易获得，有助于创造新的收入来源和就业机会，并鼓励了满足当地需求的创新。另一方面，关键基础设施可能不存在或未被充分利用。全球超过一半的国家没有互联网交换点（IXP），本地流量无法在此进行交换，因此在通过发达国家进行传输时面临着较高的费用。


    网际协议（IP）地址对互联网的发展至关重要，因为所有连接的设备——包括路由器、计算机或 IP 电话——必须拥有 IP 地址。非洲互联网使用的增长正在推动对
    IP 地址的需求：目前的比例仅为每个用户 0.36 个互联网地址，仅占全球 IP 地址的 3%（而世界人口占 10%）。在非洲内部，这种差异更加显著，几乎三分之二的
    IPv4 地址已分配给南非，因为它在互联网早期发展中发挥了重要作用。


    ## 图 1.2：非洲的 IPv4 地址分布


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_16_0.png)


    来源：Adiel Akplogan 演讲，AfricNic 执行官及数字资源组织主席。


    全球 IPv4 地址耗尽可能早在 2011 年就会发生，非洲则可能在 2013-2014 年发生，这将影响连接互联网的新用户以及需要 IP 地址进行增长的企业。迄为止，较新版本互联网协议
    IPv6 的部署远慢于预期。


    大多数非洲国家仍然依赖卫星连接，国际带宽通常按每月每 Mb 支付 2000-500 美元。该地区传统上由两根电缆（SAT3 和 SAFE）提供服务，但它们的定价也很高。最近，两条服务东非地区的新电缆（SEACOM
    和 TEAMS）上线，并将很快加入第三根电缆（EASSy）。这些对定价无疑产生积极影响，但其他挑战——如缺乏互联、高运营成本以及法律和监管障碍——也是因素。


    互联网流量交换有两种基本模型：对等连接（peering）和中转（transit）。前者对互联网服务提供商更有利。因此，最佳解决方案是开发本地互联网交换点（IXPs）。这只需要一台交换机，基础设施成本相对较低。这可以保持较高比例的流量负载，并促进增值服务的提供。例如，Google
    的流量在本地进行对等，回传互联网成本通常会减少约 40%。这将平均传输延迟从 1.2 秒减少到 100 毫秒以下。这种性能提升的连锁效应惠及了其他发展应用。


    满足发展中世界挑战的一种解决方案是第三章提出的“预算网络电信模型”。这种模型在某些国家已是成功的。


    ## 带宽政策


    全球范围内，带流量的用户可能超过 50 亿。在某些国家，带宽可以被视为一种公共产品。


    图 1.3：发达国家和发展中国体的连接性评分卡


