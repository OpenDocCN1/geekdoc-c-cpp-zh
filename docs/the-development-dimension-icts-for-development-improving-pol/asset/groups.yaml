    # Box 2.12. Teaching ICT4D 2.0


    There is a small, but growing, number of formal training programmes dealing with
    ICT4D.


    The one-year MSc in ICTs for Development at the University of Manchester explicitly
    uses the Figure 2.5 as the basis for its training foundation. The experience has
    been that many participants already have a good foundation of computer science
    skills, so these are provided only as an option.


    The focus of the core curriculum is threefold on three areas:


    +   - Development concepts: foundational frameworks of knowledge for understanding
    development processes and structures.


    +   - Development project practice: knowledge and skills related to managing projects
    in a development setting.


    +   - Information systems: knowledge and skills for understanding information
    and information systems, and their construction and implementation within development
    settings.


    The curriculum also links the different domains through a capstone element on
    ICTs and socio-economic development, and a set of field visits to ICT4D projects
    in a developing country. In teaching this element, and other ICT4D curricula have
    often structured themselves around the ability to achieve MDG-like goals (with
    issues such as economic growth added). A question for ICT4D 2.0 remains whether
    this “integrated approach” (Figure 2.6) is most appropriate, or whether there
    is a place for a more transformational “Development 2.0” curriculum.


    Strategically, it means that we also need to develop hybrids in traditional in
    ICT4D policy- and programme-making. We can chart this requirement by tracing a
    chronology of views about ICTs and development, as shown in Figure 2.6.


    We can use this to reinterpret our early chronology of technology and development.
    Until the 1990s – what we labelled ICT4D 0.0 – most development programme- and
    policy-makers tended to either ignore ICT (as it was completely), or to isolate
    it away from the mainstream of development into separate policies and ministries.
    If technology overall was seen positively within the the development studies paradigms
    which dominated thinking, IT was relegated to a more marginal role, or even seen
    negatively (as, for example, in the “Jobs not Computers” graffiti appearing in
    India during the 1980s).'
  - '[PAGE 62]


    # Figure 2.6: Changing strategic views on ICTs and development


    Perceived

    Contribution of ICTs

    to Development


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_62_0.png)


    Source: Richard Heeks.


    As indicated, this was a view that continued amongst least development officials
    during the 1990s as part of a more general sidelining of science and technology.
    But, at the same time, and driven from a technical and computer science-based
    paradigm that initially touched little on development studies, the ICT4D movement
    arose. This idolised digital technologies and placed them centre-stage in the
    development process. The world''s main problem came to be seen as the digital
    divide: lack of access to ICTs.


    ICT4D 1.0''s failure to live up to its hype has already been charted. The latter
    part of this phase saw what might be called a reassertion of the supremacy of
    development studies'' views on what they see as the overly-narrow conceptions
    of computer science. ICT thus came to be ‘mainstreamed’ within development, meaning
    it became subservient to the achievement of development goals, integrated into
    a long list of tools and techniques that might prove useful. A typical formulation
    would start with a development goal, then seek to understand the role of information
    and communication in achieving that goal, then ask which new technologies – if
    any – could help deliver that role.


    In many ways this integrated approach looks very sensible; it is one that many
    agencies – the World Bank, Canada''s International Development Research Centre,
    the UK''s International Development are following. It represents what we start
    with ICT4D 2.0 and lies behind'
  - '[PAGE 63]


    # 62 – 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    mantras such as “a means not an end” or “a tool not a goal” that one hears quoted
    in relation to ICT4D.


    # Box 2.13. ICT policy: beyond the menu


    During ICT4D 1.0, a lot of research and advice about ICT policy seemed to focus
    much more on content rather than process and structure. To use a catering analogy,
    there was an excess of attention to the policy menu; a lack of attention to the
    cooking and the restaurant. To continue the analogy, one can take a menu from
    a Michelin-starred restaurant and give it to the managers of a McDonalds – that
    does not mean they will be able to produce the required food. They lack the necessary
    institutional basis and capacities to do so.


    In the future, more will be important, and it will change: for example in response
    to the convergence of digital technologies. However, we should also look more
    at two aspects during ICT4D 2.0. First, institutional capacities and their location.
    Experiences with various types of ICT policy suggest the value of autonomous and
    state agencies, with strong representative bodies for both the private sector
    and civil society for robust interaction between these three groups.


    In addition to these structural concerns, the process of intervention over time
    is important. A foundation for some positive policy impact appears to be capacity
    for flexibility, learning and iteration within the institutions of ICT strategic
    intervention. Put another way, it may be the starting content for ICT policy is
    of less importance than imagined. Instead, what matters more is the capacity to
    observe and reach the impacts of ICT interventions and the contextual changes
    that beset the ICT domain.


    But the integrated approach is also problematic for a number of reasons. By trapping
    ICT as a tool serving individual development silos, it must out ICTs’ role as
    a cut-cutting, linking technology. This reduces the chance of diffusion of learning
    about ICTs, increasing the danger of reinventing wheels. ICTs can also fall out
    of development programmes because they have no overarching champions. As many
    gender activists will tell you, when it comes to development policy, “mainstreamed”
    can be a synonym for “forgotten”: “simply mainstreaming ICT4D … does not work.


    As described, putting front-and-centre in development is highly problematic. But
    it also achieves things that are lost when ICTs become subsumed through integration.
    A sense of excitement, motivation and hope about development are lost. The ability
    to tap into additional development funding sources, such as those of ICT sector
    philanthropists, can also be lost.


    ICT FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
  - '[PAGE 64]


    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? — 63


    An integrated approach typically means an information-centric approach to ICTs,
    conceiving them as tools for handling the information and communication that development
    requires. As a result, it seems harder to recognise and develop ICTs’ productive
    role as the potential basis for thousands of new ICT microenter. Finally, the
    transformative potential of ICTs disappears in an integrated approach. There is
    no question of Development 2.0: of seeing how ICTs could “move the development
    goals” or “thinking outside the MDG box”.


    For an example, we need no further than the current state of mobiles in development.
    There are no cross-cutting initiatives to learn about this new mass technology,
    which only adventiously incorporated into development projects, or to identify
    its transformative possibilities. Where is the necessary MOTForce – a Mobile Opportunities
    Task Force to match the earlier DotForce – without which mobiles’ contribution
    to development will be left to the market, to chance, or just plain left behind?


    Rectifying this ICT4D 2.0 demands not just project-level tribrids, but policy-
    and programme-level tribrides. They can provide a more balanced approach to ICT4D
    strategy; an innovative approach that pulls its of action from an amalgam of the
    key questions each domain can answer:


    +   - What is possible with digital technology? (from computer science)


    +   - What is feasible with digital technology? (from information systems)


    +   - What is desirable with digital technology? (from development studies)


    Box 2.14. Research priorities for ICT4D 2.0


    Much of the research agenda for ICT4D 2.0 flows from the phase change components
    outlined here:


    * New technologies: e.g. more research on mobiles, FOSS, broadband, and integrating
    different ICTs.

    * New applications: e.g. more research on content creation by poor communities
    and the potential for Web 2.0; and on using ICTs for productive purposes.

    * New innovation models: more research to understand best practice in collaborative/para-poor
    innovation, and the realities of facilitating and scaling grassroots/per-poor
    innovation.'
