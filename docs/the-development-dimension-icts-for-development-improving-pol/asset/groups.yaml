    # 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA – 197


    Bangladesh’s Bureau of Educational Information and Statistics (BANBEIS) is responsible
    for collection, compilation and dissemination of educational information and statistics
    at various levels and types of education. This organisation is the main organ
    of the Ministry of Education, responsible for collection and publication of educational
    data and statistics functions as its EMIS. It is also the national co-coordinator
    of Regional Informatics for South & Central Asia (RINSACA).


    Neither Bhutan or Maldives have distinct policy articulations for the use of ICTs
    in school management.


    ## Monitoring and evaluation


    Monitoring and evaluation of ICT initiatives should be incorporated into any strategy
    for integrating ICTs into education.


    India’s draft policy envisages that monitoring tools built into the SEMIS along
    with other information such as District Information System for Education (DISE)
    data will be used to monitor progress of initiatives and programmes. State governments
    will design their own monitoring mechanisms, mapped at each level – local, district,
    and state – to feed into the national web-based MIS for the progression of ICTs
    in schools and to suggest mid-course corrections. Independent third party evaluations
    are suggested whereby states will appoint their own agencies to evaluate various
    parameters such as the ICT programme, infrastructure, digital resources, capacity
    building and overall programme management.


    As mentioned previously, Pakistan’s NI envisages the setting up of a Technical
    Implementation Unit (TIU) for ICTs for education. This body will work in an advisory
    capacity to the Ministry of Education to develop the technical, planning, monitoring,
    and evaluation capacity of policymakers, planners, and administrators at the national,
    provincial, district and school levels. The TIU will also liaise with teacher
    training institutes, oversee the implementation of the NI Strategy and support
    the overall monitoring of education through the national EMIS.


    In most of the other focus countries no distinct monitoring and evaluation strategies
    have been articulated for ICTs for education initiatives.


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009


    ## 198 – 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA


    ### Box 7.4. Monitoring and evaluation: summary


    - Monitoring and evaluation strategies weakly articulated in most countries (except
    India and Pakistan).

    - Existing monitoring and evaluation strategies are mostly focused on programme
    evaluation and EMIS-type tools instead of being based on evaluation of learning
    levels (India, Pakistan, Nepal).


    Key constraints in developing monitoring and evaluation strategies:


    - No standards on which to base evaluations of the impact of ICT initiatives in
    education.

    - Weak institutional structures and fragmentation of responsibility.


    ## Policy Plus


    Policy coherence does not only imply articulating well-integrated strategies.
    There are several measures that need to be taken to ensure the effectiveness of
    policies. Some of these are:


    **Detailed implementation plans.** While policies in almost all focus area countries
    clearly highlight the need to integrate ICTs into education, there are very few
    clear implementation plans. Implementation strategies are briefly indicated in
    India’s and Pakistan’s policy documents. In Sri Lanka the NAPITSE was to be implemented
    through the “National Policy on Information Technology in School Education Action
    Plan, Operational Strategies”, but there is very little information available
    on the success of its implementation.


    **Financial allocation.** Financial allocation should back the distinct policy
    statements made by governments. Funding from different sources, including government,
    private and public/private partnerships should be explored. Policy statements
    in almost all the focus countries lack detailed financial allocations or frameworks
    for funding specific initiatives (with the exception of Bhutan’s BIPS).


    **Institutional capacity and political and administrative will.** This is the
    most critical constraint in the South Asian region, where there is little institutional
    and administrative capacity to translate good policies from paper to real initiatives
    on the ground. For example, of 103 policy directives in 16 areas in Bangladesh’s
    National ICT Policy 2002, only eight were fully or largely accomplished by 2008.


    Community demand for ICTs. General ICT awareness and community participation were
    seen as critical in effectively integrating ICTs into education. With a robust
    demand for ICT services in the larger community, there is better adoption and
    utilisation of technology in the school environment. Very few policy documents
    in the South Asian countries recognise this critical linkage (with the exception
    of Bhutan BIPS and Bangladesh''s National ICT Policy 2009).


    ## Key Findings


    - The imperative for ICTs for education policies in the South Asian region has
    largely come from a recognition of the need to develop adequate human resources
    in order to be competitive in the global ICT market (Bangladesh, Nepal, Sri Lanka,
    Pakistan).


    - There is greater focus on the incorporation of ICTs as a subject into the curriculum
    than using them as an instructional aid to improve overall education quality.


    - Only Sri Lanka, Pakistan and India have specific ICTs for education policies.
    These focus on ICTs as a subject as well as their use as an instructional aid.
    Of these, Sri Lanka''s NAPITSE has been in operation since 2000 and Pakistan''s
    NICT since 2005, while India''s Draft National Policy on ICT in School Education
    is still under formulation, with the first draft having been published in 2009.


    - ICT policies in Bangladesh, Bhutan, Nepal and Afghanistan include sections on
    education, where the need for qualified manpower and familiarising the general
    population with ICT through the education system is highlighted.


    - Maldives does not yet have an ICT policy, but with the basic ICT infrastructure
    in place (relatively higher Internet penetration, mobile networks, TV and radio
    penetration) and good educational indicators (near 100% literacy and high GERs
    at primary as well as secondary levels), it is in a position to benefit.


