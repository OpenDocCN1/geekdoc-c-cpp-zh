    ## 188 – 7. 教育领域 ICT 的政策一致性：南亚的案例


    ### 能力建设


    人力资源开发是将 ICT 整合到教育中能力建设的一个重要方面。教师、行政人员和管理者都需要配备充分设备，以最大限度地发挥 ICT 在改进培训和学习实践方面的潜力。


    所有重点国家的政策都包含了某种形式的 ICT教师培训衔接。培训机构正在配备以提供此类服务。


    印度《学校教育 ICT 国家政策草案》强调了需要改革教师职前培训课程，将 ICT 课程纳入其中。此外，ICT 能力将成为教师任职标准的一部分。所有教师培训机构将配备适当的
    ICT 基础设施。该草案承认，包括入职培训和进修课程在内的定期在职培训将是学校系统广泛引入 ICT 赋能实践的关键。培训将涵盖从操作技能到 ICT 赋能学科培训技能的初步感性教育，随后将鼓励教师加入在线专业小组和协会，以跟上最新发展，分享和开发相关内容，并与更广泛的专家社区进行交流。


    认识到让学校领导和行政人员参与进来对于确保优化采用和利用 ICT 赋能的培训与学习的重要性，建议对所有校长提供 ICT 和 ICT 赋能教育培训计划的指导。将鼓励学校在其行政、管理和系统监控过程中实现自动化。为此，学校领导将接受充分培训，以便能够为学校教育管理信息系统（SEMIS）的成功开发和实施做出贡献。


    通常，工作在国家、州和地区各级教育部门的政府人员缺乏足够的 ICT 知识。印度的国家政策草案规定，将为政府人员提供培训，以鼓励他们在日常活动中使用 ICT。还将针对学校管理信息系统以及
    ICT 基础设施的通用维护和保养提供专门培训。


    在巴基斯坦，NICT 特别重视利用 ICT 加强教师的职业发展和教育管理。该战略强调了需要通过不同的 ICT 媒体（如 IRI、电视、ODL 和在线资源）最大限度地利用职业发展机会。这对于地理偏远地区以及面对面交流互动困难且成本效益低的地区将证明是特别用的。教师将学习
    ICT 技能，以及如何将 ICT 作为一门学科进行教学并将其纳入课程，使 ICT 培训不仅是为了技能开发，还能赋能新的教学方法（例如项目导向型和协作学习）。该政策承认，虽然
    ICT 技能培训至关重要，但 ICT 作为一门独立学科不应该是重点。对于教师来说，知道如何使用 ICT 进行教学比如何使用 ICT 更重要，这种教学应整合到教师培训学院的基础课程中。


    NCT 强调了根据评估需求为教师提供正确技术的重要性。它还建议探索国际通用的标准，例如国际教育技术协会（ISTE）提供的标准，并根据当地情况对其进行教师培训的调整。


    该政策进一步强调了需要通过各种平台为教师提供充足的资源，使他们能够开发自己的教学材料。设建立一个国家教育门户网站，以便教师能够相互交流，从彼此的经验中学习，并接触学科专家以提高自己的理解。行政人员和教育管理者的培训应作为计划计划的一部分，以使学校环境有利于
    ICT 的最大化利用。


    在斯里兰卡，NAPITSE 阐述了为公立学校的所有教师提供培训和教育，使其能够胜任教学目的 ICT 使用。它重申了需要将 ICT 引入入职和在职教师发展及培训计划，以创造教师全系统职业发展的机会。该政策设想了对管理教育系统的政府官员进行培训，并鼓励校外人口利用学校
    ICT 资源，为社区提供通用的 ICT 素养。Intel 技术计划旨在使教师能够利用技术时代的全部教育潜力。教育行政人员、校长和教师的反应非常令人鼓；已有超过
    7500 名教师接受了培训。


    孟加拉国 2009 年国家 ICT 政策确定了经过培训的合格教师的短缺，因此建议利用 ICT 工具提供有效的教师培训计划并缓解优质教师的短缺。该政策强调了需要激励教师获取
    ICT 技能，并通过连接、多媒体内容等手段加强所有小学和中学的教师培训学院。它还提到了需要通过改进 ICT 学科的课程来培养更多经过培训的 ICT 专业人员。国家计算机培训与研究学院（NACTR）是一个自治的教育和计算机培训机构，负责为孟加拉国政府、半政府、自治和非政府机构准备备、实施和评估计算机培训大纲。还将启动“ICT
    专业人员与技能增强计划”，该计划将评估 ICT 专业人员的技能，并通过针对性的教师培训计划填补差距，以克服 ICT 行业的短期技能短缺。


    **尼泊尔的 ICT 政策**也强调了需要将计算机培训作为教师职前和在职培训的一部分。它指出，计算机知识对所有新招募教师应是强制性的，以便在学校引入计算机教育，并将通过远程教育分阶段为所有在职教师提供计算机教育。


    **在马尔代夫**，近 80% 的教师培训成本与交通有关。针对这一限制，在 20 个环礁上建立了教师资源中心，并配备了先进技术，通过“智能白板”提供互动学习体验，并提高教师培训质量。通过教育开发中心的教师资源网站，教师可以坐在资源中心的电脑前搜索课程材料、下载大纲并与其它环礁的同事分享想法。通过剑桥国际考试为教育开发中心开发的虚拟学习环境，多达
    400 名教师可以同时参加在线课程并进行互动来接受培训。


    在政策层面，强调了通过认证和认可流程建立更大规模的 ICT 专业人才库。


    **不丹的 BIPS** 强调了需要确保从计算机素养到高级技术技能的适当 ICT 意识和技能。此外，第 26 次教育政策指南现实确保所有教师和学生都具备 ICT
    素养。


    **阿富汗** 指出缺乏技术 ICT 专业人员和适当培训材料是 ICT 用于教师培训和职业发展的主要限制因素。阿富汗高等教育门户是与全球学习门户和阿富汗高等教育部合作开发的，是一项赋能教师、学习者和社区以提高教育机会的努力。


