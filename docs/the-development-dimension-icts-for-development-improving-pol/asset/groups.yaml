    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 43


    # Box 2.5. Free and open source software during ICT4D 2.0


    Linking hardware and application is, of course, software. Linking ICT4D 1.0, free
    and open source software (FOSS) emerged as a potentially important instrument
    in delivering-robust-appropriate solutions. It brings the promise of systems that
    are lower-cost, more-robust, and more locally-customisable than some proprietary
    solutions. It also brings the promise of helping poorer countries develop local
    ICT4D enterprises based on FOSS customisation.


    This promise has been threatened by the resemblance of parts of the FOSS community
    to a religious cult. Some have adopted "with us or against us" mentality bordering
    on paranoia that has produced a winner of self-justification, but very little
    independent analysis. These FOSers seem to feel users only to hear the word of
    Stallman and they will be converted. Novices like robust business models, rigorous
    total cost of ownership calculations or user-friendliness can be forgotten. These
    perspectives might work behind the walls of Waco, but in the real-world such FOSS
    developers need to professionalise their act or be eaten for breakfast by most-savvy
    payers.


    There are indications that some professionalisation is happening. The more rational,
    socialised fraction of FOSS is growing, challenging the inward-looking, technology-focused
    approach often adopted during ICT4D 1.0. One outcome is the increasing use of
    FOSS in ICT4D systems, and the growth of FOSS-based ICT4D programmes such as the
    Health Information Systems Programme, HISP.(Another is the growing fight-back
    from proprietary solution providers, a bellwinner who was the 2008 addition of
    a Windows version of the OLPC.)


    Even past and future innovations can provide access to ICTs for the majority of
    the world, the hardware-plus-interface combination remains an empty husk. When
    filled with applications software, that husk can have many development roles:
    data content handler, interactive communicator, service deliverer and productive
    tool. These form a chronology of sorts as ICT4D moves slowly to close the gap
    between supply (what is easy to provide) and demand (what the bottom of the pyramid
    actually needs).


    Content. It was rapidly recognised during ICT4D 1.0 that plugging a peasant farmer
    or slum-dweller into Google was of limited value. Much of the information they
    required would not emerge because it was not present in digital format. Hence,
    a series of projects, as Open Knowledge Network, sought to create relevant local
    content focused on livelihood-appropriate issues such as health, education, agriculture,
    and rights. Hence, a recognition that media technologies such as radio and television
    were incorporated into ICT4D that their non-interactive and broad-scale nature
    presented a problem of lack of specific relevance. For these technologies, the
    phase change to ICT4D 2.0 is therefore associated with'
