    ## 第4章：政府在宽带中应扮演什么角色？


    Victor Mulas, Siddhartha Raja, Christine-Wei Qiang 和 Mark Williams，世界银行


    世界银行2009年的《信息与通信发展》报告表明，宽带对增长的贡献是巨大的，且可能比窄带更深刻。扩大宽带接入正成为首要任务¹Tim Kelly，ICT政策专家；Victor
    Mulas，顾问；Siddartha Raja，顾问；Christine-Wei Qiang，高级经济学家；Mark Williams，高级经济学家，全球信息技术（GICT）部门。文中表达的观点不一定代表世界银行或成员国的意见。


    ### 为什么需要宽带？


    宽带是一种通用技术 (GPT)，对我们的生活和工作方式产生了重大影响。公司利用宽带通过远程监控、物流管理和采购来提高生产力。它还用于提供媒体内容、在线购物和电子银行服务。


    宽带是经济增长和国家竞争力的关键驱动力。宽带普及率每增加10%，发展国家的GDP有望增长1.3个百分点（见图4.1）。


    #### 图4.1 选择ICT普及率增加10%对人均GDP的影响


    ![](img/e4ba8ead4bb62aa563835c836f5_121_0)


    注：基于1980-2006年120个经济体的分析。来源：改编自世界银行 (2009)，信息与通信发展：扩大范围与影响力》。


    ### 作为“生态系统”的宽带


    宽带通常被定义为“高速通信网络”，其数据传输速度高于某一最低值（例如256比特/秒）。虽然这是一个流行的定义，但并不完整。相反，宽带可以被视为一个生态系统，不同的元素通过高速连接进行互动（见图4.2）。与相对被动的拨号上网用户相比，宽带用户具有创建和共享各种格式多媒体内容的能力。这种互动是区分宽带与其他高带宽但本质上是被动的网络（如多频道电视）的重要因素。


