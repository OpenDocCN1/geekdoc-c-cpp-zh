    # Chapter 7


    # Policy Coherence in ICTs for Education:

    Examples from South Asia


    By Mitakshara Kumari and Nilaya Varma¹


    Education is a key requirement for social and economic prosperity. In the developing
    economies of South Asia it is often seen as the only means to social mobility
    and financial self-sufficiency. Recognising the significance of education, governments
    across the region have devoted considerable resources in terms of money and comprehensive
    programmes for improving access, quality and delivery mechanisms.


    This chapter presents preliminary outcomes of a survey commissioned by infoDev
    and conducted by PricewaterCoopers India on the use of ICTs for education in India
    and South Asia, which includes Afghanistan, Bangladesh, Bhutan, India, Maldives,
    Nepal, Sri Lanka and Pakistan.


    ¹ Mitakshara Kumari is an Associate Director and Nilaya Varma is a Director at
    PriceWaterhouseCoopers India. mitakshara.kumari@in.pwc.com. nilaya.varma@in.pwc.com.'
  - '[PAGE 179]


    Recent years have seen a groundswell of interest in how information and communication
    technologies (ICTs) can be deployed in the education sector. One of their most
    vital contributions is easy access to learning resources. It is widely believed
    that ICTs can be important levers for introducing and sustaining educational reforms,
    as well as useful aids for both teaching and learning. However, despite evidence
    widespread use of ICTs in education initiatives around the world, little guidance
    exists for policy-makers and donor staff in developing countries contemplating
    the increased use of education-related ICTs.


    With the objective of defining clear guidelines and policies on the use of ICTs
    for education and bridging the gap between education investments and development
    in India and South Asian countries, infoDev commissioned PricewaterhouseCoopers,
    India to conduct a regional survey. The project seeks to gather the most relevant
    and useful information on the use of ICTs in education activities in India and
    South Asia Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Sri Lanka
    and Pakistan. It will serve as a repository for all innovative initiatives as
    well as a basis for designing strategies to effectively integrate ICTs into education
    so that the best possible benefits may be realised.


    This regional survey is the third in series commissioned by infoDev, following
    one on Africa and another on the Caribbean region. It focuses specifically on
    policy coherence in the application of ICTs for education.


    The proliferation of ICT tools for education is an emerging trend in South Asia.
    ICTs in developing countries are often seen as an opportunity for achieving developmental
    goals. Whether it is due to perceived need, a desire to duplicate other countries''
    success stories or the regional success of the ICT industry as whole, ICTs are
    being used enthusiastically – often without a real understanding of their relevance
    and impact.


    As such, initiatives are often introduced without proper policy frameworks to
    support their success. Furthermore, the nature of adopting ICTs for education
    (classrooms), requires combining micro-level planning at the smallest unit to
    the highest level of macro-planning (basic infrastructure policies, connectivity
    policies, communication policy for the nation as a whole). Thus, policy coherence
    must be achieved at many levels, amongst policies ranging from education to ICT,
    telecommunication and infrastructure.


    The South Asian countries in the PricewaterhouseCoopers study, broadly recognising
    the importance of ICTs for development, have all established some of policy framework
    for the growth of information and communication technologies. ICT applications
    in all sectors are an evolving phenomenon; it is interesting to note, however,
    that education is both a'
  - '[PAGE 180]


    # 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA – 179


    consumer and producer of ICTs. Without a robust educational framework, the know-how
    required for development of ICT applications would not be possible – so using
    ICTs to reinvigorate the education process is especially important.


    A broad classification based on educational achievement and infrastructure would
    place Sri Lanka and Maldives at the top end, with 100% literacy, universal primary
    education and basic infrastructure in place. India, Bhutan and Pakistan would
    be in the next tier, with lower literacy rates but systems in place to achieve
    higher educational attainment in future. Nepal, Bangladesh and Afghanistan would
    be in the final tier experience significant political, geographical and educational
    upheaval and struggle to institutionalise processes and achieve basic services.


    A broad comparison of education and ICT indicators in the countries will be available
    in the full report to be published on the infoDev website in mid 2010.


