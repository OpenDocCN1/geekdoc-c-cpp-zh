    ## 图 2.4：ICT4D 2.0 实施良好实践


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_57_0.png)


    来源：Richard Heeks。


    ## ICT4D 2.0 的行动新世界观


    ICT4D 领域的参与者来自特定的学科背景。通过观察他们的背景，我们可以学到什么？


    该领域的许多活跃人士源于计算机科学背景。其中一些处理我们可能所谓的“硬端”领域（硬件和固件），另一些则来自相对“软”的人机交互领域。当然，这种专业知识对于
    ICT4D 2.0 是至关重要的。它对于实现图 2.4 中详细说明的新技术和应用优先事项至关重要。它将成为实验室/亲贫以及协作/类贫创新的重要组成部分。


    但单靠它是不够。而且，当它孤立存在时，问题就会出现。许多 ICT4D 失败的根源被认为是其以技术中心的方法，这种方法由信息学世界观主导。这类项目通常类似于医学笑话：“手术很成功，但遗憾的是病人去世了”。它们交付了一个在技术上可行但未能对发展做出贡献的系统。


    因此，为了从 ICT4D 1.0 的失败中转型，我们需要有新的、更广泛的世界观来指导 ICT4D 2.0 项目。这些世界观将从何而来？有两个主要的学科候选。


    第一个是信息系统。在 20 世纪 80 年代和 90 年代初，信息系统在被称为 ICT4D 之前是 ICT4 的知识基地；特别是国际信息处理联合会（IFIP）第
    9.4 工作组关于计算机在发展中国家社会影响的研究。随着处理 ICT4D 的信息系统学科期刊的创建、关键信息系统期刊任命了具有特定发展中国家职责的新编辑委员会成员，以及最近信息系统协会（AIS）创建了关于发展中国家信息系统的特别兴趣小组，这种趋势得到了加强。


    信息系统视角提供了理解许多导致 ICT4D 项目问题的手段。最值得注意的是，它提供了模型来理解许多 ICT4D 项目失败背后的人类、政治和背景原因。它还提供了在项目设计和实施期间解决这些因素的方法。在最广泛的范围内，信息系统甚至允许我们退后一步，回答关于
    ICT4D 政治经济的问题：它促进了谁的利益，其机会成本又是什么。


    但信息系统视角在两个方面失效了。它至少在某方面失去了对人工制品（arte）的关注，变得太像社会科学，并过度关注是否未能与技术接触。它与发展的背景、利益相关者和过程缺乏联系。信息系统倾向于既不理解也不使用发展、发展研究的观点。


    人们可以主张纳入第四种世界观：传播学。几十年来它承载着对发展的兴趣，是 ICT4D 社区的关键部分。为了简单起见，我们在这里将其关键概念整合到信息系统中：这种简化对于传播模型和电信来说更具信度；但在媒体研究中则较弱。


    我们转向发展研究。到目前为止，发展研究未能充分传达或支持 ICT4D。部分，这是因为发展研究在 20 世纪 80 年代普遍远离了技术；这是对“大科学”和“技术转移”理念的反作用，这些理念泛化了此前几十年中主导发展的、已被信誉扫地的范式。


    结果是，ICT4D 1.0 像一个泡沫一样增长。它是由发展领域之外的参与者（作为 IT 供应商）以及少数希望如此的信奉者驱动的。但它与发展主流隔绝了，主流对技术仍然保持怀疑态度，尤其是新技术（尽管在他们家里和工作场所他们日益依赖这些技术）。


    然而，随着 2000 年的发展，发展研究领域发生了变化。科学和技术正在构成发展议程，受到诸如杰弗里·萨克斯（Jeffrey Sachs）等人类发展冠军的推动，他们认为技术是实现千年发展目标（MDGs）的核心；受到新兴工业国家（如韩国和台湾等新兴工业国家）和金砖国家（巴西、俄罗斯、印度、中国）作为新兴经济力量和新援助提供者对科学技术核心重要性的重视；受到技术创新新视角的推动，这些视角展示了技术如何在解决贫困问题方面是有效的。


    ICT4D 2.0 为与发展研究接触提供了更大的机会。这种接触将有助于理解数字技术如何融入到发展范式、过程和结构中。这不仅可以指导事后活动（如 ICT4D
    影响评估），还可以指导事前活动，即理解 ICT4D 优先事项，以及 ICT4D 项目设计和实施的良好实践。发展研究视角从宏观和微观层面提供了指导，最终都增加了
    ICT 对发展的可能贡献。


    ## 整合视角


    我们得出结论，计算机科学、信息系统和发展研究这三个知识领域之一，对 ICT4D 领域都有其贡献。


    从概念上说，这意味着需要将这三个领域结合在一起的空间。这尚未实现，仍然是 ICT4D 2.0 期间的关键知识挑战。但在某些小组中存在一些很有前景的可能性，例如
    ICTD 会议²，它汇集了信息专业人士来解决发展问题，以及最近成立的 IFIP 交互设计与国际发展特别兴趣小组。这两个小组都关注计算机科学/信息系统边界上关于发展背景下系统设计的特定需求和实践。它们借鉴了学术领域日益蓬勃的“发展设计”领域以及商业领域的“新兴市场设计”领域。


    在实践中，这意味着如果 ICT4D 2.0 项目要成功，它们需要这三个领域的专业知识。这可以被解释为需要多学科团队，但问题领导力也将同样重要。在这里，我们可以扩展一个性发现：成功的
    ICT 项目是由跨越技术和组织的混合型人才领导的。


    ## 图 2.5：培养 ICT4D 2.0 领袖


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_60_0.png)


    来源：Richard Heeks。


    正如图 2.5 所示，因此我们需要开发或寻找“三栖型”（tribids）ICT4D 领袖。他们必须对计算机科学、信息系统和发展研究三个领域有足够的了解，以总结关键教训，并与领域专业人士互动和管理。这些混合型
    ICT4D 领袖的培养是另一个问题。职业培训无疑会有帮助；那些创建 ICT4D 硕士课程的人对这一点非常敏锐。作者还观察到，三栖型人才往往在 ICT4D 项目期间自发形成，因为任何单一领域的领导者都会很快发现自己面临着只有通过其他领域的见解才能解决的问题。


