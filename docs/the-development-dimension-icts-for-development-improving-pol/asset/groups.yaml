    ## Chapter 3


    ## How the Developing World may Participate in the Global Internet Economy: Innovation
    Driven by Competition


    By Rohan Samarajiva¹


    Full participation in the global Internet Economy requires electronic connectivity
    of increasing complexity. Today, due to a wave of liberalisation and technological
    and business innovation, much of the world is electronically connected, albeit
    not at levels that support full participation. This chapter amines the contributions
    made by competition and business innovation to achieving current levels of connectivity
    and the possibilities for extrapolation to ensure widespread participation in
    the global Internet Economy.


    The biggest challenge facing the developing world in this area is connecting low-income
    groups. Solutions to this problem will make finding solutions to others easier.
    In addressing the challenge of connectivity, this chapter draws extensively from
    research conducted in South and Southeast Asia. In the concluding section, policy
    implications – including articulations with tax and other policies that must be
    aligned if access is to translate into wealth creation – are discussed.


    ## 76 – 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY


    The OECD Seoul Declaration on the Future of the Internet Economy covers a full
    range of Internet-supported economic, social and cultural activities and related
    ICTs which will strengthen the capacity of countries to improve the quality of
    life of all their citizens by:


    - Providing new opportunities for employment, productivity, education, health
    and public services as well as addressing environmental and demographic concerns.

    - Acting as a key driver for the creation of enterprises and communities and stimulating
    closer global co-operation.

    - Enabling new forms of civic engagement and participation that promote diversity
    of opinions and enhance transparency, accountability, privacy and trust.

    - Empowering consumers and users in online transactions and exchanges.

    - Reinforcing a circle of security which applies to information systems and networks,
    and their users.

    - Developing an increasingly important platform for research, international science
    co-operation, creativity and innovation in many different sectors.

    - Creating opportunities for new economic and social activities, applications
    and services through ubiquitous and seamless access to communication and information
    networks.

    - Promoting a global information society based on fast, secure and ubiquitous
    networks which connect billions of people, machines and objects.


    The fact that the OECD held a ministerial-level meeting on the Internet Economy
    resolved to promote ubiquitous access to ICTs to advance its realisation indicates
    that the Global Internet Economy has not yet been fully realised, even within
    OECD countries. It is even less a reality for the billions living in developing
    countries, especially those who are poor. The Seoul Declaration takes this into
    account explicitly, declaring that it seeks to make the Internet Economy truly
    global through policies that:


    - Support expanded access to the Internet and related ICTs, for people in developing
    countries.

    - Recognize the potential of the Internet and related technologies to provide
    enhanced services to people with disabilities and special needs.


    ## 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY
    – 77


    - Recognise the importance of a competitive environment for the successful growth
    of the Internet Economy and the opportunities this can bring for development,
    particularly for people and regions with the most limited economic means.

    - Promote use of Internet and related ICT networks by all communities as well
    as the creation of local content and multi-language translations to.

    - Facilitate the introduction of internationalised domain names (IDNs) while ensuring.

    - Harness the potential of the Internet to tackle climate change.


    The mental image of the Internet features a desktop or laptop connected by wire
    or wirelessly. Separate definitions for fixedline and mobile broadband.


    The massive progress achieved in the past few decades was indeed made possible
    by opening up the market for connectivity.


    ## What is the Internet?


    A common image of the Internet features a desktop or laptop connected by wire
    or wirelessly. What is truly surprising that many people who have never come in
    contact with a standard computer are already performing some of these functions
    electronically.


    For example, when a poor person with a prepaid mobile connection types in a short
    code to check his account balance, they are engaging in one of the more complex
    current Internet functions: remote computing. Downloading a ringtone and paying
    for it from the “load” on a prepaid phone is a transaction that includes an electronic
    payment.

