    The analysis permits a comparison with each country’s performance in GDP per capita.
    It shows, for instance, that Sweden and Ireland are doing much better than their
    GDP would suggest, while Greece and Spain are doing less well.


    Egypt''s relative success can be attributed to a public/private partnership between
    the policy-maker (MCIT), the regulator (NTRA), and the private sector. The main
    elements of the policy include an attempt to widen access to, and awareness of,
    ADSL services; rolling out Wi-Fi; a programme to extend the use of PCs in households
    and small businesses, the “free Internet” bundled into the price of dial-up minutes);
    and other initiatives such as PC clubs and the Egypt PC2010 project. Such initiatives
    have succeeded in reducing the price of broadband to the point where the average
    cost Mb per month is now around USD 24.


    Government investment in broadband as a part of stimulus packages should be balanced
    with policy objectives. Initiatives could include unbinding the local loop, making
    sufficient spectrum available and ensuring allments supported by government funds
    are accessible to competitors via open access. For example, Mexico’s government
    announced in May 2009 it will open up the national electric company’s network
    to competitive telecom service providers.


    Fixed-line fibre networks have a huge theoretical capacity (i.e. for instance,
    a single fibre strand could allow every single person in the world to hold a simultaneous
    conversation). But such networks are lacking in developing countries and therefore
    the focus is more likely to be on the provision of mobile broadband.


