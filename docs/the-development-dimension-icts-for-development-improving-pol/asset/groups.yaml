    开源学习管理系统的快速增长以及由马萨诸理工学院的 OpenCourseWare 等倡议驱动的开放教育资源的可用性，正在改变人们对教育内容价值的思考——即价值在于交付，而非内容本身的知识产权。技术趋势——例如，内存存储容量的快速提高与连接性相对缓慢的提高相比——表明，更多的教育内容可以存储在本地，而不是通过昂贵的网络访问。


    索罗悖论的一种变体可能会说：“我们在学校随处都能看到计算机时代，唯独教育改进例外”。这表明我们需要重新思考如何在学校使用技术。新的数字鸿沟不在于接入，而在于使用类型和质量的差异。经合组织国家
    70% 以上的人口接入互联网，而在近 100 个发展中国家中这一数字小于 10%。在发展中国家，接入的主要平台是手机，手机越来越多地用于电子学习和视频教学。移动计算平台的下降和在发展中国家的普及将对接入产生巨大影响。


