    ICTs and the Internet are enabling increasing number of products and services
    to be delivered online (i.e. de-materialisation). This affects scientific journals,
    books, music CDs, film and videos, software, etc., with fewer taking a physical
    form and less energy and potentially fewer resources being used in production,
    storage and delivery. E-commerce and online shopping can save time and travel
    in searching and processing. Centralised fulfilment and delivery can replace many
    thousands of individual trips, saving energy not only directly but also through
    potential reductions in traffic congestion. E-mail has replaced millions of letters
    – written on paper, collected, sorted and delivered worldwide – with almost instantaneous
    communication having a very small environmental footprint (Schmidt and Kpriver
    2009).


    ICTs offer the potential for transport and travel substitution. With telework
    or e-work, transport and commuting time can be substantially reduced and considerable
    benefits can accrue for individuals, employers and the community. The reduction
    of long-distance travel as a result of the use of data, voice and video applications
    over IP for webcasts, tele-ferencing and video-conferencing can be significant,
    with direct impacts in terms of the environmental footprint and indirect impacts
    as reduced demand on transport infrastructures and office facilities.


    ICTs can also contribute to the resource and energy efficiency of many physical
    components of products themselves or their production processes. For example,
    automotive electronics in the form of ignition chips has'
