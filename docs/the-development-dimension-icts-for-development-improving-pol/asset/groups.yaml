    # 64 - 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    # Box 2.14. Research priorities for ICT4D 2.0 (continued)


    +   - New implementation models: more research on new ways to fund, organise and
    manage ICT4D.


    +   - New viewpoints: more research that makes intellectual connections between
    development studies and the computer science/information systems boundary area;
    more research on ICT4D “beyond mainstreaming”.


    It will include specific elements from other text books, such as:


    +   - Urban development: researching use of ICTs in the developing world''s cities.


    +   - Climate change: researching how ICTs can reduce, publicise, reduce, and
    help deal with the consequences of climate change in developing countries.


    +   - Beyond the menu: researching how ICT4D policy is made and implemented rather
    than simple reforms of policy content.


    Finally, we can identify some generic research priorities:³


    +   - Defining development: researching what vision of development ICTs can facilitate;
    just the MDGs or more than that? And how ICTs redefine development – is there
    an emerging “development 2.0”?


    +   - Standing back: more research that “stands back” in various ways; in terms
    of time, taking a longitudinal approach; in terms of engagement, taking a more
    independent and less self-interested view on projects; in terms of focus, taking
    a more political and critical studies perspective that frames the ICT4D agenda
    and whose interests are being served.


    +   - Evaluation: moving (per Figure 2.7) from researching ICT4D readiness and
    availability to researching uptake and – especially impact. Rigorous impact assessment
    is the Macavity of ICT4D – much talked about hardly hardly seen.


    # Conclusion


    There is no sharp dividing line to us to say, “ICT4D 1.0 stopped here; ICT4D 2.0
    began here”. On the ground there is a sense of evolution, not discontinuity. And
    yet ... something messy, fuzzy but new is emerging. It makes sense to see what
    happens if we give this label and a summary, as shown in Table 2.1.


    ICT FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
