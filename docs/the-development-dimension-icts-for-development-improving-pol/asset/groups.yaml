    # 6. 发展中国家的信息通信技术与环境：机遇与发展 – 161


    Climate Group 2008. 建筑标准和法规是实现此类节约的关键要素。


    交通：全球化导致国际供应链变得日益复杂，并为运输、存储和物流运营带来了挑战。信息通信技术（ICTs）可以通过多种方式提高物流运营的效率。这些包括用于改进运输网络设计的软件，允许运行中心化配送网络和管理系统，这些系统可以促进灵活的送上门服务。具体的杠杆包括多式联联运、路线优化和库存减少。交通部门是温室气体（GHGs）的大型且增长中的排放源，占全球排放量的14%，据估计，利用信息通信技术优化物流可以使全球运输排放减少16%，储运排放减少27%（The
    Climate Group 2008）。许多政策和监管问题影响着运输和物流，从航线路线监管到建筑规划与法规，再到与运输相关的噪音和污染法规（Houghton
    2005），这为政策一致性构成了重大挑战。


    ## 缓解其他环境压力


    发展中经济体通常依赖农业和渔业作为经济作物和维持生存；在新生和发展中经济体，水资源问题可能比能源使用更紧迫。在某些地区，森林砍伐可能是主要关注的问题。因此，对土地、森林和水道进行映射、监测和管理对于关键部门的效率和可持续性至关重要。地理信息系统为埃及的陆地水路监测与管理（IISD
    2005）、非洲、东南亚以及喜马拉雅地区（IISD 2009）提供了重大机遇。与其它地区一样，信息是使人们做出更可持续选择并从其行动中获益的关键，也是教育、意识和支持的基础。


    通过一系列允许观测和预测的门户和系统，全球用户可以日益获得观测数据。示例包括地球观测门户¹和气候变化预测网²，而保护协会（Society for Conservation）的门户³则关注保护工作。目前有一种趋势是通过使用
    Google Earth 和 Microsoft Virtual Earth 等通用接口，使地理空间环境信息更加可用。这使得信息持有者能够以低成本通过标准的网络界面向用户提供特定地理区域的信息。示例包括热带生态评估与监测网络⁴、我们世界中的气候变化⁶以及其他⁷。


    用于发展的信息通信技术：提高政策一致性 – OECD 2009


    # 162 – 6. 发展中国家的信息通信技术与环境：机遇与发展


    在发展中国家，有很多例子说明移动手机和无线网络如何在固定线路网络简陋或不存在的情况下提供“跨越式发展”的机会。考虑到农业是肯尼亚经济的支柱，Mungai (2005)
    提供了若干与缓解相关的例子，例如 SokoniSMS 服务，它使农民能够通过手机接收来自各个中心的市场价格。凭借了这些信息，农民能够确定利润最高的市场进行产品运送，从而避开通常提供价格低得多的中间商，并减少了将货物运往市场后再寻找买家的倾向。其他倡措还包括在维多利亚湖盆地（Mungai
    2005）和尼罗河盆地（Sobeih 2005）使用地理信息系统以支持资源管理和当地发展。这些系统可以由特定位置或生态系统的信息包进行补充，例如湄公河和尼罗河意识套件。集成的生态系统监测、感知和建模也日益常见（例如珠三角地区（Chan
    2009)).


    考虑到东南亚和喜马拉雅地区农村社区的脆弱性、他们对生态系统的依赖以及来自不可持续和过度使用的压力，Tyler 和 Fajber (2009) 强调了获取信息的重要性以及一些创新项目。例如：


    - 印度尼尼，博加尔农业大学正与农民合作，通过气候田学校利用气候预报。当季节性预报显示 2006-07 年的作物季节将比常年干燥时，农民储存了更大比例的第一批水稻，以备干旱天气可能导致的价格上涨。

    - 在菲律宾，马尼拉天文台（MO）已与该国移动电话运营商之一 SMART 合作，开展了一项试点项目，在灾区地区提供遥测雨计和手机。当地农民读取雨计并将信息拨打给天文台，天文台则利用手机向农民发布风暴预警警报。农民也可以使用手机获取市场信息。


    ## 适应：管理不可避免的因素


    适应是指旨在减少已经发生的气候变化负面影响的行动。由于最脆弱的群体风险最高，发展中世界可能是信息通信技术在气候变化监测和适应中发挥重要作用的地方（infoDev
    2009）。


    用于发展的信息通信技术：提高政策一致性 © OECD 2009


    # 6. 发展中国家的信息通信技术与环境：机遇与发展 – 163


    适应的示例包括准备风险评估、保护生态系统、改进农业方法、管理水资源、实施更好的建筑设计并在安全区域建立定居点、开发预警系统、提高保险覆盖范围以及建立社会安全网（ISDR
    2008; ITU 2008）。


    ## 气候变化适应


    监测和预警气候变化引发的事件（如风暴和海啸、干旱和洪水、饥荒和疾病）至关重要。国际水平示例包括：


    - 饥荒早期预警系统网络（FEWS NET），这是一个由美国国际开发署（USAID）资助的网络，汇了国际、区域和国家伙伴，就新兴和不断变化的粮食安全问题提供早期预警和脆弱性信息。位于非洲、中美美洲、海地、阿富汗和美国的
    FEWS NET 专业人员监测并分析气候信息对生计和市场的潜在影响，以识别对粮食安全的潜在威胁。一旦识别，FEWS NET 使用一系列通信和决策支持技术帮助决策者缓解粮食不安全问题。这些包括对
    25 个国家的每月粮食安全更新、定期的粮食安全展望和警报，以及对应急和响应计划工作的简报和支持¹⁰


