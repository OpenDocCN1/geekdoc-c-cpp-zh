    ## 40 – 2. ICT 与国际发展下一步将走向何方？


    - 电力：撒哈拉以南非洲地区只有 15% 的农村家庭可以使用电，因此在三个领域仍需要持续创新：用于当地发电的新型低成本设备；更好的存储、携带和传输电力的方法；以及降低
    ICT 设备的功耗。


    但在某些方面，我们正处于互联网接入道路的十字路口。我们是继续沿着基于 PC 的路线走（目前为止，少于 0.5% 的非洲村庄通过这种方式建立了连接）？还是转向移动电话（移动电话已经覆盖了非洲三分之二的人口）。对硬件创新的需求似乎相对有限，但跨国公司的产品似乎扩散得相当容易。全球一半的人口是手机用户；更多的人可以使用手机；而且目前的增长率最快的是最贫困地区。


    目前的增长率将使使用人数推向全球 90% 以上的人口，这使得如何覆盖最后的 5 亿人以及支持功能手机的普及成为问题，考虑到目前贫困社区的大多数手机仅用于通话和短信。对于这两者，对硬件创新的需求可能会再次出现。随着移动设备上的
    iPhone 及应用型设备与笔记本型设备融合，可能会出现创新，产生成本更低的类 PC 终端设备，最终形成类似于“开发用黑莓手机”的东西。


    ## 框 2。宽带：新希望/新鸿沟


    宽带已经是全球北方国家 ICT 使用不可或缺的一部分。在美国（表现较差的国家之一），到 2008 年，每 100 名公民就有 25 个宽带订阅，55% 的家庭拥有宽带，约占所有互联网连接的
    90%。相比之下，包括埃塞俄比亚、加纳、肯尼亚和乌干达在内的大多数非洲国家的订阅率低于人口的 0.1%。小安道拉的宽带订阅量大约与非洲人口最多的国家尼日利亚相当。


    因此，当我们开始看到数字设备围绕互联网接入和手机普及时，一种新的宽带设备正在出现。这并将持续需要战略性的应对，如果不能由政府主导，至少必须由政府协调。无论在何地发生，其发展结果将是令人瞩目的。在宏观层面，宽带的普及与就业和
    GDP 等指标的增长相关；在微观层面，则有许多增强就业和生产的新机会。


    ## 2. ICT 与国际发展下一步将走向何方？


    可能，在处理“剩余 50 亿人”问题时，ICTD 2.0 将同时推进 PC 和和移动路线。但有人问，互联网是否应该是焦点，或者我们是否应该观察穷人是否已经“用钱包投票”，并探索已使用的更简单、更便宜的技术是否可以提供
    ICT 功能？与其通过升级手机和带宽来允许移动互联网接入，通过通话和短信能为发展实现什么？老旧技术又如何呢？“接入”（区别于“所有权”或“地理覆盖范围”）的数据很难获得，但我们可以估算，发展中国家约有
    80% 的人口可以使用收音机，50% 的人口可以使用电视机。因此，在 ICT4D 历史早期，对 ICT 进行了重新解释，将广播和电视纳入其中。


    因此，融合在 ICT4D 2.0 中也将扮演重要角色。在实践中，这意味着观察已经渗透的技术——手机、收音机、电视——寻求增加计算和互联网功能的方法。试点项目已经在进行中。斯里兰的
    Kothale 社区广播电台通过电子邮件和网络回答听众问题并广播回复。印度的 Warana 社区中心数据库允许农民在田间通过手机手机进行搜索。许多其他的“中心-辐射型”创新也可能在未来找到有价值的应用。


    ## 框 2.4. ICT4D 2.0 与个体的兴起


    工业化国家和发展中国家在 ICT 应用方面存在核心差异。在全球北方，过去几十年主导的 ICT 所有权和使用模式首先是家庭然后是个人。相比之下，全球南方的所有权和使用模式是社区群体。


    这种模式在概念和实践上被继承在几乎每一个 ICT4D 1.0 项目中。它帮助确保了每个设备的覆盖范围远大于对北方模式简单推演所得出的结论。因此，南方的数字鸿沟被高估了，因为对
    ICT 的共享访问使基础技术所有权数字放大了许多倍。这种模式也是一些项目产生广泛益处的源泉，这些项目有助于形成或加强社区群体。这些群体——通常由来自当地社区内部培训的“信息人员”提供支持——会考虑收到信息（例如关于儿童健康或农业改进的信息）的影响，或者后期参与创建自己的数字内容。


    ## 框 2.4. ICT4D 2.0 与个体的兴起（续）


    这将持续到 ICT4D 2.0，但面临家庭甚至个人所有权上升（尤其是手机）的挑战。早期的手机项目采取每部社区一部手机的模式，但随着手机的进一步普及，这种模式正在被超越。手机必须取代某些社区所有
    ICT 的用途，随着它们慢慢变成便携收音机、电视、网络设备等，这种替代将会增加。


    替代意味着去中间化，减少对群体和中间人的需求。这可能会引发 ICT 用于发展的新创业性用途。


    迹象表明，某种专业化正在发生。更加理性、社会化的 FOSS 部分正在增长，挑战着 ICT4D 1.0 期间采用的内向、以技术为中心的方法。结果是 FOSS
    在 ICT4D 系统中的使用增加，以及基于 FOSS 的 ICT4D 项目（如健康信息系统 HIS）的增长。（另一个结果是专利解决方案提供者的反击，一个胜利者是
    2008 年为 OLPC 添加 Windows 版本。）


    连接硬件和应用程序的是软件。在 ICTD 1.0 中，自由开源软件（FOSS）成为交付适当解决方案的潜在重要工具。它带来了比专利解决方案成本更低、更健壮且易于本地化的系统承诺。


    ## 框 2.5. 自由开源软件


    即使是过去和未来的创新也能为世界上大多数地区提供 ICT 接入，硬件加接口的组合仍然是一个空壳。当填充了应用软件后，这个空壳可以承担许多发展角色：数据内容处理器、交互通信器、服务提供者和生产力工具。


