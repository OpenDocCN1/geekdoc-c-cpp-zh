    sectors in developing economies cannot, per se, be taken as evidence that they
    are developing in ways that will move large numbers of people out of poverty.
    Nevertheless, the service sector, as it becomes more productive, does play an
    important role in absorbing excess labour from the agricultural and manufacturing
    sectors.


    The knowledge sector is a subsector within the service sector. Examples are education,
    research, and software. This sector relies heavily on ICTs, but in fact the role
    of ICTs in contributing to wealth creation extends across the entirety of services,
    manufacturing and agriculture. ICTs play a foundational role in the emergence
    of a knowledge-based economy, where innovation based on systematic applications
    of knowledge occurs in all sectors. Without ICTs it would be difficult or impossible
    to codify knowledge and transmit it in a range of flows and scale at low cost.


    The basic argument for access to the Internet and telecom networks contributing
    to wealth creation is anchored on the knowledge that is made possible and the
    reductions of frictions of time and space that can be realised. Access to ICTs
    alone does not result in wealth creation; it is a foundational element along with
    governance and financial infrastructure. Without education/skills, investment
    and innovation, the desired results cannot be achieved. Access to ICTs is a necessary
    condition, but not a sufficient one.


    # Do ICTs cause development?


    The fact that access to ICTs is complementary makes the establishment of causal
    links to development outcomes difficult, though there have been several attempts,
    each with its own shortcomings. At the macro level, Solow famously said: "You
    can see the computer age everywhere but in the productivity statistics." There
    are those who argue that there was a need for a factor in time lag, and studies
    that show the contribution. In the specific context of economic development, the
    World Bank made a magisterial effort in 1999 to establish the case.


    At the micro level, case studies abound. Perhaps the most rigorously argued is
    that by producer prices, consumer prices and waste in a number of adjacent but
    independently fish markets along the coast of the Indian state of Kerala before
    and the arrival of mobile phones. This natural experiment clearly established
    that both consumers and producers benefited and the markets cleared (eliminating
    waste) because fishermen called multiple fish markets while still at went to the
    one offering the best price. It was reported that, in all boats returning to their
    home harbours prior to the arrival of mobiles, 35% sold their catch at'
