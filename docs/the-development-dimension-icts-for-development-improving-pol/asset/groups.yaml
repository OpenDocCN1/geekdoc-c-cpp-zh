    # 5. REGULATORY ISSUES AROUND MOBILE BANKING – 141


    # The role of the regulator


    The financial regulator plays a crucial role in the economy of any country. The
    regulator stands between ordinary citizens and financial chaos by attempting to
    ensure the financial stability of an economy, and those institutions wishing to
    offer financial services do so in a responsible manner. In addition to the regulator’s
    role in maintaining financial stability, they also have key responsibility for
    consumer protection.


    There is a third role for the regulator, however, that is particularly important
    for emerging economies: promoting a country’s social objectives by attempting
    to ensure that suitable financial services are available to as many citizens as
    possible, and the range and sophistication of such services increase in step with
    the country’s needs. This third role is generally referred to as “extending the
    reach and depth of financial services”.


    Quite reasonably, many regulators tend to view this third role as substantially
    inconvenient to the first two. After all, the reasoning goes, economic growth
    is threatened, who cares whether or not the population has a bank account? While
    there is a grain of truth in this view, it can lead to a tendency towards conservatism,
    with the unintended consequence of raising the barrier for entry for new market
    entrants, effectively closing the door behind existing financial service providers
    and protecting them from more innovative or efficient competitors.


    # Regulators’ issues with branchless banking


    In Consult Hyperion’s conversations with financial regulators around the world,
    common themes regarding branchless banking emerged. Many felt that payment schemes
    such as M-PESA, with no direct bank involvement, should not be allowed – that
    schemes should always be led by banks. As one regulator put, without a trace of
    irony, “in view of the recent financial crisis, we feel that only a bank provides
    the necessary stability”.


    A lack of familiarity with non-bank institutions was also raised. Generally, regulators
    feel comfortable with their existing relationships with the banks and other financial
    institutions they regulate. They know what figures and reports to look at and
    are familiar with the levers available to influence these institutions’ operations.
    There is no reason why any other institution should not be able to provide similar
    satisfactory mechanisms, but for the regulators it is a question of familiarity.'
  - '[PAGE 143]


    # 142 – 5. REGULATORY ISSUES AROUND MOBILE BANKING


    Finally, some regulators are concerned about the effect that the failure of a
    branchless banking scheme could have on customers and the wider economy. This
    is a legitimate concern, and indeed one that has been raised by representatives
    of a number of established branchless banking schemes when looking at some of
    their competitors'' new offerings.


    # The M-PESA experience


    M-PESA (M for mobile, PESA the Swahili word for money) is a money transfer service,
    initially deployed in Kenya, which allows ordinary Kenyans to send money across
    the country (or indeed face-to-face) cheaply and reliably using mobile phones.
    M-PESA accounts can also be used as a safe place to store small amounts of money
    (an aspect that perturbs some commentators but is desirable to those with no access
    to a true bank account). This is a clear example of “extending the reach of depth
    of financial services”, with obvious benefits for ordinary Kenyan citizens.


    # Figure 5.2: M-Pesa in action


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_143_0.png)


    +   1. Select “Withdraw cash”


    +   2. Select "Withdraw”


    +   3. Enter the phone number you want to withdraw cash from


    +   4. Enter the amount you want to withdraw


    +   5. Enter your secret PIN


    +   6. Check the details are correct then press OK to send an SMS to M-PESA


    Source: workshop presentation by David Birch, Chair, Digital Money Forum and Director,
    Consult Hyperion.


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE | OECD 2009'
  - '[PAGE 144]


    M-PESA was developed and deployed by Vodafone, in partnership with Safaricom,
