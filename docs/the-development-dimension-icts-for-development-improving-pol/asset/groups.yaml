    该分析允许与各国的人均 GDP 表现进行比较。例如，它显示瑞典和爱尔兰的表现远好其 GDP 所暗示的水平，而希腊和西班牙的表现则较差。


    埃及的相对成功可归功于政策制定者（MCIT）、监管机构（NTRA）与私营部门之间的公共伙伴关系。政策的主要元素包括：尝试扩大 ADSL 服务的接入范围并提高意识；推广
    Wi-Fi；一项扩展家庭和小型企业电脑使用的计划（以及将“免费互联网”捆绑在拨号上网时长费用中）；以及其他诸如电脑俱乐部和“埃及 PC2010 项目”等倡措。这些举措成功降低了宽带价格，使目前平均每月
    Mb 的成本降至 24 美元左右。


    作为刺激方案的一部分，政府对宽带的投资应与政策目标保持平衡。倡措可以包括解除本地环路限制、提供足够的频谱，并确保政府资金资助的分配可以通过开放接入（open
    access）供竞争对手使用。例如，墨西哥政府于 2009 年 5 月宣布，将把国家电力公司的网络开放给竞争性的电信服务提供商。


    固定光纤网络具有巨大的理论容量（例如，单根光纤就可以让世界上每一个人同时进行对话）。但此类网络在发展中国家仍然缺乏，因此重点更有可能地放在移动宽带的提供上。


    # 移动支付


    发展中国家有数十亿人无法或未能获得任何形式的金融服务。手机越来越多地被用作资金转账或买卖产品和服务的渠道。这为许多手段极其有限的人首次提供了负担得起的金融服务，同时为他们提供了比传统替代方案更高的安全性和效率。


    移动支付的发展速度在不同国家之间并不均衡，这可能反映出由于创新带来的颠覆性并不总是受到所有利益相关者的欢迎，而且从服务推广最成功的国家中汲取教训。同时，通信与金融服务的融合引入了不同的监管机构，需要对这些实践进行审查，以确保在实现政策目标方面的整体一致性。


    第 5 章描述了最初在肯尼亚部署的汇款服务 M-PESA。尽管该服务最初用于汇款，但它已演变为包括新的金融服务，如微型金融、微型保险和学费支付。逻辑上的下一步是将公共部门服务整合到该系统中；然而，监管立场往往过于不一致或缺乏连贯，没有最佳实践。


    发达国家与发展中国家之间手机覆盖率的差异较小，但银行分支数量尤其是自动取款机数量的差距要大得多。这为移动银行（m-banking）提供了最有有力的理由。通常来说，在存在多个资金转账运营商的地方（如美国、西班牙和英国），平均交易成本（每
    200 美元 6.6 美元）远低于运营者相对较少的国家（如日本、法国、加拿大和荷兰），后者的平均交易成本为每 200 美元 15.5 美元。像 M-PESA
    这样的手机运营商可以大幅降低这些交易成本。


    # 图 1.4：选定地区的网络覆盖（占人口百分比）


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_21_0.png)


    来源：Laura Recuerdo Virto 演讲稿，OECD 发展中心经济学家。


    在一些发展中国家，汇款金额远超过了正式官方援助的价值。像 M-PESA 这样提高效率和减少汇款利润的创新可能会产生显著的益处。然而，虽然移动银行为发展开启了许多新机会，但也留下了欺诈空间。因此，部门、监管机构、捐赠者提供者之间迫切需要政策一致。


    # 发展中 ICT 的安全考虑


    互联网全球关联的性质意味着一个国家采用的政策和实践能够影响其他国家网络使用的安全性和。在这种背景下，发展一种造福全球所有用户的安全文化，并资助维持这种环境所需的支出，对于下一个十亿互联网用户来说将特别具有挑战性。


    2003 年之前，大多数病毒来自发达国家，主要动机是扭曲的乐趣感和名声追求。今天，全球最大的热点是俄罗斯、中国和巴西，最常见的动机是信用卡诈骗，尤其是使用记录器（记录器在很大程度上已成为过去式）。现在全球最大的热点是用户几乎无法察觉的键盘记录器。另一种常见的黑客形式是捕获全球的计算机作为僵尸网络来发动拒绝服务攻击，然后这些攻击被用于强制在线购物网站支付赎金。在保障发展中国家安全方面，倡措可能需要国际合作。讽刺的是，发展中国家目前拥有的主要保护形式之一是连接速度缓慢，这使得他们的系统对黑客缺乏吸引力。


    安全与隐私担忧之间的平衡，特别是在在线购物、智能电网和在线搜索等领域。


    发达国家和发展中国家的安全担忧是相同的。有很多工具可以解决这些问题，但问题在于缺乏执行和跨国合作。年轻人对将 ICT 安全作为可能的职业道路的意识和兴趣缺失是一个特殊的空白，尤其是在发展中国家。


    能力建设发挥着作用，还需要在安全与隐私之间取得适当的平衡。优先事项的顺序应该是预防，其次是缓解，然后是起诉。


    # ICT 与环境


    所有利益相关者面临的关键任务之一是如何利用 ICT 改善环境性能并缓解整个经济部门的气变化。这在第 6 章进行了详细讨论。


    据估计，ICT 占全球温室气体排放 2-2.5%，预计未来这些排放量将增加。另一方面，ICT 有潜力将其他部门温室气体排放减少为其直接污染影响五倍。还存在效率提高带来的“反弹效应”问题（例如，更廉价、更广泛的能源导致使用量增加）。这种现象在发展环境中尚未得到充分研究。


    一个更广泛的问题是，今天的发展中国家是否遵循与发达国家类似的长期发展模式，从农业到制造业到服务业。发展中国家能否跳跃式进入 ICT 驱动的服务？需要考虑的问题包括：


    - 数据接入；

    - 理解生命周期影响；

    - 管理可能的反弹效应；

    - 技术转移。


    ICT 对环境的影响案例可以在香港和珠江三角洲找到。该地区数据中心的蓬勃增长引发了涵盖四个主要领域的绿色倡措：


