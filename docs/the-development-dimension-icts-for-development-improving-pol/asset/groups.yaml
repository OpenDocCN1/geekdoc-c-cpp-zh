    ## 94 - 3. 发展中国家如何参与全球互联网经济


    尽管缺乏正式的移动支付系统，他们通过手机进行汇款。孟加拉国的移民正在使用“灵活充值”（一个客户可以将价值转入另一个预付账户）。通常情况下，移民会与村庄的灵活充值销售人员保持良好关系，这些人员会将充值转移的价值“兑现”给移民的家人（需扣除佣金，佣金可能高达
    20%，最低为零）。讽刺的是，在菲律宾——世界上唯一合法移动汇款服务的国家，使用此类系统的移民反而更少（图 3.11）。解释在于替代方案的可用性。看来，孟加拉的汇款替代方案没有菲律宾那么有吸引力。


    ## 图 3.11：移动汇款服务的使用

    （社会经济分类 D 类和 E 类工人的百分比）


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_95_0.png)


    来源：LIRNEasia (2009). Teleuse@BOP3 移民工人研究。调查结果。


    随着更多应用程序的出现，可以预计手机除语音以外的使用将增加，让大量贫困人口体验通常与桌面电脑到宽带管道相关的功能。随着这些用途的增加，预计对更利于良好移动网络体验的
    3G 及以后网络标准的需求拉动将变得增强，供应也将变得无处不在。通往互联网的移动路径越来越成熟，可以预计对传统路径的补充性使用将增加，那些希望打印或扫描文档或图片的用户，以及那些希望针对特定任务使用更大屏幕和键盘的用户。


    ## 互联网/电信接入与服务业的财富创造


    服务业一直是一个剩余类别，包括任何不属于农业（渔业和采矿业）和制造业的内容。因此，发展中经济体服务业规模巨大且通常不断扩大，这本身不能作为它们正以能够使大量人口脱困的方式发展的。尽管如此，服务业随着生产率的提高，在吸收农业和制造业过剩劳动力方面确实发挥着重要作用。


    知识部门是服务业的一个子部门。例如教育、研究和软件。该部门严重依赖信息通信技术（ICT），但事实上，ICT 贡献财富创造的作用延伸到整个服务业、制造业和农业。ICT
    在知识型经济的出现中起着基础性作用，在这种经济中，基于知识系统应用的创新发生在所有部门。如果没有 ICT，很难或无法将知识代码化并以低成本在各种流动和规模内对其进行传输。


    接入互联网和电信网络有助于财富创造的基本论点，建立在所可能实现的知识以及可以实现的时空摩擦的减少之上。仅接入 ICT 并不会导致财富创造；它是与治理和金融基础设施共同构成的基础要素。没有教育/技能、投资和创新，就无法实现预期结果。接入
    ICT 是必要条件，但不是充分条件。


    ## ICT 会导致发展吗？


    接入 ICT 具有互补性这一事实使得建立与发展结果之间的因果关系变得困难，尽管已经过多次尝试，每种尝试都有自己的缺点。在宏观层面，索洛（Solow）曾著名地说：“你随处可以看到计算机时代，唯独生产力统计中没有。”有人认为存在滞后因素，也有研究显示了其贡献。在经济发展的特定背景下，世界银行在
    1999 年做出了权威性的努力来建立这一观点。


    在微观层面，案例研究比胜胜完。也许最严谨的论证是关于印度喀拉拉邦沿岸在手机出现之前，几个相邻但相互独立的鱼市场的生产者价格、消费者价格和浪费情况的分析。这项自然实验清楚地证明了消费者和生产者都受益，且市场实现了均衡（消除了浪费），因为渔民在前往某个市场之前会拨打多个鱼市场，然后去价格最高的那一个。据报道，在手机出现之前，所有返回家乡的船只中，有
    35% 卖出了捕获物。在这种模式下，工人不需要长时间与家人分离，他们及其雇佣的企业的资金在当地经济中循环，创造了更多财富。工作场所和工人流动对基础设施造成了压力，但长期结果通常是建设了完善的基础设施，其受益者多于服务出口公司。


    在许多发展中国家，服务出口业创造了财富并让更多的人脱贫。当然，允许功能分化和非核心活动外包的现代商业实践最终也会渗透到国内经济中，创造出回流而非外包的条件。这导致国内公司变得更高效和/或对客户反应更敏感，并在主要城市聚集区之外创造了就业。外包和回流自
    20 世纪 90 年代以来在印度南部和西部繁。普遍认为，这些地区对印度经济增长故事做出了不成比例的贡献。分析 ICT 以及其他各种因素（如人口红利）对服务贸易的具体贡献已超出本章的范围。只需说，由
    ICT 推动的组织化和出口导向型服务业的增长，对印度近期的经济增长以及大量印度人随之脱贫做出了重大贡献，这些教训可以推广到其他国家。


    ## 有利互联网经济的政策与监管


    政策和监管的传统观念是从公共管理理论得出政策框架和监管工具，并受到显性或隐含国家理论的影响。在发展中国家的情况下，国家缺乏某些元素或属性——例如，对合同神性的充分尊重。在某些情况下，投资者会得到承诺和保证，但一旦投资到位，投资者的谈判能力萎缩，保证就会消失，或发生直接或行政征收。投资保险被视为一种解决措施，建立特定行业的监管机构和制度以管理特定行业，特别是那些容易受到行政征收的资本密集型基础设施。


    ## ICT 与服务贸易


    电信和互联网接入对财富产生的意义也可以进行讨论。根据服务贸易总协定（GATS）的规定，有四种认可的服务贸易模式：


    - 模式 1：卖家留在 A 国，消费者留在 B 国。

    - 模式 2：消费者前往 A 国。

    - 模式 3：卖家留在 A 国，消费者留在 B 国。

    - 模式 4：卖家前往 B 国。


