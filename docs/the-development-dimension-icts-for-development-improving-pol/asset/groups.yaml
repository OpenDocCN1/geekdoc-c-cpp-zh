    In the early days of regulation, most experts agreed to name three top priorities
    answered “interconnection, interconnection and interconnection”. In the budget
    telecom network model, the highest priorities are market entry and spectrum management.


    Research on customer behaviour has shown that workarounds for imperfect interconnection
    have been devised. The incumbent fixed operator’s refusal to offer interconnection
