    to users of broadband services offered by mobile operators.


    The budget telecom network model rests on aggregating small amounts of use from
    users that will help absorb the available capacity, rather than on the obsolete
    and misleading concept of average revenue per user (ARPU).⁸ With individual users
    connecting from handsets, netbooks, laptops or desktops, the key is keeping transaction
    costs (e.g. customer acquisition and billing) to a minimum. Another way of achieving
    the same result is to have low-volume users connecting to the Internet from common-use
    facilities such as telecentres and cybercafés. The earlier focus on fixed connections
    such as ADSL or VSAT links for telecentres is increasingly being replaced by access
    supplied via mobile operators, HSPA or even 2.5G connections. This shifts the
    debate about a mobile-versus-telecentres frame to a mobile-and-telecentres frame.


    # Applications


    Teleuse@BOP qualitative research shows that low-income users are indeed using
    cybercafés and mobiles in complementary ways, downloading music in indeed via
    Bluetooth to mobiles and then listening on handsets, for example.


