    ## 1. 184 – 7. 教育领域 ICT 的政策一致性：南亚案例


    公司除了向个人和学校销售产品外，还与各州政府签署了谅解备录（MoUs），旨在通过专注于政府学校的明确倡议来设计和交付内容。


    ## 斯里兰卡


    斯里兰卡2002年的《学校教育信息技术国家政策》（NAPSITE）旨在“设想并预见 IT 教育未来的全球挑战，并为应对这些挑战制定适当的人力资源发展良好基础”。此外，它还寻求提高所有公民的信息素养，通过学校系统创造学习机会，并使
    ICT 成为普通教育各阶段教学和学习的工具。具体而言，NAPSITE 表明了以下需求：


    - 在学校普通教育中引入、维持和增强 ICT 的参与度，并创造基于 ICT 的学习和教学机会。

    - 在职前和职后教师发展及培训计划中引入 IT，并为教师的系统性专业发展创造机会。

    - NAPSITE 还提到需要建立一个多媒体软件和网络开发中心。


    斯里兰卡政府意识到，当地语言相关内容的匮乏是大量人群采用 ICT 的障碍，因此通过其信息和通信技术局（ICTA）启动了 Shilpa Surya 项目，以用僧伽罗拉语创建数字内容。Shilpa
    Surya 项目让学生能够在电信中心使用 ICT 学习八门学科，以为国家考试做准备。此外，国家 ICT 素养项目旨在通过一个名为 `nensalas` 的农村服务中心网络提供培训，以提高人口的电子素养水平。


    ## 巴基斯坦


    2005年《教育国家信息和通信技术战略》（NICT）强调将 ICT 既作为一门学科也作为关键的教学辅助。其目标是通过教师开发的自己的教学学习材料所创建的当地相关内容，利用
    ICT 改进学生学习。它还建议将基于 CD-ROM 的软件（包括来自相关网站和教育门户的条目和链接）发给学校、专业发展中心和教师培训机构，以帮助职前和职后教师扩展其内容知识。


    NICT 还强调，鉴于 ICT 提供的工具和教学技术，需要对整体课程进行全面改革，以丰富每个阶段的教育。它强调需要利用 ICT 提供国际或国家制作的优质内容，以补充现有的教科书和材料。这些内容通过其灵活性、互动性和多模态（广播/电视等），将改善学生的学习。


    该政策建议各部委、教育部门和地区教育局建立有限的搜索引擎——即供学生使用的适当内容在线数据库集合。在根据指南对国家需求进行调整后，可以使用国际开放教育资源以及课程和内容开发模型。


    ## 不丹


    不丹2004年的《信息和通信技术政策与战略》（BIPS）旨在根据市场需求创建将 ICT 作为一门学科的适当课程，以及面向所有学校学生的通识 ICT 素养和能力课程。


    《第26届教育政策指南与说明》（EPGI-2007）指出政府意图是让完成基础教育（即十年级级）的教师和学生具备 ICT 素养。为此，自2007年4月起，不丹电信提供所有免费的拨号上网套餐包。因此，敦促拥有计算机和互联网设施的学校为学生引入相关的
    ICT 项目，并鼓励利用互联网学习，特别是在课后和周末，此时这些设施通常未被充分利用，且学生有充足的时间练习和学习。教育部门的课程与专业支持处制定了一个标准的
    ICT 素养框架，敦促学校启动并实施 ICT 项目。


    当地内容开发的一个战略组成部分是信息技术部（DIT）正在执行的 Dzongkha（不丹语）本地化项目。Dzongkha Linux 的 Beta 版本于 2006
    年发布，能够用不丹语（不丹的官方语言）进行如文字处理、电子表格和 PowerPoint 演示文等常见的桌面计算任务。这标志着对开源软件开发承诺的开始。消除语言障碍是另一项成就。DIT、国家图书馆和语言文化研究所正合作建立“不丹国家数字图书馆”（NDLB），旨在展示不丹的生活、传统和文化方面，并为学者提供资源。


    其他关注此的国家——阿富汗、马尔代夫、孟加拉国和尼泊尔，在强调当地相关内容重要性的同时，并没有专门阐述开发这些内容的战略。相反，他们专注于培养合格的 ICT
    专业人员，以促进其当地 ICT 行业的发展，反过来又为内容开发创造当地能力。此外，正在进行的倡议专注于用当地语言创建当地相关内容。


    ## 阿富汗


    阿富汗的 ICT 政策强调了在中等和高等教育阶段推广有效的 ICT 培训课程的需求。它侧重于为教师和培训师开发课程和材料。阿富汗的内容开发能力仍在完善，重点是培训教职员工、IT
    专业人员以及支持通用 ICT 行业。可以通过远程教育中心获取国际内容。还鼓励内容开发的伙伴关系；例如，教育部在亚洲基金会（The Asia Foundation）的帮助下，已将
    10-12 级的科学科目以 DVD 的形式数字化。


    ## 马尔代夫


    在马尔代夫，规划与国家发展部的《第七次国家发展计划》完全致力于扩大目前的 ICT 水平。它强调需要为中等阶段的所有学生提供计算机，并制定一套侧重于 ICT
    技能和使用（包括互联网）的小学中学国家课程。


    ## 孟加拉国


    同样，孟加拉国2009年国家 ICT 政策强调需要通过改进 ICT 学科的课程来培养更多经过培训的 ICT 专业人员。该政策规定了从小学到高等教育各阶段使用
    ICT 的战略重点领域。内容开发被强调为重点，包括需要为教师和学生创建一个电子学习内容的中央存储库，并为内容开发提供激励。


    ## 尼泊尔


    尼泊尔2000年 IT 政策强调了“到2010年实现全全民计算机教育”的需求。它提议在中等阶段分阶段引入 ICT 作为一门学科。尼泊尔开放学习交易所（OLE）是一个非营利组织，致力于通过开发易获取的开源基于
    ICT 的教育教学学习材料，帮助尼泊尔政府实现其目标。OLE 建立了一个名为 E-Pustakalaya 的数字图书馆，包含了所有所需的当地语言课程教科书。


    ### 框 7.1. 内容与课程开发：总结


    - 几乎所有关注的国家在中等阶段（印度、斯里兰卡、巴基斯坦、不丹、尼泊尔、孟加拉国、马尔代夫和阿富汗）都规定了将 ICT 作为学科的课程。

    - 在小学阶段，课程侧重于通识 ICT 素养和提高对技术的熟练程度。

    - 某些国家的政策强调了将 ICT 作为教学工具的使用（印度、巴基斯坦、孟加拉国 (2009) 和斯里兰卡）。

    - 极少数国家阐述了内容开发的战略（印度和不丹），尽管许多国家确实有特定的倡议（例如斯里兰卡的 Shilpa Sayura）。

    - 巴基斯坦的 NICT 是唯一明确强调鉴于 ICT 提供的工具和教学技术需要对整体课程进行全面改革的政策。


    开发相关内容的限制：


    - 国家缺乏 IT 专业人员；

    - 缺乏资金、基础设施和资源；

    - 缺乏当地内容开发倡议；

    - 缺乏数字教育内容的明确定义标准；

    - 传统课程中没有关注数字内容。


