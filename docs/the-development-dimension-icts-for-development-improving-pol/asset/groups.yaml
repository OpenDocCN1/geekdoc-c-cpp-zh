    ## 132 – 4. 政府在宽带发展中应扮演什么角色？


    渗透率仅略高于1%：见图4.9。到2009年中，移动宽带用户数已达到170,201人，移动运营商已收购了几家互联网服务供应商，以帮助他们在与ADSL的竞争中销售服务。


    ## 图4.9：埃及宽带用户数（每100人）


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_133_0.png)


    来源：Olfat Monseh (NTRA) 演讲。


    埃及正在采用公私合作伙伴模式，赋予房地产开发商安装被动基础设施（即暗纤）的权利，这些可以租赁给不同的网络接入提供商（即埃及电信和其他ISP）。房地产开发商可以与服务提供商协商收益分成协议。2009年9月30日，埃及宣布计划提供两项三合一业务许可，旨在五年内吸引10亿美元的投资。


    另一个进一步发展的例子是智利，作为拉丁美洲的宽带领导者，其在2008年的渗透率仅为每100人9名用户。到年底，固定线路宽带用户已达到140万，但预计只会额外增长50%。这是因为预计未来的大部分增长将发生在移动宽带，预计移动宽带将在2012年之前超过固定线路宽带。竞争水平可能受限于事实：领先的3G移动运营商Movistar是西班牙电信集团的一部分，因此与现有的固定线路运营商绑定，但市场上的另外两家参与者Entel
    PCS和Claro由竞争性公司拥有。预计2009年将拍卖额外的3G频谱。


    移动运营商通过更低价格的套餐和预付订阅选项，在提高宽带可负担性方面发挥了特别影响。他们还提供与后付订阅捆绑的具有3G能力的折扣价格网络。在一个约60%的人口没有笔记本电脑的市场中，这特别具有吸引力。


    ## 捐助社区的角色


    捐助社区可以在帮助制定宽带战略和开发其宽带服务方面发挥作用。通过共享信息、基准比较、提供技术援助和监管支持，国际组织可以帮助政府改善市场运行、刺激投资并从其他国家的经验中学习。在这种背景下，建立宽带指标基准以进行国际比较是非常重要的。OECD通过其宽带指标门户网站（www.oecd.org/sti/ict/broadband）在该领域建立了地位，但需要将此范围扩大到发展中地区，特别是价格和服务供应的比较。


    世界银行可以提供帮助，例如为战略投资提供融资以支持基础设施关键部分的发展。国际海底电缆、跨境连接和高容量骨干网络都是世界银行投资可以发挥催化作用的领域，引入部门投资并改善服务交付。世界银行目前支持政府通过公私合作伙伴关系（如非洲东岸的EASY电缆和整个东部的RCIP计划）克服关键基础设施瓶颈。


    宽带是公共和私营部门投资项目组合中的增长领域。目前已承诺ICT投资项目的资金超过10亿美元，这是吸引70亿美元投资资本的催化剂。世界银行正在进行一项重大工作，收集宽带政策的国际经验，并开发一套全球政府和监管机构使用的工具包。它欢迎在此项活动中与其他组织合作。


