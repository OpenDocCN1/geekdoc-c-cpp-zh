    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT – 31


    economically and politically powerful. Nonetheless, the question of who benefits
    from ICT4D policies – the global North, the global South, particular stakeholders?
    – is still asking.


    # Question 2: Is there coherence – balance – in policy amongst the various parts
    of the ICT-for-development value chain?


    In simple terms, the ICT4D value chain traces the transformation of technological
    inputs into development outputs (Figure 2.1). In more detail, it is divided into
    four focal areas:


    +   - Readiness: countries require a set of precursor systems as legal foundations
    and human and technological infrastructures. Through strategic actions – including
    policy – these become specific programme and project inputs such as money and
    technology, and softer inputs as motivation and political support.


    +   - Availability: inputs implemented into a set of programme-specific deliverables;
    intermediate items as a telecentre or mobile phone system.


    +   - Uptake: the actual adoption and use of digital technology, including questions
    of the sustainability and scalability of particular ICT4D programmes.


    +   - Impact: the familiar threes of outputs, outcomes and development impacts;
    outputs the immediate behavioural changes that an ICT4D project causes; outcomes
    being the individual and community benefits that ensue; and development impacts
    being the extent to which ICTs help wider development goals to be achieved.


    How has the focus of ICT4D policy changed over time the value chain? For many
    years – and in some agencies, for some policies, today – attention has been given
    to the foundations. Only recently have policies begun extend themselves fully
    to look at what and how people use those foundations and, most important, what
    contribution the technology is making to development.


    ICT for development might lack coherence if they only focus on the early parts
    of the value chain. So when we analyse policy, we can ask – what is it covering?
    Is it only looking at the foundations – at issues of readiness and availability
    – or does it have the whole soup-to-nuts coherence that includes not laying down
    the railway tracks and buying the trains but also ensuring that someone uses them,
    and that the buying helps national development?'
