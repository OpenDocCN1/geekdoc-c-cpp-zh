    ## 税收


    税收未包含在 GATS 协议 4 参考文件中，直到最近在电信政策和监管的讨论中经常被忽略。这已不再可能，因为税收的尾巴已经开始摇动监管的狗。只有当将税收视为主要目的、将电信服务视为次要目的时，某些政策或监管行动才是可以理解的。


    行业游说团体 GSM 协会（GSM Association）的研究显示，每为移动服务花费 100 单位货币，就有高达 44% 被提取作为税收（包括许可证费、频谱费、通用服务义务费、销售税等），运营商充当了税收员的角色。这显然对廉价网络模型是有害的。手机和
    SIM 卡的一些税收是累进性的，构成了贫困人的准入障碍。肯尼亚是一个例外，最近减少了此类税收。


