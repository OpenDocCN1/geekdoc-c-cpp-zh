    The idea of making universal service obligations transparent by replacing vague
    commitments to extend services to the un- and underserved through cross subsidies
    with universal service funds was a good idea in time and complied with the provisions
    of the GATS Protocol 4 Reference Paper. However, experience suggests that most
    universal service funds have become counterproductive. Billions of dollars of
    universal service levies lie unspent in government accounts or are being used
    for general expenditures. Where money has been disbursed it has generally gone
    to fix network operators, most incumbents. While the un- and underserved areas
    are being connected not by subsidised fixed line operators but by mobile operators,
    and low-income customers, intended intended of universal service policies, are
    paying to support the inefficiencies of incumbents. A strong case can now be made
    that universal service funds and levy percentages no longer satisfy the criterion
    of being “no more than necessary to achieve the defined universal service” and
    therefore are in violation of the commitments made under Protocol 4 of the GATS
    by many countries.


