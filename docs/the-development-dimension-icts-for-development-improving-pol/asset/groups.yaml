    | Environmental planning: GtCO2e | Abatements | ICT |

    | :--- | :--- | :--- |

    | 2002 | 40 | 5.1 |

    | 2020 | 14.1 | 7.8 |

    | BAU | 3.9 | 1.4 |

    | 2020 | - | - |


    Note: BAU – Business as Usual. GtCO2e – gigaton of carbon dioxide equivalent

