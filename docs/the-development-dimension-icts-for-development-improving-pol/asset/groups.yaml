    ## 3. 发展中国家如何参与全球互联网经济 – 79


    参与互联网经济，尽管其形式尚有些受限且不熟悉。


    随着各国引入 3G 移动网络，高端手机向低收入群体的迁移将加速。截至 2008 年 10 月，孟加拉国社会经济分类（SEC）D 组和 E 组的新手机中位价为
    43 美元（平均 58 美元）。二手手机的中位价为 29 美元（平均值 35 美元）。作为 LIRNEAsia Teleuse@BOP 研究的一部分，定性研究显示，许多二手手机其实相当先进。这两类手机都被用于通过蓝牙将音乐从手机传输到另一部手机、听音乐、观看和玩游戏、获取新闻和就业信息（有时是唯一来源），以及记录交易情况。在斯里兰卡、菲律宾和泰国，这些可支配收入、识字率和普及率较高的国家，贫困人口的使用范围和频率要得多。


    显然，当农业信息可以根据用户需要随时获取时，其利用率要高于在有固定营业时间的营业亭或家庭中获取。孟加拉国的 Cellazaar 等创新公司正在通过 SMS
    和 WAP（无线接入协议）为金字塔底层（BOP）用户引入基础电子商务，这些用户否则可能永远无法获得此类服务。2009 年印度大选候选人的信息（如其特定资产和负债、受教育程度以及是否有犯罪记录）可以通过
    SMS 获取。BuzzCity 和 Gushup 正在移动空间领域创建社交网络。一旦移动支付的监管问题得到解决，手机可能会像信用卡一样成为发展中国家主要的支付方式，这在非洲某些地区已经如此。


    ## 纳入先决条件


    数十亿贫困人口实现电子连接并能够使用互联网的一些功能是值得庆祝的，但不应因此自满。例如，大多数贫困人口使用的 2G 网络和手机目前的能力无法实现传统桌面电脑/笔记本电脑上网使用中被视为所当然的复杂搜索和信息检索活动。除了
    Twitter 之外，发布（指在网站和博客上发帖）在简单的移动手机上操作非常繁琐。作为 LIRNEasia Teleuse@BOP 研究的一部分，定性研究显示，深度用户会同时使用两种模式：例如，在咖啡馆下载音乐，通过蓝牙传输并在手机上收听。


    ## 80 – 3. 发展中国家如何参与全球互联网经济


    那么，如果新兴的互联网经济要具有包容性，必须改进移动手机和电脑的宽带接入毫无疑问。全球政府必须优先加速频谱改革，并透明地释放频谱，以便运营商能够提供 3G
    及以上的技术。仅将频谱视为释放点时的政府收入来源，无不利于广泛部署或政府收入的长期产生。


    接入网络或“最后一公里”中无线技术的价值并不抵消回传组件中有线的基本重要性。每个 WiFi 热点都是将我们连接到互联网云（大多数情况下是美国本土）的一系列有线。正如链条的强度取决于其最弱的环节，个人互联网连接的整体性能取决于连接中最慢的组件。LIRNEAsia-IIT
