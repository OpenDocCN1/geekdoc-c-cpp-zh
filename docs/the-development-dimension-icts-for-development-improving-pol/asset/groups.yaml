  - '[PAGE 25]


    conservation, water treatment and conservation, green building materials and ensuring
    quality of life.


    Efforts at greening data centres include improving processing power while reducing
    power consumption, better server consolidation and a more eco-friendly approach.
    According to the US Environmental Protection Agency, it should be possible to
    improve power efficiency compared with the current technology curve by up to ten
    times in the next five years.


    In terms of developing new strategies, an appropriate approach is to reuse existing
    strategies and adapt them, for instance by using the Data Centre Code of Conduct.
    Many organisations have long-term contracts for ICT supply which may constrain
    opportunities for green innovation. Flexibility is required, as well as setting
    definite targets to be achieved. Product design is an important area to address,
    especially for reducing power requirements for cooling. Emphasis should be put
    on “pop-out” and “upgrade” technology. “Dirty ICT” products are becoming increasingly
    hard to process without waste disposal.


    “Green ICTs” have been defined as the intersection between environmental and efficiency
    goals within an enterprise. In other words, so much about greening processes the
    ICT sector alone, but using green initiatives to improve sector-wide goals. Typical
    applications for green ICTs are in power and logistics management. Although PCs
    are switched off, LANs are rarely active and their weekend power consumption is
    typically 95% of that on weekdays. Computer centre managers need to be educated
    to identify opportunities for power- and cost-saving.


    There is a tendency to overlook the very urgent need to address the ICT sector’s
    own greenhouse emissions in the enthusiasm to promote their potential to reduce
    emissions in other industries and improve environmental performance through applications
    across economies.


    # ICTs for education


    Greater use of ICTs in schools can help achieve development goals related to universal
    primary education and the elimination of gender inequality in education. However,
    doubts remain as the priority ICTs should be afforded relative to other educational
    needs.


    There has been a tendency to overs the benefits of ICTs for education; in reality,
    the evidence base is still sparse. The knowledge maps of ICT for education published
    by infoDev in 2005 were rather alarming in exposing how little is known to date
    and provable about direct benefits.'
  - '[PAGE 26]


    The results of regional studies commissioned by infoDev on ICTs for education
    in Africa (2008) and the Caribbean (2009) show their increasing use in different
    places at different speeds.


    In Africa, Ghana, Rwanda and Senegal might be considered as leading the way, while
    in post-conflict situations, like Liberia or Sudan, are lagging. As many as 48
    of the 53 African countries have policies in place, but in general civil society
    and the private sector are setting the pace. There is a lack of implementation
    capacity as well as infrastructure for both supply and ICTs. Gender equity is
    also lacking. Macro trends include public/private partnership, digital content
    development, open source software, regional initiatives, national research and
    educations networks, international connectivity and wireless networks.


    By contrast, the Caribbean forms a more cohesive region in terms of understanding
    trends. ICTs are perceived as a way of effecting change. The focus is on ICT skills
    development. There is a regional ICT exam and broadband is typically rolled out
    to schools without additional costs.


    The preliminary outcomes of the newest regional survey commissioned by infoDev
    covering India and South Asia are presented in Chapter 7. The eight countries
    of the region are at different stages of development, but it is nevertheless possible
    to generalise an ICTs for education (ICT4E) ecosystem and identifies aspects that
    need to be defined as a “policy plus” approach.


    The OECD’s Programme for International Student Assessment (PISA) finds a link
    between frequency of use of computers at home and improved student performance
    (Figure 1.6). It is more difficult, however, to show the same relationship between
    computer use in schools and improved student performance. Indeed, when the influence
    of socio-economic status of students is taken out of the equation, any relationship
    begins to disappear. The evidence seems to be that of ICTs further benefits those
    who already have good performance, and not harm those who do not.


    There is a gap between the lives of students at home and in school. The average
    15-year-old in OECD countries spends about two hours per day at home in front
    of a computer and less than one hour per week on a computer in school. The question
    arises: is it worth investing more in ICTs for education? Will there be a pay-off,
    financially and in terms of equity?'
