  mdcn: '

    基础设施是部署教育信息技术（ICTs）的关键。必须关注基础设施需求的方面性，从合适的建筑/教室到电力和供应，再到复杂的硬件、


    ## 192 – 7. 教育 ICT 领域的政策一致性：南亚案例


    系统软件，以及最重要的是连接性。所有这些参数的趋势显示，政府在确保有效基础设施可用性方面的成效参不齐。虽然马尔代夫和斯里兰卡等国拥有相对较高水平的教育和 ICT
    基础设施，但其应用和内容开发慢于印度等国；印度的基础设施不完善，但拥有一个快速发展的 ICT 行业，能够为教育开发许多新的应用和内容。不不丹和尼泊尔在提供基础基础设施方面面临地理和气候的挑战。


    除了地理因素外，阿富汗和巴基斯坦不稳定的政治局势也是基础设施充分发展的障碍。孟加拉的基础设施可用性记录也较差。


    几乎所有重点国家都关注了改善基础设施的政策，根据各国不同，涵盖 ICT、教育、教育 ICT 以及基础设施等政策。基础设施的核心组成部分是连接性、硬件、软件以及电力、教室等支持因素。


    根据印度的政策草案，每所学校的 ICT 要求将根据其规模和州政府规定的标准来确定。政策草案设想，所有中学将开始配备适当、充足且成本效益的先进 ICT 以及其他性基础设施。这包括配备充足硬件和软件的计算机实验室、配备数字静态和视频摄像头的
    AV 室、音乐音频设备、数字显微镜和望远镜、用于研究各种物理参数的数字探针、EDUSAT 终端的充足硬件等。


    每所学校都将建立局域网（LAN）并至少 2 Mbps 的专用宽带连接。除了计算机实验室的互联网连接外，连接还将覆盖学校图书馆、教师休息室和学校管理办公室。每个州将规划一个
    EDUSAT 网络，配备交互式终端和仅接收终端。每个州可能计划至少 1000 个终端。


    中学阶段将引入丰富的软件组合，涵盖从标准办公到图形和动画、桌面出版、网页设计、数据库和编程工具的一系列软件。为了实现具有成本效益的软件使用和开发，优先选择免费和开源软件应用程序。


    印度的政策草案还强调，高效维护 ICT 设施所需的性基础设施将得到定义、建立和维护。这包括充足且定期的电力供应，以及大房间、良好的通风和其他支持性基础设施。


    用于发展的 ICT：提高政策一致性 © OECD 2009


    ## 7. 教育 ICT 领域的政策一致性：南亚案例 – 193


    巴基斯坦的国家信息技术政策（NICT）虽然强调了其六个要素中的每一个都具有对充足 ICT 基础设施的需求，但并未勾概述在每个层级创建此类基础设施的明确战略。相反，该文件被视为联邦、省和学校级管理人员的一套指南，旨在帮助他们提高能力并量身定制将
    ICT 整合到其所在级别教育系统的战略。巴基斯坦的 NICT 强调了 ICT 对教育的重要性，一些相关规定包括：


    - 通过公私部门倡议启动一项计划，为大学、学院和学校提供低价计算机和互联网连接。

    - 将所有大学、工程学院、医学院和高等教育机构网络化，以提高教育质量。

    - 建立电子图书馆，确保经济且公平地获取世界信息。

    - 鼓励教育机构将其注册、考试、会计和其他活动计算机化。

    - 鼓励教育机构采用计算机辅助学习和其他 ICT 工具来辅助教学过程。

    - 建立虚拟教室教育计划，利用在线、互联网和/或视频设施为大量人员提供远程学习。

    - 建立国家教育内网（连接互联网），以便共享教学和研究设施以及教职员工的电子图书馆。


    “斯里兰卡”计划始2003年，通过实施多项倡议将 ICT 益处扩大到贫困地区；e-Sri Lanka 侧于提供基础设施和硬件安装，而 NAPITSE 则专注于创建充足的人力资源并开发高质量内容，以确保
    ICT 整合教育的利益最大化。


