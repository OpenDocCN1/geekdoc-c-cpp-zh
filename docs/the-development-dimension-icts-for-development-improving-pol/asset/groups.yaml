    竞争性的垂直价格挤压日益加剧。廉价电信网络模式的成功取决于价格的灵活性，以及对垂直价格挤压等策略的防御。


    ## 资费监管


    旧式的资费监管对于廉价电信网络模型的有效部署是不恰的。在任何情况下，当每家公司提供数十种甚至上百种服务组合时，价格或收入监管都难以实施。在实践中，采取的做法是事实上的宽容，即所有资费或或少常规地获得批准；或者至多采取不对称监管，即仅对具有显著市场支配地位（SMP）运营商的资费进行监管。这种做法的弱点在于，SMP
    的认定以及产生的监管行动极其复杂，大多数发展中国家的监管机构无法执行这些措施。最终结果可能是导致监管瘫痪，从而无意中维护了现有运营商的利益。


    分带宽容（Banded forbearance）即一个国家选择与其他国家的价格进行基准对比是一种可能的解决方案。在这里，所有运营商（包括现有运营商）在通过基准对比定义的范围内都获得灵活性。如果价格低于下限，将根据根据说明的竞争相关标准触发审查。阈值将根据税收或同行国家价格波动等外部因素进行定期调整。


    ## 服务质量监管


    正如人们无法期望莱恩航空（RyanAir）提供银牌级服务一样，人们也不能期望廉价电信网络提供优质服务。由于需要挤压大量流量，所有运营商可能都会提供次优的服务。严格且激进的服务质量（QOS）监管对该模型是有害的。然而，期望竞争能防止运营商让
    QoS 降到不可接受的水平也是天真的。因此，对 QoS 进行温和的监督，重点关注发布相对于基准的性能情况，并确保不满的客户更换供应商的障碍保持在低水平，是最合适的。


    ## 通用服务


    通过通用服务基金取代通过交叉补贴将服务延伸至未覆盖和服务不足地区的模糊承诺，从而使通用服务义务透明化，这一想法在当时是一个好主意，并符合《服务贸易协定》（GATS）协议4参考文件的规定。然而，经验表明，通用服务基金已变得适得其反。数十亿美元的通用服务费闲置在政府账户中未未使用，或被用于一般支出。在已发放资金的情况下，通常用于救助网络运营商（大多数为现有运营商）。当未覆盖和服务不足地区并非通过补贴的固定电话运营商而是通过移动运营商实现连接时，低收入客户（通用服务政策初衷）却在为支持现有运营商的低效买单。现在可以得出充分的理由认为，通用服务基金和征收比例不再符合“为实现定义的通用服务所必需的最低”的标准，因此违反了许多国家在
    GATS 协议4 下所做的承诺。


    ## 电信监管环境


    lirAsia 在 2006 年和 2008 年就讨论的维度对几个亚洲国家的电信监管环境（TRE）进行了评估。表 3.6 给出的 2008 年关键结果显示，知情利益者认为，研究的所有国家
    TRE 都有很大的改进空间，但微型国家马尔代夫除外，认为知情利益者的数量有限可能阻碍了坦诚的回答。


