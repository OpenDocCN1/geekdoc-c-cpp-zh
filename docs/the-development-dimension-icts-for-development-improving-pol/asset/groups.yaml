    ## ICT4D 2.0’s new worldviews for action


    The actors in the ICT4D field are drawn from particular disciplinary backgrounds.
    What can we learn by looking at their backgrounds?


    Many of those active in the field draw from a computer science background. From
    some with what we might call the “harder” end dealing with hardware and firmware,
    some from the somewhat “softer” ground of human-computer interaction. Such expertise
    is, of course, essential to ICT4D 2.0. It will be essential for delivering the
    new technological and application priorities detailed in Figure 2.4. It will be
    an essential part of laboratory/pro-poor and collaborative/para-poor innovation.


    But alone, it is not enough. And, where it stands alone, problems arise. The root
    of a number of ICT4D failures is identified as their techno-centric approach,
    dominated by an informatics worldview. Such projects are often analogous to the
    old medical joke, “The operation was a success but unfortunately the patient died”.
    They deliver a system that works technically but fails to make a developmental
    contribution.


