    某些国家（如大韩）比这种市场监管方法更进一步，通过提供财务激励让运营商进行投资和竞争。在宽带发展的早期，这使得能够“超越S曲线”，并以比预期的快的速度扩张其市场（图
    4.6）。韩国政府一直对宽带普及的供需两端进行干预，自1985年以来有六项主要计划。最初，政府资助了连接全国公共机构的骨干网络，并激励扩张光纤网络。它开发了广泛的电子政府计划，数字化并连接了公共机构。韩国政府还通过多项政策（如
    ICT 培训和促进本地应用）提供资金以培养需求。


