    # 40 – 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    +   * Power: with only 15% of rural households in sub-Saharan Africa having access
    to electricity, three areas of innovation continue to be required: new, low-cost
    devices for local electricity generation; better ways to store, carry and transmit
    electricity; and lower power consumption by ICT devices.


    But, in some ways, we stand at a fork in the Internet access road. Do we continue
    heading down the PC-based route less than 0.5% of African villages have so far
    got a link this way? Or do we jump ship to mobile telephony, which already reaches
    out to two-thirds of the African population? The requirement for hardware innovations
    appears to be relatively limited, but offerings from multinational firms appear
    to be diffusing fairly readily. Half the world''s population is mobile phone users;
    a greater number have access to a mobile; and growth rates are currently fastest
    in the poorest regions.


    Current growth rates will carry usage to over 90% of the world''s population,
    leaving the questions of reaching the last half-billion, and the spread of Internet-enabled
    phones, given that most phones in poor communities are currently calls-and-SMS-only.
    For both, the need for hardware innovation may re-emerge. There are also likely
    to be innovations as iPhone-and-apps-type on mobiles converge with notebook-type
    to produce lower-cost PC-like terminal devices, ending with something like a “Blackberry-for-Development”.


    # Box 2. Broadband: new hope/new divide


    Broadband is already an integral part of ICT usage in the global North. In the
    US (one of the poorer performers), by 2008 there were 25 broadband subscriptions
    per 100 citizens, and 55% of households had broadband, representing around 90%
    of all Internet connections. By contrast, the subscription rates for most African
    countries, including Ethiopia, Ghana, Kenya, and Uganda, were under 0.1% of the
    population. Tiny Andorra had roughly as many broadband subscriptions as Africa’s
    most populous country, Nigeria.


    So as we start seeing digital devices closing around Internet access and mobile
    phone ownership, a new broadband device is growing. This does and will continually
    require a strategic response, if not led, must at least be coordinated by government.
    And as where this happens, the development results will be impressive. Broadband
    uptake is associated at the macro level with growth in indicators such as employment
    and GDP, and at the micro level there are many new employment- and productivity-enhancing
    opportunities.'
  - '[PAGE 42]


    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 41


    Most likely, in dealing with the “remaining 5 billion” issue, ICTD 2.0 will simultaneously
    push along the PC and the mobile route. But some have asked whether the Internet
    should be the focus, or whether we should look at the poor have “voted with their
    wallets” and explore whether the simpler, cheaper technologies already in use
    can deliver ICT functionality? Rather than with handset and bandwidth upgrades
    to allow mobile Internet access, what can be achieved for development through
    calls and SMS? And what about older technologies? Access (as opposed to ownership
    or geographical coverage) figures are hard to come by, but we can estimate that
    something like 80% of the population in developing countries has access to a radio,
    and 50% to a television. Hence, early in ICT4D’s history, the reinterpretation
    of ICTs to incorporate radio and television.


    Hence, too, the role that convergence will play in ICT4D 2.0. In practice, this
    means looking at the technologies that already penetrate – mobiles, radios, televisions
    – seeking ways to add computing and Internet functionality. Pilot projects are
    already underway. Community radio stations answer to listener questions via e-mail
    and the Web and broadcast the response, as seen in Kothale in Sri Lanka. Telecentre
    databases allow farmers searches in the field with mobile phone, as seen in Warana
    in India. Many other hub-and-spoke innovations are likely to find a valuable application
    in future.


    # Box 2.4. ICT4D 2.0 and the rise of the individual


    There has been a central difference between the application of ICTs in industrialized
    and developing countries. In the global North the dominant ICT ownership and use
    model of the past decades has been the first household and then the individual.
    In the global South, contrast, the ownership and use model have been the community
    group.


    This model has inherited conceptually and practically within almost every ICT4D
    1.0 project. It helped ensure far greater reach-per-device than simple extrapolations
    of Northern suggest. The digital divide in the South has thus been overestimated,
    because shared access to ICT multiplies many times the basic technology ownership
    figures. This model has also been the source of broader benefits of some projects,
    which have helped to form or strengthen community groups. Such groups – often
    facilitated by an “infomiation” trained from within the local community –consider
    the implications of information received (e.g. about child health or agricultural
    improvements) or, latter, participate in creating their own digital content.'
  - '[PAGE 43]


    42–2. WHERE NEXT FOR ICTs and INTERNATIONAL DEVELOPMENT?


    # Box 2.4. ICT4D 2.0 and the rise of the individual (continued)


    This will continue into ICT4D2.0 but is challenged by a rise in household and
    even individual ownership, particularly of mobile phones. Early phone projects
    took a one-phone-per-community model, but this is being overtaken as mobiles diffuse
    further. Mobiles are having to substitute for some uses of community-owned ICTs
    and, as they slowly become portable radios, televisions, Web devices, etc., this,
    substitution will increase.


    With substitution disintermediations and less need for groups and infomediaries.
    This may spark a new release of entrepreneurial uses of ICTs for development.
    But it may also have negative consequences. These include loss of community cohesion
    and greater expression of intra-community and intra-household inequalities. We
    have already seen signs of the latter with the uptick in domestic violence associated
    with growing use of mobiles. So ICT4D 2.0 will bring new challenges as well as
    new opportunities.


    It will bring greater pressures to stop homogenising ‘the poor’ (as this does).
    Instead, there will be a need to differentiate groups with different needs and
    different vulnerabilities. The most obvious – partly recognised within ICT4D 1.0
    – will be differentiation of men and women. Other differentiations –location,
    income, age, and so on – may follow. The destination – taking Amartya Sen’s notion
    of “development as freedom” – may be to treat “the poor” as individuals.


    # New applications


    Moving upwards from the hardware core of ICT4D, we meet an issue that has been
    alive since at least the 1960s – that of interface design for development. It
    is a common mistake to equate the poor in developing countries with illiteracy.
    Adult literacy even in the very poorest countries of the world is still greater
    than 50%, and two-thirds of 15-24 year-olds are literate. Effectively, every community
    will have at least some literate members who can act as “infomediaries”, massively
    multiplying the accessibility of written materials, online or otherwise. And literacy
    rates among the poor are steadily rising.


    Nonetheless, interface innovation is still needed to drive access to ICT-based
    information, services and jobs. First, in the field of audio-visual interfaces.
    Second, though now covered for all the world’s major languages, there is still
    some work to be done to create interfaces for all local languages.


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE © OECD 2009'
