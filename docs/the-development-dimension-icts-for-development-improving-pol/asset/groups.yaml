    By John Houghton¹


    Developed and developing countries face many environmental challenges, including
    climate change, improving energy efficiency and waste management, addressing air
    pollution, water quality and scarcity, and loss of natural habitats and biodiversity.
    This chapter explores how the Internet and the ICT and related research communities
    can help tackle environmental challenges in developing countries through more
    environmentally sustainable models of economic development.


