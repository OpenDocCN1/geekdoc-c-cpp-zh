    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_67_0.png)


    Source: Richard Heeks.


    Of course, readiness and availability and uptake issues will remain relevant for
    at least a generation; indeed forever as new waves of technology emerge. And they
    present ongoing needs for innovation in infrastructure, hard and software. While
