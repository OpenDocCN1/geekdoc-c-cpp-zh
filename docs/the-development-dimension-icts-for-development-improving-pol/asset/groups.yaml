    amortisation (EBITDA), though there is considerable volatility.


    Table 3.1: Operator revenues, EBITDA and EBITDA margins in selected South Asian
    markets (2005)


    | Country | Revenue (USD) | EBITDA (USD) | EBITDA Margins (%) |

    |---|---|---|---|

    | Sri Lanka | 259,041,928 | 124,833,464 | 48 |

    | India | 26,723,674,194 | 9,938,340,523 | 37 |

    | (2007) | (2007) | (2007) | |

    | Bangladesh* | 655,000,000 | 344,500,000 | 54 |

    | Pakistan | 978,802,178 | n/a | n/a |


    *Data are only for the three main mobile service providers: Graphphone, Aktel
    and Banglink, whose total market share amounted to 93% in 2005.


    Sources: Sri Lanka: Company annual report, press releases by companies; Malik,
    P. (2008), Telecom Regulatory and Policy Environment in India: Results and Analysis
    of the 2008 TRE Survey; Bangladesh Telecommunications Regulatory Commission for
    Bangladesh (2007) Annual Report. Revenue and EBITDA margin for Bangladesh as reported
    by Merrill Lynch are different. Pakistan Telecommunication Authority (2005), Annual
    Report.


    Difficult policy and regulatory environments and low purchasing power of customers
    in the region appear have compelled operators to innovate, in both terms of reducing
    operating expenses to a minimum and serving the “long tail” of customers using
    only a few minutes per month. The latter innovation rests on the reduction of
    transaction costs associated with prepaid customers, an overwhelming majority
    of the SEC D and E segment represented in the Teleuse@BOP study (Figure 3.5).
    The simple fact that prepaid avoids the more or less invariably costs of generating
    and transmitting a monthly bill lowers overall transaction costs, a valuable reduction
    when revenue per customer is very low.


    ## Figure 3.5: Prepaid mobile connections at the bottom of the pyramid (% of socio-economic
    classification D and E mobile owners)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_87_0.png)


    Source: LINREasia (2009) Teleuse@BOP3. Survey findings.


    Prepaid also allows customers to pay when they can or need to use the service.
    This suits the requirements of the poor, many of whom have irregular income patterns.
    The introduction of low-value recharge cards and specially electronic reloads
    allow for the greatest payment flexibility which was of special significance in
    making the model work.


    In essence, the budget telecom business model is an innovation driven by intense
    competition and in response to the strict regulatory environments and low purchasing
    power of South Asian countries. If not for competition, this innovation would
    not have taken place. The model was borne out in Nepal, a country of 29 million
    people with many similarities to South Asian countries. Nepal had relatively high
    mobile prices in 2008, but in 2009 the prices of all mobile operators dropped
    sharply despite no licences granted. The cause was found to be – not the conventional
    type but a form of entry where certain wireless-access operators licensed as “fixed”
    entered the mobile space.


    ## Lessons for Internet


    What lessons the budget telecom network model hold for broadband? Expecting that
    conventional models of always-on broadband will connect the billions of poor people
    now is as realistic as thinking that the conventional business model of voice
    telephony would have succeeded in connecting the poor in the Indo-Gangetic Plain.
    It is imperative that operating expenses be lowered. Radical reductions in domestic
    leased lines observed in emerging economies suggest there is plenty of room for
    improvement, especially in Africa and parts of the Indian Ocean, where is highest
    distance (i.e. >500 km) for the incumbent.


