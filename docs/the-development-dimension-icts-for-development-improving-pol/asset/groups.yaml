    # Foreword


    Information and communication technologies (ICTs) are crucial in improving access
    to health and education services and creating new sources of income and employment
    for the poor. Being able to access and use ICTs has become a major factor in driving
    competitiveness, economic growth and social development. In particular, mobile
    phones are opening up new channels for connectivity and contributing to the free
    flow of ideas and opinions.


    This publication draws on discussion papers prepared for the workshop Policy Coherence
    in the Application of Information and Communication Technologies for Development,
    jointly organised by the OECD and infoDev/World Bank and held on 11-12 September
    2009 in Paris. The work was launched and co-ordinated by Raili Lahalnampi, Sam
    Paltridge and Karine Prset from the OECD and Tim Kelly from infoDev/World Bank.


    The workshop examined some of the main challenges in closing the discrepancies
    in ICTs and use of ICTs between countries. It also suggested best practices for
    more coherent and collaborative approaches in support of poverty reduction and
    meeting the Millennium Development Goals.


    Contributions are gratefully acknowledged from Tim Kelly, Lead ICT Policy Specialist,
    infoDev/World Bank; Richard Heeks, Director, Centre for Development Informatics,
    University of Manchester; Rohan Samarajiva, Chair & CEO, LRNEAsia; Victor Mulas,
    Consultant, Siddhartha Raja, Christine Zhen-Wei Qiang, Economist and Mark Williams,
    Senior Economist, all from the Global Information and Communication Technology
    Department, World Bank; Paul Makin, Principal Consultant, Consult Hyperion; John,
