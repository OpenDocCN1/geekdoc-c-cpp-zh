    ICT”产品在没有废物处理的情况下正变得越来越难以处理。


    “绿色 ICT”被定义为企业内部环境目标与效率目标之间的交集。换句话说，绿色 ICT 不关乎 ICT 部门自身的绿色，而是利用绿色倡议来提高整个行业内的目标。绿色
    ICT 的典型应用是在电力和物流管理。尽管电脑被关闭了，但局域网（LAN）很少处于活跃状态，其周末的功耗通常是工作日的 95%。计算机中心经理需要接受教育，以识别节电和节约成本的机会。


    人们热于推广 ICT 在其他行业减少排放潜力并通过跨经济应用改善环境表现时，往往忽视了解决 ICT 自身温室气体排放的紧迫需求。


    # 教育 ICT


    在学校中更广泛地使用 ICT 有助于实现与义务小学教育和消除教育性别不平等相关的发展目标。然而，人们仍存在怀疑，即相对于其他教育需求，应该优先考虑哪些 ICT。


    一直存在一种夸大 ICT 对教育益处的倾向；但实际上，证据基础仍然非常匮乏。infoDev 在 2005 年发布的教育 ICT 知识图谱相当令人担忧，它揭示了目前对直接益处的了解和可证明性是么之少。由
    infoDev 委托对非洲（2008年）和加勒比（2009年）教育 ICT 进行的区域研究结果显示，在不同地区以不同的速度日益增加的使用。


    在非洲，加纳、卢旺达和塞内加尔可能被认为是领先者，而像利比利亚或苏丹等冲突后地区则处于落后。53 个非洲国家中有 48 个已制定政策，但总体而言，公民社会和私营部门正在设定节奏。供应和
    ICT 方面缺乏执行能力以及基础设施。性别平等也缺乏。宏观趋势包括公私合作伙伴关系、数字内容开发、开源软件、区域倡议、国家研究与教育网络、国际互联和无线网络。


    相比之下，加勒比地区在理解趋势方面形成了一个更有凝聚力的地区。ICT 被视为实现变革的一种。重点是 ICT 技能的发展。当地有区域 ICT 考试，且宽带通常在没有额外费用的情况下部署到学校。


    infoDev 委托的涵盖印度和南亚的最新区域调查的初步结果在第 7 章。该地区的八个国家处于不同的发展阶段，但尽管如此，仍然可以概括教育 ICT（ICT4E）生态系统，并确定需要定义为“政策+”方法的方面。


    经合发展组织（OECD）的国际学生评估计划（PISA）发现在家使用电脑频率与学生成绩提高之间存在联系（图 1.6）。然而，要证明学校电脑使用与学生成绩提高之间存在同样的关系则更为困难。事实上，当排除学生社会经济地位的影响时，任何关系都开始消失。证据似乎是，ICT
    进一步造福那些已经表现良好的人，而不是损害那些表现不佳的人。


    学生在家里和学校的生活之间存在差距。经合组织国家平均 15 岁的青少年每天在家里面对电脑前花费约两小时，在学校使用电脑的时间每周少于一小时。问题随之产生：在教育
    ICT 上投入更多值得吗？在财务和公平方面会有回报吗？


