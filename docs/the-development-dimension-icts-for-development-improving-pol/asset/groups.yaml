    ## 6. ICTs AND THE ENVIRONMENT IN DEVELOPING COUNTRIES: OPPORTUNITIES AND DEVELOPMENTS
    – 151


    Five Year Plan (2006-11). Looking at long-term trends in employment and sectoral
    GDP shares and growth rates, Sheehan suggests that India provides an example of
    “big-push” development driven by services (Figure 6.1), and that: “industrialization
    as we used to understand is no longer a realistic option for developing countries,
    and they need to find ways of participating in the growth of the modern services
    sector, which can directly improve the living standards of their people.” It is
    notable that India’s CO2 intensity per unit of GDP is substantially lower than
    is typical of developing countries, comparable to that of Japan and lower than
    Germany’s (Ghosh 2009).


    ## Figure 6.1: Value added shares by sector, India 1950–51 to 2007–08


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_152_0.png)


    > Source: Sheehan, P.J. (2008) Beyond Industrialization: New Approaches to Development
    Strategy Based on the Services Sectors, UNU-WIDER Research Paper 2008/60: Helsinki.


    ICTs have played a key role in making services tradable and in the globalisation
    of IT and IT-enabled services. Looking at the intensity of IT and IT-enabled services
    exports, Houghton and Welsh (2009) note that computer and information services
    accounted for more than 25% of total services exports in three countries during
    2006: India, where they accounted for almost 40% (down from 50% in 2004); Ireland,
    31% (down from 39% in 2004); and Israel, 27% (Figure 6.2). Their analysis suggests
    that IT and IT-enabled services exports can play an important role in a wide range
    of developed, emerging and developing economies, and may in the latter provide
    the basis for a more environmentally sustainable development path than that has
    generalised industrialisation in the past.


    ## Figure 6.2: Share of IT services in total services exports, 2006 (%)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_153_0.png)


    Source: Houghton, J.W. and Welsh, A. (2009), Australian ICT Trade Update 2009,
    Australian Computer Society, Sydney.


    Assessing the possibility of alternative development pathways, Berkhout et al.
    (2009) argue that the convergence of economic structures and growth rates, which
    plays such a central role in growth theories, does not imply that the emergence
    of socio-technical systems underpinning growth must also be convergent in terms
    of their technological composition and environmental quality. They call for greater
    attention to the resource and environmental quality of development as the basis
    for more sustainable development pathways.


    ### ICTs and the environment


    The relationship between ICTs and the environment is complex and multifaceted,
    as ICTs can play both positive and negative roles. Positive impacts can come from
    dematerialisation and online delivery, transport and travel substitution, hasty
    of monitoring and management applications, greater energy efficiency in production
    and use, and product stewardship and recycling. Negative impacts can come from
    energy consumption and the materials used in the production and distribution of
    ICT equipment, energy consumption in direct use and cooling, short product life
    cycles and e-waste, and exploitative applications (e.g. remote sensing for unsustainable
    over-fishing (Daly 2003)).


    The impacts of ICTs on the environment can be direct (energy consumption and e-waste),
    indirect (applications such as intelligent transport systems, and smart grids)
    or third-order and rebound (those enabled by the direct or indirect use of ICTs,
    as greater use of more energy efficient transport). Exactly what the impacts of
    ICTs are, and to what extent there may rebound effects (Box 1), are widely discussed
    topics. However, it is clear that attempts to measure the impacts of ICTs on the
    environment should take account of the potential rebound effects and the entire
    life cycle rather than simply the direct impacts of the product or application
    itself (Plepsy 2002; Yi and Thomas 2007; Hilty 2008, etc.).


    Estimates of the direct impacts of ICT industries vary with the definition of
    the industry and coverage of ICT-related uses, but the production and use of ICT
    equipment is estimated to be equivalent to 1% to 3% of global CO2 emissions (including
    embedded energy) with a higher and growing share of electricity use. In 2006 it
    was estimated that ICT equipment (excluding broadcasting) contributed around 2%
    to 2.5% of worldwide greenhouse gas (GHG) emissions – of which 40% was reported
    to be due to the energy requirements of PCs and monitors, 23% to data centres,
    24% to fixed and mobile telecommunications and 6% to printers (Kumar and Mieritz
    2007). More recent life cycle assessments produce broadly results (Malmodin 2009).
    Data centres are a particular focus. Koomey (2007) estimated that worldwide electricity
    use for servers between 2000 and 2005 and suggested that consumption would increase
    by a further 40%.


    Nevertheless, many identified that ICTs can significantly reduce the environmental
    footprint (The Climate Group 2008).


