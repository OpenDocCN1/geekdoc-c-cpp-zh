    ## 98 – 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY


    The tendency was to import regulatory regimes and practices from developed market
    economies, especially ownership, market-entry and regulatory reforms created by
    pro-private sector governments in the UK and the US in the 1980s. However, scholars
    pointed out the need to align regulatory solutions with the institutional conditions
    of host countries.


    Given one of the special attributes of the state in developing countries, lack
    of capacity for effective reforms, external expertise was brought in to advise
    on transactions (where results were not too bad) and on the design of new policy
    and regulatory frameworks and instruments (where results were less satisfactory,
    tending toward the wholesale transplantation of developed economy frameworks and
    instruments). Over time and at considerable cost the frameworks and instruments
    are being adapted to local conditions, though in many cases the adaptations took
    pathological forms dissonant with some of the less unpleasant aspects of state
    formation in the developing world.


    The surprise, despite these mistakes, is that telecom infrastructure has greatly
    expanded. More than 3 billion people previously denied service by government-owned
    integrated monopolies are now connected to electronic networks, even in countries
    with no functioning regulatory agencies and the most rudimentary policy frameworks.
    Of course, there are low-mobile-penetration countries, led by North Korea and
    Burma/Myanmar, where nothing seems to have worked. Amongst this group, several
    countries such as Eritrea, Ethiopia, Papua New Guinea and Turkmenistan are now
    showing rapid growth from low bases (Table 3.4). This demonstrates that some degree
    of market entry is essential to initiate market dynamics. The uniformly lower
    growth rates on the fixed side also support the thesis that market entry to at
    least a few suppliers is a necessary condition for rapid growth.


