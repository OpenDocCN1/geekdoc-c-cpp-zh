    of more-than-voice services over the mobile. These were found to be generally
    low, especially amongst the lower SEC groups in Pakistan, India and Bangladesh
    (the Indo-Gangetic Plain constituting the hardest case). Awareness, trial and
    use were low for services such as premium SMS-based voting for “American Idol”-type
    talent shows in Southeast Asian countries and Sri Lanka (Figure 3.6 and Figure
    3.7). This was not surprising, as these services are just now offered and business
