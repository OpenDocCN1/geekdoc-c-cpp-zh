    # “实验室型”（亲贫型）创新是在贫困社区之外进行，但代表贫困群体的。远程中心（Telecentres）很大程度上就是按照这种方式设计的。对于吸引全球北方资源来解决发展中国家的问题，这是一种有效的方法。然而，它面临着“设计与现实鸿沟”的风险：即设计中建立的假设和要求与贫困社区的现实之间不匹配。


    关于各种低成本终端设备是否会掉入这个差距陷阱，目前还没有定论，早期的远程中心无疑陷入了这一点；而且当存在巨大的设计与现实鸿沟时，结果几乎注定是失败。这就是为什么报道远程中心项目普遍缺乏成功和可持续性的原因。尽管如此，在
    ICT4D 2.0 中仍然会有亲贫型创新的空间。例如，创新的亲贫型定价模型已经取得了成功。手机预付费是其在发展中国家采纳的重要部分，毫无疑问微软为发展中国家设计的
    3 美元学生创新套件也将也将证明广受欢迎。


    “协作型”（共贫型）创新是与贫困社区并肩进行的创新。它的应用正在不断增加，并将成为 ICT4D 2.0 的核心。参与式的、用户参与的设计过程是第一阶段的关键学习点。这是信息学领域在几十年前就学到的教训，但当新的应用出现时（由于新参与者的狂热般涌入），总是需要重新发明轮子。


    学得较慢——尽管 20 世纪 90 年代的发展研究中已得到承认——教训是，社区参与项目设计充满了陷阱。谁参与很重要——往往是一群极少数、声音很大的精英。他们如何参与很重要——这会产生不同的结果。他们为什么参与很重要——参与者往往给出设计者想听的答案。他们为什么不参与很重要——发展中国家群体低自我效能感可能会阻碍设计的投入。ICT4D
    参与的本质也很困难，因为它需要跨越设计者与用户之间的多重鸿沟：技术人员与非技术人员；富与穷；通常是西方思维与非西方思维。而且，对于某些项目，还有城市与农村；男性与女性。


    ## 框 2.9. ICT4D 的新型创新中介


    在 ICT 系统设计者与贫困社区的潜在用户之间可以存在各种组织安排。传统上，这些是临时的——一个在设计和初始实施期间持续的非正式小组，然后解散。


    然而，ICT4D 的增长以及贫困人口作为 ICT 系统市场的增长导致了一些更具永久性的组织形式出现：我们可以称之为 ICT4D 的“新型创新中介”。以世界
    ICT4D 枢纽之一——班加罗尔为例，我们可以引用三个可能在 ICT4D 2.0 中发挥日益重要作用的原型：


    - 直接部门。微软研究院（印度）已与一组贫困社区建立了关系，通过这些社区可以进行创新的试点。从此类试点中学习的知识随后可以回馈给微软的其他部门。


    - 间接部门。知识社会中心（Centre for Knowledge Societies）是一家代表大型私营公司工作的承包商。通过在贫困社区内结合人类学和技术研究方法，它可以向其客户报告
    ICT 设计和使用方面的问题。


    - NGO 部门。IT Change 活跃在少数几个农村社区中。它随后可以与外部机构（通常是国际开发机构）建立伙伴关系，就设计的良好实践提供指导。


    还应该提到关注技术的 Practical Action 的工作。它从一个基于英国的亲贫创新模型开始，在 20 世纪 80 年代和 90 年代转向协作亲贫模型。它现在已开始（例如通过
    PROLINNOVA 程序）捕捉和传播当地创新者的发明。这还未属于 ICT 领域，但它为中介组织在基层亲贫创新中可以扮演的角色提供了一个模型。


    “基层型”（普贫型）创新是由贫困社区内部并由其成员进行的创新。在 20 世纪 90 年代，这几乎是不可能的——贫困用户与新技术之间缺乏足够的接触；广播和电视等旧信息技术没有提供创新的空间。但这种情况在过去几年里发生了变化。随着手机的到来，以及
    PC 和 Web 的进入，贫困人口自己变成了创新者。这不是指传统意义上的实验室/研发，而是以新方式适应和应用技术。


    大而言之，目前我们只有以下方面的轶事：


    - *新流程*：例如移动货币允许在没有银行账户的情况下进行交易。

    - *新业务模式*：例如将通话时长作为货币，允许微支付。

    - *新产品*：例如为恶劣环境设计的低成本智能手机。


    此类轶事的分量在增加；ICT4D 2.0 将面临压力，需要更系统的方法来获取基层创新。这在南方国家已有很好的实践。这种运动已经通过增加开源和 Web 2.0
    模型的功能不断演变。


    ## 2. ICT 和国际发展的下一步在何？


    ### 框 2.10. Jugaad——贫困是发明的方法


    除了问做什么以及如何创新之外，我们还可以问：“为什么要创新？”对于在贫困社区内部及其工作的人来说，答案是：因为你必须这样做。来自“外部世界”的技术无法运行、无法正常工作且会损坏。北印概念
    *jugaad* 指的是在贫困环境中为了让技术运行或保持运行而进行的快速修复。尽管补救措施可能是局部的，但我们可以在全球的贫困社区看到 *jugaad*：在限制性环境中进行的微小创新。这可以更进一步，接受这样一种观察：资源贫困可能是创新的催化剂。


    因此，我们得到了 ICT4D 2.0 的概念：约束驱动创新——即普拉拉德（Prahlad）描述的在约束墙的沙盒内进行创新，交付了“主流”创新无法提供的匹配可用资源的专业解决方案。它们价格更低、资本密集度低、技能密集度低、更多利用当地材料，并能适应不稳定供应。总之，它们缩小了其他创新所面临的“设计与现实鸿沟”，并证明了贫困可以驱动创新。


    ## ICT4D 2.0 的新型实施模型


    之前的章节主要关注 ICT4D 2.0 的技术：主要平台、应用程序以及这些创新的方式。我们现在观察这些新技术如何投入行动，关注 ICT4D 实施的各个方面。


