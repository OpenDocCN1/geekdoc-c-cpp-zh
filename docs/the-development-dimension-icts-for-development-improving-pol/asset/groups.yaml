    penetration levels despite very low population density. The problem of providing
    service in rural and remote Canada was studied by the Independent Telecommunications
    Review Panel, which in an annex to their 2006 report, argued that the government
    should set a goal of providing affordable and reliable broadband services in all
    regions of the country by 2010. The panel mapped the availability of broadband
    and estimated that just under 90% of Canadians could access it by 2007, leaving
    around 3 million people without it. For the approximately 300,000 of those living
    in the most remote communities, satellite would be the most practical solution.
    Areas with fewer than 1200 people within a 5km radius from a broadband point of
    presence were found to be unconomic to serve; this was further aided by terrain.
    WiMAX could reduce the number that could not be served economically by 1.2 million,
    but for the remaining 1.5 million (plus the 300 000 to be served only by satellite)
    some form of targeted cost-subsidy would be necessary to achieve the goal of universal
    broadband service by 2010.


    One of the most high-profile initiatives is a scheme to provide broadband to Canadians
    in the far North, in Nunavut and Northern Territories. The Nunavut Broadband Development
    Corporation has been established as a not-for-profit, federally registered corporation
    with multi-stakeholder membership whose goal is to bring broadband to 25 underserved
    communities. Under a five-year plan signed in January 2009 (as part of Canada’s
    economic stimulus programme), matching funds from Infrastructure Canada and local
