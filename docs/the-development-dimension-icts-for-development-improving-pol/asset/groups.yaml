    development studies. And it can stop thinking solely about ‘needs’ – often defined
    from outside poor communities in rather paternalistic terms. Instead, it can also
    think about “wants” – what is it that the poor themselves actually demand? How
    do and would poor communities use digital technologies if left to their own devices?


    In conclusion and above above all, we can see that ICT4D 2.0 is about reframing
    the poor. Where ICT4D 1.0 marginalised them, allowing a supply-driven focus, ICT4D
    2.0 centralises them, creating a demand-driven focus. Where ICT4D 1.0 – fortified
    by the bottom of the pyramid concept – characterised largely as passive consumers,
    ICT4D 2.0 sees the poor as active producers and active innovators.


