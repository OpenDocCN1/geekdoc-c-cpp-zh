    ## 框 2.12 教学 ICT4D 2.0


    目前，已有少数但数量不断增长的正式培训课程涉及 ICT4D（信息通信技术促进发展）。


    曼彻斯特大学的一期发展信息化硕士（MSc in ICT for Development）明确将图 2.5 作为其培训基础的基础。经验表明，许多参与者已经拥有良好的计算机科学技能基础，因此这些内容仅作为选项提供。


    核心课程的重点集中在以下三个领域：


    - 发展概念：理解发展过程和结构的基础性知识框架。

    - 发展项目实践：与发展背景下的项目管理相关的知识和技能。

    - 信息系统：理解信息和信息系统，以及其在发展背景下的构建与实施的知识与技能。


    该课程还通过一个关于 ICT 与社会经济发展的顶石元素，以及一系列对发展中国家 ICT4D 项目的实地访问，将不同领域联系起来。在教学这一元素时，以及其他
    ICT4D 课程通常围绕实现类似千年发展目标（MDG）的能力（并加入了经济增长等问题）来构建。对于 ICT4D 2.0 来说的一个问题是，这种“整合方法”（图
    2.6）是否是最合适的，或者是否存在一个更具变革性的“发展 2.0”课程空间。


    从战略上讲，这意味着我们还需要在传统的 ICT4D 政策和计划制定中开发“混合模式”。我们可以通过追溯关于 ICT 和发展的观点的年代史来描绘这一需求，如图
    2.6 所示。


    我们可以利用这一点来重新解读（重新解读）我们早期的技术与发展年代史。直到 20 世纪 90 年代——我们称为 ICT4D 0.0——大多数发展计划和政策制定者倾向于要么忽视
    ICT（因为当时完全如此），要么将其从发展的主流中孤立出来，放到单独的政策和部门中。如果技术整体在主导思维的发展研究范式中被视为积极的，那么 IT 则被贬放到更边缘的角色，甚至被视为负面的（例如，20
    世纪 80 年代印度出现的“要工作，不要计算机”的涂鸦）。


    ## 图 2.6：关于 ICT 与发展的战略性观点的演变


    ICT 对发展的感官贡献


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_62_0.png)


    来源：Richard Heeks。


    如所示，这种观点在 20 世纪 90 年代的少数发展官员中继续存在，作为更广泛的科学技术边缘化的一部分。但与此同时，在一种最初很少触及发展研究的基于技术和计算机科学的范式驱动下，ICT4D
    运动诞生了。这种运动崇拜数字技术并将其置于发展过程的核心。世界的主要问题被视为数字鸿沟：缺乏对 ICT 的获取。


    ICT4D 1.0 未能达到其炒作这一点已有记载。这一阶段的后半部分出现了一种可以认为是发展研究观点优越地位的重新主张，这些观点认为他们看到的计算机科学概念是过度狭隘的。因此，ICT
    在发展领域内变得“主流化”，意味着它从属于发展目标的实现，被整合到长系列可能被证明有用的工具和技术列表中。典型的表述是从一个发展目标开始，然后寻求理解信息通信在实现该目标中的作用，然后询问哪些新技术（如果有）可以帮助实现这一作用。


    在许多方面，这种整合方法看起来非常合理；它是许多机构——世界银行、加拿大国际发展研究中心、英国国际发展部——正在遵循的方法。它代表了我们 ICT4D 2.0
    的起点，并隐藏在


    ## 62 – 2 ICT 和国际发展的下一步在何方？


    人们在谈到 ICT4D 时经常听到诸如“手段而非目的”或“工具而非目标”等格言。


    ## 框 2.13 ICT 政策：超越菜单


    在在 ICT4D 1.0 期间，关于 ICT 政策的大量研究和建议似乎更多地关注内容而非过程和结构。如果用餐饮来类比，那就是对“政策菜单”的关注过度；而对烹饪和餐厅的关注不足。继续这个类比，可以从米其林星餐厅拿一份菜单交给麦当劳的经理。


