    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 39


    # Box 2.2. ICT4D impact assessment and evaluation


    Impact assessment and evaluation have always been seen as the neglected children
    of the development family. We fear looking back at the current project lest, like
    Lot''s wife, we should be turned into pillars of salt. Hasten on the next project.
    Part of the problem is motivation, which is hard to alter, but part of the problem
    in ICT4D has been lack of guidance. Initiatives such as the Compendium on Impact
    Assessment of ICT-for-Development Projects, and the Global Impact Study will help
    provide guidance for ICT4D 2.0.


    # New hardware


    As we stand on the threshold of ICT4D 2.0, a key question to be answered is how
    will we deliver the Internet to the remaining 5 billion?


    Back in the 1990s, the initial model was serving the global North: a PC connected
    via a landline. But attempted roll-out faced major hurdles as the South''s bottom
    of the pyramid proved harder to reach. The model was too costly to be sustainable
    or scalable, and/or the necessary power and telecommunications foundations were
    often absent. Pushing forward, the Internet-connected PC will require hardware
    innovations in:


    +   Terminals: there are ongoing efforts to develop the type of low-spec, low-cost,
    robust terminal devices that could work in large numbers of poor communities.
    The most high-profile of these is the One per Laptop (OLPC) project''s XO. Not
    coincidentally, a slew of relatively similar devices is forth. Some – like the
    PixelQi and the Intel Classmate – have a similar intention to target developing
    countries. Others – Linutop, InkMedia, Elonex ONE, Asee Eee and many more – are
    more generalised commercial products. Despite twenty years of overpromising and
    underdelivering from the ‘People’s PC’ to the Simputer – it appears that low-cost
    terminals will be a central part of ICT4D 2.0.


    +   Telecommunications: wireless has the delivery method of choice to provide
    connectivity into poor communities in the global South. Interest in satellite-based
    forms such as VSAT during the 1980s and 1990s has given way to a focus on land-based
    transmission systems. In the same way, attention is turning from WiFi-based systems
    and innovation to WiMAX. The overriding innovation remains the relatively low
    traffic demand and population density of rural poverty, requiring solutions that
    can deliver broader at lower cost than current technology.'
