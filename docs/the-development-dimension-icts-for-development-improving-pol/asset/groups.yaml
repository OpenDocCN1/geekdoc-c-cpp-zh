    # 图 4.2：宽带的良性循环：连接各个要素


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_123_0.png)


    来源：世界银行（即将出版）《发展中国家的宽带政策制定》。


    所谓具有动态和协作性质的 Web 2.0 服务和应用的增长，取决于用户相互互动的能力，同时也对网络发展具有影响。例如，以前网络提供的更新速度低于下载速度，因为这反映了电子邮件和网页浏览等应用的典型使用情况。然而，如今的双向多媒体服务用户要求两个方向都具有高速度。尽管人们担心大量由于带宽密集型服务会淹没互联网，但这些预测仅在个别事件中发生。全球互联网在扩展到更多用户、更具要求的应用程序和更高速度方面表现出异常的稳健性。


    因此，网络是一个不断演变的生态系统的一部分，该系统包含了具有更高要求的用户和应用程序。同时，用户创建和共享需要更多带宽的内容和应用应该推动宽带供应，形成一个良性循环。因此，在本文中，“宽带生态系统”被定义为一个由互联的高容量通信网络、带宽密集型服务与应用以及用户组成的多层系统。


    # 政府的角色


    将宽带定义为生态系统而非仅仅是网络


    # 4. 政府在宽带发展中应该扮演什么角色？ – 123


    有助于评估政府在利用宽带作为信息通信技术促进发展（ICT4D）的工具时，可能需要扮演的角色。传统上，政府扮演着“推动”角色，为 ICT 基础设施的提供和国内
    ICT 部门的发展提供良好环境。这可以通过“政策 1.0”（图 4.3）来实现。政府日益需要需要转向“拉动”策略，旨在提高数字素养、建立环境、提供包括本地内容在内的服务。这可以通过“政策
    2.0”来实现，对应于 Web 2.0 或移动 2.0 等流行概念。


    # 图 4.3：政府应对发展性 ICT 的方法的演变


    | 策略 | ICT4D | 方法 |

    | --- | --- | --- |

    | 推动 (Push) | 基础设施 | |

    | | ICT 部门 | 1.0 |

    | | （数字）素养 | |

    | 拉动 (Pull) | 赋能环境 | 应用程序（内容和服务） | 2.0 |


    来源：改编自 Peña-López, Ismael (2009),《政策决策的数字发展衡量：模型、阶段、特征和原因》，未出版博士论文，UOC，巴塞罗那。


    政府对于是否建立国家宽带战略采取了非常不同的观点。通常，具有一致国家战略的国家在促进宽带普及方面往往更成功。领先宽带渗透率的大多数 OECD 国家（包括丹麦、荷兰、挪威、韩国、瑞典和芬兰）都有此类战略。但即使是最初抵抗定义中央政府角色的预市场市场体现在也跨越了这一界限。例如，英国政府2009
    年的《数字英国》报告包含了一项激进的建议，计划对每条固定电话订阅收取 6 英镑（约 10 美元）的费用，以为全国的高速宽带服务筹资金。


    # 124 — 4. 政府在宽带发展中应该扮演什么角色？


    同样，在美国，在经历了十年的辩论后（在此期间，美国在 OECD 宽带排名中从第二名跌至第十五名），新政府宣布制定《国家宽带计划》，并由监管机构联邦通信委员会（FCC）主持了一系列讨论启动。


    政府在提供宽带方面应该扮演什么角色？基本原则是，政府应仅根据健全的经济原则进行干预，并且在此类干预的收益大于成本的情况下。公共部门本质上有两个不同的角色：让市场运行更高效，以及确保所有人都能公平获取。


    # 让市场运行更高效


    到 2008 年，宽带服务已在 182 个经济体中可用（图 4.4），到 2009 年初，固定和移动网络全球宽带用户总数超过了 10 亿。由于这些连接大部分由私营公司提供，可以假设宽带市场运行得相当有效，没有市场失灵。


    > 图 4.4：拥有商业可用宽带的经济体数量，2002-2008


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_125_0.png)


    注：宽带定义为速度等于或超过 256 kbit/s。

    来源：国际电信联盟（ITU）。


    # 4. 政府在宽带发展中应该扮演什么角色？ – 125


    然而，宽带存在市场失灵。与许多其他市场一样，它们涉及公共基础设施的提供。宽带市场本身的结构有时给服务的发展带来问题。市场失灵最常见的形式是在即使不存在法律垄断的情况下，宽带基础设施提供中仍然存在垄断结构。在许多国家，现有公共电信运营商的主地位是发展有效竞争的主要障碍之一。其他市场失灵可能与缺乏规模效应有关。获取运营法律许可的困难、无线频谱分配效率低下、糟糕的信息市场和有限的资本市场都是市场失灵的进一步例子。


    ICT 部门的市场失灵已得到全球政府的广泛认可。通常通过监管政策来解决：许可自由化、促进无线频谱接入以及监管主要运营商都是为快速扩张提供基础政策。在欧洲和一些发展中国家，宽带政策侧重于提供低成本的接入。


    在法国，可以从宽带市场的演变中看到“投资阶梯”方法。在最低的“阶梯”上是容量的转售，只需在一个点进行连接。后来，在地区层面提供了比特流接入，准入者在多个点进行连接并构建了骨干网络。随着本地回路完全开放，像
    Iliad（free.fr）这样的全服务运营商进一步产生了对法国电信（图 4.5）的直接竞争。


