    # 7. 教育领域 ICT 的政策连贯性：南亚案例 – 197


    孟加拉国教育信息与统计局（BANBEIS）负责各层次、各类型教育信息及统计数据的收集、编制和传播。该机构是教育部的主要机构，负责教育数据和统计的收集与发布，并作为其教育管理信息系统（EMIS）。它还是南亚与中亚地区信息信息化（RINSACA）的国家协调员。


    不不丹和马尔代夫都没有针对在学校管理中使用 ICT 的明确政策阐述。


    ## 监控与评估


    对 ICT 倡议的监控与评估应纳入任何将 ICT 整合到教育的战略中。


    印度的政策草案预计，将利用内置在 SEMIS 中的监控工具以及地区教育信息系统（DISE）数据等信息，监测各项倡议和计划的进展。州政府将设计自己的监控机制，并对地方、地区和州各级进行映射，以接入国家网络管理信息系统（MIS），推动学校
    ICT 的发展并提供中期调整建议。建议进行独立的第三方评估，各州将委派自己的机构来评估 ICT 项目、基础设施、数字资源、能力建设和整体项目管理等各项参数。


    如前所述，巴基斯坦的国家战略（NI）预计建立一个教育 ICT 技术实施部门（TIU）。该机构将担任教育部的咨询角色，提高国家、省、地区和学校级政策制定者、规划者及管理员的技术、规划、监控和评估能力。TIU
    还与教师培训机构联系，监督国家战略的实施并通过国家 EMIS 对教育进行整体监控。


    在大多数其他关注国家，尚未针对教育 ICT 倡议制定明确的监控与评估战略。


    用于发展的 ICT：提高政策连贯性 © OECD 2009


    198 – 7. 教育领域 ICT 的政策连贯性：南亚案例


    ### 框 7.4. 监控与评估：总结


    - 大多数国家（印度和巴基斯坦除外）对监控评估策略的阐述较为模糊。

    - 现有的监控评估策略大多侧重于项目评估和 EMIS 类工具，而非基于学习水平的评估（印度、巴基斯坦、尼泊尔）。


    制定监控与评估策略的关键限制：


    - 缺乏评估教育领域 ICT 倡议影响的标准。

    - 制度结构薄弱，责任碎片化。


    ## 政策+（Plus）


    政策连贯性不仅意味着阐述整合良好的战略。还需要采取若干措施来确保政策的有效性。其中包括：


    **详细的实施计划。** 虽然几乎所有关注国家的政策都强调了将 ICT 整合到教育的需求，但明确的实施计划寥寥无几。印度和巴基斯坦政策文件中简要说明了实施策略。在斯里兰卡，NAPITSE
    应通过“学校教育信息技术国家政策行动计划、运营策略”实施，但关于其实施成功的信息非常少。


    **资金分配。** 资金分配应支持政府做出的明确政策声明。应当探索从包括政府、私营部门和公私合作伙伴关系在内的不同来源获取资金。几乎所有关注国家的政策声明都缺乏针对特定倡议的详细资金分配或资金框架（不丹的
    BIPS 除外）。


    **制度能力与政治行政意愿。** 这是南亚地区最关键的限制，该地区缺乏足够的制度和行政能力将纸面上的良好政策转化为具体的实际倡议。例如，在孟加拉国2002年国家
    ICT 政策的16个领域103项政策指令中，只有八项在2008年完全或大部分完成。


    社区对 ICT 的需求。通用的 ICT 意识和社区参与被视为将 ICT 有效整合到教育中的关键。随着更广泛社区对 ICT 服务的强劲需求，学校环境对技术有了更好的采用和利用。南亚国家中极少数政策文件承认了这种关键联系（不不丹
    BIPS 和孟加拉国2009年国家 ICT 政策除外）。


    ## 主要发现


    - 南亚地区对教育 ICT 政策的迫切需求很大程度上源于需要开发充足人力资源，以便在全球 ICT 市场中具有竞争力（孟加拉国、尼泊尔、斯里兰卡、巴基斯坦）。


    - 与将 ICT 作为教学辅助以提高整体教育质量相比，更关注将 ICT 作为一门学科纳入课程。


    - 只有斯里兰卡、巴基斯坦和印度拥有特定的教育 ICT 政策。这些政策关注 ICT 作为一门学科以及其作为教学工具的使用。其中，斯里兰卡的 NAPITSE
    自2000年以来一直在运行，巴基斯坦的 NICT 自2005年开始运行，而印度的《学校教育 ICT 国家政策草案》仍在制定中，第一稿已于2009年发布。


    - 孟加拉国、不丹、尼泊尔和富汗的 ICT 政策包含了教育章节，强调了对素质人才的需求以及通过教育系统让大众熟悉 ICT。


    - 马尔代夫尚未制定 ICT 政策，但凭借基础 ICT 基础设施（相对较高的互联网普及率、移动网络、电视和广播普及率）和良好的教育指标（识字率接近100%，小学及中学的入学率较高），具备受益条件。


    7. 教育领域 ICT 的政策连贯性：南亚案例 – 199


