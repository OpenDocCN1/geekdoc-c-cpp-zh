    ## 开发中国家案例研究


    发展中国家的宽带发展策略比发达国家要少，因为国家之间在宽带发展仍然存在巨大的数字鸿沟。事实上，由于大多数发展中国家的移动通信已远领先固定线路通信，宽带可能会在无线平台而非固定线路平台上发展。埃及就是一个例子。截至2009年中，埃及的4940万移动用户数量超过了其1160万固定线路用户的四倍以上。固定线路用户数在2009年上半年开始下降。此外，固定线路市场在很大程度上仍由国家拥有的现任运营商——埃及电信（Telecom
    Egypt）垄断；移动市场竞争激烈，第三家进入者Etisalat Mis于2006年获得许可。所有三家运营商都拥有3G网络，允许他们提供移动宽带服务。国家监管机构NTRA估计，截至2008年，只有一半的埃及互联网用户接入了宽带，但总ADSL用户不足100万。


