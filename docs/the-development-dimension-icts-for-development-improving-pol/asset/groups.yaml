    # 64 - 2. ICT 与国际发展的下一步在何方？


    ## 框 2.14. ICT4D 2.0 的研究重点（续）


    - 新型实施模式：更多关于 ICT4D 资金筹助、组织和管理新方法的研究。

    - 新观点：更多关于在发展研究与计算机科学/信息系统交叉领域之间建立智力联系的研究；更多关于 ICT4D “超越主流化”（beyond mainstreaming）的研究。


    它将包含来自其他教科书的特定元素，例如：


    - 城市发展：研究发展中国家城市中 ICT 的使用。

    - 气候变化：研究 ICT 如何能够减少、宣传、缓解并帮助应对发展中国家气候变化带来的后果。

    - 超越菜单：研究 ICT4D 政策是如何制定和实施的，而不仅仅是政策内容的进行简单改革。


    最后，我们可以识别出一些通用的研究重点：³


    - 定义发展：研究 ICT 能够促进什么样的发展愿景；仅仅是千年发展目标（MDGs）还是远于此？以及 ICT 如何重新定义发展——是否正在出现一种“发展 2.0”？

    - 抽后观察：更多以各种方式“抽后”的研究；在时间上，采用纵向研究方法；在参与上，对项目采取更独立、更少自身利益倾向的观点；在关注点上，采取更具政治性和批判性的研究视角，界定
    ICT4D 议程并明确服务于谁的利益。

    - 评估：（如图 2.7 所示）从研究 ICT4D 的准备情况和可用性转向研究采纳率和特别是影响。严谨的影响评估是 ICT4D 的“麦考维”（Macavity）——谈论很多，但极少见到。


    # 结论


    我们并没有一个明确的分界线来可以说：“ICT4D 1.0 在此停止；ICT4D 2.0 从此开始”。在基层，这是一种演化的感觉，而非断层。然而……一些混乱、模糊但新颖的东西正在出现。如果我们给它贴上这个标签并进行总结（如表
    2.1 所示），是有意义的。


    发展促进信息化：提高政策一致性 © OECD 2009


    # 2. ICT 与国际发展的下一步在何方？ – 65


    ## 表 2.1: ICT4D 阶段总结


    | 问题 / 阶段 | ICT4D 0.0 | ICT4D 1.0 | ICT4D 2.0 |

    |---|---|---|---|

    | | (1960年代 – 1990年代中期) | (1990年代中期 – 2000年代中期) | (2000年代中期/后期及以后) |

    | 标标性技术 | PC 数据库 | 远程中心 (Telecentre) | 手机 |

    | 关键应用 | 数据处理 | 内容（交互） | 服务与生产 |

    | 贫民 | | 消费者 | 创新者与生产者 |

    | 关键目标 | 组织效率 | 千年发展目标 (MDGs) | ?增长与发展？ |

    | 关键问题 | 技术潜力 | 准备情况与可用性 | 采纳率与影响 |

    | 关键参与者 | 政府 | 捐助者与非政府组织 (NGOs) | 所有部门 |

    | 态度 | 忽略 -> 隔离 | 崇拜 -> 整合 | 整合 -> 创新 |

    | 创新模式 | 北方 | 亲贫 -> 贫困 | 类贫 -> 针对贫困 |

    | 主导学科 | 信息系统 | 信息学 / 发展研究 | 计算机科学、信息系统与发展的交叉学科 |

    | 发展范式 | 现代化 | 人类发展 | ?发展 2.0？ |


    我们可能会认为 ICT4D 1.0 和 2.0 之间的关键区别是什么？在回答这个问题时，我们可以与 Web 2.0 的概念进行类比。例如，ICT4D 2.0
    关于世界的“长尾”——利用数字技术来挖掘那些掌握世界 20% 资源的 80% 人的能力。或者，用里克·施密特（Eric Schmidt）的“不要对抗互联网”描述，我们可以看到
    ICT4D 2.0 的口号是“不要对抗贫民”。1.0 强加了预先的设计并要求贫民适应，而 2.0 则围绕贫民特定的资源、能力和需求进行设计。或者，我们可以转化“网络即平台”来论证：ICT4D
    1.0 将 ICT 作为发展的工具，而第二阶段将 ICT 作为发展的平台。


    另一种，我们可以将 ICT4D 问题拆解为时间顺序，如图 2.7 所示：


    - * 准备工作 Readiness：我们是否有政策和基础设施来使 ICT 的可用成为可能？

    - - 可用性 Availability：我们如何向贫民推广 ICT 以帮助他们成为用户？

    - 采纳率 Uptake：我们能以什么方式实施和应用 ICT 使其有用？

    - 影响 Impact：我们如何利用 ICT 产生最大的发展影响？


    # 图 2.7: 随时间变化的 ICT4D 问题


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_67_0.png)


    来源：Richard Heeks。


    当然，准备工作、可用性和采纳问题在至少一个代人内将继续保持相关性；事实上，随着新技术浪潮的出现，它们将永远存在。它们对基础设施、硬件软件的创新提出了持续的需求。虽然手机已经成为现实，且连接互联网的
    PC 是日益增长的可能性，特别是对于城市和城市边缘贫民而言。在 ICT4D 1.0 关乎打好基础，且作为概念证明（如试点）在很大程度上基于供应的采纳时，ICT4D
    2.0 可以将其部分注意力转向其他地方。


    它可以不再仅仅思考试点，而是更多地思考可持续性、可扩展性和影响。它可以停止从单一学科的角度思考，转而更多地从计算机科学、信息系统和发展的交叉学科视角思考。


    发展促进信息化：提高政策一致性 OECD 2009


    它可以不再仅仅考虑“需求”（needs），而是更多地考虑“愿望”（wants）——由外部家长式的术语定义。相反，它还可以考虑贫民自己想要什么？贫民如何使用数字技术？


    综上，我们可以看到 ICT4D 2.0 是关于重塑贫民。ICT4D 1.0 将他们边缘化，基于供应驱动的视角；ICT4D 2.0 将他们中心化，基于需求驱动的视角。贫民可以产生数字内容和收入吗？


    这一阶段提出的三个总结性问题是：


