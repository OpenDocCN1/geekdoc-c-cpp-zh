    terrain and nascent ICT and telecom sectors, Nepal has low ICT penetration compared
    to the rest of the region.


    Afghanistan also has low ICT penetration, for various geographical and political
    reasons. By 2014-15 the Ministry of Education aims to develop 100% ICT infrastructure
    in the centre and throughout the provincial educational directorates and 50% coverage
    of district education units and educational institutes around the country. A phased
    plan for development of ICT infrastructure has been articulated, starting at the
    national level with the Ministry of Education and eventually trickling down to
    district education units and education institutes.


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_196_0.png)


    # ICT for education management


    Use of ICTs in planning for better service delivery in the field of education
    is a significant aspect. School administrative processes, communication between
    schools and management of education systems by respective departments can be greatly
    facilitated by School Education Management Information Systems (SEMIS). Standard
    procedures such as admissions, transfer and posting of teachers, salary payments
    and attendance can be greatly simplified using ICT applications. GIS applications
    for school planning are also being used along with student tracking initiatives.'
  - '[PAGE 197]


    # 196 – 7. POLICY COHERENCE IN ICTs FOR EDUCATION: EXAMPLES FROM SOUTH ASIA


    India the Draft National Policy on ICT in Education envisages the use of ICTs
    in school management at all levels. Starting with introduction of local school-wide
    networks to enable automation of various administrative process from student/teacher
    tracking to records maintenance and resource planning, leading to a school management
    information system which then feed into the proposed state-wide web-based SEMIS.
    At the state level, states will adopt an e-governance and automated school administration
    programme, build capacities for its implementation and deploy school-based Management
    Information Systems (MIS). This MIS will be integrated into the proposed national-level
    web-based SEMIS.


    The National Education Strategic Plan (NESP) envisages an ICT strategic plan as
    part of developing the overall capacity of the Ministry of Education. An Education
    Management System (EMS) is being developed with assistance from donors. Lack of
    information and reliable data is a major impediment to improving the planning
    and management capacity of the education system. The Ministry also envisages that
    all management and administration service employees should have the opportunity
    to be “digitally literate” by the end of the planning cycle. Afghanistan also
    has GIS-based data to enable school planning.


    The need for proper planning, management, support and monitoring and evaluation
    of ICT initiatives by organising efforts to ensure capacity building at the federal
    and provincial levels and creating an external body which advises the Ministry
    of Education on ICTs for education. Specifically, the NICT suggests establishing
    a Technical Implementation Unit (TIU) for ICTs for education which will develop
    the technical planning, monitoring and evaluation capacity of policy-makers, planners
    and administrators at national, provincial, district and school levels. It will
    also liaise with teacher training institutes, oversee the implementation of the
    NICT Strategy and support the overall monitoring of education through the national
    EMIS.


    Sri Lanka NAPTISE, with a focus on the use of ICTs for education, also highlights
    the need to use ICTs in management of the education system. The policy outlines
    the need to design, develop and maintain a web site for the Ministry of Education
    and Higher Education to assist the school system in e-learning and information
    management. It also mentions training education department officials to make better
    use of ICTs in their day-to-day work.


    In Nepal an EMIS has been evolving and is used to derive Flash Reports which chart
    progress against agreed educational indicators for the Education All programme.'
