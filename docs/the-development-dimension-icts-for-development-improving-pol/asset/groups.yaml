    # 2. ICT与国际发展的下一步将走向何方？ – 35


    政府曾是关键执行者，而 IT（当时的称呼，而非 ICT）主要应用于发展中国家公共部门的国际行政职能。在20世纪80年代，跨国公司和其他企业开始凸显，而 IT
    —— 以微型电脑及其相关软件的出现为代表 —— 被视为私营部门经济增长的工具。我们可以将“ICT4D 0.0”时期命名为 IT4G —— 即为了增长的信息技术，随后它被为了全球发展的信息技术所取代。


    在20世纪90年代发生了两件事，催生了可以被公认地称为 ICT4D 1.0 的产物。第一是互联网的普及。第二是《千年发展目标》（MDGs）。


    互联网引发了人们对 ICT 兴趣的高涨，包括对其在发展中国家如何应用的兴趣再次点燃。与此同时，国际发展开始进入政治议程。这一趋势受到对具体目标的追求推动，这些目标最初在1996年作为“国际发展目标”出现，随后在2000年9月的《千年宣言》中正式确立为《千年发展目标》，该目标特别寻求减少贫困以及改善健康和教育公平。


    2090年代的数字技术是寻找用途的新工具。而发展目标是寻找交付机制的新目标。这两者的相遇并非出乎意料。它们共同产生了“ICT4D”，它诞生于一系列出版物、机构、活动、计划和项目资助的浪潮中：世界银行1998年的《世界发展报告》强调了信息、知识和
    ICT 在发展中的作用；G8 国家于2000年创建了“数字机遇任务组”，为 ICT4D 的行动制定了议程；以及分别于2003年在日内瓦、2005年在突尼斯举行的“信息社会世界峰会”，这些成为
    ICT4D 路径上的关键学习和政策制定点。


    关键执行者变成了国际发展组织和非政府组织（NGO），ICT 的首要应用是实现《千年发展目标》。核心在于，《千年发展目标》旨在改善普拉哈拉德（Prahalad）所说的“金字塔底端”的人的生活：即地球上每天生活收入低于2美元的30亿人。


    # 2. ICT与国际发展的下一步将走向何方？ – 36


    ## 框 2.1. 应对贫困需求


    发展行动可以通过三种方式应对贫困人的需求：


    - 包容性（Inclusive）：改善涵盖所有人（包括贫困人）的机会和；；

    - 赋能性（Enabling）：支持能够改善贫困人生活的政策或环境；

    - 针对性（Focused）：专门针对贫困人的权利、利益和需求。


    ICT4D 的初始阶段包含了所有这些方面。例如，存在包容性的电子政府计划，旨在通过互联网增加公共服务的交付。在 ICT 治理方面也有赋能行动，寻求确保贫困国家的利益被纳入控制互联网、电信流量及关税的全球体系中。但大多数精力被预留给了针对性项目：即那些将
    ICT 引入贫困社区，并寻求提供可能解决贫困、健康、教育和性别平等信息与服务的项目 —— 这四个领域构成了《千年发展目标》的主要内容。这种结合了包容性、赋能性和针对性的方法可能会在
    ICT4D 2.0 时代继续存在。尽管如此，我们可能会看到一些重新平衡，即对治理在塑造 ICT4D 成果方面的重要性给予更多认可。


    ## ICT4D 1.0 期间发生了什么？


    由于时间跨度短且面临展示切实成果的压力，参与 ICT4D 的发展执行者采取了在这种情况下每个人都会采取的做法。他们寻找一种快速、现成的解决方案，以便在发展中国家的贫困社区中进行复制。


    鉴于大多数贫困集中在农村地区，落入每个人怀中的模型是“农村远程咖啡馆”（telecottage）或“远程服务中心”（telecentre），这种模式在20世纪80年代和90年代初已在欧洲和北美的边缘地区推广。它看起来像是一个拥有一个或多个连接互联网电脑的房间或建筑，可以相当快地安装，提供成就的实物证明，并向贫困社区提供信息、通信和服务（同时也为作为大多数
    ICT4D 论坛合作伙伴的 ICT 公司提供销售额支持）。因此，一系列命名形象五目的的项目开始开展开来，从哥伦比亚的 InForCauca 到马里的 CLICS，再到印度的
    Gyandoot。


    用于发展的 ICT：提高政策协调性 © OECD 2009


    # 2. ICT与国际发展的下一步将走向何方？ – 37


    自然，ICT4D 1.0 并不局限于远程服务中心项目。但远程服务中心是这一时期的原型，从从20世纪90年代中后期一直持续到2000年代中后期。


    结果是什么？粗略地来说，我们可以用三个词来总结：失败、限制和轶事。这每一项都导致了具体的教训和新的格言：


    - 可持续性（Sustainability）：鉴于许多 ICT4D 项目未能交付和/或存活，现在更加强调确保此类项目的长期生命力。

    - 可扩展性（Scalability）：鉴于单个远程服务中心项目的覆盖范围有限，人们正在寻找可扩展的 ICT4D 解决方案。

    - 评估性（Evaluation）：鉴于 ICT4D 1.0 往往依靠炒作和未经证实的、出于私利的故事来维持，人们对影响的客观评估有了新的关注。


    更广泛地说，ICT4D 第一个十年的这些结果导致了对新方法的需求。对于 ICT4D 2.0 应该什么样，尚未达成共识。讨论正在进行。


    让我们看看 ICT4D 的技术和过程。当我们站在 ICT4D 2.0 的门槛上时，一个需要解决的问题是，我们将如何为剩下的50亿人提供互联网？


    在20世纪90年代，最初的模型是为全球北方服务：通过电话线连接的电脑。但尝试的推广面临了巨大障碍，因为南方金字塔底端被证明难以触及。该模型过于昂贵，无法实现可持续性或扩展性，且/或缺乏必要的电力和电信基础设施。向前发展，连接互联网的电脑需要在硬件方面进行创新：


    - 终端（Terminals）：人们正努力开发低规格、低成本、耐用的终端设备，使其能够在大量社区中运行。其中知名度最高的是每人一电脑（OLPC）项目的 XO。巧合的是，出现了一系列类似的设备。像
    PixelQi 和 Intel Classmate 等设备目标是发展中国家。而其他的如 Linutop、InkMedia、Elonex ONE、Asee Eee
    等则是更通用的商业产品。

    - 通信（Telecommunications）：无线是为南方贫困社区提供连接的首选方法。20世纪80年代和90年代对卫星形式（如 VSAT）的兴趣已让位于对地面传输系统的关注。同样，注意力正从基于
    WiFi 的系统和创新转向 WiMAX。


    ## 框 2.2. 影响评估与评价


    影响评估和评价一直被视为发展家族中被忽视的孩子。我们担心回望时，会像最后（罗后）一样变成盐柱。部分问题在于动力，这很难改变，但 ICT4D 的部分问题在于缺乏指导。诸如《发展信息技术影响手册》和《全球影响研究》等计划将为
    ICT4D 2.0 提供指导。


    ## 新硬件


    当我们站在 ICT4D 2.0 的门槛上时，一个需要解决的问题是，我们将如何为剩下的50亿人提供互联网？


    ![图2.2: ICT4D 的技术和过程](img/e4eadbe4bb6a2563835d6f5_39.png)

    来源：Richard Heeks。


    '
