    practices need to be examined for overall coherence in meeting policy objectives.


    The development of the money transfer service M-PESA, initially deployed in Kenya,
    is described in Chapter 5. Though originally intended for remittances, the service
    has evolved to include new financial services such as micro-finance, micro-insurance,
    and school fee payment. The logical next step is to integrate public sector services
    into the system; however, regulatory positions are often too inconsistent or incoherent
    with no best practice.


    The difference in mobile phone coverage between OECD and developing countries
    is relatively small, but the gap in number of bank branches and especially cash
    machines is much wider. This provides the strongest case for m-banking. Generally
    speaking, where there are multiple money transfer operators (as in the US, Spain
    and UK) the average transaction cost (USD 6.6 per USD 200) is much lower than
    in countries where there are relatively few (such as Japan, France, Canada and
    the Netherlands), where the average transaction cost is USD 15.5 per USD 200.
    Mobile phone operators like M-PESA can reduce these transaction costs substantially.


    # Figure 1.4: Network coverage in selected regions (% of population)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_21_0.png)


    Source: Presentation by Laura Recuerdo Virto, Economist, Development Centre, OECD.


    In some developing countries the volume of remittances greatly exceeds the value
    of formal donor aid. Innovations such as M-PESA, which improve efficiency and
    reduce the margins of remittances, may have a marked beneficial effect. However,
    while m-banking opens up many new opportunities for development, it also creates
    scope for fraud. Thus there is a pressing need for policy coherence amongst ministries,
    regulators, donors and service providers.


    # Security considerations in ICTs for development


    The globally interrelated nature of the Internet means that policies and practices
    adopted in one country have the ability to affect the security and stability of
    network use in others. In this context, the development of a culture of security
    which benefits all users around the world, and the funding of expenditure necessary
    to sustain that environment, will be particularly challenging for the next billion
    Internet users.


    Before 2003 the majority of viruses came from developed countries, with the main
    motivation being a distorted sense of fun and fame. Today the biggest hotspots
    worldwide are Russia, China and Brazil, and the most common motivation is credit
    card scams, especially using loggers which are largely a thing of the past. Now
    the biggest hotspots worldwide are keystroke loggers which are almost invisible
    to the user. Another common form of hacking is to capture computers around the
    world as botnets to launch denial of service attacks, which are then used to force
    ransom payments from online shopping sites. In terms of securing developing countries,
    it is likely that the initiative will need to come from international co-operation.
    Ironically, one of the main forms of protection developing countries currently
    have is their slow connection speeds, which make their systems less attractive
    to hackers.


    balance between security and privacy concerns, especially in areas such as online
    shopping, smart grids and online searches.


    Security concerns are the same in both developed and developing countries. A number
    of tools are available to address them, but the problem lies in a lack of implementation
    and cross-border co-operation. The lack of awareness and interest amongst young
    people to follow ICT security as a possible career path is a particular lacuna,
    especially in developing countries.


    There is a role for capacity-building, as well as for striking an appropriate
    balance between security and privacy. The sequence of priorities should be prevention,
    followed by mitigation and then prosecution.


    # ICTs and the environment


    One of the key tasks facing all stakeholders is how to harness ICTs to improve
    environmental performance and mitigate climate across all sectors of the economy.
    This is discussed in detail in Chapter 6.


    It has been estimated that ICTs account for 2-2.5% of global greenhouse emissions,
    with a forecast that these emissions will rise in future. On the other hand, ICTs
    have the potential to mitigate greenhouse gas emissions in other sectors by five
    times their direct polluting impact. There is also the question of “rebound effects”
    from energy efficiency improvements (e.g. cheaper and more widespread energy causing
    usage to go up). This phenomenon is not well studied in developing environments.


    A broader issue is whether today’s developing countries follow a long-term development
    model similar to that of developed countries, from agriculture to manufacturing
    to services. Is it possible for developing countries to leapfrog directly to ICT-enabled
    services? Issues to consider include:


    - access to data;

    - understanding life-cycle impacts;

    - managing possible rebound effects;

    - technology transfer.


    An example of the impact of ICTs on the environment can be found in Hong Kong
    and the Pearl River Delta. The burgeoning growth of data centres in the region,
    each of which can consume the equivalent energy of a small town, has sparked green
    initiatives covering four main areas:

