    greatly improved the energy efficiency of motor vehicles. Industrial and household
    equipment increasingly include the design, construction and management of buildings
    include “smart technology” to better control resource and energy use, emissions,
    serviceability and durability.


    Nevertheless, many studies have illustrated the difficulties in avoiding rebound
    effects and realising the potential benefits of ICTs (Box 1). It has been noted
    that the “paperless office” has not yet eventuated, that ecommerce may not save
    energy if it encourages long distance delivery, and that tele-working can increase
    the use of energy and demand for electronic equipment such as routers and printers,
    and so on by Plepsy (2002). As always, the key is not the technology but how it
    is implemented and used.


    Looking at ICTs as tools for dealing with environmental issues from a developing
    and emerging country perspective, ITU (2008) noted six application categories
    (Figure 6.4):


    +   Environmental observation: terrestrial (earth, land, soil, water), ocean and
    atmospheric monitoring and data recording technologies and systems (remote sensing,
    data collection and storage tools, telemetric systems, meteorological and climate-related
    recording and monitoring systems), as well as geographic information systems (GIS).

    Environmental analysis: once environmental data have been collected and stored,
    various computational and processing tools are required to perform analyses. This
    may include land, soil, water and atmospheric quality assessment tools, including
    technologies for analysis of atmospheric conditions including GHG emissions and
    pollutants, and the tracking of both water quality and availability. The analysis
    of data may also include correlating raw observational data with second order
    environmental measures such as biodiversity.

    Environmental planning: at the international, regional and national level, planning
    makes use of information from environmental analysis as part of the decision-making
    process for the purpose of policy formulation and planning. Planning activities
    may include classification of various environmental conditions for use in agriculture
    and forestry and other applied environmental sectors, and often focuses on specific
    issues as protected areas, biodiversity, industrial pollution or GHG emissions.
