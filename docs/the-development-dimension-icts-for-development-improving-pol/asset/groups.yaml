    the poor. Where ICT4D 1.0 marginalised them, allowing a supply-driven focus, ICT4D
    2.0 centralises them, creating a demand-driven focus. Where ICT4D 1.0 – fortified
    by the bottom of the pyramid – characterised as passive consumers, ICT4D 2.0 sees
    the poor as active innovators.


    Three overarching questions for this next phase emerge. How can the poor be producers
    of digital content and services? How can they create new incomes and job? And
