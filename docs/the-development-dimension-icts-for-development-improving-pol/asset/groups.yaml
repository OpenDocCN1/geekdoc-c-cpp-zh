    buy now” messages from known customers.

    * New business models: e.g. use of airtime as currency has allowed mobile phones
    to metamorphose into mobile wallets. Those whose phones in poor communities have
    therefore been able to use them for payments or for receipt of remittances from
    distant relatives.

    * New products: e.g. back-street recharging of phones. Informalsector enterprises
