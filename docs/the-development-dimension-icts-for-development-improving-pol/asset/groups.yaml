    ## 5. 移动银行的监管问题 – 141


    ### 监管者的角色


    金融监管机构对任何国家的经济都起着至关重要的作用。监管机构处于普通公民与金融混乱之间，试图确保国家经济的金融稳定性，并确保那些希望提供金融服务的机构以负责任的方式运营。除了维护金融稳定的监管角色外，监管者还承担着保护消费者的关键责任。


    然而，监管者还有第三种角色，这对于新兴经济体尤为重要：通过确保尽可能多的公民可以使用适当的金融服务，并使服务范围和复杂程度随国家需求同步增长，从而促进国家的社会目标。这第三种角色通常被称为“扩展金融服务的范围和深度”。


    可以说，许多监管机构倾向于认为这第三种角色在实质上与前两个角色冲突。毕竟，其逻辑是：经济增长受到了威胁，谁会在意人口是否拥有银行账户？虽然这种观点有一定道理，但它可能导致保守主义倾向，其无意间的后果是推高了新市场进入者的门槛，实际上封锁了现有金融服务提供者的大门，并保护他们免受更具创新性或高效的竞争者的竞争。


    ### 监管机构对无网银行的问题


    在 Consult Hyperion 与全球金融监管机构的交流中，关于无网银行出现了一些共同主题。许多人认为，像 M-PESA 这样没有银行直接参与的支付方案不应被允许——此类方案应该始终由银行领导。正如一位监管者不带讽刺地说的：“鉴于近期的金融危机，我们认为只有银行才能提供必要的稳定性”。


    对非银行机构的不熟悉也是一个被提到的问题。通常，监管机构对他们所监管的银行和其他金融机构的现有关系感到放心。他们知道应该查看哪些数据和报告，并熟悉影响这些机构运营的可用杠杆。没有理由认为其他机构不能提供类似的、满意的机制，但对监管者来说，这是一个熟悉程度的问题。


    最后，一些监管者担心无网银行方案的失败会对客户和更广泛的经济产生影响。这是一种合情合理的担忧，事实上，一些既有无网银行方案的代表在考虑其某些竞争对手的新产品时，也提出过这种担忧。


    ### M-PESA 的经验


    M-PESA（M 代表 mobile，PESA 是斯瓦希里语中“钱”的意思）是一种转账服务，最初部署于肯尼亚，它允许普通肯尼亚人使用手机廉价且可靠地在全国范围内（或者实际上面对面）发送款项。M-PESA
    账户也可以作为存储小额资金的安全场所（这一方面让一些评论者感到不安，但对于那些无法获得真正银行账户的人来说却是理想的）。这是“扩展金融服务的范围和深度”的一个典型例子，对肯尼亚公民具有显而易见的益处。


    ### 图 5.2：运行中的 M-Pesa


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_143_0.png)


    - 1. 选择“提取现金”

    - 2. 选择“提取”

    - 3. 输入你想取款的手机号码

    - 4. 输入你想提取的金额

    - 5. 输入你的秘密 码

    - 6. 检查详情无误后按 OK 向 M-PESA 发送短信


    来源：David Birch 的工作坊演示，数字货币论坛主席兼 Consult Hyperion 董事。


    发展中的 ICTS：提高政策一致性 | OECD 2009


    M-PESA 由沃达与肯尼亚领先移动运营商 Safaricom 合作开发并部署。它已经运行了近两年半，根据最后统计，已有超过 700 万注册客户，他们之间每天转账金额达200
    万美元。


    然而，在它的合作伙伴列表中，没有任何肯尼亚金融社区的成员，除了提供商业银行服务的非洲商业商业银行（CBA）除外。这种缺失导致了 Consult Hyperion
    所接触的某些监管机构的几近于愤怒。


    M-PESA 团队确实联系了肯尼亚金融社区的许多知名成员，希望招募一个合作伙伴。但无论是因为这些机构对与移动运营商合作持怀疑态度，还是可能觉得该提议风险太大且注定失败，一直没有找到合适的金融部门合作伙伴。最终，沃达和
    Safaricom 决定在没有伙伴的情况下。这在金融监管方面显然构成了一个问题。


    迈向 M-PESA 的初步尝试包括与尽可能多的利益方会面——肯尼亚监管机构就是其中之一。在这方面，团队认为需要与监管机构互动，该监管机构不仅仔细确保其对肯尼亚经济整体、特别是金融部门的责任得到充分满足，还将“扩展金融服务的范围和深度”的目标视为首要任务，并愿意探索新想法并听取潜在新市场进入者的意见。


    意识到监管机构在提出新进展时通常会咨询其同行，M-PESA 团队还与其他监管机构（如英国金融服务监管管理局）进行了接触。他们的目标是营造出一种正常进展和明智发展的氛围，以减少任何将该服务视为危险前卫的观点。


    无网银行行业可以从支付卡行业标准委员会等行业倡议中学习到很多东西——因此，从卡片行业借用的几个概念被嵌入了 M-PESA 中。有些是端到端加密（机密数据保存在手机、SIM
    卡中），在 M-PESA 服务器上使用硬件安全模块（HSMs），以及对业务流程的安全性关注。这得到了一套完整的报告工具的支持，可以对单笔和批量交易进行详细查看。


    为了确保 M-PESA “涵盖了所有方面”，他们指派了一位顾问审查了草案中的肯尼亚反洗钱法，以确保了所有必要的控制措施和报告机制——这些步骤有助于缓解与监管机构的关系。这些努力并非仅仅为了允许
    M-PESA 上线——尽管它们确实有帮助，且 M-PESA 获得了一个特别许可。相反，团队认为，尽管 M-PESA 不是完全受监管的金融机构，但像它那样运营是唯一负责的方法。额外的益处是为
    M-PESA 应对未来的监管发展做了准备，以及员工心态从移动运营商转向准金融机构的不可忽视的影响。


    新兴无网银行方案的一个问题是“了解你的客户”（KYC）法规，该法规要求在新客户使用服务之前必须验证其身份。幸运的是，肯尼亚已经建立了国家身份证制度。在研究某些国家启动的项目所遇到的困难时（例如
    M-PESA 在坦桑尼亚的推出），现有身份证制度的优势显而易见。


    ### 监管进展


    无网银行的整体成功以及 M-PESA 的成功，推动了近期的一些监管进展。其中一些基于只允许银行提供此类服务的观点，这表明某些监管者并不理解监管环境如何适用于非银行。肯尼亚财政部长最近对
    M-PESA 启动了审计，以验证其不会被洗钱者和金骗计划利用（事实上，曾有虚假指控 M-PESA 仅仅是一个庞氏骗局）。这一举措在普通肯尼亚人中极不受，他们认为这是银行（某些人认为银行从未想过为他们服务）关闭
    M-PESA 的尝试。Consult Hyperion 被要求通过对安全措施和程序进行新的审计来做出回应，并再次证实了 M-PESA 提供银行级的安全性。


    '
