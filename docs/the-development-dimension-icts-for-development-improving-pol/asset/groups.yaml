    私营部门。私营公司越来越多地投资 ICT4D，原因似乎是 CSR（企业社会责任）与 BOP（将贫困人口视为金字塔底部）之间相当模糊的交界面。思科、惠普、英特尔和微软等跨国公司向贫困社区转移设备的投资是众为人知的。较为人知的是来自南方的
