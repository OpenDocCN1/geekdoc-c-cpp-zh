    ## 6. 发展中国家的 ICT 与环境：机遇与发展 – 151


    五年计划（2006-11年）。通过观察就业和部门 GDP 占比及增长率的长期趋势，Shehan 指出印度是一个由服务业驱动的“大推动”发展案例（图 6.1），并认为：“我们过去所理解的工业化对于发展中国家来说不再是一个现实的选择，它们需要找到参与现代服务业增长的方法，这将直接提高其人民的生活水平。”值得注意的是，印度单位
    GDP 的二氧化碳强度远低于发展中国家的典型水平，与日本相当，并低于德国（Ghosh 2009）。


    ## 图 6.1：各各部门增加值占比，印度 1950–51年至 2007–08 年


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_152_0.png)


    > 来源：Shehan, P.J. (2008) 超越工业化：基于服务业的发展战略新方法，UNU-WIDER 研究论文 2008/60：赫尔辛基。


    ICT 在使服务变得贸易化以及 IT 和 IT 支撑服务的全球化方面发挥了关键作用。Houghton 和 Welsh (2009) 在观察 IT 和 IT
    支撑服务的出口强度时指出，2006 年三个国家计算机和信息服务占总服务出口的 25% 以上：印度占比近 40%（低于 2004 年的 50%）；爱尔兰 31%（低于
    2004 年的 39%）；以及以色列 27%（图 6.2）。他们的分析表明，IT 和 IT 支撑服务的出口可以在广泛的发达、新兴和发展中经济体中发挥重要作用，并且对于后者，可能提供一种比过去通用工业化更具环境可持续性的发展路径基础。


    ## 图 6.2：IT 服务在总服务出口中的占比，2006年 (%)


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_153_0.png)


    来源：Houghton, J.W. and Welsh, A. (2009)，澳大利亚 ICT 贸易更新 2009，澳大利亚计算机学会，悉尼。


    在评估替代发展路径的可能性时，Berkhout 等人 (2009) 认为，经济结构和增长率的收敛在增长理论中起着核心作用，但这并不意味着支撑增长的社会技术系统在技术组成和环境质量方面也必须是敛的。他们呼吁更加关注发展的资源和环境质量，将其作为更可持续发展路径的基础。


    ### ICT 与环境


    ICT 与环境之间的关系复杂且多方面，因为 ICT 既可以产生积极影响也可以产生负面影响。积极影响可以来自去物质化和在线交付、交通和旅行的替代、监测和管理应用、生产和使用中能源效率的提高，以及产品责任延伸和回收。负面影响可能来自
    ICT 设备生产和分销中的能源消耗和材料、直接使用和冷却的能源消耗、较短的产品周期和电子垃圾，以及剥削性应用（例如用于不可持续过度捕鱼的遥感技术 (Daly
    2003)）。


    ICT 对环境的影响可以是直接的（能源消耗和电子垃圾）、间接的（如智能交通系统和智能电网等应用）或三级和反弹的（由直接或间接使用 ICT 引起，例如更多地使用高效的交通工具）。ICT
    的影响究竟是什么，以及在多大程度上存在反弹效应（框 1），是广泛讨论的话题。然而，显然，衡量 ICT 对环境影响的尝试应该考虑到潜在的反弹效应和整个生命周期，而不仅仅是产品或应用本身的直接影响（Plepsy
    2002; Yi and Thomas 2007; Hilty 2008, 等）。


    对 ICT 行业直接影响的估算随行业定义和 ICT 相关用途的覆盖范围而异，但据估计 ICT 设备的生产和使用约相当于全球二氧化碳排放量的 1% 至 3%（包括嵌入能源），且用电占比较高并在不断增长。2006
    年估计，ICT 设备（不包括广播）贡献了全球温室气体（GHG）排放量的约 2% 至 2.5%——其中 40% 据报道由于 PC 和显示器的能源需求，23%
    来自数据中心，24% 来自固定和移动电信，6% 来自打印机（Kumar and Mieritz 2007）。最近的生命周期评估得出了大致的结果（Malmodin
    2009）。数据中心是一个特别关注点。Koomey (2007) 估计了2000 年至2005 年间全球服务器的用电，并预计消耗将进一步增加 40%。


    尽管如此，许多人发现 ICT 可以显著减少环境足迹（The Climate Group 2008）。


