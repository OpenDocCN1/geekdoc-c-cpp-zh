    Source: workshop presentation by Ilkka Lakaniemi, Director, Global Policy Initiatives,
    Nokia Siemens Networks.


    One of the surprising elements of the 2009 results is that certain countries,
    such as Korea, score lower than expected, mainly because of the lack of development
    of broadband in the business sector. By contrast, the US ranks at the top, in
    part to its well-developed services sector. The Scandinavian countries all do
    well. The UK has one of the biggest risers since the previous survey in 2007.
    Within Europe, there is a north-south divide in broadband. Among developing economies,
    Malaysia is the top performer, with Chile the lead country in South America and
    South Africa leading in Africa.

