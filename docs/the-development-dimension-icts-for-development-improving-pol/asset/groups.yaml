    # 100 – 3. HOW THE DEVELOPING WORLD MAY PARTICIPATE IN THE GLOBAL INTERNET ECONOMY


    The conclusion that may be drawn is that market entry permitting least a few suppliers
    (even as few as two in micro states) is a necessary condition for rapid growth
    of telecom services and thereby for participation in the global Internet Economy.
    Competition strong enough to cause operators to adopt the budget telecom network
    model is sufficient, at least for low-income countries. This qualification has
    to be made because countries such as China and South Africa have achieved high
    levels of mobile penetration (though not low prices and high minutes of use, as
    in South Asia) without adopting the budget telecom network model.¹⁰


    The question then is: what policy frameworks and regulatory instruments are conducive
    to developing country participation in the global Internet Economy? The short
    answer is those that remove, to a greater or lesser degree, market-entry barriers
    are supportive of the budget telecom network model.


    # Market entry and spectrum management


    In light of the absolute necessity of spectrum for building access networks for
    voice and data in developing countries, it is meaningless to talk about market
    entry in the abstract. Excluding specialised services such as international gateways,
    most telecom service require frequencies, mostly for access networks but also
    in some cases for backhaul.


    Market entry and spectrum assignments based on published policy frameworks and
    transparent procedures, consistent with the provisions in the Reference Paper
    on Services (GATS), are obviously very good. However, even opaque market entry
    and spectrum assignments are better than none. Bangladesh, a country that arguably
    failed to meet standards of good practice on market entry in the past, which has
    nevertheless succeeded in connecting 40% of its SEC D and E population at the
    world''s second-lowest mobile prices.


    Even if operators can muddle through poor spectrum management and opaque assignment
    in the early stages, there will be problems as networks expand and new services
    are offered if spectrum management, especially refarming, is not done professionally
    and transparently. Delays in releasing 3G frequencies in many countries, including
    in important markets such as India, have already hampered developing countries''
    participation in the Internet Economy.'
