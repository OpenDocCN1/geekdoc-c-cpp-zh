    It is becoming clear that agricultural information is most efficiently provided
    via mobile. Findings from the Warana Wired (old and failing); standard computer-centred
    and Warana Unwired (new and successful); mobile-centred projects in Maharashtra,
    now being applied on a larger scale in Vietnam by Microsoft Research, vividly
    illustrate this.9


    Companies such as CellBazaar in Bangladesh are introducing ecommerce to BOP users
    who would otherwise never have access to such services. CellBazaar is designing
    its services for the highly constrained capabilities of the cheapest, simplest
    GSM phones on the market and are therefore focusing only on the search phase of
    the transaction (Figure 3.10).


    Figure 3.10: Stages of a commercial transaction included in CellBazaar compared
    with Amazon Marketplace


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_93_0.png)


    Everything takes place outside the CellBazaar system, but using the conversational
    and messaging capabilities of mobile phones. Analysis shows that the enterprise
    is still in the promotional phase, seeking to attract users at low prices (around
    a minimum of USD 0.35 for a transaction in the case of SMS) and sacrificing high
    returns. The rather bulky user experience through the familiar SMS format is being
    improved over WAP in the case of CellBazaar, and may be improved by others using
    the USSD (Unstructured Supplementary Services Data) functionality that is also
    part of GSM.


    As the sugarcane farmer who can obtain market information even while on a tractor,
    the mobile interface in CellBazaar has inherent additional benefits with regard
    to transactions that cannot be completed fully on the Web (e.g., purchase of a
    car or a cow). Unlike comparison shopping on a desktop that requires the taking
    of notes or printouts before venturing out for actual transactions, the mobile
    interface allows comparison shopping as needed, when-needed.


    The Govi Gnana Seva (GGS) system for delivering agricultural market prices in
    Sri Lanka has gone through many incarnations since 2002. First it focused on collecting
    spot prices from Sri Lanka’s largest fruit and vegetable wholesale market displaying
    them on large electronic screens, reducing price dispersion within the market
    itself. Then it sought to deliver spot prices to those distant from the market
    through SMS and an interactive voice response system. When pilot project funding
    ended, prices were collected and disseminated over radio and television. Starting
    in 2009, the system is being redesigned to deliver spot and rudimentary forward
    prices to mobile phones. This will allow for a range of behaviors that would not
    be possible if prices were delivered only to desktops in telecentres or elsewhere.
    Here the mobile can be used directly in negotiation, with additional information
    being pulled up by either party.


    The uses of reducing friction in fish markets in Kerala, India and grain markets
    in Niger has been well studied. In both cases it producer prices increased, consumer
    prices decreased and waste was eliminated (in the case of the perishable commodity,
    fish) because producers could access a larger number of hitherto isolated markets
    newly connected through mobiles. In contrast with Warana and GGS, the Kerala and
    Niger cases do not involve any kind of organised data collection but simply the
    use of mobiles for information gathering and decision-making.


    Mobiles are attracting considerable attention as payment devices, especially for
    the poor. Clearly, payment is one of the more functions performed on the Internet,
    and in combination with other functions can yield higher-level participation in
