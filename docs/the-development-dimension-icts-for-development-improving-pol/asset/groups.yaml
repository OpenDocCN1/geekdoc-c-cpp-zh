    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 37


    Naturally, ICT4D 1.0 was not solely restricted to telecentre projects. But the
    telecentre was the archetype for this period, stretching from the mid/late-1990s
    to the mid/late-2000s.


    What has been the outcome? Painting with a broad brush, we can sum up with three
    words: failure, restriction, and anecdote. Each of these has led to specific lessons
    and new watchwords:


    +   - Sustainability: given the failure of many ICT4D projects to deliver and/or
    survive, there is a new emphasis on ensuring the longevity of such projects.


    +   - Scalability: given the limited reach of individual telecentre projects,
    there is a search for scalable ICT4D solutions.


    +   - Evaluation: that ICT4D 1.0 was often held aloft by hype and uncorroborated,
    self-interested stories, there is a new concern with objective evaluation of impacts.


    More generally, these outcomes of the first decade of ICT4D have led to a rolling-appraisal
    of priorities, processes, and purposes. There is no sharp divide to mark out the
    first from the second phase of ICT4D – the latter began as the first lessons were
    learned back in the 20th century. and there is no consensus on what ICT4D 2.0
    looks like – the discussion is ongoing.


    Nonetheless, let us sketch out of its component parts – a task that will be taken
    up in the rest of this chapter.


    # ICT4D 2.0’s new technological priorities


    Figure 2.2 provides an overview of the technology and processes of ICT4D. Before
    plunging into how some these are likely to change in the coming years, though,
    we will take a step back.


    In his book Shock of the Old, David Edgerton argues that we have been too obsessed
    with technology-as-invention, and too little focused on technology-in-use. Yet
    it is the latter that has made much of a difference to people’s lives.


    The ICT4D field has certainly been prone to this. It has sought to surf each wave
    of “novelty”. ICT4D 1.0 initially took an invention-down approach – bringing new
    technologies into development contexts – much more than it took a use-up approach
    of understanding how existing technologies were being applied poor communities.'
