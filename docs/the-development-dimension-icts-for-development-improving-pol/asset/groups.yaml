    # Decreased market barriers = increased connectivity


    Connecting a majority of the world''s population to electronic networks within
    a few decades, either directly or through the connections of others, is an extraordinary
    public policy achievement. It is claimed that there are over 4 billion active
    SIMs worldwide, and a majority of the world''s phones are now mobile. Getting
    from the gloomy-yet-effective prognostications of the Maitland Commission in 1984
    to the current reality, in which the 87% of the poor in the Indo-Gangetic Plain¹
    made a phone call in the last three months and 41% only a mobile or fixed phone,
    has taken only 24 years. Understanding the causal factors is important, not only
    because because there is value in adapting the lessons of narrow bande connectivity
    to ensure broadband connectivity for all. At a minimum, there is value in understanding
    what did not work in narrow bande connectivity to avoid repeating failures.


    The key to first generation connectivity for the poor is shown in Figure 3.2,
    adapted from a figure first developed by the Telecommunication Regulatory Authority
    of India (TRAI). Lower prices invariably lead to greater connectivity, which leads
    to even lower prices and even greater connectivity.'
