    guiding ICT4D 2.0 projects. Where will those worldviews come from? There are two
    main disciplinary candidates.


    The first is information systems. During the 1980s and early 1990s, information
    systems were the intellectual home of ICT4 before it was called ICT4D; particularly
    within the work of the International Federation for Information Processing’s Working
    Group 9.4 on social implications of computers in developing countries. This has
    strengthened with the creation of IS discipline journals dealing with ICT4D, new
    editorial board members on key IS journals being appointed with a specific developing
    country remit, and most recently, with the Association for Information Systems’
    creation of a special interest group on IS in developing countries.


    An systems systems perspective offers the means to understand many of the problems
    that best ICT4D projects. Most notably, it offers models for understanding the
    human, political, contextual reasons behind why many ICT4D projects fail. It also
    offers approaches for addressing these factors during project design and implementation.
    At its widest setting, information systems even permit us to step back and answer
    questions about the political economy of ICT4D: whose interests it promotes, and
    what its opportunity costs are.


    But the information systems perspective falls in two ways. It has at least part
    lost track of the artefact, becoming so much of a social science and so concerned
    with whether it fails to engage with the technology. It has made few connections
    with the context, stakeholders and process of development. Information systems
    tend neither to understand, nor use the ideas of development, development studies.


    One could argue for incorporation of a fourth worldview: communication studies.
    It has housed interests in development for decades and provides a key part of
    the ICT4D community. For simplicity, we will here view its key concepts as incorporated
    into information systems: a simplification more credible for communication models
    and telecommunications; less so in studying media.


    It is to development studies that we turn. Development studies have so far failed
    to adequately convey or support ICT4D. In part, this has happened because development
    studies turned away from technology generally in the 1980s; a counter-reaction
    to the “big science” and “technology transfer” ideas that generalised the by-then-discredited
    paradigms that had dominated development in earlier decades.


    As a result, ICT4D 1.0 grew as something of a bubble. It was driven by actors
    external to the development field as IT vendors, and by a few believers who wanted
    that. But it was isolated from the development mainstream, which remained sceptical
    about technology, especially newly-technology (despite the fact that in their
    own homes and workplaces increasingly relied on it).


    As the 2000s progress, though things have changed in development studies. Science
    and technology are making up the development agenda, driven by human development
    champions such as Jeffrey Sachs who see technology as central to achieving the
    MDGs; by the central importance given to science and technology by the NICs (newly-industrial
    countries like Korea and Taiwan) and BRICS (Brazil, Russia, India, China) that
    are emerging as economic powers and as new aid donors; by new perspectives on
    technological innovation show how it can be effective in addressing the problems
    of the poor.


    There are greater opportunities in ICT4D 2.0 for engagement with development studies.
    This is an engagement that will help understand where digital technologies fit
    into development paradigms, processes and structures. Not only can this guide
    post-hoc activities such as ICT4D impact assessment, but also guide pre-hoc activities
    that seek to understand ICT4D priorities, and ICT4D project design and implementation
    good practice. A development studies perspective provides guidance at both a macro
    and micro level, all ultimately increasing the likely contribution of ICTs to
    development.


    ## Integrating perspectives


    We conclude that one of the three intellectual domains computer science, information
    systems and development studies – has something to offer the ICT4D field.


    Conceptually, this mean needs spaces that bring these three domains together.
    That has not yet been achieved, and it remains the key intellectual challenge
    during ICT4D2.0. But there are some promising possibilities in groupings such
    as the ICTD conferences², which get a mix of informatics professionals to address
    development issues, and in the recently-formed IFIP special interest group on
    Interaction Design and International Development. Both groupings focus on the
    computer science/information systems boundary on the particular needs and practices
    of system design in a development context. They draw on the broader burgeoning
    fields of design-for-development in the academic sphere, and design-for-emerging-markets
    in the commercial sphere.


