    # 30 – 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT?


    # Overall policy coherence challenges


    The constant novelty and innovation of digital technology brings a constant stream
    of policy challenges. For example, Manchester’s Centre for Development Informatics
    has been studying barriers to diffusion of “m-finance”; i.e. the use of mobile
    phones to help bring financial transactions and services to the poorest communities
    (Duncombe 2009).


    An immediate policy barrier arises due to sectoral convergence. When mobile phones
    become mobile wallets, information and communication technology (ICT) policy crashes
    into financial policy. Some countries lack a helicopter view of multiple policies
    – the kind necessary to see the bigger picture of their impact on development.
    For instance financial regulations may allow only banks to undertake formal financial
    transactions, yet banks are currently among the least-trusted of financial institutions.
    Furthermore, such regulations restrict competition – keeping mobile operators
    and thirdparty innovators out of the market, restricting the spread of m-finance,
    and thus damaging development.


    Some countries, by contrast, lack a grassroots view of policy – they do not understand
    the roadblocks that individuals within poor communities face when trying to make
    use of ICTs. Taking the example of m-finance, three key barriers prevent the poor
    from making use of services even when available: affordability, lack of financial
    literacy, and lack of trusted intermediaries. To address these would, again, require
    coherence across a set of policy areas including taxation, telecommunications
    policy, education, and financial regulation.


    The OECD/infoDev Policy Coherence in the Application of Information and Communication
    Technologies for Development workshop focused on the need for coherence around
    particular applications of ICTs, such as the m-banking example. But there are
    more generic Information and Technology for Development (ICT4D) policy coherence
    challenges, which can be grouped into four questions.


    # Question 1: Is coherence in ICT4D policy between the global North and the global
    South?


    Of course, some commentators would argue that there is complete coherence: rich
    nations’ policies benefit rich nations, and policies forced onto poor nations
    also benefit rich nations. The current struggles in World Trade Organization negotiations
    suggest that things are not quite so simple these days, as some of the nations
    in the global South become more'
