    ## 5. REGULATORY ISSUES AROUND MOBILE BANKING – 141


    ### The role of the regulator


    The financial regulator plays a crucial role in the economy of any country. The
    regulator stands between ordinary citizens and financial chaos by attempting to
    ensure the financial stability of an economy, and those institutions wishing to
    offer financial services do so in a responsible manner. In addition to the regulator’s
    role in maintaining financial stability, they also have key responsibility for
    consumer protection.


    There is a third role for the regulator, however, that is particularly important
    for emerging economies: promoting a country’s social objectives by attempting
    to ensure that suitable financial services are available to as many citizens as
    possible, and the range and sophistication of such services increase in step with
    the country’s needs. This third role is generally referred to as “extending the
    reach and depth of financial services”.


    Quite reasonably, many regulators tend to view this third role as substantially
    inconvenient to the first two. After all, the reasoning goes, economic growth
    is threatened, who cares whether or not the population has a bank account? While
    there is a grain of truth in this view, it can lead to a tendency towards conservatism,
    with the unintended consequence of raising the barrier for entry for new market
    entrants, effectively closing the door behind existing financial service providers
    and protecting them from more innovative or efficient competitors.


    ### Regulators’ issues with branchless banking


    In Consult Hyperion’s conversations with financial regulators around the world,
    common themes regarding branchless banking emerged. Many felt that payment schemes
    such as M-PESA, with no direct bank involvement, should not be allowed – that
    schemes should always be led by banks. As one regulator put, without a trace of
    irony, “in view of the recent financial crisis, we feel that only a bank provides
    the necessary stability”.


    A lack of familiarity with non-bank institutions was also raised. Generally, regulators
    feel comfortable with their existing relationships with the banks and other financial
    institutions they regulate. They know what figures and reports to look at and
    are familiar with the levers available to influence these institutions’ operations.
    There is no reason why any other institution should not be able to provide similar
    satisfactory mechanisms, but for the regulators it is a question of familiarity.


    Finally, some regulators are concerned about the effect that the failure of a
    branchless banking scheme could have on customers and the wider economy. This
    is a legitimate concern, and indeed one that has been raised by representatives
    of a number of established branchless banking schemes when looking at some of
    their competitors'' new offerings.


    ### The M-PESA experience


    M-PESA (M for mobile, PESA the Swahili word for money) is a money transfer service,
    initially deployed in Kenya, which allows ordinary Kenyans to send money across
    the country (or indeed face-to-face) cheaply and reliably using mobile phones.
    M-PESA accounts can also be used as a safe place to store small amounts of money
    (an aspect that perturbs some commentators but is desirable to those with no access
    to a true bank account). This is a clear example of “extending the reach and depth
    of financial services”, with obvious benefits for ordinary Kenyan citizens.


    ### Figure 5.2: M-Pesa in action


    ![](img/e4ba8eadbe4bb6a2aa563835c838d6f5_143_0.png)


    - 1. Select “Withdraw cash”

    - 2. Select "Withdraw”

    - 3. Enter the phone number you want to withdraw cash from

    - 4. Enter the amount you want to withdraw

    - 5. Enter your secret PIN

    - 6. Check the details are correct then press OK to send an SMS to M-PESA


    Source: workshop presentation by David Birch, Chair, Digital Money Forum and Director,
    Consult Hyperion.


    ICTS FOR DEVELOPMENT: IMPROVING POLICY COHERENCE | OECD 2009


    M-PESA was developed and deployed by Vodafone, in partnership with Safaricom,
    the leading Kenyan mobile operator. It has been live for almost two and a half
    years and, at last count, have more than 7 million registered customers who were
    transferring USD 2 million per day between themselves.


    However, absent from its list of partners is any member of the Kenyan financial
    community, with the exception of the Commercial Bank of Africa (CBA), who provide
    commercial banking services. This absence caused near outrage in some of the regulators
    Consult Hyperion spoke to.


    The M-PESA team did count many high-profile members of the Kenyan financial community
    in the hope of recruiting a partner. Whether it was because these institutions
    were suspicious of becoming involved with a mobile operator, or perhaps felt that
    the proposal was too risky and doomed to fail, no suitable financial sector partner
    could be found. Eventually, Vodafone and Safaricom decided to go without one.
    This clearly posed a problem with regard to financial regulation.


    The first, tentative moves towards M-PESA consisted of meetings with as many interested
    parties as possible – the Kenyan regulator being one of them. In regard, the team
    felt to interact with a regulator who was not only careful to ensure its responsibilities
    to the Kenyan economy in general, and to the financial sector in particular, were
    fully satisfied, but who also viewed the aim of "extending the reach and depth
    of financial services" as a high priority, and were willing to explore new ideas
    and listen to potential new market entrants.


    Aware that regulators generally consult their peers when a new development is
    proposed, the M-PESA team also engaged with other regulators such as the UK''s
    Financial Services Authority. Their goal was to create a feeling of normal progression
    and sensible development in order to diminish any view of the service as dangerous
    avant garde.


    There is much that the branchless banking sector can learn from industry initiatives
    such as the Payment Card Industry Standards Council – so several concepts borrowed
    from the card industry are embedded in M-PESA. Some are end-to-end encryption
    (with confidential data held within the mobile handset, SIM), the use of hardware
    security modules (HSMs) at M-PESA servers and a security focus on business processes.
    This is backed by a comprehensive set of reporting tools which allow detailed
    views of every transaction, both individually and in masse.


    In an attempt to ensure that M-PESA was “covering all the bases”, a consultant
    was tasked with going through the then-draft Kenyan anti-money laundering legislation
    to ensure that all the necessary controls and reporting mechanisms were in place
    – steps which helped to ease the relationship with regulatory authorities. These
    efforts were not intended merely to allow M-PESA to launch – though of course
    they helped, and M-PESA was granted a special license. Rather, the team felt that
    although M-PESA is not a fully-regulated financial institution, to behave like
    one was the only responsible approach. The added benefit of preparing M-PESA for
    any future regulatory developments, and the not inconsequential effect of changing
    the mindset of staff away from that of a mobile operator towards that of a quasi-financial
    institution.


    An issue for emerging branch banking schemes is “know your customer” (KYC) regulations
    which require that every new customer’s identity be verified before they are able
    to use the service. Fortunately, established national ID card scheme already existed
    in Kenya. The advantage of an existing ID card scheme becomes obvious when examining
    the difficulties experienced by initiatives launched in countries, such as M-PESA’s
    launch in Tanzania.


    ### Regulatory developments


    The success of branchless banking schemes in general, and M-PESA in particular,
    has driven some recent developments in regulation. Some are based on the view
    that only banks should be allowed to offer such services, which suggests that
    some regulators do not understand how the same regulatory environment can apply
    to non-banks. Kenya’s finance minister recently launched an audit of M-PESA to
    verify that it cannot be used by money launderers and pyramid schemes (indeed,
    a false accusation had been made that M-PESA was nothing more a Ponzi scheme).
    This move was very unpopular amongst ordinary Kenyans, who appeared to view it
    as an attempt by banks – who, some felt, were never interested in providing services
    to them – to shut M-PESA down. Consult Hyperion were asked to contribute to the
    response by carrying out a new audit of security countermeasures and procedures,
    and were again able to certify that M-PESA offers bank-grade.

