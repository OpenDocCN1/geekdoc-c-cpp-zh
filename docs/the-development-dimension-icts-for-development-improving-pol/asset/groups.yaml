    # 6. ICTs AND THE ENVIRONMENT IN DEVELOPING COUNTRIES: OPPORTUNITIES AND DEVELOPMENTS
    – 163


    Examples of adaptation include preparing risk assessments, protecting ecosystems,
    improving agricultural methods, managing water resources, instituting better building
    designs and building settlements in safe zones, developing early warning systems,
    improving insurance coverage and developing social safety nets (ISDR 2008; ITU
    2008).


    # Climate change adaptation


    Monitoring and providing early warning of climate change induced events such as
    storm and tsunami, drought and flood, famine and disease play a vital role. Examples
    at the international level include:


    +   The Famine Early Warning Systems Network (FEWS NET), a USAID-funded network
    that brings together international, regional and national partners to provide
    early warning and vulnerability information on emerging and evolving food security
    issues. FEWS NET professionals in Africa, Central America, Haiti, Afghanistan
    and the United States monitor and analyse climate information for potential impacts
    on livelihoods and markets to identify potential threats to food security. Once
    identified, FEWS NET uses a set of communications and decision support technologies
    to help decision makers mitigate food insecurity. These include monthly food security
    updates for 25 countries, regular food security outlooks and alerts, as well as
    briefings and support to contingency and response planning efforts.¹⁰


    +   Distant Early Warning System for Tsunami (DEWS) is a tsunami warning system
    for the Indian Ocean which aims to create a new generation of interoperable tsunami
    early warning systems based on an open sensor platform which integrates sensor
    systems for the rapid detection of earthquakes, for the monitoring of sea level,
    ocean floor events, and ground displacements. Tsunami warnings can be sent via
    SMS to mobile phones, by facsimile or as a television overlay.¹¹


    +   Prevention uses information tools to provide a common platform for the disaster
    risk reduction (DRR) community to find and share information, exchange experience,
    connect and collaborate.¹²


    Another area in which ICTs support adaptation is climate and impact models, which
    can be used to inform practitioners and decision makers in planning as well as
    predicting the impacts of climate change on agriculture (e.g. with crop models).
    SEI (2008) cite a number of examples, including:'
