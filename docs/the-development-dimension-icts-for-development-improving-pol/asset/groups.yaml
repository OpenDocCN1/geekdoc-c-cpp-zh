    # India


    The Draft National Policy on ICT in School Education, published by the Ministry
    of Human Resource Development in 2009, stresses the significance of achieving
    general ICT competency for all school levels, appropriate curriculum for ICTs
    as a subject at the higher secondary level, and the need for ICT-enabled teaching
    and learning practices. The policy outlines requirements of different levels of
    ICT literacy and competency from basic to advanced, and provides an implementation
    strategy to ensure these levels are achieved. It also articulates the need to
    develop modular courses in different areas of ICTs at the higher secondary level.


    Given India''s linguistic, cultural and social diversity, the policy recognises
    the significance of good quality, locally relevant content in multiple languages.
    It spells out a strategy to develop content in a phased manner by focusing first
    on the more difficult to teach and understand concepts and making quality digital
    resources available for all classes and disciplines, moving finally towards a
    model of highly interactive digital resources such as virtual laboratories. National
    and state level web-based digital repositories are envisaged that will host content
    for students and teachers in a range of formats from question banks to activities,
    notes, etc. Appropriate licensing norms to facilitate open and free access to
    resources will be highlighted, with knowledge of issues such as copyright and
    restrictions on content reused by all users. Further, educational standards and
    instructional design models will be widely distributed to ensure quality in the
    digital content being produced by different agencies.


    School libraries will be revamped to function as gateways to quality digital content,
    thereby playing a crucial role in cataluing of digital resources in all classes.
    Libraries will have adequate Internet connectivity and move towards digital cataluing
    and automation.


    Content development is entrusted to the public and private domain. Agencies such
    as CIET, NCERT, Indira Gandhi National Open University (IGNOU), State Institutes
    of Educational Technology (SIETs) and Doordarshan (National Broadcasting) have
    dedicated resources for developing and disseminating digital content at various
    levels for a variety of objectives from informal educational messages to structured
    course modules. Private companies such as EduComp, Evernon, NIIT, Aptech, IL &
    FS, Intel and Zee Interactive systems are working extensively to develop and deliver
    quality digital content. These'
