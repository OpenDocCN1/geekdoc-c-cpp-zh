    if not solutions, at least a shape or framework for moving forward. It then charts
    the logic and chronology of applying ICTs to developing countries.


    ¹ Prof. Richard Heeks is Director of the Centre for Development Informatics, University
    of Manchester, UK. www.manchester.ac.uk/cdi.'
