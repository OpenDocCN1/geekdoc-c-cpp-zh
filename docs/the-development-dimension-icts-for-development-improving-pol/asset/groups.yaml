    the foundations in place, and proof of concept such as piloting largely supply-based
    uptake, ICT4D 2.0 can turn part of its attention elsewhere.


    It can thinking solely about pilots, and can instead think more about sustainability,
    scalability and impact. It can stop thinking from a mono-disciplinary perspective,
    and can instead think more from a tri-disciplinary perspective that combines computer
    science, information systems and development studies.


