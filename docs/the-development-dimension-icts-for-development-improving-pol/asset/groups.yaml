    1  PISA是一项针对15岁青少年知识和技能的三年一次调查。最新评估显示了全球57个国家约40万名学生的2006年结果。韩国的得分高于OECD平均水平，在阅读方面获得OECD地区最高分，在数学方面排名前二，科学得分也是最高之一。更有意义的是韩国自2000年来的表现提升，那时期是学校和家庭宽带扩张时期。


