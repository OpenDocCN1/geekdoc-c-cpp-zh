    # 2. WHERE NEXT FOR ICTs AND INTERNATIONAL DEVELOPMENT? – 47


    # ICT4D 2.0''s new innovation models


    Underlying the discussion in Box 2.7 are two different views about technology
    and development – or, at least, two extremes on a continuum. At one end we have
    the “passive diffusion” view. Taking the lead from mobile telephony’s rapid spread,
    this says that IF ICT have a developmental value for the poor, then a combination
    of private firms’ search for profit plus the poor’s search for value will make
    it happen. Any attempt to intervene from outside is foolish and wasteful: a force-feeding
    of the inappropriate that will only lead to messy reguration. Conversely, the
    “active innovation” perspective feels the market will not deliver – or will deliver
    too slowly to the poor. Hence, intervention is required in the form of new innovations
    that will help to meet goals.


    This chapter does not compare views in any detail. Certainly active innovation
    took a knock during ICT4D 1.0. There is a sense that international donor agencies
    subsidised the unsustainable, and were footing around the supply-development telecentre
    point, oblivious to the market-driven mobile tsunami around. On the other hand,
    non-market interventions have been the root of many subsequently marketised technologies.
    From the first computers to the origins of the Internet to the competitors favoured
    by the OLPC XO, active innovation has been the foundation for passive diffusion.
    Finally, the two perspectives converge when private firms take the bottom of the
    pyramid notion to heart and start designing products specifically with poor consumers
    in mind (often changing the terminology as they do from “developing countries”
    to “emerging markets”).


    What we can conclude is that some element of active innovation is likely to remain
    in the ICT4D field. In that case, two key questions arise:


    First, what to innovate. As the OLPC experience demonstrates, large-scale hardware
    and operating system innovations specifically targeted at the bottom of the pyramid
    are risky ventures, for the very brave or the foolish. In a moderated way this
    envis applies to the large private sector players. Instead, most ICT4D 2.0 innovation
    looks to occur on a smaller scale either in adapting or applying existing technologies.
    Another way, innovation appears more feasible (though perhaps more localised)
    as one moves up the chain from new telecoms/power infrastructure to new hardware
    to software to new data content to new business models and processes (Figure 2.2).


    Second, how to innovate. In terms of the innovation process, we can induce three
    different modes, here labelled laboratory (pro-poor), collaborative (para-poor),
    and grassroots (per-poor).'
