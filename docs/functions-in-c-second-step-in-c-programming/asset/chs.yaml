- "# C++ 函数：C++ 编程进阶之路\n\n\n\n![](img/image_rsrc3KH.jpg)\n\n\n\n\n\n\n\n\n\n\n# readme.txt\n\
  \n大家好。\n\n\n\n\n如果你正在阅读这本书，说明你正准备通过我们的系列丛成为 C++ 程序员的道路，或者你只是想了解更多关于 C++ 函数的知识。无论何种情况，非常欢迎与我们一起学习。就像该系列的第一本书（侧于数据类型、变量、运算符和控制结构）一样，你将在书中找到大量带有解释的编程任务，以及书末的附录。\n\
