    # Beginning the Whereami Application


    To help you understand delegation, you''re going to write an application called
    Whereami that it over and over again. This application will display a map and
    allow the user to scroll, zoom, and tag the device''s current location with a
    pin and a title. This exercise spans two chapters. At the end of this chapter,
    the application won''t look like much, but the final product – and the clearer
    understanding of delegation – will be worth it. Create a Window-Based Application
    and name it Whereami.


    # Using frameworks


    Open WhereamiAppDelegate.h and find the following line of code at the top. (You
    may have noticed it at the top of your other application delegate files, too.)


    ```

    #import <UIKit/UIKit.h>

    ```


    This translates to "From the UIKit framework, import the UIKit.h header." A framework
    is a collection of related classes, and Cocoa Touch is a set of frameworks. One
    of the benefits of Cocoa Touch being organized into frameworks is that you only
    need to import what your application needs. The UIKit framework is in every iPhone
    application because it contains all of the user interface classes like UIButton
    and UILabel. Whereami will also need the Core Location framework. It won''t, for
    example, need the Media Player framework.


    The UIKit framework is added automatically by Xcode, but to use the code in the
    Core Location framework, you need to add it to your project. Select Edit Active
    Target from the Project menu. In Target Info window that appears, select the General
    tab. At the bottom of the window is a list of Linked Libraries. Click the + button
    on the bottom-left corner of the window. A sheet will drop down from this listing
    all of the available frameworks for iPhone OS. Choose CoreLocation.framework from
    that list and click the Add button as shown in Figure 4.3. This application can
    now use the classes and functions available in the Core Location framework.'
