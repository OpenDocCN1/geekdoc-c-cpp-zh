  md: '# Chapter 2. Objective-C


    One message you can send an NSMutableArray instance is addObject:[arrayInstance
    addObject:anotherObject];


    (How do you know you can send this message? addObject: is a method of NSMutableArray.
    Sending the addObject: message to an instance of NSMutableArray will trigger the
    addObject: method.)


    The addObject: message is an example of a message with one argument. Objective-C
    methods can take a number of arguments or not at all. The message init, for instance,
    has no arguments. On the other hand, you can also send the message replaceObjectsInRange:withObjectsFromArray:range:,
    which takes three arguments (Figure 2.2).


    # Figure 2.2. Anatomy of a message


    ![](img/f6c6f47463c37c27b423c6082ee341bb_40_0.png)


    Each argument has a label, and each label ends with a colon. One thing that confuses
    Objective-C beginners is that the name of the message is all of the labels in
    a selector. For example, addObject: has one label (addObject:) for its argument.
    The message replaceObjectsInRange:withObjectsFromArray:range has three arguments,
    so it has three labels.


    In C++ or Java, this method would look like this:


    ```

    arrayInstance.replaceObjectsInRangeWithObjectsFromArrayRange(aRange, anotherArray,
    anotherRange);

    ```


    In these languages, it isn''t completely obvious what the arguments sent to this
    function are. In Objective-C, however, each argument is paired with the appropriate
    label:


    ```

    [arrayInstance replaceObjectsInRange:aRange withObjectsFromArray:anotherArray
    range:anotherRange];

    ```


