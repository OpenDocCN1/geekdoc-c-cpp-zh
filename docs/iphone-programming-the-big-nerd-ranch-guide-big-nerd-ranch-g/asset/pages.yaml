    When an object wants to send an optional delegate message to its delegate, it
    first sends the message respondsToSelector to see if the delegate implements the
    optional method. (If the response fails, the object won''t send the corresponding
    message.) For example, when text is added to an instance of UITextView, it informs
    its delegate through an optional delegate method. If you were writing the UITextView
    class, the implementation of UITextView would


