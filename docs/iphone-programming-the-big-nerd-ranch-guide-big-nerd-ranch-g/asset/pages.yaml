- img_proc: true
  md: '# Figure 27.2. Relationships


    ![](img/f6c6f47463c37c27b423c6082ee341bb_432_0.png)


    Objects that hold data are instances of NSManagedObject. You can subclass NSManagedObject
    to add custom behavior to your managed object. For example, consider the Person
    objects in Figure 27.1 . You might create a subclass of NSManagedObject called
    Person so that you could give it a fullName


    Core Data also needs to know when these objects are edited so that the changes
    can be written to the SQLite database. An instance of the class NSManagedContext
    monitors the managed objects to provide this information. You fetch managed objects
    into a managed object context. When you want to save the changes, you ask the
    context to save them for you.'
