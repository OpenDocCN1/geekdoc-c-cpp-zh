    UINavigationItem, UIBarButtonItem is not a subclass of UIView but supplies the
    content that a UINavigationBar needs to draw. Consider the UINavigationItem and
    its UIBarItems to be containers for strings, images, and other content. A UINavigationBar
    knows how to look in those containers and draw the content that''s there.


    The third customizable area of a UINavigationItem is its titleView. You have a
    choice with each navigation item: use a basic string as the title (as you''ll
    do in this chapter) or have any subclass of UIView sit in the center of the navigation
    item. You cannot have both. If it suits the context of a specific view controller
