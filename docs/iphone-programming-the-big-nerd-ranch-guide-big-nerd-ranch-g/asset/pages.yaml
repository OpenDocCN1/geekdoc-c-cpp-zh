- img_proc: true
  md: '# High-Frequency Applications


    Applications that need to squeeze every little out of the accelerometer should
    set the updateInterval between 1/70 and 1/100 seconds (the smallest possible interval).
    An application that detects shakes is updating at a high frequency.


    Once you have chosen the right update interval, you need to choose what type of
    filter is best for your application. Typically, you''ll choose a low-pass filter
    or a high-pass filter.


    Using a low-pass filter, as you did in the exercise, isolates the gravity component
    of the acceleration data and reduces the effect of sudden changes in the device''s
    orientation. In most situations, it gives you just the orientation of the device.
    A basic low-pass filter equation looks like this:


    ```

    float filteringFactor = 0.1;

    lowPassed = newValue * filteringFactor + lowPassed * (1.0 - filteringFactor);

    ```


    lowPassed is the output. Notice that the previous output is used the next time
    the equation is solved and that the new value produced by the accelerometer is
    blended with all of the previous values. The output of a low-pass filter is essentially
    a weighted average of previous inputs. Therefore, sudden movements will not affect
    the output as much as they would with unfiltered data.


    On the other hand, sometimes you want to ignore the orientation (which is usually
    constant) and focus on sudden changes as a shake. For this, you would use a high-pass
    filter. Now that you have mastered the low-pass filter, the high-pass signal is
    what''s left if you subtract out the low-pass signal:


    ```

    float filteringFactor = 0.1;

    ```'
