  md: '# Chapter 3. Memory Management


    Retain counts can still go wrong in the two classic ways: leaks and premature
    deallocation. First, you could give the grocery list to your friend who retains
    it, but you don''t release it. Your friend finishes the finishing and releases
    the list. You have forgotten where it is, but because you never released it, it
    still exists. Nobody has this grocery list anymore, but it still exists because
    retain count is greater than 0. This is a leak.


    Now think of the grocery list as an NSString. You have a pointer to this NSString
    in the method where you created it. If you leave the scope of the method without
    releasing the NSString, you''ll lose the pointer along with it release any other
    object releases the NSString, it will never deallocated.


    Consider the other way this process can go wrong - premature deallocation. You
    create a grocery list and give it to a friend who doesn''t retain it. When you
    release it (thinking it was safe with your friend), it is deallocated because
    it was ones only owner. When your friend attempts to use the list, he can''t find
    it because it doesn''t exist anymore.


    When an object attempts to access another object that no longer exists, your application
    accesses bad memory, starts to fail, and eventually (although sooner is better
    than later for debugging) crashes.


    If an object retains another object, that other object is guaranteed to exist.
    Correct use of retain counts avoids premature deallocation. Now let''s look closely
    at memory leaks.


