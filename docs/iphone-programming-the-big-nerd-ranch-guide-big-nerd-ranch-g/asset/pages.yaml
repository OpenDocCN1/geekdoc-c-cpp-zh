    Documents/


    This directory is where you write data that the application generates during runtime
    that you want to persist between runs of the application. It is backed up when
    the device is synchronized with iTunes. If something goes wrong with the device,
    files in this directory can be restored from iTunes. For example, if you were
    writing a game, the saved game files would be stored here.'
