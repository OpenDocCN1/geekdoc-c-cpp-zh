    \    - (void)deleteImageForKey:(NSString*)s;\n}\nend\n```\n\nNSDictionary\n\n\
    The dictionary is an instance of NSMutableDictionary, the mutable subclass\nof\
    \ NSDictionary. An NSDictionary is a collection object and similar to an\nNSArray.\
    \ However, an NSArray is an ordered list of pointers to objects that can\nbe accessed\
    \ by an index. When you have an array, you can ask it for the object at\nt nth\
    \ index:\n\n```\n// Put some object at the end of an array\n[someArray addObject:someObject];\n\
    // Get that some object out\nsomeObject = [someArray objectAtIndex:[someArray\
    \ count] - 1];\n```\n\nOn the other hand, dictionary objects are not ordered within\
    \ the collection. So\ninstead of accessing entries with an index, you use a key.\
    \ The key is usually an\ninstance of NSString."
