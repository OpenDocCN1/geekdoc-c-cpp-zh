    # Internationalization using NSLocale


    In this chapter, you''re going to localize the position detail of Homepwner. In
    this first section, you will use the class NSLocale to internationalize the currency
    symbol for a value of a possession and the format of the date on which it was
    created.


    NSLocale knows how different regions display symbols, dates, and decimals whether
    they use the metric system. NSLocale represents one region''s settings for variables.
    In the Settings application, the user can choose a region like United States or
    United Kingdom.(Why does Apple use “region” instead of “country”? Some countries
    have more than one region with different settings.) Scroll through the options
    in Region to format your cell.


    When you send the message currentLocale to NSLocale, the instance of NSLocale
    represents the user''s region is returned. Once you have a pointer to that instance
    of NSLocale, you can ask it questions like, “What''s the currency symbol for this
