    Last, make sure that you can fully reconstruct a controller’s view hierarchy with
    loadView and viewDidLoad methods. These two messages will be sent to a view controller
    when it needs to reload its view after a low-memory warning occurs. Some view
    controllers may dynamically change their interface during runtime. It is important
    that you keep track of those changes so that you can replicate them if a view
    controller receives a memory warning.


