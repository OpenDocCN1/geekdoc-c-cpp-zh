  md: '# Figure 28.2. Upgrading to a Universal Application 2


    ![](img/f6c6f47463c37c27b423c6082ee341bb_472_0.png)


    Two noticeable things will happen after upgrading the target: a Resources-iPad
    group will appear in the project window and the Whereami-Info.plist will be updated.
    Open Whereami-Info.plist (found in the Resources group of the project window).
    A new key has been added to the property list: Main nib file base name (iPad),
    and it has been set to MainWindow-iPad. Now, when this application is executed,
    the operating system will determine which device it is running on and choose the
    correct NIB file to load.


    In addition to these two changes, the build settings for your project will have
    changed. These changes are taken care of by Apple; you shouldn''t try and set
    them manually.


    Whereas nowadays technically runs natively on the iPad, so build and run the application.
    Oh, gross! The interface is a disaster. Let''s fix that.


    # Re-designing Whereami’s interface


    Check out the Resources-iPad group in the project window. Inside this group is
    a MainWindow-iPad.x file, matching the name of the value for the Main nib file
    base name (iPad) key in the info property list. This is the NIB file that will
    get loaded whenWhereami is launched on an iPad. Open this file in Interface Builder.'
