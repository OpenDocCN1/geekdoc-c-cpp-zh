    # viewWillAppear


    UIViewController has several methods that get called at certain times:


    +   - viewWillAppear: when its view is about to be added to the window


    +   - viewDidAppear: when its view has been added to the window


    +   - viewWillDisappear: when its view is about to be dismissed, or otherwise
    hidden from view


    +   - viewDidDisappear: when its view has been dismissed, covered, or otherwise
    hidden from view


    These methods are useful because a view controller is only created once but usually
    gets displayed (and dismissed or hidden) several times. You often need a way to
    override the default behavior at these times in the life of view controller. For
    example, you may want to do some of initialization each time the view controller
    is moved on screen. Here you would use viewWillAppear or viewDidAppear:. Similarly,
    if you had a large data structure that you only need while the view controller
    is being displayed, you might want to do some clean-up each time the view controller
    is moved off screen. Then you would use viewWillDisappear or viewDidDisappear.


    Note that these methods, as defined in UIViewController, do nothing. They are
    there so that your subclasses can override them.


    +   - (void)viewWillAppear:(BOOL)animated;

    - (void)viewDidAppear:(BOOL)animated;'
