  md: '# Chapter 1. A Simple iPhone Application


    # Chapter 1. A Simple iPhone Application


    In this chapter, you are going to write your first iPhone application. You probably
    won''t understand everything that you are doing, and you may feel stupid just
    going through the motions. But going through the motions is enough for now. Mimicry
    is a powerful form of learning; it is how you learned to speak, and it is how
    you will start to do iPhone programming. As you become more capable, you can experiment
    and challenge yourself to do creative things on the platform. For now, just do
    what we show you. The details will be explained in later chapters.


    When you are writing an iPhone application, you must answer two basic questions:


    +   - How do I get my objects created and configured properly? (Example: "I want
    a button here entitled Show Estimate."

    - How do I deal with user interaction? (Example: "When the user presses the button,
    I want this piece of code to be executed.")


    Most of this book is dedicated to answering these questions.


    When an iPhone application starts, it puts a window on the screen. You can think
    of the window as the canvas on which everything else appears: buttons, labels,
    etc. Anything that can appear on the window is a view.


    The iPhone SDK is an object-oriented library, and the window and views are represented
    by objects. The window is an instance of the class UIWindow. Each view is an instance
    of one of several subclasses of UIView. For example, a button is an instance of
    UIButton, which inherits from UIView.


    Views can be placed on a window in two different ways:


    +   - create views and controls programmatically and add them to the UIWindow

    - use Interface Builder to visually lay out views


    In this chapter, you will use Interface Builder to visually lay out the views
    and build the user interface for your first iPhone application, Quiz (Figure 1.1).'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Chapter 1. A Simple iPhone Application


    # Figure 1.1. Your first application


    ![](img/f6c6f47463c37c27b423c6082ee341bb_13_0.png)


    # Creating an Xcode Project


    Open Xcode and select New Project... from the File menu. A window will appear
    giving you several application templates to choose from. Create a barebones Cocoa
    Touch application by selecting the Window-Based Application icon (Figure 1.2).
    Click theChoose... button. A sheet will drop down and ask you to name this new
    project. Save it as “Quiz."'
