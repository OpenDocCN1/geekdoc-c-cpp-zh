  md: '# Figure 27.7. Properties of Asset entity


    ![](img/f6c6f47463c37c27b423c6082ee341bb_436_0.png)


    You must select a delete rule for the **inventories** relationship. The delete
    rule is the answer to the question "What happens to the **Inventory** objects
    associated with an **asset** when that **asset** is deleted?” There are four possible
    answers:


    +   - Cascade


    When an **asset** is deleted, the **inventories** for that **asset** are also
    deleted automatically.


    +   - Nullify


    When an **asset** is deleted, the **inventories** for that **asset** have their
    **asset** pointer set to nil.


    +   - Deny


    You can''t delete an **asset** if **inventories** for that **asset** exist.'
