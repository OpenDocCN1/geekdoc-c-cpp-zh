    # For the More Curious: Compiler and Linker Errors


    Building an application in Xcode is a multi-step process. Two of these steps are
    compiling and linking, and each comes with its own type of error.


    One of the first building steps, compiling, takes your Objective-C code and turns
    it into the binary code a computer understands. Each implementation file (suffixed
    with .m) is turned into an object file that contains binary code.


    If an error is found in your code during this phase, the compile fails. (And if
    an implementation file fails to compile, the corresponding object file is not
    created.) An error during this phase is called a compile-time error or syntax
    error. These errors mean that the compiler cannot understand your source code
    – usually because of little things like misplaced semicolons, unbalanced brackets
    ([]) or braces ({}), spelling or capitalization errors.


    A syntax error is also generated if you declare a variable of a type that the
    compiler doesn''t recognize. For each Objective-C class, there is a header file
    that declares it, and importing the header file tells the compiler about that
    class. To see an example of a syntax error, comment out the following line in
    WhereamiDelegate.h:


    ```

    //#import <CoreLocation/CoreLocation.h>

    ```


    Build your application again. It will fail, and the Build Results window will
    show you several errors (Figure 4.5).'
