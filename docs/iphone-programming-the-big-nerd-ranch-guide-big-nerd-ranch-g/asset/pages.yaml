  md: '# Figure 3.2. Allocating an object

    Owner creates instance of Dog... canine = [[Dog alloc] init];


    ![](img/f6c6f47463c37c27b423c6082ee341bb_70_0.png)


    Of course, you allocate memory from the heap, you need a way to return that memory
