    tmp/ directory


    This directory is where you temporarily write data that you will use during an
    application''s runtime. You should remove files from this directory when done
    with them, but the operating system may purge them while your application is not
    running. It does not get backed up when the device is synchronized with iTunes.
    The convenience function for getting the path to the tmp directory in the application
    sandbox is:


