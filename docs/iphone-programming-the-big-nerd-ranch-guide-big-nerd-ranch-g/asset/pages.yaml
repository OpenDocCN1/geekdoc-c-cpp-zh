- img_proc: true
  md: "Save MainWindow-iPad.xib and exit Interface Builder. Yes, it really was that\
    \ simple. Build and run the application to see your updated interface.\n\nWant\
    \ to make sure your iPhone interface still looks good? Select Set Active Executable\
    \ from the Project menu and choose the iPhone option from the sub-menu that appears\
    \ next to it. Build and run the application to see the original iPhone application.\n\
    \n# More considerations: universal view controllers\n\nThe previous section outlined\
    \ the basic steps you must take to prepare a universal application. However, more\
    \ complicated applications will require more changes. If your application has\
    \ view controllers, you must load the correct code for the device your application\
    \ is running on.\n\nIf your view controller is loading its view from a NIB file,\
    \ you must create another NIB file that has a view configured for the larger window\
    \ size. Stick with Apple’s convention and suffix your iPad NIB files with -iPad.\
    \ (MainWindow.xib and MainWindow-iPad.xib, for example.)\n\nAlso, within your\
    \ view controller's init method, you will need to perform a run-time check to\
    \ see which NIB file to load. Here is the point where you get that we taught you\
    \ to override the designated initializer for UIViewControllerinit and determine\
    \ the NIB file to load from that method. A view controller in a universal application\
    \ will take advantage of the UI_USER_INTERFACE_IDIOM() function to determine which\
    \ NIB file to load in its init method. Here is an example:\n\n```\n@implementation\
    \ MyUniversalViewController\n-(id)init {\n NSString *nibFileToLoad = @\"MyUniversalViewController\"\
    ;n // If the device is an iPad, suffix the nibFileToLoad with \"-iPad\"\nif(UI_USER_INTERFACE_IDIOM()\
    \ == UIUserInterfaceIdiomPad)\\ nibFileToLoad = [nibFileToLoad stringByByAppending:@\"\
    -iPad\"];\n\n // Extra initialization goes here\n\n return [super initWithWithNibName:nibFileToLoad\
    \ bundle:nil];\n}\n@end\n```"
