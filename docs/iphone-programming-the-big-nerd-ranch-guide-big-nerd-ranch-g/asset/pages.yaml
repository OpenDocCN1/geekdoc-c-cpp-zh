    # UITableView''s Data Source


    The process of providing a UITableView task with rows in Cocoa Touch is different
    from a procedural programming task. In a procedural design, you would tell the
    table view what it should display. In Cocoa Touch, the table view asks another
    object – its datasource – what it should display. Its data source is prepared
    to answer that question; it just needs to know for which row it should provide
    the content.


    As a view object, a UITableView displays rows but doesn''t store the data used
    to populate those. That''s the job of the data source; therefore, ItemsViewController
    needs a way to store possession data. In Chapter 2, you used NSMutableArray to
    store Possession instances and then print them. You''ll do the same thing in this
    exercise, instead of printing to the console, you''ll “print” to a UITableView
    (Figure 10.8).'
