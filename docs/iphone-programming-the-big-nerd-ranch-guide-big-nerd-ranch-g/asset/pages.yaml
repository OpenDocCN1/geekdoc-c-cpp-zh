  md: '# Chapter 19. Controlling Animation With CAAnimation


    In order to spin the timeLabel, you need an animation object that will apply a
    360 degree rotation over time to a layer. So we need to determine four things:


    +   - What type of animation object suits this purpose?


    +   - What key path handles rotation?


    +   - How long should the animation take to complete?


    +   - What values should the animation interpolate over?


    To answer the first question, think about the number of keyframes an animation
    that does a complete revolution needs. It only needs two: an non-rotated value
    and a fully rotated value. The animation will interpolate between these two points;
    therefore, CABasicAnimation can handle this task.


    To determine the key path, we must find the property of CALayer that deals with
    rotation. This property is its transform, the transformation matrix that is applied
    to the layer when it draws. The transform of a layer can rotate, scale, translate,
    and skew its frame. This exercise only calls for rotating the layer, and, fortunately,
    we can isolate the rotation of the transform in a key path (Figure 19.5). Therefore,
    the key path of the basic animation will be transform.rotation.


