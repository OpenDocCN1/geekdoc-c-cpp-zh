    ![](img/f6c6f47463c37c27b423c6082ee341bb_19_0.png)


    Now center the text in the other label.


    # Model-View-Controller


    You will hear iPhone programmers speak of the “Model-View-Controller pattern.”
    What that means is every object you create will be exactly one of the following:
    a model object, a view object, or a controller object.


    View objects are visible to the user; the button, the label, and the window are
    all view objects. The views are often standard UIView subclasses (UIButton, UISlider),
    but you will sometimes write custom view classes. These typically have names like
    DangerMeterView or IncomeGraphView.


    Model objects hold data and should know nothing about the user interface. In this
    application, the model objects will be two arrays of strings: the **questions**
    array and the **answers** array. Figure 1.7 displays the object diagram of the
    Quiz app’s model objects.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 1. A Simple iPhone Application


    # Figure 1.7. Diagram of model objects in Quiz


    ![](img/f6c6f47463c37c27b423c6082ee341bb_20_0.png)


    Model objects typically use standard collection classes (NSArray, NSDictionary,
    NSSet) and standard value types (NSString, NSDate, NSNumber). But there can be
    custom classes, which typically have names that sound like data-bearing objects
    like InsurancePolicy and PlayerHistory.


    Controller objects keep the view and model objects in sync, control the “flow”
    of the application, and save the model objects out to the filesystem. Controllers
    are the least reusable classes that you will write, and they tend to have names
    like ScheduleViewController and ScoreViewController. When you create a new iPhone
    project from a template, as you did at the beginning of this chapter, the template
    will automatically give you a controller called BlahAppDelegate, where Blah is
    the name of your application.


    The controller for your application is the instance of QuizAppDelegate. One of
    the application’s buttons will trigger a method in that object. The instance of
    QuizAppDelegate will have pointers to the questions and answers arrays. It will
    use those model objects to update the button label. These interactions are laid
    out in the object diagram for Quiz (Figure 1.8).'
  merge: -1
  pgno: 20
- img_proc: true
