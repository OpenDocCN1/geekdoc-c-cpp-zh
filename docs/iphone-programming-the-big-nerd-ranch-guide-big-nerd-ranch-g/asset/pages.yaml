    Some classes in the iPhone SDK are borrowed from Mac OS and do not declare a delegate
    protocol if they have a delegate property. (Usually these classes were prefixed
    with NS and are not part of the Foundation framework.) These classes were written
    before Objective-C 2.0 when there was no @optional directive. Back then, every
