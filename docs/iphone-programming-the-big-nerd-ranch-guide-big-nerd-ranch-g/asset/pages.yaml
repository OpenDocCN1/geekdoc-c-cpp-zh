  md: '# Chapter 17. Multi-Touch, UIResponder, and Using Instruments


    time dispatching messages than actually doing the work in that are triggered and
    your application isn''t performing well, there is a problem that needs solving.


    As a real world example, some Objective-C developers might be tempted to create
    classes for things like vectors, points, and rectangles for drawing. These classes
    would likely have methods to add, subtract, or multiply instances in addition
    to accessor methods to get and set instance variables. When these classes are
    used, the drawing code has to send a lot of messages to do simple things, like
    creating two vectors and adding them together. These messages add excessive overhead
    to the simple operation that is being performed. Therefore, the better alternative
    is to create data types like these structures and access their memory directly.
    (This is why CGRect and CGPoint are structures and not Objective-C classes.)


    This should give you a good start with the Instruments application. The more you
    play with it, the more adept at using you will become. However, there is one final
    word of warning before you invest a significant amount of your development time
    using Instruments: if there is no performance problem, don''t fret over every
    little row in Instruments. It is a tool for finding problems, not for creating
    them. Write clean code that works first; then, if there is a problem, you can
    find and fix it with the help ofinstruments.


