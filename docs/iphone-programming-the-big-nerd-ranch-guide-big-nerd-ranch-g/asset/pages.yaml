    # Reusing UITableViewCells


    The iPhone has a limited amount of memory. If we were displaying a list with thousands
    of entries in UITableViewCell, we would have thousands of instances of UITableViewCellCell.
    And the iPhone would sputter and die. In its dying breath, it would say “You only
    needed cells to fill the screen... arrrrghhh!” It would be right.


    UITableViewCells prevents senseless iPhone death. A UITableView retains UITableViewCellCell
    returned to it the method table:cellForRowAtIndexPath: (which is why you can autorelease
    it in tableView:cellForRowAtIndexPath). When the user scrolls the table, some
    cells are moved offscreen and put into a pool of cells available for reuse. Then,
    instead of creating a new cell for every request, the data source can check the
    pool. If there is an unused cell, the data source configures it with new data
    and returns it to the table view.'
