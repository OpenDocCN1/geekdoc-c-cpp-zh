  md: '# Chapter 1. A Simple iPhone Application


    In Figure 1.4, find the window with the title bar that reads MainWindow.x. We
    call this window the "doc window," and it represents the XIB file. The doc window
    contains four objects:


    # File''s Owner


    An instance of UIApplication. The event queue for your application is managed
    by this object.


    # First Responder


    This object doesn''t have much of a use on the iPhone right now; it is more of
    a relic from Desktop Cocoa. You can ignore it.


    # QuizAppDelegate


    An instance of QuizAppDelegate, a subclass of NSObject that was created by Xcode
    specifically for this project. You will be editing the source code for this class.


    # Window


    An instance of UIWindow that represents this application''s only window. (All
    iPhone applications have one window.)


    The Library and the Inspector are two tools you use all the time, so leave those
    windows open. (If these windows are not visible, select them from the Tools menu.)
    You drag objects from the Library to create new instances in your XIB file. You
    use the Inspector to "inspect" and edit the configuration of objects in the XIB
    file. The Inspector has four panels: Attributes, Connections, Size, and Info represented
    by the icons at the top of the frame. You will be using the Attributes and Connections
    panels in this chapter.


    In the doc window, double-click on the UIWindow object to make it appear full-size.
    (Feel free to close and re-open it. Sometimes beginners close the window and fear
    that they have deleted it.)


    From the Library, drag two instances of UILabel onto the window. The labels nearly
    as wide as the window (Figure 1.5). Then, drag two instances of UIButton onto
    the window. You can change the text object displays by double-clicking it. Set
    the text for one button to Show Question and the other to Show Answer.'
  merge: -1
  pgno: 17
- img_proc: true
