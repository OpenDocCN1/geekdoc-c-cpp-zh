  md: '# Chapter 12. UINavigationController


    controller is guaranteed to always be in the stack.


    The UINavigationController is on top of the stack can be accessed by sending the
    message topViewController to the UINavigationController instance. You can also
    get the entire stack as an NSArray by sending the navigation controller message
    viewControllers. The viewControllers array is ordered so that the root view is
    the first entry and the top view is the last entry.


    UINavigationController is actually a subclass of UIScrollView, so it also has
    a view instance. Its view always has at least two subviews: a UINavigationBar
    and the view of the ViewController is on top of the stack (Figure 12.3). The only
    requirements for using a UINavigationController are that you add your view to
    the visible view hierarchy and give it a root controller.


