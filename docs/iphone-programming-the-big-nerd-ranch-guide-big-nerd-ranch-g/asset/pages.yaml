    # Default Images


    When launching an application, the code and resources (like MainWindow.xib need
    to be loaded into memory. This takes time, and in the meantime all the user sees
    is a black screen. The iPhone is intended to create an interface that feels like
    a real object instead of a computer screen, and a delay while loading ruins this
    effect.


    You can fix this problem by using a default image. A default image appears as
    the application is loading, and the name Default.png is reserved for it.


    Typically, the default image is a screen shot of your application''s user interface
    as it appears in its freshly opened state. This gives the user the illusion that
    the application user touches the screen, your application will have seamlessly
    replaced the default image with the actual user interface. (Note that this screen
    shot is not typically a splash screen. A splash screen draws attention to the
    loading delay whereas a dummy image of the actual interface minimizes the user''s
    experience of the delay.)


    Xcode makes the process of creating and using a default image very easy. Open
    the Organizer window and select the Screenshots tab while your application is
    running on your connected device (Figure 1.16).


    # Figure 1.16. Setting Default.png in the Organizer


    ![](img/f6c6f47463c37c27b423c6082ee341bb_35_0.png)'
