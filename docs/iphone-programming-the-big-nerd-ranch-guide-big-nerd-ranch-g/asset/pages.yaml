    with delegate methods.


    In Apple’s developer documentation, each protocol has its own page that lists
    and describes each method. To get to the documentation, go to the Help menu and
    click Developer Documentation. There you can search for the protocol. By convention,
    the name of a delegate delegate is the name of the class doing the delegation
    suffixed with Delegate. For example, to find all of the delegate methods for a
    UITextView, search for UITextViewDelegate. The “UITextViewDelegate Protocol Reference”
    is shown in Figure 4.1.'
