- img_proc: true
  md: '# Chapter 6. Subclassing UIView


    property of a UIView is set to its superview when the view is added to a view
    hierarchy. (When a view is not part of a view hierarchy, superview is nil.)


    Superviews are not retained by their subviews. Why not? Well, imagine what would
    happen if they were. Every time a subview was added to a view (let''s call it
    BigView), BigView would increment its retain count. For example, if BigView had
    six subviews, it would have a retain count of seven – one for each subview and
    one for its superview.


    What would happen if BigView''s superview wanted to get rid of BigView? The superview
    would send BigView the message release. However, BigView would still be retained
    by its subclasses. BigView''s subviews would never be sent the message release.
    BigView, and all of its subviews, would be cut off from the rest of the application
    and exist in their own little cycle of independent objects where no other object
    could reach them.


    We call this problem a retain cycle, and it can arise in parent-child relationship,
    not with view objects. The solution is simple: children should retain their parents.
    In fact, a child should retain its parent''s parent, or its parent''s parent''s
    parent, and so on. When you adhere to this rule, deallocating a parent object
    will appropriately release its children objects. If the parent is the only owner
    of its children, these children objects will be deallocated.


    # For the More Curious: Redrawing Views


    When a UIView instance is sent the message setNeedsDisplay, that view is marked
    for re-display. View subclasses themselves the message setNeedsDisplay when their
    drawable content changes. For example, UITextField will be marked for re-display
    if it is sent the message setext:(It has to redraw if the text it changes, right?)


    When a view is marked for re-display, it is not immediately redrawn; it is simply
    added to a list of views that need to be updated. Why? Because your application
    is actually one giant infinite loop called the run loop. The run loop''s job is
    to check for input (touch, etc.) and then Location updates, data coming in from
    a network interface, and find the appropriate handlers for that event (like an
    action or delegate method for an object). Those handler methods call other methods,
    those methods call more methods. Views are not redrawn until your methods have
    completed and control returns to the run loop in Figure 6.9.'
  merge: -1
