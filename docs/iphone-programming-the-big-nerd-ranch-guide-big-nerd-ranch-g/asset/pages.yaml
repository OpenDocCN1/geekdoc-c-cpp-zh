  md: 'Credentials can have persistence. There are three possibilities:


    +   - When you supply NSURLCredentialPersistenceNone, you are saying to the URL
    loading system, "Forget this credential as soon as you use it."


    +   - When you supply NSURLCredentialPersistenceForSession, you are saying to
    the URL loading system, "Forget this credential when this application terminates.",


    +   - When you supply NSURLCredentialPersistencePermanent, you are saying to the
    URL loading system, "Put this credential in my keychain so that other applications
    can use it."'
