    # Figure 1.10. Setting answerField


    ![](img/f6c6f47463c37c27b423c6082ee341bb_25_0.png)


    Notice that you drag from the object with the pointer and to the object that you
    want pointer to point at.


    # Setting targets and actions


    UIButton is a subclass of UI (which is a subclass of UIView). A control sends
    a message to another object when it is activated. The control needs answers to
    two questions: what''s the action and who''s the target? An action is the name
    of the method that is triggered by a control. The target is the object that receives
    the message.


    In the case of the Show Question button, the button is activated when the user
    touches it. The action touch triggers showQuestion:, and the target is QuizAppDelegate.


    In Interface Builder, you set an object''s target and action by Control-drging
    from the control to its target. At that point, a pop-up menu appears that lets
    you choose an action. Control-drag (or right-drag) from the Show Question button
    to theAppDelegate. Release the mouse button and choose showQuestion: from the
    pop-up menu as shown in Figure 1.11.'
  merge: -1
