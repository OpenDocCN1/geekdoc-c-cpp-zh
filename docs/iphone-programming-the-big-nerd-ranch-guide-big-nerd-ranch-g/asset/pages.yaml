  md: '# Chapter 9. Notification and Rotation


    Objective-C code is all about objects sending messages to other objects. This
    communication usually occurs between two objects – the sender and receiver. However,
    sometimes a bunch of objects are concerned with one object. They all want to know
    when this object does something interesting. But it''s not feasible for that object
    to keep track of every interested object and send everyone a message.


    Instead, an object can post notifications about what it is doing to a centralized
    notification center. Interested objects can register to receive a message when
    a particular notification is posted or when a particular object posts. In this
    chapter, you will learn how to use a notification center to handle these notifications.
    You will also learn about the autorotation behavior of ViewController.


    # Notification Center


    In every application, there is an instance of NSNotificationCenter, which works
    like a smart bulletin board. An object can register as an observer (“Send any
    lost dog’ to me”). When another object posts a notification (“lost my dog.”),
    the notification center forwards the notification to the appropriate registered
    observers.


    These notifications are instances of NSNotification. Every NSNotification object
    has a name and a pointer back to the object that posted it. When you register
    an observer, you can specify a notification name and a posting object that you
    care about.


    Here’s a snippet of code that how you would register for notifications by the
    name LostDog posted by any object:


    ```

    NotificationCenter *nc = [NSNotificationCenter defaultCenter];

    [nc addObserver:self selector:@selector(methodThatShouldBeTriggered:)

    name:@"LostDog"

    object:nil];

    ```


    Note that nil works as a wildcard; in this case, the code requests that this method
    be triggered regardless of who posts the notification.


    The method that is triggered when the notification arrives takes NSNotification'
