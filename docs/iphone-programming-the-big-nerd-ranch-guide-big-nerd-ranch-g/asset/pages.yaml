    Here are more important facts about NSDictionary:


    +   * Whenever you add an object to a dictionary, the dictionary retains it. Whenever
    you remove an object from a dictionary, the dictionary releases it.


    +   * There can be only one object for each key. Therefore, if you add an object
    to a dictionary and an object is already stored with that, the new object is added
    to the dictionary and the previous one is removed.


    +   * If you want to associate multiple objects with one key, you can add them
    to the dictionary as an array.


    +   * NSDictionary is useful when you want to name the entries within a collection.
    In other development environments, this is called a hash table (Figure 13.2).Figure
    13.2. NSDictionary diagram


