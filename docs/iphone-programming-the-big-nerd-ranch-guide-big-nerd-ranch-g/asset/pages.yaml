- img_proc: true
  md: '![](img/f6c6f47463c37c27b423c6082ee341bb_132_0.png)


    When control returns to the run loop, it says, "Well, a bunch of code was just
    executed. I’m going to check if any views need to be redrawn." The run loop prepares
    the necessary drawing contexts and sends the message drawRect: to all of the views
    that have been sent setNeedsDisplay in this iteration of the loop.'
