  md: '# Chapter 19. Controlling Animation With CAAnimation


    However, just like with CAAnimation, you do not create instances of CAPropertyAnimation.
    To create animation objects that modify a property of a layer, use one of the
    two subclasses CAPropertyAnimation: CABasicAnimation or CAKeyframeAnimation. Instances
    of these two classes allow you to specify the actual values that the key path
    will change to over the duration of an animation. Most of the time you spend with
    Core Animation involves these two classes. CABasicAnimation is the simpler version
    of the two. It has two properties: fromValue and toNumber. When a basic animation
    is added to a layer, the property is set to the value in fromValue. As the animation
    progresses, the value of the property is interpolated linearly from fromValue
    toValue as shown in Figure 19.3.


    ```

    // This animation will act on a layer''s opacity property

    CABasicAnimation fader = [CABasicAnimation animationWithKeyPath:@"opacity\];

    // ... will last for 1 second

    [fader setDuration:1.0];

    // ... the layer''s opacity will start at 1.0 at t = 0 and move towards...

    [fader setValue:[NSNumber numberWithFloat:1.0]];

    // ... 0.0 where it finishes at t = 1.0

    [fader setToValue:[NSNumber numberWithFloat:0.0]];

    ```


    Figure 19.3. Interpolating a CABasicAnimation that animates the position of a
    layer


    ![](img/f6c6f47463c37c27b423c6082ee341bb_330_0.png)


    Notice how these properties take NSNumber as an argument. Because animation objects
    need to be able to support different data types (an animation that changes the
    position of a layer would need values that are of type CGPoint, for example),
    the type of these properties is id – any Objective-C object.'
