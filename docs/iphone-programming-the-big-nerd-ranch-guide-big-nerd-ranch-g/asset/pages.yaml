  md: '# Chapter 10. UITableView and UITViewController


    UITableView is a view object, so, according to Model-View-Controller, it knows
    how to draw itself, but it doesn''t handle application logic or data. Thus, when
    using a UITableView, you must consider what helpers are necessary. UITableView
    usually occupies the entire screen, so it needs a UITViewController to handle
    placing on the screen. A UITableView typically needs a delegate so that other
    objects can be informed of events involving the UITableView. The delegate (as
    you guessed it?) conforms to the UITableViewDelegate protocol.


    Additionally, a UITableView always needs a data source. A UITableView will ask
    its data source for the number of rows, the data to be shown in rows, and many
    other tidbits that it makes. Without a data source, a table view would just be
    an empty container. The dataSource for a UITableView can be any type of Objective-C
    object as it conforms to the UITableViewDataSource.


    Meet UITViewController, a class that can fill all three roles: view controller,
    delegate, and data source. A UITViewController is a subclass of UIViewController
    and it handles most of the preparation and presentation of a UITableView. UITViewController''s
    view is always an instance of UITableView. The delegate and dataSource instance
    variables of the UITableView are automatically set to point at its UITViewController
    (Figure 10.3).


    ![](img/f6c6f47463c37c27b423c6082ee341bb_179_0.png)


    # Subclassing UITViewController


    Now you''re going to write a subclass of UITViewController for Homeowner. To create
    a UITViewController subclass, select New File... from the File menu and select
    UITViewController subclass from iPhone OS''s Cocoa Touch'
