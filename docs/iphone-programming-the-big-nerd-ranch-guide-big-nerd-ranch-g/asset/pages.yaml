  md: '# # Chapter 28. Preparing for the iPad


    After revolutionizing personal computing and the mobile device, Apple has taken
    its game to tablet computing with the introduction of the iPad. Forunately for
    you, the iPad runs iPhone OS. Writing an iPad application is nearly identical
    to writing an iPhone application – you will use the same classes and design patterns.
    However, there are a few minor differences that you should be aware of. This chapter
    will help you prepare for those differences.


    Throughout this chapter, we will refer to the iPad, iPhone, and iPhone OS. To
    clarify those terms: iPhone OS is the operating system that runs on the iPad,
    iPhone, and iPod touch; iPhone refers to both the iPhone and the iPod touch devices.


    # ## Universal Applications


    When writing an application for iPhone OS, you can create two separate applications
    for the two devices (the iPad and the iPhone) or a single universal application.
    While you have the option of creating two applications and submitting them to
    the App Store independently, Apple recommends creating a universal application.
    A universal application will run on both the iPhone and iPad and will be a single
    entry on the App Store, but it takes a bit more work to get it to run cleanly.


    # ## Porting existing projects to the iPad


    An application built for the iPhone can run on the iPad without any changes. However,
    it will run in an iPhone-sized window. If you wish for users to experience your
    application in all its glory on the iPad or take advantage of iPad-only features,
    you will need to upgrade your application to support the iPad. In this chapter,
    you will create a universal Whereami application. Open the Whereami.xcodeproj
    project (Remember, we changed the name of the application to Whereami, but the
    project is still named Whereami.xcodeproj.


    In Whereami''s project window, locate the Whereami target in the Target group.
    Right- or Control-click the Whereami target and select Upgrade Current Target
    for iPad from the contextual menu that appears. (Figure 28.1). You will be prompted
    with a sheet that asks if you want a universal application or device-specific
    applications. Choose One Universal application and hit OK (Figure 28.2).'
