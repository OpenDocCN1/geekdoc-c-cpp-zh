  md: '# Chapter 8. The Accelerometer


    # Setting Up the Accelerometer


    To receive accelerometer data, your application needs to give the single instance
    of UIAccelerometer an updateInterval and a delegate. The delegate needs to implement
    the method accelerometer:didAccelerate:. This method reports changes in the accelerometer
    data every updateInterval seconds in the form of UIAcceleration object.


    Open your HypnoTime project. Before you add any code, you need to decide which
    object will be the UIAccelerometer delegate. There are two options:


    +   - Make the HypnosisView the delegate. It will handle changing the center of
    drawing internally.


    +   - Make the HypnosisViewController the delegate. In this case, you will also
    need to set a "center" property for view when the orientation of the device changes.


    If the HypnosisView is the accelerometer delegate, it becomes a self-contained
    object, however, there can only be one accelerometer delegate. If other objects
    need input from the accelerometer, HypnosisView, a view object, can''t forward
    that information on those objects – it is not a controller. Therefore, the more
    stylish option is to let the controller object, HypnosisViewController, be the
    delegate and receive the accelerometer updates as shown in Figure 8.2.HypnosisViewController
    can easily inform the HypnosisView of a change in orientation, and it can inform
    other objects if necessary.


    # Figure 8.2. Object diagram for HypnoTime


