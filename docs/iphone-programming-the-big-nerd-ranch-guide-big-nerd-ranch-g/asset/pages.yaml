  md: '# New Stuff


    iPad applications have a few more classes to work with than their itty-bitty predecessors.
    As of this writing, these classes are only available on the iPad. Time will tell
    us if these new classes will become available on the iPhone. Some of the more
    important classes are:


    +   - NSAttributedString: Strings can now have different attributes that change
    their look. Attributes are things like bold, italic, colors, alignment, and other
    things that make up rich text.

    - UISplitViewController: A replacement or supplement for navigation controllers.
    In a way, it is a navigation controller that fits multiple views on the screen
    at once.

    - UIGestureRecognizer (and subclasses): These classes will perform gesture recognition
    (like pinch-pull or rotate) for so you won''t have to implement your own technique
    in the various Responder methods.

    - Core Text: The text editing APIs from the desktop have made their way to the
    iPad. You can write your own text editor!


    All of the concepts and classes you have learned in this book leave you more prepared
    to use these new features. Check out the documentation to add these new classes
    to your toolkit. And always remember, just because a feature is new doesn''t mean
    you have to use it.


    For more information about developing for the iPad, check out the iPad Programming
    Guide in the developer documentation.'
