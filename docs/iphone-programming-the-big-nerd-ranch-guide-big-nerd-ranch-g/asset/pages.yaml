  md: "# Chapter 3. Memory Management\n\nUsing retain counts\n\nAn object never knows\
    \ who its owners are. It only knows its retain count as diagramed in Figure 3.3.\n\
    \nFigure 3.3. Retain count for a dog\n\n![](img/f6c6f47463c37c27b423c6082ee341bb_71_0.png)\n\
    \nWhen an object is created – and therefore has one owner – its retain count is\
    \ set to 1. When an object gains an owner, its retain count is incremented. When\
    \ an object loses an owner, its retain count is decremented. When that count reaches\
    \ 0, the object sends itself the message dealloc, which returns all of the memory\
    \ it occupied to the heap.\n\nImagine how you would write the code to implement\
    \ this scheme yourself:\n\n```\n- (id)retain\n{\n  retainCount++;\n  return self;\n\
    }\n- (void)release\n{\n  retainCount--;\n  if (retainCount == 0)\n    [self dealloc];\n\
    }\n```\n\nSimple, right? Now let's consider how retain counts work between objects.\
    \ Object A creates object B (through alloc and init), A must send B the message\
    \ release at some point in the future. Releasing B doesn’t necessarily deallocate;\
    \ it is left to B to decide if it should be deallocated. (If B has another owner,\
    \ it won’t destroy itself.)"
