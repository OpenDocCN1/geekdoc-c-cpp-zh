    # For the More Curious: NSBundle’s Role in Internationalization


    The real work of adding a localization is done for you by the class NSBundle.
    When a ViewController is initialized, it is given two arguments: the name of a
    XIB file and an NSBundle object. The bundle argument is typically nil, which


