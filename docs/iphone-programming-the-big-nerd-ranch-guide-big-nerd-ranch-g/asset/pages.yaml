  md: '# INavigationBar


    The UINavigationBar isn''t very interesting right now. At a minimum, a UINavigationBar
    should display a descriptive title for the UIViewController that is currently
    on top of the UINavigationController''s stack.


    Every ViewController has a property navigationItem of type UINavigationItem. While
    UINavigationBar is a subclass of UIView (which it can appear on screen), UINavigationItem
    is not. However, it supplies the navigation bar with the content it needs to draw.
    When it comes to the top of a UINavigationController''s stack, the navigation
    controller''s UINavigationBar uses the ViewController''s navigationItem to configure
    itself as shown in Figure 12.6.


    # Figure 12.6. UINavigationItem


    ![](img/f6c6f47463c37c27b423c6082ee341bb_214_0.png)


    That''s not the easiest to understand at first glance. So, consider the following
    analogy. Think of ViewController as an NFL football team, and moving to the top
    of the stack as going to the Super Bowl. The UINavigationItem is the team logo
    design, and no matter what, its team logo remains unchanged; it''s an internal
    design. The UINavigationController is the stadium, and the UINavigationBar is
    an end zone. When a team makes it to the Super Bowl, its logo is painted in one
    zone of the stadium. When a ViewController is moved to the top of the stack, its
    UINavigationItem is painted on the UINavigationController.


    By default, a UINavigationItem is empty. At the most basic level, a UINavigationItem
    has a simple title string. When a ViewController is moved to the top of the navigation
    stack and its navigationItem has a valid string for its title property, the navigation
    bar will display that string (Figure 12.7).'
