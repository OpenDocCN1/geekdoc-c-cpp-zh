  md: '# Chapter 27. Core Data


    Using the C API for SQLite is one way to store and access data on the iPhone.
    The Core Data framework simplifies this process by providing ORM for Objective-C
    and SQLite. ORM stands for Object-Relational Mapping. If you think of a table
    in a relational database as a class, then each row represents one instance of
    the class and each column represents instance variable. Core Data fetches rows
    from the table and turns them into objects (Figure 27.1). When these objects are
    edited, Core Data updates the row in the table accordingly. It also takes care
    of inserting and deleting rows as created and destroyed.


    # Figure 27.1. Role of Core Data


    | Relational Model | | | | Object Model |

    |---|---|---|---|---||

    | personID | firstName | lastName | | |

    | 4 | Celia | Monroe | 4 Celia Monroe | |

    | 5 | John | Smith | 5 John Smith | |

    | 6 | Linda | Gow | 6 Linda Gow | |


    The class is known as an entity in Core Data. The column/instance variable is
    an attribute of that entity. In this diagram, one entity is called Person. It
    has three attributes: personID, firstName, and lastName.


    It gets a little more complicated if you have more than one table and relationships
    between them. In a relational database, these relationships are handled using
    primary keys and foreign keys. Each row in a table gets an ID number, if another
    table has a column that references that ID, the column is a foreign key. The relationship
    from the table with the foreign key is “to-one”; after all, unique ID can only
    refer to one row. The relationship going other way is typically “to-many”. (If
    you’d like more help understanding relational data, we suggest reading Joe Celko’s
    SQL for Smarties.)


    Thus, Core Data uses two distinct types of properties: attributes and relationships.
    Attributes can be expressed as simple data types: NSNumber, NSString, NSDate,
    NSData, etc. Relationships refer to other entities and are represented by pointers
    (for to-one relationships) and instances of NSSet (for to-many relationships)
    as shown in Figure 27.2.'
  merge: -1
