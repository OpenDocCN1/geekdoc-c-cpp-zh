  md: '# Chapter 19. Controlling Animation With CAAnimation


    Redrawing doesn''t happen when the thread of execution is in your method. The
    run loop has to regain control and only then will it animating and drawing. Since
    the layer is animating the next time it is supposed to be drawn, it doesn''t matter
    what its position is set to, the animated version of the layer is being drawn
    instead.


    Core Animation makes a distinction between the values of the properties of a layer
    and the values while animating. When a layer is not animating, you can, of course,
    determine the values of its properties by sending the appropriate messages to
    the layer instance. When a layer is animating, you can get the current value of
    its properties that are being displayed on the screen by accessing a layer''s
    presentationLayer. Sending the message presentationLayer to a layer returns a
    copy of the layer object, and the copy will have the current values for each property
    while animating.


    ```

    CGPoint whereItWhenAnimationStops = [layer position];

    CGPoint whereIsNotNow = [[layer presentationLayer] position];

    ```


    This is useful if you need to change a layer''s animation while another animation
    is already running. If a layer is moving from point A to point B, and the user''s
    input forces the layer to move to point C during the animation, you would have
    to know where the current layer is to make a smooth transition to point C. Querying
    the presentation layer is also useful if you are using a layer for timing in your
    application. Imagine a game that has animating objects on the screen, and if the
    user taps one of the objects, it blows up. Only the presentation layer knows where
    the object currently is on the screen.


    There is one "gotcha" to this process: if you do not specify a fromValue when
    using CABasicAnimation and set the property to the ending point of the animation,
    no animation occurs. Why? Without a fromValue, the animation assumes that the
    starting point of the animation is the same as the final value, there is no change
    and therefore no animation. (If the fromValue is not set, it is computed when
    the run loop starts the animation, not when you add the animation to a layer.)'
