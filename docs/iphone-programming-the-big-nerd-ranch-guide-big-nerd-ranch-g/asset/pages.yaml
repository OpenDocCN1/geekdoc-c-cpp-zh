    # Event-driven Programming


    ![](img/f6c6f47463c37c27b423c6082ee341bb_31_0.png)


    When the application launches, it enters a loop as shown in Figure 1.14.


    # Figure 1.14. iPhone application event loop


    The UIApplication object waits around for an event. When the user touches the
    screen, the touch event is forwarded by the UIApplication object to the view that
    was touched. This is often a control (like a button) that then sends its message
    to a controller. This triggers your custom code. Your code changes the state of
    a view, which redraws itself to reflect the new state.


    In iPhone programming, the event loop drives everything. If you are used to a
    programming environment where you drive the application from a main function that
    calls other functions, the event loop may seem confusing. We will discuss the
    event loop in more detail in later chapters.


