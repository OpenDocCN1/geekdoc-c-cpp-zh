    # The Lifecycle of a View Controller


    A view controller is created through alloc and init. It does not, however, create
    its view at that time. Instead, it waits until the view is really needed before
    it executes LoadView. (Remember that the default implementation of LoadView reads
    a NIB file, but you can override it to create the view programmatically.) This
    lazy creation of the view is good. For example, if you have a tab view with a
    dozen controllers, the view for any particular view controller will only be created
    if that particular tab is selected.


    First rule: Never manipulate your view in init. Wait until LoadView or viewDidLoad
    before sending messages to the view. Trying to interact with the view in init
    will have caused it to be created, which will destroy the nature of your view
    controller.


    Furthermore, a view controller''s view may get created and destroyed several times.
    Let''s say that you have several view controllers in memory (but only one on screen)
    and all of their views have been created. This could take a lot of memory and
    trigger a low-memory warning. At that point, didReceiveMemoryWarning is sent to
    all the view controllers. The default implementation of didReceiveMemoryWarning
    releases the view if it has no supervise. (No supervise it indicates it is not
    on screen and no other view cares about it.) After the view is released, the view
    controller is sent viewDidUnload.


    If the view is needed again, the view controller is sent LoadView again. Thus,
    LoadView can be called many times on a single view controller. However, init is
    only sent to a view controller once. If you were sent messages to a view


