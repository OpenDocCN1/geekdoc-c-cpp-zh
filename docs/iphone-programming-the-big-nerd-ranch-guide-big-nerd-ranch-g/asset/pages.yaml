  md: '# Chapter 1. A Simple iPhone Application


    why the file that actually ships with your application is a NIB.


    When you build your application, the NIB file is copied into the application''s
    bundle. (An iPhone application is really a directory containing the executable
    and any resources the executable files. We refer to this directory as a bundle.)
    When your application reads the NIB file, all of the objects in the archive are
    brought to life. This particular application has only one NIB file created from
    MainWindow.xib, but a complex application can have many NIB files created in read
    as they are needed.


    Once Interface Builder starts up, you will see several windows as shown in 1.4.


