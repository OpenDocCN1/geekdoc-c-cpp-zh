    # Trade-offs of Persistence Mechanisms


    At this point, you have seen all the common ways iPhone applications can store
    their data: archiving, web services, direct SQLite, and Core Data. Which is best
    for your application? Use Table 27.1 to help you decide.


    # Table 27.1. Data storage pros and cons


    | Technique | Pros | Cons |

    | --- | --- | --- |

    | Archiving | Allows ordered relationships (arrays, not sets). Easy to deal with
    versioning. | Reads all the objects in (no faulting). No incremental updates.
    |

    | Web Service | Makes it easy to share data to other devices and applications.
    | Requires a server and connection to the internet. |

    | SQLite | Can fetch lazily. Incremental updates. Full power of SQL. | Requires
    more code than archiving or Core Data. No real ordered relationships.'
