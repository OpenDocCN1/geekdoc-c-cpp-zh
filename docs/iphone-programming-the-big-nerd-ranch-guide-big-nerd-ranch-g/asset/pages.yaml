  md: '# Chapter 18. Core Animation Layer


    One of the things that makes iPhone interfaces so beautiful is the use of animation.
    When used properly, animation can increase the functionality of an application
    by giving the user visual cues about the workflow of the application.


    On the iPhone, the Core Animation API contains the classes and functions needed
    to animate an application''s interface.


    There are two classes that make Core Animation work: CALayer and CAAnimation.


    CALayer is, at its core, a buffer containing a bitmap. When you draw a layer (or,
    more importantly, a stack of layers), the rendering is hardware-accelerated. This
    makes drawing a layer to the screen incredibly fast. The idea of layers may be
    new, but you''ve been using layers this entire time: every view has a layer, and
    when a view draws, it is drawing upon its layer.


    CAAnimation is an object that causes a change over time. Typically, it is changing
    one property (like opacity) of a layer while being driven by a timer object.


    In this chapter, we are going to focus on CALayer, and in the next chapter, we''ll
    focus on CAAnimation.


