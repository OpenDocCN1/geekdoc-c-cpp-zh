    # For the More Curious: Presentation and Model Layers


    What would happen if you were to omit the final CATransform3DIdentity from the
    bounce animation? You can see that the bounce "snaps" back into its original position
    as the animation ends. Why doesn''t the layer just stop at the final position
    when the animation ends? A layer has properties like any other object. When an
    animation is added to a layer, it temporarily modifies the layer but not itself.
    Therefore, if you are animating a layer to a new value which it should remain
    after the animation is finished, you must set the property you are animating to
    the final value.


    Let''s use an example to make this easier to understand: you want to move a layer
    from point A to B and then stay at point B using CABasicAnimation with key path
    position. To do this, you must add the animation to the layer to perform the animation
    and set the layer''s position to point B so it remains after the animation completes.
    When you set the position property you can do it before or you apply the animation.


    ```

    CABasicAnimation *move = [CABasicAnimation animationWithKeyPath:@"position"];

    [move setValue:[NSValue valueWithCGPoint:layer position]];

    [move setToValue:[NSValue valueWithCGPoint:pointB]];


    // You could set the destination position here...

    [layer setPosition:pointB];


    [layer addAnimation:forKey:@"move"];


    // Or you could set the destination position here

    [layer setPosition:pointB];

    ```


    Okay, so why does setting the final position work in either of those spots?'
