    Notice how the second page view is offset from the first page view by the width
    of the screen. This puts the two views side-by-side, the second one is off to
    the righthand side of the screen. **contentSize** of the scroll view accommodates
    for this by having a width that is twice the size of the screen (and a height
    that is the same as the screen).


    If you stopped here, the scroll view will work normally: the user can move around
    the double screen-sized area and see the content of the two pages. However, a
    scroll view can also automatically stop at each page. To enforce the display of
    only one page at a time, the scroll view needs to enable paging:


    ```

    [sv setPagingEnabled:YES];

    ```


    Now when the user swipes to the left or right, one of the pages will lock itself
    onto the screen. The scroll view will automatically stop and recent its content
    based on the bounds of the scroll view. Just make sure the **UIScrollView**''s
    size matches the size of each page and that the **contentSize** has enough room
    for all of the pages.'
