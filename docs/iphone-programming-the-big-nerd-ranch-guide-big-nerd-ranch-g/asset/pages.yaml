    On iPhone OS, every application has its own application sandbox. An application
    sandbox is a directory on the filesystem that is barricaded from the rest of the
    filesystem. Your application must stay in its sandbox, and no other application
    can access its sandbox.


    # Application Sandbox


    Figure 14.1. Application sandbox


    ![](img/f6c6f47463c37c27b423c6082ee341bb_253_0.png)


    The application sandbox has a number of directories, and each of them has a different
    use.


    +   Application bundle


    This directory contains all the resources and the executable. It is read-only.


    +   Library/Preferences/


    This directory is where any preferences are stored and where the Settings application
    will look for application preferences.Library/Preferences is handled automatically
    by the class NSUserDefaults(which you will learn about in Chapter 25) and is backed
    up when the device is synchronized with iTunes.'
