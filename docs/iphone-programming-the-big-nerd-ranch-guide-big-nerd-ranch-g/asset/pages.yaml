    Add the following to WhereamiAppDelegate.m.


    ```

    - (BOOL)application:(UIApplication*)application didFinishLaunchingWithOptions:(NSDictionary*)launchOptions
    {

    // Create location manager object -

    locationManager = [[CLLocationManager alloc] init];


    // Make this instance of WhereamiAppDelegate the delegate

    // it will send its messages to our WhereamiAppDelegate

    [locationManager delegate:self];


    // We want all results from the location manager

    [locationManager setDistanceFilter:kCLDistanceNone];


    // And we want it to be as accurate as possible

    // regardless of how much time/power it takes

    [locationManager setDesiredAccuracy:kCLAccuracyBest];


    // Tell our manager to start looking for its location immediately

    [locationManager startUpdatingLocation];


