    # Accessors and properties


    Now that you have instance variables, you need a way to get and set them. In object-oriented
    languages, we call methods that get and set instance variables accessors. Individually,
    we call them getters and setters. Without these methods, one object cannot access
    the instance variables of another object.


    Prior to Objective-C version 2.0, we had to explicitly declare and define every
    accessor method. That was a lot of typing. Fortunately, Objective-C 2.0 introduces
    a shortcut called properties. By creating a property, you are declaring two accessor
    methods. Before properties were introduced, you would have declared those two
    accessor methods as follows:


    ```

    // Getter

    -(int)fido;

    ```


    ```

    // Setter

    -(void)setFido:(int)v;

    ```


    You might wonder why the name of the getter is simply fido instead of getFido.
    This is another Objective-C style convention. The name of the instance variable
    you are accessing is the name of the getter method for. While there is no compiler
    warning or error if you use get, stylish iPhone programmers stick to the convention.


    With properties, you can declare the same two accessors in one line of code:


    ```

    @property int fido;

    ```


    When you create a property, the accessors are declared according to the naming
    convention above. Properties also declare how the accessors are implemented by
    setting property attributes. One attribute addresses how the setter method will
    set the variable. The default is simple assignment. You can change this to copy
    or retain. (The reasons why you might do this will make more sense later.) Another
    attribute deals with whether the variable can be changed. The default is readwrite,
    but it can be set to readonly. In case, only the getter method is declared. A
    third attribute tells us if the variable requires a lock. This attribute defaults
    to atomic, which'
