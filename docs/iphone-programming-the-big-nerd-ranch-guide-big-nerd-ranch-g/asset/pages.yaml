    However, if arrayInstance is set to nil, the problem goes away.(nil pointer. C
    programmers know it as NULL. Java programmers know it as null.)


    arrayInstance = nil;


    Now there is no danger of sending a message to the outdated memory address. Sending
    a message to nil is okay in Objective-C; nothing will happen. In a language Java,
    sending messages to nil is illegal, so you see this sort of a lot:


    ```

    if (rover != nil) {

    [rover doSomething];

    }

    ```


    In Objective-C, this check is unnecessary because a message sent to nil is just
    ignored. (A corollary: if your program doesn''t do anything when you think it
    should be doing something, an unexpectedly nil pointer is often the culprit.)


