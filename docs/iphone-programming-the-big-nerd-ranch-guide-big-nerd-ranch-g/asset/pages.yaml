  md: '# Chapter 2. Objective-C


    a pointer to in the variable arrayInstance. When you have a pointer to an instance,
    you can send messages to it. The first message you always send to a newly allocated
    instance is an initialization message.


    [arrayInstance init];


    Though sending the alloc message to a class creates an instance, the object isn''t
    valid until it has been initialized. Since an object must be allocated before
    it can be used, we always combine these two messages in one line.


    ```

    NSMutableArray *instance = [[NSMutableArray alloc] init];

    ```


    This line of code, "Create an instance of NSMutableArray and send it the message
    init.". Both alloc and init return pointer to the newly created object that you
    have a reference to it. Typically, you use the assignment operator (=) to store
    that pointer in a variable, as in this line of code.


    Combining two messages in a single line of code is called nested message. The
    innermost brackets are evaluated first, so the message alloc is sent to the class
    NSMutableArray. This returns a new, uninitialized instance of NSMutableArraythat
    we send the message init.


    Methods come in two flavors: instance methods and class methods. Instance methods
    (like init) are sent to instances of the class, and class methods (like alloc)
    are sent to the class itself, typically either to create new instances of the
    class or to retrieve some global property of the class. (We will talk more about
    class and instance methods later.)


    What do you do with an instance that has been initialized? You send it more messages.
    Messages have three parts:


    +   receiver - a pointer to the object being asked to execute a method


    +   selector - the name of the method to be executed


    +   arguments - the values to be supplied as the parameters to the method'
