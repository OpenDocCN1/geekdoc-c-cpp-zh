  md: '# Setting pointers


    The instance of QuizAppDelegate has a pointer questionField. Let''s start by setting
    that to point to the instance of UILabel that is closest to the top of the window.
    In Interface Builder, control-click or right-click on QuizAppDelegate to bring
    up the connections panel (Figure 1.9). Then drag from the circle beside questionField
    to the UILabel.


    Figure 1.9. Setting questionField


    ![](img/f6c6f47463c37c27b423c6082ee341bb_24_0.png)


    (If you do not see questionField here, double check your QuizAppDelegate.h file.
    Did you end each line with a semicolon? Has the file saved since you added questionField?)


    When the NIB file is read in, the QuizAppDelegate''s questionField pointer will
    now automatically point to the instance of UILabel.


    Now drag from the circle beside answerField to the other UILabel (Figure 1.10).'
