  md: '# Chapter 1. A Simple iPhone Application


    To install an application onto your development device, you need a developer certificate
    from Apple. Developer certificates are issued to registered iPhone Developers
    who have paid the developer fee. This certificate grants you the ability to sign
    your code, allowing it to run on a device. Without a valid certificate, devices
    will not allow your application to run.


    Apple''s Developer Program Portal (http://developer.apple.com/iphone/) contains
    all the instructions and resources to get a valid certificate. The interface for
    the set up process is continually being updated by Apple, so it would be fruitless
    to describe it in detail. However, a step-by-step guide, the Development Provisioning
    Assistant, is available on the program portal.


    Work through the Development Provisioning Assistant, paying careful attention
    to each screen. At the end, you will have added the required certificates to Keychain
    Access and the mobile provision file to Xcode. You might be curious as to what
    exactly is going on here. In the provisioning process, there are four important
    items:


    +   - Developer Certificate


    This certificate file is added to your Mac''s keychain using Keychain Access.
    It is used to digitally sign your code.


    +   - App ID


    The application identifier is a string that uniquely identifies your application
    on the App Store. Application identifiers typically look like this: com.bignerdranch.AwesomeApp,
    where the name of the application follows the name of your company. The App ID
    in your provisioning profile must match the bundle identifier of your application.
    A development profile, like you just created, can have a wildcard character for
    its App ID and therefore will match any Bundle Identifier. To see the bundle identifier
    for an application, open the AppName-Info.plist file in the Resources group of
    the project window.'
