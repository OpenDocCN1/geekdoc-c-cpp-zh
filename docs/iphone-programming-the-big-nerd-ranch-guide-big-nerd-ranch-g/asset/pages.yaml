    # Archiving


    There are many ways to write data to the disk on the iPhone, and one of the most
    important is called archiving. Archiving is handled by the NSCoding protocol and
    its two required methods: encodeCoder: initCoder:. You can implement these two
    methods in any class, and instances of class will know how to save and load themselves
    from disk. Therefore, when a class conforms to the NSCoding protocol, it can be
    archived and reloaded into an application.(In fact, this is exactly what a XIB
    file is – a bunch of archived objects.)


    In this chapter, you will make Possession instances in Homeowner conform to the
    NSCoding protocol. possessions will persist between runs of the application. Open
    Homeowner.xcodeproj.


    Implementing the two NSCoding methods is easy. First, declare that Possession
    conforms to NSCoding. In Possession.h, declare the protocol in the interface declaration.


    ```

    @interface NSObject : <NSCoding>

    ```


    When an object needs to be archived, it is sent the message encodeCoder:. An NSCoder
    instance is passed to the object, and all of the instance variables are encoded
    into it. If any of those instance variables are objects, objects are then told
    to encodeCoder:. So archiving is a recursive process that starts at one object
    that encodes its friends, and they encode their friends, and so on. Thus, you
    can only encode supported primitives like int and objects that conform to the
    NSCoding protocol. This is because these objects are also sent encodeCoder: as
    shown in Figure 14.2.'
