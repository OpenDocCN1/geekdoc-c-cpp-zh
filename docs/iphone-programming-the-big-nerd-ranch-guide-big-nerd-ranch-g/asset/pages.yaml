- img_proc: true
  md: '# Chapter 23. Localization


    is interpreted as the application’s main bundle. (The main bundle is another name
    for the application bundle – all of the resources and the executable for the application.
    When an application is built, all of the Lproj directories are copied into this
    bundle.)


    When the view controller loads its view, it asks the bundle for the XIB file.
    The bundle, being very smart, checks the current language settings of the device
    and looks in the appropriate Lproj directory. The path for the XIB file in the
    Lproj directory is returned to the view controller and loaded.


    NSBundle knows how to search through localization directories for every type of
    resource using a resource method pathForResource:ofType:. When you want a path
    to a resource bundle with your application, you send this message to the main
    bundle. Here’s an example using the resource file myimage.png:


    ```

    NSString *path = [[NSBundle mainBundle] pathForResource:@"myImage" ofType:@"png"];

    ```


    The bundle first checks to see if there is a myimage.png file in the top-level
    of the application bundle. If so, it returns the full path to that file. If not,
    the bundle gets the device’s language settings and looks in the appropriate Lproj
    directory to construct the path. If no file is found, it returns nil.'
