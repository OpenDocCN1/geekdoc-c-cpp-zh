  md: '# Chapter 21. Web Services


    A web service is an application that runs on a web server. An iPhone application
    can ask a web service to execute methods that the web service implements. Typically,
    a web service''s methods will collect data from the iPhone application and store
    it in a database or return information from that database to the iPhone application
    (or both). The data transferred between a web service and a client application
    is typically formatted into XML or JSON format.


    To work with a web service, an iPhone application must make a connection to a
    web server, transfer properly formatted data between the two, and parse any returned.


