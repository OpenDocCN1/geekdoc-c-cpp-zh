    # Fetching Data From a URL


    Now you are going to fetch some data from a web server. To help with this process,
    there are three classes: NSURL, NSRequest, and NSURLConnection (Figure 21.3).


    Figure 21.3. Relationship of web service classes


    | NSURLConnection | request | NSRequest cachePolicy timeout httpHeaders httpBody
    | URL | NSURL http://www.bignerdranch.com |


    Each of these classes has an important role in communicating with a web server:


    +   - NSURL instances contain the location of the web application in URL format.
    For simple web services, the URL will be composed of the base address, and the
    web application you are communicating with, and any arguments that are being passed.


    +   - Instances of NSRequest hold all the data necessary to communicate with a
    web server. This includes an NSURL object, as well as a caching policy, a limit
    on how long you will give the web server to respond, and additional data passed
    through the HTTP protocol. (NSMutableURLRequest is the mutable subclass of NSRequest.)


    +   - NSURLConnection instances are responsible for actually making the connection
    to a web server, sending the information in its NSURLRequest, and gathering the
    response from the server.


