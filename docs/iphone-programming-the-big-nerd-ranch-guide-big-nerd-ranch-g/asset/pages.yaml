    # Subclassing an Objective-C Class


    Where does the description method come from? Every class has exactly one superclass
    – except for the root class of the entire hierarchy: NSObject. That means, at
    minimum, every class inherits from NSObject implements a method named description


    Sending the description message to NSObject returns NSString containing information
    about that instance. By default, that string is the object''s class and its address
    in memory. A subclass of NSObject, like NSString, will override this method to
    return something that does a better job describing an instance of that subclass.
    For NSString, description just returns the string itself since that is the best
    way to describe an NSString instance.


