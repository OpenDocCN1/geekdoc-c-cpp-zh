  md: '# Chapter 25. Settings


    Save Root.plist and build and run your application. After your application starts,
    exit it. Open Settings and scroll to find Nayberz. Select and set your preference
    for the Nayberz message.


    # NSUserDefaults


    Now the user can set the preference for BNMessagePrefKey. But you still need to
    write a little code to respect the user''s preference in your application. The
    UserDefaults makes this very simple. It has a class method standardUserDefaults
    that returns the singular instance of UserDefaults for your application. UserDefaults
    is essentially an NSMutableDictionary with keys and values. Its keys are the keys
    for your preference specifiers in Root.plist, and its values are the user''s settings
    for those preferences.


    # Registering defaults


    Every time the app launches, you will need to remind the application what the
    factory defaults are "registering" your factory defaults using the DefaultValues
    from your Settings.bundle. To register your defaults, you build an NSDictionary
    containing a key-value pair for each preference. Each key will be a preference
    key, and its value will be the corresponding DefaultValue for the preference.
    Then you send this dictionary to the instance of UserDefaults using registerDefaults:
    message.


    The priority of the various defaults settings is as follows:


    +   1. preferences set by the user in Settings (highest)

    2. default values set in Root.plist in the Settings.bundle

    3. default values set with registerDefaults: (lowest)


    So if the user has already set a preference, it will override the other default
    values.


    Your application needs to register its defaults before using the instance of UserDefaults.
    So you''re going to register them in the initialize method. In initialize in NayberzAppDelegate,
    load the Root.plist in the settings bundle and pull out the default values for
    every key. Note that initialize is a class method (denoted with a "+");):'
