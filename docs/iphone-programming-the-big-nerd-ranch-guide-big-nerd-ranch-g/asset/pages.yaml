  md: '# Chapter 26. SQLite


    Once upon a time, SQL was created to access data in relational databases. While
    powerful, SQL required a database infrastructure. One day, Richard Hipp decided
    to create a library that would store data in tables and store those tables in
    a file instead of a relational database. With this library, you could use SQL
    commands to fetch data from the tables without requiring a database server process.
    You could also use SQL commands to insert, update, and delete rows of data. Dr.
    Hipp released the code for this library into the public domain and called it SQLite.
    The SQLite libraries are part of the iPhone OS.


    SQLite is a nifty C library. It has great performance and reliability. Both the
    source for the library and the data files it creates are portable to a large number
    of platforms.


    In the Homepagener application, you stored your data using an archive. Archives
    are very easy to use and support arbitrary object models. The downside of an archive
    is that it is read and written in its entirety. With SQLite, you can fetch only
    the data you need. You can update individual rows of data. Thus, if you are dealing
    with a lot of data, using SQLite can radically improve the speed and memory footprint
    of your application. If you are dealing with a small amount of data, say, less
    than a thousand rows, archiving is all you need.


    # Creating the Nayshunz Application


    This chapter will show you how to open a SQLite file and fetch data from it. It
    is done using a C API, so you will spend some time converting C strings into objects
    and back again. You will create an application that displays the names of nations
    stored in a SQLite database as shown in Figure 26.1.'
