  md: '# Chapter 1. A Simple iPhone Application


    # Figure 1.3. Xcode project window


    ![](img/f6c6f47463c37c27b423c6082ee341bb_15_0.png)


    Inside the Resources group you''ll find two files: MainWindow.xib and Quiz-Info.plist.
    The Info property list (Quiz-Info.plist) contains a list of key-value pairs. The
    values in this list specify what the icon to display on the home screen, whether
    the application needs a persistent Wi-Fi connection, and the default language
    of the application.


    The MainWindow.xib file contains the interface for your application. Double-click
    on MainWindow.xib to open it in Interface Builder.


    # Using Interface Builder


    At the simplest level, Interface Builder is a GUI builder. Most GUI builders let
    the developer describe what they want the application to look like. Then the developer
    presses a button, and the builder generates reigns upon code. Interface Builder,
    however, is an object editor: the developer creates and configures objects and
    then saves them into an archive. This archive is a XIB (pronounced “bib”) or a
    NIB file. A XIB file is an XML representation of your objects and their variables,
    and it is compiled into a NIB file when your application is built. The XIB file
    is easier to work with, but the NIB file is smaller and easier to parse,'
  merge: -1
  pgno: 15
