  md: '# Chapter 18. Core Animation Layer


    The contents and backgroundColor properties of the CALayer were set with objects
    of type CGImageRef and CGColorRef, respectively. You are used to working with
    UIKit and UIColor, so why doesn''t Core Animation use these types of objects?


    UIKit (where we get UIKit and anything else prefixed with UI) only exists on the
    iPhone and on the Mac. This means using Core Graphics types makes your code portable
    between systems. Fortunately, UIKit objects have methods to easily switch between
    themselves and Core Graphics counterparts (for example, UIKit''s CGImage and initWithWithCGImage:
    methods).


    Just like views, layers have a pointer to their parent layer. While views call
    this pointer supervise, layers as you may have guessed, call this pointer superlayer.
    When a layer is drawn, it copies its contents to the screen, and then each sublayer
    copies its contents to the screen. Therefore, a layer always draws on top of its
    superlayer.


    Each layer has a property, zPosition, that determines how far away it is from
    the plane of the screen. If two layers are siblings (that is, they have the same
    superlayer) and they overlap, the layer with the higher z-position is drawn last.
    (A sublayer always draws on top of its superlayer, regardless of zPosition.) A
    layer''s zPosition defaults to 0 and can be set to a negative value.


    +   [aLayer setZPosition:-5];

    [bLayer setZPosition:5];

    [parentLayer addSublayer:bLayer];

