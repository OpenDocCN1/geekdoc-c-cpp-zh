  md: '# Releasing Controller Instance Variables


    Deallocating objects while an application is running is important because it frees
    up memory for future objects. When an application terminates, the memory it was
    consuming is returned to the operating system. In most applications, however,
    controller objects exist the entire time an application is running. They never
    get released and never get deallocated.


    This holds true for Whereami: the instance of WhereamiAppDelegate will never get
    released because it needs to exist the entire time the application is running.
    Therefore, you do not need to implement the dealloc method for this class. Most
    of the applications in this book have controller objects that exist the entire
    time an application is running. This is the behavior for many controller objects
    in real applications for two reasons:


    +   - Controller objects are the brains of an application. They take on a lot
    of roles and are typically needed throughout the execution of an application.


    +   - Controller objects do not consume a lot of memory themselves. They only
    hold pointers to view and model objects, which are the two types of classes that
    consume the majority of memory. If memory is running low, the controller can get
    rid of the big objects it has pointers to (and, indeed, be able to reload objects
    when needed).


    Now, this isn''t to say that all controller objects exist throughout an application''s
    lifetime. Some controller objects can exist temporarily for a specific task. In
    these circumstances, you will need to release the appropriate instance variables
    in the controller''s dealloc method.


    We won''t waste your time showing you the implementation of dealloc methods that
    will never get called, but you can''t go by getting in the habit of always writing
    correct dealloc methods. (An unused method never hurts you.)


    In Snow Leopard, a static analyzer was added to Xcode. The static analyzer evaluates
    your code and looks for potential problems like memory leaks or uninitialized
    variables. (You can run the static analyzer on your code by selecting Build and
    Analyze from the Project menu.) It''s not without flaws, though if you'
  merge: -1
