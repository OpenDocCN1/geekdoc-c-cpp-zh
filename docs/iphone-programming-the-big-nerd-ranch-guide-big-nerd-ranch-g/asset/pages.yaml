    some/path/\" encoding:NSUTF8StringEncoding error:&error];\n\n```\nif (!x) {\n\
    \  NSLog(\"Error reading file: %@\", [localizedDescription]);\n}\n```\n\nWhat's\
    \ NSError object? Some methods might fail for a variety of reasons — for example,\
    \ writing to disk fail because the path is invalid or the user doesn't have permission\
    \ to write to the specified path. NSError objects contain the reason for failure.\
    \ You can send the message localizedDescription to an instance of NSError for\
    \ a human-readable description of the error. This is something you can show to\
    \ the user or print out to a debug console.\n\nError objects also have code and\
    \ domain properties. The code is an integer representing the error. The domain\
    \ represents the error domain. For example, not having permission to write to\
    \ a directory results in error code 513 in error domain NSCocoaError. Each domain\
    \ has its own set of error codes and those codes within domain are uniquely specified\
    \ by their code within an error domain. You can check out most of the error codes\
    \ for the NSCocoaError in Foundation/FoundationErrors.h.\n\nThe syntax for getting\
    \ back an NSError instance is a little strange, though. Error objects are only\
    \ created if an error occurred; otherwise, there is no need for the object. When\
    \ a method can return an error through one of its arguments, you create a local\
    \ variable that is a pointer to an NSError object. Notice that you don't instantiate\
    \ the error object — that is the job of the method you are calling. Passing the\
    \ address of the pointer variable you have to the method that might generate an\
    \ error. If an error occurs in the implementation of that method, an NSError instance\
    \ is created and your pointer is set to that new object. (The error is autoreleased).\
    \ If you don't clear the error object, you can always pass nil.\n\nIn addition\
    \ to NSString, two other objects have writeToFile: and initWithContentsFile: methods:\
    \ NSDictionary and NSArray. In order to write objects of these types to disk in\
    \ this fashion, they must contain only property serializable objects. The only\
    \ objects that are property serializable are NSString, NSNumber, NSDate, NSData,\
    \ NSArray, and NSDictionary. When NSArray or NSDictionary is written to disk with\
