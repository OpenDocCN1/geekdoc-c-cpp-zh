    this message it returns its memory back to the heap.


    So, malloc is replaced with the class method alloc, and the function free is replaced
    with the instance method dealloc. However, you never explicitly sent a dealloc
    message to an object; an object is responsible for sending dealloc to itself.
    That begs the question: if an object is in charge of destroying itself, how can
    it know if other objects are relying on its existence? This is where reference
    counting comes into play.


    # Reference Counting


    In the Cocoa Touch framework, Apple has adopted manual reference counting to manage
    memory and avoid premature deallocation and memory leaks.


    To understand reference counting, imagine a puppy. When the puppy is born, it
    has an owner. That owner later gets married, and the new spouse also becomes an
    owner of that dog. The dog is alive because they feed it. Later on, this couple
    gives the dog away. The new owner of dog decides he doesn''t like the dog and
    lets it by kicking it out of the house. Having no owner, the dog runs away and,
    after a series of unfortunate events, ends up in doggy heaven.


    What is the moral of this story? As long as the dog had an owner to care for it,
    it was fine. When it no longer had an owner, it ran away and ceased to exist.
    This is how reference counting works. When an object is created, it has an owner.
    Throughout its existence, it can have different owners, and it can have more than
    one owner at a time. When it has zero owners, it deallocates itself and goes to
    instance heaven.'
