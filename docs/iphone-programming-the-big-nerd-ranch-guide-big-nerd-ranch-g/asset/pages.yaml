    {

    NSString *tCopy = [text copy];

    [text release];

    text = tCopy;


    // Find out if the delegate respondsTo textViewDidChange:

    if ([[self delegate] respondsToSelector:@selector(textViewDidChange:)]) {

    // Send the delegate message saying the text did change!

    [[self delegate] textViewDidChange:self];

    }

    }

    ```


    However, with a required method, an object does not check before sending the message;
    it assumes that method is implemented. If you don''t implement a required delegate
    method for an object, your application will throw an unrecognized selector exception
    when the object sends the required message to'
