  md: '# Chapter 2. Objective-C


    Objective-C developers learn to appreciate the clarity of having a label for each
    argument even though it requires a little more typing. For example, you can have
    two methods replaceObjectsInRange:withObjectsFromArray:range: and replaceObjectsInRange::.
    These methods do not have to be related; they are distinct messages that you can
