    # NSLocalizedString and Strings Tables


    In places in your applications, you create NSString instances or use string literals
    that are displayed to the user. To display translated versions of these strings,
    you must create a string table. A string table is a file containing a list of
    key-value pairs for all the strings of your application uses and their associated
    translations. It''s a resource file that you add to your application, and you
    don''t need to do a lot of work to get data from it.


    Whenever you have a string in your code, it appears like this:


    ```

    @"Add New Item..."

    ```


    To localize a string in your code, you replace literal strings with the macro
    NSLocalizedString().


    ```

    NSString *translatedString =

    NSLocalizedString("@Hello!", "The greeting for the user");

    ```


    This function takes two arguments: a key (which is required) and a comment (which
    is not). The key is the lookup value in a strings table. At runtime, the NSLocalizedString
    will look through the strings tables bundled with your application for a table
    that matches the user''s language settings. Then, in fact, the function gets a
    translation that matches the key. (The second argument is unused by the function;
    you will see why it matters in a moment.)


