  md: '# Chapter 17. Multi-Touch, UIResponder, and Using Instruments


    a subclass of UIResponder, your view can override four methods to handle touch
    events:


    +   - a finger or fingers touches the screen

    - (void)touchesBegan:(NSSet *)touchesWith:(UIEvent *event);


    +   - a finger or fingers moves across the screen (This message is sent repeatedly
    as a moves.)

    - (void)touchesMoved:(NSSet *)touchesWith:(UIEvent *event);


    +   - a finger or fingers is removed from the screen

    - (void)touchesEnded:(NSSet *)touchesWith:(UIEvent *event);


    +   - a system event, like an incoming call, interrupts a touch before it enters

    - (void)touchesCancelled:(NSSet *)touchesWith:(UIEvent *event);


    When the user touches the screen, a UITouch is created. The UITouch object is
    updated and reused for all touch events associated with an individual finger.
    It holds all of the information about that finger: where it is, its state, when
    its state changed, where it is on, the number of times it has tapped the screen,
