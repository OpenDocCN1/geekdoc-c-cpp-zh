  md: '# Chapter 25. Settings


    you set key-value pairs to define the application preferences. Once you''ve done
    this, your application will have its own pane in the Settings application where
    the user can set these preferences.


    XCode makes it very easy to add a Settings.bundle to an application. Reopen Nayberz.xcodeproj
    From the File menu, select New File.... In the table on the left side, under iOS
    group, select Resource. Then in the table on the right, selectSettingsBundle and
    click Next. The screen will let you change the File Name and Location, but don''t
    change them. Just be sure that the Add to Project: field is set to Nayberz and
    Targets: Nayberz is checked before you click Finish.


    The Settings.bundle will now appear in your project''s Groups & Files table. Use
    the disclosure buttons to reveal its contents, Root.list and en.plistroj. The
    en.plistroj directory contains a strings called Root.strings. The en.plistroj/Root.strings
    contains the English version of the text that will appear in the Nayberz pane
    of Settings. This means you can localize Root.strings.


    Double-click on Root.list to open it in the Property List Editor. You will see
    that it contains StringsTable and PreferenceSpecifiers. The value of the StringsTable
    key (Root) gives the name of the strings table file (Root.strings) that will be
    found in each localization directory. A value for this key is not required but
    your application''s settings will not be localized without one.


    Right now, you are interested in the other key, PreferenceSpecifiers. The value
    of this key is an array of dictionaries. Each of these dictionaries defines a
    preference specifier. If you expand the PreferenceSpecifiers key in the Property
    List Editor, you will see the "sample" preferences were added by XCode when it
    created the Settings.bundle for. If you expand these dictionaries, you will see
    the key-value pairs that define each of the preferences. Build and run Nayberz
    with these sample preferences. After your application starts, it open Settings
    and scroll down to see Nayberz in the list. Select it and compare the key-value
    pairs in the dictionaries to the appearance of the properties in Settings. Pretty
    cool, huh?


    Each preference specifier defines an attribute in Settings using key-value pairs.
    Here we will discuss three of keys: Type, Key, and DefaultValue. (Yeah, I know.
    One of the keys is actually named Key.


