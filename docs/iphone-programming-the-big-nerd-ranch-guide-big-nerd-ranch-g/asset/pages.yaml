  md: '# Instruments


    After Xcode and Interface Builder, the most important tool that Apple gives developers
    is Instruments. When you run your applications in Instruments, it shows you the
    objects that are allocated, where the CPU is spending all its time, file I/O,
    network I/O, etc.Instruments are plug-ins that enable you to inspect issues in
    more detail. Each plugin is known as an Instrument. Together, they can help you
    track down inefficiencies in your application so that you can optimize your code.


    # The ObjectAlloc Instrument


    There is a memory leak in TouchTracker. When the user double-taps, the screen
    clears. At this point, all instances of Line should be deallocated, but they aren''t.
    You''re now going to use the ObjectAlloc instrument to confirm this.


    While you profile the application running on the simulator, you''ll get more accurate
    data on the device. So, build the application for the device, and under the Run
    menu, choose Run with Performance Tool -> Object Allocations.


    Instruments will launch, and, as you interact with your application, it will keep
    track of every object created and destroyed. Draw a while, double-tapping a few
    times to clear the lines, and switch back to Instruments and click the Stop button
    to stop recording.


    In the Instruments window, find the row for instances of Line by scrolling through
    the table or using the search bar underneath the table. Notice two counts for
    the instance, Overall and Living.


    Overall is a count of all the instances of Line that have been created during
    this run of the application. It is the number of times alloc has been sent to
    the class Line. Living is a count of all the instances of Line that have been
    created minus those that have been deallocated (the number of Line objects that
    exist currently). Because the overall and living count are the same in this sampling,
    you know that no instances of Line were deallocated even when you-tapped to clear
    lines from the screen. These Lines were leaked.


    At the top of Instruments, there is a graph next to the ObjectAlloc instrument.
    Right now, it is graphing all memory allocations. You can modify that list by
    checking and unchecking the boxes in the Graph column of the table. Uncheck the
    box next to "*All Allocations*" and check Line as shown in Figure 17.5. (If you
    don''t see "*All Allocations*", clear the search bar.)'
