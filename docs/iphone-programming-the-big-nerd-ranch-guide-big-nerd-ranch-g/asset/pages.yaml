    Sometimes protocols have required methods. A class that conforms to a protocol
    that has required methods must implement those methods or the compiler will warn
    you and your application will probably crash. How can you tell if a method is
    required? In the protocol reference, the absence of the optional method next to
    the method name indicates that it is a required method. (Some versions of the
    documentation label the required methods instead of optional methods.)


    You can also determine which methods are required by looking at the header file
    where the protocol is declared. Any required methods appear above the @optional
    directive in the protocol body. Methods that appear below the @optional directive
    are optional and do not have to be implemented by a class conforms to that protocol.
    If there is no @optional tag, then all methods in that protocol are required.


