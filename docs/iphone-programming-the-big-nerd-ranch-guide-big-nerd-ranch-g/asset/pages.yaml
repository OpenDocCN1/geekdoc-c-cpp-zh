  md: '# Chapter 2. Objective-C


    # NSArray and NSMutableArray


    What exactly is this NSMutableArray? An array is a collection (also called a container).
    In the Cocoa Touch frameworks, there are a few collection objects, such as NSDictionary
    and NSSet, and each has a slightly different use. An array is an ordered list
    of objects that are accessed by an index. Other languages call it a list or a
    vector. NSArray is immutable, which means you cannot add or remove objects after
    the array is instantiated. You can, however, access objects within the array.
    NSArray''s mutable subclass, NSMutableArray, lets you add and remove objects dynamically.


    In Objective-C, an array does not actually contain the objects that belong to
    it; it holds a pointer (a reference) to each object. When an object is added to
    an array,


    ```

    [array addObject:object];

    ```


    the address of that object in memory is stored inside the array.


    Arrays can hold any type of Objective-C object. This means primitives and C structures
    cannot be added to an array. For example, you cannot have an array of ints. Also,
    because arrays only hold a pointer to an object, you can have objects of different
    types in a single array. This is different from many other compiled languages
    where an array can only hold objects of its declared type.


    Note that you cannot add nil to an array. If you need to add holes to an array,
    you must use the NSNull. NSNull is an object that represents nil and is used specifically
    for this task.


    ```

    [array addObject:[NSNull null]];

    ```


    To retrieve the pointer to an object later, you send the message objectAtIndex:
    to the array,


    ```

    NSString *object = [array objectAtIndex:0];

    ```


    How do you know the order of objects in an array? When an object is added to an
    array with the message addObject, it is added at the end of the array. You can
    ask an array how many objects it is currently storing by sending it the message
    count. This information is important because if you ask for an object from an
    array at an index that is greater than the number of objects in the array, an
    exception will be thrown. (Exceptions are very bad; they will most likely ruin
