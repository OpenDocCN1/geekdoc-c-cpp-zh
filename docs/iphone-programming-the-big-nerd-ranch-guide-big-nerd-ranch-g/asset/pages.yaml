  md: '# Chapter 2. Objective-C


    iPhone applications are written in the Objective-C language, a simple extension
    of the C language. This book doesn''t have enough pages to cover the entire C
    language. Instead, this book will assume you know some C and understand the ideas
    of object-oriented programming. If C or object-oriented programming makes you
    feel uneasy, Kochan''s Programming in Objective-C is a worthwhile read.


    In this chapter, you will learn the basics of Objective-C and create RandomPossessions,
    a command-line tool that you will reuse in an iPhone application later in the
    book. (So even if you''re familiar with Objective-C, you''ll still want to go
    through this chapter in order to create RandomPossessions.)


    # Objects


    Let''s say you need a way to represent a car. That car has few attributes that
    are unique to it, like a model name, four wheels, a steering wheel and whatever
    fancy stuff they put on automobiles since the old Model T. The car can also perform
    actions, like accelerating and turning left.


    In C, you would define a structure to hold all of the data that describes a car.
    The structure would have data members, one for each of these attributes. Each
    data member would have a name and a type.


    To create an individual car, you would use the function malloc to allocate a chunk
    of memory large enough to hold the structure. You would write C functions to set
    the value of its attributes and perform actions.


    In Objective-C, instead of using a structure to represent a car, you would use
    a class. Following the car analogy, think of this class as a car factory. When
    you write the Car class, you would build a factory that knows how to create cars.


    When you ask the Car class to make you car, you get back a car object. This object,
    like all objects, is a chunk of data allocated from the heap. The car object is
    an instance of the Car class, and it stores the values for its attributes in instance
    variables (Figure 2.1).'
