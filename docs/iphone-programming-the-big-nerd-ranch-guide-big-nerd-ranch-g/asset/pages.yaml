    When a UITextField receives a touch, it becomes a special type of responder: the
    first responder. On the iPhone, the first responder only has a few uses. (On the
    Desktop, it has significantly more.) There can only be one responder for a window
    at a time, and since there is only one window in an application, there can be
    only one first responder for an application.


    Every UIResponder has a pointer called nextResponder. A view''s nextResponder
    is typically its superview. Thus, you can think of the responder chain as a linked
    list of objects – each responder has a pointer to the next responder in the chain.


    When an object is first responder, it gets a chance to handle keyboard and motion
    events (like shakes). (Touch goes to whatever was touched first, regardless of
    what object is the first responder.) If the first responder doesn''t handle the
    event, the event is passed to its nextResponder. If the nextResponder doesn''t
    handle that, it goes to its nextResponder and so on.


    When a UITextField becomes the first responder, it slides a keyboard onto the
    screen. This keyboard will remain on the screen as long as the UITextField remains
    the first responder. When you want to dismiss the keyboard, you send the message
    resignFirstResponder to the text field that it needs.


