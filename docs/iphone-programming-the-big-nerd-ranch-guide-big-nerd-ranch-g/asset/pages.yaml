    # For the More Curious: Filtering and Frequency


    In general, there are two ways of altering the frequency of accelerometer data
    in order to suit your needs: you can change the frequency of accelerometer data
    updates and you can apply a filter to the data. An application that relies on
    accelerometer data needs to be carefully tuned to find an update interval and
    filtering algorithm that gives the user the best experience.


    Here are some examples of types of applications and their recommended update frequencies
    to give you a starting point:


    Orientation Applications


    If your application relies on the current orientation of the device, for example,
    to rotate an arrow to point in a certain direction, the accelerometer can update
    infrequently. A value of 1/20 to 1/10 seconds for the updateInterval is sufficient.


    Game Applications


    An application that uses accelerometer data as input for controlling a visual
    object in real-time needs a slightly faster update interval. For applications
    like this, the updateIntervalshould be between 1/30 to 1/60 seconds.'
