  md: '# Chapter 19. Controlling Animation With CAAnimation


    However, you can''t just pass any object you, CABasicAnimation expects the appropriate
    object determined by the key path. For scalar values, like opacity, you can wrap
    a number in an NSNumber. For properties represented by structures, like position,
    you will wrap the structures in instances of NSValue.


    ```

    CABasicAnimation *mover =

    [CABasicAnimation animationWithPath:@position];

    [mover setDuration:1.0];

    [mover setFromValue:[NSValue valueWithCGPoint:CGPointMake(0.0, 100.0)]];

    [mover setToValue:[NSValue valueWithCGPoint:CGPointMake(100.0, 100.0)]];

    ```


    The difference between CABasicAnimation and CAKeyframeAnimation that basic animations
    only interpolate two keyframes can interpolate as many values as you want. For
    a CAKeyframeAnimation, the values are put into an NSArray in the order they are
    to occur. This array is then set as the values property of the CAKeyframeAnimation
    instance.


    ```

    CAKeyframeAnimation *mover =

    [CAKeyframeAnimation animationWithPath:@position];

    NSArray *vals=[NSMutableArray array];

    [vals addObject:[NSValue valueWithCGPoint:CGPointMake(0.0, 100.0)]];

    [vals addObject:[NSValue valueWithCGPoint:CGPointMake(100.0, 100.0)]];

    [mover setValues:vals];

    [mover setDuration:1.0];

    ```


    Each value is called a keyframe. Keyframes are the values that the animation will
    interpolate through each of these keyframes over its duration, interpolating between
    each one. A basic animation is actually the same thing as a keyframe animation
    except it is limited to only two keyframes. Regardless of type of animation object
    is used, the values are called keyframes.(CAKeyframeAnimation also adds the ability
    to change the timing of each of the keyframes, but that is getting a little too
    advanced for what we want to talk about right now.)


    The other two CAAnimation subclasses are used less often. CAAnimationGroup instances
    hold an array of animation objects. When one is added to a layer, all of the animations
    in the group will run concurrently.'
