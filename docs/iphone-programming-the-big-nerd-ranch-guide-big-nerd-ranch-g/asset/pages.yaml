  md: '# Chapter 12. UIINavigationController


    Of course, you then need to create an instance of ItemDetailViewController.

    Where this object was created and what object should hold the pointer to it? Think
    back to previous exercises where you instantiated all of your controllers in the
    method application:didFinishLaunchingWithOptions: For example, in the tab bar
    controller, you created view controllers and immediately added them to tab bar
    viewControllers.


    However, when using a UINavigationController, you cannot simply store all of the
    possible view controllers in its stack. The viewControllers array of a navigation
    controller is dynamic – you start with a view controller and additional view controllers
    depending on user input. Therefore, some other object than the navigation controller
    needs to own the instance of ItemDetailViewController and is responsible for adding
    to the stack. This owner needs two things: it needs to know how to push ItemDetailViewController
    onto the stack, and it needs a pointer to the navigation controller. Why must
    this object have a pointer to the navigation controller? If it is to dynamically
    add view controllers to the navigation controller''s stack, it must be able to
    send the navigation controller messages, namely, pushViewController:


    Whenever a row is tapped in a table, the view delegate receives the message tableView:didSelectRowAtIndexPath:
    ItemsViewController knows when to push the other view controller on the stack.
    Furthermore, when a view controller belongs to a navigation controller''s stack,
    it can be sent the message navigationController to get a pointer to the navigation
    controller it belongs to. As the root view controller, ItemsViewController always
    belongs to the navigation controller and thus can always access it.


    In any application that uses a UINavigationController, there is one root view
    controller. It often owns the next view controller, and the next view controller
    owns the one after that and so on. Some applications, like the Photos application,
    may have more than one combination of controllers that can be on the stack at
    a given time. In Photos, there are four view controllers:


    # AlbumListViewController


    This view controller displays a list of all the albums in the user''s library.
    It is the root view controller.


    # AlbumViewController


    This view controller displays thumbnails for all of the videos and images.'
