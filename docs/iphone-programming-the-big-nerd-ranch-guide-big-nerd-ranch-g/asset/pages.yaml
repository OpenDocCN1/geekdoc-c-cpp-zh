    # For the More Curious: Retain Cycles


    A view hierarchy is made up of many parent-child relationships. When we talk about
    hierarchies, we call parents superviews and their children subviews. When a view
    is added to a view hierarchy, it is retained by its supervise as


    ![](img/f6c6f47463c37c27b423c6082ee341bb_130_0.png)


    Figure 6.8. View hierarchy ownership


    It is sometimes necessary for a subview to send a message to its supervise. Every
    subview, then, has a pointer back to its supervise. The supervise'
  merge: -1
