  md: '# Chapter 3. Memory Management


    Understanding memory management in the Cocoa Touch framework is one of the first
    major roadblocks for newcomers. Unlike Objective-C on the Mac, Objective-C on
    the iPhone has no garbage collector. Thus, it is your responsibility to clean
    up after yourself.


    # Memory Management Concepts


    This book assumes you are coming from a C background, so the words "pointer,"
    "allocate," and **deallocate** shouldn''t scare you. If your memory is a little
    fuzzy, here''s a review. The iPhone has a limited amount of random access memory.
    Random access memory (RAM) is much faster to write and read from than a hard drive,
    so when an application is executing, all of the memory it consumes is taken from
    RAM. When an operating system like iOS launches your application, it reserves
    a heap of the system''s unused RAM for your application. Not-so-incidentally,
    the memory your application has to work with is called the heap. The heap is your
    application''s playground; can it do whatever it wants to it, and it won''t affect
    the rest of the OS or any other applications.


    When your application creates an instance of a class, it goes to the giant heap
    of memory it was given and takes a little scoop. As you typically create objects
    during the course of your application''s execution, you start using and more of
    the heap. Most objects are not permanent, and when an object is no longer needed,
    the memory it was consuming should be returned to the heap. This way, it can be
    reused for another object created later.


    There are two major problems in managing memory:


    +   premature deallocation


    +   You must never return memory to the heap until you are sure that no part of
    the program is still using it. When a chunk of memory is no longer needed by any
    part of a program, it must be freed so that the memory can be used again.


    +   memory leaks'
