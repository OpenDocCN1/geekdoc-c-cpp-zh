  md: '# Chapter 23. Localization


    The appeal of the iPhone is global – iPhone users live in many different countries
    and speak many different languages. You can ensure that your application is ready
    for this global audience through the processes of internationalization and localization.
    Internationalization is making sure your native cultural information is not hard-coded
    into your application. (By cultural information, we mean language as well as currency,
    date formats, number formats, and more.) Localization, on the other hand, is providing
    the appropriate data in your application based on the user''s settings. Two user
    settings are involved in localization: Language and Region Format. You can find
    both in the Settings application by selecting the General row and then the International
    row.


    Figure 23.1. International Settings


    ![](img/f6c6f47463c37c27b423c6082ee341bb_385_0.png)


    Incredibly, Apple makes these processes simple. An application that takes advantage
    of the localization APIs does not even need to be recompiled to be distributed
    in other languages or regions. (By the way, internationalization and'
