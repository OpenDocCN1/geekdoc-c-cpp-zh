    Build and run the application again. Make sure the Debugger Console is visible
    so you can see the SQL logging. Add a few locations and inventory items; then
    navigate around the app looking at them. Notice that managed objects are fetched
    in a lazy manner. This is done with faults.


    Managed objects can have a relationship to another entity, either to-one or to-many
    (recall that you created relationships for managed objects earlier in this chapter
    in your Inventory.xcdatam file). If a managed object has a relationship, when
    it is fetched, the objects at the other end of the relationship are not fetched.
    Instead fault objects are created. There are to-many faults (which stand for sets)
    and to-one faults (which stand for managed objects). So, for example, when the
    locations are fetched, the instances of Inventory and Asset are not. The relationship
    inventories is represented by a to-many fault that is pretending to be a set (Figure
    27.19).


    # Figure 27.19. Faults


    | Location "Classroom Closet" | inventories | To-many fault |

    |---|---|---|n| Location "Atlanta Storage Space" | inventories | To-many fault
    |


    When you send a message to a set, it might actually be a fault, but luckily your
    code doesn''t need to know or care about that. If the set is a fault, Core Data
    will fetch the objects for that relationship as shown in Figure 27.20. (In practice,
    the message count usually triggers the to-many fault.)'
