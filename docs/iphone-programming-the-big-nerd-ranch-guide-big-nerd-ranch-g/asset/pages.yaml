  md: '# Chapter 15. Low-Memory Warnings


    The iPhone, while extremely powerful, still has its limitations. One of the most
    important and often overlooked limitations is the amount of memory an application
    can consume before the device simply gives up. iPhone OS constantly monitors an
    application''s memory usage and alerts the application when it is in danger of
    running out of memory.


    When the operating system detects that it is low on memory, it sends your application
    a low-memory warning. A low-memory warning will occur when the device is consuming
    a large percentage of the available RAM. Overuse of graphical memory is typically
    the reason why an application receives a low-memory warning. Apple suggests that
    you don''t use more than 24 MB of graphics memory. For an image the size of the
    iPhone screen, the amount of memory used is over half a megabyte. UIView, image,
    Core Animation layer, and anything else that can be displayed on the screen consumes
    some of the allotted 24 MB. (Apple doesn''t suggest any maximum for other types
    of data like NSStrings.)


    It is up to your application to release reload-resources or unneeded memory back
    to the heap. If your application does not release memory for the operating system
    to continue running, iPhone OS will terminate your application. Unfortunately,
    there is no indication of how much memory should be released or at what percentage
    of used memory a low-memory warning occurs. Therefore, handling a low-memory warning
    is not an exact science, and you should simply free any memory that you can.


    # Handling Low-Memory Warnings


    When an application receives a low-memory warning, it forwards that event to its
    delegate by sending the message applicationDidReceiveMemoryWarning: as shown in
    Figure 15.1. You can also register any object for the low-memory warning notification:
    UIApplicationDidReceiveMemoryWarningNotification.'
