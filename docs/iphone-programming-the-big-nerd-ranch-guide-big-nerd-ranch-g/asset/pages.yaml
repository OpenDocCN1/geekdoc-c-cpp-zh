  md: '# UIINavigationController


    When you have an application that presents multiple screens of information, UINavigationController
    maintains a stack of those screens. The stack is an NSArray of view controllers,
    and each screen is the view instance controlled by. When a ViewController is on
    top of the stack, the view is visible.


    When you initialize an instance of UIINavigationController, you give it one ViewController.
    This ViewController is called the root view controller, and its position in the
    stack is shown in Figure 12.2. The Homepage application, the root view controller
    will be ItemsViewController. It is the first screen the sees and can navigate
    from


    # Figure 12.2. UINavigationController''s stack


    ![](img/f6c6f47463c37c27b423c6082ee341bb_210_0.png)


    The view is always at the bottom of the stack (which is also the top if there
    is only one item). More UIViewControllers can be pushed on top of this stack during
    execution. When this happens, the view of the pushedViewController slides onto
    the screen. When the stack is popped, the top view is removed from the stack,
    and the view of the one below slides onto the screen. This ability to add to the
    stack during execution is missing UITabBarController, which must have all of the
    view controllers it maintains at initialization time. Navigation controllers are
    more dynamic, and only the root view'
  merge: -1
