  md: '# Chapter 4. Delegation and Core Location


    In this chapter we introduce delegation, a recurring design pattern of Cocoa Touch
    development, and demonstrate its use with the Core Location service, which provides
    the location-finding features of the iPhone.


    # Delegation


    We spend a lot of time sending messages to objects. Sometimes, however, we want
    objects to send messages to us – a callback. A callback is a function that is
    triggered when an event occurs. Usually, for user input. We don''t exactly know
    when this event might occur, but we set up a callback so that when it occurs,
    our code will be called. In some systems, callbacks are sent to objects that are
    known as listeners.


    In Cocoa Touch, callbacks are implemented using a technique known as delegation.
    Let''s start with an example. Every instance of UITextView has a delegate property,
    which is a pointer to an object. That object is “the delegate” of the text view.
    You can set that pointer to refer to any object, as long as object conforms to
    the protocol of the class for which it is. For instance, when you create a class
    that will be a delegate, you need to conform to the UITextDelegate protocol. You
    declare protocols a class by listing the names of the protocols in a comma-delimited
    list in angle brackets after the name of the superclass:


    ```

    // SuperGoodController conforms to the UITextDelegate

    // and SomeOtherDelegate protocol.

    @interface SuperGoodController : NSObject

    <UITextDelegate, SomeOtherDelegate>

    ```


    A protocol is a simple list of declarations (Other languages, like Java, sometimes
    call them interfaces). When a class conforms to a protocol, it is promising to
    implement all required methods from that protocol and reserving the option to
    implement any optional methods. For example, here is the protocol that declares
    all the delegate methods for UITextView:


    ```

    @protocol UITextDelegate

    ```


    ```

    - (BOOL)textViewShouldBeginEditing:(UITextView *)textView;

    ```'
