    # For the More Curious: Paging


    Some applications, like Weather, allow you to “page” through views by swiping
    your finger from left to right. People occasionally mimic this behavior for something
    UITabController can do. It is actually the work of another class you have already
    used, UIScrollView.


    Each page is a UIView subclass. All of the pages are typically controlled by a
    single UIViewController, and the UIScrollView is responsible for managing which
    view is currently on screen. Actually not a whole lot to once you have used UIScrollView.


    Let’s say you wanted views to be pages within a UIScrollView that is controlled
    by UIViewController. The view controller’s view would be an instance of UIViewController,
    and the view subviews would be the two pages.


    ```

    (void)loadView

    CGRect frame = [[UIScreen mainScreen] applicationFrame];nUIS *sv = [[UIS alloc]
    initWithFrame:frame] autorelease];


    frame.origin.y = 0;

    UIView *aView = [[UIView alloc] initWithFrame:frame] autorelease];


    frame.origin.x += frame.size.width;

    UIView *bView = [[UIView alloc] initWithFrame:frame] autorelease];


    [aView setBackgroundColor:[UIColor redColor]];

    [bView setBackgroundColor:[UIColor greenColor]];


    [sv addSubview:aView];

    ```


