    Just declaring these properties doesn''t implement the accessor methods; you have
    to synthesize them. To do this, turn to the second file associated with an Objective-C
    class – the implementation file with the .m extension. This file is where you
    implement all of your methods and synthesize any properties. Synthesizing properties
    defines their accessor methods.


    At the top of an implementation file, you always import the header (.h) file of
    that class. The implementation of a class needs to know how it has been declared.
    All of the method definitions in the implementation file will be inside an implementation
    block. An implementation block begins with the @implementation keyword followed
    by the name of the class that is being implemented. Methods are defined until
    you close the block with the @end keyword.


    Open Possession.m. Use the @synthesize keyword followed by a comma-delim list
    of all properties you are synthesizing. Remember that this must occur inside the
    implementation block.


    ```

    #import "Possession.h"

    @implementation Possession

    @synthesize possessionName, serialNumber, valueInDollars, dateCreated;

    ```'
