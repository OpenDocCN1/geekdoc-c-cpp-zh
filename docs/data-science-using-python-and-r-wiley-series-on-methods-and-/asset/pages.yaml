  md: 'Let us compare the prior probability of a wine being red to the posterior probability
    of a wine being red given its alcohol and sugar contents is low. The probability
    of a randomly selected wine being red is p(Type = Red) = 50%. However, after we
    took into account that the wine had low alcohol and sugar content, the probability
    of it being a red wine rose to 72.15%? Why? Because the data told us that red
    wines were more likely to be low in alcohol compared to their white wine counterparts
    (56.4% compared to 46.4%) and that they were also more likely to be low in sugar
    content compared to their white wine counterparts (76.8% compared to 40%). Naive
    Bayes took this information into account and used it to say that a wine low in
    alcohol and sugar is more likely to be red than white.


    What about a wine that has a high alcohol and high sugar content? We use the same
    formulas as above, changing the X'' values to reflect our new values. We want
    to compare two posterior probabilities:


    +   - p(Y = y_1 | X'') = p(Red | Alcohol_flag = High, Sugar_flag = High)

    +   - p(Y = y_1 | X'') = p(White | Alcohol_flag = High, Sugar_flag = High)


    Let us start with p(Red | Alcohol_flag = High, Sugar_flag = High).


    ```

    p(Y = y_1 | X'') = \frac{p(X'' | Y = y_1) p(Y = y_1)}{p(X'')}

    = \frac{p(Alcohol\_flag = High, Sugar\_flag = High | Red) \times p(Red)}{p(Alcohol\_flag
    = High, Sugar\_flag = High)}

    = \frac{p(Alcohol\_flag = High | Type = Red) \times p(Sugar\_flag = High | Type
    = Red) \times p(Red)}{p(Alcohol\_flag = High) \times p(Sugar\_flag = High)}

    ```


    Plugging in the specific probabilities into the above formula, we obtain our posterior
    probability:


    ```

    \frac{0.436 \times 0.232 \times 0.5}{0.486 \times 0.416} = 0.2502

    ```


    The probability that the wine is red given that its alcohol and sugar contents
    are high is about 25.02%.


    Next, p(White | Alcohol_flag = High, Sugar_flag = High).


    ```

    p(Y = y_1 | X'') = \frac{p(X'' | Y = y_1) p(Y = y_1)}{p(X'')}

    = \frac{p(Alcohol\_flag = High, Sugar\_flag = High | White) \times p(White)}{p(Alcohol\_flag
    = High, Sugar\_flag = High)}

    = \frac{p(Alcohol\_flag = High | Type = White) \times p(Sugar\_flag = High | Type
    = White) \times p(White)}{p(Alcohol\_flag = High) \times p(Sugar\_flag = High)}

    ```'
