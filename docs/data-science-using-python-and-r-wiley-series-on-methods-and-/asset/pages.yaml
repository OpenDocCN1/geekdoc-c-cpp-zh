    model unstable.


    # 12.3 IDENTIFYING MULTICOLLINEARITY USING VARIANCE INFLATION FACTORS


    However, suppose we did not check for the presence of correlation among our predictors,
    and went ahead and performed the regression anyway. Is there some way that the
    regression results can warn us of the presence of multicollinearity? The answer
    is yes: We may ask for the variance inflation factors (VIFs) to be reported.


    The VIF for the ith predictor is given by:


    ```

    VIF_i = \frac{1}{1 - R_i^2}

    ```'
