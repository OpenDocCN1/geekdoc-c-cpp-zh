    # 9.4 THE SIGMOID ACTIVATION FUNCTION


    A common activation function is the sigmoid function


    y = f(x) = \frac{1}{1 + e^{-x}}


    Why use the sigmoid function? Because it combines nearly linear behavior, curvilinear
    behavior, and nearly constant behavior, depending on the value of the input. Figure
    9.4 shows the graph of the sigmoid function for -5 << x < 5. Through much of the
    center of the domain of the input x (e.g., -1 < x < 1), the behavior of f(x) is
    nearly linear. As the input moves away from the center, f(x) becomes curvilinear.
    By the time the input reaches extreme values, f(x) becomes nearly constant. Moderate
    increments in the value of x produce varying increments in the value of f(x),
    depending on the location of x. Near the center, moderate increments in the


    ![](img/fbc96b887811576a0dc93355dce68ae3_143_0.png)


    Figure 9.4 Graph of the sigmoid function y = f(x) = 1/(1 + e^-x).'
