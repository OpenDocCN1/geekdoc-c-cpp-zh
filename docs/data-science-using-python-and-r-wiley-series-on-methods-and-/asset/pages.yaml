    # 2.4.6 Accessing Records and Variables in R


    As with Python, there will be times when you want R to give you a particular record
    or variable. For example, how do we access the first record in the bank_train
    data set? Or the age variable in that data set?


    R references its records starting at one, so if we want to view the first record
    we request record 1. For example, to access the first record in the bank_train
    data set, use the following code:


    ```

    bank_train[1, ]

    ```


    Note that there is no separate command to use to isolate a particular record.
    Instead, bracket notation is used. The structure of the bracket notation is:


    ```

    data_set_name[ rows of interest , columns of interest ]

    ```


    Note that there should be no space between the data set name and the open bracket.


    Let us take a look at some examples. The data set we will work with is named bank_train.
    Since we are interested in the first row, we put a 1 in the rows of interest area.
    Currently, there are no columns of interest, so we leave that input blank.


    ```

    bank_train[ 1, ]

    ```


    If you want the first, third, and fourth record, use the following code:


    ```

    bank_train[c(1,3,4), ]

    ```


    We specify the rows of interest using the 1, 3, 4 input. Enclosing those numbers
    within a c() command tells R that all those numbers belong together, so they are
    all considered rows of interest. Since columns of interest are not specified,
    all columns will be returned. The output (showing only the first four columns)
    is shown in Figure 2.19.'
