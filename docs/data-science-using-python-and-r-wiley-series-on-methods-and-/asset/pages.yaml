- pgno: 185
  md: '# 12.4 PRINCIPAL COMPONENTS ANALYSIS


    So, now that we have identified the multicollinearity among our predictors, what
    do we do now?


    One solution is to apply principal components analysis. Principal components analysis
    (PCA) seeks to account for the correlation structure of a set of predictor variables,
    using a smaller set of uncorrelated linear combinations of these variables, called
    components. The total variability produced by the complete set of m predictors
    can often be mostly accounted for by a smaller set of k<m components. This means
    that there is almost as much information in the k components as there is in the
    original m variables. In addition, the k components are uncorrelated with each
    other, unlike the original correlated predictors. If desired, the analyst can
    then replace the original m variables with the k<m components, so that the working
    data set now consists of n records on k components, rather than n records on m
    predictors. This is dimension reduction!


    The analyst should note that PCA acts solely on the predictor variables and ignores
    the target variable. Also, the predictors should be either standardized or normalized.
    Mathematically, the principal components are uncorrelated linear combinations
    Y of predictors, with the following characteristics:


    +   - The first principal component is usually the most important. It accounts
    for greater variability among the predictors than any other component.

    +   - The second principal component accounts for the second-most variability
    and is uncorrelated with the first.

    +   - The third principal component accounts for the third-most variability and
    is uncorrelated with the first two, and so on.


    # 12.5 AN APPLICATION OF PRINCIPAL COMPONENTS ANALYSIS


    To illustrate the application of PCA, we turn to the clothing_store_PCA_training
    and clothing_store_PCA_test data sets. We are interested in estimating the response
    Sales per Visit using the predictors Purchase Visits, Days on File, Days between
    Purchases, Different Items Purchased, and Days since Purchase. However, Figure
    12.6 shows that there is substantial correlation among the predictors. In addition,
    Figure 12.7, showing the regression of Sales per Visit versus the predictors,
    indicates some moderately inflated VIF metrics.


    We therefore perform PCA on these predictors, using varimax rotation on the training
    data set.


    Rotating the PCA solution helps in the interpretability of the components. Examining
    the rotated components in Figure 12.8, we find that, if we extract only the first
    principal component, we will account for only 31.3% of the variance among the
    predictors. If we extract two components, we account for about 52.2% (see Cumulative
    Var in Figure 12.8), and so on. So, the question arises, how many components should
    we extract?'
  merge: -1
  img_proc: true
