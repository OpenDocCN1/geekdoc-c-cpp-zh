  md: 'Note that we multiply the resulting table by 100 to obtain percentages instead
    of proportions. In addition to the sum() and div() commands, we put the code for
    the table inside a round() command. The round() command will round the numbers
    in the table to the specified number of significant digits; here, we specify one
