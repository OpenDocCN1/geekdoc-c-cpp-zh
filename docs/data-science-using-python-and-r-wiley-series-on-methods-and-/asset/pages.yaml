    pairs(x = cereals[, c(10, 8, 11)], pch = 16)

    ```


    The command for the scatterplot matrix is pairs(). The required input is x, which
    asks for the columns to include in the scatter matrix. We specify the columns
    using cereals[ , c(10, 8, 11)]. An optional input pch = 16 will change the scatterplot
    points from open circles to closed circles.


    To calculate VIFs, we first need to install and open the car package.


    ```

    install.packages("car") ; library(car)

    ```


    Once the car package is open, we build the model whose coefficients we want to
    examine for multicollinearity and save the model output.


    ```

    model03 <- lm(formula = Rating ~ Fiber + Potass + Sugars, data = cereals)

    ```


    Finally, we use the vif() command on the model.


    ```

    vif(model03)

    ```


