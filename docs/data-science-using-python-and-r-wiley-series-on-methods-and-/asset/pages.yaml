- pgno: 162
  md: 'model parameters using sample data represents classical statistical inference.
    The Data Science Methodology outlined in Chapter 1, however, employs cross-validation
    rather than classical statistical inference to validate model results. Thus, in
    this book, we will bypass the parametric regression equation above, in favor of
    a descriptive approach to regression modeling, using the following regression
    equation:


    ```

    \hat{y} = b_0 + b_1x_1 + b_2x_2 + \cdots + b_px_p

    ```


    In this regression equation, \hat{y} represents the estimated value of the target
    variable y, the b''s represent the known values of the regression coefficients,
    and the x''s represent the predictor variables.


    # 11.3 AN APPLICATION OF MULTIPLE REGRESSION MODELING


    To illustrate multiple regression, we turn to the clothing_sales_training and
    clothing_sales_test data sets. The client has some data on customer spending and
    would like to estimate Sales_per_Visit, given three predictors:


    +   - Days between purchases ("Days"). Continuous: Average number of days between
    purchases.)

    +   - Credit Card ("CC"). Flag: Does the customer have a store credit card?)

    +   - Web Account ("Web"). Flag: Does the customer have a web account?)


    So, our provisional regression equation will be:


    ```

    Sales per Visit=b_0+b_1(Days between purchases)+b_2(Credit Card)+b_3(Web Account)

    ```


    Because there is only one continuous predictor, it is not necessary to standardize
    the predictors. The results of the regression of Sales per Visit vs the three
    predictors for the training set are shown in Figure 11.1. We use the p-values
    as a guide to tell us which variables belong in the model. Note that we are not
    performing inference as such (the usual domain of p-values), because we will be
    careful to cross-validate these results with the test data set. The usual p-value
    cutoff for retaining variables in a regression model is about 0.05, though cutoff
    values differ from field to field. Variables with p-values lower than the cutoff
    are retained in the model.


    From Figure 11.1, we see that Web Account, with a p-value of 0.533, does not belong
    in the model. The regression results for the test data set in Figure 11.2 concur
    that Web Account does not belong in the model. This leaves us with our regression
    equation as:


    ```

    Sales per Visit = b_0 + b_1(Days between purchases) + b_2(Credit Card)

    ```'
