    This exercise demonstrates two best practices when working with bar graphs.


    # Best Practices: Bar Graphs


    +   - When a bar graph with overlay is unclear regarding the response proportion,
    supplement it with a normalized bar graph.

    +   - However, never provide a normalized bar graph without its non-normalized
    version, because the normalized version gives no indication of the original distribution
    (how many records in each category).


    # 4.2.1 How to Construct a Bar Graph with Overlay Using Python


    Load the required package and read in the bank_marketing_training data set as
    bank_train.


    ```

    import pandas as pd

    bank_train = pd.read_csv("C:/.../bank_marketing_training")

    ```


    The first step in creating a bar graph is to create a contingency table of the
    values in the predictor and target variables. We create the table using the crosstab()
    command.


    ```

    crosstab_01 = pd.crosstab(bank_train[''previous_outcome''], bank_train[''response''])

    ```


    This code will be examined in detail a bit later. For now, we save the table as
    crosstab_01.


    Now, we can create the bar graph based on the table.


    ```

    crosstab_01.plot(kind=''bar'', stacked = True)

    ```


    To create the bar graph, append .plot() to the end of the crosstab_01 object.
    The plot() command takes various optional input values. We specify the input kind
    = ''bar'' to plot a bar graph and stacked = True to specify a stacked bar graph.


    To create a normalized version, we need to change the table so that the values
    in each cell are the proportions of "no" and "yes" response values within each
    value of the predictor previous_outcome, as follows:


    ```

    crosstab_norm = crosstab_01.div(crosstab_01.sum(1), axis = 0)

    ```'
