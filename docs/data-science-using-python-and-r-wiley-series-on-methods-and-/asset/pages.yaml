    +   3. Exploratory Data Analysis Phase

    +   4. Setup Phase.


    We are ready to finally begin modeling our data, in the Modeling Phase. Data science
    offers a wide variety of methods and algorithms for modeling large data sets.
    We begin here with one of the simplest methods: decision trees. In this chapter
    we will work with the adult_ch6_training and the adult_ch6_test data sets. These
