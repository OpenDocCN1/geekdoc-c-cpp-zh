  md: 'c. Apply error costs intrinsic to the data, because data-driven cost evaluation
    is the best way to model the actual costs involved. For instance, in a marketing
    campaign, a false positive is not as costly as a false negative. However, for
    a mortgage lender, a false positive is much more costly.


    d. You should tabulate a suite of models and determine which model performs the
    best. Choose either a single best model, or a small number of models, to move
    forward to the Deployment Phase.


    The Evaluation Phase is covered in Chapter 7.


    # 7. Deployment Phase. Finally, your models are ready for prime time! Report to
    management on your best models and work with management to adapt your models for
    real-world deployment.


    +   a. Writing a report of your results may be considered a simple example of
    deployment. In your report, concentrate on the results of interest to management.
    Show that you solved the problem and report on the estimated profit, if applicable.


    +   b. Stay involved with the project! Participate in the meetings and processes
    involved in model deployment, so that they stay focused on the problem at hand.


    It should be emphasized that the DSM is iterative and adaptive. By *adaptive*,
    we mean that sometimes it is necessary to return to a previous phase for further
    work, based on some knowledge gained in the current phase. This is why there are
    arrows pointing both ways between most of the phases. For example, in the Evaluation
    Phase, we may find that the model we crafted does not actually address the original
    problem at hand, and that we need to return to the Modeling Phase to develop a
    model that will do so.


    Also, the DSM is *iterative*, in that sometimes we may use our experience of building
    an effective model on a similar problem. That is, the model we created serves
    as an input to the investigation of a related problem. This is why the outer ring
    of arrows in Figure 1.1 shows a constant recycling of older models used as inputs
    to examining new solutions to new problems.


    # 1.4 DATA SCIENCE TASKS


    The most common data science tasks are the following:


    +   - Description

    +   - Estimation

    +   - Classification

    +   - Clustering

    +   - Prediction

    +   - Association'
