    A quantitative variable takes numeric values and allows arithmetic to be meaningfully
    performed on it. The quantitative variables in Table A.1 are income and year.
    Quantitative variables are also called numerical variables.


    +   Data may be classified according to four levels of measurement: nominal, ordinal,
    interval, and ratio. Nominal and ordinal data are categorical. interval and ratio
    data are numerical.


    +   Nominal data refer to names, labels, or categories. There is no natural ordering,
    nor may arithmetic be carried out on nominal data. The nominal variables in Table
    A.1 are marital status, mortgage, and risk.


    +   Ordinal data can be rendered into a particular order. However, arithmetic
    cannot be meaningfully carried out on ordinal data. The ordinal variable in Table
    A.1 is income rank.


    +   Interval data consist of quantitative data defined on an interval without
    a natural zero. Addition and subtraction may be performed on interval data. The
    interval variable in Table A.1 is year. (Note that there is no “year zero.” The
    calendar goes from 1 BCE to 1 CE)


    +   Ratio data are quantitative data for which addition, subtraction, multiplication,
    and division may be performed. A natural zero exists for ratio data. The interval
    variable in Table A.1 is income.


    +   A numerical variable that can take either a finite or a countable number of
    values is a discrete variable, for which each value can be graphed as a separate
    point, with space between each point. The discrete variable in Table A.1 is year.


    +   A numerical variable that can take infinitely many values is a continuous
    variable, whose possible values form an interval on the number line, with no space
    between the points. The continuous variable in Table A.1 is income.'
