  md: '# 8.5 APPLICATION OF NAÏVE BAYES CLASSIFICATION


    We will use the wine_flag_training and wine_flag_test data sets to demonstrate
    how we use Naive Bayes to classify a response variable. Let us say we want to
    predict whether a wine is red or white based on whether the wine has high or low
    alcohol and sugar content. Alcohol and sugar content values are considered low
    if they are below the median for that variable, and high if they are above the
    median.


    First, we construct two contingency tables, one for Type and Alcohol_flag and
    another for Type and Sugar_flag. Recall that the class values of target variable
    constitute the rows, and the class values of predictor variables constitute the
    columns. The contingency table for Type and Alcohol_flag is shown in Figure 8.1,
    while the contingency table for Type and Sugar_flag is shown in Figure 8.2.


    We can use Figures 8.1 and 8.2 to calculate the values required to perform Naive
    Bayes classification. Let us start by examining the response variable, Type. Type
    has two class levels: Red and White. Using either contingency table, we can calculate
    the prior probability of each Type class level:


    +   • p(Type = Red) = 500/1000 = 0.5

    +   • p(Type = White) = 500/1000 = 0.5


    The two type probabilities make up the two possible values of p(Y), the prior
    distribution of Type. For example, we now know that any randomly selected wine
    from this data set has a 50% chance of being a red wine.


    We use Figure 8.1 to calculate the marginal probability of the predictor variable
    Alcohol_flag. Alcohol_flag has two levels: High and Low. These two values will
    make up the distribution of the first predictor variable, p(X).


    +   • p(Alcohol_flag = High) = 486/1000 = 0.486

    +   • p(Alcohol_flag = Low) = 514/1000 = 0.514


    We now know, for example, that a randomly chosen wine from this data set has a
    48.6% probability of having a high alcohol content. Notice that this marginal
    distribution takes no account of the response values Y.


    | Type = Red | Alcohol = High | Alcohol = Low | Total |

    |---|---|---|---|

    | | 218 | 282 | 500 |

    | Type = White | 268 | 232 | 500 |

    | Total | 486 | 514 | 1000 |


    Figure 8.1 Contingency table from R for Type and Alcohol_flag.


    | Type = Red | Sugar = High | Sugar = Low | Total |

    |---|---|---|---|

    | | 116 | 384 | 500 |

    | Type = White | 300 | 200 | 500 |

    | Total | 416 | 584 | 1000 |


    Figure 8.2 Contingency table from R for Type and Sugar_flag.'
