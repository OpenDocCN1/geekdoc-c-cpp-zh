  md: '# 7.6.1 How to Perform Model Evaluation Using R


    To validate the model, we need to


    +   1. Develop Model 1 using the training data, and

    +   2. Then run the test data through Model 1.


    Read in the clothing_data_driven_training data set as clothing_train and the clothing_data_driven_test
    data set as clothing_test. Load the required package, if necessary, using library(C50).
    Run the training data set through C5.0 to obtain Model 1, using the code given
    here³. Save the result as C5.


    ```

    ```

    C5 <- C5.0(Response ~ Days.since.Purchase + Number.of.

    Purchase.Visits + Sales.per.Visit, data = clothing_train)

    ```

    ```


    Next, subset the predictor variables from the test data set into their own data
    frame.


    ```

    ```

    test.X <- subset(x = clothing_test, select = c("Days.

    since.Purchase",

    "Number.of.Purchase.Visits", "Sales.per.Visit"))

    ```

    ```


    The subset() command takes input x = clothing_test to specify what object to subset.
    For our case, we are subsetting from the clothing_test data set. The select input
    specifies the names of the variables to subset from the data. We are subsetting
    all three predictor variables, so we give the names of those variables in double
    quotes and list them inside a c() command. We save the resulting data set as test.X.


    Now, we are ready to run the test data through the training data model (Model
    1).


    ```

    ```

    ypred <- predict(object = C5, newdata = test.X)

    ```

    ```


    The predict() command requires as input the model model you are using to make
    predictions, labeled object, and the data you are using to make the predictions,
    labeled newdata. In our case, we are using C5 from the training data set as our
    model and the predictor variables from the test data set.


    The output of the predict() command when using a C5.0 model as the object is a
    list of predicted target variable labels, one for each record in the test data
    set. We save this series of predictions under the name ypred. Since the response
    variable in the C5.0 model has values 0 and 1, the contents of ypred will be 0
    or 1 values for each record in the clothing_test data set.


    Now that we have the predictions, we can compare them to the actual income values
    in the test data set. We do this using a table.


    ```

    ```

    t1 <- table(clothing_test$Response, ypred)

    row.names(t1) <- c("Actual: 0", "Actual: 1")

    ```

    ```'
