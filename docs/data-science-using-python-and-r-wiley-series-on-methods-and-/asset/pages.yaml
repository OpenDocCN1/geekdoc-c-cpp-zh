    Mersenne twister: a 623-dimensionally equidistributed uniform pseudorandom number
    generator, ACM Transactions on Modeling and Computer Simulation, 8(1), 3–30, January
    1998.


    We will spend a lot more time with the sklearn package! To get more familiar with
    it, take a look at the following: F. Pedregosa, et al., Scikit-learn: machine
