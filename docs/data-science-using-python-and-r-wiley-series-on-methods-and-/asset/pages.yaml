  md: '# support = P(A ∩ B) = \frac{\text{number of transactions containing both A
    and B}}{\text{total number of transactions}}


    The **confidence** of the association rule A => B is a measure of the accuracy
    of the rule, as determined by the percentage of transactions in D containing A
    that also contain B. In other words,


    # confidence = P(B|A) = \frac{P(A \cap B)}{P(A)} = \frac{\text{number of transactions
    containing both A and B}}{\text{number of transactions containing A}}


    In the language of probability, confidence represents the conditional probability
    of B, given A.


    For example, consider the association rule, "If buy squash, then buy beans," where
    A represents squash and B represents beans. From Table 14.1, we have the following
    seven transactions where squash was bought (Table 14.2). The six transactions
    where beans were also bought are shown in bold. Thus:


    # support = P(A ∩ B) = \frac{\text{transactions containing both A and B}}{\text{total
    transactions}} = \frac{6}{14} = 42.9\%


    # confidence = P(B|A) = \frac{\text{transactions containing both A and B}}{\text{transactions
    containing A}} = \frac{6}{7} = 85.7\%


    Another measure for quantifying the usefulness of an association rule is **lift**.
    Lift compares the confidence in using our association rule to the probability
    of just choosing the consequent at random without recourse to association rules.
    We define lift as follows:


    # Lift = \frac{\text{Rule confidence}}{\text{Prior proportion of the consequent}}


    | Transaction | Items Purchased |

    |---|---|

    | 2 | Asparagus, squash, corn |

    | 3 | Corn, tomatoes, beans, squash |

    | 6 | Squash, asparagus, beans, tomatoes |

    | 9 | Squash, asparagus, beans |

    | 11 | Green peppers, broccoli, beans, squash |

    | 12 | Asparagus, beans, squash |

    | 13 | Squash, corn, asparagus, beans |'
