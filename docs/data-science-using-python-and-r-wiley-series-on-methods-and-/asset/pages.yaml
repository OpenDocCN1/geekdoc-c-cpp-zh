- pgno: 139
  md: '# 9.1 INTRODUCTION TO NEURAL NETWORKS


    Neural networks represent an attempt at a very basic level to imitate the type
    of non-linear learning that occurs in the networks of neurons found in nature,
    such as the human brain. As shown in Figure 9.1, a neuron from the human brain
    uses dendrites to gather inputs from other neurons and combines the input information,
    generating a nonlinear response (“firing”) when some threshold is reached, which
    it sends to other neurons using the axon. Figure 9.1 also shows an artificial
    neuron model used in most neural networks. The inputs (x_i) are collected from
    upstream neurons (or the data set) and combined through a combination function
    such as summation (Σ), which is then input into a (usually nonlinear) activation
    function to produce an output response (y), which may then be channeled downstream
    to other neurons.


    The main benefit of neural networks is that they are quite robust for noisy, complicated,
    or nonlinear data, due to the nonlinear nature of the activation function. On
    the other hand, the main drawback of neural networks is that they are relatively
    opaque to human interpretation, as opposed to, say, decision trees.


    # 9.2 THE NEURAL NETWORK STRUCTURE


    Let us examine the simple neural network shown in Figure 9.2.


    A neural network consists of a layered, feedforward, completely connected network
    of artificial neurons or nodes.


    +   • The feedforward nature of the network restricts the network to a single
    direction of flow and does not allow looping or cycling.

    +   • Most networks consist of three layers: an input layer, a hidden layer, and
    an output layer.

    +     o There may be more than one hidden layer, although most networks contain
    only one, which is sufficient for most purposes.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '![](img/fbc96b887811576a0dc93355dce68ae3_140_0.png)


    Figure 9.1 Real neuron and artificial neuron model.


    ![](img/fbc96b887811576a0dc93355dce68ae3_140_1.png)


    Figure 9.2 Simple example of a neural network.


    +   - The neural network is completely connected, meaning that every node in a
    given layer is connected to every node in adjoining layers, although not to other
    nodes in the same layer.

    +   - Each connection between nodes has a weight (e.g. W<sub>i,j</sub>) associated
    with it.

    +   - At initialization, these weights are randomly assigned to values between
    0 and 1.


    The number of input nodes depends on the number and type of attributes in the
    data set. The input layer accepts inputs from the data set, such as attribute
    values, and simply passes these values along to the hidden layer without further
    processing.


    The number of hidden layers and the number of nodes in each hidden layer are both
    configurable by the analyst. How many nodes should one have in the'
