- pgno: 141
  md: 'hidden layer? Since having more nodes in the hidden layer increases the power
    and flexibility of the network for identifying complex patterns, one might be
    tempted to have a large number of nodes in the hidden layer. However, an overly
    large hidden layer leads to overfitting, memorizing the training set at the expense
    of generalizability to the validation set. If overfitting is occurring, one may
    consider reducing the number of nodes in the hidden layer. Conversely, if the
    training accuracy is unacceptably low, one may consider increasing the number
    of nodes in the hidden layer.


    # 9.3 CONNECTION WEIGHTS AND THE COMBINATION FUNCTION


    The nodes in the hidden layer and the output layer collect the inputs from the
    previous layer and combine them using a *combination function*. This combination
    function (usually summation, \(\Sigma\)) produces a linear combination of the
    node inputs and the connection weights into a single scalar value, which we will
    term *net*. Thus, for a given node \(j\),


    ```

    \(net_j = \sum_i W_{ji} x_{ij} = W_{j0} x_{0j} + W_{j1} x_{1j} + ... + W_{jI}
    x_{Ij}\)

    ```


    where \(x_{ij}\) represents the \(i\)th input to node \(j\), \(W_{ji}\) represents
    the weight associated with the \(i\)th input to node \(j\), and there are \(I+1\)
    inputs to node \(j\). Note that \(x_1, x_2, ..., x_I\) represent inputs from upstream
    nodes, while \(x_i\) represents a *constant input*, analogous to the constant
    factor in regression models, which by convention uniquely takes the value \(x_0
    = 1\). Thus, each hidden layer or output layer node \(j\) contains an “extra”
    input equal to a particular weight \(W_{j0}x_{0j} = W_{j0}\), such as \(W_{j0}\)
    for node \(B\).


    We illustrate the structure of hidden layer nodes and output layer nodes using
    the toy sample data provided in Table 9.1.


    For example, for node A in the hidden layer, we have


    ```

    \(net_A = \sum_i W_{iA} x_{iA} = W_{0A}(1) + W_{1A} x_{1A} + W_{2A} x_{2A} + W_{3A}
    x_{3A} = 0.5 + 0.6(0.4) + 0.80(0.2) + 0.6(0.7) = 1.32\)

    ```


    So, in Figure 9.3, we see that node A has combined its inputs into a *net input*
    of 1.32. Within node A, this combination function \(net_A = 1.32\) is then used
    as an input to an activation function. In biological neurons, signals are sent
    between


