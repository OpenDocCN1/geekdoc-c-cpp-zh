    # 11.6 MODEL EVALUATION FOR ESTIMATION


    We can use the regression equation to make predictions (estimates) of sales per
    visit. For example, consider Customer 1 in the training set, who goes 333days
    between purchases and who does not have a store credit card (Credit Card = 0).
    Plugging these values into the regression equation, we obtain:


