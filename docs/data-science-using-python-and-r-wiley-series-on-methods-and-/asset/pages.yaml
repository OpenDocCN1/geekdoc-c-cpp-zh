    # 6.3 THE C5.0 ALGORITHM FOR BUILDING DECISION TREES


    The C5.0 algorithm is J. Ross Quinlan''s extension of his own C4.5 algorithm for
    generating decision trees. Unlike CART, the C5.0 algorithm is not restricted to
    binary splits. The 5.0 algorithm uses the concept of information gain or entropy
    reduction to select the optimal split. Suppose that we have a variable X whose
    k possible values have probabilities p1, p2, ... pk. The smallest number of bits,
    on average per symbol, needed to transmit a stream of symbols representing the
    values of X observed is called the entropy of X, defined as


    ```

    H(X) = -\sum_j p_j \log_2(p_j)

    ```


    C5.0 uses entropy as follows. Suppose that we have a candidate split S, which
    partitions the training data set T into several subsets, T1, T2, ..., Ti. The
    mean information requirement can then be calculated as the weighted sum of the
    entropies for the individual subsets, as follows:


    ```

    H_S(T) = -\sum_{i=1}^L p_i H_i(T_i)

    ```


    where Pi represents the proportion of records in subset i. I may then define our
    information gain to be gain(S) = H(T) - Hi(T), that is, the increase in information
    produced by partitioning the training data T according to this candidate split
    S. At each decision node, C5.0 chooses the optimal split to be the split that
    has the greatest information gain, gain(S).


    Figure 6.2 shows the C5.0 decision tree output from R for the adult1_ch6_training
    data set. The root node split (Node 1) is on whether or not Cap.Gains_Losses (CGL)
    exceeds 0.05. If it does not, then the branch immediately terminates in a leaf
    node (Node 2) with a majority of records having low income. Note that Node 2 contains
    17,007 records, representing 90.7% over the data set. The remainder of the decision
    tree, Nodes 3-11, are together working with only 9.3% of the data set.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/fbc96b887811576a0dc93355dce68ae3_99_0.png)


    If CGL does exceed 0.05, then the next decision node (Node 3) is on Marital Status.
    If married, then the tree branches to Node 7. If some other marital status, the
    tree branches to Node 4, which then tests CGLs again, this time whether it exceeds
    0.289. Counterintuitively, the group with CGL > 0.289 has a lower proportion of
    high income in its Node 6, than in the lower CGL group in Node 5. Node 7 receives
    the married individuals with CGL > 0.05. It then splits on whether CGL > 0.202.
    If not, then the leaf node (Node 8) has almost all high income. If CGL > 0.202,
    one final split in Node 9 tests whether CGL > 0.423. If so, the 512 records are
    predominantly high income, otherwise not.


    There are some interesting differences between the decision trees built by CART
    and C5.0. In contrast with the C5.0 tree which shunted over 90% of the records
    to a single node, the CART tree’s root node split (Figure 6.1) on marital status
    led to a rather balanced split, probably due to the nature of the Gini Index,
    which contains the $P_k P_c$ coefficient, favoring balanced branches.


