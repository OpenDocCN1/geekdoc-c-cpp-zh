    # ## 2.2.3 Importing Packages in Python


    While many things can be done in Python “out of the box,” meaning directly after
    you download and install it, most of what we want to accomplish requires importing
    packages. Packages contain specially designed code that will enable us to perform
    complex data science tasks without writing the code ourselves. For example, in
    Chapter 6, we need to build a classification and regression tree (CART) model.
    Instead of figuring out how to build a CART model from scratch, we will import
    a package that contains that code. Once the package is imported, we can run the
    code to create a CART model.


    Some commands are specialized, such as the MultinomialNB() command in the sklearn.naive_bayes
    package (see Chapter 10). On the other hand, there are some commands that will
    be used in every chapter. These are the pandas and numpy packages. To import these
    packages, you need to type and run the following two lines of code:


    ```

    import pandas as pd

    import numpy as np

    ```


    Note that we import the packages using import. What about the as pd and as np
    afterward? The as code renames the package using a name that we can specify. We
    rename packages to make working with them easier.


    To use the commands contained in the pandas and numpy packages, we will need to
    state the package names before the command name. For example, in Section 2.2.4,
    we use the read_csv() command from pandas. To use that command, we would need
    to type pandas.read_csv(). If you are using a particular command multiple times
    or using code from a package with a long name, you will end up doing a lot of
    typing! To save some of that typing, we can give a nickname to the package. In
    the case above, we rename the pandas package as pd using as pd and rename the
    numpy package as np using as np. This is how, in Section 2.2.4, we can use the
    read_csv() command using the code pd.read_csv(). Renaming packages will save us
    a lot of typing in the long run!'
