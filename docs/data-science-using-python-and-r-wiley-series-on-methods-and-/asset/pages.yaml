  md: 'of the training data set, as shown in the leaf node in the lower right. On
    the other hand, those who are married but do not have high capital gains and losses
    represent 41% of the data set, but contain only 37% with high income. The two
    nodes in the lower right are leaf nodes because no further splits are made on
    them.


    Back at the records from the non-married marital status node, we see that a split
    has been made, also based on the normalized capital gains and losses. Individuals
    who are non-married and who do not have high capital gains and losses make up
    a full 50% of the training data set. Of these, only 4% have high income. Non-married
    people with high capital gains and losses make up only 3% of the data set, but
    have a much higher proportion of high income: 41%. A final split is made on these
    3% of the records, more finely tuning the level of capital gains and losses, with
    the higher group at 71% high income and the lower group at 19% high income. Decision
    trees stop growing when no further splits can be made.


    So, how do decision trees work? Decision trees seek to create a set of leaf nodes
    that are as “pure” as possible, that is, where each of the records in a particular
    leaf node has the same classification. In this way, the decision tree may provide
    classification assignments with the highest measure of confidence available. However,
    how does one measure uniformity, or conversely, how does one measure heterogeneity?
    We shall examine two of the many methods for measuring leaf node purity, which
    lead to the two leading algorithms for constructing decision trees:


    +   - CART algorithm

    +   - C5.0 algorithm


    # 6.2 CLASSIFICATION AND REGRESSION TREES


    The CART method produces decision trees that are strictly binary, containing exactly
    two branches for each decision node. CART recursively partitions the records in
    the training data set into subsets of records with similar values for the target
    attribute. The CART algorithm grows the tree by conducting for each decision node,
    an exhaustive search of all available variables and all possible splitting values,
    selecting the optimal split according to the Gini Index (from Kennedy et al.).


    Let \(\Phi(s|t)\) be a measure of the “goodness” of a candidate split \(s\) at
    node \(t\), where


    ```

    \(\Phi(s|t)=2P_tP_R \sum_{j=1}^{\text{\# classes}} |P(j|t_L)-P(j|t_R)|\)

    ```


    Leo Breiman, Jerome Friedman, Richard Olshen, and Charles Stone, Classification
    and Regression Trees, Chapman & Hall/CRC Press, Boca Raton, FL, 1984.


    Ruby L. Kennedy, Yuchun Lee, Benjamin Van Roy, Christopher D. Reed, and Richard
    P. Lippman, Solving Data Mining Problems through Pattern Recognition, Pearson
    Education, Upper Saddle River, NJ, 1995.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'and where


    $t_L = \text{left child node of node } t$

    $t_R = \text{right child node of node } t$

    $P_L = \frac{\text{number of records at } t_L}{\text{number of records in training
    set}}$

    $P_R = \frac{\text{number of records at } t_R}{\text{number of records in training
    set}}$

    $P(j|t_L) = \frac{\text{number of class } j \text{ records at } t_L}{\text{number
    of records at } t}$

    $P(j|t_R) = \frac{\text{number of class } j \text{ records at } t_R}{\text{number
    of records at } t}$


    Then, the optimal split is whichever split maximizes this measure $\Phi(s|t)$
    over all possible splits at node $t$. Thus, CART identified the root node split
    in Figure 6.1 as maximizing $\Phi(s|t)$ over all candidate root node splits.


    # 6.2.1 How to Build CART Decision Trees Using Python


    Load the required packages and read in the training data set as adult_tr.


    ```

    import pandas as pd

    import numpy as np

    import statsmodels.tools.tools as stattools

    from sklearn.tree import DecisionTreeClassifier, export_graphviz

    adult_tr = pd.read_csv("C:/.../adult_ch6_training")

    ```


    For simplicity, we save the Income variable as y.


    ```

    y = adult_tr[[''Income'']]

    ```


    We have a categorical variable, Marital status, among our predictors. The CART
    model implemented in the sklearn package needs categorical variables converted
    to a dummy variable form. Thus, we will make a series of dummy variables for Marital
    status using the categorical() command.


    ```

    mar_np = np.array(adult_tr[''Marital status''])

    (mar_cat, mar_cat_dict) = stattools.categorical(mar_np,

    drop_True, dictnames = True)

    ```


    We turn the variable Marital status into an array using array(), then use the
    categorical() command from the stattools package to create a matrix of dummy variables
    for each value of Marital status. We save the matrix and dictionary separately
    using (mar_cat, mar_cat_dict).'
