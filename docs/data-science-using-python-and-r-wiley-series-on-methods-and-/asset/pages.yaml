  md: '| | Predicted Category |

    |---|---|

    | | 0 | 1 |

    | Actual category 0 | Cost_00 = 0 | Cost_01 = 1 |

    | 1 | Cost_10 = 4 | Cost_11 = 0 |


    We may'' add $40 across the bottom row, and then divide all cells by $10, so that
    our adjusted cost matrix becomes Table 7.6.


    In other words, the retailer''s false negative cost is four times higher than
    the false positive cost. So, clearly, Model 1''s assumption that the two errors
    are equally costly is invalid. Instead, we should turn to a new model, Model 2,
    which incorporates the unequal error costs in Table 7.6.


    # 7.7.1 Accounting for Unequal Error Costs Using R


    Once you create a cost matrix as in Table 7.6, you can add the matrix into your
    C5.0 model. First, create the matrix itself.


    ```

    cost.CS <- matrix(c(0,4,1,0), byrow = TRUE, ncol=2)

    dimnames(cost.CS) <- list(c("0", "1"), c("0", "1"))

    ```


    It is important to note that C5.0 defines its cost matrix using the rows as the
    predicted values and the columns as the actual values (the details of this are
    contained in the C5.0 help page, which can be found by running ?C5.0). This is
    the reverse of how our cost map in Table 7.6 was defined. When we create the cost
    matrix for the C5.0 model, it will have a "1" where the "4" is in Table 7.6, and
    a "4" where the "1" is. Save the cost matrix as "cost.C5". Specifying the dimnames()
    of the cost matrix will ensure that the C5.0 algorithm identifies the different
    costs correctly.


    Now we rerun the C5.0 model, this time adding the matrix of unequal error costs.


    ```

    C5.costs <- C5.0(Response ~ Days.since.Purchase + Number.of.Purchase.Visits +
    Sales.per.Visit, data = clothing_train, costs = cost.C5)

    ```


    The code above differs from the previous R code for C5.0 in two ways. First, we
    save the model under a different name, so we do not lose the information from
    our previous model. Second, we add the input costs = cost.C5 into the C5.0() command
    to add the cost matrix to the model.'
