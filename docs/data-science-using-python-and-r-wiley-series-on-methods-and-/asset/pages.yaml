    # 4.3.2 How to Construct Contingency Tables Using R


    The command to create a table is table(), with the variables of interest inside
    the parentheses.


    ```

    t.v1 <- table(bank_train$response, bank_train$previous_outcome)

    ```


    The first variable, bank_train$response, makes up the rows, while the second variable,
    bank_train$previous_outcome, makes up the columns. We will save our table as t.v1,
    so we can edit it.


    To add row and column totals to the table, use the addmargins() command.


    ```

    t.v2 <- addmargins(A = t.v1, FUN = list(total = sum),

    quiet = TRUE)

    ```


    The input A = t.v1 specifies the table to be edited, in our case t.v1. The FUN
    = list(total = sum) input specifies a list of functions to be performed to create
    the marginal row and column. In our case, we want to create a row and column named
    total which contains the sum of the rows and columns. We save the edited table
    as t.v2. To see the finished table, run t.v2 by itself. The result is shown in
    Figure 4.4.


    Now we want to edit table t.v1 so it gives us the column percentages.


    ```

    round(prop.table(t.v1, margin = 2)*100, 1)

    ```


    To calculate the proportion of entries in the cells of the table, use prop.table().
    The input t.v1 tells prop.table() for what table to calculate proportions.


    The margin = 2 input tells R to calculate column percentages. Multiplying the
    result by 100 using *100 will give us percentages instead of proportions. Finally,
    putting the prop.table() command inside a round() command will round the entries
    to a certain number of decimal points; in our case, one (1) decimal point. The
    result is shown in Figure 4.5.


