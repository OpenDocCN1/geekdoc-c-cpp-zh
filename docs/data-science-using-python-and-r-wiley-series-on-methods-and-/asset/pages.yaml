    # 3.7 STANDARDIZING THE NUMERIC FIELDS


    Certain algorithms perform better when the numeric fields are standardized so
    that the field mean equals 0 and the field standard deviation equals 1, as follows:


    $z = Standardized Value = \frac{x - \bar{x}}{s} = \frac{Data value - mean}{Standard
    deviation}$


    Positive z-values may be interpreted as representing the number of standard deviations
    above the mean the data value lies, while negative z-values represent the number
    of standard deviations below the mean. Some analysts standardize all their'
