- pgno: 109
  md: 'TABLE 7.2 General form of contingency table, reexpressed


    | | 0 | 1 | Total |

    |---|---|---|---|

    | 0 | TN | FP | TAN |

    | 1 | FN | TP | TAP |

    | Total | TPN | TPP | GT |


    Error Rate = 1 - Accuracy = \frac{FN + FP}{TN + FN + FP + TP} = \frac{FN + FP}{GT}


    Accuracy represents an overall measure of the proportion of correct classifications
    being made by the model, while error rate measures the proportion of incorrect
    classifications, across all cells in the contingency table. However, these measures
    do not distinguish between the various types of errors or the various types of
    correct decisions. We begin to do so using sensitivity and specificity, as follows:


    # 7.3 SENSITIVITY AND SPECIFICITY


    Sensitivity = \frac{Number of true positives}{Total actually positive} = \frac{TP}{TP
    + FN}


    Specificity = \frac{Number of true negatives}{Total actually negative} = \frac{TN}{FP
    + TN}


    Sensitivity measures the ability of the model to classify a record positively,
    while specificity measures the ability to classify a record negatively. Sensitivity
    measures what proportion of all positive records are captured by your model, while
    specificity measures what proportion of all the negative records are captured
    by your model. Of course, a perfect classification model would have sensitivity
    = 1.0 = 100%. However, a model that simply classified all customers as positive
    would also have sensitivity = 1.0. Clearly, it is not sufficient to identify the
    positive responses alone. A classification model also needs to be specific, meaning
    that it should identify a high proportion of the customers who are negative. Of
    course, a perfect classification model would have specificity = 1.0. But, so would
    a model which classifies all customers as negative. A good classification model
    should have acceptable levels of both sensitivity and specificity, but what constitutes
    acceptable varies greatly from domain to domain.


    # 7.4 PRECISION, RECALL, AND F_beta SCORES


    Of the records classified by our model as positive, what proportion are true positives?
    The metric addressing this question is called precision, and is defined as follows:'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Precision = \frac{TP}{TPP}


    In the field of information retrieval (e.g. search engines) the precision metric
    answers the question, “What proportion of the selected items is relevant?” This
    metric is often paired with recall, which is just another name for sensitivity.


    Recall = Specificity = \frac{TN}{TAN}


    It would be useful to combine precision and recall into a single measure. To do
    so, we may use \( F_\beta \) scores, defined as follows:


    \( F_\beta = (1 + \beta^2) \cdot \frac{precision \cdot recall}{(\beta^2 \cdot
    precision) + recall} \)


    for \( \beta > 0 \).


    +   - When \( \beta = 1 \), this is called the harmonic mean of precision and
    recall, which are thus equally weighted in the metric \( F_1 \).

    +   - When \( \beta > 1 \), \( F_\beta \) weights recall higher than precision.

    +   - When \( \beta < 1 \), \( F_\beta \) weights recall lower than precision.

    +   - Thus, \( F_2 \) would weight recall twice as high as precision, while \(
    F_{0.5} \) would weight recall half as much as precision.


    # 7.5 METHOD FOR MODEL EVALUATION


    The general Method for Model Evaluation is given as follows. This applies to any
    classification or estimation model.


    +   **Method for Model Evaluation**

    +   1. Develop the model using the training data set.

    +   2. Evaluate the model using the data set test. That is, take the model developed
    using the training data set and apply it to the test data set. Put another way,
    pass the test set through the model generated by the training set.


    # 7.6 AN APPLICATION OF MODEL EVALUATION


    We will be working with the `clothing_data_driven_training` and `clothing_data_driven_test`
    data sets. The task is to predict whether or not customers will respond to a phone/mail
    marketing campaign, based on three continuous predictors:


    +   - Days since Purchase

    +   - # of Purchase Visits

    +   - Sales per Visit'
