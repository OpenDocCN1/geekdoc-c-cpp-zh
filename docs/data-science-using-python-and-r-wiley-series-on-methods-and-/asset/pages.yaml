  md: "```\nrules.confdiff <- apriori(data = min.churn, parameter =\nlist(arem = \"\
    diff\", aval = TRUE,\nminval = 0.4, supp = 0.01, target = \"rules\", conf\n= 0.05,\
    \ minlen = 2, maxlen = 2))\n```\n\nNote that the three new input settings under\
    \ parameter = list(). The first one, arem = \"diff\", specifies that the confidence\
    \ quotient criterion should be used. The second, aval = TRUE, states that the\
    \ value of the criterion should be reported when the results are shown. The third,\
    \ minval = 0.4, sets the lower bound of the confidence difference at 40. Save\
    \ the output as rules.confdiff.\n\nTo view the new rules, use the inspect() and\
    \ head() commands, this time using rules.confdiff as the primary input.\n\n```\n\
    inspect(head(rules.confdiff, by = \"lift\", n = 10))\n```\n\n# 14.7 THE CONFIDENCE\
    \ QUOTIENT CRITERION\n\nTo demonstrate the confidence quotient criterion, we generate\
    \ rules using a lower bound of 40 (along with minimum antecedent support of 1%,\
    \ minimum rule confidence of 5%, and maximum antecedents of 1). After removing\
    \ any rules with Churn in the antecedent, we obtain the three association rules\
    \ shown in Figure 14.7.\n\nThe confidence quotient evaluation measure gives the\
    \ absolute ratio between the prior probability of the consequence (Churn = True)\
    \ and the confidence of the rule. So, rules would be included in this case only\
    \ if:\n\n```\n{\n  1 - Rule confidence / Prior proportion of consequent >= 0.40\n\
    \  or\n  1 - Prior proportion of consequent / Rule confidence >= 0.40\n}\n```\n\
    \nwhichever is not negative.\n\n```\nlhs rhs support confidence quot 1lift count\n\
    [1] {CustServ.Calls=5} => {Churn=True} 0.01200000 0.5901639 0.7537407 4.060761\
    \ 36\n[2] {CustServ.Calls=4} => {Churn=True} 0.02266667 0.4563758 0.6815490 3.140201\
    \ 68\n[3] {Intl.Plan=yes} => {Churn=True} 0.04233333 0.4305085 0.6624147 2.962214\
    \ 127\n```\n\nFigure 14.7 Association rules in R found using confidence quotient\
    \ lower bound = 40.\n\nThe output will have rules that have Churn in the antecedent.\
    \ After subsetting only those rules without Churn in the antecedent, as demonstrated\
    \ in the previous R section, the output will match that shown in Figure 14.6."
