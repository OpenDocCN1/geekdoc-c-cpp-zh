    # ## 4.3.1 How to Construct Contingency Tables Using Python


    We had to create a contingency table in order to make a bar chart, but did not
    investigate the code in detail. Let us examine the code for the table more closely.


    ```

    crosstab_01 = pd.crosstab(bank_train[''previous_outcome''], bank_train[''outcome''])

    ```


    Note the order of the variables. The table as built by this code will have previous_outcome
    as the rows. This table created the bar chart we needed in the previous section,
    but to abide by best practice and have the target variable represent the rows,
    we need to change the code to:


    ```

    crosstab_02 = pd.crosstab(bank_train[''response''], bank_train[''previous_outcome''])

    ```


    Make sure to save the table. We save the output as crosstab_02. The result will
    be a table equivalent to Figure 4.4.


    To calculate the column proportions of the table, we need to divide each column
    by the column sum. We utilize the sum() and div() commands, in a similar way to
    the previous section. However, this time we are obtaining column, and not row,
    percentages.


    ```

    round(crosstab_02.div(crosstab_02.sum(0), axis = 1)*100, 1)

    ```'
