- pgno: 151
  md: '# CHAPTER 10

    CLUSTERING


    # 10.1 WHAT IS CLUSTERING?


    Clustering refers to the grouping of records, observations, or cases into classes
    of similar objects. A cluster is a collection of records that are similar to one
    another and dissimilar to records in other clusters. Clustering differs from classification
    in that there is no target variable for clustering. The clustering task does not
    try to classify, estimate, or predict the value of a target variable. Instead,
    clustering algorithms seek to segment the entire data set into relatively homogeneous
    subgroups or clusters, where the similarity of the records within the cluster
    is maximized and the similarity to records outside this cluster is minimized.


    For example, the Nielsen PRIZM segments, developed by Claritas, Inc., represent
    demographic profiles of each geographic area in the United States, in terms of
    distinct lifestyle types, as defined by zip code. For example, the clusters identified
    for zip code 90210, Beverly Hills, California, are:


    +   * Cluster 01: Upper Crust Estates

    +   * Cluster 03: Movers and Shakers

    +   * Cluster 04: Young Digirati

    +   * Cluster 07: Money and Brains

    +   * Cluster 16: Bohemian Mix


    The description for Cluster 01: Upper Crust is “The nation’s most exclusive address,
    Upper Crust is the wealthiest lifestyle in America, a Haven for empty-nesting
    couples between the ages of 45 and 64. No segment has a higher concentration of
    residents earning over $100,000 a year and possessing a postgraduate degree. And
    none has a more opulent standard of living.”


    Examples of clustering tasks in business and research include:


    +   * Target marketing of a niche product for a small-capitalization business
    that does not have a large marketing budget.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/fbc96b887811576a0dc93355dce68ae3_152_0.png)


    Figure 10.1 Clusters should have small within-cluster variation compared to the
    between-cluster variation.


    +   - For accounting auditing purposes, to segment financial behavior into benign
    and suspicious categories.

    +   - For gene expression clustering, where very large quantities of genes may
    exhibit similar behavior.


    Clustering is often performed as a preliminary step in a data mining process,
    with the resulting clusters being used as further inputs into a different technique
    downstream, such as neural networks. Due to the enormous size of many present-day
    databases, it is often helpful to apply clustering analysis first, to reduce the
    search space for the downstream algorithms.


    All clustering methods have as their goal the identification of groups of records
    such that similarity within a group is very high, while the similarity to records
    in other groups is very low. In other words, as shown in Figure 10.1, clustering
    algorithms seek to construct clusters of records such that the between-cluster
    variation is large compared to the within-cluster variation.


    # 10.2 INTRODUCTION TO THE K-MEANS CLUSTERING ALGORITHM


    There are many different clustering methods, including hierarchical clustering,
    Kohonen networks clustering, and BIRCH clustering.1 Here, we shall focus on the
    k-means clustering algorithm. The k-means clustering algorithm2 is a


    1For details on these clustering methods, see Data Mining and Predictive Analytics,
    Second Edition, by Daniel T. Larose and Chantal D. Larose, John Wiley and Sons,
    Inc., 2015.

    2James B. MacQueen, Some methods for classification and analysis of multivariate
    observations. In Proceedings of the 5th Berkeley Symposium on Mathematical Statistics
    and Probability, Vol. 1, pp. 281–297, University of California Press, Berkeley,
    CA, 1967.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'straightforward and effective algorithm for finding clusters in data. The algorithm
    proceeds as follows:


    +   - Step 1: Ask the user how many clusters k the data set should be partitioned
    into.

    +   - Step 2: Randomly assign k records to be the initial cluster center locations.

    +   - Step 3: For each record, find the nearest cluster center. Thus, in a sense,
    each cluster center "owns" a subset of the records, thereby representing a partition
    of the data set. We therefore have k clusters, C1, C2, ..., Ck.

    +   - Step 4: For each of the k clusters, find the cluster centroid and update
    the location of each cluster center to the new value of the centroid.

    +   - Step 5: Repeat steps 3–5 until convergence or termination.


    The "nearest" criterion in step 3 is usually Euclidean distance, although other
    criteria may be applied as well. The cluster centroid in step 4 is found as follows.
    Suppose that we have n data points (a1, b1, c1), (a2, b2, c2), ..., (an, bn, cn),
    the centroid of these points is the center of gravity of these points and is located
    at point (Σa/n, Σb/n, Σc/n). For example, the points (1,1,1), (1,2,1), (1,3,1),
    and (2,1,1) would have centroid


    \(\left( \frac{1+1+1+2}{4}, \frac{1+2+3+1}{4}, \frac{1+1+1+1}{4} \right) = (1.25,
    1.75, 1.00)\)


    The algorithm terminates when the centroids no longer change. In other words,
    the algorithm terminates when for all clusters C1, C2, ..., Ck, all the records
    "owned" by each cluster center remain in that cluster. For much more on k-means
    clustering, see Data Mining and Predictive Analytics.


    # 10.3 AN APPLICATION OF K-MEANS CLUSTERING


    We apply the k-means clustering algorithm to the white_wine_training and the white_wine_test
    data sets. These data sets are adapted from the Wine Quality data set at UCI.3
    The data consist of chemical and quality characteristics of a collection of Portuguese
    white wines. The predictors are alcohol and sugar. The target variable is quality,
    a measure of how good the wine is, according to a professional taster. When constructing
    clusters, it is important to not include the target variable as an input to the
    clustering algorithm. Doing so would bias the results if we later use the clusters
    to predict the target. It is also important to standardize or normalize all the
    predictors, so that the greater variability of one predictor does not dominate
    the cluster construction process.


    Now, the k-means algorithm requires the analyst to specify the desired number
    of clusters. For simplicity, we specify k = 2 clusters and proceed to apply


    3https://archive.ics.uci.edu/ml/datasets/wine+quality. Also P. Cortez, A. Cerdeira,
    F. Almeida, T. Matos, and J. Reis. Modeling wine preferences by data mining from
    physicochemical properties. Decision Support Systems, Elsevier, 47(4), 547-553.
    2009.'
