  md: "# 14.2 A SIMPLE EXAMPLE OF ASSOCIATION RULE MINING\n\nWe begin with a simple\
    \ example. Suppose that a local farmer has set up a roadside vegetable stand and\
    \ is offering the following items for sale: {asparagus, beans, broccoli, corn,\
    \ green peppers, squash, and tomatoes}. Denote this set of items as I.\n\nOne\
    \ by one, customers pull over, pick up a basket, and purchase various combinations\
    \ of these items, subsets of I.\n\nLet D be the set of transactions represented\
    \ in Table 14.1, where each transaction T in D represents a set of items contained\
    \ in I.\n\nSuppose that we have a particular set of items A (e.g. beans and squash)\
    \ and another set of items B (e.g. asparagus). Then, define an association rule\
    \ as follows:\n\n> An association rule takes the form:\n> \n> if A then B (i.e.\
    \ A => B).\n> \n> where the antecedent A and the consequent B are proper subsets\
    \ of I, and A and B are mutually exclusive.\n\nThis definition would exclude trivial\
    \ rules such as if beans and squash, then beans.\n\n| Transaction | Items Purchased\
    \ |\n| :--- | :--- |\n| 1 | Broccoli, green peppers, corn |\n| 2 | Asparagus,\
    \ squash, corn |\n| 3 | Corn, tomatoes, beans, squash |\n| 4 | Green peppers,\
    \ corn, tomatoes, beans |\n| 5 | Beans, asparagus, broccoli |\n| 6 | Squash, asparagus,\
    \ beans, tomatoes |\n| 7 | Tomatoes, corn |\n| 8 | Broccoli, tomatoes, green peppers\
    \ |\n| 9 | Squash, asparagus, beans |\n| 10 | Beans, corn |\n| 11 | Green peppers,\
    \ broccoli, beans, squash |\n| 12 | Asparagus, beans, squash |\n| 13 | Squash,\
    \ corn, asparagus, beans |\n| 14 | Corn, green peppers, tomatoes, beans, broccoli\
    \ |\n\n# 14.3 SUPPORT, CONFIDENCE, AND LIFT\n\nMeasures of goodness of an association\
    \ rule include support, confidence, and lift. The support for a particular association\
    \ rule A => B is the proportion of transactions in D that contain both A and B.\
    \ That is,"
