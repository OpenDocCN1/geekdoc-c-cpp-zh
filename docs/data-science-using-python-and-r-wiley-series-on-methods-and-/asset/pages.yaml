  md: '# 13.1 AN OVERVIEW OF GENERAL LINEAR MODELS


    In Chapter 11, the linear regression models we examined each had a continuous
    response variable. However, what happens if we want to build a regression model
    for a binary response instead? Or for a numeric discrete response? Luckily, there
    is a family of linear models that includes all three cases – continuous, numeric
    discrete, and binary – of regression response variables. General Linear Models
    (GLMs).


    To explain how regression for three different kinds of responses can be related,
    we will briefly take another look at the parametric regression equations for each
    case. Once we establish how they are related, we will then use their descriptive
    versions, just as we did in Chapter 11.


    Recall the parametric model for multiple regression, given here.


    $y = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + \cdots + \beta_p x_p + \varepsilon$


    The sum $\beta_0 + \beta_1 x_1 + \beta_2 x_2 + \cdots + \beta_p x_p$ is called
    the *linear predictor*. For brevity, we will write the linear predictor as \(\mathbf{X}\boldsymbol{\beta}\).
    The formula that connects the linear predictor to the mean \(\mu\) of the y variable
    at a set of given values of predictor variables is called the *link function*,
    \(g(\mu)\).


    Different link functions entail different regression models, with each link function
    associated with a particular response type. For each different response type we
    discuss, we will specify a particular \(g(\mu)\) so that \(\mathbf{X}\boldsymbol{\beta}
    = g(\mu)\), and solve for \(\mu\) to obtain the final form of the model.


    We begin by demonstrating how GLMs work by showing how linear regression can be
    expressed as a GLM. We then demonstrate two new regression models as GLMs: logistic
    regression and Poisson regression.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# ## 13.2 LINEAR REGRESSION AS A GENERAL LINEAR MODEL


    When the response variable has a Normal distribution at each set of given predictor
    variable values, then we are back in the realm of linear regression. In this realm,
    the link function is simply the identity function, where


    ```

    \( g(\mu) = \mu \)

    ```


    Setting \( X\beta \) equal to \( g(\mu) \) using this identity link gives us \(
    X\beta = g(\mu) = \mu \). Once we have a functional relationship between \( X\beta
    \) and \( \mu \), we can work backwards to obtain the final form of the regression
    model by expanding our abbreviated notation. Doing so gives us the population
    equation for linear regression:


    ```

    \( y = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + \cdots + \beta_p x_p + \varepsilon
    \)

    ```


    from which we can obtain the descriptive form


    ```

    \( \hat{y} = b_0 + b_1 x_1 + b_2 x_2 + \cdots + b_p x_p \)

    ```


    which we worked with in Chapter 11.


    # ## 13.3 LOGISTIC REGRESSION AS A GENERAL LINEAR MODEL


    Next, suppose we are trying to predict a binary response, such as whether or not
    a customer has a store credit card. In this case, the distribution of our response
    variable will be binary: 1 or 0, indicating a Yes or No.


    The link function for a binary response variable is \( g(\mu) = \ln \left( \frac{\mu}{1-\mu}
    \right) \). We set this function equal to our linear predictor \( X\beta \) to
    obtain


    ```

    \( X\beta = \ln \left( \frac{\mu}{1-\mu} \right) \)

    ```


    To isolate \( \mu \), we use the fact that \( e^{\ln(x)} = x \), and obtain


    ```

    \( \mu = \frac{e^{X\beta}}{1 + e^{X\beta}} \)

    ```


    The above formula ensures the mean value of the response variable, \( \mu \),
    will always be between zero and one. In other words, the value the regression
    model may be used to estimate the *probability* that \( y = 1 \).


    To clarify that our predicted values from logistic regression are probabilities,
    instead of binary values, let us write the regression model as predicting \( p(y)
    \), the'
  merge: -1
  img_proc: true
