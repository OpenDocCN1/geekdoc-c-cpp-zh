  md: 'c. Establishing baseline performance. Suppose we told you we had a model that
    could predict correctly whether a credit card transaction was fraudulent or not
    99% of the time. Impressed? You should not be. The non-fraudulent transaction
    rate is 99.932%. So, our model could simply predict that every transaction was
    non-fraudulent and be correct 99.932% of the time. This illustrates the importance
    of establishing baseline performance for your models, so that we can calibrate
    our models and determine whether they are any good.


    The Setup Phase is covered in Chapter 5.


    # 5. Modeling Phase.


    The modeling phase represents the opportunity to apply state-of-the-art algorithms
    to uncover some seriously profitable relationships lying hidden in the data. The
    modeling phase is the heart of your data scientific investigation and includes
    the following:


    +   a. Selecting and implementing the appropriate modeling algorithms. Applying
    inappropriate techniques will lead to inaccurate results that could cost your
    company big bucks.


    +   b. Making sure that our models outperform the baseline models.


    +   c. Fine-tuning your model algorithms to optimize the results. Should our decision
    tree be wide or deep? Should our neural network have one hidden layer or two?
    What should our cutoff point to maximize profits? Analysts will need to spend
    some time fine-tuning their models before arriving at the optimal solution.


    The modeling phase represents the core of your data science endeavor and is covered
    in Chapters 6 and 8–14.


    # 6. Evaluation Phase.


    Your buddy at work may think he has a lock on his prediction for the Super Bowl.
    But is his prediction any good? That is the question. Anyone can make predictions.
    It is how the predictions perform against real data that is the real test. In
    the evaluation phase, we assess how our models are doing, whether they are making
    any money, or whether we need to go back and try to improve our prediction models.


    +   a. Your models need to be evaluated against the baseline performance measures
    from the Setup Phase. Are we beating the monkeys-with-darts model? If not, better
    try again.


    +   b. You need to determine whether your models are actually solving the problem
    at hand. Are your models actually achieving the objectives set for it back in
    the Problem Understanding Phase? Has some important aspect of the problem not
    been sufficiently accounted for?'
