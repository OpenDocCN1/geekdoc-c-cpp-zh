- pgno: 229
  md: '![](img/fbc96b887811576a0dc93355dce68ae3_229_0.png)


    Figure A.3 Histogram of income.


    +   • A distribution of a variable is a graph, table, or formula that specifies
    the values and frequencies of the variable for all elements in the data set. For
    example, Table A.3 represents the distribution of the variable income.


    +   • A histogram is a graphical representation of a (relative) frequency distribution
    for a quantitative variable (Figure A.3). Note that histograms represent a simple
    version of data smoothing and can thus vary in shape depending on the number and
    width of the classes. Therefore, histograms should be interpreted with caution.
    See Discovering Statistics by Daniel T. Larose (W.H. Freeman) Section 2.4 for
    an example of a data set presented as both symmetric and right-skewed by altering
    the number and width of the histogram classes.


    +   • A stem-and-leaf display shows the shape of the data distribution while retaining
    the original data values in the display, either exactly or approximately. The
    leaf units are defined to equal a power of 10, and the stem units are 10 times
    the leaf units. Then, each leaf represents a data value, through a stem-and-leaf
    combination. For example, in Figure A.4, the leaf units (right-hand column) are
    1000s and the stem units (left-hand column) are 10,000s. So, “2 4” represents
    2 x 10,000 + 4 x 1000 = $24,000, while “2 55” represents two equal incomes of
    $25,000 (one of which is exact, the other approximate – $25,100). Note that Figure
    A.4, turned 90° to the left, presents the shape of the data distribution.


    +   • In a dotplot each dot represents one or more data values, set above the
    number line (Figure A.5).


    +   • A distribution is symmetric if there exists an axis of symmetry (a line)
    that splits the distribution into two halves that are approximately mirror images
    of each other (Figure A.6a).'
