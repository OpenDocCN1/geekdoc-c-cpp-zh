  md: 'To run PCA, we must first install and open the *psych* package.


    ```

    install.packages("psych"); library(psych)

    ```


    Once the package is open, we use the *principal()* command to perform PCA.


    ```

    pca01 <- principal(r = X_z, rotate = "varimax", nfactors = 5)

    ```


    We are using the *principal()* command with three input values. The input r =
    X, z specifies the variables we want to analyze. The rotate = "varimax" tells
    R to perform varimax rotation on the components before presenting the results.
    Finally, the nfactors = 5 input states that we want five components. We save the
    PCA output as pca01.


    We are interested in the loadings of the pca01 results.


    ```

    print(pca01$loadings, cutoff = 0.49)

    ```


    We use cutoff = 0.49 to suppress small PCA weights. The output generated by the
    code above is shown in Figure 12.8.


