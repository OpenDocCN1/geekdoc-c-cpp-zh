    # Best Practices: Histograms


    +   - Use a non-normalized histogram to obtain the original distribution of the
    data values.

    +   - If needed, use a normalized histogram to help better distinguish the response
    patterns.


    # 4.4.1 How to Construct Histograms with Overlay Using Python


    Load the required packages.


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    ```


    Separate the variable you want to graph by the overlay you want to use. Since
    we are creating a histogram of age using an overlay of response, we separate the
    variable age, bank_train[''age''], by the two values of the variable response.
    Save each piece as its own variable.


    ```

    bt_age_y = bank_train[bank_train.response == "yes"]

    [''age'']

    bt_age_n = bank_train[bank_train.response == "no"]

    [''age'']

    ```


    The result is two variables, bt_age_y and bt_age_n, which have age values from
    only those records which have response = "yes" and response = "no," respectively.


    Once the variables are created, create a stacked histogram of the two variables.


    ```

    plt.hist([bt_age_y, bt_age_n], bins = 10, stacked = True)

    plt.legend([''Response = Yes'', ''Response = No''])

    plt.title(''Histogram of Age with Response Overlay'')

    plt.xlabel(''Age''); plt.ylabel(''Frequency''); plt.show()

    ```


    For the hist() command, the input stacked = True will stack the two variables,
    while bins = 10 specifies the number of bins in the histogram. The legend(), title(),
    xlabel(), and ylabel() commands specify the values of the legend, title, x-axis
    label, and y-axis label. Finally, show() displays the figure. The result is shown
    in Figure 4.8.'
