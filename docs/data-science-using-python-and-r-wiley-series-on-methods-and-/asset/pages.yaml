  md: '# 7.8 COMPARING MODELS WITH AND WITHOUT UNEQUAL ERROR COSTS


    When we develop Model 2 using R (see the previous section for code details) and
    evaluate it, we obtain the contingency table shown in Table 7.7.


    Because the error costs for Model 2 are unequal, the evaluative measures introduced
    earlier are now superseded by a new evaluation measure, model cost per record
    (or its additive inverse, overall model profit per record).


    # Model Cost per Record and Model Profit per Record


    When error costs are unequal, one of the most important evaluation measures for
    the purpose of model selection is the model cost per record. First, calculate
    the Overall Model Cost, as follows:


    ```

    Overall Model Cost = TN - Cost_tn + FP - Cost_fp + FN - Cost_fn + TP - Cost_tp

    ```


    Often, the error costs for true negatives and false negatives equal zero, since
    no action is taken. In this case, the overall model cost simplifies to:


    ```

    Overall Model Cost = FP - Cost_fp + TP - Cost_tp

    ```


    Then,


    ```

    Model Cost per Record = Overall Model Cost / GT

    ```


    Finally,


    ```

    Model Profit per Record = -Model Cost per Record

    ```


    For model selection, choose the model which minimizes the model cost per record,
    or, conversely, maximizes model profit. It is important to report the per-record
    cost or profit, because overall costs varies with the size of the data set.


    Using the costs delineated in Table 7.5, we calculate the overall model costs
    for Model 1 and Model 2 as follows:


    ```

    Overall Model Cost_Model1

    = FP - Cost_tp + TP - Cost_tp

    = 441 - $10 + 544 - $40

    = -$17,350

    ```


    # TABLE 7.7 Contingency table for evaluating Model 2, which incorporates asymmetric
    error costs


    | | Predicted Category | | |

    |---|---|---|---|

    | | 0 | 1 | Total |

    | Actual category 0 | TN = 7163 | FP = 2451 | TAN = 9614 |

    | 1 | FN = 618 | TP = 1322 | TAP = 1940 |

    | Total | TPN = 7781 | TPP = 3773 | GT = 11,554 |'
