- pgno: 213
  md: 'As we have seen before, the **subset()** command takes a data set and extracts
    the specified rows or columns from it. Since we want four columns, we put their
    names in a vector under the input **select**. We name our new data frame **min.
    churn**.


    To change Customer Service Calls to a factor, we use the **ordered()** command.


    ```

    min.churn$CustServ.Calls <- ordered(as.factor(min.churn$CustServ.Calls))

    ```


    We work with two nested commands here. First, **as.factor()** takes the **CustServ.Calls**
    variable and makes a factor of the different values. However, the variable will
    be treated as nominal, not ordinal. To set the levels are ordinal, we include
    the **as.factor()** command inside the **ordered()** command. The order of the
    levels in the factor **CustServ.Calls** will now be set to be in ascending order.


    To obtain the baseline distributions of the four variables, we use tables. The
    code for the first table is shown below. The remaining three tables are left as
    an exercise.


    ```

    t1 <- table(min.churn$Intl.Plan)

    t11 <- rbind(t1, round(prop.table(t1), 4))

    ```


    The **table()**, **prop.table()**, and **round()** commands have been discussed
    in previous chapters. The table **t1** contains a count of how many customers
    have and do not have the International Plan, while the **prop.table()** command
    returns a table with the proportions for those same categories. The **rbind()**
    command creates a matrix with the counts and proportions together. Save the matrix
    as **t11**.


    To make the table more readable, we add column and row names.


    ```

    colnames(t11) <- c("Intl.Plan = no", "Intl.Plan = yes")

    rownames(t11) <- c("Count", "Proportion")

    t11

    ```


    To know what order to put the **colnames()** values, take a look at **t1**. The
    first column has the "no" values. We use this information to inform the order
    of the **colnames()** values. Namely, the "Intl.Plan = no" value comes first,
    followed by "Intl.Plan = yes". The result, **t11**, is shown as the first value
    in Figure 14.1.


    Once we are done setting up the data and obtaining baseline distribution information,
    install and load the package for association rules: the **arules** package.


    ```

    install.packages("arules"); library(arules)

    ```


    To obtain the association rules, run the **apriori()** command from the **arules**
    package.


    ```

    all.rules <- apriori(data = min.churn, parameter =

    list(supp = 0.01, target = "rules",

    conf = 0.4, minlen = 2, maxlen = 2))

    ```'
