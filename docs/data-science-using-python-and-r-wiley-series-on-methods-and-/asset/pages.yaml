  md: 'The runif() command randomly draws numbers between zero and one, each with
    equal probability. The input n will generate n such numbers, one for each record
    in the data set. The condition < 0.75 will look at each of the numbers generated
    by runif() and see whether the number is above or below 0.75. If the number is
    below 0.75, the value TRUE is returned, while if the number is above 0.75, the
    value FALSE is returned. You can run train_ind by itself to see the series of
    TRUE and FALSE values. While the numbers generated by runif() will be different
    each time, on average about 75% will be TRUE.


    Now that we have a series of TRUE and FALSE values, we will use them to create
    the training and test data sets. We use bracket notation to break the bank data
    set into two halves by specifying the rows of interest for each partition. Remember
    the bracket notation specifies the rows of interest before the comma and the columns
    of interest after the comma.


    ```

    bank_train <- bank[ train_ind, ]

    bank_test <- bank[ !train_ind, ]

    ```


    By running bank[ train_ind, ] we subset only those records of bank whose train_ind
    value equals TRUE. Since about 75% of the values in train_ind equal TRUE, about
    75% of records from bank will be in the bank_train data set. For bank_test we
    want those records of bank whose train_ind value equals FALSE. By using bank[
    !train_ind, ] we subset only those records of bank whose train_ind value does
    not equal TRUE (where "no" is signified by the exclamation point, !).


    We now have our training and test data sets.


    # 5.3 VALIDATING YOUR PARTITION


    Because the legitimacy of the entire Data Science Methodology depends on the validity
    of the partition, it is important to check that the training data set and the
    test data set do not differ systematically from each other. We can do this by
    checking, on a variable-by-variable basis, whether the training and test sets
    differ. Because there may be many variables in the data set, we restrict ourselves
    to spot-checking a small set of randomly chosen variables. Depending on the variable
    types involved, different statistical tests are required.


    +   • For a numerical variable, use the two-sample t-test for the difference in
    means.

    +   • For a categorical variable with two classes, use the two-sample Z-test for
    the difference in proportions.

    +   • For a categorical variable with more than two classes, use the test for
    the homogeneity of proportions.


    For details on how to perform these tests, please see our earlier text.1'
