    component should explain at least one predictor’s worth of the variability, and
    therefore, the eigenvalue criterion states that only components with eigenvalues
    greater than one should be retained. Note that, if there are fewer than 20 predictors,
    the eigenvalue criterion tends to recommend extracting too few components, while,
    if there are more than 50 variables, this criterion may recommend extracting too
    many. From Figure 12.9, we see that four of the rotated components have eigenvalues
    greater than 1, and are therefore retained. Component 5 has a rotated eigenvalue
    much below 1.0, so we do not include Component 5. The eigenvalue criterion therefore
    suggests that we extract k = 4 principal components.


    # 12.6.2 The Proportion of Variance Explained Criterion


    For the proportion of variance explained criterion, the client or analyst first
    specifies what proportion of the total variability that he or she would like the
    principal components to account for. Then, the analyst simply selects the components
    one by one until the desired proportion of variability explained is attained.
    For example, suppose we would like our components to explain about 70% of the
    variability in the predictors. Then, from Figure 12.8, we would choose components
    1–3, which together explain 72.9% of the variability. On the other hand, if we
    wanted our components to explain 90% of the variability, then we would need to
    include component 4 as well, which together with the first three components would
    explain 93% of the variability. Without further input from the client, we might
    just say that the proportion of variance explained criterion suggests we go with
    either k = 3 or k = 4 components. Since the eigenvalue criterion suggested k =
    4 components, and the proportion of variance explained criterion is fine with
    either k = 3 or k = 4 components, we therefore by consensus settle on extracting
    k = 4 components.'
