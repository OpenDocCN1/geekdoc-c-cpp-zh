  md: '# 8.1 INTRODUCTION TO NAÏVE BAYES


    Of course, classification modeling is not restricted to decision trees. Many other
    classification methods are available, including Naïve Bayes classification. Naïve
    Bayes classification methods are based on Bayes Theorem, developed by the Reverend
    Thomas Bayes¹. Bayes Theorem updates our knowledge about the data parameters by
    combining our previous knowledge (called the prior distribution) with new information
    obtained from observed data, resulting in updated parameter knowledge (called
    the posterior distribution).


    # 8.2 BAYES THEOREM


    Consider a data set made up of two predictors X = X1, X2 and a response variable
    Y, where the response variable takes one of three possible class values: y1, y2,
    and y3. Our objective is to identify which of y1, y2, and y3 is the most likely
    for a particular combination of predictor variable values. Let us call this most
    likely combination X'' = {X1 = x1, X2 = x2}.


    We can use Bayes Theorem to identify which class is the most likely for a particular
    combination of predictor variable values by:


    +   1. calculating the posterior probability for each of y1, y2, and y3, for the
    combination of predictors x1 and x2, and

    +   2. selecting the value of y with the highest posterior probability.


    Let y'' be one of the three potential values of Y. Bayes Theorem tells us:


    ```

    p(Y=y''|X'') = \frac{p(X''|Y=y'')p(Y=y'')}{p(X'')} (8.1)

    ```


    > ¹Thomas Bayes, Essay Toward Solving a Problem in the Doctrine of Changes, Philosophical
    Transactions of the Royal Society of London, 1793.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Now, $p(Y = y'')$ represents the knowledge we have about how likely the class
    value y'' is, before we even begin. Since that information is known prior to our
    analysis, we call $p(Y = y'')$ the **prior probability**. This prior information
    is combined with $p(X'' | Y = y'')$, which represents how the data behave, when
    the response equals y''. The denominator, $p(X'')$, is how the data behave without
    reference to the response class values, otherwise known as the **marginal probability**
    of the data.


    The result of the formula, $p(Y = y'' | X'')$, represents the information or idea
    we have about how likely our class value y'' is if we observe the particular predictor
    variable values X''. Since the information is updated from $P(Y = y'')$ after
    examining the data, we call $p(Y = y'' | X'')$ the **posterior probability**.


    What if we have no prior knowledge about the parameters? In this case, you can
    use a **noninformative prior**, which says that every class value is equally likely.
    By using a noninformative prior, your posterior probabilities are based solely
    on the data.


    # 8.3 MAXIMUM A POSTERIORI HYPOTHESIS


    How can we use the Bayes Theorem probabilities to classify a record? In our example
    above, we have three different possible values of y''. For a fixed value of X'',
    we calculate a Bayes Theorem probability for each of the three possible values
    of Y:


    ```

    p(Y = y_1|X'') = \frac{p(X''|Y = y_1) p(Y = y_1)}{p(X'')}


    p(Y = y_2|X'') = \frac{p(X''|Y = y_2) p(Y = y_2)}{p(X'')}


    p(Y = y_3|X'') = \frac{p(X''|Y = y_3) p(Y = y_3)}{p(X'')}

    ```


    The **maximum a posteriori hypothesis** tells us to classify the record X'' as
    the value of Y which has the highest posterior probability. In other words, choose
    the class value of Y that corresponds with the largest of the three posterior
    probabilities we calculated.


    # 8.4 CLASS CONDITIONAL INDEPENDENCE


    If we have more than one predictor variable, then the class conditional independence
    assumption allows us to write $p(X'' | Y = y'')$ as the product of independent
    events. For example, say we have two predictor variables $X'' = (X_1 = x_1, X_2
    = x_2)$. To write $p(X'' | Y = y'')$, we would write $p(X_1 = x_1 | Y = y'') \times
    p(X_2 = x_2 | Y = y'')$. We will see a demonstration of this in the Section 8.5.'
  merge: -1
  img_proc: true
