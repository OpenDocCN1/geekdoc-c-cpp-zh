- pgno: 67
  md: '![](img/fbc96b887811576a0dc93355dce68ae3_67_0.png)


    Figure 4.8 Histogram from Python of age with response overlay.


    We will now create a normalized histogram. First, create a stacked histogram,
    but this time save the information generated by the histogram.


    ```

    (n, bins, patches) = plt.hist([bt_age_yn, bt_age_n], bins = 10, stacked = True)

    ```


    The left-hand side of the code saves several pieces of information from the histogram.
    Specifically, n is the height of the histogram bins and bins are the boundaries
    of each bin in the histogram. Note that, since two variables are being plotted
    in the histogram, n has two series of numbers. The first series is for the first
    variable and the second one is for the second variable. The first number in each
    series is the height of the first bar for each variable.


    To create our normalized histogram, we need to know what proportion of each bin
    each variable represents. To accomplish this, we need to put the information contained
    in n into a matrix and obtain the column proportions.


    To begin construction of the matrix, combine the heights of the two variables''
    bars into one array using the column_stack() command.


    ```

    n_table = np.column_stack((n[0], n[1]))

    ```


    The result, n_table, is a two-column matrix where each column''s entries hold
    the heights of each bar.


    To calculate what proportion of the bar is accounted for by each variable, we
    need to divide each row by the sum across that row.


    ```

    n_norm = n_table / n_table.sum(axis=1)[:, None]

    ```


    Now, each row in n_norm sums to one and the columns within each row give the proportion
    of that variable that makes up the row.'
