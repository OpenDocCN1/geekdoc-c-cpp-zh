- pgno: 53
  md: 'A rough rule of thumb is that a data value is an outlier if its z-value is
    either greater than 3, or less than -3. For instance, a customer who had been
    contacted 10 times (which seems like a lot) would have a standardized value,


    number_of_contacts_z = \frac{10-2.6}{2.7} = 2.7


    Thus, 10 contacts, while a lot, is not identified as an outlier using this method,
    since 2.7 < 3.


    The data scientist should consult with the client regarding what he or she would
    like to do with any outliers. Outliers should not be automatically removed! Nor
    should they be automatically changed. Their unusual values may bring to light
    important aspects of the data that should be discussed with the client or with
    the database administrator.


    # 3.8.1 How to Identify Outliers Using Python


    For this example, we will continue using the age_z variable that we created in
    the previous section. We will find outliers by using the query() function, which
    identifies rows that meet a particular condition.


    ```

    bank_train.query(''age_z > 3 | age_z < -3'')

    ```


    The condition we want all returned records to meet is given as ''age_z > 3 | age_z
    < -3''. In words, this condition requires each record to either have an age_z
    value greater than 3, or an age_z value less than -3. The "|" is specified by
    the character | between the two conditions.


    All records which meet the specified condition are returned. In our example, there
    are 228 records that have age_z values greater than 3 or less than -3. We can
    use these records to create a new data set, which is made up only of these values.


    ```

    bank_train_outliers = bank_train.query(''age_z > 3 |

    age_z < -3'')

    ```


    By giving the output of the query() command a name, we create a new data set of
    only outliers, which we have called bank_train outliers.


    Let us sort the data set bank_train_outliers by its age_z variable.


    ```

    bank_train_sort = bank_train.sort_values([''age_z''],

    ascending = False)

    ```


    The .sort_values() command will sort the records in the data set based on a specified
    variable. The sort can be ascending or descending. In this example, we want the
    largest age_z values at the top, so we sort in descending order by'
