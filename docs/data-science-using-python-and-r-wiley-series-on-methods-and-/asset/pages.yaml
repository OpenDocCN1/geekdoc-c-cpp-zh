    ```


    ```

    grid.arrange(plot1, plot2, nrow = 1)

    ```


    The ggplot() code itself will be familiar from Chapter 4. Note that we save each
    graph under its own name; plot1 for the Alcohol_flag overlay and plot2 for the
    Sugar_flag overlay. After we save each graph, we run the grid.arrange() command,
    with three input values: plot1, plot2, and nrow = 1 to specify that we want the
    graphs side by side on one row. The result is shown in the side-by-side graphs
    in Figure 8.3.


    Now that we have our contingency tables and graphs, we move on to the Naïve Bayes
    algorithm. The package e1071 contains the Naïve Bayes classification algorithm.
    Install and open the package.


    ```

    install.packages("e1071"); library(e1071)

    ```


    Run the Naïve Bayes estimator.


    ```

    nb01 <- naiveBayes(formula = Type ~ Alcohol_flag +

    Sugar_flag, data = wine_tr)

