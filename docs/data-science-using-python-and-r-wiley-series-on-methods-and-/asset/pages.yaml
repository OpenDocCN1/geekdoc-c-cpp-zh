    Let us begin by finding the “baseline” proportions for the various variables,
    so that we may later check the confidence levels of our association rules against
    these baseline levels. These proportions may be found in Figures 14.1 and 14.2.
    For example, the proportion of customers who churn is 14.53%.


    Now, let us generate some association rules, using the following settings:


    +   • Specify the type of association as “rules”


    +   • Minimum support equals 0.01 (1%)


    +   • Minimum confidence equals 0.4 (40%)


    +   • Maximum number of antecedents 1


    Once the rules are generated, you may have to delete rules that contain Churn
    in the antecedent. The resulting rules after doing so are shown in Figure 14.3,
