    clusters that make sense to a subject matter expert. A quick Internet search shows
    how we obtain these different wines in the real world. “During fermentation, yeasts
    transform sugars ... into ethanol [alcohol]....” So, it is no surprise that our
    clustering algorithm has uncovered these two “natural” clusters of white wines:
    sweet wines and dry wines. The dry wines have, on the whole, evidently undergone
    longer fermentation than the sweet wines.


