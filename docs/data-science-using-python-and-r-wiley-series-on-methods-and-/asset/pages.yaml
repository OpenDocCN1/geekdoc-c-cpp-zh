    # Figure 14.4 The top 10 rules from all. rules from R, sorted by lift value.


    While the only required input is data = min.cred, we need to specify the parameter
    settings outlined previously. First, support = 0.01 will set the minimum support
    to 1%. The target = "rules" input specifies that we want association rules. The
    minlen = 2 and maxlen = 2 input values specify that we want antecedents with exactly
    one item, since a rule with an empty antecedent is considered to have a length
    of one. Finally, conf = 0.4 will set the minimum support to 40%. Save the result
    of this algorithm as all.rules.


    To look at the top 10 rules we have obtained, sorted by their lift values, use
    the commands inspect() and head().


    ```

    inspect(head(all.rules, by = "lift", n = 10))

    ```


    The by and n values specify the criterion to sort by, and the maximum number of
    rules to return. The result is shown in Figure 14.4.


    Notice that Figure 14.4 contains some rules that have Churn in the antecedent
    ("lhs") or "left-hand side"). We do not want these rules. This means our next
    step is to subset from all.rules only the rules which do not contain Churn in
    the antecedent.


    To begin, we need to identify which rules have Churn in the antecedent, lhs. To
    work with lhs, we need our rules to be formatted as a data frame. However, the
    apriori() algorithm does not return output formatted as a data frame. To convert
    the format of lhs to a data frame, we use two as() commands.


    ```

    all.rules.ant.df <- as(as(attr(all.rules, "lhs"), "transactions"), "data.frame")

    ```


    The core code, attr(all.rules, "lhs"), specifies that we are working with the
    antecedents (lhs) of the rules contained in all.rules. The first as() command,
    which takes the attr() code as input and adds the additional input "transactions",
    changes the antecedents into a format specific to the arules() package called
    transactions. This step is required, since an object of type transactions can
    then be transformed to a data.frame format using a second as() command, this time
    using the second input value "data.frame". We save the result as all.rules.ant.df
    to signify that the antecedent ("ant") of the all.rules object has been turned
    into a data frame ("df").'
