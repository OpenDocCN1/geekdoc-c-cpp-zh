    # PART 3: SUMMARIZATION 2: MEASURES OF CENTER, VARIABILITY, AND POSITION


    +   • The summation notation \(\Sigma x\) means to add up all the data values
    \(x\). The sample size is \(n\) and the population size is \(N\).


    +   • Measures of center indicate where on the number line the central part of
    the data is located. The measures of center we will learn are the mean, the median,
    the mode, and the midrange.


    +   • The mean is the arithmetic average of a data set. To calculate the mean,
    add up the values and divide by the number of values. The mean income from Table
    A.1 is:


    ```

    \frac{38,000 + 32,000 + ... + 32,200}{10} = \frac{325,400}{10} = \$32,540

    ```


    +   • The sample mean is the arithmetic average of a sample and is denoted \(\bar{X}\)
    ("x-bar").


    +   • The population mean is the arithmetic average of a population and is denoted
    \(\mu\) ("myu", the Greek letter for m).


    +   • The median is the middle data value, when there is an odd number of data
    values and the data have been sorted into ascending order. If there is an even
    number, the median is the mean of the two middle data values. When the income
    data are sorted into ascending order, the two middle values are \$32,100 and \$32,200,
    the mean of which is the median income, \$32,150.


    +   • The mode is the data value that occurs with the greatest frequency. Both
    quantitative and categorical variables can have modes, but only quantitative variables
    can have means or medians. Each income value occurs only once, so there is no
    mode. The mode for year is 2010, with a frequency of 4.


    +   • The midrange is the average of the maximum and minimum values in a data
    set. The midrange income is


    ```

    midrange(income) = \frac{(max(income) + min(income))}{2} = \frac{48,000 + 24,000}{2}
    = \$36,000

    ```


    +   • Skewness and measures of center. The following are tendencies, and not strict
    rules.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '+   - For symmetric data, the mean and the median are approximately equal.


    +   - For right-skewed data, the mean is greater than the median.


    +   - For left-skewed data, the median is greater than the mean.


    +   - **Measures of variability** quantify the amount of variation, spread, or
    dispersion present in the data. The measures of variability we will learn are
    the range, the variance, the standard deviation, and, later, the interquartile
    range (IQR).


    +   - The **range** of a variable equals the difference between the maximum and
    minimum values. The range of income is: range = max(income) - min(income) = 48,000
    - 24,000 = 24,000.


    +   - A **deviation** is the signed difference between a data value and the mean
    value. For Applicant 1, the deviation in income equals x - x̄ = 38,000 - 32,540
    = 5460. For any conceivable data set, the mean deviation always equals zero, because
    the sum of the deviations equals zero.


    +   - The **population variance** is the mean of the squared deviations, denoted
    as σ² ("sigma-squared"):


    ```

    \sigma^2 = \frac{\sum(x-\mu)^2}{N}

    ```


    +   - The **population standard deviation** is the square root of the population
    variance: \sigma = \sqrt{\sigma^2}.


    +   - The **sample variance** is approximately the mean of the squared deviations,
    with n replaced by n - 1 in the denominator in order to make it an unbiased estimator
    of \sigma^2. (An **unbiased estimator** is a statistic whose expected value equals
    its target parameter.)


    ```

    s^2 = \frac{\sum(x-\bar{x})^2}{n-1}

    ```


    +   - The **sample standard deviation** is the square root of the sample variance:
    s = \sqrt{s^2}.


    +   - The variance is expressed in **units squared**, an interpretation that may
    be opaque to nonspecialists. For this reason, the standard deviation, which is
    expressed in the original units, is preferred when reporting results. For example,
    the sample variance of income is s^2 = 51,860,444 dollars squared, the meaning
    of which may be unclear to clients. Better to report the sample standard deviation
    s = $7201.


    +   - The sample standard deviation s is interpreted as the size of the **typical
    deviation**, that is, the size of the typical difference between data values and'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'the mean data value. For example, incomes typically deviate from their mean
    by $7201.


    +   • Measures of position indicate the relative position of a particular data
    value in the data distribution. The measures of position we cover here are the
    percentile, the percentile rank, the Z-score, and the quartiles.


    +   ○ The pth percentile of a data set is the data value such that p percent of
    the values in the data set are at or below this value. The 50th percentile is
    the median. For example, the median income is $32,150 and 50% of the data values
    lie at or below this value.


    +   ○ The percentile rank of a data value equals the percentage of values in the
    data set that are at or below that value. For example, the percentile rank of
    Applicant 1''s income of $38,000 is 90%, since that is the percentage of incomes
    equal to or less than $38,000.


    +   ○ The Z-score for a particular data value represents how many standard deviations
    the data value lies above or below the mean. For a sample, the Z-score is:


    ```

    Z-score = \frac{x - \bar{x}}{s}

    ```


    For Applicant 6, the Z-score is


    ```

    \frac{24,000 - 32,540}{7201} \approx -1.2

    ```


    The income of Applicant 6 lies 1.2 standard deviations below the mean.


    +   ○ We may also find data values, given a z-score. Suppose no loans will be
    given to those with incomes more than 2 standard deviations below the mean. Here,
    Z-score = -2 and the corresponding minimum income is:


    ```

    income = Z-score \cdot s + \bar{x} = (-2)(7201) + 32\ 540 = \$18,138

    ```


    No loans will be provided to applicants with incomes below $18,138.


    +   ○ If the data distribution is normal, then the Empirical Rule states:


    +   • About 68% of the data lies within one standard deviation of the mean.


    +   • About 95% of the data lies within two standard deviations of the mean.


    +   • About 99.7% of the data lies within three standard deviations of the mean.


    +   ○ The first quartile (Q1) is the 25th percentile of a data set; the second
    quartile (Q2) is the 50th percentile (median); and the third quartile (Q3) is
    the 75th percentile.'
  merge: -1
  img_proc: true
