  md: '```

    In [194]: np.sqrt(model02.scale)

    Out[194]: 87.54136112817613

    ```


    Figure 11.9 The standard error of the estimate from Python.


    That is, using the regression model, we would estimate the average sales per visit
    for this customer to be \(\hat{y} = \$128.13\). However, the (actual) sales per
    visit for this customer is \(y = \$184.23\). So, the prediction error (residual)
    for this customer is:

    prediction error = \((y - \hat{y}) = 184.23 - 128.13 = \$56.10\)


    So, this customer spends $56.10 more than expected, given his or her days between
    visits and credit card status.


    The typical size of the prediction error is given by the statistic \(s\), the
    standard error of the estimate.


    \(s = \sqrt{MSE} = \sqrt{\frac{SSE}{n-p-1}} = \sqrt{\frac{\sum(y-\hat{y})^2}{n-p-1}}\)


    Here, \(s = \$87.54\), meaning that the size of the model''s typical prediction
    error is about $87.54, as can be seen in Figure 11.9. This large value is due
    to the fact that our data is excerpted from a much larger data set, including
    dozens more predictors, useful for making our model''s estimates more precise.
    Usually, however, \(s\) is a very important metric for measuring the efficacy
    of a regression model.


    In its derivation, \(s\) squares the prediction errors, thereby possibly endowing
    outliers with undue influence in the magnitude of the statistic. Data scientists
    should therefore compare \(s\) with the Mean Absolute Error (MAE), given by


    \(Mean Absolute Error = \frac{\sum|y - \hat{y}|}{n}\)


    The MAE takes the distance between the actual and predicted values of \(y\) and
    finds the average of these distances. There is no squaring going on. As for any
    model evaluation statistics, we should do the following:


    +   1. Develop the regression model using the training data set.

    +   2. Calculate the MAE by passing the test data set through the model trained
    on the training data set.


    For the training data set, we have \(MAE = \$53.39\).


    # Estimation Model Metrics


    When evaluating estimation models, always report both \(s\) and \(MAE\).'
