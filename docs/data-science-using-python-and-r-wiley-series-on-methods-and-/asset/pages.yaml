  md: '# # PREPARING TO MODEL THE DATA


    # ## 5.1 THE STORY SO FAR


    To recapitulate our progress thus far, we are working our way through the Data
    Science Methodology.


    +   1. In Chapter 3, we discussed the importance of the Problem Understanding
    Phase.

    +   2. Also in Chapter 3, we dealt with several issues regarding the Data Preparation
    Phase.

    +   3. In Chapter 4, we covered some important topics in the Exploratory Data
    Analysis Phase.

    +   4. Now, here in Chapter 5, we are ready to tackle the Setup Phase.


    The Setup Phase consists of a number of very important tasks that must be completed
    before we can begin our data modeling. These include:


    +   * Partitioning the data

    +   * Validating the data partition

    +   * Balancing the data

    +   * Establishing baseline model performance


    We cover each of these topics in turn in this chapter.


    # ## 5.2 PARTITIONING THE DATA


    The Data Science Methodology does not use the statistical inference paradigm where
    generalization is made from a sample to a population. There are two reasons for
    this.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   1. Applying statistical inference to the huge sample sizes encountered
    in data science tends to result in statistical significance, even when the results
    are not of practical significance.


    +   2. In the statistical paradigm, the statistician has an a priori hypothesis
    in mind, whereas the Data Science Methodology requires no such a priori hypothesis,
    instead freely searching through the data for actionable results.


    Because of the lack of a priori hypotheses, data scientists need to beware of
    data dredging, whereby phantom spurious results are uncovered, due merely to random
    variation rather than real effects. Data science avoids data dredging through
    the process of cross-validation, a technique for ensuring that results are generalizable
    to an independent, unseen, data set. The most common methods are twofold cross-validation
    and k-fold cross-validation. In twofold cross-validation, the data are partitioned,
    using random assignment, into a training data set and a test data set (also called
    the holdout data set).


    The training set records are complete, but the test set records should have the
    target variable (temporarily) omitted. So, the data science models learn about
    the patterns and trends in the data using the training data set. These models
    are applied to the test set, where they make predictions for the temporarily unknown
    values of the target variable. These predictions are then evaluated against the
    (now restored) true target values, using evaluation measures such as overall error
    rate or mean-squared error. In this way, cross-validation guards against spurious
    results, since it is highly unlikely that the same random variation would be found
    in both the training and the test data sets.


    The size of the partitions differs depending on the size and complexity of the
    data set. For highly complex data sets, where, for example, a neural network model
    needs to learn about many nonlinear relations within the data, more training records
    would be recommended, say 75–90% of the original data. In addition, if the data
    set is very large, it is convenient to have more records in the training set.
    On the other hand, for smaller or less complex data sets, one should retain sufficient
    records for accurate assessment, so that the training sets would contain only
    50–67% of the original data.


    # 5.2.1 How to Partition the Data in Python


    Import the following packages:


    ```

    import pandas as pd

    from sklearn.model_selection import train_test_split

    import random

    ```


    Read in the bank_additional data set and name it bank.


    ```

    bank = pd.read_csv("C:/.../bank-additional.csv")

    ```


    To partition the data set, we will use the command train_test_split().'
