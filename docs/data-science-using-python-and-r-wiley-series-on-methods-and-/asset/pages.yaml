    \ Problem\n\nHow shall we use data science to accomplish the project objectives?\n\
    \n+   1. There are many ways to learn about our potential customers.\n+   \n+\
    \   a. Use Exploratory Data Analysis to express some simple graphic relationships\
    \ among the variables. For example, use a histogram of *age* overlain with information\
    \ about the response *yes/no* to visualize whether age has a bearing on customer\
    \ response.\n+   \n+   b. Use Clustering to determine whether there are natural\
    \ groupings within our potential customers, for example, younger/more-educated\
    \ vs older/less-educated. Then, see if these clusters differ with respect to their\
    \ response to the marketing.\n+   \n+   c. Use Association Rules to see whether\
    \ there are useful relationships among subsets of the records. For example, suppose\
    \ the rule, \"If cell phone, then response = yes\" has good support and high confidence.\
    \ This would allow our marketing people to develop a targeted campaign to cell\
    \ phone users, independent of the results of our overall modeling.\n\n+   2. We\
    \ can develop a powerful suite of data science models to identify likely positive\
    \ responders. Note that, since the response (yes/no) is categorical, we can use\
    \ classification models but not estimation models.\n+   \n+   a. Develop the best\
    \ classification model we can, using the following algorithms:\n+   \n+   i. Decision\
    \ Trees\n+   \n+   ii. Random Forests\n+   \n+   iii. Naive Bayes Classification\n\
    +   \n+   iv. Neural Networks\n+   \n+   v. Logistic Regression\n+   \n+   b.\
    \ Evaluate each model based on predetermined model evaluation criteria, such as\
    \ misclassification costs. Construct a table of the best models and their costs.\n\
    +   \n+   c. Consult with management regarding the best model or models with which\
