- pgno: 217
  md: 'In other words, customers who have made five calls to customer service are
    4.061 times as likely to churn than our general population of customers.


    # 14.6 THE CONFIDENCE DIFFERENCE CRITERION


    The association rules above were generated using the minimum confidence criterion.
    However, other criteria exist for generating association rules. Next, we consider
    the *confidence difference criterion*. The confidence difference evaluation measure
    gives the absolute difference between the *prior probability of the consequent*
    (here, churn status) and the *confidence of the rule*. So, rules would be included
    in this case only if:


    | Prior probability of consequent – Rule confidence | ≥ 0.40


    Figure 14.6 shows the only association rule generated using a confidence difference
    lower bound of 40 (along with minimum antecedent support of 1%, minimum rule confidence
    of 5%, and maximum antecedents of 1). This association rule has Rule confidence
    0.59016 and prior probability of *Churn = True* of 0.14533, giving us:


    | Prior prob of consequent – Rule confidence | = |0.14533 – 0.59016| = 0.44483
    ≥ 0.40


    The *diff* statistic from Figure 14.6 equals this absolute difference, 0.44483.
    The rules that have confidence similar to the prior probability of the consequent
    may not be interesting. For example, by randomly selecting a transaction from
    the data, the probability of obtaining a churning customer is 0.14533. If the
    rule generated has a confidence measure that is not far from 0.14533, random selection
    might as well be used. Therefore, the confidence difference can indicate rules
    which deviate from random selection. In the case here, it can be seen that customers
    who have made five customer service calls have churn rates that appear quite different
    from random customers selected from the data. The confidence difference measure
    helps to weed out obvious rules, such as “If pregnant, then female.” It also accounts
    for skewed or uneven distributions.


    # 14.6.1 How to Apply the Confidence Difference Criterion Using R


    To include the confidence different criterion in our association rule settings,
    we return to the **apriori()** command and add additional input values.


    ```

    lhs rhs support confidence diff lift count

    [1] {CustServ.calls=5} => {Churn=True} 0.012 0.5901639 0.4448306 4.060761 36

    ```


    Figure 14.6 Association rule found using confidence difference lower bound = 40.'
