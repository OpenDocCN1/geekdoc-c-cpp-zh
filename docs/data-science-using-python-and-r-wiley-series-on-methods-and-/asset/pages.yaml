  md: '# # CHAPTER 3 DATA PREPARATION


    # ## 3.1 THE BANK MARKETING DATA SET


    We will illustrate how to perform the first two phases of the Data Science Methodology
    using the bank_marketing_training and bank_marketing_test data sets. Readers may
    download these data sets from the book series site: www.dataminingconsultant.com.
    These data sets are adapted from the bank_additional_full.txt data set from the
    UCI Machine Learning Repository. We use only four predictors (age, education,
    previous_outcome, and days_since_previous), plus the target, response. The data
    relate to a phone-based direct marketing campaign conducted by a bank in Portugal.
    The bank was interested in whether or not the contacts would subscribe to a term
    deposit account with the bank. The bank_marketing_training data set contains 26,874
    records, while bank_marketing_test contains 10,255 records.


    # ## 3.2 THE PROBLEM UNDERSTANDING PHASE


    We begin with the Problem Understanding Phase, in order to make sure that the
    ladder we are working so hard to climb is not leaning against the wrong wall.


    # ### 3.2.1 Clearly Enunciate the Project Objectives


    The objectives of this analysis are as follows:


    +   1. Learn about our potential customers. That is, learn the characteristics
    of those who choose to bank with us, as well as those who do not.


    ¹Sérgio Moro, Paulo Cortez, and Paulo Rita, A data-driven approach to predict
    the success of Bank Telemarketing, Decision Support Systems, Elsevier, 62:22–31,
    June 2014. ²The University of California at Irvine Machine Learning Repository,
    https://archive.ics.uci.edu/ml/index.php.'
  merge: -1
  img_proc: true
