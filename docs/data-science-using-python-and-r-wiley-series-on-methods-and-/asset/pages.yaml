  md: 'Now that we have isolated the antecedents in a form we can work with, we examine
    them to see which contain either Churn = True or Churn = False.


    ```

    t1 <- rules.dataframe$items == "[Churn=True]"

    t2 <- rules.dataframe$items == "[Churn=False]"

    non.churn.ant <- abs(t1+t2-1)

    ```


    The vectors t1 and t2 are a series of zeros and ones, where zero means the antecedent
    did not meet the condition and one means that it did. When we take the absolute
    value of t1+t2-1 using the abs() command, the result is a single vector of zeros
    and ones, where the ones indicate antecedents that do not contain Churn. We save
    this binary vector as non.churn.ant.


    Finally, we subset from all.rules only those rules that have non.churn.ant equal
    to one. In other words, we subset only those rules that do not have Churn in the
    antecedent.


    ```

    good.rules <- all.rules[non.churn.ant == 1]

