  md: '# # INTRODUCTION TO DATA SCIENCE


    # ## 1.1 WHY DATA SCIENCE?


    Data science is one of the fastest growing fields in the world, with 6.5 times
    as many job openings in 2017 as compared to 2012. Demand for data scientists is
    expected to increase in the future. For example, in May 2017, IBM projected that
    yearly demand for “data scientist, data developers, and data engineers will reach
    nearly 700,000 openings by 2020.” http://InfoWorld.com reported that the #1 “reason
    why data scientist remains the top job in America” is that “there is a shortage
    of talent.” That is why we wrote this book, to help alleviate the shortage of
    qualified data scientists.


    # ## 1.2 WHAT IS DATA SCIENCE?


    Simply put, data science is the systematic analysis of data within a scientific
    framework. That is, data science is the


    +   * adaptive, iterative, and phased approach to the analysis of data,

    +   * performed within a systematic framework,

    +   * that uncovers optimal models,

    +   * by assessing and accounting for the true costs of prediction errors.


    ''Forbes, https://www.forbes.com/sites/louiscolumbus/2017/12/11/linkedins-fastest-growing-jobs-today-are-in-data-science-machine-learning/#53100051bd
    ''Forbes, https://www.forbes.com/sites/louiscolumbus/2017/05/13/ibm-predicts-demand-for-data-scientists-will-soar-28-by-2020/#6b6dc227e3b
    ''http://infoworld.com, https://www.infoworld.com/article/3190008/big-data/3-reasons-why-data-scientist-remains-the-top-job-in-america.html


    Data Science Using Python and R, First Edition. Chantal D. Larose and Daniel T.
    Larose. © 2019 John Wiley & Sons, Inc. Published 2019 by John Wiley & Sons, Inc.'
