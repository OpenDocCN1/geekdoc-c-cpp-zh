    \ These discoveries can lead to powerful results, such as more effective treatment\
    \ of medical patients or more profits for a company.\n\n# 1.3 THE DATA SCIENCE\
    \ METHODOLOGY\n\nWe follow the Data Science Methodology (DSM),* which helps the\
    \ analyst keep track of which phase of the analysis he or she is performing. Figure\
    \ 1.1 illustrates the adaptive and iterative nature of the DSM, using the following\
    \ phases:\n\n+   1. Problem Understanding Phase. How often have teams worked hard\
    \ to solve a problem, only to find out later that they solved the wrong problem?\
    \ Further, how often have the marketing team and the analytics team not been on\
    \ the same page? This phase attempts to avoid these pitfalls.\n+   \n+   a. First,\
    \ clearly enunciate the project objectives,\n+   \n+   b. Then, translate these\
    \ objectives into the formulation of a problem that can be solved using data science.\n\
    \n+   2. Data Preparation Phase. Raw data from data repositories is seldom ready\
    \ for the algorithms straight out of the box. Instead, it needs to be cleaned\
    \ or “prepared for analysis.” When analysts first examine the data, they uncover\
    \ the inevitable problems with data quality that always seem to occur. It is in\
    \ this phase that we fix these problems. Data cleaning/preparation is probably\
    \ the most labor-intensive phase of the entire data science process. The following\
    \ is a non-exhaustive list of the issues that await the data preparer.\n+   \n\
    +   a. Identifying outliers and determining what to do about them.\n+   \n+  \
    \ b. Transforming and standardizing the data.\n+   \n+   c. Reclassifying categorical\
