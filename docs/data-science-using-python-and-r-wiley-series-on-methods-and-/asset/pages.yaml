  md: '![](img/fbc96b887811576a0dc93355dce68ae3_234_0.png)


    Figure A.7 Boxplot of left-skewed data.


    +   - The IQR is a measure of variability that is not sensitive to the presence
    of outliers. \(IQR = Q3 - Q1\).

    +   - In the IQR method for detecting outliers, a data value \(x\) is an outlier
    if either

    +     - \(x \le Q1 - 1.5(IQR)\), or

    +     - \(x \ge Q3 + 1.5(IQR)\).

    +   - The five-number summary of a data set consists of the minimum, \(Q1\), the
    median, \(Q3\), and the maximum.

    +   - The boxplot is a graph based on the five-number summary, useful for recognizing
    symmetry and skewness. Suppose for a particular data set (not from Table A.1)
    we have \(Min = 15, Q1 = 29, Median = 36, Q3 = 42\), and \(Max = 47\). Then the
    boxplot is shown in Figure A.7.

    +     - The box covers the "middle half" of the data from Q1 to Q3.

    +     - The left whisker extends down to the minimum value that is not an outlier.

    +     - The right whisker extends up to the maximum value that is not an outlier.

    +     - When the left whisker is longer than the right whisker, then the distribution
    is left skewed, and vice versa.

    +     - When the whiskers are about equal in length, the distribution is symmetric.
    The distribution in Figure A.7 shows evidence of being left-skewed.


