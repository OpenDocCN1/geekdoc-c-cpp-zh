  md: '# TABLE 7.11 Model evaluation metrics for all models


    | Evaluation Measure | Model 1: No error Costs | Model 2: Error costs 4x | Model
    3: Error costs 11.558x |

    |---|---|---|---|

    | Accuracy | 0.8410 | 0.7344 | 0.5172 |

    | Error rate | 0.1590 | 0.2656 | 0.4828 |

    | Sensitivity | 0.2804 | 0.6814 | 0.8964 |

    | Specificity | 0.9541 | 0.7451 | 0.4407 |

    | Precision | 0.5523 | 0.3504 | 0.2444 |

    | F1 | 0.3720 | 0.4628 | 0.3841 |

    | F2 | 0.3110 | 0.5731 | 0.5845 |

    | F0.5 | 0.4626 | 0.3881 | 0.2860 |

    | Overall model cost | -$57,377.52 | -$125,642.76 | -$143,745.62 |

    | Profit per customer | $4.97 | $10.87 | $12.44 |


    Because every true positive gives us $113.58, the models which tended to make
    more positive predictions did better. Sensitivity (recall), the proportion of
    all the positive responders that the model captured, thus turned out to be more
    important than specificity (capturing the nonresponders). Thus, our best-performing
    model had the highest sensitivity, while our worst performing model had the lowest
    sensitivity. The reverse relationship held for specificity.


    Precision did not appear to be very important either, as Model 1’s solid precision
    was partly due to its few positive predictions. F2, which favors recall (sensitivity)
    over precision, was highest with Model 3, while F0.5, which favors precision over
    recall, was highest with Model 1.


    Finally, we should also make sure that our models outperformed the baseline models:
    the All Positive Model and the All Negative Model. Since no customers were contacted
    in the All Negative Model, then there is no profit. On the other hand, the All
    Positive Model did quite well, with an Overall Model Profit of $124,205.20 and
    a Profit per Customer of $10.75, nearly beating Model 2 above.


    To summarize, data scientists should always evaluate their models. In this chapter
    we learned a series of metrics for evaluating classification models. We discovered
    that error costs were not always equal, and when unequal, the model cost per record
    may be the best metric. Finally, we illustrated how data-driven error costs can
    further enhance the profitability of our classification models.


