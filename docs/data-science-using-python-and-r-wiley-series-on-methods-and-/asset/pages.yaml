- pgno: 19
  md: 'Next, we describe what each of these tasks represent and in which chapters
    these tasks are covered.


    # 1.4.1 Description


    Data scientists are often called upon to _describe_ patterns and trends lying
    within the data. For example, a data scientist may describe a cluster of customers
    most likely to leave our company’s service as those with high-usage minutes and
    a high number of customer service calls. After describing this cluster, the data
    scientist may explain that the high number of customer service calls indicates
    perhaps that the customer is unhappy. Working with the marketing team, the analyst
    can then suggest possible interventions to explore to retain such customers.


    The description task is in widespread use around the world by specialists and
    nonspecialists alike. For example, when a sports announcer states that a baseball
    player has a lifetime batting average (hits/at-bats) of 0.350, he or she is describing
    this player’s lifetime batting performance. This is an example of descriptive
    statistics; further examples of which may be found in the Appendix: Data Summarization
    and Visualization. Nearly every chapter in the book contains examples of the description
    task, from the graphical EDA methods of Chapter 4, to the descriptions of data
    clusters in Chapter 10, to the bivariate relationships in Chapter 11.


    # 1.4.2 Estimation


    Estimation refers to the approximation of the value of a numeric target variable
    using a collection of predictor variables. Estimation models are built using records
    where the target values are known, so that the models can learn which target values
    are associated with which predictor values. Then, the estimation models can estimate
    the target values for new data, for which the target value is unknown. For example,
    the analyst can estimate the mortgage amount a potential customer can afford,
    based on a set of personal and demographic factors. This estimate is based on
    a model built by looking at past models of how much previous customers could afford.
    Estimation requires that the target variable be numeric. Estimation methods are
    covered in Chapters 9, 11, and 13.


    # 1.4.3 Classification


    Classification is similar to estimation, except that the target variable is categorical
    rather than continuous. Classification represents perhaps the most widespread
    task in data science, and the most profitable. For instance, a mortgage lender
    would be interested in determining which of their customers is likely to default
    on their'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'mortgage loans. Similarly, for credit card companies. The classification models
    are shown lots of complete records containing the actual default status of past
    customers. The models then learn which attributes are associated with customers
    who default. Finally, these trained models are then deployed to new data, customers
    who have applied for a loan or a credit card, with the expectation that the models
    will help to classify which customers are most likely to default on their loans.
    Classification methods are covered in Chapters 6, 8, 9, and 13.


    # ## 1.4.4 Clustering


    The clustering task seeks to identify groups of records which are similar. For
    example, in a data set of credit card applicants, one cluster might represent
    younger, more educated customers, while another cluster might represent older,
    less educated customers. The idea is that the records in a cluster are similar
    to other records in the same cluster, but different from the records in other
    clusters. Finding workable clusters is useful in at least two respects: (i) your
    client may be interested in the cluster profiles, that is, detailed descriptions
    of the characteristics of each cluster, or (ii) the clusters may themselves be
    used as inputs to classification or estimation models downstream. Clustering methods
    are covered in Chapter 10.


    # ## 1.4.5 Prediction


    The prediction task is similar to estimation or classification, except that for
    prediction the forecasts relate to the future. For example, a financial analyst
    may be interested in predicting the price of Apple stock three months down the
    road. This would represent estimation, since price is a numeric variable, and
    prediction, since it relates to the future. Alternatively, a drug discovery chemist
    may be interested in whether a particular molecule will lead to a profitable new
    drug for a pharmaceutical company. This represents both prediction and classification,
    since the target variable is a yes/no variable, whether the drug will be profitable.


    # ## 1.4.6 Association


    The association task involves determining which attributes are associated with
    each other, that is, which attributes “go together.” The data scientist using
    association seeks to uncover rules for quantifying the relationship between two
    or more attributes. These association rules take the form, “If antecedent, then
    consequent,” together with measures of the support and confidence of the association
    rule. For example, marketers trying to avoid customer churn might uncover the
    following association rule: “If calls to customer service greater than three,
    then customer will churn.” The support refers to the proportion of records the
    rule applies to; the confidence is the proportion of times the rule is correct.
    We cover the association task in Chapter 14.'
  merge: -1
  img_proc: true
