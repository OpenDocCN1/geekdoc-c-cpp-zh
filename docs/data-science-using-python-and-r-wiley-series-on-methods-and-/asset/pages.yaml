    A rough rule of thumb for interpreting the value of the VIF is to consider $VIF
    \ge 5$ to be an indicator of moderate multicollinearity, and to consider $VIF
    \ge 10$ to be an indicator of severe multicollinearity. A VIF of five corresponds
    to $R_i^2 = 0.80$, while $VIF = 10$ corresponds to $R_i^2 = 0.90$.


    For the regression of nutritional rating on fiber, potassium, and sugars, we have
    the output provided in Figure 12.4. The VIF for fiber is 6.85 and the VIF for
    potassium is 6.69, with both values indicating moderate-to-strong multicollinearity.


    # 12.3.1 How to Identify Multicollinearity Using Python


    First, we load the required packages and read in the cereals data set under the
    name cereals.


    ```

    import pandas as pd

    import statsmodels.api as sm

    import statsmodels.stats.outliers_influence as inf

    cereals = pd.read_csv("C:/.../cereals.csv")

    ```


    Once the data set is in Python, pull out the three predictor variables and put
    them in their own data frame. Call the data frame X.


    ```

    X = pd.DataFrame(cereals[[''Sugars'', ''Fiber'', ''Potass'']])

    ```


    Now that we have the predictor variables all together, use the scatter_matrix()
    command with X as the input to create a scatterplot matrix.


    ```

    pd.plotting.scatter_matrix(X)

    ```


    The result of the scatter_matrix() command is shown in Figure 12.3 above. Notice
    that the command creates both scatterplots and histograms.


    To obtain the VIF values, we need to do a little data cleaning first. Use the
    dropna() command on the X data frame to remove any records with missing values.


    ```

    X = X.dropna()

    ```


    Then, make sure you add the constant term in the X data frame.


    ```

