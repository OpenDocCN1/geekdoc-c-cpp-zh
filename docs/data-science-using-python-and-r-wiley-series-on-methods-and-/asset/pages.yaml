- pgno: 107
  md: '# 7.1 INTRODUCTION TO MODEL EVALUATION


    So far in Data Science Using Python and R, we have covered the first five phases
    of the Data Science Methodology:


    +   1. Data Understanding Phase

    +   2. Data Preparation Phase

    +   3. Exploratory Data Analysis Phase

    +   4. Setup Phase

    +   5. Modeling Phase (at least a little bit)


    But, so far we have not examined whether our models are any good. That is, we
    have not evaluated their usefulness in making predictions. Note the difference
    between evaluation and validation. Model validation simply makes sure that our
    model results are consistent between the training and test data sets. But, model
    validation does not tell us how accurate our models are, or what their error rate
    is. For measures like these, we need to turn to model evaluation. Since the only
    models we have learned so far are decision trees for classification, we shall
    restrict our discussion to evaluative measures for classification models.


    # 7.2 CLASSIFICATION EVALUATION MEASURES


    We will develop classification evaluation measures for the case where we have
    a binary target variable. In order to apply the measures we will learn in this
    chapter, we will need to denote (arbitrarily, if desired) one of the two target
    outcomes as positive and one as negative. For example, suppose we are trying to
    predict income,'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# TABLE 7.1 General form of contingency table for binary classifications


    | | | Predicted Category | | |

    |---|---|---|---|---|

    | | | 0 | 1 | Total |

    | Actual category | 0 | True negatives: Predicted 0 Actually 0 | False positives:
    Predicted 1 Actually 0 | Total actually negative |

    | | 1 | False negatives: Predicted 0 Actually 1 | True positives: Predicted 1
    Actually 1 | Total actually positive |

    | | Total | Total Predicted negative | Total Predicted positive | Grand total
    |


    a binary variable with values high income and low income. We could denote high
    income as positive and low income as negative.¹


    Now, the classification model evaluation measures we will learn in this chapter
    are functions of the entries in the contingency table² generated by the classification
    model, the general form of which is shown in Table 7.1. Note that, by convention,
    the actual values are represented by the rows, while the predicted values are
    represented by the columns. The upper-left cell in Table 7.1 represents the number
    of records where the model predicted a negative response and the actual response
    value was indeed negative, making this prediction a true negative. The cell below
    that represents the number of records where the model predicted a negative response,
    but the actual response value where positive, making this prediction a false negative.
    The other cells are similarly defined.


    Let TN, FN, FP, and TP represent the numbers of true negatives, false negatives,
    false positives, and true positives, respectively, in our contingency table. Also,
    let


    TAN = Total Actually Negative = TN + FP

    TAP = Total Actually Positive = FN + TP

    TPN = Total Predicted Negative = TN + FN

    TPP = Total Predicted Positive = FP + TP


    Further, let GT = TN + FN + FP + TP represent the grand total of the counts in
    the four cells. Then, we may reexpress Table 7.1 as Table 7.2.


    Then, using the notation in Table 7.2, we define our set of classification evaluation
    measures.


    ```

    Accuracy = \frac{TN + TP}{TN + FN + FP + TP} = \frac{TN + TP}{GT}

    ```'
  merge: -1
