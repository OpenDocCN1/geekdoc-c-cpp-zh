  md: "# 5.5 ESTABLISHING BASELINE MODEL PERFORMANCE\n\nBefore evaluating model performance,\
    \ data scientists should first calibrate the results against some baseline model\
    \ performance. For example, in the fraud scenario above, suppose we developed\
    \ a complex fraud detection model that reported 98% accuracy. Sounds impressive,\
    \ until we remember that an “all negative” model that simply classifies all records\
    \ as non-fraudulent would have a 99% accuracy rate. Without comparison to a baseline,\
    \ our clients cannot determine whether our results are any good.\n\nWe offer the\
    \ following two baseline models for the binary classification case.\n\n**Baseline\
    \ Models for Binary Classification**\n\nLet one of the binary target classes represent\
    \ positive and the other class represent negative.\n\nLet p represent the proportion\
    \ of positive records in the data.\n\n* All Positive Model. Assign all predictions\
    \ as positive.\n    * The accuracy of this model will be p.\n* All Negative Model.\
    \ Assign all predictions as negative.\n    * The accuracy of this model will be\
    \ 1-p.\n\nFor example, in our fraud scenario, p = 0.01 or 1% fraudulent records,\
    \ where we let fraudulent records represent positive. Then the All Positive Model\
    \ will have accuracy 0.01, and the All Negative Model will have accuracy 0.99.\
    \ Any model that we develop will need to beat this 99% accuracy2 to be considered\
    \ useful.\n\nWe may extend this to the k-nary case, k ≥ 3, as follows:\n\n**Baseline\
    \ Models for k-nary Classification**\n\nLet there be k classes for the response\
    \ variable, C1, C2, ..., Ck.\n\nLet pi represent the proportion of class Ci records\
    \ in the data, i = 1, ..., k.\n\n* Biggest Category Model. Assign all predictions\
    \ as belonging to the largest category.\n    * The accuracy of this model is pmax,\
    \ the largest pi.\n\nFor example, if your training set has 30% Democrats, 30%\
    \ Republicans, and 40% Independents, the baseline model assigns all records to\
    \ Independents, and has an accuracy of 40%."
  merge: -1
  img_proc: true
- pgno: 88
  md: 'So, what kind of baseline model should we use for estimation problems? For
    regression, one could simply compute our estimates against the y = ȳ model, where
    the estimate for each record’s response is simply the mean response. But this
    is truly too low a bar, since almost any regression model will surely beat that.
    Notice that the baseline y = ȳ model completely ignores the wealth of information
    residing in the predictors. Instead, we could ask a question such as, “What would
    a subject matter expert consider a mediocre prediction error to be?” For example,
    if we are a lending company trying to estimate how much our mortgage clients can
    afford, we might say that we could live with a model that was typically off by
    $5,000, which would therefore be a mediocre prediction error. Then, when we do
    build our regression models, we need our values of s, the standard error of the
    estimate, to be lower than $50,000.


    Of course, the optimal benchmark for calibrating any model is to compare it against
    the current gold standard model performance, as provided by the literature (or
    proprietary business models). For example, suppose our lending company had done
    research some years ago in which they achieved a standard error of $25,000. Then,
    this s = $25,000 is our baseline benchmark against which the models that we build
    will be compared against.


    To summarize, in this chapter we have learned about the Setup Phase of the Data
    Science Methodology, which includes the following steps:


    +   - Partitioning the data

    +   - Validating the data partition

    +   - Balancing the data

    +   - Establishing baseline model performance


    Next time, we can begin the Modeling Phase, as we turn to Chapter 6.


    # REFERENCES


