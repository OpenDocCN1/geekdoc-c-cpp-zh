    wine_test = pd.read_csv("C:/.../wine_flag_test.csv")

    ```


    First, we look at the data using contingency tables. These tables will allow us
    to obtain the marginal and conditional probabilities we need to perform the Naïve
    Bayes calculations by hand, and if so choose.


    ```

    t1 = pd.crosstab(wine_tr[''Type''], wine_tr[''Alcohol_flag''])

    t1[''Total''] = t1.sum(axis=1)

    t1.loc[''Total''] = t1.sum()

