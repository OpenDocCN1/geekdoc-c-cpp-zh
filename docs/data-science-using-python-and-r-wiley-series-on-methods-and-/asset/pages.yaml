- pgno: 226
  md: '+   - A population is the set of all elements of interest for a particular
    problem. A **parameter** is a characteristic of a population. For example, the
    population is the set of all American voters, and the parameter is the proportion
    of the population who supports a $1 per ton tax on carbon.

    +   - The value of a parameter is usually unknown, but it is a constant.

    +   - A sample consists of a subset of the population. A characteristic of a sample
    is called a **statistic**. For example, the sample is the set of American voters
    in your classroom, and the statistic is the proportion of the sample who supports
    a $1 per ton tax on carbon.

    +   - The value of a statistic is usually known, but it changes from sample to
    sample.

    +   - A **census** is the collection of information from every element in the
    population. For example, the census here would be to find from every American
    voter whether they support a $1 per ton tax on carbon. Such a census is impractical,
    so we turn to statistical inference.

    +   - **Statistical inference** refers to methods for estimating or drawing conclusions
    about population characteristics based on the characteristics of a sample of that
    population. For example, suppose 50% of the voters in your classroom support the
    tax; using statistical inference we would **infer** that 50% of all American voters
    support the tax. Obviously, there are problems with this. The sample is neither
    random nor representative. The estimate does not have a confidence level, and
    so on.

    +   - When we take a sample for which each element has an equal chance of being
    selected, we have a **random sample**.

    +   - A **predictor variable** is a variable whose value is used to help predict
    the value of the response variable. The predictor variables in Table A.1 are all
    the variables except **risk**.

    +   - A **response variable** is a variable of interest whose value is presumably
    determined at least in part by the set of predictor variables. The response variable
    in Table A.1 is **risk**.


    # PART 2: VISUALIZATION: GRAPHS AND TABLES FOR SUMMARIZING AND ORGANIZING DATA


    # A.1 Categorical Variables


    +   - The **frequency** (or **count**) of a category is the number of data values
    in each category. The **relative frequency** of a particular category for a categorical
    variable equals its frequency divided by the number of cases.

    +   - A **(relative) frequency distribution** for a categorical variable consists
    of all the categories that the variable assumes, together with the (relative)
    frequencies for each value. The frequencies sum to the number of cases; the relative
    frequencies sum to 1.'
  merge: -1
  img_proc: true
