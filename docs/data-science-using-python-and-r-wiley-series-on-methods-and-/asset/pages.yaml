  md: 'Recall the supermarket example where, of 1000 customers, 200 bought diapers,
    and of these 200 customers who bought diapers, 50 also bought beer.


    Suppose 100 of the 1000 customers bought beer. The prior proportion of those who
    bought beer is thus 100/1000 = 10%. The rule confidence is 50/200 = 25%. Therefore,
    the lift for the association rule, “If buy diapers, then buy beer,” is


    $$ Lift = \frac{\text{Rule confidence}}{\text{Prior proportion of the consequent}}
    = \frac{0.25}{0.10} = 2.5 $$


    This may be interpreted as, “Customers who buy diapers are 2.5 times as likely
    to buy beer as customers from the entire data set.” Clearly, this association
    rule would be useful to a store manager wishing to sell more beer.


    For the association rule, “If buy squash (A) then buy beans (B),” we have:


    $$ Lift = \frac{\text{Rule confidence}}{\text{Prior proportion of the consequent}}
    = \frac{6/17}{9/14} = 1.33 $$


    Customers who buy squash are 33% more likely to buy beans than the general population
    of customers.


    # 14.4 MINING ASSOCIATION RULES


