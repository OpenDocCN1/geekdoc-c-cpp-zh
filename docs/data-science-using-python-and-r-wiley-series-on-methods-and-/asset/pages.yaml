    We build the table itself using the `table()` command, followed by the target
    variable from the test data `clothing_testResponse` for the rows and the predicted
    target variable values `ypred` for the columns. For clarity, we add row and column
    names to the table, to differentiate between the actual and predicted values.
    We use `rownames()` to name the rows “Actual: 0” and “Actual: 1” and `colnames()`
    to name the columns “Predicted: 0” and “Predicted: 1” in order to make the resulting
    table as readable as possible. The `addmargins()` command, as we have seen before,
    adds a `Total` row and column. The resulting table is equivalent to Table 7.3.


    # 7.7 ACCOUNTING FOR UNEQUAL ERROR COSTS


    Now, the intrinsic assumption in Model 1 was that the two types of classification
    errors, false positive and false negative, are equally costly. But, as a clothing
    retailer, with millions of dollars potentially at stake, we need to ask ourselves,
    is this assumption valid? Let us investigate, by posing some costs associated
    with the various contingencies. These are shown in Table 7.5.


    The rationale for these costs is as follows:


    +   • **True Negative.** This represents a nonresponder being correctly classified
    as a nonresponder. The retailer will not go to the trouble of contacting this
    customer, who would not have responded if contacted. No money lost or gained.
    \(Cost_{tn} = \$0\).

    +   • **False Positive.** This represents a nonresponder being incorrectly classified
    as a responder. This is not a very serious error for the retailer, as the cost
    of contacting each customer, by phone and with a mailing is, say, $10. \(Cost_{fp}
    = \$10\).

    +   • **False Negative.** This represents a positive responder being incorrectly
    classified as a nonresponder. Sad, but no costs directly incurred. \(Cost_{fn}
    = \$0\).

    +   • **True Positive.** This represents a positive responder being correctly
    classified as a positive responder. The retailer would contact the customer, and
    the customer would come and spend, on average, say, $40. Since profit equals negative
    cost, we have \(Cost_{tp} = -\$40\).


    TABLE 7.5 Cost matrix for the retailer


    | | Predicted Category |

    |---|---|---|

    | | 0 | 1 |

    | Actual category 0 | \(Cost_{tn} = \$0\) | \(Cost_{fp} = \$10\) |

    | 1 | \(Cost_{fn} = \$0\) | \(Cost_{tp} = -\$40\) |'
