- pgno: 177
  md: '# 12.1 THE NEED FOR DIMENSION REDUCTION


    High dimensionality in data science refers to when there are a large number of
    predictors in the data set. For example, 100 predictors describe a 100-dimensional
    space. So, why do we need dimension reduction in data science?


    +   1. **Multicollinearity.** Typically, large databases have many predictors.
    It is unlikely that all of these predictors are uncorrelated. Multicollinearity,
    which occurs when there is substantial correlation among the predictors, can lead
    to unstable regression models.


    +   2. **Double-Counting.** Inclusion of predictors which are highly correlated
    tends to overemphasize a particular aspect of the model, that is, essentially
    double-counting this aspect. For example, suppose we are trying to estimate the
    age of youngsters using math knowledge, height, and weight. Since height and weight
    are correlated, the model is essentially double-counting the physical component
    of the youngster, as compared to the intellectual component.


    +   3. **Curse of Dimensionality.** As dimensionality increases, the volume of
    the predictor space grows exponentially, that is, faster than the number of predictors
    itself. Thus, even for huge sample sizes, the high-dimension space is sparse.
    For example, the empirical rule states that about 68% of normally distributed
    data lies within one standard deviation of the mean. But, this is for one dimension.
    For 10 dimensions, only 2% of the data lies within the analogous hypersphere.


    +   4. **Violates Parsimony.** The use of too many predictors also violates the
    principle of parsimony, the scientific principle one sees in many branches of
    science, that things often behave in a quite economical way. In data science,
    simplicity (parsimony) should be considered when comparing models, keeping the
    number of predictors to such a size that would be easily interpreted.


    +   5. **Overfitting.** Keeping too many predictors in the model tends to lead
    to overfitting, in which the generality of the findings is hindered because new
    data do not behave the same as the training data for all the many predictors.'
  merge: -1
  img_proc: true
