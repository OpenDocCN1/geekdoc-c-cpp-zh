    These are located under "SS Loadings" in Figure 12.8. Once you save these values
    as their own vector, plot them using the plot() command.


    ```

    ss.load <- c(1.566, 1.045, 1.035, 1.006, 0.348)

    plot(ss.load, type = "b", main = "Plot of Eigenvalues",

    ylab = "Value",

    xlab = "Component"); abline(h = 1, lty = 2)

