  md: '# 14.5 CONFIRMING OUR METRICS


    We will call Rule ID [1] “Rule 1.” Next, let us confirm the following values for
    Rule 1, using what we have learned so far:


    +   1. Support,

    +   2. Confidence,

    +   3. Lift.


    # 1. Support.


    ```

    s = support = P(CSC = 5 and Churn = True)

    = transactions with both CSC = 5 and Churn = True / total number of transactions

    = 36 / 3000 = 1.2%

    ```


    How did we get the 36? Support requires the intersection of two events, which
    can be found by generating the contingency table of customer service calls vs
    churn, shown in Figure 14.5. Note that the cell for CSC = 5 and Churn = True contains
    Count = 36, represented 1.2% of the total number of records.


    # 2. Confidence. Use the contingency table to confirm that this equals the conditional
    probability P(B|A).


    ```

    confidence = P(Churn = True | CSC = 5) = P(Churn = True and CSC = 5) / P(CSC =
    5)

    = number of transactions containing both CSC = 5 and Churn = True / number of
    transactions containing CSC = 5

    ```


    Both of these quantities are found in Figure 14.5. Thus,


    ```

    confidence = P(Churn = True | CSC = 5) = 36 / 61 = 59.016%

    ```


    # 3. Lift. Interpret this value.


    ```

    Lift = Rule confidence for Rule 1 / Prior proportion of Churn = True

    ```


    From (2) we have confidence = 59.016%. From Figure 14.1, we have the prior percentage
    of Churn = True to be 14.53%. Therefore,


    ```

    Lift = Rule confidence for Rule ID2 / Prior proportion of Churn = True = 0.59016
    / 0.1453 = 4.061

    ```'
