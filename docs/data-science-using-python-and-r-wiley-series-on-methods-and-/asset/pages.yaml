- pgno: 83
  md: '# # 5.4 BALANCING THE TRAINING DATA SET


    In some classification models, one of the target variable classes has a much lower
    relative frequency than the other classes. In such cases, balancing the training
    data set may be recommended. The purpose of balancing is to provide the classification
    algorithms with a rich selection of records for each category. In this way, the
    algorithms have a chance to learn about all types of records, not just those with
    a high frequency. For instance, suppose 1000 of 100,000 credit card transactions
    are fraudulent. A classification model could achieve 99% accuracy simply by predicting
    "non-fraudulent" for every transaction. Clearly, this model is useless.


    Instead, the analyst should balance the training set so that the proportion of
    fraudulent transactions is increased. This balancing is achieved through resampling
    a number of the fraudulent (rare) records.


    Resampling is the process of sampling at random and with replacement from a data
    set. For example, currently our fraudulent records represent 1% of our training
    set. Suppose we would like to increase this to 25%. Then, we would add 32,000
    resampled fraudulent records, so that we had 33,000 fraudulent records in total.
    The total number of records in the training set would then be 100,000 + 32,000
    = 132,000. We would have 33,000 / 132,000 = 0.25 = 25% fraudulent records, as
    desired.


    So, how did we come up with the magic number of 32,000 resampled records? We used
    the following equation:


    ```

    1000 + x = 0.25(100,000 + x)

    ```


    and solved for x, the required number of additional records to resample. In general,
    this equation is


    ```

    rare + x = p (records + x)

    ```


    which, solving for x gives us:


    ```

    x = \frac{p(records) - rare}{1 - p}

    ```


    where x is the required number of resampled records, records is the number of
    records in the unbalanced data set, and rare represents the current number of
    rare target values.


    The test data set should never be balanced! Remember that the test data set represents
    holdout data that the models have never seen. Data sets in the real world certainly
    will not be conveniently rebalanced for the convenience of our classification
    models, so neither should our test set be rebalanced. Further, all model evaluation
    will be applied to the test data set, meaning that the models will be evaluated
    in real-world like data conditions.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 5.4.1 How to Balance the Training Data Set in Python


    First, we identify how many records in bank_train have the less common value,
    “yes,” for response, using the value_counts() command.


    ```

    bank_train[''response''].value_counts()

    ```


    The count of “yes” responses will change depending on the partition. For the partition
    using the random seed specified in the previous Python code, there are 3089 records
    in the training data set, with 338 having the “yes” response value. Thus, about
    12% of the training data set has a “yes” response value.


    Say, we want to increase the percentage of “yes” responses to 30%. Since we have
    p = 0.3, records = 3089, and rare = 338, we obtain


    ```

    x = 0.3(3089) - 338 / 0.7 = 841

    ```


    That is, we need to resample 841 records whose response is “yes” and add them
    to our training data set.


    To begin resampling, we isolate the records which we want to resample.


    ```

    to_resample = bank_train.loc[bank_train[''response''] == "yes"]

    ```


    The loc command subsets the bank_train data based on the condition bank_train[''response'']
    == "yes" and saves the resulting data set under the name to_resample.


    Next, we need to sample from our records of interest


    ```

    our_resample = to_resample.sample(n = 841, replace = True)

    ```


    The sample() command draws records at random from to_resample, which holds the
    records we want to replace. The input n = 841 specifies how many records to draw,
    while the input replace = True specifies to sample with replacement. The output
    is a data set made up of these 841 randomly resampled records, which we save under
    the name our_resample.


    Finally, we add the resampled records to our original training data set.


    ```

    bank_train_rebal = pd.concat([bank_train, our_resample])

    ```


    The concat() command attaches two data sets by putting the rows on top of each
    other. The result is a single data set made up of both the records in bank_train
    and our_resample, which is saved as its own data set under the name bank_train_rebal.'
