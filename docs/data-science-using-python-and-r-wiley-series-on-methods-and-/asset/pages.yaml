  md: '# 2.4.2 Executing Commands in R


    The R code you write needs to be executed before it will do what it is supposed
    to do.


    Most of the time, you will want to run a single line of code. There are two ways
    to accomplish this. First, you can click the Run button inside the top-left panel
    in RStudio, which is the same panel in which you will be typing the R code. You
    can also use the keyboard shortcut, which is revealed if you hover over the Run
    button. Both the button and the hover text (for a Windows OS) are shown in Figure
    2.13.


    # 2.4.3 Importing Packages in R


    While the “base” or initial download of R includes many commands that are useful
    to data scientists, it does not include everything we will need in this textbook.
    Thus, throughout the book, we will need to download and open specially designed
    batches of R commands, called packages. There are two steps to making this extra
    code available for use: (i) Downloading the package that contains the code and
    (ii) Opening the package.


    Let us demonstrate this process for a package called ggplot2. This package will
    be used in Chapter 4, so by importing this code we will prepare for that chapter
    now. The two lines of code for downloading and accessing the code are given below.


    ```

    install.packages("ggplot2")

    library(ggplot2)

    ```


    First, let us look at the first line of code. The command to download a package
    is install.packages(). To download the ggplot2 package, put the name of the package
    inside the install.packages() command in double quotes. Doing so gives us the
    first line of code above.


    If you are downloading a package for the first time, you will have to pick a CRAN
    mirror before the installation can continue. While you may choose any, you may
    want to select one close to your geographic location.


    It is important to note that you only need to download a package once. After the
    package is done installing, it is on your computer, ready to be opened and used


    ![](img/fbc96b887811576a0dc93355dce68ae3_33_0.png)


    Figure 2.13 The button, and hover text, for running a selection or line of R code
    in RStudio.'
