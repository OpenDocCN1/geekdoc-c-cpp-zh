    One may imagine all the data records entering the decision tree through the root
    node at the top of the tree, and descending through the tree based on the decisions
    at each decision node regarding the variable values. The 100% in the root node
    testifies to this. The root node also tells us that 24% (0.24) of the records
    in the adult_ch6__training data set have high income (>50K). Thus, each node tells
    us the proportion of high-income records in the node, along with the percentage
    of the records reaching that node. At the root node split, CART identifies the
    most efficacious possible binary split as separating the records into two groups,
    depending on their value for the variable marital status, one group whose marital
    status was married, and the other group consisting of all the other marital statuses:
    divorced, never-married, separated, and widowed. Note that the married group contains
    44% high income, while the other group contains only 6% high income. The married
    group has a sevenfold higher proportion of high-income records. This striking
    difference is why this split was chosen as the root node split by the CART algorithm.
    Note also that the root node split partitions the data nearly in half, with 47%
    married and 53% not married.


    At the married node, CART then makes a second split, based on the variable, Cap_Gains_Losses.
    If the (min-max normalized) capital gains and losses exceed 0.051, then 85% of
    the records have high income. However, this group of records representing married
    people with high capital gains and losses makes up only 7%'
