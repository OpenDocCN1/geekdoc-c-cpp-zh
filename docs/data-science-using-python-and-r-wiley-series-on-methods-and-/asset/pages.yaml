  md: 'We use Figure 8.2 to calculate the marginal probability of the predictor variable
    Sugar_flag. Sugar_flag also has two levels: High and Low. These two values will
    make up the distribution of the second predictor variable, p(X):


    +   p(Sugar_flag = High) = 416/1000 = 0.416


    +   p(Sugar_flag = Low) = 584/1000 = 0.584


    We now know, for example, that a randomly chosen wine from this data set has a
    41.6% probability of having a high sugar content.


    What about p(X | Y), the conditional probabilities of each predictor variable
    given the target variable? For each predictor variable we have four different
    probabilities, one for each of the four pairs of predictor and target variable
    levels.


    From Figures 8.1 and 8.2, we may calculate the four conditional probabilities
    for Alcohol_flag and Type, as follows:


    +   p(Alcohol_flag = High | Type = Red) = 218 / 500 = 0.436


    +   p(Alcohol_flag = Low | Type = Red) = 282 / 500 = 0.564


    +   p(Alcohol_flag = High | Type = White) = 268 / 500 = 0.536


    +   p(Alcohol_flag = Low | Type = White) = 232 / 500 = 0.464


    We now know, for example, that if a wine is red, it has a 56.4% chance of having
    a low alcohol content, compared to a 43.6% chance of having a high alcohol content.
    To visualize this difference we can use a normalized bar graph, as on the left-hand
    side of Figure 8.1.


    The four conditional probabilities for Sugar_flag and Type are given below.


    +   p(Sugar_flag = High | Type = Red) = 116 / 500 = 0.232


    +   p(Sugar_flag = Low | Type = Red) = 384 / 500 = 0.768


    +   p(Sugar_flag = High | Type = White) = 300 / 500 = 0.6


    +   p(Sugar_flag = Low | Type = White) = 200 / 500 = 0.4


    We now know, for example, that if a wine is red, it has a 76.8% chance of having
    a low sugar content, compared to a 23.2% chance of having a high sugar content.
    To visualize this difference we can use a normalized bar graph, as on the right-hand
    side of Figure 8.3.


    Now that we have all values of p(Y), p(X), and p(X | Y), we are ready to calculate
    the posterior probability of each level of Type, p(Y = y'' | X). In other words,
    we can finally address the question at hand: How would Naïve Bayes classify a
    wine, given the alcohol and sugar content? To find that out, we use the maximum
    a posteriori hypothesis. We examine the posterior probability of each possible
    Type given a particular value of Alcohol_flag and Sugar_flag and select the Type
    that has the highest posterior probability.


    First, let us consider a wine with low alcohol and low sugar content. Using our
    probability notation, we want to know each of the following:


    +   p(Y = y1 | X'') = p(Red | Alcohol_flag = Low, Sugar_flag = Low)


    +   p(Y = y2 | X'') = p(White | Alcohol_flag = Low, Sugar_flag = Low)'
