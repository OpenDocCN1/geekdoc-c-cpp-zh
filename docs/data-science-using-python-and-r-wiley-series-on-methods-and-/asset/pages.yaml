    # 2.4.4 Getting Data into R


    There are two ways to get a data set into R: using the “Import Dataset” button
    in the RStudio Environment tab (which we highly recommend!) or coding the file
    path into R.


    The easiest method for getting a data set into R is the Import Dataset button,
    found at the top of the top-right window in RStudio. The top-right window is shown
    in Figure 2.14, with the Import Dataset button selected. Selecting the button
    will present you with different options. We will choose “From Text (base)...”
    as our option.


    After selecting “From Text (base)...” you are presented with a file explorer window.
    Use the window to locate your data set. Navigate to your data set and select “Open.”


    Once you select your data set file and click on “Open,” a new “Import Dataset”
    window appears. The window, shown in Figure 2.15, lists on the left-hand side
    many options for importing the data set. The “Heading” selection is of particular
    importance. All the data sets we will use in this text have column headers, so
    it is important to tell R that these headings exist. Make sure the “Yes” button
    for “Heading” is selected. If you move between the “Yes” and “No” options, you
    will see changes in the lower-right window, which is a preview of the data set
    as it will be imported into R. Make sure the column names (“age,” “job,” etc.)
    are in bold.


    ![](img/fbc96b887811576a0dc93355dce68ae3_34_0.png)


    Figure 2.14 After clicking the “Import Dataset” button in RStudio, a drop-down
    menu is presented, from which we select “From Test (base)...”'
