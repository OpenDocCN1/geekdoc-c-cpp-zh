    # Reading Assignment: Flow control in C


    Flow control in C refers to the mechanisms and constructs used to manage the order
    of execution of statements or blocks of code within a C program. It allows you
    to make decisions, repeat actions, and control the overall flow of your program
    based on certain conditions. Flow control is essential for creating programs that
    can perform different tasks under different circumstances. There are primarily
    three types of flow control in C:


    +   1. Sequential Execution: By default, C programs execute statements in a top-down,
    sequential order. This means that each statement is executed one after the other
    in the order they appear in the code.


    +   2. Conditional Execution: Conditional execution allows you to make decisions
    in your program based on certain conditions. This is typically achieved using
    `if-else` statements, `switch-case` statements, and the ternary conditional operator
    (`? :`). Conditional execution allows you to execute different blocks of code
    depending on whether a condition is true or false.


    +   3. Iterative Execution (Loops): Iterative execution, also known as looping,
    allows you to repeat a block of code multiple times. C provides several loop constructs
    for this purpose, including `for`, `while`, and `do-while` loops. Loops are used
    when you want to perform a certain action'
  - '[PAGE 42]


    repeatedly until a specific condition is met while a condition remains true.


    Let''s briefly explain each of these flow control constructs in more detail:


    +   1. Sequential Execution:


    Sequential execution is the most straightforward type of flow control, where statements
    are executed one after the other from top to bottom in the order they appear in
    your code. There is no explicit decision-making or repetition involved in sequential
    execution.


    +   2. Conditional Execution (if-else and switch-case):


    - `if-else` statements: These allow you to execute a block of code if a specified
    condition is true, and an alternative block if the condition is false.


    - `switch-case` statements: These are used for multi-way branching. Based on the
    value of an expression, the program can jump to different code blocks.


    +   3. Iterative Execution (Loops):


    `for` loops: Used when you know the number of iterations in advance. It consists
    of an initialization step, a condition to check before each iteration, and an
    update step.'
- md: "\n`while` loops: Used when you want to repeat a block of code as long as a\
    \ certain condition remains true. The condition is checked before entering the\
    \ loop.\n\n`do-while` loops: Similar to `while` loops, but the condition is checked\
    \ after the block of code is executed, so the code inside the loop is always executed\
    \ at least once.\n\nFlow control constructs allow you to create programs that\
    \ can respond to various input scenarios, handle errors, and perform tasks efficiently\
    \ by controlling the order in which statements are executed. These constructs\
    \ are fundamental to programming in C and are essential for writing complex and\
    \ responsive software.\n\n## Reading Assignment: Decision-Making (if-else, switch)\n\
    \nDECISION-MAKING IS a crucial aspect of programming that allows you to control\
    \ the flow of your code based on certain conditions. In C programming, you can\
    \ achieve decision-making using two primary constructs: `if-else` statements and\
    \ `switch-case` statements. Let's explore both of these constructs in detail:\n\
    \n### 1. if-else Statements:\n\nThe `if-else` statement is used to execute different\
    \ blocks of code based on whether a specified condition is true or false. It allows\
    \ you to create branching logic in your program.\n\nHere's the basic syntax of\
    \ an `if-else` statement:\n\n```\nif (condition) {\n// Code to execute if the\
    \ condition is true\n} else {\n// Code to execute if the condition is false\n\
    }\n```\n\nExample:\n\n```c\n#include <stdio.h>\n\nint main() {\n    int num;\n\
    \n    printf(\"Enter a number: \");\n\n    scanf(\"%d\", &num);\n\n    if (num\
    \ > 0) {\n        printf(\"The number is positive.\\n\");\n    } else if (num\
    \ < 0) {\n        printf(\"The number is negative.\\n\");\n    } else {\n    \
    \    printf(\"The number is zero.\\n\");\n    }\n\n    return 0;\n}\n```\n\nIn\
    \ this example, the program checks whether the entered number is positive, negative,\
    \ or zero and executes different code blocks accordingly.\n\n### 2. switch-case\
    \ Statements:\n\nThe `switch-case` statement is used for multi-way branching.\
    \ It allows you to select one of many code blocks to execute based on the value\
    \ of an expression.\n\nHere's the basic syntax of a `switch-case` statement:\n\
    \n```\nswitch (expression) {\n\ncase constant1:\n    // Code to execute when expression\
    \ equals constant1\n    break;\n\ncase constant2:\n    // Code to execute when\
    \ expression equals constant2\n    break;\n\n// More cases...\ndefault:\n    //\
    \ Code to execute when none of the cases match\n}\n```\n\nExample:\n\n```c\n#include\
