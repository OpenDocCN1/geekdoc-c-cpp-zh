    \ C 语言函数和模块化编程的基础。\n\n### 什么是函数？\n\nC 语言中的函数是一个自包含的代码块，用于执行特定任务。函数用于将程序划分为更小、更易管理的部分，使代码更易于阅读、维护和调试。函数具有名称、返回类型和一组参数（也称为参数）。\n\
    \n以下是 C 函数的基本语法结构：\n\n```c\nreturn_type function_name(parameters) {\n\n// 函数体\n\
