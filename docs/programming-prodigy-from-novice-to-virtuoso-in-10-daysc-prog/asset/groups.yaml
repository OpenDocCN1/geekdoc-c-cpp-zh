    \n# 练习 5：使用指针查找字符串长度\n\n编写一个使用指针计算字符串长度的 C 程序。\n\n```c\n#include <stdio.h>\n\n\
    int stringLength(const char *str) {\n    const char *p = str;\n    while (*p)\
