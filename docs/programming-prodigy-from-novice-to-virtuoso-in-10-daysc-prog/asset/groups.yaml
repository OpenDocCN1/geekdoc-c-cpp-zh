    # Integers and Floating -Point Numbers in C


    In C programming, integers and floating-point numbers are fundamental data types
    used to represent and manipulate numerical data. Understanding these data types
    is crucial for beginners as they form the basis for performing mathematical operations
    and storing numeric values in your programs.


    # Integers


    Integers are whole numbers, and in C, they can be of various sizes depending on
    the specific data type used. Here are some common integer data types in C:


    +   1. `int`


    The `int` data type is the most commonly used integer type in C. It typically
    represents signed integers, meaning it can hold both positive and negative whole
    numbers. The size of an `int` can vary depending on the compiler and platform,
    but it''s usually 4 bytes on most systems.


    ```

    int myInteger = 42;

    ```'
