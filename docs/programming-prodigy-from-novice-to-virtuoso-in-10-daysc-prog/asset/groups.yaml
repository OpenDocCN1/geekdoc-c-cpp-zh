    # Exercise 1: Bit Manipulation in C


    In this hands-on exercise , you will work with bit manipulation operations in
    the C programming language. The exercise covers the following key operations:


    +   1. **Bitwise AND:**** Perform a bitwise AND operation between two unsigned
    integers.


    +   2. **Bitwise OR:**** Perform a bitwise OR operation between two unsigned integers.


    +   3. **Bitwise XOR:**** Perform a bitwise XOR operation between two unsigned
    integers.


    +   4. **Bitwise NOT:**** Perform a bitwise NOT operation on an unsigned integer.


    +   5. **Left Shift:**** Left shift the bits of an unsigned integer by a specified
    number of positions.


    +   6. **Right Shift:**** Right shift the bits of an unsigned integer by a specified
    number of positions.'
  - '[PAGE 191]


    The exercise provides a C program that demonstrates these operations and prints
    both the binary and decimal representations of the results. By completing this
    exercise, you will gain practical experience with fundamental bit manipulation
    techniques commonly used in low-level programming and embedded systems development.'
