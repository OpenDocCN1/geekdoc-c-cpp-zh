    \ elements: %d\\n\", sum);\n\n    return 0;\n}\n```\n\n![](img/50a3ffd9d521bd89400f66c4b293162_132_0.png)\n\
    \n图 12 练习执行的控制台输出示例\n\n# 练习 3：反转数组\n\n编写一个原地反转整数数组元素的程序。\n\n将下方程序输入 Code::Block，像第\
