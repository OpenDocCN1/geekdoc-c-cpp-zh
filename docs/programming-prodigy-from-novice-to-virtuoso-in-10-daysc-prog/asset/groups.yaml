    # Reading Assignment: Looping Techniques\n\nLooping techniques are fundamental\
    \ in C programming, allowing you to execute a block of code repeatedly until a\
    \ specified condition is met. There are different types of loops available in\
    \ C, each with its own use cases. In this discussion, we'll cover the three primary\
    \ types of loops: `for`, `while`, and `do-while`.\n\n### 1. `for` Loop\n\nThe\
    \ `for` loop is used when you know in advance how many times you want to execute\
    \ a block of code. It consists of three parts: initialization, condition, and\
    \ increment/decrement.\n\n```c\nfor (initialization; condition; increment/decrement)\
    \ {\n    // Code to execute repeatedly\n}\n```\n\n**Example: Printing Numbers\
    \ from 1 to 5 using a `for` Loop:**\n\n```c\n#include <stdio.h>\n\nint main()\
    \ {\n    for (int i = 1; i <= 5; i++) {\n        printf(\"%d \", i);\n    }\n\
    \    printf(\"\\n\");\n\n    return 0;\n}\n```\n\n### 2. `while` Loop\n\nThe `while`\
    \ loop is used when you want to execute a block of code as long as a certain condition\
