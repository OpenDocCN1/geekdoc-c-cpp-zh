  md: '# Reading Assignment: Variables and Data Types


    IN THE WORLD OF variables are like the building blocks that allow you to store
    and manipulate data. Understanding variables and data types is fundamental to
    mastering the C programming language. In this chapter, we will explore the concept
    of variables, learn about different data types, and understand how to declare
    and use them in C.


    # What Are Variables?


    A variable is a named storage location in a computer''s memory where you can store
    data. These named storage locations can hold different types of information, such
    as numbers, characters, and more. Variables allow you to work with data in your
    programs by giving it a meaningful name and a place in memory.


    # Declaring Variables


    Before you can use a variable in C, you need to declare it. Declaration tells
    the compiler the variable''s name and data type, which is crucial for allocating
    the right amount of memory. Here''s the basic syntax for declaring a variable:


    ```

    data_type variable_name;

    ```'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'For example, to declare an integer variable named `age`, you would use:


    int age;


    # Data Types in C


    C offers a variety of data types that allow you to store different kinds of data.
    Some of the common data types include:


    int: Used for storing integers (whole numbers), e.g., `int age = 25;`


    float: Used for storing floating-point numbers (numbers with decimals), e.g.,
    `float price = 19.99;`


    char: Used for storing single characters, e.g., `char grade = ''A'';`


    double: Used for storing double-precision floating-point numbers, e.g., `double
    pi = 3.14159265359;`


    Bool: Used for storing Boolean values (`true` or `false`), e.g.,


    Bool isStudent = 1;


    void: Used for indicating that a function does not return a value, e.g., `void
    myFunction();`'
