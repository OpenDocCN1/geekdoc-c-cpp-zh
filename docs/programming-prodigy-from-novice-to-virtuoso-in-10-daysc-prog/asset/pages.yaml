  md: '# Initializing Variables


    When you declare a variable, you can also initialize it, which means assigning
    an initial value to the variable. Here''s how you can declare and initialize variables:


    ```

    int score = 100;

    ```


    ```

    float temperature = 98.6;

    ```


    ```

    char grade = ''A'';

    ```


    # Variable Naming Rules


    In C, variable names must follow certain rules:


    Variable names are case-sensitive, meaning `myVariable` and `variable` are considered
    different.


    Variable names can consist of letters, digits, and underscores but must start
    with a letter or underscore.


    Reserved words (keywords) like `int`, `float`, or `char` cannot be used as variable
    names.


    Variable names should be meaningful and reflect the purpose of the variable.'
