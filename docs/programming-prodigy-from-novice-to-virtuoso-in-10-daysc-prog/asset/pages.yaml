  md: '# Reading Assignment: Bit Manipulation


    Bit manipulation in C involves performing various operations on individual bits
    within data using bitwise operators. Here are some common bit manipulation operations
    in C:


    +   1. Bitwise AND (''&''):


    This operation sets a bit to 1 if it''s 1 in both operands.


    ```

    unsigned int a = 5; // Binary: 0101

    ```


    ```

    unsigned int b = 3; // Binary: 0011

    ```


    ```

    unsigned int result = a & b; // Binary: 0001 (1 in decimal)

    ```


    +   2. Bitwise OR (''|''):


    This operation sets a bit to 1 if it''s 1 in either operand.


    ```

    unsigned int a = 5; // Binary: 0101

    ```


    ```

    unsigned int b = 3; // Binary: 0011

    ```'
