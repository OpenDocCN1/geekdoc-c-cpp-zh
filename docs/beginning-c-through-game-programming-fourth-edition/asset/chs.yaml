  \n## 问答\n\n**Q:** 你在使用随机数生成器之前总是想为它设置种子吗？\n**A:** 不一定。为了测试目的，你可能希望程序每次运行时都产生完全相同的“随机”数序列，例如。\n\
  \n**Q:** 我如何生成更多真正的随机数？\n**A:** 有一些第三方库，它们产生的伪随机数比 C++ 编译器通常提供的伪随机数更好。\n\n**Q:**\
  \ 所有的游戏都使用游戏循环吗？\n**A:** 游戏循环只是观察典型游戏事件流的一种方式。仅仅因为这种范式适用于某个游戏，并不意味着该游戏是通过在其主体代码周围包裹一个循环来实现的。\n\
