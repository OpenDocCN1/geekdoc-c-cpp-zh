  \n尖端的电脑游戏在视觉效果、配乐和纯粹的肾上腺素刺激上，与好莱坞最顶尖的作品媲美。但游戏是一种与其他形式完全不同的娱乐方式；它们能让玩家盯着显示器几个小时。让游戏脱颖而出并让人如此痴迷的特性是交互性。在电脑游戏中，你不仅仅是静坐着看着一个英雄在重重困难中战斗，你成为了成为了那个英雄。\n\
  \n实现这种交互性的关键在于编程。正是编程让外星生物、攻击机中队或整支军队，能够在不同情况下对玩家做出不同的反应。通过编程，游戏的故事可以用新的方式展开。事实上，作为编程的结果，游戏可以以游戏创造者可能从未想象过的方式来响应玩家。\n\
  \n尽管世界上有数以千计的电脑编程语言，但 C++ 是游戏行业的标准。如果你去逛逛你喜爱的商店的 PC 游戏区并随机抓起一个游戏，那么你手中的游戏极有可能是大部分或完全用\
  \ C++ 编写的。底线是：如果你想以专业人士身份编写电脑游戏，你必须学会 C++。\n\n本书的目标是从游戏编程的角度向你介绍 C++ 语言。虽然没有哪一本书能让你成为\
  \ C++ 和游戏编程这两个深度领域的大师，但本书将开启你的旅程。\n\n### 本书适合的读者\n\n本书适合任何想编写游戏的人。它面向完全初学者，并假设你没有任何之前的编程经验。如果你能熟练使用电脑，那么你就可以从这里开始你的游戏编程奥德赛之旅。但仅仅因为这本书是为初学者写的，并不意味着学习\
  \ C++ 和游戏编程会很轻松。你将需要阅读、工作和实验。在本书结束时，你将在专业人士使用的游戏编程语言上拥有坚实的基础。\n\n### 本书的结构\n我从 C++\
  \ 和游戏编程的最开始处讲起，假设在这两个方面都毫无经验。随着章节的推进，我将在之前材料的基础上涵盖更高级的主题。在每一章中，我涵盖一个或多个相关主题。我通过编写简单易懂的与游戏相关的程序来演示每个概念，逐个介绍这些概念。在每一章的末尾，我把一些最重要的概念整合到一个游戏中。书的最后一章以一个最雄心勃勃的项目结束——这个项目利用了贯穿本书的所有主要概念。除了学习\
  \ C++ 和游戏编程外，你还将学习如何组织你的工作、将问题分解为可以管理的任务以及完善你的代码。你有时会面临挑战，但绝不会不知所措。最重要的是，你将在学习获得乐趣。在这个过程中，你将创建一些酷的游戏，并对游戏编程的艺术产生深刻见解。\n\
  \n第 1 章: 类型、变量和标准输入输出：你将接触 C++ 的基础，这是游戏行业的标准语言。你将学习如何在控制台中显示输出、进行算术运算、使用变量以及从键盘获取输入。\n\
  \n第 2 章: 真值、分支和游戏循环：你将通过编写根据条件执行、跳过或重复代码来创建更有趣的游戏。你将学习生成随机数来给游戏增加不确定性。你还将了解游戏循环——一种让游戏持续运行的方式。\n\
  \n第 3 章: 循环、字符串和数组：填字游戏：你将学习循环并处理字符串——字符的序列。你还将了解用于表示游戏的实体，如游戏中的外星人。\n\n第 4 章: 标准模板库：挂字游戏：你将接触到一个强大的库——游戏程序员（甚至是非游戏程序员）依赖它来存放物品集合。你还将学习一些帮助你规划大型程序的技术。\n\
  \n第 5 章: 函数：单词游戏：你将学习如何将游戏程序分解成更小、更易管理的区块。你将通过发现函数——游戏程序的基本逻辑单元来实现这一点。\n\n第 6 章:\
  \ 引用：井字游戏：你将学习如何以高效清晰的方式在程序的不同部分之间共享信息。你还将看到 AI（人工智能）的简要示例，并学习如何给电脑对手一点个性。\n\n第\
  \ 7 章: 指针：井字游戏 2.0：你将开始发现 C++ 中最底层且强大的功能，例如直接访问和操作计算机内存。\n\n第 8 章: 类：宠物照顾者：你将学习如何创建自己的对象类型，并通过面向对象的编程定义它们相互交互的方式。在这个过程中，你将创造你自己的宠物来照料。\n\
  \n第 9 章: 高级类和动态内存：游戏大厅：你将扩展与计算机的直接连接，并根据游戏程序需要和释放内存。你还将看到使用“动态”内存的陷阱以及如何避免它们。\n\n\
  第 10 章: 继承和多态：黑杰：你将学习如何根据其他对象定义对象。然后你将把所学的所有知识整合到一个大的最终游戏中。你将看到如何通过创建一个经典赌场游戏——黑杰的版本（不包括廉价的绿色毛毡）来设计和实现大型项目。\n\
  \n### 本书使用的约定\n\n在整书中，我会穿插一些其他小贴士。例如，我会斜体标记任何*新术语*并解释它的含义。我还会使用一些特殊元素，包括以下：\n\n\
