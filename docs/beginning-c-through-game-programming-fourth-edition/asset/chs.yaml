  \ board[ROWS][COLUMNS] = {{’O’, ‘X’, ‘O’},\n                            {'X’, ‘O’,\
  \ ‘X’}};\n```\n\n# 第 4 章 标准模板库：挂字游戏\n\n到为止，你已经学习了如何使用数组处理序列。但有更高级的方法可以处理集合。事实上，处理集合是非常常见的，以至于\
  \ C++ 有一部分内容专门用于它。在本章中，你将学习这一重要的库。具体来说，你将学习：\n\n- 使用 `vector` 对象处理序列\n- 使用 `vector`\
  \ 成员函数处理元素\n- 使用迭代器遍历序列\n- 使用库算法处理元素组\n\n### 介绍标准模板库\n\n优秀的程序员都是懒的。这并不是说他们不想工作，而是他们不想重复去做已经完成的工作——特别是当这些工作已经做得很好的时候。`STL`（标准模板库）代表了一组已经做得很好的编程工作。它提供了一组容器、算法和迭代器等。\n\
  \n那么什么是容器？它能如何帮助你写游戏？嗯，容器允许你存储和访问相同类型的值集合。是的，数组也可以这样做，但 STL 容器比数组更具活性和威力。STL 定义了多种容器类型；每种类型以不同的方式工作以满足需求。\n\
  \nSTL 中定义的算法与其容器配合。*算法*是程序员发现反复应用于一组值的常用函数。它们包括用于排序、搜索、复制、合并、插入和删除元素的算法。神奇的地方在于，同一个算法可以作用许多不同的容器类型。\n\
  \n*迭代器*是识别容器元素的对象，可以通过操作在元素之间移动。它们非常适合遍历容器。此外，STL 算法也需要迭代器。\n\n当你看到其中一种容器类型的实际实现时，这一切会变得更有意义，所以接下来是内容。\n\
  \n## 使用 vector\n\n\n\n\n\n![images](img/00007.jpeg) 向量可以根据需要增长大小，而数组不能。这意味着如果你使用\
  \ vector 来存储游戏中的敌人对象，该 vector 将自动增长以适应创建的敌人数量。如果你使用数组，你必须创建一个可以存储某个最大数量敌人的数组。而且在游戏过程中，如果你需要的数组空间比你想象的要大，那你就大倒霉了。\n\
  \n![images](img/00007.jpeg) 向量可以与 STL 算法配合使用，而数组不能。这意味着通过使用 vector，你可以直接获得内置的搜索和排序等复杂功能。如果你使用数组，则必须自己编写代码来实现相同的功能。\n\
  \n与数组相比，vector 也有一些缺点，包括：\n\n- ![images](img/00007.jpeg) vector 需要一些额外的内存作为开销。\n\
  - ![images](img/00007.jpeg) vector 在增大尺寸时可能会有性能开销。\n- ![images](img/00007.jpeg)\
  \ 向量在某些游戏主机机系统上可能不可用。\n\n总的来说，vector（以及 STL）在大多数项目中都是非常欢迎的工具。\n\n## 介绍英雄背包 2.0 程序\n\
  \n从用户的角度来看，Hero’s Inventory 2.0 程序与其前身——来自第 3 章的背包程序“for 循环、字符串和数组：单词拼接游戏”相似。新版本存储并处理一组代表英雄背包的\
  \ `string` 对象的集合（collection）。然而，从程序员的角度来看，该程序非常不同。这是因为新程序使用 vector 而不是数组来表示背包。图\
  \ 4.1 显示了程序的运行结果。\n\n**图 4.1**\n\n这次英雄的背包由一个 vector 表示。\n\n![images](img/00045.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 4 章文件夹中；文件名为 `heros_inventory2.cpp`。\n\n```cpp\n // Hero’s Inventory 2.0\n// Demonstrates\
  \ vectors\n\n#include <iostream>\n#include <string>\n#include <vector>\n\nusing\
  \ namespace std;\n\nint main()\n{\n    vector<string> inventory;\n    inventory.push_back(\"\
  sword\");\n    inventory.push_back(\"armor\");\n    inventory.push_back(\"shield\"\
  );\n\n    cout << \"You have \" << inventory.size() << \" items.\\n\";\n\n    cout\
