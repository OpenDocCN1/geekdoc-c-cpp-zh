  nYou trade your sword for a battle axe.\";\n    inventory[0] = \"battle axe\";\n\
  \    cout << \"\\nYour items:\\n\";\n    for (unsigned int i = 0; i < inventory.size();\
  \ ++i)\n    {\n        cout << inventory[i] << endl;\n    }\n\n    cout << \"\\\
  nThe item name ’\" << inventory[0] << \"’ has \";\n    cout << inventory[0].size()\
  \ << \" letters in it.\\n\";\n\n    cout << \"\\nYour shield is destroyed in a fierce\
  \ battle.\";\n    inventory.pop_back();\n    cout << \"\\nYour items:\\n\";\n  \
  \  for (unsigned int i = 0; i < inventory.size(); ++i)\n    {\n        cout << inventory[i]\
  \ << endl;\n    }\n\n    cout << \"\\nYou were robbed of all of your possessions\
  \ by a thief.\";\n    inventory.clear();\n\n    if (inventory.empty())\n    {\n\
  \        cout << \"\\nYou have nothing.\\n\";\n    }\n    else\n    {\n        cout\
  \ << \"\\nYou have at least one item.\\n\";\n    }\n\n    return 0;\n}\n```\n\n\
  ## 准备使用 vector\n\n在声明 vector 之前，我必须包含包含其定义的文件：\n\n```cpp\n #include <vector>\n```\n\
  \n所有的 STL 组件都位于 `std` 命名空间，因此通过使用以下代码（正如我常做的那样），我可以引用 `vector` 而不需要在前面加上 `std::`。\n\
  \n```cpp\nusing namespace std;\n```\n\n## 声明 vector\n\n好的，我在 `main()` 中做的第一件事是声明一个新的\
  \ vector。\n\n```cpp\nvector<string> inventory;\n```\n\n上一行声明了一个名为 `inventory` 的空\
  \ vector，它可以包含 `string` 对象元素。声明一个空 vector 是没问题的，因为当你添加新元素时，它会自动增长尺寸。\n\n要声明你自己的\
  \ vector，编写 `vector`，后面跟着你想要与 vector 使用的对象类型（在 `<` 和 `>` 符号之间），然后是 vector 的名称。\n\
  \n**提示**\n\n要声明你自己的 vector，编写 `vector`，后面跟着你想要与 vector 使用的对象类型（在 `<` 和 `>` 符号之间），然后是\
  \ vector 的名称。\n\n```cpp\nvector<string> inventory;\n```\n\n上一行声明了一个名为 `inventory`\
  \ 的空 vector，它可以包含 `string` 对象元素。声明一个空 vector 是没问题的，因为当你添加新元素时，它会自动增长尺寸。要声明你自己的 vector，编写\
  \ `vector`，后面跟着你想要与 vector 使用的对象类型（在 `<` 和 `>` 符号之间），然后是 vector 的名称。\n\n## 使用 push_back()\
  \ 成员函数\n\n接下来，我像之前的版本一样给英雄三个物品。\n\n```cpp\ninventory.push_back(\"sword\");\ninventory.push_back(\"\
  armor\");\ninventory.push_back(\"shield\");\n```\n\n`push_back()` 成员函数向 vector 的末尾添加新元素。在前面的几行中，我向\
  \ `inventory` 添加了 \"sword\"、armor\" 和 \"shield\"。结果是 `inventory[0]` 等于 \"sword”，“inventory[1]`\
  \ 等于 \"armor”，“inventory[2]` 等于 \"shield\"。\n\n## 使用 size() 成员函数\n\n接下来，我显示英雄拥有的物品数量。\n\
  \n```cpp\ncout << \"You have \" << inventory.size() << \" items.\\n\";\n```\n\n\
  我通过调用 `size()` 成员函数获取 `inventory` 的大小。`size()` 成员函数简单返回 vector 的大小。在这种情况下，它返回 3。\n\
  \n## 索引 vector\n\n接下来，显示英雄的所有物品。\n\n```cpp\ncout << \"\\nYour items:\\n\";\nfor\
  \ (unsigned int i = 0; i < inventory.size(); ++i)\n{\n    cout << inventory[i] <<\
  \ endl;\n}\n```\n\n就像数组一样，你可以使用下标运算符对 vector 进行索引。事实上，上面的代码与原始英雄背包程序中的相同部分几乎完全相同。唯一的区别是我使用了\
  \ `inventory.size()` 来指定循环何时结束。注意我将循环变量 `i` 为 `unsigned int`，因为 `size()` 返回的值无无符号类型。\n\
  \n接下来，我替换英雄的第一个物品。\n\n```cpp\ninventory[0] = \"battle axe\";\n```\n\n再次，就像数组一样，我使用下标运算符为现有的元素位置分配新值。\n\
  \n## 调用元素的成员函数\n\n接下来，显示英雄背包中第一个物品名称的字母数量。\n\n```cpp\ncout << inventory[0].size()\
  \ << \" letters in it.\\n\";\n```\n\n\n\n\n与数组一样，你可以通过编写元素、成员选择运算符以及最后是成员函数名来访问\
  \ vector 元素的成员函数。因为 `inventory[0]` 等于“battle axe”，所以 `inventory[0].size()` 返回 10。\n\
  \n## 使用 `pop_back()` 成员函数\n\n我使用以下代码移除英雄的盾牌：\n\n```cpp\n inventory.pop_back();\n\
  ```\n\n`pop_back()` 成员函数移除 vector 的最后一个元素并将 vector 的大小减一。在这种情况下，`inventory.pop_back()`\
  \ 从 `inventory` 中移除了“shield”，因为它是 vector 中的最后一个元素。此外，`inventory` 的大小从 3 减到了 2。\n\
  \n## 使用 `clear()` 成员函数\n\n接下来，我模拟了小偷抢光英雄所有物品的行为。\n\n```\n inventory.clear();\n```\n\
  \n`clear()` 成员函数移除 vector 中的所有元素并将其大小设置为 `0`。在执行上一行代码后，`inventory` 变成了一个空 vector。\n\
  \n## 使用 `empty()` 成员函数\n\n最后，我检查英雄的背包中是否任何物品。\n\n```cpp\n if (inventory.empty())\n\
  \   {\n       cout << \"\\nYou have nothing.\\n\";\n   }\n   else\n   {\n      \
  \ cout << \"\\nYou have at least one item.\\n\";\n   }\n```\n\n`vector` 成员函数 `empty()`\
  \ 的工作方式与 `string` 成员函数 `empty()` 相同。如果 `vector` 对象为空，它返回 `true`；否则返回 `false`。由于在这种情况下\
  \ `inventory` 是空的，程序会显示消息：“You have nothing.”\n\n## 使用迭代器（Iterators）\n\n迭代器是充分利用容器性能的关键。通过迭代器，你可以……嗯，遍历一个序列容器。此外，STL\
  \ 的重要部分需要迭代器。许多容器成员函数和 STL 算法都接受迭代器作为参数。因此，如果你想获得这些成员函数和算法带来的收益，必须使用迭代器。\n\n####\
  \ 介绍英雄背包 3.0 程序\n\n英雄背包 3.0 程序表现得与它的两个前身程序相似，至少在开始时是这样。程序显示了一个物品列表，替换第一个物品，并显示物品名称的字母数量。但随后程序执行了一些新操作：它在组的开头插入了一个物品，然后从组的中间移除了一个物品。程序通过操作迭代器完成了所有这些任务。图\
  \ 4.2 显示了程序的运行情况。\n\n**图 4.2**\n\n程序执行了一些 vector 操作，这些操作你只能通过迭代器完成。\n\n![images](img/00046.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 4 章文件夹中；文件名为 `heros_inventory3.cpp`。\n\n```cpp\n // Hero’s Inventory 3.0\n// Demonstrates\
  \ iterators\n\n#include <iostream>\n#include <string>\n#include <vector>\n\nusing\
  \ namespace std;\n\nint main()\n{\n    vector<string> inventory;\n    inventory.push_back(\"\
  sword\");\n    inventory.push_back(\"armor\");\n    inventory.push_back(\"shield\"\
  );\n\n    vector<string>::iterator myIterator;\n    vector<string>::const_iterator\
  \ iter;\n\n    cout << \"Your items:\\n\";\n    for (iter = inventory.begin(); iter\
  \ != inventory.end(); ++iter)\n    {\n        cout << *iter << endl;\n    }\n\n\
  \    cout << \"\\nYou trade your sword for a battle axe.\";\n    myIterator = inventory.begin();\n\
  \    *myIterator = \"battle axe\";\n    cout << \"\\nYour items:\\n\";\n    for\
  \ (iter = inventory.begin(); iter != inventory.end(); ++iter)\n    {\n        cout\
  \ << *iter << endl;\n    }\n\n    cout << \"\\nThe item name ’\" << *myIterator\
  \ << \"’ has \";\n    cout << (*myIterator).size() << \" letters in it.\\n\";\n\n\
  \    cout << \"\\nThe item name ’\" << *myIterator << \"’ has \";\n    cout << myIterator->size()\
  \ << \" letters in it.\\n\";\n\n    cout << \"\\nYou recover a crossbow from a slain\
  \ enemy.\";\n    inventory.insert(inventory.begin(), \"crossbow\");\n    cout <<\
  \ \"\\nYour items:\\n\";\n    for (iter = inventory.begin(); iter != inventory.end();\
  \ ++iter)\n    {\n        cout << *iter << endl;\n    }\n\n    cout << \"\\nYour\
  \ armor is destroyed in a fierce battle.\";\n    inventory.erase((inventory.begin()\
  \ + 2));\n    cout << \"\\nYour items:\\n\";\n    for (iter = inventory.begin();\
  \ iter != inventory.end(); ++iter)\n    {\n        cout << *iter << endl;\n    }\n\
  \n    return 0;\n}\n```\n\n## 声明迭代器\n\n在为英雄背包声明了一个 vector，并添加了与程序之前版本中相同的三个 `string`\
  \ 对象后，我声明了一个迭代器。\n\n```cpp\n vector<string>::iterator myIterator;\n```\n\n上一行代码为一个包含\
  \ `string` 对象的 vector 声明了一个名为 `myIterator` 的迭代器。\n\n\n\n在前面的代码中，我使用一个 `for` 循环从\
  \ `inventory` 的第一个元素移动到最后一个元素。在这一通用层面上，这正是我《Hero's Inventory 2.0》中遍历 vector 内容相同的方法。不过，我没有使用整数和下标运算符来访问每个元素，而是使用了迭代器。基本上，我让便签纸穿过整个元素序列，并显示了便签纸贴所在的每个元素的值。这个小循环中有很多新概念，所以我将逐一个一个地处理它们。\n\
  \n## 调用 `begin()` Vector 成员函数\n\n在循环的初始化语句中，我将 `inventory.begin()` 的返回值赋值给 `iter`。`begin()`\
  \ 成员函数返回一个指向容器第一个元素的迭代器。因此，在这种情况下，该语句将一个指向 `inventory` 第一个元素（等于“`sword`”的 `string`\
  \ 对象）的迭代器赋值给 `iter`。图 4.3 显示了调用 `inventory.begin()` 返回的迭代器的抽象视图。（注意，图是抽象的，因为 vector\
  \ `inventory` 并不包含字符串字面量“`sword`”、“`armor`”和“`shield`”；它包含 `string` 对象。）\n\n**图\
  \ 4.3**\n\n调用 `inventory.begin()` 返回一个指向 vector 中第一个元素的迭代器。\n\n![images](img/00047.jpeg)\n\
  \n## 调用 `end()` Vector 成员函数\n\n在循环的测试语句中，我将 `inventory.end()` 的返回值与 `iter` 进行比较，以确保两者不等。`end()`\
  \ 成员函数返回指向容器中最后一个元素之后的迭代器。这意味着循环将一直持续，直到 `iter` 遍历 `inventory` 中的所有元素。图 4.4 显示了调用此成员函数返回的迭代器的抽象视图。（注意，图是抽象的，因为\
  \ vector `inventory` 并不包含字符串字面量“`sword`”、“`armor`”和“`shield`”；它包含 `string` 对象。）\n\
  \n**图 4.4**\n\n调用 `inventory.end()` 返回一个指向 vector 中最后一个元素之后的迭代器。\n\n![images](img/00048.jpeg)\n\
  \n**陷阱**\n\n`end() vector` 成员函数返回一个指向 vector 中最后一个元素*之后*的迭代器——而不是最后一个元素本身。因此，你无法从\
  \ `end()` 返回的迭代器获取值。这似乎可能违背直觉，但它对于遍历容器的循环非常有效。\n\n## 修改迭代器\n\n循环中的动作语句 `++iter`\
  \ 递增 `iter`，这会使其移动到 vector 中的下一个元素。根据迭代器的类型，你可以对迭代器执行其他数学运算，以让它们在容器中移动。但大多数情况下，你会发现自己只是想递增迭代器。\n\
  \n## 迭代器的解引用\n\n在循环体内，我将 `*iter` 发送到 `cout`。\n\n\n\n\n`erase()` 成员函数的一种形式可以从 vector\
  \ 中删除一个元素。你为这个版本的 `erase()` 提供一个参数——引用你想要删除的元素的迭代器。在这种情况下，我传递了 `(inventory.begin()\
  \ + 2)`，它等同于引用 `inventory` 中第三个元素的迭代器。这会删除等于“`armor`”的 `string` 对象。结果是，后续的所有元素将向上移动一位。这个版本的\
  \ `erase()` 成员函数返回一个引用被删除元素之后元素的迭代器。在这种情况下，我没有将返回的迭代器赋值给变量。\n\n陷阱\n* * *\n在 vector\
  \ 上上调用 `erase()` 成员函数会使所有引用删除点之后元素的迭代器失效，因为删除点之后的所有元素都会向上移动一位。\n* * *\n\n接下来，我显示\
  \ vector 的内容以证明删除操作成功。\n\n## 使用算法\nSTL 定义了一组算法，允许你通过迭代器操作容器中的元素。对于常见任务（如搜索、随机化和排序），都有相应的算法。这些算法是你内置的灵活且高效的武器军库。通过使用它们，你可以将以常见方式操作容器元素的枯燥任务交给\
  \ STL，从而让你专注于编写你的游戏。这些算法强大之处在于它们是通用的——同一个算法可以用于不同容器类型的元素。\n\n## 引入高分程序\nHigh Scores\
  \ 程序创建一个存储高分的 vector。它使用 STL 算法对分数进行搜索、洗牌和排序。图 4.5 释了该程序。\n\n**图 4.5**\nSTL 算法对高分\
  \ vector 中的元素进行搜索、洗牌和排序。\n\n![images](img/00049.jpeg)\n经授权使用。\n\n你可以从 Cengage Learning\
  \ 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 4 章\n{\n    vector<int>::const_iterator iter;\n\n    cout << \"Creating a list\
  \ of scores.\";\n    vector<int> scores;\n    scores.push_back(1500);\n    scores.push_back(3500);\n\
  \    scores.push_back(7500);\n\n    cout << \"\\nHigh Scores:\\n\";\n\n    for (iter\
  \ = scores.begin(); iter != scores.end(); ++iter)\n    {\n        cout << *iter\
  \ << endl;\n    }\n\n    cout << \"\\nFinding a score.\";\n    int score;\n    cout\
  \ << \"\\nEnter a score to find: \";\n    cin >> score;\n    iter = find(scores.begin(),\
  \ scores.end(), score);\n    if (iter != scores.end())\n    {\n        cout << \"\
  Score found.\\n\";\n    }\n    else\n    {\n        cout << \"Score not found.\\\
  n\";\n    }\n\n    cout << \"\\nRandomizing scores.\";\n    srand(static_cast<unsigned\
  \ int>(time(0)));\n    random_shuffle(scores.begin(), scores.end());\n    cout <<\
  \ \"\\nHigh Scores:\\n\";\n    for (iter = scores.begin(); iter != scores.end();\
  \ ++iter)\n    {\n        cout << *iter << endl;\n    }\n\n    cout << \"\\nSorting\
  \ scores.\";\n    sort(scores.begin(), scores.end());\n    cout << \"\\nHigh Scores:\\\
  n\";\n    for (iter = scores.begin(); iter != scores.end(); ++iter)\n    {\n   \
  \     cout << *iter << endl;\n    }\n\n    return 0;\n}\n```\n\n## 准备使用算法\n为了使用\
  \ STL 算法，我包含了它们定义的文件。\n\n```cpp\n#include <algorithm>\n```\n\n如你所知，所有的 STL 组件都位于\
  \ `std` 命名空间中。通过使用以下代码（正如我通常这样做），我可以引用算法而不需要在它们前面加上 `std::`。\n\n```cpp\nusing namespace\
  \ std;\n```\n\n#### 使用 find() 算法\n在显示 vector `scores` 的内容后，我从用户处获取一个值并将其存储在变量 `score`\
  \ 中。然后我使用 `find()` 算法在 vector 中搜索该值：\n\n```cpp\niter = find(scores.begin(), scores.end(),\
  \ score);\n```\n\n`find()` STL 算法在容器元素的指定范围内搜索一个值。它返回一个引用第一个匹配元素的迭代器。如果未找到匹配项，它会返回一个指向范围末尾的迭代器。你必须作为迭代器传递起始点、作为迭代器传递结束点，并传递一个要查找的值。算法从起始迭代器开始搜索，但不包含结束迭代器。在这种情况下，我传递了\
  \ `scores.begin()` 和 `scores.end()` 作为第一个、第二个参数来搜索整个 vector。我传递 `score` 作为第三个参数来搜索用户输入的值。\n\
  \n接下来，我检查是否找到了值 `score`：\n\n```cpp\nif (iter != scores.end())\n{\n    cout << \"\
  Score found.\\n\";\n}\nelse\n{\n    cout << \"Score not found.\\n\";\n}\n```\n\n\
  等一下，只要 `iter` 不等于 `scores.end()`，我就知道 `score` 被找到了。否则，`iter` 将等于 `scores.end()`。\n\
  \n#### 使用 random_shuffle() 算法\n接下来，我准备使用 `random_shuffle()` 算法对分数进行随机化。就像生成单个随机数一样，我为随机生成器设置种子。\n\
  \n```cpp\nsrand(static_cast<unsigned int>(time(0)));\n```\n\n然后我重新排列分数。\n\n```cpp\n\
  random_shuffle(scores.begin(), scores.end());\n```\n\n`random_shuffle()` 算法随机化序列中的元素。你必须作为迭代器提供要洗牌的起点和终点。在这种情况下，我传递了由\
  \ `scores.begin()` 和 `scores.end()` 返回的迭代器。这两个迭代器表示我想洗牌 `scores` 中的所有元素。结果是，`scores`\
  \ 包含了分数，但顺序是随机的。\n\n#### 使用 sort() 算法\n最后，我对分数进行排序。\n\n```cpp\nsort(scores.begin(),\
  \ scores.end());\n```\n\n`sort()` 算法按升序对序列元素排序。你必须作为迭代器提供要排序的起点和终点。在这种情况下，我传递了由\
  \ `scores.begin()` 和 `scores.end()` 返回的迭代器。这两个迭代器表示我想对 `scores` 中的所有元素进行排序。结果是，`scores`\
  \ 按升序包含了所有的分数。\n\n\n\n\n与所有的 STL 容器一样，vector 为游戏程序员提供了处理信息的复杂方式，但这种复杂性可能会以性能为代价。如果说游戏程序员有一件事是之不扣的，那就是性能。但不要担心，vector\
  \ 以及其他 STL 容器的效率极高。事实上，它们已经用于已发行的 PC 和主机游戏了。然而，这些容器也有其自身的优缺点；游戏程序员需要理解各种容器类型的性能特征，以便根据任务选择合适的容器。\n\
  \n## 检查 Vector 的增长\n\n虽然 vector 会根据需要动态增长，但每个 vector 都有一个特定的大小。当向 vector 中添加新元素导致其超过了当前大小时，计算机会重新分配内存，甚至可能将\
  \ vector 的所有元素复制到这段新获取的内存空间中。这可能会导致性能下降。\n\n关于程序性能，需要记住的最重要点是你是否需要关心它。例如，vector\
  \ 的内存重新分配可能不会发生在程序的性能关键部分。在这种情况下，你可以安全地忽略重新分配的成本。此外，对于较小的 vector，重新分配的成本可能微不足道，因此你也可以安全地忽略它。然而，如果你需要对这些内存重新分配发生的时间有更强的控制，你完全可以做到。\n\
  \n## 使用 `capacity()` 成员函数\n\n`capacity()` vector 成员函数返回 vector 的容量——换句话说，在程序必须为其重新分配更多内存之前，vector\
  \ 可以容的元素数量。vector 的容量与其大小（vector 当前持有的元素数量）是不相同的。这里有一个代码片段可以帮助理解这一点：\n\n```\n cout\
  \ << \"Creating a 10 element vector to hold scores.\\n\";\n   vector<int> scores(10,\
  \ 0);   //将所有 10 个元素初始化为 0\n   cout << \"Vector size is :\" << scores.size() <<\
  \ endl;\n   cout << \"Vector capacity is:\" << scores.capacity() << endl;\n\n  \
  \ cout << \"Adding a score.\\n\";\n   scores.push_back(0);   //重新分配内存以适应增长\n   cout\
  \ << \"Vector size is :\" << scores.size() << endl;\n   cout << \"Vector capacity\
  \ is:\" << scores.capacity() << endl;\n```\n\n在我声明并初始化 vector 之后，这段代码报告其大小和容量均为\
  \ 10。然而，在添加一个元素后，代码报告 vector 的大小为 11，而容量为 20。这是因为每当程序为 vector 重新分配额外内存时，容量就会翻倍。在这种情况下，当添加一个新分数时，内存被重新分配，vector\
  \ 的容量从 10 倍到 20。\n\n## 使用 `reserve()` 成员函数\n\n`reserve()` 成员函数将 vector 的容量增加到作为参数提供的数量。使用\
  \ `reserve()` 可以让你控制额外内存重新分配发生的时间。这里有一个例子：\n\n```\n cout << \"Creating a list of\
  \ scores.\\n\";\n   vector<int> scores(10, 0);   //将所有 10 个元素初始化为 0\n   cout <<\
  \ \"Vector size is :\" << scores.size() << endl;\n   cout << \"Vector capacity is:\"\
  \ << scores.capacity() << endl;\n\n   cout << \"Reserving more memory.\\n\";\n \
  \  scores.reserve(20);   //为额外的 10 个元素预留内存\n   cout << \"Vector size is :\" << scores.size()\
  \ << endl;\n   cout << \"Vector capacity is:\" << scores.capacity() << endl;\n```\n\
  \n在我声明并初始化 vector 之后，这段代码报告其大小和容量均为 10。然而，在我为额外的 10 个元素预留内存后，代码报告 vector 的大小仍为 10，而容量为\
  \ 20。\n\n通过使用 `reserve()` 让 vector 的容量足够满足你的需求，你可以将内存重新分配延迟到你选择的时间。\n\n**提示**\n\n\
  作为一个初级游戏程序员，了解 vector 内存分配的工作原理是好的；但不要痴迷于此。你编写的前几个游戏程序可能不会从更手动的 vector 内存分配过程中受益。\n\
  \n## 检查元素的插入和删除\n\n使用 `push_back()` 或 `pop_back()` 成员函数在 vector 末尾添加或删除元素是非常高效的。然而，在\
  \ vector 的任何其他位置添加或删除元素（例如使用 `insert()` 或 `erase()`）可能需要更多工作，因为可能需要移动多个元素来适应插入或删除。对于小的\
  \ vector，开销通常很小，但对于较大的 vector（例如数千个元素），在 vector 中间插入或删除元素会导致性能下降。\n\n幸运的是，STL 提供了序列容器类型\
  \ `list`，无论序列大小如何都能实现高效的插入和删除。需要记住的是，一种容器类型并不是解决所有问题的方案。虽然 `vector` 是多功能的，可能是最流行的\
  \ STL 容器类型，但有时其他容器类型可能更合理。\n\n**陷阱**\n\n仅仅因为你想从序列的中间插入或删除元素，并不意味着你应该放弃 vector。它对你的游戏程序可能仍然是一个很好的选择。这真的取决于你如何使用该序列。\n\
  \n## 检查其他 STL 容器\n\nSTL 定义了多种容器类型，分为两个基本类：序列（sequential）和关联（associative）。对于序列容器，你可以按顺序获取值，而关联容器允许你根据键来获取值。`vector`\
  \ 是序列容器的一个示例。\n\n你可能会如何使用不同的容器类型？考虑一个在线回合制游戏。你可以使用序列容器来存储你想要循环的玩家组。另一方面，你可以使用关联容器通过查找唯一标识符（如玩家的\
  \ IP 地址）以随机访问的方式检索玩家信息。\n\n最后，STL 定义了适配序列容器的容器适配器。容器适配器代表了计算机科学数据结构。虽然它们不是正式的容器，但看起来和用起来一样。\n\
  \n## 规划你的程序\n\n到目前为止，你看到的所有程序都非常简单。在纸上正式地对它们进行任何规划的想法似乎是多此一举。事实并非如此。规划程序（即使是小程序）几乎总是节省时间并减少挫败。\n\
  \n## 使用伪代码\n\n许多程序员使用伪代码来草拟他们的程序，伪代码介于英语和正式编程语言之间。任何理解英语的人都应该读懂伪代码。这里有一个例子：假设我想赚一百万美元。这是一个值得追求的目标，但为了实现它我要做什么？我需要一个计划。所以我想了一个计划并把它写成伪代码。\n\
  \n\n\n\n```\n 如果你能想出一个新且实用的产品\n    那么这就是你的产品\n否则\n    将现有产品重新包装成你的产品\n为你的产品制作一段电视广告\n\
  在电视上播放这段电视广告\n每件你的产品收取 100 美元\n卖出 10,000 件你的产品\n```\n\n尽管任何人（即使是非程序员）都能理解我的计划，但我的伪代码感觉模糊上很像一个程序。前四行类似于带有\
  \ `else` 子句的 `if` 语句，这是刻意为之的。当你编写计划时，应该尝试融入你用伪代码所表示的代码感官。\n\n## 使用步进式细化（Stepwise\
  \ Refinement）\n\n你的编程计划在只写了一个初稿后可能还没有完成。通常，伪代码在转化为编程代码之前需要经过多次迭代。步进式细化（`stepwise\
  \ refinement`）是一种用于重写伪代码以使其准备好实现的过程。步进式细化非常简单。基本上，它的意思是“让它更详细”。通过将伪代码中描述的每一步都分解为一系列更简单的步骤，计划就会变得更接近编程代码。使用步进式细化，你不断分解每一步，直到你觉得整个计划可以相当容易地翻译成程序。例如，从我赚百万美元的总体计划中取一步：\n\
  \n```\n 为你的产品制作一段电视广告\n```\n\n这个任务看起来可能太模糊了。你如何制作电视广告呢？使用步进式细化，你可以将这一步分解为其他几个步骤，使其变为：\n\
  \n```\n 为你的产品编写电视广告脚本\n 租用电视摄影棚一天\n 聘请制作团队\n 聘请一群热情的观众\n 拍摄电视广告\n```\n\n如果你觉得这五个步骤清晰且可行的，那么伪代码的这部分已经彻底细化了。如果你仍然对某一步不清楚，就再细化它。继续这个过程，你将得到一个完整的计划——以及百万美元。\n\
  \n## 引入吊犯游戏（HANGMAN）\n\n在吊犯程序中，计算机选择一个秘密单词，玩家尝试一个字母字母地猜它。玩家有八次猜错的机会。如果他或她未能及时猜出单词，玩家就会被吊死，游戏结束。图\
  \ 4.6 显示了游戏。\n\n**图 4.6**\n\n吊犯游戏的运行状态。\n\n![images](img/00051.jpeg)\n\n经微软许可使用。\n\
  \n你可以从 Cengage Learning 网站下载此程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 4 章文件夹中；文件名是 `hangman.cpp`。\n\n## 规划游戏\n\n在开始写第一行 C++ 代码之前，我先用伪代码规划游戏程序。\n\n```\n\
  \ 创建一个单词组\n 从组中随机选择一个单词作为秘密单词\n 当玩家没有猜错太多且没有猜中秘密单词时\n      告诉玩家还剩多少猜错机会\n      显示玩家已经猜过的字母\n\
  \      显示玩家已经猜出了秘密单词的多少部分\n      获取玩家的下一次猜测\n      当玩家输入的字母是已经猜过的字母时\n         \
  \   获取玩家的猜测\n      将新猜测加入已用字母组\n      如果猜测在秘密单词中\n            告诉玩家猜测是正确的\n     \
  \       用新字母更新目前猜出的单词\n      否则\n            告诉玩家猜测是错误的\n            增加玩家猜错的次数\n\
  \ 如果玩家猜错次数太多\n      告诉玩家他或她已被吊死\n否则\n      祝贺玩家猜中了秘密单词\n```\n\n尽管伪代码没有考虑到我将写的每一行\
  \ C++ 代码，但我认为它很好地描述了我需要做的事情。然后，我开始编写程序。\n\n## 程序设置\n\n像往常一样，我从一些注释开始，并包含我需要的文件。\n\
  \n```\n // Hangman\n// 经典的吊犯游戏\n\n#include <iostream>\n#include <string>\n#include\
  \ <vector>\n#include <algorithm>\n#include <ctime>\n#include <cctype>\n\nusing namespace\
  \ std;\n```\n\n注意，我包含了一个新文件：`cctype`。它是标准库的一部分，包含了将字符转换为大写的函数，我使用它是为了以便在比较单个字符时能够进行“公平”的比较（大写对大写）。\n\
  \n## 初始化变量和常量\n\n接下来，我开始 `main()` 函数并为游戏初始化变量和常量。\n\n```\n int main()\n{\n    //setup\n\
  \    const int MAX_WRONG = 8;  //允许的最大猜错次数\n\n    vector<string> words;   //待猜可能单词的集合\n\
  \    words.push_back(\"GUESS\");\n    words.push_back(\"HANGMAN\");\n    words.push_back(\"\
  DIFFICULT\");\n\n    srand(static_cast<unsigned int>(time(0)));\n    random_shuffle(words.begin(),\
  \ words.end());\n\n    const string THE_WORD = words[0];           //要猜的单词\n   \
  \ int wrong = 0;                              //猜错次数\n    string soFar(THE_WORD.size(),\
  \ ’-’);         //目前猜出的单词\n    string used = \"\";                           //已猜的字母\n\
  \n    cout << \"Welcome to Hangman. Good luck!\\n\";\n```\n\n`MAX_WRONG` 是允许的最大猜错次数。`words`\
  \ 是可能的单词集合。我使用 `random_shuffle` 算法随机化 `words`，然后将向量中的第一个单词赋值给 `THE_WORD`，这是要猜的单词。`wrong`\
  \ 是玩家猜错的次数。`soFar` 初始化为一系列连字符——秘密单词中的每个字母。当玩家猜出一个秘密单词中的字母时，用该字母替换相应位置的连字符。\n\n##\
  \ 进入主循环\n\n接下来，我进入主循环，直到玩家猜错次数过多或猜中单词。\n\n```\n //main loop\n   while ((wrong <\
  \ MAX_WRONG) && (soFar != THE_WORD))\n   {\n       cout << \"\\nnYou have \" <<\
  \ (MAX_WRONG - wrong);\n       cout << \" incorrect guesses left.\\n\";\n      \
  \ cout << \"\\nYou’ve used the following letters:\\n\" << used << endl;\n      \
  \ cout << \"\\nSo far, the word is:\\n\" << soFar << endl;\n```\n\n## 获取玩家猜测\n\n\
  接下来，我获取玩家的猜测。\n\n```\n char guess;\n      cout << \"\\n\\nEnter your guess: \";\n\
  \      cin >> guess;\n      guess = toupper(guess); //秘密单词是大大写的，所以转大写\n      while\
  \ (used.find(guess) != string::npos)\n      {\n          cout << \"\\nYou’ve already\
  \ guessed \" << guess << endl;\n          cout << \"Enter your guess: \";\n    \
  \      cin >> guess;\n          guess = toupper(guess);\n      }\n\n          used\
  \ += guess;\n\n          if (THE_WORD.find(guess) != string::npos)\n          {\n\
  \              cout << \"That’s right! \" << guess << \" is in the word.\\n\";\n\
  \              //更新 soFar 包含新猜的字母\n              for (int i = 0; i < THE_WORD.length();\
  \ ++i)\n              {\n                  if (THE_WORD[i] == guess)\n         \
  \         {\n                      soFar[i] = guess;\n                  }\n    \
  \          }\n          }\n          else\n          {\n              cout << \"\
  Sorry, \" << guess << \" isn’t in the word.\\n\";\n              ++wrong;\n    \
  \      }\n      }\n```\n\n我使用 `toupper()` 函数将猜测转换为大写，该函数定义在 `cctype` 文件中。这样做是为了在检查猜测是否与秘密单词字母字母匹配时，能够比较大写字母与大写字母。\n\
  \n\n\n\n如果玩家猜了一个已经猜过的字母，我会让玩家重新猜。如果玩家猜对了字母，我会更新到目前为止猜出的单词。否则，我会告诉玩家该字母不在秘密单词中，并增加玩家的错误猜测次数。\n\
  \n#### **游戏结束**\n\n此时，玩家已经猜出了单词，或者错误猜测次数过多。无论哪种情况，游戏都结束了。\n\n```cpp\n //shut down\n\
  \    if (wrong == MAX_WRONG)\n    {\n        cout << \"\\nYou’ve been hanged!\"\
  ;\n    }\n    else\n    {\n        cout << \"\\nYou guessed it!\";\n    }\n\n  \
  \  cout << \"\\nThe word was \" << THE_WORD << endl;\n\n    return 0;\n}\n```\n\n\
  我会祝贺玩家，或者告诉他他被吊死的坏消息。然后，我会揭晓秘密单词。\n\n## 总结\n\n在本章中，你学习了以下概念：\n\n- ![images](img/00007.jpeg)\
  \ 标准模板库 (STL) 是一个强大的编程代码集合，提供了容器、算法和迭代器。\n- ![images](img/00007.jpeg) 容器是允许你存储和访问相同类型值集合的对象。\n\
  - ![images](img/00007.jpeg) STL 中定义的算法可以与它们的容器配合使用，并为处理对象组提供常用函数。\n- ![images](img/00007.jpeg)\
  \ 迭代器是识别容器中元素的对象，可以通过操作迭代器来在元素之间移动。\n- ![images](img/00007.jpeg) 迭代器是充分利用容器的关键。许多容器的成员函数需要迭代器，STL\
  \ 算法也是如此。\n- ![images](img/00007.jpeg) 要获取由迭代器引用的值，你必须使用解引用运算符（`*`）对迭代器解引用。\n- ![images](img/00007.jpeg)\
  \ `vector` 是 STL 提供的一种顺序容器。它的作用类似于动态数组。\n- ![images](img/00007.jpeg) 遍历 `vector`\
  \ 是高效的。在 `vector` 末尾插入或删除元素也是非常高效的。\n- ![images](img/00007.jpeg) 在 `vector` 中间插入或删除元素可能是低效的，特别是当\
  \ `vector` 很大。\n- ![images](img/00007.jpeg) 伪代码介于英语和编程语言之间，用于规划程序。\n- ![images](img/00007.jpeg)\
  \ 逐步细化是一种用于重写伪代码以使其准备好实现的过程。\n\n## 问与答\n\n**Q:** 为什么 STL 很重要？\n\n**A:** 因为它为游戏程序员节省了时间和精力。STL\
  \ 提供了常用的容器类型和算法。\n\n**Q:** STL 快吗？\n\n**A:** 绝对快。STL 经过数百名程序员的打磨，以便在每个支持的平台上尽可能地榨出性能。\n\
  \n**Q:** 我什么时候应该用 `vector` 而不是数组？\n\n**A:** 几乎总是如此。`vector` 高效且灵活。它们需要的内存比数组多一点，但这种权衡通常是物超所值的的。\n\
  \n**Q:** `vector` 和数组一样快吗？\n\n**A:** 访问 `vector` 元素可以和访问数组元素一样快。同样，遍历 `vector` 的速度也可以和遍历数组一样快。\n\
  \n**Q:** 如果我可以在 `vector` 上使用下标运算符，我为什么还需要迭代器呢？\n\n**A:** 有几个原因。首先，许多 `vector` 成员函数需要迭代器（`insert()`\
  \ 和 `erase()` 就是两个例子）。其次，STL 算法需要迭代器。第三，你无法在大多数 STL 容器上使用下标运算符，所以你迟早需要学会使用迭代器。\n\
  \n**Q:** 访问 `vector` 元素的最佳方法是什么——通过迭代器还是下标运算符？\n\n**A:** 这取决于情况。如果你需要随机元素访问，那么下标运算符是自然选择。如果你需要使用\
  \ STL 算法，那么你必须使用迭代器。\n\n**Q:** 遍历 `vector` 元素呢？我应该使用下标运算符还是迭代器？\n\n**A:** 你可以使用任何一种方法。然而，使用迭代器的优势在于，它让你能够灵活地使用不同的\
  \ STL 容器替换 `vector`（例如 `list`），而不需要更改大量代码。\n\n**Q:** 为什么 STL 定义了多个顺序容器类型？\n\n**A:**\
  \ 不同的顺序容器类型具有不同的性能特性。它们就像工具箱里的工具；每种工具都最适合不同的工作。\n\n**Q:** 什么是容器适配器？\n\n**A:** 容器适配器基于其中一种\
  \ STL 容器；它们看起来和用起来类似于。\n\n**Q:** 什么是 `stack`（栈）？\n\n**A:** 一种数据结构，元素按照其添加的倒序被移除。这意味着最后添加的先移除。这就像现实生活中的栈，你移除最后放在顶部的物品。\n\
  \n**Q:** 什么是 `queue`（队列）？\n\n**A:** 一种数据结构，元素按照其添加的顺序被移除。这就像现实中的队列，队头的人先获得服务。\n\n\
  **Q:** 什么是双端队列？\n\n**A:** 一种可以在两端添加或删除元素的队列。\n\n**Q:** 什么是优先级队列？\n\n**A:** 一种支持查找和移除优先级元素的数据结构。\n\
  \n**Q:** 我什么时候该使用伪代码？\n\n**A:** 在规划程序时。\n\n**Q:** 我什么时候该使用逐步细化？\n\n**A:** 当你想让伪代码变得更详细时。\n\
  \n## 讨论题\n\n1. 为什么游戏程序员应该使用 STL？\n2. `vector` 相比数组的优势是什么？\n3. 你可能会用 `vector` 存储哪些类型的对象？\n\
  4. 容器的性能特性如何影响使用决策？\n5. 为什么程序很重要？\n\n## 练习题\n\n1. 使用 `vector` 和迭代器编写一个程序，允许用户维护一个游戏列表。该程序应该允许用户列出所有游戏、添加游戏和删除游戏。\n\
  2. 假设 `scores` 是一个包含 `int` 类型元素的 `vector`，以下代码段（用于递增每个元素）有什么问题？\n```cpp\nvector<int>::iterator\
  \ iter;\n   //increment each score\n   for (iter = scores.begin(); iter != scores.end();\
  \ ++iter)\n   {\n       iter++;\n   }\n```\n3. 为第 3 章的 Word Jumble 游戏编写伪代码。\n\n\
  ## 第 5 章：函数：填字游戏\n\n到目前为止你看到的每个程序都由一个函数组成：`main()`。然而，当你的程序达到一定的规模或复杂度时，这样处理它们会变得困难。幸运的是，有方法可以将大程序拆分成较小的、易处理的代码块。在本章中，你将学习一种方法——创建新函数。具体来说，你将学习：\n\
  \n- ![images](img/00007.jpeg) 写新函数\n- ![images](img/00007.jpeg) 通过参数向新函数接受值\n- ![images](img/00007.jpeg)\
  \ 通过返回值从新函数中返回信息\n- ![images](img/00007.jpeg) 处理全局变量和常量\n- ![images](img/00007.jpeg)\
  \ 函数重载\n- ![images](img/00007.jpeg) 内联函数\n\n### **创建函数**\n\n\n\nC++ 允许你编写包含多个函数的程序。你新定义的函数与标准语言中的函数工作完全一样——它们会运行并执行任务，然后将控制权返回给你的程序。编写新函数的一个巨大优势是它允许你将代码拆分成易于管理的片段。就像你从标准库中学过的函数一样，你的新函数应该很好地完成一项工作。\n\
  \n## 介绍 Instructions 程序\n\n`Instructions` 程序的输出非常基础——几行文本，作为某些游戏指令的开头。从输出来看，`Instructions`\
  \ 似乎是你可以在第 1 章“类型、变量与标准输入/输出：丢失的财富”中写出的程序。但这个程序在后台其实运行着一个新元素——一个新函数。查看图 5.1 可以看到代码的朴素结果。\n\
  \n**图 5.1**\n\n指令由一个函数显示。\n\n![images](img/00052.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage\
  \ Learning 网站（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads））下载该程序的代码。程序位于第\
  \ 5 章文件夹中；文件名是 `instructions.cpp`。\n\n```cpp\n // Instructions\n// 演示编写新函数\n\n#include\
  \ <iostream>\n\nusing namespace std;\n\n// 函数原型（声明）\nvoid instructions();\n\nint\
  \ main()\n{\n    instructions();\n    return 0;\n}\n\n// 函数定义\nvoid instructions()\n\
  {\n    cout << \"Welcome to the most fun you’ve ever had with text!\\n\\n\";\n \
  \   cout << \"Here’s how to play the game...\\n\";\n}\n```\n\n## 声明函数\n\n在调用你写的函数之前，你必须对其进行声明。声明函数的方法一种是编写*函数原型*（function\
  \ prototype）——即描述函数的代码。编写原型的方法是先列出函数的返回值（如果函数不返回值值，则使用 `void`），然后是函数名，最后在一组括号之间列出参数列表。*参数*接收函数调用时作为参数传递的值。\n\
  \n在 `main()` 函数之前，我写了一个函数原型：\n\n```cpp\n void instructions();\n```\n\n在前面的代码中，我声明了一个名为\
  \ `instructions` 的函数，它不返回值。（你可以看出这一点，因为我使用了 `void` 作为返回类型。）该函数也不接受任何值，因此它没有参数。（你可以看出这一点，因为括号之间什么都没有。）\n\
  \n原型并不是声明函数的唯一方法。实现相同目的另一种方法是让函数定义充当自身的声明。要这样做，你只需要将函数定义放在函数调用之前即可。\n\n**提示**\n\n\
  > ***\n> 虽然你不必须使用原型，但它们提供了很多好处——其中最不重要的一点是让你的代码更清晰。\n\n***\n\n## 定义函数\n\n定义函数意味着编写使函数运行的所有代码。定义函数的方法是列出函数的返回值（如果函数不返回值，则使用\
  \ `void`），然后是函数名，最后在一组括号之间列出参数列表——就像函数原型一样（区别在于你不需要在行末尾加分号）。这被称为*函数头*（function header）。然后，你创建一个用大括号括起来块，其中包含函数执行时要运行的指令。这被称为*函数体*（function\
  \ body）。\n\n在 `Instructions` 程序的末尾，我定义了我简单的 `instructions()` 函数，它显示了一些游戏指令。因为该函数不返回任何值，所以我不需要像在\
  \ `main()` 中那样使用 `return` 语句。我只需要用右大括号结束函数定义即可。\n\n```cpp\n void instructions()\n\
  {\n    cout << \"Welcome to the most fun you’ve ever had with text!\\n\\n\";\n \
  \   cout << \"Here’s how to play the game...\\n\";\n}\n```\n\n**陷阱**\n\n> ***\n\
  > 函数定义在返回值和函数名上必须与其原型匹配；否则你将产生编译错误。\n\n***\n\n## 调用函数\n\n你调用自己的函数的方法与调用任何其他函数相同——通过编写函数名，后跟一对包含有效参数列表的括号。在\
  \ `main()` 中，我简单地这样调用了我新创建的函数：\n\n```cpp\n instructions();\n```\n\n这一行调用了 `instructions()`。每当你调用函数时，程序的控制权就会跳转到该函数。在这种情况下，意味着控制权跳转到\
  \ `instructions()`，程序执行函数的代码，显示游戏指令。当函数完成后，控制权返回到调用它的代码。在这种情况下，意味着控制权返回到 `main()`。`main()`\
  \ 中的下一个语句（`return 0;`）执行，程序结束。\n\n## 理解抽象\n\n通过编写和调用函数，你练习了所谓的*抽象*（abstraction）。抽象让你能够思考全局，而不必担心细节。在程序程序中，我可以直接使用\
  \ `instructions()` 函数，而不必担心显示文本的细节。我需要做的只是用一行代码调用函数，它就会完成工作。\n\n你可能会对在何处发现抽象感到惊讶，但人们一直在使用它。例如，考虑快餐店的两个员工。如果其中一个告诉另一个他刚刚装了一份三号套餐并“好了尺寸”，另一个员工就知道第一个员工接了订单，去了加热灯取了汉堡，去了炸锅，装满了纸盒薯条，去了饮料水机拿了一个大杯子装满汽水，交给了顾客，收了钱并找了零。这种程度的细节不仅会让对话变得无聊，而且是不必要的。两个员工都理解什么是三号套餐。\n\
  \n### 使用参数和返回值\n\n正如你在标准库函数中看到的那样，你可以提供一个值并返回一个值。例如，在 `toupper()` 函数中，你提供一个字符，函数返回该字符的大写版本。你自己的函数也可以接收值并返回值。这允许你的函数与程序的其余部分进行通信。\n\
  \n## 介绍 Yes or No 程序\n\nYes or No 程序向用户提出他们可能回答的典型问题。首先，程序询问用户指示是或否。然后程序变得具体，询问用户是否想保存游戏。再次，程序的运行并不显著；有趣的是它们的实现方式。每个问题都由不同的函数提问，这些函数与\
  \ `main()` 进行通信。图 5.2 显示了程序的运行示例。\n\n**图 5.2**\n\n每个问题都由一个独立的函数询问，信息在这些函数与 `main()`\
  \ 之间传递。\n\n![images](img/00053.jpeg)\n\n\n\n\n```cpp\n // Yes or No\n// Demonstrates\
  \ return values and parameters\n\n#include <iostream>\n#include <string>\n\nusing\
  \ namespace std;\n\nchar askYesNo1();\nchar askYesNo2(string question);\n\nint main()\n\
  {\n    char answer1 = askYesNo1();\n    cout << \"Thanks for answering: \" << answer1\
  \ << \"\\n\\n\";\n\n    char answer2 = askYesNo2(\"Do you wish to save your game?\"\
  );\n    cout << \"Thanks for answering: \" << answer2 << \"\\n\";\n\n    return\
  \ 0;\n}\n\nchar askYesNo1()\n{\n     char response1;\n     do\n     {\n        \
  \ cout << \"Please enter ’y’ or ’n’: \";\n         cin >> response1;\n     } while\
  \ (response1 != ’y’ && response1 != ’n’);\n     return response1;\n}\n\nchar askYesNo2(string\
  \ question)\n{\n     char response2;\n     do\n     {\n         cout << question\
  \ << \" (y/n): \";\n         cin >> response2;\n     } while (response2 != ’y’ &&\
  \ response2 != ’n’);\n\n     return response2;\n}\n```\n\n## 返回值\n\n你可以从函数返回一个值，以便将信息传回调用代码。要返回一个值，你需要指定一个返回类型，然后从函数返回该类型的值。\n\
  \n### 指定明返回类型\n\n我声明的第一个函数 `askYesNo1()` 返回一个 `char` 类型的值。你可以从 `main()` 之前的函数原型中看出这一点：\n\
  \n```cpp\n char askYesNo1();\n```\n\n你也可以从 `main()` 之后的函数定义中看到这一点：\n\n```cpp\n char\
  \ askYesNo1()\n```\n\n### 使用 return 语句\n\n`askYesNo1()` 要求用户输入 y 或 n，并持续询问直到用户这样做为止。一旦用户输入了有效字符，函数将通过以下行结束，该行返回\
  \ `response1` 的值。\n\n```cpp\n return response1;\n```\n\n注意 `response1` 是一个 `char`\
  \ 类型的值。这是因为我在函数原型和函数定义中都承诺返回该类型。\n\n函数每当遇到 `return` 语句时就会结束。函数拥有多个 `return` 是完全可以的。这仅仅意味着函数有几个可以结束的点。\n\
  \n### 小技巧\n\n* 你并不非要通过 `return` 语句返回值。在不返回值的函数（即返回类型指示为 `void` 的函数）中，你可以单独使用 `return`\
  \ 来结束函数。\n\n### 使用返回的值\n\n在 `main()` 中，我通过以下行调用了该函数，并将函数的返回值赋值给 `answer1`。\n\n```cpp\n\
  \ char answer1 = askYesNo1();\n```\n\n这意味着 `answer1` 被赋值为 ’`y’ 或 ’`n’——具体取决于用户在\
  \ `askYesNo1()` 提示时输入的哪个字符。\n\n接下来，在 `main()` 中，我显示了 `answer1` 的值供大家查看。\n\n## 向参数传递值\n\
  \n你可以向函数发送值，这些值会被接收到参数中。这是向函数传递信息最常见的方法。\n\n### 指定参数\n\n我声明的第二个函数 `askYesNo2()`\
  \ 接收一个值到一个参数。具体来说，它接受一个 `string` 类型的值。你可以从 `main()` 之前的函数原型中看出：\n\n```cpp\n char\
  \ askYesNo2(string question);\n```\n\n### 提示\n\n* 在原型中你不非要使用参数名称；你只需要包含参数类型。例如，下面是一个完全有效的原型，它声明了\
  \ `askYesNo2()`，这是一个具有一个 `string` 参数并返回 `char` 的函数。\n\n```cpp\n char askYesNo2(string);\n\
  ```\n\n尽管在原型中你不非要使用参数名称，但这样做是一个好主意。它让你的代码更清晰，而且这种微小的努力是值得的。\n\n从 `askYesNo2()` 的头部可以看出该函数接受一个\
  \ `string` 对象作为参数，并将该参数命名为 `question`。\n\n```cpp\n char askYesNo2(string question)\n\
  ```\n\n与原型不同，你必须在函数定义中指定参数名称。你在函数内部使用参数名称来访问参数值。\n\n### 陷阱\n\n* 函数原型中指定的参数类型必须与函数定义中列出的参数类型匹配。如果它们不匹配，你将产生一个糟糕的编译错误。\n\
  \n### 向参数传递值\n\n`askYesNo2()` 函数是 `askYesNo1()` 的改进。新函数允许你通过向函数传递字符串提示字符串来询问你自己的个性化问题。在\
  \ `main()` 中，我通过这样调用了 `askYesNo2()`：\n\n```cpp\n char answer2 = askYesNo2(\"Do you\
  \ wish to save your game?\");\n```\n\n该语句调用了 `askYesNo2()`并将字符串字面量参数 `\"Do you wish\
  \ to save your game?\"` 传递给函数。\n\n### 使用参数值\n\n`askYesNo2()` 是 `askYesNo1()` 的改进。新函数允许你通过向函数传递字符串提示字符串来询问你自己的个性化问题。在\
  \ `main()` 中，我通过这样调用了 `askYesNo2()`：\n\n```cpp\n char answer2 = askYesNo2(\"Do you\
  \ wish to save your game?\");\n```\n\n该语句调用了 `askYesNo2()`并将字符串字面量参数 `\"Do you wish\
  \ to save your game?\"` 传递给函数。\n\n## 理解封装\n\n在使用函数时，你可能觉得不需要返回值。为什么不直接使用 `response1`\
  \ 和 `response2` 呢？因为它们不能存在于定义它们的函数之外。这是一个好事，被称为**封装**。封装通过隐藏细节来保持独立代码的真正分离。此外，你使用参数和返回值——仅通信需要交换的信息。\n\
  \n封装听起来很像抽象。这是因为它们紧密相关。封装是抽象的一个原则。抽象让你免于担心细节，而封装则向你隐藏细节。作为一个例子，考虑一个带有音量增大和音量缩小按钮的电视遥控器。当你使用电视遥控器改变音量时，你正在运用抽象，因为你不需要知道电视内部发生了什么让它工作。现在假设电视遥控器有\
  \ 10 个音量级。你可以通过遥控器到达所有级别，但你不能直接访问它们。也就是说，你不能直接获取特定的音量数字。\n\n### 理解软件复用\n\n你可以在其他程序中复用函数。例如，由于在游戏中询问用户是或否问题是一个非常常见的操作，你可以创建一个\
  \ `askYesNo()` 函数并在以后所有的游戏程序中使用它。因此，编写良好的函数不仅可以在你当前的游戏项目中节省时间和精力的未来还可以在未来的项目中节省精力。\n\
  \n### 在现实世界中\n\n* 重造轮子总是在浪费时间，因此*软件复用*——在新项目中采用现有的软件和其他元素——是游戏公司非常重视的一种技术。软件复用的益处包括：\n\
  \n**提高公司生产力**。通过复用已存在的代码和其他元素（例如图形引擎），游戏公司可以用更少的努力完成他们的项目。\n\n\n\n\n\n![images](img/00007.jpeg)\
  \ **提高软件质量**。如果一家游戏公司已经有一段测试过的代码（例如网络模块），那么公司就可以在知晓代码没有 bug 的情况下重复使用这些代码。\n\n![images](img/00007.jpeg)\
  \ **提高软件性能**。一旦游戏公司拥有一段高性能代码，再次使用它不仅可以省去重复造轮子的麻烦，还能避免他们重新编写一个效率更低的代码。\n\n你可以通过从一个程序复制并粘贴到另一个程序来重用已编写的代码，但有一种更好的方法。你可以将一个大型游戏项目分为多个文件。你将在第\
  \ 10 章“继承与多态：黑杰游戏”中学习这种技术。\n\n# 处理作用域\n\n变量的`scope`（scope）决定了变量在程序中的可见区域。作用域允许你限制变量的可访问性，是封装的关键，有助于保持程序的不同部分（如函数）相互独立。\n\
  \n## 介绍作用域程序\n\nScoping 程序演示了作用域。该程序在三个不同的作用域中创建了三个同名的变量。程序显示了这些变量的值，你可以看到，尽管它们名称相同，但这些变量是完全独立的实体。图\
  \ 5.3 显示了程序的运行。\n\n**图 5.3**\n\n尽管它们名称相同，所有三个变量在各自的作用域中都有唯一的独立性。\n\n![images](img/00054.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 5 章文件夹中；文件名为 `scoping.cpp`。\n\n```cpp\n // Scoping\n// 演示作用域\n\n#include <iostream>\n\
  \nusing namespace std;\n\nvoid func();\n\nint main()\n{\n    int var = 5;   // main()\
  \ 中的局部变量\n    cout << \"In main() var is: \" << var << \"\\n\\n\";\n\n    func();\n\
  \n    cout << \"Back in main() var is: \" << var << \"\\n\\n\";\n\n    {\n     \
  \   cout << \"In main() in a new scope var is: \" << var << \"\\n\\n\";\n\n    \
  \    cout << \"Creating new var in new scope.\\n\";\n        int var = 10; // 新作用域中的变量，隐藏了其他名为\
  \ var 的变量\n        cout << \"In main() in a new scope var is: \" << var << \"\\\
  n\\n\";\n    }\n\n    cout << \"At end of main() var created in new scope no longer\
  \ exists.\\n\";\n    cout << \"At end of main() var is: \" << var << \"\\n\";\n\n\
  \    return 0;\n}\n\nvoid func()\n{\n    int var = -5; // func() 中的局部变量\n    cout\
  \ << \"In func() var is: \" << var << \"\\n\\n\";\n}\n```\n\n## 处理独立的作用域\n\n每当你使用大括号创建一个块时，你就创建了一个作用域。函数就是其中一个例子。在作用域中声明的变量在\
  \ particular 作用域外部是不可见的。这意味着在函数内部声明的变量在函数外部是不可见的。\n\n在函数内部声明的变量被视为*局部变量*——它们局限于该函数。这就是函数具有封装性的原因。\n\
  \n你已经见过许多局部变量的运行了。我在 `main()` 中又定义了一个局部变量：\n\n```cpp\n int var = 5;  // main() 中的局部变量\n\
  ```\n\n这一行代码声明并初始化了一个名为 `var` 的局部变量。我在下一行代码中将该变量发送到 `cout`：\n\n```cpp\n cout <<\
  \ \"In main() var is: \" << var << \"\\n\\n\";\n```\n\n它的工作方式正如你预期的一样——显示了 5。\n\n\
  接下来，我调用了 `func()`。一旦进入函数，我就处于由 `main()` 定义的作用域之外的独立作用域中。因此，我无法访问在 `main()` 中定义的变量\
  \ `var`。这意味着当我随后在 `func()` 中通过以下代码定义名为 `var` 的变量时，这个新变量与 `main()` 中名为 `var` 的变量是完全独立的。\n\
  \n```cpp\n int var = -5; // func() 中的局部变量\n```\n\n两者之间互不影响，这就是作用域的魅力所在。当你编写函数时，不需要担心另一个函数是否使用了相同的变量名。\n\
  \n然后，当我用以下代码在 `func()` 中显示 `var` 的值时，计算机显示了 -5。\n\n```cpp\n cout << \"In func()\
  \ var is: \" << var << \"\\n\\n\";\n```\n\n这是因为就计算机在这个作用域范围内，只有一个名为 `var` 的变量——我在这个函数中声明的局部变量。\n\
  \n一旦作用域结束，在该作用域中声明的所有变量将不再存在。这意味着当 `func()` 结束时，控制权返回到 `main()` 并从之前中断的地方继续。\n\n\
  ```cpp\n cout << \"Back in main() var is: \" << var << \"\\n\\n\";\n```\n\n## 处理嵌套作用域\n\
  \n你可以在现有的作用域中使用一对大括号创建一个嵌套作用域。这就是我接下来在 `main()` 中做的事：\n\n```cpp\n {\n       cout\
  \ << \"In main() in a new scope var is: \" << var << \"\\n\\n\";\n\n       cout\
  \ << \"Creating new var in new scope.\\n\";\n       int var = 10; // 新作用域中的变量，隐藏了其他名为\
  \ var 的变量\n       cout << \"In main() in a new scope var is: \" << var << \"\\n\\\
  n\";\n   }\n```\n\n这个作用域是 `main()` 中的一个嵌套作用域。我在这个作用域中做的第一件事是显示 `var`。因为作用域中没有声明\
  \ `var`，计算机向上查找定义 `main()` 的作用域并找到了 `var`。结果显示了该变量的值——5。\n\n然而，我在这个作用域中做的下一步是声明一个名为\
  \ `var` 的新变量并将其初始化为 10。现在当我将 `var` 发送到 `cout` 时，显示的是 10。这次计算机不需要向上查找任何嵌套作用域来寻找 `var`；在这个作用域中有一个\
  \ `var`。别担心，我在 `main()` 中最初声明的 `var` 仍然存在；只是在这个作用域中被隐藏了。\n\n接下来，当嵌套作用域结束时，值为 10\
  \ 的 `var` 离开作用域并不再存在。但是我最初创建的 `var` 还在，所以当我在 `main()` 中最后一次通过以下代码显示 `var` 时，程序显示\
  \ 5。\n\n```cpp\n cout << \"At end of main() var is: \" << var << \"\\n\";\n```\n\
  \n### 作用域陷阱与提示总结\n\n**陷阱**\n虽然可以在一系列嵌套作用域中声明同名的变量，但这并不是好主意，因为会导致混淆。\n\n**提示**\n\
  当你在 `for` 循环、`while` 循环、`if` 语句和 `switch` 语句内部定义变量时，这些变量在结构外部并不存在。它们就像是在嵌套作用域中声明的变量。例如，在以下代码中，变量\
  \ `i` 在循环外部是不存在的。\n\n```cpp\n for(int i = 0; i < 10; ++i)\n   {\n         cout <<\
  \ i;\n   }\n   // i 在循环外部不存在\n```\n\n\n\n\n但请注意——某些旧版本的编译器没有正确实现标准 C++ 的这一功能。我建议你使用带有现代编译器的\
  \ IDE，例如用于 Windows 桌面的 Microsoft Visual Studio Express 2013。关于如何使用此 IDE 创建你的第一个项目的步骤说明，请查看附录\
  \ A，“创建你的第一个 C++ 程序”。\n\n***\n\n## 使用全局变量\n\n通过封装的魔力，你看到的函数都是完全隔离且相互独立的。向它们传递信息的唯一方法是通过它们的参数，而从它们那里获取信息的唯一方法是获取它们的返回值。嗯，这并不完全正确。还有另一种方法可以在程序的各个部分共享信息——通过`全局变量`（可以从程序的任何部分访问的变量）。\n\
  \n## 介绍 Global Reach 程序\n\nGlobal Reach 程序演示了全局变量的使用。该程序展示了你如何从程序的任何地方访问全局变量。它还展示了你如何在作用域内隐藏全局变量。最后，它展示了你可以从程序的任何地方更改全局变量。图\
  \ 5.4 显示了程序的运行结果。\n\n**图 5.4**\n\n你可以从程序的任何地方访问和更改全局变量——但它们也可以被隐藏在作用域内。\n\n![images](img/00055.jpeg)\n\
  \n经 Microsoft 许可使用。\n\n你可以从 Cengage Learning 网站下载此程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 5 章文件夹中；文件名名为 `global_reach.cpp`。\n\n```cpp\n // Global Reach\n// Demonstrates\
  \ global variables\n\n#include <iostream>\n\nusing namespace std;\n\nint glob =\
  \ 10; // global variable\n\nvoid access_global();\nvoid hide_global();\nvoid change_global();\n\
  \nint main()\n{\n     cout << \"In main() glob is: \" << glob << \"\\n\\n\";\n \
  \    access_global();\n\n     hide_global();\n     cout << \"In main() glob is:\
  \ \" << glob << \"\\n\\n\";\n\n     change_global();\n     cout << \"In main() glob\
  \ is: \" << glob << \"\\n\\n\";\n\n     return 0;\n}\n\nvoid access_global()\n{\n\
  \     cout << \"In access_global() glob is: \" << glob << \"\\n\\n\";\n}\n\nvoid\
  \ hide_global()\n{\n     int glob = 0;  // hide global variable glob\n     cout\
  \ << \"In hide_global() glob is: \" << glob << \"\\n\\n\";\n}\n\nvoid change_global()\n\
  {\n     glob = -10;  // change global variable glob\n     cout << \"In change_global()\
  \ glob is: \" << glob << \"\\n\\n\";\n}\n```\n\n### 声明全局变量\n\n你在程序文件中的任何函数之外声明全局变量。这就是我在接下来的行中所做的，它创建了一个名为\
  \ `glob` 的初始化为 10 的全局变量。\n\n```cpp\n int glob = 10; // global variable\n```\n\n\
  ### 访问全局变量\n\n你可以从程序的任何地方访问全局变量。为了证明这一点，我在 `main()` 中通过以下代码显示了 `glob`：\n\n```cpp\n\
  \ cout << \"In main() glob is: \" << glob << \"\\n\\n\";\n```\n\n程序显示了 10，因为作为一个全局变量，`glob`\
  \ 对程序的任何部分都是可用的。为了再次证明这一点，我接着调用了 `access_global()`，计算机在那个函数中执行了以下代码：\n\n```cpp\n\
  \ cout << \"In access_global() glob is: \" << glob << \"\\n\\n\";\n```\n\n再次显示了\
  \ 10。这是合理的，因为我在每个函数中显示的都是完全相同的变量。\n\n### 隐藏全局变量\n\n你可以像隐藏其他变量一样在作用域内隐藏全局变量；你只需要声明一个同名的新变量。这就是我接下来调用\
  \ `hide_global()` 时所所做的。该函数中的关键行并没有更改全局变量 `glob`；相反，它创建了一个名为 `glob` 的局部于 `hide_global()`\
  \ 的新变量，从而隐藏了全局变量。\n\n```cpp\n int glob = 0; // hide global variable glob\n```\n\n\
  结果，当我接下来在 `hide_global()` 中通过以下行将 `glob` 发送到 `cout` 时，显示了 0。\n\n```cpp\n cout <<\
  \ \"In hide_global() glob is: \" << glob << \"\\n\\n\";\n```\n\n全局变量 `glob` 在 `hide_global()`\
  \ 的作用域内保持隐藏状态，直到函数结束。\n\n为了证明全局变量只是被隐藏而没有被更改，接下来我在 `main()` 中再次显示 `glob`：\n\n```cpp\n\
  \ cout << \"In main() glob is: \" << glob << \"\\n\\n\";\n```\n\n再次显示了 10。\n\n**陷阱**\n\
  \n***\n\n虽然你可以在函数中声明与全局变量同名的变量，但这不是一个好主意，因为可能会导致混淆。\n\n***\n\n### 修改全局变量\n\n就像你可以从程序的任何地方访问全局变量一样，你也可以从程序的任何地方修改它。这就是我接下来调用\
  \ `change_global()` 时所做的。该函数中的关键行将 -10 赋值给全局变量 `glob`。\n\n```cpp\n glob = -10; //\
  \ change global variable glob\n```\n\n为了证明它生效了，我在 `change_global()` 中显示该变量：\n\n\
  ```cpp\n cout << \"In change_global() glob is: \" << glob << \"\\n\\n\";\n```\n\n\
  然后，在 `main()` 中，我将 `glob` 发送到 `cout`：\n\n```cpp\n cout << \"In main() glob is: \"\
  \ << glob << \"\\n\\n\";\n```\n\n因为全局变量 `glob` 被更改了，显示了 10。\n\n### 减少全局变量的使用\n\n\
  仅仅因为技术上可以，并不意味着你这样做这样做。总的来说，全局变量会让程序变得混淆，因为很难跟踪它们的值。你应该限制它们的使用。\n\n## 使用常量\n\n与会让程序变得混淆的全局变量不同，全局常量（可以从程序的任何地方访问的常量）可以帮助程序变得清晰。你可以像声明全局变量一样声明全局常量——通过在任何函数之外声明。而且由于你声明的是常量，你需要使用\
  \ `const` 关键字。例如，接下来的行定义了一个（假设在任何函数之外声明）值为 10 的全局常量 `MAX_EMIES`。\n\n```cpp\n const\
  \ int MAX_EMIES = 10;\n```\n\n**陷阱**\n\n***\n\n就像全局变量一样，你可以通过声明同名的局部常量来隐藏全局常量。然而，你应该避免这样做，因为可能会导致混淆。\n\
  \n***\n\n全局常量究竟是如何让游戏代码变得清晰的？嗯，假设你正在编写一款动作游戏，你想限制一次可以攻击糟糕玩家的敌人总数。与其使用数字字面量（如 10），你不如定义一个等于\
  \ 10 的全局常量 `MAX_EMIES`。这样每当你看到这个全局常量名称时，你就确切知道它代表什么。\n\n注意：只有当程序的多个部分需要该值时，你应该使用全局常量。如果你只需要在特定作用域（例如单个函数内）需要一个常量值，请使用局部常量。\n\
  \n## 使用默认参数\n\n\n\n\n\nGive Me a Number 程序要求用户在两个不同的范围内输入两个不同的数字。每当用户被提示输入数字时，都会调用同一个函数。然而，每次调用该函数时使用的参数数量都不同，因为该函数为下限设置了默认参数。这意味着调用者可以省略下限的参数，函数将自动使用默认值。图\
  \ 5.5 显示了程序的运行结果。\n\n**图 5.5**\n\n在用户第一次被提示输入数字时，对下限使用了默认参数。\n\n![images](img/00056.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 5 章;\n\nint main()\n{\n    int number = askNumber(5);\n    cout << \"Thanks for\
  \ entering: \" << number << \"\\n\\n\";\n\n    number = askNumber(10, 5);\n    cout\
  \ << \"Thanks for entering: \" << number << \"\\n\\n\";\n\n    return 0;\n}\n\n\
  int askNumber(int high, int low)\n{\n    int num;\n    do\n    {\n        cout <<\
  \ \"Please enter a number\" << \" (\" << low << \" - \" << high << \"): \";\n  \
  \      cin >> num;\n    } while (num > high || num < low);\n\n    return num;\n\
  }\n```\n\n### 指定默认参数\n\n`askNumber()` 函数有两个参数：`high` 和 `low`。你可以从函数原型中看出这一点：\n\n\
  ```cpp\nint askNumber(int high, int low = 1);\n```\n\n注意第二个参数 `low` 看起来被赋值了一个值。在某种意义上，确实如此。`1`\
  \ 是一个默认参数，意味着当调用函数时没有为 `low` 传递值，则 `low` 被赋值为 `1`。你通过在参数名后使用 `=` 以及值来指定默认参数。\n\n\
  **陷阱**\n\n* * * 一旦你在参数列表中指定了默认参数，就必须为所有剩余参数指定默认参数。因此，以下原型是有效的：\n\n```cpp\nvoid setDisplay(int\
  \ height, int width, int depth = 32, bool fullScreen = true);\n```\n\n而下面这个是非法的：\n\
  \n```cpp\nvoid setDisplay(int width, int height, int depth = 32, bool fullScreen);\n\
  ```\n\n* * *\n\n顺便说，你不需要在函数定义中重复默认参数，正如你在 `askNumber()` 的函数定义中所看到的：\n\n```cpp\n\
  int askNumber(int high, int low)\n```\n\n### 为参数分配默认参数\n\n`askNumber()` 函数要求用户输入一个上下限之间的数字。函数会一直询问，直到用户输入一个范围内的数字，然后它返回该数字。我首先在\
  \ `main()` 中这样调用函数：\n\n```cpp\nint number = askNumber(5);\n```\n\n由于这段代码的作用，`askNumber()`\
  \ 中的参数 `high` 被赋值为 5。因为我没有为第二个参数 `low` 提供任何值，它被赋值为默认值 1。这意味着函数提示用户输入一个 1 到 5 之间的数字。\n\
  \n**陷阱**\n\n* * * 当你调用带有默认参数的函数时，一旦你省略了一个参数，就必须省略所有剩余参数的参数。例如，给定原型：\n\n```cpp\n\
  void setDisplay(int height, int width, int depth = 32, bool fullScreen = true);\n\
  ```\n\n一个有效的函数调用是：\n\n```cpp\nsetDisplay(1680, 1050);\n```\n\n而一个非法调用是：\n\n```cpp\n\
  setDisplay(1680, 1050, false);\n```\n\n* * *\n\n一旦用户输入有效数字，`askNumber()` 就会返回该值并结束。回到\
  \ `main()`，该值被赋值给 `number` 并显示。\n\n### 覆盖默认参数\n\n接下来，我再次这样调用 `askNumber()`：\n\n\
  ```cpp\nnumber = askNumber(10, 5);\n```\n\n这次我为 `low` 传递了一个值——5。这完全没问题；你可以为任何带有默认参数的参数传递参数，并且你传递的值将覆盖默认值。在这种情况下，意味着\
  \ `low` 被赋值为 5。\n\n结果是用户被提示输入一个 5 到 10 之间的数字。一旦用户输入有效数字，`askNumber()` 就会返回该值并结束。回到\
  \ `main()`，该值被赋值给 `number` 并显示。\n\n## 函数重载\n\n你已经看到必须为每个函数指定参数列表。但如果你想要一个多功能的函数呢——一个可以处理不同类型的函数？与其编写两个名称不同的独立函数，你可以可以使用重载，使得单个函数就能完成这项工作。\n\
  \n#### 引入 Triple 程序\n\nTriple 程序将值乘以三倍。图 5.5 显示了程序的示例运行。\n\n**图 5.5**\n\n函数重载允许你将不同类型的值乘以三倍。\n\
  \n![images](img/00056.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 5 章;\nstring triple(string text);\n\nint main()\n{\n    cout << \"Tripling 5:\
  \ \" << triple(5) << \"\\n\\n\";\n    cout << \"Tripling ‘gamer’: \" << triple(\"\
  gamer\");\n    return 0;\n}\n\nint triple(int number)\n{\n    return (number * 3);\n\
  }\n\nstring triple(string text)\n{\n    return (text + text + text);\n}\n```\n\n\
  #### 创建重载函数\n\n要创建重载函数，你只需要编写多个名称相同但参数列表不同的定义。在 Triple 程序中，我为 `triple()` 函数编写了两个定义，每个定义都指定了不同的类型作为参数。以下是函数的原型：\n\
  \n```cpp\nint triple(int number);\nstring triple(string text);\n```\n\n第一个接收一个 `int`\
  \ 参数并返回一个 `int`。第二个接收一个 `string` 对象并返回一个 `string` 对象。\n\n在每个函数定义中，你可以看到我返回发送值的三倍。在第一个函数中，我返回发送的\
  \ `int`。在第二个函数中，我返回重复了三次的发送 `string`。\n\n**陷阱**\n\n* * * 要实现函数重载，你需要为同一个函数编写多个不同参数列表定义。注意我没有提到任何关于返回类型的说明。这是因为如果你编写两个仅返回类型不同的函数定义，将产生编译错误。例如，你不能在程序中同时拥有以下原型：\n\
  \n```cpp\nint Bonus(int);\nfloat Bonus(int);\n```\n\n* * *\n\n#### 调用重载函数\n\n你可以像调用任何其他函数一样调用重载函数，即使用其名称和一组有效参数。但对于重载函数，编译器（根据参数值）决定调用哪种定义。例如，当我用下行代码调用\
  \ `triple()` 并使用 `int` 作为参数时，编译器知道要调用接收 `int` 的定义。结果是，函数返回 `int`  15。\n\n\n\n\n\n\
  ```\n cout << \"Tripling 5: \" << triple(5) << \"\\n\\n\";\n```\n\n我再次调用 `triple()`\
  \ 并传入：\n\n```\n cout << \"Tripling ’gamer’: \" << triple(\"gamer\");\n```\n\n由于我使用了字符串字面量作为参数，编译器知道要调用接受\
  \ `string` 对象的函数定义。因此，该函数返回等于 `gamergamergamer` 的 `string` 对象。\n\n## 函数内联 (INLINING\
  \ FUNCTIONS)\n\n调用函数会有很小的性能开销。通常这并不是问题，因为代价相对很小。然而，对于小型函数（例如只有一两行的函数），有时可以通过内联（inlining）它们来提高程序性能。通过\
  \ `inlining` 一个函数，你要求编译器在调用它的每个地方创建该函数的副本。这样，程序控制就不需要在每次调用函数时跳转到另一个位置。\n\n### 介绍“受到伤害”程序\n\
  \n“受到伤害”程序模拟了角色在受到辐射伤害时生命值发生的变化。角色每轮都会失去一半的生命值。幸运的是，程序只运行了三轮，所以我们免了角色悲剧的结局。该程序内联了计算角色新生命值的微型函数。图\
  \ 5.7 显示了程序的结果。\n\n**图 5.7**\n\n随着生命值通过内联函数减少，角色非常高效地走向了终点。\n\n![images](img/00058.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 5 章文件夹中；文件名为 `taking_damage.cpp`。\n\n```\n // 受到伤害\n// 演示函数内联\n\n#include <iostream>\n\
  \nint radiation(int health);\n\nusing namespace std;\n\nint main()\n{\n    int health\
  \ = 80;\n    cout << \"Your health is \" << health << \"\\n\\n\";\n\n    health\
  \ = radiation(health);\n    cout << \"After radiation exposure your health is \"\
  \ << health << \"\\n\\n\";\n\n    health = radiation(health);\n    cout << \"After\
  \ radiation exposure your health is \" << health << \"\\n\\n\";\n\n    health =\
  \ radiation(health);\n    cout << \"After radiation exposure your health is \" <<\
  \ health << \"\\n\\n\";\n\n    return 0;\n}\n\ninline int radiation(int health)\n\
  {\n    return (health / 2);\n}\n```\n\n### 指定内联的函数\n\n要标记一个函数为内联，只需在函数定义之前放置 `inline`\
  \ 即可。这就是我在定义以下函数时的做法：\n\n```\n inline int radiation(int health)\n```\n\n注意，你不需要在函数声明中使用\
  \ `inline`：\n\n```\n int radiation(int health);\n```\n\n通过用 `inline` 标记该函数，你要求编译器将函数直接复制到调用代码中。这节省了进行函数调用的开销。也就是说，程序控制不需要跳转到你代码的其他部分。对于小型函数，这可以带来性能提升。\n\
  \n然而，内联并不是解决性能问题的万灵妙药。事实上，无目的内联会导致更糟糕的性能，因为内联函数会创建额外的函数副本，这会大幅增加内存消耗。\n\n**提示**\n\
  \n* * *\n\n        当你内联一个函数时，你实际上是在向编译器提出一个请求，而编译器对是否内联该函数拥有最终决定权。如果编译器认为内联不会提升性能，它就不会内联该函数。\n\
  \n* * *\n\n### 调用内联函数\n\n调用内联函数与调用非内联函数没有区别，正如你第一次调用 `radiation()` 时看到的那样。\n\n```\n\
  \ health = radiation(health);\n```\n\n这行代码将 `health` 赋值为其原始值的一半。\n\n假设编译器接受了我的内联请求，这段代码就不会产生函数调用。相反，编译器将将\
  \ `health` 减半的代码直接放置在程序的这个位置。事实上，编译器对对该函数的全部三次调用都执行了这一操作。\n\n**现实世界**\n\n* * *\n\
  \n        尽管痴迷性能是游戏程序员最喜欢的爱好，但过度关注速度是有危险的。事实上，许多开发者采取的方法是，先让他们的游戏程序运行良好，然后再为了微小的性能提升进行调优。到那时，程序员会通过运行一个分析游戏程序耗时位置的工具（性能分析器）来对代码进行\
  \ `profile`（分析）。如果程序员发现瓶颈，他们可能会考虑手动优化，例如函数内联。\n\n* * *\n\n## 介绍 MAD LIB 游戏\n\nMad\
  \ Lib 游戏请求用户帮助创建一个故事。用户需要提供一个人的名字、一个复数名词、一个数字、一个身体部位和一个动词。程序获取所有这些信息并使用它们来创建一个个性化的故事。图\
  \ 5.8 显示了程序的示例运行。\n\n**图 5.8**\n\n在用户提供所有必要信息后，程序显示出故事。\n\n![images](img/00058.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 5 章文件夹中；文件名为 `mad_lib.cpp`。\n\n## 设置程序\n\n如常，我通过一些注释和包含必要的文件来开始程序。\n\n```\n //\
  \ Mad-Lib\n// 根据输入创建故事\n\n#include <iostream>\n#include <string>\n\nusing namespace\
  \ std;\n\nstring askText(string prompt);\nint askNumber(string prompt);\nvoid tellStory(string\
  \ name, int number, string bodyPart, string verb);\n```\n\n从我的函数原型可以看出，除了 `main()`\
  \ 之外还有三个函数——`askText()`、`askNumber()` 和 `tellStory()`。\n\n### main() 函数\n\n`main()`\
  \ 函数调用所有其他函数。它调用 `askText()` 从用户获取名字、复数名词、身体部位和动词。它调用 `askNumber()` 从用户获取数字。它带有所有用户的信息调用\
  \ `tellStory()` 来生成并显示故事。\n\n```\n int main()\n{\n    cout << \"Welcome to Mad Lib.\\\
  n\\n\";\n    cout << \"Answer the following questions to help create a story.\\\
  n\";\n\n    string name = askText(\"Please enter a name: \");\n    string noun =\
  \ askText(\"Please enter a plural noun: \");\n    int number = askNumber(\"Please\
  \ enter a number: \");\n    string bodyPart = askText(\"Please enter a body part:\
  \ \");\n    string verb = askText(\"Please enter a verb: \");\n\n    tellStory(name,\
  \ noun, number, bodyPart, verb);\n\n    return 0;\n}\n```\n\n### askText() 函数\n\n\
  `askText()` 函数从用户处获取字符串。该函数是通用的，接受一个 `string` 类型的参数，并用它来提示用户。正如此，我能够调用这个函数来向用户各种不同的信息，包括名字、复数名词、身体部位和动词。\n\
  \n```\n string askText(string prompt)\n{\n    string text;\n    cout << prompt;\n\
  \    cin >> text;\n    return text;\n}\n```\n\n**陷阱**\n\n* * *\n\n       记住，这种简单的\
  \ `cin` 使用方法只适用于不包含空格的字符串（例如制表符或空格）。因此，当用户被要求输入身体部位时，可以输入 `bellybutton`，但 `medulla\
  \ oblongata` 会导致程序产生问题。\n\n       有方法可以补偿这种影响，但这真的需要讨论一种被称为*流*的东西，那超出了本书的范围。所以以这种方式使用\
  \ `cin`，但只需要注意它的局限性。\n\n* * *\n\n### askNumber() 函数\n\n虽然我在程序中只调用了它一次，但它是通用的，因为它接受一个\
  \ `string` 类型的参数，并用它来提示用户。\n\n\n\n\n\n```cpp\n int askNumber(string prompt)\n{\n\
  \    int num;\n    cout << prompt;\n    cin >> num;\n    return num;\n}\n```\n\n\
  #### `tellStory()` 函数\n\n`tellStory()` 函数获取用户输入的所有信息并利用它们显示一个个性化的故事。\n\n```cpp\n\
  \ void tellStory(string name, string noun, int number, string bodyPart, string verb)\n\
  {\n    cout << \"\\nHere’s your story:\\n\";\n    cout << \"The famous explorer\
  \ \";\n    cout << name;\n    cout << \" had nearly given up a life-long quest to\
  \ find\\n\";\n    cout << \"The Lost City of \";\n    cout << noun;\n    cout <<\
  \ \" when one day, the \";\n    cout << noun;\n    cout << \" found the explorer.\\\
  n\";\n    cout << \"Surrounded by \";\n    cout << number;\n    cout << \" \" <<\
  \ noun;\n    cout << \", a tear came to \";\n    cout << name << \"’s \";\n    cout\
  \ << bodyPart << \".\\n\";\n    cout << \"After all this time, the quest was finally\
  \ over. \";\n    cout << \"And then, the \";\n    cout << noun << \"\\n\";\n   \
  \ cout << \"promptly devoured \";\n    cout << name << \". \";\n    cout << \"The\
  \ moral of the story? Be careful what you \";\n    cout << verb;\n    cout << \"\
  \ for.\";\n}\n```\n\n## 总结\n\n在本章中，你应该学习了以下概念：\n\n![images](img/00007.jpeg) 函数允许你将程序分解成易管理的部分。\n\
  \n![images](img/00007.jpeg) 声明函数的一种方法是编写函数原型——即列出函数的返回值、名称和参数类型的代码。\n\n![images](img/00007.jpeg)\
  \ 定义函数意味着编写所有使函数运行起来的代码。\n\n![images](img/00007.jpeg) 你可以使用 `return` 语句从函数返回一个值。你也可以使用\
  \ `return` 来结束一个返回类型为 `void` 的函数。\n\n![images](img/00007.jpeg) 变量的作用域决定了该变量在程序中的可见范围。\n\
  \n![images](img/00007.jpeg) 全局变量可以在程序的任何部分被访问。通常情况下，你应该尝试限制对全局变量的使用。\n\n![images](img/00007.jpeg)\
  \ 全局常量可以在程序的任何部分被访问。使用全局常量可以让你的程序代码更清晰。\n\n![images](img/00007.jpeg) 如果在函数调用时没有指定参数的值，则默认参数会被赋值给该参数。\n\
  \n![images](img/00007.jpeg) 函数重载是为同一个函数创建多个定义的过程，每个定义都有一组不同的参数集。\n\n![images](img/00007.jpeg)\
  \ 函数内联是请求编译器对函数进行内联的过程——这意味着编译器应该代码中调用函数的每个地方制作该函数的副本。内联非常小的函数有时可以带来性能提升。\n\n##\
  \ 问答\n\n**Q:** 我为什么应该写函数？\n\n**A：** 函数允许你将程序分解成逻辑部分。这些部分构成了更小、更易管理的代码块，比单一的单体式程序更容易处理。\n\
  \n**Q:** 什么是封装？\n\n**A：** 封装的核心在于保持事物的分离。例如，函数封装可以确保函数内部声明的变量在函数外部是不可见的。\n\n**Q:**\
  \ 参数（argument）和形参（parameter）之间的区别是什么？\n\n**A：** 参数你在函数调用中使用以向函数传递的值。形参你在函数定义中使用以接收传递给函数的值。\n\
  \n**Q:** 一个函数中可以有多个 `return` 语句吗？\n\n**A：** 可以的。事实上，你可能需要多个 `return` 语句来指定函数的不同结束点。\n\
  \n**Q:** 什么是局部变量？\n\n**A：** 定义在作用域内的变量。在函数中定义的所有变量都是局部变量；它们局限于该函数。\n\n**Q:** 隐藏变量意味着什么？\n\
  \n**A：** 当你在一个新作用域内声明一个与外部作用域变量同名的变量时，该变量就会被隐藏。结果是，你无法在内部作用域中使用该变量名来访问外部作用域中的变量。\n\
  \n**Q:** 变量何时会离开作用域？\n\n**A：** 当创建该变量的作用域结束时，该变量就离开了作用域。\n\n**Q:** 变量离开作用域意味着什么？\n\
  \n**A：** 意味着该变量不再存在了。\n\n**Q:** 什么是嵌套作用域？\n\n**A：** 在现有作用域内创建的作用域。\n\n**Q:** 参数的名称必须与形参名称相同吗？\n\
  \n**A：** 不需要。你可以自由使用不同的名称。\n\n**Q:** 我可以写函数吗？\n\n**A：** 当然可以。事实上，每当你写函数（`main()`\
  \ 之外）时，你都在这样做。\n\n**Q:** 什么是代码性能分析（code profiling）？\n\n**A：** 记录程序各个部分消耗时间的过程。\n\
  \n**Q:** 为什么要对代码进行性能分析？\n\n**A：** 为了确定程序中的任何瓶颈。有时重新检查这些代码部分是有意义的。\n\n**Q:** 程序员什么时候进行性能分析？\n\
  \n**A:** 通常在项目后期。\n\n**Q:** 什么是过早优化？\n\n**A：** 在开发过程的早期就尝试优化代码。代码优化通常在项目结束时才有意义。\n\
  \n## 讨论题\n\n1. 封装如何帮助你编写更好的程序？\n2. 全局变量如何让代码变得困惑？\n3. 全局常量如何让代码更清晰？\n4. 代码优化的优缺点是什么？\n\
  5. 软件复用如何造游戏行业？\n\n## 练习题\n\n1. 下面的原型有什么问题？\n```cpp\n int askNumber(int low = 1,\
  \ int high);\n```\n\n2. 使用函数重写第 4 章中的猜字游戏。包含一个用于获取玩家猜测的函数，以及另一个用于判断猜测是否在秘密单词中的函数。\n\
  \n**使用引用**\n\n*引用*（reference）为变量提供了另一个名称。你对引用的任何操作都会作用于它所引用的变量。你可以将引用看作变量的昵号——变量所使用的另一个名称。在本章的第一个程序中，我将展示如何创建引用。然后，在接下来的几个程序中，我将向你为什么要使用引用以及它们如何改进你的游戏程序。\n\
  \n#### 引入引用程序\n\n\n\n\n引用（Referencing）程序演示了引用。该程序声明并初始化了一个变量来存储分数，然后创建一个指向该变量的引用。程序通过变量和引用显示分数，以证明它们访问的是同一个单一值。接下来，程序展示了可以通过变量或引用来修改这个单一值。图\
  \ 6.1 演示了该程序。\n\n**图 6.1**\n\n变量 `myScore` 和引用 `mikesScore` 都是同一个分值值的名称。\n\n![images](img/00060.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 6 章\n{\n    int myScore = 1000;\n    int& mikesScore = myScore;   //create a reference\n\
  \n    cout << \"myScore is: \" << myScore << \"\\n\";\n    cout << \"mikesScore\
  \ is: \" << mikesScore << \"\\n\\n\";\n\n    cout << \"Adding 500 to myScore\\n\"\
  ;\n    myScore += 500;\n    cout << \"myScore is: \" << myScore << \"\\n\";\n\n\
  \    cout << \"mikesScore is: \" << mikesScore << \"\\n\\n\";\n\n    cout << \"\
  Adding 500 to mikesScore\\n\";\n    mikesScore += 500;\n    cout << \"myScore is:\
  \ \" << myScore << \"\\n\";\n    cout << \"mikesScore is: \" << mikesScore << \"\
  \\n\\n\";\n\n    return 0;\n}\n```\n\n### 创建引用\n\n我在 `main()` 中做的第一件事是创建一个变量来存储我的分数。\n\
  \n```cpp\n int myScore = 1000;\n```\n\n然后，我创建一个指向 `myScore` 的引用。\n\n```cpp\n int&\
  \ mikesScore = myScore; //create a reference\n```\n\n上一行声明并初始化了 `mikesScore`，这是一个指向\
  \ `myScore` 的引用。`mikesScore` 是 `myScore` 的别名。`mikesScore` 不持有它自己的 `int` 值；它只是获取\
  \ `myScore` 所持有的 `int` 值的另一种方式。\n\n要声明并初始化引用，首先从引用将指向的值类型开始，后面是引用运算符（`&`），然后是引用名称，接着是\
  \ `=`，最后是引用将指向的变量。\n\n**技巧 (Trick)**\n\n* * *\n\n有时程序员会在引用名称前加上字母“r”，以提醒他们正在处理一个引用。程序员可能会包含以下几行：\n\
  \n```cpp\n int playerScore = 1000; \n   int& rScore = playerScore;\n```\n\n* * *\n\
  \n理解引用的一种方法是将它们看作昵称。例如，假设你有一个叫 Eugene 的朋友，他（理所当然）要求被昵称称呼为 Gibby（虽然没什么改进，但这是 Eugene\
  \ Eugene 的愿望）。所以，当你和朋友参加派对时，你可以用 Eugene 或 Gibby 来叫他。你的朋友只有一个人，但你可以用他的名字或昵称来叫他。这与变量和该变量的引用的工作方式是一样的。你可以通过变量名或该变量引用的名称来访问存储在变量中的单一值。最后，无论如何，尽量不要给你的变量命名为\
  \ `Eugene`——为了它们好。\n\n**陷阱 (Trap)**\n\n* * *\n\n由于引用必须始终指向另一个值，因此必须在声明引用时对其进行初始化。如果不这样做，将得到编译错误。以下这一行是完全非法的：\n\
  \n```cpp\n int& mikesScore; //不要在家里尝试！\n```\n\n* * *\n\n### 访问引用的值\n\n接下来，我将 `myScore`\
  \ 和 `mikesScore` 都发送到 `cout`。\n\n```cpp\n cout << \"myScore is: \" << myScore <<\
  \ \"\\n\";\n   cout << \"mikesScore is: \" << mikesScore << \"\\n\\n\";\n```\n\n\
  这两行代码都显示了 `1000`，因为它们访问的是存储数字 1000 的同一内存块。记住，只有一个值，它存储在变量 `myScore` 中。`mikesScore`\
  \ 提供了访问该值的另一种方式。\n\n### 修改引用的值\n\n接下来，我将 `myScore` 的值增加了 500。\n\n```cpp\n myScore\
  \ += 500;\n```\n\n当我将 `myScore` 发送到 `cout` 时，显示了 `1500`，正如你预期的的一样。当我将 `mikesScore`\
  \ 发送到 `cout` 时，同样显示了 `1500`。同样，这是因为 `mikesScore` 变量 `myScore` 的另一个名称。本质上，我两次发送的是同一个变量到\
  \ `cout`。\n\n接下来，我将 `mikesScore` 增加了 500。\n\n\n\n\n```cpp\n // 交换\n// 展示通过传递引用来修改参数变量\n\
  \n#include <iostream>\n\nusing namespace std;\n\nvoid badSwap(int x, int y);\nvoid\
  \ goodSwap(int& x, int& y);\n\nint main()\n{\n    int myScore = 150;\n    int yourScore\
  \ = 1000;\n    cout << \"Original values\\n\";\n    cout << \"myScore: \" << myScore\
  \ << \"\\n\";\n    cout << \"yourScore: \" << yourScore << \"\\n\\n\";\n\n    cout\
  \ << \"Calling badSwap()\\n\";\n    badSwap(myScore, yourScore);\n    cout << \"\
  myScore: \" << myScore << \"\\n\";\n    cout << \"yourScore: \" << yourScore <<\
  \ \"\\n\\n\";\n\n    cout << \"Calling goodSwap()\\n\";\n    goodSwap(myScore, yourScore);\n\
  \    cout << \"myScore: \" << myScore << \"\\n\";\n    cout << \"yourScore: \" <<\
  \ yourScore << \"\\n\";\n\n    return 0;\n}\n\nvoid badSwap(int x, int y)\n{\n \
  \   int temp = x;\n    x = y;\n    y = temp;\n}\n\nvoid goodSwap(int& x, int& y)\n\
  {\n    int temp = x;\n    x = y;\n    y = temp;\n}\n```\n\n## 按值传递\n\n在声明并初始化 `myScore`\
  \ 和 `yourScore` 后，我将它们发送到 `cout`。正如你所预期的，显示了 `150` 和 `1000`。接下来，我调用了 `badSwap()`。\n\
  \n当你按照目前所看到的方式指定参数时（作为普通变量，而不是引用），你是在表示该参数的参数将是*按值传递*的，这意味着该参数将获得参数变量的*拷贝*，而不是直接访问参数变量本身。通过查看\
  \ `badSwap()` 的函数头，你可以发现对该函数的调用将两个参数都按值传递了的。\n\n```cpp\n void badSwap(int x, int\
  \ y)\n```\n\n这意味着当我使用下面这行代码调用 `badSwap()` 时，`myScore` 和 `yourScore` 的副本被发送到了参数 `x`\
  \ 和 `y`。\n\n```cpp\n badSwap(myScore, yourScore);\n```\n\n具体来说，`x` 被赋值为 `150`，`y`\
  \ 被赋值为 `1000`。结果是在我在 `badSwap()` 函数中对 `x` 和 `y` 进行的任何操作都不会对 `myScore` 和 `yourScore`\
  \ 产生任何影响。\n\n当 `badSwap()` 执行内部时，`x` 和 `y` 确实交换了值——`x` 变成了 `1000`，`y` 变成了 `150`。然而，当函数结束时，`x`\
  \ 和 `y` 都离开了作用域并不再存在。控制随后返回 `main()`，此时 `myScore` 和 `yourScore` 没有改变。然后，当我将 `myScore`\
  \ 和 `yourScore` 发送到 cout 时，`150` 和 `1000` 再次显示。遗憾的是，我仍然只有低分，而你仍然拥有高分。\n\n## 按引用传递\n\
  \n通过传递参数变量的引用，可以让函数访问参数变量。因此，对参数进行的任何操作都会在参数变量上进行。要进行*按引用传递*，你必须首先将参数声明为引用。\n\n\
  通过查看函数头，你可以发现调用 `goodSwap()`是将两个参数都按引用传递的。\n\n```cpp\n void goodSwap(int& x, int&\
  \ y)\n```\n\n这意味着当我使用下面这行代码调用 `goodSwap()` 时，参数 `x` 将引用 `myScore`，参数 `y` 将引用 `yourScore`。\n\
  \n```cpp\n goodSwap(myScore, yourScore);\n```\n\n这意味着 `x` 只是 `myScore` 的另一个名字，而\
  \ `y` 只是 `yourScore` 的另一个名字。当 `goodSwap()` 执行且 `x` 和 `y` 交换值时，实际上发生的是 `myScore`\
  \ 和 `yourScore` 交换了值。\n\n函数结束后，控制返回 `main()`，此时我将 `myScore` 和 `yourScore` 发送到 `cout`。这次显示了\
  \ `1000` 和 `150`。变量交换了值。我拿走了高分，留下了低分给。。终于成功了！\n\n## 为了效率而传递引用\n\n按值传递变量会产生一些开销，因为在将其赋值给参数之前你必须拷贝该变量。当我们谈论简单内置类型的变量时（如\
  \ `int` 或 `float`），这种开销是可以忽略不计的。但如果 是一个大对象，例如代表整个 3D 世界的对象，拷贝成本可能是昂贵的。相反，按引用传递是高效的，因为你不需要创建参数变量的拷贝。相反，你只需通过引用提供现有对象的访问。\n\
  \n### 引入背包显示器程序\n\nInventory Displayer 程序创建了一个字符串向量，代表英雄的背包。然后该程序调用一个显示背包的函数。程序将物品向量作为引用传递给显示函数，因此这是一个高效的调用；向量没有被拷贝。然而，出现了一个新问题。程序以一种特殊的引用形式传递向量，这种引用禁止显示器函数修改向量。图\
  \ 6.3\n\n\n\n\n回到 `main()` 函数，我创建了 `inventory`，然后通过以下行调用了 `display()`，该行将向量作为常量引用传递。\n\
  \n```\n display(inventory);\n```\n\n这导致了一个高效且安全的函数调用。它之所以高效，是因为只传递了引用；没有复制向量。它之所以安全，是因为向量的引用是常量引用；`display()`\
  \ 无法修改 `inventory`。\n\n**陷阱 (Trap)**\n\n* * *\n\n你不能修改标记为常量引用的参数。如果你尝试这样做，将产生编译错误。\n\
  \n* * *\n\n接下来，`display()` 使用对 `inventory` 的常量引用列出了向量中的元素。然后控制权返回 `main()`，程序结束。\n\
  \n### 决定如何传递参数\n\n到此时，你已经看到了了三种不同的参数传递方式：按值传递、引用传递和常量引用传递。那么，你如何决定使用哪种方法呢？这里是一些准则：\n\
  \n![images](img/00007.jpeg) **按值传递。** 当参数变量是基本内置类型之一（如 `bool`、`int` 或 `float`）时，使用按值传递。这些类型对象非常小，按引用传递不会带来效率上的提升。当你希望计算机创建变量的副本时，也应该按值传递。如果你计划在函数中修改参数，但不想影响实际的参数变量，那么你可能想要使用副本。\n\
  \n![images](img/00007.jpeg) **作为常量引用传递。** 当你想高效地传递一个不需要更改的值时，传递常量引用。\n\n![images](img/00007.jpeg)\
  \ **作为引用传递。** 只有当你想要更改参数变量的值时，才传递引用。然而，你应该尽量避免更改参数变量。\n\n### 返回引用\n\n就像你传递一个值一样，当你从函数返回一个值时，你实际上返回的是该值的副本。同样，对于基本内置类型的值，这并不是什么问题。但如果你返回一个大对象，这可能是一个昂贵的操作。返回引用是一个高效的替代方案。\n\
  \n### 引入 Inventory Referencer 程序\n\nInventory Referencer 程序演示了返回引用法。该程序通过返回的引用显示了持有英雄库存的向量元素。然后，程序通过返回的引用更改了其中一个物品。图\
  \ 6.4 显示了程序的运行。\n\n**图 6.4**\n\n通过返回引用显示并更改英雄库存中的物品。\n\n![images](img/00063.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 6 章文件夹中；文件名为 `inventory_referencer.cpp`。\n\n```\n // Inventory Referencer\n//\
  \ 演示返回引用\n\n#include <iostream>\n#include <string>\n#include <vector>\n\nusing namespace\
  \ std;\n\n// 返回字符串的引用\nstring& refToElement(vector<string>& inventory, int i);\n\
  \nint main()\n{\n    vector<string> inventory;\n    inventory.push_back(\"sword\"\
  );\n    inventory.push_back(\"armor\");\n    inventory.push_back(\"shield\");\n\n\
  \    // 显示返回引用所指的字符串\n    cout << \"Sending the returned reference to cout:\\n\"\
  ;\n    cout << refToElement(inventory, 0) << \"\\n\\n\";\n\n    // 将一个引用赋值给另一个引用\
  \ -- 低成本赋值\n    cout << \"Assigning the returned reference to another reference.\\\
  n\";\n    string& rStr = refToElement(inventory, 1);\n    cout << \"Sending the\
  \ new reference to cout:\\n\";\n    cout << rStr << \"\\n\\n\";\n\n    // 复制字符串对象\
  \ -- 昂贵的赋值\n    cout << \"Assigning the returned reference to a string.\\n\";\n\
  \    string str = refToElement(inventory, 2);\n    cout << \"Sending the string\
  \ object to cout:\\n\";\n    cout << str << \"\\n\\n\";\n\n    // 通过返回引用修改对象\n \
  \   cout << \"Altering an object through a returned reference.\\n\";\n    rStr =\
  \ \"Healing Potion\";\n    cout << \"Sending the altered object to cout:\\n\";\n\
  \    cout << inventory[1] << endl;\n\n    return 0;\n}\n\n// 返回字符串的引用\nstring& refToElement(vector<string>&\
  \ vec, int i)\n{\n    return vec[i];\n}\n```\n\n### 返回引用\n\n在函数返回引用之前，你必须指定你正在返回一个引用。这就是我在\
  \ `refToElement()` 函数头部中所做的。\n\n```\n string& refToElement(vector<string>& inventory,\
  \ int i)\n```\n\n**陷阱 (Trap)**\n\n* * *\n\n返回局部变量的引用是非合法的。例如，避免这种问题的方法是永远不要返回局部变量的引用。\n\
  \n* * *\n\n```\n string& badReference()\n   {\n       string local = \"This string\
  \ will cease to exist.\";\n       return local;\n   }\n```\n\n* * *\n\n避免这种问题的方法是永远不要返回局部变量的引用。\n\
  \n### 显示返回引用的值\n\n在创建 `inventory`（物品向量）后，我通过返回引用显示第一个物品。\n\n```\n cout << refToElement(inventory,\
  \ 0) << \"\\n\\n\";\n```\n\n前面的代码调用了 `refToElement()`，它返回 `inventory` 中位置 `0` 元素的引用，然后将该引用发送到\
  \ `cout`。结果显示了 `sword`。\n\n### 将返回引用赋值给引用\n\n接下来，我通过以下行将返回引用赋值给另一个引用，该行获取 `inventory`\
  \ 中位置 `1` 元素的引用并将其赋值给 `rStr`。\n\n```\n string& rStr = refToElement(inventory, 1);\n\
  ```\n\n这是一个高效的赋值，因为将引用赋值给引用不涉及对象的复制。然后我将 `rStr` 发送到 `cout`，显示了 `armor`。\n\n### 将返回引用赋值给变量\n\
  \n接下来，我将返回引用赋值给变量。\n\n```\n string str = refToElement(inventory, 2);\n```\n\n前面的代码并没有将引用赋值给\
  \ `str`。它不能这样做，因为 `str` 是一个 `string` 对象。相反，代码复制了返回引用所指的元素（`inventory` 中位置 `2` 的元素），并将该新的\
  \ `string` 对象副本赋值给 `str`。由于这种赋值涉及对象的复制，它比将一个引用赋值给另一个引用要昂贵。\n\n\n\n\n\n```cpp\n rStr\
  \ = \"Healing Potion\";\n```\n\n由于 `rStr` 指向 `inventory` 中位置为 `1` 的元素，这行代码更改了 `inventory[1]`，使其等于“Healing\
  \ Potion”。为了证明这一点，我使用以下代码显示该元素，它确实显示了 `Healing Potion`。\n\n```cpp\n cout << inventory[1]\
  \ << endl;\n```\n\n如果我想保护 `inventory`，使得由 `refToElement()` 返回的引用不能用于更改该 vector，我应该将函数的返回类型指定为常量引用。\n\
  \n# 介绍井字棋游戏\n\n在本章的项目中，你将学习如何利用少量的 `AI`（人工智能）来创建一个计算机对手。在游戏中，玩家和计算机将在场高风险的、真正的“人机对决”的井字棋比赛中一决胜负。计算机的表现非常强劲（尽管并不完美），并且带有足够的态度，让每一场比赛都变得有趣。图\
  \ 6.5 显示了比赛的开始。\n\n**图 6.5**\n\n计算机充满了……自信。\n\n![images](img/00064.jpeg)\n\n经微软许可使用。\n\
  \n## 游戏规划\n\n这个游戏是你目前为止野心勃勃的项目。你确实拥有创建它所需的所有技能，但我将通过一个较长的规划章节，来帮助你掌握大局，并理解如何创建一个更大的程序。记住，编程最重要的部分是为编程做规划。没有路线图，你永远无法到达你想去的地方（或者走风景路线会花费你更多时间）。\n\
  \n### 在现实世界中\n\n* * 游戏设计师在程序员编写任何游戏代码之前，会在概念方案、设计文档和原型上花费无数小时。一旦设计工作完成，程序员就开始了他们工作——同样是更多的规划。只有在程序员编写了自己的技术设计之后，他们才开始正经编码。这个故事的启示是？规划。放弃一张蓝图比放弃一栋\
  \ 50 层高的楼容易得多。\n\n### 编写伪代码\n\n回到你最喜欢的并非真正语言的语言——伪代码。因为我将用函数处理程序的大部分任务，所以我可以在相当抽象的层面考虑代码。每一行伪代码应该感觉像一次函数调用。稍后，我只需要编写计划中暗示的函数即可。以下是伪代码：\n\
  \n```\n 创建一个空的井字棋棋盘 \n显示游戏说明 \n确定谁先手 \n显示棋盘 \n当没有人赢且不是平局时\n    如果是玩家回合\n       \
  \ 获取玩家的移动 \n        根据玩家的移动更新棋盘 \n    否则\n        计算计算机的移动 \n        根据计算机的移动更新棋盘\
  \ \n    显示棋盘 \n    切换回合 \n祝贺胜利者或宣布平局\n```\n\n### 数据表示\n\n好了，我有一个很好的计划，但它相当抽象，并且谈到了许多在我脑海中尚未真正定义的各种元素。我把“移动”的想法看作是在游戏棋盘上放置棋子。但我究竟该如何表示游戏盘呢？或者棋子？还是移动？\n\
  \n既然我要在屏幕上显示棋盘，为什么不直接将棋子表示为单个字符——X 或 O 呢？空棋子可以是一个空格。因此，棋盘本身可以是 `char` 的 `vector`。井字棋棋盘上有九个格子，所以\
  \ vector 应该有九个元素。棋盘上的每个格子将对应 vector 中的一个元素。图 6.6 说明了我的意思。\n\n**图 6.6**\n\n每个格子编号对应于\
  \ vector 中表示棋盘的位置。\n\n![images](img/00065.jpeg)\n\n棋盘上的每个格子或位置都用数字 0–8 表示。这意味着 vector\
  \ 将有九个元素，赋予其编号 0–8。因为每次移动都指示应该放置棋子的格子，所以移动也只是数字 0–8。这意味着移动可以表示为 `int`。\n\n玩家和计算机对战的方也可以用\
  \ `char` 表示——要么是 ’X’ 或 ’O’，就像棋子一样。表示当前回合方的变量也将是一个 `char`，要么是 ’X’ 或 ’O’。\n\n### 创建函数列表\n\
  \n伪代码启发了我需要的不同函数。我创建了它们的列表，考虑了每个函数将做什么、拥有什么参数以及返回什么值。表 6.1 显示了我的努力结果。\n\n**表 6.1\
  \ 井字棋函数**\n\n![images](img/00066.jpeg)\n\n## 程序设置\n\n你可以从 Cengage Learning 网站下载此程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。\n\
  \n代码的第一部分包含头和全局常量。\n\n```cpp\n#include <iostream>\n#include <string>\n#include <vector>\n\
  #include <algorithm>\n\nusing namespace std;\n\nconst char X = 'X';\nconst char\
  \ O = 'O';\nconst char EMPTY = ' ';\nconst char TIE = 'T';\nconst char NO_ONE =\
  \ 'N';\n\n// 函数原型\nchar winner(const vector<char>& board);\nbool isLegal(const vector<char>&\
  \ board, int move);\nvoid displayBoard(const vector<char>& board);\nchar askYesNo(string\
  \ question);\nint humanMove(vector<char>& board, char player);\nint computerMove(vector<char>&\
  \ board, char player);\nvoid announceWinner(char winner, char computer, char human);\n\
  ```\n\n`main` 函数是程序的入口。\n\n```cpp\n // main 函数\nint main()\n{\n    int move;\n \
  \   const int NUM_SQUARES = 9;\n    vector<char> board(NUM_SQUARES, EMPTY);\n\n\
  \    instructions();\n    char human = humanPiece();\n    char computer = opponent(human);\n\
  \    char turn = X;\n\n    displayBoard(board);\n\n    while (winner(board) == NO_ONE)\n\
  \    {\n        if (turn == human)\n        {\n            move = humanMove(board,\
  \ human);\n            board[move] = human;\n        }\n        else\n        {\n\
  \            move = computerMove(board, computer);\n            board[move] = computer;\n\
  \        }\n        displayBoard(board);\n        turn = opponent(turn);\n    }\n\
  \n    announceWinner(winner(board), computer, human);\n\n    return 0;\n}\n```\n\
  \n`instructions` 函数显示游戏说明，并赋予计算机对手一点态度。\n\n```cpp\n void instructions()\n{\n   \
  \ cout << \"欢迎来到终的人机对决：井字棋。\\n\";\n    cout << \"--人类大脑对阵硅片处理器\\n\\n\";\n\n    cout\
  \ << \"通过输入数字 0 - 8 让你的移动已知。该数字\\n\";\n    cout << \"对应所需的棋盘位置，如下所示：\\n\\n\";\n\n\
  \    cout << \" 0 | 1 | 2\\n\";\n    cout << \" –––––––––\\n\";\n    cout << \"\
  \ 3 | 4 | 5\\n\";\n    cout << \" –––––––––\\n\";\n    cout << \" 6 | 7 | 8\\n\\\
  n\";\n\n    cout << \"准备好了，人类。战斗即刻开始。\\n\\n\";\n}\n```\n\n\n\n\n\n此函数会询问一个“是”或“否”的问题。它会持续提问，直到玩家输入\
  \ `y` 或 `n` 为止。它接收一个 `question`（问题）并返回 `y` 或 `n`。\n\n```cpp\n char askYesNo(string\
  \ question)\n{\n    char response;\n    do\n    {\n        cout << question << \"\
  \ (y/n): \";\n        cin >> response;\n    } while (response != 'y' && response\
  \ != 'n');\n\n    return response;\n  }\n```\n\n### `askNumber()` 函数\n\n此函数要求一个范围内的数字，并持续提问直到玩家输入一个有效的数字。它接收一个\
  \ `question`、一个 `high number`（高值）和一个 `low number`（低值）。它返回一个范围内的数字。\n\n```cpp\n int\
  \ askNumber(string question, int high, int low)\n{\n    int number;\n    do\n  \
  \  {\n        cout << question << \" (\" << low << \" – \" << high << \"): \";\n\
  \        cin >> number;\n    } while (number > high || number < low);\n\n    return\
  \ number;\n}\n```\n\n如果你查看此函数的原型，你会发现 `low number` 有一个默认值 `0`。我在程序后部分调用该函数时利用了这一点。\n\
  \n### `humanPiece()` 函数\n\n此函数询问玩家他是否想先手，并根据该选择返回人类的棋子。根据井棋（Tic–Tac–Toe）的伟大传统，`X`\
  \ 先手。\n\n```cpp\n char humanPiece()\n{\n    char go_first = askYesNo(\"Do you require\
  \ the first move?\");\n    if (go_first == 'y')\n    {\n        cout << \"\\nThen\
  \ take the first move. You will need it.\\n\";\n        return X;\n    }\n    else\n\
  \    {\n        cout << \"\\nYour bravery will be your undoing...I will go first.\\\
  n\";\n        return 0;\n    }\n}\n```\n\n### `opponent()` 函数\n\n此函数获取一个棋子（`X` 或\
  \ `0`）并返回对手的棋子（`X` 或 `0`）。\n\n```cpp\n char opponent(char piece)\n{\n    if (piece\
  \ == X)\n    {\n        return 0;\n    }\n    else\n    {\n        return X;\n \
  \   }\n}\n```\n\n### `displayBoard()` 函数\n\n此函数显示传递给它的棋盘。由于棋盘上的每个元素都是空格、`X` 或 `0`，该函数可以显示每一个一个。我使用了键盘上的另外几个字符来绘制一个外观体面的井棋盘。\n\
  \n```cpp\n void displayBoard(const vector<char>& board)\n{\n    cout << \"\\n\\\
  t\" << board[0] << \" | \" << board[1] << \" | \" << board[2];\n    cout << \"\\\
  n\\t\" << \"–––––––––\";\n    cout << \"\\n\\t\" << board[3] << \" | \" << board[4]\
  \ << \" | \" << board[5];\n    cout << \"\\n\\t\" << \"–––––––––\";\n    cout <<\
  \ \"\\n\\t\" << board[6] << \" | \" << board[7] << \" | \" << board[8];\n    cout\
  \ << \"\\n\\n\";\n}\n```\n\n注意，代表棋盘的 `vector` 是通过常量引用传递的。这意味着 `vector` 的传递是高效的；它没有被复制。这也意味着\
  \ `vector` 受到保护，防止任何更改。由于我计划在该函数中只显示棋盘而不改变它，所以这是完美的。\n\n### `winner()` 函数\n\n此函数接收\
  \ `board` 并返回胜利者。胜利者有四种可能的值。如果其中一个玩家获胜，函数将返回 `X` 或 `O`。如果每个格子都填满且没有人获胜，它返回 `TIE`（平局）。最后，如果没有人胜且至少有一个空格，函数返回\
  \ `NO_ONE`。\n\n```cpp\n char winner(const vector<char>& board)\n{\n    // 所有可能的胜利行\n\
  \    const int WINNING_ROWS[8][3] = { {0, 1, 2},\n                             \
  \        {3, 4, 5},\n                                     {6, 7, 8},\n         \
  \                            {0, 3, 6},\n                                     {1,\
  \ 4, 7},\n                                     {2, 5, 8},\n                    \
  \                 {0, 4, 8},\n                                     {2, 4, 6} };\n\
  ```\n\n首先要的是，代表棋盘的 `vector` 是通过常量引用传递的。这意味着 `vector` 的传递是高效的；它没有被复制。这也意味着 `vector`\
  \ 受到保护，防止任何更改。\n\n在函数的初始部分，我定义了一个名为 `WINNING_ROWS` 的常量 `int` 二维数组，它代表了连线三个获胜游戏的全部八种方式。每行胜利行都由三个数字的组表示——即三个组成胜利行的棋盘位置。例如，数字组\
  \ `{0, 1, 2}` 代表顶行——棋盘位置 0、1 和 2。下一组 `{3, 4, 5}` 代表中间行——棋盘位置 3、4 和 5。以此类推……\n\n\
  接下来，我检查是否有人获胜了。\n\n```cpp\n    for (int i = 0; i < 8; i++)\n    {\n        if (board[WINNING_ROWS[i][0]]\
  \ == board[WINNING_ROWS[i][1]] &&\n            board[WINNING_ROWS[i][1]] == board[WINNING_ROWS[i][2]]\
  \ &&\n            board[WINNING_ROWS[i][0]] != EMPTY)\n        {\n            return\
  \ board[WINNING_ROWS[i][0]];\n        }\n    }\n\n    if (count(board.begin(), board.end(),\
  \ EMPTY) == 0)\n    {\n        return TIE;\n    }\n\n    return NO_ONE;\n}\n```\n\
  \n### `isLegal()` 函数\n\n此函数接收一个棋盘和一个移动。如果该移动在棋盘上是法的，则返回 `true`，否则返回 `false`。合法移动由\
  \ `EMPTY` 格子的编号表示。\n\n你可以看到我内联了 `isLegal()`。现代编译器本身就能很好地进行优化；但由于此函数只有一行代码，它是内联的良好候选。\n\
  \n```cpp\n inline bool isLegal(int move, const vector<char>& board)\n{\n    return\
  \ (board[move] == EMPTY);\n}\n```\n\n### `humanMove()` 函数\n\n下一个函数接收棋盘和人类的棋子。它返回玩家想要移动的格子编号。函数询问玩家想要移动的格子编号，直到返回的结果是合法的移动。然后函数返回该移动。\n\
  \n```cpp\n int humanMove(const vector<char>& board, char human)\n{\n    int move\
  \ = askNumber(\"Where will you move?\", (board.size() – 1));\n    while (!isLegal(move,\
  \ board))\n    {\n        cout << \"\\n 那个格子已经被占了，愚蠢的人类。\\n\";\n        move = askNumber(\"\
  Where will you move?\", (board.size() – 1));\n    }\n    cout << \"Fine...\\n\"\
  ;\n\n    return move;\n}\n```\n\n### `computerMove()` 函数\n\n此函数接收棋盘和电脑的棋子。它返回电脑的移动。首先要注意我没有通过引用传递棋盘。\n\
  \n```cpp\n int computerMove(vector<char> board, char computer)\n```\n\n\n\n\n相反，我选择了值传递，尽管它没有引用传递那样高效。我使用值传递是因为我在在空格上放置棋子时，需要操作并修改棋盘的副本，以确定计算机的最佳移动。通过对副本进行操作，我可以保持代表棋盘的原始\
  \ vector 的安全。\n\n现在进入函数的内部部分。好了，我如何编写一段 AI 程序让计算机进行一场像样的战斗呢？嗯，我想出了一个选择移动的基本三步策略。\n\
  \n1. 如果计算机这一步可以获胜，就执行该移动。\n2. 否则，如果人类在下一步可以获胜，就封堵他。\n3. 否则，选择剩余最好的空格。最好的格子是中心。其次的格子是角，然后是其他格子。\n\
  \n函数的下一部分实现了第 1 。\n\n```\n {\n    unsigned int move = 0;\n    bool found = false;\n\
  \n    //if computer can win on next move, that’s the move to make\n    while (!found\
  \ && move < board.size())\n    {\n        if (isLegal(move, board))\n        {\n\
  \            board[move] = computer;\n            found = winner(board) == computer;\n\
  \            board[move] = EMPTY;\n        }\n\n        if (!found)\n        {\n\
  \            ++move;\n        }\n    }\n```\n\n我开始循环遍历所有可能的移动，0–8。对于每种移动，我测试该移动是否合法。如果法的，我就将计算机的棋子放在对应的格子中，并检查该移动是否让计算机获胜。然后我通过让该格子再次变为空来撤销该移动。如果该移动没有让计算机获胜，我就继续检查下一个空格。然而，如果该移动确实让计算机获胜了，那么循环就会结束——我找到了想要计算机执行的移动（`found`\
  \ 为 `true`）（格子编号为 `move`）来赢得游戏。\n\n接下来，我检查是否需要进入我 AI 策略的第 2 步。如果我还没有找到移动（`found`\
  \ 为 `false`），那么我就检查人类在下一步是否可以获胜。\n\n```\n //otherwise, if human can win on next\
  \ move, that’s the move to make\n   if (!found)\n   {\n       move =0;\n       char\
  \ human = opponent(computer);\n\n       while (!found && move < board.size())\n\
  \       {\n           if (isLegal(move, board))\n           {\n               board[move]\
  \ = human;\n               found = winner(board) == human;\n               board[move]\
  \ = EMPTY;\n           }\n\n           if (!found)\n           {\n             \
  \  ++move;\n           }\n       }\n   }\n```\n\n我开始循环遍历所有可能的移动，0–8。对于每种移动，我测试该移动是否合法。如果是，我就将人类的棋子放在对应的格子中，并检查该移动是否让人类获胜。然后我通过让该格子再次变为空来撤销该移动。如果该移动没有让人类获胜，我就继续检查下一个空格。然而，如果该移动确实让人类获胜了，那么循环就会结束——我找到了计算机执行的移动（`found`\
  \ 为 `true`）（格子编号为 `move`）来阻止人类在下一步获胜。\n\n接下来，我检查是否需要进入我 AI 策略的第 3 步。如果我还没有找到移动（`found`\
  \ 为 `false`），那么我就按照意愿顺序查看最佳移动列表，并采取第一个合法的。\n\n```\n //otherwise, moving to the best\
  \ open square is the move to make\n   if (!found)\n   {\n       move = 0;\n    \
  \   unsigned int i = 0;\n\n       const int BEST_MOVES[] = {4, 0, 2, 6, 8, 1, 3,\
  \ 5, 7};\n       //pick best open square\n       while (!found && i < board.size())\n\
  \       {\n           move = BEST_MOVES[i];\n           if (isLegal(move, board))\n\
  \           {\n               found = true;\n           }\n\n           ++i;\n \
  \      }\n   }\n```\n\n在函数的这一点，我已经找到了想要计算机执行的移动——无论那是让计算机获胜的移动、封堵人类获胜的移动，还是仅仅是最好的空格。因此，我让计算机宣布移动并返回对应的格子编号。\n\
  \n```\n cout << \"I shall take square number \" << move << endl;\n    return move;\n\
  }\n```\n\n## 现实世界\n\n井字游戏只考虑下一次可能的移动。玩严肃策略游戏的程序（如国际棋）会更深入地观察单个移动的后果，并考虑许多层级的移动和反击。事实上，优秀的计算机国际棋程序在做出移动之前，可以考虑数百万种棋盘布局。\n\
  \n### announceWinner() 函数\n\n该函数接收获胜者、计算机的棋子、人类的棋子。该函数宣布平局。\n\n```\n void announceWinner(char\
  \ winner, char human)\n{\n     if (winner == computer)\n     {\n         cout <<\
  \ winner << \"s won!\\n\";\n         cout << \"As predicted, human\";\n     }\n\n\
  \     else if (winner == human)\n     {\n         cout << winner << \"s won!\\n\"\
  ;\n         cout << \"No, no! Somehow you managed to\";\n         cout << \"But\
  \ never again! I, the computer\";\n     }\n\n     else\n     {\n         cout <<\
  \ \"It’s a tie.\\n\";\n         cout << \"You were most lucky, human\";\n      \
  \   cout << \"for this.\";\n     }\n}\n```\n\n### 总结在本章中，你应该学会了内容：\n\n- 引用是一个别名；它是变量的另一个名字。\n\
  - 你使用 `&` 创建引用。\n- 引用在定义时必须初始化。\n- 引用不能更改指向另一个变量。\n- 你对引用的任何操作都会作用于它所引用的变量。\n- 当你将引用赋值给变量时，你创建了被引用值的副本。\n\
  - 当你通过值传递变量时，你向函数传递变量的副本。\n- 当你通过引用传递变量时，你传递的是对变量的访问。\n- 引用传递比值传递更高效，尤其是当你传递大型对象时。\n\
  - 引用提供了对传递参数的直接访问。因此，函数可以修改参数变量。\n- 常量引用不能用于更改它所引用的值。你使用关键字 `const` 声明常量引用。\n- 你不能将常量引用或常量赋值给非常量引用。\n\
  - 将常量引用传递给函数可以保护参数变量不被函数修改。\n- 修改传递给函数的参数变量可能会引起混乱，所以游戏程序员在传递非常量引用之前会考虑传递常量引用。\n\
  - 返回引用比返回值的副本更高效，尤其是当你返回大型对象时。\n- 你可以返回对象的常量引用，以便该对象无法通过返回的引用进行更改。\n- 游戏 AI 的一项基本技术是让计算机在考虑所有合法移动及其对手的所有合法回应之后，再决定下一步采取什么移动。\n\
  \n\n\n\n\n# 问题与解答\n\n**问：** 不同的程序员在声明引用时会将引用运算符（`&`）放在不同的地方。我应该把它放在哪里？\n\n**答：**\
  \ 使用引用运算符有三种基本风格。有些程序员倾向于使用 `int& ref = var;`，而另一些人选择 `int&ref = var;`。还有一些人选择 `int\
  \ &ref = var;`。计算机对这三种方式都能接受。每种风格都有其理由；然而，最重要的一保持一致。\n\n**问：** 为什么我不能用常量值来初始化非常量引用？\n\
  \n**答：** 因为非常量引用允许你更改它所引的值。\n\n**问：** 如果我用一个非常量变量初始化常量引用，我可以改变变量的值吗？\n\n**答：** 不能通过该常量引用。因为当你声明一个常量引用时，你是在表示该引用不能用于更改它所引的值（即使该值可以通过其他方式更改）。\n\
  \n**问：** 传递常量引用是如何节省开销的？\n\n**答：** 当你通过值将一个大对象传递给函数时，你的程序会创建该对象的副本。取决于对象的大小，这可能是一项昂贵的操作。传递引用就像只传递对大对象的访问权限；这是一项廉价的操作。\n\
  \n**问：** 我可以引用一个引用吗？\n\n**答：** 不完全是。你可以将一个引用赋值给另一个引用，但新引用将指向原始引用所引的值。\n\n**问：**\
  \ 如果我声明一个引用但不初始化它会发生什么？\n\n**答：** 你的编译器应该报错，因为这是非法的。\n\n**问：** 为什么我应该避免通过引用更改传递变量的值？\n\
  \n**答：** 因为这可能会导致混淆。仅从函数调用来看无法判断一个变量是否被传递是为了更改其值。\n\n**问：** 这是否意味着我应该始终传递常量引用？\n\
  \n**答：** 不是。你可以向函数传递非常量引用，但对大多数游戏程序员来说，这向他们信号了你打算更改参数变量的值。\n\n**问：** 如果我不更改传递给函数的参数变量，我应该如何将新信息传回调用代码？\n\
  \n**答：** 使用返回值。\n\n**问：** 我可以将字面量作为非常量引用传递吗？\n\n**答：** 不行。如果你尝试将字面量作为非常量引用传递，将产生编译错误。\n\
  \n**问：** 无法将字面量传递给接受引用的参数吗？\n\n**答：** 不是，你可以将字面量作为常量引用传递。\n\n**问：** 从函数返回一个对象会发生什么？\n\
  \n**答：** 通常，你的程序会创建该对象的副本并返回它。取决于对象的大小，这可能是一项昂贵的操作。\n\n**问：** 为什么要返回引用？\n\n**答：**\
  \ 它更高效，因为返回引用不涉及复制对象。\n\n**问：** 我如何会丢失返回引用的效率？\n\n**答：** 将返回的引用赋值给变量。当你将引用赋值给变量时，计算机必须为引用所引的对象创建一个副本。\n\
  \n**问：** 返回局部变量的引用有什么问题？\n\n**答：** 局部变量在函数结束后就不存在了，这意味着你正在返回一个指向不存在对象的引用，这是非法的。\n\
  \n## 讨论题\n\n1. 按值传递参数的优缺点是什么？\n2. 传递引用的优缺点是什么？\n3. 传递常量引用的优缺点是什么？\n4. 返回引用的优缺点是什么？\n\
  5. 游戏 AI 是否应该作弊以创建一个更有价值的对手？\n\n# 练习\n\n1. 改进第 5 章“函数：Mad Lib”中的 Mad Lib 游戏，使用引用使程序更高效。\n\
  2. 下列程序有什么问题？\n\n```cpp\n int main()\n   {\n       int score;\n       score = 1000;\n\
  \       float& rScore = score;\n       return 0;\n   }\n```\n\n3. 该函数有什么问题？\n\n\
  ```cpp\n int& plusThree(int number)\n   {\n       int threeMore = number + 3;\n\
  \       return threeMore;\n   }\n```\n\n# 第 7 章：指针：井字棋 2.0\n\n指针是 C++ 中一个强大的部分。在某些方面，它们的行为类似于\
  \ STL 中的迭代器。通常你可以用它们来代替引用。但指针提供了语言其他部分部分无法提供的功能。在本章中，你将学习指针的基本机制，并了解它们的用途。具体来说，你将学习：\n\
  \n- ![images](img/00007.jpeg) 声明和初始化指针\n- ![images](img/00007.jpeg) 解引用指针\n- ![images](img/00007.jpeg)\
  \ 使用常量和指针\n- ![images](img/00007.jpeg) 传递和返回指针\n- ![images](img/00007.jpeg) 数组操作\n\
  \n## 理解指针基础\n\n指针以难以理解而闻名。实际上，指针的本质非常简单——`pointer` 是一个包含内存地址的变量。指针让你能够直接且高效地与计算机内存交互。与\
  \ STL 中的迭代器一样，它们经常用于访问变量的内容。但在你将指针用在游戏程序之前，必须了解它们的工作原理。\n\n**提示**\n\n计算机内存非常像一个社区，但不是人们存放东西的房子，而是你存储数据的地方。就像社区中的房屋并排相邻并标有地址一样，内存块也并排相邻并标有地址。在社区中，你可以使用一张写有街道地址的纸找到特定的房子（以及里面的东西）。在计算机中，你可以使用一个包含内存地址的\
  \ `pointer` 找到特定的内存位置（以及里面的东西）。\n\n### 介绍指针程序\n\nPointing 程序演示了指针的机制。该程序创建一个分数的变量，然后创建一个存储该变量地址的指针。程序显示你可以直接更改变量的值，指针将反映这一变化。它还显示你可以通过指针更改变量的值。然后演示了你可以让指针指向另一个变量。最后，程序显示指针可以同样容易地处理对象。图\
  \ 7.1 说明了程序的运行结果。\n\n**图 7.1**\n\n指针 `pScore` 先指向变量 `score` 然后指向变量 `newScore`，而指针\
  \ `pStr` 指向变量 `str`。\n\n![images](img/00067.jpeg)\n\n经微软许可使用。\n\n\n\n\n\n```cpp\n\
  \ // 指针\n// 展示指针的使用\n\n#include <iostream>\n#include <string>\n\nusing namespace\
  \ std;\n\nint main()\n{\n    int* pAPointer;       //声明一个指针\n\n    int* pScore =\
  \ 0;      //声明并初始化一个指针\n\n    int score = 1000;\n    pScore = &score;      //将变量\
  \ score 的地址赋值给指针 pScore\n\n    cout << \"Assigning &score to pScore\\n\";\n    cout\
  \ << \"&score is: \" << &score << \"\\n\";     //变量 score 的地址\n    cout << \"pScore\
  \ is: \" << pScore << \"\\n\";     //指针中存储的地址\n    cout << \"score is: \" << score\
  \ << \"\\n\";\n    cout << \"*pScore is: \" << *pScore << \"\\n\\n\"; //指针指向的值\n\
  \n    cout << \"Adding 500 to score\\n\";\n    score += 500;\n    cout << \"score\
  \ is: \" << score << \"\\n\";\n    cout << \"*pScore is: \" << *pScore << \"\\n\\\
  n\";\n\n    cout << \"Adding 500 to *pScore\\n\";\n    *pScore += 500;\n    cout\
  \ << \"score is: \" << score << \"\\n\";\n    cout << \"*pScore is: \" << *pScore\
  \ << \"\\n\\n\";\n\n    cout << \"Assigning &newScore to pScore\\n\";\n    int newScore\
  \ = 5000;\n    pScore = &newScore;\n    cout << \"&newScore is: \" << &newScore\
  \ << \"\\n\";\n    cout << \"pScore is: \" << pScore << \"\\n\";\n    cout << \"\
  newScore is: \" << newScore << \"\\n\";\n    cout << \"*pScore is: \" << *pScore\
  \ << \"\\n\\n\";\n\n    cout << \"Assigning &str to pStr\\n\";\n    string str =\
  \ \"score\";\n    string* pStr = &str;   //指向字符串对象的指针\n\n    cout << \"str is: \"\
  \ << str << \"\\n\";\n    cout << \"*pStr is: \" << *pStr << \"\\n\";\n    cout\
  \ << \"(*pStr).size() is: \" << (*pStr).size() << \"\\n\";\n    cout << \"pStr->size()\
  \ is: \" << pStr->size() << \"\\n\";\n\n    return 0;\n}\n```\n\n## 声明指针\n\n在 `main()`\
  \ 的第一个语句中，我声明了一个名为 `pAPointer` 的指针。\n\n```cpp\n int* pAPointer;     //声明一个指针\n```\n\
  \n由于指针的工作方式非常独特，程序员通常会在指针变量名前面加上字母“p”，以提醒他们该变量确实是一个指针。\n\n就像迭代器一样，指针被声明为指向某种特定类型的值。`pAPointer`\
  \ 是一个指向 `int` 的指针，这意味着它只能指向一个 `int` 值。例如，`pAPointer` 不能指向 `float` 或 `char`。另一种表达方式是，`pAPointer`\
  \ 只能存储 `int` 的地址。\n\n要声明你自己的指针，请从指针将指向的对象类型开始，紧接着是一个星号 `*`，然后是指针名称。在声明指针时，可以在星号的任意侧添加空格。因此，`int*\
  \ pAPointer;`、`int *pAPointer;` 和 `int * pAPointer;` 都声明了一个名为 `pAPointer` 的指针。\n\
  \n##### 陷阱\n\n当你声明指针时，星号仅适用于紧随其后的单个变量名。因此，以下语句将 `pScore` 声明为指向 `int` 的指针，将 `score`\
  \ 声明为一个 `int`。\n\n```cpp\n int* pScore, score;\n```\n\n`score` 不是指针！它是一个 `int` 变量。让这一点更清晰的方法是调整空格并重写语句：\n\
  \n```cpp\n int *pScore, score;\n```\n\n然而，声明指针最清晰的方法是单独声明它，如下所示：\n\n```cpp\n int*\
  \ pScore;\n   int score;\n```\n\n## 初始化指针\n\n与其他变量一样，你可以在声明指针的同时对其进行初始化。这就是我在接下来的语句中所做的，将\
  \ `0` 赋值给 `pScore`。\n\n```cpp\n int* pScore = 0;   //声明并初始化一个指针\n```\n\n给指针赋值 `0`\
  \ 有特殊含义。粗来说，它的意思是“指向空”。程序员将值为零的指针称为*空指针*。在声明指针时，你应该始终初始化一个值，即使该值是零。\n\n##### 提示\n\
  \n许多程序员使用 `NULL` 而不是 `0` 给指针赋值，使其成为空指针。`NULL` 定义在多个库文件中，包括 `iostream`。\n\n#### 给指针赋值地址\n\
  \n由于指针存储的是地址，你需要一种方法将地址放入指针。这样做的方法就是获取地址并赋值。\n\n#### 解引用指针\n\n就像解引用迭代器以访问它所表示的对象一样，你解引用指针以访问它指向的对象。我们使用\
  \ `*` 运算符来操作。\n\n```cpp\ncout << \"*pScore is: \" << *pScore << \"\\n\\n\"; //指针指向的值\n\
  ```\n\n记住，`*pScore` 意味着“pScore 指向的对象”。\n\n接下来，我通过以下语句为 `score` 增加 `500`。\n\n```cpp\n\
  \ score += 500;\n```\n\n接下来，我通过接下来的语句为 `*pScore` 指向的值增加 `500`。\n\n```cpp\n *pScore\
  \ += 500;\n```\n\n#### 重新赋值指针\n\n与引用不同，指针在程序生命周期内可以指向不同的对象。重新赋值指针 own 就像重新赋值任何其他变量一样。接下来，我通过以下语句重新赋值\
  \ `pScore`。\n\n```cpp\n pScore = &newScore;\n```\n\n\n\n\n结果是 `pScore` 现在指向了 `newScore`。为了证明这一点，我通过向\
  \ `cout` 发送 `&newScore` 来显示 `newScore` 的地址，随后发送存储在 `pScore` 中的地址。这两个语句都显示了相同的地址。然后，我将\
  \ `newScore` 和 `*pScore` 发送到 `cout`。它们都显示 `5000`，因为它们都访问的是存储该值的同一块内存。\n\n## 陷阱 (Trap)\n\
  \n* * *\n\n当你想要改变指针本身时，不要改变指针所指向的值。例如，如果我想让 `pScore` 指向 `newScore`，那么下面这一行将是一个巨大的错误。\n\
  \n```\n*pScore = newScore;\n```\n\n这段代码仅仅改变了 `pScore` 当前指向的值，而没有改变 `pScore` 本身。如果\
  \ `newScore` 等于 `5000`，那么之前的代码等同于 `*pScore = 5000;`，且 `pScore` 仍然指向它赋值前所指向的变量。\n\
  \n* * *\n\n### 使用指针指向对象\n\n到目前为止，Pointing 程序仅与内置类型 `int` 的值一起。但你也可以同样轻松将指针用于对象。我接下来将通过以下几行演示这一点，这些代码创建了\
  \ `str`（一个等于 `\"score\"` 的 `string` 对象）和 `pStr`（一个指向该对象的指针）。\n\n```\nstring str\
  \ = \"score\";\nstring* pStr = &str;  //指向 string 对象的指针\n```\n\n`pStr` 是一个指向 `string`\
  \ 的指针，这意味着它可以指向任何 `string` 对象。另一种表达方式是，`pStr` 可以存储任何 `string` 对象的地址。\n\n你可以使用解引用运算符通过指针访问对象。这就是我接下来通过下面这一行所做的。\n\
  \n```\ncout << \"*pStr is: \" << *pStr << \"\\n\";\n```\n\n通过对 `*pStr` 使用解引用运算符，我将\
  \ `pStr` 指向的对象（`str`）发送到 `cout`。结果是显示了文本 `score`。\n\n你可以像通过迭代器调用对象的成员函数一样，通过指针调用对象的成员函数。其中一种方法是使用解引用运算符和成员访问运算符，这就是我接下来通过下面这一行所做的。\n\
  \n```\ncout << \"(*pStr).size() is: \" << (*pStr).size() << \"\\n\";\n```\n\n代码\
  \ `(*pStr).size()` 的意思是：“取引用 `pStr` 的结果，并调用该对象的 `size()` 成员函数”。由于 `pStr` 指向等于 `\"\
  score\"` 的 `string` 对象，代码返回 `5`。\n\n## 提示 (Hint)\n\n* * *\n\n每当你解引用指针以访问数据成员或成员函数时，请在解引指针周围加上一对括号。这确保了点运算符（.）将应用于指针指向的对象。\n\
  \n* * *\n\n就像迭代器一样，你可以在指针上使用 `->` 运算符以更可读的方式来访问对象成员。这就是我接下来通过下面这一行演示的。\n\n```\n\
  cout << \"pStr->size() is: \" << pStr->size() << \"\\n\";\n```\n\n前面的语句再次显示了等于 `\"\
  score\"` 的 `string` 对象的字符数；然而，这次我可以用 `pStr->size()` 替换 `(*pStr).size()`，使代码更具可读性。\n\
  \n### 理解指针和常量\n\n在开始你的游戏程序有效地使用指针之前，你仍然需要理解一些指针机制。你可以使用 `const` 关键字来限制指针的工作方式。这些限制可以起到保护作用，并使你的编程意图更加清晰。由于指针功能非常强大，限制指针的使用方式符合“只按需请求”的编程准则。\n\
  \n## 使用常量指针\n\n正如你所看到的，指针在程序的不同时间可以指向不同的对象。但是通过在声明和初始化指针时使用 `const` 关键字，你可以限制指针，使其只能指向它初始化时所指向的对象。这样的指针被称为**常量指针**（constant\
  \ pointer）。另一种表达方式是，常量指针中存储的地址永远无法改变——它是常数。这里有一个创建常量指针的示例：\n\n```\nint score = 100;\n\
  int* const pScore = &score; //常量指针\n```\n\n前面的代码创建了一个常量指针 `pScore`，它指向 `score`。你在声明指针时，通过在指针名称之前放置\
  \ `const` 来创建一个常量指针。\n\n与所有常量一样，你必须在第一次声明常量指针时对其进行初始化。下面这一行是非法的，并将产生一个巨大的编译错误。\n\
  \n```\nint* const pScore; //非法 -- 你必须初始化常量指针\n```\n\n由于 `pScore` 是常量指针，它永远无法指向任何其他内存位置。下面的代码也是非法的。\n\
  \n```\npScore = &anotherScore; //非法 -- pScore 不能指向不同的对象\n```\n\n虽然你不能改变常量指针指向的值，但你可以使用\
  \ `pScore` 来改变它所指向的值。下面这一行是合法的。\n\n```\n*pScore = 500;\n```\n\n困惑了吗？不要。常量指针的限制在于它存储的地址——不可改变。常量指针的工作方式应该让你想起某种东西——引用（reference）。引用引用，常量指针只能引用它初始化时所指向的对象。\n\
  \n#### 提示 (Hint)\n\n* * *\n\n虽然你可以在程序中使用常量指针代替引用，但尽可能使用引用。\n\n* * *\n\n#### 指向常量的指针\
  \ (Pointer to a Constant)\n\n正如你所看到的，你可以使用指针来改变它们指向的值。但通过在声明指针时使用 `const` 关键字，你可以限制指针使其不能用于改变它指向的值。这样的指针被称为**指向常量的指针**（pointer\
  \ to a constant）。这里是它的声明示例：\n\n```\nconst int* pNumber; //指向常量的指针\n```\n\n前面的代码声明了一个指向常量的指针。通过在指针指向的值类型之前放置\
  \ `const` 来声明常量。\n\n像之前一样为指向常量的指针赋值地址。\n\n```\nint lives = 3;\npNumber = &lives;\n\
  ```\n\n然而，你不能使用该指针来改变它指向的值。下面这一行是非法的。\n\n```\n*pNumber -= 1; //非法 -- 不能通过指向常量的指针改变指向的值\n\
  ```\n\n虽然你不能通过指向常量的指针改变它指向的值，但指针本身是可以改变的。这意味着指向常量的指针可以在程序指向不同的对象。下面的代码是完全合法的。\n\n\
  ```\nconst int MAX_LIVES = 5;\npNumber = &MAX_LIVES; //指针本身可以改变\n```\n\n#### 常量指针\
  \ (Constant Pointer to a Constant)\n\n指向常量的常量指针结合了常量指针和指向常量的限制。这意味着指向常量的常量指针只能指向它初始化时所指向的对象。此外，它不能用于改变它所指向的对象的值。这是这种指针的声明和初始化：\n\
  \n```\nconst int* const pBONUS = &BONUS; //指向常量的常量指针\n```\n\n前面的代码创建了一个指向常量的常量指针\
  \ `pBONUS`，它指向常量 `BONUS`。\n\n#### 提示 (Hint)\n\n* * *\n\n就像指向常量的指针一样，指向常量的常量指针可以指向非常量或常量值。\n\
  \n* * *\n\n你不能重新给指向常量的常量指针赋值。下面这一行是非法的。\n\n```\npBONUS = &MAX_LIVES; //非法 -- pBONUS\
  \ 不能指向另一个对象\n```\n\n\n\n\n你不能使用指向常量的常量指针来改变它所指向的值。这意味着下面这行代码是非法的。\n\n```\n *pBONUS\
  \ = MAX_LIVES; //非法 --不能通过指针更改值\n```\n\n在许多方面，指向常量的常量指针的作用类似于常量引用，它只能引用它在初始化时所指向的值，且不能用于更改该值。\n\
  \n### 提示\n\n尽管你可以在程序中使用指向常量的常量指针来代替常量引用，但你应该尽可能坚持使用常量引用。引用的语法比指针更简洁，并且可以让你的代码更易于读。\n\
  \n## 总结常量和指针\n\n我已经展示了许多关于常量和指针的信息，因此我想提供一个总结，以帮助巩固这些新概念。以下是在声明指针时使用 `const` 关键字的三种不同方式示例：\n\
  \n![images](img/00007.jpeg) `int* const p = &i;`\n\n![images](img/00007.jpeg) `const\
  \ int* p;`\n\n![images](img/00007.jpeg) `const int* const p = &I;`\n\n第一个示例声明并初始化了一个常量指针。常量指针只能指向它初始化时所指向的对象。指针本身存储的值——即内存地址——是常量的，不能改变。常量指针只能指向一个非常量值；它不能指向常量。\n\
  \n第二个示例声明了一个指向常量的指针。指向常量的指针不能用于更改它所指向的值。指向常量的指针在程序的生命周期内可以指向不同的对象。指向常量的指针可以指向常量值或非常量值。\n\
  \n第三个示例声明了一个指向常量的常量指针。指向常量的常量指针只能指向它初始化时所指向的值。此外，它不能用于更改它所指向的值。指向常量的常量指针可以初始化为指向一个常量或非常量值。\n\
  \n## 传递指针\n\n尽管由于语法简洁，引用是传递参数的首选方式，但你仍然可能需要通过指针传递对象。例如，假设你使用一个图形引擎，它返回一个指向 3D 对象的指针。如果你想让另一个函数使用该对象，你可能希望传递对象的指针以提高效率。因此，了解如何传递指针以及传递引用是非常重要的。\n\
  \n### 引入 Swap 指针版本的程序\n\nSwap Pointer 版本程序的工作与第 6 章中的“引用：井棋”的 Swap 程序完全一样，只是 Swap\
  \ Pointer 版本使用了指针而不是引用。Swap Pointer 版本定义了两个变量——一个持有我可怜的低分，另一个持有你令人印象深刻的高分。在显示分数后，程序调用了一个用于交换分数的函数。因为发送到函数中的只是分值的副本，所以原始变量没有被改变。接下来，程序调用了另一个交换函数。这次，使用常量指针，原始变量的值成功地交换了（让我得到了大分，给你留下了小分）。图\
  \ 7.3\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载此程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 7 章;\nvoid goodSwap(int* const pX, int* const pY);\nint main()\n{\n    int myScore\
  \ = 150;\n    int yourScore = 1000;\n    cout << \"Original values\\n\";\n    cout\
  \ << \"myScore: \" << myScore << \"\\n\";\n    cout << \"yourScore: \" << yourScore\
  \ << \"\\n\\n\";\n\n    cout << \"Calling badSwap()\\n\";\n    badSwap(myScore,\
  \ yourScore);\n    cout << \"myScore: \" << myScore << \"\\n\";\n    cout << \"\
  yourScore: \" << yourScore << \"\\n\\n\";\n\n    cout << \"Calling goodSwap()\\\
  n\";\n    goodSwap(&myScore, &yourScore);\n    cout << \"myScore: \" << myScore\
  \ << \"\\n\";\n    cout << \"yourScore: \" << yourScore << \"\\n\";\n\n    return\
  \ 0;\n}\n\nvoid badSwap(int x, int y)\n{\n    int temp = x;\n    x = y;\n    y =\
  \ temp;\n}\n\nvoid goodSwap(int* const pX, int* const pY)\n{\n    // 存储 pX 指向的值\n\
  \    int temp = *pX;\n    // 存储 pY 指向的值\n    *pX = *pY;\n    // 存储 pX 指向的值\n   \
  \ *pY = temp;\n}\n```\n\n### 按值传递\n\n你已经看到通过传递引用让函数访问变量是可能的。也可以使用指针来实现这一点。当你传递指针时，你传递的是对象的地址。这可以非常高效，特别是当你处理占用大块内存的对象时。传递指针就像是给朋友发送网站的\
  \ URL，而不是尝试发送整个网站。\n\n在向函数传递指针之前，你需要将函数参数指定为指针。这就是我在 `goodSwap()` 头文件中做的。\n\n```\n\
  void goodSwap(int* const pX, int* const pY)\n```\n\n这意味着 `pX` 和 `pY` 是常量指针，它们将各自接受内存地址。我将参数设为常量指针，因为虽然我计划更改它们所指向的值，但我并不计划更改指针本身。记住，这就是引用的工作方式。你可以更改引用所引的值，但不能更改引用本身。\n\
  \n在 `main()` 中，当我使用以下行调用 `goodSwap()` 时，我传递了 `myScore` 和 `yourScore` 的地址。\n\n```\n\
  goodSwap(&myScore, &yourScore);\n```\n\n注意我通过使用地址运算符向 `goodSwap()` 发送变量的地址。当你向指针传递对象时。\n\
  \n在 `goodSwap()` 中，`pX` 存储 `myScore` 的地址，`pY` 存储 `yourScore` 的地址。对 `*pX` 的任何操作将作用于\
  \ `myScore`；对 `*pY` 的任何操作将作用于 `yourScore`。\n\n`goodSwap()` 的第一行获取 `pX` 指向的值并赋值给\
  \ `temp`。\n\n```\nint temp = *pX;\n```\n\n由于 `pX` 指向 `myScore，temp` 变成了 `150`。\n\
  \n下一行将 `pY` 指向的值赋值给 `pX` 所指向的对象。\n\n```cpp\n*pX = *pY;\n```\n\n这条语句将存储在 `yourScore`\
  \ 中的值 `1000` 赋值给 `myScore` 的内存位置。结果是 `myScore` 变成了 `1000`。\n\n\n\n\n函数中的最后一条将 `temp,\
  \ 150` 的值存储在 `pY` 指向的地址中。\n\n```\n*pY = temp;\n```\n\n由于 `pY` 指向 `yourScore`，因此\
  \ `yourScore` 变成了 `150`。\n\n函数结束后，控制返回到 `main()`，我在那里将 `myScore` 和 `yourScore` 发送给\
  \ `cout`。这次，显示了 `1000` 和 `150`。变量已经交换了值。终于成功了！\n\n### 提示\n\n***\n\n你也可以传递一个指向常量的常量指针。这与传递常量引用非常相似，常量引用用于高效地传递你不需要修改的对象。我根据第\
  \ 6 章中的 `Inventory Displaler` 程序（该程序演示了如何传递常量引用）进行了修改，改为传递一个指向常量的常量指针。你可以从 Cengage\
  \ Learning 网站下载该程序的代码（`[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)`）。该程序位于第\
  \ 7 章文件夹中；文件名为 `inventory_displayer_pointer_ver.cpp`。\n\n***\n\n## 返回指针\n\n在引用出现，游戏程序员从函数高效返回对象的唯一选择是使用指针。虽然使用引用提供了比指针更简洁的语法，但你可能仍然需要通过指针返回对象。\n\
  \n#### 介绍 Inventory Pointer 程序\n\n`Inventory Pointer` 程序演示了如何返回指针。通过返回的指针，程序可以显示甚至修改存有英雄库存的\
  \ `vector` 的值。图 7.4 显示了程序的运行结果。\n\n#### 图 7.4\n\n一个函数为英雄库存中的每个项目返回一个指针（而不是 `string`\
  \ 对象）。\n\n![images](img/00070.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（`[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)`）。该程序位于第\
  \ 7 章文件夹中；文件名为 `inventory_pointer.cpp`。\n\n```\n// Inventory Pointer\n// 演示返回指针\n\
  \n#include <iostream>\n#include <string>\n#include <vector>\n\nusing namespace std;\n\
  \n// 返回一个指向 string 元素的指针\nstring* ptrToElement(vector<string>* const pVec, int i);\n\
  \nint main()\n{\n    vector<string> inventory;\n    inventory.push_back(\"sword\"\
  );\n    inventory.push_back(\"armor\");\n    inventory.push_back(\"shield\");\n\n\
  \    // 显示返回指针指向的 string 对象\n    cout << \"Sending the object pointed to by returned\
  \ pointer to cout:\\n\";\n    cout << *(ptrToElement(&inventory, 0)) << \"\\n\\\
  n\";\n    // 将一个指针赋值给另一个 -- 开廉的赋值\n    cout << \"Assigning the returned pointer\
  \ to another pointer.\\n\";\n    string* pStr = ptrToElement(&inventory, 1);\n \
  \   cout << \"Sending the object pointed to by new pointer to cout:\\n\";\n    cout\
  \ << *pStr << \"\\n\\n\";\n\n    // 拷贝 string 对象 -- 昂贵的赋值\n    cout << \"Assigning\
  \ object pointed to by pointer to a string object.\\n\";\n    string str = *(ptrToElement(&inventory,\
  \ 2));\n    cout << \"Sending the new string object to cout:\\n\";\n    cout <<\
  \ str << \"\\n\\n\";\n\n    // 通过返回的指针修改 string 对象\n    cout << \"Altering an object\
  \ through a returned pointer.\\n\";\n    *pStr = \"Healing Potion\";\n    cout <<\
  \ \"Sending the altered object to cout:\\n\";\n    cout << inventory[1] << endl;\n\
  \n    return 0;\n}\n\nstring* ptrToElement(vector<string>* const pVec, int i)\n\
  {\n    // 返回 pVec 指向的 vector 中位置 i 处的字符串地址\n    return &((*pVec)[i]);\n}\n```\n\n\
  ## 返回指针\n\n在从函数返回指针之前，你必须指定你返回的是一个指针。这就是我在 `ptrToElement()` 头中所做的。\n\n```cpp\nstring*\
  \ ptrToElement(vector<string>* const pVec, int i)\n```\n\n通过以 `string*` 开始头部，我是说该函数将返回一个指向\
  \ `string` 对象的指针（而不是 `string` 对象本身）。要指定函数返回指向特定类型对象的指针，请在返回类型的类型名称后加上星号。\n\n函数 `ptrToElement()`\
  \ 的体只包含一条语句，该语句返回指向 `pVec` 指向的 `vector` 中位置 `i` 处元素的指针。\n\n```cpp\nreturn &((*pVec)[i]);\n\
  ```\n\n`return` 语句看起来可能有点晦涩，所以我将逐步解析。每当你遇到复杂的表达式时，都要像计算机那样对其进行求值——从最内层部分开始。我从 `(*pVec)[i]`\
  \ 开始，它的意思是 `pVec` 指向的 `vector` 中位置 `i` 处的元素。通过对该表达式应用*地址的*运算符（`&`），它就变成了位置 `i` 处元素的地址。\n\
  \n### 陷阱\n\n***\n\n返回局部变量的指针是一个严重错误。局部变量在函数返回时会被销毁，因此指针变成了*悬指针*。\n\n```cpp\nstring*\
  \ badPointer()\n{\n    string local = \"danger\";\n    return &local;\n}\n```\n\n\
  为了避免这种情况，你应该返回一个指向已存在的对象的指针。这与传递常量引用非常相似，常量引用用于高效地传递你不需要修改的对象。我根据第 6 章中的 `Inventory\
  \ Displayer` 程序（该程序演示了如何传递常量引用）进行了修改，改为传递一个指向常量的常量指针。你可以从 Cengage Learning 网站下载该程序的代码（`[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)`）。该程序位于第\
  \ 7 章文件夹中；文件名为 `inventory_displayer_pointer_ver.cpp`。\n\n#### 使用返回的指针显示值\n\n在创建\
  \ `inventory` 一个包含项目的 vector 后，我使用返回的指针显示值。\n\n```cpp\ncout << *(ptrToElement(&inventory,\
  \ 0)) << \"\\n\\n\";\n```\n\n前面的代码调用 `ptrToElement()`，它返回 `inventory[0]`。（记住，`ptrToElement()`\
  \ 返回返回拷贝；它返回指针。）该行将指针指向的对象发送给 `cout`。结果显示了 `sword`。\n\n#### 将返回的指针赋值给指针\n\n接下来，我通过下一行将返回的指针赋值给另一个指针。\n\
  \n```cpp\nstring* pStr = ptrToElement(&inventory, 1);\n```\n\n`ptrToElement()` 返回\
  \ `inventory[1]` 的指针。语句将该指针赋值给 `pStr`。这是一个廉价的赋值，因为指针赋值不拷贝 `string` 对象。为了帮助你理解这一行的结果，请查看图\
  \ 7.5，它显示了赋值后 `pStr` 的表示。（注意该图是抽象的，因为 `inventory` 并不包含字符串字面量 `\"sword\", \"armor\"\
  ` 和 `\"shield\"`。）\n\n#### 将指向指针的值赋值给变量\n\n接下来，我将返回指针指向的值赋值给变量。\n\n```cpp\nstring\
  \ str = *(ptrToElement(&inventory, 2));\n```\n\n`ptrToElement()` 返回 `inventory[2]`\
  \ 的指针。然而，前面的语句并没有将此指针赋值给 `str`——它不能，因为 `str` 是一个 `string` 对象。相反，计算机静静地拷贝了指针指向的 `string`\
  \ 对象并将该对象赋值给 `str`。为了进一步加深这一点，请查看图 7.6，它提供了该赋值结果的抽象表示。\n\n#### 图 7.6\n\n`str` 是一个新的\
  \ `string` 对象，与 `inventory` 完全独立。\n\n\n\n像这种涉及对象复制的赋值操作，比将一个指针赋值给另一个指针要昂贵得多。有时，复制对象的成本是完全可以接受的，但你应该意识到这种赋值所带来的额外开销，并在必要时避免使用。\n\
  \n### 通过返回的指针修改对象\n\n你也可以修改返回的指针所指向的对象。这意味着我可以通过 `pStr` 改变英雄的物品。\n\n```\n*pStr =\
  \ \"Healing Potion\";\n```\n\n由于 `pStr` 指向 `inventory` 中位置为 `1` 的元素，这行代码更改了 `inventory[1]`，使其等于\
  \ `\"Healing Potion\"`。为了证明这一点，我通过以下代码显示了该元素，它确实显示了 `Healing Potion`。\n\n```\ncout\
  \ << inventory[1] << endl;\n```\n\n若需抽象表示，请查看图 7.7，它显示了赋值后变量的状态。\n\n**图 7.7**\n\n\
  `inventory[1]` 通过存储在 `pStr` 中的返回指针被修改。\n\n![images](img/00073.jpeg)\n\n**提示**\n\n\
  * *\n\n如果你想保护由返回的指针指向的对象，请确保限制该指针。返回一个指向常量的指针，或者返回一个指向常量的常量指针。\n\n* *\n\n### 理解指针与数组之间的关系\n\
  \n指针与数组之间有着紧密的关系。事实上，数组名实际上是指向数组第一个元素的常量指针。由于数组的元素存储在连续的内存块中，你可以使用数组名作为指针对元素进行随机访问。这种关系对于你如何传递和返回数组也具有重要意义，你很快就会看到。\n\
  \n#### 介绍 Array Passer（数组传递者）程序\n\nArray Passer 程序创建了一个高分数组，然后使用数组名作为常量指针显示它们。接下来，程序将数组名作为常量指针传递给一个增加分数的函数。最后，程序将数组名作为指向指向常量的常量指针传递给一个函数，以显示新的高分。图\
  \ 7.8 显示了程序的运行结果。\n\n**图 7.8**\n\n使用数组名作为指针，对高分进行了显示、修改并传递给函数。\n\n![images](img/00074.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 7 章文件夹中；文件名为 `array_passer.cpp`。\n\n```cpp\n//Array Passer\n//演示指针与数组之间的关系\n\n\
  #include <iostream>\n\nusing namespace std;\n\nvoid increase(int* const array, const\
  \ int NUM_ELEMENTS);\nvoid display(const int* const array, const int NUM_ELEMENTS);\n\
  \nint main()\n{\n    cout << \"Creating an array of high scores.\\n\\n\";\n    const\
  \ int NUM_SCORES = 3;\n    int highScores[NUM_SCORES] = {5000, 3500, 2700};\n\n\
  \    cout << \"Displaying scores using array name as a constant pointer.\\n\";\n\
  \    cout << *highScores << endl;\n    cout << *(highScores + 1) << endl;\n    cout\
  \ << *(highScores + 2) << \"\\n\\n\";\n\n    cout << \"Increasing scores by passing\
  \ array as a constant pointer.\\n\\n\";\n    increase(highScores, NUM_SCORES);\n\
  \    cout << \"Displaying scores by passing array as a constant pointer to a constant.\\\
  n\";\n    display(highScores, NUM_SCORES);\n\n    return 0;\n}\n\nvoid increase(int*\
  \ const array, const int NUM_ELEMENTS)\n{\n   for (int i = 0; i < NUM_ELEMENTS;\
  \ ++i)\n   {\n         array[i] += 500;\n   }\n}\n\nvoid display(const int* const\
  \ array, const int NUM_ELEMENTS)\n{\n   for (int i = 0; i < NUM_ELEMENTS; ++i)\n\
  \   {\n        cout << array[i] << endl;\n   }\n}\n```\n\n#### 使用数组名作为常量指针\n\n由于数组名是数组第一个元素的常量指针，你可以通过解引用指针来获取第一个元素。这是我在创建一个名为\
  \ `highScores` 的高分数组后做的。\n\n```cpp\ncout << *highScores << endl;\n```\n\n通过解引用 `highScores`\
  \ 来访问数组中的第一个元素。结果是显示了 `5000`。\n\n你可以使用数组名作为指针对元素进行随机访问。你所做的是将想要访问的元素的位置加到指针上，然后对其进行解引用。这比听起来要简单。例如，我接下来访问了\
  \ `highScores` 中位置为 `1` 的分数，通过以下行代码显示了 `3500`。\n\n```cpp\ncout << *(highScores +\
  \ 1) << endl;\n```\n\n\n\n\n你可以从 Cengage Learning 网站下载新版本的程序代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 7 章文件夹中；文件名为 `tic-tac-toe2.cpp`。我不会再过一遍代码，因为大部分内容保持不变。尽管改动的地方不多，但这些改动是非常重要的。这是一个非常好的学习程序，因为虽然你应该尽可能使用引用，但你也应该同样熟练使用指针。\n\
  \n## 总结\n\n在本章中，你应该学习了以下概念：\n\n- ![images](img/00007.jpeg) 计算机内存是有序组织的，每个块块内存都有其唯一的地址。\n\
  - ![images](img/00007.jpeg) 指针是一个包含内存地址的变量。\n- ![images](img/00007.jpeg) 在很多方面，指针的作用类似于\
  \ STL 中的迭代器。例如，就像使用迭代器一样，你使用指针来间接访问对象。\n- ![images](img/00007.jpeg) 声明指针时，列出一个类型，后跟一个星号，然后是名称。\n\
  - ![images](img/00007.jpeg) 程序员通常在指针变量名前前加上字母“p”，以提醒他们该变量确实是一个指针。\n- ![images](img/00007.jpeg)\
  \ 就像迭代器一样，指针被声明为引用特定类型的值。\n- ![images](img/00007.jpeg) 在声明指针时对其良好的良好的编程习惯。\n- ![images](img/00007.jpeg)\
  \ 如果给指针赋值 `0`，则该指针被称为空指针（null pointer）。\n- ![images](img/00007.jpeg) 要获取变量的地址，在变量名之前放置*地址的*操作符（&`）。\n\
  - ![images](img/00007.jpeg) 当指针包含对象的地址时，称它指向该对象。\n- ![images](img/00007.jpeg) 与引用不同，你可以重新赋值指针。也就是说，指针在程序生命周期的不同阶段可以指向不同的对象。\n\
  - ![images](img/00007.jpeg) 就像迭代器一样，你使用解引用操作符 `*` 对指针进行解引用以访问它指向的对象。\n- ![images](img/00007.jpeg)\
  \ 就像迭代器一样，你可以对指针使用 `->` 操作符，以更可读的方式访问对象的数据成员和成员函数。\n- ![images](img/00007.jpeg)\
  \ 常量指针只能指向它初始化时指向的对象。你通过在指针名直接之前放置关键字 `const` 来声明常量指针，例如 `int* const p = &i;`。\n\
  - ![images](img/00007.jpeg) 你不能使用指向常量的指针来改变它指向的值。你通过在类型名之前放置关键字 `const` 来声明指向常量的指针，例如\
  \ `const int* p;`。\n- ![images](img/00007.jpeg) 指向常量的常量指针只能指向它初始化的值，且不能用于改变该值。你通过在类型名之前和指针名直接之前放置关键字\
  \ `const` 来声明指向常量的常量指针，例如 `const int* const p = &I;`。\n- ![images](img/00007.jpeg)\
  \ 你可以传递指针以提高效率或提供对对象的直接访问。\n- ![images](img/00007.jpeg) 如果你想为了效率传递指针，应该传递指向常量的指针或指向常量的常量指针，这样你所传递的对象访问权限就不会通过指针更改。\n\
  - ![images](img/00007.jpeg) 悬空指针（dangling pointer）是指无效内存地址的指针。悬空指针通常由删除对象引起。\n\n\
  ### 答\n\n**Q:** 指针和引用有什么区别？\n**A:** 与引用不同，你可以重新赋值指针。\n\n**Q:** 传递指针有什么优势？\n**A:**\
  \ 你可以传递指针以提高效率或提供对对象的直接访问。\n\n**Q:** 什么是悬空指针？\n**A:** 悬空指针是指无效内存地址的指针。悬空指针通常由删除对象引起。\n\
  \n**Q:** 如果我对悬空指针进行解引用会发生什么？\n**A:** 结果是不可预测的。最可能的结果是你的程序会崩溃。\n\n**Q:** 为什么我在声明指针时应该对其初始化？\n\
  **A:** 这是一个良好的编程习惯。如果不这样做，你可能会有一个未初始化的指针。\n\n**Q:** 什么是空指针？\n**A:** 如果给指针赋值 `0`，则该指针被称为空指针。\n\
  \n**Q:** 对空指针进行解引用安全吗？\n**A:** 不！解引用空指针会导致灾难性的结果。\n\n**Q:** 空指针有什么用？\n**A:** 它们通常由函数返回作为失败信号。例如，如果一个函数应该返回指向图形屏幕的指针，但该函数无法初始化屏幕，它可能会返回一个空指针。\n\
  \n**Q:** 在声明指针时使用 `const` 关键字对指针有什么影响？\n**A:** 取决于你如何使用它。通常，你在声明指针时使用 `const`是为了限制指针的作用。\n\
  \n**Q:** 通过 `const` 声明指针可以对其施加何种限制？\n**A:** 你可以限制指针只能指向它初始化时的对象，或者你可以限制指针不能改变它指向对象的值，或者两者都有。\n\
  \n**Q:** 为什么我想限制指针可以做什么？\n**A:** 为了安全。例如，你可能正在处理一个你知道不想更改的对象。\n\n**Q:** 我可以将常量值赋值给什么类型的指针？\n\
  **A:** 指向常量的指针或指向常量的常量指针。\n\n**Q:** 我如何安全地从函数返回指针？\n**A:** 一种方法是返回从调用函数接收到的对象的指针。这样，你返回的是一个存在于调用代码中的对象的指针。（在[第\
  \ 9 章](#part0015.html_ch09）中，当你学习动态内存时会发现另一种重要方法。）\n\n## 讨论题\n\n1. 传递指针的优、缺点是什么？\n\
  2. 什么情况下需要常量指针？\n3. 什么情况下需要指向常量的指针？\n\n\n\n\n4. 在什么情况下需要一个指向常量的常量指针？\n\n5. 在什么情况下需要一个指向非常量对象的非常量指针？\n\
