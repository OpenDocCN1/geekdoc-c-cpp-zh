  \ 15 14\n\n***献给我我亲爱的、坚强的宝贝——感谢你提供的所有帮助、支持、理解（以及分心）。***\n\n***献给 Ariella Saraswati\
  \ Dawson，一个比她的名字更令人深刻的女孩。我期待和你一起重新发现世界，小猴。***\n\n## 致谢\n\n你读过的每一本书都在延续一个巨大的谎言。而我在这里要揭露出版行业那个肮脏的小秘密：书并不是只“由”某一个人完成的。是的，你在很多书封上（包括这本）只看到一个名字，但需要一个由业的人组成的团队才能完成最终产品。作者们无法单打独斗完成；我绝对无法单打独斗完成。因此，我想感谢所有帮助这个新版本成为现实的人。\n\
  \n感谢 Dan Foster，他兼任了项目编辑和校对的双重职责。Dan 帮助改进了一本已经经过多次多次编辑的书。\n\n感谢 Joshua Smith，我的技术审查员，他确保了我的程序正如描述的那样运行。\n\
  \n感谢 Kelly Talbot，我的校对员，她的工作让这本书看起来很棒——字面意义上的棒。\n\n我还要感谢高级采买编辑 Emi Smith，感谢她所有的鼓励。\n\
  \n最后，我想感谢所有创造在我成长期间我玩过的游戏的游戏程序员们。他们激励我去创作自己的小游戏，并最终进入游戏行业。我希望我能激励一些读者也这样做。\n\n##\
  \ 关于作者\n\n**Michael Dawson** 是一位游戏编程领域的作者和导师，教授学生编写自己游戏的艺术与科学。Mike 为 UCLA 延伸学院、数字媒体学院和洛杉矶电影学院开发并教授过游戏编程课程。此外，他的书籍是美国许多大学的指定读物。\n\
  \nMike 以制作人和设计师的身份进入游戏行业，但他也曾在一款冒险游戏中“主演”，在那个游戏中，玩家控制一个名为 Mike Dawson 的主角色。在游戏中，玩家指挥\
  \ Dawson 的数字化图像，他必须在植入的外星胚胎从他头部出生之前阻止外星入侵。\n\n在现实生活中，Mike 是《通过游戏编程入门 C++》、《面向初学者的\
  \ Python 编程》、《C++ 项目：基于文本游戏的编程》以及《Python 编程指南》的作者。他在南加州大学获得计算机科学学士学位。访问他的网站 [www.programgames.com](http://www.programgames.com)\
