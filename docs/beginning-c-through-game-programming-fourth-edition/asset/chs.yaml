  \ endl;\n       cout << &(*c) << endl;\n\n       return 0;\n   }\n```\n\n# 第 8 章：类：小动物照顾者\n\
  \n*面向对象编程*（*OOP*）是一种不同的编程思维方式。它是一种用于创建绝大多数游戏（以及其他商业软件）的现代方法论。在 OOP 中，你定义不同类型的对象，它们之间存在关系，允许对象进行相互作用。你已经与库中定义的类型对象工作过了，但\
  \ OOP 的核心特征之一是可以创建自己的类型，并从这些类型创建对象。在本章中，你将看到如何定义自己的类型并从它们创建对象。具体来说，你将学习：\n\n- ![images](img/00007.jpeg)\
  \ 通过定义类创建新类型\n- ![images](img/00007.jpeg) 声明类数据成员和成员函数\n- ![images](img/00007.jpeg)\
  \ 从类实例化对象\n- ![images](img/00007.jpeg) 设置成员访问级别\n- ![images](img/00007.jpeg) 声明静态数据成员和成员函数\n\
  \n## 定义新类型\n\n无论你谈论的是外星飞船、有毒箭，还是愤怒的变异鸡，游戏都充满了对象。幸运的是，C++ 允许将游戏实体表示为软件对象，并配备成员函数和数据成员。这些对象的工作原理和你已经看到的（如\
  \ `string` 和 `vector` 对象）一样。但要使用新类型的对象（例如，愤怒的变异鸡对象），你必须为它定义一个类型。\n\n#### 介绍 Simple\
  \ Critter 程序\n\nSimple Critter 程序定义了一个名为 `Critter` 的全新类型，用于创建虚拟宠物对象。程序使用这个新类型创建了两个\
  \ `Critter` 对象。然后，它给每个小动物分配了一个饥饿值。最后，每只小动物向世界问好并宣布它的饥饿值。图 8.1 显示了程序的运行结果。\n\n**图\
  \ 8.1**\n\n每只小动物都打招呼并宣布自己有多饿。\n\n![images](img/00075.jpeg)\n\n经微软许可。\n\n你可以从 Cengage\
  \ Learning 网站下载该程序的代码。程序位于第 8 章文件夹中；文件名为 `simple_critter.cpp`。\n\n```\n //Simple\
  \ Critter\n//演示如何创建一个新类型\n\n#include <iostream>\n\nusing namespace std;\n\nclass\
  \ Critter             // 类定义 -- 定义了一个新类型，Critter\n{\npublic:\n    int m_Hunger;\
  \         // 数据成员\n    void Greet();         // 成员函数原型\n};\n\nvoid Critter::Greet()\
  \     // 成员函数定义\n{\n    cout << \"你好！我是一只小动物。我的饥饿值是\" << m_Hunger << \".\" << endl;\n\
  }\n\nint main()\n{\n    Critter crit1;\n    Critter crit2;\n\n    crit1.m_Hunger\
  \ = 9;\n    crit1.Greet();\n\n    crit2.m_Hunger = 3;\n    crit2.Greet();\n\n  \
  \  return 0;\n}\n```\n*(注：由于原文提供的代码块中存在乱序和重复片段，翻译时已根据逻辑进行了整理，以确保代码可读性并保留了原始意图)*\n\
  \n*(注：原文的文本描述部分存在严重的逻辑错乱和重复，以下译文已根据逻辑进行了重组以确保语义连贯性)*\n\n 介绍 Simple Critter 程序\n\n\
  Simple Critter 程序定义了一个名为 `Critter` 的全新类型，用于创建虚拟宠物对象。程序使用这个新类型创建了两个 `Critter` 对象。然后，它给每个小动物分配了一个饥饿值。最后，每只小动物向世界问好并宣布它的饥饿值。图\
  \ 8.1 显示了程序的运行结果。\n\n**图 8.1**\n\n每只小动物都打招呼并宣布自己有多饿。\n\n![images](img/00075.jpeg)\n\
  \n经微软许可。\n\n你可以从 Cengage Learning 网站下载该程序的代码。程序位于第 8 章文件夹中；文件名为 `simple_critter.cpp`。\n\
  \n 定义类\n\n无论你谈论的是外星飞船、有毒箭，还是愤怒的变异鸡，游戏都充满了对象。幸运的是，C++ 允许将游戏实体表示为软件对象，并配备成员函数和数据成员。这些对象的工作原理和你已经看到的（如\
  \ `string` 和 `vector` 对象）一样。但要使用新类型的对象（例如，愤怒的变异鸡对象），你必须为它定义一个类型。\n\n 定义类\n\n要定义类，以\
  \ `class` 开始，后面跟着类名。用大括号包围体，并以分号结束。\n\n```\n class Critter             // 类定义 --\
  \ 定义了一个新类型，Critter\n{\npublic:\n    int m_Hunger;         // 数据成员\n    void Greet();\
  \         // 成员函数原型\n};\n```\n\n 数据成员\n\n在类定义中，你可以声明数据成员来表示对象的属性。我给小动物分配了一个：饥饿。我声明了一个\
  \ `int`。\n\n```\n int m_Hunger;         // 数据成员\n```\n\n这意味着 `Critter` 对象拥有它自己的饥饿值。注意数据成员名前缀为\
  \ `m_`。\n\n 成员函数\n\n在类定义中，你还可以声明成员函数来表示对象的行为。我给它一个——向世界问好并宣布饥饿值的能力——通过声明函数。\n\n\
  ```\n void Greet(); // 成员函数原型\n```\n\n这意味着 `Critter` 对象拥有打招呼并宣布饥饿值的能力。在此阶段，我只声明了函数\
  \ `Greet()`。\n\n 定义成员函数\n\n你可以在类外定义成员函数。在 `Critter` 类定义之外，我定义了 `Critter` 的成员函数 `Greet()`，它会打招呼并显示小动物的饥饿值。\n\
  \n```\n void Critter::Greet()     // 成员函数定义\n{\n    cout << \"你好！我是一只小动物。我的饥饿值是\"\
  \ << m_Hunger << \".\" << endl;\n}\n```\n\n该定义看起来与其他任何函数定义一样，唯一的区别在于我在函数名前加上了 `Critter::`。当你类外定义成员函数时，你需要类名和作用域解析符进行限定，以便编译器知道该定义属于该类。\n\
  \n在成员函数中，我将 `m_Hunger` 发送到 `cout`。这意味着 `Greet()` 显示调用该函数的对象的 `m_Hunger` 值。\n\n 实例化对象\n\
  \n当你创建一个对象时，你是从类中*实例化*它。事实上，特定的对象被称为类的*实例*。在 `main()` 中，我实例化两个 `Critter` 实例。\n\n\
  ```\n Critter crit1;\n   Critter crit2;\n```\n\n结果是，有两个 `Critter` 对象：`crit1` 和 `crit2`。\n\
  \n 访问数据成员\n\n是时候让这些小动物工作了。接下来，我给我的第一个小动物分配一个饥饿值。\n\n\n\n\n\n```\n crit1.m_Hunger\
  \ = 9;\n```\n\n上述代码将 `9` 赋值给 `crit1` 的数据成员 `m_Hunger`。就像访问对象的可用成员函数一样，你可以使用成员选择运算符访问对象的可用数据成员。\n\
  \n为了证明赋值操作成功，我显示了该小生物（critter）的饥饿程度。\n\n```\n cout << \"crit1’s hunger level is\
  \ \" << crit1.m_Hunger << \".\\n\";\n```\n\n上述代码显示了 `crit1` 的数据成员 `m_Hunger` 并正确地显示了\
  \ `9`。就像给可用数据成员赋值赋值一样，你可以通过成员选择运算符获取可用数据成员的值。\n\n接下来，我展示了同样的过程适用于另一个 `Critter` 对象。\n\
  \n```\n crit2.m_Hunger = 3;\n   cout << \"crit2’s hunger level is \" << crit2.m_Hunger\
  \ << \".\\n\\n\";\n```\n\n这一次，我将 `3` 赋值给 `crit2` 的数据成员 `m_Hunger` 并显示了它。\n\n因此，`crit1`\
  \ 和 `crit2` 都是 `Critter` 的实例，但它们各自独立存在，且都有自己的身份。此外，每个对象都有自己的 `m_Hunger` 数据成员以及其对应的值。\n\
  \n#### 调用成员函数\n\n接下来，我再次让这些小生物展示一下。我让第一个小生物打招呼。\n\n```\n crit1.Greet();\n```\n\n\
  上述代码调用了 `crit1` 的 `Greet()` 成员函数。该函数访问调用对象的 `m_Hunger` 数据成员以形成它显示的问候语。因为 `crit1`\
  \ 的 `m_Hunger` 数据成员为 `9`，该函数显示了文本：`Hi. I’m a critter. My hunger level is 9.`。\n\n\
  最后，我让第二个小生物开口。\n\n```\n crit2.Greet();\n```\n\n上述代码调用了 `crit2` 的 `Greet()` 成员函数。该函数访问调用对象的\
  \ `m_Hunger` 数据成员以形成它显示的问候语。因为 `crit2` 的 `m_Hunger` 数据成员为 `3`，该函数显示了文本：`Hi. I’m\
  \ a critter. My hunger level is 3.`。\n\n## 使用构造函数\n\n当你实例化对象时，通常想要进行一些初始化——通常是给数据成员赋值。幸运的是，类有一个特殊的成员函数被称为\
  \ `constructor`（构造函数），每当实例化一个新对象时，它都会被自动调用。这是一个巨大的便利，因为你可以使用构造函数来执行新对象的初始化。\n\n\
  #### 介绍构造函数 Critter 程序\n\n`Constructor Critter` 程序演示了构造函数。该程序实例化了一个新的 `Critter`\
  \ 对象，这会自动调用它的构造函数。首先，构造函数宣布一个新的小生物出生了。然后，它将传递给它的值赋值给小生物的饥饿程度。最后，程序调用小生物的问候成员函数，该函数显示小生物的饥饿程度，证明了构造函数确实初始化了该小生物。图\
  \ 8.2 显示了程序的运行。\n\n**图 8.2**\n\n`Critter` 构造函数会自动初始化新对象的饥饿程度。\n\n![images](img/00076.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码。程序位于 Chapter 8 文件夹中；文件名名为 `constructor_critter.cpp`。\n\
  \n```\n //Constructor Critter\n//Demonstrates constructors\n\n#include <iostream>\n\
  \nusing namespace std;\n\nclass Critter\n{\npublic:\n    int m_Hunger;\n\n    Critter(int\
  \ hunger = 0);              // 构造函数原型\n    void Greet();\n};\n\nCritter::Critter(int\
  \ hunger)             // 构造函数定义\n{\n    cout << \"A new critter has been born!\"\
  \ << endl;\n    m_Hunger = hunger;\n}\n\nvoid Critter::Greet()\n{\n    cout << \"\
  Hi. I’m a critter. My hunger level is \" << m_Hunger << \".\\n\\n\";\n}\n\nint main()\n\
  \    {\n    Critter crit(7);\n    crit.Greet();\n\n    return 0;\n}\n```\n\n####\
  \ 声明和定义构造函数\n\n我在 `Critter` 中通过以下代码声明了一个构造函数：\n\n```\n Critter(int hunger = 0);\
  \         // 构造函数原型\n```\n\n从声明中你可以看到，构造函数没有返回类型。它不能有返回类型；为构造函数指定返回类型是非法的。此外，在命名构造函数时没有灵活性。你必须给它一个与类本身相同的名称。\n\
  \n**提示**\n\n* *\n\n`default constructor`（默认构造函数）不需要任何参数。如果你没有定义默认构造函数，编译器会为你定义一个最小的构造函数，它简单地调用类中任何数据成员的默认构造函数。如果你写了自己的构造函数，那么编译器就不会为你提供默认构造函数。通常情况下有一个默认构造函数是一个好主意，所以你应该在需要时提供你自己的。实现这一点的一种方法是在构造函数定义中为所有参数提供默认参数。\n\
  \n* *\n\n我在类外通过以下代码定义构造函数：\n\n```\n Critter::Critter(int hunger)             //\
  \ 构造函数定义\n{\n   cout << \"A new critter has been born!\" << endl;\n   m_Hunger =\
  \ hunger;\n}\n```\n\n构造函数显示了一条消息说一个新的小生物出生，并用参数值初始化 `m_Hunger` 数据成员。如果没有传递值，构造函数将使用默认参数值\
  \ `0`。\n\n**技巧**\n\n* *\n\n你可以使用 `member initializers`（成员初始化列表）作为构造函数中为数据成员赋值的简便方法。要编写成员初始化，从构造函数参数列表后的冒号开始。然后输入你想要初始化的数据成员名称，后面跟着你想要赋值给它的表达式（用圆括号括）。如果你有多个初始化器，用逗号分隔它们。这比听起来要简单得多（而且非常有用）。这里有一个将\
  \ `hunger` 赋值给 `m_Hunger` 将 `boredom` 赋值给 `m_Boredom` 的示例。当你有很多数据成员需要初始化时，成员初始化列表特别有用。\n\
  \n```\n Critter::Critter(int hunger = 0, int boredom = 0):\n       m_Hunger(hunger),\n\
  \       m_Boredom(boredom)\n   {} // 空构造函数体\n```\n\n* *\n\n#### 自动调用构造函数\n\n你不会显式地调用构造函数；然而，每当你实例化新对象时，它的构造函数就会被自动调用。在\
  \ `main()` 中，我通过以下代码让我的构造函数发挥作用：\n\n```\n Critter crit(7);\n```\n\n当 `crit` 被实例化时，它的构造函数会被自动调用并显示消息\
  \ `A new critter has been born!`。然后，构造函数将 `7` 赋值给对象的 `m_Hunger` 数据成员。\n\n为了证明构造函数起作用了，在\
  \ `main()` 中，我调用了对象的 `Greet()` 成员函数，果不其然它显示了 `Hi. I’m a critter. My hunger level\
  \ is 7.`。\n\n### 设置成员访问级别\n\n就像函数一样，你应该将对象视为封装的实体。这意味着，通常情况下，你应该避免直接修改或访问对象的数据成员。相反，你应该调用对象的成员函数，允许对象维护其自己的数据成员并确保它们的完整性。幸运的是，你可以在定义类时通过设置成员访问级别来强制执行数据成员限制。\n\
  \n\n\n\n`Private Critter` 程序通过声明一个用于 critter（小生物）的类来演示类成员的访问级别，该类限制了对对象饥饿值数据成员的直接访问。该类提供了两个成员函数——一个允许访问数据成员，另一个允许更改数据成员。程序创建了一个新的\
  \ critter，并通过这些成员函数间接地访问并更改了 critter 的饥饿值。然而，当程序尝试将 critter 的饥饿值更改为非法值时，允许更改的成员函数会捕获该非法值且不进行更改。最后，程序使用合法值调用了设置饥饿值的成员函数，该运行运行非常完美。图\
  \ 8.3 显示了程序的运行结果。\n\n### 图 8.3\n\n通过使用 `Critter` 对象的 `GetHunger()` 和 `SetHunger()`\
  \ 成员函数，程序间接地访问了对象的 `m_Hunger` 数据成员。\n\n![images](img/00077.jpeg)\n\n经微软许可使用。\n\n\
  你可以从 Cengage Learning 网站下载该程序的代码。程序位于第 8 章文件夹中；文件名为 `private_critter.cpp`。\n\n```cpp\n\
  \ //Private Critter\n//Demonstrates setting member access levels\n\n#include <iostream>\n\
  \nusing namespace std;\n\nclass Critter\n{\npublic:            // begin public section\n\
  \    Critter(int hunger = 0);\n    int GetHunger() const;\n    void SetHunger(int\
  \ hunger);\n\nprivate:           // begin private section\n   int m_Hunger;\n};\n\
  \nCritter::Critter(int hunger):\n    m_Hunger(hunger)\n{\n    cout << \"A new critter\
  \ has been born!\" << endl;\n}\n\nint Critter::GetHunger() const\n{\n    return\
  \ m_Hunger;\n}\n\nvoid Critter::SetHunger(int hunger)\n{\n     if (hunger < 0)\n\
  \     {\n         cout << \"You can’t set a critter’s hunger to a negative number.\\\
  n\\n\";\n     }\n    else\n    { \n         m_Hunger = hunger;\n    }\n}\n\nint\
  \ main()\n{\n    Critter crit(5);\n    //cout << crit.m_Hunger;   //illegal, m_Hunger\
  \ is private!\n    cout << \"Calling GetHunger(): \" << crit.GetHunger() << \"\\\
  n\\n\";\n\n    cout << \"Calling SetHunger() with -1.\\n\";\n    crit.SetHunger(-1);\n\
  \n    cout << \"Calling SetHunger() with 9.\\n\";\n    crit.SetHunger(9);\n    cout\
  \ << \"Calling GetHunger(): \" << crit.GetHunger() << \"\\n\\n\";\n\n    return\
  \ 0;\n}\n```\n\n### 指定公共和私有访问级别\n\n每个类数据成员和成员函数都有一个访问级别，它决定了你可以在程序的哪个位置访问它。到为止，我一直使用\
  \ `public` 关键字来指定类成员具有公共访问级别。同样，在 `Critter` 中，我用以下这一行开始了一个公共区域：\n\n```cpp\n public:\
  \       // begin public section\n```\n\n通过使用 `public:`，我是在说随后的任何数据成员或成员函数（直到遇到另一个访问级别说明符）都是公有的。这意味着程序的任何部分都可以访问它们。因为我在这个区域中声明了所有的成员函数，这意味着我的代码的任何部分都可以通过\
  \ `Critter` 对象调用任何成员函数。\n\n接下来，我用以下这一行指定了一个私有区域：\n\n```cpp\n private:     // begin\
  \ private section\n```\n\n通过使用 `private:`，我是在说随后的任何数据成员或成员函数（直到遇到另一个访问级别说明符）都是私有的。这意味着只有\
  \ `Critter` 类中的代码可以直接访问它。由于我在这个区域中声明了 `m_Hunger`，这意味着只有 `Critter` 中的代码才能直接访问对象的\
  \ `m_Hunger` 数据成员。因此，我不能像在之前的程序中那样，通过 `main()` 函数中的对象直接访问对象的 `m_Hunger` 数据成员。所以，`main()`\
  \ 中的下面这一行如果没有取消注释，将是一个非法语句：\n\n```cpp\n //cout << crit.m_Hunger;   //illegal, m_Hunger\
  \ is private!\n```\n\n由于 `m_Hunger` 是私有的，我无法从 `Critter` 类之外的代码中访问它。同样，只有作为 `Critter`\
  \ 部分的代码才能直接访问该数据成员。\n\n我只向你展示了如何让数据成员变为私有，你也可以让成员函数变为私有。此外，你可以重复访问修饰符。所以如果你愿意，可以在类中设置私有区域，后面跟着公共区域，然后是另一个私有区域。最后，成员访问默认是私有的。在你指定访问修饰符之前，你声明的任何类成员都是私有的。\n\
  \n### 定义访问器成员函数\n\n*访问器成员函数*（accessor member function）允许对数据成员间间接。由于 `m_Hunger` 是私有的，我写了一个访问器成员函数\
  \ `GetHunger()` 来返回数据成员的值。（目前，你可以忽略 `const` 关键字。）\n\n```cpp\n int Critter::GetHunger()\
  \ const\n{\n    return m_Hunger;\n}\n```\n\n我在 `main()` 中让这个成员函数工作起来，使用了如下代码行：\n\
  \n```cpp\n cout << \"Calling GetHunger(): \" << crit.GetHunger() << \"\\n\\n\";\n\
  ```\n\n这行代码返回了 `m_Hunger` 的值。\n\n**技巧**\n\n* *\n\n正如你可以内联函数一样，你也可以内联成员函数。内联成员函数的方法是在类定义内部定义它，而通常你只需要声明它。这个规则的例外是当你当类定义中使用\
  \ `virtual` 关键字定义成员函数时，该函数不会自动内联。你将在第 10 章“继承与多态”中学习虚函数。\n\n* *\n\n在此处，你可能在奇怪为什么要费力将数据成员设为私有以便通过访问函数授予完全访问。答案是你通常不需要。例如，看看我为设置对象的\
  \ `m_Hunger` 数据成员定义的访问成员函数：\n\n```cpp\nvoid Critter::SetHunger(int hunger)\n{\n\
  \     if (hunger < 0)\n     {\n         cout << \"You can’t set a critter’s hunger\
  \ to a negative number.\\n\\n\";\n     }\n     else\n     {\n         m_Hunger =\
  \ hunger;\n     }\n}\n```\n\n在这个访问成员函数中，我首先检查传递给成员函数的值是否大于零。如果不是，它就是一个非法值，我会显示一条消息并保持数据成员不变。如果值大于零，我进行更改。这样，`SetHunger()`\
  \ 就保护了 `m_Hunger` 的完整性，确保它不会被设置为负数。正如我在这里所做的，大多数游戏程序员将访问器函数名称以 `Get` 或 `Set` 开头。\n\
  \n## 定义常量成员函数\n\n*常量成员函数*（constant member function）不能修改类的数据成员或调用类的非常量成员函数。为什么要限制成员函数的功能？再次，这回到了“只请求所需”的原则。如果你不需要在成员函数中更改任何数据成员，那么将该成员函数声明为常量是一个好主意。它可以防止意外修改数据成员，并向其他程序员明确你的意图。\n\
  \n**陷阱**\n\n* *\n\n好吧，我撒了一个小谎。常量成员函数可以修改静态数据成员。你将在本章稍晚时候的“声明和初始化静态数据成员”部分学习静态数据成员。此外，如果你对数据成员使用\
  \ `mutable` 关键字，那么即使是常量成员函数也可以修改它。不过，目前不用担心这这两个例外。\n\n* *\n\n你可以通过在函数头末尾添加 `const`\
  \ 关键字来声明一个常量成员函数。这就是我在 `Critter` 中通过以下行所做的，它将 `GetHunger()` 为常量成员函数。\n\n```cpp\n\
  \ int GetHunger() const;\n```\n\n\n\n这意味着 `GetHunger()` 无法更改 `Critter` 类中声明的任何非静态数据成员的值，也无法调用任何非常量\
  \ `Critter` 成员函数。我将 `GetHunger()` 设为常量，因为它只返回一个值而不需要修改任何数据成员。通常，`Get` 成员函数可以定义为常量。\n\
  \n## 使用静态数据成员和成员函数\n\n对象是伟大的，因为每个实例都存储了自己的一组数据，赋予了它独特的身份。但如果你想存储关于整个类的信息，例如存在的实例总数，该怎么办？如果你创建了一群敌人，并希望它们根据总数来与玩家战斗，那么你可能需要需要这一点。例如，如果它们的总数低于某个阈值，你可能想让敌人逃跑。你可以在每个对象中存储实例总数，但那样会浪费空间。此外，当总数发生变化时，更新所有对象将非常繁琐。相反，你真正需要的是一种能够为整个类存储单一值的方法。你可以通过静态数据成员来实现这一点。\n\
  \n#### 介绍静态 Critter 程序\n\n静态 Critter 程序声明了一种新型的小生物（critter），它包含一个静态数据成员，用于存储已创建的小生物总数。它还定义了一个静态成员函数来显示总数。在程序实例化任何新\
  \ `Critter` 对象之前，它通过直接访问持有总数的静态数据成员来显示小生物的总数。接下来，程序实例化了三个新的小生物。然后，它通过调用访问静态数据成员的静态成员函数来显示小生物的总数。图\
  \ 8.4 显示了程序的运行。\n\n**图 8.4**\n\n程序将 Critter 对象的总数存储在静态数据成员 `s_Total` 中，并通过两种方式访问该数据成员。\n\
  \n![images](img/00078.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码。程序位于第\
  \ 8 章文件夹中；文件名是 `static_critter.cpp`。\n\n```\n //Static Critter\n//Demonstrates static\
  \ member variables and functions\n\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Critter\n{\npublic:\n     static int s_Total;     //static member variable\
  \ declaration\n                             //total number of Critter objects in\
  \ existence\n\n     Critter(int hunger = 0);\n     static int GetTotal();  //static\
  \ member function prototype\n\nprivate:\n     int m_Hunger;\n};\n\nint Critter::s_Total\
  \ = 0;   //static member variable initialization\n\nCritter::Critter(int hunger):\n\
  \    m_Hunger(hunger)\n{\n    cout << \"A critter has been born!\" << endl;\n  \
  \  ++s_Total;\n}\n\nint Critter::GetTotal()   //static member function definition\n\
  {\n     return s_Total;\n}\n\nint main()\n{\n    cout << \"The total number of critters\
  \ is: \";\n    cout << Critter::s_Total << \"\\n\\n\";\n\n    Critter crit1, crit2,\
  \ crit3;\n\n    cout << \"\\nThe total number of critters is: \";\n    cout << Critter::GetTotal()\
  \ << \"\\n\";\n\n    return 0;\n}\n```\n\n#### 声明和初始化静态数据成员\n\n`静态数据成员` 是对于整个类存在的单一数据成员。在类定义中，我声明了一个静态数据成员\
  \ `s_Total` 来存储已实例化的 `Critter` 对象的数量。\n\n```\n static int s_Total;        //static\
  \ member variable declaration\n```\n\n你可以像我做的那样声明自己的静态数据成员，只需以 `static` 关键字开头即可。我在变量名前加加上了\
  \ `s_`，以便能够立即被识别为静态数据成员。\n\n在类定义之外，我将静态数据成员初始化为 `0`。\n\n```\n int Critter::s_Total\
  \ = 0;  //static member variable initialization\n```\n\n注意，我使用 `Critter::` 对数据成员名进行了限定。在类定义之外，你必须使用类名对静态数据成员进行限定。在执行完上一行代码后，`Critter`\
  \ 类关联了一个单一的值，存储在它的静态数据成员 `s_Total` 中，值为 `0`。\n\n**提示**\n\n* * *\n\n           你也可以在非类函数中声明静态变量。静态变量在函数调用之间会保持其值。\n\
  \n* * *\n\n#### 访问静态数据成员\n\n你可以在程序的任何地方访问公共静态数据成员。在 `main()` 中，我通过以下行访问了 `Critter::s_Total`，它显示了\
  \ `0`，即静态数据成员的值以及已实例化的 `Critter` 对象的总数。\n\n```\n cout << Critter::s_Total << \"\\\
  n\\n\";\n```\n\n**提示**\n\n* * *\n\n         你也可以通过该类的任何对象来访问静态数据成员。假设 `crit1` 是一个\
  \ `Critter` 对象，我可以通过以下行显示小生物的总数：\n\n```\n cout << crit1.s_Total << \"\\n\\n\";\n\
  ```\n\n* * *\n\n我还在 `Critter` 构造函数中访问了该数据成员，该行增加了 `s_Total`。\n\n```\n ++s_Total;\n\
  ```\n\n这意味着每当实例化一个新对象时，`s_Total` 就会加 1。注意我没有用 `Critter::` 来限定 `s_Total`。正如非静态数据成员一样，在类内部你不需要对其进行限定。虽然我将静态数据成员设为公共，但你也可以将静态数据成员设为私有——就像与其他数据成员一样，你只能在类成员函数访问它。\n\
  \n#### 声明和定义静态成员函数\n\n`静态成员函数` 对于整个类存在。我在 `Critter` 中通过以下行声明了一个静态成员函数：\n\n```\n\
  \ static int GetTotal();    //static member function prototype\n```\n\n你可以像我做的那样以\
  \ `static`关键字关键字静态成员函数。静态成员函数通常编写为与静态数据成员配合。\n\n我定义了静态成员函数 `GetTotal()`，它返回静态数据成员\
  \ `s_Total` 的值。\n\n```\n int Critter::GetTotal()\n{\n     return s_Total;\n}\n```\n\
  \n静态成员函数的定义与之前看到的非静态成员函数定义。。区别在于静态成员函数无法访问非静态数据成员。因为静态成员函数对于整个类存在，并不与类的任何实例关联。\n\
  \n#### 调用静态成员函数\n\n在 `main()` 中实例化三个 `Critter` 对象后，我再次通过以下行显示了小生物的总数，显示结果为 `3`。\n\
  \n```\n cout << Critter::GetTotal() << \"\\n\";\n```\n\n为了正确识别静态成员函数，我必须使用 `Critter::`\
  \ 对其进行限定。在类外部调用静态成员函数时，你必须使用类名进行限定。由于静态成员函数对于整个类存在，即使在不存在类实例的情况下也可以调用它们。而且与私有静态数据成员一样，私有静态成员函数只能被同类的其他成员函数访问。\n\
  \n\n\n《小动物照顾者》（Critter Caretaker）游戏让玩家负责自己的虚拟宠物。玩家完全负责让小动物保持快乐，这并不是一项轻松的任务。他可以通过喂养和和小动物玩耍来保持它心情愉快。他还可以倾听小动物说话，以了解它的感受，这些感受可能从开心到愤怒不等。图\
  \ 8.5 展示了该游戏。\n\n图 8.5\n\n如果你没有喂养或娱乐你的小动物，它的心情会变差。（但别担心——只要照顾得当，你的小动物可以恢复到明朗的心情。）\n\
  \n![images](img/00079.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载此程序的程序的代码。该程序位于第\
  \ 8 章 `m_Hunger`\n\n![images](img/00007.jpeg) `m_Boredom`\n\n小动物还应该有一个心情，直接基于它的饥饿值和无聊值。我的第一个想法是设置一个私有数据成员，但小动物的心情实际上是根据它的饥饿和无聊计算出的值。相反，我决定设置一个私有成员函数，根据当前的饥饿和无聊值实时计算小动物的心情：\n\
  \n![images](img/00007.jpeg) `GetMood()`\n\n接下来，我考虑公共成员函数。我希望小动物能够告诉玩家它的感受。我还希望玩家能够喂养和和小动物玩耍，以降低它的饥饿和无聊值。我需要三个公共成员函数来完成这些任务。\n\
  \n![images](img/00007.jpeg) `Talk()`\n\n![images](img/00007.jpeg) `Eat()`\n\n![images](img/00007.jpeg)\
  \ `Play()`\n\n最后，我想要另一个成员函数来模拟时间的流逝，让小动物变得更饥饿、更无聊：\n\n![images](img/00007.jpeg)\
  \ `PassTime()`\n\n我将这个成员函数视为私有的，因为它只会被其他成员函数调用，例如 `Talk()`、`Eat()` 或 `Play()`。\n\
  \n该类还一个构造函数来初始化数据成员。请看图 8.6，它模拟了 `Critter` 类。我在每个数据成员和成员函数前都加了一个符号来表示其访问级别；我用 `+`\
  \ 表示公共，用 `-` 表示私有。\n\n图 8.6\n\n`Critter` 类模型\n\n![images](img/00080.jpeg)\n\n###\
  \ 规划伪代码\n\n程序的其余部分非常简单。它基本上是一个游戏循环，询问玩家是想听小动物说话、喂养它、和它玩耍，还是退出游戏。这是我想出的伪代码：\n\n```\n\
  \ 创建一个小动物\n当玩家不想退出游戏时\n    向玩家展示选项菜单\n    如果玩家想听小动物说话\n        让小动物说话\n    如果玩家想喂养小动物\n\
  \        让小动物吃东西\n    如果玩家想和小动物玩耍\n        让小动物玩耍\n```\n\n## Critter 类\n\n`Critter`\
  \ 类是代表玩家小动物对象的蓝图。这个类并不复杂，大部分内容应该看起来很熟悉，但它足够长，所以分部分攻克更有意义。\n\n#### 类定义\n\n在一些初始注释和语句之后，我开始编写\
  \ `Critter` 类。\n\n```cpp\n //Critter Caretaker\n//模拟照顾虚拟宠物\n\n#include <iostream>\n\
  \nusing namespace std;\n\nclass Critter\n{\npublic:\n    Critter(int hunger = 0,\
  \ int boredom = 0);\n    void Talk();\n    void Eat(int food = 4);\n    void Play(int\
  \ fun = 4);\n\nprivate:\n    int m_Hunger;\n    int m_Boredom;\n\n    int GetMood()\
  \ const;\n    void PassTime(int time = 1);\n};\n```\n\n`m_Hunger` 是代表小动物饥饿值的私有数据成员，而\
  \ `m_Boredom` 是代表其无聊值的私有数据成员。我将在每个章节中详细介绍每个成员函数。\n\n#### 构造函数\n\n（此处由于原文存在大量重复和乱码，已按要求处理核心逻辑）\n\
  \n\n\n在 `main()` 中，我实例化了一个新的 `Critter` 对象。由于我没有为 `m_Hunger` 或 `m_Boredom` 提供值，数据成员初始值为\
  \ `0`，小生物在开始时是快乐且满足的。接下来，我创建了一个菜单系统。如果玩家输入 `0`，程序结束。如果玩家输入 `1`，程序调用对象的 `Talk()`\
  \ 成员函数。如果玩家输入 `2`，程序调用对象的 `Eat()` 成员函数。如果玩家输入 `3`，程序调用对象的 `Play()` 成员函数。如果玩家输入其他任何内容，将被告知该选择无效。\n\
  \n```cpp\n int main()\n{\n    Critter crit;\n    crit.Talk();\n\n    int choice;\n\
  \    do\n    {\n\n        cout << \"\\nCritter Caretaker\\n\\n\";\n        cout\
  \ << \"0 - Quit\\n\";\n        cout << \"1 - Listen to your critter\\n\";\n    \
  \    cout << \"2 - Feed your critter\\n\";\n        cout << \"3 - Play with your\
  \ critter\\n\\n\";\n\n        cout << \"Choice: \";\n        cin >> choice;\n\n\
  \        switch (choice)\n        {\n            case 0:\n                 cout\
  \ << \"Good-bye.\\n\";\n                 break;\n            case 1:\n         \
  \        crit.Talk();\n                 break;\n            case 2:\n          \
  \       crit.Eat();\n                 break;\n            case 3:\n            \
  \     crit.Play();\n                 break;\n            default:\n            \
  \     cout << \"\\nSorry, but \" << choice << \" isn’t a valid choice.\\n\";\n \
  \      }\n   } while (choice != 0);\n   return 0;\n}\n```\n\n## 总结\n\n在本章中，你应该已经学习了以下概念：\n\
  \n- ![images](img/00007.jpeg) 对象面向编程 (OOP) 是一种编程方式，通过定义具有相互作用的不同类型对象来思考。\n- ![images](img/00007.jpeg)\
  \ 你可以通过定义类来创建一个新类型。\n- ![images](img/00007.jpeg) 类是对象的蓝图。\n- ![images](img/00007.jpeg)\
  \ 在类中，你可以声明数据成员和成员函数。\n- ![images](img/00007.jpeg) 当你在类定义之外定义成员函数时，你需要用类名和作用解析运算符\
  \ (`::`) 对其进行限定。\n- ![images](img/00007.jpeg) 你可以通过在类定义中直接定义成员函数来将其内联。\n- ![images](img/00007.jpeg)\
  \ 你可以通过成员选择运算符 (`.`) 访问对象的数据成员和成员函数。\n- ![images](img/00007.jpeg) 每个类都有一个构造函数——这是一种每次实例化新对象时都会自动调用的特殊成员函数。构造函数通常用于初始化数据成员。\n\
  - ![images](img/00007.jpeg) 默认构造函数不需要参数。如果你没有在类中提供构造函数定义，编译器将为你创建一个默认构造函数。\n- ![images](img/00007.jpeg)\
  \ 成员初始化列表提供了在构造函数中为数据成员赋值的简便方法。\n- ![images](img/00007.jpeg) 你可以使用 `public`、`private`\
  \ 和 `protected` 关键字设置类中的成员访问级别。（你将在 第 9 章 “高级类与动态内存：游戏大厅”中学习 `protected`。）\n- ![images](img/00007.jpeg)\
  \ 公有成员可以通过对象被你代码的任何部分访问。\n- ![images](img/00007.jpeg) 私有成员只能由该类的成员函数访问。\n- ![images](img/00007.jpeg)\
  \ 访问器成员函数允许对数据成员进行间接访问。\n- ![images](img/00007.jpeg) 静态数据成员存在整个类。\n- ![images](img/00007.jpeg)\
  \ 静态成员函数存在于整个类。\n- ![images](img/00007.jpeg) 一些游戏程序员会在私有成员前加上 `m_`，静态成员前加上 `s_`。\n\
  \n## 问答\n\n**Q:** 什么是过程化编程？\n**A:** 一种将任务分解为较小函数的范式。\n\n**Q:** 什么是对象？\n**A:** 一个结合了数据和函数的实体。\n\
  \n**Q:** 为什么要创建对象？\n**A:** 因为它允许你定义相互作用的类型。\n\n**Q:** 什么是面向对象编程？\n**A:** 一种通过对象完成工作的范式。\n\
  \n**Q: C++ 是面向对象的语言还是过程化语言？**\n**A:** C++ 是一种多范式语言。**\n\n**Q: 我应该总是尝试编写面向对象的游戏吗？**\n\
  **A:** 一般而言，大型游戏项目无疑将受益于面向对象的方法。\n\n**Q:** 为什么不把所有类成员都设为公有？\n**A:** 因为这违背了封装的思想。\n\
  \n**Q:** 什么是封装？\n**A:** 自包含的特性。在 OOP 世界中，封装防止客户端代码直接访问内部实现。\n\n**Q: 封装有什么益处？**\n\
  **A:** 它保护了对象的完整性。例如，你可能有一个带有燃料数据成员的飞船对象。通过防止直接访问，你可以保证它不会变成非法值。\n\n**Q: 我应该通过访问器成员函数提供数据成员的访问吗？**\n\
  **A:** 有人认为你不应该这样做，因为这违背了封装。相反，应该编写类的成员函数为客户端提供所需的所有功能。\n\n**Q: 什么是可变成员？**\n**A:**\
  \ 即使在常量成员函数也可以被修改的数据成员。你使用关键字 `mutable` 创建它们。\n\n**Q: 为什么有默认构造函数很有用？**\n**A:** 因为有时会在没有任何参数值的情况下创建对象。\n\
  \n**Q: 什么是结构体？**\n**A:** 结构体与类非常相似。唯一的区别是默认访问级别是公有的。你使用关键字 `struct` 定义它。\n\n**Q:\
  \ 为什么 C++ 同时拥有结构体和类？**\n**A:** 为了让 C++ 保持与 C 的后兼容性。\n\n**Q: 我什么时候应该使用结构体？**\n**A:**\
  \ 有人用它们将数据组合在一起，但最好避免使用它们并改用类。\n\n## 讨论题\n\n1. 过程化编程的优缺点是什么？\n\n\n\n\n## 2. 面向对象编程的优缺点有哪些？\n\
