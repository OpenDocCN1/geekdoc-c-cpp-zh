  \ `while` 循环在表达式为 `true` 时执行一段代码，只要表达式为 `true` 就会重复该代码。\n- ![images](img/00007.jpeg)\
  \ `do` 循环执行一段代码，然后只要表达式为 `true` 就重复该代码。\n- ![images](img/00007.jpeg) 在循环中使用，`break`\
  \ 语句会立即结束循环。\n- ![images](img/00007.jpeg) 在循环中使用，`continue` 语句会立即导致程序控制跳转到循环顶部。\n\
  - ![images](img/00007.jpeg) `&&`（与）运算符结合两个较简单的表达式创建一个新表达式，只有当两个简单表达式都为 `true` 时，该新表达式才为\
  \ `true`。\n- ![images](img/00007.jpeg) `||`（或）运算符结合两个较简单的表达式创建一个新表达式，只要任一简单表达式为\
  \ `true`，该新表达式就为 `true`。\n- ![images](img/00007.jpeg) `!`（非）运算符创建一个新表达式，其真值与原始值相反。\n\
