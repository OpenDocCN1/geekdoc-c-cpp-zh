  n\";\n\n    return 0;\n\n在本章中，你学习了以下内容：\n\n- `for` 循环允许你重复一段代码。在 `for` 循环中，你可以提供初始化语句、测试表达式和每次迭代执行的操作。\n\
  - 对象是封装的实体，结合了数据（称为数据成员）和函数（称为成员函数）。\n- `string` 对象（通常称为字符串）定义在标准库 `string` 中。`string`\
  \ 对象允许你处理字符序列。\n- `string` 对象的定义方式使其与熟悉的运算符（如连接运算符和关系运算符）协同工作。\n- 所有 `string` 对象都有成员函数，包括确定\
  \ `string` 长度、判断是否为空、查找子字符串和删除子字符串。\n- 数组提供了存储和访问任何类型序列的方法。\n- 数组的局限性是它们具有固定长度。\n\
  - 你可以通过下标访问 `string` 对象和数组的元素。\n- 在访问 `string` 对象或数组的单个元素时，不会强制执行边界检查。因此，边界检查由程序员负责。\n\
  - C 风格字符串是以空字符终止的字符数组。它们是 C 语言中表示字符串的标准方式。尽管 C 风格字符串在 C++ 中完全合法的，但 `string` 对象是处理字符序列的首选方法。\n\
  - 多维数组允许使用多个下标访问数组元素。例如，棋盘可以表示为 8 × 8 元素的二维数组。\n\n## 总结\n\n### 问题与解答\n\n**Q:** `while`\
  \ 循环和 `for` 循环哪个更好？\n\n**A:** 两者之间没有绝对的优劣之分。使用符合你需求的循环。\n\n**Q:** 什么时候使用 `for` 循环比\
  \ `while` 循环更好？\n\n\n\n\n\n**答:** 你可以创建一个 `while` 循环来完成任何 `for` 循环的工作；然而，某些情况非常适合使用\
  \ `for` 循环。这些情况包括计数和遍历序列。\n\n**问：** 我可以在 `for` 循环中使用 `break` 和 `continue` 语句吗？\n\
  \n**答：** 可以。它们的行为与在 `while` 循环中完全一样：`break` 结束循环，而 `continue` 将控制跳回循环顶部。\n\n**问：**\
  \ 为什么程序员倾向于在 `for` 循环中使用如 `i`、`j` 和 `k` 等变量名作为计数器？\n\n**答：** 不可信由信，程序员使用 `i`、`j`\
  \ 和 `k` 主要是出于传统。这种做法始于 FORTRAN 语言的早期版本，在当时整数变量必须以某些字母开头，包括 `i`、`j` 和 `k`。\n\n**问：**\
  \ 使用 `int` 或 `char` 类型不需要包含文件，为什么为什么使用字符串时必须包含 `string` 文件呢？\n\n**答：** `int` 和 `char`\
  \ 是内置类型。它们在任何 C++ 程序中都是随时可用的。而 `string` 类型不是内置类型。它是作为标准库的一部分定义在 `string` 文件中的。\n\
  \n**问：** C 风格字符串是如何命名的？\n\n**答：** 在 C 语言中，程序员用以空字符（null character）结尾的字符数组表示字符串。这种做法延续到了\
  \ C++。在 C++ 引入新的 `string` 类型后，程序员们需要一种方法来区分两者。因此，旧方法被称为 C 风格字符串。\n\n**问：** 为什么我应该使用\
  \ `string` 对象而不是 C 风格字符串？\n\n**答：** `string` 对象比 C 风格字符串更有优势。最明显的一点是它们是动态调整大小的。当你创建一个对象时，不需要指定长度限制。\n\
  \n**问：** 我应该使用 C 风格字符串吗？\n\n**答：** 尽可能你都应该选择 `string` 对象。如果你正在处理一个使用 C 风格字符串的现有项目，那么你可能不得不使用\
  \ C 风格字符串。\n\n**问：** 什么是运算符重载？\n\n**答：** 这是一个允许你在不同上下文中定义熟悉操作符用法，并产生不同但可预测结果的过程。例如，用于相加的\
  \ `+` 运算符被 `string` 类型重载以用于连接字符串。\n\n**问：** 运算符重载不会让人困惑吗？\n\n**答：** 的确，通过重载操作符，你赋予了它另一种含义。但新含义仅适用于特定的新上下文。例如，在表达式\
  \ `4 + 6` 中，很明显 `+` 运算符是用于数字相加；而在表达式 `myString1 + myString2` 中，`+` 运算符用于连接字符串。\n\
  \n**问：** 我可以使用 `+=` 运算符来拼接字符串吗？\n\n**答：** 可以，`+=` 运算符被重载了，因此它可以处理字符串。\n\n**问：**\
  \ 获取 `string` 对象的字符数，我应该使用 `length()` 成员函数还是 `size()` 成员函数？\n\n**答：** `length()`\
  \ 和 `size()` 返回的值相同，所以你可以使用其中任何一个。\n\n**问：** 什么是谓词函数？\n\n**答：** 返回 `true` 或 `false`\
  \ 的函数。`string` 对象的成员函数 `empty()` 就是谓词函数的一个例子。\n\n**问：** 如果我尝试给数组边界之外的元素赋值会发生什么？\n\
  \n**答：** C++ 会允许你进行赋值。然而，结果是不可预测的，并可能导致你的程序崩溃。这是因为你正在修改计算机内存中的某些未知部分。\n\n**问：**\
  \ 为什么我应该使用多维数组？\n\n**答：** 为了让处理一组元素变得更加直观。例如，你可以用一维数组表示棋盘，如 `chessBoard[64]`；你也可以用一个更直观的二维数组来表示它，如\
  \ `chessBoard[8][8]`。\n\n## 讨论题\n\n1. 在你最喜欢的游戏中，有哪些元素可以表示为对象？它们的数据成员和成员函数可能是什么？\n\
