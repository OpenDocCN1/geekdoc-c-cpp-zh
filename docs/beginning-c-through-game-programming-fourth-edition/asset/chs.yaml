  \n## 第 1 章：类型、变量与标准输入输出：错失的财富\n\n游戏编程极具挑战性。它将程序员和硬件推向了极限。但它也能带来巨大的成就感。在本章中，你将接触\
  \ C++ 的基础知识，这是 AAA 游戏作品的标准语言。具体来说，你将学习：\n\n![images](img/00007.jpeg) 在控制台窗口显示输出\n\
  ![images](img/00007.jpeg) 执行算术计算\n![images](img/00007.jpeg) 使用变量存储、操作和检索数据\n![images](img/00007.jpeg)\
  \ 获取用户输入\n![images](img/00007.jpeg) 处理常量和枚举\n![images](img/00007.jpeg) 处理字符串\n\n\
  ### 介绍 C++\n\n全球数以百万计的程序员都在使用 C++。它是编写计算机应用程序最流行的语言之一——也是编写大预算电脑游戏最流行的语言。\n\nC++\
  \ 由 Bjarne Stroustrup 创建，是 C 语言的直接后代。事实上，C++ 保留了几乎所有的 C 语言作为其子集。然而，C++ 提供了更好的处理方法以及一些全新的功能。\n\
  \n#### 使用 C++ 开发游戏\n\n游戏程序员选择 C++ 的原因有很多。以下是其中几个：\n\n![images](img/00007.jpeg) **它很快。**\
  \ 编写良好的 C++ 程序可以运行得极快。C++ 的设计目标之一就是性能。如果你需要从程序中榨出更多性能，C++ 允许你使用 `assembly language`（最底层、人类可读的编程语言）来与计算机硬件直接通信。\n\
  \n![images](img/00007.jpeg) **它很灵活。** C++ 是一种多范式语言，支持不同的编程风格，包括`object-oriented\
  \ programming`。不过与某些其他现代语言不同，C++ 不会强制程序员使用特定的风格。\n![images](img/00007.jpeg) **它支持良好。**\
  \ 由于它在游戏行业拥有悠久的历史，C++ 游戏程序员有大量的资源可可用，包括图形 API 以及 2D、3D、物理和音频引擎。所有这些预现有代码都可以被 C++\
  \ 程序员利用，从而大大加快编写新游戏的过程。\n\n#### 创建可执行文件\n\n你运行以启动程序的文件——无论你说的是游戏还是业务应用——都是 `executable\
  \ file`。从 C++ `source code`（C++ 语言的指令集）创建可执行文件有几个步骤。该过程如图图 1.1\n\n1. 首先，程序员使用 `editor`\
  \ 编写 C++ 源代码，该文件通常具有 `.cpp` 扩展名。编辑器就像是程序的文字处理器；它允许程序员创建、编辑和保存。\n2. 程序员保存文件后，调用 `compiler`——这是一个读取源代码并将其翻译为\
  \ `object file` 的应用程序。对象文件通常具有 `.obj` 扩展名。\n3. 接下来，链接器（linker）将对象文件与任何外部文件链接起来，然后创建可执行文件，该文件通常以\
  \ `.exe` 结尾。在此时，用户就可以运行程序了。\n\n**提示**\n\n* * *\n\n我描述的过程是简单情况。为了帮助自动化这一过程，程序员通常会使用一种一体化的开发工具，称为\
  \ `IDE`（`集成开发环境`）。IDE 通常将 `editor`、`compiler` 和 `linker` 以及其他工具结合。Windows 上流行的（且免费的）IDE\
  \ 是 `Visual Studio Express 2013 for Windows Desktop`。你可以在 [www.visualstudio.com/downloads/visual-studio-vs](http://www.visualstudio.com/downloads/visual-studio-vs)\
  \ 更多关于此 IDE 的信息（并下载副本）。\n\n#### 处理错误\n\n当我描述从 C++ 创建可执行文件的过程时，我漏掉了一个细节：错误。如果人非完美，那么程序员就是我们中最具人性的。即使是最好的程序员，代码第一次运行时产生错误。程序员必须修复错误并重新开始。以下是你在\
  \ C++ 编程时会遇到的基本类型错误：\n\n- **编译错误。** 发生在代码编译期间。结果是不产生对象文件。这些可能是 `syntax errors`，意味着编译器无法理解某些内容。它们通常是由简单的拼写错误引起的。编译器还可能发出警告。虽然你不需要忽略警告，但你应该将它们视为错误，修复它们并重新编译。\n\
  - **链接错误。** 发生在链接期间，可能意味着找不到引用的任何外部文件。这些错误通常通过调整引用并重新开始编译/链接过程来解决。\n- **运行时错误。**\
  \ 发生在运行执行文件时。这些可能是 `logical errors`。如果程序执行了非法操作，它可能会崩溃。但一种更微妙的运行时错误——`logical error`——会让程序以违背预期的方式运行。\n\
  \n#### 理解 ISO 标准\n\n\n\n\n\nC++ 的 `ISO`（国际标准化组织）`standard` 是 C++ 的一种定义，它精确地描述了该语言应该如何工作。它还定义了一组被称为`standard\
  \ library`的文件，这些文件包含了常用编程任务的构建模块，例如 `I/O`——获取输入和显示输出。标准库让程序员的生活变得更简单，并提供了基础代码以免他们重复造轮子。我将在书中的所有程序中使用标准库。\n\
  \n### 提示\n`ISO` 标准通常被称为`ANSI（美国国家标准学会）标准`或`ANSI/ISO 标准`。这些不同的名称涉及审查和确立该标准的各个委员会的缩写。引用符合\
  \ `ISO` 标准的 C++ 代码最常见的方式是简单地称为 `Standard C++`（标准 C++）。\n\n我使用 `Visual Studio Express\
  \ 2013 for Windows Desktop` 来开发书中的程序。该 IDE 包含的编译器非常遵循 `ISO` 标准，因此你也应该能够使用其他现代编译器来编译、链接和运行所有程序。不过，如果你正在使用\
  \ Windows，我建议使用 `Visual Studio Express 2013 for Windows Desktop`。\n\n### 提示\n有关如何使用\
  \ `Visual Studio Express 2013 for Windows Desktop` 创建、保存、编译和运行 `Game Over` 程序的逐步说明，请参阅附录\
  \ A，“创建你的第一个 C++ 程序”。如果你使用其他编译器或 IDE，请查看其文档。\n\n## 编写你的第一个 C++ 程序\n\n好了，理论部分够了。现在是时候进入细节并编写你的第一个\
  \ C++ 程序了。虽然它很简单，但接下来的程序向你展示了程序的基本解剖结构。它还演示了如何在控制窗口中显示文本。\n\n#### 介绍 Game Over 程序\n\
  程序员在学习新语言时最经典的第一个任务是 Hello World 程序，它在屏幕上显示 `Hello World`。`Game Over` 程序为这个经典任务增加了游戏元素，改为显示\
  \ `Game Over!`。图 1.2 显示了程序的运行情况。\n\n**图 1.2**\n你的第一个 C++ 程序显示了计算机游戏中最臭名昭著的两个词。\n\
  ![images](img/00009.jpeg)\n经微软许可使用。\n\n你可以从 Cengage Learning 网站（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads））下载该程序的代码。程序位于第\
  \ 1 章文件夹中；文件名是 `game_over.cpp`。\n\n### 提示\n你可以通过访问 [www.cengageptr.com/](http://www.cengageptr.com/)\
  \ 下载并搜索这本书，来下载书中所有程序的源代码。一种搜索方法是通过 ISBN（书籍的识别码），该数字为 9781305109919。\n\n```cpp\n\
  \ // Game Over\n// A first C++ program\n\n#include <iostream>\n\nint main()\n{\n\
  \      std::cout << \"Game Over!\" << std::endl;\n      return 0;\n}\n```\n\n####\
  \ 注释代码\n程序的前两行是注释。\n\n```cpp\n // Game Over\n// A first C++ program\n```\n\n编译器会完全忽略注释；它们是给人类看的。它们可以帮助其他程序员理解你的意图。但注释也可以帮助你。它们可以提醒你如何实现某些一眼看可能并不清楚的功能。\n\
  \n你可以使用两个连续的正斜杠（`//`）来创建注释。该物理行后续的任何内容都被视为注释的一部分。这意味着你也可以在同一行的一段 C++ 代码之后包含注释。\n\
  \n### 提示\n你还可以使用所谓的 `C-style comments`（C 风格注释），它们可以跨多行。你只需要用 `/*` 开始注释并用 `*/` 结束注释。两个标记之间的所有内容都是注释的一部分。\n\
  \n#### 使用空白符\n程序的下一行是一个空行。编译器忽略空行。事实上，编译器忽略几乎所有的 `whitespace`——空格、制表符和换行符。和注释一样，空白符只是为了我们人类。\n\
  \n明智地使用空白符有助于程序更加清晰。例如，你可以使用空行来分隔属于在一起的代码段。我还在大括号之间的两行开头使用了空白符（确切来说是一个制表符）来将它们隔开。\n\
  \n#### 包含其他文件\n程序的下一行是一个预处理器指令。你之所以知道这一点是因为该行以 `#` 符号开头。\n\n```cpp\n #include <iostream>\n\
  ```\n\n`preprocessor` 在编译器执行工作之前运行，并根据各种指令替换文本。在这种情况下，该行涉及 `#include` 指令，它告诉预处理器包含另一个文件的内容。\n\
  \n我包含了 `iostream` 文件，它是标准库的一部分，因为它包含了帮助我显示输出的代码。我在文件名周围使用了小于号（`<`）和大于号（`>`）。\n####\
  \ 定义 main() 函数\n接下来的非空行是 `main()` 的头文件。\n\n```cpp\n int main()\n```\n\n一个 *function*（函数）是一组可以执行工作的代码。在这种情况下，`int`\
  \ 表示该函数将返回一个整数值。所有 C++ 程序都必须有 `main()`，它是程序的起点。真正的动作从这里开始。\n\n```cpp\n {\n```\n\n\
  而程序的最后一行标记了结束。\n\n```cpp\n }\n```\n\n所有函数都由大括号限定，它们之间的所有内容都是 *block*（块）。大括号之间的代码通常会缩进以显示它们形成单元。\n\
  \n#### 通过标准输出显示文本\n`main()` 体体的第一行显示 `Game Over!`，然后是一个换行符。\n\n```cpp\nstd::cout\
  \ << \"Game Over!\" << std::endl;\n```\n\n`\"Game Over!\"` 是一个 *string*（字符串）——一组可打印字符。技术上，它是一个\
  \ *string literal*（字符串字面量），意味着它是引号之间的字符。\n\n`cout` 是定义在 `iostream` 中的对象，用于将数据发送到标准输出。在大多数程序（包括本程序）中，标准输出流简单指控制窗口。\n\
  \n我使用输出运算符（`<<`）将字符串发送到 `cout`。你可以将输出运算符想象成漏斗；它接收开启侧的内容并汇入到尖的一侧。因此，字符串被汇入到标准输出——屏幕。\n\
  \n我使用 `std` 前缀 `cout`，告诉编译器我指的是标准库中的 `cout`。`std` 是一个 *namespace*（命名空间）。你使用作用域解析运算符（`::`）来前缀命名空间。\n\
  \n\n\n\n标准 C++ 的实现包含一组被称为标准库的文件，其中包含了 `iostream` 文件，它定义了许多内容，包括对象 `cout`。\n\n![images](img/00010.jpeg)\n\
  \n## 终止语句\n\n你会注意到函数的第一行以一个分号（`;`）结尾。这是因为该行是一个 `statement`（语句）——这是控制执行流的基本单位。你所有的语句都必须以分号结尾——否则，你的编译器将抛出错误信息并向你抱怨，而且你的程序将无法编译。\n\
  \n## 从 main( ) 返回值\n\n函数中的最后一条语句向操作系统返回 `0`。\n\n return 0;\n```\n\n从 `main()` 返回\
  \ `0` 是表示程序在没有问题的情况下结束的一种方法。操作系统不需要对返回值进行任何操作。通常情况下，你可以像我在这里一样直接返回 `0`。\n\n### 技巧\n\
  \n* * *\n\n当你运行 Game Over 程序时，你可能只会看到控制窗口快速地出现并消失。这是因为 C++ 速度非常快，它在几秒内打开了控制窗口、显示\
  \ `Game Over!` 并关闭了窗口。然而，在 Windows 中，你可以创建一个批处理文件来运行你的控制程序并暂停，保持控制窗口打开，这样你就可以看到程序的结果。由于编译后的程序命名为\
  \ `game_over.exe`，你可以简单地创建一个包含这两行的批处理文件\n\n```\n game_over.exe\n   pause\n```\n\n\
  创建批处理文件：\n\n1. 打开像记事本这样的文本编辑器（不是 Word 或 WordPad）。\n2. 输入你的文本。\n3. 将文件保存到与你的 `game_over.exe`\
  \ 文件相同的文件夹中。为文件赋予 `.bat` 扩展名——在这种情况下，`game_over.bat` 是一个很好的名字。\n\n最后，通过双击它的图标运行批处理文件。你应该能看到程序的结果，因为批处理文件会保持控制窗口打开。\n\
  \n* * *\n\n## 使用 std 命名空间\n\n由于使用 `std` 命名空间中的元素非常常见，我将向你展示两种直接访问这些元素的不同方法。这将节省你一直使用\
  \ `std::` 前缀的费力。\n\n### 介绍 Game Over 2.0 程序\n\nGame Over 2.0 程序产生的结果与原始 Game Over\
  \ 程序完全相同，如图图 1.2 所示。但访问 `std` 命名空间元素的方式有所不同。你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 1 章文件夹中；文件名为 `game_over2.cpp`。\n\n```\n // Game Over 2.0\n// 展示了 using 指令\n\n\
  #include <iostream>\nusing namespace std;\n\nint main()\n{\n     cout << \"Game\
  \ Over!\" << endl;\n     return 0;\n}\n```\n\n### 使用 using 指令\n\n程序的启动方式相同。我使用了两个开头注释，然后包含\
  \ `iostream` 用于输出。但接下，我有一个新类型的语句。\n```\n using namespace std;\n```\n\n这个 `using`\
  \ 指令允许我直接访问 `std` 命名空间的元素。再次，如果说命名空间像一个区号，那么这一行就表示 `std` 命名空间中的所有元素现在对我来说都像本地电话号码。也就是说，我不需要使用它们的区号（`std::`\
  \ 前缀）来访问它们。\n\n我可以在不需要任何前缀的情况下使用 `cout` 和 `endl`。这现在对你来说可能不是什么大事，但当你有几十甚至上百个对这些对象的引用时，你会感谢我的。\n\
  \n### 介绍 Game Over 3.0 程序\n\n好的，还有另一种方法可以实现我在 Game Over 2.0 中做的事情：设置文件使我不需要显式地使用\
  \ `std::` 前缀来访问 `cout` 和 `endl`。这正是我将在 Game Over 3.0 程序中向你展示的，它显示与其前版本相同的文本。你可以从\
  \ Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 1 章文件夹中；文件名为 `game_over3.cpp`。\n\n```\n // Game Over 3.0\n// 展示使用 声明\n\n#include\
  \ <iostream>\nusing std::cout;\nusing std::endl;\n\nint main()\n{\n     cout <<\
  \ \"Game Over!\" << endl;\n     return 0;\n}\n```\n\n### 使用 using 声明\n\n程序的启动方式相同。我使用了两个开头注释，然后包含\
  \ `iostream` 用于输出。但接下，我有一个新类型的语句。\n\n```\n using std::cout;\nusing std::endl;\n\
  ```\n\n这个 `using` 指令允许我直接访问 `std` 命名空间的元素。再次，如果说命名空间像一个区号，那么这一行就表示 `std` 命名空间中的所有元素现在对我来说都像本地电话号码。也就是说，我不需要使用它们的区号（`std::`\
  \ 前缀）来访问它们。\n\n我可以在不需要任何前缀的情况下使用 `cout` 和 `endl`。这现在对你来说可能不是什么大事，但当你有几十甚至上百个对这些对象的引用时，你会感谢我的。好的，还有另一种方法可以实现我在\
  \ Game Over 2.0 中做的事情：设置文件使我不需要显式地使用 `std::` 前缀来访问 `cout` 和 `endl`。这正是我将在 Game Over\
  \ 3.0 程序中向你展示的，它显示与其前版本相同的文本。你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 1 章文件夹中；文件名为 `game_over3.cpp`。\n\n## 使用运算符\n\n无论你是在计算敌人数量还是减少玩家的血量，你都需要程序来执行数学运算。与其他语言一样，C++\
  \ 拥有内置的。\n\n### 介绍自己的程序\n\n大多数游戏玩家会在尖端、高性能配置上投入大量资金。接下来的程序 Expensive Calculator\
  \ 可以这台怪物机器变成一个简单的计算器。该程序展示了内置运算符。图 1.4 展示了结果。\n\n**图 1.4**\n\nC++ 可以加、减、乘、除，甚至计算余数。\n\
  ![images](img/00011.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 1 章文件夹中；文件名为 `expensive_calculator.cpp`。\n\n```\n // Expensive Calculator\n//\
  \ 展示了内置运算符\n\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n\n   \
  \  cout << \"7 + 3 = \" << 7 + 3 << endl;\n     cout << \"7 - 3 = \" << 7 - 3 <<\
  \ endl;\n     cout << \"7 * 3 = \" << 7 * 3 << endl;\n\n     cout << \"7 / 3 = \"\
  \ << 7 / 3 << endl;\n     cout << \"7.0 / 3.0 = \" << 7.0 / 3.0 << endl;\n\n   \
  \  cout << \"7 % 3 = \" << 7 % 3 << endl;\n\n     return 0;\n}\n```\n\n### 加、减、乘\n\
  \n我使用内置算术运算符进行加法（加号，`+`）、减法（减号，`-”）和乘法（星号，`*`）。图 1.4 中所示的结果正如你所预期的那样。\n\n\n\n\n\
  每个算术运算符都是 `expression`（表达式）的一部分——即能求出一个单一值的内容。例如，表达式 `7 + 3` 的求值为 `10`，这就是发送给 `cout`\
  \ 的内容。\n\n## 理解整数除法和浮点除法\n\n除法的符号是斜杠（`/`），因此我在下一行代码中使用了它。然而，输出结果可能会让你感到惊讶。根据 C++（以及你那台昂贵的游戏电脑），`7`\
  \ 除以 `3` 等于 `2`。这是怎么回事？嗯，任何仅涉及 `integers`（不带小数部分的数字）的算术计算结果始终另一个整数。由于 `7` 和 `3`\
  \ 都是整数，结果必须是整数。结果的小数部分会被丢弃。\n\n要获得包含小数部分的结果，值中至少要有一个是 `floating point`（带有小数部分的数字）。我在下一行代码通过表达式\
  \ `7.0 / 3.0` 演示了这一点。这次的结果是更准确的 `2.33333`。\n\n### 陷阱\n\n你可能会注意到，虽然 `7.0 / 3.0` 的结果（`2.33333`）包含小数部分，但它仍然被截断了。（真实的结果会在小数点后无限延伸许多个\
  \ `3`。）需要重要的是，计算机通常只为浮点数存储有限数量的有效数字。然而，C++ 提供了多类浮点数来满足最苛刻的需求——即使是计算密集型 3D 游戏也是。\n\
  \n\n在下一个语句中，我使用了一个你可能感到陌生的运算符——模运算符（`%`）。模运算符返回整数除法的余数。在这种情况下，`7 % 3` 产生 `7 / 3`\
  \ 的余数，即 `1`。\n\n## 理解运算顺序\n\n就像在代数一样，C++ 中的算术表达式是从左到右求值的。但某些运算符的优先级高于其他运算符，无论位置如何，都会被先计算。乘法、除法和模的优先级相同，高于加法和减法共有的优先级级别。\n\
  \n下一行代码提供了一个例子来帮助理解。因为乘法的优先级高于加法，所以你先计算乘法的结果。因此，表达式 `7 + 3 * 5` 等于 `7 + 15`，求值为\
  \ `22`。\n\n如果你想让优先级较低的操作先发生，可以使用括号，括号的优先级高于任何算术运算符。因此在下一个语句中，表达式 `(7 + 3) * 5` 等于\
  \ `10 * 5`，求值为 `50`。\n\n### 提示\n\n有关 C++ 运算符及其优先级的列表，请参阅 Appendix B，“运算符优先级”。\n\n\
  ## 声明和初始化变量\n\n`variable`（变量）代表计算机内存中的某特定部分，该部分被留给你用于存储、检索和处理数据。所以，如果你想跟踪玩家的分数，可以为它创建一个变量，然后检索分数并显示出来。当玩家从空中击落外星人敌人时，你还可以更新分数。\n\
  \n### 介绍游戏统计程序\n\nGame Stats 程序显示了你可能在太空射击游戏中想要跟踪的信息，例如玩家分数、玩家击毁的敌人数量以及玩家是否开启了护盾。该程序使用一组变量来完成所有这些工作。图\
  \ 1.5 展示了该程序。\n\n**图 1.5**\n\n每个游戏统计数据存储在一个变量中。\n\n![images](img/00012.jpeg)\n\n\
  经微软许可使用。\n\n你可以从 Cengage Learning 网站下载此程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第一章文件夹中；文件名为\
  \ `game_stats.cpp`。\n\n```cpp\n // Game Stats\n// Demonstrates declaring and initializing\
  \ variables\n\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    \
  \ double distance;\n     char playAgain;\n     bool shieldsUp;\n\n     short lives,\
  \ aliensKilled;\n\n     score = 0;\n     distance = 1200.76;\n     playAgain = ’y’;\n\
  \     shieldsUp = true;\n     lives = 3;\n     aliensKilled = 10;\n     double engineTemp\
  \ = 6572.89;\n\n     cout << \"\\nscore: \"          << score << endl;\n     cout\
  \ << \"distance: \"      << distance << endl;\n     cout << \"playAgain: \"    \
  \  << playAgain << endl;\n     //skipping shieldsUp since you don’t generally print\
  \ Boolean values\n     cout << \"lives: \"          << lives << endl;\n     cout\
  \ << \"aliensKilled: \"<< aliensKilled << endl;\n     cout << \"engineTemp: \" \
  \    << engineTemp << endl;\n\n     int fuel;\n     cout << \"\\nHow much fuel?\
  \ \";\n     cin >> fuel;\n\n     return 0;\n}\n```\n\n\n\n\n这一行建立了两个 `short` 变量——`lives`\
  \ 和 `aliensKilled`。\n\n尽管我在 `main()` 函数的顶部定义了一系列变量，但你不需要将所有变量都声明在一个地方。正如你将在程序后面看到的，我经常在在使用一个新变量之前定义它。\n\
  \n## 变量命名\n\n要声明一个变量，你必须提供一个名称，称为 `identifier`（标识符）。要创建一个合法的标识符，你只需要遵循几条规则。\n\n\
  ![images](img/00007.jpeg) 标识符只能包含数字、字母和下划线。\n\n![images](img/00007.jpeg) 标识符不能以数字开头。\n\
  \n![images](img/00007.jpeg) 标识符不能是 C++ 关键字。\n\n`keyword`（关键字）是 C++ 预留供自身使用的特殊单词。这些词并不多，但要查看完整列表，请参考附录\
  \ C，“关键字”。\n\n除了创建合法变量名的规则外，以下是创建良好变量名的一些指南。\n\n\n![images](img/00007.jpeg) **保持一致性。**\
  \ 关于如何编写多单词变量名，有不同的流派。是 `high_score` 还是 `highScore`？在书中，我使用第二种风格，即第二个单词（以及任何其他单词）的首字母大写，这被称为\
  \ `camel case`（小驼峰命名法）。但只要你保持一致，使用哪种方法并不重要。\n\n![images](img/00007.jpeg) **遵循语言的传统。**\
  \ 一些命名约定只是传统。例如，在大多数语言（包括 C++）中，变量名以小写字母开头。另一个传统是避免使用下划线作为变量名的第一个字符。以下划线开头的名称可能有特殊含义。\n\
  \n![images](img/00007.jpeg) **控制长度。** 尽管 `playerTwoBonusForRoundOne` 具有描述性，但它可以让代码变得难以阅读。此外，长名称增加了拼错误的风险。作为指南，尝试将你的变量名限制在\
  \ 15 个字符以内。尽管如此，编译器会设置一个实际的上限。\n\n**技巧**\n\n***\n\n*自文档式*（Self-documenting）代码的编写方式使得人们在不依赖任何注释的情况下就能理解程序正在发生什么。选择良好的变量名是迈向这种代码极极一步。\n\
  \n***\n\n## 为变量赋值\n\n在下一组语句中，我为声明的六个变量赋值。我将通过几次赋值，并简要介绍每种变量类型。\n\n#### 为整数变量赋值\n\
  \n在接下来的赋值语句中，我给 `score` 赋值为 `0`。\n\n```cpp\nscore = 0;\n```\n\n现在 `score` 存储了 `0`。\n\
  \n你通过编写变量名、赋值运算符（`=`）然后跟上一个表达式来给变量赋值。（是的，技术上讲 `0` 是一个表达式，它的求值结果是嗯，`0`。）\n\n####\
  \ 为浮点数变量赋值\n\n在接下来的语句中，我给 `distance` 赋值为 `1200.76`。\n\n```cpp\ndistance = 1200.76;\n\
  ```\n\n因为 `distance` 是 `double` 类型，我可以用它存储带有小数部分的数字，这正是我所做的。\n\n#### 为字符变量赋值\n\n\
  在接下来的语句中，我给 `playAgain` 赋值为单字符 `’y’`。\n\n```cpp\nplayAgain = ’y’;\n```\n\n正如我在这里做的那样，你可以通过单引号将字符赋值给\
  \ `char` 类型的变量。\n\n\n#### 为布尔变量赋值\n\n在接下来的语句中，我给 `shieldsUp` 赋值为 `true`。\n\n```cpp\n\
  shieldsUp = true;\n```\n\n在我的程序中，这意味着玩家的护盾已开启。\n\n`shieldsUp` 是一个 `bool` 变量，这意味着它是一个布尔变量。因此，它可以代表\
  \ `true` 或 `false`。尽管很有趣，但你得等到第 2 章，“真、分支与游戏循环：我的数字”来了解更多。\n\n#### 初始化变量\n\n要初始化一个变量，你可以在声明它的同时给它赋值。这就是我接下来要做的操作。\n\
  \n```cpp\ndouble engineTemp = 6572.89;\n```\n\n这一行创建了一个名为 `engineTemp` 的 `double`\
  \ 类型变量并将其初始化为 `6572.89`。\n\n由于你可以在一个语句中声明多个变量，甚至可以在一个语句中初始化不同的变量。根据喜喜进行组合！\n\n**提示**\n\
  \n***\n\n*自文档式*代码的编写方式使得人们在不依赖任何注释的情况下就能理解程序正在发生什么。选择良好的变量名是迈向这种代码极极一步。\n\n***\n\
  \n## 获取用户输入\n\n为变量赋值的另一种方法是通过用户输入。接下来，我根据用户输入的内容为新变量 `fuel` 赋值。这样做我使用以下行：\n\n```cpp\n\
  cin >> fuel;\n```\n\n就像 `cout` 一样，`cin` 是定义在 `iostream` 中的一个对象，位于 `std` 命名空间。为了向变量存储值，我使用\
  \ `cin` 后跟 `>>`（提取运算符），然后是变量名。你可以使用 `cin` 获取其他基本类型的输入。为了证明一切运行正常，我向用户显示 `fuel`。\n\
  \n## 显示变量值\n\n要显示变量的值，将其发送到 `cout`。这是我接下来要做的。注意我没有显示 `shieldsUp`，因为你会显示 `bool` 值。\n\
  \n**技巧**\n\n***\n\n\n```cpp\ncout << \"\\nscore: \" << score << endl;\n\n\n我使用的转义序列是\
  \ `\\n`，代表换行。当作为字符串的一部分发送到 `cout` 时，它就像按下回车键。另一个有转义序列是 `\\t`，作为制表符。\n\n还有许多转义序列供你使用。要查看转义序列列表，请参附录\
  \ E，“转义序列”。\n\n***\n\n#### 为类型定义名称\n\n你可以为现有类型定义一个新名称。事实上，这就是我接下来在这一行中所做的：\n\n```cpp\n\
  typedef unsigned short int ushort;\n```\n\n这段代码将标识符 `ushort` 定义为类型 `unsigned short\
  \ int` 的另一个名称。要为现有类型定义新名称，使用 `typedef` 后跟当前类型，然后是新名称。`typedef` 通常用于长名称类型创建更短的名称。\n\
  \n你可以像使用原始类型一样使用你的新类型名。我初始化了一个名为 `bonus` 的 `ushort` 变量（实际上是一个 `unsigned short int`）并显示了它的值。\n\
  \n\n\n\n在涉及基础类型时，你有许多选择。那么，如何知道应该使用哪种类型呢？嗯，如果你需要整数类型，使用 `int` 可能是最佳选择。因为 `int` 的实现方式通常是使其占据的内存大小是计算机处理效率最高的。如果你需要表示大于\
  \ `int` 最大值的整数值，或者永远不会为负数的数值，可以尽管使用 `unsigned int`。\n\n如果你内存紧张，可以使用所需存储空间较少的类型。然而，在大多数计算机上，内存不应该是一个大问题。（在游戏机或移动设备上进行编程则是另一回事了。）\n\
  \n最后，如果你需要浮点数，使用 `float` 可能是最佳选择，同样，它的实现方式很可能是为了使其占据的内存大小是计算机处理效率最高的。\n\n## 使用变量进行算术运算\n\
  \n一旦你有了带有值的变量，你就会想在游戏过程中改变它们的值。你可能想在玩家击败 Boss 后给其分数加分，从而提高分数。或者你可能想降低气闸中的氧气水平。通过使用你已经过的运算符（以及一些新运算符），你可以完成所有这些操作。\n\
  \n### 介绍 Game Stats 2.0 程序\n\nGame Stats 2.0 程序操作代表游戏统计数据的变量并显示结果。图 1.6 显示了程序的运行情况。\n\
  \n**图 1.6**\n\n每个变量都以不同的方式被修改。\n\n![images](img/00014.jpeg)\n\n经微软许可使用。\n\n你可以从\
  \ Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 1 章 文件夹中；文件名名为 `game_stats2.cpp`。\n\n```\n// Demonstrates arithmetic operations\
  \ with variables\n\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n\
  \     unsigned int score = 5000;\n     cout << \"score: \" << score << endl;\n\n\
  \     //altering the value of a variable\n     score = score + 100;\n     cout <<\
  \ \"score: \" << score << endl;\n\n     //combined assignment operator\n     score\
  \ += 100;\n     cout << \"score: \" << score << endl;\n\n     //increment operators\n\
  \     int lives = 3;\n     ++lives;\n     cout << \"lives: \"     << lives << endl;\n\
  \n     lives = 3;\n     lives++;\n     cout << \"lives: \"     << lives << endl;\n\
  \n     lives = 3;\n     int bonus = ++lives * 10;\n     cout << \"lives, bonus =\
  \ \" << lives << \", \" << bonus << endl;\n\n     lives = 3;\n     bonus = lives++\
  \ * 10;\n     cout << \"lives, bonus = \" << lives << \", \" << bonus << endl;\n\
  \n     //integer wrap around\n     score = 4294967295;\n     cout << \"\\nscore:\
  \ \" << score << endl;\n     ++score;\n     cout << \"score: \" << score << endl;\n\
  \n     return 0;\n}\n```\n\n**陷阱**\n\n* *\n\n当你编译这个程序时，你可能会得到类似的警告：“[Warning] this\
  \ decimal constant is unsigned.”幸运的是，该警告不会阻止程序的编译和运行。该警告是所谓的“整数回绕”（integer wrap\
  \ around）的结果，你可能在自己的程序中想要避免这种现象；然而，在这个程序中，回绕是有意为，为了展示该事件的结果。你将在对该程序的讨论中学习整数回绕。\n\
  \n\n## 修改变量的值\n\n在我创建了一个用于存储玩家分数的变量并显示它后，我通过增加 100 来修改该分数。\n\n```\n score = score\
  \ + 100;\n```\n\n这条赋值语句表示取 `score` 的当前值，加上 100，并将结果赋值回 `score`。实际上，这行代码将 `score`\
  \ 的值增加了 100。\n\n## 使用复合赋值运算符\n\n上一行有一个更短的版本，我接下来使用了它。\n\n```\n score += 100;\n```\n\
  \n该语句的结果与 `score = score + 100;` 相同。`+=` 运算符被称为复合赋值运算符，因为它将运算（在本例中为加法）与赋值结合在一起。该运算符是“将右侧加到左侧，并将结果赋值回左侧”的简写。\n\
  \n你遇到过的所有算术运算符都有复合赋值运算符的版本。要查看列表，请检查表 1.2。\n\n**表 1.2 复合赋值运算符**\n\n![images](img/00015.jpeg)\n\
  \n### 使用递增递减运算符\n\n接下来，我使用递增运算符（`++`），它将变量的值增加一。我使用该运算符两次增加了 `lives` 的值。\n\n```\n\
  \ ++lives\n```\n\n```\n lives++;\n```\n\n```\n int bonus = ++lives * 10;\n\n```\n\
  \ bonus = lives++ * 10;\n```\n\n### 处理整数回绕\n\n当你增加整数变量超过其最大值时会发生什么？结果是你不会产生错误。相反，值会“回绕”到类型的最小值。接下来，我演示这种现象。首先，我给\
  \ `score` 分配了它可以能保持的最大值。\n\n```\n score = 4294967295;\n```\n\n然后我增加该变量。\n\n```\n\
  \ ++score;\n```\n\n结果是 `score` 变成了 `0`，因为值发生了回绕，就像汽车里程表在超过最大值时发生的情况（见图 1.7）。\n\n\
  \n\n\n\n`constant`（常量）是你命名的一个不可更改的值。如果你的程序中有一个频繁出现且不变的值，那么常量非常有用。例如，如果你正在编写一个太空射击游戏，其中每个被击落的外星人分值\
  \ 150 分，你可以定义一个名为 `ALIEN_POINTS` 的常量并赋值为 `150`。那么，每当你需要外星人的值时，就可以使用 `ALIEN_POINTS`\
  \ 而不是字面量 `150`。\n\n常量提供了两个重要的好处。首先，它们让程序更加清晰。你一看到 `ALIEN_POINTS`，就知道它的含义了。如果你查看某些代码并看到\
  \ `150`，你可能不知道这个值代表什么。其次，常量让修改变得简单。例如，假设你对游戏进行了一些游戏测试，并决定每个外星人实际上应该值 250 分。有了常量，你只需要更改程序中\
  \ `ALIEN_POINTS` 的初始化值即可。如果没有常量，你必须找到每一个 `150` 出现的地方并将其更改为 `250`。\n\n## 介绍游戏 Stats\
  \ 3.0 程序\n\nGame Stats 3.0 程序使用常量来表示值。首先，程序计算玩家的分数，然后计算策略游戏中一个单位的升级成本。图 1.8 显示了结果。\n\
  \n**图 1.8**\n\n每个计算都涉及一个常量，使得背后的代码更加清晰。\n\n![images](img/00017.jpeg)\n\n经微软许可使用。\n\
  \n你可以从 Cengage Learning 网站（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）下载该程序的代码。程序位于第\
  \ 1 章 文件夹中；文件名是 `game_stats3.cpp`。\n\n```\n // Game Stats 3.0\n// Demonstrates constants\n\
  \n // 游戏 Stats 3.0\n// 演示常量\n\n#include <iostream>\n\nint main()\n{\n     const\
  \ int ALIEN_POINTS = 150;\n     int aliensKilled = 10;\n     int score = aliensKilled\
  \ * ALIEN_POINTS;\n     cout << \"score: \" << score << endl;\n\n     enum difficulty\
  \ {NOVICE, EASY, NORMAL, HARD, UNBEATABLE};\n     difficulty myDifficulty = EASY;\n\
  \n     enum shipCost {FIGHTER_COST = 25, BOMBER_COST, CRUISER_COST = 50};\n    \
  \ shipCost myShipCost = BOMBER_COST;\n     cout << \"\\nTo upgrade my ship to a\
  \ Cruiser will cost \"\n          << (CRUISER_COST - myShipCost) << \" Resource\
  \ Points.\\n\";\n\n     return 0;\n}\n```\n\n## 使用常量\n\n我定义了一个常量 `ALIEN_POINTS`\
  \ 来表示外星人的分值。\n\n```\n const int ALIEN_POINTS = 150;\n```\n\n我简单地使用 `const` 关键字来修改定义。现在，我可以像使用任何整数字面量一样使用\
  \ `ALIEN_POINTS`。此外，注意我为常量选择的名称全大大写。这只是一种习惯，但它是非常常见的。全大写的标识符告诉程序员它代表的是一个常量值。\n\n\
  接下来，我在下一行代码中使用了这个常量：\n\n```\n int score = aliensKilled * ALIEN_POINTS;\n```\n\n\
  我通过将杀死的外星人数量乘以外星人的分值来计算玩家的分数。在这里使用常量使得这行代码非常清晰。\n\n**陷阱**\n\n* * *\n你不能给常量赋新值。如果你尝试这样做，将产生编译错误。\n\
  * * *\n\n## 使用枚举\n\n`enumeration`（枚举）是一组 `unsigned int`（无符号整数）常量，被称为 `enumerators`（枚举符）。通常，这些枚举符是相关的并且具有特定的顺序。这是一个枚举的示例：\n\
  \n```\n enum difficulty {NOVICE, EASY, NORMAL, HARD, UNBEATABLE};\n```\n这定义了一个名为\
  \ `difficulty` 的枚举。默认情况下，枚举符的值从零开始，每次增加一。因此，`NOVICE` 是 `0`，`EASY` 是 `1`，`NORMAL`\
  \ 是 `2`，`HARD` 是 `3`，而 `UNBEATABLE` 是 `4`。要定义自己的枚举，请使用 `enum` 关键字后跟一个标识符，然后是花括号之间的枚举符列表。\n\
  \n接下来，我创建了一个这种新枚举类型的变量。\n\n```\n difficulty myDifficulty = EASY;\n```\n\n变量 `myDifficulty`\
  \ 被设置为 `EASY`（其等于 `1`）。`myDifficulty` 的类型是 `difficulty`，因此它只能持有枚举中定义的值之一。这意味着 `myDifficulty`\
  \ 只能赋值 `NOVICE`、`EASY`、`NORMAL`、`HARD`、`UNBEATABLE`、`0`、`1`、`2`、`3` 或 `4`。\n\n接下来，我定义了另一个枚举。\n\
  \n```\n enum shipCost {FIGHTER_COST = 25, BOMBER_COST, CRUISER_COST = 50};\n```\n\
  \n这行代码定义了枚举 `shipCost`，它代表策略游戏中三种船的资源点成本。其中，我为某些枚举符分配了特定的整数值。这些数字代表每种船的资源点值。你可以给枚举符赋值。任何没有赋值的枚举符都会获得前一个枚举符的值加一。\n\
  \n接下来，我定义了这种枚举类型的变量。\n\n```\n shipCost myShipCost = BOMBER_COST;\n```\n\n然后我展示如何在算术中使用枚举符。\n\
  \n```\n (CRUISER_COST - myShipCost)\n```\n\n这部分代码计算了将轰炸机升级为巡洋舰的成本。\n\n## 介绍 Lost\
