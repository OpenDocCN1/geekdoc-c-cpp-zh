  \n## 第 3 章\n\n### FOR 循环、字符串和数组：单词拼字\n\n你已经学习了如何处理单个值，但在本章中，你将学习如何处理数据序列。你将学习更多关于字符串——用于字符序列的对象的。你还将看到如何处理任何类型的序列。而且，你将发现一种非常适用于这些序列的新类型循环。具体来说，你将学习：\n\
  \n- ![images](img/00007.jpeg) 使用 `for` 循环遍历序列\n- ![images](img/00007.jpeg) 使用结合数据和函数的对象\n\
  - ![images](img/00007.jpeg) 使用 `string` 对象及其成员函数处理字符序列\n- ![images](img/00007.jpeg)\
  \ 使用数组存储、访问和操作任何类型的序列\n- ![images](img/00007.jpeg) 使用多维数组更好地表示某些数据集合\n\n### 使用 FOR\
  \ 循环\n\n你在第 2 章“真值、分支与游戏循环：猜数字”中遇到过一种循环——`while` 循环。现在，是时候认识另一种了——`for` 循环。和它的表兄弟\
  \ `while` 循环一样，`for` 循环允许重复一段代码，但 `for` 循环特别适用于计数和遍历序列（例如 RPG 角色背包中的物品）。\n\n以下是\
  \ `for` 循环的通用形式：\n\n```\n for (initialization; test; action)\n     statement;\n\
  ```\n\n`initialization` 是一个为循环设置某些初始条件的语句。（例如，它可能将计数器变量设置为 0。）表达式 `test` 在每次执行循环体之前之前都会进行测试，就像在\
  \ `while` 循环中一样。如果 `test` 为 `false`，程序将移动到循环后的语句。如果 `test` 为 `true`，程序执行 `statement`。接下来，执行\
  \ `action`（这通常涉及增加计数器变量）。该循环重复，直到 `test` 为 `false`，此时循环结束。\n\n#### 引入计数器程序\n\n计数器程序可以正向、反向和五五计数。它甚至可以数出一个行和列的网格。它使用\
  \ `for` 循环实现了这一切。图 3.1 显示了程序的运行情况。\n\n**图 3.1**\n\n`for` 循环负责所有的计数，而一对嵌套的 `for`\
  \ 循环显示了网格。\n\n![images](img/00039.jpeg)\n\n经微软许可。\n\n你可以从 Cengage Learning 网站 ([www.cengageptr.com/downloads](http://www.cengageptr.com/downloads))\
  \ 下载该程序的代码。程序位于第 3 章文件夹中；文件名为 `counter.cpp`。\n\n```cpp\n // Counter\n// Demonstrates\
  \ for loops\n\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    cout\
  \ << \"Counting forward:\\n\";\n    for (int i = 0; i < 10; ++i)\n    {\n      \
  \  cout << i << \" \";\n    }\n\n    cout << \"\\n\\nCounting backward:\\n\";\n\
  \    for (int i = 9; i >= 0; --i)\n    {\n        cout << i << \" \";\n    }\n\n\
  \    cout << \"\\n\\nCounting by fives:\\n\";\n    for (int i = 0; i <= 50; i +=\
  \ 5)\n    {\n        cout << i << \" \";\n    }\n\n    cout << \"\\n\\nCounting\
  \ with null statements:\\n\";\n    int count = 0;\n    for ( ; count < 10; )\n \
  \   {\n        cout << count << \" \";\n        ++count;\n    }\n\n    cout << \"\
  \\n\\nCounting with nested for loops:\\n\";\n    const int ROWS = 5;\n    const\
  \ int COLUMNS = 3;\n    for (int i = 0; i < ROWS; ++i)\n    {\n        for (int\
  \ j = 0; j < COLUMNS; ++j)\n        {\n            cout << i << \",\" << j << \"\
  \ \";\n        }\n\n        cout << endl;\n    }\n\n    return 0;\n}\n```\n\n**陷阱**\n\
  \n* *\n\n\n## 在 for 循环中使用空语句\n\n你可以在创建 `for` 循环在使用空语句，就像我在下面的循环中所做的那样：\n\n```cpp\n\
  \ for ( ; count < 10; )\n```\n\n初始化和动作语句使用了空语句。这是可以的，因为我在循环之前声明并初始化了 `count`，并在循环体内部对其进行了增加。这个循环显示的整数序列与程序中的第一个循环相同。虽然这个循环看起来可能很奇怪，但它是完全合法的。\n\
  \n## 嵌套 for 循环\n\n你可以通过将一个 `for` 循环放在另一个内部来嵌套循环。这就是我在下面的代码段中所做的，它数出了网格的元素。外层循环开始：\n\
  \n```cpp\n for (int i = 0; i < ROWS; ++i)\n```\n\n仅仅执行其循环体 `ROWS`（五）次。但恰好在这个循环内部还有另一个\
  \ `for` 循环，它开始：\n\n```cpp\n for (int j = 0; j < COLUMNS; ++j)\n```\n\n\n\n\n结果是内层循环在外层循环的每次迭代中完整执行。在这种情况下，这意味着内层循环执行了\
  \ `COLUMNS`（三次），而外层循环迭代了 `ROWS`（五次），总共执行了 15 次。具体而言，过程如下：\n\n1. 外层 `for` 循环声明了 `i`\
  \ 并将其初始化为 0。由于 `i` 小于 `ROWS` (5)，程序进入外层循环体。\n2. 内层循环声明了 `j` 并将其初始化为 0。由于 `j` 小于\
  \ `COLUMNS` (3)，程序进入循环体，将 `i` 和 `j` 的值发送给 `cout`，显示 0, 0。\n3. 程序到达内层循环体的末尾并将 `j`\
  \ 递增到 1。由于 `j` 仍然小于 `COLUMNS` (3)，程序再次执行内层循环体，显示 0, 1。\n4. 程序到达内层循环体的末尾并将 `j` 递增到\
  \ 2。由于 `j` 仍然小于 `COLUMNS` (3)，程序再次执行内层循环体，显示 0, 2。\n5. 程序到达内层循环体的末尾并将 `j` 递增到 3。此时，`j`\
  \ 不小于 `COLUMNS` (3)，内层循环结束。\n6. 程序通过向 `cout` 发送 `endl` 完成外层循环的第一次迭代，结束第一行。\n7. 程序到达外层循环体的末尾并将\
  \ `i` 递增到 1。由于 `i` 小于 `ROWS` (5)，程序再次进入外层循环体。\n8. 程序到达内层循环，通过声明并初始化 `j` 为 0 再次从开始运行。经过步骤\
  \ 2 到步骤 7 中描述的过程，显示网格的第二行。此过程持续直到所有五行都显示完毕。\n\n再次，需要记得重点是：内层循环在外层循环的每次迭代中都会完整执行。\n\
  \n## 理解对象\n\n到为止，你已经看到了如何在变量中存储单个信息，以及如何使用操作符和函数来操作这些变量。但你在游戏中想要表示的大多数事物——例如，外星飞器——都是对象。它们是封装的、内聚的实体，结合了属性（如能量水平）和能力（例如发射武器）。通常，孤立地讨论各个属性和能力是没有意义的。\n\
  \n幸运的是，大多数现代编程语言允许你处理结合了数据和函数的软件对象（通常直接称为 `objects`）。对象的数元素被称为 `data member`（数据成员），对象的函数被称为\
  \ `member function`（成员函数）。作为一个具体的例子，考虑一下那艘外星飞器。一个外星飞器对象可能是一个由游戏程序员定义的名为 `Spacecraft`\
  \ 的新类型，它可能有一个用于能量水平的数据成员，以及一个用于发射武器的成员函数。在实践中，对象的能量水平可能存储在数据成员 `energy` 中，类型为 `int`，而其发射武器的能力定义在一个名为\
  \ `fireWeapons()` 的成员函数中。\n\n相同类型的对象具有相同的基本结构，因此每个对象将具有相同的一组数据成员和成员函数。然而，作为个体，每个对象的数据成员都有其自己的值。如果你有一支由五架外星飞器组成的机队，每只都有自己的能量水平。其中一架的能量可能是\
  \ 75，而另一架可能只有 10，依此类推。即使两架飞器的能量水平相同，每架也属于一个独特的飞器。每架飞器还可以通过调用其成员函数 `fireWeapons()`\
  \ 来发射自己的武器。图 3.2 描述了外星飞器的概念。\n\n**图 3.2**\n\n这种对外星飞器定义的表示说明，每个对象将有一个名为 `energy`\
  \ 的数据成员和一个名为 `fireWeapons()` 的成员函数。\n\n![images](img/00040.jpeg)\n\n对象的酷之处在于，你不需要知道实现细节就可以使用它们——就像你不需要知道如何制造汽车就能驾驶它一样。你只需要知道对象的数据成员和成员函数——就像只需要知道汽车方向盘、油门和刹车的位置一样。\n\
  \n你可以像处理内置类型一样将对象存储在变量中。因此，你可以将一个外星飞器对象存储在 `Spacecraft` 类型的变量中。你可以使用成员选择操作符（`.`）来访问数据成员和成员函数，只需将操作符放在对象的变量名之后。因此，如果你想让外星飞器\
  \ `ship` 只在能量水平大于 `10` 时发射武器，你可以写道：\n\n```cpp\n // ship 是 Spacecraft 类型的对象\n if\
  \ (ship.energy > 10) {\n     ship.fireWeapons();\n }\n```\n\n对象的能量水平可能存储在数据成员 `energy`\
  \ 中，类型为 `int`，而其发射武器的能力定义在一个名为 `fireWeapons()` 的成员函数中。\n\n### 使用对象\n\n`string` 对象是处理字符序列的完美方式。变量和\
  \ I/O 可以通过操作符和函数进行操作。因此，你可以将外星飞器对象存储在 `Spacecraft` 类型变量中。你可以使用成员选择操作符（`.`）来访问数据成员和成员函数，只需将操作符放在对象的变量名之后。所以如果你想让外星飞器\
  \ `ship` 只在能量水平大于 `10` 时发射武器，你可以写道：\n\n```cpp\n // ship 是 Spacecraft 类型的对象\n if\
  \ (ship.energy > 10) {\n     ship.fireWeapons();\n }\n```\n\n#### 测试程序\n\nString\
  \ Tester 程序使用了 `string` 对象。\n\n```cpp\n // String Tester\n// 演示 string 对象\n\n#include\
  \ <iostream>\n#include <string>\n\nusing namespace std;\n\nint main()\n{\n    string\
  \ word1 = \"Game\";\n    string word2(\"Over\");\n    string word3(3, '!');\n\n\
  \    string phrase = word1 + \" \" + word2 + word3;\n    cout << \"The phrase is:\
  \ \" << phrase << \"\\n\\n\";\n\n    cout << \"The phrase has \" << phrase.size()\
  \ << \" characters in it.\\n\\n\";\n\n    cout << \"The character at position 0\
  \ is: \" << phrase[0] << \"\\n\\n\";\n\n    cout << \"Changing the character at\
  \ position 0.\\n\";\n    phrase[0] = 'L';\n    cout << \"The phrase is now: \" <<\
  \ phrase << \"\\n\\n\";\n\n    for (unsigned int i = 0; i < phrase.size(); ++i)\n\
  \    {\n        cout << \"Character at position \" << i << \" is: \" << phrase[i]\
  \ << endl;\n    }\n\n    cout << \"\\nThe sequence ‘Over’ begins at location \"\
  ;\n    cout << phrase.find(\"Over\") << endl;\n\n    if (phrase.find(\"eggplant\"\
  ) == string::npos)\n    {\n        cout << \"’eggplant’ is not in the phrase.\\\
  n\\n\";\n    }\n\n    phrase.erase(4, 5);\n    cout << \"The phrase is now: \" <<\
  \ phrase << endl;\n\n    phrase.erase(4);\n    cout << \"The phrase is now: \" <<\
  \ phrase << endl;\n\n    phrase.erase();\n    cout << \"The phrase is now: \" <<\
  \ phrase << endl;\n\n    if (phrase.empty())\n    {\n        cout << \"\\nThe phrase\
  \ is no more.\\n\";\n    }\n\n    return 0;\n}\n```\n\n\n\n\n## 创建字符串对象\n\n我在 `main()`\
  \ 函数中执行的第一件事是以三种不同的方式创建三个字符串：\n\n```\n string word1 = \"Game\";\n   string word2(\"\
  Over\");\n   string word3(3, ’!’);\n```\n\n在这一组的第一行中，我使用赋值运算符按照你之前为其他变量创建的方式创建了\
  \ `string` 对象 `word1`。结果是 `word1` 为 `\"Game\"`。\n\n接下来，我通过将想要赋值给变量的 `string` 对象放在括号之间来创建\
  \ `word2`。结果是 `word2` 为 `\"Over\"`。\n\n最后，我通过在括号内提供一个数字后跟一个字符来创建了 `word3`。这产生了一个由提供的字符组成的\
  \ `string` 对象，其长度等于该数字。结果是 `word3` 为 `\"!!!\"`。\n\n# 拼接字符串对象\n\n接下来，我通过拼接前三个 `string`\
  \ 对象创建一个新的 `string` 对象 `phrase`：\n\n```\n string phrase = word1 + \" \" + word2\
  \ + word3;\n```\n\n结果是 `phrase` 为“Game Over!!!”。\n\n注意，你曾见过 `+` 运算符仅用于数字，但它也可以拼接\
  \ `string` 对象。这是因为 `+` 运算符被重载了。当你第一次听到“重载（overloaded）”这个词时，你可能会认为这是一件坏事——运算符要爆炸了！但实际上这是一件好事。运算符重载重新定义了熟悉的运算符，使其在新的上下文中工作方式不同。在这种情况下，我使用\
  \ `+` 运算符不是为了相加数字，而是为了连接 `string` 对象。之所以之所以这样做是因为 `string` 类型专门重载了 `+` 运算符，使其在用于字符串时表示连接。\n\
  \n# 使用 size() 成员函数\n\n好了，现在是查看 `string` 成员函数的时候。接下来，我使用 `size()` 成员函数：\n\n```\n\
  \ cout << \"The phrase has \" << phrase.size() << \" characters in it.\\n\";\n```\n\
  \n`phrase.size()` 通过运算符 `.` 调用 `phrase` 对象的成员函数。`size()` 成员函数返回 `string` 对象的无符号整数值。因为\
  \ `string` 对象是 `\"Game Over!!!\"`，成员函数返回 12。（每个字符都计数。）对于另一个 `string` 对象，调用 `size()`\
  \ 可能会根据 `string` 对象中的字符数量返回不同的结果。\n\n**提示**\n\n`string` 对象还有一个成员函数 `length()`，它和\
  \ `size()` 一样，返回 `string` 对象中的字符数量。\n\n# 字符串索引\n\n`string` 对象存储 `char` 值序列。我通过提供索引数字使用下标运算符\
  \ `[]`：\n\n```\n cout << \"The character at position 0 is: \" << phrase[0] << \"\
  \\n\";\n```\n\n序列中的第一个元素位于位置 0。在上述语句中，`phrase[0]` 是字符 G。由于计数从 0 开始，`string` 对象中的最后一个字符是\
  \ `phrase[11]`，尽管 `string` 对象有 12 个字符。\n\n**陷阱**\n\n忘记索引从 0 开始是一个常见的错误。记住，包含 `n`\
  \ 个字符的 `string` 对象可以从位置 0 索引到位置 `n−1`。你不仅可以使用下标运算符访问 `string` 对象中的字符，还可以重新赋值它们。这是我接下来要做的操作：\n\
  \n```\n phrase[0] = ’L’;\n```\n\n我将 `phrase` 的第一个字符改为 L，这意味着 `phrase` 变成了 `\"Lame\
  \ Over!!!\"。\n\n**陷阱**\n\nC++ 编译器在处理 `string` 对象和下标运算符时不会进行边界检查。这意味着编译器不会检查你是否尝试访问不存在的元素。访问无效的序列元素会导致灾难性的结果，因为可能会覆盖计算机内存中的关键数据。在使用下标运算符时要小心。\n\
  \n## 遍历字符串对象\n\n根据你对 `for` 循环和 `string` 对象的知识，遍历 `string` 对象的单个字符轻而易举。这是我接下来要做的操作：\n\
  \n```\n for (unsigned int i = 0; i < phrase.size(); ++i)\n   {\n       cout << \"\
  Character at position \" << i << \" is: \" << phrase[i] << endl;\n   }\n```\n\n\
  循环遍历了 `phrase` 的所有有效位置。它从 0 开始到 11。在每次迭代中，都会显示 `string` 对象的一个字符。\n\n`string` 对象还有一个成员函数\
  \ `length()`，它和 `size()` 一样返回 `string` 对象中的字符数量。\n\n# 使用 find() 成员函数\n\n接下来，我使用\
  \ `find()` 成员函数检查是否包含字符串字面量。首先，我检查字符串字面量：\n\n```\n cout << \"\\nThe sequence begins\
  \ at \";\n   cout << phrase.find(\"Over\") << endl;\n```\n\n`find()` 成员函数在调用的 `string`\
  \ 中搜索作为参数提供的字符串。它返回第一次出现的位置数。由于 `phrase` 是 `\"Lame Over!!!\"`，`find(\"Over\")` 返回\
  \ 5。\n\n但如果你搜索的字符串不存在怎么办？我接下来处理那种情况：\n\n```\n if (phrase.find(\"eggplant\") == string::npos)\n\
  \   {\n       cout << \"’eggplant’ is not in the phrase.\\n\";\n   }\n```\n\n因为\
  \ `\"eggplant\"` 不在 `phrase` 中，`find()` 返回 `string` 文件中定义的特殊常量，我通过 `string::npos`\
  \ 访问它。常量 `string::npos` 代表 `string` 对象最大可能的大小，因此它大于 `string` 对象中任何可能的位置号。非正式地说，它意味着“一个不存在的位置号”。它是指示未找到字符串的完美返回值。\n\
  \n**在使用 `find()` 时，你可以提供一个可选参数，指定程序开始查找子字符串的字符数。以下行将从 `string` 对象中的位置 5 开始查找字符串字面量\
  \ \"eggplant\"。**\n\n```\n location = phrase.find(\"eggplant\", 5);\n```\n\n# 使用\
  \ erase() 成员函数\n\n`erase()` 成员函数从 `string` 对象中删除指定的子字符串。调用成员函数的一种方法是指定起始位置和子字符串的长度，就像我在代码中所做：\n\
  \n```\n phrase.erase(4, 5);\n```\n\n上一行删除了从位置 4 开始的五个字符子字符串。因为 `phrase` 是 `\"Lame\
  \ Over!!!\"`，成员函数删除了子字符串 `Over`，结果 `phrase` 变成了 `\"Lame!!!\"`。\n\n另一种调用 `erase()`\
  \ 的方法是仅提供子字符串的起始位置。这将删除从该位置数字到 `string` 对象结束的所有字符。这是我接下来要做的操作：\n\n```\n phrase.erase(4);\n\
  ```\n\n\n\n\n这一行代码删除了 `string` 对象中从位置 4 开始的所有字符。由于 `phrase` 是 `\"Lame!!!\"`，该成员函数删除了子字符串\
  \ `!!!`，结果 `phrase` 变成了 `\"Lame\"`。\n\n调用 `erase()` 的另一种方法是不提供任何参数，就像我在代码中这样做的那样：\n\
  \n```\nphrase.erase();\n```\n\n上一行删除了 `phrase` 中的每个字符。结果 `phrase` 变成了空字符串，即等于 `\"\
  \"`。\n\n## 使用 `empty()` 成员函数\n\n`empty()` 成员函数返回一个 `bool` 值——如果 `string` 对象为空则返回\
  \ `true`，否则返回 `false`。我在以下代码中使用了 `empty()`：\n\n```\nif (phrase.empty())\n   {\n\
  \       cout << \"\\nThe phrase is no more.\\n\";\n   }\n```\n\n由于 `phrase` 等于空字符串，`phrase().empty`\
  \ 返回 `true`，屏幕显示消息：“The phrase is no more.”\n\n## 使用数组\n\n虽然 `string` 对象提供了处理字符序列的极佳方法，但数组提供了一种处理任何类型元素的方法。这意味着你可以使用数组来存储整数序列，例如高分列表。但这意味着你可以使用数组来存储程序员定义类型的元素，例如\
  \ RPG 角色可能携带的物品序列。\n\n### 介绍英雄背包程序\n\n“英雄背包”（Hero’s Inventory）程序维护一个典型 RPG 中英雄的背包。就像大多数\
  \ RPG 一样，英雄来自一个平凡而无不足道的村庄，他的父亲被一个邪恶的军阀杀害。（没有死掉的父亲哪算什么任务呢？）现在英雄已经成年了，是他时候去寻求复仇了。\n\
  \n在这个程序中，英雄的背包由一个数组表示。该数组是 `string` 对象的序列——英雄拥有的每个物品对应一个对象。英雄会进行交易，甚至发现新物品。图 3.4\
  \ 显示了程序的运行情况。\n\n**图 3.4**\n\n英雄的背包是存储在数组中的 `string` 对象序列。\n\n![images](img/00042.jpeg)\n\
  \n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于\
  \ 第 3 章 文件夹中；文件名为 `heros_inventory.cpp`。\n\n```\n// 英雄背包\n// 演示数组\n\n#include <iostream>\n\
  #include <string>\n\nusing namespace std;\n\nint main()\n{\n    const int MAX_ITEMS\
  \ = 10;\n    string inventory[MAX_ITEMS];\n\n    int numItems = 0;\n    inventory[numItems++]\
  \ = \"sword\";\n    inventory[numItems++] = \"armor\";\n    inventory[numItems++]\
  \ = \"shield\";\n\n    cout << \"Your items:\\n\";\n    for (int i = 0; i < numItems;\
  \ ++i)\n    {\n        cout << inventory[i] << endl;\n    }\n\n    cout << \"\\\
  nYou 用你的剑换了一把战斧.\";\n    inventory[0] = \"battle axe\";\n    cout << \"\\nYour items:\\\
  n\";\n    for (int i = 0; i < numItems; ++i)\n    {\n        cout << inventory[i]\
  \ << endl;\n    }\n\n    cout << \"\\n 物品名称 ’\" << inventory[0] << \"’ 有 \";\n \
  \   cout << inventory[0].size() << \" 个字母。\\n\";\n\n    cout << \"\\n 你发现了一瓶治疗药水.\"\
  ;\n    if (numItems < MAX_ITEMS)\n    {\n        inventory[numItems++] = \"healing\
  \ potion\";\n    }\n    else\n    {\n        cout << \"你有太多物品了，无法再携带另一个。\";\n  \
  \  }\n    cout << \"\\nYour items:\\n\";\n    for (int i = 0; i < numItems; ++i)\n\
  \    {\n        cout << inventory[i] << endl;\n    }\n\n    return 0;\n}\n```\n\n\
  ## 创建数组\n\n为数组元素数量定义一个常量通常是一个好主意。这就是我对 `MAX_ITEMS` 所做的，它代表了英雄可以携带的物品最大数量：\n\n```\n\
  const int MAX_ITEMS = 10;\n```\n\n声明数组的方式与你之前看到的任何变量相同：提供一个类型，后跟一个名称。此外，你的编译器必须知道数组的大小，以便预留必要的内存空间。你可以在数组名称后面用方括号括起来提供该信息。以下是我如何声明英雄背包数组的：\n\
  \n```\nstring inventory[MAX_ITEMS];\n```\n\n前面的代码声明了一个包含 `MAX_ITEMS` 个 `string`\
  \ 对象的数组 `inventory`。（因为 `MAX_ITEMS` 是 10，这意味着有 10 个 `string` 对象。）\n\n**技巧**\n\n\
  ***\n\n你可以在声明数组时通过提供 `initializer list`（初始化列表）来初始化值——这是一个用逗号分隔并用大括号括起来的元素序列。示例所示：\n\
  \n```\nstring inventory[MAX_ITEMS];\n```\n*(注：原文此处后存在大量重复的乱码文本，已根据要求保留核心逻辑并进行翻译。)*\n\
  \n\n\n\n在接下来的几行中，我使用 `MAX_ITEMS` 在向英雄背包中添加另一个物品之前保护我自己：\n\n```cpp\n if (numItems\
  \ < MAX_ITEMS)\n   {\n       inventory[numItems++] = \"healing potion\";\n   }\n\
  \   else\n   {\n       cout << \"You have too many items and can’t carry another.\"\
  ;\n   }\n```\n\n在前面的代码中，我首先检查了 `numItems` 是否小于 `MAX_ITEMS`。如果是，我就可以安全地使用 `numItems`\
  \ 作为索引，并将一个新的 `string` 对象赋值给数组。在这种情况下，`numItems` 的值为 3，因此我将字符串 `\"healing potion\"\
  ` 赋值给数组位置 3。如果情况不是如此，我就会显示消息：“你的物品太多了，无法再携带另一个。”\n\n那么，如果你尝试访问数组边界之外的数组元素时，会发生什么呢？这取决于情况，因为你正在访问计算机内存的某些未知部分。最坏的情况下，如果你尝试给数组边界之外的元素赋值某个值，可能会导致你的程序出现不可预测的行为，甚至可能导致崩溃。\n\
  \n在使用索引号之前通过测试确保它是有效的数组位置，这种操作被称为`边界检查`（bounds checking）。当你想要使用的索引可能无效时，执行边界检查至关重要。\n\
  \n## 理解 C 风格字符串\n\n在 `string` 对象出现之前，C++ 程序员用以空字符（null character）终止的字符数组来表示字符串。这些字符数组现在被称为\
  \ `C 风格字符串`（C-style strings），因为这种做法始于 C 语言。你可以像声明任何其他数组一样声明并初始化 C 风格字符串：\n\n```cpp\n\
  \ char phrase[] = \"Game Over!!!\";\n```\n\nC 风格字符串以一个名为`空字符`（null character）的字符终止，以表示它们的结束。你可以将空字符写为\
  \ `'\\0'`。在之前的代码中我不需要使用空字符，因为它已经为我存储在字符串的末尾了。所以从技术上讲，`phrase` 有 13 个元素。（然而，处理 C\
  \ 风格字符串的函数会说 `phrase` 的长度为 `12`，这是有合理的，并且符合 `string` 对象的工作方式。）\n\n与任何其他类型的数组一样，你可以在定义时指定数组的大小。因此，另一种声明和初始化\
  \ C 风格字符串的方法是\n\n```cpp\n char phrase[81] = \"Game Over!!!\";\n```\n\n之前的代码创建了一个\
  \ C 风格字符串，它可以容纳 80 个打印字符（加上它的终止空字符）。\n\nC 风格字符串没有成员函数。但作为标准库一部分的 `cstring` 文件包含了多种处理\
  \ C 风格字符串的函数。\n\n`string` 对象的一个很好点是，它们被设计为可以与 C 风格字符串无缝工作。例如，以下所有都是 `string` 对象配合\
  \ C 风格字符串的有效用法：\n\n```cpp\n string word1 = \"Game\";\nchar word2[] = \" Over\";\n\
  \nstring phrase = word1 + word2;\n\nif (word1 != word2)\n{\n    cout << \"word1\
  \ and word2 are not equal.\\n\";\n}\n\nif (phrase.find(word2) != string::npos)\n\
  {\n    cout << \"word2 is contained in phrase.\\n\";\n}\n```\n\n你可以拼接 `string` 对象和\
  \ C 风格字符串，但结果始终是一个 `string` 对象（因此代码 `char phrase2[] = word1 + word2;` 将产生错误）。你可以使用关系运算符比较\
  \ `string` 对象和 C 风格字符串。你甚至可以将 C 风格字符串作为 `string` 对象成员函数的参数。\n\nC 风格字符串具有与数组相同的缺点。最大的之一是它们的长度是固定的。所以教训是：尽可能使用\
  \ `string` 对象，但必要时要准备好 C 风格字符串。\n\n## 使用多维数组\n\n正如你所见的，序列对游戏非常有用。你可以以字符串的形式使用它们来存储玩家名字，也可以以任何数组的形式使用它们来存储\
  \ RPG 中的物品列表。但有时游戏的某部分需要比线性列表更复杂的内容。有时游戏的某部分字面意思需要更多维度。例如，虽然你可以用一个 64 元素的数组来表示棋盘，但将其作为一个\
  \ $8 \\times 8$ 元素的二维实体来处理实际上要直观得多。幸运的是，你可以创建一个二维或三维（甚至更多维度）的数组，以最符合你的游戏需求。\n\n\
  #### 介绍井棋盘程序\n\nTic-Tac-Toe Board 程序显示一个井棋盘。该程序显示棋盘并声明 X 为获胜者。虽然程序可以使用一维数组编写，但它使用二维数组来表示棋盘。图\
  \ 3.5 展示了该程序。\n\n**图 3.5**\n\n井棋盘由一个二维数组表示。\n\n![images](img/00043.jpeg)\n\n经许可使用。\n\
  \n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 3 章文件夹中；文件名是 `tic-toe.cpp`。\n\n```cpp\n // Tic-Toe Board\n// Demonstrates multidimensional\
  \ arrays\n\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n     const\
  \ int ROWS = 3;\n     const int COLUMNS = 3;\n     char board[ROWS][COLUMNS] = {’O’,\
  \ ’X’, ’O’},\n                                 {’’, ’X’, ’X’},\n               \
  \                  {’X’, ’O’, ’O’} };\n     cout << \"Here’s the tic-toe board:\\\
  n\";\n     for (int i = 0; i < ROWS; ++i)\n     {\n        for (int j = 0; j < COLUMNS;\
  \ ++j)\n        {\n            cout << board[i][j];\n        }\n\n        cout <<\
  \ endl;\n     }\n     cout << \"\\n’X’ moves to the empty location.\\n\";\n    \
  \ board[1][0] = ’X’;\n\n     cout << \"Now the tic-toe board is:\\n\";\n     for\
  \ (int i = 0; i < ROWS; ++i)\n     {\n         for (int j = 0; j < COLUMNS; ++j)\n\
  \         {\n             cout << board[i][j];\n         }\n\n         cout << endl;\n\
  \     }\n     cout << \"\\n’X’ wins!\";\n     return 0;\n}\n```\n\n### 创建多维数组\n\n\
  我在程序中做的第一件事之一是声明并初始化用于棋盘的数组。\n\n```cpp\n char board[ROWS][COLUMNS] = {’O’, ’X’,\
  \ ’O’},\n                                 {’’, ’X’, ’X’},\n                    \
  \             {’X’, ’O’, ’O’} };\n```\n\n之前的代码声明了一个 $3 \\times 3$（因为 `ROWS` 和 `COLUMNS`\
