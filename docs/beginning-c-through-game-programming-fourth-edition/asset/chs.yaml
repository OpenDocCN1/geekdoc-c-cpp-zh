  \ 使用 `while` 和 `do` 循环重复代码段\n* ![images](img/00007.jpeg) 生成随机数\n\n### 理解真值\n\n真是非黑即白的，至少从\
  \ C++ 的角度来看如此。你可以使用相应的关键字 `true` 和 `false` 来表示 `true` 和 `false`。你可以使用 `bool` 变量来存储此类布尔值，正如你在第\
  \ 1 章“类型、变量和标准 I/O：丢失的财富”中所看到的。这里有一个快速复习：\n\n```cpp\n bool fact = true, fiction\
  \ = false;\n```\n\n这段代码创建了两个 `bool` 变量 `fact` 和 `fiction`。`fact` 是 `true`，`fiction`\
  \ 是 `false`。虽然关键字 `true` 和 `false` 很好用，但任何表达式或值也可以被解释为 `true` 或 `false`。任何非零值都可以被解释为\
  \ `true`，而 0 可以被解释为 `false`。\n\n被解释为真或假的常见表达式类型涉及比较内容。比较通常通过内置的关系运算符来完成。表 2.1 列出了这些运算符和一些示例表达式。\n\
  \n**表 2.1 关系运算符**\n\n![images](img/00019.jpeg)\n\n## 使用 if 语句\n\n好了，是时候把真和假的概念投入实践中了。你可以使用\
  \ `if` 语句来测试表达式的真假，并根据结果执行某些代码。以下是 `if` 语句的一种简单形式：\n\n```cpp\n if (expression)\n\
  \    statement;\n```\n\n如果 `expression` 为 `true`，则执行 `statement`。否则，跳过 `statement`，程序将跳转到\
  \ `if` 语句块之后的语句。\n\n**提示**\n\n\n* 每当你看到像前面代码示例那样的通用 `statement` 时，你都可以将其替换为单个语句或语句块，因为语句块被视为一个单一单元。\n\
  \n* * *\n\n#### 引入评分器程序\n\n评分器程序使用 `if` 语句对玩家的分数进行评价。图 2.1 显示了程序的运行情况。\n\n**图 2.1**\n\
  \n消息根据不同的 `if` 语句显示（或不显示）。\n\n![images](img/00020.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage\
  \ Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 2 章 文件夹中；文件名名为 `score_rater.cpp`。\n\n```cpp\n // Score Rater\n// Demonstrates\
  \ the if statement\n\n#include <iostream>\nusing namespace std;\n\nint main()\n\
  {\n    if (true)\n    {\n        cout << \"This is always displayed.\\n\\n\";\n\
  \    }\n\n    if (false)\n    {\n\n        cout << \"This is never displayed.\\\
  n\\n\";\n    }\n\n    int score = 1000;\n\n    if (score)\n    {\n        cout <<\
  \ \"At least you didn’t score zero.\\n\\n\";\n    }\n\n    if (score >= 250)\n \
  \   {\n        cout << \"You scored 250 or more. Decent.\\n\\n\";\n    }\n\n   \
  \ {\n        cout << \"You scored 500 or more. Nice.\\n\\n\";\n        if (score\
  \ >= 1000)\n        {\n            cout << \"You scored 1000 or more. Impressive!\\\
  n\";\n        }\n    }\n\n    return 0;\n}\n```\n\n#### 测试 true 和 false\n\n在第一个\
  \ `if` 语句中我测试了 `true`。因为 `true` 确实为真，程序显示了消息“This is always displayed.”\n\n```cpp\n\
  \ if (true)\n   {\n       cout << \"This is always displayed.\\n\\n\";\n   }\n```\n\
  \n在下一个 `if` 语句中我测试了 `false`。因为 `false` 不是真，程序显示了消息“This is never displayed.”\n\n\
  ```cpp\n if (false)\n   {\n       cout << \"This is never displayed.\\n\\n\";\n\
  \   }\n```\n\n**陷阱**\n\n* * *\n\n* 如果你在 `if` 语句后加一个分号，其后的块将不是 `if` 语句的一部分。\n\n```cpp\n\
  \ if (false);\n {\n    cout << \"This is never displayed.\\n\\n\";\n}\n```\n\n##\
  \ 将值解释为真或假\n\n`if` 语句测试表达式的 `true` 或 `false`。任何非零值都可以被解释为 `true`，而 0 可以被解释为 `false`。\n\
  \n```cpp\n if (score)\n       cout << \"At least you didn’t score zero.\\n\\n\"\
  ;\n   }\n```\n\n## 使用关系运算符\n\n被解释为真或假的常见表达式涉及使用内置的关系运算符比较内容。\n\n```cpp\n if (score\
  \ >= 250)\n   {\n       cout << \"You scored 250 or more. Decent.\\n\\n\";\n   }\n\
  ```\n\n**陷阱**\n\n* * *\n\n* 等于关系运算符是 `==`（连续两个等号）。不要把它与 `=`（一个等号）混淆，后者是赋值运算符。\n\n\
  ```cpp\n int score = 500;\n   if (score = 1000)\n   {\n           cout << \" You\
  \ scored 1000 or more. Impressive!\\n\";\n   }\n```\n\n## 嵌套 if 语句\n\n`if` 语句可以导致程序执行语句或块，包括其他的\
  \ `if` 语句。当你将一个 `if` 语句写在另一个内部时，被称为*嵌套*。\n\n\n\n\n\n```\n if (score >= 500)\n  \
  \ {\n       cout << \"You scored 500 or more. Nice.\\n\\n\";\n       if (score >=\
  \ 1000)\n       {\n           cout << \"You scored 1000 or more. Impressive!\\n\"\
  ;\n       }\n   }\n```\n\n因为 `score` 大于 500，程序进入语句块并显示消息：“你的得分是 500 或以上。很不错。”然后，在内部\
  \ `if` 语句中，程序将 `score` 与 1000 进行比较。因为 `score` 大于或等于 1000，程序显示消息：“你的得分是 1000 或以上。令人深刻！”\n\
  \n**提示**\n* * *\n\n你可以根据需要嵌套任意层级。但是，如果代码嵌套得太深，将变得难以阅读。通常情况下，你应该尽量将嵌套限制在几层以内。\n\n\
  * * *\n\n### 使用 ELSE 子句\n\n你可以为 `if` 语句添加 `else` 子句，以便在测试表达式为 `false` 时执行代码。以下是包含\
  \ `else` 子句的 `if` 语句的形式：\n\n```\n if (expression)\n    statement1;\nelse\n    statement2;\n\
  ```\n\n如果 `expression` 为 `true`，则执行 `statement1`。然后程序将跳过 `statement2` 并执行 `if` 组之后的语句。如果\
  \ `expression` 为 `false`，则跳过 `statement1` 并执行 `statement2`。在 `statement2` 完成后，程序执行\
  \ `if` 组之后的语句。\n\n#### 介绍 Score Rater 2.0 程序\n\nScore Rater 2.0 程序也对用户输入的得分进行评分。但这次，程序使用了带有\
  \ `else` 子句的 `if` 语句。图 2.2 和 图 2.3 显示了程序根据用户输入的得分可以显示的两种不同消息。\n\n**图 2.2**\n\n如果用户输入的分是\
  \ 1000 或以上，他将获得祝贺。\n\n![images](img/00021.jpeg)\n\n经微软许可使用。\n\n**图 2.3**\n\n如果用户输入的分少于\
  \ 1000，则没有庆祝。\n\n![images](img/00022.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning\
  \ 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 2 章 文件夹中；文件名是 `score_rater2.cpp`。\n\n```\n // Score Rater 2.0\n// 演示了 else 子句\n\
  \n#include <iostream>\nusing namespace std;\n\n int main()\n{\n    int score;\n\
  \    cin >> score;\n\n    if (score >= 1000)\n    {\n        cout << \"You scored\
  \ 1000 or more. Impressive!\\n\";a\n    }\n    else\n    {\n        cout << \"You\
  \ scored less than 1000.\\n\";\n    }\n\n    return 0;\n}\n```\n\n## 创建两种分支方式\n\n\
  你已经见过 `if` 语句的第一部分了，它的工作方式和之前一样。如果 `score` 大于 1000，就会显示消息：“你的得分是 1000 或以上。令人深刻！”\n\
  \n```\n if (score >= 1000)\n   {\n       cout << \"You scored 1000 or more. Impressive!\\\
  n\";\n   }\n```\n\n转折点：`else` 子句为程序在表达式为 `false` 时提供了一个跳转的语句。因此，如果 `(score >= 1000)`\
  \ 为 `false`，程序将跳过第一条消息，而是显示消息：“你的得分少于 1000。”\n\n```\n else\n   {\n       cout <<\
  \ \"You scored less than 1000.\\n\";\n   }\n```\n\n### 使用带有 ELSE 子句的系列 IF 语句\n\n\
  你可以将带有 `else` 子句的 `if` 语句链起来，创建一个按顺序测试的表达式序列。与第一个测试为真的表达式相关的语句将被执行；否则，执行与最终（可选的）`else`\
  \ 子句相关的语句。这种系列语句的形式如下：\n\n```\n if (expression1)\n    statement1;\nelse if (expression2)\n\
  \    statement2;\n…\nelse if (expressionN)\n    statementN;\nelse\n    statementN+1;\n\
  ```\n\n\n#### 介绍 Score Rater 2.0 程序\n\nScore Rater 2.0 程序也对用户输入的得分进行评分。但这次，程序使用了带有\
  \ `else` 子句的 `if` 语句。图 2.2 和 图 2.3 显示了程序根据用户输入的得分可以显示的两种不同消息。\n\n**图 2.2**\n\n如果用户输入的分是\
  \ 1000 或以上，他将获得祝贺。\n\n![images](img/00021.jpeg)\n\n经微软许可使用。\n\n**图 2.3**\n\n如果用户输入的分少于\
  \ 1000，则没有庆祝。\n\n![images](img/00022.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning\
  \ 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 2 章 文件夹中；文件名是 `score_rater2.cpp`。\n\n---\n**使用带有 ELSE 子句的系列 IF 语句**\n\n你可以将带有\
  \ `else` 子句的 `if` 语句链起来，创建一个按顺序测试的表达式序列。与第一个测试为真的表达式相关的语句将被执行；否则，执行与最终（可选的）`else`\
  \ 子句相关的语句。这种系列语句的形式如下：\n\n```\n if (expression1)\n    statement1;\nelse if (expression2)\n\
  \    statement2;\nelse if (expressionN)\n    statementN;\nelse\n    statementN+1;\n\
  ```\n\n如果 `expression1` 为 `true`，则执行 `statement1` 并跳过序列中的其余代码。否则，测试 `expression2`，如果为\
  \ `true`，则执行 `statement2` 并跳过序列中的其余代码。计算机将按顺序检查每个表达式（一直到 `expressionN`）。\n\n*(注：由于原文中存在大量重复段落和示例，译文已根据逻辑结构进行了对齐。)*\n\
  \n\n\n\n\n该语句按顺序将 `choice` 与可能的值——`value1`、`value2` 和 `value3` 进行测试。如果 `choice`\
  \ 等于某个值，则程序将执行相应的 `statement`。当程序遇到 `break` 语句时，它将退出 `switch` 结构。如果 `choice` 不匹配任何值，则执行与可选的\
  \ `default` 关联的语句。\n\n`break` 和 `default` 的使用是可选的。然而，如果你掉了 `break`，程序将继续执行剩余的语句，直到遇到\
  \ `break`、`default` 或者 `switch` 语句结束。通常，你希望用一个 `break` 语句来结束每个 `case`。\n\n\n* *\
  \ *\n\n虽然不需要 `default` 分支，但设置一个作为通用的捕获通常是一个好主意。\n\n* * *\n\n这里有一个例子可以巩固这些概念。假设 `choice`\
  \ 等于 `value2`。程序首先测试 `choice` 是否等于 `value1`。由于它们不等，程序将继续执行。接下来，程序将测试 `choice` 是否等于\
  \ `value2`。由于它们相等，程序将执行 `statement2`。然后程序将遇到 `break` 语句并退出 `switch` 结构。\n\n### 阱\n\
  \n* * *\n\n你只能使用 `switch` 语句来测试 `int`（或可以被视为 `int` 的值，如 `char` 或枚举 `enumerator`）。`switch`\
  \ 语句不适用于任何其他类型。\n\n* * *\n\n### 引入菜单选择程序\n\nMenu Chooser 程序向用户显示一个列有三个难度等级的菜单，并要求他做出选择。如果用户输入的数字与列出的选项对应，他将看到一条确认选择的消息。如果用户选择了其他内容，他将会被告知该选择无效。图\
  \ 2.5 显示了程序的运行情况。\n\n**图 2.5**\n\n看起来我选了偷懒的方法。\n\n![images](img/00024.jpeg)\n\n\
  经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 2 章文件夹中；文件名为 `menu_chooser.cpp`。\n\n```\n // Menu Chooser\n// Demonstrates the\
  \ switch statement\n\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
  {\n    cout << \"Difficulty Levels\\n\\n\";\n    cout << \"1 - Easy\\n\";\n    cout\
  \ << \"2 - Normal\\n\";\n    cout << \"3 - Hard\\n\\n\";\n\n    int choice;\n  \
  \  cout << \"Choice: \";\n    cin >> choice;\n\n    switch (choice)\n         case\
  \ 1:\n                cout << \"You picked Easy.\\n\";\n                break;\n\
  \         case 2:\n                cout << \"You picked Normal.\\n\";\n        \
  \        break;\n         case 3:\n                cout << \"You picked Hard.\\\
  n\";\n                break;\n         default:\n                cout << \"You made\
  \ an illegal choice.\\n\";\n    }\n\n    return 0;\n}\n```\n\n## 创建多种分支方式\n\n`switch`\
  \ 语句创建了四个可能的分支点。如果用户输入 `1`，则执行与 `case 1` 关联的代码并显示“You picked Easy”。如果用户输入 `2`，则执行与\
  \ `case 2` 关联的代码并显示“You picked Normal”。如果用户输入 `3`，则执行与 `case 3` 关联的代码并显示“You picked\
  \ Hard”。如果用户输入任何其他值，则 `default` 将被启动并显示“You made an illegal choice”。\n\n### 阱\n\n\
  * * *\n\n你几乎总是想要用一个 `break` 语句来结束每个 `case`。不要忘记它们；否则，你的代码可能会执行你从未意图的操作。\n\n* * *\n\
  \n### 使用 WHILE 循环\n\n`while` 循环让你在表达式为 `true` 的情况下重复代码段。以下是 `while` 循环的通用形式：\n\n\
  ```\n while (expression)\n    statement;\n```\n\n如果 `expression` 为 `false`，程序将移动到循环后的语句。如果\
  \ `expression` 为 `true`，程序将执行 `statement` 并返回开头再次测试 `expression`。这个循环不断重复，直到 `expression`\
  \ 测试结果为 `false`，此时循环结束。\n\n### 引入再次游戏程序\n\nPlay Again 程序模拟了一场精彩游戏的进行。（好的，我说的“模拟一场精彩游戏的进行”是指程序显示消息“**Played\
  \ an exciting game**”）。然后程序询问用户他是否想再次玩。只要用户输入 `y`，他就会继续玩。程序使用 `while` 循环来实现这种重复。图\
  \ 2.6 显示了程序的运行情况。\n\n**图 2.6**\n\n重复是通过使用 `while` 循环实现的。\n\n![images](img/00025.jpeg)\n\
  \n经微软许可使用。\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。该程序位于第\
  \ 2 章文件夹中；文件名为 `play_again.cpp`。\n\n```\n // Play Again\n// Demonstrates while loops\n\
  \n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    char again = ’y’;\n\
  \    while (again == ’y’)\n    {\n        cout << \"\\n**Played an exciting game**\"\
  ;\n        cout << \"\\nDo you want to play again? (y/n): \";\n        cin >> again;\n\
  \    }\n    cout << \"\\nOkay, bye.\";\n    return 0;\n}\n```\n\n## 使用 while 循环循环\n\
  \n`main()` 函数执行的第一件事是声明名为 `again` 的 `char` 变量并将其初始化为 `y’`。然后程序开始 `while` 循环，测试 `again`\
  \ 是否等于 `y’`。由于相等，程序显示消息“**Played an exciting game**”，并询问用户是否想再次玩，并将回复存储在 `again`\
  \ 中。只要用户输入 `y`，循环就会继续。你会注意到我必须在循环之前初始化 `again`，因为 `while` 循环在执行循环体之前会对其表达式求值。\n\n\
  \n\n\n\n在 `do` 循环开始之前，我声明了字符 `again`。然而，我不需要初始化它，因为它在循环第一次迭代之后才会被测试。我在循环体中从用户处获取\
  \ `again` 的新值。然后，我在循环表达式中测试 `again`。如果 `again` 等于 `'y’`，循环继续；否则循环结束。\n\n## 在现实世界\n\
  \n尽管你可以相当互换地使用 `while` 和 `do` 循环，但大多数程序员使用 `while` 循环。虽然在某些情况下 `do` 循环可能看起来更自然，但\
  \ `while` 循环的优势在于它的表达式直接出现在循环的顶部；你不需要跑到循环的底部去寻找它。\n\n## 陷阱\n\n如果你曾经遇到过游戏陷入同一个无尽循环，那么你可能经历过`无限循环`——一个没有终结的循环。这里有一个无限循环的简单示例：\n\
  \n```\n int test = 10;\n   while (test == 10)\n   {\n       cout << test;\n   }\n\
  ```\n\n在这种情况下，因为 `test` 是 `10`，所以进入了循环。但由于 `test` 从未改变，循环永远不会停止。结果是，用户必须杀死运行中的程序来结束它。这个故事的教训是什么？确保循环的表达式最终可以变为\
  \ `false`，或者有其他方法让循环结束，如下一节“使用 break 和 continue 语句”所述的那样。\n\n\n你可以改变在循环中看到的那些行为。你可以使用\
  \ `break` 语句立即退出循环，并可以使用 `continue` 语句直接跳转到循环的顶部。尽管你应该谨慎地使用这些力量，但它们有时确实派得上用场。\n\n\
  ### 引入挑剔的计数器程序\n\nFinicky Counter 程序通过一个 `while` 循环从 1 计数到 10。它很“挑剔”，因为它不喜欢数字 5——它会跳过这个数字。图\
  \ 2.8 显示了程序的运行情况。\n\n**图 2.8**\n\n使用 `continue` 语句跳过数字 5，并通过 `break` 语句结束循环。\n\n\
  ![images](img/00027.jpeg)\n\n经微软许可使用。\n\n你可以从 Cengage Learning 网站下载该程序的代码（[www.cengageptr.com/downloads](http://www.cengageptr.com/downloads)）。程序位于第\
  \ 2 章文件夹中；文件名是 `finicky_counter.cpp`。\n\n```\n // Finicky Counter\n// 展示 break 和\
  \ continue 语句\n\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n\
  \    int count = 0;\n    while (true)\n    {\n        count += 1;\n\n        //\
  \ 如果 count 大于 10 则结束循环\n        if (count > 10)\n        {\n            break;\n\
  \        }\n\n        // 跳过数字 5\n        if (count == 5)\n        {\n          \
  \  continue;\n        }\n\n        cout << count << endl;\n    }\n\n    return 0;\n\
  }\n```\n\n\n我用以下行设置了循环：\n\n```\n while (true)\n```\n\n从技术上讲，这创建了一个无限循环。在刚刚给出避免无限循环的警告之后出现这个，可能可能很奇怪，但这个特定的循环并不是无限的，因为我在循环体中放置了一个退出条件。\n\
  \n#### 提示\n\n虽然 `while (true)` 循环有时比传统循环更清晰，但你也应该尝试尽量减少这类循环的使用。\n\n## 使用 break 语句退出循环\n\
  \n这是我在循环中放置的退出条件：\n\n```\n // 如果 count 大于 10 则结束循环\n    if (count > 10)\n    {\n\
  \        break;\n    }\n```\n\n由于每次循环体开始时 `count` 都会增加 1，它最终会达到 11。当它达到时，`break`\
  \ 语句（意思是跳出循环”）被执行，循环结束。\n\n### 使用 continue 语句跳转回循环顶部\n\n在 `count` 显示之前，我包含了以下几行：\n\
  \n```\n // 跳过数字 5\n    if (count == 5)\n    {\n        continue;\n    }\n```\n\n\
  `continue` 语句意味着“跳转回循环顶部”。在循环顶部，会测试 `while` 表达式，如果为真，则再次进入循环。所以，当 `count` 等于 `5`\
  \ 时，程序不会执行 `cout << count << endl;` 语句。相反，它直接回到了循环顶部。结果是，5 被跳过了且从未显示。\n\n### 理解何时使用\
  \ break 和 continue\n\n你可以使用 `break` 和 `continue`。\n\n## 使用逻辑运算符\n\n到目前为止，你已经看到了更简单的表达式。然而，你可以用逻辑运算符组合表达式以创建更复杂的表达式。\n\
  \n### 引入设计师网络\n\n\n**表 2.2 逻辑运算符**\n\n![images](img/00028.jpeg)\n\n**图 2.9**\n\n\
  如果你不是成员也不是游客，就无法进入。\n\n![images](img/00029.jpeg)\n\n**图 2.10**\n\n你可以作为客 登录。\n\n\
  ![images](img/0030.jpeg)\n\n**图 2.11**\n\n看起来今天某位精英登录了。\n\n![images](img/0031.jpeg)\n\
  \n```\n // Designers Network\n// 展示逻辑运算符\n\n#include <iostream>\n#include <string>\n\
  using namespace std;\n\nint main()\n{\n    string username;\n    string password;\n\
  \    bool success;\n\n    cout << \"\\tGame Designer’s Network\\n\";\n    do\n \
  \   {\n         cout << \"\\nUsername: \";\n         cin >> username;\n\n      \
  \   cout << \"Password: \";\n         cin >> password;\n\n        if (username ==\
  \ \"S.Meier\" && password == \"civilization\")\n        {\n            cout << \"\
  \\nHey, Sid.\";\n            success = true;\n        }\n        else if (username\
  \ == \"S.Miyamoto\" && password == \"mariobros\")\n        {\n            cout <<\
  \ \"\\nWhat’s up, Shigeru?\";\n            success = true;\n        }\n\n      \
  \  else if (username == \"W.Wright\" && password == \"thesims\")\n        {\n  \
  \          cout << \"\\nHow goes it, Will?\";\n            success = true;\n   \
  \     }\n\n        else if (username == \"guest\" || password == \"guest\")\n  \
  \      {\n            cout << \"\\nWelcome, guest.\";\n            success = true;\n\
  \        }\n\n        else\n\n        {\n            cout << \"\\nYour login failed.\"\
  ;\n            success = false;\n        }\n    } while (!success);\n\n    return\
  \ 0;\n}\n```\n\n### 使用逻辑与运算符\n\n逻辑与运算符 `&&` 允许你将两个表达式组合成一个更大的表达式，该表达式可以求值为 `true`\
  \ 或 `false`。只有当它连接的两个表达式都为 `true` 时，新表达式才为 `true`；否则为 `false`。就像英语中一样，“与”意味着两者。两个原始表达式都为真，新表达式为真。这里是\
  \ Designers Network 程序中的一个具体示例：\n\n```\n if (username == \"S.Meier\" && password\
  \ == \"civilization\")\n```\n\n\n\n\n表达式 `username == \"S.Meier\" && password ==\
  \ \"civilization\"` 只有在 `username == \"S.Meier\"` 和 `password == \"civilization\"\
  ` 都为 `true` 时才为 `true`。这运行得完美，因为我只想在 Sid 同时输入了他的用户名和密码时，才授予他访问权限。仅输入其中一个是不够的。\n\n\
  理解 `&&` 如何工作的的另一种方法是查看真与假的所有可能组合（参见表 2.3）。\n\n**表 2.3 使用 AND 运算符的可能登录组合**\n\n![images](img/00032.jpeg)\n\
  \n当然，Designers Network 程序对 Sid Meier 之外的用户也有效。通过一系列使用 `&&` 运算符的带有 `else` 子句的 `if`\
  \ 语句，程序会检查三对不同的 `username` 和 `password`。如果用户输入了识别的组合，他将得到个人的问候。\n\n\n逻辑或运算符 `||`\
  \ 允许你将两个表达式组合成一个更大的表达式，该表达式可以被评估为 `true` 或 `false`。如果第一个表达式*或* 第二个表达式为 `true`，则新表达式为\
  \ `true`；否则为 `false`。就像在英语中一样，“or”意味着二选一。如果第一个或第二个表达式任为 `true`，那么新表达式就是 `true`。（如果两者都为\
  \ `true`，那么较大的表达式仍然是 `true`。）这里有一个来自 Designers Network 程序的具体例子：\n\n```\nelse if\
  \ (username == \"guest\" || password == \"guest\")\n```\n\n如果 `username == \"guest\"\
  ` 为 `true` 或者 `password == \"guest\"` 为 `true`，则表达式 `username == \"guest\" || password\
  \ == \"guest\"` 为 `true`。这运行得完美，因为只要用户在用户名或密码中输入 `guest`，我就授予其访客身份访问权限。如果用户用户名和密码都输入\
  \ `guest`，那也可以。\n\n理解 `||` 如何工作的另一种方法是查看真与假的所有可能组合（参见表 2.4）。\n\n**表 2.4 使用 OR 运算符的可能登录组合**\n\
  \n![images](img/00033.jpeg)\n\n### 使用逻辑非运算符\n\n逻辑非运算符 `!` 允许你切换表达式的真假值。如果原始表达式为\
  \ `false`，则新表达式为 `true`；如果原始表达式为 `true`，则新表达式为 `false`。就像在英语中一样，“not”意味着相反。新表达式的值与原始值相反。\n\
  \n我在 `do` 循环的布尔表达式中使用了 NOT 运算符：\n\n```\n} while (!success);\n```\n\n当 `success`\
  \ 为 `false` 时，表达式 `!success` 为 `true`。这运行得完美，因为只有在登录失败时，`success` 才为 `false`。在这种情况下，与\
  \ `do` 循环相关的块块再次执行，并再次要求用户输入用户名和密码。\n\n当 `success` 为 `true` 时，表达式 `!success` 为 `false`。这运行得完美，因为当\
  \ `success` 为 `true` 时，用户已成功登录，循环结束。\n\n理解 `!` 如何工作的另一种方法是查看真与假的所有可能组合（参见表 2.5）。\n\
  \n**表 2.5 使用 NOT 运算符的可能登录组合**\n\n![images](img/00034.jpeg)\n\n### 理解运算顺序\n\n就像算术运算符一样，逻辑运算符也有优先级。逻辑非\
  \ `!` 的优先级高于逻辑与 `&&`，而 `&&` 的优先级又高于逻辑或 `||`。\n\n与算术运算符一样，如果你想让某个操作先被评估，可以使用括号。这是改变评估顺序的常用方法。例如，在以下表达式中：\n\
  \n```\n(username == \"S.Meier\" && password == \"civilization\")\n```\n\n### 生成数字\n\
  \n不可预测性可以为游戏增增趣味。生成随机数是实现这一点的方法之一。\n\n#### 引入骰子掷器程序\n\n\n**图 2.12**\n\n掷骰基于随机数。\n\
  \n![images](img/00035.jpeg)\n\n你可以从 Cengage 网站下载该程序的代码。程序位于第 2 章文件夹中；文件名为 `die_roller.cpp`。\n\
  \n```cpp\n// Die Roller\n// Demonstrates generating random numbers\n\n#include <iostream>\n\
  #include <cstdlib>\n#include <ctime>\n\nusing namespace std;\n\nint main()\n{\n\
  \    srand(static_cast<unsigned int>(time(0))); //seed random number generator\n\
  \n    int randomNumber = rand(); //generate random number\n\n    int die = (randomNumber\
  \ % 6) + 1; // get a number between 1 and 6\n    cout << \"You rolled a \" << die\
  \ << endl;\n\n    return 0;\n}\n```\n\n#### 调用 rand 函数\n\n我在程序中执行的第一件事之一是包含一个新文件：\n\
  \n```\n#include <cstdlib>\n```\n\n`cstdlib` 文件包含了（其他内容外）处理生成随机数的函数。因为我包含了该文件，所以我可以调用它包含的函数，包括\
  \ `rand()` 函数，这正是我在 `main()` 中做的：\n\n```\nint randomNumber = rand(); //generate\
  \ random number\n```\n\n正如你在第 1 章中所学习到的，函数是执行某些工作并返回值的代码段。你通过使用函数名后跟一对括号来调用或触发函数。如果函数返回一个值，你可以将该值赋值给变量。这就是我在这里使用赋值语句所做的。我将\
  \ `rand()` 返回的值（随机数）赋值给 `randomNumber`。\n\n\n\n\n函数也可以接收值并在工作中使用它们。你通过将这些值放在函数名后的括号内来提供它们，并用逗号分隔。这些值被称为\
  \ `arguments`（参数），当你提供它们时，你就将它们 `pass`（传递）给函数。我没有给 `rand()` 传递任何值，因为该函数不接受任何参数。\n\
  \n### 为随机数生成器种子\n\n计算机根据公式生成 `pseudorandom`（伪随机）数——而不是真正的随机数。理解这个问题的方法是想象计算机正在从一本巨大的预定义数字书中读取。通过读取这本书，计算机看起来就像产生了一系列随机数。\n\
  \n但存在一个问题：计算机总是从书的开头开始读取。正因如此，计算机在程序中总是产生同一系列“随机”数字。在游戏中，这并不是我们希望看到的。例如，我们不希望在每次玩骰子游戏时，掷出的骰子序列都是一样的。\n\
  \n解决这个问题的办法是告诉计算机在游戏程序开始时从书的某个任意位置开始读取。这个过程被称为为随机数生成器`seeding`（种子）。游戏程序员给随机数生成器一个数字，称为\
  \ `seed`（种子），以确定这组伪随机数序列中的起始位置。\n\n以下代码为随机数生成器设置种子：\n\n```\nsrand(static_cast<unsigned\
  \ int>(time(0))); //seed random number generator\n```\n\n哇，这行代码看起来相当神秘，但它的功能很简单。它根据当前的日期和时间为随机数生成器设置种子，这是完美的，因为每次运行程序时的当前日期和时间都是不同的。\n\
  \n从实际代码来说，`srand()` 函数为随机数生成器设置种子——你只需要传递一个 `unsigned int` 作为种子。这里传递给函数的是 `time(0)`\
  \ 的返回值——这是一个基于当前系统日期和时间的数字。代码 `static_cast<unsigned int>` 只是将该值转换（或 `casts`）为 `unsigned\
  \ int`。现在，你不需要理解这行代码的所有细微差别；你至少需要知道的是，如果你想让程序每次运行时生成一组不同的随机数，你的程序应该在调用 `rand()`\
  \ 之前执行一次这行代码。\n\n**Hint**\n\n关于将值从一种类型转换为另一种类型的各种转换形式的详细解释超出了本书的范围。\n\n### 计算范围内的数字\n\
  \n在生成随机数后，`randomNumber`  own 一个 0 到 32767 之间的值（基于我的 C++ 实现）。但我需要一个 1 到 6 之间的数字，所以接下来我使用取模运算符产生该范围内的数字。\n\
  \n```\nint die = (randomNumber % 6) + 1; // get a number between 1 and 6\n```\n\n\
  任何正数除以 6 都会得到一个 0 到 5 之间的余数。在之前的代码中，我取这个余数加 1，得到了 1 到 6 的可能范围——正是我想要的。你可以使用这种技术将随机数转换为你需要的范围内的数字。\n\
  \n**Trap**\n\n使用取模运算符从随机数创建范围内的数字并不总是能产生均匀的结果。范围内的某些数字可能比其他数字更容易出现。然而，对于简单的游戏来说，这不是问题。\n\
  \n# 理解游戏循环\n\n`game loop`（游戏循环）是游戏事件流的通用表示。事件的核心不断重复，这就是它被称为循环的原因。尽管实现在不同游戏之间可能非常不同，但几乎所有不同类型游戏的根本结构都是相同的。无论你谈论的是简单的太空射击游戏还是复杂的角色扮演游戏（RPG），你通常可以将游戏分解为游戏循环中相同的重复组成部分。图\
  \ 2.13 提供了游戏循环的视觉表示。\n\n**图 2.13**\n\n游戏循环描述了适用于几乎任何游戏的事件基本流。\n\n![images](img/00036.jpeg)\n\
  \n以下是游戏循环各个部分的说明：\n\n**Setup（设置）。** 这通常涉及接受初始设置或加载游戏资源，如声音、音乐和图形。玩家可能还会看到游戏的背景和目标。\n\
  **Getting player input（获取玩家输入）。** 无论来自键盘、鼠标、操纵杆、轨迹球或其他设备，玩家的输入都会被捕获。\n\n**Updating\
  \ game internals（更新游戏内部）。** 游戏逻辑和规则应用于游戏世界，并考虑玩家输入。这可能表现为确定对象相互作用的物理系统，也可能涉及敌人 AI\
  \ 的计算等。\n\n**Updating the display（更新显示）。** 游戏逻辑和规则应用于游戏世界，并考虑玩家输入。这可能表现为确定对象相互作用的物理系统，也可能涉及敌人\
  \ AI 的计算等。\n\n**Checking whether the game is over（检查游戏是否结束）。** 如果游戏没有结束，控制将返回到获取输入。\n\
  \n**Shutting down（关闭）。** 此时，游戏结束了。\n\n\n\n\n\n```cpp\n do\n   {\n       cout <<\
  \ \"Enter a guess: \";\n       cin >> guess;\n       ++tries;\n\n       if (guess\
  \ > secretNumber)\n       {\n           cout << \"Too high!\\n\\n\";\n       }\n\
  \       else if (guess < secretNumber)\n       {\n           cout << \"Too low!\\\
  n\\n\";\n       }\n       else\n       {\n           cout << \"\\nThat’s it! You\
  \ got it in \" << tries << \" guesses!\\n\";\n       }\n   } while (guess != secretNumber);\n\
  ```\n\n我获取玩家的猜测，增加尝试次数，然后告诉玩家他的猜测太高、太低还是完全正确。如果玩家的猜测正确，循环结束。注意 `if` 语句嵌套在 `while`\
  \ 循环内部。\n\n## 结束游戏\n\n一旦玩家猜中了秘密数字，循环和游戏就结束了。剩下的工作就是结束程序。\n\n```cpp\n return 0;\n\
  }\n```\n\n## 总结\n\n在本章中，你学习了以下概念：\n\n- ![images](img/00007.jpeg) 你可以使用关键字 `true`\
  \ 和 `false` 来表示真或假。\n- ![images](img/00007.jpeg) 你可以评估任何值或表达式的真假。\n- ![images](img/00007.jpeg)\
  \ 任何非零值都可以被解释为 `true`，而 0 可以被解释为 `false`。\n- ![images](img/00007.jpeg) 创建用于评估为真或假的表达式的常用方法是使用关系运算符比较两个值。\n\
  - ![images](img/00007.jpeg) `if` 语句测试表达式，仅当表达式为 `true` 时才执行某段代码。\n- ![images](img/00007.jpeg)\
  \ `if` 语句的 `else` 子句指定了仅当 `if` 语句中测试的表达式为 `false` 时才执行的代码。\n- ![images](img/00007.jpeg)\
  \ `switch` 语句测试一个可以视为 `int` 的值，并执行带有相应值标签的代码段。\n- ![images](img/00007.jpeg) `switch`\
