  **A:** 由大括号括起来的一个或多个语句，形成单一单元。\n\n**Q:** 什么是警告（warning）？\n**A:** 编译器提出的可能问题信息。警告不会停止编译。\n\
  \n**Q:** 我可以忽略警告吗？\n**A:** 你可以，但通常不应该这样做。你应该处理警告并修复代码。\n\n**Q:** 什么是空白字符（whitespace）？\n\
  **A:** 一组在文件中创建空格的非打印字符，包括制表符和换行符。\n\n**Q:** 什么是字面量（literals）？\n**A:** 表示显式值的元素。`\"\
  Game Over!\"` 是字符串，而 `32` 是数字常量。\n\n**Q:** 为什么我应该总是尝试初始化变量？\n**A:** 因为未初始化变量的内容可能是任何值——甚至是不符合程序逻辑的值。\n\
  \n**Q:** `bool` 类型变量是做什么用的？\n**A:** 它们可以表示真或假的条件，例如箱子是否锁定或卡牌是否朝上。\n\n**Q:** `bool`\
  \ 类型是如何命名的？\n**A:** 该类型是为了纪念数学家乔治·布尔（George Boole）而命。\n\n**Q:** 常量的名称必须大写吗？\n**A:**\
  \ 不是。使用大写是一种被接受的习惯——但你应该这样做，因为这是程序员的预期。\n\n**Q:** 我如何在一个单一变量中存储多个字符？\n**A:** 使用\
