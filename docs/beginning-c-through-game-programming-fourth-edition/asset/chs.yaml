  接下来，最好变得更具体化。针对这些类问自己一些问题：它们究竟代表什么？它们能做什么？它们将如何与其他类协作？\n\n我将 `Card` 对象视为现实生活中的牌。当你把牌从牌牌发到手中时，你不是在复制牌，而是在移动它。对我来说，这意味着\
  \ `Hand` 将有一个指向 `Card` 对象指针的 vector 作为数据成员，这些对象存在于堆上。当一张牌从一个 `Hand` 移动到另一个 `Hand`\
  \ 时，实际上是复制和销毁了指针。\n\n我将玩家（人类玩家和电脑）视为带有名称的黑色 21 手。这就是为什么我从 `Hand` 间接派生了 `Player`\
  \ 和 `House`。（另一种同样有效的观点是玩家拥有一手。如果我走这条路线，`Player` 和 `House` 将拥有 `Hand` 数据成员，而不是派自\
  \ `Hand`。）\n\n我定义了 `GenericPlayer` 来存放 `Player` 和 `House` 共享的功能，而不是在两个类中重复这些功能。\n\
  \n此外，我将牌堆与家分离开。牌堆将以相同的方式向人类玩家和电脑控制的家发牌。这意味着 `Deck` 将拥有一个多态的发牌成员函数，它可以与 `Player`\
  \ 或 `House` 对象共同工作。\n\n为了进一步细化，你可以列出你认为类将拥有的数据成员和成员函数，并对每项进行简要描述。这就是接下来我在表 10.2\
