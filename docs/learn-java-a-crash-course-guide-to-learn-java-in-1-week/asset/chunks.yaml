    made up of three parts as described below:


    *   **Declaration**: the code formatted to bold are variable declarations correlating
    a variable name with the object type.

    *   **Instantiation**: like I mentioned, the keyword `new` is an operator in Java
    that builds the object.

    *   **Initialization**: a call to a constructor that initializes the new object
    follows the operator


