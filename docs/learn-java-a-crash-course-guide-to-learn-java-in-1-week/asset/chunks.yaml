    ## Creating Objects


    In java, objects are combinations of data and procedures working on the data available.
    An object contains a behavior and state. Both of these are kept in variables or
    fields while the functions or methods display the behavior of the object. The
    classes serve as templates to create objects. In Java, the keyword `new` is used
    to create an object.


    A class gives the blueprint for different objects. In this case, you make an object
    from class and each of the statements below from a program builds an object and
    assigns a variable to it.


