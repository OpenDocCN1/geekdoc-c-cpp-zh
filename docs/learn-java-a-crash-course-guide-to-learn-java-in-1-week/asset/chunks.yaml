    In the same way, ask yourself what behavior you are going to have in the class.
    Abstraction is applied here as well. What is important to have is different from
    what will be an overdose. Cut off some of the information off from the class,
    and this process is using or applying abstraction.


    When asked for the difference between encapsulation and abstraction, you can say
    that encapsulation applies abstraction just as a concept. Therefore, it is just
    encapsulation. But abstraction is a concept that is even applied as part of polymorphism
    (discussed later) and inheritance. You need to look at abstraction at a higher
    level among the other concepts of object oriented programming including polymorphism,
    inheritance and encapsulation.


    ### Abstraction And Inheritance


    Let’s try to take inheritance in this discussion as well. When you are designing
    the hierarchy of classes, you apply abstraction and then create many layers between
    the hierarchies. Let’s take a first level class cell as an example; next level
    will be LivingBeing and animal will be the next after that. The hierarchy you
    create here based on the context, which you are programming for uses abstraction
    itself. Now for each level, what exactly are the properties and behaviors that
    you are going to have? Abstraction also plays a very important role here in determining
    that. What are the common properties that can be exposed to a higher level in
    order for the lower level classes to inherit from it? Some properties don’t need
    to be kept at higher level. This process of decision making is nothing but using
    abstraction to have different hierarchy layers.


    Now that you read the short section, you should now have an idea about the way
    abstraction is done in Java.


    *   When you conceptualize classes


    *   When you write interfaces


    *   When you write abstract class methods


    *   When you write extends


    *   When you apply modifiers such as ‘private’, ...


    You use abstraction as a concept in the areas identified above.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Polymorphism In Java


    ![image](d2d_images/chapter_title_below.png)


    Polymorphism in its literal sense refers to a state of having many shapes or the
    ability to take on various forms. When it is used in an object oriented programming
    language such as Java, it describes the ability of the language to process objects
    of various classes and types through a uniform and single interface.


    Polymorphism takes on two types: Runtime polymorphism and static binding  (also
    known as compile time polymorphism). The former entails method overloading as
    an example while the latter is contained in dynamic polymorphism.


    Perhaps you need to note that polymorphism entails a very important example, which
    is how a parent class refers to a child class object. As a matter of fact, any
    object satisfying more than a single IS-A relationship is by nature polymorphic.


    As an example, we can consider the class animal and let one of its subclasses
    be cat. Therefore, any cat is an animal. The cat in this case satisfies the IS-A
    relationship for its own type and also its super class ‘animal’. You also need
    to note that it is very legal to state that every object in Java is by nature
    polymorphic because each one of them passes the IS-A test for itself as well as
    that for the ‘object’ class.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Static Polymorphism


    When it comes to Java language, we achieve static polymorphism through something
    called method overloading. Method overloading simply means that there are a number
    of methods available in a class that have the same name but different types or
    order or number of parameters.


    Java knows, at compile time, the kind of method to invoke by looking at the method
    signatures. Therefore, this is known as static binding or the compile time polymorphism.


    Let the following example make this concept clearer for you:


    ![image](d2d_images/image211.png)


    In the example above, we have four forms of ‘add’ methods. The first one takes
    two parameters and the second one takes three of them. The 3^(rd) and 4th methods
    provide for a change of order of the parameters. The compiler usually checks the
    method signature after which it make a decision on which method to be invoked
    when compile time comes for a certain method call.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Dynamic Polymorphism


    Imagine you have a sub class that is overriding a certain method of the super
    class. Imagine, you have, in the program, an object of the sub class created and
    have it assigned to the super class reference. In this case, if you call the overridden
    method on the reference of the super class, it means that the sub class version
    of the method will be called as a result. Take a look at the example below:


    ![image](d2d_images/image234.png)


    You need to note that in your first call to ‘move()’, the reference type is ‘vehicle’
    while ‘Motorbike’ is the object being referenced. In this case, when you make
    a call to ‘move()’, the program will wait until it is runtime to determine the
    object that the reference is pointing to. In our case here, the object is of the
    ‘MotorBike’ class. Therefore the ‘move()’ method if the class ‘MotorBike’ will
    be called. The second call to ‘move()’ has the class ‘vehicle’ as its object.
    Therefore, the method ‘move()’ of the ‘vehicle’ will get called.


    Note that at runtime, when the method to call is determined, this is referred
    to as late binding or dynamic binding.


    As a recap, by now you should know that:


    *   In Java, an object that passes multiple IS-A tests is automatically polymorphic
    by nature


    *   In Java, all objects pass a minimum of two IS-A tests- that is one for the
    object class and one for itself


    *   In Java, static polymorphism is done through method overloading


    *   In Java, Dynamic polymorphism is attained through method overriding.'
