    ## Comments


    In Java, comments are used in the process of documentation. Some people don’t
    place comments in the category of tokens because the compilers usually ignore
    them during tokenization.


    In Java, multi-line comments begin with the following:


    ![image](d2d_images/image062.png)


    The single line comments begin with:


    ![image](d2d_images/image197.png)


    What we’ve discussed is just a basic overview of Java tokens. I hope you understood
    what tokens mean. Let’s now write a little java program and separate it into distinct
    tokens that specify their token type:


    ![image](d2d_images/image236.png)


    In the program written above,


    *   The keywords include public, class, void, static and int.


    *   The identifiers include:  Test, main, args, x, w


    *   The operators include: + and =


    *   The literals include: 20 and 10


    The separators include:


    ![image](d2d_images/image118.png)


    The comment is described by: ![image](d2d_images/image190.png)


    As you can see here, the compiler breaks down the program into tinier logical
