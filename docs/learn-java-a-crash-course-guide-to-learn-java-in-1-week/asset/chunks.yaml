    \ |\n\n![image](img/chapter_title_above.png)\n\n# 引言\n\n![image](img/chapter_title_below.png)\n\
    \n我想感谢并祝贺你下载了这本书《初学者 Java：一周内学会 Java 的速成指南》。\n\n这本书是 Java 编程的终极初学者速成课程，它将帮助你在最短的一周内学到该语言的足够知识！\n\
    \n我们都有梦想。我的梦想可能是成为一名伟大的老师，而你的梦想可能是在 IT 领域拥有伟大的职业生涯，或者通过提升 IT 技能和知识来实现自我价值（或类似的目标）。毫无疑问，`Java\
    \ Programming Language` 提供的实战经验和专业知识是任何渴望成为专业程序员的人的必备要求。\n\n但虽然你可能有足够的动力来学习这门语言，但我确定你多次问过自己一些问题：为什么要编程？或者为什么选择\
    \ Java？学习编程——特别是学习 Java——有很多原因，其中大多数我确定你已经知道了。但如果你问我的话，我会很诚实地说，我们中有些人学习编程是为了赚钱。学习编程这门艺术和技艺确实带有许多与自我实现和满足相关的收益，但经济利益实在太显眼而无法忽视。\n\
    \n首先，Java 无疑是最受推崇的技能，几乎在任何地方都有需求。IBM、Infosys、Twitter、Netflix、Google、Spotify、Uber、Amazon、Target、Yelp、Square\
    \ 以及[其他大厂](https://siftery.com/java) 都需要优秀的 Java 程序员。根据 `PayScale.com`（提供工资信息的网站），平均\
    \ Java 开发人员的年收入约为 70,000 美元。作为该领域的专业人士，你可以在全球范围内工作，需求并不局限于特定的地理区域。\n\n这本书是专门设计的终极指南，旨在帮助你从一个对编程大不陌生的人转变为一个能够教授该学科并完成良好编程项目的人。酷的地方在于：你可以在**一周内**学会全部内容！它已更新到最新版本（8\
    \ 和 10），书中涵盖的主要主题包括：\n\n* 变量\n* 条件\n* 循环\n* 数组\n* 运算符\n* 用户输入\n* 类\n* 对象\n* 方法\n\
