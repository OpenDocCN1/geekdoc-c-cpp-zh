  raw: '*   The instance variables are also visible for all constructors, block and
    methods in the class. Typically, it’s recommended to make these variables private
    or access level. Nonetheless, subclasses’ visibility can be provided for these
    variables using access modifiers.


    *   The instance variables can be directly accessed by calling the name of the
    variable within the class. Nonetheless, within the static variables – that is
    when the instance variables are offered accessibility- they need to be called
    with the fully qualified name. Let’s take an example:


    ![image](d2d_images/image038.png)


    From this, you’ll get the following result:


    ![image](d2d_images/image162.png)


    ### Class Or Static Variables


    Also known as static variables, class variables are declared using the static
    keyword in a class, but outside a method, block or constructor. Regardless of
    the number of objects created from it, there would only be a single copy of each
    class variable per class.


    Static variables are seldom used – that is besides being declared as constants.
    Constants are variables essentially declared as private/public, static and final.
    Constant variables will never change from their first value.


    The static variables are kept within the static memory, and it is not common to
    use static variables as private or public constants. Static variables are actually
    created when the program starts up and killed when the program stops.


    Visibility is similar to instance variables. Nonetheless, most static variables
    get declared public because they need to be available for the class users. The
    default values are similar to instance variables and for the numbers, zero represents
    the default value. It is false for the Booleans and null for the object references.
    The values can get assigned either within the constructor or during the declaration.
    What’s more, the values can get assigned in distinctive static initializer blocks.


    Calling with the class name is what is required to access the static variables
    –className.VariableName.


    Lastly, if we declare the class variables as public static final, this essentially
    means that the constants or variable names are all in the upper case. Moreover,
    if the static variables aren’t public as well as final, this means that the naming
    syntax is similar to the instance and the local variables.


    Let’s take an example:


    ![image](d2d_images/image111.png)


    The following result will be given:


    -Development average salary: 1000


    You need to note that if the variables are accessed from an outside class, the
    constant needs to be accessed as the Employee Department.


    ### Local Variables


    Local variables are used to store a method in its temporary state. The syntax
    used to declare a local variable is the same as declaring a field- for instance,
    int count=0;. You won’t find a particular keyword that designates a variable as
    local as such a determination comes entirely from the location in which the variable
    is declared- that is between the method’s closing and opening braces. Thus, local
    variables can only be seen by the methods, which they are declared in- so they
    cannot be accessed from the rest of class.


    In short, local variables are referred to as ‘local’ because they can only be
    referenced and locally used in the method that they are declared in. Below is
    a method where ‘miles’ is a local variable.


    ![image](d2d_images/image056.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Parameters


    Parameters are also methods passed in Methods. For instance, in the main method,
    the string args [] variables is a parameter.


    ![image](d2d_images/image016.png)


    ### Conditional Statements In Java


    Every day in life, we come in contact with different kinds of objects as you try
    to get things done; at the same time, we use these objects to carry out different
    tasks. The one type of objects we tend to come in contact with are digital or
    analog devices such as phones, computers, cars, self-opening doors in malls and
    offices, and televisions.


    In relation to the example above, you’ll realize that the concept of conditional
    statements in Java depicts the way we go about our daily lives. Conditional statements,
    with regards to Java programming, are all about making decisions that are directed
    towards a desired result. Each day, we make decisions, and for these decisions,
    we get particular result.


    In Java programming, we have two types of decision making statements to use when
    programming a software or device that you can run on any device like the ones
    I’ve stated above. These statements basically assist the device and the device’s
    user as well to do something according to a particular state or condition.


    The IF-STATEMENT is the first conditional statement. You need to note that the
    if-statement contains three versions, which include the following:


    *   IF — STATEMENTS


    *   ELSE — IF STATEMENTS


    *   IF / ELSE STATEMENTS


    Let’s see how an IF-statement works using the first device we mentioned.


    ![image](d2d_images/image023.png)


    In Java, we use the IF-statements to check for a condition or state of the phone
    and when that condition happens to be true, the action thus becomes executed.
    If the condition is not true, nothing will happen. Now let’s consider the phone;
    if the condition or state of the phone is battery low, then the phone will inform
    you to charge it. If the phone storage is full, you can get a notification is
    to fix it just the same way it informs you to download a software update when
    it’s available.


    The if/else statements


    Let’s now use the second device to see how the if/else statement on the other
    hand works.


    ![image](d2d_images/image125.png)


    When you look at the image above, you’ll see that the ‘if conditional’ statements
    are extended to complete another action in the instance the first one is false.
    You can also define another action that can be completed (in the if/else statements)
    if the first condition isn’t true – in this case, the first condition is false.
    The conditions above are quite self-explanatory since they are evident in our
    day-to-day use of computers.


    The other version of these statements is known as:


    The If-Statements


    Let’s use the device we mentioned third to look at how an else-if statement works.


    ![image](d2d_images/image215.png)


    Besides the if/else, Java also lets you test other conditions by using the else
    if keyword. Let’s take the first case as an example; you can see that once you
    test the first condition, it was decided to test for two more conditions which
    are likely consequences in our day-to-day use of air conditions. Basically therefore,
    we are able to give actions to be carried out according to any possible condition-
    with the java else if statements that is.


    Switch case


    Lastly, we also have the ‘switch case’, another type of conditional statements
    used in Java. Just as the name implies, it is some kind of a ‘switch case’ that
    controls a light bulb. Therefore, it essentially means that you can have multiple
    switches to act as conditions that light up different ‘bulbs’ (or perform actions).
    See the image below.


    Using the last device mentioned, we’ll take a look at how a switch case statement
    functions.


    ![image](d2d_images/image182.png)


    When you look at the image above, it is pretty obvious that the distance needed
    to open the door automatically is stowed in the distance variable. Following the
    declaration and initialization of variables, the switch case comes next to test
    all possible distances that are having their corresponding actions. What exactly
    happens is that you store the major variable required to perform a certain action
    and then go on to include other cases that can carry out other actions.'
