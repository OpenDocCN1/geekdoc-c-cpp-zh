- fmt: '

    The actual walls are drawn according to the values of the gap wall. You need to
    note that these can be handled cleaner and better with classes. This is however
    how we’ll handle it: we’ve got two base methods for management of the walls: `wallHandler`
    and `wallHandler()`. The latter adds to the `arraylist` new walls per `wallInterval`
    millisecond. We’ve got a global variable `lastAddTime` that stores the last wall
    you added. In case the present millisecond `millis()` deducting the last millisecond
    added–`lastAddTime`- is bigger than the interval value–`wallInterval`- this essentially
    means that you have to add a new wall. Random gap variables then get generated
    according to the global variables defined at the top. A mew wall is then added
    into the `arraylist` and `lastAddTime` set to the current `millis()`. The `wallHandler()`
    loops through the current walls that’s in the `arraylist` and calls `wallRemover(i)`,
    `wallDrawer(i)` and `wallMover(i)` for each item by the index value of the `arraylist`.


    The `wallDrawer` draws the walls according to the gap wall data. The `wallDrawer`
    will usually grab the wall data array from `arraylist` before it can call the
    method `rect()` for drawing the walls to where they need to be. The `wallMover`
    takes the element right from the `arraylist` and alters its X location according
    to the `wallSpeed` global variable. The `wallRemover` gets the walls off the `arraylist`,
    which are out of the screen. When a wall is thus removed from `arraylist`, this
    eliminates it from being drawn in all the following loops.


    We now have to detect any collisions between the walls and the balls:


    ![image](d2d_images/image112.png)watc


    The method `hWallCollision()` is called for every wall on all the loops. You get
    the coordinates of the gap wall and calculate the actual walls’ coordinates (from
    top to bottom) and then check whether the ball’s coordinates are colliding with
    the walls.


    ## Health and score


    I don’t know about you but I think we should have a health bar on top. When the
    ball touches the walls, it should lose health. This logic however doesn’t make
    sense to have the ball bouncing back from the walls. When the health is 0, the
    game should end.


    ![image](d2d_images/image161.png)


    The simple run is right [here](https://uploads.toptal.io/blog/image/125588/toptal-blog-image-1520330296635-cc0246c60c78d04e1de1bf597ca0124f.gif).


    We made `health`, a global variable and then the method `drawHealthBar()` to draw
    two rectangles over the ball. The first one is the base health bar and the other
    one is the active one that displays the current health. The width of the second
    one is pretty dynamic and the formula `healthBarWidth*(health/maxHealth)` calculates
    it, the current health’s ratio with respect to the health bar’s width. The fill
    colors are now set based on the value of the health. Now for the scores:


    ![image](d2d_images/image068.png)


