    \ assist the device and the device’s user as to do something according to a particular\
    \ state or condition.\n\nThe `IF-STATEMENT` is the first conditional statement.\
    \ You need to note that the `if-statement` contains three versions, which include\
    \ the following:\n\n* `IF — STATEMENTS`\n* `ELSE — IF STATEMENTS`\n* `IF / ELSE\
    \ STATEMENTS`\n\nLet’s see how an `IF-statement` works using the first device\
    \ we mentioned.\n\n![image](d2d_images/image023.png)\n\nIn Java, we use the `IF-statements`\
    \ to check for a condition or state of the phone and when that condition happens\
    \ to be true, the action thus becomes executed. If the condition is not true,\
    \ nothing will happen. Now let’s consider the phone; if the condition or state\
    \ of the phone is battery low, then the phone will inform you to charge it. If\
    \ the phone storage is full, you can get a notification is to fix it just the\
    \ same way it informs you to download a software update.\n\n### IF-STATEMENTS\n\
    \nIn Java, we use the `IF-statements` to check for a condition or state of the\
