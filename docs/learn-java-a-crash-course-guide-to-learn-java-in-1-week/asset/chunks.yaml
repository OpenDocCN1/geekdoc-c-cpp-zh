    ### Naming a Method


    Even though the method name can take the form of any legal identifier, the code
    conventions tend to restrict the method names. Conventionally, the method names
    need to be a lowercase verb or multi-word names that start with a verb in lowercase
    and then nouns, adjectives and so on. When it comes to multi-word names, the first
    letter of each of the second and following words needs to be capitalized. Take
    the examples below:


    ![image](d2d_images/image168.png)


    A method typically has a special name within its class. Nonetheless, it’s possible
    for a method to have the same name as the other methods, owing to method overloading
    discussed below:


    ### Overloading Methods


    Java supports overloading methods; the program can also differentiate between
    methods having dissimilar method signatures. This simply means that it is possible
    for the methods in a class to have the same name if they contain different parameter
    lists.


    Assume you have a class that is able to use calligraphy to draw various data types-
    this includes intergers, strings and so forth- and that which has a method for
    drawing every data type. It is stressful to use a new name for all methods. For
    instance, `drawInteger`, `drawString`, `drawFloat` and so forth. In Java, you
    are allowed to use the same name for all the methods of drawing but then pass
    a different argument list to each one of these methods. Therefore, the data drawing
    class could declare four methods with the name `draw`, each of which contains
    a different list of parameters.


    ![image](d2d_images/image002.png)


    The type and number of arguments that are passed into the method helps differentiate
    overloaded methods. When you look at the code sample, the `draw(int i)` and `draw(string
    s)` are unique and distinct methods because they need different types of arguments.


    You cannot declare more than one method that has the same name, the same type
    and number of arguments since the compiler is not able to tell them apart. The
    compiler doesn’t typically consider the type when it is differentiating methods.
    This essentially means that you really cannot declare 2 methods using the same
    signature even if each uses a different return type.


