    \n## Parameters\n\nParameters are also methods passed in Methods. For instance,\
    \ in the `main` method, the `string args []` variables is a parameter.\n\n![image](d2d_images/image016.png)\n\
    \n## Conditional Statements In Java\n\nEvery day in life, we come in contact with\
    \ different kinds of objects as you try to get things done; at the same time,\
    \ we use these objects to carry out different tasks. The one type of objects we\
