    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    I want to thank you and congratulate you for downloading the book, “Java for Beginners:
    A Crash Course Guide to Learn Java in 1 Week.”


    This book is the ultimate beginners’ crash course to Java programming, as it will
    help you learn enough about the language in as little as 1 week!


    We all have dreams. My dream could be to become a great teacher, and chances are
    that your dream is to have a great career in IT or develop your skills and knowledge
    in IT for self-fulfillment (or something close to that). Without a doubt, the
    hands-on experience and expertise Java Programming Language offers is an essential
    requirement for anyone who’s ardent about becoming a professional programmer.


    But while you might be motivated enough to learn the language, I’m sure you must
    have asked yourself some questions severally: why programming? Or why choose Java?
    There are many reasons as to why you should learn programming- and Java in particular-
    most of which I’m sure you already know. If you ask me though, I’d be mean enough
    to say that some of us learn to earn. There are definitely many self-actualization
    and fulfillment related benefits that come with learning the art and trade of
    programming but the fiscal benefits are simply too conspicuous to ignore.


    For one, Java is arguably the most acclaimed skill and is in demand nearly everywhere.
    IBM, Infosys, Twitter, Netflix, Google, Spotify, Uber, Amazon, Target, Yelp, Square,
    and [other big players](https://siftery.com/java) are always in need of a great
    Java programmer. Going by PayScale.com (the website that offers information about
    salary), an average Java developer earns about $70,000 annually. As a pro in the
    field, you have the entire globe to work over, as the demand is never restricted
    to a particular geographical area.


    This book is the ultimate guide specially designed to help you move from a person
    largely unacquainted with programming to a person who can actually teach the subject
    and complete good programming projects. Here’s the cool part: you get to learn
    the whole thing in ONE WEEK! It is updated to the latest versions (8 and 10) and
    the main topics of what the book will be about include:


    *   Variables


    *   Conditions


    *   Loops


    *   Arrays


    *   Operators


    *   User input


    *   Classes


    *   Objects


    *   Methods


    *   Object Oriented Programming which includes:


    ✓  Inheritance


    ✓  Encapsulation


    ✓  Polymorphism


    ✓  Compositions


    And much, much more! Let’s begin our learning.


    Thanks again for downloading this book. I hope you enjoy it!


