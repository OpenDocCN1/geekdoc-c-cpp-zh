- fmt: "\nI’m sure you might be wondering whether your understanding of physics is\
    \ being threatened. I know in real life, that’s not how gravity works. Consider\
    \ this to be simply an animation process. `Gravity`, the variable, is only a numeric\
    \ value- just a `float` which makes it possible to use decimal values and not\
    \ only integers- which, on every loop, we add to `ballSpeedVert`. Actually, `ballSpeedVert`\
    \ refers to the ball’s vertical speed, which goes to the ball’s Y coordinate (`bally`)\
    \ on all the loops. You watch the ball’s coordinates to ensure it remains in the\
    \ screen and that if you don’t (as you may know already), the ball will only fall\
    \ to infinity. \n\nFor now though, the ball is moving in a vertical direction\
    \ only. This means that we watch the boundaries of the floor and ceiling in the\
    \ screen. With method `keepInScreen ()`, we check whether `bally` or `+` the radius\
    \ is less than `height` and in the same way, `bally` or `–` the radius is higher\
    \ than 0. In case the conditions don’t meet, you get the ball to bounce (right\
    \ from the bottom or top) using the methods: `makeBounceTop ()` and `makeBounceBottom\
    \ ()`. We can have the ball move to the very location where it had to bounce and\
    \ then get the product of vertical speed or `ballSpeedVert` and `-1` (note that\
    \ the sign changes when you multiply with -1). when the speed value gets a `–`\
    \ sign, it means that when you add the Y coordinate, the speed will then become\
    \ `bally–ballSpeedVert` that’s obtained from `bally+(-ballSpeedVert)`. In this\
    \ case, the ball changes its direction with that same speed immediately. Now,\
    \ as you include `gravity` to `ballSpeedVert` and it has a negative value, it\
    \ will begin getting close to 0, and eventually becoming 0 and then beginning\
    \ to increase once more. This will make the ball to rise, then rise slower, stop\
    \ and then begin falling.\n\n![A ball bouncing indefinitely on a racket.](d2d_images/image226.png)\n\
    \nIf you are keen enough, you’d notice that our animation process has a problem-the\
    \ ball does not stop bouncing. If we used a real-world scenario to look at it,\
    \ we’d say that the ball would face friction and air resistance each time it came\
    \ into contact with a surface. That is exactly the behavior we want the animation\
    \ process to have. Implementing that is pretty easy. Just add the code below:\n\
    \n![image](d2d_images/image170.png)\n\nThe animation process will produce something\
    \ [like this](https://uploads.toptal.io/blog/image/125583/toptal-blog-image-1520329370572-9eebf4ce6165cb48c6a534ff74f8fe63.gif).\n\
    \n`Friction`, as the name suggests, refers to the surface friction; `airfriction`\
    \ on the other hand refers to friction of air. Obviously therefore, `friction`\
    \ needs to apply each time the ball comes in contact with any surface. Therefore,\
    \ that is exactly what we did. The method `applygravity ()` runs on every loop,\
    \ you thus take away 0.0001 percent of its present value from `ballSpeedVert`\
    \ on all loops. The methods `makeBounceTop ()` and `makeBounceBottom ()` run when\
    \ the ball comes in contact with any surface. Therefore, we did the same thing\
    \ in those method, only that we used `friction` this time.\n\n## Create the racket\n\
    \nYou’ll now require a racket which the ball will bounce on. You should also be\
    \ able to control the racket. We’ll make it controllable with a mouse. The code\
    \ for that is as follows:\n\n![image](d2d_images/image229.png)\n\nWe defined the\
    \ racket’s width, height and color as a global variable. You might want to see\
    \ them change during the game. We implemented the `drawRacket ()` method, which\
    \ does exactly what its name suggests. You have to set `rectMode` to center so\
    \ that the racket gets aligned to your cursor’s center. Having created the racket,\
    \ the next thing is making the ball bounce on it.\n\n![image](d2d_images/image196.png)\n\
    \nClick[here](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)\
    \ for the result:\n\nSo, `watchRacketBounce ()` ensures the racket and the ball\
    \ collide. You need to check whether the ball and racket lined up horizontally\
    \ and vertically. The initial if statement checks to see whether the X coordinate\
    \ on the ball’s right side is more than that on its left and vice versa. In case\
    \ it is, the second statement will check whether the distance between the ball\
    \ and the racket is equal or smaller than the ball’s radius. If this conditions\
    \ therefore meet, the method `makeBounceBottom ()` is called and the ball bounces\
    \ on the racket.\n\nThe variables `pmouseY` and `pmouseX` store the mouse coordinates\
    \ at the previous frame. Since the mouse is able to move really fast, it is possible\
    \ you might not detect the distance between the racket and the ball right between\
    \ the frames in case the mouse is moving quickly enough towards the ball. Therefore,\
    \ we take the difference of the coordinates of the mouse between the frames and\
    \ consider that while detecting the distance. The quicker the mouse moves, the\
    \ more distance is tolerable.\n\nNow, as you include `gravity` to `ballSpeedVert`\
    \ and it has a negative value, it will begin getting close to 0, and eventually\
    \ becoming 0 and then beginning to increase once more. This will make the ball\
    \ to rise, then rise slower, stop and then begin falling.\n\nThe variables `pmouseY`\
    \ and `pmouseX` store the mouse coordinates at the previous frame. Since the mouse\
    \ is able to move really fast, it is possible you might not detect the distance\
    \ between the racket and the ball right between the frames in case the mouse is\
    \ moving quickly enough towards the ball. Therefore, we take the difference of\
    \ the coordinates of the mouse between the frames and consider that while detecting\
    \ the distance. The quicker the mouse moves, the more distance is tolerable.\n\
    \n## Moving horizontally and controlling the ball\n\nWe’ll add horizontal movement\
    \ to the ball and then make it possible to control it.\n\n![image](d2d_images/image176.png)\n\
    \nCheck [here](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)\n\
    \nThe idea is the same as that in the vertical movement. We created `ballSpeedHorizon`,\
    \ a horizontal speed variable. We then created ballSpeedHorizon, a horizontal\
    \ speed variable and also made a method that applies the horizontal speed to the\
    \ ball while air friction. Also, we added another two if statements to the method\
    \ `keepInScreen ()` that is meant to watch the ball for hitting the right and\
    \ left edges. Lastly, we made sure the bounces from left to right are handled\
    \ with `makeBounceRight ()` and `makeBounceLeft ()`.\n\n## Create the walls\n\n\
    We’ll now add walls that move towards the left.\n\n![image](d2d_images/image045.png)\n\
    \n![image](d2d_images/image192.png)\n\n[This is the result](https://uploads.toptal.io/blog/image/125587/toptal-blog-image-1520330276517-1ff10f2d45712eb1d582e1fd6b308115.gif).\n\
    \nThe first thing you need to note is the `ArrayList`, which is simply an implementation\
    \ of the list and behaves like an Array. It however is resizable and contains\
    \ great methods such as `list.remove (index)`, `list.add (index)` and `list.get\
    \ (index)`. We store the wall data as arrays of integers inside the arraylist.\
    \ The data we store in the arrays is meant for the gap in between 2 walls.\n\n\
    ![image](d2d_images/image022.png)\n"
  raw: 'I’m sure you might be wondering whether your understanding of physics is being
    threatened. I know in real life, that’s not how gravity works. Consider this to
    be simply an animation process. “Gravity”, the variable, is only a numeric value-
    just a ‘float’ which makes it possible to use decimal values and not only integers-
    which, on every loop, we add to ‘ballSpeedVert’. Actually, ballSpeedVert refers
    to the ball’s vertical speed, which goes to the ball’s Y coordinate (bally) on
    all the loops. You watch the ball’s coordinates to ensure it remains in the screen
    and that if you don’t (as you may know already), the ball will only fall to infinity.
    For now though, the ball is moving in a vertical direction only. This means that
    we watch the boundaries of the floor and ceiling in the screen. With method ‘keepInScreen
    ()’, we check whether ‘bally’ or + the radius is less than ‘height’ and in the
    same way, ‘bally’ or – the radius is higher than 0\. In case the conditions don’t
    meet, you get the ball to bounce (right from the bottom or top) using the methods:
    ‘makeBounceTop ()’ and ‘makeBounceBottom ()’. We can have the ball move to the
    very location where it had to bounce and then get the product of vertical speed
    or ‘ballSpeedVert’ and -1 (note that the sign changes when you multiply with -1).
    when the speed value gets a – sign, it means that when you add the Y coordinate,
    the speed will then become bally–ballSpeedVert that’s obtained from bally+(-ballSpeedVert).
    In this case, the ball changes its direction with that same speed immediately.
    Now, as you include ‘gravity’ to ‘ballSpeedVert’ and it has a negative value,
    it will begin getting close to 0, and eventually becoming 0 and then beginning
    to increase once more. This will make the ball to rise, then rise slower, stop
    and then begin falling.


    ![A ball bouncing indefinitely on a racket.](d2d_images/image226.png)


    If you are keen enough, you’d notice that our animation process has a problem-
    the ball does not stop bouncing. If we used a real-world scenario to look at it,
    we’d say that the ball would face friction and air resistance each time it came
    into contact with a surface. That is exactly the behavior we want the animation
    process to have. Implementing that is pretty easy. Just add the code below:


    ![image](d2d_images/image170.png)


    The animation process will produce something [like this](https://uploads.toptal.io/blog/image/125583/toptal-blog-image-1520329370572-9eebf4ce6165cb48c6a534ff74f8fe63.gif).


    ‘Friction’, as the name suggests, refers to the surface friction; ‘airfriction’
    on the other hand refers to friction of air. Obviously therefore, ‘friction’ needs
    to apply each time the ball comes in contact with any surface. Therefore, that
    is exactly what we did. The method ‘applygravity ()’ runs on every loop, you thus
    take away 0.0001 percent of its present value from ballSpeedVert on all loops.
    The methods ‘makeBounceTop ()’ and makeBounceBottom () run when the ball comes
    in contact with any surface. Therefore, we did the same thing in those method,
    only that we used ‘friction’ this time.


    Now create the racket


    You’ll now require a racket which the ball will bounce on. You should also be
    able to control the racket. We’ll make it controllable with a mouse. The code
    for that is as follows:


    ![image](d2d_images/image229.png)


    We defined the racket’s width, height and color as a global variable. You might
    want to see them change during the game. We implemented the ‘drawRacket ()’ method,
    which does exactly what its name suggests. You have to set ‘rectMode’ to center
    so that the racket gets aligned to your cursor’s center. Having created the racket,
    the next thing is making the ball bounce on it.


    ![image](d2d_images/image196.png)


    Click[ here](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)
    for the result:


    So, ‘watchRacketBounce ()’ ensures the racket and the ball collide. You need to
    check whether the ball and racket lined up horizontally and vertically. The initial
    if statement checks to see whether the X coordinate on the ball’s right side is
    more than that on its left and vice versa. In case it is, the second statement
    will check whether the distance between the ball and the racket is equal or smaller
    than the ball’s radius. If this conditions therefore meet, the method ‘makeBounceBottom
    ()’ is called and the ball bounces on the racket.


    The variables ‘pmouseY’ and ‘pmouseX’ store the mouse coordinates at the previous
    frame. Since the mouse is able to move really fast, it is possible you might not
    detect the distance between the racket and the ball right between the frames in
    case the mouse is moving quickly enough towards the ball. Therefore, we take the
    difference of the coordinates of the mouse between the frames and consider that
    while detecting the distance. The quicker the mouse moves, the more distance is
    tolerable.


    You also have to use ‘overhead’ for some other reason. We detect the path the
    mouse is moving my looking at the ‘overhead’ sign. If it’s negative, it means
    the mouse was underneath in the last frame, which means the racket is going upwards.
    You want to increase the ball speed and a bit further than the regular bounce
    in order to stimulate the impact of hitting the ball using the racket. In case
    ‘overhead’ is below 0, you’ve got to add it to bally and also ballSpeedVert to
    have the ball move faster, higher. Thus, the faster the ball is hit by the racket
    the faster and higher it moves.


    Moving horizontally and controlling the ball


    We’ll add horizontal movement to the ball here and then make it possible to control
    it horizontally using the racket.


    ![image](d2d_images/image176.png)


    Check the result [here](https://uploads.toptal.io/blog/image/125585/toptal-blog-image-1520330235372-2341594ab9fa4f732503079f15855467.gif).


