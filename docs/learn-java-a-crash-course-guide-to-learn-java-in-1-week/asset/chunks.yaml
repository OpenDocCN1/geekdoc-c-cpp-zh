    # Java Arrays


    ![image](d2d_images/chapter_title_below.png)


    When you hear the name ‘arrays’, think about a container that holds values or
    data of one type. For instance, you can have an array that holds 100 int type
    values. Array is an important Java construct that basically lets you store and
    conveniently access many values.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Declaring Arrays


    Let me now explain how you can declare arrays in Java:


    ![image](d2d_images/image102.png)


    In the example above, the dataType refers to a primitive data type such as char,
    int, byte, double and so forth or an object.


    The ‘arrayName’ on the other hand is an identifier.


    Let’s look at the example above once more:


    ![image](d2d_images/image172.png)


    In this case, data refers to an array that is able to hold values of the type
    ‘double’.


    How many elements therefore can this array hold? Since this hasn’t been defined
    yet, our next step will be allocating memory for the array elements.


    ![image](d2d_images/image201.png)


    The data array length is 10- this means that it can hold ten elements (in this
    case, it is 10 double values). You need to note that when the array length is
    defined, it can’t be changed in the program.


    We’ll take another example:


    ![image](d2d_images/image156.png)


    In this example, the age array is able to hold five values of the int type. You
    can be able to allocate and declare memory of an array in a single statement.
    You can also replace two statements above with one statement.


    ![image](d2d_images/image228.png)


