    ## Some Basics Of Classes


    Class or classification is a representation of an entity or something that is
    made up of behavior and state. The class’ state is the data associated with it
    and the class behaviors are those actions the class can perform.


    For instance, in classifying a simple vehicle, we can say that it has a model
    name, manufacturer name and a production year associated with it. You can also
    say that your simple car is able to accelerate and decelerate. In that case, you
    can define behavior and state with the rule below:


    The class’ state is simply what the class contains while the class’ behavior is
    what the class is able to do. You can create a simple specification for your class
    using the example I’ve just given as follows:


    ![image](d2d_images/image033.png)


    You need to note that nearly all the programming languages have a restriction
    on state entry names and behavior names from having spaces. For instance, manufacturer
    name isn’t a valid state entry name, `manufactuerName` is. The latter name is
    written in what is known as the camel case, in which the first letter in lower
    case and the rest of the letters are capitalized.


    We’ve achieved a basic description of a vehicle, even though it doesn’t have enough
    detail to be deemed important. For instance, what action is done when you want
    to accelerate the vehicle? Here, our class’ behaviors have been declared but are
    yet to be defined. A behavior declaration is a statement about the kind of behavior
    can be performed. The behavior definition is the statement about how the behavior
    is executed. For instance, adding a new state entry referred to as `currentSpeed`
    enables you to define your behaviors `accelerate` and `decelerate`


    ![image](d2d_images/image148.png)


    With the behavior definitions above, we are able to do some useful work with our
    class. As you would notice, the purpose of the behavior is altering the state
    of the class. This leads to a general rule concerning the class behavior: the
    purpose of the behavior allied with a class is either accessing or altering the
    class’ state. This rule is very important – so much that there is a metric designed
    to measure it: cohesion. Cohesion refers to the extent to which the state of a
    class and behavior relate to each other and work towards a common goal.


    Even though you know the way the vehicle accelerates and decelerates, you’ve only
    given a simplistic definition that does not account for an action that is unexpected.
    For instance, how about you begin with a current speed that is less than zero
    and decelerate? Generally, you should never be in a situation where the current
    speed is dropping below zero. This rule about the class state is known as an invariant.
    An invariant needs to stay true before a behavior is completed and afterwards
    as well. This logic can be supported by augmenting the current definition of deceleration
    like so:


