    # Installing Eclipse on Mac OS X


    Repeat the same process of downloading and installing Eclipse for windows explained
    above using [this link](http://www.eclipse.org/downloads/). Just ensure to select
    Mac OS X (cocoa). When you select ‘eclipse IDE for Java Developers’, you’ll get
    a DMG file. Double click this downloaded file (DMG) and follow the instructions
    given thereafter to install the program. The program will be installed in the
    location: `/applications/eclipse`.


    Note that you may alternatively download a TAR ball (.tar.gz); double click to
    be able to expand into a folder known as ‘eclipse’ and then drag this expanded
