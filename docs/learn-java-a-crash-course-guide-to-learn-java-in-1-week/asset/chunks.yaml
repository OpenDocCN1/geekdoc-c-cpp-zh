    ## 创建对象


    在 Java 中，对象是数据以及对可用数据进行操作的组合。对象包含行为和状态。这些都存储在变量或字段中，而函数或方法则显示对象的行为。类作为创建对象的模板。在
    Java 中，使用 `new` 关键字来创建对象。


    类为不同的对象提供了蓝图。在这种情况下，你从类创建一个对象，程序中的以下每条语句都会构建一个对象并为其分配一个变量。


