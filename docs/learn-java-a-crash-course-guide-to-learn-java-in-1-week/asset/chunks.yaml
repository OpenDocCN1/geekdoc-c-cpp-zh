    ## The Types


    All the variables need to have a type. You can either use the primitive types
    mentioned earlier such as Boolean, float or int or just use the reference types
    such as objects, arrays or strings.


    The variable names


    All variables follow some conventions and naming rules, regardless of whether
    they were fields, parameters or fields. You need to keep in mind that the same
    conventions and naming rules are used for class names and method, except that:


    *   The first class name letter needs to be capitalized and


    *   The first word or only word in a method name has to be a verb.


