    \n# Loops In Java\n\n![image](d2d_images/chapter_title_below.png)\n\nIn Java or\
    \ any other programming language, looping is a feature that facilitates the execution\
    \ of a set of instructions or functions recurrently as some condition evaluates\
    \ to true. Java offers three ways to execute the loops.\n\nEven as all the ways\
    \ offer the same basic functionality, they usually differ in terms of syntax and\
    \ the condition checking time.\n\n### While Loop\n\nThe `while` loop, to begin\
    \ with, is a flow control statement that lets code to be repeatedly executed according\
    \ to a particular Boolean condition. You can think of the `while` loop as repeating\
    \ the `IF` statement.\n\n![image](d2d_images/image073.png)\n\nTake a look at the\
    \ flowchart below:\n\n![while loop](d2d_images/image218.png)\n\nThe `while` loop\
    \ begins by checking the condition. If it evaluates to true, the loop body statements\
    \ automatically become executed, if not, the first statement following the loop\
    \ becomes executed. Therefore, it is for this reason that it is known as entry\
    \ control loop.\n\nWhen the condition evaluates to true, the loop statements get\
    \ executed. Usually, the statements have what’s known as an update value for the\
    \ specific variable that is under processing for the subsequent iteration.\n\n\
    If the condition turns false, the loop then terminates thus killing its life cycle.\n\
    \n![image](d2d_images/image108.png)\n\nWhen you run it on IDE, you get the following\
    \ output:\n\n![image](d2d_images/image181.png)\n\n### For Loop\n\nThis type of\
    \ loop offers a concise way to write the loop structure. Unlike the `while` loop,\
    \ the `for` statement uses up the initialization, increment and decrement, and\
    \ condition in one line, thus giving a shorter, easy to debug looping structure.\n\
    \n![image](d2d_images/image184.png)\n\nThe flowchart is as follows:\n\n![for-loop-in-java](d2d_images/image205.png)\n\
    \n#### Initialization condition\n\nIn this case, you initialize the variable being\
    \ used. It marks the beginning of a `for` loop. A variable that is already declared\
    \ can be put to use or a variable can get declared, that is local to loop alone.\n\
    \n#### Testing condition\n\nThis one is used to test a loop’s exit condition.\
    \ It must take back a Boolean value. It also acts as an entry control loop as\
    \ the condition gets checked before the loop statements are executed.\n\n####\
    \ Statement execution\n\nWhen the condition evaluates to true, the loop body statements\
    \ become executed.\n\n#### Increment/decrement\n\nThis one is used to update the\
    \ variable for the subsequent iteration.\n\n#### Loop termination\n\nIf the condition\
    \ is false, what happens is that the loop terminates to mark the end of its lifecycle:\n\
    \n![image](d2d_images/image071.png)\n\nWhen you run it on IDE, you get the following\
    \ output:\n\n![image](d2d_images/image075.png)\n\n### The Enhanced For Loop\n\n\
    Java also entails another `for` loop version that was introduced in Java 5. Enhanced\
    \ `for` loop offers an easier way of iterating through the elements of a collection\
    \ or array. It is rigid and you should use it only when you really need to iterate\
    \ through the elements in a sequence without being aware of the index of the currently\
    \ processed element.\n\n![image](d2d_images/image179.png)\n\nAs an example (a\
    \ demonstration of how you can use the enhanced for loop to simplify the work),\
    \ assume you have an array of names and want to print all the names contained\
    \ in the array. Let’s take a look at the difference between these two examples.\
    \ The enhanced for loop makes things easier in the following manner:\n\nRunning\
    \ it on IDE will give you the following output:\n\n![image](d2d_images/image082.png)\n\
    \n### Do while\n\nThe `do while` loop is largely the same as the `while` loop.\
    \ The only difference however is that it checks for condition once it executes\
    \ the statements and thus, it is a good example of the exit control loop.\n\n\
    ![image](d2d_images/image006.png)\n\nThe flowchart is as follows:\n\n![do-while](d2d_images/image147.png)\n\
    \nThe `do while` loop begins with the statement(s’) execution. For the first time,\
    \ there usually isn’t any checking of any condition.\n\nOnce the statements are\
    \ executed, and there is the update of the variable value, the condition gets\
    \ checked for a true or false value. In case it gets evaluated to true, the next\
    \ loop iteration commences.\n\nWhen the condition turns out to be false, the loop\
    \ is terminated and just like that, its life cycle.\n\n![image](d2d_images/image17.png)\
