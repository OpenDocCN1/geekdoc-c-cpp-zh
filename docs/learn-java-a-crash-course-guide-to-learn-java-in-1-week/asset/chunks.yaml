    Before we get to the specifics, let’s start by learning some of the common terms
    that you will encounter as you learn about Java, whether in this book or in any
    other learning material.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Understanding the Lingo: A Glossary


    ![image](d2d_images/chapter_title_below.png)


    While the following list is in no way comprehensive of all terms that you will
    come across when using and learning Java, it will give you a good starting point
    to ensure you understand what is being talked about.


    * `IDE` (Integrated Development Environment) - this refers to a software application
    that offers you comprehensive facilities for software development or basic programming.
    It usually comprises built automation tools, source code editor and a debugger.

    * `PATH` - in its general form (of a directory or file), path refers to the specific
    location in a file system.

    * `Source code repository` - this refers to a file archive and web hosting facility
    in which a huge amount of source code for web pages or software is stored, either
    privately or publicly. They are usually used by open-source software projects
    as well as certain multi-developer projects to deal with various versions.

    * `Refactoring` - this refers to a process of altering a software system in a
    way that it doesn’t change the external behavior of the code, but improves its
    internal structure.

    * `Unicode` - this refers to a 16-bit character encoding standard that is able
    to represent nearly all characters of well-known languages of the world.

    * `Compiler` - a compiler is a special program that is tasked with processing
    statements written in a programming language, and turns them into code (or machine
    language) that is used by the computer’s processor.

    * `Heap` - refers to a part of pre-reserved computer main storage or memory that
    a process of a program can access to store data in a given variable amount that
    cannot be known until the program runs.

    * `Syntax` - refers to the general set rules in a programming language that describe
    the combinations of symbols considered to be rightly structured programs in that
    particular language.

    * `Constructors` - they are special methods that are called when objects are instantiated,
    or when you make use of the `new` keywords.

    * `Modifiers` - these are keywords in Java that you add to classes, variables
    and methods to change their meaning.

    * `Naming convention` - refers to the rule that you follow to determine what to
    name your identifiers like package, class, constant, method or variable and so
    on.

    * `Object oriented programming (OOP)` - is a kind of computer programming in software
    design that allows programmers to define the data type of a data structure as
    well as the functions or types of operations that are applicable to the data structure.

    * `Access modifiers` - also referred to as access specifiers, access modifiers
    are keywords that set the accessibility of methods, classes among other members.
    They are a specific part of programming language syntax that facilitates component
    encapsulation.


    As I stated earlier, the above list is in no way comprehensive. It will however,
    prove useful at this point, as a larger list would have been overwhelming. You
    can always refer to this list if something is not clear.


