    在开始之前，你需要安装一个名为 [Java processing](https://atom.io/packages/processing) 的程序，它对于构建像我们今天今天要构建的这样的应用程序非常有帮助。简单解释一下它的功能：processing
    是一个开源项目，可以使用基本语法创建动画、交互式程序和绘图。它还包含一个基础 IDE，作为你编程的界面。通过 Processing，你可以创建一种额外的抽象层，从而遮盖掉某些普通初学者认为困难的特定
    Java 编程元素。


    注意：抽象让你能够更轻松地执行任务，尤其是当你对该主题没有太多背景知识时。如果你要用原生 Java 来构建或处理图像，那将会让你非常头疼。


    ![使用 Processing 语言编写简单的游戏。](img/image119.png)


    我们在这这一节中要构建的游戏是弹球游戏（Pong）、飞行小小鸟（Flappy bird）和打砖块的某种结合。我特别选择这个游戏是因为因为它包含了简单的概念，并且有助于他人理解，而这些概念往往让初学者在游戏开发方面感到困扰。你需要注意的是，首先制作出像具有多个关卡、实体、玩家等的平台类复杂游戏是非常困难的。随着我们的继续，你会发现代码变得复杂非常快，但好处是它通常组织良好且结构简单。只需缓慢阅读每一个部分，在需要明确概念时参考书中的区域，获取全部代码并在自己动手尝试玩玩，尽早开始思考你的游戏并开始实现它。让我们从基础知识开始。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)


    ## 如何构建 Flappy Pong


    ### 初始化不同的屏幕


    我们将从初始化项目开始。首先，我们将像大家通常做的那样编写 `setup` 和 `draw` 块——这里没什么新奇或花哨的！之后，我们将处理各种屏幕——这些包括游戏屏幕、初始屏幕、游戏结束屏幕等。但可能会出现问题：你如何确保在正确的时间显示正确的页面呢？


    完成这个任务非常简单。我们将使用一个全局变量来存储当前活动屏幕的信息。然后，我们将绘制正确屏幕的内容——但这取决于该变量。在 `draw` 块中，我们将包含一个
    `if statement`，它基本上会检查变量并相应地呈现屏幕内容。每当你想要更改屏幕时，我们会将变量更改为你要更改的屏幕，你需要将变量更改为你想要显示的标识符。如此，让我们概述一下你的骨架代码：


    ![image](img/image109.png)


    事实上，初看起来看起来可能很吓，但我所做的只是创建了基础结构并用注释块分隔了不同的部分。如你所见，为了显示每个屏幕，我们都定义了一个独特的方法。在你的 `draw`
    块中，在调用相应方法之前，只需检查变量 `gameScreen` 的值。当涉及到 `void mousepressed() {...}` 这部分时，你基本上是在监听鼠标点击，并且如果活动屏幕是
    0（即初始屏幕），你就调用 `startGame()` 方法，它将如你预期的那样开始游戏。该方法的起始行将变量 `gameScreen` 改为 1——即游戏屏幕。当你理解了这一点，下一步要做的事情就是实现你的初始屏幕。你将通过编辑
    `initScreen()` 方法来实现此。它的写法如下：


    ![image](img/image048.png)


    初始屏幕现在有一个黑色背景，以及一个写着“点击开始”的简单文本，位于中间并居中对齐。然而，当你点击时，什么都没有发生。你还没有为你的游戏屏幕指定任何内容，`gameScreen()`
    方法内部是空的——这意味着你还没有通过将 `draw` 的第一行设置为 `background()` 来覆盖从上一个屏幕绘制的早期内容（即文本）。这就是为什么文本仍然在那里，尽管
    `text()` 行已不再被调用了。由于相同的原因，背景仍然是黑色的。我们将继续开始实现游戏屏幕。


    ![image](img/image008.png)


    一旦你完成了此更改，你会发现背景变成了白色且文本消失了。


    ### 创建球并实现重力


    我们现在开始在游戏屏幕上进行操作。我们将从创建球开始。现在，你必须为它的颜色、坐标和大小定义变量，因为你可能在以后某个时候更改这些值。例如，如果你想在玩家得分更多时增加球的大小以增加游戏难度，你就需要修改它的大小，因此它必须是一个变量。一旦实现了重力，你还将定义球的速度。从添加下面的代码开始：


    ![image](img/image043.png)


    我们将坐标定义为全局变量，构建了一个绘制球的方法（该方法从 `gameScreen` 方法调用），但我们之前在 `setup()` 中定义了它们。这样做的主要原因是为了让球从左侧四分之一处开始，从顶部五分之一处开始。我无法给出为什么想要那样的特定原因，但通常来说，那是球的一个很好的起点。因此，我们需要在画布上动态获取
    `height` 和 `width`。`setup()` 定义了画布的大小，就在第一行之后。在运行 `setup()` 之前 `height` 和 `width`
    尚未设置，这就是为什么如果你在顶部定义变量就无法这样做。


    #### 重力


    进入简单部分：让我们使用一些技巧来实现重力——以下首先是实现代码。


    ![image](img/image005.png)


    [点击此处](https://uploads.toptal.io/blog/image/125581/1520329291432-3a4c567c0a904389c4c4f1b860675d94.gif)
    查看预期结果。


