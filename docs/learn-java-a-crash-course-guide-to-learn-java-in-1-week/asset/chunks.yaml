    \ You can also define another action that can be carried out the the first condition\
    \ is false. The conditions above are quite self-explanatory since they are evident\
    \ in our day-to-day use of computers.\n\n### ELSE IF Statements\n\nThe other version\
    \ of these statements is known as:\n\n### The If-Statements\n\nLet’s use the device\
    \ we mentioned third to look at how an else-if statement works.\n\n![image](d2d_images/image215.png)\n\
    \nBesides the if/else, Java also lets you test other conditions by using `else\
