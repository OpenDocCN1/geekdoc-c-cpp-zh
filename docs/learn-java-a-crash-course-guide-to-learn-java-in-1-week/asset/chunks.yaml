    ## Primitive Types


    As you declare the state entries for the class in terms of other classes, we’ll
    eventually come to a point where you can no longer reference another class without
    having a cyclical hierarchy. For instance, if you try assigning a type of `number`
    to the state `currentSpeed`, how then do you define the class `number`? If you
    try defining it in terms of other classes, how do you, therefore, define those
    classes? Since you cannot let a type system that accepts such infinite regression,
    you need to declare a value or values to exist. Such axiomatic types are known
    as primitive types.

