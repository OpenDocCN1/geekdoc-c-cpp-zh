    Here, n represents the number of bits required- for instance, the byte data type
    requires 1 byte= 8 bits. Thus, the range of values, which can be kept in the byte
    data type is as follows:


    −(2^(8−1)) to (2^(8−1))−1= −2⁷ to (2⁷) -1


    *   Floating point numbers/data types


    These are data types we use to denote the numbers with a fractional part. The
    single precision floating point numbers usually use up 4 bytes while the double
    precision floating point numbers use up 8 bytes. We have two sub-types here:


    ![image](d2d_images/image031.png)


    *   Boolean


    The Boolean data types basically store values with two states: false or true


    Take the examples below to understand better:


    *   34.43


    *   5322


    *   ‘d’


    *   Null


    *   True


