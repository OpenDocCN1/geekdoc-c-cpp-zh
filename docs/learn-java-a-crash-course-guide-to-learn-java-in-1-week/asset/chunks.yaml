    我确定你可能在怀疑你对物理学的理解是否受到了威胁。我知道在现实生活中，重力的作用方式并非如此。请仅将此视为一个动画过程。变量 `Gravity` 只是一个数值——一个
    `float`（浮点数），这使得我们可以使用小数而不仅仅是整数——在每个循环中，我们将其加到 `ballSpeedVert` 上。实际上，`ballSpeedVert`
    代表球的垂直速度，它在所有循环中都会赋给球的 Y 坐标（`bally`）。你通过观察球的坐标来确保它留在屏幕内，如果你不这样做（你可能已经知道了），球将无止境地掉落下去。


    不过目前，球只在垂直方向上移动。这意味着我们要观察屏幕上地板和天花板的边界。通过 `keepInScreen ()` 方法，我们检查 `bally` 或 `+`
    半径是否小于 `height`，同样地，`bally` 或 `–` 半径是否大于 0。如果条件不满足，你可以使用 `makeBounceTop ()` 和
    `makeBounceBottom ()` 方法让球反弹（直接从底部或顶部）。我们可以让球移动到它必须反弹的位置，然后获取垂直速度或 `ballSpeedVert`
    与 `-1` 的乘积（注意乘以 -1 时符号会发生变化）。当速度值变为 `–` 号时，意味着当你加上 Y 坐标时，速度将变为 `bally–ballSpeedVert`，即通过
    `bally+(-ballSpeedVert)` 。在这种情况下，球会以相同的速度立即改变方向。现在，当你将 `gravity` 加入到 `ballSpeedVert`
    且它是负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后变慢，停止，然后开始下落。


    ![一个球在球拍上不断反弹。](img/image226.png)


    如果你足够仔细，你会注意到我们的动画过程有一个问题——球没有停止反弹。如果我们用现实世界的场景来看，我们会说球每次接触表面时都会面临摩擦力和空气阻力。这正是我们希望动画过程具备的行为。实现这一点非常简单。只需添加以下代码：


    ![image](img/image170.png)


    动画过程将产生[类似这样的效果](https://uploads.toptal.io/blog/image/125583/toptal-blog-image-1520329370572-9eebf4ce6165cb48c6a534ff74f8fe63.gif)。


    `Friction` 顾名思义指的是表面摩擦；而 `airfriction` 指的是空气阻力。因此，`friction` 需要在球每次接触任何表面时应用。因此，这正是我们所做的。`applygravity
    ()` 方法在每个循环中运行，因此你在所有循环中都会从 `ballSpeedVert` 中减去其当前值的 0.0001 %。`makeBounceTop ()`
    和 `makeBounceBottom ()` 方法在球接触任何表面时运行。因此，我们在这些方法中做了相同的事情，只是这次我们使用了 `friction`。


    ## 创建球拍


    现在你需要一个球会在上面反弹的球拍。你还应该能够控制这个球拍。我们将用鼠标使其变得可控。相关代码如下：


    ![image](img/image229.png)


    我们将球拍的宽度、高度和颜色定义为全局变量。你可能想在游戏期间看到它们的变化。我们实现了 `drawRacket ()` 方法，它的功能正如其名。你必须将
    `rectMode` 设置为 center（居中），这样球拍就能对齐你的光标中心。创建球拍后，下一步是让球在它上面反弹。


    ![image](img/image196.png)


    点击[这里](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)
    查看结果：


    所以，`watchRacketBounce ()` 确保了球拍和球碰撞。你需要检查球和球拍在水平和垂直方向是否对齐。初始的 `if` 语句检查球右侧的 X
    坐标是否大于左侧，反亦然。如果是这样，第二个语句将检查球与球拍之间的距离是否等于或小于球的半径。如果这些条件满足，就会调用 `makeBounceBottom
    ()` 方法让球在球拍上反弹。


    变量 `pmouseY` 和 `pmouseX` 存储上一帧的鼠标坐标。由于鼠标移动得非常快，如果鼠标向球移动的速度足够，你可能无法在帧之间检测到球拍和球之间的距离。因此，我们获取帧与帧之间鼠标坐标的差并在检测距离时考虑这一点。鼠标移动得越快，考虑的距离就越大。现在，当你将
    `gravity` 加入 `ballSpeedVert` 且它是负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后变慢，停止，然后开始下落。


    `pmouseY` 和 `pmouseX` 存储上一帧的鼠标坐标。由于鼠标能够移动得非常快，如果鼠标向球移动的速度足够，你可能无法在帧之间检测到球拍和球之间的距离。因此，我们获取帧与帧之间鼠标坐标的差并在检测距离时考虑这一点。鼠标移动得越快，考虑的距离就越大。


    ## 水平移动与控制球


    我们将为球添加水平移动并并使其可控。


    ![image](img/image176.png)


    查看[这里](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)


    这种思路与垂直移动相同。我们创建了水平速度变量 `ballSpeedHorizon`。然后我们创建了 `ballSpeedHorizon`，并编写了一个在空气阻力作用将水平速度应用到球上的方法。此外，我们在
    `keepInScreen ()` 方法中增加了两个 `if` 语句，用于观察球撞击左右边缘。最后，我们确保从左到右的反弹由 `makeBounceRight
    ()` 和 `makeBounceLeft ()` 处理。


    ## 创建墙


    现在我们将添加向左移动的墙。


    ![image](img/image045.png)


    ![image](img/image192.png)


    [这是结果](https://uploads.toptal.io/blog/image/125587/toptal-blog-image-1520330276517-1ff10f2d45712eb1d582e1fd6b308115.gif)。


    你首先需要注意的是 `ArrayList`，它是列表的一种简单实现，行为类似于数组。但它是可调整大小的，并且包含了许多强大的方法，如 `list.remove
    (index)`、`list.add (index)` 和 `list.get (index)`。我们将墙数据以整数数组的形式存储在 ArrayList 中。存储在数组中的数据用于两面墙之间的间隙。


