  trans: '


    实际墙体是根据间隙墙（gap wall）的值绘制的。你需要注意的是，使用类来处理这些会更加整洁、更好。不过，我们将这样处理：我们有两个用于管理墙体的基础方法：`wallHandler`
    和 `wallHandler()`。后者每隔 `wallInterval` 毫秒向 `arraylist` 添加一个新墙体。我们有一个全局变量 `lastAddTime`，用于存储最后添加的墙体。如果当前毫秒数
    `millis()` 减去上次添加的毫秒数——`lastAddTime`——大于间隔值——`wallInterval`——这本质上意味着你必须添加一个新墙。然后，根据顶部定义的全局变量生成随机间隙变量。接着，一个新墙被添加到
    `arraylist` 中，并将 `lastAddTime` 设置为当前的 `millis()`。`wallHandler()` 遍历 `arraylist`
    中的当前墙，并根据 `arraylist` 的索引值对每个项目调用 `wallRemover(i)`、`wallDrawer(i)` 和 `wallMover(i)`。


    `wallDrawer` 根据间隙墙数据绘制墙体。`wallDrawer` 通常会在调用 `rect()` 方法在墙体所需位置进行绘制之前，从 `arraylist`
    获取墙体数据数组。`wallMover` 直接从 `arraylist` 获取元素，并根据全局变量 `wallSpeed` 改变其 X 位置。`wallRemover`
    将超出屏幕的墙从 `arraylist` 中移除。当墙从 `arraylist` 中移除时，它就不会在后续的所有循环中被绘制。


    我们现在必须检测墙体和球之间的任何碰撞：


    ![image](img/image112.png)wat


    在所有循环中，每个墙都会调用 `hWallCollision()` 方法。你获取间隙墙的坐标，计算实际墙的坐标（从上到下），然后检查球的坐标是否与墙体碰撞。


    ## 健康与得分


    我不知道你们怎么想，我觉得我们应该在顶部有一个血条。当球碰到墙壁时，它应该损失生命值。然而，让球从墙壁反弹回来的逻辑并不合理。当生命值为 0 时，游戏应该结束。


    ![image](img/image161.png)


    简单的运行效果可以在[这里](https://uploads.toptal.io/blog/image/125588/toptal-blog-image-1520330296635-cc0246c60c78d04e1de1bf597ca0124f.gif)查看。


    我们创建了全局变量 `health`，然后使用 `drawHealthBar()` 方法画画两个矩形。第一个是基础血条，另一个是显示当前生命值的激活条。第二个宽度是动态的，通过公式
    `healthBarWidth*(health/maxHealth)` 计算，即当前生命值相对于血条宽度的比例。填充颜色现在根据生命值的值设置。至于得分：


    ![image](img/image068.png)


    ![image](img/image107.png)


    当球穿过墙壁时，我们需要得分。我们还需要确保每面墙最多加 1 分。这意味着如果球穿过一堵墙然后又回来再次穿过，不应该再次增加分数。为了实现这一点，我们在 `arraylist`
    的间隙墙数组中添加了另一个变量。如果球还没有通过那面墙，新变量将存储 0，如果已经通过则存储 1。然后，我们对 `watchWallCollision()`
    方法进行了修改。我们包含了一个条件，当球穿过一面之前没有穿过的墙时，触发 `score()` 方法并将该墙标记为已通过。


    我们现在需要做的最后一件事是在屏幕上实现“点击重启”。我们必须将所有使用的变量恢复到初始值，然后重启游戏：


    ![image](img/image164.png)


    我们[现在添加一些颜色](https://uploads.toptal.io/blog/image/125589/toptal-blog-image-1520330324780-fc506d34607110fd1c14f57150cac7b8.gif)。


    成功！我们现在有了属于自己的 flappy pong。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 结


    ![image](img/chapter_title_below.png)


    我们已经到达本书的结尾。感谢你的阅读，祝贺你读到了最后。


    我真心希望你现在掌握了足够的 Java 知识，可以作为进一步学习的跳板。


    谢谢你并祝你好运！


    '
