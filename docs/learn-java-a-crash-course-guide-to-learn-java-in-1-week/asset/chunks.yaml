    a horizontal speed variable. We then created ballSpeedHorizon, a horizontal speed
    variable and also made a method that applies the horizontal speed to the ballx
    while removing air friction. Also, we added another two if statements to the method
    ‘keepInScreen ()’ that is meant to watch the ball for hitting the right and left
    screen edges. Lastly, we made sure the bounces from left to right are handled
    with methods ‘makeBounceRight ()’ and ‘makeBounceLeft ()’.


    Having added horizontal space to the game, the next thing is controlling the ball
    using the racket. The ball needs to move right based on the point on the racket
    that it hits. The racket edges should give it more horizontal speed:


    ![image](d2d_images/image097.png)


    Here’s [the result](https://uploads.toptal.io/blog/image/125586/toptal-blog-image-1520330256237-d2755bb139e1e1b9671880932d9234bb.gif).


    What you did is determine the distance of the point the ball hits from the racket’s
    middle using ‘ballX-mouseX’. We then make it the horizontal speed. The difference
    isn’t that much- I figured one tenth of the value is ideally natural.


    Create the walls


    We’ll now add walls that move towards the left.


    ![image](d2d_images/image045.png)


    ![image](d2d_images/image192.png)


    [This is the result](https://uploads.toptal.io/blog/image/125587/toptal-blog-image-1520330276517-1ff10f2d45712eb1d582e1fd6b308115.gif).


    The first thing you need to note is the ‘ArrayList’, which is simply an implementation
    of the list and behaves like an Array. It however is resizable and contains great
    methods such as list.remove (index), list.add (index) and list.get (index). We
    store the wall data as arrays of integers inside the arraylist. The data we store
    in the arrays is meant for the gap in between 2 walls. Our arrays have these values:


    ![image](d2d_images/image022.png)'
