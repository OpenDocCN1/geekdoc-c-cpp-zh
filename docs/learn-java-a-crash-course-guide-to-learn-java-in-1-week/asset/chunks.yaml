    ## The Access Modifiers


    The first and left-most modifier that is used enables you control what the other
    classes can access a member field. At the moment, you can consider private and
    public modifiers.


    The public modifier has the field that can be accessed from all classes.


    The private modifier has the field that can only be accessed within its own class.


    In light of encapsulation, you’ll find it common to make fields private, which
    means that they can only be accessed directly from the class ‘bicycle’. Nonetheless,
    you still require accessing these values- something that can be indirectly achieved
    by adding public methods, which obtain for you the field values:


    ![image](d2d_images/image225.png)


