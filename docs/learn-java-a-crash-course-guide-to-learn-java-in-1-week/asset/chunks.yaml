    ## Problems With Multiple Inheritance


    Java allows multiple inheritance with interfaces. This was not an issue until
    Java 7 as interfaces could only be able to define abstract methods (those methods
    that lack implementation). Therefore, if a class implemented multiple interfaces
    using the same method signature, it wasn’t an issue; the implementing class eventually
    had only a single method to implement.


    Let’s now take a look at the way the simple equation changed when the `default`
    methods in interfaces were introduced with Java 8.


    Beginning with Java 8, the interfaces had an option of defining its methods’ default
    implementation - that is an interface is still able to define the abstract methods.
    This means that when a class is implementing multiple interfaces that define methods
    having the same signature, the child class would actually inherit different implementations.
    This is not allowed just as it sounds complex.


    Java doesn’t allow multiple implementations’ inheritance of the same methods that
    are defined in separate interfaces. Let me explain with an example:


    ![image](d2d_images/image141.png)


    If you desire to implement the two interfaces, you’ll have to override the method
    `repair()`. If the interfaces in the earlier example are defining the variables
    with the same name- for instance, `duration`, you cannot be able to access them
    without having the interface name preceding the variable name:


    ![image](d2d_images/image151.png)


    ## Interfaces That Extend Other Interfaces


    An interface can basically extend multiple interfaces as the example below explains


    ![image](d2d_images/image235.png)


    An interface will inherit other interfaces by using the `extends` keyword. The
    classes use the `implements` keyword in inheriting an interface.


    ## Inheriting Type


    When a class inherits another one or interfaces, besides inheriting their members,
    it tends to inherit their type as well. This equally applies to an interface inheriting
    other interfaces. This is one very powerful concept that lets developers program
    to an interface-that is interface or base class- rather than programming to their
    implementations –either derived or concrete classes.


    As an example, try to picture a condition in which an organizations is maintaining
    a list of the cars its employees own. All the employees definitely have different
    models. In this case, how can you refer to the different car instances? The solution
    lies in the example below:


    ![image](d2d_images/image149.png)


    Since all the `Car` derived classes inherit the type `Car`, the class instances
    that are derived can be referred with a variable of class `Car`.


    ![image](d2d_images/image202.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Encapsulation In Java


    ![image](d2d_images/chapter_title_below.png)


    Encapsulation refers to the ability to package related behavior in an object bundle
    and control or restrict their access in both function and data from other objects.
    It essentially is all about packaging related stuff together and keeping them
    away from external elements. You will note that keywords encapsulation along with
    data hiding are used interchangeably all over. You should not misunderstand that
    encapsulation is only about data hiding. When you say encapsulation, you should
    emphasize on grouping, packaging or even bundling related data as well as behavior
    together.


    ![encapsulation](d2d_images/image060.jpg)


    When you assign a class in object oriented programming, it is said that the first
    principle you should consider is encapsulation. Group the associated data and
    its behavior in a bucket. The main benefit of encapsulation is maintainability.


    Believe it all or not, that’s pretty much it when it comes to encapsulation! You
    can leave it as simple as that with nothing more or less.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Java Encapsulation


    Any Java class that is well defined in its context domain is a good example for
    Java encapsulation. Thus, the essence here is basically for bundling methods and
    data together only after this data hiding is highlighted. The term data hiding
    in this case relates to the access specifiers in Java. It is easier to hide an
    attribute or method from the outer word by using the access specifier `private`.


    Therefore, hiding is quite plain and simple. But how about bundling method and
    data? This in particular is important. You have to understand well the business
    domain and design the class and group attributes, as well as its methods together
    based on that. This process is vital in encapsulation.


    Take the Java encapsulation outline example below. When you talk about an animal,
    you should have all its attributes listed as well as its behavior such as how
    it will run, mate, hunt and so forth. When you bundle all these behavior and data
    in one class, you are essentially following the principles of encapsulation.


    ![image](d2d_images/image013.png)


    NOTE: there is a line of difference between encapsulation and abstraction. You’ll
    understand that easily with a simple example and the next tutorial on abstraction
    will give you a better insight into that. Just make sure to practice encapsulation
    as you design the classes.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## Abstraction In Java


    Abstraction is the situation where you hide the implementation details and only
    show the functionality; in Java, abstraction is achieved by use of interface and
    abstract class. Interface will give you 100% abstraction and the abstract will
    offer you 0-100% abstraction.


    When you are in the streets and spot a nice vehicle on the road, you only get
    to see the entire picture; the car is only a single unit. You don’t see the core
    of it: the complex mechanical engineering behind it.


    Now imagine yourself going to a showroom to purchase a car. What are you seeing
    now? You are seeing a powerful engine, four wheels, and the steering wheel and
    so on. You can now see the car for what it really is- at its high components.
    But even so, we have so much inside it that gives the car its completeness. Now
    imagine you are the mechanic who’s going to service the vehicle, you’ll get to
    see it one more level deeper with another level of information.


    ### Abstraction in Object Oriented Programming


    Generally speaking, the software language itself is a good example for the concept
    of abstraction. When you write a statement in the following way:


    ```

    a=b+c

    ```


    You are adding two values that are stored in 2 different locations then moving
    ahead to store the product in a brand new location. You just describe it in a
    form that easily understandable by human beings. What goes on beneath? We have
    instruction sets, registers, program counters, storage units and so forth involved.
    We have `POP`, `PUSH` taking place. High level language that we use tends to abstract
    these complex details.

