    Before you begin, you need to install a program known as [Java processing](https://atom.io/packages/processing)
    that is useful in building applications like the one we are going to build today.
    Just to explain a bit what it is, processing is open source and creates animations,
    interactive programs, drawings using basic syntax. It also includes the basic
    IDE that works as the interface for your programming. With Processing, you are
    able to create an extra abstraction to sort of mask particular Java’s programmatic
    elements that an average beginner would deem difficult.


    NOTE: abstraction lets you perform stuff with more ease especially when you don’t
    have much background knowledge on the subject. If you were to build or process
    images in plain Java, you’d have a really painful headache.


    ![Build a simple game with the Processing language.](d2d_images/image119.png)


    The game we are about to build in this section is some kind of combination of
    Pong, Flappy bird and brick breaker. I picked this game particularly because it
    entails simple concepts and works to bring sense to others, which have been giving
    beginners a problem with regards to game development. You need to note that it
    is very difficult, first of all, to make complex games like platform games that
    have multiple levels, entities, players and so on. As we continue, you will see
    the way the code gets complicated really fast but the good thing is that it is
    generally well organized and simple. Just follow the piece slowly, making reference
    to areas in the book for concepts that need clarity, grab the entire code and
    play with it on your own as you begin pondering about your game soonest possible,
    and begin to implement it. Let’s begin with the basics.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## How To Build Flappy Pong


    ### Initialize the different screens


    We’ll begin by initializing the project. First of all, we’ll write the `setup`
    and `draw` blocks as anybody would normally do- so nothing new or fancy here!
    After that, we’ll handle the various screens- these include the game screen, initial
    screen, game over screen and so forth. The question may arise though: how do you
    ensure the right page is shown at the right time?


    It is quite simple to accomplish this task. We’ll have a global variable storing
    the information of the screen that is active at the current time. We’ll then draw
    contents of the right screen- this however depends on the variable. In the `draw`
    block, we’ll include an `if statement` which basically checks the variable and
    then presents the screen contents accordingly. Each time you want to change the
    screen, we’ll change the variable to the screen you’ll have to change the variable
    to the identifier you want displayed. That said, let’s have an overview of how
    your skeleton code is:


    ![image](d2d_images/image109.png)


    Indeed, that may appear scary in the beginning but all I’ve done is create the
    basic structure and separate the different sections with comment blocks. As you
    can see, for every screen to display, we define a distinct method. In your `draw`
    block, you simply check the value of your variable `gameScreen` before calling
    the corresponding method. When it comes to the part `void mousepressed() {...}`,
    you are basically listening to mouse clicks and in case the active screen is 0-
    the initial screen- you call the method `startGame()` which then begins the game
    as you would expect. This method’s initial line changes the variable `gameScreen`
    to 1—the game screen. When you understand this, the next thing you have to do
    is implement your initial screen. You will be editing the method `initScreen()`
    to do that. It goes like this:


    ![image](d2d_images/image048.png)


    The initial screen now has a black background and a simple text reading ‘click
    to start’ that is right in the middle and aligned to the center. Nonetheless,
    when you click, nothing happens. You have not yet specified any yet for your game
    screen, the `gameScreen()` method does not have anything in it- which means that
    you are not covering the earlier contents drawn from the previous screen – which
    is the text- by having the first line of draw being `background()`. This is exactly
    why the text is still there, even though the line `text()` is no longer being
    called. For the same reason, the background is still black. We’ll go ahead and
    start implementing the game screen.


    ![image](d2d_images/image008.png)


    Once you complete this change, you’ll notice the background turning white and
    the text disappearing.


    ### Create the ball and implement gravity


    We’ll now begin operating on the game screen. We’ll start by creating our ball.
    Right now, you have to define variables for its color, coordinates and size since
    you might want to change these values sometime later. For example, if you want
    to increase the ball’s size as the player scores more so that the game is more
    difficult, you’ll need to alter its size, so it has to be a variable. You’ll define
    the ball’s speed as well, once you implement gravity. Begin by adding the code
    below:


    ![image](d2d_images/image043.png)


    We have the coordinates defined as global variables, built a method that draw
    the ball, caked from the method `gameScreen` but we had them defined in `setup()`.
    The main reason for doing that is so that the ball starts from the left by one
    fourth and from the top by one fifth. I cannot give a particular reason as to
    why I want that but generally, that is a great point for the ball to start. Therefore,
    we needed to have the `height` and `width` dynamically on the sketch. `setup()`
    defined the size of the sketch, right after the first line. The `height` and `width`
    aren’t set before the running of `setup()` and that is why you could not do this
    if you defined the variables on top.


    #### Gravity


    On to the easy part: let’s use a few tricks to implement the gravity- the following
    comprises the implementation first.


    ![image](d2d_images/image005.png)


    [Click here](https://uploads.toptal.io/blog/image/125581/1520329291432-3a4c567c0a904389c4c4f1b860675d94.gif)
    to see the expected result.

