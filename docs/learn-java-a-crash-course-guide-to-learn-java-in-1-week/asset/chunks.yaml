    `-num1` happens to be a complement operator that only changes the bit from 0 to
    1 and 1 to 0. In the example we have here, it returns `-12`. This one is signed
    8 bit equal to `11110100`.


    `Num 1 <<2` is a left shift operator, which is responsible for transferring the
    bits towards the left hand side and discards the bit that is far left, before
    assigning zeros to the rightmost bit. In the case here, the output is `44`. This
    figure is equivalent to `00101100`.


    You need to note that in the example we have below, we are giving out `2` to the
    right hand side of the shift operator, which is the reason the bits are going
    2 places towards the left hand side. You can change this number and the bits would
    have to be moved by the specified number of bits on the operator’s right hand
    side. The same applies to the operator in the right side.


    `Num1 >> 2` is a right shift operator, which usually has a tendency of moving
    the bits to the right before discarding the far right bit, before then assigning
    the leftmost bit a value of `0`. In the case here, the output is `2`, which is
    equal to `00000010`.


