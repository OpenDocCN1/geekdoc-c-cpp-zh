    # Java 编程：背景


    ![image](img/chapter_title_below.png)


    在我们进入 Java 编程之前，让我们先确保你理解计算机编程（或编码）到底是什么。


    ## 什么是编程？


    根据定义，编程是构建软件的过程，软件由指令组成。这些指令基本上被称为 `source code`（源代码）。`source code`是一组计算机理解的编写指令。在整书中，我们将使用这个概念，因此在开始之前你需要理解它。


    ## 源代码实际上看起来是什么样的？


    代码通常不遵循自然语言（如英语）的规则。看看这个小程序来理解我的意思：


    ![image](img/image187.png)


    计算机实际上是字面意思理解一切的——例如，当你问计算机一个数字是偶数还是奇数时，它总是回答“是”。不相信我的话？看下下面的代码：


    ![image](img/image171.png)


    代码将显示‘true’，从技术上来说是对的。数字 5 要么是偶数也是奇数——尽管这并不是我的真实本意。


    ## 编程还涉及测试和调试


    代码编写完成后，必须进行测试，因为仅仅编写代码并不能保证它是正确的。代码可能会偶尔崩溃、显示错误的结果、冻结或任何其他问题。专业程序员通常采用不同的方法来测试他们的代码，以试图避免此类问题。


    最后，我们有一个称为 `debugging`（调试）的术语——这是在 `source code` 中调查问题、诊断并修复问题的过程——正如你很快会在书中发现的那样，这本身就是一种技能。


    ## 那么，什么是 Java 编程语言？


    Java 编程语言是一种计算机编程语言，它独特地让你使用英语命令来编写计算机指令，而不是使用通常的代码。由于人类可以阅读和编写它，它被称为高级语言。尽管像英语一样，Java
    也有一些规则规定如何编写这些指令；这些规则被称为 `syntax`（语法）。基本上，当程序编写时，高级指令会被转换为计算机理解并执行的代码。


    ### 那么，是谁创建了 Java？


    Java 是 90 年代初由名为 James Gosling 的人为名为 Sun Microsystems 公司（现由 Oracle 所有）创建的。该程序最初被称为
    Oak，后来改为 Green。


    Java 最初设计用于为由不同计算机处理器控制的家用电器编程，随后用于手机等移动设备。很快，人们意识到这种语言需要被各种计算机处理器访问。1994 年，这种语言被认为是网络浏览器的理想选择，很快就与互联网产生了联系。1995
    年，Netscape 公司发布了能够运行 Java 程序的最新版 Netscape 浏览器，1996 年当 Java 1.0 向公众发布时，其主要焦点已经转向互联网，通过为开发者提供创建动画网页的良好方法实现了与用户的交互。


    从 1.0 版本以来，我们看到了许多更新和发展，例如：


    * J2SE 1.3 于 2000 年发布

    * J2SE 于 2004 年

    * Java SE 8 于 2014 年

    * Java SE 10 于 2018 年


    Java 多年来来无疑已经演变成了一种可以在互联网内外使用的非常优秀且成功的语言。让我们接触一下使用 Java 编程语言的优点：


