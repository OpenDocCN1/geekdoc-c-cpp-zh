    ## Types


    We now have a more class specification, but don’t have a major element. When you
    examine the state entry, this deficiency becomes evident: what are the units for
    current speed? One kilometer per hour? One mile per hour? In this case, we’ve
    not limited its value to be distance per time. Given the specification, we need
    to link a type with every state entry to be able to better specify our class.


    What exactly is a number?


    Well, a number holds a value and has the ability to perform such actions as multiplying
    itself with another number or even adding another number to itself. You could
    essentially build a class specification for a number if you so wished.


    ![image](d2d_images/image220.png)


    Now that there is an understanding of types, we can now update our vehicle class
