    a base class known as `Car`:


    ![image](d2d_images/image131.png)


    The `ArmoredCar` class is able to inherit the `Car` class members in its declaration
    with the keyword `extends`:


    ![image](d2d_images/image021.png)


    In Java, the classes support single inheritance; the class `ArmoredCar` cannot
    extend many classes. When the keyword `extends` is not available, a class inherits
    the class `java.lang.Object` implicitly.


