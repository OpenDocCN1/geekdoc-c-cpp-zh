    # 在 Windows 上安装 Java 版 的步骤


    ### 下载 Eclipse


    访问[此链接](https://www.eclipse.org/downloads/) 并下载最新版本：


    ![image](img/image094.png)


    点击“get eclipse photon”下方的“download packages”（下载包）。作为初学者，你应该选择第四项“eclipse IDE for
    Java Developers”（32 位或 64 位）。


    ![image](img/image093.png)


    点击下载。


    下一步是解压下载的文件以进行安装。将文件解压到指定的目录（例如，`c:\javaproject`）。


    你不需要运行任何安装程序。更重要的是，当你不再需要它时，可以直接删除整个 eclipse 目录（无需运行“卸载程序”）。可以随意重命名或移动该目录。此外请注意，你可以在同一台机器上解压（安装）多个副本。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)


    # 在 Mac OS X 上安装 Eclipse


    使用[此链接](http://www.eclipse.org/downloads/) 重复上述的下载和安装 Windows 版 Eclipse 的过程。只需确保选择了
    Mac OS X (cocoa)。当你选择“eclipse IDE for Java Developers”时，将得到一个 DMG 文件。双击此下载的文件
    (DMG) 并按照随后提供的说明安装程序。程序将安装在位置：`/applications/eclipse`。


    注意，你也可以下载下载 TAR 包 (.tar.gz)；双击即可将其扩展为名为“eclipse”的文件夹，然后将此扩展文件夹拖入“applications”文件夹。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)


    # 在 Ubuntu Linux 上安装 Eclipse


    通过[此页面](http://www.eclipse.org/downloads/) 下载 Java 版 Eclipse。像往常一样，下载“packages”，对于平台选择“Linux”，然后为
    Java SE 程序开发选择“eclipse IDE for Java developers”。你将在下载文件夹中获得一个 .tar 包，安装将位于 `/usr/local`。


    ![image](img/image173.png)


    要运行 Eclipse，只需打开文件夹 `/usr/local/eclipse` 然后点击图标 `Eclipse`；或者直接启动终端并输入 `Eclipse`。


    ### 在启动器上锁定 Eclipse


    启动程序并右键点击 Eclipse 图标，然后点击“锁定到启动器”（lock to launcher）。如果你使用的是较旧版本（因此上述方法无效），只需创建一个名为
    `/usr/share/applications/eclipse.desktop` 的文件，内容如下：


    ![image](img/image084.png)


    ### 现在你可以在 Eclipse 中编写你的第一个 Java 程序或项目


    从安装了 Eclipse 的目录启动 Eclipse（运行 `eclipse.exe`），然后为工作空间选择一个合适的目录——即你想保存文件的地方（例如 Windows
    下的 `c:\javaproject\eclipse`）。


    如果弹出名为“welcome”（欢迎）的窗口，点击“welcome”标题旁标有“cross”（交叉）按钮。


    对于所有的 Java ，你必须创建一个项目来包含所有的类（稍后会讨论）、源文件和重要资源。


    执行以下操作创建项目：


    *   选择“file”（文件）菜单，然后是“new”（新建），然后是“java project”（Java 项目）（或者“file”→“new”→“project”→“java
    project”）

    *   弹出名为“new java project”的对话框。

    *   在“project name”（项目名称）中输入 `firstproject`。

    *   勾选“user default location”（用户默认位置）。

    *   在 JRE 中选择“use default JRE”（使用默认 JRE）。

    *   在“project layout”（项目布局）中勾选“use project folder as the root for sources and
    class files”（使用项目文件夹作为源文件和类文件的根），然后点击“finish”（完成）按钮。


