- fmt: ' own# Abstraction in Java


    When we talk of abstraction in Java, we mean abstraction in OOP and the way it’s
    done in Java. Abstraction begins the moment a class is conceived. I cannot really
    say that restricting properties of given object using access modifiers can be
    termed abstraction, as there is a lot more to it. You will find abstraction used
    often in object oriented programming.


    ## Abstraction And Encapsulation


    When a class becomes conceptualized, what are the properties you can have in it
    based on the context? If you want to design a class called animal and the context
    is zoo, you need to have an attribute as animalType to define domestic. This attribute
    may not make much sense when you are designing the class in another context.


    In the same way, ask yourself what behavior you going to have in the class. Abstraction
    is applied here as well. What is important to have is different from what will
    be overdose. Cut off some of the information from the class, and this process
    is using abstraction.


    When asked for the difference between encapsulation and abstraction, you can say
    that encapsulation applies just as a concept. Therefore, it is just encapsulation.
    But abstraction is a concept that is even applied as part of polymorphism (discussed
    later) and inheritance. You need to look at abstraction at a higher level among
    the other concepts of object oriented programming, including polymorphism and
    encapsulation.


    ## Abstraction And Inheritance


    Let’s try to take inheritance in this discussion as well. When you are designing
    the hierarchy of classes, you apply abstraction and then create many layers. Let’s
    take a first level class cell as an example; next level will be LivingBeing and
    animal will be the next after that. The hierarchy you create here based on the
    context is what uses abstraction itself.


    Now for each level, what exactly are the properties and behaviors that you going
    to have? Abstraction also plays a very important role here in determining that.
    What are the common properties that can be exposed to a higher level in order
    for the lower level classes to inherit from it? Some properties don’t need to
    be kept at higher level. This process of decision making is nothing but using
    abstraction to have different layers.


    Now that you read the short section, you should now have an idea about the way
    abstraction is done in Java:


    *   When you conceptualize classes

    *   When you write interfaces

    *   When you write abstract class methods

    *   When you write `extends`

    *   When you apply modifiers such as `private`


    You use abstraction as a concept in the areas identified above.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Polymorphism In Java


    Polymorphism in its literal sense refers to a state of having many shapes or the
    ability to take on various forms. When it is used in an object oriented language
    such as Java, it describes the ability of the language to process objects of various
    classes and types through a uniform and single interface.


    Polymorphism takes on two types: Runtime polymorphism and static binding (also
    known as compile time polymorphism). The former entails method overloading as
    an example while the latter is contained in dynamic polymorphism.


    Perhaps you need to note that polymorphism entails a very important example, which
    is how a parent class refers to a child class object. As a matter of fact, any
    object satisfying more than a single IS-A relationship is by nature polymorphic.


    As an example, we can consider the class `animal` and let one of its subclasses
    be `cat`. Therefore, any cat is an animal. The cat in this case satisfies the
    IS-A relationship for its own type and also its super class `animal`. You also
    need to note that it is very legal to state that every object in Java is by nature
    polymorphic because each one of them passes the IS-A test for itself as well as
    that for the `object` class.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Static Polymorphism


    When it comes to Java language, we achieve static polymorphism through method
    overloading. Method overloading simply means that there are multiple methods with
    the same name but different types or order of parameters. This is known as static
    polymorphism because it happens at compile time when the compiler knows which
    method to invoke. Let the following example make this concept clearer for you:


    ```

    ![image](d2d_images/image21.png)

    ```


    In the example above, we have four forms of `add`. The first one takes two parameters
    and the second one takes three. The 3rd and 4th methods provide for a change of
    order. This is known as static binding because it happens at compile time.


    ## Dynamic Polymorphism


    Imagine you have a sub class that is overriding a certain method of the super
    class. Imagine, you have, in the program, an object of the sub class created have
    it assigned to the super class reference. In this case, if you call the overridden
    method on the reference of the super class, it means that the sub class version
    of the method will be called as a result. Take a look at the example below:


    ```

    ![image](d2d_images/image234.png)

    ```


    You need to note that in your first call to `move()`, the reference type is `vehicle`
    while `Motorbike` is the object being referenced. In this case, when you make
    a call to `move()`, the program will wait until it is runtime to determine the
    object that the reference is pointing to. In our case here, the object is of the
    `MotorBike` class. Therefore the `move()` method if the class `MotorBike` will
    be called. The second call to `move()` has the class `vehicle` as its object.
    Therefore, the method `move()` of the `vehicle` will get called.


    Note that at runtime, when the method to call is determined, this is referred
    to as late binding or dynamic binding.

