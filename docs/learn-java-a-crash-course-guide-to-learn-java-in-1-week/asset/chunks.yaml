    We’re now going to learn about the various ways copy arrays (that is one and two
    dimensional arrays) can be used in Java. We have a number of techniques we can
    use to achieve this as explained in this section:


    Using the assignment operator to copy the arrays


    Take a look at the following example:


    ![image](d2d_images/image007.png)


    You’ll get the following output when you run the program:


    ![image](d2d_images/image121.png)


    Even though this particular method of copying arrays tends to work superbly, it
    tends to have a problem. The thing is, when you alter the elements of a single
    array in the above example, the other arrays’ corresponding elements are also
    altered.


    ![image](d2d_images/image240.png)


    You’ll get the following output when you run the program:


    ![image](d2d_images/image095.png)


    When the initial element of the array ‘numbers’ becomes altered to -1, the initial
    element of the array ‘positiveNumbers’ likewise becomes -1\. This is because the
    two arrays denote the same array object. This is known as shallow copy.


    Nonetheless, we often require what’s referred to as deep copy and not shallow
    copy. This (deep copy) copies the values to make a brand new array object.


    Let’s use looping construct to copy arrays


    We’ll begin with an example:


    ![image](d2d_images/image069.png)


    Your output will be as follows after running the program:


    ![image](d2d_images/image183.png)


    In this case, the for loop is being used to iterate through each and every element
    of the ‘source’ array. In all iterations, the corresponding element of the ‘source’
    array is copied to the ‘destination’ array.


    The destination and source array do not share similar reference- that is deep
    copy. This means that id the elements of one array- either destination or source
    are altered, another array’s corresponding elements are not changed.


    The ‘toString() method’ basically works to change array to string - only for the
