  md: "You can still have an auxiliary pointer to designate the head of the list and\
    \ the current position, but the pointers must also be declared to be of the doubly-linked\
    \ list type. Because of the double linking, you also need new functions for inserting\
    \ and deleting nodes.\n\n```\nDNODE *\ninsert_dnode (DNODE *listp)\n```\n\n```\n\
    {\n  DNODE *new;\n  new = (DNODE *) malloc(sizeof(DNODE));\n  if (new != NULL)\
    \ {\n    new->prev = listp;\n    new->next = listp->next;\n    listp->next->prev\
