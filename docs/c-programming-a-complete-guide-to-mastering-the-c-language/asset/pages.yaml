  md: '# Arrays and Pointers 167


    Programmer''s Notebook


    Pointer and integer variables often have the same size in a given environment,
    but they are not interchangeable. Historically, C programmers have blurred the
    distinction between pointers and integers, but the ANSI standard reasserts the
    distinction.


    Before you can successfully use a pointer, the pointer variable must contain a
    valid address. Simply declaring a variable to be a pointer to an object of some
    type does not give the pointer a value. You have to assign one. This is where
    the & operator comes into play.


    The next statement gets the address of the variable number and assigns it to the
    pointer p:


    ```

    p = &number;

    ```


    Because p is a pointer to an object of type int, it must hold the address of an
    integer. The expression &number yields the address of an integer. Success. After
    this assignment, p effectively points to number as symbolized by the arrow in
    Figure 7-3.


    # Accessing Data Through Pointers


    Now you can access the value stored in number either directly by using the variable''s
    name or indirectly by dereferencing the pointer p. The value of number is still
    not defined because we haven''t assigned anything to it yet.


    The statement:


    ```

    *p = 100;      /* indirect assignment */

    ```


    assigns the value 100 to number. The statement has the same effect as number =
    100;      /* direct assignment */


    This is true because dereferencing a pointer yields the object being pointed to.
    Thus *p and number both designate what is stored in the location identified as
    number.'
