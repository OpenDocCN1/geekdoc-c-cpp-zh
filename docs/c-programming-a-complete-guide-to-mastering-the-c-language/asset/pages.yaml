  md: '# Loss of Precision


    The statement:


    ```

    c = il;

    ```


    assigns the value of il, integer, to c, a character variable. Precision is lost
    because il is represented by at least two bytes, and often more. The variable
    c is not that wide—it is represented by only one byte. When the assignment is
    made, but all the lowest bits are effectively thrown away, limiting the stored
    values to a range of 256 values. The program prints the resulting character value
    both as a decimal number (the code that represents the character in the character
    set) and as the character graphic that is printed or displayed.


    Although c is a char, it is implicitly widened to int when used in the printf()
    statement because the %d format specifier in the control string expects an integer.
    The compiler does this conversion for you, so you don''t need to use a type cast.


    # Integer Arithmetic


    When only integers are involved in an arithmetic calculation, such as shown by
    the expression fi = il / 10, any fractional part of the result is truncated. The
    truncation occurs even if the result is assigned to a floating-point variable
    because the integer computation is performed before the assignment is made.


    To preserve the fractional component of a calculation, you must force one of the
    computation''s operands to type float. You can do this job by casting it to type
    float or by providing a real number operand. In the example, the value 10.0 is
    a real number because it contains a decimal point. If the expression consists
    of variables, one of them, as a minimum, must be of type float. You can also use
    a type cast, as in (float)#il.'
