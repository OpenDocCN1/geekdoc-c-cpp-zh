  md: 'In later chapters, we''ll explore command-line argument processing and other
    features of the run-time startup aspects of a typical C system.


    # Program Layout


    C is free form. It does not have a prescribed line structure. Indentation, for
    example, has no special significance. White space (space, tab, or a new line)
    is not significant enough, except that it is not allowed in a few multi-character
    operators.


    The alarmist program (alarmist.c) is an example of a program that is hard for
    a person to read comfortably, but it compiles and runs just fine:


    ```

    main() {puts("The sky is falling!");}

    ```


    By compressing all the source code together onto a single line, the programmer
    has saved space at the expense of program readability. This is never a good idea.
    Use white space, including indentation, to set off elements of your programs.
    The program sources will be both easier to read and easier to maintain.


    # Getting User Input


    Here is our first revision of the greeting program. The source code contains a
    few new elements:


    +   - Comments (block and in-line)

    - #include and define directives

    - An array of characters for buffering

    - Additional library functions.


    We''ll discuss each of these elements after looking at the source code:'
