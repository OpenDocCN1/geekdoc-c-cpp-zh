  md: '# INTRODUCTION


    You are embarking on a journey that can take you a long way into the future. I
    can say this with great confidence because it''s the feeling I had during my initial
    explorations into C programming back in the last half of the 1970s. It is gratifying
    more than a decade later to see what a tremendous impact C language has had on
    the computer industry and it is exciting to ponder the future.


    The important thing for you to realize is that learning a computer programming
    language is a long-term process and not an isolated event. You have to work at
    it regularly and you have to challenge yourself if you are to advance your knowledge
    and skill level. There are no free lunches and no pills that will make you into
    a brilliant programmer overnight.


    C Programming is designed to teach you the C language, show you how to write working
    programs in C, and demonstrate through fully developed programming projects how
    to apply what you learn real-world programming jobs.


    If you have prior programming experience, you will find converting to C to be
    easy or difficult depending on what languages you already know and how willing
    you are to make adjustments to the way you think. Some of you, no doubt, will
    resist change, but many of you will welcome the refreshing freedom of expression
    and the incredible flexibility afforded by you C.


    Those of you who are learning to program for the first time may have heard that
    C is hard to learn, and you may approach this endeavor with trepidation. Don''t.
    C is no more difficult to learn than any language (faint praise, but true), and
    it can really be a lot of fun. I''ll take the'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'xiv C Programming


    responsibility of trying to make it so. All I ask is that you give it a good effort.
    Fair enough?


    # Machine Talk


    When a computer talks to itself what does it say? Probably something like "00110011
    10100011 11110001 10010010." A computer has a limited alphabet (0 and 1) and a
    correspondingly small vocabulary (typically a few hundred "words\). It''s not
    much of a trick for a human to learn the language of a computer (given a good
    memory and some practice). But to talk to a computer in its own tongue is a monumental
    yawn and something you really don''t want to do for too long.


    Over the years, hardware designers and programmers have produced a vast array
    of tools that make the task of communicating instructions to a computer lot easier
    than it used to be when flipping switches on the front panel represented the state
    of the art.


    # Assembler Languages


    Closely related to native machine language is assembler language. The major change
    from the world of 1s and 0s is the use of mnemonic names to represent instructions


    Assembler is a convenience to a programmer and it is a relatively simple task
    to automatically translate assembler codes into machine instructions. This task
    falls to an assembler program.


    A problem with both raw machine language and assembler is that instructions are
    intimately tied to the host processor, so moving a program to a different processor
    usually involves complete manual recoding of the program. If you have to support
    a program in a variety of operating environments, this poses substantial burdens
    in training, program coding, and ongoing maintenance. In addition, assembler languages,
    though mnemonic, are difficult to read, and programs of any significance require
    many instructions.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# High-Level Languages


    High-level languages offer you an attractive alternative because they tend to
    be easily read by mere mortals, and programs written with care in some high-level
    languages can be moved among disparate operating environments with relative ease.


    If the choice is yours to make, you have a wide range of high-level programming
    languages from which to choose. FORTRAN, COBOL, BASIC, and other oldbys have been
    in use for many years. The majority of all programs ever written were done so
    in one of these languages. Even today, it is estimated that more than half of
    all currently operating programs were written in COBOL, but that situation is
    changing rapidly.


    Newer languages such as Pascal, Modula 2, and other derivatives of Algol have
    built strong followings. Of these newer languages, C has probably had the greatest
    impact on modern programming.


    # The C Programming Language


    C is the result of a personal effort by Dennis Ritchie, a Bell Laboratories researcher.
    It was not designed by a committee (Ada anyone?). The resulting freewheeling spirit
    of C has made a significant contribution to its success.


    Originally designed as a systems programming language for making UNIX the first
    "portable" operating system, C had a long gestation period with the Labs. It has
    grown up since becoming available outside the Labs, initially benefiting and being
    hurt by its cult following. Now almost everybody is jumping on the bandwagon.


    The language was introduced in the seminal book The C Programming Language by
    Brian Kernighan and Dennis Ritchie (Prentice-Hall, 1978). The book is generally
    referred to as "K&R". It contains the original formal definition of C in Appendix
    A, Reference Manual. The book is now in its second edition, reflecting the changes
    to C that have taken place in the past decade.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'An updated and extensively revised definition of C has been formulated by the
    X3J111 technical subcommittee of the American National Standards Institute (ANSI).
    The draft-proposed standard should be officially adopted by the time this book
    is printed. Therefore, C Programming emphasizes ANSI C. For compatibility with
    current C implementations, the book also includes guidelines for running programs
    in ANSI and pre-ANSI environments.


    # Organization of This Book


    C Programming is composed of four major parts. The first part introduces you to
    the C programming language. The second part describes numerous techniques that
    you will use in real-world programming situations. The third part presents several
    programming projects that walk you through the process from concepts to finished
    programs. The last part is a collection of important C-related information in
    handy reference form.


    # Part 1: An Introduction to C


    This part introduces you to C language, the lingua franca of a majority of developers
    of software for microcomputers and minicomputers. coverage includes basic concepts
    of programming, data, expressions and statements, execution-control flow (branching
    and looping), functions, arrays, and pointers.


    You will obtain a working knowledge of C that will get you started. This part
    stresses the fundamentals. Learn them well before moving on.


    # Part 2: Programming Practices and Techniques


    Designing a program and coding it are very different tasks. They are related tasks,
    they happen at different levels of abstraction in your brain. Program design requires
    an understanding of the problem being solved, knowledge of techniques for solving
    problems, and the ability to express a solution in terms that humans can understand.
    **Coding**, the process of writing source code in a particular language, is a
    translation'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'task that converts the language-independent solution into a working program.


    When a programmer says he or she is having trouble writing a program, you can
    safely bet that the real problem is designing a suitable solution. Writing the
    code, once a programmer understands the language, is usually not a significant
    problem. Consequently, I have designed this part of C Programming to help you
    analyze problems and formulate workable solutions.


    # Part 3: C Programming Projects


    After you know the language and have acquired or sharpened your problem-solving
    skills, you can work your way through a set of representative programming projects.
    The projects in this part take you through the entire design and development process
    of some programs that should be of general use to you.


    # Part 4: Appendices


    The last part contains tables and other reference information in handy, carefully
    organized appendices.


    # Portability Issues


    You''ll encounter some striking similarities and important differences among currently
    popular operating environments. Where appropriate, chapters include discussions
    of system and language implementation differences that might affect the portability
    of your programs.


    In addition, we''ll examine design and coding practices that can have an impact
    on program performance and promote efficient use of computer resources. There
    are usually many ways to solve a given problem and a solution that works is a
    good solution. We will explore ways of developing solutions that work and are
    efficient.'
  merge: -1
