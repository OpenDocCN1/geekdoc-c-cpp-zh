  md: '# Functions and Program Organization 125


    Let''s first look at the function header and learn about its purpose.


    # Function Header


    A function header indicates the type of data being returned, if any. If the function
    computes a single-precision, floating-point value, for example, the return type
    and the value used in the statement body must be of type float.


    The return type can be any C type or a derived type. The C data types of `int`,
    `char`, `float`, and so on, are obviously suitable return types. So is `void`,
    actually means that the functions return control, but no data. In addition, you
    can create your own data types by array, structure, and union types, pointers
    to objects of a type, and even functions that return data of a particular type.
    Just be sure the type of the return value agrees or is appropriately cast.


    The name of a function is important, too. You can use any name that does not collide
    with C keywords and standard function names. You should avoid using names that
    begin with a single underscore because they might duplicate internal names used
    by the C translator.


    The last component of a function header is the parameter list, which is a possibly
    empty list of parameter types and names inside parentheses. This list shows the
    number and types of parameters accepted by the function. You''ll see more about
    this topic in the section on function parameters and arguments.


    # Statement Body


    The statement body is where the action takes place. Braces mark the beginning
    and end of the statement body. When control passes to a called function, it passes
    to the first executable statement in the function''s body. Control passes out
    of a statement by control statements such as return, abort, exit, or by just falling
    off (the closing brace).


    The parentheses collect the enclosed statements into a block or compound statement,
    as you saw in the previous chapter. Within the function block, you can have inner
    blocks. At the top of each block, you can place declaration statements. Such declarations
    are visible (in scope) within the enclosing block.'
