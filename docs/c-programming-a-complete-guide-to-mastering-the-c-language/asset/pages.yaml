  md: '# CHAPTER 5


    # PROGRAM FLOW AND CONTROL


    All programs, regardless of how simple or complex, exhibit a flow of execution
    of statements. The simplest programs might entail nothing more than a straight
    sequential execution of statements. The programs shown in earlier chapters of
    this book are examples of the simple form.


    Programs that do anything more complicated than those shown thus far usually involve
    alterations to the flow of execution. This chapter describes program flow and
    shows how you can control it in a disciplined way.


    # Flow of Control


    The straight sequence of program statement execution is broken by either branching
    forward or backward based on the values of control expressions. Statements that
    form forward branches are called selection (decision-making) statements. Those
    that branch backward are called iteration (looping) statements.


    Other statements that alter a program’s flow of execution are called jump statements.
    Jump statements, as the name implies, cause program execution to jump abruptly
    to some statement in the program other than the one that follows in sequence.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '![](img/2219c9d84a179a4ea06a2deb13b7888b_111_0.png)


    Each of the statement categories mentioned contains a set of related statements.
    Let''s look at selection, iteration, and jump statements from a high-level perspective
    first. Then we will examine each of the control statements in detail and show
    examples of their uses in working programs.


    # Selection Statements


    A selection statement chooses one of two or more possible paths of program execution.
    You use selection statements in your programs to make decisions.


    In C, the if statement is the primary selection statement. As you will see, an
    `if` statement has several variations that give you the flexibility to model decision-making
    logic. The variations involve the use of `else` clauses and the nesting of statements.


    In addition, C offers a `switch` statement that provides an efficient and clean
    way to handle multi-way branching. A `switch` statement uses case labels as branching
    targets and an optional `default` label as a catchall if no other label is matched.


    # Iteration Statements


    The iteration statements give programs a way to execute a statement or group of
    statements repeatedly. A control expression determines how many iterations are
    executed.


    The `while`, `for`, and `do` statements comprise the set of C iteration statements.
    These forms have differing attributes that might make one more suited to a particular
    problem than another. Often, the `for` and `while` forms can be written equivalently.


    # Jump Statements


    You will encounter several uses of jump statements in C programs. The primary
    jump statement, `goto`, transfers control to a labelled statement somewhere in
    the same function. Given the good variety of structured control statements, you
    will rarely, if ever, need to use `goto` statements.'
  merge: -1
  pgno: 111
