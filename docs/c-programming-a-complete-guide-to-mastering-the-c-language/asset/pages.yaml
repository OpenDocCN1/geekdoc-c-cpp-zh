  md: '# CHAPTER 11


    # STACKS AND QUEUES


    Equipped with a basic knowledge of C language and some techniques for program
    development, you should now be able to take on some significant programming challenges.
    Don''t try to do everything from scratch. Learn to build on the work of others
    who have created solutions to many common programming problems.


    This chapter investigates some important data structures and related processing
    algorithms that you will encounter frequently in programs that you read. Soon
    you will be using them in your own programs.


    # Stacks


    The stack is a widely used mechanism for buffering data. Stacks find broad application
    in managing priorities, performing arithmetic operations, and numerous other tasks.


    # The Stack Data Type


    A stack is a linear data type that behaves as a last-in, first-out (LIFO) storage
    mechanism. The most commonly used analogy for a stack in the workday world is
    the stack of plates found in most cafeterias. The last plate put on the top of
    the stack is the first one taken off the stack.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'Virtually all modern computers are stack-oriented machines. Stacks are used
    for many purposes, such as saving the machine state, while interrupt-service routines
    respond to higher-priority tasks, passing parameters to functions, keeping track
    of overlapping windows in display system software, and so on.


    A stack has the attributes of a data type. It can be implemented in several ways.
    The simplest implementation of a stack is an array and supporting pointers or
    subscribers to show where data is to be written or read. You can also implement
    stacks by using linked data structures (see Chapter 12).


    Because the name of an array is a constant pointer to the start of the array,
    a convenient "base" pointer is always readily available. Assigning a pointer to
    an object of of the array elements and initially assigning it the value of the
    array base, gives you a convenient way of showing where the "top" of the array
    is. The top is the location at which the next operation takes place.


    Figure 11-1 graphically portrays a five-position stack (an array of five elements).
    The array is initially empty, so top equals base. Whether the top and base components
    are pointers or array subscribers doesn''t really matter except to the code that
    manages the contents of the stack.


    The code that manages the stack in the simplest cases involves only two functions:
    push() to write data onto the stack, and pop() to read data from the stack. The
    act of pushing an item onto a stack that is not full has the side effect of incrementing
    the top pointer or subscript and, of course, popping an item off a stack that
    isn''t empty decrements the pointer or subscript.


    In the figure, the stack is initially empty. Pushing a number on the stack fills
    element 0 with the pushed value and increments the top index. Pushing a second
    value fills in the stack element designated by top and increments top again.


    If the program controlling the stack has a multiply instruction, it pops the two
    elements off the stack, multiplies them, and pushes the result back onto the stack,
    producing the situation shown in the right column of the figure. Each of the pop()
    operations retrieves the value designated by the top index and decrements top.'
  merge: -1
