- img_proc: true
  md: '# C cc Program


    Although several steps are involved in compiling and linking a program''s components,
    the process is highly automated and controlled by the use of cc, which is called
    the compiler-driver program. You usually do not need to call individually the
    preprocessor, compiler passes, the assembler, or the linkage editor. Instead you
    use cc, which transparently calls the needed programs for you. From a programmer''s
    perspective, cc is the UNIX C compiler.


    The C compiler driver controls the compiler, assembler, and linker steps to produce
    an executable program. You identify the component parts of a program and its name,
    and cc does the rest.


    # Programming in an MS-DOS Environment


    Several good C compilers have strong positions in the MS-DOS market. In preparing
    and testing programs for this book, I used Borland''s Turbo C 2.0, the Microsoft
    C 5.0 Optimizing Compiler, and Microsoft QuickC 2.0.


    You should be able to use one of the dozens of DOS-based C compilers with little
    or no change to the source code because virtually all C compiler suppliers for
    DOS computers are converging quickly on the ANSI C standard and I have tried to
    avoid non-portable C features in the example programs. If your C compiler is not
    able to compile the programs in this book, encourage your supplier to catch up
    with the industry or switch to one that is current.


    # Overview


    As shown in Figure 1-2, the process of compiling a C program under MS-DOS is nearly
    identical to the way you do it in a UNIX environment.


    The primary differences involve source and object filenames and compiler/linker
    program names. Filenames under MS-DOS are treated internally as all uppercase.
    You can type such names in lowercase if you prefer—they are converted on input.
    In addition, compiler suppliers choose their own program names, so you will need
    to use names that are appropriate for your compiler.'
  merge: -1
