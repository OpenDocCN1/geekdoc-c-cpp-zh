    of smaller subregions that have integral ranges of values of limited extent. For
    example, if you need to do count from 0 to 15, all you need four bits. Why waste
    12 bits in a 16-bit word (or 28 bits in a 32-bit word) to count to 15? Another
    example is maintaining a set of flags that need to have values of either 0 or
    1. You can pack 16 of these flags in'
