    of a computer system consists of two types: primary memory and secondary memory.


    Primary memory is typically random-access memory (RAM) that is directly addressable
    by the computer''s central processing unit (CPU). Primary memory is usually fast
    and volatile. Its contents are lost when the power is turned off—unless some form
