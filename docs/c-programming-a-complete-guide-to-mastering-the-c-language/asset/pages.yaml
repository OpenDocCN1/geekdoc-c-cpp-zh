    Use parentheses liberally to show your intentions. You and others who might read
    or maintain your code in the future will benefit from the extra effort you put
    into it when you write it.


    # The Assignment Operator


    The primary C assignment operator is the equal sign (''=''). To assign the value
    50 into an integer storage location, num, you first declare that num is an integer
    and then write an assignment statement:


    ```

    int num;

    ...

    num = 50;

    ```


    The assignment operator causes the memory location associated with the variable
    identifier, num in this example, to contain the assigned value. Here, the value
    is obtained directly from a literal constant. The value can also be obtained from
    the evaluation of an expression or from the return value of a function call.


    Assignment is low on the precedence hierarchy, so use parentheses in evaluation
    order is a consideration. Additional assignment operators are covered later in
    this chapter.'
