  md: '# # CHAPTER 12


    # ## LINKED DATA STRUCTURES


    The previous chapter described contiguous allocations of memory for stacks and
    queues. These constructs are very useful, but they have limitations.


    First, they require allocation of a fixed amount of memory regardless of the amount
    actually used by a program. You might set aside a stack of, say, two kilobytes
    to be sure you have enough room for the worst case and then use only a few hundred
    bytes of it. Second, elements of a stack or queue are arranged adjacent to each
    other. It is often more convenient to allow items to be arranged in seemingly
    arbitrary ways and thread them together rather than enforce a linear arrangement.


    In earlier chapters you were introduced to structures, pointers, and combinations
    of these. Pointers to structures provide a convenient way to access structure
    members. If a structure member is a pointer to an object of the same type, we
    have a simple way of stringing objects together in various ways.


    A structure that contains a pointer to an object of its own type is called a self-referential
    data structure, which is the basis of linked lists, various tree-like data structures,
    as well as dynamically modifiable stacks and queues. This chapter introduces self-referential
    data structures and their application to linked lists. In addition, it introduces
    memory management'
