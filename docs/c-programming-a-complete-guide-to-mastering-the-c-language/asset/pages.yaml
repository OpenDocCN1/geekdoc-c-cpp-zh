  md: '# Preprocessor Directives


    The greet2.c program contains an #include directive. An #include directive causes
    the contents of a named file or memory region to be brought into the including
    file, effectively replacing the directive line in the source file.


    Definitions of a set of useful input and output routines are contained in the
    stdio.h header.


    The greet2.c also contains a #define preprocessor directive. In this program,
    the #define directive creates a symbolic name, NBYTES, as a constant value. With
    certain exceptions, as the number 0, it is bad practice to code literal numbers
    in your program source code. For several reasons that we''ll explore later, it
    is far better to use symbolic names that are defined by preprocessor directives.


    # Standard Library Routines


    The greet2.c program contains some new functions and macros from the standard
    library: printf() and gets().


    The printf() function provides formatted printing. It gives you a way of printing
    text strings; possibly intermixed with numbers in various formats and other variable
    information.


    The gets() routine is implemented as a macro. A macro is usually a short name
    (the macro name) that stands for something larger or more complex (the macro definition).
    The gets() macro reads a "string" of characters from its "standard input," which
    by default is the user''s keyboard.


    # C Program Connections


    Programs can communicate with their operating environments. Two of the primary
    means of communication are command-line arguments and return values. Both are
    optional features of programs and functions, and they are under your control for
    any functions that you write.'
