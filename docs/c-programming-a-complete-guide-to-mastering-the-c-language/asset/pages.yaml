    # Summary


    Command-line arguments and environment variables each provide ways of getting
    external data into a program. ANSI C supports two parameters to main() that permit
    ready access to the command-line arguments. The parameters, usually called argc
    and argv, are supported by hosted C translators. Because these parameters are
    local to the function main(), you can use other names for them if you wish. A
    third parameter, called env by most implementations that support its use, initially
    points to the start of the environment block. a collection of variable/value pairs,
    can more reliably be accessed by calls to getenv(), which returns the value of
    the variable named as the argument or NULL if the variable is not defined in the
    environment.


