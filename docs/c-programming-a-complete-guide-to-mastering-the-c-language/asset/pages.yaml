    # Summary


    Types in C apply to objects and expressions, including function returns. A set
    of basic types mirror the architectures of most modern computer systems. Additional
    types can be derived from the basic types.

    The standard library provides a wealth of input and output routines (both functions
    and macros). You have been introduced to a small set of standard input/output
    routines that will serve to get you started. The versatile conversion specifiers
    give you a great amount of flexibility in data input and output.

    We''ve covered a lot of ground in this chapter, yet there is still much to say
    about C types and data input and output. In later chapters, you will learn about
    storage class specifiers and type qualifiers, we will pay more lip service to
    the topics of error detection and correction, and we will develop better ways
    of gathering user input.'
