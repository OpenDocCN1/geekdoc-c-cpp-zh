    # Prefix and Postfix Notation


    When an increment (or decrement) expression is involved in a larger expression
    context, the behavior is dependent upon the operator position. If the operator
    is used as a prefix, the value of its operand is incremented (or decremented)
    before being used in the enclosing expression. If the operator is used in the
    postfix position, the value of the operand is used as is in the enclosing expression
    and then the operand is incremented (or decremented).


    Don''t use the increment and decrement operators indiscriminately. Recall that
    in logical expressions, short-circuit evaluation might prevent an expression evaluation
    to be skipped. If the skipped expression involves an increment or decrement expression,
    you may encounter problems with variables being "off by one" sometimes and not
    at other times as a function of the logical evaluations. Avoid such tricky programming
    practices.


