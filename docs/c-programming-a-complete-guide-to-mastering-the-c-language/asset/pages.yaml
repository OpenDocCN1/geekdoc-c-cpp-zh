  md: '# Unions


    A union is a C type that provides a common region of storage for one of several
    different object types. The C union is analogous to the Pascal variant record
    type.


    # Declaring a Union


    The appearance of a union declaration is similar to that of a structure declaration.
    There is, a significant difference between the two. A structure is an aggregate
    type, bringing objects of possibly differing types together under a common name.
    A union is, having a single element that can have at any time only one of the
    specified types.


    Figure 8-4 shows how unions are declared and used. The declaration of the variable
    input is typical of union declarations. The union template specifies that variable
    and functions of this type can be of type char, short, or long.


    The illustration shows a four-byte region of memory reserved for the input variable,
    enough to hold the largest of specified types. Storage of any type allowed by
    the union declaration starts at the lowest address, which is at the top of the
    illustration because we are using the convention of addressing increasing as we
    move down the page.


    When used to store a character, input actively uses only the first byte. When
    storing a short integer, two bytes are used. All four bytes are occupied by a
    long integer.


    # Using Union Variables


    The figure shows two examples of access to the input variable. The first example
    shows how to store and print a character. Only the c member of the union participates
    in this activity. The second part of the example shows how to store and print
    a long integer. The entire union, designated by the member 1 (letter "ell") participates
    in this activity.


    Be careful when using unions. You are responsible for knowing what type of data
    is stored in the union at any time. Attempting to store data as one type and read
    it as another produces unpredictable results.'
  merge: -1
  pgno: 231
