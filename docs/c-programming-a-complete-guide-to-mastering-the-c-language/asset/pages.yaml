  md: '# C PROGRAMMING


    # Augie Hansen


    > “C is a tough subject, but Augie makes it gel on the printed page, bringing
    clarity and elegance of expression to a programming language sorely in need of
    both.”


    — Jeff Dutemann, Editor in Chief, PC Techniques


    This book is one of the most complete and accessible guides to the C language
    ever published. Bestelling C programming author Augie Hansen takes the reader
    through each command, offering thorough explanations of usage and syntax and providing
    illustrative programming examples.


    Appropriate for beginners who want a clear and authoritative introduction to C,
    as well as experienced C programmers who want a well-organized reference, Augie
    Hansen''s C Programming will become a standard. Hansen''s methodical coverage
    of C includes topics such as program design, sequencing, alternation, functions,
    recursion, file input/output, bit fiddling, memory, and searching and sorting.
    For each of these, he discusses the issues of efficiency, testing and debugging,
    and portability.


    Hansen''s approach is an all-encompassing one — he teaches C and then shows how
    to use the language effectively to solve real-world problems. Every chapter contains
    a self-test, with answers at the back of the book.


    With the proliferation of operating systems as DOS, OS/2, and UNIX, the ability
    to write portable C programming is becoming an increasingly important issue. C
    Programming emphasizes techniques for writing portable C code that applications
    can be easily moved from one system to another.


    C Programming is the essential reference for any aspiring or established C programmer.


    Augie Hansen, president of Omniware, a training and consulting firm in Denver,
    is a lead-instructor on the C programming language. He is the author of numerous
    bestselling computer books including C Now and Proficient C.


    Cover design by Doliber Skeffington


    Addison-Wesley Publishing Company, Inc.


