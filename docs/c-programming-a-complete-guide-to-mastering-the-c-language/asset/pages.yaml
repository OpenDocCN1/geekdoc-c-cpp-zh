  md: '# CHAPTER 9


    # INPUT, OUTPUT, AND FILES


    Programs usually need to read data from external devices and write data to other
    external devices. Up to this point in the book, we have written programs that
    read input from the keyboard, write output to the user’s display screen, or both.
    Such input and output is transient in nature, disappearing almost as quickly as
    it appears.


    A degree of data permanence is obtained by using magnetic media or other forms
    of storage that retain data for long periods of time. A typical personal computer
    is equipped with diskette and hard-disk drives. Larger computer systems often
    have high-speed magnetic tape drives in addition to disks of various types. Data
    stored on such devices is organized into files.


    This chapter examines input and output aspects of C programs, including the use
    of files. Emphasis is placed on the use of basic input/output functions provided
    in the standard subroutine library provided with virtually all C translators.


    # Input and Output


    As noted in earlier chapters, the C standard does not define input and output
    operations as part of the language. There are many differences among operating
    environments (machines and system software), partic-'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'ularly with regard to the ways in which support for input and output is provided,
    making it difficult or impossible to provide universal I/O features in the language.


    The solution adopted by the developers of C is the use of externally-defined library
    subroutines (functions and macros) that handle all I/O operations. The C subroutine
    contains numerous functions and several macros that handle I/O operations at two
    levels:


    +   - Stream (high-level) I/O

    - System (low-level) I/O


    Of these, stream I/O is the more portable across operating environments, providing
    a uniform concept of streams that transcends and hides the details of underlying
    physical devices. Details such as input and output buffering for efficiency and
    data translation to accommodate differences between systems and internal processing
    models are handled automatically.


    System I/O, on the other hand, is intimately involved with the details of a particular
    implementation. When you use low-level I/O, you are responsible for all buffering
    and data translations.


    # Standard Streams


    Data input and output devices have many forms. Among the more common physical
    devices are keyboards, screens in display devices, disk drives, and magnetic tape
    drives. Some devices store and retrieve data sequentially as a series of bytes,
    while other devices organize data into blocks. Access to the data is sequential
    or random depending on the device and the mode of access.


    The standardized input and output functions are based on a stream model, which
    provides a uniform logical view of I/O without concern for the medium involved.
    The stream model is derived from the UNIX operating system environment. In a concession
    to existing operating environments that make a distinction between text and binary
    streams, the C standard recognizes both types of streams. However, no distinction'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'between text and binary data is required. We''ll examine this issue and its
    ramifications in later sections of this chapter.


    Figure 9-1 shows the UNIX model of standard streams. The three standard streams
