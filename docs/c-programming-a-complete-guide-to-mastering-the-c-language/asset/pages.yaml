    # Character


    The `char` type specifies a "plain" character. Whether a plain character is signed
    or unsigned (more precisely, nonnegative) is implementation-defined. Historically,
    most implementations have treated the plain character as a signed entity variable,
    while others have treated it as unsigned.


    A character can hold the value of any member of the native character set. In such
    a case, the value is guaranteed to be positive. You declare a character object
    by using the following notation:


    ```

    char c; /* declare a plain character variable */

    ```


    The `keyword char` establishes the type of the object and the identifier, c, provides
    a convenient name for the object. You can use any valid identifier for the variable
    name is a statement terminator, a required component of a declaration statement
    and most other C language statements. The in-line comment describes the purpose
    of the statement. Comments are optional, of course, but they are an important
    part of a program if they are written carefully and kept current as program changes
    are made.


    Once you have declared a suitable variable, you can give it a value. This task
    is usually accomplished by using an assignment statement. A single equal sign
    is a C operator that assigns the value of an expression on the right side, into
    the object on the left side.


    The following assignment statement places the value of the character A into the
    c.


    ```

    c = ''A''; /* assign the character A to c */

    ```


    The next statement "prints" the value stored in the variable c as a character
    on the standard output, which is usually the user''s terminal or a console screen.
    The term "print" is used loosely to mean *print* on hard-copy devices or *display*
    on video output devices.'
