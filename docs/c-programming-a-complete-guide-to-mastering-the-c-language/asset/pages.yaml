  md: '# Portability


    The proposed ANSI C standard has at once solved a serious problem caused by the
    original design of C and introduced a potential portability problem. Function
    prototypes are the issue.


    Function prototypes are not understood by most pre-ANSI compilers, especially
    those that run in UNIX and UNIX-like environments. This situation will change,
    but the problems will continue to exist for many years.


    If you are writing a program that must be portable across disparate operating
    environments, place all function prototypes for functions in a program or library
    in a header. In the file, use conditional preprocessor directives to include or
    exclude function prototypes based on whether or not a symbolic name is defined.


    Here is an example of the technique. The header shows what you might do for the
    prototypes used in the boxtext program. It is the way I have handled the differences
    between my DOS and UNIX compilers.


    ```

    /* boxtext.h */

    #define MSDOS


    #if defined (MSDOS)

    /* DOS function prototypes *\nvoid string(int, char);

    void hborder(int);

    void puttext(char []);

    #endif

    #elif defined (UNIX)

    /* UNIX function declarations */

    void string();

    void hborder();

    void puttext();

    #endif

    ```


    The #define at the top of the file specifies the environment and the #if defined
    directives conditionally select either full-function prototypes, as supported
    by most MS-DOS C translators, or earlier function declara-'
