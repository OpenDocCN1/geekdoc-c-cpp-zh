  md: '# The Circular queues Queue


    Linear queues are limited by the length of the queue. Because of this, they are
    often not used. However, a variation of the linear queue called the circular queue,
    is frequently used, especially in buffering data transfers. A circular queue is
    also a stretch of memory locations, but the access methods effectively wrap back
    to the beginning when the end of the queue is reached.


    A good example of a circular queue is the keyboard buffer of a typical personal
    computer. The keyboard buffer receives characters as quickly as you type them
    and delivers them to a process on demand. If the process is busy doing something
    else, such as reformatting text (word processing) or translating a statement (language
    compiler), the buffers lets you continue typing without dropping any of your input.


    The keyboard buffer in an IBM PC has only 16 positions, so if you type fast enough,
    sometimes fill the buffer. When this happens, the machine beeps at you, telling
    you it can''t accept any more input. One way to solve this problem is to create
    a separate, larger buffer and use it to feed the program. A queue of 128 bytes
    is a popular size.


    Going to a circular queue poses a problem. If the tail and the head indexes are
    equal, is the queue full or empty? You can''t tell. We have to devise a way of
    differentiating the two conditions. The problem is solved by sacrificing one position
    in the queue. The tail index is started behind the head index and is not allowed
    to catch up to it. Let''s see how this technique works.


    # The queue Demonstration Program


    The queue program is similar in design to the stack program. The difference is
    the use of a queue to handle messages in a FIFO order, rather than the LIFO order
    produced by a stack.


    The functions that do the work in this program are enqueue () , which writes an
    item to the circular queue, and dequeue () which reads an item from the queue.


    The main() function for a queue looks the same as the one in the stack program,
    except for the names of the queueing functions.'
