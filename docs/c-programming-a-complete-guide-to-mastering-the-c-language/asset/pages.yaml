  md: 'Secondary memory resides on disk, tape, or some other medium. Such memory is
    not within the address space of the computer. It has the virtue of (relatively)
    permanent storage in the absence of power. Secondary storage is typically much
    slower than primary memory by one or more orders of magnitude, but the ability
    to retain information for long periods of time is an important benefit.


    Another type of memory called read-only memory (ROM) has attributes of both primary
    and secondary memory. It can also be placed in the address space of a processor.
    As its name implies, ROM can be read but not written, which makes the program
    instructions and data stored in ROM available without the danger of them being
    accidentally or purposely modified. The contents of ROM are permanent.


