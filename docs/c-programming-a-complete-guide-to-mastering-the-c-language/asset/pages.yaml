  md: 'UNIX; AUTOEXEC.BAT under DOS, and so on. Each defined variable has a string
    value that can be accessed by your programs.


    The data items are usually available to a process in at least two ways. The first,
    but least reliable, is a third parameter, envp, to the main() function. The declaration
    of envp can be shown as:


    ```

    char *envp[]

    ```


    or:


    ```

    char **envp

    ```


    is analogous to the way argv can be declared. The envp variable is an array of
    environment pointers. In this case, each pointer is provided with the address
    of a name/value pair in the environment space. If you set up a PATH variable in
    your environment, for example, you can use the environment pointer to search in
    the variable list for the name strings and then retrieve the value string by using
    string functions from the standard library, keying on the equal sign that separates
    the value from the name.


    The envp parameter is only useful upon entering a program because the environment
    is subject to relocation as the program runs. A variable''s value could change
    at any time and the locations of variable/value pairs change. This problem occurs
    in an environment that supports a function called putenv(), which let''s you make
    changes to your environment on the fly.


    # Programmer''s Notebook:


    > When a program starts executing (becomes a process), it inherits a copy of the
    user''s environment. Changes made to that copy have no lasting effect because
    they do not change the original environment.


