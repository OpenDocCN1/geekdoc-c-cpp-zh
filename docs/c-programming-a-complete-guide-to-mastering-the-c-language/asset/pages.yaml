    # File Access


    Having declared a file pointer variable, fp, we are only halfway to having a stream
    that we can play with. The next step is to open a file for access. The function
    fopen() attempts to open a named file and associate it with a stream designated
    by the pointer variable. This function is declared in <stdio.h> and has the following
    general form:


    ```

    FILE *fopen(const char *filename, const char *mode);

    ```


    Recall the cost type qualifier in this context means that the function does not
    attempt to change the values passed to it as arguments.

    The filename argument is a string that contains the name of the file to be opened.
    You can hard-code a name in a literal string, but a more likely scenario is that
    the filename is provided by pointing to a buffer that contains a name obtained
    from the operating system shell, a command-line argument, or direct user input.


    The mode argument is a string that begins with the character sequences shown in
    Table 9-1, which lists the mode argument codes and briefly describes what the
    codes mean. Additional characters are allowed in the mode argument string following
    the initial sequences shown.


    | Table 9-1: Mode Argument Codes |

    | MODE STRING | DESCRIPTION |

    | r | Open text file for reading |

    | w | Truncate to zero length or create text file for writing |

    | a | Append; open or create text file for writing at end |

    | rb | Open binary file for reading |'
