  md: '# The Function/Macro Tradeoff


    Given that functions and macros can both accept inputs via parameters, which should
    you use? The answer depends on what you are trying to do and the constraints (speed,
    size) placed on the program. First, let''s look at this issue from the perspective
    of a program''s speed of execution.


    The use of a function involves call/return overhead that consumes time data must
    be pushed on the stack, control passed to a different place in memory, and then
    back to the statement following the function call. If a function is called repeatedly
    inside the body of a loop, for example, the accumulated overhead can become quite
    costly, slowing the program speed.


    A macro is expanded to its replacement each time the macro name is encountered
    by the preprocessor (except when the name is part of a quoted string). Each expansion
    of a macro name produces in-line code that executes without the overhead of a
    function call, saving time. If you are optimizing your program for speed, macros
    can be an important tool.


    Now let''s view the issue of functions and macros from the perspective of program
    size-an important consideration on systems that have limited memory resources.


    Because each occurrence of a macro is expanded to its full replacement text, the
    program size seen by the later passes of the C translator is inflated, and so,
    too, is the final executable program size. That''s a cost of speed.


    The benefit of functions is that the executable code produced by the translator
    appears in the program only once and can be called any number of times without
    making the program any larger. The cost of this space saving is an attendant speed
    penalty.


    You can use a mixture of functions and macros in your programs to obtain a good
    balance between speed and program size. I recommend that you write your program
    initially in terms of functions. Then isolate those parts of the program that
    slow it down (more easily said than done) and recode them as macros.'
  merge: -1
