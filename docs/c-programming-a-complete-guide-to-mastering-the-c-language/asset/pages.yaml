  md: "# Structure Declarations\n\nA structure declaration in C has the following\
    \ general form:\n\n```\nstruct tag {\n  type varname;\n  ...\n};\n```\n\nThe keyword\
    \ struct identifies this as a structure declaration. The optional tag gives a\
    \ unique name to a particular structure. The list of variable declarations specifies\
    \ the members of the structure. The result of such a declaration is the creation\
    \ of a structure template that you can use as a type specifier.\n\nHere is a structure\
    \ declaration that creates a template for a structure used to maintain information\
    \ about the months of the year:\n\n```\nstruct month_st {\n  char name[10];\n\
    \  char abbrev[4];\n  short days;\n};\n```\n\nThe structure template created by\
    \ this declaration specifies the form of any variable that is declared to type\
    \ month_st. The suffix \"_st\" is a convention I use to indicate that the name\
    \ carrying the suffix is a structure tag. You will find many derived types in\
    \ the Standard library that carry a \"_t\" suffix for the same purpose. The type\
    \ size_t is an example of this practice.\n\nFigure 8-1 shows the declaration of\
    \ a variable month that has the type month_st. The two character arrays occupy\
    \ amounts of space in memory because the structure declaration is designed to\
    \ hold a month name plus a terminating null byte in the name member and a three-letter\
    \ abbreviation plus its null byte in the abbrev member. The days member is a short\
    \ integer, which occupies two bytes.\n\nBecause the name and abbrev members are\
    \ arrays, the members occupy the same amount of space regardless of what data\
    \ is stored in them."
