    The message stack shown in this demonstration program can be used in a larger
    program to manage a message line for an interactive display. Let''s say you have
    a single line at the bottom of the screen reserved for messages. If a process
    generates several messages before it runs, each message would overwrite the previous
    message, perhaps before the user could read the earlier messages. By setting up
    a reasonably deep stack and giving the user some commands to pop messages off
    the stack on demand, you prevent loss of important information.


    # Queues


    In the design of the stack program, messages are read in the reverse order of
    their arrivals, which might be disconcerting to the user. If we use a queue instead
    of a stack, the messages can be read in the order in which they are received,
    which seems the more natural way of presenting them. The buffers that allow devices
    with widely divergent transmission rates, such as CPUs and disk drives, are usually
    implemented as queues.


    This section describes queues and shows how you to use them in programs.'
