  md: '# Bytes


    A computer keeps track of memory objects by using addresses. It would be too burdensome
    to address each and every bit in memory, so computers maintain addresses of bytes.


    A byte is a collection of bits that is large enough to hold the value of any member
    of the basic character set of the environment in which a C program executes. The
    number of bits in a byte is implementation-defined, with eight bits being a common
    size for a byte in microcomputer settings. The bits of a byte must be continuously
    arranged in memory.


    Figure 3-2 shows a pair of 8-bit bytes. Let''s examine the low byte, which contains
    bits numbered 0 through 7.


    **Figure 3-2: Bits are organized as bytes and words.**


    | 32768 | 16384 | 8192 | 4096 | 2048 | 1024 | 512 | 256 | | Bit Weight |

    |---|---|---|---|---|---|---|---|---||

    | 15 | 14 | 13 | 12 | 11 | 10 | 9 | 8 | | Bit Number |

    | 0 | 0 | 0 | 1 | 0 | 1 | 1 | 0 | | High Byte |


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 | | Bit Weight |

    |---|---|---|---|---|---|---|---|---||

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 | | Bit Number |

    | 0 | 0 | 0 | 1 | 0 | 1 | 1 | 0 | | Low Byte |


