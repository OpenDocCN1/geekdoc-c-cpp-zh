  md: 'The programs in this book have been developed and tested under the Santa Cruz
    Operation''s XENIX/386 System V, running on an Everex STEP 386/20 and MS-DOS 4.01
    on an IBM PC/AT. Programs are written to the ANSI standard for C in order to obtain
    the greatest degree of portability. Conditional compilation is used to permit
    the programs to be compiled by C compilers that are not fully ANSI-conforming
    implementations.


    OS/2, a multitasking operating system for Intel-based microcomputers, has features
    derived from both MS-DOS and UNIX, plus a few of its own unique features. After
    you are familiar with the basics of programming in C, you may wish to refer to
    Advanced C Programming for OS/2 by Augie Hanson and Vaughn Vernon (Addison-Wesley,
    1989) for information about programming the OS/2 kernel interface in C.


    # C Compilers and Interpreters


    A program that accepts human-readable source statements and produces machine-readable
    instructions is called a translator. C translators take one of two primary forms:
    interpreters and compilers. In any operating system environment, C can either
    be interpreted or compiled. Traditionally, C has been a compiled language, but
    interpreters for C have become popular in recent years as a way of teaching C
    and speeding the development process.


    Interpreters for C give the language a BASIC-like interactive feel that helps
    programmers learn C and create program prototypes, but they usually do so by limiting
    program size and by placing other constraints on the programmer. Compilers tend
    to take longer to produce running programs, but they can usually handle large,
    multi-module programs, provide optimization of program size and speed, and offer
    other benefits.


    For the purpose of learning C, you will find interpreters and compilers to be
    different in some ways, but any C translator will be of value to you (certainly
    better than none). We will concentrate on learning the language and on applying
    it at the application level avoiding system-level issues that would reduce or
    preclude program portability.'
