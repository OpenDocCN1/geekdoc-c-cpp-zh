    \ through to label_y */\ncase label_y:\n    statement_y;\n    break;\n}\n```\n\
    \nIf the control expression is matched by label_y, only statement_y is executed\
    \ before control the switch statement. If the control expression is matched by\
    \ label_x, then both statement_x and statement_y are executed.\n\n# ## Programmer's\
    \ Notebook\n\nIf you write a switch statement that depends on fall-through behavior,\
    \ be sure to use comments to clearly identify where and why it is being done.\
    \ Source code has a propensity to change over time as programs are modified and\
    \ maintained. It is very likely that someone else will be responsible for changes\
    \ and they need to know your intent and the details of the design to avoid unwanted\
    \ changes.\n\nYou can lay out a switch statement so that two or more case labels\
