    # Singly-Linked Lists


    Singly-linked list is a collection of nodes connected by pointers in one direction.
    Each node is a structure variable that contains a forward pointer. A list can
    contain a varying number of nodes, which is one of the primary virtues of linked
    lists. If you only need three nodes to manage your list data, then that''s how
    many you use. There is no need to waste space on unneeded nodes.


    Figure 12-1 shows how the components of a linked list are declared. The top half
    of the figure relates the data declarations to the objects for which memory is
    reserved. A single node, listhead, and two pointer variables, head and current,
    are created by the declarations.


    The bottom half of the figure depicts the first three nodes of a singly-linked
    list of some unspecified size. The listhead node is a "helper" node called thefirst
    node. It simplifies the code for list operations, as we''ll see in the next few
    sections of this chapter. The first node, sometimes called a "dummy" node, is
    usually a structure of the same type as the rest of the nodes. In most cases,
    only its pointer member is used. Some list-management schemes use other members
    of the first node to store special information about the list, such as the number
    of nodes.


    Just as we have used character pointers to mark the current position in a string,
    the current pointer is just that—a pointer, so its size is that of a pointer variable,
    not that of a structure. The same is true for the head pointer, which marks the
    position of the listhead node.


    The typedef statement creates the type name SNODE, which you can use as a synonym
    for struct node_st in declaration statement for list nodes and pointers, and type
    casts. A singly-linked list has a pointer per node for a forward link. The forward
    pointer has the same type as the list nodes themselves. Other members of the node
    structure can hold data and pointers to other memory objects that hold data outside
    the list node.'
