  md: '# APPENDIX D


    # THE C PREPROCESSOR


    The C preprocessor is conceptually the first pass of a C translation system. A
    preprocessor directive is an instruction to the C preprocessor, which recognizes
    the directives listed in Table D-1.


    | Table D-1: Preprocessor Directives |

    | IDENTIFIER | DESCRIPTION |

    | --- | --- |

    | #define | Associate an identifier with a definition text. |

    | #undef | Remove the definition of an identifier. |

    | #if | Start a conditional branch |

    | #else | Alternate conditional branch |

    | #endif | End a conditional branch |

    | #elif | Combined #else and #if directives |

    | #ifdef | Test whether an identifier is defined |

    | #ifndef | Test whether an identifier is not defined |

    | #include | Include the text of a named file |

    | #line | Line control |

    | #error | Produce diagnostic message |

    | #pragma | Cause an implementation-defined behavior |'
  merge: -1
  pgno: 362
