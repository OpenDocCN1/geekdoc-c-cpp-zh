    \ list and work through the function statements one atat a time, following the\
    \ links manually.\n\nThe code to delete a node is also complicated by the additional\
    \ link per node. The advantage of the doubly-linked list delete function is that\
    \ it deletes the current node instead of the next node in the list.\n\n```\nvoid\n\
    delete_dnode (DNODE *listp)\n```\n\n```\n{\n  listp->prev->next = listp->next;\n\
    \  listp->next->prev = listp->prev;\n  free(listp);\n}\n```"
