    # Call-by-Value Parameter Passing


    Unlike BASIC and some other programming languages, C uses a technique known as
    "call-by-value" as its default parameter-passing method. This means that when
    you call a function that accepts parameters, you provide actual arguments that
    are copies of the data being passed.


    For example, a call out to the string() function passes a copy of count to the
    function. It does not pass location of count, so the called function cannot affect
    what is stored in count.'
