  md: '# Circular Doubly-Linked List


    A circular doubly-linked list follows the pattern of a circular singly-linked
    list, but the doubly-linked case requires that two pointers per node be used.
    Circular lists make nice control mechanisms for editing buffers in text editor
    programs and other situations in which convenient wrap-around at the buffer boundaries
    as needed.


    Figure 12-4 depicts a circular doubly-linked list. The next pointer members of
    the node structures provide a circular forward chain of links and the prev members
    of a prefirst node provide the circular backward chain of links.


    The combination of a prefirst node and a circular list implementation prides a
    convenient and efficient dynamic storage mechanism. Functions that manipulate
    a circular list don''t need to deal with special cases. Functions that traverse
    a circular list need to deal only with the special case of skipping over the prefirst
    node when wrapping from the list tail to the list head, or the reverse.


    Figure 12-4: A Circular Doubly-linked List


