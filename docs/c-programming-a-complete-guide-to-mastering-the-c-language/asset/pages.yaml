  md: '# 250 C Programming


    who is paying the bills. And at times you may choose to use a language as a way
    of forcing yourself to learn it.


    If you or someone else has written a good design document, coding should be a
    relatively simple matter if you already know the target language. Converting pseudocode
    to source code may require some interpretation, but both the functional arrangement
    of the program and the logic should be well defined before coding starts.


    While coding, use descriptive names for symbolic constants, variables, and functions.
    Don''t skimp on comments. If written well, they will be important to you and anyone
    else who has to deal with your code in the future.


    During this phase, you or someone working closely with you should prepare program
    documentation. If you wait until later to do documentation, it will never get
    written, or it will be slapped together in a hurry when the customer complains.
    At that point, it''s usually too late to do it right.


    # Testing


    This is a critical, often overlooked aspect of program development. Today''s programs
    are often incredibly complex. Assuming that they have been written correctly is
    dangerous. Don''t assume anything at all or assume the worst. Even the best programmers
    make mistakes and someone has to find and fix them.


    Here are some guidelines for testing programs:


    +   - Use a test plan. The plan can often be written during the analysis and design
    phases when program behavior and performance is specified.

    - Test for correct responses to expected inputs to be sure that the program does
    what it was designed to do.

    - Test also to see that the program doesn''t do anything it shouldn''t do. This
    means that you should insert errors into the input data and check the program''s
    ability to detect or correct or report the errors. You should also check responses
    to unexpected commands.'
