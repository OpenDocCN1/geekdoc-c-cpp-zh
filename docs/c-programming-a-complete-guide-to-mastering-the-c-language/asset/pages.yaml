  md: '# Portability


    The primary portability issues regarding structures and structure-like objects
    are object size and member alignment.


    The sizes of structure members may differ from one environment to another. Members
    of type `int` can be equivalent to `short` on one machine and long on another,
    resulting in different ranges in the two environments. Avoid hard-coding size
    information in your programs. Use `sizeof` to compute array and structure sizes.


    Alignment of members differs among implementations. Holes may appear in structures
    due to alignment requirements placed on members by the implementation. Avoid writing
    code that "knows" where structure members are located.


    Of course, you could use knowledge of alignment details in a given environment
    to hide data or to implement copy protection schemes. In such situations portability
    doesn''t matter at all.


    The bit-field feature of C is a highly implementation-dependent one. Code that
    uses fields is not portable because the arrangement of fields varies among implementations.
    If you write code that involves fields, put it in separate modules that can be
    easily replaced in different environments.


    # Summary


    The C language structure provides a means of managing collections of related but
    distinct variables under a common name. Structures can be assigned, passed as
    function arguments, and returned from functions. Structure members are accessed
    by either direct selection with the dot operator or indirectly through a structure
    pointer.


    A union, based on the syntax of the structure, is a region of storage that can
    have, at any time, of several specified data types. You are responsible for knowing
    what type of data is stored and accessing it correctly.'
  merge: -1
  pgno: 235
