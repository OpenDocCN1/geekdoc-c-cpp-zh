    The process'' stdin stream is connected by default to the user''s keyboard. This
    stream is buffered into lines, which means that the process doesn''t receive any
    input until the user presses the Return key.


    Output from a running program goes to the standard output stream, stdout, which
    is connected by default to the user''s screen. This stream is also buffered for
    performance reasons, so output is collected into lines.


