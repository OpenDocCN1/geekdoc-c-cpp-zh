    # Short-circuit Evaluation


    In a compound expression containing logical connectives, if the result of the
    overall expression can be determined before the entire expression is evaluated,
    the remainder of the expression is not evaluated. Using the same assigned values
    for the variables in the previous examples, in the expression:


    ```

    m > n || x < y      /* true * /

    ```


    it is not necessary to evaluate x < y because m > n is true. An OR expression
    yields true if either operand is true, so C saves time by not evaluating the second
    expression (the right-hand operand of the OR expression) if the first is true.
    The result of the expression represents the second operand cannot change the outcome
    of the logical expression.


    Caution: If the unevaluated portions of a logical expression contains side effects,
    such as function calls or assignments, short-circuit evaluation can provide you
    with unpleasant surprises. For example, if the expression


    ```

    m > n || x < ++y

    ```


    the variable y would not be incremented because the expression


    ```

    i < ++y

    ```


    is not evaluated (for the given values). If the value of m was less than or equal
    to n, the increment operation would occur. Portions of your program depend on
    the value of y being incremented could be plagued by'
