  md: '# CHAPTER 6


    # FUNCTIONS AND

    PROGRAM ORGANIZATION


    # The Purpose of Functions


    All C programs consist of at least one user-defined function, `main()`, as you
    have seen numerous times in previous chapters. And virtually all `main()` functions
    call on other functions to do work. Those functions might be selected from the
    ones contained in the standard library supplied with your compiler, from specialized
    third-party libraries, or they might be functions that you write yourself.


    As you progress in your development as a C programmer, you will learn to use the
    standard library effectively, and you will probably develop and maintain your
    own libraries of functions to support the kinds of work you do.


    Functions are the essential building blocks of programs. Programmers use functions
    analogously to the way engineers use mechanical assemblies and electronic circuits.
    The concept is to partition a programming task or problem into a set of manageable
    subproblems and solve them individually.


    You will find, as many other programmers already have, that certain programming
    tasks occur with great frequency. Here are some examples:'
