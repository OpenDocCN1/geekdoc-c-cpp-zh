  md: '102 C Programming


    # # The break Statement


    Most of the statement blocks following the case labels in the four program end
    with break statements. A break statement causes control to pass to the statement
    following the enclosing switch or iteration (while, for, or do) statement.


    A break statement breaks only one level. When it is used inside nested loops or
    switch statements therefore, a break statement transfers control to the next outer
    layer. This mechanism provides the kind of measured control that typifies a structured
    language.


    Unless it is your intent that control associated with one case block into that
    of the next case (see the section dealing with fall-through), be sure to use a
    break, return, or continue statement or an exit() function call to terminate the
    statement block associated with the case label.


    # # The default Case


    A default label is equivalent to the else in a multi-way if statement. It is effectively
    a catch-all clause that is used if the control expression of the switch statement
    is not matched by any other label.


    You can place the default label anywhere in a switch statement. It does not have
    to be placed last, although placing it last is the most common practice and seems
    the most natural. Be sure to put a break or other jump statement after the default
    statement block to protect yourself against unwanted fall-through if you add code
    to the switch after the default case.


    # # Fall-Through and Multiple Labels


    You have wide-ranging flexibility in the way you use case labels and statement
    blocks. As you have already seen, leaving off the termination statement of a block
    of statements permits control to fall through to the next case. The following
    source fragment shows the use of fall-through in a switch statement:'
  merge: -1
  pgno: 123
