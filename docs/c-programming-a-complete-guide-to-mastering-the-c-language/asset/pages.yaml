  md: '# CHAPTER 10


    # THE PROGRAM DEVELOPMENT PROCESS


    This chapter approaches the program development process without regard to the
    language you use for program coding. The goal is to suggest a workable strategy
    for developing programs. To that end, the topics covered here are the following:


    +   - Problem Analysis

    - Program Design

    - Coding

    - Testing

    - Maintenance


    An approach to program development that works for one programmer might not be
    the best one for you. Take this information as it is intended—simply as a model
    that you can mold to your own purposes.


    # Problem Analysis


    A lot of the problems you will encounter, but by no means all, already have known
    solutions and require little more than expressing the solutions in'
