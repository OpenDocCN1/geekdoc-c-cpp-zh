    # Address Arithmetic


    Certain arithmetic operations are permitted on pointer variables. You can use
    pointers in arithmetic expressions involving the following operations:


    +   * add an integer to a pointer

    * subtract an integer from a pointer

    * get the difference between two pointers

    * compare two pointers for equality


    For operations involving pointer differences and comparisons, the pointers must
    point to the same object, such as an array.

    No other arithmetic operations are allowed. You cannot add, multiply, divide,
    or shift pointer variables. Use caution even with allowed operations. You could,
    for example, attempt to add an amount to a valid pointer that produces an address
    outside the array bounds or causes segment wrap-around. Such actions would likely
    produce unpredictable and almost unpleasant results.


    The size of a pointer is scaled to the size of the type of the object being pointed
    to. If you have a pointer to an array of doubles, for example, adding 1 to the
    pointer means that the pointer points in memory by the number of bytes needed
    to address the next array element.


