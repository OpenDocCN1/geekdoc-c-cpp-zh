    # The main() Function


    Every C program has one main() function, which is the starting point of the program.
    A C system does some initial setup work, such as processing command-line arguments
    before turning over control to your program code.


    Because the main() function is the designated starting point, there can only be
    one such function in a program. However, you can have as many other functions
    as you need in your program. The greet1.c program source file consists of main()
    and a call to one other function, puts(), which prints a message. A more complex
    program could involve many other functions; typically a mixture of library calls
    and programmer-defined functions.'
