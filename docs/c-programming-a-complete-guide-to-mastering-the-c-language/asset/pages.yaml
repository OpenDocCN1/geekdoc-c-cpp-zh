  md: 'Because of its greater contribution to the overall value of a byte, the left
    most bit is called the most significant bit (MSB) or the high-order bit. Conversely,
    the right most bit makes the smallest contribution to the overall value, and is
    called the least-significant bit (LSB) or the low-order bit.


    Only bits 1, 2, and 4 contribute to the value of this byte, so the byte''s value
    is the sum of the weights of these bits: 16 + 4 + 2, which equals 22. The number
    of unique values that can be represented by an 8-bit byte is 256. Of course, other
    byte sizes can represent greater or lesser ranges of values.


    # Objects and Addresses


    As you can see in Figure 3-2, we can use collections of bytes to form entities
    called objects. An object (except for bit fields) is a region of memory composed
    of a contiguous collection of bytes, one or more, that can represent values. A
    bit-field object, is a collection of contiguous bits, cannot be directly addressed.
    We will examine bit fields in detail in Chapter 8 after covering structures.


    In the figure, a pair of 8-bit bytes forms a 16-word bit. The significance of
    a byte depends on its position in an object. The low byte, as we have seen, contributes
    a value of 22 to the overall word value in this example. The high byte, for which
    discussion purposes has the same bit pattern as the low byte, contributes a value
    of 5,632 to the word value.


    Notice that the bit numbers of the high byte of the 16-bit data word goes from
    8 through 15 and the bit weights are correspondingly higher than those in the
    low byte. The byte value is, 4,096 + 1,024 + 512—or 5,632. For the case of 8-bit
    bytes, we can arrive at the same value by taking the ordinary byte value for the
    bit pattern (22) and multiplying it by 256.


    With the exception of bit fields, all objects have addresses. The address of an
    object is the address of its first byte in memory. Whether the first byte is the
    low-order or high-order byte of the object is implementation-defined and is the
    basis of some serious memory layout for portability issues.


