- img_proc: true
  md: 'The first pass is typically a C preprocessor that performs text replacements
    to convert symbolic names and macro names to their definitions before the actual
    C compiler sees the source files. The compiler proper may be a single program
    that handles lexical analysis, parsing, semantic analysis, and code generation
    tasks. The more common approach is to use a set of separate programs for each
    phase of the translation process.


    In a UNIX environment, the preprocessor is cpp C-specific. The compiler resides
    in files named ecom (VAX) and c0, c1 (PDP-11), and c2, which is an optional optimizer
    pass.


    You can also create assembly language source files and call the assembler, as,
    to assemble them, producing additional linkable object files. The assembler is
    a machine-specific program.


    The linkage editor, usually ld, is responsible for combining object files and
    library modules into an executable program. The linkage editor is not source language-specific.
    It takes object files produced by any compatible language translator, resolves
    all external linkages (function names, global variables, and so on), and prepares
    an executable program containing a relocation table.


    # Programmer''s Notebook


    In a UNIX environment, letter case is significant and it is traditional to show
    filenames in lowercase letters. Using all uppercase or mixed case causes problems.
    If, for example, you use uppercase letters in your source file to the header (STDIO.H
    instead of stdio.h), the compiler can''t find the header and reports an error.


    The output of the ld program is saved in a file called a.out by default. You can
    use command-line options to control the name that is given to the linker''s output
    file, such as pgm shown in Figure 1-1. The file is used when the program is run
    to initialize the code and data segments of what becomes a running UNIX process.'
