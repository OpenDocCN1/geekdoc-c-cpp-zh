    # Operator Precedence


    When an expression involves more than a single operator, the expression is potentially
    ambiguous, in the order of evaluation result. You can require a particular evaluation
    order by grouping subexpressions with parentheses. The expression:


    ```

    x + y * z

    ```


    is ambiguous because the result will be different if the compiler does the addition
    (x + y) first and the multiplication (y * z) second rather than the other way
    around.


    C has a built-in precedence mechanism that makes sense in most situations, eliminating
    the need for parentheses unless you want something other than the default behavior.
    Table 4-1 is the C operator precedence chart. You may want to copy the chart onto
    a sheet of paper and place it near your operating position for ready reference.


    | Table 4-1: Operator Precedence and Associativity |

    | OPERATOR | DESCRIPTION | ASSOCIATIVITY |

    |---|---||

    | () | Function call | Left to right |

    | [] | Array index | |

    | -> | Structure pointer | |

    | | Structure member | |'
