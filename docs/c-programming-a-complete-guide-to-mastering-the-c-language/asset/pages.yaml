    # Information Hiding


    Two attributes of functions are that they can be used to maintain data in a controlled
    way and can hide details of how a task is carried out. Both are important attributes
    of well-designed programs.


    Unlike the BASICS of old, which treated all data as global (any part of a program
    can read and write it), C lets you manage data as local or global. Local data
    is visible, and therefore changeable, only within a function or other limited
    scope.


    By using local variables in a function to hold important data, you can provide
    carefully controlled access to the data, preventing unwanted access to the data
    by other parts of a program. This is a particularly'
