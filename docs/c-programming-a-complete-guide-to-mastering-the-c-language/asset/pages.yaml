  md: '# C Programming in a UNIX Environment


    C was originally developed as a way of converting UNIX from a hardware-specific
    operating system into a portable operating system (the first). The language permitted
    researchers from Bell Laboratories to write system software that could be moved
    easily to other hardware environments. Had UNIX remained in its original assembly-language
    form for the DEC PDP-77 hardware, it would have been necessary to completely rewrite
    it for other processors—not an inviting prospect.


    Although C has features that allow programmers ready access to the underlying
    hardware, it is not tied to a particular processor. Thus, versions of UNIX from
    Interdata mincomputers, the DEC VAR series, and a wide range of other computer
    systems were written with modest programming efforts. Try that with systems written
    for specific hardware families. DOS, for example, is an Intel microprocessor operating
    system, written in assembly language. To move DOS to a Motorola 68000 microprocessor
    would require either a complete rewrite or a very sophisticated emulation of an
    Intel environment on the 68000. Most vendors take the easy (but expensive) way
    out and install an Intel coprocessor board to run DOS.


    # Overview


    The process of compiling and linking a C program under UNIX is depicted in Figure
    1-1. A typical C program involves at least one C source file and possibly some
    header files. A program of average complexity involves a set of C source files.


    The figure shows a program that is created from two source files, pgm.c and support.c,
    and a single header file, stdio.h. You a text editor (ed, vi, emacs, etc.) to
    create the C source and header files. The .c filename is required for C source
    files. The .h filename for headers is a convention that we use, but it is not
    a requirement. You could use .inc, for example, as long as you use the name consistently
    in source files that include the header.


    Headers are called that header because they are usually referred to ("included"
    by a preprocessor directive) at the beginning or head of a source file. Many'
  merge: -1
