    on the stack, the push operation succeeds, push() increments the stack index,
    and returns a 0. If the stack is full, push() simply returns a nonzero code to
    flag the problem, which causes a "Stack full" diagnostic message to be printed.


    A read command calls pop() to attempt to pop the message off the stack. If the
