    | Table 9-1: Mode Argument Codes |

    | MODE STRING | DESCRIPTION |

    | wb | Truncate to zero length or create binary file for writing |

    | ab | Append; open or create text file for writing at end |

    | r+ | Open text file for update (reading and writing) |

    | w+ | Truncate to zero length or create text file for update |

    | a+ | Append; open or create text file for update, writing at end |

    | r+b (or rb+) | Open binary file for update |

    | w+b (or wb+) | Truncate to zero length or create binary file for writing |

    | a+b (or ab+) | Append; open or create binary file for writing at end |


    The mode strings with the letter b in them specify binary file treatment. In binary
    access mode, all bits of each byte are significant, and no translations are done
    on the file contents on input and output.


    Modes that contain a+ in the second or third character position are called "update"
    modes. Update mode means that the file can be read and written as long as a file-positioning
    function call intervenes. The file-positioning functions are fseek(), fsetpos(),
    and rewind(). In addition, input can follow output if there is a call to flush()
    between operations.


    The normal return from a call to fopen() is a valid file pointer that can be assigned
    to a pointer variable. If the specified file cannot be opened, fopen() produces
    an error return of NULL to flag the error. Do not ignore error returns because
    they are important indicators of possible trouble. For example, attempting to
    read characters from a file that could not be opened is error. So writing to a
    file that could not be opened.


