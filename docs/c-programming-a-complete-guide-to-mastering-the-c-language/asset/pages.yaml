  md: 'Applying the * operator to an external array declaration makes the array private
    from the point of declaration to the end of the file in which it is declared.
    Otherwise, the array is globally visible.


    You can create the effect of a multidimensional array by declaring an array within
    which each element is itself an array. Each dimension requires an additional bracketed
    size specifier. Elements are accessed by application of bracketed subscripts,
    one for each dimension.


    Closely related to arrays, but not identical to them, are pointers. The pointer
    mechanism supported by C is extremely flexible and natural. The pointer dereferencing
    operator * accesses the object or function pointed to the pointer variable. Use
    & to obtain the address of an object. Array name is a constant pointer to the
    base of the array and a function name is a constant pointer to its code. You do
    not use & with array and function names.


    A literal string is a sequence of characters terminated with a null byte. You
    can store a string in a character array provided that the array is large enough
    to hold all of the strings characters including the null byte.


    The declaration syntax of arrays and pointers is consistent with their users.
    Thus, a declaration such as char *cp says that cp is a pointer to a character
    (char *), and *cp is a character.


    The array/pointer relationship in C is a close one. Given an array and a pointer
    to it, you can access any element via a subscript or the pointer and an integral
    offset. The later method is an example of arithmetic, which permits you to perform
    many other useful operations, such as computing a length and comparing pointers
    for equality or inequality.


