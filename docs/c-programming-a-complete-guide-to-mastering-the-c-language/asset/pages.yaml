  md: '# C Programming


    +   - Determining how long a character string is

    - Converting a character string to an equivalent number

    - Responding to a keyboard interrupt (BREAK)

    - Calculating the sine of an angle

    - Raising a number to a power


    These and many other tasks are candidates for packaging as functions. If a solution
    is general enough, it can be applied in a wide range of programs. Write a solid,
    generalized function once and call it any time you need that solution. Indeed,
    hundreds of common tasks have been ''solved'' and functions that implement those
    solutions have been collected together in what has to be known as the standard
    library.


    Perhaps you need a solution to a special problem that is not handled by a library
    function. If so, you can write your own function. You can, in fact, create your
    own libraries of functions using tools available with virtually all C language
    systems. In C, a function can perform an action, return a value, or. Functions
    can optionally have inputs. Using the engineering analogy, a function can be viewed
    externally as a ''black box'' that has a known set of input/output characteristics
    and some internal mechanism that implements a transfer characteristic. That means
    that the output depends on the values of the inputs in some predictable way.


    It is possible to have an output without inputs (the function generates an output
    based on internal data, such as a pseudo-random number generator might do). A
    function might also accept inputs and perform an action without producing any
    output value (for example, move the cursor or mouse pointer to a screen position).


    ![](img/2219c9d84a179a4ea06a2deb13b7888b_141_0.png)


    Some computer languages (Pascal, Modula 2, etc.) distinguish between a subroutine
    that returns a value (''function'') and one that does not (''procedure''). C considers
    all subprograms to be functions regardless of whether they return values or not.'
