    # Portability


    The last argument vector, argv[argc], should be assigned a value of NULL according
    to the ANSI standard. Many pre-ANSI C translators have supported this convention,
    but some dont. The initial value of the argc parameter to find out where the end
    of the argument list is located rather than depending on finding a NULL as the
    last vector.


    To obtain reasonable uniformity in the way command-line arguments are keyed in
    by the user and analyzed by a program, use the getopt() library function if it
    is available in your C translator''s library. If it is not, as is the case for
    many DOS C translators, you can use the public domain version of getopt() that
    is included in one of my other books, Proficient C (Microsoft Press, 1987). Virtually
    all of the programs that accept command-line arguments in the book use getopt()
    to process the arguments in a consistent manner.


    The set of environment variable names and values are implementation-defined. Interactions
    with the environment may also vary from one C-supporting implementation to another.


    The use of a third argument to main() is not universally supported. Even if you
    can use envp, its value is valid only at program startup. Although some environments
    support the use of a putenv() library function, most do not.'
