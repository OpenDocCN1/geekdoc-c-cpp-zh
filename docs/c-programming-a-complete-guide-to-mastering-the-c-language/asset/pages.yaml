  md: '# Floating Types


    So far we have dealt only with integral types. Numbers that are encountered often
    in scientific, engineering, statistical, and other fields are also important.
    They are real numbers, which are represented in C as floating-point numbers.


    The exact internal representation of a floating-point number is not specified
    by the standard. Each implementation is free to choose its own representation.
    Many implementations use the IEEE-standard floating-point format, but this is
    not a universal choice. The IEEE (Institute of Electrical and Electronics Engineers,
    Inc.) is an international professional organization that, among other things,
    is involved in creating and promulgating standards.


    The floating-point types include float, double, and long double. What varies among
    these types is the precision with which a particular value can be expressed, where
    precision is a function of the number of digits used to represent the value.


    The floating-point type hierarchy parallels that of integers. The set of float
    (single precision) values is a subset of double (double precision) values, which
    are, in turn, a subset of long double (extended precision) values. In a given
    implementation, all floating-point types can have the same precision, but double
    cannot have a precision that is less than that of float nor greater than that
    of long double.


    +   Programmer''s Notebook


    > Some existing C programs may contain the obsolete long float type as a synonym
    for double. Such programs must be rewritten to use double as a type specifier.


