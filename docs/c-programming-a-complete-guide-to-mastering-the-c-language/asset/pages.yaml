    The result of an expression value depends on whether the values are being ANDed,
    ORed, exclusive-ORed, or complemented. The values of the operands are compared
    at the level of individual bits. Table 4-7 shows the relationships between bits
    for the bitwise exclusive OR. The other bitwise operations follow the pattern
    of the truth tables shown for logical operators except that we are now dealing
    with individual bits instead of entire words or bytes.'
