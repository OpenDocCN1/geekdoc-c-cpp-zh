  md: '# Functions and Program Organization 123


    important design consideration in large programs and those that are being worked
    on by groups of programmers rather than someone working alone.


    Hiding the details of a task''s implementation is just as important as shielding
    data from view. One part of a program calls another to do a job and, perhaps,
    gets back a result. The caller need not be concerned about how the called function
    does the job.


    Say you have a program that collects data on an audio signal input and calculates
    its average power value. You can package the data collection tasks into one or
    more functions and the average calculation into another. If you later find a better
    way to do the average calculation (improved speed or accuracy), you can later
    alter the averaging function without having to make changes to any other functions
    that call it.


    # Function Declarations


    Now that you have a feel for what functions are and how they are used, let''s
    see how to declare and define them. As with variables, the C translator requires
    that you provide declarations of functions before you use them in your program.
    However, certain defaults apply if you do not provide complete declarations.


    # External Names and Linkages


    A C translator, as you know, is responsible for converting source statements into
    machine instructions and data. It does so on individual translation units. In
    the typical case of a C compiler, the compiler translates a source file and all
    headers it includes with preprocessor directives.


    Recall the discussion in Chapter 1 that shows how a C program can be created from
    a set of source files. The individual source files are translated into object
    modules that are linked to produce an executable program file. This method is
    often called separate compilation because each source file is compiled asynchronously
    with respect to any other source files.


    Therein lies a problem. If a function is defined in one source file and called
    in another, how does the translator know what to do? The answer'
