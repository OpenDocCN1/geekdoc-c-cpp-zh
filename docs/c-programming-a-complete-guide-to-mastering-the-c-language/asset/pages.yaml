    # The sizeof Operator


    The sizeof operator is the only C operator that is represented by a name. It is
    neither a function nor a macro. The sizeof operator yields a value that indicates
    the size in bytes of a specified object.

    The general form of a sizeof expression is:


    ```

    sizeof expression

    ```


    where expression is an identifier or a cast of a data type.

    The purpose of sizeof is to give you a way of determining the sizes of various
    objects in a machine-independent way. In later chapters of this book covering
    arrays and structures, we will use sizeof to determine how large an object is
    and how many elements an array contains. Given this capability, you can write
    programs that are portable, barring the use of any other non-portable constructs.

    If you want to know how many bytes are used to represent a particular data type,
    use a cast of the type as the expression, as in the following statements, which
    determine the size of an integer in the execution environment:


    ```

    size_t bytes;

    ...

    bytes = sizeof(int);

    ```'
