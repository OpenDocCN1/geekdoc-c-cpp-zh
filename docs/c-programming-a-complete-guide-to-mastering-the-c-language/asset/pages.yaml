  md: '# C Language and Programming Environments


    headers are already prepared for you and reside in a special directory on your
    computer system. On a UNIX system, the directory is /usr/include. In addition,
    some header files used in UNIX system-level programming are placed in the /usr/include/sys
    directory.


    The crosshatched boxes in Figure 1-1 represent programs that compile source files
    into object form and link objects files and library modules into an executable
    program file. The compiler box represents one or more programs (called passes
    or phases) that comprise the compiler.


