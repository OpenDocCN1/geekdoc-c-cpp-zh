  md: '# Preprocessor Operators


    The operators listed in Table D2 are used with preprocessor directives.


    | Table D-2: Preprocessor Operators |

    | OPERATOR | DESCRIPTION |

    | --- | --- |

    | # | A macro parameter is treated as a quoted literal string. |

    | ## | Concatenate tokens in macro parameters (''token pasting''). |

    | defined | Unary conditional operator |


    # Predefined Macro Name


    The macros listed in Table D-3 are defined by the implementation. These macros
    are not subject to modifications by #define or #undef directives.


    | Table D-3: Predefined Macro Names |

    | MACRO NAME | DESCRIPTION |

    | --- | --- |

    | __LINE__ | Current source file line number (decimal constant) |

    | __FILE__ | Current source file name (string literal) |

    | __DATE__ | Date of translation (if available) |

    | __TIME__ | Time of translation (if available) |

    | __STDC__ | Flag to indicate standard C, if applicable |'
