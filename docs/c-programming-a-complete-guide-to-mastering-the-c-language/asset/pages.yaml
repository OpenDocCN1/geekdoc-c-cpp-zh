  md: '# Feature Summary


    Let''s step back then, and take a wide view of C language by looking first

    at its primary features:


    +   - C is a small language, which makes it possible to grasp it in full

    (unlike Ada and other large languages, which most programmers

    can only hope to learn as subsets of the whole).

    - C is widely portable to environments as diverse as stand-alone mi-

    processors and the fastest supercomputers.

    - Although initially used for systems programming, C is suitable for

    a wide range of programming tasks including applications pro-

    gramming.

    - Possessing a clean set of control statements, C encourages and fa-

    cicilitates structured programming.

    - C has a rich set of operators that accounts for its expressiveness

    and flexibility.

    - C is fully recursive, permitting you to create elegant solutions

    to many problems that lend themselves to recursive rather than iter-

    tative solutions.

    - C has a set of data types that reflects the underlying architecture

    of most modern computer systems, while not being shackled to

    any particular computer architecture.

    - One of C''s most salient features is its pointer mechanism and the

    close relationship of pointers and arrays.

    - A standardized and versatile run-time library of often-used rou-

    tines provides a common, well-defined programming interface.

    - C has features that permit machine-level operations, permitting

    system programmers to use C as a high-level assembler.


    Next let''s take a closer look at C language by examining some of its

    primary attributes in a bit more detail. The following material describes

    the elements of a C program, the statements that control the flow of'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'execution of a program, the use of subprograms (functions and macros) to divide
    programs into manageable units, and other attributes of the language.


    # Elements of C Programs


    C is a relatively small language. It reserves a set of 32 words ("keywords") or
    standard identifiers. In addition, the names of standard library functions and
    macros are now effectively reserved. The ANSI standard allows a compiler vendor
    to reserve additional words as long as there is no conflict with standard identifiers.
    Appendix A summarizes the reserved words and standard identifiers.


    A comprehensive set of operators, 40 in all, gives C its great power and flexibility.
    C has all of the expected operators for doing arithmetic, performing relational
    and logical evaluations, and for managing data in various ways. In addition, it
    has low-level operators for manipulating data at the bit level, permitting programs
    to program at the systems level and the applications level with equal facility—without
    having to resort to machine-specific assembly language programming.


    You use C''s reserved words, operators, and standard routines, together with your
    own data items and routines, to compose programs. Each program consists of one
    or more functions, optional data, and possible additional elements, we will discuss
    later. These items exist in a source file or a set of source files. C programs
    must be converted into executable machine instructions. The process is generally
    called translation (translating each C statement every time the program runs)
    or by compilation (translating C statements into machine instructions before the
    program is run).


    Later in this chapter, you''ll see how some of the primary programming environments
    are organized, and you will learn how to use them.


    # Flow-Control Statements


    The default behavior of a program is to execute a series of statements in sequence.
    Some programs contain nothing but sequentially executed statements. Most problems
    however, are more complicated than that and therefore, most involve alterations
    to the flow of execution of statements.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# C Programming


    Aside from function calls (see the section about subprograms), the mechanism by
    which the flow of execution of a set of program statements is altered, is a set
    of flow-control statements.


    In many computer languages, a basic decision-making statement (if or test) and
    an absolute jump statement (jump or goto) form the flow-control mechanism. Nothing
    else is required anything else that is needed can be constructed from these basic
    statements. There is a problem, however.


    Absolute jump statements permit (and unfortunately encourage) an unstructured
    kind of programming technique produces programs that are hard to read and understand,
    and are often difficult to debug (find and fix errors). Languages with limited
    flow-control mechanisms usually depend on the use of labeled statements (names
    or line numbers) as targets of the jump statements.


    The problem is that you can write programs that jump all over the place in seemingly
    random order. If you visualize the jumps as strands of pasta, you end up producing
    what looks like a bowl of spaghetti. Not a pretty sight in a computer!


    C provides sophisticated flow-control constructs that facilitate and encourage
    a structured approach to programming. There''s no guarantee that you will write
    great chance even with such constructs available to you, but at least you''ve
    got a chance. The primary flow-control statements in C can be categorized as branching
    (decision) statements and looping (iteration) statements. In addition, C provides
    three jump statements.


    The branching statements are the if statement, which can have an optional else
    clause, and the switch statement. The statement provides a basic two-way branching
    capability—the fundamental decision-making capability. The switch statement, together
    with its case and default labels, provides a flexible multi-way branching capability.


    The C language looping statements include the while, for, and do...while statements.
    These statements provide a way to execute a program statement or a block of statements
    repeatedly as long as a control expression is logically true. Loops figure prominently
    in many programs.


    Although programmers esche absolute jumps, favoring the discipline of structured
    control statements, C provides the break, continue, and goto statements that are
    restricted forms of absolute jump state-'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# C Language and Programming Environments 5


    ments. They are typically used sparingly in C programs, but each has its place,
    as we''ll see in later chapters.


    # Subprograms


    One of the major tenets of structured programming is that a program should be
    broken into a collection of subprograms, each of which does a single, carefully-defined
    task. In C, subprograms take one of two forms: functions and macros.


    A function is a subprogram that involves a call/return mechanism supported by
    modern stack-oriented computer systems. A stack is an abstract data type that
    represents a region of memory used for communication between parts of a program.
    Functions use a stack to receive inputs and return values to their callers. A
    function''s instructions appear once in an executable program and can be called
    any number of times.


    A macro is a name, preferably short, that stands for something that is usually
    larger and more complex than the name itself. You create macros by defining them
    and letting the C compiler''s preprocessor expand them. Each occurrence of a macro
    name in a program is replaced by the macro''s full definition. This produces instructions
    that are executed in-line rather rather than by the call/return mechanism used
    by functions.


    You will initially create programs that consist of a single function main() to
    introduce the essential elements of the language and to see how programs are compiled
    and run. After you have been shown how to write C functions, your programs will
    take on a more modular form involving multiple functions, and where appropriate,
    source files.


    # Other Attributes of C


    Certain tasks, such as reading and writing data in disk files, copying text, and
    calculating the length of a string of characters, occur often in programs. Many
    functions and macros have been written and refined during the better part of two
    decades and collected into what has come to be known as the standard C library.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 6 C Programming


    A library is composed of linkable object modules. Each object module can contain
    a single function or a set of related functions. When you compile a program, the
    compiler converts your source files into object files and then calls a linker
    to hook your object files together with selected object modules in the standard
    subroutine library to produce an executable program file. Only modules that resolve
    external names which you have used in your program or provide required run-time
    support are linked. This minimizes your final program size by not dragging in
    instructions that are not needed.


    In addition to the compiler and linker, C programming systems provide other support
    programs that aid the programmer in preparing and testing programs. Syntax checkers
    and debuggers are representative of these tools. Some C programming systems provide
    other tools, such as syntax-directed editors and on-line help features. Anything
    that helps to simplify the programmer''s job without getting in the way deserves
    praise.


    # Programming Environments


    As noted in the Introduction, C is supported across an amazing range of computing
    environments. I cannot possibly cover them all in this book. Although the details
    of a given implementation vary from one environment to another, the core of a
    C programming system is essentially constant, so this book should serve the needs
    of a wide audience.


    Two popular operating environments in which C is used are specifically addressed
    in this book:


    +   - UNIX

    - MS-DOS


    UNIX and other UNIX-like systems represent open systems in typical minicomputer
    and mainframe environments, and to a growing degree, in some microcomputer environments.
    MS-DOS (and IBM''s Personal Computer DOS) is representative of the IBM Personal
    Computer and alike microcomputer systems, which are considered, for the most part,
    non-proprietary. I have purposely avoided giving coverage to blatantly proprietary
    and closed computer programming environments.'
