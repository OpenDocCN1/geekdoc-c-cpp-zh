  md: '# C Language and Programming Environments 13


    source-level debugger to the integrated environment. Turbo C''s latest incarnation
    now sports a symbolic source-level debugger, too.


    For our purposes, the products are nearly identical because they both track the
    ANSI standard, provide approximately the same set of features, and produce nearly
    equivalent object code in terms of speed and size given comparable default settings
    and identical source code. The compilers have different default settings and you
    may prefer the operation of one over the other, but reactions to differences are
    usually personal and often trivial.


    # Microsoft C 5.0 Optimizing Compiler


    The Microsoft 5.0 Optimizing Compiler is a full-featured compiler that is suitable
    for large program development projects. It features a command-line compiler, several
    programming support tools, and a version of the QuickC compiler.


    One of the support tools is the CodeView symbolic, source-level debugger. CodeView
    gives you a convenient means of testing and debugging programs. A comparable symbolic
    debugger is available for Turbo C and is included in the Professional Turbo C
    program development system.


    A primary reason for using the optimizing compiler, which I will refer to as C5
    from now on, is the ability to optimize your program for speed, size, or both.
    This is of little consequence when you are learning to program in C, but it is
    of great value to those who are writing commercial software. Shaving off the running
    time or size of a program can have an important impact on its reception in the
    highly competitive microcomputer marketplace.


    I have found that initial program design and prototyping, experimenting, and just
    playing around is most easily done using an integrated environment. The built-in
    help systems are great assets in the early going. If a program is likely to go
    into commercial service, I recompile it with a full optimizing compiler.'
