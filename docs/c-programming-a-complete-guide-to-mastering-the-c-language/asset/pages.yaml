  md: '# The Conditional Expression


    Explicit two-way branches occur frequently in programs. C provides a conditional
    operator that allows you to compactly express such branch statements. The conditional
    operator is C''s only ternary operator—one that takes three operands. A conditional
    expression has the form:


    ```

    expr1 ? expr2 : expr3

    ```


    The value of a conditional expression is the result of evaluating either expr2
    or expr3, but how does a program know which to use?


    The result of evaluating expr1, which must be a scalar type, determines which
    of the other two expressions are evaluated. If evaluating expr1 produces a nonzero
    result, expr2 is evaluated. Otherwise, expr3 is evaluated.


    Hacking back to our "toggle" example, we could use a conditional expression to
    obtain the same effect as the if statement. Here''s how we:


    ```

    state == ON ? OFF : ON

    ```


    yields a result of OFF if state has a value of ON or ON if it has a value of OFF.
    We can assign the evaluated result of the expression to the variable state, causing
    the variable''s value to change.


    ```

    /* code that alters the value of the state variable */

    state = state == ON ? OFF : ON;

    ```


    In this example, the true and false branches consist of only symbolic constants,
    but they can be any valid expressions. We will see in later chapters, the conditional
    expression plays an important role in the creation of macros.


