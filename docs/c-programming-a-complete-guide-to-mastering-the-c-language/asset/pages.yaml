    # Array of Characters


    A buffer is a place in memory where you can store data for later use when it is
    received. The statement:


    ```

    char name [NBYTES];

    ```


    is is a declaration of an array of characters that is NBYTES long. This statement
    introduces several new terms and concepts.


    The keyword char indicates the data type of a variable, in this case, name. An
    array, indicated by the square brackets, is a collection of two or more objects
    of identical type. The symbolic name, NBYTES, is a defined constant (see the next
    section for details), which in this program has a value of 15.


    Therefore, the statement declares an array of 15 characters. This array is used
    to hold a name that is typed by the user.'
