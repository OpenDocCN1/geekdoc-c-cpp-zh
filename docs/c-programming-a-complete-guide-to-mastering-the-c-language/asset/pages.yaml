    # Expressions


    Combinations of operators and operands create expressions. An expres-

    sion-form performs a calculation and produces a result, or causes some action

    (called a side effect) to occur. In fact, you can use expressions to specify

    combinations of these tasks and, in more advanced applications, you can

    use expressions to designate objects or functions.


    In general, the order in which expressions are evaluated is not speci-

    fied, except as noted below. Therefore, neither is the order in which side

    effects occur. This language design permits compiler writers to

    take advantage of the behavior of a particular or execution

    ment. It also means that you should write your code in a way that

    avoids dependence dependence on evaluation to gain easy portability to a wide

    range of environments.


    Evaluation order is specified by expression syntax (operator pre-

    den) in expressions involving function calls, some logical operators, and

    the conditional operator. These topics are covered in the material that

    follows, evaluation-order details are described.


    The behavior of a C program is undefined if the evaluation of an

    expression produces a mathematically undefined or out-of-range result.

    The failure to produce a defined, in-range result from an expression

    evaluation is called an _exception.


