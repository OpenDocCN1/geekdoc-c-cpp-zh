    # Programmer''s Notebook:


    As Figure 13-1 shows, DOS uses different conventions for command-line symbols.
    For compatibility with CP/M, the predecessor of DOS, the forward slash (/) is
    used as the "switch character" or option flag. Because of this choice, the pathname
    separator is the backslash (\). This difference in command syntax is a chronic
    pain for those of us who regularly work with both DOS and UNIX.


    # The look Program


    This is the program that was alluded to in Figure 13-1. The behavior of the look
    program is specified by the command-line option, -c, and controlled internally
    by the variable showControl. The connection between the external specifier and
    the internal variable is made by the parameters main(), argc and argv, which you
    are seeing for the first time in this book. If the definition of main() has formal
    parameters, code, command-line arguments, something must call main() with actual
    arguments. But we haven''t written anything that calls main(), the entry point
    to our program. So what does call it?


    The answer is the C run-time startup system. When a C program is translated, code
    is generated that, among other tasks, passes-line arguments in a call to main().
    The arguments provide values for argc, the argument count, and argv, which is
    an array of pointers to character strings.


    The integer argc includes the program name and any optional and required arguments
    typed by the user. The character pointer array, argv[], contains one pointer for
    each argument that results from the command line and possibly expanding wildcards
    in filename specifications.


