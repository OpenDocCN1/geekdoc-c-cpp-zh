  md: '# NAME

    src2vp

    vp2src


    # SYNTAX

    src2vp srcfile [> vpfile]

    vp2src upfile [> srcfile]


    DESCRIPTION

    The src2vp utility program converts an ordinary program source file (text) into
    a form that is suitable for use in Microsoft Word and Ventura Publisher files.
    The program sends its output to the standard output stream, which you can optionally
    redirect to a file or other destination.


    # Word Conversion


    You must process raw source files to prepare them for merging into documents prepared
    with Microsoft Word. Word treats all lines terminated by a newline character as
    separate paragraphs. The src2vp program converts newline codes to the vertical
    tab codes expected by Word.


    # Ventura Publisher Conversions


    Ventura Publisher uses the @, <, and > symbols as formatting commands, you must
    protect the symbols if they are to be seen as themselves within a VP document.
    The prescribed method of protection is to double the character (for example, @
    must be changed to @@) to prevent it from being treated as a VP command. The src2vp
    program does these translations.


    The vp2src program provides the inverse translation. Use it to create a correct
    source file from material extracted from a document file. The file is assumed
    to have been extracted from a Ventura formatted file by using the "unformatted"
    save option of Word.


    # EXAMPLE


    ```

    src2vp sample.c > sample.cvp

    ```'
