    # Integrated C Programming Environments


    Turbo C was the first integrated C programming environment for MS-DOS computers,
    combining a full-screen editor, compiler, and help system in a single program.
    It was soon followed by a similar product, QuickC, from Microsoft. QuickC had
    similar capabilities and added a symbolic,'
