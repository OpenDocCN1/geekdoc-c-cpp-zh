    (a number) that represents the letter A in the character set.


    It is not important for you to know not so that you won''t be tempted to write
    programs that are not portable. It is sufficient to know that the code for A in
    the ASCII character set is not the same as the code for A in the EBCDIC character
    set, for example, and to avoid code that depends on ''A'' being a particular value.
    EBCDIC is the Extended Binary-Coded Interchange Code, an eight-bit code used primarily
    on IBM mainframe systems.


    Don''t be confused by differences between numeric values and character values.
    In example, the numeric value 0 represents the null character (N). The ASCII value
