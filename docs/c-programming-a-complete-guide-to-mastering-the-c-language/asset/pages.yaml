  md: 'In some other part of the program, the same macro can be called with

    a different argument to print an error message with a different text.


    # Macros and Side Effects


    Be careful when defining macros to avoid unwanted side effects. A side

    effect is an action that occurs as a result of executing a statement. We

    often write statements for their side effects (clear the screen, store a value,

    and so on). But sometimes the side effects of a statement execution are

    not wanted and can produce disastrous results.


    Our EVEN() macro is faulty because it will fail to produce the correct

    result in some circumstances. If we pass it an expression such as a + b

    instead of a hard-coded number for the num parameter, the conditional

    test becomes:


    ```

    a + b % 2

    ```


    instead of the expression:


    ```

    (a + b) % 2

    ```


    that we intended.

    If a equals 2 and b equals 4, we have 2 + 4 % 2, which evaluates to 2 +

    0, or 2, giving a result of FALSE. The result should be true because 2 + 4

    6, an even number.


    The solution to this problem is to use parentheses liberally in the

    definition of a macro. This causes the order of evaluation to be what we

    want. Here is the revised definition of EVEN():


    ```

    #define EVEN (num) ((num) % 2) ? FALSE : TRUE

    ```


    Now if you pass the expression a + b with the values used earlier,

    evaluation proceeds as ((2 + 4) % 2), which yields a value of 6 % 2 or 0—the

    correct result because there is no remainder.


    The additional parentheses around the entire replacement text in the

    macro definition permit the macro to be used conveniently as a component

    of other expressions.'
