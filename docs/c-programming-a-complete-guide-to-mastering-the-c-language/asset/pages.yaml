  md: '# 308 C Programming


    The problem became one of making programs work together instead of against each
    other.


    The manuscript for this book incorporates the source code of programs and functions
    from the original source files to avoid keying mistakes. This introduces a problem
    that is best solved by a computer program. The problem is one of conflict between
    symbols needed in the source files and formatting codes that execute commands
    in the word processing and desktop publishing software.


    If you read source files into a Microsoft Word document, you need to process the
    raw text files to prepare them first. This requirement stems from the fact that
    a word processor treats each line of a source file, delimited by a newline character,
    as a paragraph. Line breaks within a paragraph are indicated by a special code,
    the vertical tab, in place of the newline.


    Because Ventura Publisher uses the @, <, and > symbols in formatting commands,
    you must protect the symbols if they are to be seen as themselves within a VP
    document. As you know, the < and > symbols are used in preprocessor directives
    and relational expressions. If you don'' protect them from processing, they are
    lost or interpreted as formatting commands, often with startling attribute changes
    and surprises.


    # Designing a Solution


    The approach to solving this conversion problem involved examining the way each
    product worked. Although the documentation for these products is quite solid and
    comprehensive, I had to run numerous tests on files to see what codes were used
    for what purposes.


    The src2vp program is the ad hoc solution I came up with. It converts all newline
    codes in a source file to the vertical tab code expected by Microsoft Word. With
    this conversion in place, you can select the source listing as a richt rather
    than a collection of individual paragraphs.


    The prescribed method of protecting a special symbol is to double the character.
    For example, @ must be changed to @@ to prevent it from being treated as a VP
    command. The src2vp program does this translation.


    My first crack at a design, expressed in pseudocode, looked like this:'
