  md: '# CHAPTER 13


    # COMMUNICATING WITH

    THE OPERATING SYSTEM


    To this point our programs have had a one-way communication with the operating
    system by returning exit codes that indicate success or failure. It is also possible
    for the operating system to pass data to running programs in a couple of ways.


    This chapter explores the use of command-line arguments and environment variables
    as communication pathways from the operating environment to a running program.


    # Command-Line Arguments


    Even under growing pressure from windowing interfaces and menu-driven systems,
    the command line is still an important feature of present-day operating systems.
    Both UNIX and DOS in their raw forms provide a Spartan prompt that invites the
    user to type a command.


    It would be convenient to have commands that require only a simple command name,
    preferably short, and possibly a filename or two. Indeed, that was a goal of the
    original UNIX design, which emphasized the use of many single-purpose commands
    that could be combined in pipelines to provide hoc solutions to a wide range of
    computing and text-processing problems.'
