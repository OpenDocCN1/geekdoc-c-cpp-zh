  md: '# Part 3: C Programming Projects


    # CHAPTER 14


    # FILE CONVERSION UTILITIES


    In preparing the material for this book, I used several UNIX-based and DOS-based
    systems. What follows is the analysis of a problem we encountered and a solution
    that saved the editors and me a lot of time. The solution will spare you the anguish
    of reading incorrectly transcribed program source listings because the process
    was automated.


    # Understanding the Need


    The wordprocessing and document formatting was done on an IBM Personal Computer/AT
    running version 4.00 of PC-DOS. Wordprocessing was handled by Microsoft Word and
    document formatting by Ventura Publisher. Certainly other software could have
    done the job as well, these programs and systems were available to both myself
    and my publisher.


    A traditional approach to creating documents of this type is to have someone key
    in text and code from the author''s drafts and printed listings of program sources.
    This is time-consuming and error-prone.


    Given the availability of computer systems and software, we chose to automate
    the process. A complex task such as this involves not one, but many programs,
    including text editors, compilers, word processors, layout programs, illustration
    programs, and communications software.'
