  md: '# 246 C Programming


    some programming language or using someone else''s prepackaged solutions.


    If you take this approach, try to understand why and how the solution works and
    determine what its limitations are. Using `strlen()` in a C program to find the
    length of a character array will probably lead to trouble because the array might
    not have a terminating null byte. String functions should only be applied to null-terminated
    strings, and if you don''t know that you can have serious trouble.


    The other problems, those that are unstructured and unsolved, pose the kind of
    challenges that make occupations such as systems analyst and programmer interesting
    and rewarding. The satisfaction you derive from making a box full of silicon chips
    and a myriad of other electronic and mechanical parts do your bidding is hard
    to describe, but it sure feels good.


    So do you go about analyzing a problem?

    The simple answer is that you think a lot about the problem. Flip that answer
    is, thinking really is the key to understanding the nature of a problem and getting
    a good description of it down on paper or keyed into a computer. If you attempt
    to apply canned solutions to a poorly described problem, you will usually produce
    a program that doesn''t run at all or one that works poorly.


    Try to break a problem down into a set of smaller, more easily managed subproblems.
    Let''s say, for example, that you need to install a TV antenna to get a better
    picture and that giving up TV viewing, though probably a good idea, is not an
    acceptable option for you. Here are some questions you might ask yourself:


    +   - Does it have to be outside or can it go in the attic?


    +   - How big is the antenna?


    +   - Do I have to be able to rotate it?


    +   - Will the antenna have a clear shot at the transmitting antennas?


    +   - Are there any ordinances preventing outdoor antenna installations?'
