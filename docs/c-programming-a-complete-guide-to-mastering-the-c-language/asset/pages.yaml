  md: '# Program Design


    Program design is often a straightforward, rote process. At other times, especially
    when dealing with interfaces to hardware and humans, it is anything but routine.


    Program design involves designing the right data structures to represent the data
    items of a program, and choosing designing appropriate algorithms. Getting the
    right data structures is, perhaps, the most important aspect of program design.
    Successful programmers put a lot of effort on the data-design part of each programming
    project before proceeding with the rest of the work. It usually pays off.


    In designing a program, the use of brainstorming techniques with a group of designers
    can be very helpful. An important aspect of this design technique is to capture
    ideas as they surface and make them accessible. Try not to criticize ideas brought
    out during this activity because that serves only to discourage participation
    and block the free flow of ideas. You have plenty of opportunity to analyze each
    suggestion later.


    Designers and programmers have tried many techniques to capture design ideas in
    a way that is understandable and accessible. The goal is to describe a programming
    solution to a problem in a computer language-independent way, preferably in English
    or your native tongue. The solution can then be coded by you, or as is often the
    case, by someone else, in any suitable computer language.


    Flowcharts, Vernier-Oring diagrams, data-low diagrams, and numerous techniques
    attempt to capture the design of a program in a visual presentation. Each has
    strengths and weaknesses in a given situation.


    One of the designs that I prefer is the use of pseudocode, which is a description
    that, in my case, has elements of English and C or Pascal. Pseudocode shows the
    structure of a program, is easy to read, and is easy to convert to a real computer
    language. Its primary benefit is that pseudocode can be created and maintained
    by the use of outliner programs such as a Ready!, Think Tank, or the one built
    into Microsoft Word. Such programs permit you to expand and collapse outlines,
    move whole sections up and down in a hierarchy, and reorganize sections of the
    outline with ease.'
  merge: -1
  pgno: 269
