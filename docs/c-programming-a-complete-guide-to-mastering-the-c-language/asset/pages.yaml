  md: '# Program Organization and Flow of Control


    When you write a program, try to use one function per task to organize your work
    and to benefit from having reusable modules at your disposal. The one-task-per-function
    guideline is a good rule that forces you to aim for generality and reusability
    of code.


    Figure 6-1 shows how a program called boxtext be organized. The organization depicted
    in the figure is a way of doing the job, but is by no means the only way. Each
    boxed item is the name of a function with main() being the starting point for
    program execution.


    Shaded boxes contain the names of standard library functions (or macros, which
    we will discuss later). The remaining boxes contain the names of user-defined
    functions. The figure shows the function-calling hierarchy. For example, main()
    calls strlen(), hborder(), and puttext(). The latter two functions in turn call
    the string() and putchar() functions (putchar() often implemented as a macro for
    speed. In addition, puttext() calls the printf() standard library function.


    In Chapter 5, you learned about program flow of execution and some of the ways
    to control program flow. In addition to looping and branching statements, program
    flow is controlled by the function call/return mechanism. This allows a program
    to save information about its current location and state, and jump to another
    piece of code. The return address, the state of machine registers and the state
    of other data is saved on the program stack, a region of memory that serves as
    an electronic scratchpad.


    With the exception of functions that cause program termination, as exit() or abort(),
    a function-call statement eventually returns control to the next statement in
    sequence. In Figure 6-1, for example, you can see that main() passes control to
    hborder(), which calls string().The string() function uses putchar() to print
    a series of characters and then returns control to hborder(), which does some
    additional work and then returns control to main().


    We''ll return to the boxtext program later in this chapter.'
