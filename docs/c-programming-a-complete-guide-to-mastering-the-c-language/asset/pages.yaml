  md: "# Doubly-Linked Lists\n\nSingly-linked lists are not ideal solutions to many\
    \ problems because it is difficult and inefficient to traverse the list backwards.\
    \ That's why doubly-linked lists are used in text editors, window-management systems,\
    \ and many other applications that require quick forward and backward positioning.\n\
    \nFigure 12-3 depicts a doubly-linked list. Such a list is distinguished by the\
    \ pair of node pointer members that allow the nodes to be linked in both directions.\
    \ The declaration of the DNODE type creates a new type name for the struct dnode_st\
    \ type. The forward (next) and backward (prev) pointers each point to objects\
    \ of the DNODE type.\n\nFigure 12-3: A Doubly-linked List of Data Structures\n\
    \n```\ntypedef struct dnode_st {\n    struct dnode_st *next, *prev;\n    /* ...\
    \ */\n} DNODE;\n\nDNODE listhead, *head, *current;\n```\n\nGENERAL FORM OF DOUBLY-LINKED\
    \ LIST\n\n![](img/2219c9d84a179a4ea06a2deb13b7888b_309_0.png)"
