  md: '# 50 C Programming


    printf() statements look a bit more complicated that those we have

    seen thus far. Let''s see what the extra items are and why they are used.


    # Floating-Point Conversion Specifiers


    The general form of a conversion specifier contains two required elements

    and several optional elements. For now, we are concerned only with the

    elements of a floating-point conversion specifier.


    A conversion specifier has the following form:


    ```

    %[flags][width][.precision]type

    ```


    The introducer and the type are required elements of a conversion

    specifier. The elements shown inside square brackets are optional. The

    brackets indicate the optional nature of the enclosed elements, but you

    don''t type the brackets in specifiers.


    The type element is composed of at least one single letter from Table

    3-8 indicating the requested representation. These conversion letters

    apply to float and double types.


    | Table 3-8: Type Conversion Letters |

    | CONVERSION CHARACTER | DESCRIPTION |

    | f | Generate a signed fractional representation of the value without an exponent.
    Form: [-]d.dddd |

    | e (or E) | Generate a signed fractional representation of the value with an
    exponent. Form: [-]d.ddde[sign]ddd |

    | g (or G) | Generate a signed fractional representation of the value either with
    or without an exponent. |


    The g conversion character generates the more compact format (f or e)

    for a given magnitude and precision. If you use the G conversion charac-

    ter, the specifier generates either an f or an E representation.'
