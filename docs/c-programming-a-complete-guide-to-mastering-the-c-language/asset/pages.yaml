    # Ambiguous Filenames


    Filename arguments are handled differently by DOS and UNIX. If a filename argument
    contains wildcard characters, such as * and ?, they are expanded by a UNIX shell.
    Wildcards in a filename argument under DOS are not expanded by the COMMAND.COM
    processor, so a separate library module, typically called argv(), must be linked
    with the C programs you create for use under DOS.


    In addition to the * and ? wildcards understood by both DOS and UNIX, UNIX also
    accepts character classes, indicated by square brackets rounding lists and ranges
    of characters. Thus, the filename arguments:


    ```

    file?.c [A-Z]*

    ```


    match files with names like file1, filex, Alpha, Delta, but not file01, alpha,
