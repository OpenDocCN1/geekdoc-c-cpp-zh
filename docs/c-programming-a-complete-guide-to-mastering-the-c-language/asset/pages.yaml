    Operators that appear near the top of the precedence chart have higher precedence
    than those nearer the bottom and are said to bind their operands tightly. The
    highest precedence category includes function calls, array indexing, structure
    member selection, and structure pointer operators.


    All operators within the same level in the chart (indicated by a boxed region)
    have the same precedence. The sequence operator, also known as the comma operator,
    (,) and most assignment operators rank near the low end of the precedence hierarchy,
    and therefore, have the lowest precedence and bind tightly.


    If you want to force an expression to be evaluated by the compiler in a certain
    way, use parentheses to group operands the way you want them. In an unparenthesized
    expression such as the one shown on page 69, C''s precedence mechanism forces
    the multiplication to be done before the addition, so you would achieve the same
    effect if you type:


    ```

    a + (b * c) /* do multiplication first */

    ```'
