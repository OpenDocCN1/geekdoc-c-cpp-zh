  md: '# The Queue Data Type


    The queue is a first-in, first-out (FIFO) data storage type mechanism The first
    item queued is the first item retrieved. We can use an array implementation of
    a queue just as we did for the stack.


    Figure 11-2 depicts a linear queue containing only five elements. It is implemented
    as an array of characters. Initially, the head and tail indexes are equal, designating
    element 0 of the queue. The head index indicates where the next write operation
    takes place and the tail index indicates where the next read operation occurs.


    We use the function enqueue() to write an item to the queue and dequeue() to read
    an item from the queue. When you attempt to write an item to the queue, the head
    index is first checked. If it is not already beyond the end of the queue, the
    item is written to the location designated by the head index, then head is incremented.
    If head is already off the end of the queue, nothing can be written.


    The item read from the queue is designated by the tail index. If tail equals head,
    the queue is empty and nothing remains to be read. Otherwise, the read operation
    occurs and the tail index is incremented.


    Figure 11-2: An Array Implementation of a Queue


    | Empty queue | After enqueue(''a'') | After dequeue() |

    | --- | --- | --- |

    | tail | tail ''a'' | tail ''a'' |

    | head | head | head |'
