  md: '# 224 C Programming


    Another difference between UNIX and DOS text files is the end-of-file EOF treatment.
    Early versions of DOS used a Ctrl-Z code in the file to indicate where the end
    of the text was. DOS versions beginning with 3.0 use the UNIX method, which is
    to maintain an accurate file size in the file''s directory entry and to indicate
    the EOF condition when an attempt is made to read or write beyond the end of the
    file. There is no code in the file.


    C translators that run in a DOS environment understand these conventions and do
    needed translations so that the internal representation of a file is correct.
    You can see the difference between supposedly identical DOS and UNIX text files
    by looking at their file sizes. The DOS file has one additional character per
    line and possibly one additional character for the Ctrl-Z character. In some other
    environments, such as CP/M, you may also find that the last line contains a string
    of null bytes that pad the file out to the next 128-byte boundary.


    # Redirection


    The uniformity across the streams makes it possible to shuffle data around without
    concern for the source and destination device types. Programs can interact with
    terminal devices, data in disk files, communication ports, and other devices with
    no need for special conversions or access methods.


    A comprehensive and consistent set of stream I/O subroutines has been developed
    over a period of nearly two decades. These although have been documented in the
    Library portion of the ANSI standard, providing a basis for portable input and
    output operations across a wide range of operating environments.


    Many, but not all operating environments support input and output redirection.
    Input redirection means that the standard input to a process obtains data from
    a source other than the keyboard. It is usually symbolized by the less-than sign
    (<). An example of input redirection under both UNIX and DOS (version 2.0 or later)
    is the command:


    ```

    more filename

    ```'
