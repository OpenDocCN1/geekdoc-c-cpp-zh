    # Pointer Types


    A pointer is a variable that contains the address of an object or function. The
    pointer is another of C''s derived types. Although many programming languages
    implement pointers in some way, the C pointer implementation is one of the most
    elegant, giving C much of its power.


    As you learned in Chapter 4, the address operator, &, yields the address of its
    operand. Thus, we have a way to find out where an object is located in memory.
    But how can we preserve and use this information? What we need is a place to store
    the address information. We get that by declaring a pointer variable.


    # Declaring Pointer Variables


    A pointer declaration incorporates a new element—the indirection operator, *.
    Here is the general form:


    ```

    type *ptr_name;

    ```


    The type component specifies the type of data being pointed to and ptr_name is
    the identifier that names the pointer variable.


    You can read the declaration most easily by working backwards: "ptr_name is a
    pointer to an object of type type." This interpretation of the * operator may
    not seem intuitive at first, but the declaration syntax of a pointer variable
    is consistent with its use.


    Let''s use an integer example to examine pointer declarations more closely. Figure
    7-3 shows how a pointer is declared and given a value, and how it looks in memory
    memory. A plain integer, declared in the following'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'statement, occupies a region of memory, typically two or four bytes, and has
    a value that is initially undefined.


    ```

    int number;      /* plain integer */

    ```


    You can declare a pointer to an integer by using the following statement:


    ```

    int *p;               /* pointer to integer */

    ```


    This declaration says that p is a pointer to an object of type int, but p also
    contains an undefined value because nothing has been assigned to it yet. The size
    of a pointer is implementation-defined, and is typically two or four bytes wide.


    Figure 7-3: C has an elegant pointer mechanism.


