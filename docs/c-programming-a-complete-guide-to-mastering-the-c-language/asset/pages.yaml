    First, let''s take a look at means of reading text strings from the keyboard.
    We''ll see how we can read numbers as well as text.


    # Reading Text Strings


    In Chapter 2, the greet2 and greet3 programs read your name from the keyboard
    and personalized a message. They used gets() to read your input into a buffer
    (an array of characters) from which the data can be read by other routines, such
    as printf().


    The gets() macro reads a line of text from its standard input (stdin), which is
    the user''s keyboard unless redirection is used. Under both UNIX and DOS, you
    can redirect input using the < symbol.


    A line is a sequence of zero or more characters and a new-line character (\n).
    When reading the line, gets() replaces the new-line character with a null character
    (\0), which conveniently creates a string. If you expect your program to receive
    a string of up to 20 characters, for example, you must allocate a character array
    buffer of at least 21 characters to guarantee that there is enough room to hold
    the string''s characters and the terminating null character.


    # Numeric Data as Strings


    It may not be immediately apparent, when you type a number on your keyboard, you
    are actually typing a character string. The number 32, for example, is actually
    the text characters ''3'' and ''2'', followed by the null character.


    You cannot assign the string that represents the number to an integer variable.
    The string must first be converted to integer form. The purpose of the atoi()
    function library. This function takes a single argument, which is a pointer to
    the string, and returns an integer value. The name of the character array serves
    as the needed string pointer (the address of the array''s first element)—a potentially
    confusing feature of C that we will discuss in later chapters.


