  md: 'If the value argument is a long double type, use the l(or L) type qualifier
    as a prefix to the conversion character. For example, %LE specifies a long double
    fractional representation with an exponent.


    The optional elements of a conversion specifier give you additional control over
    the appearance of data items in print statements. The flags element that follow
    the % consists of zero or more characters. Its characters are listed in Table
    3-9.


    Table 3-9: Flag Characters

    | FLAG CHARACTER | DESCRIPTION |

    | --- | --- |

    | - (minus sign) | Left justify the result of a conversion. |

    | + (plus sign) | Prefix a plus sign for signed values that are positive. |

    | (space) | Prefix a space for signed values that do not carry either a plus or
    a minus sign. |

    | # | Prefix a conversion result with 0 (octal), 0x, or 0X (hexadecimal), or coerce
    a decimal point in a floating conversion that has no fractional part. |

    | 0 (zero digit) | If there is no other padding, pad a conversion with leading
    zeros following any sign or prefix. |


    An optional width is either a number or an asterisk (*). If it is a number, it
    specifies the minimum number of characters to generate for a conversion, padding
    on the left with spaces unless a flag alters this behavior. If an asterisk is
    used, an integer argument provides the width value and an optional sign.


    You can also provide an optional precision (a decimal point followed by a number
    or an asterisk). If you fail to provide a number or an asterisk, the precision
    is taken to be zero. If you provide a number, it specifies one of the conversion
    characters listed in Table 3-10.'
