    # Portability


    Most portability issues related to arrays and pointers relate to differences between
    computer architectures that affect sizes and ranges.


    The maximum array size is a function of the addressing range of a computer and
    the way a given implementation chooses to deal with the problem. For example,
    the segmented architecture of an Intel 8086 (and 80286) processor imposes a limiting
    size of any object to 64 kilobyte segment. Most C translators that operate in
    a PC environment provide a huge keyword that gets around this limitation, but
    portability to other environments is diminished.


    In segmented environments, pointer sizes vary with the memory model being used.
    You have to deal with small, medium, and large models as a minimum. In addition,
    some translators offer tiny and compact models, and the extended keywords near
    and far, which permit "mixed-model" programming. If you must use extended features
    in one environment, try to put all system-specific code and data in a single file
    or a small set of files. These can be modified for other environments, but the
    bulk of your program will not require changes.


    # Summary


    This chapter has introduced the topics of arrays and pointers in C. Both are derived
    types, which are created by applying the [] and * operators to basic types.


    Arrays can be either internal (declared inside a function) or external. The static
    keyword applied to an internal array makes it permanent so that its values are
    maintained across function calls. You can initialize both automatic and static
    arrays, although pre-ANSI compilers only allow initialization of the latter type.'
