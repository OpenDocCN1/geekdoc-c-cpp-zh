  md: '# The Program Development Process 247


    +   - What kind of mounting system can I use?

    - How far away from the receiver is the proposed antenna location?

    - Are there any power lines or interfering structures near the site?

    - What tools do I need to do the installation?

    - How much is this going to cost?


    You can probably come up with a lot more relevant questions. Probably a few that
    are not so relevant, too. The answers to some of the questions might affect your
    responses to the other questions. The outcome of a session like this should be
    a better, more detailed, description of the task at hand. The data obtained through
    an inquiry process can influence "go/no go" decisions and can help you put realistic
    bounds on the problem and its solutions.


    What works for TV antenna installations works well for programming projects, too.
    Think, for example, about how the lwc program (see Chapter 9) counts characters,
    words, and lines.


    Counting characters is easy enough. Just start a counter at zero and increment
    the counter each time a character is read. Counting lines is just as easy. Simply
    count the number of newlines read.


