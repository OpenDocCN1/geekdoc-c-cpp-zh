  md: 'input to its output (cpState is COPYING) or looking at the next character

    to see if it is part of a set of identical twins—a protected code (cpState

    is CHECKING).


    When one of the special codes is seen, it is sent to the output stream

    and a copy of it is preserved in the savedChar variable while the program

    gets the next character from the input. If the previous character and the

    current character match, the current one is thrown away. Otherwise it is

    sent to the output stream.


    # Programming Exercises


    +   1. The programs require that you type the source filename and then another

    name for the destination file. Rewrite at least one of the programs so that

    it creates a destination name that uses the base filename from the source

    file specification as the basis of a destination filename. Have the program

    automatically writes its output to that file. Be sure that the file doesn''t

    already exist before opening it for writing.


    +   2. An additional step in the direction of user-friendliness is to let the

    programs take a list of files and have them convert each named file rather

    than having to feed the program at a time. Change the command-

    line argument processing to accept a list and the internal workings to

    accommodate this mode of operation. A missing file should not cause the

    program to quit. Just report the missing file''s name and continue

    processing other files.


    +   3. Files of text that contain control codes other than newlines and tabs canncause
    problems for terminals running off a UNIX system. Write a filter

    program that makes any control codes (except NL and TAB) visible in

    some way. For example, you might show control-K as ^K. Challenge

    yourself by adding an optional command-line argument, -s, that lets the

    user strip out these unwanted codes.'
