  md: '# PART 1: AN INTRODUCTION TO C


    # CHAPTER 1


    # C LANGUAGE AND PROGRAMMING ENVIRONMENTS


    This chapter contains an overview of C language and descriptions of two of the
    most popular programming environments in which C figures prominently. The purpose
    is to show you what C looks like and to help you get started using C quickly in
    the environment that is available to you.


    Although the details of a particular implementation of a C programming system
    vary from one operating environment to another, C looks essentially the same everywhere.
    C is fast becoming the universal language of computers in much the same way that
    English has become the universal language of radio communications.


    # An Overview of C Language


    You can only appreciate the full form and beauty of an impressionistic painting
    from a proper distance. Similarly, you get an overall appreciation of C only when
    you step back to see the language in its entirety. After you have the big picture,
    you can focus on the details by stepping closer to the canvas, as we''ll do in
    the remaining chapters of this book.'
  merge: -1
  pgno: 22
