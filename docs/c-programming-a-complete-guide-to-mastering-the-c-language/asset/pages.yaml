- img_proc: true
  md: '# Arrays and Pointers 157


    Automatic storage duration is the default. A variable that is declared without
    the use of the static storage-class specifier and that has no linkages, is considered
    to be automatic. An example of such a variable is a loop counter, call it n, declared
    within a function. Storage is guaranteed for an instance of the variable each
    time the enclosing function is entered and is given up when control passes out
    of the function.


    On the other hand, an object that is declared with linkage, either external or
    internal, or that is declared with the storage class static has static storage
    duration. A variable with static storage duration has, in effect, a permanent
    home somewhere in memory. It is initialized once before the program starts running,
    and it retains the last value stored in it until the program terminates. Examples
    of permanent variables from our previous work are the text strings stored in static
    arrays.


    Scope. The scope of an identifier, which determines where it is visible in a program,
    falls into one of four categories:


    +   - Function

    - File

    - Block

    - Function Prototype


    An identifier used as a label has function scope. A label is used as the target
    of a goto statement. Label names must therefore be unique within a function. The
    same identifier in a different function is in a different scope, so there is no
    name conflict.


    The position of a declaration statement or type specify determines the scope of
    all other identifiers. Identifiers declared outside any block, including the block
    that forms a function body, has file scope. Such an identifier is, therefore,
    accessible for reading and writing anywhere in the file, from the declaration
    to the end of the translation unit.


    Most identifiers have block scope, which means they are visible only within the
    enclosing block, including any inner blocks. An identifier that is declared in
    the parameter list of a function header is also in scope within the function body.'
