- img_proc: true
  md: '+   Observe behavior at the boundaries. Write test cases that force the program
    to deal with data that falls just below, at, and just above natural boundaries,
    such as printed page breaks and video display dimensions.


    +   Test performance of your program against specifications for accuracy, speed,
    apparent responsiveness to user commands, and so on.


    +   Check to see that the interaction with the user is natural and unambiguous.
    The user interface is the part of a program that influences a user''s impression
    of a program more than any other.


    When you''re satisfied that the program is working correctly and performing well,
    find out what other user''s think. Invariably, they have different expectations
    and different experiences than you and will point out problems that you will never
    see.


    # Maintenance


    A program is rarely a static entity. If a program is not useful to anyone, it
    languishes and dies after a while. However, a program that is useful tends to
    stick around for a long time and will usually change for a variety of reasons
    as time passes:


    +   Bug fixes. All programs have bugs (sometimes undocumented features) that need
    to be found and purged.


    +   Revisions to add features. Users put tremendous pressure on developers to
    add "just one more feature." Software companies often add features for marketing
    reasons rather than technical or operational reasons.


    +   Multiple versions. Software companies are finding that programs running on
    multiple platforms (primarily UNIX, DOS, OS/2, and Macintosh) sell better than
    those that are geared to a single operating environment.


    +   Improvements in performance and appearance. With the rapid move toward windowing
    and menu-driven interfaces, developers are scrambling to make programs run faster
    and look better.'
