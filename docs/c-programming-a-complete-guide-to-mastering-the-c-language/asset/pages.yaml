    Two key operations in list management are the allocation and deallocation of nodes.
    These operations can be based on static or dynamic methods. In the static case,
    which allocates nodes at the time the program is translated and linked, typically
    declares arrays of nodes and links them together into a free list. As nodes are
    needed, they are removed from the head of the free list. As they are released,
    they are inserted back into the free list.


    A problem with static allocation is that you need some idea in advance of how
    many nodes are needed. In addition, you are faced with some inefficiencies caused
    by having space allocated that may not be used. Dynamic memory allocation, which
    takes place at run-time, provides a way around this to the next topic.


    # Memory Management


    Memory management involves requests from a process for additional memory resources.
    Whether such requests can be granted depends on the availability of memory in
    an area of memory commonly known as the heap, which is a region of unallocated
    memory that is made available to a process on demand.


    Several memory management functions are of particular help in list management
    functions. We will use malloc() to allocate blocks of memory and free() to release
    (deallocate) the memory when it is no longer needed. Here are the function prototypes
    for malloc() and free():


    ```

    void *malloc(size_t size);

    void free(void *ptr);

    ```'
