  md: '# CHAPTER 8


    # STRUCTURES


    C provides a comprehensive set of basic data types and several ways to derive
    higher-level data types from the basic types. This chapter describes structures
    and structure-like features called unions and bit fields.


    In addition, this chapter introduces you to enumerations and to a way of creating
    new data type names.


    # Introduction to Structures


    A structure provides a convenient means of handling collections of variables of
    the same or differing types. You can group data items that are related to each
    other in some way under a common name and access the items by that name and a
    technique called member selection. A C structure is an aggregate that is analogous
    to a Pascal record. Some recent BASIC implementations offer similar record-like
    features.


    Records in databases from simple card files to sophisticated personnel and payroll
    systems are examples of structures. In such databases, a record or structure typically
    contains account numbers, names, addresses, phone numbers, and other information
    about each contact or employee.'
