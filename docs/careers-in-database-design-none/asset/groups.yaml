    school that allow them to skip ahead. At this level, most courses involve lectures
    as well as lab work. During lab periods, students work with computers, getting
    hands-on experience with the material. Classes required for degree programs vary,
    but the following common course offerings:


    - **Basic programming.** This introductory course provides information on software
    development and gives one a foundation in simple data structures. The roots are
    also set for learning documentation practices, as most courses require documentation
    as part of the lab requirements.


    - **Introduction to computer science.** In this course, one learns the basics
    of how computers work and beginning problem-solving strategies. Course work include
    learning to program a computer.


    - **Database design and implementation.** Students learn to analyze data, organize
    it, and develop searches. Course work includes applying a basic design structure
    to information.


    - **Introduction to the World Wide Web.** In this course, students usually learn
    how to develop a database-driven Web site using HTML, JavaScript, and other Web-based
    programs.


    - **Computer networking.** Networking is the means by which computers communicate
    and share information. Through this course, students become familiar with that
    process. Knowledge of network operations is valuable in the database design industry.
    Through links to different databases, much networking occurs.


    - **Technical writing.** This writing course gives students an understanding of
    what is needed to put the details of database design on paper. Due to the amount
    of documentation and written communication in this field, this course is a requirement
    for most degrees.


    - **Calculus/discrete math.** Through these math courses, students of database
    design learn to apply problem-solving models to real-life situations. Learning
    math is important in the computer sciences, as students gain an understanding
    of mathematical analysis, logic, and function.


    The following course listings pertain to relational database models. This type
    of data model has become so commonly used that degree programs have made these
    classes requirements. Courses in this area include:


    - **Relational database design.** Students taking a relational database design
    course gain an understanding of the terms and concepts associated with relational
    databases. Course requirements include creating a database table, a data structure
    used in relational data-base design, using SQL.


    - **Data normalization.** In this course, students learn how to remove duplicate
    data from a data management system that maintains the integrity of the data and
    increases the speed of the entire system.


    - **SQL.** This course teaches SQL, one of the many programming languages with
    which students of database design must be familiar.


    ## SOFTWARE CERTIFICATION PROGRAMS


    Certifications in specific systems are available through a number of software
    companies. Look into programs such as Oracle''s Certified Professional and the
    Microsoft Certified Database Administrator (MCDA). Some-specific certification
    programs require experience in the field. These programs provide working professionals
    with resources for continued education. Program costs may even be covered by an
    employer.


    ## PROFESSIONAL CERTIFICATIONS


    Another option is to earn database design certifications in place of, or in addition
    to, a degree. Some technical institutions, colleges, and universities have certificate
    programs. These programs can take up to one year to complete and include coursework
    and exams.


    Many database designers continue their education once they are working in the
    field. Some pursue certifications in specific systems, which are available through
    software companies. Taking advantage of these can help one be more competitive
    in the field. However, it may not be a requirement for employment. According to
    Fred Leskowitz, “To get started in the field and to show potential employers that
    you are serious about your interest, I would definitely recommend certifications.
    Having on-the-job experience is important, but classes and training can save lots
    of time and provide better results.”


    When making decisions about education and training, consider what the outcome
