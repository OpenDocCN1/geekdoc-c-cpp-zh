    # CHAPTER 4

    Managing Storage and Maintenance


    The database is up and running. So the database designer''s work is done, right?
    Not necessarily. The database designer''s job usually does not end here. Since
    no one is more familiar with the database than the person who designed it, most
    companies keep the designer on to make changes as needed, or at least call on
    the designer occasionally to make necessary repairs to the database.


    In addition to creating and implementing the initial design, other responsibilities
    of the database designer may include managing growth and change in the database,
    performance tuning, troubleshooting, modifying existing databases, backup and
    recovery, and instructing others in database use. Depending on the scope of the
    project, each of these duties could be a separate position in and of itself and
    fall to a different member of the IT team. However, in the case of a small company,
    one person is the whole IT team. This person follows every aspect of the database,
    from design to management and maintenance.


    # MANAGING GROWTH AND CHANGE


    Modifications are often necessary as the needs of the users and requirements of
    the database management system change.'
  - '[PAGE 38]


    # MANAGING STORAGE AND MAINTENANCE 35


    Changes in data occur on a regular basis, and a well-designed database is able
    to support these changes. The database designer takes future changes into account
    in the design and development of a data model. For example, the database designer
    may anticipate changes in product inventory information. Similarly, the database
    designer can expect that as new employees are hired within a company, the employee
    data will change.


    Business growth also has an impact on the information within the database. Many
    databases are used to keep track of a business’s customer history, including orders.
    If orders increase in volume, the database should be able to keep up with that
    increase. The database designer must also consider that modifications can have
    a domino effect. For example, major changes in the quantity of data can cause
    disruptions in other areas of the database.


    Again, these changes are anticipated as much as possible in the initial design
    of the database so that preventative measures can be taken. Also, when the database
    designer updates information within the system, he or she makes sure that it incorporates
    smoothly so as to maintain data integrity. If the system has difficulty accommodating
    the new data, restructuring the information may become a costly endeavor. It can
    even result in the need for an entirely new database design.


    Effectively managing change in a database is very important. A database management
    system that is not able to evolve along with a business will undermine the success
    of the business. A database that needs to be shut down frequently for repairs
    is not useful. If change and the possible side effects of change are anticipated,
    or at least caught quickly, the'
