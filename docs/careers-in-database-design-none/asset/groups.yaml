    # CAREERS IN DATABASE DESIGN


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_39_0.png)


    Once the initial design is complete, the designer may continue to play a part
    in managing the database, ensuring the stability of the system.


    database designer can minimize downtime. In turn, problems with the database will
    be less likely to hinder the growth of the business.


    As well as responding to changes and seeing how they impact the database, the
    database designer may be responsible for making additions to the database. After
    all, no one is better suited to do the work of incorporating new data into the
    initial design. Additions and modifications to the data may be made at the level
    of the design. In other words, the database designer may restructure the tables
    that were input into the software. To do this, the database designer once relies'
  - '[PAGE 40]


    # MANAGING STORAGE AND MAINTENANCE


    on SQL to recode the database and program its responses to new queries. The designer
    documents all of the changes that are made.


    In some instances, a database designer may manage a database that he or she did
    not design. To do this effectively, the database professional relies on any documentation
    from the initial development of the database. This information is helpful in gaining
    an understanding of the data and how it is organized. The professional also uses
    the database to get a feeling for how it works. Modifications to the data are
    made and, if necessary, the software is upgraded.


    Many database designers work solely in the area of systems upgrading. Systems
    may be upgraded as new technologies emerge and new software becomes available.
    Other database designers focus on troubleshooting. Thorough troubleshooting often
    leads the database designer to make modifications to an existing database. Sometimes
    a complete restructuring of the database management system is needed.


    # PERFORMANCE TUNING


    Performance tuning means keeping the database running efficiently and increasing
    the performance of the system. Tuning is a big part of the database designer''s
    job. A well-tuned database ensures that data can be accessed in a timely manner.
    It also makes the best use of computer hardware, improving the cost-effectiveness
    of the database. Tuning may take place at a number of different stages, beginning
    with the design of the database. The process can include altering the size of
    database files, query tuning, modifying SQL,'
  - '[PAGE 41]


    and doing normalization (eliminating data that is duplicate). Like any well-tuned
    machine, the well-tuned database saves the user or business time and money. Professionals
    specializing in the area of performance tuning are in demand.


    # TROUBLESHOOTING


    Whereas performance tuning is used as a preventative measure, troubleshooting
    takes place when a problem has already come up and needs to be resolved. Through
    troubleshooting, the database designer finds the source of a malfunction by going
    over the database management system piece by piece. The design structure is also
    revisited to determine if the problem occurred at the level of design. Once again,
    the database designer’s documentation can prove extremely useful, helping him
    or her determine the cause of the problem.


    Needless to say, troubleshooting can involve a great deal of time. While the database
    designer is troubleshooting, the database is down. Database downtime, as well
    as the cost of repairs, can add up to be a great expense. Under circumstances,
    the database designer may need to work long hours in order to get the database
    running again. Troubleshooting is something that most database designers and business
    owners prefer to avoid, hence the demand for troubleshooters.


    # DATABASE SECURITY


    Unfortunately, there are instances when problems are not resolved before data
    has been lost. To prevent data loss, database designers use backup systems and
    data recovery tools.'
