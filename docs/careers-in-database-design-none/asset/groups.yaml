    个人的受教育程度反映了可能从事的职位。例如，如果一个人无意担任管理职位，那么专科学位或学士学位就足够了。如果想在数据库设计领域的某个特定领域（如性能调优或安全）工作，可以选择攻读以兴趣领域为方向的学士学位。如果确实想追求管理职位，可以在获得学士学位后或在在该领域获得一些经验后立即开始硕士课程。


    ## 课程选编


    在高等等教育（或大学水平教育）的第一年，绝大多数学生被要求修读入门课程，除非他们在高中已经上过允许他们跳过初级课程的课。在这个水平上，大多数课程涉及讲座以及实验室工作。在实验室期间，学生通过计算机获得相关材料的实操经验。学位课程所需的课程各不相同，但以下常见课程包括：


    - **基础编程。** 这门入门课程提供了有关软件开发的信息，并让人建立简单数据结构的基础。它也为学习文档规范奠定了基础，因为大多数课程都要求文档作为实验室要求的一部分。


    - **计算机科学导论。** 在这门课程中，学生学习计算机工作的基本原理以及解决问题的策略。课程内容包括学习编程。


    - **数据库设计与实现。** 学生学习如何分析数据、组织数据并开发搜索。课程内容包括将基础设计结构应用于信息中。


    - **万维网导论。** 在这门课程中，学生通常学习如何使用 HTML、JavaScript 和其他基于 Web 的程序开发驱动网站。


    - **计算机网络。** 网络是计算机通信和共享信息的手段。通过这门课程，学生将熟悉这一过程。网络操作知识在数据库设计行业非常有价值。通过与不同数据库的连接，发生了大量的网络活动。


    - **技术写作。** 这门写作课程让学生理解如何将数据库设计的细节记录在纸上。由于该领域有大量的文档和书面通信，这门课程是大多数学位的必修。


    - **微积分/离散数学。** 通过这些数学课程，数据库设计的学生学习如何将解决问题的模型应用于现实情况。学习数学在计算机科学中非常重要，学生将获得对数学分析、逻辑和函数的理解。


    以下课程列表涉及关系数据库模型。这种数据模型已变得非常常用，因此学位课程已此类此类设为必修。该领域的课程包括：


    - **关系数据库设计。** 修读关系数据库设计课程的学生将理解与关系数据库相关的术和概念。课程要求包括创建数据库表（关系数据库设计中使用的数据结构）以及使用
    SQL。


    - **数据规范化。** 在这门课程中，学生学习如何从数据管理系统中删除重复数据，以维护数据的完整性并提高整个系统的速度。


    - **SQL。** 这门课程教授 SQL，这是数据库设计者必须熟悉的许多编程语言之一。


    ## 软件认证计划


    许多软件公司提供特定系统的认证。可以关注诸如 Oracle 认证专业人员（Oracle Certified Professional）和微软认证数据库管理员（MCDA）等计划。某些特定的认证计划需要该领域的经验。这些计划为职业人士提供了继续教育的资源。计划费用甚至可能由雇主承担。


    ## 职业认证


    另一个选项是获得数据库设计认证代替或补充学位。一些技术机构、学院和大学设有证书计划。这些计划可能需要一时间完成，包括课程和考试。


    许多数据库设计师在进入领域工作后会继续接受教育。有些人追求特定系统的认证，这些认证可以通过软件公司获得。利用这些资源可以帮助自己在该领域更具竞争力。然而，这并不是就业的必要条件。根据弗德·莱斯科维（Fred
