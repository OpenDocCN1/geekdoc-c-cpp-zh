    related to database design. Continuing education may involve completing a higher
    degree, such as a master’s degree, or it may be as simple as taking a certification
    course to learn a new application. As mentioned in chapter 5, such certification
    courses may be offered through employers, computer science companies that create
    the new technologies. They may also be available at a college or university, with
    classes either in person or online. Lifelong learning is beneficial in any field,
    but in the ever-changing field of computers, it is a must for career advancement.


    # CAREER ADVANCEMENT


    Database design is a dynamic profession. Those who choose this career can expect
    a variety of choices in employment and areas of specialization. With a strong
    educational background, experience, and management skills, a database designer
    is well on the path to advancing in this field.


    High-level positions include that of chief technology officer, senior database
    administrator, lead database designer, and manager of information systems. As
    the titles imply, these positions require one to serve as the leader of computer
    science professionals or of an IT team. People in these positions oversee the
    design, management, and maintenance of databases. To do so, they must understand
    all of the tasks that accompany the process. These leaders serve as a resource
    for the team, while tending to the other responsibilities that come with a supervisory
    position. These responsibilities might include recommending the best technologies
    to apply'
  - '[PAGE 66]


    to the project, making sure that the team works well together, delegating duties
    to IT team members, and documenting the design process of the team.


    Opportunities for advancement in the workplace depend greatly on the size of the
    organization for which one works. Larger businesses may have multiple database
    designers leading different teams, while small businesses may not have someone
    in a management position. All aspects of the design process and duties related
    to systems upkeep may fall to a general database designer. For those willing to
    pursue the training and experience to earn high-level positions within a company,
    the responsibilities include higher salaries and greater job security.


    Another opportunity in this field is in teaching up-coming database designers.
    One can work as a trainer in a certification program at a computer science company
    or as a teacher or professor at a college or university. This career path offers
    a different take on the profession and lends itself to more social interaction
    and less desk time. Also, people who train up-coming designers are required to
    stay current with the newest advances in order to pass that knowledge on those
    entering the field. Whatever path is chosen, a career in database design offers
    those in the field ample opportunity to grow in their areas of expertise.


