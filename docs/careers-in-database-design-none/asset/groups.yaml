    # CHAPTER 7

    The Evolution of a Database Designer


    As technology continues to morph, so does the job of housing vast amounts of information
    within the new technological systems. As a result, a professional database design
    must evolve in order to stay current.


    # STAYING ABREAST OF NEW IDEAS AND TECHNOLOGY


    Even the most experienced database designer needs to stay informed about the changes
    in technology. In particular, one must become familiar with the newest applications
    and programs. New software programs can change the way databases are designed
    or make a database easier to manage. If a database designer stays on the cutting
    edge of new technology, his or her designs will be current as well.


    Learning about progress in the field of database design can be done in the same
    way as someone just starting out: by reading computer science publications, joining
    information technology groups in the community or online, and by pursuing continuing
    education. Joining technology organizations, for example, gives one the opportunity
    to network and share information with others in the same field.


    Perhaps one of the most common ways to acquire new knowledge in the field is to
    continue taking classes in subjects'
