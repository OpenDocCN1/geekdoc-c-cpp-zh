    # PERFORMANCE TUNING


    Performance tuning means keeping the database running efficiently and increasing
    the performance of the system. Tuning is a big part of the database designer''s
    job. A well-tuned database ensures that data can be accessed in a timely manner.
    It also makes the best use of computer hardware, improving the cost-effectiveness
    of the database. Tuning may take place at a number of different stages, beginning
    with the design of the database. The process can include altering the size of
    database files, query tuning, modifying SQL, and doing normalization (eliminating
    data that is duplicate). Like any well-tuned machine, the well-tuned database
    saves the user or business time and money. Professionals specializing in the area
    of performance tuning are in demand.


    # TROUBLESHOOTING


    Whereas performance tuning is used as a preventative measure, troubleshooting
    takes place when a problem has already come up and needs to be resolved. Through
    troubleshooting, the database designer finds the source of a malfunction by going
    over the database management system piece by piece. The design structure is also
    revisited to determine if the problem occurred at the level of design. Once again,
    the database designer’s documentation can prove extremely useful, helping him
    or her determine the cause of the problem.


    Needless to say, troubleshooting can involve a great deal of time. While the database
    designer is troubleshooting, the database is down. Database downtime, as well
    as the cost of repairs, can add up to be a great expense. Under circumstances,
    the database designer may need to work long hours in order to get the database
    running again. Troubleshooting is something that most database designers and business
    owners prefer to avoid, hence the demand for troubleshooters.


    # DATABASE SECURITY


    Unfortunately, there are instances when problems are not resolved before data
    has been lost. To prevent data loss, database designers use backup systems and
    data recovery tools.

