    Once these questions and others are answered, the database designer can determine
    the best way to organize the data. The initial data model simply shows a series
    of tables, or blocks of information, in a diagram. The diagram conveys the basic
    structure of the database and shows the connection between related tables. At
    this point, any changes to the information or its organization may be analyzed.
    The designer then creates a more detailed model. This model translates the data
    into SQL and assigns functions to the database management system. These functions
    may include how the software will maintain the data or provide security, if necessary.


    # DIFFERENT TYPES OF DATABASE MODELS


    There are different data models that have evolved over time, through trial and
    error. An early, simple way to store data was a'
- md: '

    flat file system. In this system, data was simply placed into one file. It was
    quickly discovered that this format made accessing information a challenge, as
    the search had to be very specific to the data. Also, if the user searched in
    the wrong file, the data would never be uncovered.


    Later, network and hierarchical database models were created as a way to make
    the data more accessible. However, models required users to perform root searches.
    In a root search, the user must begin with the most basic, broad search terms,
    rather than entering more detailed information. For example, let''s say a user
    is searching for a certain part. A root search would require the user to first
    enter the model and make of the car in order to pull up the information. The user
    could not simply query the database for the car part directly. These database
    models are quickly becoming obsolete, as more relevant answers to the problem
    of how to store information are becoming clear.


    In addition, the object-oriented database has come into to store complex data,
    such as photos and videos. In this kind of database, information is stored as
    objects (numbers and code), rather than as flat data.


    The development of the relational database model changed the field of database
    design. Today, the relational database is the most commonly used database model.
    Invented by Edgar F. Codd and enhanced by others in the field, the relational
    model allows the user to start the search from many places in the database structure,
    rather than starting from root terms and working up to the desired information.
    This model also allows multiple pieces of information to be retrieved at once.
    In this model, data is normalized, meaning that duplicate information is eliminated.
    By cutting back on multiple entries of the same information, the integrity of
    the system is more easily maintained. Also, required maintenance to the system
    is reduced. The relational database is, for now, the most advanced form of information
    storage.


    Once a data model is chosen and created, the database designer uses SQL to input
    the data into the software system. In a good design, the user can continue to
    make additions and other changes to the data as needed without slowing down the
    system. While some designers deal mainly with the initial design of the system,
    others find that their job descriptions include making changes and continuing
    to manage the database.


    # CHAPTER 4

    Managing Storage and Maintenance


    The database is up and running. So the database designer''s work is done, right?
    Not necessarily. The database designer''s job usually does not end here. Since
    no one is more familiar with the database than the person who designed it, most
    companies keep the designer on to make changes as needed, or at least call on
    the designer occasionally to make necessary repairs to the database.


    In addition to creating and implementing the initial design, other responsibilities
    of the database designer may include managing growth and change in the database,
    performance tuning, troubleshooting, modifying existing databases, backup and
    recovery, and instructing others in database use. Depending on the scope of the
    project, each of these duties could be a separate position in and of itself and
    fall to a different member of the IT team. However, in the case of a small company,
    one person is the whole IT team. This person follows every aspect of the database,
    from design to management and maintenance.


    # MANAGING GROWTH AND CHANGE


    Modifications are often necessary as the needs of the users and requirements of
    the database management system change.


    # MANAGING STORAGE AND MAINTENANCE


    Changes in data occur on a regular basis, and a well-designed database is able
    to support these changes. The database designer takes future changes into account
    in the design and development of a data model. For example, the database designer
    may anticipate changes in product inventory information. Similarly, the database
    designer can expect that as new employees are hired within a company, the employee
    data will change.


    Business growth also has an impact on the information within the database. Many
    databases are used to keep track of a business’s customer history, including orders.
    If orders increase in volume, the database should be able to keep up with that
    increase. The database designer must also consider that modifications can have
    a domino effect. For example, major changes in the quantity of data can cause
    disruptions in other areas of the database.


    Again, these changes are anticipated as much as possible in the initial design
    of the database so that preventative measures can be taken. Also, when the database
    designer updates information within the system, he or she makes sure that it incorporates
    smoothly so as to maintain data integrity. If the system has difficulty accommodating
    the new data, restructuring the information may become a costly endeavor. It can
    even result in the need for an entirely new database design.


    Effectively managing change in a database is very important. A database management
    system that is not able to evolve along with the business will undermine the success.
