    # 故障排除场景


    数据库发生故障，危及到依赖系统稳定性的业务成功。数据库设计人员该如何应对？首先，他或她必须从问题发生的那一刻起详细收集所有信息。然后，他或她将参考在设计过程中保留的文档和其他记录。最后，数据库设计人员将逐一检查设计元素，以查看故障发生在何处以及如何进行修复。


    然而，预防性措施是最佳的行动。鉴于如果不采取任何保护措施就可能会丢失大量宝贵数据，数据备份和恢复是数据库管理系统中不可或缺的一部分。有时，会创建一个与原始数据库管理系统完全相同的备用系统。如果原始系统故障或受到某种损坏，该系统就可以被信赖。


    数据丢失的常见原因有硬件故障、如风暴等自然灾害以及人为失误。在这些每种情况下，通过良好的行动计划都可以减少数据丢失。在数据丢失发生前安装的恢复工具可以将系统恢复到损坏发生之前的某个时间点。风险在于系统将丢失在此期间可能进行的更改。备份系统是另一个良好的预防措施，只要定期进行系统备份。如果持续运行备份系统，则对数据的所有更改都将涵盖在内。


    数据也可能由于计算机病毒或其他人为攻击而丢失。同样，备份和恢复系统可以有所帮助，但安全措施可以防止人员黑入数据库。此类措施通常涉及安装安全系统。例如，数据库设计人员可以建立授权代码系统，仅允许特定用户查看特定数据。当数据具有机密性（如财务信息）时，安全尤为重要。出于如此，银行和其他金融机构严重依赖安全措施。


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_43_0.png)


    数据库设计人员可以专注于数据库安全，评估安全风险并开发安全措施。


    # 向用户教授数据库知识


    数据库设计人员花费大量时间教育他人如何使用数据库。这既涉及书面也涉及口头交流。指导可能限于解释数据库的基本功能，包括如何提出查询以调出所需信息。然而，如果主要用户不是数据库设计人员，指导还可能包括数据库的管理和维护。


    其主要重点是帮助用户的 IT 领域被称为帮助台（help desk）。通过该平台，数据库设计人员通过回答关于数据库的特定问题为用户提供支持，数据库设计人员的沟通技巧成为一项重要资产。这可以通过软件、互联网、电子邮件或呼叫中心完成。在帮助台，数据库设计人员经常会指导那些几乎或完全没有计算机知识的人。数据库设计和计算机语言的复杂概念必须为普通用户进行拆解。


    无论是从事数据库系统管理、数据库维护还是用户协助，数据库设计领域都有许多人可以关注的领域。教育和培训提供了人们获得这些不同领域知识的机会，并可能选择一个专业领域。


    # 第 5 章

    ## 进入该领域的途径


    人们如何学习数据库设计的工具和技术，并向未来迈步呢？从现在、这里开始吧。对于渴望成为数据库设计师的人来说，有许多不同的课程和其他学习机会。在计算机技能方面建立坚实的基础是第一步，也是职业成功的关键。


    ## 抢占先机：

    中等教育中的计算机学习


    首先在高中阶段了解计算机的一般工作原理。大多数高中提供基础计算或技术教育课程。早早学习计算机课程有助于人们决定在计算机科学领域内采取什么方向。在高中期间充分利用这些课程；这可以在以后节省时间，使人们能够进入高级别的课程。高中生还可以通过当地教育部门获得课程。


