    进阶阅读 74\n参考文献 76\n索引 78\n\n想象一个堆满文件的仓库，文件中的信息与附近的其他信息没有任何关系，其放置也没有任何规律或理由。从那个仓库中获取信息会有多容易？这就像是大海捞针吗！现在想象文件是根据主题排列的。文件按字母顺序排列，并且每个文件都可以与其他文件进行交叉引用。如果信息是以易于管理、可预测的格式组织的，那么提取任何一条信息的任务就不再那么令畏畏。\n\
    \n数据库是一个数字仓库。它可以存储海量的数据或信息。事实上，电子化存储的数据类型没有限制。在计算机数据库中，企业可以保存产品库存、销售交易、客户档案、员工记录和财务记录。图书馆、博物馆、研究机构和政府机构存储大量数据，并向公众共享这些信息。数据可以以文本、数字甚至图片或视频的形式存在。在没有组织系统的计算机中输入这些信息，检索这些数据将变得非常困难。\n\
