    # AN ARRAY OF OPPORTUNITIES


    glare from the computer screen. Is there ample space to work? Are items provided
    to increase employees'' comfort level and efficiency? If not, are employees able
    to bring their own comfort items to work, such as chairs or wrist rests? How many
    breaks are employees permitted in order to walk around and stretch? These considerations
    will help ensure a positive work experience.


    Although this is a desk job, there is interaction with others. Examples include
    meeting with clients to establish needs for the database, teaching people how
    to use the database, and working as a member of an information technology team.
    Face-to-face meetings may be held at the workplace or may require traveling to
    client locations. Travel is generally minimal. However, it is a reality for the
    database designer who must go to various locations to work with different systems
    or consult with companies.


    A benefit in this field is that many positions allow for telecommuting if an employer
    is receptive to it. This can sometimes give the database designer the flexibility
    to set his or her own work hours. The database designer''s workweek is an average
    of forty hours, but it can be more if his or her responsibilities include troubleshooting
    and maintenance. Career professionals who specialize in these areas may be required
    to be on-call hours or work overtime in order to get a malfunctioning system running
    smoothly once again.


    # SELF-EMPLOYED OR INDEPENDENT CONTRACTOR


    The profession of database designer offers many employment options. Being an employee
    of an organization offers stability,


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_57_0.png)


    A database designer who is a self-employed professional or an independent contractor
    will find that multitasking comes with the territory, but some in this field choose
    to open their own businesses or become independent contractors. Many database
    designers have created successful companies that design databases or create database-driven
    Web sites for for other businesses. Self-employment can be very rewarding, and
    it enables the database designer to choose clients and projects. However, it also
    requires the database designer to be a self-starter with business savvy and know-how.


    Many of the same qualities that make one a good database designer are also fundamental
    for a person who is self-employed. Time management skills, attention to detail,
    and strong problem-solving abilities all benefit a business owner. Compared to
    an organizational employee, the self-employed professional has more control over
    his or her work environment and may enjoy a more flexible work schedule. On the
    other hand, some aspects of the career may be much more challenging. Employees
    of an organization usually have details like health care, retirement savings,
    and taxes largely taken care of by their employers. However, self-employed professionals
    must make provisions for themselves. Also, business owners spend much of their
    time dealing with the financial and operational aspects of their businesses, rather
    than focusing solely on database design.


    Independent contractors or freelancers usually have clients from a variety of
    businesses. They are hired to complete specific projects or tasks for companies,
    but they are not permanent employees. They do not receive employee benefits, and
    taxes are not withheld. As an independent contractor, one has the freedom to choose
    which projects he or she would like and set his or her own work schedule. Like
    business owners, independent contractors must have a strong work ethic in order
    to meet clients'' needs and deadlines.


    # INTERNET OPPORTUNITIES


    The use of the World Wide Web has added yet another area for database design professionals
    to explore. Database-ers and Web page developers often cooperate to create and
    maintain certain kinds of Web sites.


    To understand how the database designer plays a role in the functionality of the
    World Wide Web, one must have a basic understanding of the different kinds of
    Web pages that exist. There are both static and dynamic Web pages. A static


    # PROS AND CONS OF A CAREER IN DATABASE DESIGN


    All career fields have positive and negative aspects to consider. The key is to
    choose a career with positive aspects that you value and negative aspects that
    you can at least tolerate. For the field of database design, some of the pros
    and cons are as follows:


    - Pros:

    - Career diversity gives database designers many options in choosing a work setting
    and for specializing within the field.

    - Database designers have the satisfaction of seeing their designs serve a purpose.

    - There is opportunity for self-employment.

    - This profession offers job security and growth potential.

    - Database designers may have the option of working at the job site or from home.


    - Cons:

    - Database designers are under pressure to create a design that can withstand
    the test of time.

    - Deadlines are often tight.

    - The database design may not always reflect what is most logical or elegant,
    but what is the cost-efficient for the client.

    - There is the possibility of being on call and working odd hours.

    - Technology changes so rapidly that what worked yesterday may not work tomorrow.


    # AN ARRAY OF OPPORTUNITIES


    Web page looks the same and contains the same information each time it is loaded.
    In order for the page to change, someone must program it differently and then
    upload the new version. In contrast, a dynamic Web page can change each time the
    page is loaded. Sometimes users can even manipulate the information on the page
    and make changes themselves.


    A database-backed, or database-driven, Web site is a type of dynamic Web page.
    These Web sites are connected to a database in a way that allows information to
    be pulled directly from the database. As the information within the database changes,
    the Web site reflects these changes. With proper database design, these changes
    are automatic, without any manipulation from the user. An example is an e-commerce
    site that must provide up-to-minute information about products and prices to customers.


    As members of an IT team, database designers and Web page developers often share
    work on database-backed Web sites. The database designer works closely with Web
    developers to ensure ease of access to the data. Many database designers who work
    for smaller companies or who are self-employed take on the dual role of designer
    and Web developer.


    As the cost of these sites has gone down and the process has become easier to
    manage, more businesses have been relying on database designers to help create
    database-backed sites. Database designers find their expertise and services in
    great demand as new technologies are released, allowing databases to be accessed
    from remote locations. The challenge for these database designers is in building
    a site that can keep up with data changes and provide the necessary security measures.
    The satisfaction comes from working on a database design that makes information
    accessible to everyone to the World Wide Web.


    # FINDING THE RIGHT JOB


    With so many options, how does someone find a job that is a good fit? While receiving
    education and training, one should note the aspects of database design and the
    areas of study that he or she finds most rewarding. In addition, one should reflect
    on natural strengths, weaknesses, and preferences. For example, someone who has
    excellent communication skills and enjoys working with others may be a perfect
    fit for a help desk job. Those who like staying abreast of the latest technology
    might enjoy working with computer engineers to design new products incorporating
    databases. If problem solving gives one great satisfaction, performance tuning
    or troubleshooting may be a good niche. Those who strictly enjoy design work and
    organizing information may seek a job in which the initial design process constitutes
    the main workload.


    As Fred Leskowitz discovered by combining his interest in library science with
    his interest in database design, a personal interest, or even a hobby, can sometimes
    lead to work in an industry that is enjoyable and rewarding. Those entering this
    field would benefit from examining their own interests and thinking creatively
