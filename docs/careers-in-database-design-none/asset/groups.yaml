    that duplicate information is eliminated. By cutting back on multiple entries
    of the same information, the integrity of the system is more easily maintained.
    Also, required maintenance to the system is reduced. The relational database is,
    for now, the most advanced form of information storage.


    Once a data model is chosen and created, the database designer uses SQL to input
    the data into the software system. In a good design, the user can continue to
    make additions and other changes to the data as needed without slowing down the
    system. While some designers deal mainly with the initial design of the system,
    others find that their job descriptions include making changes and continuing
    to manage the database.'
