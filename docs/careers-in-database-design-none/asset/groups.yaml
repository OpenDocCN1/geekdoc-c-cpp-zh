    # INTRODUCTION TO DATABASE DESIGN


    ## WELL-DESIGNED DATABASES SUPPORT BUSINESS GROWTH


    Imagine this scenario: a designer creates a database for a small business. The
    database is designed to keep track of clients and orders. The business quickly
    becomes a huge success and orders begin to roll in. Luckily, the database designer
    considered the business''s potential for rapid growth. The designer is able to
    quickly work changes into the database without downtime. What if the site had
    to shut down in order for the database to be revamped? The business would likely
    lose clients, as well as a lot of money, during the reconstruction of the database.


    Because a database relies on a software system to run, a database designer must
    be comfortable working with different software applications. This helps the designer
    know what system would be a good fit for a particular database. Software designers
    and database designers often work in close company to the benefit of both professions.


    ## BY ANY OTHER NAME


    For the purposes of this book, the title database designer will be used to describe
    someone who organizes and maintains the storage of data. But other job titles
    may also be used and can be interchangeable. In some cases, however, there are
    differences in the emphasis of the job.


    Database designers are sometimes referred to as database architects or database
    developers. These names stem from the use of a database model as a blueprint for
    the construction of the database. The titles database manager and database administrator
    are also used to describe positions related to databases. These titles can refer
    to everything from managing the design process to handling database security—and
    all that falls in between. Responsibilities may include verifying data integrity,
    troubleshooting, and disaster recovery.


    One''s job title may also depend on the size of the company for which one or worker
    is self-employed or not. When working for a big company that has a large IT team,
    one may have the opportunity to specialize in a particular aspect of information
    technology. On the other hand, someone who is self-employed or who works for a
    small company will probably have to wear many different hats, rather than having
    one area of expertise.


    Database security and database performance tuning are two specialty areas within
    larger IT teams. With so much information accessible to so many, the field of
    database security has evolved out of necessity to help protect private and sensitive
    information. Positions as database managers are common in financial institutions,
    for example. Performance tuning is an area in which one focuses on the running
    of the database. Someone in this role is not necessarily involved in designing
    the database. Professionals who do performance tuning ensure that the database
    is running efficiently. They also engage in problem solving to make it more efficient.


    # INTRODUCTION TO DATABASE DESIGN


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_14_0.png)


    Portable electronic devices, such as this iPad, give database designers another
    outlet for their work and add to the growing demand for these professionals.


    ## A WORLD OF OPTIONS


    Computer professionals with knowledge of database design have many job options.
    For example, since a large amount of information is accessed through the World
    Wide Web, database designers may choose to work as, or with, Web page designers.
    Work requirements might include designing a database that can pull up information
    about a business, organize orders and sales, and keep data secure.


    As portable electronic devices become more popular and advanced, people are able
    to access information on the go. As a result, a database designer might work in
    the field of computer engineering, developing software and hardware that enables
    information to be obtained on different devices. With new developments always
    occurring in the computer field, database designers will continually find new
    areas in which their expertise is required.


    # CHAPTER 2


    Who are the talented people who put data in order, making life a little easier
    for those who need access to information? These professionals are people who possess
    the personal traits and professional skills to bring a design project to fruition.


    ## PERSONAL QUALITIES


    One''s personal qualities or traits often make him or her more suitable for certain
    professions. Some employers place as much value on these personal attributes as
    do their education and experience. These characteristics are an asset to anyone
    in the computer field, including database designers.


    At first glance, it may seem as if this profession is a solo act. However, depending
    on the work environment, interaction with others may be a routine part of the
    workday. For example, many database professionals work on an IT team, cooperating
    closely with software engineers, network administrators, computer programmers,
    or systems administrators to complete projects. The ability to communicate with
    others on the team, verbally and in writing, influences how successful the team
    is as a whole.


    Strong communication skills also serve the database designer in relaying information
    about the function of the database to those not familiar with computer language.
    In many cases, a database is constructed for people outside of the IT department,
    who may know little about how a database actually works.


    ## CAREERS IN DATABASE DESIGN


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_17_0.png)


    Database designers are proficient at explaining the details of a design to others
    on the IT team, as well as to people who are unfamiliar with computer terminology.
    It then becomes the job of the designer to instruct the users on how to actually
    use the database. The database designer may develop and lead training sessions,
    which can take place one-on-one or in larger groups. If the database designer
    works at a help desk, interaction with users is a core requirement.


    Written communication skills are helpful if the job entails writing out instructions
    on using the database. Again, being able to explain technical ideas in everyday
    language is important, since the users may have little to no knowledge of computer
    language. Some jobs also require written proposals or documentation. Documenting
    why the database was designed as it was can help the end user, enhancing the ease
    of access to information. Also, documentation can be helpful to the database designer
    in retracing steps should a problem come up.


    In this field of systematizing information, logical thinking and attention to
    detail are necessities. The database designer must be able to analyze information
    and say, “This is how it should be.” Numerous details, and all the possibilities
    for the retrieval of information, must be considered when solving the problem
    of how to store the data. Lack of attention to something that may seem insignificant
    can be costly to a business. Larger errors even have the possibility of causing
    financial ruin if the website fails.


    Computer technology is fast paced, and one must be adaptable in order to stay
    current in this field. Computer platforms and software that were standard last
    month may not be what is in use next month. Working in a field in which progress
    occurs at such a rapid pace can be exciting. The challenge is in keeping up with
    the new technology. What does this mean for the database designer? It means that
    the designer should have a thirst for learning, for increasing his or her mental
    warehouse of information. A database designer should be able to change with the
    times in order to ensure a successful career.


    ## PROFESSIONAL SKILLS


    Once on the job, one’s personal qualities will serve one well and complement the
    professional skills that come with experience. Certain professional skills are
    particularly important in the field of database design. For example, at first
    it may be a challenge to complete a project within a limited time frame. Developing
    good time management skills will increase productivity and benefit both the designer
    and the client. Often, a business or organization relies on the rapid development
    of an organizational system to be able to complete other tasks. If the design
    is not completed in a timely manner, it can cause everything else to run behind
    schedule. Good time management means determining what is a priority and then deciding
    in what order tasks should be completed.


    Along with managing one’s time, a database designer is required to make quick
    decisions that will determine


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_19_0.png)


    Time is of the essence when a database designer faces a project deadline.

