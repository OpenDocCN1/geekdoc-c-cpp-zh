    5 章所述，此类认证课程可以通过雇主、创建新技术的计算机科学公司提供。它们也可以在学院或大学提供，设有面授或在线课程。终身学习在任何领域都有益处，但在瞬息万变的计算机领域，它是职业晋升的必修。


    ## 职业发展


    数据库设计是一个动态的行业。选择这一职业的人可以期待在就业和专业领域方面有多种选择。凭借深厚的教育背景、经验和管理技能，数据库设计师正处于在该领域晋升的道路上。


    高级职位包括首席技术官（CTO）、高级数据库管理员、首席数据库设计师和信息系统经理。正如职称所示，这些职位要求人们担任计算机科学专业人员或 IT 团队的领导。这些职位的人负责数据库的设计、管理和维护。为了做到这一点，他们必须理解随整个过程的所有任务。这些领导是团队的资源，同时兼顾主管职位所带来的其他职责。这些职责可能包括为项目推荐应用最佳技术、确保团队良好协作、向
    IT 团队成员分配任务以及记录团队的设计过程。


    职场中的晋升机会在很大程度上取决于所工作组织的规模。较大的企业可能会有多个数据库设计师领导不同的团队，而小企业可能没有人担任管理职位。所有设计过程的所有方面和与系统维护相关的职责都可能由一名通用的数据库设计师承担。对于那些愿意追求培训和经验以获得公司内部高级职位的人来说，这些职责包括更高的薪水和更大的工作保障。


    该领域的另一个机会是教未来的数据库设计师。人们可以在计算机科学公司担任认证计划的培训师，也可以在学院或大学担任老师或教授。这一职业路径为该行业提供了不同的视角，并有助于更多的社交互动和更少的伏案时间。此外，培训未来设计师的人需要跟上最新的-


    ## 来自专业人士的建议


    Maurice 院长是一位经理。作为经理，他监督着一个计算机科学团队。根据他的经验，持续培训是必须的，而不仅仅是一个机会。“无论学历水平如何，每个人都需要认证和持续培训，”莫里斯解释道。


    他还指出，在进入更高级别的职位时，经验和教育是相辅相成的。“许多时候，进入管理层会倾向于拥有硕士学位（MBA 或其他），但在大多数情况下，你需要直接在该领域内工作的经验来管理管理，”他说。


    数据库设计领域有许多获得经验的利基市场。莫里斯说，这个领域的多样性是使其产生趣味的原因之一。他说：“数据库设计是一个非常开放的领域，具有许多方面，以及各种产品和工具集。”


    ## 晋升工具


    该领域的进步需要努力、学习和个人特质的结合。以下是一些有助于成功的重要特征和行为：


    - 积极的态度：乐观的展望和耐心会很大程度地帮助你。

    - 对知识的渴望：对在该领域持续学习的兴趣意味着人们保持信息灵通。

    - 乐于精进技能：通过找到利基市场，人们会变得更有价值。

    - 建立并维护良好的声誉：以可靠著称的人可能会被认真对待。

    - 愿意承担更多责任：通过承担更多任务，人们建立了自己的价值。


    莫里斯解释道：“我曾为军事行动创建数据库布局——数据、图像、多源文本。最近，在过去的十年里，我一直参与性能测试、架构和设计评审，还有 DBA 和 DB 开发人员为我或与一起支持
    DB 项目。”


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_68_0.png)


    此类活动为专业人士提供了跟上进步的机会


    ## 展望


    对于进入数据库设计及相关领域的人来说，未来是光明的。只要世界不断寻找信息，数据库设计师就会有需求。移动设备等新技术允许随地访问大量信息，这进一步增加了对具备组织和维护信息系统知识专业人士的需求。


    根据美国工会部的数据，这一职业处于处于一个增长期，预计这种增长将持续到未来。仅数据库管理领域预计在 2006 年到 2016 年间将增长 37%。


