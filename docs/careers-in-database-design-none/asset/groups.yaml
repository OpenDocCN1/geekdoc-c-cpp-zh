    her knowledge about the needs of the end user. If the client knows little about
    information technology, the database designer may need to assist the client in
    determining exactly what the organization requires from the database.


    Once these questions are answered, the database designer begins to analyze the
    information that will eventually be entered into the database. Through this process,
    the best means of organization, the type of data model, and the queries one can
    pose to the system are determined. The software application that will be used
    to house the database and manipulate the data is also considered. Throughout this
    phase of the project, the database designer may work closely'
  - '[PAGE 22]


    with others on the IT team, such as software developers or project managers.


    Next, the organization of information is given a concrete form by way of a data
    model. This is where the actual designing occurs and problem solving takes place.
    The designer tries to anticipate problems that could occur so as to prevent kinks
    in the system. He or she also creates problem-solving scenarios in case something
    goes awry once the system is up and running. The database designer keeps records
    of the design process and develops a backup and recovery plan. In this way, problems
    can be avoided entirely or, at the very least, quickly remedied.


    Finally, the data is transferred to the software application that will support
    the database. This software allows the data to be input by manual typing. Then
    the data can be manipulated and managed within the system. Typically, a specialized
    computer language, called a query language, is used to access and change information
    within the database. Once the database is housed within an electronic device,
    the database designer monitors its performance. If there are flaws in the design,
    the designer may need to backt‌rack. This can increase the cost of the project
    and waste valuable time. If the database designer has been conscientious, the
    system will probably run smoothly.


    The database designer gives the user instructions, writing or verbally, about
    how to use the database. The instructions include the best ways to query the database
    in order to pull information. Now the design is complete, the database is up and
    running, and it is put into the hands of the user. At this point, a database designer
    may still play an important role in supporting the functioning of the database.
    The designer'
  - '[PAGE 23]


    # ASKING THE RIGHT

    QUESTIONS


    The following are questions for a database designer to consider when working on
    a design project:


    +   1. What purpose will the database serve?

    2. What is the budget for this project, and how can the design support cost-effectiveness?

    3. What software application would best support the database?

    4. What queries would allow information to be quickly and accurately retrieved
    from the database?

    5. How should information be organized in order to maintain the integrity of the
    data (the completeness and accuracy of the information), even as data is changed?

    6. In what way might the design need to evolve as the needs of the user change—through
    business growth, for example?

    7. What problems may occur, and how can the system be backed up?

    8. Is it necessary to provide a security system for the database?'
  - '[PAGE 24]


    may be required to run queries when needed or may stay on the project to help
    maintain the database as additions and other changes are made.


    If something goes wrong with the database, the designer will be the first one
    contacted because he she knows the details of the system. This is when the records
    made during the design process may be revisited and the backup recovery plan put
    into effect. Depending on the position and the work environment, a database designer
    may be on call twenty-four hours a day, seven days a week, to repair a failing
    system.


    Due to the amount of change in this field, some designers work mainly on upgrading
    databases. This involves taking a database, which one may or may not have designed,
    and updating the software or the database design so that it can run more efficiently.


    # PROFILE OF A PROFESSIONAL


    Fred Leskowitz is a designer who is willing to change with the times. He is currently
    working with Thomson Reuters, a company that serves as an information resource
    for businesses and professionals. Leskowitz’s career began twenty-five years ago,
    when he did an internship while studying library science. Leskowitz explains,
    “My first internship at library school consisted of sorting boxes—many, many boxes—of
    patent documents prior to being data-entered. By understanding the collection
    of data firsthand, I had many ideas about how to design the database that turned
    out to be quite useful in my next internship and job.”


    After receiving a bachelor of arts degree in aesthetics and technology and a masters
    degree in library science, Leskowitz'
  - '[PAGE 25]


    went on to work in the field of library science. “Mainly I worked on library-related
    applications like card catalogs, collections, and inventory,” he says. He then
    began working with a Thomson Reuters business called Micropatent. “I am often
    pulling information from other business systems to store and analyze,” says Leskowitz.
    He gives an overview of a recent project: “[1] built a reporting screen window
    for customer service to pull usage reports by customer/date/product.”


    In combining his own interests with his work in database design, Leskowitz gains
    new perspective and keeps his work interesting. He explains, “My interest was
    in library science, specifically patents and trademarks. Though I only deal with
    the accounting side of the products we sell because it is related to that field,
    there is always something interesting to consider. How many patents were sold
    in the field of library science, or related to music, my hobby? But having some
    touchstone into my own interest may provide additional insight into how to answer
    them.”


    His suggestion for prospective database designers is: “Choose to work in an industry
    or specialty that has interest to you—if you’re interested in cars, then look
    for a database position in the auto industry. The tools and techniques of database
    design are the same, but you’ll be dealing with a subject area that has personal
    interest.”


    Database professionals use a combination of personal qualities, professional skills,
    an understanding of the job at hand, and sometimes even their own interests to
    complete a project. As long as one’s qualities and interests match the general
    profile of a database designer, many of the specific job-related skills can be
    learned.'
