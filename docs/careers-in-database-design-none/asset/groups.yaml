    # INTRODUCTION TO DATABASE DESIGN


    # WELL-DESIGNED DATABASES SUPPORT BUSINESS GROWTH


    Imagine this scenario: a designer creates a database for a small business. The
    database is designed to keep track of clients and orders. The business quickly
    becomes a huge success and orders begin to roll in. Luckily, the database designer
    considered the business''s potential for rapid growth. The designer is able to
    quickly work changes into the database without downtime. What if the site had
    to shut down in order for the database to be revamped? The business would likely
    lose clients, as well as a lot of money, during the reconstruction of the database.


    Because a database relies on a software system to run, a database designer must
    be comfortable working with different software applications. This helps the designer
    know what system would be a good fit for a particular database. Software designers
    and database designers often work in close company to the benefit of both professions.


    # BY ANY OTHER NAME


    For the purposes of this book, the title database designer will be used to describe
    someone who organizes and maintains the storage of data. But other job titles
    may also be used and can be interchangeable. In some cases, however, there are
    differences in the emphasis of the job.'
  - '[PAGE 13]


    Database designers are sometimes referred to as database architects or database
    developers. These names stem from the use of a database model as a blueprint for
    the construction of the database. The titles database manager and database administrator
    are also used to describe positions related to databases. These titles can refer
    to everything from managing the design process to handling database security—and
    all that falls in between. Responsibilities may include verifying data integrity,
    troubleshooting, and disaster recovery.


    One''s job title may also depend on the size of the company for which one or worker
    is self-employed or not. When working for a big company that has a large IT team,
    one may have the opportunity to specialize in a particular aspect of information
    technology. On the other hand, someone who is self-employed or who works for a
    small company will probably have to wear many different hats, rather than having
    one area of expertise.


    Database security and database performance tuning are two specialty areas within
    larger IT teams. With so much information accessible to so many, the field of
    database security has evolved out of necessity to help protect private and sensitive
    information. Positions as database managers are common in financial institutions,
    for example. Performance tuning is an area in which one focuses on the running
    of the database. Someone in this role is not necessarily involved in designing
    the database. Professionals who do performance tuning ensure that the database
    is running efficiently. They also engage in problem solving to make it more efficient.'
