  md: '# ASKING THE RIGHT

    QUESTIONS


    The following are questions for a database designer to consider when working on
    a design project:


    +   1. What purpose will the database serve?

    2. What is the budget for this project, and how can the design support cost-effectiveness?

    3. What software application would best support the database?

    4. What queries would allow information to be quickly and accurately retrieved
    from the database?

    5. How should information be organized in order to maintain the integrity of the
    data (the completeness and accuracy of the information), even as data is changed?

    6. In what way might the design need to evolve as the needs of the user change—through
    business growth, for example?

    7. What problems may occur, and how can the system be backed up?

    8. Is it necessary to provide a security system for the database?'
  merge: -1
