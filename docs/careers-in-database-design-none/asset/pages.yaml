  md: '![](img/b75959f352ac2d65d44f7de98d2be8cf_57_0.png)


    A database designer who is a self-employed professional or an independent contractor
    will find that multitasking comes with the territory.


    but some in this field choose to open their own businesses or become independent
    contractors. Many database designers have created successful companies that design
    databases or create database-driven Web sites for for other businesses. Self-employment
    can be very rewarding, and it enables the database designer to choose clients
    and projects. However, it also requires the database designer to be a self-starter
    with business savvy and know-how.


    Many of the same qualities that make one a good database designer are also fundamental
    for a person who is self-employed. Time management skills, attention to detail,
    and strong problem-solving abilities all benefit a business'
