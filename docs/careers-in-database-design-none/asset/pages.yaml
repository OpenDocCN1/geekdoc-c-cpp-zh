  md: 'Imagine a warehouse full of files, the information within the files having
    no relationship to other information nearby, no rhyme or reason for its placement.
    How easy would it be to access information from that warehouse? Would it be like
    finding a needle in a haystack! Now imagine the files are arranged according to
    their subjects. The files are in alphabetical order, and each file can be cross-referenced
    with other files. The task of pulling out any one piece of information is not
    so daunting if the information is organized in a manageable, predictable format.


    A database is a digital warehouse. It can store a huge quantity of data, or information.
    In fact, there is no limit to the type of data that may be stored electronically.
    Within a computer database, businesses might keep product inventories, sales transactions,
    customer profiles, employee records, and financial records. Libraries, museums,
    research institutions, and government agencies store an enormous amount of data
    and may share this information with the public. The data may take the form of
    text, numerical figures, or even pictures, music, or videos. Input this information
    into a computer without a system for organizing it, and retrieving the data becomes
    something akin to finding that needle in the haystack.


    Simply defined, the job of a database designer is to create a system for storing
    information within a database, allowing the data to be easily retrieved and updated.
    A person who has an eye for detail and can organize information in a logical fashion
    will receive great satisfaction'
  merge: -1
