  md: '# SOFTWARE SYSTEMS FOR RUNNING DATABASES


    A database designer may design a database using a software system that is already
    in place. Or, it may be part of the designer’s job to determine what application
    will best support the database. Based on cost considerations and user needs, the
    designer typically chooses one of the following types of database management systems:


    +   - Desktop. This software is meant for use with personal computers. The databases
    are fairly simple in design and may organize the user’s personal or business information.
    The information is accessed from a single computer. Microsoft Access is an example
    of a desktop application.


    +   - Server. A more costly alternative to desktop programs, server applications
    allow a database to be accessed through the Internet by way of a central computer.
    These systems can efficiently handle large amounts of information, which will
    be accessed by multiple users. Oracle and MySQL are common server-based systems.


    +   - Web-enabled. Using this kind of software, many people can access the database
    from a remote location using a mobile device.'
  merge: -1
