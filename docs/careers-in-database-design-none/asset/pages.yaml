  md: '# Glossary


    **application** Computer software that helps the user perform a particular task.


    **computer platform** The underlying operating system, or hardware, on which computer
    applications run.


    **data** Information input into a database.


    **database** A computer storehouse of related information.


    **database management system (DBMS)** A collection of computer applications that
    allows the user to organize and manage the information within a database.


    **database model** A diagram showing the organization and relationships among
    the data within a database.


    **data entry** The act of putting information into the database, which is typically
    done by typing information into an entry form.


    **flat file** A database in its most basic form, with a single table of information.


    **help desk** A support service in which computer users can get assistance from
    a computer professional.


    **information technology (IT) team** A group of professionals working together
    to build, store, and manage data hardware and software systems.


    **interface** The place where the user can see and interact with the data contained
    in the database, generally on a screen.


    **niche** A special area of demand for a product or service.


    **normalization** The process of removing duplicate entries from a database.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'performance tuning The process of ensuring that a computer system, such as
    a database, is working at a level of maximum efficiency.


    query A question posed to a database in order to extract information.


    relation A logical association between two or more things.


    relational database A type of database structure that allows the user to access
    information from anywhere within the structure.


    structured query language (SQL) A computer programming language used to access
    and manipulate data in a relational database.


    systematize To put in order.


    troubleshooting The act of methodically searching for the source of a computer
    system malfunction.'
