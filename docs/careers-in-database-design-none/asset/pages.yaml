  md: '# A TROUBLESHOOTING SCENARIO


    A database malfunctions, risking the success of the business that relies on the
    stability of the system. What is a database designer to do? First, he or she must
    gather all of the information in detail from the moment the problem began. Then,
    he or she refers to the documentation and other records that were kept during
    the design process. Finally, the database designer goes step-by-step over the
    elements of the design to see where the failure occurred and how to make repairs.


    However, preventative measures are the best action. Given the amount of valuable
    data that could be lost without doing anything to protect it, data backup and
    recovery is an essential part of the database management system. Sometimes a complete
    secondary system, identical to the original database management system, is created.
    This system can be relied upon should the original system fail or be damaged in
    some way.


    Common causes of data loss are hardware failure, natural disasters such as storms,
    and user error. In each of these situations, data loss can be reduced with a good
    action plan. Recovery tools, installed prior to data loss, can restore the system
    to a point in time before the damage was done. The risk is that the system will
    lose changes that may have been made in the interim. A backup system is another
    good precautionary measure, as long as the system is backed up regularly. If'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'the backup system is run consistently, all changes to the data are covered.


    Data may also be lost due to a computer virus or other intentional attack. Again,
    a backup and recovery system can be helpful, but security measures can keep people
    from hacking into a database. Such measures often entail installing security systems.
    For example, the database designer can set up a system of authorization codes
    that allows only certain users to view certain data. Security is particularly
    important when the data is of a confidential nature, such as financial information.
    For this reason, banks and other financial institutions rely heavily on security
    measures.


    ![](img/b75959f352ac2d65d44f7de98d2be8cf_43_0.png)


    Database designers may specialize in database security, evaluating security risks
