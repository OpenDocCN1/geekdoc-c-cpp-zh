  md: '# PROS AND CONS OF A CAREER IN DATABASE DESIGN


    All career fields have positive and negative aspects to consider. The key is to
    choose a career with positive aspects that you value and negative aspects that
    you can at least tolerate. For the field of database design, some of the pros
    and cons are as follows:


    +   Pros:

    - Career diversity gives database designers many options in choosing a work setting
    and for specializing within the field.

    - Database designers have the satisfaction of seeing their designs serve a purpose.

    - There is opportunity for self-employment.

    - This profession offers job security and growth potential.

    - Database designers may have the option of working at the job site or from home.


    +   Cons:

    - Database designers are under pressure to create a design that can withstand
    the test of time.

    - Deadlines are often tight.

    - The database design may not always reflect what is most logical or elegant,
    but what is the cost-efficient for the client.

    - There is the possibility of being on call and working odd hours.

    - Technology changes so rapidly that what worked yesterday may not work tomorrow.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# AN ARRAY OF OPPORTUNITIES


    Web page looks the same and contains the same information each time it is loaded.
    In order for the page to change, someone must program it differently and then
    upload the new version. In contrast, a dynamic Web page can change each time the
    page is loaded. Sometimes users can even manipulate the information on the page
    and make changes themselves.


    A database-backed, or database-driven, Web site is a type of dynamic Web page.
    These Web sites are connected to a database in a way that allows information to
    be pulled directly from the database. As the information within the database changes,
    the Web site reflects these changes. With proper database design, these changes
    are automatic, without any manipulation from the user. An example is an e-commerce
    site that must provide up-to-minute information about products and prices to customers.


    As members of an IT team, database designers and Web page developers often share
    work on database-backed Web sites. The database designer works closely with Web
    developers to ensure ease of access to the data through proper coding. Many database
    designers who work for smaller companies or who are self-employed take on the
    dual role of designer and Web page developer.


    As the cost of these sites has gone down and the process has become easier to
    manage, more businesses have been relying on database designers to help create
    database-backed Web sites. Database designers find their expertise and services
    in great demand as new technologies are released, allowing databases to be accessed
    from remote locations. The challenge for these database designers is in building
    a site that can keep up with data changes and provide the necessary security measures.
    The satisfaction comes from working on'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'a database design that makes information accessible to every-one connected
    to the World Wide Web.


    # FINDING THE RIGHT JOB


    With so many options, how does someone find a job that is a good fit? While receiving
    education and training, one should note the aspects of database design and the
    areas of study that he or she finds the most rewarding. In addition, one should
    reflect on his or her natural strengths, weaknesses, and preferences. For example,
    someone who has excellent communication skills and enjoys working with others
    may be a perfect fit for a help desk job. Those who like staying abreast of the
    latest technology might enjoy working with computer engineers to design new products
    incorporating databases. If problem solving gives one great satisfaction, performance
    tuning or troubleshooting may be a good niche. Those who strictly enjoy design
    work and organizing information may seek a job in which the initial design process
    constitutes the main workload.


    As Fred Leskowitz discovered by combining his interest in library science with
    his interest in database design, a personal interest, or even a hobby, can sometimes
    lead to work in an industry that is enjoyable and rewarding. Those entering this
    field would benefit from examining their own interests and thinking creatively
    about how database design relates to those interests. For example, sports enthusiasts
    may want to work on databases that house sports statistics.


    An internship offers the perfect opportunity for exploring a job before officially
    becoming an employee. An intern is a person in training who holds a temporary
    position in an'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'organization. Sometimes an intern is paid, but often he or she completes the
    work as a volunteer. Through an internship, one can learn some of the tricks of
    the trade and perform tasks that will be required as a database designer. This
    valuable work experience can then be included on one''s résumé and discussed in
    job interviews. An internship also offers one the chance to make connections that
    may lead to employment. By completing internships in more than one organization,
    or by observing the different roles in the same organization, one can get a bird''s-eye
    view of what it is like to work in different areas of database design.


    When starting one''s journey to becoming a database designer, it is important
    to keep records of one''s experiences and design work. Work samples may later
    be included in one''s résumé or portfolio. This information can be used to help
    one get a job or home in the job that may be the best fit.'
