  md: '# CHAPTER 6

    An Array of Opportunities


    Opportunities are plentiful in the field of database design.

    The possibilities for employment are limitless, as virtually every organization
    imaginable has information that needs to be organized and managed. Database designers
    can be found working in small businesses, hospitals, law enforcement agencies,
    government offices, financial institutions, universities, computer systems, insurance
    offices, libraries, and large corporations. The possibilities are as diverse as
    the kinds of information that can be stored in a database.


    Once the words “You’re hired!” are heard, what might work life be like for a database
    designer?


    # WORK ENVIRONMENT


    As a database designer, one can expect to spend most of the time working in an
    office space or in a computer lab in front of a computer. The majority of a database
    designer’s work is completed at a desk.


    As with many computer-related fields, there may be the risk of eyestrain, headaches,
    back problems from sitting for extended periods of time, and carpal tunnel syndrome
    from excessive typing. When considering a place of employment, it is a good idea
    to observe the work setting to see whether or not the employer has taken steps
    to protect employees’ health. For example, is the lighting sufficient, and is
    it positioned in a way to reduce'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# AN ARRAY OF OPPORTUNITIES


    glare from the computer screen. Is there ample space to work? Are items provided
    to increase employees'' comfort level and efficiency? If not, are employees able
    to bring their own comfort items to work, such as chairs or wrist rests? How many
    breaks are employees permitted in order to walk around and stretch? These considerations
    will help ensure a positive work experience.


    Although this is a desk job, there is interaction with others. Examples include
    meeting with clients to establish needs for the database, teaching people how
    to use the database, and working as a member of an information technology team.
    Face-to-face meetings may be held at the workplace or may require traveling to
    client locations. Travel is generally minimal. However, it is a reality for the
    database designer who must go to various locations to work with different systems
    or consult with companies.


    A benefit in this field is that many positions allow for telecommuting if an employer
    is receptive to it. This can sometimes give the database designer the flexibility
    to set his or her own work hours. The database designer''s workweek is an average
    of forty hours, but it can be more if his or her responsibilities include troubleshooting
    and maintenance. Career professionals who specialize in these areas may be required
    to be on-call hours or work overtime in order to get a malfunctioning system running
    smoothly once again.


    # SELF-EMPLOYED OR INDEPENDENT CONTRACTOR


    The profession of database designer offers many employment options. Being an employee
    of an organization offers stability,'
