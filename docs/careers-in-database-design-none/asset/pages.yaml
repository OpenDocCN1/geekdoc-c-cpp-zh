  md: '# CHAPTER 1

    Introduction to Database Design


    In the modern world, anyone who works with a computer likely uses a database on
    a regular basis. Individuals, businesses, and government agencies all use databases
    to store and look up information. A database designer''s work often places him
    or her in the area of information technology (IT) within the computer field. However,
    databases are so widely used that there are opportunities for database designers
    to explore other areas of computer technology. Also, the information managed within
    databases covers a wide range of subject matter. This opens up the possibility
    for exposure to other interests and even hobbies while on the job.


    # WHAT IS A DATABASE?


    A database is a collection of information. Information storage can take different
    forms. For example, when organizing information that is on paper, people often
    use a system of labeled folders that are stored alphabetically in filing cabinets.
    Electronic information storage has largely replaced these archaic forms of storage.
    In the newer form of storage, the information is in a digital format that is accessible
    by computer or another electronic device. Electronic storage allows people to
    save much more information than they can physically house and access what they
    need quickly, often in just seconds.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/b75959f352ac2d65d44f7de98d2be8cf_10_0.png)


    Using a software program, data is entered into the computer. Later, a user can
    retrieve the information.


    A database is put into electronic form by means of a software system called a
    database management system (DBMS). This software system is used to create the
    database and manage the information that is stored within it. Once information
    is saved in the database, it is not seen until a user poses a question to the
    system. Known as a query, the user’s question enables the data to be pulled up
    on the screen. A database designer works with the DBMS, setting up a database
    that meets the organizational needs of the user and the requirements of the software
    system.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# WHAT IS DATABASE DESIGN?


    Database design is the process of taking information and organizing it into a
    manageable collection of material that users can access easily.


    The design process has different parts or stages. For example, a database designer
    identifies users’ needs, creates a database that will work well for the users,
    and then tests the system. After the database is set up, the designer makes sure
    that it continues to work properly. The designer often helps to solve any problems
    that arise and may help to change or expand the system. Making sure that the data
    is secure and adequately backed up is also extremely important. Therefore, database
    designers typically plan and test security measures as part of any database project.


    Early in the design process, the database designer must consider how the user
    will search for information. For example, someone searching a database for a book
    about computer software can query the database. All of the books within the database
    that are related to the subject come come up. If the information is not properly
    organized or connected within the system, some data may be irretrievable.


    Before putting information into a software system, the database designer makes
    a hard copy of the database structure. This hard copy is called a data model.
    There are many types of data models. Depending on the type of model used, the
    database structure may look like a diagram or chart when illustrated on paper.
    By using a database model, the designer can organize the information into categories
    and ensure that related material will be linked within the database.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# INTRODUCTION TO DATABASE DESIGN


    # WELL-DESIGNED DATABASES SUPPORT BUSINESS GROWTH


    Imagine this scenario: a designer creates a database for a small business. The
    database is designed to keep track of clients and orders. The business quickly
    becomes a huge success and orders begin to roll in. Luckily, the database designer
    considered the business''s potential for rapid growth. The designer is able to
    quickly work changes into the database without downtime. What if the site had
    to shut down in order for the database to be revamped? The business would likely
    lose clients, as well as a lot of money, during the reconstruction of the database.


    Because a database relies on a software system to run, a database designer must
    be comfortable working with different software applications. This helps the designer
    know what system would be a good fit for a particular database. Software designers
    and database designers often work in close company to the benefit of both professions.


    # BY ANY OTHER NAME


    For the purposes of this book, the title database designer will be used to describe
    someone who organizes and maintains the storage of data. But other job titles
    may also be used and can be interchangeable. In some cases, however, there are
    differences in the emphasis of the job.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Database designers are sometimes referred to as database architects or database
    developers. These names stem from the use of a database model as a blueprint for
    the construction of the database. The titles database manager and database administrator
    are also used to describe positions related to databases. These titles can refer
    to everything from managing the design process to handling database security—and
    all that falls in between. Responsibilities may include verifying data integrity,
    troubleshooting, and disaster recovery.


    One''s job title may also depend on the size of the company for which one or worker
    is self-employed or not. When working for a big company that has a large IT team,
    one may have the opportunity to specialize in a particular aspect of information
    technology. On the other hand, someone who is self-employed or who works for a
    small company will probably have to wear many different hats, rather than having
    one area of expertise.


    Database security and database performance tuning are two specialty areas within
    larger IT teams. With so much information accessible to so many, the field of
    database security has evolved out of necessity to help protect private and sensitive
    information. Positions as database managers are common in financial institutions,
    for example. Performance tuning is an area in which one focuses on the running
    of the database. Someone in this role is not necessarily involved in designing
    the database. Professionals who do performance tuning ensure that the database
    is running efficiently. They also engage in problem solving to make it more efficient.'
  merge: -1
