- img_proc: true
  md: 'between applications, any changes to the data should appear in both programs
    so that the information remains accurate. If the database model does not take
    this into account, the integrity of the data will be lost and the database will
    become ineffective.


    Another important question, “What are the cost requirements of building the database?”
    It does not matter how great the database model is if the project of building
    the database is unaffordable or if maintenance of the database is too expensive.
    The most advanced database systems may not necessarily be the most cost-effective;
    implementing them could be overkill for smaller businesses or organizations.


    Once these questions and others are answered, the database designer can determine
    the best way to organize the data. The initial data model simply shows a series
    of tables, or blocks of information, in a diagram. The diagram conveys the basic
    structure of the database and shows the connection between related tables. At
    this point, any changes to the information or its organization may be analyzed.
    The designer then creates a more detailed model. This model translates the data
    into SQL and assigns functions to the database management system. These functions
    may include how the software will maintain the data or provide security, if necessary.


    # DIFFERENT TYPES OF DATABASE MODELS


    There are different data models that have evolved over time, through trial and
    error. An early, simple way to store data was a'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'flat file system. In this system, data was simply placed into one file. It
    was quickly discovered that this format made accessing information a challenge,
    as the search had to be very specific to the data. Also, if the user searched
    in the wrong file, the data would never be uncovered.


    Later, network and hierarchical database models were created as a way to make
    the data more accessible. However, models required users to perform root searches.
    In a root search, the user must begin with the most basic, broad search terms,
    rather than entering more detailed information. For example, let''s say a user
    is searching for a certain part. A root search would require the user to first
    enter the model and make of the car in order to pull up the information. The user
    could not simply query the database for the car part directly. These database
    models are quickly becoming obsolete, as more relevant answers to the problem
    of how to store information are becoming clear.


    In addition, the object-oriented database has come into to store complex data,
    such as photos and videos. In this kind of database, information is stored as
    objects (numbers and code), rather than as flat data.


    The development of the relational database model changed the field of database
    design. Today, the relational database is the most commonly used database model.
    Invented by Edgar F. Codd and enhanced by others in the field, the relational
    model allows the user to start the search from many places in the database structure,
    rather than starting from root terms and working up to the desired information.
    This model also allows multiple pieces of information to be retrieved at once.
    In this model, data is normalized, meaning'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'that duplicate information is eliminated. By cutting back on multiple entries
    of the same information, the integrity of the system is more easily maintained.
    Also, required maintenance to the system is reduced. The relational database is,
    for now, the most advanced form of information storage.


    Once a data model is chosen and created, the database designer uses SQL to input
    the data into the software system. In a good design, the user can continue to
    make additions and other changes to the data as needed without slowing down the
    system. While some designers deal mainly with the initial design of the system,
    others find that their job descriptions include making changes and continuing
    to manage the database.'
