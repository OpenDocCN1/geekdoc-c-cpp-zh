    call*. Procedural programming is often a better choice than simple sequential
    programming in many situations which involve moderate complexity or which require
    significant ease of maintainability.


    o Possible benefits: the ability to re-use the same code (function or procedure)
    at different places, an easier way to keep track of program flow than a collection
    of “GO TO” or “JUMP” statements.


    **1.4.2\. Structured Programming.**


    o Process of writing a program in small, independent parts. This makes it easier
    to control a program''s development and to design and test its individual component
    parts.


    o Structured programs are built up from units called ***modules***, which normally
    correspond to single procedures or functions.


    o Can be seen as a *subset or sub discipline of procedural programming*. It is
    most famous for removing or reducing reliance on the GO TO statement.


    **1.4.3\. Object-Oriented Programming**.


    o The idea behind OOP is that, a computer program is composed of a collection
    of *individual units, or objects* as opposed to traditional view in which a program
    is a list of instructions to the computer.


    o Object-oriented programming is claimed to give more flexibility, easing changes
    to programs. The OOP approach is often simpler to develop and maintain.


    **1.5\. Problem solving process and software engineering**.


    **1.5.1\. Software Engineering.**


    o Software engineering is the profession that creates and maintains software applications
    by applying technologies and practices from *computer science*, *project management*,
    *engineering*, *application domain* and other fields.


    o The method used in solving problems in computer science and/or information systems
    is called the *software development life cycle*.


    o The software development life cycle has the following components.


    ![](Images/image00067.gif)![](Images/image00068.gif)![](Images/image00069.gif)![](Images/image00070.gif)![](Images/image00071.gif)![](Images/image00072.gif)![](Images/image00073.gif)


    ***preliminary investigation***


    ![](Images/image00074.gif)![](Images/image00075.gif)![](Images/image00076.gif)![](Images/image00077.gif)![](Images/image00078.gif)![](Images/image00073.gif)


    ***analysis***


    ![](Images/image00079.gif)![](Images/image00080.gif)![](Images/image00081.gif)![](Images/image00082.gif)![](Images/image00083.gif)![](Images/image00084.gif)![](Images/image00085.gif)


    ***design***


    ![](Images/image00086.gif)![](Images/image00087.gif)![](Images/image00088.gif)![](Images/image00089.gif)![](Images/image00090.gif)


    ***implementation***


    ![](Images/image00091.gif)![](Images/image00092.gif)![](Images/image00093.gif)![](Images/image00094.gif)![](Images/image00095.gif)![](Images/image00096.gif)![](Images/image00097.gif)


    ***testing and maintenance***


    **1.5.2\. Problem Solving**


    o Problem solving is the process of transforming the description of a problem
    into the solution by using our knowledge of the problem domain and by relying
    on our ability to select and use appropriate problem-solving strategies, techniques,
    and tools.


    o A problem is an *undesirable situation* that prevents the organization from
    fully achieving its purpose, goals and objectives. Or problem can also be defined
    as the *gap between the existing and the desired situation* where problem solving
    will try to fill this gap.


    There are two approaches of problem solving:


    *Top down design:* is a systematic approach based on the concept that the structure
    of the problem should determine the structure of the solution and what should
    be done in lower level. This approach will try to disintegrate a larger problem
    into more smaller and manageable problems to narrow the problem domain.


    *Bottom up design:* is the reverse process where the lowest level component are
    built first and the system builds up from the bottom until the whole process is
    finally completed.


    **1.6\. Basic Program development tips**


    The program we design in any programming language need to be: ***Reliable***:
    the program should always do what it is expected to do and handle all types of
    exception.


    ***Maintainable***: the program should be in a way that it could be modified and
    upgraded when the need arises.


    ***Portable***: It needs to be possible to adapt the software written for one
    type of computer to another with minimum modification. ***Efficient***: the program
    should be designed to make optimal use of time, space and other resources of the
    computer.


    **1.7\. Algorithm designing and modeling the logic (using flow chart).** A digital
    computer is a useful tool for solving a great variety of **problems**. A solution
    to a problem is called an **algorith**m; it describes the sequence of steps to
    be performed for the problem to be solved. Generally, an algorithm is a finite
    set of well-defined instructions for accomplishing some task which, given an initial
    state, will terminate in a corresponding recognizable end-state.


    The algorithm should be:


