  trans: "\n\n程序注释是编译器完全忽略的文本，仅用于告知读者源代码在程序任何特定点是如何运行的。\n\nC++ 提供了两种类型的注释分隔符：\n\n\
    - **单行注释**：`//`（双正斜杠）之后的所有内容（直到其所在行的末尾）都被视为注释。\n  - **示例**：`cout<<var1; //此行打印\
    \ var1 的值` \n  \n- **多行注释**：任何包含在 `/*` 和 `*/` 成对之间的内容都被视为注释。\n  - **示例**：\n```cpp\n\
    /*这是一类注释，\n多行内容可以被包含在\n一个 C++ 程序中 */\n```\n\n注释应该用于增强（而不是阻碍）程序的可读性。特别应该注意以下两点：\n\
    \n- 注释应该比它试图解释的代码更容易阅读和理解。令人困惑或不必要的复杂的注释比没有注释糟糕。过度使用注释会导致可读性进一步降低。如果一个程序包含的注释多到你几乎看不到代码，它绝不能被认为是可读的。在程序中使用变量和其他实体的描述性名称，并对代码进行适当的缩进，可以减少对注释的需求。\n\
    \n## 2.4. 函数简述\n\n通常情况下，函数是执行一个或多个动作的代码块。\n\n大多数函数在程序运行过程中被调用或触发，这是在程序开始执行之后。\n\
    \n程序命令按它们在源代码中出现的顺序逐行执行，直到遇到函数。然后程序将分支执行该函数。当函数完成时，它会将控制权返回给紧邻函数调用之后的行代码。\n\n\
    函数由一个**头部**和一个**主体**组成。头部反过来由**返回类型**、**函数名**以及该函数的**参数**组成。\n\n函数的参数允许将值传递到函数。参数是传递给函数的值的类型声明；调用函数传递的实际值称为**参数**。\n\
    \n让我们来看一个例子：\n```cpp\n#include<iostream.h> \n#include<conio.h> \nvoid main()\n\
    {\n    cout<<\"\\n In main function\"; \n    demoFunction();\n    cout<<\"\\n\
    \ Back in main function\"; \n    getch();\n}\n\nvoid demoFunction()\n{\n    cout<<\"\
    \\n demoFunction\";\n}\n```\n\n函数返回一个值或 void（即不返回任何内容）。相加两个整数的函数可能会返回和，因此被定义为返回一个整数值。仅打印消息的函数没有内容可以返回，将声明为返回\
    \ void。\n\n函数可以使用 **return** 语句返回值；返回语句也会导致函数退出。\n\n如果函数末尾没有返回语句，函数将自动返回 void。\n\
    \n## 2.5. 变量与常量\n\n### 2.5.1. 变量\n\n变量是内存中存储信息的预留位置。一个变量将具有三个部分：\n\n变量用于存储数据值，以便在程序的各种计算中使用。\n\
    \n所有变量都有三个重要的属性：\n\n- **数据类型**：在定义变量时确定的类型（例如：整数、实数、字符等）。数据类型描述数据的属性和预留内存的大小。\n\
    - **名称**：用于引用变量中值的名称。预留内存位置的唯一标识符。\n- **值**：通过给变量分配新值来更改的值。\n\n#### 2.5.1.1. 基础变量类型\n\
    \nC++ 内置了其他几种变量类型。它们可以方便地分类为**整数**、**浮点**或**字符**变量。\n\n浮点变量类型可以表示为分数，即它们是“实数”。\n\
    \n字符变量持有单个字节。它们用于存储 ASCII 和扩展 ASCII 字符集中的 256 个不同的字符和符号。\n\nC++ 程序中使用的变量类型在下表中描述，表中列出了变量类型及其占用的空间：\n\
    \n| 类型 | 长度 | 范围 |\n| :--- | :--- | :--- |\n| unsigned char | 8 bits | 0 to 255\
    \ |\n| char | 8 bits | -128 to 127 |\n| enum | 6 bits | -32,768 to 32,767 |\n\
    | unsigned int | 16 bits | 0 to 65,535 |\n| short int | 16 bits | -32,768 to 32,767\
    \ |\n| int | 16 bits | -32,768 to 32,767 |\n| unsigned long | 32 bits | 0 to 4,294,967,295\
    \ |\n| long | 32 bits | -2,147,483,648 to 2,147,483,647 |\n| float | 32 bits |\
    \ -3.4x10 to 3.4x10^(+38) |\n| double | 64 bits | -1.7x10^(-308) to 1.7x10^(+308)\
    \ |\n| long double | 80 bits | -3.4x10^(-4932) to 3.4x10^(+4932) |\n| bool | 8\
    \ bits | true or false（位被忽略） |\n\n#### 2.5.1.2. 有符号与无符号\n\n符号整数可以是负的或正的。无符号整数总是正的。\n\
    \n由于符号和无符号整数需要相同的字节数，在无符号的情况下，所有位都可表示大小。如果我们使用符号，可以使用第一位来表示符号，如果第一位值为 0 则为正，如果为\
    \ 1 则为负。在这种情况下，我们将剩下的三位用于表示大小。\n\n#### 2.5.1.3. 声明变量\n\n变量可以通过被称为**声明**的过程创建。语法：`数据类型\
    \ 变量名;`\n\n声明将指示计算机根据声明期间指定的名称和大小预留内存位置。\n\n良好的变量名指示变量的用途，或者它们应该是自解释的。\n\n例如 `int\
    \ myAge; //用于存储年龄的变量`\n\n变量名有时称为标识符，在程序中应该是唯一的。\n\n某些单词被 C++ 保留用于特定目的，不能作为标识符使用。\n\
    \n这些被称为**保留字**或**关键字**，如下表所示：\n\nasm, continue, float, new, signed, try, auto,\
    \ default, for, operator, sizeof, typedef, break, delete, friend, private, static,\
    \ union, case, do, goto, protected, struct, unsigned, catch, double, if, public,\
    \ switch, virtual, char, else, inline, register, template, void, class, enum,\
    \ int, return, this, volatile, const, extern, long, short, throw, while\n\n一个或多个字母、数字或下划线符号。标识符的长度没有限制。\n\
    \n标识空格或标记字母不能是标识符的一部分。\n\n只有字母、数字和下划线字符是有效的。变量标识符应该始终以字母或下划线开头。任何情况下都不应以数字开头。\n\
    \n#### 2.5.1.4. 初始化变量\n\n当在声明时给变量分配一个值时，就被称为变量初始化。\n\n这等同于声明变量并在声明后给变量分配一个值。语法：`数据类型\
    \ 变量名 = 初始值;`\n\n"
