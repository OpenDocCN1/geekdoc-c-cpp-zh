- fmt: "\n7. Write a program that accepts ten different integers from the user and\
    \ display these numbers after sorting them in increasing order.\n\n8. Write a\
    \ program to store six of your friend’s ages in a single array. Assign the ages\
    \ in a random order. print the ages, from low to high, on-screen.\n\n9. Modify\
    \ the program on Q8 to print the ages in descending order.\n\n10. Write a C++\
    \ program that calculates the letter grades of 20 students. The program should\
    \ accept the mid result and the final result from the students. Use the appropriate\
    \ validity control mechanism to prevent wrong inputs.\n\n11. Write a C++ program\
    \ that has two functions `toBinary` and `toDecimal`. The program should display\
    \ a menu prompting the user to enter his choice. If the user selects `toBinary`,\
    \ then the function should accept a number in base ten and displays the equivalent\
    \ binary representation. The reverse should be done if the user selects `toDecimal`.\n\
    \n12. Develop a C++ program that accepts a word from the user and then checks\
    \ whether the word is palindrome or not. (NB a word is palindrome if it is readable\
    \ from left to right as well as right to left).\n\n13. Write a C++ program that\
    \ accepts a word from the user and then displays the word after reversing it.\n\
    \n14. Develop a C++ program that accepts the name of a person and then counts\
    \ how many vowels the person’s name have.\n\n15. Modify the question in Q14 in\
    \ such a way that it should replace vowel characters with `*` in the person name.\n\
    \n16. Write a program in C++ which read a three digit number and generate all\
    \ the possible permutation of numbers using the above digits. For example `n =\
    \ 123` then the permutations are – 123, 213, 312, 132, 231, 321.\n\n17. Write\
    \ a program which read a set of lines until you enter `#`.\n\n18. Write a program\
    \ which read two matrixes and then print a matrix which is addition of these two\
    \ matrixes.\n\n19. Write a program which reads two matrix and multiply them if\
    \ possible.\n\n20. Write a program which reads a 3 x 2 matrix and then calculates\
    \ the sum of each row and store that in a one dimension array.\n\n# Chapter Six\
    \ Pointers 6. Introduction\n\nWe have already seen how variables are memory cells\
    \ that we can access by an identifier. But these variables are stored in concrete\
    \ places of the computer memory. For our programs, the computer memory is only\
    \ a succession of 1 *byte* cells (the minimum size for a datum), each one with\
    \ a unique address. A pointer is a variable which stores the address of another\
    \ variable. The only difference between pointer variable and regular variable\
    \ is the data they hold. There are two pointer operators in C++:\n\n- `&` the\
    \ address of operator\n- `*` the dereference operator\n\nWhenever you see the\
    \ `&` used with pointers, think of the words “address of.” The `&` operator always\
    \ produces the memory address of whatever it precedes. The `*` operator, when\
    \ used with pointers, either declares a pointer or dereferences the pointer’s\
    \ value. The dereference operator can be literally translated to “value pointed\
    \ by”.\n\nA **pointer** is simply the address of an object in memory. Generally,\
    \ objects can be accessed in two ways: directly by their symbolic name, or indirectly\
    \ through a pointer. The act of getting to an object via a pointer to it, is called\
    \ **dereferencing** the pointer. Pointer variables are defined to point to objects\
    \ of a specific type so that when the pointer is dereferenced, a typed object\
    \ is obtained.\n\nAt the moment in which we declare a variable this one must be\
    \ stored in a concrete location in this succession of cells (the memory). We generally\
    \ do not decide where the variable is to be placed - fortunately that is something\
    \ automatically done by the compiler and the operating system on runtime, but\
    \ once the operating system has assigned an address there are some cases in which\
    \ we may be interested in knowing where the variable is stored. This can be done\
    \ by preceding the variable identifier by an ampersand sign (`&`), which literally\
    \ means, “address of.” For example:\n\n```\nptr = &var;\n```\n\nThis would assign\
    \ to variable `ptr` the address of variable `var`, since when preceding the name\
    \ of the variable `var` with the ampersand (`&`) character we are no longer talking\
    \ about the content of the variable, but about its address in memory.\n\nWe are\
    \ going to suppose that `var` has been placed in the memory address `1776` and\
    \ that we write the following:\n\n```cpp\nvar=25;\nx=var;\nptr = &var;\n```\n\n\
    The result will be the one shown in the following diagram:\n\n![](Images/image00161.gif)\n\
    \nWe have assigned to `x` the content of variable `var` as we have done in many\
    \ other occasions in previous sections, but to `ptr` we have assigned the address\
    \ in memory where the operating system stores the value of `var`, that we have\
    \ imagined that it was `1776` (it can be any address). The reason is that in the\
    \ allocation of `ptr` we have preceded `var` with an ampersand (`&`) character.\
    \ The variable that stores the address of another variable (like `ptr` in the\
    \ previous example) is what we call a **pointer.**\n\n## 6.1 Declaring Pointers\n\
    \nIs reserving a memory location for a pointer variable in the heap. Syntax:\n\
    \n```cpp\ntype * pointer_name;\n```\n\nto declare a pointer variable called `p_age`,\
    \ do the following:\n\n```cpp\nint * p_age;\n```\n\nWhenever the dereference operator,\
    \ `*`, appears in a variable declaration, the variable being declared is always\
    \ a pointer variable.\n\n## 6.2 Assigning values to pointers\n\n`p_age` is an\
    \ integer pointer. The type of a pointer is very important. `p_age` can point\
    \ only to integer values, never to floating-point or other types. To assign `p_age`\
    \ the address of a variable, do the following:\n\n```cpp\nint age = 26;\nint *\
    \ p_age;\np_age = &age;\n```\n\nOR\n\n```cpp\nint age = 26;\nint * p_age = &age;\n\
    ```\n\nBoth ways are possible. If you wanted to print the value of `age`, do the\
    \ following:\n\n```cpp\ncout<<age;//prints value of age\n```\n\nOr using pointers\
    \ you can do it as follows:\n\n```cpp\ncout<<*p_age\n```\n\nThe dereference operator\
    \ produces a value that tells the pointer where to point. Without the `*` (i.e\
    \ `cout<<p_age`), a `cout` statement would print an address (the address of age).\
    \ With the `*`, the `cout` prints the value at that address.\n\nYou can assign\
    \ a different value to `age` with the following statement:\n\n```cpp\nage = 13;//assigns\
    \ a new value to variable age\n```\n\n```cpp\n*p_age = 13 //assigns 13 as a value\
    \ to the memory p_age points at\n```\n\nN.B: the `*` appears before a pointer\
    \ variable in only two places: when you declare a pointer variable and when you\
    \ dereference a pointer variable (to find the data it points to).\n\n- The following\
    \ program is one you should study closely. It shows more about pointers and the\
    \ pointer operators, `&` and `*`, than several pages of text could.\n\n```cpp\n\
    void main() {\n    int num = 123; // a regular integer variable\n    int *p_num;\
    \ //declares an integer pointer\n    cout<< “num is ”<<num<<endl;\n    cout<<\
    \ “the address of num is ”<<&*num<<endl;\n    p_num = &num;// puts address of\
    \ num in p_num\n    cout<< “*p_num is ”<<*p_num<<endl; //prints value of num\n\
    \    cout<< “p_num is ”<<p_num<<endl; //prints value of p_num\n    getch();\n\
    }\n```\n\n## 6.3 Pointer to void\n\nnote that we can’t assign the address of a\
    \ float type variable to an integer pointer variable and similarly the address\
    \ of an interger variable can not be stored in a float or character pointer.\n\
    \n```cpp\nflaot y;\nint x;\nint *ip;\nfloat *fp;\n\nip = &y; //illegal statement\n\
    fp = &x; //illegal statement\n```\n\nThat means, if a variable type and pointer\
    \ to type is same, then only we can assign the address of variable to pointer\
    \ variable. And if both are different type then we can’t assign the address of\
    \ variable to pointer variable but this is also possible in C++ by declaring pointer\
    \ variable as a void as follows:\n\n```cpp\nvoid *p;\n```\n\nLet us see an example:\n\
    \n```cpp\nvoid *p;\nint x;\nfloat y;\np = &x; //valid assignment\np = &y; //valid\
    \ assignment\n```\n"
