    \ arguments. `argc` is known as argument counter and `argv` is called argument\
    \ vector.\n- `C:\\> student A B`. the value of `argc` is 3 (student, A & B) and\
    \ the `argv` would be an array of three pointers to string as follows:\n  - `Argv[0]`\
    \ – points to `student`\n  - `Argv[1]` – points to `A`\n  - `Argv[2]` – points\
    \ to `B`\n- note that `argv[0]` always represents the command name that invokes\
    \ the program.\n- Here is a sample command line argument code.\n\n```cpp\n#include<fstream.h>\n\
    #include<conio.h>\n#include<stdlib.h>\n\nvoid main(int argc, char *argv[])\n{\n\
    clrscr();\nchar ch;\nif(argc < 3) {\ncerr<<\"\\ntoo few parameters\"; getch();\n\
    exit(1);\n}\nelse if(argc > 3)\n{\ncerr<<\"\\ntoo many parametes\"; getch();\n\
    exit(1);\n}\nelse//number of parameters okay { ofstream outdata;\nifstream indata;\n\
    outdata.open(argv[2],ios::out); if(outdata.fail())\n{\ncerr<<\"\\nlow disk space\
    \ to create file : \"<<argv[2]; getch();\nexit(1);\n}\nindata.open(argv[1],ios::in);\n\
    if(indata.fail())\n{\ncerr<<\"\\nfile : \"<<argv[1]<<\" does not exist\"; getch();\n\
    exit(1);\n}\n//now start copying the file\nwhile(!indata.eof())\n{\nindata.get(ch);\n\
    outdata.put(ch);\n}\nindata.close();\noutdata.close(); cout<<\"\\nfinished copying\"\
    ; }\n}\n```\n"
