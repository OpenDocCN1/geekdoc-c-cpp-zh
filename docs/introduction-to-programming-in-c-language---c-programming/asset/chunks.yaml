    **tru


    e


    true** x = 30


    **false false** break


    **The break terminates the switch statement by jumping to the very end of it.


    There are, however, situations in which it makes sense to have a case without
    a break. For instance:**


    E.g.: switch(operator) {


    case ‘+’: res ult = operand1 + operand2;


    break;


    case ‘-’ : result = operand1 – operand2;


    break;


    case ‘x’:


    case ‘*’: result = operand1 * operand2;


    break;


    case ‘/’: result = operand1 / operand2;


