    \ operator, you access one of the strings in the array.\n\n### 6.9. Pointer to\
    \ pointer\n\nAs the memory address where integer, float or character is stored\
    \ in can be stored into a pointer variable, the address of a pointer can also\
    \ be stored in another pointer. This pointer is said to be pointer to a pointer.\
    \ An array of pointer is conceptually same as pointer to pointer type. The pointer\
    \ to pointer type is declared as follows:\n\n`Data_type ** pointer_name;`\n\n\
    Note that the asterisk is double here.\n\n`int **p; //p is a pointer which holds\
    \ the address another pointer.*\n\n`E.g.: char a; char * b; char ** c; a = 'z';\
    \ b =* &*a; c =* &*b;`\n\nThis, supposing the randomly chosen memory locations\
    \ of `7230`, `8092` and `10502` , could be described thus:\n\n![](Images/image00163.jpeg)\n\
    *(inside the cells there is the content of the variable; under the cells its location)*\n\
    \nHave a look at the following code:\n\n```cpp\nvoid main()\n{\n    clrscr();\n\
    \    int data;\n    int *p1;\n    int **p2;\n    data = 15;\n    cout<< “data\
    \ = ”<<data<<endl;\n    p1 = data;\n    p2 =\n    cout<< “data through p1 = ”<<*p1<<endl;\
    \ \n    cout<< “data through p2 = ”<< **p2<<endl; getch();\n}\n```\n\n### 6.10.\
    \ Dynamic memory\n\nUntil now, in our programs, we have only had as much memory\
    \ as we have requested in declarations of variables, arrays and other objects\
    \ that we included, having the size of all of them to be fixed before the execution\
    \ of the program. But, What if we need a variable amount of memory that can only\
    \ be determined during the program execution (runtime)? For example, in case that\
    \ we need a user input to determine the necessary amount of space. The answer\
    \ is dynamic memory, for which C++ integrates the operators `new` and `delete`.\n\
    \nPointers are useful for creating dynamic objects during program execution. Unlike\
    \ normal (global and local) objects which are allocated storage on the runtime\
    \ stack, a dynamic object is allocated memory from a different storage area called\
    \ the heap. Dynamic objects do not obey the normal scope rules. Their scope is\
    \ explicitly controlled by the programmer.\n\n#### a) The New Operator\n\n- In\
    \ C++ `new` operator can create space dynamically i.e at run time, and similarly\
    \ `delete` operator is also available which releases the memory taken by a variable\
    \ and return memory to the operating system.\n- When the space is created for\
    \ a variable at compile time this approach is called static. If space is created\
    \ at run time for a variable, this approach is called dynamic. See the following\
    \ two lines:\n\n```cpp\nint a[10];//creation of static array\nint *a;\na = new\
    \ int[10];//creation of dynamic array\n```\n\n- Lets have another example:\n\n\
    ```cpp\nint * ptr3;\nptr3 = new int [5];\n```\n\n- In this case, the operating\
    \ system has assigned space for 5 elements of type `int` in the heap and it has\
    \ returned a pointer to its beginning that has been assigned to `ptr3`. Therefore,\
    \ now, `ptr3` points to a valid block of memory with space for 5 `int` elements.\n\
    \n![](Images/image00164.gif)\n\n- You could ask what is the difference between\
    \ declaring a normal array and assigning memory to a pointer as we have just done.\
    \ The most important one is that the size of an array must be a constant value,\
    \ which limits its size to what we decide at the moment of designing the program\
    \ before its execution, whereas the dynamic memory allocation allows assigning\
    \ memory during the execution of the program using any variable, constant or combination\
    \ of both as size.\n- The dynamic memory is generally managed by the operating\
    \ system, and in the multi-task interfaces can be shared between several applications,\
    \ so there is a possibility that the memory exhausts. If this happens and the\
    \ operating system cannot assign the memory that we request with the operator\
    \ `new`, a null pointer will be returned. For that reason it is recommendable\
    \ to always verify if after a call to instruction `new` the returned pointer is\
    \ null:\n\n```cpp\nint * ptr3;\nptr3 = new int [5];\nif (ptr3 == NULL) {\n   \
    \ // error assigning memory. Take measures.\n}\n```\n\n- if `ptr3` is `NULL`,\
    \ it means that there is no enough memory location in the heap to be given for\
    \ `ptr3`.\n\n#### b) Operator delete\n\n- Since the necessity of dynamic memory\
    \ is usually limited to concrete moments within a program, once this one is no\
    \ longer needed it shall be freed so that it become available for future requests\
    \ of dynamic memory. For this exists the operator `delete`, whose form is:\n\n\
    `delete pointer;`\n\nor\n\n`delete [] pointer;`\n\n- The first expression should\
    \ be used to delete memory allocated for a single element, and the second one\
    \ for memory allocated for multiple elements (arrays).\n- In most compilers both\
    \ expressions are equivalent and can be used without distinction, although indeed\
    \ they are two different operators and so must be considered for operator overloading.\n\
    - In the following simple example, a program that memorizes numbers, does not\
    \ have a limited amount of numbers that can be introduced, thanks to the concept\
    \ and power of pointer that we request to the system as much space as it is necessary\
    \ to store all the numbers that the user wishes to introduce.\n\n```cpp\n#include\
    \ <iostream.h> \n#include <stdlib.h> \n#include<conio.h> \nint main ()\n{\n  \
    \  char input [100];\n    int i,n;\n    long * num = 0;\n    cout << \"How many\
    \ numbers do you want to type in?\"; \n    cin.getline(input,100);\n    i=atoi(input);\n\
    \    num= new long[i];\n    if (num == NULL) {\n        cout<<\"\\nenough memory!\"\
    ; \n        getch();\n        exit (1);\n    }\n    for (n=0; n<i; n++)\n    {\n\
    \        cout << \"Enter number: \"; \n        cin.getline(input,100); \n    \
    \    num[n]=atol(input);\n    }\n    cout << \"You have entered: \"; \n    for\
    \ (n=0; n<i; n++)\n    cout << num[n] << \", \";\n    delete[] num;\n    getch();\n\
    \    return 0;\n}\n```\n\nNULL is a constant value defined in C++ libraries specially\
    \ to indicate null pointers. In case that this constant is not defined you can\
    \ do it yourself by defining it to 0.\n\n### Chapter Seven File Operations (File/O)\n\
    \n#### 7. Introduction\n\n- The data created by the user and assigned to variables\
    \ with an assignment statement is sufficient for some applications. With large\
    \ volume of data most real-world applications use a better way of storing that\
    \ data. For this, disk files offer the solution.\n- When working with disk files,\
    \ C++ does not have to access much RAM because C++ reads data from your disk drive\
    \ and processes the data only parts at time.\n\n#### 7.2 Stream\n\n- Stream is\
    \ a general name given to flow of data. In C++, there are different types of streams.\
    \ Each stream is associated with a particular class, which contains member function\
    \ and definition for dealing with file. Lets have a look at the figure:\n\n```ios\n\
    istream ostream\nifstream^(iostream) ofstream\nfstream\n```\n\n- According to\
    \ the above hierarchy, the class iostream is derived from the two classes istream\
    \ and ostream and both istream and ostream are derived from ios. Similarly the\
    \ class fstream is derived from iostream. Generally two main header files are\
    \ used iostream.h and fstream.h. The classes used for input and output to the\
    \ video display and key board are declared in the header file iostream.h and the\
    \ classes used for disk file input output are declared in fstream.h.\n- Note that\
    \ when we include the header file fstream.h in our program then there is no need\
    \ to include iostream.h header file. Because all the classes which are in fstream.h\
    \ they are derived from classes which are in iostream.h therefore, we can use\
    \ all the functions of iostream class.\n\n#### 7.3: Operation With File\n\n- First\
    \ we will see how files are opened and closed. A file can be defined by following\
    \ class ifstream, ofstream, fstream, all these are defined in fstream.h header\
    \ file.\n- if a file object is declared by `ifstream` class, then that object\
    \ can be used for *reading* from a file.\n- if a file object is declared by `ofstream`\
    \ class, then that object can be used for *writing* onto a file.\n"
