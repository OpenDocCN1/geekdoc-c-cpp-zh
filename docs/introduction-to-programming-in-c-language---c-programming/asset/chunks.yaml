    \ <= 'Z'; ch++)\n{\nfileobj<<ch;\n}\nfileobj.seekg(8L,ios::beg);//skips eight\
    \ letters, points to I fileobj>>ch;\ncout<<\"\\nThe 8th character is : \"<<ch;\n\
    fileobj.seekg(16L,ios::beg);//skips 16 letters, points to Q fileobj>>ch;\ncout<<\"\
    \\nThe 16th letter is : \"<<ch;\nfileobj.close();\ngetch();\n}\n```\n\n- To point\
    \ to the end of a data file, you can use the `seekg()` function to position the\
    \ file pointer at the last byte. This statement positions the file pointer to\
    \ the last byte in the file. `Fileobj.seekg(0L,ios::end);`\n- This `seekg()` function\
    \ literally reads “move the file pointer 0 bytes from the end of the file.” The\
    \ file pointer now points to the end-of-file marker, but you can `seekg()` backwards\
    \ to find other data in the file.\n- The following program is supposed to read\
    \ “c:\\alph.txt” file backwards, printing each character as it skips back in the\
