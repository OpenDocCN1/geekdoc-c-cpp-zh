    \ If the outcome of `expression2` is non zero then `statements` is executed and\
    \ `expression3` is evaluated. Otherwise, the loop is terminated.\n\nIn most programs,\
    \ the “for loop” will be used for such expressions where `expression1` is `initialization`,\
    \ `expression2` is `condition` and `expression3` is either `increment` or `decrement`.\n\
    \nThe general format can be expressed as follows for the sake of clarity:\n\n\
