    \n以下代码预留了一个包含 10 个整数指针变量的数组：\n\n```cpp\nint *iptr[10]; //预留了一个包含 10 个整数指针的数组*\n\
    ```\n\n上述语句将在 RAM 中创建以下结构：\n\n**. . . . . . . . . .**\n\n`iptr[4] = &age; // 让\
    \ iptr[4] 指向 age 的地址。\n\n### 6.5 指针与数组\n\n数组的概念与指针紧密相关。事实上，数组的标识符等同于其第一个元素的地址，就像指针等同于它所指向的第一个元素的地址，因此实际上它们是同一件事。例如，假设有这两个声明：\n\
    \n```cpp\nint numbers [20]; int * p;\n```\n\n接下来的分配是有效的：\n\n```cpp\np = numbers;\n\
    ```\n\n此时 `p` 和 `numbers` 是等价的，它们具有相同的属性，唯一的区别是我们可以给指针 `p` 分配另一个值，而 `numbers`\
    \ 将始终指向它被定义时那 20 个 int 类型整数中的第一个。所以，与 `p`（它是一个普通的变量指针）不同，`numbers` 是一个常量指针（实际上是一个数组：一个常量指针）。因此，虽然之前的表达式是有效的，但下面的分配是非的：\n\
    \n```cpp\nnumbers = p;\n```\n\n因为 `numbers` 是一个数组（常量指针），不能给常量标识符赋值。\n\n**注意：**\
    \ 数组名仅仅是一个指针，仅此而已。数组名始终指向数组中存储的第一个元素。因此，我们可以有以下有效的 C++ 代码：\n\n```cpp\nint ara[5]\
    \ = {10,20,30,40,50};\ncout<< *(ara + 2); //打印 ara[2];\n```\n\n如果你记得数组名只是一个始终指向数组第一个元素的指针，那么\
    \ `*(ara+2)` 表达式完全并不模糊。`*(ara+2)` 取 `ara` 中存储的地址，在该地址上加 2，并对该位置进行解引用。\n\n考虑以下字符数组：\n\
    \n```cpp\nchar name[] = “C++ Programming”;\n```\n\n以下 `cout` 语句会产生什么输出？\n\n```cpp\n\
    cout<<name[0]; // ____C__\ncout<<*name; // _____C__\ncout<<*(name+3); //_________\n\
    cout<<*(name+0); //____C____\n```\n\n### 6.6 指针的优势\n\n你不能改变数组名的值，因为你不能改变常量。这解释了为什么你可以在程序执行期间给数组赋新值：例如：如果\
    \ `Cname` 是字符数组，那么：\n\n```cpp\nCname = “Football”; //无效的数组赋值;\n```\n\n与数组不同，你可以改变指针变量。通过改变指针，你可以让它们指向内存中不同的值。看以下代码：\n\
    \n```cpp\nvoid main() {\n    clrscr();\n    float v1 = 679.54; float v2 = 900.18;\
    \ float * p_v;\n    p_v =\n    cout<< “\\nthe first value is ”<<*p_v; p_v =\n\
    \    cout<< “\\nthe second value is ”<<*p_v; getch();\n}\n```\n\n你可以使用指针表示法并将指针像数组表示法一样使用。仔细学习以下程序。它展示了数组和指针表示法的内部机制。\n\
    \n```cpp\nvoid main()\n{\n    clrscr();\n    int ctr;\n    int iara[5] = {10,20,30,40,50};\n\
    \    int *iptr;\n    iptr = iara; // 让 iprt 指向数组的第一个元素。或者 iprt =* &*iara[0] \n\
    \    cout<< “using array subscripts:\\n”\n    cout<< “iara\\tiptr\\n”;\n    for(ctr=0;ctr<5;ctr++)\n\
    \    {\n        cout<<iara[ctr]<< “\\t”<< iptr[ctr]<< “\\n”;\n    }\n    cout<<\
    \ “\\nUsing pointer notation\\n”; \n    for(ctr=0;ctr<5;ctr++)\n    {\n      \
    \  cout<< *(iara+ctr) << “\\t” << *(iptr+ctr)<< “\\n”;\n    }\n    getch();\n\
    }\n```\n\n假设你想存储一个人的名字并打印它。与其使用数组，你你可以使用字符指针。以下程序正是这样做的。\n\n```cpp\nvoid main()\
    \ {\n    clrscr();\n    char *c = “Meseret Belete”;\n    cout<< “your name is\
    \ : ”<<c;\n}\n```\n\n假设你必须更改由字符指针指向的字符串，如果上述代码中的人的名字改为 Meseter Alemu：看以下代码：\n\n\
    ```cpp\nvoid main() {\n    char *c = “Meseret Belete”;\n    cout<< “youe name\
