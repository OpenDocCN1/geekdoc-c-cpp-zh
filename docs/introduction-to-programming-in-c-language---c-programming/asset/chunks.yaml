    4.1.1\. The Switch Statement**


    Another C++ statement that implem ents a selection control flow is the switch
    statement (*multiple-choice statement*).


    The switch statement provides a way of choosing between a set of alternatives
    based on the value of an expression. The general form of the switch statement
    is:


    The switch statement has four components:


    ***Switch


    Case


    Default


    Break***


    Where Default and Break are Optional


    The General Syntax might be:


    *switch(expression)


    {


    case constant1: statements;*


    ## **.


    . .**


    case constant n:


    statements;


    default:


    statements; }


    Expression is called the ***switch tag*** and the constants preceding each case
    are called the ***case labels***.


    The out put of “*expression*” should always be a constant value. First expression
    is evaluated, and the outcome, which is a constant value, will compared to each
    of the numeric constants in the case labels, in the order they appear, until a
    match is found.


    Note, however, that the evaluation of the ***switch tag*** with the ***case labels***
    is only for ***equality***


    The statements following the matching case are then executed. Note the plural:
    each case may be followed by zero or more statements (not just one statement).


    After one case is satisfied, execution continues until either a ***break*** statement
    is encountered or all intervening statements are executed, which means until the
    execution reaches the right French bracket of the switch statement.


    The final default case is optional and is exercised if none of the earlier cases
    provide a match. This means that, if the value of the “*expression*” is not equal
    to any of the case labels, then the statements under *default* will be executed.


    Now let us see the effect of including a break statement in the switch statement.


    Scenario One


    switch (N){


    **case 1: x=10;** case 2: x=20; **case 3: x=30;**


    }


    **Scenario Two**


    switch(N){


    case 1: x=10; break; case 2: x=20; break; case 3: x=30; break;


