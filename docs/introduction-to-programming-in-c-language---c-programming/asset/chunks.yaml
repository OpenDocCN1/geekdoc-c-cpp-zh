    would be valid is to assign a string of characters to an array of **char** using
    a method like this:


    **mystring[0] = ''H'';


    mystring[1] = ''e'';


    mystring[2] = ''l'';


    mystring[3] = ''l'';


    mystring[4] = ''o'';


    mystring[5] = ''\0'';**


    But as you may think, this does not seem to be a very practical method. Generally
    for assigning values to an array, and more specifically to a string of characters,
    a series of functions like **strcpy** are used. **strcpy** ( **str** ing **c**
    o **py** ) is defined in the ( string.h ) library and can be called the following
    way:


    **strcpy (** *string1* **,** *string2* **);**


    This does copy the content of *string2* into *string1* . *string2* can be either
    an array, a pointer, or a constant string , so the following line would be a valid
    way to assign the constant string **"Hello"** to **mystring** :


    ***strcpy (mystring, "Hello");***


    For example:


    *#include <iostream.h>


    #include <string.h>


    int main ()


    {


    char szMyName [20];


    strcpy (szMyName,"Abebe");


    cout << szMyName;


    return 0;


    }*


    Look how we have needed to include **<string.h>** header in order to be able to
    use function **strcpy.**


    Although we can always write a simple function like the following **setstring**
    with the same operating than cstring''s **strcpy** :


    *// setting value to string


    #include <iostream.h> #include<conio.h>*


    void namecopy(char dest[], char source[]) {


    int c = 0;


    while(source[c] != ‘\0’) {


    dest[c] = source[c];


    c++;


    }


    dest[c] = ‘\0’;


    cout<< “\n your name after copying : ”<<dest;


    }


    void main()


    {


    clrscr();


    char name[10],dest[10];


    cout<< “\n enter your name : ”; cin>>name;


    namecopy(dest,name);


    getch();


    }


    Another frequently used method to assign values to an array is by using directly
    the input stream ( **cin** ). In this case the value of the string is assigned
    by the user during program execution.


    When **cin** is used with strings of characters it is usually used with its **getline**
    method, that can be called following this prototype:


    **cin.getline ( char** *buffer* **[], int** *length* **, char** *delimiter* **=
    '' \n'');**'
