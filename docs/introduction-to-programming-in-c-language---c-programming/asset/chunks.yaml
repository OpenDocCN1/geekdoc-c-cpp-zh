    \    cout<<*ip<<endl;\n\n    ip++;\n\n    cout<<*ip<<endl;\n\n}\n```\n\n### 6.8\
    \ Pointer and String\n\nIf you declare a character table with 5 rows and 20 columns,\
    \ each row would contain the same number of characters. You can define the table\
    \ with the following statement.\n\n```cpp\nchar names[5][20] ={{“George”},{“Mesfin”},{“John”},{“Kim”},{“Barbara”}};\n\
    ``` The above statement will create the following table in memory:\n\nG e o r\
    \ g e \\0 M e s f i n \\0 J o h n \\0 K i m \\0 B a r b a r a \\0\n\nNotice that\
    \ much of the table waster space. Each row takes 20 characters, even though the\
    \ data in each row takes far fewer characters.\n\nTo fix the memory-wasting problem\
    \ of fully justified tables, you should declare a single-dimensional array of\
    \ character pointers. Each pointer points to a string in memory and the strings\
