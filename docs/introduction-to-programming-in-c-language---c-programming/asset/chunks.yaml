    \ the the the we that that we we we we we we we\n\n\n\n:\n\n``````\ncharcharchar\n\
    \ * *\n; *long*\n```\n\n* that\n that we \
    \ of00000000 is that it is added to0000000000000 if we write:\n\n```cpp\ncharchar++;horthort\n\
    \n\n```\n```00000000000000000000000000000000000 is that it is added to0000000000000000000\
