    \n```cpp\nindata.close();\n```\n\n上述 `close()` 语句将终止 `ifstream` 对象 `indata` 与文件名“c:\\\
    myfile.txt”之间的关系，从而释放系统所需的任何资源。\n\n### 7.4.1.2: 写入顺序文件\n\n- 最常用的文件 I/O 函数是 `get()`\
