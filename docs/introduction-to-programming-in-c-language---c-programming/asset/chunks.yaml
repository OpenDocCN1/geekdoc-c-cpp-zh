    多道程序涉及在计算机上“同时”运行多个作业。


    在 20 世纪 60 年代，许多小组开创了*分时操作系统*。分时是多道程序的一种特殊情况，用户通过终端访问计算机。在这里，计算机并不是并行运行用户的作业，而是共享处理器（CPU）时间。


    ## 1.4. 主要编程范式


    编程世界的重大里程碑是编程语言开发过程中观察到的不同类型的特征或属性。其中，以下内容值得关注：


    过程化、结构化和面向对象的编程范式。


    ### 1.4.1. 过程化编程


    - 过程化编程是一种基于`procedure call`（过程调用）概念的编程范式。在许多涉及中等复杂度或需要高度可维护性的情况下，过程化编程通常是简单的顺序编程更好的选择。

    - 可能的优点：能够在不同地方复用相同的代码（`function` 或 `procedure`），相比于一组 `GO TO` 或 `JUMP` 语句，更容易跟踪程序的执行流。


    ### 1.4.2. 结构化编程


    - 以较小的、独立的部分编写程序的过程。这使得更容易控制程序的开发，并设计和测试其各个组件部分。

    - 结构化程序由称为 `modules` 的单元构建，这些单元通常对应于单个 `procedures` 或 `functions`。

    - 可被视为过程化编程的*子集或子学科*。它最著名的特点是消除或减少对 `GO TO` 语句的依赖。


    ### 1.4.3. 面向对象编程


    - OOP 背后的思想是：计算机程序是由一系列*个体单元或对象*组成的，而不是传统观点认为的程序是计算机的一系列指令列表。

    - 面向对象编程被认为提供了更大的灵活性，使程序的更改变得更加容易。OOP 方法通常更容易开发和维护。


    ## 1.5. 问题的解决过程与软件工程


    ### 1.5.1. 软件工程


    - 软件工程是通过应用来自*计算机科学*、*项目管理*、*工程*、*应用领域*等领域的技术和实践来创建和维护软件应用的职业。

    - 在计算机科学和/或信息系统中解决问题的方法被称为*软件开发生命周期*。

    - 软件开发生命周期包含以下组件。


    ![](img/image00067.gif)![](img/image00068.gif)![](img/image00069.gif)![](img/image00070.gif)![](img/image00071.gif)![](img/image00072.gif)![](img/image00073.gif)


    *初步调查*


    ![](img/image00074.gif)![](img/image00075.gif)![](img/image00076.gif)![](img/image00077.gif)![](img/image00078.gif)![](img/image00073.gif)


    *分析*


    ![](img/image00079.gif)![](img/image00080.gif)![](img/image00081.gif)![](img/image00082.gif)![](img/image00083.gif)![](img/image00084.gif)![](img/image00085.gif)


    *设计*


    ![](img/image00086.gif)![](img/image00087.gif)![](img/image00088.gif)![](img/image00089.gif)![](img/image00090.gif)


    *实现*


    ![](img/image00091.gif)![](img/image00092.gif)![](img/image00093.gif)![](img/image00094.gif)![](img/image00095.gif)![](img/image00096.gif)![](img/image00097.gif)


    *测试与维护*


    ### 1.5.2. 解决问题


    - 解决问题是利用我们对问题领域的知识，并依靠我们选择和使用适当的问题策略、技术和工具的能力，将问题的描述转换为解决方案的过程。

    - 问题是一个阻碍组织完全实现其目的、目标和目标的*不利状况*。或者，问题也可以定义为*现状与期望状态之间的差距*，问题解决将试图填补这一差距。


    解决问题有两种方法：


    *自顶向下设计*：是一种基于基于概念的系统方法，该概念认为问题的结构应该决定解决方案的结构以及低级应该做什么。这种方法试图将一个大问题分解成更小、更易管理的问题，以缩小问题领域。


    *自底向上设计*：是相反的过程，首先构建最底层的组件，系统从底部向上构建，直到整个过程最终完成。


    ## 1.6. 基础程序开发技巧


    我们在任何编程语言中设计的程序需要具备：

    - *可靠性*：程序应该始终按照其预期的方式运行并处理所有类型的异常。

    - *可维护性*：程序的组织方式应使其在需要时可以对其进行修改和升级。

    - *可移植性*：能够将为某类型计算机编写的软件以最少的修改适配到另一种计算机。

    - *高效性*：程序应该优化地利用时间、空间和其他资源。


    ## 1.7. 算法设计与逻辑建模


    任何用*机器语言*之外的编写的程序都需要翻译成机器语言。执行此任务的指令集被称为*翻译器*。


    有不同类型的翻译软件，其中*编译器*和*解释器*对大多数程序员来说是最感兴趣的。


    ### 1.7.1. 使用流程图为程序逻辑


    可以使用许多技术和工具设计算法。设计算法的工具之一是使用流程图。流程图是解决问题所需步骤的图形化表示方式。


    流程图是过程的示意（*图示描述*）表示。


    基本的流程图符号有：


    - 终端点

    - 决策

    - 处理

    - 输入/输出

    - 流线

    - 页间连接器

    - 页内连接器


    例如：检查一个数字是正数还是负数。


    ```

    start

    Enter number

    Display^(num/2==0?) Display odd even

    end

    ```


    算法应该是：


    Images/image0098.gif)![](img/image0099.gif)![](img/image0100.gif)![](img/image0101.gif)![](img/image0102.gif)![](img/image0103.gif)


    *精确且无歧*


    Images/image0104.gif)![](img/image0105.gif)![](img/image0106.gif)![](img/image0107.gif)![](img/image0108.gif)![](img/image0109.gif)![](img/image0110.gif)![](img/image0111.gif)


    *简单*


    Images/image0067.gif)![](img/image0068.gif)![](img/image0069.gif)![](img/image0070.gif)![](img/image0071.gif)![](img/image0112.gif)![](img/image0073.gif)


    *正确*


    Images/image0113.gif)![](img/image0074.gif)![](img/image0075.gif)![](img/image0076.gif)![](img/image0077.gif)![](img/image0114.gif)![](img/image0073.gif)


    ## 1.8. 编译器与解释器


    *编译器*：编译器是一种计算机程序，它将编写在源代码中的语句（特定编程语言的集合）翻译成生成的目标代码（编程语言语句的翻译指令）。编译器将*整个*源代码翻译成可执行的机器码（也称为*目标代码*），并*输出到文件*供以后执行。例如
    C++、Pascal、FORTRAN 等。


