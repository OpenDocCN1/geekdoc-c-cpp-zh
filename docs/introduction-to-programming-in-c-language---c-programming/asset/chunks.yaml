    your data files are more compact.


    **-**The binary format is a *system-specific* file format. In other words, not
    all computers can read a binary file created on another computer.


    ### 7.4.2: Random Access File Concepts


    **-**Random access enables you to read or write any data in your disk file with
    out having to read and write every piece of data that precedes it.


    **-**Generally you read and write file records. A record to a file is analogues
    to a C++ structure. A record is a collection of one or more data values (called
    fields) that you read and write to disk. Generally you store data in the structures
    and write structures to disk.


    **-**When you read a record from disk, you generally read that record into a structure
    variable and process it with your program.


    **-**Most random access files are fixed-length records. Each record (a row in
    the file) takes the same amount of disk space.


    **-**With fixed length records, your computer can better calculate where on the
    disk the desired record is located.


    0 100 200 300 400 500 Byte


    offsets


    100 100 ……………… 100 100 Bytes bytes bytes bytes


    ### 7.2.2.1 Opening Random-Access Files


    **-**There is really no difference between sequential files and random files in
    C++. The difference between the files is not physical, but lies in the method
    that you use to access them and update them.


    **-**The ostream member function write outputs a fixed number of bytes, beginning
    at a specific location in memory, to the specified stream.


    **-**When the stream is associated with a file, function write writes the data
    at the location in specified by the “put” file position pointer.


    **-**The istream member function read inputs a fixed number of bytes from the
    specified stream into an area in memory beginning at the specified address.


    **-**When the stream is associated with a file, function read inputs bytes at
    the location in the file specified by the “get” file poison pointer.


    **-**Syntax of write: *fileobject.write((char*)* & *NameOfObject, sizeof(name
    of object))*


    **-**Function write expects data type const char* as its first argument. The second
    argument of write is an integer of type size specifying the number of bytes to
    be written.


    *Writing randomly to a random access file*


    **-**Here is an example that shows how to write a record to a random access file.


    #include<fstream.h> #include<conio.h> #include<stdlib.h> struct stud_info{


    int id;


    char name[20]; char fname[20]; float CGPA;


    }student;


    void main() {


    clrscr();


    char filename[15];


    ofstream outdata;


    cout<<"\nenter file name : "; cin>>filename;


    outdata.open(filename,ios::out); if(outdata.fail())


    {


    cerr<<"\nError opening "<<filename; getch();


    exit(1);


    }


    //stud_info student;


    //accept data here


    cout<<"\nEnter student id : ";


    cin>>student.id;


    cout<<"\nEnter student name : "; cin>>student.name;


    cout<<"\nEnter student father name : "; cin>>student.fname;


    cout<<"\nEnter student CGPA : "; cin>>student.CGPA;


    //now write to the file


    outdata.seekp(((student.id)-1) * sizeof(student)); outdata.write((char*) &student,
    sizeof(student)); outdata.close();


    cout<<"\nData has been saved";


    getch();


    }


    **-**The above code uses the combination of ostream function seekp and write to
    store data at exact locations in the file.


    **-**Function seekp sets the put file-position pointer to a specific position
    in the file, then the write outputs the data.'
