    At this point **p** and **numbers** are equivalent and they have the same properties,
    with the only difference that we could assign another value to the pointer **p**
    whereas **numbers** will always point to the first of the 20 integer numbers of
    type int with which it was defined. So, unlike **p,** that is an ordinary *variable
    pointer,* **numbers** is a *constant pointer* (indeed that is an Array: a constant
    pointer). Therefore, although the previous expression was valid, the following
    allocation is not:


    *numbers = p;*


    Because **numbers** is an array (constant pointer), and no values can be assigned
    to constant identifiers.


    **N.B:** An array name is just a pointer, nothing more. The array name always
    points to the first element stored in the array. There for , we can have the following
    valid C++ code:


    *int ara[5] = {10,20,30,40,50};


    cout<< *(ara + 2); //prints ara[2];*


    The expression *(ara+2) is not vague at all if you remember that an array


    name is just a pointer that always points to the array’s first element. *(ara+2)


    takes the address stored in ara, adds 2 to the address, and dereferences that


    location.


    Consider the following character array:


    char name[] = “C++ Programming”;


    What output do the following cout statements produce?


    *cout<<name[0]; // ____C__


    cout<<*name; // _____C__


    cout<<*(name+3); //_________


    cout<<*(name+0); //____C____*


    ### ***6.6\. Pointer Advantage***


    You can’t change the value of an array name, because you can’t change constants.
    This explains why you can’t assign an array a new value during a program’s execution:
    eg: if Cname is array of characters then:


    *Cname = “Football”; //invalid array assignment;*


    Unlike arrays, you can change a pointer variable. By changing pointers, you can
    make them point to different values in memory. Have a look at the following code:


    #...


    #...


    void main() {


    clrscr();


    float v1 = 679.54; float v2 = 900.18; float * p_v;


    p_v =


    cout<< “\nthe first value is ”<<*p_v; p_v =


    cout<< “\nthe second value is ”<<*p_v; getch();


    }


    You can use pointer notation and reference pointers as arrays with array notation.
    Study the following program carefully. It shows the inner workings of arrays and
    pointer notation.


    *void main()


    {


    clrscr();


    int ctr;


    int iara[5] = {10,20,30,40,50};


    int *iptr;


    iptr = iara; //makes iprt point to array’s first element. Or iprt =* &*iara[0]
    cout<< “using array subscripts:\n”


    cout<< “iara\tiptr\n”;


    for(ctr=0;ctr<5;ctr++)*


    {


    cout<<iara[ctr]<< “\t”<< iptr[ctr]<< “\n”;


    }


    cout<< “\nUsing pointer notation\n”; for(ctr=0;ctr<5;ctr++)


    {


    cout<< *(iara+ctr) << “\t” << *(iptr+ctr)<< “\n”;


    }


    getch();


    }


    Suppose that you want to store a persons name and print it. Rather than using
    arrays, you can use a character pointer. The following program does just that.


    *void main() {


    clrscr();


    char *c = “Meseret Belete”;


    cout<< “your name is : ”<<c;


    }*


    Suppose that you must change a string pointed to by a character pointer, if the
    persons name in the above code is changed to Meseter Alemu: look at the following
    code:


    *void main() {


    char *c = “Meseret Belete”;


    cout<< “youe name is : ”<<c;


    c = “Meseret Alemu”;


    cout<< “\nnew person name is : ”<<c;


    getch();


    }*


    If c were a character array, you could never assign it directly because an array
    name can’t be changed.


    ### ***6.7\. Pointer Arithmetic***


    To conduct arithmetical operations on pointers is a little different than to conduct
    them on other integer data types. To begin, only *addition* and *subtraction*
    operations are allowed to be conducted, the others make no sense in the world
    of pointers. But both addition and subtraction have a different behavior with
    pointers according to the size of the data type to which they point to.


    When we saw the different data types that exist, we saw that some occupy more
    or less space than others in the memory. For example, in the case of integer numbers,
    *char* occupies 1 byte, *short* occupies 2 bytes and *long* occupies 4.


    Let''s suppose that we have 3 pointers:


    *char *mychar; short *myshort; long *mylong;*


    And that we know that they point to memory locations **1000** , **2000** and **3000**
    respectively. So if we write:


    *mychar++; myshort++; mylong++;*


    mychar , as you may expect, would contain the value 1001 . Nevertheless, myshort
    would contain the value 2002 , and mylong would contain 3004 . The reason is that
    when adding 1 to a pointer we are making it to point to the following element
    of the same type with which it has been defined, and therefore the size in *bytes*
    of the *type* pointed is added to the pointer.


    ![](Images/image00162.gif)


    This is applicable both when adding and subtracting any number to a pointer. It
    is important to warn you that both increase ( ++ ) and decrease ( -- ) operators
    have a greater priority than the reference operator asterisk ( * ), therefore
    the following expressions may lead to confusion:


    **p++;


    *p++ = *q++;*


    The first one is equivalent to *(p++) and what it does is to increase **p** (the
    address where it points to - not the value that contains). The second, because
    both increase operators ( ++ ) are after the expressions to be evaluated and not
    before, first the value of *q is assigned to *p and then they are both q and p
    increased by one. It is equivalent to:


    **p = *q;


    p++;


    q++;*


    Now let us have a look at a code that shows increments through an integer array:


    *void main()*


    {


    int iara[] = {10,20,30,40,50}; int * ip = iara;


    cout<<*ip<<endl;


    ip++;


    cout<<*ip<<endl;


    ip++;


    cout<<*ip<<endl;


    ip++;


    cout<<*ip<<endl;


    }


    ### **6.8\. Pointer and String**


    If you declare a character table with 5 rows and 20 columns, each row would contain
    the same number of characters. You can define the table with the following statement.


    *char names[5][20] ={{“George”},{“Mesfin”},{“John”},{“Kim”},{“Barbara”}};* The
    above statement will create the following table in memory:


    G e o r g e \0 M e s f i n \0 J o h n \0


    K i m \0


    B a r b a r a \0


    Notice that much of the table is waster space. Each row takes 20 characters, even
    though the data in each row takes far fewer characters.


    To fix the memory-wasting problem of fully justified tables, you should declare
    a single-dimensional array of character pointers. Each pointer points to a string
    in memory and the strings do not have to be the same length. Here is the definition
    for such an array:


    *char *name [5] = {{“George”},{“Mesfin”},{“John”}, {“Kim”},{“Barbara”}};*


    This array is a single-dimension array. The asterisk before names makes this array
    an array of pointers. Each string takes only as much memory as is needed by the
    string and its terminating zero. At this time, we will have this structure in
    memory:


    To print the first string, we should use: *cout<<*names; //prints George.*


    To print the second use:


    *cout<< *(names+1); //prints Michael*'
