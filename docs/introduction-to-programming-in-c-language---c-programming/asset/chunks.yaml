    \ `argv` 是一个字符类型指针数组，指向命令行参数。`argc` 被称为参数计数（argument counter），`argv` 被称为参数向量（argument\
    \ vector）。\n- `C:\\> student A B`。`argc` 的值为 3（student、A 和 B），`argv` 将是一个包含三个字符串指针的数组，如下所示：\n\
