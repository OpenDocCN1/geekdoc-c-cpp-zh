  trans: "\n`expression1`：是一个或多个语句，它们将在循环开始前只执行一次。\n\n`Expression2`：是决定继续执行循环中的指令还是停止的部分。`Expression2`\
    \ 在每次循环继续之前都会被求值。`expression2` 的输出应该是 0（继续循环）或非 0（停止循环），分别表示假和真输出。\n\n`Expression3`：是一个或多个语句，它们将在每次迭代后执行。\n\
    \n因此，首先求值 `expression1`，然后每次执行循环时都会求值 `expression2`。如果 `expression2` 的结果非零，则执行\
    \ `statements` 并求值 `expression3`。否则，循环终止。\n\n在大多数程序中，“for 循环”将用于此类表达式，其中 `expression1`\
    \ 是 `initialization`（初始化），`expression2` 是 `condition`（条件），而 `expression3` 是 `increment`（递增）或\
    \ `decrement`（递减）。\n\n为了清晰起见，通用格式可以表示如下：\n\n###for(initialization ; condition\
    \ ; increase/decrease) statement;`\n\n![](img/image00150.gif)![](img/image00151.gif)![](img/image00152.gif)![](img/image00153.gif)![](img/image00154.gif)\n\
    \nfor 循环的执行步骤：\n\n1. 执行初始化。（只执行一次）\n2. 检查条件，如果为真则继续循环，否则循环结束并跳过语句。\n3. 执行语句。\n\
    4. 最后，执行递增或递减字段中指定的任何内容，然后回到回到步骤 2。\n\n例如，猜猜以下代码的输出：`int main()`\n\n```cpp\nint\
    \ main()\n{\n  for(int i=10;i>0;i--)\n  {\n    cout<<n<<“,”;\n  }\n  cout<< “FIRE!”;\n\
    \  getch();\n  return 0;\n}\n```\n\n虽然不建议，但 `expression1`、`expression2` 和 `expression3`\
    \ 是可选的或可以被忽略。这意味着它们可以取空语句（NULL statement）。\n\n但将 `expression2` 置为空意味着循环不会终止。在这种情况下，可以在\
    \ `for` 循环内部包含一个“if”语句，该语句将测试条件并使用 `break` 语句跳出循环。\n\n虽然将三个表达式中的一个或多个为空，分号不能被忽略。\n\
    \n例如：\n\n`for (;n<10;)` // 如果我们既不需要初始化也不需要递增/递减 `for(;n<10;n++)` // 如果不需要初始化。\n\
    \n`for ( ; )` // 是无限循环，除非循环内部有 if 语句。\n\n已声明 `expression1` 和 `expression3` 可以是一个或多个语句。复合语句之间应该用逗号分隔。这意味着可选地，使用逗号运算符（（`），我们可以在“for”循环包含的两个字段中的任何一个中指定多个指令。\n\
    \n例如 `for(n=0,i=100;n!=i; n++,i--)`\n\n```cpp\n{\n  //任何内容\n}\n```\n\n在上面的示例中，`n=0`\
    \ 和 `i=100` 将是 `expression1` 的部分，并在循环开始前只执行一次。此外，`n++` 和 `i—` 将是 `expression3`\
    \ 的部分，并在每次循环/迭代后执行。\n\n例：1\n\n```cpp\n// 以下 for 语句累加 0 到 n 之间的数字\nint Sum=0;\n\
    for(int i=0; i<=n;i++)\n  Sum=Sum+i;\n```\n\n例：2\n\n```cpp\n// 以下 for 语句累加 0 到\
    \ n 之间的偶数\nint Sum=0;\nfor(int i=0; i<=n;)\n{\n  Sum=Sum+i; i+=2;\n}\n```\n\n\
    例：3\n\n```cpp\n// 以下 for 语句累加 0 到 n 之间的偶数\n// 在这里所有三个表达式都为空。\nint Sum=0;\nint\
    \ i=0;\nfor( ; ; )\n{\n  If(i<=n) break;\n  else\n  {\n    Sum=Sum+i;\n    i++;\n\
    \  }\n}\n```\n\n在上面的示例中，初始化位于循环开始之前的顶部，条件放在执行指令之前的 if 语句中，递增位于循环中要执行语句的之后。\n\n\
    **注意：** 尽管在“for”循环中可以将所有三个表达式置为空，但不建议将条件置为空语句。\n\n### 4.2.2. while 语句\n\nwhile\
    \ 语句（称为 while 循环）提供了一种只要条件成立/真就重复语句或块的方法。\n\nwhile 循环的通用形式是：\n\n###while(expression)\
    \ statements;`\n\n首先求值 `expression`（称为 `循环条件`）。如果结果非零，则执行语句（称为 `循环体`）并重复整个过程。否则，循环终止。\n\
    \n假设我们想要计算从 1 到某个整数值 `n` 的所有数字的和。这可以表示为：\n\n例：1// 累加 0 到任何给定数字 `n` 之间的数字\n\n```cpp\n\
    i=1;\nsum = 0;\nwhile(i <= n)\n  sum += i++;\n```\n\n例：2// 累加 0 到 100 `number`\n\
    \n```cpp\nnumber=1;\nsum=0;\nwhile(number)\n```\n"
- fmt: "\nAn initialization of the loop control variable An expression to test if\
    \ the proper number of repetitions has been completed\n\nAn update of the loop\
    \ control variable to be executed with each iteration of the body\n\n#### 4.2.5.2.\
    \ Event-controlled loops\n\nRepeat a statement or block until a condition within\
    \ the loop body changes that causes the repetition to stop.\n\n### Types of Event-Controlled\
    \ Loops\n\n1. **Sentinel controlled:**\nKeep processing data until a special value\
    \ that is not a possible data value is entered to indicate that processing should\
    \ stop.\n\n2. **End-of-file controlled:**\nKeep processing data as long as there\
    \ is more data in the file.\n\n3. **Flag controlled:**\nKeep processing data until\
    \ the value of a flag changes in the loop body\n\n## 4.3. The continue and break\
    \ statements\n\n### 4.3.1. The continue statement\n\nThe `continue` statement\
    \ terminates the current iteration of a loop and instead jumps to the next iteration.\n\
    \nIt is an error to use the `continue` statement outside a loop.\n\nIn `while`\
    \ and `do while` loops, the next iteration commences from the loop condition.\n\
    \nIn a “for” loop, the next iteration commences from the loop’s third expression.\n\
    \nE.g.:\n\n```cpp\nfor(int n=10;n>0;n--)\n{\n    if(n==5)\n        continue; //causes\
    \ a jump to n—\n    cout<<n<<,”;\n}\n```\n\nWhen the `continue` statement appears\
    \ inside nested loops, it applies to the loop immediately enclosing it, and not\
    \ to the outer loops. For example, in the following set of nested loops, the `continue`\
    \ statement applies to the “for” loop, and not to the “while” loop.\n\nE.g.:\n\
    \n```cpp\nwhile(more)\n{\n    for(i=0;i<n;i++)\n    { \n        cin>>num; \n \
    \       if(num<0)\n            continue; //causes a jump to : i++ \n    }\n}\n\
    ```\n\n### 4.3.2. The break statement\n\nA `break` statement may appear inside\
    \ a loop (`while`, `do`, or `for`) or a switch statement. It causes a jump out\
    \ of these constructs, and hence terminates them.\n\nLike the `continue` statement,\
    \ a `break` statement only applies to the “loop” or “switch” immediately enclosing\
    \ it. It is an error to use the `break` statement outside a loop or a switch statement.\n\
    \nE.g.:\n\n```cpp\nfor(n=10;n>0;n--)\n{ \n    cout<<n<<,”;\n    if(n = = 3)\n\
    \    { \n        cout<< “count down aborted!!”;\n        break;\n    }\n}\n```\n\
