    \n```cpp\nchar *name [5] = {{“George”},{“Mesfin”},{“John”},“Kim”},{“Barbara”}};\n\
    ```\n\nThis array is a single-dimension array. The asterisk before names makes\
    \ this array an array of pointers. Each string takes only as much memory as is\
