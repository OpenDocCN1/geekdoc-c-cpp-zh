    Please enter a date (dd mm yyyy) : 29 2 1899\n\nInvalid day of month 29\n\nIf\
    \ the year is a leap year, then February will have total of 29 days. Otherwise,\
    \ it will have 28 days. If the year is not a century year and is evenly divisible\
    \ by 4, then the year is a leap year. If the year is a century year (years whose\
    \ last digits are 00) and is evenly divisible by 400, then the year is a leap\
    \ year.\n\n### **Chapter Four Functions 4\\. What is a function?**\n\nA function\
    \ provides a convenient way of packaging a computational recipe, so that it can\
    \ be used as often as required.\n\nTherefore, a function is a block of code designed\
    \ to tackle a specific problem.\n\n### ***4.1\\. Function Basics***\n\nOne of\
    \ the best ways to tackle a problem is to start with the overall goal, then divide\
    \ this goal into several smaller tasks. You should never lose sight of the overall\
    \ goal, but think also of how individual pieces can fit together to accomplish\
    \ such a goal.\n\nIf your program does a lot, break it into several functions.\
    \ Each function should do only one primary task.\n\n### ***4.2\\. Summarized function\
    \ basics.***\n\nC++ functions generally adhere to the following rules.\n\n1\\\
    . Every function must have a ***name***.\n\n2\\. Function names are made up and\
    \ assigned by the programmer following the same rules that apply to naming variables.\
    \ They can contain up to 32 characters, they must begin with a letter, and they\
    \ can consist of letters, numbers, and the underscore (_) character.\n\n3\\. All\
    \ function names have ***one set of parenthesis*** immediately following them.\
    \ This helps you (and C++ compiler) differentiate them from variables.\n\n4\\\
    . The body of each function, starting immediately after parenthesis of the function\
    \ name, must be enclosed by braces.\n\n### *4.3\\. Declaring, defining and calling\
    \ functions*"
