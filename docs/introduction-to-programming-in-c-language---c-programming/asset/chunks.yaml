    {\ncerr<<\"\\nError opening \"<<filename; getch();\nexit(1);\n}\nstud_info student;\n\
    cout<<\"\\nEnter the id no of the student : \"; int sid;\ncin>>sid;\nindata.seekg((sid-1)\
