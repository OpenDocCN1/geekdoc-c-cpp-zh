    ### 2.5.1.5. 变量的作用域


    变量的作用域是程序中可以访问变量的边界或块。该边界或块通过左右大括号来标识。


    在 C++ 中，我们可以在源代码的任何地方声明变量。但无论写在哪里，我们都应该在使用变量之前声明它。


    **全局变量**：是在代码的任何地方、任何函数内部都可以被引用/访问的变量，前提是它必须先被声明。在包含语句之后、在任何函数之前定义的变量是全局变量。**局部变量**：局部变量的作用域仅限于声明它的代码级或块内。


    在下面的示例中，整数数据类型 `num1` 随处可见，而 `z` 只能在 `add` 函数中访问，`num2` 只能在 `main` 函数中访问。这意味着
    `cout<<z;` 或任何涉及 `z` 的语句只在 `add` 函数中有效。


    例如：


    ```cpp

    #include<iostream.h>


    int num1;


    int add( int x, int y)


    {


    int z;


    ….


    }


    void main()


    {


    unsigned short age;


    float num2;

    cout<<”\n Enter your age: …

    }

    ```


    在 C++ 中，局部变量的作用域由声明它的块决定。


    如果它在函数内部声明，它将是一个具有函数作用域的变量。如果它在循环中声明，它的作用域仅在循环内，以此此类推。


    ### 2.5.1.6. 定义数据类型（自定义数据类型）


    `typedef` 关键字用于程序员定义数据类型，因为编程语言的用户就是程序员。


    如果有很多变量需要这种类型的声明，在程序中多次编写 `unsigned short int` 是非常困难的。C++ 允许你使用 `typedef` 关键字（意为类型定义）用一个别名来替代该短语。


    例如：


    ```cpp

    #include<iostream.h>


    typedef unsigned short int USHORT; void main()


    {


    USHORT width = 9;


    …


    }

    ```


    在第二行之后，每当编译器遇到 `USHORT` 单词时，它都会将其替换为 `unsigned short int`。


    ### 2.5.1.7. 有符号整数的回溢


    有符号整数与无符号整数的区别在于其值的一半是负数。当程序用完正数时，程序会进入最大的负数，然后向回计数到零。


    例如：`32767 + 1 -32769-8 0`


    ### 2.5.1.8. 无符号整数的回溢


    当无符号整数达到其最大值时，它会回绕并重新开始。


    例如：`65535 + 1 0 65535`


    ### 2.5.1.9. 字符


    字符变量（类型为 `char`）的大小通常为一个字节，足以容纳 256 个不同的值。`char` 可以表示为一个较小的数字（0 - 255）。


    C++ 中的字符表示为`单引号`内的任何值。


    例如：‘x’、‘A’、‘5’、‘a’ 等。


    当编译器找到这些值（字符）时，它会将该值转换回对应的 ASCII 值。例如，‘a’在 ASCII 中的值为 97。


    ### 2.5.1.10. 特殊打印字符


    在 C++ 中，有一些用于格式化的特殊字符。它们是：


    `\n` 换行

    `\t` 制表符

    `\b` 退格

    `\"` 双引号

    `\''` 单引号

    `\?` 问号

    `\\` 反斜杠


    ### 2.5.2. 常量


    常量是具有**固定值**的表达式。


    与变量一样，常量是计算机内存中的数据存储位置。但与变量不同，常量的内容在声明后不能更改。


    常量在程序创建它们时必须初始化，程序员之后不能为常量分配新值。C++ 提供两种类型的常量：字面常量和符号常量。**字面常量**：是在需要需要的地方直接输入程序中的值。


    例如：`int num = 43;`


    在该语句中，`43` 是一个字面常量：


    **符号常量**：是用名称表示的常量，类似于变量。但与变量不同，它的值在初始化后不能更改。


    例如：


    `Int studentPerClass =15;`


    `students = classes * studentPerClass;`


    `studentPerClass` 是一个值为 15 的符号常量。


    而 15 是直接输入程序中的字面常量。在 C++ 中，我们有两种方法声明符号常量：使用 `#define` 和 `const` 关键字。


    #### 2.5.2.1. 使用 #define 定义常量


    `#define` 指令执行简单的文本替换。定义指令只能定义整数常量，例如：`#define studentPerClass 15`


    在我们的示例中，预处理器每次看到 `studentPerClass` 单词时，都会将 15 插入文本中。


    #### 2.5.2.2. 使用 const 关键字定义常量


    在这里，常量具有类型，编译器可以确保常量被正确使用。例如：`const unsigned short studentPerClass = 15;`


    ### 2.5.3. 枚举常量


    使用单个整数来定义多个常量。


    传统的做法如下：


    `#define SPRING 0`

    `#define SUMMER 1`

    `#define FALL 2`


    另一种使用 enum 的方法是：


    `enum { SPRING, SUMMER, WINTER };`


    你也可以为它们赋值：


    `enum {RED=100, BLUE=500};`


    其中 RED 的值为 100，BLUE 的值为 500。


    ### 2.6. 分配内存


    计算机提供 RAM 用于存储执行代码以及程序处理的数据。内存可以被视为连续的位，每个位都可以存储一个二进制数字。通常，内存被分为 8 位一组，称为字节。字节按顺序寻址。因此，每个字节都可以通过其地址唯一标识。


    字节地址

