  trans: "\n3. 要分配的内存位置总数，或每个下标的最大值。即数组中的元素个数。\n\n因此，声明的通用语法如下：\n\n```cpp\nDataTypename\
    \ arrayname [array size];\n```\n\n表达式 `array size`（即元素个数）必须是一个常量，例如 `10` 或在数组声明之前声明的符号常量，或者像\
    \ `10*sizeof (int)` 这样的常量表达式，这些值在编译阶段进行时是已知的。\n\n**注意**：`array size` 不能是一个在程序运行时设置其值的变量。\n\
    \n因此，声明一个大小为 10 且名为 `num` 的整数数组如下：\n\n```cpp\nint num [10];\n```\n\n这意味着将预留 10\
    \ 个连续的两个字节的内存位置，并命名为 `num`。\n\n这意味着我们可以存储 10 个 `int` 类型的值，而无需声明 10 个具有不同标识符的独立变量。相反，使用\
    \ `array`（数组），我们可以使用唯一的标识符存储 10 个相同类型（例如 `int`）的不同值。\n\n### 5.3 数组的初始化\n\n在声明局部作用域的数组（函数内部）时，如果我们不指定，则数组变量将不会被初始化，因此在向其存储某些值之前，其内容是不确定的。\n\
    \n如果我们声明一个全局数组（在任何函数外部），其内容将被初始化，所有元素都将填充为零。因此，如果在全局作用域中声明：\n\n```cpp\nint day\
    \ [5];\n```\n\n`day` 的每个元素初始都将被设置为 `0`：\n\n![](img/image00155.gif)\n\n此外，当我们声明一个数组时，我们还可以使用花括号\
    \ `{ }` 为其每一个元素分配初始值。例如：\n\n```cpp\nint day [5] = { 16, 2, 77, 40, 12071 };\n\
    ```\n\n上述声明将创建一个创建一个如下所示的数组：\n\n![](img/image00156.gif)\n\n在花括号 `{ }` 内初始化的元素个数必须等于或少于我们在方括号\
    \ `[]` 中声明的数组元素长度。如果提供的初始化项数量较少，剩余部分将用零填充。例如，在 `day` 数组的示例中，我们声明它有 5 个元素，而在花括号\
    \ `{ }` 的初始化列表中我们设置了 5 个不同的值，每个元素一个。如果我们忽略上述初始化中的最后一个初始值（`12071`），最后一个数组元素将自动取\
    \ `0`。\n\n由于这可以被视为无用的重复，C++ 允许留空方括号 `[]`，此时将根据初始化括号内项的个数来设置数组的大小。\n\n```cpp\n\
    int day [] = { 1, 2, 7, 4, 12,9 };\n```\n\n编译器将统计初始化项的个数（结果为 `6`），并将数组 `day` 的大小设置为\
    \ `6`（即：`day[6]`）。\n\n你只能在定义数组时使用初始化形式。之后无法再次使用它，且无法直接将一个数组赋值给另一个数组。例如：\n\n```cpp\n\
    int arr [] = {16, 2, 77, 40, 12071}; \nint ar [4];\nar[]={1,2,3,4}; // 不允许\narr=ar;\
    \ // 不允许\n```\n\n注意：在初始化数组时，我们可以提供比数组元素更少的值。例如 `int a [10] = {10, 2, 3};`，在这种情况下，编译器会将剩余元素设置为零。\n\
    \n### 5.4 访问和处理数组元素\n\n在程序中数组可见的任何点，我们都可以单独访问它的任意一个元素进行读取或修改，就像处理普通变量一样。要访问单个元素，需要使用索引或下标。其格式如下：\n\
    \n`name [ index ]`\n\n在 c++ 中，第一个元素的索引为 `0`，最后一个元素的索引是数组大小减 1（即 `arraysize-1`）。因此，根据上面的声明，`day[0]`\
    \ 是第一个元素，`day[4]` 是最后一个元素。\n\n延续上文的例子，假设 `day` 有 5 个元素且每个元素类型均为 `int`，我们用来引用每个元素的名称如下：\n\
    \n![](img/image00157.gif)\n\n例如，要在数组变量 `day` 的第三个元素中存储值 `75`，合适的语句是：\n\n```cpp\n\
    day[2] = 75; // 因为第三个元素位于索引 2\n```\n\n例如，为了将数组变量 `day` 的第三个元素的值传递给变量 `a`，我们可以写：\n\
    \n```cpp\na = day[2];\n```\n\n因此，从效果上看，表达式 `day[2]` 就像任何 `int` 类型的变量，具有相同的属性。因此，数组声明允许我们通过单次声明创建许多相同类型的变量，并且可以使用索引来标识单个元素。\n\
    \n注意，`day` 的第三个元素指定为 `day[2]`，因为第一个是 `day[0]`，第二个是 `day[1]`，因此第三个是 `day[2]`。\n\
    \n### 5.5 数组作为参数\n\n在某些时刻，我们可能需要将数组作为参数传递给函数。在 C++ 中，无法通过值传递将整个内存块作为参数（即使它是按数组方式组织的），但允许传递其地址，这在效果上几乎相同且效率更高。\n\
    \n为了允许数组作为参数，我们在声明函数时唯一需要做的是指定数组包含的基`type`、一个标识符和一对空方括号 `[]`。例如，以下函数：\n\n```cpp\n\
    void procedure (int arg[])\n```\n\n接受一个类型为“`int` 数组”且名为 `arg` 的参数。为了向该函数传递一个声明如下的数组：\n\
    \n```cpp\nint myarray [40];\n```\n\n只需要如下调用即可：\n\n```cpp\nprocedure (myarray);\n\
    ```\n\n这里有一个完整的示例：\n\n```cpp\n#include <iostream.h>\n#include <conio.h>\n\nvoid\
    \ printarray (int arg[], int length) {\n    for (int n=0; n<length; n++) cout\
    \ << arg[n] << \" \";\n    cout << \"\\n\";\n}\n\nvoid mult(int arg[], int length)\
    \ {\n    for (int n=0; n<length; n++) arg[n]=2*arg[n];\n}\n\nvoid main () {\n\
    \    int firstarray[] = {5, 10, 15};\n    int secondarray[] = {2, 4, 6, 8, 10};\n\
    \n    printarray (firstarray,3);\n    printarray (secondarray,5);\n\n    mult(firstarray,3);\n\
    \n    cout<<”first array after being doubled is\\n\";\n    printarray (firstarray,3);\n\
    \n    getch();\n}\n```\n"
- fmt: "\nAs you can see, the first argument (`int arg[]`) admits any array of type\
    \ `int`, whatever its length is, for that reason we have included a second parameter\
    \ that informs the function the length of each array that we pass to it as the\
    \ first parameter so that the `for` loop that prints out the array can have the\
    \ information about the size we are interested about. The function `mult` doubles\
    \ the value of each element and the `firstarray` is passed to it. After that the\
    \ display function is called. The output is modified showing that arrays are passed\
    \ by reference.\n\nTo pass an array by value, pass each element to the function.\n\
    \n### 5.6 Strings of Characters: What are Strings?\n\nIn all programs and concepts\
    \ we have seen so far, we have used only numerical variables, used to express\
    \ numbers exclusively. But in addition to numerical variables there also exist\
    \ strings of characters that allow us to represent successive characters, like\
    \ words, sentences, names, texts, etc. Until now we have only used them as constants,\
    \ but we have never considered variables able to contain them.\n\nIn C++ there\
    \ is no specific elementary variable type to store string of characters. In order\
    \ to fulfill this feature we can use arrays of type `char`, which are successions\
    \ of `char` elements. Remember that this data type (`char*`) is the one used to\
    \ store a single character, for that reason arrays of them are generally used\
    \ to make strings of single characters.\n\nFor example, the following array (or\
    \ string of characters) can store a string up to 20 characters long. You may imagine\
    \ it thus:\n\n```cpp\nchar name [20];\nname\n```\n\nThis maximum size of 20 characters\
    \ is not required to be always fully used. For example, `name` could store at\
    \ some moment in a program either the string of characters \"Hello\" or the string\
    \ \"studying C++”. Therefore, since the array of characters can store shorter\
    \ strings than its total length, there has been reached a convention to end the\
    \ valid content of a string with a null character, whose constant can be written\
    \ as `'\\0`.\n\nWe could represent `name` (an array of 20 elements of type `char`)\
    \ storing the strings of characters \"Hello\" and \"Studying C++\" in the following\
    \ way:\n\n```\nH e l l 0 \\0\nS t u d y i n g C + + \\0\n```\n\nNotice how after\
    \ the valid content it is included a null character (`'\\0'`) in order to indicate\
    \ the end of string. The empty cells (elements) represent indeterminate values.\n\
    \n### 5.7 Initialization of Strings\n\nBecause strings of characters are ordinary\
    \ arrays they fulfill same rules as any array. For example, if we want to initialize\
    \ a string of characters with predetermined values we can do it in a similar way\
    \ to any other array:\n\n```cpp\nchar mystring[] = { 'H', 'e', 'l', 'l', 'o',\
    \ '\\0' };\n```\n\nIn this case we would have declared a string of characters\
    \ (array) of 6 elements of type `char` initialized with the characters that compose\
    \ `Hello` plus a null character `'\\0'`.\n\nNevertheless, string of characters\
    \ have an additional way to initialize its values: using constant strings.\n\n\
    In the expressions we have used in examples of previous chapters there have already\
    \ appeared several times constants that represented entire strings of characters.\
    \ These are specified enclosed between double quotes (“ ”), for example:\n\nEg:\
    \ \"the result is: \"\n\nis a constant string that we have probably used in some\
    \ occasion.\n\nUnlike single quotes (`'`) which allow to specify single character\
    \ constants, double quotes (`\"`) are constants that specify a succession of characters.\
    \ *These strings enclosed between double quotes have always a null character (`'\\\
    0'`) automatically appended at the end*.\n\nTherefore we could initialize the\
    \ string `mystring` with values by any of these two ways:\n\n```cpp\nchar mystring\
    \ [] = { 'H', 'e', 'l', 'l', 'o', '\\0' };\nchar mystring [] = \"Hello\";\n```\n\
    \nIn both cases the Array or string of characters `mystring` is declared with\
    \ a size of 6 characters (elements of type `char`): the 5 characters that compose\
    \ `Hello` plus a final null character (`'\\0'`) which specifies the end of the\
    \ string and that, in the second case, when using double quotes (`\"`) it is automatically\
    \ appended.\n\nBefore going further, you should note that the assignation of multiple\
    \ constants like double-quoted constants (`\"`) to arrays are only valid when\
    \ initializing the array, that is, at the moment when declared.\n\nThe following\
    \ expressions within a code are not valid for arrays:\n\n```cpp\nmystring=\"Hello\"\
    ;\nmystring[] = \"Hello\";\nmystring = { 'H', 'e', 'l', 'l', 'o', '\\0' };\n```\n\
    \nSo remember: We can \"assign\" a multiple constant to an Array only at the moment\
    \ of initializing it. The reason will be more comprehensible when you know a bit\
    \ more about pointers, since then it will be clarified that an array is simply\
    \ a constant pointer pointing to an allocated block of memory. And because of\
    \ this constant feature, the array itself cannot be assigned any value, but we\
    \ can assign values to each of the elements of the array.\n\nAt the moment of\
    \ initializing an Array it is a special case, since it is not an assignation,\
    \ although the same equal sign (`=`) is used. Anyway, have always present the\
    \ rule previously underlined.\n\n#### Assigning Values to Strings\n\nJust like\
    \ any other variables, array of character can store values using assignment operators.\
    \ But the following is not allowed:\n\n```cpp\nmystring=\"Hello\";\n```\n\nThis\
    \ is allowed only during initialization. Therefore, since the *lvalue* of an assignation\
    \ can only be an element of an array and not the entire array, what would be valid\
    \ is to assign a string of characters to an array of `char` using a method like\
    \ this:\n\n```cpp\nmystring[0] = 'H';\nmystring[1] = 'e';\nmystring[2] = 'l';\n\
    mystring[3] = 'l';\nmystring[4] = 'o';\nmystring[5] = '\\0';\n```\n\nBut as you\
    \ may think, this does not seem to be a very practical method. Generally for assigning\
    \ values to an array, and more specifically to a string of characters, a series\
    \ of functions like `strcpy` are used. `strcpy` (`str` `ing` `c` `o` `py`) is\
    \ defined in the `string.h` library and can be called the following way:\n\n`strcpy\
    \ (string1, string2);`\n\nThis does copy the content of `string2` into `string1`.\
    \ `string2` can be either an array, a pointer, or a constant string, so the following\
    \ line would be a valid way to assign the constant string \"Hello\" to `mystring`:\n\
    \n```cpp\nstrcpy (mystring, \"Hello\");\n```\n\nFor example:\n\n```cpp\n#include\
    \ <iostream.h>\n#include <string.h>\n\nint main ()\n{\n    char szMyName [20];\n\
    \    strcpy (szMyName,\"Abebe\");\n    cout << szMyName;\n    return 0;\n}\n```\n\
    \nLook how we have needed to include `<string.h>` header in order to be able to\
    \ use function `strcpy`.\n\nAlthough we can always write a simple function like\
    \ the following `setstring` with the same operating than cstring's `strcpy`:\n\
    \n```cpp\n// setting value to string\n#include <iostream.h>\n#include<conio.h>\n\
    \nvoid namecopy(char dest[], char source[]) {\n    int c = 0;\n    while(source[c]\
    \ != '\\0') {\n        dest[c] = source[c];\n        c++;\n    }\n    dest[c]\
    \ = '\\0';\n    cout<< \"\\n your name after copying :\"<<dest;\n}\n\nvoid main()\n\
    {\n    clrscr();\n    char name[10],dest[10];\n    cout<< \"\\n enter your name\
    \ : \"; cin>>name;\n    namecopy(dest,name);\n    getch();\n}\n```\n\nAnother\
    \ frequently used method to assign values to an array is by using directly the\
    \ input stream (`cin`). In this case the value of the string is assigned by the\
    \ user during program execution.\n\nWhen `cin` is used with strings of characters\
    \ it is usually used with its `getline` method, that can be called following this\
    \ prototype:\n\n`cin.getline (char buffer[], int length, char delimiter = '\\\
    n');`\n"
