    \n- 你的程序可以以顺序（sequential manner）方式或随机（random manner）方式访问文件。文件的访问模式决定了如何从文件中读取、写入、修改、添加和删除数据。\n\
    \n- 顺序文件必须按照文件写入的相同顺序进行访问。这比比磁带：你按照音乐录音的顺序播放音乐。\n\n- 与顺序文件不同，你可以按照任何所需的顺序对文件进行随机访问。将随机访问文件中的数据想象成类似于光盘（CD）上的歌曲：你可以直接跳转到任何想要播放的歌曲，而无需播放或快进（快进）其他歌曲。\n\
    \n### 7.4.1: 顺序文件概念\n\n- 你可以对顺序磁盘文件执行三种操作。你可以`create`（创建）磁盘文件、向磁盘文件`add`（添加）以及从磁盘文件`read`（读取）内容。\n\
    \n### 7.4.1.1: 打开和关闭顺序文件\n\n- 当你打开一个磁盘文件时，你只需要告知 C++ 文件名以及你想对它做什么。C++ 和你的操作系统协同工作，以确保磁盘已就绪，并会在你的文件目录中为文件名创建一个条目（如果你正在创建一个文件的话）。当你关闭文件时，C++\
    \ 会将任何剩余数据写入文件，从程序中释放该文件，并更新文件目录以反映文件的新大小。\n\n- 你可以使用 C++ 中的两种方法之一来打开文件：\n   \
    \ - 使用 `Constructor`（构造函数）\n    - 使用 `open function`（open 函数）\n\n- 下面的 C++ 语句将创建一个名为\
    \ `fout` 的 `ofstream` 类对象，且该对象将与文件名“hello.txt”关联。\n\n```cpp\nofstream fout (“hello.txt”);\n\
    ```\n\n该语句使用了构造函数方法。\n\n- 下面的 C++ 语句将创建一个名为 `fout` 的 `ofstream` 类对象，且该对象将与文件名“hello.txt”关联。\n\
    \n```cpp\nofstream fout;\nfout.open(“hello.txt”);\n```\n\n- 如果你以写入模式（out access\
    \ mode）打开文件，C++ 会创建该文件。如果已存在同名文件，`C++ overwrite` 将覆盖旧文件且不发出警告。在打开文件时必须小心不要覆盖你想要的现有数据。\n\
    \n- 如果在打开文件期间发生错误，C++ 不会创建有效的文件指针（文件对象）。相反，C++ 会创建一个等于零的文件指针（对象）。例如，如果你打开一个文件进行输出但使用了无效的磁盘名，C++\
    \ 将无法打开该文件，因此使文件对象等于零。\n\n- 你也可以在 C++ 中创建文件时确定文件访问模式。如果你想使用 `open function` 打开文件，语法如下：\n\
    \n```cpp\nfileobject.open(filename,accessmode);\n```\n\n- filename 是一个包含你计算机上有效文件名的字符串。\n\
    - Accessmode 是要在文件上执行的目标操作，必须是下表中的值之一。\n\n| 模式 | 描述 |\n| :--- | :--- |\n| app\
    \ | 以追加模式打开文件 |\n| ate | 打开文件时移动到文件末尾 |\n| in | 以读取模式打开文件 |\n| out | 以写入模式打开文件\
    \ |\n| binary | 以二进制模式打开文件 |\n\n- 在对文件进行操作之前，你应该始终检查文件是否成功打开。你使用 `fail()` 函数来完成此任务：\n\
    \n- 让我们来看例子：\n\n```cpp\nifstream indata;\nindata.open(“c:\\\\myfile.txt”,ios::in);\
    \ \nif(indata.fail())\n{\n    // 此处写错误描述\n}\n```\n\n- 在情况下，如果 `C:\\` 目录中没有名为 `myfile.txt`\
