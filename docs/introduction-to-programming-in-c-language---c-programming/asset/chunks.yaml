    \ is equivalent to the address of the first element that it points to, so in fact\
    \ they are the same thing. For example, supposing these two declarations:\n\n\
    ```cpp\nint numbers [20]; int * p;\n```\n\nthe following allocation would be valid:\n\
    \n```cpp\np = numbers;\n```\n\nAt this point `p` and `numbers` are equivalent\
    \ and they have the same properties, with the only difference that we could assign\
    \ another value to the pointer `p` whereas `numbers` will always point to the\
    \ first of the 20 integer numbers of type int with which it was defined. So, unlike\
    \ `p`, that is an ordinary variable pointer, `numbers` is a constant pointer (indeed\
    \ that is an Array: a constant pointer). Therefore, although the previous expression\
    \ was valid, the following allocation is not:\n\n```cpp\nnumbers = p;\n```\n\n\
    Because `numbers` is an array (constant pointer), and no values can be assigned\
    \ to constant identifiers.\n\n**N.B:** An array name is just a pointer, nothing\
    \ more. The array name always points to the first element stored in the array.\
    \ There for , we can have the following valid C++ code:\n\n```cpp\nint ara[5]\
    \ = {10,20,30,40,50};\ncout<< *(ara + 2); //prints ara[2];\n```\n\nThe expression\
    \ `*(ara+2)` is not vague at all if you remember that an array name is just a\
    \ pointer that always points to the array’s first element. `*(ara+2)` takes the\
    \ address stored in `ara`, adds 2 to the address, and dereferences that location.\n\
    \nConsider the following character array:\n\n```cpp\nchar name[] = “C++ Programming”;\n\
    ```\n\nWhat output do the following `cout` statements produce?\n\n```cpp\ncout<<name[0];\
