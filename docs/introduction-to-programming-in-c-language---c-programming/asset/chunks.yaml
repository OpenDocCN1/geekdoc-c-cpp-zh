    it become available for future requests of dynamic memory. For this exists the
    operator **delete** , whose form is:


    ***delete*** pointer ***;**


    or


    **delete []*** pointer ***;***


    • The first expression should be used to delete memory allocated for a single
    element, and the second one for memory allocated for multiple elements (arrays).


    • In most compilers both expressions are equivalent and can be used without distinction,
    although indeed they are two different operators and so must be considered for
    operator overloading.


    • In the following simple example, a program that memorizes numbers, does not
    have a limited amount of numbers that can be introduced, thanks to the concept
    and power of pointer that we request to the system as much space as it is necessary
    to store all the numbers that the user wishes to introduce.


    #include <iostream.h> #include <stdlib.h> #include<conio.h> int main ()


    {


    char input [100];


    int i,n;


    long * num;// total = 0;


    cout << "How many numbers do you want to type in? "; cin.getline (input,100);


    i=atoi (input);


    num= new long[i];


    if (num == NULL)


    {


    cout<<"\nno enough memory!"; getch();


    exit (1);


    }


    for (n=0; n<i; n++)


    {


    cout << "Enter number: "; cin.getline (input,100); num[n]=atol (input);


    }


    cout << "You have entered: "; for (n=0; n<i; n++)


    cout << num[n] << ", "; delete[] num;


    getch();


    return 0;


    }


    • **NULL** is a constant value defined in C++ libraries specially designed to
    indicate null pointers. In case that this constant is not defined you can do it
    yourself by defining it to 0:


    ### **Chapter Seven File Operations (File I/O)


    7\. Introduction**


    **-**The data created by the user and assigned to variables with an assignment
    statement is sufficient for some applications. With large volume of data most
    real-world applications use a better way of storing that data. For this, disk
    files offer the solution.


    **-**When working with disk files, C++ does not have to access much RAM because
    C++ reads data from your disk drive and processes the data only parts at a time.


    ### 7.2 Stream


    **-**Stream is a general name given to *flow of data*. In C++, there are different
    types of streams. Each stream is associated with a particular class, which contains
    member function and definition for dealing with file. Lets have a look at the
    figure:


    ios


    istream ostream


    ifstream^(iostream) ofstream


    fstream


    **-**According to the above hierarchy, the class iostream is derived from the
    two classes’ istream and ostream and both istream and ostream are derived from
    ios. Similarly the class fstream is derived from iostream. Generally two main
    header files are used iostream.h and fstream.h. The classes used for input and
    output to the video display and key board are declared in the header file iostream.h
    and the classes used for disk file input output are declared in fstream.h.


    **-**Note that when we include the header file fstream.h in our program then there
    is no need to include iostream.h header file. Because all the classes which are
    in fstream.h they are derived from classes which are in iostream.h therefore,
    we can use all the functions of iostream class.


    ### 7.3: Operation With File


    **-**First we will see how files are opened and closed. A file can be defined
    by following class ifstream, ofstream, fstream, all these are defined in fstream.h
    header file.


    • if a file object is declared by *ifstream* class, then that object can be used
    for *reading* from a file.


    • if a file object is declared by *ofstream* class, then that object can be used
    for *writing* onto a file.'
