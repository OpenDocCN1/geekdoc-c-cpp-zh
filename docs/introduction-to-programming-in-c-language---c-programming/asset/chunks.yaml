  trans: "\n7. 编写一个程序，接受用户输入的十个不同的整数，并在升序排序后显示这些数字。\n\n8. 编写一个程序，将你六个朋友的年龄存储在一个数组中。按随机顺序分配这些年龄。在屏幕上从低到高打印这些年龄。\n\
    \n9. 修改第 8 题的程序，按降序顺序打印年龄。\n\n10. 编写一个 C++ 程序，计算 20 个学生的字母等级。该程序应接受学生输入的期中成绩和期末成绩。使用适当的有效性控制机制防止错误输入。\n\
    \n11. 编写一个 C++ 程序，其中包含两个函数 `toBinary` 和 `toDecimal`。该程序应显示一个菜单，提示用户输入选择。如果用户选择\
    \ `toBinary`，则函数应接受一个十进制数字并显示其等效二进制表示。如果用户选择 `toDecimal`，则执行反操作。\n\n12. 开发一个 C++\
    \ 程序，接受用户输入的单词，然后检查该单词是否为回文。（注意：如果一个单词从左到右和从右到左读都是那样的，则它是一个回文）。\n\n13. 编写一个 C++\
    \ 程序，接受用户输入的单词，然后显示反转后的单词。\n\n14. 开发一个 C++ 程序，接受一个人的姓名，然后统计该人名字中有多少个元音。\n\n15.\
    \ 修改第 14 题的题目，将人名中的元音字符替换为 `*`。\n\n16. 编写一个 C++ 程序，读取一个三位数，并使用上述数字生成所有可能的数字排列。例如\
    \ `n = 123`，则排列为 – 123, 213, 312, 132, 231, 321。\n\n17. 编写一个程序，读取一系列行，直到你输入 `#`\
    \ 为止。\n\n18. 编写一个程序，读取两个矩阵，然后打印这两个矩阵相加的矩阵。\n\n19. 编写一个程序，读取两个矩阵并在可能的情况下进行乘法。\n\
    \n20. 编写一个程序，读取一个 3 x 2 矩阵，然后计算每行的和并存储在一个一维数组中。\n\n# 第六章 指针 6. 引言\n\n我们已经看到变量是可以通过标识符访问的内存单元。但这些变量存储在计算机内存的具体位置。对于我们的程序来说，计算机内存只是连续的\
    \ 1 *byte* 单元（数据的最小尺寸），每个单元都有唯一的地址。指针是一个存储另一个变量地址的变量。指针变量和普通变量之间的唯一区别在于它们所持的数据。C++\
    \ 中有两个指针运算符：\n\n- `&` 取地址运算符\n- `*` 解引用运算符\n\n每当你看到 `&` 与指针一起使用时，想想“地址的”这个词。`&`\
    \ 运算符总是产生其紧随操作对象的内存地址。`*` 运算符在与指针配合时，要么声明一个指针，要么解引用指针的值。解引用运算符可以字面翻译为“指针所指向的值”。\n\
    \n**指针**简单来说就是内存中对象的地址。通常，对象可以通过两种方式访问：直接通过其符号名称访问，或通过指针间接访问。通过指针访问对象的行为被称为指针的**解引用**（dereferencing）。指针变量被定义为指向特定类型的对象，这样当指针被解引用时，就能获得一个类型对象。\n\
    \n当我们声明一个变量时，它必须存储在这一系列单元（内存）的具体位置中。我们通常不决定变量放置在哪里——幸运的是，这是由编译器和操作系统在运行时自动完成的，但一旦操作系统分配了地址，在某些情况下，我们可能想知道变量存储在哪里。这可以通过在变量标识符前加上取地址符号（`&`）来实现，它的字面意思是“……的地址”。例如：\n\
    \n```\nptr = &var;\n```\n\n这将变量 `var` 的地址赋值给变量 `ptr`，因为在变量名 `var` 前加上取地址字符（`&`）时，我们不再是在讨论变量的内容，而是它在内存中的地址。\n\
    \n我们假设 `var` 被放置在内存地址 `1776`，并且写了如下代码：\n\n```cpp\nvar=25;\nx=var;\nptr = &var;\n\
    ```\n\n结果将如下所示：\n\n![](img/image00161.gif)\n\n我们为 `x` 分配了变量 `var` 的内容，就像我们在之前的章节中多次做的那样，但为\
    \ `ptr` 分配了操作系统存储 `var` 值的内存地址，我们想象那个地址是 `1776`（可以是任何地址）。这是因为在分配 `ptr` 时，我们在 `var`\
    \ 前加上取地址字符（`&`）。存储另一个变量地址的变量（如上一个例子中的 `ptr`）就是我们说的**指针**。\n\n## 6.1 声明指针\n\n在堆中为指针变量预留内存位置。语法为：\n\
    \n```cpp\ntype * pointer_name;\n```\n\n要声明一个名为 `p_age` 的指针变量，执行以下操作：\n\n```cpp\n\
    int * p_age;\n```\n\n每当解引用运算符 `*` 出现在变量声明中时，被声明的变量总是指针变量。\n\n## 6.2 给指针赋值\n\n\
    `p_age` 是一个整数指针。指针的类型非常重要。`p_age` 只能指向整数值，不能指向浮点型或其他类型。要给 `p_age` 分配变量的地址，执行以下操作：\n\
    \n```cpp\nint age = 26;\nint * p_age;\np_age = &age;\n```\n\n或者\n\n```cpp\nint\
    \ age = 26;\nint * p_age = &age;\n```\n\n两种方式都是可行的。如果你想打印 `age` 的值，执行以下操作：\n\n\
    ```cpp\nint age = 26;\nint * p_age = &age;\ncout<<age; //打印 age 的值\n```\n\n或者使用指针，可以这样做：\n\
    \n```cpp\nint age = 26;\nint * p_age = &age;\ncout<<*p_age; //打印 age 的值\n```\n\
    \n解引用运算符产生一个告诉指针指向哪里的值。`age`。在不使用 `*` 时（即 `cout<<p_age`），`cout` 语句打印的是地址（age 的地址）。使用\
    \ `*`，`cout` 输出的是该地址的值。\n\n可以通过以下语句给 `age` 分配一个新的值：\n\n```cpp\nage = 13;//给变量\
    \ age 赋新值\n```\n\n```cpp\n*p_age = 13 //将 13 赋予 p_age 指向的内存\n```\n\n注意：`*` 在指针变量前出现在两个地方：声明指针变量以及解引用指针变量（以找到它指向的数据）。\n\
    \n- 下面的程序你应该仔细研究。它展示的指针以及指针运算符 `&` 和 `*` 信息比几页文本还要多。\n\n```cpp\nvoid main() {\n\
    \    int num = 123; //一个普通的整数变量\n    int *p_num; //声明一个整数指针\n    cout<< “num is\
    \ ”<<num<<endl;\n    cout<< “the address of num is ”<<&*num<<endl;\n    p_num\
    \ = &num;//将 num 的地址放入 p_num\n    cout<< “*p_num is ”<<*p_num<<endl;//打印 num 的值\n\
    \    cout<< “p_num is ”<<p_num<<endl;//打印 p_num 的值\n    getch();\n}\n```\n\n##\
    \ 6.3 空指针\n\n注意我们不能将浮点类型变量的地址赋值给整数指针变量，同样，整数变量的地址不能存储在浮点或字符指针中。\n\n```cpp\nfloat\
    \ y;\nint x;\nint *ip;\nfloat *fp;\n\nip = &y; //非法语句\nfp = &x; //非法语句\n```\n\n\
    这意味着，只有当变量类型和指针指向类型相同时，我们才能将变量的地址赋值给指针变量。如果两者类型不同，则我们不能将变量的地址赋值给指针变量，但在 C++ 中通过将指针变量声明为空指针也可以实现：\n\
    \n```cpp\nvoid *p;\n```\n\n让我们看一个例子：\n\n```cpp\nvoid *p;\nint x;\nfloat y;\np\
    \ = &x; //有效赋值\np = &y; //有效赋值\n```\n"
