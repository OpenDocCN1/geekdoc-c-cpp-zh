    ### **Arrays of Structures**


    Arrays of structures are good for storing a complete employee file, inventory
    file, or any other set of data that fits in the structure format.


    Consider the following structure declaration:


    struct Company


    {


    int employees; int registers;


    double sales;


    }store[1000];


    In one quick declaration, this code creates 1,000 ***store*** structures with
    the definition of the ***Company*** structure, each one containing three members.
    NB. Be sure that your computer does not run out of memory when you create a large
    number of structures. Arrays of structures quickly consume valuable information.


    You can also define the array of structures after the declaration of the structure.


    struct Company {


    int employees;


    int registers;


    double sales;


    }; // no structure variables defined yet


    #include<iostream.h>


    …


    void main()


    {


    struct Company store[1000]; //the variable **store** is array of the structure
    Company


    …


    }


    ### **Referencing the array structure**


    The ***dot operator (.)*** works the same way for structure array element as it
    does for regular variables. If the number of employees for the fifth store (store[4])
    increased by three, you could update the structure variable like this:


    *store[4].employees += 3;*


    Unlike in the case of arrays, where the whole content of an array could not be
    copied to another one using a simple statement, in structures, you can assign
    complete structures to one another by using array notation.


    To assign all the members of the 20^(th) store to the 45^(th) store, you would
    do this:


    *store[44] = store[19];//copies all members from 20^(th) store to 45^(th)*


    Here is a complete C++ code that shows you how to use array of structures, and
    how to pass and return structures to functions.


