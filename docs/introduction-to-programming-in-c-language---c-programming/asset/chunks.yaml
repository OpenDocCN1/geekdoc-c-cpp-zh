    ### 4.6. 作用域运算符


    局部作用域会覆盖全局作用域，拥有与全局变量同名的局部变量会导致全局变量在局部作用域内无法访问。


    例如 `int num1;`


    ```cpp

    void fun1(int num1) {

    //…

    }

    ```


    全局变量 `num1` 在 `fun1()` 内部无法访问，因为它被局部参数 `num1` 覆盖了。


    这个问题可以通过作用域运算符 `::` 来解决，它接受一个全局实体作为参数。


    ```cpp

    int num1 = 2;


    void fun1(int num1)

    {

    //…

    num1=33;

    cout<<num1; // 输出将是 33

    cout<<::num1; // 输出将是 2，即全局变量，如果(**::**num1 != 0) //指向全局 num1

    //…

    }

    ```


    ### 4.7. 自动变量与静态变量


    `automatic`（自动）和 `static`（静态）术语描述了函数返回到调用过程时局部变量所发生的情况。默认情况下，所有局部变量都是 `automatic`
    的，这意味着它们在函数结束时会被擦除。你可以通过在变量定义前加上 `auto` 术语将变量指定为 `automatic`。


    例如。`main()` 左大括号后的两个语句声明了自动局部变量：


    ```cpp

    main()

    {

    int i;

    auto float x;

    …

    }

    ```


    `automatic` 的相反是 `static` 变量。所有全局变量都是 `static` 的，并且如所述，所有 `static` 变量都会保留它们的值。因此，如果一个局部变量是
    `static` 的，它在函数结束时也会保留其值——以防该函数被再次调用。要将变量声明为 `static`，在定义时于变量前面加上 `static` 关键字。以下代码段定义了三个变量
    `i`、`j`、`k`。变量 `i` 是 `automatic`，但 `j` 和 `k` 是 `static`。`static` 变量可以在函数内部声明并初始化，但初始化将在第一次调用时执行一次。如果没有显式声明
    `static` 变量，它们将被自动声明为 0。


    例如。`void my_fun()

    {

    static int num;

    static int count = 2;

    count=count*5;

    num=num+4;

    }*


    在上面的示例中：

    * 在第一次调用函数 `my_fun()` 时，`static` 变量 `count` 将初始化为 2，并在第三行乘以 5 得到值 10。在第二次调用同一个函数时，`count`
    的值为 10，并将再次乘以 5。

    * 在第一次调用函数 `my_fun()` 时，`static` 变量 `num` 将初始化为 0（因为它没有被显式初始化），并在第四行对其加 4 得到值
    4。在第二次调用同一个函数时，`num` 的值为 4，并将再次对其加 4。


    注意。如果局部变量是 `static` 的，它们的值在函数被再次调用时仍保持不变。


    ### 4.8. 内联函数 (Inline functions)


    假设一个程序经常需要找到整数数量的绝对值。对于一个由 `n` 表示的值，可以表示为：


    `(n > 0 ? n : -n)`


    然而，与其在程序的许多地方重复复制此表达式，不如将其定义为一个函数：


    ```cpp

    int Abs(int n)

    {

    return n > 0 ? n : -n;

    }

    ```


    函数版本具有许多优点：

    * 它使程序变得更具可读性。

    * 它是可重用的。


    然而，函数版本的缺点是，频繁使用会导致由于函数调用开销而产生巨大的性能损失。可以通过将 `Abs` 定义为 `inline`（内联）函数来避免这种开销。


    ```cpp

    inline int Abs(int n)

    { Return n > 0 ? n : -n;

    }

    ```


    这种的效果是，当调用 `Abs` 时，编译器不再生成调用 `Abs` 的代码，而是展开程序体并用 `Abs` 的体替换调用。虽然执行的本质上是相同的计算，但没有涉及函数调用，因此不会分配栈帧。


    `"inline"` 关键字仅仅是给编译器或开发环境的一个提示。并不是每个函数都可以内联的。导致有时不进行内联的一些典型原因包括：

    * 函数调用了自身，即是递归的

    * 函数包含循环如 `for(;;)` 或 `while()`

    * 函数体过大


    另一个内联的良好原因是，你有时可以通过内联正确的函数来加快程序速度。编译器不会在每次被调用时都调用函数，而是用函数体的副本替换函数调用。如果是一个被频繁调用的小函数，这有时可以提高速度。


    内联函数的大部分优势来自于避免了调用实际函数的开销。这种开销包括保存寄存器、设置栈帧等。但对于大型函数，这种开销就不那么重要了。


    关于内联函数，编译器可以自由决定一个函数是否符合内联函数的条件。如果发现 `inline` 函数具有较大的代码块（量），它将不会被视为内联函数，而是像其他普通函数一样。


    那么，为什么不内联所有内容呢？因为编译器每次调用函数时都会复制整个函数体，如果这是一个很大的函数，内联会增加可执行文件的大小。


    ### 4.9. 默认参数与函数重载


    C++ 有两种 C 语言具备的能力：默认参数和函数重载。


    #### 4.9.1. 默认参数


    默认参数消了为所有参数指定参数的负担。例如。你可能传递给函数一个存储在字符数组中的消息，并且 `函数` 显示某个特定值。对于这种函数的原型可以是：


    ```cpp

    void pr_msg(char[])

    ```


    因此，为了让 `pr_msg()` 显示“Turn on”，你可以像这样调用它：


    ```cpp

    pr_msg("Turn on")

    ```


    当你编写更多程序时，你会发现你通常想使用同一条消息，你可以设置 `pr_msg()` 的原型，使其默认为“Turn on”。


    对于具有多个默认参数的函数，带有默认值的参数应该定义在函数定义的右侧。


    例如。让我们使用默认参数开发程序。


    ```cpp

    #include…..


    void Add_Display(int x=10, int y=20, int z=30)

    {

    cout<< (x+y+z);

    }


    void Mult_Dispaly (int x, int y=70)

    {

    cout<< (x*y);

    }


    void main() {

    int a=40, b=50, c=60;

    Add_Display(a,b,c); //将打印 150 (即 40+50+60)

    Add_Display(a,b); //将打印 120 (即 40+50+30)

    Add_Display(a); //将打印 90 (即 40+20+30)

    Add_Display(); //将打印 60 (即 10+20+30)

    Mult_Display(a,b) //将打印 2000 (40*50)

    Mult_Display(a) //将打印 2800 (40*70)


    //Mult_Display() 是无效的，因为 x 没有默认值 getch();

    }

    ```


    以下函数定义是的，因为 z 是一个没有默认值的参数，写在带有默认值的 y 参数之后应该位于函数声明的右侧：


    ```cpp

    void Mult_Dispaly (int x, int y=70, int z)

    {

    cout<< (x*y*z);

    }

    ```


    因此，以下函数定义是正确的：


    ```cpp

    void Mult_Dispaly (int x, int z, int y=70)

    {

    cout<< (x*y*z);

    }

    ```


