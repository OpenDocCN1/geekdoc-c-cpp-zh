    6) Find the average of two numbers given by the user.


    7) Find the average, maximum, minimum, and sum of three numbers given by the user.


    8) Find the area of a circle where the radius is provided by the user.


    9) Swap the contents of two variables using a third variable.


    10) Swap the content of two variables without using a third variable.


    11) Read an integer value from the keyboard and display a message indicating if
    this number is odd or even.


    12) Read 10 integers from the keyboard in the range 0 - 100, and count how many
    of them are larger than 50, and display this result.


    13) Take an integer from the user and display the factorial of that number


    ### **Chapter Two Basics of C++**


    **2.1\. The parts of a C++ Program.**


    To understand the basic parts of a simple program in C++, lets have a look at
    the following code:


    #include<iostream.h> #include<conio.h> void main()


    {


    cout<<”\n Hello World!”; getch();


    }


    Any C++ program file should be saved with file name extension “ ***.CPP*** ”


    Type the program directly into the editor, and save the file as hello.cpp, compile
    it and then run it. It will print the words Hello World! on the computer screen.


    The first character is the #. This character is a signal to the preprocessor.
    Each time you start your compiler, the preprocessor runs through the program and
    looks for the pound (#) symbols and act on those lines before the compiler runs.


    The ***include*** instruction is a preprocessor instruction that directs the compiler
    to include a copy of the file specified in the angle brackets in the source code.


    If the path of the file is not specified, the preprocessor looks for the file
    under ***c:\tc\include\*** folder or in ***include*** folder of the location where
    the editor is stored.


    The effects of line 1, i.e. include<iostream.h> is to include the file iostream.h
    into the program as if the programmer had actually typed it.


    When the program starts, main() is called automatically. Every C++ program has
    a main() function.


    The return value type for main() here is void, which means main function will
    not return a value to the caller (which is the operating system).


    The main function can be made to return a value to the operating system.


    The Left French brace “{“signals the beginning of the main function body and the
    corresponding Right French Brace “}” signals the end of the main function body.
    Every Left French Brace needs to have a corresponding Right French Brace.


    The lines we find between the braces are statements or said to be the body of
    the function.


    A statement is a computation step which may produce a value or interact with input
    and output streams.


    ***The end of a single statement ends with semicolon (;).***


    The statement in the above example causes the sting “Hello World!” to be sent
    to the “cout” stream which will display it on the computer screen.


    **2.2\. A brief look at cout and cin


    *Cout*** is an object used for printing data to the screen.


    To print a value to the screen, write the word ***cout***, followed by the insertion
    operator also called output redirection operator (<<) and the object to be printed
    on the screen.


    Syntax: ***Cout***<<Object;


    The object at the right hand side can be:


    • A literal string: “Hello World”


    • A variable: a place holder in memory


    ***Cin*** is an object used for taking input from the keyboard. To take input
    from the keyboard, write the word ***cin***, followed by the input redirection
    operator (>>) and the object name to hold the input value.


    Syntax: Cin>>Object


    Cin will take value from the keyboard and store it in the memory. Thus the cin
    statement needs a variable which is a reserved memory place holder.


    Both << and >> return their right operand as their result, enabling multiple input
    or multiple output operations to be combined into one statement. The following
    example will illustrate how multiple input and output can be performed:


    E.g.:


    ***Cin>>var1>>var2>>var3;***


    Here three different values will be entered for the three variables. The input
    should be separated by a space, tan or newline for each variable.


    ***Cout<<var1<<”, “<<var2<<” and “<<var3;***


    Here the values of the three variables will be printed where there is a “,” (comma)
    between the first and the second variables and the “and” word between the second
    and the third.


    **2.3\. Putting Comments on C++ programs**


    A comment is a piece of descriptive text which explains some aspect of a program.'
