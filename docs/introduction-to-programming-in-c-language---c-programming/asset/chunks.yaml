  trans: "\n结构（Structure）是将一个或多个变量类型分组定义的集合，可以通过单个名称（组名）和成员名称（成员名）来引用它。你可以将结构视为一个单一变量，也可以初始化、读取和更改结构的各个部分（构成该结构的各个变量）。\n\
    \n结构中的每个元素（称为成员）可以是不同的数据类型。结构的通用语法（General Syntax）如下：\n\n```cpp\nStruct [structure\
    \ tag]\n{\n    成员定义; 成员定义; …\n    成员定义;\n}[或多个结构变量];\n```\n\n让我们来看一个示例。\n\n例如：结构标签\
    \ `struct Inventory`\n\n```cpp\nstruct Inventory \n{\n    char description[15];\n\
    \    char part_no[6];\n    int quantity; // 结构成员 float cost; \n}; // 所有结构都以分号结束\n\
    ```\n\n另一个示例可能是：\n\n```cpp\nstruct Student\n{\n    char ID[8];\n    char FName[15];\n\
    \    char LName[15];\n    char Sex;\n    int age;\n    float CGPA;\n};\n```\n\n\
    上述“Student”结构旨在存储带有所有相关细节的学生记录。\n\n在定义结构之后，人们可以使用结构标签声明结构变量。如果我们需要两个具有上述结构属性的变量，那么声明如下：\n\
    \n```cpp\nstruct Inventory inv1,inv2; //或\nstruct Student Stud1,stud2,Stud3;\n\
    ```\n\n结构标签（Structure tag）不是变量名。与引用数组作为变量的数组名不同，结构标签仅仅是结构格式的标记。结构标签 `Inventory`\
    \ 告诉 C++，名为 `Inventory` 的标签看起来像两个字符数组，后面紧跟一个整数和一个浮点数变量。结构标签实际上是一个由你（程序员）定义的全新数据类型。\n\
    \n### 引用结构的成员\n\n要引用结构中的成员，我们需要使用点运算符（`.`）。访问结构变量成员的通用语法为：\n\n`VarName .Member`\n\
    \n其中 `VarName` 是结构变量的名称，`Member` 是结构中成员的变量名。\n\n**例：**\n\n对于上述学生结构：\n\n```cpp\n\
    struct Student Stud; // 声明 Stud 具有 Student 结构的属性\nstrcpy(Stud.FName,”Abebe”);\
    \ // 将 Abebe 赋值为名字\nStud.CGPA=3.21; // 将 3.21 赋值为 Abebe 的 CGPA 值\nsout<<Stud.FName;\
    \ // 显示名字\nsout<<Stud.CGPA; // 显示 Abebe 的 CGPA\n```\n\n### 初始化结构数据\n\n你可以在声明结构时初始化成员，也可以在程序体中初始化结构。这是一个完整的程序。\n\
    \n### .\n\n```cpp\nstruct cd_collection\n{\n    char title[25];\n    char artist[20];\n\
    \    int num_songs;\n    float price;\n    char date_purchased[9];\n} cd1 = {\"\
    Red Moon Men\",\"Sams and the Sneeds\", 12, 11.95,\"08/13/93\"};\n\ncout<<\"\\\
    nhere is the info about cd1\"<<endl; cout<<cd1.title<<endl;\ncout<<cd1.artist<<endl;\n\
    cout<<cd1.num_songs<<endl;\ncout<<cd1.price<<endl;\ncout<<cd1.date_purchased<<endl;\n\
    ```\n\n### .\n\n初始化结构的更好方法是使用点运算符（`.）。点运算符是在程序体中初始化结构变量各个成员的方法之一。点运算符的语法是：\n\n\
    `structureVariableName.memberName`\n\n这里有一个示例：\n\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\n#include<string.h>\n\nvoid main()\n{\n    clrscr();\n    struct\
    \ cd_collection{\n        char title[25];\n        char artist[20];\n        int\
    \ num_songs;\n        float price;\n        char date_purchased[9];\n    }cd1;\n\
    \    // 在这里初始化成员\n    strcpy(cd1.title,\"Red Moon Men\");\n    strcpy(cd1.artist,\"\
    Sams\");\n    cd1.num_songs= 12;\n    cd1.price = 11.95f;\n    strcpy(cd1.date_purchased,\"\
