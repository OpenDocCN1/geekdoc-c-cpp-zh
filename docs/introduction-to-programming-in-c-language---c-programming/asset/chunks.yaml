    \ the instructions in the loop or to stop. `Expression2` will be evaluated each\
    \ time before the loop continues. The output of `expression2` should be either\
    \ zero (to proceed with the loop) or none zero (to stop the loop) to represent\
    \ false and true output respectively.\n\n`Expression3`: is one or more statements\
    \ that will be executed after each iteration.\n\nThus, first `expression1` is\
    \ evaluated and then each time the loop is executed, `expression2` is evaluated.\
    \ If the outcome of `expression2` is non zero then `statements` is executed and\
    \ `expression3` is evaluated. Otherwise, the loop is terminated.\n\nIn most programs,\
    \ the “for loop” will be used for such expressions where `expression1` is `initialization`,\
    \ `expression2` is `condition` and `expression3` is either `increment` or `decrement`.\n\
    \nThe general format can be expressed as follows for the sake of clarity:\n\n\
    ###for(initialization ; condition ; increase/decrease) statement;`\n\n![](Images/image00150.gif)![](Images/image00151.gif)![](Images/image00152.gif)![](Images/image00153.gif)![](Images/image00154.gif)\n\
    \nSteps of execution of the for loop:\n\n1. Initialization is executed. (will\
    \ be executed only once)\n2. Condition is checked, if it is true the loop continues,\
    \ otherwise the loop finishes and statement is skipped.\n3. Statement is executed.\n\
    4. Finally, whatever is specified in the increase or decrease field is executed\
    \ and the loop gets back to step 2.\n\nE.g. guess the output of the following\
    \ code: `int main()`\n\n```cpp\nint main()\n{\n  for(int i=10;i>0;i--)\n  {\n\
    \    cout<<n<<“,”;\n  }\n  cout<< “FIRE!”;\n  getch();\n  return 0;\n}\n```\n\n\
    Even though it is not recommended, `expression1`, `expression2` and `expression3`\
    \ can be optional or can be ignored. This means that they can take NULL statement.\n\
    \nBut making `expression2` null means that the loop will not terminate. In such\
    \ cases one can include an “if” statement inside the `for` loop which will test\
    \ a condition and break out from the loop using the `break` statement.\n\nWhile\
    \ making one or more of the three expressions null, the semi colons CAN NOT be\
    \ ignored.\n\nE.g.:\n\n`for (;n<10;)` //if we want nether initialization nor increase/decrease\
    \ `for(;n<10;n++)` //if no initialization is needed.\n\n`for ( ; ; )` //is an\
    \ infinite loop unless an otherwise there is if statement inside the loop.\n\n\
    It is declared above that `expression1` and `expression3` can be one or more statements.\
    \ The composite statements should be separated by a comma. This means, optionally,\
    \ using the comma operator (`,`) we can specify more than one instruction in any\
    \ of the two fields included in a “for” loop.\n\nE.g. `for(n=0,i=100;n!=i; n++,i--)`\n\
    \n```cpp\n{\n  //what ever here }\n}\n```\n\nIn the above example, `n=0` and `i=100`\
    \ will be part of `expression1` and will be executed only once before the loop\
    \ starts. In addition, `n++` and `i—` will be part of `expression3` and will be\
    \ executed after each looping/iteration.\n\nEg:1\n\n```cpp\n//the following for\
    \ statement adds the numbers between 0 and n *int Sum=0;\nfor(int i=0; i<=n;i++)\n\
    \  Sum=Sum+i;*\n```\n\nEg:2\n\n```cpp\n//the following for statement adds the\
    \ even numbers between 0 and n *int Sum=0;\nfor(int i=0; i<=n;)\n{\n  Sum=Sum+i;\
    \ i+=2;\n}*\n```\n\nEg:3\n\n```cpp\n//the following for statement adds the even\
    \ numbers between 0 and n //where all the three expressions are null.\n*int Sum=0;\n\
    int i=0;\nfor( ; ; )*\n{\n*If(i<=n) break;*\n*else*\n{\n*Sum=Sum+i;\ni++;*\n}\n\
    }\n```\n\nIn the above example, the initialization is at the top before the looping\
    \ starts, the condition is put in if statement before the instructions are executed\
    \ and the increment is found immediately after the statements to be executed in\
    \ the loop.\n\n**NB:** even though there is the option of making all the three\
    \ expressions null in a “for” loop, it is not recommended to make the condition\
    \ to take null statement.\n\n### 4.2.2. The while statement\n\nThe while statement\
    \ (also called while loop) provides a way of repeating a statement or a block\
    \ as long as a condition holds / is true.\n\nThe general form of the while loop\
    \ is:\n\n###while(expression) statements;`\n\nFirst `expression` (called the `loop\
    \ condition`) is evaluated. If the outcome is non zero then statement (called\
    \ the `loop body`) is executed and the whole process is repeated. Otherwise, the\
    \ loop is terminated.\n\nSuppose that we wish to calculate the sum of all numbers\
