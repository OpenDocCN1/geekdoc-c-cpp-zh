  trans: "\n同名的函数被称为重载函数。C++ 要求每个重载函数在参数列表上必须有所不同。重载函数允许你拥有处理不同数据类型的相似函数。\n\n假设你写了一个函数，它可以返回传递给它的任何数字的绝对值：\n\
    \n```cpp\nint iabs(int i) {\n    if(i<0)\n        return (i*-1);\n    else\n \
    \       return (i); \n}\n\nfloat fabs(float x) {\n    if(x<0.0)\n        return\
    \ (x * -1.0);\n    else\n        return (x);\n}\n```\n\n如果不使用重载，你必须这样调用函数：`int\
    \ ans = iabs(weight);` 对于 `int` 参数，`float ans = fabs(weight);` 对于 `float` 参数。\n\
    \n但使用重载，上面的代码可以改为：\n\n```cpp\nint abs(int i);\nfloat abs(float x); \nint main()\
    \ {\n    …\n    ians = abs(i);//使用 int 参数调用 abs\n    fans = abs(p);//使用 float\
    \ 参数调用 abs …\n}\n\nint abs(int i) {\n    if(i<0)\n        return i*-1; \n    else\n\
    \        return I; \n}\n\nfloat abs(float x) {\n    if(x<0.0)\n        return\
    \ x*-1.0;\n    else\n        return x;\n}\n```\n\n**注意**：如果两个或多个函数仅返回值类型上不同，C++\
    \ 无法对它们进行重载。仅返回值类型不同的两个或多个函数必须具有不同的名称且不能重载。\n\n## 4.10 递归\n\n调用自身的函数被称为递归。递归是一种通用的编程技术，适用于可以用自身来定义的问题。以阶乘问题为例，它的定义如下：\n\
    \n- 0 的阶乘是 1\n- 正整数 n 的阶乘是 n 乘以 n-1 的阶乘。\n\n第二行清楚地表明 `factorial` 是根据其自身定义的，因此可以表示为递归函数。\n\
    \n```cpp\nint Factorial(unsigned int n ) {\n    return n == 0 ? 1 : n * factrial(n-1);\n\
    }\n```\n\n当 `n` 设置为 4 时，下图显示了递归调用：`Factorial(4)` 24，`4 * Factorial(3)` 6，`3 *\
    \ Factorial(2)` 2，`2 * Factorial(1)` 1。这些调用的栈帧在运行时栈上顺序出现，一个接一个。递归函数必须至少有一个可以满足的终止条件。否则，该函数将无限地调用自身，直到运行时栈溢出。\n\
    \n递归方法中的三个必要组成部分是：\n\n1. 用于停止或继续递归的测试\n2. 终止递归的边界情况\n3. 继续递归的递归调用\n\n让我们使用递归再实现两个数学函数，例如：以下函数计算前\
    \ `N` 个正整数 `1, 2, …, N` 的和。请注意该函数是如何包含递归方法的三个必要组成部分的。\n\n```cpp\nint sum(int N)\
    \ {\n    if(N==1)\n        return 1;\n    else\n        return N+sum(N);\n}\n\
    ```\n\n上一种方法计算幂 `A^n`，其中 `A` 是实数，`N` 是正整数。这次，我们需要传递两个参数。`A` 和 `N`。在调用过程中，`A` 的值不会改变，但\
    \ `N` 的值在每次递归调用后都会减一。\n\n```cpp\nfloat expo(float A, int N) {\n    if(N==1)\n\
    \        return A; \n    else\n        return A * expo(A,N-1); \n}\n```\n\n尝试使用递归函数调用解决斐波那契数列。斐波那契数列为：`0,1,1,2,3,5,8,13,21,…`\
    \ 斐波那契数列的递归定义如下：\n\n`Fibonacci(0) = 0`\n`Fibonacci(1) = 1`\n`Fibonacci(n) = Fibonacci(n-1)\
    \ + Fibonacci(n-2);`\n\n## 4.11 递归与迭代\n\n迭代和递归都基于控制结构。迭代使用重复结构（如 `for`、`while`、`do…while`），而递归使用选择结构（`if`、`if\
    \ else` 或 `switch`）。\n\n迭代和递归都可以无限执行——如果循环继续测试变为假，则发生无限循环；如果递归步骤没有以覆盖基准例的方式来缩小问题，则发生无限递归。\n\
    \n递归也有缺点。它反复地调用机制，从而导致方法调用的开销。这在处理器时间和内存空间上都是昂贵的。每次递归调用都会创建该方法的另一个副本（实际上，只是函数的变量）；这会消耗大量的内存。\n\
    \n**注意**：在以下情况下使用递归：\n\n1. 递归解决方案是自然且易于理解的\n2. 递归解决方案不会导致过度的重复计算\n3. 等效的迭代解决方案太复杂，且\n\
    4. 当然，当你在考试中被要求使用它时！！\n\n## 阿迪斯亚斯巴巴大学\n信息学院\n信息科学系\n**工作单 4。**\n\n1. 写一个 `int`\
    \ 类型函数 `cube()`，返回其单个 `int` 形式参数的立方。\n2. 写一个 `float` 类型函数 `triangle()`，使用它的两个形式参数\
    \ `h` 和 `w` 计算三角形面积，其中 `h` 是高，`w` 是三角形底的长度。\n3. 写一个 `float` 类型函数 `rectangle()`，使用它的两个\
    \ `float` 形式参数 `h` 和 `w` 计算并返回矩形面积，其中 `h` 是高，`w` 是宽。\n4. 直线的公式通常给为 `y = mx + b`。写一个函数\
    \ `Line()`，接受三个 `float` 参数 `m`、`b` 和 `x`。该函数计算与 `m` 和 `b` 相关的 y 坐标。\n5. 写一个函数\
    \ `Intersect()`，带有四个 `float` 参数 `m1,b1,m2,b2`。参数在概念上成对出现。第一对包含描述一条线的系数；第二对包含描述第二条线的系数。如果直线相交，函数返回\
    \ 1。否则返回 0。\n6. 写一个程序，从用户接受一个正整数并显示该数的阶乘。你应该使用递归函数 `factorial()` 来计算阶乘。\n7. 写另一个程序，从用户接受一个数字并返回该数的斐波那契值。在这里你应该使用递归。\n\
    8. 开发一个程序，使用第 6 题的 `factorial()` 函数计算 `e` 的近似值。基于以下公式进行近似：`1 + 1/1! + 1/2! + 1/3!\
    \ `\n9. 写一个函数 `isPrime()`，接受一个数字并判断该数字是否为质数。\n10. 写一个函数 `isEven()`，使用余数运算符 `%`\
    \ 判断整数是否为偶数。\n11. 使用四个函数 `sum()`、`product()`、`quotient()` 和 `difference()` 修改我们的计算器问题。\n\
    \n## 第五章 数组与结构\n\n### 5 什么是数组\n\n相同数据对象的集合，它们存储在连续的位置上，并共用一个标题。换言之，数组是一组由相同名称引用的值。数组中的每个值称为元素。数组元素也是变量。相同类型值的集合，其名称后跟一个索引。在\
    \ C++ 中，方括号出现在索引后面，代表一个许多简单数据变量集合的内存块；计算机在内存中连续存储数组的所有元素。\n\n### 5.1 数组的属性\n\n\
    数组只能包含一种类型\n\n### 5.2 数组声明\n\n声明数组的名称和类型并设置数组中的元素数量被称为数组定维。在其他变量中使用之前必须先声明。\n"
