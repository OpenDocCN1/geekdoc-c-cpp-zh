    ### ***4.10\. Recursion***


    A function which calls itself is said to be recursive. Recursion is a general
    programming technique applicable to problems which can be defined interms of themselves.
    Take the factorial problem, for instance which is defined as:


    - factorial of 0 is 1


    - factorial of a positive number n is n time the factorial of n1.


    The second line clearly indicates that factorial is defined in terms of itself
    and hence can be expressed as a recursive function. *int Factorial(unsigned int
    n )


    {


    return n = = 0 ? 1 : n * factrial(n-1);


    }*


    For n set to 4, the following figure shows the recursive call: Factorial(4) 24


    4 * Factorial(3)


    6 3 * Factorial(2)


    2 2* Factorial(1)


    1 1


    The stack frames for these calls appear sequentially on the runtime stack, one
    after the other.


    A recursive function must have at least one termination condition which can be
    satisfied. Otherwise, the function will call itself indefinitely until the runtime
    stack overflows.


    The three necessary components in a recursive method are:


    1\. A test to stop or continue the recursion


    2\. An end case that terminates the recursion


    3\. A recursive call(s) that continues the recursion


    let us implement two more mathematical functions using recursion e.g the following
    function computes the sum of the first N positive integers 1,2,…,N. Notice how
    the function includes the three necessary components of a recursive method.


    *int sum(int N)


    {


    if(N==1)


    return 1;


    else


    return N+sum(N);


    }*


    The last method computes the exponentiation A^n where A is a real number and N
    is a positive integer. This time, we have to pass two arguments. A and N. the
    value of A will not change in the calls, but the value of N is decremented after
    each recursive call.


    *float expo(float A, int N)


    {


    if(N==1)


    return A; else


    return A * expo(A,N-1); }*


    Try to use a recursive function call to solve the Fibonacci series. The Fibonacci
    series is :


    0,1,1,2,3,5,8,13,21,…


    the recursive definition of the Fibonacci series is as follows: Fibonacci (0)
    =0


    Fibonacci (1) =1


    Fibonacci (n) =Fibonacci (n-1) +Fibonacci (n-2);


    ### ***4.11\. Recursion versus iteration***


    Both iteration and recursion are based on control structure. Iteration uses a
    repetition structure (such as for, while, do…while) and recursive uses a selection
    structure (if, if else or switch).


    Both iteration and recursive can execute infinitely-an infinite loop occurs with
    iteration if the loop continuation test become false and infinite recursion occurs
    id the recursion step doesn’t reduce the problem in a manner that coverage on
    a base case.


    Recursion has disadvantage as well. It repeatedly invokes the mechanism, and consequently
    the overhead of method calls. This can be costly in both processor time and memory
    space. Each recursive call creates another copy of the method (actually, only
    the function’s variables); this consumes considerable memory.


