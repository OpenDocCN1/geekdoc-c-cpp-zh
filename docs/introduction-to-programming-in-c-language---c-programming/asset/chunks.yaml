    \    getch();\n}\n```\n\n如果 `c` 是字符数组，你永远无法直接给它赋值，因为数组名不能更改。\n\n### 6.7 指针算术\n\
    \n对指针进行算术运算是不同的，只允许进行加法和减法。\n"
