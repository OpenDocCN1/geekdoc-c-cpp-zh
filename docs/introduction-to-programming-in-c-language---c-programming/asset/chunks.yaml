  trans: "\n如你所见，第一个参数（`int arg[]`）接受任何 `int` 类型的数组，无论其长度如何，由于这个原因，我们包含了第二个参数，告知函数我们传递给第一个参数的每个数组的长度，这样打印数组的\
    \ `for` 循环就能拥有我们感兴趣的尺寸信息。`mult` 函数将每个元素的值加倍，并将 `firstarray` 传递给它。此后调用了 `display`\
    \ 函数。输出被修改了，这表明数组是通过引用传递的。\n\n要按值传递数组，请将数组的每个元素传递给函数。\n\n### 5.6 字符字符串：什么是字符串？\n\
    \n在目前为止所看到的所有程序和概念中，我们只使用了数值型变量，它们专门用于表示数字。但除了数值型变量外，还存在字符字符串，允许我们表示连续的字符，如单词、句子、名字、文本等。到为止，我们只将它们作为常量使用，但从未考虑过使用可以包含它们的变量。\n\
    \n在 C++ 中，没有特定的初级变量类型来存储字符字符串。为了实现这一功能，我们可以使用 `char` 类型的数组，即 `char` 元素的序列。记住，这种数据类型（`char*`）用于存储单个字符的，由于这个原因，通常使用它们的数组来构成单字符的字符串。\n\
    \n例如，下面的数组（或字符字符串）可以存储一个长达 20 个字符的字符串。你可以这样想象它：\n\n```cpp\nchar name [20];\nname\n\
    ```\n\n这 20 个字符的最大尺寸并不总是需要完全用满。例如，`name` 在程序的某个时刻可以存储字符字符串 \"Hello\" 也可以存储字符串\
    \ \"studying C++\"。因此，由于字符数组可以存储比其总长度短的字符串，目前已经形成了一种约定，用空字符来结束字符串的有效内容，该常量可以写为\
    \ `'\\0`。\n\n我们可以用以下方式表示 `name`（一个包含 20 个 `char` 类型元素的数组）存储字符串 \"Hello\" 和 \"\
    Studying C++\"：\n\n```\nH e l l 0 \\0\nS t u d y i n g C + + \\0\n```\n\n注意在有效内容之后包含了一个空字符（`'\\\
    0'`）以指示字符串的结束。空单元格（元素）代表不确定的值。\n\n### 5.7 字符串的初始化\n\n由于字符字符串是普通数组，因此它们遵循与任何数组相同的规则。例如，如果我们想用预定的值初始化一个字符字符串，我们可以以类似于任何其他数组的方式来做：\n\
    \n```cpp\nchar mystring[] = { 'H', 'e', 'l', 'l', 'o', '\\0' };\n```\n\n在这种情况下，我们声明了一个包含\
    \ 6 个 `char` 类型元素的字符字符串（数组），并用组成 `Hello` 的字符加上一个空字符 `'\\0'` 对其进行了初始化。\n\n尽管如此，字符字符串还有另一种初始化其值的额外方法：使用常量字符串。\n\
    \n在之前几个章节示例中使用的表达式中，已经多次出现过代表整个字符字符串的常量。这些常量通过包含在双引号（“ ”）之间来指定，例如：\n\n例: \"the\
    \ result is: \"\n\n这是一个我们可能在某些场合使用过的常量字符串。\n\n与允许指定单字符常量的单引号（`'`）不同，双引号（`\"`）是指定连续字符的常量。*这些包含在双引号之间的字符串末尾总是自动附加一个空字符（`'\\\
    0'`）*。\n\n因此，我们可以通过这两种方式之一用值初始化字符串 `mystring`：\n\n```cpp\nchar mystring [] = {\
    \ 'H', 'e', 'l', 'l', 'o', '\\0' };\nchar mystring [] = \"Hello\";\n```\n\n在这两种情况下，数组或字符字符串\
    \ `mystring` 声明的尺寸均为 6 个字符（`char` 类型元素）：即组成 `Hello` 的 5 个字符加上一个指定字符串结束的结尾空字符（`'\\\
    0'`），在第二种情况下，当使用双引号（`\"`）时，它是自动附加的。\n\n在继续之前，你应该注意，将多个常量（如双引号常量（`\"`））的赋值给数组仅在初始化数组时有效，即在声明的时刻。\n\
    \n代码中的以下表达式对数组是无效的：\n\n```cpp\nmystring=\"Hello\";\nmystring[] = \"Hello\";\n\
    mystring = { 'H', 'e', 'l', 'l', 'o', '\\0' };\n```\n\n所以记住：我们只有在初始化数组的时刻才能向数组“赋值”多字符常量。当你了解更多关于指针时，原因将变得更容易理解，因为那时将阐明数组仅仅是一个指向已分配内存块的常量指针。由于这个常数特性，数组本身不能被赋值任何值，但我们可以为数组的每个元素赋值。\n\
    \n在初始化数组的时刻这是一个特殊情况，因为这不是赋值，尽管使用了相同的等号（`=`）。无论如何，请务必始终记住前述强调的规则。\n\n#### 给字符串赋值\n\
    \n就像任何其他变量一样，字符数组可以使用赋值运算符来存储值。但以下操作是不允许的：\n\n```cpp\nmystring=\"Hello\";\n```\n\
    \n这只在初始化期间允许。因此，由于赋值的*左值（lvalue）*只能是数组的元素而不能是整个数组，有效的是将字符字符串赋值给数组，即使用如下方法为 `char`\
    \ 数组赋值字符字符串：\n\n```cpp\nmystring[0] = 'H';\nmystring[1] = 'e';\nmystring[2] =\
    \ 'l';\nmystring[3] = 'l';\nmystring[4] = 'o';\nmystring[5] = '\\0';\n```\n\n\
    但这似乎并不是一种非常实用的方法。通常为数组赋值，特别是对于字符串，会使用一系列如 `strcpy` 的函数。`strcpy`（`str` `ing` `c`\
    \ `py`）定义在 `string.h` 库中，并如下调用：\n\n`strcpy (string1, string2);`\n\n这将 `string2`\
    \ 的内容复制到 `string1`。`string2` 可以是数组、指针或常量字符串，因此是将常量字符串 \"Hello\" 赋值给 `mystring`\
    \ 的有效方式：\n\n```cpp\nstrcpy (mystring, \"Hello\");\n```\n\n例如：\n\n```cpp\n#include\
    \ <iostream.h>\n#include <string.h>\n\nint main ()\n{\n    char szMyName [20];\n\
    \    strcpy (szMyName,\"Abe\");\n    cout << szMyName;\n    return 0;\n}\n```\n\
    \n我们需要包含 `<string.h>` 头文件才能使用函数 `strcpy`。\n\n尽管我们总是可以编写如下简单的函数，其操作与 cstring 中的\
    \ `strcpy` 相同：\n\n```cpp\n// 给字符串赋值\n#include <iostream.h>\n#include<conio.h>\n\
    \nvoid namecopy(char dest[], char source[]) {\n    int c = 0;\n    while(source[c]\
    \ != '\\0') {\n        dest[c] = source[c];\n        c++;\n    }\n    dest[c]\
    \ = '\\0';\n    cout<< \"\\n 复制后的名字：\"<<dest;\n}\n\nvoid main()\n{\n    clrscr();\n\
    \    char name[10],dest[10];\n    cout<< \"\\n 输入你的名字：\"; cin>>name;\n    namecopy(dest,name);\n\
    \    getch();\n}\n```\n\n另一种常用的给数组赋值的方法是直接使用输入流（`cin`）。在这种情况下，字符串的值由用户在程序运行期间指定的。\n\
    \n当 `cin` 与字符串一起使用时，通常配合它的 `getline` 方法使用，该方法的原型如下：\n\n`cin.getline (char buffer[],\
    \ int length, char delimiter = '\\n');`\n\n"
- fmt: "\nwhere `buffer` is the address where to store the input (like an array, for\
    \ example), `length` is the maximum length of the buffer (the size of the array)\
    \ and `delimiter` is the character used to determine the end of the user input,\
    \ which by default - if we do not include that parameter - will be the newline\
    \ character ( `'\\n'` ).\n\nThe following example repeats whatever you type on\
    \ your keyboard. It is quite simple but serves as example on how you can use `cin.getline`\
    \ with strings:\n\n```cpp\n// cin with strings\n#include <iostream.h> #include<conio.h>\n\
    \nint main ()\n{\n    char mybuffer [100];\n    cout << \"What's your name? \"\
    ;\n    cin.getline (mybuffer,100);\n    cout << \"Hello \" << mybuffer << \".\\\
    n\";\n    cout << \"Which is your favourite team? \";\n    cin.getline (mybuffer,100);\n\
    \    cout << \"I like \" << mybuffer << \" too.\\n\";\n    getch();\n    return\
    \ 0;\n}\n```\n\nNotice how in both calls to `cin.getline` we used the same string\
    \ identifier (`mybuffer`). What the program does in the second call is simply\
    \ step on the previous content of `buffer` by the new one that is introduced.\n\
    \nIf you remember the section about communication through console, you will remember\
    \ that we used the extraction operator (`>>`) to receive data directly from the\
    \ standard input. This method can also be used instead of `cin.getline` with strings\
    \ of characters. For example, in our program, when we requested an input from\
    \ the user we could have written:\n\n```cpp\ncin >> mybuffer;\n```\n\nthis would\
    \ work, but this method has the following limitations that `cin.getline` has not:\n\
    \n- It can only receive single words (no complete sentences) since this method\
    \ uses as delimiter any occurrence of a blank character, including spaces, tabulators,\
    \ newlines and carriage returns.\n- It is not allowed to specify a size for the\
    \ buffer. What makes your program unstable in case that the user input is longer\
    \ than the array that will host it.\n\nFor these reasons it is recommendable that\
    \ whenever you require strings of characters coming from `cin` you use `cin.getline`\
    \ instead of `cin >>`.\n\n## Converting strings to other types\n\nDue to that\
    \ a string may contain representations of other data types like numbers it might\
    \ be useful to translate that content to a variable of a numeric type. For example,\
    \ a string may contain `\"1977\"`, but this is a sequence of 5 chars not so easily\
    \ convertible to a single integer data type. The `cstdlib` (`stdlib.h`) library\
    \ provides three useful functions for this purpose:\n\n- `atoi`: converts string\
    \ to `int` type.\n- `atol`: converts string to `long` type.\n- `atof`: converts\
    \ string to `float` type.\n\nAll of these functions admit one parameter and return\
    \ a value of the requested type (`int`, `long` or `float`). These functions combined\
    \ with `getline` method of `cin` are a more reliable way to get the user input\
    \ when requesting a number than the classic `cin>>` method:\n\n```cpp\n// cin\
    \ and ato* functions\n#include <iostream.h>\n#include <stdlib.h>\n#include<conio.h>\n\
    \nint main()\n{ \n    clrscr();\n    char mybuffer[100];\n    float price;\n \
    \   int quantity;\n    cout << \"Enter price: \";\n    cin.getline (mybuffer,100);\n\
    \    price = atof (mybuffer);\n    cout << \"Enter quantity: \";\n    cin.getline\
    \ (mybuffer,100);\n    quantity = atoi (mybuffer);\n    cout<<\"\\nafter conversion\
    \ :\\n\";\n    cout<<\"\\nprice is : \"<<price;\n    cout<<\"\\nquantity is :\
    \ \"<<quantity; \n    cout << \"\\nTotal price: \" << price*quantity; \n    getch();\n\
    \    return 0;\n}\n```\n\n### Functions to manipulate strings\n\nThe `cstring`\
    \ library (`string.h`) defines many functions to perform some manipulation operations\
    \ with C-like strings (like already explained `strcpy`). Here you have a brief\
    \ with the most usual:\n\n### a) String length\n\nReturns the length of a string,\
    \ not including the null character (`\\0`). `strlen(const char *string);`\n\n\
    ### b) String Concatenation\n\nAppends `src` string at the end of `dest` string.\
    \ Returns `dest`. The string concatenation can have two forms, where the first\
    \ one is to append the whole content of the source to the destination the other\
    \ will append only part of the source to the destination.\n\n- Appending the whole\
    \ content of the source: `strcat(char *dest, const char *src);`\n- Appending part\
    \ of the source: `strncat(char *dest, const char *src, int size);`\n\nWhere `size`\
    \ is the number characters to be appended.\n\n### c) String Copy\n\nOverwrites\
    \ the content of the `dest` string by the `src` string. Returns `dest`. The string\
    \ copy can have two forms, where the first one is to copying the whole content\
    \ of the source to the destination and the other will copy only part of the source\
    \ to the destination.\n\n- Copy the whole content of the source: `strcpy(char\
    \ *dest, const char *src);`\n- Appending part of the source: `strncpy(char *dest,\
    \ const char *src, int size);`\n\nWhere `size` is the number characters to be\
    \ copied.\n\n### d) String Compare\n\nCompares the two string `string1` and `string2`.\
    \ The string compare can have two forms, where the first one is to compare the\
    \ whole content of the two strings and the other will compare only part of the\
    \ two strings.\n\n- Copy the whole content of the source: `strcmp(const char *string1,\
    \ const char *string2);`\n- Appending part of the source: `strncmp(const char\
    \ *string1, const char *string2, int size);`\n\nWhere `size` is the number characters\
    \ to be compaired Both string compare functions returns three different values:\n\
    \n- Returns `0` is the strings are equal.\n- Returns `negative` value if the first\
    \ is less than the second string.\n- Returns `positive` value if the first is\
    \ greater than the second string.\n\n## Multidimensional Arrays\n\nMultidimensional\
    \ arrays can be described as arrays of arrays. For example, a bi-dimensional array\
    \ can be imagined as a bi-dimensional table of a uniform concrete data type.\n\
    \n![](Images/image00158.gif)Matrix represents a bi-dimensional array of 3 per\
    \ 5 values of type `int`. The way to declare this array would be:\n\n```cpp\n\
    int matrix[3][5];\n```\n\nFor example, the way to reference the second element\
    \ vertically and horizontally in an expression would be: `matrix[1][3]`\n\n![](Images/image00159.gif)(remember\
    \ that array indices always begin by `0`) Multidimensional arrays are not limited\
    \ to two indices (two dimensions). They can contain many indices as needed, although\
    \ it is rare to have more than 3 dimensions. Just consider the amount of memory\
    \ that an array with many indices may need. For example:\n\n```cpp\nchar century\
    \ [100][365][24][60][60];\n```\n\nAssigns a `char` for each second contained in\
    \ a century, that is more than 3 billion `chars`! What would consume about 3000\
    \ megabytes of RAM memory if we could declare it?\n\nMultidimensional arrays are\
    \ nothing else than an abstraction, since we can simply obtain the same results\
    \ with a simple array by putting a factor between its indices: `int matrix[3][5];`\
    \ is equivalent to `int matrix[15];` (3 * 5 = 15) with the only difference that\
    \ the compiler remembers for us the depth of each imaginary dimension. Serve as\
    \ example these two pieces of code, with exactly the same result, one using bi-dimensional\
    \ arrays and the other using only simple arrays:\n\n```cpp\n\n#include <iostream.h>\n\
    #define WIDTH 5\n#define HEIGHT 3\nint matrix [HEIGHT][WIDTH]; int n,m;\n\nint\
    \ main ()\n{\n    for (n=0;n<HEIGHT;n++)\n        for (m=0;m<WIDTH;m++)\n    \
    \    {\n            matrix [n][m]=(n+1)*(m+1);\n        }\n    return 0;\n}\n\
    ```\n\nNone of the programs above produce any output on the screen, but both assign\
    \ values to the memory block called `matrix` in the following way:\n\n![](Images/image00160.gif)\n\
    \nWe have used defined constants (`#define`) to simplify possible future modifications\
    \ of the program, for example, in case that we decided to enlarge the array to\
    \ a height of `4` instead of `3` it would be enough by changing the line:\n\n\
    `#define HEIGHT 3`\n\nby the following code\n\n`#define HEIGHT 4`\n\n## Structures\n"
