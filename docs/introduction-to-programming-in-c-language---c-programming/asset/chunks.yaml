    arr=ar; // not allowed\n```\n\nNote: when initializing an array, we can provide\
    \ fewer values than the array elements. E.g. `int a [10] = {10, 2, 3}`; in this\
    \ case the compiler sets the remaining elements to zero.\n\n### 5.4 Accessing\
    \ and processing array elements\n\nIn any point of the program in which the array\
    \ is visible we can access individually anyone of its elements for reading or\
    \ modifying it as if it was a normal variable. To access individual elements,\
    \ index or subscript is used. The format is the following:\n\n`name [ index ]`\n\
    \nIn c++ the first element has an index of `0` and the last element has an index,\
    \ which is one less the size of the array (i.e. `arraysize-1`). Thus, from the\
    \ above declaration, `day[0]` is the first element and `day[4]` is the last element.\n\
    \nFollowing the previous examples where `day` had 5 elements and each element\
    \ is of type `int`, the name, which we can use to refer to each element, is the\
    \ following one:\n\n![](Images/image00157.gif)\n\nFor example, to store the value\
    \ `75` in the third element of the array variable `day` a suitable sentence would\
    \ be:\n\n```cpp\nday[2] = 75; // as the third element is found at index 2\n```\n\
    \nAnd, for example, to pass the value of the third element of the array variable\
    \ `day` to the variable `a`, we could write:\n\n```cpp\na = day[2];\n```\n\nTherefore,\
    \ for all the effects, the expression `day[2]` is like any variable of type `int`\
    \ with the same properties. Thus an array declaration enables us to create a lot\
    \ of variables of the same type with a single declaration and we can use an index\
    \ to identify individual elements.\n\nNotice that the third element of `day` is\
    \ specified `day[2]`, since first is `day[0]`, second is `day[1]`, and therefore,\
    \ third is `day[2]`.\n\n### 5.5 Arrays as parameters\n\nAt some moment we may\
    \ need to pass an array to a function as a parameter. In C++ it is not possible\
    \ to pass by value a complete block of memory as a parameter, even if it is ordered\
    \ as an array, to a function, but it is allowed to pass its address, which has\
    \ almost the same practical effect and is a much more efficient operation.\n\n\
    In order to admit arrays as parameters the only thing that we must do when declaring\
    \ the function is to specify in the argument base `type` for the array that it\
    \ contains, an identifier and a pair of void brackets `[]`. For example, the following\
    \ function:\n\n```cpp\nvoid procedure (int arg[])\n```\n\nadmits a parameter of\
    \ type \"Array of `int`\" called `arg`. In order to pass to this function an array\
    \ declared as:\n\n```cpp\nint myarray [40];\n```\n\nit would be enough with a\
    \ call like:\n\n```cpp\nprocedure (myarray);\n```\n\nHere you have a complete\
    \ example:\n\n```cpp\n#include <iostream.h>\n#include <conio.h>\n\nvoid printarray\
    \ (int arg[], int length) {\n    for (int n=0; n<length; n++) cout << arg[n] <<\
    \ \" \";\n    cout << \"\\n\";\n}\n\nvoid mult(int arg[], int length) {\n    for\
    \ (int n=0; n<length; n++) arg[n]=2*arg[n];\n}\n\nvoid main () {\n    int firstarray[]\
    \ = {5, 10, 15};\n    int secondarray[] = {2, 4, 6, 8, 10};\n\n    printarray\
    \ (firstarray,3);\n    printarray (secondarray,5);\n\n    mult(firstarray,3);\n\
    \n    cout<<”first array after being doubled is\\n\";\n    printarray (firstarray,3);\n\
    \n    getch();\n}\n```\n"
