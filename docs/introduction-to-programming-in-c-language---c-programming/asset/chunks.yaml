    ***Converting strings to other types***


    Due to that a string may contain representations of other data types like numbers
    it might be useful to translate that content to a variable of a numeric type.
    For example, a string may contain **"1977"** , but this is a sequence of 5 chars
    not so easily convertible to a single integer data type. The **cstdlib** ( **stdlib.h**
    ) library provides three useful functions for this purpose:


    • **atoi:** converts string to **int** type.


    • **atol:** converts string to **long** type.


    • **atof:** converts string to **float** type.


    All of these functions admit one parameter and return a value of the requested
    type ( int , long or float ). These functions combined with **getline** method
