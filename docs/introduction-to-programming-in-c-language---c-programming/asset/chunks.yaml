    content of the two strings and the other will compare only part of the two strings.


    o Copy the whole content of the source


    **strcmp (const char*** *string1* **, const char*** *string2* **);**


    o Appending part of the source


    **strncmp (const char*** *string1* **, const char*** *string2, **int** size* **);**
    Where size is the number characters to be compaired Both string compare functions
    returns three different values:


    o Returns ***0*** is the strings are equal


    o Returns ***negative*** value if the first is less than the second string


    o Returns ***positive*** value if the first is greater than the second string


    ## **Multidimensional Arrays**


    Multidimensional arrays can be described as arrays of arrays. For example, a bi-dimensional
    array can be imagined as a bi-dimensional table of a uniform concrete data *type.*


    ![](Images/image00158.gif)Matrix represents a bi-dimensional array of 3 per 5
    values of type **int** . The way to declare this array would be:


    int matrix[3][5];


    For example, the way to reference the second element vertically and fourth horizontally
    in an expression would be:


    **matrix[1][3]**


    ![](Images/image00159.gif)(remember that array indices always begin by **0** )


    *Multidimensional arrays* are not limited to two indices (two dimensions). They
    can contain so many indices as needed, although it is rare to have to represent
    more than 3 dimensions. Just consider the amount of memory that an array with
    many indices may need. For example:


    char century [100][365][24][60][60];


    Assigns a **char** for each second contained in a century, that is more than 3
    billion **chars** ! What would consume about 3000 *megabytes* of RAM memory if
    we could declare it?


    Multidimensional arrays are nothing else than an abstraction, since we can simply
    obtain the same results with a simple array by putting a factor between its indices:


    **int matrix [3][5];** is equivalent to


    **int matrix [15];** (3 * 5 = 15)


    With the only difference that the compiler remembers for us the depth of each
    imaginary dimension. Serve as example these two pieces of code, with exactly the
    same result, one using bi-dimensional arrays and the other using only simple arrays:


    */*/ multidimensional array


    #include <iostream.h>


    #define WIDTH 5


    #define HEIGHT 3


    int matrix [HEIGHT][WIDTH]; int n,m;


    int main ()


    {


    for (n=0;n<HEIGHT;n++)


    for (m=0;m<WIDTH;m++)


    *{


    matrix [n][m]=(n+1)*(m+1);


    }


    return 0;


    }*


    None of the programs above produce any output on the screen, but both assign values
    to the memory block called **matrix** in the following way:


    ![](Images/image00160.gif)


    We have used defined constants ( **#define** ) to simplify possible future modifications
    of the program, for example, in case that we decided to enlarge the array to a
    height of **4** instead of **3** it would be enough by changing the line:


    #define HEIGHT 3


    by the following code


    #define HEIGHT 4


