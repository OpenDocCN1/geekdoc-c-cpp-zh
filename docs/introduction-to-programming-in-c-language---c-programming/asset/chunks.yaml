    *testing and maintenance*


    ### 1.5.2. Problem Solving


    - Problem solving is the process of transforming the description of a problem
    into the solution by using our knowledge of the problem domain and by relying
    on our ability to select and use appropriate problem-solving strategies, techniques,
    and tools.

    - A problem is an *undesirable situation* that prevents the organization from
    fully achieving its purpose, goals and objectives. Or problem can also be defined
    as the *gap between the existing and the desired situation* where problem solving
    will try to fill this gap.


    There are two approaches of problem solving:


    *Top down design*: is a systematic approach based on the concept that the structure
    of the problem should determine the structure of the solution and what should
    be done in lower level. This approach will try to disintegrate a larger problem
    into more smaller and manageable problems to narrow the problem domain.


    *Bottom up design*: is the reverse process where the lowest level component are
    built first and the system builds up from the bottom until the whole process is
    finally completed.


    ## 1.6. Basic Program development tips


    The program we design in any programming language need to be:

    - *Reliable*: the program should always do what it is expected to do and handle
    all types of exception.

    - *Maintainable*: the program should be in a way that it could be modified and
    upgraded when the need arises.

    - *Portable*: It needs to be possible to adapt the software written for one type
    of computer to another with minimum modification.

    - *Efficient*: the program should make optimal use of time, space and other resources.


    ## 1.7. Algorithm designing and modeling the logic


    Any program written in a language other than *machine language* needs to be translated
    to machine language. The set of instructions that do this task are known as *translators*.


    There are different kinds of translator software, among which *compilers* and
    *interpreters* are of interest for most programmers.


    ### 1.7.1. Modeling programs logic using flow chart


    Algorithm could be designed using many techniques and tools. One tool of designing
    algorithm is by using flowcharts. Flowchart is a graphical way of expressing the
    steps needed to solve a problem.


    A flow chart is a schematic (*diagrammatic description*) representation of a process.


    Basic flowcharting symbols are:


    - Terminal point

    - Decision

    - Process

    - Input/Output

    - Flow line

    - Inter-page connector

    - On-page connector


    E.g: to check weather a number is positive or negative.


    ```

    start

    Enter number

    Display^(num/2==0?) Display odd even

    end

    ```


    The algorithm should be:


