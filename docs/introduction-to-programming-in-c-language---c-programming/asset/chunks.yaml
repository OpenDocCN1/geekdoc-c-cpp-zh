    ***Precise and unambiguous***


    ![](Images/image00105.gif)![](Images/image00106.gif)![](Images/image00107.gif)![](Images/image00108.gif)![](Images/image00109.gif)![](Images/image00110.gif)![](Images/image00111.gif)


    ***Simple***


    ![](Images/image00067.gif)![](Images/image00068.gif)![](Images/image00069.gif)![](Images/image00070.gif)![](Images/image00071.gif)![](Images/image00112.gif)![](Images/image00073.gif)


    ***Correct***


    ![](Images/image00113.gif)![](Images/image00074.gif)![](Images/image00075.gif)![](Images/image00076.gif)![](Images/image00077.gif)![](Images/image00114.gif)![](Images/image00073.gif)


    ***Efficient***


    **1.7.1\. Modeling a programs logic using flow chart**


    Algorithm could be designed using many techniques and tools. One tool of designing
    algorithm is by using flowcharts. Flowchart is a graphical way of expressing the
    steps needed to solve a problem.


    A flow chart is a schematic (*diagrammatic description*) representation of a process.


    Basic flowcharting symbols are:


    ### Terminal point


    Decision


    Process


    Input/Output


    Flow line


    Inter-page connector


    On-page connector


    e.g: to check weather a number is positive or negative.


    start


    Enter number


    Display^(num/2==0?) Display odd even


    end


    **1 .8\. Compilers and Interpreters**.


    Any program written in a language other than *machine language* needs to be translated
    to machine language. The set of instructions that do this task are known as *translators*.


    There are different kinds of translator software, among which *compilers* and
    *interpreters* are of interest for most programmers.


    *Compilers*: a compiler is a computer program that translates a series of statements
    written in source code (a collection of statements in a specific programming language)
    into a resulting object code (translated instructions of the statements in a programming
    language). A compiler changes or translates *the whole* source code into executable
    machine code (also called *object code*) which is *output to a file* for latter
    execution. E.g. C++, Pascal, FORTRAN, etc.'
