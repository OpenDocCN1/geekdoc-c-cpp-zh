    \ you to convert a datum of a given type to another data type.\n\nE.g.\n\n```cpp\n\
    int i;\nfloat f = 3.14;\ni = (int)f; equivalent to i = int(f);\n```\n\nThen variable\
    \ `i` will have a value of 3 ignoring the decimal point.\n\n## 2.9. Operator Precedence.\n\
    \nThe order in which operators are evaluated in an expression is significant and\
    \ is determined by precedence rules. Operators in higher levels take precedence\
    \ over operators in lower levels.\n\n### Precedence Table:\n\n| Level | Operator\
    \ | Order |\n| :--- | :--- | :--- |\n| Highest | `++` `--` (post fix) | Right\
    \ to left |\n| | `sizeof()` `++` `--` (prefix) | Right to left |\n| | `*` `/`\
    \ `%` | Left to right |\n| | `+` `-` | Left to right |\n| `<` `<=` $>$ `>=` |\
    \ Left to right |\n| | `==` `!=` | Left to right |\n| | `&&` | Left to right |\n\
    | | `||` | Left to right |\n| | `? `:` | Left to right |\n| | `=` `, `+=` `-=`\
    \ `*=` `/=` `^=` `%=` `&=` `|=` `<<=` `>>=` | Right to left |\n\nE.g.\n\n`a =\
    \ b + c * d` ; `c * d` is evaluated first because `*` has a higher precedence\
    \ than `+` and ` =` .\n\nThe result is then added to `b` because `+` has a higher\
    \ precedence than ` =` . And then `==` is evaluated.\n\nPrecedence rules can be\
    \ overridden by using brackets.\n\nE.g. rewriting the above expression as:\n\n\
    `a = (b + c) * d` causes `+` to be evaluated before `*`.\n\nOperators with the\
    \ same precedence level are evaluated in the order specified by the column on\
    \ the table of precedence rule.\n\nE.g. `a = b += c` the evaluation order is right\
    \ to left, so the first `b += c` is evaluated followed by `a = b`.\n\n### Addis\
    \ Ababa University Faculty of Informatics - Worksheet 2\n\nCourse Title: Introduction\
    \ to Programming / Fundamentals of Programming Course No: `Comp 271 / CSCE 232`\n\
    \nFor each of the problems write a C++` code to perform the required task. Your\
    \ program should be based on the flow chart you drawn in the first worksheet.\n\
    \n1) Receive a number and determine whether it is odd or even.\n2) Obtain two\
    \ numbers from the keyboard, and determine and display which (if either) is the\
    \ larger of the two numbers.\n3) Receive 3 numbers and display them in ascending\
    \ order from smallest to largest.\n4) Add the numbers from 1 to 100 and display\
    \ the sum.\n5) Add the even numbers between 0 and any positive integer number\
    \ given by the user.\n6) Find the average of two numbers given by the user.\n\
    7) Find the average, maximum, minimum, and sum of three numbers given by the user.\n\
    8) Find the area of a circle where the radius is provided by the user.\n9) Swap\
    \ the contents of two variables using a third variable.\n10) Swap the content\
    \ of two variables without using a third variable.\n11) Read an integer value\
    \ from the keyboard and display a message indicating if this number is odd or\
    \ even.\n12) read 10 integers from the keyboard in the range 0 - 100, and count\
    \ how many of them are larger than 50, and display this result.\n13) Take an integer\
    \ from the user and display the factorial of that number.\n\n## Chapter Three\
    \ Program Control Constructs.\n\nA running program spends all of its time executing\
    \ instructions or statements in that program.\n\nThe order in which statements\
    \ in a program are executed is called `flow` of that program.\n\nProgrammers can\
    \ control which instruction to be executed in a program, which is called `flow\
    \ control`.\n\nThis term reflects the fact that the currently executing statement\
    \ has the control of the CPU, which when completed will be handed over (flow)\
    \ to another statement.\n\nFlow control in a program is typically `sequential`,\
    \ from one statement to the next.\n\nBut we cal also have execution that might\
    \ be divided to other paths by `branching statements`. Or perform a block of statement\
    \ repeatedly until a condition fails by `Repetition` or `looping`.\n\nFlow control\
    \ is an important concept in programming because it will give all the power to\
    \ the programmer to decide what to do to execute during a run and what is not,\
    \ therefore affecting the overall outcome of the program.\n\n## 3. Sequential\
    \ Statements\n\nSuch kind of statements are instruction in a program which will\
    \ executed one after the other in the order scripted in the program. In sequential\
    \ statements, the order will be determined during program development and can\
    \ not be changed.\n\n## 4. Selection Statements\n\nSelection statements are statements\
    \ in a program where there are points at which the program will decide at runtime\
    \ whether some part of the code should or should not be executed.\n\nThere are\
    \ two types of selection statements in C++, which are the `if statement` and the\
    \ `switch statement`.\n\n## 4.1. The if Statement\n\nIt is sometimes desirable\
    \ to make the execution of a statement dependent upon a `condition being satisfied`.\n\
    \nThe different forms of the `If` statement will be used to decide whether to\
    \ execute part of the program based on a condition which will be tested either\
    \ for TRUE or FALSE result.\n\nThe different forms of the `If` statement are:\n\
    - The simple if statement\n- The If else statement\n- The if else if statement\n\
    \n### The simple if statement\n\nThe simple if statement will decide only one\
    \ part of the program to be executed if the condition is satisfied or ignored\
    \ if the condition fails.\n\nThe General Syntax is:\n\n```cpp\nif (expression)\n\
    statements;\n```\n\nIn any `if` statement, first the `expression` will be evaluated\
    \ and if the outcome is non zero (which means TRUE), then the `statements` is\
    \ executed. Otherwise, nothing happens (the statement will not be executed) and\
    \ execution continues.\n\nTo make multiple statements dependent on the same condition\
    \ we can use a compound statement, embracing the group within `{}`.\n\nE.g.:\n\
    ```cpp\nif (age>18)\n    cout<<\"you are adult\";\n```\n\nE.g.:\n```cpp\nif(balance\
    \ > 0)\n{\n    interest = balance * creditRate;\n    balance += interest;\n}\n\
    ```\n\nMost of the time `expression` will have relational expressions testing\
    \ something is equal, greater, less, or different from something It should be\
    \ noted that the output of a relational expression is either True (represented\
    \ by anything different from zero) or False (represented by Zero).\n\nThus any\
    \ expression, whose final result is either zero or none can be used in `expression`.\n\
    \nE.g.:\n```cpp\nint x;\ncin>>x;\nif(x)\n    cout<<\"you are adult\";\n```\n\n\
    In the above example, the value of variable `x` will be an input from the user.\
    \ The `if` statement will be true if the user gives anything different from zero,\
    \ which means the message `you are adult` will be displayed. If the user gives\
    \ zero value for `x`, which will be interpreted as False, nothing will be done\
    \ as the if statement is not satisfied.\n\n### If else statement\n\nAnother form\
    \ of the `if` is the `if...else` statement. The `if else` statement allows us\
    \ to specify two alternative statements: one which will be executed if a condition\
    \ is satisfied and another which will be executed if the condition is not satisfied.\n\
    \nThe General Syntax is:\n\n```cpp\nif (expression)\nstatements1;\nelse\nstatements2;\n\
    ```\n\nFirst `expression` is evaluated and if the outcome is none zero (true),\
    \ then `statements1` will be executed. Otherwise, the `expression` is false, `statements2`\
    \ will be executed.\n\nE.g.:\n```cpp\nif(balance > 0)\n{\n    interest = balance\
    \ * creditRate;\n    balance += interest;\n}\nelse\n{\n    interest = balance\
    \ * debitRate;\n    balance += interest;\n}\n```\n\nE.g.1:\n```cpp\nif(age>18)\n\
    \    cout<<\"you are adult\";\nelse\n    cout<<\"You are a kid\";\n```\n\nE.g.2:\n\
    ```cpp\nint x;\ncout<<\"Enter a number: \"; cin>>x;\nif(x%2==0)\n    cout<<\"\
    \ The Number is Even\"; else\n    cout<<\"The Number is Odd\";\n```\n\nE.g.3:\n\
    ```cpp\nint x;\ncout<<\"Enter a number: \";\ncin>>x;\nif(x%2)\n    cout<<\"The\
    \ Number is Odd\"; else\n    cout<<\"The Number is Even\";\n```\n"
