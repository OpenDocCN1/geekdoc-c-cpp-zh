    \ 函数提供参数的机制。当从命令行调用 `main` 函数时，这些参数会被传递给程序。例如：`c:\\> file-name arg1 arg2`\n- 其中\
    \ `file-name` 是文件名（程序名），`arg1`、`arg2` 是传递给程序的参数。\n- 如果我们想向 `main` 函数传递参数，则 `main`\
