  trans: "\n上述三个示例说明了“if else”语句。后两个例子的作用相同，区别在于 `Eg3` 中的表达式从关系表达式变为了算术表达式。我们知道，当除数为\
    \ 2 时，取模运算符的结果要么是 0，要么是 1。因此，`Eg3` 中表达式的最终结果对于奇数是 1，对于偶数则是 0。\n\n通过将一个 if 语句放在另一个\
    \ if 语句内部，可以实现 if 语句的嵌套。例如：\n\n```cpp\nif(callHour > 3)\n{\n    if(callDuration\
    \ <= 5)\n        charge = callDuration * tarif1;\n    else\n        charge = 5\
    \ * tarif1 + (callDuration - 5) * tarif2; \n}\nelse\n    charge = flatFee;\n```\n\
    \ne.g2. \n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\nint main()\n{\n\
    \    int testScore;\n    cout<<”\\nEnter your test score:”; cin>>testScore;\n\
    \    if(testScore < 70)\n        cout<<”\\n You did not pass:”; // then 块\n  \
    \  else\n        cout<<”\\n You did pass”; // else 块\n    getch();\n    return\
    \ 0;\n}\n```\n\n上面的示例程序可以用图示表示如下：\n\n^(False) `testScore < 70`?^(True) cout<<”you\
    \ did pass”; cout<<”you did’t pass”;\n\n### “if else if”语句\n\n“if”语句的第三种形式是“if\
    \ …else if”语句。“if else if”语句允许我们指定两个以上的替代语句，每个语句都将根据对一个或多个条件的测试来执行。\n\n通用语法为：\n\
    \n```cpp\nif (expression1)\n    statements1;\nelse if(expression2) \n    statements2;\n\
    else if(expressionN) \n    statementsN;\nelse\n    statements\n```\n\n首先求值 `expression1`，如果结果非零（真），则执行\
    \ `statements1`。否则，将求值 `expression2`：如果 `expression2` 的输出为真，则执行 `statements2`；否则执行\
    \ else if 语句中的下一个 `expression`，依此类推。\n\n如果“if”和“else if”语句中的所有表达式均为假，则将执行 else\
    \ 下的 `statements`。\n\n“if…else”和“if…else if”语句被称为互斥选择，因为只要满足其中一个条件（表达式），就只会执行其对应代码块中的指令，其余部分将忽略忽略。\n\
    \n例如：\n\n```cpp\nif(score >= 90)\n    cout<< “\\n your grade is A”;\nelse if(score\
    \ >= 80)\n    cout<< “\\n your grade is B”;\nelse if(score >= 70)\n    cout<<\
    \ “\\n your grade is C”;\nelse if(score >= 60)\n    cout<< “\\n your grade is\
    \ D”;\nelse\n    cout<< “\\n your grade is F”;\n```\n\n在上面的示例中，五个 `cout` 语句中只有一个会被执行，其余的被忽略。但在满足其中一个条件或到达\
    \ else 部分之前，表达式将一直被测试或求值。\n\n### 在另一个 if 语句中嵌套 if 语句\n\n一个或多个 if 语句可以嵌套在另一个 if\
    \ 语句中。\n\n嵌套将用于测试多个条件以执行任务。\n\n始终建议对嵌套的 if 语句进行缩进，以增强程序的可读性。\n\n通用语法可能是：\n\n```cpp\n\
    if (expression1)\n{\n    if (expression2) statementsN; \n    else\n        statementsM;\n\
    }\nelse\n{\n    if (expression3) statementsR; \n    else\n        statementsT;\
    \ \n}\n```\n\n当且仅当 `expression1` 和 `expression2` 都求值且两者的结果都非零（真）时，将执行 `StatementsN`。\n\
    \n当且仅当 `expression1` 为真且 `expression2` 为假时，将执行 `StatementsM`。\n\n当且仅当 `expression1`\
    \ 为假且 `expression3` 为真时，将执行 `StatementsR`。\n\n当且仅当 `expression1` 为假且 `expression2`\
    \ 为假时，将执行 `StatementsT`。\n\n让我们来看一个关于嵌套 if 语句的例子：\n\n```cpp\nint main()\n{\n \
    \   int testScore, age;\n    cout<<”\\n Enter your test score :”;\n    cin>>testScore;\n\
    \    cout<<“\\n enter your age:”;\n    cin>>age;\n    if(testScore >= 70)\n  \
    \  {\n        if (age < 10)\n            cout<<“\\n You did a great job”;\n  \
    \      else\n            cout<<“\\n You did pass”;\n    }\n    else\n        cout<<“\\\
    n You did not pass”;\n    getch();\n    return 0;\n}\n```\n\n上面的程序可以用图示表示如下。\n\
    \n^(False) `testScore >=70`? ^(True) cout<<”you didn’t pass”; ^(False) `age <\
    \ 10`?^(True) cout<<you did a great job”; cout<<”you did pass”;\n\n### 4.1.1 Switch\
    \ 语句\n\n另一种实现选择控制流的 C++ 语句是 `switch` 语句（*多分支语句*）。\n\n`switch` 语句提供了一种根据表达式的值在组方案之间进行选择的方法。`switch`\
    \ 语句的形式为：\n\n`switch` 语句包含四个部分：\n\n- `Switch`\n- `Case`\n- `Default`\n- `Break`\n\
    \n其中 `Default` 和 `Break` 是可选的。通用语法可能是：\n\n```cpp\nswitch (expression)\n{\ncase\
    \ constant1:\n    statements1;\n    break;\ncase constant2:\n    statements2;\n\
    \    break;\ndefault:\n    statements;\n}\n```\n\n`switch` 求值表达式并将结果与每个 case 值进行比较。\n\
    \n关系运算符和逻辑运算符可以使用 `switch` 标签，当且仅当预期输出为 0（假）或 1（真），因为这是此类运算符唯一的可能输出。\n\n### 4.2\
    \ 重复语句\n\n重复语句控制代码块重复执行固定次数，或直到某个条件失败为止。\n\nC++ 有三种重复语句：\n\n1) *For* 语句或循环\n\n\
    2) *While* 语句或循环\n\n3) *do…while* 语句或循环\n\n### 4.2.1 for 语句 / 循环\n\n“for”语句（也称为循环）用于重复执行一组指令，直到特定条件失败。\n\
    \n通用语法为：\n\n```cpp\nfor(expression1 ; expression2 ; expression3)\n    statements;\n\
    ```\n\nfor 循环包含三个表达式：\n"
