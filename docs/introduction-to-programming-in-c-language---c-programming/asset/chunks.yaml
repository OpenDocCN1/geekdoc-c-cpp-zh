    ### **4.7\. Automatic versus static variables**


    The terms automatic and static describe what happens to local variables when a
    function returns to the calling procedure. By default, all local variables are
    automatic, meaning that they are erased when their function ends. You can designate
    a variable as automatic by prefixing its definition with the term auto.


    Eg. The two statements after main()’s opening brace declared automatic local variables:


    *main()


    {


    int i;


    auto float x;


    …


    }*


    The opposite of an automatic is a static variable. All global variables are static
    and, as mentioned, all static variables retain their values. Therefore, if a local
    variable is static, it too retains its value when its function ends-in case this
    function is called a second time. To declare a variable as static, place the static
    keyword in front of the variable when you define it. The following code section
    defines three variables i, j, k. the variable i is automatic, but j and k are
    static. Static variables can be declared and initialized within the function,
    but the initialization will be executed only once during the first call. If static
    variables are not declared explicitly, they will be declared to 0 automatically.


    *Eg. void my_fun()


    {


    static int num;


    static int count = 2;


    count=count*5;


    num=num+4;


    }*


    In the above example:


    o *During the first call of the function my_fun(), the static variable count will
    be initialized to 2 and will be multiplied by 5 at line three to have the value
    10.


    During the second call of the same function count will have 10 and will be


    multiplied by 5.*


    o *During the first call of the function my_fun(), the static variable num will
    be


    initialized to 0 (as it is not explicitly initialized) and 4 will be added to
    it at line


    four to have the value 4\. During the second call of the same function num will


    have 4 and 4 will be add to it again.*


    **N.B**. if local variables are static, their values remain in case the function
    is called again.


    ### ***4.8\. Inline functions***


    Suppose that a program frequently requires finding the absolute value of an integer
    quantity. For a value denoted by n, this may be expressed as:


    (n > 0 ? n : -n)


    However, instead of replicating this expression in many places in the program,
    it is better to define it as a function:


    *int Abs(int n)*


    *{


    return n > 0 ? n : -n;


    }*


    The function version has a number of advantages.


    It leads to a more readable program.


    It is reusable.


    The disadvantage of the function version, however is that


    Its frequent use can lead to considerable performance


    penalty due to overheads associated with calling a function. The overhead can
    be avoided by defining Abs as an ***inline*** function.


    *inline int Abs(int n)


    { Return n > 0 ? n : -n;


    }*


    The effect of this is that when Abs is called, the compiler, instead of generating
    code to call Abs, expands the program body and substitutes the body of Abs in
    place of the call. While essentially the same computation is performed, no function
    call is involved and hence no stack frame is allocated.


    The "inline" keyword is merely a hint to the compiler or development environment.


    Not every function can be inlined. Some typical reasons why inlining is sometimes
    not done include:


    the function calls itself, that is, is recursive


    the function contains loops such as for(;;) or while() the function size is too
    large


    Another good reason to inline is that you can sometimes speed up your program
    by inlining the right function. Instead of calling the function every time it
    is invoked, the compiler will replace the function call with a copy of the function
    body. If it''s a small function which gets called a lot, this can sometimes speed
    things up.


    Most of the advantage of inline functions comes from avoiding the overhead of
    calling an actual function. Such overhead includes saving registers, setting up
    stack frames, and so on. But with large functions the overhead becomes less important.


    Concerning inline functions, the compiler is free to decide whether a function
    qualifies to be an inline function. If the inline function is found to have larger
    chunk (amount) of code, it will not be treated as an inline function, but as like
    other normal functions.


    Then, Why not inline everything? :Since the compiler will copy the entire function
    body every time the function is called, if it is a large function (more than three
    or four lines), inlining can increase the size of your executable program significantly.


    ### ***4.9\. Default arguments and function overloading***


    C++ has two capabilities that regular C doesn’t have. Default arguments and function
    overloading.


    **4.9.1\. Default arguments**


    Default argument is a programming convenience which removes the burden of having
    to specify argument values for all function parameters.


    Eg. You might pass a function an error message that is stored in a character array,
    and the function displays the error for a certain period of time. The prototype
    for such a function can be this:


    Void pr_msg(char note[]);


    Therefore, to request that pr_msg() display the line ‘Turn printer on’, you call
    it this way:


    Pr_msg(“Turn printer on”);


    As you write more of the program, you begin to realize that you are displaying
    one message-for instance, the ‘Turn printer on’ msgmore often than any other message.


    Instead of calling the function over and over, typing the same message each time,
    you can set up the prototype for pr_msg() so that it defaults to the ‘turn printer
    on’ message in this way:


    Void pr_msg(char note[] = “Turn printr on”);


    This makes your programming job easier. Because you would usually want pr_msg()
    to display ‘turn printer on’, the default argument list takes care of the message
    and you don’t have to pass the message when you call the function.


    For functions having more than one argument with default, the parameters with
    possible default value should be declared in the right side of the function definition
    and prototype.


    E.g.: Let us develop part of the program with default arguments. *#include…..


    void Add_Display(int x=10, int y=20, int z=30)*


    *{


    cout<< (x+y+z); }


    void Mult_Dispaly (int x, int y=70) {


    cout<< (x*y); }*


    void main() {


    int a=40, b=50, c=60;


    Add_Display(a,b,c); //will print 150 (ie 40+50+60) Add_Display(a,b); //will print
    120 (ie 40+50+30) Add_Display(a); //will print 90 (ie 40+20+30) Add_Display();
    //will print 60 (ie 10+20+30) Mult_Display(a,b) //will print 2000 (40*50) Mult_Display(a)
    //will print 2800 (40*70)


    //Mult_Display() //is invalid as there is no default for x getch();


    }


    //the following function definition is invalid as z is //a parameter without a
    default and written after y //parameters with default should always be at the
    //right side of function declaration void Mult_Dispaly (int x, int y=70, int z)


    {


    cout<< (x*y*z); }


    //thus the following function definition will be correct void Mult_Dispaly (int
    x, int z, int y=70)


    {


    cout<< (x*y*z); }


