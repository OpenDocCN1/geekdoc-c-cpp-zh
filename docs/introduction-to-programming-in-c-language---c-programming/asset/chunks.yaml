  trans: "\n其中 `buffer` 是存储输入的地址（例如，一个数组），`length` 是缓冲区的最大长度（数组的大小），而 `delimiter`\
    \ 是用于确定用户输入结束的字符，默认情况下（如果我们不包含该参数），它将是换行符（`'\\n'`）。\n\n接下面的示例将重复你在键盘上输入的任何内容。它非常简单，但可以作为向你展示如何配合字符串使用\
    \ `cin.getline` 的示例：\n\n```cpp\n// cin with strings\n#include <iostream.h> #include<conio.h>\n\
    \nint main ()\n{\n    char mybuffer [100];\n    cout << \"What's your name? \"\
    ;\n    cin.getline (mybuffer,100);\n    cout << \"Hello \" << mybuffer << \".\\\
    n\";\n    cout << \"Which is your favourite team? \";\n    cin.getline (mybuffer,100);\n\
    \    cout << \"I like \" << mybuffer << \" too.\\n\";\n    getch();\n    return\
    \ 0;\n}\n```\n\n注意在两次调用 `cin.getline` 时，我们都使用了相同的字符串标识符（`mybuffer`）。程序在第二次调用中所做的仅仅是用新引入的内容覆盖掉\
    \ `buffer` 之前的内容。\n\n如果你还记得关于通过控制台通信的章节，你会记得我们使用提取运算符（`>>`）直接从标准输入接收数据。这种方法也可以用来代替\
    \ `cin.getline` 来处理字符字符串。例如，在我们的程序中，当我们请求用户输入时，可以写成：\n\n```cpp\ncin >> mybuffer;\n\
    ```\n\n这可以得通，但这种方法具有以下 `cin.getline` 不具备的局限性：\n\n- 它只能接收单个单词（不能是完整的句子），因为这种方法将任何空白字符（包括空格、制表符、换行符和回车符）用作分隔符。\n\
    - 不允许为缓冲区指定大小。当用户输入的长度大于存放它的数组时，这会导致你的程序变得不稳定。\n\n由于这些原因，每当你需要从 `cin` 获取字符字符串时，建议使用\
    \ `cin.getline` 而不是 `cin >>`。\n\n## 将字符串转换为其他类型\n\n由于字符串可能包含其他数据类型（如数字）的表示，因此将这些内容转换为数值类型的变量可能很有用。例如，一个字符串可能包含\
    \ `\"1977\"`，但它是 5 个字符的序列，并不容易转换为单个整数数据类型。`cstdlib` (`stdlib.h`) 库提供了三个用于此目的实用函数：\n\
    \n- `atoi`: 将字符串转换为 `int` 类型。\n- `atol`: 将字符串转换为 `long` 类型。\n- `atof`: 将字符串转换为\
    \ `float` 类型。\n\n所有这些函数都接受一个参数并返回请求类型的值（`int`、`long` 或 `float`）。这些函数结合 `cin` 的\
    \ `getline` 方法，在请求数字时，比经典的 `cin>>` 方法是获取用户输入更可靠的方法：\n\n```cpp\n// cin and ato*\
    \ functions\n#include <iostream.h>\n#include <stdlib.h>\n#include<conio.h>\n\n\
    int main()\n{ \n    clrscr();\n    char mybuffer[100];\n    float price;\n   \
    \ int quantity;\n    cout << \"Enter price: \";\n    cin.getline (mybuffer,100);\n\
    \    price = atof (mybuffer);\n    cout << \"Enter quantity: \";\n    cin.getline\
    \ (mybuffer,100);\n    quantity = atoi (mybuffer);\n    cout<<\"\\nafter conversion\
    \ :\\n\";\n    cout<<\"\\nprice is : \"<<price;\n    cout<<\"\\nquantity is :\
    \ \"<<quantity; \n    cout << \"\\nTotal price: \" << price*quantity; \n    getch();\n\
    \    return 0;\n}\n```\n\n### 操作字符串的函数\n\n`cstring` 库 (`string.h`) 定义了许多函数来对 C\
    \ 风格字符串执行一些操作（如已经解释过的 `strcpy`）。这里有最常用的简要介绍：\n\n### a) 字符串长度\n\n返回字符串的长度，不包括空字符（`\\\
    0`）。`strlen(const char *string);`\n\n### b) 字符串拼接\n\n将 `src` 字符串附加到 `dest` 字符串的末尾。返回\
    \ `dest`。字符串拼接有两种形式，其中一种是将源的所有内容附加到目标，另一种是只将源的部分附加到目标。\n\n- 附加源的所有内容：`strcat(char\
    \ *dest, const char *src);`\n- 附加源的部分：`strncat(char *dest, const char *src, int\
    \ size);`\n\n其中 `size` 是要附加的字符数。\n\n### c) 字符串拷贝\n\n用 `src` 字符串覆盖 `dest` 字符串的内容。返回\
    \ `dest`。字符串拷贝有两种形式，其中一种是将源的所有内容拷贝到目标，另一种是只将源的部分拷贝到目标。\n\n- 拷贝源的所有内容：`strcpy(char\
    \ *dest, const char *src);`\n- 拷贝源的部分：`strncpy(char *dest, const char *src, int\
    \ size);`\n\n其中 `size` 是要拷贝的字符数。\n\n### d) 字符串比较\n\n比较两个字符串 `string1` 和 `string2`。字符串比较有两种形式，其中一种是比较全部内容，另一种是只比较源的部分。\n\
    \n- 比较源的所有内容：`strcmp(const char *string1, const char *string2);`\n- 比较源的部分：`strncmp(const\
    \ char *string1, const char *string2, int size);`\n\n其中 `size` 是要比较的字符数字符串比较函数返回三个值：\n\
    \n- 返回 `0` 表示字符串相等。\n- 返回负值表示第一个小于第二个。\n- 返回正值表示第一个大于第二个。\n\n## 多维数组\n\n多维数组可以描述为数组的数组。例如，一个二维数组可以被想象成统一数据类型的二维表格。\n\
    \n![](img/image158.gif)矩阵表示 3x5 个 `int` 类型的二维数组。声明这种数组的方法为：\n\n```cpp\nint matrix[3][5];\n\
    ```\n\n例如，在表达式中引用第二个元素的方法为：`matrix[1][3]`\n\n![](img/image159.gif)(数组索引始终从 0 开始）多维数组不仅限于两个索引（维度）。它们可以包含许多索引，尽管超过三个维度并不常见。只需考虑具有许多索引的数组可能需要的内存。例如：\n\
    \n```cpp\nchar century [100][365][24][60][60];\n```\n\n为世纪中的每秒分配一个 `char`，如果我们能这样声明，这将消耗大约\
    \ 3000 兆的 RAM 内存！多维数组仅仅是一种抽象，因为我们可以简单地通过在索引之间放置因子来获得相同的结果：`int matrix[3][5];`\
    \ 等于 `int matrix[15];`（3 * 5 = 15），唯一的区别是编译器为我们记录了每个虚拟维度的深度。以下两段代码作为示例，它们具有相同的结果，一个使用二维数组，另一个只使用简单数组：\n\
    \n```cpp\n\n#include <iostream.h>\n#define WIDTH 5\n#define HEIGHT 3\nint matrix\
    \ [HEIGHT][WIDTH]; int n,m;\n\nint main ()\n{\n    for (n=0;n<HEIGHT;n++)\n  \
    \      for (m=0;m<WIDTH;m++)\n        {\n            matrix [n][m]=(n+1)*(m+1);\n\
    \        }\n    return 0;\n}\n```\n\n上面的程序都没有在屏幕上产生任何输出，但它们都以下方式为名为 `matrix` 的内存块赋值：\n\
    \n![](img/image160.gif)我们使用了定义常量（`#define`）来简化程序未来可能的修改，例如，如果我们决定将数组的高度扩大到 `4`\
    \ 而不是 `3`，只需更改该行：\n\n`#define HEIGHT 3`\n\n为以下代码\n\n`#define HEIGHT 4`\n\n结构体\n"
- fmt: "\nA structure is a collection of one or more variable types grouped together\
    \ that can be referred using a single name (group name) and a member name. You\
    \ can refer to a structure as a single variable, and you also can initialize,\
    \ read and change the parts of a structure (the individual variables that make\
    \ it up).\n\nEach element (called a member) in a structure can be of different\
    \ data type. The General Syntax of structures is:\n\n```cpp\nStruct [structure\
    \ tag]\n{\n    Member definition; Member definition; …\n    Member definition;\n\
    }[one or more structure variables];\n```\n\nLet us see an example.\n\nE.g.: Structure\
    \ tag `struct Inventory`\n\n```cpp\nstruct Inventory \n{\n    char description[15];\n\
    \    char part_no[6];\n    int quantity; members of the structure float cost;\n\
    }; // all structures end with semicolon\n```\n\nAnother example might be:\n\n\
    ```cpp\nstruct Student\n{\n    char ID[8];\n    char FName[15];\n    char LName[15];\n\
    \    char Sex;\n    int age;\n    float CGPA;\n};\n```\n\nThe above “Student”\
    \ structure is aimed to store student record with all the relevant details.\n\n\
    After the definition of the structure, one can declare a structure variable using\
    \ the structure tag. If we need two variables to have the above structure property\
    \ then the declaration would be:\n\n```cpp\nstruct Inventory inv1,inv2; //or\n\
    struct Student Stud1,stud2,Stud3;\n```\n\nStructure tag is not a variable name.\
    \ Unlike array names, which reference the array as variables, a structure tag\
    \ is simply a label for the structure’s format. The structure tag `Inventory`\
    \ informs C++ that the tag called `Inventory` looks like two character arrays\
    \ followed by one integer and one float variables. A structure tag is actually\
    \ a newly defined data type that you, the programmer, defined.\n\n### Referencing\
    \ members of a structure\n\nTo refer to the members of a structure we need to\
    \ use the dot operator (`.`). The General syntax to access members of a structure\
    \ variable would be:\n\n`VarName .Member`\n\nWhere `VarName` is the varaibale\
    \ name of the structure variable and `Member` is varaibale name of the members\
    \ of the structure.\n\n**Eg:**\n\nFor the above student structure:\n\n```cpp\n\
    struct Student Stud; //declaring Stud to have the property of the Student structure\n\
    strcpy(Stud.FName,”Abebe”); //assigned Abebe as First Name\nStud.CGPA=3.21; //assignes\
    \ 3.21 as CGPA value of Abebe\nsout<<Stud.FName; //display the name\nsout<<Stud.CGPA;\
    \ // display the CGPA of Abebe\n```\n\n### Initializing Structure Data\n\nYou\
    \ can initialize members when you declare a structure, or you can initialize a\
    \ structure in the body of the program. Here is a complete program.\n\n### .\n\
    \n```cpp\nstruct cd_collection\n{\n    char title[25];\n    char artist[20];\n\
    \    int num_songs;\n    float price;\n    char date_purchased[9];\n} cd1 = {\"\
    Red Moon Men\",\"Sams and the Sneeds\", 12, 11.95,\"08/13/93\"};\n\ncout<<\"\\\
    nhere is the info about cd1\"<<endl; cout<<cd1.title<<endl;\ncout<<cd1.artist<<endl;\n\
    cout<<cd1.num_songs<<endl;\ncout<<cd1.price<<endl;\ncout<<cd1.date_purchased<<endl;\n\
    ```\n\n### .\n\nA better approach to initialize structures is to use the dot operator(`.`).\
    \ the dot operator is one way to initialize individual members of a structure\
    \ variable in the body of your program. The syntax of the dot operator is :\n\n\
    `structureVariableName.memberName`\n\nhere is an example:\n\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\n#include<string.h>\n\nvoid main()\n{\n    clrscr();\n    struct\
    \ cd_collection{\n        char title[25];\n        char artist[20];\n        int\
    \ num_songs;\n        float price;\n        char date_purchased[9];\n    }cd1;\n\
    \    //initialize members here\n    strcpy(cd1.title,\"Red Moon Men\");\n    strcpy(cd1.artist,\"\
    Sams\");\n    cd1.num_songs= 12;\n    cd1.price = 11.95f;\n    strcpy(cd1.date_purchased,\"\
    22/12/02\"); //print the data\n    cout<<\"\\nHere is the info\"<<endl;\n    cout<<\"\
    Title : \"<<cd1.title<<endl;\n    cout<<\"Artist : \"<<cd1.artist<<endl;\n   \
    \ cout<<\"Songs : \"<<cd1.num_songs<<endl; cout<<\"Price : \"<<cd1.price<<endl;\n\
    \    cout<<\"Date purchased : \"<<cd1.date_purchased; getch();\n}\n```\n\n###\
    \ Arrays of Structures\n\nArrays of structures are good for storing a complete\
    \ employee file, inventory file, or any other set of data that fits in the structure\
    \ format.\n\nConsider the following structure declaration:\n\n```cpp\nstruct Company\n\
    {\n    int employees; int registers;\n    double sales;\n}store[1000];\n```\n\n\
    In one quick declaration, this code creates 1,000 `store` structures with the\
    \ definition of the `Company` structure, each one containing three members. NB.\
    \ Be sure that your computer does not run out of memory when you create a large\
    \ number of structures. Arrays of structures quickly consume valuable information.\n\
    \nYou can also define the array of structures after the declaration of the structure.\n\
    \n```cpp\nstruct Company {\n    int employees;\n    int registers;\n    double\
    \ sales;\n}; // no structure variables defined yet\n\n#include<iostream.h>\n…\n\
    \nvoid main()\n{\n    struct Company store[1000]; //the variable is\n…\n}\n```\n\
    \n### Referencing the array\n\nThe dot operator (`.`) works the same way for arrays\
    \ as it does for variables. Unlike the case of arrays, where the whole content\
    \ could be copied to another, in structures, you can update the structure like\
    \ this:\n\n`store.employees += 3;`\n\n### the array structure\n\nThe dot operator\
    \ (`.`) works the same way for arrays as it does for variables. Unlike the case\
    \ of arrays, where the whole content could be copied to another, in structures,\
    \ you can update the structure like this:\n\n`store.employees += 3;`\n\n```cpp\n\
    #include<iostream.h>\n#include<conio.h>\n#include<stdio.h>\n#include<iomanip.h>\n\
    \nstruct inventory\n{\n    long storage;\nint accesstime;\nchar vendorcode;\n\
    float cost;\n};\n\nvoid disp_menu(void);\nstruct inventory enter_data();\nvoid\
    \ see_data(inventory disk[125],int num_items);\n\nvoid main()\n{\n    clrscr();\n\
    inventory disk[125];\nint ans;\nint num_items = 0;\n\ndo{ do\n    disp_menu();\n\
    \    cin>>ans;\n\n}while(ans<1 || ans>3);\n\nswitch(ans)\n{\ncase 1:\ndisk[num_items]\
    \ = enter_data(); num_items++;\nbreak;\n\ncase 2:\nsee_data(disk,num_items); break;\n\
    default :\nbreak;\n}\n}while(ans != 3);\n\nreturn;\n\n}//end main\n\nvoid disp_menu()\
    \ {\n\ncout<<\"\\n\\n*** Disk Inventory System ***\\n\\n\"; cout<<\"Do you want\
    \ to :\\n\\n\";\ncout<<\"\\t1\\. Enter new item in inventory\\n\\n\";\ncout<<\"\
    \\t2. See inventory data\\n\\n\";\ncout<<\"\\t3\\. Exit the program\\n\\n\";\n\
    cout<<\"What is your choice ? \";\nreturn;\n}\n\ninventory enter_data() {\n\n\
    inventory disk_item;//local variable to fill with input\ncout<<\"\\n\\nWhat is\
    \ the next drive's storage in bytes? \"; cin>>disk_item.storage;\ncout<<\"\\nWhat\
    \ is the access time in ms ? \"; cin>>disk_item.accesstime;\ncout<<\"What is the\
    \ drive's vendor code (A, B, C, or D)? \"; disk_item.vendorcode = getchar();\n\
    cout<<\"\\nWhat is the drive's cost? \";\ncin>>disk_item.cost;\ncout<<\"\\nWhat\
    \ is the drive's price? \";\ncin>>disk_item.price;\n\nreturn (disk_item);\n}\n\
    \nvoid see_data(inventory disk[125], int num_items) {\n\nint ctr;\n\ncout<<\"\\\
    n\\nHere is the inventory listing:\\n\\n\"; for(ctr=0;ctr<num_items;ctr++)\n\n\
    {\ncout<<\"Storage: \"<<disk[ctr].storage<<\"\\n\"; cout<<\"Access time: \"<<disk[ctr].accesstime<<endl;\
    \ cout<<\"Vendor code: \"<<disk[ctr].vendorcode<<\"\\n\"; cout<<\"Cost : $ \"\
    <<disk[ctr].cost<<\"\\n\";\n\ncout<<\"Price: $ \"<<disk[ctr].price<<endl;\n\n\
    }\n\nreturn;\n}\n```\n\n**ADDIS ABABA UNIVERSITY**\n\n**FACULTY OF INFORMATICS**\n\
    \n*Worksheet No 5:*\n\n1. Define `strlen` function (i.e write the function body\
    \ of `strlen`)\n\n2. Define the `strcmp` function and the `strncmp` function.\n\
    \n3. Define `strcpy` function and the `strncpy` function.\n\n4. Define `strcat`\
    \ function and the `strncat` function.\n\n5. Write a program to store the ages\
    \ of six of your friends in a single array. Store each of the six ages using the\
    \ assignment operator. print the ages on the screen\n\n6. Write a C++ program\
    \ that accepts 10 integers from the user and finally displays the smallest value\
    \ and the largest value.\n"
