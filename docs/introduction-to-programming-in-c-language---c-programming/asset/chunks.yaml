    \ data until the value of a flag changes in the loop body\n\n### *4.3\\. The continue\
    \ and break statements*\n\n4.3.1\\. The continue statement\n\nThe continue statement\
    \ terminates the current iteration of a loop and instead jumps to the next iteration.\n\
    \nIt is an error to use the continue statement outside a loop.\n\nIn while and\
    \ do while loops, the next iteration commences from the loop condition.\n\nIn\
    \ a “for” loop, the next iteration commences from the loop’s third expression.\n\
    \nE.g.:\n\nfor(int n=10;n>0;n--)\n\n{ if(n==5)\n\ncontinue; //causes a jump to\
