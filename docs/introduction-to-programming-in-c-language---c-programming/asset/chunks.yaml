    # Chapter One Introduction


    ## What is programming?


    `Programming` is a skill that can be acquired by a computer professional that
    gives him/her the knowledge of making the computer perform the required operation
    or task.


    ## Why do we need to learn computer programming?


    `Computer programming` is critical if one wants to know how to make the computer
    perform a task. Most users of a computer only use the available applications on
    the computer. These applications are produced by computer programmers. Thus if
    someone is interested to make such kind of applications, he/she needs to learn
    how to talk to the computer, which is learning computer programming.


    ## What is programming language?


    `Programming Language:` is a set different category of written symbols that instruct
    computer hardware to perform specified operations required by the designer.


    ## What skills do we need to be a programmer?


    For someone to be a programmer, in addition to basic skills in computer, needs
    to have the following major skills:


    - `Programming Language Skill`: knowing one or more programming language to talk
    to the computer and instruct the machine to perform a task.

    - `Problem Solving Skill`: skills on how to solve real world problem and represent
    the solution in understandable format.

    - `Algorithm Development`: skill of coming up with sequence of simple and human
    understandable set of instructions showing the step of solving the problem. Those
    set of steps should not be dependent on any programming language or machine.


    In every programming Language there are sets of rules that govern the symbols
    used in a programming language. These set of rules determine how the programmer
    can make the computer hardware to perform a specific operation. These sets of
    rules are called `syntax`.


    ### 1.1 Generations of programming language


    Programming languages are categorized into five generations: (1^(st), 2^(nd),
    3^(rd), 4^(th) and 5^(th) generation languages)


    These programming languages can also be categorized into two broad categories:
    low level and high level languages.


    - Low level languages are machine specific or dependent.

    - High level languages like `COBOL`, `BASIC` are machine independent and can run
    on variety of computers.


    From the five categories of programming languages, first and second generation
    languages are low level languages and the rest are high level programming languages.


    The higher the level of a language, the easier it is to understand and use by
    programmers.


    Languages after the forth generation are refereed to as a very high level languages.


    #### 1.1.1 First Generation (Machine languages, 1940’s):


    Difficult to write applications with.


    Dependent on machine languages of the specific computer being used. Machine languages
    allow the programmer to interact directly with the hardware, and it can be executed
    by the computer without the need for a translator.


    Is more powerful in utilizing resources of the computer.


    Gives power to the programmer.


    They execute very quickly and use memory very efficiently.


    #### 1.1.2 Second Generation (Assembly languages, early 1950’s):


    Uses symbolic names for operations and storage locations. A system program called
    an `assembler` translates a program written in assembly language to machine language.


    Programs written in assembly language are not portable. i.e., different computer
    architectures have their own machine and assembly languages.


    They are highly used in system software development.


    #### 1.1.3 Third Generation (High level languages, 1950’s to 1970’s):


    Uses English like instructions and mathematicians were able to define variables
    with statements such as `Z = A + B`


    Such languages are much easier to use than assembly language. Programs written
    in high level languages need to be translated into machine language in order to
    be executed.


    The use of common words (reserved words) within instructions makes them easier
    to learn.


    All third generation programming languages are procedural languages. In procedural
    languages, the programmer is expected to specify what is required and how to perform
    it.


    #### 1.1.4 Fourth Generation (since late 1970’s):


    Have a simple, English like syntax rules; commonly used to access databases.


    Forth generation languages are non-procedural languages.


    The non-procedural method is easier to write, but you have less control over how
    each task is actually performed.


    In non-procedural languages the programmer is not required to write traditional
    programming logic. Programmers concentrate on defining the input and output rather
    than the program steps required.


    - For example, a command, such as `LIST`, might display all the records in a file
    on screen, separating fields with a blank space. In a procedural language, all
    the logic for inputting each record, testing for end of file and formatting each
    column on screen has to be explicitly programmed.


    Forth generation languages have a minimum number of syntax rules. This saves time
    and free professional programmers for more complex tasks.


    Some examples of 4GL are structured query languages (`SQL`), report generators,
    application generators and graphics languages.


    #### 1.1.5 Fifth Generation (1990’s):


    These are used in artificial intelligence (AI) and expert systems; also used for
    accessing databases.


    5GLs are “natural” languages whose instruction closely resembles human speech.
    E.g. “get me Jone Brown’s sales figure for the 1997 financial year”.


    5GLs require very powerful hardware and software because of the complexity involved
    in interpreting commands in human language.


    ## 1.2 Overview of Computers and Computer Organization.


    Regardless of differences in physical appearance, virtually every computer may
    be envisioned as being divided into six logical units or sections:


    - `Input Unit`: it obtains information from various input devices and places this
    information at the disposal of the other units so that the information may be
    processed or stored.

    - `Output Unit`: it takes information that has been processed by the computer
    and places it on various output devices to make the information available for
    use outside the computer.

    - `Memory unit`: it retains information that has been entered through the input
    unit, so the information may be made immediately available for processing when
    it is needed. The memory unit also retains processed information until that information
    can be placed on output devices by the output unit.

    - `Central Processing Unit (CPU)`: it is the computer’s coordinator and is responsible
    for supervising the operations of the other sections. CPU tells the input unit
    when information should be read into memory, tells `ALU` when information from
    the memory should be used in calculation and tells output unit when to send information
    from the memory to certain output devices.

    - `Arithmetic and Logic unit`: is a part found inside the Central Processing Unit
    and is responsible for performing calculations such as addition, subtraction,
    multiplication and division. It also performs comparisons.

    - `Secondary Storage device`: Programs or data used by other units normally are
    placed on secondary storage devices (such as disks) until they are needed, possibly
    hours, days, months, or even years later.


    ## 1.3 The evolution of Operating Systems.


    Early computers were capable of performing only one job at a time. This form of
    computer operation is often called single-user batch processing. The computer
    runs a single program at a time while processing data in groups or batches.


    As computers became more powerful, it became evident that single-user batch processing
    rarely utilizes the computer’s resources.


    Therefore, computer developers thought that many jobs or tasks from different
    programs or applications could be made to share the resources of the computer
    to achieve better utilization. This concept is called multiprogramming.

