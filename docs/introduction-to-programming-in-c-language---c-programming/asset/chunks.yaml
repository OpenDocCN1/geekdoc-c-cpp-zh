    ### 2.5.2. Constants


    A constant is any expression that has a **fixed value**.


    Like variables, constants are data storage locations in the computer memory. But,
    constants, unlike variables their content can not be changed after the declaration.


    Constants must be initialized when they are created by the program, and the programmer
    can’t assign a new value to a constant later. C++ provides two types of constants:
    literal and symbolic constants. **Literal constant**: is a value typed directly
    into the program wherever it is needed.


    E.g.: `int num = 43;`


    `43` is a literal constant in this statement:


    **Symbolic constant**: is a constant that is represented by a name, similar to
    that of a variable. But unlike a variable, its value can’t be changed after initialization.


    E.g.:


    `Int studentPerClass =15;`


    `students = classes * studentPerClass;`


    `studentPerClass` is a symbolic constant having a value of 15.


    And 15 is a literal constant directly typed in the program. In C++, we have two
    ways to declare a symbolic constant. These are using the `#define` and the `const`
    key word.


    #### 2.5.2.1. defining constants with #define


    The `#define` directive makes a simple text substitution. The define directive
    can define only integer constants E.g.: `#define studentPerClass 15`


    In our example, each time the preprocessor sees the word `studentPerClass`, it
    inserts 15 into the text.


    #### 2.5.2.2. defining constants with the const key word


    Here, the constant has a type, and the compiler can ensure that the constant is
    used according to the rules for that type. E.g.: `const unsigned short int studentPerClass
    = 15;`


