    \ of each subscript. i.e. the number of elements in the array.\n\nSo the general\
    \ syntax for the declaration is:\n\n```cpp\nDataTypename arrayname [array size];\n\
    ```\n\nThe expression `array size`, which is the number of elements, must be a\
    \ constant such as `10` or a symbolic constant declared before the array declaration,\
    \ or a constant expression such as `10*sizeof (int)`, for which the values are\
    \ known at the time compilation takes place.\n\n**Note**: `array size` cannot\
    \ be a variable whose value is set while the program is running.\n\nThus to declare\
    \ an integer with size of 10 having a name of `num` is:\n\n```cpp\nint num [10];\n\
    ```\n\nThis means: ten consecutive two byte memory location will be reserved with\
    \ the name `num`.\n\nThat means, we can store 10 values of type `int` without\
    \ having to declare 10 different variables each one with a different identifier.\
    \ Instead of that, using an `array` we can store 10 different values of the same\
    \ type, `int` for example, with a unique identifier.\n\n### 5.3 Initializing Arrays\n\
    \nWhen declaring an array of local scope (within a function), if we do not specify\
    \ the array variable will not be initialized, so its content is undetermined until\
    \ we store some values in it.\n\nIf we declare a global array (outside any function)\
    \ its content will be initialized with all its elements filled with zeros. Thus,\
    \ if in the global scope we declare:\n\n```cpp\nint day [5];\n```\n\nevery element\
    \ of `day` will be set initially to `0`:\n\n![](Images/image00155.gif)\n\nBut\
    \ additionally, when we declare an Array, we have the possibility to assign initial\
    \ values to each one of its elements using curly brackets `{ }`. For example:\n\
    \n```cpp\nint day [5] = { 16, 2, 77, 40, 12071 };\n```\n\nThe above declaration\
    \ would have created an array like the following one:\n\n![](Images/image00156.gif)\n\
    \nThe number of elements in the array that we initialized within curly brackets\
    \ `{ }` must be equal or less than the length in elements that we declared for\
    \ the array enclosed within square brackets `[]`. If we have less number of items\
    \ for the initialization, the rest will be filled with zero. For example, in the\
    \ example of the `day` array we have declared that it had 5 elements and in the\
    \ list of initial values within curly brackets `{ }` we have set 5 different values,\
    \ one for each element. If we ignore the last initial value (`12071`) in the above\
    \ initialization, `0` will be taken automatically for the last array element.\n\
    \nBecause this can be considered as useless repetition, C++ allows the possibility\
    \ of leaving empty the brackets `[]`, where the number of items in the initialization\
    \ bracket will be counted to set the size of the array.\n\n```cpp\nint day []\
    \ = { 1, 2, 7, 4, 12,9 };\n```\n\nThe compiler will count the number of initialization\
    \ items which is `6` and set the size of the array `day` to `6` (i.e.: `day[6]`)\n\
    \nYou can use the initialization form only when defining the array. You cannot\
