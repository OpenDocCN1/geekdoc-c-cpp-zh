  trans: "\n\n`Interpreters`（解释器）：是一种翻译单条高级语言语句并执行它，然后处理下一行高级语言的计算机程序。例如 `QBASIC`、`Lisp`\
    \ 等。\n\n# 1.9. 程序创建机制 (C++)\n\nC++程序的执行通常会经过五个阶段：这些是 `edit`（编辑）、`preprocess`（预处理）、`compile`（编译）、`link`（链接）和\
    \ `load`（加载）：\n\n`Edit`：通过编辑器程序完成。程序员使用编辑器输入 C++ 语句并在必要时进行修正。然后将程序源文件存储在次级设备（如磁盘）上，扩展名为\
    \ `.cpp`。\n\n程序编辑完成后后，C++ 主要分三个阶段进行编译：`preprocessing`（预处理）、`translation to object\
    \ code`（翻译为目标代码）和 `linking`（链接）（后两个阶段通常被认为是“编译”过程）。\n\n`Preprocess`：在 C++ 系统中，`preprocessor`程序会在编译器的翻译阶段开始之前自动执行。C++\
    \ 预处理器遵循被称为 `preprocessor directives`（预处理器指令）的命令，这些指令指示在编译前对程序进行某些操作。预处理器在程序转换为机器语言之前由编译器调用。C++\
    \ 预处理器会扫描程序文本并执行由预处理器指令指定的指令（例如 `#include`）。结果是修改后的程序文本，该文本不再包含任何指令。\n\n`Compile`：然后，C++\
    \ 编译器会翻译程序代码。编译器可能是一个真正的 C++ 编译器，用于生成原生的（汇编或机器）代码。由于程序引用了未作为程序一部分定义的库例程，结果可能是不完整的。例如\
    \ `<<` 运算符，它实际上定义在另一个独立的 IO 库中。\n\n`Linking`：C++ 程序通常包含对其他处定义的函数和数据的引用，例如标准库中的内容。C++\
    \ 编译器生成的目标代码通常由于这些缺失部分而包含“空洞”。链接器（linker）将目标代码与缺失函数的代码链接起来，生成一个可执行映像（没有缺失部分）。通常，`linker`\
    \ 通过将目标代码与程序可能引用的任何库模块的目标代码链接起来来完成目标代码。最终结果是一个可执行文件。\n\n`Loading`：加载器从磁盘获取可执行文件并将其传输到内存中。支持程序的共享库的附加组件也会被加载。最后，计算机在\
    \ CPU 的控制下执行程序。\n\n![](img/image00115.gif)\n\n在实践中，所有这些步骤通常由单个命令触发，用户甚至不会看到生成的中间文件。\n\
    \n## 阿迪斯亚贝巴大学信息学院 - 工作单 1\n\n课程名称：程序设计 / 编程基础 课程号：`Comp 271` / `CSCE 232`\n\n\
    请为下列每个问题编写一个流程图：\n\n1) 接收一个数字并判断它是奇数还是偶数。\n2) 从键盘获取两个数字，判断并显示其中哪一个较大（如果存在的话）。\n\
    3) 接收 3 个数字，并按从小到大的顺序显示它们。\n4) 将 1 到 100 之间的数字相加并显示和。\n5) 相加 0 到用户给出的任意正整数之间的偶数。\n\
    6) 计算用户提供的两个数字的平均值。\n7) 计算用户提供的三个数字的平均值、最大值、最小值和和。\n8) 根据用户提供的半径计算圆面积。\n9) 使用第三个变量交换两个变量的内容。\n\
    10) 不使用第三个变量交换两个变量的内容。\n11) 从键盘读取一个整数值，并显示消息指示该数是奇数还是偶数。\n12) 从键盘读取 10 个 0-100\
    \ 范围内的整数，统计其中有多少大于 50，并显示此结果。\n13) 从用户处获取一个整数并显示该数的阶乘。\n\n# 第二章 C++ 基础\n\n###\
    \ 2.1. C++ 程序的组成部分\n\n为了理解简单 C++ 程序的各个部分，让我们来看以下代码：\n\n```cpp\n#include<iostream.h>\
    \ \n#include<conio.h> \nvoid main()\n{\n    cout<<\"\"\\n Hello World!\"; \n \
    \   getch();\n}\n```\n\n任何 C++ 程序文件都应以 `.CPP` 作为文件扩展名保存。\n\n直接在编辑器中输入程序，将文件保存为\
    \ `hello.cpp`，编译并运行它。它将在计算机屏幕上打印 Hello World! 字。\n\n第一个字符是 `#`。这个字符是预处理器的信号。每当你启动编译器时，预处理器都会遍历程序并寻找井号\
    \ (`#`) 符号，并在编译器运行之前对这些行进行操作。\n\n`include` 指令是一个预处理器指令，它指示编译器将角括号中指定的文件的副本包含在源码中。\n\
    \n如果未指定文件路径，预处理器将在 `c:\\tc\\include\\` 文件夹或编辑器所在位置的 `include` 文件夹下查找文件。\n\n第 1\
    \ 行的作用（即 `include<iostream.h>`）是将 `iostream.h` 文件包含程序中，就像程序员实际输入了它一样。\n\n当程序启动时，会自动调用\
    \ `main()` 函数。每个 C++ 程序都有一个 `main()` 函数。\n\n此处 `main()` 的返回值类型为 `void`，这意味着 `main`\
    \ 函数将不向调用者（即操作系统）返回数值。\n\n`main` 函数可以被设置为向操作系统返回一个值。\n\n左大括号 `{` 标志着 main 函数主体的开始，对应的右大括号\
    \ `}` 标志着 main 函数主体的结束。每个左大括号都需要一个对应的右大括号。\n\n我们在括号之间的行是语句，或称为函数体。\n\n语句是一个计算步骤，可能会产生一个值或与输入输出流进行交互。\n\
    \n单个语句的结束以分号 (`;`) 结尾。\n\n上述示例中的语句导致字符串“Hello World!”发送到 `cout` 流，它将在计算机屏幕上显示它。\n\
    \n### 2.2. 简述 cout 和 cin\n\n`cout` 是一个用于将数据打印到屏幕的对象。\n\n要在屏幕上打印一个值，写入 `cout`，后跟插入运算符（也称为输出重定向运算符\
    \ `<<`）以及要在屏幕上打印的对象。\n\n语法：`cout<<Object;`\n\n右侧的对象可以是：\n• 字面量字符串：“Hello World”\n\
    • 变量：内存中的一个占位符\n\n`cin` 是一个用于从键盘获取输入的对象。要从键盘获取输入，写入 `cin`，后跟输入重定向运算符 (`>>`) 和用于保存输入值的对象名。\n\
    \n语法：`cin>>Object`\n\n`cin` 将从键盘获取值并将其存储在内存中。因此 `cin` 语句需要一个变量作为保留的内存占位符。\n\n\
    `<<` 和 `>>` 都返回其右操作数作为结果，允许将多次输入或多次输出操作组合到一个语句中。以下示例将说明如何执行多次输入和输出：\n\n例如：\n\n\
    `cin>>var1>>var2>>var3;`\n\n这里将为变量输入三个不同的值。每个变量之间用空格、制表符或换行符分隔。\n\n`cout<<var1<<\"\
    , \"<<<<var2<<\" and \"<<<<var3;`\n\n在这里将打印三个变量的值，第一个和第二个变量之间有一个“，”（逗号），在第二个和第三个变量之间有“and”单词。\n\
    \n### 2.3. 在 C++ 程序中添加注释\n\n注释是解释程序某些方面的描述性文本。\n\n"
- fmt: "\nProgram comments are text totally ignored by the compiler and are only intended\
    \ to inform the reader how the source code is working at any particular point\
    \ in the program.\n\nC++ provides two types of comment delimiters:\n\n- **Single\
    \ Line Comment**: Anything after `//` {double forward slash} (until the end of\
    \ the line on which it appears) is considered a comment.\n  - **Eg**: `cout<<var1;\
    \ //this line prints the value of var1` \n  \n- **Multiple Line Comment**:: Anything\
    \ enclosed by the pair `/*` and `*/` is considered a comment.\n  - **Eg**:\n```cpp\n\
    /*this is a kind of comment where\nMultiple lines can be enclosed in\none C++\
    \ program */\n```\n\nComments should be used to enhance (not to hinder) the readability\
    \ of a program. The following two points, in particular, should be noted:\n\n\
    - A comment should be easier to read and understand than the code which it tries\
    \ to explain. A confusing or unnecessarilycomplex comment is worse than no comment\
    \ at all. Over-use of comments can lead to even less readability. A program which\
    \ contains so much comment that you can hardly see the code can by no means be\
    \ considered readable. Use of descriptive names for variables and other entities\
    \ in a program, and proper indentation of the code can reduce the need for using\
    \ comments.\n\n## 2.4. A brief look at functions\n\nIn general, a function is\
    \ a block of code that performs one or more actions.\n\nMost functions are called,\
    \ or invoked, during the course of the program, which is after the program starts\
    \ execution.\n\nProgram commands are executed line by line, in the order in which\
    \ they appear in the source code, until a function is reached. The program then\
    \ branches off to execute the function. When the function finishes, it returns\
    \ control to the line of code immediately following the call to the function.\n\
    \nFunctions consist of a **header** and a **body**. The header, in turn, is made\
    \ up of the **return type**, the **function name**, and the **parameters** to\
    \ that function.\n\nThe parameters to a function allow values to be passed into\
    \ the function. A parameter is a declaration of the type of value that will be\
    \ passed to the function; the actual value passed by the calling function is called\
    \ **arguments**.\n\nLet us have an example:\n```cpp\n#include<iostream.h> \n#include<conio.h>\
    \ \nvoid main()\n{\n    cout<<\"\\n In main function\"; \n    demoFunction();\n\
    \    cout<<\"\\n Back in main function\"; \n    getch();\n}\n\nvoid demoFunction()\n\
    {\n    cout<<\"\\n demoFunction\";\n}\n```\n\nFunctions return either a value\
    \ or void (i.e. they return nothing). A function that adds two integers might\
    \ return the sum, and thus would be defined to return an integer value. A function\
    \ that just prints a message has nothing to return and would be declared to return\
    \ void.\n\nA function may return a value using a **return** statement; a return\
    \ statement also causes the function to exit.\n\nIf there is no return statement\
    \ at the end of a function, the function will automatically return void.\n\n##\
    \ 2.5. Variables and Constants\n\n### 2.5.1. Variables\n\nA variable is a reserved\
    \ place in memory to store information in. A variable will have three components:\n\
    \nVariables are used for holding data values so that they can be used in various\
    \ computations in a program.\n\nAll variables have three important properties:\n\
    \n- **Data Type**: a type which is established when the variable is defined. (e.g.\
    \ integer, real, character etc). Data type describes the property of the data\
    \ and the size of the reserved memory\n- **Name**: a name which will be used to\
    \ refer to the value in the variable. A unique identifier for the reserved memory\
    \ location\n- **Value**: a value which can be changed by assigning a new value\
    \ to the variable.\n\n#### 2.5.1.1. Fundamental Variable types\n\nSeveral other\
    \ variable types are built into C++. They can be conveniently classified as **integer**,\
    \ **floating-point** or **character** variables.\n\nFloating-point variable types\
    \ can be expressed as fraction i.e. they are “real numbers”.\n\nCharacter variables\
    \ hold a single byte. They are used to hold 256 different characters and symbols\
    \ of the ASCII and extended ASCII character sets.\n\nThe type of variables used\
    \ in C++ program are described in the next table, which lists the variable type,\
    \ how much room:\n\n| Type | Length | Range |\n| :--- | :--- | :--- |\n| unsigned\
    \ char | 8 bits | 0 to 255 |\n| char | 8 bits | -128 to 127 |\n| enum | 6 bits\
    \ | -32,768 to 32,767 |\n| unsigned int | 16 bits | 0 to 65,535 |\n| short int\
    \ | 16 bits | -32,768 to 32,767 |\n| int | 16 bits | -32,768 to 32,767 |\n| unsigned\
    \ long | 32 bits | 0 to 4,294,967,295 |\n| long | 32 bits | -2,147,483,648 to\
    \ 2,147,483,647 |\n| float | 32 bits | -3.4x10 to 3.4x10^(+38) |\n| double | 64\
    \ bits | -1.7x10^(-308) to 1.7x10^(+308) |\n| long double | 80 bits | -3.4x10^(-4932)\
    \ to 1.1x10^(+4932) |\n| bool | 8 bits | true or false (top 7 bits are ignored)\
    \ |\n\n#### 2.5.1.2. Signed and Unsigned\n\nSigned integers are either negative\
    \ or positive. Unsigned integers are always positive.\n\nBecause both signed and\
    \ unsigned integers require the same number of bytes, in case of unsigned all\
    \ 4 bits can be used to represent the magnitude. If we use signed, we can use\
    \ the first bit to represent the sign where if the value of the first bit is 0\
    \ the number is positive if the value is 1 the number is negative. In this case\
    \ we will be left with three bits to represent the magnitude.\n\n#### 2.5.1.3.\
    \ Declaring Variables\n\nVariables can be created in a process known as **declaration**.\
    \ Syntax: `DataType Variable_Name;`\n\nThe declaration will instruct the computer\
    \ to reserve a memory location with the name and size specified during the declaration.\n\
    \nGood variable names indicate the purpose of the variable or they should be self\
    \ descriptive.\n\nE.g. `int myAge; //variable used to store my age`\n\nThe name\
    \ of a variable sometimes is called an identifier which should be unique in a\
    \ program.\n\nCertain words are reserved by C++ for specific purposes and can\
    \ not be used as identifiers.\n\nThese are called **reserved words** or **keywords**\
    \ and are summarized in the following table:\n\nasm, continue, float, new, signed,\
    \ try, auto, default, for, operator, sizeof, typedef, break, delete, friend, private,\
    \ static, union, case, do, goto, protected, struct, unsigned, catch, double, if,\
    \ public, switch, virtual, char, else, inline, register, template, void, class,\
    \ enum, int, return, this, volatile, const, extern, long, short, throw, while\n\
    \nOne or more letters, digits or underlined symbols. The length of an identifier\
    \ is not limited.\n\nNeither space nor marked letters can be part of an identifier.\n\
    \nOnly letters, digits and underlined characters are valid. Variable identifiers\
    \ should always begin with a letter or an underscore. By any means they should\
    \ begin with a digit.\n\n#### 2.5.1.4. Initializing Variables\n\nWhen a variable\
    \ is assigned a value at the time of declaration, it is called variable initialization.\n\
    \nThis is identical with declaring a variable and then assigning a value to the\
    \ variable immediately after declaration. The syntax: `DataType variable name\
    \ = initial value;`\n"
