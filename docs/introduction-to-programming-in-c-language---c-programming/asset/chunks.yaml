    while(!indata.eof())// check for eof\n{\nindata.get(c); cout<<c;\n}\n\nindata.close();\n\
    \ngetch();\n```\n\n### 7.4.1.4: 文件指针及其操纵符\n\n- 每个文件都有两个指针：一个称为`输入指针`（input pointer），另一个称为`输出指针`（output\
    \ pointer）。输入指针被称为`get 指针`（get pointer），输出指针被称为`put 指针`（put pointer）。\n- 当输入和输出操作发生时，会根据访问模式自动设置相应的指针。\n\
    - 例如，当我们以读取模式打开文件时，文件指针会自动设置为文件的开头。\n- 当我们以追加模式打开文件时，文件指针会自动设置为文件的末尾。\n- 在 C++\
    \ 中，有一些操纵符可以用来控制指针的移动。可用的操纵符有：\n  1. `seekg()`\n  2. `seekp()`\n  3. `tellg()`\n\
    \  4. `tellp()`\n\n1. `seekg()`：将`get 指针`（即`输入指针`）移动到指定位置。例如，`infile.seekg(5);`\
    \ 将文件指针移动到从起始点的第 5 个字节。\n2. `seekp()`：将`put 指针`（`输出指针`）移动到指定位置，例如：`outfile.seekp(5);`\n\
    3. `tellg()`：给出`get 指针`（`输入指针`）当前的位置。\n4. `tellp()`：给出`put 指针`（`输出指针`）当前的位置，例如\
    \ `ofstream fileout;` `fileout.open(“c:\\\\test.txt”,ios::app); int length = fileout.tellp();`\n\
    \n- 通过上述语句 `length`，文件的总字节数被赋值给整数变量 `length`。由于文件是以追加模式打开的，这意味着文件指针位于文件的最后部分。\n\
    - 现在让我们看看 `seekg()` 函数的实际用法\n\n```cpp\n#include<fstream.h> #include<conio.h> #include<stdlib.h>\
    \ void main()\n{\nclrscr();\nfstream fileobj;\nchar ch; //holds A through Z\n\
    //以以输出和输入模式打开文件 fileobj.open(\"c:\\\\alph.txt\",ios::out|ios::in); if(fileobj.fail())\n\
    {\ncerr<<\"\\nError opening alph.txt\"; getch();\nexit(1);\n}\n//现在将字符写入文件 for(ch\
    \ = 'A'; ch <= 'Z'; ch++)\n{\nfileobj<<ch;\n}\nfileobj.seekg(8L,ios::beg);//跳过\
    \ 8 个字母，指向 I fileobj>>ch;\ncout<<\"\\nThe 8th character is : \"<<ch;\nfileobj.seekg(16L,ios::beg);//跳过\
    \ 16 个字母，指向 Q fileobj>>ch;\ncout<<\"\\nThe 16th letter is : \"<<ch;\nfileobj.close();\n\
    getch();\n}\n```\n\n-  若要指向数据文件的末尾，你可以使用 `seekg()` 函数将文件指针定位在最后一个字节。该语句将文件指针置于文件的最后一个字节。`Fileobj.seekg(0L,ios::end);`\n\
    - 此 `seekg()` 函数的字面意思是“从文件末尾移动文件指针 0 个字节”。文件指针现在指向文件结束标记，但你可以向后 `seekg()` 以找到文件中的其他数据。\n\
    - 下面的程序预设是反向读取“c:\\alph.txt”文件，在向文件中向回跳过时打印每个字符。\n- 确保程序中的 `seekg()` 从*当前*位置向后移动两个字节，而不是像之前的程序那样从开头或结尾移动。程序末尾的\
    \ for 循环需要执行“向后跳两个字节，向前读取一个字节”的方法来反向跳过文件。\n\n```cpp\n#include<fstream.h> #include<conio.h>\
    \ #include<stdlib.h>\nvoid main() {\nclrscr();\nifstream indata; int ctr=0;\n\
    char inchar;\nindata.open(\"c:\\\\alph.txt\",ios::in); if(indata.fail())\n{\n\
    cerr<<\"\\nError opening alph.txt\"; getch();\nexit(1);\n}\nindata.seekg(-1L,ios::end);//指向文件中的最后一个字节\
    \ for(ctr=0;ctr<26;ctr++)\n{\nindata>>inchar;\nindata.seekg(-2L,ios::cur); cout<<inchar;\n\
    }\nindata.close();\ngetch();\n}\n```\n\n### 文本文件与二进制文件（比较）\n\n- 文件访问的默认模式是`文本模式`（text\
    \ mode）。文本文件是 ASCII 文件，与大多数其他编程语言和应用程序兼容。读取 ASCII 文件的程序可以读取你作为 C++ 文本文件创建的数据。\n\
    - 如果你指定二进制访问，C++ 将以二进制格式创建或读取文件。二进制数据文件是“被压缩的”——也就是说，它们占用的空间比文本文件少。使用二进制文件的缺点是其他程序并不总是能读取这些数据文件。只有编写用于访问二进制文件的\
    \ C++ 程序才能读取和写入它们。二进制文件的优点是节省了磁盘空间。\n\n### 7.4.2: 随机访问概念\n\n- 随机访问允许你读取或写入文件的任何部分，而无需读取整个文件。\n\
    - 使用固定长度记录，你的计算机可以计算出磁盘上的位置。\n\n### 7.2.2.1 打开访问文件\n\n- C++ 中的顺序文件和随机文件实际上没有区别。区别在于你用于访问和更新的方法。\n\
    - `ostream` 成员函数 `write` 从特定位置开始向指定的流输出固定数量的字节。\n- 当流与文件关联时，`write` 函数在`put 指针`指定的位置写入数据。\n\
    - `istream` 成员函数 `read` 从指定的流输入固定数量的字节到内存区域。\n- 当流与文件关联时，`read` 函数在`get 指针`指定的位置输入。\n\
    \n- `write` 的语法：`fileobject.write((char*) &NameOfObject, sizeof(Object))`\n- `write`\
    \ 函数的第一个参数的数据类型为 `const char*`。`write` 的第二个参数是一个整数，用于指定要写入的字节数。\n\n#### 向随机访问文件随机写入\n\
    \n- 下面示例展示了如何向随机访问文件写入记录。\n\n```cpp\n#include<fstream.h> #include<conio.h> #include<stdlib.h>\
    \ struct stud_info{\nint id;\nchar name[20]; char fname[20]; float CGPA;\n}student;\n\
    \nvoid main() {\nclrscr();\nchar filename[15];\nofstream outdata;\ncout<<\"\\\
    nenter file name : \"; cin>>filename;\noutdata.open(filename,ios::out); if(outdata.fail())\n\
    {\ncerr<<\"\\nError opening \"<<filename; getch();\nexit(1);\n}\n\n//stud_info\
    \ student;\n//在此接受数据\ncout<<\"\\nEnter student id : \";\ncin>>student.id;\ncout<<\"\
    \\nEnter student name : \"; cin>>student.name;\ncout<<\"\\nEnter student father\
    \ name : \"; cin>>student.fname;\ncout<<\"\\nEnter student CGPA : \"; cin>>student.CGPA;\n\
    \n//现在写入文件\noutdata.seekp(((student.id)-1) * sizeof(student)); outdata.write((char*)\
    \ &student, sizeof(student)); outdata.close();\n\ncout<<\"\\nData has been saved\"\
    ;\n\ngetch();\n}\n```\n\n"
