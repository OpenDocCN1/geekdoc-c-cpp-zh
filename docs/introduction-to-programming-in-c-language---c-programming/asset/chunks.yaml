    **int arr [] = {16, 2, 77, 40, 12071}; int ar [4];


    ar[]={1,2,3,4};//not allowed arr=ar;//not allowed**


    Note: when initializing an array, we can provide fewer values than the array elements.
    E.g. int a [10] = {10, 2, 3}; in this case the compiler sets the remaining elements
    to zero.


    ### ***5.4\. Accessing and processing array elements***


    In any point of the program in which the array is visible we can access individually
    anyone of its elements for reading or modifying it as if it was a normal variable.
    To access individual elements, index or subscript is used. The format is the following:


    *name* [ *index* ]


    In c++ the first element has an index of 0 and the last element has an index,
    which is one less the size of the array (i.e. arraysize-1). Thus, from the above
    declaration, day[0] is the first element and day[4] is the last element.


    Following the previous examples where ***day*** had 5 elements and each element
    is of type int, the name, which we can use to refer to each element, is the following
    one:


    ![](Images/image00157.gif)


    For example, to store the value 75 in the third element of the array variable
    ***day*** a suitable sentence would be:


    **day[2] = 75; //**as the third element is found at index 2


    And, for example, to pass the value of the third element of the array variable
    ***day*** to the variable a , we could write:


    **a = day[2];**


    Therefore, for all the effects, the expression ***day[2]*** is like any variable
    of type int with the same properties. Thus an array declaration enables us to
    create a lot of variables of the same type with a single declaration and we can
    use an index to identify individual elements.


    Notice that the third element of day is specified ***day[2]*** , since first is
    ***day[0]*** , second ***day[1]*** , and therefore, third is ***day[2]*** . By
    this same reason, its last element is ***day [4]***. Since if we wrote day [5],
    we would be acceding to the sixth element of day and therefore exceeding the size
    of the array. This might give you either error or unexpected value depending on
    the compiler.


    In C++ it is perfectly valid to exceed the valid range of indices for an Array,
    which can cause certain detectable problems, since they do not cause compilation
    errors but they can cause unexpected results or serious errors during execution.
    The reason why this is allowed will be seen ahead when we begin to use pointers.


    At this point it is important to be able to clearly distinguish between the two
    uses the square brackets [ ] have for arrays.


    o One is to set the size of arrays during declaration


    o The other is to specify indices for a specific array element when accessing
    the elements of the array


    We must take care of not confusing these two possible uses of brackets [ ] with
    arrays:


    Eg: int day[5]; *// declaration of a new Array (begins with a type name)*


    day[2] = 75; *// access to an element of the Array.*


    Other valid operations with arrays in accessing and assigning:


    int a=1;


    day [0] = a;


    day[a] = 5;


    b = day [a+2];


    day [day[a]] = day [2] + 5;


    day [day[a]] = day[2] + 5;


    Eg: A*rrays example ,display the sum of the numbers in the array*


    #include <iostream.h>


    int day [ ] = {16, 2, 77, 40, 12071}; int n, result=0;


    void main ()


    {


    for ( n=0 ; n<5 ; n++ )


    {


    result += day[n]; }


    cout << result;


    getch();


    }


    ### **5.5\. Arrays as parameters**


    *At some moment we may need to pass an array to* a function as a parameter*. In
    C++ it is not possible to pass by value a complete block of memory as a parameter,
    even if it is ordered as an array, to a function, but it is allowed to pass its*
    address*, which has almost the same practical effect and is a much faster and
    more efficient operation.


    In order to admit arrays as parameters the only thing that we must do when declaring
    the function is to specify in the argument the base **type** for the array that
    it contains, an identifier and a pair of void brackets **[]** . For example, the
    following function:*


    void procedure (int arg[])


    *admits a parameter of type "Array of **int** " called **arg** . In order to pass
    to this function an array declared as:*


    int myarray [40];


    *it would be enough with a call like this:*


    procedure (myarray); Here you have a complete example: *// arrays as parameters*


    #include <iostream.h>


    #include <conio.h>


    void printarray (int arg[], int length) {


    for (int n=0; n<length; n++) cout << arg[n] << " "; cout << "\n";


    }


    void mult(int arg[], int length) {


    for (int n=0; n<length; n++) arg[n]=2*arg[n];


    }


    void main () {


    int firstarray[] = {5, 10, 15};


    int secondarray[] = {2, 4, 6, 8, 10};


    printarray (firstarray,3);


    printarray (secondarray,5);


    mult(firstarray,3);


    cout<<”first array after being doubled is\n”; printarray (firstarray,3);


    getch()


    }'
