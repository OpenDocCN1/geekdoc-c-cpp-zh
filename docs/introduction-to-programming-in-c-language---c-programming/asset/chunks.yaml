    …


    }

    ```


    Immediately after the second line, whenever the compiler encounters the word `USHORT`
    it will substitute is with `unsigned short int`.


    ### 2.5.1.7. Wrapping around in signed integers


    A signed integer differs from an unsigned integer in that half of its value is
    negative. When the program runs out of positive numbers, the program moves into
    the largest negative numbers and then counts back to zero.


    E.g.: `32767 + 1 -32769-8 0`


    ### 2.5.1.8. Wrapping around in unsigned integers


    When an unsigned integer reaches its maximum value, it wraps around and starts
    over.


    E.g.: `65535 + 1 0 65535`


