    ### 2.5.1.6. Defining a data type (User defined data type)


    The `typedef` Keyword is used to define a data type by the programmer as the user
    of a programming language is a programmer.


    It is very difficult to write `unsigned short int` many times in your program
    if many variables need such kind of declaration. C++ enables you to substitute
    an alias for such phrase by using the keyword `typedef`, which stands for type
    definition.


    E.g.:


    ```cpp

    #include<iostream.h>


    typedef unsigned short int USHORT; void main()


    {


