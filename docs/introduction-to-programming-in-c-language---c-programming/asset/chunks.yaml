  trans: "\n每当你使用 `*` 解引用运算符对任何指针元素进行解引用时，你访问的是数组中的字符串之一。\n\n### 6.9. 指向指针的指针\n\n\
    由于存储整数、浮点数或字符的内存地址可以存储在指针变量，因此指针的地址也可以存储在另一个指针中。这种指针被称为指向指针的指针。指针数组在概念上等同于指向指针的类型。指向指针的类型声明如下：\n\
    \n`Data_type ** pointer_name;`\n\n注意这里的星号是双倍的。\n\n`int **p; //p 是一个持有另一个指针地址的指针*`\n\
    \n`例如：char a; char * b; char ** c; a = 'z'; b =* &*a; c =* &*b;`\n\n这假设随机选择的内存位置为\
    \ `7230`、`8092` 和 `10502`，可以这样描述：\n\n![](img/image00163.jpeg)\n*(单元格内部是变量的内容；单元格下方是它的位置)*\n\
    \n看下方的代码：\n\n```cpp\nvoid main()\n{\n    clrscr();\n    int data;\n    int *p1;\n\
    \    int **p2;\n    data = 15;\n    cout<< “data = ”<<data<<endl;\n    p1 = data;\n\
    \    p2 =\n    cout<< “data through p1 = ”<<*p1<<endl; \n    cout<< “data through\
    \ p2 = ”<< **p2<<endl; getch();\n}\n```\n\n### 6.10. 动态内存\n\n到目前为止，在我们的程序中，拥有的内存仅限于变量、数组和其他包含的对象声明中所请求的内存，所有对象的大小在程序执行之前就是固定的。但是，如果我们需要只有在程序执行期间（运行时）才能确定的变量内存怎么办？例如，我们需要根据用户输入来确定所需的空间。答案是动态内存，C++\
    \ 为此集成了 `new` 和 `delete` 运算符。\n\n指针对于程序执行期间创建动态对象非常有用。与在运行时栈栈上分配存储的普通（全局和局部）对象不同，动态对象是从一个称为“堆”（heap）的不同存储区域分配内存的。动态对象不遵守标准的作用域规则。它们的作用域由程序员显式控制。\n\
    \n#### a) New 运算符\n\n- 在 C++ 中，`new` 运算符可以动态创建空间，即运行时，同样地，可以使用 `delete` 运算符，它可以释放变量占用的内存并将内存返回操作系统。\n\
    - 如果在编译时为变量创建空间，则这种方法称为静态的。如果在运行时为变量创建空间，则这种方法称为动态的。看以下两行：\n\n```cpp\nint a[10];//创建静态数组\n\
    int *a;\na = new int[10];//创建动态数组\n```\n\n- 让我们再看另一个例子：\n\n```cpp\nint * ptr3;\n\
    ptr3 = new int [5];\n```\n\n- 在这种情况下，操作系统已经在堆中为 5 个 `int` 类型的元素分配了空间，并返回一个指向其起始位置的指针赋值给\
    \ `ptr3`。因此，现在 `ptr3` 指向一个具有 5 个 `int` 元素空间的有效内存块。\n\n![](img/image00164.gif)\n\
    \n- 你可能会问声明普通数组与我们刚刚做的为指针分配内存之间有什么区别。最重要的一点是数组的大小必须是一个常量值，这将其大小限制在我们在程序执行前设计程序时决定的范围内，而动态内存允许在程序执行期间使用任何变量、常量或两者的组合作为大小来分配内存。\n\
    - 动态内存通常由操作系统管理，在多任务接口中可以在多个应用程序之间共享，因此存在内存耗尽的可能性。如果发生这种情况且操作系统无法通过 `new` 运算符分配我们请求的内存，将返回一个空指针（null\
    \ pointer）。因此建议始终在调用 `new` 指令后验证返回的指针是否为空：\n\n```cpp\nint * ptr3;\nptr3 = new\
    \ int [5];\nif (ptr3 == NULL) {\n    // 分配内存错误。采取措施。\n}\n```\n\n- 如果 `ptr3` 为\
    \ `NULL`，意味着堆中没有足够的内存位置分配给 `ptr3`。\n\n#### b) delete 运算符\n\n- 由于动态内存的必要性通常限于程序中的特定时刻，一旦不再需要它，就应该被释放，以便供未来的动态内存请求使用。因此存在\
    \ `delete` 运算符，其形式为：\n\n`delete pointer;`\n\n或\n\n`delete [] pointer;`\n\n- 第一个表达式应用于删除为单个元素分配的内存，第二个用于为多个元素（数组）分配的内存。\n\
    - 在大多数编译器中，这两个表达式是等价的，可以无区分使用，尽管它们确实是两个不同的运算符，因此在运算符重载时必须考虑它们。\n- 在下面的简单示例中，一个记录数字的程序对引入数字的数量没有限制，得益于指针的概念和力量，我们向系统请求足够的空间来存储用户想要引入的所有数字。\n\
    \n```cpp\n#include <iostream.h> \n#include <stdlib.h> \n#include<conio.h> \nint\
    \ main ()\n{\n    char input [100];\n    int i,n;\n    long * num = 0;\n    cout\
    \ << \"你想输入几个数字?\"; \n    cin.getline(input,100);\n    i=atoi(input);\n    num=\
    \ new long[i];\n    if (num == NULL) {\n        cout <<nenough memory!\";\n  \
    \      getch();\n        exit (1);\n    }\n    for (n=0; n<i; n++)\n    {\n  \
    \      cout << \"输入数字:\"; \n        cin.getline(input,100);\n        num[n]=atol(input);\n\
    \    }\n    cout << \"你输入的数字是:\"; \n    for (n=0; n<i; n++)\n    cout << num[n]\
    \ << \", \";\n    delete[] num;\n    getch();\n    return 0;\n}\n```\n\nNULL 是\
    \ C++ 库中定义的常量值，用于表示空指针。如果该常量未定义，你可以将其定义为 0。\n\n### 第章文件操作 (File/O)\n\n#### 引言\n\
    \n- 用户创建并赋值给变量的数据对于某些应用程序是足够的。对于大量数据，大多数现实应用程序使用更好的存储数据的方式。为此，磁盘文件提供了解决方案。\n-\
    \ 当处理磁盘文件时，C++ 不需要访问大量内存，因为 C++ 从磁盘驱动器读取数据并仅处理部分。\n\n#### 7.2 流 (Stream)\n\n-\
    \ 流是数据流通用名称。在 C++ 中有不同类型的流。每个流都与特定的类关联，该类包含了处理文件的成员函数和定义。让我们看看图：\n\n```ios\nistream\
    \ ostream\nifstream^(iostream)\nfstream\n```\n\n- 根据上面的层次结构，iostream 类派生自 istream\
    \ 和 ostream，而 istream 和 ostream 都派生自 ios。同样，fstream 类派生自 iostream。\n- 注意当我们在程序中包含\
    \ fstream.h 头文件时，没有需要再包含 iostream.h 头文件。因为 fstream.h 中的所有类都派生自 iostream.h 中的类。\n\
    \n#### 7.3：与文件的操作\n\n- 首先我们将看到如何打开和关闭文件。文件可以通过以下类定义：ifstream, ofstream, fstream，这些这些都定义在\
    \ fstream.h 头文件中。\n"
- fmt: "\n- If a file object is declared by `fstream` class then, that object can\
    \ be used for both `reading from` and `writing to` a file.\n\n## 7.4: Types of\
    \ Disk File Access\n\n- Your program can access files either in `sequential` manner\
    \ or `random` manner. The access mode of a file determines how one can read, write,\
    \ change, add and delete data from a file.\n\n- A sequential file has to be accessed\
    \ in the same order as the file was written. This is analogues to cassette tapes:\
    \ you play music in the same order as it was recorded.\n\n- Unlike the sequential\
    \ files, you can have random-access to files in any order you want. Think of data\
    \ in a random-access file as being similar to songs on compact disc (CD): you\
    \ can go directly to any song you want to play without having to play or fast-forward\
    \ through the other songs.\n\n### 7.4.1: Sequential File Concepts\n\n- You can\
    \ perform three operations on sequential disk files. You can `create` disk files,\
    \ `add` to disk files, and `read` from disk files.\n\n### 7.4.1.1: Opening and\
    \ Closing Sequential Files\n\n- When you open a disk file, you only have to inform\
    \ C++, the file name and what you want to do with it. C++ and your operating system\
    \ work together to make sure that the disk is ready, and they create an entry\
    \ in your file directory for the filename (if you are creating a file). When you\
    \ close a file, C++ writes any remaining data to the file, releases the file from\
    \ the program, and updates the file directory to reflect the file’s new size.\n\
    \n- You can use either of the two methods to open a file in C++:\n    - using\
    \ a `Constructor`\n    - using the `open function`\n\n- The following C++ statement\
    \ will create an object with the name `fout` of `ofstream` class and this object\
    \ will be associated with file name “hello.txt”.\n\n```cpp\nofstream fout (“hello.txt”);\n\
    ```\n\nThis statement uses the constructor method.\n\n- The following C++ statement\
    \ will create an object with the name `fout` of `ofstream` class and this object\
    \ will be associated with file name “hello.txt”.\n\n```cpp\nofstream fout;\nfout.open(“hello.txt”);\n\
    ```\n\n- If you open a file for writing (out access mode), C++ creates the file.\
    \ If a file by that name already exists, `C++ overwrite` the old file with no\
    \ warning. You must be careful when opening files not to overwrite existing data\
    \ that you want.\n\n- If an error occurs during opening of a file, C++ does not\
    \ create a valid file pointer (file object). Instead, C++ creates a file pointer\
    \ (object) equal to zero. For example if you open a file for output, but use an\
    \ invalid disk name, C++ can’t open the file and therefore makes the file object\
    \ equal to zero.\n\n- You can also determine the file access mode when creating\
    \ a file in C++. If you want to use the `open function` to open a file then the\
    \ syntax is:\n\n```cpp\nfileobject.open(filename,accessmode);\n```\n\n- File name\
    \ is a string containing a valid file name for your computer.\n- Accessmode is\
    \ the sought operation to be taken on the file and must be one of the values in\
    \ the following table.\n\n| Mode | Description |\n| :--- | :--- |\n| app | Opens\
    \ file for appending |\n| ate | Seeks to the end of file while opening the file\
    \ |\n| in | Opens the file for reading |\n| out | Opens the file for writing |\n\
    | binary | Opens the file in binary mode |\n\n- You should always check for the\
    \ successful opening of a file before starting file manipulation on it. You use\
    \ the `fail()` function to do the task:\n\n- Lets have an example here:\n\n```cpp\n\
    ifstream indata;\nindata.open(“c:\\\\myfile.txt”,ios::in); \nif(indata.fail())\n\
    {\n    //error description here\n}\n```\n\n- In this case, the open operation\
    \ will fail (i.e the `fail` function will return true), if there is no file named\
    \ `myfile.txt` in the directory `C:\\`.\n\n- After you are done with your file\
    \ manipulations, you should use the `close` function to release any resources\
    \ that were consumed by the file operation. Here is an example:\n\n```cpp\nindata.close();\n\
    ```\n\nThe above `close()` statement will terminate the relationship between the\
    \ `ifstream` object `indata` and the file name “c:\\myfile.txt”, hence releasing\
    \ any resource needed by the system.\n\n### 7.4.1.2: Writing to a sequential File\n\
    \n- The most common file I/O functions are `get()` and `put()`.\n\n- You can also\
    \ use the output redirection operator (`<<`) to write to a file.\n\n- The following\
    \ program creates a file called `names.txt` in `C:\\` and saves the name of five\
    \ persons in it:\n\n```cpp\n#include<fstream.h>\n#include<stdlib.h>\nofstream\
    \ fp;\nvoid main()\n{\n    fp.open(“c:\\\\names.txt” ,ios::out); \n    if(fp.fail())\n\
    \    {\n        cerr<< “\\nError opening file”; getch();\n        exit(1);\n \
    \   }\n    fp<< “Abebe Alemu”<<endl; \n    fp<< “Lemelem Berhanu”<<endl;\n   \
    \ fp<< “Tesfaye Mulugeta”<<endl; \n    fp<< “Mahlet Kebede”<<endl; \n    fp<<\
    \ “Assefa Bogale”<<endl; \n    fp.close();\n}//end main\n```\n\n*Writing characters\
    \ to sequential files:*\n\n- A character can be written onto a file using the\
    \ `put()` function. See the following code:\n\n```cpp\n#include<fstream.h>\n#include<stdlib.h>//\
    \ for exit() function\n…\nvoid main()\n{\n    char c;\n    ofstream outfile;\n\
    \    outfile.open(“c:\\\\test.txt”,ios::out);\n    if(outfile.fail())\n    {\n\
    \        cerr<< “\\nError opening test.txt”; getch();\n        exit(1);\n    }\n\
    \    for(int i=1;i<=15;i++)\n    {\n        cout<< “nEnter a character : ”; cin>>c;\n\
    \        outfile.put(c);\n    }\n    output.close();\n}//end main\n```\n\n- The\
    \ above program reads 15 characters and stores in file `test.txt`.\n\n- You can\
    \ easily add data to an existing file, or create new files, by opening the file\
    \ in `append access mode`.\n\n- Files you open for append access mode (using `ios::app`)\
    \ do *not have to exist*. If the file exists, C++ appends data to the end of the\
    \ file (as is done when you open a file for write access).\n\n- The following\
    \ program adds three more names to the `names.txt` file created in the earlier\
    \ program.\n\n```cpp\n#include<fstream.h>\n#include<stdlib.h>\n…\nvoid main()\n\
    {\n    ofstream outdata;\n    outdata.open(“c:\\\\names.txt”,ios::app); \n   \
    \ if(outdata.fail())\n    {\n        // logic omitted in original but implied\
    \ by context\n    }\n    outdata<< “Berhanu Teka”<<endl;\n    outdata<< “Zelalem\
    \ Assefa”<<endl;\n    outdata<< “Dagim Sheferaw”<<endl;\n    outdata.close();\n\
    }//end main\n```\n\n- If the file `does not exist`, C++ creates it and stores\
    \ the three names. \n\n- Basically, you have to change only the `open()` function’s\
    \ access mode to turn a file-creation program into a file-appending program.\n\
    \n### 7.4.1.3: Reading from a File\n\n- Files you open for read access (using\
    \ `ios::in`) *must exist already*, or C++ gives you an error message. You can’t\
    \ read a file that does not exist. `Open()` returns zero if the file does not\
    \ exist when you open it.\n\n- Another event happens when you read files. Eventually,\
    \ you read all the data. Subsequently reading produces error because there is\
    \ *no more* data to read. C++ provides a solution to the end-of-file occurrence.\n\
    \n- If you attempt to read a file that you have completely read, C++ returns the\
    \ value zero. To find the end-of-file condition, be sure to check for zero when\
    \ reading information from files.\n\n- The following code asks the user for a\
    \ file name and displays the content of the file to the screen.\n\n```cpp\n#include<fstream.h>\n\
    #include<conio.h> \n#include<stdlib.h> \nvoid main()\n{\n    clrscr();\n    char\
    \ name[20],filename[15]; \n    ifstream indata;\n    cout<<\"\\nEnter the file\
    \ name : \"; cin.getline(filename,15);\n    indata.open(filename,ios::in); \n\
    \    if(indata.fail())\n    {\n        cerr<<\"\\nError opening file : \"<<filename;\
    \ getch();\n        exit(1);\n    }\n    while(!indata.eof())// checks for the\
    \ end-of-file {\n        indata>>name;\n        cout<<name<<endl; \n    }\n  \
    \  indata.close();\n    getch();\n}\n```\n\n*Reading characters from a sequential\
    \ file*\n\n- You can read a characters from a file using `get()` function. The\
    \ following program asks for a file name and displays *each character* of the\
    \ file to the screen. NB. A space among characters is considered as a character\
    \ and hence, the exact replica of the file will be shown in the screen.\n\n```cpp\n\
    #include<fstream.h>\n#include<conio.h>\n#include<stdlib.h>\nvoid main()\n{\n \
    \   char c,filename[15];\n    ifstream indata;\n}\n```\n"
