  trans: "\n\n### 4.3.1. 声明函数：\n\n- 函数的接口（也称为其原型）规定了它可以如何被使用。它由三个实体组成：\n- `function\
    \ return type`（函数返回值）。这指定了函数返回值的类型。不返回值的函数返回类型应为 `void`。\n- `function name`（函数名）。这仅仅是一个唯一的标识符。\n\
    - `function parameters`（函数参数，也称为签名）。这是一组零或多个带类型的标识符，用于在函数和函数之间传递值。\n\n### 4.3.2.\
    \ 定义函数：\n\n- 函数定义由两部分组成：接口（`prototype`）和体（`body`）。函数的大括号包含了使函数程序化的步骤（语句）。定义由一行称为声明符（decelerator）的语句组成。\n\
    - 如果函数定义在主函数之前完成，则不需要放置原型，否则原型应该在主函数开始之前编写好。\n\n### 4.3.3. 调用函数：\n\n- 使用函数涉及“调用”它。\n\
    - 调用函数意味着发出执行该函数的指令。\n- 函数调用由函数名后跟调用运算符括号 `()` 组成，内部出现零或多个用逗号分隔的参数。参数的数量和类型应与函数参数的数量匹配。每个参数都是表达式，其类型应与函数接口中对应参数的类型匹配。\n\
    - 当执行函数调用时，首先评估参数，并将`它们的计算结果`赋值给相应的参数。然后执行函数体。最后，将返回值（如果有）传递给调用者。\n\nC++ 中的函数调用就像高速公路上的一个绕道。想象你正沿着运行名为\
    \ `main()` 的主函数“道路”上旅行。当你遇到一个函数调用语句时，你必须暂时离开 `main()` 函数并执行被调用的函数。在那个函数完成后（到达其返回语句后），程序控制权返回到\
    \ `main()`。换句话说，当你完成一次绕道后，你就会返回到“主”路线并继续旅程。随着 `main()` 调用其他函数，控制将继续。\n\n让我们来看一个简单的例子：\n\
    \n```cpp\nvoid func1(); // 函数定义的原型\n\nvoid main()\n{ \n    // 无返回类型，因为在定义中是 void。\n\
    \    ---------------\n    func1(); // 函数调用（注意分号）\n    ---------------\n } // 返回类型为\
    \ void\n\nvoid func1() // 无分号。声明符\n{\n    -------------- 函数体\n    --------------\n\
    } // 无分号。\n```\n\n让我们来看另一个非常简单的函数例子：\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\
    \nvoid starLine(); // 名为 starLine 的函数原型\nint main()\n{\n    starLine(); // 调用名为\
    \ starLine 的函数 \n    cout<< “Data type Range” << endl;\n    starLine();\n    cout<<\
    \ “char -128 to 127”<<endl\n    << “short -32,768 to 32,767”<<endl \n    << “\
    \ int system dependent” <<endl\n    << “long -2,147,483,648 to 2,147,483,647”\
    \ << endl; \n    starLine();\n    return 0;\n}\n\n// 定义\nvoid starLine()\n{\n\
    \    for(int j=0;j<45;j++) // 带有 a 的函数定义\n    cout<< “*”; // 名称 starLine \n  \
    \  cout<<endl;\n}\n```\n\n给定下一个程序，哪个函数是调用函数，哪个函数是被调用的函数？\n\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\n\nvoid nextMsg()\nint main()\n{\n    cout<< “Hello!\\n”; \n\
    \    nextMsg();\n    return 0;\n}\n\nvoid nextMsg()\n{\n    cout<< “GoodBye!\\\
    n”; \n    return;\n}\n```\n\n### 4.4. 函数参数与实\n\n函数的参数是函数执行其任务时使用的变量列表，而在调用函数期间传递给函数的实是发送给函数的值。\n\
    \n函数调用的实可以使用 C++ 支持的两种样式之一：`值传递`（passing by value）或`引用传递`（passing by reference）。\n\
    \n#### 4.4.1. 值传递：\n\n- 值参数仅接收传递给它的参数的值的副本。因此，如果函数对参数进行了任何更改，这些更改不会影响参数。例如：\n\n\
    ```cpp\nvoid Foo(int num)\n{\n    Num = 0;\n    cout<< “num = ” << num << “ \\\
    n”;\n}\n\nint main(void)\n{ \n    int x = 10;\n    Foo(x);\n    cout<< “x = ”<<x<<“\\\
    n”;\n    getch();\n    return 0;\n}\n```\n\n- `Foo` 的单个参数是一个值参数。对于这个函数而言，`num`\
    \ 的行为就像函数内部的局部变量一样。当函数被调用且 `x` 传递给它时，`num` 接收了 `x` 值的副本。因此，尽管函数将 `num` 设置为 0，但这不会影响\
    \ `x`。程序产生以下输出：\n```\nNum = 0\nx = 10\n```\n- 以这种方式传递参数（即函数创建传递给它的参数的副本）被称为`值传递`。\n\
    \n#### 4.4.2. 引用传递：\n\n- 另一方面，引用参数直接接收传递的参数并对其进行操作。函数对引用参数的任何更改都会直接应用到参数上。以这种方式传递参数被称为`引用传递`。\n\
    \n```cpp\nvoid Foo(int &num)\n{\n    num = 0;\n    cout<< “num = ” << num << “\
    \ \\n”;\n}\n\nint main(void)\n{ \n    int x = 10;\n    Foo(x);\n    cout<< “x\
    \ = ”<<x<<“\\n”;\n    getch();\n    return 0;\n}\n```\n\n（注：原文在某些部分存在重复，翻译时根据逻辑整理了\
    \ 4.4.2 的描述，以确保文档的连贯性。）\n\n"
