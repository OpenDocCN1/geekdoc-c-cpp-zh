    ### **4.2.2\. The while statement**


    The while statement (also called while loop) provides a way of repeating a statement
    or a block as long as a condition holds / is true.


    The general form of the while loop is:


    ### *while(expression) statements;*


    First *expression* (called the *loop condition*) is evaluated. If the outcome
    is non zero then statement (called the *loop body*) is executed and the whole
    process is repeated. Otherwise, the loop is terminated.


    Suppose that we wish to calculate the sum of all numbers from 1 to some integer
    value n. this can be expressed as :


    E.g.1:// adds the numbers between 0 and any given number n


    i=1;


    sum = 0;


    while(i <= n)


    sum += i++;


    E.g.2://adds the numbers between 0 and 100 number=1;


    sum=0;


    while(number <= 100)


    {


    sum += number;


    number++;


    }


    E.g.3:


    /*the following while loop will request the user to enter his/her age which should
    be between 0 and 130\. If the user enters a value which is not in the range, the
    while loop test the value and request the age again until the user enters a valid
    age.*/


    cout<<“\n enter your age [between 0 and 130]:”; cin>>age;


    while(age < 0 || age > 130)


    {


    cout<<“\n invalid age. Plz try again!”; cin>>age;


    }


    ### **4.2.3\. Do…while loop.**


    The do statement (also called the do loop) is similar to the while statement,
    except that its body is executed first and then the loop condition is examined.


    In do…while loop, we are sure that the body of the loop will be executed at lease
    once. Then the condition will be tested. The general form is:


    *do*


    {


    statement;


    }


    while(expression);


    First statement is executed and then expression is evaluated. If the outcome of
    the expression is nonzero, then the whole process is repeated. Otherwise the loop
    is terminated.


    E.g.:


    //our previous example (Eg3) in the while loop might be changed as:


    age=-1; do


    {


    cout<<“\n enter your valid age [between 0 and 130]:”; cin>>age;


    }


    while(age < 0 || age > 130);


    - E.g. what do you think is the outcome of the following code: *unsigned long
    n;


    do*


    {


    cout<<“\n enter number (0 to end):”; cin>>n;


    cout<<“\n you entered:”<<n;


    }


    }while(n != 0);


    **4.2.4\. Pitfalls in witting repetition statements**


    There are some pitfalls worth mentioning in repletion statements. These pit falls
    are the most common programming errors committed by programmers


    ***Infinite loop***: no matter what you do with the while loop (and other repetition
    statements), make sure that the loop will *eventually terminates*.


    E.g.1:


    //Do you know why the following is an infinite loop?


    int product = 0;


    while(product < 50)


    product *= 5;


    E.g.2:


    //Do you know why the following is an infinite loop?


    int counter = 1;


    while(counter != 10)


    counter += 2;


    In the first example, since ***product*** is initialized with zero, the


    expression “product*=5” will always give us zero which will


    always be less than 50.


    In the second example, the variable counter is initialized to 1 and


    increment is 2, counter will never be equal to 10 as the counter only


    assumes odd values. In theory, this while loop is an infinite loop,


    but in practice, this loop eventually terminates because of an


    *overflow error* as counter is an integer it will have a maximum limit.


    ***Off-By-One Bugs (OBOB )***: another thing for which you have to watch out in
    writing a loop is the so called *Off-By-One Bugs or errors*. Suppose we want to
    execute the loop body 10 times. Does the following code work?


    E.g.:1


    count = 1;


    while(count < 10)


    {


    …


    count++;


    }


    No, the loop body is executed nine times. How about the following? E.g.:2


    count = 0;


    while(count <= 10) {


    …


    count++;


    }


    No this time the loop body is executed eleven times. The correct is


    E.g.:3


    count = 0;


    while(count < 10) {


    …


    count++; }


    OR


    count = 1;


    while(count <= 10) {


    …


    count++; }


