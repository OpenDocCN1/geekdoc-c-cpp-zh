  trans: "\n\n## 2.8.9. 强制类型转换运算符。\n\n强制类型转换运算符允许你将给定类型的数据转换为另一种数据类型。\n\n例如：\n\n```cpp\n\
    int i;\nfloat f = 3.14;\ni = (int)f; 等同于 i = int(f);\n```\n\n此时变量 `i` 将获得值 3，忽略了小数点。\n\
    \n## 2.9. 运算符优先级。\n\n在表达式中，运算符求值的顺序非常重要，它由优先级规则决定。高级别的运算符优先级高于低级别的运算符。\n\n###\
    \ 优先级表：\n\n| 级别 | 运算符 | 顺序 |\n| :--- | :--- | :--- |\n| 最高 | `++` `--` (后置) |\
    \ 从右到左 |\n| | `sizeof()` `++` `--` (前缀) | 从右到左 |\n| | `*` `/` `%` | 从左到右 |\n|\
    \ | `+` `-` | 从左到右 |\n| `<` `<=` $>$ `>=` | 从左到右 |\n| | `==` `!=` | 从左到右 |\n|\
    \ | `&&` | 从左到右 |\n| | `||` | 从左到右 |\n| | `? `:` | 从左到右 |\n| | `=` `, ` `+=` `-=`\
    \ `*=` `/=` `^=` `%=` `&=` `|=` `<<=` `>>=` | 从右到左 |\n\n例如：\n\n`a = b + c * d`\
    \ ; `c * d` 先求值，因为 `*` 的优先级高于 `+` 和 `=`。\n\n然后结果被加到 `b` 上，因为 `+` 的优先级高于 `=`。接着求值\
    \ `==`。\n\n优先级规则可以使用括号来覆盖。\n\n例如，将上述表达式重写为：\n\n`a = (b + c) * d` 导致 `+` 在 `*`\
    \ 之前被求值。\n\n具有相同优先级的运算符按照优先级规则表中列出的顺序进行求值。\n\n例如 `a = b += c` 的求值顺序是从右到左的，所以首先执行\
    \ `b += c`，然后执行 `a = b`。\n\n### 阿迪斯亚贝巴大学信息科学学院 - 练习题 2\n\n课程名称：程序导论 / 编程基础 课程号：`Comp\
    \ 271 / CSCE 232`\n\n为每个问题编写一段 C++ `code` 来完成所需任务。你的程序应基于你在第一份练习中绘制的流程。\n\n1)\
    \ 接收一个数字并判断它是奇数还是偶数。\n2) 从键盘获取两个数字，判断并显示其中哪一个（如果有）较大。\n3) 接收 3 个数字并按从小到大的顺序显示它们。\n\
    4) 将 1 到 100 的数字相加并显示和。\n5) 加 0 到用户给定的任意正整数之间的偶数。\n6) 计算用户提供的两个数字的平均值。\n7) 计算用户提供的三个数字的平均值、最大值、最小值和和。\n\
    8) 根据用户提供的半径计算圆面积。\n9) 使用第三变量交换两个变量的内容。\n10) 不使用第三变量交换两个变量的内容。\n11) 从键盘读取一个整数值，并显示消息指示该数是奇数还是偶数。\n\
    12) 从键盘读取 10 个 0-100 范围内的整数，统计其中大于 50 的个数并显示此结果。\n13) 从用户处获取一个整数并显示该数字的阶乘。\n\n\
    ## 第三章 程序控制结构。\n\n一个运行中的程序所有时间都花在执行程序中的指令或语句上。\n\n程序中语句执行的顺序被称为程序的`流` (flow)。\n\
    \n程序员可以控制程序中执行哪条指令，这被称为`流控制`。\n\n这个术语反映了当前执行的语句拥有 CPU 的控制权，执行完成后，控制权将交给（流向）另一条语句。\n\
    \n程序中的流控制通常是`顺序的`，即从一条语句到下一条。\n\n但我们也有可能通过`分支语句`将执行划分到其他路径。或者通过`重复`（Repetition）或循环（looping）反复执行一个语句块，直到条件失败。\n\
    \n流控制是编程中的一个重要概念，因为它赋予了程序员权力，来决定在运行期间执行什么以及不执行什么，从而影响程序的最终结果。\n\n## 3. 顺序语句\n\n\
    这类语句是程序中的指令，将按照程序中编写的顺序一个一个执行。在顺序语句中，顺序在程序开发期间确定且无法更改。\n\n## 4. 选择语句\n\n选择语句是程序中的语句，在这些点上，程序将在运行时决定某些代码是否应该执行或不应该执行。\n\
    \nC++ 中有两种选择语句，即`if 语句`和`switch 语句`。\n\n## 4.1. if 语句\n\n有时让语句的执行取决于`条件的满足`是有意图的。\n\
    \n`If` 语句的不同形式将用于根据条件（该条件将被测试为 TRUE 或 FALSE 结果）来决定是否执行程序的一部分。\n\n`If` 语句的不同形式有：\n\
    - 简单 if 语句\n- if else 语句\n- if else if 语句\n\n### 简单 if 语句\n\n简单 if 语句仅在条件满足时决定执行程序的一个部分，如果条件失败则忽略忽略。\n\
    \n通用语法为：\n\n```cpp\nif (expression)\nstatements;\n```\n\n在任何 `if` 语句中，首先求值 `expression`，如果结果非零（意味着\
    \ TRUE），则执行 `statements`。否则，什么都不会发生（语句将不会被执行），继续执行。\n\n为了让多个语句取决于同一个条件，我们可以使用复合语句，将组包含在\
    \ `{}` 之中。\n\n例如：\n```cpp\nif (age>18)\n    cout<<\"you are adult\";\n```\n\n\
    例如：\n```cpp\nif(balance > 0)\n{\n    interest = balance * creditRate;\n    balance\
    \ += interest;\n}\n```\n\n大多数情况下，`expression` 将具有关系表达式，测试某物与某物相等、大于、小于或不同。需要注意的是，关系表达式的输出是\
    \ True（由任何非零值表示）或 False（由零表示）。\n\n因此，任何最终结果为零或无的表达式都可以用于 `expression`。\n\n例如：\n\
    ```cpp\nint x;\ncin>>x;\nif(x)\n    cout<<\"you are adult\";\n```\n\n在上面的示例中，变量\
    \ `x` 的值将来自用户。如果用户给出任何非零值，`if` 语句将为真，显示 `you are adult`。如果用户给 `x` 赋值零，则被解释为假，由于\
    \ if 语句不满足，将什么都不会做。\n\n### if else 语句\n\n`if` 的另一种形式是 `if...else` 语句。`if else`\
    \ 语句允许我们指定两个替代语句：当条件满足时执行一条，条件不满足时执行另一条。\n\n通用语法为：\n\n```cpp\nif (expression)\n\
