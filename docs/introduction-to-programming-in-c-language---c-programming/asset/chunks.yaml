    possible permutation of numbers using the above digits. For example n = 123 then
    the permutations are –


    123, 213, 312, 132, 231, 321


    17\. Write a program which read a set of lines until you enter #.


    18\. Write a program which read two matrixes and then print a matrix which is
    addition of these two matrixes.


    19\. Write a program which reads two matrix and multiply them if possible


    20\. Write a program which reads a 3 x 2 matrix and then calculates the sum of
    each row and store that in a one dimension array.


    ### **Chapter Six Pointers 6\. Introduction**


    We have already seen how variables are memory cells that we can access by an identifier.
    But these variables are stored in concrete places of the computer memory. For
    our programs, the computer memory is only a succession of 1 *byte* cells (the
    minimum size for a datum), each one with a unique address. A pointer is a variable
    which stores the address of another variable. The only difference between pointer
    variable and regular variable is the data they hold. There are two pointer operators
    in C++:


    & the address of operator


    * the dereference operator


    Whenever you see the & used with pointers, think of the words “address of.” The
    & operator always produces the memory address of whatever it precedes. The * operator,
    when used with pointers, either declares a pointer or dereferences the pointer’s
    value. The dereference operator can be literally translated to ***"value pointed
    by"*** .


    A **pointer** is simply the address of an object in memory. Generally, objects
    can be accessed in two ways: directly by their symbolic name, or indirectly through
    a pointer. The act of getting to an object via a pointer to it, is called **dereferencing**
    the pointer. Pointer variables are defined to point to objects of a specific type
    so that when the pointer is dereferenced, a typed object is obtained.


    At the moment in which we declare a variable this one must be stored in a concrete
    location in this succession of cells (the memory). We generally do not decide
    where the variable is to be placed - fortunately that is something automatically
    done by the compiler and the operating system on runtime, but once the operating
    system has assigned an address there are some cases in which we may be interested
    in knowing where the variable is stored. This can be done by preceding the variable
    identifier by an *ampersand sign* (&), which literally means, ***"address of”.***
    For example:


    *ptr=* &*var;*


    This would assign to variable **ptr** the address of variable **var** , since
    when preceding the name of the variable **var** with the *ampersand* ( & ) character
    we are no longer talking about the content of the variable, but about its address
    in memory.


    We are going to suppose that **var** has been placed in the memory address **1776**
    and that we write the following:


    var=25;


    x=var;


    ptr = &var;


    The result will be the one shown in the following diagram:


    ![](Images/image00161.gif)


    We have assigned to **x** the content of variable **var** as we have done in many
    other occasions in previous sections, but to **ptr** we have assigned the address
    in memory where the operating system stores the value of **var** , that we have
    imagined that it was **1776** (it can be any address). The reason is that in the
    allocation of **ptr** we have preceded **var** with an *ampersand* ( & ) character.
    The variable that stores the address of another variable (like **ptr** in the
    previous example) is what we call a **pointer.**


    ### ***6.1\. Declaring Pointers:***


    Is reserving a memory location for a pointer variable in the heap. Syntax:


    ### ***type * pointer_name*** ;


    to declare a pointer variable called p_age, do the following:


    *int * p_age;*


    Whenever the dereference operator, *, appears in a variable declariation, the


    variable being declared is always a pointer variable.


    ### ***6.2\. Assigning values to pointers:***


    p_age is an integer pointer. The type of a pointer is very important. p_age can
    point only to integer values, never to floating-point or other types. To assign
    p_age the address of a variable, do the following:


    *int age = 26;


    int * p_age;


    p_age =* &*age;


    OR


    int age = 26;


    int * p_age =* & *age;*


    Both ways are possible.


    If you wanted to print the value of age, do the following:


    *cout<<age;//prints the value of age*


    Or by using pointers you can do it as follows


    *cout<<*p_age;//dereferences p_age;*


    The dereference operator produces a value that tells the pointer where to point.
    Without the *, (i.e cout<<p_age), a cout statement would print an address (the
    address of age). With the *, the cout prints the value at that address.


    You can assign a different value to age with the following statement:


    age = 13; //assigns a new value to variable age


    *p_age = 13 //assigns 13 as a value to the memory p_age points at. **N.B:** the
    * appears before a pointer variable in only two places: when you declare a pointer
    variable and when you dereference a pointer variable (to find the data it points
    to).


    - The following program is one you should study closely. It shows more about pointers
    and the pointer operators, & and *, than several pages of text could do.


    *#...


    #...


    void main() {*


    *int num = 123; // a regular integer variable


    int *p_num; //declares an integer pointer


    cout<< “num is ”<<num<<endl;


    cout<< “the address of num is ”<<*&*num<<endl;


    p_num =* &*num;// puts address of num in p_num; cout<< “*p_num is ”<<*p_num<<endl;
    //prints value of num cout<< “p_num is ”<<p_num<<endl; //prints value of P_num
    getch();*


    *}*


    ### **6.3\. Pointer to void**


    note that we can’t assign the address of a float type variable to an integer pointer
    variable and similarly the address of an interger variable can not be stored in
    a float or character pointer.


    *flaot y;


    int x;


    int *ip;


    float *fp;


    ip =* &*y; //illegal statement


    fp =* &*x; //illegal statement*


    That means, if a variable type and pointer to type is same, then only we can assign
    the address of variable to pointer variable. And if both are different type then
    we can’t assign the address of variable to pointer variable but this is also possible
    in C++ by declaring pointer variable as a void as follows:


    *void *p;*


    Let us see an example:


    *void *p;


    int x;


    float y;


    p =* &*x; //valid assignment


    p =* &*y; //valid assignment*'
