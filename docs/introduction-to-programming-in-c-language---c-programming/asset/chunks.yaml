    ### 2.5.1.5. Scope of Variables


    Scope of a variable is the boundary or block in a program where a variable can
    be accessed. The boundary or block is identified by the left and right French
    brackets.


    In C++, we can declare variables any where in the source code. But we should declare
    a variable before using it no matter where it is written.


