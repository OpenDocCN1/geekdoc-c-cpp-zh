    \ngetch();\n```\n\n### 7.4.1.4: File Pointer and their Manipulators\n\n- Each\
    \ file has two pointers: one is called `input pointer` and the second is called\
    \ `output pointer`. The input pointer is called `get pointer` and the output pointer\
    \ is called `put pointer`.\n- When input and output operation take places, the\
    \ appropriate pointer is automatically set according to the access mode.\n- For\
    \ example when we open a file in reading mode, file pointer is automatically set\
    \ to the start of the file.\n- When we open a file in append mode, the file pointer\
    \ is automatically set to the end of file.\n- In C++ there are some manipulators\
    \ by which we can control the movement of the pointer. The available manipulators\
    \ are:\n  1. `seekg()`\n  2. `seekp()`\n  3. `tellg()`\n  4. `tellp()`\n\n1. `seekg()`:\
    \ this moves `get pointer` i.e `input pointer` to a specified location. For eg.\
    \ `infile.seekg(5);` move the file pointer to the byte number 5 from starting\
    \ point.\n2. `seekp()`: this move `put pointer` (`output pointer`) to a specified\
    \ location for example: `outfile.seekp(5);`\n3. `tellg()`: this gives the current\
    \ position of `get pointer` (`input pointer`)\n4. `tellp()`: this gives the current\
    \ position of `put pointer` (`output pointer`) eg. `ofstream fileout;` `fileout.open(“c:\\\
    \\test.txt”,ios::app); int length = fileout.tellp();`\n\n- By the above statement\
    \ in `length`, the total number bytes of the file are assigned to the integer\
    \ variable `length`. Because the file is opened in append mode that means, the\
