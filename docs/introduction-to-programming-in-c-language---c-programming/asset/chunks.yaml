    Songs : \"<<cd1.num_songs<<endl; cout<<\"Price : \"<<cd1.price<<endl;\n    cout<<\"\
    Date purchased : \"<<cd1.date_purchased; getch();\n}\n```\n\n### 结构数组\n\n结构数组非常适合存储完整的员工文件、库存文件或任何符合结构格式的数据集。\n\
