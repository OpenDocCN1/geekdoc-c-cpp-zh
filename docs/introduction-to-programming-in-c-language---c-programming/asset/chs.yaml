  3) 接收 3 个数字并按从小到大的顺序显示它们。\n4) 将 1 到 100 的数字相加并显示和。\n5) 加 0 到用户给定的任意正整数之间的偶数。\n6)\
  \ 计算用户提供的两个数字的平均值。\n7) 计算用户提供的三个数字的平均值、最大值、最小值和和。\n8) 根据用户提供的半径计算圆面积。\n9) 使用第三变量交换两个变量的内容。\n\
  10) 不使用第三变量交换两个变量的内容。\n11) 从键盘读取一个整数值，并显示消息指示该数是奇数还是偶数。\n12) 从键盘读取 10 个 0-100 范围内的整数，统计其中大于\
  \ 50 的个数并显示此结果。\n13) 从用户处获取一个整数并显示该数字的阶乘。\n\n## 第三章 程序控制结构。\n\n一个运行中的程序所有时间都花在执行程序中的指令或语句上。\n\
  \n程序中语句执行的顺序被称为程序的`流` (flow)。\n\n程序员可以控制程序中执行哪条指令，这被称为`流控制`。\n\n这个术语反映了当前执行的语句拥有\
  \ CPU 的控制权，执行完成后，控制权将交给（流向）另一条语句。\n\n程序中的流控制通常是`顺序的`，即从一条语句到下一条。\n\n但我们也有可能通过`分支语句`将执行划分到其他路径。或者通过`重复`（Repetition）或循环（looping）反复执行一个语句块，直到条件失败。\n\
  \n流控制是编程中的一个重要概念，因为它赋予了程序员权力，来决定在运行期间执行什么以及不执行什么，从而影响程序的最终结果。\n\n## 3. 顺序语句\n\n\
  这类语句是程序中的指令，将按照程序中编写的顺序一个一个执行。在顺序语句中，顺序在程序开发期间确定且无法更改。\n\n## 4. 选择语句\n\n选择语句是程序中的语句，在这些点上，程序将在运行时决定某些代码是否应该执行或不应该执行。\n\
  \nC++ 中有两种选择语句，即`if 语句`和`switch 语句`。\n\n## 4.1. if 语句\n\n有时让语句的执行取决于`条件的满足`是有意图的。\n\
  \n`If` 语句的不同形式将用于根据条件（该条件将被测试为 TRUE 或 FALSE 结果）来决定是否执行程序的一部分。\n\n`If` 语句的不同形式有：\n\
  - 简单 if 语句\n- if else 语句\n- if else if 语句\n\n### 简单 if 语句\n\n简单 if 语句仅在条件满足时决定执行程序的一个部分，如果条件失败则忽略忽略。\n\
  \n通用语法为：\n\n```cpp\nif (expression)\nstatements;\n```\n\n在任何 `if` 语句中，首先求值 `expression`，如果结果非零（意味着\
  \ TRUE），则执行 `statements`。否则，什么都不会发生（语句将不会被执行），继续执行。\n\n为了让多个语句取决于同一个条件，我们可以使用复合语句，将组包含在\
  \ `{}` 之中。\n\n例如：\n```cpp\nif (age>18)\n    cout<<\"you are adult\";\n```\n\n例如：\n\
  ```cpp\nif(balance > 0)\n{\n    interest = balance * creditRate;\n    balance +=\
  \ interest;\n}\n```\n\n大多数情况下，`expression` 将具有关系表达式，测试某物与某物相等、大于、小于或不同。需要注意的是，关系表达式的输出是\
  \ True（由任何非零值表示）或 False（由零表示）。\n\n因此，任何最终结果为零或无的表达式都可以用于 `expression`。\n\n例如：\n\
  ```cpp\nint x;\ncin>>x;\nif(x)\n    cout<<\"you are adult\";\n```\n\n在上面的示例中，变量\
  \ `x` 的值将来自用户。如果用户给出任何非零值，`if` 语句将为真，显示 `you are adult`。如果用户给 `x` 赋值零，则被解释为假，由于\
  \ if 语句不满足，将什么都不会做。\n\n### if else 语句\n\n`if` 的另一种形式是 `if...else` 语句。`if else` 语句允许我们指定两个替代语句：当条件满足时执行一条，条件不满足时执行另一条。\n\
  \n通用语法为：\n\n```cpp\nif (expression)\nstatements1;\nelse\nstatements2;\n```\n\n首先求值\
  \ `expression`，如果结果非零（真），则执行 `statements1`。否则，`expression` 为假，执行 `statements2`。\n\
  \n例如：\n```cpp\nif(balance > 0)\n{\n    interest = balance * creditRate;\n    balance\
  \ += interest;\n}\nelse\n{\n    interest = balance * debitRate;\n    balance +=\
  \ interest;\n}\n```\n\n示例 1：\n```cpp\nif(age>18)\n    cout<<\"you are adult\";\n\
  else\n    cout<<\"You are a kid\";\n```\n\n示例 2：\n```cpp\nint x;\ncout<<\"Enter\
  \ a number: \"; cin>>x;\nif(x%2==0)\n    cout<<\" The Number is Even\"; else\n \
  \   cout<<\"The Number is Odd\";\n```\n\n示例 3：\n```cpp\nint x;\ncout<<\"Enter a\
  \ number: \";\ncin>>x;\nif(x%2)\n    cout<<\"The Number is Odd\"; else\n    cout<<\"\
  The Number is Even\";\n```\n\n\n\n\n上述三个示例说明了“if else”语句。后两个例子的作用相同，区别在于 `Eg3` 中的表达式从关系表达式变为了算术表达式。我们知道，当除数为\
  \ 2 时，取模运算符的结果要么是 0，要么是 1。因此，`Eg3` 中表达式的最终结果对于奇数是 1，对于偶数则是 0。\n\n通过将一个 if 语句放在另一个\
  \ if 语句内部，可以实现 if 语句的嵌套。例如：\n\n```cpp\nif(callHour > 3)\n{\n    if(callDuration\
  \ <= 5)\n        charge = callDuration * tarif1;\n    else\n        charge = 5 *\
  \ tarif1 + (callDuration - 5) * tarif2; \n}\nelse\n    charge = flatFee;\n```\n\n\
  e.g2. \n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\nint main()\n{\n   \
  \ int testScore;\n    cout<<”\\nEnter your test score:”; cin>>testScore;\n    if(testScore\
  \ < 70)\n        cout<<”\\n You did not pass:”; // then 块\n    else\n        cout<<”\\\
  n You did pass”; // else 块\n    getch();\n    return 0;\n}\n```\n\n上面的示例程序可以用图示表示如下：\n\
  \n^(False) `testScore < 70`?^(True) cout<<”you did pass”; cout<<”you did’t pass”;\n\
  \n### “if else if”语句\n\n“if”语句的第三种形式是“if …else if”语句。“if else if”语句允许我们指定两个以上的替代语句，每个语句都将根据对一个或多个条件的测试来执行。\n\
  \n通用语法为：\n\n```cpp\nif (expression1)\n    statements1;\nelse if(expression2) \n\
  \    statements2;\nelse if(expressionN) \n    statementsN;\nelse\n    statements\n\
  ```\n\n首先求值 `expression1`，如果结果非零（真），则执行 `statements1`。否则，将求值 `expression2`：如果 `expression2`\
  \ 的输出为真，则执行 `statements2`；否则执行 else if 语句中的下一个 `expression`，依此类推。\n\n如果“if”和“else\
  \ if”语句中的所有表达式均为假，则将执行 else 下的 `statements`。\n\n“if…else”和“if…else if”语句被称为互斥选择，因为只要满足其中一个条件（表达式），就只会执行其对应代码块中的指令，其余部分将忽略忽略。\n\
  \n例如：\n\n```cpp\nif(score >= 90)\n    cout<< “\\n your grade is A”;\nelse if(score\
  \ >= 80)\n    cout<< “\\n your grade is B”;\nelse if(score >= 70)\n    cout<< “\\\
  n your grade is C”;\nelse if(score >= 60)\n    cout<< “\\n your grade is D”;\nelse\n\
  \    cout<< “\\n your grade is F”;\n```\n\n在上面的示例中，五个 `cout` 语句中只有一个会被执行，其余的被忽略。但在满足其中一个条件或到达\
  \ else 部分之前，表达式将一直被测试或求值。\n\n### 在另一个 if 语句中嵌套 if 语句\n\n一个或多个 if 语句可以嵌套在另一个 if 语句中。\n\
  \n嵌套将用于测试多个条件以执行任务。\n\n始终建议对嵌套的 if 语句进行缩进，以增强程序的可读性。\n\n通用语法可能是：\n\n```cpp\nif (expression1)\n\
  {\n    if (expression2) statementsN; \n    else\n        statementsM;\n}\nelse\n\
  {\n    if (expression3) statementsR; \n    else\n        statementsT; \n}\n```\n\
  \n当且仅当 `expression1` 和 `expression2` 都求值且两者的结果都非零（真）时，将执行 `StatementsN`。\n\n当且仅当\
  \ `expression1` 为真且 `expression2` 为假时，将执行 `StatementsM`。\n\n当且仅当 `expression1` 为假且\
  \ `expression3` 为真时，将执行 `StatementsR`。\n\n当且仅当 `expression1` 为假且 `expression2` 为假时，将执行\
  \ `StatementsT`。\n\n让我们来看一个关于嵌套 if 语句的例子：\n\n```cpp\nint main()\n{\n    int testScore,\
  \ age;\n    cout<<”\\n Enter your test score :”;\n    cin>>testScore;\n    cout<<“\\\
  n enter your age:”;\n    cin>>age;\n    if(testScore >= 70)\n    {\n        if (age\
  \ < 10)\n            cout<<“\\n You did a great job”;\n        else\n          \
  \  cout<<“\\n You did pass”;\n    }\n    else\n        cout<<“\\n You did not pass”;\n\
  \    getch();\n    return 0;\n}\n```\n\n上面的程序可以用图示表示如下。\n\n^(False) `testScore >=70`?\
  \ ^(True) cout<<”you didn’t pass”; ^(False) `age < 10`?^(True) cout<<you did a great\
  \ job”; cout<<”you did pass”;\n\n### 4.1.1 Switch 语句\n\n另一种实现选择控制流的 C++ 语句是 `switch`\
  \ 语句（*多分支语句*）。\n\n`switch` 语句提供了一种根据表达式的值在组方案之间进行选择的方法。`switch` 语句的形式为：\n\n`switch`\
  \ 语句包含四个部分：\n\n- `Switch`\n- `Case`\n- `Default`\n- `Break`\n\n其中 `Default` 和 `Break`\
  \ 是可选的。通用语法可能是：\n\n```cpp\nswitch (expression)\n{\ncase constant1:\n    statements1;\n\
  \    break;\ncase constant2:\n    statements2;\n    break;\ndefault:\n    statements;\n\
  }\n```\n\n`switch` 求值表达式并将结果与每个 case 值进行比较。\n\n关系运算符和逻辑运算符可以使用 `switch` 标签，当且仅当预期输出为\
  \ 0（假）或 1（真），因为这是此类运算符唯一的可能输出。\n\n## 4.2 重复语句\n\n重复语句控制代码块重复执行固定次数，或直到某个条件失败为止。\n\
  \nC++ 有三种重复语句：\n\n1) *For* 语句或循环\n\n2) *While* 语句或循环\n\n3) *do…while* 语句或循环\n\n\
  ### 4.2.1 for 语句 / 循环\n\n“for”语句（也称为循环）用于重复执行一组指令，直到特定条件失败。\n\n通用语法为：\n\n```cpp\n\
  for(expression1 ; expression2 ; expression3)\n    statements;\n```\n\nfor 循环包含三个表达式：\n\
  \n\n\n`expression1`：是一个或多个语句，它们将在循环开始前只执行一次。\n\n`Expression2`：是决定继续执行循环中的指令还是停止的部分。`Expression2`\
  \ 在每次循环继续之前都会被求值。`expression2` 的输出应该是 0（继续循环）或非 0（停止循环），分别表示假和真输出。\n\n`Expression3`：是一个或多个语句，它们将在每次迭代后执行。\n\
  \n因此，首先求值 `expression1`，然后每次执行循环时都会求值 `expression2`。如果 `expression2` 的结果非零，则执行 `statements`\
  \ 并求值 `expression3`。否则，循环终止。\n\n在大多数程序中，“for 循环”将用于此类表达式，其中 `expression1` 是 `initialization`（初始化），`expression2`\
  \ 是 `condition`（条件），而 `expression3` 是 `increment`（递增）或 `decrement`（递减）。\n\n为了清晰起见，通用格式可以表示如下：\n\
  \n###for(initialization ; condition ; increase/decrease) statement;`\n\n![](img/image00150.gif)![](img/image00151.gif)![](img/image00152.gif)![](img/image00153.gif)![](img/image00154.gif)\n\
  \nfor 循环的执行步骤：\n\n1. 执行初始化。（只执行一次）\n2. 检查条件，如果为真则继续循环，否则循环结束并跳过语句。\n3. 执行语句。\n4.\
  \ 最后，执行递增或递减字段中指定的任何内容，然后回到回到步骤 2。\n\n例如，猜猜以下代码的输出：`int main()`\n\n```cpp\nint main()\n\
  {\n  for(int i=10;i>0;i--)\n  {\n    cout<<n<<“,”;\n  }\n  cout<< “FIRE!”;\n  getch();\n\
  \  return 0;\n}\n```\n\n虽然不建议，但 `expression1`、`expression2` 和 `expression3` 是可选的或可以被忽略。这意味着它们可以取空语句（NULL\
  \ statement）。\n\n但将 `expression2` 置为空意味着循环不会终止。在这种情况下，可以在 `for` 循环内部包含一个“if”语句，该语句将测试条件并使用\
  \ `break` 语句跳出循环。\n\n虽然将三个表达式中的一个或多个为空，分号不能被忽略。\n\n例如：\n\n`for (;n<10;)` // 如果我们既不需要初始化也不需要递增/递减\
  \ `for(;n<10;n++)` // 如果不需要初始化。\n\n`for ( ; )` // 是无限循环，除非循环内部有 if 语句。\n\n已声明 `expression1`\
  \ 和 `expression3` 可以是一个或多个语句。复合语句之间应该用逗号分隔。这意味着可选地，使用逗号运算符（（`），我们可以在“for”循环包含的两个字段中的任何一个中指定多个指令。\n\
  \n例如 `for(n=0,i=100;n!=i; n++,i--)`\n\n```cpp\n{\n  //任何内容\n}\n```\n\n在上面的示例中，`n=0`\
  \ 和 `i=100` 将是 `expression1` 的部分，并在循环开始前只执行一次。此外，`n++` 和 `i—` 将是 `expression3` 的部分，并在每次循环/迭代后执行。\n\
  \n例：1\n\n```cpp\n// 以下 for 语句累加 0 到 n 之间的数字\nint Sum=0;\nfor(int i=0; i<=n;i++)\n\
  \  Sum=Sum+i;\n```\n\n例：2\n\n```cpp\n// 以下 for 语句累加 0 到 n 之间的偶数\nint Sum=0;\nfor(int\
  \ i=0; i<=n;)\n{\n  Sum=Sum+i; i+=2;\n}\n```\n\n例：3\n\n```cpp\n// 以下 for 语句累加 0\
  \ 到 n 之间的偶数\n// 在这里所有三个表达式都为空。\nint Sum=0;\nint i=0;\nfor( ; ; )\n{\n  If(i<=n)\
  \ break;\n  else\n  {\n    Sum=Sum+i;\n    i++;\n  }\n}\n```\n\n在上面的示例中，初始化位于循环开始之前的顶部，条件放在执行指令之前的\
  \ if 语句中，递增位于循环中要执行语句的之后。\n\n**注意：** 尽管在“for”循环中可以将所有三个表达式置为空，但不建议将条件置为空语句。\n\n\
  ### 4.2.2. while 语句\n\nwhile 语句（称为 while 循环）提供了一种只要条件成立/真就重复语句或块的方法。\n\nwhile 循环的通用形式是：\n\
  \n###while(expression) statements;`\n\n首先求值 `expression`（称为 `循环条件`）。如果结果非零，则执行语句（称为\
  \ `循环体`）并重复整个过程。否则，循环终止。\n\n假设我们想要计算从 1 到某个整数值 `n` 的所有数字的和。这可以表示为：\n\n例：1// 累加 0\
  \ 到任何给定数字 `n` 之间的数字\n\n```cpp\ni=1;\nsum = 0;\nwhile(i <= n)\n  sum += i++;\n```\n\
  \n例：2// 累加 0 到 100 `number`\n\n```cpp\nnumber=1;\nsum=0;\nwhile(number)\n```\n\n\
  \n\n\n循环控制变量的初始化。用于测试是否已完成适当次数重复的表达式\n\n在循环体每次迭代时执行的循环控制变量的更新\n\n#### 4.2.5.2. 事件控制循环\n\
  \n重复语句或块，直到循环体内的某个条件发生变化导致重复停止。\n\n### 事件控制循环的类型\n\n1. **哨兵值控制：**\n继续处理数据，直到输入一个不是可能的数据值的特殊值，表示应停止处理。\n\
  \n2. **文件结束（EOF）控制：**\n只要文件中还有剩余数据，就继续处理数据。\n\n3. **标志位控制：**\n继续处理数据，直到循环体内标志位的值发生变化\n\
  \n## 4.3. continue 和 break 语句\n\n### 4.3.1. continue 语句\n\n`continue` 语句终止循环的当前迭代，并直接跳转到下一次迭代。\n\
  \n在循环外部使用 `continue` 语句是错误的。\n\n在 `while` 和 `do while` 循环中，下一次迭代从循环条件开始。\n\n在“for”循环中，下一次迭代从循环的第三个表达式开始。\n\
  \n例如：\n\n```cpp\nfor(int n=10;n>0;n--)\n{\n    if(n==5)\n        continue; //导致跳转到\
  \ n—\n    cout<<n<<,”;\n}\n```\n\n当 `continue` 语句出现在嵌套循环中时，它作用于直接包含它的循环，而不是外层循环。例如，在下述的嵌套循环中，`continue`\
  \ 语句作用于“for”循环，而不是“while”循环。\n\n例如：\n\n```cpp\nwhile(more)\n{\n    for(i=0;i<n;i++)\n\
  \    { \n        cin>>num; \n        if(num<0)\n            continue; //导致跳转到 :\
  \ i++ \n    }\n}\n```\n\n### 4.3.2. break 语句\n\n`break` 语句可以出现在循环（`while`、`do` 或\
  \ `for`）或 `switch` 语句内部。它导致跳出这些结构，从而终止它们。\n\n与 `continue` 语句一样，`break` 语句仅作用于直接包含它的“循环”或“switch”。在循环或\
  \ `switch` 语句外部使用 `break` 语句是错误的。\n\n例如：\n\n```cpp\nfor(n=10;n>0;n--)\n{ \n    cout<<n<<,”;\n\
  \    if(n = = 3)\n    { \n        cout<< “count down aborted!!”;\n        break;\n\
  \    }\n}\n```\n\n亚迪斯亚贝大学\n信息学院\n编程导论 (C++)\n\n#### 习题 3：确保在任何有可能的情况下循环。\n\n1. 编写\
