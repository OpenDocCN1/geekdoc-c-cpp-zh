  \ // 显示名字\nsout<<Stud.CGPA; // 显示 Abebe 的 CGPA\n```\n\n### 初始化结构数据\n\n你可以在声明结构时初始化成员，也可以在程序体中初始化结构。这是一个完整的程序。\n\
