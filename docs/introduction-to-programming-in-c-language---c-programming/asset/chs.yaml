  \n15. 修改第 14 题的题目，将人名中的元音字符替换为 `*`。\n\n16. 编写一个 C++ 程序，读取一个三位数，并使用上述数字生成所有可能的数字排列。例如\
  \ `n = 123`，则排列为 – 123, 213, 312, 132, 231, 321。\n\n17. 编写一个程序，读取一系列行，直到你输入 `#`\
  \ 为止。\n\n18. 编写一个程序，读取两个矩阵，然后打印这两个矩阵相加的矩阵。\n\n19. 编写一个程序，读取两个矩阵并在可能的情况下进行乘法。\n\n\
  20. 编写一个程序，读取一个 3 x 2 矩阵，然后计算每行的和并存储在一个一维数组中。\n\n# 第六章 指针 6. 引言\n\n我们已经看到变量是可以通过标识符访问的内存单元。但这些变量存储在计算机内存的具体位置。对于我们的程序来说，计算机内存只是连续的\
  \ 1 *byte* 单元（数据的最小尺寸），每个单元都有唯一的地址。指针是一个存储另一个变量地址的变量。指针变量和普通变量之间的唯一区别在于它们所持的数据。C++\
  \ 中有两个指针运算符：\n\n- `&` 取地址运算符\n- `*` 解引用运算符\n\n每当你看到 `&` 与指针一起使用时，想想“地址的”这个词。`&`\
  \ 运算符总是产生其紧随操作对象的内存地址。`*` 运算符在与指针配合时，要么声明一个指针，要么解引用指针的值。解引用运算符可以字面翻译为“指针所指向的值”。\n\
  \n**指针**简单来说就是内存中对象的地址。通常，对象可以通过两种方式访问：直接通过其符号名称访问，或通过指针间接访问。通过指针访问对象的行为被称为指针的**解引用**（dereferencing）。指针变量被定义为指向特定类型的对象，这样当指针被解引用时，就能获得一个类型对象。\n\
  \n当我们声明一个变量时，它必须存储在这一系列单元（内存）的具体位置中。我们通常不决定变量放置在哪里——幸运的是，这是由编译器和操作系统在运行时自动完成的，但一旦操作系统分配了地址，在某些情况下，我们可能想知道变量存储在哪里。这可以通过在变量标识符前加上取地址符号（`&`）来实现，它的字面意思是“……的地址”。例如：\n\
  \n```\nptr = &var;\n```\n\n这将变量 `var` 的地址赋值给变量 `ptr`，因为在变量名 `var` 前加上取地址字符（`&`）时，我们不再是在讨论变量的内容，而是它在内存中的地址。\n\
  \n我们假设 `var` 被放置在内存地址 `1776`，并且写了如下代码：\n\n```cpp\nvar=25;\nx=var;\nptr = &var;\n\
  ```\n\n结果将如下所示：\n\n![](img/image00161.gif)\n\n我们为 `x` 分配了变量 `var` 的内容，就像我们在之前的章节中多次做的那样，但为\
  \ `ptr` 分配了操作系统存储 `var` 值的内存地址，我们想象那个地址是 `1776`（可以是任何地址）。这是因为在分配 `ptr` 时，我们在 `var`\
  \ 前加上取地址字符（`&`）。存储另一个变量地址的变量（如上一个例子中的 `ptr`）就是我们说的**指针**。\n\n## 6.1 声明指针\n\n在堆中为指针变量预留内存位置。语法为：\n\
  \n```cpp\ntype * pointer_name;\n```\n\n要声明一个名为 `p_age` 的指针变量，执行以下操作：\n\n```cpp\n\
  int * p_age;\n```\n\n每当解引用运算符 `*` 出现在变量声明中时，被声明的变量总是指针变量。\n\n## 6.2 给指针赋值\n\n`p_age`\
  \ 是一个整数指针。指针的类型非常重要。`p_age` 只能指向整数值，不能指向浮点型或其他类型。要给 `p_age` 分配变量的地址，执行以下操作：\n\n\
  ```cpp\nint age = 26;\nint * p_age;\np_age = &age;\n```\n\n或者\n\n```cpp\nint age\
  \ = 26;\nint * p_age = &age;\n```\n\n两种方式都是可行的。如果你想打印 `age` 的值，执行以下操作：\n\n```cpp\n\
  int age = 26;\nint * p_age = &age;\ncout<<age; //打印 age 的值\n```\n\n或者使用指针，可以这样做：\n\
  \n```cpp\nint age = 26;\nint * p_age = &age;\ncout<<*p_age; //打印 age 的值\n```\n\n\
  解引用运算符产生一个告诉指针指向哪里的值。`age`。在不使用 `*` 时（即 `cout<<p_age`），`cout` 语句打印的是地址（age 的地址）。使用\
  \ `*`，`cout` 输出的是该地址的值。\n\n可以通过以下语句给 `age` 分配一个新的值：\n\n```cpp\nage = 13;//给变量 age\
  \ 赋新值\n```\n\n```cpp\n*p_age = 13 //将 13 赋予 p_age 指向的内存\n```\n\n注意：`*` 在指针变量前出现在两个地方：声明指针变量以及解引用指针变量（以找到它指向的数据）。\n\
  \n- 下面的程序你应该仔细研究。它展示的指针以及指针运算符 `&` 和 `*` 信息比几页文本还要多。\n\n```cpp\nvoid main() {\n\
  \    int num = 123; //一个普通的整数变量\n    int *p_num; //声明一个整数指针\n    cout<< “num is\
  \ ”<<num<<endl;\n    cout<< “the address of num is ”<<&*num<<endl;\n    p_num =\
  \ &num;//将 num 的地址放入 p_num\n    cout<< “*p_num is ”<<*p_num<<endl;//打印 num 的值\n\
  \    cout<< “p_num is ”<<p_num<<endl;//打印 p_num 的值\n    getch();\n}\n```\n\n## 6.3\
  \ 空指针\n\n注意我们不能将浮点类型变量的地址赋值给整数指针变量，同样，整数变量的地址不能存储在浮点或字符指针中。\n\n```cpp\nfloat y;\n\
  int x;\nint *ip;\nfloat *fp;\n\nip = &y; //非法语句\nfp = &x; //非法语句\n```\n\n这意味着，只有当变量类型和指针指向类型相同时，我们才能将变量的地址赋值给指针变量。如果两者类型不同，则我们不能将变量的地址赋值给指针变量，但在\
  \ C++ 中通过将指针变量声明为空指针也可以实现：\n\n```cpp\nvoid *p;\n```\n\n让我们看一个例子：\n\n```cpp\nvoid\
  \ *p;\nint x;\nfloat y;\np = &x; //有效赋值\np = &y; //有效赋值\n```\n\n\n\n空指针的困难之处在于，空指针不能被解引用。它们仅用于存储地址，不允许对空指针使用解引用操作符。\n\
  \n### 6.4 指针数组\n\n如果你需要为许多不同的值预留许多指针，你可能声明一个指针数组。\n\n以下代码预留了一个包含 10 个整数指针变量的数组：\n\
  \n```cpp\nint *iptr[10]; //预留了一个包含 10 个整数指针的数组*\n```\n\n上述语句将在 RAM 中创建以下结构：\n\n\
  **. . . . . . . . . .**\n\n`iptr[4] = &age; // 让 iptr[4] 指向 age 的地址。\n\n### 6.5\
  \ 指针与数组\n\n数组的概念与指针紧密相关。事实上，数组的标识符等同于其第一个元素的地址，就像指针等同于它所指向的第一个元素的地址，因此实际上它们是同一件事。例如，假设有这两个声明：\n\
  \n```cpp\nint numbers [20]; int * p;\n```\n\n接下来的分配是有效的：\n\n```cpp\np = numbers;\n\
  ```\n\n此时 `p` 和 `numbers` 是等价的，它们具有相同的属性，唯一的区别是我们可以给指针 `p` 分配另一个值，而 `numbers` 将始终指向它被定义时那\
  \ 20 个 int 类型整数中的第一个。所以，与 `p`（它是一个普通的变量指针）不同，`numbers` 是一个常量指针（实际上是一个数组：一个常量指针）。因此，虽然之前的表达式是有效的，但下面的分配是非的：\n\
  \n```cpp\nnumbers = p;\n```\n\n因为 `numbers` 是一个数组（常量指针），不能给常量标识符赋值。\n\n**注意：** 数组名仅仅是一个指针，仅此而已。数组名始终指向数组中存储的第一个元素。因此，我们可以有以下有效的\
  \ C++ 代码：\n\n```cpp\nint ara[5] = {10,20,30,40,50};\ncout<< *(ara + 2); //打印 ara[2];\n\
  ```\n\n如果你记得数组名只是一个始终指向数组第一个元素的指针，那么 `*(ara+2)` 表达式完全并不模糊。`*(ara+2)` 取 `ara` 中存储的地址，在该地址上加\
  \ 2，并对该位置进行解引用。\n\n考虑以下字符数组：\n\n```cpp\nchar name[] = “C++ Programming”;\n```\n\n\
  以下 `cout` 语句会产生什么输出？\n\n```cpp\ncout<<name[0]; // ____C__\ncout<<*name; // _____C__\n\
  cout<<*(name+3); //_________\ncout<<*(name+0); //____C____\n```\n\n### 6.6 指针的优势\n\
  \n你不能改变数组名的值，因为你不能改变常量。这解释了为什么你可以在程序执行期间给数组赋新值：例如：如果 `Cname` 是字符数组，那么：\n\n```cpp\n\
  Cname = “Football”; //无效的数组赋值;\n```\n\n与数组不同，你可以改变指针变量。通过改变指针，你可以让它们指向内存中不同的值。看以下代码：\n\
  \n```cpp\nvoid main() {\n    clrscr();\n    float v1 = 679.54; float v2 = 900.18;\
  \ float * p_v;\n    p_v =\n    cout<< “\\nthe first value is ”<<*p_v; p_v =\n  \
  \  cout<< “\\nthe second value is ”<<*p_v; getch();\n}\n```\n\n你可以使用指针表示法并将指针像数组表示法一样使用。仔细学习以下程序。它展示了数组和指针表示法的内部机制。\n\
  \n```cpp\nvoid main()\n{\n    clrscr();\n    int ctr;\n    int iara[5] = {10,20,30,40,50};\n\
  \    int *iptr;\n    iptr = iara; // 让 iprt 指向数组的第一个元素。或者 iprt =* &*iara[0] \n \
  \   cout<< “using array subscripts:\\n”\n    cout<< “iara\\tiptr\\n”;\n    for(ctr=0;ctr<5;ctr++)\n\
  \    {\n        cout<<iara[ctr]<< “\\t”<< iptr[ctr]<< “\\n”;\n    }\n    cout<<\
  \ “\\nUsing pointer notation\\n”; \n    for(ctr=0;ctr<5;ctr++)\n    {\n        cout<<\
  \ *(iara+ctr) << “\\t” << *(iptr+ctr)<< “\\n”;\n    }\n    getch();\n}\n```\n\n\
  假设你想存储一个人的名字并打印它。与其使用数组，你你可以使用字符指针。以下程序正是这样做的。\n\n```cpp\nvoid main() {\n    clrscr();\n\
  \    char *c = “Meseret Belete”;\n    cout<< “your name is : ”<<c;\n}\n```\n\n假设你必须更改由字符指针指向的字符串，如果上述代码中的人的名字改为\
  \ Meseter Alemu：看以下代码：\n\n```cpp\nvoid main() {\n    char *c = “Meseret Belete”;\n\
  \    cout<< “youe name is : ”<<c;\n    c = “Meseret Alemu”;\n    cout<< “\\nnew\
  \ person name is : ”<<c;\n    getch();\n}\n```\n\n如果 `c` 是字符数组，你永远无法直接给它赋值，因为数组名不能更改。\n\
  \n### 6.7 指针算术\n\n对指针进行算术运算是不同的，只允许进行加法和减法。\n\n\n\n每当你使用 `*` 解引用运算符对任何指针元素进行解引用时，你访问的是数组中的字符串之一。\n\
  \n### 6.9. 指向指针的指针\n\n由于存储整数、浮点数或字符的内存地址可以存储在指针变量，因此指针的地址也可以存储在另一个指针中。这种指针被称为指向指针的指针。指针数组在概念上等同于指向指针的类型。指向指针的类型声明如下：\n\
  \n`Data_type ** pointer_name;`\n\n注意这里的星号是双倍的。\n\n`int **p; //p 是一个持有另一个指针地址的指针*`\n\
  \n`例如：char a; char * b; char ** c; a = 'z'; b =* &*a; c =* &*b;`\n\n这假设随机选择的内存位置为\
  \ `7230`、`8092` 和 `10502`，可以这样描述：\n\n![](img/image00163.jpeg)\n*(单元格内部是变量的内容；单元格下方是它的位置)*\n\
  \n看下方的代码：\n\n```cpp\nvoid main()\n{\n    clrscr();\n    int data;\n    int *p1;\n\
  \    int **p2;\n    data = 15;\n    cout<< “data = ”<<data<<endl;\n    p1 = data;\n\
  \    p2 =\n    cout<< “data through p1 = ”<<*p1<<endl; \n    cout<< “data through\
  \ p2 = ”<< **p2<<endl; getch();\n}\n```\n\n### 6.10. 动态内存\n\n到目前为止，在我们的程序中，拥有的内存仅限于变量、数组和其他包含的对象声明中所请求的内存，所有对象的大小在程序执行之前就是固定的。但是，如果我们需要只有在程序执行期间（运行时）才能确定的变量内存怎么办？例如，我们需要根据用户输入来确定所需的空间。答案是动态内存，C++\
  \ 为此集成了 `new` 和 `delete` 运算符。\n\n指针对于程序执行期间创建动态对象非常有用。与在运行时栈栈上分配存储的普通（全局和局部）对象不同，动态对象是从一个称为“堆”（heap）的不同存储区域分配内存的。动态对象不遵守标准的作用域规则。它们的作用域由程序员显式控制。\n\
  \n#### a) New 运算符\n\n- 在 C++ 中，`new` 运算符可以动态创建空间，即运行时，同样地，可以使用 `delete` 运算符，它可以释放变量占用的内存并将内存返回操作系统。\n\
  - 如果在编译时为变量创建空间，则这种方法称为静态的。如果在运行时为变量创建空间，则这种方法称为动态的。看以下两行：\n\n```cpp\nint a[10];//创建静态数组\n\
  int *a;\na = new int[10];//创建动态数组\n```\n\n- 让我们再看另一个例子：\n\n```cpp\nint * ptr3;\n\
  ptr3 = new int [5];\n```\n\n- 在这种情况下，操作系统已经在堆中为 5 个 `int` 类型的元素分配了空间，并返回一个指向其起始位置的指针赋值给\
  \ `ptr3`。因此，现在 `ptr3` 指向一个具有 5 个 `int` 元素空间的有效内存块。\n\n![](img/image00164.gif)\n\n\
  - 你可能会问声明普通数组与我们刚刚做的为指针分配内存之间有什么区别。最重要的一点是数组的大小必须是一个常量值，这将其大小限制在我们在程序执行前设计程序时决定的范围内，而动态内存允许在程序执行期间使用任何变量、常量或两者的组合作为大小来分配内存。\n\
  - 动态内存通常由操作系统管理，在多任务接口中可以在多个应用程序之间共享，因此存在内存耗尽的可能性。如果发生这种情况且操作系统无法通过 `new` 运算符分配我们请求的内存，将返回一个空指针（null\
  \ pointer）。因此建议始终在调用 `new` 指令后验证返回的指针是否为空：\n\n```cpp\nint * ptr3;\nptr3 = new int\
  \ [5];\nif (ptr3 == NULL) {\n    // 分配内存错误。采取措施。\n}\n```\n\n- 如果 `ptr3` 为 `NULL`，意味着堆中没有足够的内存位置分配给\
  \ `ptr3`。\n\n#### b) delete 运算符\n\n- 由于动态内存的必要性通常限于程序中的特定时刻，一旦不再需要它，就应该被释放，以便供未来的动态内存请求使用。因此存在\
  \ `delete` 运算符，其形式为：\n\n`delete pointer;`\n\n或\n\n`delete [] pointer;`\n\n- 第一个表达式应用于删除为单个元素分配的内存，第二个用于为多个元素（数组）分配的内存。\n\
  - 在大多数编译器中，这两个表达式是等价的，可以无区分使用，尽管它们确实是两个不同的运算符，因此在运算符重载时必须考虑它们。\n- 在下面的简单示例中，一个记录数字的程序对引入数字的数量没有限制，得益于指针的概念和力量，我们向系统请求足够的空间来存储用户想要引入的所有数字。\n\
  \n```cpp\n#include <iostream.h> \n#include <stdlib.h> \n#include<conio.h> \nint\
  \ main ()\n{\n    char input [100];\n    int i,n;\n    long * num = 0;\n    cout\
  \ << \"你想输入几个数字?\"; \n    cin.getline(input,100);\n    i=atoi(input);\n    num=\
  \ new long[i];\n    if (num == NULL) {\n        cout <<nenough memory!\";\n    \
  \    getch();\n        exit (1);\n    }\n    for (n=0; n<i; n++)\n    {\n      \
  \  cout << \"输入数字:\"; \n        cin.getline(input,100);\n        num[n]=atol(input);\n\
  \    }\n    cout << \"你输入的数字是:\"; \n    for (n=0; n<i; n++)\n    cout << num[n]\
  \ << \", \";\n    delete[] num;\n    getch();\n    return 0;\n}\n```\n\nNULL 是 C++\
  \ 库中定义的常量值，用于表示空指针。如果该常量未定义，你可以将其定义为 0。\n\n### 第章文件操作 (File/O)\n\n#### 引言\n\n- 用户创建并赋值给变量的数据对于某些应用程序是足够的。对于大量数据，大多数现实应用程序使用更好的存储数据的方式。为此，磁盘文件提供了解决方案。\n\
  - 当处理磁盘文件时，C++ 不需要访问大量内存，因为 C++ 从磁盘驱动器读取数据并仅处理部分。\n\n## 7.2 流 (Stream)\n\n- 流是数据流通用名称。在\
  \ C++ 中有不同类型的流。每个流都与特定的类关联，该类包含了处理文件的成员函数和定义。让我们看看图：\n\n```ios\nistream ostream\n\
  ifstream^(iostream)\nfstream\n```\n\n- 根据上面的层次结构，iostream 类派生自 istream 和 ostream，而\
  \ istream 和 ostream 都派生自 ios。同样，fstream 类派生自 iostream。\n- 注意当我们在程序中包含 fstream.h\
  \ 头文件时，没有需要再包含 iostream.h 头文件。因为 fstream.h 中的所有类都派生自 iostream.h 中的类。\n\n## 7.3：与文件的操作\n\
  \n- 首先我们将看到如何打开和关闭文件。文件可以通过以下类定义：ifstream, ofstream, fstream，这些这些都定义在 fstream.h\
  \ 头文件中。\n\n\n\n\n- 如果文件对象是由 `fstream` 类声明的，那么该对象可以用于对文件进行`读取`和`写入`。\n\n## 7.4: 磁盘文件的访问类型\n\
  \n- 你的程序可以以顺序（sequential manner）方式或随机（random manner）方式访问文件。文件的访问模式决定了如何从文件中读取、写入、修改、添加和删除数据。\n\
  \n- 顺序文件必须按照文件写入的相同顺序进行访问。这比比磁带：你按照音乐录音的顺序播放音乐。\n\n- 与顺序文件不同，你可以按照任何所需的顺序对文件进行随机访问。将随机访问文件中的数据想象成类似于光盘（CD）上的歌曲：你可以直接跳转到任何想要播放的歌曲，而无需播放或快进（快进）其他歌曲。\n\
  \n### 7.4.1: 顺序文件概念\n\n- 你可以对顺序磁盘文件执行三种操作。你可以`create`（创建）磁盘文件、向磁盘文件`add`（添加）以及从磁盘文件`read`（读取）内容。\n\
  \n### 7.4.1.1: 打开和关闭顺序文件\n\n- 当你打开一个磁盘文件时，你只需要告知 C++ 文件名以及你想对它做什么。C++ 和你的操作系统协同工作，以确保磁盘已就绪，并会在你的文件目录中为文件名创建一个条目（如果你正在创建一个文件的话）。当你关闭文件时，C++\
  \ 会将任何剩余数据写入文件，从程序中释放该文件，并更新文件目录以反映文件的新大小。\n\n- 你可以使用 C++ 中的两种方法之一来打开文件：\n    -\
  \ 使用 `Constructor`（构造函数）\n    - 使用 `open function`（open 函数）\n\n- 下面的 C++ 语句将创建一个名为\
  \ `fout` 的 `ofstream` 类对象，且该对象将与文件名“hello.txt”关联。\n\n```cpp\nofstream fout (“hello.txt”);\n\
  ```\n\n该语句使用了构造函数方法。\n\n- 下面的 C++ 语句将创建一个名为 `fout` 的 `ofstream` 类对象，且该对象将与文件名“hello.txt”关联。\n\
  \n```cpp\nofstream fout;\nfout.open(“hello.txt”);\n```\n\n- 如果你以写入模式（out access\
  \ mode）打开文件，C++ 会创建该文件。如果已存在同名文件，`C++ overwrite` 将覆盖旧文件且不发出警告。在打开文件时必须小心不要覆盖你想要的现有数据。\n\
  \n- 如果在打开文件期间发生错误，C++ 不会创建有效的文件指针（文件对象）。相反，C++ 会创建一个等于零的文件指针（对象）。例如，如果你打开一个文件进行输出但使用了无效的磁盘名，C++\
  \ 将无法打开该文件，因此使文件对象等于零。\n\n- 你也可以在 C++ 中创建文件时确定文件访问模式。如果你想使用 `open function` 打开文件，语法如下：\n\
  \n```cpp\nfileobject.open(filename,accessmode);\n```\n\n- filename 是一个包含你计算机上有效文件名的字符串。\n\
  - Accessmode 是要在文件上执行的目标操作，必须是下表中的值之一。\n\n| 模式 | 描述 |\n| :--- | :--- |\n| app |\
  \ 以追加模式打开文件 |\n| ate | 打开文件时移动到文件末尾 |\n| in | 以读取模式打开文件 |\n| out | 以写入模式打开文件 |\n\
  | binary | 以二进制模式打开文件 |\n\n- 在对文件进行操作之前，你应该始终检查文件是否成功打开。你使用 `fail()` 函数来完成此任务：\n\
  \n- 让我们来看例子：\n\n```cpp\nifstream indata;\nindata.open(“c:\\\\myfile.txt”,ios::in);\
  \ \nif(indata.fail())\n{\n    // 此处写错误描述\n}\n```\n\n- 在情况下，如果 `C:\\` 目录中没有名为 `myfile.txt`\
  \ 的文件，打开操作将失败（即 `fail` 函数将返回 true）。\n\n- 在完成文件操作后，你应该使用 `close` 函数释放文件操作消耗的任何资源。这里有一个示例：\n\
  \n```cpp\nindata.close();\n```\n\n上述 `close()` 语句将终止 `ifstream` 对象 `indata` 与文件名“c:\\\
  myfile.txt”之间的关系，从而释放系统所需的任何资源。\n\n### 7.4.1.2: 写入顺序文件\n\n- 最常用的文件 I/O 函数是 `get()`\
  \ 和 `put()`。\n\n- 你也可以使用输出重定向运算符（`<<`）写入文件。\n\n- 下面程序在 `C:\\` 中创建一个名为 `names.txt`\
  \ 的文件，并在其中保存五个人的名字：\n\n```cpp\n#include<fstream.h>\n#include<stdlib.h>\nofstream\
  \ fp;\nvoid main()\n{\n    fp.open(“c:\\\\names.txt” ,ios::out); \n    if(fp.fail())\n\
  \    {\n        cerr<< “\\nError opening file”; getch();\n        exit(1);\n   \
  \ }\n    fp<< “Abebe Alemu”<<endl; \n    fp<< “Lemelem Berhanu”<<endl;\n    fp<<\
  \ “Tesfaye Mulugeta”<<endl; \n    fp<< “Mahlet Kebede”<<endl; \n    fp<< “Assefa\
  \ Bogale”<<endl; \n    fp.close();\n}\n```\n\n向顺序文件写入字符：\n\n- 你可以使用 `put()` 函数向顺序文件写入字符。\n\
  \n- 你也可以使用输出重定向运算符（`<<`）向文件写入数据。\n\n- 下面程序在 `C:\\` 中创建一个名为 `names.txt` 的文件，并在其中保存了五个人的名字：\n\
  \n```cpp\n#include<fstream.h>\n#include<stdlib.h>\nofstream fp;\nvoid main()\n{\n\
  \    fp.open(“c:\\\\names.txt” ,ios::out); \n    if(fp.fail())\n    {\n        cerr<<\
  \ “\\nError opening file”; getch();\n        exit(1);\n    }\n    fp<< “Abebe Alemu”<<endl;\
  \ \n    fp<< “Lemelem Berhanu”<<endl;\n    fp<< “Tesfaye Mulugeta”<<endl; \n   \
  \ fp<< “Mahlet Kebede”<<endl; \n    fp<< “Assefa Bogale”<<endl; \n    fp.close();\n\
  }\n```\n\n*从顺序文件中读取字符*\n\n- 你可以使用 `get()` 函数从文件中读取字符。下面的程序请求文件名，并在屏幕上显示文件的*每个字符*。注意：字符之间的空格被认为也是一个字符，因此屏幕上将显示文件的精确副本。\n\
  \n```cpp\n#include<fstream.h>\n#include<conio.h>\n#include<stdlib.h>\nvoid main()\n\
  {\n    char c,filename[15];\n    ifstream indata;\n}\n```\n\n\n\n\n\n```cpp\ncout<<\"\
  \\nEnter the file name : \"; cin.getline(filename,15);\n\nindata.open(filename,ios::in);\n\
  \nif(indata.fail())// check id open succeeded {{\ncerr<<\"\\nError opening file\
  \ : \"<<filename; getch();\nexit(1);\n}\n\nwhile(!indata.eof())// check for eof\n\
  {\nindata.get(c); cout<<c;\n}\n\nindata.close();\n\ngetch();\n```\n\n### 7.4.1.4:\
  \ 文件指针及其操纵符\n\n- 每个文件都有两个指针：一个称为`输入指针`（input pointer），另一个称为`输出指针`（output pointer）。输入指针被称为`get\
  \ 指针`（get pointer），输出指针被称为`put 指针`（put pointer）。\n- 当输入和输出操作发生时，会根据访问模式自动设置相应的指针。\n\
  - 例如，当我们以读取模式打开文件时，文件指针会自动设置为文件的开头。\n- 当我们以追加模式打开文件时，文件指针会自动设置为文件的末尾。\n- 在 C++ 中，有一些操纵符可以用来控制指针的移动。可用的操纵符有：\n\
  \  1. `seekg()`\n  2. `seekp()`\n  3. `tellg()`\n  4. `tellp()`\n\n1. `seekg()`：将`get\
  \ 指针`（即`输入指针`）移动到指定位置。例如，`infile.seekg(5);` 将文件指针移动到从起始点的第 5 个字节。\n2. `seekp()`：将`put\
  \ 指针`（`输出指针`）移动到指定位置，例如：`outfile.seekp(5);`\n3. `tellg()`：给出`get 指针`（`输入指针`）当前的位置。\n\
  4. `tellp()`：给出`put 指针`（`输出指针`）当前的位置，例如 `ofstream fileout;` `fileout.open(“c:\\\\\
  test.txt”,ios::app); int length = fileout.tellp();`\n\n- 通过上述语句 `length`，文件的总字节数被赋值给整数变量\
  \ `length`。由于文件是以追加模式打开的，这意味着文件指针位于文件的最后部分。\n- 现在让我们看看 `seekg()` 函数的实际用法\n\n```cpp\n\
  #include<fstream.h> #include<conio.h> #include<stdlib.h> void main()\n{\nclrscr();\n\
  fstream fileobj;\nchar ch; //holds A through Z\n//以以输出和输入模式打开文件 fileobj.open(\"\
  c:\\\\alph.txt\",ios::out|ios::in); if(fileobj.fail())\n{\ncerr<<\"\\nError opening\
  \ alph.txt\"; getch();\nexit(1);\n}\n//现在将字符写入文件 for(ch = 'A'; ch <= 'Z'; ch++)\n\
  {\nfileobj<<ch;\n}\nfileobj.seekg(8L,ios::beg);//跳过 8 个字母，指向 I fileobj>>ch;\ncout<<\"\
  \\nThe 8th character is : \"<<ch;\nfileobj.seekg(16L,ios::beg);//跳过 16 个字母，指向 Q\
  \ fileobj>>ch;\ncout<<\"\\nThe 16th letter is : \"<<ch;\nfileobj.close();\ngetch();\n\
  }\n```\n\n-  若要指向数据文件的末尾，你可以使用 `seekg()` 函数将文件指针定位在最后一个字节。该语句将文件指针置于文件的最后一个字节。`Fileobj.seekg(0L,ios::end);`\n\
  - 此 `seekg()` 函数的字面意思是“从文件末尾移动文件指针 0 个字节”。文件指针现在指向文件结束标记，但你可以向后 `seekg()` 以找到文件中的其他数据。\n\
  - 下面的程序预设是反向读取“c:\\alph.txt”文件，在向文件中向回跳过时打印每个字符。\n- 确保程序中的 `seekg()` 从*当前*位置向后移动两个字节，而不是像之前的程序那样从开头或结尾移动。程序末尾的\
  \ for 循环需要执行“向后跳两个字节，向前读取一个字节”的方法来反向跳过文件。\n\n```cpp\n#include<fstream.h> #include<conio.h>\
  \ #include<stdlib.h>\nvoid main() {\nclrscr();\nifstream indata; int ctr=0;\nchar\
  \ inchar;\nindata.open(\"c:\\\\alph.txt\",ios::in); if(indata.fail())\n{\ncerr<<\"\
  \\nError opening alph.txt\"; getch();\nexit(1);\n}\nindata.seekg(-1L,ios::end);//指向文件中的最后一个字节\
  \ for(ctr=0;ctr<26;ctr++)\n{\nindata>>inchar;\nindata.seekg(-2L,ios::cur); cout<<inchar;\n\
  }\nindata.close();\ngetch();\n}\n```\n\n### 文本文件与二进制文件（比较）\n\n- 文件访问的默认模式是`文本模式`（text\
  \ mode）。文本文件是 ASCII 文件，与大多数其他编程语言和应用程序兼容。读取 ASCII 文件的程序可以读取你作为 C++ 文本文件创建的数据。\n\
  - 如果你指定二进制访问，C++ 将以二进制格式创建或读取文件。二进制数据文件是“被压缩的”——也就是说，它们占用的空间比文本文件少。使用二进制文件的缺点是其他程序并不总是能读取这些数据文件。只有编写用于访问二进制文件的\
  \ C++ 程序才能读取和写入它们。二进制文件的优点是节省了磁盘空间。\n\n### 7.4.2: 随机访问概念\n\n- 随机访问允许你读取或写入文件的任何部分，而无需读取整个文件。\n\
  - 使用固定长度记录，你的计算机可以计算出磁盘上的位置。\n\n### 7.2.2.1 打开访问文件\n\n- C++ 中的顺序文件和随机文件实际上没有区别。区别在于你用于访问和更新的方法。\n\
  - `ostream` 成员函数 `write` 从特定位置开始向指定的流输出固定数量的字节。\n- 当流与文件关联时，`write` 函数在`put 指针`指定的位置写入数据。\n\
  - `istream` 成员函数 `read` 从指定的流输入固定数量的字节到内存区域。\n- 当流与文件关联时，`read` 函数在`get 指针`指定的位置输入。\n\
  \n- `write` 的语法：`fileobject.write((char*) &NameOfObject, sizeof(Object))`\n- `write`\
  \ 函数的第一个参数的数据类型为 `const char*`。`write` 的第二个参数是一个整数，用于指定要写入的字节数。\n\n#### 向随机访问文件随机写入\n\
  \n- 下面示例展示了如何向随机访问文件写入记录。\n\n```cpp\n#include<fstream.h> #include<conio.h> #include<stdlib.h>\
  \ struct stud_info{\nint id;\nchar name[20]; char fname[20]; float CGPA;\n}student;\n\
  \nvoid main() {\nclrscr();\nchar filename[15];\nofstream outdata;\ncout<<\"\\nenter\
  \ file name : \"; cin>>filename;\noutdata.open(filename,ios::out); if(outdata.fail())\n\
  {\ncerr<<\"\\nError opening \"<<filename; getch();\nexit(1);\n}\n\n//stud_info student;\n\
  //在此接受数据\ncout<<\"\\nEnter student id : \";\ncin>>student.id;\ncout<<\"\\nEnter\
  \ student name : \"; cin>>student.name;\ncout<<\"\\nEnter student father name :\
  \ \"; cin>>student.fname;\ncout<<\"\\nEnter student CGPA : \"; cin>>student.CGPA;\n\
  \n//现在写入文件\noutdata.seekp(((student.id)-1) * sizeof(student)); outdata.write((char*)\
  \ &student, sizeof(student)); outdata.close();\n\ncout<<\"\\nData has been saved\"\
  ;\n\ngetch();\n}\n```\n\n\n\n\n\n## 记录计算\n\n- 在计算记录的字节位置时，学生 ID 需减去 1。因此，对于记录 1，文件位置指针被设置为文件的第\
  \ 0 字节。\n- `istream` 函数从指定流的当前位置读取指定数量的字节，并将其读入对象中。\n- `read` 的语法为：`read((char*)&name\
  \ of object, sizeof(name of object));`\n- 函数 `read` 要求第一个参数为 `char *` 类型。`write`\
  \ 函数的第二个参数是一个类型为 `size` 的整数，指定要读取的字节数。\n- 下面代码展示了如何从文件中随机访问记录。\n\n```cpp\n#include<fstream.h>\n\
  #include<conio.h>\n#include<stdlib.h>\n\nstruct stud_info{\nint studid;\nchar name[20];\n\
  char fname[20];\nfloat CGPA;\n};\n\nvoid main()\n{\nclrscr();\nifstream indata;\n\
  char filename[15];\ncout<<\"\\nEnter the file name : \"; cin>>filename;\nindata.open(filename,ios::in);\
  \ if(indata.fail())\n{\ncerr<<\"\\nError opening \"<<filename; getch();\nexit(1);\n\
  }\nstud_info student;\ncout<<\"\\nEnter the id no of the student : \"; int sid;\n\
  cin>>sid;\nindata.seekg((sid-1) * sizeof(student)); indata.read((char*) &student,\
  \ sizeof(student)); cout<<\"\\nhere is the information\";\ncout<<\"\\nstudent id\
  \ : \"<<student.studid; cout<<\"\\nstudent name : \"<<student.name; cout<<\"\\nstudent\
  \ fname : \"<<student.fname; cout<<\"\\nstudent CGPA : \"<<student.CGPA; indata.close();\n\
  getch();\n}\n```\n\n### 7.5: 命令行参数\n\n- 命令行参数是指一种向 `main()` 函数提供参数的机制。当从命令行调用 `main`\
  \ 函数时，这些参数会被传递给程序。例如：`c:\\> file-name arg1 arg2`\n- 其中 `file-name` 是文件名（程序名），`arg1`、`arg2`\
  \ 是传递给程序的参数。\n- 如果我们想向 `main` 函数传递参数，则 `main` 函数应写写所示：\n`Return type main(int argc,\
  \ char * argv[])`\n- 第一个参数 `argc` 代表命令行中参数的数量。第二个参数 `argv` 是一个字符类型指针数组，指向命令行参数。`argc`\
  \ 被称为参数计数（argument counter），`argv` 被称为参数向量（argument vector）。\n- `C:\\> student A\
  \ B`。`argc` 的值为 3（student、A 和 B），`argv` 将是一个包含三个字符串指针的数组，如下所示：\n  - `Argv[0]` –\
  \ 指向 `student`\n  - `Argv[1]` – 指向 `A`\n  - `Argv[2]` – 指向 `B`\n- 注意 `argv[0]` 始终代表调用程序的命令名。\n\
  - 以下是一个命令行参数示例代码。\n\n```cpp\n#include<fstream.h>\n#include<conio.h>\n#include<stdlib.h>\n\
  \nvoid main(int argc, char *argv[])\n{\nclrscr();\nchar ch;\nif(argc < 3) {\ncerr<<\"\
  \\ntoo few parameters\"; getch();\nexit(1);\n}\nelse if(argc > 3)\n{\ncerr<<\"\\\
  ntoo many parametes\"; getch();\nexit(1);\n}\nelse//number of parameters okay {\
  \ ofstream outdata;\nifstream indata;\noutdata.open(argv[2],ios::out); if(outdata.fail())\n\
  {\ncerr<<\"\\nlow disk space to create file : \"<<argv[2]; getch();\nexit(1);\n\
  }\nindata.open(argv[1],ios::in);\nif(indata.fail())\n{\ncerr<<\"\\nfile : \"<<argv[1]<<\"\
  \ does not exist\"; getch();\nexit(1);\n}\n//now start copying the file\nwhile(!indata.eof())\n\
  {\nindata.get(ch);\noutdata.put(ch);\n}\nindata.close();\noutdata.close(); cout<<\"\
  \\nfinished copying\"; }\n}\n```\n\n"
