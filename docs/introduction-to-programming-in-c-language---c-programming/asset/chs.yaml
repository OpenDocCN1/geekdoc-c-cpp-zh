  \n`Operand1` 始终是一个变量\n\n`Operand2` 可以是以下一项或它们的组合：\n\n*   一个 `字面量常量`：例如 `x=12;`\n\
  *   一个 `变量`：例如 `x=y;`\n*   一个 `表达式`：例如 `x=y+2;`\n\n#### 2.8.1.1. 复合赋值运算符 (+=, -=,\
  \ *=, /=, %, >>=, <<=, &=, ^=)。\n\n复合赋值运算符是赋值运算符与其他运算符（如算术运算符和位运算符）的结合。\n\n赋值运算符有很多变体，通过与其他运算符结合获得。\n\
