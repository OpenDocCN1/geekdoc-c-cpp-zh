  int i;\nfloat f = 3.14;\ni = (int)f; 等同于 i = int(f);\n```\n\n此时变量 `i` 将获得值 3，忽略了小数点。\n\
  \n## 2.9. 运算符优先级。\n\n在表达式中，运算符求值的顺序非常重要，它由优先级规则决定。高级别的运算符优先级高于低级别的运算符。\n\n### 优先级表：\n\
  \n| 级别 | 运算符 | 顺序 |\n| :--- | :--- | :--- |\n| 最高 | `++` `--` (后置) | 从右到左 |\n| |\
  \ `sizeof()` `++` `--` (前缀) | 从右到左 |\n| | `*` `/` `%` | 从左到右 |\n| | `+` `-` | 从左到右\
  \ |\n| `<` `<=` $>$ `>=` | 从左到右 |\n| | `==` `!=` | 从左到右 |\n| | `&&` | 从左到右 |\n|\
  \ | `||` | 从左到右 |\n| | `? `:` | 从左到右 |\n| | `=` `, ` `+=` `-=` `*=` `/=` `^=` `%=`\
  \ `&=` `|=` `<<=` `>>=` | 从右到左 |\n\n例如：\n\n`a = b + c * d` ; `c * d` 先求值，因为 `*`\
  \ 的优先级高于 `+` 和 `=`。\n\n然后结果被加到 `b` 上，因为 `+` 的优先级高于 `=`。接着求值 `==`。\n\n优先级规则可以使用括号来覆盖。\n\
  \n例如，将上述表达式重写为：\n\n`a = (b + c) * d` 导致 `+` 在 `*` 之前被求值。\n\n具有相同优先级的运算符按照优先级规则表中列出的顺序进行求值。\n\
  \n例如 `a = b += c` 的求值顺序是从右到左的，所以首先执行 `b += c`，然后执行 `a = b`。\n\n### 阿迪斯亚贝巴大学信息科学学院\
