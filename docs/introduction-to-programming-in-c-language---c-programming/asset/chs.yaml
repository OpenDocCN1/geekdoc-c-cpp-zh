  \ = price * (units + 1)`；\n\n其余的也是如此。\n\n### 2.8.2. 算术运算符 (+, -, *, /, %)。\n\n除了余数或取模运算符（%）外，所有其他算术运算符都可以接受整数和实数操作数的混合。通常，如果两个操作数都是整数，那么结果将是整数。然而，如果一个或两个操作数是实数，则结果将是实数。当除法运算符（/）的两个操作数都是整数时，执行的是整数除法，而不是我们熟悉的普通除法。\n\
