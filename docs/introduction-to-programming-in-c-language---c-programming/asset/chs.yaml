  \ `float` 形式参数 `h` 和 `w` 计算并返回矩形面积，其中 `h` 是高，`w` 是宽。\n4. 直线的公式通常给为 `y = mx + b`。写一个函数\
  \ `Line()`，接受三个 `float` 参数 `m`、`b` 和 `x`。该函数计算与 `m` 和 `b` 相关的 y 坐标。\n5. 写一个函数 `Intersect()`，带有四个\
  \ `float` 参数 `m1,b1,m2,b2`。参数在概念上成对出现。第一对包含描述一条线的系数；第二对包含描述第二条线的系数。如果直线相交，函数返回 1。否则返回\
  \ 0。\n6. 写一个程序，从用户接受一个正整数并显示该数的阶乘。你应该使用递归函数 `factorial()` 来计算阶乘。\n7. 写另一个程序，从用户接受一个数字并返回该数的斐波那契值。在这里你应该使用递归。\n\
  8. 开发一个程序，使用第 6 题的 `factorial()` 函数计算 `e` 的近似值。基于以下公式进行近似：`1 + 1/1! + 1/2! + 1/3!\
  \ `\n9. 写一个函数 `isPrime()`，接受一个数字并判断该数字是否为质数。\n10. 写一个函数 `isEven()`，使用余数运算符 `%` 判断整数是否为偶数。\n\
  11. 使用四个函数 `sum()`、`product()`、`quotient()` 和 `difference()` 修改我们的计算器问题。\n\n# 第五章\
  \ 数组与结构\n\n## 5 什么是数组\n\n相同数据对象的集合，它们存储在连续的位置上，并共用一个标题。换言之，数组是一组由相同名称引用的值。数组中的每个值称为元素。数组元素也是变量。相同类型值的集合，其名称后跟一个索引。在\
  \ C++ 中，方括号出现在索引后面，代表一个许多简单数据变量集合的内存块；计算机在内存中连续存储数组的所有元素。\n\n### 5.1 数组的属性\n\n数组只能包含一种类型\n\
  \n### 5.2 数组声明\n\n声明数组的名称和类型并设置数组中的元素数量被称为数组定维。在其他变量中使用之前必须先声明。\n\n\n\n3. 要分配的内存位置总数，或每个下标的最大值。即数组中的元素个数。\n\
  \n因此，声明的通用语法如下：\n\n```cpp\nDataTypename arrayname [array size];\n```\n\n表达式 `array\
  \ size`（即元素个数）必须是一个常量，例如 `10` 或在数组声明之前声明的符号常量，或者像 `10*sizeof (int)` 这样的常量表达式，这些值在编译阶段进行时是已知的。\n\
  \n**注意**：`array size` 不能是一个在程序运行时设置其值的变量。\n\n因此，声明一个大小为 10 且名为 `num` 的整数数组如下：\n\n\
  ```cpp\nint num [10];\n```\n\n这意味着将预留 10 个连续的两个字节的内存位置，并命名为 `num`。\n\n这意味着我们可以存储\
  \ 10 个 `int` 类型的值，而无需声明 10 个具有不同标识符的独立变量。相反，使用 `array`（数组），我们可以使用唯一的标识符存储 10 个相同类型（例如\
  \ `int`）的不同值。\n\n### 5.3 数组的初始化\n\n在声明局部作用域的数组（函数内部）时，如果我们不指定，则数组变量将不会被初始化，因此在向其存储某些值之前，其内容是不确定的。\n\
  \n如果我们声明一个全局数组（在任何函数外部），其内容将被初始化，所有元素都将填充为零。因此，如果在全局作用域中声明：\n\n```cpp\nint day [5];\n\
  ```\n\n`day` 的每个元素初始都将被设置为 `0`：\n\n![](img/image00155.gif)\n\n此外，当我们声明一个数组时，我们还可以使用花括号\
  \ `{ }` 为其每一个元素分配初始值。例如：\n\n```cpp\nint day [5] = { 16, 2, 77, 40, 12071 };\n```\n\
  \n上述声明将创建一个创建一个如下所示的数组：\n\n![](img/image00156.gif)\n\n在花括号 `{ }` 内初始化的元素个数必须等于或少于我们在方括号\
  \ `[]` 中声明的数组元素长度。如果提供的初始化项数量较少，剩余部分将用零填充。例如，在 `day` 数组的示例中，我们声明它有 5 个元素，而在花括号 `{\
  \ }` 的初始化列表中我们设置了 5 个不同的值，每个元素一个。如果我们忽略上述初始化中的最后一个初始值（`12071`），最后一个数组元素将自动取 `0`。\n\
  \n由于这可以被视为无用的重复，C++ 允许留空方括号 `[]`，此时将根据初始化括号内项的个数来设置数组的大小。\n\n```cpp\nint day []\
  \ = { 1, 2, 7, 4, 12,9 };\n```\n\n编译器将统计初始化项的个数（结果为 `6`），并将数组 `day` 的大小设置为 `6`（即：`day[6]`）。\n\
  \n你只能在定义数组时使用初始化形式。之后无法再次使用它，且无法直接将一个数组赋值给另一个数组。例如：\n\n```cpp\nint arr [] = {16,\
  \ 2, 77, 40, 12071}; \nint ar [4];\nar[]={1,2,3,4}; // 不允许\narr=ar; // 不允许\n```\n\
  \n注意：在初始化数组时，我们可以提供比数组元素更少的值。例如 `int a [10] = {10, 2, 3};`，在这种情况下，编译器会将剩余元素设置为零。\n\
  \n### 5.4 访问和处理数组元素\n\n在程序中数组可见的任何点，我们都可以单独访问它的任意一个元素进行读取或修改，就像处理普通变量一样。要访问单个元素，需要使用索引或下标。其格式如下：\n\
  \n`name [ index ]`\n\n在 c++ 中，第一个元素的索引为 `0`，最后一个元素的索引是数组大小减 1（即 `arraysize-1`）。因此，根据上面的声明，`day[0]`\
  \ 是第一个元素，`day[4]` 是最后一个元素。\n\n延续上文的例子，假设 `day` 有 5 个元素且每个元素类型均为 `int`，我们用来引用每个元素的名称如下：\n\
  \n![](img/image00157.gif)\n\n例如，要在数组变量 `day` 的第三个元素中存储值 `75`，合适的语句是：\n\n```cpp\n\
  day[2] = 75; // 因为第三个元素位于索引 2\n```\n\n例如，为了将数组变量 `day` 的第三个元素的值传递给变量 `a`，我们可以写：\n\
  \n```cpp\na = day[2];\n```\n\n因此，从效果上看，表达式 `day[2]` 就像任何 `int` 类型的变量，具有相同的属性。因此，数组声明允许我们通过单次声明创建许多相同类型的变量，并且可以使用索引来标识单个元素。\n\
  \n注意，`day` 的第三个元素指定为 `day[2]`，因为第一个是 `day[0]`，第二个是 `day[1]`，因此第三个是 `day[2]`。\n\n\
  ### 5.5 数组作为参数\n\n在某些时刻，我们可能需要将数组作为参数传递给函数。在 C++ 中，无法通过值传递将整个内存块作为参数（即使它是按数组方式组织的），但允许传递其地址，这在效果上几乎相同且效率更高。\n\
  \n为了允许数组作为参数，我们在声明函数时唯一需要做的是指定数组包含的基`type`、一个标识符和一对空方括号 `[]`。例如，以下函数：\n\n```cpp\n\
  void procedure (int arg[])\n```\n\n接受一个类型为“`int` 数组”且名为 `arg` 的参数。为了向该函数传递一个声明如下的数组：\n\
  \n```cpp\nint myarray [40];\n```\n\n只需要如下调用即可：\n\n```cpp\nprocedure (myarray);\n\
  ```\n\n这里有一个完整的示例：\n\n```cpp\n#include <iostream.h>\n#include <conio.h>\n\nvoid\
  \ printarray (int arg[], int length) {\n    for (int n=0; n<length; n++) cout <<\
  \ arg[n] << \" \";\n    cout << \"\\n\";\n}\n\nvoid mult(int arg[], int length)\
  \ {\n    for (int n=0; n<length; n++) arg[n]=2*arg[n];\n}\n\nvoid main () {\n  \
  \  int firstarray[] = {5, 10, 15};\n    int secondarray[] = {2, 4, 6, 8, 10};\n\n\
  \    printarray (firstarray,3);\n    printarray (secondarray,5);\n\n    mult(firstarray,3);\n\
  \n    cout<<”first array after being doubled is\\n\";\n    printarray (firstarray,3);\n\
  \n    getch();\n}\n```\n\n\n\n如你所见，第一个参数（`int arg[]`）接受任何 `int` 类型的数组，无论其长度如何，由于这个原因，我们包含了第二个参数，告知函数我们传递给第一个参数的每个数组的长度，这样打印数组的\
  \ `for` 循环就能拥有我们感兴趣的尺寸信息。`mult` 函数将每个元素的值加倍，并将 `firstarray` 传递给它。此后调用了 `display`\
  \ 函数。输出被修改了，这表明数组是通过引用传递的。\n\n要按值传递数组，请将数组的每个元素传递给函数。\n\n### 5.6 字符字符串：什么是字符串？\n\
  \n在目前为止所看到的所有程序和概念中，我们只使用了数值型变量，它们专门用于表示数字。但除了数值型变量外，还存在字符字符串，允许我们表示连续的字符，如单词、句子、名字、文本等。到为止，我们只将它们作为常量使用，但从未考虑过使用可以包含它们的变量。\n\
  \n在 C++ 中，没有特定的初级变量类型来存储字符字符串。为了实现这一功能，我们可以使用 `char` 类型的数组，即 `char` 元素的序列。记住，这种数据类型（`char*`）用于存储单个字符的，由于这个原因，通常使用它们的数组来构成单字符的字符串。\n\
  \n例如，下面的数组（或字符字符串）可以存储一个长达 20 个字符的字符串。你可以这样想象它：\n\n```cpp\nchar name [20];\nname\n\
  ```\n\n这 20 个字符的最大尺寸并不总是需要完全用满。例如，`name` 在程序的某个时刻可以存储字符字符串 \"Hello\" 也可以存储字符串 \"\
  studying C++\"。因此，由于字符数组可以存储比其总长度短的字符串，目前已经形成了一种约定，用空字符来结束字符串的有效内容，该常量可以写为 `'\\\
  0`。\n\n我们可以用以下方式表示 `name`（一个包含 20 个 `char` 类型元素的数组）存储字符串 \"Hello\" 和 \"Studying\
  \ C++\"：\n\n```\nH e l l 0 \\0\nS t u d y i n g C + + \\0\n```\n\n注意在有效内容之后包含了一个空字符（`'\\\
  0'`）以指示字符串的结束。空单元格（元素）代表不确定的值。\n\n### 5.7 字符串的初始化\n\n由于字符字符串是普通数组，因此它们遵循与任何数组相同的规则。例如，如果我们想用预定的值初始化一个字符字符串，我们可以以类似于任何其他数组的方式来做：\n\
  \n```cpp\nchar mystring[] = { 'H', 'e', 'l', 'l', 'o', '\\0' };\n```\n\n在这种情况下，我们声明了一个包含\
  \ 6 个 `char` 类型元素的字符字符串（数组），并用组成 `Hello` 的字符加上一个空字符 `'\\0'` 对其进行了初始化。\n\n尽管如此，字符字符串还有另一种初始化其值的额外方法：使用常量字符串。\n\
  \n在之前几个章节示例中使用的表达式中，已经多次出现过代表整个字符字符串的常量。这些常量通过包含在双引号（“ ”）之间来指定，例如：\n\n例: \"the result\
  \ is: \"\n\n这是一个我们可能在某些场合使用过的常量字符串。\n\n与允许指定单字符常量的单引号（`'`）不同，双引号（`\"`）是指定连续字符的常量。*这些包含在双引号之间的字符串末尾总是自动附加一个空字符（`'\\\
  0'`）*。\n\n因此，我们可以通过这两种方式之一用值初始化字符串 `mystring`：\n\n```cpp\nchar mystring [] = { 'H',\
  \ 'e', 'l', 'l', 'o', '\\0' };\nchar mystring [] = \"Hello\";\n```\n\n在这两种情况下，数组或字符字符串\
  \ `mystring` 声明的尺寸均为 6 个字符（`char` 类型元素）：即组成 `Hello` 的 5 个字符加上一个指定字符串结束的结尾空字符（`'\\\
  0'`），在第二种情况下，当使用双引号（`\"`）时，它是自动附加的。\n\n在继续之前，你应该注意，将多个常量（如双引号常量（`\"`））的赋值给数组仅在初始化数组时有效，即在声明的时刻。\n\
  \n代码中的以下表达式对数组是无效的：\n\n```cpp\nmystring=\"Hello\";\nmystring[] = \"Hello\";\nmystring\
  \ = { 'H', 'e', 'l', 'l', 'o', '\\0' };\n```\n\n所以记住：我们只有在初始化数组的时刻才能向数组“赋值”多字符常量。当你了解更多关于指针时，原因将变得更容易理解，因为那时将阐明数组仅仅是一个指向已分配内存块的常量指针。由于这个常数特性，数组本身不能被赋值任何值，但我们可以为数组的每个元素赋值。\n\
  \n在初始化数组的时刻这是一个特殊情况，因为这不是赋值，尽管使用了相同的等号（`=`）。无论如何，请务必始终记住前述强调的规则。\n\n#### 给字符串赋值\n\
  \n就像任何其他变量一样，字符数组可以使用赋值运算符来存储值。但以下操作是不允许的：\n\n```cpp\nmystring=\"Hello\";\n```\n\
  \n这只在初始化期间允许。因此，由于赋值的*左值（lvalue）*只能是数组的元素而不能是整个数组，有效的是将字符字符串赋值给数组，即使用如下方法为 `char`\
  \ 数组赋值字符字符串：\n\n```cpp\nmystring[0] = 'H';\nmystring[1] = 'e';\nmystring[2] = 'l';\n\
  mystring[3] = 'l';\nmystring[4] = 'o';\nmystring[5] = '\\0';\n```\n\n但这似乎并不是一种非常实用的方法。通常为数组赋值，特别是对于字符串，会使用一系列如\
  \ `strcpy` 的函数。`strcpy`（`str` `ing` `c` `py`）定义在 `string.h` 库中，并如下调用：\n\n`strcpy\
  \ (string1, string2);`\n\n这将 `string2` 的内容复制到 `string1`。`string2` 可以是数组、指针或常量字符串，因此是将常量字符串\
  \ \"Hello\" 赋值给 `mystring` 的有效方式：\n\n```cpp\nstrcpy (mystring, \"Hello\");\n```\n\
  \n例如：\n\n```cpp\n#include <iostream.h>\n#include <string.h>\n\nint main ()\n{\n\
  \    char szMyName [20];\n    strcpy (szMyName,\"Abe\");\n    cout << szMyName;\n\
  \    return 0;\n}\n```\n\n我们需要包含 `<string.h>` 头文件才能使用函数 `strcpy`。\n\n尽管我们总是可以编写如下简单的函数，其操作与\
  \ cstring 中的 `strcpy` 相同：\n\n```cpp\n// 给字符串赋值\n#include <iostream.h>\n#include<conio.h>\n\
  \nvoid namecopy(char dest[], char source[]) {\n    int c = 0;\n    while(source[c]\
  \ != '\\0') {\n        dest[c] = source[c];\n        c++;\n    }\n    dest[c] =\
  \ '\\0';\n    cout<< \"\\n 复制后的名字：\"<<dest;\n}\n\nvoid main()\n{\n    clrscr();\n\
  \    char name[10],dest[10];\n    cout<< \"\\n 输入你的名字：\"; cin>>name;\n    namecopy(dest,name);\n\
  \    getch();\n}\n```\n\n另一种常用的给数组赋值的方法是直接使用输入流（`cin`）。在这种情况下，字符串的值由用户在程序运行期间指定的。\n\
  \n当 `cin` 与字符串一起使用时，通常配合它的 `getline` 方法使用，该方法的原型如下：\n\n`cin.getline (char buffer[],\
  \ int length, char delimiter = '\\n');`\n\n\n\n\n其中 `buffer` 是存储输入的地址（例如，一个数组），`length`\
  \ 是缓冲区的最大长度（数组的大小），而 `delimiter` 是用于确定用户输入结束的字符，默认情况下（如果我们不包含该参数），它将是换行符（`'\\n'`）。\n\
  \n接下面的示例将重复你在键盘上输入的任何内容。它非常简单，但可以作为向你展示如何配合字符串使用 `cin.getline` 的示例：\n\n```cpp\n\
  // cin with strings\n#include <iostream.h> #include<conio.h>\n\nint main ()\n{\n\
  \    char mybuffer [100];\n    cout << \"What's your name? \";\n    cin.getline\
  \ (mybuffer,100);\n    cout << \"Hello \" << mybuffer << \".\\n\";\n    cout <<\
  \ \"Which is your favourite team? \";\n    cin.getline (mybuffer,100);\n    cout\
  \ << \"I like \" << mybuffer << \" too.\\n\";\n    getch();\n    return 0;\n}\n\
  ```\n\n注意在两次调用 `cin.getline` 时，我们都使用了相同的字符串标识符（`mybuffer`）。程序在第二次调用中所做的仅仅是用新引入的内容覆盖掉\
  \ `buffer` 之前的内容。\n\n如果你还记得关于通过控制台通信的章节，你会记得我们使用提取运算符（`>>`）直接从标准输入接收数据。这种方法也可以用来代替\
  \ `cin.getline` 来处理字符字符串。例如，在我们的程序中，当我们请求用户输入时，可以写成：\n\n```cpp\ncin >> mybuffer;\n\
  ```\n\n这可以得通，但这种方法具有以下 `cin.getline` 不具备的局限性：\n\n- 它只能接收单个单词（不能是完整的句子），因为这种方法将任何空白字符（包括空格、制表符、换行符和回车符）用作分隔符。\n\
  - 不允许为缓冲区指定大小。当用户输入的长度大于存放它的数组时，这会导致你的程序变得不稳定。\n\n由于这些原因，每当你需要从 `cin` 获取字符字符串时，建议使用\
  \ `cin.getline` 而不是 `cin >>`。\n\n## 将字符串转换为其他类型\n\n由于字符串可能包含其他数据类型（如数字）的表示，因此将这些内容转换为数值类型的变量可能很有用。例如，一个字符串可能包含\
  \ `\"1977\"`，但它是 5 个字符的序列，并不容易转换为单个整数数据类型。`cstdlib` (`stdlib.h`) 库提供了三个用于此目的实用函数：\n\
  \n- `atoi`: 将字符串转换为 `int` 类型。\n- `atol`: 将字符串转换为 `long` 类型。\n- `atof`: 将字符串转换为 `float`\
  \ 类型。\n\n所有这些函数都接受一个参数并返回请求类型的值（`int`、`long` 或 `float`）。这些函数结合 `cin` 的 `getline`\
  \ 方法，在请求数字时，比经典的 `cin>>` 方法是获取用户输入更可靠的方法：\n\n```cpp\n// cin and ato* functions\n\
  #include <iostream.h>\n#include <stdlib.h>\n#include<conio.h>\n\nint main()\n{ \n\
  \    clrscr();\n    char mybuffer[100];\n    float price;\n    int quantity;\n \
  \   cout << \"Enter price: \";\n    cin.getline (mybuffer,100);\n    price = atof\
  \ (mybuffer);\n    cout << \"Enter quantity: \";\n    cin.getline (mybuffer,100);\n\
  \    quantity = atoi (mybuffer);\n    cout<<\"\\nafter conversion :\\n\";\n    cout<<\"\
  \\nprice is : \"<<price;\n    cout<<\"\\nquantity is : \"<<quantity; \n    cout\
  \ << \"\\nTotal price: \" << price*quantity; \n    getch();\n    return 0;\n}\n\
  ```\n\n### 操作字符串的函数\n\n`cstring` 库 (`string.h`) 定义了许多函数来对 C 风格字符串执行一些操作（如已经解释过的\
  \ `strcpy`）。这里有最常用的简要介绍：\n\n### a) 字符串长度\n\n返回字符串的长度，不包括空字符（`\\0`）。`strlen(const\
  \ char *string);`\n\n### b) 字符串拼接\n\n将 `src` 字符串附加到 `dest` 字符串的末尾。返回 `dest`。字符串拼接有两种形式，其中一种是将源的所有内容附加到目标，另一种是只将源的部分附加到目标。\n\
  \n- 附加源的所有内容：`strcat(char *dest, const char *src);`\n- 附加源的部分：`strncat(char *dest,\
  \ const char *src, int size);`\n\n其中 `size` 是要附加的字符数。\n\n### c) 字符串拷贝\n\n用 `src`\
  \ 字符串覆盖 `dest` 字符串的内容。返回 `dest`。字符串拷贝有两种形式，其中一种是将源的所有内容拷贝到目标，另一种是只将源的部分拷贝到目标。\n\n\
  - 拷贝源的所有内容：`strcpy(char *dest, const char *src);`\n- 拷贝源的部分：`strncpy(char *dest,\
  \ const char *src, int size);`\n\n其中 `size` 是要拷贝的字符数。\n\n### d) 字符串比较\n\n比较两个字符串\
  \ `string1` 和 `string2`。字符串比较有两种形式，其中一种是比较全部内容，另一种是只比较源的部分。\n\n- 比较源的所有内容：`strcmp(const\
  \ char *string1, const char *string2);`\n- 比较源的部分：`strncmp(const char *string1,\
  \ const char *string2, int size);`\n\n其中 `size` 是要比较的字符数字符串比较函数返回三个值：\n\n- 返回 `0`\
  \ 表示字符串相等。\n- 返回负值表示第一个小于第二个。\n- 返回正值表示第一个大于第二个。\n\n## 多维数组\n\n多维数组可以描述为数组的数组。例如，一个二维数组可以被想象成统一数据类型的二维表格。\n\
  \n![](img/image158.gif)矩阵表示 3x5 个 `int` 类型的二维数组。声明这种数组的方法为：\n\n```cpp\nint matrix[3][5];\n\
  ```\n\n例如，在表达式中引用第二个元素的方法为：`matrix[1][3]`\n\n![](img/image159.gif)(数组索引始终从 0 开始）多维数组不仅限于两个索引（维度）。它们可以包含许多索引，尽管超过三个维度并不常见。只需考虑具有许多索引的数组可能需要的内存。例如：\n\
  \n```cpp\nchar century [100][365][24][60][60];\n```\n\n为世纪中的每秒分配一个 `char`，如果我们能这样声明，这将消耗大约\
  \ 3000 兆的 RAM 内存！多维数组仅仅是一种抽象，因为我们可以简单地通过在索引之间放置因子来获得相同的结果：`int matrix[3][5];` 等于\
  \ `int matrix[15];`（3 * 5 = 15），唯一的区别是编译器为我们记录了每个虚拟维度的深度。以下两段代码作为示例，它们具有相同的结果，一个使用二维数组，另一个只使用简单数组：\n\
  \n```cpp\n\n#include <iostream.h>\n#define WIDTH 5\n#define HEIGHT 3\nint matrix\
  \ [HEIGHT][WIDTH]; int n,m;\n\nint main ()\n{\n    for (n=0;n<HEIGHT;n++)\n    \
  \    for (m=0;m<WIDTH;m++)\n        {\n            matrix [n][m]=(n+1)*(m+1);\n\
  \        }\n    return 0;\n}\n```\n\n上面的程序都没有在屏幕上产生任何输出，但它们都以下方式为名为 `matrix` 的内存块赋值：\n\
  \n![](img/image160.gif)我们使用了定义常量（`#define`）来简化程序未来可能的修改，例如，如果我们决定将数组的高度扩大到 `4` 而不是\
  \ `3`，只需更改该行：\n\n`#define HEIGHT 3`\n\n为以下代码\n\n`#define HEIGHT 4`\n\n结构体\n\n\n\n\
  结构（Structure）是将一个或多个变量类型分组定义的集合，可以通过单个名称（组名）和成员名称（成员名）来引用它。你可以将结构视为一个单一变量，也可以初始化、读取和更改结构的各个部分（构成该结构的各个变量）。\n\
  \n结构中的每个元素（称为成员）可以是不同的数据类型。结构的通用语法（General Syntax）如下：\n\n```cpp\nStruct [structure\
  \ tag]\n{\n    成员定义; 成员定义; …\n    成员定义;\n}[或多个结构变量];\n```\n\n让我们来看一个示例。\n\n例如：结构标签\
  \ `struct Inventory`\n\n```cpp\nstruct Inventory \n{\n    char description[15];\n\
  \    char part_no[6];\n    int quantity; // 结构成员 float cost; \n}; // 所有结构都以分号结束\n\
  ```\n\n另一个示例可能是：\n\n```cpp\nstruct Student\n{\n    char ID[8];\n    char FName[15];\n\
  \    char LName[15];\n    char Sex;\n    int age;\n    float CGPA;\n};\n```\n\n\
  上述“Student”结构旨在存储带有所有相关细节的学生记录。\n\n在定义结构之后，人们可以使用结构标签声明结构变量。如果我们需要两个具有上述结构属性的变量，那么声明如下：\n\
  \n```cpp\nstruct Inventory inv1,inv2; //或\nstruct Student Stud1,stud2,Stud3;\n```\n\
  \n结构标签（Structure tag）不是变量名。与引用数组作为变量的数组名不同，结构标签仅仅是结构格式的标记。结构标签 `Inventory` 告诉 C++，名为\
  \ `Inventory` 的标签看起来像两个字符数组，后面紧跟一个整数和一个浮点数变量。结构标签实际上是一个由你（程序员）定义的全新数据类型。\n\n###\
  \ 引用结构的成员\n\n要引用结构中的成员，我们需要使用点运算符（`.`）。访问结构变量成员的通用语法为：\n\n`VarName .Member`\n\n\
  其中 `VarName` 是结构变量的名称，`Member` 是结构中成员的变量名。\n\n**例：**\n\n对于上述学生结构：\n\n```cpp\nstruct\
  \ Student Stud; // 声明 Stud 具有 Student 结构的属性\nstrcpy(Stud.FName,”Abebe”); // 将 Abebe\
  \ 赋值为名字\nStud.CGPA=3.21; // 将 3.21 赋值为 Abebe 的 CGPA 值\nsout<<Stud.FName; // 显示名字\n\
  sout<<Stud.CGPA; // 显示 Abebe 的 CGPA\n```\n\n### 初始化结构数据\n\n你可以在声明结构时初始化成员，也可以在程序体中初始化结构。这是一个完整的程序。\n\
  \n### .\n\n```cpp\nstruct cd_collection\n{\n    char title[25];\n    char artist[20];\n\
  \    int num_songs;\n    float price;\n    char date_purchased[9];\n} cd1 = {\"\
  Red Moon Men\",\"Sams and the Sneeds\", 12, 11.95,\"08/13/93\"};\n\ncout<<\"\\nhere\
  \ is the info about cd1\"<<endl; cout<<cd1.title<<endl;\ncout<<cd1.artist<<endl;\n\
  cout<<cd1.num_songs<<endl;\ncout<<cd1.price<<endl;\ncout<<cd1.date_purchased<<endl;\n\
  ```\n\n### .\n\n初始化结构的更好方法是使用点运算符（`.）。点运算符是在程序体中初始化结构变量各个成员的方法之一。点运算符的语法是：\n\n`structureVariableName.memberName`\n\
  \n这里有一个示例：\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n#include<string.h>\n\
  \nvoid main()\n{\n    clrscr();\n    struct cd_collection{\n        char title[25];\n\
  \        char artist[20];\n        int num_songs;\n        float price;\n      \
  \  char date_purchased[9];\n    }cd1;\n    // 在这里初始化成员\n    strcpy(cd1.title,\"\
  Red Moon Men\");\n    strcpy(cd1.artist,\"Sams\");\n    cd1.num_songs= 12;\n   \
  \ cd1.price = 11.95f;\n    strcpy(cd1.date_purchased,\"22/12/02\"); // 打印数据\n  \
  \  cout<<\"\\nHere is the info\"<<endl;\n    cout<<\"Title : \"<<cd1.title<<endl;\n\
  \    cout<<\"Artist : \"<<cd1.artist<<endl;\n    cout<<\"Songs : \"<<cd1.num_songs<<endl;\
  \ cout<<\"Price : \"<<cd1.price<<endl;\n    cout<<\"Date purchased : \"<<cd1.date_purchased;\
  \ getch();\n}\n```\n\n### 结构数组\n\n结构数组非常适合存储完整的员工文件、库存文件或任何符合结构格式的数据集。\n\n考虑以下结构声明：\n\
  \n```cpp\nstruct Company\n{\n    int employees; int registers;\n    double sales;\n\
  }store[1000];\n```\n\n在一次快速声明中，这段代码创建了 1,000 个具有 `Company` 结构定义的 `store` 结构，每个包含三个成员。注意。请确保在创建大量结构时计算机内存不会耗尽。结构数组会迅速消耗宝贵的信息。\n\
  \n你也可以在声明后定义数组：\n\n```cpp\nstruct Company\n{\n    int employees; int registers;\n\
  \    double sales;\n}; // 结构定义\nstruct Company store[1000]; // 数组定义\n```\n\n结构标签不是变量名。与引用数组作为变量的数组名不同，结构标签仅仅是结构格式的标记。结构标签\
  \ `Inventory` 告诉 C++，名为 `Inventory` 的标签看起来像两个字符数组，后面紧跟一个整数和一个浮点数变量。结构标签实际上是一个由你（程序员）定义的全新数据类型。\n\
  \n### 引用结构的成员\n\n要引用结构中的成员，我们需要使用点运算符（`.`）。访问结构变量成员的通用语法为：\n\n`VarName .Member`\n\
  \n其中 `VarName` 是结构变量的名称，`Member` 是结构中成员的变量名。\n\n**例：**\n\n对于上述学生结构：\n\n```cpp\n\
