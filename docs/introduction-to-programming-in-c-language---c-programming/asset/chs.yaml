  \n## 1.8. 编译器与解释器\n\n*编译器*：编译器是一种计算机程序，它将编写在源代码中的语句（特定编程语言的集合）翻译成生成的目标代码（编程语言语句的翻译指令）。编译器将*整个*源代码翻译成可执行的机器码（也称为*目标代码*），并*输出到文件*供以后执行。例如\
  \ C++、Pascal、FORTRAN 等。\n\n\n\n\n\n`Interpreters`（解释器）：是一种翻译单条高级语言语句并执行它，然后处理下一行高级语言的计算机程序。例如\
  \ `QBASIC`、`Lisp` 等。\n\n# 1.9. 程序创建机制 (C++)\n\nC++程序的执行通常会经过五个阶段：这些是 `edit`（编辑）、`preprocess`（预处理）、`compile`（编译）、`link`（链接）和\
  \ `load`（加载）：\n\n`Edit`：通过编辑器程序完成。程序员使用编辑器输入 C++ 语句并在必要时进行修正。然后将程序源文件存储在次级设备（如磁盘）上，扩展名为\
  \ `.cpp`。\n\n程序编辑完成后后，C++ 主要分三个阶段进行编译：`preprocessing`（预处理）、`translation to object\
  \ code`（翻译为目标代码）和 `linking`（链接）（后两个阶段通常被认为是“编译”过程）。\n\n`Preprocess`：在 C++ 系统中，`preprocessor`程序会在编译器的翻译阶段开始之前自动执行。C++\
  \ 预处理器遵循被称为 `preprocessor directives`（预处理器指令）的命令，这些指令指示在编译前对程序进行某些操作。预处理器在程序转换为机器语言之前由编译器调用。C++\
  \ 预处理器会扫描程序文本并执行由预处理器指令指定的指令（例如 `#include`）。结果是修改后的程序文本，该文本不再包含任何指令。\n\n`Compile`：然后，C++\
  \ 编译器会翻译程序代码。编译器可能是一个真正的 C++ 编译器，用于生成原生的（汇编或机器）代码。由于程序引用了未作为程序一部分定义的库例程，结果可能是不完整的。例如\
  \ `<<` 运算符，它实际上定义在另一个独立的 IO 库中。\n\n`Linking`：C++ 程序通常包含对其他处定义的函数和数据的引用，例如标准库中的内容。C++\
  \ 编译器生成的目标代码通常由于这些缺失部分而包含“空洞”。链接器（linker）将目标代码与缺失函数的代码链接起来，生成一个可执行映像（没有缺失部分）。通常，`linker`\
  \ 通过将目标代码与程序可能引用的任何库模块的目标代码链接起来来完成目标代码。最终结果是一个可执行文件。\n\n`Loading`：加载器从磁盘获取可执行文件并将其传输到内存中。支持程序的共享库的附加组件也会被加载。最后，计算机在\
  \ CPU 的控制下执行程序。\n\n![](img/image00115.gif)\n\n在实践中，所有这些步骤通常由单个命令触发，用户甚至不会看到生成的中间文件。\n\
  \n## 阿迪斯亚贝巴大学信息学院 - 工作单 1\n\n课程名称：程序设计 / 编程基础 课程号：`Comp 271` / `CSCE 232`\n\n请为下列每个问题编写一个流程图：\n\
  \n1) 接收一个数字并判断它是奇数还是偶数。\n2) 从键盘获取两个数字，判断并显示其中哪一个较大（如果存在的话）。\n3) 接收 3 个数字，并按从小到大的顺序显示它们。\n\
  4) 将 1 到 100 之间的数字相加并显示和。\n5) 相加 0 到用户给出的任意正整数之间的偶数。\n6) 计算用户提供的两个数字的平均值。\n7) 计算用户提供的三个数字的平均值、最大值、最小值和和。\n\
  8) 根据用户提供的半径计算圆面积。\n9) 使用第三个变量交换两个变量的内容。\n10) 不使用第三个变量交换两个变量的内容。\n11) 从键盘读取一个整数值，并显示消息指示该数是奇数还是偶数。\n\
  12) 从键盘读取 10 个 0-100 范围内的整数，统计其中有多少大于 50，并显示此结果。\n13) 从用户处获取一个整数并显示该数的阶乘。\n\n# 第二章\
  \ C++ 基础\n\n### 2.1. C++ 程序的组成部分\n\n为了理解简单 C++ 程序的各个部分，让我们来看以下代码：\n\n```cpp\n#include<iostream.h>\
  \ \n#include<conio.h> \nvoid main()\n{\n    cout<<\"\"\\n Hello World!\"; \n   \
  \ getch();\n}\n```\n\n任何 C++ 程序文件都应以 `.CPP` 作为文件扩展名保存。\n\n直接在编辑器中输入程序，将文件保存为 `hello.cpp`，编译并运行它。它将在计算机屏幕上打印\
  \ Hello World! 字。\n\n第一个字符是 `#`。这个字符是预处理器的信号。每当你启动编译器时，预处理器都会遍历程序并寻找井号 (`#`) 符号，并在编译器运行之前对这些行进行操作。\n\
  \n`include` 指令是一个预处理器指令，它指示编译器将角括号中指定的文件的副本包含在源码中。\n\n如果未指定文件路径，预处理器将在 `c:\\tc\\\
  include\\` 文件夹或编辑器所在位置的 `include` 文件夹下查找文件。\n\n第 1 行的作用（即 `include<iostream.h>`）是将\
  \ `iostream.h` 文件包含程序中，就像程序员实际输入了它一样。\n\n当程序启动时，会自动调用 `main()` 函数。每个 C++ 程序都有一个\
  \ `main()` 函数。\n\n此处 `main()` 的返回值类型为 `void`，这意味着 `main` 函数将不向调用者（即操作系统）返回数值。\n\n\
  `main` 函数可以被设置为向操作系统返回一个值。\n\n左大括号 `{` 标志着 main 函数主体的开始，对应的右大括号 `}` 标志着 main 函数主体的结束。每个左大括号都需要一个对应的右大括号。\n\
  \n我们在括号之间的行是语句，或称为函数体。\n\n语句是一个计算步骤，可能会产生一个值或与输入输出流进行交互。\n\n单个语句的结束以分号 (`;`) 结尾。\n\
  \n上述示例中的语句导致字符串“Hello World!”发送到 `cout` 流，它将在计算机屏幕上显示它。\n\n### 2.2. 简述 cout 和 cin\n\
  \n`cout` 是一个用于将数据打印到屏幕的对象。\n\n要在屏幕上打印一个值，写入 `cout`，后跟插入运算符（也称为输出重定向运算符 `<<`）以及要在屏幕上打印的对象。\n\
  \n语法：`cout<<Object;`\n\n右侧的对象可以是：\n• 字面量字符串：“Hello World”\n• 变量：内存中的一个占位符\n\n`cin`\
  \ 是一个用于从键盘获取输入的对象。要从键盘获取输入，写入 `cin`，后跟输入重定向运算符 (`>>`) 和用于保存输入值的对象名。\n\n语法：`cin>>Object`\n\
  \n`cin` 将从键盘获取值并将其存储在内存中。因此 `cin` 语句需要一个变量作为保留的内存占位符。\n\n`<<` 和 `>>` 都返回其右操作数作为结果，允许将多次输入或多次输出操作组合到一个语句中。以下示例将说明如何执行多次输入和输出：\n\
  \n例如：\n\n`cin>>var1>>var2>>var3;`\n\n这里将为变量输入三个不同的值。每个变量之间用空格、制表符或换行符分隔。\n\n`cout<<var1<<\"\
  , \"<<<<var2<<\" and \"<<<<var3;`\n\n在这里将打印三个变量的值，第一个和第二个变量之间有一个“，”（逗号），在第二个和第三个变量之间有“and”单词。\n\
  \n### 2.3. 在 C++ 程序中添加注释\n\n注释是解释程序某些方面的描述性文本。\n\n\n\n\n\n程序注释是编译器完全忽略的文本，仅用于告知读者源代码在程序任何特定点是如何运行的。\n\
  \nC++ 提供了两种类型的注释分隔符：\n\n- **单行注释**：`//`（双正斜杠）之后的所有内容（直到其所在行的末尾）都被视为注释。\n  - **示例**：`cout<<var1;\
  \ //此行打印 var1 的值` \n  \n- **多行注释**：任何包含在 `/*` 和 `*/` 成对之间的内容都被视为注释。\n  - **示例**：\n\
  ```cpp\n/*这是一类注释，\n多行内容可以被包含在\n一个 C++ 程序中 */\n```\n\n注释应该用于增强（而不是阻碍）程序的可读性。特别应该注意以下两点：\n\
  \n- 注释应该比它试图解释的代码更容易阅读和理解。令人困惑或不必要的复杂的注释比没有注释糟糕。过度使用注释会导致可读性进一步降低。如果一个程序包含的注释多到你几乎看不到代码，它绝不能被认为是可读的。在程序中使用变量和其他实体的描述性名称，并对代码进行适当的缩进，可以减少对注释的需求。\n\
  \n## 2.4. 函数简述\n\n通常情况下，函数是执行一个或多个动作的代码块。\n\n大多数函数在程序运行过程中被调用或触发，这是在程序开始执行之后。\n\n\
  程序命令按它们在源代码中出现的顺序逐行执行，直到遇到函数。然后程序将分支执行该函数。当函数完成时，它会将控制权返回给紧邻函数调用之后的行代码。\n\n函数由一个**头部**和一个**主体**组成。头部反过来由**返回类型**、**函数名**以及该函数的**参数**组成。\n\
  \n函数的参数允许将值传递到函数。参数是传递给函数的值的类型声明；调用函数传递的实际值称为**参数**。\n\n让我们来看一个例子：\n```cpp\n#include<iostream.h>\
  \ \n#include<conio.h> \nvoid main()\n{\n    cout<<\"\\n In main function\"; \n \
  \   demoFunction();\n    cout<<\"\\n Back in main function\"; \n    getch();\n}\n\
  \nvoid demoFunction()\n{\n    cout<<\"\\n demoFunction\";\n}\n```\n\n函数返回一个值或 void（即不返回任何内容）。相加两个整数的函数可能会返回和，因此被定义为返回一个整数值。仅打印消息的函数没有内容可以返回，将声明为返回\
  \ void。\n\n函数可以使用 **return** 语句返回值；返回语句也会导致函数退出。\n\n如果函数末尾没有返回语句，函数将自动返回 void。\n\
  \n## 2.5. 变量与常量\n\n### 2.5.1. 变量\n\n变量是内存中存储信息的预留位置。一个变量将具有三个部分：\n\n变量用于存储数据值，以便在程序的各种计算中使用。\n\
  \n所有变量都有三个重要的属性：\n\n- **数据类型**：在定义变量时确定的类型（例如：整数、实数、字符等）。数据类型描述数据的属性和预留内存的大小。\n\
  - **名称**：用于引用变量中值的名称。预留内存位置的唯一标识符。\n- **值**：通过给变量分配新值来更改的值。\n\n#### 2.5.1.1. 基础变量类型\n\
  \nC++ 内置了其他几种变量类型。它们可以方便地分类为**整数**、**浮点**或**字符**变量。\n\n浮点变量类型可以表示为分数，即它们是“实数”。\n\
  \n字符变量持有单个字节。它们用于存储 ASCII 和扩展 ASCII 字符集中的 256 个不同的字符和符号。\n\nC++ 程序中使用的变量类型在下表中描述，表中列出了变量类型及其占用的空间：\n\
  \n| 类型 | 长度 | 范围 |\n| :--- | :--- | :--- |\n| unsigned char | 8 bits | 0 to 255\
  \ |\n| char | 8 bits | -128 to 127 |\n| enum | 6 bits | -32,768 to 32,767 |\n| unsigned\
  \ int | 16 bits | 0 to 65,535 |\n| short int | 16 bits | -32,768 to 32,767 |\n|\
  \ int | 16 bits | -32,768 to 32,767 |\n| unsigned long | 32 bits | 0 to 4,294,967,295\
  \ |\n| long | 32 bits | -2,147,483,648 to 2,147,483,647 |\n| float | 32 bits | -3.4x10\
  \ to 3.4x10^(+38) |\n| double | 64 bits | -1.7x10^(-308) to 1.7x10^(+308) |\n| long\
  \ double | 80 bits | -3.4x10^(-4932) to 3.4x10^(+4932) |\n| bool | 8 bits | true\
  \ or false（位被忽略） |\n\n#### 2.5.1.2. 有符号与无符号\n\n符号整数可以是负的或正的。无符号整数总是正的。\n\n由于符号和无符号整数需要相同的字节数，在无符号的情况下，所有位都可表示大小。如果我们使用符号，可以使用第一位来表示符号，如果第一位值为\
  \ 0 则为正，如果为 1 则为负。在这种情况下，我们将剩下的三位用于表示大小。\n\n#### 2.5.1.3. 声明变量\n\n变量可以通过被称为**声明**的过程创建。语法：`数据类型\
  \ 变量名;`\n\n声明将指示计算机根据声明期间指定的名称和大小预留内存位置。\n\n良好的变量名指示变量的用途，或者它们应该是自解释的。\n\n例如 `int\
  \ myAge; //用于存储年龄的变量`\n\n变量名有时称为标识符，在程序中应该是唯一的。\n\n某些单词被 C++ 保留用于特定目的，不能作为标识符使用。\n\
  \n这些被称为**保留字**或**关键字**，如下表所示：\n\nasm, continue, float, new, signed, try, auto, default,\
  \ for, operator, sizeof, typedef, break, delete, friend, private, static, union,\
  \ case, do, goto, protected, struct, unsigned, catch, double, if, public, switch,\
  \ virtual, char, else, inline, register, template, void, class, enum, int, return,\
  \ this, volatile, const, extern, long, short, throw, while\n\n一个或多个字母、数字或下划线符号。标识符的长度没有限制。\n\
  \n标识空格或标记字母不能是标识符的一部分。\n\n只有字母、数字和下划线字符是有效的。变量标识符应该始终以字母或下划线开头。任何情况下都不应以数字开头。\n\n\
  #### 2.5.1.4. 初始化变量\n\n当在声明时给变量分配一个值时，就被称为变量初始化。\n\n这等同于声明变量并在声明后给变量分配一个值。语法：`数据类型\
  \ 变量名 = 初始值;`\n\n\n\n\n\n例如：`int a = 0;`\n\n或者：`int a;`\n\n`a=0;`\n\n### 2.5.1.5.\
  \ 变量的作用域\n\n变量的作用域是程序中可以访问变量的边界或块。该边界或块通过左右大括号来标识。\n\n在 C++ 中，我们可以在源代码的任何地方声明变量。但无论写在哪里，我们都应该在使用变量之前声明它。\n\
  \n**全局变量**：是在代码的任何地方、任何函数内部都可以被引用/访问的变量，前提是它必须先被声明。在包含语句之后、在任何函数之前定义的变量是全局变量。**局部变量**：局部变量的作用域仅限于声明它的代码级或块内。\n\
  \n在下面的示例中，整数数据类型 `num1` 随处可见，而 `z` 只能在 `add` 函数中访问，`num2` 只能在 `main` 函数中访问。这意味着\
  \ `cout<<z;` 或任何涉及 `z` 的语句只在 `add` 函数中有效。\n\n例如：\n\n```cpp\n#include<iostream.h>\n\
  \nint num1;\n\nint add( int x, int y)\n\n{\n\nint z;\n\n….\n\n}\n\nvoid main()\n\
  \n{\n\nunsigned short age;\n\nfloat num2;\ncout<<”\\n Enter your age: …\n}\n```\n\
  \n在 C++ 中，局部变量的作用域由声明它的块决定。\n\n如果它在函数内部声明，它将是一个具有函数作用域的变量。如果它在循环中声明，它的作用域仅在循环内，以此此类推。\n\
  \n### 2.5.1.6. 定义数据类型（自定义数据类型）\n\n`typedef` 关键字用于程序员定义数据类型，因为编程语言的用户就是程序员。\n\n如果有很多变量需要这种类型的声明，在程序中多次编写\
  \ `unsigned short int` 是非常困难的。C++ 允许你使用 `typedef` 关键字（意为类型定义）用一个别名来替代该短语。\n\n例如：\n\
  \n```cpp\n#include<iostream.h>\n\ntypedef unsigned short int USHORT; void main()\n\
  \n{\n\nUSHORT width = 9;\n\n…\n\n}\n```\n\n在第二行之后，每当编译器遇到 `USHORT` 单词时，它都会将其替换为\
  \ `unsigned short int`。\n\n### 2.5.1.7. 有符号整数的回溢\n\n有符号整数与无符号整数的区别在于其值的一半是负数。当程序用完正数时，程序会进入最大的负数，然后向回计数到零。\n\
  \n例如：`32767 + 1 -32769-8 0`\n\n### 2.5.1.8. 无符号整数的回溢\n\n当无符号整数达到其最大值时，它会回绕并重新开始。\n\
  \n例如：`65535 + 1 0 65535`\n\n### 2.5.1.9. 字符\n\n字符变量（类型为 `char`）的大小通常为一个字节，足以容纳 256\
  \ 个不同的值。`char` 可以表示为一个较小的数字（0 - 255）。\n\nC++ 中的字符表示为`单引号`内的任何值。\n\n例如：‘x’、‘A’、‘5’、‘a’\
  \ 等。\n\n当编译器找到这些值（字符）时，它会将该值转换回对应的 ASCII 值。例如，‘a’在 ASCII 中的值为 97。\n\n### 2.5.1.10.\
  \ 特殊打印字符\n\n在 C++ 中，有一些用于格式化的特殊字符。它们是：\n\n`\\n` 换行\n`\\t` 制表符\n`\\b` 退格\n`\\\"`\
  \ 双引号\n`\\'` 单引号\n`\\?` 问号\n`\\\\` 反斜杠\n\n### 2.5.2. 常量\n\n常量是具有**固定值**的表达式。\n\n\
  与变量一样，常量是计算机内存中的数据存储位置。但与变量不同，常量的内容在声明后不能更改。\n\n常量在程序创建它们时必须初始化，程序员之后不能为常量分配新值。C++\
  \ 提供两种类型的常量：字面常量和符号常量。**字面常量**：是在需要需要的地方直接输入程序中的值。\n\n例如：`int num = 43;`\n\n在该语句中，`43`\
  \ 是一个字面常量：\n\n**符号常量**：是用名称表示的常量，类似于变量。但与变量不同，它的值在初始化后不能更改。\n\n例如：\n\n`Int studentPerClass\
  \ =15;`\n\n`students = classes * studentPerClass;`\n\n`studentPerClass` 是一个值为 15\
  \ 的符号常量。\n\n而 15 是直接输入程序中的字面常量。在 C++ 中，我们有两种方法声明符号常量：使用 `#define` 和 `const` 关键字。\n\
  \n#### 2.5.2.1. 使用 #define 定义常量\n\n`#define` 指令执行简单的文本替换。定义指令只能定义整数常量，例如：`#define\
  \ studentPerClass 15`\n\n在我们的示例中，预处理器每次看到 `studentPerClass` 单词时，都会将 15 插入文本中。\n\n\
  #### 2.5.2.2. 使用 const 关键字定义常量\n\n在这里，常量具有类型，编译器可以确保常量被正确使用。例如：`const unsigned short\
  \ studentPerClass = 15;`\n\n### 2.5.3. 枚举常量\n\n使用单个整数来定义多个常量。\n\n传统的做法如下：\n\n`#define\
  \ SPRING 0`\n`#define SUMMER 1`\n`#define FALL 2`\n\n另一种使用 enum 的方法是：\n\n`enum {\
  \ SPRING, SUMMER, WINTER };`\n\n你也可以为它们赋值：\n\n`enum {RED=100, BLUE=500};`\n\n其中\
  \ RED 的值为 100，BLUE 的值为 500。\n\n### 2.6. 分配内存\n\n计算机提供 RAM 用于存储执行代码以及程序处理的数据。内存可以被视为连续的位，每个位都可以存储一个二进制数字。通常，内存被分为\
  \ 8 位一组，称为字节。字节按顺序寻址。因此，每个字节都可以通过其地址唯一标识。\n\n字节地址\n… 1211 1212 1213 1214 1215 1217\
  \ … 内存\n\n\n\n\n3. 将赋值表达式 `x = a + b` 的结果赋值给 `y`。\n\n## 2.8. 运算符\n\n运算符是让机器执行某个动作的符号。不同的运算符作用于一个或多个操作数，并且可以不同类型的运算符。\n\
