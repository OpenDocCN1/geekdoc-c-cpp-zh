  \ 声明函数：\n\n- 函数的接口（也称为其原型）规定了它可以如何被使用。它由三个实体组成：\n- `function return type`（函数返回值）。这指定了函数返回值的类型。不返回值的函数返回类型应为\
  \ `void`。\n- `function name`（函数名）。这仅仅是一个唯一的标识符。\n- `function parameters`（函数参数，也称为签名）。这是一组零或多个带类型的标识符，用于在函数和函数之间传递值。\n\
  \n### 4.3.2. 定义函数：\n\n- 函数定义由两部分组成：接口（`prototype`）和体（`body`）。函数的大括号包含了使函数程序化的步骤（语句）。定义由一行称为声明符（decelerator）的语句组成。\n\
  - 如果函数定义在主函数之前完成，则不需要放置原型，否则原型应该在主函数开始之前编写好。\n\n### 4.3.3. 调用函数：\n\n- 使用函数涉及“调用”它。\n\
  - 调用函数意味着发出执行该函数的指令。\n- 函数调用由函数名后跟调用运算符括号 `()` 组成，内部出现零或多个用逗号分隔的参数。参数的数量和类型应与函数参数的数量匹配。每个参数都是表达式，其类型应与函数接口中对应参数的类型匹配。\n\
  - 当执行函数调用时，首先评估参数，并将`它们的计算结果`赋值给相应的参数。然后执行函数体。最后，将返回值（如果有）传递给调用者。\n\nC++ 中的函数调用就像高速公路上的一个绕道。想象你正沿着运行名为\
  \ `main()` 的主函数“道路”上旅行。当你遇到一个函数调用语句时，你必须暂时离开 `main()` 函数并执行被调用的函数。在那个函数完成后（到达其返回语句后），程序控制权返回到\
  \ `main()`。换句话说，当你完成一次绕道后，你就会返回到“主”路线并继续旅程。随着 `main()` 调用其他函数，控制将继续。\n\n让我们来看一个简单的例子：\n\
  \n```cpp\nvoid func1(); // 函数定义的原型\n\nvoid main()\n{ \n    // 无返回类型，因为在定义中是 void。\n\
  \    ---------------\n    func1(); // 函数调用（注意分号）\n    ---------------\n } // 返回类型为\
  \ void\n\nvoid func1() // 无分号。声明符\n{\n    -------------- 函数体\n    --------------\n\
  } // 无分号。\n```\n\n让我们来看另一个非常简单的函数例子：\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\
  \nvoid starLine(); // 名为 starLine 的函数原型\nint main()\n{\n    starLine(); // 调用名为\
  \ starLine 的函数 \n    cout<< “Data type Range” << endl;\n    starLine();\n    cout<<\
  \ “char -128 to 127”<<endl\n    << “short -32,768 to 32,767”<<endl \n    << “ int\
  \ system dependent” <<endl\n    << “long -2,147,483,648 to 2,147,483,647” << endl;\
  \ \n    starLine();\n    return 0;\n}\n\n// 定义\nvoid starLine()\n{\n    for(int\
  \ j=0;j<45;j++) // 带有 a 的函数定义\n    cout<< “*”; // 名称 starLine \n    cout<<endl;\n\
  }\n```\n\n给定下一个程序，哪个函数是调用函数，哪个函数是被调用的函数？\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\
  \nvoid nextMsg()\nint main()\n{\n    cout<< “Hello!\\n”; \n    nextMsg();\n    return\
