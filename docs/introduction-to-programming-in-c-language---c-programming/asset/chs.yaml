  \ 10 得到平均值。使用 `while` 循环执行 10 次。\n\n12. 使用 `for` 循环编写 C++ 程序计算以下求和：\n    `∑ i²\n\
  \n13. 编写一个 C++ 程序接受五个学生的成绩并显示它们的平均分。程序不接受小于 0 或大于 100 的。\n\n14. 开发一个计算器程序，计算并显示单个操作的结果。\n\
  \    例如，如果输入是 `15 * 20`，程序应显示 `15 * 20 equals 300`。\n    如果运算符非法，例如如下例 `24 ~ 25`，程序显示\
  \ `~` 是未识别的运算符。\n    作为最后的示例，如果除数为 0，程序应显示 `不允许除以 0`。\n\n15. 编写一个 C++ 程序检查给定的数字是否为质数。\n\
