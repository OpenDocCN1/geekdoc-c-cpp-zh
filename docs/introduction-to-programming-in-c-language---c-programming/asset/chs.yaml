  \n*测试与维护*\n\n### 1.5.2. 解决问题\n\n- 解决问题是利用我们对问题领域的知识，并依靠我们选择和使用适当的问题策略、技术和工具的能力，将问题的描述转换为解决方案的过程。\n\
  - 问题是一个阻碍组织完全实现其目的、目标和目标的*不利状况*。或者，问题也可以定义为*现状与期望状态之间的差距*，问题解决将试图填补这一差距。\n\n解决问题有两种方法：\n\
  \n*自顶向下设计*：是一种基于基于概念的系统方法，该概念认为问题的结构应该决定解决方案的结构以及低级应该做什么。这种方法试图将一个大问题分解成更小、更易管理的问题，以缩小问题领域。\n\
  \n*自底向上设计*：是相反的过程，首先构建最底层的组件，系统从底部向上构建，直到整个过程最终完成。\n\n## 1.6. 基础程序开发技巧\n\n我们在任何编程语言中设计的程序需要具备：\n\
  - *可靠性*：程序应该始终按照其预期的方式运行并处理所有类型的异常。\n- *可维护性*：程序的组织方式应使其在需要时可以对其进行修改和升级。\n- *可移植性*：能够将为某类型计算机编写的软件以最少的修改适配到另一种计算机。\n\
  - *高效性*：程序应该优化地利用时间、空间和其他资源。\n\n## 1.7. 算法设计与逻辑建模\n\n任何用*机器语言*之外的编写的程序都需要翻译成机器语言。执行此任务的指令集被称为*翻译器*。\n\
  \n有不同类型的翻译软件，其中*编译器*和*解释器*对大多数程序员来说是最感兴趣的。\n\n### 1.7.1. 使用流程图为程序逻辑\n\n可以使用许多技术和工具设计算法。设计算法的工具之一是使用流程图。流程图是解决问题所需步骤的图形化表示方式。\n\
  \n流程图是过程的示意（*图示描述*）表示。\n\n基本的流程图符号有：\n\n- 终端点\n- 决策\n- 处理\n- 输入/输出\n- 流线\n- 页间连接器\n\
  - 页内连接器\n\n例如：检查一个数字是正数还是负数。\n\n```\nstart\nEnter number\nDisplay^(num/2==0?) Display\
