  ### 4.4. 函数参数与实\n\n函数的参数是函数执行其任务时使用的变量列表，而在调用函数期间传递给函数的实是发送给函数的值。\n\n函数调用的实可以使用\
  \ C++ 支持的两种样式之一：`值传递`（passing by value）或`引用传递`（passing by reference）。\n\n#### 4.4.1.\
  \ 值传递：\n\n- 值参数仅接收传递给它的参数的值的副本。因此，如果函数对参数进行了任何更改，这些更改不会影响参数。例如：\n\n```cpp\nvoid\
  \ Foo(int num)\n{\n    Num = 0;\n    cout<< “num = ” << num << “ \\n”;\n}\n\nint\
  \ main(void)\n{ \n    int x = 10;\n    Foo(x);\n    cout<< “x = ”<<x<<“\\n”;\n \
  \   getch();\n    return 0;\n}\n```\n\n- `Foo` 的单个参数是一个值参数。对于这个函数而言，`num` 的行为就像函数内部的局部变量一样。当函数被调用且\
  \ `x` 传递给它时，`num` 接收了 `x` 值的副本。因此，尽管函数将 `num` 设置为 0，但这不会影响 `x`。程序产生以下输出：\n```\n\
  Num = 0\nx = 10\n```\n- 以这种方式传递参数（即函数创建传递给它的参数的副本）被称为`值传递`。\n\n#### 4.4.2. 引用传递：\n\
  \n- 另一方面，引用参数直接接收传递的参数并对其进行操作。函数对引用参数的任何更改都会直接应用到参数上。以这种方式传递参数被称为`引用传递`。\n\n```cpp\n\
  void Foo(int &num)\n{\n    num = 0;\n    cout<< “num = ” << num << “ \\n”;\n}\n\n\
  int main(void)\n{ \n    int x = 10;\n    Foo(x);\n    cout<< “x = ”<<x<<“\\n”;\n\
  \    getch();\n    return 0;\n}\n```\n\n（注：原文在某些部分存在重复，翻译时根据逻辑整理了 4.4.2 的描述，以确保文档的连贯性。）\n\
  \n\n\n\n\n```cpp\nDouble xyz;//xyz 是此块的局部变量 …\n\n}\n\n}\n```\n\n### 4.6. 作用域运算符\n\
  \n局部作用域会覆盖全局作用域，拥有与全局变量同名的局部变量会导致全局变量在局部作用域内无法访问。\n\n例如 `int num1;`\n\n```cpp\n\
  void fun1(int num1) {\n//…\n}\n```\n\n全局变量 `num1` 在 `fun1()` 内部无法访问，因为它被局部参数 `num1`\
  \ 覆盖了。\n\n这个问题可以通过作用域运算符 `::` 来解决，它接受一个全局实体作为参数。\n\n```cpp\nint num1 = 2;\n\nvoid\
  \ fun1(int num1)\n{\n//…\nnum1=33;\ncout<<num1; // 输出将是 33\ncout<<::num1; // 输出将是\
  \ 2，即全局变量，如果(**::**num1 != 0) //指向全局 num1\n//…\n}\n```\n\n### 4.7. 自动变量与静态变量\n\n\
  `automatic`（自动）和 `static`（静态）术语描述了函数返回到调用过程时局部变量所发生的情况。默认情况下，所有局部变量都是 `automatic`\
  \ 的，这意味着它们在函数结束时会被擦除。你可以通过在变量定义前加上 `auto` 术语将变量指定为 `automatic`。\n\n例如。`main()` 左大括号后的两个语句声明了自动局部变量：\n\
  \n```cpp\nmain()\n{\nint i;\nauto float x;\n…\n}\n```\n\n`automatic` 的相反是 `static`\
  \ 变量。所有全局变量都是 `static` 的，并且如所述，所有 `static` 变量都会保留它们的值。因此，如果一个局部变量是 `static` 的，它在函数结束时也会保留其值——以防该函数被再次调用。要将变量声明为\
  \ `static`，在定义时于变量前面加上 `static` 关键字。以下代码段定义了三个变量 `i`、`j`、`k`。变量 `i` 是 `automatic`，但\
  \ `j` 和 `k` 是 `static`。`static` 变量可以在函数内部声明并初始化，但初始化将在第一次调用时执行一次。如果没有显式声明 `static`\
  \ 变量，它们将被自动声明为 0。\n\n例如。`void my_fun()\n{\nstatic int num;\nstatic int count = 2;\n\
  count=count*5;\nnum=num+4;\n}*\n\n在上面的示例中：\n* 在第一次调用函数 `my_fun()` 时，`static` 变量\
  \ `count` 将初始化为 2，并在第三行乘以 5 得到值 10。在第二次调用同一个函数时，`count` 的值为 10，并将再次乘以 5。\n* 在第一次调用函数\
  \ `my_fun()` 时，`static` 变量 `num` 将初始化为 0（因为它没有被显式初始化），并在第四行对其加 4 得到值 4。在第二次调用同一个函数时，`num`\
  \ 的值为 4，并将再次对其加 4。\n\n注意。如果局部变量是 `static` 的，它们的值在函数被再次调用时仍保持不变。\n\n### 4.8. 内联函数\
  \ (Inline functions)\n\n假设一个程序经常需要找到整数数量的绝对值。对于一个由 `n` 表示的值，可以表示为：\n\n`(n > 0 ?\
  \ n : -n)`\n\n然而，与其在程序的许多地方重复复制此表达式，不如将其定义为一个函数：\n\n```cpp\nint Abs(int n)\n{\n\
  return n > 0 ? n : -n;\n}\n```\n\n函数版本具有许多优点：\n* 它使程序变得更具可读性。\n* 它是可重用的。\n\n然而，函数版本的缺点是，频繁使用会导致由于函数调用开销而产生巨大的性能损失。可以通过将\
  \ `Abs` 定义为 `inline`（内联）函数来避免这种开销。\n\n```cpp\ninline int Abs(int n)\n{ Return n\
  \ > 0 ? n : -n;\n}\n```\n\n这种的效果是，当调用 `Abs` 时，编译器不再生成调用 `Abs` 的代码，而是展开程序体并用 `Abs`\
  \ 的体替换调用。虽然执行的本质上是相同的计算，但没有涉及函数调用，因此不会分配栈帧。\n\n`\"inline\"` 关键字仅仅是给编译器或开发环境的一个提示。并不是每个函数都可以内联的。导致有时不进行内联的一些典型原因包括：\n\
  * 函数调用了自身，即是递归的\n* 函数包含循环如 `for(;;)` 或 `while()`\n* 函数体过大\n\n另一个内联的良好原因是，你有时可以通过内联正确的函数来加快程序速度。编译器不会在每次被调用时都调用函数，而是用函数体的副本替换函数调用。如果是一个被频繁调用的小函数，这有时可以提高速度。\n\
  \n内联函数的大部分优势来自于避免了调用实际函数的开销。这种开销包括保存寄存器、设置栈帧等。但对于大型函数，这种开销就不那么重要了。\n\n关于内联函数，编译器可以自由决定一个函数是否符合内联函数的条件。如果发现\
  \ `inline` 函数具有较大的代码块（量），它将不会被视为内联函数，而是像其他普通函数一样。\n\n那么，为什么不内联所有内容呢？因为编译器每次调用函数时都会复制整个函数体，如果这是一个很大的函数，内联会增加可执行文件的大小。\n\
  \n### 4.9. 默认参数与函数重载\n\nC++ 有两种 C 语言具备的能力：默认参数和函数重载。\n\n#### 4.9.1. 默认参数\n\n默认参数消了为所有参数指定参数的负担。例如。你可能传递给函数一个存储在字符数组中的消息，并且\
  \ `函数` 显示某个特定值。对于这种函数的原型可以是：\n\n```cpp\nvoid pr_msg(char[])\n```\n\n因此，为了让 `pr_msg()`\
  \ 显示“Turn on”，你可以像这样调用它：\n\n```cpp\npr_msg(\"Turn on\")\n```\n\n当你编写更多程序时，你会发现你通常想使用同一条消息，你可以设置\
  \ `pr_msg()` 的原型，使其默认为“Turn on”。\n\n对于具有多个默认参数的函数，带有默认值的参数应该定义在函数定义的右侧。\n\n例如。让我们使用默认参数开发程序。\n\
  \n```cpp\n#include…..\n\nvoid Add_Display(int x=10, int y=20, int z=30)\n{\ncout<<\
  \ (x+y+z);\n}\n\nvoid Mult_Dispaly (int x, int y=70)\n{\ncout<< (x*y);\n}\n\nvoid\
  \ main() {\nint a=40, b=50, c=60;\nAdd_Display(a,b,c); //将打印 150 (即 40+50+60)\n\
  Add_Display(a,b); //将打印 120 (即 40+50+30)\nAdd_Display(a); //将打印 90 (即 40+20+30)\n\
  Add_Display(); //将打印 60 (即 10+20+30)\nMult_Display(a,b) //将打印 2000 (40*50)\nMult_Display(a)\
  \ //将打印 2800 (40*70)\n\n//Mult_Display() 是无效的，因为 x 没有默认值 getch();\n}\n```\n\n以下函数定义是的，因为\
  \ z 是一个没有默认值的参数，写在带有默认值的 y 参数之后应该位于函数声明的右侧：\n\n```cpp\nvoid Mult_Dispaly (int x,\
  \ int y=70, int z)\n{\ncout<< (x*y*z);\n}\n```\n\n因此，以下函数定义是正确的：\n\n```cpp\nvoid\
  \ Mult_Dispaly (int x, int z, int y=70)\n{\ncout<< (x*y*z);\n}\n```\n\n#### 4.9.2.\
  \ 重载函数\n\n与 C 不同，C++ 允许在同一个程序中拥有多个同名的函数。换句话说，你可以在同一个程序中拥有三个名为 `abs()` 的函数。\n\n\n\
  \n\n同名的函数被称为重载函数。C++ 要求每个重载函数在参数列表上必须有所不同。重载函数允许你拥有处理不同数据类型的相似函数。\n\n假设你写了一个函数，它可以返回传递给它的任何数字的绝对值：\n\
  \n```cpp\nint iabs(int i) {\n    if(i<0)\n        return (i*-1);\n    else\n   \
  \     return (i); \n}\n\nfloat fabs(float x) {\n    if(x<0.0)\n        return (x\
  \ * -1.0);\n    else\n        return (x);\n}\n```\n\n如果不使用重载，你必须这样调用函数：`int ans\
  \ = iabs(weight);` 对于 `int` 参数，`float ans = fabs(weight);` 对于 `float` 参数。\n\n但使用重载，上面的代码可以改为：\n\
  \n```cpp\nint abs(int i);\nfloat abs(float x); \nint main() {\n    …\n    ians =\
  \ abs(i);//使用 int 参数调用 abs\n    fans = abs(p);//使用 float 参数调用 abs …\n}\n\nint abs(int\
  \ i) {\n    if(i<0)\n        return i*-1; \n    else\n        return I; \n}\n\n\
  float abs(float x) {\n    if(x<0.0)\n        return x*-1.0;\n    else\n        return\
  \ x;\n}\n```\n\n**注意**：如果两个或多个函数仅返回值类型上不同，C++ 无法对它们进行重载。仅返回值类型不同的两个或多个函数必须具有不同的名称且不能重载。\n\
  \n## 4.10 递归\n\n调用自身的函数被称为递归。递归是一种通用的编程技术，适用于可以用自身来定义的问题。以阶乘问题为例，它的定义如下：\n\n- 0\
  \ 的阶乘是 1\n- 正整数 n 的阶乘是 n 乘以 n-1 的阶乘。\n\n第二行清楚地表明 `factorial` 是根据其自身定义的，因此可以表示为递归函数。\n\
  \n```cpp\nint Factorial(unsigned int n ) {\n    return n == 0 ? 1 : n * factrial(n-1);\n\
  }\n```\n\n当 `n` 设置为 4 时，下图显示了递归调用：`Factorial(4)` 24，`4 * Factorial(3)` 6，`3 * Factorial(2)`\
  \ 2，`2 * Factorial(1)` 1。这些调用的栈帧在运行时栈上顺序出现，一个接一个。递归函数必须至少有一个可以满足的终止条件。否则，该函数将无限地调用自身，直到运行时栈溢出。\n\
  \n递归方法中的三个必要组成部分是：\n\n1. 用于停止或继续递归的测试\n2. 终止递归的边界情况\n3. 继续递归的递归调用\n\n让我们使用递归再实现两个数学函数，例如：以下函数计算前\
  \ `N` 个正整数 `1, 2, …, N` 的和。请注意该函数是如何包含递归方法的三个必要组成部分的。\n\n```cpp\nint sum(int N)\
  \ {\n    if(N==1)\n        return 1;\n    else\n        return N+sum(N);\n}\n```\n\
  \n上一种方法计算幂 `A^n`，其中 `A` 是实数，`N` 是正整数。这次，我们需要传递两个参数。`A` 和 `N`。在调用过程中，`A` 的值不会改变，但\
  \ `N` 的值在每次递归调用后都会减一。\n\n```cpp\nfloat expo(float A, int N) {\n    if(N==1)\n  \
  \      return A; \n    else\n        return A * expo(A,N-1); \n}\n```\n\n尝试使用递归函数调用解决斐波那契数列。斐波那契数列为：`0,1,1,2,3,5,8,13,21,…`\
  \ 斐波那契数列的递归定义如下：\n\n`Fibonacci(0) = 0`\n`Fibonacci(1) = 1`\n`Fibonacci(n) = Fibonacci(n-1)\
  \ + Fibonacci(n-2);`\n\n## 4.11 递归与迭代\n\n迭代和递归都基于控制结构。迭代使用重复结构（如 `for`、`while`、`do…while`），而递归使用选择结构（`if`、`if\
  \ else` 或 `switch`）。\n\n迭代和递归都可以无限执行——如果循环继续测试变为假，则发生无限循环；如果递归步骤没有以覆盖基准例的方式来缩小问题，则发生无限递归。\n\
  \n递归也有缺点。它反复地调用机制，从而导致方法调用的开销。这在处理器时间和内存空间上都是昂贵的。每次递归调用都会创建该方法的另一个副本（实际上，只是函数的变量）；这会消耗大量的内存。\n\
  \n**注意**：在以下情况下使用递归：\n\n1. 递归解决方案是自然且易于理解的\n2. 递归解决方案不会导致过度的重复计算\n3. 等效的迭代解决方案太复杂，且\n\
  4. 当然，当你在考试中被要求使用它时！！\n\n## 阿迪斯亚斯巴巴大学\n信息学院\n信息科学系\n**工作单 4。**\n\n1. 写一个 `int` 类型函数\
