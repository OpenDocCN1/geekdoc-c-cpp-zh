  \n9. 修改第 8 题的程序，按降序顺序打印年龄。\n\n10. 编写一个 C++ 程序，计算 20 个学生的字母等级。该程序应接受学生输入的期中成绩和期末成绩。使用适当的有效性控制机制防止错误输入。\n\
  \n11. 编写一个 C++ 程序，其中包含两个函数 `toBinary` 和 `toDecimal`。该程序应显示一个菜单，提示用户输入选择。如果用户选择 `toBinary`，则函数应接受一个十进制数字并显示其等效二进制表示。如果用户选择\
  \ `toDecimal`，则执行反操作。\n\n12. 开发一个 C++ 程序，接受用户输入的单词，然后检查该单词是否为回文。（注意：如果一个单词从左到右和从右到左读都是那样的，则它是一个回文）。\n\
