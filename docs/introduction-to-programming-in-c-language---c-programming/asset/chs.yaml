- "# C++ 语言编程入门指南 - C++ 编程\n\n\n\n![](img/cover00165.jpeg)\n\n# 第一章 绪\n\n### 什么是编程？\n\
  \n`Programming` 是计算机专业人员可以获得的一种技能，它使其掌握计算机执行所需操作或任务的知识。\n\n## 为什么我们需要学习计算机编程？\n\n\
  如果一个人想知道如何让计算机执行任务，那么`Computer programming` 就至关重要。大多数计算机用户只使用计算机上现应用程序。这些应用程序是由计算机程序员的。因此，如果有人对制作此类应用程序感兴趣，他需要学习如何与计算机交流，这就是学习计算机编程。\n\
  \n### 什么是编程语言？\n\n`Programming Language:` 是组不同类别的符号，用于指令计算机硬件执行设计者所需的特定操作。\n\n##\
  \ 成为程序员需要哪些技能？\n\n要成为一名程序员，除了基础计算机技能外，还需要具备以下主要技能：\n\n- `Programming Language Skill`：了解一种或多种编程语言以便与计算机交流并指令机器执行任务。\n\
  - `Problem Solving Skill`：解决现实世界问题并以易于理解的格式表示解决方案的技能。\n- `Algorithm Development`：设计一系列简单且人类可理解的指令集的技能，展示解决问题的步骤。这些步骤不应依赖于任何编程语言或机器。\n\
  \n在每种编程语言中，都有一组规定编程语言中所符号的规则。这些规则决定了程序员如何让计算机硬件执行特定操作。这些规则被称为`syntax`（语法）。\n\n###\
  \ 1.1 编程语言的代际\n\n编程语言分为五代：（第 1 代、第 2 代、第 3 代、第 4 代和第 5 代语言）。\n\n这些编程语言也可以分为两个大类：低级语言和高级语言。\n\
  \n- 低级语言是特定机器的或依赖机器的。\n- 高级语言如 `COBOL`、`BASIC` 是机器无关的，可以在各种计算机上运行。\n\n在五类编程语言中，第一代和第二代语言是低级语言，其余的是高级编程语言。\n\
  \n语言的级别越高，程序员理解和使用它就越容易。\n\n第四代之后的语言被称为极高级别语言。\n\n#### 1.1.1 第一代（机器语言，1940 年代）：\n\
  \n很难用它编写应用程序。\n\n依赖于所使用的特定计算机的机器语言。机器语言允许程序员直接与硬件交互，且不需要翻译器即可由计算机执行。\n\n在利用计算机资源方面更强大。\n\
  \n赋予了程序员力量。\n\n它们执行非常快，且内存使用高效。\n\n#### 1.1.2 第二代（汇编语言，1950 年代初）：\n\n对操作和存储位置使用符号名称。称为\
  \ `assembler`（汇编器）的系统程序将汇编语言编写的程序翻译成机器语言。\n\n用汇编语言编写的程序不具有移植性。即不同的计算机架构有自己的机器语言和汇编语言。\n\
  \n它们广泛用于系统软件开发。\n\n#### 1.1.3 第三代（高级语言，1950 年至 1970 年代）：\n\n使用类英语指令，数学家能够通过 `Z =\
  \ A + B` 等语句定义变量。\n\n此类语言比汇编语言用得多。用高级语言编写的程序需要翻译成机器语言才能执行。\n\n指令中使用常用词（保留字）使得它们更容易学习。\n\
  \n所有第三代编程语言都是过程化语言。在过程化语言中，预计程序员指定需要的内容以及如何执行它。\n\n#### 1.1.4 第四代（20 世纪 70 年代后期）：\n\
  \n具有简单的、类英语的语法规则；通常用于访问数据库。\n\n第四代语言是非过程化语言。\n\n非过程化方法更容易编写，但你对每个任务实际如何执行的控制较少。\n\
  \n在非过程化语言中，不需要程序员编写传统的编程逻辑。程序员专注于定义输入和输出，而不是所需的程序步骤。\n\n- 例如，一个命令如 `LIST` 可能在屏幕上显示文件中的所有记录，并用空格分隔字段。在过程化语言中，输入每个记录、测试文件末尾和格式化屏幕每列的所有逻辑都必须显式地编程。\n\
  \n第四代语言具有最少数量的语法规则。这节省了时间并释放专业程序员处理更复杂的任务。\n\n4GL 的示例包括结构化查询语言（`SQL`）、报告生成器、应用程序生成器和图形语言。\n\
  \n#### 1.1.5 第五代（1990 年代）：\n\n用于人工智能（AI）和专家系统；也用于访问数据库。\n\n5GL 是“自然”语言，其指令密切类似于人类语言。例如，“给我\
  \ 1997 财年 Jone Brown 的销售数据”。\n\n由于解释人类语言指令涉及的复杂性，5GL 需要非常强大的硬件和软件。\n\n\n\n\n\n多道程序涉及在计算机上“同时”运行多个作业。\n\
  \n在 20 世纪 60 年代，许多小组开创了*分时操作系统*。分时是多道程序的一种特殊情况，用户通过终端访问计算机。在这里，计算机并不是并行运行用户的作业，而是共享处理器（CPU）时间。\n\
  \n## 1.4. 主要编程范式\n\n编程世界的重大里程碑是编程语言开发过程中观察到的不同类型的特征或属性。其中，以下内容值得关注：\n\n过程化、结构化和面向对象的编程范式。\n\
  \n### 1.4.1. 过程化编程\n\n- 过程化编程是一种基于`procedure call`（过程调用）概念的编程范式。在许多涉及中等复杂度或需要高度可维护性的情况下，过程化编程通常是简单的顺序编程更好的选择。\n\
  - 可能的优点：能够在不同地方复用相同的代码（`function` 或 `procedure`），相比于一组 `GO TO` 或 `JUMP` 语句，更容易跟踪程序的执行流。\n\
  \n### 1.4.2. 结构化编程\n\n- 以较小的、独立的部分编写程序的过程。这使得更容易控制程序的开发，并设计和测试其各个组件部分。\n- 结构化程序由称为\
  \ `modules` 的单元构建，这些单元通常对应于单个 `procedures` 或 `functions`。\n- 可被视为过程化编程的*子集或子学科*。它最著名的特点是消除或减少对\
  \ `GO TO` 语句的依赖。\n\n### 1.4.3. 面向对象编程\n\n- OOP 背后的思想是：计算机程序是由一系列*个体单元或对象*组成的，而不是传统观点认为的程序是计算机的一系列指令列表。\n\
  - 面向对象编程被认为提供了更大的灵活性，使程序的更改变得更加容易。OOP 方法通常更容易开发和维护。\n\n## 1.5. 问题的解决过程与软件工程\n\n\
