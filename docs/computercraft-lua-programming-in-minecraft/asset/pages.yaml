- pgno: 24
  md: '# CHAPTER 3: PROGRAMMING IN

    LUA


    Lua is a new language that is gaining a lot of popularity for its flexibility
    and ease of use. It is the language chosen by the developers of ComputerCraft
    to allow you to write programs that can control MineCraft from within the ComputerCraft
    mod.


    Lua is an easy language to learn and if you have used Python, you will find it
    particularly easy as the syntax is quite similar.


    As we look at Lua, you will find it useful to have the Lua command line open (Figure
    3-1) so that you can type in commands and try things out.


    If you are not sure about how to start the Lua command line and what it is for,
    then please look back over Chapter 2.


    The Lua programming language is not unique to ComputerCraft. It is available for
    most types of computer. There is also an online Lua interpreter, that works like
    the Computer Craft Lua Command Line, except that it does not have any of the commands
    that are specific to ComputerCraft for doing things like controlling Redstone.


    You can find the online Lua interpreter here:


    http://www.lua.org/demo.html


    Figure 3-2 shows how it is used. Just type the Lua commands in the box at the
    top and then press Run to run the code. The results of any print commands or errors
    will be shown in the box underneath.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/7ea6f60bb53ecc17dd8979f66d5502d6_25_0.png)


    Figure 3-1. The Lua Command Line


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_25_1.png)


    Figure 3-2. Lua Online


    # Simple Sums


    Programming languages all allow you to do calculations and display results. Try
    entering the following on the Lua command line:


    ```

    ```lua

    print(2 + 2)

    ```

    ```


    This will display the answer (4). No surprise there!'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The print command tells Lua to display on the command line whatever is inside
    the (). So, we could just do:


    ```

    print(4)

    ```


    Try it. But by putting a sum inside the (), the sum is performed first and the
    result of the sum is displayed rather than the sum itself.


    # Variables


    Variables are a way of giving a value a name. Try typing the following into the
    Lua command line:


    ```

    a = 23

    print(a)

    ```


    The first line gives the variable called a the value 23 and the second line prints
    the value of a. You can use almost any name you like for a variable, but it cannot
    contain any spaces and by convention, it should start with a lowercase letter.
    You can use underscore characters (_) to separate words.


    So for example you could write:


    ```

    number_of_blocks = 100

    print(number_of_blocks)

    ```


    You can use variable in sums too. Try typing in the following commands:


    ```

    number_of_blocks = 100

    print(number_of_blocks)

    number_of_blocks = number_of_blocks + 1

    print(number_of_blocks)

    ```


    Lua will first display the answer 100 and then 101.


    The line number_of_blocks = number_of_blocks + 1 has added one to number_of_blocks.


    In the examples so far, the variable we have used has contained a number. Variables
    can hold different types of values, not just numbers. Perhaps the most common
    type of variable is called a string.


    The word string amongst programmers means just some text. This could be a single
    word or a sentence or even the entire contents of a web page.'
  merge: -1
  img_proc: true
