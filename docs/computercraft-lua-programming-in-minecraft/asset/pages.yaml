- pgno: 15
  md: '![](img/7ea6f60bb53ecc17dd8979f66d5502d6_15_0.png)


    Figure 2-4. The Computer recipe


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_15_1.png)


    Figure 2-5. The Advanced Computer recipe


    After right clicking on your new computer, we can begin. First, we need to learn
    how to navigate through the computer itself. It works with “directories” everything
    is in a directory, and we need to learn how to use them. To see what is in your
    current directory, type in "ls" (list) or "dir" (directory).


    Both commands do exactly the same thing. The command ''ls'' is what people in
    the Linux world do to list the contents of a directory and ''dir'' is the same
    command, harking back to the days of Microsoft DOS and the Windows command line.


    You should see something like Figure 2-6.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/7ea6f60bb53ecc17dd8979f66d5502d6_16_0.png)


    Figure 2-6. The Computer Command Line


    The only thing in our directory is another directory, “rom.” To tell the difference
    between programs and directories instantly, I recommend using advanced computers,
    although more expensive, they come equipped with more handy tools than standard
    computers, including colour-coding. It displays directories as green, and programs
    as white.


    To move into our “rom” directory, we type in “cd rom”, and then press enter. The
    command ‘cd’ stands for ‘change directory’. After typing ‘cd rom’ (no pun intended)
    type the ‘ls’ or ‘dir’ command to see what’s in there (Figure 2-7).


    Now things are getting interesting. We now have four options: apis, programs,
    startup and help. If we ‘cd’ into “programs” we are greeted with a whole host
    of assorted programs, including apis. To find out more about any program, simply
    type in “help” and then the name of the program. There is some pretty interesting
    stuff in there, so I recommend you look through it all.


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_16_1.png)


    Figure 2-7. Commands'
  merge: -1
