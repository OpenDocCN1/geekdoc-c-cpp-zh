- pgno: 58
  md: '# APPENDIX A: EXAMPLE

    PROGRAMS


    The example programs used in this book are all open source and available for download
    from https://github.com/simonmonk/computercraft_examples


    # Installing Programs in ComputerCraft


    You do not have to type the example programs into ComputerCraft. If you wish,
    you can download the programs and install them into ComputerCraft. Then all you
    have to do is to run them.


    This is how you do that.


    First, point your browser at https://github.com/simonmonk/computercraft_examples
    and then click on the icon labelled ZIP. It looks like a cloud with an arrow beneath
    it.


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_58_0.png)


    Figure A-1: The Github Repository


    This will download a zip file containing the programs. Unzip this into some convenient
    location, say the desktop.


    Next, on your computer, you have to find your ComputerCraft installation directory.


    This is in your .minecraft folder we navigated to in the installation chapter.
    Then go to “saves” and you will notice the titles of the folders are the names
    of your worlds. Once'
  merge: -1
  img_proc: true
