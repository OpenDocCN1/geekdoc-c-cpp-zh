- pgno: 43
  md: "```\n```text\nsendDashOrDot(string.byte(dashesAndDots, i))\n    end\nend\n\
    if letterCode == string.byte(\" \", 1) then\n    sendDashOrDot(0)\nend\nend\n\
    ```\n```\n\nThe first checks to see if it is between A and Z, the second between\
    \ a and z, the third checks to see if it is a digit and the final check is for\
    \ a space character.\n\nWithin each of these if statement there is a loop that\
    \ goes through each letter of the dots or dashes in the code calling the *sendDashOrDot*\
    \ function to actually control the Redstone.\n\n```\n```text\nfunction sendDashOrDot(dashOrDot)\n\
    \    if dashOrDot == 46 then\n        rs.setOutput(\"left\", true)\n        sleep(0.5)\n\
    \        rs.setOutput(\"left\", false)\n        sleep(0.5)\n    elseif dashOrDot\
    \ == 45 then\n        rs.setOutput(\"left\", true)\n        sleep(1.5)\n     \
    \   rs.setOutput(\"left\", false)\n        sleep(1.5)\n    elseif dashOrDot ==\
    \ 0 then\n        sleep(3)\n    end\nend\n```\n```\n\nThis function also uses\
    \ three if statements to work out if the flash to make is a small one for a dot,\
    \ a long one for dash or no flash at all for a space.\n\nTo make each flash, the\
    \ Redstone first has to be turned on with the command *rs.setOutput(\"left\",\
    \ true)*, there is then a delay of half a second using the command *sleep*, before\
    \ the Redstone is turned off again. Finally there is another 0.5 second delay.\n\
    \nIf you wanted to make the flashing faster then you would need to decrease these\
    \ delays.\n\nThe flash for a dash should be three times the flash length of a\
    \ dot.\n\nThe main part of the program is outside of any function and will therefore\
    \ just run when the program is run. This clears the terminal and prompts the user\
    \ to enter a string to send."
