- pgno: 55
  md: "+   - Right button to Back face of the computer\n+   - Go button to Top face\
    \ of the computer\n+   - Stop button to Front face of the computer\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_55_0.png)\n\
    \n# The Code\n\nThe turtle will not normally move without fuel. Fortunately, there\
    \ is a way around this. We can set our turtle to operate without being fed coal,\
    \ by modifying the config file config/CCTurtle.cfg.\n\nChange the line:\n\n```\n\
    turtleNeedsFuel=true\n```\n\nto:\n\n```\nturtleNeedsFuel=false\n```\n\nThe code\
    \ is in two parts. There is one program that runs on the computer (TurtleSend)\
    \ and another on the Turtle itself that receives commands from the computer through\
    \ the Turtle's wireless modem.\n\n# TurtleSend\n\nThis is the program that runs\
    \ on the Computer. It opens a connection to the wireless modem on the \"right\"\
    \ of the computer. Remember to change this if you attach your modem to a different\
    \ side.\n\n```\nwhile true do\n    rednet.open(\"right\")\n    if rs.getInput(\"\
    left\") then\n        rednet.broadcast(\"1\")\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "```\n```lua\nelseif rs.getInput(\"back\") then\n    rednet.broadcast(\"r\"\
    )\nelseif rs.getInput(\"top\") then\n    rednet.broadcast(\"g\")\nelseif rs.getInput(\"\
    front\") then\n    rednet.broadcast(\"s\")\nend\nrednet.close(\"right\")\nsleep(0.9)\n\
    end\n```\n```\n\nHaving opened the connection, the rs.input functions return true\
    \ if the Redstone connected to buttons are active. If the button is active then\
    \ the computer broadcasts a message with a single letter command of 'r', 'l',\
    \ 'g' or 's' for left, right, go or stop.\n\n# Turtle Receive\n\nThe receiving\
    \ code on the turtle mirrors the code on the computer. But, instead of checking\
    \ for button presses, it checks for incoming messages from the wireless modem.\
    \ If it finds it, then it sends the appropriate turtle movement command.\n\nThe\
    \ variable ‘moving’ is used to determine if the turtle.forward() message is carried\
    \ out. This allows the turtle to move forward automatically unless stopped.\n\n\
    ```\n```lua\nrednet.open(\"right\")\nwhile true do\n    id, message = rednet.receive(1)\n\
    \    if message == \"r\" then\n        turtle.turnRight()\n    elseif message\
    \ == \"l\" then\n        turtle.turnLeft()\n    elseif message == \"g\" then\n\
    \        moving = true\n    elseif message == \"s\" then\n        moving = false\n\
    \    end\n    if moving then\n        turtle.forward()\n    end\nend\n```\n```"
