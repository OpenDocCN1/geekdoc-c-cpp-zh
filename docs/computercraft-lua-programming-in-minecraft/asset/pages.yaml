- pgno: 28
  md: "Try the program out a few times with both the correct password and an incorrect\
    \ password.\n\nNote how the end of the series of commands to run if the condition\
    \ is true are marked with the end keyword. It is also important to indent the\
    \ things that should be done, so that you can immediately see what is going to\
    \ run if the condition is true, as opposed to commands outside the if statement\
    \ that will always be run. Indent the lines of code inside the “if” statement\
    \ by pressing tab once.\n\nWe could expand this example, so that if the wrong\
    \ password was entered then you get a different message back. To do this we use\
    \ an if else command as shown below.\n\n```\npassword = io.read()\nif password\
    \ == \"computercraft\" then\n    print(\"Opening Door\")\nelse\n    print(\"Wrong\
    \ Password\")\nend\n```\n\n# Loops\n\nIf you want to do something more than once\
    \ then you need to put the commands that you want to repeat inside a while loop.\
    \ For example, if you wanted to allow people to keep trying to guess the password,\
    \ you could put the code above inside a loop like this:\n\n```\nwhile true do\n\
    \    password = io.read()\n    if password == \"computercraft\" then\n       \
    \ print(\"Opening Door\")\n    else\n        print(\"Wrong Password\")\n    end\n\
    end\n```\n\nThe first line (while true do) will ensure that all the commands right\
    \ up to the end on the last line will be repeated forever. Forever, because the\
    \ condition after the word while is, in this case, true.\n\nThe value true is\
    \ called a Boolean value. These kinds of value can only be either true or false.\
    \ We will see them later in the context of controlling Redstone, where true means\
    \ on and false means off.\n\nIf you wanted to only allow someone five incorrect\
    \ guesses, then you could change the code like this:"
  merge: -1
  img_proc: true
- pgno: 29
  md: "```\n```lua\nfails = 0\nwhile fails < 5 do\n    password = io.read()\n    if\
    \ password == \"computercraft\" then\n        print(\"Opening Door\")\n    else\n\
    \        print(\"Wrong Password\")\n        fails = fails + 1\n    end\nend\n\
    print(\"You are only allowed 5 attempts. Exiting\")\n```\n```\n\nNow, we are using\
    \ a variable called fails that counts the number of times an incorrect password\
    \ was entered. When this exceeds 5, the condition for staying in the while loop\
    \ (that fails is less than 5) is no longer true and Lua exits the while loop and\
    \ prints the message that the number of attempts has been exceeded.\n\nThis kind\
    \ of \"while\" loop is handy if you just want to keep doing something until a\
    \ condition stops being true. The other common situation where you might want\
    \ to loop a certain number of times is called the \"for\" loop.\n\nThe following\
    \ example prints out the numbers 1 to 10. Try typing it into a program (call it\
    \ \"fortest\") and run it.\n\n```\n```lua\nfor i = 1, 10 do\n    print(i)\nend\n\
    ```\n```\n\nTry changing 10 to 100 and run it again.\n\n# ## Functions\n\nWhen\
    \ you write programs in any language, if you are not careful, there comes a point\
    \ where everything gets too complicated to work out what is going on. A great\
    \ way to keeps things simple and easy to modify is to break up your programs into\
    \ manageable chunks called functions.\n\nBy putting sections of code in a function,\
    \ you get the added advantage that you do not have to repeat yourself in your\
    \ program, you can just call the same function from different places in your program.\n\
    \nThere are really two things that you need to be able to do to a function. The\
    \ first is to define it, which specifies the"
  merge: -1
  img_proc: true
- pgno: 30
  md: "commands that are going to be contained in the function and the second is to\
    \ make the function run. Making the function run is referred to as \"calling\"\
    \ the function.\n\nTo define a function you use the \"function\" command. Lets\
    \ start by defining a really simple function that just prints out three lines\
    \ of text every time it is called.\n\nTo try this out, change directory to the\
    \ \"mystuff\" directory that you created earlier and type the following command:\n\
    \n```\n~~~\nedit functiontest\n~~~\n```\n\nThen type the following into the editor\
    \ before saving the file.\n\n```\n~~~lua\nfunction printWelcome()\n  print(\"\
    This program is written\")\n  print(\"in the programming language Lua\")\n  print(\"\
    Lua comes from Brazil\")\nend\n\nprintWelcome()\nprintWelcome()\nprintWelcome()\n\
    ~~~\n```\n\nSave the program and exit the editor, then try running it by typing:\n\
    \n```\n~~~\nfunctiontest\n~~~\n```\n\nYou should see the whole message printed\
    \ out three times.\n\nWe can use a \"for\" loop rather than call the function\
    \ three times, one after the other. Change the code to agree with the listing\
    \ below and then run it again. The message will be printed out 10 times.\n\n```\n\
    ~~~lua\nfunction printWelcome()\n  print(\"This program is written\")\n  print(\"\
