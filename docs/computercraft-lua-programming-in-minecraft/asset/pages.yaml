  md: '# CHAPTER 5: MORSE CODE

    SENDER


    This project allows you to type a message into the Computer and then have that
    message flashed as Morse


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_40_0.png)


    Figure 5-1. Morse Code Sender.


    code using a Redstone lamp.


    To build the morse code sender, you will need a computer, and a or some Redstone
    lamp(s).


    # Hardware


    Connect the two together using Redstone, and depending how far away you want your
    lamp, you need a repeater every 15 blocks of Redstone.


    The trick to hiding the Redstone, like I have done, is to set the output to bottom
    instead of left which is shown on the program code below. This means you are able
    to easily conceal the Redstone if you want, as it can be covered by other material.


    Figure 5-1 shows one arrangement with the computer below the Redstone, but you
    can wire it up in any way you want as long as the program specifies the right
    side for the connection to the computer.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Figure 5-2 shows the Computer terminal, which prompts for the message to be
    translated into dots and dashes (short and long flashes).


    The program cannot translate all characters into Morse code, it can only do the
    upper and lowercase letters and the digits 0 to 9. It can also do a space, which
    is just a pause.


    If you type in a character that it cannot translate, it will just ignore it.


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_41_0.png)


