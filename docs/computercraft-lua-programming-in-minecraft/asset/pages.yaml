- pgno: 31
  md: "Functions can also be supplied with something called parameters. So, if for\
    \ example, we wanted to write a function that would count up to a number of our\
    \ choosing, we could write something like this:\n\n```\n~~~\nfunction count(numberOfTimes)\n\
    \  for i = 1, numberOfTimes do\n    printWelcome()\n  end\nend\n~~~\n```\n\nYou\
    \ could then instruct it to count up to 10 using:\n\n```\n~~~\ncount(10)\n~~~\n\
    ```\n\nTo make it count to 1000, you would just do:\n\n```\n~~~\ncount(1000)\n\
    ~~~\n```\n\nIf you want a function to have more than one parameter, you just separate\
    \ them with commas both where you define the function and where you call it.\n\
    \nModify the count example to take two parameters, fromNumber and toNumber.\n\n\
    ```\n~~~\nfunction count(fromNumber, toNumber)\n  for i = fromNumber, toNumber\
    \ do\n    printWelcome()\n  end\nend\n~~~\n```\n\n```\n~~~\ncount(5, 20)\n~~~\n\
    ```\n\nAnother thing that functions can do is to return a value. When a function\
    \ returns a value, it means that you can assign the returned value to a variable.\n\
    \nLets write a function that converts temperatures in degrees C to degrees F:\n\
    \n```\n~~~\nfunction c2f(c)\n  f = c * 9 / 5 + 32\n  return f\nend\n~~~\n```\n\
    \n```\n~~~\ntemp = c2f(20)\nprint(temp)\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: "The return command quits the function, sending back the value specified - in\
    \ this case 'T'.\n\n# # Lists\n\nVariables can only hold a single value, but sometimes\
    \ it is useful to be able to collect together a list of things. You will use this\
    \ example later in the Morse code example. The items in a Lua list can be any\
    \ type of value. They can be a number or string or even another list.\n\nThe example\
    \ below shows how you can define a list of colors and then print them out one\
    \ at a time.\n\n```\n```lua\ncolors = {'red', 'orange', 'yellow',\n          'green',\
    \ 'blue',\n          'white', 'black'}\n\nfor i, color in ipairs(colors) do\n\
    \  print(color)\nend\n```\n```\n\nIn this case, the list is given the values of\
    \ color names, each as a string. The for loop uses a special command \"ipairs\"\
    \ that allows the \"for\" loop to count with both the position of each thing in\
    \ the list (i) and the color string (color).\n\nWe can prove this by modifying\
    \ the example so that we print both the position in the list and the string as\
    \ shown below:\n\n```\n```lua\ncolors = {'red', 'orange', 'yellow',\n        \
    \  'green', 'blue', 'white', 'black'}\nfor i, color in ipairs(colors) do\n  print(i,\
    \ color)\nend\n```\n```\n\nThis will produce an output like this:\n\n```\n```\n\
    1    red\n2    orange\n3    yellow\n4    green\n5    blue\n6    white\n```\n```"
  merge: -1
  img_proc: true
- pgno: 33
  md: "# 7 black\n\nYou can also find the value of things in a list from their position,\
    \ by using a square-brackets notation. Try typing the following into the Lua console:\n\
    \n```\n~~~lua\ncolors = { 'red', 'orange', 'yellow',\n  'green', 'blue', 'white',\n\
    \  'black' }\nprint(colors[3])\n~~~\n```\n\nYou will get the answer yellow, the\
    \ third item in the list.\n\nYou can use the same [] notation to change a particular\
    \ item. Now type the following into the console:\n\n```\n~~~lua\ncolors[3] = \"\
    purple\"\nprint(colors[3])\n~~~\n```\n\nThis now gives the answer purple. The\
    \ command has changed the third element of the list from yellow to purple.\n\n\
    You can also add and remove items from the list.\n\nTo add an element to the end\
    \ of a list using the table insert command. As shown in the example below which\
    \ will add the color gray to the end of the list.\n\n```\n~~~lua\ncolors = { 'red',\
    \ 'orange', 'yellow',\n  'green', 'blue',\n  'white', 'black' }\ntable.insert(colors,\
    \ 'gray')\n\nprint(colors[8])\n~~~\n```\n\nIf rather than add the color to the\
    \ end of the list, you can specify a position in the list where the element should\
    \ be added. The following code will add the new color to the start of the list.\n\
    \n```\n~~~lua\ncolors = { 'red', 'orange', 'yellow',\n  'green', 'blue',\n  'white',\
    \ 'black' }\ntable.insert(colors, 1, 'gray')\n\nprint(colors[1])\n~~~\n```\n\n\
    The number 1 as the second argument to insert indicates that the new item should\
    \ be inserted before the first element in the list."
  merge: -1
  img_proc: true
