    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_41_1.png)


    Figure 5-3. The Morse Sender with the Redstone Lamp Lit.


    # Software


    The program is long enough not to want to type in, so see Appendix A, if you would
    rather download it.'
