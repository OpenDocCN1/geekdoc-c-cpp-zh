- pgno: 8
  md: '# CHAPTER 1: INTRODUCTION


    This book will teach you how to program using the ComputerCraft mod in Minecraft
    and the Lua programming language.


    # Minecraft


    Minecraft is the creation of Markus "Notch" Persson and has been developed further
    by the games company Mojang. It was first released to the world back in 2009 and
    has become a huge success world-wide.


    Although the game includes combat and other conventional game activities, what
    makes Minecraft so interesting and different from many other games is the construction
    of objects within a virtual world (Figure 1-1)


    The player can operate in a ''creative'' mode where they can roam free and construct
    buildings and even machines from blocks. These blocks are of different types and
    can be purely structural or can have some special purpose. Some


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_8_0.png)


    of the more interesting blocks are:


    +   - Redstone - conduct a signal

    +   - Redstone lamp - light up'
  merge: -1
  img_proc: true
- pgno: 9
  md: '+   - Pistons - push blocks

    +   - Sticky pistons - can pull as well as push blocks

    +   - Redstone torch - acts as a power source for Redstone related objects (all
    of the above)

    +   - Redstone Repeaters - can extend Redstone signals (normal limit from a torch,
    button, lever is 15 blocks), can also set delays and only allow signal through
    one way


    # Technology


    Minecraft players are inventive and many have set about finding ways to build
    incredibly complex machines in Minecraft. Some of these recreations of real-world
    objects within Minecraft include:


    +   - Digital Clocks

    +   - Cannons that fire blocks

    +   - Digital logic gates

    +   - BUD or Block Update Detectors

    +   - Elevators

    +   - 8-bit memory

    +   - Calculators


    Figures 1-2 and 1-3 show a couple of interesting Minecraft creations.


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_9_0.png)'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/7ea6f60bb53ecc17dd8979f66d5502d6_10_0.png)


    Figure 1-3. The Works of a 9 Digit Programmable Door Lock


    # Mods


    The Minecraft platform is quite open, allowing developers to create extensions
    to the original game. These extensions add new types of special purpose block
    to the game or other features that game players might find useful.


    These mods are often bundled up into a “mod pack” that can be downloaded and added
    to Minecraft in one go.


    Some of the interesting mods that are available include:


    +   - Gems+ - Adds gems such as sapphires, rubies etc.

    +   - Mo’creatures - add new animals and mobs to the game

    +   - MAtmos - add environmental sounds to the game

    +   - Equivalent Exchange - enables you to exchange items for other items using
    a EMC value (the higher the more expensive) for example, 64 dirt for one coal

    +   - Macro / Keybind Mod - record actions and replay them

    +   - MineVideo Mod - record video of your gameplay

    +   - Modern Weapons - add guns and things

    +   - PortalCraft - Adds guns that fire portals

    +   - Optifine - Improves frame-rate of your game (less lag)


    One of these mods (ComputerCraft) allows you to add a computer to the game and
    then program it with the Lua programming language.


    This book focusses on how to program ComputerCraft in Lua.'
  merge: -1
  img_proc: true
