- pgno: 42
  md: "The program uses two lists, one for letters and one for numbers.\n\n```\n```lua\n\
    letters = {\n    \".-\", \"-...\", \"-.-.\", \"-..\", \".\", \"..-.\",\n    \"\
    --.\", \"....\", \"..\", \".---\", \"-.-\", \".-..\",\n    \"--\", \"-.\", \"\
    ---\", \".--.\", \"--.-\", \".-.\",\n    \"...\", \"-\", \"..-\", \"...-\", \"\
    .--\", \"-..-\",\n    \"-.--\", \"--..\"\n}\n\nnumbers = {\"-----\", \".----\"\
    , \"..---\",\n    \"...--\", \"....-\", \".....\", \"-....\", \"--...\",\n   \
    \ \"---..\", \"----.\"}\n```\n```\n\nEach element of the lists is a string of\
    \ dashes and dots. A dash represents a long flash and a dot a short flash.\n\n\
    The *sendMorse* function is where most of the action takes place. It takes a single\
    \ letter code and flashes it out as Morse.\n\nBy letterCode we mean a number that\
    \ is used to represent that letter within Lua. Every letter has a number, so for\
    \ example the letter A has a value of 65. The Lua code `string.byte(\"A\", 1)`\
    \ will return that letter code.\n\nSo the function handles the four possible types\
    \ of letter, in the four if statements.\n\n```\n```lua\nfunction sendMorse(letterCode)\n\
    \    if letterCode >= string.byte(\"A\", 1)\n        and letterCode <= string.byte(\"\
    Z\", 1) then\n        dashesAndDots =\n            letters[letterCode-string.byte(\"\
    A\", 1)+1]\n        for i = 1, string.len(dashesAndDots) do\n            sendDashOrDot(string.byte(dashesAndDots,\
    \ i))\n        end\n    end\n    if letterCode >= string.byte(\"a\", 1)\n    \
    \    and letterCode <= string.byte(\"z\", 1) then\n        dashesAndDots =\n \
    \           letters[letterCode-string.byte(\"a\", 1)+1]\n        for i = 1, string.len(dashesAndDots)\
    \ do\n            sendDashOrDot(string.byte(dashesAndDots, i))\n        end\n\
    \    end\n    if letterCode >= string.byte(\"0\", 1)\n        and letterCode <=\
    \ string.byte(\"9\", 1) then\n        dashesAndDots =\n            numbers[letterCode-string.byte(\"\
    0\", 1)+1]\n        for i = 1, string.len(dashesAndDots) do\n            sendDashOrDot(string.byte(dashesAndDots,\
    \ i))\n```\n```"
