- pgno: 12
  md: '# CHAPTER 2: COMPUTERCRAFT


    ComputerCraft is a mod for Minecraft that enables all sorts of possibilities through
    the use of programmable computers, and turtles and an array of other interesting
    features such as printers and even floppy disks. It is included in two of the
    most well-known modpacks: The Tekkit/Technic modpack, and the newcomer, Feed The
    Beast.


    Although the concept of using a computer in a computer game seems a bit odd, it
    is perfect for people who want to get in to simple programming with visible and
    satisfying results.


    # Installing the ComputerCraft Mod


    The computercraft mod requires the minecraftforge API, so it''s the easiest mod
    to install, but it is still fairly easy to do. At the moment, the most recent
    version of computercraft is for Minecraft 1.4.6, but confusingly enough, the ComputerCraft
    version is 1.4.8. As I already mentioned, you could download Feed The Beast or
    Tekkit/Technic which include the ComputerCraft mod. However, we will show you
    how to install it into a clean version of Minecraft.


    The instructions are for Windows, but can be easily adapted for other operating
    systems.


    First of all, you will need to download an archiving software if you do not already
    have one, I recommend you install either Winrar (my preference) or 7zip. Winrar
    can be downloaded from here: http://www.rarlab.com/ and 7zip from here: http://www.7-zip.org/


    Now, we are going to install the correct version of forge, simply browse to the
    link http://tinyurl.com/MF1-4-6


    You will see a webpage that looks something like Figure 2-1.


    After the timer hits 0, press the skip ad button and your zipped folder will start
    downloading.'
  merge: -1
  img_proc: true
