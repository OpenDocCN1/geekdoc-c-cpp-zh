    # ## Controlling Redstone with Lua


    Now to write our first program. For now we are just going to turn a lamp on, but
    later we will have password protected doors and even a morse code sender.


    The first step is to change directory to the folder where you are going to keep
    all your programs (*mystuff*), by typing:


    ```

    `cd mystuff`

    ```


    Then to create and edit the program file type:


    ```

    `edit redstonetest`

    ```


    Next enter the following text into the editor (Figure 2-14):


    ```

    ```lua

    rs.setOutput("left", true)

    sleep(3)

    rs.setOutput("left", false)

    ```

    ```


    ![](img/7ea6f60bb53ecc17dd8979f66d5502d6_20_1.png)


    Figure 2-14: Controlling Redstone'
