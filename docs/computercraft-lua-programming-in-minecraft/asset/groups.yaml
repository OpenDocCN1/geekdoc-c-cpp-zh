    \    else\n        print(\"Wrong Password\")\n        fails = fails + 1\n    end\n\
    end\nprint(\"You are only allowed 5 attempts. Exiting\")\n```\n```\n\nNow, we\
    \ are using a variable called fails that counts the number of times an incorrect\
    \ password was entered. When this exceeds 5, the condition for staying in the\
    \ while loop (that fails is less than 5) is no longer true and Lua exits the while\
    \ loop and prints the message that the number of attempts has been exceeded.\n\
    \nThis kind of \"while\" loop is handy if you just want to keep doing something\
    \ until a condition stops being true. The other common situation where you might\
    \ want to loop a certain number of times is called the \"for\" loop.\n\nThe following\
    \ example prints out the numbers 1 to 10. Try typing it into a program (call it\
    \ \"fortest\") and run it.\n\n```\n```lua\nfor i = 1, 10 do\n    print(i)\nend\n\
    ```\n```\n\nTry changing 10 to 100 and run it again.\n\n# ## Functions\n\nWhen\
    \ you write programs in any language, if you are not careful, there comes a point\
    \ where everything gets too complicated to work out what is going on. A great\
    \ way to keeps things simple and easy to modify is to break up your programs into\
    \ manageable chunks called functions.\n\nBy putting sections of code in a function,\
    \ you get the added advantage that you do not have to repeat yourself in your\
    \ program, you can just call the same function from different places in your program.\n\
    \nThere are really two things that you need to be able to do to a function. The\
    \ first is to define it, which specifies the"
