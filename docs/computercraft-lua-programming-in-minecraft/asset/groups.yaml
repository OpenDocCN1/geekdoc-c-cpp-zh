    ```\n```\nrednet.open(\"left\")\nwhile true do\n  id, message = rednet.receive(1)\n\
    \  if message then\n    print(message)\n  end\nend\n```\n```\n\nThe first thing\
    \ that happens is that a connection is established to the wireless access point\
    \ to the left. There is then a loop that will only quit if you CTRL-T the program.\
    \ Inside this loop rednet.receive is called to see if there is a message."
