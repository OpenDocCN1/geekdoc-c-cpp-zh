    \ the password, you could put the code above inside a loop like this:\n\n```\n\
    while true do\n    password = io.read()\n    if password == \"computercraft\"\
    \ then\n        print(\"Opening Door\")\n    else\n        print(\"Wrong Password\"\
    )\n    end\nend\n```\n\nThe first line (while true do) will ensure that all the\
    \ commands right up to the end on the last line will be repeated forever. Forever,\
    \ because the condition after the word while is, in this case, true.\n\nThe value\
    \ true is called a Boolean value. These kinds of value can only be either true\
    \ or false. We will see them later in the context of controlling Redstone, where\
    \ true means on and false means off.\n\nIf you wanted to only allow someone five\
    \ incorrect guesses, then you could change the code like this:"
