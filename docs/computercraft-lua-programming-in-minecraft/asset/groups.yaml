    ```\n\n如果你愿意，可以把从 term.clear() 开始的所有内容放入一个 while true 循环中，这样每次想发送消息时就不必重新运行程序。\n\
    \n### 小结\n\n这是一个编程上相当棘手的项目，因为你需要使用数组并操作字符串来找出各个字母的字符编码。你应该会发现，如果你能看懂这段代码，就能在 ComputerCraft\
    \ 中完成大多数事情。\n\n## 第6章：计算机网络\n\nComputerCraft 实际上允许你在一个世界中创建不止一台计算机，更重要的是，还能把这些计算机连接成一个网络。要做到这一点，你只需要添加几台计算机，并在它们的侧面安装无线调制解调器。\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_46_0.png)\n\n图 6-1. ComputerCraft 中的计算机网络\n\
    \n在这个项目（图 6-1）中，有两台计算机（其中一台隐藏在 图 6-1 的屏幕后面），你可以在一台计算机的终端上输入消息，消息会传输到另一台计算机，并显示在连接该计算机的大屏幕上。\n\
    \n### 设置发送计算机\n\n从硬件层面来说，你只需要一台计算机和一个无线调制解调器。记住无线适配器连接在计算机的哪一侧，因为你需要在这程序中指定它。\n\
    \n发送端程序名为 \"sender\"，可以连同本书中使用的其他程序一起从 https://github.com/simonmonk/computercraft_examples\
    \ 下载。有关安装该程序的更多信息，请参见附录 A。另外，发送端和接收端程序都不长，因此很容易手动输入。\n\n下面是发送端的完整程序。\n\n```lua\n\
    while true do\n  term.clear()\n  term.setCursorPos(1, 1)\n  print(\"Please enter\
    \ message to send:\")\n  message = read()\n  rednet.open(\"right\")\n  rednet.broadcast(message)\n\
    \  rednet.close(\"right\")\n  sleep(0.1)\nend\n```\n\n该程序会一直循环，等待输入消息。输入消息后，它会使用\
    \ rednet.open 打开到无线网络的连接。作为参数传入的一侧（这里是 \"right\"）必须与无线接入点连接在计算机上的那一面相匹配。\n\nrednet.broadcast\
    \ 命令会把消息发送到与这台计算机连接的所有计算机。最后使用 rednet.close 关闭连接。\n\n### 设置接收计算机\n\n接收端的设置与发送端相同，另外增加一台用于显示消息的显示器。\n\
    \n接收端程序仍然相当简单。有关如何下载和安装它的详细信息，请参见附录 A，你也可以使用编辑器输入它。\n\n```lua\nrednet.open(\"\
    left\")\nwhile true do\n  id, message = rednet.receive(1)\n  if message then\n\
    \    print(message)\n  end\nend\n```\n\n首先会建立到左侧无线接入点的连接。然后有一个循环，只有当你对程序按下 CTRL-T\
    \ 时才会退出。在这个循环内部，会调用 rednet.receive 来检查是否有消息。\n\n你会注意到，调用 `rednet.receive` 的结果被赋给了两个变量（id\
    \ 和 message）。这是因为该函数返回两个值。第一个值是发送消息的计算机的 id（这是一个数字），第二个值是包含消息的字符串。\n\nif 语句确保在打印消息之前确实接收到了消息。\n\
    \n当你启动接收计算机时，记得通过以下命令让它在显示器上运行：\n\n```\nmonitor right receiver\n```\n\n如果你的显示器连接在计算机的右侧以外的其他侧面，请在上面的命令中相应修改。\n\
    \n### 发送消息\n\n按上述说明启动接收端运行，然后转到发送计算机并启动发送端程序（图 6-2）。\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_48_0.png)\n\
    \n图 6-2. 发送消息\n\n输入你想发送的消息并按回车键。如果一切正常，消息就会出现在接收计算机的显示器上。\n\n### 小结\n\n没有什么能阻止你构建更大的计算机网络，并让它们彼此发送消息。例如，你可以让一台控制计算机\n"
