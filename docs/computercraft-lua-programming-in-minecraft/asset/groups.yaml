    \ 的第二个参数，数字 1 表示新项目应插入到列表中第一个元素之前。\n\n### 小结\n\n对于一门相当复杂的编程语言来说，这是一个非常简短的介绍。不过，它应该能让你开始使用\
    \ Lua，并允许你使用 ComputerCraft 完成你想要的大多数事情。\n\n如果你想了解更多关于 Lua 的信息，请访问官方网站 www.lua.org。\n\
    \n## 第四章：密码保护门\n\n凭借我们对 Lua 和 ComputerCraft 的基础知识，我们可以开始制作一些非常酷的东西。密码保护门在服务器上非常有用，尤其是当你是唯一知道如何使用\
    \ ComputerCraft 模组的人时。\n\n在开始这个程序之前，有一件非常重要的事情需要了解，那就是如果你的程序中有这样一行：\n\n```lua\n\
    while true do\n```\n\n……一旦程序运行，你就无法停止它，除非你打破实际的计算机方块，或者按住 CTRL 键并按下 T。这一行在密码程序中是主要部分，因此记住\
    \ CTRL-T（用于终止）以停止程序以便编辑它非常重要，因为你可能在某个时候想要更改密码。\n\n### 硬件\n\n在开始编程之前，我们需要按照图 4-1\
    \ 所示设置方块。\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_36_0.png)\n\n图 4-1. 密码保护门。\n\
    \n当然，你使用什么类型的方块或门并不重要，这只是一个示例。另外，如果你希望计算机位于门的上方或右侧，你必须将下面程序代码中使用的侧面从 \"left\"\
    \ 改为门所在计算机的任意一侧。\n\n你可以使用 \"left\"、\"right\"、\"front\"、\"back\"、\"bottom\" 或 \"\
    top\"。\n\n### 软件\n\n控制门的程序相当短，可以轻松输入。如果你更喜欢下载包含代码的文件，可以从以下网址获取：https://github.com/simonmonk/computercraft_examples\n\
    \n要将此程序安装到你的 ComputerCraft 安装中，请遵循附录 A 中的说明。\n\n```lua\nwhile true do\n  term.clear()\n\
    \  term.setCursorPos(1, 1)\n  print(\"Please enter the password:\")\n  password\
    \ = read(\"*\")\n  if password == \"password\" then\n    rs.setOutput(\"left\"\
    , true)\n    sleep(3)\n    rs.setOutput(\"left\", false)\n  end\nend\n```\n\n\
    现在，我将逐行分解这个程序，并解释其工作原理。正如我上面提到的，`while true do` 这一行只是让程序在无限循环中运行。\n\n```lua\n\
    term.clear()\n```\n\n这一行会在每次循环时清除屏幕。\n\n```lua\nterm.setCursorPos(1, 1)\n```\n\
    \n这会将光标位置设置在 (1, 1)，即屏幕的右上角。\n\n```lua\nprint(\"Please enter the password:\")\n\
    ```\n\n这是屏幕上显示的提示用户操作的文字。\n\n下一行需要更多解释：\n\n```lua\npassword = read(\"*\")\n```\n\
    \npassword 是变量，必须用等号定义。命令 read 表示它正在等待输入内容，而 (*) 表示输入时，输入的内容会显示为 `*s`。请注意，这是 ComputerCraft\
    \ 特有的功能，因此如果你在没有运行 ComputerCraft 的 Lua 上尝试，它可能无法工作。\n\n```lua\nif password ==\
    \ \"password\" then\n```\n\n这将查看变量 password，即我们输入的内容，而 == 表示将其与我们放在另一边的任何内容（即文本\
    \ \"password\"）进行比较。这意味着如果你想更改密码，就必须更改引号内的内容。该命令随后结束这一行，因此如果你输入的内容与引号内的内容（你的密码）匹配，它就会执行某些操作。\n\
    \n这里还有一个缩进，表示它位于 *if* 语句内部。\n\n```lua\nrs.setOutput(\"left\", true)\n```\n\n这是说红石信号在计算机左侧开启，穿过方块，并触发门。\n\
    \n```lua\nsleep(3)\n```\n\n这会让计算机等待 3 秒后再继续，然后 `rs.setOutput(\"left\", false)`\
    \ 会关闭计算机左侧的红石信号，从而关闭门。我个人认为让门保持开启 3 秒差不多合适，但你可以根据自己的需要更改。\n\n最后，第一个 *end* 标记了\
    \ *if* 语句应执行内容的结束点，*then* 作为开始点，而第二个 *end* 标记了 *while true do* 循环应停止的位置。\n\n由于这个程序只有\
    \ 11 行长，你可以轻松地将其输入，但例如，下一个程序手动输入会非常繁琐，因此你也可以参考附录 A 获取下载本书所有 Lua 程序的说明。\n\n###\
    \ 小结\n\n这是一个很好的入门小项目。你可以通过多种方式使其更复杂，例如增加最大尝试次数，或者添加一些无需编辑程序即可更改密码的选项。\n\n在进入下一个项目（一个复杂得多的程序）之前，尽情实验和享受乐趣吧。\n\
    \n## 第五章：摩尔斯电码发送器\n\n这个项目允许你在计算机中输入一条消息，然后使用红石灯以摩尔斯电码的形式闪烁显示该消息。\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_40_0.png)\n\
    \n图 5-1. 摩尔斯电码发送器。\n\n要构建摩尔斯电码发送器，你需要一台计算机和一个或多个红石灯。\n\n### 硬件\n\n使用红石将两者连接起来，根据你希望灯的距离多远，每\
    \ 15 格红石就需要一个中继器。\n\n像我这样隐藏红石的技巧是将输出设置为 bottom 而不是 left，如下面的程序代码所示。这意味着你可以根据需要轻松隐藏红石，因为它可以被其他材料覆盖。\n\
    \n图 5-1 展示了计算机位于红石下方的一种布置，但只要你将程序指定为连接到计算机的正确侧面，你就可以以任何你想要的方式连接它。\n"
