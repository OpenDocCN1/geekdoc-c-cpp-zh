    这将产生如下输出：\n\n```\n1    red\n2    orange\n3    yellow\n4    green\n5    blue\n\
    6    white\n7    black\n```\n\n你还可以通过方括号表示法，根据项目在列表中的位置来查找其值。尝试在 Lua 控制台中输入以下内容：\n\
    \n```lua\ncolors = { 'red', 'orange', 'yellow',\n  'green', 'blue', 'white',\n\
