    \ 'gray')\n\nprint(colors[8])\n```\n\n如果不想将颜色添加到列表末尾，而是想指定列表中应添加元素的位置，下面的代码将把新颜色添加到列表开头。\n\
    \n```lua\ncolors = { 'red', 'orange', 'yellow',\n  'green', 'blue',\n  'white',\
