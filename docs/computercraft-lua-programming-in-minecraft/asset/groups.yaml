  md: "\nsends wireless network commands to other computers that control pistons or\
    \ Redstone lamps. The possibilities are endless!\n\n## CHAPTER 7: TWITTER IN MINECRAFT\n\
    \nWe thought it might be cool to be able to read tweets while you are playing\
    \ Minecraft. In this project, not only can you read tweets, but also you can arrange\
    \ that when a Tweet arrives you are notified by activating a piston using Redstone.\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_50_0.png)\n\nFigure 7-1. Twitter in\
    \ Minecraft\n\nAfter the piston activates and you know a Tweet has arrived you\
    \ can go and view it on the Computer's console (Figure 7-2).\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_50_1.png)\n\
    \nFigure 7-2. Reading a Tweet in Minecraft\n\n### Hardware\n\nYou can use the\
    \ Redstone signal from the computer any way you want, but in the arrangement shown\
    \ above, the Redstone controls a piston that reveals a Glowstone block when a\
    \ Tweet is received (Figure 7-3).\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_51_0.png)\n\
    \nFigure 7-3. After a New Tweet Arrives.\n\n### The Code\n\nFor this program to\
    \ work, you must first enable web access from ComputerCraft. To do this, you need\
    \ to open up the file \"ComputerCraft.cfg\" in the folder \"minecraft/config\"\
    \ using an editor like TextPad or NotePad and edit the following code from:\n\n\
    ```\nenableapi http {\n    general=false\n}\n```\n\nto:\n\n```\nenableapi http\
    \ {\n    general=true\n}\n```\n\nand further down in the same text file from:\n\
    \n```\nEnableAPI_http=false\n```\n\nto:\n\n```\nEnableAPI_http=true\n```\n\nOnce\
    \ this is done, save the file again and restart MineCraft.\n\nThe code uses the\
    \ Twitter API to fetch the latest tweet from the twitter name specified, so you\
    \ will probably want to change the first line to refer to your Twitter name.\n\
    \n```\nname = \"Simonmonk2\"\n```\n\n```lua\npage = \"http://api.twitter.com/1/statuses/\"\
    \ ..\n       \"user_timeline.xml?screen_name=\" .. name ..\n       \"&count=1\"\
    \nold_text = \"\"\n\nwhile true do\n    tweet_page = http.get(page)\n    response\
    \ = tweet_page.readAll()\n    tweet_page.close()\n    start_of_tag = string.find(response,\n\
    \                     \"<text>\")\n    end_of_tag = string.find(response,\n  \
    \                   \"</text>\")\n\n    if (start_of_tag and end_of_tag) then\n\
    \        text = string.sub(response,\n             start_of_tag + 6, end_of_tag\
    \ - 1)\n        if (text ~= old_text) then\n            print(text)\n        \
    \    old_text = text\n            rs.setOutput(\"bottom\", true)\n           \
    \ sleep(3)\n            rs.setOutput(\"bottom\", false)\n            sleep(3)\n\
    \        end\n    end\n    sleep(20)\nend\n```\n\nThe Twitter API returns XML\
    \ containing the message. The actual message itself will be in a <text> tag so\
    \ the code finds the position of <text> and </text> and chops out the text in\
    \ the middle.\n\nThe main loop continues forever, but a sleep of 20 seconds ensures\
    \ that Twitter is only checked every 20 seconds for tweets.\n\nWe do not want\
    \ to trigger the notification unless there is a new tweet, so the message that\
    \ is fetched is compared with the message in the variable old_text and only if\
    \ they are different is the message printed and the Redstone activated.\n\nWhen\
    \ you see the Redstone do something when you receive a message, you can go and\
    \ read the message on the computer console.\n\n### Summary\n\nThis project opens\
    \ up all sorts of possibilities. Not only does it mean that you can be contacted\
    \ via Twitter, when you are in Minecraft, but with some work, you could be alerted\
    \ of emails or Facebook messages.\n\n- Right button to Back face of the computer\n\
    - Go button to Top face of the computer\n- Stop button to Front face of the computer\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_55_0.png)\n\n### The Code\n\nThe turtle\
    \ will not normally move without fuel. Fortunately, there is a way around this.\
    \ We can set our turtle to operate without being fed coal, by modifying the config\
    \ file config/CCTurtle.cfg.\n\nChange the line:\n\n```\nturtleNeedsFuel=true\n\
    ```\n\nto:\n\n```\nturtleNeedsFuel=false\n```\n\nThe code is in two parts. There\
    \ is one program that runs on the computer (TurtleSend) and another on the Turtle\
    \ itself that receives commands from the computer through the Turtle's wireless\
    \ modem.\n\n### TurtleSend\n\nThis is the program that runs on the Computer. It\
    \ opens a connection to the wireless modem on the \"right\" of the computer. Remember\
    \ to change this if you attach your modem to a different side.\n\n```lua\nwhile\
    \ true do\n    rednet.open(\"right\")\n    if rs.getInput(\"left\") then\n   \
    \     rednet.broadcast(\"l\")\n    elseif rs.getInput(\"back\") then\n       \
    \ rednet.broadcast(\"r\")\n    elseif rs.getInput(\"top\") then\n        rednet.broadcast(\"\
    g\")\n    elseif rs.getInput(\"front\") then\n        rednet.broadcast(\"s\")\n\
    \    end\n    rednet.close(\"right\")\n    sleep(0.9)\nend\n```\n\nHaving opened\
    \ the connection, the rs.input functions return true if the Redstone connected\
    \ to buttons are active. If the button is active then the computer broadcasts\
    \ a message with a single letter command of 'r', 'l', 'g' or 's' for left, right,\
    \ go or stop.\n\n### Turtle Receive\n\nThe receiving code on the turtle mirrors\
    \ the code on the computer. But, instead of checking for button presses, it checks\
    \ for incoming messages from the wireless modem. If it finds it, then it sends\
    \ the appropriate turtle movement command.\n\nThe variable ‘moving’ is used to\
    \ determine if the turtle.forward() message is carried out. This allows the turtle\
    \ to move forward automatically unless stopped.\n\n```lua\nrednet.open(\"right\"\
    )\nwhile true do\n    id, message = rednet.receive(1)\n    if message == \"r\"\
    \ then\n        turtle.turnRight()\n    elseif message == \"l\" then\n       \
    \ turtle.turnLeft()\n    elseif message == \"g\" then\n        moving = true\n\
    \    elseif message == \"s\" then\n        moving = false\n    end\n    if moving\
    \ then\n        turtle.forward()\n    end\nend\n```\n\n### Summary\n\nAn obvious\
    \ way of extending this project would be to add extra commands to the Turtle to\
    \ allow it to dig etc. You could also combine it with the previous project and\
    \ have the Turtle do a little dance, or even come and find you!\n\n## APPENDIX\
    \ A: EXAMPLE PROGRAMS\n\nThe example programs used in this book are all open source\
    \ and available for download from https://github.com/simonmonk/computercraft_examples\n\
    \n### Installing Programs in ComputerCraft\n\nYou do not have to type the example\
    \ programs into ComputerCraft. If you wish, you can download the programs and\
    \ install them into ComputerCraft. Then all you have to do is to run them.\n\n\
    This is how you do that.\n\nFirst, point your browser at https://github.com/simonmonk/computercraft_examples\
    \ and then click on the icon labelled ZIP. It looks like a cloud with an arrow\
    \ beneath it.\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_58_0.png)\n\nFigure\
    \ A-1: The Github Repository\n\nThis will download a zip file containing the programs.\
    \ Unzip this into some convenient location, say the desktop.\n\nNext, on your\
    \ computer, you have to find your ComputerCraft installation directory.\n\nThis\
    \ is in your .minecraft folder we navigated to in the installation chapter. Then\
    \ go to “saves” and you will notice the titles of the folders are the names of\
    \ your worlds. Once\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_63_0.png)\n\n\
    Welcome to a world of unlimited creativity, where you can write all sorts of amazing\
    \ programs, and build magnificent structures.\n\nThis book will guide you from\
    \ the installation of the ComputerCraft mod, to networking computers or making\
    \ a Morse code generator.\n\nWith downloadable scripts and an installation guide\
    \ for them, programming in a game without copy and paste has never been so simple!\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_63_1.png)\n"
  mdcn: "\n向其他计算机发送无线网络命令，从而控制活塞或红石灯。可能性无穷无尽！\n\n## 第7章：Minecraft中的推特\n\n我们觉得，在玩Minecraft时能够阅读推文会很酷。在这个项目中，你不仅可以阅读推文，还可以设置在收到推文时通过红石激活活塞来通知你。\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_50_0.png)\n\n图7-1. Minecraft中的推特\n\n\
    当活塞被激活、你得知有推文到达后，就可以去计算机的控制台上查看它（图7-2）。\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_50_1.png)\n\
    \n图7-2. 在Minecraft中阅读推文\n\n### 硬件\n\n你可以按任何方式使用计算机发出的红石信号，但在上述布局中，红石控制一个活塞，在收到推文时露出一个萤石块（图7-3）。\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_51_0.png)\n\n图7-3. 新推文到达后\n\n### 代码\n\
    \n要让程序运行，首先必须启用ComputerCraft的网页访问功能。为此，你需要使用TextPad或NotePad等编辑器打开“minecraft/config”文件夹中的“ComputerCraft.cfg”文件，并将以下代码从：\n\
    \n```\nenableapi http {\n    general=false\n}\n```\n\n改为：\n\n```\nenableapi http\
    \ {\n    general=true\n}\n```\n\n然后在同一个文本文件中继续向下找到：\n\n```\nEnableAPI_http=false\n\
    ```\n\n改为：\n\n```\nEnableAPI_http=true\n```\n\n完成这些修改后，再次保存文件并重启Minecraft。\n\n\
    代码使用Twitter API从指定的推特用户名获取最新推文，因此你可能想更改第一行，使其指向你自己的推特用户名。\n\n```\nname = \"Simonmonk2\"\
    \n```\n\n```lua\npage = \"http://api.twitter.com/1/statuses/\" ..\n       \"user_timeline.xml?screen_name=\"\
    \ .. name ..\n       \"&count=1\"\nold_text = \"\"\n\nwhile true do\n    tweet_page\
    \ = http.get(page)\n    response = tweet_page.readAll()\n    tweet_page.close()\n\
    \    start_of_tag = string.find(response,\n                     \"<text>\")\n\
    \    end_of_tag = string.find(response,\n                     \"</text>\")\n\n\
    \    if (start_of_tag and end_of_tag) then\n        text = string.sub(response,\n\
    \             start_of_tag + 6, end_of_tag - 1)\n        if (text ~= old_text)\
    \ then\n            print(text)\n            old_text = text\n            rs.setOutput(\"\
    bottom\", true)\n            sleep(3)\n            rs.setOutput(\"bottom\", false)\n\
    \            sleep(3)\n        end\n    end\n    sleep(20)\nend\n```\n\nTwitter\
    \ API返回包含消息的XML。实际消息本身会处于一个`<text>`标签内，因此代码会找到`<text>`和`</text>`的位置，并截取中间的内容作为文本。\n\
    \n主循环会一直持续下去，但20秒的休眠确保了每20秒才检查一次Twitter上的推文。\n\n我们不希望在没有新推文时触发通知，因此获取到的消息会与变量`old_text`中的消息进行比较，只有二者不同时，才会打印消息并激活红石。\n\
    \n当你收到消息并看到红石做出反应时，就可以去计算机控制台阅读消息了。\n\n### 小结\n\n这个项目开启了各种各样的可能性。这不仅意味着你在Minecraft中也能通过Twitter被联系到，而且稍加努力，你还可以在收到电子邮件或Facebook消息时得到提醒。\n\
    \n- 右键对应计算机的背面\n- 前进键对应计算机的顶面\n- 停止键对应计算机的正面\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_55_0.png)\n\
    \n### 代码\n\n海龟通常在没有燃料的情况下不会移动。幸运的是，有一种方法可以绕过这个限制。我们可以通过修改配置文件`config/CCTurtle.cfg`，让海龟无需喂煤就能运行。\n\
    \n将这一行：\n\n```\nturtleNeedsFuel=true\n```\n\n改为：\n\n```\nturtleNeedsFuel=false\n\
    ```\n\n代码分为两部分。一个程序在计算机上运行（TurtleSend），另一个在海龟本身上运行，通过海龟的无线调制解调器接收来自计算机的命令。\n\n\
    ### TurtleSend\n\n这是在计算机上运行的程序。它打开一个连接到计算机“右侧”无线调制解调器的连接。如果你把调制解调器装到了其他侧面，记得修改这里。\n\
    \n```lua\nwhile true do\n    rednet.open(\"right\")\n    if rs.getInput(\"left\"\
    ) then\n        rednet.broadcast(\"l\")\n    elseif rs.getInput(\"back\") then\n\
    \        rednet.broadcast(\"r\")\n    elseif rs.getInput(\"top\") then\n     \
    \   rednet.broadcast(\"g\")\n    elseif rs.getInput(\"front\") then\n        rednet.broadcast(\"\
    s\")\n    end\n    rednet.close(\"right\")\n    sleep(0.9)\nend\n```\n\n打开连接后，如果连接到按钮的红石处于激活状态，`rs.input`函数就会返回`true`。当按钮激活时，计算机就广播一条包含单个字母命令的消息：`'r'`、`'l'`、`'g'`或`'s'`，分别表示左转、右转、前进或停止。\n\
    \n### Turtle Receive\n\n海龟上的接收代码与计算机上的代码相对应。但它不是检测按钮按下，而是检测来自无线调制解调器的传入消息。如果发现了消息，它就会发送相应的海龟移动命令。\n\
    \n变量`moving`用于决定是否执行`turtle.forward()`命令。这样海龟就可以自动前进，除非收到停止命令。\n\n```lua\nrednet.open(\"\
    right\")\nwhile true do\n    id, message = rednet.receive(1)\n    if message ==\
    \ \"r\" then\n        turtle.turnRight()\n    elseif message == \"l\" then\n \
    \       turtle.turnLeft()\n    elseif message == \"g\" then\n        moving =\
    \ true\n    elseif message == \"s\" then\n        moving = false\n    end\n  \
    \  if moving then\n        turtle.forward()\n    end\nend\n```\n\n### 小结\n\n扩展这个项目的一个明显方法是给海龟添加额外的命令，让它能够挖掘等。你也可以把这个项目和前面的项目结合起来，让海龟跳一小段舞，甚至让它来找你！\n\
    \n## 附录A：示例程序\n\n本书中使用的示例程序都是开源的，可以从 https://github.com/simonmonk/computercraft_examples\
    \ 下载。\n\n### 在ComputerCraft中安装程序\n\n你不必把示例程序手动输入到ComputerCraft中。如果你愿意，可以下载这些程序并将它们安装到ComputerCraft中。然后你只需要运行它们即可。\n\
    \n具体操作如下。\n\n首先，在浏览器中打开 https://github.com/simonmonk/computercraft_examples ，然后点击标有ZIP的图标。它看起来像一朵云，下面有一个箭头。\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_58_0.png)\n\n图A-1: GitHub仓库\n\n这会下载一个包含这些程序的zip文件。将该文件解压到某个方便的位置，比如桌面。\n\
    \n接下来，在你的计算机上，你需要找到ComputerCraft的安装目录。\n\n我们在安装章节中导航过的`.minecraft`文件夹就在这里。然后进入“saves”，你会注意到这些文件夹的名称就是你各世界的名称。接下来\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_63_0.png)\n\n欢迎来到一个充满无限创意的世界，在这里你可以编写各种令人惊叹的程序，建造宏伟的建筑。\n\
    \n这本书将引导你从安装ComputerCraft模组开始，一直到让计算机联网或制作莫尔斯电码生成器。\n\n有了可下载的脚本和相应的安装指南，在没有复制粘贴功能的游戏中进行编程从未如此简单！\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_63_1.png)\n\n"
