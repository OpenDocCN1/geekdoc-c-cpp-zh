    end\n```\n\n在此例中，列表被赋予了颜色名称的值，每个值都是字符串。for 循环使用了一个特殊命令 \"ipairs\"，它允许 \"for\"\
    \ 循环同时使用列表中每个项目的位置 (i) 和颜色字符串 (color) 进行计数。\n\n我们可以通过修改示例来证明这一点，同时打印列表中的位置和字符串，如下所示：\n\
    \n```lua\ncolors = {'red', 'orange', 'yellow',\n          'green', 'blue', 'white',\
