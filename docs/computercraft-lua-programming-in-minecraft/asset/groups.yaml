    The program is long enough not to want to type in, so see Appendix A, if you would\
    \ rather download it.\n\nThe program uses two lists, one for letters and one for\
    \ numbers.\n\n```lua\nletters = {\n    \".-\", \"-...\", \"-.-.\", \"-..\", \"\
    .\", \"..-.\",\n    \"--.\", \"....\", \"..\", \".---\", \"-.-\", \".-..\",\n\
    \    \"--\", \"-.\", \"---\", \".--.\", \"--.-\", \".-.\",\n    \"...\", \"-\"\
    , \"..-\", \"...-\", \".--\", \"-..-\",\n    \"-.--\", \"--..\"\n}\n\nnumbers\
    \ = {\"-----\", \".----\", \"..---\",\n    \"...--\", \"....-\", \".....\", \"\
    -....\", \"--...\",\n    \"---..\", \"----.\"}\n```\n\nEach element of the lists\
    \ is a string of dashes and dots. A dash represents a long flash and a dot a short\
    \ flash.\n\nThe *sendMorse* function is where most of the action takes place.\
    \ It takes a single letter code and flashes it out as Morse.\n\nBy letterCode\
    \ we mean a number that is used to represent that letter within Lua. Every letter\
    \ has a number, so for example the letter A has a value of 65. The Lua code `string.byte(\"\
    A\", 1)` will return that letter code.\n\nSo the function handles the four possible\
    \ types of letter, in the four if statements.\n\n```lua\nfunction sendMorse(letterCode)\n\
    \    if letterCode >= string.byte(\"A\", 1)\n        and letterCode <= string.byte(\"\
    Z\", 1) then\n        dashesAndDots =\n            letters[letterCode-string.byte(\"\
    A\", 1)+1]\n        for i = 1, string.len(dashesAndDots) do\n            sendDashOrDot(string.byte(dashesAndDots,\
    \ i))\n        end\n    end\n    if letterCode >= string.byte(\"a\", 1)\n    \
    \    and letterCode <= string.byte(\"z\", 1) then\n        dashesAndDots =\n \
    \           letters[letterCode-string.byte(\"a\", 1)+1]\n        for i = 1, string.len(dashesAndDots)\
    \ do\n            sendDashOrDot(string.byte(dashesAndDots, i))\n        end\n\
    \    end\n    if letterCode >= string.byte(\"0\", 1)\n        and letterCode <=\
    \ string.byte(\"9\", 1) then\n        dashesAndDots =\n            numbers[letterCode-string.byte(\"\
    0\", 1)+1]\n        for i = 1, string.len(dashesAndDots) do\n            sendDashOrDot(string.byte(dashesAndDots,\
    \ i))\n        end\n    end\n    if letterCode == string.byte(\" \", 1) then\n\
    \        sendDashOrDot(0)\n    end\nend\n```\n\nThe first checks to see if it\
    \ is between A and Z, the second between a and z, the third checks to see if it\
    \ is a digit and the final check is for a space character.\n\nWithin each of these\
    \ if statements there is a loop that goes through each letter of the dots or dashes\
    \ in the code calling the *sendDashOrDot* function to actually control the Redstone.\n\
    \n```lua\nfunction sendDashOrDot(dashOrDot)\n    if dashOrDot == 46 then\n   \
    \     rs.setOutput(\"left\", true)\n        sleep(0.5)\n        rs.setOutput(\"\
    left\", false)\n        sleep(0.5)\n    elseif dashOrDot == 45 then\n        rs.setOutput(\"\
    left\", true)\n        sleep(1.5)\n        rs.setOutput(\"left\", false)\n   \
    \     sleep(1.5)\n    elseif dashOrDot == 0 then\n        sleep(3)\n    end\n\
    end\n```\n\nThis function also uses three if statements to work out if the flash\
    \ to make is a small one for a dot, a long one for a dash or no flash at all for\
    \ a space.\n\nTo make each flash, the Redstone first has to be turned on with\
    \ the command *rs.setOutput(\"left\", true)*, there is then a delay of half a\
    \ second using the command *sleep*, before the Redstone is turned off again. Finally\
    \ there is another 0.5 second delay.\n\nIf you wanted to make the flashing faster\
    \ then you would need to decrease these delays.\n\nThe flash for a dash should\
    \ be three times the flash length of a dot.\n\nThe main part of the program is\
    \ outside of any function and will therefore just run when the program is run.\
    \ This clears the terminal and prompts the user to enter a string to send.\n\n\
    ```lua\nterm.clear()\nterm.setCursorPos(1, 1)\nprint(\"Enter Message to Send\"\
    )\nmessage = read()\n```\n\nIt then loops over each letter in the string sending\
    \ it to the function *sendMorse*.\n\n```lua\nfor i = 1, string.len(message) do\n\
    \    sendMorse(string.byte(message, i))\nend\n```\n\nYou could if you wish put\
    \ everything from term.clear() into a while true loop so that you do not have\
    \ to run the program each time you want to send a message.\n\n### Summary\n\n\
    This is quite a tricky project to program, as you need to use arrays and manipulate\
    \ strings to find the character codes of individual letters. You should find that\
    \ if you can follow this code, you can do most things in ComputerCraft.\n\n##\
    \ CHAPTER 6: COMPUTER NETWORK\n\nComputerCraft will actually allow you to create\
    \ more than one computer in a world and what is more, to connect the computers\
    \ together in a network. To accomplish this you just need to add a couple of computers\
    \ and attach wireless modems to the sides of them.\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_46_0.png)\n\
    \nFigure 6-1. A Computer Network in ComputerCraft\n\nIn this project (Figure 6-1),\
    \ there are two computers (one is hidden behind the screen in Figure 6-1), and\
    \ you can type messages on the terminal in one computer and the message will be\
    \ transmitted to the other computer where it will be displayed on the large screen\
    \ attached to it.\n\n### Setting Up the Sending Computer\n\nIn hardware terms,\
    \ you just need a Computer and a wireless modem. Remember which side of the computer\
    \ the wireless adapter is connected, as you will need to specify this in the program.\n\
    \nThe program for the sender is called \"sender\" and can be downloaded with the\
