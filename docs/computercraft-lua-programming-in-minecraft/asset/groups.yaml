    \ See Appendix A for more information on installing the program. Alternatively,\
    \ neither the sender nor the receiver is long, so they can easily be typed in.\n\
    \nHere is the full program for the sender.\n\n```lua\nwhile true do\n  term.clear()\n\
    \  term.setCursorPos(1, 1)\n  print(\"Please enter message to send:\")\n  message\
    \ = read()\n  rednet.open(\"right\")\n  rednet.broadcast(message)\n  rednet.close(\"\
    right\")\n  sleep(0.1)\nend\n```\n\nThe program loops forever, waiting for a message\
    \ to be entered. When a message is entered, then it opens a connection to the\
    \ wireless network using rednet.open. The side passed as a parameter (in this\
    \ case \"right\") needs to match the face of the computer to which the wireless\
    \ access point is attached.\n\nThe command rednet.broadcast sends the message\
    \ to all computers to which this computer is attached. Finally the connection\
    \ is closed using rednet.close.\n\n### Setting Up the Receiver\n\nThe receiver\
    \ setup is the same as the sender, with the addition of a monitor on which the\
    \ messages will be displayed.\n\nThe program for the receiver is still pretty\
    \ simple. See Appendix A for details of how to download and install it, or you\
    \ can enter it using the editor.\n\n```lua\nrednet.open(\"left\")\nwhile true\
    \ do\n  id, message = rednet.receive(1)\n  if message then\n    print(message)\n\
    \  end\nend\n```\n\nThe first thing that happens is that a connection is established\
    \ to the wireless access point to the left. There is then a loop that will only\
    \ quit if you CTRL-T the program. Inside this loop rednet.receive is called to\
    \ see if there is a message.\n\nYou will notice that there are two variables being\
    \ assigned to the result of calling `rednet.receive` (id and message). This is\
    \ because the function returns two values. The first value is the id of the computer\
    \ that sent the message (this will be a number) and the second value is a string\
    \ containing the message.\n\nThe if statement makes sure that a message was actually\
    \ received before printing it.\n\nWhen you start the receiving computer, remember\
    \ to run it on the monitor by starting it with the command:\n\n```\nmonitor right\
    \ receiver\n```\n\nIf your monitor is on some side of the computer other than\
    \ right, then change this in the command above.\n\n### Sending a Message\n\nStart\
    \ the receiver running as described above and then move over to the sending computer\
    \ and start the sender program running (Figure 6-2).\n\n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_48_0.png)\n\
    \nFigure 6-2. Sending a Message\n\nType in the message you want to send and hit\
    \ Enter. If all is well the message will appear over on the receiving computer's\
    \ monitor.\n\n### Summary\n\nThere is nothing to stop you building bigger networks\
    \ of computers and allowing them to send messages to each other. You could for\
    \ instance have one control computer that\n"
