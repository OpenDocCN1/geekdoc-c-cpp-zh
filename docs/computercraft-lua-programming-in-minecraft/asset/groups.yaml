  mdcn: "\nreturn 命令会退出函数，并将指定值返回——在此例中，即 'T'。\n\n### 列表\n\n变量只能保存单个值，但有时我们希望能够将一系列事物收集到一个列表中。你稍后将在摩尔斯电码示例中使用这个例子。Lua\
    \ 列表中的项可以是任何类型的值。它们可以是数字、字符串，甚至是另一个列表。\n\n下面的示例展示了如何定义一个颜色列表，然后一次一个地打印出来。\n\n\
    ```lua\ncolors = {'red', 'orange', 'yellow',\n          'green', 'blue',\n   \
