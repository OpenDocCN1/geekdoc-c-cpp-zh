  - "[PAGE 51]\n\n# Hardware\n\nYou can use the Redstone signal from the computer\
    \ any\nway you want, but in the arrangement shown above, the\nRedstone controls\
    \ a piston that reveals a Glowstone block\nwhen a Tweet is received (Figure 7-3).\n\
    \n![](img/7ea6f60bb53ecc17dd8979f66d5502d6_51_0.png)\n\nFigure 7-3. After a New\
    \ Tweet Arrives.\n\n# The Code\n\nFor this program to work, you must first enable\
    \ web access\nfrom ComputerCraft. To do this, you need to open up the\nfile \"\
    ComputerCraft.cfg\" in the folder \"minecraft/config\"\nusing an editor like TextPad\
    \ or NotePad and edit the\nfollowing code from:\n\n```\n```\nenableapi http {\n\
    \    Bgeneral=false\n}\n```\n```\n\nto:\n\n```\n```\nenableapi http {\n    Bgeneral=false\n\
    }\n```\n```\n\nand further down in the same text file from:\n\n```\n```\nBEnableAPI_http=false\n\
    ```\n```\n\nto:\n\n```\n```\nBEnableAPI_http=true\n```\n```\n\nOnce this is done,\
    \ save the file again and restart MineCraft.\n\nThe code uses the Twitter API\
    \ to fetch the latest tweet from\nthe twitter name specified, so you will probably\
    \ want to\nchange the first line to refer to your Twitter name.\n\n```\n```\n\
    name = \"Simonmonk2\"\n```\n```"
  - "[PAGE 52]\n\n```\n```lua\npage = \"http://api.twitter.com/1/statuses/\"\nuser_timeline.xml?screen_name=\"\
    \ .. name ..\n                     \"&count=1\"\nold_text = \"\"\n\nwhile true\
    \ do\n    tweet_page = http.get(page)\n    response = tweet_page.readAll()\n \
    \   tweet_page.close()\n    start_of_tag = string.find(response,\n           \
    \          \"<text>\")\n    end_of_tag = string.find(response,\n             \
    \        \"</text>\")\n\n    if (start_of_tag and end_of_tag) then\n        text\
    \ = string.sub(response,\n             start_of_tag + 6, end_of_tag - 1)\n   \
    \     if (text ~= old_text) then\n            print(text)\n            old_text\
    \ = text\n            rs.setOutput(\"bottom\", true)\n            sleep(3)\n \
    \           rs.setOutput(\"bottom\", false)\n            sleep(3)\n        end\n\
    \    end\n    sleep(20)\nend\n```\n```\n\nThe Twitter API returns XML containing\
    \ the message. The actual message itself will be in a <text> tag so the code finds\
    \ the position of <text> and </text> and chops out the text in the middle.\n\n\
    The main loop continues forever, but a sleep of 20 seconds ensures that Twitter\
