    \n```\n~~~\nedit functiontest\n~~~\n```\n\nThen type the following into the editor\
    \ before saving the file.\n\n```\n~~~lua\nfunction printWelcome()\n  print(\"\
    This program is written\")\n  print(\"in the programming language Lua\")\n  print(\"\
    Lua comes from Brazil\")\nend\n\nprintWelcome()\nprintWelcome()\nprintWelcome()\n\
    ~~~\n```\n\nSave the program and exit the editor, then try running it by typing:\n\
    \n```\n~~~\nfunctiontest\n~~~\n```\n\nYou should see the whole message printed\
    \ out three times.\n\nWe can use a \"for\" loop rather than call the function\
    \ three times, one after the other. Change the code to agree with the listing\
    \ below and then run it again. The message will be printed out 10 times.\n\n```\n\
    ~~~lua\nfunction printWelcome()\n  print(\"This program is written\")\n  print(\"\
    in the programming language Lua\")\n  print(\"Lua comes from Brazil\")\nend\n\n\
    for i = 1, 10 do\n  printWelcome()\nend\n~~~\n```"
  - "[PAGE 31]\n\nFunctions can also be supplied with something called parameters.\
    \ So, if for example, we wanted to write a function that would count up to a number\
    \ of our choosing, we could write something like this:\n\n```\n~~~\nfunction count(numberOfTimes)\n\
    \  for i = 1, numberOfTimes do\n    printWelcome()\n  end\nend\n~~~\n```\n\nYou\
    \ could then instruct it to count up to 10 using:\n\n```\n~~~\ncount(10)\n~~~\n\
    ```\n\nTo make it count to 1000, you would just do:\n\n```\n~~~\ncount(1000)\n\
    ~~~\n```\n\nIf you want a function to have more than one parameter, you just separate\
