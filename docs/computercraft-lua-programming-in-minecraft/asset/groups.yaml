    if password == \"computercraft\" then\n    print(\"Opening Door\")\nelse\n   \
    \ print(\"Wrong Password\")\nend\n```\n\n# Loops\n\nIf you want to do something\
    \ more than once then you need to put the commands that you want to repeat inside\
