    ## 5.3 节简单线性回归


    ### 描述


    简单线性回归允许通过一个变量预测另一个变量。


    ### 假设


    简单线性回归假设两个变量都是间隔尺度或比例尺度。此外，因变量应围绕预测线呈正态分布。当然，这假设变量之间存在线性关系。通常，两个变量都应该呈正态分布。二分类变量（只有两个水平的变量）也可以作为自变量。


    ### SPSS 数据格式


    SPSS 数据文件中需要两个变量。每个受试者必须为这两个值提供数据。


    ### 执行命令


    ![](img/fig00103.jpg)


    回到 `HEIGHT.sav` 数据文件，点击 `Analyze`（分析），然后 `Regression`（回归），最后 `Linear`（线性）。这将弹出所示的
    `Linear Regression`（线性回归）主对话框。对话框左侧是数据文件中变量列表。右侧是因变量块（我们尝试预测的变量）和自变量块（我们用于预测的变量）。


    ![](img/fig00104.jpg)


    我们感兴趣的是根据身高预测某人的体重。因此，我们应该将 `WEIGHT` 变量放在因变量块中，将 `HEIGHT` 变量放在自变量块中。然后，我们可以点击
    `OK` 运行。


    ### 读取输出


    对于简单线性回归，我们关注输出的三个部分。第一部分称为 `Model Summary`（模型摘要），它出现在 `Variables Entered/Removed`（进入/移除的变量）部分之后。对于我们的示例，你应该看到此输出。`R
    Square`（称为判定系数）告诉你因变量（`WEIGHT`）的方差中可以由自变量（`HEIGHT`）的变化所解释的比例。因此，体重变化的 64.9% 可以由身高差异解释（越高越重）。


    ![](img/fig00105.jpg)


    估计标准差（Standard error of estimate）提供了预测方程的离散程度衡量。当使用预测方程时，68% 的数据将落在一个标准误差（预测）值范围内。略高于
    95% 的数据将落在两个标准误差范围内。因此，在之前的示例中，95% 的情况下，我们的估计体重会在正确值的正 32.296 磅范围内（即 `2 × 16.148
    = 32.296`）。


    ![](img/fig00106.jpg)


    我们感兴趣的输出第二部分是上所示的 `ANOVA` 摘要表。这里最重要的数字是右侧列的显著性水平。如果该值小于 .05，则我们具有显著的线性回归。如果它大于
    .05，则没有。关于读取 ANOVA 表的更多信息，请参考第 7 章中的 ANOVA 部分。


    输出的最后部分是系数表。这是可以找到实际预测方程的地方。


    ![](img/fig00107.jpg)


    在大多数教材中，你学到 `Y'' = a + bX` 是回归方程。`Y''`（读作 Y prime）是你的因变量（撇通常表示预测值或因变量），而 `X` 是你的自变量。在
    SPSS 输出中，`a` 和 `b` 的值都在 `B` 列中。第一个值 –234.681 是 `a` 的值（标记为 `Constant`）。第二个值 5.434
    是 `b` 的值（标记为自变量的名称）。因此，我们上述示例的预测方程为 `WEIGHT'' = –234.681 + 5.434(HEIGHT)`。换句话说，比另一个受试者高一英寸的平均受试者重了
    5.434 磅。身高 60 英寸的人体重应该为 `-234.681 + 5.434(60) = 91.359` 磅。考虑到我们之前对估计标准误差的讨论，95%
    身高 60 英寸的人体重将在 91.359 负 32.296 磅之间。


    ## 得出结论


    回归分析的结论表明：(a) 是否获得了显著的预测，(b) 关系的方向，以及 (c) 方程本身。


    ### 显著结果的表述


    在 XX 示例中，我们得到了 .649 的 `R Square` 和回归方程 `WEIGHT'' = –234.681 + 5.434(HEIGHT)`。ANOVA
    结果为 `F(1,14) = 25.926`，`p < .001`。因此，我们可以在结果部分这样描述：


    计算了简单线性回归根据身高预测参与者的体重。发现了一个显著的回归方程（`F (1,14) = 25.926`，`p < .001`），`R2` 为 .649。身高每增加一英寸，参与者的平均体重增加
    5.43 磅。


    ### 不显著结果的表述


    如果 ANOVA 不显著（例如下所示），输出中标记为 ANOVA 的 `Sig.` 部分大于 .05，回归方程不显著。结果部分可能包含：


    计算简单线性回归根据身高预测参与者的 ACT 分数。回归方程不显著（`F (1,14) = 4.12`，`p > .05`），`R2` 为 .227。身高不是
    ACT 分数的显著预测因子。

