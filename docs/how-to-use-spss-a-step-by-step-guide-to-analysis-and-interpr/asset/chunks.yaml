    ## 第 8.5 节 Kruskal-Wallis H 检验


    ### 描述

    Kruskal-Wallis H 检验是单方差分析（one-way ANOVA）的非参数替代方法。它检验多个独立样本是否来自同一总体。


    ### 假设

    由于该检验是非参数性的，因此假设非常少。然而，该检验假设因变量为序测量水平。自变量应该是名义或序量的。


    ### SPSS 数据格式

    SPSS 需要一个变量代表因变量，另一个变量代表自变量的水平。即使因变量实际上是序量的，也必须作为比例变量（scale-type variable）输入。


    ### 执行命令

    ![](img/fig00218.jpg)


