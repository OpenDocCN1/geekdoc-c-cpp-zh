    Create a data file for the six variables and two sample students presented in
    Example 1.2.1\. Name your variables: ID, DAY, TIME, MORNING, GRADE, and WORK.
    You should code DAY as 1 = Mon/Wed/Fri, 2 = Tues/Thurs. Code TIME as 1 = morning,
    2 = afternoon. Code MORNING as 0 = No, 1 = Yes. Code WORK as 0 = No, 1 = Part-time,
    2 = Full-time. Be sure you enter value labels for the different variables. Note
    that because value labels are not appropriate for ID and GRADE (because the values
    themselves serve as labels), these are not coded. When complete, your Variable
    View window should look like the screenshot below.


    ![](Images/fig00011.jpg)


    Click on the Data View tab to open the data-entry screen. Enter data horizontally,
    beginning with the first student’s ID number. Enter the code for each variable
    in the appropriate column. To enter the GRADE variable value, enter the student’s
    class grade.


    ![](Images/fig00012.jpg)


    The previous data window can be changed to look like the screenshot below by clicking
    on the Value Labels icon (see below). In this case, the cells display value labels
    rather than the corresponding codes. If data are entered in this mode, it is not
    necessary to enter codes, as clicking the button that appears in each cell as
    the cell is selected will present a drop-down list of the predefined labels. You
    may use whichever method you prefer.


    ![](Images/fig00013.jpg)![](Images/fig00014.jpg)


    Instead of clicking the Value Labels icon, you may toggle between views by clicking
    Value Labels under the View menu.


    ![](Images/fig00015.jpg)


    ## Section 1.4 Loading and Saving Data Files


    ![](Images/fig00016.jpg)


    Once you have entered your data, you will need to save it with a unique name so
    that you can retrieve it when necessary for later use.


    Loading and saving SPSS data files works in the same way as most Windows-based
    software. Under the File menu, there are Open, Save, and Save As commands. SPSS
    data files have a “.sav” extension, which is added by default to the end of the
    filename (that is, do not type “.sav” after the filename; SPSS will add it automatically).
    This tells Windows that the file is an SPSS data file. Other SPSS extensions include
    “.spv” for saved output files and “.sps” for saved syntax files.


    ### Save Your Data


    ![](Images/fig00017.jpg)


    When you save your data file (by clicking File, then clicking Save or Save As
    to specify a unique name), pay special attention to where you save it. You will
    probably want to save your data on a removable USB drive so that you can take
    the file with you.


    ### Load Your Data


    ![](Images/fig00018.jpg)


    When you load your data (by clicking File, then clicking Open, then Data, or by
    clicking the open file folder icon), you get a similar window. This window lists
    all files with the “.sav” extension. If you have trouble locating your saved file,
    make sure you are looking in the right directory.


    ### Practice Exercise


    To be sure that you have mastered saving and opening data files, name your sample
    data file “SAMPLE” and save it to a removable storage medium. Once it is saved,
    SPSS will display the name of the file at the top of the data window. In the screenshot
    here the file is called “DataSet2”.


    ![](Images/fig00019.jpg)


    It is wise to save your work frequently, in case of computer crashes. Note that
    filenames may be uppercase or lowercase. In this text, uppercase is used for clarity.
    In naming files, though, screenshots may show lowercase only.


    After you have saved your data, exit SPSS (by clicking File, then Exit). Restart
    SPSS and load your data by selecting the “SAMPLE.sav” file you just created.


    ## Section 1.5 Running Your First Analysis


    Any time you open a data window, you can run any of the analyses available. To
    get started, we will calculate the students’ average grade. (With only two students,
    you can easily check your answer by hand, but imagine a data file with 10,000
    student records.)


    The majority of the available statistical tests are under the Analyze menu. This
    menu displays all the options available for your version of the SPSS program (the
    menus in this book were created with SPSS Statistics Version 23.0 and 24.0). Other
    versions may have slightly different sets of options.


    ![](Images/fig00020.jpg)


    To calculate a mean (average), we are asking the computer to summarize our dataset.
    Therefore, we run the command by clicking Analyze, then Descriptive Statistics,
    then Descriptives.


