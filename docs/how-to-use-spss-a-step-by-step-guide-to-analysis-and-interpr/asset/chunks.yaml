    ## 第 3.3  单组集中趋势量和离散程度


    ### 描述


    集中趋势量是代表样本或总体典型成员的值。三种主要的测量类型是 `mean`（平均值）、`median`（中位数）和 `mode`（众数）。离散程度告诉你分数的变异性。主要类型是
    `range`（极差）和 `standard deviation`（标准差）。集中趋势量和离散程度结合在一起为整个数据集提供了大量信息。


    ![](img/fig00055.jpg)


    我们将在 `Descriptives` 命令的下讨论这些集中趋势量和离散程度。注意，这些许多统计数据也可以通过其他几个命令计算（例如，需要 `Frequencies`
    或 `Compare Means` 命令来计算众数或中位数——在上方显示了 `Frequencies` 命令的 `Statistics` 选项）。


    ### 假设


    每个集中趋势量和离散程度都有与其相关的假设。`mean` 是最强大的集中趋势量，它的假设最多。例如，为了计算 `mean`，数据必须在间隔尺度或比例尺度上进行测量。此外，分布应该是正态分布，或者至少不是高度偏态。`median`
    要求至少是定序数据。由于 `median` 仅指示中间分数（当分数按顺序排列时），因此对分布的形状没有假设。`mode` 是最弱的集中趋势量。`mode`
    没有假设。


    `standard deviation` 是最强大的离散程度量，但它也有几项要求。它是 `variance`（方差）的数学转换（标准差是方差的平方根）。因此，如果一个适用，另一个也适用。`standard
    deviation` 要求数据在间隔尺度或比例尺度上进行测量。此外，分布应该是正态的。`range` 是最弱的离散程度量。要计算 `range`，变量必须至少是定序。对于定名尺度数据，应将整个频率分布作为离散程度的度量呈现。


    ### 得结论


    集中趋势量应伴随离散程度量。因此，在报告 `mean` 时也应提供 `standard deviation`。呈现 `range` 使用 `Frequencies`
    命令来确定。


    ### SPSS 数据格式


    只需要一个变量。


    ### 执行命令


    `Descriptives` 命令是你最可能用于获取集中趋势和离散程度的命令。此示例使用了我们在之前的章节中使用的文件。


    要运行该命令，点击 `Analyze`，然后点击 `Descriptive Statistics`，最后点击 `Descriptives`。这将弹出 `Descriptives`
    主对话框。任何你想获取信息的变量都可以放在右侧。将变量 `GRADE` 到右侧。


    ![](img/fig00056.jpg)


    默认情况下，你将获得 `N`（个数/参与者人数）、`minimum`、`maximum`、`mean` 和 `standard deviation`。注意，这些中的某些可能不适用于你选择的数据类型。


    如果你想更改提供的统计数据，点击主对话框中的 `Options`。你将看到所示的 `Options` 框。点击 `Continue` 或 `Cancel`
    关闭 `Options` 框。然后点击 `OK`。


    ![](img/fig00057.jpg)


    ### 读取输出


    `Descriptives` 命令的输出非常直观。每种请求输出用列，每个变量用一行。下方显示的输出是样本文件。它显示我们有一个变量（`GRADE`），并且获得了
    `N`、`minimum`、`maximum`、`mean` 和 `standard deviation`。


    ![](img/fig00058.jpg)


