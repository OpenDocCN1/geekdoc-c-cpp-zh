    这会弹出描述统计（Descriptives）对话框。请注意，对话框的左侧包含我们数据文件中所有变量的列表。右侧是一个标记为`Variable(s)`的区域，我们可以在这里指定想要在此特定分析中使用的变量。


    ![](img/fig00022.jpg)


    我们想要计算变量`GRADE`的平均值。因此，我们需要在左侧窗口中选择该变量名（点击它）。要将其转移到右侧窗口，点击两个窗口之间的右箭头。箭头始终指向高亮项目相反的窗口，并可用于双向传输选定的变量。请注意，双击变量名也会将变量传输到相反的窗口。也可以使用
    Windows 标准惯例，通过“Shift”点击或“Ctrl”点击来选择多个变量。注意：SPSS 的某些配置显示变量名，而另一些显示变量标签（如果有的话）。这可以在
    `Edit`（编辑）→ `Options`（选项）→ `General`（常规）下进行更改。


    当我们点击 `OK` 按钮时，分析将开始，我们就可以查看输出结果了。


    ## 第 1.6 节查看和打印输出文件


    分析完成后，输出将放置在输出窗口中，且输出窗口将变为活动窗口。如果这是你自启动 SPSS 以来进行的首次分析，将创建一个新的输出窗口。如果你已经运行过之前的分析并保存了它们，你的输出将添加到你之前的输出的末尾。


    要在数据窗口和输出窗口之间来回，请从 `Window`（窗口）菜单栏选择所需的窗口。或者，你也可以使用屏幕底部的任务栏选择窗口。


    ![](img/fig00023.jpg)


    输出窗口分为两个部分。左侧部分是输出大纲（SPSS 将其称为大纲视图 outline view）。右侧部分是输出本身。


    ![](img/fig00024.jpg)


    输出窗口左侧的部分提供了整个输出窗口的大纲。所有的分析都按照它们执行的顺序列出。请注意，可以使用此大纲来快速定位输出的某个部分。只需点击你想查看的部分，右侧窗口就会跳转到相应的位置。


    点击统计程序也会选择该命令的所有输出。通过按 `Delete` 键，可以从输出窗口中删除该输出。这是确保输出窗口仅包含所需输出的快速方法。也可以通过点击 `Edit`（编辑），然后
    `Copy`（复制）来选择输出并粘贴到文字处理器或电子表格中。然后你可以切换到文字处理器并点击 `Edit`（编辑），然后 `Paste`（粘贴）。


    要打印输出，只需点击 `File`（文件），然后 `Print`（打印），或点击工具栏上的打印图标。你可以选择打印所有输出或仅打印当前选中的部分。打印时要小心！每次运行命令时，输出都会添加到你之前的输出的末尾。因此，你可能会打印出一个包含你可能不需要或不需要信息的巨大输出文件。


    确保输出窗口仅包含当前命令结果的一种方法是在运行命令之前创建一个新的输出窗口。执行此操作，点击 `File`（文件），然后 `New`（新建），然后 `Output`（输出）。你后续所有的命令都将进入你的新输出窗口。


    你还可以将输出文件保存为 SPSS 格式文件（`.spv` 扩展名）。注意 SPSS 会保存你打开的任何窗口。如果你处于数据窗口，它将保存数据。如果你处于输出窗口，它将保存输出。


    ### 练习题


    加载你之前创建的样本数据文件（`SAMPLE.sav`）。对变量 `GRADE` 运行 `Descriptives`（描述统计）命令并打印输出。接下来，选择数据窗口并打印。


    ## 第 1.7 节修改数据文件


    一旦创建了数据文件，添加额外的案例（行/参与者）或额外的变量（列）其实非常简单。考虑示例 1.7.1。


    ### 示例 1.7.1


    另外两个学生为你提供了调查问卷。他们的信息如下：


    | 问卷副本 3 |  |  |  |  |

    | :--- | :--- | :--- | :--- | :--- |

    | ID: | 8734 |  |  |  |

    | 上课日期: | ___ | MWF | X | TTh |

    | 上课时间: | X | 上午 |  | 下午 |

    | 你是晨起者吗？ | ___ | 是 | X | 否 |

    | 末成绩： | 80% |  |  |  |

    | 你在外工作吗？ | ___ | 全职 | ___ | 兼职 |

    |  | X | 否 |  |  |


    | 问卷副本 4 |  |  |  |  |

    | :--- | :--- | :--- | :--- | :--- |

    | ID: | 1909 |  |  |  |

    | 上课日期: | X | MWF | ___ | TTh |

    | 上课时间: | X | 上午 | ___ | 下午 |

    | 你是晨起者吗？ | X | 是 | ___ | 否 |

    | 期末成绩： | 73% |  |  |  |

    | 你在外工作吗？ | ___ | 全职 | X | 兼职 |

    |  | ___ | 否 |  |  |


    ![](img/fig00025.jpg)


    要添加这些数据，只需在 `Data View`（数据视图）窗口中放置两个额外的行（在加载数据后）。当添加新的参与者时，行号会加粗。完成后，屏幕应如上所示。


    也可以添加新变量。例如，如果两个参与者接受了时间管理培训，而其他没有，可以修改数据反映这一点。新变量可以命名为 `TRAINING`，编码为 `0` = 否，`1`
    = 是。要执行此操作，切换到 `Variable View`（变量视图），然后在底部添加 `TRAINING`。然后切换回 `Data View`（数据视图）更新数据。


    ![](img/fig00026.jpg)


    添加数据和变量是我们创建数据的程序的逻辑扩展。我们将在书中再次使用它。


    ### 练习题


    遵循之前的示例（其中 `TRAINING` 为新变量）。修改并保存数据文件。


    ## 注意


    1. 附录 E 中的项目以粗体表示。斜体用于指示菜单。

    2. 根据你的 SPSS 版本，它可能会显示为 2.0E + 009。

