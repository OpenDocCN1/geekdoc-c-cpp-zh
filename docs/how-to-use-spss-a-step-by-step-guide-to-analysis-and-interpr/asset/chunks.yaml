    ## Section 6.4 Paired-Samples t Test


    ### Description

    The paired-samples t test (also called a dependent t test) compares the means
    of two scores from related samples. For instance, comparing a pretest and a posttest
    score for a group of participants would require a paired-samples t test.


    ### Assumptions

    The paired-samples t test assumes that both variables are at the interval or ratio
    levels and are normally distributed. The two variables should also be measured
    with the same scale.


    ### SPSS Data Format

    Two variables in the SPSS data file are required. these variables should represent
    two measurements from each participant.


    ### Running the Command

    We will create a new data file containing five variables: `PRETEST`, `MIDTERM`,
    `FINAL`, `INSTRUCT`, and `REQUIRED`. `INSTRUCT` represents three different instructors
    for a course `REQUIRED` represents whether the course was required or was an elective
    (0 = elective, 1 = required). The other three variables represent exam scores
    (100 being the highest score possible).


    | PRETEST | MIDTERM | FINAL | INSTRUCT | REQUIRED |

    | --- | --- | --- | --- | --- |

    | | * * | | | |

    | 56 | 64 | 69 | 1 | 0 |

    | 79 | 91 | 89 | 1 | 0 |

    | 68 | 77 | 81 | 1 | 0 |

    | 59 | 69 | 71 | 1 | 1 |

    | 64 | 77 | 75 | 1 | 1 |

    | 74 | 88 | 86 | 1 | 1 |

    | 73 | 85 | 86 | 1 | 1 |

    | 47 | 64 | 69 | 2 | 0 |

    | 78 | 98 | 100 | 2 | 0 |

    | 61 | 77 | 85 | 2 | 0 |

    | 68 | 86 | 93 | 2 | 1 |

    | 64 | 77 | 87 | 2 | 1 |

    | 53 | 67 | 76 | 2 | 1 |

    | 71 | 85 | 95 | 2 | 1 |

    | 61 | 79 | 97 | 3 | 0 |

    | 57 | 77 | 89 | 3 | 0 |

    | 49 | 65 | 83 | 3 | 0 |

    | 71 | 93 | 100 | 3 | 1 |

    | 61 | 83 | 94 | 3 | 1 |

    | 58 | 75 | 92 | 3 | 1 |

    | 58 | 74 | 92 | 3 | 1 |


    Enter the data and save them as `GRADES.sav`. You can check your data entry by
    computing a mean for each instructor using the `Means` command. (See [Chapter
    3](#Ch03.xhtml_ht0042) for more information.) Use `INSTRUCT` as the independent
    variable, and enter `PRETEST`, `MIDTERM`, and `FINAL` as your dependent variables.


    ![](Images/fig00139.jpg)


    Once you have entered the data, conduct a paired-samples t test comparing pretest
    scores and final scores.


    ![](Images/fig00140.jpg)


    Click Analyze, then Compare Means, then Paired-Samples T Test. This will bring
    up the main dialog box.


    ![](Images/fig00141.jpg)Images/fig00142.jpg)


    You must select pairs of variables to Compare. Click on `PRETEST`, then click
    on the ![](Images/fig00143.jpg) button. Click on `FINAL`, then click on the ![](Images/fig00144.jpg)
    button. (Alternatively, you can double-click or control-click them.) The variables
    will be moved into the Paired Variables area. Click OK to conduct the test.


    ### Reading the Output

    The output for the paired-samples t test consists of three components. The first
    part gives you basic descriptive statistics for the pair of variables. The `PRETEST`
    average was 63.3, with a standard deviation of 8.93. The `FINAL` average was 86.14,
    with a standard deviation of 9.63.


    ![](Images/fig00145.jpg)Images/fig00146.jpg)


    The second part of the output is a Pearson correlation coefficient for the pair
    of variables.


    Within the third part of the output (labeled Paired Samples Test), the section
    called Paired Differences contains information about the differences between the
    two variables. You may have learned in your statistics class that the paired-samples
    t test is essentially a single-sample t test calculated on the differences between
    the scores. The final three columns contain the value of `t`, the degrees of freedom,
    and the significance level. In the example presented here, we obtained `t` = -11.64,
    `df` = 20, and `p` < .001.


    ### Drawing Conclusions

    Paired-samples t tests determine whether or not means are different. Significant
    values indicate that the samples come from populations.


    ### Phrasing Results That Are Significant

    When stating the results of a paired-samples t test, you should give the `t`,
    the degrees of freedom, and the significance level. Our example above was significant,
    so we could state:


    A paired-samples t test was calculated to compare pretest and final scores. The
    mean on `PRETEST` was 63.3 (sd = 8.93), and the mean on `FINAL` was 86.14 (sd
    = 9.63). A significant increase was found (`t`20 = -11.64, `p` < .001).


    ### Phrasing Results That Are Not

    If the significance level had been greater than .05 (or greater than .10, if you
    were conducting a one-tailed test), the result would not have been significant.
    For this output, we could state:


    ![](Images/fig00148.jpg)Images/fig00149.jpg)Images/fig00150.jpg)


    A paired-samples t test was calculated to compare midterm and final scores. The
    mean on `MIDTERM` was 78.71 (sd = 9.95), and the mean on `FINAL` was 79.57 (sd
    = 9.96). No significant difference was found (`t`6 = -.764, `p` > .05).


    ### Practice Exercise

    Use the same `GRADES.sav` data file, and compute a paired-samples t test to determine
    if scores increased from midterm to final.


    # Chapter 7 ANOVA


    Analysis of variance (ANOVA) is a procedure that determines the proportion of
    variability attributed to each of several components. It is one of the most useful
    and adaptable statistical techniques available.


    In general ANOVA procedures in SPSS produce what is called a Source Table in which
    each row represents a source of variability and the columns represent what we
    know about the variability attributable to each source. In the simplest case total
    variability is split into that attributable to differences between the groups
    and the variability attributable to within the groups.


    Normally there is a column called `SS` (Sum of Squares), one for `df` (Degrees
    of Freedom), one for `MS` (Mean Squares), and then `F` – which is the actual answer.


    ## Section 7.2 One-Way ANOVA


    ### Description

    The one-way ANOVA compares the means of two or more groups of participants that
    vary on a single independent variable (thus, the one-way designation). When we
    have three groups, we could use a t test to determine differences between the
    groups, but we would have to conduct three t tests (Group 1 compared to Group
    2, Group 1 compared to Group 3, and Group 2 compared to Group 3). When we conduct
    multiple t tests, we inflate the Type I error rate and increase our chance of
    drawing an inappropriate conclusion. ANOVA compensates for these multiple comparisons
    and gives us a single answer that tells us if any of the groups is different from
    any of the other groups.


