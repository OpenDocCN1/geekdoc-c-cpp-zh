    # 第 7 章 方差分析


    方差分析（ANOVA）是一种确定若干成分引起变异比例的程序。它是最实用且灵活的统计技术之一。


    通常，SPSS 中的 ANOVA 程序会产生一个“源表”，其中每行代表一个变异来源，列代表我们关于属于每个来源变异的信息。在最简单的情况下，总变异被分为组间差异和组内变异。


    通常会有一列名为 `SS`（平方和）、一列 `df`（自由度）、一列 `MS`（均方），然后是 `F` —— 这是实际的答案。


    ## 7.2 节 单向 ANOVA


    ### 描述

    单向 ANOVA 比较在单个自变量上变化的两个或多个组参与者的均值（因此被称为“单向”）。当我们有三组时，可以使用 t 检验来确定组间的差异，但我们必须进行三次
    t 检验（组 1 与组 2 比较，组 1 与组 3 比较，以及组 2 与组 3 比较）。当我们进行多次 t 检验时，会膨胀 I 类错误率并增加我们得出错误结论的概率。ANOVA
    补偿了这些多次比较，并提供一个单一答案，告诉我们是否任何组与其他任何其他组不同。


    ### 假设


    '
- fmt: '

    The one-way ANOVA requires a single dependent variable and a single independent
    variable. Which group participants belong to is determined by the value of the
    independent variable. Groups should be independent of each other. If our participants
    belong to more than one group each, we will have to conduct a repeated-measures
    ANOVA. If we have more than one independent variable, we should conduct a factorial
    ANOVA.


    ANOVA also assumes that the dependent variable is at the interval or ratio level
    and is normally distributed, and that the variances of the dependent variable
    for each level of the independent variable are equal.


    ### SPSS Data Format


    Two variables are required in the SPSS data file. One variable serves as the dependent
    variable and the other as the independent variable. Each participant should provide
    only one score for the dependent variable.


    ### Running the Command


    For this example, we will use the `GRADES.sav` data file we created in the previous
    section.


    ![](Images/fig00151.jpg)


    For you to conduct a one-way ANOVA, click `Analyze`, then `Compare Means`, then
    `One-Way ANOVA`. This will bring up the main dialog box for the `One-Way ANOVA`
    command.


    ![](Images/fig00152.jpg)


    You should place the independent variable in the `Factor` box. For our example,
    `INSTRUCT` represents three different instructors, and it will be used as our
    independent variable. Our dependent variable will be `FINAL`. This test will allow
    us to determine if the instructor has any effect on final grades in the course.


    ![](Images/fig00153.jpg)


    Click on `Options` to get the Options dialog box shown above. Click `Descriptive`.
    This will give you means for the dependent variable at each level of the independent
    variable. Checking this box prevents us from having to run a separate `Means`
    command. Click `Continue` to return to the main dialog box.


    ![](Images/fig00154.jpg)


    Next, click `Post Hoc` to bring up the Post-hoc Multiple Comparisons dialog box
    shown above. Click `Tukey`, then `Continue`.


    Post-hoc tests are necessary in the event of a significant ANOVA. The ANOVA only
    indicates if any group is different from any other group. If it is significant,
    we need to determine which groups are different from which other groups. We could
    do `t tests` to determine that, but we would have the same problem as mentioned
    before with inflating the Type I error rate.


    There are several post-hoc comparisons that correct for multiple comparisons.
    The most widely used is `Tukey’s HSD`. SPSS will calculate a variety of post-hoc
    tests for you. Consult an advanced statistics text for a discussion of the differences
    between these various tests.


    ### Reading the Output


    Descriptive statistics will be given for each instructor (i.e., level of the independent
    variable) and the total. For instance, in his or her class, Instructor 1 had an
    average final exam score of 79.57.


    ![](Images/fig00155.jpg)


    The next section of the output is the ANOVA source table. This is where the various
    components of the variance have been listed, along with their relative sizes.
    For a one-way ANOVA, there are two components to the variance: `Between Groups`
    (which represents the differences due to our independent variable) and `Within
    Groups` (which represents differences within each level of our independent variable).
    For our example, the `Between Groups` variance represents differences due to different
    instructors. The `Within Groups` variance represents individual differences among
    students.


    ![](Images/fig00156.jpg)


    The primary answer is `F`. `F` is a ratio of explained variance to unexplained
    variance. Consult a statistics text for more information on how it is determined.
    The `F` has two different degrees of freedom, one for `Between Groups` (in this
    case, `2` is the number of levels of our independent variable `<3–1>`), and another
    for `Within Groups` (`18` is the number of participants minus the number of levels
    of our independent variable `<21–3>`).


    The next part of the output consists of the results of our `Tukey’s HSD` post-hoc
    comparison.


    ![](Images/fig00157.jpg)


    This table presents us with every possible combination of levels of our independent
    variable. The first row represents Instructor 1 compared to Instructor 2. Next
    is Instructor 1 compared to Instructor 3. Next is Instructor 2 compared to Instructor
    1. (Note that this is redundant with the first row.) Next is Instructor 2 compared
    to Instructor 3, and so on.


    The column labeled `Sig.` represents the Type I error (`p`) rate for the simple
    (2-level) comparison in that row. In our example above, Instructor 1 is significantly
    different from Instructor 3, but Instructor 1 is not significantly different from
    Instructor 2, and Instructor 2 is not significantly different from Instructor
    3.


    ### Drawing Conclusions


    Drawing conclusions for ANOVA requires that we indicate the value of `F`, the
    degrees of freedom, and the significance level. A significant ANOVA should be
    followed by the results of a post-hoc analysis and a verbal statement of the results.


    ### Phrasing Results That Are Significant


    In the preceding example, we could state the following:


    We computed a one-way ANOVA comparing the final exam scores of participants who
    took a course from one of three different instructors. A significant difference
    was found among the instructors (`F (2,18) = 4.08, p < .05`). `Tukey’s HSD` was
    used to determine the nature of the differences between the instructors. This
    analysis revealed that students who had Instructor 1 scored lower (`M = 79.57,
    sd = 7.96`) than students who had Instructor 3 (`M = 92.43, sd = 5.50`). Students
    who had Instructor 2 (`M = 86.43, sd = 10.92`) were not significantly different
    from either of the other two groups.


    ### Phrasing Results That Are Not Significant


    If we had conducted the analysis using `PRETEST` instead of `FINAL`, we would
    have received the following output:


    ![](Images/fig00158.jpg)Images/fig00159.jpg)


    The ANOVA was not significant, so there is no need to refer to the Multiple Comparisons
    table. Given this result, we may state the:


    The pretest means of students from the three classes did not differ significantly
    at the start of the term (`F (2,18) = 1.60, p > .05`). Students who had Instructor
    1 had a mean score of 67.57 (`sd = 8.38`). Students who had Instructor 2 had a
    mean score of 63.14 (`sd = 10.61`). Students who had Instructor 3 had a mean score
    of 59.29 (`sd = 6.55`).


    ### Practice Exercise


    Using Practice Dataset 1 in `Appendix B`, determine if the average math scores
    of single, married, and divorced participants are significantly different. Write
    a statement of results.

