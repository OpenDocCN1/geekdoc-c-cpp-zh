    ACT 分数可能不适用于预期用途。


    ### 假设


    皮尔逊相关系数的所有假设也适用于准则效度的测量（等距或比例量表、正态分布等）。


    ### SPSS 数据格式


    需要两个变量。一个变量代表你正在测试的量表总分；另一个变量代表你对其进行测试的准则。


    ### 执行命令


    计算准则效度涉及确定量表与准则之间的皮尔逊相关值。完整信息请参阅 第 5 章，第 5.1 节。


    ### 读取输出


    两个分数之间的相关性即为准则效度系数。它应该是正数。接近 1.00 的值表示高效度，接近 0.00 的值表示低效度。


    ## 第 9.5 节 评分者信度


    ### 描述


    测量评分者信度的方法有很多种。如果你有等距或比例量表，可以简单地使用两个评分者分数之间的相关性（如果你有定名量表，甚至是斯皮尔曼 rho）。然而，定名量表的一种常用测量方法是
    Cohen''s Kappa。


    ### 假设


    Cohen''s Kappa 在类别数量有限的定名量表上效果最好。


    ### SPSS 数据格式


    需要两个变量。一个变量代表一个人的评分，第二个变量代表另一个评分者的评分。例如，你可以使用此处显示的数据创建一个数据文件。


    ![](img/fig00242.jpg)


    ### 执行命令


    计算评分者信度涉及 `crosstabs` 命令。更多信息请参阅 第 3 章，第 3.2 节。将一个评分者的分数作为列，将另一个评分者的分数作为行。


    ![](img/fig00243.jpg)


    运行 `crosstabs` 时，选择 Statistics（统计）选项，然后选择 Kappa。


    ![](img/fig00244.jpg)


    ### 读取输出


    评分者信度在输出底部以 Kappa 表示。在本例中，kappa 等于 .651。虽然对 Kappa 的解释存在一些争议，但 Landis 和 Koch (1977)
    建议值 < .2 为轻微，.2-.4 为一般，.4-.6 为中等，.5-.8 为强，> .8 为几乎完美。[¹]](#Ch09.xhtml_fn0004)


    ![](img/fig00245.jpg)


    ## Note


    1. Landis, J.R., & Koch, G.G. (1977). The measurement of observer agreement for
    categorical data. Biometrics, 33, 159–174.


    # 附录 A 效应量 (#contents.xhtml_bck_ht0344)


    许多学科越来越强调报告效应量。统计假设检验提供了一种判断差异是否为真实的方法，而效应量提供了一种判断这些差异相对重要性的方法。也就是说，它们告诉我们差异或关系的大小。如果你想估计所需的样本量、进行功效效能分析或进行元萃分析，效应量也至关重要。许多专业组织（例如美国心理学会）现在要求或强烈建议在报告假设检验结果的同时也报告效应量。


    由于至少有 41 种不同类型的效应量，^(1)，每种属性都各不相同，本附录的目的不是提供关于效应量的全面资源，而是向你展示如何使用 SPSS 计算一些常用的效应量测量指标。


    ## Cohen''s d


    效应量最简单且常用的测量方法之一是 Cohen''s d。Cohen''s d 属于标准化均值差的一类测量。本质上，`d` 是两个均值之差除以总体标准差。


    它不仅是一种常用的效应量测量方法，Cohen 还建议了一个简单的标准来解释获得的值。Cohen^(2) 建议效应量为 .2 为小，.5 为中等，.8 为大。


    我们将讨论将 Cohen''s d 作为 t 检验的首选效应量测量方法。遗憾的是，SPSS 不计算 Cohen''s d。然而，本附录将涵盖如何从输出中计算它。


    ### 单样本 t 检验的效应量


    虽然 SPSS 不计算单样本 t 检验的效应量，但我们可以从输出中计算它。


    单样本 t 检验的 Cohen''s d 等于均值差除以标准差。如果 SPSS 提供了如下输出，我们按照所示计算 `d`。


    $\mathit{d}=\frac{\overline{D}}{s_{\mathit{d}}}$


    $\mathit{d}=\frac{.90}{1.1972}$


    *d* = 752


    在本例中使用 Cohen 准则判断效应量，结果处于中等和大之间。


    ## T 检验


    ![One-Sample Test](img/fig00249.jpg)


    单样本检验


    ![Group Statistics](img/fig00250.jpg)


    组统计


    ### 独立样本 t 检验的效应量


    从独立 t 检验计算效应量要复杂一些，因为 SPSS 没有提供合并标准差。然而，输出的上部分提供了我们计算所需的信息。第 6 章。


    $S_{pooled}=,\,\sqrt{\left( n_{1} - 1 \right)S_{1}^{2} + {\left( n_{2} - 1 \right)S_{2}^{2}}}{n_{1}
    + n_{2} - 2}}$组统计


    $S_{pooled}=,\,\sqrt{\frac{(2 - 1)3.5355^{2} + {(2 - 1)7.0711^{2}}}{2 + 2 - 2}}$


    一旦计算出合并标准差（`s[pooled]`），我们就可以计算 Cohen''s d。


    $\mathit{d}=\frac{{\overline{\mathit{X}}}_{1} - {\overline{\mathit{X}}}_{2}}{S_{\mathit{p}\mathit{o}\mathit{l}\mathit{e}\mathit{d}}}$


    $\mathit{d}=\frac{82.50 - 7800}{5.59}$


    *d*=.81


    因此，在本例中，根据 Cohen 准则解释 d，我们得到了较大的效应量。


    ### 配对样本 t 检验的效应量


    你可能已经在统计学课中学过，配对样本 t 检验只是单样本 t 检验的一个特例。因此，计算 Cohen''s d 的程序也是一样的。然而，SPSS 的输出看起来有些不同，你需要从不同的区域取值。


    ![Paired Samples Test](img/fig00259.jpg)


    配对样本检验


    $d = \frac{\overline{D}}{S_{D}}$


    $\mathit{d}=\frac{- 22.8095}{8.9756}$


    *d* = 2.54


