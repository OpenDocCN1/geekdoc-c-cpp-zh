    Notice that in this example, we represent the effect size (`d`) as a positive
    number even though it is negative. Effect sizes are always positive numbers. In
    this example, using Cohen’s guidelines for the interpretation of `d`, we have
    found a very large effect size.


    ## r² (Coefficient of Determination)


    While Cohen’s `d` is the appropriate measure of effect size for t tests, correlation
    and regression effect sizes should be determined by squaring the correlation coefficient.
    This squared correlation is called the coefficient of determination. `Cohen^([3](#Apendix1.xhtml_fn0007))`
    suggested that correlations of `.5`, `.3`, and `.1` corresponded to large, moderate,
    and small relationships. Those values squared yield coefficients of determination
    of `.25`, `.09`, and `.01`, respectively. It would appear, therefore, that Cohen
    is suggesting that accounting for 25% of the variability represents a large effect,
    9% a moderate effect, and 1% a small effect.


    ### Effect Size for Correlation


    Nowhere is the effect of sample size on statistical power (and therefore significance)
    more apparent than with correlations. Given a large enough sample, any correlation
    can become significant. Thus, effect size becomes critically important in the
    interpretation of correlations.


    The standard measure of effect size for correlations is the coefficient of determination
    (`r²`) previously discussed. The coefficient should be interpreted as the proportion
    of variance in the dependent variable that can be accounted for by the relationship
    between the independent and dependent variables. While Cohen provided useful guidelines
    for interpretation, each problem should be interpreted in terms of its true practical
    significance. For instance, if a treatment is very expensive to implement, or
    has significant side effects, then a larger correlation should be required before
    the relationship becomes important. For treatments that are very inexpensive,
    a much smaller correlation can be considered important.


    To calculate the coefficient of determination, simply take the `r` value that
    SPSS provides and square it.


    ### Effect Size for Regression


    The `Model Summary` section of the output reports `R²` for you. The example output
    here shows a coefficient of determination of `.649`, meaning that almost 65% (`.649`)
    of the variability in the dependent variable is accounted for by the relationship
    between the dependent and independent variables.


    ![](Images/fig00263.jpg)


    ## Eta Squared (η²)


    A third measure of effect size is Eta Squared (`η²`). Eta Squared is used for
    Analysis of Variance models. The `GLM` (General Linear Model) function in SPSS
    (the function that runs the procedures under `Analyze—General Linear Model`) will
    provide Eta Squared (`η²`).


    $\mathit{\eta}^{2}=\frac{SS_{effect}}{SS_{effect} + SS_{error}}$


    Model Summary


    Eta Squared has an interpretation similar to a squared correlation coefficient
    (`r²`). It represents the proportion of the variance accounted for by the effect.
    Unlike `r²`, however, which represents only linear relationships, `η²` can represent
    any type of relationship.


    ### Effect Size for Analysis of Variance


    For most Analysis of Variance problems, you should elect to report Eta Squared
    as your effect size measure. SPSS provides this calculation for you as part of
    the `General Linear Model (GLM)` command.


    ![Tests of Between-Subjects Effects](Images/fig00265.jpg)


    Tests of Between-Subjects Effects


    To obtain Eta Squared, simply click on the `Options` box in the main dialog box
    for the `GLM` command you are running (this works for `Univariate`, `Multivariate`,
    and `Repeated Measures` versions of the command even though only the `Univariate`
    option is presented here).


    ![](Images/fig00266.jpg)


    Once you have selected `Options`, a new dialog box will appear. One of the options
    in that box will be `Estimates of effect size`. When you select that box, SPSS
    will provide Eta Squared values as part of your output.


    ![](Images/fig00267.jpg)


    In the above example, we obtained an Eta Squared of `.761` for our main effect
    for group membership. Because we interpret Eta Squared using the same guidelines
    as `r²`, we would conclude that this represents a large effect size for group
    membership.


    ## Notes


    [1.](#Apendix1.xhtml_bck_fn0005) Kirk, R.E. (1996). Practical significance: A
    concept whose time has come. Educational & Psychological Measurement, 56, 746–759.


    [2.](#Apendix1.xhtml_bck_fn0006) Cohen, J. (1992). A power primer. Psychological
    Bulletin, 112, 155–159.


    [3.](#Apendix1.xhtml_bck_fn0007) Cohen, J. (1988). Statistical power analysis
    for the behavioral sciences (2nd ed.). Hillsdale, NJ: Lawrence Erlbaum.


