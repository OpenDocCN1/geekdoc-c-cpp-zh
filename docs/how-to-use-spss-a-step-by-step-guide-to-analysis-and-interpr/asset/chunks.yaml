    ## Section 7.3 Factorial ANOVA


    ### Description


    The factorial ANOVA is one in which there is more than one independent variable.
    A 2 × 2 ANOVA, for instance, has two independent variables, each with two levels.
    A 3 × 2 × 2 ANOVA has three independent variables. One has three levels, and the
    other two have two levels. Factorial ANOVA is very powerful because it allows
    us to assess the effects of each independent variable, plus the effects of the
    interaction.


    Interactions occur when the effect of one variable impacts the effect of another
    variable on the dependent variable. For instance, there is an interaction between
    soap and water, influencing their effects on their cleaning ability. In this instance,
    the effect of soap and water together is greater than their individual effects
    added together.


    ### Assumptions


    Factorial ANOVA requires all of the assumptions of one-way ANOVA (i.e., the dependent
    variable must be at the interval or ratio level and normally distributed). In
    addition, the independent variables should be independent of each other.


