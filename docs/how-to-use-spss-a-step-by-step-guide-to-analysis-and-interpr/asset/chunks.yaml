    # Chapter 8: Nonparametric Inferential Statistics


    Nonparametric tests are used when the corresponding parametric procedure is inappropriate.
    Normally, this is because the dependent variable is not interval- or ratio-scaled.
    It can also be because the dependent variable is not normally distributed. If
    the data of interest are frequency counts, nonparametric statistics may also be
    appropriate.


    SPSS has a powerful `Nonparametric Tests` command that includes enhanced reports,
    which help users choose the appropriate test and interpret the result correctly.


    ## Section 8.1 Chi-Square Goodness of Fit


    ### Description


    The chi-square goodness of fit test determines whether or not sample proportions
    match the theoretical values. For instance, it could be used to determine if a
    die is loaded or fair. It could also be used to compare the proportion of children
    born with birth defects to the population value (e.g., to determine if a certain
    neighborhood has a statistically higher-than-normal rate of birth defects).


    ### Assumptions


    We need to make very few assumptions. There are no assumptions about the shape
    of the distribution. The expected frequencies for each category should be at least
    1, and no more than 20% of the categories should have expected frequencies of
    less than 5.


    ### SPSS Data Format


    SPSS requires only a single variable. It can be measured on any scale, although
    SPSS requires it to be defined as nominal.


    ### Running the Command


    We will create the following dataset and call it `COINS.sav`. The following data
    represent the flipping of each of two coins 20 times (H is coded as heads, T as
    tails).


    Coin 1: H T H H T H H T H H H T T T H T H T T H

    Coin 2: T T H H T H T H T T H H T H H T H T H H


    Name the two variables `COIN1` and `COIN2`, and code H as 1 and T as 2. The data
    file that you create will have 20 rows of data and two columns, called `COIN1`
    and `COIN2`. Define the variables as type: Nominal.


    ![](Images/fig00190.jpg)


    To run the `Chi-Square` command, click `Analyze`, then `Nonparametric Tests`,
    then `One Sample`. This will bring up the dialog box for the `One-Sample Nonparametric
    Tests` command. You will notice that this new procedure has a dialog box that
    is quite different from the interfaces for other SPSS commands. It was completely
    rewritten using SPSS’s new modeling procedures starting with Version 18.


    ![](Images/fig00191.jpg)


    Our objective for a chi-square goodness of fit test is to determine if the distribution
    of the data is equal to the hypothesized distribution. Therefore, just leave the
    `Objective` tab the same and click on the `Fields` tab at the top of the window.


    ![](Images/fig00192.jpg)


    You will need to click `Use custom field assignments` and then move the variable
    `COIN1` to the `Test Fields` area on the right.


    ![](Images/fig00193.jpg)


    This new procedure is actually quite smart and will examine your data and choose
    the most appropriate test for you. In order to demonstrate the chi-square test
    of independence, however, we will force it to run only that test by selecting
    the `Settings` tab across the top, then clicking `Customize tests` under `Choose
    Tests`, and then checking the `Compare observed probabilities to hypothesized
    (Chi-Square test)` option.


    ![](Images/fig00194.jpg)


    A fair coin has an equal chance of coming up heads or tails. Therefore, there
    is nothing further we need to do. If, however, different values had different
    expected probabilities, we would click `Options`, where we would have an opportunity
    to `Customize expected probability`. Close the `Chi-Square Test Options` window
    by clicking `Cancel`, and then click `Run`.


    ### Reading the Output


    ![](Images/fig00195.jpg)


    This new procedure completely changes the way output is presented when compared
    with other procedures in SPSS. The new output states the null hypothesis in standard
    English, tells you what test was run, gives a significance level, and tells you
    whether not to reject the null hypothesis. In the example shown, we were told
    to `Retain the null hypothesis`. One of the very new features is the Model Viewer.
    Double-click on the output and the Model Viewer will open.


    ![](Images/fig00196.jpg)


    The Model Viewer expands the standard answer by automatically presenting graphs
    and other information necessary to interpret your results. It is here that you
    find the more standard values of the chi-square itself, degrees of freedom, and
    so on. Note that the observed frequency for tails is equal to 9, and it is therefore
    not shown on the graph because the Y-axis starts at 9.


    ![](Images/fig00197.jpg)


    Note: In order to print the full output, you need to select `File`, then `Properties`
    in the Model Viewer, and then select `Print all`.


    ### Drawing Conclusions


    A significant chi-square test indicates that the data vary from the expected values.
    A test that is not significant indicates that the data are consistent with the
    expected values.


    ### Phrasing Results That Are Significant


    In describing the results, you should state the value of chi-square (whose symbol
    is χ²), the degrees of freedom, the significance level, and a description of the
    results. For instance, with a significant chi-square (for a sample different from
    our example, such as if we used a loaded die), we could state the following (note
    that this example uses hypothetical values):


    A chi-square goodness of fit test was calculated comparing the frequency of occurrence
    of each value of a die. It was hypothesized that each value would occur an equal
    number of times. Significant deviation from the hypothesized values was found
    (χ²(5) = 25.48, p < .05). The die appears to be loaded.


    ### Phrasing Results That Are Not Significant


    If the analysis produces no significant difference, as in the previous example,
    we could state the following (note that you will need to double-click the output
    and open the Model Viewer to obtain these numbers):


    A chi-square goodness of fit test was calculated comparing the frequency of occurrence
    of heads and tails on a coin. It was hypothesized that each value would occur
    an equal number of times. No significant deviation from the hypothesized values
    was found (χ²(1) = .20, p > .05). The coin appears to be fair.

