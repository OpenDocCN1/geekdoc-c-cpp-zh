    each level of the within-subjects independent variables. Another variable (column)
    should be present in the data file for each between-subjects variable. Thus, a
    2 × 2 mixed-design ANOVA would require three columns: two representing the dependent
    variable (one at each level) and one representing the between-subjects independent
    variable.


    ### Running the Command


    ![](Images/fig00173.jpg)


    The General Linear Model command runs the Repeated Measures ANOVA command. Click
    Analyze, then General Linear Model, then Repeated Measures.


    Note that this procedure requires an optional module. If you do not have this
