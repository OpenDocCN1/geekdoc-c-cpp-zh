  raw: 'A measure of central tendency should be accompanied by a measure of dispersion.
    Thus, when giving a mean, you should also report a standard deviation. When presenting
    a median, you should also state the range or interquartile range.


    ### SPSS Data Format


    Two variables in the SPSS data file are required. One represents the dependent
    variable and will be the variable for which you receive the descriptive statistics.
    The other is the independent variable and will be used in creating the subsets.
    Note that while SPSS calls this variable an independent variable, it may not meet
    the strict criteria that define a true independent variable (e.g., treatment manipulation).
    Thus, some SPSS procedures refer to it as the grouping variable.


    ### Running the Command


    This example uses the SAMPLE.sav data file you created in [Chapter 1](#Ch01.xhtml_ht0016).
    The Means command is run by clicking Analyze, then Compare Means, then Means.


    ![](Images/fig00060.jpg)


    This will bring up the main dialog box for the Means command. Place the selected
    variable in the blank field labeled Dependent List. Place the grouping variable
    in the box labeled Independent List. In this example, through use of the SAMPLE.sav
    data file, measures of central tendency and measures of dispersion for the variable
    GRADE will be given for each level of the variable MORNING.


    ![](Images/fig00061.jpg)


    By default, the mean, number of cases, and standard deviation are given. If you
    would like additional measures, click Options and you will be presented with the
    dialog box shown here. You can opt to include any number of measures.


    ![](Images/fig00062.jpg)


    ### Reading the Output


    The output for the Means command is split into two sections. The first section,
    called a case processing summary, gives information about the data used. In our
    sample data file, there are four students (cases), all of whom were included in
    the analysis.


    ![](Images/fig00063.jpg)


    The second section of the output is the report from the Means command.


    ![](Images/fig00064.jpg)


    This report lists the name of the dependent variable (GRADE) at the top. Every
    level of the independent variable (MORNING) is shown in a row in the table. In
    this example, the levels are 0 and 1, labeled No and Yes. Note that if a variable
    is labeled, the labels will be used instead of the raw values.


    The summary statistics given in the report correspond to the data, where the level
    of the independent variable is equal to the row heading (e.g., No, Yes). Thus,
    two participants were included in each row. Morning people had a mean GRADE of
    78.0 and non-morning people had a mean GRADE of 82.5.


    An additional row has been added, named Total. That row contains the combined
    data, and the values are the same as they would be if we had run the Descriptives
    command for the variable GRADE.


    ### Extension to More Than One Independent Variable


    ![](Images/fig00065.jpg)


    If you have more than one independent variable, SPSS can break down the output
    even further. Rather than adding more variables to the Independent List section
    of the dialog box, you need to add them in a different layer. If you click Next,
    you will be presented with Layer 2 of 2, and you can select a second independent
    variable (e.g., TRAINING). Note that SPSS indicates with which layer you are working.
    Now, when you run the command (by clicking OK), you will be given summary statistics
    for the variable GRADE by each level of MORNING and TRAINING.


    Your output will look like the output shown below. You now have two main sections
    (No and Yes), along with the Total. Now, however, each main section is broken
    down into subsections (No, Yes, and Total).


    ![](Images/fig00066.jpg)


    The variable you used in Level 1 (MORNING) is the first one listed, and it defines
    the main sections. The variable you had in Level 2 (TRAINING) is listed second.
    Thus, the first row represents those participants who were not morning people
    and who received training. The second row represents participants who were not
    morning people and did not receive training. The third row represents the total
    for all participants who were not morning people.


    Notice that standard deviations are not given for all of the rows. This is because
    there is only one participant per cell in this example. One problem with using
    many subsets is that it increases the number of participants that are required
    to obtain meaningful results. See a research design text or your instructor for
    more details.


    ### Practice Exercise


    Using Practice Dataset 1 in [Appendix B](#Apendix2.xhtml_ht0356), compute the
    mean and standard deviation of ages for each value of marital status. What is
    the average age of the married participants? The single participants? The divorced
    participants?


    ## Section 3.5 Standard Scores


    ### Description


    Standard scores allow the comparison of different scales by transforming the scores
    into a common scale. The most common standard score is the z-score. A z-score
    is based on a standard normal distribution (i.e., a mean of 0 and a standard deviation
    of 1). A z-score, therefore, represents the number of standard deviations above
    or below the mean (e.g., a z-score of –1.5 represents a score 1½ standard deviations
    below the mean a given score is).


    ### Assumptions


    The standard normal distribution is the basis for z-scores as normally used. Therefore,
    the distributions that are converted to z-scores should be normally distributed,
    and the scales should be either interval or ratio.


    ### Drawing Conclusions


    Conclusions based on z-scores consist of the number of standard deviations above
    or below the mean a score is. For instance, a student scores 85 on a mathematics
    exam in a class that has a mean of 70 and standard deviation of 5\. The student’s
    test score is 15 points above the class mean (85–70 = 15). The student’s z-score
    is 3 because she scored 3 standard deviations above the mean (15 ÷ 5 = 3). If
    the same student scores 90 on a reading exam, with a class mean of 80 and a standard
    deviation of 10, the z-score will be 1.0 because she is one standard deviation
    above the mean. Thus, even though her raw score was higher on the reading test,
    she actually did better in relation to other students on the mathematics test
    because her z-score was higher on that test.


    ### SPSS Data Format


    Calculating z-scores requires only a single variable in SPSS. That variable must
    be numerical.


    ### Running the Command


    ![](Images/fig00067.jpg)


    This example uses the sample data file (SAMPLE.sav) created in [Chapters 1](#Ch01.xhtml_ht0016)
    and [2](#Ch02.xhtml_ht0034). Computing z-scores is a component of the Descriptives
    command. To access it, click Analyze, then Descriptive Statistics, then Descriptives.


    ![](Images/fig00068.jpg)


    This will bring up the standard dialog box for the Descriptives command. Notice
    the check-box in the bottom-left corner labeled Save standardized values as variables.
    Check this box and move the variable GRADE into the right-hand blank. Then, click
    OK to complete the analysis. You will be presented with the standard output from
    the Descriptives command. Notice that the z-scores are not listed. They were inserted
    into the data window as a new variable.


    Switch to the Data View window and examine your data file. Notice that a new variable,
    called ZGRADE, has been added. When you asked SPSS to save standardized values,
    it created a new variable with the same name as your old variable preceded by
    a Z. The z-score is computed for each case and placed in the new variable.


    ![](Images/fig00069.jpg)


    ### Reading the Output


    After you conducted your analysis, the new variable was created. You can perform
    any number of subsequent analyses on the new variable.


