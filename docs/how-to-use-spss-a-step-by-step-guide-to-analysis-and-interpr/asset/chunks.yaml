    # Chapter 4 Graphing Data (#contents.xhtml_bck_ht0085)


    ## Section 4.1 Graphing Basics


    In addition to the frequency distributions, measures of central tendency, and
    measures of dispersion discussed in [Chapter 3](#Ch03.xhtml_ht0042), graphing
    is a useful way to summarize, organize, and reduce your data. It has been said
    that a picture is worth a thousand words. In the case of complicated datasets,
    this is certainly true.


    With SPSS, it is possible to make publication-quality graphs. One important advantage
    of using SPSS to create your graphs instead of using other software (e.g., `Excel`
    or `SigmaPlot`) is that the data have already been entered. Thus, duplication
    is eliminated, and the chance of making a transcription error is reduced.


    ## Section 4.2 Bar Charts, Pie Charts, and Histograms


    ### Description


    Bar charts, pie charts, and histograms represent—through the varying heights of
    bars or sizes of pie pieces—the number of times each score occurs. They are graphical
    representations of the frequency distributions discussed in [Chapter 3](#Ch03.xhtml_ht0042).


    ### Drawing Conclusions


    The `Frequencies` command produces output that indicates both the number of cases
    in the sample with a particular value and the percentage of cases with that value.
    Thus, conclusions drawn should relate only to describing the numbers or percentages
    for the sample. If the data are at least ordinal in nature, conclusions regarding
    the cumulative percentages and/or percentiles can also be drawn.


    ### SPSS Data Format


    You need only one variable to use this command.


    ### Dataset


    For the graphing examples, we will use a new set of data. Enter the data that
    follow by defining the three subject variables in the Variable View window: `HEIGHT`
    (in inches), `WEIGHT` (in pounds), and `SEX` (1 = male, 2 = female). When you
    create the variables, designate `HEIGHT` and `WEIGHT` as `Scale` measures and
    `SEX` as a `Nominal` measure (in the far-right column of the Variable View ).
    Switch to the Data View to enter the data values for the 16 participants. Now
    use the `Save As` command to save the file, naming it `HEIGHT.sav`.


    | HEIGHT | WEIGHT | SEX |

    | --- | --- | --- |

    | 66 | 150 | 1 |

    | 69 | 155 | 1 |

    | 73 | 160 | 1 |

    | 72 | 160 | 1 |

    | 68 | 150 | 1 |

    | 63 | 140 | 1 |

    | 74 | 165 | 1 |

    | 70 | 150 | 1 |

    | 66 | 110 | 2 |

    | 64 | 100 | 2 |

    | 60 | 95 | 2 |

    | 67 | 110 | 2 |

    | 64 | 105 | 2 |

    | 63 | 100 | 2 |

    | 67 | 110 | 2 |

    | 65 | 105 | 2 |


    Make sure you have entered the data correctly by calculating a mean for each of
    the three variables (click `Analyze`, then `Descriptive Statistics`, then `Descriptives`
    ). Compare your results with those in the table below.


    ![](Images/fig00070.jpg)


    ### Running the Command


    ![](Images/fig00071.jpg)


    The `Frequencies` command will produce graphical frequency distributions. Click
    `Analyze`, then `Descriptive Statistics`, then `Frequencies`. You will be presented
    with the main dialog box for the `Frequencies` command, where you can enter the
    variables for which you would like to create graphs or charts (`HEIGHT` in this
    example). See [Chapter 3](#Ch03.xhtml_ht0042) for other options with this command.


    ![](Images/fig00072.jpg)


    Click the `Charts` button on the right side of the frequencies command to bring
    up the `Charts` dialog box.


    ![](Images/fig00073.jpg)


    There are three types of charts available with this command: Bar charts, Pie charts,
    and Histograms. For each type, the Y-axis can be either a frequency count or a
    percentage (selected with the `Chart Values` option). Select Bar charts and click
    `Continue`. Next, click `OK`.


    You will receive the charts for any variables selected in the main `Frequencies`
    command dialog box.


    ### Output


    The bar chart consists of a Y-axis, representing the frequency, and an X-axis,
    representing each score. Note that the only values represented on the X-axis are
    those values with nonzero frequencies (61, 62, and 71 are not represented).


    ![](Images/fig00074.jpg)


    If selected for output, the pie chart shows the percentage of the whole that is
    represented by each value.


    ![](Images/fig00075.jpg)


    The `Histogram` command creates a grouped frequency distribution. The range of
    scores is split into evenly spaced groups. The midpoint of each group is plotted
    on the X-axis, and the Y-axis represents the number of scores for each group.


    ![](Images/fig00076.jpg)


    If you select `Show normal curve` on histogram, a normal curve will be superimposed
    over the distribution.


    ### Practice Exercise


    Using Practice Dataset 2 in [Appendix B](#Apendix2.xhtml_ht0356), determine the
    z-score that corresponds to each employee’s salary. Determine the mean z-scores
    for salaries of male employees and female employees. Determine the mean z-score
    for salaries of the total sample.


    ## Section 4.3 The Chart Builder


    ### Chart Builder Basics


    Make sure that the `HEIGHT.sav` data file you created in 4.2 is open. In order
    to use the chart builder, you must have data file open.


    ![](Images/fig00077.jpg)


    The Chart Builder command is accessed using `Graphs`, then `Chart Builder`. This
    is a very versatile command that can make graphs of excellent quality.


    When you first run the Chart Builder command, you will probably be presented with
    the following dialog box:


    ![](Images/fig00078.jpg)!(Images/fig00079.jpg)


    This dialog box is asking you to ensure that your variables are properly defined.
    Refer to Sections 1.3 and 2.1 if you had difficulty defining the variables. Click
    `OK`.


    Near the middle of the dialog box, there are four main tabs that let you control
    the graphs you are making. The first one is the `Gallery` tab. The `Gallery` tab
    allows you to choose the basic format of your graph.


    For instance, the screenshot above shows the different kinds of bar charts that
    the Chart Builder can create.


    After you have selected the basic form of graph that you want using the `Gallery`
    tab, you simply drag the image from the bottom right of the window up to the main
    window at the top (where it reads, “Drag a Gallery chart here to use it as your
    starting point”).


    Alternatively, you can use the `Basic Elements` tab to drag a coordinate system
    (labeled `Choose Axes`) to the top, then drag variables and elements into the
    window.


    The other tabs (`Groups/Point ID` and `Titles/Footnotes`) can be used for adding
    other standard elements to your graphs.


    The examples in this text will cover some of the basic types of graphs you can
    make with the Builder. After a little experimentation on your own, and once you
    have mastered the examples in this chapter, you will soon gain a full understanding
    of the Chart Builder.


    ## Section 4.4 Scatterplots


    ### Description


    Scatterplots (also called scattergrams or scatter diagrams) display two values
    for each case with a mark on the graph. The X-axis represents the value for one
    variable. The Y-axis represents the value for the second variable.


    ### Assumptions


    Both variables should be interval or ratio scales. If nominal or ordinal data
    are used, be cautious about your interpretation of the scattergram.


    ### SPSS Data Format


    You need two variables to perform this command.


    ### Running the Command


    You can produce scatterplots by clicking `Graphs`, then `Chart Builder`.

