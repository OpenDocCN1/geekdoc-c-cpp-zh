- fmt: '

    If either of the variables in your relationship is ordinal (e.g., ranks) you must
    do a nonparametric correlation. If one of your variables is nominal, you are just
    out of luck with correlations.


    * If you can do a `Parametric Correlation`, see `Branch 4`.

    * If you must do a `Nonparametric Correlation`, see `Branch 5`.


    ## Branch 4


    Your Decisions So Far:


    * Measuring Strength of Association

    * You can do a `Parametric Correlation`


    The appropriate test to do is a `Pearson r`. This test is covered in detail in
    Section 5.1 of this text. It is accessed in SPSS at `Analyze → Correlate → Bivariate`.


    Answers range from `-1` to `+1`. Values close to 0 mean there is a weak relationship.
    Values closer to `+1` or `-1` mean a stronger relationship. Positive values mean
    as one variable gets larger, the other variable also gets larger. Negative values
    mean as one variable gets larger, the other variable gets smaller.


    ## Branch 5


    Your Decisions So Far:


    * Measuring Strength of Association

    * You must do a `Nonparametric Correlation`


    The appropriate test to do is a `Spearman rho`. This test is covered in detail
    in Section 5.2 of this text. It is accessed in SPSS at `Analyze → Correlate →
    Bivariate` and then selecting `Spearman` in the dialog box that comes up.


    Answers range from `-1` to `+1`. Values close to 0 mean there is a weak relationship.
    Values closer to `+1` or `-1` mean a stronger relationship. Positive values mean
    as one variable gets larger, the other variable also gets larger. Negative values
    mean as one variable gets larger, the other variable gets smaller.


    ## Branch 6


    Your Decisions So Far:


    * Making Predictions


    Predictions are a powerful use of statistics. In this text, we only cover prediction
    models that assume the variables are related to each other in linear ways. If
    you have nonlinear relationships, they are beyond the scope of this text.


    This text uses the term `Independent Variable` when, in fact, sometimes prediction
    is done when there is not a true `Independent Variable`. If you have a design
    where there is not a true `Independent Variable`, the variables you use to make
    a prediction should be considered `Independent Variables` for purposes of this
    decision process.


    * If you have a single `Independent Variable`, see `Branch 7`.

    * If you have multiple `Independent Variables` that you want to use to predict
    the value of a single `Dependent Variable` (e.g., predict a `GPA` from `ACT scores`,
    classes missed, and hours spent studying), see `Branch 8`.


    ## Branch 7


    Your Decisions So Far:


    * Making Predictions

    * Single Independent Variable


    The appropriate test to do is a `Simple Linear Regression`. This test is covered
    in detail in Section 5.3 of this text. It is accessed in SPSS at `Analyze Regression
    Linear`.


    The output will have a `B` column that provides the answers. The `B` for `Constant`
    is your `Y-Intercept`, and the `B` next to the name of your `Independent Variable`
    is the slope of the line.


    ## Branch 8


    Your Decisions So Far:


    * Making Predictions

    * Multiple Independent Variables


    The appropriate test to do is a `Multiple Linear Regression`. This test is covered
    in detail in Section 5.4 of this text. It is accessed in SPSS at `Analyze Regression
    Linear` and entering more than one `Independent Variable`.


    The output will have a `B` column that provides the answers. The `B` for `Constant`
    is your `Y-Intercept`, and the `Bs` next to the names of your `Independent Variables`
    are the weights for each of them.


    ## Branch 9


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable


    The next question to ask is whether you can do a `Parametric Test` or whether
    you have to do a `Nonparametric Test`. `Parametric Tests` generally require that
    the `Dependent Variables` are measured on an `Interval` or `Ratio` measurement
    scale, and the variables are approximately normally distributed. With `Nonparametric
    Tests`, you do not make that assumption.


    * If you can do a `Parametric Test`, see `Branch 11`.

    * If you must do a `Nonparametric Test`, see `Branch 26`.


    ## Branch 10


    Your Decisions So Far:


    * Looking for Differences in Groups

    * More than One Dependent Variable


    The appropriate test to do is a `MANOVA` (`Multivariate Analysis of Variance`).
    This test is covered in detail in Section 7.7 of this text. It is accessed in
    SPSS at `Analyze → General Linear Model → Multivariate`.


    This text does not cover tests for `Nonparametric` equivalents of `MANOVA`. Also,
    please note that the `Advanced Module` of `IBM SPSS Statistics` is required to
    run this command.


    ## Branch 11


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Parametric Test


    Sometimes when a researcher cannot implement appropriate procedural controls (e.g.,
    random assignment of participants to groups), the overall analysis can be improved
    by “covarying out” variables that the researcher knows may have an effect on the
    `Dependent Variable`.


    For example, a researcher may be comparing two different sections of a class,
    but was unable to assign students to the sections (the students self-selected).
    The researcher knows that overall `GPA` is likely to have an effect on the grade
    in the course. The researcher can, therefore, “covary out” the effect of `cumulative
    GPA` from the grades in the two sections to make a better comparison as to whether
    or not the two sections were different in some other way (e.g., because of a new
    teaching method).


    * If you would like to analyze your data with a `Covariate`, see `Branch 12`.

    * If you are not going to use a `Covariate`, see `Branch 13`.


    ## Branch 12


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Parametric Test

    * Covariate


    The appropriate test to do is `ANCOVA` (`Analysis of Covariance`). This test is
    covered in detail in Section 7.6 of this text. It is accessed in SPSS at `Analyze
    → General Linear Model → Univariate` and entering a variable in the `Covariate`
    space.


    ## Branch 13


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Parametric Test

    * No Covariate


    Next, it is time to make a decision about your `Independent Variables`. The easiest
    analyses have a single `Independent Variable` (e.g., treatment), however, more
    complex analyses can have multiple `Independent Variables` that are examined at
    the same time (e.g., treatment and time).


    * If you are simply comparing a single sample to a known population, see `Branch
    14`.

    * If you have a single `Independent Variable`, see `Branch 15`.

    * If you have multiple `Independent Variable`, see `Branch 22`.


    ## Branch 14


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Parametric Test

    * No Covariate

    * Comparison of a Sample to a Population


    The appropriate test to do is a `single-sample t Test`. This test is covered in
    detail in Section 6.2 of this text. It is accessed in SPSS at `Analyze → Compare
    Means → One-Sample T Test`.


    ## Branch 15


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Parametric Test

    * No Covariate

    * Single Independent Variable


    The number of levels of your `Independent Variable` also impacts which test is
    appropriate. Students often get levels of a variable confused with the variable
    itself. Levels of a variable refer to the distinct and discrete values that it
    can take on. For example, the variable `sex` has two levels (male and female).
    If you were comparing three different instructors, the variable `instructor` would
    have three levels.


    * If you have two levels of your `Independent Variable`, see `Branch 16`.

    * If you have more than two levels of your `Independent Variable`, see `Branch
    17`.


    ## Branch 16


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Parametric Test

    * No Covariate

    * Single Independent Variable

    * Two Levels of the Independent Variable

