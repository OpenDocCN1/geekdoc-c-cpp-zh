    ## Section 3.5 Standard Scores


    ### Description

    Standard scores allow the comparison of different scales by transforming the scores
    into a common scale. The most common standard score is the `z-score`. A `z-score`
    is based on a standard normal distribution (i.e., a mean of 0 and a standard deviation
    of 1). A `z-score`, therefore, represents the number of standard deviations above
    or below the mean (e.g., a `z-score` of –1.5 represents a score 1½ standard deviations
    below the mean a given score is).


    ### Assumptions

    The standard normal distribution is the basis for `z-scores` as normally used.
    Therefore, the distributions that are converted to `z-scores` should be normally
    distributed, and the scales should be either interval or ratio.


    ### Drawing Conclusions

    Conclusions based on `z-scores` consist of the number of standard deviations above
    or below the mean a score is. For instance, a student scores 85 on a mathematics
    exam in a class that has a mean of 70 and standard deviation of 5. The student’s
    test score is 15 points above the mean (85–70=15). The student’s z-score is 3
    because she scored 3 standard deviations above the mean (15÷5=3). If the same
    student scores 90 on a reading exam, with a class mean of 80 and standard deviation
    of 10, the z-score will be 1.0 because she is one deviation above the mean. Thus,
    even though her raw score was higher on the reading test, she actually did better
    in relation to other students on the mathematics test because her z-score was
    higher.


    ### Description

    Calculating `z-scores` requires only a single variable in SPSS. That variable
    must be numerical.


    ### Running the Command

    ![](Images/fig00067.jpg)


    This example uses the sample data file (`SAMPLE.sav`) created in [Chapters 1](#Ch01.xhtml_ht0016)
    and [2](#Ch02.xhtml_ht0034). Computing `z-scores` is a component of the `Descriptives`
    command. To access it, click `Analyze`, then `Descriptive Statistics`, then `Descriptives`.


    ![](Images/fig00068.jpg)


    This will bring up the standard dialog box for the `Descriptives` command. Notice
    the check-box in the bottom-left corner labeled `Save standardized values as variables`.
    Check this box and move the variable `GRADE` into the right-hand blank. Then,
    click `OK` to complete the analysis. You will be presented with the standard output
    from the `Descriptives` command. Notice that the z-scores are not listed. They
    were inserted into the data window as a new variable.


    ### Reading the Output

    After you conducted your analysis, the new variable was created. You can perform
    any number of subsequent analyses on the new variable.

