- fmt: '

    A Mann-Whitney U test was calculated examining the place that runners with varying
    levels of experience took in a long-distance race. Runners with medium experience
    did significantly worse (`M place = 6.50`) than experienced runners (`M place
    = 2.50`; `U = 0.00`, `p < .05`).


    ### Phrasing Results That Are Not Significant

    This example uses hypothetical results:


    A Mann-Whitney U test was used to examine the difference in the race performance
    of runners with medium experience and runners with experience in a short-distance
    race. No significant difference in the results of the race was found (`U = 7.50`,
    `p > .05`). Runners with medium experience averaged a place of 4.63. Experienced
    runners averaged 4.38.


    ### Practice Exercise

    Using Practice Dataset 1 in [Appendix B](#Apendix2.xhtml_ht0356), determine if
    younger participants (< 26) have significantly lower mathematics scores than older
    participants. (Note: You will need to create a new ordinal variable representing
    each age group. See Section 2.2 if you need a refresher on how to do that.)


    ## Section 8.4 Wilcoxon Test


    ### Description

    The Wilcoxon test is the nonparametric equivalent of the paired-samples (dependent)
    t test. It tests whether or not two related samples are from the same distribution.
    The Wilcoxon test is weaker than the independent t test, so the t test should
    be used if you can meet its assumptions.


    ### Assumptions

    The Wilcoxon test is based on the difference in rankings. The data for the two
    samples must at least be ordinal. There are no assumptions about the shape of
    the distribution.


    ### SPSS Data Format

    The test requires two variables. One variable represents the dependent variable
    at the first level of the independent variable. The other variable represents
    the dependent variable at the second level of the independent variable.


    ### Running the Command

    ![](Images/fig00212.jpg)


    Locate the command by clicking `Analyze`, then `Nonparametric Tests`, then `Related
    Samples`. This example uses the `RACE.sav` dataset.


    First, you will be presented with the `Nonparametric Tests` dialog box.


    ![](Images/fig00213.jpg)


    Select the `Fields` tab. Move the variables `LONG` and `MEDIUM` over to the `Test
    Fields` area as shown below.


    ![](Images/fig00214.jpg)![](Images/fig00215.jpg)


    Finally, select the `Settings` tab and `Customize tests` to select `Wilcoxon matched-pair
    signed-rank`. Click `Run`.


    ### Reading the Output

    ![](Images/fig00216.jpg)


    As part of the new nonparametric procedure, the output will be presented in plain
    English as the `Model Viewer` (see screenshot shown above). By double-clicking
    on the output, the full `Model Viewer` (shown below) will open.


    ![](Images/fig00217.jpg)


    The example above shows that no significant difference was found between the results
    of the long-distance and medium-distance races.


    ### Phrasing Results That Are Significant

    A significant result means that a change has occurred between the two measurements.
    If that happened, we could state the following (note that these results are fictitious):


    A Wilcoxon test examined the results of the medium-distance and long-distance
    races. A significant difference was found in the results (`Z = 3.40`, `p < .05`).
    Medium-distance results were better than long-distance results.


    ### Phrasing Results That Are Not Significant

    In fact, the results in the previous example were not significant, so we could
    state the following:


    A Wilcoxon test examined the results of the medium-distance and long-distance
    races. No significant difference was found in the results (`Z = .085`, `p > .05`).
    Medium-distance results were not significantly different from long-distance results.


    ### Practice Exercise

    Use the `RACE.sav` data file to determine whether or not the outcome of short-distance
    races is different from that of medium-distance races. Phrase your results.


    ## Section 8.5 Kruskal-Wallis H Test


    ### Description

    The Kruskal-Wallis H test is the nonparametric equivalent of the one-way ANOVA.
    It tests whether or not several independent samples come from the same population.


    ### Assumptions

    Because the test is nonparametric, there are very few assumptions. However, the
    test does assume an ordinal level of measurement for the dependent variable. The
    independent variable should be nominal or ordinal.


    ### SPSS Data Format

    SPSS requires one variable to represent the dependent variable and another to
    represent the levels of the independent variable. The dependent variable must
    be entered as a scale-type variable even if it is actually ordinal.


    ### Running the Command

    ![](Images/fig00218.jpg)


    This example modifies the `RACE.sav` data file to include a third group of four
    additional participants with no experience (`EXPERIENCE = 0`). Make sure your
    data look like the screenshot shown above.


    ![](Images/fig00219.jpg)


    To run the command, click `Analyze`, then `Nonparametric Tests`, then `Independent
    Samples`. This will bring up the main dialog box, below.


    ![](Images/fig00220.jpg)


    Leave the `Objective` the same and click the `Fields` tab.


    ![](Images/fig00221.jpg)


    Move `LONG` to the `Test Fields` area and `EXPERIENCE` to the `Groups` area.


    ![](Images/fig00222.jpg)


    Select the `Settings` tab and `Customize tests` to select `Kruskal-Wallis 1-way
    ANOVA`. Also, select `Multiple comparisons` and choose `All pairwise`. Just as
    post-hoc tests are necessary with parametric one-way ANOVA, they are also necessary
    with nonparametric versions. This step will have SPSS compute them for us. Click
    `Run` to perform the analysis.


    ### Reading the Output

    ![](Images/fig00223.jpg)


    The output will consist of the condensed real-language `Model Viewer`. Here, it
    tells us that the distribution of `LONG` is the same across all levels of `EXPERIENCE`.
    We can double-click the output to get Model Viewer.


    ![](Images/fig00224.jpg)![](Images/fig00225.jpg)


    In order to get the pairwise comparisons, we need to modify the view. At the bottom
    of the screen (in the panel shown above) is the `View` command. Click on that
    command and select `Pairwise Comparisons`.


    After selecting `Pairwise Comparisons`, the right section of the `Model Viewer`
    will change. At the bottom will be the following table:


    ![](Images/fig00226.jpg)


    This table shows that `EXPERIENCE 2` is significantly different from `EXPERIENCE
    0`. However, the other two comparisons are not significantly different from each
    other.


    ### Drawing Conclusions

    Like the one-way ANOVA, the Kruskal-Wallis test assumes that the groups are equal.
    Thus, a significant result indicates that at least one of the groups is different
    from at least one group. The `Pairwise Comparisons` command will allow us to determine
    which groups are different.


    ### Phrasing Results That Are Significant

    The preceding example is significant, so we could state the following:


    A Kruskal-Wallis test was conducted comparing the outcome of a long-distance race
    for runners with varying levels of experience. A significant result was found
    (`H(2) = 9.846`, `p < .01`), indicating that the groups differed from each other.
    Follow-up pairwise comparisons indicated that runners with the greatest experience
    performed significantly better than runners with no experience.


    ### Phrasing Results That Are Not Significant

    If we conducted the analysis using the results of the short-distance race, we
    would get the following output, which is not significant.


    ![](Images/fig00227.jpg)


    The `Model Viewer` would show us the following:


    ![](Images/fig00228.jpg)


    This result is not significant, so we could state the following:


    A Kruskal-Wallis test was conducted comparing the outcome of a short-distance
    race for runners with varying levels of experience. No significant difference
    was found (`H(2) = 0.299`, `p > .05`), indicating that the groups did not differ
    significantly from each other. Experience did not seem to influence the results
    of the short-distance race.

    '
