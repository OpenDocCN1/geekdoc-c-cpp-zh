    * 自变量水平多于两个

    * 重复测量


    相应的检验是`重复测量方差分析`（Repeated-Measures ANOVA）。该检验在本文第 7.4 节中有详细介绍。在 SPSS 中的访问路径为 `Analyze
    General Linear Model Repeated Measures`。


    注意：此操作需要 SPSS 的 `Advanced Module`（高级模块模块）。


