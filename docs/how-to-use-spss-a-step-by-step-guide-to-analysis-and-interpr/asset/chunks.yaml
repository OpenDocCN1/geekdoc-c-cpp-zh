    In the SPSS data window, columns represent variables, and rows represent participants.
    Therefore, we will be creating a data file with six columns (variables) and two
    rows (students/ participants).


    # Section 1.3 Defining Variables


    Before we can enter any data, we must first enter some basic information about
    each variable into SPSS. For instance, variables must first be given names that


    * begin with a letter, and

    * do not contain a space.


    Thus, the variable name `Q7` is acceptable, while the variable name `7Q` is not.
    Similarly, the variable name `PRE_TEST` is acceptable, but the variable name `PRE
    TEST` is not. Capitalization does not matter, but variable names are capitalized
    in this text to make it clear when we are referring to a variable name, even if
    the variable name is not necessarily capitalized in screenshots.


    To define a variable, click on the `Variable View` tab at the bottom of the main
    screen (see image to the right). This will show you the `Variable View` window.
    To return to the `Data View` window, click on the `Data View` tab.


    ![](Images/fig00007.jpg)![](Images/fig00008.jpg)


    From the `Variable View` screen, SPSS allows you to create and edit all of the
    variables in your data file. Each column represents some property of a variable,
    and each row represents a variable. All variables must be given a name. To do
    that, click on the first empty cell in the `Name` column and type a valid SPSS
    variable name. The program will then fill in default values for most of the other
    properties.


    One useful function of SPSS is the ability to define variable and value labels.
    Variable labels allow you to associate a description with each variable.


    Value labels allow you to associate a description with each value of a variable.
    For instance, for most procedures, SPSS requires numerical values. Thus, for data
    such as the day of the class (i.e., Mon/Wed/Fri and Tues/Thurs), we need to first
    code the values as numbers. We can assign the number `1` to `Mon/Wed/Fri` and
    the number `2` to `Tues/Thurs`. To help us keep track of the numbers we have assigned
    to the values, we use value labels.


    To assign value labels, click in the cell you want to assign values to in the
    `Values` column (in this case, for `Variable 2`). This will bring up a small gray
    button (shown below). Click on that button to bring up the `Value Labels` dialog
    box.


    ![](Images/fig00009.jpg)![](Images/fig00010.jpg)


    When you enter a value label, you must click `Add` after each entry. This will
    move the value and its associated label into the bottom section of the window.
    When all labels have been added, click `OK` to return to the `Variable View` window.


    In addition to naming and labeling the variable, you have the option of defining
    the variable type. To do so, simply click on the `Type`, `Width`, or `Decimals`
    columns in the `Variable View` window. The default value is a numeric field that
    is eight digits wide with two decimal places displayed. If your data are more
    than eight digits to the left of the decimal place, they will be displayed in
    scientific notation (e.g., the number `2,000,000,000` will be displayed as `2.00E+09`).
    SPSS maintains accuracy beyond two decimal places, but all output will be rounded
    to two decimal places unless otherwise indicated in the `Decimals` column.


    There are several other options available in this screen, which are beyond the
    scope of this text. In our example, we will be using numeric variables with all
    the default values.


    ### Practice Exercise


    Create a data file for the six variables and two sample students presented in
    Example 1.2.1. Name your variables: `ID`, `DAY`, `TIME`, `MORNING`, `GRADE`, and
    `WORK`. You should code `DAY` as `1 = Mon/Wed/Fri`, `2 = Tues/Thurs`. Code `TIME`
    as `1 = morning`, `2 = afternoon`. Code `MORNING` as `0 = No`, `1 = Yes`. Code
    `WORK` as `0 = No`, `1 = Part-time`, `2 = Full-time`. Be sure you enter value
    labels for the different variables. Note that because value labels are not appropriate
    for `ID` and `GRADE` (because the values themselves serve as labels), these are
    not coded. When complete, your `Variable View` window should look like the screenshot
    below.


    ![](Images/fig00011.jpg)


    Click on the `Data View` tab to open the data-entry screen. Enter data horizontally,
    beginning with the first student’s `ID` number. Enter the code for each variable
    in the appropriate column. To enter the `GRADE` variable value, enter the student’s
    class grade.


    ![](Images/fig00012.jpg)


    The previous data window can be changed to look like the screenshot below by clicking
    on the `Value Labels` icon (see below). In this case, the cells display value
    labels rather than the corresponding codes. If data are entered in this mode,
    it is not necessary to enter codes, as clicking the button that appears in each
    cell as the cell is selected will present a drop-down list of the predefined labels.
    You may use whichever method you prefer.


    ![](Images/fig00013.jpg)![](Images/fig00014.jpg)


    Instead of clicking the `Value Labels` icon, you may toggle between views by clicking
    `Value Labels` under the `View` menu.


    ![](Images/fig00015.jpg)


    # Section 1.4 Loading and Saving Data Files


    ![](Images/fig00016.jpg)


    Once you have entered your data, you will need to save it with a unique name so
    that you can retrieve it.


    ### Save Your Data


    When you save your data (by clicking `File`, then `Save` or `Save As`), pay special
    attention to where you save it. SPSS data files have a `.sav` extension, which
    is added automatically. Other extensions include `.spv` for saved output files
    and `.sps` for syntax files.


    ![](Images/fig00017.jpg)


    ### Load Your Data


    When you load your data (by clicking `File`, then `Open`, then `Data`, or by clicking
    the open file icon), you get a similar window. This window lists all files with
    `.sav` extension. If you have trouble locating your saved file, make sure you
    are looking in the right directory.


    ![](Images/fig00018.jpg)


    ### Practice Exercise


    To be sure that you have mastered saving and opening data files, name your sample
    data file `SAMPLE` and save it to a removable medium. Once it is saved, SPSS will
    display the name of the file at the top of the data window. In the screenshot
    here the file is called `DataSet2`.


    ![](Images/fig00019.jpg)


    # Section 1.5 Running Your First Analysis


    Any time you open a data window, you can run any of the analyses available. To
    get started, we will calculate the students’ average grade. (With only two students,
    you can easily check your answer by hand, but imagine a data file with 10,000
    student records.)


    The majority of the available statistical tests are under the `Analyze` menu.
    This menu displays all the options available for your version of the SPSS program
    (the menus in this book were created with SPSS Statistics Version 23.0 and 24.0).
    Other versions may have slightly different sets of options.


    To calculate a mean (average), we are asking the computer to summarize our dataset.
    Therefore, we run the command by clicking `Analyze`, then `Descriptive Statistics`,
    then `Descriptives`.


    ![](Images/fig00020.jpg)


    ![](Images/fig00021.jpg)

