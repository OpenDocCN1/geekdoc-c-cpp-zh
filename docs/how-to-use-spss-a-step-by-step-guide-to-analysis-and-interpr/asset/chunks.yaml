    # Preface to the 10th Edition#contents.xhtml_bck_ht0004


    ## Introduction


    `IBM® SPSS Statistics` software (`SPSS®`) is a statistical package produced by
    `IBM, Inc.`. Prior to 2009, `SPSS` was a separate company and produced statistical
    software under the `SPSS` and `PASW` names. `IBM SPSS Statistics` is designed
    to perform a wide range of statistical procedures. As with any other powerful
    program for the computer, there are certain conventions and techniques that must
    be mastered for efficient use of the software and to obtain consistently correct
    answers. By providing detailed, step-by-step guidance illustrated with examples,
    this book will help you attain such mastery.


    In addition to showing how to enter data and obtain results, this book explains
    how to select appropriate statistics and present the results in a form that is
    suitable for use in a research report in the social or behavioral sciences. For
    instance, the section on the independent `t test` shows how to state (i.e., phrase)
    the results of both a significant and an insignificant test.


    ## Audience


    This book is ideal as a supplement to traditional introductory- and intermediate-level
    statistics textbooks. It can also be used as a statistics refresher manual in
    a research methods course. Finally, students can use it as a desk reference guide
    in a variety of workplace settings after they graduate from college.


    `SPSS Statistics` is an incredibly powerful program, and this text is not intended
    to be a comprehensive user’s manual. Instead, the emphasis is on the procedures
    normally covered in introductory- and intermediate-level courses in statistics
    and research methods.


    ## Organization


    This book is divided into nine chapters plus several useful appendixes. The first
    two chapters deal with the basic mechanics of using the `SPSS` program. Each of
    the remaining chapters focuses on a particular class of statistics.


    Each chapter contains several short sections. For the most part, these sections
    are self-contained. However, students are expected to master the `SPSS` basics
    in `Chapters 1` and `2` before attempting to learn the skills presented in the
    rest of the book. Except for the skills in the first two chapters, this book can
    be used in a nonlinear manner. Thus, an instructor can assign the first two chapters
    early in a course and then assign other sections in whatever order is appropriate.


    `Appendix A` (`Apendix1.xhtml`) contains a discussion of effect size. `Appendix
    B` (`Apendix2.xhtml`) contains datasets that are needed for the practice exercises
    interspersed throughout this book. `Appendix C` (`Apendix3.xhtml`) provides the
    sample data files that are used throughout this book. `Appendix D` (`Apendix4.xhtml`)
    provides information on choosing the appropriate statistical test. The `Glossary`
    in `Appendix E` (`Apendix5.xhtml`) provides definitions of most of the statistical
    terms used in this book. Because it is assumed that this text is being used in
    conjunction with a main statistics textbook, the `Glossary` definitions are brief
    and are designed to serve only as reminders. `Appendix F` (`Apendix6.xhtml`) provides
    a text-based version of the decision tree on the inside front cover.


    ## SPSS Versions


    This book was written for use with `IBM SPSS Statistics for Windows Version 24.0`,
    although it will work well with all prior versions of `SPSS` (and `PASW`) as well
    as the newer `IBM SPSS Statistics Cloud`. There are no material differences in
    terms of the content of this text between Versions 18 or higher of `SPSS/PASW`
    (only some minor differences in logos, etc.). Thus, this text is designed for
    use with all versions since Version 18.

