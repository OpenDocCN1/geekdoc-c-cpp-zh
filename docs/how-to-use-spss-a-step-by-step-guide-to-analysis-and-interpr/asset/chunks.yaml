- fmt: '

    This procedure uses the `GLM` command. `GLM` stands for General Linear Model.
    It is a very powerful command, and many sections of output are beyond the scope
    of this text (see Output outline shown above). However, for the basic repeated-measures
    ANOVA, we are interested only in the `Tests of Within-Subjects Effects`. Note
    that the SPSS output will include many other sections of output, which you can
    ignore at this point.


    The `Tests of Within-Subjects Effects` output should look very similar to the
    output from the other ANOVA commands. In the example below, the effect of `TIME`
    has an `F` value of `121.90` with `2` and `40` degrees of freedom (we use the
    line for `Sphericity Assumed`). It is significant at less than the `.001` level.
    When describing these results, we should indicate the type of test, `F` value,
    degrees of freedom, and significance level.


    ![](Images/fig00170.jpg)!(Images/fig00171.jpg)


    ### Phrasing Results That Are Significant


    Because the ANOVA results were significant, we need to conduct some sort of post-hoc
    analysis. One of the main limitations of SPSS is the difficulty in performing
    post-hoc analyses for within-subjects factors. With SPSS, the easiest solution
    to this problem is to conduct protected dependent t tests with repeated-measures
    ANOVA. There are more powerful (and more appropriate) post-hoc analyses, but SPSS
    will not compute them for us. For more information, consult your instructor or
    a more advanced statistics text.


    To conduct the protected t tests, we will compare `PRETEST` to `MIDTERM`, `MIDTERM`
    to `FINAL`, and `PRETEST` to `FINAL`, using `paired-samples t tests`. Because
    we are conducting three tests and, therefore, inflating our Type I error rate,
    we will use a significance level of `.017` (`.05/3`) instead of `.05`. Note that
    to conduct this analysis, we will need to use the `paired-samples t test` command
    and enter all three pairs.


    ![](Images/fig00172.jpg)


    The three comparisons each had a significance level of less than `.017`, so we
    can conclude that the scores improved from pretest to midterm and again from midterm
    to final. To generate the descriptive statistics, we have to run the `Descriptives`
    command for each variable.


    Because the results of our example were significant, we could state the following:


    A one-way repeated-measures ANOVA was calculated comparing the exam scores of
    participants at three different times: pretest, midterm, and final. A significant
    effect was found (`F (2,40) = 121.90`, `p < .001`). Follow-up protected t tests
    revealed that scores increased significantly from pretest (`M = 63.33`, `sd =
    8.93`) to midterm (`M = 78.62`, `sd = 9.66`), and again from midterm to final
    (`M = 86.14`, `sd = 9.63`).


    ### Phrasing Results That Are Not Significant


    With results that are not significant, we could state the following (the `F` values
    here have been made up for purposes of illustration):


    A one-way repeated-measures ANOVA was calculated comparing the exam scores of
    participants at three different times: pretest, midterm, and final. No significant
    effect was found (`F (2,40) = 1.90`, `p > .05`). No significant difference exists
    among pretest (`M = 63.33`, `sd = 8.93`), midterm (`M = 78.62`, `sd = 9.66`),
    and final (`M = 86.14`, `sd = 9.63`) means.


    ### Practice Exercise


    Use `Practice Dataset 3` in [Appendix B](#Apendix2.xhtml_ht0356). Determine if
    the anxiety level of participants changed over time (regardless of which treatment
    they received) using a one-way repeated-measures ANOVA and protected dependent
    t tests. Write a statement of results.


    ## Section 7.5 Mixed-Design ANOVA


    ### Description


    The mixed-design ANOVA (sometimes called a split-plot design) tests the effects
    of more than one independent variable. At least one of the independent variables
    must be within-subjects (repeated measures). At least one of the independent variables
    must be between-subjects.


    ### Assumptions


    The dependent variable should be normally distributed and measured on an interval
    or ratio scale.


    ### SPSS Data Format


    The dependent variable should be represented as one variable (one column) for
    each level of the within-subjects independent variables. Another variable (column)
    should be present in the data file for each between-subjects variable. Thus, a
    `2 × 2` mixed-design ANOVA would require three columns: two representing the dependent
    variable (one at each level) and one representing the between-subjects independent
    variable.


    ### Running the Command


    ![](Images/fig00173.jpg)


    The `General Linear Model` command runs the `Repeated Measures ANOVA` command.
    Click `Analyze`, then `General Linear Model`, then `Repeated Measures`.


    Note that this procedure requires an optional module. If you do not have this
    command, you do not have the necessary module installed. This procedure is NOT
    included in the SPSS Statistics GradPack Base.


    The `Repeated Measures` command should be used if any of the independent variables
    are repeated measures (within-subjects).


    ![](Images/fig00174.jpg)


    This example also uses the `GRADES.sav` data file. Enter `PRE-TEST`, `MIDTERM`,
    and `FINAL` in the `Within-Subjects Variables` block. (See the `Repeated Measures
    ANOVA` command in Section 7.4 for an explanation.) This example is a `3 × 3` mixed-design.
    There are two independent variables (`TIME` and `INSTRUCT`), each with three levels.
    We previously entered the information for `TIME` in the `Repeated Measures` dialog
    box. We need to transfer `INSTRUCT` into the `Between-Subjects Factor(s)` block.
    Click `Options` and select `means for all the main effects`. Click `OK` to run
    the command.


    ### Reading the Output


    As with the standard `Repeated Measures` command, the `GLM` procedure provides
    a significant amount of output we will not use. For a-design ANOVA, we are interested
    in two sections. The first is `Tests of Within-Subjects Effects`.


    ![](Images/fig00175.jpg)


    This section gives two of the answers we need (the main effect for `TIME` and
    the interaction result `TIME × INSTRUCTOR`). The second section of output is `Tests
    of Between-Subjects Effects` (sample output is below). Here, we get the answers
    that do not contain within-subjects effects. For our example, we get the main
    effect for `INSTRUCT`. Both of these sections must be combined to produce the
    full answer for our analysis.


    ![](Images/fig00176.jpg)


    If we obtain significant effects, we must perform some sort of post-hoc analysis.
    Again, this is one of the limitations of SPSS. No easy way to perform the appropriate
    post-hoc test for repeated-measures (within-subjects) factors is available. Ask
    your instructor for assistance with this.


    When describing the results, you should include `F`, the degrees of freedom, and
    the significance level for each main effect and interaction. In addition, some
    descriptive statistics must be included (either give means or include a figure).


    ### Phrasing Results That Are Significant


    There are (at least) three answers for all mixed-design ANOVAs. See Section 7.3
    on factorial ANOVA for more details about how to interpret and phrase results.
    For the above example, we could state the following in the results section (note
    that this assumes that appropriate post-hoc tests have been conducted):


    A `3 × 3` mixed-design ANOVA was calculated to examine the effects of the instructor
    (Instructors 1, 2, and 3) and time (pretest, midterm, and final) on scores. A
    significant `time × instructor` interaction was present (`F (4,36) = 58.10`, `p
    < .001`). In addition, the main effect for time was significant (`F (2,36) = 817.95`,
    `p < .001`). The main effect for instructor was not significant (`F (2,18) = .039`,
    `p > .05`).


    ![](Images/fig00177.jpg)


    With significant interactions, it is often helpful to provide a graph with the
    descriptive statistics. By selecting the `Plots` option in the main dialog box,
    you can make graphs of the interaction like the one below. Interactions add considerable
    complexity to the interpretation of statistical results. Consult a research methods
    text or ask your instructor for more help with interactions.

