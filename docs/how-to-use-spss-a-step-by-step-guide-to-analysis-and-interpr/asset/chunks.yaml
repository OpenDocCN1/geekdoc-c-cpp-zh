    虽然参数检验寻找的是均值（Means）的差异，但计算非参数检验的数据通常不适用于均值的计算（例如，它们是名义或顺序数据的）。


    因此，非参数检验的第一个问题是你感兴趣的是比例的差异（用于名义数据），还是秩的差异（用于顺序数据）。


    * 如果你正在寻找比例差异，请查看 `Branch 27`。

    * 如果你正在寻找秩差异，请查看 `Branch 30`。


    ## Branch 27


