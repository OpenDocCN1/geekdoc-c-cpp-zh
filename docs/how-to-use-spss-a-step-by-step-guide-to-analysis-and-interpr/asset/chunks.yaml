    ## 1.1 节 启动 SPSS


    SPSS 的启动程序会略有不同，取决于安装它的机器的配置。如果你很难找到它，请查看开始菜单中的 IBM SPSS Statistics 部分。本文使用 Windows
    版 SPSS 的截图。MacOS 和 Unix 版本具有相同的功能，但外观可能与此处描述的有所不同。


    ![](img/fig00005.jpg)


    启动 SPSS 时，你可能会看到上面的对话框，这取决于你的系统管理员为你的程序版本选择的选项。如果你看到了对话框，点击数据并确定，这将显示一个空白数据窗口。(1)
    如果没有看到对话框，SPSS 应该会自动打开空白数据窗口。


    数据窗口和输出窗口提供了 SPSS 的基本界面。下方显示空白数据窗口。


    ## 1.2 节 输入数据


    使用 SPSS 的关键之一是了解它是如何存储和使用数据的。为了说明数据输入的基本知识，我们将使用一份发给四个不同班级的调查表（周二/周四上午、周二/周四下午、周一/周五上午和周一/周五下午）。调查问了学生们是否是“晨型人”以及是否工作。该调查还询问了他们的最终成绩（100%
    为最高）。以下是两个学生的答卷：


    | 答卷 1 | | | | |

    | ID | 4593 | | | |

    | 上课日期 | | 周一周五 | 周二周四 |

    | 上课时间 | | | 上午 | 下午 |

    | 你是晨型人吗？ | | | 是 | X | 否 |

    | 最终成绩 | 85% | | | |

    | 你是否工作？ | | | 全职 | | 兼职 |

    | | | X | 否 | |


    | 答卷 2 | | | | | |

