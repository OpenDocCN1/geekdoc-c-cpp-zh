- fmt: '

    To select the Pearson correlation coefficient, click Analyze, then Correlate,
    then Bivariate (bivariate refers to two variables). This will bring up the Bivariate
    Correlations dialog box. This example uses the `HEIGHT.sav` data file entered
    at the start of [Chapter 4](#Ch04.xhtml_ht0085).


    ![](Images/fig00095.jpg)


    Move at least two variables from the box at the left into the box at the right
    by using the transfer arrow (or by double-clicking each variable). Make sure that
    a check is in the Pearson box under Correlation Coefficients. It is acceptable
    to move more than two variables.


    For our example, we will move all three variables over and click OK.


    ![](Images/fig00096.jpg)


    ### Reading the Output


    The output consists of a correlation matrix. Every variable you entered in the
    command is represented as both a row and a column. We entered three variables
    in our command. Therefore, we have a 3 × 3 table. There are also three rows in
    each cell—the correlation, the significance level, and the N. If a correlation
    is significant at less than the .05 level, a single * will appear next to the
    correlation. If it is significant at the .01 level or lower, ** will appear next
    to the correlation. For instance, all of the correlations in the output above
    have a significance level of < .01, so they are flagged with ** to indicate that
    they are less than .01.


    ![](Images/fig00097.jpg)


    To read the correlations, select a row and a column. For instance, the correlation
    between height and weight is determined through selection of the `WEIGHT` row
    and the `HEIGHT` column (.806). We get the same answer by selecting the `HEIGHT`
    row and the `WEIGHT` column. The correlation between a variable and itself is
    always 1, so there is a diagonal set of 1s.


    ### Drawing Conclusions


    The correlation coefficient will be between –1.0 and +1.0. Coefficients close
    to 0.0 represent a weak relationship. Coefficients close to 1.0 or –1.0 represent
    a strong relationship. Generally, correlations with an absolute value greater
    than 0.7 are considered strong. Correlations with an absolute value less than
    0.3 are considered weak. Correlations with an absolute value between 0.3 and 0.7
    are considered moderate. Positive correlations indicate that as one variable gets
    larger, the other variable also gets larger. Negative correlations indicate that
    as one variable gets larger, the other variable gets smaller.


    Significant correlations are flagged with asterisks. A significant correlation
    indicates a reliable relationship, but not necessarily a strong correlation. With
    enough participants, a very small correlation can be significant. See [Appendix
    A](#Apendix1.xhtml_ht0344) for a discussion of effect sizes for correlations.
    Note the significance level of .000 for some relationships. This is, in fact,
    a significance level of < .001\. The actual alpha level rounds down to .000, but
    it is not zero.


    ### Phrasing Results That Are Significant


    In the preceding example, we obtained a correlation of .806 between `HEIGHT` and
    `WEIGHT`. A correlation of .806 is a strong positive correlation, and it is significant
    at the .001 level. Thus, we could state the following in a results section:


    A Pearson correlation coefficient was calculated for the relationship between
    participants’ height and weight. A strong positive correlation was found (r (14)
    = .806, p < .001), indicating a significant linear relationship between the two
    variables. Taller participants tend to weigh more.


    The conclusion states the direction (positive), strength (strong), value (.806),
    degrees of freedom (14), and significance level (< .001) of the correlation. In
    addition, a statement of direction is included (taller is heavier).


    Note that the degrees of freedom given in parentheses is 14\. The output indicates
    an N of 16\. While most SPSS procedures give degrees of freedom, the `Correlation`
    command gives only the N (the number of pairs). For a correlation, the degrees
    of freedom is N – 2.


    ### Phrasing Results That Are Not Significant


    Using our `SAMPLE.sav` dataset from the previous chapters, we can calculate a
    correlation between `ID` and `GRADE`. If we do so, we get the output shown here.
    The correlation has a significance level of .783\. Thus, we could write the following
    in a results section (note that the degrees of freedom is N – 2):


    ![](Images/fig00098.jpg)


    A Pearson correlation was calculated examining the relationship between participants’
    ID numbers and grades. A weak correlation that was not significant was found (r
    (2) = .217, p > .05). ID number is not related to grade in the course.


    ### Practice Exercise


    Use Practice Dataset 2 in [Appendix B](#Apendix2.xhtml_ht0356). Determine the
    value of the Pearson correlation coefficient for the relationship between `SALARY`
    and `YEARS OF EDUCATION`, and phrase your results.


    ## Section 5.2 Spearman Correlation Coefficient


    ### Description


    The Spearman correlation coefficient determines the strength of the relationship
    between two variables. It is a nonparametric procedure. Therefore, it is weaker
    than the Pearson correlation coefficient, but it can be used in more situations.


    ### Assumptions


    Because the Spearman correlation coefficient functions on the basis of the ranks
    of data, it requires ordinal (or interval or ratio ) data for both variables.
    They do not need to be normally distributed.


    ### SPSS Data Format


    Two variables are required in your SPSS data file. Each subject must provide data
    for both variables.


    ### Running the Command


    ![](Images/fig00099.jpg)


    Using the `HEIGHT.sav` file created in [Chapter 4](#Ch04.xhtml_ht0085), click
    Analyze, then Correlate, then Bivariate. This will bring up the main dialog box
    (just like the Pearson correlation). Half down the dialog box, there is a section
    for indicating the type of correlation you will compute. For our example, remove
    the check in the Pearson box (by clicking on it) and click on the Spearman box.


    ![](Images/fig00100.jpg)


    Using the variables `HEIGHT` and `WEIGHT`. This is also one of the few commands
    that allows you to choose a one-tailed test, if desired.


    ### Reading the Output


    The output is essentially the same as for the Pearson correlation. Each pair of
    variables has its correlation indicated twice. The Spearman rho can range from
    –1.0 to +1.0, just like the Pearson r.


    ![](Images/fig00101.jpg)


    The output listed above indicates a correlation of .883 between `HEIGHT` and `WEIGHT`.
    Note the significance level of .000, shown in the `Sig. (2-tailed)` row. This
    is, in fact, a significance level of < .001\. The actual alpha level rounds down
    to .000, but it is not zero.

