    This brings up the Descriptives dialog box. Note that the left side of the box
    contains a list of all the variables in our data file. On the right is an area
    labeled `Variable(s)`, where we can specify the variables we would like to use
    in this particular analysis.


    ![](Images/fig00022.jpg)


    We want to compute the mean for the variable called `GRADE`. Thus, we need to
    select the variable name in the left window (by clicking on it). To transfer it
    to the right window, click on the right arrow between the two windows. The arrow
    always points to the window opposite the highlighted item and can be used to transfer
    selected variables in either direction. Note that double-clicking on the variable
    name will also transfer the variable to the opposite window. Standard Windows
    conventions of “Shift” clicking or “Ctrl” clicking to select multiple variables
    can be used as well. Note: Some configurations of SPSS show the variable names,
    and others show the variable labels (if any). This can be changed under `Edit`
    → `Options` → `General`.


    When we click on the `OK` button, the analysis will be conducted, and we will
    be ready to examine our output.


    ## Section 1.6 Examining and Printing Output Files


    After an analysis is performed, the output is placed in the output window, and
    the output window becomes the active window. If this is the first analysis you
    have conducted since starting SPSS, then a new output window will be created.
    If you have run previous analyses and saved them, your output is added to the
    end of your previous output.


    To switch back and forth between the data window and the output window, select
    the desired window from the `Window` menu bar. Alternately, you can select the
    window using the taskbar at the bottom of the screen.


    ![](Images/fig00023.jpg)


    The output window is split into two sections. The left section is an outline of
    the output (SPSS refers to this as the outline view). The right section is the
    output itself.


    ![](Images/fig00024.jpg)


    The section on the left of the output window provides an outline of the entire
    output window. All of the analyses are listed in the order in which they were
    conducted. Note that this outline can be used to quickly locate a section of the
    output. Simply click on the section you would like to see, and the right window
    will jump to the appropriate place.


    Clicking on a statistical procedure also selects all of the output for that command.
    By pressing the `Delete` key, that output can be deleted from the output window.
    This is a quick way to be sure that the output window contains only the desired
    output. Output can also be selected and pasted into a word processor or spreadsheet
    by clicking `Edit`, then `Copy` to copy the output. You can then switch to your
    word processor and click `Edit`, then `Paste`.


    To print your output, simply click `File`, then `Print`, or click on the printer
    icon on the toolbar. You will have the option of printing all of your output or
    just the currently selected section. Be careful when printing! Each time you run
    a command, the output is added to the end of your previous output. Thus, you could
    be printing a very large output file containing information you may not want or
    need.


    One way to ensure that your output window contains only the results of the current
    command is to create a new output window just before running the command. To do
    this, click `File`, then `New`, then `Output`. All your subsequent commands will
    go into your new output window.


    You can also save your output files as SPSS format files (`.spv` extension). Note
    that SPSS saves whatever window you have open. If you are on a data window you
    will save your data. If you are on an output window it will save your output.


    ### Practice Exercise


    Load the sample data file you created earlier (`SAMPLE.sav`). Run the `Descriptives`
    command for the variable `GRADE`, and print the output. Next, select the data
    window and print it.


    ## Section 1.7 Modifying Data Files


    Once you have created a data file, it is really quite simple to add additional
    cases (rows/participants) or additional variables (columns). Consider Example
    1.7.1.


    ### Example 1.7.1


    Two more students provide you with surveys. Their information is as follows:


    | Response Sheet 3 |  |  |  |  |

    | :--- | :--- | :--- | :--- | :--- |

    | ID: | 8734 |  |  |  |

    | Day of class: | ___ | MWF | X | TTh |

    | Class time: | X | Morning |  | Afternoon |

    | Are you a morning person? | ___ | Yes | X | No |

    | Final grade in class: | 80% |  |  |  |

    | Do you work outside school? | ___ | Full-time | ___ | Part-time |

    |  | X | No |  |  |


    | Response Sheet 4 |  |  |  |  |

    | :--- | :--- | :--- | :--- | :--- |

    | ID: | 1909 |  |  |  |

    | Day of class: | X | MWF | ___ | TTh |

    | Class time: | X | Morning | ___ | Afternoon |

    | Are you a morning person? | X | Yes | ___ | No |

    | Final grade in class: | 73% |  |  |  |

    | Do you work outside school? | ___ | Full-time | X | Part-time |

    |  | ___ | No |  |  |


    ![](Images/fig00025.jpg)


    To add these data, simply place two additional rows in the `Data View` window
    (after loading your sample data). Notice that as new participants are added, the
    row numbers become bold. When done, the screen should look like the screenshot
    above.


    New variables can also be added. For example, if the first two participants were
    given special training on time management, and the two participants were not,
    the data file can be changed to reflect this. The new variable could be called
    `TRAINING`, and it would be coded so that `0` = No and `1` = Yes. To do this,
    switch to the `Variable View` window, then add `TRAINING` to the bottom of the
    list. Then switch back to the `Data View` window to update the data.


    ![](Images/fig00026.jpg)


    Adding data and variables are logical extensions of the procedures we used to
    create the data. Save this new file. We will be using it again in this book.


    ### Practice Exercise


    Follow the previous example (where `TRAINING` is the new variable). Make the modifications
    to your `SAMPLE.sav` data file and save it.


