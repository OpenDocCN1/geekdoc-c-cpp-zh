    要选择皮尔逊相关系数，请点击分析（Analyze），然后点击相关（Correlate），最后点击双变量（Bivariate，双变量指两个变量）。这将打开双变量相关对话框。本示例使用了第
    4 章开始处输入的 `HEIGHT.sav` 数据文件。


    ![](img/fig00095.jpg)


    使用传输箭头（或双击每个变量）从左侧框移动至少两个变量到右侧框中。确保相关系数（Correlation Coefficients）下的皮尔逊（Pearson）框中已勾选。移动两个两个变量是可以接受的。


    对于我们的示例，我们将三个变量都移过去并点击确定。


    ![](img/fig00096.jpg)


    ### 读取输出结果


    输出由一个相关矩阵组成。你在命令中输入的每个变量都以行和列的形式表示。我们在命令中输入了三个变量，因此我们有一个 3 × 3 的表格。每个单元格中还有三行——相关系数、显著性水平和
    N（量）。如果相关性在小于 .05 的水平上显著，则相关系数旁边会出现单个 **。如果它在 .01 水平或更低水平显著，则相关系数旁边会出现 **。例如，上述输出中的所有相关性显著性水平均
    < .01，因此它们被标记为 **，以表示它们小于 .01。


    ![](img/fig00097.jpg)


    要读取相关性，请选择一行和一列。例如，身高与体重之间的相关性是通过选择 `WEIGHT` 行和 `HEIGHT` 列确定的（.806）。选择 `HEIGHT`
    行和 `WEIGHT` 列得到相同的答案。变量与其自身的相关性始终为 1，因此有一组对角线上的 1。


    ### 得出结论


    相关系数介于 –1.0 和 +1.0 之间。接近 0.0 的系数表示关系较弱。接近 1.0 或 –1.0 的系数表示关系强烈。通常，绝对值大于 0.7 的相关性被认为强相关。绝对值小于
    0.3 的相关性被认为弱相关。绝对值在 0.3 到 0.7 之间的相关性被认为中等相关。正相关表示随着一个变量的变大，另一个变量也变大。负相关表示随着一个变量的变大，另一个变量变小。


    显著相关性用星号标记。显著相关性表示存在可靠的关系，但不一定是强相关。只要参与者足够多，极小的相关性也可以显著的。关于相关性效应量的讨论，请参见附录 A。注意某些关系的显著性水平为
    .000。这实际上是 < .001 的显著性水平。实际的 alpha 水平向下舍入为 .000，但它并不是零。


    ### 阐述显著的结果


    在前面的示例中，我们得到 `HEIGHT` 和 `WEIGHT` 之间的相关性为 .806。.806 的相关性是强正相关，且在 .001 水平上显著。因此，我们可以在结果部分这样陈述：


    对参与者身高与体重之间的关系计算了皮尔逊相关系数。发现存在强正相关（r (14) = .806, p < .001），表明两个变量之间存在显著的线性关系。较高的参与者往往体重重。


    ### 结论指出了相关性的方向（正）、强度（强）、数值（.806）、自由度（14）和显著性水平 (< .001）。此外，还包含了方向性的陈述（越高越重）。


    注意括号中给出的自由度是 14。输出显示 N 为 16。虽然大多数 SPSS 程序提供自由度，但 `Correlation` 命令只提供 N（对数）。对于相关性，自由度是
    N – 2。


    ### 阐述不显著的结果


    使用我们之前章节中的 `SAMPLE.sav` 数据集，我们可以计算 `ID` 和 `GRADE` 之间的相关性。如果这样做，我们将得到此处所示的输出。相关性的显著性水平为
    .783。因此，我们可以在结果部分这样写（注意自由度为 N – 2）：


    ![](img/fig00098.jpg)


    通过计算皮尔逊相关系数检验了参与者 ID 编号与成绩之间的关系。发现存在不显著的弱相关（r (2) = .217, p > .05）。在该课程中 ID 编号与成绩无关。


    ### 练习题


    使用附录 B 中的练习数据集 2。确定 `SALARY` 和 `YEARS OF EDUCATION` 之间关系的皮尔逊相关系数值，并阐述你的结果。


    ## 5.2 节斯皮曼相关系数


    ### 描述


    斯皮曼相关系数确定两个变量之间关系的强度。它是一种非参数程序。因此，它比皮尔逊相关系数弱，但它可以适用于更多情况。


    ### 假设


    由于斯皮曼相关系数基于数据的秩运行，因此它要求两个变量都是定序数据（或间距或比例数据）。它们不需要服从正态分布。


    ### SPSS 数据格式


    你的 SPSS 数据文件中需要两个变量。每个受者必须提供两个变量的数据。


    ### 执行命令


    ![](img/fig00099.jpg)


    使用第 4 章创建的 `HEIGHT.sav` 文件，点击分析（Analyze），然后点击相关（Correlate），最后点击双变量（Bivariate）。这将打开主对话框（与皮尔逊相关相同）。在对话框下方，有一个部分用于指定要计算的相关性类型。对于我们的示例，取消皮尔逊框的勾选（点击它），并点击斯皮曼（Spearman）框。


    ![](img/fig00100.jpg)


    使用变量 `HEIGHT` 和 `WEIGHT`。这也是允许你选择单侧检验的命令之一。


    ### 读取输出结果


    输出与皮尔逊相关性基本相同。每对变量都显示两次相关性。斯皮曼 rho 的范围可以从 –1.0 到 +1.0，就像皮尔逊 r 一样。


    ![](img/fig00101.jpg)


    上述输出显示 `HEIGHT` 和 `WEIGHT` 之间的相关性为 .883。注意 `Sig. (2-tailed)` 行显示的显著性水平 .000。这实际上是
    < .001 的显著性水平。实际的 alpha 水平向下舍入为 .000，但它并不是零。


