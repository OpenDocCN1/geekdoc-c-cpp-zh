    ![](Images/fig00178.jpg)


    ### Phrasing Results That Are Not Significant


    If our results had not been significant, we could have stated the following (note
    that the `F` values are fictitious):


    A `3 × 3` mixed-design ANOVA was calculated to examine the effects of the instructor
    (Instructors 1, 2, and 3) and time (pretest, midterm, and final) on scores. No
    significant main effects or interactions were found. The time × instructor interaction
    (`F (4,36) = 1.10, p > .05`), the main effect for time (`F (2,36) = 1.95, p >
    .05`), and the main effect for instructor (`F (2,18) = .039, p > .05`) were not
    significant. Exam scores were not influenced by either time or instructor.


    ### Practice Exercise


    Use Practice Dataset 3 in [Appendix B](#Apendix2.xhtml_ht0356). Determine if anxiety
    levels changed over time for each of the treatment (`CONDITION`) types. How did
    time change anxiety levels for each treatment? Write a statement of results.


    ## Section 7.6 Analysis of Covariance


    ### Description


    Analysis of covariance (ANCOVA) allows you to remove the effect of a known covariate.
    In this way, it becomes a statistical method of control. With methodological controls
    (e.g., random assignment), internal validity is gained. When such methodological
    controls are not possible, statistical controls can be used.


    ANCOVA can be performed by using the `GLM` command if you have repeated-measures
    factors. Because the `GLM` command is not included in the Base Statistics module,
    it is not included here.


    ### Assumptions


    ANCOVA requires that the covariate be significantly correlated with the dependent
    variable. The dependent variable and the covariate should be at the interval or
    ratio levels. In addition, both should be normally distributed.


    ### SPSS Data Format


    The SPSS data file must contain one variable for each independent variable, one
    variable representing the dependent variable, and at least one covariate.


    ### Running the Command


    ![](Images/fig00179.jpg)


    The Factorial ANOVA command is used to run ANCOVA. To run it, click Analyze, then
    General Linear Model, then Univariate. Follow the directions discussed for factorial
    ANOVA, using the `HEIGHT.sav` sample data file. Place the variable `HEIGHT` as
    your Dependent Variable. Enter `SEX` as your Fixed Factor, then `WEIGHT` as the
    Covariate. This last step determines the difference between regular factorial
    ANOVA and ANCOVA. Click OK to run the ANCOVA.


    ![](Images/fig00180.jpg)


    ### Reading the Output


    The output consists of one main source table (shown below). This table gives you
    the main effects and interactions you would have received with a normal factorial
    ANOVA. In addition, there is a row for each covariate. In our example, we have
    one main effect (`SEX`) and one covariate (`WEIGHT`). Normally, we examine the
    covariate line only to confirm that the covariate is significantly related to
    the dependent variable.


    ### Drawing Conclusions


    This sample analysis was performed to determine if males and females differ in
    height after weight is accounted for. We know that weight is related to height.
    Rather than match participants or use methodological controls, we can statistically
    remove the effect of weight.


    When giving the results of ANCOVA, we must give `F`, degrees of freedom, and significance
    levels for all main effects, interactions, and covariates. If main effects or
    interactions are significant, post-hoc tests must be conducted. Descriptive statistics
    (mean and standard deviation) for each level of the independent variable should
    also be given. To obtain descriptive statistics check Descriptive statistics under
    Options.


    ![](Images/fig00181.jpg)![](Images/fig00182.jpg)


    ### Phrasing Results That Are Significant


    The previous example obtained a significant result, so we could state the following:


    A one-way between-subjects ANCOVA was calculated to examine the effect of sex
    on height, covarying out the effect of weight. Weight was significantly related
    to height (`F (1,13) = 112.11, p < .001`). The main effect for sex was significant
    (`F (1,13) = 62.02, p < .001`), with males significantly taller (`M = 69.38, sd
    = 3.70`) than females (`M = 64.50, sd = 2.33`).


    ### Phrasing Results That Are Not Significant


    If the covariate is not significant, we need to repeat the analysis without including
    the covariate (i.e., run a normal ANOVA).


    For ANCOVA results that are not significant, you could state the following (note
    that the F values are made up for this example):


    A one-way between-subjects ANCOVA was calculated to examine the effect of sex
    on height, covarying out the effect of weight. Weight was significantly related
    to height (`F (1,13) = 112.11, p < .001`). The main effect for sex was not significant
    (`F (1,13) = 62.02, p > .05`), with males not being significantly taller (`M =
    69.38, sd = 3.70`) than females (`M = 64.50, sd = 2.33`), even after covarying
    out the effect of weight.


    ### Practice Exercise


