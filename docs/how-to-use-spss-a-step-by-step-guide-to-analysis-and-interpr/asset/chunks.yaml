    # 如何使用 SPSS®


    《如何使用 SPSS®》专为计算机初级用户设计，适用于此前没有使用 SPSS 经验的人士。书中每一章都分为若干个短章节，描述了所使用的统计方法、重要的底层假设，以及如何解释结果并在研究报告中表达这些结果。


    本书从基础知识开始，例如启动 SPSS、定义变量以及数据的输入和保存。它涵盖了初级统计学课程中教授的所有主要统计技术，如描述性统计、数据绘图、预测与关联、参数推断统计、非参数推断统计以及用于检验构建的统计。


    书中提供的 250 多张截图（包括示例输出），让学生在跟随使用 SPSS 时能清楚地看到将要面对的内容。书中包含统计学术语表和练习题。一套完整的在线资源（包括面向学生的视频教程和输出文件，以及面向讲师的
    PowerPoint 幻灯片和题库问题）使得《如何使用 SPSS®》成为学习 SPSS 的权威且经过实地测试的资源。


    ## 本版更新：


    *   完全更新至 SPSS 24 和 IBM SPSS Statistics Cloud

    *   新增关于方差分析（ANOVA）的章节

    *   新增关于评分者信度的新材料

    *   新增关于语法（Syntax）的新材料

    *   增加了对数据输入和管理的涵盖


    Brian C. Cronk 是美国密苏里西部州立大学心理学系教授兼系主任（1993 年毕业于威斯康星大学密尔沃分心理学博士）。


