    相应的检验是`混合设计方差分析`（Mixed-Design ANOVA）。该检验在本文第 7.4 节中有详细介绍。在 SPSS 中的访问路径为 `Analyze
    → General Linear Model → Repeated Measures`。


    注意：此检验需要安装 `Advanced Module`。


    ## Branch 26


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

