    ## Section 5.2 Spearman Correlation Coefficient


    ### Description


    The Spearman correlation coefficient determines the strength of the relationship
    between two variables. It is a nonparametric procedure. Therefore, it is weaker
    than the Pearson correlation coefficient, but it can be used in more situations.


    ### Assumptions


    Because the Spearman correlation coefficient functions on the basis of the ranks
    of data, it requires ordinal (or interval or ratio ) data for both variables.
    They do not need to be normally distributed.


    ### SPSS Data Format


    Two variables are required in your SPSS data file. Each subject must provide data
    for both variables.


    ### Running the Command


    ![](Images/fig00099.jpg)


    Using the HEIGHT.sav file created in [Chapter 4](#Ch04.xhtml_ht0085), click Analyze,
    then Correlate, then Bivariate. This will bring up the main dialog box for Bivariate
    Correlations (just like the Pearson correlation). About halfway down the dialog
    box, there is a section for indicating the type of correlation you will compute.
    You can select as many correlations as you want. For our example, remove the check
    in the Pearson box (by clicking on it) and click on the Spearman box.


    ![](Images/fig00100.jpg)


    Use the variables HEIGHT and WEIGHT. This is also one of the few commands that
    allows you to choose a one-tailed test, if desired.


    ### Reading the Output


    The output is essentially the same as for the Pearson correlation. Each pair of
    variables has its correlation coefficient indicated twice. The Spearman rho can
    range from –1.0 to +1.0, just like the Pearson r.


    ![](Images/fig00101.jpg)


    The output listed above indicates a correlation of .883 between HEIGHT and WEIGHT.
    Note the significance level of .000, shown in the “Sig. (2-tailed)” row. This
    is, in fact, a significance level of < .001\. The actual alpha level rounds down
    to .000, but it is not zero.


    ### Drawing Conclusions


    The correlation will be between –1.0 and +1.0\. Scores close to 0.0 represent
    a weak relationship. Scores close to 1.0 or –1.0 represent a strong relationship.
    Significant correlations are flagged with asterisks. A significant correlation
    indicates a reliable relationship, but not necessarily a strong correlation. With
    enough participants, a very small correlation can be significant. Generally, correlations
    greater than 0.7 are considered strong. Correlations less than 0.3 are considered
    weak. Correlations between 0.3 and 0.7 are considered moderate.


    ### Phrasing Results That Are Significant


    In the prior example, we obtained a correlation of .883 between HEIGHT and WEIGHT.
    A correlation of .883 is a strong positive correlation, and it is significant
    at the .001 level. Thus, we could state the following in a results section:


    A Spearman rho correlation coefficient was calculated for the relationship between
    participants’ height and weight. A strong positive correlation was found (rho
    (14) = .883, p < .001), indicating a significant relationship between the two
    variables. Taller participants tend to weigh more.'
