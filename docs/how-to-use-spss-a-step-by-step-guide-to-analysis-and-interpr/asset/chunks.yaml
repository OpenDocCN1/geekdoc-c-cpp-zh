    ## 第 5.1 节 皮尔逊相关系数


    ### 描述


    皮尔逊相关系数（有时称为皮尔逊积矩相关系数或简单的皮尔逊 r）决定两个变量之间线性关系的强度。


    ### 假设


    两个变量都应在间距或比例尺度上测量（或作为二分名义变量）。如果它们之间存在关系，该关系应该是线性的。由于皮尔逊相关系数是使用 `zscores` 计算的，因此两个变量都应符合正态分布。如果你的数据不符合这些假设，请考虑使用斯皮尔曼
    rho 相关系数。


    ### SPSS 数据格式


    你的 SPSS 数据文件中需要两个变量。每个受试者都必须具有两个变量的数据。


    ### 执行命令


