    ![](img/fig00219.jpg)


    要运行命令，点击 `Analyze`（分析）、然后 `Nonparametric Tests`（非参数检验），最后 `Independent Samples`（独立样本）。这将弹出下方的主对话框。


    ![](img/fig00220.jpg)


    保持 `Objective`（目标）不变，点击 `Fields`（字段）选项卡。


    ![](img/fig00221.jpg)


    将 `LONG` 移动到 `Test Fields`（检验字段）区域，并将 `EXPERIENCE` 移动到 `Groups`（组）区域。


    ![](img/fig00222.jpg)


    选择 `Settings`（设置）选项卡并点击 `Customize tests`（自定义检验），选择 `Kruskal-Wallis 1-way ANOVA`。同样选择
    `Multiple comparisons`（多重比较）并选择 `All pairwise`（两两比较）。正如参数单方差分析需要事后检验一样，非参数版本也需要。这一步将让
    SPSS 为我们计算。点击 `Run`（运行）执行分析。


    ### 读取输出

    ![](img/fig00223.jpg)


    输出由简化的自然语言 `Model Viewer` 组成。这里告诉我们 `LONG` 的分布在所有 `EXPERIENCE` 水平上都是相同的。我们可以双击输出获取
    Model Viewer。


    ![](img/fig00224.jpg)![](img/fig00225.jpg)


    为了获得两两比较，我们需要修改视图。在屏幕底部（上方所示面板中）是 `View`（视图）命令。点击该命令并选择 `Pairwise Comparisons`（两两比较）。


    选择 `Pairwise Comparisons` 后，`Model Viewer` 的右侧将改变。底部将显示以下表格：


    ![](img/fig00226.jpg)


    该表显示 `EXPERIENCE 2` 与 `EXPERIENCE 0` 有显著差异。然而，另外两个比较之间没有显著差异。


    ### 得出结论

    与单方差分析一样，Kruskal-Wallis 检验假设组间相等。因此，显著结果表明至少有一个组与另一个组不同。`Pairwise Comparisons`
    命令将允许我们确定哪些组存在差异。


    ### 显著结果的表述

    前面的示例是显著的，因此我们可以这样说明：


    通过 Kruskal-Wallis 检验比较了不同经验水平跑步者的长距离赛结果。发现显著结果（`H(2) = 9.846`，`p < .01`），表明各组之间存在差异。事后两两比较显示，经验丰富的跑步者表现显著优于没有经验的跑步者。


