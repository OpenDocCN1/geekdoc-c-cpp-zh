    a cursor will be present and you can edit the text as you would in a word processing
    program. If you would like to change another attribute of the element (e.g., the
    color or font size), use the Properties box.


    ![](Images/fig00093.jpg)


    With a little practice, you can make excellent graphs using SPSS. Once your graph
    is formatted the way you want it, simply select File, then Close.


    # [Chapter 5


    Prediction and Association](#contents.xhtml_bck_ht0112)


    ## Section 5.1 Pearson Correlation Coefficient


    ### Description


    The Pearson correlation coefficient (sometimes called the Pearson product-moment
    correlation coefficient or simply the Pearson r) determines the strength of the
    linear relationship between two variables.


    ### Assumptions


    Both variables should be measured on interval or ratio scales (or as a dichotomous
    nominal variable). If a relationship exists between them, that relationship should
    be linear. Because the Pearson correlation coefficient is computed with z-scores,
    both variables should also be normally distributed. If your data do not meet these
    assumptions, consider using the Spearman rho correlation coefficient instead.


    ### SPSS Data Format


    Two variables are required in your SPSS data file. Each subject must have data
    for both variables.


    ### Running the Command


