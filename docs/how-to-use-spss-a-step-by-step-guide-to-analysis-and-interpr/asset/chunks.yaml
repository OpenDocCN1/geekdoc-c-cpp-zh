    单因素方差分析（one-way ANOVA）需要一个因变量和一个自变量。参与者所属的分组由自变量的值决定。各组之间应该是相互独立的。如果我们的参与者属于多个小组，则我们需要进行重复测量方差分析。如果我们有多个自变量，则应该进行析方差分析。


    方差分析还假设因变量处于间距尺度或比例水平，且符合正态分布，并且自变量每个水平下的因变量方差齐相等。


    ### SPSS 数据格式


    SPSS 数据文件中需要两个变量。一个变量作为因变量，另一个作为自变量。每个参与者对因变量应提供一个分数。


    ### 运行命令


    在本例中，我们将使用上一节中创建的 `GRADES.sav` 数据文件。


    ![](img/fig00151.jpg)


    要进行单因素方差分析，请点击 `Analyze`（分析），选择 `Compare Means`（均值比较），最后点击 `One-Way ANOVA`（单因素）。这将弹出该命令的主对话框。


    ![](img/fig00152.jpg)


    你应当将自变量放在 `Factor`（因子）框中。在我们的示例中，`INSTRUCT` 代表三个不同的老师，它将作为我们的自变量。我们的因变量将是 `FINAL`。这项测试允许我们确定老师对课程的最终成绩是否有任何影响。


    ![](img/fig00153.jpg)


    点击 `Options`（选项）进入上述的选项对话框。点击 `Descriptive`（描述性统计）。这将为你提供因变量在自变量每个水平上的均值。勾选此框可以避免我们单独运行
    `Means`（均值）命令。点击 `Continue`（继续）返回主对话框。


    ![](img/fig00154.jpg)


    接下来，点击 `Post Hoc`（事后检验）打开上述所示的事后多重比较对话框。点击 `Tukey`，然后点击 `Continue`。


    在方差分析结果显著的情况下，事后检验是必要的。方差分析仅指示是否存在某组与其他组之间存在差异。如果结果显著，我们需要确定哪些组与哪些其他组存在差异。我们可以通过
    `t tests` 来确定，但会遇到之前提到的会膨胀第一类错误率相同的问题。


    有几种可以修正多次比较的事后比较。最广泛使用的是 `Tukey’s HSD`。SPSS 将为你计算各种事后检验。请参阅高级统计学书籍以讨论这些不同检验之间的差异。


    ### 读取输出


    将给出每个老师（即自变量的水平）以及总计的描述性统计。例如，在自己的班级中，老师 1 的最终考试平均分数为 79.57。


    ![](img/fig00155.jpg)


