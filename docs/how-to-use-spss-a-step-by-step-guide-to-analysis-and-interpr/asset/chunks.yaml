    ## Section 7.7 Analysis of Variance (MANOVA)


    ### Description


    Multivariate tests involve more than one dependent variable. While ANOVA looks
    at one variable at a time, MANOVA looks at all variables at once.


    This procedure requires `SAT.sav`. Enter the dependent variables (SAT and GRE,
    in this case) in the Dependent Variables box. Enter the independent variable (GROUP,
