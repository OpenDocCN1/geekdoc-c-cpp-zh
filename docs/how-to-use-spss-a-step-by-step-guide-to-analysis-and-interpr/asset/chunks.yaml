    SPSS requires one variable for the dependent variable and one variable for each
    independent variable. If we have any independent variable that is represented
    as multiple variables (e.g., `PRETEST` and `POSTTEST`), we must use the repeated-measures
    ANOVA.


    ## Running the Command


    ![](Images/fig00160.jpg)


    This example uses the `GRADES.sav` data file from earlier in this chapter. Click
    `Analyze`, then `General Linear Model`, then `Univariate`.


    ![](Images/fig00161.jpg)


    This will bring up the main dialog box for `Univariate ANOVA`. Select the dependent
    variable and place it in the `Dependent Variable` blank (use `FINAL` for this
    example). Select one of your independent variables (`INSTRUCT` in this case),
    and place it in the `Fixed Factor(s)` box. Place the second independent variable
    (`REQUIRED`) in the `Fixed Factor(s)` box. Having defined the analysis, now click
    `Options`.


    ![](Images/fig00162.jpg)


    When the `Options` dialog box comes up, click `Descriptive statistics`. This will
    provide you with means for each main effect and interaction term. Click `Continue`.


    If you were to select `Post Hoc`, SPSS would run post-hoc analyses for the main
    effects but not for the interaction term. Click `OK` to run the analysis.


    ### Reading the Output


    At the bottom of the output, you will find the means. We have six means representing
    the interaction of the two variables (this was a 3 × 2 design).


    ![](Images/fig00163.jpg)


    Participants who had `Instructor 1` (for whom the class was not required) had
    a mean final exam score of `79.67`. Students who had `Instructor 1` (for whom
    it was required) had a mean final exam score of `79.50`, and so on.


    The example we just ran is called a two-way ANOVA. This is because we had two
    independent variables. With a two-way ANOVA, we get three answers: a main effect
    for `INSTRUCT`, a main effect for `REQUIRED`, and an interaction result for `INSTRUCT*REQUIRED`.


    The source table below gives us these three answers (in the `INSTRUCT`, `REQUIRED`,
    and `INSTRUCT * REQUIRED` rows).


    ![](Images/fig00164.jpg)


    In the above example, none of the main effects or interactions were significant.
    In the statements of results, you must indicate `F`, two degrees of freedom (effect
    and residual/error), the significance level, and a verbal statement for each of
    the answers (three in this case). Note that most statistics books give a much
    simpler version of an ANOVA source table where the `Corrected Model`, `Intercept`,
    and `Corrected Total` rows are not included.


    ### Phrasing Results That Are Significant


    If we had obtained significant results in this example, we could make the statement
    that follows. (These are fictitious results. For the results that correspond to
    the example above, please see the section on phrasing results that are not significant.)


    A 3 (instructor) × 2 (required course) between-subjects factorial ANOVA was calculated
    comparing the final exam scores for participants who had one of three instructors
    and who took the course either as a required course or as an elective. A significant
    main effect for instructor was found (`F (2,15) = 10.112`, `p < .05`). Students
    who had `Instructor 1` had lower final exam scores (`M = 79.57`, `sd = 7.96`)
    than students who had `Instructor 3` (`M = 92.43`, `sd = 5.50`). Students who
    had `Instructor 2` (`M = 86.43`, `sd = 10.92`) were not significantly different
    from either of the other two groups. A significant main effect for whether or
    not the course was required was found (`F(1,15) = 38.44`, `p < .01`). Students
    who took the course because it was required did better (`M = 91.69`, `sd = 7.68`)
    than students who took the course as an elective (`M = 77.13`, `sd = 5.72`). The
    interaction was not significant (`F(2,15) = 1.15`, `p > .05`). The effect of the
    instructor was not influenced by whether or not the students took the course because
    it was required.


    Note that, in the above example, we would have had to conduct `Tukey’s HSD` to
    determine the differences for `INSTRUCT` (using the `Post Hoc` command). This
    is not necessary for `REQUIRED` because it has only two levels (and one must be
    different from the other).


    ### Phrasing Results That Are Not Significant


    Our actual results were not significant, so we can state the following:


    A 3 (instructor) × 2 (required course) between-subjects factorial ANOVA was calculated
    comparing the final exam scores for participants who had one of three instructors
    and who took the course as a required course or as an elective. The main effect
    for instructor was not significant (`F(2,15) = 3.30`, `p > .05`). The main effect
    for whether or not it was a required course was also not significant (`F(1,15)
    = . 42`, `p > .05`). Finally, the interaction was not significant (`F(2,15) =
    .136`, `p > .05`). Thus, it appears that neither the instructor nor whether or
    not the course is required has any significant effect on final exam scores.


    ### Practice Exercise


    Using `Practice Dataset 2` in [Appendix B](#Apendix2.xhtml_ht0356), determine
    if salaries are influenced by sex, job classification, or an interaction between
    sex and job classification. Write a statement of results.


    ## Section 7.4 Repeated-Measures ANOVA


    ### Description


    Repeated-measures ANOVA extends the basic ANOVA procedure to a within-subjects
    variable. It functions like paired-samples t test when more than two levels are
    compared.


    ### Assumptions


    The dependent variable should be normally distributed and measured on interval
    or ratio scale. Multiple measurements of the dependent variable should be from
    the same (or related) participants.


    ### SPSS Data Format


    At least three variables are required. Each variable in the data file should represent
    a single dependent variable at a single level of the independent variable. Thus,
    an analysis of a design with four levels of an independent variable would require
    four variables.


    If any variable represents a between-subjects effect, use the Repeated Measures
    ANOVA command instead.


    ### Running the Command


    ![](Images/fig00165.jpg)


    This example uses the `GRADES.sav` sample dataset. Recall that `GRADES.sav` includes
    three sets of grades—`PRETEST`, `MIDTERM`, and `FINAL`—that represent three different
    times during the semester. This allows us to analyze the effects of time on the
    test performance of our sample population. Click `Analyze`, then `General Linear
    Model`, then `Repeated Measures`.


    Note that this procedure requires an optional module. If you do not have this
    command, you do not have the necessary module installed. This procedure is NOT
    included in the SPSS Statistics GradPack Base.


    ![](Images/fig00166.jpg)


    After selecting the command, you will be presented with the `Repeated Measures
    Define Factor(s)` dialog box. This is where you identify the Within-Subject Factor
    (we will call it `TIME`). Enter 3 for the Number of Levels (three exams) and click
    `Add`.


    If we had more than one independent variable that had repeated measures, we could
    enter its name and click `Add`. Now click `Define`.


    ![](Images/fig00167.jpg)


    You will be presented with the `Repeated Measures` dialog box. Transfer `PRETEST`,
    `MIDTERM`, and `FINAL` to the `Within-Subjects Variables` section. The variable
    names should be ordered according to when they occurred in time (i.e., the values
    of the independent variable that they represent).


    ![](Images/fig00168.jpg)


    By moving `TIME` to the right and selecting `Descriptive statistics`, SPSS will
    calculate the means for the `TIME` effect. Click `Continue` to close the dialog
    box and `OK` to run the command.

