    ### 练习题


    使用附录 B 中的练习数据集 2。在抽取样本的总体中，20% 的员工是文员，50% 是技术人员，30% 是专业人员。确定抽取的样本是否符合这些值。提示：你需要自定义期望概率，并输入类别值（1,
    2, 3）和相对百分比（20, 50, 30）。此外，确保你已将变量 `CLASSIFY` 设置为名律（nominal）。


    ## 第 8.2 独立卡方检验


    ### 描述

    独立性检验用于检验两个变量是否相互独立。例如，抛硬币应该是独立事件，因此知道一次抛硬币的结果不会告诉我们关于第二次抛硬币的任何信息。独立性检验本质上是方差分析（ANOVA）中交互项的非参数版本。


    ### 假设

    所需的假设很少。例如，我们不对分布的形状不做任何假设。每个类别的期望频率至少为 1，且期望频率小于 5 的类别比例不超过 20%。（注意：为了节省空间，这些示例违反了该假设。）


    ### SPSS 数据格式

    至少需要两个变量。


    ### 执行命令

    ![](img/fig00198.jpg)


    独立性检验是 `Crosstabs`（交叉表）命令的一部分，而不是 `Nonparametric Statistics`（非参数统计）命令。更多详情请参见第
    3 章中多变量频率分布的第 3.2 节。


    ![](img/fig00199.jpg)


    此示例使用 `COINS.sav` 文件。`COIN1` 放在“行(Rows)”处，`COIN2` 放在“列(Columns)”处。


    ![](img/fig00200.jpg)


    点击“统计”(Statistics)，然后勾选“卡方”(Chi-square)。点击“继续”(Continue)。你可能还想点击“单元”(Cells)，除观测频率之外选择期望频率。


    ![](img/fig00201.jpg)


    注意，你也可以使用“单元”选项显示每个变量每个值的百分比。这当你的组大小不一时时特别有用，但在本示例中没有必要。


    点击“确定”(OK)运行分析。


    ### 读取输出

    输出由部分部分。第一部分给出计数。在本示例中，显示了实际频率和期望频率，因为通过“单元”选项选择了它们。


    输出的第二部分给出卡方检验的结果。最常用的值是皮尔逊卡方，显示在第一行（值为 .737）。


    ![](img/fig00202.jpg)![](img/fig00203.jpg)


    ### 得出结论

    显著的卡方检验结果表明两个变量不独立。不显著的值表示变量与独立状态之间没有显著差异。


    ### 显著结果的表述

    在描述结果时，你应该给出卡方值、自由度、显著性水平以及对结果的描述。例如，对于显著的卡方（使用与上述讨论不同的数据集集），我们可以这样陈述：


    通过比较男女患心脏病的频率，计算了独立卡方检验。发现显著的交互作用（χ²(1) = 23.80, p < .05）。男性患心脏病的概率 (68%) 高于女性
    (40%)。


    注意，此总结性陈述假设已运行了测试，编码了参与者的性别以及是否患心脏病。


    ### 不显著结果的表述

    不显著的卡方检验表明一个变量对另一个变量没有显著依赖关系。硬币示例是不显著的。因此，我们可以这样陈述：


    通过比较两次抛硬币的结果，计算了独立卡方检验。未发现显著关系（χ²(1) = .737, p > .05）。抛硬币似乎是独立事件。


    ### 练习题

    研究人员想知道个人在室内还是户外更容易在紧急情况下提供帮助。在 28 名户外的参与者中，19 人提供了帮助，9 人没有。在 23 名户内的参与者中，8 人提供了帮助，15
    人没有。输入这些数据，并找出帮助行为是否受环境影响。问题的关键在于数据输入。提示：有多少参与者？我们关于每个人至少知道多少条信息？让 SPSS 提供单元百分比将有助于你解释这个问题。


    ## 第 8.3 Mann-Whitney U 检验


    ### 描述

    Mann-Whitney U 检验是独立 t 检验的非参数等方法。它检验两个独立样本是否来自同一分布。Mann-Whitney U 检验比独立 t 检验弱，如果能满足其假设，则应使用
    t 检验。


    ### 假设

    Mann-Whitney U 检验使用数据的排名。因此，两个样本的数据至少必须是序数据的（ordinal）。对分布的形状没有假设。


    ### SPSS 数据格式

    该命令需要一个代表因变量的变量以及另一个表示组身份的变量。SPSS 要求因变量是标度型（scale）变量，尽管变量本身只需要是序数据的。


    ### 执行命令

    此示例将使用一个新的数据文件。它代表了八名参与者……（注：原文此处存在大量重复句子，翻译时已按要求处理）。


