    covered in detail in Section 8.2 of this text. It is accessed in SPSS at `Analyze
    → Descriptive Statistics → Crosstabs` and then checking `Chi-Square` in the `Statistics`
    option.


    ## Branch 30


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Nonparametric Test

    * Difference in Ranks

    * If you have more than one Independent Variable, this text does not cover the
    appropriate Nonparametric Test.

    * If you have a single Independent Variable, however, the number of levels of
    that variable determines the appropriate test.

    * If your Independent Variable has two levels, see Branch 31.

    * If your Independent Variable has more than two levels, see Branch 32.


    ## Branch 31


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Nonparametric Test

    * Difference in Ranks

    * Two Levels of the Independent Variable


    Next, you need to determine what kind of design produced the levels of your Independent
    Variables.


    A `Repeated-Measures Design` (also called `Within-Subjects`) is where the data
    in the various conditions are in some way related to each other. For example,
    comparing class rank of the same students when they were in high school to college
    would fall into this category. These designs are sometimes called Correlated Groups
    Designs or Paired Samples Designs.


    In an `Independent Groups Design` (also called `Between-Subjects`), the data in
    each group are independent of each other. This is the classic Experimental Group/Control
    Group Design where each participant is in one (and only one) group. For example,
    if you were comparing two different people and their performances in various marathons,
    this would be an Independent Groups Design.


    * If you have Independent Groups, see Branch 33.

    * If you have Repeated Measures, see Branch 34.


    ## Branch 32


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Nonparametric Test

    * Difference in Ranks

    * More Than Two Levels of the Independent Variable


    Next, you need to determine what kind of design produced the levels of your Independent
    Variables.


    A `Repeated-Measures Design` (also called `Within-Subjects`) is where the data
    in the various conditions are in some way related to each other. For example,
    comparing class rank of the same students when they were freshmen, sophomores,
    juniors, and then seniors would fall into this category. These designs are sometimes
    called Correlated Groups Designs or Paired Samples Designs.


    In an `Independent Groups Design` (also called `Between-Subjects`), the data in
    each group are independent of each other. This is the classic Experimental Group/Control
    Group Design where each participant is in one (and only one) group. For example,
    if you were comparing three different people and their performances in various
    marathons, this would be an Independent Groups Design.


    * If you have Independent Groups, see Branch 35.

    * If you have Repeated-Measures Design, see Branch 36.


    ## Branch 33


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Nonparametric Test

    * Difference in Ranks

    * Two Levels of the Independent Variable

    * Independent Groups


    The appropriate test to do is a `Mann-Whitney U`. This test is covered in detail
    in Section 8.3 of this text. It is accessed in SPSS at `Analyze Nonparametric
    Tests Independent Samples`.


    ## Branch 34


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Nonparametric Test

    * Difference in Ranks

    * Two Levels of the Independent Variable

    * Correlated Groups


    The appropriate test to do is a `Wilcoxon`. This test is covered in detail in
    Section 8.4 of this text. It is accessed in SPSS at `Analyze → Nonparametric Tests
    → Related Samples`.


    ## Branch 35


    Your Decisions So Far:


    * Looking for Differences in Groups

    * One Dependent Variable

    * Nonparametric Test

    * Difference in Ranks

    * Two Levels of the Independent Variable

    * Independent Groups


    The appropriate test to do is a `Kruskal-Wallis H Test`. This test is covered
    in detail in Section 8.5 of this text. It is accessed in SPSS at `Analyze → Nonparametric
    Tests → Independent Samples`.


    ## Branch 36


