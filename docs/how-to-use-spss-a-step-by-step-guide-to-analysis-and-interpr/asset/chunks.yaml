  trans: "\n\n此过程使用了 `GLM` 命令。`GLM` 代表一般线性模型（General Linear Model）。这是一个非常强大的命令，其输出的许多部分超出了本文的范围（请参见上方显示的输出大纲）。然而，对于基本的重复测量方差分析（ANOVA），我们只关注“受试效应检验”（Tests\
    \ of Within-Subjects Effects）。注意，SPSS 输出将包含许多其他部分，你现在可以忽略它们。\n\n“受试效应检验”的输出看起来与其他\
    \ ANOVA 命令的输出非常相似。在下面的示例中，`TIME` 的效应 `F` 值为 `121.90`，自由度为 `2` 和 `40`（我们使用“假设球性”Sphericity\
    \ Assumed 一行）。它在小于 `.001` 的水平上显著的。在描述这些结果时，我们应该说明检验类型、`F` 值、自由度和显著性水平。\n\n![](img/fig00170.jpg)!(Images/fig00171.jpg)\n\
    \n### 显著结果的描述\n\n由于 ANOVA 结果显著的，我们需要进行某种事后分析。SPSS 的主要局限性之一是很难对受试因子进行事后分析。在 SPSS\
    \ 中，解决此问题的简单方法是结合重复测量方差分析进行保护性因变量 t 检验。虽然更强大（且更合适）的事后分析，但 SPSS 不会为我们计算它们。更多信息请咨询你的指导老师或更高级的统计学书籍。\n\
    \n为了进行保护性 t 检验，我们将使用 `配样本 t 检验` 比较 `PRETEST` 与 `MIDTERM`、`MIDTERM` 与 `FINAL` 以及\
    \ `PRETEST` 与 `FINAL`。由于我们正在进行三次检验，从而会增加第一类错误率，我们将使用 `.017`（即 `.05/3`）的显著性水平，而不是\
    \ `.05`。请注意，为了进行这项分析，我们需要使用 `paired-samples t test` 命令并输入所有三对数据。\n\n![](img/fig00172.jpg)\n\
    \n三次比较的显著性水平均小于 `.017`，因此我们可以得出结论：分数从前测到期中有所提高，随后从期中到期末再次再次提高。为了生成描述性统计量，我们必须对每个变量运行\
    \ `Descriptives` 命令。\n\n由于我们的示例结果是显著的，我们可以陈述如下：\n\n通过单向重复测量方差分析，比较了参与者在三个不同时间（前测、期中和期末）的考试成绩。发现显著效应（`F\
    \ (2,40) = 121.90`, `p < .001`）。后续保护性 t 检验显示，分数从前测（`M = 63.33`, `sd = 8.93`）显著增加到期中（`M\
    \ = 78.62`, `sd = 9.66`），并再次从期中增加到期末（`M = 86.14`, `sd = 9.63`）。\n\n### 不显著结果的描述\n\
    \n对于不显著的结果，我们可以陈述如下（此处 `F` 值是为了说明而虚构的）：\n\n通过单向重复测量方差分析，比较了参与者在三个不同时间（前测、期中和期末）的考试成绩。未发现显著效应（`F\
    \ (2,40) = 1.90`, `p > .05`）。前测（`M = 63.33`, `sd = 8.93`）、期中（`M = 78.62`, `sd\
    \ = 9.66`）和期末（`M = 86.14`, `sd = 9.63`）均值之间不存在显著差异。\n\n### 练习题\n\n使用附录 B 中的 `Practice\
    \ Dataset 3`。使用单向重复测量方差分析和保护性因变量 t 检验确定参与者的焦虑水平是否随时间变化（无论他们接受哪种处理）。编写一份结果说明。\n\
    \n## 7.5 节混合设计 ANOVA\n\n### \n\n混合设计 ANOVA（有时称为拆分设计）测试多个独立变量的效应。至少有一个独立变量必须是受试内的（重复测量）。至少有一个独立变量必须是受试间的。\n\
    \n### 假设\n\n因变量应呈正态分布，并以间距或比例尺度上进行测量。\n\n### SPSS 数据格式\n\n对于受试内独立变量的每个水平，因变量应表示为一个变量（一列）。对于每个受试间变量，数据文件中应存在另一个变量（列）。因此，一个\
    \ `2 × 2` 的混合设计 ANOVA 需要三列：两列代表因变量（每个水平一个）以及一列代表受试间独立变量。\n\n### 运行命令\n\n![](img/fig00173.jpg)\n\
    \n`General Linear Model` 命令运行 `Repeated Measures ANOVA` 命令。点击 `Analyze`，然后 `General\
    \ Linear Model`，然后 `Repeated Measures`。\n\n注意，此过程需要一个可选模块。如果你没有此命令，说明你没有安装必要的模块。此过程不包含在\
    \ SPSS Statistics GradPack Base 中。\n\n如果任何独立变量是重复测量（受试内的），应使用 `Repeated Measures`\
    \ 命令。\n\n![](img/fig00174.jpg)\n\n此示例还使用了 `GRADES.sav` 数据文件。在 `Within-Subjects\
    \ Variables` 框中输入 `PRE-TEST`、`MIDTERM` 和 `FINAL`。（参见 `Repeated Measures` 命令说明）。此示例是\
    \ `3 × 3` 混合设计。两个独立变量（`TIME` 和 `INSTRUCT`），每个都有三个水平。在 `Repeated Measures` 对话框中之前输入了\
    \ `TIME` 信息。我们需要 `INSTRUCT` 放入 `Between-Subjects Factor(s)` 框。点击 `Options` 并选择\
    \ `means for all main effects`。点击 `OK` 运行。\n\n### 读取输出\n\n与标准的 `Repeated Measures`\
    \ 命令一样，`GLM` 程序提供了许多我们不会使用的输出。对于设计 ANOVA，我们感兴趣两个部分。第一个是 `Tests of Within-Subjects\
    \ Effects`。\n\n![](img/fig0175.jpg)\n\n该部分提供了我们需要的两个答案（`TIME` 主效应和交互作用 `TIME ×\
    \ INSTRUCTOR`）。输出的第二个部分是 `Tests of Between-Subjects Effects`（示例所示）。在这里我们得到了包含受试效应的答案。对于我们的示例，我们得到了\
    \ `INSTRUCT` 主效应。这两个部分必须结合起来产生完整答案。\n\n![](img/fig0176.jpg)\n\n如果我们获得显著效应，必须进行某种事后分析。再次，这是\
    \ SPSS 的局限性之一。没有简单的方法对重复测量（受试内）因子进行适当的事后检验。请向指导老师寻求帮助。\n\n在描述结果时，你应该包括每个主效应和交互作用的\
    \ `F`、自由度和显著性水平。此外，必须包含描述性统计量（给出均值或包含图表）。\n\n### 显著结果的描述\n\n所有混合设计 ANOVA 都有（至少）三个答案。参见\
    \ 7.3 节关于因子 ANOVA 的关于如何解释和描述结果的更多细节。对于上述示例，我们可以在结果部分陈述如下（注意这假设已进行了适当的事后检验）：\n\n\
    计算 `3 × 3` 混合设计 ANOVA 以检查教师（教师 1、2 和 3）和时间（前测、期中和期末）对成绩的影响。存在显著的 `time × instructor`\
    \ 交互作用（`F (4,36) = 58.10`, `p < .001`）。此外，时间的主效应显著（`F (2,36) = 817.95`, `p < .001`）。教师的主效应不显著（`F\
    \ (2,18) = .039`, `p > .05`）。\n\n![](img/fig0177.jpg)\n\n当存在显著交互作用时，提供描述性统计量的图表通常很有帮助。通过在主对话框中选择\
    \ `Plots` 选项，你可以制作像下面这样的交互作用图。交互作用增加了统计结果解释的复杂性。咨询研究方法书籍或向指导老师寻求更多关于交互作用的帮助。\n\
    \n"
