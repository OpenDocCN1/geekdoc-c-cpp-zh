    Look at the `SAMPLE.sav` data file we created in [Chapter 1](#Ch01.xhtml_ht0016).
    We calculated a mean for the variable `GRADE`. `GRADE` was measured on a ratio
    scale, and the mean is an acceptable summary statistic (assuming that the distribution
    is normal).


    We could have had SPSS calculate a mean for the variable `TIME` instead of `GRADE`.
    If we did, we would get the output presented below.


    The output indicates that the average `TIME` was 1.25. Remember that `TIME` was
    coded as an ordinal variable (1 = morning class, 2 = afternoon class). Though
    the mean is not an appropriate statistic for an ordinal scale, SPSS calculated
    it anyway. The importance of considering the type of data cannot be overemphasized.
    Just because SPSS will compute a statistic for you does not mean that you should
    use it. Later in the text, when specific statistical procedures are discussed,
    the conditions under which they are appropriate will be addressed. Please note
    that there are some procedures (e.g., graphs and nonparametric tests) where SPSS
    limits what you can do based on the measurement scale. However, more often than
    not, it is up to the user to make that decision.


    ![](Images/fig00028.jpg)


    ### Missing Data


    Often, participants do not provide complete data. For example, for some students,
    you may have a pretest score but not a posttest score. Perhaps one student left
    one question blank on a survey, or perhaps she did not state her age. Missing
    data can weaken any analysis. Often, a single missing answer can eliminate a subject
    from all analyses.


    ![](Images/fig00297.jpg)


    If you have missing data in your dataset, leave that cell blank. In the example
    shown above, the fourth subject did not complete Question 2 (`q2`). Note that
    the total score (which is calculated from both questions) is also blank because
    of the missing data for Question 2. SPSS represents missing data in the data window
    with a period (although you should not enter a period—just leave it blank). It
    is NOT a good practice to create a filler value (e.g., “999” or “0”) to represent
    blank scores, because SPSS will see it as a value with meaning, whereas it will
    treat truly blank values as missing.


    ## Section 2.2 Selection and Transformation of Data


    We often have more data in a data file than we want to include in a specific analysis.
    For instance, our sample data file contains data from four participants, two of
    whom received special training and two of whom did not. If we wanted to conduct
    an analysis using only the two participants who did not receive the training,
    we would need to specify the appropriate subset.


    ### Selecting a Subset


    ![](Images/fig00029.jpg)


    We can use the `Select Cases` command to specify a subset of our data. The `Select
    Cases` command is located under the `Data` menu. When you select this command,
    the dialog box below will appear. (Note the icons next to the variable names that
    indicate that all variables were defined as being measured on a nominal scale
    except `grade`, which was defined as scale.)


    ![](Images/fig00030.jpg)


    You can specify which cases (participants) you want to select by using the selection
    criteria, which appear on the right side of the `Select Cases` dialog box. By
    default, All cases will be selected. The most common way to select a subset is
    to click If condition is satisfied, then click on the button labeled `If`. This
    will bring up a new dialog box that allows you to indicate which cases you would
    like to use.


    ![](Images/fig00031.jpg)


    You can enter the logic used to select the subset in the upper section. If the
    logical statement is true for a given case, then that case will be selected. If
    the logical statement is false, that case will not be selected. For instance,
    you can select all cases that were coded as Mon/Wed/Fri by entering the formula
    `DAY = 1` in the upper-left part of the window. If `DAY` is 1, then the statement
    will be true, and SPSS will select the case. If `DAY` is anything other than 1,
    the statement will be false, and the case will not be selected. Once you have
    entered the logical statement, click `Continue` to return to the `Select Cases`
    dialog box. Then, click `OK` to return to the data window.


    ![](Images/fig00032.jpg)


    After you have selected the cases, the data window will slightly change. The cases
    that were not selected will be marked with a diagonal line through the case number.
    For instance, for our sample data, the first and third cases are not selected.
    Only the second and fourth cases are selected for this subset.


    ![](Images/fig00033.jpg)


    An additional variable will also be created in your data file. The new variable
    is called `FILTER_$` and indicates whether a case was selected or not.


    If we calculate a mean `GRADE` using the subset we just selected, we will receive
    the output here. Notice that we now have a mean of 78.00 with a sample size (`N`)
    of 2 instead of 4.


    ![](Images/fig00034.jpg)


    Be careful when you select subsets. The subset remains in effect until you run
    the command again and select all cases. You can tell if you have a subset selected
    because the bottom of the data window will indicate that a filter is on. In addition,
    when you examine your output, `N` will be less than the total number of records
    in your dataset if a subset is selected. The diagonal lines through some cases
    will also be evident when a subset is selected. Be careful not to save your data
    file with a subset selected, as this can cause considerable confusion later.


    ### Computing a New Variable


    SPSS can also be used to compute a new variable or manipulate your existing variables.
    To illustrate this, we will create a new data file. This file will contain data
    for four participants and three variables (`Q1`, `Q2`, and `Q3`). The variables
    represent the number of points each participant received on three questions. Now
    save this data file as `QUESTIONS.sav`. We will be using it again in later chapters.


    ![](Images/fig00035.jpg)fig00036.jpg


    Now you will calculate the total score for each subject. We could do this manually,
    but if the data file were large, or if there were a lot of questions, this would
    take a long time. It is more efficient (and more accurate) to have SPSS compute
    the totals for you. To do this, click `Transform`, and then click `Compute Variable`.


    ![](Images/fig00037.jpg)


    After clicking the `Compute Variable` command, we get the dialog box shown above.


    The blank field marked `Target Variable` is where we enter the name of the new
    variable we want to create. In this example, we are creating a variable called
    `TOTAL`, so type the word `total`.


    ![](Images/fig00038.jpg)


    Notice that there is an equal sign between the `Target Variable` blank and the
    `Numeric Expression` blank. These two blank areas are the two sides of an equation
    that SPSS will calculate. For instance, `total = Q1 + Q2 + Q3` is the equation
    that is entered in the sample presented here (screenshot shown above). Note that
    it is possible to create any equation here simply by using the number and operational
    keypad at the bottom of the dialog box. When we click `OK`, SPSS will create a
    new variable called `TOTAL` and make it equal to the sum of the three questions.


    Save your data file again so that the new variable will be available for future
    sessions.


    ### Recoding a Variable—Different Variable


    ![](Images/fig00039.jpg)


    SPSS can create a new variable based upon data from another variable. Say we want
    to split our participants on the basis of their total score. We want to create
    a variable called `GROUP`, which is coded 1 if the total score is low (less than
    or equal to 8) or 2 if the total score is high (9 or larger). To do this, we click
    `Transform`, then `Recode into Different Variables`.


    ![](Images/fig00040.jpg)

