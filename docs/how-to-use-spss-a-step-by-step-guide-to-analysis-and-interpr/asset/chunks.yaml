- fmt: '

    This example uses the `HEIGHT.sav` data file created in [Chapter 4](#Ch04.xhtml_ht0085).
    The one sample (also called “single-sample”) t test is located in the `Compare
    Means` submenu, under the `Analyze` menu.


    ![](Images/fig00126.jpg)


    The dialog box for the single-sample t test requires that we transfer the variable
    representing the current set of scores to the `Test Variable(s)` section. We must
    also enter the population average in the `Test Value` blank. The example presented
    here is testing the variable `HEIGHT` against a population mean of `67`. In other
    words, we are testing whether the sample came from a population with a mean of
    `67`. Click `OK` to run the analysis.


    ### Reading the Output

    The output for the single-sample t test consists of two sections. The first section
    lists the sample variable and some basic descriptive statistics (N, mean, standard
    deviation, and standard error).


    ![](Images/fig00127.jpg)![](Images/fig00128.jpg)


    The second section of output contains the results of the t test. The example presented
    above indicates a t value of `–064`, with 15 degrees of freedom and a significance
    level of `.95`. The mean difference of `–0625` is the difference between the sample
    average (`66.9375`) and the population average we entered in the dialog box to
    conduct the test (`67`).


    ### Drawing Conclusions

    The assumption when conducting a t test is that the means are equal. Therefore,
    a significant result indicates that the sample mean is not equivalent to the population
    mean (hence the term “significantly different”). A result that is not significant
    means that there is not a significant difference between the means. It does not
    mean that they are equal. Refer to your statistics text for the section on failure
    to reject the null hypothesis.


    ### Phrasing Results That Are Significant

    The above example did not find a significant difference between the population
    mean and the sample mean. If, however, we had used a population mean of `64` instead
    of `67`, we would have obtained the following output:


    ![](Images/fig00129.jpg)![](Images/fig00130.jpg)


    In this case, we could state the following:


    A single-sample t test that compared the mean height of the sample to a population
    value of `64` was conducted. A significant difference was found (t(15) = 3.008,
    p = .009). The sample mean of `66.9375` (sd = 3.907) was significantly greater
    than the population mean.


    ### Phrasing Results That Are Not Significant

    In our first example, the significance level was greater than `.05`. Thus, we
    would state the following:


    A single-sample t test that compared the mean height of the sample to a population
    value of `67` was conducted. No significant difference was found (t (15) = –.064,
    p = .95). The sample mean of `66.9375` (sd = 3.907) was not significantly greater
    than the population mean.


    ### Practice Exercise

    The mean salary in the United States is a hypothetical average of `$25,000`. Determine
    if the mean salary of the participants in Practice Dataset 2 in [Appendix B](#Apendix2.xhtml_ht0356)
    is significantly greater than this value. Note that this is a one-tailed hypothesis.


    ## Section 6.3 Independent-Samples t Test


    ### Description

    The independent-samples t test compares the means of two independent samples.
    Samples are independent if there is no relationship between them (generally meaning
    each participant provides data for only one sample).


    ### Assumptions

    The two groups being compared should be independent of each other. Observations
    are independent when information about one is unrelated to the other. Normally,
    this means that one group of participants provides data for one sample and a different
    group of participants provides data for the other sample (and individuals in one
    group are not matched with individuals in the other group). One way to accomplish
    this is through using random assignment to form two groups.


    The scores should be normally distributed, but the t test is robust and can handle
    violations of the assumption of a normal distribution. The two samples should,
    however, have the same variance.


    The dependent variable must be measured on an interval or ratio scale. The independent
    variable should have only two discrete levels.


    ### SPSS Data Format

    The SPSS data file for the independent t test requires two variables. One variable,
    the grouping variable, represents the value of the independent variable. The grouping
    variable should have two distinct values (e.g., 0 for a control group and 1 for
    an experimental group). The second variable represents the dependent variable,
    such as scores on a test.


    ### Conducting an Independent-Samples t Test

    For our example, we will use the `SAMPLE.sav` data file. Click `Analyze`, then
    `Compare Means`, then `Independent-Samples T Test`. This will bring up the main
    dialog box. Transfer the dependent variable(s) into the `Test Variable(s)` blank.
    For our example, we will use the variable `GRADE`.


    ![](Images/fig00131.jpg)![](Images/fig00132.jpg)


    Transfer the independent variable into the `Grouping Variable` section. For our
    example, we will use the variable `MORNING`.


    ![](Images/fig00133.jpg)


    Next, click `Define Groups` and enter the values of the two levels of the independent
    variable (0 for nonmorning and 1 for morning). Independent t tests are capable
    of comparing only two levels at a time. Click `Continue`, then click `OK` to run
    the analysis.


    ### Output From the Independent-Samples t Test

    The output will have a section labeled “Group Statistics.” This section provides
    the descriptive statistics for the dependent variable(s) for each value of the
    independent variable. It should look like the output below.


    ![](Images/fig00134.jpg)


    Next, there will be a section with the results of the t test. It should look like
    the output below.


    ![](Images/fig00135.jpg)


    The columns labeled `t`, `df`, and `Sig. (2-tailed)` provide the standard answer
    for the t test. They provide the value of `t`, the degrees of freedom (number
    of participants minus 2), and the significance level (often called p). Normally,
    we use the “Equal variances assumed” row. This will provide you with an answer
    equivalent to what you calculate by hand.


    ### Drawing Conclusions

    Recall from the previous section that the t test assumes an equality of means.
    Therefore, a significant result indicates that the means are not equivalent. When
    drawing conclusions about a t test, you must state the direction of the difference
    (i.e., which mean was larger). You should also include information about the value
    of `t`, the degrees of freedom, the significance level, the means, and standard
    deviations for the two groups.


    ### Phrasing Results That Are Significant

    For a significant t test (e.g., the output below), you might state the following:


    ![](Images/fig00136.jpg)![](Images/fig00137.jpg)


    An independent-samples t test comparing the mean scores of the experimental and
    control groups found a significant difference between the means of the two groups
    (t(5) = 2.835, p < .05). The mean of the experimental group was significantly
    lower (M = 33.333, sd = 2.08) than the mean of the control group (M = 41.000,
    sd = 4.24).


    ### Phrasing Results That Are Not Significant

    In our example at the start of this section, we compared the scores of the morning
    people to the scores of the nonmorning people. We did not find a significant difference,
    so we could state the following:


    An independent-samples t test was calculated comparing the mean score of participants
    who identified themselves as morning people to the mean score of participants
    who did not identify themselves as morning people. No significant difference was
    found (t(2) = 0.805, p > .05). The mean of the morning people (M = 78.00, sd =
    7.07) was not significantly different from the mean of nonmorning people (M =
    82.50, sd = 3.54).

