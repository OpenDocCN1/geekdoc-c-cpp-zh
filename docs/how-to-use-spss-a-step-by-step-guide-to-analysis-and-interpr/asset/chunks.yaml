    # Chapter 9 Test Construction](#contents.xhtml_bck_ht0311)


    ## Section 9.1 Item-Total Analysis


    ### Description

    Item-total analysis is a way to assess the internal consistency of a dataset.
    As such, it is one of many tests of reliability. Item-total analysis comprises
    a number of items that make up a scale or a test designed to measure a single
    construct (e.g., intelligence), and it determines the degree to which all of the
    items measure the same construct. It does not tell you if it is measuring the
    correct construct (that is a question of validity). Before a test can be valid,
    however, it must first be reliable.


    ### Assumptions

    All the items in the scale should be measured on an interval or ratio scale. In
    addition, each item should be normally distributed. If your items are ordinal
    in nature, you can conduct the analysis using the `Spearman rho correlation` instead
    of the `Pearson r correlation`.


    ### SPSS Data Format

    SPSS requires one variable for each item (or question) in the scale. In addition,
    you must have a variable representing the total score for the scale.


    ### Conducting the Test

    Item-total analysis uses the `Pearson Correlation` command. To conduct it, open
    the `QUESTIONS.sav` data file you created in [Chapter 2](#Ch02.xhtml_ht0034).
    Click `Analyze`, then `Correlate`, then `Bivariate`.


    ![](Images/fig00236.jpg)![](Images/fig00237.jpg)


    Place all questions and the total in the right-hand window, and click `OK`. (For
    more help on conducting correlations, see [Chapter 5](#Ch05.xhtml_ht0112).) The
    total can be calculated with the techniques discussed in [Chapter 2](#Ch02.xhtml_ht0034).


    ### Reading the Output

    The output consists of a correlation matrix containing all questions and the total.
    Use the column labeled `TOTAL`, and locate the correlation between the total score
    and each question. In the example shown to the right, `QUESTION 1` has a correlation
    of `0.873` with the total score. `QUESTION 2` has a correlation of `0.130` with
    the total score. `QUESTION 3` has a correlation of `0.926` with the total score.


    ![](Images/fig00238.jpg)


    ### Interpreting the Output

    Item-total correlations should always be positive. If you obtain a negative correlation,
    that question should be removed from the scale (or you may consider whether it
    should be reverse-keyed).


    Generally, item-total correlations of greater than `0.7` are considered desirable.
    Those of less than `0.3` are considered weak. Any questions with correlations
    of less than `0.3` should be removed from the scale.


    Normally, the worst question is removed, and then the total is recalculated. After
    the total is recalculated, the item-total analysis is repeated. When all remaining
    correlations are greater than `0.3`, the remaining items in the scale are considered
    to be internally consistent.


    ## Section 9.2 Cronbach''s Alpha


    ### Description

    Cronbach’s alpha is a measure of internal consistency. As such, it is one of many
    tests of reliability. Cronbach’s alpha comprises a number of items that make up
    a scale designed to measure a single construct (e.g., intelligence), and it determines
    the degree to which all of the items measure the same construct. It does not tell
    you if it is measuring the correct construct (that is a question of validity).
    As stated earlier, before a test can be valid, it must first be reliable.


    ### Assumptions

    All the items in the scale should be measured on an interval or ratio scale. In
    addition, each item should be normally distributed.


    ### SPSS Data Format

    SPSS requires one variable for each item (or question) in the scale.


    ### Running the Command

    We will continue to use the `QUESTIONS.sav` data file we first created in [Chapter
    2](#Ch02.xhtml_ht0034). Click `Analyze`, then `Scale`, then `Reliability Analysis`.


    ![](Images/fig00239.jpg)


    This will bring up the main dialog box for Reliability Analysis. Transfer the
    questions from your scale to the `Items` blank, and click `OK`. Do not transfer
    any variables representing total scores.


    ![](Images/fig00240.jpg)


    Note that if you change the options under `Model`, additional measures of internal
    consistency (e.g., split-half) can be calculated.


    ### Reading the Output

    In this example, the reliability coefficient is `0.407`. Numbers close to `1.00`
    are very good, but numbers close to `0.00` represent poor internal consistency.


    ![](Images/fig00241.jpg)


    ## Section 9.3 Test-Retest Reliability


    ### Description

    Test-retest reliability is a measure of temporal stability. As such, it is a measure
    of reliability. Unlike measures of internal consistency that tell you the extent
    to which all of the questions that make up a scale measure the same construct,
    measures of temporal stability tell you whether or not the instrument is consistent
    over time or over multiple administrations.


    ### Assumptions

    The total score for the scale should be an interval or ratio scale. The scale
    scores should be normally distributed.


    ### SPSS Data Format

