    请注意，在这个示例中，我们将效应量（`d`）表示为正数，尽管它是负数。效应量始终是正数。在这个示例中，使用 Cohen 对 `d` 的解释准则，我们发现了一个很大的效应量。


    ## r² (决定系数)


    虽然 Cohen 的 `d` 是 t 检验效应量的合适衡量标准，但相关分析和回归分析的效应量应该通过相关系数的平方来确定。这个平方后的相关系数被称为决定系数。`Cohen^(3)`
    建议相关系数为 `.5`、`.3` 和 `.1` 的相关性分别对应于大、中等和小比例关系。将这些值平方后，分别得到的决定系数为 `.25`、`.09` 和
    `.01`。因此，Cohen 似乎在暗示，解释 25% 的变异代表大效应，9% 代表中等效应，1% 代表小效应。


    ### 相关的效应量


    在任何地方中，样本量对统计效力（并因此对显著性）的影响都不比相关分析中更明显。在样本量足够大的情况下，任何相关性都可以变得显著。因此，效应量在相关性的解释中变得至关重要。


    相关分析的标准效应量衡量是之前讨论过的决定系数（`r²`）。该系数应解释为：自变量与因变量之间的关系所解释的因变量变异比例。虽然 Cohen 提供了有用的解释准则，但每个问题都应该根据其真实的实际意义来解释。例如，如果一种治疗方法的实施非常昂贵，或者有重大的副作用，那么在关系变得重要之前，需要更大的相关性。对于非常廉价的治疗，较小的相关性就可以被认为是重要的。


    要计算决定系数，只需提取 SPSS 提供的 `r` 值并平方即可。


    ### 回归的效应量


    输出中的 `Model Summary`（模型摘要）部分为你报告了 `R²`。这里的示例输出决定系数为 `.649`，这意味着因变量中几乎 65%（`.649`）的变异是由因变量与自变量之间的关系解释的。


    ![](img/fig00263.jpg)


    ## Eta 方 (η²)


    第三种效应量衡量方法是 Eta 方（`η²`）。Eta 方用于方差分析模型。SPSS 中的 `GLM`（一般线性模型）函数（运行 `Analyze—General
    Linear Model` 下过程的函数）将提供 Eta 方（`η²`）。


    $\mathit{\eta}^{2}=\frac{SS_{effect}}{SS_{effect} + SS_{error}}$


    Model Summary


    Eta 方的解释与平方相关系数（`r²`）类似。它代表效应所解释的变异比例。与仅代表线性关系的 `r²` 不同，`η²` 可以代表任何类型的关系。


    ### 方差分析的效应量


    对于大多数方差分析问题，你应该选择报告 Eta 方作为你的效应量衡量标准。SPSS 在 `General Linear Model (GLM)` 命令中为你提供了此计算。


    ![受间效应检验](img/fig00265.jpg)


    受间效应检验


    要要获得 Eta 方，只需在你正在运行的 `GLM` 命令的主对话框中点击 `Options`（选项）框（这适用于 `Univariate`、`Multivariate`
    和 `Repeated Measures` 版本的命令，尽管这里只显示了 `Univariate` 选项）。


    ![](img/fig00266.jpg)


    一旦选了 `Options`，就会出现一个新的对话框。该框中的一个选项是 `Estimates of effect size`（效应量估计）。当你选择该框时，SPSS
    将提供 Eta 方值作为输出的一部分。


    ![](img/fig00267.jpg)


    在上面的示例中，我们得到的组成员主效应的 Eta 方为 `.761`。由于我们使用与 `r²` 相同的准则来解释 Eta 方，我们得出结论：这代表组成员的一个大效应量。


    ## Notes


    1. Kirk, R.E. (1996). Practical significance: A concept whose time has come. Educational
    & Psychological Measurement, 56, 746–759.


    2. Cohen, J. (1992). A power primer. Psychological Bulletin, 112, 155–159.


    3. Cohen, J. (1988). Statistical power analysis for the behavioral sciences (2nd
    ed.). Hillsdale, NJ: Lawrence Erlbaum.


