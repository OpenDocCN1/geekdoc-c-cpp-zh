    SPSS 需要一个因变量，以及每个自变量对应一个变量。如果我们的某个自变量是由多个变量表示的（例如，`PRETEST` 和 `POSTTEST`），我们必须使用重复测量方差分析（ANOVA）。


    ## 执行命令


    ![](img/fig00160.jpg)


    本示例使用了本节之前的 `GRADES.sav` 数据文件。点击 `Analyze`（分析），选择 `General Linear Model`（一般线性模型），然后选择
    `Univariate`（单变量）。


    ![](img/fig00161.jpg)


    这将弹出 `Univariate ANOVA` 主对话框。选择因变量并将其放入 `Dependent Variable`（因变量）框中（本例使用 `FINAL`）。选择一个自变量（本例中为
    `INSTRUCT`），将其放入 `Fixed Factor(s)`（固定因子）框中。将第二个自变量（`REQUIRED`）也放入 `Fixed Factor(s)`
    框中。定义好完成后，点击 `Options`（选项）。


    ![](img/fig00162.jpg)


    当 `Options` 对话框出现时，点击 `Descriptive statistics`（描述性统计）。这将为你提供每个主效应和交互项的平均值。点击 `Continue`（继续）。


    如果你选择 `Post Hoc`（事后检验），SPSS 将对主效应进行事后分析，但不会对交互项进行。点击 `OK` 执行分析。


    ### 读取输出


    在输出的底部，你会找到平均值。我们有六个平均值代表两个变量的交互作用（这是一个 3 × 2 设计）。


    ![](img/fig00163.jpg)


    由 `Instructor 1`（课程非必修）指导的参与者平均期考试分为 `79.67`。由 `Instructor 1`（课程为必修）指导的学生平均期考试分为
    `79.50`，依此类推。


    我们刚刚运行的示例被称为双因素方差分析（two-way ANOVA）。因为我们有两个自变量。通过双因素方差分析，我们得到三个答案：`INSTRUCT` 的主效应、`REQUIRED`
    的主效应以及 `INSTRUCT*REQUIRED` 的交互结果。


    下方的源表给出了这三个答案（位于 `INSTRUCT`、`REQUIRED` 和 `INSTRUCT * REQUIRED` 行中）。


    ![](img/fig00164.jpg)


    在上面的示例中，没有任何主效应或交互作用是显著。在结果陈述中，你必须指出 `F` 值、两个自由度（效应和残差/误差）、显著性水平，以及对每个答案的口语化描述（本例中为三个）。注意，大多数统计学书籍提供的方差分析源表版本简单得多，不包含
    `Corrected Model`（修正模型）、`Intercept`（截距）和 `Corrected Total`（修正总计）行。


    ### 陈述显著的结果


    如果我们在这个示例中获得了显著结果，我们可以做出如下陈述。（这些是虚构的结果。对于与上述示例对应的结果，请参阅关于不显著结果陈述的章节。）


    计算了一个 3（教师）× 2（必修课程）受试间因子方差分析，比较了由三位教师之一指导且作为必修课或选修课参加课程的参与者的期考试成绩。发现教师的主效应显著（`F
    (2,15) = 10.112`, `p < .05`）。由 `Instructor 1` 指导的学生期考试成绩（`M = 79.57`, `sd = 7.96`）低于由
    `Instructor 3` 指导的学生（`M = 92.43`, `sd = 5.50`）。由 `Instructor 2` 指导的学生（`M = 86.43`,
    `sd = 10.92`）与另外两组均无显著差异。是否必修的主效应显著（`F(1,15) = 38.44`, `p < .01`）。因为必修而修课的学生表现（`M
    = 91.69`, `sd = 7.68`）优于选修修课的学生（`M = 77.13`, `sd = 5.72`）。交互作用不显著（`F(2,15) = 1.15`,
    `p > .05`）。教师的影响不受学生是否因为必修而修课的影响。


    注意，在上面的示例中，我们必须进行 `Tukey’s HSD`（使用 `Post Hoc` 命令）来确定 `INSTRUCT` 的差异。这对于 `REQUIRED`
    是没有必要的，因为它只有两个水平（其中一个必须与另一个不同）。


    ### 陈述不显著的结果


    我们的实际结果不显著，因此我们可以陈述：


    计算了一个 3（教师）× 2（必修课程）受试间因子方差分析，比较了由三位教师之一指导且作为必修课或选修课参加课程的参与者的期考试成绩。教师的主效应不显著（`F(2,15)
    = 3.30`, `p > .05`）。是否必修课程的主效应也不显著（`F(1,15) = . 42`, `p > .05`）。最后，交互作用不显著（`F(2,15)
    = .136`, `p > .05`）。因此，教师和课程是否必修对期考试成绩都没有任何显著影响。


    ### 练习题


    使用 `Practice Dataset 2`，确定工资受性别、职位分类或性别与职位分类交互的影响。写结果。


    ## 7.4 重复测量方差分析


    ### 描述


    重复测量方差分析将基础 ANOVA 扩展到受试内变量。当比较两个以上水平时，其功能类似于配对 t 检验。


    ### 假设


    因变量应呈正态分布并以间隔或比例尺度测量。因变量的多次测量应来自同一（或相关的）参与者。


    ### SPSS 数据格式


    至少需要三个变量。数据文件中的每个变量代表自变量的单一水平。因此，具有四个水平水平的设计需要四个变量。


    如果任何变量代表受试间效应，请使用重复测量方差分析命令。


    ### 执行命令


    ![](img/fig00165.jpg)


    本示例使用 `GRADES.sav` 样本。记得 `GRADES.sav` 包含了三组成绩 `PRETEST`、`MIDTERM` 和 `FINAL`，代表学期的三个不同时间。这允许我们分析时间对样本表现的影响。点击
    `Analyze`，选择 `General Linear Model`，然后选择 `Repeated Measures`。


    注意此程序需要可选模块。如果你没有此命令，说明你没有安装必要的模块。该程序未包含在 SPSS Statistics GradPack Base 中。


    ![](img/fig00166.jpg)


    在选择命令后，将出现 `Repeated Measures Define Factor(s)` 对话框。在这里识别受试内因子（我们将命名为 `TIME`）。在
    `Number of Levels` 中输入 3（三次考试）并点击 `Add`。


    如果有多个重复测量的自变量，我们可以输入名称并点击 `Add`。现在点击 `Define`。


    ![](img/fig00167.jpg)


    你将看到 `Repeated Measures` 对话框。将 `PRETEST`、`MIDTERM` 和 `FINAL` 转移 `Within-Subjects
    Variables` 部分。变量名称应根据它们发生的时间顺序排序（即它们代表自变量的值）。


    ![](img/fig00168.jpg)


    通过将 `TIME` 移到右侧并选择 `Descriptive statistics`，SPSS 将计算 `TIME` 效应的平均值。点击 `Continue`
    关闭对话框并点击 `OK` 执行命令。

