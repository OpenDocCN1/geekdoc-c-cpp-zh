    使用附录 B 中的练习数据集 2，确定每个员工工资对应的 z 分。计算男性和女性员工工资的平均 z 分。计算总样本工资的平均 z 分。


    # 第 4 章数据图表 (#contents.xhtml_bck_ht0085)


    ## 第 4.1 节 图表基础


    除了第 3 章中讨论的频率分布、集中趋势测量和离散程度外，绘图是总结、组织和简化数据的有效方法。俗话说“一画胜千言”。对于复杂的数据集来说，事实确实如此。


    使用 SPSS 可以制作出达到出版质量的图表。使用 SPSS 创建图表而不是其他软件（例如 `Excel` 或 `SigmaPlot`）的一个重要优势是数据已经录入过了。因此，消除了重复录入，并减少了发生转录错误的概率。


    ## 第 4.2 节 柱状图、饼图和直方图


    ### 描述


    柱状图、饼图和直方图通过条的高度或饼图的大小来表示每个分值出现的次数。它们是第 3 章中讨论的频率分布的图形化表示。


    ### 得出结论


    `Frequencies` 命令产生的输出指示了样本中具有特定值的案例数量以及该值所占的百分比。因此，得出的结论应仅限于描述样本的数字或百分比。如果数据性质上至少是序次的，也可以得出关于累积百分比和/或分数的结论。


    ### SPSS 数据格式


    使用此命令只需要一个变量。


    ### 数据集


    对于图表示例，我们将使用一组新数据。通过在“变量视图”窗口中定义三个主题变量来输入以下数据：`HEIGHT`（英寸）、`WEIGHT`（磅）和 `SEX`（1
    = 男性，2 = 女性）。在创建变量时，将 `HEIGHT` 和 `WEIGHT` 指定为 `Scale`（标度）测量，将 `SEX` 指定为 `Nominal`（名义）测量（在变量视图的最右侧列中）。切换到“数据视图”以输入
    16 名参与者的数据值。现在使用“另存为”命令保存文件，命名为 `HEIGHT.sav`。


    | HEIGHT | WEIGHT | SEX |

    | --- | --- | --- |

    | 66 | 150 | 1 |

    | 69 | 155 | 1 |

    | 73 | 160 | 1 |

    | 72 | 160 | 1 |

    | 68 | 150 | 1 |

    | 63 | 140 | 1 |

    | 74 | 165 | 1 |

    | 70 | 150 | 1 |

    | 66 | 110 | 2 |

    | 64 | 100 | 2 |

    | 60 | 95 | 2 |

    | 67 | 110 | 2 |

    | 64 | 105 | 2 |

    | 63 | 100 | 2 |

    | 67 | 110 | 2 |

    | 65 | 105 | 2 |


    通过计算三个变量的平均值来确保你已正确输入数据（点击 `Analyze`，然后点击 `Descriptive Statistics`，再点击 `Descriptives`）。将你的结果与下表进行比较。


    ![](img/fig00070.jpg)


    ### 运行命令


    ![](img/fig00071.jpg)


    `Frequencies` 命令将产生图形频率分布。点击 `Analyze`，然后点击 `Descriptive Statistics`，最后 `Frequencies`。你将看到
    `Frequencies` 命令的主对话框，在其中你可以输入想要创建图表或图表的变量（本例中为 `HEIGHT`）。此命令的其他选项请参阅第 3 章。


    ![](img/fig00072.jpg)


    点击频率命令右侧的 `Charts` 按钮以弹出 `Charts` 对话框。


    ![](img/fig00073.jpg)


    此命令提供三种类型的图表：柱状图、饼图和直方图。对于每种类型，Y 轴可以是频率计数或百分比（通过 `Chart Values` 选项选择）。选择柱状图并点击
    `Continue`。然后，点击 `OK`。


    你将获得主 `Frequencies` 命令对话框中选定的任何变量的图表。


    ### 输出


    柱状图由代表频率的 Y 轴和代表每个分值的 X 轴组成。注意，X 轴上表示的唯一值是具有非零频率的值（61、62 和 71 未被表示）。


    ![](img/fig00074.jpg)


    如果选择了输出，饼图将显示每个值所占整体的百分比。


    ![](img/fig00075.jpg)


    `Histogram` 命令创建一个分组频率分布。分值范围被划分为等间距的分组。每组的中点被绘制在 X 轴上，Y 轴表示每组的分值数量。


    ![](img/fig00076.jpg)


    如果选了 `Show normal curve`，正态曲线将叠加在分布上。


    ### 练习题


    使用附录 B 中的练习数据集 2，确定每个员工工资对应的 z 分。计算男性和女性员工工资的平均 z 分。计算总样本工资的平均 z 分。


    ## 第 4.3 节 图表生成器


    ### 图表生成器基础


    确保你在 4.2 创建的 `HEIGHT.sav` 数据文件已打开。为了使用图表生成器，必须打开数据文件。


    ![](img/fig00077.jpg)


    通过 `Graphs` 然后 `Chart Builder` 进入 Chart Builder。这是一个非常多功能的命令，可以制作高质量的图表。


    当你首次运行 Chart Builder 时，会看到以下对话框：


    ![](img/fig00078.jpg)(Images/fig00079.jpg)


    此对话框要求你确保变量已正确定义。如果在定义变量时遇到困难，请参考 1.3 节和 2.1 节。点击 `OK`。


    在对话框中间有四个主要的标签页，用于控制你制作的图表。第一个是 `Gallery` 标签页。`Gallery` 标签页允许你选择图表的基本格式。


    例如，上面的截图显示了 Chart Builder 创建的不同类型的柱状图。


    当你使用 `Gallery` 标签页选择了所需的图表形式后，只需从窗口右下方将图像拖到顶部的主窗口（此处显示“将 Gallery 图表拖到此处作为起点”）。


    或者，你可以使用 `Basic Elements` 标签页将坐标系（标记为 `Choose Axes`）拖到顶部，然后将变量和元素拖窗口。


    其他标签页（`Groups/Point ID` 和 `Titles/Footnotes`）可用于为图表添加其他标准元素。


    文中的示例将涵盖使用 Builder 创建的一些基本图表类型。在你自己进行一些实验并掌握本章的示例后，你很快就能完全理解图表生成器。


    ## 第 4.4 节 散点图


    ### 描述


    散点图（也称为散点图或散点图）通过图表上的标记显示每个案例的两个值。X 轴代表一个变量的值。Y 轴代表第二个变量的值。


    ### 假设


    两个变量都应该是间隔或比例标度。如果使用了名义或顺序数据，请对你散点图的解释保持谨慎。


    ### SPSS 数据格式


    执行此命令需要两个变量。


    ### 运行命令


    你可以点击 `Graphs` 然后 `Chart Builder` 来产生散点图。


    '
- fmt: '

    In Gallery Choose from `Scatter/Dot`. Then drag the `Simple Scatter` icon (top-left)
    up to the main chart area as shown in the screenshot below. Disregard the `Element
    Properties` window that pops up by choosing `Close` at the bottom of that window.


    ![](Images/fig00081.jpg)![](Images/fig00082.jpg)


    Next, drag the `HEIGHT` variable to the `X-Axis` area, and drag the `WEIGHT` variable
    to the `Y-Axis` area. (Remember that standard graphing conventions indicate that
    dependent variables should be `Y` and independent variables should be `X`. This
    would mean that we are trying to predict weights from heights.) At this point,
    your screen should resemble the example shown above. Note that your actual data
    are not shown—just a set of dummy values, which may look different from the pattern
    shown here.


    ### Output


    The output will consist of a mark for each participant at the appropriate `X`
    and `Y` levels.


    ![](Images/fig00083.jpg)![](Images/fig00084.jpg)


    ### Adding a Third Variable


    Even though the scatterplot is a two-dimensional graph, it can plot a third variable.
    To make it do so, select the `Groups/Point ID` tab in the `Chart Builder`. Click
    the `Grouping/stacking` variable option. Again, disregard the `Element Properties`
    window that pops up. Next, drag the variable `SEX` into the upper-right corner
    where it indicates `Set color`. When this is done, your screen should look like
    the image shown above. If you are not able to drag the variable `SEX`, it may
    be because it is not identified as nominal or ordinal in the `Variable View` window.


    Click `OK` to have SPSS produce the graph.


    Now our output will have two different sets of marks. One set represents the male
    participants, and the second set represents the female participants. These two
    sets will appear in two different colors on your screen. You can use the `SPSS
    Chart Editor` (see Section 4.6) to make them different shapes.


    ![](Images/fig00085.jpg)


    ### Practice Exercise


    Use `Practice Dataset 2` in [Appendix B](#Apendix2.xhtml_ht0356). Construct a
    scatterplot to examine the relationship between `SALARY` and `EDUCATION`.


    ## Section 4.5 Advanced Bar Charts


    ### Description


    Bar charts can be produced with the `Frequencies` command (see Section 4.2). Sometimes,
    however, we are interested in a bar chart where the `Y-axis` is not a frequency.
    To produce such a chart, we need to use the `Bar charts` command.


    ### SPSS Data Format


    You need at least two variables to perform this command. There are two basic kinds
    of bar charts— those for between-subjects designs and those for repeated-measures
    designs. Use the between-subjects method if one variable is the independent variable
    and the other is the dependent variable (representing one score for different
    groups of individuals). Use the repeated-measures method if you have a dependent
    variable for each value of the independent variable (e.g., you would have three
    variables for a design with three values of the independent variable). This normally
    occurs when you make multiple observations over time.


    This example uses the `GRADES.sav` data file, which will be created in [Chapter
    6](#Ch06.xhtml_ht0153). Please see Section 6.4 for the data if you would like
    to follow along.


    ### Running the Command


    ![](Images/fig00086.jpg)


    Open the `Chart Builder` by clicking `Graphs`, then `Chart Builder`. In the `Gallery`
    tab, select `Bar`. If you had only one independent variable, you would select
    the `Simple Bar Chart` example (top-left corner). If you have more than one independent
    variable (as in this example), select the `Clustered Bar Chart` example from the
    top row.


    ![](Images/fig00087.jpg)


    Drag the example to the top working area. Once you do, the working area should
    look like the screenshot below. (Note that you will need to open the data file
    you would like to graph in order to run this command.)


    ![](Images/fig00088.jpg)


    If you are using a repeated-measures design like our example here using `GRADES.sav`
    from [Chapter 6](#Ch06.xhtml_ht0153) (three different variables representing the
    `Y` values that we want), you need to select all three variables (you can `<Ctrl>-click`
    them to select multiple variables) and then drag all three variable names to the
    `Y-Axis` area. When you do, you will be given the confirmation message shown.
    Click `OK`.


    ![](Images/fig00089.jpg)


    Next, you will need to drag the `INSTRUCT` variable to the top-right in the `Cluster
    on X: set color` area. Note: The `Chart Builder` pays attention to the types of
    variables that you ask it to graph. If you are getting error messages or unusual
    results, be sure your variables being used as category labels are properly designated
    as `Nominal` in the `Variable View` tab (see [Chapter 2](#Ch02.xhtml_ht0034),
    Section 2.1). You can easily change the type of variable by right-clicking on
    the variable name.


    ![](Images/fig00090.jpg)


    ### Output


    ![](Images/fig00091.jpg)


    ### Practice Exercise


    Using `Practice Dataset 1` in [Appendix B](#Apendix2.xhtml_ht0356). Construct
    a clustered bar graph examining the relationship between `MATHEMATICS SKILLS`
    scores (as the dependent variable) and `MARITAL STATUS` and `SEX` (as independent
    variables). Make sure you classify both `SEX` and `MARITAL STATUS` as nominal
    variables.


    ## Section 4.6 Editing SPSS Graphs


    Whatever command you use to create your graph, you will probably want to do some
    editing to make it appear exactly as you want it to look. In SPSS, you do this
    in much the same way that you edit graphs in other software programs (e.g., Excel).
    After your graph is made, in the output window, select your graph (this will create
    handles around the outside of the entire object) and right-click. Then, click
    `Edit Content`, and click `In a separate window`. Alternatively, you can double-click
    on the graph to open it for editing.


    When you open the graph, the `Chart Editor` window will appear.


    ![](Images/fig00092.jpg)


    Once `Chart Editor` is open, you can easily edit each element of the graph. To
    select an element, click on the relevant spot on the graph. For instance, if you
    have added a title to your graph (“Histogram” in the example shown above, which
    was created earlier in this chapter and saved as `HEIGHT.sav`), you may select
    the element representing the title of the graph by clicking anywhere on the title.


    Once you have selected an element, you can tell whether the correct element is
    selected because it will have handles around it.


    If the item you have selected is a text element (e.g., the title of the graph),
    a cursor will be present and you can edit the text as you would in a word processing
    program. If you would like to change another attribute of the element (e.g., the
    color or font size), use the `Properties` box.


    ![](Images/fig00093.jpg)


    With a little practice, you can make excellent graphs using SPSS. Once your graph
    is formatted the way you want, simply select `File`, then `Close`.


    # [Chapter 5: Prediction and Association](#contents.xhtml_bck_ht0112)


    ## Section 5.1 Pearson Correlation Coefficient


    ### Description


    The `Pearson correlation coefficient` (sometimes called the `Pearson product-moment
    correlation coefficient` or simply the `Pearson r`) determines the strength of
    the linear relationship between two variables.


    ### Assumptions


    Both variables should be measured on interval or ratio scales (or as a dichotomous
    nominal variable). If a relationship exists between them, that relationship should
    be linear. Because the Pearson correlation coefficient is computed with `z-scores`,
    both variables should also be normally distributed. If your data do not meet these
    assumptions, consider using the `Spearman rho correlation coefficient` instead.


    ### SPSS Data Format


    Two variables are required in your SPSS data file. Each subject must have data
    for both variables.


    ### Running the Command


    ![](Images/fig00094.jpg)

