    合适的检验是卡方拟合度检验（Chi-Square Goodness of Fit）。该检验在本文的第 8.1 节有详细介绍。在 SPSS 中的访问路径为：`Analyze
    → Nonparametric Tests → One Sample`。


    ## 分支 29


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 比例差异

    * 多个自变量


    合适的检验是卡方独立性检验（Chi-Square Test of Independence）。由于该检验在本文的第 8.2 节有详细介绍。在 SPSS 中的访问路径为：`Analyze
    → Descriptive Statistics → Crosstabs`，然后在 `Statistics` 选项卡中勾选 `Chi-Square`。


    ## 分支 30


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 如果你有多个自变量，本文未涵盖适当的非参数检验。

    * 然而，如果你只有一个自变量，则该变量的水平数决定了适当的检验方法。

    * 如果你的自变量有两个水平，请参见分支 31。

    * 如果你的自变量有两个以上的水平，请参见分支 32。


    ## 分支 31


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 自变量有两个水平


    接下来，你需要确定是哪种设计产生了你自变量的水平。


    `重复测量设计`（`Repeated-Measures Design`，也称为组内设计 ``Within-Subjects`）是指不同条件下的数据以某种方式相互相关。例如，比较同一批学生从高中到大学的级排名就属于此类。这些设计有时被称为相关组设计（Correlated
    Groups Designs）或配对样本设计（Paired Samples Designs）。


    在`独立组设计`（`Independent Groups Design`，也称为组间设计 ``Between-Subjects`）中，每组的数据是相互独立的。这是经典的实验组/控制组设计，每个参与者只属于一个（且仅一个）组。例如，如果你在比较两个不同人在各种马拉松赛事中的表现，这就是一个独立组设计。


    * 如果你有独立组，请参见分支 33。

    * 如果你有重复测量，请参见分支 34。


    ## 分支 32


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 自变量有两个以上的水平


    接下来，你需要确定是哪种设计产生了你自变量的水平。


    `重复测量设计`（`Repeated-Measures Design`，也称为组内设计 ``Within-Subjects`）是指不同条件下的数据以某种方式相互相关。例如，比较同一批学生在大一、大二、大三和大大四时的级排名就属于此类。这些设计有时被称为相关组设计或配对样本设计。


    在`独立组设计`（`Independent Groups Design`，也称为组间设计 ``Between-Subjects`）中，每组的数据是相互独立的。这是经典的实验组/控制组设计，每个参与者只属于一个（且仅一个）组。例如，如果你在比较三个不同人在各种马拉松赛事中的表现，这就是一个独立组设计。


    * 如果你有独立组，请参见分支 35。

    * 如果你有重复测量设计，请参见分支 36。


    ## 分支 33


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 自变量有两个水平

    * 独立组


    合适的检验是`曼-惠特尼 U 检验`（Mann-Whitney U）。该检验在本文的第 8.3 节有详细介绍。在 SPSS 中的访问路径为：`Analyze
    Nonparametric Tests Independent Samples`。


    ## 分支 34


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 自变量有两个水平

    * 相关组


    合适的检验是`威尔科克森检验`（Wilcoxon）。该检验在本文的第 8.4 节有详细介绍。在 SPSS 中的访问路径为：`Analyze → Nonparametric
    Tests → Related Samples`。


    ## 分支 35


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 自变量有两个水平

    * 独立组


    合适的检验是`克鲁斯卡尔-沃尔斯 H 检验`（Kruskal-Wallis H Test）。该检验在本文的第 8.5 节有详细介绍。在 SPSS 中的访问路径为：`Analyze
    → Nonparametric Tests → Independent Samples`。


    ## 分支 36


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 非参数检验

    * 秩次差异

    * 自变量有两个水平

    * 相关组


    合适的检验是`弗里德曼检验`（Friedman）。该检验在本文的第 8.6 节有详细介绍。在 SPSS 中的访问路径为：`Analyze → Nonparametric
    Tests → Related Samples`。


