  trans: '


    如果你的关系中的变量有一个是定序变量（例如，排名），你必须进行非参数相关分析。如果其中一个变量是定名变量，那么在相关性分析方面你就比较没运气了。


    * 如果你可以进行 `Parametric Correlation`（参数相关），请查看 `Branch 4`。

    * 如果你必须进行 `Nonparametric Correlation`（非参数相关），请查看 `Branch 5`。


    ## Branch 4


    你目前为止的决策：


    * 测量关联强度

    * 你可以进行 `Parametric Correlation`（参数相关）


    合适的测试方法是 `Pearson r`。该测试在本文第 5.1 节有详细介绍。在 SPSS 中，访问路径为 `Analyze → Correlate →
    Bivariate`。


    答案范围从 `-1` 到 `+1`。接近 0 的值意味着关系较弱。越接近 `+1` 或 `-1` 越越。正值意味着随着一个变量增大，另一个变量也随之增大。负值意味着随着一个变量增大，另一个变量随之缩小。


    ## Branch 5


    你目前为止的决策：


    * 测量关联强度

    * 你必须进行 `Nonparametric Correlation`（非参数相关）


    合适的测试方法是 `Spearman rho`。该测试在本文第 5.2 节有详细介绍。在 SPSS 中，访问路径为 `Analyze → Correlate
    → Bivariate`，然后在弹出的对话框中选择 `Spearman`。


    答案范围从 `-1` 到 `+1`。接近 0 的值意味着关系较弱。越接近 `+1` 或 `-1` 越越强。正值意味着随着一个变量增大，另一个变量也随之增大。负值意味着随着一个变量增大，另一个变量随之缩小。


    ## Branch 6


    你目前为止的决策：


    * 预测


    预测是统计学的一种强大用途。在本文中我们只涵盖假设变量之间存在线性关系的预测模型。如果你有非线性关系，它们超出了本文的讨论范围。


    本文使用了 `Independent Variable`（自变量）这一术语，但实际上有时在没有真正的 `Independent Variable` 的情况下也会进行预测。如果你设计的设计中没有真正的
    `Independent Variable`，那么为了这个决策过程考虑，你用于预测的变量应该被视为 `Independent Variables`。


    * 如果你有一个 `Independent Variable`，请查看 `Branch 7`。

    * 如果你有多个 `Independent Variables` 并想它们来预测单个 `Dependent Variable`（因变量）的值（例如，根据 `ACT
    scores`、缺课次数和学习耗时来预测 `GPA`），请查看 `Branch 8`。


    ## Branch 7


    你目前为止的决策：


    * 预测

    * 单一自变量


    合适的测试方法是 `Simple Linear Regression`（简单线性回归）。该测试在本文第 5.3 节有详细介绍。在 SPSS 中，访问路径为
    `Analyze Regression Linear`。


    输出结果将有一个提供答案的 `B` 列。`Constant`（常数）的 `B` 是你的 `Y-Intercept`（Y 截距），你的 `Independent
    Variable` 名称旁边的 `B` 是线的斜率。


    ## Branch 8


    你目前为止的决策：


    * 预测

    * 多个自变量


    合适的测试方法是 `Multiple Linear Regression`（多元线性回归）。该测试在本文第 5.4 节有详细介绍。在 SPSS 中，访问路径为
    `Analyze Regression Linear` 并输入多个 `Independent Variable`。


    输出结果将有一个提供答案的 `B` 列。`Constant` 的 `B` 是你的 `Y-Intercept`，你的 `Independent Variables`
    名称旁边的 `Bs` 是它们各自的权重。


    ## Branch 9


    你目前为止的决策：


    * 寻找组间差异

    * 单一因变量


    下一个要问的问题是你是否可以进行 `Parametric Test`（参数检验）或你必须进行 `Nonparametric Test`（非参数检验）。`Parametric
    Tests` 通常要求 `Dependent Variables`（因变量）是在 `Interval`（间距）或 `Ratio`（比例）测量尺度上测量的，并且变量近似从正态分布。使用
    `Nonparametric Tests` 时，你不需要做该假设。


    * 如果你可以进行 `Parametric Test`，请查看 `Branch 11`。

    * 如果你必须进行 `Nonparametric Test`，请查看 `Branch 26`。


    ## Branch 10


    你目前为止的决策：


    * 寻找组间差异

    * 多个因变量


    合适的测试方法是 `MANOVA`（多变量方差分析）。该测试在本文第 7.7 节有详细介绍。在 SPSS 中，访问路径为 `Analyze → General
    Linear Model → Multivariate`。


    本文未涵盖 `MANOVA` 的 `Nonparametric` 等效检验。此外，请注意运行此命令需要 `IBM SPSS Statistics` 的 `Advanced
    Module`（高级模块）。


    ## Branch 11


    你目前为止的决策：


    * 寻找组间差异

    * 单一因变量

    * 参数检验


    有时当研究人员无法实施适当程序控制（例如将参与者随机分配到各组）时，可以通过“协变掉”（covarying out）研究已知可能对 `Dependent Variable`
    有影响的变量来改进整体分析。


    例如，研究人员可能在比较两个班，但无法将学生分配到这些班级（学生是自主选择的）。研究人员知道整体 `GPA` 可能对课程成绩产生影响。因此，研究人员可以从两个班级的成绩中“协变掉”
    `cumulative GPA` 的影响，以便更好地比较这两个班级在其他方面是否存在差异（例如，因为使用了新的教学方法）。


    * 如果你想用 `Covariate` 来分析你的数据，请查看 `Branch 12`。

    * 如果你不打算使用 `Covariate`，请查看 `Branch 13`。


    ## Branch 12


    你目前为止的决策：


    * 寻找组间差异

    * 单一因变量

    * 参数检验

    * 无协变量


    合适的测试方法是 `ANCOVA`（协方差分析）。该测试在本文第 7.6 节有详细介绍。在 SPSS 中的访问路径为 `Analyze → General
    Linear Model → Univariate` 并在 `Covariate` 空间输入变量。


    ## Branch 13


    你目前为止的决策：


    * 寻找组间差异

    * 单一因变量

    * 参数检验

    * 无协变量


    接下来，是时候对 `Independent Variables` 做出决策了。最简单的分析只有一个 `Independent Variable`（例如处理），然而，更复杂的分析可以同时包含多个
    `Independent Variables`（例如处理和时间）。


    * 如果你只是将单个样本与已知总体进行比较，请查看 `Branch 14`。

    * 如果你有一个 `Independent Variable`，请查看 `Branch 15`。

    * 如果你有多个 `Independent Variable`，请查看 `Branch 22`。


    ## Branch 14


    你目前为止的决策：


    * 寻找组间差异

    * 单一因变量

    * 参数检验

    * 无协变量

    * 样本与总体的比较


