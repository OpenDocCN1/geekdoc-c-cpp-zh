  trans: '

    接下来，你需要确定是什么种设计产生了你自变量的两个水平。


    `重复测量设计`（Repeated-Measures Design）是指各种条件下的数据在某种程度上是相互相关的。例如，前测/后测设计或利用双生的设计都属于这一类。这些设计有时被称为相关组设计（Correlated
    Groups Designs）或配对样本设计（Paired Samples Designs）。


    在`独立组设计`（Independent Groups Design）中，每组的数据是相互独立的。这是经典的实验组/控制组设计，每个参与者只在一个（且仅一个）组中


    * 如果你使用的是`独立组设计`，请查看 `Branch 20`。

    * 如果你使用的是`重复测量设计`，请查看 `Branch 21`。


    ## Branch 17


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 参数检验

    * 无协变量

    * 单一自变量

    * 自变量水平多于两个


    接下来，你需要确定是什么种设计产生了你自变量的水平。


    `重复测量设计`是指各种条件下的数据在某种程度上是相互相关的。例如，比较同一批学生在大一、大二、大三和大四时的成绩就属于这一类。这些设计有时被称为相关组设计、受试内设计（Within-Subjects
    Designs）或配对样本设计。


    在`独立组设计`中，每组的数据是相互独立的。这是经典的实验组/控制组设计，每个参与者只在一个（且仅一个）组中。例如，如果你在比较四个不同的 `PSY101`
    老师，就会使用`独立组设计`。这有时被称为受试间设计（Between-Subjects Design）。


    * 如果你的自变量代表`独立组`，请查看 `Branch 18`。

    * 如果你的自变量代表`重复测量`，请查看 `Branch 19`。


    ## Branch 18


    你目前为止的决策：


    * 寻找组间差异

    * 一个因变量

    * 参数检验

    * 无协变量

    * 单一自变量

    * 自变量水平多于两个

    * 独立组


    相应的检验是单因素方差分析（技术上是单因素受试间方差分析）。该检验在本文第 7.2 节中有详细介绍。在 SPSS 中的访问路径为 `Analyze → Compare
    Means → One-Way ANOVA`。


