    在 SPSS 数据窗口中，列代表变量，行代表受访者。因此，我们将创建一个包含六列（变量）和两行（学生/受访者）的数据文件。


    # 第 1.3 节 定义变量


    在输入任何数据之前，我们必须先在 SPSS 中输入有关每个变量的基本信息。例如，变量必须首先命名并符合以下条件：


    * 以字母开头，且

    * 不包含空格。


    因此，变量名 `Q7` 是可以的，而变量名 `7Q` 则不行。同样，变量名 `PRE_TEST` 是可以的，但变量名 `PRE TEST` 不行。大小写并不重要，但本文中的变量名均采用大写，以便在引用变量名时清晰明了，即使截图中的变量名不一定大写。


    要定义变量，点击主屏幕底部的 `Variable View`（变量视图）选项卡（见右图）。这将显示 `Variable View` 窗口。如需返回 `Data
    View`（数据视图）窗口，请点击 `Data View` 选项卡。


    ![](img/fig00007.jpg)![](img/fig00008.jpg)


    在 `Variable View` 界面，SPSS 允许你创建和编辑数据文件中所有的变量。每一列代表变量的某个属性，每一行代表一个变量。所有变量都必须命名。要进行命名，点击
    `Name` 列中的第一个空单元格，并输入有效的 SPSS 变量名。程序随后将为大多数其他属性填充默认值。


    SPSS 的一个有用功能是能够定义变量标签（Variable labels）和值标签（Value labels）。变量标签允许你为每个变量关联描述信息。


    值标签允许你为变量的每个值关联描述。例如，对于大多数操作，SPSS 要求数值。因此，对于诸如课程日期（即周一/三/五和周二/四）的数据，我们需要先将这些值编码为数字。我们可以为
    `Mon/Wed/Fri` 分配数字 `1`，为 `Tues/Thurs` 分配数字 `2`。为了帮助我们跟踪分配给值的数字，我们使用值标签。


    分配值标签，点击 `Values` 列中你想要赋值的单元格（在本例中，针对 `Variable 2`）。这将弹出一个小灰色按钮（如下所示）。点击该按钮打开
    `Value Labels` 对话框。


    ![](img/fig00009.jpg)![](img/fig00010.jpg)


    当你输入值标签时，在每个条目后必须点击 `Add`。这将把值及其关联标签移动到窗口的底部。当所有标签添加完毕后，点击 `OK` 返回 `Variable View`
    窗口。


    除了命名和标记变量外，你还可以选择定义变量类型。要这样做，只需点击 `Variable View` 窗口中的 `Type`（类型）、`Width`（宽度）或
    `Decimals`（小数）列。默认值是一个宽度为八位并显示两位小数的数值字段。如果你的数据小数点左侧超过八位，它们将以科学计数法显示（例如，数字 `2,000,000,000`
    将显示为 `2.00E+09`）。SPSS 会保持两位小数以上的精度，但除非 `Decimals` 列另有说明，否则所有输出将四舍五入到两位小数。


    此界面还有其他可用选项，这些超出了本文的范围。在我们的示例中，我们将使用带有所有默认值的数值变量。


    ### 练习题


    为示例 1.2.1 所示的六个变量和两个样本学生创建一个数据文件。变量命名为：`ID`、`DAY`、`TIME`、`MORNING`、`GRADE` 和 `WORK`。将
    `DAY` 编码为 `1 = Mon/Wed/Fri`、`2 = Tues/Thurs`。将 `TIME` 编码为 `1 = morning`、`2 = afternoon`。将
    `MORNING` 编码为 `0 = No`、`1 = Yes`。将 `WORK` 编码为 `0 = No`、`1 = Part-time`、`2 = Full-time`。确保为不同的变量输入值标签。注意，由于值标签对于
    `ID` 和 `GRADE` 不适用（因为值本身就是标签），完成后，你的 `Variable View` 窗口应该像下面的截图。


    ![](img/fig00011.jpg)


    点击 `Data View` 选项卡打开数据输入界面。水平输入数据，从第一个学生的 `ID` 号开始。在相应的列中输入每个变量的代码。输入 `GRADE`
    变量值时，输入学生的班级成绩。


    ![](img/fig00012.jpg)


    通过点击 `Value Labels` 图标（见下文），可以将之前的数据窗口更改为如下截图所示。在这种情况下，单元格显示的是值标签而非代码。


    ![](img/fig00013.jpg)![](img/fig00014.jpg)


    除了点击 `Value Labels` 图标，也可以通过 `View` 菜单下的 `Value Labels` 切换视图。


