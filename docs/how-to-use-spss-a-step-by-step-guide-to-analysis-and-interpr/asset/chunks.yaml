    `Within Groups`（组内差异，代表自变量每个水平内部的差异）。在我们的示例中，`Between Groups` 方差代表不同老师带来的差异。`Within
    Groups` 方差代表学生之间的个体差异。


    ![](img/fig00156.jpg)


    主要的答案是 `F`。`F` 是解释方差与未解释方差的比率。有关如何确定它，请参阅统计学教科书。`F` 有两个不同的自由度，一个用于 `Between Groups`（在这种情况下，`2`
    是自变量的水平数 `<3–1>`），另一个用于 `Within Groups`（`18` 是参与者人数减去自变量的水平数 `<21–3>`）。


    输出的下部分由我们的 `Tukey’s HSD` 事后比较结果组成。


    ![](img/fig00157.jpg)


    该表向我们展示了自变量水平的所有可能组合。第一行代表老师 1 与老师 2 的比较。接下来是老师 1 与老师 3 的比较。接着是老师 2 与老师 1 的比较（注意这与第一行是冗的）。接下来是老师
    2 与老师 3 的比较，依此类推。


    标记为 `Sig.` 的列代表该行中简单（2 水平）比较的第一类错误（`p`）率。在上面的示例中，老师 1 与老师 3 之间存在显著差异，但老师 1 与老师
    2 之间没有显著差异，老师 2 与老师 3 之间也没有显著差异。


    ### 得出结论


    为方差分析得出结论需要标明 `F` 值、自由度和显著性水平。显著的方差分析之后应当是事后分析的结果以及对结果的口头陈述。


    ### 显著结果的表述


    在前面的示例中，我们可以这样描述：


    我们计算了单因素方差分析，比较了从三位不同老师处课程的参与者的最终考试成绩。发现老师之间存在显著差异（`F (2,18) = 4.08, p < .05`）。使用
    `Tukey’s HSD` 来确定老师之间差异的性质。分析显示，老师 1 的学生得分（`M = 79.57, sd = 7.96`）低于老师 3 的学生（`M
    = 92.43, sd = 5.50`）。选老师 2 的学生（`M = 86.43, sd = 10.92`）与另外两个组相比均无显著差异。


    ### 不显著结果的表述


    如果我们使用 `PRETEST` 代替 `FINAL` 进行分析，我们将得到以下输出：


    ![](img/fig00158.jpg)Images/fig00159.jpg)


    方差分析不显著，因此不需要引用多重比较表。根据此结果，我们可以陈述：


    三个班级学生在学期初的预测均值没有显著差异（`F (2,18) = 1.60, p > .05`）。老师 1 的学生平均分为 67.57（`sd = 8.38`）。老师
    2 的学生平均分为 63.14（`sd = 10.61`）。老师 3 的学生平均分为 59.29（`sd = 6.55`）。


    ### 练习题


    使用 `附录 B` 中的`练习数据集 1`，确定单身、已婚和离婚参与者的平均数学分是否存在显著差异。请写一份结果陈述。

