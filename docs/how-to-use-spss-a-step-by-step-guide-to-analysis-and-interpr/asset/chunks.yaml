    ## 第 9.1 节 项目-总分分析 (Item-Total Analysis)


    ### 描述

    项目-总分分析是评估数据集内部一致性方法。因此，它是许多信度检验之一。项目-总分分析由构成量表或测试的多个项目组成，这些项目旨在测量单一构念（例如智力），并确定了所有项目在多大程度上测量了同一个构念。它并不能告诉你是否测量了正确的构念（那是效度问题）。然而，在测试有效之前，它必须首先是可靠的。


    ### 假设

    量表中的所有项目都应在间隔或比例尺度上进行测量。此外，每个项目都应呈正态分布。如果你的项目本质上是定序的可以使用 `Spearman rho correlation`（斯皮尔曼相关）代替
    `Pearson r correlation`（皮尔逊 r 相关）。


    ### SPSS 数据格式

    SPSS 要求量表中的每个项目（或问题）对应一个变量。此外，你必须有一个代表量表总分的变量。


    ### 执行检验

    项目-总分分析使用 `Pearson Correlation`（皮尔逊相关）命令。要执行它，打开你在第 2 章中创建的 `QUESTIONS.sav` 数据文件。点击
    `Analyze`（分析），然后 `Correlate`（相关），最后 `Bivariate`（双变量）。


    ![](img/fig00236.jpg)![](img/fig00237.jpg)


    将所有问题和总分放在右侧窗口，并点击 `OK`。（有关执行相关分析的更多帮助信息，请参见第 5 章）。总分可以使用第 2 章中讨论的技术进行计算。


    ### 读取输出

    输出包含一个包含所有问题和总分的相关矩阵。使用标记为 `TOTAL` 的列，找到总分与每个问题之间的相关性。在右侧所示示例中，`QUESTION 1` 与总分的相关性为
    `0.873`。`QUESTION 2` 与总分的相关性为 `0.130`。`QUESTION 3` 与总分的相关性为 `0.926`。


    ![](img/fig00238.jpg)


    ### 解释输出

    项目-总分相关性始终应为正。如果你得到负相关，则应从量表中删除该问题（或者你可以考虑是否应该进行反向计分）。


    通常，大于 `0.7` 的项目-总分相关性是理想的。小于 `0.3` 的被认为是弱的。通常，会删除相关性最低的项目，然后重新计算总分。当所有剩余相关性都大于
    `0.3` 时，量表的剩余项目被认为具有内部一致性。


    ## 第 9.2 节 Cronbach''s Alpha (Alpha 系数)


    ### 描述

    Cronbach''s alpha 是内部一致性的衡量标准。因此，它是许多信度检验之一。Cronbach''s alpha 由构成测量单一构念（例如智力）量表的多个项目组成，并确定了所有项目在多大程度上测量了同一个构念。它不能告诉你是否测量了正确的构念（那是效度问题）。正如提到的，在测试有效之前，它必须首先是可靠的。


    ### 假设

    量表所有项目都应在间隔或比例尺度上进行测量。此外，每个项目都应呈正态分布。


    ### SPSS 数据格式

    SPSS 要求量表中的每个项目（或问题）对应一个变量。


    ### 执行命令

    继续使用第 2 章中首次创建的 `QUESTIONS.sav` 数据文件。点击 `Analyze`（分析），然后 `Scale`（量表），最后 `Reliability
    Analysis`（信度分析）。


    ![](img/fig00239.jpg)


    这将弹出信度分析的主对话框。将量表中的问题转移到 `Items`框，并点击 `OK`。不要转移代表总分的变量。


    ![](img/fig00240.jpg)


    注意，如果更改 `Model` 下的选项，可以计算额外的内部一致性测量（例如半系数）。


    ### 读取输出

    在本示例中，信度系数为 `0.407`。接近 `1.00` 的非常好，而接近 `0.00` 的表示内部一致性差。


    ![](img/fig00241.jpg)


    ## 第 9.3 节 重测信度 (Test-Retest Reliability)


    ### 描述

    重测信度是时间稳定性的衡量。因此，它是信度的一种衡量。与内部一致性衡量（它告诉你构成量表的所有问题测量同一构念的程度）不同，时间稳定性衡量的是工具在时间推移或多次实施过程中是否保持一致。


    ### 假设

    量表的总分应为间隔或比例尺度。量表分应呈正态分布。


    ### SPSS 数据格式

    '
- fmt: '

    SPSS requires a variable representing the total score for the scale at the time
    of first administration. A second variable representing the total score for the
    same participants at a different time (normally two weeks later) is also required.


    ### Running the Command


    The test-retest reliability coefficient is simply a Pearson correlation coefficient
    for the relationship between the total scores for the two administrations. To
    compute the coefficient, follow the directions for computing a Pearson correlation
    coefficient ([Chapter 5](#Ch05.xhtml_ht0112), Section 5.1). Use the two variables
    representing the two administrations of the test.


    ### Reading the Output


    The correlation between the two scores is the test-retest reliability coefficient.
    It should be positive. Strong reliability is indicated by values close to 1.00.
    Weak reliability is indicated by values close to 0.00.


    ## Section 9.4 Criterion-Related Validity


    ### Description


    Criterion-related validity determines the extent to which the scale you are testing
    correlates with a criterion. For instance, ACT scores should correlate highly
    with GPA. If they do, that is a measure of validity for ACT scores. If they do
    not, that indicates that ACT scores may not be valid for the intended purpose.


    ### Assumptions


    All of the same assumptions for the Pearson correlation coefficient apply to measures
    of criterion-related validity (interval or ratio scales, normal distribution,
    etc.).


    ### SPSS Data Format


    Two variables are required. One variable represents the total score for the scale
    you are testing. The other represents the criterion you are testing it against.


    ### Running the Command


    Calculating criterion-related validity involves determining the Pearson correlation
    value between the scale and the criterion. See [Chapter 5](#Ch05.xhtml_ht0112),
    Section 5.1 for complete information.


    ### Reading the Output


    The correlation between the two scores is the criterion-related validity coefficient.
    It should be positive. Strong validity is indicated by values close to 1.00. Weak
    validity is indicated by values close to 0.00.


    ## Section 9.5 Inter-Rater Reliability


    ### Description


    There are many ways to measure inter-rater reliability. It can be as simple as
    the correlation between two reviewer’s scores if you have an interval or ratio
    scale (or even a Spearman rho if you have a nominal scale). A common measure with
    nominal scales, however, is Cohen’s Kappa.


    ### Assumptions


    Cohen’s Kappa works best with nominal scales with a limited number of categories.


    ### SPSS Data Format


    Two variables are required. One variable represents the rating of one person and
    the second variable represents the rating of the other rater. For example, you
    could have a datafile using the data presented here.


    ![](Images/fig00242.jpg)


    ### Running the Command


    Calculating inter-rater reliability involves the `crosstabs` command. See [Chapter
    3](#Ch03.xhtml_ht0042), Section 3.2 for more information. Enter one rater’s scores
    as the columns and the other rater’s scores as the rows.


    ![](Images/fig00243.jpg)


    When running `crosstabs`, you select the Statistics option and then select Kappa.


    ![](Images/fig00244.jpg)


    ### Reading the Output


    The inter-rater reliability is represented at the bottom of the output as Kappa.
    In the example here, kappa is equal to .651. While there is some disagreement
    on interpreting Kappa, Landis and Koch (1977) have suggested values < .2 as slight,
    .2-.4 as fair, .4-.6 as moderate, .5-.8 as strong, and > .8 as almost perfect.[¹]](#Ch09.xhtml_fn0004)


    ![](Images/fig00245.jpg)


    ## Note


    [1.](#Ch09.xhtml_bck_fn0004) Landis, J.R., & Koch, G.G. (1977). The measurement
    of observer agreement for categorical data. Biometrics, 33, 159–174.


    # Appendix A Effect Size (#contents.xhtml_bck_ht0344)


    Many disciplines are placing increased emphasis on reporting effect size. While
    statistical hypothesis testing provides a way to tell the odds that differences
    are real, effect sizes provide a way to judge the relative importance of those
    differences. That is, they tell us the size of the difference or relationship.
    They are also critical if you would like to estimate necessary sample sizes, conduct
    a power analysis, or conduct a meta-analysis. Many professional organizations
    (e.g., the American Psychological Association) are now requiring or strongly suggesting
    that effect sizes be reported in addition to the results of hypothesis tests.


    Because there are at least 41 different types of effect sizes,^([1](#Apendix1.xhtml_fn0005))
    each with somewhat different properties, the purpose of this appendix is not to
    be a comprehensive resource on effect size, but rather to show you how to calculate
    some of the most common measures of effect size using SPSS.


    ## Cohen''s d


    One of the simplest and most popular measures of effect size is Cohen’s d. Cohen’s
    d is a member of a class of measurements called standardized mean differences.
    In essence, `d` is the difference between the two means divided by the overall
    standard deviation.


    It is not only a popular measure of effect size, but Cohen has also suggested
    a simple basis to interpret the value obtained. Cohen^([2](#Apendix1.xhtml_fn0006))
    suggests that effect sizes of .2 are small, .5 are medium, and .8 are large.


    We will discuss Cohen’s d as the preferred measure of effect size for t tests.
    Unfortunately, SPSS does not calculate Cohen’s d. However, this appendix will
    cover how to calculate it from the output that SPSS does produce.


    ### Effect Size for Single-Sample t Tests


    Although SPSS does not calculate effect size for the single-sample t test, calculating
    Cohen’s d is a simple matter.


    Cohen’s d for a single-sample t test is equal to the mean difference over the
    standard deviation. If SPSS provides us with the following output, we calculate
    `d` as indicated below.


    $\mathit{d}=\frac{\overline{\mathit{D}}}{\mathit{s}_{\mathit{D}}}$


    $\mathit{d}=\frac{.90}{1.1972}$


    *d* = .752


    In this example, using Cohen’s guidelines to judge effect size, we would have
    an effect size between medium and large.


    ## T-Test


    ![One-Sample Test](Images/fig00249.jpg)


    One-Sample Test


    ![Group Statistics](Images/fig00250.jpg)


    Group Statistics


    ### Effect Size for Independent-Samples t Tests


    Calculating effect size from the independent t test output is a little more complex
    because SPSS does not provide us with the pooled standard deviation. The upper
    section of the output, however, does provide us with the information we need to
    calculate it. [Chapter 6](#Ch06.xhtml_ht053).


    ![](Images/fig00251.jpg)


    $S_{pooled}=,\,\sqrt{\left( n_{1} - 1 \right)S_{1}^{2} + {\left( n_{2} - 1 \right)S_{2}^{2}}}{n_{1}
    + n_{2} - 2}}$One-Sample Statistics


    $S_{pooled}\,,\,\sqrt{\frac{(2 - 1)3.5355^{2} + {(2 - 1)7.0711^{2}}}{2 + 2 - 2}}$


    *s*[*p**o**o**l**e**d**] =  5.59


    Once we have calculated the pooled standard deviation (`s[pooled]`), we can calculate
    Cohen’s d.


    $\mathit{d}=\frac{{\overline{\mathit{X}}}_{1} - {\overline{\mathit{X}}}_{2}}{S_{\mathit{p}\mathit{o}\mathit{o}l\mathit{e}\mathit{d}}}$


    $\mathit{d}=\frac{82.50 - 7800}{5.59}$


    *d* = .81


    So, in this example, using Cohen’s guidelines for the interpretation of d, we
    would have obtained a large effect size.


    ### Effect Size for Paired-Samples t Tests


    As you have probably learned in your statistics class, a paired-samples t test
    is really just a special case of the single-sample t test. Therefore, the procedure
    for calculating Cohen’s d is also the same. The SPSS output, however, looks a
    little different, so you will be taking your values from different areas.


    ![](Images/fig00259.jpg)


    $d = \frac{\overline{D}}{S_{D}}$Paired Samples Test


    $\mathit{d}=\frac{- 22.8095}{8.9756}$


    *d* = 2.54

