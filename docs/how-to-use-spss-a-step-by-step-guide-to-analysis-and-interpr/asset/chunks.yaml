    接下来，你需要确定是什么种设计产生了你多个自变量的水平。


    `重复测量设计`（也称为`受试内设计` Within-Subjects）是指各种条件下的数据在某种程度上是相互相关的。例如，比较同一批学生在大一、大二、大三和大四时的成绩就属于这一类。这些设计有时被称为相关组设计或配对样本设计。


    在`独立组设计`（也称为`受试间设计` Between-Subjects）中，每组的数据是相互独立的。这是经典的实验组/控制组设计，每个参与者只在一个（且仅一个）组中。例如，如果你在比较四个不同的
    `PSY101` 老师，就会使用`独立组设计`。


    由于你有多个自变量，你的自变量可以全是`重复测量`、全是`独立组`，或者是两者的混合。


    * 如果你所有的自变量都代表`独立组`，请查看 `Branch 23`。

    * 如果你所有的自变量都代表`重复测量`，请查看 `Branch 24`。

    * 如果你的自变量是`独立组`和`重复测量`的混合，请查看 `Branch 25`。


