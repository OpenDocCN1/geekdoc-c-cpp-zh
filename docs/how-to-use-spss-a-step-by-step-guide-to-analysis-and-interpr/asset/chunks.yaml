    ## Section 5.3 Simple Linear Regression


    ### Description


    Simple linear regression allows for the prediction of one variable from another.


    ### Assumptions


    Simple linear regression assumes that both variables are interval- or ratio-scaled.
    In addition, the dependent variable should be normally distributed around the
    prediction line. This, of course, assumes that the variables are related to each
    other linearly. Typically, both variables should be normally distributed. Dichotomous
    variables (variables with only two levels) are also acceptable as independent
    variables.


    ### SPSS Data Format


    Two variables are required in the SPSS data file. Each subject must contribute
    to both values.


    ### Running the Command


    ![](Images/fig00103.jpg)


    Returning to the `HEIGHT.sav` data file, click `Analyze`, then `Regression`, then
    `Linear`. This will bring up the main dialog box for `Linear Regression`, shown
    below. On the left side of the dialog box is a list of the variables in your data
    file. On the right are blocks for the dependent variable (the variable we are
    trying to predict) and the independent variable (the variable from which we are
    predicting).


    ![](Images/fig00104.jpg)


    We are interested in predicting someone’s weight on the basis of his or her height.
    Thus, we should place the variable `WEIGHT` in the dependent variable block and
    the variable `HEIGHT` in the independent variable block. Then, we can click `OK`
    to run the analysis.


    ### Reading the Output


    For simple linear regressions, we are interested in three components of the output.
    The first is called the `Model Summary`, and it occurs after the `Variables Entered/Removed`
    section. For our example, you should see this output. `R Square` (called the coefficient
    of determination) gives you the proportion of the variance of your dependent variable
    (`WEIGHT`) that can be explained by variation in your independent variable (`HEIGHT`).
    Thus, 64.9% of the variation in weight can be explained by differences in height
    (taller individuals weigh more).


    ![](Images/fig00105.jpg)


    The standard error of estimate gives you a measure of dispersion for your prediction
    equation. When the prediction equation is used, 68% of the data will fall within
    one standard error of estimate (predicted) value. Just over 95% will fall within
    two standard errors. Thus, in the previous example, 95% of the time, our estimated
    weight will be within 32.296 pounds of being correct (i.e., `2 × 16.148 = 32.296`).


    ![](Images/fig00106.jpg)


    The second part of the output that we are interested in is the `ANOVA` summary
    table, as shown above. The important number here is the significance level in
    the rightmost column. If that value is less than .05, then we have a significant
    linear regression. If it is larger than .05, we do not. For more information on
    reading ANOVA tables, refer to the sections on ANOVA in [Chapter 7](#Ch07.xhtml_ht0194).


    The final section of the output is the table of coefficients. This is where the
    actual prediction equation can be found.


    ![](Images/fig00107.jpg)


    In most texts, you learn that `Y'' = a + bX` is the regression equation. `Y''`
    (pronounced “Y prime”) is your dependent variable (primes are normally predicted
    values or dependent variables), and `X` is your independent variable. In SPSS
    output, the values of both `a` and `b` are found in the `B` column. The first
    value, –234.681, is the value of `a` (labeled `Constant`). The second value, 5.434,
    is the value of `b` (labeled with the name of the independent variable). Thus,
    our prediction equation for the example above is `WEIGHT'' = –234.681 + 5.434(HEIGHT)`.
    In other words, the average subject who is an inch taller than another subject
    weighs 5.434 pounds more. A person who is 60 inches tall should weigh `-234.681
    + 5.434(60) = 91.359` pounds. Given our earlier discussion of standard error of
    estimate, 95% of individuals who are 60 inches tall will weigh between 59.063
    (91.359–32.296).


    ## Drawing Conclusions


    Conclusions from regression analyses indicate (a) whether or not a significant
    prediction was obtained, (b) the direction of the relationship, and (c) the equation
    itself.


    ### Phrasing Results That Are Significant


    In the example on XX, we obtained an `R Square` of .649 and a regression equation
    of `WEIGHT'' = –234.681 + 5.434(HEIGHT)`. The ANOVA resulted in `F(1,14) = 25.926`,
    `p < .001`. Thus, we could state the following in a results section:


    A simple linear regression was calculated to predict participants’ weight based
    on their height. A significant regression equation was found (`F (1,14) = 25.926`,
    `p < .001`), with an `R2` of .649. Participants’ average weight increased 5.43
    pounds for each inch of height.


    ### Phrasing Results That Are Not Significant


    If the ANOVA is not significant (e.g., see the output below), the section of the
    output labeled `Sig.` for the ANOVA will be greater than .05, and the regression
    equation will not be significant. A results section might include the following:


    A simple linear regression was calculated to predict participants’ ACT scores
    based on their height. The regression equation was not significant (`F (1,14)
    = 4.12`, `p > .05`) with an `R2` of .227. Height is not a significant predictor
    of ACT scores.

