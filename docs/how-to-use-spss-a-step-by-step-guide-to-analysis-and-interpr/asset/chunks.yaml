    The Repeated Measures command should be used if any of the independent variables
    are repeated measures (within-subjects).


    ![](Images/fig00174.jpg)


    This example also uses the GRADES.sav data file. Enter PRE-TEST, MIDTERM, and
    FINAL in the Within-Subjects V ariables block. (See the Repeated Measures ANOVA
    command in Section 7.4 for an explanation.) This example is a 3 × 3 mixed-design.
    There are two independent variables (TIME and INSTRUCT), each with three levels.
    We previously entered the information for TIME in the Repeated Measures Define
