    ![](Images/fig00070.jpg)\n\n### Running the Command\n\n![](Images/fig00071.jpg)\n\
    \nThe Frequencies command will produce graphical frequency distributions. Click\
    \ Analyze, then Descriptive Statistics, then Frequencies. You will be presented\
    \ with the main dialog box for the Frequencies command, where you can enter the\
    \ variables for which you would like to create graphs or charts (HEIGHT in this\
    \ example). See [Chapter 3](#Ch03.xhtml_ht0042) for other options with this command.\n\
    \n![](Images/fig00072.jpg)\n\nClick the Charts button on the right side of the\
    \ frequencies command to bring up the Charts dialog box.\n\n![](Images/fig00073.jpg)\n\
    \nThere are three types of charts available with this command: Bar charts, Pie\
    \ charts, and Histograms. For each type, the Y-axis can be either a frequency\
    \ count or a percentage (selected with the Chart Values option). Select Bar charts\
    \ and click Continue. Next, click OK.\n\nYou will receive the charts for any variables\
    \ selected in the main Frequencies command dialog box.\n\n### Output\n\nThe bar\
    \ chart consists of a Y-axis, representing the frequency, and an X-axis, representing\
    \ each score. Note that the only values represented on the X-axis are those values\
    \ with nonzero frequencies (61, 62, and 71 are not represented).\n\n![](Images/fig00074.jpg)\n\
    \nIf selected for output, the pie chart shows the percentage of the whole that\
    \ is represented by each value.\n\n![](Images/fig00075.jpg)\n\nThe Histogram command\
    \ creates a grouped frequency distribution. The range of scores is split into\
    \ evenly spaced groups. The midpoint of each group is plotted on the X-axis, and\
    \ the Y-axis represents the number of scores for each group.\n\n![](Images/fig00076.jpg)\n\
    \nIf you select Show normal curve on histogram, a normal curve will be superimposed\
    \ over the distribution. This is very useful in determining if the distribution\
    \ you have is approximately normal.\n\n### Practice Exercise\n\nUse Practice Dataset\
    \ 1 in [Appendix B](#Apendix2.xhtml_ht0356). After you have entered the data,\
    \ first construct a histogram that represents the mathematics skills scores and\
    \ displays a normal curve, and then construct a bar chart that represents the\
    \ frequencies for the variable AGE.\n\n## Section 4.3 The SPSS Chart Builder\n\
    \n### Chart Builder Basics\n\nMake sure that the HEIGHT.sav data file you created\
    \ in Section 4.2 is open. In order to use the chart builder, you must have a data\
    \ file open.\n\n![](Images/fig00077.jpg)\n\nThe Chart Builder command is accessed\
    \ using Graphs, then Chart Builder in the submenu. This is a very versatile command\
    \ that can make a variety of graphs of excellent quality.\n\nWhen you first run\
    \ the Chart Builder command, you will probably be presented with the following\
    \ dialog box:\n\n![](Images/fig00078.jpg)![](Images/fig00079.jpg)\n\nThis dialog\
    \ box is asking you to ensure that your variables are properly defined. Refer\
    \ to Sections 1.3 and 2.1 if you had difficulty defining the variables used in\
    \ creating the dataset for this example, or to refresh your knowledge of this\
    \ topic. Click OK.\n\nThe Chart Builder allows you to make any kind of graph that\
    \ is normally used in publication or presentation, and much of it is beyond the\
    \ scope of this text. However, this text will go over the basics of the Chart\
    \ Builder so that you can understand its mechanics.\n\nNear the middle of the\
    \ dialog box, there are four main tabs that let you control the graphs you are\
    \ making. The first one is the Gallery tab. The Gallery tab allows you to choose\
    \ the basic format of your graph.\n\nFor instance, the screenshot above shows\
    \ the different kinds of bar charts that the Chart Builder can create.\n\nAfter\
    \ you have selected the basic form of graph that you want using the Gallery tab,\
    \ you simply drag the image from the bottom right of the window up to the main\
    \ window at the top (where it reads, “Drag a Gallery chart here to use it as your\
    \ starting point”).\n\nAlternatively, you can use the Basic Elements tab to drag\
    \ a coordinate system (labeled Choose Axes) to the top window, then drag variables\
    \ and elements into the window.\n\nThe other tabs (Groups/Point ID and Titles/Footnotes)\
    \ can be used for adding other standard elements to your graphs.\n\nThe examples\
    \ in this text will cover some of the basic types of graphs you can make with\
    \ the Chart Builder. After a little experimentation on your own, and once you\
    \ have mastered the examples in this chapter, you will soon gain a full understanding\
    \ of the Chart Builder.\n\n## Section 4.4 Scatterplots\n\n### Description\n\n\
    Scatterplots (also called scattergrams or scatter diagrams) display two values\
    \ for each case with a mark on the graph. The X-axis represents the value for\
    \ one variable. The Y-axis represents the value for the second variable.\n\n###\
    \ Assumptions\n\nBoth variables should be interval or ratio scales. If nominal\
    \ or ordinal data are used, be cautious about your interpretation of the scattergram.\n\
    \n### SPSS Data Format\n\nYou need two variables to perform this command.\n\n\
    ### Running the Command\n\n![](Images/fig00080.jpg)\n\nYou can produce scatterplots\
    \ by clicking Graphs, then Chart Builder."
