    # How to use SPSS®


    How to Use SPSS^® is designed with the novice computer user in mind and for people
    who have no previous experience using SPSS. Each chapter is divided into short
    sections that describe the statistic being used, important underlying assumptions,
    and how to interpret the results and express them in a research report.


    The book begins with the basics, such as starting SPSS, defining variables, and
    entering and saving data. It covers all major statistical techniques typically
    taught in beginning statistics classes, such as descriptive statistics, graphing
    data, prediction and association, parametric inferential statistics, nonparametric
    inferential statistics and statistics for test construction.


    More than 250 screenshots (including sample output) throughout the book show students
    exactly what to expect as they follow along using SPSS. The book includes a glossary
    of statistical terms and practice exercises. A complete set of online resources
    including video tutorials and output files for students, and PowerPoint slides
    and test bank questions for instructors, make How to Use SPSS^® the definitive,
    field-tested resource for learning SPSS.


    ## New to this edition:


    *   Fully updated to SPSS 24 and IBM SPSS Statistics Cloud

    *   New chapter on ANOVA

    *   New material on inter-rater reliability

    *   New material on syntax

    *   Additional coverage of data entry and management


    Brian C. Cronk is Professor and Chair, Department of Psychology, Missouri Western
    State University USA (PhD in Psychology 1993, University of Wisconsin-Milwaukee).


