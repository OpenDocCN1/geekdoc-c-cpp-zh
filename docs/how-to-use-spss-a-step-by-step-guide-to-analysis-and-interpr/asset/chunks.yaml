    ## 第 7.6 节协差分析


    ### 描述


    协差分析（ANCOVA）允许你消除已知协变量的影响。通过这种方式，它了一种统计控制方法。通过方法学控制（例如随机分配），可以获得内部效度。当无法进行方法学控制时，可以使用统计控制。


    如果你有重复测量因子，可以使用 `GLM` 命令执行 ANCOVA。由于基础统计模块未包含 `GLM` 命令，因此此处未包含它。


    ### 假设


    ANCOVA 要求协变量与因变量显著相关。因变量和协变量应该是等距或比例水平的。此外，两者都应该符合正态分布。


    ### SPSS 数据格式


    SPSS 数据文件必须包含每个自变量一个变量、一个代表因变量的变量以及至少一个协变量。


    ### 执行命令


    ![](img/fig00179.jpg)


    使用因子方差分析命令来运行 ANCOVA。要运行它，点击“分析”（Analyze），然后选择通用线性模型”（General Linear Model），最后选择“单变量”（Univariate）。按照因子方差分析的说明进行操作，使用
    `HEIGHT.sav` 样本数据文件。将变量 `HEIGHT` 视为因变量（Dependent Variable）。输入 `SEX` 作为固定因子（Fixed
    Factor），然后输入 `WEIGHT` 作为协变量（Covariate）。最后一步决定了普通因子方差分析与 ANCOVA 的区别。点击确定 运行 ANCOVA。


    ![](img/fig00180.jpg)


    ### 读取输出


    输出包含一个主源表（如下所示）。该表提供了你在普通因子方差分析中会获得的主效应和交互作用。此外，每个协变量都有一行。在我们的示例中，我们有一个主效应（`SEX`）和一个协变量（`WEIGHT`）。通常，我们只检查协变量行，以确认协变量与因变量显著相关。


    ### 得出结论


    进行此示例分析是为了确定在考虑体重后，男女身高是否存在差异。我们知道体重与身高有关。与其匹配参与者或使用方法学控制，我们可以从统计学上消除体重的影响。


    在给出 ANCOVA 结果时，必须给出所有主效应、交互作用和协变量的 `F` 值、自由度和显著性水平。如果主效应或交互作用显著，必须进行事后检验。还应该给出自变量每个水平的描述性统计（均值和标准差）。要获得描述性统计，请检查“选项”（Options）下的“描述统计”。


    ![](img/fig00181.jpg)![](img/fig00182.jpg)


    ### 显著结果的表述


    上一个示例获得了显著结果，因此我们可以这样陈述：


    计算了一个单因素组间 ANCOVA，以考察性别对身高的影响，同时协偏体重的影响。体重与身高显著相关（`F (1,13) = 112.11, p < .001`）。性别的主效应显著（`F
    (1,13) = 62.02, p < .001`），其中男性显著高于女性（`M = 69.38, sd = 3.70`，女性为 `M = 64.50, sd
    = 2.33`）。


    ### 不显著结果的表述


    如果协变量不显著，我们需要在不包含协变量的情况下重复分析（即运行普通方差分析）。


    对于不显著的 ANCOVA 结果，你可以这样陈述（注意 F 值是为此示例虚构的）：


    计算了一个单因素组间 ANCOVA，以考察性别对身高的影响，同时协偏体重的影响。体重与身高显著相关（`F (1,13) = 112.11, p < .001`）。性别的主效应不显著（`F
    (1,13) = 62.02, p > .05`），即使在协偏体重影响后，男性并未显著高于女性（`M = 69.38, sd = 3.70`，女性为 `M
    = 64.50, sd = 2.33`）。


