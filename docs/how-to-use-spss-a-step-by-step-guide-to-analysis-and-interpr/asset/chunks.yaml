    consistency (e.g., split-half) can be calculated.


    ### Reading the Output


    In this example, the reliability coefficient is 0.407\. Numbers close to 1.00
    are very good, but numbers close to 0.00 represent poor internal consistency.


    ![](Images/fig00241.jpg)


    ## Section 9.3 Test-Retest Reliability


    ### Description


    Test-retest reliability is a measure of temporal stability. As such, it is a measure
    of reliability. Unlike measures of internal consistency that tell you the extent
    to which all of the questions that make up a scale measure the same construct,
    measures of temporal stability tell you whether or not the instrument is consistent
    over time or over multiple administrations.


    ### Assumptions


    The total score for the scale should be an interval or ratio scale. The scale
    scores should be normally distributed.


