    ![](Images/fig00114.jpg)


    For multiple linear regression, there are three components of the output in which
    we are interested. The first is called the Model Summary, which is found after
    the Variables Entered/Removed section. For our example, you should get the output
    above.


    R Square (called the coefficient of determination) tells you the proportion of
    the variance in the dependent variable (WEIGHT) that can be explained by variation
    in the independent variables (HEIGHT and SEX, in this case). Thus, 99.3% of the
    variation in weight can be explained by differences in height and sex (taller
    individuals weigh more, and men weigh more). Note that when a second variable
    is added, our R Square goes up from .649 to .993\. The .649 was obtained using
    the Simple Linear Regression example in Section 5.3.


    The standard error of the estimate gives you a margin of error for the prediction
    equation. Using the prediction equation, 68% of the data will fall within one
    standard error of estimate (predicted) value. Just over 95% will fall within two
    standard errors of estimate. Thus, in the example above, 95% of the time our estimated
    weight will be within 4.591 (2.29571 × 2) pounds of being correct. In our Simple
    Linear Regression example in Section 5.3, this number was 32.296\. Note the higher
    degree of accuracy.


    The second part of the output that we are interested in is the ANOVA summary table.
    For more information on reading ANOVA tables, refer to the sections on ANOVA in
    [Chapter 7](#Ch07.xhtml_ht0194). For now, the important number is the significance
    in the rightmost column. If that value is less than .05, we have a significant
    linear regression. If it is larger than .05, we do not.


    ![](Images/fig00115.jpg)


    The final section of output we are interested in is the table of coefficients.
    This is where the actual prediction equation can be found.


    In most texts, you learn that Y'' = a + bX is the regression equation. For multiple
    regression, our equation changes to Y'' = B[0] + B[1] X[1] + B[2] X[2] + … + B[z]
    X[z] (where z is the number of independent variables.) Y'' is your dependent variable,
    and the Xsare your independent variables. The Bs are listed in a column. Thus,
    our prediction equation for the example above is WEIGHT'' = 47.138–39.133(SEX)
    + 2.101(HEIGHT) (where SEX is coded as 1 = Male, 2 = Female, and HEIGHT is in
    inches). In other words, the average difference in weight for participants who
    differ by one inch in height is 2.101 pounds. Males tend to weigh 39.133 pounds
    more than females. (Males have a value of SEX that is one less than females. Therefore,
    their predicted weight will be (–1)(–39.133) = 39.133 different.) A female who
    is 60 inches tall should weigh 47.138–39.133(2) + 2.101(60) = 94.932 pounds. Given
    our earlier discussion of the standard error of estimate, 95% of females who are
    60 inches tall will weigh between 90.341 (94.932–4.591 = 90.341) and 99.523 (94.932
    + 4.591 = 99.523) pounds.


    ![](Images/fig00116.jpg)


    ### Drawing Conclusions


    Conclusions from regression analyses indicate (a) whether or not a significant
    prediction equation was obtained, (b) the direction of the relationship, and (c)
    the equation itself. Multiple regression is generally much more powerful than
    simple linear regression. Compare our two examples.


    ![](Images/fig00117.jpg)![](Images/fig00118.jpg)![](Images/fig00119.jpg)


    With multiple regression, you must also consider the significance level of each
    independent variable. In the example above, the significance level of both independent
    variables is less than .001.


    ### Phrasing Results That Are Significant


    In our example, we obtained an R Square of .993 and a regression equation of WEIGHT''
    = 47.138–39.133(SEX) + 2.101(HEIGHT). The ANOVA resulted in F = 981.202 with 2
    and 13 degrees of freedom. F is significant at the less than .001 level. Thus,
    we could state the following in a results section:


    A multiple linear regression was calculated to predict participants’ weight based
    on their height and sex. A significant regression equation was found ( F (2,13)
    = 981.202, p < .001), with an R2 of .993\. Participants’ predicted weight is equal
    to 47.138–39.133(SEX) + 2.101(HEIGHT), where SEX is coded as 1 = Male, 2 = Female,
    and HEIGHT is measured in inches. Participants increased 2.101 pounds for each
    inch of height, and males weighed 39.133 pounds more than females. Both SEX and
    HEIGHT were significant predictors.


    ![](Images/fig00120.jpg)![](Images/fig00121.jpg)![](Images/fig00122.jpg)![](Images/fig00123.jpg)


    The conclusion states the direction (increase), strength (.993), value (981.20),
    degrees of freedom (2,13), and significance level (< .001) of the regression.
    In addition, a statement of the equation itself is included. Because there are
    multiple independent variables, we have noted whether or not each is significant.


    ### Phrasing Results That Are Not Significant


    If the ANOVA does not find a significant relationship, the Sig. section of the
    output will be greater than .05, and the regression equation will not be significant.
    A results section for the output shown above might include the following statement:


    A multiple linear regression was calculated predicting participants’ ACT scores
    based on their height and sex. The regression equation was not significant (F
    (2,17) = .251, p > .05) with an R² of .029. Neither HEIGHT nor WEIGHT is a significant
    predictor of ACT scores.


    Note that for results that are not significant, the ANOVA results and R² results
    are given, but the regression equation is not.


    ### Practice Exercise


    Use Practice Dataset 2 in [Appendix B](#Apendix2.xhtml_ht0356). Determine the
    regression equation for predicting salary based on education, years of service,
    and sex. Which variables are significant predictors? If you believe that men were
    paid more than women, what would you conclude after conducting this analysis?


