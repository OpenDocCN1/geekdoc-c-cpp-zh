    We need to transfer INSTRUCT into the Between-Subjects Factor(s) block.


    Click Options and select means for all of the main effects and the interaction.
    Click OK to run the command.


    ### Reading the Output


    As with the standard Repeated Measures command, the GLM procedure provides a significant
