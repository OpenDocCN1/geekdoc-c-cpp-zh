  trans: '


    查看我们在第 1 章中创建的 `SAMPLE.sav` 数据文件。我们为变量 `GRADE` 计算了平均值。`GRADE` 是按比例尺度测量的，平均值是一个可以接受的汇总统计量（假设分布为正态）。


    我们本可以让 SPSS 计算变量 `TIME` 的平均值而不是 `GRADE`。如果我们这样做，将得到如下所示的输出。


    输出显示平均 `TIME` 为 1.25。请记住 `TIME` 被编码为定序变量（1 = 上午课程，2 = 下午课程）。虽然平均值对于定序尺度来说不是合适的统计量，但
    SPSS 仍然计算了它。考虑数据类型的重要性怎么强调都不为过。仅仅因为 SPSS 会为你计算统计量，并不意味着你就应该使用它。在文的后面，讨论特定的统计程序时，将介绍它们适用的条件。请注意，对于某些程序（例如图表和非参数检验），SPSS
    会根据测量标度限制你的操作。然而，大多数情况下，这取决于用户如何做决定。


    ![](img/fig00028.jpg)


    ### 缺失数据


    通常，参与者不会提供完整的数据。例如，对于某些学生，你可能有他们的前测分数但没有后测分数。也许某个学生在调查问中留空了一个问题，或者她没有说明年龄。缺失数据会削弱任何分析。通常，一个缺失答案就可以将受试者从所有分析中排除。


    ![](img/fig00297.jpg)


    如果你在数据集中有缺失数据，请将该单元格留空。在示例中，第四个受试者没有完成问题 2 (`q2`)。注意，由于问题 2 的数据缺失，总分（根据两个问题计算得出）也是空的。SPSS
    在数据窗口中用点号表示缺失数据（尽管你不应该输入点号——只需留空即可）。创建一个填充值（例如“999”或“0”）来表示空白分并不是一个好做法，因为 SPSS
    会将其视为一个具有意义的值，而它会将真正的空白值视为缺失。


    ## 第 2.2 节 数据的选择与转换


    我们在数据文件中拥有的数据通常比我们想要包含在特定分析中的数据多。例如，我们的样本数据文件包含四位参与者的数据，其中两位接受过特殊培训，另外两位没有。如果我们只想对那两位没有接受过培训的参与者进行分析，我们只需要指定合适的子集。


    ### 选择子集


    ![](img/fig00029.jpg)


    我们可以使用 `Select Cases` 命令来指定数据的子集。`Select Cases` 命令位于 `Data` 菜单下。当你选择此命令时，会出现像下面的对话框。（注意变量名旁边的图标，它们表示除了
    `grade`（定义为比例尺度）外，所有变量都被定义为按名义尺度测量的。）


    ![](img/fig00030.jpg)


    你可以通过使用 `Select Cases` 对话框右侧的选择标准来指定你想选择的哪些案例（参与者）。默认情况下，将选择所有案例（All cases）。选择子集最常见的方法是点击“If
    condition is satisfied, then”，然后点击标记为 `If` 的按钮。这将弹出一个新对话框，允许你指定想要使用的案例。


    ![](img/fig00031.jpg)


    你可以在上部分输入用于选择子集的逻辑。如果逻辑语句对于某个案例为真，则该案例将被选中。如果逻辑语句为假，则该案例不会被选中。例如，你可以通过在窗口左上方输入公式
    `DAY = 1` 来选择所有被编码为 Mon/Wed/Fri 的案例。如果 `DAY` 为 1，则该语句为真，SPSS 将选择该案例。如果 `DAY` 不是
    1，则该语句为假，该案例不会被选中。一旦你输入了逻辑语句，点击 `Continue` 返回 `Select Cases` 对话框。然后，点击 `OK` 返回数据窗口。


    ![](img/fig00032.jpg)


    选择案例后，数据窗口会发生细微变化。未被选中的案例将在案例编号上标记有一条斜线。例如，对于我们的样本数据，第一个和第三个案例未被选中。该子集仅选择了第二个和第四个案例。


    ![](img/fig00033.jpg)


    数据文件中还会创建一个额外的变量。新变量名为 `FILTER_$`，它用于表示一个案例是否被选中。


    如果我们使用刚刚选择的子集计算 `GRADE` 的平均值，我们在这里获得输出。注意，现在我们得到的平均值为 78.00，样本量 (`N`) 为 2 而不是
    4。


    ![](img/fig00034.jpg)


    选择子集时要小心。子集将一直有效，直到你再次运行命令并选择所有案例。你可以通过数据窗口底部判断是否选择了子集，因为底部会显示过滤器已开启（filter is
    on）。此外，当你查看输出结果时，如果选择了子集，`N` 将小于数据集中的记录总数。选择子集时，某些案例上的斜线也会显而易见。注意不要在选择了子集的情况下保存数据文件，因为这在以后会导致相当困扰。


    #### 计算新变量


    SPSS 还可以用于计算新变量或处理现有的变量。为了说明这一点，我们将创建一个新的数据文件。该文件将包含四位参与者和三个变量（`Q1`、`Q2` 和 `Q3`）。这些变量代表每个参与者在三个问题上得到的得分。现在将此数据文件保存为
    `QUESTIONS.sav`。我们将在后面的章节中再次使用它。


    ![](img/fig00035.jpg)fig00036.jpg


