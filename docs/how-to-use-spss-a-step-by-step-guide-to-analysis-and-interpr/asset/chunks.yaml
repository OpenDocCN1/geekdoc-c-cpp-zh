    参数推断统计程序允许你根据总体的样本对该总体进行推断。为了做出这些推断，你必须对总体样本分布的形状做出某些假设。


    ## 第 6.1 节 基础假设检验回顾


    ### 原假设

    在假设检验中，我们创建两个相互排斥（即两者不能同时为真）且完全包容（即其中必须有一个为真）的假设。我们将这两个假设称为原假设（null hypothesis）和备择假设（alternative
    hypothesis）。原假设通常表示，我们观察到的任何差异都是由随机误差引起的。备择假设通常表示，我们观察到的任何差异都是组间系统性差异引起的。


    ### 第一类错误与第二类错误

    所有的假设检验都试图根据测试结果（在这种情况下为统计学检验）对现实世界得出结论。结果有四种可能的组合。


    可能的结果中有两种是正确的测试结果。另外两种结果是错误。当我们拒绝一个实际上为真的原假设时，就发生了第一类错误；而当我们未能拒绝一个实际上为假的原假设时，就发生了第二类错误。


    显著性检验决定了犯第一类错误的概率（通常称为 `alpha <α`、`Sig.` 或 `p`）。换句话说，在执行一系列计算后，我们得到了在假设原假设为真的情况下，获得与我们观测值等远值的概率。如果概率较低，例如
    100 次中只有 5 次或更少（`.05`），根据惯例，我们拒绝原假设。换句话说，我们通常使用 `.05` 水平（或更低）作为我们愿意接受的最大第一类错误率。


    当第一类错误的概率较低时（例如 `.05`），我们可以说显著性检验导致我们“拒绝了原假设”。这与说差异具有“统计学显著性”是同义的。例如，在一次阅读测试中，假设你发现某学区随机抽样的女孩得分高于随机抽样的男孩。这一结果的可能仅仅是因为与随机抽样相关的机会误差产生了观察到的差异（这就是原假设所断言的）。如果随机误差是其的概率足够低（由显著性检验确定），我们可以说男女之间的差异在统计学上是显著的。


    ![](img/fig00124.jpg)


    ### 显著性水平与临界值

    大多数统计学教科书通过使用临界值概念来介绍假设检验。通过这种方法，我们获得一个检验统计量的值，并将其与从表中查出的临界值进行比较。如果获得的值大于临界值，我们拒绝原假设，并得出我们发现了显著差异（或关系）的结论。如果获得的值小于临界值，我们无法拒绝原假设，得出没有显著差异。


    临界值方法适用于手算。可以创建提供 `.001`、`.01`、`.05` 等 `alpha` 水平临界值的表格。但为每种可能的 `alpha` 水平创建一个表格是不切实际的。


    另一方面，`SPSS` 可以确定与任何检验统计量值关联的精确 `alpha` 水平。因此，没有必要在表中查找临界值。然而，这确实改变了确定是否拒绝原假设的基本步骤。


    `SPSS` 输出中标记为 `Sig.`（有时为 `p` 或 `alpha <α`）的区域表示，如果我们拒绝原假设，犯第一类错误的概率。`.05` 或更小的值表示我们应该拒绝原假设（假设
    `alpha` 水平为 `.05`）。大于 `.05` 的值表示我们应该无法拒绝原假设。


    换句话说，在使用 `SPSS` 时，如果 `Sig.` 下的输出值等于或小于 `.05`，我们通常拒绝原假设；如果输出值大于 `.05`，我们无法拒绝原假设。


    ### 单侧检验与双侧检验

    `SPSS` 输出通常包含一个双侧 `alpha` 水平（在输出中通常标记为 `Sig.`）。双侧假设试图确定是否存在任何差异（无论是正还是负的）。因此，你有机会在正态分布的两个尾部中的任何一侧犯第一类错误。


    单侧检验检查特定方向的差异。因此，我们只能在分布的某一侧（尾部）犯第一类错误。如果我们有一个单侧假设，但我们的 `SPSS` 输出给了双侧显著性结果，我们可以将输出中的显著性水平除以二。因此，如果我们的差异在正确的方向上，且我们的输出显示显著性水平为
    `.084`（双侧），但我们是单侧假设，我们可以报告显著性水平为 `.042`（单侧）。


    ### 结果的表述

    假设检验的结果可以用不同的方式表述，取决于你所在机构规定的惯例。以下示例说明了其中一些差异。


    #### 自由度

    有时自由度紧跟在代表检验的符号后的括号中，如下例所示：


    `t(3) = 7.00, p < .01`


    其他时候，自由度位于结果陈述中，如下例所示：


    `t = 7.00, df = 3, p < .01`


    #### 显著性水平

    当你获得显著结果时，可以用不同的方式进行描述。例如，如果你在测试中获得了 `.006` 的显著性水平，可以用以下三种方式描述：


    `t(3) = 7.00, p < .05`


    `t(3) = 7.00, p < .01`


    `t(3) = 7.00, p = .006`


    注意，由于精确概率是 `.006`，`.05` 和 `.01` 也是正确的。描述不显著的结果也有方法。例如，如果你获得了 `.505` 的显著性水平，可以使用任何一种陈述：


    `t(2) = 0.805, ns`


    `t(2) = 0.805, p > .05`


    `t(2) = 0.805, p = .505`


    #### 结果陈述

    有时结果会根据原假设陈述，如下所示：


    原假设被拒绝（`t = 7.00, df = 3, p = .006`）。


    其他时候，结果根据其显著性水平陈述，如下所示：


    发现了统计显著差异（`t(3) = 7.00, p < .01`）。


    #### 统计符号

    通常，统计符号使用斜体。在计算机和桌面出版普及之前，统计符号是下划线的。下划线是打印机的信号，表示下划线文本应设置为斜体。不同机构对作业的要求不同，因此建议咨询你的导师。


    ## 第 6.2 节 单样本 t 检验


    ### 描述

    单样本 t 检验比较样本均值与知的总体均值。它用于判断一组数据是否发生了变化（例如，将今年的温度与历史平均值比较，以判断全球变暖是否正在发生）。


    ### 假设

    得分的分布应该是正态的。然而，`t` 检验具有稳健性，可以处理对正态假设的违反。因变量必须在间隔尺度或比例尺度上测量。


    ### SPSS 数据格式

    单样本 t 检验的 `SPSS` 数据文件在 `SPSS` 中需要单个变量。该变量代表与总体均值比较的样本得分。


    ### 执行命令

