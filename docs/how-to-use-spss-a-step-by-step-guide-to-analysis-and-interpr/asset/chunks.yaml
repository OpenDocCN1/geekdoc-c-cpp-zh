    \n![](img/fig00188.jpg)![](img/fig00189.jpg)\n\n### 不显著结果的表述\n\n实际的示例（基于 `SAT.sav`\
    \ 数据文件）是不显著的。因此，我们可以在结果部分陈述如下：\n\n通过单因素多元方差分析，考察了训练（无、短期或长期）对 SAT 和 GRE 分数的影响。未发现显著效应（Lambda\
    \ (4,28) = .828, p > .05）。SAT 和 GRE 分数均未受训练显著影响。\n\n# 第 8 章：非参数推断统计\n\n当相应的参数程序不适用时，就会使用非参数检验。通常，这是因为因变量不是间隔尺度或比例尺度。也可能是因为因变量不符合正态分布。如果感兴趣的数据是频率计数，非参数统计也可能是合适的。\n\
    \nSPSS 有一个强大的 `Nonparametric Tests`（非参数检验）命令，包含了增强报告，帮助用户选择合适的检验并正确解释结果。\n\n##\
    \ 第 8.1 节 卡方拟合检验\n\n### 描述\n\n卡方拟合检验用于确定样本比例是否与理论值匹配。例如，它可以用于判断骰子是否经过手脚或是否公平。它还可以用于比较出生缺陷儿童的比例与总体值（例如，以确定某个社区的出生缺陷率在统计上是否高于正常水平）。\n\
    \n### 假设\n\n我们需要做的假设非常少。对分布的形状没有假设。每个类别的期望频率至少为 1，且期望频率小于 5 的类别比例不应超过 20%。\n\n\
    ### SPSS 数据格式\n\nSPSS 只需要一个变量。它可以在任何尺度上进行测量，尽管 SPSS 要求将其定义为名义（Nominal）。\n\n###\
    \ 运行命令\n\n我们将创建以下数据集并命名为 `COINS.sav`。以下数据代表两枚硬币各投掷 20 次的结果（H 编码为正面，T 为反面）。\n\n\
    Coin 1：H T H H T H H T H H H T T T H T H T T H\nCoin 2：T T H H T H T H T T H H\
    \ T H H T H T H H \n\n将两个变量命名为 `COIN1` 和 `COIN2`，并将 H 编码为 1，T 编码为 2。你创建的数据文件将有\
    \ 20 行数据和两列，分别称为 `COIN1` 和 `COIN2`。将变量类型定义为：Nominal（名义）。\n\n![](img/fig00190.jpg)\n\
    \n要运行 `Chi-Square`（卡方）命令，点击`Analyze（分析），然后选择`Nonparametric Tests（非参数检验），最后选择`One\
    \ Sample（单样本）。这将弹出 `One-Sample Nonparametric Tests`（单样本非参数检验）命令的对话框。你会注意到这个新程序的对话框与其他\
    \ SPSS 命令的界面完全不同。它是从版本 18 开始使用 SPSS 的新建模程序完全重写的。\n\n![](img/fig00191.jpg)\n\n\
    我们卡方拟合检验的目标是确定数据分布是否等于假设分布。因此，只需保持`Objective（目标）选项卡不变，点击窗口顶部的`Fields（字段）选项卡。\n\
    \n![](img/fig00192.jpg)\n\n你需要点击`Use custom field assignments（使用自定义字段赋值），然后将变量\
    \ `COIN1` 移动到右侧的 Test Fields（检验字段）区域。\n\n![](img/fig00193.jpg)\n\n这个新程序实际上非常智能，它会检查你的数据并为你选择最合适的检验。然而，为了演示卡方独立检验，我们将强制它只运行该检验：选择顶部的`Settings（设置）`选项卡，点击`Choose\
    \ Tests（选择检验）`下的`Customize tests（自定义检验）`，然后勾选`Compare observed probabilities to\
    \ hypothesized (Chi-Square test)(观察概率与假设概率比较（卡方检验))`选项。\n\n![](img/fig00194.jpg)\n\
    \n公平的硬币出现正面或反面的概率相等。因此，我们不需要做更多操作。如果不同的值有不同的期望概率，我们会点击`Options（选项）`，在那里有机会`Customize\
    \ expected probability（自定义期望概率）`。点击`Cancel（取消）`关闭`Chi-Square Test Options（卡方检验选项）`窗口，然后点击`Run（运行）`。\n\
    \n### 读取输出\n\n![](img/fig00195.jpg)\n\n与其他程序相比，这个新程序完全改变了输出的呈现方式。新输出用标准的英语说明假设，告知运行了什么检验，给出显著水平，并告诉你是否拒绝假设。示例所示，我们被`Retain\
    \ the null hypothesis（保留假设）`。新功能之一是模型查看器（Model Viewer）。双击输出即可打开模型查看器。\n\n![](img/fig00196.jpg)\n\
    \n模型查看器通过自动呈现图表和其他解读结果所需的信息扩展了标准答案。在这里你可以找到卡方本身的标准值、自由度等。注意，反面的观测频率为 9，因此没有显示在图中，因为\
    \ Y 轴从 9 开始。\n\n![](img/fig00197.jpg)\n\n注意：为了打印完整输出，你需要在模型查看器中选择`File（文件）`，然后是`Properties（属性）`，最后选择`Print\
    \ all（全部打印）`。\n\n### 卡方检验表明数据异于期望值。不显著的检验表明数据与期望值一致。\n\n### 显著结果的表述\n\n在描述结果时，你应该说明卡方值（符号为\
    \ χ²）、自由度、显著水平以及结果的描述。例如，对于显著的卡方（对于与我们的示例不同的样本，例如如果我们使用了加过的骰子），我们可以陈述如下（注意此示例使用的是假设值）：\n\
    \n通过卡方拟合检验，比较了骰子每个数值出现的频率。假设每个数值出现的次数相等。发现与假设值显著偏离（χ²(5) = 25.48, p < .05）。该骰子似乎是加过的。\n\
    \n### 不显著结果的表述\n\n如果分析没有产生显著差异，如上一个示例所示，我们可以陈述如下（注意你需要双击输出并打开模型查看器获取这些数字）：\n\n\
    通过卡方拟合检验，比较了硬币正面和反面的频率。假设每个数值出现的次数相等。未发现与假设值的显著偏离（χ²(1) = .20, p > .05）。该硬币看起来是公平的。\n\
    \n"
