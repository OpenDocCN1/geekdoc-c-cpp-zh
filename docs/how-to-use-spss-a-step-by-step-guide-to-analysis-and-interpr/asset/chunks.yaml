    本示例使用了在第 4 章中创建的 `HEIGHT.sav` 数据文件。单样本 t 检验（也称为单样本）位于`Analyze`分析）菜单下的`Compare
    Means”（比较均值）子菜单。


    ![](img/fig00126.jpg)


    单样本 t 检验的对话框要求我们将代表当前分数集的变量转移到 `Test Variable(s)`（检验变量）部分。我们必须在 `Test Value`（检验值）空格中输入总体平均值。此处展示的示例是对变量
    `HEIGHT` 与 `67` 的总体均值进行测试。换句话说，我们正在测试样本是否来自均值为 `67` 的总体。点击 `OK` 运行分析。


    ### 读取输出

    单样本 t 检验的输出包含两个部分。第一部分列出了样本变量和一些基础描述统计（N、平均值、标准差和标准误）。


    ![](img/fig00127.jpg)![](img/fig00128.jpg)


    输出的第二部分包含 t 检验的结果。上面的示例显示 t 值为 `–064`，自由度为 15，显著性水平为 `.95`。均值差 `–0625` 是样本平均值（`66.9375`）与我们在对话框中输入的用于测试总体平均值（`67`）之间的差异。


    ### 得出结论

    进行 t 检验的假设是均值相等。因此，显著的结果表明样本均值不等于总体均值（因此称为“显著差异”）。不显著的结果意味着均值之间没有显著差异。这并不意味着它们相等。请参考统计教科书中关于“未能拒绝零假设”的章节。


    ### 显著结果的表述

    上述示例未发现总体均值与样本均值之间存在显著差异。然而，如果我们使用 `64` 而不是 `67` 作为总体均值，我们将获得以下输出：


    ![](img/fig00129.jpg)![](img/fig00130.jpg)


    在这种情况下，我们可以这样陈述：


    进行了单样本 t 检验，比较样本的平均身高与总体值 `64`。发现显著差异（t(15) = 3.008, p = .009）。样本均值 `66.9375`（sd
    = 3.907）显著大于总体均值。


    ### 不显著结果的表述

    在我们的第一个示例中，显著性水平大于 `.05`。因此，我们将这样陈述：


    进行了单样本 t 检验，比较样本的平均身高与总体值 `67`。未发现显著差异（t (15) = –.064, p = .95）。样本均值 `66.9375`（sd
    = 3.907）并不显著大于总体均值。


    ### 练习题

    美国的平均薪资是一个假设的平均值 `$25,000`。确定附录 B 中练习数据集 2 参与者的平均薪资是否显著大于此值。注意，这是一个单侧假设。


    ## 章节 6.3 独立样本 t 检验


    ### 描述

    独立样本 t 检验比较两个独立样本的均值。如果两个样本之间没有关系（通常意味着每个参与者仅为其中一个样本提供数据），则样本是独立的。


    ### 假设

    所比较的两个组应该是相互独立的。当关于一个观测值的信息与另一个无关时，观测值是独立的。通常，这意味着一组参与者为一个样本提供数据，另一组参与者为另一个样本提供数据（且一组中的个人与另一组中的个人不进行匹配）。实现这一点的一种方法是使用随机分配来形成两个组。


    分数应该符合正态分布，但 t 检验具有稳健性，可以处理违反正态分布假设的情况。然而，两个样本应该具有相同的方差。


    因变量必须在间隔尺度或比例尺度上进行测量。自变量应只有两个离散的水平。


    ### SPSS 数据格式

    独立 t 检验的 SPSS 数据文件需要两个变量。其中一个变量是分组变量，代表自变量的值。分组变量应该有两个不同的值（例如，0 代表控制组，1 代表实验组）。第二个变量代表因变量，例如测试中的分数。


    ### 执行独立样本 t 检验

    对于我们的示例，我们将使用 `SAMPLE.sav` 数据文件。点击 `Analyze`，然后点击 `Compare Means`，最后点击 `Independent-Samples
    T Test`。这将弹出主对话框。将因变量转移到 `Test Variable(s)` 空格。对于我们的示例，我们将使用变量 `GRADE`。


    ![](img/fig00131.jpg)![](img/fig00132.jpg)


    将自变量转移到 `Grouping Variable` 部分。对于我们的示例，我们将使用变量 `MORNING`。


    ![](img/fig00133.jpg)


    接下来，点击 `Define Groups`（定义组）并输入自变量两个水平的值（0 代表非早上，1 代表早上）。独立 t 检验每次只能比较两个水平。点击 `Continue`，然后点击
    `OK` 运行分析。


    ### 独立样本 t 检验输出

    输出将包含一个名为“Group Statistics”（组统计）的部分。该部分提供了每个自变量值下因变量的描述统计。它应该如下所示。


    ![](img/fig00134.jpg)


    接下来，将有一个 t 检验结果部分。它应该如下所示。


    ![](img/fig00135.jpg)


    标记为 `t`、`df` 和 `Sig. (2-tailed)` 的列提供了 t 检验的标准答案。它们提供了 `t` 值、自由度（参与者人数减 2）以及显著性水平（通常称为
    p）。通常我们使用“Equal variances assumed”（方差齐）行。这将为你提供与手动计算等等的答案。


    ### 得出结论

    回顾上一节，t 检验假设均值相等。因此，显著的结果表明均值不相等。在对 t 检验得出结论时，你必须说明差异的方向（即哪个均值较大）。你应该应该关于 `t`
    值、自由度、显著性水平以及两组均值和标准差的信息。


    ### 显著结果的表述

    对于显著的 t 检验（例如下面的输出），你可以这样陈述：


    ![](img/fig00136.jpg)![](img/fig00137.jpg)


    比较实验组和控制组平均分的独立样本 t 检验发现两组均值之间存在显著差异（t(5) = 2.835, p < .05）。实验组均值（M = 33.333,
    sd = 2.08）显著低于控制组均值（M = 41.000, sd = 4.24）。


    ### 不显著结果的表述

    在我们节开始的示例中，我们比较了晨型人的分数和非晨型人的分数。我们没有发现显著差异，因此可以这样陈述：


    计算了独立样本 t 检验，比较了自认为是晨型人的参与者的平均分与未自认为是晨型人的参与者的平均分。未发现显著差异（t(2) = 0.805, p > .05）。晨型人的均值（M
    = 78.00, sd = 7.07）与非晨型人的均值（M = 82.50, sd = 3.54）之间没有显著差异。


