    #### Degrees of Freedom


    Sometimes the degrees of freedom are given in parentheses immediately after the
    symbol representing the test, as in this example:


    t(3) = 7.00, p < .01


    Other times, the degrees of freedom are given within the statement of results,
    as in this example:


    t = 7.00, df = 3, p < .01


    #### Significance Level


    When you obtain results that are significant, they can be described in different
    ways. For instance, if you obtained a significance level of .006 on a t test,
    you could describe it in any of the following three ways:


    t(3) = 7.00, p < .05


    t(3) = 7.00, p < .01


    t(3) = 7.00, p = .006


    Notice that because the exact probability is .006, both .05 and .01 are also correct.
    There are also various ways of describing results that are not significant. For
    instance, if you obtained a significance level of .505, any of the following three
    statements could be used:


    t(2) = 0.805, ns


    t(2) = 0.805, p > .05


    t(2) = 0.805, p = .505


    #### Statement of Results


    Sometimes the results will be stated in terms of the null hypothesis, as in the
    following example:


    The null hypothesis was rejected (t = 7.00, df = 3, p = .006).


    Other times, the results are stated in terms of their level of significance, as
    in the following example:


    A statistically significant difference was found: t(3) = 7.00, p < .01.


    #### Statistical Symbols


    Generally, statistical symbols are presented in italics. Prior to the widespread
    use of computers and desktop publishing, statistical symbols were underlined.
    Underlining is a signal to a printer that the underlined text should be set in
    italics. Institutions vary on their requirements for student work, so you are
    advised to consult your instructor about this.


    ## Section 6.2 Single-Sample t Test


    ### Description


    The single-sample t test compares the mean of a single sample to a known population
    mean. It is useful for determining if the current set of data has changed from
    a long-term value (e.g., comparing the current year’s temperatures to a historical
    average to determine if global warming is occurring).


    ### Assumptions


    The distributions from which the scores are taken should be normally distributed.
    However, the t test is robust and can handle violations of the assumption of a
    normal distribution. The dependent variable must be measured on an interval or
    ratio scale.


    ### SPSS Data Format


    The SPSS data file for the single-sample t test requires a single variable in
    SPSS. That variable represents the set of scores in the sample that we will compare
    to the population mean.


