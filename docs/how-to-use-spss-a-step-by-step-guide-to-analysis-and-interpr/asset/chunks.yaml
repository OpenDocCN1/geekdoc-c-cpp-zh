    # Appendix D: SPSS Syntax Basics (#contents.xhtml_bck_ht0368)


    ## Introduction to Syntax


    IBM SPSS Statistics has been easy to use with its point and click interface for
    several decades. Before that, however, SPSS required users to write programs to
    conduct their analyses. In fact, all the point and click interface does is create
    syntax for you that is run.


    Using syntax can be very useful if you want to save an analysis and run it later.
    Understanding it is an important part of being able to understand your output
    as well.


    This text will not cover how to create SPSS syntax from scratch. Rather, it will
    simply cover how to get SPSS to create it for you, and how to read the syntax
    it creates.


    ## Having SPSS Create Syntax


    ![](Images/fig00291.jpg)


    Most SPSS Dialog Boxes will have a `Paste` option in them. Clicking `Paste` instead
    of `OK` will put the relevant SPSS Syntax in a `Syntax Window`.


    ![](Images/fig00292.jpg)


    The syntax window is highlighted to help you understand what the commands are
    asking SPSS to do. In the example above, the command that was run was the `Frequencies`
    command. It was run on the variable `TIME`.


    Many SPSS commands have options that are added to them but are not necessarily
    important at the level of this text. For example, the `/ORDER=ANALYSIS` option
    above.


    ## SPSS Syntax Format and SPSS Help


    SPSS syntax is written like sentences. In fact, each one ends with a period (`.`).
    The number of lines it is on does not matter – so it is often best to use several
    lines to make it easier to read.


    Rather than provide extensive coverage in this text, I suggest that if you are
    interested in SPSS Syntax that you use the excellent help system provided within
    SPSS itself.


    ![](Images/fig00293.jpg)


    To access that help system, click `Help` then select `Topics`. This will bring
    up a long list of SPSS Help Topics. Find the section labelled `Reference` and
    then `Command Syntax Reference` for help with syntax.


    ![](Images/fig00294.jpg)


    ## Running SPSS Syntax


    Whether SPSS creates syntax for you, whether you create it yourself, or whether
    you modify syntax that SPSS has created, at some point you are going to want to
    use that syntax.


    ![](Images/fig00295.jpg)


    From a `Syntax Window` simply select `Run` and then `All`. Alternatively, you
    can select just some of the text in the window with your mouse and click `Selection`
    instead of `All`.


    ## Saving and Loading SPSS Syntax


    Syntax files have the extension `.sps` and can be saved. To load a file select
    `File` – `Open`.


    # Appendix E: Glossary (#contents.xhtml_ht374)


    **All Inclusive**: A set of events that encompasses every possible outcome.


    **Alternative Hypothesis**: The opposite of the null hypothesis, normally showing
    that is a true difference.


    **Case Processing Summary**: A section of output that lists the number of subjects.


    **Coefficient of Determination**: The value of the correlation, squared. It provides
    the proportion of variance accounted for.


    **Cohen’s d**: A common and simple measure of effect size that standardizes the
    difference between groups.


    **Correlation Matrix**: A section of output in which correlation coefficients
    are reported for all pairs of variables.


    **Covariate**: A variable known to be related to the dependent variable but not
    treated as an independent variable. Used in `ANCOVA` as a statistical technique.


    **Data Window**: The SPSS window that contains the data in a spreadsheet format.
    This is the window used for most commands.


    **Dependent Variable**: An outcome or response variable. The dependent variable
    is normally dependent on the independent variable.


    **Descriptive Statistics**: Statistical procedures that organize and summarize
    data.


    **Dialog Box**: A window that allows you to enter information that SPSS will use.


    **Dichotomous Variables**: Variables with only two levels (e.g., gender).


    **Discrete Variable**: A variable that can have only certain values (i.e., values
    between which there is no score, like A, B, C D).


    **Effect Size**: A measure that allows one to judge the relative importance of
    a difference or relationship by reporting the size of a difference.


    **Eta Squared (η2)**: A measure of effect size used in Analysis of Variance models.


    **Grouping Variable**: In SPSS, the variable used to represent group. SPSS often
    refers to independent variables as grouping variables; SPSS sometimes refers to
    grouping variables as independent variables.


    **Independent Events**: Two events are independent if information about one event
    gives no information about the second event (e.g., two flips of a coin).


    **Independent Variable**: The variable whose levels (values) determine the group
    to which a subject belongs. A true independent variable is manipulated by the
    researcher. See Grouping Variable.


    **Inferential Statistics**: Statistical procedures designed to allow the researcher
    to draw inferences about a population on the basis of a sample.


    **Interaction**: With more than one independent variable, an interaction occurs
    when a level of one independent variable affects the influence of another independent
    variable.


    **Internal Consistency**: A reliability measure that assesses the extent to which
    all of the items in an instrument measure the same construct.


    **Interval Scale**: A measurement scale where items are placed in mutually exclusive
    categories, with equal intervals between values. Appropriate transformations include
    counting, sorting, and addition/subtraction.


    **Levels**: The values that a variable can have. A variable with three levels
    has three possible values.


    **Mean**: A measure of central tendency where the sum of the deviation scores
    equals zero.


    **Median**: A measure of central tendency representing the middle of a distribution
    when the data are sorted from low to high. Fifty percent of the cases are below
    the median.


    **Mode**: A measure of central tendency representing the value (or values) with
    the most subjects (the score with the greatest frequency).

