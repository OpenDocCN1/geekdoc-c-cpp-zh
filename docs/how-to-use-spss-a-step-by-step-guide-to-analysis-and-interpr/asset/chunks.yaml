    # [Appendix F


    Selecting the Appropriate Inferential Test](#contents.xhtml_bck_ht0375)


    Being able to select the appropriate inferential test for SPSS to run is one of
    the most important skills you can learn. Unfortunately, the way most statistics
    classes and statistics texts are set up, each statistical procedure is presented
    in isolation, and there is rarely an opportunity to synthesize the information
    and understand when each test is appropriate.


    This text contains a decision tree on the inside cover. However, novices sometimes
    have trouble using that tree because they do not understand the terms used. This
    appendix expands on the decision tree and provides a comprehensive way to determine
    which test to run.


    To help you use this section of the text, there will be a reference to a “branch”
    of the decision tree.


    ## Branch 1


    The first step in determining what type of statistical test to run is deciding
    what your main question is.


    Sometimes you want to know if a group is “significantly different” from another.
    This can involve means or shapes of distributions. The basic question, however,
    is the same. You want to know if the things you are comparing are the same as
    each other or different from each other. For example, you want to know if a group
    that received a new treatment had a significantly shorter hospital stay than a
    group that did not receive the new treatment. If this is what you are trying to
    do, go to Branch 2.


    Other times you are more interested in knowing whether or not there is a relationship
    between two variables, and if so, how strong that relationship is. These are known
    as correlations. Here, rather than looking for differences, you are simply looking
    for stable relationships. For example, is height related to weight? Do students
    who miss class more often do worse academically? Often, the variables here are
    continuous and have many levels rather than just a few. If this is what you are
    interested in, go to Branch 3.


    More powerful than association is prediction. If you would like to be able to
    predict or guess the value of a variable from some other information that you
    have, then you are interested in regression. For example, if an insurance company
    wants to predict how much you will cost them in claims based on your driving history,
    that is a problem for regression. If these are the types of questions you are
    interested in, go to Branch 6.


    ## Branch 2


    Your Decisions So Far:


    *   Looking for Differences in Groups


    The next step is to determine how many Dependent Variables you have. Dependent
    Variables are the variables that are different from each other. Most of the time
    you will have only a single Dependent Variable (although you could have one or
    more Independent Variables).


    If you get Independent and Dependent Variables confused, a good way to help clarify
    is to rephrase the problem as “I am looking for the effect of the (Independent
    Variable) on the (Dependent Variable).”


    *   If you have one Dependent Variable, see Branch 9.


    *   If you have more than one Dependent Variable, see Branch 10.


    ## Branch 3


    Your Decisions So Far:


    *   Measuring Strength of Association


    In general, correlations measure the strength of a relationship or association.


    This text covers what are known as bivariate correlations—that is, correlations
    between only two variables at a time. In addition, this text covers only linear
    correlations—or correlations that assume the relationship being measured generally
    looks like a line.


    In deciding which correlation is appropriate, first you must determine if you
    can do a parametric or nonparametric correlation. Parametric Tests generally require
    that the Dependent Variables are measured on an Interval or Ratio measurement
    scale and that the variables are approximately normally distributed. Nonparametric
    Tests do not make that assumption.'
