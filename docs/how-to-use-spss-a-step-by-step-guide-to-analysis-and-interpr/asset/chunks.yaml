    # 第 10 版序言#contents.xhtml_bck_ht0004


    ## 简介


    `IBM® SPSS Statistics` 软件（`SPSS®`）是由 `IBM Inc.`生产的统计软件包。在 2009 年之前，`SPSS` 是一家独立公司，以
    `SPSS` 和 `PASW` 的名称生产统计软件。`IBM SPSS Statistics` 设计用于执行广泛的统计程序。与任何其他强大的计算机程序一样，为了高效使用该软件并获得正确的答案，必须掌握某些规范和技术。通过提供带有示例的详细分步指导，本书将帮助你达到这种精通程度。


    本书不仅介绍了如何输入数据和获取结果外，还解释了如何选择合适的统计方法，并以适用于社会或行为科学研究报告的形式呈现结果。例如，关于独立 `t test` 的章节展示了如何陈述（即表述）显著和不显著检验的结果。


    ## 读者群体


    本书是传统入门级和中统计学教材的理想补充。它也可以作为研究方法课程中的统计复习手册。最后，学生在大学毕业后可以在各种工作环境中将其案头参考指南。


    `SPSS Statistics` 是一个极其强大的程序，本文并非旨在详尽的用户手册。相反，重点是入门级和中级统计及研究方法课程中涵盖的程序。


    ## 结构


    本书分为九章加几个实用的附录。前两章涉及使用 `SPSS` 程序的基本机制。剩下的每一章都关注某一类统计方法。


    每章包含几个短小节。大多数情况下，这些小节是独立的。然而，学生在尝试学习书中其他部分之前，应该先掌握第 1 章和第 2 章中的 `SPSS` 基础知识。除前两章的技能外，本书可以以非线性方式使用。因此，教师可以在课程早期安排前两章，然后根据需要安排其他章节。


    `附录 A` (`Apendix1.xhtml`)包含了对效应量的讨论。`附录 B` (`Apendix2.xhtml`)包含了贯穿全书练习所需的数据集。`附录
    C` (`Apendix3.xhtml`)提供了书中使用的样本数据文件。`附录 D` (`Apendix4.xhtml`)提供了关于选择合适统计检验的信息。`附录
    E` (`Apendix5.xhtml`)提供了书中使用的大多数统计术语的定义。由于假设本书配合主统计教材使用，`术语表`的定义非常简练，仅起到提醒作用。`附录
    F` (`Apendix6.xhtml`)提供了内封决策树的文本版本。


    ## SPSS 版本


    本书为 `IBM SPSS Statistics for Windows Version 24.0` 编写，尽管它同样适用于之前的所有 `SPSS`（和 `PASW`）版本以及新的
    `IBM SPSS Statistics Cloud`。在 `SPSS/PASW` 的 18 版本或更高版本之间，书中内容没有实质性差异（仅在标志等上有细微差异）。因此，本书适用于自
    18 版本以来的所有版本。


    '
- fmt: '

    SPSS also offers several modules. The screenshots in this text were taken using
    a “full” version of the software (all modules active and installed). Most institutions
    have at least the `Base`, `Regression`, and `Advanced` modules installed. With
    these three modules, or if you are using the `SPSS Statistics GradPack` or `Premium
    Gradpacks`, you can conduct all of the analyses in this text. If you are using
    the `SPSS Statistics Base GradPack`, some procedures will not be available. When
    this is the case, the text will clearly indicate that another product is necessary.


    If you have different add-on modules installed, the menu bars shown in the illustrations
    of this text may be slightly different. If your menu bars look different, or if
    you cannot locate a menu item for a command presented in this book, it may be
    that your institution supports different modules. Ask your instructor for additional
    guidance.


    ## Availability of SPSS


    Some institutions purchase site licenses from IBM to provide the software at no
    charge to their faculty and, sometimes, to their students. If your institution
    has not purchased a site license, you should still be able to purchase the student
    version of the software in your campus bookstore at a price discounted for the
    educational community. Either of these will be a fully functional version of the
    software intended for your personal use. However, the student version is limited
    to `50 variables` and `1,500 cases`. If you need software with more functionality,
    you can purchase the `SPSS Statistics GradPack` from a variety of sources. A quick
    Internet search for “SPSS graduate pack” will bring up some choices. Please note
    that you can generally lease SPSS for a period of a single semester if you would
    like. You can also purchase a month-to-month license of the `IBM SPSS Statistics
    Cloud` product.


    ## Conventions


    The following conventions have been used throughout this book:


    *   Items in bold are defined in the Glossary in [Appendix E](#Apendix5.xhtml_ht0374).

    *   Items in italics are either buttons or menus from the SPSS program, or they
    are a statistical symbols.

    *   Items in ALL CAPITAL LETTERS are either acronyms or the names of variables
    in the SPSS data file.


    ## Screenshots


    Screenshots have been used extensively throughout the text as a visual representation
    of what is described. In some instances, there may be minor differences between
    screenshots shown in the text and those on the student’s own screen. For instance,
    a screenshot captured while working with a dataset that has been previously saved
    to the hard drive will show the filename and dataset number, whereas a dataset
    that has not yet been saved will simply show “Untitled” and “[Data-Set0].” Because
    no two Windows computers are configured exactly alike, and because different modules
    and software versions can produce slightly modified screenshots, such minor differences
    are unavoidable.


    ## Practice Exercises


    Practice exercises are included for each skill presented. In addition, the skills
    acquired in this text can be used in practice exercises in other statistics texts
    or workbooks. In this respect, an excellent complement to this text is `Real Data:
    A Statistics Workbook Based on Empirical Data.`^([1](#Preface.xhtml_fn0001))


    ## New to This Edition


    Prior editions of this text were published by Pyrczak Publishing. In 2016 Pyrczak
    Publishing was acquired by Routledge/Taylor & Francis, and this 10th edition is
    the first edition that is a pure Routledge product. As a result, the entire look
    and feel of the text has been updated.


    The content on parametric inferential statistics has been split into two chapters
    ([Chapters 6](#Ch06.xhtml_ht0153) and [7](#Ch07.xhtml_ht0194)) to provide a clearer
    distinction between t-test models and ANOVA models and to make the chapters a
    more manageable size.


    A section on using SPSS to calculate inter-rater reliability has been added to
    [Chapter 9](#Ch09.xhtml_ht0311).


    A brand new [Appendix D](#Apendix4.xhtml_ht0368) has been added which covers the
    basics of using SPSS Syntax rather than just the point and click menus.


    ## Acknowledgments


    This book is dedicated to the students in my Introductory Psychological Statistics
    and Research Team courses. While teaching those courses, I became aware of the
    need for an SPSS manual that did more than simply tell students how to start the
    program and enter data. I am deeply indebted to Wendy Schweigert at Bradley University,
    who first showed me the power, simplicity, and usefulness of statistics. I would
    also like to thank the hundreds of instructors who adopted previous editions of
    this text and provided me with constructive feedback. Of course, this text would
    not have been possible without the support of my family—especially my children
    Jonathan and Katherine. A lot has changed since the first edition of this text.
    My son had just been born as I wrote the proposal for the first edition. By the
    time you buy this book he will be a student at a university just like you.


    Brian C. Cronk


    ## Note


    [1.](#Preface.xhtml_bck_fn0001) Holcomb, Z. (1997). Real data: A statistics workbook
    based on empirical data. Los Angeles, CA: Pyrczak Publishing.


    # Chapter 1: Getting Started](#contents.xhtml_bck_ht0016)


    ## Section 1.1 Starting SPSS


    Startup procedures for SPSS will differ slightly, depending on the configuration
    of the machine on which it is installed. If you have difficulty finding it look
    for a IBM SPSS Statistics section of your Start Menu. This text uses screenshots
    from the Windows version of SPSS. The MacOS and Unix versions will have the same
    functionality, but could appear differently than what is depicted herein.


    ![](Images/fig00005.jpg)


    When SPSS is started, you may be presented with the dialog box above, depending
    on the options your system administrator selected for your version of the program.
    If you have the dialog box, click in data and OK, which will present a blank data
    window.^([1](#Ch01.xhtml_fn0002)) If you were not presented with the dialog box,
    SPSS should open automatically with a blank data window.


    The data window and the output window provide the basic interface for SPSS. A
    blank data window is shown below.


    ## Section 1.2 Entering Data


    One of the keys to success with SPSS is knowing how it stores and uses your data.
    To illustrate the basics of data entry, we will use a survey that was given to
    several students from four different classes (Tues/Thurs mornings, Tues/Thurs
    afternoons, Mon/Wed/Fri mornings, and Mon/Wed/Fri afternoons). The students were
    asked whether they were “morning people” and whether they worked. This survey
    also asked for their final grade in the class (100% being the highest possible).
    The response sheets from two students are presented below:


    | Response Sheet 1 | | | | |

    | ID: | 4593 | | | |

    | Day of class: | | MWF | X | TTh |

    | Class time: | | Morning | X | Afternoon |

    | Are you a morning person? | | | Yes | X | No |

    | Final grade in class: | 85% | | | | |

    | Do you work outside school? | | | Full-Time | | Part-Time |

    | | | X | No | | |


    | Response Sheet 2 | | | | | |

    | ID: | 1901 | | | | |

    | Day of class: | X | MWF | | TTh |

    | Class time: | X | Morning | | Afternoon |

    | Are you a morning person? | X | Yes | | No | |

    | Final grade in class: | 83% | | | | |

    | Do you work outside school? | | | Full-Time | X | Part-Time |

    | | | | No | X | |


    ![](Images/fig0006.jpg)


    ### Example 1.2.1


