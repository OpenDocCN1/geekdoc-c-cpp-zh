    In addition, the dependent variable should be normally distributed around the
    prediction line. This, of course, assumes that the variables are related to each
    other linearly. All variables should be normally distributed. Dichotomous variables
    (e.g., SEX in the example below) are also acceptable as independent variables.


    ### SPSS Data Format


    At least three variables are required in the SPSS data file. Each subject must
    provide data for all variables.


    ### Running the Command


    Click Analyze, then Regression, then Linear. This will bring up the main dialog
    box for Linear Regression. On the left side of the dialog box is a list of the
    variables in your data file. (We are using the HEIGHT.sav data file from the start
    of this chapter.) On the right side of the dialog box are blanks for the dependent
    variable (the variable you are trying to predict) and the independent variables
    (the variables from which you are predicting).


    ![](Images/fig00111.jpg)![](Images/fig00112.jpg)


    We are interested in predicting someone’s weight based on his or her height and
    sex. We believe that both sex and height are related to weight. Thus, we should
    place the dependent variable WEIGHT in the Dependent block and the independent
    variables HEIGHT and SEX in the Independent(s) block.


    ![](Images/fig00113.jpg)


    This will perform an analysis to determine if WEIGHT can be predicted from SEX
    and/or HEIGHT. There are several methods SPSS can use to conduct this analysis.
    These can be selected with the Method box. The most widely used is Enter (the
    default), which puts all the variables in the equation, whether or not they are
    significant. Other methods can be selected by clicking on the down arrow next
    to the word Enter. The other methods use various means to enter only those variables
    that are significant predictors. In this case, we will use the default. Click
    OK to run the analysis.


