    ## Section 1.1 Starting SPSS


    Startup procedures for SPSS will differ slightly, depending on the configuration
    of the machine on which it is installed. If you have difficulty finding it look
    for a IBM SPSS Statistics section of your Start Menu. This text uses screenshots
    from the Windows version of SPSS. The MacOS and Unix versions will have the same
    functionality, but could appear differently than what is depicted herein.


    ![](Images/fig00005.jpg)


    When SPSS is started, you may be presented with the dialog box above, depending
    on the options your system administrator selected for your version of the program.
    If you have the dialog box, click Type in data and OK, which will present a blank
    data window.^([1](#Ch01.xhtml_fn0002))


    If you were not presented with the dialog box above, SPSS should open automatically
    with a blank data window.


    The data window and the output window provide the basic interface for SPSS. A
    blank data window is shown below.


    ## Section 1.2 Entering Data


    One of the keys to success with SPSS is knowing how it stores and uses your data.
    To illustrate the basics of data entry with SPSS, we will use Example 1.2.1.


    ![](Images/fig00006.jpg)


    ### Example 1.2.1


    A survey was given to several students from four different classes (Tues/Thurs
    mornings, Tues/Thurs afternoons, Mon/Wed/Fri mornings, and Mon/Wed/Fri afternoons).
    The students were asked whether or not they were “morning people” and whether
    or not they worked. This survey also asked for their final grade in the class
    (100% being the highest grade possible). The response sheets from two students
    are presented below:


    | Response Sheet 1 |  |  |  |  |


    | ID: | 4593 |  |  |  |


    | Day of class: | ___ |  MWF | X | TTh |


    | Class time: | ___ |  Morning | X | Afternoon |


    | Are you a morning person? | ___ |  Yes | X | No |


    | Final grade in class: | 85% |  |  |  |


    | Do you work outside school? | ___ | Full-Time | ___ | Part-Time |


    |  | X |  No |  |  |


    | Response Sheet 2 |  |  |  |  |


    | ID: | 1901 |  |  |  |


    | Day of class: | X | MWF | ___ | TTh |


    | Class time: | X | Morning | ___ | Afternoon |


    | Are you a morning person? | X | Yes | ___ |  No |


    | Final grade in class: | 83% |  |  |  |


    | Do you work outside school? | ___ | Full-Time | X | Part-Time |


    |  | ___ | No | X |  |


    Our goal is to enter the data from the two students into SPSS for use in future
    analyses. The first step is to determine the variables that need to be entered.
    Any information that can vary among participants is a variable that needs to be
    considered. Example 1.2.2 lists the variables we will use.


    ### Example 1.2.2


    *   ID


    *   Day of class


    *   Class time


    *   Morning person


    *   Final grade


    *   Whether or not the student works outside school'
