    集中趋势度量应当伴随离散度量。因此，在给出平均值时，你还应该报告标准差。在给出中位数时，你应该说明范围或四分位间距。


    ### SPSS 数据格式

    SPSS 数据文件中需要两个变量。其中一个代表因变量，它是你接收描述性统计结果的变量；另一个是自变量，将用于创建子集。请注意，虽然 SPSS 将此变量称为自变量，但它可能不符合定义真正自变量的严格标准（例如，处理操纵）。因此，某些
    SPSS 过程将其称为分组变量。


    ### 执行命令

    本示例使用了你在第 1 章中创建的 `SAMPLE.sav` 数据文件。通过点击 `Analyze`（分析）、然后 `Compare Means`（比较均值）、最后
    `Means`（均值）来运行 `Means` 命令。


    ![](img/fig0006.jpg)


    这将弹出 `Means` 命令的主对话框。将选定的变量放在标记为 `Dependent List`（依赖列表）的空白框中。将分组变量放在标记为 `Independent
    List`（独立列表）的框中。在本示例中，通过使用 `SAMPLE.sav` 数据文件，将为变量 `MORNING` 的每个水平提供变量 `GRADE` 的集中趋势度量和离散度量。


    ![](img/fig00061.jpg)


    默认情况下，会给出平均值、数量和标准差。如果你需要额外的度量，点击 `Options`（选项），将出现此处所示的对话框。你可以选择任意数量的度量。


    ![](img/fig00062.jpg)


    ### 读取输出

    `Means` 命令的输出分为两个部分。第一部分称为案例处理摘要（case processing summary），提供了关于使用数据的信息。在我们的样本数据文件中，有四个学生（案例），他们都被包含在分析中。


    ![](img/fig00063.jpg)


    输出的第二部分是 `Means` 命令的报告。


    ![](img/fig00064.jpg)


    该报告顶部列出了因变量（`GRADE`）的。自变量（`MORNING`）的每个水平显示在表格的一行中。在本示例中，水平为 0 和 1，分别标记为 `No`
    和 `Yes`。请注意，如果变量标记了标签，则将使用标签而不是原始值。


    报告中给出的汇总统计数据对应于数据，自变量的水平等于行标题（例如，`No`、`Yes`）。因此，每行都包含两个参与者。晨型人的平均 `GRADE` 为 78.0，非晨型人的平均
    `GRADE` 为 82.5。


    另外添加了一行名为 `Total`（总计）的行。该行包含合并的数据，其值与我们对变量 `GRADE` 运行 `Descriptives` 命令时得到的值是相同的。


    ### 扩展到多个自变量

    ![](img/fig00065.jpg)


    如果你有多个自变量，SPSS 可以进一步细分输出结果。与其在对话框的 `Independent List` 部分添加更多变量，你需要在不同的层级中添加它们。如果你点击
    `Next`（下一步），你将看到 `Layer 2 of 2`，你可以选择第二个自变量（例如 `TRAINING`）。请注意，SPSS 会指示你正在哪个层级进行工作。现在，当你运行命令（点击
    `OK`）时，将获得根据 `MORNING` 和 `TRAINING` 的每个水平生成的变量 `GRADE` 的汇总统计数据。


    你的输出将类似于所示。你现在有两个主要部分（`No` 和 `Yes`），以及一个 `Total`。但现在，每个主要部分又被细分为子部分（`No`、`Yes`
    和 `Total`）。


    ![](img/fig00066.jpg)


    你在层 1 中使用的变量（`MORNING`）是第一个列出的变量，它定义了主要部分。你在层 2 中使用的变量（`TRAINING`）列在第二个。因此，第一行代表既不是晨型人又接受了培训的参与者。第二行代表既不是晨型人又接受培训的参与者。第三行代表所有非晨型参与者的总计。


    注意，并不是所有行都给了标准差。这是因为在本示例中，每个单元格只有一个参与者。使用许多子集的一个问题是它增加了获得有意义结果所需的参与者人数。更多详情请参阅研究设计教材或咨询你的导师。


    ### 练习题

    使用附录 B 中的练习数据集 1，计算每个婚姻状况下年龄的平均值和标准差。已婚参与者的平均年龄是多少？单身参与者的平均年龄是多少？离异参与者的平均年龄是多少？


    ## 3.5 节 标准分


    ### 描述

    标准分通过将分数转换为共同量表，允许比较不同的量表。最常见的标准分是 `z-score`。`z-score` 基于标准正态分布（即均值为 0，标准差为 1）。因此，`z-score`
    代表分数高于或低于平均值的标准差倍数（例如，–1.5 的 `z-score` 代表给定分数比平均值低 1½ 标准差）。


    ### 假设

    标准正态分布是常用于 `z-scores` 的基础。因此，转换为 `z-scores` 的分布应该是正态的，且量表应为等距或比率尺度。


    ### 得出结论

    基于 `z-scores` 的结论是分数高于或低于平均值的标准差倍数。例如，一个学生在数学考试中得 85 分，班级平均分为 70 分，标准差为 5 分。该学生的得分高于平均值
    15 分（85–70=15）。其 `z-score` 为 3，因为它比平均值高 3 个标准差（15÷5=3）。如果该学生在阅读考试中得 90 分，班级平均分为
    80 分，标准差为 10 分，则 `z-score` 将为 1.0，因为她比平均值高一个标准差。因此，尽管她的原始分更高，但在数学考试中表现更好，因为她的
    `z-score` 更。


    ### 描述

    在 SPSS 中计算 `z-scores` 需要单个变量。该变量必须是数值型的。


    ### 执行命令

    ![](img/fig0006.jpg)


    本示例使用了你在第 1 章和第 2 章中创建的样本数据文件 (`SAMPLE.sav`)。计算 `z-scores` 是 `Descriptives` 命令的一个组成部分。要访问它，点击
    `Analyze`（分析）、`Descriptive Statistics`（描述性统计）、然后 `Descriptives`（描述）。


    ![](img/fig00068.jpg)


    这将弹出 `Descriptives` 命令的标准对话框。注意左下角标记为 `Save standardized values as variables`（将标准化值保存为变量）的复选框。勾选此框并将变量
    `GRADE` 移动到右侧框中。然后，点击 `OK` 完成分析。你将看到来自 `Descriptives` 命令的标准输出。注意 z-score 未列在输出中。它们已作为新变量插入到数据窗口。


    ### 读取输出

    在你进行分析后，新变量已被创建。你可以对该新变量进行任意数量的后续分析。


