    # 第 3 章：描述性统计


    在第 2 章中，我们讨论了 SPSS 中处理数据的许多可用选项。现在我们将讨论汇总数据的方法。用于描述和汇总数据的程序被称为描述性统计。


    ## 第 3.1 节 单变量的频率分布和百分位数排名


    ### 描述


    `Frequencies（频率）`命令为指定的变量生成频率分布。输出包括出现次数、百分比、有效百分比和累积百分比。有效百分比累积百分比仅包含未被标记为缺失的数据。


    `Frequencies`命令适用于描述均值没有意义的样本（例如名义或序量表）。它作为一种熟悉数据的方法也有用。它提供的信息比简单的均值和标准差更多，并且对于确定偏态和识别离群值非常有用。该命令的一个特殊功能是能够确定百分位数排名。


    ### 假设


    累积百分比和百分位数仅对至少按序量表测量的数据有效。由于输出中每个变量的每个值都有一行，因此该命令在值较少的变量上效果最好。


    ### 得出结论


    `Frequencies`命令产生的输出指明样本中特定值的案例数量以及具有该值的案例百分比。因此，所得出的结论应仅与描述样本中案例的数字或百分比有关。如果数据本质上至少是序数的，则可以得出关于累积百分比和/或百分位数的结论。


    ### SPSS 数据格式


    获取频率分布的 SPSS 数据文件只需要一个变量，且该变量可以是任何类型。


    ### 创建频率分布


    此示例使用了随 SPSS 附的 `CAR_SALES.sav` 数据文件。如果你正在使用 SPSS 24 版，它将位于：


    ```

    C:\Program Files\IBM\SPSS\Statistics\24\Samples\English\car_sales.sav

    ```


    ![](img/fig00044.jpg)


    要运行`Frequencies`命令，点击`Analyze（分析）`，然后点击`Descriptive Statistics（描述统计）`，再点击`Frequencies（频率）`。这将弹出下方的主对话框。将你想要频率分布的变量移动到右侧所示的`Variable(s)(变量）`空白处（在本例中为
    `MANUFACTURER`）。确保勾选了`Display frequency tables（显示频率表）`选项。点击`OK`获取输出。


    ![](img/fig00045.jpg)


    注意，SPSS 中的对话框会显示变量类型（变量名称左侧的图标）以及如果输入了变量标签则显示变量标签。因此，变量 `MANUFACT` 在对话框中显示为 `Manufacturer`。


    点击`OK` 运行测试。


    ### 频率分布的输出


    输出由两部分组成。第一部分指示每个所选变量具有有效数据的记录数。分为空的记录被列为缺失。在本示例中，数据文件包含 157 条记录。


    输出的第二部分包含每个所选变量的累积频率分布。在部分的顶部，给出了变量标签。输出本身由五列组成。第一列按字母顺序列出变量的值。变量的每个值都有行，底部额外添加了用于`Total（总计）`和`Missing（缺失）`数据的行。第二列给出每个值的频率，包括缺失值。第三列给出所有记录（包括包含缺失数据的记录）每个值的百分比。第四列标记为`Valid
    Percent（有效百分比）`，给出每个值的记录（不包含缺失数据的记录）的百分比。如果有任何缺失值，这些值将比第三列的值大，因为总记录数减少了具有缺失值的记录数。最后一列给出累积百分比。累积百分比表示分数等于或小于当前值的记录百分比。因此，最后一个值始终是
    100%。这些值等同于所列数值的百分位数排名。注意：SPSS 即使对于名义变量和其他没有意义的变量，也会提供累积百分比。例如，变量 `MANUFACTURER`
    是名义变量。


    ![](img/fig00046.jpg)![](img/fig00047.jpg)


    ### 确定百分位数排名


    `Frequencies`命令可以提供若干描述性统计，以及各种百分位数值（包括四位数、分点和对应特定百分位数的得分）。让我们查看 `PRICE` 的统计信息。


    要获取`Frequencies`命令的描述性或百分位数功能，点击主对话框右上角的`Statistics（统计）`按钮。这将弹出下方的`Frequencies:
    Statistics（频率：统计）`对话框。注意，此框中的 Central Tendency（集中趋势）和 Dispersion（离散）部分用于计算`Descriptives（描述）`命令无法计算的值（例如中位数或众数）。点击任何所需的统计数据。（在示例中，让我们确定四位数、第
    80 百分位数、均值和位数。）


    ![](img/fig00048.jpg)![](img/fig0049.jpg)


    对于百分位数，在`Percentile(s）（百分位数）`标签右侧的空白处输入所需的百分位数。然后，点击`Add`将其添加到请求的百分位数列表中。一旦选择了所有统计数据，点击`Continue`返回主对话框。点击`OK`。


    ### 百分位数排名输出


    ![](img/fig00050.jpg)


    `Statistics`对话框补充了`Frequencies`命令输出的第一部分。输出为你请求的每项信息都有行。在前前的示例中，我们勾选了四位数并请求了第
    80 百分位数。因此，输出包含了第 25、50、75 和 80 百分位数的行。


    ### 练习题


    使用附录 B 中的练习数据集 1，为数学技能创建一个频率分布表。确定第 60 百分位数所在的数学技能得分。


    ## 第 3.2 节 多变量的频率分布和百分位数排名


    ### 描述


    `Crosabs（交叉表）`命令为多个变量生成频率分布。输出包括每个变量每个级别组合的出现次数。可以使命令为任何或所有变量提供百分比。


    ### 假设'
- fmt: '

    Because the output contains a row or column for each value of a variable, this
    command works best on variables with a relatively small number of values.


    ### SPSS Data Format


    The SPSS data file for the `Crosstabs` command requires two or more variables.
    Those variables can be of any type.


    ### Running the Command


    ![](Images/fig00051.jpg)


    This example uses the `SAMPLE.sav` data file, which you created in [Chapter 1](#Ch01.xhtml_ht0016).
    To run the procedure, click `Analyze`, then `Descriptive Statistics`, then `Crosstabs`.
    This will bring up the main `Crosstabs` dialog box, which is shown below.


    ![](Images/fig00052.jpg)


    The dialog box initially lists all variables on the left and contains two blank
    boxes labeled `Row(s)` and `Column(s)`. Enter one variable (`TRAINING`) in the
    `Row(s)` box. Enter the second (`WORK`) in the `Column(s)` box. To analyze more
    than two variables, you would enter the third, fourth, and so on, in the unlabeled
    area (just under the Layer indicator).


    ![](Images/fig00053.jpg)


    The `Cells` button allows you to specify percentages and other information to
    be generated for each combination of values. Click `Cells`, and you will get the
    box shown above, with `Observed` and `Round` cell counts selected by default.


    For the example presented here, check `Row`, `Column`, and `Total` percentages.
    Then click `Continue`. This will return you to the `Crosstabs` dialog box. Click
    `OK` to run the analysis.


    ### Interpreting Crosstabs Output


    The output consists of a contingency table. Each level of `WORK` is given a column.
    Each level of `TRAINING` is given a row. In addition, a row is added for total,
    and a column is added for total.


    ![](Images/fig00054.jpg)


    Each cell contains the number of participants (for example, one participant received
    no training and does not work; two participants received no training, regardless
    of employment status).


    The percentages for each cell are also shown. Row percentages add up to 100% horizontally.
    Column percentages add up to 100% vertically. For instance, of all the individuals
    who had no training, 50% did not work and 50% worked part-time (using the “% within
    TRAINING” row). Of the individuals who did not work, 50% had no training and 50%
    had training (using the “% within WORK” row).


    ### Practice Exercise


    Using Practice Dataset 1 in [Appendix B](#Apendix2.xhtml_ht0356), create a contingency
    table using the `Crosstabs` command. Determine the number of participants in each
    combination of the variables `SEX` and `MARITAL`. What percentage of participants
    are married? What percentage of participants are male and married?


    ## Section 3.3 Measures of Central Tendency and Measures of Dispersion for a Single
    Group


    ### Description


    Measures of central tendency are values that represent a typical member of the
    sample or population. The three primary types of measures are the `mean`, `median`,
    and `mode`. Measures of dispersion tell you the variability of your scores. The
    primary types are the `range` and the `standard deviation`. Together, a measure
    of central tendency and a measure of dispersion provide a great deal of information
    about the entire dataset.


    ![](Images/fig00055.jpg)


    We will discuss these measures of central tendency and measures of dispersion
    in the context of the `Descriptives` command. Note that many of these statistics
    can also be calculated with several other commands (e.g., the `Frequencies` or
    `Compare Means` commands are required to compute the mode or median—the `Statistics`
    option for the `Frequencies` command is shown above).


    ### Assumptions


    Each measure of central tendency and measure of dispersion has different assumptions
    associated with it. The `mean` is the most powerful measure of central tendency,
    and it has the most assumptions. For instance, to calculate a `mean`, the data
    must be measured on an interval or ratio scale. In addition, the distribution
    should be normally distributed or, at least, not highly skewed. The `median` requires
    at least ordinal data. Because the `median` indicates only the middle score (when
    scores are arranged in order), there are no assumptions about the shape of the
    distribution. The `mode` is the weakest measure of central tendency. There are
    no assumptions for the `mode`.


    The `standard deviation` is the most powerful measure of dispersion, but it, too,
    has several requirements. It is a mathematical transformation of the `variance`
    (the standard deviation is the square root of the `variance`). Thus, if one is
    appropriate, the other is also appropriate. The `standard deviation` requires
    data measured on an interval or ratio scale. In addition, the distribution should
    be normal. The `range` is the weakest measure of dispersion. To calculate a `range`,
    the variable must be at least ordinal. For nominal scale data, the entire frequency
    distribution should be presented as a measure of dispersion.


    ### Drawing Conclusions


    A measure of central tendency should be accompanied by a measure of dispersion.
    Thus, when reporting a `mean`, you should also report a `standard deviation`.
    When presenting a `median`, you should also state the `range` or `interquartile
    range`. The `interquartile range` can be determined using the `Frequencies` command.


    ### SPSS Data Format


    Only one variable is required.


    ### Running the Command


    The `Descriptives` command is the command you will most likely use for obtaining
    measures of central tendency and measures of dispersion. This example uses the
    `SAMPLE.sav` data file we used in the previous chapters.


    ![](Images/fig00056.jpg)


    To run the command, click `Analyze`, then `Descriptive Statistics`, then `Descriptives`.
    This will bring up the main dialog box for the `Descriptives` command. Any variables
    you would like information about can be placed in the right blank by double-clicking
    them or by selecting them and then clicking on the arrow. Move the variable `GRADE`
    to the right for this example.


    ![](Images/fig00057.jpg)


    By default, you will receive the `N` (number of cases/participants), the `minimum`,
    the `maximum`, the `mean`, and the standard deviation. Note that some of these
    may not be appropriate for the types of data you have selected.


    If you would like to change the default statistics that are given, click `Options`
    in the main dialog box. You will be given the `Options` box shown below. Click
    `Continue` or `Cancel` to close the `Options` box. Then click `OK`.


    ![](Images/fig00058.jpg)


    ### Reading the Output


    The output for the `Descriptives` command is quite straightforward. Each type
    of output requested is presented in a column, and each variable is given in a
    row. The output presented below is for the sample data file. It shows that we
    have one variable (`GRADE`) and that we obtained the `N`, `minimum`, `maximum`,
    `mean`, and `standard deviation`.


    ![](Images/fig00059.jpg)


    ### Practice Exercise


    Using Practice Dataset 1 in [Appendix B](#Apendix2.xhtml_ht0356), obtain the descriptive
    statistics for the age of the participants. What is the `mean`? The `median`?
    The `mode`? What is the `standard deviation`? `minimum`? `maximum`? The `range`?
    (Refer to Section 3.1 for assistance with median and mode.)


    ## Section 3.4 Measures of Central Tendency and Measures of Dispersion for Multiple
    Groups


    ### Description


    The measures of central tendency discussed earlier are often needed not only for
    the entire dataset, but also for several subsets. One way to obtain these values
    for subsets is to use the data-selection techniques discussed in [Chapter 2](#Ch02.xhtml_ht0034)
    and apply the `Descriptives` command to each subset. An easier way to perform
    this task is to use the `Means` command. The `Means` command is designed to provide
    descriptive statistics for subsets of your data.


    ### Assumptions


    The assumptions discussed in the section titled “Measures of Central Tendency
    and Measures of Dispersion for a Single Group” (Section 3.3) also apply to multiple
    groups.


