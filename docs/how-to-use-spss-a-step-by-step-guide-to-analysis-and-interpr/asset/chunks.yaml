    ### 得出结论\n\n只有当组 Wilks’ Lambda 显著时，我们才解释单变量检验的结果。我们的结果并不显著，但我们将首先考虑如何解释显著的结果。\n\
    \n### 显著结果的表述\n\n如果我们收到了下面的输出，说明我们得到了一个显著的多元方差分析（MANOVA），我们可以陈述如下：\n\n通过单因素多元方差分析，考察了训练（无、短期或长期）对\
