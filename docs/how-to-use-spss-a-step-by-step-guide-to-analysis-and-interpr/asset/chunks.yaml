    ### Practice Exercise


    Use Practice Dataset 2 in [Appendix B](#Apendix2.xhtml_ht0356). In the population
    from which the sample was drawn, 20% of employees are clerical, 50% are technical,
    and 30% are professional. Determine whether or not the sample drawn conforms to
    these values. Hint: You will need to customize expected probabilities and enter
    the category values (1, 2, 3) and relative percentages (20, 50, 30). Also, be
    sure you have entered the variable `CLASSIFY` as nominal.


    ## Section 8.2 Chi-Square Test of Independence


    ### Description

    The chi-square test of independence tests whether or not two variables are independent
    of each other. For instance, flips of a coin should be independent events, so
    knowing the outcome of one coin toss should not tell us anything about the second
    coin toss. The chi-square test of independence is essentially a nonparametric
    version of the interaction term in ANOVA.


    ### Assumptions

    Very few assumptions are needed. For instance, we make no assumptions about the
    shape of the distribution. The expected frequencies for each category should be
    at least 1, and no more than 20% of the categories should have expected frequencies
    of less than 5. (Note: To save space, these examples violate that assumption.)


    ### SPSS Data Format

    At least two variables are required.


    ### Running the Command

    ![](Images/fig00198.jpg)


    The chi-square test of independence is a component of the `Crosstabs` command
    rather than the `Nonparametric Statistics` command. For more details, see Section
    3.2 in [Chapter 3](#Ch03.xhtml_ht0042) on frequency distributions for multiple
    variables.


    ![](Images/fig00199.jpg)


    This example uses the `COINS.sav` file. `COIN1` is placed in the Row(s) blank,
    and `COIN2` is placed in the Column(s) blank.


    ![](Images/fig00200.jpg)


    Click Statistics, then check the Chi-square box. Click Continue. You may also
    want to click Cells to select expected frequencies in addition to observed frequencies.


    ![](Images/fig00201.jpg)


    Note that you can also use the `Cells` option to display the percentages of each
    variable for each value. This is especially useful when your groups are different
    sizes, but it is unnecessary in this example.


    Click OK to run the analysis.


    ### Reading the Output

    The output consists of two parts. The first part gives you the counts. In this
    example, the actual and expected frequencies are shown because they were selected
    with the `Cells` option.


    The second part of the output gives the results of the chi-square test. The most
    commonly used value is the Pearson chi-square, shown in the first row (value of
    .737).


    ![](Images/fig00202.jpg)![](Images/fig00203.jpg)


    ### Drawing Conclusions

    A significant chi-square test result indicates that the two variables are not
    independent. A value that is not significant indicates that the variables do not
    vary significantly from independence.


    ### Phrasing Results That Are Significant

    In describing the results, you should give the value of chi-square, the degrees
    of freedom, the significance level, and a description of the results. For instance,
    with a significant chi-square (for a dataset different from the one discussed
    above), we could state the following:


    A chi-square test of independence was calculated comparing the frequency of heart
    disease in men and women. A significant interaction was found (χ²(1) = 23.80,
    p < .05). Men were more likely to get heart disease (68%) than women (40%).


    Note that this summary statement assumes that a test was run coding participants’
    sex and whether or not they had heart disease.


    ### Phrasing Results That Are Not Significant

    A chi-square test that is not significant indicates that there is no significant
    dependence of one variable on the other. The coin example was not significant.
    Therefore, we could state the following:


    A chi-square test of independence was calculated comparing the results of flipping
    two coins. No significant relationship was found (χ²(1) = .737, p > .05). Flips
    of a coin appear to be independent events.


    ### Practice Exercise

    A researcher wants to know if individuals are more likely to help in an emergency
    when they are indoors or when they are outdoors. Of 28 participants who were outdoors,
    19 helped and 9 did not. Of 23 participants who were indoors, 8 helped and 15
    did not. Enter these data, and find out if helping behavior is affected by the
    environment. The key to this problem is in the data entry. Hint: How many participants
    were there, and how many pieces of information do we know about each? Having SPSS
    give you cell percentages will help you with the interpretation of this problem.


    ## Section 8.3 Mann-Whitney U Test


    ### Description

    The Mann-Whitney U test is the nonparametric equivalent of the independent t test.
    It tests whether or not two independent samples are from the same distribution.
    The Mann-Whitney U test is weaker than the independent t test, and the t test
    should be used if you can meet its assumptions.


    ### Assumptions

    The Mann-Whitney U test uses the rankings of the data. Therefore, the data for
    the two samples must at least be ordinal. There are no assumptions about the shape
    of the distribution.


    ### SPSS Data Format

    This command requires a single variable representing the dependent variable and
    a second variable indicating group membership. SPSS requires the dependent variable
    to be a scale-type variable even though the variable itself only needs to be ordinal.


