    significant. Other methods can be selected by clicking on the down arrow next
    to the word `Enter`. The other methods use various means to enter only those variables
    that are significant predictors. In this case, we will use the default. Click
    `OK` to run the analysis.


    ### Reading the Output


    ![](Images/fig00114.jpg)


    For multiple linear regression, there are three components of the output in which
    we are interested. The first is called the `Model Summary`, which is found after
    the `Variables Entered/Removed` section. For our example, you should get the output
    above.


    `R Square` (called the coefficient of determination) tells you the proportion
    of the variance in the dependent variable (`WEIGHT`) that can be explained by
    variation in the independent variables (`HEIGHT` and `SEX`, in this case). Thus,
    99.3% of the variation in weight can be explained by differences in height and
    sex (taller individuals weigh more, and men weigh more). Note that when a second
    variable is added, our `R Square` goes up from `.649` to `.993`. The `.649` was
    obtained using the `Simple Linear Regression` example in Section 5.3.


    The standard error of the estimate gives you a margin of error for the prediction
    equation. Using the prediction equation, 68% of the data will fall within one
    standard error of estimate (predicted) value. Just over 95% will fall within two
    standard errors of estimate. Thus, in the example above, 95% of the time our estimated
    weight will be within `4.591` (`2.29571 × 2`) pounds of being correct. In our
    `Simple Linear Regression` example in Section 5.3, this number was `32.296`. Note
    the higher degree of accuracy.


    The second part of the output that we are interested in is the `ANOVA` summary
    table. For more information on reading `ANOVA` tables, refer to the sections on
    `ANOVA` in [Chapter 7](#Ch07.xhtml_ht0194). For now, the important number is the
    significance in the rightmost column. If that value is less than `.05`, we have
    a significant linear regression. If it is larger than `.05`, we do not.


    ![](Images/fig00115.jpg)


    The final section of output we are interested in is the table of coefficients.
    This is where the actual prediction equation can be found.


    In most texts, you learn that `Y'' = a + bX` is the regression equation. For multiple
    regression, our equation changes to `Y'' = B[0] + B[1] X[1] + B[2] X[2] + … +
    B[z] X[z]` (where `z` is the number of independent variables.) `Y''` is your dependent
    variable, and the `Xs` are your independent variables.


