    ## Section 7.4 Repeated-Measures ANOVA


    ### Description


    Repeated-measures ANOVA extends the basic ANOVA procedure to a within-subjects
    independent variable (when participants provide data for more than one level of
    an independent variable). It functions like a paired-samples t test when more
    than two levels are being compared.


    ### Assumptions


    The dependent variable should be normally distributed and measured on an interval
    or ratio scale. Multiple measurements of the dependent variable should be from
    the same (or related) participants.


    ### SPSS Data Format


    At least three variables are required. Each variable in the SPSS data file should
    represent a single dependent variable at a single level of the independent variable.
    Thus, an analysis of a design with four levels of an independent variable would
    require four variables in the SPSS data file.


    If any variable represents a between-subjects effect, use the Repeated Measures
    ANOVA command instead.


    ### Running the Command


    ![](Images/fig00165.jpg)


    This example uses the GRADES.sav sample dataset. Recall that GRADES.sav includes
    three sets of grades—PRETEST, MIDTERM, and FINAL—that represent three different
    times during the semester. This allows us to analyze the effects of time on the
    test performance of our sample population (hence the within-groups comparison).
    Click Analyze, then General Linear Model, then Repeated Measures.


    Note that this procedure requires an optional module. If you do not have this
    command, you do not have the necessary module installed. This procedure is NOT
    included in the SPSS Statistics GradPack Base.


    ![](Images/fig00166.jpg)


    After selecting the command, you will be presented with the Repeated Measures
    Define Factor(s) dialog box. This is where you identify the Within-Subject Factor
    (we will call it TIME). Enter 3 for the Number of Levels (three exams) and click
    Add.


    If we had more than one independent variable that had repeated measures, we could
    enter its name and click Add. Now click Define.


    ![](Images/fig00167.jpg)


    You will be presented with the Repeated Measures dialog box. Transfer PRETEST,
    MIDTERM, and FINAL to the Within-Subjects Variables section. The variable names
    should be ordered according to when they occurred in time (i.e., the values of
    the independent variable that they represent).


    ![](Images/fig00168.jpg)


    Click Options, and the dialog box here will appear.


    By moving TIME to the right and selecting Descriptive statistics, SPSS will calculate
    the means for the TIME effect. Click CONTINUE to close the dialog box and OK to
    run the command.


