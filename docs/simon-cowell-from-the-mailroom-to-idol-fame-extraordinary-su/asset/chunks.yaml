    In 2010, British Prime Minister Gordon Brown asked Simon to record a song with
    famous singers and musicians to help victims of the January 2010 earthquake in
    Haiti. Money made from sales of the song would go to charities devoted to rebuilding
    Haiti and helping those who had been affected by the disaster. Simon was only
    too happy to help the people of Haiti with the single. He chose the R.E.M. song
    “Everybody Hurts,” and asked celebrity singers to sing on the song. Singers from
    Britain and the United States helped to record the song, including many of the
    stars whose careers Simon had helped start. Leona Lewis, Susan Boyle, and members
    of the pop group Westlife all lent their voices to the “Helping Haiti” single.
    Miley Cyrus, James Blunt, Michael Buble, Jon Bon Jovi, Mariah Carey, Robbie Williams,
    and Kylie Minogue also sang on the song. The song was a huge hit, selling almost
    half a million copies in one week and reaching the top of the pop song charts
    in Britain. The charity version of “Everybody Hurts” was also a hit in countries
    around the world, including Ireland, Australia, Germany, New Zealand, Switzerland,
    Spain, and Canada, among others. Most important of all, the money the song made
    went straight to help the people of Haiti.


    ![Image](images/00023.jpeg)


    *Simon worked hard to organize the charity single “Everybody Hurts” after the
    2010 earthquakes in Haiti.*


    ## Still Successful


    Today, Simon Cowell is more successful than ever. After working on `American Idol`,
    one of the most successful television shows of all time, Simon is branching out
    to work on other projects in both television and music. He’s had a hand in creating
    some of the music world’s biggest stars, and making some of the most popular television
    shows of the last decade.


    Simon’s success comes from his drive to work hard and from his no-nonsense attitude.
    Though his critical comments may make him seem prickly or even unlikeable, Simon
    understands that the music business can be just as harsh as the things he says
    to talent competition contestants. His sharp tongue has helped him become popular
    on television as someone people love to hate, though Simon’s fans respect his
    judgments as advice from someone who knows the entertainment business well.


    Simon told `Business Week` that in order to become a success in business it’s
    important to “work hard, be patient, and be a sponge while learning your business.”
    He continued, “Learn how to take criticism. Follow your gut instincts and don’t
    compromise.” Simon has certainly shown himself to have the drive needed to reach
    his goals, particularly when he started his career without graduating high school.
    Simon’s smart decisions come out of years of experience in the music industry
    and an understanding that entertainment is a business. “I’ve always treated the
    music business as a business,” he told `Business Week`. “Whether I’m making TV
    shows or signing artists, you have to do it by the head and not the heart— and
    I run my businesses that way.”


    Few people can say they’ve done as much, or achieved the same level of success
    as Simon. On the `Daily Telegraph’s` 2008 list of the 100 most powerful people
    in British culture, Simon’s was ranked as number six. In 2010, `Time` magazine
    named Simon one of their 100 most influential people in the world. Nick Cannon,
    host of `America’s Got Talent`, wrote a `[tribute](#part0010.html_tribute)` to
    Simon in the magazine. Simon may not always be the warmest person on television,
    but there’s no doubting that he’s reached heights that many others strive to reach.


    And he did it all without having gone to college!


    ![Image](images/00024.jpeg)


    *Melanie Amaro won the first season of the American version of X-Factor in 2011.*


    ## WHAT CAN YOU EXPECT?


    Of course not everyone who skips college is going to be a celebrity or a millionaire.
    But there are other more ordinary jobs out there for people who choose to go a
    different route from college. Here’s what you can expect to make in 100 of the
    top-paying jobs available to someone who has only a high school diploma. (If you’re
    not sure what any of the jobs are, look them up on the Internet to find out more
    about them.) Keep in mind that these are average salaries; a beginning worker
    will likely make much less, while someone with many more years of experience could
    make much more. Also, remember that wages for the same jobs vary somewhat in different
    parts of the country.


