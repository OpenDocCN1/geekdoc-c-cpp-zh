    ## 第一章：早年生活


    ### 词汇积累


    `reality television`: 真人秀是指基于真实人物生活或竞赛的节目，涉及的是真实人物而非演员。真人秀不使用剧本。

    `record label`: 唱片公司是指发现新艺人、与他们签署合同销售其音乐并推广该艺人信息的公司。

    `borough`: 行政区是城市的一个较小部分。通常，大城市由几个行政区组成。例如，纽约市就有五个行政区。

    `song charts`: 音乐榜记录哪些歌曲最畅销，并按销量进行排名。


    2010 年 1 月 11 日（周一），西蒙·考维尔宣布他将离开《美国偶像》评委席，震惊了电视观众。这部`真人秀`节目自 2002 年首播以来，在美国取得了巨大的成功，当时它向美国观众介绍了言辞犀利的西蒙。《美国偶像》源自英国节目《流行偶像》，西蒙也是该节目的评委，《美国偶像》让西蒙·考维尔成为了国际明星，主要是因为他对音乐比赛参赛者的严厉批评。


    西蒙帮助让了节目大红。“我想在今年离开《偶像》时，让比比更大更好，”他对电视评论协会协会。西蒙补充说，他对节目所取得的成就“非常自豪”。他有理由自豪；在西蒙担任评委期间，《美国偶像》已成为电视上受欢迎的节目之一。


    然而，西蒙离开《美国偶像》并非毫无目的。他计划启动《英国偶像》的美国版，这是另一档他担任评委的英国真人秀竞赛。“我[我]不认为在美国同时做两个节目是对的，所以[我]决定离开一个并开始另一个，”他说。在《美国偶像》中工作了近十年后，西蒙准备好开始新事物的工作。“我们为《英国偶像》美国版的开播日期感到非常兴奋，并很高兴能继续与
    Fox 合作，”西蒙说，“我们拥有极好的关系、棒的团队，大家都对此感到非常兴奋。”


