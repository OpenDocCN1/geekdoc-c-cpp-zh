    在经历了几份没有持续多久的工作后，西蒙的父亲成功地在 EMI 音乐出版公司（EMI Music Publishing）为他找到了一份工作，那里是考威尔先生工作的公司。西蒙在
    EMI 的邮件室工作；他的工作是确保进入公司的邮件能送到正确的人手中。


    ![Image](img/00008.jpeg)


    在自己的书籍《我并非无意无礼，但是……》（*I Don’t Mean to Be Rude, But...*）中，西蒙描写了自己的成长以及进入音乐行业的经历。


    在 EMI 工作是西蒙在音乐行业的首次尝试，尽管他远远离录制歌曲或发掘新艺，更远离任何真正看起来像音乐销售业务。但很快，西蒙就开始从底层开始攀爬，没多久他就登上了音乐事业的顶端。


    ![Image](img/00009.jpeg)


    ## 第二章：走向成功


    ### 重点词汇


    - **repertoire（曲目）**：艺术家的曲目是指他录制和表演过的歌曲集。

    - **producer（制作人）**：制作人与艺术家合作录制歌曲。

    - **signing（签约）**：当唱片公司签约一名艺术家时，公司同意销售该艺术者的音乐，而艺术家同意只与该公司合作制作音乐。

    - **single（单曲）**：单曲是艺术家发行的一首歌曲，通常是专辑中的第一首歌。发行单曲是为了帮助推广该艺术家及其专辑。


    对于许多高中辍学者来说，找到一份工作可能非常困难，甚至是不可能的。西蒙非常幸运，父亲在 EMI 唱片公司（EMI Records）为他找到了工作，那是全球最大的唱片公司之一。他确实是从一份很小的工作开始的，但这正是他进入音乐行业所需的机遇。


    ### 音乐行业的生活


    在邮件室工作对西蒙来说是一份好工作——特别是因为他没有真正的工作经验，没有高中学历，而且从未上过大学——但他并不是他想留下的地方。“从上班的第一天起，我就开始规划并策划通往行业顶端的道路，”他在自传中写道。


    西蒙很快很快就离开了邮件室。然而，一年后，在父亲的帮助下，他回到了 EMI 音乐出版公司。西蒙成为了公司里一名 A&R（艺人与曲目）主管的助理。A&R 涉及为唱片公司寻找新艺人。西蒙担任了一段时间的助理，并一直为
    EMI 寻找新人才，随后才开始担任制作人。


    作为制作人，西蒙结识了皮特·沃特曼（Pete Waterman），他是著名的英国制作团队 Stock Aitken Waterman 的成员。西蒙学习了如何与皮特一起录制音乐，也学习了什么能成就一首伟大的歌曲和一位伟大的艺术家。


    到 1985 年，西蒙准备好单闯了。他离开了 EMI，与他的老板埃利斯·里奇（Ellis Rich）一起创立了自己的音乐出版公司。他们将公司命名为 E&S
    Music。这家公司并不成功，西蒙在自传中写道，创立公司是一个错误。西蒙在新公司成立后不久就离开了，但他并未就此。


    离开 E&S 不久，西蒙遇见了伊恩·伯顿（Iain Burton），两人创立了一家名为 Fanfare Records（号唱片）的唱片公司。西蒙来到 Fanfare
    做 A&R 工作，就像他在 EMI 的时候一样。他为公司寻找新艺人，并签约了西妮塔（Sinitta），这是一位曾与名为 Hot Gossip 的女舞小组合作过的女歌手。该小组曾与伯顿和阿阿琳·菲利普斯（Arlene
    Phillips）合作（后者是伯顿管理的舞蹈家），随后与 Fanfare 合作发行了该公司的第一首歌。西妮塔正是 Fanfare 早期需要的艺术家，也是那种能帮助西蒙的
    A&R 主管事业的艺术家。


    西蒙知道自己可以把这位艺术家打造成明星，并帮助她录制金曲，但伯顿对新公司感到紧张。很快，他说服伯顿给了他几千美元来发行西妮塔的首支单曲《So Macho》。当这首歌发行时，它火了，获得了英国歌曲排行榜第二名。《So
    Macho》帮助 Fanfare 维持了经营，西妮塔随后在该唱片公司又出过几首热门歌曲。


    ![Image](img/00010.jpeg)


    编舞老师阿阿琳·菲利普斯帮助组成了 Hot Gossip，并与该小组及伯顿合作了多年。


    ![Image](img/00011.jpeg)


    西蒙通过英国流行歌手西妮塔取得了成功。两人还曾交往过。


    尽管在 Fanfare Records 取得了早期成功，西蒙还是在 1989 年离开了公司。由于没有工作，他不得不回到父母家住。但西蒙并没有让他的音乐事业此结束，他在全球最大的唱片公司之一的
    BMG 找到了工作。西蒙开始组建一个唱片厂，与 BMG 合作发行新艺人的音乐。再次，西蒙在寻找新人才，扮演着他在 EMI 和 Fanfare 担任的 A&R
    主管角色。他将他的新标签命名为 S Records。


    西蒙开始为他的厂牌签约新的艺人和团体，包括演唱组合 5ive 和西男华（Westlife）。西蒙还出了一个明智决定，发行基于热门电视节目和娱乐品牌的歌曲。S
    Records 发行的基于《恐龙战士》（Mighty Morphin’ Power Rangers）、《小宝贝布》（Teletubbies）和世界摔跤娱乐（WWE）的歌曲销量良好。


    ### 成功与悲剧


    1999 年，西蒙既经历了职业生涯迄今为止最大的成就之一，也失去了帮助他开启这一切的父亲——他的父亲。


    西蒙一直努力让他新签约的西男华获得成功，到 1999 年初，他的努力终于得到了回报。该组合的首支单曲《Swear It Again》于 3 月发行，迅速冲上英国排行榜冠军。西蒙对他组合的成功感到无比兴奋。《Swear
    It Again》不仅是西男华的首支冠军单，也是西蒙作为唱片公司高管的首支冠军单。从他们签约 S Records 开始，他就相信他们的潜力，知道他们能大红。西蒙的父亲对西男华在音乐领域的机遇也有同样的感受，所以西蒙想确保父母知道他的首支冠军单。


    《Swear It Again》夺冠军当天，西蒙回家分享了这个消息。当西蒙联系英国的母亲时，他知道不对劲，但他太高兴告诉她自己的最新成就，所以一直在说。挂电话后，西蒙的母亲回了电话，告诉西蒙他的父亲埃因心脏发作去世了。西蒙对这个糟糕的消息心碎。


    多年后，西蒙与口秀主持人皮尔斯·摩根（Piers Morgan）谈到了父亲去世的消息。西蒙忍着泪水说：


    “那不是……并不美好。但你必须面对它，你知道的，我回去意识到你的首要责任是照顾好妈妈。那是一段糟糕、糟糕、糟糕的时间，就像我所说的。你以为每个人都会永远活着，但他们并不会。你认为你在乎的一切东西，热门唱片之类的，完全毫无意义。”


    ![Image](img/00012.jpeg)


    在西蒙父亲去世前后，西男华在英国成为了一个巨大的流行组合。


