    artist who would help Simon’s career as an A&R executive.


    Simon knew he could make the artist a star and help her record hit songs, but
    Burton was nervous about the new company. Soon, he told Simon that he was going
    to back out of Fanfare. Simon convinced Burton to give him a few thousand dollars
    to put out Sinitta’s first *[single](#part0007.html_single)*, “So Macho.” When
    the song was released, it was a hit, reaching number two on the song charts in
    Britain. “So Macho” helped keep Fanfare in business, and Sinitta went on to have
    a couple more hits on the label.


    ![Image](images/00010.jpeg)


    *Choreographer Arlene Phillips helped to form Hot Gossip and worked with the group
    and Burton for years.*


    ![Image](images/00011.jpeg)


    *Simon found success with British pop singer Sinitta. The two also dated.*


    Despite his early successes at Fanfare Records, Simon left the company in 1989\.
    Without a job, he had to move back in with his parents. Simon wouldn’t let his
    career in music end, though, and he found work with record label BMG, one of the
    largest in the world. Simon began putting together a label that would work with
    BMG to put out music from new artists. Once again, Simon was on the hunt for new
    talent, playing the role of A&R executive that he had at EMI and Fanfare. He called
    his new label S Records.


    Simon began signing new artists and groups to his label, including singing groups
    5ive and Westlife. Simon also made the smart decision to put out songs based on
    already-popular television shows, and entertainment brands. S Records released
    songs based on the Mighty Morphin’ Power Rangers, Teletubbies, and the World Wrestling
    Entertainment (WWE). The songs sold very well and helped S Records become a success
    early on. One group on S Records, the boy band Westlife, was set for major success
    in Britain.


    Success and Tragedy


    In 1999, Simon experienced both one of the greatest achievements of his career
    in the music business to date and the loss of the man who’d helped him start that
    career, his father Eric.


    Simon had been working to make his newly signed group Westlife a success in England,
    and by early 1999, his work was finally paying off. The group’s first single “Swear
    It Again” had been released in March and quickly reached number one on the British
    song charts. Simon couldn’t have been more excited about his new group’s success.
    “Swear It Again” wasn’t just Westlife’s first number-one song, it was also Simon’s
    first as a record company executive. He’d believed in the group’s potential from
    the time he signed them to his S Records, knowing that they could be big. Simon’s
    father felt the same way about Westlife’s chance to succeed in music, so Simon
    wanted to make sure he let his parents know about his first number-one song.


    On the day that “Swear It Again” reached number one, Simon called home to share
    the news. When Simon reached his mother in England, he knew something wasn’t right,
    but he was so happy to tell her about his latest success that he kept on talking.
    Simon’s mother called him back shortly after they got off the phone and told Simon
    that his father Eric had died of a heart attack. Simon was devastated by the terrible
    news.


    Years later, Simon spoke with talk show host Piers Morgan about hearing the news
    of his father’s death. Choking back tears Simons said,


    It wasn’t, wasn’t good. But you’ve just got to deal with it, you know, and I went
    back and realized that your first responsibility is that you’ve got to look after
    your mum. It was a horrible, horrible, horrible time, like I said. You believe
    everyone is going to live for ever and they don’t. And all the stuff you think
    you care about, the hit records and stuff like that, it’s just meaningless.’


    ![Image](images/00012.jpeg)


    *Westlife became a major pop act in Britain right around the time that Simon’s
    father passed away.*'
