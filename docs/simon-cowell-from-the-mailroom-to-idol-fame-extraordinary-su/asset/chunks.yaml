    ## INTRODUCTION


    Finding a great job without a college degree is hard to do—but it’s possible.
    In fact, more and more, going to college doesn’t necessarily guarantee you a job.
    In the past few years, only one in four college graduates find jobs in their field.
    And, according to the `U.S. Bureau of Labor Statistics`, eight out of the ten
    fastest- growing jobs don’t require college degrees.


    But that doesn’t mean these jobs are easy to get. You’ll need to be willing to
    work hard. And you’ll also need something else. The people who build a successful
    career without college are all passionate about their work. They’re excited about
    it. They’re committed to getting better and better at what they do. They don’t
    just want to make money. They want to make money doing something they truly love.


    So a good place for you to start is to make a list of the things you find really
    interesting. What excites you? What do you love doing? Is there any way you could
    turn that into a job?


    Now talk to people who already have jobs in that field. How did they get where
    they are today? Did they go to college—or did they find success through some other
    route? Do they know anyone else you can talk to? Talk to as many people as you
    can to get as many perspectives as possible.


    According to the `U.S. Department of Labor`, two out of every three jobs require
    on-the-job training. So your next step might be a college degree. Be willing to
    learn while you way up from the bottom. Simon Cowell started out in mailroom.
    Jim Skinner, who ended up McDonald’s, started out flipping burgers. World-famous
    Rachael Ray worked at candy counter. Simon Cowell started out in mailroom. Ask
    yourself: Do I have a dream? Am I willing to work hard to make it true? The answers
    to those questions are important!


    ![Image](images/00003.jpeg)


    ## CHAPTER 1: EARLY LIFE


    ### Words to Know


    `reality television`: reality television is programming based on real people’s
    lives or competitions that involve real people, rather than actors. reality television
    shows don’t use scripts.

    `record label`: a record label is a company that finds new artists, signs a contract
    with them to sell their, and then gets the word out about the artist.

    `borough`: a borough is a smaller part of a city. Often, large cities will be
    made up of several boroughs. New York City, for instance, has five boroughs.

    `song charts`: song charts record which songs are selling the best, ranking them
    by their sales.


    On Monday, January 11,2010, Simon Cowell shocked TV audiences by announcing that
    he would leave his job as judge on `American Idol`. The `reality television` show
    had been a gigantic success in the United States since it first aired in 2002,
    when it introduced American viewers to the sharp-tongued Simon. Based on the British
    show `Pop Idol`, on which Simon was also a judge, `American Idol` had made Simon
    Cowell an international star, mainly for his harsh criticism of the singing competition’s
    contestants.


    Simon had helped make the show hit. “I want to leave Idol this year bigger and
    better than it was in the past,” he told the Television Critics Association. Simon
    added that he was “very proud of what the show has achieved.” And he had right
    to be proud; `American Idol` had become one of the most popular shows on television
    in the time Simon was a judge on the show.


    Simon wasn’t leaving `American Idol` for nothing, however. He planned to start
    an American version of `The X Factor`, another British reality television competition
    on which he was a judge. “[I] didn’t think it was right to do two shows in America
    at the same time, so [I] decided to leave one and start another,” he said. Simon
    was ready to get to work on something new after being on `American Idol` for almost
    ten years. “I’m thrilled that we have put a date on the launch of the U.S. version
    of `The X Factor`, and delighted to be continuing to work with Fox,” Simon said.
    “We have a fantastic relationship, a great team and are all very excited about
    this.”

