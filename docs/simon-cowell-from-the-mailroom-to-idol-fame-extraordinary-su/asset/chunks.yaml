- fmt: '

    After several different jobs that didn’t last long, Simon’s father was able to
    get him a job at EMI Music Publishing, the company where Mr. Cowell worked. Simon
    worked in the mailroom at EMI; his job was to make sure the mail that came into
    the company went to the right people.


    ![Image](images/00008.jpeg)


    In his book *I Don’t Mean to Be Rude, But...*, Simon writes about his life growing
    up and moving into the music business.


    Working at EMI was Simon’s first experience in the music industry, although he
    was far from recording songs or finding new artists, far from anything that really
    looked like the business of selling music. Soon, though, Simon would be working
    his way up from the bottom, and it wouldn’t be long before he’d reach the top
    of the music business.


    ![Image](images/00009.jpeg)


    ## Chapter 2: Rise to Success


    ### Words to Know


    - **repertoire**: An artist’s repertoire is the set of songs he has recorded and
    performed.

    - **producer**: A producer works with an artist to record songs.

    - **signing**: When a record label signs an artist, the company agrees to sell
    the artist’s music and the artist agrees to only make music with that company.

    - **single**: A single is a song put out by an artist that is often the first
    song from an album. The single is made to help promote the artist and her album.


    For many high school dropouts, finding work can be very tough, if not impossible.
    Simon was lucky enough to have his father get him a job at EMI Records, one of
    the biggest record labels in the world. He started with a very small job for sure,
    but it was just the chance Simon needed to break into the music business.


    ### Life in the Music Business


    Working in the mailroom was a good job for Simon—particularly because he had no
    real work experience, no high school diploma, and had never been to college—but
    it wasn’t where he wanted to stay. “From my first day on the job I began planning
    and scheming my way to the top of the business,” he writes in his biography.


    The job didn’t last long for Simon, and he ended up leaving the mailroom. One
    year later, though, he returned to EMI Music Publishing, thanks again to help
    from his father. Simon became an assistant to an A&R (artists and repertoire)
    executive at the company. A&R involves finding new artists for a record company.
    Simon spent some time as an assistant and worked on finding new talent for EMI
    as well, before starting work as a producer.


    As a producer, Simon met Pete Waterman, who was part of famed British production
    team, Stock Aitken Waterman. Simon learned how to record music with Pete, as well
    as what makes a great song and great artist.


    By 1985, Simon was ready to strike out on his own. He left EMI to start his own
    music publishing company with his boss from EMI, Ellis Rich. They called the company
    E&S Music. The company had little success, and Simon wrote in his autobiography
    that it was a mistake to start the company. Simon left the new company soon after
    it had started, but he wasn’t finished.


    Soon after leaving E&S, Simon met Iain Burton, and the two started a record label
    called Fanfare Records. Simon came to Fanfare to do A&R, just as he had for a
    little while at EMI. He sought out new artists for the company and ended up signing
    Sinitta, a female singer who had worked with a dance group called Hot Gossip.
    The group had worked with Burton and Arlene Phillips, a dancer whose career Burton
    managed, before working with Fanfare to put out the company’s first song. Sinitta
    was just the artist that Fanfare needed in its early days, and just the kind of
    artist who would help Simon’s career as an A&R executive.


    Simon knew he could make the artist a star and help her record hit songs, but
    Burton was nervous about the new company. Soon, he told Simon that he was going
    to back out of Fanfare. Simon convinced Burton to give him a few thousand dollars
    to put out Sinitta’s first single, “So Macho.” When the song was released, it
    was a hit, reaching number two on the song charts in Britain. “So Macho” helped
    keep Fanfare in business, and Sinitta went on to have a couple more hits on the
    label.


    ![Image](images/00010.jpeg)


    Choreographer Arlene Phillips helped to form Hot Gossip and worked with the group
    and Burton for years.


    ![Image](images/00011.jpeg)


    Simon found success with British pop singer Sinitta. The two also dated.


    Despite his early successes at Fanfare Records, Simon left the company in 1989.
    Without a job, he had to move back in with his parents. Simon wouldn’t let his
    career in music end, though, and he found work with record label BMG, one of the
    largest in the world. Simon began putting together a label that would work with
    BMG to put out music from new artists. Once again, Simon was on the hunt for new
    talent, playing the role of A&R executive that he had at EMI and Fanfare. He called
    his new label S Records.


    Simon began signing new artists and groups to his label, including singing groups
    5ive and Westlife. Simon also made the smart decision to put out songs based on
    already-popular television shows, and entertainment brands. S Records, songs based
    on Mighty Morphin’ Power Rangers, Teletubbies, and World Wrestling Entertainment
    (WWE) sold well.


    ### Success and Tragedy


    In 1999, Simon experienced both one of the greatest achievements of his career
    to date and the loss of the man who’d helped him start that, his father.


    Simon had been working to make his newly signed group Westlife a success, and
    by early 1999, his work was finally paying off. The group’s first single “Swear
    It Again” had been released in March and quickly reached number one on the British
    charts. Simon couldn’t have been more excited about his group’s success. “Swear
    It Again” wasn’t just Westlife’s first number-one song, it was also Simon’s first
    as record company executive. He’d believed in the group’s potential from the time
    he signed them to S Records, knowing that they could be big. Simon’s father felt
    the same way about Westlife’s chance to succeed in music, so Simon wanted to make
    sure he let his parents know about his first number-one song.


    On the day “Swear It Again” reached number one, Simon called home to share the
    news. When Simon reached his mother in England, he knew something wasn’t right,
    but he was so happy to tell her about his latest success that he kept on talking.
    Simon’s mother called him back shortly after they got off the phone and told Simon
    that his father Eric had died of a heart attack. Simon was devastated by the terrible
    news.


    Years later, Simon spoke with talk show host Piers Morgan about hearing the news
    of his father’s death. Choking back tears Simon said:


    “It wasn’t, wasn’t good. But you’ve just got to deal with it, you know, and I
    went back and realized that your first responsibility is that you’ve got to look
    after your mum. It was a horrible, horrible, horrible time, like I said. You believe
    everyone is going to live for ever and they don’t. And all the stuff you think
    you care about, the hit records and stuff like that, it’s just meaningless.’


    ![Image](images/00012.jpeg)


    Westlife became a major pop act in Britain right around the time that Simon’s
    father passed away.

