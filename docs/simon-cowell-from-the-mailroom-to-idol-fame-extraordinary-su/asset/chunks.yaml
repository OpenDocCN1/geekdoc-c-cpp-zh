    In fact, more and more, going to college doesn’t necessarily guarantee you a job.
    In the past few years, only one in four college graduates find jobs in their field.
    And, according to the U.S. Bureau of Labor Statistics, eight out of the ten fastest-
    growing jobs don’t require college degrees.


    But that doesn’t mean these jobs are easy to get. You’ll need to be willing to
    work hard. And you’ll also need something else. The people who build a successful
    career without college are all passionate about their work. They’re excited about
    it. They’re committed to getting better and better at what they do. They don’t
    just want to make money. They want to make money doing something they truly love.


