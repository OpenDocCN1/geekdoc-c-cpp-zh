    Now talk to people who already have jobs in that field. How did they get where
    they are today? Did they go to college—or did they find success through some other
    route? Do they know anyone else you can talk to? Talk to as many people as you
    can to get as many perspectives as possible.


    According to the U.S. Department of Labor, two out of every three jobs require
    on-the-job training rather than a college degree. So your next step might be to
    find an entry-level position in the field that interests you. Don’t expect to
    start at the top. Be willing to learn while you work your way up from the bottom.


