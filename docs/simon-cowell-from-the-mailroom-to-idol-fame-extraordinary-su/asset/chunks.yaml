  trans: "\n凯莉·安德伍（Carrie Underwood）赢得了《美国偶像秀》第四季，从那以后她成为了乡村音乐界最大的明星之一。她的首张专辑《Some\
    \ Hearts》在乡村专辑排行榜上首空冠军，仅在一周内就售出了超过 30 万张。在她夺冠后的一个季节甚至回到了《美国偶像秀》，演唱了她的热门歌曲《耶稣掌舵》（Jesus\
    \ Take the Wheel）。《Some Hearts》销量已突破百万张，为凯莉赢得了多首热门单曲和许多奖项，包括 `Billboard` 音乐奖的年度专辑。凯莉的下一张专辑——2007\
    \ 年的《Carnival Ride》延续了她的成功，让这位歌手赢得了她的首张冠军专辑，单周销量超过 50 万张。到目前为止，《Carnival Ride》在美国销售的销量已超过\
    \ 300 万张。凯莉的第三张专辑《Play On》也大获成功，像《Carnival Ride》一样在排行榜上首空冠军。在不到两年的时间内，这张专辑的销量就接近\
    \ 200 万张。\n\n克里斯·道特里（Chris Daughtry）没有赢得《美国偶像秀》，但在离开节目后，他仍然成为了摇滚乐最成功的歌手之一。凭借他的乐队\
    \ `Daughtry`，克里斯售出了数百万张专辑，并拥有许多热门歌曲。该乐队的首张专辑《Daughtry》在第一周就售出了 30 万张。这张专辑还催生了《It’s\
    \ Not Over》、《Home》、《Over You》和《What About Now》等热门单曲。《Daughtry》在美国的销量已超过 400 万张。该团的第二张专辑名为《Leave\
    \ This Town》，于 2009 年发行，销量已突破百万张。\n\n尽管凯莉、凯莉和克里斯是最成功的《美国偶像秀》选手，但鲁本·斯塔德（Rubben\
    \ Studdard）、克莱·艾肯（Clay Aiken）、Fantasia Barrino、Jordin Sparks、David·库（David Cook）、David·阿丘莱塔（David\
    \ Archuleta）、克里斯·艾伦（Kris Allen）和亚当·兰伯特（Adam Lambert）也都拥有精彩的音乐生涯。《美国偶像秀》让他们成为了明星，但他们在节目结束后都开辟了自己的道路，努力工作让那些在节目中投票给他们的人感到自豪。\n\
    \n## Syco 音乐与电视\n\n2002 年，西蒙成立了一家可以同时从事音乐和电视业务的新公司。他将这家公司命名为 `Syco`。作为西蒙新公司的唱片部门，`Syco\
    \ Music` 在 `BMG` 下，西蒙曾在 `S Records` 与其合作。西蒙在他的新厂牌获得的首批大成功之一是 2004 年的歌唱组合 `Il Divo`。\n\
    \n![Image](img/00016.jpeg)\n\n*在西蒙的帮助下，Il Divo 巡遍世界并售出了数百万唱片。*\n\n2001 年，西蒙产生了组建一个国际古典歌手组合的想法，因为他感觉到人们对古典音乐和歌唱变得越来越感兴趣。他开始在全球范围内寻找歌手加入组合，认为拥有来自世界不同国家的歌手将使组合具有最广泛的吸引力。西蒙对歌手的寻找在\
    \ 2004 年结束，当时他找到了组合的第四也是最后一位成员。`Il Divo` 的成员包括西班牙人卡洛斯·马林（Carlos Marín）、美国人大卫·米勒（David\
    \ Miller）、瑞士人厄斯·比希勒（Urs Bühler），以及法国流行歌手塞巴斯蒂·伊尚巴德（Sébastien Izambard）。该组合在 0004\
    \ 年录制了他们的首张专辑并在全球范围内推广。这张名为《Il Divo》的专辑获得了巨大成功，位列英国排行榜冠军。Il Divo 在《奥普拉·温妮瑞秀》上表演了他们的歌曲《Regresa\
    \ a Mi》，帮助他们在美国更加受欢迎。在全球范围内`Il Divo` 的首张专辑销量数百万，成为西蒙 `Syco Music` 最早的成功案例之一。\n\
    \n![Image](img/00017.jpeg)\n\n*西蒙有很多批评者，但他反击时的话语和攻击时一样犀利！*\n\n## 第四章：拓展领域\n\n\
    ### 重点词汇\n\n-   **mentor（导师）**：导师是指提供建议并帮助引导他人的人，通常是某个特定领域中较年轻或经验较少的人。\n\n随着《美国偶像秀》达到了其他节目难以企及的高度，西蒙准备好开始投入其他项目。他意识到将音乐与电视相结合是一个获胜策略，因此他着手创作了其他类似于\
    \ `Idol` 的电视节目。`Idol` 的竞争元素使该节目成为必看事件，观众收视是为了看他们喜爱的人争夺冠军位置。此外，`Idol` 让观众看到普通人展示才华并讲述自己的故事。粉丝喜欢与特定选手产生共鸣并了解更多关于他的生活。西蒙明白这是\
    \ `Idol` 在全球成功的关键之处，因此在他旗下的 `Syco Television` 公司准备了电视节目，继续展示普通人的才华。\n\n### X 因素（The\
    \ X-Factor）\n\n2004 年，在英国播出《Pop Idol》的电视频道邀请西蒙的公司 `Syco Television` 创作一个新的歌唱比赛节目。西蒙创作了一个名为\
    \ `The X-Factor`（X 因素）的节目。该节目的格式与 `Idol` 系列非常相似，即有三位评委观看从公开海选中选出的歌手相互竞争以争夺冠军位置。与\
    \ `Idol` 不同，每位进入决赛的歌手都会被分配一位评委作为他们的 `mentor`（导师），随后评委将帮助改进表演。每个赛季的冠军都会获得唱片合约，通常与西蒙的\
    \ `Syco Music` 签约。西蒙是英国版本的评委，就像他在 `Pop` 和《美国偶像秀》中一样。\n\n正如 `Idol` 一样，世界各国也采用了\
    \ `X-Factor`。澳大利亚、捷克、智利、意大利、西班牙、波兰、尼日利亚都有 `X-Factor` 节目。\n\n Talent 秀\n\n2005\
    \ 年，西蒙创作了另一个名为 `Got Talent` 的才艺节目。该节目类似于他之前的节目 `X-Factor`，但将歌唱比赛扩展到了各种才艺。无论选手擅长什么都可以带到\
    \ `Got Talent`，无论是唱歌、舞蹈、讲笑话还是其他。最初，英国喜剧演员兼口秀主持人保罗·奥格瑞（Paul O’Grady）准备主演该节目的英国版，节目名为《Paul\
    \ O’Grady’s Got Talent》。然而，由于保罗在那年离开了电视台，`Got Talent` 的英国版被推迟了。相反，西蒙在美国推出了该节目，命名为\
    \ `America’s Got Talent`（美国达人秀）。\n"
