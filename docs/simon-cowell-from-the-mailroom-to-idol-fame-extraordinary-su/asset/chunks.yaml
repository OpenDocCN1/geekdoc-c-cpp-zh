    ![Image](images/00019.jpeg)


    *Singer Leona Lewis was the first winner of the British version of the X-Factor.
    Today, she’s a star around the world.*


    ## New Stars Are Born Thanks to Simon


    Just as American Idol created celebrities out of its contestants, Simon’s other
    shows allowed regular people who just needed a chance to become stars.


    In 2006, singer Leona Lewis tried out for the third season of the British version
    of `The X-Factor`. Simon mentored Leona during her time on the show and she ended
    up winning the competition that year. Simon signed her to his record label, `Syco
    Music`, and she began to work on her first recordings. Her first single sold more
    than half a million copies and stayed at number one on the British song charts
    for a month.


    In 2008, the world was taken by storm by a Scottish singer in her late forties
    appearing on `Britain’s Got Talent`. Susan Boyle sang “I Dreamed a Dream” for
    the judges on the show and blew them away. The YouTube video of her performance
    was seen by tens of millions of people around the world, and she became an instant
    singing star. Simon gave her a contract with `Syco Music` and her first album,
    `The Gift`, went on to sell more than 300,000 copies in a single week.


    ## Other New Shows


    The `Got Talent` and `X-Factor` series aren’t the only shows Simon was working
    on after he’d become famous for being a judge on `Pop` and `American Idol`. He
    also worked to create and produce several others, continuing to mix music and
    television, as well as bringing regular people in front of a panel of judges for
    a chance to impress the world with their talent.


    ![Image](images/00020.jpeg)


    *X-Factor became a success in the United States in the same way Pop Idol succeeded
    as American Idol.*


    In 2006, Simon produced a show called `American Inventor`, which allowed inventors
    from across the country to show their creation to a panel of judges who would
    decide on the best, most useful inventions. The judges were business people and
    inventors, hoping to find the next big thing among the inventions they saw on
    the show. Businessman Peter Jones created `American Inventor`, based on a Japanese
    show that allowed inventors to pitch their creations to successful business people.


    Simon created a show called `Celebrity Duets` in 2006 as well. The show brought
    together pairs of celebrities (one singer and one nonsinger) who would sing songs
    for a panel of judges, each week one contestant being voted off the show. Comedian
    Wayne Brady hosted the show, which, like `American Idol`, aired on Fox.


    Simon seems to have a knack for creating shows that people want to watch and signing
    artists to whom people want to listen. No matter what he works on, he finds a
    way to make it successful. By combining television and music, Simon has found
    a winning formula for success and stardom. He’s created new hit television shows
    and those shows had helped launch the careers of new music stars.


    ![Image](images/00021.jpeg)


    ![Image](images/00022.jpeg)


    ## CHAPTER 5](#part0004.html_ch05)


    ## SIMON TODAY](#part0004.html_ch05)


    ### Words to Know


    **Nielsen ratings**: Nielsen ratings are a way of measuring how many people watch
    any given television show. Nielsen Media Research created the ratings system.


    **tribute**: A tribute is a way of honoring someone important.


    During his time on `American Idol`, Simon had helped make the show a success and
    become a star in the process. He worked to create other shows, as well, having
    as much success in television as he’d had in the music business, if not more.
    The shows he created were very popular with audiences around the world and helped
    to cement Simon’s status as an expert in the entertainment business. But by 2010,
    it was time for Simon to leave the show that had made him a celebrity and brought
    him so much success in the United States.


    ### Changes at American Idol


    In January of 2010, Simon announced that the ninth season of `American Idol` would
    be his last on the show. He said he was ready to move on and start the American
    version of the show he created in Britain, `The X-Factor`. The news came as a
    surprise to many `Idol` fans who had watched the show for years with Simon as
    one of the main attractions. For some viewers, it was hard to imagine `American
    Idol` without Simon Cowell as one of the show’s judges. A year before, singer
    Paula Abdul had left the show, being replaced by comedian and talk-show host Ellen
    Degeneres. The show had also added music executive and songwriter Kara DioGuardi,
    bringing the number of judges to four. But with Simon leaving the show, the show
    needed to make some major changes to keep fans interested. The show’s first season
    without Simon would be its tenth and by that time, fans were looking for something
    new from the popular show.


    In order to keep fans happy, the show brought on new judges. Randy Jackson, a
    favorite of `American Idol` fans, stayed on for the tenth season, but Ellen and
    Kara left the show. Replacing Simon, Ellen, and Kara were singers Jennifer Lopez
    and Steven Tyler, lead singer of the rock group Aerosmith. The show was back to
    having just three judges.


    Despite Simon leaving the show and the many changes to the judging lineup, `American
    Idol` remains one of the most successful television shows of all time. The show
    has had more viewers than any other in American history according the `[Nielsen
    ratings](#part0010.html_Nielsenratings)`. In addition, the show is the only one
    to have remained the most viewed show in its timeslot for six straight years.
    Comedy shows `All in the Family` and `The Cosby Show` were each in the top spot
    for five years straight, but `American Idol` topped them both, a feat no other
    show has achieved.


    ### New Opportunities for Simon


    Before he left `American Idol`, Simon worked on bringing his British show `The
    X-Factor` to the United States. When he announced that he was leaving `Idol`,
    he also announced the beginning of his new show, one that his company `Syco` had
    helped create in Britain years before. The American version of the show debuted
    in September of 2011 on the Fox network, the company that had brought `Idol` to
    American television. The American version of `X-Factor` became a huge hit, another
    success in a long line of them for Simon. He’d planned to be working on both the
    American and British versions of `X-Factor`. In early 2011, however, reporters
    confirmed that Simon wouldn’t stay on as a weekly judge at the British version
    of the show, instead focusing on the American version while working on the British
    version mostly from behind the scenes. At the end of 2010, Simon also signed on
    to continue his work as a judge on `Britain’s Got Talent` until around 2013.


    While he worked on new projects on television, Simon was also making changes in
    his personal life. In February 2010, Simon asked his girlfriend Mezghany to marry
    him. She said yes, and the two were engaged to be married. Mezghan was a makeup
    artist on the set of `American Idol` when the two met and started dating.


    ### Giving Back


    Many people may think that Simon is rude and even mean, and he’ll be the first
    to admit that he can—but he’s also concerned with making sure that he uses his
    success to help other people.


    Simon’s been involved in a number of causes for charity. He’s worked with `PETA`
    (People for the Ethical Treatment of Animals) to create advertisements warning
    against leaving pets in a hot car and speaking against wearing fur. One ad has
    a picture of Simon holding a dog saying, “If you wouldn’t wear your dog, please
    don’t wear any fur.” Simon’s also been involved in charities committed to children’s
    health and making sure sick kids are cared for in the best possible way. He’s
    known for inviting children from the `Association of Children’s Hospices` backstage
    when he’s working on `The X-Factor`.

