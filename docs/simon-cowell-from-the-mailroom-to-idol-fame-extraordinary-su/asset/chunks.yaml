- fmt: '

    Carrie Underwood won the fourth season of `American Idol`, and she has since become
    one of country music’s biggest stars. Her first album, `Some Hearts`, debuted
    at number one on the country album charts, selling more than 300,000 copies in
    just one week. She even returned to `American Idol` the season after she won to
    sing her hit song “Jesus Take the Wheel.” `Some Hearts` has sold more than a million
    copies, earning Carrie several hit singles and many awards, including Album of
    the Year at the `Billboard` Music Awards. Carrie’s next album, 2007’s `Carnival
    Ride`, continued her success, giving the singer her first number- one album with
    sales of more than half a million copies in one week. So far, `Carnival Ride`
    has sold more than three million copies in the United States. `Play On`, Carrie’s
    third album, was a massive hit too, debuting at number one on the album charts
    just as `Carnival Ride` had. In less than two years, the album sold just fewer
    than two million copies.


    Chris Daughtry didn’t win `American Idol`, but after leaving the show, he still
    became one of rock music’s most successful singers. With his band `Daughtry`,
    Chris has sold millions of albums and had many hit songs. The band’s first album,
    `Daughtry`, sold 300,000 copies in its first week. The album also gave rise to
    hit singles like “It’s Not Over,” “Home,” “Over You,” and “What About Now.” `Daughtry`
    has sold over four million copies in the United States. The group’s second album,
    called `Leave This Town`, was released in 2009 and has sold more than a million
    copies.


    Though Kelly, Carrie, and Chris have been the most successful `American Idol`
    contestants, Rubben Studdard, Clay Aiken, Fantasia Barrino, Jordin Sparks, David
    Cook, David Archuleta, Kris Allen, and Adam Lambert have all had amazing careers
    in music as well. `American Idol` made them stars, but they’ve each made their
    own way after the show, working hard to make proud the people who voted for them
    on the show.


    ## Syco Music and Television


    In 2002, Simon started a new company that would be able to work on both music
    and television. He called the new company `Syco`. `Syco Music`, the record label
    part of Simon’s new company would work under `BMG`, with which Simon had worked
    on `S Records`. One of the first big successes Simon had with his new label came
    in 2004 with the singing group `Il Divo`.


    ![Image](images/00016.jpeg)


    *Il Divo has toured the world and sold millions of records with Simon’s help.*


    In 2001, Simon had the idea to put together an international group of classical
    singers, because he sensed that people were becoming more and more interested
    in classical music and singing. He began to look around the world for singers
    to become part of the group, thinking that having singers from different countries
    around the world would give the group the widest possible appeal. Simon’s search
    for singers ended in 2004 when he found the fourth and final member of the group.
    `Il Divo` was Spanish `Carlos Marín`, American `David Miller`, and Swiss `Urs
    Bühler`, as well as French pop music singer `Sébastien Izambard`. The group recorded
    their first album in 2004 and began to promote the album around the world. The
    album, called `Il Divo`, was a massive hit, reaching number one on the album charts
    in Britain. `Il Divo` performed their song “Regresa a Mi” on `The Oprah Winfrey
    Show`, helping them to become even more popular in the United States. Around the
    world, `Il Divo` sold millions of copies of their first album and became one of
    the earliest successes on Simon’s `Syco Music`.


    ![Image](images/00017.jpeg)


    *Simon has many critics, but he can take tough words as well as he can dish them
    out!*


    ## Chapter 4: Branching Out


    ### Words to Know


    - **mentor**: A mentor is someone who gives advice and helps guide another person,
    often someone younger or less experienced in a particular field.


    With `American Idol` reaching heights that few other shows could ever hope to,
    Simon was ready to begin work on other projects. He realized that mixing music
    and television was a winning strategy, so he set to work to create other television
    shows that worked like `Idol`. The competition element of `Idol` had made the
    show a must-watch event, with viewers tuning in to see their favorites compete
    for the top spot. In addition, `Idol` allowed viewers to see everyday people show
    their talent and tell their stories. Fans loved being able to relate to a particular
    contestant and learn more about his or her life. Simon understood that this was
    a key part of why `Idol` was successful around the world, and he readied television
    shows under his `Syco Television` company that would continue to show the talents
    of regular people.


    ### The X-Factor


    In 2004, the television channel that aired `Pop Idol` in Britain asked Simon’s
    company `Syco Television` to create a new singing competition show. Simon created
    a show called `The X-Factor`. The show’s format is very similar to the `Idol`
    series, in that there are three judges who watch singers chosen from public auditions
    compete against each other for the top spot. Unlike `Idol`, each singer who makes
    it to the finals is assigned one of the judges to be his or her `mentor`; the
    judge then helps to improve the performance. The winner of each season is given
    a record deal, often with Simon’s `Syco Music`. Simon was a judge on the British
    version, just as he had on `Pop` and `American Idol`.


    Like `Idol`, countries around the world have adopted `The X-Factor`. There have
    been `X-Factor` shows in Australia, the Czech Republic, Chile, Italy, Spain, Poland,
    Nigeria.


    ### Got Talent


    In 2005, Simon created another talent competition show called `Got Talent`. The
    show would be similar to `X-Factor`, Simon’s previous show, but would branch out
    from a singing competition to allow any and all talents. Whatever the contestants
    were good at, they could bring to `Got Talent`, be it singing, dancing, telling
    jokes, or anything else. At first, the British comedian and talk show host `Paul
    O’Grady` was getting ready to star in the British version of the show, which would
    be called `Paul O’Grady’s Got Talent`. Due to Paul’s leaving the show’s network
    that year, however, the British version of `Got Talent` was postponed. Instead,
    Simon worked on starting the show in the United States under the name `America’s
    Got Talent`.


    ![Image](images/00018.jpeg)


    *With X-Factor, Simon continued his streak of creating successful television shows
    packed with celebrities and popular music.*


    `America’s Got Talent` was first aired in June of 2006. The show had three judges,
    just like `American Idol`. As performers displayed their talents, each judge had
    the power to either allow them to finish their act or give them an “X”, voting
    to stop the act. If all three judges voted to stop the performance, the contestant
    had to stop act. At the end of each performance, the judges gave comments, saying
    what they did or didn’t like about the act. `America’s Got Talent’s` judges included
    British talk show host `Piers Morgan`, actor `David Hasselhoff`, wife of Ozzy
    Osbourne and record executive `Sharon Osbourne`, and, most recently, comedian
    and game show host `Howie Mandell`. The show has been a success in the United
    States, and it has been on the air for years. After the American version of `Got
    Talent` became a hit, Simon was able to take the show back to England, starting
    `Britain’s Got Talent` in 2007.

