    西蒙（Simon）失去了他生命中重要的人之一。他的父亲一直陪伴在他身边，在他找不到其他工作时帮助他找工作，在他失去 Fanfare 公司的工作后帮助他重新开始，并对他所做的一切都充满信任。西蒙在同一天达到了职业生涯的巅峰，也经历了个人生活的低谷。在接后的几年里，西蒙在音乐界继续取得成功，特别是与西西家族（Westlife）合作，但学习如何应对父亲的去世需要多年时间。


    ## 从《偶像工厂》开始


    2001 年，西蒙开始制作一个名为 `Pop Idol` 的新电视节目。该节目由一位名叫西蒙·富勒（Simon Fuller）的人创立，是一场唱歌比赛，获胜者由观众通过短信、电话或节目网站的投票来选出。节目每季的获胜者将获得一份唱片合约，希望这能让他们开启成功的音乐生涯。西蒙将担任节目的三位评委之一，对歌手的表演进行评论，并帮助他们在节目播出的期间每周都变得越来越好。`Pop
    Idol` 第一集于 2001 年 10 月 5 日在英国首播。该节目大获成功，在英国电视观众中变得极受欢迎。


    当第一季结束后，排名前名的参赛者（威尔·杨 Will Young 和盖瑞·盖茨 Gareth Gates）与西蒙的 S Records 公司签了合同。这两个人在英国都取得了成功，获得过多首冠军歌曲。威尔·杨在
    S Records 的第一首歌在发行的第一天就售出了超过 40 万张，第一周销量超过了一百万张。


    在 `Pop Idol` 英国成功后，该节目扩展到了世界各国，并为每个国家专门创建了一个版本。节目保持了相同的格式：三位评委、观众投票以及同样的竞争风格。`Idol`
    的本地版本在澳大利亚、希腊、马来西亚、加拿大、印度、新西兰、挪威、亚美尼亚、越南、法国、冰岛以及全球许多许多国家都流行了起来。


    2002 年，美国版的 `Idol` 首次播出。该节目被简单地称为 `American Idol`（美国偶像），在福克斯频道播出。西蒙因在英国版中的受欢迎程度被聘请为这个新的美国节目的评委。他以犀利、刻薄的评论而闻名；在节目之后，他就成为了英国的名星。美国节目还有唱片制作人兼执行人兰迪·杰克逊（Randy
    Jackson）和歌手宝拉·阿布杜尔（Paula Abdul）担任另外两个评委席。万事俱备后，`American Idol` 注将在它的新家取得巨大成功。


    ![Image](img/00013.jpeg)


    ## 第三章：IDOL 走向成功


    ### 重点词汇


    - **album（专辑）**：专辑是艺术家歌曲打包在一起的集合。

    - **timeslot（时段）**：在电视节目中，节目的时段是指该节目播出的时间。处于同一时段的节目会争夺观众。


    `American Idol` 在进入美国之前已经在英国取得了成功。`Pop Idol` 在英国已成为一种现象，并开启了节目中两名决赛选手的歌艺生涯。到 2002
    年中，该节目已经开始走向世界，而美国只是许多制作中的节目版本之一。随着西蒙加入美国版的评委团，该节目具备了许多让英国版如此受欢迎的元素，但这并不是保证之能成功的。此前很少有像这样的节目，即观众投票选出获胜者的电视才艺竞赛。但任何关于
    `Idol` 是否会成功的疑虑，在节目 2002 年夏天在美首播后很快就被抛之脑后。


    ## 一大热门节目


    `American Idol` 于 2002 年 6 月 11 日首次播出时，只有少于 1000 万人收视了这场唱歌比赛。在第一季的最后一集中，有 2300
    万人看了该节目。在歌手凯莉·克拉克森（Kelly Clarkson）赢得第一季冠军后，该节目在第二季变得更加受欢迎，在第二期间，凯莉凭借她的第一张专辑 `Thankful`
    在 `album` 榜单上首秀登顶。通过让获胜者继续售卖专辑并开启成功的歌手生涯，该节目证明了这种模式的有效性，让参赛者们成为了明星。第二季的首播有 2600
    万观众。3800 万人看了该季的决赛集，鲁本·斯塔达德（Ruben Studdard）在集集中被宣布为获胜者。该节目的排名从其 `timeslot` 的第
    25 到 30 名跃升到了第三名。在接下来的几年里，该节目一直位列第一或第二，观众人数保持在 3000 万或以上。从第三季开始，`American Idol`
    成为 18 至 49 岁人群中收视率第一的节目。


    在此期间，西蒙因对参赛者的严厉批评而闻名。尽管一些人认为他对节目中的歌手很没礼貌，但许多人喜欢他不告诉他们他们想听的话。西蒙成为了许多 `American
    Idol` 粉丝特意收看节目的评委，等待着他口中接下来会说出什么。他会告诉那些他认为在音乐界无法生存的歌手停止唱歌，去寻找其他他们擅长的事。他会告诉人们他们的声音非常糟糕。当一位参赛者说她会辞职来参加节目选秀时，西蒙甚至开玩笑说她永远不会成功的。西蒙直言了见，他的这种直率使他在
    `Pop Idol` 和 `American Idol` 中都成了一巨星。


    ![Image](img/00014.jpeg)


    *美国偶像主持人赛克斯特（Seacrest）、评委兰迪·杰克逊和西蒙并不总是意见一致，但得益于这个节目，他们分享了许多成功。*


    西蒙在两个节目中的评论经常以这样开头：“我不是没礼貌，但是……”然后对节目选手的歌声、外表或表演进行严厉批评。这个短语与西蒙联系得如此紧密，以他将其作为 2003
    年自传《I Don’t Mean to Be Rude, But. : Backstage Gossip from American Idol & the
    Secrets That Can Make You a Star》的标题。


    ## 创造明星


    `American Idol` 取得了巨大的成功，让西蒙在美国成为了明星，但也为节目参赛者创造了明星。许多 `American Idol` 的获胜者后来在音乐领域取得了成功的职业，其中一些人售出了数百万张专辑并成为了名人。虽然在
    `Idol` 之后有些人比其他人更成功，但许多 `American Idol` 的参赛者利用了节目给他们的机会。


    ![Image](img/00015.jpeg)


    *乡村巨星凯莉·安德伍德（Carrie Underwood）只是来自《美国偶像》的众多歌手之一*


    `Idol` 第一季的冠军凯莉·克拉克森（Kelly Clarkson）一直一直是节目中最成功的参赛者之一。凯莉的第一张专辑 `Thankful` 于 2002
    年发行并取得了巨大的成功。截至目前，这张专辑已售了两百万张。她的第二张专辑 `Breakaway` 巩固了凯莉作为音乐新星的地位。这张专辑在美国售出了超过六百万，并帮助凯莉获得了两个格莱美奖。她的热门单曲“Since
    U Been Gone”曾获得美国 `Billboard` 单榜第二。凯莉第三张专辑 `My December` 在发行的第一周销量仅不足 30 万张。


