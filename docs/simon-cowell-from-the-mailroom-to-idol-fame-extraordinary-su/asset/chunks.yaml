    ![Image](img/00019.jpeg)


    *歌手莉娜·刘易斯（Leona Lewis）是英国版《英国偶像秀》的首位冠军。如今，她已成为全球巨星。*


    ## 西蒙造就的新星


    正如《美国偶像秀》将选秀者培养成明星一样，西蒙的其他节目也让那些只需要一个机会的普通人成为了明星。


    2006 年，歌手莉娜·刘易斯参加了英国版`The X-Factor`第三季的选秀。在参加节目期间，西蒙担任了莉娜的导师，她最终赢得了当年的比赛。西蒙将她签约在自己的唱片公司`Syco
    Music`，她开始制作她的首批录音作品。她的首支单曲销量超过五十万张，并在英国歌曲排行榜上蝉联榜首了一个月。


    2008 年，一位四十多岁的苏格兰歌手在《英国达人秀》（`Britain’s Got Talent`）出现震惊了世界。苏珊·鲍尔（Susan Boyle）在节目中为评委演唱了《我曾梦想一个梦》（I
    Dreamed a Dream），并让他们大为惊叹。她表演的 YouTube 视频被全球数千万人观看，她瞬间成为了一红歌星。西蒙给她签了一份`Syco Music`的合同，她的首张专辑《礼物》（`The
    Gift`）在单周内销量突破了 30 万张。


    ## 其他新节目


    在西蒙因《Pop》和《美国偶像秀》评委而成名后，《达人秀》和《X-Factor》系列并不是他参与的全部。他还致力于创作和制作了其他几个节目，继续将音乐与电视相结合，并将普通人带到评委面前，让他们有机会用才华惊艳世界。


    ![Image](img/00020.jpeg)


    *《X-Factor》在美国的成功，正如《Pop Idol》作为《美国偶像秀》那样成功。*


    2006 年，西蒙制作了一部名为《美国发明家》（`American Inventor`）的节目，节目让来自各地的发明家向评委展示他们的创作，由评委选出最佳、最实用的发明。评委们是商人和发明家，希望从节目中展示的发明中发现下一个大热门。商人彼得·琼斯（Peter
    Jones）根据日本的一档节目创作了《美国发明家》，该节目允许发明家向成功的商人士推销他们的创意。


    西蒙在 2006 年还创作了一部名为《名人对唱》（`Celebrity Duets`）的节目。该节目将成对的名人（一位歌手和一个非歌手）聚集在一起，为评委演唱歌曲，每周有一位参赛者被投票淘汰出节目。喜剧演员韦恩·布拉迪（Wayne
    Brady）主持该节目，该节目与《美国偶像秀》一样，在福克斯频道（Fox）播出。


    西蒙似乎擅长创作人们想看的节目，并与那些人们想听的艺人签约。无论他从事什么工作，他都能找到让其成功的方法。通过结合电视和音乐，西蒙找到了成功和成名的获胜公式。他创作了许多新的热门电视节目，而这些节目帮助开启了许多新晋歌星的职业生涯。


    ![Image](img/00021.jpeg)


    ![Image](img/00022.jpeg)


    ## 第五章](#part0004.html_ch05)


    ## 今天的西蒙](#part0004.html_ch05)


    ### 重点词汇


    **尼尔森收视率 (Nielsen ratings)**：尼尔森收视率衡量观看任何电视节目人数的方法。尼尔森媒体研究创建了这一收视率系统。


    **致敬 (tribute)**：向重要人物致敬的方式。


    在《美国偶像秀》期间，西蒙帮助该节目取得了成功，并在过程中成为了明星。他还致力于创作其他节目，在电视领域取得了与他在音乐业务领域相当的成功，甚至更多。他创作的节目深受全球观众欢迎，并帮助巩固了西蒙作为娱乐行业专家的地位。但到
    2010 年，西蒙是时候离开这档让他成名并在美国带给他如此巨大成功的节目了。


    ### 《美国偶像秀》的变化


    2010 年 1 月，西蒙宣布《美国偶像秀》第九季将是他在该节目的最后一次亮相。他说他已经准备好离开，并开始制作他在英国创作的同类节目——`The X-Factor`的美国版。这个消息让许多多年一直看着西蒙作为主要亮点之一的节目的“偶像”粉丝感到意外。对于某些观众来说，很难想象没有西蒙·考维尔担任评委的《美国偶像秀》。一年前，歌手保拉·阿布尔（Paula
    Abdul）离开了节目，由喜剧演员兼脱口秀主持人艾伦·迪格瑞斯（Ellen Degeneres）取代。节目还增加了音乐高人和词作家卡拉·迪奥加迪（Kara
    DioGuardi），使评委人数变为四位。但随着西蒙的离开，节目需要做出重大调整以保持粉丝的兴趣。没有西蒙的第一季将是第十季，届那时，粉丝们期待这个热门节目能带来新花样。


    为了让粉丝开心，节目请了新评委。《美国偶像秀》粉丝喜欢的兰迪·杰克逊（Randy Jackson）留在了第十季，但艾伦和卡拉离开了节目。取代西蒙、艾伦和卡拉的是歌手詹妮弗·洛佩斯（Jennifer
    Lopez）和摇滚乐队史密斯乐队的主唱斯蒂芬·泰勒（Steven Tyler）。节目回到了只有三位评委。


    尽管西蒙离开了节目且评委阵容发生了多次变化，《美国偶像秀》仍然是历史上最成功的电视节目之一。根据`尼尔森收视率`，该节目的观众人数超过美国历史上任何其他节目。此外，该节目是唯一连续六年保持在该时段收视率第一的节目。


    ### 西蒙的新机遇


    在离开《美国偶像秀》之前，西蒙致力于将他的英国节目`X-Factor`引入美国。当他宣布离开《偶像秀》时，他也宣布了他的新节目的启动，这是他的公司在多年前帮助创作的。该节目的美国版于
    2011 年 9 月在福克斯频道（Fox）首，这是将《偶像秀》引入美国电视的频道。《X-Factor》的美国版大获成功，成为西蒙系列作品的另一个热门。他曾计划同时参与美国和英国版的`X-Factor`。然而，在
    2011 年初，记者证实西蒙将不再担任英国版的每周评委，而是专注于美国版，并仅在幕后参与英国版。2010 年底，西蒙还签约了继续担任《英国达人秀》的评委。


    在他在电视上创作新项目的同时，西蒙的个人生活也发生了变化。2010 年 2 月，西蒙向他的女朋友梅根（Mezghany）求婚。她答应了，两人订了婚。当他们相遇并恋爱时，梅根是《美国偶像秀》片场的一名化妆师。


    ### 回馈社会


    许多人认为西蒙很无礼甚至很刻薄，他自己也是第一个承认这一点的人——但他同时也关注如何确保利用自己的成功来帮助他人。


    西蒙参与了许多慈善事业。他曾与`PETA`（动物伦理对待协会组织）合作创作广告，警告不要将宠物遗留在炎热的车内，并反对穿皮草。其中一张广告有一张西蒙抱着狗的照片，上面写着：“如果你不想穿你的狗，请不要穿任何皮草。”西蒙还参与了致力于儿童健康的慈善机构，确保患儿能得到最好的照顾。众所周知，他在制作`X-Factor`期间会邀请来自儿童医院协会（`Association
    of Children’s Hospices`）的孩子来到后台。


