    2010 年，英国首相戈登·布朗邀请西蒙与著名歌手和音乐家合作录制一首歌，以帮助 2010 年 1 月海地地震的受害者。销售这首歌所所得的资金将捐给致力于重建海地和帮助受灾影响的人的慈善机构。西蒙非常乐意通过这首单曲帮助海地人民。他选择了
    R.E.M. 乐队的歌曲《每个人都在痛苦》（Everybody Hurts），并邀请了名星歌手演唱。来自英国和美国的歌手参与了这首歌的录制，其中包括许多由西蒙帮助开启职业生涯的明星。莉娜·刘易斯（Leona
    Lewis）、苏珊·鲍尔（Susan Boyle）以及流行组合动力（Westlife）的成员都为这首《帮助海地》单曲贡献了歌声。米莉·赛勒斯（Miley Cyrus）、詹姆斯·布伦特（James
    Blunt）、迈克尔·布布布（Michael Buble）、约翰·邦·乔治（Jon Bon Jovi）、玛丽亚·凯莉（Mariah Carey）、罗比·威廉姆斯（Robbie
    Williams）和凯莉·米诺格（Kylie Minogue）也参与了演唱。这首歌大获成功，在一周内销量就近五十万份，并登上了英国流行歌曲榜首。《每个人都在痛苦》的慈善版在世界范围内也广受欢迎，包括爱尔兰、澳大利亚、德国、新西兰、瑞士、西班牙和加拿大等国家。最重要的是，这首歌赚取的资金直接帮助了海地人民。


    ![Image](img/00023.jpeg)


    *在 2010 年海地地震后，西蒙努力组织了慈善单曲《每个人都在痛苦》。*


    ## 依然成功


    今天，西蒙·考维尔（Simon Cowell）比以往任何时候都要成功。在制作了史上最成功的电视节目之一《美国偶像》（American Idol）后，西蒙正在扩展业务，涉涉电视和音乐领域的其他项目。他参与了音乐界一些顶级巨星的创造，并制作了过去十年中一些受欢迎的电视节目。


    西蒙的成功源于他努力工作的动力以及他直言不讳的态度。尽管他的批评性评论可能让他看起来很刺人，甚至不受欢迎，但西蒙明白音乐行业可能和他对选秀节目选手说的话一样严酷。他尖锐的舌头帮助他在电视上走红，成为一个人们“爱又恨”的人物，尽管西蒙的粉丝尊重他的判断，将其视为来自深谙娱乐行业人士的建议。


    西蒙告诉《商业周刊》（Business Week），要在业务上取得成功，“努力工作、保持耐心，并在学习业务时像海绵一样吸收”至关重要。他继续说道：“学会如何接受批评。遵循你的直觉，不要妥协。”西蒙确实证明了自己拥有实现目标所需的动力，特别是在他没有高中毕业就开始职业生涯时。西蒙明智决策源于他在音乐行业的多年经验，以及对娱乐是一门生意的理解。“我一直把音乐业务看作一门生意来做，”他告诉《商业周刊，“无论是在制作电视节目还是签约艺人，你必须用脑子而不是感情——我就是这样经营我的生意的。”


    很少有人能说自己做得像西蒙那样多，或者取得了同等水平的成功。在《每日电报》（Daily Telegraph）2008 年英国文化 100 位最有影响力的人物名单中，西蒙排名第六。2010
    年，《时代》杂志将西蒙选为世界 100 最有影响力的人物之一。《美国达人秀》（America’s Got Talent）主持人尼克·坎（Nick Cannon）在杂志上为西蒙写了一篇致敬信。西蒙在电视上并不总是是最亲和的人，但毫无疑问，他达到了许多人梦以求的高度。


    而且这一切都是他在没有上大学的情况下实现的！


    ![Image](img/00024.jpeg)


    *梅兰妮·阿罗（Melanie Amaro）在 2011 年获得了美国版 X Factor 的第一赛季冠军。*


    ## 你可以期待什么？


    当然，不是每个跳大学的人都会成为名人或百万翁。但对于那些选择不同于大学路线的人，还有其他更普通的工作。以下是只有高中学历的人可以从事的 100 份高薪工作中，你可以预期的收入。（如果你不确定某些工作是什么，可以在互联网上查询以获取更多信息。）请记住，这些是平均工资；初级工作者的收入可能少得多，而拥有多年经验的人可能会多得多。此外，请记住，同一工作的工资在国家不同地区会有所不同。


