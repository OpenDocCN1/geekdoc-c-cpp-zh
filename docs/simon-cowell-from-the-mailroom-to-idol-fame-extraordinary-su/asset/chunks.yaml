  raw: 'Replacing Simon would be a major challenge for *American Idol* and for Fox,
    the company that aired the show. When Simon announced he would be leaving the
    hugely successful show, the chairman of entertainment at Fox, Peter Rice, didn’t
    want to tell reporters who would take Simon’s place on *American Idol*. Talking
    about finding a new judge for the show, Rice said, “We have to take our time on
    that. . . . We have to make sure the chemistry of the judges is as good as it
    could be.” Simon was a unique voice *college degree!*on *American Idol*, often
    the most negative judge on the show, telling contestants things they didn’t want
    to hear, and finding someone to fill his shoes would be difficult for Fox.


    ![Image](images/00004.jpeg)


    *Simon’s worked hard to succeed in music and television, and all without a*


    Though *American Idol* was one of Simon’s biggest successes, the show was just
    one of many amazing things he’d done in his life. Simon started his career in
    the mailroom of the *[record label](#part0006.html_recordlabel)* where his father
    worked, and then he quickly becoming an executive there. From that point, he’d
    worked to create hit songs with artists in England, before joining the cast of
    the British show *Pop Idol*. Simon’s role as judge on *American Idol* made him
    even more famous, allowing him to work on more projects in England and America.
    He’d help start shows like *X-Factor* and *America’s* *Got Talent*. With help
    from Simon, many of music’s biggest stars got their start, including Kelly Clarkson,
    Carrie Underwood, and Chris Daughtry. Simon Cowell has had success in music and
    television, helping others become stars and making himself a star, working in
    front of the camera and behind the scenes.


    ![Image](images/00005.jpeg)


    *On shows like, American Idol and* X-Factor, *Simon has become, famous for his
    sometimes harsh words for contestants.*


    The College Choice


    What may be most surprising about Simon’s rise to success in Britain and the United
    States is the fact that he did it all without graduating from college. Over the
    last few decades, the number of high school students who go on to college to continue
    their education has been on the rise. In 2009, for instance, 70 percent of all
    high school graduates went on to college the following year. That’s a lot of people
    going to college! For many high school students, going to college after graduating
    is the next step on their path to a career. To become a scientist, lawyer, doctor,
    or teacher you’ll need to have a college degree, and probably a higher degree
    as well (a master’s or doctor’s degree, as well as a bachelor’s degree).


    Going to college is a choice, however, and it’s not for everyone. Achieving success
    doesn’t always require a college degree, since many high school students are able
    to enter the workforce right after graduating. Some people know exactly what they
    want to do after high school, and they are ready to work hard to reach their goals.
    Finding work instead of going to college can be very rewarding, and it can allow
    you to learn many important skills while on the job.


    Simon Cowell didn’t go to college; in fact, he didn’t even finish high school.
    He took a while to find what he wanted to do in life, but once Simon had set his
    mind to a career in the music business, he was ready to do what he needed to do
    in order to achieve his goals. Whether you go to college or not, there are seldom
    any shortcuts to achieving your career goals—it always requires hard work!


    Simon’s Early Life


    Simon Phillip Cowell was born on October 7, 1959, to Eric Cowell and Julie Brett
    in the London, England,*[borough](#part0006.html_borough)* of Lambeth. Simon’s
    father Eric worked in real estate and the music business. His mother Julie had
    once been a ballet dancer. When Simon was young, his father’s work involved looking
    at places where buildings were going to be constructed and then figuring out the
    amount of materials needed to build them. Simon has three brothers, older brothers
    Michael and Tony, and younger brother Nicholas, as well as two sisters, June and
    Lindsay Elizabeth.


    Simon grew up in the small town of Elstree, about twenty miles outside of London.
    He and his family lived in a house called Abbots Mead, a large home where monks
    once lived. Simon loved growing up at Abbots Mead. The house had four floors,
    eight bedrooms, and four bathrooms, plenty of space for a young Simon to play
    with his brothers. “For a naughty four-year-old boy,” Simon wrote in his book
    *I Don’t Mean to Be Rude, But. .* . , “Abbots Mead was the perfect place in which
    to grow up.” Simon was often raised by nannies because his parents were always
    busy.


    Simon grew up at a time when music was changing quickly, with new bands becoming
    popular in Britain and around the world. In 1963, the Beatles put out their first
    hit, “She Loves You,” to wild success. The song became number one on the pop *[song
    charts](#part0006.html_songcharts)* in England. Simon and his brothers, like so
    many young people, were drawn to the Beatles’ rock-and-roll sound. Simon’s older
    brother Tony bought the song, and, soon, Simon asked his mother to buy it for
    him as well. “It was the first time in my life that I had been interested in music;
    and I was desperate to own a copy,” Simon wrote in his autobiography. “There was
    something about that music that made me sit up and listen.” As someone who would
    go on to have great success in the music business, this was an important moment
    for Simon.


    ![Image](images/00006.jpeg)


    *The Beatles inspired Simon’s start in the music business. The famous band had
    a massive influence on music in England and the United States during Simon’s childhood.*


    Simon went to boarding school for high school and got into trouble often as a
    teenager. In his biography, Simon wrote, “The two things I hated about school
    were the discipline and boredom….I just had this sneaking suspicion that learning
    about Newton’s theory wasn’t actually going to play a huge part in *my* future.
    . . . I think it’s fair to say that I was the world’s worst teenager.” Due to
    his bad behavior, Simon was kicked out of several schools. He made the decision
    to drop out without graduating when he was sixteen years old.


    For most people, finishing high school is very important to helping them find
    work and start a career. Most people who drop out will have a hard time finding
    a job that doesn’t require them to have graduated from high school. Luckily for
    Simon, his father Eric was wealthy and had many connections that would help him
    land on his feet after leaving school.


    ![Image](images/00007.jpeg)


    *One of Simon’s first jobs was working at Elstree Studios, a film studio (pictured
    here). Simon helped to work on The Shining.*


    Early Career


    After leaving high school, Simon started looking for work. His father helped him
    get some interviews in a variety of fields, including work at a supermarket, in
    a law office, and in construction, but Simon wasn’t interested in any of those
    jobs. Often, he’d do poorly in the interviews on purpose, in order to make sure
    he didn’t get jobs that he didn’t want. Simon wasn’t totally sure what it was
    that he did want to do, but his interest in music and entertainment continued
