    Be Rude, But. . . : Backstage Gossip from American Idol & the Secrets That Can
    Make You a Star*.


    Creating Stars


    *American Idol* was hugely successful, making Simon a star in the United States,
    but it also created stars out of the show’s contestants. Many of the winners of
    *American Idol* have gone on to successful careers in music, some of them selling
    millions of albums and becoming celebrities after their appearance on the show.
    While some have become more successful than others after *Idol*, many of the contestants
    on *American Idol* have made the most of the chance that the show gave them.


    ![Image](images/00015.jpeg)


    *Country megastar Carrie Underwood is just one of the many singers to come from
    American Idol*


    The winner of *Idol*’s first season, Kelly Clarkson, has gone on to be one of
    the most successful contestants from the show. Kelly’s first album, *Thankful*,
    came out in 2002 to massive success. To date, the album has sold more than two
    million copies. *Breakaway*, her second album, cemented Kelly as a new star in
    music. The album sold more than six million copies in the United States and helped
    Kelly win two Grammys. Her huge hit “Since U Been Gone” reached number two on
    the *Billboard* song charts in the United States. In its first week out, Kelly’s
    third album, *My December*, sold just fewer than 300,000 copies.'
