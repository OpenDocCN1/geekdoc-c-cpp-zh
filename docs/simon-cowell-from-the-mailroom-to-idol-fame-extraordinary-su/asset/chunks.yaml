    Simon eventually got himself a job working at a movie production company near
    his Elstree home, Elstree Studios. Simon worked as a runner at the studio. A runner
    is the lowest position on a movie set; it’s the person who carries props and equipment,
    mostly doing work that is too small and unimportant for other people on the set
