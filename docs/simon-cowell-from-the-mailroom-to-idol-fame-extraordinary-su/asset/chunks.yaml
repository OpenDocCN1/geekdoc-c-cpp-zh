    Simon had lost one of the most important people in his life. His father had always
    been there for him, helping him to get a job when he couldn’t find another, helping
    him move on after losing his job at Fanfare, and believing in everything he did.
    Simon had reached a peak in his career and a low point in his personal life on
    the same day. Over the next few years, Simon would continue to have success in
    the music business, particularly with Westlife, but learning to cope with the
    death of his father would take years.


    ## Starting on Idol


    In 2001, Simon began working on a new television show called `Pop Idol`. Created
    by a man named Simon Fuller, the show was going to be a singing competition where
    the winner was picked by the show’s viewers sending in their vote by text message,
    phone, or the show’s website. The winner of each season of the show would get
    a record deal, hopefully allowing them to start a successful career in music.
    Simon would serve as one of three judges on the show who would comment on singers’
    performances and help them to become better and better each week the show was
    on the air. The first episode of `Pop Idol` debuted on October 5, 2001, in Britain.
    The show was a hit, becoming hugely popular among British television viewers.


    When the first season was over, the top two contestants (Will Young and Gareth
    Gates) won contracts with Simon’s S Records. Both men went on to have success
    in England, scoring number-one songs. Will Young’s first song on S Records sold
    more than 400,000 copies on its first day out, and more than one million in its
    first week.


    After the success of `Pop Idol` in Britain, the show moved to countries around
    the world, with a version of the show created specifically for each country. The
    shows kept the same format, with three judges, viewers voting, and the same style
    of competition. Local versions of `Idol` became popular in Australia, Greece,
    Malaysia, Canada, India, New Zealand, Norway, Armenia, Vietnam, France, Iceland,
    and many, many other countries around the globe.


    In 2002, the American version of `Idol` was shown for the first time. Called,
    simply, `American Idol`, the show aired on the Fox channel. Simon was hired as
    a judge for the new American show based on his popularity on the British version.
    He was known for his sharp, tough comments; he had already become a celebrity
    in Britain after being on the show. The American show would also have record producer
    and executive Randy Jackson and singer Paula Abdul filling the two other judge
    positions. With all the pieces in place, `American Idol` was set to become a huge
    success in its new home.


    ![Image](images/00013.jpeg)


    ## Chapter 3: IDOL becomes a success


    ### Words to Know


    - **album**: An album is a collection of an artist’s songs packaged together.

    - **timeslot**: On television, a show’s timeslot is the time that the show comes
    on. Shows in the same timeslot compete to win viewers.


    `American Idol` came to the United States already a success in Britain. `Pop Idol`
    had become a phenomenon in the UK and had launched the singing careers of two
    of its final contestants. By mid-2002, the show was already beginning to move
    around the world, and America was just one of many versions of the show being
    produced. With Simon coming on to be a judge in the U.S. version, the show had
    many of the things that made the British version so popular, but it wasn’t a guaranteed
    hit. There had been few shows like it, televised talent competitions where viewers
    voted on the winners. But any doubts about whether `Idol` would be a success were
    quickly put to the side shortly after the show debuted in the United States in
    the summer of 2002.


    ## A Major Hit


    When `American Idol` was first aired on June 11, 2002, just fewer than 10 million
    people tuned in to watch the singing competition. For the final episode of the
    first season, 23 million people watched the show. After singer Kelly Clarkson
    won the first season, the show was even more popular in its second season, during
    which Kelly scored a number-one debut on the `album` charts for `Thankful`, her
    first album. By having a winner go on to sell albums and have a successful start
    to her singing career, the show was proven to work, making stars out of its contestants.
    The second season premiere had 26 million people watching. Thirty-eight million
    people watched the season’s final episode, in which Ruben Studdard was named the
    winner. The show had gone from ranked between twenty-fifth and thirtieth for its
    `timeslot`, to number three. Over the next few years, the show would be number
    one or two consistently, keeping the number of people watching around 30 million
    or more. From season three on, `American Idol` would be the number-one show for
    people between the ages of eighteen and forty-nine.


    During this time, Simon became famous for his tough criticism of contestants.
    Though some thought he was rude to the singers on the show, many people liked
    that he wasn’t telling them what they wanted to hear. Simon became the judge that
    many `American Idol` fans tuned in to watch, waiting to hear what would come out
    of his mouth next. He’d tell singers he didn’t think were going to make it in
    the music business to stop singing and find something else they did well. He’d
    tell people their voices were terrible. When one contestant said she’d quit her
    job to audition for the show, Simon would even jokingly say she’d never make it.
    Simon was blunt, and his bluntness made him a star on both `Pop Idol` and `American
    Idol`.


    ![Image](images/00014.jpeg)


    *American Idol host Seacrest, judge Randy Jackson, and Simon don’t always see
    eye-eye on everything, but they’ve shared a lot of success thanks to the show.*


    Simon often began his comments on both shows by saying, “I don’t mean to be rude,
    but. ...” and then launching into a harsh criticism of the singing, appearance,
    or performance of the shows’ contestants. The phrase became so associated with
    Simon that he used it as the title of his 2003 autobiography, `I Don’t Mean to
    Be Rude, But. . : Backstage Gossip from American Idol & the Secrets That Can Make
    You a Star*.


    ## Creating Stars


    `American Idol` was hugely successful, making Simon a star in the United States,
    but it also created stars out of the show’s contestants. Many of the winners of
    `American Idol` have gone on to successful careers in music, some of them selling
    millions of albums and becoming celebrities after their appearance on the show.
    While some have become more successful than others after `Idol`, many of the contestants
    on `American Idol` have made the most of the chance that the show gave them.


    ![Image](images/00015.jpeg)


    *Country megastar Carrie Underwood is just one of the many singers to come from
    American Idol*


    The winner of `Idol`’s first season, Kelly Clarkson, has gone on to be one of
    the most successful contestants from the show. Kelly’s first album, `Thankful`,
    came out in 2002 to massive success. To date, the album has sold more than two
    million copies. `Breakaway`, her second album, cemented Kelly as a new star in
    music. The album sold more than six million copies in the United States and helped
    Kelly win two Grammys. Her huge hit “Since U Been Gone” reached number two on
    the `Billboard` song charts in the United States. In its first week out, Kelly’s
    third album, `My December`, sold just fewer than 300,000 copies.

