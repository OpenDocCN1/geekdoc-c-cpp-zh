  mdcn: "\n# # C++ 基础学习终速课程\n\n![](img/afec060538f8eba67b1368c9381e2860_1_0.png)\n\
    \n# C++:\n\nC++ 基础学习终速课程（C 语言编程、轻松上手 C++、C++ 编程、从今天开始编码）\n\nPaul Laurence\n\n\
    etcsc\nWISSER MEMORIAL LIBRARY\nQA76.73\n.C153\nL38\n2017\nC.1.\n\nCopyright ©\
    \ 2017 Paul Laurence\n保留所有权利。\n\nISBN: 1544068603\nISBN-13: 978-1544068602\n\n\
    # 目录\n\n- 引言 ...................................................................iv\n\
    - 第 1 章 – 开启 C++..................................................................1\n\
    - 第 2 章 – 基础输入输出...............................................................21\n\
    - 第 3 章 – 条件判断...............................................................25\n\
    - 第 4 章 – 数组操作...........................................................51\n\
    - 第 5 章 – 指针...............................................................59\n\
    - 第 6 章 – 函数......................................................................63\n\
    - 第 7 章 – 类与对象...............................................................70\n\
    - 第 8 章 – 继承......................................................84\n- 结语...............................................................................88\n\
    \n# 引言\n\n如果你正在阅读这本书，意味着你正在主动学习 C++。C++ 由 Bjarne Stroustrup 于 1979 年首次开发。是一种通用且高效的编程语言，具有极高的不可替代性。\n\
    \nC++ 是 C 编程语言的扩展。Bjarne 对 SIMULA 语言及其面向对象模型的知识帮助他为 C 创建了类扩展。它最初被名为 C with Classes，后来被更名为\
    \ C++。\n\nC++ 拥有多种特性。这些特性包括：\n\n- C++ 是高效的。\n- C++ 是一种静态编程语言。\n- C++ 是一种面向对象的语言：对象的使用允许通过类和对象，将较大的程序划分为较小的子集。\n\
    - C++ 是多范式的：这让开发者能够自由选择他们想要的编程风格。共有 7 种不同的风格供选择。\n- C++ 利用标准库：这意味着 C++ 可以通过库中的项来扩展其语言的功能。\n\
    \n学习 C++ 可以让你的简历提升到一个新水平。它仍然被用于许多主流应用程序、游戏、浏览器等。人们不断地开发和扩展 C++ 的功能。像 Github 这样的开源平台拥有数千个\
    \ C++ 仓库。\n\n随着 C++ 的增长，C++ 开发者的机会也在增加。在这些职位中，平均薪资可达 100,000 美元，每月有数千个职位发布。\n\n\
    虽然这本书是一个完美的起点，但不要期望一夜之间学会 C++。这门语言需要练习、坚持和毅力。如果你在问，不，你不需要在掌握 C++ 之前知道 C。\n\n将以下章节和练习作为你\
    \ C++ 编程之旅的路线图，知识在等待着。\n\n# 第 1 章 – 开启 C++\n\n在开始使用 C++ 开发之前，你必须先搭建一个能够高效运行的环境。话虽如此，你需要一种运行和编译\
    \ C++ 程序的方法。可以通过许多方式实现。这些方法包括：\n\n1. 在线：在网上运行和编译程序是避免过度下载或安装新软件的简单方法。它也是快速运行程序的良好选择。有很多网站可以实现这一点。由于易于使用，Ideone.com\
    \ 是实现此目的的极佳选择。\n2. Mac OS X：可以使用名为 XCode 的程序在 MAC 操作系统上运行。可以从 Apple 开发者页面下载。强烈建议使用最新版本。\n\
    \n![](img/afec060538f8eba67b1368c9381e2860_7_0.png)\n\n3. Linux：为了在 Linux 机器上高效运行程序，你需要安装一个编译器。GNU\
    \ GCC 是为初学者或在该操作系统上新学编程的用户推荐的编译器。你还必须下载一个文本编辑器。Gedit 就是一个例子。\n4. Windows：由于 Windows\
    \ 是一个标准且广泛的平台，有几种选项可以使用。这些可能包括 Code::Blocks、JGrasp 或 Eclipse。\n\n为了更好地理解 C++ 程序的结构，将使用\
    \ Hello World 作为模板。Hello World 程序通常用于各种编程语言的初。\n\n程序的第一行用于在程序中包含头文件。这允许你使用其中包含的操作。为了准确引用各种操作，需要\
    \ `namespace std`。它还可以帮助你避免在每个 `cout` 语句前面写 `std`。这一行基本上指的是使用标准命名空间。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"Hello World\"\
    ;\n    return 0;\n}\n```\n\n![](img/afec060538f8eba67b1368c9381e2860_9_0.png)\n\
    \n（注：原文文本中存在大量 OCR 识别重复噪声，已根据逻辑去重处理）\n\n---\n**修正后的内容流（第 9-11 页）：**\n\n从第 9 页到第\
    \ 10 页讨论了变量及其类型。\n\n如果你熟悉其他编程语言，很容易理解变量可以有类型。变量类型包括：\n\n- bool：存储真或假。\n- char：通常是单字节（一个字节）。这是一种整数类型。\n\
    - int：机器上最自然的整数大小。\n- float：单精度浮点值。\n- double：双精度浮点值。\n- void：表示类型的缺失。\n- wchar_t：宽字符类型。\n\
    \n| 类型 | 说明 |\n|---|---|\n| bool | 存储真或假。 |\n| char | 通常是单字节（一个字节）。这是一种整数类型。 |\n\
    | int | 机器上最自然的整数大小。 |\n| float | 单精度浮点值。 |\n| double | 双精度浮点值。 |\n| void | 表示类型的缺失。\
    \ |\n| wchar_t | 宽字符类型。 |\n\n![](img/afec060538f8eba67b1368c9381e2860_10_0.png)\n"
