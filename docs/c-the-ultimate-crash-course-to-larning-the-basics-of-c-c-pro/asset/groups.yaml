    \n# CONTENTS\n\n- Introduction ...................................................................iv\n\
    - Chapter 1 – Beginning C++..................................................................1\n\
    - Chapter 2 – Basic Input & Output...............................................................21\n\
    - Chapter 3 – Conditionals ................................................................25\n\
    - Chapter 4 – Working with Arrays...........................................................51\n\
