- md: "\n# Chapter 5 – Pointers\n\nPointer make certain complex tasks easier and they\
    \ are fairly simple to use. A pointer is defined as a variable that holds the\
    \ address of another variable. Much like a variable, before its use it must be\
    \ defined.\n\n```\ntype *var-name;\n```\n\nWhen using a pointer, the type is whatever\
    \ the type of the base type is. For example, if my pointer is pointing to a double\
    \ variable, my pointer must be a double. The var-name is the name of your pointer.\
    \ The asterisk must be used to denote a pointer.\n\n```cpp\nint *int_point; //\
    \ pointer to an integer\ndouble *dou_point; // pointer to a double\nfloat *flo_point;\
    \ // pointer to a float\nchar *ch_point; // pointer to character\n```\n\nThe following\
    \ example shows the information which is stored in a pointer, run the following\
    \ code to get a better understanding of pointers.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main () {\n    int variable = 10; // actual variable\
    \ declaration.\n    int *ipointer;     // pointer variable\n\n    cout << \"Value\
    \ of variable: \";\n    cout << variable << endl;\n\n    // access the value at\
    \ the address available in pointer\n    cout << \"Value of *ipointer variable:\
    \ \";\n    cout << *ipointer << endl;\n\n    return 0;\n}\n```\n\n# Null Pointers\n\
    \nA pointer that is assigned to NULL is referred to as a null pointer. A null\
    \ pointer is assigned at the time of declaration. The null pointer is generally\
    \ constant and holds a value of zero.\n\n# Pointer Math\n\nBeing that pointers\
    \ hold values for numbers, they also have the ability to perform basic arithmetic\
    \ functions.\n\nIn some programs the developer may choose to use a pointer instead\
    \ of an array. This is in part because pointers can be incremented and arrays\
    \ can't, without the help of a loop.\n\nThe following program shows how to successfully\
    \ increment the variable pointer to access each succeeding element of an array:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main\
    \ () {\n    int var[MAX] = {10, 100, 200, 300};\n    int *ptr;\n    // let us\
    \ have array address in pointer.\n    ptr = var;\n    for (int j = 0; j < MAX;\
    \ j++) {\n        cout << \"Value of var[\" << j << \"] = \";\n        cout <<\
    \ *ptr << endl;\n        // point to the next location\n        ptr++;\n    }\n\
    \    return 0;\n}\n```\n\nBeing that pointers can be incremented, they can also\
    \ be decremented. Run the following code to show how a pointer is decremented.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main()\
    \ {\n  int var[MAX] = {10, 100, 200, 300};\n  int *ptr;\n\n  ptr = &var[MAX-1];\n\
    \  for (int j = MAX; j > 0; j--) {\n    cout << \"Value of var[\" << j << \"]\
    \ = \" << endl;\n    cout << *ptr << endl;\n\n    // point to the previous location\n\
    \    ptr--;\n  }\n\n  return 0;\n}\n```\n\nAside from incrementing and decrementing,\
    \ pointers also have the ability to be compared using relational operators. This\
    \ includes operators such as ==, <, and >.\n\n# Chapter 6 – Functions\n\nFunctions\
    \ are extremely useful sections of code that are written in order to accomplish\
    \ a specific task. When they are used together they create a more sophisticated\
    \ and clean program.\n\nThe basic structure of a function is shown below. Please,\
    \ note that a prototype is another way of saying or classifying a declaration\
    \ of a function.\n\n```\nreturn type name (data type variable, data type variable....)\n\
    ```\n\nReturn type: The return type refers to what your function will return after\
    \ it has completed. For example, if I am creating a program to give me the average\
    \ age of college students I would use an int because I do not want nor need the\
    \ decimal places. Therefore, truncation is okay. My return type would then be\
    \ an int.\n\nName: This is simply the name of the function. Using the same example,\
    \ I could name this function average_age.\n\nData type: The data type simply refers\
    \ to a variable. These are the items that the function can take in to use. It\
    \ can be one or it can be multiples.\n\nThe beginning of the function would look\
    \ like the sample below.\n\n```cpp\nint average_age(int x, int y)\n```\n\nThe\
    \ placement of the prototype is shown in the sample below.\n\n```cpp\n#include\
    \ <iostream>\nint average_age(int x, int y);\n\nint main()\n{\n    //main program\n\
    \    return 0;\n}\n```\n\n```cpp\ndouble mult(int x, int y) //notice no semicolon\n\
    {\n    //function will be written here\n}\n```\n\nRun the following program as\
    \ a sample in order to see how functions operate. The function in the following\
    \ program is used to add two variables and return the sum of both.\n\n```cpp\n\
    //Full working program\n#include <iostream>\ndouble summation(int a, int b); //\
    \ prototype\n\nint main()\n{\n    int x,y;\n    int c;\n    cin>>x>>y;\n    c\
    \ = summation(x,y);\n    cout<<c;\n}\n\ndouble summation(int a, int b)\n{\n  \
    \  return a + b;\n}\n```\n"
  mdcn: "\n\n# 第5章 – 指针\n\n指针让某些复杂任务变得简单，而且它们的使用非常容易。指针被定义为存储另一个变量地址的变量。与变量一样，在使用之前必须对其进行定义。\n\
    \n```cpp\ntype *var-name;\n```\n\n当使用指针时，其类型取决于基础类型的类型。例如，如果我的指针指向一个 `double`\
    \ 变量，那么我的指针必须是 `double` 类型。`var-name` 是你的指针名称。必须使用星号 `*` 来表示指针。\n\n```cpp\nint\
    \ *int_point; // 指向整数的指针\ndouble *dou_point; // 指向双数的指针\nfloat *flo_point; //\
    \ 指向浮点的指针\nchar *ch_point; // 指向字符的指针\n```\n\n下面的示例展示了指针中存储的信息，运行以下代码以更好地理解指针。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n    int\
    \ variable = 10; // 实际变量声明\n    int *ipointer;     // 指针变量\n\n    cout << \"Value\
    \ of variable: \";\n    cout << variable << endl;\n\n    // 访问指针可用地址处的值\n    cout\
    \ << \"Value of *ipointer variable: \";\n    cout << *ipointer << endl;\n\n  \
    \  return 0;\n}\n```\n\n# 空指针\n\n被赋值为 `NULL` 的指针被称为空指针。空指针在声明时赋值。空指针通常是常量，且其值为零。\n\
    \n# 指针运算\n\n由于指针存储的是数值，它们也具有执行基本算术运算的能力。\n\n在某些程序中，开发者可能会选择使用指针代替数组。这部分是因为指针可以在没有循环帮助的情况下递增，而数组则不能。\n\
    \n下面的程序展示了如何成功增加变量指针以访问数组的每个后续元素：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nconst int MAX = 4;\nint main () {\n    int var[MAX] = {10, 100, 200, 300};\n\
    \    int *ptr;\n    // 让指针指向数组地址。\n    ptr = var;\n    for (int j = 0; j < MAX;\
