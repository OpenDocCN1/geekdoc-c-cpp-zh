    # Introduction


    If you are reading this book it means that you are taking the initiative to learn
    C++. C++ was first developed in 1979 by Bjarne Stroustrup. It is a general and
    efficient programming language that is highly irreplaceable.


    C++ is an extension of the C programming language. Bjarne’s knowledge of the SIMULA
    language and its object oriented model aided him in creating class extensions
    to C. It was originally named C withClasses. It was later renamed to C++.


    C++ has a variety of features. These features include:


    +   - C++ is efficient.

    - C++ is a static programming language.

    - C++ is an object oriented language: The use of objects allows for the division
    of larger programs into smaller subsets with the use of classes and objects.

    - C++ is multi-paradigm: This gives the developers freedom to choose what style
    of programming they'
  - '[PAGE 6]


    want to use. There are 7 different styles to be chosen from.


    +   - C++ utilizes a standard library: This means that C++ is able to extend the
    power of its language by utilizing the items with the library.


    Learning C++ is something that can take your resume to a new level. It is is still
    used in many major applications, games, browsers and so much more. People are
    continuously developing and extending upon the functionality of C++. Open source
    platforms like Github are home to thousands of C++ repositories.


    With C++ growing the opportunities for C++ developers are growing as well. Within
    these positions one can expect an average salary of $100,000 with thousands of
    jobs being advertised each month.


    Although this book is a perfect starting point, don''t expect to learn C++ overnight.
    This language takes practice, persistence and perseverance. If you were wondering,
    no, you do NOT need to know C before you can grasp C++.


    Use the following chapters and exercises as a roadmap on your C++ programming
    journey, the knowledge awaits.'
