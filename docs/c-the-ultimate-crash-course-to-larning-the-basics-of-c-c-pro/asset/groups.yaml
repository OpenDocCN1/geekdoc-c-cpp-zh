  mdcn: "\n# 第 7 章 – 类与对象\n\nC++ 的主要功能之一是在 C 语言的基础上增加了面向对象。由于由于，类（classes）是 C++ 程序涉及的特性之一。这些有时被称为用户定义类型。\n\
