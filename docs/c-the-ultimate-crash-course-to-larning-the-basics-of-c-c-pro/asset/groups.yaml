    \n# Introduction\n\nIf you are reading this book it means that you are taking\
    \ the initiative to learn C++. C++ was first developed in 1979 by Bjarne Stroustrup.\
    \ It is a general and efficient programming language that is highly irreplaceable.\n\
    \nC++ is an extension of the C programming language. Bjarne’s knowledge of the\
    \ SIMULA language and its object oriented model aided him in creating class extensions\
    \ to C. It was originally named C with Classes. It was later renamed to C++.\n\
    \nC++ has a variety of features. These features include:\n\n- C++ is efficient.\n\
    - C++ is a static programming language.\n- C++ is an object oriented language:\
    \ The use of objects allows for the division of larger programs into smaller subsets\
    \ with the use of classes and objects.\n- C++ is multi-paradigm: This gives the\
    \ developers freedom to choose what style of programming they want to use. There\
    \ are 7 different styles to be chosen from.\n- C++ utilizes a standard library:\
    \ This means that C++ is able to extend the power of its language by utilizing\
    \ the items with the library.\n\nLearning C++ is something that can take your\
    \ resume to a new level. It is still used in many major applications, games, browsers\
    \ and so much more. People are continuously developing and extending upon the\
    \ functionality of C++. Open source platforms like Github are home to thousands\
    \ of C++ repositories.\n\nWith C++ growing the opportunities for C++ developers\
    \ are growing as well. Within these positions one can expect an average salary\
    \ of $100,000 with thousands of jobs being advertised each month.\n\nAlthough\
    \ this book is a perfect starting point, don't expect to learn C++ overnight.\
    \ This language takes practice, persistence and perseverance. If you were wondering,\
    \ no, you do NOT need to know C before you can grasp C++.\n\nUse the following\
    \ chapters and exercises as a roadmap on your C++ programming journey, the knowledge\
    \ awaits.\n\n# Chapter 1 – Beginning C++\n\nBefore you begin to develop in C++\
    \ you must first set up an environment that allows you to do effectively. With\
    \ this being said, you will need a way to run and compile your C++ programs. This\
    \ can be done in a plethora of ways. These ways include the following:\n\n1. Online:\
    \ Running and compiling programs online is an easy way to avoid excessive downloads\
    \ or new software. It is also a good option for running programs quickly. There\
    \ are a good number of sites which allow for this. Due to ease of use, this is\
    \ the option which Ideone.com is an excellent option for doing so.\n2. Mac OS\
    \ X: Programs can be run on a MAC operating system using a program called XCode.\
    \ This can be downloaded from the Apple developer page. The latest version is\
    \ highly recommended.\n\n![](img/afec060538f8eba67b1368c9381e2860_7_0.png)\n\n\
    3. Linux: In order to run programs effectively with a Linux machine, you will\
    \ need to install a compiler. GNU GCC is a recommended compiler for beginners\
    \ or users new to programming in this operating system. You must also download\
    \ a text editor. Gedit, being one example.\n4. Windows: Being that Windows is\
    \ a standard and widespread platform there are several options available for use\
    \ with it. These may include Code::Blocks, JGrasp or Eclipse.\n\nIn order to better\
    \ understand the structure of a C++ program, Hello World will be used as a template.\
    \ Hello World programs are generally used for beginners in a various programming\
    \ languages.\n\nThe first line of the program is used to include the header file\
    \ within your program. This allows for you to use the operations included in them.\
    \ The namespace std is needed in order to accurately reference a variety of operations.\
    \ It also aids you in not having to write the std in front of every cout statement.\
    \ This line basically refers to the use of a standard namespace.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"Hello World\";\n\
    \    return 0;\n}\n```\n\n![](img/afec060538f8eba67b1368c9381e2860_9_0.png)\n\n\
