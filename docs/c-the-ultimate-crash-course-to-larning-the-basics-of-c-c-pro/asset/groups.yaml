    - 始终提供过渡路径。

    - C++ 是一种语言，而不是一个完整的系统。

    - 为每个支持的风格提供全面的支持。

    - 不要试图强迫人们使用特定的编程风格。


    ## 设计支持规则：


    - 支持良好的设计。

    - 为程序组织提供支持。

    - 直言直言。

    - 所有功能必须是负担得起的。

    - 允许功能比防止误用更重要。

    - 支持软件组合。


    ## 语言技术规则：


    - 无对静态系统的隐式违反。

    - 为自定义类型和内置类型提供良好的支持。

    - 局部性良好。

    - 避免依赖关系。

    - 如果疑问，选择最易教学的变体。

    - 语法很重要（以某种糟糕的方式）。

    - 应消除预处理器的使用。


    ## C++


    - 低级编程规则：

    - 无传统的（愚的）链接器。

    - 无与 C 的免费不兼容性。

    - 不留 C++ 以下的低级语言（汇编除外）。

    - 不使用的内容无需付费（零开销规则）。

    - 如果疑问，提供手动控制手段。


    总的来说，人们使用 C++ 有很多原因。简单来说，C++ 是：


    - 灵活 —— C++ 是灵活的，因为它没有强制使用某种语言的限制。它可以毫不费地应用于各种领域。

    - 高效 —— C++ 的基本概念与日常计算机相似。

    - 可用 —— 所有计算机上都有可用的 C 编译器。还有其他工具和资源，开发者无需从头开始编写。

    - 可移植 —— C++ 中使用的项目移植非常简单且可行。


    感谢阅读。希望你喜欢。我请求你留下诚恳的反馈。


