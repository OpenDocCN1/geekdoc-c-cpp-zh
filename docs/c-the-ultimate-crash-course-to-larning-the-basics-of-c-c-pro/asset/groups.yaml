  - '[PAGE 90]


    +   - Encapsulation – This is the binding of functions with variables.


    +   - Inheritance – It allows for the reuse of code without being written over
    and over. This also allows for classes to inherit information from a base class.


    +   - Polymorhism – This allows for the creation of functions which contain the
    same name but utilize a variety of arguments. Even though these functions have
    similar naming conventions the behave differently.


    This chapter will focus on inheritance and using inheritance in C++. Inheritance
    makes your code cleaner and easier to understand.


    # Derived Classes


    A class has the ability to be derived from multiple classes. This means that it
    can inherit functions and data from various base classes.


    A class derivation list is used to define a derived class. It names one or multiple
    base classes. The form of a derivation list is shown below.


    ```

    class derived-class: access-specifier base-class

    ```'
  - '[PAGE 91]


    # Access Control and Inheritance


    A derived class has the ability to access all non private base class members meaning
    that the base class members should not be accessible to the functions of a derived
    class.


    The different access types are shown below according to who can access them and
    in what specific way.


    | Access | Public | protected | private |

    | --- | --- | --- | --- |

    | Same class | Yes | yes | yes |

    | Derived classes | Yes | yes | no |

    | Outside classes | Yes | no | no |


    # Type of Inheritance


    When a class is being derived from a base class, the base class can be inherited
    in 3 different ways. It can be done through either public, protected or private
    inheritance. The inheritance type is determined by the access- specifier, which
    was covered in the previous section.


    The most commonly used inheritance is public. Private and'
  - '[PAGE 92]


    protected are rarely used but are still useful to know. The following rules should
    be utilized when using varying types of inheritance.


    +   - **Public Inheritance**: When using public inheritance, the key is to remember
    that everything that is cognizant of the base and the child will also be aware
    that the child inherits the base.


    +   - **Protected Inheritance**: When you are using protected inheritance one
    must remember that only the child and its children are aware that they inherit
    from the base.


    +   - **Private Inheritance**: When utilizing private inheritance, it is more
    closed off. No one other than the child is aware of the inheritance.


    # Multiple Inheritances


    In C++ a class has the ability to inherit members from multiple classes. The multiple
    inheritance syntax is as follows.


    class derived-class: access baseA, access baseB....


    In the given syntax, access would be one of the following: public, protected or
    private. The access would be assumed for every one of the base classes.'
