- md: "\nstatic functions are accessed by simply using the class name and the scope\
    \ resolution operator ::. A static member function is only able to access a static\
    \ data member, static member functions and any other functions from outside the\
    \ class.\n\nStatic data members, static member functions and any other functions\
    \ from outside the class can be accessed by a static member function. It can also\
    \ be used to determine if objects have not been created or if they have.\n\nThe\
    \ following is an example of using static function members.\n\n![](img/afec060538f8eba67b1368c9381e2860_84_0.png)\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass Box {\npublic:\n\
    \    static int objectCount;\n    // Constructor definition\n    Box(double l\
    \ = 2.0, double b = 2.0, double h = 2.0) {\n        cout << \"Constructor called.\"\
    \ << endl;\n        length = l;\n        breadth = b;\n        height = h;\n \
    \       // Increase every time object is created\n        objectCount++;\n   \
    \ }\n\n    double Volume() {\n        return length * breadth * height;\n    }\n\
    \n    static int getCount() {\n        return objectCount;\n    }\n\nprivate:\n\
    \    double length; // Length of a box\n    double breadth; // Breadth of a box\n\
    \    double height; // Height of a box\n};\n\n// Initialize static member of class\
    \ Box\nint Box::objectCount = 0;\n\nint main(void) {\n    // Print total number\
