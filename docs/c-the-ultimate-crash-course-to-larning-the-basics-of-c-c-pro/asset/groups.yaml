    \n## C++ 类定义\n\n实际上，类并没有定义任何形式的正式数据。它仅仅是一个大纲或蓝图。类定义了类名的含义以及它所代表的对象的组成。它还定义了对象可以执行哪些操作。\n\
    \n在定义类时，必须始终以 `class` 关键字开始。紧接着应该是类名。然后是类体，所有内容都必须包含在大括号内。类定义之后，根据用户的需要，必须跟一个分号或声明列表。以下是类声明的示例。\n\
    \n```cpp\nclass Person {\npublic:\n    double weight; // 人的体重\n    double height;\
    \ // 人的身高（英寸）\n    int age; // 人的年龄\n};\n```\n\n如所示，你将看到关键字 `public` 的使用。这用于确定类成员的访问级别。任何标记为\
    \ `public` 的内容都可以从类的外部任何地方访问，但仍在类对象的范围内。`public` 不是唯一的访问方法。成员也可以被描述为 `private`（私有）或\
    \ `protected`（保护），将在本章后面讨论。\n\n## 定义 C++ 对象\n\n既然类被认为是对象的蓝图，那么从类创建对象是有理的。对象的声明方式与声明变量相同。下面是上一节开始的\
