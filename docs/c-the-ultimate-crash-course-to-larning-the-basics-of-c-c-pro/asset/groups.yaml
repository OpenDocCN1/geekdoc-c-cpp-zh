    \ = 'A';\n}\n```\n\n- 2. C. Break\n- 3. No, switches cannot have conditions\n\
    - 4. This is wrong because a case cannot have a condition.\n- 5. Nothing is wrong\
    \ with this statement.\n- 6. False.\n\n# Chapter 4 – Working with Arrays\n\nArrays\
