    \ as the components of the object it represents. It also defines what operations\
    \ can be performed by the object.\n\nWhen defining a class, you must always start\
    \ with the keyword, `class`. This should be immediately followed by the name of\
    \ the class. The class body should then follow and all must be enclosed by curly\
    \ brackets. The class definition must then be followed by a semicolon or list\
    \ of declaration depending on the user’s needs. The following is an example of\
    \ class declarations.\n\n```cpp\nclass Person {\npublic:\n    double weight; //\
    \ weight of a person\n    double height; // height in inches of a person\n   \
    \ int age; // age of a person\n};\n```\n\nShown above, you will see the use of\
    \ the keyword `public`. This is used to determine the level of access the members\
    \ of the class will have. Anything marked as public can be accessed from anywhere\
    \ outside of the class but still within the scope of the class object. Public\
    \ is not the only access method. Things may also be described as `private`, or\
    \ `protected`, which will be discussed later in the chapter.\n\n## Define C++\
    \ Objects\n\nSince a class is said to be the blueprint for an object, it makes\
    \ sense that objects are created from classes. Objects are declared the same way\
    \ that we would declare a variable. Find below the definitions of the person object\
    \ which was started in the previous section.\n\n```cpp\nPerson Person1; // Declare\
    \ Person1 of type Person\nPerson Person2; // Declare Person2 of type Person\n\
    ```\n\nBoth of the objects Person1 and Person2 will have their own copy of data\
    \ members.\n\n## Accessing the Data Members\n\nAny data member of a public access\
    \ type may be used simply using (.). This is the access operator.\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nclass Person {\npublic:\n    double\
