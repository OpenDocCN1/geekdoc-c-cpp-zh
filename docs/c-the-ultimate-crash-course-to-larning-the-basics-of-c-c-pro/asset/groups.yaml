    \ used to organize large amounts of data and information. When attempting to iterate\
    \ through an array loops are a highly useful tool for assigning values and for\
    \ printing them out.\n\n![](img/afec060538f8eba67b1368c9381e2860_56_0.png)\n\n\
    In a situation where you have multiple variable like the one listed below, it\
    \ would be easier to simply use an array. The information below simply shows the\
    \ ages of 5 different people.\n\n```\nint Person1=15;\n```\n\n```\nint Person2=24;\n\
    ```\n\n```\nint Person3=54;\n```\n\n```\nint Person4=33;\n```\n\n```\nint Person5=120;\n\
    ```\n\nInstead of declaring each person as a different variable it would be easier\
    \ to simply declare an array of 5 with various people's ages.\n\nThe declaration\
    \ of this array would be the following: int person_ages [5];\n\n```cpp\nint person_ages\
    \ [5];\n```\n\nThe array type would be int, this is the type of the information\
    \ that would be being stored. The second item is simply the array name. In this\
    \ case the name is person_ages. The last piece within the brackets holds the amount\
    \ of items in your array.\n\n# Initializing Arrays\n\nThere are two ways to initialize\
