    # # Using Variables


    A variable is a very fundamental piece of a program. They can be of alphanumeric
    nomenclature but must always begin with a letter. Variables are used in a variety
    of statements within a program.


    There are 3 types of statements. These types include declaration statements, assignment
    statements and output statements. Examples of all are provided below.


    Before a variable can be used in a program it must first be declared with a declaration
    statement. A declaration statement gives a name and type to a place in memory
    where a specific value will be held. In the above example, the name is y and the
    type is "double".


    ```

    //Declaration Statement

    double y;

    ```


    ```

    //Assignment Statement

    y=20.5

    ```


    ```

    // Output Statements

    std::cout << y;

    ```'
