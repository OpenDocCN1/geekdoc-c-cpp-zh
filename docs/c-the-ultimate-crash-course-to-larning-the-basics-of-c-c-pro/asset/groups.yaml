  mdcn: "\n运行以下程序以查看 `continue` 语句在代码中的运行机制。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main()\n{\n    for (int j = 1; j <= 10; ++j)\n    {\n  \
    \      if (j == 6 || j == 9)\n        {\n            continue;\n        }\n  \
    \      cout << j << \"\\t\";\n    }\n    return 0;\n}\n```\n\n# Switch 语句\n\n\
    当需要多个 `if else` 语句时，可以使用 `switch` 语句。`switch` 语句的执行速度通常比多个嵌套的 `if` 语句更快，而且更容易理解和编写。\n\
    \n`switch` 语句的语法如下\n\n```\nswitch (n)\n{\n    case constant1:\n        // 如果 n\
    \ 等于 constant1，执行的代码；\n        break;\n    case constant2:\n        // 如果 n 等于\
    \ constant2，执行的代码；\n        break;\n    default:\n        // 如果 n 不匹配任何常量，执行的代码\n\
    }\n```\n\n![](img/afec060538f8eba67b1368c9381e2860_53_0.png)\n\n上面的语法和图表显示，当找到匹配\
    \ `n` 的 case常量时，程序的控制权将传递到相关的 case 块。在程序到达 `break` 语句或块的结束之前，将执行该代码块。\n\n# Switch\
    \ 语句练习\n\n使用这些问题练习 `switch` 语句及其用法。\n\n- 1. 编写一个程序，根据学生的数字成绩确定其字母等级。程序应该输出学生的字母等级。使用\
    \ `switch` 来判断成绩是 A、B、C、D 还是 F。\n- 2. 在 `switch` 的每个 `case` 后面都有一个特定的内容。那个项是什么？\n\
    - 3. 在 `case` 中包含条件语句是合法的？\n- 4. 解释以下 `case` 的错误之处：`case (x > 3):`\n- 5. 解释以下\
    \ `case` 的问题所在：`case 3:`\n- 6. `case` 应该总是带有大括号吗？对或错的。\n\n# 答案\n\n```\nswitch\
    \ (grade) {\n  case(1):\n    if (numAvg < 60)\n      grade = 'F';\n    break;\n\
    \  case(2):\n    if (numAvg < 70)\n      grade = 'D';\n    break;\n  case(3):\n\
    \    if (grade < 80)\n      grade = 'C';\n    break;\n  case(4):\n    if (grade\
    \ < 90)\n    grade = 'B';\n    break;\n  default: grade = 'A';\n}\n```\n\n- 2.\
    \ C. Break\n- 3. 不，`switches` 不能包含条件\n- 4. 这是错误的，因为 `case` 不能包含条件。\n- 5. 这条语句没有问题。\n\
    - 6. 错。\n\n# 第 4 章 – 数组操作\n\n数组不仅对于在单个变量名下存储数据极其有用，而且还可以以有序列表的格式存储元素。它们最终被用于组织大量的数据和信息。在尝试遍历数组时，循环是赋值和打印这些值非常有用的工具。\n\
    \n![](img/afec060538f8eba67b1368c9381e2860_56_0.png)\n\n当你有像下面列出的多个变量时，直接使用数组会更简单。下面的信息仅显示了\
    \ 5 个不同人的年龄。\n\n```\nint Person1=15;\n```\n\n```\nint Person2=24;\n```\n\n```\n\
    int Person3=54;\n```\n\n```\nint Person4=33;\n```\n\n```\nint Person5=120;\n```\n\
    \n与其将每个人都声明为不同的变量，不如直接声明一个包含 5 个不同人年龄的数组来简单。\n\n该数组的声明如下：`int person_ages [5];`\n\
    \n```cpp\nint person_ages [5];\n```\n\n数组类型为 `int`，这是要存储的信息类型。第二个项仅仅是数组名称。在这种情况下，名称是\
    \ `person_ages`。括号内的最后一部分持有数组中项目的数量。\n\n# 初始化数组\n\n初始化数组有两种方法。第一种是简单地列出数组位置并设置值。如下所示。\n\
    \n```cpp\nperson_age[0]=43;\nperson_age[1]=49;\n```\n\n```cpp\nperson_age[2]=5;\n\
    person_age[3]=10;\nperson_age[4]=70;\n```\n\n在手动设置数组中的值时，你也可以像下面所示设置它们。\n\n```cpp\n\
    //initialize\nperson_age[] = {43,49,5,10,70};\n```\n\n虽然手动设置数组对于只有 5 个元素的数组可能没问题。但当你的数组有\
    \ 500 个元素时该怎么办？这就是 `for` 循环用用场。使用循环更高效且工作量得多，尽管工作方式相同。下面的示例使用 `for` 循环遍历数组以打印，尽管也可以这样做。\n\
