    \nThe syntax of a switch statement is as follows:\n\n```\nswitch (n)\n{\n    case\
    \ constant1:\n        // code to be executed if n is equal to constant1;\n   \
    \     break;\n    case constant2:\n        // code to be executed if n is equal\
    \ to constant2;\n        break;\n    default:\n        // code to be executed\
    \ if n doesn't match any constant\n}\n```\n\n![](img/afec060538f8eba67b1368c9381e2860_53_0.png)\n\
