    # 第2章 – 基础输入与输出\n\n编程中最常见的函数之一是输入和输出。在 C++ 中，输入输出发生在流（streams）中。流也被称为字节序列。\n\n\
    如果给定的字节来自键盘或磁盘驱动器并流向主内存，这被归类为输入操作。输出被归类为字节从主内存流向屏幕或显示器。\n\n![](img/afec060538f8eba67b1368c9381e2860_26_0.png)\n\
    \n程序中的头文件对于输入输出至关重要。程序头的 `<iostream>` 是定义输入输出对象的头文件。其他头文件类型包括 `<iomanip>` 和 `<fstream>`。\n\
    \n# 使用 cout\n\n`cout` 对象是 `ostream` 类的一个实例，它连接到输出设备或显示器。这是一个相当简单的命令，大多数时候它与 `cin`\
    \ 配合使用，尽管它可以脱离开使用。\n\n运行下面的程序以准确地看到 `cout` 语句的作用。\n\n```\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    int a = 67;\n    int b = 67;\n   \
    \ int c = a+b;\n\n    cout << \"Value of c is : \" << c << endl;\n}\n```\n\n上述程序的输出应该是\
    \ `c` 的正确值，并带有给定的语句。\n\n此程序中注意的两个重要点包括插入运算符 `<<` 和 `endl`。`endl` 用于在给定的字符串行末尾添加新行。如我们在上面所示，`<<`\
    \ 可以使用多次。\n\n# 使用 cin\n\n使用 `cin` 允许用户将信息输入到给定的变量中。该对象属于 `istream` 族，它连接到输入设备（通常是类似于键盘的设备）。提取运算符与插入运算符相反。它简单地是\
    \ `>>`，将在下面的程序示例中看到。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    int main() {\n    char petname[40];\n    char yourname[60];\n    cout << \"Please\
    \ enter the name of your pet: \";\n    cin >> petname;\n    cout << \"Your name\
