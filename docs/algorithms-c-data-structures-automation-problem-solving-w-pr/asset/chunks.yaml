    computer effort).


    And Circular Array Queues can be just as fast - queueing and dequeueing can also
    be in constant time. You just have the extra flexibility to edit the lineup as
    you please.


    So depending on which data structure you use, the next chapters show you how you
    implement a stack.


    Chapter 2b: The Queue, as an Array


    The Data Structure


    Just like the Array Stack, you’ll need your actual array. But this time, we’ll
    need four integers: the front index, the back index, the max size and the current
    item count.


    // Abstract Data Type: Queue, as an Array


    // The Queue Has:


    // - the Actual Array (with Size and Data Type)


    // - the Index of the Front Item (Integer)


    // - the Index of the Back Item(Integer)


    // - the Max Size of the Queue (Integer)


    // - the Current Item Count (Integer)


    CompositeStructure ArrayQueue {


    Integer FRONT


    Integer BACK


    Integer MAXSIZE


    Integer COUNT


    (choose a data type) ARRAY[MAXSIZE]


    }


    Now, let’s look at how the Enqueue() and Dequeue() methods work, in detail:


    Array Queue: Enqueue() Function


    The Enqueue() function from an Array Queue adds items into that queue. It does
    this in the following procedure, in this particular order:


    1) Check if there’s room in the array for the extra item


    2) If there’s no room in the array, either report a queue overflow error (if fixed-size
    array) or increase the array size (if variable array)


    3) If there’s room in the array, we add the item to the queue. Set the new item’s
    index as the current Back Index (so the item is the very last item in the Queue)


    4) Increment the Back Index. If the Back Index becomes bigger than or equal to
    the Array Size, set the Back Index to 0 (it’s now at the start of the Circular
    Array).


    4) And Finally, Increment the Item Count


    After the enqueue() procedure successfully inserts an item, you should have that
    item as the last item in the circular array, regardless of what index it has.
    Also, the item count should be increased by 1.


    Array Queue: Dequeue() Function


    The Dequeue() method from an Array Queue removes an item from that queue. The
    function returns that item as the Function Output. It does this in the following
    procedure, in this particular order:


    1) Check the Array Count if there are any items to dequeue


    2) If not, either return NULL or report a queue underflow error


    3) If there’s an item to dequeue, create a Local Variable. Set it to be your return
    item (it should be the item at the front of the queue!). Remove the item at the
    Front of the Queue afterwards


    4) Increment the Front Index. If the Front Index becomes bigger than or equal
    to the Array Size, set the Front Index to 0 (it’s now at the start of the Circular
    Array).


    5) Decrement the Item Count


    6) And Finally, the function returns your item and ends.


    After the dequeue() procedure successfully removes and retrieves an item, the
    item should be the first item from the array. Also, the item count should be decreased
    by 1.


    Remember: function returns should be the very last thing in a function procedure
    - as it ends the function.


    Chapter 2c: The Queue, as a Linked List


    The Data Structure


    This is similar to the Linked List Stack. You’ll need two Linked List nodes -
    the Front and the Back. You also need an integer to keep track of the Item Count.
    You may also have to design the Linked List Nodes as well.


    // A Singly Linked List Node has:


    // - the Next Node (Point to the Next Node)


    // - the Data Item (choose what data type you want)


    CompositeStructure Node {


    String ID


    String NEXTID


    (choose a data type) ITEM


    }


    // Abstract Data Type: Queue, as a Linked List


    // The Queue Has:


    // - the Front (Linked List Node)


    // - the Back (Linked List Node)


    CompositeStructure LinkedListQueue {


    Node FRONT


    Node BACK


    Integer COUNT


    }


    Now, let’s look at how the Enqueue() and Dequeue() methods work, in detail:


    Linked List Stack: Enqueue() Function


    The Enqueue() function from a Linked List Queue adds items into the back of the
    Queue. It does this in the following procedure, in this particular order:


    1) Make a new Local Variable. Set it as a Node. This will be the New Linked List
    Back.


    2) Set your input item to be the New Back Node’s data


    3) Make sure to set the new back’s next node to null


    4) Set the New Back as the Linked List’s Back of Queue. If this queue was previously
    empty, the New Node will also be the new Front.


    5) And Finally, Increment the Item Count


    After the Enqueue() procedure successfully inserts an item, you should have that
    item at the back of the linked list and the item count should be increased by
    1.


    Linked List Queue: Dequeue() Function


    The Dequeue() method from a Linked List Queue removes the item at the very front
    of the Queue. The function returns that item as the Function Output. It does this
    in the following procedure, in this particular order:


    1) Check if the Front Node isn’t Null (if the Front Node Exists)


    2) If so, either return NULL or report a queue underflow error


    3) If there’s an item to dequeue, create a Local Variable. Set it to be your soon-to-be
    return item (it should be the Front Node!)


    4) Get the Node NEXT to the Front. This will NOW be the new LinkedList Front.


    5) Decrement the Item Count


    6) And Finally, the function returns your item and ends.


    After the dequeue() procedure successfully removes and retrieves an item, the
    item should be the item that was at the very front of the Linked List. Also, the
    item count should be decreased by 1.


    C++ 02a: The Queue, as a Circular Array


    The Data Structure, in C++


    Again, by default, we’ll set the Array Size to 10.'
