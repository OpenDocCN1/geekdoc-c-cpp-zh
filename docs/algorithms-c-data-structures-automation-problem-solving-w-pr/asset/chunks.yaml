  trans: "\n\n```cpp\nstd::cout << \"Count is \" << this->COUNT << \"\\n\";\n\n};\n\
    ```\n\n## 可选项：数组大小扩容器（阶段 1.2）\n\n如果你选择使用变长数组，请将此方法与其他方法一并包含。此版本会在需要时将数组大小翻倍。请注意操作步骤。根据定义，数组的大小是固定的。然而，这将简单地用一个更大的数组替换旧数组\
    \ —— 按照原始顺序逐个输入每个项目。\n\n## 数组栈：`Pop()` 函数（C++ 语言）\n\n与 `Push()` 函数一样，请注意 `Pop`\
    \ 函数执行过程中的程序化步骤。在这里，我们使用 `C++` 来实现它。\n\n如果在栈为空时调用了 `pop()`，我们将打印一条消息并结束函数。\n\n\
    ```cpp\n// INPUT: - 无\n\n// OUTPUT: - 一个项目（某种数据类型）\n\n// EFFECT: 从我们的数组栈中移除并检索一个项目（某种数据类型）\n\
    \n<chosen data type> pop() {\n\n    // 1) 检查数组计数，查看是否有可弹出的项。\n    if (this->COUNT\
    \ <= 0) {\n        // 2) 如果没有，打印一条消息并返回空\n        std::cout << \"Stack Underflow!\\\
    n\";\n        return NULL;\n    }\n\n    // 3) 如果有可弹出的项，先减少项目计数。\n    // 我们要移除一个项目！\n\
    \    this->COUNT -= 1;\n\n    // 4) 然后，创建一个局部变量。\n    // 将其设置为要返回的项目\n    //（它应该是栈末尾的项！）\n\
    \    <chosen data type> r = this->ARRAY[COUNT];\n\n    // 证明它加载了末尾项：\n    std::cout\
    \ << \"Loaded is \" << this->ARRAY[COUNT] << \" at index \"<< this->COUNT << \"\
    \\n\";\n\n    // 随后移除栈末尾的项\n    this->ARRAY[COUNT] = NULL;\n\n    // 5) 最后，函数返回你的项目并结束。\n\
    \    return r;\n}\n\n};\n```\n\n## C++ 01b：作为链表的的栈\n\n### 数据结构（C++ 语言）\n\n在 `C++`\
    \ 中，我们使用指针将节点连接起来。这样，每个节点都拥有下一个节点的内存地址。我们不需要复制节点并占用计算机内存中的数据空间，只需“指向”下一个节点即可。\n\
    \n我们为 `node` 和链表都定义了类。我们还为 `Node` 和 `Linked List Stack`（链表栈）都定义了构造函数。你需要同时使用它们，因为\
    \ `Stack` 需要节点被创建出来。\n\n```cpp\n// 单链链表节点包含：\n// - 下一个节点（指向下一个节点）\n// - 数据项（选择你想要的数据类型）\n\
    class Node {\npublic:\n    Node* NEXT;\n    <chosen data type> ITEM;\n\n    //\
    \ INPUT: - 一个数据项\n    // OUTPUT: - 无\n    // EFFECT: 构造函数：链表节点，以数据项作为输入\n    Node(<chosen\
    \ data type> item) {\n        this->ITEM = item;\n    }\n\n};\n```\n\n### 抽象数据类型：作为链表的栈\n\
    \n// 栈存有：\n// - 一个默认头节点（链表节点）\n// - 一个项目计数（整数）\n```cpp\nclass LinkedListStack\
    \ {\n    Node* HEAD;\n    int COUNT;\n\npublic:\n    // INPUT: - 无\n    // OUTPUT:\
    \ - 无\n    // EFFECT: 构造函数：链表栈，\n    LinkedListStack() {\n        this->HEAD =\
    \ new Node(<data with chosen data type>);\n        this->COUNT = 0;\n    }\n\n\
    \    // 在此处插入 PUSH() 函数\n    //________________\n    // 在此处插入 POP() 函数\n    //________________\n\
    };\n```\n\n对于高级用户来说，项目计数是可选的。然而，它在优化你的数据结构和操作方面非常有帮助，并能使其变得更加健壮。\n\n### 链表栈：`Push()`\
    \ 函数（C++ 语言）\n\n```cpp\n// INPUT: - 一个项目（某种数据类型）\n// OUTPUT: - 无\n// EFFECT: 将一个项目（某种数据类型）插入我们的链表栈\n\
    void push(<chosen data type> INPUT) {\n    // 1) 创建一个新的局部变量。将其设置为节点。\n    // 这将成为新的链表头。\n\
    \    Node* NEWHEAD = new Node(INPUT);\n\n    // 2) 将你的输入项目设置为新头节点的数据\n    //（构造函数已完成此操作）\n\
    \    // 3) 将上一个头的下一个节点指向新头\n    NEWHEAD->NEXT = this->HEAD;\n\n    // 4) 将新头设置为链表栈的头\n\
    \    this->HEAD = NEWHEAD;\n\n    // 证明它已插入：\n    std::cout << \"Head item is:\"\
    \ << HEAD->ITEM << \"\\n\";\n    std::cout << \"Next Head item is:\" << HEAD->NEXT->ITEM\
    \ << \"\\n\";\n\n    // 5) 增加项目计数\n    this->COUNT += 1;\n}\n```\n\n### 链表栈：Pop()\
    \ 函数\n\n```cpp\n// INPUT: - 无\n// OUTPUT: - 一个项目（某种数据类型）\n// EFFECT: 从我们的链表栈中移除并检索一个项目（某种数据类型）\n\
    <chosen data type> pop() {\n    // 1) 检查头节点是否为空（如果头节点存在）\n    if (this->HEAD->NEXT\
    \ == NULL) {\n        // 2) 如果是，打印一条消息并返回空\n        std::cout << \"Stack Underflow!\"\
    \ << \"\\n\";\n        return NULL;\n    }\n\n    // 3) 如果有可弹出的项，创建一个局部变量。\n \
    \   // 将其设置为要返回的项目\n    //（它应该是头节点！）\n    <chosen data type> r = this->HEAD;\n\
    \n    // 4) 随后移除栈末尾的项\n    //（注：原文片段中移除头节点的逻辑）\n    \n    // 5) 最后，函数返回你的项目并结束。\n\
    \    return r;\n}\n```\n*(注：提供的文本中 pop 函数的实现逻辑存在部分重叠或碎片；我已按照源文本的结构进行了翻译。)*\n\n"
- fmt: "\n# The Queue\n\nA `Queue` is also a list or sequence of items. Each item\
    \ awaits for its turn to be processed - as if it were a person lining up for something.\n\
    \nThe data objects in a queue would be inserted and retrieved in a First-In-First-Out\
    \ process.\n\nA `Queue` will usually have two main functions defined along with\
    \ it: `enqueue` (insert to the lineup, at the back) and `dequeue` (remove from\
    \ the lineup).\n\n## How the Queue Works\n\nThink of a queue as a lineup. For\
    \ anything. It could be the lineup at your bank, at your favourite fast food restaurant,\
    \ the nightclub, anything that resembles a lineup.\n\nAnd in a lineup, someone\
    \ enters the line at the back. As the lineup grows, more people enter the line\
    \ at the back. Whoever is at the front of the line is serviced - they deal with\
    \ customer service, have their order taken, get in the nightclub, anything the\
    \ lineup does. And whenever someone is serviced, the lineup becomes smaller.\n\
    \nA queue works essentially the same way. You input data items into a lineup,\
    \ with the most recent data items at the back of the line. When data items are\
    \ retrieved, the oldest item is retrieved first.\n\n## When to Use the Queue\n\
    \nWhenever you have a list of data items and they must be processed in a ‘lineup\
    \ matter’, use the `Queue`. Once you notice it uses a First-In-First-Out process\
    \ for any objects it takes in, use a queue.\n\nOnline Video Games are a great\
    \ example. If you had to log into any game server to play, your login request\
    \ would be sent to a “lineup” of login requests from everyone else who wants to\
    \ play too. The most recent request is always at the end of that lineup. The game\
    \ server processes each login request to have its player log into the server -\
    \ one by one, starting with the front of the lineup.\n\nAlso, recall that queues\
    \ normally use lists - either arrays or linked lists. Again, which one do you\
    \ choose?\n\nBy default, use `Linked Lists` for queues - as queueing and dequeueing\
    \ are computed in constant time (`O(1)`) - the quickest tier for algorithm speed.\n\
    \nOn the other hand, use `Arrays` for queues if any data items within that queue\
    \ need to be accessed often. For `Array Queues`, you’ll use `Circular Arrays`\
    \ - an array with the starting index (`0`) right after the ending index (the array\
    \ size - `1`). This is so that data items are added and removed without having\
    \ to shift EVERY data item left or right all the time(which would really strain\
    \ your program and computer effort).\n\nAnd `Circular Array Queues` can be just\
    \ as fast - queueing and dequeueing can also be in constant time. You just have\
    \ the extra flexibility to edit the lineup as you please.\n\nSo depending on which\
    \ data structure you use, the next chapters show you how you implement a stack.\n\
    \n## Chapter 2b: The Queue, as an Array\n\n### The Data Structure\n\nJust like\
    \ the `Array Stack`, you’ll need your actual array. But this time, we’ll need\
    \ four integers: the front index, the back index, the max size and the current\
    \ item count.\n\n```cpp\n// Abstract Data Type: Queue, as an Array\n\n// The Queue\
    \ Has:\n// - the Actual Array (with Size and Data Type)\n// - the Index of the\
    \ Front Item (Integer)\n// - the Index of the Back Item(Integer)\n// - the Max\
    \ Size of the Queue (Integer)\n// - the Current Item Count (Integer)\n\nCompositeStructure\
    \ ArrayQueue {\n    Integer FRONT\n    Integer BACK\n    Integer MAXSIZE\n   \
    \ Integer COUNT\n    (choose a data type) ARRAY[MAXSIZE]\n}\n```\n\nNow, let’s\
    \ look at how the `Enqueue()` and `Dequeue()` methods work, in detail:\n\n###\
    \ Array Queue: Enqueue() Function\n\nThe `Enqueue()` function from an `Array Queue`\
    \ adds items into that queue. It does this in the following procedure, in this\
    \ particular order:\n\n1. Check if there’s room in the array for the extra item.\n\
    2. If there’s no room in the array, either report a queue overflow error (if fixed-size\
    \ array) or increase the array size (if variable array).\n3. If there’s room in\
    \ the array, we add the item to the queue. Set the new item’s index as the current\
    \ `Back Index` (so the item is the very last item in the `Queue`).\n4. Increment\
    \ the `Back Index`. If the `Back Index` becomes bigger than or equal to the `Array\
    \ Size`, set the `Back Index` to `0` (it’s now at the start of the `Circular Array`).\n\
    5. And Finally, Increment the `Item Count`.\n\nAfter the `enqueue()` procedure\
    \ successfully inserts an item, you should have that item as the last item in\
    \ the circular array, regardless of what index it has. Also, the item count should\
    \ be increased by `1`.\n\n### Array Queue: Dequeue() Function\n\nThe `Dequeue()`\
    \ method from an `Array Queue` removes an item from that queue. The function returns\
    \ that item as the Function Output. It does this in the following procedure, in\
    \ this particular order:\n\n1. Check the `Array Count` if there are any items\
    \ to dequeue.\n2. If not, either return `NULL` or report a queue underflow error.\n\
    3. If there’s an item to dequeue, create a `Local Variable`. Set it to be your\
    \ return item (it should be the item at the front of the queue!). Remove the item\
    \ at the `Front` of the `Queue` afterwards.\n4. Increment the `Front Index`. If\
    \ the `Front Index` becomes bigger than or equal to the `Array Size`, set the\
    \ `Front Index` to `0` (it’s now at the start of the `Circular Array`).\n5. Decrement\
    \ the `Item Count`.\n6. And Finally, the function returns your item and ends.\n\
    \nAfter the `dequeue()` procedure successfully removes and retrieves an item,\
    \ the item should be the first item from the array. Also, the item count should\
    \ be decreased by `1`.\n\nRemember: function returns should be the last thing.\n\
    \n## Chapter 2c: The Queue, as a Linked List\n\n### The Data Structure\n\nThis\
    \ is similar to the Linked List Stack. You’ll need two Linked List nodes - the\
    \ `Front` and `Back`. You also need an integer to keep track of the `Item Count`.\n\
    \n```cpp\n// A Singly Linked Node has:\n// - the Next Node (Point to the Next\
    \ Node)\n// - the Data Item (choose data type you want)\n\nCompositeStructure\
    \ Node {\n    String ID\n    String NEXT\n    (choose a data type) ITEM\n}\n\n\
    // Abstract Data Type: Queue, as a Linked List\n// The Queue Has:\n// - the Front\
    \ (Linked List Node)\n// - the Back (Linked List Node)\n\nCompositeStructure LinkedListQueue\
    \ {\n    Node FRONT\n    Node BACK\n    Integer COUNT\n}\n```\n\nNow, let’s look\
    \ at how the `Enqueue()` and `Dequeue()` methods work, in detail:\n\n### Linked\
    \ List Stack: Enqueue() Function\n\nThe `Enqueue()` function from a `LinkedList\
    \ Queue` adds items into the back of the Queue. It does this in the following\
    \ procedure, in this particular order:\n\n1. Make a new `Local Variable`. Set\
    \ it as a `Node`. This will be the New List Back.\n2. Set your input item to be\
    \ the New Back Node’s data.\n3. Make sure to set the new back’s next node to `null`.\n\
    4. Set the New Back as the Linked List’s `Back`. If this queue was previously\
    \ empty, the New Node will also be the new `Front`.\n5. And Finally, Increment\
    \ the `Item Count`.\n\nAfter the `Enqueue()` procedure successfully inserts an\
    \ item, you should have that item at the back of the linked list and the item\
    \ count should be increased by `1`.\n\n### Linked List Queue: Dequeue() Function\n\
    \nThe `Dequeue()` method from a `LinkedList Queue` removes the item at the very\
    \ front of the Queue. The function returns that item as the Function Output. It\
    \ does this in the following procedure, in this particular order:\n\n1. Check\
    \ if the `Front Node` isn’t `Null` (if the `Front Node` Exists).\n2. If not, either\
    \ return `NULL` or report a queue underflow error.\n3. If there’s an item to dequeue,\
    \ create a `Local Variable`. Set it to be your soon-to-be return item (it should\
    \ be the Front Node!).\n4. Get the Node `NEXT` to the `Front`. This will NOW be\
    \ the new `LinkedList Front`.\n5. Decrement the `Item Count`.\n6. And Finally,\
    \ the function returns your item and ends.\n\nAfter the `dequeue()` procedure\
    \ successfully removes and retrieves an item, the item should be the item that\
    \ was at the very front of the Linked List. Also, the item count should be decreased\
    \ by `1`.\n\n## C++ 02a: The Queue, as a Circular Array\n\n### The Data Structure,\
    \ in C++\n\nAgain, by default, we’ll set the `Array Size` to `10`.\n"
