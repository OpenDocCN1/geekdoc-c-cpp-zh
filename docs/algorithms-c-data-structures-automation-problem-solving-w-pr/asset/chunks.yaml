  trans: "\n\n仔细观察数据对象列表的处理方式。一旦你注意到任何进入或离开的数据对象都遵循“后进先出”（Last-In-First-Out）的过程，请使用\
    \ `stack`。\n\n此外，复杂的算法和函数也会使用 `stacks`。如果计算机按 `stack` 处理一个程序，它将“堆栈”所有调用的函数。然后它将开始完成每个被调用的函数，从最近的一个开始（稍后我们将深入学习这些内容）。\n\
    \n为了以以后参考，请想象自己正处于技术面试中。如果你被问到某个函数的程序是如何运作的，如果你知道 `stack` 的工作原理以及该函数如何从开始到结束执行，你将非常幸运。\n\
    \n然而，请记住栈通常使用列表——数组或链表。那么你应该选择哪一个呢？回顾《大师手册系列》中的这些观点：\n\n链表 = 任意大小，添加和删除更快\n\n\
    数组 = 固定大小，访问/处理更快\n\n因此，取决于你使用哪种数据结构，接下来的章节将展示如何实现 `stack`。\n\n## 第 1b 章：作为数组的栈\n\
    \n### 数据结构\n\n你需要实际的数组，以及两个整数：最大尺寸和当前项目计数。\n\n```\n// 抽象数据类型：栈，作为数组\n\n// 栈包含：\n\
    // - 实际数组（带有尺寸和数据类型）\n// - 栈的最大尺寸（整数）\n// - 当前项目计数（整数）\n\nCompositeStructure ArrayStack\
    \ {\n    Integer MAXSIZE\n    Integer COUNT\n    (choose a data type) ARRAY[MAXSIZE]\n\
    }\n```\n\n现在，让我们详细查看 `Push()` 和 `Pop()` 方法的工作原理：\n\n### 数组栈：Push() 函数\n\n`Array\
    \ Stack` 的 `Push()` 函数将项目添加到该栈中。它按照以下过程执行，并遵循这一特定顺序：\n\n1) 检查数组中是否有空间容纳额外的项目\n\
    2) 如果数组没有空间，要么报告栈溢出错误（如果是固定大小数组），要么增加数组尺寸（如果是可变数组）\n3) 如果数组有空间，将项目添加到栈中。将新项目的索引设置为当前的\
    \ `Item Count`（这样该项目就变成了 `Stack` 中的最后一个项目）\n4) 最后，递增 `Item Count`\n\n在 `push()`\
    \ 程序成功插入项目后，该项目应该位于数组的末尾，且项目计数应该增加 1。\n\n### 数组栈：Pop() 函数\n\n与 `Push()` 方法相反，`Array\
    \ Stack` 的 `Pop()` 方法从栈中移除一个项目。该函数将该项目作为 `Function Output` 返回。它按照以下过程执行，并遵循这一特定顺序：\n\
    \n1) 检查 `Array Count` 查看是否有项目可以弹出\n2) 如果没有，要么返回 `NULL` 或者报告栈下溢错误\n3) 如果有项目可以弹出，先递减\
    \ `Item Count`。我们要移除一个项目了！\n4) 然后，创建一个 `Local Variable`。将其设置为你将返回的项目（它应该是栈末尾的项目！）随后移除\
    \ `End of the Stack` 处的项目\n5) 最后，函数返回你的项目并结束。\n\n在 `pop()` 程序成功移除并检索一个项目后，该项目应该是原本位于数组末尾的那个项目。同时，项目计数应该减少\
    \ 1。\n\n## 第 1c 章：作为链表的栈\n\n### 数据结构\n\n你需要一个链表节点——`Head`——以及一个用于跟踪 `Item Count`\
    \ 的整数。幸运的是，链表不存在栈溢出问题。很有可能，你还需要还需要设计链表节点。\n\n```\n// 单向链表节点包含：\n// - 下一个节点（指向下一个节点）\n\
    // - 数据项目（任选你想要的数据类型）\n\nCompositeStructure Node {\n    Node NEXTID\n    (choose\
    \ a data type) ITEM\n}\n\n// 抽象数据类型：栈，作为链表\n// 栈包含：\n// - 一个头部（链表节点）\nCompositeStructure\
    \ LinkedListStack {\n    Node HEAD\n    Integer COUNT\n}\n```\n\n现在，让我们详细查看 `Push()`\
    \ 和 `Pop()` 方法的工作原理：\n\n### 链表栈：Push() 函数\n\n`Linked List Stack` 的 `Push()` 函数将项目添加到该栈中。它按照以下过程执行，并遵循这一特定顺序：\n\
    \n1) 创建一个新的 `Local Variable`。将其设置为一个 `Node`。这将是 `New Linked List head`（新链表头）。\n\
    2) 将你的输入项目设置为 `New Head Node` 的数据\n3) 将前一个头部的下一个节点指向 `New Head`。 \n4) 将 `New Head`\
    \ 设置为链表的 `Stack Head`。\n5) 最后，递增 `Item Count`\n\n在 `push()` 程序成功插入项目后，该项目应该位于链表的头部，且项目计数应该增加\
    \ 1。\n\n### 链表栈：Pop() 函数\n\n与 `Push()` 方法相反，`Linked List Stack` 的 `Pop()` 方法从栈中移除一个项目。该函数将该项目作为\
    \ `Function Output` 返回。它按照以下过程执行，并遵循这一特定顺序：\n\n1) 检查 `Head Node` 是否为 `Null`（如果\
    \ `Head Node` 存在）\n2) 如果不是，要么返回 `NULL` 或者报告栈下溢错误\n3) 如果有项目弹出，创建一个 `Local Variable`。将其设置为即将返回的项目（它应该是\
    \ `Head Node`！）\n4) 获取 `Head` 的 `NEXT` 节点。这将成为新的 `LinkedList Head`。\n5) 递减 `Item\
    \ Count`\n6) 最后，函数返回你的项目并结束。\n\n"
