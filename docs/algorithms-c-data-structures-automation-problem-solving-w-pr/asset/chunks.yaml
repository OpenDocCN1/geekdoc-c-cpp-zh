  trans: "\n\n# 队列 (Queue)\n\n`Queue`（队列）也是一个项的列表或序列。每个项都在等待轮到处理——就像人们排队等某事一样。\n\n\
    队列中的数据对象按照“先进先出”（First-In-First-Out）的过程进行插入和检索。\n\n一个 `Queue` 通常会与其定义的两个主要函数：`enqueue`（入队，插入队列末尾）和\
    \ `dequeue`（出队，从队列中移除）。\n\n## 队列如何工作\n\n将队列想象成一个排队。适用于任何场景。它可以是你银行的排队、你喜欢的快餐店的排队、夜俱乐部，或者任何像排队的场景。\n\
    \n在排队中，有人从末尾进入队伍。随着队伍的增长，越来越多的人从末尾进入。排在队最前面的人接受服务——他们处理客户服务、点餐、进入夜俱乐部，任何排队会做的事情。每当有人被服务时，队列就会变小。\n\
    \n队列的工作方式本质上相同。你将数据项输入到队伍中，最近的数据项位于队末尾。当检索数据项时，会首先检索最旧的项。\n\n## 何时使用队列\n\n每当你有一组数据项且它们必须按照“排队顺序”处理时，请使用\
    \ `Queue`。一旦你发现它对摄取的任何对象使用“先进先出”的过程，就使用队列。\n\n在线游戏就是一个极好的例子。如果你必须登录任何游戏服务器来玩，你的登录请求将发送到由其他也想玩的用户的登录请求组成的“队列”中。最近的请求始终位于该队列的末尾。游戏服务器处理每个登录请求以让玩家登录服务器——一个接一个，从队头开始。\n\
    \n此外，请记住队列通常使用列表——数组或链表。再次，你选择哪一个？\n\n默认情况下，为队列使用 `Linked Lists`（链表）——因为入队和出队的计算复杂度是常数级（`O(1)`）——这是算法速度最快的层级。\n\
    \n另一方面，如果队列中的任何数据项需要频繁访问，则对队列使用 `Arrays`（数组）。对于 `Array Queues`（数组队列），你将使用 `Circular\
    \ Arrays`（循环数组）——一种起始索引（`0`）紧跟结束索引（数组大小 - `1`）的数组。这样，添加和删除数据项时就不需要不断将每一个数据项向左或右移动（这会非常消耗你的程序和计算资源）。\n\
    \n`Circular Array Queues`（循环数组队列）同样快——入队和出队也可以是常数时间。你只是额外的灵活性可以随所欲编辑队伍。\n\n所以取决于你使用哪种数据结构，接下来的章节将向你展示如何实现栈。\n\
    \n## 第 2b 章：作为数组的队列\n\n### 数据结构\n\n与 `Array Stack`（数组栈）一样，你需要实际的数组。但这次，我们需要四个整数：头部索引、尾部索引、最大尺寸和当前计数。\n\
    \n```cpp\n// 抽象数据类型：队列，通过数组实现\n\n// 队列拥有：\n// - 实际数组（带有大小和数据类型）\n// - 头部项的索引（整数）\n\
    // - 尾部项的索引（整数）\n// 队列的最大大小（整数）\n// - 当前计数（整数）\n\nCompositeStructure ArrayQueue\
    \ {\n    Integer FRONT\n    Integer BACK\n    Integer MAXSIZE\n    Integer COUNT\n\
    \    (选择一种数据类型) ARRAY[MAXSIZE]\n}\n```\n\n现在，让我们详细查看 `Enqueue()` 和 `Dequeue()`\
    \ 方法是如何工作的：\n\n### 数组队列：Enqueue() 函数\n\n`Array Queue`（数组队列）的 `Enqueue()` 函数向该队列中添加项。它按照以下过程、按特定顺序执行：\n\
    \n1. 检查数组是否有空间容纳额外的项。\n2. 如果数组中没有空间，要么报告队列溢出错误（如果是固定大小数组），要么增加数组大小（如果是可变数组）。\n\
    3. 如果数组中有空间，我们将项添加到队列中。将新项的索引设置为当前的 `Back Index`（尾部索引）（因此该项是 `Queue` 中的最后一个项）。\n\
    4. 增加 `Back Index`。如果 `Back Index` 大于或等于数组大小，则将 `Back Index` 设置为 `0`（它现在位于循环数组的开头）。\n\
    5. 最后，增加 `Item Count`（项计数）。\n\n在 `enqueue()` 过程成功插入一个项后，你应该拥有该项作为循环数组中的最后一项，无论它的索引是什么。此外，项计数应该增加\
    \ `1`。\n\n### 数组队列：Dequeue() 函数\n\n`Array Queue` 的 `Dequeue()` 方法从该队列中移除一个项。函数返回该项作为函数输出。它按照以下过程、按特定顺序执行：\n\
    \n1. 检查 `Array Count` 是否有要弹出的项。\n2. 如果没有，要么返回 `NULL`，要么报告队列上溢错误。\n3. 如果有要弹出的项，创建一个\
    \ `Local Variable`（局部变量）。将其设置为要返回的项（它应该是队列头部的项！）。之后移除 `Queue` 头部的项。\n4. 增加 `Front\
    \ Index`（头部索引）。如果 `Front Index` 大于或等于数组大小，则将 `Front Index` 设置为 `0`（它现在位于循环数组的开头）。\n\
    5. 最后，增加 `Item Count`。\n\n在 `enqueue()` 过程成功插入一个项后，你应该拥有该项作为循环数组中的最后一项，无论它的索引是什么。此外，项计数应该增加\
    \ `1`。 (注：此处原文逻辑似乎有部分重复或描述错位，已根据上下文逻辑进行翻译并对齐)\n\n"
- fmt: "\n# Abstract Data Type: Queue, as an Array\n\n## The Queue Has:\n\n- - the\
    \ Actual Array (with Size and Data Type)\n- - the Index of the Front Item (Integer)\n\
    - - the Index of the Back Item(Integer)\n- - the Max Size of the Queue (Integer)\n\
    - - the Current Item Count (Integer)\n\n```cpp\nclass ArrayQueue {\n    int FRONT;\n\
    \    int BACK;\n    int MAXSIZE = 10;\n    int COUNT;\n    <chosen data type>\
    \ ARRAY[10];\n\n    public:\n    // INPUT: - nothing\n    // OUTPUT: - nothing\n\
    \    // EFFECT: Constructor: Array Queue\n    ArrayQueue() {\n        this->FRONT\
    \ = 0;\n        this->BACK = 0;\n        this->COUNT = 0;\n    };\n\n    // INSERT\
    \ ENQUEUE() FUNCTION HERE\n    //________________\n\n    // INSERT DEQUEUE() FUNCTION\
    \ HERE\n    //________________\n};\n```\n\n## Array Queue: Enqueue() Function,\
    \ in C++\n\n// INPUT: - an item (chosen Data Type)\n// OUTPUT: - nothing\n// EFFECT:\
    \ inserts an item (some Data Type) onto our Array Queue\n\n```cpp\nvoid enqueue(<chosen\
    \ data type> item) {\n    // 1) Check if there’s room in the array for the extra\
    \ item\n    if (this->MAXSIZE <= this->COUNT) {\n        // 2) If not, print a\
    \ message and return null\n        std::cout << \"Queue Overflow!\\n\" ;\n   \
    \     return;\n    }\n    // 3) If there’s room in the array, we add the item\
    \ to the queue.\n    // Set the new item’s index as the current Back Index\n \
    \   // (so the item is the very last item in the Queue)\n    this->ARRAY[BACK]\
    \ = item;\n    // 4) Increment the Back Index.\n    // If the Back Index becomes\
    \ bigger than or equal to the Array Size,\n    // set the Back Index to 0 (it’s\
    \ now at the start of the Circular Array).\n    this->BACK +=1;\n    if (this->BACK\
    \ >= MAXSIZE) this->BACK = 0;\n\n    // 5) And Finally, Increment the Item Count\n\
    \    this->COUNT += 1;\n};\n```\n\n## Array Queue: Dequeue() Function, in C++\n\
    \n// INPUT: - nothing\n// OUTPUT:- an item (some Data Type)\n// EFFECT: removes\
    \ and retrieves an item (some Data Type) from our Array Queue\n\n```cpp\n<chosen\
    \ data type> dequeue() {\n    // 1) Check the Array Count if there are any items\
    \ to dequeue.\n    if (this->COUNT <= 0) {\n        // 2) If not, print a message\
    \ and return null\n        std::cout << \"Queue Underflow!\\n\";\n        return\
    \ NULL;\n    }\n    // 3) If there’s an item to dequeue, create a Local Variable.\n\
    \    // Set it to be your return item\n    // (it should be the item at the front\
    \ of the queue!)\n    <chosen data type> r = this->ARRAY[FRONT];\n    // Remove\
    \ the item at the Front of the Queue afterwards\n    this->ARRAY[FRONT] = NULL;\n\
    \    // 4) Increment the Front Index.\n    // If the Front Index becomes bigger\
    \ than or equal to the Array Size,\n    // set the Front Index to 0 (it’s now\
    \ at the start of the Circular Array).\n    this->FRONT+=1;\n    if (this->FRONT\
    \ >= MAXSIZE) this->FRONT = 0;\n    // 5) Decrement the Item Count\n    this->COUNT\
    \ -= 1;\n    // 6) And Finally, the function returns your item and ends.\n   \
    \ return r;\n}\n```\n\n# C++ 02b: The Queue, as a Linked List\n\n## The Data Structure,\
    \ in C++\n\nFirst, we have class definitions for our Linked List Queue - for both\
    \ a Node and the actual Linked List Queue. We also have constructors for both\
    \ classes. We use the same Node Class from the LinkedListStack from above. And\
    \ just like the Stack version, you need both of them together; the Queue requires\
    \ nodes to be made.\n\n// A Singly Linked List Node has:\n// - the Next Node (Point\
    \ to the Next Node)\n// - the Data Item (choose what data type you want)\n\n```cpp\n\
    class Node {\n    public:\n    Node* NEXT;\n    <chosen data type> ITEM;\n\n \
    \   // INPUT: - a data item\n    // OUTPUT: - nothing\n    // EFFECT: Constructor:\
    \ Linked List Node, with the Data Item as its input\n    Node(<chosen data type>\
    \ item) {\n        this->ITEM = item;\n    };\n};\n```\n\n# Abstract Data Type:\
    \ Queue, as a Linked List\n\n// The Queue Has:\n// - the Front (Linked List Node)\n\
    // - the Back (Linked List Node)\n\n```cpp\nclass LinkedListQueue {\n    Node*\
    \ x = new Node(NULL);\n    Node* FRONT = x;\n    Node* BACK = x;\n    int COUNT;\n\
    \n    public:\n    // INPUT: - nothing\n    // OUTPUT: - nothing\n    // EFFECT:\
    \ Constructor: Linked List Queue,\n    LinkedListQueue() {\n        this->COUNT\
    \ = 0;\n    };\n\n    // INSERT ENQUEUE() FUNCTION HERE\n    //________________\n\
    \n    // INSERT DEQUEUE() FUNCTION HERE\n    //________________\n};\n```\n\n##\
    \ Linked List Queue: Enqueue() Function, in C++\n\n// INPUT: - an item (some Data\
    \ Type)\n// OUTPUT: - nothing\n// EFFECT: inserts an item (some Data Type) onto\
    \ our Linked List Queue\n\n```cpp\nvoid enqueue(<chosen data type> INPUT) {\n\
    \    // 1) Make a new Local Variable. Set it as a Node.\n    // This will be the\
    \ New Linked List back.\n    Node* NEWBACK = new Node(INPUT);\n    // 2) Set your\
    \ input item to be the New Back Node’s data\n    // (already done in Constructor)\n\
    \    // 3) make sure to set the new back’s next node to null\n    NEWBACK->NEXT\
    \ = NULL;\n    // 4) Set the new back’s next\n    this->BACK = NEWBACK;\n    //\
    \ If this was empty,\n    if (this->COUNT <= 0) {\n        this->FRONT = NEWBACK;\n\
    \    }\n    // 5) And Finally, Increment the Item Count\n    this->COUNT += 1;\n\
    }\n```\n\n## Linked List Queue: Dequeue() Function, in C++\n\n// INPUT: - nothing\n\
    // OUTPUT:- an item (some Data Type)\n// EFFECT: removes and retrieves an item\
    \ (some Data Type) from our Array Queue\n\n```cpp\n<chosen data type> dequeue()\
    \ {\n    // 1) Check the Array Count if there are any items to dequeue.\n    if\
    \ (this->COUNT <= 0) {\n        // 2) If not, print a message and return null\n\
    \        std::cout << \"Queue Underflow!\\n\";\n        return NULL;\n    }\n\
    \    // 3) If there’s an item to dequeue, create a Local Variable.\n    // Set\
    \ it to be your return item\n    // (it should be the item at the front of the\
    \ queue!)\n    <chosen data type> r = this->FRONT->ITEM;\n    // Remove the item\
    \ at the Front of the Queue afterwards\n    this->FRONT = this->FRONT->NEXT;\n\
    \    // 4) Increment the Front Index.\n    this->FRONT+=1;\n    // 5) Decrement\
    \ the Item Count\n    this->COUNT -= 1;\n    // 6) And Finally, the function returns\
    \ your item and ends.\n    return r;\n}\n```\n\n# C++ Workshop #2\n\n## Message\
    \ Queue\n\nNow we’re going to see the Queue in action.\n\n### Part 1:\n\n1) Set\
    \ up an IDE of choice: `rextester.com`, `ideone.com`, or `codepad.org` will do\
    \ well.\n\n2) In the above portion of your code, make sure you have these lines\
    \ included:\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n3) Copy-paste\
    \ either the `ArrayQueue` or `LinkedListQueue` class from previous chapters, along\
    \ with their respective `enqueue()` and `dequeue()` methods.\n\n4) In all places\
    \ of your code that require you to choose your data type, set them as a string:\n\
    `<chosen data type> === string`\n\n5a) If you chose `ArrayQueue`, to avoid errors,\
    \ change the following lines from the `dequeue()` method:\n```cpp\nthis->ARRAY[FRONT]\
    \ = NULL;\n```\nto\n```cpp\nthis->ARRAY[FRONT] = \"\";\n```\n\n5b) If you chose\
    \ `LinkedListQueue`, to avoid errors, change the following lines from the constructor\
    \ method:\n```cpp\nNode* x = new Node(NULL);\n```\nto\n```cpp\nNode* x = new Node(\"\
    DEFAULT\");\n```\n\n6) Afterwards, copy these lines as your `main()` method:\n\
    ```cpp\nint main()\n{\n    // Fill Blank as ArrayQueue* or LinkedListQueue*\n\
    \    // DO NOT forget the star! *\n    ____ q;\n\n    // Fill blank as ArrayQueue()\
    \ or LinkedListQueue()\n    // depending on whatever you chose previously\n  \
    \  // It's a Constructor: DO NOT forget the parentheses!\n    q = new ____;\n\n\
    \    q->enqueue(\"HI \");\n    q->enqueue(\"THERE! \");\n    q->enqueue(\"How's\
    \ \");\n    q->enqueue(\"it \");\n    q->enqueue(\"going? \");\n    q->enqueue(\"\
    Did \");\n    q->enqueue(\"you \");\n    q->enqueue(\"know \");\n    q->enqueue(\"\
    you're \");\n    q->enqueue(\"my \");\n    q->enqueue(\"Best Friend? \");\n\n\
    \    string a[12];\n\n    for(int i = 0; i < 12; i++) {\n        a[i] = q->dequeue();\n\
    \        std::cout << a[i] ;\n    }\n\n}\n```\n\n## What happened?\n\nNotice how,\
    \ after running the code, the message clearly displays in perfect order.\n\nIf\
    \ you used an `ArrayQueue`, we tried to enqueue 10 strings - but the 11th string\
    \ was not enqueued. What happened? A queue overflow. Next, the iterating code\
    \ tried to do dequeue 12 times. But once there was nothing to dequeue, a Queue\
    \ Underflow occurred.\n"
