    \ -= 1;\n    // 7) 最后，返回你的元素并结束。\n    return r;\n}\n```\n\n# C++ 工作坊 #2\n\n##\
    \ 消息队列\n\n现在我们将观察队列的操作。\n\n### 第一部分：\n\n1) 确保你的代码包含了以下行：\n```cpp\n#include <iostream>\n\
