    \ notice it uses a Last-In-First-Out process for any data objects that enter or\
    \ leave, use a `stack`.\n\nAlso, complex algorithms and functions use `stacks`.\
    \ If a computer processes a procedure as a `stack`, it will “stack” all the functions\
    \ that are called. Then it will proceed to complete each function called, starting\
    \ with the most recent (you’ll learn more about all this in-depth later).\n\n\
    For future reference, picture yourself in a tech interview. If you ever are asked\
    \ how a certain function’s procedure works, you’ll be very fortunate to know how\
    \ a `stack` works and how that function will proceed from start to finish.\n\n\
    However, recall that stacks normally use lists - either arrays or linked lists.\
    \ So which one do you choose? Recall these lines from the Master’s Handbook Series:\n\
    \nLinked Lists = any size, faster add & remove\n\nArrays = fixed size, faster\
    \ access/process\n\nSo depending on which data structure you use, the next chapters\
    \ show you how you implement a `stack`.\n\n## Chapter 1b: The Stack, as an Array\n\
    \n### The Data Structure\n\nYou’ll need the actual array, as well as two integers:\
    \ the max size and the current item count.\n\n```\n// Abstract Data Type: Stack,\
    \ as an Array\n\n// The Stack Has:\n// - the Actual Array (with Size and Data\
    \ Type)\n// - the Max Size of the Stack (Integer)\n// - the Current Item Count\
    \ (Integer)\n\nCompositeStructure ArrayStack {\n    Integer MAXSIZE\n    Integer\
    \ COUNT\n    (choose a data type) ARRAY[MAXSIZE]\n}\n```\n\nNow, let’s look at\
    \ how the `Push()` and `Pop()` methods work, in detail:\n\n### Array Stack: Push()\
    \ Function\n\nThe `Push()` function from an `Array Stack` adds items into that\
    \ stack. It does this in the following procedure, in this particular order:\n\n\
    1) Check if there’s room in the array for the extra item\n2) If there’s no room\
    \ in the array, either report a stack overflow error (if fixed-size array) or\
    \ increase the array size (if variable array)\n3) If there’s room in the array,\
    \ add the item to the stack. Set the new item’s index as the current `Item Count`\
    \ (so the item is the very last item in the `Stack`)\n4) And Finally, Increment\
    \ the `Item Count`\n\nAfter the `push()` procedure successfully inserts an item,\
    \ you should have that item at the end of the array and the item count should\
    \ be increased by 1.\n\n### Array Stack: Pop() Function\n\nIn contrast to the\
    \ `Push()` method, the `Pop()` method from an `Array Stack` removes an item from\
    \ that stack. The function returns that item as the `Function Output`. It does\
    \ this in the following procedure, in this particular order:\n\n1) Check the `Array\
