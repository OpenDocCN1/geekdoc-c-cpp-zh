- fmt: "\nIf you used a Linked List Queue, we manage to enqueue all 11 strings. How?\
    \ Linked Lists have no list sizes, remember? But then again, once there was nothing\
    \ to dequeue, a Queue Underflow also occurred.\n\n## Part 2: Switching List Types\n\
    \nIf you switch to the other list type (array or linked list), you should have\
    \ the same results. Try it out, and note the differences between the two data\
    \ structures.\n\n## REFERENCE SECTION:\n\n### REF-01: The Stack\n\nArray Stack,\
    \ Data Structure in Pseudocode\n\n```cpp\n// Abstract Data Type: Stack, as an\
    \ Array\n\n// The Stack Has:\n// - the Actual Array (with Size and Data Type)\n\
    // - the Max Size of the Stack (Integer)\n// - the Current Item Count (Integer)\n\
    \nCompositeStructure ArrayStack {\nInteger MAXSIZE\nInteger COUNT\n(choose a data\
    \ type) ARRAY[MAXSIZE]\n}\n```\n\n#### Array Stack: Push() Function in Pseudocode\n\
    \n```cpp\n// INPUT: - an item (some Data Type)\n// OUTPUT: - nothing\n// EFFECT:\
    \ inserts an item (some Data Type) onto our Array Stack\n\nvoid push(<chosen data\
    \ type> ITEM) {\n    // 1) Check if there’s room in the array for the extra item\n\
    \    if (this.MAXSIZE < this.COUNT) {\n        // 2) If there’s no room in the\
    \ array,\n        // …either report a stack overflow error (if fixed-size array)\n\
    \        // (assume error() reports an error for you)\n        error(“Stack Overflow”)\n\
    \        // …or increase the array size (if variable array)\n        // (assume\
    \ increaseArray() increases array size by 1)\n        this.increaseArray()\n \
    \   }\n    // 3) If there’s room in the array, add the item to the stack.\n  \
    \  // Set the new item’s index as the current Item Count\n    this.ARRAY[COUNT]\
    \ = ITEM\n    // 4) And Finally, Increment the Item Count\n    this.COUNT += 1\n\
    }\n```\n\n#### Array Stack: Pop() Function in Pseudocode\n\n```cpp\n// INPUT:\
    \ - nothing\n// OUTPUT:- an item (some Data Type)\n// EFFECT: removes and retrieves\
    \ an item (some Data Type) from our Array Stack\n\n<chosen data type> pop() {\n\
    \    // 1) Check the Array Count if there are any items to pop.\n    if (this.COUNT\
    \ <= 0) {\n        // 2) If not, either return NULL\n        return NULL\n   \
    \     // or report a stack underflow error\n        // (assume error() reports\
    \ an error for you)\n        error(“Stack Underflow”)\n    }\n    // 3) If there’s\
    \ an item to pop, Decrement the Item Count\n    this.COUNT -= 1\n    // 4) Create\
    \ a Local Variable.\n    // Set it to be your return item\n    // (it should be\
    \ the item at the end of the stack!)\n    <chosen data type> r = this.ARRAY[COUNT]\n\
    \    // Remove the item at the End of the Stack afterwards\n    this.ARRAY[COUNT]\
    \ = null\n    // 5) And Finally, the function returns your item and ends.\n  \
    \  return r\n}\n```\n\nNote how we decremented the `COUNT` BEFORE we outputted\
    \ our item and ended the function. If you recall, function returns should be the\
    \ very last thing in a function procedure - as it ends the function.\n\nFor experienced\
    \ programmers, you can also opt to forego the local variable if you wish, depending\
    \ on what language you wish to use and how much performance you want.\n\n####\
    \ Linked List Stack, Data Structure in Pseudocode\n\n```cpp\n// A Singly Linked\
    \ List Node has:\n// - the Next Node (Point to the Next Node)\n// - the Data Item\
    \ (choose what data type you want)\n\nCompositeStructure Node {\nNode NEXTID\n\
    (choose a data type) ITEM\n}\n\n// Abstract Data Type: Stack, as a Linked List\n\
    // The Stack Has:\n// - a Head (Linked List Node)\nCompositeStructure LinkedListStack\
    \ {\nNode HEAD\nInteger COUNT\n}\n```\n\nNow, let’s look at how the `push()` and\
    \ `pop()` methods work, in detail:\n\n#### Linked List Stack: Push() Function\
    \ in Pseudocode\n\n```cpp\n// INPUT: - an item (some Data Type)\n// OUTPUT: -\
    \ nothing\n// EFFECT: inserts an item (some Data Type) onto our Linked List Stack\n\
    \nvoid push(<chosen data type> INPUT) {\n    // 1) Make a new Local Variable.\
    \ Set it as a Node.\n    // This will be the New Linked List head.\n    Node NEWHEAD\
    \ = new Node\n    // 2) Set your input item to be the New Head Node’s data\n \
    \   NEWHEAD.ITEM = INPUT\n    // 3) Set the previous head’s next node to the New\
    \ Head\n    NEWHEAD.NEXT = this.HEAD\n    // 4) Set the New Head as the Linked\
    \ List’s Stack Head\n    this.HEAD = NEWHEAD\n    // 5) And Finally, Increment\
    \ the Item Count\n    this.COUNT += 1\n}\n```\n\n#### Linked List Stack: Pop()\
    \ Function\n\n```cpp\n// INPUT: - nothing\n// OUTPUT:- an item (some Data Type)\n\
    // EFFECT: removes and retrieves an item (some Data Type) from our Array Stack\n\
    \n<chosen data type> pop() {\n    // 1) Check if the Head Node isn’t Null (if\
    \ the Head Node Exists)\n    if (this.HEAD = NULL) {\n        // 2) If so, either\
    \ return NULL\n        return NULL\n    }\n    // or report a stack underflow\
    \ error\n    // (assume error() reports an error for you)\n    error(“Stack Underflow”)\n\
    }\n    // 3) If there’s an item to pop, create a Local Variable.\n    // Set it\
    \ to be your soon-to-be return item\n    // (it should be the Head Node!)\n  \
    \  <chosen data type> r = HEAD.ITEM\n    // 4) Get the Node NEXT to.\n    // This\
    \ will be the new Head.\n    this.HEAD = HEAD.NEXT\n    // 5) Decrement the Item\
    \ Count\n    this.COUNT -= 1\n    }\n}\n```\n\n### REF-02: The Queue\n\nArray\
    \ Queue: Data Structure in Pseudocode\n\n```cpp\n// Abstract Data Type: Queue,\
    \ as an Array\n// The Stack Has:\n// - the Actual Array (with Size and Data Type)\n\
    // - the Max Size of the Stack (Integer)\n// - the Current Item Count (Integer)\n\
    \nCompositeStructure ArrayQueue {\nInteger MAXSIZE\nInteger COUNT\nInteger FRONT\n\
    Integer BACK\n}\n```\n\n#### Array Queue: Enqueue() Function in Pseudocode\n\n\
    ```cpp\n// INPUT: - an item (some Data Type)\n// OUTPUT: - nothing\n// EFFECT:\
    \ inserts an item (some Data Type) onto our Array Queue\n\nvoid enqueue(<chosen\
    \ data type> ITEM) {\n    // 1) Check if there’s room in the array for the extra\
    \ item\n    if (this.MAXSIZE < this.COUNT) {\n        // 2) If there’s no room\
    \ in the array,\n        // …either report a stack overflow error (if fixed-size\
    \ array)\n        // (assume error() reports an error for you)\n        error(“Queue\
    \ Overflow”)\n        // …or increase the array size (if variable array)\n   \
    \     // (assume increaseArray() increases array size by 1)\n        this.increaseArray()\n\
    \    }\n    // 3) If there’s room in the array, add the item to the stack.\n \
    \   // Set the new item’s index as the current Back Index\n    this.ARRAY[BACK]\
    \ = ITEM\n    // 4) Increment the Back Index.\n    // If the Back Index becomes\
    \ greater than equal to the Array Size,\n    // set the Back Index to 0.\n   \
    \ this.BACK+=1\n    if (this.BACK >= MAXSIZE) {\n        this.BACK = 0\n    }\n\
    \    // 5) If the queue was empty, set the Front Index to the Back Index\n   \
    \ if (this.COUNT == 0) {\n        this.FRONT = this.BACK\n    }\n    // 6) Increment\
    \ the Item Count\n    this.COUNT += 1\n}\n```\n*(Wait, the logic in the provided\
    \ text for Array enqueue was slightly fragmented, re-aligning based on provided\
