    \ 最后，函数返回你的元素并结束。\n    return r;\n}\n```\n\n# C++ 02b：基于链表的队列\n\n## C++ 语言中的数据结构\n\
    \n首先，我们为链表队列定义了类 - 分别节点（Node）和实际的链表队列。我们还为这两个类定义了构造函数。我们使用了上面 `LinkedListStack`\
    \ 中相同的 `Node` 类。和栈的版本一样，你需要同时使用它们；队列的构建需要节点来完成。\n\n// 单向链表节点包含：\n// - 下一个节点（指向下一个节点）\n\
