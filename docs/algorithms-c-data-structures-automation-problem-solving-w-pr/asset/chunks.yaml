  trans: "\n如果你使用了链表队列（Linked List Queue），我们成功入队了所有 11 个字符串。怎么做到的？链表没有大小，记得吗？但话说回来，一旦没有可以出队的元素时，也发生了队列上界（Queue\
    \ Underflow）。\n\n## 第二部分：切换列表类型\n\n如果你切换到另一种列表类型（数组或链表），你应该会得到相同的结果。尝试一下，并注意这两种数据结构之间的差异。\n\
    \n## 参考章节：\n\n### REF-01: 栈（Stack）\n\n数组栈，伪代码中的数据结构\n\n```cpp\n// 抽象数据类型：栈，使用数组实现\n\
    \n// 栈包含：\n// - 实际数组（带有大小和数据类型）\n// - 栈容量（整数）\n// - 当前项目计数（整数）\n\nCompositeStructure\
    \ ArrayStack {\nInteger MAXSIZE\nInteger COUNT\n(选择一种数据类型) ARRAY[MAXSIZE]\n}\n\
    ```\n\n#### 数组栈：Push() 函数的伪代码\n\n```cpp\n// 输入: - 一个项目（某种数据类型）\n// 输出: - 无\n//\
    \ 效果：将一个项目（某种数据类型）插入我们的数组栈中\n\nvoid push(<选择的数据类型> ITEM) {\n    // 1) 检查数组是否有空间容纳额外的项目\n\
    \    if (this.MAXSIZE < this.COUNT) {\n        // 2) 如果数组没有空间了，\n        // ……要么报告栈溢出错误（如果是固定大小数组）\n\
    \        //（假设 error() 会替你报告错误）\n        error(“Stack Overflow”)\n        // ……或者增加数组大小（如果是动态数组）\n\
    \        //（假设 increaseArray() 将数组大小增加 1）\n        this.increaseArray()\n    }\n\
    \    // 3) 如果数组有空间，则将项目添加到栈中。\n    // 将新项目的索引设置为当前项目计数\n    this.ARRAY[COUNT]\
    \ = ITEM\n    // 4) 最后，项目计数加 1\n    this.COUNT += 1\n}\n```\n\n#### 数组栈：Pop()\
    \ 函数的伪代码\n\n```cpp\n// 输入: - 无\n// 输出: - 一个项目（某种数据类型）\n// 效果：从我们的数组栈中移除并获取一个项目（某种数据类型）\n\
    \n<选择的数据类型> pop() {\n    // 1) 检查数组计数，看是否有项目可以弹出。\n    if (this.COUNT <= 0) {\n\
    \        // 2) 如果没有，要么返回 NULL\n        return NULL\n        // 或者报告栈下界错误\n   \
    \     //（假设 error() 会替你报告错误）\n        error(“Stack Underflow”)\n    }\n    //\
    \ 3) 如果有项目可以弹出，项目计数减 1\n    this.COUNT -= 1\n    // 4) 创建一个局部变量。\n    // 将其设置为要返回的项目\n\
    \    //（它应该是栈末尾的项目！）\n    <选择的数据类型> r = this.ARRAY[COUNT]\n    // 之后移除栈尾的项目\n\
    \    this.ARRAY[COUNT] = null\n    // 5) 最后，函数返回你的项目并结束。\n    return r\n}\n```\n\
    \n注意看我们在输出项目并结束函数**之前**递减了 `COUNT`。如果你还记得，函数返回应该是函数过程中的最后的一件事——因为它结束了函数的执行。\n\n\
    对于有经验的程序员来说，如果你愿意，你也可以选择放弃局部变量，这取决于你想要使用的语言以及你对性能的需求。\n\n#### 链表栈，伪代码中的数据结构\n\n\
    ```cpp\n// 单向链表节点包含：\n// - 下一个节点（指向下一个节点）\n// - 数据项目（选择你想要的数据类型）\n\nCompositeStructure\
    \ Node {\nNode NEXTID\n(选择一种数据类型) ITEM\n}\n\n// 抽象数据类型：栈，使用链表实现\n// 栈包含：\n// -\
    \ 头部（链表节点）\nCompositeStructure LinkedListStack {\nNode HEAD\nInteger COUNT\n}\n\
    ```\n\n现在，让我们详细看看 `push()` 和 `pop()` 方法是如何运作的：\n\n#### 链表栈：Push() 函数的伪代码\n\n```cpp\n\
    // 输入: - 一个项目（某种数据类型）\n// 输出: - 无\n// 效果：将一个项目（某种数据类型）插入我们的链表栈中\n\nvoid push(<选择的数据类型>\
    \ INPUT) {\n    // 1) 创建一个新的局部变量。并将其设置为一个节点。\n    // 这将是新的链表头部。\n    Node NEWHEAD\
    \ = new Node\n    // 2) 将你的输入项目设置为新头部节点的数据\n    NEWHEAD.ITEM = INPUT\n    // 3)\
    \ 将前一个头下一个节点设置为新头部\n    NEWHEAD.NEXT = this.HEAD\n    // 4) 将新头部设置为链表的栈头\n   \
    \ this.HEAD = NEWHEAD\n    // 5) 最后，项目计数加 1\n    this.COUNT += 1\n}\n```\n\n####\
    \ 链表栈：Pop() 函数\n\n```cpp\n// 输入: - 无\n// 输出: - 一个项目（某种数据类型）\n// 效果：从我们的数组栈中移除并获取一个项目（某种数据类型）\n\
    \n<选择的数据类型> pop() {\n    // 1) 检查头部节点是否为空（如果头部节点存在）\n    if (this.HEAD = NULL)\
    \ {\n        // 2) 如果是，要么返回 NULL\n        return NULL\n    }\n    // 或者报告栈下界错误\n\
    \    //（假设 error() 会替你报告错误）\n    error(“Stack Underflow”)\n}\n    // 3) 如果有项目可以弹出，项目计数减\
    \ 1\n    this.COUNT -= 1\n    // 4) 创建一个局部变量。\n    // 将其设置为要返回的项目\n    //（它应该是栈尾的项目！）\n\
    \    <选择的数据类型> r = HEAD.ITEM\n    // 4) 获取下一个节点。\n    // 这将是新的头部。\n    this.HEAD\
    \ = HEAD.NEXT\n    // 5) 项目计数减 1\n    this.COUNT -= 1\n}\n\n### REF-02: 队列（Queue）\n\
    \n数组队列：伪代码中的数据结构\n\n```cpp\n// 抽象数据类型：队列，使用数组实现\n// 栈包含：\n// - 实际数组（带有大小和数据类型）\n\
    // - 最大容量（整数）\n// - 当前项目计数（整数）\n\nCompositeStructure ArrayQueue {\nInteger MAXSIZE\n\
    Integer COUNT\nInteger FRONT\nInteger BACK\n}\n```\n\n#### 数组队列：Enqueue() 函数的伪代码\n\
    \n```cpp\n// 输入: - 一个项目（某种数据类型）\n// 输出: - 无\n// 效果：将一个项目（某种数据类型）插入我们的数组队列\n\n\
    void enqueue(<选择的数据类型> ITEM) {\n    // 1) 检查数组是否有空间容纳额外的项目\n    if (this.MAXSIZE\
    \ < this.COUNT) {\n        // 2) 如果数组没有空间了，\n        // ……要么报告栈溢出错误（如果是固定大小数组）\n\
    \        //（假设 error() 会替你报告错误）\n        error(“Queue Overflow”)\n        // ……或者增加数组大小（如果是动态数组）\n\
    \        //（假设 increaseArray() 将数组大小增加 1）\n        this.increaseArray()\n    }\n\
    \    // 3) 如果数组有空间，则将项目添加到栈中。\n    // 将新项目的索引设置为当前的尾部\n    this.ARRAY[BACK] =\
    \ ITEM\n    // 4) 尾部加 1。\n    // 如果尾部大于或等于数组大小，将其置为 0。\n    this.BACK+=1\n   \
    \ if (this.BACK >= MAXSIZE) {\n        this.BACK = 0\n    }\n    // 5) 如果队列为空，将头部索引设置为尾部索引\n\
    \    if (this.COUNT == 0) {\n        this.FRONT = this.BACK\n    }\n    // 6)\
    \ 项目计数加 1\n    this.COUNT += 1\n}\n```\n\n#### 数组队列：Dequeue() 函数的伪代码\n\n```cpp\n\
    // 输入: - 无\n// 输出: - 一个项目（某种数据类型）\n// 效果：从我们的数组队列中移除并获取一个项目（某种数据类型）\n\n<选择的数据类型>\
    \ dequeue() {\n    // 1) 检查数组计数，看是否有项目可以出队\n    if (this.COUNT <= 0) {\n     \
    \   // 2) 如果没有，要么返回 NULL\n        return NULL\n        // 或者报告栈下界错误\n        //（假设\
    \ error() 会替你报告错误）\n        error(“Queue Underflow”)\n    }\n    // 3) 如果有项目可以弹出，创建一个局部变量。\n\
    \    // 将其设置为要返回的项目\n    //（它应该是队列头部的项目！）\n    <选择的数据类型> r = this.ARRAY[FRONT]\n\
    \    // 4) 之后移除队列头部的项目\n    this.ARRAY[FRONT] = null\n    // 5) 头部索引加 1。\n   \
    \ // 如果头部大于或等于数组大小，将其置为 0。\n    this.FRONT+=1\n    if (this.FRONT >= MAXSIZE)\
    \ {\n        this.FRONT = 0\n    }\n    // 6) 如果队列现在为空，将尾部索引设置为头部索引\n    if (this.COUNT\
    \ == 1) {\n        this.BACK = this.FRONT\n    }\n    // 7) 项目计数减 1\n    this.COUNT\
    \ -= 1\n    // 8) 最后，函数返回你的项目并结束。\n    return r\n}\n```\n\n#### 链表队列：伪代码中的数据结构\n\
    \n```cpp\n// 单向链表节点包含：\n// - 下一个节点（指向下一个节点）\n// - 数据项目（选择你想要的数据类型）\n\nCompositeStructure\
    \ Node {\nString ID\nString NEXTID\n(选择一种数据类型) ITEM\n}\n\n// 抽象数据类型：队列，使用链表实现\n\
    // 队列包含：\n// - 头部（链表节点）\n// - 尾部（链表节点）\nCompositeStructure LinkedListQueue {\n\
    Node FRONT\nNode BACK\nInteger COUNT\n}\n```\n"
- fmt: "\nNow, let’s look at how the `Enqueue()` and `Dequeue()` methods work, in\
    \ detail:\n\n### Linked List Queue: `Enqueue()` Function in Pseudocode\n\n```cpp\n\
    // INPUT: - an item (some Data Type)\n// OUTPUT: - nothing\n// EFFECT: inserts\
    \ an item (some Data Type) onto our Linked List Queue\n\nvoid enqueue(<chosen\
    \ data type> INPUT) {\n  // 1) Make a new Local Variable. Set it as a Node.\n\
    \  // This will be the New Linked List back.\n  Node NEWBACK = new Node\n\n  //\
    \ 2) Set your input item to be the New Back Node’s data\n  NEWBACK.ITEM = INPUT\n\
    \n  // 3) Set the previous back’s next node to the New Back\n  NEWBACK.NEXT =\
    \ this.back\n\n  // 4) Set the New Back as the Linked List’s Back of Queue\n \
    \ this.BACK = NEWBACK\n\n  // If this queue was previously empty,\n  // the New\
    \ Node will also be the new Front\n  if (this.COUNT <= 0) {\n    this.FRONT =\
    \ NEWBACK\n  }\n\n  // 5) And Finally, Increment the Item Count\n  this.COUNT\
    \ += 1\n}\n```\n\n### Linked List Queue: `Dequeue()` Function in Pseudocode\n\n\
    ```cpp\n// INPUT: - nothing\n// OUTPUT:- an item (some Data Type)\n// EFFECT:\
    \ removes and retrieves an item (some Data Type) from our Linked List Queue\n\n\
    <chosen data type> dequeue() {\n  // 1) Check if the Front Node isn’t Null (if\
    \ the Front Node Exists)\n  if (this.FRONT = NULL) {\n    // 2) If so, either\
    \ return NULL\n    return NULL\n  }\n  // or report a queue underflow error\n\
    \  // (assume error() reports an error for you)\n  error(\"QueueUnderflow\")\n\
    \  }\n\n  // 3) If there’s an item to dequeue, create a Local Variable.\n  //\
    \ Set it to be your soon-to-be return item\n  // (it should be the Front Node!)\n\
    \  <chosen data type> r = FRONT.ITEM\n\n  // 4) Get the Node NEXT to the Front.\n\
    \  // This will NOW be the new LinkedList Front.\n  this.FRONT = this.FRONT.NEXT\n\
    \n  // 5) Decrement the Item Count\n  this.COUNT -= 1\n\n  // 7) And Finally,\
    \ the function returns your item and ends.\n  return r\n}\n```\n\n# BONUS CHAPTERS:\n\
    \n## BONUS CHAPTER 01a: Lists\n\nAt one point, computers will eventually have\
    \ a collection of data to deal with - regardless whether they are objects or basic\
    \ data. Thus, we have lists.\n\n### Lists in General\nAs an Abstract Data Type,\
    \ lists are essentially a series of data items connected together. Computers will\
    \ generally go through data item on the lists one by one. There are two general\
    \ types of lists: linked lists and arrays. Most programming languages will usually\
    \ include either type of list.\n\n### Linked Lists v.s. Arrays. Which list to\
    \ use?\n\n**IMPORTANT NOTE**: The ironic thing about most programming languages\
    \ is the fact that they ALL have arrays and linked lists available. But, what\
    \ if a colleague or boss asks you which one to use? See, sometimes making the\
    \ slightest decisions like these will be such big deals that make or break an\
    \ app - and sometimes, even job applications, careers and startups.\n\nIn general,\
    \ use `Linked Lists` for quickly adding and deleting data items for that list,\
    \ no matter what order they are. Whether the item is first, last, or in the middle\
    \ of the list, it takes the same time and effort for the computer to add/remove\
    \ data items. Also, if you also don’t know how big your list will be, linked lists\
    \ are preferable.\n\nIn general, use `Arrays` for any computing where you need\
    \ to access or process each element in the list. The indices in the `Array` will\
    \ help your computer process the list faster, as well as give your computer multi-process\
    \ potential for that list. Also, use arrays if each item in the list needs an\
    \ index. For example, if you wanted to randomly get list items, you can only do\
    \ it in an array (in a linked list, how would the computer know what item to get?\
    \ Think about it…)\n\n**Bottom line:**\n- `Linked Lists` = any size, faster add/remove\n\
    - `Arrays` = fixed size, faster access/process\n\n### Linked Lists v.s. Arrays:\
    \ Data Management\nIn general, if given the same data type to store in lists,\
    \ arrays take less memory/storage space than linked lists. You’ll find out about\
    \ this later, but linked lists generally need slightly more data in its structure\
    \ than arrays. However, in lists with very high number of items, this slight difference\
    \ is actually significant.\n\n## BONUS CHAPTER 01b: Linked Lists\nThe concept\
    \ of linked lists is actually very simple. Think of linked lists as a chain -\
    \ literally. In a linked list, each “link” in the chain will have its item, followed\
    \ by whatever “link” is next. If a certain link has no links next, then that link\
    \ is at the end of the chain - or rather, the end of the linked list.\n\nHere’s\
    \ an example of what a doubly linked list would look like visually:\n\n[ ID01\
    \ ][ item ][ Prev: NULL][ Next: ID03]\n[ ID04 ][ item ][ Prev: ID03][ Next: NULL]\n\
    [ ID03 ][ item ][ Prev: ID01][ Next: ID04]\n\nThere are three “links” in the chain,\
    \ with link `ID04` being the last one. Why `ID04` is the last one? Because its\
    \ `Next` field is `NULL`. In a doubly linked list, each node points to both the\
    \ next and the previous node.\n\n### Building Linked Lists From Scratch\nIf you\
    \ ever had to design a linked list from scratch, the concept is simple. Singly\
    \ linked lists only point to the next node, while Doubly linked lists point to\
    \ both next and previous.\n\n```cpp\n// Abstract Data Type: Linked List\n// Each\
    \ element in the list is represented by a Node.\n// A Node has:\n\nstruct Node\
    \ {\n  String ID\n  String PREVID\n  String NEXTID\n  (data type) ITEM\n}\n```\n\
    \n## BONUS CHAPTER 01c: Arrays\nIf you look up the word ‘array’ in the dictionary,\
    \ you’ll find out that it’s an elaborate, and sometimes beautiful, arrangement\
    \ of items in a particular order.\n\nHere’s an example of what an array with a\
    \ size of 5 would look like visually:\n\n[ 0 ][item A]\n[ 1 ][item B]\n[ 2 ][\
    \ NULL ]\n[ 3 ][item D]\n[ 4 ][ NULL ]\n\n### Building Arrays From Scratch\nIf\
    \ you ever had to design a data array from scratch, the concept is simple too.\
    \ But unlike linked lists, there aren’t usually any individual nodes. You simply\
    \ build the array-type list itself. It requires two main things: the length or\
    \ size of the array and the data type you want to store in it.\n\n```cpp\n// Abstract\
    \ Data Type: Array\n```\n"
