    \ += 1;\n}\n```\n\n## 链表队列：Dequeue() 函数，C++ 语言\n\n// 输入：无\n// 输出：一个元素（某种数据类型）\n\
    // 效果：从我们的链表队列中移除并获取一个元素（某种数据类型）\n\n```cpp\n<chosen data type> dequeue() {\n \
    \   // 1) 检查计数是否有元素可以弹出。\n    if (this->COUNT <= 0) {\n        // 2) 如果没有，打印消息并返回空\n\
