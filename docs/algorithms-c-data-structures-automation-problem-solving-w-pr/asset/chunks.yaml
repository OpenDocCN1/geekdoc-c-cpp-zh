    We also have Sample Chapters throughout the book to help you out.


    # Part 1: Identifying the Data Types


    ## Chapter 1a: Abstract Data Types: The Stack


    ### The Stack

    A stack is literally what it is - a stack of objects. And as an abstract Data
    Type, the stack would hold a list of data objects for later processing. The data
    objects in a stack would be inserted and retrieved in a Last-In-First-Out process.
    A Stack will usually have two main `functions` defined along with it: `push` (aka
    insert) and `pop` (aka remove/retrieve).


    #### How the Stack Works

    Think of a stack as a pile of plates “stacked” on top of another. And each plate
    had a letter in it. The top plate would be the easiest to retrieve. So retrieving
    a data object from a Stack would be the last object that was entered.


    For example, let’s have a ‘stack’ of dishes as an array:

    ```cpp

    // stackOfPlates are a collection of strings

    // Each string resembles a Plate

    string stackOfPlates[5] = {"A", "B", "C", "D"};

    ```

    If you wanted to insert a new plate in this stack, it would be placed at the end
    of the list. Now, for example, let’s take a look at this stack:

    ```cpp

    string stackOfPlates[5] = {"A", "B", "C", "D"};

    ```

    Then, let’s enter a plate called “E”. To enter items into a stack, you need a
    function to insert it into the stack. This function is usually called `push()`.

    ```cpp

    stackOfPlates.push("E")

    ```

    Afterwards, here’s what the stack would look like:

    ```cpp

    string stackOfPlates[5] = {"A", "B", "C", "D", "E"};

    ```

    If we wanted to retrieve a plate from this stack, the LAST item in the collection
    would be removed from the stack. Then that item would be given. You need a function
    to remove and retrieve an item from the stack. This function is called `pop()`.

    ```cpp

    // This would print E

    print(stackOfPlates.pop())


    // This would print D

    print(stackOfPlates.pop())


    // This would print C

    print(stackOfPlates.pop())

    ```

    Then, here’s what the stack would look like afterwards:

    ```cpp

    string stackOfPlates[5] = {"A", "B"};

    ```


    ### When to Use the Stack

