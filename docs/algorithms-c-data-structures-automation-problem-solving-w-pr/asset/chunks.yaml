  raw: 'Carefully look at how a list of data objects should be processed. Once you
    notice it uses a Last-In-First-Out process for any data objects that enter or
    leave, use a stack.


    Also, complex algorithms and functions use stacks. If a computer processes a procedure
    as a stack, it will “stack” all the functions that are called. Then it will proceed
    to complete each function called, starting with the most recent (you’ll learn
    more about all this in-depth later).


    For future reference, picture yourself in a tech interview. If you ever are asked
    how a certain function’s procedure works, you’ll be very fortunate to know how
    a stack works and how that function will proceed from start to finish.


    However, recall that stacks normally use lists - either arrays or linked lists.
    So which one do you choose? Recall these lines from the Master’s Handbook Series:


    Linked Lists = any size, faster add & remove


    Arrays = fixed size, faster access/process


    So depending on which data structure you use, the next chapters show you how you
    implement a stack.


    Chapter 1b: The Stack, as an Array


    The Data Structure


    You’ll need the actual array, as well as two integers: the max size and the current
    item count.


    // Abstract Data Type: Stack, as an Array


    // The Stack Has:


    // - the Actual Array (with Size and Data Type)


    // - the Max Size of the Stack (Integer)


    // - the Current Item Count (Integer)


    CompositeStructure ArrayStack {


    Integer MAXSIZE


    Integer COUNT


    (choose a data type) ARRAY[MAXSIZE]


    }


    Now, let’s look at how the Push() and Pop() methods work, in detail:


    Array Stack: Push() Function


    The Push() function from an Array Stack adds items into that stack. It does this
    in the following procedure, in this particular order:


    1) Check if there’s room in the array for the extra item


    2) If there’s no room in the array, either report a stack overflow error (if fixed-size
    array) or increase the array size (if variable array)


    3) If there’s room in the array, add the item to the stack. Set the new item’s
    index as the current Item Count (so the item is the very last item in the Stack)


    4) And Finally, Increment the Item Count


    After the push() procedure successfully inserts an item, you should have that
    item at the end of the array and the item count should be increased by 1\.


    Array Stack: Pop() Function


    In contrast to the Push() method, the Pop() method from an Array Stack removes
    an item from that stack. The function returns that item as the Function Output.
    It does this in the following procedure, in this particular order:


    1) Check the Array Count if there are any items to pop.


    2) If not, either return NULL or report a stack underflow error


    3) If there’s an item to pop, Decrement the Item Count first. We’re going to remove
    an item!


    4) Then,create a Local Variable. Set it to be your return item (it should be the
    item at the end of the stack!) Remove the item at the End of the Stack afterwards


    5) And Finally, the function returns your item and ends.


    After the pop() procedure successfully removes and retrieves an item, the item
    should be the item that was at the end of the array. Also, the item count should
    be decreased by 1.


    Chapter 1c: The Stack, as a Linked List


    The Data Structure


    You’ll need one Linked List node - the Head - as well as an integer to keep track
    of the Item Count. Luckily, there are no Stack Overflows as a Linked List. Chances
    are, you may have to design the Linked List Nodes as well.


    // A Singly Linked List Node has:


    // - the Next Node (Point to the Next Node)


    // - the Data Item (choose what data type you want)


    CompositeStructure Node {


    Node NEXTID


    (choose a data type) ITEM


    }


    // Abstract Data Type: Stack, as a Linked List


    // The Stack Has:


    // - a Head (Linked List Node)


    CompositeStructure LinkedListStack {


    Node HEAD


    Integer COUNT


    }


    Now, let’s look at how the Push() and Pop() methods work, in detail:


    Linked List Stack: Push() Function


    The Push() function from a Linked List Stack adds items into that stack. It does
    this in the following procedure, in this particular order:


    1) Make a new Local Variable. Set it as a Node. This will be the New Linked List
    head.


    2) Set your input item to be the New Head Node’s data


    3) Set the previous head’s next node to the New Head.


    4) Set the New Head as the Linked List’s Stack Head


    5) And Finally, Increment the Item Count


    After the push() procedure successfully inserts an item, you should have that
    item at the head of the linked list and the item count should be increased by
    1\.


    Linked List Stack: Pop() Function


    In contrast to the Push() method, the Pop() method from a Linked List Stack removes
    an item from that stack. The function returns that item as the Function Output.
    It does this in the following procedure, in this particular order:


    1) Check if the Head Node isn’t Null (if the Head Node Exists)


    2) If so, either return NULL or report a stack underflow error


    3) If there’s an item to pop, create a Local Variable. Set it to be your soon-to-be
    return item (it should be the Head Node!)


    4) Get the Node NEXT to the Head. This will NOW be the new LinkedList Head.


    5) Decrement the Item Count


    6) And Finally, the function returns your item and ends.


    After the pop() procedure successfully removes and retrieves an item, the item
    should be the item that was the Linked List Head. Also, the item count should
    be decreased by 1.


    C++ 01a: The Stack, as an Array


    Here, we start playing around with some basic data structures in C++ code. You
    may also use online IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    Future algorithms start to become more complex, so understand these well!


    The Data Structure, in C++


