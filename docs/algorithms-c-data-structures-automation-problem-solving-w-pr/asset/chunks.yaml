    Note: the data type can be whatever you wish. It depends on the data you wish
    to process.


    Array Stack: Push() Function, in C++


    Remember the procedure behind the push() function. First note the steps it takes
    to enter the data into the stack, then check that the steps actually process the
    way you intend it to be.


    In this version, we simply get our system to print “Stack Overflow” and end the
    function if we try to enter too many items in the array


    We’ve also included a few print lines that show you that the function actually
    pushed the value into the array


    // INPUT: - an item (some Data Type)


    // OUTPUT: - nothing


    // EFFECT: inserts an item (some Data Type) onto our Array Stack


    void push(<chosen data type> item) {


    // 1) Check if there’s room in the array for the extra item


    if (this->MAXSIZE <= this->COUNT) {


    // 2) If there’s no room in the array,


    // print a Stack Overflow and end the function


    std::cout << "Stack Overflow!\n";


    return;


    }


    // 3) If there’s room in the array, add the item to the stack.


    // Set the new item’s index as the current Item Count


    this->ARRAY[COUNT] = item;


    // PROOF that it inserted:


