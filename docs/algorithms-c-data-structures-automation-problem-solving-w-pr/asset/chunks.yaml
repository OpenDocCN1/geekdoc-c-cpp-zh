    BONUS CHAPTER 01a: Lists


    At one point, computers will eventually have a collection of data to deal with
    - regardless whether they are objects or basic data.


    Thus, we have lists.


    Lists in General


    As an Abstract Data Type, lists are essentially a series of data items connected
    together.


    Computers will generally go through data item on the lists one by one.


    There are two general types of lists: linked lists and arrays. Most programming
    languages will usually include either type of list.


    Linked Lists v.s. Arrays. Which list to use?


    IMPORTANT NOTE: The ironic thing about most programming languages is the fact
    that they ALL have arrays and linked lists available. But, what if a colleague
    or boss asks you which one to use? See, sometimes making the slightest decisions
    like these will be such big deals that make or break an app - and sometimes, even
    job applications, careers and startups.


    In general, use Linked Lists for quickly adding and deleting data items for that
    list, no matter what order they are. Whether the item is first, last, or in the
    middle of the list, it takes the same time and effort for the computer to add/remove
    data items. Also, if you also don’t know how big your list will be, linked lists
    are preferable.


    In general, use Arrays for any computing where you need to access or process each
    element in the list. The indices in the Array will help your computer process
    the list faster, as well as give your computer multi-process potential for that
    list. Also, use arrays if each item in the list needs an index. For example, if
    you wanted to randomly get list items, you can only do it in an array (in a linked
    list, how would the computer know what item to get? Think about it…)


    Bottom line:


    Linked Lists = any size, faster add/remove


    Arrays = fixed size, faster access/process


    Linked Lists v.s. Arrays: Data Management


    In general, if given the same data type to store in lists, arrays take less memory/storage
    space than linked lists. You’ll find out about this later, but linked lists generally
    need slightly more data in its structure than arrays. However, in lists with very
    high number of items, this slight difference is actually significant.


    [View Programming: Master Handbook Series Here](http://www.amazon.com/s/ref=dp_byline_sr_ebooks_1?ie=UTF8&field-author=Code+Well+Academy&search-alias=digital-text&text=Code+Well+Academy&sort=relevancerank)


    BONUS CHAPTER 01b: Linked Lists


    The concept of linked lists is actually very simple.


    Think of linked lists as a chain - literally. In a linked list, each “link” in
    the chain will have its item, followed by whatever “link” is next. If a certain
    link has no links next, then that link is at the end of the chain - or rather,
    the end of the linked list.


    Here’s an example of what a doubly linked list would look like visually:


    [ ID01 ][ item ][ Prev: NULL][ Next: ID03]


    [ ID04 ][ item ][ Prev: ID03][ Next: NULL]


    [ ID03 ][ item ][ Prev: ID01][ Next: ID04]


    There are three “links” in the chain, with link ID04 being the last one. Why is
    ID04 last? Easy - because there is no link after it.


    And note how the IDs go from 01, then 04, and 03, and they’re not in order. However,
    in linked lists, the numbers DO NOT tell you the order. I REPEAT. The NUMBERS
    DO NOT tell you the order


    It’s because of one crucial fact about how the ordering in linked lists are set
    up.


    “The Ordering of a Linked List is this: The very first node (no nodes before it),
    then its next one, then the next one, and so on - until there’s a node with nothing
    after it.”


    Building Linked Lists From Scratch:


    If you ever had to design a linked list from scratch, the concept is simple. A
    single link in a linked list consists of the actual data, then the ID of whatever
    the next or previous nodes are. Singly linked list nodes only point to the next
    node, while Doubly Linked List nodes point to both next and previous nodes.


    In our pseudocode below, there are four key fields in a doubly linked list node:
    the ID, the previous node’s ID, the next node’s ID, and the actual data item.


    // Abstract Data Type: Linked List


    // Each element in the Linked List is represented by a Node.


    // A Node has:


    // - an ID (String)


    // - the ID of the Previous Node (String)


    // - the ID of the Next Node (String)


    // - the Data Item (choose what data type you want)


    CompositeStructure Node {


    String ID


    String PREVID


    String NEXTID


    (choose a data type) ITEM


    }


    Usually, you can only use one data type per each linked list. The reason is simply
    how the computer system itself processes and organizes data (you’ll learn more
    about this if you know how Computer Systems themselves work).


    [View Programming: Master Handbook Series Here](http://www.amazon.com/s/ref=dp_byline_sr_ebooks_1?ie=UTF8&field-author=Code+Well+Academy&search-alias=digital-text&text=Code+Well+Academy&sort=relevancerank)


    BONUS CHAPTER 01c: Arrays


    If you look up the word ‘array’ in the dictionary, you’ll find out that it’s an
    elaborate, and sometimes beautiful, arrangement of items in a particular order.


    Emphasize the phrase “arrangement of items in a particular order”.


    And in programming, you now know the key point of Arrays - they’re a list of data
    items sorted in a particular order.


    Here’s an example of what an array with a size of 5 would look like visually:


    [ 0 ][item A]


    [ 1 ][item B]


    [ 2 ][ NULL ]


    [ 3 ][item D]


    [ 4 ][ NULL ]


    Here, you can see how quickly and easily you can add or get data items from an
    array. If you know the index where you stored your data, just access the array,
    the index, then the data is yours.


    Also, arrays sizes are usually fixed. In some programming languages, there are
    also Dynamic or Variable-Size Arrays. But depending on how the programming language
    works, the data items are usually re-added into arrays that have as much room
    as the number of items.


    Building Arrays From Scratch:


    If you ever had to design a data array from scratch, the concept is simple too.
    But unlike linked lists, there aren’t usually any individual nodes. You simply
    build the array-type list itself. It requires two main things: the length or size
    of the array and the data type you want to store in it.


