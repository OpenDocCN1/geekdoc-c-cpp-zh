    # Table of Contents


    ## Introduction


    ### Welcome to the Path of Mastery

    We thank you for purchasing & downloading our work, “Algorithms”. We understand
    you want to expand your Programming skills to a deeper, more advanced level. You
    want your apps to be more sophisticated; you want them to auto-generate results
    or processing tons of information for you - all in the fastest, most efficient
    way possible.


    But before all that can happen, you need a great start. Hence, you’ve come to
    the right place…


    ### Algorithms

    Algorithms can be as simple as a few lines of good code, or as complex as an Artificial
    Intelligence bot.


    How does a Search Engine give you thousands of web pages based on the phrases
    you enter? How does a search engine finish your search keywords before you even
    finish typing? How are puzzles randomly created - or automatically solved? How
    is a list of names instantly sorted in alphabetical order?


    To understand computing is to understand algorithms. To craft a good algorithm
    is to give a computer system a really good set of procedures. And these procedures
    create answers, manage data, or generally do some work for you - all in the most
    efficient instructions possible.


    And, more importantly, to craft a good algorithm is to understand how all the
    data will be arranged and laid out. Then, how quickly and easily the algorithm
    or computer can pick a data item and process it.


    ### The Master Structure

    At this point, you pick up where you’ve left off in your coding journey. You know
    the basic data types, `functions`, and other programming terms. You may have started
    to code using a different programming language; or you may have chosen this book’s
    main language. Either way, you’re here to enhance your skills.


    We start with computing a list of data items. We take a good look at the data
    and how it behaves, then identify the proper data structure that comes along with
    it. Then we add the `functions` and `methods` that are essential to the data structure.
    And as the book progresses over time, we start to take a look at more complex
    data arrangements.


    ### Pseudocode Reference

    This book comes in its own main language and an easily identifiable pseudocode.
    The pseudocode is included to teach you one major thing: to recognize the common
    procedures between the two codes. You can find them at the Reference Section,
    as well as throughout the book. Afterwards, once you master the material in the
    book’s main language, you can use the pseudocode to help you transition into your
    next language.


    Overall, good luck and code well. This is the start of something good.


    ## C++ Introduction


    ### Software System Special

    C++ is one of the most widely used programming languages not just to develop games
    and apps, but even operating systems and hardware programming. C++ programs can
    use algorithms for managing and manipulating not only lists and collections, but
    system aspects (like memory) as well. This is because of the procedural speed
    and memory management in C++.


