    # Preface


    While writing this book I started quoting from Wikipedia. Then including sections,
    whole parts of Wiki... I would highly recommend using http://www.wikipedia.com
    In fact there is quite a bit from Wiki in the book now. I do plan to edit some
    of it out.


    This did start out as a simple question and answer Bot and grew. I now have an
    Apple 4S with Siri. I have been exploring Wolfram Alpha’s website.


    I''m still trying to understand how I want to develop the language. With a hunch,
    I have that it should be possible to write a program that understands, if the
    right tools are available. I am hoping some of the stuff from Wiki will lead to
    improvements in Conceptual-C Language.


    I''m not sure yet what Conceptual-C is in fact a conceptual Language. It is possible
    that designing it, I may find Objective-C already does what I''m trying to do.
    I''m still not at the stage of knowing what needs to go into the compiler yet


    What a month this has been first Steve Jobs (February 24, 1955 – October 5, 2011)
    of Apple died. My first computer was an Apple II, then I had a PC, then a Macintosh,
    a NEXT Station and my current computer, which I''m very happy with an iMac. I
    saw Steve live at the Apple WWDC developer conferences and visited the Apple campus.
    I want to get an iPad and yes, I use iPhone today


    Sad to that John McCarthy (September 4, 1927 – October 23, 2011) died this week.
    He coined the term "artificial intelligence" (AI), invented the Lisp programming
    language and was highly influential in the early development of AI.


    These things always seem to happen in three now''s Ive here Dennis Ritchie (September
    9, 1941 - October 12, 2011) is dead. He created C programming Language. He was
    the ‘R’ in K&R book “The C Programming Language”.


    I’ve included Lisp and AI in this book, because I feel it will help in implementing
    Conceptual-C. I have also included sections on Memes, Mind Uploading, Neural Nets,
    The Chinese Room, and Bots, as interesting ideas. They may get cut in the next
    version.


