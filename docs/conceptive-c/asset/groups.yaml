    According to James, the "stream of thought" is governed by five characteristics:
    "(1) Every thought tends to be part of a personal consciousness. (2) Within each
    personal consciousness thought is always changing. (3) Within each personal consciousness
    thought is sensibly continuous. (4) It always appears to deal with objects independent
    of itself. (5) It is interested in some parts of these objects to the exclusion
    of others". A similar concept appears in Buddhist philosophy, expressed by the
    Sanskrit term Citta-sa-tana, which is usually translated as mindstream or "mental
    continuum". In the Buddhist view, though, the "mindstream" is viewed primarily
    as a source of noise that distracts attention from a changeless underlying reality.


    In the west, the primary impact of the idea has been on literature rather than
    science: stream of consciousness as a narrative mode writing in a way that attempts
    to portray the moment-to-moment thoughts and experiences of a character. This
    technique perhaps had its beginnings in the monologues of Shakespeare''s plays,
    and reached its fullest development in the novels of James Joyce and Virginia
    Woolf, although it has also been used by many other noted writers.


