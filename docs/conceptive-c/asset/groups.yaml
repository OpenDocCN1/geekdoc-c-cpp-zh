    对表达式的依赖赋予了语言极大的灵活性。因为 Lisp 函数本身是以列表形式编写的，因此可以像处理列表数据一样处理它们。这使得编写操作其他程序的程序（元编程）变得简单。许多
    Lisp 方言通过宏系统利用这一特性，能够几乎无限制地扩展语言。


    # 列表


    列表的编写方式是元素之间用空格分隔，并用括号括起来。例如，`(1 2 foo)` 是一个列表，其元素是三个原子：值 1、2 和 foo。这些值是隐式类型化的：它们分别是两个整数和一个
    Lisp 特有的数据类型，称为“符号”（symbol），并且不需要显式声明为这些类型。


    空列表 `()` 也被表示为特殊原子 `nil`。这是 Lisp 中唯一既是原子又是列表的实体。


    表达式使用前置符号编写。列表的第一个元素是形式名称，即列表、函数、操作符、宏或“特殊操作符”（见下文）。列表的其余部分是参数。例如，函数 `list` 将参数作为列表返回，因此表达式


    `(list ''1 ''2 foo)`

    求值为结果列表 `(1 2 foo)`。上例中参数前的“引号”（quote）是一个“特殊操作符”，它防止被引用的参数被求值（并非严格针对数字，因为 1 求值为
    1 等）。任何未加引号的表达式在包裹它的表达式求值之前都会递归地求值。例如，


    `(list 1 2 (list 3 4))`

    求值为列表 `(1 2 (3 4))`。注意第三个参数是一个列表；列表是可以嵌套的。


    # 操作符


    算术操作符的处理方式类似。表达式 `(+ 1 2 3 4)`


    求值为 10。在中置表示法下，等价的形式为 `"1 + 2 + 3 + 4"`。Lisp 中的算术操作符是变变的（或 n  元的），能够接受任意数量的参数。


    “特殊操作符”（有时被称为“特殊形式”）提供了 Lisp 的控制结构。例如，特殊操作符 接受三个参数。如果第一个参数非 `nil`，它求值为第二个参数；否则，它求值为第三个参数。因此，表达式


    `(if nil

    (list 1 2 "foo")

    (list 3 4 "bar"))`


    求值为 `(3 4 "bar")`。当然，如果用一个非平凡表达式替换 `nil`，这会更有用。


    # Lambda 表达式


    另一个特殊操作符 `lambda` 用于将变量绑定到值，这些值随后在表达式内被求值。该操作符也用于创建函数：`lambda` 的参数是一个参数列表，以及函数求值的某个表达式或多个表达式（返回值是最后一个被求值的表达式的值）。表达式


    `(lambda (arg) (+ arg 1))`

    求值为一个函数，当应用时，它接受一个参数，将其绑定到 `arg` 并返回比该参数大 1 的数。Lambda 表达式的处理方式与命名函数没有区别；它们的调用方式相同。因此，表达式


    `((lambda (arg) (+ arg 1)) 5)`

    求值为 6。


    # 原子


    在原始的 LISP 中，有两种基本数据类型：原子（atoms）和列表（lists）。列表是元素的有限有序序列，其中每个元素本身是原子或列表，而原子是数字或符号。符号本质上是一个唯一的名称，在源代码中写为字母数字字符串，并在符号处理中用作数据项。例如，列表`(FOO
    (BAR 1) 2)` 包含三个元素：符号 `FOO`、列表 `(BAR 1)` 和数字 `2`。


    原子和列表之间的本质区别在于原子是不可变且唯一的。出现在源代码中不同位置但写法完全相同的两个原子代表同一个对象，而每个列表都是一个独立的对象，可以独立于其他列表进行修改，并可以通过比较操作符与其他列表区分开来。


    随着后期 Lisp 方言引入了更多数据类型，以及编程风格的演变，原子的概念失去了重要性。许多方言为了兼容旧版本仍然保留了谓词 `atom`，并为任何非 `cons`
    的对象定义了它。


