    Daniel Dennett has championed the idea that the human survival strategy depends
    heavily on adoption of the intentional stance, a behavioral strategy that predicts
    the actions of others (see theory of mind). on the expectation that they have
    a mind like one’s own. Mirror neurons in brain regions such as Broca’s area may
    facilitate this behavioral strategy. The intentional stance, Dennett suggests,
    has proven so successful that people tend to apply it to all aspects of human
    experience, thus leading to animism and to other conceptualizations of soul.


    The word-concept Soul has a secular and non-secular aspect. To integrate the two
    in a coherent statement Soul would be defined as: The interaction of mind, body
    and spirit reflecting through conscience the appropriateness of individual or
    collective behavior. Through a connection to the Soul the mind apprehends abstractions
    implicit in spirit whether that be of transcendent derivation or temporal analysis.'
