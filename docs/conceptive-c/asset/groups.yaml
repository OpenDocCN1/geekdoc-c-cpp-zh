    Koch），探索了意识的神经基础，但并未尝试构建全面的全球理论。同时，从事人工智能领域的计算机科学家一直在追求创建能够模拟或体现意识的数字程序。


    一些物理学家认为，经典物理学本质上无法解释意识的整体方面，但量子理论提供了缺失的要素。因此，几位理论者提出了意识的量子（QM）理论。属于这一类的著名理论包括卡尔·普里布拉姆（Karl
    Pribibram）和大卫·波姆（David Bohm）的全息脑理论，以及由斯图特·哈默夫（Stuart Hamerff）和罗杰·彭罗斯（Roger Penrose）提出的
    Orch-OR理论。这些量子理论中的某些提供了对现象意识的描述，以及对通达意识的量子力学解释。没有任何量子力学理论得到实验证实，许多科学家和哲学家认为关于量子现象具有重要作用的论点是不说服的。


    # 为什么人们认为别人是有意识的？


    许多哲学家认为经验是意识的本质，并相信经验只能从内部、主观地被完全认知。但如果意识是主观的且从外部不可见，为什么绝大多数人认为别人是有意识的，而石头和树木没有？这被称为“他心问题”。对于那些相信“哲学僵尸”（philosophical
    zombies）可能存在的人来说，这个问题尤为尖锐，即那些认为在原则上可能存在一种物理上与人类无法区分、在各方面都表现得像人类但却缺乏意识的实体。


    最常见的答案是，我们把意识归因于他人是因为我们在外和行为上看起来像我们：我们推论他们看起来像我们，表现得也像我们，所以他们在其他方面也和我们一样，包括拥有我们那样的经验。[40]
    这种解释存在各种问题。首先，它似乎违反了简洁性原则，因为它假设了一个对于解释我们观察到的现象并非必需的不可见实体。一些哲学家，如丹尼尔·丹尼特在题为《僵尸那未被想象的后验荒谬性》（The
    Unimagined Preposterness of Zombies）的文章中认为，给出这种解释的人并不理解他们自己在说什么。


    更广泛地说，哲学家们并不接受僵尸的可能性，他们普遍认为意识反映在行为（包括语言行为）中，我们根据行为将意识归因。这种方法的更直接的说法是，我们把经验归因于人是因为他们能做的事，包括他们可以告诉我们他们的经历。


    ### 非人类动物是有意识的吗？


    动物意识的话题充斥着许多困难。它以特别严峻的形式提出了他心问题，因为动物缺乏语言，无法告诉我们它们的经验。此外，对这个问题进行客观推理是困难的，因为动物是有意识的这一细节往往被认为意味着它没有感觉，它的生命没有价值，且伤害它在道德上并没有错。例如，笛卡尔由于他认为只有人类拥有非物理心灵，有时会被指责虐待动物。大多数人直觉上认为某些动物（如狗）是有意识的，而另一些（如昆虫）不是；这种直觉并没有根据。


    认为主观经验是意识本质的哲学家通常认为，动物意识的存在无法严格感知。托马斯·内格尔（Thomas Nagel）在他富有影响力的文章《做蝙蝠是什么感觉》（What
    Is It Like to Be a Bat?）中阐述了这一观点。他说，只有当成为该生物有一种感觉时，它是有意识的——对于该生物来说有某种感觉；并认为无论我们对动物的大脑和行为了解多少，我们永远无法真正进入动物的心灵并以它们的方式体验这个世界。其他思想者，如道格拉斯·霍夫斯塔特（Douglas
    Hofstadter），认为这一论点是不连贯的。一些心理学家和行为学家通过描述一系列似乎显示动物对其无法感知的事物持有信念的行为，论证了动物意识的存在——唐纳德·格里芬（Donald
    Griffin）2001年的著作《动物心灵》（Animal Minds）回顾了大量的证据。


    ### 机器可能有意识吗？


    人造物体产生意识是一个古老神话主题，例如出现在希腊神话毕格玛利翁（Pygmalion）身上（他雕刻了一尊被魔法赋予生命的雕像），以及中世纪犹太关于歌姆（Golem）的故事中（一种被赋予生命的黏土人）。然而，实际构建意识机器的可能性最早由阿达·洛芙莱丝（Ada
    Lovelace）讨论，她在1842年对查尔斯·巴贝奇（Charles Babbage）发明的分析机（现代电子计算机的前身，但从未制造）写了一系列注释。洛芙莱丝基本上否定了分析机这类机器能以人类方式思考的想法。她写道：


