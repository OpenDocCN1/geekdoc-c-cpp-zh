    It is desirable to guard against the possibility of exaggerated ideas that might
    arise to the powers of the Analytical Engine. ... The Analytical Engine has no
    pretensions whatever to originate. It can do whatever we know how to order it
    to perform. It can follow analysis; but it has no power of anticipating any analytical
    relations or truths. Its province is to assist us in making available what we
    are already acquainted with.


    One of the most influential contributions to this question was an essay written
    in 1950 by pioneering computer scientist Alan Turing, titled Machinery and Intelligence.
    Turing disavowed any interest in terminology, saying that "Can machines think?”
    is too loaded with spurious connotations to be meaningful; but he proposed to
    replace all such questions with a specific operational test, which has become
    known as the Turing test. To pass the test a computer must be able to imitate
    a human well enough to fulfill interrogators. In his essay Turing discussed a
    variety of possible objections, and presented a counterargument to each of them.
    The Turing test is commonly cited in discussions of artificial intelligence as
    a proposed criterion for machine consciousness; it has provoked a great deal of
    philosophical debate. For example, Daniel Dennett and Douglas Hofstadter argue
    that anything capable of passing the test is necessarily conscious, while Chalmers
    argues that a philosophical zombie could pass the test, fail to be conscious.


    Some philosophers have argued that it might be possible, at least in principle,
    for a machine to be conscious, but that would not just be a matter of executing
    the right computer program. This viewpoint has most notably advocated by John
    Searle, who defended it using thought experiment that has become known as the
    Chinese room argument: Suppose the Turing test is conducted in Chinese rather
    than English, and suppose a computer program successfully passes it. Does the
    system executing the program understand Chinese? Searle''s argument is that if
    the pass the Turing test in Chinese by executing exactly the same program as the
    computer, without understanding a single word of Chinese. How does Searle know
    whether he understands Chinese? Understanding a language is not just something
    you do: it feels like something to understand, and therefore there is more to
    it than merely executing a program, even a Turing-passing program.


    In the literature concerning artificial consciousness, Searle''s essay has been
    second only to Turing''s in the volume of debate it has generated. Searle himself
    was vague about what it takes to make a machine conscious; all he proposed that
    what was needed "causal powers" of the sort that the brain has and that computers
    lack. But other thinkers sympathetic to his basic argument have suggested that
    the necessary (though perhaps still not) extra conditions may include the ability
    to pass not just the verbal version of the Turing test, but the robotic version,[54]
    which requires grounding the robot''s words in the robot''s sensorimotor capacity
    to categorize and interact with the things in the world that its is about,'
