    # Shared Structure


    Lisp lists, being simple linked lists, can share structure with one another. That
    is to say, two lists can have the same tail, or final sequence of cons. For instance,
    after the execution of the following Common Lisp code:


    ```

    (set foo (list ''a ''b))

    ```


    ```

    (set bar (cons ''x (cdr cdr)))

    ```


    the lists and bar are (a b c) and (x b c) respectively. However, the tail (b c)
    is the same structure in both lists. It is not a copy; the cons cells pointing
    to b and c are in the same memory locations for both lists.


    Sharing structure rather than copying can give a dramatic performance improvement.
    However, this technique can introduce undesired ways with functions that alter
    lists passed to them as arguments. Altering one list, such as by replacing the
    c with a goose, will affect the other:


    ```

    (set (third foo) ''goose'')

    ```


    This changes foo to (a b goose), but thereby changes bar to (x b goose) – possibly
    unexpected result. This can be a source of bugs, and functions which alter their
    arguments are documented as destructive for this very reason.


    Aficionados of functional programming avoid destructive functions. In the Scheme
    dialect, which favors the functional style, the names of destructive functions
    are marked with a cautionary exclamation point, or "bang”—such as set-car! (read
    set car bang), which replaces the car of a. In the Common Lisp, destructive functions
    are commonplace; the equivalent of set-car! includes a special facility, set,
    to make it easier to define and use destructive functions. A frequent style in
    Common Lisp is to write code functionally (without destructive calls) while prototyping,
    then to add destructive calls as an optimization where it is safe to do so.


