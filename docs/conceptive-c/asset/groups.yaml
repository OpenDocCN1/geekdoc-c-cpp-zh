    著名计算机科学家格雷高里·蔡廷（Gregory Chaitin）提出了一种观点，认为理解是一种数据压缩。在论文《性的极限》中，他认为理解某事意味着找出一组能够解释该事的简单规则。例如，我们理解为什么昼夜交替，是因为我们有一个简单的模型——地球自转——它解释了海量数据——地球亮度、温度和大气成分的变化。我们使用一个预测它的简单模型压缩了大量信息。同样，我们通过将
