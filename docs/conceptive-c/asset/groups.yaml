    representation of the world—Gerald Edelman expressed this point vividly by titling
    one of his books about consciousness The Remembered Present.


    Despite the large amount of information available, the most important aspects
    of perception remain mysterious. A great deal is known about low-level signal
    processing in sensory systems, the ways by which sensory systems interact with
    each other, with "executive" systems in the frontal cortex, and with the language
    system are very completely understood. At a deeper level, there are still basic
    conceptual issues that remain unresolved. Many scientists have found it difficult
    to reconcile the fact that information is distributed across brain areas with
    the apparent unity of consciousness: this is one aspect of the so-called binding
    problem. There are also some scientists who have expressed grave reservations
    about the idea that the brain forms representations of the world at all; influential
    members of this group include psychologist J. J. Gibson and roboticist Rodney
    Brooks, who both argued in favor of "intelligence without representation".


    # Assessment


    In medicine, consciousness is examined using a set of procedures known as neuropsychological
    assessment. There are two commonly used methods for assessing the level of consciousness
    of a patient: a simple procedure that requires minimal training, and a more complex
    procedure that requires substantial expertise. The simple procedure begins by
    asking whether the patient is able to move and react to physical stimuli. If so,
    the next question is whether the patient can respond in a meaningful way to questions
    and commands. If so, the patient is asked for name, current location, and current
    day and time. A patient who can answer all of these questions is said to be "oriented
    three times" (sometimes denoted "Ox3" on a medical chart), and is usually fully
    conscious.


    The more complex procedure is known as a neurological examination, and is usually
    carried out by a neurologist in a hospital setting. A formal neurological examination
    runs through a precisely delineated series of tests, beginning with tests for
    basic sensorimotor reflexes and culminating with tests for sophisticated use of
    language. The outcome may be summarized using the Glasgow Coma Scale, which yields
    a number in the range 3—15, with a score of 3 indicating brain death (the lowest
    level of consciousness), and 15 indicating full consciousness. The Glasgow Coma
    Scale has three subscales, ranging from "no motor response" to "obey commands"),
    the best eye response (ranging from "no eye opening" to "eyes opening spontaneously")
    and the best verbal response (ranging from "no verbal response" to "fully oriented\).
    There is also a simpler pediatric version of the scale, for young children too
    to be able to use language.


    # The Stream of Consciousness


    William James is widely credited with popularizing the idea that human consciousness
    flows like a stream, in his Principles of Psychology of 1890.'
