    ActiveBuddy 是一家最初通过即时消息平台分发基于对话的交互式代理的公司。该公司成立于 2000 年，是 Robert Hoffer 和 Timothy
    Key 的结晶。交互式代理的理念源于 Hoffer 的愿景，即为日益受欢迎的即时消息服务增加功能。最初的实现呈现为一个基于文字的冒险游戏，但迅速扩展到包含广泛的数据库应用程序，包括访问新闻、天气、信息、时间页面列表和详细的体育数据，以及各种工具（计算器、翻译器等）。这些不同的应用程序被封装成一个单一实体，并于
    2001 年作为 SmartChild 发布。SmartChild 充当了展示快速数据访问和趣味可能性的平台，公司计划将这些可能性转化为定制化的、特定细分市场的产品。


    SmartChild 的迅速成功（用户超过 1300 万）使其为电台乐队（Radiohead）、奥斯汀·帕威尔（Austin Powers）、《体育新闻》（The
    Sporting News）等提供了针对性的促销产品。ActiveBuddy 寻求通过在2002 年对其创作的作品申请并获得专利，以加强未来对交互式代理市场的控制。该还还发布了
    BuddyScript SDK，这是一个免费的开发者工具包，允许程序员使用 ActiveBuddy 的专有脚本语言设计并启动自己的交互式代理。该公司随后在
    2003 年将名称从 ActiveBuddy 改为 Conversagen，然后于 2006 年再次改为 Colloquium。Colloquium 后于
    2006 年 10 月被微软收购。


    ## 开发


    经典的早期历史机器人有 ELIZA (1966) 和 PARRY (1972)。较新的著名程序包括 A.L.I.C.E.、Jabberwacky 和 D.U.D.E（法国国家研究局与国家科学研究中心
    2006）。虽然 ELIZA 和 PARRY 仅用于模拟文字聊天，但许多机器人现在包含了功能特性，如游戏和网络搜索能力。1984 年，出版了一本名为《警察的胡子是一半的》（The
    Policeman''s Beard is Half Constructed）的书，据说是由作者 Ractor 编写的（尽管发布的程序当时并无法做到这一点）。


    人工智能研究的一个相关领域是自然语言处理。通常，弱人工智能领域使用专门为所需的狭窄功能而创建的专用软件或编程语言。例如，A.L.I.C.E. 使用了一种名为
    AIML 的编程语言，该语言专门针对其对话代理的功能，并已被其他各种“Alice 机器人”（Alicebots）的开发者采用。尽管如此，A.L.I.C.E.
    仍然完全基于模式匹配技术，没有任何推理能力，这与 ELIZA 在 1966 年使用的技术相同。这不是强人工智能，因为强人工智能需要智慧和逻辑推理能力。


    Jabberwacky 根据实时用户交互学习新的响应和上下文，而不是由静态数据库驱动。一些最近的聊天机器人还将实时学习与演化算法相结合，根据进行的每次对话来优化其通信能力，其中一个著名的例子是
    2009 年 Leodis AI 奖获得者 Kyle。尽管如此，目前还没有通用的对话人工智能，一些软件开发者专注于实用方面，即信息检索。


    聊天机器人竞赛侧重于图灵测试或更具体的目标。两项年度竞赛是罗伯纳奖（Loebner Prize）和聊天盒挑战（Chatterbox Challenge）。


    ## IRC 机器人


    IRC 机器人是一组脚本或一个独立程序，作为客户端连接到互联网相对聊天（IRC），并在其他 IRC 用户看来显示为另一个用户。IRC 机器人与普通客户端的区别在于，它不是为人类用户提供
    IRC 的交互访问，而是执行自动化功能。


    历史上最古老的 IRC 机器人是 Bill Wiener 的 Bartender 和 Greg Lindahl 的 GM（游戏 Hunt Wumpus 的游戏管理器）。随着时间的推移，机器人演变成可以提供特殊服务，例如代表用户组管理频道、维护访问列表以及提供数据库访问。


    通常，IRC 机器人是作为从稳定主机的分离程序部署的。它驻留在 IRC 频道中以保持其开启，并防止恶意用户接管频道。它可以配置为在特权用户加入频道时赋予其管理员状态，并可以提供统一的频道管理员列表。这些许多功能要求机器人必须是频道管理员。大多数
    IRC 机器人运行在具有长时间运行时间的计算机上（通常运行 BSD 变体或 Linux）并拥有快速、稳定的互联网连接。由于 IRC 也在许多拨号上网用户中变得流行，出现了一些特殊服务，提供对具有良好连接的稳定
    Linux 服务器的用户级访问。用户可以在此 shell 账户运行 IRC 机器人。这些服务通常被称为 shell 提供者。


    机器人还可以执行许多其他功能，例如记录 IRC 频道中发生的情况、按需提供信息、创建统计数据、举办知识问答游戏等。这些功能通常由用户可写的脚本提供，通常使用
    Tcl 或 Perl 等编程语言编写并添加到相应的机器人中。标记为文件共享的频道通常使用 XDCC 机器人分发其文件。


    IRC 机器人在没有频道注册服务（如 ChanServ）的 IRC 网络（如 EFNet 和 IRCnet）上特别常用，在可能由于某些注册要求（最小用户数等）而防止频道注册的网络（如
    Undernet 或 QuakeNet）上也是如此。当机器人被用于此类管理功能时，它们可能需要比普通客户端连接更多的访问权限。某些 IRC 版本有一个“服务”（Service）协议，允许具有额外权限的客户端。此类服务器许可的机器人被称为服务（services）。


    机器人并不总是受欢迎。某些 IRC 网络禁止使用机器人。原因之一是连接到网络的昵称会增加在所有服务器之间同步的数据库的大小。在大型网络中允许机器人会导致需要资助大量的网络流量开销，甚至可能导致网络分裂（netsplits）。然而，这是
    IRC 技术的缺陷，而不是机器人的缺陷。


    创建 IRC 机器人的人使用客户端内置的脚本语言或适当编程语言的框架连接到服务器，或者使用现有的实现并根据需求进行调整。


