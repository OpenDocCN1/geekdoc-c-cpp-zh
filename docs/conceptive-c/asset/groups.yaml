    However, they are far from being resolved, and modern philosophers of mind continue
    to ask (if at all) the subjective qualities and the intentionality (aboutness)
    of mental states and properties can be explained in naturalistic terms.


    # Psychology


    Psychology is the scientific study of human behavior, mental functioning, and
    experience; notably both an academic and applied discipline, Psychology involves
    the scientific study of mental processes such as perception, cognition, emotion,
    personality, as well as environmental influences, such as social and cultural
    influences, and interpersonal relationships, in order to devise theories of human
    behavior. Psychology also refers to the application of such knowledge various
    spheres of human activity, including problems of individuals'' daily lives and
    the treatment of mental health problems.'
