    # Understanding


    Understanding (also called intel) is a psychological process related to an abstract
    or physical object, such as a person, situation, or message whereby one is able
    to think about it and use concepts to deal adequately with that object. Understanding
    is a relation between the knower and an object of understanding. Understanding
    implies abilities and dispositions with respect to an object of knowledge sufficient
    to support intelligent behavior. Understanding is the limit of a conceptualization.
    To understand something is to have conceptualized it to a given measure.


    # Is Understanding Definable?


    Yes, albeit with difficulty. The easiest way to define understanding is to do
    so in respect of specific relationships. For examples one can define the concept
    in the context of trust between two individuals.


    A good example is the definition proposed by a Doctoral researcher from the University
    of Cranfield UK. In his analysis of "understanding as an antecedents of trust
    in virtual organisations, Joel De Mess (2011) proposed the following explanation
    of understanding. "To understand someone is to possess enough information about
    the person or thing to be able to accurately explain their unique behaviors and
    characteristics, accommodate their differences, or display tolerance and compassion
    in one''s actions or judgement towards them on the basis of the insight that the
    information provides into their reality." He therefore defined understanding as
    "The successful sense-making or accurate synthesis of information relating to
    an entity (a person, an object, a concept, or a phenomenon) that permits a justified
    explanation of the characteristics, behaviors and events associated with the entity"


    In this definition, Mr De Mess emphasizes that true understanding is independent
    of the belief of the person who understands. It is an absolute function of the
    logic applied to observations and the accuracy of one''s interpretation of the
    facts that concern the entity. True understanding can only be achieved if the
    observer obtains and processes enough information about the entity under scrutiny
    to arrive at conclusions that will always remain true.


    One''s understanding of something only becomes equal to real understanding when
    the assertions about the thing are absolute and always true. If future improvements
    in our logics, formulas, reasoning etc... could invalidate one''s current explanation
    of a phenomenon, then the understanding that yielded the explanation does not
    qualify as true understanding, or better still, is only true as current knowledge
    permits.


    Hence, he argues, there are degrees of understanding as well as understanding
    at a point in time (a collective state of opinion) all of which ultimately seek
    to become true understanding.'
  - '[PAGE 121]


    The conclusion of this definition is that our closeness to true understanding
    is only as good as the information we possess, the logic of analysis we apply
    to the information we have and the finality of our reference point.


    As this shows, it is difficult to define understanding. If we use the term concept
    as above, the question arises as to what is a concept? Is it an abstract thing?
    Is it a pattern or a rule? Whether definition is proposed, we can still ask it
    that we understand the thing that is featured in the definition: we can never
    satisfactorily define a concept, till we use it to explain understanding. It may
    be convenient to use an operational or behavioral definition, that is to say "somebody
    reacts appropriately to x understands x". For example, one understands Swahili
    if one correctly obeys commands in that language. This approach, however, may
    not provide an adequate definition. A computer can easily be programmed to react
    appropriately to commands, but there is a disagreement between whether or not
    the computer understands the language (see the Chinese room argument).


    According to the independent socionics researcher Rostislav Persion:


    In the cognitive model presented by MBTI, the concept of introverted thinking
    (Ti) is thought to represent understanding through cause and effect relationships
    or correlations. One can construct a model of a system by observing correlations
    between all the relevant properties (e.g. the output of a NAND gate relative to
    its inputs). This allows the person to generate truths about the system and then
    apply the model to demonstrate or her understanding. A mechanic may may randomly,
    or algorithmically probe the inputs and outputs of a black box to understand the
    internal components through the use of induction. INTP, ISTP, ESTP, and ENTP all
    use Ti and are usually the best of the 16 types at understanding their environment
    in a bottom-up manner. These types may enjoy mechanics and digital electronics
    because of the 1 to 1 correlation between cause and effect relationships in these
    fields. Understanding is not limited to these types however other types demonstrate
    an identical process, although in other planes of reality; ie. Social, Theological
    and Aesthetic. A potential reason for the association of understanding with the
    former personality types is due to a social phenomenon for asymmetrical distribution
    of gratification. In the field of engineering, engineers probe or study the inputs
    and outputs of components to understand their functionality. These components
    are then combined based on their functionality (similar to computer programming)
    to create a larger, more complex system. This is why engineers attempt to subdivide
    ideas as deep as possible to obtain the lowest level of knowledge. This makes
    their models more detailed and flexible. It may be useful to know the formulas
    that govern an ideal gas, but to visualise the gas as made up of even smaller
    particles, is true understanding. People who are understanding (through the use
    of Ti) usually value objects and people based on usefulness, as opposed to the
    people who use extroverted thinking (Te) who view people or things as having a
    worth.'
  - '[PAGE 122]


