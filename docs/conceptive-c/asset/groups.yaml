    Concepts, as abstract units of meaning, play a key role in the development and
    testing of theories. For example, a relational hypothesis can be viewed as either
    a conceptual hypothesis (where the abstract concepts form the meaning) or an operationalized
    hypothesis, which is situated in the real world by rules of interpretation. For
    example, take the simple hypothesis Education increases Income. The abstract notion
    of education and income (concepts) could have many meanings.


    A conceptual hypothesis cannot be tested. They need to be converted into operational
    hypothesis.- Education could be measured by “years of school completed” or “highest
