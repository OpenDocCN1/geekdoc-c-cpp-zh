    an item is perceived. The ability to look at an item, and remember what it looked
    like with just a second of observation, or memorisation, is an example of sensory
    memory. With very short presentations, participants often report that they seem
    to "see" more than they can actually report. The first experiments exploring this
    form of sensory memory were conducted by George Sperling (1960) using the "partial
    report paradigm". Subjects were presented with a grid of 12 items, arranged into
    three rows of four. After a brief presentation, subjects were then told either
    a high, medium or low tone, cuing which of the rows to report. Based on these
    partial report experiments, Sperling was able to show that the capacity of sensory
    memory was approximately 12 items, but that it degraded quickly (within a few
    hundred milliseconds). Because this form of memory decays so quickly, participants
    would see the display, but be unable to report all of the items (12 in the "whole
    report" procedure) before they decayed. This type of memory cannot be prolonged
    by rehearsal.


    # Short-Term Memory


    Short-term memory allows recall for a period of several seconds to a minute without
    rehearsal. Its capacity is also very limited: George A. Miller (1956), when working
    at Bell Laboratories, conducted experiments showing that the store of short-term
    memory was 7±2 items (the title of his famous paper, "The magical number 7±2").
    Modern estimates of the capacity of short-term memory are lower, typically on
    the order of 4–5 items, however, memory'
  - '[PAGE 87]


    capacity can be increased through a process called chunking. For example, in recalling
    a ten-digit telephone number, a person could chunk the digits into three groups:
    first, the area code (such as 215), then a three-digit chunk (123) and lastly
    a four-digit chunk (4567). This method of remembering numbers is far more effective
    than attempting to remember a string of 10 digits; this is because we are able
    to chunk the information into meaningful groups of numbers. Herbert Simon argued
    the ideal size for chunking letters and numbers, meaningful or not, was three.
    This may be reflected in some countries in the tendency to remember telephone
    numbers as several chunks of three with the final four-number groups, generally
    broken down into groups of two.


    Short-term memory is believed to rely mostly on an acoustic code for storing information,
    and to a lesser extent a visual subjects had more difficulty recalling collections
    of letters that were acoustically similar (e.g. E, P, D). Confusion with recalling
    semantically similar letters rather than visually similar implies that the letters
    were encoded acoustically. Conrad''s (1964) study however, deals with the encoding
    of written text, while memory of written language may rely on acoustic components,
    generalizations to all forms of memory cannot be made.


    However, some individuals have been reported to be able to remember large amounts
    of information, quickly, and be able to recall that information in seconds.


    # Long-Term Memory


    The storage in sensory memory and short-term memory generally have a strictly
    limited capacity and duration, which means that information is not retained indefinitely.
    By contrast, long-term memory can store much larger quantities of information
    for potentially unlimited duration (sometimes a life span). Its capacity is immeasurably
    large. For example, given a random seven-digit number we may remember it for only
    a few seconds before forgetting, suggesting it was stored in our short-term memory.
    On the other hand, we can remember telephone numbers for many years through repetition;
    this information is said to be stored in long-term memory.


    While short-term memory encodes information acoustically, long-term memory encodes
    semantically. Baddeley (1966) discovered that after 20 minutes, test subjects
    had the most difficulty recalling a collection of words that had had similar meanings
    (e.g. big, large, huge).


    Short-term memory is supported by transient patterns of neuronal communication,
    dependent on regions of the frontal lobe (dorsolateral prefrontal cortex) and
    the parietal lobe. Long-term memories, on the other hand, are maintained by more
    stable and permanent changes in neural connections widely spread throughout the
    brain. The hippocampus is essential (for learning new information) to the consolidation
    of information from short-term to long-term memory, although it does not seem
    to store information'
