    A soul – in certain spiritual, philosophical, and psychological traditions – is
    the incorp essence of a person or living thing or object. There is absolutely
    no scientific proof of souls existing - yet many philosophical and spiritual systems
    teach that humans have souls, and others teach that all living things and inanimate
    objects (such as rivers) have souls. The latter belief is commonly called animism.
    Soul sometimes functions as a synonym for spirit, mind or self.


    # Etymology


    The Modern english soul derived from Old English sáwól, sáwel, first attested
    in the 8th century poem Beowulf v. 2820 and in the Vespian Psalter 77.50, and
    is cognate with German and Baltic terms for the same idea, Gothic saila, Old High
    German sēla, sēla, Old Saxon sola, Old Low Francian sēla, Old Norse sála as well
    as Lithuanian siciela. Further etymology of the Germanic word is uncertain. A
    more recent suggestion connects it with a root for “binding,” Germanic *sailian
    (OE séian, OHG seilen), related to the notion of being “bound” in death, and the
    practice of ritually binding or restraining the corpse of the deceased in the
    grave to prevent his her return as a ghost.


    The word is probably an adaptation by early missionaries—particularly Ulfilas,
    apostle to the Goths during the 4th century–a native Germanic concept, which was
    a translation of Greek ψυχή ψὴ “life, spirit, consciousness.”


    The Greek word is derived from a verb “to coil, to blow” and here refers to the
    vital breath, the animating principle in humans and other animals, as opposed
    to some meaning “body”. It could refer to a ghost or spirit of the dead in Homer,
    and to a more philosophical notion of an immortal and immaterial essence left
    over at death Pindar. Latin anima figured as a translation of Terence. Psyché
    occurs juxtaposed to e.g. in Matthew 10:28:


    Authorized King James Version (KJV) "And fear not them which kill the body, but
    are not able to kill the soul: rather fear Him which is able to destroy both soul
    and body in hell"'
