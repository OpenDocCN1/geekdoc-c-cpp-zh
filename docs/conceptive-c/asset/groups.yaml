- md: '

    Life-forms transmit information both vertically (from parent to child, via replication
    of genes) (through viruses and other means). Malcolm Gladstone wrote, "A meme
    is an idea that behaves like a virus—that moves through a population, taking hold
    in each person it infects." Memes replicate vertically or horizontally within
    a single biological generation. They may also lie dormant for long periods of
    time. Memes spread by the behaviors that they generate in their hosts. Imitation
    counts as an important characteristic of the propagation of memes. Imitation often
    involves the copying of an observed behavior of another individual, but memes
    may transmit from one individual to another through a copy recorded in an inanimate
    source, such as a book or musical score. McNamara has suggested that memes can
    be thereby classified as internal or external memes (i-memes or e-memes). Researchers
    have observed memetic copying in just a few species on Earth, including hominids,
    dolphins and birds that learn how to swim by imitating their parents or neighbors.


    Some commentators have linked the transmission of memes to the spread of contagions.
    Social contagions such as fades, hysteria, copycat crime, and copycat suicide
    exemplify memes as the contagious imitation of ideas. Observers distinguish the
    imitation of memes from instinctively contagious phenomena as yawning and laughing,
    which they consider innate (rather than socially learned) behaviors.


    Aaron Lynch described general patterns of meme transmission, and "thought contagion":


    - Quantity of parenthood: an idea that influences the number of children one has.
    Children respond particularly receptively to the ideas of their parents, and thus
    ideas that directly or indirectly encourage a higher birthrate will replicate
    themselves at a higher rate than those that discourage higher birthrates.


    - Efficiency of parenthood: an idea that increases the proportion of children
    who will adopt the ideas of their parents. Cultural separation exemplifies one
    in which one can expect a higher birth rate of meme-replication—because the meme
    for separation creates a barrier from exposure to competing ideas.


    - Proselytic: ideas generally pass to others one''s own children. Ideas that encourage
    the proselytism of a meme, as seen in many religious or political movements, can
    replicate memes horizontally through a given generation, spreading more rapidly
    than parent-to-child meme-transmissions do.


    - Preservational: ideas that influence those that hold them to continue for a
    long time. Ideas that encourage longevity in their hosts, or leave their hosts
    particularly resistant to abandoning or replacing these ideas, enhance the preservability
    of memes and afford protection from the competition or proselytism of other memes.


    - Adversarial: ideas that influence those that hold them to attack or sabotage
    competing ideas and/or those that hold them. Adversarial replication can give
    an advantage in meme transmission when the meme itself encourages aggression against
    other memes.


    - Cognitive: ideas perceived as cogent in the population who encounter them. Cognitively
    transmitted memes depend heavily on a cluster of other ideas and cognitive traits
    already widely held in the population, and thus spread more passively than other
    forms of meme transmission. Memes spread in cognitive transmission do not count
    as self-replicating.


    - Motivational: ideas that people adopt because they perceive some self-interest
    in adopting them. Strictly speaking, motivationally transmitted memes do not self-propagate,
    but this mode of transmission often occurs in association with memes self-replicating
    in the efficiency parental, proselytic and preservational modes.


    ## Memes as Discrete Units


    The meme as a unit provides a convenient means of discussing "a piece of thought
    copied from person to person", regardless if that contains others inside it, or
    forms parts of a larger meme. A meme could consist of a single word, or a meme
    could consist of the entire speech in that word first occurred. This forms an
    analogy to the idea of a gene as a single unit of self-replicating information
    found on the self-replicating chromosome.


    While the identification of memes as "units" conveys their nature to replicate
    as discrete, indivisible entities, it does not imply that thoughts become quantum
    or "atomic" ideas that cannot be dissected into smaller pieces. A meme has no
    given size. Susan Blackmore writes that the difficulty involved in delimiting
    memes as discrete units notes that the first four notes of Beethoven''s Fifth
    Symphony form a meme widely replicated as an independent unit, one can regard
    the entire symphony as a single meme as well.


    The inability to pin an idea or cultural feature to quantifiable key units is
    widely acknowledge as a problem for memetics. It has been argued however that
    the traces of memetic processing can be quantified utilizing neuroimaging techniques
    which measure changes in the connectivity profiles between brain regions. Blackmore
    meets criticism by stating that while a gene has no particular size, nor can we
    ascribe every phenotypic feature directly to a particular gene, it has value because
    it encapsulates that key unit of inherited expression subject to evolutionary
    pressures. To illustrate, she notes evolution selects for the gene for features
    such as eye color; it does not select for the individual nucleotide in a strand
    of DNA. Memes play a comparable role in understanding the evolution of imitated
    behaviors.


    The 1981 book Genes, Mind, and Culture: The Coevolution Process by Charles J.
    Lumsden and E. Wilson proposed the theory that genes and culture co-evolve, and
    that the biological units of culture correspond to neuronal networks that function
    as nodes of semantic memory. They coined their own, "cultur", which did not catch
    on. Coauthor Wilson later acknowledged the term as the best label for the fundamental
    unit of cultural inheritance in 1998 book Consciousness: The Unity of Knowledge,
    which elaborates upon the fundamental role of memes in unifying the natural and
    social sciences.


    ## Evolutions Influences on Memes


    Richard Dawkins noted the three conditions that must exist for evolution to occur:


    - variation, or the introduction of new change to existing elements; heredity
    or replication, or the capacity to create copies of elements; differential "fitness",
    or the opportunity for one element to be more or less suited to the environment
    than another.


    Dawkins emphasizes that the process of evolution naturally occurs whenever these
    conditions co-exist, and that evolution not only apply to organic elements such
    as genes. He regards memes as having the properties necessary for evolution, and
    thus sees meme evolution as not simply analogous to genetic evolution, but as
    real phenomenon subject to the laws of natural selection. Dawkins noted that as
    various ideas pass from one generation to the next, they may enhance or detract
    from the survival of the people who obtain these, or influence the survival of
    the ideas themselves. For example, a certain culture may develop unique designs
    and methods of toolmaking that give it a competitive advantage over another culture.
    Each tooldesign acts somewhat similarly to a biological gene in that populations
    have and do not, and the meme''s function directly affects the presence of the
    gene in future generations. In keeping with the thesis that in evolution one can
    regard organisms as suitable "hosts" for reproducing genes, Dawkins argues that
    one can view memes as "hosts" for replicating memes.


    Consequently, a successful meme may not need to provide any benefit to its host.
    Unlike genetic evolution, memetic evolution can show both Darwinian and Lamarckian
    traits. Cultural memes have the characteristic of Lamarian inheritance as one
    aspires to replicate the given meme through inference rather than by exactly copying
    it. For example the case of the transmission of a simple skill like hammering
    a nail, a skill that a learner obtains from watching a demonstration without necessarily
    imitating every discrete movement modeled by the teacher in the demonstration.

