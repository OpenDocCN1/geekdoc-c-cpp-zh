    +   - [ in imperative ] used to warn someone to avoid injury or damage from a
    hazard: mind your head on cupboard!


    +   - [ in imperative ] be careful about the quality or nature of: mind your manners!


    4 [ with infinitive ] (be minded) chiefly formal be the inclined or disposed to
