    MUD）的文本结构。“avatar”一词也可以指与互联网用户的用户名或代号（handle）相关的个性。用“avatar”一词指代用户在屏幕上的表示是 1985
    年由 Chip Morningstar 和 Joseph Romero 在设计卢斯电影在线角色扮演游戏 Habitat 时创造的。电脑游戏《魔法圈 IV：化身之谜》于
    1985 年发布，但它并没有在此意义上使用该词，而是使用了原始的宗教意义；玩家在游戏中的最终目标是成为化身。该系列随后的游戏使用了与 Habitat 相同的词义，并引入了
    Habitat 式的化定制。该词的另一个早期使用是在纸笔角色扮演游戏《影跑》（Shadowrun, 1989）。


