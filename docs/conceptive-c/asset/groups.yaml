    # Mind


    Brian we know about. You can open someoneones head and there it is, but where
    is the Mind? How do people think about things? What makes us that we understand
    something? A Mind is a Concept used for thinking. We combine various objects and
    concepts to create a Mind Concept.


    # Concept of Mind


    The concept of mind is understood in many different ways by many different traditions,
    ranging from panpsychism and animism to traditional and organized religious views,
    as well as secular and materialistic philosophies. Most agree minds are constituted
    by conscious experience and intelligent thought. Common attributes of mind include
    perception, reason, imagination, memory, emotion, attention, and a capacity for
    communication. A rich set of unconscious processes are also included in many modern
    characterizations of mind.


    Thoughts of mind and function are numerous. Earliest recorded speculations are
    the likes of Zoroaster, the Buddha, Plato, Aristotle, and other ancient Greek,
    Indian, and later, Islamic and medieval European philosophers. Premod understandings
    of the mind, such as the neoplatonic “nows” saw as an aspect of the soul, in the
    sense of being both divine and immortal, linking human thinking with the un-changing
    ordering principle of the cosmos itself.


    Which attributes make the mind is debated. Some psychologists argue that only
    the “higher” intellectual functions constitute mind, particularly reason and memory.
    In this view the emotions—love, hate, fear, joy—are more primitive or subjective
    in nature and should be seen as different from the mind as others. Others argue
    that rational and emotional states cannot be separated, that they are of the same
    nature and origin, and should therefore be considered all part of what we call
    the nature.


    In popular usage mind is frequently synonymous with thought: the private conversation
    with ourselves that we carry on “inside our heads.” Thus we “make up our minds,”
    “change our minds” or are “of minds” about something. One of the key attributes
    of mind in this sense is that it is a private sphere to which no one but the owner
    has access. No one else can “know our mind.” They can only interpret what we consciously
    or unconsciously communicate.


    # Etymology


    The original meaning of Old English gemynd was the faculty of memory, not of thought
    in general. Hence call to mind, come to mind, come to mind, to have mind of, etc.
    Old English had other words to express “mind”, such as hyge “mind, spirit”.


    The generalization of mind to include all mental faculties, thought, volition,
    feeling and memory, gradually develops over the 14th and 15th centuries.'
  - '[PAGE 93]


    The meaning of "memory" is shared with Old Norse, which has munr. The word is
    originally from PIE verbal root *men-, meaning "to think, remember", whereas also
    Latin mens means "mind", Sanskrit manas "mind" and Greek μένος "mind, courage,
    anger".


    # Mental Faculties


    Thought is a mental activity that allows human beings to make sense of things
    in the world, and to represent and interpret them in ways that are significant,
    or according to their needs, attachments, goals, commitments, plans, ends, desires,
    etc. Thinking involves the symbolic or semantic mediation of ideas or data, as
    we form concepts, engage in problem solving, reasoning and making decisions. Words
    that refer to similar concepts and processes include deliberation, cognition,
    ideation, discourse and imagination.


    Thinking is sometimes described as a "higher" cognitive function and the analysis
    of thinking processes is a part of cognitive psychology. It is also deeply connected
    with our capacity to make and use tools; to understand cause and effect; to recognize
    patterns of significance; comprehend and disclose unique contexts of experience
    or activity; and to respond to the world in a meaningful way.


    Memory is the ability to preserve, retain, and subsequently recall, knowledge,
    information or experience. Although memory has traditionally been a persistent
    theme in philosophy, the late nineteenth and early twentieth centuries also saw
    the study of memory as a subject of inquiry within the paradigms of cognitive
    psychology. In recent decades, it has become one of the pillars of a new science
    called cognitive neuroscience, a marriage between cognitive psychology and neuroscience.


    The subject of memory has also been addressed in highly sophisticated ways in
    classic works of 20th century literature, notably in the memory of Marcel Proust,
    and in popular films, e.g. Eternal Sunshine of the Spotless Mind.


    Imagination is the activity of generating or evoking new situations, images, ideas
    or other qualia in the mind. It is a characteristically subjective activity, rather
    than a direct or passive experience. The term is technically used in psychology
    for the process of reviving in the mind percepts of objects formerly given in
    sense perception. Since this the use of the term conflicts with that of ordinary
    language, some psychologists have preferred to describe this process as "imaging"
    or "imagery" or to speak of it as "reproductive" as opposed to "productive" or
    "constructive" imagination.


    Things that are imagined are said to be seen in the "mind''s eye. Among many practical
    functions of imagination are the ability to project futures (or histories), to
    "see" things from another''s perspective, and to change the way something is perceived,
    including to make decisions to respond to, or enact, what is imagined.'
- md: '

    Consciousness in mammals (this includes humans) is an aspect of the mind generally
    thought to comprise qualities such as subjectivity, sentience, and the ability
    to perceive the relationship between oneself and one''s environment. It is a subject
    of much research in philosophy of mind, psychology, neuroscience, and cognitive
    science. Some philosophers divide consciousness into phenomenal consciousness,
    which is subjective experience itself, and access consciousness, which refers
    to the global availability of information processing systems in the brain. Phenomenal
    consciousness has many different experienced qualities, often referred to as qualia.
    Phenomenal consciousness is usually sensed of something or about something, a
    property known as intentionality in philosophy of mind.


    ## Mental Content


    Mental contents are those items which are thought of being "in" the mind, and
    capable of being formed and manipulated by mental processes and faculties. Examples
    include thoughts, concepts, memories, emotions, percepts and intentions. Philosophical
    theories of mental content include internalism, externalism, representationalism
    and intentionality.


    ## Cognitive Science


    In animals, the brain, or encephal (Greek for "in the head”), is the control center
    of the central nervous system, responsible for thought. In most animals, the brain
    is located in the head, protected by the skin and close to the primary sensory
    apparatus of vision, hearing, equilibriumception, taste and olfactory. While all
    vertebrates have a brain, most invertebrates have either a centralized brain or
    collections of individual ganglia. Primitive animals such as sponges do not have
    a brain at all. Brains can be extremely complex. For example, the human brain
    contains more than 100 billion neurons, each linked to as many as 10,000 others.


    Understanding the relationship between the brain and the mind — mind-body problem
    is one of the critical issues in the history of philosophy — is a challenging
    problem both scientifically and conceptually. There are three major philosophical
    schools of thought concerning the answer: dualism, materialism, and idealism.
    Dualism holds that the mind exists independently of the brain; materialism holds
    that mental phenomena are identical to neuronal phenomena; and idealism holds
    that only mental phenomena exist.


    The most straightforward scientific evidence that there is a strong relationship
    between the physical brain matter and the mind is the impact physical alterations
    to the brain have on the mind, such as with traumatic brain injury and psychoactive
    drug use.


    In addition to the philosophical questions, the relationship between mind and
    brain involves a number of scientific questions, including understanding the relationship
    between mental activity and brain activity, the exact mechanisms by which drugs
    influence cognition, and the neural correlates of consciousness.


    Through most of history philosophers argued by a physical substance that inconceivable
    cognition could be implemented by such brain tissue (that is neurons and synapses).
    Philosophers such as Patricia Churchland posit that the drug-mind interaction
    is indicative of an intimate connection between the brain and the mind, not that
    the two are the same entity. Descartes, who thought extensively about mind-brain
    relationships, found it possible to explain reflexes and other simple behaviors
    in mechanistic terms, although he did not believe that complex thought, and language
    in particular, could be explained by reference to the physical brain.


    ## Philosophy of Mind


    Philosophy of mind is the branch of philosophy that studies the nature of the
    mind, mental events, mental functions, mental properties, consciousness and their
    relationship to the physical body. The mind-body problem, i.e., the relationship
    of the mind to the body, is commonly seen as the central issue in philosophy of
    mind, although there are other issues concerning the nature of the mind that do
    not involve its relation to the physical body.


    Dualism and monism are the two majors of thought that attempt to resolve the mind-body
    problem. Dualism is the position that mind and body are in some way separate from
    each other. It can be traced back to Plato, Aristotle and the Samkhya Yoga schools
    of Hindu philosophy, but it was most precisely formulated by René Descartes in
    the 17th century. Substance dualists argue that the mind is an independently existing
    substance, whereas Property dualists maintain that the mind is a group of independent
    properties that emerge from cannot be reduced to the brain, but that it is not
    a distinct substance.


    The 20th century philosopher Martin Heidegger suggested that subjective experience
    and activity (i.e. the "mind") cannot be made of sense in terms of Cartesian "substances"
    that bear "properties" at all (whether the mind itself is thought of as a distinct,
    separate kind of substance or not). This is because the nature of subjective,
    qualitative experience is incoherent in terms of – semantically incommurable with
    the concept of – substances that bear properties. It is a fundamentally ontological
    argument.


    ## Mind / Body Perspectives


    Monism is the position that mind and body are not physiologically and ontologically
    distinct entities. This view was first advocated in Western Philosophy by Parmenides
    in the 5th Century BC and was later espoused by the 17th Century rationalist Baruch
    Spinoza. According to Spinoza''s dual-aspect theory, mind and body are two aspects
    of an underlying reality which he variously described as "Nature" or "God".


    Physicalists argue that only the entities postulated by physical theory exist,
    and that the mind will eventually be explained in terms of these entities as physical
    theory continues to evolve.


    Idealists maintain that the mind is all that exists and that the external world
    is either mental itself, or an illusion created by the mind.


    Neutralists adhere to the position that perceived things in the world can be regarded
    as physical or mental depending on whether one is interested in their relationship
    to other things in the world or their relationship to the perceiver. For example,
    a red spot on a wall is physical in its dependence on the wall and the pigment
    of which it is made, it is mental in so far as its perceived redness depends on
    the workings of the visual system. Unlike dualism, neutral monism does not posit
    a more fundamental substance of which mind and body are aspects.


    The most common monisms in the 20th and 21st centuries have all been variations
    of philosophical; these positions include behaviorism, identity theory, anomalous
    monism and functionalism.


    Many modern philosophers of mind adopt either reductive or-reductive physicalist
    position, maintaining in their different ways that the mind is not separate from
    the body. These approaches have been particularly influential in the sciences,
    e.g. in the fields of sociobiology, computer science, evolutionary psychology
    and the various neurosciences. Other philosophers, however, adopt a non-physical
    position which challenges the notion that the mind is a purely physical construct.


    Reductive physicalists assert that all mental states and properties will eventually
    be explained by scientific accounts of physiological processes and states.


    Non-reductive physicalists argue that although the brain is all there is to the
    mind, the predicates and vocabulary used in mental descriptions and explanations
    are indispensable, and cannot be reduced to the language and lower-level explanations
    of physical science.


    Continued neuroscientific progress has helped to clarify some of these issues.
    However, they are far from being resolved, and modern philosophers of mind continue
    to ask (if at all) the subjective qualities and the intentionality (aboutness)
    of mental states and properties can be explained in naturalistic terms.


    ## Psychology


    Psychology is the scientific study of human behavior, mental functioning, and
    experience; notably both an academic and applied discipline, Psychology involves
    the scientific study of mental processes such as perception, cognition, emotion,
    personality, as well as environmental influences, such as social and cultural
    influences, and interpersonal relationships, in order to devise theories of human
    behavior. Psychology also refers to the application of such knowledge various
    spheres of human activity, including problems of individuals'' daily lives and
    the treatment of mental health problems.

