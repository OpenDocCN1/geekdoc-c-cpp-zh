    This allows instance variables that provide the backing for properties to be synthesized
    at runtime without them being declared in the class'' interface.


    # Fast Enumeration


    Instead of using an NSEEnumerator object or indices to iterate through a collection,
    Objective-C 2.0 offers the fast enumeration syntax. In Objective-C 2.0, the following
    loops are functionally equivalent, but have different performance characteristics.


    ```

    // Using NSEEnumerator

    NSEEnumerator *enumerator = [thePeople objectEnumerator];

    Person *p;

    while ((p = [enumerator nextObject]) != nil) {

    NSLog("%@ %@ is %i years old.", [p name], [p age]);

    }

    // Using indexes

    for (int i = 0; i<[thePeople count]; i++) {

    Person *p = [thePeople objectAtIndex:i];

    NSLog("%@ %@ is %i years old.", [p name], [p age]);

    }

    // Using fast enumeration

    for (Person *p in thePeople) {

    NSLog("%@ %@ is %i years old.", [p name], [p age]);

    }

    ```


    Fast enumeration generates more efficient code than standard enumeration because
    method calls to enumerate over objects are replaced by pointer arithmetic using
    the FastEnumeration protocol.


    # Library Use


    Objective-C today is often used with a fixed library of standard objects (often
    known as a "kit" or "framework\ such as Cocoa or GNUStep. These libraries often
    come with the operating system: the GNUStep libraries often come with GNU/Linux
    based systems and Cocoa comes with OS X. The programmer is not to inherit functionality
    from the existing base class (NSObject). Objective-C allows for the declaration
    of new root classes that do not inherit any existing functionality. Originally,
    Objective-C programming environments typically offered an Object as the base class
    from which all other classes inherited. With the introduction of OpenStep, NeXT
    created a new base class named NSObject, which offered additional features over
    Object (an emphasis on using object references and'
  - '[PAGE 51]


    reference counting instead of raw pointers, for example). Almost classes in Cocoa
    inherit from NSObject.


    Not only did the renaming serve to differentiate the new default behavior of classes
    within the OpenStep API, but it allowed code that used Object—the original base
    class used on NextSTEP (and, or more, other Objective-C class libraries)—to co-exist
    in the same runtime with code used NSObject (with some limitations). The introduction
    of the two prefix also became a simplistic form of namespaces, which Objective-C
    lacks. Using a prefix to create an informal packaging identifier became an informal
    coding standard in the Objective-C community, and continues to this day.


    # Analysis of the Language


    Objective-C implementations use a thin runtime written in C, which adds little
    to the size of the application. In contrast, most object-oriented systems at the
    time that it was created used large virtual machine runtimes. Programs written
    in Objective-C tend to be not much larger than the size of their code and that
    of the libraries (which generally do not need to be included in the software distribution),
    in contrast to Smalltalk systems where a large amount of memory was used just
    to open a window. Objective-C applications tend to be larger than similar C or
    C++ applications because Objective-C dynamic typing does not allow methods to
    be stripped or inline. Since the programmer has freedom to delegate, forward calls,
    build selectors on the fly and pass to the runtime system, the Objective-C compiler
    cannot assume it is safe to remove unused methods or inline calls.


    Likewise, the language can be implemented on top of existing C compilers (in GCC,
    for as a preprocessor, then as a module) rather than as a new compiler. This allows
    Objective-C to leverage the huge collection of C code, libraries, tools, etc.
    Existing C libraries can be wrapped in Objective-C wrappers to provide an OO-style
    interface. In this aspect, it is similar to library and Vala language, which are
    widely used in development of GTK applications.


    All of these practical changes lowered the barrier to entry, likely the biggest
    problem for the widespread acceptance of Smalltalk in the 1980s.


    The first versions of Objective-C did not support garbage collection. That this
    decision was a matter of debate, and many people considered "dead times" (when
    Smalltalk did collection) to render the entire system unusable. Some 3rd party
    implementations added this feature (most notably GNUStep) and Apple has implemented
    it as Mac OS X v10.5.


    Another criticism is that Objective-C does not have language support for namespaces.
    Instead, programmers are forced to prefix their class names, which are traditionally
    shorter than namespace names and thus more prone to collisions. As of 2007, all
    Mac OS X classes and functions in the Cocoa environment are prefixed withNSNS
    (e.g. NSObject, NSButton) to identify them as belonging to the Mac OS X or iOS
    core; the'
