    Turing-indistinguishably from a real person. Turing-scale robotics is an empirical
    branch of research on embodied cognition and situated cognition.


    # Spiritual Approaches


    To most philosophers, the word "consciousness" connotes the relationship between
    the mind and the world. To writers on spiritual or religious topics, it frequently
    connotes the relationship between the mind and God, or the relationship between
    the mind and deep truths that are thought to be more fundamental than the physical
    world. Krishna consciousness, is a term used to mean an intimate linkage between
    the mind of a worshipper and the god Krishna. The mystical psychiatrist Maurice
    Bucke distinguished three types of consciousness: Simple Consciousness, awareness
    of the body, possessed by many animals; Self Consciousness, awareness of being
    aware, possessed only by humans; and Cosmic Consciousness, awareness of the life
    and order of the universe, possessed by humans who are enlightened. Many examples
    could be given. The most thorough account of the spiritual approach may be Ken
    Wilber’s Spectrum of Consciousness, a comparison of western and eastern ways of
    thinking about the mind. Wilber described consciousness as a spectrum with ordinary
    awareness at one end, and more profound types of awareness at higher levels.


    # Scientific Approaches


    For many decades, consciousness as a research topic was avoided by the majority
    of mainstream scientists, because of a general feeling that a phenomenon defined
    in subjective terms could not properly be studied using objective experimental
    methods. Starting in the 1980s, though, an expanding community of neuroscientists
    and psychologists have associated themselves with a field called Consciousness
    Studies, giving rise to a stream of experimental work published in journals as
    Consciousness and Cognition, and methodological work published in journals such
    as the Journal of Consciousness Studies, with regular conferences organized by
    groups such as the Association for the Scientific Study of Consciousness.


    Modern scientific investigations into consciousness are based on psychological
    experiments (including, for example, the investigation of priming effects using
    subliminal stimuli), and on case studies of alterations in consciousness produced
    by trauma, illness, or drugs. Broadly viewed, scientific approaches are based
    on two core concepts. The first identifies the content of consciousness with the
    experiences that are reported by human subjects; the second makes use of the concept
    of consciousness that has been developed by neurologists and other medical professionals
    who deal with patients whose behavior is impaired. In either case, the ultimate
    goals are to develop techniques for assessing consciousness objectively in humans
    as well as other animals, and to understand the neural and psychological mechanisms
    that underlie it.'
