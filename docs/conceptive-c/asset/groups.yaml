    # Arrays


    Array types in C are traditionally of a fixed, static size specified at compile
    time. (The recent C99 standard also allows a form of variable-length arrays).
    However, it is also possible to allocate a block of memory (arbitrary size) at
    run-time, using the standard library''s malloc function, and treat it as an array.
    C''s unification of arrays and pointers (see below) means that true arrays and
    these dynamically-allocated, simulated arrays are virtually interchangeable. Since
    arrays are always accessed via pointers, array accesses are typically not checked
    against the underlying array size, although the compiler may provide bounds checking
    as an option. Array bounds violations are possible and common in carelessly written
    code, and can lead to various repercussions, including memory access, corruption
    of data, buffer overruns, and run-time exceptions.


    C does not have a special provision for declaring multidimensional arrays, but
    rather relies on recursion within the type system to declare arrays of arrays,
    which effectively accomplishes the same thing. The index values of the resulting
    "multidimensional array" can be thought of as increasing in row-major order.


    Multidimensional arrays are commonly used in numerical algorithms (mainly from
    applied linear algebra) to store matrices. The structure of the C array is well
    suited to this particular task. However, since the bounds of the array must be
    fixed values or explicitly passed to any subroutine that requires them, and dynamically
    sized arrays of arrays cannot be accessed using double indexing. A workaround
    for this is to allocate the array with an additional "row vector" of pointers
    to the columns.


    C99 introduced "variable-length arrays" which address some, but not all, of the
    issues with ordinary C arrays.


    # Array-pointer Interchangeability


    A distinctive (but potentially confusing) feature of C is its treatment of arrays
    and pointers. The array- subscript notation x[i] can also be used when x is a
    pointer; the interpretation (using pointer arithmetic) is to access the (i + 1)th
    object of several adjacent objects pointed to by, counting the object x points
    to (which is x[0]) as the first element of the array.


    Formally, x[i] is equivalent to *(x + i). Since the type of the pointer involved
    is known to the compiler at compile time, the address that x + i points to not'
