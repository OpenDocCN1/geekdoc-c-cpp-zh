    开创了计算机科学的许多思想，包括树形数据结构、自动存储管理、动态类型和自主机编译器。


    Lisp 的名称源于“List Processing”（列表处理）。链表是 Lisp 的主要数据结构之一，Lisp 源代码本身由列表组成。因此，Lisp 程序可以像处理数据结构一样处理源代码，从而产生了允许程序员创建新语法、甚至是嵌入
    Lisp 中的新领域特定语言的系统。


    代码与数据的可交换性也赋予了 Lisp 具辨识度的语法。所有程序代码都以 s 表达式（s-expressions）或括号列表的形式编写。函数调用或语法形式写为一个列表，第一个元素是函数或操作符的名字，后面跟着参数：(f
    arg1 arg2 arg3)。


    Lisp 是约翰·麦卡西在 1958 年马萨诸塞理工学院（MIT）期间发明的。麦卡西于 1960 年在《ACM 通信》上发表了他的设计论文，题为《符号表达式的递归函数及其机器计算，第一部分》（“第二部分”从未发表）。他证明了通过几个简单的操作符和函数表示法，就可以构建一种用于算法的图灵完语言。


    信息处理语言（Information Processing Language）是第一个 AI 语言，诞生于 1955 年和 1956 年，并已经包含了许多概念，如列表处理和递归，这些概念后来在
    Lisp 中广泛广泛。


    麦卡西原始表示法使用带括号的“M 表达式”，它们会被翻译为 S 表达式。例如，M 表达式 `(car (cons [A B]))` 等于 S 表达式 `(car
    cons A B)`。一旦 Lisp 实现，程序员就迅速选择使用 S 表达式，M 表达式被遗弃了。M 表达式在 Horace Pratt 短暂的 MLISP
    尝试和 Vaughan Pratt 的 CGOL 中再次出现。


    Lisp 最初由 Steve Russell 在 IBM 704 计算机上首次实现。Russell 拥有麦卡西的资助，并意识到（令麦卡西感到惊讶的是）Lisp
    的 eval 可以用机器码实现。结果是一个可以工作的 Lisp 解释器，可用于运行 Lisp 程序，或者更准确地说是“评估 Lisp 表达式”。


    用于 IBM 704 的两个汇编宏构成了分解列表的原始操作：car（寄存器编号地址的内容）和 cdr（寄存器编号的递减）。从上下文可以清楚，这里的“Register”（寄存器）一词指的是“内存寄存器”，现在被称为“内存位置”。Lisp
    方言仍使用 car 和 cdr 来执行返回列表第一项和列表其余部分的操作。


    第一个用 Lisp 编写的完整 Lisp 编译器由 Tim Hart 和 Mike Levin 在 1962 年在 MIT 实现。该编译器引入了 Lisp
    的增量编译模型，其中已编译的函数和解释执行的函数可以自由交互。Hart 和 Levin 备忘录中使用的语言比麦卡西的早期风格更接近现代 Lisp 风格。


    对于 1970 年代的编译器技术和标准硬件来说，Lisp 是一个很难实现的系统。由当时的 MIT 学生 Daniel Edwards 开发的垃圾回收程序，使得在通用计算系统上运行
    Lisp 变得可行，但效率仍然是一个问题。这导致了 Lisp 机器的诞生：用于运行 Lisp 环境和程序的专用硬件。计算机硬件和编译器技术的进步很快让 Lisp
    机器过时了。


    在 20 世纪 80 年代和 90 年代，人们努力将新 Lisp 方言的工作（主要是 Maclisp 的继承者，如 ZetaLisp 和 NIL（Lisp
    的新实现））统一为一种语言。这种新语言 Common Lisp 与它取代的方言具有一定的兼容性（Common Lisp 支撑了各种构造的兼容性）。1994
    年，ANSI 发布了 Common Lisp 标准《ANSI X3.22-1994 信息技术编程语言 Common Lisp》。


    # 与人工智能的联系


    从诞生起，Lisp 就与人工智能研究社区紧密相连，特别是 PDP-10 系统上。Lisp 被用于编程语言 Micro Planner 的实现，该语言用于著名的
    AI 系统 SHRDLU。在20 世纪 70 年代，随着 AI 研究产生商业分支，现有 Lisp 系统的性能成为一个日益增长的问题。


    Lisp 是第一个同构性（homoisic）编程语言：程序代码的主要表示与用于主要数据结构的相同类型的列表结构。因此，Lisp 函数可以在 Lisp 程序内部被处理、修改甚至创建，而无需对二进制代码进行大量的解析。这被认为是该语言在表达能力方面的优势之一，并使语言适用于元循环求。


    无处不在的 if-then-else 结构现在被认为是任何编程语言的基础要素，它是由麦卡西为 Lisp 发明，并在 Lisp 中首次以更通的形式（cond
    结构）出现。它被 ALGOL 继承并使其普及化。


    Lisp 深地影响了 Smalltalk 研究的领袖 Alan Kay，反过来 Lisp 也受到了 Smalltalk 的影响，在 20 世纪 70 年代引入了面向对象的编程特征（类、实例等）。


    很大程度上由于对早期计算硬件的资源需求，Lisp 没有像 Fortran 和源自 ALGOL 的 C 语言那样在 AI 社区之外流行。Java 和 Python
    等新语言整合了 Lisp 某些特征的有限版本，但不可避免无法带来 Lisp 中完整概念的连贯性和协同效应。由于其适用于定义模糊、复杂且动态的应用，Lisp
    目前正经历着某种流行兴趣的复兴。


