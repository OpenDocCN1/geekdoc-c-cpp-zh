    # Thomas Aquinas


    Following Aristotle and Avicenna, St. Thomas Aquinas understood the soul to be
    the first principle, or act, of the body. However, his epistemological theory
    required that, since the intellectual soul is capable of knowing all material
    things, and in order to know a material thing there must be no material thing
    within it, the soul was definitely not corporeal. Therefore, the soul had operation
    separate from the body and therefore could subsist without the body. Furthermore,
    the rational soul of human beings was subsistent and was not made up of matter
    and form, it could not be destroyed in any natural process. The followup for the
    immortality of the soul and Thomas''s elaboration of Aristotelian theory is found
    in Question 75 of the Summa Theologica.


    # Immanuel Kant


    In discussions of rational psychology Immanuel Kant (1724–1804) identified the
    soul as an "I" in the strictest sense and that the existence of inner experience
    can neither be proved nor disproved. "We cannot prove a priori the immortality
    of the soul, but rather so much: that all properties and actions of the soul cannot
    be cognized from materiality." It is from the "I", or soul, that Kant poses transcendental
    rationalization, but cautions that such rationalization can only determine the
    limits of knowledge if it is to remain practical.


    # James Hillman


    Contemporary psychology is defined as the study of mental processes and behavior.
    However, the word "psychology" literally means "study of the soul", and psychologist
