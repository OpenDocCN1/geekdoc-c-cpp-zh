    # Strong AI as Functionalism


    In more recent presentations of the Chinese room argument, Searle has identified
    "strong AI" as "computer functionalism" (a term he attributes to Daniel Dennett).
    Functionalism is a position in modern philosophy of mind that holds we can define
    mental phenomena (as beliefs, desires, and perceptions) by describing their functions
    in relation to each other and to the outside world. Because a computer program
    can accurately represent functional relationships as relationships between symbols,
    a computer can have mental phenomena if it runs the right program, according to
    functionalism.


    Stevan Harnad argues that Searle''s depictions of strong AI can be reformulated
    as "recognizable tenets of computational, a position unlike ''strong AI'') that
    is actually held by many thinkers, and one worth refuting.


    Computationalism is the position in the philosophy of mind which argues that the
    mind can be accurately described as an information-processing system.


    Each of the following, according to Harnad, is a "tenet" of computationalism:


    Mental states are implementation-independent — which is why computers can have
    mental states and help to explain the mind;


    Computational states are implementation-independent — in other words, it is the
    software that determines the computational state, not the hardware (which is why
    the brain, being hardware, is irrelevant); and that


    Since implementation is unimportant, the only empirical data that matters is how
    the system functions; here the Turing test is definitive.


    # Computers vs. Machines vs. Brains


    The Chinese room has exactly the same design as any modern computer. It has a
    Von Neumann architecture, which consists of a program (the book of instructions),
    some memory (the pages and file cabinets), a CPU which follows the instructions
    (the man), and a means to write symbols in memory (the pencil and eraser). A machine
    with this design is known in computer science as "Turing complete", because it
    has the necessary machinery to carry out any computation that a Turing machine
    can do, and therefore it is capable of doing a step-by-step execution of any other
    digital machine. Alan Turing says, "all digital computers are in a sense equivalent."
    In other words, the Chinese room can do whatever any other computer can do (albeit
    much, much more slowly). The widely accepted Church-Turing thesis holds that anything
    computable is computable by any Turing complete machine.


    The Chinese room (and all modern computers) manipulates physical objects in order
    to carry out calculations and do simulations. AI researchers Allen Newell and
    Herbert Simon called this kind of machine a physical symbol system. It is'
  - '[PAGE 144]


    also equivalent to the formal systems used in the field of mathematical logic.
    Searle emphasizes the fact that this kind of symbol manipulation is syntactic
    (borrowing a term from the study of grammar). The CPU manipulates the symbols
    using a form of syntax rules, without any knowledge of the symbol''s semantics
    (that is, their meaning).


    # Intentionality vs. Consciousness


    Searle''s original argument centered on ''understanding''—that is, mental states
    with what philosophers called ''intentionality''—and did directly address other
    closely related ideas as ''consciousness''. David Chalmers argued that "it is
    fairly clear that consciousness is at the root of the matter". In recent presentations
    of the Chinese Room, Searle has included ''consciousness'' as part of the argument
    as well.


    # Strong AI vs. AI research


    Searle''s argument does not limit the intelligence with which machines can behave
    or act; it does not address this issue directly. "The Chinese room argument...
    assumes complete success on the part of artificial intelligence in simulating
    human cognition," Searle writes. This opens the possibility that a machine could
    be built that acts more intelligent than a person, but does not have a mind or
    intentionality in the same way that brains do.


    Searle''s "strong AI" should not be confused with "strong AI" as defined by Ray
    Kurzweil and other futurists who use the term to describe machine intelligence
    that rivals or exceeds human intelligence. Kurzweil is concerned primarily'
  - '[PAGE 145]


    with the amount of intelligence displayed by the machine, whereas Searle''s

    argument sets no limit on this, as long as it is understood that it is a simulation

    not the real thing.


    # System Reply


    These replies attempt to answer the question: since the man in the room doesn''t\speak
    Chinese, where is the "mind" that does? These replies address the key

    ological issues of mind vs. body and simulation versus. reality. All of the replies

    identify the mind in the room versions of "the system reply".


    The basic "system reply" argues that it is the "whole system" which

    understands Chinese. While the man understands only English, when he is

    combined with the program, scratch paper, pencils and file cabinets, they form

    s system that can understand Chinese. "Here, understanding is not being

    scribed to the more ideal; rather it is being ascribed to this whole system

    of which he is a part" Searle explains. The fact that man does not understand

    Chinese is irrelevant, because it is only the system as a whole which matters.


    Searle notes that (in this simple version of the systems reply) there is nothing

    more than a list of physical objects; it grants the power of understanding and

    consciousness to the "conjunction of that person and bits of paper". Searle

    responds by simplifying the list of physical objects: he asks what happens when

    t man memorizes the rules and keeps track of everything in his head? Then

    the system consists of just one object: the man himself. Searle argues

    that if the man doesn''t understand Chinese then the system doesn''t understand

    Chinese either and the fact that man appears to understand Chinese proves

    nothing. Critics of Searle argue that the program has allowed the\hman to have
    two minds in one head.[who]?


    More sophisticated versions of the system reply try to identify more precisely

    what the "system" is and they differ in exactly how they describe it. According

    to these replies, [who?] the "mind that speaks Chinese" could be such things:

    the "software", a "program", a "running program", a simulation of the neural

    relations of consciousness, the "functional system", a "simulated mind", an

    emergent property", or a "virtual mind" Marvin Minsky''s version of the

    system reply, described below.


    # Virtual Mind Reply


    The term "virtual" is used in computer science to describe an object

    appears to exist "in" a computer (or computer network) only because software

    is making it to appear. The objects "inside" computers (including files,

    folders, and so on) are all "virtual", except for the computer''s electronic

    components. Similarly, Minsky argues, a computer may contain a "mind" that

    is virtual in the same sense as virtual machines, virtual communities and virtual

    reality.


    To clarify the distinction between the simple systems reply given above and

    virtual mind reply, David Cole notes that two simulations could be running on'
  - '[PAGE 146]


    one system at the same time; one speaking Chinese and one speaking Korean. While
    there is only one system, there can be multiple "virtual minds"


    Searle responds that such a mind is, at best, a simulation and writes: "No one
    suggests that computer simulations of a five-alarm fire will burn the neighborhood
    down or a computer simulation of a rainstorm will leave us all drenched."


    Nicholas Fearn responds that, for some things, simulation is as good as the real
    thing. "When we call up the pocket calculator function on a desktop computer,
    the image of a pocket calculator appears on the screen. We do complain that ''isn''t
    really a calculator,'' because the physical attributes of the device do not matter.
    The question is, is the human mind like the pocket calculator, essentially composed
    of information? Or is it other than a computer, and not realizable in full by
    a computer simulation? (The issue of simulation is also discussed in the article
    synthetic intelligence.)


    These replies provide an explanation of why the man in the room understands Chinese.
    If there is something besides the room that understands Chinese, Searle can''t
    argue that (1) the man doesn''t understand Chinese, therefore (2) nothing in the
    room understands Chinese. According to those who make this reply, shows that Searle''s
    argument fails to prove that "strong AI" is false.


    However, the replies, by themselves, do not prove that strong AI is true, either:
    they provide no evidence that the system (or the virtual mind) understands Chinese,
    other than the hypothetical premise that it passes the Turing Test. Searle writes
    "the systems simply begs the question by insisting that the system must understand
    Chinese."


    # Finding the Meaning


    As far as the person in the room is concerned, the symbols are just meaningless
    "squiggles." But if the Chinese room "stands" what it''s saying, the symbols must
    get their meaning from somewhere. These arguments attempt to connect the symbols
    to the things they symbolize. These replies address Searle''s concerns about intentionality,
    symbol grounding and syntax vs.


    # Robot Reply


    Suppose that instead of a room, the program was placed into a robot that could
    wander around and interact with its environment. This would allow a "causal connection"
    between the symbols and the things they represent. Hans Moraveck comments: "If
    we could graft a robot to a reasoning program, we wouldn''t need a person to provide
    the meaning anymore: it would come from the physical world."


    Searle''s reply is to suppose that, unbeknownst to the individual in the Chinese
    room, some of the inputs came directly from a camera mounted on a robot, and'
- md: '

    some of the outputs used were to manipulate the arms and legs of the robot. Nevertheless,
    the person in the room is still just following the rules, and does not know what
    the symbols mean. Searle writes "he doesn''t see what comes into the robot''s
    eyes. (See Mary''s room for a similar thought experiment.)


    # Derived Meaning


    Some respond that the room, as Searle describes, it is connected to the world:
    through the Chinese speakers that it is "talking" to and through the programmers
    who designed the knowledge base in his file cabinet. The symbols Searle manipulates
    are already meaningful, they''re just not meaningful to him.


    Searle says that the symbols only have a "derived" meaning, like the meaning of
    words in books. The meaning of the symbols depends on the conscious understanding
    of the Chinese speakers and the programmers outside the room. The room, according
    to Searle, has no understanding of its own.


    # Commonsense Knowledge


    Some have argued that the meanings of the symbols would come from a vast "background"
    of commonsense knowledge encoded in the program and the filing cabinets. This
    would provide a "context" that would give the symbols their meaning.


    Searle agrees that this background exists, but he does not agree that it can be
    built into programs. Hubert Dreyfus has also criticized the idea that the "background"
    can be represented symbolically.


    However, for those who accept Searle''s actions simulate a mind, separate from
    his own, the important question is not what the symbols mean to Searle, what is
    important is what they mean to the virtual mind. While Searle is trapped in the
    room, the virtual mind is not: it is connected to the outside world through the
    Chinese speakers it speaks to, through the programmers who gave it world knowledge,
    and through the cameras and other sensors that roboticists can supply.


    # Brain Simulator Reply


    Suppose that the program simulated in fine detail the action of every neuron in
    the brain of a Chinese speaker. This strengthens the intuition that there would
    be no significant difference between the operation of the program and the operation
    of a human brain.


    Searle replies that such a simulation will not have reproduced the important features
    of the brain — its causal and intentional states. Searle is adamant that


    "human mental phenomena [are] dependent on actual physical-chemical properties
    of actual human brains." Moreover, he argues:


    Imagine instead of a monolingual man in a room shuffling symbols we have the man
    operate elaborate set of water pipes with valves connecting them. When the man
    receives the Chinese symbols, he looks up in the program, written in English,
    when he has to turn on and off. Each water connection corresponds to a synapse
    in the Chinese brain, and the whole system is rigged so that after all the right
    fights, that is after turning on all the right faucets, the Chinese answers pop
    out at the output end of the series of pipes. Now where as input, it simulates
    the formal structure of the synapses of the Chinese brain, and it gives Chinese
    as output. But the man certainly doesn''t understand Chinese, and neither do the
    water pipes, and if we are tempted to adopt what I think is the absurd view that
    somehow conjunction of man and water pipes understands, remember that in principle
    the man can internalize the formal structure of the water pipes and do all the
    "neuron firings" Searle (1980)


    # Formal Arguments


    Searle has produced a more formal version of the argument of which the Chinese
    Room forms a part. He presented the first version in 1984. The version given below
    is from 1990. The part of the argument which should be controversial is A3 and
    it is this point which the Chinese room thought experiment is intended to prove.


    He begins with three axioms:


    - (A1) "Programs are formal (syntactic)."

    - A program uses syntax to manipulate symbols and pays no attention to the semantics
    of the symbols. It knows where to put the symbols and how to move around, but
    it doesn''t know what they stand for or what they mean. For the program, the symbols
    are just physical objects like any others.

    - (A2) "Minds have mental contents (semantics)."

    - Unlike the symbols used by a program, our thoughts have meaning: they represent
    things and we know what it is represent.

    - (A3) "Syntax by itself is constitutive of [not] sufficient for semantics."

    - This is what the Chinese room argument is intended to prove: the Chinese room
    has syntax (because there is a man in moving symbols around). The Chinese room
    has no semantics (because, according to Searle, there is no one or nothing in
    the room that understands what the symbols mean). Therefore, having syntax is
    not enough to generate semantics.


    Searle posits that these lead directly to this conclusion:


    - (C1) Programs are neither constitutive of nor sufficient for minds.


    This should follow without controversy from the first three: Programs don''t have
    semantics. Programs have only syntax, and syntax is insufficient for Every mind
    has semantics. Therefore programs are not minds.


    This much of the argument is intended to show that artificial intelligence will
    never produce a machine with by writing programs that manipulate symbols. The
    remainder of the argument addresses a different issue. Is the human brain running
    a program? In other words, is the computational theory of mind correct? He begins
    with an axiom that is intended to express the basic scientific consensus about
    brains and minds:


    (A4) Brains cause minds.


    Searle claims that we can derive "immediately" and "trivially" that:


    (C2) Any other system capable of causing minds would have to have causal powers
    (at least) equivalent to those of brains.


    Brains must have something that causes a mind to exist. Science has yet to determine
    exactly what it is, but it must exist, because minds exist. Searle calls "causal
    powers" is whatever the brain uses to create a mind. If anything else can cause
    a mind to exist, it must have "equivalent causal powers". "Equivalent causal powers"
    is whatever else could be used to make a mind.


    And from this he derives the further conclusions:


    (C3) Any artifact that produced mental phenomena, any artificial brain, would
    have to be able to duplicate the specific causal powers of brains, and it could
    not do that just by running a formal program.


    This follows from C1 and C2: Since no program can produce a mind, and "equivalent
    causal powers" produce minds, it follows that programs do not have "equivalent
    causal powers.".


    (C4) The way that human brains actually produce mental phenomena cannot be solely
    by virtue of running a computer program.


    Since programs do not have "equivalent causal powers", "equivalent causal powers"
    produce minds, and brains produce minds, it follows that brains do not use programs
    to produce minds.


    # Mind Uploading


    Whole brain emulation or mind uploading (sometimes called mind transfer) is the
    hypothetical process of transferring or copying a conscious mind from a brain
    to a non-biological substrate by scanning and mapping a biological brain in detail
