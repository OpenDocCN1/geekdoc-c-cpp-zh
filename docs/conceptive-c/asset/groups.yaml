    annual Loebner Prize Contest for Most Human Computer three times, and was also
    the Chatterbox Challenge Champion in 2004.


    Because the A.L.I.C.E. AIML set was released under the GNU GPL, and because AIML
    interpreters are offered under a free or open source license, namely "Alicebot
    clones" have been created based upon the original implementation of the program
    and its AIML knowledge base. Free AIML sets in several languages have been developed
    and made available by the user community. There are AIML interpreters available
    in Java, Ruby, Python, C++, C#, Pascal, and other languages.


    A semi-formal specification and a W3C XML Schema for AIML are available.


    AIML (Artificial Intelligence Markup Language) is an XML-compliant language that''s
    easy to learn, and makes it possible for you to begin customizing a Alicebot or
    creating one from scratch within minutes.


    The most important units of AIML are:


    - <aiml>: the tag that begins and ends an AIML document

    - <category>: the tag that marks a "unit of knowledge" in an Alicebot''s knowledge
    base

    - <pattern>: used to contain a simple pattern that matches what a user may say
    or type to Alicebot

    - <template>: contains the response to a user input


    There are 20 or so additional more tags often found in AIML files, and it''s possible
    to create your own so-called "custom predicates". Right now, a beginner''s guide
    to AIML can be found in the AIML Primer.


    The free A.L.I.C.E. AIML includes a knowledge base of approximately 41,000 categories.
    Here''s an example of one them:


    ```

    <category>

    <pattern>WHAT ARE YOU</pattern>

    <template>


    I am the latest result in artificial intelligence,

    which can reproduce the capabilities of the human brain

    with greater speed and accuracy.

    </template>

    </category>

    ```


    (The opening and closing <aiml> tags are not shown here, because this is an excerpt
    from the document of a document.)


    Everything between <category> and </category> -- you guessed it -- a category.
    A category can have one pattern and one template. (It can also contain a <that>
    tag, but we won''t get into that here.)


    The pattern will match only the exact phrase "what are you" (capitalization is
    ignored).


    But it''s possible that category may be invoked by another category, using the
    <rai> tag (not shown) and the principle of reductionism.


    In any case, if this category is called, it will produce the response "I am the
    latest result in artificial intelligence..." above. In addition, it will do something
    else interesting. Using the <think> tag, which causes Alice to perform whatever
    it contains but hide the result from the user, the Alicebot engine will set the
    "topic" in its memory to "Me". This allows categories elsewhere with an explicit
    "topic" value of "ME" to match better than categories with the same patterns that
    are not given an explicit topic. This illustrates one mechanism whereby a botmaster
    can exercise precise control over a conversational flow.


    # Categories


    Categories in AIML are the fundamental unit of knowledge. A category consists
    of at least two further elements: the pattern and template elements. Here is a
    simple category:


    ```

    <category>

    <pattern>WHAT IS YOUR NAME</pattern>

    <template>My name is John.</template>

    </category>

    ```


    When this category is loaded, an AIML bot will respond to the input "What is your
    name" with the response "My name is John.",


    # Patterns


    A pattern is a string of characters intended to match one or more user inputs.
    A literal pattern like


    WHAT IS YOUR NAME


    will match only one input, ignoring case: "what is your name". But patterns may
    also contain wildcards, which match one or more words. A pattern like


    WHAT IS YOUR *


    will match an infinite number of inputs, including "what is your name", "what
    is your shoe size", "what is your purpose in life", etc.


    The AIML pattern syntax is a very simple pattern language, substantially less
    complex than regular expressions and as not even of level 3 in the Chomsky hierarchy.
    To compensate for the simple pattern matching capabilities, AIML interpreters
    can provide preprocessing functions to expand abbreviations, remove missspellings,
    etc.


    # Template


    A template specifies the response to a matched pattern. A template may be as simple
    as some literal text, like


    My name is John.


    A template may use variables, such as the example


    My name is <bot name="name"/>/>.


    which will substitute the bot''s name into the sentence, or


    You tell me you <get name="user-age"/> years old.


    which will substitute the user''s age (if known) into the sentence.


    Template elements include basic text formatting, conditional response (if-then/else),
    and random responses.


    Templates may also redirect to other patterns, using an element called srai. This
    can be used to implement synonymy, as in this example (where CDATA is used to
    avoid the need for XML escaping):


    ```

    <category>

    <pattern>WHAT IS YOUR NAME</pattern>

    <template><![CDATA[My name is <bot name="name">.]]></template>

    </category>

    <category>

    <pattern>WHAT ARE YOU CALLED</pattern>

    <template>

    <srai>what is your name</srai>

    </template>

    </category>

    ```


    The first category simply answers an input "what is your name" with a statement
    of the bot''s name. The second category, however, says that the input "what are
    you called" should be redirected to the category that matches the input "what
    is your name"—in other words, it is saying that the two phrases are equivalent.


    Templates can contain other types of content, which may be processed by whatever
    user interface the bot is talking through. So, for example, a template may use
    HTML tags for formatting, which can be ignored by clients that don''t support
    HTML.


