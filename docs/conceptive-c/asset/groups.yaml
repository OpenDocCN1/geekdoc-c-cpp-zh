    # 读取-求值-打印循环 (REPL)


    Lisp 语言经常与交互式命令行配合，并与集成开发环境结合。用户在命令行输入表达式，或使用 IDE 将其发送到 Lisp 系统。Lisp 读取输入的表达式，对其进行求值，并打印结果。由于这个原因，Lisp
    命令被称为“读取-求值-打印循环”，或 REPL。


    REPL 的基本操作如下。这是一个简化的描述，省略了真实 Lisp 的许多元素，如引用和宏。


    `read` 函数接受 S 表达式作为输入，并将其解析为内部数据结构。如果你在提示符处输入文本 `(+ 1 2)`，`read` 将其翻译为一个包含三个元素的链表：符号
    `+`、数字 `1` 和数字 `2`。因此，它会报告该列表也是一段有效的 Lisp 代码；也就是说，它是可以被求值的。这是因为列表的 `car` 指向了一个函数——加法操作。


    注意，引用将被读取为单个符号。`123` 将被读取为数字 `123`，`"123"` 将被读取为字符串 `"123"`。


    `eval` 函数求值数据，返回零或多个 Lisp 数据作为结果。求值并不意味着解释；某些 Lisp 系统会将每个表达式编译为原生机器码。然而，将求值描述为解释是非常简单的：要求值一个
    `car` 指向函数的列表，`eval` 首先求值其 `cdr` 中给出的每个参数，然后将函数应用于这些参数。在这种情况下，函数是加法，将它应用于参数列表
    `(1 2)` 得到答案 `3`。这就是求值的结果。


