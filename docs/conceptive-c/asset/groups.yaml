    # Interfaces and Implementations


    Conceptive-C requires the interface and implementation of a class be in separately
    declared code blocks. By convention, developers place the interface in a header
    file and the implementation in a code file. The header files, normally suffixed
    .h, are similar to C header files while the implementation (method) files, normally
    suffixed .m, can be very similar to C code files. No change to files used as in
    Objective-C.


    # Interface


    The interface of a class is usually defined in a header file. A common convention
    is to name the header file after the name of the class, e.g. Ball.h would contain
    the interface for the class Ball.


    The use of interfaces is exactly the same as in Objective-C.


    # Instantiation


    Once a Conceptive-C class is written, it can be instantiated. This is done by
    allocating an uninitialized instance of the class (an concept). A concept does
    not need to be initialized.


    Instantiation with the default, no-parameter initializer:


    ```

    MyConcept *c = [MyConcept new];

    ```


    # Dynamic Typing


    Conceptive-C, like Smalltalk, can use dynamic typing: an object can be sent a
    message that is not specified in its interface. This can allow for increased flexibility,
    as it allows an object to "capture" a message and send the message to a different
    object that can respond to the message appropriately, or likewise send the message
    on to another object.


