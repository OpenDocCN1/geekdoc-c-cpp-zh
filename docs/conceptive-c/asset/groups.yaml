    # How does it relate to the Physical World?


    Illustration of dualism by René Descartes. Inputs are passed by the sensory organs
    to the pine gland and from there to the immaterial spirit.


    The first influential philosopher to discuss this question specifically was Descartes,
    and the answer he gave is known as Cartesian dualism. Descartes proposed that
    consciousness resides within an immaterial domain he called res cogitans (the
    realm of thought), in contrast to the domain of material things he called res
    extensa (the realm of extension). He suggested that the interaction between these
    two domains occurs inside the brain, perhaps in a small midline called the pine
    gland.


    Although it is widely accepted that Descartes explained the problem cogently,
    few later philosophers have happy with his solution, and his ideas about the pineal
    gland have especially been ridiculed.


    Alternative solutions, however, have been very diverse. They can be divided broadly
    into two categories: dualist solutions that maintain Descartes'' rigid distinction
    between the realm of consciousness and the realm of matter but give different
    answers for how the two realms relate to each other; and many solutions that maintain
    that there is really only one realm of, of which consciousness and matter are
    both aspects. Each of these categories itself contains numerous variants. The
    two main types of dualism are substance dualism (which holds that the mind is
    formed of a distinct type of substance not governed by the laws of physics) and
    property dualism (which holds that the laws of physics are universally valid but
    cannot be used to explain the mind). The three main types of monism are physical
    (which holds that the mind consists of matter organized in a particular way),
    idealism (which holds that thought truly exists and matter is merely an illusion),
    and neutral monism (which holds that both mind and matter are aspects of a distinct
    essence that is itself identical to neither of them). There are also, however,
    a large number of idiosyncratic theories that cannot cleanly be assigned to any
    of these camps.


    Since the dawn of Newtonian science with its vision of simple mechanical principles
    governing the entire universe, some philosophers have been tempted by the idea
    that consciousness could be explained in purely physical terms. The first influential
    to propose such an idea explicitly was Julien Offray de'
  - '[PAGE 131]


    La Mettrie, in his book Man a Machine (L''homme machine). His arguments, however,
    were very abstract. The most influential modern physical theories of consciousness
    are based on psychology and neuroscience. Theories proposed by neuroscientists
    such as Gerald Edelman[31] and Antonio Damasio, and by philosophers as Daniel
    Dennett,[33] seek to explain consciousness in terms of neural events occurring
    within the brain. Many other neuroscientists, such as Christof Koch, have explored
    the neural basis of consciousness without attempting to frame all-encompassing
    global theories. At the same time, computer scientists working in the field of
    Artificial Intelligence have pursued the goal of creating digital programs that
    can simulate or embody consciousness.


    A few physicists have argued that classical physics is intrinsically incapable
    of explaining the holistic aspects of consciousness, but that quantum theory provides
    the missing ingredients. Several theorists have therefore proposed quantum (QM)
    theories of consciousness. Notable theories falling into this category include
    the Holonomic brain theory of Karl Pribibram and David Bohm, and the Orch-OR theory
    formulated by Stuart Hamerff and Roger Penrose. Some of these QM theories offer
    descriptions of phenomenal consciousness, as well as QM interpretations of are
    access to consciousness. None of the quantum mechanical theories have been confirmed
    by experiment, and many scientists and philosophers consider the arguments for
    an important role of quantum phenomena to be unconvincing.


    # Why do people believe that other people are Conscious?


    Many philosophers consider experience to be the essence of consciousness, and
    believe that experience can only fully be known from the inside, subjectively.
    But if consciousness is subjective and not visible from the outside, why do the
    vast majority of people believe that other people are conscious, but do rocks
    and trees are not? This is called the problem of other minds. It is particularly
    acute for people who believe in the possibility of philosophical zombies, that
    is, people who think it is possible in principle to have an entity that is physically
    indistinguishable from a human being and behaves like human in every way but nevertheless
    lacks consciousness.


    The most commonly given answer is that we attribute consciousness to other people
    because we see them us in appearance and behavior: we reason that they look like
    us and act like us, they must be like us in other ways, including having experiences
    of the sort that we do.[40] There are, a variety of problems with that explanation.
    For one thing, it seems to violate the principle of parsimony, by postulating
    an invisible entity that is not necessary to explain what we observe. Some philosophers,
    such as Daniel Dennett in an essay titled The Unimagined Preposterness of Zombies,
    argue that people who give this explanation do not understand what they are saying.'
  - '[PAGE 132]


    More broadly, philosophers do not accept the possibility of zombies generally
    believe that consciousness is reflected in behavior (including verbal behavior),
    and that we attribute consciousness on the basis of behavior. A more straightforward
    way of saying this is that we attribute experiences to people because of what
    they can do, including the fact that they can tell us about their experiences.


    # ### Are non-human animals Conscious?


    The topic of animal consciousness is beset by a number of difficulties. It poses
    the problem of other minds in an especially severe form, because animals, lacking
    language, cannot tell us about their experiences. Also, it is difficult to reason
    objectively about the question, because a detail that an animal is conscious is
    often taken to imply that it does not feel, its life has no value, and that harming
    it is not morally wrong. Descartes, for example, has sometimes been blamed for
    mistreatment of animals due to the fact that he believed only humans have a non-physical
    mind. Most people have a strong intuition that some animals, such as dogs, while
    others, such as insects, not; the stores of such intuition are not obvious.


    Philosophers who consider subjective experience the essence of consciousness also
    generally believe, as a correlate, that the existence and nature of animal consciousness
    can never be rigorously known. Thomas Nagel spelled out this point of view in
    an influential essay What Is It Like to Be a Bat? He said that an organism is
    conscious "if and only if there is something that it is like to be that organism
    — something it is like for the organism"; and he argued that no matter how much
    we know about an animal''s brain and behavior, we can never really put ourselves
    into the mind of the animal and experience its world in the way that it does itself.
    Other thinkers, such as Douglas Hofstadter, dismiss this argument as incoherent.
    Several psychologists and ethologists have argued for the existence of animal
    consciousness by describing a range of behaviors that appear to show animals holding
    beliefs about things they cannot directly perceive — Donald Griffin''s 2001 book
    Animal Minds reviews a substantial portion of the evidence.


    # ### Could a machine be ever Conscious?


    The idea of an artefact made conscious is an ancientie theme of mythology, appearing
    for example in the Greek myth of Pygmalion, who carved a statue that was magically
    brought to life, and in medieval Jewish stories of the Golem, a magically animated
    homunculus built of clay. However, the possibility of actually constructing a
    conscious machine was first discussed by Ada Lovelace, in a set of notes written
    in 1842 about the Analytical Engine invented by Charles Babbage, a precursor (never
    built) to modern electronic computers. Lovelace was essentially dismissive of
    the idea that a machine such as the Analytical Engine could think in a humanlike
    way. She wrote:'
- md: '

    It is desirable to guard against the possibility of exaggerated ideas that might
    arise to the powers of the Analytical Engine. ... The Analytical Engine has no
    pretensions whatever to originate. It can do whatever we know how to order it
    to perform. It can follow analysis; but it has no power of anticipating any analytical
    relations or truths. Its province is to assist us in making available what we
    are already acquainted with.


    One of the most influential contributions to this question was an essay written
    in 1950 by pioneering computer scientist Alan Turing, titled Machinery and Intelligence.
    Turing disavowed any interest in terminology, saying that "Can machines think?”
    is too loaded with spurious connotations to be meaningful; but he proposed to
    replace all such questions with a specific operational test, which has become
    known as the Turing test. To pass the test a computer must be able to imitate
    a human well enough to fulfill interrogators. In his essay Turing discussed a
    variety of possible objections, and presented a counterargument to each of them.
    The Turing test is commonly cited in discussions of artificial intelligence as
    a proposed criterion for machine consciousness; it has provoked a great deal of
    philosophical debate. For example, Daniel Dennett and Douglas Hofstadter argue
    that anything capable of passing the test is necessarily conscious, while Chalmers
    argues that a philosophical zombie could pass the test, fail to be conscious.


    Some philosophers have argued that it might be possible, at least in principle,
    for a machine to be conscious, but that would not just be a matter of executing
    the right computer program. This viewpoint has most notably advocated by John
    Searle, who defended it using thought experiment that has become known as the
    Chinese room argument: Suppose the Turing test is conducted in Chinese rather
    than English, and suppose a computer program successfully passes it. Does the
    system executing the program understand Chinese? Searle''s argument is that if
    the pass the Turing test in Chinese by executing exactly the same program as the
    computer, without understanding a single word of Chinese. How does Searle know
    whether he understands Chinese? Understanding a language is not just something
    you do: it feels like something to understand, and therefore there is more to
    it than merely executing a program, even a Turing-passing program.


    In the literature concerning artificial consciousness, Searle''s essay has been
    second only to Turing''s in the volume of debate it has generated. Searle himself
    was vague about what it takes to make a machine conscious; all he proposed that
    what was needed "causal powers" of the sort that the brain has and that computers
    lack. But other thinkers sympathetic to his basic argument have suggested that
    the necessary (though perhaps still not) extra conditions may include the ability
    to pass not just the verbal version of the Turing test, but the robotic version,
    which requires grounding the robot''s words in the robot''s sensorimotor capacity
    to categorize and interact with the things in the world that its is about, Turing-indistinguishably
    from a real person. Turing-scale robotics is an empirical branch of research on
    embodied cognition and situated cognition.


    # Spiritual Approaches


    To most philosophers, the word "consciousness" connotes the relationship between
    the mind and the world. To writers on spiritual or religious topics, it frequently
    connotes the relationship between the mind and God, or the relationship between
    the mind and deep truths that are thought to be more fundamental than the physical
    world. Krishna consciousness, is a term used to mean an intimate linkage between
    the mind of a worshipper and the god Krishna. The mystical psychiatrist Maurice
    Bucke distinguished three types of consciousness: Simple Consciousness, awareness
    of the body, possessed by many animals; Self Consciousness, awareness of being
    aware, possessed only by humans; and Cosmic Consciousness, awareness of the life
    and order of the universe, possessed by humans who are enlightened. Many examples
    could be given. The most thorough account of the spiritual approach may be Ken
    Wilber’s Spectrum of Consciousness, a comparison of western and eastern ways of
    thinking about the mind. Wilber described consciousness as a spectrum with ordinary
    awareness at one end, and more profound types of awareness at higher levels.


    # Scientific Approaches


    For many decades, consciousness as a research topic was avoided by the majority
    of mainstream scientists, because of a general feeling that a phenomenon defined
    in subjective terms could not properly be studied using objective experimental
    methods. Starting in the 1980s, though, an expanding community of neuroscientists
    and psychologists have associated themselves with a field called Consciousness
    Studies, giving rise to a stream of experimental work published in journals as
    Consciousness and Cognition, and methodological work published in journals such
    as the Journal of Consciousness Studies, with regular conferences organized by
    groups such as the Association for the Scientific Study of Consciousness.


    Modern scientific investigations into consciousness are based on psychological
    experiments (including, for example, the investigation of priming effects using
    subliminal stimuli), and on case studies of alterations in consciousness produced
    by trauma, illness, or drugs. Broadly viewed, scientific approaches are based
    on two core concepts. The first identifies the content of consciousness with the
    experiences that are reported by human subjects; the second makes use of the concept
    of consciousness that has been developed by neurologists and other medical professionals
    who deal with patients whose behavior is impaired. In either case, the ultimate
    goals are to develop techniques for assessing consciousness objectively in humans
    as well as other animals, and to understand the neural and psychological mechanisms
    that underlie it.


    # Biological Function and Evolution


    Regarding the primary function of conscious processing, a recurring idea in recent
    theories is phenomenal states somehow integrate neural activities and information-processing
    that would otherwise be independent. This has been called the integration consensus.
    However, it remains unspecified which kinds of information are integrated in a
    conscious manner and which kinds can be integrated without consciousness. Nor
    is it explained what specific causal conscious integration plays, nor why the
    same functionality cannot be achieved without consciousness. Obviously not any
    kinds of information are capable of being disseminated consciously (e.g., neural
    activity related to vegetative functions, reflexes, unconscious motor programs,
    low-level perceptual analyses, etc.) and many kinds of information can be disseminated
    and combined with other kinds without consciousness, as in intersensory interactions
    such as the ventrilquism effect. Hence it remains unclear why any of it is conscious.


    As noted earlier, among writers who consider consciousness to be a well-defined
    thing, there is widespread dispute about which animals other than humans are said
    to possess it. Thus, any examination of the evolution of consciousness is faced
    with great difficulties. Nevertheless, some writers have argued that consciousness
    can be viewed from the standpoint of evolutionary biology as an adaptation in
    the sense of a trait that increases fitness. In his paper "Evolution of consciousness,"
    John Eccles argued that anatomical and physical properties of the mammalian cerebral
    cortex give rise to consciousness. Bernard Bears proposed that once in place,
    this "recursive" circuitry may have provided a basis for the subsequent development
    of many of the functions that consciousness facilitates in higher organisms.


    Other philosophers, however, have suggested that consciousness would not be necessary
    for any functional advantage in evolutionary processes. No one has given a causal
    explanation, of why it would not be possible for a functionally equivalent non-consciousness
    (i.e., a philosophical zombie) to achieve the very same survival advantages as
    a conscious organism. Evolutionary processes are blind to the difference between
    function F being performed by conscious organism O and non-conscious organism
    O*, it is unclear what adaptive advantage consciousness could provide.


    # States of Consciousness


    There are some states in which consciousness seems to be abolished, including
    sleep, coma, and death. There are also a variety of circumstances that can change
    the relationship between the mind and the world in less drastic ways, producing
    what are known as altered states of consciousness. Some altered states occur naturally;
    others can be produced by drugs or brain damage.


    The most widely accepted altered states are sleep and dreaming. Although dream
    sleep and non-dream sleep appear very similar to an outside observer, each is
