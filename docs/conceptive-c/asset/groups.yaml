    # List Structure of Program Code


    A fundamental distinction between Lisp and other languages is that in Lisp, the
    textual representation of a program is simply a human-readable description of
    the internal data structures (linked lists, symbols, number, characters, etc.)
    as would be used by the underlying Lisp system.


    Lisp macros operate on these structures. Because Lisp code has the same structure
    as lists, macros can be built with any of the list-processing functions in the
    language. In short, anything Lisp can do to a data structure, Lisp macros can
    do to code. In contrast, in most other languages, the parser''s output is purely
    internal to the language implementation and cannot be manipulated by the programmer.
    Macros in C, for instance, operate on the level of the preprocessor, before the
    parser is invoked, and cannot re-structure the program code in the way Lisp macros
    can.


    In simplistic Lisp implementations, this list is literally a piece of list structure
    which is to run the program; traversed by the interpreter in executing it. However,
    most actual Lisp systems (including all conforming Common Lisp systems) also include
    a compiler. The compiler translates list structure into machine code or bytecode
    for execution.


    # Evaluation and the Read-Eval-Print Loop


    Lisp languages are frequently used with an interactive command line, which may
    be combined with an integrated development environment. The user types in expressions
    at the command line, or uses the IDE to transmit them to the Lisp system. Lisp
    reads the entered expressions, evaluates them, and prints the result. For this
    reason, the Lisp command is called a "read-eval-print loop", or REPL.


    The basic operation of the REPL is as follows. This is a simplistic description
    which omits many elements of a real Lisp, such as quoting and macros.


    The read function accepts S-expressions as input, and parses them into an internal
    data structure. If you type the text (+ 1 2) at the prompt, read translates this
    into a linked list with three elements: the symbol +, the number 1, and the number
    2. So it reports that list is also a valid piece of Lisp code; that is, it can
    be evaluated. This is because the car of the list names a function—the addition
    operation.


    Note that a quote will read as a single symbol. 123 will be read as the number
    123, "123" will be read as the string "123".


    The eval function evaluates the data, returning zero or more other Lisp data as
    result. Evaluation does not have mean interpretation; some Lisp systems compile
    every expression to native machine code. It is simple, however, to describe evaluation
    as interpretation: To evaluate a list whose car names a function, eval first evaluates
    each of the arguments given in its cdr, then applies the function to the arguments.
    In this case, the function is addition, and applying it to the argument list (1
    2) yields the answer 3. This is the result of the evaluation.


    The symbol foo evaluates to the value of the symbol foo. Data like the string
    "123" evaluates to the same string. The list (quote (1 2 3)) evaluates to the
    list (1 2 3).


    It is the job of the print function to represent output to the user. For a simple
    result such as this is trivial. An expression which evaluated to a piece of list
    would require that print traverse the list and print it out as an S-expression.


    To implement a Lisp REPL, it is necessary only to implement these three functions
    and an infinite-loop function. (Naturally, the implementation of eval will be
    complicated, since it must also implement all special operators like if or lambda.)
    This done, a basic REPL is itself a single line of code: (print (eval)).


    The Lisp REPL typically also provides input editing, an input history, error handling
    and an interface to the debugger.


    Lisp is usually evaluated eagerly. In Common Lisp, arguments are evaluated in
    applicative order (leftmost innermost), while in Scheme order of arguments are
    undefined, leaving room for optimization by a compiler.


    # Control Structures


    Lisp originally had few control structures, but many more were added during the
    language''s evolution. (Lisp''s original conditional operator, cond, is the precursor
    to later if-then-else structures.)


    Programmers in the Scheme dialect often express loops using tail recursion.


    As the reader may have noticed from the above discussion, Lisp syntax lends itself
    naturally to recursion. Mathematical problems such as the enumeration of recursively
    defined sets are simple to express in this notation.


    Frequently, the same algorithm can be expressed in Lisp in either an imperative
    or functional style. As noted above, Scheme tends to favor the functional style,
    using tail recursion and continuations to express control flow. However, imperative
    style is still quite possible. The style preferred by many Common Lisp programmers
    may seem more familiar to programmers used to structured languages as C, while
    that preferred by Schemers resembles pure-functional languages such as Haskell.

