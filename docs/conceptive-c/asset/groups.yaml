    \ goto statement that branches directly to the designated label within the function\
    \ switch selects a case to be executed based on the value of an integer expression.\n\
    \nExpressions can use a variety of built-in operators (see below) and may contain\
    \ function calls. The order in which arguments to functions and operands to most\
    \ operators are evaluated is unspecified. The evaluations may be interleaved.\
    \ However, all side effects (including storage to variables) will occur before\
    \ the 'sequence point'; sequence points include the end of each statement, and\
    \ the entry and return from each function call. Sequence points also occur during\
    \ evaluation of expressions containing certain operators (, ?: comma operator).\
    \ This permits a high degree of object code optimization by the compiler, but\
    \ requires C programmers to take more care to obtain reliable results than is\
    \ needed for other programming languages.\n\n## Keywords\n\nC89 has 32 keywords\
    \ (reserved words with special meaning):\n\nC99 adds five more keywords:\n- _Bool\
    \ inline\n- _Complex restrict\n- _Imaginary\n\nC11 adds seven more keywords:\n\
    - _Alignas _Generic _Static_assert\n- _Alignof _Noreturn _Thread_local\n- _Atomic\n\
    \n## Operators\n\nC supports a rich set of operators, which are symbols used within\
    \ an expression to specify the manipulations to be performed while evaluating\
    \ an expression. C has operators for:\n\n- arithmetic: +, -, *, /, %\n- assignment:\
    \ +=, -=, *=, /=, %= &==, |=, ^=, <<=, >>=\n- bitwise logic: ~, &, ^\n- bitwise\
    \ shifts: <<, >>\n- boolean logic: !, && ||\n- conditional evaluation: ? :\n-\
    \ equality testing: ==, !=\n- calling functions: ()\n- increment and decrement:\
    \ ++ and --\n- member selection: .., ->\n- object size: sizeof\n- order relations:\
    \ <, <=, >=\n- reference and dereference: &, *, []\n- sequencing: ,\n- subexpression\
    \ grouping: ()\n- type conversion: (typename)\n\n## \"Hello, world\" Example\n\
    \nThe \"hello, world\" example, which appeared in the first edition of K&R, has\
    \ become the model for an introductory program in many programming textbooks,\
    \ regardless of programming language. The program prints \"hello, world\" to the\
    \ standard output, which is usually a terminal or screen display.\n\nThe original\
    \ version was:\n```c\nmain()\n{\nprintf(\"hello, world\\n\");\n}\n```\n\nA standard-conforming\
    \ \"hello, world\" program is:\n```c\n#include <stdio.h>\nint main(void)\n{\n\
    \  printf(\"hello, world\\n\");\n  return 0;\n}\n```\n\nThe first line of the\
    \ program contains a preprocessor directive, indicated by #include. This causes\
    \ the compiler to replace that with the entire text of the stdio.h header, which\
    \ contains declarations for standard input and output functions as printf. The\
    \ angle brackets surrounding stdio.h indicate that stdio.h is located using a\
    \ search strategy that prefers standard headers to other headers having the same\
    \ name (Double quotes are used to include local or project-specific header files).\n\
    \nThe next line indicates that a function named main is being defined. The main\
    \ function serves a special purpose in C programs; the run-time environment calls\
    \ the main function to begin program execution. The type specifier indicates that\
    \ the value that is returned to the invoker (in this case, the run-time environment)\
    \ as a result of evaluating the main function is an integer. The keyword void\
    \ as a parameter list indicates that this function takes no arguments.\n\nThe\
    \ opening brace indicates the beginning of the definition of the main function.\n\
    \nThe next line (diverts execution to) a function named printf, which is supplied\
    \ from a system library. In this call, the printf function is passed (with which)\
    \ a single argument, the string literal \"hello, world\". The string literal is\
    \ an unnamed array of elements of type char, set up automatically by the compiler\
    \ with a final 0-valued character to mark the end of the array (printf needs to\
    \ know this). The \\ is an escape sequence that C translates to a newline character,\
    \ which on output signifies the end of the current line. The return value of printf\
    \ is type int, but it is silently discarded because it is not used. (A more careful\
    \ program might test the return value to determine whether or not the printf function\
    \ succeeded.). The semicolon terminates the statement.\n\nThe return statement\
    \ terminates the execution of the main function and causes to return the integer\
    \ value 0, which is interpreted by the run-time system as an exit code indicating\
    \ successful execution.\n\nThe closing brace indicates the end of the code for\
    \ the main function.\n\n## Data Types\n\nC has a static weak typing system that\
    \ shares some similarities with other ALGOL descendants as Pascal. There are built-in\
    \ types for integers of various sizes, both signed and unsigned, floating-point\
    \ numbers, characters, and enumerated types (enum). C99 added a boolean datatype.\n\
    \nare derived types including arrays, pointers, records (struct), and untagged\
    \ unions (union).\n\nC is often used in low-level systems programming where escapes\
    \ from the type system may be necessary. The compiler attempts to ensure type\
    \ correctness of most expressions, but the programmer can override the checks\
    \ in various ways, either by using a type cast to explicitly convert a value from\
    \ one type to another, or by using pointers or unions to reinterpret the underlying\
    \ bits of value in some other way.\n\n## Pointers\n\nC supports the use of pointers,\
    \ a type of reference that records the address or location of an object or function\
    \ in memory. Pointers can be dereferenced to access data stored at the address\
    \ pointed to, or to invoke a pointed-function. Pointers can be manipulated using\
    \ assignment or pointer arithmetic. The runtime representation of a pointer value\
    \ is typically a raw memory address (augmented by an offset-width field), but\
    \ a pointer's type includes the type of the thing pointed to, expressions including\
    \ pointers can be type-checked at compile time. Pointer arithmetic is automatically\
    \ scaled by the size of the pointed-to data type.(See Array-pointer interchangeability\
    \ below.) Pointers are used for many different purposes in C. Text strings are\
    \ commonly manipulated using pointers into arrays of characters. Dynamic memory\
    \ allocation is performed using pointers. Many data types, such as trees, are\
    \ commonly implemented as dynamically allocated objects linked together using\
    \ pointers. Pointer to functions are useful for passing functions as arguments\
    \ to higher-order functions (such as qsort or bsearch) or as callbacks to be invoked\
    \ by event handlers.\n\nA null pointer is a pointer that explicitly points to\
    \ no valid location. It is created by setting a pointer to the value zero. The\
    \ internal representation of pointers is not specified, and null pointers might\
    \ not be represented in the same way as a zero integer. Dereferencing a null pointer\
    \ is undefined, often resulting in a segmentation fault. Null pointers are useful\
    \ for indicating special cases such as no next pointer in the final node of a\
    \ linked list, or as an error indication from returning pointers. Null pointers\
    \ are sometimes represented by a standard macro named NULL. Null pointers logically\
    \ evaluate to false, while all pointers evaluate to true.\n\n## Arrays\n\nArray\
    \ types in C are traditionally of a fixed size specified at compile time. (The\
    \ recent C99 standard also allows variable-length arrays). However, it is also\
    \ possible to allocate a block of memory (arbitrary size) at run-time, using the\
    \ standard library's malloc function, and treat it as an array. C's unification\
    \ of arrays and pointers (see below) means that true arrays and these dynamically-allocated\
    \ arrays are virtually interchangeable. Since arrays are always accessed via pointers,\
    \ array accesses are typically not checked against the array size, although the\
    \ compiler may provide bounds checking. Array bounds violations are possible and\
    \ common in carelessly written code, and can lead to various repercussions, including\
    \ memory access, corruption of data, buffer overruns, and run-time exceptions.\n\
    \nC does not have a special provision for declaring multidimensional arrays, but\
    \ rather relies on recursion within the type system to declare arrays of arrays,\
    \ which effectively accomplishes the same thing. The index values of the resulting\
    \ \"multidimensional array\" can be thought of as increasing in row-major order.\n\
    \nMultidimensional arrays are commonly used in numerical algorithms (mainly from\
    \ applied linear algebra) to store matrices. The structure of the C array is well\
    \ suited to this particular task. However, since the bounds of the array must\
    \ be fixed values or explicitly passed to any subroutine that requires them, and\
    \ dynamically sized arrays of arrays cannot be accessed using double indexing.\
    \ A workaround for this is to allocate the array with an additional \"row vector\"\
    \ of pointers to the columns.\n\nC99 introduced \"variable-length arrays\" which\
    \ address some, but not all, of the issues with ordinary C arrays.\n\n## Array-pointer\
    \ Interchangeability\n\nA distinctive (but potentially confusing) feature of C\
    \ is its treatment of arrays and pointers. The array- subscript notation x[i]\
    \ can also be used when x is a pointer; the interpretation (using pointer arithmetic)\
    \ is to access the (i + 1)th object of several adjacent objects pointed to, counting\
    \ the object x points to (which is x[0]) as the first element of the array.\n\n\
    Formally, x[i] is equivalent to *(x + i). Since the type of the pointer involved\
    \ is known to the compiler at compile time, the address that x + i points to not\n"
  mdcn: "\n语句或跳过其重新初始化。还有一种非结构化的 goto 语句，可以直接跳转到函数内部指定的标签；`switch` 语句根据整数表达式的值选择要执行的\
    \ `case`。\n\n表达式可以使用多种内置运算符（见下文），并可能包含函数调用。函数参数和大多数运算符操作数的求值顺序是不确定的。求值过程可能是交错的。然而，所有的副作用（包括对变量的存储）都将发生在“序列点”（sequence\
    \ point）之前；序列点包括每个语句的结束，以及每次函数调用的进入和返回。在包含某些运算符（`, ?:` 逗号运算符）的表达式求值过程中也会发生序列点。这允许编译器对目标代码进行高度优化，但要求\
    \ C 程序员比其他编程语言的程序员需要更加小心，以获得可靠的结果。\n\n## 关键字\n\nC89 有 32 个关键字（具有特殊含义的预留字）：\n\n\
    C99 增加了 5 个关键字：\n- _Bool inline\n- _Complex restrict\n- _Imaginary\n\nC11 又增加了\
    \ 7 个关键字：\n- _Alignas _Generic _Static_assert\n- _Alignof _Noreturn _Thread_local\n\
    - _Atomic\n\n## 运算符\n\nC 支持丰富的运算符集合，这些符号是在表达式内部使用的，用于指定求值表达式时要执行的操作。C 具有以下运算符：\n\
    \n- 算术：+, -, *, /, %\n- 赋值：+=, -=, *=, /=, %= &==, |=, ^=, <<=, >>=\n- 位逻辑：~,\
    \ &, ^\n- 位移：<<, >>\n- 布尔逻辑：!, && ||\n- 条件求值：? :\n- 等于测试：==, !=\n- 函数调用：()\n-\
    \ 增/减：++ 和 --\n- 成员选择：.., ->\n- 对象大小：sizeof\n- 关系关系：<, <=, >=\n- 引用与解引用：& *, []\n\
    - 排序：，\n- 子表达式分组：()\n- 类型转换：(typename)\n\n## \"Hello, world\" 示例\n\n\"hello, world\"\
    \ 示例出现在 K&R 第一版中，已成为许多编程教材中入门程序的模型，无论编程语言如何。该程序向标准输出（通常是终端或屏幕显示）打印 \"hello, world\"\
    。\n\n原始版本为：\n```c\nmain()\n{\nprintf(\"hello, world\\n\");\n}\n```\n\n一个符合标准的\
    \ \"hello, world\" 程序是：\n```c\n#include <stdio.h>\nint main(void)\n{\n  printf(\"\
    hello, world\\n\");\n  return 0;\n}\n```\n\n程序的第一行包含一个预处理器指令，由 `#include` 指明。这会导致编译器将其替换为\
    \ `stdio.h` 头文件的全部文本，该文件包含了如 `printf` 等标准输入输出函数的声明。`stdio.h` 周围的角括号表示 `stdio.h`\
    \ 使用一种搜索策略查找，该策略优先选择标准头文件而非同名的其他文件（双引号用于包含本地或项目特定的头文件）。\n\n下一行表示正在定义一个名为 `main`\
    \ 的函数。`main` 函数在 C 程序中具有特殊用途；运行时环境调用 `main` 函数来开始程序执行。类型说明符表示，求值 `main` 函数后返回给调用者（在此例中为运行时环境的值是一个整数。参数列表中的关键字\
    \ `void` 表示此函数不接受任何参数。\n\n左大括号表示 `main` 函数定义的开始。\n\n下一行（跳转执行到）一个名为 `printf` 的函数，该函数由系统库提供。在此调用中，向\
    \ `printf` 函数传递了一个参数，即字符串字面量 \"hello, world\"。该字符串字面量是一个 `char` 类型元素的无名数组，由编译器自动设置，并带有一个值为\
    \ 0 的末尾字符以标记数组的结束（`printf` 需要知道）。`\\` 是一个转义序列，C 将其翻译为换行符，在输出时表示当前行的结束。`printf`\
    \ 的返回值类型为 `int`，但由于它未被使用而被静默地丢弃了（更严谨的程序可能会测试返回值以确定 `printf` 函数是否成功）。分号终止该语句。\n\
    \n`return` 语句终止 `main` 函数的执行，并导致返回整数值 0，该值被运行时系统解释为表示执行执行的退出码。\n\n右大括号表示 `main`\
    \ 函数代码的结束。\n\n## 数据类型\n\nC 拥有一种静态弱类型系统，与其它 ALGOL 后代语言（如 Pascal）具有某些相似之处。内置了各种大小的整数（包括有符号和无符号）、浮点数、字符和枚举类型（enum）。C99\
    \ 增加了布尔数据类型。\n\n派生类型包括数组、指针、记录（struct）和未标记联合体（union）。\n\nC 经常用于底层系统编程，在这些情况下可能需要逃离类型系统。编译器尝试确保大多数表达式的类型正确性，但程序员可以通过多种方式覆盖检查，通过使用类型转换显式地将值从一种类型转换为另一种类型，或者通过使用指针或联合体以其他方式重新解释值的底层位。\n\
    \n## 指针\n\nC 支持使用指针，指针是一种引用，用于记录内存中对象或函数的地址或位置。指针可以被解引用以访问存储在所指向地址的数据，或调用所指向的函数。指针可以使用赋值或指针算术进行操作。指针值的运行时表示通常是一个原始内存地址（由偏移宽度字段增强），但指针的类型包含了所指向对象的类型，包含指针的表达式可以在编译时进行类型检查。指针算术会自动根据指向的数据类型的大小进行缩放。（见下文“数组与指针的互换性”）。指针在\
    \ C 中有许多用途。文本字符串通常使用指向字符数组的指针进行操作。动态内存分配通过指针执行。许多数据类型（如树）通常实现为使用指针连接的动态分配对象。函数指针对于将函数作为参数传递给高阶函数（如\
    \ `qsort` 或 `bsearch`）或作为事件处理器调用的回调非常有用。\n\n空指针是指明确指向无有效位置的指针。它通过将指针设置为零创建。指针的内部表示未规定，空指针可能不会以零整数相同的方式表示。解引用空指针是未定义的，通常会导致段错误（segmentation\
    \ fault）。空指针用于指示特殊情况，例如链表最后一个节点没有后继指针，或者作为返回指针时的错误指示。空指针有时由名为 `NULL` 的标准宏表示。空指针在逻辑上求值为假，而所有指针求值都为真。\n\
    \n## 数组\n\nC 中的数组类型传统上是编译时指定的固定大小的。（最近的 C99 标准也允许变长数组）。然而，也可以使用标准库的 `malloc` 函数在运行时分配一个（任意大小的）内存块并将其视为数组。C\
    \ 数组和指针的统一（见下文）意味着真正的数组和这些动态分配的数组几乎是互换的。由于数组始终通过指针访问，因此通常不进行数组大小检查，尽管编译器可能会提供边界检查。数组越界在粗心的代码中可能且常见，并会导致各种后果，包括内存访问、数据损坏、缓冲区溢出和运行时异常。\n\
    \nC 没有声明多维数组的特殊规定，而是依靠类型系统内的递归来声明数组数组，实际上实现了相同的功能。结果“多维数组”的索引值可以被认为按行优先顺序增加。\n\
    \n多维数组用于数值算法（主要来自应用线性代数）来存储矩阵。C数组的结构非常适合这种特定任务。然而，由于边界必须是固定值或显式传递给需要它们的子程序，动态数组的数组无法使用双重索引。这种解决方法是分配一个额外的指向列的“行向量”。\n\
    \nC99 引入了“变长数组”，它解决了普通 C 数组的部分问题，而非所有问题。\n\n## 数组与指针的互换性\n\nC 的一个独特（但可能引起混乱）的特性是它对数组和指针的处理。数组下标符号\
    \ `x[i]` 也可以在 `x` 是指针时使用；其解释（使用指针算术）是访问一组相邻对象中的第 `i+1` 个对象，将 `x` 指向的对象（即 `x[0]`）计为数组的第一个元素。\n\
    \n形式上，`x[i]` 等于 `*(x + i)`。由于涉及指针的类型在编译时对编译器是知的，`x + i` 所指向的地址不"
