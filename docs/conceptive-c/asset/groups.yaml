    The reliance on expressions gives the language great flexibility. Because Lisp
    functions are themselves written as lists, they can be processed exactly like
    list data. This allows easy writing of programs which manipulate other programs
    (metaprogramming). Many Lisp dialects exploit this feature using macro systems,
    which enables extension of the language almost without limit.


    # Lists


    A list is written with its elements separated by whitespace, and surrounded by
    parentheses. For example, (1 2 foo) is a list whose elements are three atoms:
    the values 1, 2, and foo. These values are implicitly typed: they are respectively
    two integers and a Lisp-specific data type called a "symbol", and do not have
    to be declared as such.


    The empty list () is also represented as the special atom nil. This is the only
    entity in Lisp which is both an atom and a list.


    Expressions are written, using prefix notation. The first element in the list
    is the name of a form, i.e., lists, a function, operator, macro, or "special operator"
    (see below). The remainder of the list are the arguments. For example, the function
    list returns its arguments as a list, so the expression


    (list ''1 ''2 foo)

    evaluates to the list (1 2 foo). The "quote" before the arguments in the preceding
    example is a "special operator" which prevents the quoted arguments from being
    evaluated (not strictly for the numbers, since 1 evaluates to 1, etc.). Any unquoted
    expressions are recursively evaluated before the enclosing expression is evaluated.
    For example,


    (list 1 2 (list 3 4))


    evaluates to the list (1 2 (3 4)). Note that the third argument is a list; lists
    can be nested.


    # Operators


    Arithmetic operators are treated similarly. The expression (+ 1 2 3 4)


    evaluates to 10. The equivalent under infix notation would be "1 + 2 + 3 + 4".
    Arithmetic operators in Lisp are variadic (or n-ary), able to take any number
    of arguments.


    "Special operators" (sometimes called "special forms") provide Lisp''s control
    structure. For example, the special operator takes three arguments. If the first
    argument is non-nil, it evaluates to the second argument; otherwise, it evaluates
    to the third argument. Thus, the expression


    (if nil

    (list 1 2 "foo")

    (list 3 4 "bar"))


    evaluates to (3 4 "bar"). Of course, this would be more useful if a non-trivial
    expression had been substituted in place of nil.


    # Lambda Expressions


    Another special operator, lambda, is used to bind variables to values which are
    then evaluated within an expression. This operator is also used to create functions:
    the arguments to lambda are a list of arguments, and the expression or expressions
    to which the function evaluates (the returned value is the value of the last expression
    that is evaluated). The expression


    (lambda (arg) (+ arg 1))

    evaluates to a function, when applied, takes one argument, binds it to arg and
    returns the number one greater than that argument. Lambda expressions are treated
    no differently from named functions; they are invoked the same way. Therefore,
    the expression


    ((lambda (arg) (+ arg 1)) 5)

    evaluates to 6.


    # Atoms


    In the original LISP there were two fundamental data types: atoms and lists. A
    list was a finite ordered sequence of elements, where each element is itself either
    an atom or a list, and an atom was a number or a symbol. A symbol was essentially
    a unique name, written as an Alphanumeric string in source code, and used as a
    data item in symbolic processing. For example, the list (FOO (BAR 1) 2) contains
    three elements: the symbol FOO, the list (BAR 1), and the number 2.


    The essential difference between atoms and lists is that atoms were immutable
    and unique. Two atoms that appeared in different places in source code but were
    written in exactly the same way represented the same object, whereas each list
    was a separate object that could be altered independently of other lists and could
    be distinguished from other lists by comparison operators.


    As more data types were introduced in later Lisp dialects, and programming styles
    evolved, the concept of an atom lost importance. Many dialects still retained
    the predicate atom for legacy compatibility, defining it for any object which
    is not a cons.


    # Cons and Lists


    A Lisp list is a singly linked list. Each cell of this list is called a cons (in
    Scheme, a pair), and is composed of two pointers, called the car and cdr. These
    are equivalent to the data and next fields discussed in the article linked list,
    respectively.


    Of many data structures that can be built out of cons cells, one of the most basic
    is called a proper list. A proper list is either the special nil (empty list)
    symbol, or a cons in which the car points to a datum (which may be another cons
    structure, such as a list), and the cdr points to another proper list.


    If a given cons is taken to be the head of a linked list, then its car points
    to the first element of the list, and its cdr points to the rest of the list.
    For this reason, the car and cdr functions are also called first and last when
    referring to cons which are part of a linked list (rather than say, a tree).


    Thus, a Lisp list is not an atomic object, an instance of a container class in
    C++ or Java would be. A list is neither nor an aggregate of linked cons. A variable
    which refers to a given list is simply a pointer to the first cons in the list.
    Traversal of a list can be done by "cdr down" the list; that is, by using any
    of a number of higher-order functions to map.


