    防范分析引擎能力可能产生的夸大想法是符合意愿的。……分析引擎并不自认为具有任何原创能力。它能执行任何我们知道如何命令它去执行的任务。它可以遵循分析；但它没有预测任何分析关系或真理的能力。它的领域是协助我们利用那些我们已经熟知的事物。


    关于这个问题，最有影响力的贡献之一是先驱性计算机科学家阿兰·图灵（Alan Turing）在1950年写的一篇论文，题为《机器与智能》。图灵否认了对任何术语的兴趣，他认为“机器能思考吗？”这个问题包含了太多的虚假内涵，以至于意义；但他提议用一种特定的操作测试来取代所有此类问题，这个测试后来变成了广为人知的“图灵测试”。要通过这项测试，计算机必须能够很好地模仿人类，以满足提问者的要求。在论文中，图灵讨论了各种可能的反对意见，并对每种意见都提出了反驳。图灵测试在人工智能的讨论中经常被引用，作为一种关于机器意识的拟议标准；它引发了大量的哲学辩论。例如，丹尼尔·丹尼特（Daniel
    Dennett）和道格拉斯·霍夫斯塔特（Douglas Hofstadter）认为，任何能够通过测试的东西必然是有意识的，而查默斯（Chalmers）则认为，哲学僵尸可能通过测试，但却没有意识。


    一些哲学家认为，至少在原则上，机器是有可能意识的，但这不仅仅是执行正确的计算机程序的问题。这一观点最著名的倡导者是约翰·塞尔尔（John Searle），他通过一个已广为人知的“中文房间论证”思想实验来捍卫这一观点：假设图灵测试是用中文而不是英语进行的，并假设一个计算机程序成功地通过了测试。执行该程序的系统理解中文吗？塞尔尔的论点是，如果通过执行与计算机完全相同的程序来通过中文图灵测试，却对其中一个中文字都不理解，那么塞尔尔如何知道自己是否理解中文呢？理解语言不仅仅是你所做的事情：它感觉像是一种“理解”的状态，因此它比仅仅执行一个程序（即使是通过图灵测试的程序）要得多。


    在关于人工意识的文献中，塞尔尔的论文引发的辩论量仅次于图灵的。塞尔尔本人对于让机器产生意识所需的条件含糊其辞；他所提议的是，我们需要大脑所具有而计算机缺乏的那种“因果能力”。但对他基本观点表示赞同的其他思考者认为，必要的（尽管可能仍然不是）额外条件可能包括不仅能通过图灵测试的言语版本，还能通过机器人版本，这要求机器人的语言植根于机器人的感觉运动能力，以便对其周围的世界物进行分类和互动，且这种互动在图灵测试中与真人无法区分。图灵规模的机器人学是关于具身认知和情境认知的一个实证研究分支。


    # 灵性方法


    对于大多数哲学家来说，“意识”一词蕴含着心灵与世界之间的关系。对于灵性或宗教主题的作家来说，它经常指的是心灵与神之间的关系，或者心灵与被认为比物理世界更基础的真理之间的关系。克里希纳意识（Krishna
    consciousness）是一个术语，指崇拜者的心灵与神克里希纳之间亲密的联系。神秘主义精神心理学家莫里斯·巴克（Maurice Bucke）区分了三种意识：简单意识（Simple
    Consciousness），许多动物所拥有的对身体的感知；自我意识（Self Consciousness），对“感知的感知”，仅由人类拥有；以及宇宙意识（Cosmic
    Consciousness），对宇宙生命和秩序的感知，由觉悟的人类所拥有。可以给出许多例子。关于灵性方法最详尽的描述可能是肯·威尔伯（Ken Wilber）的《意识的光谱》（Spectrum
    of Consciousness），这是对西方和东方思考心灵方式方式的比较。威尔伯将意识描述为一个光谱，一端是普通的感知，较高层次则是更深层次的感知类型。


    # 科学方法


    几十年来，意识作为一个研究课题被大多数主流科学家所避之不及，因为他们普遍认为，一种用主观术语定义的现象无法通过客观实验方法进行恰当的研究。然而，从20世纪80年代开始，一个不断扩大的神经科学家和心理学家群体加入了一个名为“意识研究”（Consciousness
    Studies）的领域，产生了一系列发表在《意识与认知》（Consciousness and Cognition）等期刊上的实验工作，以及发表在《意识研究杂志》（Journal
    of Consciousness Studies）等期刊上的方法论工作，并由意识科学研究协会（Association for the Scientific
    Study of Consciousness）等组织定期举办会议。


    现代意识的科学调查基于心理学实验（例如，使用潜意识刺激对启动效应的研究），以及对由创伤、疾病或药物导致的意识改变的案例研究。广义地说，科学方法基于两个核心概念。第一个概念是将意识的内容等同于人类受试者报告的经验；第二个是利用神经病学家和其他处理行为受损患者的医疗专业人员所开发的意识概念。无论哪种情况，最终目标都是开发出能够客观评估人类及其他动物意识的技术，并理解其背后的神经和心理机制。


    # 生物学功能与演化


    关于意识处理的主要功能，近期理论中一个反复出现的观点是，现象状态以某种方式整合了本会相互独立的神经活动和信息处理。这被称为“整合共识”（integration
    consensus）。然而，尚未明确说明种种类的信息是以意识的方式整合的，哪些种类的信息可以在没有意识的情况下整合。也没有解释特定的意识整合起到了什么具体的因果作用，或者为什么在没有意识的情况下无法实现相同的功能。显然，并不是任何种类的信息都能以意识的方式进行传播（例如，与植物功能相关的神经活动、反射、无意识运动程序、低级感知分析等），而且许多信息可以在没有意识的情况下与其他信息传播和结合，例如戏法效应（ventrilquism
    effect）等感觉交互。因此，目前还不清楚为什么其中任何部分是有意识的。


    如前提到的，在那些认为意识是一个定义明确的事物的作家中，对于除人类之外哪些动物被认为拥有意识存在广泛争议。因此，对意识演化的任何研究都面临着巨大的困难。尽管如此，一些作家认为，从演化生物学的角度来看，意识可以被视为一种具有适应性意义的性状。在论文《意识的演化》中，约翰·埃克尔斯（John
    Eccles）认为，哺乳动物大脑皮层的解剖和物理特性产生了意识。伯纳德·贝尔斯（Bernard Bears）提出，这种“递归”电路一旦形成，可能为高等有机体中许多意识促进的功能提供了基础。


    然而，其他哲学家认为，意识对于演化过程中的任何功能优势都不是必需的。还没有人给出因果解释，说明为什么功能上等效的非意识（即哲学僵尸）无法获得与意识体相同的生存优势。演化过程对意识有机体
    O 和非意识有机体 执行功能 F 的差异是盲目的，因此不清楚意识能提供什么适应优势。


    # 意识状态


    在某些状态下，意识似乎消失了，包括睡眠、昏迷和死亡。还有各种情况可以以不剧烈的方式改变心灵与世界的关系，产生所谓的改变意识状态。


