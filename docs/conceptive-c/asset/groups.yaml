  - '[PAGE 127]


    # Consciousness


    Consciousness is a term that refers to the relationship between the mind and the
    world with which it interacts. It has been defined as: subjectivity


    Philosophers since the time of Descartes and Locke have struggled to comprehend
    the nature of consciousness and pin down its essential properties. Issues of concern
    in the philosophy of consciousness whether the concept is fundamentally valid;
    whether consciousness ever be explained mechanically; whether non-human consciousness
    exists and if how it can be recognized; how consciousness relates to language;
    and whether it may be possible for computers or robots to be conscious. Perhaps
    the thorniest issue is whether consciousness can be understood in a way that does
    not require a dualistic distinction between mental and physical states or properties.


    At one time consciousness was viewed with skepticism by many scientists, but in
    recent years it has become a significant topic of research in psychology and neuroscience.
    The primary focus is on understanding what it means biologically and psychologically
    for information to be present in consciousness—that is, on determining the neural
    and psychological correlates of consciousness. The methodology of experimental
    studies assess consciousness by asking human subjects for a verbal report of their
    experiences (e.g., "tell me if you notice anything when I do this"). Issues of
    interest include phenomena such as subliminal perception, blindsight, denial of
    impairment, and altered states of consciousness produced by psychoactive drugs
    or spiritual or meditative techniques.


    In medicine, consciousness is assessed by observing a patient''s arousal and responsiveness,
    and can be seen as a continuum of states ranging from full alertness and comprehension,
    through disorientation, delirium, loss of meaningful communication, and finally
    loss of movement in response to painful stimuli. Issues of practical concern include
    how the presence of consciousness can be assessed in severely comatose, or anesthetized
    people, and how to treat conditions in which consciousness is impaired or disrupted.


    # Etymology and Early History


    The origin of the modern concept of consciousness is often attributed to John
    Locke''s Essay Concerning Human Understanding, published in 1690. Locke defined
    consciousness as "the perception of what passes in a man''s own mind."'
  - '[PAGE 128]


    His essay influenced the 18th century view of consciousness, and his definition
    appeared in Samuel Johnson''s celebrated Dictionary (1755).


    The earliest English language uses of "conscious" and "consciousness" date back,
    to the 1500s. The English word "conscious" originally derived from the Latin conscious
    (con- +scire to know), but the Latin word did not have the same meaning as our
    word—it meant knowing with, or other words having joint or common knowledge with
    another. There were, however, many occurrences in Latin writings of the phrase
    conscious sib, which translates literally to "knowing with oneself," or in other
    words sharing knowledge with about something. This phrase had the figurative meaning
    of knowing that one knows, as the modern English word "conscious" does. In the
    early 1500s, the English word "conscious" retained the meaning of the Latin conscious.
    For example Thomas Hobbes in Leviathan wrote: "Where were two, or more, know of
    one and the same fact, they are said to be conscious of it one another." The Latin
    phrase conscious sib, whose meaning was more closely related to the current concept
    of consciousness, was rendered in English as "conscious to oneself" or "conscious
    onto oneself." For example, Archbishop Usher wrote in 1613 of "being so conscious
    to myself of my great weakness." Locke''s definition from 1690 illustrates that
    a gradual shifting happened in that place.


    A related word was conscientia, which primarily means moral conscience. In the
    literal sense, conscientia means knowledge-with, that is, shared knowledge. The
    word first appears in Latin judicial texts by writers such as Cicero. Here, conscientia
    is the knowledge that a witness has of the deed of someone else. René Descartes
    (1596-1650) is generally taken to be the first philosopher to use "conscientia"
    in a way that does not fit this traditional meaning. Descartes used the way modern
    speakers would use "conscience." In Search after Truth he says "conscience or
    internal testimony" (conscientia vel interno testimony).


    # In Philosophy


    The philosophy of mind has given to many stances regarding consciousness. Any
    attempt to impose an organization on bound is to be somewhat arbitrary. Stuart
    Sutherland exemplified the difficulty in the entry he wrote for the 1988 version
    of the Macmillan Dictionary of Psychology:


    Consciousness—The having of perceptions, thoughts, and feelings; awareness. The
    term is impossible to define except in terms that are unintelligible without a
    grasp of what consciousness means. Many fall into the trap of equating consciousness
    with self-consciousness—to be conscious is only necessary to be aware of the external
    world. Consciousness is a fascinating but elusive phenomenon: it is impossible
    to specify what it is, what it does, or why it has evolved. Nothing worth reading
    has been written on it.


    Most writers on the philosophy of consciousness have been concerned to defend
    a particular point of view, and have organized their material'
  - '[PAGE 129]


    accordingly. For surveys, the most common approach is to follow a historical path
    by associating stances with the philosophers who are most strongly associated
    with them, for example Descartes, Locke, Kant, etc. The main alternative, followed
    in the present article, is to organize philosophical stances according to the
    answers they give to a set of basic questions about the nature and status of consciousness.


    # Is Consciousness a Valid Concept?


    The most compelling argument for the existence of consciousness is that the vast
    majority of mankind have an overwhelming intuition that there truly is such a
    thing. Skeptics argue that this intuition, in spite of its compelling quality,
    is false, either because the concept of consciousness is intrinsically incoherent,
    or because our intuitions are based in illusions. Gilbert Ryle, for example, argued
    that traditional understanding of consciousness depends on a Cartesian dualist
    outlook that improperly distinguishes between mind and body, or between mind and
    world. He proposed that we speak not of minds, bodies, and the world, but of individuals,
    or persons, acting in the world. Thus, by speaking of ‘consciousness’ we end up
    misleading ourselves by thinking that there is any sort of thing as consciousness
    separated from behavioral and linguistic understandings. More generally, many
    philosophers and scientists have been unhappy about the difficulty of producing
    a definition that does not involve circularity or fuzziness.


    # Is It a Single Thing?


    Many philosophers have argued that consciousness is a unitary concept that is
    understood intuitively by the majority of people in spite of the difficulty in
    defining it. Others, though, argued that the level of disagreement about the meaning
    of the word indicates that it means different things to different people, or is
    an umbrella term encompassing a variety of distinct meanings with no simple element
    in common.


    Ned proposed a distinction between two types of consciousness that he called phenomenal
    (P-consciousness) and access (A-consciousness). P-consciousness, according to
    Block, is simply raw experience: it is moving, colored forms, sounds, sensations,
    emotions and feelings with our bodies and responses at the center. These experiences,
    considered independently of any impact on behavior, are called qualia. A-consciousness,
    on the other hand, is the phenomenon where information in minds is accessible
    for verbal report, reporting, and information about what we perceive is access
    conscious; when we introspect, information about our thoughts is access conscious;
    when we remember, information about the past is access conscious, and so on. Although
    some philosophers, such as Daniel Dennett, have disputed the validity of this
    distinction, others have broadly accepted it. David Chalmers has argued that A-consciousness
    can in principle be understood in mechanistic terms, but that'
- md: '

    understanding P-consciousness is much more challenging: he calls this the hard
    problem of consciousness.


    Some philosophers believe Block''s two types of consciousness are not the end
    of the story. William Lycan, argued, in his book Consciousness and Experience
    that at least eight distinct types of consciousness can be identified (organism
    consciousness; control consciousness; consciousness; state/event consciousness;
    reportability; introspective consciousness; subjective consciousness; self-consciousness)—and
    that even this omits more obscure forms.


    # How does it relate to the Physical World?


    Illustration of dualism by René Descartes. Inputs are passed by the sensory organs
    to the pine gland and from there to the immaterial spirit.


    The first influential philosopher to discuss this question specifically was Descartes,
    and the answer he gave is known as Cartesian dualism. Descartes proposed that
    consciousness resides within an immaterial domain he called res cogitans (the
    realm of thought), in contrast to the domain of material things he called res
    extensa (the realm of extension). He suggested that the interaction between these
    two domains occurs inside the brain, perhaps in a small midline called the pine
    gland.


    Although it is widely accepted that Descartes explained the problem cogently,
    few later philosophers have happy with his solution, and his ideas about the pineal
    gland have especially been ridiculed.


    Alternative solutions, however, have been very diverse. They can be divided broadly
    into two categories: dualist solutions that maintain Descartes'' rigid distinction
    between the realm of consciousness and the realm of matter but give different
    answers for how the two realms relate to each other; and many solutions that maintain
    that there is really only one realm of, of which consciousness and matter are
    both aspects. Each of these categories itself contains numerous variants. The
    two main types of dualism are substance dualism (which holds that the mind is
    formed of a distinct type of substance not governed by the laws of physics) and
    property dualism (which holds that the laws of physics are universally valid but
    cannot be used to explain the mind). The three main types of monism are physical
    (which holds that the mind consists of matter organized in a particular way),
    idealism (which holds that thought truly exists and matter is merely an illusion),
    and neutral monism (which holds that both mind and matter are aspects of a distinct
    essence that is itself identical to neither of them). There are also, however,
    a large number of idiosyncratic theories that cannot cleanly be assigned to any
    of these camps.


    Since the dawn of Newtonian science with its vision of simple mechanical principles
    governing the entire universe, some philosophers have been tempted by the idea
    that consciousness could be explained in purely physical terms. The first influential
    to propose such an idea explicitly was Julien Offray de La Mettrie, in his book
    Man a Machine (L''homme machine). His arguments, however, were very abstract.
    The most influential modern physical theories of consciousness are based on psychology
    and neurocience. Theories proposed by neuroscientists such as Gerald Edelman[31]
    and Antonio Damasio, and by philosophers as Daniel Dennett,[33], seek to explain
    consciousness in terms of neural events occurring within the brain. Many other
    neuroscientists, such as Christof Koch, have explored the neural basis of consciousness
    without attempting to frame all-encompassing global theories. At the same time,
    computer scientists working in the field of Artificial Intelligence have pursued
    the goal of creating digital programs that can simulate or embody consciousness.


    A few physicists have argued that classical physics is intrinsically incapable
    of explaining the holistic aspects of consciousness, but that quantum theory provides
    the missing ingredients. Several theorists have therefore proposed quantum (QM)
    theories of consciousness. Notable theories falling into this category include
    the Holonomic brain theory of Karl Pribibram and David Bohm, and the Orch-OR theory
    formulated by Stuart Hamerff and Roger Penrose. Some of these QM theories offer
    descriptions of phenomenal consciousness, as well as QM interpretations of are
    access to consciousness. None of the quantum mechanical theories have been confirmed
    by experiment, and many scientists and philosophers consider the arguments for
    an important role of quantum phenomena to be unconvincing.


    # Why do people believe that other people are Conscious?


    Many philosophers consider experience to be the essence of consciousness, and
    believe that experience can only fully be known from the inside, subjectively.
    But if consciousness is subjective and not visible from the outside, why do the
    vast majority of people believe that other people are conscious, but do rocks
    and trees are not? This is called the problem of other minds. It is particularly
    acute for people who believe in the possibility of philosophical zombies, that
    is, people who think it is possible in principle to have an entity that is physically
    indistinguishable from a human being and behaves like human in every way but nevertheless
    lacks consciousness.


    The most commonly given answer is that we attribute consciousness to other people
    because we see them us in appearance and behavior: we reason that they look like
    us and act like us, they must be like us in other ways, including having experiences
    of the sort that we do.[40] There are, a variety of problems with that explanation.
    For one thing, it seems to violate the principle of parsimony, by postulating
    an invisible entity that is not necessary to explain what we observe. Some philosophers,
    such as Daniel Dennett in an essay titled The Unimagined Preposterness of Zombies,
    argue that people who give this explanation do not understand what they are saying.


    More broadly, philosophers do not accept the possibility of zombies generally
    believe that consciousness is reflected in behavior (including verbal behavior),
    and that we attribute consciousness on the basis of behavior. A more straightforward
    way of saying this is that we attribute experiences to people because of what
    they can do, including the fact that they can tell us about their experiences.


    ### Are non-human animals Conscious?


    The topic of animal consciousness is beset by a number of difficulties. It poses
    the problem of other minds in an especially severe form, because animals, lacking
    language, cannot tell us about their experiences. Also, it is difficult to reason
    objectively about the question, because a detail that an animal is conscious is
    often taken to imply that it does not feel, its life has no value, and that harming
    it is not morally wrong. Descartes, for example, has sometimes been blamed for
    mistreatment of animals due to the fact that he believed only humans have a non-physical
    mind. Most people have a strong intuition that some animals, such as dogs, while
    others, such as insects, not; the stores of such intuition are not obvious.


    Philosophers who consider subjective experience the essence of consciousness also
    generally believe, as a correlate, that the existence and nature of animal consciousness
    can never be rigorously known. Thomas Nagel spelled out this point of view in
    an influential essay What Is It Like to Be a Bat? He said that an organism is
    conscious "if and only if there is something that it is like to be that organism
    — something it is like for the organism"; and he argued that no matter how much
    we know about an animal'' brain and behavior, we can never really put ourselves
    into the mind of the animal and experience its world in the way that it does.
    Other thinkers, such as Douglas Hofstadter, dismiss this argument as incoherent.
    Several psychologists and ethologists have argued for the existence of animal
    consciousness by describing a range of behaviors that appear to show animals holding
    beliefs about things they cannot directly perceive — Donald Griffin''s 2001 book
    Animal Minds reviews a substantial portion of the evidence.


    ### Could a machine be ever Conscious?


    The idea of an artefact made conscious is an ancientie theme of mythology, appearing
    for example in the Greek myth of Pygmalion, who carved a statue that was magically
    brought to life, and in medieval Jewish stories of the Golem, a magically animated
    homunculus built of clay. However, the possibility of actually constructing a
    conscious machine was first discussed by Ada Lovelace, in a set of notes written
    in 1842 about the Analytical Engine invented by Charles Babbage, a precursor (never
    built) to modern electronic computers. Lovelace was essentially dismissive of
