    x[i] = 1;      /* 等价于 *(x + i) */

    *(x + i) = 1;

    *(i + x) = 1;

    i[x] = 1;      /* 等价于 *(i + x) */

    ```


    注意，所有四个赋值都是等价的，但在数组和指针变量中，只有第一个代表良好的编码风格。最后一行可能会出现在混淆的 C 代码中。


    尽管数组和指针变量之间存在这种明显的等效性，它们之间仍然存在区别。尽管数组名在大多数表达式上下文中会被指针（指向其第一个元素），但与指针变量不同，该指针不占用任何存储空间。因此，“指向”数组无法更改，且无法给数组变量赋值。（数组内容可以被复制，例如使用
    `memcpy` 函数或通过访问单个元素。）


    # 内存管理


    编程语言最重要的功能之一是提供管理内存以及存储在内存中的对象的设施。C 提供了三种不同的对象内存分配方法：


    - 静态内存分配：对象的空间在编译时在二进制文件中提供；这些对象的范围（或生命周期）与包含它们的二进制文件加载到内存的时间一样长。

    - 自动内存分配：临时对象可以存储在栈上，在声明它们的代码块退出后，该空间会自动释放并可重复使用。

    - 动态内存分配：可以在运行时使用 `malloc` 等库函数从称为“堆”的内存区域请求任意大小的内存块；这些块一直持续到随后调用库函数 `realloc`
    或 `free` 释放为止。


    这些方法在不同情况下均适用，并有各种权衡。例如，静态内存分配的分配开销很小，自动分配可能涉及略多的开销，而动态分配在分配和释放方面都可能产生巨大的开销。静态对象的持久性对于跨函数调用的状态信息有用；自动分配易于使用，但栈空间通常比静态内存或堆空间更局限且转瞬逝逝；动态内存分配允许方便地分配仅在运行时才知道大小的对象。大多数
    C 程序都会大量使用这三种方法。


    在可能的情况下，自动或静态分配通常是最简单的，因为存储由编译器管理，使程序员无需编写手动分配和释放存储的这种易出错的代码。然而，许多数据结构在运行时可以改变大小，而静态分配（以及
    C99 之前的自动分配）在编译时必须具有固定大小，在许多情况下动态分配是必要的。在 C99 标准之前，可变长度数组是这种情况的一个常见示例。（关于动态分配数组的示例，请参见关于
    `malloc` 的文章。）


    除非另有说明，否则静态对象在启动时包含零或空指针值。动态分配的对象只有在显式指定初始值时才会初始化；否则它们初始具有不确定的值（通常是存储器中偶然存在的任何位模式，该位模式可能甚至不是该类型的有效值）。如果程序尝试访问未初始的值，结果是未定义的，但可能会出现假阳性和假阴性。


    另一个问题是，堆内存分配必须与其任何程序中的实际使用保持同步，以便尽可能地重用。例如，如果指向堆内存分配的唯一指针在调用 `free()` 之前离开作用域或其值被覆盖，则内存无法恢复以供以后使用，本质上对程序来说丢失了，这种现象被称为内存泄漏。相反，可能会过早释放内存并继续访问；然而，由于分配系统可能会重新分配或使用已释放的内存，可能会发生不可预测的行为。通常，症状会出现在程序中远离实际错误的部分，这使得问题难以追踪。（此类问题在具有自动垃圾收集的语言中得到了缓解。）


    # 库


    最常用的库是标准库，它由 ISO 和 ANSI C 标准规定，并随每个 C 实现提供（“独立”）；[嵌入式] C 实现可能只提供标准库的一个子。该库支持流输入输出、内存分配、数学、字符字符串和时间值。


    另一组常见的 C 库函数被专门针对 Unix 和类 Unix 系统的应用程序使用，特别是提供内核接口的函数。这些函数在 POSIX 和单 Unix UNIX
    规范等各种标准中进行了详细说明。


    由于许多程序是用 C 语言编写的，因此有许多其他库可用。库通常用 C 语言编写，因为 C 编译器会生成高效的目标代码；程序员随后为库创建接口，以便从 Java、Perl
    和 Python 等高级语言中使用这些程序。


    # Objective C


    Objective-C 是一种反射性的面向对象的编程语言，它为 C 语言添加了 Smalltalk 风格的消息。


    今天，它主要用于 Apple 的 Mac OS 和 iOS：这两个环境源自 OpenStep 标准，并不兼容。Objective-C 是 Apple Cocoa
    API 的主要语言，最初是 NeXT OS 主要语言。不使用这些库的通用 Objective-C 程序也可以通过 gcc 或 Clang 编译。


    # 历史


    Objective C 是 Brad Cox 和 Tom Love 在 20 世纪 80 年初在他们的公司创建的。两人都在 1981 年在 Programming
    Technology Center 接触到了 Smalltalk。Objective C 的早期工作追溯到那时。Cox 对软件设计和编程中真正的重用性问题感兴趣。他意识到像
    Smalltalk 这样的语言对于为系统人员构建开发环境非常有价值。然而，Tom Love 也意识到与 C 的后兼容在工程环境中至关重要。Cox 开始为 C
    编写处理器以添加 Smalltalk 的某些功能。他很快就有了 C 语言面向对象的扩展实现，将其称为“OOPC”（面向对象预编译器）。


    Love 在 1982 年被 Schlumberger Research 聘用，获得了 Smalltalk-80 的第一个商业副本，这进一步影响了他们结晶的发展。


    为了证明可以取得真正的进展，Cox 展示了制作可交换软件组件只需要对现有工具进行一些实际更改。具体来说，它们需要以灵活的方式支持对象，提供一组可用的库，并允许将代码（以及所需的任何资源）封装成单一的跨平台格式。


    Love 和 Cox 最终成立了一家新企业 Productivity Products International (PPI)，将其产品商业化，该产品将 Objective-C
    编译器与类库相结合。在 1986 年，Cox 在《Object-Oriented Programming, An Evolutionary Approach》一书中首次了
    Objective-C 的原始形式。尽管他谨慎地指出重用性问题不仅仅是语言，但 Objective-C 经常与其他语言进行功能对标。


