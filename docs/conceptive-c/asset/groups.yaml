    to refer to spatial or temporal perceptions of the external world. Neither are
    they related in any way to mysterious limits in which quantities are on the verge
    of evanescence or existence, that is, coming into or going out of appearance or
    existence. The abstract concepts are now considered to be totally autonomous,
    even though they originated from the process of abstracting or taking away qualities
    from perceptions until only the common, essential attributes remained.


