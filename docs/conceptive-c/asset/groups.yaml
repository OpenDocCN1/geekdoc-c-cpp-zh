    being that is reborn neither entirely different than, nor exactly the same as,
    the being that died.


    However, the new being is continuous with the being that died — in the same way
    that the "you" of this moment is continuous with the "you" of a moment before,
    despite the fact that you are constantly changing.


    Buddhist teaching holds that a notion of a permanent, abiding self is a delusion
    that is one of the causes of human conflict on the emotional, social, and political
    levels.


    They add that an understanding of anatta provides an accurate description of the
    human condition, and that this understanding allows us to pacify our mundane desires.


    Various schools of Buddhism have differing ideas about what continues after death.
    The Yogacara school in Mahayana Buddhism say there are consciousness which continue
    to exist after death. In some schools, particularly Tibetan Buddhism, the view
    is that there are three minds: very subtle mind, which does not disintegrate in
    death and is "dreaming mind" or "unconscious mind"; and gross mind, which is less
    permanent than subtle mind, which does not exist in death. Very subtle, however,
    does continue, and when it "catches on", or coincides with phenomena, again, a
    new subtle mind emerges, with its own personality/assumptions/habits, and that
    entity experiences karma in the current continuum.


    Certain modern Buddhists, particularly in Western countries, reject—or at least
    take an agnostic stance toward—the concept of rebirth or reincarnation, which
    they view as incompatible with the concept of anatta. Stephen Batchelor discusses
    this issue in his book, Buddhism Without Beliefs. Others point to research that
    has been conducted at the University of Virginia as proof that some people are
    reborn.


    # Judaism


    The Hebrew terms nephesh, ruach (literally "wind"), and neshameh (literally "breath")
    are used to describe the soul or spirit. The soul is believed to be given by God
    to a person by his/her first breath, as mentioned in Genesis, "And the Lord formed
    man [of] the dust of the ground, and breathed into his nostrils the breath of
    life; and man became a living soul." From this statement, the rabbinical interpretation
    is often that that human embryos do not have souls, the orthodox often oppose
    opposition as a form of birth control. Judaism relates the quality of one''s soul
    to its performance of mitzvot and reaching higher levels of understanding, and
    thus closeness to God. A person with such closeness is a tzadik. Judaism also
    has a concept of purity of body and soul, which requires avoidance of "unclean"
    things. Practices mentioned in the Torah include the keeping of kashrut and daily
    bathing (tevilah) in a mikveh. In biblical times, it was believed that "impurity
    was something that could be spread by touching, and unclean people were temporarily
    separated from the group. Though Jewish theology does not agree on the nature
    of an afterlife, the soul is said to "return to God" after death.


    Kabbalah and other mystic traditions go into greater detail into the nature of
    the soul. Kabbalah separates the soul into three elements: the nepesh is related
    to instinct, the ruach is related to morality, and the neshamah is related to
    intellect and the awareness of God. Kabbalah furthermore proposed a concept of
    reincarnation, the gilgul.


    # Christianity


    Soul carried to Heaven by William Bouaguere


    The Christian view of the soul is based upon the teaching of both the Old Testament
    and New Testament. The Old Testament contains the statements "Then shall the dust
    return to the earth as it was; and the spirit shall return unto God who gave it"
    (Ecclesiastes 12:7) and "And the LORD formed man [of] the dust of the ground,
    and breathed into his nostrils the breath of life; and man became a living soul."
    (Genesis 2:7). In the New Testament can be found a statement by Paul the Apostle,
    "And so it is written, the first Adam made a living soul; the last Adam [made
    was] a quickening spirit." (1 Corinthians 15:45).


    Most Christians understand the soul as an ontological reality distinct from, yet
    integrally connected with, the body. Its characteristics are described in moral,
    spiritual, and philosophical terms. When people die, their souls will be judged
    by God and determined to spend an eternity in heaven or hell. Though all branches
    of Christianity—Catholics, Eastern Orthodox and Oriental Orthodox, Evangelical
    or Protestant—teach Jesus Christ plays a decisive role in the salvation process,
    the specifics of that role and the part played by individuals persons or ecclesiastical
    rituals and relationships, is a matter of wide diversity in official church teaching,
    theological speculation and popular practice. Some Christians believe that if
    one has not repented of one''s sins and trusted in Jesus Christ as Lord and Savior,
    one will go to hell and suffer eternal separation from God. Variations also exist
    on this, e.g. some hold that the righteous soul will be destroyed instead of suffering
    eternally (Annihilation). Believers will inherit life in heaven and enjoy eternal
    fellowship with God. There is also a belief that babies (including the unborn)
