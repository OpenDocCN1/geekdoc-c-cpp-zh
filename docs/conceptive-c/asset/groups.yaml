    # Buddhism


    Buddhism teaches that all things are in a constant state of flux; all is changing,
    and no permanent state exists by itself. This applies to human beings as much
    as anything else in the cosmos. Thus, a human being no permanent self. According
    to this doctrine of anatta (Pāli; Sanskrit: anātman) — “no-self” or “no soul”
    — the words “I” or “me” do not refer to any fixed thing. They are simply convenient
    terms that allow us to refer to an ever-changing entity.


    The anatta doctrine is not a kind of material. Buddhism does not deny the existence
    of "immaterial" entities, and it (at least traditionally) distinguishes bodily
    states from mental states. Thus, the conventional translation of anatta "no-soul"
    refers to an incorporeal component in living things that can continue after death,
    then Buddhism does not deny the existence of the soul. Instead, Buddhism denies
    the existence of a permanent entity that remains constant behind the changing
    corporeal and incorporeal components of a living being. Just as the body changes
    from moment to moment, thoughts come and go. And there is no permanent, underlying
    mind that experiences these thoughts, as in Cartesianism; rather, conscious mental
    states simply arise and perish with no "thinker" behind them. When the body dies,
    the incorporeal mental processes continue and are reborn in a new body. Because
    the mental processes are constantly changing, the'
