    Paul of Tarsus distinguishes between the Jewish notions of *nephesh* and *ruah*
    (spirit) (also in LXX, e.g. Genesis 1:2 *spiritus Dei* = "the Spirit of God").


    ## Semantics


    Although the term soul and spirit are used interchangeably, soul may denote a
    more worldly and less transcendent aspect of a person. According to psychologist
    Hillman, soul has an affinity for negative thoughts and images, where spirit seeks
    to rise above the entanglements of life and death. The words soul and psyche can
    also be treated synonymously, although psyche has more physical connotations,
    whereas soul is connected more closely to spirituality and religion.


    ## Philosophical views


    The Ancient Greeks used the word for ''alive'' as ''ensouled'', indicating that
    the earliest surviving western philosophical view found the terms soul and aliveness
    synonymous - perhaps not having life universally presupposed the possession of
    a soul in Buddhism, but that full "aliveness" and the soul were conceptually linked.


    ## Socrates and Plato


    Plato, drawing on the words of his teacher Socrates, considered the soul the essence
    of a person, being that decides how we behave. He considered this essence to be
    an incorporeal, eternal occupant of our being. As bodies die the soul is continually
    reborn in subsequent bodies. The Platonic soul comprises three parts:


    - the logos (mind, nous, or reason)

    - the thymos (emotion, or spiritedness, or masculine)

    - the eros (appetite, or desire, or feminine)


    Each of these has a function in a balanced, level and peaceful soul.


    ## Aristotle


    Aristotle defined the soul or psyche as the essence or definition of a living
    being, but argued against its having a separate existence from the physical body.
    In Aristotle''s view, the primary activity of a living thing constitutes its soul;
    for the soul of an eye, if it were an independent organism, would be seeing (its
    purpose or final cause). By an imperfect analogy, an artifact, such as a knife
    or axe, (which has a clear purpose), if it had a soul, that soul would be the
    act of cutting, because ''cutting'' is, what it is to be a soul. Unlike Plato
    and the medieval religious tradition, Aristotle did not consider the soul to be
    a separate, immortal occupant of the body; just as the act of cutting cannot occur
    without a blade, the soul ceases to exist at the death of the body. In his view,
    the soul is the actuality of a living body. More precisely, the soul is the "first
    actuality" of a body, in so far as it has the capacity to be.


    Aristotle used his theory of the soul in many of his works; most notably *De Anima*
    (On the Soul). Aristotle divided the intellectual faculty into two principal parts,
    the "deliberative" and "calculative" and the "scientific" or "theoretical". As
    these are parts of the rational faculty of man, their correct activity also constitutes
    the "excellences" or "virtues" of the rational part of man, of which there are
    five faculties: nous, prudence and science, often translated as "understanding"
    or "intelligence"; sophia, and "wisdom". Nous is rational and intuitive comprehension
    of either a priori or axiomatic first principles and sophia combines this understanding
    with science.


    ## Avicenna and Ibn al-Nafis


    Following Aristotle, the Persian Muslim philosopher-physician, Avicenna (Ibn Sina)
    and Arab philosopher Ibn al-Nafis further elaborated on the Aristotelian understanding
    of the soul. They both made a distinction between the soul and the spirit, and
    in particular, the Avicennian doctrine on the nature of the soul was influential
    among the Scholastics. Some of Avicenna''s views on soul included the idea that
    the immortality of the soul is a consequence of its nature, and not a purpose
    for it to fulfill. In his theory of "The Ten Intellects", he viewed the human
    soul as the tenth and final intellect.


    While he was imprisoned, Avicenna wrote his famous "Floating Man" thought experiment
    to demonstrate human self-awareness and the substiality of the soul. He told his
    readers to imagine themselves suspended in the air, isolated from all sensations,
    which includes no sensory contact with their own bodies. He argues that, in this
    scenario, one would have self-consciousness. He concludes that the idea of the
    soul is not logically dependent on any physical thing, and that the soul should
    not be seen in relative terms, but as a primary given, a substance. This argument
    was later refined and supplemented by René Descartes in epistemic terms when he
    stated: "I can abstract from the supposition of all external entities, but not
    from the possibility of my own consciousness."


    Avicenna generally supported Aristotle''s idea of the soul originating from the
    heart, whereas Ibn al-Nafis rejected this idea and instead argued that the soul
    "is related to the entirety and not to one or a few organs". He further criticized
    Aristotle''s idea that every unique soul requires the existence of a unique source,
    in this case the heart. Ibn-Nafis concluded that "the soul is related primarily
    neither to the spirit to any organ, but rather to the entire matter whose temperament
    is prepared to receive that soul" and he defined the soul as nothing other than
    "what a human indicates by saying ''I''".


    ## Thomas Aquinas


    Following Aristotle and Avicenna, St. Thomas Aquinas understood the soul to be
    the first principle, or act, of the body. However, his epistemological theory
    required that, since the intellectual soul is capable of knowing all, the soul
    was not made up of matter.


