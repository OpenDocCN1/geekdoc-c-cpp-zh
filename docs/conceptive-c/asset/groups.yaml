    synonymous - perhaps not having life universally presupposed the possession of
    a soul in Buddhism, but that full "aliveness" and the soul were conceptually linked.


    # Socrates and Plato


    Plato, drawing on the words of his teacher Socrates, considered the soul essence
    of a person, being that decides how we behave. He considered this essence to be
    an incorporeal, eternal occupant of our being. As bodies die the soul is continually
    reborn in subsequent bodies. The Platonic soul comprises three parts:


    the logos (mind, nous, or reason)


    the thymos (emotion, or spiritedness, or masculine)


    the eros (appetite, or desire, or feminine)


    Each of these has a function in a balanced, level and peaceful soul.


    # Aristotle


    Aristotle defined the soul or psyche as the essence or definition of a living
    being, but argued against its having a separate existence from the physical body.
    In Aristotle''s view, the primary activity of a living thing constitutes its soul;
    for the soul of an eye, if it were an independent organism, would be seeing (its
    purpose or final cause). By an imperfect analogy, an'
