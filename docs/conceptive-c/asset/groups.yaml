    Plants, animals, fungi, slime moulds, protozoa, & algae are all Eukaryotic. These
    cells are about 15 times wider than a typical prokaryote and can be as much as
    1000 times greater in volume. The major difference between prokaryotes and eukaryotes
    is that eukaryotes contain membrane-bound compartments in which specific metabolic
    activities take place. Most important among these is a cell nucleus, a membrane-delineated
    compartment that houses the eukaryotic DNA. This nucleus gives the eukary its
    name, which means "true nucleus.\ Other differences include:


    The plasma membrane resembles that of prokaryotes in function, with minor differences
    in the setup. Cell walls may or may not be present.


    The eukaryotic DNA is organized in one or more linear molecules, called chromosomes,
    which are associated with histone proteins. All chromosomal DNA is stored in the
    cell nucleus, separated from the cytoplasm by a membrane. Some eukaryotic organelles
    such as mitochondria also contain some DNA. Eukaryotes can move using motilia
    or flagella. The flagella are more complex than those of prokaryotes.


    # Genetic Material


    Two kinds of genetic material exist: deoxyribonucleic acid (DNA) and ribonucleic
    acid (RNA). Most organisms use DNA for their long-term information storage, but
    some viruses (e.g., retroviruses) have RNA as their genetic material. The biological
    information contained in an organism is encoded in its DNA or RNA sequence. RNA
    is used for information transport (e.g., mRNA) and enzymatic functions (e.g.,
    ribosomal RNA) in organisms that use DNA for the genetic code itself. Transfer
    RNA (tRNA) molecules are used to add amino acids during protein translation.


    A human cell has genetic material contained in the cell nucleus (the nuclear genome)
    and in the mitochondria (the mitochondrial genome). In humans the nuclear genome
    is divided into 23 pairs of linear DNA molecules called chromosomes. The mitochondrial
    genome is a circular DNA molecule distinct from the nuclear DNA.


    # Origin of the First Cell


