  mdcn: '

    认为此类项目可能需要如人工意识或人工脑等拟人化特征。


    上述许多内容被认为是“AI 完全型”（AI-complete）的：要解决其中一个问题，你必须解决所有问题。例如，即使是简单且特定的机器翻译任务，也要求机器遵循作者的论点（推理）、理解正在谈论的内容（知识），并忠实地还原作者的意图（社交智能）。因此，机器翻译被认为是
    AI 完全型：它可能需要能够像人类一样强大的强人工智能。


    ## 进展评估


    1950年，艾兰·图灵（Alan Turing）提出了一种测试智能体智能性的通用程序，现在被称为图灵测试。该程序允许对几乎所有人工智能的主要问题进行测试。然而，这是一项极其困难的挑战，目前所有智能体都未能通过。


    人工智能也可以通过特定问题进行评估，例如化学中的微小问题、手写识别和游戏玩。此类测试被称为领域专家图灵测试。较小的问题提供了更易实现的目标，且积极的结果正在不断增加。


    AI 测试结果的宽分类有：(1) 优异（Optimal）：无法做得更好。(2) 强超人类（Strong super-human）：表现优于所有人类。(3)
    超人类（Super-human）：表现优于大多数人类。(4) 类人（Sub-human）：比大多数人类差。例如，国际象棋的表现是超人类的并接近强超人类（参见
    Computer chess#Computers and performance），而在许多日常任务（如识别人脸或在穿过房间时不碰撞到物体）中的表现则是类人的。


    ## 哲学


    人工智能通过声称能够重现人类思维的能力，对哲学而言既是挑战也是灵感。智能机器的智能程度是否存在极限？人类智能与人工智能之间是否存在本质区别？人工智能哲学试图回答如下这类问题：


    机器可以智能地行动吗？它能解决人类通过思考解决的任何问题吗？


    机器可以拥有与人类相同的心灵、心理状态和意识吗？它能感知吗？


    人类智能和机器智能是一样的吗？人类大脑本质上是计算机吗？


    ## C 语言


    C 语言（读音与字母 C 相同）是由丹尼斯·里奇（Dennis Ritchie）于 1969 年 1973 年间在贝尔电话实验室开发的一种通用计算机编程语言，用于
    Unix 操作系统。尽管 C 语言是为了实现系统软件而设计的，但也被广泛用于开发可移植的应用程序。


    C 语言是历史上使用最广泛的编程语言之一，几乎没有种架构不存在 C 编译器。C 语言极大影响了许多其他编程语言，特别是 C++，它最初作为 C 的扩展开始的。


    ## 设计


    C 是一种命令式（过程化）系统实现语言。它的设计旨在使用相对简单的编译器进行编译，提供对内存的低级访问，提供能够高效映射到机器指令的语言结构，并提供最少的运行时支持。因此，C
    语言对于许多以前用汇编编写的应用非常有用。


    尽管具有低级能力，但该语言的设计旨在鼓励跨平台编程。符合标准且编写良好的 C 程序可以在对源代码进行极少修改的情况下，为各种不同的计算机平台和操作系统进行编译。该语言已应用于非常广泛的平台，从嵌入式微控制器到超级计算机。


    ## 特性


    与 ALGOL 传统的大多数命令式语言一样，C 具有结构化编程的设施，并允许词法作用域和递归，而静态类型系统防止了意外的操作。在 C 中，所有可执行代码都包含在子程序中，称为“函数”（尽管不是严格意义上的函数式编程函数）。函数参数总是通过值传递的。C
    通过显式传递指针值来模拟引用传递。C 程序的源码是自由格式的，使用分号作为语句终止符，使用大括号划分块。


    C 语言还表现出以下更具体的特性：


    - 关键字少且数量固定，包括一套流程控制原语：`for`、`if`、`switch` 和重复循环（通过 `do..while` 实现）。基本上只有一个命名空间，用户定义的名称不通过任何符号（sigil）与关键字区分来。


    - 大量的复合算术和逻辑运算符，例如 `+=`、`-=`、`*=`、`++` 等。


    - 一个语句中可以执行多次赋值。


    - 函数返回值可以自由丢弃。


    - 静态但弱强制的类型；所有数据都有类型，但可以进行隐式转换，例如字符可以当作整数使用。


    - 定义在使用之后。C 没有 `define` 关键字，以类型名称开头的语句被视为定义。没有 `function` 关键字，相反，参数列表的括号表示正在定义函数。


    - 支持用户定义（typedef）和复合类型。


    - 异构聚合数据类型（struct）允许将相关数据元素组合并作为一个单元处理。


    - 数组索引是一个次要概念，通过指针算术定义。与 `struct` 不同，数组不是一等对象，必须使用库函数进行赋值和比较。在使用或定义中均没有 `array`
    关键字；相反，方括号在语法上指示数组，例如 `myarr[]`。


    - 使用 `enum` 关键字支持枚举类型。它们没有标记，并且可以与整数自由转换。


    - 字符串不是预定义的数据类型，但通常实现为字符数组，同样需要使用库函数。C 字符串的长度不是固定的，也不是其类型的一部分。变长 C 风格字符串以空字符终止。


    - 通过将机器地址转换为类型指针对计算机内存进行低级访问，并可以在指针上进行算术运算。


    - 过程（不返回值的子程序）是函数的特例，返回类型为 `void`。


    - 函数不能在词法作用域内定义（尽管某些编译器可能作为语言扩展提供此功能）。


    - 预处理器可用于宏定义、源文件包含和条件编译。


    - C 是模块化的：包含函数的文件可以单独编译和链接。函数默认从所在文件中导出，而变量局限于文件。


    - 复杂的功能（如 I/O、字符串处理和数学函数）始终委托给库程序。


    - 传统的 C 工具集由编译器、链接器、调试器等组成，通过命令行调用。现在引入了集成开发环境。


    C 语言不包含较新的、现代高级语言中存在的功能，包括：


    - 对象方向

    - 垃圾回收

    - 类型反射


    ## 早期发展


    C 语言的开发发生在 1969 年至 1973 年间的 AT&T 贝尔实验室；根据里奇的，最有创造力的时期发生在 1972 年。


    C 语言的起源与 Unix 操作系统的开发密切相关，Unix 最初由里奇和汤普在 PDP-7 上用汇编语言实现，并吸收了同事的各种想法。最终他们决定将操作系统移植到
    PDP-11。B 语言无法利用 PDP-11 的某些特性（特别是字节寻址），导致了早期 C 语言的开发。


    原始的 PDP-11 版本 Unix 系统是用汇编语言开发的。1973 年，随着 `struct` 类型的加入，C 语言变得足够强大，可以用 C 语言重写
    Unix 内核。这是第一个用汇编以外语言实现的操作系统内核之一。（早期实例包括用 PL/I 编写的 Multics 系统，以及 1961 年用 ALGOL
    编写的 Burroughs B5000 的 MCP。）

