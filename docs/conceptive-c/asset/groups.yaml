    In psychology, memory is an organism''s ability to store, retain, and recall information
    and experiences. Traditional studies of memory began in the fields of philosophy,
    including techniques of artificially enhancing memory. The late nineteenth and
    early twentieth century, scientists have put memory within the paradigm of cognitive
    psychology. In recent decades, it has become one of the principal pillars of a
    branch of science called cognitive neuroscience, an interdisciplinary link between
    cognitive psychology and neuroscience.


    # Processes


    From an information processing perspective there are three main stages in the
    formation and retrieval of memory:


    - Encoding or registration

    - Storage

    - Retrieval, recall or recollection


    # Sensory Memory


    Sensory memory corresponds approximately to the initial 200–500 milliseconds after
    an item is perceived. The ability to look at an item, and remember what it looked
    like with just a second of observation, or memorisation, is an example of sensory
    memory. With very short presentations, participants often report that they seem
    to "see" more than they can actually report. The first experiments exploring this
    form of sensory memory were conducted by George Sperling (1960) using the "partial
    report paradigm". Subjects were presented with a grid of 12 items, arranged into
    three rows of four. After a brief presentation, subjects were then told either
    a high, medium or low tone, cuing which of the rows to report. Based on these
    partial report experiments, Sperling was able to show that the capacity of sensory
    memory was approximately 12 items, but that it degraded quickly (within a few
    hundred milliseconds). Because this form of memory decays so quickly, participants
    would see the display, but be unable to report all of the items (12 in the "whole
    report" procedure) before they decayed. This type of memory cannot be prolonged
    by rehearsal.


    # Short-Term Memory


    Short-term memory allows recall for a period of several seconds to a minute without
    rehearsal. Its capacity is also very limited: George A. Miller (1956), when working
    at Bell Laboratories, conducted experiments showing that the store of short-term
    memory was 7±2 items (the title of his famous paper, "The magical number 7±2").
    Modern estimates of the capacity of short-term memory are lower, typically on
    the order of 4–5 items, however, memory capacity can be increased through a process
    called chunking. For example, in recalling a ten-digit telephone number, a person
    could chunk the digits into three groups: first, the area code (such as 215),
    then a three-digit chunk (123) and lastly a four-digit chunk (4567). This method
    of remembering numbers is far more effective than attempting to remember a string
    of 10 digits; this is because we are able to chunk the information into meaningful
    groups of numbers. Herbert Simon argued the ideal size for chunking letters and
    numbers, meaningful or not, was three. This may be reflected in some countries
    in the tendency to remember telephone numbers as several chunks of three with
    the final four-number groups, generally broken down into groups of two.


    Short-term memory is believed to rely mostly on an acoustic code for storing information,
    and to a lesser extent a visual. Subjects had more difficulty recalling collections
    of letters that were acoustically similar (e.g. E, P, D). Confusion with recalling
    semantically similar letters rather than visually similar implies that the letters
