    A variety of psychoactive drugs have notable effects on consciousness. These range
    from a simple dulling of awareness produced by sedatives, to increases in the
    intensity of sensory qualities produced by stimulants, cannabis, or most notably
    by the class of drugs known as psychedelics. LSD, maine, psilocybin, and others
    in this group produce major distortions of perception, including hallucinations;
    some users describe their drug-induced experiences as mystical or spiritual in
    quality. The brain mechanisms underlying these effects are not well understood,
    but there is substantial evidence that alterations in the brain system that uses
    the chemical neurotransmitter serotonin play an essential role.


    There has been some research into physiological changes in yogis and people who
    practise various techniques of meditation. Some research with brain waves during
    meditation has differences between those corresponding to ordinary relaxation
    and those corresponding to meditation. It has been disputed, however, whether
    there is enough evidence to count these as physiologically distinct states of
    consciousness.


    The most extensive study of the characteristics of altered states of consciousness
    was made by psychologist Charles Tart in the 1960s and 1970s. Tart analyzed states
    of consciousness as made up of a number of component processes, including extero
    (sensing the external world); interception (sensing the body); input-processing
    (sensing meaning); emotions; memory; time sense; sense of identity; evaluation
    and cognitive processing; motor output; and interaction with the environment.
    Each of these, in his view, could be altered in multiple ways by drugs or other
    manipulations. The components that Tart identified have not, however, have been
    validated by empirical studies. Research in this area has not yet reached conclusions,
    but a recent questionnaire-based study identified eleven significant factors contributing
    to drug-induced states of consciousness: unity; spiritual experience; blissful
    state; insightfulness; disembodiment; impaired control and cognition; anxiety;
    complex imagery; elementary imagery; audio-visual synesthesia; and changed meaning
    of percepts.


