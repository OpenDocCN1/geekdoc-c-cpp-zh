    # List-Processing


    Lisp provides many built-in procedures for accessing and controlling lists. Cons
    is used to add an element to the front of a list. Because of the way lists are
    constructed, the cons procedure is used to add an element to the front of a list.


    The append procedure appends two (or more) lists to one another. Because Lisp
    are linked lists, appending two lists has asymptotic complexity O(n).


    # Shared Structure


    Lisp lists, being simple linked lists, can share structure with one another. That
    is to say, two lists can have the same tail. For instance, after the execution
    of the following Lisp code:


    (set foo (list ''a ''b))

    (set bar (cons ''x (cdr foo)))


    the lists and bar are (a b) and (x b) respectively. However, the tail (b) is the
    same structure in both lists. It is not a copy; the cons cells pointing to b and
    c are in the same locations for both lists.


    Sharing structure rather than copying can give a dramatic performance improvement.
    However, this technique can introduce undesired ways with functions that alter
    lists passed to them as arguments. Altering one list, such as by replacing the
    c with a goose, will affect the other:


    (set (third foo) ''goose'')


    This changes foo to (a b goose), but thereby changes bar to (x goose) – possibly
    unexpected result. Aficionados of functional programming avoid destructive functions.
    In the Scheme dialect, which favors the functional style, the names of destructive
    functions are marked with a cautionary exclamation point, or "bang"—such as set-car!,
    which replaces the car of a. In Common Lisp, destructive functions are commonplace;
    the equivalent of set-car! includes a special facility, set, to make it easier
    to define and use destructive functions. A frequent style in Common Lisp is to
    write code functionally (without destructive calls) while prototyping, then to
    add destructive calls as an optimization where it is safe to do so.


