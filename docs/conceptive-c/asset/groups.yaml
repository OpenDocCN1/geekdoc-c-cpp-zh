    Lisp 列表是一个单链表。此列表的每个单元被称为 `cons`（在 Scheme 中称为 `pair`），由两个指针组成，分别称为 `car` 和 `cdr`。它们分别等于在链表文章中讨论的
    `data` 和 `next` 字段。


    在用 `cons` 单元构建的许多数据结构中，最基础的之一被称为正列表（proper list）。正列表是特殊的 `nil`（空列表）符号，或者是一个 `cons`，其
    `car` 指向一个数据（可能是另一个 `cons` 结构，例如列表），而 `cdr` 指向另一个正列表。


    如果将给定的 `cons` 视为链表的头部，那么它的 `car` 指向列表的第一个元素，它的 `cdr` 指向列表的其余部分。由于这个原因，在引用链表部分的
    `cons`（而不是树）时，`car` 和 `cdr` 函数也被称为 `first` 和 `last`。


    因此，Lisp 列表不是一个原子对象（像 C++ 或 Java 中的容器类实例那样）。列表既不是原子，也不是链接 `cons` 的聚合。引用给定列表的变量仅仅是指向列表中第一个
    `cons` 的指针。列表的遍历可以通过沿列表“cdr down”来完成；即通过许多高阶函数中的进行映射（map）。


