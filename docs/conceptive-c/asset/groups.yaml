    摘自名为《银河之路》的章节最后一页，描述了一段通过银河接收器传回给主角们的经历：


    你正站在一群多肉生物中，意识通过其所有物质化身，在一个宽阔的街道上，环绕着一座拥有蓝色树的城市，树木长着鲜红的叶子，建筑以各种形式从土壤中生长。


    # 威廉·吉布斯 (William Gibson)


    尽管威廉·吉布斯关于网络空间的概念——即一种共识性的虚拟现实幻觉，将数据表示为3D矩阵——与用户实际上访问或感知互联网的方式没有任何半点关系，但他的赛博朋克小说《零号》（Count
    Zero，1986）详细描述了一个角色在在线世界中社交的形象：


    他面前的一个正方形网络空间令人作呕地翻转着，看起来像是一个非常宽敞的公寓，家具用极细的蓝色霓虹线条勾勒出来。一个女人站在他面前，像一个发光的卡通线条人，脸是一块宽宽的污迹。“我是
    Slide，”那个形象说道，双手叉腰……[她]比了个手势，一个词突然在她身后出现。


    “好的，”鲍比说道，“这是什么？我的意思是，如果你能解释解释一下的话。”他仍然无法移动。“窗口”显示出一段棕榈树和旧建筑的蓝灰色视频画面。


    ……嘿，哥们，我设计了一只手臂和一条腿来帮我推这个。这是我的空间，我的构建。这是洛杉矶，小子。这里的人不插上什么都不做。这是我娱乐的地方！


    # 尼尔·斯蒂芬森 (Neal Stephenson)


    “化身”（Avatar）作为在线虚拟体的使用是由尼尔·斯蒂芬森在他的赛博朋克小说《雪崩》（Snow Crash，1992）中发普及的。在《雪崩》中，Avatar一词被用来描述元宇宙（Metaverse）中人类形态的虚拟模拟，这是互联网上的一个虚构虚拟现实应用。元宇宙中的社会地位通常取决于用户化身的质量，一个细节丰富的化身表明该用户是一个熟练的黑客和程序员，而才华较低的人则会像现在的初学者一样购买现成的模型。斯蒂芬森在《雪崩》的“致谢”中写道：


    像元宇宙这样的“虚拟现实”想法在计算机图形社区非常广泛，并正以许多不同的方式使用。元宇宙的特定愿景在小说中的表达源于我与 Jaime（带宽队长）Taffe
    之间的闲聊……化身（在此处使用的意义上）和元宇宙是我的发明，是我在决定现有的世界（如虚拟现实）太难用时想出的这些点子……在《雪崩》首次出版后，我了解到化身实际上已经作为名为
    Habitat 的虚拟现实系统的一部分使用了多年……除了化身之外，Habitat 还包含了本书中所描述的元宇宙的许多基本功能。


    # 人工智能


    化身可以是具身智能体（embodied agents）的虚拟体现，它们在或多程度上是由人工智能而非真人驱动的。自动在线助手就是这种用途化身的示例。


    组织将此类化身作为自动化客户服务的一部分，以便与消费者和服务用户进行交互。这可以降低企业的运营和培训成本。系统的一大底层技术被称为自然语言处理。这些化身通常被称为“机器人”（bots）。著名的例子包括宜家的
    Anna，一个旨在引导用户浏览宜家网站的化身。


    此类化身也可以由数字对话驱动，这比使用自然语言处理（NLP）的具有更多结构性，为用户提供选项和明确定义的输出路径。这种化身被称为结构化语言处理（SLP）化身。这两类化身都提供了一种与消费者接触的成本效益且高效的方法。


    # 视频游戏


    视频游戏中的化身本质上是玩家在游戏世界中的物理表现。在大多数游戏中，玩家的表现是固定的；然而，越来越多的游戏提供了一个基础角色模型或模板，然后允许玩家根据自己的意愿自定义物理特征。例如，《侠环盗猎手：圣安德烈斯》中的化身卡尔·约翰逊（Carl
    Johnson）可以穿各种服装，甚至可以纹身和换发型，甚至可以根据玩家的动作变得健壮或肥胖。


    除了化身的外表之外，它的对话（特别是在过场剧中）一个很好的例子是粗鲁的动作英雄原型迪克·纽肯姆（Duke Nukem）。其他化身，如《半条命》中的戈登·弗里曼（Gordon
    Freeman），他从不说话，很少显露自我（原版游戏从未向玩家展示过未使用第三人视角控制命令时的样子）。


    大型多人游戏（MMOGs）是最多样、复杂的化身的来源。游戏之间的自定义程度各异；例如在《EVE Online》中，玩家使用一种软件构建完全自定义的肖像，该软件允许对面部结构进行几种更改，以及预设的发型、肤色等。然而，这些肖像只出现在游戏聊天和其他玩家的静态信息视图。通常，所有玩家都出现在巨大的飞船中，不像大多数其他
    RPG 那样可以看到飞行员。网络剧《公会》（The Guild）的创始人兼主角菲莉西亚·戴（Felicia Day）创作了一首歌《（你想约我的）化身吗》，讽刺了化身和虚拟约会。


    如 Wii、Playstation 3 和 Xbox 360（此处所示）游戏机具有通用的动画化身。


    此外，《英雄城市》（City of Heroes）提供了最详细、全面的游戏内化身创建过程之一，允许玩家构建从传统的超级英雄到外星人、中世纪骑士、怪物、机器人等任何形象。


    任天堂的 Wii 主机允许创建名为“Mii”的化身，这些化身呈现出风格化、卡通化的人形，可以在某些游戏中作为玩家的化身，例如《Wii 运动》。在某些游戏中，使用
    Mii 作为化身的能力必须先解锁，例如《马里奥赛车 Wii》。


    2008 年 11 月 19 日，微软发布了 Xbox 360 仪表更新，作为控制机新体验的一部分引入了化身。安装更新后，用户可以通过选择一系列服装和面部特征来个性化他们的化身。2009
    年 8 月 11 日，NXE 化身程序更新了化身市场，允许用户购买额外的商品和游戏品牌服装、珠宝、全身服和动画道具。更新发布时，游戏品牌内容包括《战争机器2》、《生化异域2》、《星球大战》、《传说2》、《光环
    3》和《猴岛秘密》特别版。Xbox Live 化身市场每周更新新物品。


    索尼 PlayStation 3 上的 PlayStation Home 也具有化身使用功能，但风格比任天堂的 Mii 或微软的化身更真实。


    非游戏世界中的化身被用作个人在世界中的二维或三维人类或奇幻表现。这种表现是探索虚拟宇宙的工具，或作为与其他用户对话的焦点，并可以由用户自定义。通常，这类宇宙的目的和吸引力在于为常见的在线对话能力提供极大增强，并允许用户在不被迫追求预设目标的情况下和平开发非游戏宇宙的一部分。


