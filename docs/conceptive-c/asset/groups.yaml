    短期记忆允许在不复习的情况下回想几秒到一分钟的内容。它的容量也非常有限：乔治·A·米勒（George A. Miller，1956）在贝尔实验室工作时进行的实验表明，短期记忆的存储容量为
    7±2 项（他著名的论文标题为《神奇的数字 7±2》）。对短期记忆容量的现代估计更低，通常在 4–5 项左右，然而记忆容量可以通过被称为“组块”（chunking）的过程来增加。例如，在回忆一个十位电话号码时，一个人可以将数字分成三组：首先是区号（例如
