    +   • Organization - Mandler (1967) gave participants a pack of word cards and
    asked them to sort them into any number of piles any system of categorisation
    they liked. When they were later asked to recall as many of the words as they
    could, those who used more categories remembered more words. This study suggested
    that the organization of memory is one of its central aspects (Mandler, 2011).


    +   • Distinctiveness - Eysenc and Eysenc (1980) asked participants to say words
    in a distinctive way, e.g. spell the words out. Such participants recalled the
    words better than those who simply read them off a list.


    +   • Effort - Tyler et al. (1979) had participants solve a series of anagrams,
    some easy (FAHTER) and some difficult (HREFAT). The participants recalled the
    difficult anagrams better, presumably because they put more effort into them.


    +   • Elaboration - Palmere et al. (1983) gave participants descriptive paragraphs
    of a fictitious African nation. There were some short paragraphs and some with
    extra sentences elaborating the main idea. Recall was higher for the ideas in
    the elaborated paragraphs.


    # Information Type


    Anderson (1976) divides long-term memory into declarative (explicit) and procedural
    (implicit) memories.


    Declarative memory requires conscious recall, in that some conscious process must
    call back the information. It is sometimes called explicit memory, since it consists
    of information that is explicitly stored and retrieved.


    Declarative memory can be further sub-divided into semantic memory, which concerns
    facts taken independent of context; and episodic memory, which concerns information
    specific to a particular context, such as a time and place. Semantic memory allows
    the encoding of abstract knowledge about the world, such as "Paris is the capital
    of France". Episodic memory, on the other hand, is used for more personal memories,
    such as the sensations, emotions, and personal associations of a particular time
    or place. Autobiographical memory - memory for particular events in one''s life
    - is generally viewed as either equivalent to, or a subset of, episodic memory.
    Visual memory is part of memory preserving some characteristics of our senses
    pertaining to visual experience. One is able to place in memory information that
    resembles objects, places, animals or people in sort of a mental image. Visual
    memory can result in priming and it is assumed some kind of perceptual representational
    system


    In contrast, procedural memory (or implicit memory) is not based on the conscious
    recall of information, but on implicit learning. Procedural memory is primarily
    employed in learning motor skills and should be considered a subset of implicit
    memory. It is revealed when one does better in a given task due only to repetition
    - no new explicit memories have been formed, but one is unconsciously accessing
    aspects of those previous experiences. Procedural'
