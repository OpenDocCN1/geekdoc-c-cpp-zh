    into heaven on the basis of God''s grace through the sacrifice of Jesus.


    # Roman Catholic Beliefs


    Among Christians, there is uncertainty regarding whether human embryos have souls,
    and at what point between birth and the fetus acquires a soul and consciousness.
    This uncertainty is the general reasoning behind many Christians'' belief that
    abortion should not be legal.


    The present Catechism of the Catholic Church defines the soul as "the innermost
    aspect of humans, that is of greatest value in them, by which they are most especially
    in God''s image: ''soul'' signifies the spiritual principle in man." All souls
    living and dead will be judged by Jesus Christ when he comes back to earth.


    The souls of those who die unrepentant of sins, or rejection of God, will at judgment
    day be forever in a state called Hell. The Catholic Church teaches that the existence
    of every individual soul is dependent wholly upon God: "doctrine of the faith
    affirms the spiritual and immortal soul is created immediately by God"


    # Hinduism


    In Hinduism, the Sanskrit word most closely corresponding to soul are "Jeeva",
    "Atman" and "Purusha", meaning the individual Self. The term "soul" is misleading
    as it implies an object possessed, whereas Self signifies the subject which perceives
    all objects. This self held to be distinct from the various mental faculties such
    as desires, thinking, understanding, reasoning and self-image (ego), all of which
    are considered of Prakriti.


    In Bhagavad Gita 2.20 Lord Krishna describes the soul in the following way: "For
    the soul there neither birth nor death at any time. He has not come into being,
    does not come into being, and will not come into being. He is unborn, eternal,
    ever-primeval."


    Srila Prabhupada, a great Vaishava saint of the modern time further explains:
    The soul does not take birth, and the soul does not die...And the soul has no
    birth, he therefore has no past, present or future. He is eternal, ever-existing
    and primeval - that is, there is no trace in history of his coming into being.


    Since the quality of Atman is primarily consciousness, all sentient and insistent
    beings are pervaded by Atman, including plants, animals, humans and gods. The
    difference between them is the contracted or expanded state of that consciousness.
    For example, animals and humans share in common the desire to live, fear of death,
    desire to protect and to protect their families and territory and the need for
    sleep, but animals'' consciousness is more contracted and has less possibility
    to expand than human consciousness.


    When the Atman embodied it is called birth, when the Atman leaves a body is called
    death. The Atman transmigrates from one body to another based on karmic reactions.


