    ActiveBuddy was a company that created conversation-based interactive agents originally
    distributed via instant messaging platforms. Founded in 2000, the company was
    the brainchild of Robert Hoffer and Timothy Key. The idea for interactive agents
    came from Hoffer''s vision to add functionality to increasingly popular instant
    messaging services. The original implementation took shape as a word-based adventure
    game but quickly grew to include a wide range of database applications including
    access to news, weather, information, time page listings, and detailed sports
    data, as well as a variety of tools (calculators, translator, etc.). These various
    applications were bundled into a single entity and launched as SmartChild in 2001.
    SmartChild acted as a showcase for the quick data access and possibilities for
    fun that the company planned to turn into customized, niche specific products.


    The rapid success of SmartChild, over 13 million users, led to targeted promotional
    products for Radiohead, Austin Powers, The Sporting News, and others. ActiveBuddy
    sought to strengthen its hold on the interactive agent market for the future by
    filing, and receiving, patent on their creation in 2002. The company also released
    the BuddyScript SDK, a free developer kit that allows programmers to design and
    launch their own interactive agents using ActiveBuddy''s proprietary scripting
    language, in. The company subsequently changed its name from ActiveBuddy to Conversagen
    in 2003, and then again to Colloquium in 2006. Colloquium was later purchased
    by Microsoft in October of 2006.


    ## Development


    The classic historic early chatbots were ELIZA (1966) and PARRY (1972). More recent
    notable programs include A.L.I.C.E., Jabberwacky and D.U.D.E (Agence Nationale
    de la Recherche et CNRS 2006). While ELIZA and PARRY were used exclusively to
    simulate typed conversation, many chatbots now include functional features such
    as games and web searching abilities. In 1984, a book called The Policeman''s
    Beard is Half Constructed was published, allegedly written by the chafter Ractor
    (though the program as released would not have been capable of doing so).


    One pertinent field of AI research is natural language processing. Usually, weak
    AI fields employ specialized software or programming languages created specifically
    for the narrow function required. For example, A.L.I.C.E. utilises a programming
    language called AIML, which is specific to its function as a conversational agent,
    and has been adopted by various other developers of, so called, Alicebots. Nevertheless,
    A.L.I.C.E. is still purely based on pattern matching techniques without any reasoning
    capabilities, the same technique ELIZA was using back in 1966. This is not strong
    AI, which would require sapience and logical reasoning abilities.


    Jabberwacky learns new responses and context based on real-time user interactions,
    rather than being driven from a static database. Some recent chatterbots also
    combine real-time learning with evolutionary algorithms that optimise their ability
    to communicate based on each conversation held, with one notable example being
    Kyle, winner of the 2009 Leodis AI Award. Still, there is currently no general
    conversational artificial intelligence, and some software developers focus on
    the practical aspect, information retrieval.


    Chatterbot competitions focus on the Turing test or more specific goals. Two annual
    contests are the Loebner Prize and the Chatterbox Challenge.


    ## IRC Bot


    An IRC bot is a set of scripts or an independent program that connects to Internet
    Relay Chat as a client, and appears to other IRC users as another user. An IRC
    bot differs from a regular client in that instead of providing interactive access
    to IRC for a human user, it performs automated functions.


    The historically oldest IRC bots were Bill Wiener''s Bartender and Greg Lindahl''s
    GM (Game Manager for the Hunt Wumpus game). Over time, bots evolved to provide
    special services, such as managing channels on behalf of groups of users, maintaining
    access lists, and providing access to databases.


    Often, an IRC bot is deployed as a detached program from a stable host. It sits
    on an IRC channel to keep it open and prevents malicious users from taking over
    the channel. It can be configured to give channel operator status to privileged
    users when they join the channel, and can provide a unified channel operator list.
    Many of these features require that the bot be a channel operator. Most IRC bots
    are run from computers which have long uptimes (generally running a BSD derivative
    or Linux) and a fast, stable Internet connection. As IRC has become popular with
    many dial-up users as well, special services have appeared that offered user-level
    access to a stable Linux server with a decent connection. The user may run an
    IRC bot from this shell account. These services are commonly known as shell providers.


    A bot can also perform many other functions, such as logging what happens in an
    IRC channel, giving information on demand (very popular in channels dealing with
    user support), creating statistics, hosting trivia games, and so on. These functions
    are usually provided by user-writable scripts, often written in a programming
    language as Tcl or Perl, added to the bot in question. Channels denoted to file
    sharing often use XDCC bots to distribute their files.


    IRC bots are particularly well-used on IRC networks without channel registration
    services such as ChanServ, as EFNet and IRCnet, and on networks that may prevent
    channels from being registered due to certain registration requirements (minimum
    user count, etc.), such as Undernet or QuakeNet. Where bots are used for administrative
    functions such as this, they may need more access than a normal client connection.
    Some versions of IRC have a "Service" protocol that allows clients with these
    extra powers. Such server-sanctioned bots are called services.


    Bots are not always welcome. Some IRC networks forbid the use of bots. One of
    the reasons for doing so is that nickname connected to the network increases the
    size of the database which is kept in sync across all servers. Allowing for bots
    in large networks can cause a relevant amount of network traffic overhead needs
    to be financed and may even lead to netsplits. This however is a shortcoming of
    the IRC technology, not the bots.


    People that create an IRC bot use either the scripting language built into a client,
    or appropriate frameworks of a suitable programming language to connect to server(s),
    or use an existing implementation, and adapt it to their needs.


    ## Avatar


    In computing, an avatar is the graphical representation of the user or the user''s
    alter ego or character. It may take either a three-dimensional form, as in virtual
    worlds, or a two-dimensional form as an icon in Internet forums or other online
    communities. It can also refer to a text construct founded on early systems as
    MUDs. The term "avatar" can also refer to the personality connected with the screen
    name, or handle, of an Internet user. The use of the term avatar for the oncreen
    representation of the user was coined in 1985 by Chip Morningstar and Joseph Romero
    in designing LucasFilm''s online role-playing game Habitat. The computer Ultima
    IV: Quest of the Avatar was released in 1985 but does not use the word in this
    sense, only in its original religious sense; the player''s in-game final objective
    is to become an Avatar. Later games in the series use the term in the same sense
    as Habitat and introduce Habitat-style customization of avatars. Another early
    use of the term was in the pen and paper role-playing game Shadowrun (1989).


