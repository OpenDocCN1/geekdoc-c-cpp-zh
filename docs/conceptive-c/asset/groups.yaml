    - 检索、回想或回忆


    # 感官记忆


    感官记忆大致对应感知到一个项目后的初始 200–500 毫秒。观察一个项目并仅通过一秒观察或记忆就能记住它的样子的能力是感官记忆的一个例子。在非常短的呈现中，参与者经常报告他们似乎“看到”了比他们实际能报告的多。探索这种感官记忆的首次实验是由乔治·斯珀林（George
    Sperling，1960）使用“部分报告范式”进行的。受试者看到一个包含 12 个项目的网格，分为三行四列。在短暂展示后，受试者被告知高、中或低音调，以此指示报告哪几行。基于这些部分报告实验，斯珀林能够证明感官记忆的容量约为
    12 个项目，但它下降很快（在几百毫秒内）。因为这种形式的记忆衰减得非常快，参与者能看到显示，但在衰减之前无法报告所有项目（“全报告”程序中的 12 个）。这种类型的记忆无法通过复习来延长。


