    # Serial Sectioning of a Brain


    A possible method for mind uploading is serial sectioning, in which the brain
    tissue and perhaps other parts of the nervous system are frozen and then scanned
    and analyzed layer by layer, capturing the structure of the neurons and their
    interconnections. The exposed surface of nerve tissue would be scanned and recorded,
    then the surface layer of tissue removed. While this would be a very slow and
    labor intensive process, research is currently underway to automate the collection
    and microscopy of serial sections. The scans would then be analyzed, and a model
    of the neural net recreated in the system that the mind was uploaded into.


    There are uncertainties with using current microscopy techniques. If it is possible
    to replicate neuron function from its visible structure alone, the resolution
    afforded by a scanning electron microscope would suffice for such a technique.
    However, as the function of brain tissue is partially determined by molecular
    events (particularly at synapses, but also at other places on the neuron''s cell
    membrane), this may not suffice for capturing and simulating neuron functions.
    It may be possible to extend the techniques of serial sectioning and capture the
    internal molecular makeup of neurons, through the use of sophisticated immunohistochemistry
    staining methods which could then be read via confocal laser scanning microscopy.
    However, as the physiological genesis of ''mind'' is not currently known, this
    method may not be able to access all of the biochemical information to recreate
    a human brain with sufficient fidelity.


    # Brain Imaging


    It may be possible to create functional 3D maps of the brain activity, using advanced
    neuroimaging technology, such as functional MRI (fMRI), for mapping change in
    blood flow), Magnetoencephalography(MEG, for mapping of electrical currents),
    or combinations of multiple methods, to build a detailed three-dimensional model
    of the brain using non-invasive and non-destructive methods. Today, fMRI is often
    combined with MEG for creating functional maps of human cortex during more complex
    cognitive tasks, as the methods complement each other. Even though current imaging
    technology lacks the spatial resolution needed to gather the information needed
