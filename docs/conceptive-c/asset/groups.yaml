    Since Objective-C is a strict superset of C, it does not treat C primitive types
    as first-class objects.


    Because Objective-C uses dynamic runtime typing and because all method calls are
    function calls (or, in some cases, syscalls), many common performance optimizations
    cannot be applied to Objective-C methods (for example: inlining, constant propagation,
    interprocedural optimizations, and scalar replacement of aggregates). This limits
    the performance of Objective-C abstractions relative to similar abstractions in
    languages such as C++ where such optimizations are possible.


    # Lisp


    “Do the arithmetic or be doomed to talk nonsense.” John McCarthy


    Lisp (or LISP) is a family of computer programming languages with a long history
    and a distinctive, fully parenthesized syntax. Originally specified in 1958, Lisp
    is the second-oldest high-level programming language in widespread use today;
    only Fortran is older (by one year). Like Fortran, Lisp has changed a great deal
    since its early days, and many of dialects have existed over its history. Today,
    the most widely general-purpose Lisp dialects are Common Lisp, Scheme, and Clojure.


    Lisp was originally created as a family of mathematical notation for computer
    programs, influenced by the notation of Alonzo Church''s lambda calculus. It quickly
    became the favored programming language for artificial intelligence (AI) research.
    As one of the earliest programming languages, Lisp pioneered many ideas in computer
    science, including tree data structures, automatic storage management, dynamic
    typing, and the self-hosting compiler.


    The name Lisp derives from “List Processing”. Linked lists are one of Lisp''s
    major data structures, and Lisp source code is itself made up of lists. As a result,
    Lisp programs can manipulate source code as a data structure, giving rise to the
    systems that allow programmers to create new syntax or even new domain-specific
    languages embedded in Lisp.


    The interchangeability of code and data also gives Lisp its recognizable syntax.
    All program code is written as s-expressions, or parenthesized lists. A function
    call or syntactic form is written as a list with the function or operator''s first
    name, and the arguments as following: (f arg1 arg2 arg3).


    Lisp was invented by John McCarthy in 1958 while he was at the Massachusetts Institute
    of Technology (MIT). McCarthy published his design in a paper in Communications
    of the ACM in 1960, entitled “Recursive Functions of Symbolic Expressions and
    Their Computation by Machine, Part 1”. ("Part II") was never published. He showed
    that with a few simple operators and a notation for functions, one can build a
    Turing-complete language for algorithms.


    Information Processing Language was the first AI language, from 1955 and 1956,
    and already included many of the concepts, such as list-processing and recursion,
    which many came to be used in Lisp.


    McCarthy''s original notation used bracketed "M-expressions" that would be translated
    into S-expressions. For example, the M-expression (car (cons [A B])) is equivalent
    to the S-expression (car cons A B). Once Lisp was implemented, programmers rapidly
    chose to use S-expressions, and M-expressions were abandoned. M-expressions surfaced
    again with short-lived attempts of MLISP by Horace Pratt, and CGOL by Vaughan
    Pratt.


    Lisp was first implemented by Steve Russell on the IBM 704 computer. Russell had
    McCarthy''s grant, and realized (to McCarthy''s surprise) that the Lisp eval could
    be implemented in machine code. The result was a working Lisp interpreter which
    could be used to run Lisp programs, or more properly, ''evaluate Lisp expressions.''


    Two assembly language macros for the IBM 704 became the primitive operations for
    decomposing lists: car (Contents of the Address of Register Number) and cdr (the
    Decrement of Register Number). From the context, it is clear that the term "Register"
    is used here to mean "Memory Register", nowadays called "Memory Location". Lisp
    dialects still use car and cdr (car and cdr) for the operations that return the
    first item in a list and the rest of the list.


    The first complete Lisp compiler, written in Lisp, was implemented in 1962 by
    Tim Hart and Mike Levin at MIT. This compiler introduced the Lisp model of incremental
    compilation, in which compiled and interpreted functions interact freely. The
    language used in Hart and Levin''s memo is much closer to modern Lisp style than
    McCarthy''s early style.


    Lisp was a difficult system to implement with the compiler techniques and stock
    hardware of the 1970s. Garbage collection routines, developed by then-MIT student
    Daniel Edwards, made it practical to run Lisp on general-purpose computing systems,
    but efficiency was still a problem. This led to the creation of Lisp machines:
    dedicated hardware for running Lisp environments and programs. Advances in both
    computer hardware and compiler technology soon made Lisp machines obsolete.


    During the 1980s and 1990s, a great effort was made to unify the work on new Lisp
    dialects (mostly successors to Maclisp like ZetaLisp and NIL (New Implementation
    of Lisp)) into a single language. The new language, Common Lisp, was somewhat
    compatible with the dialects it replaced (the Common Lisp back the compatibility
    of various constructs). In 1994, ANSI published the Common Lisp standard, "ANSI
    X3.22-1994 Information Technology Programming Language Common Lisp."


    # Connection to Artificial Intelligence


    Since its inception, Lisp was closely connected with the artificial intelligence
    research community, especially on PDP-10 systems. Lisp was used as the implementation
    of the programming language Micro Planner which was used in the famous AI system
    SHRDLU. In the 1970s, as AI research spawned commercial offshoots, the performance
    of existing Lisp systems became a growing issue.


    Lisp was the first homoisic programming language: the primary representation of
    program code is the same type of list structure that is also used for the main
    data structures. As a result, Lisp functions can be manipulated, altered or even
    created within a Lisp program without extensive parsing or manipulation of binary
    code. This is generally considered one of the primary advantages of the language
    with regard to its expressive power, and makes the language amenable to metacircular
    evaluation.


    The ubiquitous if-then-else structure, now taken for granted as an essential element
    of any programming language, was invented by McCarthy for use in Lisp, where it
    saw its first appearance in a more general form (the cond structure). It was inherited
    by ALGOL, which popularized it.


    Lisp deeply influenced Alan Kay, the leader of the research on Smalltalk, and
    in turn Lisp was influenced by Smalltalk, adopting object-oriented programming
    features (classes, instances, etc.) in the 1970s.


    Largely because of its resource requirements with respect to early computing hardware,
    Lisp did not become popular outside of the AI community as Fortran and the ALGOL-descended
    C language. Newer languages such as Java and Python have incorporated some limited
    versions of some features of Lisp, but are necessarily unable to bring the coherence
    and synergy of the full concepts found in Lisp. Because of its suitability to
    ill-defined, complex, and dynamic applications, Lisp is currently enjoying some
    resurgence of popular interest.


