    Life-forms transmit information both vertically (from parent to child, via replication
    of genes) (through viruses and other means). Malcolm Gladstone wrote, "A meme
    is an idea that behaves like a virus--that moves through a population, taking
    hold in each person it infects." Memes replicate vertically or horizontally within
    a single biological generation. They may also lie dormant for long periods of
    time. Memes spread by the behaviors that they generate in their hosts. Imitation
    counts as an important characteristic of the propagation of memes. Imitation often
    involves the copying of an observed behavior of another individual, but memes
    may transmit from one individual to another through a copy recorded in an inanimate
    source, such as a book or musical score. McNamara has suggested that memes can
    be thereby classified as internal or external memes (i-memes or e-memes). Researchers
    have observed memetic copying in just a few species on Earth, including hominids,
    dolphins and birds that learn how to swim by imitating their parents or neighbors.


    Some commentators have linked the transmission of memes to the spread of contagions.
    Social contagions such as fades, hysteria, copycat crime, and copycat suicide
    exemplify memes as the contagious imitation of ideas. Observers distinguish the
    imitation of memes from instinctively contagious phenomena as yawning and laughing,
    which they consider innate (rather than socially learned) behaviors.


    Aaron Lynch described general patterns of meme transmission, and "thought contagion":


    Quantity of parenthood: an idea that influences the number of children one has.
    Children respond particularly receptively to the ideas of their parents, and thus
    ideas that directly or indirectly encourage a higher birthrate will replicate
    themselves at a higher rate than those that discourage higher birthrates.


    Efficiency of parenthood: an idea that increases the proportion of children who
    will adopt the ideas of their parents. Cultural separation exemplifies one in
    which one can expect a higher birth rate of meme-replication—because the meme
    for separation creates a barrier from exposure to competing ideas.


    Proselytic: ideas generally pass to others one''s own children. Ideas that encourage
    the proselytism of a meme, as seen in many religious or political movements, can
    replicate memes horizontally through a given generation, spreading more rapidly
    than parent-to-child meme-transmissions do.


    Preservational: ideas that influence those that hold them to continue for a long
    time. Ideas that encourage longevity in their hosts, or leave their hosts particularly
    resistant to abandoning or replacing these ideas, enhance the preservability of
    memes and afford protection from the competition or proselytism of other memes.


    Adversarial: ideas that influence those that hold them to attack or sabotage competing
    ideas and/or those that hold them. Adversarial replication can give'
