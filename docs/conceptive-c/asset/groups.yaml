    believe that anthropomorphic features like artificial consciousness or an artificial
    brain may be required for such a project.


    Many of the above are considered AI-complete: to solve one problem, you must solve
    them all. For example, even a straightforward, specific task machine translation
    requires that the machine follow the author''s argument (reason), know what is
    being talked about (knowledge), and faithfully reproduce the author''s intention
    (social intelligence). Machine translation, therefore, is believed to be AI-complete:
    it may require strong AI to be as well as humans can do.


    ## Evaluating progress


    In 1950, Alan Turing proposed a general procedure to test the intelligence of
    an agent now known as the Turing test. This procedure allows almost all the major
    problems of artificial intelligence to be tested. However, it is a very difficult
    challenge and at present all agents fail.


    Artificial intelligence can also be evaluated on specific problems such as small
    problems in chemistry, hand-writing recognition and game-playing. Such tests have
    been termed subject expert Turing tests. Smaller problems provide more achievable
    goals and there are an increasing number of positive results.


    The broad classes of outcome for an AI test are: (1) Optimal: it is not possible
    to perform better. (2) Strong super-human: performs better than all humans. (3)
    Super-human: performs better than most humans. (4) Sub-human: worse than most
    humans. For example, performance at chess is super-human and nearing strong super-human
    (see Computer chess#Computers and performance at many everyday tasks (such as
    recognizing a face or crossing a room without bumping into something) is sub-human.


    ## Philosophy


    Artificial intelligence, by claiming to be able to recreate the capabilities of
    the human mind, is both a challenge and an inspiration for philosophy. Are there
    limits to how can intelligent machines can be? Is there an essential difference
    between human intelligence and artificial intelligence? The philosophy of artificial
    intelligence attempts to answer such questions as:


    Can a machine act intelligently? Can it solve any problem that a person would
    solve by thinking?


    Can a machine have a mind, mental states and consciousness in the same sense humans
    do? Can it feel?


    Are human intelligence and machine intelligence the same? Is the human brain essentially
    a computer?


    ## C Language


    C (pronounced like the letter C) is a general-purpose computer programming language
    developed between 1969 and 1973 by Dennis Ritchie at the Bell Telephone Laboratories
    for use with the Unix operating system. Although C was designed for implementing
    system software, it is also widely used for developing portable application software.


    C is one of the most widely used programming languages of all time and there are
    very few architectures for which a C compiler does not exist. C has greatly influenced
    many other programming languages, notably C++, which began as an extension to
    C.


    ## Design


    C is an imperative (procedural) systems implementation language. It was designed
    to be compiled using a relatively straightforward compiler, to provide low-level
    access to memory, to provide language constructs that map efficiently to machine
    instructions, and to provide minimal run-time support. C was therefore useful
    for many applications that had formerly been coded in assembly language.


    Despite its low-level capabilities, the language was designed to encourage cross-platform
    programming. A standards-compliant and portably written C program can be compiled
    for a wide variety of computer platforms and operating systems with few changes
    to its source code. The language has become available on a very wide range of
    platforms, from embedded microcontrollers to supercomputers.


    ## Characteristics


    Like most imperative languages in the ALGOL tradition, C has facilities for structured
    programming and allows lexical scope and recursion, while a static type system
    prevents unintended operations. In C, all executable code is contained within
    subroutines, which are called "functions" (although not in the strict sense of
    functional programming). Function parameters are always passed by value. Pass-by-reference
    is simulated in C by explicitly passing pointer values. C program source text
    is free-format, using the semicolon as a statement terminator and curly braces
    for delimiting block.


    C also exhibits the following more specific characteristics:


    - A small and fixed number of keywords, including a full set of flow control primitives:
    for, if, switch and repeat loop (implemented as do..while). There is basically
    one namespace, and user-defined names are not distinguished from keywords by any
    kind of sigil.


    - A large number of compound arithmetical and logical operators, such as +=, -=,
    *=, ++, etc.


    - More than one assignment may be performed in a statement.


    - Function return values may be freely discarded.


    - Static, but weakly-enforced, typing; all data has a type, but implicit conversions
    can be performed, for instance, characters can be used as integers.


    - Definition follows use. C has no "define" keyword, a statement beginning with
    the name of a type is taken as a definition. There is no "function" keyword, instead,
    the parentheses of an argument list indicate that a function is being defined.


    - User-defined (typedef) and compound types are possible.


    - Heterogeneous aggregate data types (struct) allow related data elements to be
    combined and manipulated as a unit.


    - Array indexing as a secondary notion, defined in terms of pointer arithmetic.
    Unlike structs, arrays are not first-class objects, and must be assigned and compared
    with library functions. There is no "array" keyword, in use or definition; instead,
    square brackets indicate arrays syntactically, e.g myarr[].


    - Enumerated types are possible with the enum keyword. They are not tagged, and
    are freely interconvertible with integers.


    - Strings are not a predefined data type, but usually implemented as arrays of
    characters, with the same need to use library functions. The length of a C string
    is not fixed, not part of its type. Variable-length C-style strings are null-terminated.


    - Low-level access to computer memory by converting machine addresses to typed
    pointers, on which arithmetic can be performed.


    - Procedures (subroutines not returning values) are a special case of function,
    returning the dummy type void.


    - Functions may not be defined within the lexical scope of functions. (Although
    this may be provided as a language extension by some compilers.) Function and
    data pointers supporting ad hoc run-time polymorphism


    - A preprocessor for macro definition, source code inclusion, and conditional
    compilation.


    - C is modular: files containing functions can be compiled and linked separately.
    Functions are exported by default from the files containing them, whereas variables
    are local to the file containing them unless explicitly imported.


    - Complex functionality as I/O, string manipulation, and mathematical functions
    consistently delegated to library routines.


    - The traditional C toolset consists of compilers, linkers, debuggers, etc invoked
    from the command line. Integrated development environments have also been introduced.


    C does not include some features found in newer, more modern high-level languages,
    including:


    - Object orientation

    - Garbage collection

    - Type reflection


    ## Early Developments


    The initial development of C occurred at AT&T Bell Labs between 1969 and 1973;
    according to Ritchie, the most creative period occurred in 1972. It was named
    "C" because its features were derived from an earlier language called "B", which
    according to Ken Thompson was a stripped-down version of the BCPL language.


    The origin of C is closely tied to the development of the Unix operating system,
    originally implemented in assembly language on a PDP-7 by Ritchie and Thompson,
    incorporating various ideas from colleagues. Eventually they decided to port the
    operating system to a PDP-11. B''s inability to take advantage of some of the
    PDP-11''s features, notably byte addressability, led to the development of an
    early version of C.


    The original PDP-11 version of the Unix system was developed in assembly language.
    By 1973, with the addition of struct types, the C language became powerful enough
    that the Unix kernel was rewritten in C. This was one of the first operating system
    kernels implemented in a language other than assembly. (Earlier instances include
    the Multics system (written in PL/I), and MCP (Master Control Program) for the
    Burroughs B5000 written in ALGOL in 1961.)

