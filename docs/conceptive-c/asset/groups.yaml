    can also be compiled for any system supported by gcc or Clang.


    # History


    Objective-C was created by Brad Cox and Tom Love in the early 1980s at their company
    Stepstone. Both had been introduced to Smalltalk while at IT Corporation''s Programming
    Technology Center in 1981. The earliest work on Objective C traces back around
    that time. Cox was intrigued by problems of true reusability in software design
    and programming. He realized that a language like Smalltalk would be invaluable
    in building development environments for system developers at IT. However, and
    Tom Love also recognized backward compatibility with C was critically important
    in IT''s team engineering milieu. Cox began writing a processor for C to add some
    of the capabilities of Smalltalk. He soon had a working implementation of an object-oriented
    extension to the C language, which he called "OOPC" for Object-Oriented Pre-Compiler.
    Love was hired by Schlumberger Research in 1982 and had the opportunity to acquire
    the first commercial copy of Smalltalk-80, which further influenced the development
    of their brainchild.


    In order to demonstrate that real progress could be made, Cox showed that making
    interchangeable software components really needed only a few practical changes
    to existing tools. Specifically, they needed to support objects in a flexible
    manner, come supplied with a usable set of libraries, and allow for the code (and
    any resources needed by the code) to be bundled into a single cross-platform format.


    Love and Cox eventually formed a new venture, Productivity Products International
    (PPI), to commercialize their product, which coupled an Objective-C compiler with
    class libraries. In 1986, Cox published the main description of Objective-C in
    its original form in the book Object-Oriented Programming, An Evolutionary.Approach.
    Although he was careful to point out that there is more to the problem of reusability
    than just the language, Objective-C often found itself compared feature for feature
    with other languages.


    # Popularization through NeXT'
- md: "\nAfter Steve Jobs left Apple Inc., he started the company NeXT. In 1988, NeXT\
    \ licensed Objective-C from StepStone (the new name of PPI, the owner of the Objective-C\
    \ trademark) and extended the GCC compiler to support Objective-C, and developed\
    \ the AppKit and Foundation Libraries on which the NeXTStep user interface and\
    \ interface builder were based. While the NeXT workstations failed to make a great\
    \ impact in the marketplace, the tools were widely lauded in the industry. This\
    \ led NeXT to drop hardware production and focus on software tools, selling NeXTStep\
    \ (and OpenStep) as a platform for custom programming.\n\nThe GNU project worked\
    \ on its free clone of NeXTStep, GNUStep, based on the OpenStep standard. Dennis\
    \ Glatting wrote the first GNU Objective-C runtime in 1992. The GNU Objective-C\
    \ runtime, which has been in use since 1993, is the one developed by Kresten Karab\
    \ Thorup when he worked at NeXT in 1993 to 1996.\n\nAfter acquiring NeXT in 1996,\
    \ Apple used OpenStep in its operating system, Mac OS X. This included Objective-C\
    \ and NeXT's Objective-C developer tool, Project Builder (which had been expanded\
    \ and is now called Xcode), as well as its interface design tool, Interface Builder.\
    \ Most of Apple's present-day Cocoa API is based on OpenStep interface objects,\
    \ and is the most significant Objective-C environment being used for active development.\n\
    \n# Syntax\n\nObjective-C is a thin layer on top of C, and moreover is a strict\
    \ superset of C; it is possible to compile any program with an Objective-C compiler,\
    \ and to freely include C code within an Objective-C class.\n\nObjective-C derives\
    \ its syntax from Smalltalk. All of the syntax for nonobject-oriented operations\
    \ (including primitive variables, preprocessing, function declarations, and function\
    \ calls) are identical to that of C, while the syntax for object-oriented features\
    \ is an implementation of Smalltalk-style messaging.\n\n# Messages\n\nThe Objective-C\
    \ model of object-oriented programming is based on message passing to object instances.\
    \ In Objective-C one does not call a method; one sends a message. This is unlike\
    \ the Simula-style programming model used by C++. The difference between these\
    \ two concepts is in how code referenced by the method or message name is executed.\
    \ In a Simula-style language, the method name is in calls bound to a section of\
    \ the target class by the compiler. In Smalltalk and Objective-C, the target of\
    \ a message is resolved at runtime, with the receiving object itself interpreting\
    \ the message. A method is identified by a selector or SEL — a NULL-terminated\
    \ string representing its name — and resolved to a C method implementing it: an\
    \ IMP. A consequence of this is that the message-passing system has no type checking.\n\
    \nThe object to which the message is directed — the receiver — is guaranteed to\
    \ respond to a message, and if it does not, it simply raises an exception.\n\n\
    Sending the message method to the object pointed to by the pointer obj would be\
    \ obj->method(C);\n\nIn Objective-C, this is written as follows:\n[obj method:argument];\n\
    \nBoth styles of programming have their strengths and weaknesses. Object-oriented\
    \ programming in the Simula style allows multiple inheritances and faster execution\
    \ by compile-time binding whenever possible, but it does not support dynamic binding\
    \ by default. It forces all methods to have a corresponding implementation unless\
    \ they are virtual, meaning the method is a placeholder for methods with the same\
    \ name to be defined in objects derived from the base object. An implementation\
    \ is still required for the method to be called in the delegate. Smalltalk-style\
    \ programming allows messages to go unimplemented, with the method resolved to\
    \ its implementation at runtime. For example, a message may be sent to a collection\
    \ of objects, to which only some will be expected to respond, without fear of\
    \ producing runtime errors. Message passing also does not require that an object\
    \ be defined at compile time. (See the dynamic typing section for more advantages\
    \ of dynamic (late) binding).\n\nDue to the overhead of interpreting the messages,\
    \ an initial Objective-C message takes three times as long as a C++ virtual method\
    \ call. Subsequent calls are cached and are faster than the C++ virtual method\
    \ call in some implementations.\n\n# Interfaces and Implementations\n\nObjective-C\
    \ requires that the interface and implementation of a class be separately declared\
    \ blocks. By convention, developers place the interface in a header file and the\
    \ implementation in a code file. The header files, normally suffixed .h, are similar\
    \ to C header files while the implementation (method) files, normally suffixed\
    \ .m, can be very similar to C code files.\n\n## Interface\n\nThe interface of\
    \ a class is usually defined in a header file. A common convention is to name\
    \ the header file after the name of the class, e.g. Ball.h would contain the interface\
    \ for the class Ball.\n\nAn interface declaration takes the form:\n\n```\n@interface\
    \ class : superclass {\n// instance variables\n}\n\n+ classMethod;\n+ (return_type)classMethod;\n\
    + (return_type)classMethod:(param1_type)param1_varName;\n- (return_type)instanceMethod:(param1_type)param1_varName\
    \ : \n(param2_type)param2_varName;\n- (return_type)instanceMethodWithParameter:\n\
    (param1_type)param1_varNameOtherParameter:\n(param2_type)param2_varName;\n@end\n\
    ```\n\nIn the above, plus signs denote class methods, or methods that can be called\
    \ on the class itself (not on an instance), and minus signs denote instance methods,\
    \ which can only be called on a particular instance of the class. Class methods\
    \ also have no access to instance variables.\n\nReturn types can be any standard\
    \ C type, a pointer to a generic Objective-C object, or a specific type of object\
    \ such as NSArray *, NSImage *, or NSString *. The default return type is the\
    \ generic Objective-C id.\n\nMethod arguments begin with a colon followed by the\
    \ expected argument type in parentheses and the argument name. In some cases (e.g.\
    \ when writing system APIs) it is useful to add descriptive text before each parameter.\n\
    \n```\n- (void)setRangeStart:(int)start end:(int)end;\n(void)importDocumentWithName:(NSString*)nameWithSpecifiedPreferences:(Preferences*)prefs\
    \ beforePage:(int)insertPage;\n```\n\n## Implementation\n\nThe interface only\
    \ declares the class interface and not the methods themselves; the actual code\
    \ is written in the implementation file. Implementation (method) files normally\
    \ have the file extension .m, which originally signified \"messages\".\n\n```\n\
    @implementation classname\n+ (return_type)classMethod {\n// implementation\n}\n\
    - (return_type)instanceMethod colon:\n// implementation\n}\n@end\n```\n\nMethods\
    \ are written using their interface declarations. Comparing Objective-C and C:\n\
    \n```\n- (int)method:(int)i {\nreturn [self square_root:i];\n}\nint function (int\
    \ i) {\nreturn square_root(i);\n}\n\n(int)changeColorToRed:(float)red:(float)blue;\n\
    [myColor changeColorToRed:5.0 green:2.0 blue:6.0];\n```\n\nInternal representations\
    \ of a method vary between different implementations of Objective-C. If myColor\
    \ is of the class Color, instance method -changeColorToRed:green:blue might be\
    \ internally labeled _i_color changeColorToRed:green_blue. The i is referred to\
    \ an instance method, with the class and then method names and colons changed\
    \ to underscores. As the order of parameters is part of the method name, it cannot\
    \ be changed to suit coding style or expression with true parameters.\n\nHowever,\
    \ internal names of the function are rarely used. Generally, messages are converted\
    \ to function calls defined in the Objective-C runtime library. It is not necessarily\
    \ known at link time which method will be called because the class of the receiver\
    \ (the object being sent the message) need not be known until runtime.\n\n# Instantiation\n\
    \nOnce an Objective-C class is written, it can be instantiated. This is done by\
    \ first allocating an uninitialized instance of the class (an object) and then\
    \ by initializing it. An object is not fully functional until both steps have\
    \ been completed. These steps can be accomplished with a single line of code so\
    \ there is never an allocated object that hasn't undergone initialization (and\
    \ because it is not advisable to keep the intermediate result -init can return\
    \ a different object than that which is called on).\n\nInstantiation with the\
    \ default, no-parameter initializer:\nMyObject *o = [[MyObject alloc] init];\n\
    Instantiation with a custom initializer:\nMyObject *o = [[MyObject alloc] initWithString:myString];\n\
    In the case where no custom initialization is being performed, the \"new\" method\
    \ can be used in place of the alloc-init messages:\n"
  mdcn: "\n在史蒂夫·乔布斯离开苹果公司后，他创立了 NeXT 公司。1988 年，NeXT 从 StepStone（Objective-C 商标所有者\
    \ PPI 的名）获得了 Objective-C 的许可，并扩展了 GCC 编译器以支持 Objective-C，同时开发了基于 NeXTStep 用户界面和界面构建器的\
    \ AppKit 和 Foundation 库。虽然 NeXT 工作站未能在市场上产生巨大影响，但其工具集在行业内广受赞誉。这导致 NeXT 放弃了硬件生产，专注于软件工具，并将\
    \ NeXTStep（以及 OpenStep）作为自定义编程的平台出售。\n\nGNU 项目基于 OpenStep 标准开发了 NeXTStep 的免费克隆版本\
    \ GNUStep。Dennis Glatting 于 1992 年编写第一个 GNU Objective-C 运行时。自 1993 年起使用的 GNU Objective-C\
    \ 运行时，是由 Kresten Karab Thorup 在 1993 年至 1996 年于 NeXT 工作期间开发的。\n\n在 1996 年收购 NeXT\
    \ 后，苹果在其操作系统 Mac OS X 中使用了 OpenStep。这包括 Objective-C 和 NeXT 的 Objective-C 开发者工具\
    \ Project Builder（已经过扩展，现称为 Xcode），以及其界面设计工具 Interface Builder。苹果如今大部分的 Cocoa\
    \ API 都基于 OpenStep 接口对象，并且是目前用于活跃开发的最重要的 Objective-C 环境。\n\n# 语法\n\nObjective-C\
    \ 是 C 语言之上的一个薄层，而且是 C 语言的严格超集；可以使用 Objective-C 编译器编译任何程序，并可以在 Objective-C 类中自由包含\
    \ C 代码。\n\nObjective-C 的语法源自 Smalltalk。所有非面向对象操作的语法（包括原始变量、预处理、函数声明和函数调用）都与 C\
    \ 语言完全相同，而面向对象特性的语法则是 Smalltalk 风格消息传递的实现。\n\n# 消息\n\nObjective-C 的面向对象编程模型基于向对象实例传递消息。在\
    \ Objective-C 中，人们并不直接调用方法，而是发送消息。这与 C++ 使用的 Simula 风格编程模型不同。这两个概念之间的区别在于方法名或消息名引用的代码是如何执行的。在\
    \ Simula 风格语言中，方法名是在编译器绑定到目标类某一部分的调用中。在 Smalltalk 和 Objective-C 中，消息的目标是在运行时解析的，由接收对象本身解释消息。方法通过选择器（selector）或\
    \ SEL（一个表示命名的 NULL 终止的字符串）来标识，并解析为实现它的 C 方法：IMP。此结果导致消息传递系统没有类型检查。\n\n消息指向的对象——接收者——保证会响应消息，如果没有响应，它将简单地抛出异常。\n\
    \n向指针 `obj` 指向的对象发送 `method` 方法将是：\n`obj->method(C);`\n\n在 Objective-C 中，写法如下：\n\
    `[obj method:argument];`\n\n两种编程风格各有优劣。Simula 风格的面向对象编程允许多重继承，并通过尽可能的编译时绑定实现更快的执行速度，但它默认不支持动态绑定。它强制所有方法都要有相应的实现，除非它们是虚方法（virtual），这意味着该方法是一个占位符，用于在派自基类的对象定义同名方法。在代理中调用方法仍然需要一个实现。Smalltalk\
    \ 风格编程允许消息处于未实现状态，方法在运行时解析为其实现。例如，消息可以发送给对象集合，预计其中部分对象会做出响应，而无需担心产生运行时错误。消息传递也不要求对象在编译时定义。（有关动态（晚）绑定的更多优势，参见动态类型章节）。\n\
    \n由于解释消息的开销，初始 Objective-C 消息的耗时是 C++ 虚方法调用的三倍。后续调用会被缓存，在某些实现中比 C++ 虚方法调用更快。\n\
    \n# 接口与实现\n\nObjective-C 要求类的接口和实现是分开声明的块。按照惯例，开发者将接口放在头文件中，将实现放在代码文件中。头文件（通常后缀为\
    \ .h）与 C 头文件类似，而实现（方法）文件（通常后缀为 .m）则可以与 C 代码文件非常相似。\n\n## 接口\n\n类的接口通常定义在头文件中。一种惯例是用类名命名头文件，例如\
    \ `Ball.h` 将包含 `Ball` 类的接口。\n\n接口声明的格式如下：\n\n```\n@interface class : superclass\
    \ {\n// 实例变量\n}\n\n+ classMethod;\n+ (return_type)classMethod;\n+ (return_type)classMethod:(param1_type)param1_varName;\n\
    - (return_type)instanceMethod:(param1_type)param1_varName : \n(param2_type)param2_varName;\n\
    - (return_type)instanceMethodWithParameter:\n(param1_type)param1_varNameOtherParameter:\n\
    (param2_type)param2_varName;\n@end\n```\n\n在上述，加号 `+` 表示类方法，即可以在类本身上调用的方法（而不是实例上），减号\
    \ `-` 表示实例方法，只能在类的特定实例上调用。类方法也无法访问实例变量。\n\n返回类型可以是任何标准 C 类型、指向通用 Objective-C 对象的指针，或特定类型（如\
    \ `NSArray*`、`NSImage*` 或 `NSString*`）。默认返回类型是 `id`。\n\n方法参数以冒号开始，后跟参数类型。在某些情况下（例如编写\
    \ API 时），以便在每个参数之前添加描述性文本。\n\n```\n- (void)setRange:(int)start end:(int)end;\n\
    (void)importWithName:(NSString*)nameWithPreferences:(Preferences*)prefs;\n```\n\
    \n## 实现\n\n接口只声明类接口，不包含方法本身；实际代码写在实现文件中。实现文件通常具有 .m 后缀，这最初表示“消息”。\n\n```\n@implementation\
    \ classname\n+ (return_type)classMethod {\n// 实现\n}\n- (return_type)instanceMethod:\
    \ {\n// 实现\n}\n@end\n```\n\n方法使用其接口声明编写。对比 Objective-C 和 C：\n\n```\n- (int)method:(int)i\
    \ {\n    return [self square_root:i];\n}\nint function (int i) {\n    return square_root(i);\n\
    }\n\n(int)changeColorToRed:(float)red:(float)blue;\n[myColor changeColorToRed:5.0\
    \ green:2.0 blue:6.0];\n```\n\n方法的内部表示在不同的 Objective-C 实现之间会有。如果 myColor 是 Color\
    \ 类，实例方法 `-changeColorToRed:green:blue` 在内部可能被标记为 `_i_color changeColorToRed:green_blue`。`i`\
    \ 指实例方法，类和方法名及冒号改为下划线。由于参数顺序是方法名的一部分，因此无法为了编码风格或带参数的表达式而更改。\n\n然而，函数的内部名称很少使用。通常，消息被转换为\
    \ Objective-C 运行时库定义的函数调用。在链接时并不一定知道会调用哪个方法，因为接收者（发送消息的对象）的类型直到运行时才未知。\n\n# 实例化\n\
    \n一旦写好了 Objective-C 类，就可以对其实例化。这是通过首先分配该类的未初始化实例（一个对象），然后对其初始化完成的。只有在完成这两个步骤后，对象才是完全功能性的。这些步骤可以通过行代码完成，这样就不会出现未经过初始化的分配对象（并且不建议保留中间结果\
    \ -init 返回的对象可能与所调用的对象不同）。\n\n带有默认无参数初始化器的实例化：\n`MyObject *o = [[MyObject alloc]\
    \ init];`\n带有自定义初始化器的实例化：\n`MyObject *o = [[MyObject alloc] initWithString:myString];`\n\
    在不需要进行自定义初始化的情况下，可以使用 `new` 方法代替 `alloc-init` 消息：\n\n`MyObject *o = [MyObject\
    \ new];`\n\n"
