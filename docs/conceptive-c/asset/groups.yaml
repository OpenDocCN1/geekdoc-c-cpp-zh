    is either an atom or a list. Because Lisp functions are themselves written as
    lists, they can be processed exactly like list data. This allows easy writing
    of programs which manipulate other programs (metaprogramming). Many Lisp dialects
    exploit this feature using macro systems, which enables extension of the language
    almost without limit.


