    - <template>：包含对用户输入的响应


    AIML 文件中通常还有约 20 多个其他标签，你也可以创建自己的所谓“自定义谓词”（custom predicates）。目前，可以在《AIML Primer》中找到
    AIML 的入门指南。


    免费的 A.L.I.C.E. AIML 包含大约 41,000 个类别的知识库。以下是其中之一的示例：


    ```

    <category>

    <pattern>WHAT ARE YOU</pattern>

    <template>


    I am the latest result in artificial intelligence,

    which can reproduce the capabilities of the human brain

    with greater speed and accuracy.

    </template>

    </category>

    ```


    （这里没有显示开头和结尾的 <aiml> 标签，因为这是文档中的节录。）


    <category> 和 </category> 之间的所有内容——你猜没错——一个类别。一个类别可以有一个 pattern 和一个 template。（它也可以包含一个
    <that> 标签，但我们在这里不讨论。）


    pattern 将只会匹配精确短语“what are you”（忽略大小写）。


    但该类别也可能通过 <rai> 标签（未显示）和还原论原则被另一个类别调用。


    无论情况下，如果此类别被调用，它将产生上面的响应“I am the latest result in artificial intelligence...”。此外，它还会做一些有趣的事。使用
    <think> 标签（它会让 Alice 执行其中包含的内容但向用户隐藏结果），Alicebot 引擎会将内存中的“topic”（主题）设置为“Me”。这使得其他具有显式“topic”值为“ME”的类别能够比没有显式
    topic 但具有相同 pattern 的类别更好地匹配。这说明了机器人管理员对对话流进行精确控制的一种机制。




    # 类别 (Categories)


    AIML 中的类别是知识的基本单元。一个类别由至少两个元素组成：pattern 元素和 template 元素。这是一个简单的类别：


    ```

    <category>

    <pattern>WHAT IS YOUR NAME</pattern>

    <template>My name is John.</template>

    </category>

    ```


    当此类别被加载时，AIML 机器人将对输入“What is your name”响应为“My name is John.”。


    # 模式 (Patterns)


    pattern 是一个字符字符串，意在匹配一个或多个用户输入。像下面这样的字面模式


    WHAT IS YOUR NAME


    将只会匹配一个输入，忽略大小写：“what is your name”。但 pattern 也可以包含通配符，匹配一个或多个单词。像这样的 pattern


    WHAT IS YOUR *


    将匹配无限数量的输入，包括“what is your name”、“what is your shoe size”、“what is your purpose
    in life”等。


    AIML 的 pattern 语法是一种非常简单的模式语言，复杂程度远低于正则表达式，甚至在乔姆斯基层次结构中未达到第 3 级。为了弥补简单的模式匹配能力，AIML
    解释器可以提供预处理函数来扩展缩写、删除拼写错误等。


    # 模板 (Template)


    template 规定了对匹配模式的响应。template 可以是某些简单的字面文本，例如


    My name is John.


    template 可以使用变量，例如示例


    My name is <bot name="name"/>/>.


    这会将机器人的名称替换到句子中，或者


    You tell me you <get name="user-age"/> years old.


    这将用户的年龄（如果已知）替换到句子中。


    template 元素包括基础文本格式、条件响应（if-then/else）和随机响应。


    template 还可以使用名为 srai 的元素重定向到其他模式。这可以用于实现同义词，如示例所示（此处 CDATA 是为了避免需要 XML 转义）：


    ```

    <category>

    <pattern>WHAT IS YOUR NAME</pattern>

    <template><![CDATA[My name is <bot name="name">.]]></template>

    </category>

    <category>

    <pattern>WHAT ARE YOU CALLED</pattern>

    <template>

    <srai>what is your name</srai>

    </template>

    </category>

    ```


    第一个类别简单地通过机器人的名称回答输入“what is your name”。然而，第二个类别表示输入“what are you called”应该重定向到匹配输入“what
    is your name”的类别——换句话说，它表示这两个短语是等价的。


    template 可以包含其他类型的内容，这些内容可能由机器人对话的任何用户界面进行处理。例如，template 可以使用 HTML 标签进行格式化，不支持
    HTML 的客户端可以忽略它们。


