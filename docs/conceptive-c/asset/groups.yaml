    Even after the publication of the 1989 C standard, for many years K&R C was still
    considered the "lowest common denominator" to which C programmers restricted themselves
    when maximum portability was desired, since many older compilers were still in
    use, and because carefully written K&R code can be legal Standard C as well.


    In early versions of C, only functions that returned a non-int value needed to
    be declared if before the function definition; a function used without any previous
    declaration was assumed to return type int, if its value was used.


    For example:


    ```

    long some_function();

    /* int */ other_function();

    /* int */ calling_function()

    {

    long test1;

    register /* int */ test2;

    test1 = some_function();

    if (test1 > 0)

    test2 = 0;

    else

    test2 = other_function();

    return test2;

    }

    ```


    All the above commented-out int declarations could be omitted in K&R C.


    Since K&R function declarations did not include any information about function
    arguments, function parameter type checks were not performed, although some compilers
    would issue a warning message if a local function was called with the wrong number
    of arguments, or if multiple calls to an external function used different numbers
    or types of arguments. Separate tools such as Unix''s lint utility were developed
    (among other things) could check for consistency of function across multiple source
    files.


    In the years following the publication of K&R C, several unofficial features were
    added to the language, supported by compilers from AT&T and some other vendors.
    These included:


    - void functions (i.e. functions with no return value)

    - functions returning struct or union types (rather than pointers)

    - assignment for struct data types

    - enumerated types


    The large number of extensions and lack of agreement on a standard library, together
    with the language popularity and the fact that not even the Unix compilers precisely
    implemented the K&R specification, led to the necessity of standardization.


    ## ANSI C and ISO


    During the late 1970s and 1980s, versions of C were implemented for a wide variety
    of mainframe computers, minicomputers, and microcomputers, including the IBM PC,
    as its popularity began to increase significantly.


    In 1983, the American National Standards Institute (ANSI) formed a committee,
    X3J11, to establish a standard specification of C. In 1989, the standard was ratified
    as ANSI X3.159-1989 "Programming Language C". This version of the language is
    often referred as as ANSI C, Standard C, or sometimes C89.


    In 1990, the ANSI standard (with formatting changes) was adopted by the International
    Organization for Standardization (ISO) as ISO/IEC 9899:1990, which is sometimes
    called C90. Therefore, the terms "C89" and "C90" refer to the same programming
    language.


    ANSI, like other national standards bodies, no longer develops the C standard
    independently, but defers to the ISO standard. National adoption of updates to
    the international standard typically occurs within a year of ISO publication.


    One of the C standardization process was to produce a superset of K&R C, incorporating
    many of the unofficial features subsequently introduced. The standards committee
    also included several additional features such as function prototypes (borrowed
    from C++), void pointers, support for international character sets and locales,
    and preprocessor enhancements. Although the syntax for parameter declarations
    was augmented to include the style used in C++, the K&R interface continued to
    be permitted, for compatibility with existing source code.


    C89 is supported by current compilers, and most C code being written today is
    based on it. Any program written only in Standard C and without any hardware-dependent
    assumptions will run correctly on any platform with a conforming C implementation,
    within its resource limits. Without such precautions, programs may compile only
    on a certain platform or with a particular compiler, due to the use of non-standard
    libraries, such as GUI libraries, or a reliance on compiler- or platform-specific
    attributes such as the exact size of data types and byte endianness.


    In cases where code must be compilable by either standard-conforming or K&R C-based
    compilers, the __STDC_ macro can be used to split the code into Standard and K&R
    sections to prevent using on a K&R C-based compiler features available only in
    Standard C.


    ## C99


    After the ANSI/ISO standardization process, the C language specification remained
    relatively static for some time. In 1995 Normative Amendment 1 to the 1990 C standard
    was published, to correct some details and to add more extensive support for international
    character sets. The C standard was further revised in the 1990s, leading to publication
    of ISO/IEC 9899:1999 in 1999, which is commonly referred to as "C99". It has since
    been amended three times by Technical Corrections. The international C standard
    is maintained by the working group ISO/IEC JTC1/SC22/WG14.


    C99 introduced several new features, including inline functions, several new data
    types (including long long int and a complex type to represent complex numbers),
    variable-length arrays, support for variadic macros (macros of variable attribute)
    and support for one-line comments beginning with //, as in BCPL or C++. Many of
    these had already been implemented as extensions in several compilers.


    C99 is for the most part compatible with C90, but stricter in some ways; in particular,
    a declaration that lasts type specifier no longer int implicitly assumed. A standard
    macro _STDC_VERSION is defined with 19990L to indicate that C99 is available.
    GCC, Sun Studio and other C compilers now support many or all of the new features
    of C99.


    ## Embedded C


    Historically, embedded programming requires nonstandard extensions to the C language
    in order to support exotic features such as fixed-point arithmetic, multiple distinct
    memory banks, and basic I/O operations.


    In 2008, the C Standards Committee published a technical report extending the
    C language to address these issues by providing a common standard for all implementations
    to adhere to. It includes a number of features not available in normal C, such
    as, fixed-point arithmetic, named address spaces, and basic I/O hardware addressing.


    ## Uses


    C is often used for "system programming", including implementing operating systems
    and embedded system applications, due to a combination of desirable characteristics
    such as code portability and efficiency, ability to access specific hardware addresses,
    ability to pun types to match externally imposed data access requirements, and
    low runtime demand on system resources. C can also be used for website programming
    using CGI as a "gateway" for information between the Web application, the server,
    and the browser. Some reasons for choosing C over interpreted languages are its
    speed, stability, and near-universal availability.


    One consequence of C''s wide acceptance and efficiency is that compilers, libraries,
    and interpreters of other programming languages are often implemented in C. The
    primary implementations of Python (CPython), Perl 5, and PHP are all written in
    C.


    Due to its thin layer of abstraction and low overhead, C allows efficient implementations
    of algorithms and data structures, which is useful for programs that perform a
    lot of computations. For example, the GNU Multi-Precision Library, the GNU Scientific
    Library, Mathematica and MATLAB are completely or partially written in C.


    C is sometimes used as an intermediate language by implementations of other languages.
    This approach may be used for portability or convenience; by using C as an intermediate
    language, it is not necessary to develop machine-specific code generators. Some
    languages and compilers which used C this way are BitC, C++, COBOL, Eiffel, Gambit,
    GHC, Squeak and Wala. However, C was designed as a programming language, not as
    a compiler target language, and is less than ideal for use as an intermediate
    language. This has led to development of C-based intermediate languages like C--.


    C has also been widely used to implement end-user applications, but much of development
    has shifted to newer languages.


    ## Syntax


    C has a formal grammar specified by the C standard. Unlike languages such as FORTRAN
    77, C source code is free-form which allows arbitrary use of whitespace to format
    code, rather than column-based or text-based restrictions. Constraints may appear
    either between the delimiters /* and *, or (in C99) following // until the end
    of the line.


    C source files contain declarations and function definitions. Definitions, in
    turn, contain declarations and statements. Declarations define new types using
    keywords such as struct, union, and enum, or assign types to and perhaps reserve
    storage for new variables, usually by writing the variable name. Keywords such
    as char and int specify built-in types. Sections of code are enclosed in braces
    { }, sometimes called "curly brackets" to limit the scope of declarations and
    to act as a single statement for control structures.


    As an imperative language, C uses statements to specify actions. The most common
    statement is an expression statement, consisting of an expression to be evaluated,
    by a semicolon; as a side effect of the evaluation, functions may be called and
    variables may be assigned new values. To modify the normal sequential execution
    of statements, C provides control-flow statements identified by reserved keywords.
    Structured programming is supported by if-else conditional execution and by do-while,
    while, and for iterative execution (looping). The for statement has separate initialization,
    testing, and reinitialization expressions, or all of which can be omitted. break
    and continue can be used to leave the innermost loop.

