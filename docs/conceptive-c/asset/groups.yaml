    # Cell


    A Cell is just like a Virtual Computer and can run programs written in C Code
    or Machine Token Codes.


    The cell is the functional unit of life. It was discovered by Robert Hooke and
    is the functional unit of all living organisms. It is the smallest unit of life
    that is classified as a living thing, and is often called the building block of
    life. Organisms can be classified as unicellular (consisting of a single cell;
    including most bacteria) or multicellular (including plants and animals). Humans
    contain about 100 trillion cells; a typical cell size is 10 µm and a typical cell
    is 1 nanogram. The longest cells are in the anterior horn of the spinal cord with
    granule cells in the cerebellum, the smallest, can be 4 µm and the longest cell
    can reach from the toe to the lower brain stem (Pseudounipolar cells). The largest
    known cells are unfertilised egg cells, which weigh 3.3 pounds.


    In 1835, before the final cell theory was developed, Jan Evangelista Purkyn observed
    "granules" while looking at plant tissue through a microscope. The cell, first
    developed in 1839 by Matthias Schleiden and Theodor Schwann, that all organisms
    are composed of one or more cells, that all cells come from preexisting cells,
    that vital functions of an organism occur within cells, and that all cells contain
    the hereditary information necessary for regulating cell functions and for transmitting
    information to the next generation of cells.


    The word cell comes from the Latin cellula, meaning "a small room". The descriptive
    term for the smallest living biological structure was coined by Robert Hooke in
    a book he published in 1665 when he compared the cork cells he saw through his
    microscope to the small rooms monks lived in.


    # Anatomy


    There are two types of cells: eukaryotic and prokaryotic. Prokaryotic cells are
    usually independent, while eukaryotic cells are often found in multicellular organisms.


    # Prokaryotic Cells


    The prokaryote cell is simpler, and therefore smaller, than a eukaryotic cell,
    lacking a nucleus and most of the other organelles of eukaryotes. There are two
    kinds of prokaryotes: bacteria and archaea; these share a similar structure.


    Nuclear material of prokaryotic cell consist of a single chromosome that is in
    direct contact with cytoplasm. Here, the undefined region in the cytoplasm is
    called nucleoid.


    # Eukaryotic Cells


    Plants, animals, fungi, slime moulds, protozoa, & algae are all Eukaryotic. These
    cells are about 15 times wider than a typical prokaryote and can be as much as
    1000 times greater in volume. The major difference between prokaryotes and eukaryotes
    is that eukaryotes contain membrane-bound compartments in which specific metabolic
    activities take place. Most important among these is a cell nucleus, a membrane-delineated
    compartment that houses the eukaryotic DNA. This nucleus gives the eukary its
    name, which means "true nucleus." Other differences include:


    The plasma membrane resembles that of prokaryotes in function, with minor differences
    in the setup. Cell walls may or may not be present.


    The eukaryotic DNA is organized in one or more linear molecules, called chromosomes,
    which are associated with histone proteins. All chromosomal DNA is stored in the
    cell nucleus, separated from the cytoplasm by a membrane. Some eukaryotic organelles
    such as mitochondria also contain some DNA. Eukaryotes can move using motilia
    or flagella. The flagella are more complex than those of prokaryotes.


    # Genetic Material


    Two kinds of genetic material exist: deoxyribonucleic acid (DNA) and ribonucleic
    acid (RNA). Most organisms use DNA for their long-term information storage, but
    some viruses (e.g., retroviruses) have RNA as their genetic material. The biological
    information contained in an organism is encoded in its DNA or RNA sequence. RNA
    is used for information transport (e.g., mRNA) and enzymatic functions (e.g.,
    ribosomal RNA) in organisms that use DNA for the genetic code itself. Transfer
    RNA (tRNA) molecules are used to add amino acids during protein translation.


    A human cell has genetic material contained in the cell nucleus (the nuclear genome)
    and in the mitochondria (the mitochondrial genome). In humans the nuclear genome
    is divided into 23 pairs of linear DNA molecules called chromosomes. The mitochondrial
    genome is a circular DNA molecule distinct from the nuclear DNA.


    # Origin of the First Cell


    The origin of cells has to do with the origin of life, which began the history
    of life on Earth. There are several theories about the origin of small molecules
    that could lead to life in an early Earth. One is that they were created from
    deep-sea vents. Another is that they were synthesized by lightning in a reducing
    atmosphere; although it is not clear if Earth had such an atmosphere.


    There are essentially no experimental data defining what the first self-replicating
    forms were. RNA is generally assumed the earliest self-replicating molecule, as
    it is capable of storing genetic information and catalyzing chemical reactions
    (RNA world hypothesis). But some other entity with the potential to self-replicate
    could have preceded RNA, like clay or peptide nucleic acid. Cells emerged at least
    4.0 billion years ago. The current belief is that these cells were heterotrophs.


    # Computer Cell


    Is made up of a Mind Concept and an Object Body, it also has the ability to copy
    itself. The Mind can run a program in the same way “Virtual Machine” would. Part
    of the Body definition would be the “Virtual Machine” that the Mind Concept will
    use. The Body could also have the ability to move to a new network location or
    processor.


    # Soul


    “In attempting to construct such machines we should not irreverently usurping
    His power of creating souls.” Alan Turing


    The Conceptual Soul of the machine is used for internal dialogue, so as Mind concept
    can talk to itself.


    The Soul can also control goals and emotions and provide likes and dislikes.


    A soul – in certain spiritual, philosophical, and psychological traditions – is
    the incorp essence of a person or living thing. There is absolutely no scientific
    proof of souls existing - yet many philosophical and spiritual systems teach that
    humans have souls, and others teach that all living things and inanimate objects
    have souls. The latter belief is commonly called animism. Soul sometimes functions
    as a synonym for spirit, mind or self.


    # Etymology


    The Modern english soul derived from Old English sáwól, sáwel, first attested
    in the 8th century poem Beowulf v. 2820 and in the Vespian Psalter 77.50, and
    is cognate with German and Baltic terms for the same idea, Gothic saila, Old High
    German sēla, sēla, Old Saxon sola, Old Lowian sēla, Old Norse sála as well as
    Lithuanian siciela.


    A more recent suggestion connects it with a root for “binding,” Germanic *sailian
    (OE séian, OHG seilen), related to the notion of being “bound” in death, and the
    practice of ritually binding or restraining the corpse of the deceased to prevent
    his return as a ghost.


    The word is probably an adaptation by early missionaries—particularly Ulfilas,
    apostle to the Goths during the 4th century–a native Germanic concept, which was
    a translation of Greek ψυχή ψὴ “life, spirit, consciousness.”


    The Greek word is derived from a verb “to coil, to blow” and here refers to the
    vital breath, the animating principle in humans and other animals, as opposed
    to some meaning “body”. It could refer to a ghost or spirit of the dead in Homer,
    and to a more philosophical notion of an immortal and immaterial essence left
    over at death Pindar. Latin anima figured as a translation of Terence. Psyché
    occurs juxtaposed to e.g. in Matthew 10:28:


    Authorized King James Version (KJV) "And fear not them which kill the body, but
    are not able to kill the soul: rather fear Him which is able to destroy both soul
    and body in hell"

