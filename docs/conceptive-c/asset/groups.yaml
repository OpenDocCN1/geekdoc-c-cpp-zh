    # Categories


    During the design of Objective-C, one of the main concerns was the maintainability
    of large code bases. Experience from the structured programming world had shown
    that one of the main ways to improve code was to break it down into smaller pieces.
    Objective-C borrowed and extended the concept of categories from Smalltalk implementations
    to help with this process.


    A category collects method implementations into separate files. The programmer
    can place groups of methods into a category to make them more readable. For instance,
    one could create a "SpellChecking" category in the String object, collecting all
    of the methods related to spell checking into a single place.


    Furthermore, the methods within a category are added to a class at run-time. Thus,
    categories permit the programmer to add methods to an existing class without the
    need to recompile that source code. For example, if a system does not contain
    a spell checker in its String implementation, it could be added without modifying
    the String source code.


    Methods within categories become indistinguishable from the methods in a class
    when the program is run. A category has full access to all of the instance variables
    within the class, including private variables.


    If a category declares a method with the same signature as an existing method
    in a class, the category’s method is adopted. These categories can not only add
    methods to a class, but also replace existing methods. This feature can'
