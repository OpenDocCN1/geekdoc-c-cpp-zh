    "Consciousness is part of the natural world. It depends, we believe, only on mathematics
    and logic and on the imperfectly known laws of physics, chemistry, and biology;
    it does not arise from some magical or otherworldly quality."


    The concept of mind uploading is based on this mechanistic view of the mind, and
    denies the vitalist view of human life and consciousness.


    Many eminent computer scientists and neuroscientists have predicted that computers
    will be capable of thought and even attain consciousness, including Koch and Tononi,
    Douglas Hofstadter, Jeff Hawkins, Marvin Minsky, Randal A. Koene, and Rodolfo
    Llinas.


    Such a machine intelligence capability might provide a computational substrate
    necessary for uploading.


    However, even though uploading is dependent upon such a general capability is
    conceptually distinct from general forms of AI that it results from dynamic reanimation
    of information derived from a specific human mind so the mind retains a sense
    of historical identity (other forms are possible but would compromise or eliminate
    the life-extension feature associated with uploading). The transferred and reanimated
    information would become a form of artificial intelligence, sometimes called an
    infomorph or "noömorph."


    Many theorists have presented models of the brain and have established a range
    of estimates on the amount of computing power needed for parity and complete simulations.
    Using these models, some have estimated that uploading may become possible within
    decades if trends such as Moore''s Law continue.


    The prospect of uploading human consciousness in this manner raises many philosophical
    questions involving identity, individuality and the soul and can be defined as
    the information content of the brain, as well as numerous problems of medical
    ethics and morality of the process.


    ## Immortality/Backup


    In theory, if the information and processes of the mind can be disassociated from
    the biological body, they are no longer tied to the individual limits and lifespan
    of that body. Furthermore, information within a brain could be partly or wholly
    copied or transferred to one or more substrates (including digital storage or
    another brain), reducing or eliminating mortality risk. This general proposal
    appears to have been first made in the biomedical literature in 1971 by biogerontologist
    George M. Martin of the University of Washington.


    ## Speedup


    A computer-based intelligence such as an upload could potentially think much faster
    than a human even if it were no more intelligent. Human neurons exchange electrochemical
    signals with a maximum speed of about 150 meters per second, whereas the speed
    of light is about 300 meters per second, and two million times faster. Also, neurons
    can generate a maximum of about 200 to 1000 action potentials or "spikes" per
    second, whereas the number of signals per second in computer chips is about 3
    GHz (about 20 million times greater) and expected to increase by at least a factor
    100. Therefore, even if the computer components responsible for simulating a brain
    were not significantly smaller than a biological brain, and even if the temperature
    of these components was not significantly lower, Eliezer Yudkowski of the Singularity
    Institute for Artificial Intelligence calculates a theoretical upper bound for
    the speed of a future artificial neural network. It could run 1 million times
    faster than a real brain, experiencing about a year of subjective time in only
    31 seconds of real time.


    However, in practice this massively parallel implementation would require separate
    computational units for each of the hundred billion neurons and each of the hundred
    trillion synapses. That requires an enormously large computer or artificial neural
    network in comparison with today''s super-computers. In a less futuristic implementation,
    time-sharing would allow several neurons to be emulated sequentially by the same
    computational unit. Thus the size of the computer would be restricted, but the
    speed would be lower. Assuming that cortical minicolumns organized into hypercolumns
    are the computational units, mammalian brains could be emulated by today''s super
    computers, with slower speed than in a biological brain.


    ## Multiple / Parallel Existence


    Another concept explored in science fiction is the idea of more than one running
    "copy" of a human mind existing at once. Such copies could potentially allow an
    "individual" to experience many things at once, and later integrate the experiences
    of all copies into a central mentality at some point in the future, effectively
    allowing a single sentient to be "many places at once" and "do many things at
    once"; this concept has been explored in fiction. Such partial and complete copies
    of a sentient being raising questions regarding identity and individuality.


    ## Computational Capacity


    Futurist Ray Kurzweil''s projected supercomputer processing power based on Moore''s
