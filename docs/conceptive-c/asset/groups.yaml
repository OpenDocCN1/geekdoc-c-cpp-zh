    # Evaluation and the Read-Eval-Print Loop


    Lisp languages are frequently used with an interactive command line, which

    may be combined with an integrated development environment. The user types

    in expressions at the command line, or uses the IDE to transmit them to the

    Lisp system. Lisp reads the entered expressions, evaluates them, and prints the

    result. For this reason, the Lisp command is called a "read-eval-print

    loop", or REPL.


    The basic operation of the REPL is as follows. This is a simplistic description

    which omits many elements of a real Lisp, such as quoting and macros.


    The read function accepts S-expressions as input, and parses them into

    an internal data structure. If you type the text (+ 1 2) at the

    prom, read translates this into a linked list with three elements: the symbol
    +

    t number 1, and the number 2. So it reports that list is also a valid piece

    ofisp code; that is, it can be evaluated. This is because the car of the list

    names a function—the addition operation.


    Note that a fool will read as a single symbol. 123 will be read as the number

    123, "123" will be read as the string "123".


    The eval function evaluates the data, returning zero or more other Lisp data as

    ult. Evaluation does not have mean interpretation; some Lisp systems

    compile every expression to native machine code. It is simple, however, to

    describe evaluation as interpretation: To evaluate a list whose car names a

    unction, eval first evaluates each of the arguments given in its cdr, then

    lies the function to the arguments. In this case, the function is addition, and

    applying it to the argument list (1 2) yields the answer 3. This is the result
    of

    the evaluation.'
