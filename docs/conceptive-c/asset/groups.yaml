    The symbol foo evaluates to the value of the symbol foo. Data like the string
    "123" evaluates to the same string. The list (quote (1 2 3)) evaluates to the
    list (1 2 3).


    It is the job of the print function to represent output to the user. For a simple
    result such as this is trivial. An expression which evaluated to a piece of list
    would require that print traverse the list and print it out as an S-expression.


    To implement a Lisp REPL, it is necessary only to implement these three functions
    and an infinite-loop function. (Naturally, the implementation of eval will be
    complicated, since it must also implement all special operators like if or lambda.)
    This done, a basic REPL is itself a single line of code: (print (eval)).


    The Lisp REPL typically also provides input editing, an input history, error handling
    and an interface to the debugger.


    Lisp is usually evaluated eagerly. In Common Lisp, arguments are evaluated in
    applicative order (leftmost innermost), while in Scheme order of arguments are
    undefined, leaving room for optimization by a compiler.


    # Control Structures


    Lisp originally had few control structures, but many more were added during the
    language''s evolution. (Lisp''s original conditional operator, cond, is the precursor
    to later if-then-else structures.)


    Programmers in the Scheme dialect often express loops using tail recursion. Scheme''s
    commonality in academic computer science has led students to believe that tail
    recursion is the only, or the most common, way to write iterations in Lisp, but
    this is incorrect. All frequently seen Scheme dialects have imperative-style iteration
    constructs, from Scheme''s do to Common Lisp''s complex loop expressions. Moreover,
    the key issue that makes this an objective rather than subjective matter is that
    Scheme makes specific requirements for the handling of tail calls, and consequently
    the reason that the use of tail recursion is generally encouraged for Scheme is
    that the practice is explicitly supported by the language definition itself. By
    contrast, ANSI Common Lisp does not require the optimization commonly referred
    to as tail call elimination. The fact that tail recursive style as a replacement
    for the most traditional iteration constructs (such as do, dolist or loop) is
    discouraged in Common Lisp is not just a matter of stylistic preference, but potentially
    one of efficiency (since an apparent tail call in Common Lisp may not compile
    as a simple jump) and correctness (since tail recursion may increase stack use
    in Common Lisp, risking stack)


    Some Lisp control structures are special operators, equivalent to other languages''
    syntactic keywords. Expressions using these operators have the same surface appearance
    as function calls, but differ in that the arguments are'
  - '[PAGE 63]


    not necessarily evaluated—or, in the case of an iteration expression, may be evaluated
    more than once.


    In contrast to other major programming languages, Lisp allows the programmer to
    implement control structures using the language itself. Several control structures
    are implemented as Lisp macros, and can even be expanded by the programmer who
    knows how to they work.


    Both Common Lisp and Scheme have operators for non-local control flow. The differences
    in these operators are some of the deepest differences between the two dialects.
    Scheme supports re-entrant continuations using the call/ce procedure, which allows
    a programmer to save (and restore) a particular place in execution. Common Lisp
    does not support re-entrant continuations, but does support several ways of handling
    escape continu.


    Frequently, the same algorithm can be expressed in Lisp in either an imperative
    or a functional style. As noted above, Scheme tends to favor the functional style,
    using tail recursion and continuations to express control flow. However, imperative
    style is still quite possible. The style preferred by many Common Lisp programmers
    may seem more familiar to programmers used to structured languages such as C,
    while that preferred by Schemers closely resembles pure-functional languages such
    as Haskell.


    Because of Lisp''s early heritage in list processing, it has a wide array of higher-order
    functions relating to iteration over sequences. In many cases where an explicit
    loop would be needed in other languages (like a for loop in C) in Lisp the same
    task can be accomplished with a higher-order function. (The same is true of many
    functional programming languages.)


    A good example is a function which in Scheme is called map and in Common Lisp
    is called mapcar. Given a function and one more lists, mapcar applies the function
    successively to the lists'' elements in order, collecting the results in a new
    list:


    ```

    (mapcar ''+1 2 3 4 5) ''(10 20 30 44 50))

    ```


    This applies the + function to each corresponding pair of list elements, yielding
    the result (11 22 33 44 55).


