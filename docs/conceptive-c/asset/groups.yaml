    The cell is the functional unit of life. It was discovered by Robert Hooke and
    is the functional unit of all living organisms. It is the smallest unit of life
    that is classified as a living thing, and is often called the building block of
    life. Organisms can be classified as unicellular (consisting of a single cell;
    including most bacteria) or multicellular (including plants and animals). Humans
    contain about 100 trillion cells; a typical cell size is 10 µm and a typical cell
    is 1 nanogram. The longest cells are in the anterior horn of the spinal cord with
    granule cells in the cerebellum, the smallest, can be 4 µm and the longest cell
    can reach from the toe to the lower brain stem (Pseudounipolar cells). The largest
    known cells are unfertilised egg cells, which weigh 3.3 pounds.


    In 1835, before the final cell theory was developed, Jan Evangelista Purkyn observed
    "granules" while looking at plant tissue through a microscope. The cell, first
    developed in 1839 by Matthias Schleiden and Theodor Schwann, that all organisms
    are composed of one or more cells, that all cells come from preexisting cells,
    that vital functions of an organism occur within cells, and that all cells contain
    the hereditary information necessary for regulating cell functions and for transmitting
    information to the next generation of cells.


    The word cell comes from the Latin cellula, meaning "a small room". The descriptive
    term for the smallest living biological structure was coined by Robert Hooke in
    a book he published in 1665 when he compared the cork cells he saw through his
    microscope to the small rooms monks lived in.


    # Anatomy


    There are two types of cells: eukaryotic and prokaryotic. Prokaryotic cells are
    usually independent, while eukaryotic cells are often found in multicellular organisms.


    # Prokaryotic Cells


    The prokaryote cell is simpler, and therefore smaller, than a eukaryotic cell,
    lacking a nucleus and most of the other organelles of eukaryotes. There are two
    kinds of prokaryotes: bacteria and archaea; these share a similar structure.


    Nuclear material of prokaryotic cell consist of a single chromosome that is in
    direct contact with cytoplasm. Here, the undefined region in the cytoplasm is
    called nucleoid.


    # Eukaryotic Cells'
