    # ELIZA


    The notoriety of Turing''s proposed test stimulated great interest in Joseph Weizenbaum''s
    program ELIZA, published in 1966, which seemed to be able to fool users into believing
    they were convers with a real human. However Weizenbaum himself did not claim
    that ELIZA was genuinely intelligent, and the Introduction to his program presented
    it more as a debunking exercise:


    [In]


    artificial intelligence ... machines are made to behave in wondrous ways, often
    sufficient to dazzle the most experienced observer. Once a particular program
    is unmasked, once its inner workings are explained ... its magic crumbles; stands
    revealed as a collection of procedures ... The observer says to himself "I could
    have written that". With that thought he moves the program in question from the
    shelf marked "intelligent", to that reserved for curios ... The object of this
    paper is to cause just a reevaluation of the program to be "explained". Few programs
    needed it more.


    ELIZA''s key method of operation (copied by chatbot designers ever since) involves
    the recognition of code words or phrases in the input, and the output of corresponding
    pre-prepared or pre-programmed responses that can make the conversation forward
    in an apparently meaningful way (e.g. by responding to any input that contains
    the word ''MOTHER'' with ''TELL ME MORE ABOUT YOUR FAMILY''). That illusion of
    understanding is generated, even though the processing involved is merely superficial.
    ELIZA showed that such an illusion is surprisingly easy to generate, because human
    judges are so ready to give the benefit of the doubt when conversational responses
    are capable of being interpreted as ''intelligent''. The key technique here—which
    characterises a program as a chatbot rather than a serious natural language processing
    system—is the production of responses that are sufficiently vague and non-specific
    that they can be understood as ''intelligent'' in a wide range of conversational
    contexts. The emphasis is typically on vagueness and clarity, rather than conveying
    genuine information.


    Interface designers have come to appreciate that humans'' readiness to interpret
    computer output—even when it is actually based on simple pattern-matching—can
    be exploited for useful purposes. Most people prefer to engage with programs that
    are human-like, and this gives chatbot-style techniques a potentially useful role
    in interactive systems that need to edit information from users, as long as that
    information is relatively straightforward and falls into predictable categories.
    Thus, for online help systems can use employ chatbot techniques to identify the
    area of help that users require, potentially providing a "friendlier" interface
    than a'
