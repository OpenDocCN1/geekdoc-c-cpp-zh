    the address pointed to by x incremented by i bytes, but rather incremented by
    i multiplied by the size of an element x points to. The size of these elements
    can be determined by the operator sizeof by applying it to any dereferenced element
    of x, as in n = sizeof(*x) or n = sizeof x[0].


    Furthermore, in most expression contexts (a notable exception is operand of sizeof),
    the name of an array is automatically converted to a pointer to the array''s first
    element; this implies that an array is never copied as a whole when named as an
    argument to a function, but rather the address of its first element is passed.
    Therefore, although function calls in C pass-by-value semantics, arrays are in
    effect passed by reference.


    The number of elements in a declared array x can be determined as sizeof x / sizeof
    x[0].


    An interesting demonstration of the interchangeability of pointers and arrays
    is shown below. The four assignments are equivalent and each is valid C code.


    ```c

    /* x is an array OR a pointer. i is an integer. */

    x[i] = 1;      /* equivalent to *(x + i) */

    *(x + i) = 1;

    *(i + x) = 1;

    i[x] = 1;      /* equivalent to *(i + x) */

    ```


    Note that all four assignments are equivalent, array and pointer variables, only
    the first represents good coding style. The last line might be found in obfuscated
    C code.


    Despite this apparent equivalence between array and pointer variables, there is
    still a distinction to be made between them. Even though the name of an array
    is, in most expression contexts, converted into a pointer (to its first element),
    this pointer does not occupy any storage, unlike a pointer variable. Consequently,
    an array "points to" cannot be changed, and it is impossible to assign a value
    to an array variable. (Array contents may be copied over, e.g., by using the memcpy
    function, or by accessing the individual elements.)


    # Memory Management


    One of the most important functions of a programming language is to provide facilities
    for managing memory and the objects that are stored in memory. C provides three
    distinct ways to allocate memory for objects:


    - Static memory allocation: space for the object is provided in the binary at
    compile-time; these objects have an extent (or lifetime) as long as the binary
    which contains them is loaded into memory.

    - Automatic memory allocation: temporary objects can be stored on the stack, and
    this space is automatically freed and reusable after the block in which they are
    declared exited.

    - Dynamic memory allocation: blocks of memory of arbitrary size can be requested
    at run-time using library functions such as malloc from a region of memory called
    heap; these blocks persist until subsequently freed by calling the library function
    realloc or free.


    These approaches are appropriate in different situations and have various tradeoffs.
    For example, static memory allocation has little allocation overhead, automatic
    allocation may involve slightly more overhead, and dynamic allocation can potentially
    have a great overhead of both allocation and deallocation. The persistent nature
    of static objects is useful for maintaining state information across function
    calls, automatic allocation is easy to use but stack space is typically more limited
    and transient than either static memory or heap space, and dynamic memory allocation
    allows convenient allocation of objects whose size is known only at run-time.
    Most C programs make extensive use of all three.


    Where possible, automatic or static allocation is usually simplest because the
    storage is managed by the compiler, freeing the programmer of the error-prone
    code of manually allocating and releasing storage. However, many data structures
    can change in size at run-time, and static allocations (and automatic allocations
    before C99) must have a fixed size at compile-time, there are many situations
    in which dynamic allocation is necessary. Prior to the C99 standard, variable-sized
    arrays are a common example of this. (See the article on malloc for example of
    dynamically allocated arrays.)


    Unless otherwise specified, static objects contain zero or null pointer values
    upon startup. Automatically and dynamically allocated objects are initialized
    only if an initial value is explicitly specified; otherwise they initially have
    indeterminate values (typically, whatever bit pattern happens to be in the storage,
    which might not even represent a valid value for that type). If the program attempts
    to access an uninitialized value, the results are undefined, but both false positives
    and false negatives can occur.


    Another issue is heap memory allocation has to be synchronized with its actual
    usage in any program in order for it to be reused as much as possible. For example,
    if the only pointer to a heap memory allocation goes out of scope or has its value
    overwritten before free() is called, then memory cannot be recovered for later
    use and is essentially lost to the program, a phenomenon known as a memory leak.
    Conversely, it is possible to release memory too soon and continue to access it;
    however, since the allocation system can re-allocate or use the free memory, unpredictable
    behavior is likely to occur. Typically, the symptoms will appear in a portion
    of the program removed from the actual error, making it difficult to track down
    the problem. (Such issues are ameliorated in languages with automatic garbage
    collection.)


    # Libraries


    The most common library is the standard library, which is specified by the ISO
    and ANSI C standards and comes with every C implementation ("freestanding") [embedded]
    C implementations may provide only a subset of the standard library. This library
    supports stream input and output, memory allocation, mathematics, character strings,
    and time values.


    Another common set of C library functions are used by applications specifically
    targeted for Unix and Unix-like systems, especially functions which provide an
    interface to the kernel. These functions are detailed in various standards such
    as POSIX and the Single UNIX Specification.


    Since many programs have been written in C, there are a wide variety of other
    libraries available. Libraries are often written in C because C compilers generate
    efficient object code; programmers then create interfaces to the library so that
    routines can be used from higher-level languages like Java, Perl, and Python.


    # Objective C


    Objective-C is a reflective, object-oriented programming language that adds Smalltalk-style
    messaging to the C language.


    Today, it is used primarily on Apple''s Mac OS and iOS: two environments derived
    from the OpenStep standard, there not compliant. Objective-C is the primary language
    used for Apple''s Cocoa API, and it was originally the main language on NeXT''s
    OS. Generic Objective-C programs that do not use these libraries can also be compiled
    for any system supported by gcc or Clang.


    # History


    Objective C was created by Brad Cox and Tom Love in the early 1980s at their company
    Stepstone. Both had been introduced to Smalltalk while at Programming Technology
    Center in 1981. The earliest work on Objective C traces back around that time.
    Cox was intrigued by problems of true reusability in software design and programming.
    He realized that a language like Smalltalk would be invaluable in building development
    environments for system developers. However, Tom Love also recognized that backward
    compatibility with C was critically important in IT''s engineering milieu. Cox
    began writing a processor for C to add some of the capabilities of Smalltalk.
    He soon had a working implementation of an object-oriented extension to the C
    language, which he called "OOPC" for Object-Oriented Pre-Compiler.


    Love was hired by Schlumberger Research in 1982 and had the opportunity to acquire
    the first commercial copy of Smalltalk-80, which further influenced the development
    of their brainchild.


    In order to demonstrate that real progress could be made, Cox showed that making
    interchangeable software components really needed only a few practical changes
    to existing tools. Specifically, they needed to support objects in a flexible
    manner, come supplied with a usable set of libraries, and allow for the code (and
    any resources needed by the code) to be bundled into a single cross-platform format.


    Love and Cox eventually formed a new venture, Productivity Products International
    (PPI), to commercialize their product, which coupled an Objective-C compiler with
    class libraries. In 1986, Cox published the main description of Objective-C in
    its original form in the book Object-Oriented Programming, An Evolutionary Approach.
    Although he was careful to point out that there is more to the problem of reusability
    than just the language, Objective-C often found itself compared feature for feature
    with other languages.


