  mdcn: "\n通常通过重写其他类的方法来修复类中的错误，或者对程序中某个类的行为引起全局更改。如果两个分类具有相同名称的方法（不要与方法签名混淆），则未定义采用哪个分类的方法。\n\
    \n---\n\n其他语言曾尝试通过多种方式添加此功能。TOM 将 Objective-C 系统向更进了一步，还允许添加变量。其他语言则使用了原型导向的解决方案，最著名的是\
    \ Self。\n\nC# 和 Visual Basic.NET 语言通过扩展方法实现了形式上相似的功能，但它们无法访问类的私有变量。Ruby 以及其他几种编程语言将该技术称为“猴补丁（monkey\
    \ patching）”。\n\n## #import\n\n在 C 语言中，`#include` 预编译指令始终会将文件内容插入到源代码在该处。Objective-C\
    \ 有等效 `#import` 指令，但每个文件在每个编译单元中仅包含一次，消除了对头文件保护（include guards）的需求。\n\n## Objective-C\
    \ 2.0\n\n在 2006 年世界开发者大会上，Apple 发布了“Objective-C 2.0”，这是 Objective-C 语言的修订版本，包含了“现代垃圾回收、语法增强、运行时性能改进以及\
    \ 64 位支持”。2007 年 10 月发布的 Mac OS X v10.5 包含了 Objective-C 2.0 编译器。GCC 4.6 支持许多新的\
    \ Objective-C 特性，如声明和合成属性（properties properties）、点语法、快速枚举、可选协议方法、方法/协议/类属性、类扩展以及新的\
    \ GNNu Objective-C API。\n\n## 垃圾回收\n\nObjective-C 2.0 提供了一个可选的保守型分代垃圾收集器。在向后兼容模式下运行时，运行时会将引用计数操作“retain”和“release”转换为空操作。当标记为“strong”时，所有对象都受垃圾回收控制，还会触发底层的写屏障拦截并参与垃圾回收。系统还提供了一个置零弱引用，标记为“weak”的指针在对象（或简单来说\
    \ GC 内存）被回收时会被设置为零。Objective-C 2.0 的 iOS 实现中不存在垃圾回收。Objective-C 中的垃圾回收在低优先级的后台线程上运行，并可以在用户事件期间停止，目的是保持用户体验的响应性。\n\
    \n## 属性\n\nObjective-C 2.0 引入了一种新语法将实例变量声明为属性，并带有可选属性来配置访问器方法的生成。属性在某种意义上是公共实例变量；也就是说，将实例变量声明为属性为外部类提供了对该属性的访问（可能受限，例如只读）。属性可以声明为“readonly”，并可以提供如“assign”、“copy”或“retain”之类的存储语义。默认情况下，属性被认为是原子的（atomic），这会导致一个锁，防止多个线程同时访问它们。属性可以声明为“nonatomic”，这会移除该锁。\n\
    \n```objc\n@interface Person : NSObject {\n@public\nNSString *name;\n@private\n\
    int age;\n}\n@property(copy) NSString *name;\n@property(readonly) int age;\n-(id)initWithAge:(int)age;\n\
    @end\n```\n\n属性通过 `@synthesize` 关键字实现，它根据属性声明生成 getter（如果不是只读则生成 setter）方法。或者，必须显式实现\
    \ getter 和 setter 方法，或者可以使用 `@dynamic` 关键字指示访问器方法将通过其他手段提供。\n\n```objc\n@implementation\
    \ Person\n@synthesize name;\n-(id)initWithAge:(int)age {\nage = initAge; // 注意：直接赋值实例变量，而不是属性\
    \ setter\nreturn self;\n}\n-(int)age {\nreturn 29;\n}\n@end\n```\n\n可以使用传统的消息传递语法、点表示法或通过\
    \ `valueForKey:`/`setValue:forKey:` 方法按访问属性。\n\n```objc\nPerson *aPerson = [[Person\
    \ alloc] initWithAge: 53];\n\naPerson.name = @\"Steve\"; // 注意：点语法，使用合成 setter，等同于\
    \ aPerson setName:@\"Steve\";\n\nNSLog(\"Access by message(%@) %@ %@\", [aPerson\
    \ name], aPerson.name, [aPerson forKey:@\"name\"], aPerson->name);\n```\n\n为了在实例方法内部调用访问器，应使用\
    \ `self` 关键字：\n\n```objc\n-(void) introduceMyselfWithProperties:(BOOL)useGetter\
    \ {\nNSLog(\"Hi, my name is %@.\",(useGetter ? self.name : name)); // 注意：getter\
    \ 与 ivar 访问\n}\n```\n\n类或协议的属性可以进行动态内省。\n\n```objc\nint propertyCount =00;\nobjc_property_t\
    \ *propertyList = class_copyPropertyList([aPerson class], &propertyCount);\nfor\
    \ (i = 0; i < propertyCount; i++) {\n    objc_property_t *thisPropertyName = property_getName(*thisProperty);\n\
    \    NSLog(\"%@Person has a property: %s\", propertyName);\n}\n```\n\n## 非脆弱性实例变量\n\
    \n在运行时支持的情况下，Objective-C 2.0 提供了非脆弱性实例变量（例如构建 64 位 Mac OS 代码时，如所有 iOS 代码）。在现代运行时，实例变量访问增加了一个额外的间接层，允许动态链接器在运行时调整实例布局。此功能为\
    \ Objective-C 带来了两个重要的改进：消除了二进制接口问题——父类可以更改\n\n## 快速枚举\n\n在运行时支持的情况下，Objective-C\
    \ 2.0 提供了快速枚举。在现代运行时，实例变量访问增加了额外的间接层，允许动态链接器在运行时调整实例布局。此功能为 Objective-C 带来了两个重要的改进：消除了二进制接口问题——父类可以更改。\n"
