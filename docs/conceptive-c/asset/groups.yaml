    细胞就像一台虚拟计算机，可以运行用C语言代码或机器标记代码编写的程序。


    细胞是生命的功能单位。它由罗伯特·胡克（Robert Hooke）发现，是所有生物的结构性单元。它是被归类为生物的最小生命单位，通常被称为生命的基石。生物可以分为单细胞生物（由单个细胞组成；包括大多数细菌）或多细胞生物（包括植物和动物）。人体含有约
    100 万亿个细胞；典型细胞的大小为 10 µm，典型细胞重量为 1 纳克。最长的细胞位于脊髓前角，小脑中的颗粒细胞最小，可达 4 µm，而最长的细胞可以从脚趾延伸到下脑干（双极神经元）。已知最大的细胞是未受精卵细胞，重量为
    3.3 磅。


    在 1835 年，在最终细胞理论建立之前，扬·埃万哲利斯塔·普尔基纽（Jan Evangelista Purkyn）通过显微镜观察植物组织时发现了“颗粒”。细胞理论由马蒂亚斯·施莱登（Matthias
    Schleiden）和特奥多尔·施恩（Theodor Schwann）于 1839 年首次提出：所有生物都由一个或多个细胞组成；所有细胞都源于先有的细胞；生物的生命活动发生在细胞内；所有细胞都含有调节细胞功能和向下一代细胞传递所需的遗传信息。


    “Cell”（细胞）一词源于拉丁语 cellula，意为“小房间”。最小生物结构的描述性术语由罗伯特·胡克在他 1665 年出版的一本书中提出的，当时他将显微镜看到的软木细胞与僧侣居住的小房间进行了类比。


    # 解剖学


    细胞有两种类型：真核细胞和原核细胞。原核细胞通常是独立的，而真核细胞通常出现在多细胞生物中。


    # 原核细胞


    原核细胞比真核细胞简单，因此也更小，缺乏核以及真核细胞的大多数其他细胞器。原核生物分为两种：细菌和古菌；它们具有相似的结构。


    原核细胞的遗传物质由单染色体组成，直接与细胞质接触。在这里，细胞质中未定义的区域称为核仁。


    # 真核细胞


    植物、动物、真菌、黏菌、变形虫和藻都是真核生物。这些细胞比典型的原核细胞宽约 15 倍，体积可大 1000 倍。原核生物和真核细胞的主要区别在于，真核细胞含有膜膜隔室，在其中进行特定的代谢活动。最重要的是细胞核，这是一个由膜界定的隔室，容纳真核
    DNA。这个核赋予了真核细胞名称，意为“真正的核”。其他区别包括：


    质膜在功能上与原核细胞相似，但在结构上略有不同。细胞壁可能也可能不存在。


    真核 DNA 组织在一个或多个线性分子上，称为染色体，与组蛋白结合。所有的染色 DNA 都存储在细胞核中，被膜与细胞质隔离。一些真核细胞器（如线粒体）也含有某些
    DNA。真核生物可以使用纤毛或鞭毛运动。纤毛比原核生物的复杂。


    # 遗传物质


    存在两种遗传物质：脱氧核糖核酸（DNA）和核糖核酸（RNA）。大多数生物使用 DNA 进行长期信息存储，但某些病毒（如逆转录病毒）以 RNA 作为其遗传物质。生物包含的生物学信息编码在它的
    DNA 或 RNA 序列中。在将 DNA 作为自身遗传代码的生物中，RNA 用于信息传递（例如 mRNA）和酶功能（例如核糖体 RNA）。转运 RNA (tRNA)
    分子用于在翻译过程中添加氨基酸。


    人类细胞的遗传物质包含在细胞核中（核基因组）和线粒体中（线粒体基因组）。在人类中，核基因组分为 23 对对线性 DNA 分子，称为染色体。线粒体基因组是一个圆形
    DNA 分子，与核 DNA 不同。


    # 第一个细胞的起源


    细胞的起源与生命的起源有关，开启了地球生命的历史。关于早期地球上导致生命的小分子起源有几种理论。其中一种认为它们产生于深海热液口。另一种认为它们是在还原性大气中通过闪电合成的；尽管并不清楚地球是否曾有这样的大气。


    基本上没有实验数据能定义第一种自我复制的形式是什么。RNA 通常被认为是最早的自我复制分子，因为它能够储存遗传信息并催化化学反应（RNA 世界假说）。但某些其他具有自我复制潜力的实体可能在
    RNA 之前，例如粘土或肽核酸。细胞至少出现于 40 亿年前。目前的观点是，这些细胞是异养的。


    # 计算机细胞


    由心灵概念（Mind Concept）和物体身体（Object Body）组成，它还具有复制自身的能力。心灵可以像“虚拟机”一样运行程序。身体的定义部分将是心灵概念将要使用的“虚拟机”。身体还可以具有移动到新网络位置或处理器的能力。


    # 灵魂


    “在尝试建造此类机器时，我们不应不敬地劫夺祂创造灵魂的力量。”—— 阿兰·图灵（Alan Turing）


    机器的概念性灵魂用于内部对话，以便心灵概念能与自己进行交谈。


    灵魂还可以控制目标和情感，并提供喜好。


    灵魂——在某些精神、哲学和心理学传统中——是人或生物的非物质本质。绝对没有科学证明灵魂的存在——尽管许多哲学和精神体系认为人类有灵魂，而另一些则认为所有生物和无机都有灵魂。后者的观点被称为泛灵论。灵魂有时作为精神、心灵或自我的同义词。


    #词源


    现代英语单词 soul 源自古英语 sáwól、sáwel，最早出现在 8 世纪的史诗《贝奥武夫》2820 和《节灵诗篇》77.50，并与德语和波罗语中的相同概念同源，如哥特语
    saila、古高德语 sēla、古撒克逊 sola 以及立陶语 siciela。


    一种较新的建议将其与“绑定”的词根联系起来，日曼语 *sailian（OE séian, OHG seilen），与死亡时被“束缚”的概念有关，以及通过仪式束缚或限制尸体以防止其作为幽灵返回的习。


    这个词可能是早期传教士（特别是 4 世纪对哥特人的使徒乌尔菲拉）对一种本土耳曼概念的改写，该概念是希腊语 ψυχή ψὴ（生命、精神、意识）的翻译。


    希腊语词源于一个“卷、吹”的动词，在这里指的是生命呼吸，即人类和其他动物的生命原理，与“身体”的含义相反。在荷马作品中指死者的幽灵或精神，在更具哲学意义的情况下指死亡后留下的永恒非物质本质。拉丁语
    anima 被用作特伦斯的翻译。Psyché 出现在马太福音 10:28 的并列中：


    权威版钦士定译本 (KJV) “不要惧畏那杀死身体却不能杀死灵魂的人；倒要惧畏那能在地狱中同时毁灭灵魂和身体的神”


