    # Non-fragile Instance Variables


    Objective-C 2.0 provides non-fragile instance variables where supported by the
    runtime (i.e. when building 64-bit Mac OS code as all iOS code). Under the modern
    runtime, an extra layer of indirection is added to instance variable access, allowing
    the dynamic linker to adjust instance layout at runtime. This feature allows for
    two important improvements to Objective-C


