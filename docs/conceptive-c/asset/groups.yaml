    这些实验将许多相同意识的副本（串行或同时）暴露在不同的测试条件之下。


    在模拟世界中可以预期的有限物理资源是计算能力，以及模拟的速度和复杂性。在意识上传社会中，富裕或特权阶层可能在相同的现实时间内体验比他人更多的主观时间，或者可能能够运行自己或他人的多个副本，从而产生更多服务并变得更加富有。其他人则可能遭受计算资源匮乏，表现出慢动作行为。


    ## 复制 vs. 移动


    关于意识上传的另一个哲学命题是：上传的意识真的是“同一个”吗，还是仅仅是一个具有相同记忆和性格的精确副本；或者，实际上，这种副本与原始件之间究竟会有什么区别（参见“沼泽地人”思想实验）。如果原始件在过程中没有发生变化，这个问题就会变得格外复杂，因为它产生了一个明显的副本，该副本可能拥有与未受影响的原始意识独立的权利。


    大多数预测的大脑扫描技术（如大脑的序列连续切片）必然是破坏性的，原始大脑在脑脑扫描过程中无法存活。但如果它能保持完好，那么基于计算机的意识就是仍然存活的生物学人的副本。在这种情况下，复制意识可能像字面上将其移动到一个或多个副本中一样可行，因为这些技术通常涉及在某种计算机中模拟人类大脑，而数字文件作为计算机程序可以被精确地复制。人们通常认为，一旦这些版本暴露于不同的感官输入，它们的经历就会开始分化，但直到复制时刻为止的所有记忆将保持不变。


    由于可能创建出无限数量的原始人类初始副本，问题变得更加严重，因为这些副本将作为独立的个体同时运行。关于这种现象最简约的观点是：这两个（或多个）意识将共享他们过去的记忆，但从复制点开始，它们将仅仅是不同的意识（尽管合并过程使得这一变得变得复杂）。可能存在许多复杂的变体。


    取决于计算能力，与流过的物理时间相比，模拟的运行时间可能更快或更慢，导致模拟意识感知到物理世界正在以慢动作或快动作运行，而生物学的人则会分别看到模拟意识以快动作或慢动作运行。


    大脑模拟可以随时启动、暂停、备份并从保存的备份状态重新运行。在后一种情况下，模拟意识会忘记备份瞬间之后发生的一切，也许甚至连


    Gregory Paul & Earl D. Cox 编写的《超越人类：网络演化与未来心灵》一书讨论了计算机向感知生物的最终（在作者看来几乎不可避免的）演化，同时也涉及了人类意识的转移。Richard
    Doyle 的《湿件软件：后生命生存实验》从分布式具身化的角度深入探讨了上传问题，认为人类目前是“人工生命表型”的一部分。Doyle 的愿景反转了意识上传的极性，将人工生命形式作为上传者，寻求生物具身化作为其生殖策略的一部分。超人类主义和技术奇点的著名倡导者
    Raymond Kurzweil 曾建议，实现人类水平人工智能的最易路径可能在于“逆向工程化大脑”，他用这个词是指基于大脑的通用“工作原理”创建新的智能，但他有时也使用该术语指代基于高度详细扫描和模拟来上传个体意识的概念。例如，在他的著作《奇点临近》的第
    198–203 页讨论了这个问题。


    ## 机器人


    互联网机器人，也称为网络机器人、WWW 机器人或简单的 bots，是在互联网上运行自动化任务的软件应用程序。通常，机器人执行的任务既简单又具有结构上的重复性，其速度远高于人类单独完成的速度。机器人最大的用途是网络爬虫，自动化脚本以人类许多倍的速度从网络服务器获取、分析和归档信息。每个服务器都可以有一个名为
    `bots.txt` 的文件，其中包含了机器人遵守的该服务器爬虫规则。


    ## 聊天机器人


    聊天机器人（chatter bot、chatbot、chatterbot 或 chat bot）是一种旨在通过语音或文本方法与一个或多个人类用户模拟智能对话的计算机程序，主要用于闲聊。此类模拟的主要目标是欺骗用户认为他们正在与真人对话（即图灵测试）。扮演角角的程序有时被称为人工对话实体（Artificial
    Conversational Entities）、谈话机器人或话匣子。此外，聊天机器人通常被集成到对话系统中，用于各种目的，例如在线帮助、个性化服务或获取信息。某些聊天机器人使用复杂的自然语言处理系统，但也可能扫描输入中的关键词，并从文本数据库中提取具有最匹配关键词或最相似文字模式的回复。


    “ChatterBot”一词最初由 Michael Mauldin（第一个机器人 Verbot Julia 的创建者）于 1994 年提出，用于描述这些对话程序。


    1950 年，Alan Turing 发表了他的文章《计算机器与智能》，其中提出了现在被称为图灵测试的测试作为判断智能的标准。这一标准取决于计算机程序在与人类法官的实时文字对话中伪装成人类的能力，这种程度要足以让法官仅根据对话内容就无法可靠地区分程序和真实人类。


    ## ELIZA


    图灵所提测试的声名引起了 Joseph Weizenbaum 在 1966 年发布的程序 ELIZA 的极大兴趣，该程序似乎能够欺骗用户，让他们相信自己正在与真人对话。然而，Weizenbaum
    本身并没有声称 ELIZA 具有真正的智能，他在该程序的介绍中更多地将其视为一种揭露性的练习：在人工……机器被设计成以奇的方式运行，通常足以令最有经验的观察者目为观止。一旦某个特定的程序被揭穿，一旦其工作原理被解释，它的魔法就会崩塌；显现为一组程序……观察者心里想：“我也可以写出那种”。由于这个想法，他将问题程序从标记为“智能”的架子上移动到了留给奇珍异……的架子上。本文的目的是导致对程序的重新评估被“解释”。很少有程序需要。


    ELIZA 的核心运行方法（从那以后聊天机器人设计师一直在模仿）涉及识别输入中的代码词或短语，并输出相应的预备或预设响应，从而以一种看似有意义的方式推进对话（例如，对任何包含“母亲”一词的输入回复“多告诉我关于你的家庭的情况”）。理解的错觉被生成了，尽管涉及的处理仅仅是表面的。ELIZA
    表明产生这种错觉出奇地简单，因为人类法官太容易产生疑虑了。这里的关键技术（将一个程序描述为聊天机器人而非严肃的自然处理处理系统）是产生足够模糊且非特定的响应，使得这些响应在广泛的语境中被理解为“智能”。重点通常在于模糊性和清晰度，而不是传递真实信息。


    界面设计者已经意识到，人类解释计算机输出的意愿——即使这种输出实际上基于简单的模式匹配——也可以被利用。这使得聊天机器人风格的技术在需要编辑用户信息的交互系统中具有潜在的实用作用，只要这些信息相对直接并属于可预测的类别即可。因此，在线帮助系统可以采用聊天机器人技术来识别用户需要的帮助区域，可能比提供更“友好”的界面'
