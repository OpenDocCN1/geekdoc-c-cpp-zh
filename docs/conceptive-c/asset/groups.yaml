    features (classes, instances, etc.) in the 1970s.


    Largely because of its resource requirements with respect to early computing hardware,
    Lisp did not become popular outside of the AI community as Fortran and the ALGOL-descended
    C language. Newer languages such as Java and Python have incorporated some limited
    versions of some the features of Lisp, but are necessarily unable to bring the
    coherence and synergy of the full concepts found in Lisp. Because of its suitability
    to ill-defined, complex, and dynamic applications, Lisp is currently enjoying
    some resurgence of popular interest.


    # Symbolic expressions


    Lisp is an expression-oriented language. Unlike other languages, no distinction
    is made between "expressions" and "statements"; all code and data are written
    as expressions. When an expression is evaluated, it produces a value (in Common
    Lisp, possibly multiple values), which then can be embedded into other expressions.
    Each value can be any data type.


    McCarthy''s 1958 paper introduced two types of syntax: S-expressions (Symbolic
    expressions, also called "sexps”), which mirror the internal representation of
    code and data; and M-expressions (Meta Expressions), which express M-expressions
    never found favor, and almost all Lisps today use S-expressions to manipulate
    both code and data.


    The use of parentheses is Lisp''s most immediately obvious difference from other
    programming language families. As a result, students have long given Lisp nicknames
    like Lost In Stupid Parentheses, or Lots of Irritating Superfluous parentheses.
    However, the S-expression syntax is also responsible for much of Lisp''s power:
    the syntax is extremely regular, which facilitates manipulation by computer. However,
    the syntax of Lisp is not limited to traditional parentheses notation. It can
    be extended to include alternative notations. XMLisp, for instance, is a Common
    Lisp extension that employs the metaobjectprotocol to integrate S-expressions
    with the Extensible Markup Language (XML).'
