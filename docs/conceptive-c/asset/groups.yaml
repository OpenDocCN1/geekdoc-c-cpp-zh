  - '[PAGE 116]


    The hadis is as follows: "Verily the creation of every one of you is brought together
    in the mother''s womb as a drop of semen for forty days, then it becomes a clot
    for the same period, then it becomes a blob of flesh for the same period. Then
    the angel will be sent to blow into it a SPIRIT, and the angel is ordered (to
    carry out) with four instructions, to write down its livelihood, the span of life,
    its deeds, and whether it is wretched or fortunate." According to the Quran, Ruh
    (Soul) is a command from Allah (God).


    "They put questions to you concerning the Spirit. Say the Spirit is at my Lord''s
    command ...and of knowledge only a meagre part has been imparted to you." (Q''uran
    17:85)


    # Taoism


    According to Chinese traditions, every person has two types of soul hun and po,
    which are respectively yang and yin. Taoism believes in ten souls, sanhunqiao
    "three hun and seven po". The po is linked to the dead body and the grave, whereas
    the hun is linked to the ancestral tablet. A living being that loses any of them
    is said to have mental illness or unconsciousness, while a dead soul may reincarnate
    to a disability, lower desire realms or may even be to reincarnate. Also, Journeys
    to the Under-World said there be hundreds of divisible souls.


    # Zoroastrianism


    In theological reference to the soul, the terms "life" and "death" are viewed
    as emphatically more definitive than the common concepts of "biological life"
    and "biological death". Because the soul is said to be transcendent of the material
    existence, and is said to have (potentially) eternal life, the death of the soul
    is likewise said to be an eternal death. Thus, in the concept of divine judgment,
    God is commonly said to have options with regard to the dispensation of souls,
    ranging from Heaven (i.e. angels) to hell (i.e. demons), with various concepts
    in between. Typically both Heaven and hell are said to be eternal, or at least
    far beyond a typical human concept of lifespan and time.


    Some transhumans believe that it will become possible to perform mind transfer,
    either from one human body to another, or from a human body to a computer. Operations
    of this type (along with teleportation) raise philosophical questions related
    to the concept of the soul.


    # Spirituality and New Age


    In Helena Blavatsky''s Philosophy the soul is the field of our psychological activity
    (thinking, emotions, memory, desires, and so on) as well as the so-called paranormal
    or psychic phenomena (extrasensory perception, out-of-body experiences, etc.).
    However, the soul is not the highest, but a middle dimension of human beings.
    Higher than the soul is the spirit, which is considered to be the real self; the
    source of everything we call "good"—'
  - '[PAGE 117]


    happiness, wisdom, love, compassion, harmony, peace, etc. While the spirit is
    eternal and incorruptible, the soul is not. The soul acts as a link between the
    material body and the spiritual soul, and therefore shares characteristics of
    both. The soul can be attracted towards the spiritual or towards the material
    realm, being thus the "battlefield" of good and evil. It is only when the soul
    is attracted towards the spiritual and merges with the Self that it becomes eternal
    and divine.


    Rudolf Steiner differentiated three stages of soul development, which interpenetate
    one another in consciousness:


    an initial centering on sensations, drives, and passions, with strong conative
    (will) and emotional components, which he termed the "sentient soul"; a developing
    focus on internalizations and reflections on outer experience, with strong affective
    (feeling) and cognitive (thinking) components, which he the "intellectual" or
    mind soul; and a search for factors not dependent upon personal considerations,
    objective truths, which he termed the "consciousness soul".


    Some people, who do not necessarily favor organized religions, simply label themselves
    as "spiritual" and hold that both humans and other living creatures are souls.
    Some further believe the entire universe has a cosmic soul as spirit or unconscious
    consciousness. Such a conception of the soul may link with the idea of an existence
    before and after the present one, and one could consider such a soul as the spark,
    or the self, the "I" in existence that feels and lives life.


    In Shabd Yoga, the soul is considered to be an exact replica and spark of the
    Divine. The purpose of Surat Shabd Yoga is to realize one''s True Self as soul
    (Self-Realisation), True Essence (Spirit-Realisation) and True Divinity (God-Realisation)
    while living in the physical body.


    George Gurdjieff in his Fourth Way taught that nobody is ever born with a soul.
    Rather, an individual must create a soul[vague] during the course of their life.
    Without a soul, Gurdjieff taught that one will "die like a dog".


    Eckankar, founded by Paul Twitchchell in 1965, defines Soul as the true self;
    the, most sacred part of each person.


    The Indian spiritual teacher Meher Baba also held that the nature of the soul
    is divine:


    God is undeniably in everyone and everything. The apparent separateness is due
    to ignorance. A drop in the ocean is one with the ocean, and as soon as a bubble
    forms over it, it becomes separate from the ocean. And when the bubble bursts,
    the drop is again one with the ocean. In the same way the soul, when it is covered
    by the bubble of mind, energy and matter, becomes separate from God. But as soon
    as the bubble is burst, which is when the ego-self is annihilated through love
    for God, it finds that it is One with God.


    # Science'
  - '[PAGE 118]


    Science and medicine seek naturalistic accounts of the observable natural world.
    This stance is known as methodological naturalism.


    Much of the scientific study relating to the soul has involved investigating the
    soul as an object of human belief, or as a concept that shapes cognition and an
    understanding of the world, rather than an entity in and of itself.


    When modern scientists speak of the soul outside of this cultural and psychological
    context, they generally treat soul as a poetic synonym for mind. Francis Crick''s
    book, The Astonishing Hypothesis, for example, has the subtitle, "The scientific
    search for the soul." Crick held the position that one can learn everything about
    the human soul by studying the workings of the human brain. Depending on one''s
    belief regarding the relationship between the soul and the mind, then, Skeptic
    Robert T. Carroll suggests that the concept of a non-substantial substance is
    an oxymoron, and that the scholarship due by philosophers and psychologists based
    on the assumption of a non-physical entity has not further scientific understanding
    of the working of the mind.


    To extend the above hypothesis, one can argue that every kind of matter or energy
    exchange between a human biological system and its environment can be attributed
    to a series of complex physical and chemical transformations that occur inside
    the body and are largely controlled by the brain. Hence many phenotypic, genotypic,
    behavioral and emotional characteristics or states of a human can be identified
    as physio-chemical cause.


    For example, solar radiation carries electromagnetic energy that causes the accumulation
    of the pigment melanin in skin cells, which is perceived as tanning.


    Neurochemicals (most famously endorphins) are responsible for what can be described
    as feelings of feeling well, love and pain. Similarly, memory can be seen as an
    atomic reconstruction of an image in the brain at the expense of chemical energy
    taken in food.


    More social or long-term characteristics such as one''s beliefs may be regarded
    as a combination of chemical concentrations and molecular arrangements, organized
    in a kind of chemical recipe formulated over the course of years or millennia.
    An early precursor of this recipe is the primordial soul. Cruely put, the soul
    can be defined as chemical information exhibited on living matter.


    A strict line of causality facts to explain certain phenomenon within human experience
    such as free will, which have at times been attributed to the soul. (See also:
    Determinism and free will)


    In his book Consensus, E. O. Wilson noted that sociology has identified belief
    in a soul as one of the universal human cultural elements. Wilson suggested that
    biologists need to investigate how human genes predispose people to believe in
    a soul.'
- md: '

    Daniel Dennett has championed the idea that the human survival strategy depends
    heavily on adoption of the intentional stance, a behavioral strategy that predicts
    the actions of others (see theory of mind) on the expectation that they have a
    mind like one’s own. Mirror neurons in brain regions such as Broca’s area may
    facilitate this behavioral strategy. The intentional stance, Dennett suggests,
    has proven so successful that people tend to apply it to all aspects of human
    experience, thus leading to animism and to other conceptualizations of soul.


    The word-concept Soul has a secular and non-secular aspect. To integrate the two
    in a coherent statement, Soul would be defined as: The interaction of mind, body
    and spirit reflecting through conscience the appropriateness of individual or
    collective behavior. Through a connection to the Soul the mind apprehends abstractions
    implicit in spirit whether that be of transcendent derivation or temporal analysis.


    ## Understanding


    Understanding (also called intel) is a psychological process related to an abstract
    or physical object, such as a person, situation, or message whereby one is able
    to think about it and use concepts to deal adequately with that object. Understanding
    is a relation between the knower and an object of understanding. Understanding
    implies abilities and dispositions with respect to an object of knowledge sufficient
    to support intelligent behavior. Understanding is the limit of a conceptualization.
    To understand something is to have conceptualized it to a given measure.


    ## Is Understanding Definable?


    Yes, albeit with difficulty. The easiest way to define understanding is to do
    so in respect of specific relationships. For examples one can define the concept
    in the context of trust between two individuals.


    A good example is the definition proposed by a Doctoral researcher from the University
    of Cranfield UK. In his analysis of "understanding as an antecedents of trust
    in virtual organisations, Joel De Mess (2011) proposed the following explanation
    of understanding. "To understand someone is to possess enough information about
    the person or thing to be able to accurately explain their unique behaviors and
    characteristics, accommodate their differences, or display tolerance and compassion
    in one''s actions or judgement towards them on the basis of the insight that the
    information provides into their reality." He therefore defined understanding as
    "The successful sense-making or accurate synthesis of information relating to
    an entity (a person, an object, a concept, or a phenomenon) that permits a justified
    explanation of the characteristics, behaviors and events associated with the entity"


    In this definition, Mr De Mess emphasizes that true understanding is independent
    of the belief of the person who understands. It is an absolute function of the
    logic applied to observations and the accuracy of one''s interpretation of the
    facts that concern the entity. True understanding can only be achieved if the
    observer obtains and processes enough information about the entity under scrutiny
    to arrive at conclusions that will always remain true.


    One''s understanding of something only becomes equal to real understanding when
    the assertions about the thing are absolute and always true. If future improvements
    in our logics, formulas, reasoning etc... could invalidate one''s current explanation
    of a phenomenon, then the understanding that yielded the explanation does not
    qualify as true understanding, or better still, is only true as current knowledge
    permits.


    Hence, he argues, there are degrees of understanding as well as understanding
    at a point in time (a collective state of opinion) all of which ultimately seek
    to become true understanding.


    The conclusion of this definition is that our closeness to true understanding
    is only as good as the information we possess, the logic of analysis we apply
    to the information we have and the finality of our reference point.


    As this shows, it is difficult to define understanding. If we use the term concept
    as above, the question arises as to what is a concept? Is it an abstract thing?
    Is it a pattern or a rule? Whether definition is proposed, we can still ask it
    that we understand the thing that is featured in the definition: we can never
    satisfactorily define a concept, till we use it to explain understanding. It may
    be convenient to use an operational or behavioral definition, that is to say "somebody
    reacts appropriately to x understands x". For example, one understands Swahili
    if one correctly obeys commands in that language. This approach, however, may
    not provide an adequate definition. A computer can easily be programmed to react
    appropriately to commands, but there is a disagreement between whether or not
    the computer understands the language (see the Chinese room argument).


    According to the independent socionics researcher Rostislav Persion:


    In the cognitive model presented by MBTI, the concept of introverted thinking
    (Ti) is thought to represent understanding through cause and effect relationships
    or correlations. One can construct a model of a system by observing correlations
    between all the relevant properties (e.g. the output of a NAND gate relative to
    its inputs). This allows the person to generate truths about the system and then
    apply the model to demonstrate or her understanding. A mechanic may randomly,
    or algorithmically probe the inputs and outputs of a black box to understand the
    internal components through the use of induction. INTP, ISTP, ESTP, and ENTP all
    use Ti and are usually the best of the 16 types at understanding their environment
    in a bottom-up manner. These types may enjoy mechanics and digital electronics
    because of the 1 to 1 correlation between cause and effect relationships in these
    fields. Understanding is not limited to these types however other types demonstrate
    an identical process, although in other planes of reality; ie. Social, Theological
    and Aesthetic. A potential reason for the association of understanding with the
    former personality types is due to a social phenomenon for asymmetrical distribution
    of gratification. In the field of engineering, engineers probe or study the inputs
    and outputs of components to understand their functionality. These components
    are then combined based on their functionality (similar to computer programming)
    to create a larger, more complex system. This is why engineers attempt to subdivide
    ideas as deep as possible to obtain the lowest level of knowledge. This makes
    their models more detailed and flexible. It may be useful to know the formulas
    that govern an ideal gas, but to visualise the gas as made up of even smaller
    particles.


    One''s understanding of something only becomes equal to real understanding when
    the assertions about the thing are absolute and always true. If future improvements
