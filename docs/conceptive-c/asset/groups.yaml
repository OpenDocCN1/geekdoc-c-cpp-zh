  mdcn: '


    丹尼尔·丹尼特（Daniel Dennett）主张，人类的生存策略很大程度上取决于“意图立场”（intentional stance）的采用，这是一种基于预期他人拥有与自己相似的心来预测其行为的行为策略（参见心理理论）。罗卡区等脑区域的镜像神经元可能有助于这种行为策略。丹尼特认为，意图立场已被证明是非常成功的，以至于人们往往将其应用于人类经验的所有方面，从而导致了万物有灵和其他对灵魂的概念化。


    “灵魂”（Soul）这一概念具有世俗和非世俗两个方面。为了将两者整合进连贯的陈述中，灵魂被定义为：心灵、身体与精神的互动，通过良知反映个人或集体行为的恰当。通过与灵魂的连接，心灵理解精神中隐含的抽象，无论是源于超越的推演还是时间的分析。


    ## 理解


    理解（也称为 intel）是一个与抽象或物理对象（如人、情况或信息）相关的心理过程，通过这一过程，人们能够对其思考并使用概念恰当地处理该对象。理解是认知者与理解对象之间的关系。理解意味着相对于知识对象具有足够的支持智能行为的能力和倾向。理解是概念化的极限。理解某物意味着在给定程度上已对其进行了概念化。


    ## 理解是可定义的吗？


    是的，尽管有困难。定义理解最简单的方法是针对特定的关系进行定义。例如，可以在两个人之间信任的语境下定义这一概念。


    一个很好的例子是英国克兰里菲德大学（University of Cranfield）一位博士研究人员提出的定义。乔尔·德·梅斯（Joel De Mess,
    2011）在对“理解作为虚拟组织信任的前提”的分析中，对理解提出了以下解释：“理解某人意味着拥有关于该人或事的足够信息，能够准确地解释他们独特的行为和特征，包纳他们的差异，或者根据信息所对其现实提供的洞察，在对他们采取行动或判断时表现出宽容和仁心。”因此，他将理解定义为：“对与实体（人、物体、概念或现象）相关的信息的成功意义构建或准确合成，这使得对与实体相关的特征、行为和事件给出合理的解释。”


    在这个定义中，德梅斯先生强调，真正的理解独立于理解者的信念。它是应用于观察的逻辑以及对涉及实体的事实进行解释的准确性的绝对函数。只有当观察者获得并处理了关于受审查实体的足够信息，并得出永远正确的结论时，才能实现真正的理解。


    人们对某事的理解只有在关于该事的断言是绝对且永远真实的情况下，才等同于真正的理解。如果未来我们在逻辑、公式、推理等方面的改进使得人们目前对现象的解释失效，那么产生该解释的理解就不算作真正的理解，或者准确地说，它仅在当前知识允许范围内是真实的。


    因此，他认为，理解有程度之分，以及某一时刻理解（一种集体意见状态），这一切最终都追求成为真正的理解。


    该定义的结论是，我们与真实理解的接近程度仅取决于我们拥有的信息、我们应用于已有信息的分析逻辑以及我们参考点的终极性。


    如所示，定义理解是困难的。如果我们像上面那样使用“概念”一词，就会出现：什么是概念？它是一个抽象事物吗？它是一个模式或规则吗？无论提出了什么定义，我们仍然可以问自己是否理解了定义中描述的对象：在我们利用它来解释理解之前，我们永远无法满意地定义一个概念。使用操作性或行为性的定义可能是方便的，即“某人对
    x 做出恰当反应即理解 x”。例如，如果一个人正确遵守该语言的命令，他就理解斯瓦希语。然而，这种方法可能无法提供充分的定义。计算机很容易被程序应对命令做出恰当反应，但对于计算机是否理解语言存在争议（参见中文房间论证）。


    根据独立社会学研究者罗斯蒂斯拉夫·皮尔森（Rostislav Persion）：


    在 MBTI 提出的认知模型中，内倾思考（Ti）概念被认为通过因果关系或相关性代表理解。人们可以通过观察所有相关属性之间的相关性（例如 NAND 相对于输入的输出）来构建系统模型。这允许人们生成关于系统的真理，然后应用该模型来展示他们的理解。技师可能会随机或通过算法探测黑箱的输入和输出，通过归纳法理解内部组件。INTP、ISTP、ESTP
    和 ENTP 都使用 Ti，通常是 16 型人格中最擅长以自底上的方式理解环境的人。这些类型可能喜欢机械和数字电子，因为这些领域中因果关系存在 1 比 1
    的相关性。然而，理解不仅限于这些类型，其他类型也表现出相同的过程，尽管是在现实的其他平面上；即社会、神学和美学。理解与上述人格类型相关的一个潜在原因是由于一种满足感非对称分布的社会现象。在工程领域，工程师探测或研究组件的输入和输出以理解其功能。然后根据这些功能组合这些组件（类似于计算机编程），创建一个更大、更复杂的系统。这就是为什么工程师试图尽可能深入地拆分思想，以获得最低层次的知识。这使得他们的模型更加详细和灵活。了解支配理想气体的公式可能是很有用的，但将气体想象由更小的粒子组成可能更有帮助。


