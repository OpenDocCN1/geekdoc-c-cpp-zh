    In the most narrow sense, an idea is just whatever is before the mind when one
    thinks. Very often, ideas are constructed as representational images; i.e. images
    of some object. In other contexts, ideas are taken to be concepts, although abstract
    concepts do not necessarily appear as images. Many philosophers consider ideas
    to be a fundamental ontological category of being.


    The capacity to create and understand the meaning of ideas is considered to be
    an essential and defining feature of human beings. In a popular sense, an idea
    arises in a reflex, spontaneous manner, even without thinking or serious reflection,
    for example, when we talk about the idea of a person or a place.


    ## Innate and Adventitious Ideas


    One view on the nature of ideas is that there exist some ideas (called innate
    ideas) that are so general and abstract, that they could not have arisen as a
    representation of any object of our perception, but rather were, in some sense,
    always in the mind before we learn them. These are distinguished from adventitious
    ideas which are images or concepts which are accompanied by the judgment that
    they are caused by some object outside of the mind.


    Another view holds that we only discover ideas in the same way that we discover
    the real world, from personal experiences. The view that humans acquire all or
    most of their behavioral traits from nature (like experiences) is known as tabula
    rasa "blank slate". Most of the confusions in the way of ideas arise in part from
    the use of the term "idea" to cover both the representation percept and the object
    of conceptual thought. This can be illustrated in terms of the doctrines of innate
    idea, "concrete ideas versus abstract ideas", as well as "simple ideas versus
    complex ideas".


    Plato was one of the earliest philosophers to provide a detailed discussion of
    ideas. He considered the concept of idea in the realm of metaphysics and its implications
    for epistemology. He asserted that there is a realm of Forms or Ideas, which exist
    independently of anyone who may have thought of these ideas. Material things are
    then imperfect and transient reflections or instantiations of the perfect and
    unchanging ideas. From this follows that these Ideas are the principal reality
    (see also idealism). In contrast to the individual objects of sense experience,
    which undergo constant change and flux, Plato held that ideas are perfect, eternal,
    and immutable. Consequently, Plato considered that knowledge of material things
    is not really knowledge; real knowledge can only be made of unchanging ideas.


    ## René Descartes


    Descartes often wrote of the meaning of idea as an image or representation, often
    but not necessarily "in the mind", which was well known in the vernacular. Despite
    Descartes is usually credited with the invention of the non-Platonic use of the
    term, he at first followed this vernacular use. In his Meditations on First Philosophy
    he says, "Some of my thoughts are images of things, and it is to those alone that
    the name ''idea'' properly belongs." He sometimes maintained that ideas were innate
    and use of the term idea diverge from the original primary scholastic use. He
    provides multiple non-equivalent definitions of the term, uses it to refer to
    as many distinct kinds of entities, and divides ideas inconsistently into various
    generic categories.


    For him knowledge took the form of ideas and philosophical investigation is the
    deep consideration of these ideas. Many times however his view of knowledge and
    ideas were like those of Plotinus and the Neoplatonists. In Neoplatonism, the
    Intelligence (Nous) is the true first principle—the determine, referential "foundation"
    (arkhe)—of all exists; for it is not a self-sufficient entity like the One, but
    rather possesses the ability and capacity to contemplate the One, its prior, and
    as well as its own thoughts, which Plotinus identifies with the Platonic Ideas
    or Forms (eide). A non-philosophical definition of Nous is good sense (a.k.a.
    "common sense"). Descartes quotes saying, "Of all things good sense is the most
    distributed: everyone thinks he is so well supplied with it that even those who
    are the hardest to satisfy in every other respect never desire more of it than
    they already have."


    ## John Locke


    In striking contrast to Plato''s idea of that is of John Locke. In Introduction
    to An Essay Concerning Human Understanding, Locke defines idea as "that term I
    think, serves to stand for whatever is the object of the understanding when a
