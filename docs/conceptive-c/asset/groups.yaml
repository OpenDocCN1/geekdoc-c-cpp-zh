    ## Conceptual Content


    In cognitive linguistics, abstract concepts are transformations of concrete concepts
    derived from embodied experience. The mechanism of transformation is structural
    mapping, in which properties of two or more source domains are selectively mapped
    onto a blended space (Faucnier & Turner, 1995; see conceptual blending). A common
    class of blends are metaphors. This theory contrasts with the rationalist view
    that concepts are perceptions (or recollections, in Plato''s term) of an independently
    existing world of ideas, that it denies the existence of any such realm. It also
    contrasts with the empiricist view that concepts are abstract generalizations
    of individual experiences, because the contingent and bodily experience is preserved
    in a concept, and not abstracted away. While the perspective is compatible with
    Jamesian pragmatism (above), the notion of the transformation of embodied concepts
    through structural mapping makes a distinct contribution to the problem of concept
    formation.


    ## Concepts and Metaphilosophy


    A long and well-established tradition philosophy posits that philosophy itself
    is nothing more than conceptual analysis. This view has its proponents in contemporary
    literature as well as historical. According to Deleuze and Guattarian''s What
    Is Philosophy? (1991), philosophy is the activity of creating concepts. This creative
    activity differs from previous definitions of philosophy by simple reasoning,
    communication or contemplation of universals. Concepts are specific to philosophy:
    science "functions", and art "sensations". A concept is always thus: Descartes
    Cogito or Kant''s "transcendental". It is a singularity, not universal, and connects
    itself with other concepts, on a "plane of immanence" traced by a particular philosophy.
    Concepts can jump from one plane of immanence to another, combining with other
    concepts and therefore engaging in a "becoming-Other."


    ## Concepts in Epistemology


    Concepts are vital to the development of scientific knowledge. For example, it
    would be difficult to imagine physics without concepts like: energy, force, or
    acceleration. Concepts help to integrate unrelated observations and phenomena
    into the basic ingredients of science. The concept map is a tool that is used
    to help researchers visualize the inter-relationships between various concepts.


    ## Ontology of Concepts


    Although the mainstream literature in cognitive science regards the concept as
    a kind of mental particular, it has been suggested by some theorists that concepts
    are real. In most radical form, the realist about concepts attempts that the supposedly
    mental processes are not mental at all; rather, they are abstract entities, which
    are just as real as any mundane object.


    Plato was the starkest proponent of the realist thesis of universal concepts.
    By his view, concepts (and ideas in general) are innate ideas that were instantiations
    of a transcendent world of forms that lay behind the veil of the physical world.
    In this way, universals were explained as transcendent objects. Needless to say
    this form of realism was tied deeply with Plato''s ontological projects. For example,
    the view that non non Platonic objects was revived by Kurt Gödel as a result of
    certain puzzles that he took to arise from the phenomenological accounts.


    Gottlob Frege, founder of the analytic tradition in philosophy, famously argued
    for the analysis of an expression in language in terms of sense and reference.
    For him, the sense of an expression describes a certain state of affairs in the
    world, namely the way that some object is presented. Since many commentators view
    the notion of sense as identical to the notion of concept, and Frege regards senses
    as the linguistic representations of states of affairs in the world, it seems
    to follow that we may understand concepts in the manner in which we grasp the
    world. Accordingly, concepts (as senses) have an ontological status.


