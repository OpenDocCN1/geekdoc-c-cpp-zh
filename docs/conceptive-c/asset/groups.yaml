  - '[PAGE 113]


    being that is reborn neither entirely different than, nor exactly the same as,
    the being that died.


    However, the new being is continuous with the being that died — in the same way
    that the "you" of this moment is continuous with the "you" of a moment before,
    despite the fact that you are constantly changing.


    Buddhist teaching holds that a notion of a permanent, abiding self is a delusion
    that is one of the causes of human conflict on the emotional, social, and political
    levels.


    They add that an understanding of anatta provides an accurate description of the
    human condition, and that this understanding allows us to pacify our mundane desires.


    Various schools of Buddhism have differing ideas about what continues after death.
    The Yogacara school in Mahayana Buddhism say there Store consciousness which continue
    to exist after death. In some schools, particularly Tibetan Buddhism, the view
    is that there are three minds: very subtle mind, which does not disintegrate in
    death and is "dreaming mind" or "unconscious mind"; and gross mind, which is less
    permanent than subtle mind, which does not exist in death. Very subtle, however,
    does continue, and when it "catches on", or coincides with phenomena, again, a
    new subtle mind emerges, with its own personality/assumptions/habits, and that
    entity experiences karma in the current continuum.


    Certain modern Buddhists, particularly in Western countries, reject—or at least
    take an agnostic stance toward—the concept of rebirth or reincarnation, which
    they view as incompatible with the concept of anatta. Stephen Batchelor discusses
    this issue in his book, Buddhism Without Beliefs. Others point to research that
    has been conducted at the University of Virginia as proof that some people are
    reborn.


    # Judaism


    The Hebrew terms nephesh, ruach (literally "wind"), and neshame (literally "breath")
    are used to describe the soul or spirit. The soul is believed to be given by God
    to a person by his/her first breath, as mentioned in Genesis, "And the Lord formed
    man [of] the dust of the ground, and breathed into his nostrils the breath of
    life; and man became a living soul." From this statement, the rabbinical interpretation
    is often that that human embryos do not have souls, the orthodox often oppose
    opposition as a form of birth control. Judaism relates the quality of one''s soul
    to its performance of mitzvot and reaching higher levels of understanding, and
    thus closeness to God. A person with such closeness is a tzadik. Judaism also
    has a concept of purity of body and soul, which requires avoidance of "unclean"
    things. Practices mentioned in the Torah include the keeping of kashrut and daily
    bathing (tevilah) in a mikveh. In biblical times, it was believed that'
  - '[PAGE 114]


    "impurity was something that could be spread by touching, and unclean people were
    temporarily separated from the group. Though Jewish theology does not agree on
    the nature of an afterlife, the soul is said to "return to God" after death.


    Kabbalah and other mystic traditions go into greater detail into the nature of
    the soul. Kabbalah separates the soul into three elements: the nepesh is related
    to instinct, the ruach is related to morality, and the neshamah is related to
    intellect and the awareness of God. Kabbalah furthermore proposed a concept of
    reincarnation, the gilgul.


    # Christianity


    Soul carried to Heaven by William Bouaguere


    The Christian view of the soul is based upon the teaching of both the Old Testament
    and New Testament. The Old Testament contains the statements "Then shall the dust
    return to the earth as it was; and the spirit shall return unto God gave it" (Ecclesiastes
    12:7) and "And the LORD formed man [of] the dust of the ground, and breathed into
    his nostrils the breath of life; and man became a living soul." (Genesis 2:7).
    In the New Testament can be found a statement by Paul the Apostle, "And so it
    is written, the first Adam made a living soul; the last Adam [made was] a quickening
    spirit." (1 Corinthians 15:45).


    Most Christians understand the soul as an ontological reality distinct from, yet
    integrally connected with, the body. Its characteristics are described in moral,
    spiritual, and philosophical terms. When people die, their souls will be judged
    by God and determined to spend an eternity in heaven or hell. Though all branches
    of Christianity—Catholics, Eastern Orthodox and Oriental Orthodox, Evangelical
    or Protestant—teach Jesus Christ plays a decisive role in the salvation process,
    the specifics of that role and the part played by individuals persons or ecclesiastical
    rituals and relationships, is a matter of wide diversity in official church teaching,
    theological speculation and popular practice. Some Christians believe that if
    one has not repented of one''s sins and trusted in Jesus Christ as Lord and Savior,
    one will go to hell and suffer eternal separation from God. Variations also exist
    on this, e.g. some hold that the righteous soul will be destroyed instead of suffering
    eternally (Annihilation). Believers will inherit life in heaven and enjoy eternal
    fellowship with God. There is also a belief that babies (including the unborn)
    and those with cognitive or mental impairments who have died will be received
    into heaven on the basis of God''s grace through the sacrifice of Jesus.


    # Roman Catholic Beliefs


    Among Christians, there is uncertainty regarding whether human embryos have souls,
    and at what point between birth and the fetus acquires a soul and consciousness.
    This uncertainty is the general reasoning behind many Christians'' belief that
    abortion should not be legal.'
  - '[PAGE 115]


    The present Catechism of the Catholic Church defines the soul as "the innermost
    aspect of humans, that is of greatest value in them, by which they are most especially
    in God''s image: ''soul'' signifies the spiritual principle in man." All souls
    living and dead will be Judged by Jesus Christ when he comes back to earth.


    The souls of those who die unrepentant of sins, or rejection of God, will at judgment
    day be forever in a state called Hell. The Catholic Church teaches that the existence
    of every individual soul is dependent wholly upon God: " doctrine of the faith
    affirms that the spiritual and immortal soul is created immediately by God"


    # Hinduism


    In Hinduism, the Sanskrit word most closely corresponding to soul are "Jeeva",
    "Atman" and "Purusha", meaning the individual Self. The term "soul" is misleading
    as it implies an object possessed, whereas Self signifies the subject which perceives
    all objects. This self held to be distinct from the various mental faculties such
    as desires, thinking, understanding, reasoning and self-image (ego), all of which
    are considered part of Prakriti (nature).


    In Bhagavad - Gita 2.20 Lord Krishna describes the soul in the following way:

    "For the soul there is neither birth nor death at any time. He has not come into
    being, does not come into being, and will not come into being. He is unborn, eternal,
    ever - primeval. He is not slain when the body is slain."


    Srila Prabhupada, a great Vaishnava saint of the modern time further explains:

    The soul does not take birth, and the soul does not die...And the soul has no
    birth, he therefore has no past, present or future. He is eternal, ever-existing
    and primeval - that is, there is no trace in history of his coming into being.


    Since the quality of Atman is primarily consciousness, all sentient and insistent
    beings are pervaded by Atman, including plants, animals, humans and gods. The
    difference between them is the contracted or expanded state of that consciousness.
    For example, animals and humans share in common the desire to live, fear of death,
    desire to protect and to protect their families and territory and the need for
    sleep, but animals'' consciousness is more contracted and has less possibility
    to expand than human consciousness.


    When the Atman embodied it is called birth, when the Atman leaves a body is called
    death. The Atman transmigrates from one body to another based on karmic [performed
    deeds] reactions.


    # Islam


    There is a hadith reported by Abd Allah ibn Mas''ud, in which it is stated that
    the soul is put into the human embryo forty days after fertilization takes place.
    This version of hadith is supported by some other hadiths narrated by Sahih-Bukhari
    and Sahih Al Muslim.'
- md: '

    The hadis is as follows: "Verily the creation of every one of you is brought together
    in the mother''s womb as a drop of semen for forty days, then it becomes a clot
    for the same period, then it becomes a blob of flesh for the same period. Then
    the angel will be sent to blow into it a SPIRIT, and the angel is ordered (to
    carry out) with four instructions, to write down its livelihood, the span of life,
    its deeds, and whether it is wretched or fortunate." According to the Quran, Ruh
    (Soul) is a command from Allah (God).


    "They put questions to you concerning the Spirit. Say the Spirit is at my Lord''s
    command ...and of knowledge only a meagre part has been imparted to you." (Q''uran
    17:85)


    # Taoism


    According to Chinese traditions, every person has two types of soul hun and po,
    which are respectively yang and yin. Taoism believes in ten souls, sanhunqiao
    "three hun and seven po". The po is linked to the dead body and the grave, whereas
    the hun is linked to the ancestral tablet. A living being that loses any of them
    is said to have mental illness or unconsciousness, while a dead soul may reincarnate
    to a disability, lower desire realms or may even be reincarnate. Also, Journeys
    to the Under-World said there be hundreds of divisible souls.


    # Zoroastrianism


    In theological reference to the soul, the terms "life" and "death" are viewed
    as emphatically more definitive than the common concepts of "biological life"
    and "biological death". Because the soul is said to be transcendent of the material
    existence, and is said to have (potentially) eternal life, the death of the soul
    is likewise said to be an eternal death. Thus, in the concept of divine judgment,
    God is commonly said to have options with regard to the dispensation of souls,
    ranging from Heaven (i.e. angels) to hell (i.e. demons), with various concepts
    in between. Typically both Heaven and hell are said to be eternal, or at least
    far beyond a typical human concept of lifespan and time.


    Some transhumans believe that it will become possible to perform mind transfer,
    either from one human body to another, or from a human body to a computer. Operations
    of this type (along with teleportation) raise philosophical questions related
    to the concept of the soul.


    # Spirituality and New Age


    In Helena Blavatsky''s Philosophy the soul is the field of our psychological activity
    (thinking, emotions, memory, desires, and so on) as well as the so-called paranormal
    or psychic phenomena (extrasensory perception, out-of-body experiences, etc.).
    However, the soul is not the highest, but a middle dimension of human beings.
    Higher than the soul is the spirit, which is considered to be the real self; the
    source of everything we call "good"—happiness, wisdom, love, compassion, harmony,
    peace, etc. While the spirit is eternal and incorruptible, the soul is not. The
    soul acts as a link between the material body and the spiritual soul, and therefore
    shares characteristics of both. The soul can be attracted towards the spiritual
    or towards the material realm, being thus the "battlefield" of good and evil.
    It is only when the soul is attracted towards the spiritual and merges with the
    Self that it becomes eternal and divine.


    Rudolf Steiner differentiated three stages of soul development, which interpenetrate
    one another in consciousness:


    - an initial centering on sensations, drives, and passions, with strong conative
    (will) and emotional components, which he termed the "sentient soul";

    - a developing focus on internalizations and reflections on outer experience,
    with strong affective (feeling) and cognitive (thinking) components, which he
    termed the "intellectual" or mind soul;

    - a search for factors not dependent upon personal considerations, objective truths,
    which he termed the "consciousness soul".


    Some people, who do not necessarily favor organized religions, simply label themselves
    as "spiritual" and hold that both humans and other living creatures are souls.
    Some further believe the entire universe has a cosmic soul as spirit or unconscious
    consciousness. Such a conception of the soul may link with the idea of an existence
    before and after the present one, and one could consider such a soul as the spark,
    or the self, the "I" in existence that feels and lives life.


    In Shabd Yoga, the soul is considered to be an exact replica and spark of the
    Divine. The purpose of Surat Shabd Yoga is to realize one''s True Self as soul
    (Self-Realisation), True Essence (Spirit-Realisation) and True Divinity (God-Realisation)
    while living in the physical body.


    George Gurdjieff in his Fourth Way taught that nobody is ever born with a soul.
    Rather, an individual must create a soul during the course of their life. Without
    a soul, Gurdjieff taught that one will "die like a dog".


    Eckankar, founded by Paul Twitchchell in 1965, defines Soul as the true self;
    the most sacred part of each person.


    The Indian spiritual teacher Meher Baba also held that the nature of the soul
    is divine:


    God is undeniably in everyone and everything. The apparent separateness is due
    to ignorance. A drop in the ocean is one with the ocean, and as soon as a bubble
    forms over it, it becomes separate from the ocean. And when the bubble bursts,
    the drop is again one with the ocean. In the same way the soul, when it is covered
    by the bubble of mind, energy and matter, becomes separate from God. But as soon
    as the bubble is burst, which is when the ego-self is annihilated through love
    for God, it finds that it is One with God.


    # Science


    Science and medicine seek naturalistic accounts of the observable natural world.
    This stance is known as methodological naturalism.


    Much of the scientific study relating to the soul has involved investigating the
    soul as an object of human belief, or as a concept that shapes cognition and an
    understanding of the world, rather than an entity in and of itself.


    When modern scientists speak of the soul outside of this cultural and psychological
    context, they generally treat soul as a poetic synonym for mind. Francis Crick''s
    book, *The Astonishing Hypothesis*, for example, has the subtitle, "The scientific
    search for the soul." Crick held the position that one can learn everything about
    the human soul by studying the workings of the human brain. Depending on one''s
    belief regarding the relationship between the soul and the mind, then, Skeptic
    Robert T. Carroll suggests that the concept of a non-substantial substance is
    an oxymoron, and that the scholarship due by philosophers and psychologists based
    on the assumption of a non-physical entity has not further scientific understanding
    of the working of the mind.


    To extend the above hypothesis, one can argue that every kind of matter or energy
    exchange between a human biological system and its environment can be attributed
    to a series of complex physical and chemical transformations that occur inside
    the body and are largely controlled by the brain. Hence many phenotypic, genotypic,
    behavioral and emotional characteristics or states of a human can be identified
    as physio-chemical cause.


    For example, solar radiation carries electromagnetic energy that causes the accumulation
    of the pigment melanin in skin cells, which is perceived as tanning.


    Neurochemicals (most famously endorphins) are responsible for what can be described
    as feelings of feeling well, love and pain. Similarly, memory can be seen as an
    atomic reconstruction of an image in the brain at the expense of chemical energy
    taken in food.


    More social or long-term characteristics such as one''s beliefs may be regarded
    as a combination of chemical concentrations and molecular arrangements, organized
    in a kind of chemical recipe formulated over the course of years or millennia.
    An early precursor of this recipe is the primordial soul. Cruely put, the soul
    can be defined as chemical information exhibited on living matter.


    A strict line of causality facts to explain certain phenomenon within human experience
    such as free will, which have at times been attributed to the soul. (See also:
    Determinism and free will)


    In his book *Consensus*, E. O. Wilson noted that sociology has identified belief
    in a soul as one of the universal human cultural elements. Wilson suggested that
    biologists need to investigate how human genes predispose people to believe in
    a soul.

