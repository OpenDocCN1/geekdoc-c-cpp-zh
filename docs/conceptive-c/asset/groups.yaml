    ## Strong AI as Functionalism


    In more recent presentations of the Chinese room argument, Searle has identified
    "strong AI" as "computer functionalism" (a term he attributes to Daniel Dennett).
    Functionalism is a position in modern philosophy of mind that holds we can define
    mental phenomena (as beliefs, desires, and perceptions) by describing their functions
    in relation to each other and to the outside world. Because a computer program
    can accurately represent functional relationships as relationships between symbols,
    a computer can have mental phenomena if it runs the right program, according to
    functionalism.


    Stevan Harnad argues that Searle''s depictions of strong AI can be reformulated
    as "recognizable tenets of computationalism" (a position unlike ''strong AI'')
    that is actually held by many thinkers, and one worth refuting.


    Computationalism is the position in the philosophy of mind which argues that the
    mind can be accurately described as an information-processing system.


    Each of the following, according to Harnad, is a "tenet" of computationalism:


    - Mental states are implementation-independent — which is why computers can have
    mental states and help to explain the mind;

    - Computational states are implementation-independent — in other words, it is
    the software that determines the computational state, not the hardware (which
    is why the brain, being hardware, is irrelevant); and

    - Since implementation is unimportant, the only empirical data that matters is
    how the system functions; here the Turing test is definitive.


    ## Computers vs. Machines vs. Brains


    The Chinese room has exactly the same design as any modern computer. It has a
    Von Neumann architecture, which consists of a program (the book of instructions),
    some memory (the pages and file cabinets), a CPU which follows the instructions
    (the man), and a means to write symbols in memory (the pencil and eraser). A machine
    with this design is known in computer science as "Turing complete", because it
    has the necessary machinery to carry out any computation that a Turing machine
    can do, and therefore it is capable of doing a step-by-step execution of any other
    digital machine. Alan Turing says, "all digital computers are in a sense equivalent."
    In other words, the Chinese room can do whatever any other computer can do (albeit
    much, much more slowly). The widely accepted Church-Turing thesis holds that anything
    computable is computable by any Turing complete machine.


    The Chinese room (and all modern computers) manipulates physical objects in order
    to carry out calculations and do simulations. AI researchers Allen Newell and
    Herbert Simon called this kind of machine a physical symbol system. It is also
    equivalent to the formal systems used in the field of mathematical logic. Searle
    emphasizes the fact that this kind of symbol manipulation is syntactic (borrowing
    a term from the study of grammar). The CPU manipulates the symbols using a form
    of syntax rules, without any knowledge of the symbol''s semantics (that is, their
    meaning).


    ## Intentionality vs. Consciousness


    Searle''s original argument centered on ''understanding''—that is, mental states
    with what philosophers called ''intentionality''—and did directly address other
    closely related ideas as ''consciousness''. David Chalmers argued that "it is
    fairly clear that consciousness is at the root of the matter". In recent presentations
    of the Chinese Room, Searle has included ''consciousness'' as part of the argument
    as well.


    ## Strong AI vs. AI research


    Searle''s argument does not limit the intelligence with which machines can behave
    or act; it does not address this issue directly. "The Chinese room argument...
    assumes complete success on the part of artificial intelligence in simulating
    human cognition," Searle writes. This opens the possibility that a machine could
    be built that acts more intelligent than a person, but does not have a mind or
    intentionality in the same way that brains do.


    Searle''s "strong AI" should not be confused with "strong AI" as defined by Ray
    Kurzweil and other futurists who use the term to describe machine intelligence
    that rivals or exceeds human intelligence. Kurzweil is concerned primarily with
    the amount of intelligence displayed by the machine, whereas Searle''s argument
    sets no limit on this, as long as it is understood that it is a simulation not
    the real thing.


    ## System Reply


    These replies attempt to answer the question: since the man in the room doesn''t
    speak Chinese, where is the "mind" that does? These replies address the key ontological
    issues of mind vs. body and simulation versus reality. All of the replies identify
    the mind in the room versions of "the system reply".


    The basic "system reply" argues that it is the "whole system" which understands
    Chinese. While the man understands only English, when he is combined with the
    program, scratch paper, pencils and file cabinets, they form a system that can
    understand Chinese. "Here, understanding is not being ascribed to the more ideal;
    rather it is being ascribed to this whole system of which he is a part" Searle
    explains. The fact that man does not understand Chinese is irrelevant, because
    it is only the system as a whole which matters.


    Searle notes that (in this simple version of the systems reply) there is nothing
    more than a list of physical objects; it grants the power of understanding and
    consciousness to the "conjunction of that person and bits of paper". Searle responds
    by simplifying the list of physical objects: he asks what happens when the man
    memorizes the rules and keeps track of everything in his head? Then the system
    consists of just one object: the man himself. Searle argues that if the man doesn''t
    understand Chinese then the system doesn''t understand Chinese either and the
    fact that man appears to understand Chinese proves nothing. Critics of Searle
    argue that the program has allowed the man to have two minds in one head.


    More sophisticated versions of the system reply try to identify more precisely
    what the "system" is and they differ in exactly how they describe it. According
    to these replies, the "mind that speaks Chinese" could be such things: the "software",
    a "program", a "running program", a simulation of the neural relations of consciousness,
    the "functional system", a "simulated mind", an "emergent property", or a "virtual
    mind". Marvin Minsky''s version of the system reply, described below.


    ## Virtual Mind Reply


    The term "virtual" is used in computer science to describe an object that appears
    to exist "in" a computer (or computer network) only because software is making
    it to appear. The objects "inside" computers (including files, folders, and so
    on) are all "virtual", except for the computer''s electronic components. Similarly,
    Minsky argues, a computer may contain a "mind" that is virtual in the same sense
    as virtual machines, virtual communities and virtual reality.


    To clarify the distinction between the simple systems reply given above and virtual
    mind reply, David Cole notes that two simulations could be running on one system
    at the same time; one speaking Chinese and one Korean. While there is only one
    system, there can be "virtual minds". Searle responds that such a mind is, at
    best, a simulation and writes: "No one suggests that computer simulations of five-alarm
    fire will burn the neighborhood down or a computer simulation of rainstorm will
    leave us all drenched."


    Nicholas Fearn responds that, for some things, simulation is as good as the real
    thing. When we call up the calculator function on a desktop computer, the image
    of a calculator appears on the screen. We do complain that ''isn''t really a calculator,''
    because the physical attributes of the device do not matter. The question is,
    is the human mind like the calculator, essentially composed of information? Or
    is it other than a computer, and not realizable in full by computer simulation?
    (The issue of simulation is also discussed in the article synthetic intelligence.)


    These replies provide an explanation of why the man in the room understands Chinese.
    If there is something besides the room that understands Chinese, Searle can''t
    argue (1) the man doesn''t understand Chinese, therefore (2) nothing in the room
    understands Chinese. According to those who make this reply, this shows that Searle''s
    argument fails to prove "strong AI" is false.


    However, the replies, by themselves, do not prove that strong AI is true, either:
    they provide no evidence that the system (or the virtual mind) understands Chinese,
    other than the hypothetical premise that it passes the Turing Test. Searle writes
    "the systems simply begs the question by insisting that the system understands
    Chinese."


    ## Finding the Meaning


    As far as the person in the room is concerned, the symbols are just meaningless
    "squiggles". But if the Chinese room "stands" what it''s saying, the symbols must
    get their meaning from somewhere. These arguments attempt to connect the symbols
    to the things they symbolize. These replies address Searle''s concerns about intentionality,
    symbol grounding and syntax vs.


    ## Robot Reply


    Suppose that instead of a room, the program was placed into a robot that could
    wander around and interact with its environment. This would allow a "causal connection"
    between the symbols and the things they represent. Hans Moraveck comments: "If
    we could graft a robot to a reasoning program, we wouldn''t need a person to provide
    the meaning anymore: it would come from the physical world."


    Searle''s reply is to suppose that, unbeknownst to the individual in the Chinese
    room, some of the inputs came directly from a camera mounted on a robot...

