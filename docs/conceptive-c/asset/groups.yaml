    # G.F. Stout and J.M. Baldwin


    G.F. Stout and J.M. Baldwin, in the Dictionary of Philosophy and Psychology, define
    idea as "the reproduction with more or less adequate image, of an object not actually
    present to the senses." They point out that an idea and a perception are caused
    by various authorities contrasted in various ways. "Difference in degree of intensity",
    "comparative absence of bodily movement on the part of the subject", "comparative
    dependence on mental activity", are suggested by psychologists as characteristic
    of an idea as compared with a perception.


    It should be observed that an idea, in the narrower and generally accepted sense
    of a mental reproduction, is frequently complex. That is, as in the example given
    above of the chair, a great many objects, differing in detail, all call a single
    idea. When a man, for example, has obtained an idea of chairs in general by comparison
    with which he can say "This is a chair, that is a stool", he has what is known
    as "abstract idea distinct from the reproduction in any particular chair (see
    abstraction). Furthermore a complex idea may not have any corresponding physical
    object, though its particular elements may severally be the reproductions of actual
    perceptions. Thus the idea of a centaur is a complex mental picture composed of
    the ideas of man and horse, that of a mermaid of a woman and a fish.


    # Anthropology and the Social Sciences


    Diffusion studies explore the spread of ideas from culture to culture. Some anthropological
    theories hold that all cultures imitate ideas from one or a few original cultures,
    the Adam of the Bible or several cultural circles that overlap. Evolutionary diffusion
    theory holds that cultures are influenced by one another, but that similar ideas
    can be developed in isolation.


    In mid-20th century, social scientists began to study how and why ideas spread
    from one person to another. Everett Rogers pioneered diffusion of innovations
    studies, using research to prove factors in adoption and profiles of adopters
    of ideas. In 1976, in his book The Selfish Gene, Richard Dawkins suggested applying
    evolutionary theories to the spread of ideas. He coined the term meme to define
    an abstract unit of selection, equivalent to the gene in evolutionary biology.


