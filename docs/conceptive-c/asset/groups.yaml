    Gregory Chaitin, a noted computer scientist, proposes a view that comprehension
    is a kind of data compression. In his essay "The Limits of Reason", he argues
    that understanding something means being to figure out a simple set of rules that
    explains it. For example, we understand why day and night exist because we have
    a simple model—the rotation of the earth—explains a tremendous amount of data—changes
    in brightness, temperature, and atmospheric composition of the earth. We have
    compressed a large amount of information using a simple model that predicts it.
    Similarly, we understand the number 0.33333... by thinking of it as one-third.
    The first way of representing the number requires an infinite amount of memory;
    but the second way can produce all the data of the first representation, but uses
    less information. Chaitin argues that comprehension is this ability to compress
    data.


    # Understanding Basic English


    To Concept C, I have decided to write a Basic English Bot that understands basic
    English enough to have a simple conversation with.


    We need a parser that takes input from a Terminal Portal. Parses the Words and
    Sentences, then uses rules to answer the question that is asked and sends the
    output back to the Terminal Portal.


    We need to build a Dictionary with all of the Basic English 850 Words in it. Basic
    English (British American Scientific International Commercial) is a constructed
    (made-up) language to explain complex thoughts with 850 basic English words chosen
    by Charles Kay Ogden.


    # Rules of word use


    The word use of Basic English is much simpler and more regular than the word used
    of full English. Not all the meanings of each word are allowed.


    Ogden''s rules of grammar for Basic English help people use the 850 words to talk
    about things and events normally.


    - -s / -es / -ies change singular nouns into plural nouns.

    - -ing / -er change verbs into adjectives.

    - -ing change verbs into nouns.

    - -ly change adjectives into adverbs.

    - -er / -est or more / most describe amounts.

    - un- change the meanings of adjectives into their opposites.


    The opposite word order with do makes questions.


    Operators and pronouns conjugate as in normal English.


    Make combined words (compounds) from two nouns for example "milkman" or a noun
    and a direction (sundown).


    Measures, numbers, money, days, months, years, clock time, and international words
    are in English forms. E.g. Date/Time: 20 May 1972 at 21:00


    Use the words of an industry or science. For example, in this grammar, some special
    words are for teaching languages, and not part of Basic English: plural, conjugate,
    noun, adjective, adverb, qualifier, orator, pronoun, and directive.


