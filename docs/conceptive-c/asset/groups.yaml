    # Biological Function and Evolution


    Regarding the primary function of conscious processing, a recurring idea in recent
    theories is phenomenal states somehow integrate neural activities and information-processing
    that would otherwise be independent. This has been called the integration consensus.
    However, it remains unspecified which kinds of information are integrated in a
    conscious manner and which kinds can be integrated without consciousness. Nor
    is it explained what specific causal conscious integration plays, nor why the
    same functionality cannot be achieved without consciousness. Obviously not any
    kinds of information are capable of being disseminated consciously (e.g., neural
    activity related to vegetative functions, reflexes, unconscious motor programs,
    low-level perceptual analyses, etc.) and many kinds of information can be disseminated
    and combined with other kinds without consciousness, as in intersensory interactions
    such as the ventrilquism effect. Hence it remains unclear why any of it is conscious.


    As noted earlier, among writers who consider consciousness to be a well-defined
    thing, there is widespread dispute about which animals other than humans are said
    to possess it. Thus, any examination of the evolution of consciousness is faced
    with great difficulties. Nevertheless, some writers have argued that consciousness
    can be viewed from the standpoint of evolutionary biology as an adaptation in
    the sense of a trait that increases fitness. In his paper "Evolution of consciousness,"
    John Eccles argued that anatomical and physical properties of the mammalian cerebral
    cortex give rise to consciousness. Bernard Bears proposed that once in place,
    this "recursive" circuitry may have provided a basis for the subsequent development
    of many of the functions that consciousness facilitates in higher organisms.


    Other philosophers, however, have suggested that consciousness would not be necessary
    for any functional advantage in evolutionary processes. No one has given a causal
    explanation, of why it would not be possible for a functionally equivalent non-consciousness
    (i.e., a philosophical zombie) to achieve the very same survival advantages as
    a conscious organism. Evolutionary processes are blind to the difference between
    function F being performed by conscious organism O and non-conscious organism
    O*, it is unclear what adaptive advantage consciousness could provide.


    # States of Consciousness


    There are some states in which consciousness seems to be abolished, including
    sleep, coma, and death. There are also a variety of circumstances that can change
    the relationship between the mind and the world in less drastic ways, producing
    what are known as altered states of consciousness. Some altered states occur naturally;
    others can be produced by drugs or brain damage.


    The most widely accepted altered states are sleep and dreaming. Although dream
    sleep and non-dream sleep appear very similar to an outside observer, each is
    associated with a distinct pattern of brain activity, metabolic activity,'
- md: '

    and movement; each is also associated with a distinct pattern of experience and
    cognition. During ordinary non-dream sleep, people who are awakened report vague
    and sketchy thoughts, and their experiences do not cohere into a continuous narrative.
    During dream sleep, in contrast, people who are awakened report rich and detailed
    experiences in which events form a continuous progression, which may be interrupted
    by bizarre or fantastic intrusions. Thoughts processed during the dream state
    frequently show a high level of irrationality. Both dream and non-dream states
    are associated with severe disruption of memory: it usually disappears in seconds
    during the non-dream state, and in minutes after awakening from a dream unless
    actively refreshed.


    A variety of psychoactive drugs have notable effects on consciousness. These range
    from a simple dulling of awareness produced by sedatives, to increases in the
    intensity of sensory qualities produced by stimulants, cannabis, or most notably
    by the class of drugs known as psychedelics. LSD, mesaine, psilocybin, and others
    in this group produce major distortions of perception, including hallucinations;
    some users describe their drug-induced experiences as mystical or spiritual in
    quality. The brain mechanisms underlying these effects are not well understood,
    but there is substantial evidence that alterations in the brain system that uses
    the chemical neurotransmitter serotonin play an essential role.


    There has been some research into physiological changes in yogis and people who
    practise various techniques of meditation. Some research with brain waves during
    meditation has differences between those corresponding to ordinary relaxation
    and those corresponding to meditation. It has been disputed, however, whether
    there is enough evidence to count these as physiologically distinct states of
    consciousness.


    The most extensive study of the characteristics of altered states of consciousness
    was made by psychologist Charles Tart in the 1960s and 1970s. Tart analyzed states
    of consciousness as made up of a number of component processes, including extero
    (sensing the external world); interception (sensing the body); input-processing
    (sensing meaning); emotions; memory; time sense; sense of identity; evaluation
    and cognitive processing; motor output; and interaction with the environment.
    Each of these, in his view, could be altered in multiple ways by drugs or other
    manipulations. The components that Tart identified have not, however, have been
    validated by empirical studies. Research in this area has not yet reached conclusions,
    but a recent questionnaire-based study identified eleven significant factors contributing
    to drug-induced states of consciousness: unity; spiritual experience; blissful
    state; insightfulness; disembodiment; impaired control and cognition; anxiety;
    complex imagery; elementary imagery; audio-visual synesthesia; and changed meaning
    of percepts.


    # Phenomenology


    Introspectively, the world of conscious experience seems to have considerable
    structure. Emmanuel Kant asserted that the world we perceive is organized according
    to a set of fundamental "intuitions", which we object (we perceive the world as
    a set of distinct things); quality (color, warmth, etc.); space (distance, direction,
    and location); and time. Some of these constructs, such as space and time, correspond
    to the world we structured by the laws of physics; for others the correspondence
    is not as clear. Understanding the physical basis of qualities, such as redness
    or pain, has been particularly challenging. David Chalmers called the hard problem
    of consciousness. Some philosophers have argued that it is intrinsically unsolvable,
    because qualities ("qualia") are ineffable; that is, they are "raw feels", incapable
    of being analyzed into component processes. Most psychologists and neuroscientists
    have not accepted these arguments — nevertheless it is clear that the relationship
    between a physical entity such as perceptual quality such as color is extraordinarily
    complex and indirect, as demonstrated by a variety of optical illusions such as
    neon color spreading.


    In neuroscience, a great deal of effort has gone into investigating how the perceived
    world of conscious awareness is constructed inside the brain. The process is generally
    thought to involve two primary mechanisms: (1) hierarchical processing of sensory
    inputs, (2) memory. Signals arising from sensory organs are transmitted to the
    brain and then processed in a series of stages, which extract multiple types of
    information from the raw input. In the visual system, for example, sensory signals
    from the eyes are transmitted to the thalamus and then to the primary visual cortex;
    inside the cerebral cortex they are areas to extract features as three-dimensional
    structure, shape, color, and motion. Memory comes to play in at two ways. First,
    it allows sensory information to be evaluated in the context of previous experience.
    Second, and even more importantly, working memory allows information to be integrated
    over time so that it can generate a stable representation of the world—Gerald
    Edelman expressed this point vividly by titling one of his books about consciousness
    The Remembered Present.


    Despite the large amount of information available, the most important aspects
    of perception remain mysterious. A great deal is known about low-level signal
    processing in sensory systems, the ways by which sensory systems interact with
    each other, with "executive" systems in the frontal cortex, and with the language
    system are very completely understood. At a deeper level, there are still basic
    conceptual issues that remain unresolved. Many scientists have found it difficult
    to reconcile the fact that information is distributed across brain areas with
    the apparent unity of consciousness: this is one aspect of the so-called binding
    problem. There are also some scientists who have expressed grave reservations
    about the idea that the brain forms representations of the world at all; influential
    members of this group include psychologist J. J. Gibson and roboticist Rodney
    Brooks, who both argued in favor of "intelligence without representation".


    # Assessment


    In medicine, consciousness is examined using a set of procedures known as neuropsychological
    assessment. There are two commonly used methods for assessing the level of consciousness
    of a patient: a simple procedure that requires minimal training, and a more complex
    procedure that requires substantial expertise. The simple procedure begins by
    asking whether the patient is able to move and react to physical stimuli. If so,
    the next question is whether the patient can respond in a meaningful way to questions
    and commands. If so, the patient is asked for name, current location, and current
    day and time. A patient who can answer all of these questions is said to be "oriented
    three times" (sometimes denoted "Ox3" on a medical chart), and is usually fully
    conscious.


    The more complex procedure is known as a neurological examination, and is usually
    carried out by a neurologist in a hospital setting. A formal neurological examination
    runs through a precisely delineated series of tests, beginning with tests for
    basic sensorotor reflexes and culminating with tests for sophisticated use of
    language. The outcome may be summarized using the Glasgow Coma Scale, which yields
    a number in the range 3—15, with a score of 3 indicating brain death (the lowest
    level of consciousness), and 15 indicating full consciousness. The Glasgow Coma
    Scale has three subscales, ranging from "no motor response" to "obey commands"),
    the best eye response (ranging from "no eye opening" to "eyes opening spontaneously")
    and the best verbal response (ranging from "no verbal response" to "fully oriented").
    There is also a simpler pediatric version of the scale, for young children too
    to be able to use language.


    # The Stream of Consciousness


    William James is widely credited with popularizing the idea that human consciousness
    flows like a stream, in his Principles of Psychology of 1890.

