    \ data\n- method apply function to data\n\nWhat I need from Conceptual programming\
    \ is the ability to learn or re-define itself. A concept is not fixed it can change\
    \ and be updated, by new data and facts that don’t fit the original model that\
    \ we had when we started programming the problem.\n\n## Machine Learning\n\nI\
    \ am talking about machine learning. This is more akin to an interpreter, rather\
    \ than a compiler. Let's look at these definitions:\n\ncompile verb [ with obj.\
    \ ]\n\n1. produce (something, esp. a list, report, or book) by assembling information\
    \ collected from other sources: the local authority must compile a list of taxpayers.\n\
    - collect (information) in order to produce something: the figures were compiled\
    \ from a survey of 2,000 schoolchildren.\n- accumulate (a specified score): the\
    \ 49ers have compiled a league-leading 14– record.\n\n2. Computing (of a computer)\
    \ convert (a program) into a machine-code or lower-level form in which the program\
    \ can be executed.\n\ninterpreter [in|tərprītor|]\n\nnoun\na person who interprets,\
    \ esp. one who translates speech orally.\n\nComputing a program that can analyze\
    \ and execute a program line by line.\n\n## Compiler Changes\n\nIn computing terms\
    \ we have compilers and interpreters:\n\nCompiler:\nA computer program that can\
    \ convert a program into a machine-code or lower-level form in which the program\
    \ can be executed.\n\nInterpreter:\nA program that can analyze and execute a program\
    \ line by line.\n\nWe have the concepts of run-time and compile-time. What happens\
    \ when we run a program and what happens when we compile it. When we compile it,\
    \ usually we get an executable file that we can run. When we run it we get something\
    \ that we have programmed executing on the computer. Interpreter takes our program\
    \ and goes straight to the run stage, a line at a time.\n\nHow is this different\
    \ with a compiled program that can do machine learning?\n\nWell we compile and\
    \ run our program as normal, but while the program running if it decides that\
    \ something meets certain parameters, the program will compile new code into its\
    \ executable, to allow it to a new function. This could result in the executable\
    \ file or a new data file being added to the programs' executable file.\n\n##\
    \ Know Yourself\n\nIf we were really clever, we could write a program that knows\
    \ nothing, but can learn everything. I don't think I'm clever.\n\nI do think one\
    \ of the core concepts that we will need the ability to know when we don't know\
    \ something. We do the ability to realize that something is new and can be added\
    \ to our program. Or for instance we currently have no apples. For instance:\n\
    \nQ: How many Apples do you have?\nA: I have no Apples.\n\nQ: I have given you\
    \ an Apple how many Apples do you have now?\nQ: I have one Apple.\n\nThis is like\
    \ an empty object that would still have knowledge about what kind of object it\
    \ might be, but a value of zero. Or maybe we owe someone 5 Apples, so we would\
    \ know what an Apple is, know that we have no Apples and know that we need 5 Apples\
    \ to repay a debt.\n\n## AI\n\nArtificial intelligence (AI) is the intelligence\
    \ of machines and the branch of computer science that aims to create it. AI textbooks\
    \ define the field as \"the study and design of intelligent agents\" where an\
    \ intelligent agent is a system that perceives its environment and takes actions\
    \ that maximize its chances of success. John McCarthy, who coined the term in\
    \ 1956, defines it as \"the science and engineering of making intelligent machines.\"\
    \n\nThe field was founded on the claim that a central property of humans, intelligence—the\
    \ sapience of Homo sapiens—can be precisely described by that it be simulated\
    \ by a machine. This raises philosophical issues about the nature of the mind\
    \ and the ethics of creating artificial beings, issues which have been addressed\
    \ by myth, fiction and philosophy since antiquity. Artificial intelligence has\
    \ been the subject of optimism, but has also suffered setbacks and, and today,\
    \ has become an essential part of the technology industry, providing the heavy\
    \ lifting for many of the most difficult problems in computer science.\n\nAI research\
    \ is highly technical and specialized, deeply divided into subfields that often\
    \ fail in the task of communicating with each other. Subfields have grown up around\
    \ particular institutions, the work of individual researchers, the solution of\
    \ specific problems, longstanding differences of opinion about how AI should be\
    \ done and the application of widely differing tools. The central problems of\
    \ AI include traits as reasoning, knowledge, planning, learning, communication,\
    \ perception and the ability to move and manipulate objects. General intelligence\
    \ (or \"strong AI\") is still among the field's long term goals.\n\n## History\n\
    \nThinking machines and all of artificial beings appear in Greek myths, as Talos\
    \ of Crete, the bronze robot of Hephaestus, and Pygmalion Galatea. Human likenesses\
