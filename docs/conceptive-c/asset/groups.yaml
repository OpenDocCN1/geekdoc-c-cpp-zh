    # AI


    Artificial intelligence (AI) is the intelligence of machines and the branch of
    computer science that aims to create it. AI textbooks define the field as "the
    study and design of intelligent agents" where an intelligent agent is a system
    that perceives its environment and takes actions that maximize its chances of
    success. John McCarthy, who coined the term in 1956, defines it as "the science
    and engineering of making intelligent machines."


    The field was founded on the claim that a central property of humans, intelligence—the
    sapience of Homo sapiens—can be precisely described by that it be simulated by
    a machine. This raises philosophical issues about the nature of the mind and the
    ethics of creating artificial beings, issues which have been addressed by myth,
    fiction and philosophy since antiquity. Artificial intelligence has been the subject
    of optimism, but has also suffered setbacks and, and today, has become an essential
    part of the technology industry, providing the heavy lifting for many of the most
    difficult problems in computer science.


    AI research is highly technical and specialized, deeply divided into subfields
    that often fail in the task of communicating with each other. Subfields have grown
    up around particular institutions, the work of individual researchers, the solution
    of specific problems, longstanding differences of opinion about how AI should
    be done and the application of widely differing tools. The central problems of
    AI include traits as reasoning, knowledge, planning, learning, communication,
    perception and the ability to move and manipulate objects. General intelligence
    (or "strong AI") is still among the field''s long term goals.


    # History


    Thinking machines and all of artificial beings appear in Greek myths, as Talos
    of Crete, the bronze robot of Hephaestus, and Pygmalion Galatea. Human likenesses
    believed to have intelligence were built in every major civilization: animated
    cult images were worshipped in Egypt and Greece and humanoid automatons built
    by Yan Shi, Hero of Alexandria and Al-Azari. It was also widely believed that
    artificial beings were created by Jabir ibn Hayyān, Judah Loewen and Paracelsus.
    By the 19th and 20th centuries, artificial beings had become a common feature
    in fiction, in Mary Shelley''s Frankenstein or Karel Čapek''s R.U.R. (Rossum''s
    Universal Robots). Pamela McCorduck argues that all of these are examples of an
    ancient urge, as she describes it, "to forge the gods". Stories of these creatures
    and their fates discuss many of the same hopes, fears and eternal concerns that
    are presented by artificial intelligence.


    Mechanical or "formal" reasoning has been developed by philosophers and mathematicians
    since antiquity. The study of logic led directly to the invention of the programmable
    digital electronic computer, based on the work of mathematician Alan Turing and,
    Turing''s theory of computation suggested that a machine, by shuffling symbols
    as simple as "0" and "1", could'
  - '[PAGE 18]


    simulate any conceivable act of mathematical deduction. This, along with concurrent
    discoveries in neurology, information theory and cybernetics, inspired a small
    group of researchers to begin to seriously consider the possibility of building
    an electronic brain.


    The field of AI research was founded at a conference on the campus of Dartmouth
    College in the summer of 1956. The attendees, including John McCarthy, Marvin
    Minsky, Allen Newell and Herbert Simon, became the leaders of AI research for
    many decades. And their students wrote programs that, to most people, simply astonishing:
    were solving problems in algebra, proving logical theorems and speaking English.
    By the middle of the 1960s, research in the U.S. was heavily funded by the Department
    of Defense and laboratories had been established around the world. AI''s founders
    were profoundly optimistic about the future of the new field: Herbert Simon predicted
    that "machines will be capable, within twenty years, of doing any work a man can
    do" and Marvin Minsky agreed, writing "within a generation ... the problem of
    creating ''artificial intelligence'' will be substantially solved.


    In the early 1980s, AI research was revived by the commercial success of expert
    systems, a form of AI program that simulated the knowledge and analytical skills
    of one or more human experts. By 1985 the market for AI had reached over a billion
    dollars. Japan''s fifth generation computer project inspired the U.S. and British
    governments to restore funding for academic research in the field.


    However, beginning with the collapse of the Lisp Machine market in 1987, AI once
    again fell into dispute, and a second, longer AI winter began.


    In the 1990s and early 21st century, AI achieved its greatest successes, albeit
    somewhat behind the scenes. Artificial intelligence is used for logistics, data
    mining, medical diagnosis and many other areas throughout the technology industry.
    The success was due to several factors: the increasing computational power of
    computers (see Moore''s law), a greater emphasis on solving specific subproblems,
    the creation of new ties between AI and other fields working on similar problems,
    and a new commitment by researchers to solve mathematical methods and rigorous
    scientific standards.


    On 11 May 1997, Deep Blue became the first computer chess-playing system to beat
    a reigning world champion, Garry Kasparov. In 2005, a Stanford robot won the DARPA
    Grand Challenge by driving autonomously for 131 miles along an unhearsed desert
    trail. Two years later, a team from CMU'
- md: '

    won the DARPA Urban Culture by autonomously navigating 55 miles in an Urban environment
    while adhering to traffic hazards and all traffic laws. In February 2011, in a
    Jeopardy! quiz show exhibition match, IBM''s question answering system, Watson,
    defeated the two greatest Jeopardy! champions, Brad Sutton and Ken Jennings, by
    a significant margin.


    The leading-edge definition of artificial intelligence research is changing over
    time. One pragmatic definition is: "AI research is that which computing scientists
    do not know how to do cost-effectively. For example, in 1956 optical character
    recognition (OCR) was considered AI, but today, sophisticated OCR software with
    a context-sensitive spell checker and grammar checker software comes for free
    with most image scanners. No one would longer consider already-solved computing
    science problems like OCR "artificial intelligence" today.


    Low-cost chess-playing software is commonly available for tablet computers. DARPA
    no longer provides funding for chess-playing computing system development. The
    Kinect provides a 3D body-motion interface for the Xbox 360 uses algorithms that
    emerged from lengthy AI research, but few consumers realize the technology source.


    AI applications are no longer the exclusive domain of Department of defense R&D,
    but are now common place consumer items and inexpensive intelligent toys.


    In common usage, the term "AI" no longer seems to apply to off-the-shelf computing-science
    problems, which may have originally emerged out of years of AI research.


    # Deduction, Reasoning, Problem Solving


    "Can a machine act intelligently?" is still an open problem. Taking "A machine
    can act intelligently" as a working hypothesis, many researchers have attempted
    to build such a machine.


    The general problem of simulating (or creating) intelligence has been broken down
    into a number of specific sub-problems. These consist of particular traits or
    capabilities that researchers would like an intelligent system to display. The
    traits described below have received the most attention.


    Early AI researchers developed algorithms that imitated the step-by-step reasoning
    humans use when they solve puzzles or logic deductions. By the late 1980s and
    ''90s, AI research had also developed highly successful methods for dealing with
    uncertain or incomplete information, employing concepts from probability and economics.


    For difficult problems, most of these algorithms can require enormous computational
    resources — most experience a "combinatorial explosion": the amount of memory
    or computer time required becomes astronomical when the problem goes beyond a
    certain size. The search for more efficient problem solving algorithms is a high
    priority for AI research.


    Human beings solve most of their problems using fast, intuitive judgments rather
    than the conscious, step-by-step deduction that early AI research was able to
    model. AI has made some progress at imitating this kind of "sub-symbolic" problem
    solving: embodied agents emphasize the importance of sensorimotor skills to higher
    reasoning; neural net research attempts to simulate the structures inside human
    and animal brains that give rise to this skill.


    # Knowledge Representation


    An ontology represents knowledge as a set of concepts within a domain and the
    relationships between those concepts.


    Main articles: Knowledge representation and Commonsense knowledge


    Knowledge representation and knowledge engineering are central to AI research.
    Many of the problems machines are expected to solve will require extensive knowledge
    about the world. Among the things AI needs to represent are: objects, properties,
    categories and relations between objects; situations, events, states and time;
    causes and effects; about knowledge (what we know about what other people know);
    and many other, less well researched domains. A representation of "what exists"
    is an ontology (borrowing a word from traditional philosophy), of which the most
    general are called upper ontologies.


    Among the most difficult problems in knowledge representation are:


    # Commonsense Knowledge


    Many of the things people take the form of "working assumptions." For example,
    if a bird comes into conversation, people typically pick an animal that is fit
    sized, sings, and flies. None of these things are true about all birds. John McCarthy
    identified this problem in 1969 as the qualification problem: for any commonsense
    rule that AI researchers care to represent, there tend to be a huge number of
    exceptions. Almost nothing is simply true or false in the way that abstract logic
    requires. AI research has explored a number of solutions to this problem.


    The number of atomic facts that the average person knows is astronomical. Research
    projects that attempt to build a complete knowledge base of commonsense knowledge
    (e.g., Cyc) require amounts of laborious ontological engineering — they must be
    built, by hand, one complicated concept at a time. A major goal is to have the
    computer understand enough concepts to be able to learn by reading from sources
    like the internet, and thus be able to add to its own ontology.


    Much of what people know is not represented as "facts" or "statements" that they
    could express verbally. For example, a chess master will avoid a particular chess
    position because it "feels too exposed" or an art critic can take one look at
    a statue and instantly realize it is a fake. These are intuitions and tendencies
    that are represented in the brain non-consciously and subsymbolically. Knowledge
    like this forms, supports and provides a context for symbolic, conscious knowledge.
    As with the related problem of sub-symbolic reasoning, it is hoped that situated
    AI or computational intelligence will provide ways to represent this kind of knowledge.


    # Learning


    Machine learning has been central to AI research from the beginning. In 1956,
    at the original Dartmouth summer conference, Ray Solomonoff wrote a report on
    unsupervised probabilistic machine learning: "An Inductive Inference Machine"


    Unsupervised learning is the ability to find patterns in a stream of input. Supervised
    learning includes both classification and numerical regression. Classification
    is used to determine what category belongs in, after seeing a number of examples
    of things from several categories. Regression takes a set of numerical input/output
    examples and attempts to discover a continuous function that would generate the
    outputs from the inputs. In reinforcement learning the agent is rewarded for good
    responses and punished for bad ones. These can be analyzed in terms of decision
    theory, using concepts like utility. The mathematical analysis of machine learning
    algorithms and their performance is a branch of theoretical computer science known
    as computational learning.


    # Natural Language Processing


    A parse tree represents the syntactic structure of a sentence according to some
    formal grammar. Natural language processing gives the ability to read and understand
    the languages that humans speak. Many researchers hope that a sufficiently powerful
    natural language processing system would be able to acquire knowledge on its own,
    by reading the existing text available over the internet. Some straightforward
    applications of natural language processing include information retrieval (or
    text mining) and machine translation.


    # Creativity


    A sub-field of AI addresses creativity both theoretically (from a philosophical
    and psychological perspective) and practically (via specific implementations of
    systems that generate outputs that can be considered creative, or systems that
    identify and assess creativity). A related area of computational research is Artificial
    intuition and Artificial imagination.


    # General Intelligence


    Most researchers hope that their work will eventually be incorporated into a machine
    with general intelligence (known as strong AI), combining all the skills above
    and exceeding human abilities at most or all of them. A few

