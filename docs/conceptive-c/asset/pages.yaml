  md: 'The meaning of "memory" is shared with Old Norse, which has munr. The word
    is originally from PIE verbal root *men-, meaning "to think, remember", whereas
    also Latin mens means "mind", Sanskrit manas "mind" and Greek μένος "mind, courage,
    anger".


    # Mental Faculties


    Thought is a mental activity that allows human beings to make sense of things
    in the world, and to represent and interpret them in ways that are significant,
    or according to their needs, attachments, goals, commitments, plans, ends, desires,
    etc. Thinking involves the symbolic or semantic mediation of ideas or data, as
    we form concepts, engage in problem solving, reasoning and making decisions. Words
    that refer to similar concepts and processes include deliberation, cognition,
    ideation, discourse and imagination.


    Thinking is sometimes described as a "higher" cognitive function and the analysis
    of thinking processes is a part of cognitive psychology. It is also deeply connected
    with our capacity to make and use tools; to understand cause and effect; to recognize
    patterns of significance; comprehend and disclose unique contexts of experience
    or activity; and to respond to the world in a meaningful way.


    Memory is the ability to preserve, retain, and subsequently recall, knowledge,
    information or experience. Although memory has traditionally been a persistent
    theme in philosophy, the late nineteenth and early twentieth centuries also saw
    the study of memory as a subject of inquiry within the paradigms of cognitive
    psychology. In recent decades, it has become one of the pillars of a new science
    called cognitive neuroscience, a marriage between cognitive psychology and neuroscience.


    The subject of memory has also been addressed in highly sophisticated ways in
    classic works of 20th century literature, notably in the memory of Marcel Proust,
    and in popular films, e.g. Eternal Sunshine of the Spotless Mind.


    Imagination is the activity of generating or evoking new situations, images, ideas
    or other qualia in the mind. It is a characteristically subjective activity, rather
    than a direct or passive experience. The term is technically used in psychology
    for the process of reviving in the mind percepts of objects formerly given in
    sense perception. Since this the use of the term conflicts with that of ordinary
    language, some psychologists have preferred to describe this process as "imaging"
    or "imagery" or to speak of it as "reproductive" as opposed to "productive" or
    "constructive" imagination.


    Things that are imagined are said to be seen in the "mind''s eye. Among many practical
    functions of imagination are the ability to project futures (or histories), to
    "see" things from another''s perspective, and to change the way something is perceived,
    including to make decisions to respond to, or enact, what is imagined.'
