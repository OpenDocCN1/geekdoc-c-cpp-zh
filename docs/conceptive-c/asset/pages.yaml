  md: '# Protocols


    Objective-C was extended at NeXT to introduce the concept of multiple inheritance
    of specification, but not implementation, through the introduction of protocols.
    This is a pattern achievable either as abstract multiply inherited base class
    in C++, or as "interface" (as in Java and C#). Objective-C use of ad hoc protocols
    called informal protocols and compiler-enforced protocols called formal protocols.


    An informal protocol is a list of methods that a class can implement. It is specified
    in the documentation, since it has no presence in the language. Informal protocols
    often include optional methods, which, if implemented, can change the behavior
    of a class. For example, a text field class might have a delegate that implements
    an informal method for performing auto-completion of user-typed text. The text
    field discovers whether the delegate supports the method (via reflection) and,
    if so, calls the delegate''s method to support the auto-complete feature.


    A formal protocol is similar to an interface in Java or C#. It is a list of methods
    that any class can declare itself to implement. Versions of Objective-C before
    2.0 required that a class must implement all methods in a protocol it declares
    itself as adopting; the compiler will emit an error if the class does not implement
    every method from its declared protocols. Objective-C 2.0 added support for marking
    certain methods in a protocol optional, and the compiler will not enforce implementation
    of optional methods.


    The Objective-C concept of protocols is different from the Java or C# concept
    of interfaces, in that a class may implement a protocol without being declared
    to implement that protocol. The difference is not detectable from outside code.
    [dubious – discuss] Formal protocols cannot provide any implementations, they
    simply assure that classes that conform to the protocol will provide implementations.
    In the NeXT/Apple library, protocols are frequently used by the Distributed Objects
    system to represent the capabilities of an object executing on a remote system.


    The syntax


    ```

    @protocol Locking

    - (void)lock;

    - (void)unlock;

    @end

    ```


    denotes that there is the abstract idea of locking. By stating that the protocol
    is implemented in the class definition:


    ```

    @interface SomeClass : SomeSuperClass <Locking>

    @end

    ```'
