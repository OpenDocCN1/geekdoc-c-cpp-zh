    Many of these features require that the bot be a channel operator. Most IRC bots
    are run from computers which have long uptimes (generally running a BSD derivative
    or Linux) and a fast, stable Internet connection. As IRC has become popular with
    many dial-up users as well, special services have appeared that offered user-level
    access to a stable Linux server with a decent connection. The user may run an
    IRC bot from this shell account. These services are commonly known as shell providers.


