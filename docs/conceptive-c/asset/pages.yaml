  md: '# Natural Language


    Conceptive C uses concepts to program natural language and Artifical Intelligence
    based computer language based on Objective C.


    One of the first computer programs that I saw was in an Advert for the Apple II.
    Someone was typing in questions and the computer was answering them. Having a
    conversation with the computer seemed like an easy thing to do, only it''s not.


    Computers still have problems understanding English or Natural language. It didn''t
    matter. I got hooked on programming computers. First in Basic, then 6502 Assembler,
    then Forth and C language.


    I have always wanted to write a computer program that I could have a conversation
    with, I thought about it over the years and think I am a lot nearer to having
    a computer program that can understand English.


    In a sort of you can''t get there from here, I figured out I needed to make a
    language that would allow me to program AI ideas and concepts. I have done a bit
    of object programming using Objective C. I liked the way that Objective C added
    enough to C to allow for programming of Objects.


    I wanted to do the same thing using Objective C to program idea''s and concepts.
    Primarily I was thinking of using Objective C to program AI or Natural Language
    problems. The first program would be able to understand Basic English.


    # Basic English


    Basic English (British American Scientific International Commercial) is a constructed
    (made-up) language to explain complex thoughts with 850 basic English words chosen
    by Charles Kay Ogden.


    So I am looking to have a program that understands 850 Basic English words.


    What is an idea? What''s a concept? How do we understand something? What is meaning?
    How do people think about things?


    If you teach English you can break it down into words and sentences.


    Sentences are built using words. Words have meanings. Words can be nouns, pronouns,
    verbs, adjectives or adverbs.


    Can we represent knowledge using words in a way that a computer can use to understand
    the meaning of words expressed.


    A baby starts with very few words that have limited meaning. Most parents are
    happy enough once the baby can say one word "Mommy" or "Daddy" and it attach to
    that person.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'If that is all language that we learned it be al that useful. Small children
    learn new words all the time and by the time they say five years old may already
    know 1,000 to 1,500 words and speak in sentences.


    A definition of a word will use other words, which will each have definitions.


    If we lookup word Idea, we get:


    Definition of Idea: noun, a concept or mental impression.


    So if we now lookup Concept, we get:


    Definition of Concept: noun, an abstract idea.


    Definition of Abstract: adjective, existing in thought or as an idea but not having
    a physical or concrete existence.


    Definition of Noun: a word (other than a pronoun) used to identify any of a class
    of people, places, or things ( common noun ), or to name a particular one of these
    ( proper noun ).


    Definition of Adjective: a word or phrase naming an attribute, added to or grammatically
    related to a noun to modify or describe it.


    The point I am making the Idea definition uses concept to describe itself and
    the definition of Concept uses idea to describe itself.


    I''m using the Apple dictionary for the definitions. Idea actually had 3 definitions:


    +   1. a thought or suggestion as to a possible course of action.


    (the idea) the aim or purpose.


    Philosophy (in Platonic thought) an eternally existing pattern of which individual
    things in any class are imperfect copies.


    # Word Definition


    How do we get a definition that a computer can use to understand what a word means?


    It''s more akin to how do we think or how do we understand the mean of a word.


    Let''s take a simpler word like Cat.


    Definition of Cat:


    noun


    +   1. a small domesticated carnivorous mammal with soft fur, a short snout, and
    retractable claws. It is widely kept as a pet or for catching mice, and many breeds
    have been developed.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '2 informal (particularly among jazz enthusiasts) a person, esp. a. man.


    Here are two different meanings a small furry anima, most people would mean this.


    If you said “I have a cat” I would know what you mean and maybe even picture a
    cat in my minds eye.


    Let''s look at Mind:


    # Definition of Mind:


    noun


    1 the element of a person that enables them to be aware of the world and their
    experiences, to think, and to feel; the faculty of consciousness and thought:
    as the thoughts ran through his mind, he came to a conclusion | people have the
    price they are prepared to pay settled in their minds.


    +   • a person''s mental processes contrasted with physical action: I wrote a
    letter in my mind.


    +   2 a person''s intellect: his keen mind.


    +   • a person''s memory: the company''s name slips my mind .


    +   • a person identified with their intellectual faculties: he was one of the
    greatest minds of his time.


    +   3 a person''s attention: I expect my employees to keep their minds on the
    job.


    the will or determination to achieve something: anyone can lose weight if they
    set their mind to it.


    verb [ with obj.


    +   1 [ often with negative ] be distressed, annoyed, or worried by: I don''t
    mind the rain.


    +   • have an objection to: what does that mean, if you don''t mind my asking?
    | [ clause ] : do you mind if I have a cigarette?


    +   • [ with negative or in questions ] (mind doing something) be reluctant to
    doing (often used in polite requests): I don''t mind admitting I was asked.


    +   • (would not mind something) informal used to express one''s strong enthusiasm
    for something: I wouldn''t mind coaching from him!


    +   2 regard as important; feel about: never the opinion polls | [ no obj. ] :
    why should she mind a few snubs from people she didn''t care for?


    +   • [ with clause in imperative ] dated to urge someone to remember or take
    care about something: mind when you look after the children.


    +   • [ no obj. ] (also mind you) used to introduce a qualification to a previous
    statement: we''ve got some decorations up—not a lot, mind you.'
