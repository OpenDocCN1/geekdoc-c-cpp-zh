    English (British American Scientific International Commercial) is a constructed
    (made-up) language to explain complex thoughts with 850 basic English words chosen
    by Charles Kay Ogden.


    # Rules of word use


    The word use of Basic English is much simpler and more regular than the word used
    of full English. Not all the meanings of each word are allowed.


    Ogden''s rules of grammar for Basic English help people use the 850 words to talk
    about things and events normally.


    +   -s / -es / -ies change singular nouns into plural nouns.


    +   -ing / -er change verbs into adjectives.


    +   -ing change verbs into nouns.


    +   -ly change adjectives into adverbs.


    +   -er / -est or more / most describe amounts.


    +   un- change the meanings of adjectives into their opposites.


    The opposite word order with do makes questions.


    Operators and pronouns conjugate as in normal English.'
