  md: '# C99


    After the ANSI/ISO standardization process, the C language specification remained
    relatively static for some time. In 1995 Normative Amendment 1 to the 1990 C standard
    was published, to correct some details and to add more extensive support for international
    character sets. The C standard was further revised in the 1990s, leading to publication
    of ISO/IEC 9899:1999 in 1999, which is commonly referred to as "C99". It has since
    been amended three times by Technical Corrinda. The international C standard is
    maintained by the working group ISO/IEC JTC1/SC22/WG14.


    C99 introduced several new features, including inline functions, several new data
    types (including long long int and a complex type to represent complex numbers),
    variable-length arrays, support for variadic macros (macros of variable attribute)
    and support for one-line comments beginning with //, as in BCPL or C++. Many of
    these had already been implemented as extensions in several compilers.


    is for the most part compatible with C90, but stricter in some ways; in particular,
    a declaration that lasts type specifier no longer int implicitly assumed. A standard
    macro _STDC_VERSION is defined with 19990L to indicate that C99 is available.
    GCC, Sun Studio and other C compilers now support many or all of the new features
    of C99.


    # Embedded C


    Historically, embedded programming requires nonstandard extensions to the C language
    in order to support exotic features such as fixed-point arithmetic, multiple distinct
    memory banks, and basic I/O operations.


    In 2008, the C Standards Committee published a technical report extending the
    C language to address these issues by providing a common standard for all implementations
    to adhere to. It includes a number of features not available in normal C, such
    as, fixed-point arithmetic, named address spaces, and basic I/O hardware addressing.


    # Uses


    C is often used for "system programming", including implementing operating systems
    and embedded system applications, due to a combination of desirable characteristics
    such as code portability and efficiency, ability to access specific hardware addresses,
    ability to pun types to match externally imposed data access requirements, and
    low runtime demand on system resources. C can also be used for website programming
    using CGI as a "gateway" for information between the Web application, the server,
    and the browser. Some reasons for choosing C over interpreted languages are its
    speed, stability, and nearuniversal availability.'
