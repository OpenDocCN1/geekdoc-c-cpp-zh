- img_proc: true
  md: '[ no obj. ] informal used to make a command more insistent or to draw attention
    to a statement: early to be bed tonight, mind.


    - be obedient to you think about how much Cal does for you, and you mind her,
    you hear?


    - Scottish: I mind the time when he lost his false.


    3 take care of temporarily: we left our husbands to mind the children while we
    went out.


    +   - [ in imperative ] used to warn someone to avoid injury or damage from a
    hazard: mind your head on cupboard!


    +   - [ in imperative ] be careful about the quality or nature of: mind your manners!


    4 [ with infinitive ] (be minded) chiefly formal be the inclined or disposed to
    a particular thing: he was minded to reject the application | the Board was given
    leave to object if it was so minded.


    Mind can be a noun or a verb. That''s quite a complex definition. If I read it
    as a person I have a context and understanding of many word already in place.
    It might mean something to me.


    A computer would need a file of the text, which it would scan into memory. It
    could easily parse the text into words. Group the words into sentences. But know
    what words mean or understand what a sentence is about and we start getting into
    some complex programming.


    A problem is we have a mind, we understand thing, know what words mean, but how
    we describe these things in ways that they can be replicated by a computer.


    What we do have is computers store something in a variable or represent things
    symbolically.


    But I can look at my pet cat and know it''s a, small black cat or little Lion.
    Visual recognition for computers will come at some time, in fact I''m sure there
    are some very good programs that can do that now.


    For the moment I am sticking to words, so what I want is something like a question
    and answer situation, if I ask a computer:


    Q: What is a Cat?


    A: A small domesticated carnivorous mammal with soft fur, a short snout, and retractable
    claws.


    If I get that, that''s fine. To do the computer does not need to be conscious
    or have a real understanding of what a cat is or even have seen a real cat. If
    I can get it to do those things too, that would be a bonus.


    So why am I calling this language Conceptual C?'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Well I am trying to program using concepts to allow a computer to get some
    understanding or meaning about what it is talking about and be able to create
    new sentences that make sense. So the computer can have a conversation.


    concept noun

    an abstract idea; a general notion: structuralism is a difficult concept | the
    concept of justice.


    +   - a plan or intention; a conception: the center has kept firmly to its original
    concept.

    - an idea or invention to help sell or publicize a commodity: a new concept in
    corporate hospitality.


    Philosophy an ideal or mental picture of a group or class of objects formed by
    combining all its aspects.


    How do we implement that in code? Is it a new kind of object?

    In “Object Oriented Programming” by Brad J. Cox, one of the inventors of Objective-C,
    he describes the counterparts of objective programming in conventional operator
    programming as:


    object a block of data

    object id pointer to block of data

    method apply function to data


    What I need from Conceptual programming is the ability to learn or re-define itself.
    A concept is not fixed it can change and be updated, by new data and facts that
    don’t fit the original model that we had when we started programming the problem.


    # Machine Learning


    I am talking about machine learning. This is more akin to an interpreter, rather
    than a compiler. Let''s look at these definitions:


    compile verb [ with obj. ]


    +   1. produce (something, esp. a list, report, or book) by assembling information
    collected from other sources: the local authority must compile a list of taxpayers.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '• collect (information) in order to produce something: the figures were compiled
    from a survey of 2,000 schoolchildren.


    • accumulate (a specified score): the 49ers have compiled a league-leading 14–
    record.


    2. Computing (of a computer) convert (a program) into a machine-code or lower-level
    form in which the program can be executed.


    interpreter [in|tərprītor|


    noun

    a person who interprets, esp. one who translates speech orally.


    Computing a program that can analyze and execute a program line by line.


    # Compiler Changes


    In computing terms we have compilers and interpreters:


    Compiler:


    A computer program that can convert a program into a machine-code or lowerlevel
    form in which the program can be executed.


    Interpreter:


    A program that can analyze and execute a program line by line.


    We have the concepts of run-time and compile-time. What happens when we run a
    program and what happens when we compile it. When we compile it , usually we get
    an executable file that we can run. When we run it we get something that we have
    programmed executing on the computer. Interpreter takes our program and goes straight
    to the run stage, a line at a time.


    How is this different with a compiled program that can do machine learning?


    Well we compile and run our program as normal, but while the program running if
    it decides that something meets certain parameters, the program will compile new
    code into its executable, to allow it to a new function. This could result in
    the executable file or a new data file being added to the programs executable
    file.


    # Know Yourself


    If we were really clever, we could write a program that knows nothing, but can
    learn everything. I don''t think I''m clever.


    I do think one of the core concepts that we will need the ability to know when
    we don''t know something. We do the ability to realize that'
  merge: -1
