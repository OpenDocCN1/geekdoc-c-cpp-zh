  md: 'One consequence of C''s wide acceptance and efficiency is that compilers, libraries,
    and interpreters of other programming languages are often implemented in C. The
    primary implementations of Python (CPython), Perl 5, and PHP are all written in
    C.


    Due to its thin layer of abstraction and low overhead, C allows efficient implementations
    of algorithms and data structures, which is useful for programs that perform a
    lot of computations. For example, the GNU Multi-Precision Library, the GNU Scientific
    Library, Mathematica and MATLAB are completely or partially written in C.


    C is sometimes used as an intermediate language by implementations of other languages.
    This approach may be used for portability or convenience; by using C as an intermediate
    language, it is not necessary to develop machine-specific code generators. Some
    languages and compilers which used C this way are BitC, C++, COBOL, Eiffel, Gambit,
    GHC, Squeak and Wala. However, C was designed as a programming language, not as
    a compiler target language, and is less than ideal for use as an intermediate
    language. This has led to development of C-based intermediate languages like C--.


    C has also been widely used to implement end-user applications, but much of development
    has shifted to newer languages.


    # Syntax


    C has a formal grammar specified by the C standard. Unlike languages such as FORTRAN
    77, C source code is free-form which allows arbitrary use of whitespace to format
    code, rather than column-based or text-based restrictions. Constraints may appear
    either between the delimiters /* and *, or (in C99) following // until the end
    of the line.


    C source files contain declarations and function definitions. Definitions, in
    turn, contain declarations and statements. Declarations define new types using
    keywords such as struct, union, and enum, or assign types to and perhaps reserve
    storage for new variables, usually by writing the variable name. Keywords such
    as char and int specify built-in types. Sections of code are enclosed in braces
    { and }, sometimes called "curly brackets" to limit the scope of declarations
    and to act as a single statement for control structures.


    As an imperative language, C uses statements to specify actions. The most common
    statement is an expression statement, consisting of an expression to be evaluated,
    by a semicolon; as a side effect of the evaluation, functions may be called and
    variables may be assigned new values. To modify the normal sequential execution
    of statements, C provides control-flow statements identified by reserved keywords.
    Structured programming is supported by if-else conditional execution and by do-while,
    while, and for iterative execution (looping). The for statement has separate initialization,
    testing, and reinitialization expressions, or all of which can be omitted. break
    and continue can be used to leave the innermost loop'
