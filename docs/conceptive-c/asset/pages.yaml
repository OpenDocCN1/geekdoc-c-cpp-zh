    # Dynamic Typing


    Objective-C, like Smalltalk, can use dynamic typing: an object can be sent a message
    that is not specified in its interface. This can allow for increased flexibility,
    as it allows an object to "capture" a message and send the message to a different
    object that can respond to the message appropriately, or likewise send the message
    to another object. This behavior is known as message forwarding or delegation
    (see below). Alternatively, an error handler can be used in the case the message
    cannot be forwarded. If an object does not forward a message, respond to it, or
    handle an error, the message is silently discarded. Messages are sent to nil (the
    null object pointer), which will be silently ignored or raise a generic exception,
    depending on compiler options.


    Static typing information may also be added to variables. This information is
    then checked at compile time. In the following statements, increasingly specific
    type information is provided. The statements are equivalent at runtime, but the
    additional information allows the compiler to warn the programmer if the passed
    argument does not match the type specified.


    +   - (void)setValue:(id)foo;


    In the above statement, foo may be of any class.


    +   - (void)setValue:(id)<aProtocol>foo;


    In the above statement, foo may still be an instance of any class, but the class
    must conform to the aProtocol protocol.


    +   - (void)setValue:(NSNumber *)foo;


    In the above statement, foo must be an instance of the NSNumber class.


    +   - (void)setValue:(NSNumber)<aProtocol>*)foo;


    In the above statement, foo must be an instance of the NSNumber class, and it
    must conform to the aProtocol protocol.


    Dynamic can be a powerful feature. When implementing container classes using statically-typed
    languages without generics (like Java prior to version 5), the programmer is forced
    to write a container class for a generic type of object, and then cast back and
    forth between the abstract generic type and the real type. Casting, however, breaks
    the discipline of static typing. For instance, putting in an integer and reading
    out a string will produce a runtime error. This problem is addressed in, for example,
    Java 5 and C# with generic programming, but then container classes must be homogeneous
    in type. This not be the case with dynamic typing.


