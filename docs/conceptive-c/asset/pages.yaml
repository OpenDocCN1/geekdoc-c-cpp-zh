    # AIML


    AIML, or Artificial Intelligence Markup Language, is an XML dialect for creating
    natural language software agents.


    The XML dialect called AIML was developed by Richard Wallace and a worldwide free
    software community between the years of 1995 and 2002. It formed the basis for
    what was initially a highly extended Eliza called "A.L.I.C.E." ("Artificial Linguistic
    Internet Computer Entity"), which won the'
