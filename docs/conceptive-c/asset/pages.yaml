  md: '# Mind


    Brian we know about. You can open someoneones head and there it is, but where
    is the Mind? How do people think about things? What makes us that we understand
    something? A Mind is a Concept used for thinking. We combine various objects and
    concepts to create a Mind Concept.


    # Concept of Mind


    The concept of mind is understood in many different ways by many different traditions,
    ranging from panpsychism and animism to traditional and organized religious views,
    as well as secular and materialistic philosophies. Most agree minds are constituted
    by conscious experience and intelligent thought. Common attributes of mind include
    perception, reason, imagination, memory, emotion, attention, and a capacity for
    communication. A rich set of unconscious processes are also included in many modern
    characterizations of mind.


    Thoughts of mind and function are numerous. Earliest recorded speculations are
    the likes of Zoroaster, the Buddha, Plato, Aristotle, and other ancient Greek,
    Indian, and later, Islamic and medieval European philosophers. Premod understandings
    of the mind, such as the neoplatonic “nows” saw as an aspect of the soul, in the
    sense of being both divine and immortal, linking human thinking with the un-changing
    ordering principle of the cosmos itself.


    Which attributes make the mind is debated. Some psychologists argue that only
    the “higher” intellectual functions constitute mind, particularly reason and memory.
    In this view the emotions—love, hate, fear, joy—are more primitive or subjective
    in nature and should be seen as different from the mind as others. Others argue
    that rational and emotional states cannot be separated, that they are of the same
    nature and origin, and should therefore be considered all part of what we call
    the nature.


    In popular usage mind is frequently synonymous with thought: the private conversation
    with ourselves that we carry on “inside our heads.” Thus we “make up our minds,”
    “change our minds” or are “of minds” about something. One of the key attributes
    of mind in this sense is that it is a private sphere to which no one but the owner
    has access. No one else can “know our mind.” They can only interpret what we consciously
    or unconsciously communicate.


    # Etymology


    The original meaning of Old English gemynd was the faculty of memory, not of thought
    in general. Hence call to mind, come to mind, come to mind, to have mind of, etc.
    Old English had other words to express “mind”, such as hyge “mind, spirit”.


    The generalization of mind to include all mental faculties, thought, volition,
    feeling and memory, gradually develops over the 14th and 15th centuries.'
