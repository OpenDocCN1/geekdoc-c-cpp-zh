  md: 'The object to which the message is directed — the receiver — is guaranteed
    to respond to a message, and if it does not, it simply raises an exception.


    Sending the message method to the object pointed to by the pointer obj would obj->method(C);


    In Objective-C, this is written as follows:

    n[obj method: argument];


    Both styles of programming have their strengths and weaknesses. Object-oriented
    programming in the Simula style allows multiple inheritances and faster execution
    by compile-time binding whenever possible, but it does not support dynamic binding
    by default. It forces all methods to have a corresponding implementation unless
    they are virtual, meaning the method is a placeholder for methods with the same
    name to be defined in objects derived from the base object. An implementation
    is still required for the method to be called in the delegate. Smalltalk-style
    programming allows messages to go unimplemented, with the method resolved to its
    implementation at runtime. For example, a message may be sent to a collection
    of objects, to which only some will be expected to respond, without fear of producing
    runtime errors. Message passing also does not require that an object be defined
    at compile time. (See the dynamic typing section for more advantages of dynamic
    (late) binding).


    Due to the overhead of interpreting the messages, an initial Objective-C message
    takes three times as long as a C++ virtual method call. Subsequent calls are cached
    and are faster than the C++ virtual method call in some implementations.


    # Interfaces and Implementations


    Objective-C requires that the interface and implementation of a class be separately
    declared blocks. By convention, developers place the interface in a header file
    and the implementation in a code file. The header files, normally suffixed .h,
