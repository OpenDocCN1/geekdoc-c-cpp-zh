    traveling through the area is actually responsible for the observed deficit. Further,
    it is not sufficient to describe memory, and its counterpart, learning, as solely
    dependent on specific brain regions. Learning and memory are attributed to changes
    in neuronal synapses, thought to be mediated by long-term potentiation and long-term
    depression.


