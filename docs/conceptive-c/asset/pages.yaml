  md: 'Idealists maintain that the mind is all that exists and that the external world
    is either mental itself, or an illusion created by the mind.


    Neutralists adhere to the position that perceived things in the world can be regarded
    as physical or mental depending on whether one is interested in their relationship
    to other things in the world or their relationship to the perceiver. For example,
    a red spot on a wall is physical in its dependence on the wall and the pigment
    of which it is made, it is mental in so far as its perceived redness depends on
    the workings of the visual system. Unlike dualism, neutral monism does not posit
    a more fundamental substance of which mind and body are aspects.


    The most common monisms in the 20th and 21st centuries have all been variations
    of philosophical; these positions include behaviorism, identity theory, anomalous
    monism and functionalism.


    Many modern philosophers of mind adopt either reductive or non-reductive physicalist
    position, maintaining in their different ways that the mind is not something separate
    from the body. These approaches have been particularly influential in the sciences,
    e.g. in the fields of sociobiology, computer science, evolutionary psychology
    and the various neurosciences. Other philosophers, however, adopt a non-physical
    position which challenges the notion that the mind is a purely physical construct.


    Reductive physicalists assert that all mental states and properties will eventually
    be explained by scientific accounts of physiological processes and states.


    Non-reductive physicalists argue that although the brain is all there is to the
    mind, the predicates and vocabulary used in mental descriptions and explanations
    are indispensable, and cannot be reduced to the language and lower-level explanations
    of physical science.


    Continued neuroscientific progress has helped to clarify some of these issues.
    However, they are far from being resolved, and modern philosophers of mind continue
    to ask (if at all) the subjective qualities and the intentionality (aboutness)
    of mental states and properties can be explained in naturalistic terms.


    # Psychology


    Psychology is the scientific study of human behavior, mental functioning, and
    experience; notably both an academic and applied discipline, Psychology involves
    the scientific study of mental processes such as perception, cognition, emotion,
    personality, as well as environmental influences, such as social and cultural
    influences, and interpersonal relationships, in order to devise theories of human
    behavior. Psychology also refers to the application of such knowledge various
    spheres of human activity, including problems of individuals'' daily lives and
    the treatment of mental health problems.'
  merge: -1
