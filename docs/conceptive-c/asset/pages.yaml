    ELIZA''s key method of operation (copied by chatbot designers ever since) involves
    the recognition of code words or phrases in the input, and the output of corresponding
    pre-prepared or pre-programmed responses that can make the conversation forward
    in an apparently meaningful way (e.g. by responding to any input that contains
