    # Temporal Direction


    A further major way to distinguish different memory functions is whether the content
    to be remembered in the past, retrospective memory, or whether the content is
    to be remembered in the future, prospective memory. Thus, retrospective memory
    as a category includes semantic, episodic and autobiographical memory. In contrast,
    prospective memory is for future intentions, or remembering to remember (Winograd,
    1988). Prospective memory can be further broken down into event and time-based
