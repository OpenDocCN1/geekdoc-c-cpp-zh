    # The Chinese Room


    If you carry on an intelligent conversation using pieces of paper slip under a
    door, does this imply that someone or something on the other side understands
    what you are saying?


    The Chinese Room is a thought experiment by John Searle which “Minds, Brains,
    and Programs", published in Behavioral and Brain Sciences in 1980. It addresses
    the question: if a machine can convincingly simulate an intelligent conversation,
    does it necessarily understand? In the experiment Searle imagines himself in a
    room, acting as a computer by manually executing a program that convincingly simulates
    the behavior of a native English speaker. Outside the room Chinese characters
    under the door and Searle, to whom “Chinese writing is just so many meaningless
    squiggles", is able to create sensible replies, in Chinese, by following the instructions
    of the program; that is, by moving papers around. The question asks whether Searle
    can be said to understand Chinese in the same way that, as Searle says:


    according to strong AI,, the appropriately programmed computer really is a mind,
    in the sense that computers give the right programs can be literally said to understand
    and have other cognitive states.


    The experiment is the centerpiece of Searle''s Chinese Room Argument which holds
    that a program cannot give a computer a “mind” or "understanding", regardless
    of how intelligently it may behave. He concludes that "programs are neither constitutive
    of nor sufficient for minds." "I can have any formal program you like, but I still
    understand nothing."


    The Chinese room is an argument against certain claims of leading thinkers in
    the field of artificial intelligence, and is not concerned with the level of intelligence
    that an AI program can display. Searle''s argument is directed'
  merge: -1
