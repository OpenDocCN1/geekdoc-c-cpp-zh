    between all the relevant properties (e.g. the output of a NAND gate relative to
    its inputs). This allows the person to generate truths about the system and then
    apply the model to demonstrate or her understanding. A mechanic may may randomly,
    or algorithmically probe the inputs and outputs of a black box to understand the
