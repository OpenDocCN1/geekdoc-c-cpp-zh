  md: 'Consciousness in mammals (this includes humans) is an aspect of the mind generally
    thought to comprise qualities such as subjectivity, sentience, and the ability
    to perceive the relationship between oneself and one''s environment. It is a subject
    of much research in philosophy of mind, psychology, neuroscience, and cognitive
    science. Some philosophers divide consciousness into phenomenal consciousness,
    which is subjective experience itself, and access consciousness, which refers
    to the global availability of information processing systems in the brain. Phenomenal
    consciousness has many different experienced qualities, often referred to as qualia.
    Phenomenal consciousness is usually sensed of something or about something, a
    property known as intentionality in philosophy of mind.


    # Mental Content


    Mental contents are those items which are thought of being "in" the mind, and
    capable of being formed and manipulated by mental processes and faculties. Examples
    include thoughts, concepts, memories, emotions, percepts and intentions. Philosophical
    theories of mental content include internalism, externalism, representationalism
    and intentionality.


    # Cognitive Science


    In animals, the brain, or encephal (Greek for "in the head”), is the control center
    of the central nervous system, responsible for thought. In most animals, the brain
    is located in the head, protected by the skin and close to the primary sensory
    apparatus of vision, hearing, equilibriumception, taste and olfactory. While all
    vertebrates have a brain, most invertebrates have either a centralized brain or
    collections of individual ganglia. Primitive animals such as sponges do not have
    a brain at all. Brains can be extremely complex. For example, the human brain
    contains more than 100 billion neurons, each linked to as many as 10,000 others.


    Understanding the relationship between the brain and the mind — mind-body problem
    is one of the critical issues in the history of philosophy — is a challenging
    problem both scientifically and conceptually. There are three major philosophical
    schools of thought concerning the answer: dualism, materialism, and idealism.
    Dualism holds that the mind exists independently of the brain; materialism holds
    that mental phenomena are identical to neuronal phenomena; and idealism holds
    that only mental phenomena exist.


    The most straightforward scientific evidence that there is a strong relationship
    between the physical brain matter and the mind is the impact physical alterations
    to the brain have on the mind, such as with traumatic brain injury and psychoactive
    drug use.


    In addition to the philosophical questions, the relationship between mind and
    brain involves a number of scientific questions, including understanding the relationship
    between mental activity and brain activity, the exact mechanisms by which drugs
    influence cognition, and the neural correlates of consciousness.'
