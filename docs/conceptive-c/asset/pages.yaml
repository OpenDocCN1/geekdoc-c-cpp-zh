    [In]


    artificial intelligence ... machines are made to behave in wondrous ways, often
    sufficient to dazzle the most experienced observer. Once a particular program
    is unmasked, once its inner workings are explained ... its magic crumbles; stands
    revealed as a collection of procedures ... The observer says to himself "I could
