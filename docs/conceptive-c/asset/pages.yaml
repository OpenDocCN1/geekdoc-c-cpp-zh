  md: 'After Steve Jobs left Apple Inc., he started the company NeXT. In 1988, NeXT
    licensed Objective-C from StepStone (the new name of PPI, the owner of the Objective-C
    trademark) and extended the GCC compiler to support Objective-C, and developed
    the AppKit and Foundation Libraries on which the NeXTStep user interface and interface
    builder were based. While the NeXT workstations failed to make a great impact
    in the marketplace, the tools were widely lauded in the industry. This led NeXT
    to drop hardware production and focus on software tools, selling NeXTStep (and
    OpenStep) as a platform for custom programming.


    The GNU project worked on its free clone of NeXTStep, GNUStep, based on the OpenStep
    standard. Dennis Glatting wrote the first GNU Objective-C runtime in 1992. The
    GNU Objective-C runtime, which has been in use since 1993, is the one developed
    by Kresten Karab Thorup when he worked at NeXT in 1993 to 1996.


    After acquiring NeXT in 1996, Apple used OpenStep in its operating system, Mac
    OS X. This included Objective-C and NeXT''s Objective-C developer tool, Project
    Builder (which had been expanded and is now called Xcode), as well as its interface
    design tool, Interface Builder. Most of Apple''s present-day Cocoa API is based
    on OpenStep interface objects, and is the most significant Objective-C environment
    being used for active development.


    # Syntax


    Objective-C is a thin layer on top of C, and moreover is a strict superset of
    C; it is possible to compile any program with an Objective-C compiler, and to
    freely include C code within an Objective-C class.


    Objective-C derives its syntax from Smalltalk. All of the syntax for nonobject-oriented
    operations (including primitive variables, preprocessing, function declarations,
    and function calls) are identical to that of C, while the syntax for object-oriented
    features is an implementation of Smalltalk-style messaging.


    # Messages


    The Objective-C model of object-oriented programming is based on message passing
    to object instances. In Objective-C one not call a method; one sends a message.
    This is unlike the Simula-style programming model used by C++. The difference
    between these two concepts is in how code referenced by the method or message
    name is executed. In a Simula-style language, the method name is in calls bound
    to a section of the target class by the compiler. In Smalltalk and Objective-C,
    the target of a message is resolved at runtime, with the receiving object itself
    interpreting the message. A method is identified by a selector or SEL — a NUL-terminated
    string representing its name — and resolved to a C method implementing it: an
    IMP. A consequence of this is that the message-passing system has no type checking.'
