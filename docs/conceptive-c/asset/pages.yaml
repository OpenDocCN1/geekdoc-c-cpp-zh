  md: 'against functionalism and computationalism (philosophical positions inspired
    by AI), rather than the goals of applied AI research itself. The argument leaves
    aside the question of creating an artificial mind by methods other than symbol
    manipulation.


    Controversial, and the subject of an entire literature of counterargument, it
    became Behavioral and Brain Sciences'' "most influential target article", generating
    an enormous number of commentaries and responses in the ensuing decades.


    # Chinese Room Thought Experiment


    Searle''s thought experiment begins with this hypothetical premise: suppose that
    artificial intelligence has succeeded in constructing a computer that behaves
    as if it understands Chinese. It takes Chinese characters as input and, by following
    the instructions of a computer program, produces other Chinese characters, which
    it presents as output. Suppose, Searle, that this computer performs its task so
    convincingly that it comfortably passes the Turing test: it convinces a human
    Chinese speaker that the program is itself a live Chinese speaker. To all of the
    questions the person asks, it makes appropriate responses, such that any Chinese
    speaker would be convinced that he or she is talking to another Chinese-speaking
    human.


    The question Searle wants to answer is this: does the machine literally "understand"
    Or is it merely simulating the ability to understand Chinese? Searle calls the
    first position "strong AI" (see below) and the latter "weak AI".


    Searle then posits that he is in a closed room and has a book with English version
    of the computer program, along with sufficient paper, pencils, erasers, and filing
    cabinets. Searle could receive Chinese characters through a slot in the door,
    process them according to the program''s instructions, and produce Chinese characters
    as output. The computer had passed the Turing test this way, it is fair, says
    Searle, to deduce that he would be able to do so as well, simply by running the
    program manually.


    Searle argues that there is no essential difference between the role the computer
    plays in the first case and the role he plays in the latter. Each is simply following
    a program, step-by-step, which simulates intelligent behavior. And yet, Searle
    points out, "I don''t speak a word of Chinese." Since he does not understand Chinese,
    Searle argues, we mean that the computer does not understand Chinese either.


    Searle argues that without "understanding" (what philosophers call "intentionality"),
    we cannot describe what the machine is doing as. Because it does not think, it
    does not have a "mind" in anything like the normal sense of the word, according
    to Searle. Therefore, he concludes, "strong AI" is mistaken.


    # History'
