- img_proc: true
  md: 'Psychology differs from the other social sciences (e.g., anthropology, economics,
    political science, and sociology) due to its focus on experimentation at the scale
    of the individual, or individuals in small groups as opposed to large groups,
    institutions or societies. Historically, psychology differs from biology and neuroscience
    in that it was primarily concerned with mind rather than brain. Modern psychology
    science incorporates physiological and neurological processes into its conceptions
    of perception, cognition, behavior, and mental disorders.


    # Evolutionary Psychology


    Evolutionary psychology (EP) is an approach within psychology that examines psychological
    traits — such as memory, perception, or language — from a Darwinian perspective.
    It seeks to explain how many human psychological traits are evolved adaptations,
    that is, the functional products of natural selection or sexual selection. Adaptation
    thinking brought physiological mechanisms, such as the heart, lungs, and immune
    system, is common in evolutionary biology. Evolutionary psychology applies the
    same thinking to psychology.


    # Evolution of the Human Mind


    The evolution of human intelligence refers to a set of theories that attempt to
    explain how human intelligence has evolved. The question is closely tied to the
    evolution of the human brain, and to the emergence of human language.


    The timeline of human evolution spans 7 million years, from the separation of
    the Pan genus until the emergence of behavioral modernity by 50,000 years ago.
    Of this timeline, the first 3 million years concern Sahelanthropus, the following
    2 million concern Australopithecus, while the final 2 million span the history
    of actual human species.


    Many traits of human intelligence, as empathy, theory of mind, mourning, ritual,
    and the use of symbols and tools, are already present in great apes although in
    lesser sophistication in humans.


    There is a debate between supporters of the idea of a sudden emergence of intelligence,
    or "Great leap forward" and those of a gradual or continuum hypothesis.


    # Animal intelligence


    Animal cognition, or cognitive ethology, is the title given to a modern approach
    to the mental capacities of animals. It has developed out of comparative psychology,
    but has also been strongly influenced by the approach of ethology, behavioral
    ecology, and evolutionary psychology. Much of what used to be considered under
    the title of animal intelligence is now thought of under this heading. Animal
    language acquisition, attempting to discern or understand the degree to which
    animal cognition can be revealed by linguistics-related study, has been controversial
    among cognitive linguists.'
