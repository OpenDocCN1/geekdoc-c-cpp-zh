  md: '# Meme


    A meme is "an idea, behavior or style that spreads from person to person within
    a culture." A meme acts as a unit for carrying cultural ideas, symbols or practices,
    which can be transmitted from one mind to another through writing, speech, gestures,
    rituals or other imitable phenomena. Supporters of the concept regard memes as
    cultural analogues to genes that they self-replicate, mutate and respond to selective
    pressures.


    The word ''meme'' is a shortening (modeled on ''gene'') of ''mimeme'' (from Ancient
    Greek μίμημα Greek pronunciation: [miːm ma] mīmēma, "something imitated", from
    μμῖμηται, "to imitate", from μ ός mimos ''meme'') and it was coined by the British
    evolutionary biologist Richard Dawkins in The Selfish Gene (1976) as a concept
    for discussion of evolutionary principles in explaining the spread of ideas and
    cultural phenomena. Examples of memes given in the book included melodies, catch-phrases,
    fashion and the technology of building arches.


    Advocates of the meme say that memes may evolve by natural selection in a manner
    analogous to that of biological evolution. Memes do through the processes of variation,
    mutation, competition and inheritance, each of which influence a meme''s reproductive
    success.


    Memes spread through the behaviors that they generate in their hosts. Memes that
    propagate prolifically may become extinct, while others may survive, spread and
    (for better or worse) mute. Memes that replicate effectively enjoy more success.
    Some memes may replicate effectively even when they prove to be detrimental to
    the welfare of hosts.


    A field of study called memetics arose in the 1990s to explore the concepts and
    transmission of memes in terms of an evolutionary model. Criticism from a variety
    of fronts has challenged the notion that scholarship can examine memes empirically.
    Developments in neuroimaging may make empirical study possible. Some commentators[who?]
    question the idea that one can meaningfully categorize culture in terms of discrete
    units.


    # Origins


    Max Steiner''s 1844 The Ego and Its puts forth the idea that the individual is
    dominated by illusory concepts (''fixed ideas'' or ''spooks''), which can be shaken
    and undermined by each individual, though he does not use the term meme for this.
    He offers examples such as nationalism and religion.


    Historically, the notion of a unit of social evolution, and a similar term (from
    Greek μμνήμη mneme, "memory"), first appeared in 1904 in a work by the German
    Lamarckist biologist Richard Simon titled The Mnemischen Empfindungen in ihren
    Beziehungen zu den OriginalOriginalempfindungen (loosely translatable as “Memory-feelings
    in relation to original feelings\”). According'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'to the OED, the word mneme appears in English in 1921 in L. Simon''s translation
    of Semon''s book: The Mneme.


    Laurent noted the use of the term mneme in Maurice Maeterlinck''s The Life of
    the White Ant (1926), and has highlighted similarities to Dawkins'' concept.


    The analogy between culturally transmitted information and genetically transmitted
