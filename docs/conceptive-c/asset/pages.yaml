    # What is a Concept?


    A concept (substantive term: conception) is a cognitive unit of meaning—an abstract
    idea or a mental symbol sometimes defined as a "unit of knowledge," built from
    other units which as a concept''s characteristics. A concept is typically associated
    with a corresponding representation in a language or symbology; however, some
    concepts do not have a linguistic representation, which can make them more difficult
    to understand depending on a person''s native language, such as a single meaning
    of a term.


    There are prevailing theories in contemporary philosophy which attempt to explain
    the nature of concepts. The representational theory of mind proposes concepts
    are mental representations, while the semantic theory of concepts (originating
    with Frege''s distinction between concept and object) holds that they are abstract
    objects. Ideas are taken to be concepts, although abstract concepts do not necessarily
    appear to the mind as images as some ideas do. Many philosophers consider concepts
    to be a fundamental ontological category of being.


    The term "concept" is traced back to 1554–60 (Latin conceptum - "something conceived"),
    but what is today termed "the classical theory of concepts" is the theory of Aristotle
    on the definition of terms. The meaning of "concept" is explored in mainstream
    information science, cognitive science, metaphysics, and philosophy of mind. In
    computer and information science contexts, especially, the term ''concept'' is
    often used in unclear or inconsistent ways.


