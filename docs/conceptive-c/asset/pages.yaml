    # Artificial Intelligence


    Avatars can be virtual embodiments of embodied agents, which are driven more or
    less by artificial intelligence rather than real people. Automated online assistants
    are examples of avatars used in this way.


    Such avatars are used by organizations as a part of automated customer services
    in order to interact with consumers and users of services. This can avail for
    enterprises to reduce their operating and training cost. A major underlying technology
    to systems is known as natural language processing. Some of these avatars are
    commonly known as "bots". Famous examples include Ikea''s Anna, an avatar designed
    to guide users around the Ikea website.


    Such avatars can also be powered by a Digital conversation which provides a little
    more structure than those using NLP, offering the user options and clearly defined
    paths to an outcome. This kind of avatar is known as a Structured Language Processing
    or SLP avatar. Both types of avatar provide a cost effective and efficient way
    of engaging with consumers.


