    usage in any program in order for it to be reused as much as possible. For example,
    if the only pointer to a heap memory allocation goes out of scope or has its value
    overwritten before free() is called, then memory cannot be recovered for later
    use and is essentially lost to the program, a phenomenon known as a memory leak.
    Conversely, it is possible to release memory too soon and continue to access it;
    however, since the allocation system can re-allocate or use the free memory, unpredictable
    behavior is likely to occur. Typically, the symptoms will appear in a portion
