    # The objects/actions matrix


    An optional but sometimes useful step in designing an interactive system is to
    illustrate its conceptual model as a matrix of objects and actions. Objects are
    listed down the left edge; actions are listed across the top (see Fig. 11.2).
    For now, we are ignoring the object type hierarchy and simply listing the objects.
    The more objects, the larger matrix; the more actions, the wider.


    Constructing an objects/actions matrix lets you visualize the simplicity or complexity
    of your conceptual model. The larger the matrix, the more concepts there are to
    learn. A tall matrix indicates many objects to learn. A wide one indicates many
    actions to learn. The matrix also illustrates how inconsistent or the conceptual
    model is—how easy it is for users to transfer what they have learned about one
    part of the system to another.


    A small, dense matrix indicates a design that will be easy to learn: few objects,
    few actions, and the operations on every type of object are the same (see Fig.
    11.3A). For example, the conceptual objects in a simple drawing would be graphical
    elements: lines, ellipses, arcs, triangles, text labels, etc. The applicable actions
    on graphical objects would presumably be create, delete, view/edit attributes,
    more, copy, resize, rotate, flip, etc. The objects/actions matrix for such a simple
    drawing would have a row for each object type and a column for each action. All
    the actions would apply to every object type, so the matrix would be densely packed,
    like that in Fig. 11.3A.


    A large, sparse matrix reflects an inconsistent design that will be hard to learn
    and remember because every conceptual object has different actions (see Fig. 11.3B).
    Such a design will be hard to learn and remember, no matter what user interface
    is plastered on it.


    A good rule of thumb is to simplify the conceptual model so that the matrix representing
    it is as small and dense as possible. However, a small matrix limits functionality.
    Achieving a small matrix is difficult when the application is anything


