    # COMMON METHODS OF MAKING MESSAGES VISIBLE


    There are several common and well-known methods of ensuring that an error message
    will be seen:


    +   * Put where users are looking: People focus in predictable places when interacting
    with graphical user interfaces (GUIs). In Western societies, people tend to traverse
    forms and control panels from upper left to lower right. While moving the pointer,
    people usually look at it or where they are moving it to. When people click a
    button or link, they can usually be assumed to be looking directly at it, at least
    for a few moments afterward. Designers can use this predictability to position
    error messages near where they expect users to be.


    +   * Mark the error: Somehow mark the error prominently to indicate that something
    is wrong. Often this can be done by simply placing the error message near what
    it refers to, unless that would place the message too far from users who are likely
    to be looking.


    +   * Use an error symbol: Make errors more visible by marking them with an error
    symbol, such as ✗ ⚠️ !


    +   * Reserve red for errors: By convention, in interactive systems the red color
    connects alert, danger, problem, error, etc. Using red for any other information
    on a computer display invites misinterpretation. But suppose you are designing
    a Web site for Stanford University, which has as its school color. Or suppose
    you are designing for a Chinese market, where red is considered an auspicious,
    color. What do you do? Use another color for errors, mark them with error symbols,
    or use stronger methods (see below).


    An improved version of the InformWorld sign-in error screen uses several of these
    techniques (Fig. 6.8).


    At America Online''s Web site, the form for registering for a new email account
    follows the guidelines pretty well (Fig. 6.9). Data fields with errors are marked
    with red error symbols. Error messages are displayed in red and are near the error.
    Furthermore, most of the error messages appear as soon as an erroneous entry is
    made, when the user is still focused on that part of the form, rather than only
    after the user submits the form. It is unlikely that AOL users will miss seeing
    these messages.'
