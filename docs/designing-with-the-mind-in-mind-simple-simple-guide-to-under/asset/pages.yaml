  md: '![](img/ad2531f1d746bd24ecf5f52be3ad32e8_75_0.png)


    # FIGURE 6.4


    A moving shape at the edge of our vision draws our eye: it could be food, or it
    might consider us food.


    That brings us to another advantage of peripheral vision: it is good at detecting
    motion. Anything that moves in our visual periphery, even slightly, is likely
    to draw our attention—and hence our fovea—toward it. The reason for this phenomenon
    is that our ancestors—including pre-human ones—were selected for their ability
    to spot food and avoid predators. As a result, even though we can move our eyes
    under conscious, intentional control, some of the mechanisms that control where
    they look are preconscious, involuntary, and very fast.


    What if we have no reason to expect that there might be anything interesting in
    a certain spot in the periphery², and nothing in that spot attracts our attention?
    Our eyes may never move our fovea to that spot, so we may never see what is there.


    # EXAMPLES FROM COMPUTER USER INTERFACES


    The low acuity of our peripheral vision explains why software and Web site users
    fail to notice error messages in messages and Web sites. When one clicks a button
    or a link, which is usually where his or her fovea is positioned. Everything on
    the screen that is not within 1–2 centimeters of the click location (assuming
    normal viewing distance) is in peripheral vision, where resolution is low. If,
    after the click, an error message appears in the periphery, it should not be surprising
    that the person might not notice it.


