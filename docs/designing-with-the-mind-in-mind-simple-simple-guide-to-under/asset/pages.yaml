- img_proc: true
  md: 'The Closure principle is often applied in graphical user interfaces (GUIs).
    For example, GUIs often repeat collections of objects—e.g., documents or messages—stacks
    (see Fig. 2.12). Just showing one object and the edges of others “behind” it is
    enough to make users perceive a stack of objects, all whole.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_27_0.png)


    FIGURE 2.12

    Icons depicting stacks of objects exhibit the Closure principle: partially visible
    objects are perceived as whole.


    # GESTALT PRINCIPLE: SYMMETRY


    A third fact about our tendency to see objects is captured in the Gestalt principle
    of Symmetry. It states that our tendency to parse complex scenes in a way that
    reduces the complexity. The data in our visual field usually has more than one
    interpretation, but our vision automatically organizes and interprets the data
    so to simplify it and give symmetry.


    For example, we see the complex shape on the left of Figure 2.13 as two overlapping
    diamonds, not two touching corners or a pinch-waist octahedron with a square in
    its center. A pair of overlapping diamonds is simpler than the other two interpretations
    shown on the right of Figure 2.13; it has fewer sides and more symmetry than the
    other two interpretations.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_27_1.png)


    FIGURE 2.13

    The human visual system tries to resolve complex scenes into combinations of simple,
    symmetrical shapes.


    In printed graphics and on computer screens, our visual system’s reliance on the
    symmetry principle can be exploited to represent three dimensional objects on
    a two dimensional display. This can be seen in a cover illustration for Paul Thagard’s
    book Coherence in Thought and Action (Thagard, 2002; see Fig. 2.14) and in three-dimensional
    depiction of a cityscape (see Fig. 2.15).'
