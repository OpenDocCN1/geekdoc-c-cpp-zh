  md: '# CHAPTER 6 Our Peripheral Vision is Poor


    # HEAVY ARTILLERY FOR MAKING USERS NOTICE

    MESSAGES: USE SPARINGLY


    If the common, conventional methods of making users notice messages are not enough,
    three stronger methods are available to user interface designers. However, these
    methods, while very effective, have significant negative effects so they should
    be used sparingly and with great care.


    # Pop-up message in error dialog box


    Displaying an error message in a dialog box sticks it right in the user''s face,
    making it hard to miss. Error dialog boxes interrupt the user''s work and demand
    immediate attention. That is if the good error message signals a critical condition,
    but it can annoy people if such an approach is used for a minor message, as confirming
    the execution of a user-requested action.


    The annoyance of pop-up messages rises with the degree of modality. Application-modal
    pop-ups block any further work in the application that displayed, but allows users
    to interact with other software on their computer. System-modal pop-ups block
    any user action until the dialog has been dismissed.


    Application-modal error pop-ups should be used sparingly, e.g., when only data
    may be lost if the user doesnt to attend to the error. System-modal pop-ups should
    be used extremely rarely—basically only when the system is about to crash and
    take hours of work with it or if people die if the user misses the error message.


    On the Web, an additional reason to avoid pop-up error dialog boxes is that some
    people set their browsers to block all pop-up windows. If your Web site relies
    on pop-up error messages, some users may never see them.


    # Use sound (e.g., beep)


    When a computer beeps, that tells its something has happened that requires attention.
    The person''s eyes reflexively scan the screen for whatever caused the beep. This
    can allow the user to notice an error message that is commonplace than where the
    user was just looking, such as in a standard error box on the display. That is
    the value of beeping.


    However, many people in a cubic work environment or a classroom, all using an
    application signals all errors and warnings by beeping. Such a workplace would
    be very annoying, to say the worst, people would not be able to tell whether their
    own computer or someone else''s was beeping.


    In noisy environments, e.g., factories or computer server rooms, might be masked
    by ambient noise.


    Finally, sound is muted or turned down on some people''s computers. Therefore,
    signaling errors and other conditions with remedies that can be used only in very
    special, controlled situations.'
