  md: '# Implications of short-term memory characteristics for user interface design
    87


    +   * In a drawing program, clicking and dragging normally selects one or more
    graphic objects on the drawing, but when the software is in “draw rectangle” mode,
    clicking and dragging adds a rectangle to the drawing and stretches it to the
    desired size.


    Moded user interfaces have advantages; that is why interactive systems have them.
    Modes allow a device to have more functions than controls: the same control provides
    different functions in different modes. Modes allow an interactive system to assign
    different meanings to the same gestures in order to reduce the number of gestures
    must learn.


    However, one well-known disadvantage of modes is that people often make mode-errors;
    they forget what the system is in and do the wrong thing by mistake (Johnson,
    1990). This is especially true in systems that give feedback about what the current
    mode is. Because of the problem of mode-errors, many user interface design guidelines
    say avoid modes or provide strong feedback about which the system is in. Human
    short-term memory is too unreliable for designers to assume users can, without
    clear, continuous feedback, keep track of what the system is in, even when the
    users are the ones changing the system from one mode to another.


    # Search results


    When people use a search function on a computer to find information, they enter
    the search terms, start the search, and then review the results. Evaluating the
    results often requires knowing what the search terms were. If short-term memory
    were less limited, people would always remember, when browsing the results, what
    they had entered search terms just a few seconds earlier. But as we have seen,
    short-term memory is very limited. When the results appear, the person''s attention
    naturally turns away from what they entered and toward the results. Therefore,
    it would be no surprise that people viewing search results do not remember the
    search terms they typed.


    Unfortunately, some designers of online search functions don''t understand that.
    For example, in 2006, the search-results provided search fields so users could
    search again, but didn''t show what a user had searched for (see Fig. 7.2A). A
    recent version of the site showed the user''s search terms (see Fig. 7.2B), reducing
    the burden on users'' short-term memory.


    # Instructions


    If you asked a friend for a recipe or for directions to her home, and she gave
    you a long sequence of steps, you probably would not remember it all. You would
    know that you could reliably keep all of the instructions in your short-term memory,
    so you would write them down or ask your friend to send them to you by email.
    Later, following the instructions, you would put them where you could refer to
    them until you reached the goal.'
