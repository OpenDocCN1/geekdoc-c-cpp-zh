  md: '# RESPONSIVENESS DEFINED


    Responsiveness is related to performance, but it is different. Performance is
    measured in terms of computations per unit of time. Responsiveness is measured
    in terms of compliance with human time requirements, and as described above, user
    satisfaction.


    Interactive systems can be responsive despite low performance. If you come to
    ask a question, he can be responsive if he can''t answer your question immediately:
    he can acknowledge the question and promise to call back. He can be even more
    responsive by saying when he will call back.


    Responsive systems keep you informed if they cannot fulfill the user''s requests.
    They provide feedback about what the user has done and what is happening, they
    prioritize the feedback based on human perceptual, motor, and cognitive deadlines
    (Duis & Johnson, 1990). Specifically, they do this:


    +   - Let you know that your input was received

    - Provide some indication of how long operations will take (see Fig. 12.1)

    - Free you to do other things while waiting

    - Manage queued events intelligently

    - Perform housekeeping and low-priority tasks in the background

    - Anticipate your most common requests


    Software can have poor responsiveness even if it is fast. Even if a repairman
    is very fast at fixing watches, he is unresponsive if you walk into his shop and
    ignores you until he finishes working on another watch. He is unresponsive if
    you hand him your watch and he silently waits without saying whether he is going
    to fix it now or go to lunch. Even if he starts working on your watch, he is unresponsive
    if he doesn''t tell you whether fixing it will take five minutes or hours.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_154_0.png)


    FIGURE 12.1

    MacOS X file: good progress indicator, useful time estimate, cancel button (circled
