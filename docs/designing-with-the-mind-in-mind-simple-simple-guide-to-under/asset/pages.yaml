    # Use thumbnail images to depict full-sized images compactly


    Recognition is fairly sensitive to the size in which objects and events are displayed.
    After all, we have to be able to recognize things independently of their distance
    from us. What is important as features: as long as most of the same features are
    present in the new picture as were in the original one, the new perception stimulates
    the same neural pattern, resulting in recognition.


