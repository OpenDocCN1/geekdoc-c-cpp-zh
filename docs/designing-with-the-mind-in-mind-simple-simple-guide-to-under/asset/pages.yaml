    retina.

    Lindsay and Norman, 1972.


    To visualize how the fovea is compared to your entire visual field, hold your
    arm straight out and look at your thumb. Your thumbnail, viewed at arm''s length,
    corresponds approximately to the fovea (Warea, 2008). While you have your eyes
    focused on the thumbnail, everything else in your visual field falls outside of
    your fovea on the retina.


    In the retina, people with normal vision have very high resolution: they can resolve
    several thousand dots within that region—better resolution than many of today''s
    pocket digital cameras. Outside of the fovea, the resolution is already down to
    a few dots per inch viewed at arm''s length. At the edges of vision, the "pixels"
    of our visual system are as large as a melon (or human head) at arm''s length
    (see Fig. 6.2A and B).


    If peripheral vision has such low resolution, one might wonder why we don''t see
    the world in a kind of tunnel vision where everything is out of focus except what
    we are directly looking at. Instead, we seem to see our surroundings sharply and
    constantly around us. We experience this illusion because our eyes move rapidly
    and constantly three times per second when we don''t realize it, focusing on the
    fovea on selected pieces of our environment. Our brain fills the rest in a gross,
    impressionistic way based upon what we know and expect.¹ Our brain does not have
    to maintain a high-resolution mental model of our environment because it can order
    the eyes to sample and resample data in the environment as needed (Clark, 1998).


    > Our brains also fill in the perceptual gaps that occur during saccadic eye movements,
    when vision is suppressed.'
