    Brain researcher Edward H. Adelson at the Massachusetts Institute of Technology
    developed an outstanding illustration of our visual system''s insensitivity to
    absolute brightness and its sensitivity to contrast (see Fig. 5.3). As difficult
    it may be to believe, square A on the checkerboard is exactly the same shade as
