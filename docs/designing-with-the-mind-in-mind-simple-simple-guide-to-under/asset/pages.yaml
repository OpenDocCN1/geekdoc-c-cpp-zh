    function executes at the normal speed, the busy indicator appears and disappears
    so quickly that users barely see it.


    # Progress indicators


    Progress indicators are better than busy indicators because they let users see
    how much time remains. The deadline for designing a progress indicator is 1 second.


    Progress indicators can be graphical (e.g., a progress bar), textual (e.g., a
    count of files yet to be copied), or a combination of graphical and textual. They
    greatly increase the perceived responsiveness of an application, even though they
    don''t shorten the time to complete operations.


    Progress indicators should be displayed for any operation that will take longer
    than a few seconds. The longer the operation, the more important they are. Many
    noncomputer devices provide progress indicators, so we often take them for granted.
    Editors that don''t show the progress towards your floor are annoying. Most people
    wouldn''t like a microwave oven that didn''t show the remaining cooking time.


    Here are some guidelines for designing effective progress indicators (McInnerey
    & Li, 2002):


    +   - Show work remaining, not work completed. Bad: "3 files copied." Good: "3
    of 4 files copied."

    - Show total progress, not progress on the current step. Bad: "5 seconds left
    on this step." Good: "15 seconds left."

    - Show the percentage of an operation that is complete, start at 1%, not 0%. Users
    worry if the bars stay at 0% for more than a second or two.

    - Similarly, display 100% only briefly at the end of an operation. The progress
    bars stay at 100% for more than a second or two, users assume it''s wrong.

    - Show smooth, linear progress, erratic bursts of progress.

    - Use human-scale precision, not computer precision. Bad: "240 seconds." Good:
    "About 4 minutes."


    # Delays between unit tasks are less bothersome than delays within unit tasks


    Unit tasks are useful not as a way of understanding how (and why) users break
    down large tasks. They also provide insight into how system response delays are
    most and least harmful or annoying.'
  merge: -1
