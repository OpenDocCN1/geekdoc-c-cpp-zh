    should therefore keep in mind that they don''t have control of the color viewing
    experience of users. Colors that seem highly distinguishable in the development
    facility on the development team''s computers and under normal office lighting
    conditions may not be as distinguishable in some of the environments where the
    software is used.


    # GUIDELINES FOR USING COLOR


    +   Distinguish colors by saturation and brightness as well as hue. Avoid color
    differences. Make sure the contrast between colors is high (but see guideline
    5). One way to test whether colors are different enough is to view them in grays.
    If you can''t distinguish the colors when they are rendered in grays, they aren''t
    different enough.


    +   Use distinctive colors. Recall that our visual system combines the signals
    from retinal cone cells to produce three "color opponent" channels: red-green,
    yellow-blue, and black-white. The colors that people can most easily are those
    that cause a strong signal (positive or negative) on one of the two color-perception
    channels, and neutral signals on the other channels. Surprisingly, those colors
    are green, yellow, blue, and white (see Fig. 5.12). All other colors cause signals
    on more than one channel, and so our visual system cannot distinguish them from
    other colors as quickly and easily as it can distinguish those six colors (Ware,
    2008).


