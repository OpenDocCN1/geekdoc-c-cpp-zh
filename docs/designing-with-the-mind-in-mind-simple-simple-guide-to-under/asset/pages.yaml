    # EXTERNAL FACTORS THAT INFLUENCE THE ABILITY TO DISTINGUISH COLORS


    Factors concerning the external environment also impact people''s ability to distinguish
    colors. For example:


    +   * **Variation among color displays:** Computer displays vary in how they display
    colors, depending on their technologies, driver software, or color settings. Even
    monitors of the same model with the same settings may display colors slightly
    different. Something that looks yellow on one display may look beige on another.
    Colors that are clearly different on one may look the same on another.

    * **Grayscale displays:** Although most displays these days are color, there are
    devices, especially small hand-held ones, with grayscale displays. Figure 5.11
    (above) shows that a grayscale display can make areas of different colors look
    the same.

    * **Display angle:** Some computer displays, particularly LCD ones, work better
    when viewed straight on than when viewed from an angle. When LCD'
