    Tuesday 15 Oct and arrives at San Francisco at 11:40 on Tuesday 15 Oct.

    | Structured:

    | **Flight: United 237, Auckland → San Francisco**

    | Depart: 14:30 Tue 15 Oct

    | Arrive: 11:40 Tue 15 Oct |


    **FIGURE 3.1**nStructured presentation of airline reservation information is easier
    to scan and understand.


