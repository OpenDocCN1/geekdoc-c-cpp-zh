  md: 'It is different from performance; responsiveness problems are not solvable
    merely by tuning performance or making hardware faster


    It is a design issue, not just an implementation issue


    History shows that faster processors will not solve the problem. Today''s personal
    computers are as fast as supercomputers 30 years ago, yet people still wait for
    their computers and rumble about a lack of responsiveness. Years from now, when
    personal computers and electronic appliances are as powerful as today''s most
    powerful supercomputers, responsiveness will still be an issue because the software
    of that day will demand much from the machines and the networks connecting them.
    For example, whereas today''s text and document editing applications do spell-checking
    in the background, future versions will do Internet-based fact-checking from now
    will probably be based upon these capabilities and technologies:


    +   * Deductive reasoning

    * Image recognition

    * Real-time speech generation and recognition

    * Downloading terabyte-sized files

    * Wireless communication among dozens of household appliances

    * Collation of data from thousands of remote databases

    * Complex searches of the entire Web


    The result is systems that place a much heavier load on the computer than today''s
    systems do. As computers grow more powerful, history shows that much of their
    power is eaten up by applications that demand ever more processing power. Therefore,
    despite ever-increasing performance, responsiveness will never disappear as an
    issue.


    For design flaws (bloopers) that hurt responsiveness, principles for designing
    responsive systems, and more techniques for achieving responsiveness, see Johnson
    (2007).'
  merge: -1
