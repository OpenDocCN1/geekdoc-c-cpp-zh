    # ABILITY TO DISCRIMINATE COLORS DEPENDS ON HOW COLORS ARE PRESENTED


    Even our ability to detect differences between colors is limited. Because of our
    visual system works, three presentation factors affect our ability to distinguish
    colors from each other:


    +   - Paleness**: The paler (less saturated) two colors, the harder it is to tell
    them apart (see Fig. 5.4A).

    - **Color patch size**: The smaller or thinner objects, the harder it is to distinguish
    their colors (see Fig. 5.4B). Text is often thin, so the exact color of text is
    hard to determine.

    - **Separation**: The more separated color patches are, the more difficult it
    is to distinguish their colors, especially if the separation is enough to require
    eye motion between patches (see Fig. 5.4C).


    Several years ago, the online travel site NET used two pale colors—white and pale
    yellow—to indicate which step of the reservation the user was on (see Fig. 5.5).
    Some visitors couldn''t see what they were on.

    Small color patches are often seen in data charts and plots. Many business graphics
    packages produce legends on charts and plots, but to make the color patches in
    the legend very small (see Fig. 5.6). Color patches in chart legends should be
    large to help people distinguish the colors (see Fig. 5.7).'
