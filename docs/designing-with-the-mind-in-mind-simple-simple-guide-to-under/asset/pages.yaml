  md: '# Our Color Vision is Limited

    5


    Human color perception has both strengths and limitations. Many of those strengths
    and limitations are relevant to user interface design:


    +   - Our vision is optimized to detect contrasts (edges), not absolute brightness.

    - Our ability to distinguish colors depends on how colors are presented.

    - Some people have color-blindness.

    - The user''s display and the viewing conditions affect color perception.


    To understand these qualities of human color vision, let''s start with a brief
    description of how the human visual system processes color information from the
    environment.


    # HOW COLOR VISION WORKS


    If you took introductory psychology or neurophysiology in college, you probably
    learned that the retina at the back of the human eye—the surface onto which the
    eye focuses images—has two types of light receptor cells: rods and cones. You
    probably also learned that the rods detect light levels but not colors, while
    the cones detect colors. Finally, you probably learned that there are three types
    of cells, sensitive to red, green, and blue light, respectively, suggesting that
    our color vision is similar to video cameras and computer displays, which detect
    or project a wide variety of colors by combinations of red, green, and blue pixels.


    What you learned in college is only partly right. We do in fact have rods and
    three types of cones in our retina. The rods are sensitive to overall brightness
    while the three types of cones are sensitive to different frequencies of light.
    But that''s where the truth departs from what most people learned in college until
    recently.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# 54 CHAPTER 5 Our Color Vision is Limited


    First, those of us who live in industrialized societies hardly use rods at all.
    They function only at low levels of light. They are for getting around in poorly
    lighted environments—the environments our ancestors lived until the nineteenth
    century. Today, we use rods only when we are having dinner by candlelight, feeling
    our way around our house at night, camping outside after dark. In bright daylight
    and modern artificially lit environments—where we spend most of our time—rods
    are completely maxed out, providing no useful information. Most of the time, our
    vision is entirely on input from our cores (Waren, 2008).


    So do our cores work? The three types of cores sensitive to red, green, and blue
    light, respectively? In fact, each type of core is sensitive to a wider range
    of light frequencies than you might expect, and the sensitivity of the three overlap
    considerably. In addition, the overall sensitivity of the three types of cores
    differs greatly (see Fig. 5.1A):


    +   **Low frequency:** These cones are sensitive to light over almost the entire
    range of visible light, but most sensitive to the middle (yellow) and low (red)
    frequencies.


    +   **Medium frequency:** These cones respond to light ranging from the high-frequency
    blues through the lower middle-frequency yellows and oranges. Overall, they are
    less sensitive than the low-frequency cones.


    +   **High frequency:** These cones are most sensitive to light at the upper end
    of the visible light spectrum—violets and blues—but they also respond to medium
    frequencies, such as green. These cones are much less overall than the other two
    types of cones, and also less numerous. One result is that our eyes are much less
    sensitive to blues and violets than to others.


    Compare a graph of the light sensitivity of our retinal cone cells (Fig. 5.1A)
    to what the graph might look like if electrical engineers had designed our retinas
    as a mosaic of receptors sensitive to red, green, and blue, like a camera (Fig.
    5.1B).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_61_0.png)


    FIGURE 5.1

    Sensitivity of the three types of retinal cones (A) versus artificial red, green,
    blue receptors (B).'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Given the old relationships between the sensitivities of our three types of
    retinal cones cells—one might wonder how our brain connects the signals from the
    cones to allow us to see a broad range of colors.


    The answer is by subtraction. Neurons in the visual cortex at the back back of
    our brain subtract the signals coming over the optic nerves from the medium- and
    low-frequency cones, producing a ''red-green'' difference channel. Other neurons
    in the visual cortex subtract the signals from the high- and low-frequency cones,
    yielding a ''yellow-blue'' difference channel. A third group of neurons in the
    visual cortex adds the signals coming from the low- and medium-frequency cones
    to produce an overall luminance (or ''black-white'') signal channel.¹ These cells
    are called color-opponent cells.


    The brain then applies subtractive processes to all three color-opponent channels:
    signals coming from a given area of the retina are effectively subtracted from
    similar signals coming from nearly areas of the retina.


    # VISION IS OPTIMIZED FOR EDGE CONTRAST, NOT BRIGHTNESS


    All this subtraction makes our visual system more sensitive to differences in
    color and brightness—i.e., contrasting edges—to absolute brightness levels.


    To see this, compare the two circles in Figure 5.2. They are the same exact shade
    of green—the circle on the right was copied from the one on the left—but the different
    backgrounds make the one on the left appear darker to our contrast-sensitive system.


    The sensitivity of our visual system to contrast rather than absolute brightness
    is an advantage: it helped our ancestors recognize a leopard in the nearby bushes
    as the same dangerous animal whether they saw in bright noon sunlight or in the
    early mornings of a cloudy day. Similarly, being sensitive to color contrasts
    rather than absolute colors allows us to see a rose as the same red whether it
    is in the sun or the shade.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_62_0.png)


    FIGURE 5.2

    The circles appear as different shades because their backgrounds are different,
    but they are the same.


    > ¹The overall brightness sum omits the signal from the high-frequency (blue-violet)
    cones. Those are so insensitive that their contribution to the total would be
    negligible, so omitting them makes little difference.'
  merge: -1
