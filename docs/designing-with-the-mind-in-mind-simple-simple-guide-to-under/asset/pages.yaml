  md: 'The first question is: which of these designs is easiest to learn? It is fairly
    clear that Design A is easiest.


    If we mean "the design for which users will use the most time to become productive",
    which is certainly Design B. It will take most users to learn all the different
    Cut and Paste keyboard shortcuts for the different types of content. But people
    are remarkably adaptable if sufficiently motivated—they can learn amazingly arbitrary
    things if, say, using the software required for their job. Eventually—maybe in
    a month—users would be comfortable and quick with Design B. In contrast, users
    of Design C would be productive in the same short time as users of Design A—probably
    a matter of minutes.


    However, if we interpret "hardest to learn" as meaning "the design for which users
    will take the longest to be error-free," that is Design C. All the types of document
    content use the same shortcut keys for Cut and Paste except videos. Although users
    of Design C will be productive quickly, they would continue to make the effort
    of trying to use CTRL-X and CTRL-V with videos for at least several months—perhaps
    forever.


    Even though some have criticized the concept of consistency as ill-defined and
    easy to apply badly (Grudin, 1989), the fact is that consistency in a user-interface
    greatly reduces the burden on users''s long-term memory. Mark Twain once wrote:
    "If you tell the truth, you never have to remember anything." One could also say
    "If everything worked the same way, you would not have to remember much." We will
    return to the issue of consistency in Chapter 11.'
