- img_proc: true
  md: '# xii Introduction


    very general to make them broadly applicable, but that means their exact meaning
    and their applicability to specific design situations is open to interpretation.


    Complicating matters further, more than one rule will often seem applicable to
    a given design situation. In such cases, the applicable design rules often conflict,
    i.e., they suggest different designs. This requires designers to determine which
    competing rule is more applicable to the given situation and should take precedence.


    Design problems—even without competing design guidelines—often have multi-conflicting
    goals, e.g.:


    +   - bright screen and long battery life

    - lightweight and sturdy

    - multifunctional and easy to learn

    - powerful and simple

    - WYSIWIG (what is what you get) and usable by blind people


    Satisfying all the design goals for a computer-based product or service usually
    requires tradeoffs—lots and of tradeoffs. Finding the right balance point between
    competing design rules requires further tradeoffs.


    Given all of these complications, user-interface design rules and guidelines must
    be applied thoroughly, not mindlessly, by people who are skilled in the art of
    UI design/or evaluation. User-interface design rules and guidelines are more like
    laws than unlike a set of laws is best applied and interpreted by lawyers and
    judges who are well versed in the laws, a set of user-interface design is best
    applied and interpreted by people who understand the basis for the guidelines
    and have learned from experience in applying them.


    Unfortunately, with a few exceptions (e.g., Norman, 1983a), user-interface design
    guidelines are provided as simple lists of design deicts with little to no rationale
    or background.


    Furthermore, although many early members of the user-interface design and usability
    profession had backgrounds in cognitive psychology, many newcomers to the field
    do not. That makes it difficult for them to apply user-interface design guidelines
    seamlessly.


    Providing that rationale and background education is the function of this book.


    # COMPARING USER-INTERFACE DESIGN GUIDELINES


    Table 1 places the two best-known user-interface guideline lists by side to show
    the types of rules they contain and how they compare to each other (see the Appendix
    for additional guidelines lists). For example, both lists start with a call for
    consistency in design. Both lists include a rule about preventing errors. The
    Nielsen-Molich rule “Help users recognize, design, and recover from errors” corresponds
    closely to the Shneiderman-Plaisant rule to “Permit easy reversal of actions.”
    “User control and freedom” corresponds to “Make users feel they are in control.”
    There is a reason for this similarity, and it isn’t just that later authors were
    influenced by earlier ones.'
