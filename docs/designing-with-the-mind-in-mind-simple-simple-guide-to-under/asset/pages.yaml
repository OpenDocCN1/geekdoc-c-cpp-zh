    \ It is true that meeting deadlines on the Web is difficult—often impossible.\
    \ However, it is also true that deadlines are psychological time constants, wired\
    \ into us by millions of years of evolution, governing our perception of responsiveness.\
    \ They are not arbitrary targets that we can adjust to match the limitations of\
    \ the Web or any technology platform. If an interactive system does not meet those\
    \ deadlines, even if it is a Web application, users will consider its responsiveness\
