    First to mention are the students of the Human-Computer Interaction course I taught
    as an Erskine Fellow at the University of Canterbury in New Zealand in the winter
    semester of 2006. It was for them that I developed a lecture providing a brief
    background in perceptual and cognitive psychology—just enough to enable them to
    understand and apply user interface design guidelines. That expanded into a professional
    development course, then into this book.


    Second are the reviewers of the first draft: Sun Fowler, Robin Jefferson, Tim
    McCoy, and Jon Meads. They made many helpful comments and suggestions that allowed
