  md: '# WE PREFER FAMILIAR PATHS


    People know that their attention is mindless, and they act accordingly. While
    pursuing a goal, they take familiar paths whenever possible rather exploring new
    ones, especially when working under deadlines. As explained more in Chapter 10,
    exploring new paths is problem solving, places a heavy load on attention and short-term
    memory. In contrast, taking familiar, well-learned routes can be done freely and
    does not consume attention and short-term memory.


    Years ago, in a usability test, a test participant in the middle of a task said
    to me:


    > I''m in a hurry, so I''ll do it the long way.


    He knew probably was a more efficient way to do what he was doing, but he also
    knew that learning the shorter way would require time and thought, which he was
    unwinding to spend.


    Once we learn one way to perform a certain task using a software application,
    we may continue to do that way and never discover a more efficient way. Even if
    we discover or are told that there is a "better" way, we may stick with the old
    way because it is familiar, comfortable, and most important, requires little thought.
    Avoiding this when using computers is important. People are willing to type more
    in order to think less.


    This preference for familiar, relatively mindless paths has several design implications
    for interactive systems:


    +   **Mindlessness keystrokes.** With software intended for casual use or infrequent
    use, as bank ATM machines or house-accounting applications, allowing users to
    become productive quickly and reducing their need to problem-solve while working
    is more important than saving keystrokes. Such software simply isn''t enough for
    keystrokes to matter much. On the other hand, in software that is used all day
    by highly trained users in intensive work environments, such as telephone reservation
    operators, every extra keystroke in a task adds high cumulative costs.


    +   **Guide users to the best paths.** From its first screen or home page, software
    should show users the way to their goals. This is basically the guideline that
    software should provide clear information scent.


    +   **Help experienced users speed up.** Make it easy for users to switch to faster
    paths after they gained experience. The slower paths for newcomers should show
    users faster paths if there are any. This is why most applications show the keyboard
    accelerators for frequently used functions in the menu menus.'
