  md: '# CHAPTER 2 Our Vision is Optimized to See Structure


    Figure/Ground is often used to pop up information over other content. Content
    that was formerly the figure—the focus of the users'' attention—temporarily becomes
    the background for new information, which appears briefly as the new figure (see
    Fig. 2.19). This approach is usually better than temporarily replacing the old
    information with the new information, because it provides context that helps people
    oriented regarding their place in the interaction.


    # GESTALT PRINCIPLES: COMMON FATE


    The previous six Gestalt principles concerned perception of static (un-moving)
    figures and objects. One final Gestalt principle—Common Fate—concerns moving objects.
    The Common Fate principle is related to the Proximity and Similarity principles:
    Like them it affects whether we perceive objects as grouped. The Common Fate principle
    states that objects which move together are perceived as grouped or related.


    For example, in a display showing dozens of pentagons, if of them wiggled back
    and forth in synchrony, people would see them as a related group, even if the
    wiggling pentagons were separated from each other and looked nothing different
    from all the other pentagons (see Fig. 2.20).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_31_0.png)


    FIGURE 2.20


    Common Fate: Items appear grouped or related if they move together.


    Common motion—implying common fates—is used in some animations to show relationships
    between entities. For example, GapMinder graphs animate dots representing nations
    to show changes over time in various factors of economic development. Countries
    that move together share development histories (see Fig. 2.21).'
