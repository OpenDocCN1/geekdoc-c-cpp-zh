  md: '# # Well-known User Interface

    Design Rules


    Here is a sampling of user interface design guidelines that have been published.


    # ## NORMAN (1983A)

    Inferences from research


    +   - Mode errors suggest the need for better feedback

    - Description errors suggest the need for better system configuration

    - Lack of consistency leads to errors

    - Capture errors imply the need to avoid overlapping command sequences

    - Activation issues suggest the importance of memory reminders

    - People will make errors, so make the system insensitive to them


    # ## Lessons


    +   - **Feedback:** The state of the system should be clearly available to the
    user, ideally in a form that is unambiguous and makes the set of options readily
    available so to avoid mode errors.

    - **Similarity of response sequences:** Different classes of actions should have
    quite dissimilar command sequences (or menu patterns) so as to avoid capture and
    description errors.

    - **Actions should be reversible:** As much as possible and where irreversible
    and of relatively high consequence, they should be difficult to do, thereby preventing
    unintentional performance.

    - **Consistency of the system:** The system should be consistent in its structure
    and design of command so as to minimize memory problems in retrieving the operations.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# SHNEIDERMAN (1987); SHNEIDERMAN AND PLAISANT (2009)


    +   * Strive for consistency

    * Cater for universal usability

    * Offer informative feedback

    * Design task flows to yield closure

    * Prevent errors

    * Permit easy reversal of actions

    * Make users feel they are in control

    * Minimize short-term memory load


    # NIELSEN AND MOLICH (1990)


    +   * Consistency and standards

    * Visibility of system status

    * Match between system and real world

    * User control and freedom

    * Error prevention

    * Recognition rather than recall

    * Flexibility and efficiency of use

    * Aesthetic and minimal design

    * Help users recognize, diagnose, and recover from errors

    * Provide online documentation and help


    # STONE et al. (2005)


    +   * **Visibility**: First step to goal should be clear

    * **Affordance**: Control suggests how to use it

    * **Feedback**: Should be clear what happened or is it happening

    * **Simplicity**: As simple as possible and task-focused

    * **Structure**: Content organized sensibly

    * **Consistency**: Similarity for predictability

    * **Tolerance**: Prevent errors, help recovery

    * **Accessibility**: Usable by all intended users, despite handicap, access device,
    or environmental conditions


    # JOHNSON (2007)


    **Principle 1** Focus on the users and their tasks, not on the technology


    +   * Understand the users

    * Understand the tasks

    * Consider the context in which the software will function'
  merge: -1
