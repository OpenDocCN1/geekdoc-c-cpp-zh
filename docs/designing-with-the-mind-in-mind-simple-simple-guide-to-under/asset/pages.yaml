  md: '# We Seek and Use Visual Structure 3


    Chapter 2 used the Gestalt principles of visual perception to show how our visual
    system is optimized to perceive structure. Perceiving structure in an environment
    helps us make sense of objects and events quickly. Chapter 2 also mentioned that
    when people are navigating through software or Web sites, they don''t scrutinize
    screens and read every word. They scan for relevant information. This chapter
    presents examples to show that when information is presented in a terse, structured
    way, it is easier to scan and understand.


    Consider two presentations of the same information about an airline flight reservation.
    The first presentation is unstructured prose; the second is structured text in
    outline form (see Fig.3.1). The structured presentation of the reservation can
    be scanned and understood much more quickly than the presentation.


    The more structured and terse the presentation of information, the more quickly
    and easily people can scan and comprehend it. Look at the Contents page from the
    California Department of Motor Vehicles (Fig.3.2). The wordy, repetitive links
    slow users down and "bury" the important words they need to see.


    | Unstructured:

