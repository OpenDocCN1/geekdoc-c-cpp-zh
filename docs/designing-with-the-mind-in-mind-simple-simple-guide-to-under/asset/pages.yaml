  md: '# EXCESS COMPLEXITY DUE TO SEPARATE CONCEPTS

    BEING TOO SIMILAR


    Some software applications are too complex because they have concepts that overlap
    in meaning or functionality. For example, one company''s customer-support Web
    site presented four concepts that the developers considered quite different:


    +   - **Membership**: whether a company had paid for customer-support service.

    - **Subscription**: whether a company had subscribed to a customer-support newsletter.

    - **Access**: which areas of the customer-support Web site users in a company
    could access.

    - **Entitlements**: services provided for each membership level.


    Confused these four concepts. The four concepts should have collapsed into one,
    or at least fewer than four.

    Another company developed a Web site for people seeking to buy a home. There were
