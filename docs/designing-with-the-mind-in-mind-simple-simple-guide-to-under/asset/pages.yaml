    # GESTALT PRINCIPLE: FIGURE/GROUND


    The next Gestalt principle that describes how our visual system structures the
    data it receives is Figure/Ground. This principle states that our mind separates
    the visual field into the figure (the foreground) and ground (the background).
    The foreground'
