  md: '# CHAPTER 10 Problem Solving and Calculation are Hard


    Calculation is done mainly in the brain''s controlled, monitored mode. It is a
    task that consumes scarce resources of attention and short-term memory, so when
    we try to perform calculations entirely in our heads, we have trouble. The exception
    is that some steps in a calculation may be memorized and before are automatic.
    For example, the overall process of multiplying 479 × 832 is controlled, but certain
    substeps of the process may be automatic if we have remembered the multiplication
    tables for single-digit numbers.


    Problems and calculations that involve one or two steps, or in which some steps
    are memorized (automatic), or that don''t involve much information, or in which
    all the relevant information is immediately available—and therefore need not be
    kept in short-term memory—are easy for most people to work out in their heads.
    For example:


    +   * 9 × 10 = ?


    +   * I need to move the washing machine out of the garage, but the car is in
    the way, and my car keys are in my pocket. What to do?


    +   * My girlfriend has two brothers, Bob and Fred. I have met Fred, and the one
    here is not Fred, so it must be Bob.


    However, problems that our short-term memory limits, or that require certain information
    be retrieved from long-term memory, or in which we encounter distractions, strain
    our brains. For example:


    +   * I need to move the washing machine out of the garage, but the car is in
    the way, and my keys are ... hmm ... they''re not in my pocket. Where are they?
    ... [Search] They are not in the car. Maybe I left them in my jacket ... Now where
    did I leave my jacket? [Search house; eventually find jacket in bedroom-room]
    OK, found the keys. ... Why is this bedroom messy—must clean before we get home.
    ... Hmmm. Why did I need the car keys? [Return to garage, see washer]. Oh, yeah
    to move the car I can move the washing machine out of the garage. (Higber-level
    goal was pushed out of short-term memory by interim subgoals).


    +   * John''s cat is not black and likes milk. Sue''s cat is not brown and doesn''t
    like milk. Sam''s cat is not white and doesn''t like milk. Mary''s cat is not
    yellow and likes milk. Someone found a cat that is yellow and likes milk. Whose
    cat is it?⁴ (The negations create more chunks of information than most people''s
