  md: '# Skilled and unskilled reading uses different parts of the brain 37


    However, empirical studies of readers conducted since then have demonstrated conclusively
    that the truth is the opposite of what the earlier theory predicted. Reading researcher
    Keith Stanovich explains:


    > > Context [is] important, but it''s a more important aid for the poorer reader
    who doesn''t have automatic context-free recognition instantiated.


    (in Boulton, 2009)


    In other words, the most efficient way to read is via context-free, bottom-up,
    feature-driven processes that are well learned to be the point of being automatic.
    Context-driven reading is considered today mainly a backup method, although it
    operates in parallel with feature-reading, is only relevant when feature-driven
    reading is difficult or insufficiently automatic.

    Skilled readers may resort to context-based reading when feature-based reading
    is disrupted by poor presentation of information (see examples later in this chapter).
    Also, in the race between context-based and feature-based reading to decipher
    the text we see, contextual cues sometimes win over features. As an example of
    context-based reading, Americans visiting England see the word ''toilet'' out,
    but they find it ''To let'' because they almost never see the phrase ''to let''—Americans
    use ''for rent''

    In less skilled readers, feature-based reading is not automatic; it is conscious
    and laborious. Therefore, much of their reading is considered fast. Their involvement
    of context-based reading and nonautomatic feature-based reading consumes short-term
    cognitive capacity, leaving little for comprehension.¹ They have to focus on deciphering
    the stream of words and paragraphs. This is why poor readers can read a passage
    aloud but afterward have no idea what they just read.

    Why is context-free (bottom-up) reading not automatic in some adults? Some people
    didn''t get enough experience as young children for the feature-driven recognition
    to become automatic. As they grow up, they find reading mentally laborious and
    taxing, so they avoid reading, which perpetuates and compounds (Boulton, 2009).


