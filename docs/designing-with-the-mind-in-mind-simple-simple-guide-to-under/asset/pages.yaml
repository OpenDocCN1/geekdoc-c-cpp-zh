  md: '# Reading is Unnatural


    # 4


    Most people in industrialized nations grew up in households and school districts
    that promoted education and reading. They learned to read as young children and
    became good or excellent readers by adolescence. As adults, most of our activities
    during a normal day involve reading. The process of reading—deciphering words
    into their meaning—is for most adults automatic, leaving our conscious minds free
    to ponder the meaning and implications of what we are reading. Because of this
    background, it is common for good readers to consider reading to be “natural”
    a human activity as speaking.


    # WE''RE WIRED FOR LANGUAGE, BUT NOT FOR READING


    Speaking and understanding spoken language is a natural human ability, but reading
    is not. Over hundreds of thousands—millions of years, the human brain evolved
    the neural structures necessary to support spoken language. As a result, normal
    humans are born with an innate ability to learn as toddlers, with no systematic
    training, whatever language they are exposed to. After early childhood, our innate
    ability to learn spoken languages decreases significantly. By adolescence, learning
    a new language is the same as learning any other skill: it requires instruction
    and practice, and the learning and processing are handled by different brain areas
    from those that handled it in early childhood (Sousa, 2005).


    In contrast, writing and reading did not exist until after four or five centuries
    ago—long after the human brain evolved into its modern state. At no time during
    childhood do our brains show any special innate ability to learn to read. Reading
    is an artificial skill that we learn by systematic instruction and practice, like
    playing a violin, juggling, and reading music (Sousa, 2005).'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# 34 CHAPTER 4 Reading is Unnatural


    Because people are innately “wired” to learn, children who lack caregivers who
    read to them, or who receive inadequate instruction in school may never learn
    to read. There are many people, especially in the developing world. By comparison,
    very few people have learned a spoken language.


    For a variety of reasons, even people who learn read may never become good at
    it. Perhaps their parents did not value and promote reading. Perhaps they attended
    substandard schools or didn''t attend school at all. Perhaps they learned a second
    language but never learned to read well in that language. Finally, people who
    have cognitive or perceptual impairments such as dyslexia may never become readers.


    Learning to read involves training our brain—including our visual system—to recognize
    patterns. The patterns that our brain learns to recognize run a gamut from low
    level to high level:


    +   * Lines, contours, and shapes are basic visual features that our brain recognizes
    innately. We don''t have to recognize them.


    +   * Basic features combine to form patterns that we learn to identify as characters—letters,
    numeric digits, and other standard symbols. In ideographic scripts, such as Chinese,
    symbols represent words over concepts.


    +   * In alphabetic scripts, patterns of characters form morphemes we learn to
    recognize as packets of meaning, e.g., “farm,” “tax,” “ed,” and “ing” are morphemes
    in English.


    +   * Morphemes combine to form patterns that we recognize as words, e.g., “farm,”
    “tax,” “ed,” and “ing” can be combined to form the words “farm,” “farmed,” “farming,”
    “tax,” “taxed,” and “taxing.” Even ideographic scripts include symbols that serve
    as morphemes or modifiers of meaning rather than as words or concepts.


    +   * Words combine to form patterns that we learn to recognize as phrases, idiomatic
    expressions, and sentences.


    +   * Sentences combine to form paragraphs.


    To see what text looks like someone who has not learned to read, just look at
    a paragraph printed in a language and script that you do not know (see Fig. 4-1A
    and B).


    Alternatively, you can approximate the feeling of illiteracy by taking a page
    printed in a family script and language—such as a page of this book—and turning
    it upside down. Turn this book upside down and try reading the few paragraphs.
    This exercise approximates the feeling of illiteracy. You will discover that the
    inverted text appears foreign and illegible at first, but after a minute you will
    be able to read it, albeit slowly and laboriously.'
