    # IS READING FEATURE-DRIVEN OR CONTEXT-DRIVEN?


    As stated earlier, reading involves recognizing features and patterns. Pattern
    recognition, and therefore reading, can be either a bottom-up, feature-driven
    process or a top-down, context-driven process.


    In feature-driven reading, the visual system starts by identifying simple features—line
    segments in a certain orientation or curves of a certain radius—on a page or display
    and then combines them into more complex features, such as angles, curves, shapes,
    and patterns. Then the brain recognizes characters as symbols representing letters,
    numbers, or for ideographic scripts, words. In alphabetic scripts, groups of letters
    are perceived as morphemes and words. In all types of scripts, sequences of words
    are parsed into phrases, sentences, and paragraphs that have meaning.


    Feature-driven reading is referred to as "bottom-up" or "context-free." The brain''s
    ability to recognize basic features: lines, edges, angles, etc.—is built in and
    therefore automatic from birth. In contrast, recognition of morphemes, words,
    and phrases has to be learned. It starts as a non-automatic, conscious process
    requiring analysis of letters, morphemes, and words, but with enough practice
    it becomes automatic (Souza, 2005). Obviously, the more common a word, or phrase,
    the more its recognition becomes automatic. With ideographic scripts like Chinese,
    which have many times more symbols than alphabetic scripts, people take many longer
    to become skilled readers.


    Context-driven or top-down reading operates in parallel with feature-driven reading
    but it works opposite way: from sentences or the gist of a paragraph down to the
    words and characters. The visual system starts recognizing high-level patterns
    like words, phrases, and sentences, or by knowing the text''s meaning in advance.
    Then it uses knowledge to figure out—what the components of the high-level pattern
    may be (Boulton, 2009). Context-driven reading is less likely to become automatic
    because phrase-level and sentence-level patterns and contexts do not occur frequently
    enough to allow their recognition to become into neural patterns. But there are
    exceptions, such as idiomatic expressions.'
