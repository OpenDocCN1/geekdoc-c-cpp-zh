    I regard creating an objects/actions matrix as an optional design step for two
    reasons:


    +   - Experienced interaction designers rarely need to draw the matrix to know
    whether the conceptual model underlying their design is simple or complex, consistent
    or inconsistent.

    - Usability testing can reveal aspects of an application''s conceptual model that
    designers did not know need to be simplified.


    It may be enough for designers, as they design the conceptual model for an application,
    imagine what its objects/actions matrix would look like if they drew it.

    The goal is to devise a conceptual model that is task-focused, as simple as possible,
    and as consistent as possible. From such a model, one can design a user interface
    for it that minimizes the time and experience required for using the application
    to become automatic.


    # Keystroke consistency


    When a designer moves from conceptual design to actual user interface design,
    keystroke-level consistency becomes important.

    Keystroke-level consistency is harder to isolate and measure, but it is at least
    important as conceptual consistency in determining how quickly the operation of
    an interactive system becomes automatic. The goal is to foster the growth of what
    is often called "muscle memory," meaning motor habits.

    Aieving keystroke-level consistency requires standardizing the physical actions
    for all activities of the same type. An example of this is editing text. Keystroke-level
    consistency for text editing requires the keystrokes (and pointer movements) to
    be the same regardless of the context in which text is being edited—documents,
    form fields, filenames, etc. Other types of activities for which keystroke-level
    consistency is desirable are opening documents, following links, choosing from
    a menu, choosing from a displayed set of options, clicking buttons, scrolling
    a display, etc.

    A system that is inconsistent at the keystroke level does not let people fall
    into "muscle memory" motor habits, but rather, keeps them guessing about what
    keystrokes to use in each context, even when contexts differ only slightly.'
