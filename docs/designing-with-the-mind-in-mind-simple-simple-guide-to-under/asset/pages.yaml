  md: '# 46 CHAPTER 4 Reading is Unnatural


    # Combining flaws that disrupt reading


    The website of Keller Williams, another real-estate firm, combines many of the
    above-described ways of disrupting reading. In some places it has insufficient
    contrast between foreground and background. In other places it has too much contrast,
    e.g., in places blue against red, causing an annoying shimmering. It also has
    centered text and text on patterned backgrounds. All of the above combine to make
    this site very hard to read (see Fig. 4.14).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_54_0.png)


    FIGURE 4.14


    Keller Williams’s Web site makes hard to read in several different ways.


    # Design implications: don’t disrupt reading; support it!


    Obviously, a designer’s goal should be to support reading, not disrupt it. Skilled
    (fast) reading is mostly automatic and mostly based on feature, character, and
    word recognition. The easier recognition, the easier and faster the reading. Less
    skilled reading, by contrast, is greatly assisted by contextual cues.


    Designers of interactive systems can support both reading methods by following
    these guidelines:


    +   - Ensure that text in user interfaces allows the feature-based automatic processes
    to function effectively by avoiding the disruptive flaws described above: difficult
    or tiny patterns, patterned backgrounds, centering, etc.'
