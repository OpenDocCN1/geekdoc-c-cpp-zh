    problem solving and calculation—requires focused attention and constant monitoring,
    and executes slowly and steadily (Schneider & Shuffin, 1977). It strains the limits
    of our short-term memory because all the chunks of information needed to execute
    a given procedure compete for conscious mental effort, as you saw when you tried
    to recite the alphabet from M to A.


    In computer jargon, the human has only one processor for emulation mode, controlled
    execution of processes. That is severely limited in its temporary storage capacity
    and its clock is an order of magnitude slower than that of the brain''s highly
    parallelized and compiled automatic processing.


    Modern humans evolved from earlier hominins between 200,000 and 50,000 years ago,
    but numerical calculation did not exist until about 3400 BC, when people in Mesopotamia
    (modern-day Iraq) invented and started a number system in commerce. By then, the
    human brain was more or less as it is today. Since the human brain evolved before
    numerical calculation existed, it is not optimized for calculation.'
