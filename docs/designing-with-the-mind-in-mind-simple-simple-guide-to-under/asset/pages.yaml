- img_proc: true
  md: 'During execution of a unit task, users keep their goal and necessary information
    in working memory or within their perceptual field. After they complete one task,
    before moving onto the next one, they relax a bit, and then pull the information
    needed for the next unit task into memory or view.


    Because unit tasks are intervals during which content of working memory and the
    perceptual field must remain stable, unexpected system delays during a unit task
    are particularly harmful and annoying. They can cause users to lose track of some
    or all of what they were doing. By contrast, system delays between unit tasks
    are not as harmful or annoying, even though they may slow the user''s overall
    work.


    This difference between the impact of system delays and between unit tasks is
    sometimes expressed in user interface design guidelines in terms of "closure,"
    as in the classic user interface design handbook Human-Computer Interface Design
    Guidelines (Brown, 1988):


    > A key factor determining response delays is level of closure. ... A delay after
    completing a major unit of work may not bother a user or adversely affect performance.
    Delays between minor steps in a larger unit of work, however, may cause the user
    to forget the next planned steps. In general, actions with high levels of closure
    such as saving a completed document to a file, are less sensitive to response
    times. Actions at the lowest levels of closure, such as typing a character and
    seeing it echoed on the display, are most sensitive to response times.


    Bottom line: If a system has to impose delays, it should do so between unit tasks,
    not during tasks.


    # Display important information first


    Interactive systems can appear to be operating fast by displaying important information
    first, then details and auxiliary information later. Don''t wait until a display
    is fully rendered before letting users see it. Give users something to think about
    and act upon as soon as possible.


    This approach has several benefits. It distracts users from the absence of the
    rest of information and fools them into believing that the computer did what they
    asked quickly. Research indicates that users prefer progressive results to progress
    indicators (Geeldorf, Toft, Roberts, & Hyland, 1995). Displaying results progressively
    lets users start their next unit task. Finally, because of the aforementioned
    reaction time for users to respond intentionally to what they see, this approach
    buys at least one second for the system to catch up before the user tries to do
    anything. Here are some examples:


    +   * Document editing software: When you open a document, the software shows
    the first page as soon as it has it, rather than waiting until it has loaded the
    entire document.'
  merge: -1
