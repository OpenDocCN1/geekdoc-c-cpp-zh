  md: '# # Recognition is Easy; Recall is Hard


    Chapter 7 described the strengths and limitations of long-term memory and their
    implications for the design of interactive systems. This chapter extends this
    discussion by describing important differences between two functions of long-term
    memory: recognition and recall.


    # ## RECOGNITION IS EASY


    The human brain was “designed,” through millions of years of natural selection
    and evolution, to recognize things quickly. By contrast, recalling memories, i.e.,
    retrieving them without perceptual support, must not have been crucial for survival,
    because our brains are worse at that.


    Remember our long-term memory works (see Chapter 7): perceptions enter through
    our sensory systems, and their signals, reaching the brain, cause patterns of
    neural activity. The neural pattern resulting from a perception is determined
    not only by the features of the perception, but also by the context in which it
    occurs. Similar patterns in similar contexts cause similar patterns of neural
    activity. Repeated activation of a particular pattern makes that pattern easier
    to reactivate in the future. Over time, connections between neural patterns develop
    in a way that one pattern activates the other. Roughly speaking, each pattern
    of neural activity constitutes a different memory.


    Patterns of neural activity, which is what memories are, can be activated in two
    ways: (a) by more perceptions coming from the senses, and (b) by other brain activity.
    If a perception comes that is similar to an earlier one and the context is close
    enough, it easily stimulates a similar pattern of neural activity, resulting in
    a sense of recognition. Recognition is essentially perception and long-term memory
    working in concert.


    As a result, we assess situations very quickly. Our distant ancestors on the East
    savannah had only a second or two to decide whether an animal emerging'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# CHAPTER 9 Recognition is Easy; Recall is Hard


    from the tall grasses was something they would regard as food or something they
    would regard them as food (see Fig. 9.1). Their survival depended on it.


    Similarly, people recognize human faces very quickly—usually in a fraction second
    (see Fig. 9.2). Until recently, the workings of this process were a mystery. However,
    that was when scientists assumed that recognition was a process in which perceived
    faces were stored in a separate short-term memory


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_113_0.png)


    FIGURE 9.1


