    # ADDITIONAL GUIDELINES FOR ACHIEVING RESPONSIVE INTERACTIVE SYSTEMS


    In addition to design guidelines specific to each of the consolidated human-computer
    interaction deadlines, there are general guidelines for achieving responsiveness
    in interactive systems.


    # Use busy indicators


    Busy indicators vary in sophistication. At the low end, we have simple, static
    cursors (e.g., an hourglass). They provide very little information: only that
    the software is temporarily occupied and unusable to the user for other animations.


    Next, we have wait-animations. Some of these are animated wait-cursors, such as
    the MacOS rotating color wheel. Some wait-animations are not cursors, but rather,
    larger graphics elsewhere on the screen, such as the “downloading data” animations
    displayed by Web browsers. Wait animations are more “friendly” to users than static
    cursors because they show that the system is working, not crashed or hung waiting
    for a network connection to open or data to unlock. Of course, busy animations
    should cycle in response to the actual computations they represent. Busy animations
    that are simply started by a function but run independently of it are not really
    busy animations: they keep running even when the process represents hung or crashed
    thereby potentially misleading.


