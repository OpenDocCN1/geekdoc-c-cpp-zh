    series of products—the first commercial graphical user interface. So on the design
    side, he was essentially at the beginning of GUIs. On the psychology side, he
    did degrees at Yale and Stanford. Putting design and psychology together, he worked
    on commercial interactive systems, taught at the university, and worked as a consultant.
    His trademark is using concrete examples to illustrate abstract principles. In
    fact, he is famous for driving his points home memorably by exhibiting “blooper”
    examples of bad designs—and so he does in this book.


    There is a third method of using science to help engineer a system that goes beyond
    design rules—design models. Jeff’s book shows examples of how to use this method,
    and how to understand real-time interaction constraints in terms of object and
    actions.


    In sum, this is a book that advances the goal of a supporting engineering method
    for interactive system design. At the same time, it is a primer to understand
    the why of the larger human action principles at work—a sort of cognitive science
    for designers in a hurry. Above all, this is a book of profound insight into the
    human mind for practical people who want to get something done.


    —Stuart Card'
