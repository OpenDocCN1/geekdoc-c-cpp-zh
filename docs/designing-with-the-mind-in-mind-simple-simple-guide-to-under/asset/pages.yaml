  md: '# Our Vision is Optimized to See Structure 2


    Early in the twentieth century, a group of German psychologists sought to explain
    how human visual perception works. They observed and catalogued many important
    visual phenomena. One of their basic findings was that human vision is holistic:
    Our visual system automatically imposes structure on visual input and is wired
    to perceive whole shapes, figures, and objects rather than disconnected edges,
    lines, and areas. The German word for “shape” or “figure” is *Gestalt*, so these
    theories became known as the Gestalt principles of visual perception.


    Today’s perceptual and cognitive psychologists regard the Gestalt theory of perception
    as more of a *explanatory* framework and *predictive* theory. Today’s theories
    of visual perception tend to be based heavily on the neurophysiology of the eyes,
    optic nerve, and brain (see Chapters 4–7).


    Not surprisingly, the findings of neurophysiological researchers support the observations
    of the Gestalt principles. We are really—along with other animals—“wired” to perceive
    our surroundings in terms of whole objects (Stafford & Webb, 2005; Ware, 2008).
    Consequently, the Gestalt principles are still valid—if not a fundamental explanation
    of visual perception, at least as a framework for describing it. They also provide
    a useful basis for guidelines for graphic and user interface design (Soegaard,
    2007).


    For present purposes, the most important Gestalt principles are: Proximity, Similarity,
    Continuity, Closure, Symmetry, Figure/Ground, and Common Fate. In the following
    sections, I describe each principle and provide examples from both static graphic
    design and user interface design.


    # GESTALT PRINCIPLE: PROXIMITY


    The principle of *Proximity* is the relative distance between objects in a display
    that affects our perception of whether and how the objects are organized into
    sub-groups. Objects that are near each other (relative to other objects) appear
    grouped, while those that farther apart do not.'
  merge: -1
