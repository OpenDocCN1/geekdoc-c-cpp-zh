    The biasing of perception by the surrounding context works *between* different
    senses. Perceptions in any of our five senses may affect simultaneous perceptions
    in any of our other senses. For example:


    +   * What we see can be biased by what we are hearing, and *vice versa*

    * What we feel with our tactile sense can be biased by what we are seeing, hearing,
    or smelling


    Later chapters explain how visual perception, reading, and recognition function
    in the human brain. For now, I will simply say that the pattern of neural activity
    that corresponds to a letter, a word, a face, or any object includes input from
    neural activity stimulated by the context. This includes other nearby perceived
    objects and events, and reactivated memories of previously perceived objects and
    events.

    Context biases perception not only in people but also in lower animals. A friend
    of mine often brought her dog with her when running errands. One day, as she drove
    into her driveway, a car was in the front yard. The dog saw it and began barking.
    My friend opened the door and the dog ran out and chased the cat, which jumped
    into a bush to escape. The dog missed the cat but. The dog remained agitated for
    some time afterwards.

    Thereafter, as long as we lived in that house, whenever she arrived at home with
    the car, he would get excited, bark, jump out of the car as soon as the door was
    opened, dash across the yard, and leap into the bush. There was no cat—perhaps
    even small one. Returning home in the car was enough to make the dog see one—However,
    walking home, as the dog did after being for his daily walk, did not evoke the
    "cat mirage."


    # PERCEPTION BIASED BY GOALS


    In addition to being biased by *post* experience and the *present* context, our
    perception is influenced by our goals and plans for the *future*. Specifically,
    our goals filter our perceptions: things unrelated to our goals to be filtered
    out prescientiously, never registering in our conscious minds.


    For example, when people navigate through software or a Web site, seeking information
    or a specific function, they don''t read carefully. They scan screens quickly'
