  md: '# CHAPTER 1 We Perceive What We Expect


    their past experience leads them to expect more than what is actually on the screen.
    Sometimes it confuses software designers, who expect to see what is on the screen.
    But that isn''t how perception works.


    For example, if the positions of the “Next” and “Back” buttons on the last page
    of a multipage dialog box switched, many people would not immediately notice the
    switch (see Fig. 1.3). Their visual system would have been lulled into inattention
    by the consistent placement of the buttons on several pages. Even after unintentionally
    going backward a few times, they might continue to perceive the buttons in their
    standard locations. This is why “place controls consistently” is a common user
    interface design guideline.


    Similarly, if we are trying to find something, but it is in a different place
    or looks different from us, we might miss it though it is in plain view because
    tunes us to look for expected features in expected locations. For example, if
    the “Submit” button on one form in a Web is shaped differently or is a different
    color from other forms on the site, users might not find it. This expectation-induced
    blindness is discussed later in this chapter, in the section on how our goals
    affect perception.


    # PERCEPTION BIASED BY CURRENT CONTEXT


    When we try to understand how our visual perception works, it is tempting to think
    of it as a bottom-up process, combining basic features as edges, lines, curves,
    and patterns into figures and ultimately into meaningful objects. To take reading
    as an example, you might assume that our visual system first recognizes shapes
    as letter and then combines them into words, into sentences, and so on.


    But visual perception—reading in particular—is not strictly a bottom-up process.
    It includes top-down influences too. For example, the word in which a character
    appears may affect how we identify the character (see Fig. 1.4).


    Similarly, our overall comprehension of a sentence or of a paragraph can even
    influence words we see in it. For example, the same letter선 be


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_14_0.png)


    FIGURE 1.4

    The same character is perceived as H or A depending on the surrounding letters.


    > ²Multi-step dialog boxes are called “wizards” in user interface jargon.'
