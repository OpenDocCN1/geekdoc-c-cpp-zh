  md: '# Heavy artillery for making users notice: use sparingly 75


    # Flash and wiggle briefly


    As described earlier, our peripheral vision is good at detecting motion, and motion
    in the periphery carries reflexive eye movements that bring the motion into the
    fovea. User interface designers can make use of this by wiggling or flashing messages
    when they want to ensure users see them. It doesn''t take much motion to trigger
    eye movement towards the motion. Just a tiny bit of motion is enough to make a
    viewer''s eyes zip over in that direction. Millions of years of evolution have
    had quite effect.


    However, like pop-up dialog boxes and beeping, must be used sparingly. Most experienced
    computer users consider wiggling, blinking objects on screen to be annoying. Most
    of us have learned to ignore displays that blink because many such displays are
    advertisements. Conversely, a few computer users have attention impairments that
    make it difficult for them to ignore something that is blinking or wiggling.


    Therefore, if motion or blinking is used, it should be brief: it should last about
    a quarter—to a half-second—no longer. Otherwise, it quickly goes from an uncommon
    attention-grabber to a conspicuous annoyance.


    # Use sparingly


    Use all of these "heavy artillery" methods sparingly—only for critical messages.
    When pop-ups, sound, motion, and blinking are used frequently to attract users''
    attention, a psychological phenomenon called babituation sets in. Our brains pay
    less and less attention to any stimulus that occurs it frequently. It is like
    the old fable about the boy who cried "Wolf" too often: eventually, the villagers
    learned to ignore


