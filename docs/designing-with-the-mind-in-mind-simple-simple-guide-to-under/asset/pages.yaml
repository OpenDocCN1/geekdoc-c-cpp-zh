  md: '# Where do design guidelines come from?


    **Table I.1** The Best-Known Lists of User Interface Design Guidelines


    | Shneiderman (1987); Shneiderman and Plaisant (2009) | Nielsen and Molich (1990)
    |

    |--- |--- |

    | - Strive for consistency | - Consistency of standards |

    | - Cater to universal usability | - Visibility of system status |

    | - Offer informative feedback | - Match between system and real world |

    | - Design tasks to yield closure | - User control and freedom |

    | - Prevent errors | - Error prevention |

    | - Permit easy reversal of actions | - Recognition rather than recall |

    | - Minimize short-term memory load | - Flexibility and minimalist design |

    | | - Help users recognize, diagnose, and recover from errors |

    | | - Provide online documentation and help |


    # WHERE DO DESIGN GUIDELINES COME FROM?


    For purposes, the detailed design rules in each set of guidelines, such as those
    in Table I.1, are less important than what they have in: their basic and origin.
    Where did design rules come from? Their authors—like fashion designers—simply
    to impose their own personal design tastes on the computer and software industries?


    If that so, the different sets of design rules would be very different from others
    as the various authors sought to differentiate themselves from the others. In
    fact, all of these sets of user-interface design guidelines are quite similar
    if we ignore differences in wording, and the scale of computer technology when
    each set was written.


    The answer is that all the design rules are based on human psychology: how people
    perceive, learn, remember, and, convert intentions into action. Many authors of
    design guidelines had at least some background in psychology that they applied
    to computer system design.


    For example, Don Norman was a professor, researcher, and prolific author in the
    field of cognitive human-computer interaction. Norman''s early human-computer
    design guidelines were based on research—his own and others''—on human cognition.
    He was especially interested in cognitive errors that people often make and how
    computer systems can be designed to learn or eliminate the impact of these errors.


    Similarly, other authors of user-interface design guidelines—e.g., Brown, Shneiderman,
    Nielsen, and Molich—used knowledge of perceptual and cognitive psychology to try
    to improve the design of usable and useful interactive systems.


    Bottom line: user-interface design guidelines are based on human psychology.

    By reading this, you will learn the most important aspects of the psychology underlying
    user-interface and usability design guidelines.'
