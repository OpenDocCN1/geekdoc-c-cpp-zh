  md: '# CHAPTER 1 We Perceive What Expect


    and superficially for items that seem related to their goals. They simply ignore
    items unrelated to their goals; they don''t even notice them.


    To see this, flip to the next page and look in the toolbox (Fig. 1.6) for scissors,
    and then immediately flip back to this page. Try it now.


    Did you spot the scissors? Now, looking back at the toolbox, can you say whether
    there is a screwdriver in the toolbox?


    Our filter perceptions in perceptual senses as well as in vision. A familiar example
    is the "cocktail party" effect. If you are conversing with someone at a crowded
    party, you can focus your attention to mainly what he or she is saying even many
    other people are talking near you. The more interested you are in the conversation,
    the more your brain filters out surrounding chatter.


    The effect was first documented in studies of air-traffic controllers, who were
    able to carry on a conversation with the pilots of their assigned aircraft even
    though many different conversations were occurring simultaneously on the same
    radio frequency, coming out of the same speaker in the control room (Arons, 1992).
    Research suggests that our ability to focus not only on our interest level in
    the conversation but also on objective factors (c.g., similarity of voices in
    the cacophony, the amount of general "noise", clattering dishes or loud music),
    and the predictability of your conversational partner is saying (Arons, 1992).


    This filtering of perception is particularly true for adults, who need to be more
    focused on goals than children. Children are more stimulus driven: their perception
    is less filtered by their goals. These characteristics make them less distractable
    than adults, but it also makes them less biased as observers. It is similar to
    look in the "toolbox" example. Most households have a catchall drawer for kitchen
    implements or tools. From your living room, send a visitor to the catch-all drawer
    is, with instructions to fetch you a specific tool, such as measuring spoons or
    a pipe wrench. When the person returns with the tool, ask whether another tool
    was in the drawer. Most adults—if they can complete the task without being distracted
    by all the cool stuff in the drawer—will be able to tell you what else was there.


    Perceptual filtering can also be seen in how people navigate Web sites. Suppose
    I put you on the home page of New Zealand''s University of Canterbury (see Fig.
    1.7) and asked you to print out a map of the campus showing the computer science
    department. You scan the page and probably quickly click one of the links with
    the goal that I gave you: Departments (top left), Departments and Colleges (middle
    left), or Campus Maps (bottom right). If you''re a "search" person, you might
    instead go to the Search box (middle right), type words related to the goal, and
    click "Go."'
