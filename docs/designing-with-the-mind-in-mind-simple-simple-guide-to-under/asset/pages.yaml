  md: '# 8 CHAPTER 1 We Perceive What We Expect


    Whether you browse or search, it is likely that you would leave the home page
    without noticing you were randomly chosen to win $100 (bottom left). Why that
    was not related to your goal.

    What is the mechanism by which our current goals bias our perception? There are
    two:


    +   * Influencing where we look. Perception is active, passive. We constantly
    move our eyes, ears, hands, and so on, so to sample the things in our environment
    that are most relevant to what we are doing or about to do (Ware, 2008). If we
    are looking on a Web site for a campus map, our eyes and pointer-controlling hand
    are attracted to that which might lead us to goal. We or less ignoring anything
    unrelated to our goal.

    * Sensitizing our perceptual system to contain features. When we are looking for
    something, our brain can prime our perception to be especially sensitive to features
    of what we are looking for (Ware, 2008). When we are looking for a red car in
    a large parking lot, red cars will seem to pop out when we scan the lot, and cars
    of other colors will barely register in our consciousness, even though we do in
    some sense “see” them. Similarly, when we are trying to find our spouse in a crowded,
    crowded room, our brain “programs” our auditory system to be especially sensitive
    to the combination of frequencies that make up his or her voice.


    # DESIGN IMPLICATIONS


    All these sorts of perceptual bias of course have implications for user interface
    design. There are three.


    # Avoid ambiguity


    Avoid ambiguous information displays, and test your design to verify that all
    users interpret the display in the same way. Ambiguity is unavoidable, either
    on standards or conventions to resolve it, or prime users to resolve the ambiguity
    in the intended way.

    For example, computer displays often shade buttons and text fields to make them
    look raised in relation to the background surface (see Fig. 1.8). This appearance


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_18_0.png)


    FIGURE 1.8

    Buttons on computer screens are often shaded to make them look three dimensional,
    but the convention only works if the simulated light source is assumed to be on
    the upper left.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'relies on a convention, familiar to most experienced computer users, that the
    light source is at the top left of the screen. If an object was depicted as lit
    by a light source in a different location, users would not see the object as raised.


    # Be consistent


    Place information and controls in consistent locations. Controls and data displays
    that serve the same function on different pages should be placed in the same position
    on each page on which they appear. They should also have the same color, text
    fonts, shading, and so on. This consistency allows users to spot and recognize
    them quickly.


    # Understand the goals


    Users come to a system with goals they want to achieve. Designers should understand
    those goals. Realize that users'' goals vary, and that their goals strongly influence
    what they perceive. Ensure that at every point in an interaction, the information
    users need is available, prominent, and maps clearly to a possible user goal,
    so users will notice and use the information.'
