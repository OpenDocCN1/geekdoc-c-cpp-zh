  md: '# Implications for user interface design 131


    Interactive systems should minimize the amount of attention users must devote
    to operating them (Krug, 2005), because that pulls cognitive resources away from
    the task user came to the computer to. Here are some design rules:


    +   - Prominently indicate system status and users'' progress toward their goal.
    If users can check their status easily by direct perception, using the system
    will not strain their attention and short-term memory.


    +   - Guide users toward their goals. Designers can do this implicitly, by making
    every choice-point provides clear information ''scent'' that leads users toward
    their goal, or by using a wizard (multistep dialog box). Don''t just display a
    bunch of options that appear equally likely and expect users to know how to start
    and how to get their goal, especially if they won''t perform the task very often.


    +   - Tell users explicitly and what they need to know. Don''t expect them to
    deduce information. Don''t require them to figure things out by a process of elimination.


    +   - Don''t make diagnose system problems, such as a faulty network connection.
    This diagnosis requires technical training, which most users don''t have.


    +   - Minimize the number and complexity of settings. Don''t expect to optimize
    combinations of many interacting systems or parameters. People are really bad
    at that.


    +   - Let people use perception rather than calculation. Some problems that might
    seem to require calculation can be represented graphically, allowing people to
    achieve their goals with quick estimates instead of calculation. A simple example:
    suppose you want to go to the middle of a document. Document editing of the 1970s
    and early 1980s forced you to look at the document''s length, divide that in half,
    and issue a command to go to the middle page number. With modern-day document
    editing software, you just drag the scrollbar "elevator" to the middle of the
    bar, and you are there. Similarly, snap-grid and alignment guides in drawing tools
    eliminate the need for users to determine, match, and compute-coordinates of graphical
    elements when adding new ones.


    +   - Make the system familiar. Use concepts, terminology, and graphics that already
    know to make the system as familiar as possible, requiring them to think about
    it. Designers can use this approach to a certain extent even if the system provides
    functions that have not been seen before. One way to do it is to follow conventions
    and standards (e.g., Apple Computer, 2009; Microsoft Corporation, 2009). A second
    way is to make new software applications like ones users have used before. A third
    approach is to base the design on metaphors, such as the desktop metaphor (Johnson
    et al., 1989). Finally, designers can study users to learn what is and not familiar
    to them.


    +   - Let the computer do the math. Don''t make people calculate what is and not
    familiar to them.'
