  md: '# # Our Peripheral Vision is Poor


    The previous chapter explained that the human visual system differs from a digital
    camera in the way it detects and processes color. Our visual system also differs
    from a camera in its center. On a digital camera''s photo sensor, photoreceptor
    elements are spread uniformly in a tight matrix, so the spatial resolution is
    constant across the entire frame. The human visual system is not like that.

    This chapter explains why:


    +   - Stationary items in muted colors presented in the periphery of people’s
    visual field will not be noticed.

    - Motion in the periphery is usually noticed.


    # ## RESOLUTION OF THE FOVEA COMPARED TO THAT OF THE PERIPHERY


    The spatial resolution of the human visual field grows greatly from the center
    to the edges. Each eye has approximately six million retinal cells. They are packed
    much more tightly in the center of our visual field—a small region called the
    *fovea*—than they are at the edges of the retina (see Fig. 6.1). The fovea is
    only 1% of the retina, the brain’s visual cortex devoting about 50% of its area
    to input from the fovea. Furthermore, foveal cells connect 1:1 to the ganglion
    neurons, whereas elsewhere on the retina, *multiple* photoreceptor cells (cones
    and rods) connect to each ganglion cell. In technical terms, transmission from
    the visual periphery is compressed (with data loss) before vision to the brain,
    while information from the fovea is not. All of causes our vision to have much,
    *much* greater resolution in the center of our visual field than elsewhere elsewhere
    (Lindsay and Norman, 1972; Waloszek, 2005).'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# 66 CHAPTER 6 Our Peripheral Vision is Poor


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_72_0.png)


