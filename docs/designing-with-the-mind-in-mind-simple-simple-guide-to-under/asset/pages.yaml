  md: '# Gestalt principle: proximity 13


    However, according to the Proximity principle, items on a display can be visually
    grouped simply by spacing them closer to each other than to other controls, without
    group boxes or visible borders (see Fig. 2.3). Many graphic design experts recommend
    this approach to reduce visual clutter and code size in a user interface (Mullet
    & Sano, 1994).


    Conversely, if controls are poorly spaced, e.g., if connected controls are too
    far apart, people will have trouble perceiving them as related, making the software
    harder to learn and remember. For example, the Discrete Software Installer displays
    six horizontal pairs of radiobuttons, representing a two-choice, but their spacing,
    due to the Proximity principle, makes them appear to be two vertical sets of radiobuttons,
    representing a six-choice, unless until users try them and learn how they operate
    (see Fig. 2.4).


