    # GESTALT PRINCIPLE: CONTINITY


    In addition to groups, several Gestalt principles describe our tendency to organize
    objects into our visual system tendency to resolve ambiguity or fill in missing
    data in such a way to perceive whole objects. The first principle, the principle
    of Continuity, states that our visual perception is biased to perceive continuous
    forms rather than disconnected segments.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'For example, on the left side of Figure 2.8, we automatically see two crossing
    lines—one blue and one orange. We don''t see two orange segments and two separate
    blue ones, and we don''t see a blue-and-orange V on top of an upsidedown orange-and-blue
    V. On the right side of Figure 2.8, we see a sea monster in water, not three pieces
    of one.


    A well-known example of the Continuity principle in graphic design is the IBM
    logo. It consists of disconnected patches, yet it is not at all ambiguous; it
    is easily seen as two bold letters, perhaps viewed through something like venetian
    blinds (see Fig. 2.9).


    Slider controls are a user-interface example of the Continuity principle. We see
    a slider as depicting a single range controlled by a handle that appears somewhere
    on the slider, not as two ranges separated by the handle (see Fig. 2.10A). Even
    displaying different colors on each side of a slider''s handle doesn''t completely
    “break” our perception of a slider as one continuous object, although ComponentOne''s
    choice of strongly contrasting colors (gray vs. red) strains that perception a
    bit (see Fig. 2.10B).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_25_0.png)


    FIGURE 2.8

    Continuity: Human vision is biased to see continuous forms, even adding missing
    data if necessary.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_25_1.png)


    FIGURE 2.9

    The IBM company logo uses the Continuity principle to form letters from disconnected
    patches.'
