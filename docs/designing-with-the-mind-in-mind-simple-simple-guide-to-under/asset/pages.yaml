  md: '# Foreword


    The design of interactive computing systems is not only an art, but, at least
    aspirationally a science. Well, not a science, actually, but rather a kind of
    joint computer-cognitive engineering, that is, science-based techniques to create
    interactive systems satisfying specified requirements.


    Like cars, buildings, and clothes, interactive computing artifacts can emotionally
    delight, exhibit style and fashion, and have social significance. There is much
    room for art and industrial design in making things that pop, flash, and interact.
    The resulting artifacts also have to work correctly and to flow with human activity.
    A beautiful building whose cornice soars its inhabitants in the summer or whose
    trusses buckle in a storm is a failure. Designers need methods to put latitude,
    season, fenestration, volume, and circulation to predict heating loads before
    building the building. They also need a stockpile of technology components, like
    thermospane glass, blinds, overhangs, and fans to choose among as part of the
    standard engineering of a solution. Engineering does not replace art in a design,
    it makes it possible.


    Engineering is hard enough for architecture; it is harder still for interactive
    artifacts, for the simple reason that it is easier to get a science of buildings
    than one of people. Providing such a supporting science and engineering has a
    founding aspiration of the field of human-computer interaction. How to do it?
    The most basic method is by "usability testing”—users discover difficulties, and
    fix these through redesign. Usability testing is useful, necessary, and inefficient.
    The results don''t come very well into a discipline anything anything like engineering,
    and it isn''t very insightful about why things break. It''s the cognitive equivalent
    of roasting the users to find the effect of the large windows. But usability testing
    can find many of a system''s flaws. It is a feasible method, because interactive
    systems are often easier to change than rebuilding.


    Better would be to avoid error in the first place, and one method is through design
    rules. Instead of rediscovering over and over through usability testing that interfaces
    depend on red and green color-blind users, just make a design rule to use color
    redundant with others. Design rules, however, turn out to have their own problems.
    In practice, design rules may be ambiguous or require subtle interpretation of
    context or contradict other guidelines. And that brings us to the current book.


    The idea of the present book is to unite design rules with the supporting cognitive
    and perceptual science that is at core. This format has several merits: the psychological
    science is made concrete and easy to absorb by connecting to actual designs, and
    the design rules are made easier to adjust for context, since they are related
    to their deeper rationale.


    Jeff Johnson is the perfect author to attempt such a book. His whole career has
    combined work on both the interface design side and the psychological science'
