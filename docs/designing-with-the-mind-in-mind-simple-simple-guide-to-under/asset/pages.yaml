    # A MODERN VIEW OF MEMORY


    Recent research on memory and brain function indicates that short- and long-term
    memory are functions of a single memory system—one that is closely linked with
    perception than previously thought (Jonides et al., 2008).


    # Long-term memory


    Perceptions enter through the visual, auditory, olfactory, gustatory, or tactile
    sensory systems and trigger responses in areas of the brain dedicated to each
    sense (e.g., visual cortex, auditory cortex), spreading into other areas of the
    brain that are not specific to any sensory memory. The sensory-modality-specific
    areas of the brain detect only simple features of the data, such as a dark-light
    edge, diagonal-pitched tone, sour taste, red color, or rightward motion. Downstream
    areas of the brain combine low-level features to detect higher-level features
    of the input, such as animal, Uncle Kevin, minor key, breath, or the word “duck”.


    The initial strength of a perception depends on how it is amplified or dampened
    by other brain activity. All perceptions create some kind of trace, but some are
    so weak that they can be considered as not registered: the pattern activated once
    but never again.


    Memory formation consists of long-lasting and permanent changes in the neurons
    involved in a neural activity pattern, which make the pattern easier to reactivate
    in the future.¹ Some changes involve the release of chemicals into


    > ¹There is evidence that the long-term neural changes associated with learning
    occur mainly during sleep, suggesting that separating learning sessions by periods
    of sleep may facilitate learning (Stafford & Webb, 2005).'
