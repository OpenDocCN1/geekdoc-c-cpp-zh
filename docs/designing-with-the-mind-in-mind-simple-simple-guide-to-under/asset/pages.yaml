    # WE LEARN FASTER WHEN VOCABULARY IS TASK-FUSED, FAMILIAR, AND CONSISTENT


    Ensuring that an application, Web service, or appliance exposes a small, consistent,
    and task-appropriate set of concepts to its users is a big step, but it is not
    enough to minimize the time it takes for people to learn an interactive system.
    You also have to make sure that what the vocabulary—what concepts are called—fits
    the task, is familiar, and consistent.


    # Terminology should be task-focused


    Just as the user-visible concepts in an interactive system should be task-focused,
    should the names for the concepts. Usually, task-focused terms for concepts emerge
    from the interviews and observations of users designers construct as part of the
    task analysis. Occasionally software may expose a concept that is new to users;
    the challenge for a designer is keeping these concepts and their names focused
    on the task, not on the technology.


    Some examples of interactive software systems using terminology that is not task
    focused:


