  md: '# # We Perceive What We Expect 1


    Our perception of the world around us is not a true depiction of what is actually
    there. We perceive, to a large extent, what we *expect* to perceive. Our expectations—and
    therefore our perceptions—are biased by three factors:


    +   * *the past*: our experience

    * *the present*: the current context

    * *the future*: our goals


    # # PERCEPTION BIASED BY EXPERIENCE


    Imagine that you own a large insurance company. You are meeting with a real estate
    manager, discussing plans for a new campus of company buildings. The campus consists
    of a row of five buildings, the last two with T-shaped courtyards providing light
    for the cafeteria and fitness center. If the real estate manager showed you the
    map shown in Figure 1.1, you would see five black shapes representing the buildings.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_11_0.png)


    FIGURE 1.1

    Building map or word? What you see depends on what you were told to see.


