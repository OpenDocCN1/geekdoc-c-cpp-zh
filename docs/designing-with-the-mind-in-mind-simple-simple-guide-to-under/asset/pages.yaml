  md: '# Fake heavyweight computations during hand-eye coordination tasks


    In interactive systems, some user actions require rapid updates successive adjustments—with
    hand-eye coordination—until the goal is achieved. Examples include scrolling through
    a document, moving a game character through a landscape, resizing a window, or
    dragging an object to a new position. If feedback lags behind user actions by
    more than 0.1 second, users will have trouble hitting their goal. When your system
    cannot update its display fast enough to meet this hand-eye coordination deadline,
    provide simulated feedback until the goal is clear and then apply the real operation.


    Graphics editors fake feedback when they provide rubberoutlines of objects that
    a user is trying to move or resize. Some document editing applications make quick-and-dirty
    changes to internal document data structures to represent the effect of user actions,
    and straighten things later.


    # Work ahead


    Work ahead of users when possible. Software can use periods of low load to compute
    responses to high-probability requests. There will be periods of low load because
    the users are human. Interactive typically spends a lot of time waiting for input.
    Don''t waste time! Use it to prepare what the user will probably want. If the
    user wants it, so what? The software it did in “free” time; it didn’t take time
    from anything else. Here are some examples of using background processing to work
    ahead of users:


    +   - A text search function looks for the next occurrence of the target word
    you look at the current one. When you tell the function to find the next occurrence
    of the word, it already has and so it seems very fast.

    - A document viewer renders the next page while you view the current page. When
    you ask to see the next page, it is already ready.


    # Process user input according to priority, the order in which it was received


    The order in which tasks are done often matters. Blindly doing tasks in the order
    in which they were requested may waste time and resources or create extra work.
    Interactive systems should look for opportunities to reorder tasks in their queue.
    Sometimes reordering tasks can make completing the set more efficient.


    Airline personnel use inconsequential input processing when they walk up and down
    check-lines for people whose flights are leaving very soon they can pull out of
    line and get them checked. In Web browsers, clicking the Back or Stop buttons
    on a link immediately aborts the process of loading and displaying the current
    page. Given how long it can take to load and display a Web page, the ability to
    abort a page load is critical to user acceptance.'
  merge: -1
