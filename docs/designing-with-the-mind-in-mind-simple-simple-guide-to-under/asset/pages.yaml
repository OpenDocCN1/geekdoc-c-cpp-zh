  md: '# Characteristics of short-term memory 83


    Miller’s characterization of the short-term memory limit naturally raises several
    questions.


    +   * What are the items in short-term memory?** They are current perceptions
    and retrieved memories. They are goals, numbers, words, names, sounds, images,
    odors—anything one can be aware of.


    +   * Why must items be unrelated?** Because if two items are related, they correspond
    to one neural activity pattern—and hence one item, not two.


    +   * Why the fudge-factor of plus or minus two?** Because researchers cannot
    measure with accuracy how much people can recall, and because of differences between
    individuals in how much they can remember.


    Later research in the 1960s and 1970s found Miller’s estimate presented to people
    to be too high. In the experiments considered, some of the items presented to
    people remember be “chunked” (i.e., related), making it appear that people’s short-term
    memory was holding more items than it actually was. When the experiments were
    revised to disallow unintended chunking, the capacity of short-term memory was
    shown to be more like four or minus one, that is, three to five items (Broadbent,
    1975).


    More research has cast doubt on the idea that the capacity of short-term memory
    should be measured in whole items or “chunks.” It turns out that in early short-term
    memory experiments, people were asked to recall remember items (e.g., words or
    images) that were quite different from each other, i.e., that had very few features
    in common. In such a situation, people don’t have to remember every feature of
    an item in order to recall it a few seconds later; some of its features is enough.
    People appeared to recall items as a whole, and therefore short-term memory capacity
    seemed measurable in whole items.


    Recent experiments have given people items to remember that were similar, i.e.,
    they shared features. In that situation, to recall an item and not confuse it
    with others, people need to remember more of its features. In these experiments,
    the finding was that people recall more details (i.e., features) of items than
    of others, and the items they remember in greater detail are the ones they pay
    more attention to—and therefore the capacity limit on short-term memory—is measured
    in item-features rather than whole items or “chunks” (Cowan, Chen, & Rouner, 2004).


    The second important characteristic of short-term memory is how volatile it is.
    Cognitive psychologists used to say that new items arriving in short-term memory
    often bump old ones out, but that way of describing the volatility is based on
    the view of short-term memory as a temporary storage *place* for information.
    The'
