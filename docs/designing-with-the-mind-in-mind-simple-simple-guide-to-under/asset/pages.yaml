  md: '# Limits on Attention, Shape,

    Thought and Action


    When people interact purposefully with the world around them, including computer
    systems, some aspects of their behavior follow predictable patterns, some of which
    result from the limited capacity of attention and short-term memory. When interactive
    systems are designed to recognize and support those patterns, they fit better
    with the way people operate. Some user interface rules, then, are based directly
    on the patterns and then indirectly on the limits of short-term memory and attention.
    This chapter describes six important patterns.


    # WE FOCUS ON OUR GOALS AND PAY LITTLE ATTENTION

    TO OUR TOOLS


    As Chapter 7 explained, our attention has very limited capacity. When people are
    doing a task—trying to accomplish a goal—most of their attention is focused on
    the goals and data related to that task. Normally, people devote little attention
    to the tools they are using to perform a task, whether they are using computer
    applications, online services, or interactive interfaces. Instead, people think
    about tools only superficially, and then when necessary.


    We are course capable of attending to our tools. However, attention (i.e., short-term
    memory) is limited in capacity. When people refocus their attention on tools,
    it is paid away from the details of the task. This shift increases the chances
    of users losing track of what they were doing or exactly where they were in it.


    For example, if your lawn mower stops while you are mowing your lawn, you will
    immediately stop and focus on the mower. Restarting the mower becomes your primary
    task, with the mower itself as the focus. You pay scant attention to any tools
    you use to restart the mower, just as you scant attention to the mower when your
    primary focus was the lawn. After you restart the mower and resume mowing the
    lawn, you probably won''t remember where you were in mowing the lawn, but the
    lawn itself shows you.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Other tasks—e.g., reading a document, measuring a table, counting goldfish
    in a fish tank—might not provide such a clear reminder of your interrupted task
    and your position in it. You might have to start from the beginning. You might
    even forget what you were doing altogether and go off to do something.

    That is why software design guidelines should state applications and most Web
    sites not call attention to themselves; should fade into the background and allow
    users to focus on their own goals. That guideline is even the title of a popular
    web design book: *Don''t Make Me Think* (Krug, 2005). The title means: if your
    software or Web site makes me think about it, rather than what I am trying to
    do, you''ve lost me.


    # WE USE EXTER AIDS TO KEEP TRACK OF WHAT WE ARE DOING


    Because our short-term memory and attention are so limited, we learn not to rely
    on them. Instead, we mark up our environment to show where we are in a task. Examples
    include these:


    +   - **Counting objects:** If possible, we move already counted objects into
    a different pile to which objects have already been counted. If we cannot move
    an object, we point to the last object counted. To keep track of the number we
    are on, we count on our fingers, draws or write numbers.

    - **Reading books:** When we stop reading, we insert bookmarks to show what page
    we were on.

    - **Arithmetic:** We learn methods of doing arithmetic on paper, or we use a calculator.

    - **Checklists:** We use checklists to aid our long-term and short-term memory.
    In either or rarely performed tasks, checklists help us remember everything that
    needs to be done. In that way, we augment faulty *long-term* memory. While doing
    the task, we check off items as we complete them. This is short-term memory aid.
    A checklist that isn''t marked up is hard to use, so we copy it and mark it.


    +   - **Editing documents:** People often keep to-be-edited documents, documents
    that are currently being edited, and already edited documents in separate folders.


    One implication of this pattern is that interactive systems should indicate what
    users have done versus what they have not done. Most applications do this by marking
    already-read versus unseen messages, most Web sites do it by marking visited versus
    unvisited links, and many applications do by marking completed steps of a multipart
    task (see Fig. 8.1).


    A second implication is that interactive systems should allow users to mark or
    move objects to indicate which ones they have worked on versus which ones they'
