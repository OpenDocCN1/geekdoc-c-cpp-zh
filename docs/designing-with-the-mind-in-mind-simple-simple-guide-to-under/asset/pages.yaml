  md: '# CHAPTER 8 Limits on Attention, Shape, Thought and Action


    # AFTER WE ACHIEVE A TASK''S PRIMARY GOAL,

    WE OFTEN FORGET CLEANUP STEPS


    The goal-execute-evaluate cycle interacts strongly with short-term-memory. This
    interaction makes perfect sense: short-term memory is really just what the focus
    of attention is at any given moment. Part of the focus of attention is our current
    goal. The rest of our attentional resources are directed toward obtaining the
    information needed to execute our current goal. The focus shifts as tasks are
    executed and the current goal shifts from high-level goals to lower-level ones,
    back to the next high-level goal.


    Attention is a very scarce resource. The brain does not waste it by focusing on
    anything that is no longer important. Therefore, when we complete a task, the
    attentional resources focused on task''s main goal are free to be focused on other
    information that is now more important. The impression we get is once we achieve
    a goal, everything related to it often immediately “falls out” of our short-term
    memory, i.e., we forget about it.


    One result is that people forget ends of tasks. For example, people often forget
    to do these:


    +   * Turn headlights AFTER off, to prevent the battery

    * Remove last pages of documents from copiers and scanners

    * Turn stove burners and ovens OFF after use

    * Add closing parentheses and quotation marks after typing text passages

    * Turn OFF signals after completing turns

    * Take books we they were reading on a flight with them when they exit the plane

    * Log out of public computers when finished using them

    * Set devices and software back to normal mode after putting them into a special
    mode


    These end-of-task short-term memory lapses are costly and avoidable. When they
    happen to us, we call ourselves “absent-minded,” but they are the result of how
    the brain works (or doesn''t), combined with a lack of support from our devices.

    To avoid such lapses, interactive systems can and be designed to remind people
    that loose-end stays remain. In some cases, it may be possible for the system
    to complete the task itself. For example:


    +   * Cars already turn-signals OFF after a turn.

    * Cars should (and now do) turn off headlights automatically when the car is no
    longer use, or at least remind that the lights are ON.

    * Copiers and scanners should automatically eject all documents when tasks are
    finished, or at least signal that a page has been left behind.

    * Stoves signal when a burner is left ON with post for longer than some suitable
    interval, and ovens should do likewise when left ON with nothing in them.'
