  md: 'consists of those elements of a scene that are the object of our primary attention,
    and the background is everything else.


    The Figure/Ground principle also specifies that the visual system''s parsing of
    scenes into figure and ground is influenced by characteristics of the scene. For
    example, when a small object or color patch overlaps a larger one, we tend to
    perceive the smaller object as the figure and the larger object as the ground
    (see Fig. 2.16).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_29_0.png)


    **FIGURE 2.16** When objects overlap, we see the smaller as figure on ground.


    However, our perception of figure vs. ground is not completely determined by scene
    characteristics. It also depends on the viewer''s focus of attention. Dutch artist
    M. C. Escher exploited this phenomenon to produce ambiguous images in which figure
    and ground switch roles as our attention shifts (see Fig. 2.17).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_29_1.png)


    **FIGURE 2.17** M. C. Escher exploited figure/ground ambiguity in his art.'
