    # GESTALT PRINCIPLES: COMBINED


    Of course, in real-world visual scenes, the Gestalt principles work in concert,
    not

    in isolation. For example, a typical Mac OS desktop usually exemplifies six of
    the

    seven principles described above (excluding Common Fate): Proximity, Similarity,

    Continuity, Closure, Symmetry, and Figure/Ground (see Fig. 2.22). On a typical
    desk-

    top, Common Fate is used (along with similarity) when a user selects several files

    folders and drags them as a group to a new location (see Fig 2.25).


    With all these Gestalt principles operating at once, unintended visual relation-

    ships can be implied by a design. A recommended practice, after designing a dis-

    play, is to view it with each of the Gestalt principles in mind—Proximity, Similarity,

    Continuity, Closure, Symmetry, Figure/Ground, and Common Fate—to see if the

    design suggests any relationships between elements that you do not intend.'
