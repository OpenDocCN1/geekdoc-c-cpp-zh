  md: '# A SHORT-TERM MEMORY TEST


    To test your short-term memory, get a pen or pencil and two blank sheets of paper
    and follow these instructions:


    +   1. Place one blank sheet of paper after this page in the book and use it to
    cover the next page.


    +   2. Flip to the next page for 3 seconds, pull the paper cover down and read
    the black numbers at the top, and flip back to this page. Don''t peek at other
    numbers on that page unless you want to ruin your test.


    +   3. Say your phone number backward, out loud.


    +   4. Now write down the black numbers from memory. ... Did you get all of them?


    +   5. Flip back to the next page for 3 seconds, read the red numbers (under the
    black ones), and flip back.


    +   6. Write down the numbers from memory. These would be easier to recall than
    the first ones if you noticed that they are the first seven digits of pi (3.141592),
    because then they would be only one number, not seven.


    +   7. Flip back to the next page for 3 seconds, read the green numbers, and flip
    back.


    +   8. Write down the numbers from memory. If you noticed that they are odd numbers
    from 1 to 13, they would be easier to recall, because they would be three chunks
    (“odd, 1, 13” from 1”), not seven.


    +   9. Flip back to the next page for 3 seconds, read the orange words, and flip
    back.


    +   10. Write down the words from memory. ... Could you recall them all?


    +   11. Flip back to the next page for 3 seconds, read the blue words, and flip
    back.


    +   12. Write down the words from memory. ... It was certainly a lot easier recall
    them all because they form a sentence, so they could be memorized as one sentence
    rather than seven words.'
