  md: '# LEARN FASTER WHEN RISK IS LOW


    Imagine you are visiting a foreign city on business for a week or two. You have
    spare time after your work duties are finished in the evenings and on weekends.
    Compare two possible cities:


    +   - You have been told that this city is easy to get around in: it is laid out
    in a consistent grid of streets and avenues with clear street and subway signs
    written in a language you understand, and the residents and police speak your
    language and are friendly to help tourists.

    - You have been warned that this city has a convoluted, confusing layout, with
    winding, poorly marked streets; the street and subway signs are in a language
    you cannot read, and residents don''t speak your language and are generally contemptuous
    of tourists.


    In which city are you more likely to go out exploring?

    Most interactive systems—desktop software, Web services, electronic applications—have
    more functionality than most of users ever try. People don''t even know about
    most of the functionality provided by software or gadgets they use every day.
    One reason for this is being "burned."


    People make mistakes. Many interactive systems make it easy for users to make
    mistakes, do not allow users to correct mistakes, or make it costly or time-consuming
    mistakes. People won''t be productive in using systems: they will waste too much
    time correcting or recovering from mistakes.


    Even more important than the impact on time is the impact on learning. A high-risk
    system, in which mistakes are easy to make and costly, discourages exploration:
    people who are anxious and afraid of making mistakes will tend to stick to familiar,
    safe paths and notions. When exploration is discouraged and anxiety is high, learning
    is severely hampered.


    In contrast, a low-risk system, in which mistakes are hard to make, low in cost
    and easy to correct, reduces stress and encourages exploration, and therefore
    fosters learning. With such systems, users are more likely to try new paths: "Hmm,
    I wonder what that does."


    To foster learning, interactive systems should be low-risk environments, users
    who are not afraid to explore and try new things. Designing software this way
    means the following:


    +   - Prevent errors where possible

    - Deactivate invalid commands

    - Make errors easy to detect by showing clearly what they have done (e.g., deleting
    a paragraph by mistake)

    - Allow users to undo, reverse, or correct errors easily'
