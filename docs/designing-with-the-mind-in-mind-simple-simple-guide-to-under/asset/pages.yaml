  md: '# Additional guidelines for achieving responsive interactive systems 167


    +   * Web or Database search function: When you search, the application displays
    items as soon as it finds them, while continuing to search for more.


    High-resolution images sometimes render slowly, especially in Web browsers. To
    decrease the perceived time for an image to render, the system can display the
    image quickly at low resolution and then re-render it at a higher resolution.
    Because the visual system processes images holistically, this appears faster than
    revealing a full-resolution image slowly from top to bottom (see Fig 12.3). Exception:
    For text, rendering a page at low resolution first and then substituting a higher
    resolution version is not recommended: it annoys users (Geelhoed et al., 1995).


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_169_0.png)


    (A)


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_169_1.png)


    (B)


    # FIGURE 12.3


    If displaying images takes more than two seconds, display the whole image first
    at low-resolution (A), not at full resolution from the top down (B).'
