    # GESTALT PRINCIPLE: CLOSURE


    Related to Continuity is the Gestalt principle of Closure, which states that our
    visual system automatically tries to close open figures so that they are perceived
    as whole objects rather than separate pieces. Thus, we perceive the disconnected
    arcs on the left of Figure 2.11 as a circle.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_26_1.png)


    FIGURE 2.11


    Closure: Human vision is biased to see whole objects, even when they are incomplete.


    Our visual system is so strongly biased to see objects that it can even interpret
    a totally blank area as an object. We see the combination of shapes on the right
    of Figure 2.11 as a white triangle overlapping another triangle and three black
    circles, even though the figure really only contains three V-shapes and three
    black pac-men.'
