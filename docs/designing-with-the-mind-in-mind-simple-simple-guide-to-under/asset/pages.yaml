    # IMPLICATIONS OF SHORT-TERM MEMORY CHARACTERISTICS

    FOR USER INTERFACE DESIGN


    The capacity and volatility of short-term memory have many implications for the
    design of interactive computer systems. The basic implication is that user interfaces
    should help people remember essential information from one moment to the next.
    Don''t require people to remember system state or what they have done, because
    their attention is focused on their primary goal and progress toward it. Specific
    examples follow.


    # Modes


    The limited capacity and volatility of short-term memory is one reason user-interface
    design guidelines often say to avoid designs that modes or provide adequate mode-feedback.
    In a modus user interface, some user actions have different effects depending
    on what the system is. For example:


    +   - In a car, pressing the accelerator pedal can move the car forwards, backwards
    or not at all, depending on whether the transmission is in drive, reverse, or
    neutral. The transmission sets a mode in the car''s user interface.

    - In digital cameras, pressing the shutter button can either snap a photo or start
    a video recording, depending on which mode is selected.'
