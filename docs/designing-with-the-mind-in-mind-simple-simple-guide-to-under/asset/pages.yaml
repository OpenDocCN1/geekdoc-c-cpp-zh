  md: '# 92 CHAPTER 7 Our Attention is Limited; Our Memory is Imperfect


    # IMPLICATIONS OF LONG-TERM MEMORY CHARACTERISTICS FOR USER INTERFACE DESIGN


    The main thing that the characteristics of long-term memory imply is that people
    need tools to augment it. Since prehistoric times, people have invented technologies
    to help them remember things over long periods: notched sticks, knotted ropes,
    mnemonics, verbal stories and histories retold around campfires, writing scrolls,
    books, number lists, checklists, phone directories, datebooks, accounting ledgers,
    oven timers, computers, portable digital assistants (PDAs), online shared calendars,
    etc.


    Given humankind has a need for technologies that augment memory, it seems clear
    software designers should try to provide software that fulfills their need. At
    the very least, designers should avoid developing systems that burden long-term
    memory. That is exactly what many interactive systems do not.


    Authentication is one functional area in which many software systems demand users''
    long-term memory. For example, a Web application developed a few years ago told
    users to change their personal identification number (PIN) to one that is easy
    ... to remember, but then imposed restrictions that made it impossible to do so
    (Fig. 7.5). Whoever wrote those instructions have realized that the PIN requirements
    were unreasonable, the instructions end by advising users to write down their
    PIN! Never mind that a PIN creates a security risk and adds yet another memory:
    users must remember where they hid their written-down PIN.


    A contrasting example of burden people''s long-term memory for the sake of security
    comes from Intuit.com. To purchase software, visitors must register. The site
    requires users to select a security question from a menu (see Fig. 7.6). What
    if you can''t recall any of the questions? What if you don''t recall your first
    name, your high school mascot, or any of the answers to the other questions?


    But that is when the memory burdens. Some questions could have several possible
    answers. Many people have elementary schools, childhood friends, or heroes. In
    order to register, they must choose a question and then remember which answer
    they gave to Intuit. How? By writing it somewhere. Then, Intuit.com asks them
    the security question, and they have to remember where they put the answer. Why
    burden people''s memory, when it would be to let users make up a security question
    for which they can easily recall the one possible answer?


    Unreasonable demands on people''s long-term memory counteract the security and
    productivity that computer-based applications supposedly provide (Schrage, 2005),
    as users:


    +   * place sticky notes or "hide" in desk drawers

    * contact customer support to recover passwords that they cannot recall

    * use passwords that are easy for others to guess

    * setup systems with no login requirements at all, or with shared login and password'
