    # Centered text


    One aspect of reading is highly automatic in most skilled readers eye movement.
    In automatic (fast reading), our eyes are trained to go back to the same horizontal
    position and down one line. If text is centered or right-aligned, each line of
    text starts in a different horizontal position. Automatic eye movements therefore
    take us back to the wrong place, so we must consciously adjust our gaze to the
    actual start of each line. This drops us out of automatic mode and slows us greatly.
    With poetry and wedding invitations, that is probably OK, but with any other type
    of text, it is a disadvantage. An example of centered text is provided by the
    Web site of FargoHomes, a real estate company (see Fig. 4.12). Try reading the
    text quite to demonstrate to yourself how your eyes move.


