  md: '# Monitor time compliance; decrease the quality of work to keep up


    An interactive system can measure how well it is meeting the real-time deadlines.
    If it is missing deadlines or determines that it is at risk of missing a pending
    deadline, it can adopt simpler, faster methods, usually resulting in a temporary
    reduction of the quality of its output. This approach must be based on real time,
    not on processor cycles, so that it yields some responsiveness on different computers.


    Some interactive animation use this technique. As described above, animation requires
    a frame rate of about 20 frames per second to be as smooth. In the late 1980s,
    researchers at Xerox Palo Alto Research Center (PARC) developed a software engine
    for presenting interactive animations that treats the frame rate as the most important
    aspect of the animation (Robertson, Card, & Mackay, 1989, 1993). If the graphics
    engine has trouble maintaining the minimum frame rate because the images are complex
    or the user is interacting with it, it simplifies its rendering, sacrificing details
    such as text labels, three-dimensional effects, highlighting and shading, and
    color. The idea is that it is better to reduce an animated three-dimensional image
    temporarily to a line drawing than it is to let the frame rate drop below the
    limit.


    The Cone Tree, developed at PARC, is based upon this graphics engine. It is an
    interactive display of a hierarchical data structure, such as file directories
    and subdirectories (Fig. 12.4). Users can grab any part of the tree and rotate
    it. While the tree


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_171_0.png)


    (A)


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_171_1.png)


    (B)


    FIGURE 12.4

    Cone-tree (A) renders folder labels as blobs while a user rotates the tree (B).'
