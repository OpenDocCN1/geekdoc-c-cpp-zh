    reading altogether.


    # Uncommon or unfamiliar vocabulary


    One way software disrupts reading is by using unfamiliar vocabulary—the intended
    readers don''t know well or at all.


    One type of unfamiliar terminology is computer jargon, sometimes known as "geek
    speak." For example, an intranet application displayed the following error message
    if a user tried to use the application after more than 15 minutes of letting it
