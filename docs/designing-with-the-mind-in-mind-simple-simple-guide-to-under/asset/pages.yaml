  md: 'users to master, the better, as long as it provides the required functionality.
    Less is more, provided that what is there fits well with users'' goals and tasks.

    For example:


    +   - In a To-Do List application, users need to be able to assign priorities
    of 1–10 items to items, or two priority levels – low and high – enough?


    +   - Does a Search function need to allow users to enter full Boolean expressions?
    If it allowed that, would significant number of people use it? If not, leave it
    out.


    +   - Does a ticket machine in a train station need to be able to offer tickets
    for train others out the routes that this station is on?


    In development efforts, there is pressure to add extra functionality “in case
    a user might want it.” Resist such pressure unless there is considerable evidence
    that a significant number of potential customers and users really need the extra
    functionality. Why? Because every concept increases the complexity of the software.
    It is one more thing but actually it is not just one more thing. Each concept
    in an application interacts with many other concepts, and those interactions result
    in more complexity. Therefore, as concepts are added to an application, the application’s
    complexity grows not just linearly, but multiplicatively (see Fig. 11.1).


    # Consistency


    The consistency of an interactive system strongly affects how quickly its users
    progress from controlled, consciously monitored, slow operation to automatic,
    unmonitored, faster operation (Schneider & Shifrin, 1977). The more predictable
    the operation of


