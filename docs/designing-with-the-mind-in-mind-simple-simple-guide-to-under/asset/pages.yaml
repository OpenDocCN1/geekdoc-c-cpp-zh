    a bit more about the brain and the mind.


    # WE HAVE THREE BRAINS


    We really have three brains, or if you prefer, a brain with three main parts,
    each of which affects different aspects of our thought and behavior (Weinschenk,
    2009):


    +   - **The old brain:** This is mainly the brain stem, where the spinal cord
    enters the base of the brain. It has been around since the first fish evolved.
    (Insects and mollusks, don''t have brains in the usual sense of the word.) The
    old brain classifies everything into three categories: edible, dangerous, or sexy.
    It also regulates the body''s automatic functions, such as digestion, breathing,
    and reflexive movement. Reptiles, amphibians, and most fish have only the old
    brain.

    - **The midbrain:** This part of the brain is "middle" in two senses: (a) physically,
    because it is located above the old brain and the cortex, and (b) evolutionarily,
    because it evolved after the old brain and before the new brain. The midbrain
    controls emotions; it reacts to things with joy, sadness, fear, aggressiveness,
    comprehenshensiveness, anger, et cet. Birds¹ and lower mammals have only an old
    brain and midbrain.


    > ¹Corvids (ravens, crows, and magpies) and some types of parrots (e.g. New Zealand
    kia) has no cortex, but they do large brains compared to other birds. They often
