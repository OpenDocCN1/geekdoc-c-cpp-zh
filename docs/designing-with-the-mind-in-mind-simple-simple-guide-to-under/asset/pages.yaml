  md: '# Engineering approximations of time constants: orders of magnitude 159


    # Duration of unbroken attention to a single task (“unit task”):

    ~ 10 seconds


    When people perform a task, they break it down into little pieces: subtasks. For
    example, buying airline tickets online consists of: (1) going to a travel or airline
    Web site, (2) entering the trip details, (3) scanning the results, (4) selecting
    a set of flights, (5) providing credit card information, (6) reviewing the purchase,
    and (7) finalizing the purchase. Some subtasks are broken down further, for example
    entering the trip origin, destination, dates, time, etc., piece by piece. This
    breaking down of tasks into subtasks ends with small subtasks that can be completed
    without a break in concentration, the subgoal and all necessary information either
    in working memory or directly perceptible in the environment. These bottom-level
    subtasks are called “unit tasks” (Card et al., 1983). Between unit tasks, people
    typically look up from their work, check to see if anything else requires attention,
    look out the window or take a sip of coffee. Unit tasks have been observed in
    activities such as editing documents, entering checkbox transactions, designing
    electronic circuits, and maneuvering jet planes in dogights, and they always last
    somewhere in the range of 6–30 seconds.


    # ENGINEERING APPROXIMATIONS OF TIME CONSTANTS:

    ORDERS OF MAGNITUDE


    Interactive systems should be designed to meet the temporal requirements of their
    human users. However, trying to design interactive systems for the wide variety
    of perceptual and cognitive time constants would be nearly impossible.


    But people design interactive systems are engineers, not scientists. We don''t
    have to account for the full variety of brain-related time constants and clockcycles.
    We have just to design interactive systems that work for human beings. This more
    appropriate requirement gives us the freedom to consolidate the perceptual and
    cognitive time constants into a smaller set that is easier to teach, remember,
    and use in design.


    Examining the list of critical durations presented above yields some useful groupings.
    Times related to sound perception are all on the order of a millisecond, so we
    can consolidate all into that value. Whether they are 1 millisecond or 2, or 3—we
    don''t care.


    Similarly, there are groups of durations around 10 milliseconds, 100 milliseconds,
    1 second, 10 seconds, and 100 seconds. Above 100 seconds, we are beyond that most
    interactive designers care about. Thus, for designing interactive systems, these
    consolidated deadlines provide the required accuracy:


