  md: '# # Our Attention is Limited;

    Our Memory is Imperfect


    Just as the human visual system has strengths and weaknesses, so does human memory.
    This chapter describes some of those strengths and weaknesses as background for
    understanding how we design interactive systems to support and augment human memory
    rather than burdening or confusing it. We will start with an overview of how memory
    works.


    # ## SHORT VS. LONG-TERM MEMORY


    Psychologists historically have distinguished short-term memory from long-term
    memory. Short-term memory covers situations in which information is retained for
    very short intervals ranging from a fraction of a second to several seconds—perhaps
    as long as a minute. Long-term memory covers situations in which information is
    retained over longer periods, e.g., minutes, hours, days, years, even lifetimes.\
    It is tempting to think of short-term and long-term memory as separate memory
    stores. Indeed, some theories of memory have considered them separate. After all,
    in a digital computer, the short-term memory stores (central processing unit registers)
    are separate from the long-term memory stores (random access memory or RAM, hard
    disk, flash memory, CD-ROM, etc.). More evidence comes from findings that certain
    parts of the human brain result in short-term memory deficits but not long-term
    ones, or vice versa. The speed with which information or plans can disappear from
    our immediate awareness contrasts sharply with the seeming permanence of our memory
    of important events in our lives, faces of significant people, activities we have
    practiced, and information we have studied. These phenomena led many researchers
    to theorize that short-term memory is a separate store in the brain where information
