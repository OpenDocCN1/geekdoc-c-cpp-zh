  md: '# INTENDED AUDIENCE OF THIS BOOK


    This book is intended mainly for software development professionals who have to
    apply user-interface and interaction design guidelines. This of course includes
    inter-action designers, user-interface designers, and user-experience designers,
    graphic designers, and hardware product designers. It also includes usability
    testers and evaluators, who often refer to design heuristics when reviewing software
    or analyzing observed usage problems.


    A second audience for this book is software development managers who want enough
    of a background in the psychological basis for user-interface design rules to
    understand and evaluate the work of the people they manage.'
