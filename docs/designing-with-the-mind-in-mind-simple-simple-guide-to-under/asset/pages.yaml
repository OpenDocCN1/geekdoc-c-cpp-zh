  md: '# Introduction


    # USER-INTERFACE DESIGN RULES: WHERE DO THEY COME FROM AND HOW CAN THEY BE USED
    EFFECTIVELY?


    For as long as people have been designing interactive computer systems, some have
    attempted to promote good cognition by publishing user-interface design guidelines
    (also called design rules). Early ones included:


    +   - Cheriton (1976) proposed user-interface design guidelines for early interactive
    (time-shared) computer systems.

    - Norman (1983a, 1983b) presented design rules for software user interfaces based
    on human cognition, including cognitive errors.

    - Smith and Mosier (1986) wrote perhaps the most comprehensive set of user-interface
    design guidelines.

    - Shneiderman (1987) included “Eight Golden Rules of Interface Design” in the
    first edition of his book Designing the User Interface and in all later editions.

    - Brown (1988) wrote a book of design guidelines, appropriately titled Human-Computer
    Interface Design Guidelines.

    - Nielsen and Molich (1990) offered a set of design rules for use in heuristic
    evaluation of user interfaces.

    - Marcus (1991) presented design rules for graphic design in online documents
    and user interfaces.


    In the twenty-first century


    How valuable are user-interface design guidelines? That depends on who applies
    them to design problems.


    # USER EXPERIENCE DESIGN AND EVALUATION REQUIRES UNDERSTANDING AND EXPERIENCE


    Following user-interface design guidelines is not as straightforward as following
    cooking recipes. Design rules often describe goals rather than actions. They are
    purposefully'
