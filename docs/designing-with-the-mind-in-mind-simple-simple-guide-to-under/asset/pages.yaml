  md: '# Our thought cycle: goal, execute, evaluate


    # OUR THOUGHT CYCLE: GOAL, EXECUTE, EVALATE


    Over many decades, scientists studying human behavior have found a cyclical pattern
    that seems to hold across a wide variety of activities:


    +   - Form a goal, e.g., open a bank account, or eat a peach, or delete a word
    from a document

    - Choose and execute actions to try to make progress toward the goal

    - Evaluate whether the actions worked, i.e., whether the goal has been reached
    or is nearer than before

    - Repeat until the goal is reached (or appears unreachable)


    People cycle through this pattern constantly (Coran, Moran & Newell, 1983). In
    fact, we run through it at many different levels simultaneously. For example,
    we might be trying to insert a picture into a document, which is part of a larger
    task of writing a paper, which is part of a higher-level task of passing a history
    course, which is part of a higher task of completing college, which is part of
    a higher-level goal of getting a good job, which we want in order to achieve our
    top-level goal of having a comfortable life.


    As an example, let''s run through the cycle for a typical task: buying an airline
    ticket online. The first person performs the primary goal of the task and then
    begins to break down into actions that appear to lead toward the goal. Promising
    actions are selected for execution, executed, and then evaluated to determine
    if they have moved the person closer to the goal.


    +   - Goal: Buy airline ticket to Berlin, using your favorite Web site.

    - Step 1: Go to travel Web site. You are still far from the goal.

    - Step 2: Search for suitable flights. This is a very normal, predictable step
    at travel sites.

    - Step 3: Look at search results. Choose a flight from those listed. If no flights
    on the results list are suitable, return to Step 2 with new search criteria. You
    are not at the goal, but you feel confident of getting there.

    - Step 4: Go to checkout. Now you are getting close to check your goal that you
    can almost smell it.

    - Step 5: Confirm flight details. Check it—all correct? If no, back up; otherwise
    proceed. Almost done.

    - Step 6: Purchase ticket with credit card. Check credit card information. Everything
    look OK?

    - Step 7: Print e-ticket. Goal achieved.'
