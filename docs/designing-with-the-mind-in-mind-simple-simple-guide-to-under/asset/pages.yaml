  md: '# VISUAL HIERARCHY LETS PEOPLE FOCUS ON THE RELEVANT INFORMATION


    One of the most important goals in structuring information presentations is to
    provide a visual hierarchy—an arrangement of the information that:


    +   - Breaks the information into distinct sections, and breaks large sections
    into subsections


    +   - Labels each section and subsection prominently and in such a way as to clearly
    identify its content


    +   - Presents the sections and subsections as a hierarchy, with higher level
    sections presented more strongly than lower level ones


    A visual hierarchy allows people, when scanning, to separate what is relevant
    from what is irrelevant, and to focus their attention on the relevant information.
    Find what they are looking for more quickly because they can skip everything else.


    Try it yourself. Look at the two information displays in Figure 3.11 and find
    the information about prominence. How much longer does it take you to find it
