  md: '# SUMMARY


    The goal of this chapter is to explain and demonstrate the factors that affect
    how quickly people can learn to use interactive systems so proficiently that operating
    the system is handled largely by automatic cognitive processes. We learn to use
    interactive systems faster under the following conditions:


    +   - Their operation is based on users'' goals and tasks (not on the implementation
    of the system), conceptually simple, and consistent


    +   - The vocabulary they employ is familiar to users, is based on that of the
    task domain, and is used consistently in the sense that it maps terms onto concepts
    1:1


    +   - They provide a low-risk environment, in which errors are difficult to make
    and, when users do make errors, they are low in cost and easy to correct.'
