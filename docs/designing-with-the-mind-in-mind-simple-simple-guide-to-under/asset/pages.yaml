    Also available as potential input to our attention mechanisms are long-term memories
    reactivated through recognition or recall. As explained above, each memory corresponds
    to a specific pattern of neural activity distributed across our brain. While activated,
    a memory pattern is a candidate for our attention.


    The human brain has multiple mechanisms, some voluntary and involuntary. We focus
    awareness on a very small subset of the perceptions and activated long-term memories
    while ignoring everything else. That tiny subset of all available information
    from our perceptual systems and our long-term memories that we are conscious of
    right now is the main component of short-term memory, the part that cognitive
    scientists often call working memory.


    Don''t think of working memory as a temporary buffer where perceptions and memories
    are brought to our brains to work on them. Instead, think of it as we are aware
    of the combined focus of attention—the currently activated neural patterns of
    which. The number of items in short-term memory at any given moment is extremely
    limited and volatile.


    What about the earlier finding that damage to some parts of the brain causes short-term
    memory deficits, while other types of brain damage cause long-term memory deficits?
    The current interpretation of that finding is that some types of damage decrease
    or eliminate the brain''s ability to focus attention on specific objects and events,
    while other types of damage harm the brain''s ability to store or recall long-term
    memories.


    # CHARACTERISTICS OF SHORT-TERM MEMORY


    Short-term memory, as described above, is equal to the focus of our attention.
    Whatever is in that focus is what we are conscious of at any moment.


    Right now you are conscious of the last few words and ideas you''ve read, but
    probably not the color of the wall in front of you. But now if you have shifted
    your attention, you are conscious of the wall''s color, and may have forgotten
    some of the ideas you read on the previous page.


    The primary characteristics of short-term memory are its low capacity and its
    volatility.


    The low capacity of short-term memory is fairly well known. Many college-educated
    people have read about "the magical number seven, plus or minus two," proposed
    by cognitive psychologist George Miller in 1956 as the limit on the number of
    simultaneous unrelated items in human short-term memory (Miller, 1956).'
