  md: '# CHAPTER 8 Limits on Attention, Shape, Thought and Action


    In the airline ticket example, to keep the example short, we didn''t get into
    the details of each step. If we had, we would have seen substeps that followed
    the goal-execute-evaluate cycle.


    Let''s try another example, this time the details of the high-level steps. This
    time the task is sending flowers to a friend. If we simply look at the top level,
    we see the task like this:


    Send flowers to friend.


    If we want the example goal-execute-evaluate cycle for this task, we must break
    this task down into a bit. We must ask, how do we send flowers to a friend? To
    do that, we break the top-level task down into subtasks.


    +   * Send flowers to friend.

    * Find delivery Web site.

    * Orders to be delivered to friend.


    For many purposes, the two steps we have identified are enough detail. After we
    execute each step, we evaluate whether we are closer to our goal. But how is step
    executed? To see that, we have to treat each major step as a subgoal, and break
    it down into substeps.


    +   * Send flowers to friend.

    * Find delivery Web site.

    * Open browser.

    * Go to Google search page.

    * Type "flower delivery" into Google.

    * Scan the first page of search results.

    * Visit some of the listed links.

    * Choose a delivery service.


    +   * Orders to be delivered to friend.

    * Review service''s flower selection.

    * Choose flowers.

    * Specify delivery address and date.

    * Pay for flowers and delivery.


    After each substep is executed, we evaluate to see if it is getting closer to
    the subgoal of which it is. If we examine how a substep is executed and evaluated,
    we have to treat it as a subgoal and break it into its component steps.


    +   * Send flowers to friend.

    * Find delivery Web site.

    * Open browser.

    * Click browser icon on taskbar, startup menu, or desktop.


    +   * Go to Google search page.

    * If Google isn''t browser''s starting page, choose Google from favorites list.

    * If Google is not on favorites list, type "Google.com" into browser''s address
    box.'
