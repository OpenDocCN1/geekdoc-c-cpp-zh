  md: '# We Have Time

    Requirements 12


    Events in the world take time to play out. Perceiving objects and events also
    take time. So remembering perceived events, thinking about past and future events,
    learning from events, acting on plans, and reacting to perceived and remembered
    events. How much time? And how does knowing the duration of perceptual and cognitive
    processes help us design interactive systems?


    This chapter provides answers to those questions. It presents the durations of
    perceptual and cognitive processes, and based on those, provides some real-time
    deadlines that interactive systems must meet in order to synchronize well with
    human users. Systems that don''t synchronize with users'' time requirements are
    less effective today, and they are perceived as unresponsive.


    The second issue, responsiveness, may seem less important than effectiveness,
    but in fact it is more important. Over the past four decades, researchers have
    found consistently that an interactive system''s ability to keep up with users,
    keep them informed about its status, and not make them unexpectedly—is the most
    important factor in determining user satisfaction. It is not just one of the most
    important factors; it is the most important factor. It is more important than
    of learning. It is more important than ease of use. Study after study has confirmed
    this finding (Barber & Lucas, 1983); Carroll & Rosoll, 1984; Lambert, 1984; Miller,
    1968; Rushnik & Rushnik, 1986; Shneiderman, 1984; Thadhani, 1981).


    This chapter first defines responsiveness. It enumerates some important time constants
    of human perception and cognition. It ends with real-time guidelines for interactive
    system design, including examples.


    > Some researchers have suggested that for users'' perception of the loading speed
    of Web sites, the causality may go the other way: the more successful people have
    at a site, the faster they think it is, even when their ratings don''t correlate
    with the sites'' actual speed (Perfetti & Landesman, 2001).


    Designing with the Mind in Mind

