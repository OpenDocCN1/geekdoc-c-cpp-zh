  md: '# 2 CHAPTER 1 We Perceive What We Expect


    Now imagine that instead of a real estate manager, you are meeting with an advertising
    manager. You are discussing a billboard to be placed in certain markets around
    the country. The advertising manager shows you the same image, but in this scenario
    the image is a sketch of the ad, consisting of a single word. In this scenario,
    you see a word, clearly and unambiguously.


    When your perceptual system is primed to see building shapes, you see building
    shapes, and the white areas between the buildings barely register in your perception.
    When your perceptual system has been primed to see text, you see text, and the
    black areas between the letters barely register.


    A relatively famous example of how priming the mind can affect perception is a
    sketch, supposedly by R. C. James,¹ that initially looks to most people like a
    random splattering of ink (see Fig. 1.2). Before reading further, look at the
    sketch.


    ![](img/ad2531f1d746bd24ecf5f52be3ad32e8_12_0.png)


    FIGURE 1.2

    Image showing the effect of mental priming of the visual system. What do you see?


    Only after you are told that it is a Dalmatian dog sniffing the ground near a
    tree can your visual visual system organize the image into a coherent picture.
    Moreover, you’ve “seen” the dog, it is hard to go back to seeing the image as
    a random collection of spots.


    > ¹Published in Marr D. (1982) Vision. W. H. Freeman, New York, NY, p. 101, Figure
    3-1.'
