    # Design implications: minimize the need for reading


    Too much text in a user interface loses poor readers, who are unfortunately a
    significant portion of the population. Too much text even alienates good readers:
    it turns an interactive system into an intimidating amount of work.


    Minimize the amount of text in a user interface; do not present users with long
    blocks of text to read. In instructions, use the least amount of text that gets
    most users to their intended goals. In a product description, provide a brief
    overview of the product and let users request more detail if they want it. Technical
    writers and content editors can assist greatly in this. especially benefit from
    our advice on how to eliminate unnecessary text, see Krug (2005) and Redish (2007).'
