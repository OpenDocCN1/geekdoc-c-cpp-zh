  md: '# A modern view of memory 81


    the areas around neurons that change their sensitivity to stimulation for fairly
    long periods of time, until the chemicals dissipate or are neutralized by other
    chemicals. More permanent changes consist of neurons growing and forming new connections
    with other neurons.


    Activating a memory consists of reactivating the same pattern of activity that
    occurred when the memory was formed. Somehow the brain distinguishes initials
    of neural patterns from reactivations—perhaps by measuring the ease with which
    the pattern was reactivated. New perceptions very similar to the original reactivate
    the same patterns of neurons, resulting in recognition if the deactivated perception
    reaches awareness. In the absence of a sensory perception, stimulation from other
    parts of the brain can also react a pattern of neural activity, which if it reaches
    awareness results in recall.


    The more a neural pattern is reactivated, the “stronger” it becomes—that is, the
    easier it is to reactivate—in turn means that the perception it is easier to recognize
    and recall. Neural memory patterns can also be strengthened or awakened by excitatory
    or inhibitory signals from other parts of the brain.


    A particular memory is not located in any specific spot in the brain. The neural
    activity pattern comprising a memory involves a network of neurons extending over
    a wide area. Activity patterns for different memories overlap, depending on what
    they show. Removing, damaging, or inhibiting neurons in a particular part of the
    brain typically does not completely wipe out the memories that involve those features.
    However, some areas in a neural activity pattern may be critical pathways, so
    that removing, damaging, or inhibiting them may prevent most of the pattern from
    activating, thereby effectively eliminating the memory.


    # Short-term memory


    The processes discussed are about long-term memory. Memory is short-term memory
    in all of these? The answer is suggested by the word “awareness.”


    Short-term memory is not a store—it is no place where memories and perceptions
    go to worked on. More precisely, it is not a temporary repository for information
    brought in from the sensory system or retrieved from long-term memory. Instead,
    short-term memory is a combination of phenomena arising from perception and attention.


    Each of perceptual senses has its own very brief short-term “memory” that is the
    result of residual neural activity after a perceptual stimulus, like a bell that
    rings briefly after it is struck. Until they fade away, these residual perceptions
    are available as possible input to our brain’s attention mechanisms, which integrate


