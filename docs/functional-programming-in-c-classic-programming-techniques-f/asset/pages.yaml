  md: "The first line assigns a value to a. The second line calculates b from a, by\
    \ applying a calculation. Finally, the third line calculates c from b, again by\
    \ applying a calculation. Instead of performing these calculations directly, you\
    \ could create functions like this:\n\n```\nint CalcB(int a) {\n  return a * 3;\n\
    }\n\nint CalcC(int b) {\n  return b + 27;\n}\n\nint a = 10;\nint b = CalcB(a);\n\
    int c = CalcC(b);\n```\n\nIn real-world application, it is quite likely that you\
    \ would have helper functions similar (in structure, not in the calculations themselves!)\
    \ to CalcB and CalcC. Imagine you have a particular algorithm somewhere in your\
    \ application that starts with values and needs to calculate c from them — in\
    \ other words, you are not interested in b at all. There are several things you\
    \ could do now. For instance, you could create a new function CalcCFromA:\n\n\
    ```\nint CalcCFromA(int a) {\n  return a * 3 + 27;\n}\n```\n\nThat is not a very\
    \ good idea because you might need the original functions elsewhere, and of course\
    \ it's generally a good guideline to separate functionality as much as possible,\
    \ which leads to several small functions that each do one thing. Instead, you\
    \ could implement the function like this:\n\n```\nint CalcCFromA(int a) {\n  return\
    \ CalcC(CalcB(a));\n}\n```\n\nThis is much better, and you will see in many that\
    \ this is very close to what composition does, too. Composition goes one step\
    \ further, by allowing you to create the new function in the context instead of\
    \ at the class level, as the previous example assumes. To reuse the function,\
    \ within a particular algorithm that needs it, you could create an anonymous function:\n\
    \n```\nPunc<int, int> calcCFromA = a => CalcC(CalcB(a));\n```\n\nFCSlib contains\
    \ a helper function called Compose that updates this source. Here it is:\n\n```\n\
    public static Func<TSource, TEndResult>\nCompose<TSource, TIntermediateResult,\
    \ TEndResult>(n  this Func<TSource, TIntermediateResult> func1,\n  Punc<TIntermediateResult,\
    \ TEndResult> func2) {\n  return sourceParam => func2(func1(sourceParam));\n}\n\
    ```"
