  md: '# Refactoring | 213


    possible scenarios, but it is representative of any real-world filtering operation
    you may perform in your own applications. This example filters for names with
    an "a" in them while your application may be filtering for those customers who
    are in the top 10 percent of the list of customers who have spent a million dollars
    for services related to category C contracts. The point is it doesn''t matter
    what you''re filtering for — there are reasonable assumptions that the filtering
    operation can be quick and that it has to deal with large numbers of objects.


    In these reasons, it would be good to consider parallelizing the implementation
    of FilterData. Unfortunately, this is almost impossible without major changes
    to the structure of the code. The main problem in the current implementation is
    the data storage, specifically with those class-level fields for displayPeople
    and displayCount.


    The people array and the maxPeople aren''t so important because they are regarded
    as read-only by the algorithm. Of course it would be possible to change the read/write
    array for an immutable List<T> implementation as in Chapter 16 — that would easily
    eliminate issues around data changes.


    displayPeople and displayCount are the main issues in this implementation. The
    FilterData algorithm changes both variables, and what''s more, they need to be
    kept in sync. Any change to FilterData that execute the actual business logic
    in parallel multiple times would also break the synchronization between displayPeople
    and displayCount.


    In addition, there is at least one core area in the class where the values are
    also changed: ResetDisplayPeople method. This is one more point that has to be
    synchronized when parallelization is considered. As a result, if no changes were
    to be made to the algorithmic structure of the program, you''d have to place locks
    around all pieces of code that make changes to displayPeople and displayCount.


    These days are all sorts of fancy locks, which may allow certain types of access
    to run in parallel, while other access types are blocked. The weight of locking
    is also being reduced. But the fact remains locking is an enemy of parallelization.
    Any type of lock restricts the degree of parallelization you can achieve in your
    course, because for it a lock says "here is a piece of code that can''t run in
    parallel.".


    There are probably algorithms in the world that cannot be implemented without
    locking, or are actually more efficient when implemented that, with the help of
    locks, or at least in certain runtime environments. The goal is to try to live
    without locks as much as possible because high degree of parallelization is beneficial.


    Remember one of the core ideas of functional programming: the pure function. A
    pure function is a nicely-contained element that isn''t supposed to do much, if
    anything, outside its scope. It is a perfect building for parallelizable systems.
    In stage 1, the sample application neglects the principles of pure functions entirely
    because important data are stored in a place where they can be accessed and changed
    arbitrarily by all methods in the class.


    The second stage of the sample, ShowFilteredListBetter, differs from stage 1 in
    several ways. At the top of Form1.cs, the data storage now looks like this:


    ```

    List<Person> people;

    ```'
