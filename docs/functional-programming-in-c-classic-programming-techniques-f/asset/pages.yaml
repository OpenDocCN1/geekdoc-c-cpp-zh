  md: "use tail calls. The examples in this section are not going to take things too\
    \ far because the restrictions with tail call optimization mean recursion in C#\
    \ will never be the all-encompassing tool it is in full functional languages\n\
    \nFor a simple introduction, look at this function:\n\n```\nstatic int Times3(int\
    \ x) {\n    return x * 3;\n}\n```\n\nThe obvious task is that the function performs\
    \ of multiplying the input value by 3. The not-so-obvious task is to return the\
    \ statement. Implementing a function like this is so natural that you don't notice\
    \ yourself doing it, but the step of returning the value with a return statement\
    \ has consequences for the overall structure of algorithm implementation. For\
    \ instance, to calculate the result of 5 times and output the result on the console,\
    \ this is what you would do:\n\n```\nConsole.WriteLine(Times3(5));\n```\n\nThe\
    \ point is that you are calling your calls by nesting them due to the return values\
    \ work syntactically in C#. This is intuitive in a mathematical sense, but from\
    \ the sequential point of view common to imperative languages, it isn't intuitive\
    \ at all — the innermost of the partial expression is actually calculated first,\
    \ but the outermost part\n\nThe continuation in the term continuation passing\
    \ style is meant to be the \"rest of the calculation,\" or even \"rest of the\
    \ process\" in the context of a larger algorithm, at any given point in a process\
    \ or calculation. So, at the point where you are calculating the result of 5 times,\
    \ the continuation would be the operation that outputs that result on the console.\n\
    \nFor example, here's an expression that has more than one step: a * (b + c).\
    \ Using function call syntax, you can write this as Mult(a, Add(b, c), c) in C#.\
    \ Outputting the result (as a placeholder for one operation that utilizes the\
    \ result once it's calculated) is an additional step. The sequence of steps is\
    \ as follows:\n\n+   1. Add b and c.\n2. Multiply the result by a.\n3. Output\
    \ the result.\n\nAt the point where step 1 is being performed, the continuation\
    \ is the sequence of steps 2 and 3. At the point where step 2 is performed, the\
    \ continuation is step 3.\n\nImplementing the Times3 function in continuation\
    \ passing style means passing the function an argument that represents the continuation.\
    \ In reality, functions that use CPS can easily return values, but for this return\
    \ statement is going to be replaced by a call to the continuation. Here's the\
    \ implementation:\n\n```\nstatic void TimesCPS(int x, Action<int> continuation)\
    \ {\n    continuation(x * 3);\n}\n```"
