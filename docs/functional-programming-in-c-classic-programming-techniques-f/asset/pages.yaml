  md: "Now, consider this example, using partial application with the FoldL function:\n\
    \n```\nvar curriedFoldL = Functional.Curry(Functional.FoldLDegate<int, int>());\n\
    var sumList = curriedFoldL((r, v) => r + v)(0);\n```\n\nIn this example, a new\
    \ function sumList is created from Functional.FoldL, by applying both the folding\
    \ algorithm and the starting value, and leaving the list parameter.\n\nIn contrast\
    \ to the Map function, FoldL has three parameters, the chain of functions returned\
    \ by Curry has three elements: two that return immediately and one that returns\
    \ the final result. In this case, two of these parameters are applied immediately,\
    \ leaving just one open. This makes the format returned by Curry slightly inefficient,\
    \ because it leaves intermediate anonymous functions that are not actually used.\
    \ On the other hand it might make sense to apply the algorithm, leaving two parameters\
    \ open:\n\n```\nvar sumList = curriedFoldL((r, v) => r + v);\nvar result = sumList(0)(list);\n\
    ```\n\nHere it is more obvious — sumlist is a chain of functions, which has overhead\
    \ when called, and also in the same unusual syntax involving two parameter lists.\n\
    \nCurrying of functions can be performed for a variety of reasons, and in some\
    \ cases it is necessary to have the entire parameter list split up into a chain\
    \ of functions with the same number of elements as the parameter list. But when\
    \ currying is applied to partial application, it is regularly unnecessary to have\
    \ all the elements in the chain. Instead, one or more parameters can be applied\
    \ directly, without the intermediate full currying. For instance, FCSlib provides\
    \ several overloads of a function call that can be used with FoldL:\n\n```\npublic\
    \ static Func<T2, T3, TR>\nApply<T1, T2, T3, TR>(Func<T1, T2, T3, TR> function,\
    \ T1 arg)\n    return (arg2, arg3) => function(arg, arg2, arg3);\n\n```\n\nThe\
    \ overloads provided by FCSlib cover different Func types as well as Action types,\
    \ with up to nine parameters, and all cases of applying up to n-1 parameters,\
    \ where n is the total number of parameters that a function has. As a result,\
    \ it is possible to rewrite the applications of FoldL in either one of these forms:\n\
    \n```\nvar sumList = Functional.Apply(\nFunctional.FoldLDegate<int, int>(), (r,\
    \ v) => r + v, 0);\n\nvar sumList = Functional.Apply(\nFunctional.FoldLDegate<int,\
    \ int>(), (r, v) => r + v);\n```\n\nThe result is the same: a new function that\
    \ has either one or two parameters applied leaving the remaining ones open. In\
    \ the latter case, the syntax changes back to the more natural form with just\
    \ one parameter list:\n\n```\nvar result = sumList(0, list);\n```"
