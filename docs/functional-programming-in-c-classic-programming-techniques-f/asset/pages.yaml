  md: "When you need to decide whether to specify types explicitly generic method\
    \ calls or not, you should keep in mind that a reader of your code will have to\
    \ go through the type inference steps as the compiler in order to fully understand\
    \ how the method is called. Complex scenarios involving a large number of generic\
    \ parameters as well as non-generic methods can be complicated and it may be a\
    \ better strategy to mention types explicitly. Many programmers also view type\
    \ inference in C# as a feature they use only when needs, not as a general tool\
    \ to be used whenever possible. Make sure that your strategy of mentioning or\
    \ leaving out types is understood and accepted by your team members.\n\nHere is\
    \ a slightly complex (as well as useful) example of a generic method:\n\n```\n\
    static void Apply<T>(IEnumerable<T> sequence, Action<T> action) {\n  foreach (T\
    \ item in sequence) {\n    item(item);\n  }\n}\n```\n\nAgain, there is a type\
    \ parameter T, but this time it's used in both parameters of the method. There's\
    \ a connection being established: the first parameter is a sequence of \"things\"\
    , and the second is a delegate that has a parameter of \"thing\" that is in the\
    \ sequence. This is where generics provides powerful because there're no way to\
    \ express the same without them and still keep the method flexible to work with\
    \ different types.\n\nThe method Apply is another example of the statement that\
    \ generic elements don't really care about the types themselves. In this case,\
    \ Apply provides a useful abstraction of a certain algorithm: iterating over a\
    \ list and applying a function to each element. Given the right parameters, the\
    \ method isn't actually interested in what it's working. The benefit is there\
    \ for the consumer of the method, in the strict type checking the compiler can\
    \ perform.\n\nHere's a call to Apply:\n\n```\nvar values = new List<int> { 10,\
    \ 20, 35 };\nApply(values, v => Console.WriteLine(\"Value: {0}\", v));\n```\n\n\
    Take a look at all the interesting things happening in this example. values is\
    \ a list of int values, the generic parameter to the List class declares explicitly.\
    \ Apply is called, but the generic parameter is left out. The compiler needs to\
    \ infer the type of T for the Apply call, and it does this by looking at the parameters.\
    \ It finds values, of type List<int>, which implements IEnumerable<int> — so the\
    \ type T from the point of view of the method Apply must be int.\n\nMoving on,\
    \ the compiler performs type inference for the lambda expression that was passed\
    \ as the second parameter. The parameter v must be an int, because the type for\
    \ Apply has been inferred as being an int already. The compiler checks whether\
    \ the code in the body of the lambda is compatible with being an int, which is\
    \ the case here.\n\nThere are numerous potential issues that could be found right\
    \ away with the compiler, due to the typing by generics. If you're interested,\
    \ play around in Visual Studio a bit and find ways of breaking the code based\
    \ on the types — the compiler should catch them all."
