  md: '# INTRODUCTION


    # WHAT THIS BOOK COVERS


    The language of the vast majority of examples in this book is C# 4.0, running
    on Microsoft .NET. There are a few examples in other languages, but they are for
    illustrative purposes only. If you want to try out the examples for yourself,
    but you are not on C# 4.0 or Visual Studio 2010, you may still have success with
    C# 3.0 and Visual Studio 2008 - there aren''t many new features in C# 4.0, and
    none of them have been exploited in the examples. However, a few examples utilize
    .NET Framework features like Parallel Extensions, which are available only in
    .NET 4.0.


    The book introduces you to concepts of functional programming and describes how
    these can be used with the C# language. An effort has been made to provide samples
    with a practical background, but most of them still focus mostly on level considerations.
    Functional programming is a technique for code, algorithm and program structure
    - as opposed to, for instance, application architecture. Of course it needs to
    fit in application architecture ... you get the point: it''s hard to find the
    perfect compromise between being theoretical and going off-focus, but I''ve tried
    it.


    While I wrote this, I developed a library of functionally oriented helpers, called
    FCSlib(that''s “Functional Sharp Library”). You can use this library in your projects
    as you like, but please note that it doesn''t come with any warranty. The downloadable
    file containing the library code (more information about downloads in the upcoming
    section "Source Code") includes a copy of the LGPL license, which applies to the
    FCSlib code.


    # HOW THIS BOOK IS STRUCTURED


    This book has four parts. The first part provides an overview of functional programming,
    both from a historical and a current point of view. Part II proceeds to give you
    the C# background you''ll need to understand the more complex examples that follow
    later. Again, reading this is recommended if ever you know C# — it has a few pretty
    basic items, but generally it''s not meant to be a language introduction for novices.


    Part III is the most important one. Its 10 chapters describe a variety of functional
    programming topics from a C# point of view, showing lots of examples and code
    snippets. The code library that accompanies this book, FCSlib, is built on the
    ideas described in this part.


    Finally, Part IV gives you an overview of practical concerns of using functional
    programming in C#. I picked a few specific scenarios, and there are descriptions
    of functional programming ideas in existing products and technologies that you
    may feel familiar with.


    # WHAT YOU NEED TO USE THIS BOOK


    All code in this book has been tested with Visual Studio 2010, C# 4.0 and .NET
    4.0. Much of it has been originally developed on C# 3.0, so you should have good
    success running the code on .NET 3.5. Going back further than that would mean
    major rewrites in many areas — the concepts'
  merge: -1
