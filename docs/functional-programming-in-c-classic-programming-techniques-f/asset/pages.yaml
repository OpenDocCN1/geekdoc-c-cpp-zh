    \ where the need isn't really clear.\n\nFinally, of course, lazy is always a virtue\
    \ for a programmer — it makes you write better code if you continue questioning\
    \ there isn't a more efficient way you could, or whether you could get by somehow\
    \ with writing fewer lines of code.\n\n# # PASSING FUNCTIONS\n\nA very simple\
    \ approach to lazy evaluation is preferring higher functions where possible. Consider\
