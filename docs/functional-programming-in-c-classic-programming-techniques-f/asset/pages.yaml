  md: "The start value is always important when using any Fold. This is immediately\
    \ obvious if you\nthink about other accumulations you could use. For instance,\
    \ if you wanted to multiply the\nentire sequence instead of adding, you would\
    \ have to start from 1:\n\n```\nvar productfilto1 = Functional.FoldL(r, v) =>\
    \ r * v, v,\nEnumerable.Range(1, 10));\n```\n\nFor more complex applications,\
    \ the choice of a good start value is often key. Fold is extremely\npowerful and\
    \ a surprising number of algorithms can be implemented on its basis.\n\nThe following\
    \ lines calculate the average age of the people in the sample list above. The\n\
    accumulator is to return one value with two values instead of just:\n\n```\nvar\
    \ acc = Functional.FoldL(\n(r, v) => Tuple.Create(r.Item1 + v.Age, r.Item2 + 1),\n\
    Tuple.Create(0, 0),\npeople);\nvar averageAge = (double)acc.Item1 / (double)acc.Item2;\n\
    ```\n\nThis implementation uses the new types in .NET 4.0.\n\nIt has been said\
    \ that Fold differs from Map and Filter that it returns just one value.\nThis\
    \ statement wasn't as precise as it should be. Correctly would have to be: Fold\
    \ takes a list\nof values of type A and returns one value of type B. A and B can\
    \ be the same (as in the sum and\nmultiply examples) or they can be different\
    \ (as they were in the average example). Confusing,\nMight be a busy list type.\
    \ Look at this:\n\n```\nvar clonelist = Functional.FoldL(r, v) => r.Cons(v),\n\
    FSColl::List<int>.Empty,Enumerable.Range(1, 5));\n```\n\nThis example uses the\
    \ immutable list type from FSColl. The reason is that the syntax is\nmore concise\
    \ this way, since the Cons operation, which adds an element to the list, returns\
    \ the\nlist instead of making a change in place. The point is that the result\
    \ of Fold is a list in this case.\n\nFinally, to deliver proof of how powerful\
    \ the Fold function is, here are implementations of\nMap and Filter on the basis\
    \ of Fold:\n\n```\npublic static IEnumerable<R> FoldMap<T, R>(Converter<T, R>\
    \ converter,\nIEnumerable<T> source) {\n\treturn Functional.FoldL(\n(r, v) =>\
    \ r.Append(converter(v)),\nFSColl::List<R>.Empty, source);\nn}\n```\n\n```\npublic\
    \ static IEnumerable<T> FoldFilter<T>(Predicate<T> predicate,\nIEnumerable<T>\
    \ source) {\n\treturn Functional.FoldL(\n(r, v) => r.Append(predicate(v) ?\nnew\
    \ FSColl::List<T>(v):\nFSColl::List<T>.Empty, source);\n}\n```"
