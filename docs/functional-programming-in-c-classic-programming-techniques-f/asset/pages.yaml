    \ recursion examples had one thing in common: one single function involved that\
    \ called itself, which is called direct recursion. There is also indirect recursion,\
    \ where several functions depend upon one another. For instance, function A calls\
    \ function B, which calls function C. If function C, under any circumstances,\
    \ calls back to function A, this is a case of indirect recursion.\n\nThere is\
    \ a simple case of indirect recursion called mutual recursion. It involves two\
    \ functions that depend upon one another. In reality, the logic behind the dependency\
    \ can be quite complex. Nonetheless, here is an example that odd and even numbers\
    \ depend\n\n```\nstatic bool IsOdd(int number) {\n  return number == 0 ? false\
    \ : IsEven(Math.Abs(number) - 1);\n}\n\nstatic bool IsEven(int number) {\n  return\
    \ number == 0 ? true : IsOdd(Math.Abs(number) - 1);\n}\n```\n\nAs you can see,\
    \ the definition of an odd integer is this: if the number is zero, it is a known\
    \ fact that the number is not odd. Otherwise, if the number is odd the number\
    \ before it is even. The definition of an even number is exactly the other around:\
    \ zero is known to be, otherwise a number is even if the number before it is odd.\n\
    \nThe two functions IsOdd and IsEven depend upon each other; they are therefore\
    \ mutually recursive. The example scenario also has two base cases that are checked\
    \ in the two functions. Obviously, this can get quite complex—if you employ code\
    \ using an approach like this, don't forget the general idea of providing a concise\
