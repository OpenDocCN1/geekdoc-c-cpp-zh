    expressions at runtime and running them. In some languages this is at the core
    of the evaluation or execution system; in others it''s just of functionality offered
    to programmers.


    A final important detail is the representation of executable/evaluable expressions.
    In the preceding examples, the visible representation is simply a string, which
    was presumably parsed into the code of the Python example. On the surface, it''s
    not always possible to tell what the actual internal representation is — this
    requires knowledge of the mechanisms used by the language and the associated execution
    environment. For instance, Python could be using a just-in-time (JIT) compiler
    that translates the expression into an internal representation in a format that
    takes place before the execution is executed.


    In compiled languages like C#, these are different. Theoretically it is possible
    to evaluate an expression in string at runtime, but that involves a parser separate
    from the compilation infrastructure. Microsoft''s C# compiler is currently written
    in C++ and is not well modularized to support calling the parser alone at runtime.
    There are certain workarounds, like constructing an artificial temporary source
    code to wrap a code snippet and invoking the compiler against this, but they have
    the character of a hack.


