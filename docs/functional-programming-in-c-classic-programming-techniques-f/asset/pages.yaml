    simple calculation expressions, and an absolute end. This is a common type of
    sequence, which resembles the "sequences" regularly used in loop constructs in
    imperative languages. The syntax is, but the elements that are needed by the Sequence
    function are very similar to those used for the for loop in C# and other languages.


