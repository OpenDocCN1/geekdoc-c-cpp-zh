  md: "For quite a while now, NUnit has had a fluent API in addition to the standard\
    \ one. Here's how you\nrewrite the preceding test with fluent API:\n\n```\n[Test]\n\
    public void AddTestlf() {\n    Assert.That(Calculator.Add(20, 10),\n    Is.EqualTo(10\
    \ + 20));\n}}\n```\n\nThe idea of fluent APIs is that the user of the API can\
    \ chain calls to various API functions.\nThese APIs are quite hard to write because\
    \ of the complex interactions that are possible between the\nreturn values and\
    \ parameters of all the functions involved. Here are a few examples:\n\n```\n\
    public static class DataSource {\n    public static string GetValue() {\n    \
    \    return \"Some String\";\n    }\n\n    public static IEnumerable<string> GetData()\
    \ {\n        yield return \"First string\";\n        yield return \"Second string\"\
    ;\n        yield return \"Another string\";\n        yield return \"One final\
    \ string\";\n    }\n}\n```\n\n```\n[Test]\npublic void ValueTestlf() {\n    Assert.That(DataSource.GetValue()),\n\
    \    Is.Not.Null;\n    And.StartsWith(\"S\");\n    And.Not.EqualTo(\"Something\
    \ else\");\n}\n```\n\n```\n[Test]\npublic void DataTestlf() {\n    Assert.That(DataSource.GetData().ToList()),\n\
    \    Has.Count.GreaterThan(0);\n    And.Matches<string>(v => v.StartsWith(\"O\"\
    ));\n}\n```\n\nAs you can see, NUnit APIs take care of the user to compose its\
    \ parts in order to form a\nsent that describes the conditions that are checked:\
    \ \"Assert that <my value> is not null, and\nstarts with S, and [is] not equal\
    \ to 'Something else.' It is great to be able to write unit tests this way!\n\n\
    From a functional point of view, the interesting thing about the API structure\
    \ of NUnit is that it\nis based on lots of functionally pure methods and properties.\
    \ There are a few exceptions, some of\nrather severe, and it's not quite clear\
    \ the authors of API had functional ideas in\nmind when they created it. Their\
    \ structure obviously tended in the functional direction they\nplanned it or not."
