  md: '# 12


    # # Standard Higher Order Functions


    WHAT''S IN THIS CHAPTER?


    +   * Applying operations: Map

    * Using criteria: *Filter*

    * Accumulating: *Fold*

    * Map, Filter, and Fold in LINQ

    * Standardizing higher order functions


    Higher order functions are a pillar of functional programming. They are functions
    that either take other functions as parameters or return other functions as values.
    The latter case also implies that new functions might have been created dynamically
    before being returned.


    Many known languages support these concepts only partially. For instance, in C
    it is possible to pass around function pointers, and there''s a certain extent
    of type safety guaranteed. The language does not support the creation of dynamic
    functions. The same was true for the C# language in version 1, where typed delegates
    were allowed to pass functions back and forth. Only C# 2.0 return anonymous methods,
    with the syntact addition of lambda expressions in C# 3.0.


    The term *higher order functions* is not a scientific one, it''s just a convenient
    expression that describes a set of three especially well known higher order functions:
    *Map*, *Filter*, and *Fold*. These functions are available in many languages,
    or rather in the runtimes supporting these languages. Even .NET delivers versions
    of them in the LINQ libraries in .NET 3.5 — more about that at the end of this
    chapter. Each of the functions works against a list of elements and uses another
    function, which can be passed in by the caller, to perform some operation with
    the elements.'
