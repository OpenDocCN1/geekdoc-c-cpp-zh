  md: '# INTRODUCTION


    **FUNCTIONAL PROGRAMMING** is an important paradigm of programming that looks
    back on a long history. The subject has always been very relevant to people who
    teach how to program — the clean and logical concepts of functional programming
    lend themselves especially to teaching. Certain industries use computers and self-written
    programs have also found functional programming to be the most productive approach
    for their purposes. However, for many of the “mainstream” software manufacturers,
    functional programming has held long an air of the academic and they widely chose
    to use such approaches with an imperative heritage, like object orientation.


    In recent years, more and more functional elements have been included in imperative
    languages on the .NET platform, with Visual Studio 2010, F# has been included
    — the first hybrid functional language in the box with Microsoft’s mainstream
    development platform. Even more than the functional features that have been introduced
    to C# and VB.NET, this shows a commitment to


    # WHO THIS BOOK IS FOR


    The topic of functional programming in C# can be seen from two different angles.
    On the .NET platform there are many experienced developers and development teams,
    who have been using C# or VB.NET, or in some cases C++, to create software for
    the platform. If you have that sort of experience, there are lots of reasons why
    you should be looking into functional programming: it’s a clean and easily maintainable
    style, it’s an important basis of programming as we know it today, and certify
    specific current concerns, like parallelization, can be targeted successfully
    with the help of functional programming ideas.


    On the other hand, perhaps you’re not a . programmer at all. You have experience
    in one or more “traditional” functional programming languages. You need to work
    with people who use C# or use the language yourself. This book will help you understand
    how to use the approaches you are familiar with C#, and will give you valuable
    starting points when it comes to explaining these ideas to team members without
    your functional background.


    The book assumes a basic level of understanding of C# language constructs, at
    least to version 3.0 of the language. However, Part II is written to explain a
    few particular features of the language that are especially important, rather
    complex or often misunderstood. From experience, I recommend you give Part II
    a good look even if you are quite fluent in C# — there are usually some little-known
    intricacies about the features that have been selected for this part, which may
    lead to misunderstandings later.'
  merge: -1
