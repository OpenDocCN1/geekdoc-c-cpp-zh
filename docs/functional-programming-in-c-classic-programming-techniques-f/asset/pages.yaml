  md: 'If you want to use immutable data as a guideline, remember that C# doesn''t
    have language support for it. This means, among other things, that your co-workers
    arent necessarily aware of your intentions a block of data in your code. It''s
    important to have a certain discipline about this and possibly to create a naming
    convention or avoid misunderstandings. Remember, it''s easy enough for you to
    make variables read-only, or implement functions in a pure style. The compiler
    provides little bits of help, like the readonly keyword. But only discipline and
    communication will help prevent your coworkors from accidentally undoing your
    efforts.


    Finally, for scenarios of parallelization, immutable data structures can be very
    useful; in such cases, this guideline can be recommended wholeheartedly.


    # Watch Behavior Implementation in Classes


    In programming languages with more of a focus on functional elements than C# has
    to offer, there are often special data "container" types that allow flexible storage
    of complex data, but dont always implement any of them. Course, object orientation''s
    aim is to implement all behavior in classes, but you still have a choice to make:
    to what extent you are going to combine data storage and behavior implementation.


    It is important to realize that the question of how to handle data storage and
    data flow is the important point when it comes to discussions about object orientation
    versus functional programming. Using static methods in C# doesn''t make your functional
    automatically, just by wrapping all your variables in classes doesn''t make you
    an oriented programmer. The choice you really is between two programming paradigms,
    each of them fully working on its own — mixing and matching is allowed, but take
    great care in doing!


    The guideline is stated carefully (watch behavior implementation in classes) and
    is not meant to contradict the ideas of object orientation. Your choice may depend
    on your driving factor for the adoption of functional programming. For parallelization,
    the problem is that any class you use a black box of data with associated behavior
    will not allow any intrinsic parallelization. This may or not be a problem for
    you — you can see that these are very subjective. Your perspective may be that
    the degree of encapsulation afforded by a black box is just what you want. Your
    perspective may be in for different parts of your code, for modules of your application,
    or certainly from one project to the next.


    The guideline is to help you remember that there is a choice here, and that for
    one or the other extreme, or anywhere in between, is perfectly fine if your circumstances
    warrant it — and if you''ve made a conscious decision about it.


    # FINDING LELY CANDIDATES FOR FUNCTIONAL PROGRAMMING


    This is a question that users of Microsoft''s new F# have to deal with all the
    time: where in your architecture are the places where it makes sense to use F#?
    Opinions on this very wide — some people think it should be restricted to certain
    sense-intensive parts of the code, whereas others like to stress that F# is a
    general purpose programming language just like others over .NET. Questions of
    tooling are important in the area of F# as well, because Visual Studio support
    for things like UI designers isn''t available so far.'
