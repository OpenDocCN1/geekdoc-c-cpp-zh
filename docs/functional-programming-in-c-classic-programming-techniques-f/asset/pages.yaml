    }\n\n```\n\nThe extension Mangle could just be implemented like this:\n\n```\n\
    namespace Expressions {\n    public static class IntExtensions {\n        public\
    \ static int Mangle(int value, Expression<Func<int, int>> mangler) {\n       \
    \     // let's mangle the mangler before we do anything with it\n            //\
    \ -- just because we can\n            Func<int, int> mangledMangler = Expression.Lambda<Func<int,\
    \ int>>(Expression.Add(mangler.Body, mangler.Parameters)).Compile();\n       \
    \     return mangledMangler(value);\n        }\n    }\n\n```\n\nIn this case,\
    \ the variable that accepts the delegate is of type Expression<Func<int, int>>\
    \ instead of Func<int, int>. This instructs the compiler to verify and store the\
    \ argument as an expression tree instead of a compiled delegate. As a result,\
    \ the expression can be analyzed and modified before it is eventually executed.\n\
    \nWhat is the caller going to look like in this case?\n\n```\nnamespace MangleDemo\
    \ {\n    using Expressions;\n    public class MangleTester static void ShowIt()\
    \ {\n        int val = 42;\n\n        // result will be 42*42 + 23 here but\n\
    \        // my own code is exactly the same as before!\n        int result = val.Mangle(x\
    \ => x * x);\n        Console.WriteLine(result);\n    }\n}\n\n```\n\nThis is almost\
    \ exactly the same as before. The only difference is that the using line pulls\
    \ in the namespace Expressions instead of Compiled. That's sufficient for the\
    \ re resolution mechanisms to find a different extension method called Mangle,\
    \ which even has a slightly different parameter type. From the caller side, this\
    \ is invisible, and so is the fact that the delegate that is passed in is changed\
    \ before it is executed."
