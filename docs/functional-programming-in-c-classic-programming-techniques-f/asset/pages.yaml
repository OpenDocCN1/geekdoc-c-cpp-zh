    }\n\nint Add(int x, int y, int z) {\n  return Add(x, y) + z;\n}\n\ndouble Add(double\
    \ x, double y) {\n  return x + y;\n}\n\ndouble Add(double x, double y, double\
    \ z) {\n  return Add(x, y) + z;\n}\n```\n\nIn this example it becomes obvious\
    \ what overloading has to do with reuse: it allows programmers to create new functions,\
    \ similar to existing ones, while potentially making use of functionality that\
    \ has already been implemented. All the functions have different parameter lists,\
    \ which allows the compiler to distinguish them by looking at the types of values\
    \ that are passed when a call occurs. If there is any sort conflict, the compiler\
    \ shows an error message. Overloads have the same name (they wouldn't be called\
    \ overloads if they had different names), which makes it easier for programmers\
    \ to understand the relationship between a group of functions.\n\nIn the context\
    \ of algorithms, reusability can be a bit more complex than this. The idea is\
    \ that it should be possible to write functionality that can used later in ways\
    \ that are not supported in particular when the code was written. In the more\
    \ obvious cases, at least the general purpose of the function in question will\
    \ be the same, but there are also algorithms so generic in their definition that\
    \ they can be used to solve almost arbitrary problems. For example, look at the\
    \ following implementation of the Bubble Sort algorithm. Some comments included\
    \ for clarity.\n\n```\npublic void Sort(int[] values) {\n  bool swapped;\n\n \
    \ do {\n    swapped = false;\n    // iterate over the whole list\n    for (int\
    \ i = 0; i < values.length - 1; i++) {\n      // if the current index value is\
    \ greater than\n      // the one it follows...\n      if (values[i] > values[i\
    \ + 1]) {\n        // then the two are swapped\n        int temp = values[i];\n\
    \        values[i] = values[i + 1];\n        values[i + 1] = temp;\n        //\
