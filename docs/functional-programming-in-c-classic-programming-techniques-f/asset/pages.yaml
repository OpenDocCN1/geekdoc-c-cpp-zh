  md: 'data types. This is not the only possible way of implementing persistent data
    structures, but a commonly used one to its simplicity.


    Immutability of data is gradual and there is a distinction between flat and deep
    immutability. Flat immutability means that values on the level of a particular
    data structure cannot be changed. Deep immutability means that all of the data
    structures to which those values refer are also immutable. The data structures
    in the preceding example satisfy both of those conditions. You could combine PersistentOrderLine
    with MutableProduct, in which case you would have a data structure with flat,
    not deep, immutability. Generally, deep immutability is preferable, but in practice
    a combination of data structures can make a lot of sense. As you will see, it''s
    not all that is hard to implement even complex data structures such as lists with
    flat immutability. But deep immutability depends more on the way these structures
    are being used — That is, what data you are storing in them — than on their implementation.
    This should suffice to answer the first question.


    # Cloning


    The second question (what happens if reality needs to change?) also has to do
    with the depth of the "tree" that results from having a network of objects that
    relate to one another. With immutable objects, the fact that data tends to change
    occasionally in the real world is managed with the help of a cloning process.
    Basically, to apply a change to an object, you create a copy of that object that
    differs from the original in one or more points. The modified clone can then be
    used in places in your code without affecting existing units of work that are
    still active and started with a reference to the old object.


    For example, how to change the price in an instance of the PersistentProduct class:


    ```

    var chicken = new PersistentProduct("Rubber Chicken", 10.99m);

    var discounted = new PersistentProduct(chicken.Name, 8.49m);

    ```


    There are two problems with this approach, which lead to an answer to the third
    question (are persistent data structures always have the best answer? The first
    problem is a logical one if one of them changes in this way, then a potentially
    large number of other objects needs to be cloned. In a simple:


    ```

    var chicken = new PersistentProduct("Rubber Chicken", 10.99m);


    // this orderLine relates to the unchanged chicken

    var orderLine = new PersistentOrderLine(chicken, 5);


    // now the chicken "changes" - in this case the local reference to the

    // "old" object is actually dropped

    chicken = new PersistentProduct(chicken.Name, 8.49m);


    // the old orderLine needs to be cloned as well

    // (assuming your business logic dictates that the order should be

    // updated with the price change)

    orderLine = new PersistentOrderLine(chicken, orderLine.Count);

    ```


    You will see later that in the case of persistent container data structures such
    as linked lists, this logic leads to a certain, possibly large, overhead. Remember
    that there is a reason why'
