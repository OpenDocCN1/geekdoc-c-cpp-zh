  md: '# WHAT''S IN A TYPECLASS?


    Monads are an advanced abstraction mechanism, and the abstraction in Haskell is
    based on the idea of typeclasses (typeclasses, not classes). Typeclasses are an
    abstraction that C# and many other object oriented languages don''t have. Look
    at the following examples to understand what they do.


    Say you have a data type — a discriminated union in Haskell, very similar to an
    enum in .NET.


    ```

    data Food = Pasta | Pizza | Chips

    ```


    You also have a function that can check whether two values of type Food are considered
    equal:


    ```

    isEqual :: Food -> Food -> Bool

    isEqual Food Pasta = True

    isEqual Food Pizza = True

    isEqual Food Chips Chips = True

    isisEqual _ _ False False

    ```


    The variations of the function declare the special cases explicitly in the two
    given parameters are the same — in these cases the result is True. In all other
    cases, denoted by the use of the wildcard operator _, the result is False.


    Using the function on a Haskell console at this stage would render these results:


    ```

    Main>isFood Pizza Chips

    False

    Main>isFood Pizza Pizza

    True

    Main>

    ```


    Of course, a check for equality of two values is something you want to be able
    to do with most data types. In other words, there is a group, a class of types,
    for which comparing equality makes sense. In Haskell, a typeclass can be used
    to describe that class of types. Here''s how a typeclass for the purpose of equality
    could be written:


    ```

    class MyEq where

    nisEqual :: a -> a -> Bool

    isEqual x y = not (isNotEqual x y)

    nisNotEqual :: a -> a -> Bool

    isNotEqual x y = not (isEqual x y)

    ```


    The typeclass declares that there should be two functions isEqual and isEqualTo.
    Each of these functions takes two parameters of type a (this is generic in Haskell;
    it''s like talking about type T in C#) and returns a Bool. The typeclass also
    does something it can optionally do: it implements both functions. As you can
    see, they are both implemented in terms of the other, so with this implementation
    alone, none of them actually work. The advantage of using such a default implementation
    pattern is that a programmer who implements the typeclass for a particular'
