    The implementation and public interface of the Lazy class resemble a similar class
    that is used in the F# libraries. The class is quite straightforward — the code
    has not been copied from F#, but simply re-implemented in C# by looking at the
    public API of the class. It is initialized through its constructor with either
    a function or a value that is stored internally. The Force() and UnsynchronizedForce()
    methods as well as the Value property are used to retrieve the value, which will
    be either returned directly or retrieved from the first function. The value will
    only be retrieved (at most) once.


    Exceptions are handled by Lazy<T>. Any exception thrown every time the value of
    the Lazy<T> instance is accessed is stored and rethrown. This behavior is especially
    useful in cases where multiple threads rely on the Lazy<T> instance to "keep each
    thread informed" correctly when an exception is thrown by the function.


    The final feature of Lazy<T> is its thread safety. To avoid restrictions on T,
    the class is coded with a lock that encompasses the entire section with access
    to the value, not just the write operation. It would be possible to make this
    more efficient by locking only the write operation, or even using a lock-less
    approach, and then T would have to be referenced types.


    Using Lazy<T> is simple, as it can be used in the place of the value it represents,
    whether that is a value known at the time of instantiation or one that still needs
    to be retrieved by calling another function. There are several ways to instantiate
    a Lazy<T> instance. First, it can be instantiated to represent a value that is
    already known:


    ```

    var lazy42 = new Lazy<int>(42);

    ```


    This format is convenient for functions that have been written to accept lazy
    parameters. In this case, Lazy<T> can represent the value directly, eliminating
    the need to wrap it into a function (as shown in the section "Passing Functions").
    If another function needs to be called to retrieve the value, Lazy<T> can be instantiated
    like this:


    ```

    var lazyCalc = new Lazy<int>(BigCalculation);

    ```


    In this line, BigCalculation represents a function that returns an integer, like
    the one in the "Passing Functions" example. The Lazy<T> instance represents this
    function and calls it as necessary when the value is requested through a call
    to the Force() or UnsynchronizedForce method or the Value property.'
