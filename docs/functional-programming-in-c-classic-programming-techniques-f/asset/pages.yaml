  md: "The main issue with class, apart from infinite looping, is that it returns\
    \ itself as the IEnumerator implementation every time. An enumerator is expected\
    \ to have an idea of position within the collection, that is, the value returned\
    \ by Current when it's called. Assuming multiple iteration processes are active\
    \ at the same time, it must be possible to distinguish the positions that these\
    \ processes are currently at. You don't have to think multiple threads for this;\
    \ it would be enough that one iteration is started and iterated for a bit, then\
    \ another one is started, and so on — an implementation that prevents the preceding\
    \ one as soon as a second iteration is required.\n\nThe following implementation\
    \ of an EndlessList class uses separate classes for IEnumerator and IEnumerable.\
    \ The classes are nested, although they don't need to be. But in reality, nesting\
    \ the enumerator implementation within the enumerable is a common pattern. To\
    \ make things bit more practical, this implementation uses integer values instead\
    \ of returning the string all the time.\n\nThere's still one major difference\
    \ compared to most real-world implementations: there's no data encapsulated in\
    \ the outer list implementation. You might wonder why this example wasn't constructed\
    \ in a more flexible fashion. The answer is that it would mean creating some rather\
    \ complex data structure code, or using an data structure, which would have made\
    \ the example unrealistic in a different way because all the standard data structures\
    \ already have their own IEnumerable implementation.\n\n```\npublic class EndlessList\
    \ : IEnumerable {\n    public class Enumerator : IEnumerator {\n        int val\
    \ = -1;\n\n        public object Current {\n            get { return val; }\n\
    \        }\n\n        public bool MoveNext() {\n            val++;\n         \
    \   return true;\n        }\n\n        public void Reset() {\n            val\
    \ = -1;\n        }\n\n        public IEnumerator GetEnumerator() {\n         \
    \   return new Enumerator();\n        }\n    }\n```\n\nThis pattern of implementing\
    \ value sequences is very flexible and quite powerful. In certain circumstances,\
    \ it can be quite hard to implement—for instance, if the data in the list doesn't\
    \ easily allow sequential and/or random access. Most importantly, though, creating\
    \ such implementations isn't quick and easy. Some algorithmic problems have easy\
    \ solutions based on sequences, or on the basis of explicit interface implementation,\
    \ .NET iterators don't lend themselves well to the creation of ad hoc iterators\
    \ to solve such problems."
