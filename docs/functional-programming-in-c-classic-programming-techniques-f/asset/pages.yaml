    Even if using data structures with Comparator<T>, that does not provide for great
    flexibility. When using data structures to sort ordered data, it is a regular
    requirement to sort to a certain algorithm. Therefore the implementation of comparison
    logic on the basis of classes and interfaces is not enough. Being able to pass
    in a delegate to perform the comparison would make more sense, and the .NET Framework
    has several such delegates by default. The generic comparison mechanism as supplied
    by Comparator<T>.Default doesn''t provide any help — to create a generic class
    with flexible options for comparisons, you have to write a code to sort yourself
    to cover all the possibilities.


    Because there are at least generic and non-generic variations of the IComparable
    interface to consider, it is practically impossible to use generic constraints
    with the UnbalancedBinaryTree<T> class. These shortcomings of the type system
    and the framework itself make a big difference compared to those of typed functional
    languages that have a very strong type system (Haskell, for example).


    Using the UnbalancedBinaryTree<T> is very simple; it has the same functional API
    as the list before. Here are a few lines of code for insertion:


    ```

    var tree = FColl1::UnbalancedBinaryTree<int>.Empty;

    tree = tree.Insert(10);

    tree = tree.Insert(5);

    tree = tree.Insert(15);

    tree = tree.Insert(10);

    tree = tree.Insert(10);

    Console.WriteLine(tree);

    ```


    As you can see, the value 10 is inserted. The tree is implemented as a Set collection,
    so it doesn''t actually store a second value that is equal to one already in the
    collection. Therefore, the output from the last line is:


    +   [1, 5, 10, 15]


    # Red/Black Tree


    The final example for persistent container data structures is a red/black tree
    implementation. This may not be something you''ve tried yet. It is based on a
    more complicated algorithm, which is interesting to see in a functional implementation.


    How does the red/black tree work? Imagine each node in a binary search tree to
    have a color in addition to the value and right members that tree nodes usually
    have. The color can be red or black. There are a number of rules that define how
    the nodes are colored, and which color combinations are allowed when looking at
    a parent and its children. During insertion there is a balancing operation, which
    performs rotations on certain combinations if it finds that the insertion operation
    violated one or more of the nodes.


    The point of this complicated mechanism is to balance the tree so that its depth
    is as small as possible for the number of items it contains. A tree of little
    depth can be searched faster than one of great depth, the red/black tree optimizes
    access time using its color algorithm. The algorithm itself is well documented
    in computer science literature, as resources like Wikipedia.'
