    \ to trigger evaluation occasionally. The important thing is having a choice.\n\
    \nSecond, in traditional languages execution order typically doesn't play a role\
    \ at all. Functions have dependencies, which result in requirements for the order\
    \ of evaluation. Should it be the programmer's task to figure this out? It shouldn't,\
    \ and as this book describes, the science of pure functions makes it possible\
    \ to describe algorithms as a network of functions, with the \"connections\" defined\
    \ by the dependencies. In this world, being lazy is an important part of being\
