  md: "In the case of LINQ, this fact is used for an interesting purpose. It allows\
    \ the LINQ infrastructure to take a delegate, which was passed to those LINQ methods\
    \ you saw early in this chapter — Where(), Select(), GroupBy(), and so on — and\
    \ pass it into a process of parsing and translating the expression. It is perfectly\
    \ possible that the expression never gets executed in its literal form, but instead\
    \ it is translated into a different language to make its execution more efficient.\n\
    \nThis is, what LINQ does to execute queries in C# as SQL queries on the database\
    \ server. Because the system is built on interfaces that you can implement in\
    \ your own towns, it is extensible, and there are now lots of independent LINQ\
    \ providers that allow you to query all of data stores through LINQ — third-party\
    \ ORM tools, for example, but also data sources like Amazon or Twitter.\n\n# Parallelization\n\
    \nWith the inclusion of the Parallel Extensions (PFX) in .NET 4.0, LINQ has become\
    \ a great functional API. There is a helper function, AsParallel(), which converts\
    \ an IEnumerable<T> into an object called ParallelQuery<T>. The effect is that\
    \ a different set of extension methods applies to the object after the conversion,\
    \ in this case from that class has the same names as those shown earlier in the\
    \ Enumerable class, so that once the calling code looks the same as before. But\
    \ the methods work differently in that they automatically partition the source\
    \ sequence and run several parallel Tasks instead of just sequential one. This\
    \ feature is known as PLINQ, or Parallel LINQ.\n\n> PFX uses algorithms to figure\
    \ out how Task instances are eventually parallelized — or in fact, if they are\
    \ parallelized at all — on any given hardware. LINQ doesn't influence this directly;\
    \ it interfaces with the PFX infrastructure by running Tasks.\n\nFor example,\
    \ here is some code for the iterator:\n\n```\nstatic IEnumerable<int> GetValues()\
    \ {\n    int i = 0;\n    while (i < 20) {\n        Console.WriteLine(\"{{0}} Returning\
    \ 1\", Task.CurrentId, i);\n        yield return i++;\n    }\\}\n```\n\nThe output\
    \ includes a value retrieved from the PFX infrastructure, the ID of the currently\
    \ executing task. (This is a value of type int?; it is null when the code is not\
    \ running in a Task instance.) Here is a normal LINQ call to calculate the sum\
    \ of the values from the iterator, and its output:\n\n```\nConsole.WriteLine(GetValues().Sum());\n\
    ```\n\n() Returning 0"
