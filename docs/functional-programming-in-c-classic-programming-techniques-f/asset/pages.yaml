    # THE MEANING OF LAZINESS


    I have always maintained that it is a good thing for a programmer to be lazy.
    No offense is intended with this statement. The assumption is that a programmer
    does her job, whether she''s lazy or not. When she''s lazy, she''ll spend time
    thinking about the work she does. She recognizes that there are elements that
    simply require time to get right, which can''t be helped. There are elements that
    are fun and others that aren''t, all of them need to be completed.


    And there are elements that are boring because they are repetitive, and can be
    helped by finding out what these elements are exactly, and how they can be done
    more efficiently. It is frustrating to do something than once, and being lazy
    makes a programmer want to figure out how to avoid such situations. There are
    also things that are done, and then something changes and you find you didn''t
    really have to spend all that time doing things because the results are no longer
    needed. For many programmers, this feeling of'
  merge: -1
