    \ block of features that AsParallel belongs to is parallel LINQ or PLINQ, and\
    \ it provides declarative parallelism. The method AsParallel takes an Iumerable\
    \ as a parameter and returns an IParallelEnumerable, which changes the mapping\
    \ function of the LINQ expression and executes the query using the parallelization\
    \ support from PFX. An elegant solution, no question — but made possible by the\
    \ careful structure that led to a functionally pure business logic implementation\
    \ in GetFilteredList!\n\n# Calculating Mandelbrot Fractals\n\nThe starting point\
