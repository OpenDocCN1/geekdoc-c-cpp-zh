  md: '# 16

    Keeping Data from Changing


    **WHAT''S IN THIS CHAPTER?


    +   - Why change is not always good

    - Simple immutable data types

    - Cloning with modifications

    - Immutable container data structures

    - Alternatives to immutable data types


    That data is changeable, that it actually changes the time in real life, is usually
    taken as fact in mainstream imperative programming. But the changeability of data
    creates many problems, so programmers are questioning that. In the world of functional
    programming, data is traditionally immutable, and data structures tend to be persistent.
    The term persistent is easily misunderstood because it seems to point at persistence
    in the sense of storing data in file systems, databases, or similar storage units.
    It''s used as an opposite of ephemeral, meaning short-lived or volatile, and should
    not be understood to imply any storage mechanism for the data.


    # CHANGE IS GOOD — NOT!


    The idea behind persistent data structures is simple. For a particular purpose
    — perhaps a thread of execution, a process, a function, a single algorithm implementation,
    in other words, any unit of work (in literal, not the Martin Fowler sense of the
    term) — it would be useful to know that the data used by unit of work couldn''t
    change. That means it couldn''t change from the perspective of that unit of work.
    It might appear to have changed when looked at from a different angle; that''s
    fine. But the unit of work should be able to perform its task from beginning to
    end with no concern for potential changes to the data it works with. If data structures
    guarantee that behavior, they are called persistent.'
