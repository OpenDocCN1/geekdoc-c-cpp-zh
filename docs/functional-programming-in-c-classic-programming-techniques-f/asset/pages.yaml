  md: "# Calling Curried Functions\n\nWhether a function has been curried manually\
    \ or automatically, or even created from scratch in this format, there are some\
    \ common consequences regarding the way the function can and has to be used. A\
    \ basic call to the function curriedAdd looks like this, passing in parameters:\n\
    \n```\nint result = curriedAdd(5);\n\nor;\n\nvar curriedAdd5 = curriedAdd(5);\n\
    var result = curriedAdd(3);\n```\n\nAt first glance, there are several pairs of\
    \ parentheses on the line is confusing, or course this is the result of the function\
    \ chaining that creates. The call to the first function takes one parameter, and\
    \ it returns a second function which is being called with the second parameter\
    \ list. Agreed, it does look unfamiliar, but it's easy enough to get used to.\n\
    \n# The Class Context\n\nAlthough we have dealt with functions that are declared\
    \ as lambda expressions or anonymous methods, cur works just as well with more\
    \ conventional methods declared in C# classes. Both static class methods and instance\
    \ methods can be curried. Classes also offer an easy way of making curried functions\
    \ available for external calls. The following listing shows the class Calculator,\
    \ which publishes curried versions of the Add and Mult functions for public consumption.\
    \ This example uses static methods and fields, which is quite common with fully\
    \ functional approaches, but the same techniques can be used well with instance\
    \ methods and fields.\n\n```\nclass Program {\n    static void Main(string[] args)\
    \ {\n        // The results of these two calls are the same\n        Console.WriteLine(Calculator.Add(20)(30));\n\
    \        Console.WriteLine(Calculator.Add(20, 30));\n    }\n}\n\npublic static\
    \ class Calculator {\n    public static int Add(int x, int y) {\n        return\
    \ x + y;\n    }\n\n    public static readonly Func<int, Func<int, int>> AddC =\
    \ \n        Functional.Curry<int, int, int>(Add);\n\n    public static int Mult(int\
    \ x, int y) {\n        return x * y;\n    }\n\n    public static readonly Func<int,\
    \ Func<int, int>> MultC = \n        Functional.Curry<int, int, int>(Mult);\n}\n\
    ```"
