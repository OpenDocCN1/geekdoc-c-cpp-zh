  md: "A style of programming that uses only persistent data structures has a lot\
    \ of practical advantages. To begin with, code is easier to write if no provision\
    \ has to be made for the case where unexpected things happen in the middle of\
    \ an algorithm. Simpler code structures result in fewer programming errors, better\
    \ maintainability, stronger encapsulation, and easier and more error-proof debugging\
    \ and testing. The whole idea of side-effect free programming, as favored by functional\
    \ programming in general, is brilliantly supported by the idea of immutable data,\
    \ as a result, functions that use immutable and persistent data structures are\
    \ a pleasure to parallelize and modularize without any concern for execution order,\
    \ locking, and similar techniques of imperative programming.\n\nThe following\
    \ example shows a typical, albeit simple, implementation of two data container\
    \ classes, MutableProduct and MutableOrderLine:\n\n```\npublic class MutableProduct\
    \ {\n    public string Name { get; set; }\n    public decimal Price { get; set;\
    \ }\n}\n\npublic class MutableOrderLine {\n    public MutableProduct Product {\
    \ get; set; }\n    public int Count { get; set; }\n\n    public decimal GetValue()\
    \ {\n        return Product.Price * Count;\n    }\n}\n```\n\n```\n[TestFixture]\n\
    public class EphemeralTests {\n[Test]\npublic void TestOrderLineValue() {\n  \
    \  var product = new MutableProduct( Name = \"Rubber boat\", Price = 16.99m);\n\
