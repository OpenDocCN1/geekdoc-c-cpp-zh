- img_proc: true
  md: "The second type of function used in iterator chains is one that employs the\
    \ actual content.\nPerforming calculations is an obvious idea because all of the\
    \ examples in this chapter have used integers. Here's a function that performs\
    \ a calculation with an integer value:\n\n```\npublic static int Square(int x)\
    \ {\n    return x * x;\n}\n```\n\nWith an iterator, you can easily apply the Square\
    \ function to a sequence of values:\n\n```\npublic static IEnumerable<int> Square(IEnumerable<int>\
    \ values) {\n    foreach (int val in values)\n        yield return Square(val);\n\
    }\n```\n\nUsing delegate types, you could make the pattern of applying a function\
    \ to a sequence of ints a bit more general purpose:\n\n```\npublic static IEnumerable<int>\
    \ Apply(IEnumerable<int> values,\nFunc<int, int> calculation) {\n    foreach (int\
    \ val in values)\n        yield return calculation(val);\n}\n```\n\nYou can introduce\
    \ your own generic parameter so the Apply function works with types other than\
    \ int. For good measure, Apply<T> is also implemented as an extension method.\n\
    \n```\npublic static IEnumerable<T> Apply<T>(this IEnumerable<T> values,\nFunc<T,\
    \ T> calculation) {\n    foreach (T val in values)\n        yield return calculation(val);\n\
    }\n```\n\nThe pieces fit together. And of course a chain of such iterator functions\
    \ can be as long as you like:\n\n```\nvar results = Take(10,\nEndlessListFunction().\n\
    Apply(Square).\nApply(x => x / 2);\nforeach (var item in results)\n    Console.WriteLine(item);\n\
    ```\n\nNo overhead of any significance is introduced when the elements are chained\
    \ together in this way. The \"endless\" list still generates only the first 10\
    \ values in this example — nothing more. That's what laziness is about."
