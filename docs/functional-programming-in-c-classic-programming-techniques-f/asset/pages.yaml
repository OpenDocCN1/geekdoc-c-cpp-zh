- img_proc: true
  md: 'where both data modeling and algorithms and a wide variety of other aspects
    are important. That''s why so many modern programming languages are hybrid. This
    is not a new idea either — the first object oriented programming language standardized
    by ANSI was Common Lisp.


    # SUMMARY


    Today''s .NET platform provides one of the best possible constellations for hybrid
    software development. Originally a strong, modern and newly developed object oriented
    platform, .NET has taken major steps for years now in the functional direction.
    Microsoft F# is a fully supported hybrid language on the .NET platform, the development
    of which has influenced platform decisions since 2002. At the other end of the
    spectrum, albeit not all too far away, there''s C#, a newly developed language
    strongly based on object orientation, that has been equally influenced by functional
    ideas almost almost from its invention. At the core of any program written in
    either language there''s the .NET Framework itself, arguably the strongest set
    of underlying libraries that has ever been available for application development.'
