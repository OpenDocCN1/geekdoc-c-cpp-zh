  md: '# 232 | CHAPTER 18 INTEGRATING FUNCTIONAL PROGRAMMING APPROACHES


    has been written for the programming platform you are working on. The .NET Framework
    has been written as an object oriented framework, and often it''s the easiest
    to be object oriented as if you need to interact with it directly. You interact
    with you, because otherwise why are you using it?


    Everything in the .NET Framework is a class


    On the other hand, there are parts of the framework that implement APIs that are
    inherently functional. An example of that is Web requests. Web requests are stateless;
    they not have the requirement of being implemented in a pure way, but on a low
    level, a Web request closely resembles a function call. Newer developments on
    the Microsoft platform, like ASP.NET MVC, make this obvious.


    Systems like ASP.NET Web Forms put this thick layer on top of the basic HTTP request
    system, implementing complex state preservation and automated state recovery and
    the page and control rendering cycles. But even in this complex framework, there
    are still places where you need to write pieces of code that are very functional
    in nature: take a few parameters and return something that will be used as part
    of the output.


    # SUMMARY


    There is a prejudice among programmers, especially those who have never programmed
    anything in functional languages, that 99% of the time you are going to use functional
    ideas in scientific scenarios. And because those programmers tend to work on typical
    business application scenarios more than on other types of development, they conclude
    that functional ideas are not interesting to themselves.


    It is hard to argue with that mindset, and it is hard to come up with examples
    that just happen to fit what any practical programmer does in her daily work.
    There are lots of examples out of there, as well as in the previous chapters,
    but you have to keep an open mind and think about them creatively. LINQ was recently
    mentioned to me as proof that functional programming is of practical use. Certainly
    true, in reality LINQ is a package full of old ideas in a brilliant shiny new
    wrapper – it’s great and you just have to like it, but it can also be used as
    proof of how great things can sometimes be neglected by many, for a long time.


    The last section of this chapter has tried to apply some broad considerations
    to common topics of object orientation in business application scenarios.


    To apply functional programming requires thinking outside the box, assuming your
    box is object orientation. Functional programming isn''t always the best thing
    to do, but neither is any other approach.'
