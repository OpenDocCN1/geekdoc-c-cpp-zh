  md: '# IMPLEMENTING IMMUTABLE CONTAINER DATA STRUCTURES


    The rest of this chapter provides several examples, with explanations, for the
    implementation of container data structures that are persistent in nature. The
    algorithms for these implementations are taken from Chris Osasaki''s book Purely
    Functional Data Structures (Cambridge University Press). The book contains these
    algorithms implemented in the functional languages ML and Haskell, and quite a
    few compromises had to be made in translating to C#.


    # Linked List


    Every programmer has a singly linked list, and as a programming task usually given
    to those who are learning the trade, it can be quite daunting. Part of the reason
    that these lists are generally to be implemented in a mutable fashion, which means
    lots effort than for a persistent implementation.


    The algorithm for the persistent list type isn''t hard to understand. It is based
    on the idea that a unit of work has been started with a reference of the list
    in an “old” state, any perceived change to the list should not result in a change
    from that active unit''s point of view. Figure 16-1 shows the three steps for
    adding elements to the list:


    +   1. The application holds a reference to the List, i.e. the Head element of
    it, in a variable `list`.


    +   2. A separate unit of work is started and gets a reference to the list according
    to that current state, which holds in its own variable `list`.


    +   3. In the outer scope, two new elements are added to the list. The outer scope
    *list* reference now points to a new *Head* element, but from the perspective
    of the separate unit of work, the list hasn''t changed.


    ![](img/0bf1584a2ce4017291813385353496b6_196_0.png)


    **Figure 16-1:** Persistent list add'
