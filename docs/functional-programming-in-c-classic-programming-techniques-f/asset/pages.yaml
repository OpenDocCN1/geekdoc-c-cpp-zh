  md: "```\nvar result = add(10, 20);\n}\nstatic Func<int, int, int> GetAdd() {\n\
    \  return (x, y) => x + y;\n}\n```\n\nAlthough deailing from a technical standpoint,\
    \ this example doesn't really solve any problems. The same function is returned\
    \ from every call to GetAdd, which is nothing special and could be achieved much\
    \ more easily. When it gets really interesting is the creation of the function\
    \ is dynamic, and for that purpose the support for closures is required.\n\n#\
    \ # THE PROBLEM WITH SCOPE\n\nIn C#, the scope of variables is defined precisely.\
    \ The details aren't relevant here, but the essence of it is that all code lives\
    \ in methods in classes, and all variables exist only in and below the block where\
    \ they are declared. Developers can choose where they want to store away for later\
    \ reuse. The decision depends on the purpose of the variable and how much later\
    \ reuse is to go on. A variable may end up inside a method or to a class instance,\
    \ or it can be global by stored in a static class field.\n\nVariables are changeable\
    \ — the word \"variable\" gives it away. On the other, functional programming\
    \ in general doesn't like the idea of changeable variables in programs (more about\
    \ in Chapter 16), and the more public a variable is, the greater the issues. In\
    \ general, the guideline is to have no changeable variables at all, and to store\
    \ everything in the smallest possible scope. A pure function is expected to work\
    \ only with values that are local to its own block, and access nothing outside\
    \ its scope and certainly nothing can be changed from elsewhere.\n\nMany programmers\
    \ have an initial reaction to this idea is best described as incredulous. But\
    \ think about it — it's probably a long time since told how global variables of\
    \ the kind C programs had, or Pascal ones, were a bad idea. Remember what the\
    \ reasoning was like? \"It's a bad idea to have global variables because there's\
    \ a chance of collision, and maintainability is affected because it's hard to\
    \ understand what these variables contain at any given point in time, when they\
    \ are changed,\" or something very similar.\n\nHaving fields in classes that can\
    \ be changed from any one of the methods in the class isn't much different from\
    \ having global variables in an application. It's just the class's different.\
    \ Well, perhaps the problems of collision and maintainability resulting from having\
    \ these variables aren't quite as great, if you keep your classes small and well\
    \ abstracted. The problems of collision and maintainability remain, nevertheless.\
    \ It often seems impossible to restrict values to the scope of functions. What\
    \ if, during the initialization process, your application has a few values that\
    \ are needed much later on, perhaps from more than one place in code? One possible\
    \ answer is to take advantage of closures."
