  md: "# Prefer Anonymous Methods Over Named Ones\n\nThe anonymous method preference\
    \ guideline is not about deciding when an anonymous method or a named method can\
    \ be used. It is a separate consideration that can be answered strictly on technical\
    \ terms. For example, an anonymous method can't be reused in the object oriented\
    \ sense, through overloading or calls from different classes, it can't be generic.\
    \ On the other hand, named methods don't have support for closures.\n\nThe downside\
    \ of this idea is that C# syntax doesn't make the decision easy. Declaring functions\
    \ locally requires the use of delegate types, which need to be declared separately\
    \ (they can't be declared locally in a method), or standard delegate types, which\
    \ are very flexible, but can also result in complex syntax.\n\nTo illustrate,\
    \ there are two implementations of classes for prime number. They use the same\
    \ algorithms, but both are implemented using an anonymous inner helper function\
    \ for the functional case, and a method for the imperative case.\n\n```\npublic\
    \ class PrimeCalculatorImative {\n    public bool IsPrime(int v) {\n        for\
    \ (int d = 2; d <= v / 2; d++) {\n            if (v % d == 0)\n              \
    \  return false;\n        }\n        return true;\n    }\n\n    public List<int>\
    \ GetPrimes(int max) {\n        var result = new List<int>();\n        for (int\
    \ v = 3; v <= max; v++) {\n            if (IsPrime(v))\n                result.Add(v);\n\
    \        }\n        return result;\n    }\n}\n```\n\n```\npublic static class\
    \ PrimeCalculatorFunctional {\n    public static Func<int, bool> IsPrime = v =>\
    \ {\n        for (int d = 2; d <= v / 2; d++) {\n            if (v % d == 0)\n\
    \                return false;\n        }\n        return true;\n    }\n\n   \
    \ for (int v = 3; true; v++)\n```\n\n![](img/0bf1584a2ce4017291813385353496b6_245_0.png)"
