  md: '# 13


    # Sequences


    +   - Understanding list comprehensions

    - Creating iterators functionally

    - Working with ranges


    Sequences of data are an important encapsulation of the information computer programs
    need to do their work. Whether they come from databases or other types of storage,
    or whether they are calculated, entered, or otherwise retrieved, a programming
    language needs ways of representing these sequences, passing them around, and
    reading and manipulating them.


    # UNDERSTANDING LIST COMPREHENSIONS


    The notion of lists is deeply embedded in many programming languages. This is
    quite natural because computers are good at repetitive tasks. A lot of algorithms
    evolve around executing calculations, in the widest possible sense of the word,
    over lists of data.


    In imperative languages, the importance of lists usually leads to the inclusion
    of array features in the language syntax, while more complex as flexible list
    types are typically implemented in libraries.


    Initialization support that works with many different lists was added to C# in
    version 3.0. Unfortunately, this support isn''t very clear because the language
    uses an arbitrary mechanism to find out whether syntax is supported for a given
    type, and to actually add the elements. For instance, the type has to implement
    the interface IEnumerable and needs to have an Add method. IEnumerable is not
    needed at all for the purpose of adding elements to the collection, and Add is
    a member of a different interface or of the standard .NET collections. On the
    other hand, even if a class has a constructor that makes it IEnumerable as a parameter,
    it is not used by the mechanism, resulting in potential performance drawbacks.'
