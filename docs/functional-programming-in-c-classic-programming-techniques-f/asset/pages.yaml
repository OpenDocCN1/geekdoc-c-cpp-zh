    # # STANDARD HIGHER ORDER FUNCTIONS


    Many of the applications of the higher order functions described in this chapter
    could be replaced by simple algorithms. The functions themselves aren''t very
    complicated, and in some instances it doesn''t seem obvious why it would be a
    good idea to use the standard functions instead of explicit loops or other imperative
    constructs.


    Standardizing functional building blocks has many purposes, and just one of them
    is the obvious saving of programmer time results from not having to write similar
    algorithms over and over again.


    Try to think of standard higher order functions in the context of patterns. Design
    patterns in object oriented programming rarely have anything of importance to
    offer for an experienced programmer. It is likely that most programmers have solve
    a problem, without ever being that somebody had written a description of it and
    given a name. But the knowledge of patterns and their names allows their discussion
    for and against them, listing good and bad use cases. Why do scientists decide
    to call a particular kind of blue rock a Lapis Lazuli? Because they want to talk
    about it to other scientists.


    Defining and using standard higher order functions creates a certain expectation
    coupled with ease of understanding. If you read a piece of code and you see a
    call to a function called Map or Fold, you don''t need an explanation to understand
    in general what''s happening. You can move on and try to understand the really
    specific parts of the algorithm. From this perspective, these functions form an
    important part of functional modularization.


    # # SUMMARY


    There is nothing complex about the implementation of Map, Filter, or Fold, that
    they can solve almost arbitrarily complex problems. This fact, coupled with the
    ease of easy pattern recognition for other programmers, should give you food for
    thought when you find yourself writing algorithms with loops next time — perhaps
    a few applied standard higher order functions would be a better approach? It is
    also a good idea to use these functions as starting points for your own general
    purpose helpers!'
