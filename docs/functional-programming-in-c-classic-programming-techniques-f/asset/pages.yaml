  md: "# 6\n\n# Encapsulating Data in Closures\n\n# WHAT'S IN THIS CHAPTER?\n\n+ \
    \  - Constructing functions dynamically\n- Solving scope issues with closures\n\
    \nThe capability of a programming language to work with higher order functions\
    \ means that the problem of data scope becomes apparent. When functions are passed\
    \ around as parameters and return values, the compiler uses closures to extend\
    \ variable scope so that data is guaranteed to be available when needed.\n\n#\
    \ CONSTRUCTING FUNCTIONS DYNAMICALLY\n\nThe C# functionality related to creating\
    \ functions and methods has been around in programming languages for a long time.\
    \ Many languages have also had the feature of variables that refer to functions.\
    \ Even the C programming language had function pointers that could be used to\
    \ store references to functions, pass these into other functions, and call into\
    \ the functions. The C# 1.0 delegate type doesn't really add much to what was\
    \ already possible in C#; the idea is just formalized through the `delegate` keyword\
    \ and has been extended with multicast delegates and events.\n\nThe difference\
    \ between C and C# from version 2.0 onward is that C# makes it possible to create\
    \ new functions anonymously. Now you may wonder why this is so important — after\
    \ all, the compiler inserts these functions as methods into the class, so isn't\
    \ this just syntactic sugar? To a certain extent that true, there is a lot of\
    \ functionality gained by the capability to create functions on-the-fly and return\
    \ them to the outer scope. Yes, functions can be return values, just like this:\n\
    \n```\nprivate static void ReturningFunctions() { \n    var add = GetAdd();\n\n\
    ```"
