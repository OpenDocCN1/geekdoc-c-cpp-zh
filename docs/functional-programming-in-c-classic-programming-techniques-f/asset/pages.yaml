    \ (x, y) => x + y;\n```\n\nYou cannot use the var keyword with this lambda expression.\
    \ In C#, the compiler must be able to infer the types at the point of declaration,\
    \ which is impossible with a statement like this:\n\n```\nvar add = (x, y) =>\
    \ x + y;\n```\n\nThe functional language Haskell has a construct type classes,\
    \ where a type can define things like \"this is an element that can be added to\
    \ another.\" In the preceding case, Haskell would be able to infer the types of\
    \ x and y by simply assuming they belong to the type class that allows elements\
    \ to be added — a bit like an interface, but not quite the same. Other functional\
    \ languages support other mechanisms to resolve this, but in C# it just renders\
    \ a compiler error.\n\nLook at this:\n\n```\nvar add = (int x, int y) => x + y;\n\
    ```\n\nYou would think this could work, but it doesn't. The reasoning on the side\
    \ of the language team was that's because the compiler can't decide whether add\
    \ is going to be a Func<int, int> or perhaps an Expression<Func<int, int, int>>\
    \ (this nested generic type) would be used to support expression trees. There\
