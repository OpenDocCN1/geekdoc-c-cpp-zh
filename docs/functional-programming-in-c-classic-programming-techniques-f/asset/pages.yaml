    \ for expression trees in .NET 4.0\n\nIf you ask functional programming experts\
    \ about the great inventions brought about decades ago by the LISP (list processing)\
    \ language, one of the common answers is \"eval.\" These days, a lot of programming\
    \ languages support functions that are similar to LISP's eval, and a term like\
    \ \"eval mechanism\" is often used to describe a particular functionality: the\
    \ capability to evaluate language expressions at runtime.\n\nThe easiest way to\
    \ see this at work is simply using a string. Here's a mathematical expression\
    \ that would be valid in many programming languages (107.6 - 23.23) * 3.141. In\
    \ a language that supports an eval mechanism, you might be able to call a function\
    \ like this:\n\n> Eval(107.6 - 23.23) * 3.141\n\nPass in the string with the expression\
    \ and get the result returned from the Eval function. The expression in this example\
