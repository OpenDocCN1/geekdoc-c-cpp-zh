    # FCSlib Contains


    The function Curry is provided by FCSlib in the class Functional. There are two
    sets of overloads, one that functions with Func<..., the other for Action<...>.
    The delegates Func...> and Action...> are part of .NET 3.5, and both have a number
    of overloads themselves, for functions up to four parameters. FCSlib takes a few
    steps further by providing additional Func...> and Action...> for delegates up
