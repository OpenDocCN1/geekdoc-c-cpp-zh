    into the storage format. Up C# version 4.0, only lambda expressions with expression
    bodies are supported by the translation feature. The C# team has indicated that
    future language versions may support translation to expressions more freely, but
    until then, expression bodies are important for certain widely used features of
    .NET Framework that are based on expression trees.


