  md: '# # 18 Integrating Functional Programming Approaches


    WHAT''S IN THIS CHAPTER?


    +   - Functional approaches in refactoring

    - Writing new code

    - Finding Likely Candidates for Functional Programming


    With all the technical background sorted out in the previous parts of this book,
    one important challenge remains: applying all those ideas to the everyday scenarios
    that you face in your work.


    This is somewhat similar to learning a new programming language. All programmers
    have done it before. The first step is to try remember some of the unfamiliar
    syntax constructs, so they come readily to mind when a particular element is called
    for while writing code. The second step is to start thinking the way that new
    language works. Sometimes different languages have different philosophies. A particular
    solution that you can come up with quickly work, but at the same time it is very
    different from the more experienced programmer of the same language would choose.
    In extreme cases of course, languages can differ so drastically without the right
    mindset it is impossible to achieve any meaningful results.


    Applying functional programming to C# seems easy at first because it isn''t necessary
    to learn the syntactic basics of a new language. The elements of the language,
    the tools, are familiar, and you can focus on the philosophy alone. It seems like
    this should be the work, but in reality that''s not always true. The problem is
    that there''s always a way out; the fallback of the old, familiar approaches are
    always available. It''s a temptation, and there''s nothing there to enforce discipline.
    Those extreme cases of unfamiliar languages have that one big'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'advantage: when you start working with them, you can only keep going until
    you have that mental breakthrough you''re looking for, or you can drop them. There''s
    no in-between.


    With functional programming in C#, there''s a lot of it. In fact, in between is
    often the name of the game. The C# language and .NET platform are a hybrid world,
    and sticking to one true path is never going to deliver optimal results.


    You need to decide how to write code for each little part, module, and you need
    to revisit your decisions again and again to confirm you''re doing the right thing.
    The advantage of hybrid platforms is that they give you flexibility. They allow
    you to choose and adjust your tools so you can do the best job possible. At the
    same time, these characteristics are the greatest disadvantages of hybrid platforms.
    If you''re not prepared to make an informed decision, you are losing the flexibility
    advantage!


    # REFACTORING


    A large part of the code that programmers work on already exists. Even on the
    .NET platform, code has been written now for almost ten years. More importantly,
    a large part of the code that was written in C# language is not really new. It''s
    not new that it was written from scratch in C#, but it was following the exact
    same ideas that the programmers used before they started writing code. These are
    the basic ideas of object oriented systems, patterns ranging from simple hierarchy
    structures to enterprise-level multitier data exchange, ideas that were favored
    on platforms like MVC, Django, and many others.


    Refactoring — that is, the process of making structural changes to code to promote
    reuse and maintainability — is a necessity for many programmers. Every programmer
    refactors continually, which can be a healthy evolutionary process that leads
    to better software quality over time. Modern software development methodologies
    such as Agile favor refactoring as a prescribed technique to be used during development.
    "Red, Green, Refactor" is sometimes called the mantra of test-driven development
    (TDD).


    The core of refactoring is the idea of making changes to existing code without
    changing the outcome of that code. You can look at this from far away or close
    up, and the definition may change. While you refactor the content of a single
    method, for example, the outcome you''re aiming not to change be the return type
    and value of the method. On the other hand, you can also refactor a larger system,
    in which case the mesh of single methods and their return types and values may
    be subject to change. Whatever you do, you need to make sure that your goal of
    leaving the outcome unchanged remains, which usually involves automated testing
    on many different levels.


    This book won''t cover any about refactoring in general. There are many publications
    available about that topic. In the context of functional programming ideas in
    C#, the important points are:


    +   - You refactor anyway.

    - Refactoring is a well-defined idea with associated techniques that make it a
    safe practice.

    - Refactoring is the perfect vehicle for you to start applying functional ideas
    selectively to particular parts of your code while making sure nothing is broken.'
