    \ line.GetValue());\n}\n}\n```\n\nThere is also a unit test, which checks for\
    \ a combination of object values, the business logic function MutableOrderLine.GetValue()\
    \ returns the correct result. The example is much simpler than in real business\
    \ applications, but the details are similar.\n\n# FALSE ASSUMPTIONS\n\nThe interesting\
    \ thing about this example is that an assumption is made: \"while the process\
    \ of calculating the MutableOrderLine value is in progress, the values of MutableProduct.Price\
    \ and MutableOrderLine.Count are not going to change.\" Within the context of\
