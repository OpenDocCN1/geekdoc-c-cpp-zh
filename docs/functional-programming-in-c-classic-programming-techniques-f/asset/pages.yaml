  md: '# 15


    # Optional Values


    WHAT''S IN THIS CHAPTER?


    +   - Expressing the lack of values

    - The implementation of an Option type


    Programmers of languages derived from C have long been familiar with null as a
    representation of "nothing." In spite of common disadvantages that date back as
    long as the keyword null itself, the concept is still around around today. Functional
    languages have a different heritage when it comes to expressing "nothing" and
    the approaches used there can also be mirrored in C#.


    # THE MEANING OF NOTHING


    When dealing with data in computers, there is always the dilemma of representing
    "nothing." This problem is indeed special because working with data outside the
    computing world, it is rarely much of an issue. Imagine a printed form on paper,
    with fields for values. Simply doing nothing — not filling in any of the fields
    — results in the field representing nothing, automatically. There are no additional
    steps to be taken to make it obvious to anybody who reads the form that this field
    has not been filled in.


    For computers, the situation is different, and this goes back to the fact (without
    going into the physics of it) that any byte in a computer''s memory always has
    a value. That value might start out being quite random, and depending on the memory
    management system you''re working with, it might have a standard default value
    when it is made available to you as a programmer.

    But the point remains: there''s always a value. There is no built-in way of saying,
    "This byte contains nothing."'
