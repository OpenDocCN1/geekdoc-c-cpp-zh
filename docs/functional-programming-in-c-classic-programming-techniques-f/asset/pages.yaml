  md: '# What''s in a Monad?


    The type information indicates that the type a, which is the type of both arguments
    as well as the return value for the add function, has a constraint: it needs to
    be member of the typeclass Num. In other words, it needs to be part of the class
    of types that support the requirements of the Num typeclass. The reason for this
    is that Haskell will the function (+), the infix operator, defined in the typeclass
    Num, so it infers that the types used as arguments to that function must be members
    of Num.


    As a result of this, it''s possible to use the add function with different types:


    ```

    Main> add 10 20

    30

    Main> add 7.6 3.9

    11.5

    ```


    That is not possible in .NET because every variable must have a known type on
    the CLR level. Of course that type be an interface, but interfaces can''t implement
    operators, and they are also not inferred in the same way, automatically.


    # WHAT''S IN A MONAD?


    In Haskell, Monad is a typeclass. Here''s what it looks like:


    ```

    class Monad m where

    (>>= :: m a -> (a -> m b) -> m b

    return :: a -> m a

    ```


    Granted, at a glance this doesn''t explain much. But the important thing is to
    recognize that a monad is a particular typeclass, in other words, Monad describes
    a particular class of types. It is the class of types that support the two rather
    cryptic functions (>>= (this is usually pronounced "bind") and return.


    To illustrate the reality are declared by the Monad typeclass, here''s an implementation
    of a C# interface with a similar set of two functions:


    ```

    public interface IMonad<A> {

    IMonad<A> Return(A val);

    imonad<B> Bind(Func<A, B>, IMonad<B> g);

    }

    ```


    That looks much! The Return function takes a type of A and returns an IMonad<A>.
    It wraps the value in the monad, so to speak. The Bind function acts as a delegate,
    as argument, which can receive a value of type A and returns IMonad<B>. Bind also
    returns IMonad<B>. In reality this is usually not used because the formalism it
    provides is regarded as too strict. For example, the process of wrapping a value
    in a monad, as described by the Return function, might be implemented as a constructor
    call in object C#. The two functions could also be implemented as static methods,
    perhaps extension methods, elsewhere, instead of being instance methods in the
    type itself.'
