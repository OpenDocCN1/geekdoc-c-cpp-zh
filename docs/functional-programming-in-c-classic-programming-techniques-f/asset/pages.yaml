  md: "# Refactoring | 223\n\nThere are possible variations to this implementation,\
    \ but similar to the earlier discussion, they don't seem to be beneficial. Recursion\
    \ is, once more, an alternative that might turn useful in a language with tail\
    \ call optimization — especially since there's one loop instead of two nested\
    \ ones. The other variation would be to implement the function Iterator as an\
    \ actual iterator in the C# sense of the word. But an iterator in .NET is meant\
    \ and expected to return to a different flow of control on each iteration — in\
    \ other languages, the same mechanism is referred to as a generator, which seems\
    \ to capture the idea of .NET iterators a bit better. In this case there is no\
    \ value to return after each run of the loop, and constructing such a virtually\
    \ artificially would mean creating an unneeded result object for each iteration.\
    \ Because you loops once for each iteration, at a depth of several hundred as\
    \ a low guess of the average iterations, which would mean 240 million unneeded\
    \ results for an image of 800600 points and MAX_ITERATIONS=1000.\n\nAt the end\
    \ of this study of the functions that are used with the newly structured algorithm,\
    \ a lot has been said about decisions and for against certain implementation patterns.\
    \ One thing hasn't been said: all these are almost entirely pure, with the exception\
    \ being the use of a mutable array for the color mapping step. This is of course\
    \ the perfect basis for parallelization of the algorithm, because it is now possible\
    \ to execute array parallel controls without any potential collisions.\n\nThe\
    \ sample solution for this chapter contains a frontend implementation called ManualConcurrent,\
    \ which uses the approach of splitting the target image into blocks and managing\
    \ them for parallel calculation with the help of the FunctionalMandelbrot library.\
    \ This implementation is called Manual because it uses basic .NET Threads for\
    \ the parallelization and handles the custom data structures. This is an approach\
    \ that can be used with .NET versions 2.0 (the implementation makes heavy use\
    \ of generics) and later.\n\nIn .NET 4.0, the availability of the Parallel Extensions\
    \ takes away a lot of the technical work associated with creating and managing\
    \ threads, their runtime behavior and return values. The project FunctionalMandelbrot\
    \ is a slightly changed version of FunctionalMandelbrot, only a single important\
    \ change has been made in this version, using the function CalcArea:\n\n```\n\
    public static void CalcArea(int width, int height, CalcInfo calcInfo,\n    Action<PointResult>\
    \ resultReceiver) {\n    var points = PointSequence(width, height);\n\n    Parallel.ForEach(points,\
    \ p => {\n        var resultReceiver = CalcPoint(p, calcInfo);\n        resultReceiver(resultReceiver);\n\
    \    });\n}\n```\n\nOne change is the new resultReceiver delegate that is used\
    \ to push the results right into a separate execution path once they have been\
    \ calculated. But the most relevant element is the replacement of the Map function\
    \ with a call into Parallel.ForEach. Similar to the last step in the List Filtering\
    \ example, this is a single change for a feature of the Parallel Extensions. In\
    \ this case, Parallel.ForEach is used to iterate over the points sequence and\
    \ call into CalcPoint for each of them."
