    \ you are better off keeping an immutable source list around as a class level.\
    \ Again, it's all about compromise.\n\nThe final stage in the sequence of business\
    \ application scenarios is the ShowFilteredList, which has one minor difference\
    \ compared to stage 3. The implementation of the GetFilteredList function has\
    \ been changed to:\n\n```\nprivate static List<Person> GetFilteredList(List<Person>\
    \ source, string filter) {\n    return filter == null ? source : (from p in source.AsParallel()\n\
    \    where p.Name.Contains(filter)\n    select p.ToList());\n}\n\n```\n\nThe difference\
    \ is the addition of the call to AsParallel to the source list. AsParallel is\
