  md: "Now it's time to get back to the difference between left and right folding.\
    \ Have another look at a simple sum calculation:\n\n```\nFunc<int, int, int> acc\
    \ = (r, x) => r + x;\nvar sum = Functional.Foldl(acc, 0, Enumerable.Range(1, 5));\n\
    ```\n\nAs you know, the function calls the accumulator first with the start value\
    \ and the first value from the list. Then it calls the accumulator again, with\
    \ the result from the first time and the next value from the list. The overall\
    \ result of the calculation is this:\n\n```\nacc(acc(acc(acc(0, 1), 2), 3), 4),\
    \ 5)\n```\n\nObviously, the sequence of numbers added is up in a particular order\
    \ — from left to right. In this case where all numbers are being added, the order\
    \ doesn't actually matter, because the operator in question, the addition, is\
    \ associative.\n\nUsing right folding, the expression changes to this:\n\n```\n\
    acc(1, acc(2, acc(3, acc(4, acc(5, 0)))))\n```\n\nIf the operation is being applied\
    \ by the accumulator is non-associative, then it is important to choose the right\
    \ between left and right folding.\n\nFrom a technical point of view, there are\
    \ two differences between left and right folding. First, the sequence of applying\
    \ the accumulator starts from the end of the sequence that is being passed in.\
    \ Second, the order of parameters passed to the accumulator changes — with left\
    \ folding, the result of previous computation was passed first, with right folding\
    \ it's passed second. The second point is really more a convention than a necessity,\
    \ but since this convention is being followed in the vast majority of right folding\
