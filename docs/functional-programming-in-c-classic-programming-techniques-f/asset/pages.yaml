  md: "# Automatic Cloning\n\nAnother problem with cloning is with the syntax of applying\
    \ cloning in C#. An earlier example showed a new version of the chicken constructed\
    \ by passing in one old and one new value to the constructor of the class. Unfortunately,\
    \ it isn't going to be simple in real applications because your data structures\
    \ will be much more complex, meaning you'll have to pass in lots and lots of constructors\
    \ that are simply read from the old version of the object to create a clone with\
    \ a single changed value. Unlike many functional programming languages, C# doesn't\
    \ have syntax support for the creation of a modified clone, which makes cloning\
    \ cumbersome from a coding and reliability point of view.\n\nFClib implements\
    \ some functionality that can be useful to automate the process of cloning to\
    \ a certain extent, although it comes at a cost. The code doesn't use reflection\
    \ and is compiled to expression trees to dynamically access property values and\
    \ construct new objects, the process of creating a clone with the help of this\
    \ functionality is still much slower than creating the same manually in C#.\n\n\
    With the help of the library, the combination of cloned chicken and order line\
    \ can be constructed like:\n\n```\nvar chicken = new PersistentProduct('Rubber\
    \ Chicken', 10.99m);\nvar orderLine = new PersistentOrderLine(chicken, 5);\n```\n\
    \n```\nchicken = chicken.CloneWith(new Dictionary<string, object>(\n  \"Price\"\
    , 8.49m\n));\n = orderLine.CloneWith(new Dictionary<string, object>(\n  \"Product\"\
