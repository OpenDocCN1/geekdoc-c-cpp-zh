  md: "body of the iterator function, which picks up where it left off (or that's\
    \ what it looks like — the reality is a bit different, as the Reflector stops\
    \ output from before showed). Again no overhead is involved when the consumer\
    \ stops retrieving values. The pattern only does much work as required.\n\nThe\
    \ following code snippet shows a practical example of an iterator that retrieves\
    \ data from a web service, a search of the Twitter stream. Data is retrieved lazily\
    \ from web service, because it paging automatically. The iterator retrieves new\
    \ pages and returns a string sequence to the caller that is of unknown length.\
    \ The caller can decide to handle that any way it likes — in this example by chaining\
    \ into Take:\n\n```\nprivate static void TwitterSearchIterator() {\n    foreach\
    \ (var tweet in GetTweets(\"#msdn\").Take(10))\n        Console.WriteLine(tweet);\n\
    }\n```\n\n```\nprivate static IEnumerator<string> GetTweets(string searchString)\
    \ {\n    var url = \"http://twitter.com/search/search.atom?q=\";\n    int page\
    \ = 1;\n    var escapedSearchString = searchString.Replace(\"*\", \"%40\").Replace(\"\
    #\", \"%23\");\n    XmlNamespace ns = \"http://www.w3.org/2005/Atom\";\n\n   \
    \ while (true) {\n        var doc = XDocument.Load(String.Format(\n          \
    \  \"{0}(1)&page={2}\", url, escapedSearchString, page));\n        var entries\
    \ = doc.Root.Elements(ns + \"entry\");\n        if (entries.Count() == 0)\n  \
    \          yield break;\n        foreach (var entry in entries)\n            yield\
    \ entry.Element(ns + \"author\").Element(ns + \"name\").Value + \": \" +\n   \
    \             WebUtility.HtmlDecode(entry.Element(ns + \"title\").Value);\n  \
    \  }\n}\n```\n\n# Returning IEnumerator\n\nInstead of the IIEnumerable and IEnumerable<T>\
    \ that have been used in examples so far, you can also return IEnumerator or IEnumerator<T>.\
    \ The code created by the compiler is adjusted automatically, so that these interfaces\
    \ are implemented by the auto-created iterator class. Now, you will see cases\
    \ where functions were used to return instances of those auto-created iterator\
    \ classes. Sometimes you want to write a class that is an iterator itself. If\
    \ you use foreach to iterate over an instance of your class.\" Obviously this\
    \ makes most sense if you assume that the class is a collection of some description.\
    \ In such a scenario, it is not sufficient to implement a method that returns\
    \ an auto-generated iterator. What you need to do implement IEnumerable<T> on\
    \ the class itself, which means supplying a GetEnumerator function."
