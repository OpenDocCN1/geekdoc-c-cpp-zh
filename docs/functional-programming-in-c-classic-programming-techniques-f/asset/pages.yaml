  md: "# 258 | CHAPTER 21 EXISTING PROJECTS USING FUNCTIONAL TECHNIQUES\n\nSpace Qizmt\
    \ is an open source system that implements MapReduce, which can be readily installed\
    \ on your own machine or machines. Qizmt is reasonably well documented in a wiki\
    \ and getting started with your own C#-written MapReduce \"jobs\" is straightforward.\
    \ Unfortunately the project status is a little unclear: At the time of writing,\
    \ the latest public download (which is called an alpha version) is from February\
    \ 2010.\n\nNumerous products, some of which are commercial, exist in the .NET\
    \ space that make MapReduce an option for C# developers. Depending on your needs,\
    \ it makes sense to consider implementing the pattern yourself. In the case where\
    \ your needs not involve any infrastructure outside of the machine where the code\
    \ executes, MapReduce offers a simple and widely accepted pattern for the implementation\
    \ of parallel data algorithms.\n\nCuriously, Google doesn't provide access to\
    \ a MapReduce service similar to the Amazon offering. In the cloud computing space,\
    \ Google has its own App Engine. There are independent projects that implement\
    \ MapReduce for platform, but nothing from Google. It has also become known that\
    \ Google has moved on MapReduce for the indexing needs of its web search engine.\
    \ MapReduce is not a golden bullet, and Google's decision is purely requirements\
    \ based. For extensible, parallelizable, infrastructure-backed systems that perform\
    \ data and compute intensive tasks, MapReduce can be a great solution.\n\n# NUNIT\n\
    \nYou're probably familiar with the unit-testing framework NUnit, the .NET variant\
    \ of the Java-based JUnit. In case you don't do testing at all (and you should,\
    \ of course!), here's how NUnit can be used to implement a test:\n\n```\npublic\
    \ static class Calculator (\n    public static int Add (int a, int b) {\n    \
    \    return a + b;\n    }\n}\n\n[Fixture]\npublic class Tests {\n    [Test]\n\
    \    internal void AddTest() {\n        Assert.AreEqual(20 + 10, Calculator.Add(20,\
    \ 10));\n    }\n}\n```\n\nUsing a test runner, a program that loads the assembly\
    \ with the tests inside and executes all the methods marked with the attributes,\
    \ you can now execute the tests against your implemented functionality. When a\
    \ test fails, the Assert.AreEqual() method (or one of the other methods in the\
    \ Assert class) throws an exception, and the test runner outputs information about\
    \ the test that has failed and the exception it has caught."
