  md: 'there''s a layer of language features on top, which makes the APIs much easier
    to use in C#. This includes features such lambda expressions, expression trees,
    and extension methods.


    Most recently, in .NET 4.0, there is new functional oriented functionality in
    the Parallel Extensions (PFX), which are also mentioned later in this chapter.
    Some of their syntax is based on higher order functions, and on mechanisms of
    lazy evaluation. Functional purity is a great target if you would like to work
    with PFX easily.


    Overall, there is a list of elements of the .NET Framework that have a functional
    nature or were at least influenced by functional ideas. But .NET is meant to be
    a largely agnostic platform, and the languages do grant most of the work to implement
    their paradigms. The central framework of functionality is often reason for compromises
    in the languages, but the functionality that has been introduced in C# over the
    years, as well the official support for new languages like F#, show that .NET
    is at least to a wide spectrum of language paradigms.


    # LINQ


    LINQ is a functional API that is largely pure. It was introduced in .NET version
    3.5, with Visual Studio 2008 and C# 3.0. Many of the new features in C# 3.0 were
    originally introduced to support LINQ, and creative programmers have found many
    other applications since. An in-depth look at LINQ is quite telling when trying
    to assess Microsoft''s position regarding functional programming in the "old".NET
    languages (that is, leaving F out of the equation).


    # LINQ to Objects


    Many features of both the language and framework level play together for the experience
    provided by LINQ to Objects. The term LINQ to Objects usually describes the part
    of LINQ that works entirely within your application, that is, native .NET objects
    as opposed to data that is queried from elsewhere. The latter scenario is also
    discussed in this section, but for the focus is what you can do with objects.


    A simple example of a LINQ query is this:


    ```

    var values = new[] { 1, 2, 3, 4, 5, 6, 7, 8 };

    var valuesGreater5 =

    from v in values

    where v > 5

    select v;

    ```


    Starting from a simple array of integer values, the query selects those values
    that are greater than 5. It''s important to understand that the query expression
    is just syntactic sugar, which is translated by the C# compiler into method calls.
    The API of LINQ is therefore language agnostic, and it could even be from a .NET
    language that doesn''t have any special LINQ syntax. Here''s an equivalent of
    the preceding code, without using the LINQ feature of C# 3.0:


    ```

    var values = new[] { 1, 2, 3, 4, 5, 6, 7, 8 };

    var valuesGreater5 =

    values.Where(v => v > 5).Select(v => v);

    ```'
