    \ is the use of the Func<...> delegate to store the reference for the function.\n\
    \n# Prefer Higher Order Functions over Manual Algorithm Implementation\n\nThe\
    \ advantages of higher order functions overlap with those of many other techniques\
    \ that are commonly used in object oriented programming. For example, the Template\
    \ Method Pattern is a design approach in which a base class is used to implement\
    \ part of an algorithm, leaving certain details to a separate method (or several\
    \ of them), which is typically abstract in the base class and implemented only\
    \ in more specific derived classes. This fits descriptions of higher order functions\
    \ perfectly.\n\nGenerally speaking, higher order functions use a form of injection\
    \ to execute a template algorithm with the details being filled in separate functions.\
    \ The advantage is that the higher order function itself defines a sort of pattern,\
    \ which can be recognized and understood more easily than an explicit implementation\
    \ of the algorithm. Consider these two implementations of a function that sums\
    \ up from a list:\n\n```\nprivate static void SumIntsImperative(IEnumerable<int>\
    \ ints) {\n  int result = 0;\n  foreach (int v in ints)\n    result += v;\n  Console.WriteLine(result);\n\
    }\n```\n\n```\nprivate static void SumIntsFunctional(IEnumerable<int> ints) {\n\
    \  var result = Functional.FoldL((s, v) => s + v, 0, ints);\n  Console.WriteLine(result);\n\
    }\n```\n\nThe imperative function requires you to look at the loop instruction\
    \ as well as the calculation instruction. This is a simple example, of course,\
    \ and you’re going to see very quickly what’s happening. The functional example\
    \ with its application of Fold makes this even easier — you see the word Fold,\
    \ have one look at the aggregation instruction, and you’re done. By the way: the\
    \ use of foreach in the imperative example has very much the same purpose as the\
    \ higher order functions."
