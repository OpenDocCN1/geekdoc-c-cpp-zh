  md: "# CHAPTER 8 CURRYING AND PARTIAL APPLICATION\n\nIn most .NET languages the\
    \ parameter list is declared for a particular function is static. That means that\
    \ the function in question can only be called with all the parameters at once.\
    \ In fact, the notion of calling a function with an incomplete list of parameters\
    \ probably strikes C# programmers as rather odd. Nevertheless, this is exactly\
    \ what currying is: splitting the parameter list, so it becomes possible to call\
    \ functions with an incomplete set of parameters.\n\nYou might think that this\
    \ object oriented languages, or even imperative languages in general, have their\
    \ own mechanisms for providing convenient variants of functions or methods, for\
    \ those cases where the standard implementations are found to be too complex to\
    \ use. This is an absolutely correct notion. Mechanisms like overloading or extension\
    \ methods have a similar purpose. However, the functional alternatives have advantages\
    \ when it comes to function reuse and modularization, which makes them an interesting\
    \ option.\n\n# Manual Currying\n\nCurrying is a transformation technique that\
    \ starts with a function with multiple parameters and converts it into a sequence\
    \ of functions that accept only one parameter at a time and return the next function\
    \ in the sequence. At the end of this chain of functions, all parameters are available\
    \ at once, allowing the original algorithm to do work.\n\nTo illustrate this process,\
    \ consider the following simple function in C# 2.0-compatible anonymous method\
    \ syntax:\n\n```\nFunc<int, int> add = \ndelegate(int x, int y) {\n  return x\
    \ + y;\n}\n```\n\nThis is a function that adds two parameters and returns the\
    \ result of the two values. When this function is called, the caller must supply\
    \ both arguments x and y at once; the syntactic constraints of C# don't allow\
    \ any other approach.\n\nApplying currying to this function means creating a function\
    \ that accepts only one parameter, then returns another function that takes the\
    \ second parameter, and then returns the result of the addition. Typically the\
    \ order of parameters after the application of currying will be the same as before,\
    \ although it doesn't have to be. You can find more information on the topic of\
    \ parameter order in the section \"Why Parameter Order Matters\" later in this\
    \ chapter.\n\nThis is what the function looks like after currying has been applied:\n\
    \n```\nFunc<int, Func<int, int>> curriedAdd = \ndelegate(int x) {\n  return delegate(int\
    \ y) {\n    return x + y;\n  }\n}\n```\n\nAs you can see, this implementation\
    \ is exactly what was just described: a function that takes the first parameter\
    \ and returns another function, which takes the second parameter and returns the\
    \ result of the computation."
