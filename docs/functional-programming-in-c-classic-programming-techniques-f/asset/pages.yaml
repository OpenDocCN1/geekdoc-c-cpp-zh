  md: "# HOW CLOSURES WORK\n\nTo understand the nature of closures, it's best to look\
    \ at some examples that utilize them.\nHave a look at this code:\n\n```\nstatic\
    \ void Closures() {\n    Console.WriteLine(GetClosureFunction() (30));\n}\n\n\
    static Func<int, int> GetClosureFunction() (\n    int val = 10;\n    Func<int,\
    \ int> internalAdd = x => x + val;\n\n    Console.WriteLine(internalAdd(10));\n\
    \n    var val = 30;\n    Console.WriteLine(internalAdd(10));\n\n    return internalAdd;\n\
    }\n```\n\nFollow the path of execution: the function Closures calls into GetClosure.\
    \ There is an odd pair of parentheses behind that call, with the parameter 30.\
    \ This is because GetClosure returns a function that is then called right away.\n\
    \nIn GetClosure, there is a local variable called val, and a local function called\
    \ internalAdd, which adds val to a parameter x. internalAdd is then called and\
    \ the val 10 is passed in. What do you think the output is to be? The answer is\
    \ 20 — the value of val plus the parameter 10.\n\nNow val is changed to 30 and\
    \ internalAdd is called again. The result is 40, so you learn something about\
    \ how the local function works with local variables in that scope: obviously the\
    \ local variable is picked by internalAdd, even though it was created after internalAdd\
    \ had been originally created.\n\nFinally, internalAdd is returned from GetClosureFunction,\
    \ and as you saw initially, it is being called with the parameter 30. The result\
    \ is 60, the last known value of val plus the parameter 30.\n\nSo far, good, this\
    \ is just what might be expecting in this situation. It's the only thing that\
    \ you would really want to happen in this situation. It's not logical at first\
    \ glance, val is supposed to be a local variable, living on the stack, and at\
    \ least when GetClosure returns, it should be gone. Right? And that shows exactly\
    \ why the purpose of closures is: prevent values from going out of scope when\
    \ the compiler can clearly tell that this would result in a crash of your application.\n\
    \nThe very high-level explanation of how closures work is quite simple. The compiler\
    \ notices that the anonymous function created within GetClosureFunction refers\
    \ to an element from an outer scope (that's the variable val). Since functions\
    \ can be passed around like data in C#, it is possible that the function survives\
    \ longer than the value of val. If the function is called at a later"
  merge: -1
  pgno: 76
- img_proc: true
  md: "point, potentially from an entirely different place in the application code,\
    \ the application would crash if the value had been removed from memory then.\
    \ The compiler goes ahead and stores that value in a safe location (anywhere but\
    \ the function stack does the job), in case it is used later.\n\nFrom a technical\
    \ perspective, the location where that gets stored away is important. The compiler\
    \ creates an anonymous class, and an instance of that is created GetClosureFunction.\
    \ The anonymous function is created as a function that is anonymous class— if\
    \ the closure functionality weren't required here, then anonymous function would\
    \ just be created in the class with GetClosureFunction also lives. The local variable\
    \ val is actually not a local variable anymore; instead it is a field in the anonymous\
    \ class.\n\nAs a result, internalAdd refers the function that is in the anonymous\
    \ class instance. That instance also contains the data, which is stored for as\
    \ a reference to internalAdd is kept around.\n\nThe following code shows the schema\
    \ that is implemented by the compiler in this case. You can use the Refactor tool\
    \ to see this for yourself. All auto-generated names have been changed and the\
    \ code cleaned up for a bit of readability.\n\n```\n[CompilerGenerated]\nprivate\
    \ sealed class DisplayClass {\n    public int val;\n\n    public int AnonymousFunction(int\
    \ x) {\n        return x + this.val;\n    }\n}\n\nprivate static Func<int, int>\
    \ GetClosureFunction() {\n    DisplayClass displayClass = new DisplayClass();\n\
