  md: "# Covariance and Contravariance\n\nHere's one example of a situation where\
    \ C# supports covariance. First, this is an array of objects:\n\n```\nobject[]\
    \ objects = new object[3];\nobjects[0] = new object();\nobjects[1] = \"Just a\
    \ string\";\nobjects[2] = 10;\n```\n\nOf course it is possible to insert different\
    \ values into the array because in the end they all derive from Object in .NET.\
    \ In other words, Object is a very general or large type. Now here's a spot where\
    \ covariance is supported: assigning a value of a smaller type to a variable of\
    \ a larger type.\n\n```\nstring[] strings = new string[] { \"one\", \"two\", \"\
    three\" };\nobjects = strings;\n```\n\nThe variable objects, which is of type\
    \ object[], can store a value that is in fact of type string[]. Think about it\
    \ - to a point, what you expect, but then again it isn't. After, while string\
    \ derives from object, string[] doesn't derive from object[1]. The language support\
    \ for covariance in this example makes the assignment possible anyway, which is\
    \ something you'll find in many cases. Variance is a feature that makes the language\
    \ more intuitive.\n\nThe considerations around these topics are extremely complicated.\
    \ For instance, based on the preceding code, here are two scenarios that will\
    \ result in errors:\n\n```\n// Runtime exception here - the array is of type string[],\n\
    // ints can't be inserted\nobjects[2] = 10;\n\n// Compiler error here - covariance\
    \ support in this scenario only\n// covers reference types, and int is a value\
    \ type\nint[] ints = new int[] { 1, 2, 3 };\nobjects = ints;\n```\n\nAn example\
    \ for the workings of contravariance is a bit more complicated. Imagine these\
    \ two classes:\n\n```\nclass Person : IPerson {\n    public Person() { }\n}\n\n\
    class Woman : Person {\n    public Woman() { }\n}\n```\n\nWoman is derived from\
    \ Person, obviously. Now you have these two functions:\n\n```\nstatic void WorkWithPerson(Person\
    \ person) {\n}\nstatic void WorkWithWoman(Woman woman) {\\}\n```"
