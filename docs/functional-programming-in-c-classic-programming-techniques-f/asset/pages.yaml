    \ (there's also indirect recursion, which is explained later in this chapter).\n\
    \n```\nif (x == 0)\n  return 1;\n```\n\nThis is called the base case of recursion.\
    \ Recursions always have a base case, although it's not as simple as this. The\
    \ base case defines the end of the recursion chain. Every time the recursive function\
    \ calls itself, it changes the parameters of the call, compared to the previous\
    \ invocation. Assuming the function is pure in a functional sense, this change\
    \ of the parameters is essential because the recursive calls would simply result\
