  md: '# The Relationship to Object Oriented Programming


    This is a very simple learning sample of Erlang. However, it uses constructs pointing
    at the Actor model based parameterization support provided by the language and
    its runtime. Erlang is not a strict functional language — mixing in the types
    of side effects provided by io:format would be possible in Haskell. But in many
    industrial applications, Erlang has an important role today for its stability
    and the particular feature it provides.


    As you can see, functional languages, like imperative ones, can take many different
    shapes. From the very simplistic approach of LISP to the advanced syntax of Haskell
    or the specific feature of Erlang, with many steps in between, there''s a great
    spectrum of languages available to programmers who want to choose a language for
    their functional origins. All three languages are available today, with strong
    runtime systems, even for .NET in the case of the LISP dialect Cloj. The ideas
    shown by these languages will be discussed further in the upcoming chapters.


    # THE RELATIONSHIP TO OBJECT ORIENTED PROGRAMMING


    It is a common assumption that the ideals of functional programming are incompatible
    with those of other schools of programming. In reality, most languages available
    today are hybrid in the sense that they do not focus-exclusively on one programming
    technique. There''s no reason why they should, either, because different techniques
    can complement one another.


    Object oriented programming brings a number of interesting aspects to the table.
    One of them is a focus on encapsulation, combining data and behavior into classes
    and objects, and defining interfaces for their interaction. These ideas help oriented
    languages promote modularization and a kind of reuse on the basis of the modules
    programmers. An aspect that''s responsible for the wide adoption object oriented
    programming is the way modeling real-world scenarios in computer programs. Many
    business application scenarios focus on data, and the data in question is often
    related to physical items, which have properties and are defined and distinguished
    by the way they interact with other items in their environments. As a result,
    oriented mechanisms are not just widely applicable, but they are also easy to
    grasp.


    When looking at a complicated industrial machine, for example, many programmers
    immediately come up with a way of modeling it as a collection of the wheels and
    cogs and other parts. Perhaps they consider viewing it an abstract system that
    takes some raw materials and creates an end product. For certain applications,
    however may be interesting to deal with what the machine does on a abstract level.
    There may be measures to read and analyze, and if the machine is complex enough,
    mathematical considerations might be behind the decisions for the parts to combine
    and the paths to take in the manufacturing process. This example can be abstracted
    extended toward any non-physical apparatus capable of generating output from input.


    In reality, both the functional and the abstract viewpoints are important. Programming
    doesn''t have a golden bullet, and programmers need to understand the different
    techniques at their disposal and make the decision for and against them on the
    basis of any problem with which they are confronted. Most programs have parts
    where data modeling is important, and they also have parts where algorithms are
    important. And of course they have many parts where there''s no clear distinction,'
  merge: -1
