  md: "# Implementing Iterator Functions\n\nThe entire pattern declared by the IEnumerable\
    \ and IEnumerator interfaces allows laziness. It's about fetching data when needed.\
    \ Fetching data in this context summarizes a number of possible operations: calculating\
    \ data, getting it from a remote location, or simply retrieving it part in a data\
    \ structure. The advantage of the pattern is that it is a flexible part in a bigger\
    \ algorithm. The sequence doesn't make any assumptions about where it's going\
    \ to be used. It may be that your application works with data structures that\
    \ are kept in memory, or it could just well work with data from a SQL database,\
    \ a Web service, or some other data source. A lazy pattern like iterators in C#\
    \ allows you to provide access to your data in a way that is modular and very\
    \ flexible, that doesn't impose any constraints on the rest of your code, or code\
    \ written by some else, with the data.\n\nAs an example of the laziness factor,\
    \ here's code that outputs some information:\n\n```\npublic static int ThreeNumbersDebug()\
    \ {\n    Console.WriteLine(\"Returning 3\");\n    yield return 3;\n    Console.WriteLine(\"\
    Returning 11\");\n    yield return 11;\n    Console.WriteLine(\"Returning 27\"\
    );\n    yield return 27;\n}\n```\n\n![](img/0bf1584a2ce4017291813385353496b6_68_0.png)\n\
    \n```\nConsole.WriteLine(\"Retrieving the list object\");\nvar list = ThreeNumbersDebug();\n\
    Console.WriteLine(\"Before the foreach loop\");\nforeach (var item in list)\n\
    Console.WriteLine(\"Got value (0)\", item);\n```\n\n![](img/0bf1584a2ce4017291813385353496b6_68_1.png)\n\
    \nThe output is this:\n\nRetrieving the list object\nBefore the foreach loop\n\
    Returning 3\nGot value 3\nReturning 11\nGot value 11\nReturning 27\nGot value\
    \ 27\n\nTwo important things can be seen in this result. First, no values are\
    \ retrieved from the sequence at the point where the ThreeNumbersDebug is called.\
    \ It doesn't matter whether the values exist at this point, or whether they are\
    \ retrieved — there's no overhead involved with calling the iterator function.\
    \ Second, the debug output alternates between the iterator itself and the \"Got\
    \ value x\" confirmation of the code on the outer foreach loop. Every time a new\
    \ value is fetched, control is passed to the"
  merge: -1
