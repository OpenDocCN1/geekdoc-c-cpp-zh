  md: '> The iteration mechanisms described in this chapter are just one example of
    laziness applied to computer programming. A more general description of lazy evaluation
    can be found in Chapter 9, and caching techniques like those described in Chapter
    10 may be useful if you want to prevent values from being recalculated under any
    circumstances — until now, the sequences implemented using iterators will still
    evaluate, fetch, or calculate from scratch every time a new iteration is started.


    # SUMMARY


    Sequence support has been in .NET since the beginning. Its implementation in the
    framework is object oriented, based on interfaces. While it has always been possible
    to implement custom sequences, or iterators, by implementing those interfaces,
    the iterator support introduced in C# 2.0 made this task much easier. In spite
    of the heavy use Microsoft itself has made of this feature, the concept of iterators
    has remained vague for many developers. This chapter has demonstrated the basics
    of the syntax, and the rest of the book has many more iterator implementations
    to offer.'
