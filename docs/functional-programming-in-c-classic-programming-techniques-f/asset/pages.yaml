- img_proc: true
  md: 'typed function pointers available in many other, usually older, object oriented
    languages. In the same way, some patterns were implemented in a functional fashion
    from the get-go.


    The IEnumerable and IEnumerator interfaces provide one example of a framework
    feature that allows for all lazy evaluation goodness of sequences in functional
    languages, although the first version of C# only implemented the reading of such
    sequences with the foreach keyword. Programmers had to wait for C# 2.0 if they
    wanted to easily construct such sequences themselves, but when it came in the
    shape of iterators, it was another feature reminiscent of the approaches found
    in functional languages.


    .NET version 2.0 was a large release in terms of new framework features in the
    realm of functional approaches. Iterators, as mentioned, are a language feature.
    Generics, which are not strictly a framework feature but are of the type system,
    were introduced. Of course Framework support is required for generics — in the
    form of changes to the Reflection type classes, for instance. Generics also had
    major influence on the Framework and can probably be described as the most important
    feature to come to the .NET platform after version 1.0.


    > Generics is a term typically used in object programming, and as it is said to
    have been introduced first by the Ada programming language. But it goes back the
    more general idea of type polymorphism, more specifically parametric polymorphism,
    has been a staple of functional programming since the introduction of ML, and
    later influenced the designers of Ada. In .NET, generics were introduced at the
    initiative of Don Syme, who is also the architect and designer of the F language.


    Version 2.0 was an important one for functional programming in C# because anonymous
    methods were introduced. These are entirely a language feature, a strategy employed
    by Microsoft language teams quite over the years. Introducing features on the
    language level makes it easier for them because they don''t have to go through
    the process of agreeing with other teams or more general changes and additions
    to the Framework or the CL.


    A interesting framework nugget in version 2.0 came in the form of a few methods
    on the Array and List-T classes. ConvertAll and FindAll-were the first framework
    implementations of Map and Fold, however crippled, they worked only on the specific
    types they were implemented. In were also ForEach-T, which worked like a typical
    Application.


    With packages like Windows Presentation Foundation (WPF), Windows Communication
    Foundation (WCF), Workflow Foundation (WF), and others, lots of new functionality
    was introduced to .NET in version 3.0. These platforms remain largely imperative
    in their architecture, which may be sensitive given the nature of their applications
    user interaction and communication layers.


    Version 3.5 was the next step for functional ideas on .NET. The largest new block
    of framework functionality in that version was LINQ, and you will find the details
    in the next section of this chapter. Much of the LINQ functionality goes back
    to framework support, and'
