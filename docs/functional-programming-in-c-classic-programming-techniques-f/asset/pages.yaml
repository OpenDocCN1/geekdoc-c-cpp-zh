  md: '# FUNCTIONAL PROGRAMMING IS A MINDSET


    less specific type of declarative programming, compared to these examples, but
    it is still just an extension of ideas that are already quite common today.


    In the end, functional programming is a mindset. If you are willing to think in
    a certain way, you can offer interesting solutions or at least food for thought,
    with relevance to many practical aspects of programming. You can do it in any
    programming language you want — well, almost. It should make your life easier
    and reduce the amount of code you need to write as well as the time to market
    for your next project and the maintenance efforts that come later.


    Something''s sometimes criticized about functional programming is the fact that
    the approaches are not to the most performative ones you could use to solve any
    problem. This may or not be true for any algorithm-language combination — it is,
    of course, to make a general statement about this. It''s also difficult to judge
    when an application of functional principles may enable you to utilize the processing
    resources efficiently. The reality is that if a qualified person sat down and
    optimized each algorithm by hand, on a low level, using C code or assembler instructions,
    then he could make everything running more efficiently. But at some point in the
    past the majority of programmers started moving away from such approaches. They
    started looking at the time to market, the programmer''s efficiency, as a higher
    priority than the perfect algorithm from a machine utilization of view.


    Of course these were made gradually. Perhaps somebody went from C to C++ first,
    assuming the compiler would be almost efficient as for C. Java or .NET at some
    later point in time, where a virtual machine is the platform to program on, and
    just-in-time (JIT) compilers do the hopefully efficient job of translating to
    the native CPU code.


    Any kind of declarative programming is a logical next in step. You gain efficiency
    because the declarative language allows you to specify the problems you''re trying
    to solve, and the computer can help more than the solutions it has in purely imperative
    programming scenarios. The quality of that help is essentially what decides the
    performance of the final result. But in today''s world of hardware, multicore
    CPUs in machines and on graphics cards, and different versions and architectures
    of CPUs with many important distinctions, it isn''t hard to imagine that in the
    vast majority of cases a computer will make better choices — and much more quickly
    and efficiently than humans. But for those perfectionists and control freaks among
    us, there''s still the possibility of interfacing with code written directly in
    a low-level language.


    The first priority today is to program efficiently. The second priority, however
    closely it may follow, is to write efficient programs.'
