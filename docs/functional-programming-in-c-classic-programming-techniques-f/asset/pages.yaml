  md: "Many imperative languages, and especially those with elements that go back\
    \ to C, have singled out the value 0 (zero) for the purpose of meaning \"nothing.\"\
    \ Of course such a value must be distinguishable from all other values that mean\
    \ \"something.\" I'm sure you remember writing algorithms where some integer variable\
    \ was assigned a magic value of -1 (or something similar) at the start, as a default\
    \ or starting value. Very generally speaking, the zero value seemed a good idea\
    \ under the assumption that memory locations regularly store pointers to memory\
    \ locations, and a pointer to zero is not a valid pointer in most modern models,\
    \ it seems quite safe for the \"nothing\" case. For those architectures where\
    \ zero is, in fact, a valid pointer, the C language introduced the null to represent\
    \ an empty pointer—of course, it wouldn't have to be equal to zero on every single\
    \ platform targeted by the C language, but the concept is the same.\n\nFor many\
    \ cases the value null is obviously useless. If one only ever stored pointers\
    \ to memory locations in all their memory locations, where would that leave you\
