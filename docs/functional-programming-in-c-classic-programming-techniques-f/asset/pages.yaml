- img_proc: true
  md: "having wasted time is what they want to avoid at all cost. They are certainly\
    \ not always successful, but the attitude is a healthy for a programmer.\n\nLaziness\
    \ (well, within the terms described here) makes a programmer better programs.\
    \ Perhaps surprisingly, computer languages enable themselves to prevent doing\
    \ things that aren't really required at a particular point in time.\n\nChapter\
    \ 9 contains a lot of information on execution strategies, and how laziness can\
    \ be applied in C# on all kinds. But one particular kind of laziness has been\
    \ embedded not just in C#, but in the entire .NET Framework from the beginning;\
    \ the idea of laziness enumeration, and it is at the core of .NET collection and\
    \ sequence classes. Since .NET 3.5 and C# 3.0, with the advent of Language-Integrated\
    \ Query (LINQ), laziness has given even more significance because LINQ to Objects,\
    \ the in-memory subsystem of LINQ, is based heavily on that approach.\n\nLazy\
    \ enumeration is an iteration approach, which has at its core the idea that data\
    \ should be fetched only when it is actually needed. This allows any algorithm\
    \ to be as efficient as possible, while retaining the flexibility to retrieve\
    \ as much data as necessary without any overhead.\n\n# ENUMERATING THINGS WITH\
    \ .NET\n\nThe base of .NET collection is an interface IEnumerable. Newer collections\
    \ (since .NET 2.0) are based on the generic IEnumerable<T> instead, but for the\
    \ purposes of this description, the untyped basic IEnumerable shall suffice. All\
    \ collections implement IEnumerable, but sometimes classes implement it as sequences\
    \ instead of collections. As you will see, Iumerable only requires extremely basic\
    \ functionality. Here's the interface itself:\n\n```\npublic interface IEnumerable\
    \ {\n    IEnumerator GetEnumerator();\n}\n```\n\nThe only thing the interface\
    \ IEnumerable actually allows you to do is to query another interface (Enumerator)\
    \ from a class. Here's the declaration of IEnumerator:\n\n```\npublic interface\
    \ IEnumerator {\n    object Current { get; }\n    bool MoveNext();\n    void Reset();\n\
    }\n```\n\nImagine a list that implements IEnumerable. When GetEnumerator is called,\
    \ the object returns an implementation of IEnumerator. That implementation allows\
    \ iteration over the elements of the list. Call Reset to get the start, to the\
