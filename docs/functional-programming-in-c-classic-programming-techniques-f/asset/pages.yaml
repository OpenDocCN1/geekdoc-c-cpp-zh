  md: "A very simple version of the persistent list type looks like this:\n\n```\n\
    public class ListStep1<T> {\n    public readonly T Head;\n    public readonly\
    \ ListStep1<T> Tail;\n    public readonly bool IsEmpty;\n\n    public static readonly\
    \ ListStep1<T> Empty = new ListStep1<T> ();\n\n    private ListStep1() () {\n\
    \        IsEmpty = true;\n    }\n\n    public ListStep1(T head, ListStep1<T> tail)\
    \ {\n        this.Head = head;\n        if (tail.IsEmpty)\n            this.Tail\
    \ = ListStep1<T>.Empty;\n        else\n            this.Tail = tail;\n    }\n\n\
    \    public ListStep1(T head) : this(head, ListStep1<T>.Empty) { }\n}\n```\n\n\
    > The name of the class is ListStep1 here, because the download code for this\
    \ chapter walks through several iterations. In FCSlib, the complete data type\
    \ is available under the name List<T> in the namespace FCSlib.Collections.\n\n\
    The list is generic, so it can work with any type of object you want to store\
    \ in it. To illustrate the API in this refer, here's a line of code that would\
    \ instantiate a list with two integers:\n\n```\nvar list = new ListStep1<int>(10,\
    \ new ListStep1<int>(20, ListStep1<int>.Empty));\n```\n\nAs you can see, the list\
    \ itself is actually the type that stores a single item. It uses a field called\
    \ Head for purpose, which is common naming in functional programming. The rest\
    \ of the list, from each element's point of view, is called the Tail. Eventually,\
    \ a list is terminated by having an empty list as its Tail. That's it!\n\nThere\
    \ are a lot of extensions you can implement to make the list type easier to use.\
    \ The first one is a helper function referred to as Cons (originating from the\
    \ L language and the term \"construct\"). Cons takes an element of the data stored\
    \ in a list, as well as a list of that type, and prepends the new element to the\
    \ list. Here is it:\n\n```\npublic static ListStep2<T> Cons(T element, ListStep2<T>\
    \ list) {\n    if (list.IsEmpty)\n        return new ListStep2<T>(element);\n\
