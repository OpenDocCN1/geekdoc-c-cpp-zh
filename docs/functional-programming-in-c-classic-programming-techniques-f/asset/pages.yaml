    \ initializing collections. Often there are different kinds of list comprehensions,\
    \ with slight syntactic differences, to create lists, sequences, and sometimes\
    \ other structures. For example, in F# language [<expression>] creates a list,\
    \ where <expression> creates a sequence.\n\nIn .NET terms, a sequence is an iterator;\
    \ in other words, an implementation of the IEnumerable. Iteration over the values\
    \ in the sequence happens step by step, which makes values calculated, retrieved,\
    \ or otherwise manufactured one by one when they are requested from outside. The\
    \ advantage of sequences is mainly in this lazy evaluation approach, where the\
    \ basic sequence doesn't make any assumptions about where it is going to go. Sequences\
    \ can be empty, endless, or somewhere in between, and a caller can't calculate\
    \ the total length of a sequence without retrieving all its elements.\n\nA list,\
    \ on the other hand, is a collection of elements that exists in memory and can\
    \ be read easily, typically using direct index access — still according to general\
    \ .NET terminology. Obviously, a list can be constructed from a sequence at any\
    \ time, and for some others this is necessary. For instance, a sequence of numbers\
    \ can't be fully sorted without retrieving all values from the sequence.\n\nIn\
    \ C# it is possible to extend the language for advanced list comprehension support,\
    \ but that doesn't change the importance of the use cases covered by list comprehensions\
    \ in languages that have them. Since C# 2.0, it has been possible to use iter\
    \ to create sequences of numbers based on algorithms, but the minimum requirement\
    \ for a sequence is still a function that implements the algorithm. The yield\
    \ return statement that's needed for iterators is not available in anonymous methods\
    \ or lambda expressions, so the creation of sequences on-the-fly is something\
    \ that is natively covered.\n\n# A FUNCTIONAL APPROACH TO ITERATORS\n\nAn iterator\
    \ function can be generic, which is an approach that most of LINQ functions use\
    \ to work with arbitrary types. Using the ideas of higher order functions, then,\
