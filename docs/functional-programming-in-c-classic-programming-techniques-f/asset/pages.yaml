  md: '# 21

    Existing Projects Using Functional Techniques


    WHAT''S IN THIS CHAPTER?


    +   - The .NET Framework

    - LINQ

    - MapReduce implementations

    - NUnit


    Functional programming is not theoretical. It exists; it is out there. It is interesting
    how polarizing any discussion about these facts is. There are those programmers
    who think it''s obvious how exciting functional programming is, and all their
    friends do it. There are also those who have hardly met somebody who does functional
    programming, and who think it''s rather academic and doesnbody apply to their
    work. Of course, there are many somewhere between these extremes.


    As programmers on the .NET platform, you don''t need to be shown places where
    classes and objects live. To provide a more complete overall perspective, this
    chapter attempts to point out some of the more popular places where functions
    are important.


    # THE .NET FRAMEWORK


    Since its first versions, the .NET Framework and its languages have had certain
    influences from functional programming. From the outside it''s hard to judge whether
    somebody from the Framework team came up with the idea of creating a System.Delegate
    type, or whether that was set by the language teams. However, this happened before
    the first version of the .NET Framework became publicly available, and it is a
    great improvement over the loosely'
