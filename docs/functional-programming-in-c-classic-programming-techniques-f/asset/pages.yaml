  md: '# Declarative Programming | 11


    There are other solutions to many of these, such as specialized lock types or
    other synchronization structures like queues or flags.


    In functional programming, programmers have learned to deal with the management
    of size effects in a different way because the structure and background of their
    languages required this to a higher degree. It would be wrong to say that functional
    programming has all the answers to the parallelization problems, without side
    effects, which in turn makes easy parallelization. Taking those strategies into
    account what makes functional programming interesting to so many days, whether
    or not their languages were meant to be functional by their inventors. Parts of
    this book describe the application of functional techniques specifically with
    parallelization in mind.


    # AGILE PROGRAMMING METHODOLOGIES


    After parallelization, a second interesting consideration is that of functional
    modularization — that is, modularization on the level of individual functions.
    In oriented languages, typically classes and methods within classes. There are
    languages that allow the nesting of methods, but do not — in C#, instance methods
    cannot be nested. But the use of anonymous methods and lambda expressions allow
    the creation of functions that are local to methods, which opens the door to modularization
    on the algorithm level.


    This not fits very well with the application of modern software development methodologies
    like Agile. One of the main ideas in this space is an evolutionary approach in
    which programmers work along simple requirement specifications and, in a nutshell,
    do only what is necessary in each step to satisfy these requirements. Refactoring
    becomes an important part of the concept, and modularization, with the implied
    result resulting from it, can be very useful as a technique on a method or function
    level when the introduction of new methods on the class level seems too large
    to take. Just like in the area of techniques for parallelization, functional programming
    doesn''t offer a magical solution here, but there''s a lot to learn from functional
    techniques that have employed functions as reusable building blocks for a long
    time.


    # DECLARATIVE PROGRAMMING


    Functional programming is generally regarded as a style of declarative programming.
    The target of declarative programming is to specify the goal, the logic of what
    a program, or part of a program, should do, without describing the steps necessary
    to achieve that goal. In other words, it is about leaving choices to the computer
    when it comes to the details of executing a program, instead of requiring the
    programmer to specify these. Many types of declarative programming have been accepted
    into the mainstream over years.


    Domain-specific languages are one example. HTML, XML, and XAML can be regarded
    as languages that document data and well as execution instructions. Regular expressions
    describe complex input and their engines effectively parse and manipulate data.
    Querying languages such as SQL and the in-code querying functionality of LINQ
    are variations of declarative programming, as are the code contracts available
    in .NET 4.0. Functional programming is a'
