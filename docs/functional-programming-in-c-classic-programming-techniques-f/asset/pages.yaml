  md: "# CHAPTER 12 STANDARD HIGHER ORDER FUNCTIONS\n\nThe following sections describe\
    \ how Map, Filter, and Fold work, and how they are implemented in FCSlib. You\
    \ will find practical use cases of these functions throughout the book.\n\n# APPLYING\
    \ OPERATIONS: MAP\n\nThe Map function is quite simple — but that's the nature\
    \ of the standard higher order functions; what makes them the great building blocks\
    \ are functional programming. Map takes a list of elements and a function to call\
    \ each element in turn. Then it constructs a new list from the results of the\
    \ function calls and returns it new.\n\nUsing iterators in C#, Map can be lazily\
    \ implemented. Here is the implementation from FCSlib:\n\n```\nstatic IEnumerable<R>\
    \ Map<T, R>(Converter<T, R> function, IEnumerable<T> list)\n{\n    foreach (T\
    \ sourceVal in list)\n        yield return function(sourceVal);\n```\n\nThe Converter<T,R>\
    \ delegate is an implementation that receives a parameter of type T and returns\
    \ an element of type R. The name Converter can be a bit misleading, the function\
    \ doesn't necessarily convert anything. It might just well extract something,\
    \ which is a major use case of the Map function. For example, given a list of\
    \ objects, Map can be used to extract a particular property of each the objects:\n\
    \n```\nvar people = new List<Person>\nnew Person (Name = \"Harry\", Age = 32),\n\
    new Person (Name = \"Anna\", Age = 45),\nnew Person (Name = \"Willy\", Age = 43),\n\
    new Person (Name = \"Rose\", Age = 37);\n\nvar names = Functional.Map(p => p.Name,\
    \ people);\n```\n\nOf course, actual calculations can be performed just easily\
    \ as:\n\n```\nvar squares = Functional.Map(i => i * i, IEnumerable.Range(1, 10));\n\
    ```\n\n# Using Criteria: Filter\n\nFilter is a function that applies criteria\
    \ to elements in the list. The criterion is a function itself and it is called\
    \ for each of elements in the source. The resulting list contains those elements\
    \ for which the criterion returned a positive result. The implementation of Filter\
    \ which is part of FCSlib looks like this:\n\n```\npublic static IEnumerable<T>\
    \ Filter<T>(Predicate<T> predicate, IEnumerable<T> list)\n{foreach (T val in list)\n\
    \    if (predicate(val))\n        yield return val;\n```"
