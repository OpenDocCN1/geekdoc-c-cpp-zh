    For comparison, Haskell already has a typeclass, which is called Eq. It is very
    similar to MyEq, with the exception that the comparison function itself is not
    called isEqual, instead it is called (=). The operator == is an infix function
    in Haskell, declared by the typeclass Eq. In the same way, types of standard behavior
    are described in typeclasses.


    Up to this point, you might associate typeclasses with two constructs from the
    object oriented world: interfaces and abstract classes. In reality there are many
    differences.


    It is correct that you associate typeclasses, similar to interfaces, can declare
    a number of functions that need to be available for the typeclass to be satisfied.
    Abstract classes can contain code and specify implementation requirements at the
    same time, but a data type that fulfills the contract defined by an abstract base
    class must be derived from that base.


    As the example instance for the Bool type shown, typeclass instances can be created
    outside of, and totally independent from, the type to which they apply. There
    are three clearly separated tasks in fully implementing a typeclass with support:


    +   1. Obtain a type — create it, or perhaps you''ve already got it.

    2. Decide on a typeclass, that, a behavior that this type should support — again,
    perhaps you need to create that typeclass, but you can just use somebody else
    has already created.

    3. Create a typeclass instance that defines how, with the help of which functions,
    the type is going to satisfy the requirements of the typeclass.


    The freedom resulting from the separation of these three steps is one of the most
    important reasons for the power of typeclasses.


    Another reason is that the type inference mechanisms in the Haskell compiler can
    use typeclasses to infer, instead of actual types. For instance, here''s a simple
    add function in Haskell, and its inferred type information from the console:


    ```

    add x y = x + y

    ...

    Main> :type add

    add :: Num a => a -> a -> a

    Main>

    ```'
