  md: 'The type of the function has changed, from Func<int, int, int> to Func<int,
    Func<int, int>>. This reflects the new structure of the function, but is also
    one of those unfortunate situations where syntactic requirements of the C# language
    are inconvenient. The C# compiler refuses to use type inference for variables
    that store anonymous methods (using delegate syntax or lambda syntax), even though
    in the delegate case the types are readily available. Fortunately, the explicit
    type is only required with the declaration of a new function. In cases where functions
    are returned by other functions, the calling code can remain free of type declarations
    and the var keyword can be used.


    The representation of using the anonymous methods from C# 2.0 was chosen in these
    examples because it is much easier to see why the two parameters that have been
    passed in one by one are in fact available at the same time on the deepest nesting
    of the curved function. The technical answer to that question is, of course, closures.
    The inner function uses the parameter x that is a local variable in the outer
    function, the compiler creates a closure for that variable.


    The principles of curvy applying to functions in lambda syntax. The add function
    can be written as a lambda expression like this:


    ```

    Func<int, int, int> add = (x, y) => x + y;

    ```


    The curved add function looks like this:


    ```

    Func<int, Func<int, int>> curriedAdd = x => y => x + y;

    ```


    As you can see, the syntax is so more concise that it seems quite hard to believe
    these examples implement the exact code as the earlier anonymous methods. This
    can be visualized a little better by inserting parameters to make the nesting
    of functions more obvious in the lambda case:


    ```

    Func<int, Func<int, int>> curriedAdd = x => (y => x + y);

    ```


    The technique of curvy applying to functions with any number of parameters. Assuming
    a list with parameters:


    ```

    Func<...,...> f = (par1, par2, ..., parX) => ...;

    ```


    The curved format alone has this signature:


    ```

    Func<...,...> cf = par1 => par2 => ... parX => ...;

    ```


    The code in “body” of the lambda expression — that is, the expression to the right
    of the goes-to-operator — remains the same during the transformation.


    The shape of the type changes according to very similar rules. Consider this original
    generic delegate type:


    ```

    Func<int, bool, string, decimal, double>

    ```'
