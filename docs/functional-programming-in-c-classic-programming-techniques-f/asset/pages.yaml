    \ this away from the array type, all the other variables and constants are gone\
    \ — they aren’t needed anymore.\n\nYou could argue that this leaves you with a\
    \ class-level field for data storage, and would be correct. There are two reasons\
    \ that this is presented as an intermediate stage: first, it could be worked around\
    \ by making the data read-only, and the steps required to get come with their\
    \ own drawbacks. This introduces a very important concept in the world of hybrid\
    \ paradigm programming: compromising, and deciding when and where to compromise.\n\
    \nThere is more compromise in the rest of the stage 2 implementation. The new\
    \ implementation of the UpdateUI method is another example:\n\n```\nprivate void\
    \ UpdateUI() {\n    DisplayListBox.DataSource = GetFilteredList(GetFilterString());\n\
    }\n```\n\nData binding is now being used, by the DataSource property of the list\
    \ box element to the list of potentially filtered objects. This reduces the pressure\
    \ of pushing data into the UI for visualization to an atomic operation, from the\
    \ perspective of this approach. Of course the operation is not atomic and in a\
    \ fully parallel scenario you would have to deal with the expectation that UpdateUI\
    \ gets twice, or that the DataSource property is otherwise set to a different\
    \ value at the same time. It is also clear that the method is not pure, since\
    \ it performs a write access to data outside its own scope. But this is the sort\
    \ of compromise you need to be prepared for. After all, you are working on top\
    \ of the inherently object-oriented .NET Framework. You could, theoretically,\
    \ make a decision to ignore all APIs that are in the way of function purity, but\
    \ chances you’d be better off not working with .NET Framework at all in that.\n\
    \nThe same kind of compromise is in the method GetFilterString:\n\n```\nstring\
    \ GetFilterString() {\n    string Value = FilterTextBox.Text;\n    return String.IsNullOrEmpty(value)\
    \ ?\n    null : value;\n}\n```\n\nIf you were prepared to define function purity\
    \ as an absolute scale, and taking the cooperation with existing .NET/WinForms\
    \ APIs into account, you could say that these functions are as as they’re going\
