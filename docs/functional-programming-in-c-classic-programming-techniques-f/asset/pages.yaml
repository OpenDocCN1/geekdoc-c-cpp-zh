  md: "Parts of the code you should recognize — the first few lines perform the initialization\
    \ of the mathematical variables that were previously contained in the method CalculateImage.\
    \ After that, things change. There are only two function, calls to a static class\
    \ called Calculator. CalcArea receives some weight and height information as an\
    \ encapsulation of the mathematical values, and it delivers results. The return\
    \ type of CalcArea is Iumerable<PointResult>, in other words, a lazy enumeration\
    \ of result values. The second function, to CalcImage, takes those results and\
    \ converts them into an image representation, which is then made visible in the\
    \ UI.\n\nFor clarity, this implementation of the application doesn't have any\
    \ threaded UI update functionality or similar gimmicks. This shows how the new\
    \ Mandelbrot calculation API needs to be used. That API itself is contained in\
    \ the project FunctionalMandelbrot in the solution.\n\nThe file Calculator.cs\
    \ in that project has the implementation of those functions you saw being a moment\
    \ ago. It is Calculator.CalcArea:\n\n```\npublic static Iumerable<PointResult>\
    \ CalcArea(int width, int height,\nCalcInfo calcInfo) {\n    var points = PointSequence(width,\
    \ height);\n    return Functional.Map(p => CalcPoint(p), calcInfo);\n}\n```\n\n\
    Given width and height, as the CalcInfo math values, CalcArea generates a sequence\
    \ of points and then uses the Map function to call CalcPoint for each element\
    \ from the sequence, returning a sequence of results from that. Here is PointSequence:\n\
    \n```\npublic static Iumerable<Point> PointSequence(int width, int height) {\n\
    for (int y = 0; y < height; y++)\n    for (int x = 0; x < width; x++)\n      \
    \  yield return new Point(x, y);\n}\n```\n\nThis function uses loops to generate\
    \ a sequence of points representing all the pixels in the area defined by width\
    \ and height. There are several other implementation variants that come to mind\
    \ for this function, using the general Sequence function introduced in Chapter\
    \ 13, or replacing the loops with recursion.\n\nA decision has been made specifically\
    \ using Sequence in this case, because it is not optimal in C# in this scenario.\
    \ Sequence is used to calculate each value from the previous one. Here is its:\n\
    \n```\npublic static Iumerable<T> Sequence<T>(Func<T, bool> ended, T startVal,\n\
    Func<T, T> getNext = null) {\n    if (getNext == null)\n        yield break;\n\
    \    yield return startVal;\n    T val = startVal;\n    while (endReached == null\
    \ || !endReached(val)) (\n        val = getNext(val);\n        yield return val;\n\
    }\n```"
