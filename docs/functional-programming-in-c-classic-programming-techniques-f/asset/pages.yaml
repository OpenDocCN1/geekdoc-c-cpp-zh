    # Considerations on Memoization


    These are some general considerations and against memoization, as well as the
    details of its optimal implementation for any given scenario.


    # Data Types for the Cache


    The examples shown in this chapter all use the standard .NET Dictionary<K,V> type
    for the cache. This has been done mainly for simplicity. Dictionary has good lookup
    performance (although you might want to consider a hash-based data structure for
    even more efficiency), and fact it''s that a mutable data structure is also useful
    for the purpose. At the same time, it is not thread safe, which can be a major
    problem.


    The use of immutable data structures for caching is a possibility. It makes the
    cache thread-safe as long as it doesn''t have to be changed. When changes occur,
    immutable data structures change the perspective on the changes. That is, a data
    structure may not change internally, but a new view of it is constructed externally.
    It is easy to escape the handling of the caches so that locks can be applied effectively,
    but immutable structures enable lockless operation. These steps haven''t been
    made for the implementation of FCSlib.


    # Cache Expiry


    Another characteristic of the implementation in this chapter is that the caches
    aren''t flexible — they can only grow when new elements are added. It could be
    useful to implement an interface to the cache that allows you to remove elements,
    for two reasons:


    +   - Indefinite growth of caches over long periods of time can be prevented.


    +   - It becomes possible to use memoization with functions that are not pure.


    The first reason is quite obvious. Remembering every single result that a function
    calculates for the duration of an application run is not always the best strategy.
    Of course, a particular instance of a function doesn''t have to be memoized for
    the length of an application run, so scoping could be one approach to keep memory
    within bounds.


    The second reason should be handled with a lot of care because using memoization
    with non-pure functions cannot be recommended lightly. But there are cases where
    such an approach can be useful — for instance, when dealing with persistent data
    from databases, or data that being'
