    # WHAT''S IN THIS CHAPTER?


    +   - What''s in a typeclass

    - What''s in a monad

    - Two sample monads

    - Why LINQ doesn''t do it for monads


    Monads are a construct that is very interesting, mentioned frequently when people
    discuss functional programming, and forms the basis of many mechanisms found in
    functional languages. Haskell especially uses monads a lot, and has been said
    that whether that''s true or not, Haskell is a language that surfaces the monad
    as a first class construct, which makes it particularly simple to explain what
    they are. You will find some Haskells examples in this chapter, and even without
    knowing Haskell, these should be enough to follow.


    Monads are interesting once you understand their nature, you will find that many
    APIs you use today, even in C#, can be understood and represented as monads. Unfortunately,
    mainstream imperative languages like C# haven''t made the step to a formal definition
    of monad mechanisms. Current .NET and C# implementations of monadic patterns are
    typically loose, and the lack of a kind of syntax provided in Haskell, or even
    in F#, means that the code that utilizes monadic APIs remains quite verbose.


    Before getting started with the real explanations, my editors insist I try for
    a basic definition of monads. Here is my best try: A monad is description of a
    particular class of types that can be grouped by a commonality of their behavior,
    coupled with feature implementations related to the class. Across types belonging
    to the class, you can chain operations on instances of those types, with the monad
    providing a "side channel" for information not contained directly in the types.
    A formal declaration of Monad itself, as provided in Haskell (but unfortunately
    impossible in C#), allows for generalized handling of these already very abstract
    concepts.'
