    \ readonly Lazy(T value) {\n        this.value = value;\n    }\n\n    readonly\
    \ Func<T> function;\n    T value;\n    bool forced;\n    object forceLock = new\
    \ object();\n    Exception exception;\n\n    public T Force() {\n        lock(forceLock);\n\
    \        return UnsynchronizedForce();\n    }\n\n    public T UnsynchronizedForce()\
    \ {\n        if (exception != null) {\n            throw exception;\n        }\n\
    \        if (function != null && !forced) {\n            try {\n             \
    \   value = function();\n                forced = true;\n            }\n     \
