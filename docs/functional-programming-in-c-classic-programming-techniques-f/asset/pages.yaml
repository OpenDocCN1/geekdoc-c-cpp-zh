    # Queue


    Just like the list, the persistent queue data type is based on a clever, albeit
    quite simple, algorithm. It has two lists internally, "front" and "rear." Figure
    16-3 shows a few steps detailing how these two lists work together to add and
    remove queue items.


    +   1. You''ll understand the specific state of the queue with four elements better
    than you''ve looked through all the steps. Now for it is to say that the front
    list is the "start" of the queue (that, when you pop off items, this is where
    they come from) and the rear list is a continuation of the front list, but in
    reverse order. In other words, if you popped off all the values until the queue
    was empty, you''d get 1, 2, 3, 4, in that order.


    > Figure 16-3 leaves out the [] empty list from the front and rear lists, for
    simplicity.


    +   2. Element 5 has been added to the queue. This works by using Cons on the
    rear list; the operation is called Cons on the queue. (Yes, that''s the reverse
    of Cons. Yes, really.)


    +   3. Element 1 has been popped off the queue, that is, the Head element of the
    front list has been dropped.


    +   4. Another element has been dropped from the queue. You may have expected
    this to result in an empty front list, and that is exactly what happens during
    this operation. This special case is caught by the implementation logic of the
    queue, and the rear list is reversed and used as the new front list (the new rear
    list is empty).


    ![](img/0bf1584a2ce4017291813385353496b6_202_0.png)


    FIGURE 16-3: Persistent queue'
