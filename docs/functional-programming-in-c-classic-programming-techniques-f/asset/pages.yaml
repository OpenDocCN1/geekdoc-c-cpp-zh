    # RANGES


    Many cases for sequences are based on simple calculations, and the syntax required
    to use the Functional.Sequence function in these cases is still a bit more complicated
    than it has to be for simple things. The answer to this is the Range, which is
    a name for a type of sequence that has a start and an end and typically uses simple
    data types. These are not restrictions as such, since FSLib allows overriding
    these elements with custom ones, resulting in an alternative syntax for sequences
    — but the idea is that for common use cases, things are going to be easier through
    the use of a particular predefined range type.'
