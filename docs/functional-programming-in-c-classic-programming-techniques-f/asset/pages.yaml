  md: '# Lazy Evaluation


    WHAT''S IN THIS CHAPTER?


    +   - Strict and non-strict evaluation

    - Laziness through function passing

    - Lazy<T>

    - How lazy can you be?


    C# is a language that uses a strict evaluation strategy the most of the time.
    The topic of evaluation strategies is a complex one that applies to the techniques
    of passing parameters to functions, applying operators, the order in which expressions
    are evaluated, and several other related subjects.


    As far function calls go, strict evaluation means that parameters are evaluated
    before they are passed to functions. For instance, this function call uses an
    expression as a parameter:


    ```

    MyFunction(23 * 4);

    ```


    In C#, that an expression was used on the calling side is no longer visible from
    the inside of MyFunction. The code inside function can only see the value that
    that is the result of an evaluation of expression: 92.


    Strict evaluation is very common, even more so in what can be considered mainstream
    programming languages these days. But there is competition in the form of non-strict
    evaluation strategies, which many programming languages use as well. Non-strict
    evaluation is often called lazy evaluation because the essence of it is that expressions,
    or parts of expressions, are only evaluated when their results are actually needed.


    To see a case where C# uses non-strict evaluation, take a look at this Boolean
    expression:


    ```

    bool isTrue = (10 < 5) && (MyCheck());

    ```'
