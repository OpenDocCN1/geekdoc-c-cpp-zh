  md: "The resulting type after the application of currying is:\n\n```\nFunc<int,\
    \ Func<bool, Func<string, Func<decimal, double>>>>>\n```\n\n# # Automatic Currying\n\
    \nIt is quickly becoming clear that the process of currying follows hard rules,\
    \ and it is possible to automate it entirely. There are cases where the manual\
    \ application of currying has advantages — some will be described in later chapters\
    \ on parameter order and pre-computation — but most of the time it is a relief\
    \ to have a helper function that performs the process automatically.\n\nHere is\
    \ the function Curry, which takes another function as a parameter and returns\
    \ a curried format function:\n\n```\npublic static Func<T1, Func<T2, TR>> Curry<T1,\
    \ T2, TR>(this Func<T1, T2, TR> func (\n    return par1 => par2 => func(par1,\
    \ par2);\n)\n```\n\nYou will recognize the important details that have been discussed\
    \ previously:\n\n+   * The input parameter is of type Func<T1, T2, TR> and the\
    \ return type of the Curry function is Func<T1, Func<T2, TR>>\n\n+   * The shape\
    \ of the function that is returned follows the same schema as the lambda expressions\
    \ that have been curried manually.\n\nUsing the helper function Curry, a curried\
    \ format of a function can be retrieved with a simple call. This helper function\
    \ is part of FCSharp and lives in the class Functional, so all examples will call\
    \ it as Functional.Curry(...\n\nThe main detail to pay attention is the requirements\
    \ of C# type inference. Basically, the compiler needs to be able to infer the\
    \ parameter and return types of the function from at least one location. Of course,\
    \ it is possible to declare the type of the function explicitly and then can use\
    \ *var* with the Curry function:\n\n```\nFunc<int, int> add = (x, y) => x + y;\n\
    var curriedAdd = Functional.Curry(add);\n```\n\nIn this case, though Curry is\
    \ a generic function, it is not necessary to pass to the generic parameters explicitly.\
    \ The compiler infers the generic parameters because the parameter passed into\
    \ *Curry* is already typed. For inline use of lambda expressions it can also make\
    \ sense to pass the generic parameters explicitly:\n\n```\nvar curriedAdd = Functional.Curry<int,\
    \ int, int>((x, y) => x + y);\n```\n\nInterestingly, type inference can also infer\
    \ the generic parameters if the types of the lambda expression, or those of a\
    \ C# 2.0 anonymous method, are given explicitly. This is curious"
