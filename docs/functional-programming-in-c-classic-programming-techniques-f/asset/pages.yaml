    # Caching Techniques


    WHAT''S IN THIS CHAPTER?


    +   - Why remembering previous results is important in functional programming

    - Computing information before you need it

    - Caching data as you go

    - Considerations on memoization


    # THE NEED TO REMEMBER


    Computers are great at remembering things. In fact, if you look at typical business
    applications, you could easily get the impression that remembering things, not
    the subject of computing things, is the main purpose of computers these days.
    The data that computer programs work with more often stored in a database than
    it is actually created or computed during the run of those programs. The ubiquity
    of database systems is testimony to this fact.


    In functional programming, as has been said before, the focus is on applying functions
    as opposed to handling state, and arguably all persisted data is a kind of state.
    Out of course, handling persisted data is a reality of computer applications today,
    so functional programming has to find a way to deal with. The details of accessing
    data from databases are not the subject of this chapter, but there is a more general
    need to remember data in functional programming: that has been returned from calculations
    before, and therefore should not be calculated again.


    There are two main cases where you need to remember results of computations performed
    previously, and both of them are covered in this chapter. The first is precomputation,
    which is when you purposely compute values before the actual algorithm runs uses
    those values. The second is the situation in which you have functions that are
    called repeatedly, with the same set of arguments, and you want to optimize by
    storing and reusing the values that have been calculated.'
