- img_proc: true
  md: "Just like Map, Filter uses a special delegate type, in this case, Predicate<T>.\
    \ This type accepts a parameter of T and returns a bool. Again, the implementation\
    \ is lazy.\n\nBased on the list \"people\" shown in the previous section, Filter\
    \ can be used to find all those who are over 40:\n\n```\nvar over40 = Functional.Filter(p\
    \ => p.Age >= 40, people);\n```\n\n# Accumulating: Fold\n\nFold is really a family\
    \ of functions that covers a number of different use cases. The most important\
    \ ones are the left and the right fold. There are two differences between left\
    \ and right fold, and only one of them is relevant in the FCSlib implementation.\
    \ More on this bit later, after you've seen the simpler left fold.\n\n> In this\
    \ section, the term FType=\"note\"old will sometimes be used to mean \"family\
    \ of Fold functions.\"\n\nFold that leaves left is FoldL. It takes three parameters:\
    \ an accumulation function, a start value and a list. In contrast to the higher\
    \ order functions you have seen so far, it doesn't return a list as its result.\
    \ It returns just one value, which is where the name comes from: it folds the\
    \ list into one, using some kind of accumulation.\n\nTo accumulate the function\
    \ iterates over the elements and the accumulator with two values: the result from\
    \ the previous run and the current element from the list. On the first run there\
    \ is no previous result, so the start value is passed instead.\n\nHere is the\
    \ implementation from FCSlib:\n\n```\npublic static R Fold<T, R>(Func<R, T, R>\
    \ accumulator, R startVal,\n    IEnumerable<T> list) {\n    R result = startVal;\n\
    \    foreach (T sourceVal in list) {\n        result = accumulator(result, sourceVal);\n\
    \    }\n    return result;\n}\n```\n\nA simple call to sum up some values might\
    \ like this:\n\n```\nvar sumOf1To10 = Functional.Fold((r, v) => r + v, 0,\nEnumerable.Range(1,\
    \ 10));\n```\n\nThe expression (r, v) => r + v is the accumulator in this example.\
    \ It takes the previous (r) and the next value (v) and returns the result of adding\
    \ the two. The second parameter 0 is the start value, which must be zero, of course,\
    \ to calculate a sum."
