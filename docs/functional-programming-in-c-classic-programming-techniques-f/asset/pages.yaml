    ```\n\nThe technique of partial application has created a new function out of\
    \ an existing one. In general, partial application takes a function that is generic\
    \ in nature and creates a new function with a more specific purpose. In the example,\
    \ the function add is generic in that it can take any two integer values and add\
    \ them. Every time the function is called, a combination of integer values is\
