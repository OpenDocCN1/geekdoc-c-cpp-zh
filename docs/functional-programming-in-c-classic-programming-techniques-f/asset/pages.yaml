    \ query)\n// Unrelated to this demo, but important: in the real world, make sure\n\
    // 'query' has been checked to be safe!\nvar request = WebRequest.Create(\"http://www.google.com/search?q=\"\
    \ + query);\nrequest.BeginEndResponse(\n  (IAsyncResult ar) => {\n    var response\
    \ = request.EndResponse(ar);\n    FeedBackToClient(clientId, response.GetResponse());\n\
    \    response.Close();\n  },\n  null);\n```\n\nQueryVersion2 implements functionalities\
    \ as the combination of QueryVersion1 and QueryCallback described previously.\
    \ Instead of the separate callback Callback, a lambda expression is passed to\
    \ BeginEndResponse. The code accesses information from the outer scope directly:\
    \ the request and clientId variables. These values are stored in a closure, so\
    \ they stay available until the callback is executed. It is easy to forget that\
    \ the pattern is still the same and that the lambda is executed later than function\
