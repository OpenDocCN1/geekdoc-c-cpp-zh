    \ you must download the correct type to retrieve the information. Having to create\
    \ a new class time is a lot of work in the long run, and the decoupling can be\
    \ confusing if you have many applications of the async pattern in your code.\n\
    \nWith the help of choices, there is an alternative solution. Look at the following\
