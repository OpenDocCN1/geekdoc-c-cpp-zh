  md: "There are separate delegates being used to calculate the next value and find\
    \ out whether any particular value represents the end of the sequence. For comparison,\
    \ here is an implementation of the PointSequence function based on Sequence:\n\
    \n```\npublic static IEnumerable<Point> PointSequenceUsingSequenceFunction(int\
    \ width,\nint height) {\n    return Point.Sequence<Point>((\n        p =\n   \
    \         p.X < width - 1 ?\n                new Point(p.X + 1, p.Y) :=\n    \
    \        p.Y < height - 1 ?\n                new Point(0, p.Y + 1) :=\n      \
    \          Point.Empty,\n        new Point(0, 0),\n        p => p.X == width &&\
    \ p.Y == height - 1);\n    })\n```\n\nThis could be written more verbose by replacing\
    \ the ternary expansions with ifs and then, necessarily, the expression body lambda\
    \ recursion with a statement implementation. The fact remains that this algorithm\
    \ for sequence generation is represented more elegantly with the help of the imperative\
    \ loop construct.\n\nHere is also a theoretical implementation of PointSequence\
    \ using recursion:\n\n```\npublic static IEnumerable<Point> TheoreticalPointSequenceWithRecursion(int\
    \ width,\nint height, int x, int y) {\n    if (x < width && y < height)\n    \
    \    yield new Point(x, y);\n    if (x < width - 1)\n        return TheoreticalPointSequenceWithRecursion(width,\
    \ height, x + 1, y);\n    else if (x < height - 1)\n        return TheoreticalPointSequenceWithRecursion(width,\
    \ height, 0, y + 1);\n}\n```\n\nThis implementation is for comparison purposes.\
    \ It doesn't work, and there are two reasons why. The obvious one is the potential\
    \ length of the sequence being generated, coupled with a lack of tail call optimization\
    \ support in C#. The sequence can easily be hundreds of items, which is more than\
    \ what can be handled gracefully without tail recursion.\n\nThe second reason\
    \ is that this function isn't even valid in C# because it uses yield return and\
    \ return in the same function. The C# compiler doesn't accept this. As a result,\
    \ each of the two return lines would have to be replaced with a foreach loop that\
    \ gets the result from the recursive call, iterates over it, and yields each single\
    \ value.\n\n```\nforeach (var p in TheoreticalPointSequenceWithRecursion(width,\
    \ height, x + 1, y))\n    yield p;\n```\n\n> Sequence is covered in Chapter 13,\
    \ Map in Chapter 12, and iterators and yield in Chapter 5."
