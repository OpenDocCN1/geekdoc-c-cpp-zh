  md: '# 4


    # Flexible Typing with Generics


    WHAT''S IN THIS CHAPTER?


    +   - Generic functions, classes, and other elements

    - Constraints

    - Covariance and contravariance


    The .NET type system has a feature called generics. With the help of this feature,
    certain pieces of type information can be extended by type parameters. In .NET,
    classes, methods, interfaces, and delegates can de-fer the problem because be
    generic.


    One of the common examples of the use of generics is a container class, like a
    list. In an object oriented language (perhaps you create a ListElement for the
    purpose) or use a base class that is so general that it allows users of the List
    to add elements of arbitrary types (in .NET, System.Object comes to mind). Both
    of these approaches have disadvantages. Using the all-purpose base class allows
    the addition of potentially incompatible elements to the list, and the actual
    type must be encapsulated in the end.


    Generics provide a solution to this. The List class is created to have a type
    parameter, and when instances are created, the type parameter is resolved so that
    any actual instance of the List works with a particular type (and those derived
    from it).


    Generally, a generic type G is written to work with one or more other types —
    O1, O2, and so on — but the idea is that the implementation of G actually need
