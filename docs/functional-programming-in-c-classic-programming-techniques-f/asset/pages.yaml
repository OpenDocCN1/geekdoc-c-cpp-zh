  md: 'you''re perhaps considering the use of this approach to immutable data! When
    thinking about parallelization, for there is overhead involved when it comes to
    sharing data between execution contexts. The cloning does here its overhead when
    data manipulation tasks are being performed, whereas algorithms that share data
    and employ locks their overhead at a different point.


    # A LOOK AT LOCKING


    Locking is a mechanism used in multi-threaded code, which protects certain sections
    of code from being executed concurrently, or at least restricts how exactly concurrent
    execution can occur.


    It has been implied several times in this chapter that locking is not a good approach
    to the data sharing problem. There are three main considerations behind this statement:


    +   * Locking has a cost.

    * Locking prevents parallelization.

    * Locking is very hard to get right.


    The cost of locking is a certain management overhead of the locked sections of
    code — in other words, an algorithm that needs to lock data before it can do its
    work will take a bit longer to acquire right away. This seems irrelevant, but
    if it can accumulate to a considerable overhead if locking is quite fine-grained
    (when you have a lot of short sections of code that each have their own locking,
    for instance). You do want to be fine-grained because the basic idea of locking
    is to restrict the degree of parallelization that can happen in a certain section
    of you, and having coarse-grained locking that make large parts of your code can
    never be executed in parallel. That''s what is meant by the statement “locking
    prevents parallelization,”


    Of course there are locks that simply prevent parallelization outright. There
    are different types of locks, some allow several readers but just one writer of
    a piece of information, for example. There are also other methods of coordinating
    such as semaphores, mailboxes, and so on, depending on the APIs you''re using.
    That''s why you have to get locking right: you have to be aware of all the options
    and structure your code and its algorithms accordingly. The types of locks and
    other structures you depend on the code you''re writing and what it does, maintenance
    is as important as well as difficult. Things can go wrong, and special books about
    parallelization have chapters about deadlocks, lock chains, and other simpler
    special cases. You need to be specific and fine-grained in your efforts, but the
    result will come at a cost and probably still be coarser than you would like,
    restricting parallelization to a non-optimal degree.


    The idea of trying to work without locks is an interesting one from this point
    of view. Using immutable data is just one part of a possible solution.'
