  md: "# # 8\n\n# # Currying and Partial Application\n\n+   \n* Decoupling Parameters\n\
    * Manual and Automatic Currying\n* Applying Currying in Object Oriented Programming\n\
    * Functional Modularization through Partial Application\n\nAt its core, functional\
    \ programming is all about the application of functions and their use as building\
    \ blocks of algorithms. Haskell Curry whose name is the origin of the term currying\
    \ (as well as the functional language Haskell). invented the concept of currying\
    \ at roughly the same time as Moses Schönfinkel and Gottlob Frege. Currying makes\
    \ it possible to view all functions as members of the class of functions that\
    \ take only one parameter, regardless of the number of arguments needed to perform\
    \ the actual calculation. It enables partial application, which is one of two\
    \ techniques (the other being composition) that makes functional modularization\
    \ possible.\n\nIn publications, the term currying is used to cover the technique\
    \ of partial application as well as currying itself. Because C# is a language\
    \ in which the curried form of a function is not the native approach, many seek\
    \ to keep these separate and distinct.\n\n# ## DECOUPLING PARAMETERS\n\nFunction\
    \ or method calls can accept parameters — that is true in almost all programming\
    \ languages. The underlying mechanisms to transfer the parameters and to make\
    \ them available to the code executed in the function or method vary, and so does\
    \ the terminology used to describe this process."
