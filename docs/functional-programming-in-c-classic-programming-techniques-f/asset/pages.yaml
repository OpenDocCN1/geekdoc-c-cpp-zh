  md: 'The class has a number of private fields and two methods, both of which are
    meant to use at least some of the fields to do their job. Both the methods are
    written to not take any parameters, which is possible because the methods have
    access to the data directly, members of the class.


    Someone usually asks, "Shouldn''t we pass in the values, which are needed in a
    particular function, as parameters? That would enable us, for instance, to calling
    this function from multiple threads.


    If you think about it, you will find that there are really two possible answers.
    Answer is one that you don''t care about any potential multithreading, which means
    you are accessing the fields in the class directly. Of course the syntax is less
    verbose you don''t have to enumerate all the field names in each method signature.


    Answer two is multithreading is, or may become in the future, important to you.
    In that case, you should allow pass all the values needed by a particular function
    as parameters so that no execution of the function is self-contained. You might
    come very close to making the function pure by performing this step.


    There are other similar considerations. For instance, maintainability can be improved
    by listing the parameters explicitly because it is obvious at a glance which are
    needed by a particular function.


    Here''s an important point, though. It can make sense to vary this decision for
    different functions. For example, in this piece of code there''s a function that
    uses only two of the field values, and a second one that is described as using
    lots of them. The decision to introduce parameters for the two-value function
    is perhaps easier than the other one, and if so the the idea of multithreading
    makes more sense when the two-value function does, it might seem sensible to be
    flexible.


    A certain way to create confusion is to go half way. You might be surprised, but
    it happens all the time: a few arbitrary selection, are passed in parameters,
    while some others are simply accessed directly. Of course there is a reason behind
    this. For instance, a public method that needs some values from the class it gets
    in additional information supplied from the outside. That is understandable, but
    it''s still a useful recommendation to use stricter guidelines than.


    Some may argue that the idea of always passing around all parameters you''re not
    exploiting the fields of object orientation as much as you could. That may be
    true in fact, but perhaps it is because object orientation doesn''t give much
    consideration to issues of parallel execution the handling of parameters, variables,
    fields, and versus instance methods, but it should be an important part of your
    considerations. You may find that sometimes you don''t have to keep it in mind
    at all, but you should always make decision consciously.


    Finally, a guideline to recommend: when you have written a method that does not
    require access to any field in the class it, make it static! That''s like putting
    a label on the function to say, "I intend that this function shall not access
    fields in the class." The typical argument against this is that you might change
    your mind about it — there''s nothing wrong with that, but at least you''re going
    to give some conscious thought to once you''ve made the method static.'
