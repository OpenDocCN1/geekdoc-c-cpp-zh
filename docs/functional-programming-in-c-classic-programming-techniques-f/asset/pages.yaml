    # COMBINING APPROACHES


    In functional programming, the two function construction approaches — composition
    and

    partial application — are commonly used to create new functions on the basis of
    existing ones. This

    is not the only approach; there''s always the alternative of defining a new function
    that calls

    one or more existing functions. Look at this example:


    ```

    Func<int, Func<int, int>> add = x => y => x + y;

    ```


    ```

    var add5PA = add(5);

    Func<int, int> add5 = x => add(5)(x);

    ```


    Both the add5PA and the add5 functions make use of the existing add function,
    and define a new

    function that will add 5 to its one remaining argument. This is a choice that''s
    always available when

    it comes to function reuse, and there''s no general guideline as to when you should
    go for one or

    tother approach.


    The main difference is that using function construction techniques, you typically
    create

    a number of intermediate functions that perform part of the task. When functions
    are

    constructed for the purpose of reuse within a single function, this might be irrelevant,
    when

    they are created as parts of a larger functional framework, the intermediate functions
    might be

    usable in their own right. This is an advantage over the complete definition approach
    because

    there is no redundancy in the declarations.


    The following paragraphs describe a case for function construction that has been
    chosen

    purposefully because it is more complex than what you''d like to do in C#. It
    covers

    a number of intersecting scenarios, though, and an understanding of the techniques
    in this

    deepth is valuable when it comes to understanding code written in functional programming.


    The task is quite simple. A function will be constructed that takes two parameters,
    a sequence of

    Customer objects an int value will extract from each Customer object a field called

    SalesVolume. The resulting sequence is to be sorted in descending order, and cut
    off after the first

    n elements. An average value calculated over the remaining values is to be the
    result of the function.


    To begin, here is an iterator that returns the type of Customers that''s going
    to be used

    in the example:


