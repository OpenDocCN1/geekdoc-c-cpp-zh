- img_proc: true
  md: "As a result, each point is handled as a separate Task object in the Parallel\
    \ Extensions, which makes for extremely granular parallelization.\n\nIn both cases\
    \ of Refactoring, functional ideas and in some cases techniques were used to change\
    \ structural aspects of the algorithm to point where the functionality delivered\
    \ by the Parallel Extensions can be deployed through simple change. Don't forget\
    \ that this is an example! There are plenty of other reasons why the refactoring\
    \ is overall better than the original: Whether you parallelize or not, you will\
    \ benefit from greater stability and maintainability, easier application of tests,\
    \ easier debugging, and probably other consequences, if you apply similar refactoring\
    \ steps to your own code.\n\n# WRITING NEW CODE\n\nWhen writing new code, you\
    \ have the opportunity to make structural decisions up front, and you can define\
    \ the discipline you would like to use for certain cases. Here are several ideas\
    \ for guidelines you may find useful. The rest of this section will discuss these\
    \ choices in some more depth.\n\n+   * Keep methods static if possible,\n* Prefer\
    \ anonymous functions over named ones.\n* Prefer higher order functions over manual\
    \ algorithm implementation.\n* Prefer immutable data.\n* Watch behavior implementation\
    \ in classes.\n\n# Use Static Methods\n\nStatic methods are one of the basic ideas\
    \ worth considering as a general guideline. It is supported by many object programmers,\
    \ and from a functional point of view, functions can be made static most of the\
    \ time. Any pure function can be made static.\n\nIn object oriented programming,\
    \ a commonly discussed question is how to handle parameters when the values received\
    \ by the method are ones that are already available in the class. This rough outline\
    \ of a class:\n\n```\npublic class DataThing {\n    private int field1;\n    private\
