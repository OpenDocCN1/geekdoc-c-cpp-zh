  md: '# REFERENTIAL TRANSPARENCY


    In imperative programming, writing a computer program means to define a sequence
    of steps that need to be taken to achieve a goal. In that sequence, states are
    defined together with state transitions — how to get from A to B, what A and B
    are precisely, and when getting from A to B is an option. That''s what people
    mean imperative programming is all about state.


    Theoretically, a sequential program could be written by line, the execution running
    from top to bottom and ending there. In reality, of course, on the CPU level there
    are tools to make programming a bit more efficient, and programming languages
    have functions and methods and other blocks that can be used to add levels of
    abstraction. The basic function of such blocks in imperative programming is to
    reduce duplicate code and break code into functional blocks that are easy to manage.
    One of the major issues in imperative programming has always been that code blocks
    grow larger over time, and this is still apparent in many code bases.


    Because of the focus on execution sequence, functions and methods in imperative
    programming tend to be relatively opaque. Even if they are called with the same
    (no) input parameters, they are not guaranteed to return the same result every
    time. Implementations of functions often use variables in a larger scope (class
    fields for instance), which is referred to as global state. Just like the code
    in the earlier hypothetical example of the endless sequence of single lines, the
    extracted functions and methods are meant to be used in a particular order, so
    that the state outside of them is compatible with their algorithms.


    Referential transparency is the opposite of this. The term can be applied to any
    expression, and it means that can be replaced with its value without changing
    the program, that, without changing the results rendered by the algorithm in which
    the hypothetical replacement happens.


    In mathematics, expressions are always referentially transparent, so it is easy
    to find examples there. For instance, the expression "3 + 2" can be replaced by
    "5" in any mathematical context, without changing anything about the number. Unfortunately
    these aren''t quite simple in computer programming.


    Some expressions or functions can never be referentially transparent because it
    is purpose to return values that change, or to return a different value every
    time . Examples of this would be DateTime.Now, File.ReadByte() or Console.Read().
    In C#, functions that have a return type of void cannot be used as an expression,
    so they are referentially opaque as well.


    One of the most important concepts in functional programming is the avoidance
    of side effects in the implementation of functions. This topic is very close to
    that of referential transparency. A pure function is one that does not have any
    side effects, but that calculates a return value from a set of parameters. The
    function can call other functions as part of its algorithm, and it can access
    values from its own scope, provided these are referentially transparent and never
    change. Imagine an algorithm that uses Math.PI —that’s a constant value being


    The general description of pure functions and side effects leaves out the perspective
    of the call site, from which a pure function can also be defined by saying that
    a call into a pure function is expected'
