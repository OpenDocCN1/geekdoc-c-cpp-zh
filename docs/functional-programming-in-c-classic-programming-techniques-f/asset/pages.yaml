  md: '# # 1

    A Look at Functional Programming History


    # ### WHAT''S IN THIS CHAPTER?


    +   - An explanation functional programming

    - A look at some functional languages

    - The relationship to object oriented programming


    Functional programming has been around for a very long time. Many regard the advent
    of the language LISP, in 1958, as the starting point of functional programming.
    On the other hand, LISP was based on existing concepts, perhaps most importantly
    those defined by Alonzo Church in his lambda calculus during the 1930s and 1940s.
    That sounds highly mathematical, and it was — the ideas of mathematics were easy
    to model in LISP, which made it the obvious choice of content in the academic
    sector. LISP introduced many other concepts that are still important to programming
    languages today.


    # ### WHAT IS FUNCTIONAL PROGRAMMING?


    In spite of the couple to LISP in its early days, functional programming is generally
    regarded as a paradigm of programming that can be applied in many languages —
    even those that were not originally to be used with that paradigm. Like the name
    implies, it focuses on the application of functions. Functional programmers use
    functions as building blocks to create new functions — that''s not to say that
    there are no other language elements available to them, but the function is the
    main construct that architecture is built from.


    Referential transparency is an important idea in the realm of functional programming.
    A function that is functionally transparent returns values that depend only on
    the input parameters that are passed. This is in contrast to the basic ideas of
    imperative programming,'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CHAPTER 1 A LOOK AT FUNCTIONAL PROGRAMMING HISTORY


    when program state influences return values of functions. Both functional and
    imperative programming using the term function, the mathematical meaning of the
    referentially transparent function is the one used in functional programming.
    Such functions are also referred to as pure functions, and are described as having
    no side effects.


    It''s impossible to define whether a given programming language is a functional
    language or not. On the other hand, it is possible to find the extent to which
    a language supports approaches commonly used in the functional paradigm — recursion,
    in the sense that programmers can call into a particular function, procedure,
    or method from their own code. But if the compilers and runtime environments associated
    with the language stack-based tracking of addresses on jumps like many imperative
    languages do, and there are no optimizations generally available to help prevent
    stack overflow, then recursion may be severely restricted in their applications.
    In imperative languages, there are also specialized syntaxes to implement loops,
    and more advanced support for recursion is ignored by the language or compiler
    designers.


    Higher order functions are also important in functional programming. Higher order
    functions are those that take functions as parameters or return other functions
    as results. Many programming languages have some support for this capability.
    C has a syntax to define a type of function or, in C, to refer to the function
    through a function pointer. Obviously this enables C to pass around such function
    pointers or to return them from others. Many libraries contain functions, as those
    for searching and sorting, that are implemented as higher order functions, taking
    the essential data-specific comparison functions as parameters. Then again, C
    doesn''t have any support for anonymous functions — that is, functions created-on-the-fly,
    like lambda expressions, or for related concepts such as closures.


    For some programmers, functional programming is a natural way of telling the computer
    what it should do, by describing the properties of a given problem in a concise
    language. You might have heard the saying that functional programming is more
    about telling what the problem they should be solving, and not so much about specifying
    the steps of the solution. This saying is a result of the high level of abstraction
    that functional programming provides. Referential transparency means that the
    only responsibility of the programmer is the specification of functions to describe
    and solve a given set of problems. On the basis of that specification, the computer
    can then decide on the best evaluation order, potential parallelization opportunities,
    or whether a function needs to be evaluated at all.


    For some programmers, functional programming is not the starting point. They come
    from a procedural, imperative, or perhaps object oriented background. There''s
    much anecdotal evidence of such programmers analyzing their day-to-day problems,
    both the ones they meant to solve by writing programs, and the encounter while
    writing programs, and gravitating toward the functional realm they encounter themselves.
    The ideas of functional programming often provide very natural solutions, and
    the fact that you can arrive there from different directions reinforces their
    point.


    ![](img/0bf1584a2ce4017291813385353496b6_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Functional Languages\n\nFunctional programming is not language specific.\
    \ However, certain languages have been around in that space for a long time, influencing\
    \ the evolution of functional programming approaches just as much as they were\
