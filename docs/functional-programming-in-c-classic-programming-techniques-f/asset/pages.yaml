    \ be performed, and an eventual return can be interpreted as a direct jump back\
    \ to the origin initiation point of the entire call sequence. Optimization takes\
    \ a lot off the overhead of function calls and eliminates the issue of stack overflows\
    \ when call sequences are long.\n\nThe situation regarding tail call optimization\
    \ on the .NET platform and in C# language is a bit of confusing. The CLR (Common\
    \ Language Runtime) supports tail call optimization through a second instruction\
    \ in IL. The C# compiler doesn't generate that instruction, although the F# compiler\
    \ does, for example. The execution infrastructure of the .NET environment offers\
    \ a second point where this optimization can be performed, where a JIT compiler\
