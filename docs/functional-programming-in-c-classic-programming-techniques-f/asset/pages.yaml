    circumstances, where minor side effects can exist that don''t influence referential
    transparency — think of debug output, for example.


    To write pure functions, use only your input parameters and return a value at
    the end. Access things outside your scope, structure your code so that you avoid
    calling other functions in order to do so. Access actual data elements, make sure
    they are constant. Everything you do that doesn''t fit this description is a side
    effect, which you generally won''t


    Some programming languages simply make side effects impossible through their syntax
    and semantics. If you give the matter thought, you will find that it is impossible
    to ever get anything useful done without side effects. Display something on screen?
    Save or load a file? These are side effects affecting the preceding definition.
    Obviously computer programs wouldn''t be powerful if programmers didn''t have
    a way to do these things.


    As a result, there''s one more important goal than the one of avoiding side effects:
    managing side effects. Depending on the language you use, this can be easy or
    hard. Pure functional languages that enforce the use of pure functions most of
    the time have a way of breaking out of that world temporarily, in places in code,
    to invoke the side effects program. In Haskell, for example, mon allows you to
    do this. There are other ways in languages, but that''s not important — unfortunately,
    C# doesn''t have any special support in the language, which makes the avoidance
    of side effects a discipline and the management of an architectural and structural
    task.


    A final word would be said about the reasoning behind the targets of pure functions,
    avoiding and managing side effects, and referential transparency. One of the consequences
    of writing code this way is that the evaluation order of expressions, as well
    as the order of functions, doesn''t really matter. The program defines how functions
    form a network of dependencies — function A performs a calculation and calls function
    B in the process, so the result of A depends on B — can be left to the compiler
    and/or the runtime to determine the optimal evaluation order. This makes optimizations
    possible, duplicate expressions be extracted automatically, caches applied, logical
    paths executed. The list of possibilities is endless, and many pure functional
    environments automate a number of these. Enough theory — chapters later in this
    book show what extent these can be used in C# and what the benefits are.


