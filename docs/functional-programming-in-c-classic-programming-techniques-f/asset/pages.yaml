  md: "The following piece of code decodes the fluent calls in the last example test\
    \ into several steps:\n\n```\n[Test]\npublic void GetData1() {\n    var step1\
    \ = new ConstraintExpression();\n    var step2 = step1.Append(new PropOperator(\"\
    Count\"));\n    var step3 = step2.Append(new GreaterThanConstraint(0));\n\n  \
    \  var step4 = step3.And;\n    var step5 = step4.Append(new SomeOperator())\\\
    n    var step6 = step5.Append(new PredicateConstraint<string>(v => v.StartsWith(\"\
    0\")));\n\n    Assert.That(DataSource.GetData(...).ToList(), step6);\n}\n```\n\
    \nThe resulting structure should immediately remind you of something: the code\
    \ that immutable collection data structures, like those discussed in Chapter 16.\
    \ A chain is built of constraints (these are the building blocks of the fluent)\
    \ and the Append function returns a new instance. Well, that's what it looks like!\n\
    \nIn reality, things are a bit different than you think. The odd-looking step4\
    \ gives it away a bit because it makes clear that this is not a simple hierarchical\
    \ tree of condition exceptions as you might have thought. Instead, a class ConstraintBuilder\
    \ is used under the covers, and through some redirection of the chained Append\
    \ calls adds an element to one ConstraintBuilder instance. In most cases Append\
    \ only returns the same constraint that was passed in. In case of step4, the And\
    \ property accesses the ConstraintBuilder instance directly in order to deal with\
    \ the operator.\n\nIn spite of the non-functional deals that were made in places,\
    \ the API remains widely functionally pure. The vast majority of utilities that\
    \ make the API only return a single return statement each execution. NUnit is\
    \ not a product that is going to require parallel execution (on this level), but\
    \ the source of code is recommended if you would like to see functional purity\
    \ is achieved naturally through clear architecture — or the other way, how ever\
    \ architecture leads directly to functional purity.\n\nIt is interesting to note\
    \ that some of the functions of the NUnit API return the object they were passed\
    \ — it might be modified, but it is still the same object. For instance, if you\
    \ check the sequence from the preceding example carefully, you will find that\
    \ the step5 variable refers to the same object as step4. A function that works\
    \ this way can't be considered functional pure (and if there were exceptions to\
    \ the term in NUnit, it provides an opportunity to point out that the call interface\
    \ of function doesn't allow conclusions about its inner working in the C# environment,\
    \ where objects are mutable.\n\n# SUMMARY\n\nMany real-world projects utilize\
    \ functional approaches today. This chapter has shed light on a few interesting\
    \ ones, but the list is by no means exhaustive and expanding all that. The ideas\
    \ demonstrated in this book show that while C# is not a language with a primary\
    \ focus on functional programming, it can still be used productively with the\
    \ paradigm in mind. You've got the toolset — go out explore!"
