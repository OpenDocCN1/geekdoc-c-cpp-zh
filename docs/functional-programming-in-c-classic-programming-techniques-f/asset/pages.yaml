  md: '# IS FUNCTIONAL PROGRAMMING IN C# A GOOD IDEA?


    When all you have a hammer, everything looks like a nail. Should programming languages
    be seen as general problem solving devices that can be applied to any problem
    and, as a consequence, to any solution strategy? Or should they be viewed as tools
    that are good for particular tasks, less or even useless for others? Practical
    understanding of different programming languages, the driving factors that define
    their priorities, and the consequences of the design decisions seems to point
    out clearly the "tool" understanding of programming languages. Functional programming
    is a good example to document this statement. Let''s face it: if you want to write
    some purely functional code, you will have a much easier time doing it with the
    help of a purely functional language — that is, one has been created with the
    precise techniques in mind that you are going to employ. No surprise there, really,


    In reality, it''s all about finding the compromise. It is certainly a goal to
    strive for understanding the specialities of different languages and to be able
    to make informed decisions about their applicability to a particular problem situation.
    In most real-world projects, there are limits to the number of choices you can
    reasonably make. Other programmers involved may not be familiar with the same
    subset of tools that you know. Pays in the long term have some consistency across
    projects, because keeps down maintenance effort. It also makes it easier to hire
    new people to support existing code bases. At the same time, programmers who restrict
    themselves to just one language often miss important opportunities elsewhere.
    And they will never be seen by their bosses or clients as the final point of reference
    in what should be their area of expertise.


    Knowing the pros and cons of using particular tools and approaches is important.
    You can have any number of reasons for a decision to make a move or to stay where
    you are, but if you find that a choice is right in front of you and you''re not
    thinking about a decision, you are missing out.


    # SUMMARY


    Picking up functional programming while staying with C# as a language is a strategy
    that should be based on practical considerations. This book is not telling you
    that C# can do everything just as easily as LISP, Haskell, or even F# on the same
    .NET platform. It says, Yes, you can do most things, but they are more syntactically
    complex, and perhaps more difficult to understand as a consequence. This book
    shows you how it works, what you can and cannot do, and where the limits are.


    If you are a C# programmer and have reasons why the adoption of a different or
    an additional programming language is not an option for yourself or your team,
    this book is for you. If you want to learn about functional programming on the
    basis of a language you''re already familiar with, this book is for you. And if
    you know functional programming and you''re wondering how you can go about explaining
    it to your imperative programmer friends, this book is also for you.


    Does it make sense to program functionally in C#? Yes, for all sorts of reasons,
    this. Read on.'
