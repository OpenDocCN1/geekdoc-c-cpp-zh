  md: '# CHAPTER 2 PUTTING FUNCTIONAL PROGRAMMING INTO A CONTEXT


    parallelization is no longer a mere luxury, but rather a requirement if they don''t
    want to see their codebase, their architecture, and their algorithms left behind
    gradually.


    One area of the parallelism problem is increasingly being covered by standard
    tools of the platform, and that technical side of dealing with parallelism. For
    a long time, programmers had to work with the underlying structures of the Windows
    operating system itself: processes and threads. This was true even for the managed
    .NET environment. In 2010, Microsoft released a new library called the Parallel
    Extensions to the .NET Framework, formerly identified as Parallel FX or PFX. This
    library, with .NET 4.0, revolutionizes the side of concurrency programming for
    the .NET programmer, performing tasks instead of threads, which are coordinated
    intelligently by the framework. It also allows for some advanced interaction between
    these units until certain problems are now much easier to solve — no need to write
    your own scheduler to control the number of parallel execution units, complex
    structures to retrieve results from background processes, and so.


    Unfortunately there''s still a structural problem because an application that
    has been written in a normal imperative style, the sharing and changing of state
    information, is often not to parallelize due to the data exchange/shared access
    challenges. Imperative and objective programming make it hard to store data in
    places where it can be accessed (for reads as well as writes) by more than a single
    method or function. While the Parallel Extensions libraries provide utility functions
    to replace standard single-threaded ones, the firstly are not easy to use in reality
    because the rest of the code has not been written with parallelization in mind.
    For instance, there is a Parallel.ForEach statement that parallelizes its execution
    — but this will only work if the code in the loop has been structured so that
    there are no data access collisions.


    # MANAGING SIDE EFFECTS


    In spite of the help provided by libraries such as Parallel Extensions, you still
    need to do a lot of potentially complex work on your codebase to parallelize it.
    In functional programming, the kind of data access where multiple methods or functions
    in a program have shared access to the same data — most importantly write access
    to data — is called a side effect. One of the main ideas of functional programming
    is to manage such side effects. This may make you to prevent them, and it is certainly
    a target to reduce these side effects to begin with, because that makes the remaining
    ones easier to manage. It is an illusion, however, that a computer program can
    do anything without having side effects in the technical sense — whatever is seen
    on screen, data is stored in a file or a database, or something is sent over a
    network, that is, on some level, a side effect.


    The imperative requirement to solve the problem of shared data access is typically
    to impose restrictions, with the technical term being synchronization. This is
    often summarized as mutual exclusion, which describes the very well: while one
    execution thread accesses a particular piece of information to make a change,
    others can''t do so at the same time. It is a simple and efficient concept, but
    quite hard to get right. As there are as many pieces of information, as are, it
    becomes difficult to keep track of all the possible interaction scenarios, resulting
    in all sorts of locking issues.'
