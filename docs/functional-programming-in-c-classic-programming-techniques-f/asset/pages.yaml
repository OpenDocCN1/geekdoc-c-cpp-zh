  md: "These scenarios are what the IEnumerator support of the C# iterator feature\
    \ is. Here's an implementation of an alternative EndlessList class, based on iterator\
    \ support:\n\n```\npublic class EndlessListWithIterators : IEnumerable<int> {\n\
    \    IEnumerator<int> IEnumerable<int>.GetEnumerator() {\n        int val = 0;\n\
    \        while (true)\n            yield return val++;\n    }\n\n    IEnumerator\
    \ GetEnumerator() {\n        return ((IEnumerable<int>)this).GetEnumerator();\n\
    \    }\\}\n```\n\nThis class only implements the \"outer\"IEnumerable<T> interface,\
    \ and leaves the compiler to do. By supporting both sets of interfaces with the\
    \ iterator mechanisms, the compiler makes it easy to create both convenient iterator\
    \ functions and full class implementations.\n\n# CHAINING ITERATORS\n\nIterators\
    \ in the form of functions can be used in chains very easily, creating complex\
    \ processing pipelines of them. This concept is used a lot in LINQ and also in\
    \ many of the examples later in this book, and is one key deal of functional programming.\
    \ Following are a few examples of the basic idea.\n\nYou've seen the iterator\
    \ EndlessListFunction, which returns an endless sequence of integer values. An\
    \ iterator function that does something to the sequence it can be used with. For\
    \ example, following is an implementation of Take. This function takes a sequence\
    \ of integers as parameter with a count, and only returns the first few elements\
    \ from the source\n\n```\npublic static IEnumerable<int> Take(int count, IEnumerable<int>\
    \ source) {\n    int used = 0;\n    foreach (var item in source) {\n        if\
    \ (count > used++)\n            yield return item;\n        else\n           \
    \ yield break;\n    }\n```\n\nYou can use Take with EndlessListFunction like this:\n\
    \n```\nvar fiveElementList = Take(5, EndlessListFunction());\nforeach (var item\
    \ in fiveElementList)\n    Console.WriteLine(item);\n```\n\nThis is a good example\
    \ of how iterators can be used as modules. The iterator created by EndlessListFunction\
    \ can return an unlimited number of elements, but there's no problem if the algorithm\
    \ only works the first few. Only the necessary work is ever executed. You will\
    \ see improved versions of the Take function later in the book."
