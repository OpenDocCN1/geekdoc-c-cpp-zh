    memoization is still a promising strategy, when coupled with careful expiry of
    outdated cache elements.


    Depending on considerations of the algorithm, an automated cache cleanup can be
    very useful based, for instance, on a high-water mark applied to the number of
    elements in the cache or on a certain time that can elapse before an element is
    regarded as outdated.


    # SUMMARY


    The need for strategies to remember previous results of computations is not specific
    to functional programming. However, with lazy evaluation mechanisms and the general
    guideline of calling functions as much as possible, it is especially important
    in functional programming to have caching technology easily available. Precomputation
    and memoization are two techniques of storing calculated data before and after
    it''s first needed.'
