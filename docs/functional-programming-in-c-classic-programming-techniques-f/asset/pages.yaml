  md: "# IMPLEMENTING ITERATOR FUNCTIONS\n\nC#'s iterator feature, introduced in C#\
    \ version 2.0, allows you to create implementations of the IIEnumerable/Enumerator\
    \ combination without ever implementing either of those interfaces manually. It\
    \ goes even further by supporting the generic interfaces in addition to the non-generic\
    \ ones, and making it possible to implement Enumerator.\n\nTypically, it is only\
    \ necessary to implement a function with a particular return type to use this\
    \ feature. The second criterion the compiler looks for in order to apply its transformations\
    \ (more often that in a moment) is the use of at least one of several special\
    \ keywords within function. Most common is the yield return statement. For example,\
    \ the EndlessList example can be implemented as a C# iterator like this (using\
    \ a generic interface for a change):\n\n```\npublic static IEnumerable<int> EndlessListFunction()\
    \ {\n    int val = 0;\n    while (true)\n        yield return val++;\n}\n```\n\
    \nTo understand how to work with this, it's easiest to take it literally. The\
    \ return type of the function is an IEnumerable<int>, so you use it in the places\
    \ where you might otherwise use a class that implements this interface. Here's\
    \ some code that iterates through the EndlessListFunction:\n\n```\nvar list =\
    \ EndlessListFunction();\nforeach (var item in list)\n    Console.WriteLine(item);\n\
    ```\n\nThe C# compiler automatically creates a class that implements the interface\
    \ IEnumerable<int>. The logic of that class and the corresponding Enumerator is\
    \ carefully structured to return the sequence of values that is generated by the\
    \ logic in function implementation.\n\nHere's a simple iterator:\n\n```\npublic\
    \ static IEnumerable<int> ThreeNumbers() {\n    yield return 3;\n    yield return\
    \ 11;\n    yield return 27;\n}\n```\n\nThe following contains the class code that\
    \ the compiler generates for the ThreeNumbers iterator function. The code has\
    \ been summarized somewhat to show the most important concepts, but you can use\
    \ the .NET Reflector tool to see what happens when you compile code using the\
    \ yield return statement like before:\n\n```\nclass ThreeNumbersIterator : IEnumerable<int>,\
    \ IEnumerable,\nEnumerator<int>, Enumerator {\n    int state;\n    int current;\n\
    ```"
