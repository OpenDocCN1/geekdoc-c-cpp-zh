    \ elements of the for loop is baffling compared to the simplicity of the other\
    \ two samples.\n\nWhat are the downsides of preferring higher order functions?\
    \ There are not many — issues like the complexity and the deficiencies of type\
    \ inference in C# have been mentioned before — it is important to see that the\
    \ advantages offered by higher order functions are useful only if everyone who\
    \ needs to work with the code understands the functions being used and knows their\
    \ patterns well. This is especially true for higher order functions you create\
    \ yourself, which are new to the reader and generally likely to work on a slightly\
    \ lower level of abstraction than the well-known Map, Filter, and Fold functions.\n\
    \n> Chapters 3 and 12 describe basic and advanced use cases of higher order functions.\n\
    \n# Prefer Immutable Data\n\nThe topic of immutable data has been discussed in\
    \ much detail in Chapter 16, but it is a good idea to make it a guideline? There\
    \ are certain usability issues with immutable data in C#, at least for the single-object\
    \ cases. Some technologies in .NET also rely on data being mutable, or at least\
    \ offer a lot of functionality if data can be changed. For instance, data binding\
    \ in conjunction with complex and highly interactive UI controls in WinForms,\
    \ WPF, or Silverlight loses a lot of its appeal when data is immutable.\n\nNevertheless,\
    \ the guideline says “prefer immutable data,” and it is worthwhile keeping mutability\
