  md: '# Composing Functions | 151


    In the function body, you can easily identify the line that looks exactly like
    the lambda expression calcCfromA, Compose takes two functions that fit the descriptions
    of CalB and CalC in this example and chains them together, returning a new function
    that performs the two steps in one.


    Using Compose, CalB and CalC can be combined like this:


    ```

    var calcCfromAauto = Functional.Compose<int, int>(CalB, CalC);

    ```


    Once more, type inference in C# is unfortunately not good enough, so you need
    to pass in the type parameters explicitly for this example:


    ```

    Func-int, int calB = a => a * 3;

    Func-int, int calC = b => b + 27;

    var calcCfromA = Functional.Compose(calB, calC);

    // Alternatively:

    var calcCfromA_ = calB.Compose(calC);

    ```


    If the two functions are lambda expressions, this is not necessary.


    The most important thing when working with functional composition is to keep the
    types aligned correctly. In this example, that quite simple because all the parameter
    and return types in question are int. In FSlib, you can imagine a pipeline being
    constructed. The first function passed into Compose (calB) has a certain parameter
    type (int), which will also be the parameter type of the resulting function. The
    result of calB is int, which has to match with the parameter type of the second
    function passed into Compose (calC) — again, this is int. Finally, the result
    function will also have a type of int because that''s the result of calC.


    Functional languages often have an operator specifically for composition, which
    is unfortunately impossible in C#. When reading code in other languages, always
    remember that they don''t all use the same semantics. In F#, there are two composition
    operators. One of them works similarly to the C# implementation described here:


    ```

    let calcFromA = calB >> calC

    ```


    In Haskell, on the other hand, the notion of the pipeline that works from left
    to right is not used, so the example is the other way:


    ```

    calcCfromA = calC . calB

    ```


    Both languages make it easy to perform this step, but the order of combining the
    functions isn''t necessarily the same as in the FSlib implementation.


    FSlib has a number of overloads for the compose function, which can function in
    two ways. First, the first function in the chain can have an arbitrary number
    of parameters. All other functions in the chain can only have one parameter, of
    course, since they need to take the value as input that has been returned by the
    previous function in the chain. Second, the last function in the chain can be
    an Action instead of a Func. In this case, the resulting function will be an Action
    without an overall return value.'
