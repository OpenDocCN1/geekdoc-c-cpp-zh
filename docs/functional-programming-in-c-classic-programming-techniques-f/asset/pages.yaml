  md: '# GOOGLE MAPREDUCE AND ITS IMPLEMENTATIONS


    The MapReduce pattern, described in Chapter 19, was invented by Google, and a
    U.S. software patent was issued for it in January 2010.


    There are many different implementations of MapReduce used today, and in usable
    from a variety of programming languages. The MapReduce pattern is just a part
    of the infrastructure required to benefit from the distributed computing idea
    behind the approach. There are complex implementations that provide the required
    data storage mechanisms, specialized languages to construct MapReduce solutions,
    and all the infrastructure to deploy such solutions to clusters of machines that
    execute the calculations, access the data, and persist and persist the resulting
    information.


    One popular implementation is called Hadoop. Created by Doug Cutting, Hadoop is
    now an open source project coordinated by the Apache Software Foundation. It''s
    written in Java and has seen great investment by commercial users by Yahoo! It
    is, or at one point, the basis of systems run by Amazon, Facebook, Microsoft,
    and many others.


    Through Amazon Web Services, a platform for Amazon''s Elastic Cloud Compute (EC2)
    services, you can access a system called Amazon MapReduce. Based on Hadoop, it
    takes its data off Amazon''s S3 storage system and uses EC2 instances to build
    the cluster on which MapReduce jobs are executed. These jobs flows can interact
    with Hive or Pig — more infrastructure, as well as language support, related to
    the Hadoop project — or they can be implemented as streaming jobs flows, which
    can utilize a number of different programming languages.


    The documentation pages on Elastic MapReduce don''t C# or .NET supported for the
    purpose of creating jobs flows. But it has been suggested in the Amazon forums
    that translating Mono via a bootstrap approach should be possible. As result,
    it may be possible to utilize the Amazon MapReduce engine as a .NET programmer,
    but it will require some effort at this time.


    On Microsoft platforms, there has been a talk for Hadoop being available to users
    of Microsoft''s cloud computing platform, Windows Azure. Microsoft has been using
    Hadoop as the basis of its Bing search engine, which seems like a possibility,
    although Microsoft''s research project is not entirely clear in this case. It
    currently looks like they will pursue a research project Dryad, which uses different
    approaches to Google MapReduce, with similar purposes, and it has a LINQ binding,
    making it easy to translate LINQ queries to Dryad processes. It even possible
    to implement the MapReduce pattern on the basis of Dryad easily through the use
    of LINQ. And with the help of AppFabric services, many Azure developers have built
    their own environments for the MapReduce pattern.


    Outside of Microsoft, there were several third-party products that make MapReduce
    available to the .NET programmer. MongoDB, for example, is an open-source database
    system with .NET bindings that use MapReduce for aggregation implementation. MongoDB
    has built-in support for the MapReduce pattern, which is normally controlled by
    JavaScript functions. The C# driver, however, can generate these functions automatically,
    based on LINQ queries executed against the database. MongoDB also has a feature
    called sharding, which allows horizontal scaling of the MongoDB infrastructure
    to a large number of machines, and any MapReduce algorithms can automatically
    distribute across all shards.'
