  md: "Of course, this approach makes tail recursion impossible because return value\
    \ has to be handled separately right after it has been returned. Theoretically\
    \ it would be possible for the C# compiler to unreal all this and convert into\
    \ a single working iterator, but there is no support for this.\n\nAs a final note\
    \ on the topic of the PointSequence implementation, it is possible to create a\
    \ sequence using ranges (either described in Chapter 13, or the ones returned\
    \ by Enumerable.Range and Functional.Map or the Select of LINQ). The discussion\
    \ is not meant to be exhaustive — as always, there are many ways of doing the\
    \ same thing.\n\nReturning to the CalArea implementation, the second function\
    \ used there is Calc. Here it is:\n\n```\nprivate static PointResult CalcPoint(Point\
    \ point, CalcInfo calcInfo) {\n    var iterations = Iterator(calcInfo.XStart +\
    \ point.X * calcInfo.XStep,\n    calcInfo.YStart + point.Y * calcInfo.YStep);\n\
    \    return new PointResult(ColorFromIterations(iterations));\n}\n```\n\nThis\
    \ function is simple. It uses the Iterator to calculate the mathematical result\
    \ for the given point, then calls ColorFromIterations to map the result to a color,\
    \ and returns a nicely packaged block of result information in a PointResult instance.\n\
    \nIterator is the first interesting thing in this class:\n\n```\nprivate static\
    \ int Iterator(double x, double y) {\n    double tx = 0, ty = 0;\n    int iteration\
    \ = 0;\n    while ((tx * tx + ty * ty) < (2 * 2) &&\n    iteration < MAX_ITERATION)\
    \ {\n        double ttx = tx * tx - ty * ty + x;\n        ty = 2 * tx * ty + y;\n\
    \        tx = ttx;\n        iteration++;\n    }\n    return iteration;\n}\n```\n\
    \nYou will recognize this piece of code from the initial example; in the refactoring\
    \ efforts on this point, the choice was made to stop at this point and leave the\
    \ point-calculation in original format. That means the loop in this function is\
    \ the smallest that can be parallelized (in the sense that loops, for different\
    \ x and y values, run in parallel, not different iterations of the loop). This\
    \ is a cautious decision because parallelization is not just important to achieve\
    \ the largest number of chunks. It is also important to keep the size of each\
    \ chunk to a certain minimum because some point over the head through generation\
    \ and management of a huge number of chunks can grow too large if the work done\
    \ in each chunk is comparatively insignificant. Finally, even if the decision\
    \ hadn't been made to define one pixel as the smallest unit for parallelization,\
    \ I would have noticed that in the iteration itself, each depends on the previous\
    \ run — it's not called an iteration for nothing!"
