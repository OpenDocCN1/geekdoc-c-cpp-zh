  md: '# Computer Memory and Storage


    # 2.3 RANDOM ACCESS MEMORY (RAM)


    Random access memory is like the computer''s scratch pad. It allows the computer
    to store data for immediate manipulation and keep track of what is currently being
    processed. It is the place in a computer where the operating system, application
    programs, and data in use are kept so that they can be accessed quickly by the
    computer''s processor. RAM is much faster to read from and write to the other
    kinds of storage in a computer like the hard disk or floppy disk. However, the
    data in RAM stays there only as long as the computer is running. When the computer
    is turned off, RAM loses all its contents. When the computer is turned on again,
    the operating system and other files are again loaded into RAM. When an application
    program is started, the computer loads into RAM and does all the processing. This
    allows the computer to run the application faster. Any new information that is
    created in RAM and same RAM is volatile in nature, one needs to continuously save
    the new information to the hard disk.


    Let us take a simple example of why RAM is used by the computer. Whenever a user
    enters a command from the keyboard, the CPU interprets the command and instructs
    the hard disk to ''load'' the command or program into memory. Once the data is
    loaded into memory, the CPU is able to access it much more quickly (Fig. 2.2).
    The reason behind this is that the main memory is much faster than secondary memory.
    The process of putting things the CPU needs in a single place from where it can
    get them more quickly is similar to placing various documents, which the user
    needs, into a single file folder. By doing so, the user finds all the required
    files handy and avoiding searches every time they needs them.


    ![](img/de490c7868193a94130ecb9dbc887c5f_35_0.png)


    Figure 2.2

    Interaction of Memory and Storage with Processor


    # 2.3.1 Types of RAM


    Random access memory (SRAM) is of two types:


    +   - Static RAM (SRAM): The word ''static'' indicates that the memory retains
    its contents as long as power is being supplied. However, as the power gets down,
    the data is lost. This makes SRAM a volatile memory opposed to read only memory
    (ROM). SRAM does not need to be ''refreshed'' (pulse of current through all the
    memory cells) periodically. It is very fast but more expensive than DRAM. SRAM
    is often used as cache memory due to its high speed.'
  merge: -1
