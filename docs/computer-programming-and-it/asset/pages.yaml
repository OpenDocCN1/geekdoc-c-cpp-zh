    # 9.20 goto STATEMENT


    This statement does not require any condition. This is unconditional control jump.
    This statement passes control anywhere in the program, i.e. control is transferred
    to another part of the program without testing any condition. User to define goto
    statement as follows.


    goto label;


    where the label name start with any letter, label is the position where the control
    is transferred. Few examples are described in this chapter for the sake of understanding.


    Table 9.10 Difference between the break and continue


    | break | continue |

    |---|---|n| It is used to exit from current block or loop. | It is used to skip
    the loop iteration and return the control to the next loop statement / iteration.
    |

    | It terminates the loop. | It never terminates the loop/ program. |

    | Control passes to the statement instantly following the body of the loop containing
    the break. | Control passes to the next statement. |


