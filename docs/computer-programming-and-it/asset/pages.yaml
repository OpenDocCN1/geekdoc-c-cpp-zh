    # 12.7 TWO-DIMENSIONAL ARRAY


    A two-dimensional array can be thought of as a rectangular display of elements
    with rows and columns. For example, elements of int x[3][3] are shown in Table
    12.5.


    Table 12.5 Array Elements in Matrix Form

    | | Col1 | Col2 | Col3 |

    |---|---|---|---|n| Row1 | x[0] [0] | x[0] [1] | x[0] [2] |

    | Row2 | x[1] [0] | x[1] [1] | x[1] [2] |

    | Row3 | x[2] [0] | x[2] [1] | x[2] [2] |


    The arrangement of array elements in Table 12.5 is only for the sake of understanding.
    Conceptually the elements are stored in a matrix form. Physically the array elements
    are stored in one continuous form in the memory.

    A two-dimensional array is a collection of number of one-dimensional arrays, which
    are placed one after another. For example, in the above table each row of a two-dimensional
    array can be thought of as a singledimensional array.


