    Compiler is a kind of translator that translates a program into another program,
    known as target language (Fig. 4.7). Usually, the term compiler is used for language
    translator of high-level language into machine language. The compiler replaces
    high-level statement with a series of machine instruction. A compiler resides
    on a disk or other storage media. When a program is to be compiled, its compiler
    is loaded into memory. The compiler stores the entire high-level program, and
    it translates the whole program into an equivalent machine language. During the
    translation process, the compiler reads the source program and checks the syntax
    (grammatical) errors (Fig. 4.8). If there is any error, the compiler generates
    an error message, which is usually displayed on the screen. In cases of error,
    the compiler will not create the object code until all errors are rectified.


