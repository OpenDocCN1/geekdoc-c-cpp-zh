  md: '# Computer Programming and IT


    # 12.3 DEFINITION OF AN ARRAY


    An array is a collection of similar data types in which each element is located
    in separate memory locations.


    # 12.4 CHARACTERISTICS OF AN ARRAY


    +   1. The declaration int [5]; is nothing but creation of 5 variables of integer
    types in the memory. Instead of declaring five variables for five values, the
    programmer can define them in an array.

    2. All the elements of an array share the same name, and are distinguished from
    one another with the help of an element number.

    3. The element number in an array plays major role for accessing each element.

    4. Any particular element of an array can be modified separately without disturbing
    other elements.


    ```

    int a[5]={1,2,3,4,8};

    ```


    If a programmer needs to replace 8 with 10, he/she not require to change all other
    numbers except 8. To carry out this task the array [4]=10; can be used. Here,
    the other elements are not disturbed.


    +   5. Any element of an array [] can be assigned/equated to another ordinary
    variable or an array variable of its type.


    For example

    b=a[2];

    a[2]=a[3];


    +   a. In the statement b=a[2] value of a[2] is assigned to b, where b is an integer.

    b. In the statement a[2]=a[3] value of a[3] is assigned to a[2], where both the
    elements are of the same array.


    +   6. The elements are stored in contiguous memory locations. The amount of storage
    required for holding elements of an array depends on its type and size. The total
    size in bytes for a single dimensional array is computed as below

    Total bytes = sizeof(data type) X number of array elements


    # 12.5 ONE-DIMENSIONAL ARRAY


    The elements of an integer array a[5] are stored in contiguous memory locations.
    Let us assume that the starting memory location is 2000. Each integer element
    requires 2 bytes. Hence subsequent element appears after a gap of 2 locations.
    Table 12.2 shows the locations of an integer array.


    Table 12.2 Integer Data Type and Their Memory Locations


    | Element | a[0] | a[1] | a[2] | a[3] | a[4] |

    |---|---|---|---|---||}{

    | Address | 2000 | 2002 | 2004 | 2006 | 2008 |


    Similarly, the elements of any array data type are stored in contiguous memory
    location. The only difference is that the address of locations are different for
    different data types & sizeof of the data types are different.'
