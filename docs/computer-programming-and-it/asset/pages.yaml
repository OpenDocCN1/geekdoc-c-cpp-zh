- img_proc: true
  md: '# Computer Memory and Storage 23


    refers to the electronic holding place for instructions and data that the processor
    can reach. It can be classified into two broad categories: *primary memory* (to
    process the data and hold the intermediate results) and *secondary memory* (to
    store the output).


    The primary memory allows the computer to store data for immediate manipulation
    and to keep track of what is currently being processed. The major limitation of
    this type of memory is that it is volatile. When the power is turned off, the
    contents of primary memory are lost forever. Hence, to store the data permanently,
    a computer requires non-volatile storage like hard disk. This kind of storage
    is known as *secondary memory*. Such memories store all the data (files) and instructions
    (computer programs) even after the power is turned off. The secondary storage
    devices have a larger storage capacity; they are less expensive compared to primary
    storage devices, but slow in comparison.


    **Note:** When we talk about memory, we generally refer to the primary memory
    only, and when we talk about storage, secondary memory is referred.


    # 2.1.1 Memory Representation


    All the quantities, physical or otherwise, are measured in some units. For example,
    length is measured in meters and mass in grams. Likewise, for measuring memory,
    a standard unit is required. As we know that digital computers use only two states:
    (1) ON and (0). These values are represented by two different voltages in the
    circuit. Hence, 0 represents a false value (0), and +5 represents a true value
    (1). Each of these values (either 0 or 1) is called a *binary digit* or *bit*
    and can be considered a piece of information. Although the smallest unit of data
    that a computer can deal with, bit computers generally do not deal with a single
    bit. Instead, they deal with a group of eight bits, which is referred as a *byte*.
    A byte can have 256 different patterns and, can represent 256 different symbols.
    Units used to measure memory capacity are as follows:


    +   * **Bit**: It is the smallest unit of data on a machine and a single bit can
    hold only one of two values: 0 or 1. It is represented by a lower case b.

    * **Byte**: Unit of eight bits is known as a byte. Hence, a byte is able to contain
    any binary number between 00000000 and 11111111. It is represented by upper case
    B.

    * **Kilobyte**: In a decimal system, kilo stands for 1000; in a binary system,
    kilo stands for 1024. Aobyte is equal to 1024 bytes. It is usually represented
    as KB.

    * **Megabyte**: It represents 1024 kilobytes, or 1,048,576 bytes. However, since
    this number is remembered, a megabyte can be thought of as a million bytes. Megabyte
    is the standard unit of measurement for RAM and is represented as MB.

    * **Gigabyte**: It represents 1024 megabytes (1,073,741,824 bytes). It is the
    standard unit of measurement for hard disks and is often represented as GB.

    * **Terabyte**: It represents 1024 gigabytes. Often represented as TB, terabyte
    memory is usually associated with super computers only.


    *In modern computers, groupings of bytes (usually 2 or 4), called computer words
    can represent larger ''chunks'' of information.


    # 2.2 MEMORY HIERARCHY


    The processor is the "brain" of the computer where all the essential computing
    takes place. Unlike a human brain, a computer processor has very limited memory.
    Thus, it has to rely on other kinds of memory to hold data and instructions to
    store results. The memory in a computer system is of three fundamental types:'
