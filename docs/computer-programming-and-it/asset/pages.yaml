    # 3.7 STARTING A COMPUTER (BOOTING)


    A fundamental operation involved in starting a computer is the booting process.
    This process is performed through a series of steps. These steps are listed below:


    +   1. The computer is switched ON.

    2. The computer loads data from ROM and checks whether all the major components
    like processor and hard disk are functioning properly.

    3. The computer loads BIOS from ROM to determine the machine''s fundamental configuration
    and environment. The information stored in ROM chip determines what peripherals
    the system can support.

    4. The computer loads the operating system from the secondary storage (hard disk)
    into random-access memory (RAM). This allows immediate access to the operating
    system, which enhances the performance and functionality of the overall system.


