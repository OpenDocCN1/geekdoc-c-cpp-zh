    # 3.2.1 Relationship between Software and Hardware


    Software refers to the computer programs that are loaded into a computer system,
    and hardware refers to all the visible devices that assembled together to build
    a computer system. Both software and hardware go in hand; you cannot have one
    without the other. Even though hardware is the physical part of a computer, it
    is of no use without software to control it. In a way, hardware is like a car
    without a driver; one needs both to make something happen. Software is a set of
    instructions that tells the hardware what to do and how to perform the requested
    actions. Thus, hardware and software share a special relationship. If hardware
    is the ''heart'' of a computer, software is its ''soul''. Both are complementary
    to each other.


