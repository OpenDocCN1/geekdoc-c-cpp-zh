  md: '# 10.3 AUTOMATIC VARIABLES


    Automatic variables, also called auto variables, are defined inside the function
    without storage class name, by default, is an auto variable. These functions are
    declared on the stack. The scope of the variable is local to the block in which
    they are defined. These variables are available only to the current block or program.
    Once the execution of the function takes place and return turns off the function,
    the contents and existence of the auto variables or local variables vanish. auto
    variables are safe, that is, they cannot be accessed directly by other functions.


    The program illustrates the working of auto variables.


    ![](img/de490c7868193a94130ecb9dbc887c5f_263_0.png)


    In the above program, the variable v is declared and initialized in three different
    functions. Each function, when called, prints the local values of variables v,
    which are shown at the output. When a function is called, it declares its own
    variable v and when a function terminates, the local variable v is destroyed.
    Here, every function has its own variable v with different values. The three variables
    v are having their own unique memory locations.'
