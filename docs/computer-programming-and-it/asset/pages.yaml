    * 15.13 union of Structures


    # 15.1 INTRODUCTION


    You are aware that C variable stores a single value of a data type. Arrays can
    store many values of similar data type. The data in the array is of same composition
    and nature as far as type is concerned. In real life, we need to have different
    data types, for example, to maintain employees information we should have information
    such their name, age, qualification, salary and so on. Here, to maintain information
    of employees, dissimilar data types are required. All these data types cannot
    be expressed in a single array. One might think to declare different arrays for
    each data type. But there will be a huge increase in size of the program. Hence,
    arrays cannot be used here. For handling such mixed data types, a special feature
    is provided by C. It is known as structure.


    A structure is a collection of one or more variables of data types grouped under
    a single name. It is a user-defined data type because user has the right to decide
    type of data to be inside the structure. By using structures we can make a group
    of variables, arrays, pointers, and so on.'
  merge: -1
  pgno: 374
- img_proc: true
  md: "# 15.2 FEATURES OF STRUCTURES\n\nTo copy elements of one array to another,\
    \ array of same data type elements are copied by one. It is not possible to copy\
    \ all the elements at a time, whereas in structure it is possible to copy the\
    \ contents of all structure elements of different types to another structure of\
    \ its type using assignment (= operator. This is possible because the structure\
    \ elements are stored in successive memory locations.\n\nNesting of structures\
    \ is possible, that is, one can create a structure within a structure. Using this\
    \ feature one can handle complex data types.\n\nIt is also possible to pass structure\
    \ elements to a function. This is similar to passing an ordinary variable to a\
    \ function. One can pass individual elements or entire structure by value or address.\n\
    \nIt is also possible to create structure pointers. Recall Chapter 13 on Pointers\
    \ where we discussed pointing a pointer to an integer, pointing to a float and\
    \ to a char. In a similar way, we can create a pointer pointing to structure elements.\
    \ For this it requires -> operator.\n\n# 15.3 DEFINITION, DECLARATION, AND INITIALIZATION\
    \ OF STRUCTURE\n\nCollection of different data types under a single unit is done\
    \ with structure.\n\nStructure is defined as\n\n```\nstruct struct_type\n  Type1\
    \ variable1;\n  Type2 variable2;\n;\n```\n\nStructure definition always starts\
    \ with struct keyword. Here, struct_type is known as tag. The member of the structure\
    \ are enclosed within a pair of curly braces.\n\nA closing brace is terminated\
    \ with a semicolon. Using struct and tag, the user can declare structure variables\
    \ like variable1, variable2 and so. After defining structure we can create variables\
    \ as below.\nstruct struct_type v1,v2,v3; Here, v1, v2, and v3 are variables of\
    \ structure struct_type. This is similar to declaring variable of any data type.\n\
    \nint v1,v2,v3; Here, v1,v2, and v3 are variables of integer data type. The declaration\
    \ defines the structure but this does not allocate memory. The memory allocation\
    \ takes places only when variables are declared.\n\nDefining a structure and declaration\
    \ of variable is as follows.\n\n```\nstruct book1\n{\n  char book [30];\n  int\
    \ pages;\n  float price;\n}\n```\n\nstruct book1 bkl; In the above example, a\
    \ structure of type book1 is created. It consists of three members, book [30]\
    \ of char data type, pages of int type and price of float data type. Figure 15.1\
    \ explains various members of a structure.\n\n```\nstruct book1 bkl;\n```"
