    # 5.1.2 Conversion between Number Bases


    Computers and digital systems use binary as their primary function. Therefore,
    it is necessary to have methods and systems for representing information in forms,
    which can be manipulated and stored using electronic or other types of software.
    As discussed earlier, a computer uses binary numbers for representation internally,
    whereas it uses decimal numbers externally. However, any number in one number
    system can be represented in another number system. Various techniques can be
    used to convert numbers from one to another, as follows:


    # Converting Decimal to Binary, Octal, and Hexadecimal


    The method used for the conversion of a decimal number into other number system
    is often done using the "remainder" method. This method involves the following
    steps:


    +   1. Divide the decimal number by the base to get the remainder. To convert
    decimal to binary, divide the decimal number with 2 (the base of the binary number
    system), 8 for octal, and 16 for hexadecimal.

    2. Note the remainder as the first digit from the right. In case of hexadecimal,
    if the remainder exceeds 9, convert the remainder into an equivalent hexadecimal
    form. For example, if the remainder is 10 then note the remainder as A.

    3. Continually repeat the process of dividing until the quotient is zero and keep
    writing the remainders after each step of division.

    4. Finally, when no more division can occur, write down the remainders in reverse
    order.'
