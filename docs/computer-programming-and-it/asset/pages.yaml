  md: '# Computer Memory and Storage


    **Step 3** CPU loads (basic input/output system) from ROM to determine the machine''s
    fundamental configuration and environment. The information stored in ROM determines
    which peripherals the system can support.


    **Step 4** CPU loads the operating system from the secondary storage (hard disk)
    into RAM. This allows the CPU to have immediate access to the operating system,
