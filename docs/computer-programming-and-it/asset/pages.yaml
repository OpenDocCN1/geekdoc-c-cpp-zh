  md: "# 396 Computer Programming and IT\n\n# 16.2 STREAMS AND FILE TYPES\n\nReading\
    \ and writing of data is done with streams. The streams are a file and using a\
    \ physical device like keyboard, information is stored in the file. Printer and\
    \ monitor are used to display stream. The FILE object contains all the information\
    \ about a stream like its current position, pointer to buffer, error, and EOF\
    \ (end of file). Using this information of object, C program uses pointer, which\
    \ is returned from stream function fopen(). A function fopen() is used for opening\
    \ a file.\n\n# File Types\n\nThere are two types of files: (1) sequential file\
    \ and (2) random accesses file.\n\n+   1. **Sequential file.** In this type data\
    \ are kept sequentially. If we want to read the last record of the file we need\
    \ to read all the records before that particular record. It takes more time to\
    \ access the records. Or if we desire to access the 10th record, then the first\
    \ 9 records should be read sequentially for reaching the 10th record.\n2. **Random\
    \ access file.** In this type data can be read and modified randomly. That is,\
    \ if we want to read the last record of the file, we can read it directly. It\
    \ takes less time compared to a sequential file.\n\n# 16.3 STEPS FOR FILE OPERATIONS\n\
    \nThere are three steps for file operation in C.\n\n+   i. **Opening a file.**\n\
    ii. **Reading or writing a file.**\niii. **Closing a file.**\n\nMost of the compilers\
    \ support file handling functions.\n language also supports many file handling\
    \ functions which are available in standard library and are listed in Table 16.1.\
    \ All the functions that support C are not listed here because all compilers do\
    \ not support all the functions. One should check the ANSI C library before using\
    \ them.\n\n| Table 16.1 File Functions |\n| --- | --- |\n| fopen() | Creates a\
    \ new file for read/write operation |\n| fclose() | Closes a file associated with\
    \ file pointer |\n| closeall() | Closes all files opened with fopen() |\n| getc()\
    \ | Reads the character from the current pointer position and advances the pointer\
    \ to the next character |\n| getc() | Same as getc() |\n| fprintf() | Writes all\
