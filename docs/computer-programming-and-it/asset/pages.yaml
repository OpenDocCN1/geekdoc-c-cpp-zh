  md: '# Introduction to Computers


    continue to produce cheaper and more powerful computers, offering the promise
    that in the near future, computers or terminals will reside in most, if not all,
    homes, offices, and schools.


    # 1.4 COMPUTER GENERATIONS


    The history of computer development is often discussed with reference to the different
    generations of computing devices. In computer terminology, the word generation
    is described as a stage of technological development or innovation. A major technological
    development fundamentally changed the way computers operate, resulting in increasingly
    smaller, cheaper, more powerful, and more efficient and reliable devices, characterizes
    each generation of computer. According to the technology used, there are five
    generations of computers are discussed in the following sections.


    # 1.4.1 First Generation (1940–1956): Vacuum Tubes


    First generation computers were vacuum tubes/thermionic valve-based machines (Fig.
    1.4). These computers used vacuum tubes for circuitry and magnetic drums for memory.
    A magnetic drum is a metal cylinder coated with iron-oxide material on which data
    and programs can be stored. Input was made on punched cards and paper tape, and
    output was displayed in the first of pronouns.


    First generation computers relied on binary-coded language (language of ''0''s
    and ''1''s to perform operations and were able to solve only one problem at a
    time. Each machine was fed with binary codes and hence difficult to program. The
