  md: 'Examples of octal and hexadecimal numbers:


    Octal numbers – 027, 037, 072


    Hexadecimal numbers – 0X9, 0Xab, 0X4


    +   (b) **Real Constants:** Real constants are often known as floating point constants.
    Real constants can be represented in exponential or fractional form. Integer constants
    are unfit to represent many quantities. Many parameters or quantities are defined
    not only in integers but also in real numbers. For example, height, price, distance,
    etc. are also measured in real numbers.


    The following concepts are essential to follow the real numbers:


    +   (a) The decimal point is permitted.

    (b) Neither blank spaces nor commas are permitted.

    (c) Real numbers could be either positive or negative.

    (d) The number without a sign is assumed as positive.


    Examples of real numbers are **2.5, 5.521, 3.14, etc.**


    The constants can be written in exponential notation, which contains fractional
    and exponential parts. For example, the value 2456.123 can be written as 2.4561
    X e3.


    The part that precedes e is called mantissa and the part that follows it is exponent.
    In this example, 2456 is the mantissa and +3 is the exponent.


    The following points must be noted while constructing a real number in exponential
    form:


    +   (a) The real number should contain a mantissa and an exponent.

    (b) The letter ''e'' separates the mantissa and the exponent and can be written
    in lower or upper case.

    (c) The mantissa should be a real number represented in decimal or integer form.

    (d) The mantissa may be either positive or negative.

    (e) The exponent should be an integer that may be positive or negative.


    Some valid examples are 5.2e2–2, 5.0e–5, 0.5e–3, etc.


    In double type the real numbers can be expressed with mantissa and exponent parts.


    # 7.6.2 Character Constants


    +   (a) **Single character constants** A character constant is a single character.
    Characters are also represented by a single digit, special symbol, or white space
    enclosed within a pair of single quote


    Example: ‘a’, ‘8’, ‘ ''’, etc.


    Character constants have integer values known as ASCII values. For example, the
    statement `printf("%d", "B");` will display the characters, ‘A’ and 66.


    +   (b) **String constants** String constants are sequence of characters enclosed
    within double quote marks. The string may be a combination of all kinds of symbols.


    Example: “Hello", “India", “444", “a”.'
