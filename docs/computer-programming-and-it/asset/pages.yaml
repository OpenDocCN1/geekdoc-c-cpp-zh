    2. Computer development is divided into five generations. With every generation,
    computer technology has fundamentally changed, resulting in increasingly smaller,
    cheaper, more powerful, efficient, and reliable devices. First generation computers
    were vacuum tube based machines. These computers were very large, and required
    a lot of space for installation, generated a large amount of heat, and were non-portable
    and very slow. Second generation computers used transistors in place of vacuum
    tubes. Since the transistor was a small device, the physical size of computers
