    # # Pointers


    ## CHAPTER OUTLINE

    13.1 Introduction | 13.5 Pointers and Arrays

    13.2 Features of Pointers | 13.6 Pointers and Two-Dimensional Arrays

    13.3 Pointer Declaration | 13.7 Array of Pointers

    13.4 Arithmetic Operations with Pointers | 13.8 void Pointers


    # ### 13.1 INTRODUCTION


    Most of the computer language ''learners'' feel that pointer is a puzzling topic
    and most difficult. However, pointer enables fast and straightforward execution
    of the program. With pointers memory is used most efficiently. Hence, it is important
    to know the operation and applications of pointers. Pointers are used as tool
    in C and if you fail to understand it, you will be losing the power of C.


    Variables are used in C to hold data values during the execution of a program.
    Every variable when declared occupies certain memory locations. In C, it is possible
    to access and display the address of the memory location of variable using the
    & operator with variable name. The pointer variable is needed to store the memory
    address of any variable and is denoted by an (*) asterisk symbol.'
