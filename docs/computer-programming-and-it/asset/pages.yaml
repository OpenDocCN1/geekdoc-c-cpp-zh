    # 11.7 CONDITIONAL COMPILATION


    Quite one can use conditional compilation directives in the programs. The most
    frequently used conditional compilation directives are #ifdef, #else, #endif etc.
    These directives allow to the program to include the portions of the codes based
    on the conditions. The compiler compiles selected portion of the source codes
    based on the conditions. The syntax of the #ifdef directives is given below.


    Syntax:


    ```

    #ifdef identifier

    {

    statement1;

    statement2;

    }

    #else

    {

    statement3;

    statement4;

    }

    #endif

    ```'
