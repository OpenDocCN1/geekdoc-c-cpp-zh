  md: '# 206 Computer Programming and IT


    # 9.1 INTRODUCTION


    Reading data from input devices, processing it, and displaying the results on
    the screen are the three tasks of any program. The data are read from the input
    device such as keyboard, operations on the data are performed based on the operators,
    and the results are displayed on the screen. All the tasks cited above are important
    and none of them should be ignored.


    There are two ways to accept the data. In one method, a data value is assigned
    to the assignment statement. The program writes assignment statements in most
    of the programs. An example of an assignment statement is given in Chapter 8 and
    can be found in the ensuing chapters too. Assignment to the variables can be done
    as follows:


    +   (1) year=2005; (2) char letter=''a''; (3) long int x=123456; etc.

    Another way to accept the data is with functions. In C, the input and output functions
    can be used for inputting the data and displaying the results respectively. In
    order to carry out these tasks, user-friendly C has a number of input and output
    functions. When a program needs data, it takes the data through the input functions
    and sends the results after computation through the output functions. Thus, the
    input/output (I/O) functions are the link between the user and the terminal.


    Streams perform all input and output operations. They are not nothing but sequences.
    When a program performs input and output operations, the streams are connected
    to the program automatically. The operating system allows streams to redirect
    to other devices. If any error occurs, it will be reported on the screen by the
    third stream called standard error.


    # 9.2 INPUT AND OUTPUT FUNCTIONS


    There are a number of I/O standard functions in C, based on the data types. The
    I/O functions are classified into two types: (a) formatted functions and (b) unformatted
    functions. Various functions of these categories are listed in Figure 9.1.


    **a) Formatted functions** With formatted functions, the input data or output
    results are formatted as per requirement. They improve the readability of the
    I/O. For example, with formatted functions one can decide how the result should
    be displayed on the screen. Formatted functions take the appearance of


    ![](img/de490c7868193a94130ecb9dbc887c5f_216_0.png)


    Figure 9.1 Formatted and Unformatted Functions'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Input, Output, and Control Loop Statements 207


    the results. For example, the result can be displayed in the second line or after
    leaving some space; if the result is a real then a decision can be made on number
    of digits before and after the decimal point. All I/O functions are defined in
    stdio.h header file, which can be initialized at the start of a program.


    The formatted I/O functions can be used to read and write all types of data. They
    require a format specifier to identify the data type. The formatted functions
    return the values after execution. The return value is equal to the number of
    variables successfully read/write. Using this, the user can find out the errors
    occurring during reading or writing the data.


    Using this function, the numeric data can be represented in floating point, integer,
    and double to alleviate the limits of the language.


    The syntax of the input function for inputting the data is scanf ( ).


    Example:


    ```

    scanf("control string", address of variable 1,address of variable 2, --);

    ```


    The control string has to be enclosed within double quotes. It specifies the format
    specifier, such as %d for integer, %f for float, %c for character, and the data
    to be invoked by arguments, such as address of variable, address of variable 2,
    etc.


    Precisely, we write scanf("%d", &x);


    Here, "d" is the format specifier in the control string, which is nothing but
    the conversion specification and it to be placed within double quotes. The other
    is the variable and & (ampersand) must precede it.


    The format specifiers and their meanings are given below.


    +   %d: The data is taken as integer.

    %c: The data is taken as character.

    %s: The data string.

    %f: The data is taken as float.


    For displaying the result, printf() formatted function is used. In Section 9.3,
    printf() and scanf() are discussed in depth.


    Table 9.1 provides formatted and unformatted I/O functions.


    (b) Unformatted functions Formatting is not possible with unformatted functions.
    The unformatted I/o only work with character data types. They do not require format
    specifiers for identification of data types because they work only with character
    data types. There is no need to convert the data. In cases of other data types
    are passed to these functions, they are treated as character data. The unformatted
    functions also return values, but the returned value of unformatted functions
    is always the same.


    Table 9.1 Formatted and Unformatted I/O Functions.


    | Formatted Functions | Unformatted Functions |

    | Input | Output | Input | Output |

    | scanf() | printf() | getch() | putch() |

    | | | getche() | putchar() |

    | | | getchar() | put() |

    | | | gets() | |'
