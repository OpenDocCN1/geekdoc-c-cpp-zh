  md: '# Operators and Expressions


    For example, among arithmetic operators, the operators such as multiplication
    (*), division (/), and modulus ( ) have highest priority and similar precedence.
    The operators + and – have the lowest precedence.


    Example: 8+*2 - 10


    The operator * is highest priority. Here multiplication operation is performed
    first.


    ```

    = 8+18 – 10

    ```


    In the above expression + and – are having same priority. In such situation, the
    left most operation is solved first.


    ```

    = 26 – 10

    ```


    (b) *Associativity*: When an expression has operators with equal precedence then
    the associativity property decides which operation is performed first. Associatively
    means the direction of execution. Associativity is two types.


    (1) Left to right: In this type expression evaluation starts from left to right
    direction.


    Example: 12*4 / 8 % 2


    In the above expression, all operators have same precedence so associativity rule
    is followed.


    ```

    = 48 / 8 % 2

    ```


    ```

    = 6 % 2

    ```


    ```

    = 0

    ```


    (2) Right to left: In this type expression, evaluation starts from right to left
    direction.


    Example:


    ```

    x = 8+5 % 2

    ```


    ```

    x = 8

    ```


    ```

    x = 9

    ```


    In the above expression, the assignment operator has right to left associativity.
    Hence, right-hand side of the assignment operator is evaluated first (8+5 % 2).
    Then its results are assigned to x (i.e. 8+1=9).


    # 8.4 PRIORITY OF OPERATORS AND THEIR CLUBBING


    Each and every operator in C has its own priority. On the basis of the operator
    preferences, expressions are solved. The solution provided in Section 8.2, operators
    from the same group may have different precedence and associativity.


    Various relational operators have different priorities or precedence. If an arithmetic
    expression contains more operators then the execution will be performed according
    to the priorities of operators. The precedence is set for operators in C.


    A priority list of operators (hierarchical) is shown in Table 8.2.


    | Operators | Operation | Clustering | Priority |

    |---|---|---|-|

    | 0 | Function call | Left to right | 1st |

    | [] | Array expression or square bracket | | |'
