    # Example 5.34


    Write a general formula for 5043210-code for BCD representation called binary
    code.


    # Solution


    Formula to get the total N for the 5421 BCD code is again under:


    > $N = y_{p \max-1} \times w''_{p \max-1} + y_{p \max-2} \times w''_{o} + y_{p
    \max-3} \times w''_{s} + y_2 \times w''_2 + y_1 \times w''_1 + y_0 \times w''_0,
    (5.18)$


    where $p = p \max - 1$, $p \max - 2$, $p \max - 3$, $2, \dots, 1$ and $p \max$
    is $8$ (maximum number of places used in the BCD representation and $w_0 = 0;
    w_1 = 1; w_2 = 2; w_3 = 3; w_4 = 0; w_s = 5$ for the binary numbers when representing
    5043210 BCD code. The $y_o, y_i, \dots$ are the $0$ or $1$ at the right-most,
    left first from, second from that, and so on. At lowest level weights are $0,
    1, 2, 3, 4$ and $5$. From the Equation (5.10) decimal digit $9$ is $1010000$ and
    decimal $0$ is $01000001$.


    # Example 5.35


    Write Excess-3 (XS-3) code for 8, 9, and 2.


    # Solution


    Excess-3 code is obtained by adding 0011 binary into the standard binary form.
    Binary codes for 8, 9, 2 and 6 are 1000, 1001, 0010 and 0110. Therefore XS-3 codes
    are 1011, 1100, 0101 and 1001 after performing binary addition with 0011.'
