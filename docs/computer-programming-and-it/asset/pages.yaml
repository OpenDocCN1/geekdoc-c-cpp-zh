  md: '# The C Declarations


    All the previous listed characters are represented in the computer by numeric
    value. Each character is assigned a unique numeric value. These values put together
    are character codes. There are many character codes used in the computer system.
    The widely used computer codes are ASCII and EBCDIC.


    **ASCII CODE:** ASCII stands for the American standard for information exchange.
    It is of two types. One uses 7 bits and the other uses 8 bits. The 7-bit code
    represents 128 different characters and the 8-bit code represents 256 characters.
    For example, the character A is represented in the 7-bit code as 1000001 (decimal
    65). Refer Appendix-A for characters and their equivalent numbers.


