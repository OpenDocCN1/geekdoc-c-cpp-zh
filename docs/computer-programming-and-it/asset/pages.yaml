    # 3.1 INTRODUCTION


    A computer system consists of hardware, the electronic devices that are capable
    of computing and manipulating information, and software (set of instructions)
    that carries out predefined tasks to complete a given job. We know, a computer
    cannot think or perform on its own. It performs operations like addition, subtraction,
    multiplication, and division only when the user instructs it to do so. The user
    gives logical instructions and the central processing unit (CPU) acts in accordance
    with the instructions. The sets of instructions that control the sequence of operations
    are known as programs, and collectively, the programs are called software. It
    is an intangible commodity, that, the part of a computer system that users touch.\
    We compare hardware and software with human body and human intelligence, respectively.
    All human physical actions, such as walking and movements are initiated and controlled
    by the brain. If the brain does not initiate an action, we do not perform any
    physical activity. Similarly, the functioning of every hardware component is driven
    by software. The combination of physical components (hardware) and logical instructions
    (software) gives modern computing systems their power and versatility.'
