  md: '# 7.4 KEYWORDS


    The C keywords are reserved words by the compiler. All C keywords have been assigned
    a fixed meaning. They cannot be used as variable names because they have been
    assigned fixed jobs. However, few C compilers allow the construction of variable
    names, which exactly coincide with the keywords. It is suggested not to mix keywords
    with variable names. By utilizing the keywords in a program, no header file is
    to be included. The descriptions of the keywords are explained in different programs/chapters.
    The C keywords are listed in Table 7.4.


    Table 7.4 The C Keywords


    ```

    auto        double      int         struct

    break       else        switch

    case        enum        register    typedef

    char        extern      return      union

    const       float       short       unsigned

    continue    for         signed      void

    default     goto        sizeof      volatile

    do          if          static      while

    ```


    Additional keywords for Borland C are as follows:


    ```

    asm         ddecl       far         huge        interrupt   near        pascal

    ```


    # 7.5 IDENTIFIERS


    A symbolic name is used to refer to a variable. This is done using identifiers.
    In other words, identifiers refer to variety of entities, such as structures,
    unions, enumeration, constants, typedef names, functions, and objects. The C identifier
    does not allow blank spaces, punctuation, signs, etc.


    Identifiers are user-defined names, consisting of sequence of letters and digits,
    with the first as the letter character. They are used to variable names, functions,
    and arrays. They are generally defined in lower case letters. However, upper case
    letters are also permitted. The (_) underscore symbol can also be used as and
    in identifier. In general, underscore is used as a link between two words in long
    identifiers.


    Examples of valid identifiers are length, area, volume, sUM, Average.


    Examples of Invalid identifiers are length of line, S+um, year''s, etc.


    Figure 7.2 shows the various identifiers.


    ![](img/de490c7868193a94130ecb9dbc887c5f_168_0.png)


    Figure 7.2 Identifiers'
