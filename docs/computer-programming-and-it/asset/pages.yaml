    \ filename : \");\n    scansf(\"%s\",file);\n    in.h.ah=0x41;\n    in.x.dx=(int)file;\n\
    \    intdos(in,out);\n    if(out,x.cflag==0)\n        puts(\"\\n File successfully\
    \ deleted\\\");\n    else\n        puts(\"\\n file could not be deleted\\\");\n\
    }\n\nOUTPUT:\nEnter a file name : ABC.TXT\nFile successfully deleted\n```\n\n\
    # Explanation\n\nIn the above program, a file name is entered, which is to be\
    \ deleted. The ah register contains service number 0x41, the DX contains address\
    \ of the file. If the function is successful, the flag register contains 0 otherwise\
    \ a non-zero value. The value of cflag registers is checked using the if statement\
    \ and appropriate messages are displayed.\n\nThis program works correctly only\
