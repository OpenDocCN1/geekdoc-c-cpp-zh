    Since both of $X$ and $Y$ were 1, the answer is positive. Therefore, further negation
    is not to be done here. The answer is $M = 0000\ 0000\ 0000\ 0111\ 0100\ 1100\
    1011 = decimal\ 29899$ as expected from $1031 \times 29$.


