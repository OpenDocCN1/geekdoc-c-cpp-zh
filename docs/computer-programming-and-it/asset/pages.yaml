- img_proc: true
  md: '# Computer Memory and Storage


    ROM performs the necessary BIOS (Basic Input Output System) function to start
    the system and then transfers the control over the operating system.


    ROM can have data and instructions written into it only one time. Once a ROM is
    programmed, it cannot be reprogrammed or rewritten. If it is erroneous, or the
    data needs to be reorganised, one has to replace it with the new one. Thus, the
    programming of ROM chips must be perfect having all the required data at the time
    of its manufacturing. Note that in some instances, ROM can be changed using certain
    tools. For example, flash ROM (a type of ROM) is non-volatile memory occasionally
    can be changed such as when a BIOS chip must be updated. The ROM chips can consume
    very little power, are extremely reliable, and in case of most electronic devices,
    all the necessary programming to control the device.


    # 2.4.1 Types of ROM


    Memories in the ROM family are distinguished by the methods used to write data
    on and the number of times they can be rewritten. This classification reflects
    the evolution of ROM devices from ''hard-wired'' to programmable to erase-programmable.
    One common feature of all these devices is ability to retain data and programs
    even during a power failure. ROMs come in the following varieties:


    +   Masked ROM: The first ROMs, known as masked ROMs, were hard-wired devices
    that contained a pre-programmed set of data or instructions. The instructions
    of such ROMs had to be specified before production the actual data could be used
    to arrange the transistors inside the chip.


    +   Programmable ROM (PROM): Creating a ROM chip from scratch is a time-consuming
    and an expensive process. For this reason, developed a type of ROM known as Readable
    Only Memory (PROM), which can be programmed. Blank PROM chips can be bought economically
    and coded by the users with the help of a special device called PROM-programmer.
    However, once a PROM has been programmed, its contents can never be changed. As
    a result, PROM is also known as one-programmable (OTP) device. Like other ROMs,
    PROM is also non-volatile. However, it is more fragile than other ROMs as a static
    electricity can easily cause fuses in the PROM to burn out, changing the bit pattern
    from 1 to 0. Nevertheless, blank PROMs are economical and for prototyping the
    data for a ROM before committing to the costly fabrication process.


    +   Erasable ROM (EPROM): An EPROM is programmed in exactly the same manner as
    a PROM. However, unlike PROM, it can be erased and reprogrammed repeatedly. It
    can be erased by simply exposing the device to a source of ultraviolet light for
    a certain amount of time. Note that an EPROM is not selective; it will erase the
    entire EPROM. Although EPROM is more expensive than PROM, its ability to be reprogrammed
    makes it useful.


    +   Electrically Erasable Programmable ROM (EEPROM): This type of ROM can be erased
    by an electrical charge and written by using higher-than-normal voltage. EEPROM
    can be erased at a time, rather than erasing the chip with ultraviolet light.
    The process of re-programming is flexible, but slow. Also, changing the contents
    does not require any additional committed equipment. These chips can be changed
    without opening a case; they are used to store programmable instructions in devices
    like printers.


    +   Flash ROM: A flash ROM also called flash ROM or flash memory, is a type of
    constantly powered non-volatile memory that can be erased and re-programmed in
    blocks. It is unlike flash memory, which is erased and rewritten at the byte level.
    Flash memory is often used to hold the control code as the BIOS in a computer.
    When EEPROM needs to be erased or rewritten, the flash memory can be written in
    block (rather than byte) sizes, making it easier to update. Flash memory gets
    its name because the microchip is organized so that a section of memory cells
    are erased in a single action or ''flash''. Flash memory is used in digital cell
    phones, digital cameras, and other devices.'
