    # 1.7 BASIC COMPUTER ORGANIZATION


    A computer is an information-processing machine. it can be viewed as a system,
    which consists of a number of inter-related components that work together with
    the aim of converting data into information. This processing is carried out electronically,
    usually with little or no intervention from a human user. To obtain the required
    information, data are entered through input devices. These data are processed
    using the CPU, and then the processed data (known as information) are displayed
    to the users using output devices. All parts (input devices, CPU, and output devices)
    are referred to as the *hardware* of the computer.


    The general perception of people regarding the computer is that it is an "intelligent
    thinking machine." However, this is not true. Every computer needs to tell exactly
    what to do and how to do. This is by giving instructions to the computer. These
    instructions are given in the form of *computer programs*, which constitute the
    software. In Section 1.7.1, we discuss the computer hardware in detail. Computer
    software is discussed in Chapter 3.


