  md: '# Introduction to Computers


    Although processing has become less tedious with the development of computers,
    it is still timeconsuming and expensive job. Also, computer parts require regular
    check-ups and maintenance to give correct results. Furthermore, computers need
    to be installed in a dust-free place. Generally, some parts of computers get heated
    up by heavy processing. Therefore, the ambient temperature of the computer system
    should be maintained.


    # 1.3 EVOLUTION OF COMPUTERS


    The need for a device to perform calculations with growth in commerce and other
    human activities explain the evolution of computers. Having the right tool to
    perform these tasks has always been important for human beings. In their quest
    to develop efficient computing devices, many apparatuses were developed. However,
    many centuries before technology was adequately developed to develop computers.


    In the beginning, when the task was simple counting or adding, people used their
    fingers or pebbles in the sand. To simplify the process of counting, people in
    Asia Minor used a counting device the abacus. This device allowed users to perform
    calculations using a system of sliding beads arranged on a rack. The abacus (Fig.
    1.1) was simple to operate and was used widely for centuries. In fact, it is still
    used in many countries today.


    ![](img/de490c7868193a94130ecb9dbc887c5f_13_0.png)


    Figure 1.1 Abacus


    With the passage of time, many computing devices, such as Napier’s bones and the
    slide rule were invented. It took centuries, for the next significant advancement
    in computing devices. In 1642, a French mathematician, Blaise Pascal, the first
    automatic calculator. This brass rectangular box, also called the pascaline (Fig.
    1.2), used eight movable dials to add sums up to a figure of eight figures.


    ![](img/de490c7868193a94130ecb9dbc887c5f_13_1.png)


    Figure 1.2 Pascaline


    In 1694, German mathematician Gottfried Wilhelm von Leibniz extended the Pascal’s
    design to perform multiplication, division, and to find the square root. This
    machine is known the stepped reckoned. It was the first mass-produced calculating
    device, which was designed to perform multiplication by repeated addition. Its
    predecessor, Leibniz’s mechanical ruler worked through a system of gears and dials.
    The only problem with this device was that it lacked mechanical precision in construction
    and was not robust.


    The real beginnings of computers as we know them, however, with an English mathematics
    professor. Charles Babbage. In 1822, he proposed a machine to perform different
    equations, a difference engine. Powered by steam and as large as a locomotive,
    the machine had a stored program and could perform calculations and print the
    results automatically. However, Babbage never made a fully difference engine,
    and in 1833, he quit working on this machine to concentrate on the analytical
    engine. The basic design of this engine


