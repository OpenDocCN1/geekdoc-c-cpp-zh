    # 6.4 INTERMEDIATE CODE


    We write the C program with statements for any problem definition or application.
    The statements must follow the syntax of the C language. This is the source code
    and is given to the C compiler. The compiler will turn this as a source and translate
    into a syntax tree. This will be done by the compiler''s parser. This translation
    is known to the compiler translator. The programmer is blind about this operation.
    The syntax tree is translated into intermediate code and finally the compiler
    will produce binary information. The source code is converted to machine code
    ultimately after the successful compilation through intermediate code. The machine
    is course of a processor, which can follow the machine code or binary information.


    # 6.5 OBJECT AND EXECUTABLE CODES


    The Turbo C offers the programmer a specially designed editor for programming.
    This editor is suitable for editing/modifying the program. Once a file is created
    in C editor, its extension by default is .c. The user can save a file with the
    name of the file and he/she can add the extension as .c.

    The program user has to compile the program after creating the file in C and editing
    it. In case of errors, the user should go to edit and modify the changes in it
    zero errors are found after compilation. After successful compilation of a C file,
    the compiler produces an object file. For example, open a file in C editor, write
    the code for some problem definition, and save it with some name abc.c The file
    is to be compiled. After successful compilation abc.obj file is generated by the
    compiler. The compiler then links this object file with object code of library
    functions and produces an executable file that contains executable code.\Now using
    only abc executable file we can run the program and see the output on the screen
    of the monitor.'
