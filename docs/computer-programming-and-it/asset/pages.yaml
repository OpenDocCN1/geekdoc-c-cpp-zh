    # 17.6 CALL BY VALUE AND REFERENCE


    There are two ways in which we can pass arguments to the function: (a) call by
    value and (b) call by reference.


    (a) Call by Value In this type, the value of actual arguments is passed to the
    formal arguments and the operation is done on the formal arguments. Any change
    made in the argument does not affect the actual arguments. Any change made because
    formal arguments are photocopies of actual arguments. Hence, when the function
    is called by the call or by value method, it does not affect the actual contents
    of the actual arguments. Changes made in the formal arguments are local to the
    block of the called function. Once control returns back to the calling function
    the changes made vanish. The following example illustrates the use of call by
    value.


