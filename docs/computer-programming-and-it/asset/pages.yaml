    role of ''&'' operator is to indicate the memory location of the variable, so
    that the read value would be placed at that location.

    The scanf() statement also returns values. The return value is exactly equal to
    the number of values correct. In any case of mismatch, error will be shown. Otherwise,
    if the read value is converted to the given format, conversion is made. The following
