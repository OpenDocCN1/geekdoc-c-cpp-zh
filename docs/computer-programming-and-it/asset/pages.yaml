  md: 'included input devices in the form of perforated cards containing operating
    instructions and a "store" for a memory of 1,000 numbers of up to 50 decimal digits
    long. It also contained a control unit (CU) that allowed processing instructions
    in any sequence and output devices to produce printed results. Babbage borrowed
    the use of punch cards to encode the instructions in the Joseph-Marie Jacquard''s
    loom. Although the analytical engine was never constructed, it outlined the basic
    elements of a modern computer.


    In 1889, Herman Hollerith, who worked for the U. Census Bureau, applied the jacquard
    loom to computing. Unlike Babbage''s idea of perforated cards to instruct the
    machine, Hollerith used used cards to store data, which he fed into a machine
    that compiled the mechanical (Fig. 1.3).


    The start of World War II produced a substantial need for computer capacity, especially
    for the military purposes. One success was the Mark I, which was built as a partnership
    between Howard Aiken and IBM in 1944. The electronic calculating machine used
    relays and electromagnetic components to replace mechanical components. In 1946,
    John Eckert and John Mauchly of the Moore of Engineering at the University of
    Pennsylvania developed the Electronic Integrator and Calculator (ENIAC). This
    computer used vacuum tubes to make the internal parts of the computer. It embodied
    all the components and contents of today''s high-speed, electronic digital computers.
    Later, Eckert and Mauchly also proposed the development of the Discrete Variable
    Automatic Computer (EDVAC). It was the first computer to use a store program introduced
    by von Neumann. It also featured conditional transfer of control, that the computer
    could stop any time and resume operations. In 1949, at the Cambridge University,
    a team led by Maurice Wilkes developed the Electronic Delay Storage Automatic
    Calculator (EDSAC), which used mercury delay lines and vacuum tubes for logic.
    The Eckert-Mauchly Corporation manufactured the Universal Automatic Computer (UNIVAC)
    in 1951, and its implementation marked the beginning of computer era.


    ![](img/de490c7868193a94130ecb9dbc887c5f_14_0.png)


    Figure 1.3

    Hollerith Tabulator


    In the 1960s, efforts to develop the fastest possible computer with the greatest
    capacity reached a turning point with the LARC machine, which had an access time
    of less than one microsecond and a capacity of 100,000,000 words. During this
    period, the major computer manufacturers began to offer a range of capabilities
    and prices, as well as accessories, such as card readers, printers, and cathode
    tube displays. During the 1970s, the trend shifted towards a larger range of applications
    for computer systems. During this period, many business organizations adopted
    computers for their offices.


    In the 1980s, Large-Scale Integration (VLSI), in which hundreds of transistors
    were placed on a single chip, became increasingly common. The "shrinking" trend
    continued with the introduction of personal computers (PCs), which were programmable
    machines small enough and inexpensive to be purchased and used by individuals.
    Microprocessors equipped with read-only memory (ROM), which stores constantly,
    unchanging programs, performed an increased number of functions. By the late 1980s,
    some PCs were used by microprocessors, handling 32 bits of data at a time, and
    could process 4,000,000 instructions per second. By the 1990s, PCs have become
    part of everyday life. The trend continued leading to the development of smaller
    and smaller microprocessors with a proportionate increase in processing powers.
    The computer technology continues to experience huge growth. Computer networking,
    e-mail, and e-publishing are just a few of the applications that have grown in
    recent years. Advances in technologies'
