  md: '# 10.4 EXTERNAL VARIABLES


    The variables that are available to all the functions are called external or global
    variables. External variables are declared outside the function body. In both
    external and auto variables are declared with the same name in a program, the
    first priority is given to the auto variable. In this case, external variable
    is hidden. If we declare external variables in the program, there is no need to
    pass these variables to another function. The compiler does not allocate memory
    for these variables. It is already allocated for it in another module where it
    is declared as a global variable.


    The following program illustrates the working of external variables.


    ![](img/de490c7868193a94130ecb9dbc887c5f_264_0.png)


    # Explanation


    In the above program, variable v is declared outside the function body and initialized
    to value 10. Every function can access the variable v, so no re-declaration or
    local variable is created. Every function in turn prints the value of v. The same
    value is printed by all the functions.'
