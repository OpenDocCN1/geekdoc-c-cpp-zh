    # Converting between Octal and Hexadecimal


    The method used for the conversion of an octal number to a hexadecimal number
    is accomplished by the following steps:


    +   1. Convert each octal digit to the 3-bit binary form.

    2. Combine all the 3-bit binary numbers.

    3. Segregate the binary numbers into the 4-bit binary form by starting the first
    number from the right bit (LSB) towards the left bit (MSB).

    4. Finally, convert these 4-bit blocks into their respective hexadecimal symbols.


    # Example 5.11 Determine the hexadecimal equivalent of (2327)$_8$


    | Octal Number | 2 | 3 | 2 | 7 |

    |---|---|---|---||

    | Binary Value | 010 | 011 | 010 | 111 |


    Combining the 3-bit binary blocks, we have 010011010111. Separating the group
    of binary numbers (from the left side) into the 4-bit binary number and by converting
    these blocks into their respective hexadecimal symbols, we have:


    0100 1101 0111

    4 D 7


    Thus, the hexadecimal equivalent of (2327)$_8$ is (4D7)$_{16}$.'
