  md: 'use preferably at the beginning. Preprocessor can reduce the execution time
    of a program because it takes place of a function call.


    One of the most important features of ''C'' language is to offer preprocessor
    directives. The preprocessor directives are always initialised at the beginning
    of the program before the main ( ). It begins with a symbol # (hash). It can be
    placed anywhere often when it is declared at the beginning before the main ( )
    or any particular function. In traditional C language, # (hash) must begin at
    the first column.


    # 11.2 MACRO SUBSTITUTION


    Preprocessor directives as # are used at the beginning of the C program to define
    constants or macro substitution.


    For example, we can use the following format for replacement of constants or some
    other values.


    ```

    #define <macro_ substitution <substitute> PI 3.1414

    ```


    For example, in the preprocessor directive #define PI 3.1414. Instead of writing
    3.1414 in the program, the programmer can take the help of preprocessor to replace
    3.1414 with PI at the beginning of the program.


    Some examples of macro substitutions that can be used in programs are as follows:


    ```

    #define N 15

    #define CLS clears()

    #define MIN (A,B) ((A)<B) ? (A): (B))

    ```


    These macros substitutions are discussed in detail Section 11.3.


    # 11.3 THE #define directive


    The syntax of #define directive is as follows.


    ```

    #define identifier substitute

    ```


    ```

    OR

    ```


    ```

    #define identifier (argument 1... argument N) substitute

    ```


    For Example


    ```

    #define PI 3.14

    ```


    This statement defines PI as macro templates and 3.14 as macro substitute. During
    preprocessing, the preprocessor replaces every occurrence of PI (identifier) with
    3.14 (substitute value). Here, PI is a macro template and 3.14 is its macro expansion.
    The macro templates are generally declared with capital letters for key identification.
    One also define macros with small letters. The macro templates and its expansions
    must be separated with at one blank space. It is not necessary to provide space
    between # and define. It is optional to the programmer. programmer should provide
    space.


    The macro definition should not be terminated with semicolon. The words followed
    by # are not keywords. Programmer can use these words for variable names.


    A few examples are illustrated below for understanding macros.'
