  md: '# Arrays 293


    In the above example, the value of a printed is 4. 2 before assigning 4 to it.
    When we assign 4 to a then the value stored in a is replaced with the new value.
    Hence, ordinary variables are capable of storing one value at a time. This fact
    is same for all the data types. We can assign a value to the variable as under.


    ```

    int x;

    x=4;

    ```


    The variable x is declared with an integer data type, and then two memory locations
    (two bytes) are required to store it and later on a single value can be assigned
    to the variable which is shown in Fig. 12.1. Every variable has name, value and
    memory location. From the above we can say that only one value can be assigned
    to a variable.


    In many applications the variables must be assigned to more than one value. This
    can be obtained with the help of arrays. Array variables are able to store more
    than one value at a time. Declaration of an array is done as follows.


    ```

    int a[5];

    ```


    It tells the compiler that a is an integer type and can store 5 integers. The
    compiler reserves 2 bytes of memory for each integer array element.

    In the same way array of different data types can be declared as follows.


    ```

    char ch[10];nfloat real[10];nlong num[5];

    ```


    # 12.2 ARRAY INITIALIZATION


    Array initialization is done as given below.


    ```

    int a[5]={1,2,3,4,5};

    ```


    Here, 5 elements are stored in an array a. The array elements are stored sequentially
    in separate locations. Then the question arises how to call each element from
    this bunch of integer elements.

    Reading of array elements begins from 0.

    Array elements are called by array names the following numbers. The given Table
    12.1 explains the same.


    | Table 12.1 Calling Array Elements |

    |---|---|

