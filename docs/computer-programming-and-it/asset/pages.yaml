    | 6 | 0110 | 006 ($6 \times 8^3$) |

    | 7 | 0111 | 007 ($7 \times 8^3$) |

    | 8 | 1000 | 010 ($1 \times 8^3 + 0 \times 8^3$) |

    | 9 | 1001 | 011 ($1 \times 8^3 + 1 \times 8^3$) |


    # Hexadecimal Number System


    The hexadecimal system is similar to the decimal, binary, and octal number systems,
    except that the base is 16. Each hexadecimal number represents a power of 16.
    To represent the decimal numbers, this system uses 0–9 and A–F characters to represent
    10–15, respectively. The largest hexadecimal digit F is equivalent to binary 1111.'
