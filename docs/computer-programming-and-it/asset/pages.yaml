    an output and then terminates. In algorithm, after a finite number of steps, solution
    of the problem is achieved. Algorithms can have steps that repeat (iterate) or
    require decisions (logic and comparison) until the task is completed.


    Different algorithms may accomplish the same task, with a different set of instructions,
    in more or less the same time, space, and efforts. For example, two different
    recipes for preparing tea, while "boiling the water" and "after boiling the water"
    produce the same result. However, performing an algorithm does not guarantee a
    solution, if the algorithm is flawed or not appropriate to the context. For example,
    preparing the tea algorithm will fail if there are no leaves even if all the motions
    of preparing the tea were performed as if we use algorithms in our daily life.
    For example, to determine the largest number of three numbers A, B, and C, the
    following algorithm may be used.


    | POINTS TO REMEMBER |

    | Properties of Algorithm |


    Algorithms are not computer programs, as they cannot be executed by a computer.
    The properties of Algorithms are:


    +   1. There must be no ambiguity in any instruction.

    2. There should not be any uncertainty about which instruction is to executed
    next.

    3. The algorithm should conclude after a finite number of steps. An algorithm
    cannot be open-ended.

    4. The algorithm must be general enough to deal with any contingency.


    +   **Step 1:** Start

    **Step 2:** Read three numbers A, B, C

    **Step 3:** Find the larger number between A and B and store it in MAX_AB

    **Step 4:** Find the larger number between MAX_AB and store it in MAX

    **Step 5:** Display MAX

    **Step 6:** Stop


    The above-mentioned algorithm terminates after six steps. This explains the feature
    of finiteness. Every action of the algorithm is precisely defined; there is no
    scope for ambiguity. The solution is properly designed, only the job left is to
    code that logic into a programming language. For developing an effective algorithm,
    flowcharts and pseudocode are used by programmers. They are further expressed
    in programming languages to develop computer programs.


    # 4.2.2 Flowchart


    A flowchart is a pictorial representation of an algorithm in which the steps are
    drawn in different form of boxes and the logical flow is indicated by interconnecting
    arrows. The boxes represent operations and the arrows represent the sequence in
    which the operations are implemented. The primary purpose of the flowchart is
    to help the programmer understand the logic of the program. Therefore, it is not
    necessary to include all the required steps in detail. Flowcharts outline the
    general procedure; since they provide an alternative, visual representation of
    the information flow in a program, programmers often find them very valuable.


    Flowcharts can be compared with the blueprint of a building. Just as an architect
    draws a blueprint before starting the construction of a building, a programmer
    draws a flowchart before writing a computer program. In the case of drawing a
    blueprint, the flowchart is drawn to defined rules and using standard symbols
    prescribed by American National Standard Institute (ANSI). Some standard symbols
    that are frequently required for flowcharts are shown in Table 4.1.'
