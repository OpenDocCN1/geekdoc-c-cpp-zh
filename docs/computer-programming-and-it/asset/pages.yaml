  md: "# # Chapter 12 Arrays\n\n## CHAPTER OUTLINE\n\n| 12.1 Introduction | 12.7 Two-Dimensional\
    \ Array |\n| 12.2 Array Initialization | 12.8 Three- or Multi-Dimensional Arrays\
    \ |\n| 12.3 Definition of an Array | 12.9 The scanf() and sprint() Functions |\n\
    | 12.4 Characteristics of an Array | |\n| 12.5 One-Dimensional Array | 12.10 Operations\
    \ with Arrays |\n| 12.6 Predefined Streams | |\n\n12.1 INTRODUCTION\nArray is\
    \ a very popular and useful data structure used to store data elements in successive\
    \ memory locations. It is a linear and homogeneous data structure. It means similar\
    \ data types are stored contiguously in memory and that too under one variable.\
    \ A variable stores only one value at a time. In order to store value in the variable\
    \ earlier data must be removed. Drawback with a variable can be followed from\
    \ the following example.\n\nConsider the following example.\n\n```\nvoid main())\n\
    {\n    int a=2;\n    a=4;\n    printf(\"%d\",a);\n}\nOUTPUT: 4\n```"
