  md: '# Input, Output, and Control Loop Statements


    # 9.12 WHAT IS A PROGRAM LOOP?


    A program loop is defined as a block of statements, which are frequently executed
    for certain number of times even though these statements come into view once in
    a program. This loop is also known as iterative structure or repetitive structure.


    The C language supports three types of control loop structures and their syntaxes
    are described in Table 9.6.


    Table 9.6 Loops in C


    | for | while | do-while |

    | --- | --- | --- |

    | for(expression-1; | expression-1; | expression-1: |

    | expression-2; | while(expression-2) | do |

    | expression-3) | { | statement: |

    | | statement | expression: |

    | | expression-3; | expression-3: |

    | | } | while(expression-2); |


    The for loop statement comprises three actions. The three actions are placed in
    the for statement itself. The three actions initialize counter, test condition
    and re-evaluation parameters are included in one statement. The expressions are
    separated by semicolons (;).


    The for statement is equivalent to while and do-while statement. The only difference
    between for and do-while is that in the former, the logical condition is tested
    first and then the body of the loop is executed, whereas in the latter case it
    is performed after body of the loop.


    Thus, in the for and while loop, the test is always performed at the beginning
    of the loop. The for and while loop fall under pre-test type. Whereas the do-while
    loop falls under post-test type. The do-while loop executes the body of the loop
    at least once regardless of the condition.


    The body of the loop may not be executed at all times if the condition fails at
    the beginning. For example, the following two statements, test condition is not
    proper at the beginning and hence no execution of statements.


    # 9.13 for LOOP


    The for loop allows to execute a set of instructions until a certain condition
    is satisfied. Condition may be pre-defined or open-ended. The general syntax of
    the for loop will be seen in Figures 9.10, 9.11 and 9.12.


    # Explanation


    The for statement contains three expressions which are separated by semicolons.
    Following actions are to be performed in three expressions.


    The initialize counter sets a loop to an initial value. The statement is executed
    only once.


    The test condition is a relational expression that determines the number of iterations
    desired or it determines to exit the loop. The for loop continues to execute as
    long as conditional test is satisfied.'
