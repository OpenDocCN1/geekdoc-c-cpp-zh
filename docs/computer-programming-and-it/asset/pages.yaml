    #  5.1.1 Types of Number System


    Generally, a user is least aware of that actual operations in a computer are performed
    with a binary number system. Traditionally, the two possible states of a binary
    system are represented by the digits ''0'' and ''1''. Before the introduction
    of octal and hexadecimal numbers, programmers used a method of handling large
    numbers in 3-bit or 4-bit groupings. The actual machine code for the computer
    was replaced by mnemonics, which consist of three or four letters of the assembly
    language for a particular CPU. It was also possible to use more than one notation
    for writing data in these assembly languages, so programmers made sure theirs
    could understand octal, hexadecimal, and binary numbers. Octal and hexadecimal
    numbers being convenient to humans to be used in computational tasks, since the
    computer only understands binary and octal and hexadecimal are much more complex
    than binary. In addition, octal and hexadecimal numbers prevented unevenly shifts
    that were written in binary. For example, the three-decimal number 513 requires
    10 digits in pure binary (1000000001) but only three (201) in hexadecimal (Table
    5.1).


    # Binary Number System


    The digital computer provides accurate solutions to the problems by performing
    arithmetic operations. Computers are not expressed as decimal numbers within the
    computer because it is not suitable for machine processes. Computers are not powered
    by electricity but they compute electricity. This shift voltage pulses operate
    internally. When numbers are represented in a computer''s memory by means of tiny
    electrical circuits, a system with only two symbols is used. These symbols are
    1 or 0 states of the circuit. This system of representing numbers is known as
    the binary number system. Digital circuits can use one of the methods of defining
    1 and 0. A specific range of current or voltage or phase of the waves can be taken
    as state 1. Another range and state can be taken as 0. A circuit that allows few
    microflows to be taken as state 0 and negligible current can be taken as state
    1 (voltage across a resistor is inversely related to current). A computer is made
    of large number of transistors and has only two states, 1 and 0. Similar to the
    decimal system, the position of a digit in a number indicates its value. Instead
    of tens, hundreds, hundreds, thousands, etc., as in the decimal system, the numbers
    in the binary system contains two, twos, fours, eights, etc. Each additional column
    to the left has powers of 2, specifically, each place in the number represents
    two times (× s) the place to its right. Table 5.2 represents the first ten binary
    numbers.


    # Table 5.2 Representing Decimal Numbers 0 to 9 in Binary


    | Decimal Numbers | 2⁴ | 2³ | 2² | 2¹ | 2⁰ |

    | --- | --- | --- | --- | --- | --- |

    | | 16 | 8 | 4 | 2 | 1 |

    | 0 | | | | | 0 |

    | 1 | | | | | 1 |'
