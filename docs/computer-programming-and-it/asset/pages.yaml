    is a small digital computer, whose process and storage capacity is less than that
    of a mainframe, but not that of a micro computer. A mainframe is an ultra high-performance
    computer made for high-volume, processor-intensive computing. It is mainly used
    for large volumes of data processing, high-performance online transaction processing
    systems, and extensive data storage and retrieval.

