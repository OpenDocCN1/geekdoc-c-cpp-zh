    # 18.4 STRING STANDARD FUNCTIONS


    Table 18.3 Standard C String Library Functions:


    | Functions | Description |

    | --- | --- |

    | strlen() | Determines the length of a string. |

    | strcpy() | Copies a string from source to destination. |

    | strncpy() | Copies characters of one string to another up to the specified length.
    |

    | strncmp() | Compares characters of two strings (Function does not discriminate
    between small and capital letters). |

    | strcmp() | Compares two strings (Function discriminate between small and capital
    letters). |

    | strncmp() | Compares characters of two strings up to the specified length. |

    | strnicmp() | Compares characters of two strings up to the specified length.
    Ignores case. |

    | strlwr() | Converts uppercase characters of a string to lowercase. |

    | strstrpr() | Converts lowercase characters of a string to uppercase. |

    | strdup() | Duplicates a string. |

    | strchr() | Determines the first occurrence of a given character in a string.
    |

    | strrchr() | Determines the last occurrence of a given character in a string.
    |

    |strstr() | Determines the first occurrence of a given string in another string.
    |

    | strcat() | Appends source string to destination string. |

    | strncat() | Appends source string to destination string up to the specified
    length. |

    | strrev() | Reverses all characters of a string. |

    | strset() | Sets all characters of a string with a given argument or symbol.
    |

    | strnset() | Sets specified number of characters of a string with a given argument
    or symbol. |

    | strspn() | Finds up to what length two strings are identical. |

    | strpbrk() | Searches the first occurrence of the character in a given string
    and then displays the string starting from that character. |'
