- img_proc: true
  md: 'Dynamic RAM (DRAM): It is named so because it is very unstable. The data continues
    to move in and out of the memory as long as power is available. Unlike SRAM, DRAM
    must be continually refreshed in order to maintain the data. This is done by placing
    the memory on a refresh circuit that rewrites the data hundreds times per second.
    DRAM is used for most system memory because it is cheap and small.


    The difference between SRAM and DRAM is the life of the data they store. SRAM
    retains its contents as long as power is turned off, its contents are lost. On
    the other hand, DRAM must be continually refreshed after about 15 microseconds.
    This is true even when power is supplied constantly. SRAM chips are not as dense
    as DRAM chips, so that, the total number of cells in the SRAM chip is far less
    than on DRAM chip. DRAM is beneficial because it is fast, has low latencythe time
    lag between a request and the action performed), and does not need to be refreshed.
    However, it is large and expensive, requires more power to operate, and produces
    a lot of heat. DRAM is simple, small and space efficient. It may be slower and
    have a longer latency than SRAM, but it is still very useful. Typical access time
    of SRAM is 25 nanoseconds while that of DRAM is 60 nanoseconds.


    SRAM is useful for low amount of memory. Anything over 4 MB is bulky, SRAM is
    good for internal memory in processors, and cache is best for system''s main memory.
    DRAM is used with its small size and power efficiency compared to SRAM. SRAM is
    less than DRAM (few bits per unit area) and, therefore, not suitable for high-capacity,
    low-cost-per-megabyte applications. The power consumption of SRAM varies widely
    depending on its speed. Fast SRAM is much more power-hungry than DRAM and some
    ICs can consume power of the order of a watt at fast speed.


    Slow SRAM can have very low consumption in the region of a microwat. Currently,
    the technology does not exist to produce slow SRAMs so that they replace DRAMs.
    Thus, DRAM is used in computers.


    # 2.4 READ ONLY MEMORY (ROM)


    Just as a human being needs instructions from the brain to perform actions in
    certain event, a computer also needs special instructions every time it is started.
    This is required during the start operation, the main memory of the computer is
    empty due to its volatile property so there has to be some instructions (special
    boot programs) stored in a special chip that could enable computer system to start
    up operations and transfer to the operating system. This special chip, where the
    start instructions are stored, is called ROM. It is non-volatile, in that, its
    contents are not lost when the power is switched off. The data and instructions
    are stored in ROM only can be read but cannot be altered by making ROM much safer
    and than RAM. ROM chips are used not only in the computer but also in other electronic
    items like microwave and microwave.


    Generally, designers program ROM at the time of manufacturing circuits. Appropriate
    electronic fuses to form patterns of binary information during programming. These
    patterns of binary information are meant for specific configurations, that is
    why different categories of computers are meant for performing tasks. For example,
    a micro program system boot program contains a series of start-up instructions
    to check the hardware, that is, I/O devices, memory, and operating system in the
    memory. These programs deal with low-level machine functions and are alternate
    for hardware requirement.'
