  md: '# 7.10 DECLARING VARIABLES


    The declaration of variables should be done in the declaration part of the program.
    The variables must be declared before they are used in the program. Declaration
    provides two things: (1) Compiler obtains the variable name and (2) It tells the
    compiler about the data type of the variable being declared and helps in allocating
    the memory. The syntax of declaring a variable is as follows:


    # Syntax


    ```

    Data_type variable_name;

    ```


    Example:


    ```

    int age;

    char m;

    float s;

    double k;

    int a,b,c;

    ```


    The int, char, float, and double are keywords to represent data types. Commas
    separate the variables, if variables are more than one. Table 7.10 shows various
    data types and their keywords used in C.


    Table 7.10 Data Types and Their Keywords


    | Data Types | Keyword |

    |---|---|

    | Character | char |

    | Signed character | signed char |

    | Unsigned character | unsigned char |

    | Integer | int |

    | Signed integer | signed int |

    | Unsigned integer | unsigned int |

    | Unsigned short integer | unsigned short int |

    | Signed long integer | signed long int |

    | Unsigned long integer | unsigned long int |

    | Floating point | float |

    | Double floating point | double |

    | Extended double floating point | long double |


    # 7.11 INITIALIZING VARIABLES


    Variables can be assigned or initialized using an assignment operator ''=''. The
    declaration and initialization can also be done in the same line.


    # Syntax


    ```

    variable_name = constant;

    or data_type;

    ```


    ```

    variable_name = constant;

    ```'
