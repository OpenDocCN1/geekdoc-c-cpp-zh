    # ## 1.1 INTRODUCTION


    At the beginning of civilization, people used fingers and pebbles for computing
    purposes. In fact, the word digitus in Latin actually means finger and calculus
    means pebble. This gives us a clue to the origin of early computing concepts.
    With the development of civilization, computing needs also grew. The need for
    a mechanism to perform lengthy calculations led to the invention of the calculator
    and then computers.


    The term computer is derived from the word compute, which means to calculate.
    A computer is an electronic machine used for performing calculations and controlling
    operations that can be expressed either in or numerical terms. In simple words,
    a computer is an electronic device that performs diverse operations using instructions
    to process the information in order to achieve the desired results. The application
    of a computer depends totally on human creativity and imagination, it covers a
    huge area of applications including education, industries, government, medicine,
    scientific research, law, and even music arts.'
