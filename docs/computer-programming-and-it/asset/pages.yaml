    # 11.10 THE #line DIRECTIVE


    In order to renumber the source text, this directive is used. The syntax of line
    directive is as follows.

    **#line <constant> [<identifier]>


    Causes the compiler to renumber the line number of the next source line as given
    by <constant> and <identifier> gives the current input file. If <identifier> is
    absent, then the current file name remains unchanged.


    **Example:** #line 15 pragma.c


    # 11.11 THE #inline DIRECTIVE


    It reports the compiler that the source code has line asm statements. It is important
    to know previously that the source code contains assembly code.


    # 11.12 THE #pragma SAVEREGS


    It guarantees that a function will not modify the value of any of the registers
    when it is entered. Place this directive immediately prior to function definition.


    # 11.13 THE #pragma DIRECTIVE


    The ANSI-C and TURBO-C provide pragma directives. These #pragma directives are
    defined with # (hash) and are the preprocessor directives. These directives deal
    with formatting source list and listing components in the object file generated
    by the compiler. It sets/resets warning and errors during compilation of C program.
    When a program is compiled, the compiler throws errors and warnings. The programmer
    should see the errors rather than the warnings. After removal of errors, the programmer
    can turn on warnings and take further steps for sorting warnings. **Tables 11.1–11.4**
    describe the different pragma names with error messages.'
