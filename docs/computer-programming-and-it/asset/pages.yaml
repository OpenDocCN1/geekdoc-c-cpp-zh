    # ## 10.1 INTRODUCTION


    The variables declared in C programs are totally different from other languages.
    We can use the same variable names in the C program in separate blocks. When we
    declare a variable, it is available only to specific part or block of the program.
    Remaining block or other function cannot access to the variable. The area or block
    of the C program from where the variable can be accessed as the *Scope of variable*.
    The area or scope of the variable depends on its storage class, that is, where
    and how it is declared. There are four scope variables:


    +   - Function

    - File

    - Block

    - Function prototype


    The storage class of a variable tells the compiler


    +   - Storage area of the variable

    - Initial value of variable if not initialized

    - Scope of the variable

    - Life of the variable, that is, how long the variable would be active in the
    program'
