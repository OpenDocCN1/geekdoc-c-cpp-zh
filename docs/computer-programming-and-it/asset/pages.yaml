    # Development of a Program


    A program is a set of instructions that instructs a computer how to perform a
    specific task. It is written in a high-level language that can be implemented
    on a number of different processors. A collection of programs can be compared
    to a recipe book, where each recipe is assumed as a program. Every recipe has
    a list of ingredients (fixed data) and a list of instructions detailing exactly
    what to do with those ingredients. When you follow a recipe, you are actually
    executing a program.


    To perform a task using a program, a programmer has to consider various inputs
    of the program along with the process, which is required to convert the input
    into desired output. Suppose we want to calculate the sum of two numbers, A and
    B, and store the sum in C, here A and B are the inputs, and C is the output of
    the program.


    # 4.2 PROBLEM-SOLVING TECHNIQUES


    Problem-solving is a set of techniques and graphical tools that help in providing
    logic for solving a problem. In other words, these tools are used to express the
    logic of the problem by specifying the correct sequence of instructions to be
    carried out. Following sections discuss the various problem-solving tools, which
    are algorithms, flowcharts, and pseudodes. These tools are usually used in the
    design phase of the program development cycle.


    # 4.2.1 Algorithms


    Algorithms are one of the most basic tools that are used to develop the problem-solving
    logic. An algorithm is defined as a finite sequence of explicit instructions,
    when provided with a set of input values, produces'
