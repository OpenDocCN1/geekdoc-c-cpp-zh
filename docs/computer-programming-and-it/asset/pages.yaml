    \ Functions\n\nThe C language supports two types of functions: 1) library functions\
    \ 2) user-defined functions. The library functions are predefined sets of functions.\
    \ Their task is limited. A user cannot understand the internal working of these\
    \ functions. The user can only use the functions but cannot change or modify them.\
    \ For example, sqrt (81) gives the result 9. Here, the user needs not worry about\
    \ its source code, but the result should be provided by the function.\n\nThe user-defined\
    \ functions are defined by the user according to his/her requirement are called\
    \ user-defined functions. The user can modify the function according the requirement.\
    \ The user understands the internal working of the function and has full scope\
    \ to implement his/her ideas in the function. Thus, the set of such user-defined\
    \ functions can be useful to another programmer. One should include the file in\
    \ which the user-defined functions are stored to call the function in the program.\
    \ For example, square (9) is a user-defined function that gives the result 81.\
    \ Here, the user knows the internal working of the square ( ) function, as its\
    \ source code is visible. This is the major difference between the two types of\
    \ functions.\n\n# 17.2 DEFINITION OF FUNCTION\n\nA function is a self-contained\
    \ block or a subgraph of one or more statements that performs a task when called.\n\
    \n# a) Why Use Functions?\n\n+   1. If we want to perform a task repetitively\
    \ then it is not necessary to rewrite the particular block of the program again\
    \ and again. The particular block of statements can be shifted in a user-defined\
    \ function. The function can be used any number of times to perform the task.\n\
    2. Using functions, large programs can be reduced to smaller ones. It is easy\
    \ to debug and find out the errors in it. It also increases readability.\n\n#\
    \ b) How Function Works?\n\n+   1. Once a function is defined and called, it takes\
    \ some data from the calling function and returns a value to the called function.\n\
    2. The details of the internal working of a function are unknown to the rest of\
    \ the program. Whenever a function is called, the control passes to the called\
    \ function and working of the calling function is stopped. When the execution\
    \ of the called function is completed, the control returns to the calling function\
    \ and executes the next statement.\n3. The values of actual arguments passed by\
    \ the calling function are returned by the formal arguments of the called function.\
    \ The number of actual and formal arguments should be the same. Extra arguments\
    \ are discarded if they are defined. If the formal arguments are more than the\
    \ actual arguments, then the extra arguments appear as garbage. Any mismatch in\
    \ data type may produce an unexpected result.\n4. The function operates on formal\
    \ arguments and sends back the result to the calling function. The return statement\
    \ performs this task."
