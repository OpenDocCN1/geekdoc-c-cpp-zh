    A processor or a microprocessor is a digital electronic component that comprises
    several transistors on a single integrated circuit (IC). It integrates all the
    functions of the central processing unit (CPU) including arithmetic and logical
    functions, data storage and control functions. Thus, it can be considered as the
    brain of'
