    # SUMMARY


    +   1. Computer memory refers to the electronic holding place for instructions
    and data where the processor can reach quickly.

    2. Various units that are used to measure computer memory are bit, byte, kilobyte,
    megabyte, gigabyte, and terabyte.

    3. Computer''s memory can be defined into three fundamental types: internal processor,
    primary memory, and secondary memory.

    4. Internal processor is placed within the CPU (processor) and usually includes
    cache memory and special registers, both of which can be directly accessed by
    the processor. This memory is used for temporary storage of data and instructions
    on which the CPU is currently working.

    5. Primary memory consists of RAM (Random Access Memory), which is volatile in
    nature, and ROM (Read Only Memory), which is non-volatile in nature.

    6. RAM also called main memory allows the computer to store data for immediate
    manipulation and keep track of what is currently being processed. It is the place
    in a computer where the operating system, application programs, and data in use
    are kept so that they can be accessed quickly by the computer''s processor.

