    # 5.13 ODD PARITY AND EVEN PARITY GENERATORS


    Sometimes the parity of a set of bit for a number is important. Figure 5.5(a)
    and 5.5(b) show the even and odd parity flag (OPF and EPP) circuit. When the bits
    transmit from one source to another, the generated parity is compared with the
    expected parity from the bits received from the source. If both are same, it is
    presumed that there is no error. Parity check is successful when only one bit
    is in error. When two bits have error, the check is not successful. However, the
    chances of two errors are much smaller than the chance of a single error.


