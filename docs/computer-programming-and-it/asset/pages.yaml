    # ## 2.1 INTRODUCTION


    Computers are used to perform various tasks in science, engineering, business,
    education, entertainment, and many other fields. They work at high speed, can
    handle large volumes of data with great accuracy, and have the ability to carry
    out a specified sequence of operations without human intervention. The CPU handles
    the processing of data and after processing, presents the results with the help
    of output devices. However, the CPU requires memory to process the data, hold
    the intermediate results, and to store the output. Computer memory'
  merge: -1
