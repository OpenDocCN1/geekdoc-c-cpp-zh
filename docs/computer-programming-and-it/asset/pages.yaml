  md: "# 15.6 POINTER TO STRUCTURE\n\nWe know that a pointer is a variable that holds\
    \ the address of another data variable. The variable may be of any data type,\
    \ that is, **int, float or double**. In the same way, we can also define pointer\
    \ to structure. here addressing the member variables can be accessed. Thus such\
    \ pointers are called structure pointers.\n\nFor example\n\n```\nstruct book\n\
    {\n  char name [25];\n  char author [25];\n  int pages;\n};\nstruct book *ptr;\n\
    ```\n\nIn the above example, **\\*ptr** is pointer to structure book. The syntax\
    \ for using pointer with member is as given below.\n\n+   1. ptr->name 2. ptr->author\
    \ 3. ptr->pages.\n\nBy executing these three statements addressing address of\
    \ each member can be deciphered. The following programs illustrate the use of\
    \ pointer to structure.\n\n![](img/de490c7868193a94130ecb9dbc887c5f_381_0.png)\n\
