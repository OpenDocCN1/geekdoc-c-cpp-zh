- img_proc: true
  md: '# Computer Programming and IT


    +   **Internal Processor Memory:** This memory is placed within the CPU (processor)
    or is attached to a special fast bus. Internal memory usually includes cache memory
    and special registers, both of which are directly accessed by the processor. This
    memory is used for temporary storage of data and instructions on which the CPU
    is currently working. Processor memory is the fastest among all the memories but
    is the most expensive also. Therefore, a very diminutive part of internal memory
    is used in the computer system. It is generally used to compensate for the speed
    gap between the primary memory and the processor.


    +   **Primary Memory:** Random Access Memory (RAM) and Read Only Memory (ROM)
    fall under the category of primary memory, also every comes with a small amount
    of ROM, which contains the boots firmware (BIOS). This holds enough information
    to enable the computer to check its hardware and load its operating system into
    RAM at the time of booting. RAM is the place where the computer temporarily stores
    its operating system, application programs, and current data so that the computer''s
    processor can reach them quickly and easily. It is volatile in nature, that is,
    when the power is switched off, the data in memory is lost. Unlike RAM, ROM is
    non-volatile. Even when the computer is switched off, the contents of ROM remain
    available.


    +   **Secondary Memory:** As auxiliary memory, secondary memory provides backup
    storage for instructions (computer programs) and data. The most commonly used
    secondary storage devices are magnetic disk and magnetic tapes. These are the
    least expensive as have much larger storage capacity than primary memory. The
    instructions and data stored on secondary storage devices are permanent in nature.
    They can only be removed if the user wants to or if the device is destroyed. Secondary
    memory can also be used as overflow memory (also known as virtual memory), when
    the capacity of memory is surpassed. Note that unlike processor memory and main
    memory, secondary memory is not directly accessible to the processor. First, the
    data and instructions from secondary memory must be shifted to main memory and
    then to the processor.


    ![](img/de490c7868193a94130ecb9dbc887c5f_34_0.png)


    Figure 2.1 Memory Hierarchy


    Figure 2.1 illustrates the memory hierarchy. The CPU accesses memory according
    to a distinct hierarchy. When the data comes from permanent storage (for example,
    hard disk), firstly it goes in RAM. The reason behind it is if the CPU has access
    to the hard disk constantly retrieve every piece of required data, it would operate
    very slowly. When the data is kept in primary memory, the CPU can access it more
    quickly. Subsequently, the CPU stores the required pieces of data and instructions
    in processor memory (cache and registers) to process the data.'
