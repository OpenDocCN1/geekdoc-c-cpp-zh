    spindle. Special electromagnetic read/write heads are mounted on sliders and are
    used to either record data onto the disk or read data from it. The sliders are
    mounted onto arms, which are mechanically connected into a single assembly and
    positioned over the surface of the disk by a device called actuator. Each platter
    has two heads, one on the top of the platter and one on the bottom, so a hard
    disk with three platters would have six surfaces and six heads.


