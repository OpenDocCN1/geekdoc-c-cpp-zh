  md: '# Computer Programming and IT


    Computers are one of the most influential computing devices available in modern
    times. Harnessing the power of computers compensates for relatively limited and
    fall human capacities with regard to memory, logical decision-making, reaction,
    and perfection to be extended to almost infinite levels. Millions of calculations
    can be done in a fraction of time and difficult decisions can be made with unerring
    accuracy at pitiful cost. Computers are widely seen as a device for future progress
    and as a tool to achieve sustainability by improved access to information, through
    video conferencing and e-mail. Indeed, computers have left an indelible mark on
    modern civilization that we call this era as the "information age."


    # 1.2 CHARACTERISTICS OF COMPUTERS


    The human race developed computers so that they could perform intricate operations,
    such as calculation and data processing, or simply for entertainment. Today, much
    of the world''s infrastructure depends on computers and it has changed our lives,
    mostly for the better. Let us discuss the characteristics of computers, which
    make them an essential part of every emerging technology and a desirable tool
    in human development.


    +   * **Speed**: Computers process data at an extremely fast rate—millions of
    instructions per second. In a few seconds, a computer can perform a complex task
    that a normal human might take days or years to complete. The speed of a computer
    is measured in megahertz (MHz), that is, one million instructions per second.
    A powerful computer can perform billions of operations in just 1 second.

    * **Accuracy**: Besides efficiency, computers are accurate as well. The level
    of accuracy depends on the instructions and the type of machine being used. Since
    a computer is capable of doing only what it is instructed to do, faulty instructions
    for data processing may lead to faulty results. This is known as Garbage In Garbage
    Out (GIGO).

    * **Diligence**: A computer, being a machine, does not suffer from tiredness and
    lack of concentration. If 4 million calculations are to be performed, the computer
    will perform the last million with the same accuracy and speed as the first.

    * **Reliability**: Reliability, is the measurement of performance of a computer,
    which is measured against some predetermined standard for operation without any
    failure. The major reason for reliability of the computers is, at the hardware
    level, it does not require any human intervention between its processing operations.
    Moreover, computers have built-diagnostic capabilities, which help in continuous
    monitoring of the system.

    * **Storage Capability**: Computers can store large amounts of data and recall
    the information almost instantaneously. The main memory of the computer is relatively
    small and it can hold only a small amount of information; the data are stored
    on secondary storage devices, such as magnetic tapes or disks. Some sections of
    the data can be accessed very quickly and brought into the storage devices and
    when required for processing.

    * **Versatility**: Computers are quite versatile in nature. They can perform multiple
    tasks simultaneously with great ease. For example, one moment, they can be used
    to draft a letter, another moment they can be used to play music and in between,
    they can be used to print a document as well. All this work is possible by changing
    the program (computer instructions).

    * **Resource Sharing**: In the initial stages of development, computers used to
    be isolated machines. With the tremendous growth in computer technologies, computers
    today have the capability to connect with each other. This has made the sharing
    of costly resources possible. Apart from device sharing, data and information
    can also be shared among groups of computers, creating a large information and
    knowledge base.'
  merge: -1
