    # Explanation


    The string elements can be initialized individually by enclosing in single quote
    and curly braces. The curly braces are optional. While initializing individual
    elements, they must be separated by a comma. This is done in the first and the
    third declaration statements. Also, it can be initialized with double quotation
    marks and this is done in the second statement.


    # 18.3 DISPLAY OF STRINGS WITH DIFFERENT FORMATS


    The printf() function is used for displaying the various data types. The printf()
    function with %s format specifier is used for displaying the string on the screen.
    Various formats are shown in Table 18.2.


    Table 18.2 String Formats with Different Precision

    | Sr. No. | Statement | Output |

    | 1. | printf("%s\n",text); | PRABAKAR |

    | 2. | printf("%5s\n",text); | PRABH |

    | 3. | printf("%8s\n",text); | PRABHAKA |

    | 4. | printf("%15s\n",text); | PRABAKAR |

    | 5. | printf("%10s\n",text); | PRAB |

    | 6. | printf("%11s\n",text); | PRABAKAR |


    where, the text ''PRABAKAR'' and array char[15] = "PRABAKAR";


    +   1. The first statement displays the output ''PRABAKAR''. The entire string
    can be displayed with the first statement.

    2. We can also specify the precision with a format string. The precision (number
    of characters to be displayed) is provided after the decimal point. Consider the
    2nd statement in the table above (the first five characters are displayed). Here
    the integer value 5 on the right side of the decimal point specifies the five
    characters to be displayed.

    3. In the 3rd statement, the first eight characters are displayed, while statement
    4 displays the entire string.

    4. The 5th statement with sign (% -10.4s), displays the string with left justified.

    5. When the field length is less than the length of the string, the entire string
    is printed. When it is greater than the length of the string, blank spaces are
    initially followed by the string. This effect can be seen in the 6th statement.

    6. When the number of characters to be displayed is specified as zero after decimal
    point, nothing will be displayed.'
