  md: '# 7.9 DATA TYPES


    All compilers support a variety of data types. This enables the programmer to
    select the appropriate data type according to the need of the application. Generally,
    data is represented using numbers or characters. The numbers may be integers or
    real. The C compiler supports different data types, which are explained here under.


    # 7.9.1 Integer Data Types


    (a) Integer - short and long All C compilers offer short or long integer data
    types. Short integers require half the space of the memory than the long ones.
    A brief description of them is given in Table 7.5.


    Table 7.5 Difference Between Short and Long Integers


    | Short Integer | Long Integer |

    |---|---|

    | Occupies 2 bytes of memory | Occupies 4 bytes of memory |

    | Range:-32,768 to 32,767 | Range:-2147483648 to 2147483647 |

    | Program runs faster. | Program runs slower. |

    | Format specifier is %d or %i. | Format specifier is %ld. |

    | Example int a=2; short int b=2; | Example: long b; long int c; |

    | When a variable is declared without a short or long keyword, the default is-signed
    int. | |


    (b) Integers - signed and unsigned The difference between signed and unsigned
    integers is given in Table 7.6.


    Table 7.6 Difference Between Signed and Unsigned Integers


    | Signed Integer | Unsigned Integer |

    |---|---|

    | Occupies 2 bytes of memory | Occupies 2 bytes of memory |

    | Range:-32,768 to 32,767 | Range:-0 to 65535 |

    | Format specifier is %d or %i. | Format specifier is %u. |

    | By default, signed int is short-signed. | By default, unsigned int is short-unsigned.
    |

    | There are also long-signed integers ranging from -2147483648 to 2147483647.
    | There are also long-unsigned integers with range 0 to 4294967295. |

    | Example: int a=2; long int b=2; | Example:unsigned long b; unsigned int c; When
    a variable is declared as unsigned the negative range of the data type is transferred
    to positive, i.e., double the largest size of the possible value. This is because
    declaring unsigned int; the 16th bit is free and not used to store the sign of
    the number.'
