  md: "The #ifdef preprocessor tests whether the identifier has defined substitute\
    \ text or not. If the identifier is defined\nt#if block is compiled and executed.\
    \ The compiler ignores #else even if errors are intentionally made.\nError messages\
    \ will not be displayed. If identifier is not defined then #else block is compiled\
    \ and executed.\n\n# Example 11.7 Write a program to use conditional compilation\
    \ statement as to whether\nt identifier is defined or not.\n\n```\n#define LINE\
    \ 1\nvoid main()\n{\n    clrscr();\n    #ifdef LINE\n    printf(\"This is line\
    \ number one.\");\n    #else\n    printf(\"This is line number two.\");\n    #endif\n\
    \    getch();\n}\n```\n\nOUTPUT:\nThis is line number one.\n\n# Explanation\n\n\
    In the above program #ifdef checks whether the LINE identifier is defined or not.\
    \ If defined #if block\nis executed. On execution of the program is \"This is\
    \ line number one\". In case\nthe identifier is undefined the #else block is executed\
    \ and output is \"This is line number two\".\n\n# 11.8 THE #ifndef DIRECTIVE\n\
    \nThe syntax of the #ifndef directive is given below.\n\nSyntax:\n\n```\n#ifndef\
    \ identifier\n{\n    statement1;\n    statement2;\n#else\n{\n    statement3;\n\
    \    statement4;\n#endif\n```\n\nThe #ifndef works exactly opposite to that of\
    \ #ifdef. The #ifndef preprocessor tests whether the\nidentifier has defined substitute\
    \ text or not. If the identifier is defined, then #else block is compiled and\n\
    executed and the compiler ignores #if block if error are intentionally made. Error\
    \ Messages will not\ndeployed. If identifier is not defined then #if block is\
    \ compiled and executed."
