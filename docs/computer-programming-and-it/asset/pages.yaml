    The conditional operator (?) and (:) are sometimes called ternary operators because
    they take three arguments. The syntax of conditional operator is as given below.


    # Syntax


    Condition ? (expression1): (expression2);

    Two expressions are separated by a colon. If the condition is true expression
    1 gets evaluated, otherwise expression 2. The condition is always written before
    mark.


    The program given below illustrates the use of a conditional operator.


