  md: "# 380 Computer Programming and IT\n\nC compiler. These data types are used\
    \ to pass parameters to the CPU registers. In order to have access to these definitions\
    \ the programmer has to include \"dos.h\" header file.\n\nThe union type REGS\
    \ contains the CPU registers. These registers are used for holding the data temporary.\
    \ The microprocessors 8086, 8088, 80186, 80286, and 80386 use a variety of registers\
    \ for arithmetic and logical operations. They are also used to receive instructions\
    \ and pass data to and from memory.\n\nThe CPU registers are 16-bits in size.\
    \ They are AX, BX, CX, DX, SI, DI, and CFLAG, which is carry flag. The size of\
    \ CFLAG is 16-bits. The structure that defines these 16-bit registers is called\
    \ x. The x stands for pair registers. The size of each register is 8-bits. Thus,\
    \ the size of pair x is 16-bits.\n\nThe union also refers to 8-bit registers of\
    \ the above type processors. These 8-bit registers are AL, AH, BH, BL, CH, CL,\
    \ DH, and DL. The structure that defines these 8-bit registers is called h. Here,\
    \ h stands for a half register, it is 8-bit.\n\nThere are also segment registers\
    \ in the above processors. The size of segment registers is 16 bits. These segment\
    \ registers are DS, ES, CS, and SS. The structure SREGS defines these segments.\n\
    \nThe C language provides functions as intdos(), intdx(), and segrand() to access\
    \ DOS services. The intdos() is used for calling interrupt and invokes a DOS function\
    \ by issuing software interrupt 21H.\n\nWe can invoke BIOS services using C functions\
    \ as int86() and int86x(). The int86() function stands for 8086 interrupt. The\
    \ int86() function invokes a BIOS function by issuing software interrupt.\n\n\
    The int86() function can be invoked with the following arguments.\n\nTwo arguments\
    \ of union REGS. They are x and h.\n\nThe int86() function takes the values of\
    \ input registers from union REGS and returns the output registers in other. int86x()\
    \ function is similar to int8(). However, int86x() requires an input argument\
    \ in DS or ES register. Following are examples of int86() functions.\n\n# Example\
    \ 15.13\n\n```\n#include <dos.h>\n/* Finding Memory Size */\n\nvoid main() {\n\
    \    union REGS in, out;\n    int86(in,&out);\n    clrscr();\n    printf(\"\\\
    nTotal Memory = %d KB\",out.x.ax);\n}\n```\n\nOUTPUT:\nTotal Memory = 640 KB\n\
    \n# Explanation\n\nIn the above program, in and out are objects of type union\
    \ REGS. In this example, we need not to send any values to the ROM-BIOS function.\
    \ Thus, nothing is to be passed to any of the registers before invoking int86().\
    \ Here, the first argument 18 is the interrupt number followed by two arguments\
    \ of union REGS. The result obtained is the memory size displayed by calling ax\
    \ register. Here, extended memory of PC is displayed."
