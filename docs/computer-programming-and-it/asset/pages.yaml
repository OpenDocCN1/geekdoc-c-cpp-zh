  md: '# Computer Processing Unit


    Central Processing Unit

    The Central processing unit (CPU) referred to as the “brain” of a computer system
    converts data (input) into meaningful information (output). It is a highly complex,
    extensive set of electronic circuitry, which executes stored program instructions.
    A CPU (Fig. 1.17) controls all internal and external devices, performs arithmetic
    and logic operations, and operates only on binary data, that is, composed of ‘1’s
    and ‘0’s. In addition, it also controls the usage of main memory to store data
    and instructions, and controls the sequence of operations.

    The CPU consists of three main subsystems: the Arithmetic/Logic Unit (ALU), the
    Control Unit (CU), and the Registers. The three subsystems work together to provide
    operational capabilities to the computer.


    ![](img/de490c7868193a94130ecb9dbc887c5f_24_0.png)


    Arithmetic/Logic Unit (ALU) The arithmetic/logic unit (ALU) contains electronic
    circuitry that executes all arithmetic and logic operations on the data made available
    to it. The data required to perform the arithmetic and logic functions are inputs
    from the designated registers. The ALU comprises two units: arithmetic unit and
    logic unit.


    +   - Arithmetic unit: The arithmetic unit contains the circuitry that is responsible
    for performing the actual computing and carrying out the arithmetic calculations,
    such as addition, subtraction, multiplication, and division. It can perform these
    operations at a very high speed.

    - Logic unit: The logic unit enables the CPU to perform logical operations based
    on the instructions provided to it. These operations are a logical comparison
    between data items. The unit can compare numbers, letters, or special characters
    and can take action based on the result of the comparison. Logical operations
    of a logic unit can test for three conditions: equal-to-condition, less-than-condition,
    and greater-than-condition.


    Control Unit (CU) This unit checks the correctness of sequence of operations.
    It fetches instruction from the primary storage unit, interprets them, and ensures
    correct execution of the program. It also controls the input/output devices and
    directs the overall functioning of the other units of the computer (Fig. 1.18).'
