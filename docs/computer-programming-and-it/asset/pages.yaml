  md: '# 2.5 RAM, ROM, and CPU INTERACTION


    Picture a bulletin board under the back of a classroom. One way to think of ROM
    is that it is similar to the hard-notes placed under the glass. At the end of
    the day, they remain unchanged. The next day, the notes are exactly way they were
    the day before. Students are able to only read them. RAM, on the other hand, can
    be thought of as a blackboard, which starts up and during the day, information
    is written on it, read from it, and even erased from it. When something is erased,
    new data can be written on place on the board. When students go home at the end
    of the day, the blackboard is wiped clean and the data it was gone forever. This
    is what happens when a computer''s power is turned off; RAM no longer has the
    electrical current available to sustain the data in its memory cells. When wake
    up in the morning, you get ready for school/office and know the address of your
    destination. Similarly, when computer ''wakes up'', it searches for start-up routines
    from ROM BIOS and then hands over the control to operating system to function
    properly.


    The most essential part of computer processing is the memory. From the moment
    the computer is ON until it is shut down, the CPU constantly uses memory. A typical
    scenario is listed below and depicted in Figure 2.3.


    ![](img/de490c7868193a94130ecb9dbc887c5f_38_0.png)


    When computer is in OFF state, ROM contains data but RAM does not. When computer
    is turned ON, the CPU reads data and instructions from ROM which are used for
    booting up.


    Figure 2.3 RAM, ROM and CPU Interaction


    +   Step 1 The computer is switched ON.


    +   Step 2 CPU loads data and instructions from ROM and checks whether all the
    major components processor and hard disk are functioning properly.'
