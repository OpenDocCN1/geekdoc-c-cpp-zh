  md: '# # Chapter 14


    # # Dynamic Memory Allocation


    | CHAPTER OUTLINE |

    | 14.1 Dynamic Memory Allocation | 14.3 Dynamic Memory Management Functions |

    | 14.2 Memory Models |


    # ## 14.1 DYNAMIC MEMORY ALLOCATION


    For execution of a program, it is essential to bring the program into the main
    memory. When a program does not fit into the main memory, parts of it are brought
    into the main memory one by one and the full program is executed efficiently.
    Of course, parts of the program that are not currently in main memory are resident
    at secondary memory locations, such as floppy, hard disk, or any other magnetic
    disk. When a new segment of a program is to be moved into a full memory, it must
    replace another segment already resident in the main memory. The programmer should
    not be concerned about the method of transfer from secondary to primary memory
    (called replacement policies) since their description is the scope of this book.
    However, memory allocation techniques are described in this chapter.


    There are two techniques used for storing the information of C programs in the
    main memory. The first technique involves storing global and local variables,
    which are fixed during compilation and remain constant throughout the run of the
    program. Here, even the variables of structures and arrays are stored in the main
    memory during compilation. Spaces for local variables are allocated from the stack
    each time the variable comes into existence. Global and local variables are efficiently
    implemented in C. But the programmer know the amount of space required for every
    program.'
  merge: -1
