  md: '# Computer Programming and Languages 89


    Advantages of High-Level Languages High-level languages (HLL) are useful in developing
    complex software, as they support complex data structures. It increases the programmer''s
    productivity (the number of lines of code generated per hour). Unlike assembly
    language, the programmer does not need to learn the instruction set of computer
    being worked. The various advantages of HLLs are discussed below.


    +   - Readability: HLLs are closer to natural languages, they are easier to learn
    and understand. In addition, a programmer does not need to be aware of computer
    architecture; even a common man can use it without much difficulty. This is the
    main reason of HLL'' popularity.

    - Machine Independent: High-level languages are independent in set that a program
    using HLL can be used on different platforms with little or no change at all.

    - Easy Debugging: HLLs include the power of abstraction so that programmers can
    concentrate on finding the solution to the problem rapidly, rather than on low-level
    details of data representation, which results in fewer errors. Moreover, the compilers
    and interpreters are designed in such a way that they point out the errors instantaneously.

    - Easy to Maintain: As compared to low-level languages, the programs written in
    HLL are easier to modify and maintain because HLL programs are easier to understand.

    - Low Development Cost: HLLs permit faster development of programs. Although a
    high-level program may not be as efficient as an equivalent low-level program,
    the savings in programmer''s time outweighs the inefficiencies of application.
    This is because the cost of writing a program is nearly constant for each line
    of code, regardless of the language. Thus, a high-level language, where each line
    of code translates to 10 machine instructions, costs only a fraction compared
    to a program developed in a low-level language.

    - Easy Documentation: As the statements written in HLL are similar to natural
    languages, they are easier to understand as compared to low-level languages.


    # Disadvantages of High-Level Languages The main disadvantages of this language
    are:


    +   - Poor on Hardware: HLLs are developed to ease the pressure on programmers
    so that they do not have to know the intricacies of hardware. As a result, sometimes
    the applications written in HLLs cannot completely harness the total power available
    at hardware level.

    - Less Efficient: The HLLs are less efficient as far as computation time is concerned.
    This is because, unlike low-level languages, HLLs must be created and sent through
    another processing program known as a compiler. This process of translation increases
    the execution time of an application. Programs written in HLL take more time to
    execute, and require more memory space. Here, critical applications are generally
    written in low-level languages.


    # 4.5.4 Fourth Generation: 4GL


    Fourth generation languages (4GLs) have simple, English-like syntax rules, commonly
    used to access databases. The third generation languages are considered as procedural
    languages because the programmer must list each step and use logical control structures
    to indicate the order in which these are be executed. 4GLs, on the other hand,
    are non-procedural languages. The non-procedural method is simple to state the
    what needed instead of specifying what it must do rather one after another to
    perform a task. In words, the computer is instructed without how a computer must
    perform a task.


    The non-procedural method is easier to write, but has less control over how each
    task is actually performed. When using non-procedural languages, the methods used
    and the order in which each task is carried out is left to the language itself;
    the user has no control over it. In addition, 4GLs sacrifice computer efficiency
    in order to make programs easier to write. Hence, they require more computer power
    and processing'
