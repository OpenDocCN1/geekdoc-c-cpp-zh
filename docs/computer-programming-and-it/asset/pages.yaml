    # ## 6.1 INTRODUCTION


    C is a popular general programming language. It has been designed and developed
    by Dennis Ritchie at Bell Laboratories in 1972. It is an offspring of the “Basic
    combined programming language” called ‘B’-developed at Cambridge University in
    1960. This language is closely associated with Unix operating system. The source
    code for the Unix operating system is coded in C. The language C runs under a
    number of operating systems including MS-DOS. C programs are efficient, fast and
    highly portable, that is, C programs written on one computer can run on another
    with little or no modification. Functions are the building blocks in which all
    programming languages are incorporated.


    C is a middle-level computer language. It does not mean that C is not popular
    and robust for writing programs like in Fortran and Pascal. It is not troublesome
    like assembly-level language. It combines the features of high-level language
    and functionality like assembly language. It reduces the gap between high- and
    low-level language; that is, why it is known as middle-level language. It is well
    suited for writing both application and system software.


    C is a structured language and is similar in many ways to other languages such
    as Pascal and Fortran. A structured language allows variety of programs in small
    modules for easy debugging, testing and'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Introduction to C


    maintenance. Structured languages are easier and more of the developers prefer
    these languages to the non-structured ones like Basic and Cobol. Programming with
    structured languages is efficient and fast due to modular approach. C prefers
    loops like, do-while, and for. The user has to think of a problem in functional
    blocks. With appropriate collection of different modules, the programmer can make
    a complete program.


    # 6.2 OVERVIEW OF COMPILERS AND INTERPRETERS


    A program is a set of instructions for performing a particular task. These instructions
    are just like English words. The computer interprets the instructions in form
    of 1s and 0s. A program can be written in assembly language as high-level language.
    The written program is source code which to be converted to the machine language,
    which is known as object program. Either an interpreter or a compiler will perform
    this function.


    +   **Interpreters:** An interpreter reads only one line of source program at
    a time and converts it to object code. In any of error, the same will be easily
    indicated. The program written with an interpreter can easily be read and understood
    by the other users as. Hence, security is not possible. It is easier to modify
    the code with interpreters than compilers. The disadvantage is that it is more
    time-consuming converting a source program to an object program

    **Compilers:** A compiler reads the entire program and converts it to the object
    code. It provides no errors of a single line but errors the entire program. With
    the help of compiler, only error-free programs are executed. It consumes little
    time for converting a source program to an object program. When the program size
    for any application is large, compilers are preferred.


    # 6.3 STRUCTURE OF A C PROGRAM


    Every C program consists of a number of building blocks known as functions. Every
    function defined in C performs a specific task. A function is subroutine that
    may consist of one or more statements (Fig. 6.1). A C program comprises the following
    sections.


    +   **Include header file:** C program depends upon header files for function
    definition that are used in program. Each header file is extended with h. the
    header file should be included using **#include** directive as under.


    ```

    /* comments */

    void main() /* Function name */

    /* comments */

    Declaration part

    executable part

    ```


    For example: **#include <stdio.h>** or **#include stdio.h**


    In this example, the file is included, that all the definitions and protocols
    of function defined in this file are available in the current program. This file
    is also compiled with the original program.


    +   **Global declaration:** This section declares some variables, known as global
    variables, that are used more than one function. This section must be declared
    outside of all the functions.

    **Function main:** Every program written in C must contain main() function. Its
    execution starts at the beginning of this function. In ASCII C standard, the first
    line of C program from where program execution is written as follows:


    ![](img/de490c7868193a94130ecb9dbc887c5f_155_0.png)


    ```

    int main(void)

    ```'
