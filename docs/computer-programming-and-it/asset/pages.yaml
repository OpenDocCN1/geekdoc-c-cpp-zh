- img_proc: true
  md: '# Storage Class


    Any variable declared in C can have any of the four storage classes:


    +   * Automatic variables

    * External variables

    * Static variables

    * Register variables


    The storage class determines duration, scope, and linkage. The variables storage
    duration is the period during which the variable exists in memory. Some kinds
    of variables are repeatedly created in memory and exist throughout the program
    execution.


    Another important aspect is scope, that is, the area in which the variable can
    be accessed. Some variables are global and can be accessed anywhere in the program.
    On the other hand, some variables have limited scope in the block where they are
    defined. The declared four kinds of storage classes can further be divided in
    two types depending on their duration. They are automatic storage duration and
    static storage duration. Generally, local variables have automatic storage use
    of keyword auto is. Static variable belongs to storage class defined by static
    and external keyword. From the above discussion, we can state that there are two
    types of storage: (a) local and (b) global, and storage class specifiers are auto,
    register, static, and extern.


    **Lifetime of variable:** Every variable has lifetime, i.e. its duration during
    which its status is active in the program. We can also say that lifetime of a
    variable is the time between its declaration and cleanup. The lifetime depends
    upon the storage class. For example, auto variable gets destroyed immediately
    when the function execution is over static variable remains in memory.


    **Visibility of variable:** Visibility of variable is another property. It defines
    its scope. Scope is of two types: local and global. Global is recognized throughout
    the program. While local variable is limited to declaration block.


    # 10.2 SCOPE OF A VARIABLE


    The scope of a variable refers to the visibility of the variable. A variable can
    be either visible or not depending on where it is declared.


    The following programs show the scope of a variable.


    ```

    void main() {

    int count = 0;

    do {

    int count = 0; /* This count is unique to the loop. */

    count += 3; /* Increments (and prints) the loop''s count */

    printf("count = %d\n", count);

    }

    while ((count+=2) < 10); /* Increments the function''s count */

    printf("count = %d\n", count);

    }

    ```'
