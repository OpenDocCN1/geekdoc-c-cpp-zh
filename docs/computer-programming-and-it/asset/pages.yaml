    # 17.14 RECURSION


    The C language supports recursive feature, that is, a function is called repetitively
    by itself. Recursion can be used directly or indirectly. Direct recursion calls
    itself till the condition is true. In indirect recursion, a function calls another
    function, then the called function calling the function.


    ```

