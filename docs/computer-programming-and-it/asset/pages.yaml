    # ## 8.1 INTRODUCTION


    In order to perform different kinds of operators, C uses different kinds of operators.
    An operator indicates an operation to be performed on data that may yield a new
    value. An operator can operate on character, integer, floating point numbers,
    or others. Using various operators in C, one can link the variables and constants.
    In other words, operators performs operations on operand/s, whereas operand is
    a data item on which the operation is performed depending upon the operator.


    C is rich in use of different operators. C provides four classes of operators.
    These are (1) arithmetic, (2) relational, (3) logical, and (4) bitwise. Apart
    from these basic operators, C also supports additional operators such as increment,
    decrement, conditional, assignment, among others. The basic operators and others
    along with their symbolic representation are shown in Table 8.1.'
