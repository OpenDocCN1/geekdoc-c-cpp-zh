  md: '# 17.4 THE return STATEMENT


    The user-defined function uses the return statement to return the value to the
    calling function. Exit from the called function to the calling function is done
    using the return statement. When return statement is executed without argument,
    it returns 1.

    The return statement can be used in the following ways.


    +   1) return (expression) ; Here, expression value is returned to the calling
    function and if expression is omitted return statement simply transfers control
    to the calling function.


    Example: return (a+b+c);


    If such a statement is executed, the expression within parenthesis is first solved
    and the result obtained returned.


    +   2) A function may use one or more return statements. It is used when we want
    to return a value depending upon certain conditions. Table 17.2 explains this
    point.


    Example:


    Table 17.2 Multiple Return Statements

    | The Statement | The switch () |

    |---|---|n| if (a>b) | switch (x) |

    | return(a); | { |

    | else | case 1: |

    | return(b); | return(1); |

    | | break; |

    | | case 2 |

    | | return(1*2); |

    | | break; |

    | | default: |

    | | return(0); |

    | | } |


    +   3) return (&p); It returns the address of the variable to the calling function.

    4) return (*p); It returns the value of the variable through the pointer to the
    calling function.

    5) return (sqrt (r)); If such a format is used, when control reaches the return
    statement, it again passes to sqrt (r). The return statement collects the result
    obtained from sqrt ( ) function and returns it to the calling function. The return
    statement calls the function sqrt ( ).

    6) return (float (square (2.8))); All functions return by default integer value.
    To force the function to return other type of values, specify the data type to
    be. When a value is returned, automatically converts to a function data type.
    In the above example, the return value will be converted to float type.


    From the above discussion, we can conclude that


    +   • When the return statement is encountered in the function, the control sends
    back to the calling function, and the statement following return, if present,
    will not be executed.

    • Absence of return statement indicates that no value is returned. Such functions
    are called as void'
