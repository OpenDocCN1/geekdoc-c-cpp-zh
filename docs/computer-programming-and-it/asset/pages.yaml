    # 8.2 EXPRESSIONS


    An expression is constructed using variables, constants, and operators by using
    C programming rules. For example, we can write the expression as one using C syntax:


    ```

    a+b*c2

    ```


    This is an arithmetic expression in which a, b, and c are variables, + and * are
    operators and 2 is a constant. Variables can be integers, floating numbers, or
    double float numbers. Variables must be assigned values before evaluation is performed.


    Any complex expression in C is solved using its syntax. Some expressions in C
    are given below.


    ```

    (a*b*c) / (a+b)

    a( (b+c)) / (a+b+c)

    a*a+2*a*b+c

    ```


    We can also build expressions with relational operators such as


    ```

    a=b

    a<b || a<c

    ```


    The above examples indicate that expressions are constructed using parentheses
    and without parentheses. When expressions do not contain parentheses, expressions
    are carried out according to the priority of the operators. Higher priority operators
    are accessed before lower priority operators.


    For example, among arithmetic operators, operators such as multiplication (*),
    division (/) and modulus (%) have higher priority and similarity precedence. The
    operator + and – have lower precedence than the above operators.


