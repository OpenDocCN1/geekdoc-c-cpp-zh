    After reaching the Curie temperature (around 200°C), every magnetic material loses
    magnetization due to a complete disordering of its magnetic domains, and, as a
    result, losing the data stored on them. Moreover, the material''s coercivity,
    which is the measure of material''s resistance to magnetization by the applied
    magnetic field decreases as the temperature approaches the Curie point, and reaches
    zero when this temperature is exceeded. Therefore, it is imperative that the change
    to the material, when it is heated and cooled, is the change in magnetization
    with no damage to the material.


    The fact that the material''s coercivity drops at higher temperatures allows assisted
    recording with relatively weak magnetic fields. A relatively weak laser can generate
    high local temperatures focused at a small spot (about 1 micron in MO systems).
    When the material is heated, and its coercivity is low, a magnetization of the
    media can be changed by applying a magnetic field from the magnet. When the material
    is cooled to room temperature, its coercivity rises back to such a high level
    that the magnetic data cannot be easily affected by the magnetic fields. The basic
    schematic of this recording process is illustrated in Figure 2.24.


    ![](img/de490c7868193a94130ecb9dbc887c5f_57_0.png)


    Figure 2.24 Writing to magneto-optical Disk


    The recording layer is heated by the laser to a point where its magnetic orientation
    is dissipated. As this spot on the disk cools, the new magnetic orientation—corresponding
    to the information—is set by the magnetic head to correspond to ''0'' and ''1''
    of digital signals. Normally, to rewrite data on a MO disk, it is necessary to
    erase all previous signals before new data can be recorded. This means either
    two lasers are used (one to erase and one to record) or the single laser must
    first erase the data in a first rotation and then record the data the second time.
    This requires either a recorder with two lasers or longer recording times for
    a single laser system.


