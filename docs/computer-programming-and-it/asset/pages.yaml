  md: '# # Chapter 18


    # # Working with Strings and Standard Functions


    | CHAPTER OUTLINE |

    | 18.1 Introduction | 18.3 Display of Strings with Different Formats |

    | 18.2 Declaration and Initialization of String | 18.4 String Standard Functions
    |


    # ## 18.1 INTRODUCTION


    In C language, the group of characters, digits, and symbols enclosed within double
    quotation marks is called as string. The string is always declared as character
    arrays. In other words, character arrays are called strings. Strings are normally
    used to manipulate the text such as words and sentences. Every string is terminated
    with the ''\0'' (NULL) character. The NULL character is a byte with all bits at
    logic zero. Hence, its decimal value is zero.


    For example


    ```

    char name[] ={''I'', ''N'', ''D'', ''I'', ''A'', ''\0''};

    ```


    Each character of the string occupies 1 byte of memory. The last character is
    always ''\0''. It is not compulsory to write ''\0'' in a string. The compiler
    automatically puts ''\0'' at the end of the character array or a string. The characters
    of a string are stored in contiguous (neighbouring) memory locations. Table 18.1
    shows the storing of string elements in contiguous memory locations.'
  merge: -1
