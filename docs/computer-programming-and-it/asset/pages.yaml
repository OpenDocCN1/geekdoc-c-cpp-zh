    # Octal Number System


    The octal number system is a base 8 system, having eight admissible marks: 0,
    1, 2, 3, 4, 5, 6, and 7 with no 8''s or 9''s in the system. This system is a positional
    number system. The octal system uses powers of 8 to determine the digit of a number''s
    position (Table 5.3).


    # Table 5.3 Representing Binary and Decimal in Octal


