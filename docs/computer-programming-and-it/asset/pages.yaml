    +   4. r+b (read + write) This mode opens a pre-existing file in read and write
    mode, i.e. file can be

    read and write.


    For example,

    fp=fopen("data.dat", "r+b");


    Here, the `data.dat` is opened for reading and writing binary mode.


    +   5. w+b (read + write) This mode creates a new file in read and write mode.


    For example,

    fp=fopen("data.dat", "w+b");


    Here, the file `data.dat` is created for reading and writing in binary mode.


    +   6. a+b (append+ write) This mode opens a file in append mode, that is, data
    can be written at

    end of file. If file does not exist a new file is created.


    For example,

    fp=fopen("data.dat", "a+b");


    Here, the file `data.dat` is opened in append mode and can be written at the end
    of file.


    # 16.3.2 Reading a File


    Once the file is opened using `fopen ()`, its contents are loaded into the memory
    (parly or wholly).

    The pointer points to the very first character of the file. The `fgets()` function
    is used to read the contents of

    the syntax for `fgets (fp)` is as follows.

    where `fgets(fp)` reads the character from pointer position and advances the pointer
    position so that

    the next character is pointed. The variable `ch` contains the read by `fgets ()`.
    There are also other

    functions to read the contents of file, which are explained later in this chapter.


    # 16.3.3 Closing a File


    The file that is opened using `fopen()` should be closed after the work is over,
    that is, we need to close the

    file after reading and writing operations are over.


    For example,

    fclose(fp);


    This statement closes the file associated with file pointer `fp`. This function
    closes one file at a time. To

    one or more files at a time the function `fcloseall()` is used.


    For example,

    fclose();


    This function closes all open files and returns number of files closed. It does
    not require any argument.'
