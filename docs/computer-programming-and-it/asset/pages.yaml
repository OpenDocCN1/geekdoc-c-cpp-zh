    Multiply a negative number 1111 1111 1111 0000 (decimal -16) in two''s complement
    format by another negative number, 1111 1011 1111 1001 (decimal -1031).


    # Solution


    The steps in the multiplications are as under:


    +   Step A: $X = 1111 1111 1111 0000$. It is a negative number as msb of $X=1$

    Take two''s complement

    $X'' = 0000 0000 0001 1000$

    Step B: $Y = 1111 1111 1111 0111$. It is a negative number as msb of $Y=1$

    Take two''s complement

    $Y'' = 0000 0100 0000 0111


    Step C: Instead of multiplying $X''$ and $Y''$, let us multiply $Y''$ and $X''$
    because $X''$ has a smaller number of significant bits (5 only),

    Multicand = $0000 0100 0000 0111$

    Multiplier = $xxxx xxxx x1$ (considering up to significant bits only).


    +   Step 1: $P0 = x x x x xxxxx xxxx xxx0 0000 0100 0000 0111$

    Shift left four times (as multiplier is 2), an intelligent move to reduce the
    number of steps in multiplication.

    Step 2: $P1 = x x x x xxxxx xxxx xxx0 0000 1000 0001 1110$

    Step 3: $P2 = x x x x xxxxx xxxx xx01 0001 0000 0011 1100$

    Step 4: $P3 = x x x x xxxxx xxxx x000 0010 0000 0011 1000$

    Step 5: $P4 = x x x x xxxxx xxxx 0000 0100 0000 0111$|


    Since both of $X$ and $Y$ were 1, the answer is positive. Therefore, further negation
    is not to be done.

    Answer = $0000 0000 0000 0100 0111 0000 = decimal\ 16496$.'
