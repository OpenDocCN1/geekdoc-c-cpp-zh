  md: '# 494


    # Computer Programming and IT


    # Explanation


    In the above program, two strings and character pointer are declared. The strings
    are entered. Both the strings are used as arguments with function strbrk (). This
    function finds first occurrence of second string in the first string and returns
    that address which is assigned to character pointer *ptr. The pointer ptr displays
    the rest string. Here, the first string is “INDIA IS GREAT” and second string
    is ‘G’. The ‘G’ occurs at the beginning of the third word. Hence, on execution
    of the program string from ‘G’ onwards is displayed. The output is only “GREAT.”


    # SUMMARY


    This chapter is focused on strings. In this chapter you have learnt how to declare
    and initialize strings. It is also very important to identify the end of the string.
    It is followed by NULL (\0) character. The various formats for display of the
    strings in real life are demonstrated with examples.

    String handling has a strong impact on real life string problems such as conversion
    to lower case, reversing, concatenation, comparing, searching, and replacing of
    string elements. It is also discussed as how to perform these activities with
    without standard library functions. Having performed the programs discussed in
    this chapter, the programmer should not face any difficulty in string-handling
    applications.


