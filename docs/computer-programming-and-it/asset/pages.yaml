    \ author[25];\n  int pages;\n};\nstruct book b1=\"JAVA COMPLETE REFERENCE\", \"\
    P.NAUGHTON\", 886;\nstruct book *ptr;\nptr=&b1;\nclrscr();\nprintf(\"\\n%s by\
    \ %s of%d pages\",b1.name,b1.author,b1.pages);\nprintf(\"\\n%s by %s of%d pages\"\
    , ptr->name,ptr->author,ptr->pages);\ngetch();\n}\n```\n\n```\nOUTPUT:\nJAVA COMPLETE\
    \ REFERENCE by P.NAUGHTON of 886 pages\nJAVA COMPLETE REFERENCE by P.NAUGHTON\
    \ of 886 pages\n```\n\n# Explanation\n\nIn the above program, the printf() statement\
    \ prints the structure elements by calling them as usual. The second printf()\
    \ statement the structure elements are printed using a pointer and an arrow operator\
    \ (-> and >) together instead of (.) operator. The reason is that ptr is not a\
    \ structure variable but pointer to a structure."
