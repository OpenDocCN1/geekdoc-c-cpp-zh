    (b) Unary operators Unary operators are increment operator (++), decrement operator
    (--), and minus (-). These operators and their descriptions are given in Table
    8.4.


    # Table 8.4 Unary Arithmetic Operators


    | Operator | Description or Action |

    | --- | --- |

    | - | Minus |

    | ++ | Increment |

    | -- | Decrement |

    | & | Address Operator |

    | sizeof | Gives the size of operator |


    (i) Minus (-) Unary minus is used to indicate or change the algebraic sign of
    a value.


    For example


    ```

    int x= -50;

    int y= -x;

    ```


    assigns the value of -50 to x and the value of -50 to y through x. The sign used
    in this way is called the unary operator because it takes just one operand. There
    is no unary plus (+) in C even though, a value assigned with plus sign is valid.
    For item x=+50; + is valid but in which this sign should not be attached to C.


    (ii) Increment (++) and Decrement--) C compilers produce vary, efficient object
    codes for increment and decrement operations. This code is better than that generated
    by the equivalent assignment statement. So, increment and decrement operators
    should be used whenever possible.

    The operator ++ adds one to its operand. Whereas the operator -- subtracts one
    from its operand. For justification C in the statement x=x+1; can be written as
    x++; and x=x-1; can be written as x--;. Both operators may either follow or precede
    the operand. That is, x=x+1; can be represented as x++; or ++x;

    If ++ or -- are used as a suffix to the variable names then the increment/decrement
    operations take place. Consider an example for understanding ++ operator as a
    suffix to the variable.


    ```

    x=20;

    y=10;

    z=x++y;

    ```


    In the equation the current value of y is used for the product. The result is
    200, which is assigned to ''z''.

    If ++ or -- are used as a prefix to the name then increment/decrement operations
    take place. Consider an example for understanding ++ operator as a prefix to the
    variable.


    ```

    x=20;

    y=10;

    z=++y;

    ```


    In the equation the value of y is increased and then used for multiplication.
    The result is 220, which is assigned to ''z''.

    The following programs can be executed for verification of increment and decrement
    operations.'
