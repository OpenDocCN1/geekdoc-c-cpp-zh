    may even look like programming code. It is a generic way of describing an algorithm
    without using any specific language related relations. Simply put, pseudocode
    is an outline of a program, written in a form that can be easily converted into
    real programming statements. Pseudocode use English statements rather than symbols
    to represent the processes of a computer program. It is also known as PDL (Program
    Design Language), as it emphasizes more on the design of a computer program or
    structured English, because usually pseudocode instructions are written in normal
    English, in a structured way.


    Pseudocode seeks a fine balance between the understandability and informality
    of a natural language like English, and the complexity of a premium computer code.
    It is halfway between English and a programming language. If an algorithm is written
    in English, the description may be at such a high level that may prove difficult
    to analyze the algorithm and transform it into actual code. If instead, the algorithm
    is written in code, the programmer has to invest a lot of time in determining
    the details of an algorithm, which he may choose not to implement (since typically,
    algorithms are analyzed before deciding which one to implement). Therefore, the
    goal of writing pseudocode is to provide a high-level description of an algorithm,
    which facilitates analysis and eventual coding, but at the same time suppresses
    many of the details that are insignificant. For example, the pseudocode below
    calculates the area of a rectangle.


    ```

    PROMPT the user to enter the height of the rectangle

    PROMPT the user to enter the width of the rectangle

    COMPUTE the area by multiplying the height with width

    DISPLAY the area

    STOP

    ```


    Pseudocode uses some keywords to denote programming processes. Some of them are:


