    # 6.6 PROGRAMMING RULES


    A programmer, while writing a program, should follow certain rules.


    +   1. All statements should be written in lower case letters. Upper case letters
    are only used for symbolic constants.

    2. Blank spaces may be inserted between the words. This improves the readability
    of the statements. However, it is not used while declaring a variable, keyword,
    constant and function.

    3. It is not necessary to fix the position of statement in the program, that is,
    the programmer can write the statement between the two braces before the declaration
    part. The user can also write one or more statements in one line by separating
    them by a semicolon (;). Hence, it is often called a free-form language. The following
    examples of statements are valid.


    ```

    a=b+c;

    d=b*c;

    or

    a=b+c; d=b*c;

    ```


    +   4. The opening and closing braces should be balanced, for example, if opening
    braces are four, then closing braces should also be.


    # 6.7 IMPORTANCE OF BRACES ({ }) IN A C PROGRAM


    Every C program contains statements that are enclosed within braces. These braces
    are curly. The opening brace ( and closing brace ) are used in C. Between these
    two braces the program should declare and executable part. The opening of the
    curly brace specifies the start of the main function or identification of the
    start of the program in main (). The curly brace specifies the end of the program
    code for the main function. The closing of the program is identified by closing
    brace. In some programming languages, the end of program is indicated by HLT,
    END, EXIT or some other procedure. However, in C language, the end of program
    code is done with closing brace(). The statements within the curly braces perform
    the required task/application of the function. The following example explains
    the importance of braces.'
