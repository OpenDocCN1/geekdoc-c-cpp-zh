    1 to 5 numbers.

    int x,s;

    main(int);

    main(x)

    {

    s=s+x;

    printf("\n x = %ds s = %d",x,s);

    if(x<=5)

    exit(0);

    main(++x);

    }

    ```


    ```

    x = 1  s = 1

    x = 2  s = 3

    x = 3  s = 6

    x = 4  s = 10

    x = 5  s = 15

    ```'
