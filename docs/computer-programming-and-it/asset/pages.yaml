    # ## 17.1 INTRODUCTION


    The programs written in C language are highly dependent on functions. The C program
    is nothing but a combination of one or more functions. Every C program starts
    with a user-defined function `main()`. Every time a new program is started the
    `main()` function has to be defined. The `main()` calls another function to share
    the work.


    The best way to preparing a program application is to divide the application program
    into small pieces or modules and the same modules can be repeatedly called from
    the `main()` function and when required. These small modules or subprograms are
    easily manageable. This method is called ‘divide and conquer’ method. In C, such
    small modules are called functions. Figure 17.1 describes the method of developing
    a program.'
