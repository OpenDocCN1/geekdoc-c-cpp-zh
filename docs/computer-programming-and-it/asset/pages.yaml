    # 15.9 BIT FIELDS


    A bit field provides the exact amount of bits required for storage of values.
    If a variable value is 1 or 0 we need a single bit to store it. In the same way
    the variable is expressed between 0 and 3, then two bits are sufficient for storing
    these values. Similarly, if a variable assumes values between 0 and 7 then three
    bits will be sufficient to hold the variable and so on. The number of bits required
    for a variable is specified by non-negative integer followed by a colon.


    To hold the information we use variables. The variables occupy a minimum of one
    byte for char and two bytes for integer. Instead of using complete integer bits
    is used, space of memory can be saved. For example, to know the information about
    the vehicles, following information has to be stored in the memory.


    +   1 Petrol Vehicle

    2. Diesel Vehicle

    3. Two Wheeler Vehicle

    4. Four Wheeler Vehicle

    5. Old Model

    6. New Model


    In order to store the state of above information we may need two bits of fuel
    as to whether the vehicle is petrol or diesel type, three bits for its type as
    to whether the vehicle is two or four-wheeler. Similarly, we need three bits for
    model vehicle. Total bits required for storing the information would be 8-bits,
    that is, 1 byte. It means that the total information can be packed into a single
    byte. Eventually, bit fields are used for conserving the memory. The amount of
    memory saved by using bit fields will be substantial as seen from Example 15.8.


    However, there are restrictions on bit fields when arrays are. Arrays of bit fields
    are not permitted. Also the pointer cannot be used for addressing the bit field,
    although the use of member access operator (->) is acceptable.


    The unnamed bit fields could be used for padding as well as for alignment purposes.
    The structure for the above problem would be as follows.'
