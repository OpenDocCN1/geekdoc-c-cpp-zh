    # Preprocessor Directives


    CHAPTER OUTLINE

    11.1 Introduction 11.10 The #line Directive

    11.2 Macro Substitution 11.11 The inline Directive

    11.3 The #define Directive 11.12 The #pragma Saverregs

    11.4 Undefining a Macro 11.13 The #pragma Directive

    11.5 Token Pasting and Stringising Operators 11.14 The Predefined Macros in ANSI
    and Turbo-C

    11.6 The #include Directive 11.15 Standard I/O Predefined Streams in stdio.h

    11.7 Conditional Compilation 11.16 The Predefined Macros in ctype.h

    11.8 The #ifndef Directive 11.17 Assertions

    11.9 The #error Directive


    # 11.1 INTRODUCTION


    You are now aware of the execution of C programs. For refreshing the knowledge
    of the reader, the program needs certain steps. These are (a) the C program is
    written in editor, (b) compilation, (c) linking, and (d) the executable code generation.
    In between these stages, there also one more stage, that is, processor. The preprocessor
    is a program that processes the source program before it is passed to the compiler.

    The program typed in the editor is the source code to the preprocessor. The preprocessor
    then passes the source code to the compiler. It is not necessary to write the
    program with preprocessor facility. But it is a good practice to'
