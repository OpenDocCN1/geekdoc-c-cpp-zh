  md: '# # Chapter 16


    # # Files


    +   ### CHAPTER OUTLINE

    * 16.1 Introduction

    * 16.2 Streams and File Types

    * 16.3 Steps for File Operations

    * 16.4 File I/O

    * 16.5 Command Line Arguments

    * 16.6 Applications of Command Line Arguments


    ## 16.1 INTRODUCTION

    Applications generally involve tremendous amount of data to be read and written
    to an auxiliary storage. Hence, to save such information on the disk we use data
    files. File is a collection of numbers, symbols, and text placed on the disk.
    In course of time, files can be read and modified as per the user requirements.
    Thus, files allow us to store information permanently on the disk; it can be accessed
    and can be further altered depending upon the needs. This process leads to the
    concept of data files.


    ### Definition of File

    File is a set of records that can be accessed through a set of library functions.
    These functions are available in stdio.h.'
