    **Step 5** When an application is opened, it is loaded into RAM and any file that
    is opened for use in application is also loaded into RAM.


    **Step 6** After processing, when the user saves the file and closes the application,
    the file is written to the specified location on the secondary storage device.
    After that the file(s) and the application are ''flushed out'' from the RAM.


