    \ 0010 0001 = 0000 0100 0000 + 1111 1101 1110 = R=0000 0001 1111$. (Two's complement\
    \ of 0000 0010 0001 is 1111 1101 1110 + 0000 0000 0001 = 1111 1101 1111).\nStep\
    \ 5: $R=1111$\nStep 6: Since $X<Y$, we get $Q=0001$ and $R=1111$\nAnswer is $Q=0001$\
    \ (decimal 1) and $R=1111$ (decimal 33) as expected from division of 64 by 33.\n\
    \n# 5.10 FLOATING POINT NUMBERS\n\nAn 8-bit two's complement 1000 0000 represents\
    \ -127. System's bit width is 31 and 7 and leftmost bit represent sign.\n\nA 32-bit\
    \ number is used for representing a 32-bit integer. System's bit width is 31 and\
    \ leftmost bit represent sign. The number has a value between $-2^{31}$ and $2^{31}-1$.\n\
    Consider the following numbers\n\n+   1. There are fractional numbers. Examples\
    \ are 0.325, -0.000125, 0.99999 and so on.\n2. The number 0.125 is also written\
    \ as $1 \times 2^{-3}$. The number 0.06250 is also written as $1.0 \times 2^{-4}$.\n\
    3. The number -32.0 is also written as $-1.0 \times 2^5$ or $-0.5 \times 2^6$.\n\
    4. There are numbers with a fractional part as well as an integer part. Examples\
    \ are -4.325, 378.8999008 and so on.\n5. The number 0.000125 is also written as\
    \ $1.25 \times 10^{-5}$ or $0.125 \times 10^{-3}$.\n6. The number -8237.8999008\
    \ is also written as $-8.2378999008 \times 10^3$ or $-0.82378 \times 10^4$.\n\
    7. Consider the general magnitude of number in a bank. Assume that it is $123785890008$\
    \ or $1.2378589008 \times 10^{10}$. It is more than $2^{31}-1$. It cannot be represented\
    \ by a 32-bit.\n\nA point separates the integer part from the fractional part.\
    \ Numbers such as 0.325, 0.000125, 0.99999, 4.325, 8237.8999008, $1.0 \times 2^{-5}$\
    \ or $0.5 \times 2^0$ $1.0 \times 2$ or $0.5 \times 2^1$ are floating point numbers.\
    \ This is where arithmetic operations are done on the position of the point changes\
    \ (floats).\n\nFloating point numbers represent that cannot be represented by\
    \ integers. This is due to the fact that they contain fractional values or because\
    \ they lie outside the range of the system's bit width.\nIEEE has a standard format,\
    \ IEEE 754. Most computers use single precision and double precision floating\
    \ point representations for the floating point numbers. Figure 5.1 show two formats--32-bit\
    \ and 64-bit format.\nSingle-precision: one sign bit (s), 8 bits of exponent and\
    \ 23 bits of fraction.\nDouble-precision: one sign bit (s), 11 bits of exponent\
    \ and 52 bits of fraction.\nThe field is a sign-magnitude number that represents\
    \ the fractional part of a binary number whose integer part is assumed to be 1."
