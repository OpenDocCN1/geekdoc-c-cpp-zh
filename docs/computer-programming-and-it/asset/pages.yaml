    # 9.11 switch STATEMENT


    The switch statement is a multi-way branch statement. In the program, if there
    is a possibility to make a choice from a number of options, then structured selection
    is useful. It requires only argument of any data type, which is checked with number
    of case options. The switch statement evaluates and looks for its value among
    the case constants. If the value matches with the case constant, this particular
    case statement is executed. If not, default is executed. Here switch and default
    are reserved keywords. Every case statement terminates with ''. The break statement
    is used to exit from current case structure. The switch statement is useful for
    writing menu driven program.


    The syntax of the switch case statement is provided in Figure 9.9.'
