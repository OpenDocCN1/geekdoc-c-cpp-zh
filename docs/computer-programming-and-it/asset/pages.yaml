    # 4.3 PROGRAM CONTROL STRUCTURES


    A program is usually not limited to a linear sequence of instructions. During
    its process, it may diverge, repeat code, or take decisions. For these purposes,
    control structures specify what has to be done to perform the program. Program
    statements that affect the order in which statements are executed, or that affect
    statements are executed, are *control structures*. They affect the flow of simulation
    code since a control structure evaluates statements and then executes code according
    to the result. Essentially, there are three control structures:


    +   1. Sequence, where information flows in a straight line.

    2. Selection (decision or branched), where the decisions are made according to
    some predefined condition.

    3. Repetition (looping), where the logic (sequence of steps) is repeated in a
    loop until the desired output is obtained.


