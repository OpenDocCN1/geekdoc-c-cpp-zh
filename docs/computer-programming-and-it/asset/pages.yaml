    # 1.8 STORED PROGRAM ARCHITECTURE OF A COMPUTER


    The earliest computers such as ENIAC and Colossus were program-controlled machines
    in writing a new program or changing some existing required re-wiring, restructuring
    or redesigning the machines. Thus, programming in these computers was quite a
    tedious task. To ease the programming process, an idea known as stored program
    concept was proposed by a mathematician and an early computer scientist John von
    Neumann. According to this concept, both data and instructions are kept in the
    main memory. Thus, a computer could get its instructions from the memory and the
    programs could be set or changed from within the memory as well, without having
    to redesign the computer. The stored program architecture is the basis on which
    most of the contemporary and modern computers work (Fig. 1.20). This architecture
    is also known as von Neumann architecture.


    In 1946, John von Neumann and his team members designed the stored program computer
    known as the IAS, at the Princeton Institute for Advanced Studies. The design
    architecture for the computer consisted of four interconnected components that
    were:


    +   - Main memory

    - Arithmetic and logic unit (ALU)

    - Control unit

    - Input/Output devices


    ![](img/de490c7868193a94130ecb9dbc887c5f_26_0.png)


