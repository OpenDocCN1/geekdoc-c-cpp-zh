    # 9.7 CONTROL STRUCTURES


    Decision making statements in a programming language facilitate programmer to
    transfer the control from one part to other of the program. The programmer can
    make the program powerful by using control statements. Thus, using control statements
    the flow of program/execution of the statements is not in sequence. On the basis
    of real-time applications, it is essential


    +   * to alter the flow of a program

    * to test the logical conditions

    * to control the flow of execution as per selection


    C supports three kinds of control structures in the program, as such


    +   (i) sequential

    (ii) selective

    (iii) iterative


    In sequential, the statements are executed one after the other in the sequence
    which they appear. In selection control structures, choice of the path is decided
    based on the conditional statement. In iterative control structure, the program
    statements are repeatedly executed for numerous times even they appear only once
    in the program.


    C supports the control statements as listed below.


    +   (i) if statement

    (ii) if-else statement

    (iii) if-else if ladder statement

    (iv) switch() statement

    (v) goto unconditional jump

    (vi) for loop statement

    (vii) while loop

    (viii) do-while statement


    Besides the above mentioned statements, C also supports the other control statements
    such as continue , break , etc. In this chapter, we describe the operation of
    selective control structures.


    # 9.8 if STATEMENT


    C uses the keyword to execute a set of command lines or one command line when
    the logical condition is true. It has only one option. The set of command lines
    are executed only when the logical condition is true. Syntax of if statement is
    given in Figure 9.2.


    ```

    /*Syntax for the simplest if

    statement :- -*/

    if(condition) { /* no semi-colon */

    statement;

    ```


    Figure 9.2 Syntax of if Statement'
