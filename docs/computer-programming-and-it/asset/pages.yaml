    | Interpreter | An interpreter analyzes and executes the source code in line-by-line
    manner, without looking at the entire program. In other words, an interpreter
    translates a statement in a program and executes it immediately, before translating
    the next source statement. The advantage of interpreters is that they can execute
    a program spontaneously. Compilers require some time before an executable program
    is formed they look at the whole source code. However, programs produced by compilers
    run much faster than the same programs executed by an interpreter. |

