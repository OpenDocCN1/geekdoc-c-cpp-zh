  md: 'reads the contents of the file because it finds the read mode “r”. Here, “r”
    is a string and not a character.\Hence, it is enclosed with double quotes and
    not with single quotes.

    The **fopen ()** performs three important tasks.


    +   1. It searches the disk for opening the file.

    2. In case the file exists, it loads the file from the disk into memory. If the
    file is found with huge contents then it loads the file part by part.

    3. If the file does not exist, this function returns a NULL macro-defined character
    in the header file `stdio.h`. This indicates that it is unable to open the file.
    There may be following reasons for the failure of `fopen()` functions: (a) when
    the file is protected or hidden mode, (b) the file may be used by another program.

    4. It locates a character pointer, which points the first character of the file.
    Whenever a file is opened the character pointer points to the first character
    of the file.


    Given below modes in which a file can be opened.


    # A. Text Modes


    +   1. **w (write)** This mode opens a new file on the disk for writing. If the
    file already exists, it will be over-written without confirmation.


    # Syntax


    fp=fopen("data.txt", "w");

    Here, **data.txt** is the file name and “w” is the mode.


    +   2. **r (read)** This mode opens a pre-existing file for reading. If the file
    does not exist, then the compiler returns NULL to the file pointer. Using pointer
    with statement we can prompt the user regarding the failure of operation.


    # Syntax


    ```

    fp=fopen("data.txt", "r");

    if(fp==NULL)

    printf("File does not exist");

    OR

    if(fp=fopen("data.txt", "r"))==NULL)

    printf("File does not exist");

    ```


    Here, **data.txt** is opened for reading only. If the file does not exist, the
    `fopen()` returns NULL to file pointer **fp**. Using the NULL value of `fp` with
    statement we can prompt the user for failure of `fopen()` function.

