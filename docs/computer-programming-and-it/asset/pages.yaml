  md: 'Dynamic allocation is a technique in which a program can acquire storage space
    in the main memory. In this method, the space for the program is allocated from
    the free space during execution of the program. The free region of the memory
    is the heap. Conceptually, the C programs are stored as shown in Figure 14.1.
    The heap changes depend upon what memory model is being used. The 8086 memory
    models are also described in this chapter. The memory requirement is decided depending
    upon how the program is designed. For example, if a program is developed with
    many recursive functions this is implemented with stack.


    | Stack area |

    | --- |

    | ↓ |

    | Heap |

    | Global Variables |

    | Program |


    Figure 14.1 A of a C Program''s Use of Memory


    # 14.2 MEMORY MODELS


    +   - **Tiny** All segment registers are initialized with an identical value and
    all addressing is accomplished using 16 bits. This means that the code, data,
    and stack must fit within the same 64-KB segment. Programs are executed quickly.

    - **Small** All codes should fit in a single 64-KB segment and all data should
    fit in a second 64-KB segment. All pointers are 16 bits in length. Execution speed
    is the same as tiny model.

    - **Medium** All data should fit in a single 64-KB segment; however, the code
    is allowed to use multiple segments. All pointers to data are 16 bits, but all
    jumps and calls use 32-bit addresses. There is fast access to data; however, a
    program execution is observed with this model.

    - **Compact** All codes should fit in a 64-KB segment, but the data can use multiple
    segments. However, no data item can surpass 64 KB. All pointers are 32 bits, but
    jumps and calls can use 16-bit addresses. There is slower access to data and quick
    code execution.

    - **Large** Both code and data are allowed to use multiple segments. All pointers
    are 32 bits in length. However, no single data item can exceed 64 KB. There is
    slower code execution.

    - **Huge** Both code and data are allowed to use multiple segments. Every pointer
    is 32 bits in length. Single data item can exceed 64 KB. Code execution is slowest
    of all models.


    # 14.3 DYNAMIC MEMORY MANAGEMENT FUNCTIONS


    Dynamic memory management functions are used in the program to obtain memory space
    in the main memory. One of the features provided in C is the allocation of memory
    at the time of the execution of a program. The method of allocation of memory
    at the time of execution of a program is called dynamic memory allocation. Acquiring
    main memory by program and freeing it are done by some library functions provided
    in C. Following are the memory management functions supported by C.'
