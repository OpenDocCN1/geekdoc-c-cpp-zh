    or robust in the face of systemic failures. The system must always do what is
    expected and be able to recover from any situation that might lead to a mishap
    or system hazard. Thus, safety tries to ensure that any failure results in minor
    consequences, and potentially dangerous failures are handled in a fail-safe fashion.
    Language can facilitate this through such features as built-in consistency checking
    and exceptional handling.


    **Performance** By performance, the language should not only be capable of interacting
