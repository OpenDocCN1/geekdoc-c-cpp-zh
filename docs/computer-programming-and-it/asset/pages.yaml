    Processors have evolved with major improvements in their clock speed, power consumption,
    instruction sets and also in their word length. In this section, we will discuss
    the improvements in terms of word length and clock speed. The **word length**
    of a processor is the total length of data that can be processed by a processor
    at a time and **clock speed** is the rate at which processing cycle is completed
    in the processor. Word length is measured in ''bits'' and clock speed is measured
    in ''kHz'', ''MHz'', ''GHz''. The higher the word length and clock speed, the
