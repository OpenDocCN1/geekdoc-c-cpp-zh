  md: '# Computer Programming and Languages


    +   1. Allocation: It allocates memory space for the programs.

    2. Linking: It combines two or separate object programs and supplies the information
    needed to allow references between them.

    3. Relocation: It prepares a program to execute properly from its storage area.

    4. Loading: It places data and machine instructions into the memory.


    There are two types of loaders:


    +   1. Absolute Loader: This loads the file into memory at the location specified
    by the beginning portion (header) of the file and then passes control to the program.
    If the memory space specified by the header is currently in use, execution cannot
    proceed, and the user must wait until the requested memory becomes free. Moreover,
    this type of loader performs only functioning. It does not perform linking and
    program relocation.


    +   2. Relocating Loader: This loads the program in memory, altering the various
    addresses as required to ensure correct referencing. The decision as to where
    the program is placed is by the operating system, not the file''s header. It is
    a more efficient loader, but there is slight overhead in terms of a small delay
    while all the relative offsets are calculated. The relocating loader can only
    relocate code that has been produced by a linker capable of producing relocatable
    code.


    # 4.7 FEATURES OF A GOOD PROGRAMMING LANGUAGE


    The features of one programming language may differ from the other. One can be
    easy and simple, while another can be difficult and complex. We judge the success
    and strength of a programming language with respect to standard features. To begin
    the language selection process, it is important to establish some criteria for
    what makes a language good.


    # Ease of Use


    The language should be easy in writing codes for the programs and executing them.
    The ease and clarity of a language depends upon its syntax. It should be capable
    enough to provide clear, simple, and unified set of concepts. The vocabulary of
    the language should resemble English (or some other natural language). Symbols,
    abbreviations, and jargon should be avoided if they are already known to many
    people. Any concept that cannot be easily explained to amateurs should not be
    included. Simplicity helps in the readability of the language. A simple language
    is easier to grasp and develop. Developing and implementing a compiler or interpreter
    is also easier for simple languages as compared to complex ones.


    # Portability


    The language should support the construction of code in a way that could be distributed
    across multiple platforms (operating systems). Computer languages should be independent
    of any particular hardware or operating system, that is, programs written on one
    platform should be able to be transferred to any other computer or platform and
    it should perform accurately.


    The language should have a syntax that allows the program structure to show the
    underlying logic of an algorithm. A programming language should provide a conceptual
    framework for thinking through algorithms and of expressing these algorithms through
    flowcharts. The advantage of displaying a program in algorithms and flowcharts
    is that even a novice can understand them without learning any programming language.


    # Reliability


    The language should support the construction of components that perform their
    intended functions in a satisfactory manner throughout its lifetime. Reliability
    is concerned with making a system'
