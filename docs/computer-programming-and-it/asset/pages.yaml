  md: '# Definition of Pointer


    A pointer is a memory variable that stores a memory address. It can have any name
    that is legal for another variable and it is declared in the same fashion like
    other variables but it is always denoted by * operator.


    # 13.2 FEATURES OF POINTERS


    +   1. Pointers save memory space.

    2. Execution time with the pointer is faster because data is manipulated with
    the address, that is, direct access to memory location.

    3. The memory is accessed efficiently with the pointers. The pointer assigns the
    memory space and it also releases the memory. Dynamically memory is allocated.

    4. Pointers are used with data structures. They are useful for representing two-dimensional
    and multi-dimensional arrays.

    5. We can access elements of any type of array respective if its subscript range.

    6. Pointers are used in file handling.


    # 13.3 POINTER DECLARATION


    Pointer variables can be declared as follows.

    For example


    ```

    int *x;

    float *f;

    char *y;

    ```


    +   1. In the first statement x is an integer pointer and it tells the compiler
    that it holds the address of any integer variable. In the same way f is a float
    pointer, which stores the address of any float variable and y is a character pointer
    that stores the address of any character variable.

    2. The redirection operator (*) is also called the dereferencing operator. When
    a pointer is dereferenced, the value stored at address by the pointer is retrieved.

    3. Normal variable provides direct access to its own values, whereas a pointer
    provides indirect access to the values of the variable whose address stores.

    4. The indication operator (*) is used in two distinct ways with pointers, declaration
    and dereference.

    5. When a pointer is dereferenced, the star indicates that it is a pointer, not
    a normal variable.

    6. When the pointer is dereferenced, the indication operator indicates the value
    stored in the pointer at memory location is to access rather than the address.

    7. Also note that & is the same operator that can be used for the multiplication.
    The compiler knows which operator to call, based on the context.

    8. The & is the address operator and it represents the address of the variable.
    The %u is used with printf() function for printing the address of a variable.
    The address of any variable is a number. The operator & immediately precedes the
    variable returns the address of the variable. In the following example, & immediately
    precedes the variable num, which provides the address of the variable.


    Programs without the use of pointer are described initially for understanding
    the concept of address operator.'
