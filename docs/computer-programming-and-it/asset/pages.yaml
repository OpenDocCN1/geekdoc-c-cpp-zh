  md: '# Preface


    The world today is witnessing a new kind of revolution—the Information Revolution—ushered
    by technology. This revolution is in fact far more sweeping than any other revolution
    in history in its reach and influence, bringing fundamental changes in all aspects
    of our life. Information technology (IT) is the engine used to drive useful information
    systems. This includes computers, software, the Internet/Intranet, and telecommunication
    systems. IT provides the means for collecting, storing, encoding, processing,
    analyzing, transmitting, receiving, and printing information. A thorough knowledge
    of the fundamentals of IT and computer programming will prove to be highly beneficial
    for students of engineering.


    The contents of this book have been designed to meet the requirements of a core
    course on Computer Programming and IT offered to students of Indian universities.


    An indispensable text for teaching and learning, Computer Programming and IT is
    a rich collection of chapters on the basics of computers and C programming. Theoretical
    concepts are supplemented by numerous programs that enable a better understanding
    of the concepts. Suggestions to improve this edition are welcome.


