  md: "# 10.6 REGISTER VARIABLES\n\nWe can also keep variables in the CPU registers\
    \ instead of memory. The keyword register tells the compiler that the variable\
    \ list followed by it is kept on the CPU registers, since register access is faster\
    \ than memory access. If CPU fails to keep variables in CPU registers, the variables\
    \ are assumed as auto and stored in the memory. CPU registers are limited in numbers.\
    \ Hence, we cannot declare more variables with register variables. However, compiler\
    \ converts register variables to non-register variables when the limit is reached.\
    \ The user cannot determine the success or failure of register variables. We cannot\
    \ use register class for all types of variables. The CPU registers in microcomputer\
    \ are 16 bit. The data type float and double need space of more than 16 bits.\
    \ If we define variable of this data type with register class, no errors will\
    \ be shown. The compiler treats them as variable of auto storage class.\n\n# Syntax\n\
    \n```\nregister int k;\n```\n\n![](img/de490c7868193a94130ecb9dbc887c5f_267_0.png)\n\
    \nWrite a program to declare and use variable of register class.\n\n```\nvoid\
    \ main()\n{\n  register int m=1;\n  clrscr();\n  for (;m<=5;m++)\n  printf(\"\
    %t&d\",m);\n}\n```\n\n```\nOUTPUT:\n1 2 3 4 5\n```\n\n# Explanation\n\nIn the\
    \ above program, variable m is declared and initialized to 1. The for loop displays\
    \ values from 1 to 5. The register class is used as loop variable.\n\n# SUMMARY\n\
    \nAfter studying this chapter, your understanding with regard to the variables\
    \ is now perfect. You have studied the variables and their motives. The variables\
    \ are declared using storage class in different blocks and functions. You have\
    \ also gained the knowledge of auto storage class used to define local variables,\
    \ static storage class to initialize variables with null, register storage class\
    \ to use CPU registers for storage of data, and extern storage class to declare\
    \ global variables. Varied examples have been illustrated on the above storage\
    \ classes. The reader is advised to execute the programs provided in this chapter\
    \ in order to understand the concepts and applications of storage class."
