    # 5.11.2 Unit Distance Converter


    In Equation 5.13


    Assume that there are circular slots in a shift at $0^{\circ}, 3^{\circ}, 6^{\circ},
    9^{\circ}, \dots$, up to $357^{\circ}$. When that is rotating, its 8-bit position
    will be found from 00000000, 00000001, 00000011, and so on. The numbers of places
    where the changes occur from 0 to 1 or 1 to 0 are variable; 1, 2, and so on.


    When convert analog signal to the digital bits, it is more reliable for each increment
    or decrement step, the bit change is only at one place. Effect of some misalignment
    in the sensors can be detected from the sequence of signals that is received from
    the rotating shaft and accounted for.


    Unit distance is a code in which next increment or decrement causes the bit-transition
    only at one place.


