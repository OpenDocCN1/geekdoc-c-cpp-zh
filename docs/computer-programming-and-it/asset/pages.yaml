    # 3.6 SOFTWARE PIRACY


    Software piracy is unauthorized copying of an organization''s internally developed
    software or illegal duplication of commercially available software. While purchasing
    software, the user gets a licence to use the application but it cannot be copied
    to other machines. The use of software must comply with the product licence agreement
    that is included with the software. A software license is a type of licence that
    acts as a memorandum of contract between the producer and the user of computer
    software. Software licence is sometimes called End User Licence Agreement (EULA),
    which specifies the parameters of the permission granted by the producer to the
    user.


    # 3.6.1 Types of Software Piracy


    There are six basic forms of software piracy, and all cause adverse affects to
    the software publisher and to the end user.


    +   - Softloading: It is the most common type of piracy. Softloading sharing a
    program with someone who is not authorized by the licence agreement to use it.
    A common form of sofloading involves purchasing a single licensed copy of software
    and then loading the software onto several computers in violation of licensing
    terms. Examples of sofloading are sharing software with friends, co-workers, and
    others.'
