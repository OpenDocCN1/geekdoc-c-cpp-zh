  md: '# 2.6. Constructor-based order-sorted signatures


    A constructor-based order-sorted signature $(S, \le, F)$ is an order-sorted signature
    with constructor declarations. $F^c \subseteq F$ is a disjoint union of sets of
    constructors, such that $(S, \le, F)$ and $(S, \le)$ are order-sorted signatures.
    Constructors represent data on which a specification is constructed, and non-constructors
    represent functions over the data (see Example 4). An operator $f \in F_{w_s}$
    or $f \in F_{w}$ with $w_s=s$ is a constructor of sort $s$. A sort $s \in S$ is
    *constrained* if there exists a constructor of $s$. Let $S^c$ be the set of all
    constrained sorts. An element of $S^c$ is a $s^c$-constrained sort.


    # 2.2. Models


    A CafeObj signature $\Sigma$ determines the set $Mod(\Sigma)$ of models $\Sigma$-algebras.
    An algebra is a collection of sorted sets with operators (on the sets.


    # 2.2.1. $(S, \le)$-Algebras


    $(S, \le)$ is an order-sorted signature. An $(S, \le)$-algebra (or an order-sorted
    algebra of signature $(S, \le, F)$) interprets each sort $s \in S$ as a carrier
    set $A_s$, and each subsort $s'' \le s$ as an inclusion $A_{s''} \subseteq A_s$,
    and each operator $f \in F_{s_1, \dots, s_n}$ as a function $f : A_{s_1} \times
    \dots \times A_{s_n} \to A_w$ such that any two functions of the same name assign
    the same value to the same argument, i.e., if $f : w \to s$ and $f'' : w \to s''$
    then $w=w''$ and $s=s''$ and $\tilde{a} \in A_w$ then $f(\tilde{a}) = f''(\tilde{a}))$.


    # 2.2.2. $(S, \le)$-Algebras morphisms


    Let $A, B$ be $(S, \le)$-algebras. An $(S, \le)$-algebra morphism (or model homomorphism)
    $h : A \to B$ is an $S$-sorted family of functions between the carrier sets of
    $A$ and $B$, such that


    +   * $h(a_1, \dots, a_n) = f(h(a_1), \dots, h(a_n))$ for all $f \in F_{s_1, \dots,
    s_n}$ and $a_i \in A_{s_i}$ for $i \in \{1, \dots, n\}$,

    * if $s'' \le s$ and $a \in A_{s''}$ then $h(a) \in A_s$.


    # 2.2.3. Terms and term algebra


    Let $(S, \le)$ be an order-sorted signature, and $X = (X_s)_{s \in S}$ be an $S$-sorted,
    disjointly infinite, set of variables called the $\Sigma$-variable set. $\Sigma$-term
    is defined inductively as:


    +   * Each constant $f \in F$ is a $\Sigma$-term of sort $s$.

    * Each variable $x \in X_s$ is a $\Sigma$-term of sort $s$.

    * t is a term of sort $s''$ if $t = f(t_1, \dots, t_n)$ for some $f \in F_{s_1,
    \dots, s_n}$ and $t_i$ is a term of sort $s_i$ for $i \in \{1, \dots, n\}$.


    The $S$-sorted set of terms of $X$ is denoted by $T_{\Sigma}(X)$. For the $S$-sorted
    empty set of variables $[]$, $T_{\Sigma}([])$ denotes the set of $S$-sorted $\Sigma$-terms.
    $T_{\Sigma}$ and $T^X$ can be constructed as $\Sigma$-algebras by using the stated
    inductive definition of terms. $T$ as a $\Sigma$-algebra is the *initial* algebra
    of $\Sigma$-algebras stated as follows:


    > Fact 1. [28,29] For any $\Sigma$-algebra exists a unique $\Sigma$-algebra morphism
    $T \to A$. $\square$


    The least *sort* of a term $t \in T_{\Sigma}(X)$ is the least sort $s$ such that
    $t \in (T_{\Sigma}(X))$. A regular signature $\Sigma$ (2.1.5) guarantees that
    each term $t \in T_{\Sigma}(X)$ has the unique minimum sort with least sort [28,29]].


    # 2.2.4. Valuations and term interpretation


    A *valuation* (instantiation) assigns variables to values, that instantiates each
    variable with a value in a given model. Let $\Sigma = (S, \le, F)$-signature.
    Given a $\Sigma$-model $A$ and an $S$-sorted set $X$ of variables, a valuation
    $\theta : X \to A$ is an $S$-sorted family of maps. As follows, each $\Sigma$-term
    $t \in T_{\Sigma}(X)$ can be interpreted as a value $\theta(t)$ in the model $A$
    as:


    +   * $\theta(x) = f$ if $x$ is a constant $f$.

    * $\theta(t) = \theta(x)$ if $t$ is a variable $x$.

    * $\theta(t) = f(\theta(t_1), \dots, \theta(t_n))$ if $t$ is of the form $f(t_1,
    \dots, t_n)$ for $f \in F_{s_1, \dots, s_n}$ and $t_i \in (T_{\Sigma}(X))_{s_i}$
    $(1 \le i \le n)$.'
