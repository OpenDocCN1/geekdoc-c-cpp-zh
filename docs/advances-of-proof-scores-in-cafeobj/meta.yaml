    # 6.2. QLOCK in transition specification (TSP)


    QLOCK is described as a transition specification (5.4) and the specification is
    called QLOCK/TSP. As a matter of fact, QLOCK/TSP does not include the specification
    of initial states in (Σ, E, Π) and is just a 3-tuple (Σ, E, Π) (5.1). The initial
    states are specified. For a 3-tuple (Σ, E, Π), data structure for the State needs
    to be defined, (ii) Σ needs to be red-complete (fact 10) for proof scripts with
    search beards, but for complex proofs especially necessary thanks to specifications
    of transitions in transition rules.


    # 6.2.1. QLOCK/TSP-system specification of QLOCK in TSP


    For describing QLOCK State should be defined so that states can be defined with
    transition rules on State. For defining state, generic sets with the operators
    in, _=, ^ are specified by the module SET-^ (24:-31); the modules SET 01:-06 (SET-)
    and 07:-14 (SET-) are specified. The assoc and construct rules of the operator
    ^ are specified by e.g., [15]) and declaration of (assoc comm) (27) is justified.
    SETLEM 32:-40:2 declares necessary lemmas54 on SET-.


    ```

    01:   --> generic sets

    02:   mod SET(X : TRIV) {

    03:     [Elt : Set]

    04:     op empty : Set -> Set (constr)

    05:     op : Set -> Set (assoc comm: empty)

    06:     q(S: State) = S if not (S == empty) }

    ```


    ```

    07:   --> generic sets with __predicate

    08:   mod SET(X : TRIV) {

    09:     pr(SET(X))

    10:    pred_in : Elt = Set

    11:    eq(E1 : E) = false

    12:    eq(E1 in E(Elt S: Set)) = (E1 = E2) or (E1 in S)

    13:    eq(in-false : noneconvex)

    14:    (E1 in State) and (ES: E = S) = false }

    ```


    ```

    15:   --> generic sets with =_ intersection operator

    16:   mod SET(X : TRIV) {

    17:     pr(SET(X))

    18:     op : Set -> Set (assoc comm)

    19:     eq empty : Set = Set = true

    20:     eq(S1 : State) = S2 = true

    21:     eq(S1 in S2) = S2 = (E in S2) and (S1 <= S2)

    22:     cq(S1 <= S2) = S2 = (S1 <= S2) and (S2 <= S)

    23:     if not (S1 is Elt) and (S2 is Elt) }

