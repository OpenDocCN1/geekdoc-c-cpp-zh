    applications of (PR2) generate proof nodes where Mᵢₖ pᵢ will be difficult to prove.
    Each of the generated proof trees has root node Mᵢₖ and each of others is of the
    form Mᵢ, ..., pₙ (i ≤ m) that is generated as a node of Mᵢₖ. A leaf node (i.e.
    without child nodes) Mᵢ, ..., pₙ (i ≤ k < n) is generated by (PR2). A proof tree
    is effective if all its leaf nodes are effective. Pcalc proves M ⊢ p by constructing
    an effective proof tree node M ⊢ p.


