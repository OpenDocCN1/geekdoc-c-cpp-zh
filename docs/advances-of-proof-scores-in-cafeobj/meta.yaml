    be applied to the tuple (y1, ..., yn)

    of parameters of p(y1, ..., yn). Let the sort of yi be si for i ≤ i ≤ n, and the
    set of terms Ti ≡ = (T_si) × ... × (T_sn) is

    the set of variables y1, ..., yn and the type of variables y'', ..., yn''. Fact
    13 is rewritten now, for that

    both kinds interact y and y'' in this context are mathematical variables and not
    of CafeOBJ variables. They are used as variables of

    in this subsection.


    ```

    ∀t∈Ty (∀y''∈Ty'' (y''→t ⇒ p(y'')) ⇒ p(t)) ∀y''∈Ty'' (p(y''))

    ```


