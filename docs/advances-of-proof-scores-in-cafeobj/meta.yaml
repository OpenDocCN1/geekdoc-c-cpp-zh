    # K. Futatsuki


    supersort of S: Given a poset (S, ≤) of sorts, $\le$ denote the smallest inclusion
    relation containing the order. The quotient of S by the equivalence relation is
    denoted as $S/\le$, and an element of S is called a connected component.


    ## 2.12. Operators


    An operator (or function) $f$ of the operator (see Example 4) in CafeOBJ, where
    $w \in S$ is its arity and $s \in S$ is its (or co-arity) sort. A constant $f$
    is an operator whose arity is empty (e.g., $f : :$). Let $F_w$ denote the set
    of all operators of rank $w$, then the whole collection of operators can be represented
    as the set of operators sorted by (or indexed) as $F = [F_w|w\in S]$. Note that
    "$f : w \to s$" iff (if and only if) $f \in F_w$. Operators are overloaded, which
    is the same name for two different operators of different rank. $F_w$ and $F_{w''}$
    can have a common element for different $w$ and $w''$.


    ## 2.13. Built-in Boolean


    CafeOBJ has a built-in module Boolean Boolean algebra with the sort Bool and the
    following operators: true, false, $not\_$, $xor\_$, $implies\_$ which indicates
    the position of argument. An operator $f$ with the rank "Bool" (with the arity
    and co-arity of Bool) is called predicate, which can be declared as $pred\_w:$.


    There is an inbuilt equality predicate $pred\_w = *Cosmos*Cosmos \to Bool$ with
    equations $eq(CUX:Cosmos = CUX) = true$ and $eq(true false) = false$. $*Cosmos$
    is a builtin variable that can be interpreted by any sort. That is, "$pred\_w
    = S \times S \to Bool$" and "$eq(CUX:S \times S = CUX) = true$" is declared for
    any sort.


    The builtin module is used in a significant way as follows:


    - The condition of an $eq$ (2.3.1) is a Boolean term.

    - A property of interest on an $(s, model)$ of Bool is expressed with the predicates.


    The semantics $(s, model)$ of Bool is the standard propositional calculus and
    is preserved by models of every module (i, specification).


