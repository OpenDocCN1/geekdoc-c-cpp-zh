    本节分为展示如何根据第 2、3、4、5 节介绍的理论为转移系统构建证明，通过使用一个简单的非平凡 QLOCK（队列锁）互斥协议，描述如下：假设有许多代理（或进程）正在竞争一个公共资源（例如，打印机或文件系统），但在任何时刻，只有一个代理可以使用队列。也就是说，代理之间是互斥的。一种可以确保互斥的协议（分布式机制或算法）被称为**互斥互斥**。\n\
