    # 6.2.2 Properties of exclusion for QLOCK/TSP


    For proving the mutual exclusion property (mx for short) of QLOCK/TSP, three modules
    INITp(01:-06), Mxppr(11:-18), Hqpr(19:-24) are prepared to define the three predicates
    init_(07:-08), mx_(17:-18), hq-c_(22:-24), respectively.


    ```

    01:   -- initial state property of QLOCK/TSP

    02: mod INITp;

    03: pr(STATE);

    04: pre_init : As = false

    05: eq (init empS) = true

    06: eq (init (Aid:As:As)) = true

    07: pre_init : State;

    08: eq (Q:Aq r As:As wAs:As cSc:As)

    09: = ((Q = nilQ) and (init AS)

    10: = (As = empS) and (Asc = empS)) }

    ```


    ```

    11:   -- mutual exclusion property of QLOCK/TSP

    12: mod Mxppr;

    13: pr(STATE);

    14: pre_mx : As = false

    15: eq (mx empS) = true

    16: eq (mx (Aid:Aid:As)) = (As = empS)

    17: pre_mx : State;

    18: eq (Q:Aq r As:As wAs:As cSc:As)) = (mx As) .

    ```


    ```

    19:   -- top recall property of QLOCK/TSP

    20: mod Hqpr;

    21: pr(STATE);

    22: pre hq_c : As = false

    23: eq (hq-c (Q:Aq r As:As wAs:As cSc:As))

    24: (As = empS) or (not Q = nilQ) and ((hd Q = Asc)) .

