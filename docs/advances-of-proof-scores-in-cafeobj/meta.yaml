    possible signature is the most general sufficient for avoiding ambiguity until
    now [16]. An **ordered-signature** $(S, \le)$ is defined to be sensible if $(w
    = w'' \to w = w'')$ for any operator $f \in F_w \cap F_{w''}$, where $w = w''$
    means that $w$ and $w''$ are of the same sort and length. Note that $|w| = []$
    for the empty list. A signature guarantees a unique interpretation of each $\Sigma(S)$
    (2.2.3).


    An ordered-signature $(S, \le)$ is defined to be regular if there exists a least
    element in the set $\{w | f \in F_w \wedge w \le w_0\}$ for each $w_0 \le W$.
    A regular signature guarantees that each term has a minimum (2.2). Each ordered-signature
    signature can be checked automatically by CafeOBJ.


