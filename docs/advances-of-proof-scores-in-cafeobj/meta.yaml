    ## 2.4.2 Mod(SP) 与松散/紧密捐赠


    规范 SP = (Σ, E) 的模型集 Mod(SP) 定义为 Mod(SP) = {A ∈ Mod(Σ) | ∀e ∈ E A⊢ e}。Mod(SP) 中的每一个元素都是一个
    SP-代数（或 SP-模型）。


    CafeOB 中的 n 规范（即一个模型）可以具有松散捐赠（loose donation）或紧密捐赠（tight donation），分别由两个键 mod*
    和 tight* 标识（参见 CafeOB 的 TRIV 列表以及第 3:1–02–07 节）。松散捐赠指向 Mod(SP)，而紧密捐赠表示 Mod(SP)
    的初始模型或自由模型作为其存在。紧密捐赠用于指定一类特定的类型，而松散捐赠用于指定一类类型。


    ### 2.4.3. p(Y) 与约束定理


