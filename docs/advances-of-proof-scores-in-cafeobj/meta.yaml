    | 2022年10月6日在线发布 | © 2022 Elsevier B.V. 保留所有权利。 |

    | 关键词： | 形式/代数规范 | | |

    | 规范的验证与有效性检查 | | |

    | 交互式定理证明 | | |

    | 证明分数 | | |

    | CafeOBJ | | |


    ## 1. 引言


    规范验证是一种定理证明方法，其中规范是一组公理，而理想属性是目标。然而，规范验证的目标不是为规范证明某个属性，而是根据该属性检查规范的质量；规范本身旨在改进规范验证。这与普通的定理证明不同，后者的公理集是固定且不变的。规范的改进包括添加必要的公理、删除不必要的公理以及改进规范结构。


    为了实现这些改进，规范以及规范验证的机制最好是清晰透明。也就是说，证明应该尽可能清晰、定义精确，并且简单透明。


    (i) 规范的模型（一个指定的系统），(ii) （归约、证明规则）以及 (iii) 所用公理的原理（即为什么使用或不使用某公理）。


    CafeOBJ [6,10,11] 是一种基于操作逻辑和重写执行的可执行代数规范语言。CafeOBJ 强大的模块系统使其能够以清晰透明的方式描述假设/结论关系。


    全自动规范验证往往无法传达所描述系统的重要结构/属性，并且难以改进规范。人们应该寻求平衡利用人类和计算机的表达，让计算机完成繁琐的形式化计算，而让人类进行高层规划。证明分数已应用于
    OBJ [19,28,30,43]、CafeOBJ，并旨在满足这些需求 [12,13,20]。


    CafeOBJ 中规范的证明分数是一段代码，它通过规范和证明模块中的方程（即公理）来构建证明模块并在其上进行重写/归约（详见第3、4 节）。如果所有归约都返回了预期结果，则实现了证明。形式化计算是与读者共同进行的方程计算而高层规划被编码到模式程序及其归约命令中。


    *邮箱地址：futatsugi@jaist.ac.jp.*


    K. Katsatsu


    # 计算机程序科学 224 (2022) 102893


    主要的高层规划包括引理、用例划分和归纳。它们应该由人类证明，并使用 CafeOBJ 强大的系统模块通过类型模块进行声明。证明模块还可以使用灵活的开放-关闭结构（见第3节）进行构建，且用例划分/归纳可以以自由的方式进行描述。然而，我们模糊了高层规划的原理。引入了证明树演算（PTCalc）和良好归纳（WFI）来解决这一问题，通过穷尽方程进行用例划分以及通过良好关系进行归纳
    [15,16]。


    转换系统是解决动态系统的现代建模方案。使用 CafeOBJ 内置的转换系统属性进行证明的方法 [14]。这涵盖了动态系统的大部分重要属性，并且可以使用 TLC+WP
    构建证明类型。


    本文对 CafeOBJ 中证明类型的最新进展进行了全面且自包含的叙述，此前已有许多关于 CafeOBJ 或证明类型的论文发表。然而，其中许多论文密集地集中在理论/方法/案例研究上，我们认为在平衡上存在缺陷，并在案例获益的情况下讨论了理论在
    CafeOBJ 中如何使用用例。


    第一种归纳，(1) 定义为尽可能直接地在 CafeOBJ 中定义用例类型，(2) CafeOBJ 的用例以具体方式呈现，以解释理论的含义/意图。作为结果，本文以简单透明的方式阐明了以下两点，因为
    CafeOBJ 的逻辑基于某些理论：(a) 理论的最小集合 (b) 该类型是由此构建的。


    后续章节安排如下：第2 节描述了必要的理论；第4 节解释了如何通过证明树演算（PTCalc）和良好归纳（WFI）构建证明类型；第5 节描述了用于转换系统的理论和方法；第6
    节演示了 TLC+WP 的简单示例；第7 节讨论了相关工作、证明类型的特征并总结全文。


    ## 2. 基础类型


    本节是后续章节的准备，首次阅读时即可。鼓励读者理解必要的概念和符号。


    CafeOBJ 支持多种规范，例如等式规范、重写规范和行为规范。本文关注等式规范和转换系统（我们的证明方法开发的一类）。我们将按照以下项目进行：


    - 签名集合。

    - 对于每个签名 $\Sigma$，Mod($\Sigma$) 模型集合。

    - 对于每个签名 $\Sigma$，Sen($\Sigma$) 句子集合。

    - 对于每个签名 $\Sigma$，模型与句子之间的满足关系 $\models_\Sigma$，即 $\models_\Sigma \subseteq$ Mod($\Sigma$)
    $\times$ Sen($\Sigma$)。


    ### 2.1. 签名


    类型表示排序/类型的名称，以及该类型代表的内容。子类型可以在类型之间声明，并解释为子集关系。


    设 $s_1, ..., s_n$ 是按排序/类型排序的 $n$ 个类型。CafeOBJ 代码（即 CafeOBJ 代码中的一段文本）$[s]$ 声明每个
    $s_i$ ($1 \leq i \leq n$) 是一个类型。设 $s_1 = s_1, ..., s_n$ 和 $s_2 = s_2, ..., s_m$
    是两个类型列表。$[s_1 < s_2]$ 代码声明对于每一对 ($1 \leq i \leq n, 1 \leq j \leq m$)，$s_i$ 是 $s_j$
    的子集（见示例 1, 4）。设 $(s_1, ..., s_n)$ 为类型列表。$[s_1 < s_2 < ... < s_n]$ ($2 \leq n$)
    等于 $[s_1 < s_2] [s_2 < s_3] ... [s_{n-1} < s_n]$。注意，CafeOBJ 代码是按照包含子集关系的最小排序语法编写的。


