    # CafeOBJ 中证明分数的进展


    Kokichi Futsutsugi


    日本科学进阶大学 (JAIST), 石川县能见市, 923-1292, 日本


    ![](img/a48bf5ec82b70ffaa872f206e7481ab5_0_2.png)


    | 文章 | 摘要 |

    | --- | --- |

    | 文章历史： | 关键缺陷在领域、需求和/或设计规范层面仍然存在，而规范验证（即检查规范是否具有理想属性）是软件/系统工程中最重要的挑战之一。CafeOBJ
    是一个可执行的规范语言系统，领域专家/设计人员可以使用证明分数通过规范验证来提高规范质量。本文描述了 CafeOBJ 中规范验证证明分数的进展。 |

    | 2021年12月19日接收 | | |

    | 2022年9月7日接收修订稿 | | |

