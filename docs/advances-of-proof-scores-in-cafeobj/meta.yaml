  md: '# K. Futatsuki


    supersort of S: Given a poset (S, ≤) of sorts, ≤ denote the smallest inclusion
    relation containing the order. The quotient of S by the equivalence relation is
    denoted as S/≤, and an element of S is called a connected component.


    # 2.12. Operators


    An operator (or function) f of the operator (see Example 4) in CafeOBJ, where
    w ∈ S is its arity and s ∈ S is its (or co-arity) of. A constant f is an operator
    whose arity is empty (e.g., f : :). Let Fw denote the set of all operators of
    rank w, then the whole collection of operators can be represented as the set of
    operators sorted by (or indexed) as F = [Fw|w∈S]. Note that "f : w -> s" iff (if
    and only if) f ∈ Fw. Operators are overloaded, which is the same name for two
    different operators of different rank. Fw and Fw'' can have a common element for
    different w and w''.


    # 2.13. Built-in Boolean


    CafeOBJ has a built-in module Boolean Boolean algebra with the sort Bool and the
    following operators: true, false, not_, xor_, implying which indicates the position
    of argument. An operator f with the rank "Bool" (with the arity and co-arity of
    Bool) is called predicate, which can be declared as "pred_w:


    There is an inbuilt equality predicate pred_w = *Cosmos*Cosmos-> Bool with equations
    eq (CUX:Cosmos = CUX) = true and eq (true false) = false . *Cosmos is a builtin
    variable that can be interpreted by any sort. That is, "pred_w = Sfr S -> Bool"
    and "eq (CUX:Sfr = CUX) = true" is declared for any sort.


    The builtin module is used in a significant way as follows:


    +   - The condition of an eq (2.3.1) is a Boolean term.

    - A property of interest on an (s, model) of Bool is expressed with the predicates.


    The semantics (s, model) of Bool is the standard propositional calculus and is
    preserved by models of every module (i, specification).


    # 2.14. Operator attributes


    CafeOBJ supports the three attributes for a binary operator.


    +   - **associativity** (assoc): f(f(x,y), z) = f(x, f(y,z))

    - **commutativity** (comm): f(x,y) = f(y,x)

    - **identity** (id): e: f(x,e) = f(e,x) = x (e is an identity element)


    identity equations are implemented with rewrite rules, and associative/commutativity
    are implemented with the matching modulo/commutativity (2.6, 2.6.3).


    # 2.15. Ordered-signatures


    An **ordered-signature** is defined by a tuple (S, ≤) (see 21.1, 21.2). For making
    construction of symbolic presentations of models (i.e. terms, 2.2.3), possible
    signature is the most general sufficient for avoiding ambiguity until now [16].
    An **ordered-signature** (S, ≤) is defined to be sensible if (w = w'' → w = w'')
    for any operator f ∈ Fw ∩ Fw'', where w = w'' means that w and w'' are of the
    same sort and length. Note that |w| = [] for the empty list. A signature signature
    guarantees a unique interpretation of each Σ(S) (2.2.3).


    An ordered-signature (S, ≤) is defined to be regular if there exists a least element
    in the set {w | f ∈ Fw ∧ w ≤ w0} for each w0 ≤ W. A regular signature guarantees
    that each term has a minimum (2.2). Each ordered-signature signature can be checked
    automatically by CafeOBJ


    Example 1.1) [Bool Nat : 0 -> Bool . 0 -> Nat ] defines a nonsible signature,
    and 0 cannot be identified with any identity of sort.


    (ii) [Zero Nat EvenInt : 2 -> Nat . 2 -> EvenInt .] defines a sensible but no
    regular signature, and Zero is identified with any entity that sorts Nat and EvenInt
    but has no maximum.


    2 Numbers in the italic font denoted by "*" as 2.3 or 2.3.1 denote a subsection
    or a subsection of subsection.


    3'
