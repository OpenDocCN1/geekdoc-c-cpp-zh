    # 4.2. Well-founded induction (WFI)


    WFI is recognized as the generic scheme which introduces a variety of induction
    schemes. In CafeOBJ, WFI

    niceely coordinates to PTcal and provides a universal and transparent induction
    scheme [16]. The WFI in CafeOBJ supports

    atural induction with multiple parameters (simultaneous induction), induction
    with associative/

    constructive commands.


    # 4.2.1. Principle of WFI


    The principle of WFI, is well-defined, 14.1.5 of [32], A.1.7 of [55], and follows
    as follows:


    Fact 13 (Principle of WFI) Let there be a set T and w''. Let t,w'' ⊆ T and there
    is no infinite

    sequence (t_i, i ∈ {1, 2, ...}) with (t_i, t_{i+1}) = w''. Let p be a predicate
    on T (from values {true, false});

    then, the following follows, where w''→t implies w''→t):


    ```

    ∀t∈T (∀w''→t (p(w'') ⇒ p(t))) ⇒ p(t)

    ```


    That is, if whenever p(t'') for all t''∈T then there exists t''''∈ T such that
    w''→t and w''→t''''

    and ¬p(t''). This introduces an infinite loop w''-descending sequence. It conflicts
    with well-foundedness of w''.


    # 4.2.2. WFI scheme CafeOBJ


    Let p(y1, ..., yn) ∈ Type(Y)Bool is a Boolean term with variables Y = {y1, ...,
    yn} that describes a property

