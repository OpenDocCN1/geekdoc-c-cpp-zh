    # # Advances of proof scores in CafeOBJ


    Kokichi Futsutsugi


    Japan Advanced Institute of Science and Technology (JAIST), Nomi, Ishikawa, 923-1292,
    Japan


    ![](img/a48bf5ec82b70ffaa872f206e7481ab5_0_2.png)


    | ARTICLE | ABSTRACT |

    | --- | --- |

    | Article history: | Critical flaws continue to exist at the level of domain,
    requirement, and/or design specification, and specification verification (i.e.,
    to check if a specification has desirable properties) is one of the most important
    challenges in software/system engineering. CafeOBJ is an executable specification
    language system and domain/designers can use proof scores for improving quality
    of specifications by the specification verification. This paper describes advances
    of proof scores for the specification verification in CafeOBJ. |

    | Received 19 December 2021 | |

    | Received in revised form 7 September 2022 | |

    | Accepted 3 October 2022 | |

    | Available online 6 October 2022 | © 2022 Elsevier B.V. All rights reserved.

    | Keywords: | Formal/algebraic specifications | |

    | Specification verification and validation | |

    | Interactive theorem proving | |

    | Proof scores | |

    | CafeOBJ |


    # ## 1. Introduction


    Specification verification is theorem proving where a specification is a set of
    axioms and desirable properties are the aims. The goal of a specification verification
    is not, however, to prove a property for the specification but to check the quality
    of a specification against the property; a specification is supposed to improve
    the specification verification. This is different from ordinary theorem proving
    where the set of axioms is fixed and not changed. The improvement of a specification
    includes the addition of necessary axioms, the deletion of unnecessary axioms,
    and the improvement of the specification''s structure.


    For achieving the improvements, specification and the machinery of the specification
    verification are better to be clear and transparent. That is, the proofs are better
    to be clear and precisely defined, and simply and transparent.

    (1) Models of a specification (a system of specified if), if (reduction, proof
    rules) and (iii) rationale for axioms used (i.e., why an axiom is used to or not).


    CafeOBJ [6,10,11] is an executable algebraic specification language based on operational
    logic and rewriting execution. CafeOBJ''s powerful module system makes it possible
    to describe the assumption/conclusion relations in a clear and transparent way.

    A fully automatic specification verification often fails to convey important structures/properties
    of the systems specified, and makes it difficult to improve the specification.
    One should seek to make balanced use of the expressive power of humans and computers,
    so that computers do the tedious formal calculations, and humans do the high level
    planning. Proof scores have been used in the OBJ [19,28,30,43], CafeOBJ, and intend
    to meet these requirements [12,13,20].


    A proof score for a specification in CafeOBJ is a piece of code that construct
    proof modules and rewindings/reductions on them with the equations (i.e., axioms)
    in the specification and the proof modules (see Sections 3, 4 for more details).
    If all the reductions return the expected results, a proof is achieved. The formal
    calculations are


