    # 4.1. Proof tree calculus (Pcalc) [47]


    Pcalc is a refined version of CafeObj from CITP [27], and helps to prove M ⊢ p
    for a module M = (Σ, E).

    We have the following proof rule (9).


    (PR1) M ⊢ p ⊢ M is difficult to prove, and we need to find exhaustive eᵢ, ...,
    en�� and make use of the following rule of case-split (Fact 11) with the exhaustive
    equations.


    (PR2) (Mᵢₖ pᵢ ⊢ Mᵢₖ pᵢ₁ ... ⊢ Mᵢₙ p�) is also difficult to prove. The repeated
    applications of (PR2) generate proof nodes where Mᵢₖ pᵢ will be difficult to prove.
    Each of the generated proof trees has root node M and each of others is of the
    form Mᵢ, ..., pᵢₙ (i ≤ m) that is generated as a child node of Mᵢₖ. A leaf node
    (i.e. without child nodes) Mᵢ, ..., pᵢₖ (i ≤ k < n�) is generated by applying
    (PR2). A proof tree is effective if all its leaf nodes are effective. Pcalc proves
    M ⊢ p by constructing an effective proof tree root node M ⊢ p.


    # 4.1.1. Pcalc commands


    Pcalc constructs the proof with the commands with the head character : that distinguishes
    from ordinary CafeObj commands; goal declares proposals to be proved; def defines
    a new definition; apply declares a case-split command; init initializes a initializer;
    reduce does a reduction at the current goal; show info on proof; describe detailed
    info on proof; select selects the goal (node specified); sets parameters for Pcalc.


    In Pcalc, a proof tree is a CafeObj module and each goal has a name root or goal.
    Each goal gl has a name root or 1–2–3 (the 3rd child of 2nd node), and consists
    of the following five types of rules:


    +   (1) The next (or goal) boolean NTG(g) indicates that a Pcalc command is executed.
    (NTG ⊢ true) holds for any goal in the proof tree.

    (2) The context CTM(g) is a CafeObj module and corresponds to goal of M ⊢ p. The
    gl inherits (imports) all the context from CTM(g).

    (3) The set of introduced assumptions (assumptions) INA(g) that corresponds to
    +eᵢ,...,enₙ of Mᵢ,...,eᵢₙ ⊢ p. INA(g) = {eᵢ,...,eᵢₙ}.

    (4) The set of sentences (or equations) to be proved STP(g) that corresponds to
    +eᵢ,...,eᵢₙ of Mᵢ,...,eᵢₙ ⊢ p.

    (5) The discharged goal node DCG(g) indicates that gl is already discharged (proved).


    (CTM(g) ∪ STP(g)) corresponds to Mᵢ,...,eᵢₙ, p where it is understood as the module
    formed by adding all the equations in INA(g) to CTM(g) and STP(g) is the conjunction
    of its elements. some means (CTM(g)∪ INA(g)).


    [47] we Pcalc proves something by showing which way the effective nodes are changed
    by each command. The case-split cmd is defined as:


    Let (a) be a leaf such that NTG(g) ⊢ true and (b) be the name of a csp command
    defined by: "des cid = {csp(eq: eᵢ,...,eᵢₙ) with {eᵢ}} (i ∈ {1,2,...,n}). Then
    executing the command "apply(sc)" generates sub-goals (child goals) tg,...,tgn
    as follows:


    +   (1) Change NTG(g) to false.

    (2) NTG(g) ⊢ true.

    (3) NTG(gi) ⊢ false (i ∈ {1,2,...,n}).

    (4) CTM(gi) = CTM(g) (i ∈ {1,2,...,n}).

    (5) INA(gi) = INA(g) ∪ {eqᵢ} (i ∈ {1,2,...,n}).

    (6) STP(gi) = STP(g) (i ∈ {1,2,...,n}).

    (7) DCG(gi) = false


