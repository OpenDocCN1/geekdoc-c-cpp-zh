    ## 7.2.4. Pcalc+WFI proof scores


    The case-split with equations in a Pcalc :csp{...} has the following merits compared
    to the one with open...close constructs.


    - The exhaustive proofs are deley intensive by a :csp command and the user''s
    intent is clearly expressed in an easy to check style.

    - Although CafeObj does not support, the exhaustiveness can be checked automatically
    in the majority of cases based on constructor declarations.


    Pcalc is more formal than WFI and there are many Pcalc proofs without WFI. However,
    term refinements (of Instances 11(PR2), e.g., 4.2-19-20) are needed to do WFI
    and WFI is always Pcalc+WFI.


    Many kinds of induction schemes including structural induction were conducted
    into proof scores, and many cases were developed before Pcalc+WFI was prepared
    (11:2,120). Pcalc+WFI subsumes all of these induction schemes in a uniform way
    with generality of applicability and flexibility of Pcalc.


    The conditions for Pcalc+WFI proofs to be correct (errors) are localized within
    the following three points.


    - Exhaustiveness of the equations in a :csp{...} command.

    - Validation of the equation in an :init command with (..., e.g., 4.2-10).

    - Well-foundedness of the binary relation _wf_ could lead to an induction hypothesis.


    Without any automatic support from CafeObj, the well-foundedness of a binary relation
    _wf_ on the argument tuples of a goal can be established, in the majority of cases,
    with the strict subset on constructor terms. Full automation of Pcalc+WFI would
    be difficult because of least the following:


    - A :csp command could be used to declare the interested class of models for which
    the equations in the command are exhaustive. The exhaustiveness cannot be checked
    automatically in this case.

    - It would be difficult to automate the procedure for finding (i) a predicate
    p and (ii) a well-founded relation on the argument tuples of p that lead to successful
    induction.


    The transparent and flexible structure of Pcalc+WFI, however, could help design
    effective interactive tools.


    ## 7.3. Conclusions


    - A minimum for justifying the practice of the proof scores in CafeObj is presented
    in a unified style, and important results are formatted in 19 Facts.

    - Proof scores for case-split and induction can be represented as the highly stylized
    proof scores for the proof tree calculus (Pcalc) and the well-founded induction
    (WFI).

    - Concrete proofs in the Pcalc+WFI style for non-trivial specifications of transition
    systems are demonstrated to be justified by the Theories and the Facts.


