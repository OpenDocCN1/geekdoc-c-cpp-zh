    # 6. QLOCK example


    This section is divided to show how to construct proofs for transition systems
    based theory and methods presented in Sections 2, 3, 4, 5 by making use of a simple
    non-trivial QLOCK (QUEUE LOCKING) of mutual exclusion protocols. Mutual exclusion
    is described as follows:


    Assume many agents (or processes) are competing for a common resource (e.g., a
    printer or a file system), but at any moment of time only one agent can use the
    queue. That is, agents are mutually excluded in the equipment. A protocol (distributed
    mechanism or algorithm) which can ensure the mutual exclusion is called **mutual
    exclusion**.


    +   * Each of unbonded agents who participate in the protocol behaves as:

    * **[want]** If the agent wants to use the common and its name is not in the que,
    put its name at the bottom of the queue.

    * **[try]** If the agent wants to use the common and it is already in the queue,
    check if its name is on the top of the queue. If its name is on the top of the
    queue, start to use the common. If its name is not on the top of the queue, wait
    until its name is on the top of the queue.

    * **[exit]** If the agent finishes to use the common, remove its name from the
    queue.


    # 6.1 QLOCK/OTS as an Observational Transition System (OTS)


