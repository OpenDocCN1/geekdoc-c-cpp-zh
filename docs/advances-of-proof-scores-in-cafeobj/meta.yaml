    \ :- qnil assw rd as-rd).\n\n# 7. Discussion\n\n## 7.1. Related languages\n\n\
    Many algebraic specification languages/systems have been developed, some they\
    \ OBJ [19], HISP [22], ASL [55], ASF+SDF [4], Larch [21], and Maud [35]. Some\
    \ of them, Larch, Caul, and Maud, have their own verification tools, only OBJ\
    \ and CafeJ adopt the proof score approach with equal reduction engines. Gaudes\
    \ is a using language of CafeJ that has many interesting features, but Maud's\
    \ Inductive Theorem Proof (MITP) [8] does not take the proof score approach.\n\
    \nSet based functional specification languages, like VDM [54], Z [5], B [3], are\
    \ popular and widely used. The verification of specifications in these languages\
    \ can be achieved with proof assistants like P [48], Isabelle/HOL [33], Robin\
    \ [52] by making use of stepwise refinements and seem to be practically effective.\
    \ Proof scores with module reuse and refinements in CafeOBJ have a potential for\
    \ replacing the proofs by stepwise refinements.\n\n## 7.1.2. Theorem proofs\n\n\
    Interactive theorem provers or assistants have similar motivation as proof scores.\
    \ Among the most proved provers are ACL2 [1], Co [9], Isabelle/HOL [33], PVS [48].\
    \ All of them are not algebraic and not based on deduction/reduction.\n\nSAT/SMT,\
    \ MinSat [38], Z2 [59], and Yices [56], have a power to fully automate proofs\
    \ in some specific cases, and are used in several instances in a Ptac proof. This\
    \ kind of fully automated theorem provers can be used to discharge a sub-goal\
    \ in [49,50] CIMPG/CIMPG/CIMPG-F (short) for CafeMaude [51] which have proof scores\
    \ for their invariants. CIMPG/CIMPG/CIMPG-F plus SAT/SMT have a potential to automate\
    \ the Ptac-WFT proof in a significant way.\n\n## 7.1.3. CafeOBJ\n\nThe logical\
    \ semantics of CafeOBJ is constructed by the connection of institution [11]. Recent\
    \ studies in this industry include [23,26].\n\nRecent focus on applications of\
    \ specification with CafeOBJ is multitask, hybrid, real-time system. Recent proofs\
    \ in this category include [40,42]. Proof scores for control protocols and automotive\
    \ software standards still to be investigated. [57] reported an interesting rare\
    \ among proof scores for leads-to, and develops to domain.\n\n## 7.2. Distinct\
    \ features of proof scores\n\nComparing with the provers like ACL2, Co, Isabelle/HOL,\
    \ PVS, the specification verification has the following characteristics:\n\n-\
    \ Systems made via Abstract Data Types (ADT) with appropriate abstraction level\
    \ can be selected for each specification. Moreover, the equations are used directly\
    \ as rewriting rules. The two major proof Fact 9 (PR1), Fact 11 (PR2) are simple\
    \ and formalized, at the level of SP satisfies (any model), supporting model proofs.\n\
    \n## 7.2.2. Reduction proof base\n\nA proof score succeeds if any of the reductions\
    \ return the expected result, unless true. Each reduction with the current module,\
    \ by using the current equations and the failed reduction result, the equations\
    \ that are added for getting desirable reduction could be used. This is one and\
    \ important feature base for the transparent proof score. The following three\
    \ are all declared as equations that are to be used in reductions:\n\n- Necessary\
    \ axioms and lemmas (see Example 6).\n- Exhaustive equations for case-splits.\n\
    - Necessary induction hypotheses.\n\n## 7.2.3. Initiality, termination, confluence,\
    \ completeness\n\nThe proof scores prove the semantic properties of interest.\
    \ Each of the properties is supposed to be expressed in CafeOBJ's properties (2,1,3),\
    \ an invariant property (Fact 15), or a leads-to property (Fact 16). These properties\
    \ are the primary indices of the quality of specifications. If a proof score succeeds\
    \ in proving property then the equations (i.e., axioms) are shown to be sufficient\
    \ enough to improve the property.\n"
