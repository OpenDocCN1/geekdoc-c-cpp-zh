    # Science of Computer Programming 224 (2022) 102893


    A finite or infinite sequence of states $s_1s_2\dots s_n$ ($n \le l$) or $s_1s_2\dots$
    with $(s_i, s_{i+1})\in Tr$ for each $i\in\{1, \dots, n-1\}$ or $i\in\{1, \dots\}$
    is defined to be a **transition sequence**. Note that any $s\in St$ is defined
    to be a transition sequence of length 1.


    # 5.1. Invariant properties


    Given a transition system $TS=(St, Tr, In)$, a state $s''\in St$ is defined to
    be **reachable** if there exists a transition sequence $s_1s_2\dots s_n$ ($n \le
    l$) with $s_n=s''$. A **state predicate** (a function from $St\to Bool$) $p$ is
    defined to be an **invariant** (or an invariant property) if $p(s'')=true$ for
    any reachable state $s''$. A state predicate may have extra data with a declaration
    like "\pred Data .".


    **Fact 15 (Invariants),** [14] Let be a state predicate that specifies the initial
    states, that is, $\forall s\in init(s)\implies s\in In$. Let $p_1, p_2,\dots,
    p_n$ ($n \le l$) be state predicates and $(p_1\wedge p_2\wedge \dots \wedge p_n)(s)$
    for $s\in St$. The following conditions are satisfied if


    +   (INV1) $\forall s\in init(s) \implies inv(s)$

    (INV2) $\forall s,s''\in Tr(inv(s)) \implies inv(s'')$


    A predicate that satisfies the conditions (**INV1**) and (**INV2**) if $inv\in
    In$ is called an **inductive invariant**. If one then taking $p=inv$ and $n=1$
    is enough. however, $p_1, p_2,\dots, p_n$ ($n>1$) are almost always needed for
    finding such an invariant, and finding them is the most difficult part of the
    invariant verification.


    # 5.2. Observational Transition Systems (OTS)


    An operational system $OP=(\Sigma, E, S)=(S, S, S, F'')$ is called an OTS specification
    if it is described as follows and defines a transition system $TS=(St, Tr, In)$.
    An OTS is defined as $(S, Tr, F'')$, which differs from the original transition
    in [44].


    Assume (i) a unique state $St\in S$ $D\subseteq S-St$, (ii) a unique initial state
    $init\in In(\Sigma)_St$, (iii) a set of operators $AC\in F''$ of which each $a_i$
    ($1\le i\le m$) has a rank sequence $s_0s_1\dots s_m$ ($s_0\in St, s_m\in St$,
    $s_i\in D$ for $0<i<m$), (iv) a set of operators $Obs\in O$ of which each element
    $o_i\in Ob(1\le i\le m)$ has a rank $1\le j\le m$ and $s_j\in Mo$.


    The observers observe values of a state, and the behavior of the system is defined
    by describing the observational values before and the actions with the conditions
    equations of the formula for $1\le i\le m$


    ```

    $cq \ o(a_j(X^St, X^j, X^Mo)) = v_j^{od}(X^St, X^j, X^Mo)$

    where $X^St = (X^St_1, \dots, X^St_n), X^j = (X^j_1, \dots, X^j_n), X^Mo = (X^{Mo_1},
    \dots, X^{Mo_m})$

    ```


    X is a variable of sort $X^{St}:St^n$, $X^j:St^h$ ($1\le h\le n$), and $X^{Mo_j}:Mo^h$
    ($1\le h\le m$).


    ```

    $o_i(X^St, X^j, X^{Mo}) \in T_{\Sigma}(X^St, X^j, X^{Mo})_{Bool}$.

    Then the transition system $TS=(St, Tr, In)$ is defined as follows.

    ```


