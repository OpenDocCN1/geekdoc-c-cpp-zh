    # Advances of proof scores in CafeOBJ


    Kokichi Futsutsugi


    Japan Advanced Institute of Science and Technology (JAIST), Nomi, Ishikawa, 923-1292,
    Japan


    ![](img/a48bf5ec82b70ffaa872f206e7481ab5_0_2.png)


    | ARTICLE | ABSTRACT |

    | --- | --- |

    | Article history: | Critical flaws continue to exist at the level of domain,
    requirement, and/or design specification, and specification verification (i.e.,
    to check if a specification has desirable properties) is one of the most important
    challenges in software/system engineering. CafeOBJ is an executable specification
    language system and domain/designers can use proof scores for improving quality
    of specifications by the specification verification. This paper describes advances
    of proof scores for the specification verification in CafeOBJ. |

    | Received 19 December 2021 | | |

    | Received in revised form 7 September 2022 | | |

    | Accepted 3 October 2022 | | |

    | Available online 6 October 2022 | © 2022 Elsevier B.V. All rights reserved.
    |

    | Keywords: | Formal/algebraic specifications | |

    | Specification verification and validation | | |

    | Interactive theorem proving | | |

    | Proof scores | | |

    | CafeOBJ | | |


    ## 1. Introduction


    Specification verification is theorem proving where a specification is a set of
    axioms and desirable properties are the aims. The goal of a specification verification
    is not, however, to prove a property for the specification but to check the quality
    of a specification against the property; a specification is supposed to improve
    the specification verification. This is different from ordinary theorem proving
    where the set of axioms is fixed and not changed. The improvement of a specification
    includes the addition of necessary axioms, the deletion of unnecessary axioms,
    and the improvement of the specification''s structure.


    For achieving the improvements, specification and the machinery of the specification
    verification are better to be clear and transparent. That is, the proofs are better
    to be clear and precisely defined, and simply and transparent.


    (1) Models of a specification (a system of specified if), if (reduction, proof
    rules) and (iii) rationale for axioms used (i.e., why an axiom is used to or not).


    CafeOBJ [6,10,11] is an executable algebraic specification language based on operational
    logic and rewriting execution. CafeOBJ''s powerful module system makes it possible
    to describe the assumption/conclusion relations in a clear and transparent way.


    A fully automatic specification verification often fails to convey important structures/properties
    of the systems specified, and makes it difficult to improve the specification.
    One should seek to make balanced use of the expressive power of humans and computers,
    so that computers do the tedious formal calculations, and humans do the high level
    planning. Proof scores have been used in the OBJ [19,28,30,43], CafeOBJ, and intend
    to meet these requirements [12,13,20].


    A proof score for a specification in CafeOBJ is a piece of code that construct
    proof modules and rewindings/reductions on them with the equations (i.e., axioms)
    in the specification and the proof modules (see Sections 3, 4 for more details).
    If all the reductions return the expected results, a proof is achieved. The formal
    calculations are into the equations with the readers, and the high level planning
    is to be encoded into the mode programs and the reduction commands on them.


    *E-mail address: futatsugi@jaist.ac.jp.*


    K. Katsatsu


    # Science of Computer Programming 224 (2022) 102893


    Major high level planning includes lemma, case-split, and induction. They are
    supposed to be proved by humans and declared by sort modules by using CafeOBJ''s
    powerful system module. Proof modules can also be constructed with flexible open–close
    constructs (see Section 3) and case-split/induction can be described in a liberal
    way. We involve, however, obscuring the rationale of the high level planning.
    Proof tree calculus (PTCalc) and well-founded induction (WFI) are introduced to
    solve the issue, by case-split with exhaustive equations and induction via a well-founded
    relation [15,16].


    Transition system is the modern modeling scheme for resolving dynamic systems.
    A proof method using CafeOBJ''s built-in proving-properties of transition systems
    [14]. The leads to cover a large part of important properties of dynamic systems,
    and proof sorts can be built with TLC+WP.


    This paper is a comprehensive and self-contained account on the recent advances
    of proof sorts in CafeOBJ with many papers have been published on/or CafeOBJ/or
    proof sorts. Of them, however, there are on theories/methods/case-studies intensively,
    and we feel the fault in balance and discuss how theory uses cases in CafeOBJ
    in a case benefit.


    The first induction, (1) is defined as sort of cases in CafeOBJ as directly as
    possible, (2) CafeOBJ''s cases are presented to explain the meaning/intention
    of theories in concrete ways. As result, the paper clarifies the following two
    things in a simple and transparent way, because the logic of CafeOBJ''s proof
    sorts are based on some ones among which other proof based systems: (a) A minimal
    collection of theories that makes the sort work (b) the sort is constructed and
    induced by the theories.


    The following sections are organized as follows: Section 2 describes the theories
    that are necessary for justifying proof sorts. Section 4 explains how to construct
    de-f proof sorts with proof tree calculus (PTCalc) and well-founded induction
    (WFI). Section 5 describes theories and methods for constructing proof sorts for
    transition systems. Section 6 demonstrates the constructions of the TLC+WP sorts
    for a simple example of transition system. Section 7 discusses related works,
    distinctive features of the proof sorts, and concludes the paper.


    ## 2. Fundamental sorts


    This section is a preliminary to the following sections, and it is to be brought
    through on first reading. There are many pointers from the following sorts to
    related parts, and readers are encouraged to understand necessary concepts and
    notations.


    CafeOBJ supports several kinds of specifications such as equational, rewriting,
    and behavioral specifications. This paper focuses on equational specifications
    and transition systems (a restricted class of which our proof method has developed.
    We will proceed with the following items:


    - A set of signatures.

    - for each signature $\Sigma$ sign Mod($\Sigma$) of $\Sigma$-models.

    - for each signature $\Sigma$ sort Sen($\Sigma$) of $\Sigma$-sentences.

    - for each signature $\Sigma$ a satisfaction relation $\models_\Sigma$ between
    $\Sigma$-models and $\Sigma$-sentences, i.e., $\models_\Sigma \subseteq$ Mod($\Sigma$)
    $\times$ Sen($\Sigma$).


    ### 2.1. Signatures


    A sort denotes a name for the kinds of sort/type, and what the sort represents.
    The subset sort can be declared among sorts and is interpreted as a subset relation.


    Let $s_1, ..., s_n$ be a list of $n$ sorts sorted by sort/type. The CafeOBJ code
    (i.e., a piece of text in CafeOBJ code) $[s]$ declares each $s_i$ ($1 \leq i \leq
    n$) is a sort. Let $s_1 = s_1, ..., s_n$ and $s_2 = s_2, ..., s_m$ be two lists
    of sorts. The code $[s_1 < s_2]$ declares that each $s_i$ ($1 \leq i \leq n, 1
    \leq j \leq m$) $s_i$ is a subset of $s_j$ for each pair ($1 \leq i \leq n, 1
    \leq j$) (see Examples 1, 4). Let $(s_1, ..., s_n)$ be a list of sorts. The code
    $[s_1 < s_2 < ... < s_n]$ ($2 \leq n$) is equivalent to $[s_1 < s_2] [s_2 < s_3]
    ... [s_{n-1} < s_n]$. Note that CafeOBJ code is written in the syntax minimum
    sort order including the subset relations.


