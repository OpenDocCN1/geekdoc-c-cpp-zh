    # 7.1.2. Theorem proofs


    Interactive theorem provers or assistants have similar motivation as proof scores.
    Among the most proved provers are ACL2 [1], Co [9], Isabelle/HOL [33], PVS [48].
    All of them are not algebraic and not based on deduction/reduction.


    SAT/SMT, MinSat [38], Z2 [59], and Yices [56], have a power to fully automate
    proofs in some specific cases, and are used in several instances in a Ptac proof.
    This kind of fully automated theorem provers can be used to discharge a sub-goal
    in [49,50] CIMPG/CIMPG/CIMPG-F (short) for CafeMaude [51] which have proof scores
    for their invariants. CIMPG/CIMPG/CIMPG-F plus SAT/SMT have a potential to automate
    the Ptac-WFT proof in a significant way.


    # 7.1.3. CafeOBJ


    The logical semantics of CafeOBJ is constructed by the connection of institution
    [11]. Recent studies in this industry include [23,26].


    Recent focus on applications of specification with CafeOBJ is multitask, hybrid,
    real-time system. Recent proofs in this category include [40,42]. Proof scores
    for control protocols and automotive software standards still to be investigated.
    [57] reported an interesting rare among proof scores for leads-to-properties,
    and develops to domain specific region of proof scores.


    CafeML [51] is the recent implementation of CafeOBJ on the Maude system. Promising
    proof automation has been developed by [49,50] by use of the Maude programming
    facility.


    # 7.2. Distinct features of proof scores


    Comparing with the theorem provers like ACL2, Co, Isabelle/HOL, PVS, the specification
    verification with proof scores in CafeOBJ has the following characteristics.


    +   * Systems/services made via Algebraic Abstract Data Types (ADT) with equations
    and an appropriate abstraction level can be selected for each specification/property
    specification. Moreover, the equations are used directly as reduction/rewriting
    rules for proofs at the higher abstraction level.

    * The two major proof Fact 9 (PR1), Fact 11 (PR2) are simple and formalized, at
    the level of specification SP=P (i.e., any model of SP satisfies), and supporting
    model proofs. Another important proof formalized for Fact 14 is also simple and
    nicely harmonic with the rules (PR1, PR2).


    # 7.2.2. Reduction proof base


    A proof score succeeds if any of the reductions return the expected result, unless
    true. Each reduction with the equations in the current module, by using the current
    equations and the failed reduction result, the equations that are added for getting
    desirable reduction could be used. The following three are all declared as equations
    that are to be used in reductions, and a good chance to be predicted through the
    current and expected reduction results is this one and important feature base
    for the transparent (rewriting) proof score.


    +   * Necessary axioms and lemmas (see Example 6).

    * Exhaustive equations for case-splits.

    * Necessary induction hypotheses.


    # 7.2.3. Initiality, termination, confluence, completeness


    The proof scores prove the semantic properties of interest specifications. Each
    of the properties is supposed to be expressed in CafeOBJ''s properties (2,1,3),
    an invariant property (Fact 15), or a leads-to property (Fact 16). These properties
    are the primary indices of the quality of specifications. If a proof score succeeds
    in proving property then the equations (i.e., axioms) are shown to be sufficient
    enough to improve the property.


    Initiality (2,5), termination, confluence and completeness (2,6,3) (ITCS for short)
    are another properties of specifications. Each specification is better to satisfy
    these properties as much as depending on each context. There are many studies
    on such properties, e.g., [28,34,38,41,53] that help to make a specification satisfy
    them.


    (Σ, E) part of a transition specification need to be re-coded for proof scores
    (with boolean searches) to be valid (5,4,1). Other kind of proof scores do not
    assume that each specification satisfies any of ITCS properties, but the following
