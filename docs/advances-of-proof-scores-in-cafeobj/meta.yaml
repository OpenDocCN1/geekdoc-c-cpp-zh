    (ii) $Tr\in In(TS)((a_i, t_1, \dots, t_q) | (t_1, t_2, \dots, t_q) \in (T_{\Sigma})_{St}$

    (iii) $In\in [init].$


    The proof scores for the verification of invariant properties (Fact 15 (INV1))
