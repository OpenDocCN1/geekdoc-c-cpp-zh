    represent functions over the data (see Example 4). An operator $f \in F_{w_s}$
    or $f \in F_{w}$ with $w_s=s$ is a constructor of sort $s$. A sort $s \in S$ is
    *constrained* if there exists a constructor of $s$. Let $S^c$ be the set of all
    constrained sorts. An element of $S^c$ is a $s^c$-constrained sort.


