  \n# 第 5 章：状态 (State)\n\n状态是身份在某一时间点的值。\n\n这句话中包含了大量信息。让我们先拆解“值（value）”这个词。值是一个不可变的、持久的数据结构。当你完全可以用值进行编程时，生活会变得简单，正如我们在第\
  \ 4 章中所看到的，函数式编程。\n\n时间的流动使得事情变得困难得多。纽约洋基队现在和去年是一样的吗？1927 年的呢？洋基队的名单是一个身份，其值随时间而改变。\n\
  \n更新身份不会破坏旧值。事实上，更新身份对现有的值完全没有任何影响。洋基队可以交易每一位球员，或者因为无聊而解散，而不会以任何方式改变我们思考任何我们关心的过去的洋基队的能力。\n\
  \nClojure 的引用模型将身份（identities）与值（values）清晰地分开。Clojure 中的几乎一切都是值。对于身份，Clojure 提供了四引用类型：\n\
  \n*   `Refs` 管理共享状态的协调同步更改。\n*   `Atoms` 管理共享状态的非协调同步更改。\n*   `Agents` 管理共享状态的异步更改。\n\
  *   `Vars` 管理线程本地状态。\n\n本章将讨论这些 API 中的每一个。在章节结束时，我们将开发一个示例应用程序。贪蛇游戏演示了如何将应用程序模型划分为不可变和可变组件。\n\
  \n在开始之前，我们将回顾状态与并发、并行性之间的交集，并对传统的基于锁方法的局限性进行评论。\n\n## 5.1 并发、并行与锁\n\n并发程序模拟了多个事物同时发生的情况。并行程序则是取一个可以顺序执行的操作，并选择将其拆分为可以并发执行的独立部分，以加快整体执行速度。\n\
  \n编写并发程序有许多原因：\n\n*   几十年来，性能的提升源于更多的核心。现在，它们必须来自并发或并行程序。\n*   可能需要运行开销巨大的计算。\n\
  *   用户界面需要保持响应性。\n*   逻辑上独立的操作更容易进行测试。\n\n## 5.2 Refs 和事务内存\n\nClojure 中的大多数对象都是不可变的。当你真的需要可变数据时，你必须显式地说明，例如创建一个可变引用（`ref`）。你通过以下代码创建一个\
  \ ref：\n\n```\n(def current-track (ref \"Mars, the Bringer of War\"))\n```\n`'user/current-track`\n\
  \nref 封装并保护了对其内部状态的访问。要读取引用的内容，你可以调用 `deref`：\n\n```bash(deref current-track)\n\
  ```\n\n`deref` 函数可以缩写为读取宏 `@`。尝试同时使用 `deref` 和 `@` 来解引用 `current_track`：\n\n``````\n\
  (deref current-track)\n\"Mars, the Bringer of War\"\n\n@current-track\n\"Mars, the\
  \ Bringer of War\"\n```\n\n### ref-set\n\n你可以使用 `ref-set` 改变引用指向的位置：\n\n```bash(ref-set\
  \ reference new-value)\n```\n\n调用 `ref-set` 来监听不同的轨道：\n\n```\n(ref-set current-track\
  \ \"Venus, the Bringer of Peace\")\n```\n`java.lang.IllegalStateException: No transaction\
  \ running`\n\n哎呀。因为 refs 是可变的，你必须保护它们的更新。在 Clojure 中，你可以使用事务。事务封装在 `dosync` 中：\n\
  \n```bash\n(dosync & exprs)\n```\n\n将你的 `ref-set` 封装在 `dosync` 中，一切就正常了。\n\n\n\n\
  \n\n```clojure\n(dosync (ref-set current-track \"Venus, the Bringer of Peace\"))\n\
  \"Venus, the Bringer of Peace\" own\n```\n\n`current-track` 引用现在指向了一个不同的曲目。\n\n\
  ### 事务属性\n\n像数据库事务一样，STM 事务保证了某些重要的属性：\n\n*   更新是**原子性的（atomic）**。如果你在一个事务中更新了多个\
  \ ref，所有更新的累积效果对于任何不在事务内部的人来说，都表现为一个单一的瞬时事件。\n*   更新是**一致的（consistent）**的。Refs 可以指定验证函数。如果这些函数中的任何一个失败，整个事务都将失败。\n\
  *   更新是**隔离的（isolated）**。正在运行的事务看不到其他事务的已完成的结果。\n\n数据库提供了额外的保证，即更新是**持久的（durable）**的。由于\
  \ Clojure 的事务是内存事务事务，因此 Clojure 并不保证更新是持久的。如果你在 Clojure 中需要持久化事务，应该使用数据库。\n\n这四个事务属性合称为\
  \ ACID。数据库提供 ACID；而 Clojure 的 STM 提供 ACI。\n\n如果你在单个事务中更改了多个 ref，从事务外部的任何代码来看，这些更改都将被协调为“同时发生”。因此，你可以确保对\
  \ `current-track` 和 `current-composer` 的更新是协调的：\n\n```clojure\n(def current-track\
  \ (ref \"Venus, the Bringer of Peace\"))\n#'user/current-track\n(def current-composer\
  \ (ref \"Holst\"))\n#'user/current-composer\n```\n\n```clojure\n(dosync\n (ref-set\
  \ current-track \"Credo\")\n (ref-set current-composer \"Byrd\"))\n\"Byrd\"\n```\n\
  \n因为更新是在事务中进行的，所以任何其他线程永远都不会看到带有过时作曲家的更新后的曲目，反之亦然。\n\n### alter\n\n`current-track`\
  \ 的示例看起来非常简单，因为对 ref 的更新与任何之前的状态都完全无关。让我们构建一个更复杂的例子，其中事务需要更新现有信息。一个简单的聊天应用程序正适合这个。首先，创建一个包含发送者和某些文本的消息记录：\n\
  \n```clojure\n(defrecord Message [sender text])\n```\n\n现在，你可以通过实例化记录来创建消息：\n\n\
  ```clojure\n(user.Message. \"Aaron\" \"Hello\")\n#:user.Message{:sender \"Aaron\"\
  , :text \"Hello\"}\n```\n\n聊天应用程序的用户希望先看到最新的消息，因此列表是一个很好的数据结构。创建一个指向初始空列表的 `messages`引用：\n\
  \n```clojure\n(def messages (ref (\n```\n\n现在，你需要一个函数将新消息添加到 `messages` 的前面。你可以简单地使用\
  \ `deref` 获取消息列表，使用 `cons` 添加新消息，然后使用 `ref-set` 将更新后的列表回 `messages`：\n\n```clojure\n\
  ; 坏主意\n(defn naive-add-message [msg]\n  (dosync (ref-set messages (cons msg @messages))))\n\
  ```\n\n但有一个更好的选择。为什么不在在一个步骤中执行读取和更新呢？Clojure 的 `alter` 会在事务内对引用的对象应用更新函数：\n\n```clojure\n\
  (alter ref update-fn & args..)\n```\n\n`alter` 返回事务内 ref 的新值。当事务成功完成时，ref 将取其在事务内的最后一个值。使用\
  \ `alter` 代替 `ref-set` 使代码更易读：\n\n```clojure\n(defn add-message [msg]\n  (dosync\
  \ (alter messages conj msg)))\n```\n\n注意更新函数是 `conj`（“conjoin”的缩写），而不是 `cons`。这是因为\
  \ `conj` 接收参数的适用于 `alter`：\n\n```clojure\n(cons item sequence)\n(conj sequence item)\n\
  ```\n\n`alter` 函数在调用其 `update-fn` 时会将当前引用值作为第一个参数传递，正如 `conj` 预期的那样。如果你计划编写自己的更新函数，它们应该遵循与\
  \ `conj` 相同的结构：\n\n```clojure\n(your-func thing-that-gets-updated & optional)\n\
  ```\n\n尝试添加几条消息看看它是否有效：\n\n```clojure\n(dosync (ref-set current-track \"Venus, the\
  \ Bringer of Peace\"))\n\"Venus, the Bringer of Peace\"\n```\n\n```clojure\n(dosync\n\
  \ (ref-set current-track \"Credo\")\n (ref-set current-composer \"Byrd\"))\n\"Byrd\"\
  \n```\n\n```clojure\n(dosync (ref-set current-track \"Venus, the Bringer of Peace\"\
  ))\n\"Venus, the Bringer of Peace\"\n```\n\n```clojure\n(dosync\n (ref-set current-track\
  \ \"Credo\")\n (ref-set current-composer \"Byrd\"))\n\"Byrd\"\n```\n\n```clojure\n\
  (alter messages conj msg)\n)\n```\n\n```clojure\n(dosync (ref-set current-track\
  \ \"Venus, the Bringer of Peace\"))\n\"Venus, the Bringer of Peace\"\n```\n\n```clojure\n\
  (dosync\n (ref-set current-track \"Credo\")\n (ref-set current-composer \"Byrd\"\
  ))\n\"Byrd\"\n```\n\n```clojure\n(dosync (ref-set current-track \"Venus, the Bringer\
  \ of Peace\"))\n\"Venus, the Bringer of Peace\"\n```\n\n```clojure\n(dosync\n (ref-set\
  \ current-track \"Credo\")\n (ref-set current-composer \"Byrd\"))\n\"Byrd\"\n```\n\
  \n```clojure\n(alter messages conj msg)\n```\n\n### STM 如何工作：MVCC\n\nClojure 的 STM\
  \ 使用一种被称为多版本并发控制（MVCC）的技术，这也被用于数据库。以下是 MVCC 的工作原理。\n\n事务 A 开始获取一个点（point），它仅仅是一个唯一的时间戳。事务\
  \ A 拥有自己的私有副本。如果在任何一点，STM 检测到另一个事务已经更改了 ref，事务 A 将强制重试。如果你从 `dosync` 块抛出异常，则事务 A\
  \ 将终止而不重试。\n\n当且当事务 A 提交时，它的私有写入对世界可见，并关联到一个单一的点。持久数据结构使得提供这些私有副本变得廉价。在事务期间，对 ref\
  \ 的操作是针对其私有副本进行的。\n\n有时 `alter` 所暗示的方法太谨慎了。如果在你的事务中间，另一个事务修改了 ref 怎么办？如果你在这种情况下仍然愿意提交更改，你可以用\
  \ `commute` 获得 `alter` 的性能。\n\n### commute\n\n`commute` 是 `alter` 的一个特殊变体，允许更高的并发：\n\
  \n```clojure\n(commute ref update-fn & args..)\n```\n\n当然，这存在权衡。Commute 之所以命名是因为它们必须是交换的（commutative）。也就是说，更新必须能够任何顺序发生。这赋予了\
  \ STM 系统自由重新排列的能力。\n\n要使用 `commute`，只需在你的 `add-message` 实现中将 `alter` 替换为 `commute`：\n\
  \n```clojure\n(defn add-message-commute [msg]\n  (dosync (commute messages conj\
  \ msg)))\n```\n\n`commute` 返回 ref 的新值。然而，由于重排，你从 `commute` 获取的事务内值并不总是匹配 ref 的事务结束值。如果另一个事务偷偷修改了你正尝试\
  \ `commute` 的 ref，STM 不会重启你的事务。相反，它只会再次运行你的 `commute` 函数，且是无序的。你的事务永远看不到你的 `commute`\
  \ 函数最终运行的 ref 值。\n\n由于 Clojure 的 STM 可以在你背后重新排列能够，因此只有在你不在乎顺序时才能使用它们。从字面上来说，这对于聊天应用程序是不成立的。消息列表显然是有顺序的，如果两次消息添加被反转，结果列表将无法正确显示消息到达的顺序。\n\
  \n\n\n\n从实践上来说，聊天消息的更新具有足够的交换性。基于 `STM` 的消息重排可能会在微秒或更短的时间尺度上发生。对于聊天应用的用户来说，由于网络和人为延迟，在更长的时间尺度上已经存在重排现象。（回想一下你曾在在线聊天中“抢话”的情况，那是因为另一个发言者的消息还没传到你。）由于这些较大的重排是无法修复的，聊天应用忽略从\
  \ Clojure 的 `STM` 中冒泡出来的较小重排是合理的。\n\n### 优先使用 alter\n\n许多更新并不是可交换的。例如，考虑一个返回递增数字序列的计数器。你可能使用此类计数器在系统中构建唯一\
  \ ID。计数器可以是一个指向数字的简单引用：\n\n| [src/examples/concurrency.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/concurrency.clj)\
  \ |\n| :--- | `(def counter (ref 0))` |\n\n你不应该使用 `commute` 来更新计数器。`commute` 返回的是执行\
  \ `commute` 时计数器在事务中的值，但重排可能会导致事务结束时的实际值不同。这可能导致多个调用者获取相同的计数器值。相反，请使用 `alter`：\n\
  \n| :--- | `(defn next-counter [] (dosync (alter counter inc)))` |\n\n尝试调用几次 `next-counter`\
  \ 以验证计数器运行符合预期：\n\n| :--- | `(next-counter)` |\n| :--- | `-> 1` |\n| :--- | `(next-counter)`\
  \ |\n| :--- | `-> 2` |\n\n通常情况下，你应该优先选择 `alter` 而不是 `commute`。它的语义易于理解且防错。相反，`commute`\
  \ 要求你仔细考虑事务语义。如果你在 `commute` 足够的情况下使用 `alter`，最坏的结果也只是性能下降。但如果你在需要 `alter` 的地方使用了\
  \ `commute`，将会引入一个用自动化测试难以检测的微妙 bug。\n\n### 为 Refs 添加验证逻辑\n\n数据库事务通过各种完整性检查来维护一致性。你可以通过\
  \ Clojure 的事务内存实现类似的操作，在创建 ref 时指定验证函数：\n\n| :--- | `(ref initial-state options*)`\
  \ |\n| :--- | `; options include:` |\n| :--- | `; :validator validate-fn` |\n| :---\
  \ | `; :meta metadata-map` |\n\n`ref` 的选项包含一个可选的验证函数，该函数可以抛出异常以防止事务完成。注意 `options`\
  \ 不是一个 map；它只是被插入到函数调用中的键值对序列。\n\n继续聊天示例，为 `messages` ref 添加一个验证函数，确保所有消息的 `:sender`\
  \ 和 `:text` 都有非 `nil` 的值：\n\n| [src/examples/chat.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/chat.clj)\
  \ |\n| :--- | `(def validate-message-list` |\n| :--- | ` (partial every? (#(and\
  \ (:sender %) (:text %))))` |\n| :--- | `(def messages (ref () :validator validate-message-list))`\
  \ |\n\n这种验证就像数据库事务中的表键约束。如果约束失败，整个事务将回滚。尝试添加一个格式不正确的消息，例如简单的字符串：\n\n| :--- | `(add-message\
  \ \"not a valid message\")` |\n| :--- | `-> java.lang.IllegalStateException: Invalid\
  \ reference state` |\n| :--- | `@messages` |\n| :--- | `-> ()` |\n\n符合约束的消息没有问题：\n\
  \n| :--- | `(add-message (user.Message. \"Aaron\" \"Real Message\"))` |\n| :---\
  \ | `-> (:user.Message{:sender \"Aaron\", :text \"Real Message\"})` |\n\nRefs 是协调访问共享状态的优秀工具，但并非所有任务都需要这种协调。对于更新单个孤立数据，请优先使用\
  \ atom。\n\n## 5.3 使用 Atoms 进行无协调的同步更新\n\nAtom 是比 ref 更轻量级的机制。当多个 ref 更新可以在事务中协调时，atom\
  \ 则允许对单个值进行更新，且与任何其他都不协调。\n\n你通过 `atom` 创建 atom，其签名与 `ref` 非常相似：\n\n| :--- | `(atom\
  \ initial-state options?)` |\n| :--- | `; options include:` |\n| :--- | `; :validator\
  \ validate-fn` |\n| :--- | `; :meta metadata-map` |\n\n你可以解引用一个 atom 来获取其值，就像处理\
  \ ref 一样：\n\n| :--- | `(deref atom)` |\n\nAtom 不参与事务。当 `swap!` 返回时，值已经改变了。\n\n\n\
  \n尽管 `send` 并不知道 agent 的新值，但 REPL 可能知道。取决于 agent 线程或 REPL 线程哪个先运行，你可能会在之前的输出的冒号后看到\
  \ `1` 或 `0`。\n\n你可以使用 `deref`/`@` 来检查 agent 的当前值，就像检查 ref 一样。当你准备检查 `counter` 时，`inc`\
  \ 几乎已经在线程池中完成，并将值提升到了 1：\n\n| | `@counter` |\n| | `-> 1` |\n\n如果 REPL 和 agent 线程之间的竞态条件让你感到困扰，有一个解决方案。如果你想确保\
  \ agent 已经完成了你发送给它的操作，可以调用 `await` 或 `await-for`：\n\n| | `(await & agents)` |\n\
  | | `(await-for timeout-millis & agents)` |\n\n这些函数将导致当前线程阻塞，直到从当前线程或 agent 发送的所有操作都完成。如果超时，`await-for`\
  \ 将返回 `nil`，否则返回非 `nil` 值。`await` 没有超时限制，所以要小心：`await` 愿意永远等下去。\n\n### 验证 Agent\
  \ 和处理错误\n\nAgent 与 ref 还有其他共同点。它们也可以接受一个验证函数：\n\n| | `(agent initial-state options*)`\
  \ |\n| | `; options include:` |\n| | `:validator validate-fn` |\n| | `:meta metadata-map`\
  \ |\n\n使用验证器重新创建 `counter`，以确保它是一个数字：\n\n| | `(def counter (agent 0 :validator number?))`\
  \ |\n| | `-> #'user/counter` |\n\n尝试通过传递一个忽略当前值并简单返回字符串的更新函数，将 agent 设置为一个非数字的值：\n\
  \n| | `(send counter (fn [_] \"boo\"))` |\n| | `-> #<clojure.lang.Agent@4de8ce62:\
  \ 0>` |\n\n一切看起来都良好（到目前），因为 `send` 仍然会立即返回。在 agent 尝试在池线程中更新自身后，它将进入异常状态。当你尝试解引用\
  \ agent 时，你会发现错误：\n\n| | `@counter` |\n| | `-> java.lang.Exception: Agent has errors`\
  \ |\n\n要发现特定的错误（或多个错误），调用 `agent-errors`，它将返回在 agent 操作期间抛出的错误序列：\n\n| | `(agent-errors\
  \ counter)` |\n| | `-> (#<IllegalStateException ...>)` |\n\n一旦 agent 发生错误，所有后续查询\
  \ agent 的尝试都将返回错误。你可以通过调用 `clear-agent-errors` 使 agent 再次可用：\n\n| | `(clear-agent-errors\
  \ agent)` |这会将 agent 返回到错误之前的状态。清除 `counter` 的错误，并验证其状态与错误发生前相同：\n\n| | `(clear-agent-errors\
  \ counter)` |\n| | `-> nil` |\n| | |\n| | `@counter` |\n| | `-> 0` |\n\n现在你已经知道了\
  \ agent 的基础知识，让我们结合 ref 和事务使用它们。\n\n### 在事务中包含 Agent\n\n事务不应该有副作用，因为 Clojure 可能会重试任意次数的任务。但有时你希望事务成功时产生副作用。Agent\
  \ 提供了一个解决方案。如果你在事务内部向 agent 发送操作，那么当且仅当事务成功时，该操作会被发送一次。\n\n作为这种用例的示例，考虑一个在事务成功时写入文件的\
  \ agent。你可以将此类 agent 与 commute 中的聊天示例结合，以自动备份聊天消息。首先，创建一个 `backup-agent` 来存储要写入的\
  \ `filename`：\n\n| [src/examples/concurrency.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/concurrency.clj)\
  \ |\n| | `(def backup-agent (agent \"output/messages-backup.clj\"))` |\n\n然后，创建\
  \ `add-message` 的修改版本。新函数 `add-message-with-backup` 应该额外做两件事：\n\n*   在 `let` 绑定中获取\
  \ `commute` 的返回值，即当前的消息数据库。\n*   在事务内部仍然，向备份 agent 发送一个操作，将消息数据库写入 `filename`。为了简单起见，让操作函数返回\
  \ `filename`，这样 agent 将使用相同的文件名。\n\n```clojure\n(defn add-message-with-backup [message]\n\
  \  (let [db (commute)]\n    (dosync\n      (send backup-agent (fn [file]\n     \
  \   (spit file db)\n        file))\n      ...))\n```\n\n### 统一更新模型\n\n正如你所见，refs、atoms\
  \ 和 agents 都提供了通过将函数应用到之前的状态来更新其状态的。这种处理共享状态的统一模型是 Clojure 的核心概念之一。统一模型和各种辅助函数总结在下表中。\n\
  \n| 更新机制 | Ref 函数 | Atom 函数 | Agent 函数 |\n| --- | --- | --- | --- |\n| 函数应用 | `alter`\
  \ | `swap!` | `send-off` |\n| 函数（交换律） | `commute` | N/A | N/A |\n| 函数（非阻塞） | N/A\
  \ | N/A | `send` |\n| 简单 setter | `ref-set` | `reset!` | N/A |\n\n统一模型是更新 refs、atoms\
  \ 和 agents 最重要的方式。相比之下，辅助函数是源于每个 API 特有语义的优化和选项：\n\n*   `commute` 优化的机会出现在协调更新时。由于只有\
  \ ref 提供协调更新，因此 `commute` 仅对 ref 有意义。\n*   对 ref 和 atom 的更新是在调用它们的线程上进行的，因此它们不提供调度选项。Agent\
  \ 稍后在线程池中更新，使得阻塞/非阻塞是一个相关的调度选项。\n\nClojure 的最后一种引用类型 `var` 是完全不同的野兽。它们不参与统一更新模型，而是用于管理线程本地的私有状态。\n\
  \n\n\n\n当你调用 `def` 或 `defn` 时，你创建了一个动态变量（dynamic var），通常直接称为 var。在书中目前为止的所有示例中，你向\
  \ `def` 传递了一个初始值，该值成为该 var 的根绑定（root binding）。例如，以下代码为 `` `foo` `` 创建了一个值为 `10`\
  \ 的根绑定：\n\n|   | `(def ^:dynamic foo 10)` |\n|   | `-> #'user/foo` |\n\n`` `foo`\
  \ `` 的绑定被所有线程共享。你可以在自己的线程上检查 `` `foo` `` 的值：\n\n|   | `foo` |\n|   | `-> 10` |\n\
  \n你也可以从另一个线程验证 `` `foo` `` 的值。创建一个新线程，向它传递一个打印 `` `foo` `` 的函数。别忘记 `start` 该线程：\n\
  \n```\nuser=> (.start (Thread. (fn [] (println foo))))\n-> nil\n| 10\n```\n\n在上一个示例中，对\
  \ `start` 调用返回 `nil`，然后从新线程打印 `foo` 的值。\n\n大多数 var 都倾向于永久保留其根绑定。然而，你可以使用 `binding`\
  \ 宏为 var 创建线程局部绑定（thread-local binding）：\n\n```\n(binding [bindings] & body)\n```\n\
  \n绑定具有动态作用域（dynamic scope）。换句话说，绑定在线程执行的任何地方都是可见的，直到线程离开开始绑定的作用。绑定对任何其他线程不可见。\n\n\
  在结构上，`binding` 看起来非常像 `let`。为 `` `foo` `` 创建一个线程局部绑定并检查它的值：\n\n```\n(binding [foo\
  \ 42] foo)\n-> 42\n```\n\n要看到 `binding` 和 `let` 之间的区别，创建一个打印 `` `foo` `` 值的简单函数：\n\
  \n```\n(defn print-foo [] (println foo))\n-> #'user/print-foo\n```\n\n现在，尝试分别从 `let`\
  \ 和 `binding` 中调用 `print-foo`：\n\n```\n(let [foo \"let foo\"] (print-foo))\n| 10\n\
  \n(binding [foo \"bound foo\"] (print-foo))\n-> bound foo\n```\n\n如你所见，`let` 在其自身的形式之外没有影响，因此第一个\
  \ `print-foo` 打印的是根绑定 `10`。相反，`binding` 在任何从绑定形式开始的调用链中都保持有效，因此第二个 `print-foo` 打印的是\
  \ `bound foo`。\n\n### 远端作用\n\n用于动态绑定的 var 有时被称为特殊变量（special variables）。在前后各加上星号来命名它们是一种良好的风格。例如，Clojure\
  \ 使用动态绑定处理线程范围的选项，如标准 I/O 输出流 `` `*in* ``、`` `*out* `` 和 `` `*err*` ``。动态绑定允许“远端作用”（action\
  \ at a distance）。当你更改动态绑定时，你可以在不改变任何函数参数的情况下改变远程函数的行为。\n\n远端作用的一种是临时增强函数的行为。在某些语言中，这会被归类为面向切面的编程；在\
  \ Clojure 中，它只是动态绑定的副作用。例如，假设你有一个执行昂贵计算的函数。为了模拟这一点，编写一个名为 `slow-double` 的函数，它睡眠十分分之一秒然后将输入翻倍。\n\
  \n```\n(defn ^:dynamic slow-double [n]\n (Thread/sleep 100)\n (* n 2))\n```\n\n\
  接下来，编写一个名为 `calls-slow-double` 的函数，为 `[1 2 1 2 1 2]` 中的每个项目调用 `slow-double`：\n\n\
  ```\n(defn calls-slow-double []\n (map slow-double [1 2 1 2 1 2]))\n```\n\n对 `calls-slow-double`\
  \ 的调用进行计时。由于六次对 `slow-double` 的内部调用，它应该花费超过六十分分之一秒。注意，你必须通过 `dorun` 运行结果，否则 Clojure\
  \ 的 `map` 会通过立即返回惰性序列来胜过你。\n\n```\n(time (dorun (calls-slow-double)))\n| \"Elapsed\
  \ time: 601.418 msecs\"\n-> nil\n```\n\n阅读代码，你可以发现 `calls-slow-double` 很慢是因为它在重复执行相同的工作。（注：此处原文存在大量重复句子，翻译已按要求精简）。\n\
  \n阅读代码，你可以发现 `calls-slow-double` 很慢是因为它在重复执行相同的工作。\n\n### 与 Java 工作\n\n许多 Java API\
  \ 依赖回调。GUI 框架如 Swing 使用事件处理器来响应输入。XML 解析器如 SAX 依赖用户。在 Clojure 中，满足此类 API 的最佳方法是使用动态绑定。这涉及类似于变量的可变引用，但因为它们是在单线程环境下使用的，所以不会产生任何问题。Clojure\
  \ 提供了 `set!` 特殊形式来设置线程局部绑定：\n\n```\n(set! var-symbol new-value)\n```\n\n\n\n\n\n\
  ```clojure\n(set! *stack* (pop *stack))\n(set! *state* :between)\nnil)\n```\n\n\
  ### SAX 解析与状态管理模型\n\nSAX 解析器在遇到 XML 起始标签时会调用 `startElement`。回调处理程序会更新三个线程局部变量。`*stack*`\
  \ 是一个栈，包含了当前元素所在嵌套的所有元素。`*current*` 是当前元素，而 `*state*` 则跟踪内部的内容类型。（这主要在处理字符数据内部时非常重要，但此处未显示。）\n\
  \n`endElement` 通过从 `*stack*` 中弹出元素并将 `*stack*` 的栈顶元素重新赋值给 `*current*`，来撤销 `startElement`\
  \ 的工作。\n\n值得注意的是，这种编码风格是行业标准：对象是可变的，且程序对并发可能性的完全不感知。Clojure 允许这种风格作为一种显式的特例，你应该仅在为了相互操作（interop）时使用它。\n\
  \n`ContentHandler` 使用 `set!` 并不会可变数据泄露到 Clojure 的其他部分。Clojure 使用 `ContentHandler`\
  \ 的实现来构建不可变的 Clojure 结构。\n\n你现在已经看到了处理状态四种模型。由于 Clojure 是构建在 Java 之上的，你也可以使用 Java\
  \ 基于锁的模型。这些模型及其用途总结在下表中。\n\n| 模型 | 用途 | 函数 |\n| --- | --- | --- |\n| Refs 和 STM\
  \ | 协调的同步更新 | 纯 |\n| Atoms | 非协调的同步更新 | 纯 |\n| Agents | 非协调的异步更新 | 任意 |\n| Vars\
  \ | 线程局部动态作用域 | 任意 |\n| Java locks | 协调的同步更新 | 任意 |\n\n让我们把这些模型应用于设计一个小但完整的应用程序。\n\
  \n## 5.6 一个 Clojure 贪蛇\n\n贪蛇游戏的特点是一个玩家控制的蛇，它在游戏网格中移动寻找苹果。当你的蛇吃到苹果时，它会增长一段，并出现一个新苹果。如果你的蛇达到特定长度，你就赢了。但如果你的蛇穿过了自己的身体，你就输了。\n\
  \n在开始构建自己的蛇之前，花一分钟尝试一下完成的版本。在书的 REPL 中输入以下内容：\n\n```clojure\n(use 'examples.snake)\n\
  (game)\n-> [#<Ref clojure.lang.Ref@65694ee6> #<Ref clojure.lang.Ref@261ae209> #<Timer\
  \ javax.swing.Timer@7f0df737>]\n```\n\n选择蛇窗口，使用方向键控制你的蛇。\n\n我们对蛇的设计将利用 Clojure 的函数特性以及对显式可变状态的支持，将游戏分为三层：\n\
  \n*   函数式模型将使用纯函数尽可能地对游戏建模。\n*   可变模型将处理游戏的可变状态。可变模型将使用本章讨论的一个或多个引用模型。可变状态难以测试得多，因此我们将保持这部分很小。\n\
  *   GUI 将使用 Swing 来绘制游戏并接受用户输入。\n\n这些层将使贪蛇易于构建、测试和维护。\n\n在你学习此示例时，将你的代码添加到示例代码中的\
  \ `reader/snake.clj` 文件中。打开该文件时，你会发现它已经导入/使用了你所需的 Swing 类和 Clojure 库：\n\n```clojure\n\
  (ns reader.snake\n  (:import (java.awt Color Dimension)\n          (javax.swing\
  \ JPanel JFrame Timer JOptionPane)\n          (java.awt.event ActionListener KeyListener))\n\
  \  (:use examples.import-static))\n(import-static java.awt.event.KeyEvent VK_LEFT\
  \ VK_RIGHT VK_UP VK_DOWN)\n```\n\n现在你准备好构建函数式模型了。\n\n### 其他蛇的实现\n\n实现蛇的方法不止一种。你可能喜欢将这里展示的蛇与这些蛇进行比较：\n\
  \n*   David Van Horn 的 Snake 用 Typed Scheme 编写的，它没有可变状态。\n*   Jeremy Read 写了一个 Java\
  \ 版的蛇，设计目标是“在 Java 中尽可能小且仍保持可读性”。\n*   Abhishek Reddy 用 Clojure 写了一个极其微小的（35 行）蛇。设计目标是达到异常的简短。\n\
  *   Dale Vaillancourt 的 Worm（蠕虫）。\n*   Mark Volkmann 写了一个为了可读性设计的 Clojure 蛇。\n\n\
  每种蛇的实现都有自己的风格。你喜欢什么样的风格呢？\n\n### 函数模型\n\n首先，创建一组常量来描述时间、空间和运动：\n\n```clojure\n(def\
  \ width 75)\n(def height 50)\n(def point-size 10)\n(def turn-millis 75)\n(def win-length\
  \ 5)\n(def dirs {VK_LEFT [-1 0] VK_RIGHT [1 0] VK_UP [0 -1] VK_DOWN [0 1]})\n```\n\
  \n`width` 和 `height` 设置了游戏板的大小，`point-size` 用于将游戏点转换为像素。`turn-millis` 是游戏的心跳，控制在每次更新棋板之前经过的毫秒数。`win-length`\
  \ 是你的蛇在赢得游戏前需要的段数（五是一个无聊的小数字）。`dirs` 将四个方向的符号常量映射到它们的向量等效值。由于 Swing 已经定义了 `VK_`\
  \ 常量，我们将直接复用它们而不是自己定义。\n\n接下来，为游戏创建一些基础函数：\n\n```clojure\n(defn add-points [& pts]\n\
  \  (vec (apply + pts)))\n\n(defn point-to-screen-rect [pt]\n  (map (* point-size)\
  \ (pt)))\n```\n\n`add-points` 将点相加。你可以使用 `add-points` 计算移动对象的新位置。例如，你可以让 `[10, 10]`\
  \ 的对象向左移动一位：\n\n```clojure\n(add-points [10 10] [-1 0])\n-> [9 10]\n```\n\n`point-to-screen-rect`\
  \ 仅将游戏空间的点转换为屏幕上的矩形：\n\n```clojure\n(point-to-screen-rect [5 10])\n-> (50 100 10\
  \ 10)\n```\n\n接下来，让我们写一个创建苹果的函数：\n\n```clojure\n(defn create-apple []\n  {:location\
  \ [(rand-int width) (rand-int height)]\n  :color (Color. 210 50 90)\n  :type :apple})\n\
  ```\n\n苹果占据一个点，它保证在游戏板上。蛇要复杂一点：\n\n```clojure\n(defn create-snake []\n  {:body (list\
  \ [1 1])\n  :dir [1 0]\n  :type :snake\n  :color (Color. 15 160 70)})\n```\n\n由于蛇可以占据板上的多个点，它有一个\
  \ `:body`，这是一个点列表。此外，蛇始终以 `:dir` 表示的方向在运动。\n\n接下来，创建一个移动蛇的函数。这个函数应该是一个纯函数，返回一条新蛇。它还应该接受一个\
  \ `grow` 选项，允许蛇在吃到苹果后增长。\n\n```clojure\n(defn move {:keys [body dir] :as snake}\
  \ & grow]\n  (assoc snake :body (cons (add-points (first body) dir)\n      (if grow\
  \ body (butlast body)))))\n```\n\n`move` 使用了一个相当复杂的绑定表达式。`{:keys [body dir]}` 部分使蛇的\
  \ `body` 和 `dir` 作为绑定可用，而 `:as snake` 部分将 `snake` 绑定到整个蛇。该函数的执行如下：\n\n1.  `add-points`\
  \ 创建一个新点，它是原始蛇头部根据蛇运动方向偏移后的点。\n\n\n\n\n2. `cons` 将新点添加到蛇的头部。如果蛇正在生长，则保留整个原始蛇。否则，它会保留原始蛇中除最后一段（`butlast`）以外的所有部分。\n\
  \n3. `assoc` 返回一个新的蛇，它是旧蛇的拷贝，但更新了 `:body`。\n\n通过移动和让蛇生长来测试 `move`：\n\n```clojure\n\
  (move (create-snake))\n-> {:body ([2 1]), ; etc.}\n\n(move (create-snake) :grow)\n\
  -> {:body ([2 1] [1 1]), ; etc.}\n```\n\n编写一个 `win?` 函数来测试蛇是否赢了游戏：\n\n```clojure\n\
  (defn win? [{body :body}]\n  (>= (count body) win-length))\n```\n\n针对不同的身体长度测试 `win?`。注意，`win?`\
  \ 仅绑定了 `:body`，所以你不需要一个“真实的”蛇，只需要任何带有 `body` 属性的对象即可：\n\n```clojure\n(win? {:body\
  \ [[1 1]]})\n-> false\n\n(win? {:body [[1 1] [1 2] [1 3] [1 4] [1 5]]})\n-> true\n\
  ```\n\n如果蛇的头部再次与其身体的其他部分接触，则输了。编写一个 `head-overlaps-body?` 函数来测试这一点，并用它来定义 `lose?`：\n\
  \n```clojure\n(defn head-overlaps-body? [{[head & body] :body}]\n  (contains? (set\
  \ body) head))\n\n(def lose? head-overlaps-body?)\n```\n\n针对重叠和不重叠的蛇身体测试 `lose?`：\n\
  \n```clojure\n(lose? {:body [[1 1] [1 2] [1 3]]})\n-> false\n\n(lose? {:body [[1\
  \ 1] [1 2] [1 1]]})\n-> true\n```\n\n如果蛇的头部占据了苹果的位置，则表示吃了苹果。定义一个 `eats?` 函数来测试这一点：\n\
  \n```clojure\n(defn eats? [{[snake-head] :body} {apple :location}]\n  (= snake-head\
  \ apple))\n```\n\n注意 `eats?` 函数的主体有多整洁。所有工作都在绑定中完成：`{[snake-head] :body}` 将 `snake-head`\
  \ 绑定到蛇 `:body` 的第一个元素，而 `{apple :location}` 将 `apple` 绑定到苹果的 `:location`。在 REPL\
  \ 中测试 `eats?`：\n\n```clojure\n(eats? {:body [[1 1] [1 2]]} {:location [2 2]})\n\
  -> false\n\n(eats? {:body [[2 2] [1 2]]} {:location [2 2]})\n-> true\n```\n\n最后，你需要某种方法来\
  \ `turn` 蛇，更新它的 `:dir`：\n\n```clojure\n(defn turn [snake newdir]\n  (assoc snake\
  \ :dir newdir))\n```\n\n`turn` 返回一个更新了方向的新蛇：\n\n```clojure\n(turn (create-snake)\
  \ [0 -1])\n-> {:body ([1 1]), :dir [0 -1], ; etc.}\n```\n\n你到为止编写的所有代码都是贪吃蛇游戏函数式模型的一部分。它容易理解，部分是因为它没有局部变量，也没有可变状态。正如你将在下一节看到的，游戏中的可变状态数量非常小。（甚至可以在不使用可变状态的情况下贪吃蛇，但这不是本演示的目的。）\n\
  \n### 使用 STM 构建可变模型\n\n贪吃蛇游戏的可变状态只有通过三种方式改变：\n\n- 游戏可以重置为初始状态。\n- 每一回合，蛇都会更新其位置。如果它吃了苹果，就会放置一个新苹果。\n\
  - 蛇可以转向。\n\n我们将这些更改中的每一个实现为函数，在事务内部修改 Clojure refs。这样，蛇和苹果位置的更改将是同步且协调的。\n\n`reset-game`\
  \ 是显而易见的：\n\n```clojure\n(defn reset-game [snake apple]\n  (dosync (ref-set apple\
  \ (create-apple))\n    (ref-set snake (create-snake)))\n  nil)\n```\n\n你可以通过传入一些\
  \ refs 然后检查它们解引用是否为蛇和苹果来测试 `reset-game`：\n\n```clojure\n(def test-snake (ref nil))\n\
  (def test-apple (ref nil))\n\n(reset-game test-snake test-apple)\n-> nil\n\n@test-snake\n\
  -> {:body ([1 1]), :dir [0 -1], ; etc.}\n\n@test-apple\n-> {:location [5 2], ; etc.}\n\
  ```\n\n`update-direction` 甚至更；它只是 `turn` 的一个封装：\n\n```clojure\n(defn update-direction\
  \ [snake newdir]\n  (dosync (alter snake :dir newdir)))\n```\n\n如果蛇吃了苹果，就会创建一个新苹果。否则，蛇只需移动。最复杂的函数是\
  \ `update-positions`。\n\n`paint` 两个两个参数：`g` 是一个 `java.awt.Graphics` 实例，`object`\
  \ 是要绘制的对象。`defmulti` 包含一个可选的 `rest` 参数，以便未来的 `paint` 实现可以选择接收更多参数。（参见第 8.2 节，*Defining\
  \ Multimethods* 获取 `defmulti` 的深入描述。）第 3 行，`paint` 的 `:apple` 方法绑定了苹果的 `location`\
  \ 和 `color`，并使用它们在屏幕上绘制一个点。第 6 行，`:snake` 方法绑定了蛇的 `body` 和 `color`，然后使用 `doseq`\
  \ 绘制 `body` 中的每个 `point`。\n\n```clojure\n(defmulti paint [g object & rest]\n  (apple\
  \ [g {:keys location color}]\n    (fill-point g location))\n  (snake [g {:keys body\
  \ color}]\n    (doseq [point body]\n      (fill-point g point))))\n```\n\n贪吃蛇 GUI\
  \ 由绘制各种组件的函数组成。UI 的主体是 `game-panel` 函数，它创建一个 Swing `JPanel`，并带有绘制游戏、每次定时器触发更新以及响应用户输入的处理器：\n\
  \n```clojure\n(defn game-panel [frame snake apple]\n  (proxy [ActionListener KeyListener]\
  \ []\n    (paintComponent [g]\n      (proxy-super paintComponent g)\n      (paint\
  \ g @snake)\n      (paint g @apple))\n    (actionPerformed [e]\n      (update-positions\
  \ snake apple)\n      (when (lose? @snake)\n        (reset-game snake apple)\n \
  \       (JOptionPane/showMessageDialog frame \"You lose!\"))))\n```\n\n\n\n\n\n\
  ```clojure\n(when (win? @snake))\n(reset-game snake apple)\n(JOptionPane/showMessageDialog\
  \ frame \"You win!\")\n(.repaint this)\n(keyPressed [e])\n(update-direction snake\
  \ (dirs (.getKeyCode e))))\n(getPreferredSize [])\n(Dimension (inc width) point-size)\n\
  ((inc height) point-size)\n(keyReleased [e])\n(keyTyped [e])\n```\n\n`game-panel`\
  \ 虽然很长但很简单。它使用 `proxy` 创建了一个具有一组 Swing 回调方法的面板。\n\n*   Swing 调用 `paintComponent`（第\
  \ 3 行）来绘制面板。`paintComponent` 调用 `proxy-super` 来执行标准的 `JPanel` 行为，然后绘制蛇和苹果。\n*  \
  \ Swing 会在每次定时器滴答时调用 `actionPerformed`（第 7 行）。`actionPerformed` 更新蛇和苹果的位置。如果游戏结束，它会显示一个对话框并重置游戏。最后，它通过\
  \ `(.repaint this)` 触发重绘。\n*   Swing 在响应键盘输入时调用 `keyPressed`（第 16 行）。`keyPressed`\
  \ 调用 `update-direction` 来改变蛇的方向。（如果键盘输入不是方向键，`dirs` 函数返回 `nil`，且 `update-direction`\
  \ 将不执行。）\n*   游戏面板忽略了 `keyReleased` 和 `keyTyped`。\n\n`game` 函数创建一个新游戏：\n\n```clojure\n\
  (defn game []\n  let [snake (ref (create-snake))\n        apple (ref (create-apple))\n\
  \        frame (JFrame \"Snake\")\n        panel (game-panel frame snake apple)\n\
  \        timer (Timer. turn-millis panel)]\n  (doto panel\n    (.setFocusable true)\n\
  \    (.addKeyListener panel))\n  (doto frame\n    (.add panel)\n    (.pack)\n  \
  \  (.setVisible true)\n    (.start timer))\n  [snake, apple, timer])\n```\n\n在第\
  \ 2 行，`game` 创建了所有必要的游戏对象：可变模型对象 `snake` 和 `apple` 以及 UI 组件 `frame`、`panel` 和 `timer`。第\
  \ 7 行和第 10 行执行了 `panel` 和 `frame` 的样板初始化。第 14 行通过启动定时器开始游戏。\n\n第 15 行返回一个包含蛇、苹果和时间的向量。这是为了方便在\
  \ REPL 中进行测试：你可以使用这些对象来移动蛇和苹果，或启动和停止游戏。\n\n继续去再玩一次游戏吧；这是你应得的。要开始游戏，请在 REPL 中使用蛇库并运行\
  \ `game`。如果你是自己输入的代码，可以使用你选择的库名称（说明中为 `examples.reader`）；否则，你可以使用 `examples.snake`\
  \ 中的完整版示例：\n\n```clojure\n(use 'examples.snake)\n(game)\n-> [#<Ref clojure.lang.Ref@6ea27cbe>\
  \ #<Ref clojure.lang.Ref@6dabd6b0> #<Timer javax.swing.Timer@32f60451>]\n```\n\n\
  游戏窗口可能会出现在你的 REPL 窗口后面。如果发生这种情况，请使用你本地操作系统的功能来找到游戏窗口。\n\n贪吃蛇有很多可能的改进方法。如果蛇到达屏幕边缘，也许它应该转弯以避免从视野消失。或者（严厉的爱）也许你直接输掉游戏！通过改进以适应你的个人风格，让贪吃蛇游戏变得独特。\n\
  \n### 没有 Refs 的蛇\n\n我们选择使用 `refs` 实现贪吃蛇游戏的可变模型，以便协调蛇和苹果的更新。其他方法也是有效的。例如，你可以将蛇和苹果的状态合并到一个单一的\
  \ `game` 对象中。只有一个对象时就不再需要协调，你可以使用 `atom`。`examples/atom-snake.clj` 文件演示了这种方法。像 `update-positions`\
  \ 这样的函数变成了函数模型的一部分，并返回一个带有更新状态的新游戏对象：\n\n```clojure\n(defn update-positions [{snake\
  \ :apple :game}]\n  (if (ats? apple)\n    (merge game {:apple (create-apple) :snake\
  \ (move snake)})\n    game))\n```\n\n注意解构如何能够轻松地获取 `game` 的内部结构：`snake` 和 `apple`\
  \ 均通过参数列表进行绑定。实际的可变更新现在全部通过 `swap!` 完成。我们发现这些操作足够简单，可以将它们保留在 UI `game-panel` 中，正如这段片段所示：\n\
  \n```clojure\n(actionPerformed [e]\n  (swap! game update-positions)\n  (when (lose?\
  \ (@game))\n    (swap! game reset-game)\n    (JOptionPane/showMessageDialog frame\
  \ \"lose!\")))\n```\n\n还有其他可能性。Chris Houser 对本书示例代码的分叉演示了使用 `Thread/sleep` 代替 Swing\
  \ 的 agent，以及为每个游戏使用一个新 agent 来更新游戏状态状态。\n\n## 5.7 总结\n\nClojure 的引用模型是该语言中最创新的部分。你在本章中看到的软件事务内存、agents、atoms\
  \ 和动态绑定的结合，为 Clojure 的各种有状态系统提供了强大的抽象。它使 Clojure 成为少数适用于未来多核硬件的语言之一。\n\n接下来，我们将查看\
  \ Clojure 的新特性之一。有些人称之为“表达式问题”的解决方案。我们称之为协议（protocol）。\n\n#### 脚注\n\n[42]: [Simple-Made-Easy](https://www.infoq.com/presentations/Simple-Made-Easy)\n\
  [43]: [atom-snake.clj](https://planet.plt-scheme.org/package-source/dvanhorn/snake.plt/1/0/main)\n\
  [44]: [smaller-snake](https://www.plt1.com/1069/smaller-snake/)\n[45]: [even-smaller-snake](https://www.plt1.com/1070/even-smaller-snake/)\n\
  [46]: [worm.html](http://www.ccs.neu.edu/home/cce/acl2/worm.html) 包含了使用定理证明器 ACL2\
  \ 的验证。\n[47]: [ClojureSnake.html](http://www.ociweb.com/mark/programming/ClojureSnake.html)\n\
  [48]: [programming-clojure](https://github.com/Chouser/programming-clojure)\n[49]:\
  \ [Expression_problem](https://en.wikipedia.org/wiki/Expression_problem)\n\n\n\n\
  \n协议（Protocols）和数据类型（Datatypes）提供了一种高性能、灵活的抽象与实现机制，使得在 Clojure 中编程时不再需要编写 Java 接口和类。通过协议和数据类型，你可以创建新的抽象，以及实现这些抽象的新类型，甚至可以将新的抽象扩展到现有的类型上。\n\
  \n在本章中，我们将探索 Clojure 使用协议和数据类型来实现抽象的方法。首先，我们将实现一个 Clojure 内置 `spit` 和 `slurp` 函数的自定义版本。然后，我们将短暂停去构建一个\
  \ `CryptoVault`，在其中你将学习如何扩展 Java 的某些标准库。最后，我们将使用记录（records）和协议来定义音符和序列。在完成这些练习后，你将能够感受到\
  \ Clojure 可组合抽象的威力。\n\n## 6.1 面向抽象编程\n\nClojure 的 `spit` 和 `slurp` I/O 函数基于两个抽象构建：读取和写入。这意味着你可以将它们用于各种源和目的类型，包括文件、URL\
  \ 和套接字（sockets），而且任何人都可以通过扩展它们来支持新类型，无论这些类型是现有的还是新定义的。\n\n- `slurp` 函数接收一个输入源，读取内容并将其作为字符串返回。\n\
  - `spit` 函数接收一个输出目的和一个值，将该值转换为字符串并将其写入输出目的。\n\n我们将从编写这两个函数的基础版本开始，它们只能读取和写入文件。然后，随着我们对支持额外数据类型方法的探索，我们将对这些基础版本进行多次重构。通过这个过程，你将很好地体会面向抽象编程的用处，特别是\
  \ Clojure 协议和数据类型的灵活性和强大。\n\n在编写了可以处理多种现有数据类型的 `spit` 和 `slurp` 版本（分别命名为 `expectorate`\
  \ 和 `gulp`）之后，我们将创建一个新的数据类型 `datatype` `CryptoVault`，它可以与我们的函数版本配合，也可以与原始函数配合。\n\
  \n### gulp 和 expectorate\n\n`gulp` 函数是 Clojure `slurp` 函数的简化版本，而 `expectorate` 尽管名字很高大上，但它是\
  \ Clojure `spit` 函数的简化版。让我们写一个 `gulp` 的基础版本，它只能从 `java.io.File` 读取。\n\n| [src/examples/gulp.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/gulp.clj)\
  \ |\n\n```clojure\n(ns examples.gulp\n  (:import (java.io FileInputStream InputStreamReader\
  \ BufferedReader)))\n(defn gulp [src]\n  (let [sb (StringBuilder.)]\n    (with-open\
  \ [reader (-> src\n                       FileInputStream\n                    \
  \   InputStreamReader\n                       BufferedReader)]\n      (loop [c (.read\
  \ reader)]\n        (if (neg? c)\n          (str sb)\n          (do\n          \
  \  (.append sb (char c))\n            (recur (.read reader))))))))))))))\n```\n\n\
  `gulp` 函数从给定的 `File` 对象创建一个 `BufferedReader`，然后对其进行 `loop`/`recurs` 操作，每次读取一个字符并追加到\
  \ `StringBuilder` 中，直到输入结束并返回一个字符串。基础的 `expectorate` 函数更小：\n\n| [src/examples/expectorate.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/expectorate.clj)\
  \ |\n\n```clojure\n(ns examples.expectorate\n  (:import (java.io FileOutputStream\
  \ OutputStreamWriter BufferedWriter)))\n(defn expectorate [dst content]\n  (with-open\
  \ [writer (-> dst\n                     FileOutputStream\n                     OutputStreamWriter\n\
  \                     BufferedWriter)]\n    (.write writer (str content))))\n```\n\
  \n它创建一个 `BufferedWriter` 文件，将 `content` 参数的值转换为字符串，并将其写入 `BufferedWriter`。\n\n但如果我们想支持额外的类型，如\
  \ `Socket`、URL 以及基础的输入和输出流呢？我们需要更新 `gulp` 和 `expectorate`，使其能够从文件以外的数据类型创建 `BufferedReader`\
  \ 和 `BufferedWriter`。因此，让我们创建两个函数 `make-reader` 和 `make-writer` 来负责这项工作。\n\n- `make-reader`\
  \ 函数从输入源创建一个 `BufferedReader`。\n- `make-writer` 从输出创建一个 `BufferedWriter`。\n\n```clojure\n\
  (defn make-reader [src]\n  (-> src FileInputStream InputStreamReader BufferedReader))\n\
  \n(defn make-writer [dst]\n  (-> dst FileOutputStream OutputStreamWriter BufferedWriter))\n\
  ```\n\n和我们基础的 `gulp` 和 `expectorate` 函数一样，`make-reader` 和 `make-writer` 目前只作用于文件，但很快就会改变。现在让我们重构\
  \ `gulp` 和 `expectorate` 以使用新函数：\n\n| [src/examples/protocols.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/protocols.clj)\
  \ |\n\n```clojure\n(defn gulp [src]\n  (let [sb (StringBuilder.)]\n    (with-open\
  \ [reader (make-reader src)]\n      (loop [c (.read reader)]\n        (if (neg?\
  \ c)\n          (str sb)\n          (do\n            (.append sb (char c))\n   \
  \         (recur (.read reader))))))))))\n(defn expectorate [dst content]\n  (with-open\
  \ [writer (make-writer dst)]\n    (.write writer (str content))))\n```\n\n现在只需通过更新\
  \ `make-reader` 和 `make-writer`即可为 `gulp` 和 `expectorate` 添加额外的源和目的类型支持。支持额外类型的一种方法是使用\
  \ `cond` 或 `condp` 语句处理不同类型。例如，以下版本的 `make-reader` 用 `condp` 语句替换了 `FileInputStream`\
  \ 构造函数的调用，根据给定输入创建 `InputStream`，无论它是 `File`、`Socket` 或 `URL` 还是已经是 `InputStream`。\n\
  \n```clojure\n(defn make-reader [src]\n  (condp (type src)\n    java.io.InputStream\n\
  \    java.lang.String (FileInputStream src)\n    java.io.File (FileInputStream src)\n\
  \    java.net.Socket (.getInputStream src)\n    java.net.URL (if (= \"file\" (.getProtocol\
  \ src))\n                    (-> src (.getPath FileInputStream))\n             \
  \       (.openStream src))\n    InputStreamReader BufferedReader))\n```\n\n这是一个相同策略的\
  \ `make-writer` 版本：\n\n```clojure\n(defn make-writer [dst]\n  (condp (type dst)\n\
  \    java.io.OutputStream dst\n    java.io.File (FileOutputStream dst)\n    java.lang.String\
  \ (FileOutputStream dst)\n    java.net.Socket (.getOutputStream dst)\n    java.net.URL\
  \ (if (= \"file\" (.getProtocol dst))\n                    (-> dst (.getPath) FileOutputStream)\n\
  \                    (throw (IllegalArgumentException \"Can't write to non-file\
  \ URL\")))\n    OutputStreamWriter BufferedWriter))\n```\n\n\n\n\n这种方法的问题在于它是封闭的：没有其他人可以在不重写\
  \ `make-reader` 和 `make-writer` 的情况下为新的源和目标类型添加支持。我们需要的是一种开放的解决方案，即可以在之后由不同的方添加对新类型的支持。我们需要两个抽象，一个用于读取，一个用于写入。\n\
  \n## 6.2 接口 (Interfaces)\n\n在 Java 中，支持这种形式抽象的常用机制是接口。接口机制提供了一种将调用调度到抽象的方法（该方法在接口定义中指定），根据传入的第一个参数的数据类型到具体的实现。在\
  \ Java 中，第一个参数是隐式的；它是实现该接口的对象。\n\n以下是接口的优点：\n\n-   数据类型可以实现多个接口。\n-   接口只提供规范而不提供实现，这允许实现多个接口，而不会产生与多类继承相关的问题。\n\
  \n接口的缺点是，现有的数据类型无法在不重写的情况下扩展以实现新的接口。\n\n我们可以在 Clojure 中使用 `definterface` 宏创建 Java\
  \ 接口。它接收一个名称和一个或多个方法签名：\n\n```\n(definterface name & sigs)\n```\n\n让我们为“可以从中读取并写入的对象”创建一个接口抽象，将其命名为\
  \ `IOFactory`。\n\n```clojure\n(definterface IOFactory\n  (^java.io.BufferReader\
  \ make-reader [this])\n  (^java.io.BufferedWriter make-writer [this]))\n```\n\n\
  这将创建一个名为 `IOFactory` 的接口，其中包含两个抽象函数 `make-reader` 和 `make-writer`。任何实现此接口的类都必须包含接收单个参数以及数据类型本身实例的函数，并分别返回\
  \ `BufferedReader` 和 `BufferedWriter`。\n\n遗憾的是，类所支持的接口是由作者在设计时确定的；一旦定义了 Java 类，无法在不重写的情况下更新以支持新的接口。因此，我们无法扩展\
  \ `File`、`Socket` 和 `URL` 类来实现 `IOFactory` 接口。\n\n与我们基于 `condp` 实现的 `make-reader`\
  \ 和 `make-writer` 版本一样，我们的接口对作者以外的其他方是封闭扩展的。这就是所谓的“表达式问题”（expression problem）的一部分。幸运的是，Clojure\
  \ 有它的解决方案。\n\n## 6.3 协议 (Protocols)\n\nClojure 解决表达式问题的一部分方案是协议。协议提供了一种灵活的抽象机制，通过只提供规范而不提供实现，并允许数据类型实现多个协议，利用了接口的最优部分。此外，协议通过允许对现有类型进行非侵入式扩展以支持新协议，解决了接口的关键局限性。\n\
  \n以下是协议的优点：\n\n-   数据类型可以实现多个协议。\n-   协议只提供规范而不提供实现，这允许实现多个接口，而不会产生与多类继承相关的问题。\n\
  -   现有的数据类型可以在不修改数据类型的情况下扩展以实现新接口。\n-   协议方法名带有命名空间，因此当多个方选择扩展同一种现有类型时，不存在名称冲突的风险。\n\
  \n`defprotocol` 宏的工作方式与 `definterface` 相似，但现在我们能够扩展现有的数据类型来实现我们的新抽象。\n\n```\n(defprotocol\
  \ name & opts+sigs)\n```\n\n让我们将 `IOFactory` 重新定义为协议而不是接口。\n\n```clojure\n(defprotocol\
  \ IOFactory\n  \"适用于可以从中读取和写入对象的协议。\"\n  (make-reader [this] \"创建一个 BufferedReader.\"\
  )\n  (make-writer [this] \"创建一个 BufferedWriter.\"))\n```\n\n注意，我们可以为整个协议包含文档字符串，也可以为每个方法包含文档字符串。现在让我们扩展\
  \ `java.io.InputStream` 和 `java.io.OutputStream` 来实现我们的 `IOFactory` 协议。\n\n我们使用\
  \ `extend` 函数将现有类型与协议关联，并提供所需的函数实现（在此上下文中通常称为方法）。扩展的参数是待扩展的类型名称、要实现的协议名称以及一个方法实现映射，其中键是方法名的关键字化版本。\n\
  \n```\n(extend type & proto+mmaps)\n```\n\n对于 `InputStream` 的 `make-reader` 实现是将传递给它的值封装在\
  \ `BufferedReader` 中。\n\n```clojure\n(extend InputStream IOFactory\n  {:make-reader\
  \ (fn [src]\n    (-> src InputStreamReader. BufferedReader.))\n   :make-writer (fn\
  \ [dst]\n    (throw (IllegalArgumentException \"无法作为 InputStream 打开.\")))})\n```\n\
  \n同样，`OutputStream` 的 `make-writer` 实现将其给定的输入封装在 `BufferedWriter` 中。由于你不能向 `InputStream`\
  \ 写入或从 `OutputStream` 读取，因此 `make-writer` 和 `make-reader` 的相应实现会抛出 `IllegalArgumentException`。\n\
  \n```clojure\n(extend OutputStream IOFactory\n  {:make-reader (fn [src]\n    (throw\
  \ (IllegalArgumentException \"无法作为 OutputStream 打开.\"))\n   :make-writer (fn [dst]\n\
  \    (BufferedWriter dst))})\n```\n\n我们可以使用 `extend-type` 宏扩展 `java.io.File` 类型来实现\
  \ `IOFactory`，它提供了比 `extend` 稍微整洁的语法。\n\n```\n(extend-type type & specs)\n```\n\n\
  它接收待扩展类型的名称和另外一个规范。\n\n```clojure\n(extend-type File IOFactory\n  (make-reader [src]\
  \ (FileInputStream src))\n  (make-writer [dst] (FileOutputStream dst)))\n```\n\n\
  注意，我们从文件创建一个 `InputStream`（具体来说是 `FileInputStream`），然后调用 `make-reader`，该调用将调度到早早为\
  \ `InputStream` 定义的实现。对 `make-writer` 方法我们也相同的递归模式，以及以下类型的方法。\n\n我们可以使用 `extend-protocol`\
  \ 宏一次性扩展剩余的类型：\n\n```\n(extend-protocol protocol & specs)\n```\n\n```clojure\n(extend-protocol\
  \ IOFactory\n  Socket\n  (make-reader [src] (getInputStream src))\n  (make-writer\
  \ [dst] (getOutputStream dst))\n  URL\n  (make-reader [src]\n    (if (= \"file\"\
  \ (getProtocol src))\n      (-> src getPath FileInputStream.)\n      (openStream\
  \ src)))\n  (make-writer [dst]\n    (if (= \"file\" (getProtocol dst))\n      (->\
  \ dst getPath FileOutputStream.)\n      (throw (IllegalArgumentException)))))\n\
  ```\n\n\n\n\n```\n\"Can't write to non-file URL\"\n```\n\n现在让我们把所有内容整合在一起。\n\n```clojure\n\
  (ns examples.io\n  (:import (java.io File FileInputStream FileOutputStream\n   \
  \        InputStream InputStreamReader\n           OutputStream OutputStreamWriter\n\
  \           BufferedReader BufferedWriter)\n          (java.net Socket URL)))\n\n\
  (defprotocol IOFactory\n  \"一个用于可以读和写入的对象的协议。\"\n  (make-reader [this] \"创建一个 BufferedReader.\"\
  )\n  (make-writer [this] \"创建一个 BufferedWriter.\"))\n\n(defn gulp [src]\n  (let\
  \ [sb (StringBuilder.)]\n    (with-open [reader (make-reader src)]\n      (loop\
  \ [c (.read reader)]\n        (if (neg? c)\n          (str sb)\n          (do\n\
  \            (.append sb (char c))\n            (recur (.read reader)))))))))))\n\
  \n(defn expectorate [dst content]\n  (with-open [writer (make-writer dst)]\n   \
  \ (.write writer (str content))))\n\n(extend-protocol IOFactory\n  InputStream\n\
  \  (make-reader [src]\n    (-> src InputStreamReader. BufferedReader.))\n  (make-writer\
  \ [dst]\n    (throw (IllegalArgumentException \"Can't open as an InputStream.\"\
  )))\n  OutputStream\n  (make-reader [src]\n    (throw (IllegalArgumentException\
  \ \"Can't open as an OutputStream.\")))\n  (make-writer [dst]\n    (-> dst OutputStreamWriter.\
  \ BufferedWriter.))\n  File\n  (make-reader [src]\n    (make-reader (FileInputStream.\
  \ src)))\n  (make-writer [dst]\n    (make-writer (FileOutputStream. dst)))\n  Socket\n\
  \  (make-reader [src]\n    (make-reader (.getInputStream src)))\n  (make-writer\
  \ [dst]\n    (make-writer (.getOutputStream dst)))\n  URL\n  (make-reader [src]\n\
  \    (make-reader\n      (if (= \"file\" (.getProtocol src))\n        (-> src .openStream))))\n\
  \  (make-writer [dst]\n    (make-writer\n      (if (= \"file\" (.getProtocol dst))\n\
  \        (-> dst .getPath))\n        (throw (IllegalArgumentException \"Can't write\
  \ to non-file URL\"))))))\n```\n\n## 6.4 数据类型 (Datatypes)\n\n我们已经展示了如何通过协议扩展现有类型以实现新的抽象，但如果我们想在\
  \ Clojure 中创建一个新类型呢？这就是数据类型（datatypes）大显用场。数据类型提供了以下功能：\n\n* 唯一的类，可以是命名的或匿名的\n*\
  \   结构，可以是字段形式或隐式闭包\n*   可以带有类型提示且可以是原始类型的字段\n*   对协议或接口中抽象方法的可选实现\n*   默认不可变性\n\
  *   与映射（maps）的统一\n\n我们将使用 `deftype` 宏来定义一个名为 `CryptoVault` 的新数据类型，它将实现两个协议，包括 `IOFactory`。既然\
  \ `gulp` 和 `expectorate` 已经支持几个 Java 类，让我们创建一个新的支持类型 `CryptoVault`。你将通过传递一个实现了 `clojure.java.io.IOFactory`\
  \ 协议的参数（不是我们在这里定义的这一个）、加密密钥库的路径以及密码来创建 `CryptoVault` 的实例。吐出到 `CryptoVault` 中的内容将被加密并写入\
  \ `IOFactory` 对象，然后在 gulp 回时被解密。\n\n我们将使用 `deftype` 来创建新类型：\n\n```clojure\n(deftype\
  \ name [& fields] & opts)\n```\n\n它接收类型名称和一个包含该类型字段的向量。数据类型的命名约定与 Java 类使用的相同，即\
  \ PascalCase（大驼命名法）或 CamelCase（驼峰命名法）。\n\n```clojure\n(deftype CryptoVault [filename\
  \ keystore password])\n```\n\n一旦定义了类型，我们就可以这样创建 `CryptoVault` 的实例：\n\n```clojure\n\
  (def vault (CryptoVault \"vault-file\" \"keystore\" \"toomanysecrets\"))\n```\n\n\
  可以使用访问 Java 对象字段时相同的前缀点语法来访问其字段：\n\n`(.filename vault)`\n`(.keystore vault)`\n`(.password\
  \ vault)`\n\n现在我们已经定义了基本的 `CryptoVault` 类型，让我们通过一些方法添加行为。数据类型只能实现已在协议或接口中指定的方法，因此让我们先创建一个\
  \ `Vault` 协议。\n\n```clojure\n(defprotocol Vault\n  (init-vault [vault])\n  (vault-output-stream\
  \ [vault])\n  (vault-input-stream [vault]))\n```\n\n该协议包含了三个函数——`init-vault`、`vault-output-stream`\
  \ 和 `vault-input-stream`——每个 `Vault` 都必须实现这些函数。我们可以在 `deftype` 中内联定义新类型的方法；只需像之前一样传递类型名称和字段向量，随后是协议名称和一个或多个方法体：\n\
  \n```clojure\n(ns examples.cryptovault\n  (:use [examples.io :only [IOFactory make-reader\
  \ make-writer]])\n  (:require [clojure.java.io :as io])\n  (:import (java.security\
  \ KeyStore KeyStore$SecretKeyEntry\n           KeyStore$PasswordProtection)\n  \
  \        (javax.crypto KeyGenerator Cipher CipherOutputStream\n           CipherInputStream)\n\
  \          (java.io FileOutputStream)))\n\n(deftype CryptoVault [filename keystore\
  \ password]\n  Vault\n  (init-vault [vault]\n    ;; 此处编写方法体\n  (vault-output-stream\
  \ [vault]\n    ;; 此处编写方法体)  (vault-input-stream [vault]\n    ;; 此处编写方法体)\n  IOFactory\n\
  \  (make-reader [vault]\n    (make-reader (vault-input-stream vault)))\n  (make-writer\
  \ [vault]\n    (make-writer (vault-output-stream vault))))\n```\n\n注意，多个协议的方法内联定义；我们在一起定义了\
  \ `Vault` 和 `IOFactory` 协议的方法，尽管 `Vault` 方法体被省略了，并在后续描述。`init-vault` 方法将生成一个高级加密标准\
  \ (AES) 密钥，将其放入 `java.security.KeyStore` 中，将密钥库数据写入 `CryptoVault` 中 `keystore` 字段指定的文件，然后对其进行密码保护。\n\
  \n```clojure\n(init-vault [vault]\n  (let [password (toCharArray (.password vault))]\n\
  \        key (.generateKey (KeyGenerator/getInstance \"AES\"))\n        keystore\
  \ (doto (KeyStore/getInstance \"JCEKS\")\n          (.load nil password)\n     \
  \     (.setEntry \"vault-key\" key password)))\n```\n\n\n\n\n\n```clojure\n(KeyStore$SecretKeyEntry.key)\n\
  \  (KeyStore$PasswordProtection. password))\n  (with-open [fos (FileOutputStream.\
  \ (.keystore vault))]\n    (.store keystore fos password))))\n```\n\n`vault-output-stream`\
  \ 和 `vault-input-stream` 方法都会使用一个函数 `vault-key` 来加载与 `CryptoVault` 关联密钥库（keystore），并提取用于加密和解密库内容的\
  \ `AES` 密钥。\n\n```clojure\n(defn vault-key [vault]\n  (let [password (.toCharArray\
  \ (.password vault))]\n    (with-open [fis (FileInputStream. (.keystore vault))]\n\
  \      (-> (doto (KeyStore/getInstance \"JCEKS\")\n          (.load fis password))\n\
  \          (.getKey \"vault-key\" password)))))\n```\n\n`vault-output-stream` 方法使用\
  \ `vault-key` 方法初始化一个 `AES` 密码对象，根据 `Vault` 的文件名创建一个 `OutputStream`，然后使用该加密器和 `OutputStream`\
  \ 创建一个 `CipherOutputStream` 实例。\n\n```clojure\n(vault-output-stream [vault]\n  (let\
  \ [cipher (doto (Cipher/getInstance \"AES\"))\n      (.init Cipher/ENCRYPT_MODE\
  \ (vault-key vault))]\n    (CipherOutputStream. (io/output-stream (.filename vault))\
  \ cipher)))\n```\n\n`vault-input-stream` 方法的工作原理与 `vault-output-stream` 相同，只是它返回一个\
  \ `CipherInputStream`。\n\n```clojure\n(vault-input-stream [vault]\n  (let [cipher\
  \ (doto (Cipher/getInstance \"AES\"))\n      (.init Cipher/DECRYPT_MODE (vault-key\
  \ vault))]\n    (CipherInputStream. (io/input-stream (.filename vault)) cipher)))\n\
  ```\n\n要创建一个 `CryptoVault` 实例，只需传递数据应存储的位置、密钥库文件名以及保护密钥库的密码即可。\n\n```clojure\nuser=>\
  \ (def vault (->CryptoVault \"vault-file\" \"keystore\" \"toomanysecrets\"))\n#'user/vault\n\
  ```\n\n如果密钥库尚未初始化，请调用 `init-vault` 方法：\n\n```clojure\nuser=> (init-vault vault)\n\
  nil\n```\n\n然后就可以像使用 `gulp` 和 `expectorate` 的其他源/目标一样一样使用 `CryptoVault` 了。\n\n```clojure\n\
  user=> (expectorate vault \"This is a test of the CryptoVault\")\nnil\n\nuser=>\
  \ (gulp vault)\n\"This is a test of the CryptoVault\"\n```\n\n我们可以通过扩展 `CryptoVault`\
  \ 以使其支持 `clojure.java.io/IOFactory` 协议，将其与内置的 `spit` 和 `slurp` 函数一起使用。此版本的 `IOFactory`\
  \ 有四个方法（而不是我们的那样两个），并且在一个名为 `default-streams-impl` 的 map 中定义了默认方法实现。我们将通过 `assoc`\
  \ 将我们的新实现关联到该 map 并将其传递给 `extend` 函数，从而重写其中的两个方法：`make-input-stream` 和 `make-output-stream`。\n\
  \n```clojure\n(extend CryptoVault clojure.java.io/IOFactory\n  (assoc clojure.java.io/default-streams-impl\n\
  \    :make-input-stream (fn [x opts] (vault-input-stream x))\n    :make-output-stream\
  \ (fn [x opts] (vault-output-stream x))))\n```\n\n就是这样；现在我们可以使用 `slurp` 和 `spit`\
  \ 读写 `CryptoVault`。\n\n```clojure\nuser=> (spit vault \"This is a test of the CryptoVault\
  \ using spit and slurp\")\nnil\n\nuser=> (slurp vault)\n\"This is a test of the\
  \ CryptoVault using spit and slurp\"\n```\n\n让我们把所有部分组合到一个 `.clj` 文件中。在你的目录中创建一个\
  \ `src/examples` 子目录，并创建一个名为 `vault_complete.clj` 的文件。\n\n`src/examples/vault_complete.clj`\n\
  \n```clojure\n(ns examples.vault-complete\n  (:require [clojure.java.io :as io]\n\
  \            [examples.protocols :as proto])\n  (:import [java.security.KeyStore\
  \ KeyStore$SecretKeyEntry\n           KeyStore$PasswordProtection\n           javax.crypto.Cipher\
  \ CipherOutputStream\n           CipherInputStream\n           java.io.FileInputStream\
  \ FileOutputStream]))\n\n(protocol Vault\n  (init-vault [vault])\n  (vault-output-stream\
  \ [vault])\n  (vault-input-stream [vault]))\n\n(deftype CryptoVault [filename keystore\
  \ password]\n  Vault\n  (init-vault [vault]\n    (let [password (.toCharArray (.password\
  \ vault))\n          key (.generateKey (KeyGenerator/getInstance \"AES\"))\n   \
  \       keystore (doto (KeyStore/getInstance \"JCEKS\")\n                (.load\
  \ nil password)\n                (.setEntry \"vault-key\" (KeyStore$SecretKeyEntry.key\n\
  \                  (KeyStore$PasswordProtection. password))))\n      (with-open\
  \ [fos (FileOutputStream. (.keystore vault))]\n        (.store keystore fos password))))\n\
  \n  (vault-output-stream [vault]\n    (let [cipher (doto (Cipher/getInstance \"\
  AES\"))\n          (.init Cipher/ENCRYPT_MODE (vault-key vault))]\n      (CipherOutputStream.\
  \ (io/output-stream (.filename vault)) cipher)))\n\n  (vault-input-stream [vault]\n\
  \    (let [cipher (doto (Cipher/getInstance \"AES\"))\n          (.init Cipher/DECRYPT_MODE\
  \ (vault-key vault))]\n    (CipherInputStream. (io/input-stream (.filename vault))\
  \ cipher))))\n\n(proto/IOFactory\n  (make-reader [vault]\n    (proto/make-reader\
  \ (vault-input-stream vault)))\n  (make-writer [vault]\n    (proto/make-writer (vault-output-stream\
  \ vault))))\n\n(extend CryptoVault clojure.java.io/IOFactory\n  (assoc clojure.java.io/default-streams-impl\n\
  \    :make-input-stream (fn [x opts] (vault-input-stream x))\n    :make-output-stream\
  \ (fn [x opts] (vault-output-stream x))))\n```\n\n\n\n\n正因如此，Clojure 一直鼓励使用映射（maps）来对此类信息建模，对于数据类型也是如此，而\
  \ records 正有用场。record 是一种数据类型，类似于使用 `deftype` 创建类型，但它实现了 `PersistentMap`，因此可以像任何其他\
  \ map 一样使用（大部分情况下）；而且由于 records 也是真正的类，它们通过协议（protocols）支持基于类型的多态。通过 records，我们兼顾了这两者的优点：可以实现协议的\
  \ map。\n\n有什么比使用 records 来播放音乐更自然的呢？所以，让我们创建一个表示音乐音符的 record，包含音高（pitch）、八度（octave）和持续时间（duration）字段；然后我们将使用\
  \ JDK 内置的 MIDI 合成器来播放这些音符的序列。\n\n由于 records 是 map，我们将能够使用 `assoc` 和 `update-in`\
  \ 函数更改单个音符的属性，并可以使用 `map` 和 `reduce` 创建或转换整个音符序列。这让我们能够访问整个 Clojure 集合 API。\n\n\
  我们将使用 `defrecord` 宏创建一个 `Note` record，它的行为与 `deftype` 相同。\n\n| | `(defrecord name\
  \ [& fields] & opts+specs)` |\n\n一个 `Note` record 有三个字段：pitch、octave 和 duration。\n\
  \n| | `(defrecord Note [pitch octave duration])` |\n| | `-> user.Note` |\n\n音高将由像\
  \ `:C`、`:C#` 和 `:Db` 这样的关键字表示，它们分别代表 C、C♯ (C sharp) 和 D♭ (D flat)。每个音高可以在不同的八度上播放；例如，中\
  \ C 在第四八度。duration 表示音符的长度；全音符用 1 表示，二分音符用 1/2，四分音符用 1/4，十六分音符用 1/16。例如，我们可以用这个\
  \ `Note` record 表示一个第四八度上的 D♯ 二分音符：\n\n| | `(->Note :D# 4 1/2)` |\n| | `-> #user.Note{:pitch\
  \ :D#, :octave 4, :duration 1/2}` |\n\n我们可以像对待任何其他数据类型一样对待 records，使用点语法访问它们的字段。\n\
  \n| | `(.pitch (->Note :D# 4 1/2))` |\n| | `-> :D#` |\n\n但 records 也是像 map 的：\n\n\
  | | `(map? (->Note :D# 4 1/2))` |\n| | `-> true` |\n\n所以我们也可以使用关键字访问它们的字段：\n\n|\
  \ | `(:pitch (->Note :D# 4 1/2))` |\n| | `-> :D#` |\n\n我们可以使用 `assoc` 和 `update-in`\
  \ 创建修改过的 records。\n\n| | `(assoc (->Note :D# 4 1/2) :pitch :Db :duration 1/4)` |\n\
  | | `-> #user.Note{:pitch :Db, :octave 4, :duration 1/4}` |\n| | `(update-in (->Note\
  \ :D# 4 1/2) [:octave] inc)` |\n| | `-> #user.Note{:pitch :D#, :octave 5, :duration\
  \ 1/2}` |\n\nrecords 是开放的，因此我们可以将额外的字段关联到 record 中：\n\n| | `(assoc (->Note :D# 4\
  \ 1/2) :velocity 100)` |\n| | `-> #user.Note{:pitch :D#, :octave 4, :duration 1/2,\
  \ :velocity 100}` |\n\n我们将使用可选的 `:velocity` 字段来表示播放音符的力度。\n\n在 record 上使用，`assoc`\
  \ 和 `update-in` 都会返回一个新的 record，但 `dissoc` 函数的工作方式稍不同；如果被移除的字段是可选的（如上例中的 `velocity`），它将返回一个新的\
  \ record；但如果字段是 `defrecord` 规范要求的（如 pitch、octave 或 duration），它将返回一个普通的 map。\n\n\
  换句话说，如果你从给定类型的 record 中删除一个必需字段，它就不再是该类型的 record，而是简单地变成了一个 map。\n\n| | `(dissoc\
  \ (->Note :D# 4 1/2) :octave)` |\n| | `-> {:pitch :D#, :duration 1/2}` |\n\n注意，在这种情况下\
  \ `dissoc` 返回的是一个 map 而不是 record。records 和 map 之间的区别在于，与 map 不同，records 不是关键字的函数。\n\
  \n| | `((->Note. :D# 4 1/2) :pitch)` |\n| | `-> user.Note cannot be cast to clojure.lang.IFn`\
  \ |\n\n抛出 `ClassCastException` 是因为 records 没有像 map 那样实现 `IFn` 接口。这是设计如此并导致了风格上的差异。在访问集合时，你应该将集合放在前面。在访问一个（概念上）作为数据记录的\
  \ map 时，你应该将关键字放在前面，即使该 record 是实现为普通的 map。现在我们有了 `Note` record，让我们添加一些方法，以便使用 JDK\
  \ 内置的合成器来播放它们。我们首先创建一个包含三个方法的 `midiNote` 协议：\n\n```\n(defdef midiNote\n  (to-msec\
  \ [this tempo])\n  (key-number [this])\n  (play [this tempo-channel]))\n```\n\n\
  为了用 MIDI 合成器播放我们的音符，我们需要将其音高和八度转换为 MIDI 编号，并将持续时间转换为毫秒。在这里我们定义了 `to-msec`、`key-number`\
  \ 和 `play`。\n\n```\n(import 'javax.sound.midi.MidiSystem)\n(extend-type Note MidiNote\n\
  \  (to-msec [this tempo]\n    (let [duration-to-bpm {1 240 1/2 120 1/4 60 1/8 30\
  \ 1/16 15}]\n      (* 1000 (duration-to-bpm (duration this)))))\n```\n\n`to-msec`\
  \ 函数根据给定的速度（以每分钟拍数 bpm 表示），将音符的持续时间从全音符、二分音符、四分音符等转换为毫秒。\n\n```\n(key-number [this]\n\
  \  (let [scale {:C 0 :C# 1 :Db 1 :D 2\n               D# 3 :Eb 3 :E 4 :F 5\n   \
  \            F# 6 :Gb 6 :G 7 :G# 8\n               Ab 8 :A 9 :A# 10 :Bb 10\n   \
  \            B 11}]\n    (+ 12 (inc (:octave this)))\n       (scale (:pitch this)))))\n\
  ```\n\n`key-number` 函数将表示音高的关键字映射为 0 到 11 的数字，并将该数字与给定的八度结合以相应的 MIDI 编号。\n\n```\n\
  (play [this tempo-channel]\n  (let [velocity (or (:velocity this) 64)]\n    (.noteOn\
  \ midi-channel (key-number this) velocity)\n    (Thread/sleep (to-msec tempo))))\n\
  ```\n\n最后，`play` 方法接收音符、速度和通道；向通道发送 `noteOn` 消息；然后等待持续时间。在当前线程睡眠期间，音符仍在播放，直到下一个音符发送到通道时停止。\n\
  \n现在我们需要一个设置 MIDI 合成器并播放音符序列的函数：\n\n```\n(defn perform [notes & {:keys [tempo] :or\
  \ {tempo 120}}]\n  (with-open [synth (doto (MidiSystem/getSynthesizer) .open)]\n\
  \    (let [channel (aget (.getChannels synth) 0)]\n      (doseq [note notes]\n \
  \       (play note tempo channel)))))\n```\n\n`perform` 函数接收音符序列和可选的速度值，打开 MIDI\
  \ 合成器，获取其通道，然后调用每个音符的 `play` 方法。\n\n现在所有部分都就绪了，让我们使用 `Note` records 制作音乐：\n\n```\n\
  (def close-encounters [(->Note D 3 1/2)\n                    (->Note E 3 1/2)\n\
  \                    (->Note C 3 1/2)\n                    (->Note C 2 1/2)\n  \
  \                  (->Note G 2 1/2)])\n```\n\n在这种情况下，我们的“音乐”是由电影《接触》中外星飞船的五个音符组成的。要播放它，只需将序列传递给\
  \ `perform` 函数即可：\n\n```\n(perform close-encounters)\n```\n\n\n\n\n我们还可以使用 `for`\
  \ 宏动态生成音符序列。\n\n```clojure\n(def jaws (for [duration [1/2 1/2 1/4 1/4 1/8 1/8 1/8\
  \ 1/8]\n             pitch [:E :F]]\n  (Note. pitch 2 duration)))\n-> #'user/jaws\n\
  \n(perform jaws)\n-> nil\n```\n\n结果是电影《大鲨》中的主题曲——一段交替的 E 和 F 音符，随着从二分音符变为四分符再到八分音符，速度逐渐加快。\n\
  \n由于音符是记录（records），而记录类似于映射（map），我们可以使用任何作用于 map 的 Clojure 函数来操作它们。例如，我们可以将 `update-in`\
  \ 函数映射到 `Close Encounters` 序列上，以提高或降低它的八度。\n\n```clojure\n(perform (map #(update-in\
  \ % [:octave] inc) close-encounters))\n-> nil\n\n(perform (map #(update-in % [:octave]\
  \ dec) close-encounters))\n-> nil\n```\n\n或者我们也可以创建一个音符序列，其可选字段 `:velocity` 的值逐渐变大：\n\
  \n```clojure\n(perform (for [velocity [64 80 90 100 110 120]]\n  (assoc (Note. :D\
  \ 3 1/2) :velocity velocity)))\n-> nil\n```\n\n这产生了一个力度逐渐增强的 D 音符序列。操作序列是 Clojure\
  \ 的一大优势，因此在程序化地创建和操作 `Note` 记录序列方面有无限可能。\n\n让我们把 `MidiNote` 协议、`Note` 记录和 `perform`\
  \ 函数一起放在一个名为 `src/examples/midi.clj` 的 Clojure 源文件中，以便我们以后使用它们。\n\n`src/examples/midi.clj`\n\
  \n```clojure\n(ns examples.datatypes.midi\n (:import [javax.sound.midi MidiSystem]))\n\
  \n(defprotocol MidiNote\n  (to-msec [this tempo])\n  (key-number [this])\n  (play\
  \ [this tempo midi-channel]))\n\n(defn perform [notes & {:keys [tempo] :or {tempo\
  \ 88}}]\n  (with-open [synth (doto (MidiSystem/getSynthesizer) open)]\n    (let\
  \ [channel (aget (.getChannels synth) 0)]\n      (doseq [note notes]\n        (play\
  \ note tempo channel)))))\n\n(defrecord Note [pitch octave duration]\n  MidiNote\n\
  \  (to-msec [this tempo]\n    (let [duration-to-bpm {1 240, 1/2 120, 1/4 60, 1/8\
  \ 30, 1/16 15}]\n      (* 1000 (/ (duration-to-bpm (:duration this)) tempo))))\n\
  \  (key-number [this]\n    (let [scale {:C 0, :C# 1, :Db 1, :D 2, \n           \
  \     :D# 3, :Eb 3, :E 4, :F 5,\n                :F# 6, :Gb 6, :G 7, :G# 8,\n  \
  \              :Ab 8, :A 9, :A# 10, :Bb 10,\n                :B 11}]\n      (+ (*12\
  \ inc (:octave this)))))\n  (play [this tempo midi-channel]\n    (let [velocity\
  \ (or (:velocity this) 64)]\n      (.noteOn midi-channel (key-number this) velocity)\n\
  \      (sleep (to-msec this)))))\n```\n\n## 6.6 reify\n\n`reify` 宏允许你创建一个实现了某个协议或接口的数据类型的匿名实例。请注意，你通过闭包（closure）访问它，而不是通过声明。这是因为没有成员变量：`reify\
  \ & opts`。\n\n`reify` 与 `deftype` 和 `defrecord`一样，接受一个或多个协议或接口名称以及一系列方法体。与 `deftype`\
  \ 和 `defrecord` 不同，它不接受名称或字段向量；使用 `reify` 产生的数据类型实例没有显式字段，而是依赖于闭包。让我们创作一些约翰·凯奇（John\
  \ Cage）风格的偶然音乐，或者更好，创建一个偶然音乐生成器。我们将使用 `reify` 创建一个 `MidiNote` 实例，它在每次调用 `play` 方法时都会播放不同的音符。\n\
  \n`src/examples/generator.clj`\n\n```clojure\n(import '[examples.datatypes.midi\
  \ MidiNote])\n(let [min-duration 250\n      min-velocity 64]\n  (reify MidiNote\n\
  \    (to-msec [this tempo] (+ (rand-int 1000) min-duration))\n    (key-number [this]\
  \ (rand-int 100))\n    (play [this tempo midi-channel]\n      (let [velocity (+\
  \ (rand-int 100) min-velocity)]\n        (.noteOn midi-channel (key-number this)\
  \ velocity)\n        (sleep (to-msec this tempo)))))\n(perform (repeat 15 rand-note)))\n\
  ```\n\n我们需要做的第一件事是从 `examples.midi` 命名空间导入（而不是使用或引入）我们的 `MidiNote` 协议。接下，我们绑定两个值：`min-duration`\
  \ 和 `min-velocity`，我们将在 `MidiNote` 方法实现中使用它们。然后，我们使用 `reify` 创建一个匿名类型的实例，该类型实现了\
  \ `MidiNote` 协议，并在每次调用 `play` 方法时都会随机选择音符、持续时间和力度。最后，我们使用 `repeat` 函数创建一个由单个 `rand-note`\
  \ 实例组成的 15 个音符的序列并执行它。瞧，你现在有了一个虚拟的约翰·凯奇！\n\n## 6.7 总结\n\n在本章中，我们涵盖了大量内容，从编程中的通用抽象到\
  \ Clojure 提供的某些（并非全部）特定的抽象机制。我们探索了如何在 Clojure 中使用协议创建具体的抽象，并在过程中充满了乐趣！\n\n但还有更多。Clojure\
  \ 的宏实现易于学习和正确用于常用任务，并且足以处理更困难的宏相关任务。在下一章中，你将看到 Clojure 如何将宏引入主流编程。\n\n\n\n\n宏（Macros）与其他编程范式非常不同，以至于你可能苦于不知道何时使用它们。没有比社区的共享经验更好的指南了，因此第\
  \ 7.4 节，*宏的分类 基于 Clojure 本身和 contrib 库中的宏，介绍了 Clojure 宏的分类。\n\n## 7.1 何时使用宏\n\n\
  Macro Club 有两条规则，外加例外。\n\nMacro Club 的第一条规则是`不要写宏 (Don’t Write Macros)`。宏是复杂的，它们要求你仔细考虑宏展开时间和编译时间之间的相互作用。如果你可以用函数来实现，在使用宏之前请考虑两次。\n\
  \nMacro Club 的第二条规则是`如果这是封装模式的唯一方法，就写宏`。所有的编程语言都提供了一些封装模式的方法，但如果没有宏，这些机制是不完整的。在大多数语言中，每当你说“如果我的语言有功能\
  \ X，我的生活就会轻松得多”时，你就会感觉到这种不完整性。在 Clojure 中，你只需要用宏来实现功能 X 即可。\n\n规则的例外是，与等效的函数相比，你可以编写任何能让调用者生活更轻松的宏。但要理解这个例外，你需要练习编写宏并将它们与函数进行比较。所以，让我们从一个示例开始吧。\n\
  \n## 7.2 编写控制流宏\n\nClojure 将 `if` 特殊形式作为语言的一部分提供：\n\n| | (if (= 1 1) (println \"\
  yep, math still works today\")) |\n| | yep, math still works today |\n\n有些语言有 `unless`，它是（几乎）`if`\
  \ 的相反。`unless` 执行一个测试，仅当测试在逻辑上为 `false` 时执行其执行体。\n\nClojure 没有 `unless`，但它有一个名为\
  \ `when-not` 的等效宏。为了有一个简单的示例作为开始，让我们假设 `when-not` 不存在并创建一个 `unless` 的实现。为了遵循 Macro\
  \ Club 的规则，首先尝试将 `unless` 写成函数：\n\n[src/examples/macros.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/macros.clj)\n\
  \n| | ; 这注定会失败... |\n| | (defn unless [expr form] |\n| | (if expr nil form)) |\n\
  \n检查 `unless` 在其测试 `expr` 为 `false` 时是否正确评估了其形式：\n\n| | (unless false (println \"\
  this should print\")) |\n| | this should print |\n\n目前看起来一切正常。但让我们严谨地也测试 `true`\
  \ 的情况：\n\n| | (unless true (println \"this should not print\")) |\n| | this should\
  \ not print |\n\n显然出问题了。问题在于 Clojure 在将参数传递给函数之前会评估它们，因此 `println` 在 `unless` 看到它之前就被调用了。事实上，之前的两次\
  \ `unless` 调用都过早地调用了 `println`，在进入 `unless` 函数之前。要看到这一点，在 `unless` 内部添加一个 `println`：\n\
  \n```clojure\n(defn unless [expr form]\n  (println \"About to test...\")\n  (if\
  \ expr nil form))\n```\n\n现在你可以清楚地看到函数参数在传递给 `unless` 之前总是会被评估的：\n\n| | (unless\
  \ false (println \"this should print\")) |\n| | this should print |\n| | About to\
  \ test... |\n| | |\n| | (unless true (println \"this should not print\")) |\n| |\
  \ this should not print |\n| | About to test... |\n\n宏解决了这个问题，因为它们不会立即评估其参数。相反，你可以选择宏的参数在何时（以及是否！）被评估。\n\
  \n当 Clojure 遇到一个宏时，它会分两个步骤处理它。首先，它展开（执行）宏并将其结果替换回程序中。这被称为宏展开时间。然后，它继续进行正常的编译时间。\n\
  \n要编写 `unless`，你需要编写 Clojure 代码在宏展开时执行以下翻译：\n\n`(unless expr form) -> (if expr nil\
  \ form)`\n\n然后，你需要通过 `defmacro` 告诉 Clojure 你的代码是一个宏，它看起来几乎像 `defn`：\n\n```clojure\n\
  (defmacro name doc-string? attr-map? [params*] body)\n```\n\n由于 Clojure 代码就是 Clojure\
  \ 数据，你已经拥有了编写 `unless` 所需的所有工具。使用 `list` 构建 `if` 表达式来编写 `unless` 宏：\n\n```clojure\n\
  (defmacro unless [expr form]\n  (list 'if expr nil form))\n```\n\n### 特殊形式、设计模式与宏\n\
  \nClojure 没有特殊语法。代码由数据组成。这对于普通函数是如此，对于特殊形式也是如此。\n\n考虑一种语法更多样的语言，例如 Java。56 在 Java\
  \ 中，编写代码的最灵活机制是实例方法。想象你正在编写 Java 程序。如果你在实例方法中发现了一个重复模式，你有整个 Java 语言可以封装该模式。\n\n\
  目前为止良好。但 Java 也有许多“特殊形式”（尽管它们不那样命名）。与 Clojure 的特殊形式不同，每个特殊形式都有自己的语法。例如，`if` 是一个特殊形式。如果你发现涉及\
  \ `if` 的重复模式，没有方法可以封装该模式。你无法创建 `unless`，所以你通过 `if` 的惯用用法来模拟 `unless`：\n\n`if (!something)`\n\
  \n另一个例子，Java `new` 是一个特殊形式。多态对于 `new` 来说不可用，所以你必须通过 `new` 的惯用用法来模拟多态：\n\n`w = WidgetFactory.makeWidget(...)`\n\
  \n这种用法有点臃肿。它引入了一个全新的类 `WidgetFactory`。这个类在问题领域是没有意义的，仅仅是为了绕过构造函数特殊形式。与 `unless`\
  \ 惯用用法不同，多态实例化用法复杂到有多种实现方法。因此，这种用法应该更准确地被称为设计模式。\n\nWikipedia 定义设计模式[57 为“解决软件设计中常见问题的通用性解决方案”。它继续指出，“设计模式不是可以直接转换（强调）为代码的完成设计。”\n\
  \n这就是宏大用武之地。宏提供了一层间接，使得你可以自动处理任何重复模式的各个部分。\n\n\n\n当然，这个论点并不是完全单向的。许多人会认为，拥有一堆特殊的语法会让编程语言变得更容易学习或阅读。我们并不认同这一观点，即使我们认同，我们也愿意用语法的多样性来换取一个强大的宏系统。一旦你习惯了“代码即数据”，自动化设计模式的能力将带来巨大的回报。\n\
  \n### 扩展宏\n\n当你在创建 `unless` 宏时，你对符号 `'if` 进行了引用：\n\n|   | `` `(defmacro unless [expr\
  \ form]` `` |\n|   | `` ` (list 'if expr nil form))` `` |\n\n但你没有对任何其他符号进行引用。为了理解为什么，你需要仔细考虑宏展开（macro\
  \ expansion）阶段发生了什么：\n\n*   通过引用 `'if`，你防止了 Clojure 在宏展开时直接求值 `if`。相反，求值会去掉引用，将\
  \ `if` 留给编译。\n*   你不想引用 `` `expr` `` 和 `` `form` ``，因为它们是宏参数。Clojure 会在宏展开时不经求值就替换它们。\n\
  *   你不需要引用 `nil`，因为 `nil` 求值的结果是它本身。\n\n思考哪些需要引用会很快变得复杂。幸运的是，你不需要在脑中完成这项工作。Clojure\
  \ 包含了诊断函数，以便你可以在 REPL 中测试宏展开。\n\n`macroexpand-1` 函数将向你展示宏展开阶段发生了什么：\n\n|   | ``\
  \ `(`**`macroexpand-1`** `form)` `` |\n\n使用 `macroexpand-1` 来证明 `unless` 展开为了合理的\
  \ `if` 表达式：\n\n|   | `` `(macroexpand-1 '(unless false (println \"this should print\"\
  )))` `` |\n|   | `` `-> (if false nil (println \"this should print\"))` `` |\n\n\
  宏是复杂的野兽，我们再如何强调强调使用 `macroexpand-1` 测试它们的重要性。让我们回到这里，尝试一些 `unless` 的错误版本。这里有一个错误地引用了\
  \ `` `expr` `` 的版本：\n\n|   | `` `(defmacro bad-unless [expr form]` `` |\n|   | ``\
  \ ` (list 'if 'expr nil form))` `` |\n\n当你展开 `bad-unless` 时，你会发现它生成了符号 `` `expr`\
  \ ``，而不是实际的测试表达式：\n\n|   | `` `(macroexpand-1 '(bad-unless false (println \"this\
  \ should print\")))` `` |\n|   | `` `-> (if expr nil (println \"this should print\"\
  ))` `` |\n\n如果你尝试实际使用 `bad-unless` 宏，Clojure 将报错说无法解析符号 `` `expr` ``：\n\n|   | ``\
  \ `(bad-unless false (println \"this should print\"))` `` |\n|   | `` `-> java.lang.Exception:\
  \ Unable to resolve symbol: expr in this context` `` |\n\n有时宏会展开为其他宏。当这种情况发生时，Clojure\
  \ 会继续展开所有的宏，直到只剩下普通代码。例如，`..` 宏会递归展开，产生一个点运算符调用，并包裹在另一个 `..` 中。我们可以通过以下展开来看到这一点：\n\
  \n|   | `` `(macroexpand-1 ..)` `` |\n\n如果你想看到 `..` 展开后的结果，使用 `macroexpand`：\n\n\
  |   | `` `(macroexpand .. arm getHand))` `` |\n|   | `` `-> (. arm getHand)` ``\
  \ |\n\n注：有时宏会展开为其他宏。当这种情况发生时，Clojure 会继续展开所有的宏，直到只剩下普通代码。例如，`..` 宏会递归展开，产生一个点运算符调用，并包裹在另一个\
  \ `..` 中。我们可以通过以下展开来看到这一点：\n\n|   | `` `(macroexpand-1 ..)` `` |\n\n如果你想看到 `..`\
  \ 展开后的结果，使用 `macroexpand`：\n\n|   | `` `(macroexpand .. arm getHand))` `` |\n|  \
  \ | `` `-> (. arm getHand)` `` | \n\n使用 `macroexpand-1` 来证明 `unless` 展开为了合理的 `if`\
  \ 表达式：\n\n|   | `` `(macroexpand-1 '(unless false (println \"this should print\"\
  )))` `` |\n|   | `` `-> (if false nil (println \"this should print\"))` `` |\n\n\
  宏是复杂的野兽，我们再如何强调强调使用 `macroexpand-1` 测试它们的重要性。让我们回到这里，尝试一些 `unless` 的错误版本。这里有一个错误地引用了\
  \ `` `expr` `` 的版本：\n\n|   | `` `(defmacro bad-unless [expr form]` `` |\n|   | ``\
  \ ` (list 'if 'expr nil form))` `` |\n\n当你展开 `bad-unless` 时，你会发现它生成了符号 `` `expr`\
  \ ``，而不是实际的测试表达式：\n\n|   | `` `(macroexpand-1 '(bad-unless false (println \"this\
  \ should print\")))` `` |\n|   | `` `-> (if expr nil (println \"this should print\"\
  ))` `` |\n\n如果你尝试实际使用 `bad-unless` 宏，Clojure 将报错说无法解析符号 `` `expr` ``：\n\n|   | ``\
  \ `(bad-unless false (println \"this should print\"))` `` |\n|   | `` `-> java.lang.Exception:\
  \ Unable to resolve symbol: expr in this context` `` |\n\n有时宏会展开为其他宏。当这种情况发生时，Clojure\
  \ 会继续展开所有的宏，直到只剩下普通代码。例如，`..` 宏会递归展开，产生一个点运算符调用，并包裹在另一个 `..` 中。我们可以通过以下展开来看到这一点：\n\
  \n|   | `` `(macroexpand-1 ..)` `` |\n\n*(由于提供的原始文本中存在大量重复段落，已根据“不要重复输出”的要求进行处理，以下为剩余部分的翻译：)*\n\
  \n## 7.3 简化宏\n\n`unless` 宏是一个很棒的例子，但大多数宏都更复杂。在本节中，我们将构建一组日益复杂的宏，并引入 Clojure 的功能。为了方便参考，本节介绍的功能总结如下：\n\
  \n| 格式 | 描述 |\n| --- | --- |\n| `foo#` | 自动生成符号：在语法引用内部创建一个以 `foo` 为前缀的符号。 |\n|\
  \ `(gensym prefix?)` | 创建一个唯一名称，可选前缀。 |\n| `(macroexpand form)` | 重复展开 `form`，直到返回的结果不再是宏。\
  \ |\n| `(macroexpand-1 form)` | 展示 Clojure 如何展开 `form`。 |\n| `(list-frag? ~form\
  \ list-frag?)` | 展开取消：在语法引用内部将取消列表接到模板中。 |\n| `‘form` | 语法引用：引用 `form`，但允许内部取消以便\
  \ `form` 充模板。`form` 内部的符号将被解析以防止意外捕获。 |\n| `~form` | 取消：在语法引用内部替换未引用的值。 |\n\n首先让我们复制一个\
  \ Clojure 的 `..` 宏。将其命名为 `chain`，因为它链了一系列的方法调用。以下是 `chain` 的示例展开：\n\n| 宏调用 | 展开\
  \ |\n| --- | --- |\n| `(chain arm getHand)` | `(. arm getHand)` |\n| `(chain arm\
  \ getHand getFinger)` | `(. (. arm getHand) getFinger)` |\n\n从实现链调用一个方法的简单情况开始。宏只需要创建一个简单的列表：\n\
  \n| [src/examples/macros/chain_1.clj](http://media.prprog.com/titles/shcloj2/code/src/examples/macros/chain_1.clj)\
  \ |\n|   | `` `*`; chain reimplements Clojure's .. macro`*` `` |\n|   | `` `(`**`defmacro`**\
  \ chain [x form]` `` |\n|   | `` (`**`list`** `'.` x form))` ``\n\n`chain` 需要支持任意数量的参数，因此剩余实现应该定义递归。列表操作变得更加复杂，因为你需要构建两个列表并将它们合并。\n\
  \n\n\n\n| [src/examples/macros/chain_2.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/macros/chain_2.clj)\
  \ |\n\n```clojure\n(defmacro chain\n  ([x form] (list '.x form))\n  ([x form & more]\
  \ (concat (list '.chain (x form)) more)))\n```\n\n使用 `macroexpand` 测试 `chain` 以确保它生成正确的展开：\n\
  \n```clojure\n(macroexpand '(chain arm getHand))\n-> (. arm getHand)\n\n(macroexpand\
  \ '(chain arm getHand getFinger))\n-> (. (. arm getHand) getFinger)\n```\n\n`chain`\
  \ 宏按照目前的写法可以工作良好，但处理多个参数的表达式很难读：\n\n```clojure\n(concat (list '.chain (x form))\
  \ more))\n```\n\n`chain` 的定义在宏代码和要生成的正体之间回切换。两者的交织使得整个代码变得难以阅读。而且这只是一个单行长度的简单形式。随着宏形式变得复杂，`list`\
  \ 和 `concat` 等组装函数会迅速掩盖宏的含义。\n\n解决此类问题的一种方法是模板语言。如果宏是通过模板创建的，你就可以采用“填空”的方法来创建它们。`chain`\
  \ 的定义可能像这样：\n\n```clojure\n; 假设的模板语言\n(defmacro chain\n  ([x form] (. ${x} ${form}))\n\
  \  ([x form & more] (chain (${x} ${form}) ${more})))\n```\n\n在这个假设的模板语言中，`${}` 允许你将参数替换到宏展开中。\n\
  \n注意看这个定义变得容易读了多少，以及它清晰地展示了展开后的样子。\n\n### 语法引用（Syntax Quote）、反引用（Unquote）和展开反引用（Splicing\
  \ Unquote）\n\nClojure 宏支持在不引入额外语言的情况下模板。语法引用字符（反引号 `` ` ``）的作用几乎与普通引用相同。但在语法引用的列表内部，反引用字符（`~`，波浪号）会再次关闭引用。整体效果是看起来像这样的模板：\n\
  \n| [src/examples/macros/chain_3.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/macros/chain_3.clj)\
  \ |\n\n```clojure\n(defmacro chain [x form]\n  `(. ~x ~form))\n```\n\n测试这个新版本的 `chain`\
  \ 是否能正确生成单个方法调用：\n\n```clojure\n(macroexpand '(chain arm getHand))\n-> (. arm getHand)\n\
  ```\n\n遗憾的是，语法引用/反引用的方法对于 `chain` 的多参数变体并不完全奏效：\n\n| [src/examples/macros/chain_4.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/macros/chain_4.clj)\
  \ |\n\n```clojure\n; 不完全工作\n(defmacro chain\n  ([x form] `(. ~x ~form))\n  ([x form\
  \ & more] (chain (. ~x ~form) ~more))))\n```\n\n当展开这个 `chain` 时，括号是不对的：\n\n```clojure\n\
  (macroexpand '(chain arm getHand getFinger))\n-> (. (. arm getHand) (getFinger))\n\
  ```\n\n`chain` 的最后一个参数是 `more` 参数的列表。当你把 `more` 丢入宏“模板”时，它带有括号，因为它是一个列表。但你并不这些括号；你希望\
  \ `more` 被展开（splice）到列表中。这种情况发生得足够频繁，以有一个专门的读取器宏：展开反引用（`~@`）。使用展开反引用重写 `chain` 以将\
  \ `more` 展开：\n\n| [src/examples/macros/chain_5.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/macros/chain_5.clj)\
  \ |\n\n```clojure\n(defmacro chain\n  ([x form] `(. ~x ~form))\n  ([x form & more]\
  \ (chain (. ~x ~form) ~@more)))\n```\n\n现在，展开应该是：\n\n```clojure\n(macroexpand '(chain\
  \ arm getHand getFinger))\n-> (. arm getHand) getFinger)\n```\n\n许多宏遵循 `chain` 的模式，即\
  \ Clojure 的 `..`：\n\n1. 使用语法引用（`` ` ``）开始宏体，将整个内容视为模板。\n2. 使用反引用（`~`）插入单个参数。\n3.\
  \ 使用展开反引用（`~@`）展开 `more` 参数。\n\n### 在宏中创建名称\n\nClojure 有一个 `time` 宏，它可以对表达式进行计时，并将流逝的时间写入控制台：\n\
  \n```clojure\n(time (str \"a\" \"b\"))\n\"Elapsed time: 0 msecs\"\n\"ab\"\n```\n\
  \n让我们构建一个 `time` 的变体称为 `bench`，设计用于收集多次运行的数据。`bench` 不会写入控制台，而是返回一个映射，包含原始表达式的返回值和经过的时间。开始编写宏的最佳方法是手动编写其期望的展开形式。`bench`\
  \ 应该展开如下：\n\n```clojure\n(bench (str \"a\" \"b\"))\n; 应该展开为\n(let [start (System/nanoTime)\
  \ result (str \"a\" \"b\")]\n {:result result :elapsed (-System/nanoTime)})\n```\n\
  \n`let` 绑定 `start` 为时间，然后执行要测试的表达式，将其绑定到 `result`。最后，该形式返回一个包含 `result` 和流逝时间的映射。\n\
  \n有了展开形式，你现在可以反推并编写宏。使用上一节的技术，尝试使用语法引用反引用编写 `bench`：\n\n| [src/examples/macros/bench_1.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/macros/bench_1.clj)\
  \ |\n\n```clojure\n; 这不起工作\n(defmacro bench [expr]\n  `(let [start (System/nanoTime)\
  \ result ~expr]\n   {:result result :elapsed (-System/nanoTime)}))\n```\n\n如果你调用这个版本的\
  \ `bench`，Clojure 会报错：\n\n```clojure\n(bench (str \"a\" \"b\"))\n-> java.lang.Exception:\
  \ Can't let qualified name: examples.macros/start\n```\n\nClojure 指责你试图 let 一个全限定名称，这是非法的。调用\
  \ `macroexpand-1` 确认了这个问题：\n\n```clojure\n(macroexpand-1 '(bench (str \"a\" \"b\"\
  )))\n-> (clojure.core/let [examples.macros/start (System/nanoTime) examples.macros/result\
  \ (str \"a\" \"b\")]\n {:elapsed (clojure.core/- (System/nanoTime) examples.macros/start)\
  \ :result examples.macros/result})\n```\n\n当语法引用形式遇到符号时，它会将符号解析为全限定名称。目前这似乎是一个困扰，因为你想创建局部名称，特别是\
  \ `start` 和 `result`。但 Clojure 的方法保护你免受符号捕获这种糟糕 Bug。如果宏展开允许未限定符号 `start` 和 `result`，并且\
  \ `bench` 随后在这些名称已绑定的作用域中使用会发生什么？宏将捕捉名称并将其绑定到不同的值，导致奇怪的结果。如果 `bench` 捕获了自己的符号，它大多数时候看起来运行正常。一加二你会得到三：\n\
  \n```clojure\n(let [a 1 b 2] (bench (+ a b)))\n-> {:result 3 :elapsed 39000}\n```\n\
  \n……直到某天选了一个像 `start` 这样的本地名称，它与 `bench` 内部的名称发生了冲突：\n\n```clojure\n(let [start\
  \ 1 end 2] (bench (+ start end)))\n-> {:result 1228277342451783002, :elapsed 39000}\n\
  ```\n\n\n\n\n\nClojure 对在宏中解析名称的坚持有助于保护你免受符号捕获（symbol capture），但你仍然没有一个可用的 `bench`。你需要某种方法来引入本地名称，理想情况下是唯一的、不会与调用者使用的任何名称冲突的名称。\n\
  \nClojure 提供了一种读取器形式（reader form）来创建唯一的本地名称。在语法引用形式（syntax-quoted form）内部，你可以在无限定的名称后添加一个井号（`#`），Clojure\
  \ 就会创建一个自动生成的符号，即自动生成符号（auto-gensym）：一个基于名称加上下划线和唯一 ID 的符号。在 REPL 中尝试一下一下：\n\n|\
  \ ️ | `foo#` |\n| ️ | `foo__1004` |\n\n有了自动生成的符号，可以很容易地实现 `bench`：\n\n| ️ | `(defmacro\
  \ bench [expr] ` |\n| ️ | `(let [start# (System/nanoTime)` |\n| ️ | `result# ~expr]`\
  \ |\n| ️ | `{:result result# :elapsed (- (System/nanoTime) start#)})) ` |\n\n在 REPL\
  \ 中测试它：\n\n| � | `(bench (str \"a\" \"b\"))` |\n| ️ | `-> {:elapsed 63000, :result\
  \ \"ab\"}` |\n\nClojure 让生成唯一名称变得简单，但如果你执意如此，仍然可以强制进行符号捕获。书中的示例代码包含一个 `evil-bench`，它展示了语法引用（syntax\
  \ quoting）、引用（quoting）和反引用（unquoting）的组合如何导致符号捕获。除非你彻底理解宏，否则不要使用符号捕获。\n\n## 7.4\
  \ 宏的分类\n\n现在你已经写了几个宏，我们可以用更详细的细节重新阐述“宏俱乐部”（Macro Club）的规则。\n\n宏俱乐部的第一条规则是**不要写宏**。宏是复杂的。如果\
  \ Clojure 中没有一个宏对你来说是复杂的，那么我的公司正在招人。\n\n宏俱乐部的第二条规则是**只有当封装某种模式的唯一方法时才写宏**。正如你所看到的，抗封装的模式往往围绕特殊形式（special\
  \ forms）产生，而特殊形式是语言中的不规则之处。因此，第二条规则也可以称为“特殊形式规则”。\n\n特殊形式拥有你作为程序员不具备的特殊能力：\n\n*\
  \   特殊形式提供了最基本的流控制结构，例如 `if` 和 `recur`。所有的流控制宏最终都必须调用特殊形式。\n*   特殊形式提供了直接访问 Java\
  \ 的权限。每当你从 Clojure 调用 Java 时，你都会通过至少一个特殊形式，例如点运算符（`.`）或 `new`。\n*   名称通过特殊形式创建和绑定，无论是通过\
  \ `def` 定义变量、通过 `let` 创建词法绑定，还是通过 `binding` 创建动态绑定。\n\n尽管特殊形式非常强大，但它们并不是函数。它们不能做某些函数可以做到的事情。你不能\
  \ `apply` 一个特殊形式，不能将特殊形式存储在变量中，也不能将特殊形式作为序列库的过滤器。简而言之，特殊形式不是语言的一等公民。\n\n特殊形式的这种特殊性可能会成为一个大问题，并导致你的代码中出现重复、不可维护的模式。但宏整洁地解决了这个问题，因为你可以使用宏来生成特殊形式。在实际意义上，所有的语言特征在宏展开时都是一等特征。\n\
  \n生成特殊形式的宏通常是最难写的，但回报也最高。仿佛通过魔法一般，此类宏似乎为语言添加了新功能。\n\n宏俱乐部规则的例外是**调用者的便利性**：与相应的函数相比，你可以编写任何能让调用者生活更轻松的宏。因为宏不求值其参数，调用者可以将原始代码传递给宏，而不是将代码封装在匿名函数中。或者，调用者可以传递未转义的名称，而不是引用的符号或字符串。\n\
  \n我们查看了 Clojure 和贡献库（contrib libraries）中的宏，几乎所有的宏都遵循宏俱乐部的规则。此外，它们符合下表所示的一个或多个分类，该表展示了\
  \ Clojure 宏的分类。\n\n| 依据 | 分类 | 示例 |\n| --- | --- | --- |\n| 特殊形式 | 条件评估 | `when`,\
  \ `when-not`, `and`, `or`, `comment` |\n| 特殊形式 | 定义变量 | `defn`, `defmacro`, `defmulti`,\
  \ `defstruct`, `declare` |\n| 特殊形式 | Java 互操作 | `..`, `doto`, `import-static` |\n\
  | 调用者便利 | 延迟评估 | `lazy-cat`, `lazy-seq`, `delay` |\n| 调用者便利 | 封装评估 | `with-open`,\
  \ `dosync`, `with-out-str`, `time`, `assert` |\n| 调用者便利 | 避免 lambda | （与“封装评估”相同）\
  \ |\n\n让我们逐一检查每个分类。\n\n### 条件评估\n\n由于宏不会立即求值其参数，它们可以用于创建自定义的控制结构。你已经在 7.2 节的 `unless`\
  \ 示例中见过了。\n\n带有条件评估的宏读写起来通常比较简单。它们遵循一种常见的形式：评估某些参数（条件）；然后根据该评估结果，选择哪些参数进行评估。一个很好的例子是\
  \ `and`：\n\n```clojure\n(defmacro and [cond & rest]\n  (if cond\n    (if (first\
  \ rest)\n      (and (first rest) (and (next rest)))\n      nil)\n    nil))\n```\n\
  （注：上述逻辑是根据文本对 `and` 行为的描述重构的）\n\n实际上，严格遵循文本：\n`and` 评估某些参数（条件）；然后，根据该评估结果，选择哪些参数进行评估。\n\
  \n### 创建变量\n\nClojure 变量是通过 `def` 特殊形式创建的。任何其他创建变量的东西最终都必须调用 `def`。因此，例如，`defn`、`defmacro`\
  \ 和 `defmulti` 都是宏。\n\n为了演示编写创建变量的宏，我们将查看两个 Clojure 部分的宏：`defstruct` 和 `declare`。\n\
  \nClojure 提供了一个用于创建结构体的低级函数 `create-struct`：\n\n`create-struct & key-symbols`\n\n\
  使用 `create-struct` 创建一个 `` `person` `` ：\n\n`(def person (create-struct :first-name\
  \ :last-name))` `-> #'user/person`\n\n`create-struct` 可以，但视觉上很冗余。由于你通常想 `def` 一个新结构，你通常会调用\
  \ `defstruct`，它在一次操作中将 `def` 和 `create-struct` 结合在一起。\n\n\n\n\n\n`defstruct` 是一个简单的宏，它已经是\
  \ Clojure 的一部分了：\n\n|   | `(defmacro defstruct)` |\n| :--- | :--- |\n|   | `[`name`\
  \ & `keys`]` |\n|   | `(`def` ~`name`(`create-struct` ~@`keys`)))` |\n\n这个宏看起来非常简单，你可能可能想把它写成一个函数。但你做不到，因为\
  \ `def` 是一个特殊形式。你必须在宏展开时生成 `def`；不能在运行时对 `def` 进行“动态”调用。\n\n`defstruct` 让单行代码更易读，但某些宏也可以将许多行代码压缩为单个形式。考虑前向声明的问题：你正在编写一个需要对变量\
  \ `a`、`b`、`c` 和 `d` 进行前向引用的程序。你可以无参数调用 `def` 来定义变量名而不进行初始绑定：\n\n|   | `(def a)`\
  \ |\n| :--- | :--- |\n|   | `(def b)` |\n|   | `(def c)` |\n|   | `(def d)` |\n\n\
  但这很繁琐，并且浪费了大量的垂直空间。`declare` 宏接收一个变量名称列表，并为每个名称执行 `def` 操作：\n\n|   | `(declare &\
  \ names)` |\n| :--- | :--- |\n\n现在你可以在一个紧凑的形式中声明所有名称：\n\n|   | `(declare a b c d)`\
  \ |\n| :--- | :--- |\n|   | `-> #'user/d` |\n\n`declare` 的实现内置在 Clojure 中中：\n\n\
  |   | `(defmacro declare)` |\n| :--- | :--- |\n|   | `[& names] (do ~@(map #(`list\
  \ 'def %) names)))` |\n\n让我们从内向外地分析 `declare`。匿名函数 `#(list 'def %)` 负责生成单个 `def`。在\
  \ REPL 中单独测试这个形式：\n\n|   | `(#(list 'def %) 'a)` |\n| :--- | :--- |\n|   | `-> (def\
  \ a)` |\n\n`map` 会为传入的每个符号调用一次内部函数。同样，你可以在 REPL 中测试这个形式：\n\n|   | `(map #(list 'def\
  \ %) '[a b c d])` |\n| :--- | :--- |\n|   | `-> ((def a) (def b) (def c) (def d))`\
  \ |\n\n最后，开头的 `do` 将整个展开结果转换为一个合法的 Clojure 形式：\n\n|   | `(do ~@(map #(list 'def\
  \ %) '[a b c d]))` |\n| :--- | :--- |\n|   | `-> (do (def a) (def b) (def c) (def\
  \ d))` |\n\n在之前的形式中替换 `'[a b c d]` 等同于使用 `macroexpand-1` 对整个宏进行手动测试的结果：\n\n|   |\
  \ `(macroexpand-1 '(declare a b c d))` |\n| :--- | :--- |\n|   | `-> (do (def a)\
  \ (def b) (def c) (def d))` |\n\nClojure 中很多有趣的部分是展开为涉及 `def` 的特殊形式的宏。我们在这里探索了几个，但你可以阅读其中任何一个的源码。它们大多数位于\
  \ Clojure 源码发行版的 `src/clj/clojure/core.clj` 中。\n\n### Java 互操作\n\nClojure 程序通过 `.`\
  \ (点)、`new` 和 `set!` 特殊形式调用 Java。然而，地道的 Clojure 代码经常使用 `..`（线程成员访问）和 `doto` 等宏来简化调用\
  \ Java 的形式。\n\n你（或任何人）可以通过编写宏来扩展 Clojure 调用 Java 的方式。考虑以下场景：你正在编写使用 `java.lang.Math`\
  \ 中几个常量的代码：\n\n|   | `Math/PI` |\n| :--- | :--- |\n|   | `-> 3.141592653589793`\
  \ |\n|   | `(Math/pow 10 3)` |\n|   | `-> 1000.0` |\n\n在较长的代码段中，`Math/` 前缀很快就会分散注意力，因此如果能简单地说\
  \ `PI` 和 `pow` 就好了。Clojure 没有提供直接实现此方法，但你可以手动定义一组变量：\n\n|   | `(def PI Math/PI)`\
  \ |\n| :--- | :--- |\n|   | `-> #'user/PI` |\n|   | `(defn pow [b e] (Math/pow b\
  \ e))` |\n|   | `-> #'user/pow` |\n\nStuart Sierra 使用 `import-static` 宏自动化了这些样板代码：\n\
  \n|   | `(import-static)` |\n| :--- | :--- |\n|   | `import-static` |\n\n`with-out-str`\
  \ 使得使用 `print` 和 `println` 来构建字符串变得简单：\n\n|   | `(with-out-str (print \"hello, \"\
  ) (print \"world\"))` |\n| :--- | :--- |\n|   | `-> \"hello, world\"` |\n\n`with-out-str`\
  \ 的实现结构简单，可以作为编写相似宏的模板：\n\n```clojure\n(defmacro with-out-str\n  [&body]\n  (let\
  \ [s# (new java.io.StringWriter)]\n    (binding [*out* s#]\n      ~@body)\n    (str\
  \ s#)))\n```\n\n### 包装评估\n\n包装宏通常接受变数量的参数（第 2 行），这些是需要评估的形式。它们随后按三个步骤进行：\n\n1. **设置**：为评估创建一些特殊的上下文，根据需要通过\
  \ `let`（第 3 行）和 `binding`（第 4 行）引入绑定。\n2. **评估**：评估形式（第 5 行）。由于通常有变数量的形式，通过拆分反引用\
  \ `~@` 插入它们。\n3. **清理**：将执行上下文重置为正常，并根据情况返回一个值（第 6 行）。\n\n在编写包装宏时，始终问自己是否需要 `finally`\
  \ 块来正确实现清理步骤。对于 `with-out-str`，答案是否定的，因为 `let` 和 `binding` 都会处理它们自己的清理工作。然而，如果你正在通过\
  \ Java API 设置某些全局或线程本地状态，你你需要一个 `finally` 块来重置这些状态。\n\n\n\n\n\n这种对可变状态的论述导致了另一个观察结果。任何在包装器宏内部执行时行为会发生的代码，显然都不是纯函数。`print`\
  \ 和 `println` 的行为根据 `*out` 的值而不同，因此它们不是纯函数。设置 `binding`（绑定）的宏，例如 `with-out-str`，这样做是为了改变某处不纯函数的行为。\n\
  \n并不是所有的包装器都会改变它们所封装的函数的行为。你已经见过 `time`，它会记录函数的执行时间。另一个例子是 `assert`：\n\n|   | `(assert\
  \ expr)` |\n\n`assert` 测试一个表达式，如果该表达式在逻辑上为假，则抛出异常：\n\n|   | `(assert (= 1 1))` |\n\
  |   | `-> nil` |\n|   | ` ` |\n|   | `(assert (= 1 2))` |\n|   | `-> java.lang.Exception:\
  \ Assert failed: (= 1 2)` |\n\n像 `assert` 和 `time` 这样的宏违反了宏 俱乐部的第一条规则，以避免不必要的 lambda。\n\
  \n### 避免 Lambda\n\n出于历史原因，匿名函数通常被称为 lambda。有时，宏可以用函数调用来代替，并将参数包装在 lambda 中。例如，来自\
  \ Syntax Quote, Unquote, and Splicing Unquote 的 `bench` 宏并不需要是一个宏。你可以将其写为一个函数：\n\
  \n|   | `(defn bench-fn [f]` |\n|   | ` (let [start (System/nanoTime)` |\n|   |\
  \ ` result (f)]` |\n|   | ` {:result result :elapsed (- (System/nanoTime) start))`))`\n\
  \n然而，如果你想调用 `bench-fn`，你必须传递一个封装了你想执行的形式的函数。以下代码展示了区别：\n\n|   | `; macro` |\n| \
  \  | `(bench (+ 1 2))` |\n|   | `-> {:elapsed 44000, :result 3}` |\n|   | ` ` |\n\
  |   | `; function` |\n|   | `(bench-fn (fn [] (+ 1 2)))` |\n|   | `-> {:elapsed\
  \ 53000, :result 3}` |\n\n对于像 `bench` 这样的功能，宏和匿名函数几乎可以互相替代。两者都防止了形式的立即执行。然而，匿名函数方法需要`调用者`端花费更多工作，因此打破第一条规则编写宏而不是函数是可以接受的。\n\
  \n另一个倾向于为 `bench` 使用宏的原因是，`bench-fn` 并不是完美的替代品；它在运行时增加了匿名函数调用的开销。由于 `bench` 的目的是为某些事物计时，你应该避免这种开销。\n\
  \n## 7.5 总结\n\nClojure 宏允许你使代码中的模式自动化。因为它们在宏展开时转换源代码，所以你可以使用宏来抽象代码中任何种类的模式。你并不局限于在\
  \ Clojure 内部工作。通过宏，你可以将 Clojure 扩展到你的问题领域。\n\n### 注脚\n\n| [56 | 我们并不是在特意抨击 Java；只是讨论特定语言比较容易，而且\
  \ Java 是众所周知的。 |\n| [57 | [http://en.wikipedia.org/wiki/Design_pattern_(computer_science)]\
  \ |\n| [58 | [http://thinkrelevance.com] |\n\nCopyright © 2012, The Pragmatic Bookshelf.\n\
  \n# 第 8 章\n\n## 多方法 (Multimethods)\n\nClojure 多方法提供了一种灵活的方法，将函数与一组输入关联。这类似于 Java\
  \ 的多态，但更通用。当你调用 Java 方法时，Java 通过检查单个对象的类型来选择一个特定的实现执行。当你调用 Clojure 多方法时，Clojure\
  \ 通过检查你选择的任何函数应用于所有函数参数的结果，来选择一个特定的实现执行。\n\n在本章中，你将通过首先体验没有多方法的生活，从而让你对多方法产生渴望。然后，你将构建一系列日益复杂的多方法实现，首先使用多方法来模拟多态，然后使用多方法来实现各种即时分类法（ad\
  \ hoc taxonomies）。\n\nClojure 中多方法的使用频率远比面向对象语言中的多态低得多。但在使用它们的地方，它们通常是代码中的关键特性。第\
  \ 8.5 节 我什么时候应该使用多方法？ 解析了多方法在几个开源 Clojure 项目中的用法，并提供了在你自己的程序中使用它们的指南。\n\n如果你是按照章节顺序阅读这本书，那么一旦完成本章，你已经看到了\
  \ Clojure 语言的所有关键特性。\n\n## 8.1 没有多方法的生活\n\n欣赏多方法的最好方法是花几分钟没有它们的生活，所以让我们开始吧。Clojure\
  \ 已经可以使用 `print`/`println` 打印任何内容了。但请假设这些函数不存在，你需要构建一个通用的打印机制。首先，创建一个 `my-print`\
  \ 函数，它可以将字符串打印到标准输出流 `*out`：\n\n| [src/examples/life_without_multi.clj](http://src/examples/life_without_multi.clj)\
  \ |\n|   | `(defn my-print [ob]` |\n|   | ` (.write *out ob))` |\n\n接下来创建一个 `my-println`，它调用\
  \ `my-print` 并添加一个换行符：\n\n| [src/examples/life_without_multi.clj](http://src/examples/life_without_multi.clj)\
  \ |\n|   | `(defn my-println [ob]` |\n|   | ` (my-print ob)` |\n|   | ` (write *out\
  \ \"\\n\"))` |\n\n换行符让 `my-println` 的输出更容易读。在本节的剩余部分，通过测试字符串来修改 `my-println`：\n\n\
  ```clojure\n(println \"hello\")\n```\n\n很好但 `println` 处理非字符串（如 `nil`）的效果不好：\n\n\
  ```clojure\n(println nil)\n```\n\n这会导致 `java.lang.NullPointerException`。但这并不大。使用\
  \ `cond` 为 `nil` 添加处理：\n\n```clojure\n(defn my-println [ob]\n  (cond\n    (nil?)\
  \ (.write *out \"nil\")\n    (string?) (.write *out ob)))\n```\n\n有了判断，你可以轻松地打印\
  \ `nil`：\n\n```clojure\n(println nil)\n```\n\n当然，还有许多 `my-println` 无法处理的类型。如果你尝试打印向量，两个\
  \ `cond` 子句都不会匹配，程序将什么都不打印：\n\n```clojure\n(println [1 2 3])\n```\n\n到这里你已经懂了。只需为向量情况添加另一个\
  \ `cond` 子句。这里的实现稍微复杂，所以你可能想将实际打印分离到一个辅助函数，例如 `my-print-vector`：\n\n| [src/examples/life_without_multi.clj](http://src/examples/life_without_multi.clj)\
  \ |\n|   | `(require '[clojure.string :as str])` |\n|   | `(defn my-print-vector\
  \ [ob]` |\n|   | ` (.write *out \"[\")` |\n|   | ` (.write *out (str/join \" \"\
  \ ob))` |\n|   | ` (.write *out \"]\"))))` |\n|   | ` ` |\n|   | `(defn my-print\
  \ [ob]` |\n|   | ` (cond` |\n|   | ` (vector?) ob) (my-print-vector ob)` |\n|  \
  \ | ` (nil?) ob (.write *out \"nil\")` |\n|   | ` (string?) ob (.write *out ob)))`\
  \ |\n\n确保你现在可以打印向量了：\n\n```clojure\n(my-println [1 2 3])\n```\n\n\n\n\n\n`my-println`\
  \ 现在支持三种类型：字符串、向量和 `nil`。你拥有一条处理新类型的路线图：只需在 `my-println` 的 `cond` 中添加新的子句即可。但这是一个糟糕的路线图，因为它将两个东西混在了一起：选择实现的决策过程以及具体的实现细节。\n\
  \n你可以通过提取如 `my-print-vector` 这样的辅助函数来稍微改善局面。然而，每当你想要为 `my-println` 添加新功能时，你都必须进行两个更改：\n\
  \n*   创建一个新的特定类型的辅助函数。\n*   修改现有的 `my-println`，添加一个新的 `cond` 来调用该特定功能的辅助函数。\n\n\
  你真正想要的是一种通过在单处添加新代码来为系统添加新功能的方法，而无需修改任何现有代码。Clojure 通过协议（protocols）实现了这一点，具体详见第\
  \ 6.3 节，协议 和多方法（multimethods）。\n\n## 8.2 定义多方法\n\n要定义一个多方法，请使用 `defmulti`：\n\n|\
  \ | `(defmulti name dispatch-fn)` |\n\n`name` 是新多方法的名称，Clojure 将针对方法参数调用 `dispatch-fn`，以选择该多方法的某个特定方法（实现）。\n\
  \n考虑上一节中的 `my-print`。它接收一个参数，即要打印的内容，你想要根据该参数的类型来选择一个特定的实现。因此，`dispatch-fn` 需要一个接收一个参数并返回该参数类型的函数。Clojure\
  \ 拥有一个符合此描述的内置函数，即 `class`。使用 `class` 创建一个名为 `my-print` 的多方法：\n\n| [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(defmulti my-print class)` |\n\n此时，你提供了一个关于多方法将如何选择特定方法的描述，但还没有具体的特定方法。意料之中，尝试调用\
  \ `my-print` 将失败：\n\n| | `(my-println \"foo\")` |\n| | `-> java.lang.IllegalArgumentException:\
  \ ` |\n| | `No method for dispatch value` |\n\n为 `my-println` 添加特定的方法实现，请使用 `defmethod:`：\n\
  \n| | `(defmethod name dispatch-val & fn-tail)` |\n\n`name` 是实现所属的多方法的名称。Clojure\
  \ 将 `defmulti` 的分发函数的结果与 `dispatch-val` 匹配以选择一个方法，而 `fn-tail` 包含了参数和函数体形式，就像普通函数一样。\n\
  \n创建一个匹配字符串的 `my-print` 实现：\n\n| [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(defmethod my-print String [s])` |\n| | `(.write *out s))` |\n\n现在，使用字符串参数调用\
  \ `my-println`：\n\n| | `(my-println \"stu\")` |\n| | `| stu` |\n| | `-> nil` |\n\
  \n接下来，创建一个匹配 `nil` 的 `my-print`：\n\n| [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(defmethod my-print nil [s])` |\n| | `(.write *out \"nil\"))` |\n\n注意，你已经解决了上一节提出的问题。不再是在巨大的\
  \ `cond` 中合并，`my-println` 的每个实现都是独立的。多方法的方法可以存在于你源代码的任何地方，你你可以随时添加新方法，而无需触碰原始代码。\n\
  \n### 分发感知继承\n\n多方法的分发感知 Java 继承关系。要看到这一点，创建一个处理 `Number` 的 `my-print`，通过打印数字的 `toString`\
  \ 表示形式来处理它：\n\n| [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(defmethod my-print Number [n])` |\n| | `(.write *out (.toString n)))`\
  \ |\n\n用整数测试 `Number` 实现：\n\n| | `(my-println 42)` |\n| | `| 42` |\n| | `-> nil`\
  \ |\n\n`42` 是一个 `Integer`，而不是 `Number`。多方法分发足够智能，知道整数是一个数字并进行匹配。内部，分发使用 `isa?` 函数：\n\
  \n| | `(isa? child parent)` |\n\n`isa?` 感知 Java 继承，所以它知道 `Integer` 是一个 `Number`：\n\
  \n| | `(isa? Integer Number)` |\n| | `-> true` |\n\n`isa?` 不限于继承。它的行为可以在运行时扩展，正如你稍后在第\
  \ 8.4 节 创建动态分类 中看到的 true。\n\n### 多方法的默认值\n\n如果 `my-print` 能有一个回退表示，供你用于任何未定义的类型，那就太好了。你可以使用\
  \ `:default` 作为分发值来处理未匹配的方法。使用 `:default` 创建一个 `my-println`，打印对象的 `toString` 值，并包裹在\
  \ `<` 中：\n\n| [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(defmethod my-print :default [s])` |\n| | `(.write *out \"<\")` |\n| |\
  \ `(.write *out (.toString s))` |\n| | `(.write *out \">\"))` |\n\n现在，使用默认值测试 `my-println`\
  \ 打印随机内容：\n\n| | `(my-println (java.sql.Date. 0))` |\n| | `-> <1969-12-31>` |\n\
  | | `(my-println (java.util.Random.))` |\n| | `-> <@ |\n\n如果 `:default` 在你的领域中具有特定含义，你可以通过这种备用签名创建一个多方法：\n\
  \n| | `(defmulti name dispatch-fn default)` |\n\n`default-value` 允许你指定自己的默认值。也许你想把它称为\
  \ `:everything-else`：\n\n| [src/examples/multethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(defmulti my-print class :everything-else)` |\n| | `(defmethod my-print\
  \ String [s])` |\n| | `(.write *out s))` |\n| | `(defmethod my-print :everything-else\
  \ [_])` |\n| | `(.write *out \"Not implemented...\")`\n\n任何未匹配的分发值现在将匹配 `:everything-else`。\n\
  \n根据第一个参数的类型分发多方法（正如你在 `my-print` 中所示）是最常见的分发类型。事实上，在许多面向对象的语言中，它是唯一的动态分发，被称为多态。\n\
  \nClojure 的分发通用得多。让我们为 `my-print` 添加一些复杂性，超越多态的范围。\n\n## 8.3 超越简单分发\n\nClojure 的\
  \ `print` 函数将各种“序列”事物打印为列表。如果你希望 `my-print` 这样做，你可以添加一个在 Java 继承层次结构中较高的接口分发的方法，例如\
  \ `Collection`：\n\n| [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\
  \ |\n| | `(require '[clojure.string :as str])` |\n| | `(defmethod my-print java.util.Collection\
  \ [c])` |\n| | `(.write *out \"(\")` |\n| | `(.write *out (str/join \" \" c))` |\n\
  | | `(.write *out \")\"))` |\n\n现在，尝试各种序列，看看它们得到了良好的打印表示：\n\n| | `(my-println (take\
  \ 6 (cycle [1 2 3])))` |\n| | `| (1 2 3 1 2 3)` |\n| | `-> nil` |\n| | `(my-println\
  \ [1 2 3])` |\n| | `| (1 2 3)` |\n| | `-> nil` |\n\n\n\n\n作为一个追求完美主义者，你无法忍受向量在打印时使用圆括号，因为这与它们字面量上的方括号语法不同。因此，再添加一个\
  \ `my-print` 方法，这次用来处理向量。向量都实现了 `IPersistentVector`，所以这应该是可以行的：\n\n[src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\n\
  \n```clojure\n(defmethod my-print clojure.lang.IPersistentVector [c]\n  (.write\
  \ out \"[\")\n  (.write out (str/join \" \" c))\n  (.write out \"]\"))\n```\n\n\
  但它不起作用。相反，现在打印向量会抛出异常：\n\n```clojure\n(my-println [1 2 3])\n-> java.lang.IllegalArgumentException:\
  \ Multiple methods match\ndispatch value: class clojure.lang.LazilyPersistentVector\
  \ ->\ninterface clojure.lang.IPersistentVector and\ninterface java.util.Collection,\n\
  and neither is preferred\n```\n\n问题在于现在有两个分发值匹配向量：`Collection` 和 `IPersistentVector`。许多语言通过限制方法分发来确保这些冲突永远不会发生，例如禁止多重继承。Clojure\
  \ 采取了不同的方法。你可以创建冲突，并使用 `prefer-method` 来解决它们：\n\n```clojure\n(prefer-method multi-name\
  \ loved-dispatch dissed-dispatch)\n```\n\n当你对多泛方法调用 `prefer-method` 时，你是在告诉它在发生冲突时优先选择\
  \ `loved-dispatch` 值 而非 `dissed-dispatch` 值。由于你希望 `my-print` 的向量版本优于集合版本，请告诉多泛方法你的需求：\n\
  \n[src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\n\
  \n```clojure\n(prefer-method\n my-print clojure.lang.IPersistentVector java.util.Collection)\n\
  ```\n\n现在，你应该能够将向量和其他序列都路由到正确的方法实现上：\n\n```clojure\n(my-println (take 6 (cycle [1\
  \ 2 3])))\n| (1 2 3 1 2 3)\n-> nil\n\n(my-println [1 2 3])\n| [1 2 3]\n-> nil\n\
  ```\n\n许多语言创建了复杂的规则或任意限制，以解决其函数分发系统中的歧义。Clojure 允许一种简单得的方法：只需不要担心！如果存在歧义，使用 `prefer-method`\
  \ 来解决它。\n\n## 8.4 创建即时分类\n\n多泛方法（Multimethods）允许你创建即时分类（ad hoc taxonomies），当你发现没有显式声明的类型关系时非常有帮助。\n\
  \n例如，考虑一个处理支票账户和储蓄账户的金融应用程序。为账户定义一个 Clojure 结构（struct），使用 `tag` 来区分两者。将代码放在 `examples.multimethods.account`\
  \ 空间中。为了做到，你需要在类路径上创建一个名为 `examples/multimethods/account.clj` 的文件，然后输入以下代码：\n\n\
  [src/examples/multimethods/account.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/account.clj)\n\
  \n```clojure\n(ns examples.multimethods.account)\n\n(defstruct account :id :tag\
  \ :balance)\n```\n\n现在，你将创建两个不同的支票账户，标记为 `::Checking` 和 `::Savings`。大写名称是 Clojure\
  \ 的惯例，表示关键字正作为类型使用。双冒号 `::` 导致关键字在当前命名空间解析。要查看命名解析，请在 REPL 中比较输入 `:Checking` 和 `::Checking`：\n\
  \n```clojure\n:Checking\n-> :Checking\n\n::Checking\n-> :user/Checking\n```\n\n\
  将关键字放在命名空间有助于防止与其他人的代码冲突。当你想要从另一个命名空间使用 `::Savings` 或 `::Checking` 时，你需要对它们进行完全限定：\n\
  \n```clojure\n(struct account 1 examples.multimethods.account/Savings 100)\n-> {:id\
  \ 1 :tag examples.multimethods.account/Savings :balance 100}\n```\n\n全名很冗长，所以你可以使用\
  \ `alias` 为长名称指定较短的别名：\n\n`alias short-name namespace-symbol`\n\n```clojure\n(alias\
  \ 'acc 'examples.multimethods.account)\n-> nil\n```\n\n现在 `acc` 别名可用，创建两个顶层对象，一个储蓄账户和一个支票账户：\n\
  \n```clojure\n(def test-savings (struct account 1 ::acc/Savings 100))\n-> #'user/test-savings\n\
  \n(def test-checking (struct account 2 ::acc/Checking 250))\n-> #'user/test-checking\n\
  ```\n\n注意，结尾的 `100` 创建了一个 `BigDecimal` 字面量，并不意味着你拥有数百万。\n\n支票账户的利率为 0，储蓄账户的利率为 5%。创建一个根据\
  \ `:tag` 分发的多泛方法 `interest-rate`，如下所示：\n\n[src/examples/multimethods/account.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/account.clj)\n\
  \n```clojure\n(defmulti interest-rate :tag)\n  (defmethod interest-rate ::acc/Checking\
  \ 0)\n  (defmethod interest-rate ::acc/Savings 0.05))\n```\n\n检查你的 `test-savings`\
  \ 和 `test-checking` 以确保 `interest-rate` 按预期工作。\n\n```clojure\n(interest-rate test-savings)\n\
  -> 0.05\n\n(interest-rate test-checking)\n-> 0\n```\n\n账户有年度服务费，规则如下：\n\n- 普通支票账户支付\
  \ 25 美元服务费。\n- 普通储蓄账户支付 10 美元服务费。\n- 高级账户免收费用。\n- 余额为 5,000 美元以上的支票账户为高级账户。\n- 余额为\
  \ 1,000 美元以上的储蓄账户为高级账户。\n\n在现实的例子中，规则会更复杂。高级状态将由随平均余额驱动，并且可能还有其他入标方式。但之前的规则已经足够复杂以说明这一点。\n\
  \n你可以使用大量的条件逻辑来实现 `service-charge`，但 `premium` 感觉像是一个类型，尽管账户上没有显式的 `premium` 标签。创建一个返回\
  \ `::Premium` 或 `::Basic` 的 `account-level` 多泛方法：\n\n[src/examples/multimethods/account.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/account.clj)\n\
  \n```clojure\n(defmulti account-level :tag)\n  (defmethod account-level ::acc/Checking\
  \ [acct]\n    (if (>= (:balance acct) 5000) ::Premium ::Basic))\n  (defmethod account-level\
  \ ::acc/Savings [acct]\n    (if (>= (:balance acct) 1000) ::Premium ::Basic)))\n\
  ```\n\n测试 `account-level` 以确保支票账户和储蓄账户需要不同的余额水平达到 `::Premium` 状态：\n\n```clojure\n\
  (account-level (struct account 1 ::acc/Savings 2000))\n-> :examples.multimethods.account/Premium\n\
  \n(account-level (struct account 1 ::acc/Checking 2000))\n-> :examples.multimethods.account/Basic\n\
  ```\n\n现在你可能忍不住用 `account-level` 作为分发函数来实现 `service-charge`：\n\n[src/examples/multimethods/service_charge_1.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/service_charge_1.clj)\n\
  \n```clojure\n; 错误方法\n(defmulti service-charge account-level)\n  (defmethod service-charge\
  \ ::Basic [acct]\n    (if (= (:tag acct) ::Checking) 25 10))\n  (defmethod service-charge\
  \ ::Premium [_] 0))\n```\n\n\n\n\n`service-charge` 中针对 `::Basic` 的条件逻辑正是多方法（multimethods）应该帮助我们避免的类型驱动条件逻辑。这里的问题在于，你已经根据\
  \ `account-level` 进行分发，而现在你还需要根据 `:tag` 进行分发。没问题——你可以对两者进行分发。编写一个 `service-charge`，其分发函数同时调用\
  \ `account-level` 和 `:tag`，并将结果返回在一个向量中：\n\n| [src/examples/multimethods/service_charge_2.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/service_charge_2.clj)\
  \ |\n| :--- |\n| | `(defmulti service-charge (fn [acct] [(account-level acct) (:tag\
  \ acct)]))` |\n| | `(defmethod service-charge [::acc/Basic ::acc/Checking] [_] 25)`\
  \ |\n| | `(defmethod service-charge [::acc/Basic ::acc/Savings] [_] 10)` |\n| |\
  \ `(defmethod service-charge [::acc/Premium ::acc/Checking] [_] 0)` |\n| | `(defmethod\
  \ service-charge [::acc/Premium ::acc/Savings] [_] 0)` |\n\n这个版本的 `service-charge`\
  \ 针对两个不同的分类体系进行分发：账户内部的 `:tag` 和外部定义的 `account-level`。尝试几个账户来验证 `service-charge`\
  \ 是否按预期工作：\n\n| |\n| :--- |\n| | `(service-charge {:tag ::acc/Checking :balance\
  \ 1000})` |\n| | `-> 25` |\n| | |\n| | `(service-charge {:tag ::acc/Savings :balance\
  \ 1000})` |\n| | `-> 0` |\n\n注意，之前的测试甚至没有去费心为测试创建一个“真实”的账户。像 `account` 这样的结构体只是为了存储特定字段而优化的\
  \ map，如果你发现使用普通的 map（plain old map）更方便，也没有什么阻止你这样做。\n\n### 为即用类型添加继承\n\n你还可以对 `service-charge`\
  \ 做进一步的改进。由于所有高级账户都有相同的服务费，为 `::Savings` 和 `::Checking` 账户定义两个独立的 `service-charge`\
  \ 方法似乎是多余的。如果有一个父类型 `::Account` 就好了，这样你就可以定义一个匹配任何类型 `::Account` 的 `::Premium` 多方法。Clojure\
  \ 允许通过 `derive` 定义任意的父子关系：\n\n| |\n| :--- |\n| | `(derive child parent)` |\n\n使用\
  \ `derive`，你可以指定 `::Savings` 和 `::Checking` 都是 `::Account` 的一种类型：\n\n| [src/examples/multimethods/service_charge_3.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/service_charge_3.clj)\
  \ |\n| :--- |\n| | `(derive ::Savings ::Account)` |\n| | `(derive ::Checking ::Account)`\
  \ |\n\n当你开始使用 `derive` 时，`isa?` 就发挥作用作用了。除了理解继承之外，`isa?` 还了解所有通过 `derive` 建立的关系：\n\
  \n| |\n| :--- |\n| | `(isa? ::Savings ::Account)` |\n| | `-> true` |\n\n现在 Clojure\
  \ 知道 `Savings` 和 `Checking` 是 `Account` 了，你可以使用单个方法来定义 `service-charge` 以处理 `::Premium`：\n\
  \n| [src/examples/multimethods/service_charge_3.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods/service_charge_3.clj)\
  \ |\n| :--- |\n| | `(defmulti service-charge (fn [acct] [(account-level acct) (:tag\
  \ acct)]))` |\n| | `(defmethod service-charge [::acc/Basic ::acc/Checking] [_] 25)`\
  \ |\n| | `(defmethod service-charge [::acc/Basic ::acc/Savings] [_] 10)` |\n| |\
  \ `(defmethod service-charge [::acc/Premium ::Account] [_] 0)` |\n\n从表面上看，你可能认为\
  \ `derive` 和 `isa?` 仅仅是复制了 Clojure 通过 Java 继承已经获得的功能。事实并非如此。Java 的继承关系在定义类时就已经固定了。而\
  \ `derive` 建立的关系可以在需要时创建，并且可以在不经对象同意的情况下应用于现有对象。因此，当你发现一个有用的关系时，可以 `derive` 该关系，而无需触碰原始对象并创建令人讨厌的“包装”类。\n\
  \n如果定义多方法的不同方式让你头晕眼胀，不要担心。在实践中，大多数 Clojure 代码节制地使用多方法。\n\n### 我什么时候使用多方法？\n\n多方法非常灵活，而这种灵活性带来了选择。我们应该如何选择使用多方法，而不是其他技术？我们从两个方向考虑这个问题，并问了以下问题：\n\
  \n* Clojure 项目在什么地方使用多方法？\n* Clojure 项目在什么地方避开多方法？\n\n最令人惊讶的是，多方法非常稀少——大约每 1000\
  \ 行代码有一个。一个没有定义任何多方法的 Clojure 程序并不像没有多态的面向对象程序那样奇怪。\n\n许多多方法根据类分发。按类分发是最容易理解和实现的一种分发方式。我们在\
  \ `my-print` 示例中详细讨论过，所以这里不再多说。\n\n根据类以外进行分发的方法相当少。我们可以直接在 Clojure 中查找示例。`clojure.inspector`\
  \ 和 `clojure.test` 库使用了异常的分发函数。\n\n### Inspector\n\nClojure 的 `inspector` 库使用 Swing\
  \ 创建数据的简单视图。你可以用它获取系统属性的树视图：\n\n| |\n| :--- |\n| | `(use '[clojure.inspector :only\
  \ (inspect-tree)])` |\n| | `(inspect-tree (System/getProperties))` |\n| | `-> <JFrame>`\
  \ |\n\n`inspect-tree` 返回（并显示）任何树形内容的 `JFrame`。因此，你也可以将 map 传递给 `inspect-tree`：\n\
  \n| |\n| :--- |\n| | `(inspect-tree {:creator \"Rich\" :runs-on-jvm true}})` |\n\
  | | `-> <JFrame>` |\n\n树由回答两个问题的节点组成：\n\n* 我的子节点是谁？\n* 我是叶子节点吗？\n\n“树”、“节点”和“叶子”这些树形概念听起来像是面向对象设计中类或接口的候选者。但\
  \ inspector 并不是这样工作的。它通过一个名为 `collection-tag` 的分发函数，以即用的方式为现有类型添加了“树形”类型系统：\n\n\
  | |\n| :--- |\n| | *来自 Clojure 的 clojure/inspector.clj* |\n```clojure\n(defn collection-tag\
  \ [x]\n  (cond\n    (instance? java.util.Map$Entry x) :entry\n    (instance? clojure.lang.IPersistentMap\
  \ x) :map\n    (instance? java.util.Map x) :map\n    (instance? clojure.lang.Sequential\
  \ x) :seq\n    :else :atom))\n```\n\n`collection-tag` 返回 `:entry`, `:map`, `:seq`\
  \ 或 `:atom` 关键字之一。这些关键字构成了树形世界的类型系统。随后，用于分发三个不同的多方法，根据树形类型系统选择特定的实现。\n\n| |\n| :---\
  \ |\n| | `(defmulti is-leaf collection-tag)` |\n| | |\n| | `(defmulti get-child\
  \ (fn [parent index] (collection-tag parent)))` |\n| | |\n| | `(defmulti get-child-count\
  \ collection-tag)` |\n| | *方法实现已省略以保持简见* |\n\n\n\n\nClojure 中的 `clojure.test` 库允许你使用\
  \ `is` 宏编写多种不同类型的断言。你可以断言任意函数是否为真。例如，`10` 不是一个字符串：\n\n```clisp\n(use :reload '[clojure.test\
  \ :only (is)])\n(is (string? 10))\nFAIL in clojure.lang.PersistentList$EmptyList@1\
  \ (NO_SOURCE_FILE:2)\nexpected: (string? 10)\nactual: (not (string? 10))\n-> false\n\
  ```\n\n虽然你可以使用任意函数，但 `is` 了解一些特定的函数并提供更详细的错误信息。例如，你可以检查一个字符串是否不是 `Collection` 的\
  \ `instance?`：\n\n```clisp\n(is (instance? java.util.Collection \"foo\"))\nFAIL\
  \ in clojure.lang.PersistentList$EmptyList@1 (NO_SOURCE_FILE:3)\nexpected: (instance?\
  \ java.util.Collection \"foo\")\nactual: java.lang.String\n-> false\n```\n\n`is`\
  \ 同样了解 `=`。验证 `power` 不等于 `wisdom`。\n\n```clisp\n(is (= \"power\" \"wisdom\"))\n\
  FAIL in clojure.lang.PersistentList$EmptyList@1 (NO_SOURCE_FILE:4)\nexpected: (=\
  \ \"power\" \"wisdom\")\nactual: (not (= \"power\" \"wisdom\"))\n-> false\n```\n\
  \n在内部，`is` 使用一个名为 `assert-expr` 的多方法（multimethod），它的分发不是基于类型，而是基于第一个参数的实际标识：\n\n\
  ```clisp\n(defmulti assert-expr (fn [form message] (first form)))\n```\n\n由于第一个参数是表示要检查函数的符号，这等同于另外一种临时的类型系统。这次有三种类型：`=`、`instance?`\
  \ 以及其他所有。\n\n各种 `assert-expr` 方法为你可能从 `is` 调用的不同函数添加了特定的错误信息。由于多方法是开放的，你可以添加你自己的\
  \ `assert-expr` 方法，为你你经常传递给 `is` 的其他函数提供改进的错误信息。\n\n### 反例\n\n正如你在第 8.4 节看到的，创建临时分类法，你通常可以使用多方法将基于类型的分支从函数的主流程中提炼出来。为了找到不应该使用多方法的反例，我们查看了\
  \ Clojure 的核心代码，寻找尚未被提升到多方法的类型分支。\n\n一个简单的例子是 Clojure 的 `class`，它是底层 Java `getClass`\
  \ 的空安全包装器。去掉注释和元数据后，`class` 如下所示：\n\n```clisp\n(defn class [x]\n  (if (nil? x) x\
  \ (. x (getClass))))\n```\n\n你可以通过对 `identity` 进行分发来编写你自己的 `class` 版本作为多方法：\n\n\
  [src/examples/multimethods.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/multimethods.clj)\n\
  \n```clisp\n(defmulti my-class identity)\n(defmethod my-class nil [_] nil)\n(defmethod\
  \ my-class :default [x] (.getClass x))\n```\n\n任何 `nil` 检查都可以这样重写。但我发现原始的 `class`\
  \ 函数比多方法版本更容易读。这是一个很好的“反例证明了规则的正确性”。尽管 `class` 根据类型进行分支，但这种分支版本更易于阅读。\n\n在决定是创建一个函数还是多方法时，请遵循以下通用规则：\n\
  \n*   如果函数根据某种类型或多种类型进行分支，考虑使用多方法。\n*   类型取决于你发现它们是什么。它们不必须是显式的 Java 类或数据标记。\n*\
  \   你应该能够直接解释 `defmethod` 的分发值，而无需引用 `defmulti`。\n*   不要仅仅为了处理可选参数或递归而使用多方法。\n\n\
  如果不确定，尝试用两种风格编写该函数，并选择看起来更具读性的的一种。\n\n## 8.6 总结\n\n多方法支持任意分发。通常，多方法基于类型关系工作。有时这些类型是正式的，例如\
  \ Java 类。在其他时候，它们是非正式且临时的，源于系统中对象的属性。\n\n# 9 异常处理\n\n在 Java 中，异常处理的出现通常有三个原因：\n\n\
  *   包装检查异常（如果你不熟悉检查异常，请参阅 检查异常）\n*   使用 `finally` 块清理资源\n*   对问题做出响应：忽略异常、重试操作、将异常转换为非异常结果等。\n\
  \n检查异常\n\nJava 的检查异常必须在可能发生它的每个方法中被显式捕获或重新抛出。这在初看起来似乎是一个好主意：检查异常可以使用类型系统来严谨地记录错误处理，并由编译器的强制执行。大多数\
  \ Java 程序员现在认为检查异常是一项失败的实验，因为它们在代码膨胀和可维护性方面的代价超过了其优势。关于检查异常的历史的更多信息，请参阅 Rod Waldhoff\
  \ 的文章[60 以及相关链接。\n\n在 Clojure 中，情况类似但更简单。`try` 和 `throw` 特殊形式赋予了你 Java `try`、`catch`、`finally`\
  \ 和 `throw` 的所有功能。但你不应该频繁使用它们，原因如下：\n\n*   在 Clojure 中你不需要处理检查异常。\n*   你可以使用如 `with-open`\
  \ 等宏来封装资源清理。\n\n## 9.1 保持异常简单\n\nJava 程序经常在抽象边界处包装检查异常。一个很好的例子是 Apache Ant，它倾向于将底层异常（如\
  \ I/O 异常）封装为 Ant 级的构建异常：\n\n```java\n// Ant 风格代码（为了清晰起见简化）\ntry {\n    newManifest\
  \ = new Manifest(r);\n} catch (IOException e) {\n    throw new BuildException(...);\n\
  }\n```\n\n\n\n\n在 Clojure 中，你并不被强制处理检查异常。你不需要捕获它们，也不需要声明你抛出了它们。因此，之前的代码将翻译为如下：\n\
  \n| | `(Manifest)` |\n\n异常封装的缺失使得地道的 Clojure 代码比地道的 Java 代码更易读、易写和维护。尽管如此，这并没有阻止你在\
  \ Clojure 中显式地捕获、包装和重新抛异常。这并不是强制要求的。只有当你计划以意义的方式响应异常时，才应该捕获异常。\n\n### 清理资源\n\n垃圾回收将清理内存中的资源。如果你使用了垃圾回收内存之外的资源（例如文件句柄），你需要确保即使在发生异常的情况下也清理它们。在\
  \ Java 中，这通常在 `finally` 块中处理。\n\n如果你需要释放的资源遵循具有 `close` 方法的约定，可以使用 Clojure 的 `with-open`\
  \ 宏：\n\n| | `(with-open [name init-form] & body)` |\n\n在内部，`with-open` 会创建一个 `try`\
  \ 块，将 `name` 设置为 `init-form` 的结果，然后运行 `body` 中的表达式。最重要的是，`with-open` 始终会在 `finally`\
  \ 块中关闭绑定到 `name` 的对象。\n\n`with-open` 的一个很好的例子是 `clojure.string` 中的 `spit` 函数：\n\n\
  | | `(clojure.core/spit file content)` |\n\n`spit` 简单地将字符串写入文件。试一下：\n\n```\n(spit\
  \ \"hello.out\" \"hello, world\")\n```\n\n| | `-> nil` |\n\n你现在应该会在 `hello.out`\
  \ 一个内容为 `hello, world` 的文件。\n\n`spit` 的实现非常简单：\n\n```clojure\n; from clojure.core\n\
  (defn spit\n  ; 与 slurp 相反。使用写入器打开 f，写入内容，然后\n  ; 关闭 f。传递给 clojure.java.io/writer\
  \ 的选项。\n  {:added \"1.2\"}\n  [f content & options]\n  (with-open [java.io.Writer\
  \ w (apply jio/writer f options)]\n    (.write w (str content))))\n```\n\n`spit`\
  \ 在 `f` 上创建一个 `PrintWriter`，它可以几乎是任何可写的内容：文件、URL、URI，或者 Java 的各种写入器或输出流。然后它将 `content`\
  \ 打印到 `writer`。最后，`with-open` 保证 `writer` 在 `spit` 结束时被关闭。\n\n如果你需要在 `finally` 块中执行\
  \ `close` 以外的操作，Clojure 的 `try` 形式如下：\n\n```clojure\n(try expr catch-clause* finally-clause?)\n\
  ; catch-clause -> (catch classname name expr*)\n; finally-clause -> (finally expr*)\n\
  ```\n\n可以像这样使用：\n\n```clojure\n(try\n  (throw (Exception. \"something failed\"))\n\
  \  (finally\n  (println \"we get to clean up\")))\n; we get to clean up\n; java.lang.Exception:\
  \ something failed\n```\n\n之前的片段还演示了 Clojure 的 `throw` 形式，它简单地抛出传递给它的任何异常。\n\n###\
  \ 响应异常\n\n最有趣的情况是异常处理器尝试在 `catch` 块中响应问题。作为一个简单的例子，考虑一个测试特定类在运行时是否可用的：\n\n[src/examples/interop.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/interop.clj)\n\
  \n```clojure\n; 不对调用者友好的\n(defn class-available? [class-name]\n  (Class/forName\
  \ class-name))\n```\n\n这种方法对调用者并不友好。调用者只想要一个是/否的答案，但得到的却是异常：\n\n```clojure\n(class-available?\
  \ \"borg.util.Assimilate\")\n; java.lang.ClassNotFoundException: borg.util.Assimilate\n\
  ```\n\n更友好的方法使用 `catch` 块返回：\n\n```clojure\n(defn class-available? [class-name]\n\
  \  (try\n    (Class/forName class-name)\n    true\n    (catch java.lang.ClassNotFoundException\
  \ _\n      false)))\n```\n\n## 9.2 与整数搏斗\n\nClojure 为整数类型提供了三组不同的操作：\n\n*   未检查操作符（unchecked\
  \ operators）\n*   默认操作符（default operators）\n*   提升操作符（promoting operators）\n\n下表是这些操作的示例：\n\
  \n| Unchecked | Default | Promoting |\n| --- | --- | --- |\n| `unchecked-add` |\
  \ `+` | `+'` |\n| `unchecked-subtract` | `-` | `-'` |\n| `unchecked-multiply` |\
  \ `*` | `*'` |\n| `unchecked-inc` | `inc` | `inc'` |\n| `unchecked-dec` | `dec`\
  \ | `dec'` |\n\n未检查操作符与 Java 中的原生类型数学完全对应。它们很快，但很危险，因为它们会静默溢出。在 Clojure 中，只有在溢出是预期行为，或者性能至关重要且确定溢出不可能或无关的罕见情况下，才使用未检查操作符。\n\
  \n```clojure\n(unchecked-add 9223372036854775807 1)\n; -9223372036854775808\n```\n\
  \n默认操作符尽可能使用 Java 原生类型以提高性能，但始终会进行溢出检查并抛出异常。\n\n```clojure\n(+ 9223372036854775807\
  \ 1)\n; ArithmeticException: integer overflow\n```\n\n提升操作符会在溢出时自动从原生类型提升为大数。这使得处理任意范围成为可能，但付出了巨大的性能代价。由于原生类型和大数没有共同的基类型，使用提升操作符进行数学运算将排除使用原生类型作为返回类型的可能。\n\
  \n```clojure\n(+ 9223372036854775807 1)\n; 9223372036854775808N\n```\n\nClojure\
  \ 依赖 Java 的 `BigDecimal` 类来处理任意精度小数。详情请参见在线文档[[61]](#f_0078.html_FOOTNOTE-61)。`BigDecimal`\
  \ 提供任意精度，但是有代价的：`BigDecimal` 数学运算远慢于 Java 的浮点原生类型。\n\n\n\n\nClojure 拥有自己的 `BigInt`\
  \ 类来处理 `BigInteger` 转换。与直接使用 Java 的 `BigInteger` 相比，Clojure 的 `BigInt` 在性能上有一些改进。它还封装了\
  \ `BigInteger` 的一些粗糙之处。特别是，它正确地实现了 `hashCode`。这使得相等性优先于表示形式，你会在语言的几乎每个抽象中都看到这一点。\n\
  \n在底层，Clojure 使用 Java 的 `BigInteger`。性能差异在于 `BigInt` 处理其值的方式。一个 `BigInt` 由一个 `Long`\
  \ 部分和一个 `BigInteger` 部分组成。当传入 `BigInt` 的值小到可以被视为 `Long` 时，它就会被视为 `Long`。当在 `BigInt`\
  \ 上执行数值运算时，如果其结果小到可以被视为 `Long`，它也是如此处理的。这使得使用户能够添加溢出提示 `(N)`，而在绝对必要之前无需支付 `BigInteger`\
  \ 的代价。\n\n## 9.3 性能优化\n\n在 Clojure 中，使用第 2.5 节描述的技术调用 Java 是符合惯例的，即 *调用 Java。生成的代码对于\
  \ 90% 的场景来说已经足够快了。但当你需要时，可以进行局部更改来提升性能。这些更改不会改变外部调用者调用你代码的方式，因此你可以自由地让代码工作，然后再让它快速。\n\
  \n### 使用原始类型优化性能\n\n在前面的章节中，函数参数不携带类型信息。Clojure 仅仅会做正确的事。取决于你的观点，这既是优点也是缺点。它是一个优点，因为你的代码简洁简单，并且可以利用鸭子类型（duck\
  \ typing）。但它也是缺点，因为代码阅读者无法确定数据类型，而且做正确的事会带来一定的性能开销。\n\n考虑一个计算从 1 到 n 数字之和的函数：\n\n\
  | | `; 仅用于演示，不要这样写代码` |\n| :--- | :--- |\n| | `(defn sum-to [n] (loop [i 1 sum 0]`\
  \ |\n| | ` (if (<= i n) (recur (inc i) (+ i sum)) sum)))` |\n\n你可以验证该函数在较小输入值下工作正常：\n\
  \n| | |\n| :--- | :--- |\n| `(sum-to 10)` |\n| `=> 55` |\n\n让我们看看 `sum-to` 的性能。要对操作计时，可以使用\
  \ `time` 函数。在进行基准测试时，你往往希望进行多次测量，以便消除启动开销加上任何异常值；因此，你可以在 `dotimes` 宏内部调用 `time`：\n\
  \n```\n(dotimes bindings body)\n```\n\n`dotimes` 将重复执行其体，并将名称绑定到从零到 n-1 的整数。使用 `dotimes`，你可以如下收集五次\
  \ `sum-to` 的耗时：\n\n| | |\n| :--- | :--- |\n| `(dotimes [_ 5] (time (sum-to 10000)))`\
  \ |\n| `\\| \"Elapsed time: 0.149 msecs\"` |\n| `\\| \"Elapsed time: 0.126 msecs\"\
  ` |\n| `\\| \"Elapsed time: 0.194 msecs\"` |\n| `\\| \"Elapsed time: 0.279 msecs\"\
  ` |\n| `-> \"Elapsed time: 0.212 msecs\"` |\n\n为了提高速度，你可以将参数和返回类型提示为 `long`。Clojure\
  \ 的类型推断会将此提示传递到函数内部的所有操作和函数调用中。\n\n```clojure(defn ^long integer-sum-to [^long n]\n\
  \  (loop [i 1 sum 0]\n    (if (<= i n)\n      (recur (inc i) (+ i sum))\n      sum)))\n\
  ```\n\n`integer-sum-to` 确实更快：\n\n| | |\n| :--- | :--- |\n| `(dotimes [_ 5] (time\
  \ (integer-sum-to 10000)))` |\n| `\\| \"Elapsed time: 0.044 msecs\"` |\n| `\\| \"\
  Elapsed time: 0.023 msecs\"` |\n| `\\| \"Elapsed time: 0.025 msecs\"` |\n| `\\|\
  \ \"Elapsed time: 0.023 msecs\"` |\n| `-> \"Elapsed time: 0.02 msecs\"` |\n\nClojure\
  \ 的原始类型数学仍然是正确的，因为它会检查溢出并抛出异常。这已经最快了吗？Java 程序员可以使用极快的“破坏性数学”（busted math）：算运算具有最高性能，但可能会静默溢出并损坏数据。\n\
  \nClojure 通过未检查（unchecked）系列函数提供了 Java 的算术语义。也许你通过使用 `+` 的未检查版本 `unchecked-add`\
  \ 可以获得甚至更快的函数：\n\n```clojure(defn ^long unchecked-sum-to [^long n]\n  (loop [i 1\
  \ sum 0]\n    (if (<= i n)\n      (recur (inc i) (unchecked-add i sum))\n      sum)))\n\
  ```\n\n`unchecked-sum-to` 确实更快：\n\n| | |\n| :--- | :--- |\n| `(dotimes [_ 5] (time\
  \ (unchecked-sum-to 10000)))` |\n| `\\| \"Elapsed time: 0.039 msecs\"` |\n| `\\\
  | \"Elapsed time: 0.018 msecs\"` |\n| `\\| \"Elapsed time: 0.014 msecs\"` |\n\n\n\
  \n\n\n-   在运行时强制执行类型\n\n例如，考虑以下函数，它返回关于 Java 类的信息：\n\n```clisp\n(defn describe-class\
  \ [c]\n  {:name (.getName c)\n   :final (java.lang.reflect.Modifier/isFinal (.getModifiers\
  \ c))})\n```\n\n你可以通过将特殊变量 `*warn-on-reflection*` 设置为 `true` 来询问 Clojure 它能推断多少类型信息：\n\
  \n```clisp\n(set! *warn-on-reflection* true)\n-> true\n```\n\n`set!` 结尾的感叹号是一种惯用表示，说明\
  \ `set!` 会改变可变状态。`set!` 在 使用 Java Callback API 中详细描述。当 `*warn-on-reflection*` 设置为\
  \ `true` 时，编译 `describe-class` 将产生以下警告：\n\n```text\nReflection warning, line: 87\n\
  - reference to field getName can't be resolved.\n\nReflection warning, line: 88\n\
  - reference to field getModifiers can't be resolved.\n```\n\n这些警告表明 Clojure 无法得知\
  \ `c` 的类型。你可以使用元数据语法 `∧Class` 提供类型提示来修复此：\n\n```clisp\n(defn describe-class [^Class\
  \ c]\n  {:name (.getName c)\n   :final (java.lang.reflect.Modifier/isFinal (.getModifiers\
  \ c))})\n```\n\n加上类型提示后，反射警告将会消失。编译后的 Clojure 代码与编译后的 Java 代码完全相同。此外，尝试用非 `Class`\
  \ get 调用 `describe-class` 将导致 `ClassCastException` 异常：\n\n```clisp\n(describe-class\
  \ StringBuffer)\n{:name \"java.lang.StringBuffer\", :final true}\n\n(describe-class\
  \ \"foo\")\n-> java.lang.ClassCastException: java.lang.String cannot be cast to\
  \ java.lang.Class\n```\n\n如果你的 `ClassCastException` 提供的错误信息没有那么有用，那是因为你使用的是 Java\
  \ 6 之前的版本。改进错误报告是你在 Java 6 或更高版本上运行 Clojure 代码的众多良好理由之一。\n\n当你提供类型提示时，Clojure 将插入适当的类转换，以避免对\
  \ Java 方法进行缓慢的反射调用。但如果你的函数实际上没有调用被提示对象的任何 Java 方法，那么 Clojure 就不会插入转换。考虑这个 `wants-a-string`\
  \ 函数：\n\n```clisp\n(defn wants-a-string [^String s] (println s))\n-> #'user/wants-a-string\n\
  ```\n\n你可能认为 `wants-a-string` 会对非字符串参数报错。事实上，它会运行得完美：\n\n```clisp\n(wants-a-string\
  \ \"foo\")\n-> foo\n\n(wants-a-string 0)\n-> 0\n```\n\nClojure 可以判断出 `wants-a-string`\
  \ 从未真正将其参数当作字符串（`println` 会很乐意尝试打印任何类型的参数）。由于不需要调用任何字符串方法，Clojure 不会尝试将 `s` 转换为字符串。\n\
  \n当你需要速度时，类型提示会让 Clojure 代码编译为与 Java 相同的代码。但你并不需要频繁类型提示。先让你的代码正确，然后再考虑让它变快。\n\n\
  ## 9.4 在 Clojure 中创建 Java 类\n\nClojure 的对象都实现了合理的 Java 接口：\n\n- Clojure 的数据结构实现了\
  \ Java Collections API 中的接口。\n- Clojure 的函数实现了 `Runnable` 和 `Callable`。\n\n除了这些通用接口外，你有时还需要特定域的接口。这通常表现为用于事件驱动\
  \ API（如 Swing 或某些 XML 解析器）的回调处理程序。需要时，Clojure 可以轻松在磁盘上生成一次性的代理或类，而代码量仅为 Java 所需的分之一。\n\
  \n### 创建 Java 代理（Proxy）\n\n为了与 Java 交互，你通常需要实现 Java 接口。一个很好的例子是使用 Simple API for\
  \ XML (SAX) 解析器解析 XML。为了这个示例做准备，请导入以下类。在完成之前我们需要它们所有的类：\n\n```clisp\n(import '(org.xml.sax\
  \ InputSource)\n         org.xml.sax.DefaultHandler\n         java.io.StringReader\n\
  \         javax.xml.parsers.SAXFactory)\n```\n\n代理机制是完全通用的，可以动态生成你需要的任何类型的对象。有时对象非常简单，你可以在单行内包含整个对象。以下代码创建了一个新线程，然后创建了一个\
  \ `Runnable` 的动态子类并在线程上运行：\n\n```clisp\n(start (Thread (proxy [Runnable] [] (println\
  \ \"I ran!))))\n```\n\n在 Java 中，你必须为你实现的每个接口上的每个方法提供实现。在 Clojure 中，你可以省略它们：\n\n\
  ```clisp\n(proxy [Callable] [])\n```\n\n如果你省略了某个方法的实现，Clojure 会提供一个抛出 `UnsupportedOperationException`\
  \ 的默认实现：\n\n```text\n(.call (proxy [Callable] []))\n-> java.lang.UnsupportedOperationException:\
  \ call\n```\n\n对于仅有一个方法的接口（如 `Runnable` 和 `Callable`），默认实现没有太大意义，但当你实现较大的接口且不在乎某些方法时，它可以非常有用。\n\
  \n到目前为止在本节中，你已经了解了如何使用 `proxy` 来创建 Java 接口的实现。在你需要时它非常强大，但通常 Clojure 已经为你做好了。例如，函数会自动实现\
  \ `Runnable` 和 `Callable`：\n\n```clisp\n; 正常用法：调用匿名函数\n(#(println \"foo\"))\nfoo\n\
  \n; 通过 Runnable 的 run 调用\n(.run #(println \"foo\"))\nfoo\n```\n\n\n\n\n```clojure\n\
  ; 通过 Callable 的 call 方法调用\n(.call #(println \"foo\"))\nfoo\n```\n\n这使得将 Clojure\
  \ 函数传递给其他线程变得非常简单：\n\n```clojure\n(dotimes [i 5]\n  (.start (Thread\n    (fn []\n\
  \      (Thread/sleep (rand 500))\n      (println (format \"Finished %d on %s\" i\
  \ (Thread/currentThread))))))\n\n```\n\n对于像 XML 和线程回调这样的一次性任务，Clojure 的代理（proxies）既快速又易用。如果你需要一个生命周期较长的类，也可以从\
  \ Clojure 生成新的具名类。\n\n### 使用 Java 集合\n\n在大多数情况下，Clojure 的集合取代了 Java 集合。Clojure 集合是并发安全的，具有良好的性能特性，并实现了相应的\
  \ Java 集合接口。因此，当你在 Clojure 中进行工作时，通常应该优先使用 Clojure 自己的集合，并在方便时，甚至可以将它们回传给 Java。\n\
  \n即使你确实选择使用 Java 集合，Clojure 也没有东西会阻止你。从 Clojure 的角度来看，Java 集合与其他任何类都一样，所有的各种 Java\
  \ 互操作形式都可以工作。但 Java 集合是为基于锁的并发设计的。它们不会提供 Clojure 集合提供的并发保证，而且无法与 Clojure 的软件事务内存（STM）良好地工作。\n\
  \n你需要处理 Java 集合的一个地方是 Java 数组的特殊情况。在 Java 中，数组有自己的语法和字节码指令。Java 数组没有实现任何 Java 接口。Clojure\
  \ 集合无法伪装成数组。（Java 集合也无法！）Java 平台在各个方面都将数组视为特例，Clojure 也是如此。\n\nClojure  `make-array`\
  \ 来创建 Java 数组：\n\n```clojure\n(make-array class length)\n(make-array class dim &\
  \ more-dims)\n```\n\n`make-array` 取一个类和一个变数量的数组维度。对于一个字符串数组，你可以这样写：\n\n```clojure\n\
  (make-array String 5)\n-> #<String[] [Ljava.lang.String;@45a270b2>\n```\n\n这种奇怪的输出归功于\
  \ Java 对数组的 `toString()` 方法：`[Ljava.lang.String;` 是 JVM 规范对“一维字符串数组”的编码。这在 REPL\
  \ 中并不实用，所以你可以使用 Clojure 的 `seq` 将任何 Java 数组封装为 Clojure 序列，这样 REPL 就可以打印单独的数组元素：\n\
  \n```clojure\n(seq (make-array String 5))\n-> (nil nil nil nil nil)\n```\n\nClojure\
  \ 还包含了一系列命名如 `int-array` 的函数，用于创建 Java 原生类型的数组。你可以在 REPL 中执行以下命令来查看这些以及数组函数的文档：\n\
  \n```clojure\n(find-doc \"-array\")\n```\n\nClojure 为 Java 数组提供了一套低级操作，包括 `aset`、`aget`\
  \ 和 `alength`：\n\n```clojure\n(aset java-array index value)\n(aset java-array index-dim1\
  \ index-dim2 .. value)\n(aget java-array index)\n(aget java-array index-dim1 index-dim2\
  \ ..)\n(alength java-array)\n```\n\n使用 `make-array` 创建数组，然后尝试使用 `aset`、`aget` 和\
  \ `alength` 来操作数组：\n\n```clojure\n(defn painstakingly-create-array []\n  (let [arr\
  \ (make-array String 5)]\n    (aset arr 0 \"Painstaking\")\n    (aset arr 1 \"to\"\
  )\n    (aset arr2 \"fill\")\n    (aset arr 3\" in\")\n    (aset arr 4 \"arrays\"\
  )\n    arr))\n\n(aget (paintakingly-create-array) 0)\n-> \"Painstaking\"\n\n(alength\
  \ (painstakingly-create-array))\n-> 5\n```\n\n大多数时候，你会发现使用像 `to-array` 这样的高级函数更简单，它可以直接从任何集合创建数组：\n\
  \n```clojure\n(to-array sequence)\n```\n\n`to-array` 总是创建一个 `Object`  数组：\n\n```clojure\n\
  (to-array [\"Easier\" \"array\" \"creation\"])\n-> #<Object[] [Ljava.lang.Object;1639fe2>\n\
  ```\n\n`to-array` 对于调用接收变长参数的 Java 方法也很有用，例如 `String/format`：\n\n```clojure\nprefer\
  \ clojure.core/format (String/format \"Training Week: %s %d\" (to-array [2 26]))\n\
  -> \"Training Week: 26\"\n```\n\n`to-array` 的兄弟函数 `into-array` 可以创建比 `Object` 类型更具体的数组。\n\
  \n```clojure\n(into-array type seq)\n```\n\n你可以将显式类型作为可选参数传递给 `into-array`：\n\n\
  ```clojure\n(into-array String [\"Easier\", \"array\", \"creation\"])\n-> #<String[]\
  \ [Ljava.lang.String;391ec28>\n```\n\n如果你省略类型参数，`into-array` 将根据序列中的第一个元素来猜测类型：\n\
  \n```clojure\n(into-array [\"Easier\" \"array\", \"creation\"])\n-> #<String[] [Ljava.lang.String;76bf849>\n\
  ```\n\n\n\n\n首先，我们需要编写连接到 URL 并捕获响应码的代码。我们可以通过使用 Java 的 `URL` 类来实现。\n\n```clojure\n\
  (ns pinger.core\n  (:import (java.net URL HttpURLConnection)))\n  (defn response-code\
  \ [address]\n    (let [conn ^HttpURLConnection (.openConnection (URL address)))\n\
  \          code (.getResponseCode conn)]\n      (when (< code 400)\n        (->\
  \ conn .getInputStream .close))\n        code)))\n```\n\n在 REPL 中尝试一下：\n\n```clojure\n\
  (response-code \"http://google.com\")\n-> 200\n```\n\n现在，让我们创建一个使用 `response-code`\
  \ 的函数，判断指定的 URL 是否可用。在我们的上下文中，我们将 `available` 定义为返回 `HTTP 200` 响应码。\n\n```clojure\n\
  (defn available? [address]\n  (= 200 (response-code address)))\n\n(available? \"\
  http://google.com\")\n-> true\n\n(available? \"http://google.com/badurl\")\n-> false\n\
  ```\n\n接下来，我们需要一种方法来启动程序，让它定期检查我们关心的 URL 列表，并报告它们的可用性。让我们创建一个 `-main` 函数。\n\n```clojure\n\
  (defn -main []\n  (let [addresses '(\"http://google.com\"\n                   \"\
  http://amazon.com\"\n                   \"http://google.com/badurl\")]\n    (while\
  \ true\n      (doseq [address addresses]\n        (println (available? address)))\n\
  \        (Thread/sleep (* 1000 60)))))\n```\n\n在这个示例中，我们创建了一个地址列表（两个好的，一个坏的），并使用一个永远不会退出的简单\
  \ `while` 循环来实现持续的程序执行。它将每分钟检查一次这些 URL，直到程序终止。由于我们导出了 `-main` 函数，别忘记在命名空间声明中添加 `:gen-class`。\n\
  \n```clojure\n(ns pinger.core\n  (:import (java.net URL))\n  (:gen-class))\n```\n\
  \n现在我们已经准备好了基础工作，需要告诉 Leining 我们的主函数在哪里。打开 `project.clj` 并添加 `:main` 声明：\n\n```clojure\n\
  (defproject pinger \"0.0.1-SNAPSHOT\"\n  :description \"A website availability tester\"\
  \n  :dependencies [[org.clojure/clojure \"1.3.0\"]]\n  :main pinger.core)\n```\n\
  \n是时候将我们的程序编译为 JAR 文件并运行了。要这样做，请运行以下命令：\n\n```bash\nlein uberjar\njava -jar pinger-0.0.1-SNAPSHOT-standalone.jar\n\
  ```\n\n你应该看到程序启动并运行，直到你按下 `Ctrl-C` 停止它。\n\n### 添加真实的连续循环行为\n\n一个始终为真的 `while` 循环将一直运行直到被终止，但这并不是获取结果的最优雅方法，因为它不允许整洁的关闭。我们可以使用调度线程池，它将以与\
  \ `while` 循环类似的方式启动并执行所需的命令，但具有更高级别的控制。在 `src` 目录中创建一个名为 `scheduler.clj` 的文件，并输入以下代码：\n\
  \n```clojure\n(ns pinger.scheduler\n  (:import (java.util.concurrent ThreadPoolExecutor\
  \ ScheduledThreadPoolExecutor))\n  (defn scheduled-executor\n    \"创建一个调度执行器。\"\n\
  \    ^ScheduledExecutor [threads]\n    (ScheduledThreadPoolExecutor threads))\n\
  \  (defn periodically\n    \"调度 f 在 'initial-delay' 延迟后每隔 'delay' 毫秒执行一次。返回一个 ScheduledFuture。\"\
  \n    ^ScheduledFuture [e {:keys [initial-delay delay]}]\n    (.scheduleFixedDelay\
  \ e f initial-delay delay TimeUnit/MILLISECONDS))\n  (defn shutdown-executor\n \
  \   \"关闭一个执行器。\"\n    [^ThreadPoolExecutor e]\n    (.shutdown e)))\n```\n\n该命名空间提供了创建和关闭\
  \ Java `ScheduledExecutor` 的函数。它还定义了一个函数 `periodically`，该函数接受一个执行器、一个函数、一个 `initial-delay`\
  \ 和一个 `delay`。它将在初始延迟后首次执行函数，之后按照延迟继续执行该函数。这将一直运行，直到线程池关闭。\n\n让我们更新 `pinger.core`\
  \ 以利用这些调度代码，并让 `-main` 函数负责调用启动循环的函数。将旧的 `-main` 替换为以下内容：\n\n```clojure\n(defn check\
  \ []\n  (let [addresses '(\"http://google.com\"\n                   \"http://google.com/404\"\
  \n                   \"http://amazon.com\")]\n    (doseq [address addresses]\n \
  \     (println (available? address)))))\n\n(def immediately 0)\n(def every-minute\
  \ (* 60 1000))\n\n(defn start [e]\n  \"REPL 辅助函数。在执行器 e 上启动 pinger。\"\n  (scheduler/periodically\
  \ e check\n    :initial-delay immediately\n    :delay every-minute))\n\n(defn stop\
  \ [e]\n  \"REPL 辅助函数。停止执行器 e。\"\n  (scheduler/shutdown-executor e))\n\n(defn -main\
  \ []\n  (start (scheduler/scheduled-executor 1)))\n```\n\n确保更新你的命名空间声明以包含调度代码：\n\
  \n```clojure\n(ns pinger.core\n  (:import (java.net URL))\n  (:require [pinger.scheduler\
  \ :as scheduler])\n  (:gen-class))\n```\n\n之前的示例并不是必要的，但它增加了代码的可读性。添加启动和停止函数便于在\
  \ REPL 中进行交互操作，如果你选择扩展此示例，这将是一个巨大的优势。通过运行 `lein uberjar` 并执行 JAR 文件进行最后的检查。程序运行方式将与之前完全一样。\n\
  \n### 日志\n\n到目前为止，我们编写了一个能够定期检查网站列表可用性的程序。然而，它缺乏跟踪记录以及在站点不可用时通知我们的能力。我们可以通过日志来解决这两个问题。Java\
  \ 应用有很多日志选项，但对于此示例，我们将使用 `log4j`。它为我们提供了一个真实的日志记录器，并提供了电子邮件通知。这太棒了，因为当网站不可用时我们可以发送电子邮件警报。为了这一点，我们需要将\
  \ `log4j` 和 `mail` 库引入我们的应用程序中。为了方便利用 `log4j`，我们还将引入 `clojure.tools.logging`。打开你的\
  \ `project.clj` 文件并添加 `clojure.tools.logging`、`log4j` 和 `mail`：\n\n```clojure\n\
  (defproject pinger \"0.0.1-SNAPSHOT\"\n  :description \"A website availability tester\"\
  \n  :dependencies [[org.clojure/clojure \"1.3.0\"]\n                 [org.clojure/tools.logging\
  \ \"0.2.3\"]\n                 [log4j \"1.2.16\"]\n                 [javax.mail/mail\
  \ \"1.4.1\"]])\n  :main pinger.core)\n```\n\n同时也使用 Leiningen 引入依赖项：\n\n```bash\n\
  lein deps\n```\n\n\n\nClojure 日志库的强大之处在于，它会使用类路径上的任何标准 Java 日志库，因此在 `log4j` 和你的应用程序之间不需要额外的连接。在项目根目录下创建一个名为\
  \ `resources` 的文件夹。Leiningen 会自动将该文件夹的内容添加到类路径中，你需要用它来存放 `log4j` 属性文件。在 `resources`\
  \ 目录下创建一个名为 `log4j.properties` 的文件，并添加以下内容：\n\n```properties\nlog4j.rootLogger=info,\
  \ R, email\nlog4j.appender.R=org.apache.log4j.RollingFileAppender\nlog4j.appender.R.File=logs/pinger.log\n\
  log4j.appender.R.MaxFileSize=1000KB\nlog4j.appender.R.MaxBackupIndex=1\nlog4j.appender.R.layout=org.apache.log4j.PatternLayout\n\
  log4j.appender.R.layout.ConversionPattern=%d{ISO8601} %-5p [%c] - %m%n\nlog4j.appender.email=org.apache.log4j.net.SMTPAppender\n\
  log4j.appender.email.SMTPHost=localhost\nlog4j.appender.email.From=system@yourapp.com\n\
  log4j.appender.email.To=recipient@yourapp.com\nlog4j.appender.email.Subject=[Pinger\
  \ Notification] - Website Down\nlog4j.appender.email.threshold=error\nlog4j.appender.email.layout=org.apache.log4j.PatternLayout\n\
  log4j.appender.email.layout.conversionPattern=%d{ISO8601} %-5p [%c] - %m%n\n```\n\
  \n这会将标准日志输出到 `pinger.log`，并对任何记录到 `error` 日志级别的内容发送电子邮件通知。在我们的案例中，这意味着网站没有响应 `HTTP\
  \ 200` 响应，或者在检查网站时抛出了异常。请确保将电子邮件信息更改为在你环境中有效的内容。\n\n让我们更新代码并添加日志。这里的目标是将任何 `println`\
  \ 语句替换为日志消息。打开 `core.clj`，在命名空间声明中引入 `clojure.tools.logging` 中的 `info` 和 `error`\
  \ 函数，并创建一个记录结果的函数。\n\n```clojure\n(ns pinger.core\n  (:import (java.net URL))\n\
  \  (:require [pinger.scheduler :as scheduler]\n            [clojure.tools.logging\
  \ :as logger])\n  (:gen-class))\n..\n\n(defn record-availability [address]\n  (if\
  \ (available? address)\n    (logger/info (str address \" is responding normally\"\
  ))\n    (logger/error (str address \" is not available\"))))\n```\n\n同时更新 `check`\
  \ 以反映这些更改：\n\n```clojure\n(defn check []\n  (let [addresses '(\"http://google.com\"\
  \n                   \"http://google.com/404\"\n                   \"http://amazon.com\"\
  )]\n    (doseq [address addresses]\n      (record-availability address))))\n```\n\
  \n重新构建并再次运行你的程序。你应该注意到新建了一个 `logs` 目录，可以检查程序的执行情况。你还应该收到一封带有错误信息的邮件。如果你在 25 端口遇到“connection\
  \ refused”错误，你需要在你的机器上设置邮件传输代理（MTA）以启用邮件发送。现在你有了一种方法通知人们网站故障了！\n\n### 配置\n\n我们硬编码了要监控的网站列表，这显然是不可通的！我们需要一种方法从外部源提供要监控的站点列表。我们可以使用属性文件、数据库或\
  \ Web 服务来实现这一点。为了方便解释，我们将使用属性文件。在应用程序的根目录下创建一个名为 `pinger.properties` 的文件，并向添加以下内容：\n\
  \n```properties\nurls=http://google.com,http://amazon.com,http://google.com/badurl\n\
  ```\n\n我们需要一种方法加载此文件并创建一个站点集合，传递给 `check` 函数。在 `src` 目录下创建一个名为 `config.clj` 的文件：\n\
  \n```clojure\n(ns pinger.config\n  (:use [clojure.java.io :only (reader)])\n  (:require\
  \ [clojure.string :as str])\n  (:import (java.util Properties)))\n\n(defn load-properties\
  \ [src]\n  (with-open [dr (reader src)]\n    (Properties. (load dr))))\n\n(defn\
  \ config []\n  (load-properties (resource \"pinger.properties\")))\n```\n\n只要 `pinger.properties`\
  \ 在类路径上，`config` 函数就会将 `pinger.properties` 读取到 Java 属性对象中。我们剩下的工作就是获取 `urls` 属性并将其放入列表。在\
  \ config 中添加以下函数：\n\n```clojure\n(defn urls [conf]\n  (str/split (get conf \"urls\"\
  )))\n```\n\n最后，更新 `core.clj` 中的 `check` 函数以使用新配置。\n\n```clojure\n(ns pinger.core\n\
  \  (:import (java.net URL))\n  (:require [pinger.scheduler :as scheduler]\n    \
  \        [clojure.tools.logging :as logger]\n            [pinger.config :as config])\n\
  \  (:gen-class))\n..\n\n(defn check []\n  (doseq [address (config/urls (config/config))]\n\
  \    (record-availability address)))\n```\n\n使用 Leiningen 重新构建你的应用并尝试。记得将当前目录放在类路径，以便应用程序能够找到\
  \ `pinger.properties`。\n\n```bash\njava -cp .:pinger-0.1-standalone.jar pinger.core\n\
  ```\n\n我们现在已经拥有了成功所需的方法。在这个例子中，我们涵盖了：\n\n*   使用 Java 的 `URL` 检查网站是否可用\n*   使用 Java\
  \ 的 `ScheduledExecutor` 创建定期运行的任务\n*   使用 `log4j` 配合 `clojure.tools.logging` 发送错误通知\n\
  *   使用 Java 属性系统进行配置\n*   使用 Leiningen 创建独立 JAR\n\n我们可以对这个示例进行许多扩展。我们可以通过增加对某些 HTML\
  \ 元素的存在的要求或在规定时间内响应的要求（覆盖 SLA）来重新定义网站可用性。尝试添加这个示例并看看你能写出什么。\n\n## 9.6 小结\n\n我们刚刚涵盖了\
  \ Clojure 和 Java 如何良好共处的很多。我们甚至以一些有趣的方式将两者混合在一起。由于我们已经开始在 Clojure 语言之外进行实验，现在可能是讨论构建真实世界\
  \ Clojure 应用的不同库的好时机。我们将在下一章介绍。\n\n# 第 10 章 构建应用程序\n\n现在你已经学习了 Clojure 语言的基础知识，是时候在自己的项目中使用\
  \ Clojure 了。但当你冲出门开始编写你的杀手级 Clojure 应用时，你会很快发现语言知识只是在生态系统中高效工作所需的一部分。你会有这样的问题：\n\
  \n*   我应该用什么工具来组织项目和依赖？\n*   良好的工作流是什么样的？\n*   如何确保我的代码是正确的？\n*   如何保持代码的灵活性和可维护性？\n\
  *   我需要哪些库？\n*   如何将 Clojure 部署到 Web 端？\n\n\n\n\n对于这些问题，永远没有单一且万能的答案。Clojure 运行在\
  \ JVM 上，这是一个巨大的生态系统，数百种方法在这里蓬勃发展。但你从某处开始。在本章中，我们将为这些问题提供临时答案。这些答案对我们来说非常好，你可以先使用一段时间。随着你自己的偏好和感知的演变，你可以调整或放弃本章的方法，转而采用最适合你的方法。\n\
  \n作为我们的示例应用程序，我们将实现一个网页版本的 Clojurebreaker 游戏。在 Clojurebreaker 中，代码生成者（程序）会创建一个由\
  \ N 个有序的彩色插子组成的秘密代码。代码破解者（人类玩家）则提交一个猜测。代码生成者按照以下方式对猜测进行评分：\n\n* 每个颜色和位置都正确的插子得一个黑色黑色插子\n\
  * 每个颜色正确但位置不正确的插子得一个白色白色插子\n\n游戏在猜测正确或达到预设的猜测次数限制后结束。\n\n虽然我们会在过程中展示所有的代码，但本章并不是真的关于代码。它关乎一种解决问题的风格，以及关于在\
  \ Clojure 生态系统中交付解决方案的细节。让我们开始吧。\n\n## 10.1 为 Clojurebreaker 游戏评分\n\n作为一名 Clojure\
  \ 程序员，你经常问的问题之一是：“我哪里需要状态来解决这个问题？”或者更好是，“如果不使用任何状态，我可以解决这个问题的多少部分？”\n\n对于 Clojurebreaker（以及许多其他游戏），游戏逻辑本身是一个纯函数。它接受一个秘密和一个猜测，并返回一个分数。及早识别这一事实带给我们两个两个相关的优势：\n\
  \n* 评分函数将很容易编写和独立测试。\n* 我们可以心地去实现 `score`，而无需考虑系统的其他部分如何工作。\n\n评分本身分为两个部分：统计精确匹配和统计顺序不正确的匹配。这每个部分都可以是自己的函数。让我们从精确匹配开始。为了使具体化，我们将为插子选择一种便于在\
  \ REPL 中尝试的表示方法：四种颜色 `:r`（红色）、`:g`（绿色）、`:b`（蓝色）和 `:y`（黄色）。该函数将返回精确匹配的数量，我们可以在稍后的单独步骤中将其转换为黑色插子。这是我们认为需要的函数框架：\n\
  \n```clojure\n(defn exact-matches\n  \"给定两个集合，返回集合中包含相同项的位置数量。\"\n  [c1 c2])\n```\n\
  \n等一下——那个文档字符串（doc string）没有提到任何任何游戏、颜色或关键词。这里到底发生了什么？虽然某些调用者（例如游戏）最终会关心游戏状态的表示，但\
  \ `exact-matches` 不需要关心。所以，让我们保持它的通用性。负责任的 Clojure 设计的关键组件是用数据思考，而不是在每个机会倾入具体的对象。\n\
  \n当被描述为数据的通用函数时，`exact-matches` 听起来像是一个可能已经存在的函数。在搜索相关的命名空间（`clojure.core` 和 `clojure.data`）后，我们发现与\
  \ `exact-matches` 最近的是 `clojure.data` 的 `diff`。`diff` 递归地比较两个数据结构，返回一个包含“a 中的项”、“b\
  \ 中的项”和“共同项”的三元组。“共同项”正是我们正在寻找的精确匹配。在 REPL 中尝试一下：\n\n```clojure\n(require '[clojure.data\
  \ :as data])\n(data/diff [:r :g :g :b] [:r :y :y :b])\n-> [[nil :g :g] [nil :y :y]\
  \ [:r nil nil :b]]\n```\n\n`[:r nil nil :b]` 中的非 `nil` 条是比较 r/g/g/b 和 r/y/y/b 时的精确匹配。有了\
  \ `diff`，`exact-matches` 的实现就变得简单了：\n\n```clojure\n(defn exact-matches\n  \"给定两个集合，返回集合中包含相同项的位置数量。\"\
  \n  [c1 c2]\n  (let [[_ _ matches] (data/diff c1 c2)]\n    (count (remove nil? matches))))\n\
  ```\n\n再次，在 REPL 中针对示例进行测试：\n```clojure\n(exact-matches [:r :g :g :b] [:r :y :y\
  \ :b])\n2\n```\n\n现在让我们关注无序匹配。为了计算这些匹配，我们需要知道秘密和猜测中每种颜色的插子各有多少个。这听起来像是 `frequencies`\
  \ 函数的工作：\n\n```clojure\n(def example-secret [:r :g :g :b])\n(frequencies example-secret)\n\
  -> {:r 1, :g 2, :b 1}\n\n(def example-guess [:y :y :y :g])\n(frequencies example-guess)\n\
  -> {:y 3, :g 1}\n```\n\n将这两个频率转换为 `unordered-matches`，我们需要做两件事：\n\n* 只考虑同时出现在秘密和猜测中的键\n\
  * 仅统计重叠部分（即对应键下值中的最小值）\n\n再次，我们希望这些操作存在，幸运的是它们确实存在。你可以使用 `select-keys` 保留需要的键：\n\
  \n```clojure\n(select-keys (frequencies example-secret) example-guess)\n-> {:g 2}\n\
  \n(select-keys (frequencies example-guess) example-secret)\n-> {:g 1}\n```\n\n你可以使用\
  \ `merge-with` 计算两个频率映射之间的重叠部分：\n\n```clojure\n(merge-with min {:g 1} {:g 2})\n\
  -> {:g 1}\n```\n\n将 `frequencies`、`select-keys` 和 `merge-with` 结合起来得到了 `unordered-matches`\
  \ 的如下定义：\n\n```clojure\n(defn unordered-matches\n  \"给定两个集合，返回一个映射，其中每个键都是两个集合中的项，\n\
  \  且每个值都是该值在出现次数最少的集合中出现的次数。\"\n  [c1 c2]\n  (let [f1 (select-keys (frequencies\
  \ c1) c2)\n        f2 (select-keys (frequencies c2) c1)]\n    (merge-with min f1\
  \ f2)))\n```\n\n当然，我们应该在 REPL 中验证它：\n\n```clojure\n(unordered-matches [:r :g :g\
  \ :b] [:r :y :y :g])\n-> {:g 1}\n```\n\n这很好，但有一个细微之处。`unordered-matches` 不分顺序地计算匹配，而游戏将想要知道顺序不正确的匹配。尽管游戏似乎并不需要\
  \ `unordered-matches`，但编写它是有意义的，原因如下：\n\n* `unordered-matches` 只做一件事。要写一个无序匹配，我们必须在\
  \ `unordered-matches` 内部重新实现 `exact-matches`。\n* 我们刚刚编写的两个简单函数正是我们组合以获得无序语义所需要的函数。只需从\
  \ `unordered-matches` 的结果中减去 `exact-matches` 的结果即可。\n\n有了这两个原语，`score` 操作只需将它们结合起来：\n\
  \n```clojure\n(defn score\n  [c1 c2]\n  (let [exact (exact-matches c1 c2)\n    \
  \    unordered (apply + (vals (unordered-matches c1 c2)))]\n    {:exact exact :unordered\
  \ (- unordered exact)}))\n```\n\nREPL 欢喜了：\n\n```clojure\n(score [:r :g :g :b] [:r\
  \ :y :y :g])\n-> {:exact 1, :unordered 1}\n```\n\n\n\n\n到这里，我们已经对问题“什么是良好的代码编写工作流？”给出了一个部分的答案。总结如下：\n\
  \n*   拆解问题以识别纯函数。\n*   学习标准库，以便你可以找到已经写好的函数。\n*   不要“倒混凝土”（使用数据作为数据）。\n*   在 REPL\
  \ 中从内向外地进行测试。\n\n根据我们的经验，第一次尝试这种工作流的程序员通常会犯两个典型错误：\n\n*   编写代码过多\n*   使测试复杂化\n\n\
  每当你不理解表单的行为时，你就写了太多的代码，但你还没有测试并理解它所有的子表单。许多开发者有一种“写 X 行代码，然后进行测试”的直觉，其中 `X` 是能够完成某项实质性任务的最小行数。在\
  \ Clojure 中，`X` 远小于 1，这就是为什么我们强调在 REPL 中从内向外构建函数。\n\n“使测试复杂化”要微妙得多，我们将在下一节讨论。\n\n\
  ## 10.2 测试评分器\n\n在上一节中，我们在 REPL 中迭代地开发了 `score` 函数，并看到它在几个示例输入下运行正常。想要比这更多的验证，对质量的投入并不算多！让我们开始拆解一下人们在说“测试”时所含义的内容。测试包括：\n\
  \n*   思考代码是否正确\n*   在开发环境中单步执行代码，在那里你可以看到发生的一切事情\n*   构建输入以覆盖各种代码路径\n*   构建输出以匹配构建的输入\n\
  *   使用各种输入运行代码\n*   验证结果的正确性\n*   结果验证的自动化\n*   组织测试，以便将来为了回归测试而自动运行\n\n这并不是一个详尽的列表，但足以说明本节的观点。简而言之，测试通常是复杂的，但它也可以是简单的。\n\
  \n传统的单元测试方法整合了前面列出的许多测试任务。例如，输入、输出、执行和验证往往交织在单个测试方法内部。另一方面，我们之前做的最小化 REPL 测试是不够的。我们可以在不引入单元测试复杂性的情况下，获得之前某些测试思想的收益吗？让我们尝试一下。\n\
  \n### 构建输入\n\n我们已经看到 `score` 函数在几个手工构建的输入上运行。我们需要多少个输入才能说服自己函数是正确的？在完美的世界中，我们应该测试所有输入，但这在计算上几乎是不可行的。但我们很幸运，因为游戏评分问题对于不同颜色数量或插子数量的变体本质上是相同的。如此，我们实际上可以为小型游戏生成所有可能的输入。\n\
  \n处理形成模式不同方式的数学分支称为组合数学。事实证明，Clojure 库 `math.combinatorics` 我们需要生成所有可能的输入的函数。如果你的\
  \ `project.clj` 文件中的 `:dependencies` 下不存在，请添加以下形式：\n\n| | `[org.clojure/math.combinatorics\
  \ \"0.0.1\"]` |\n\n`selections` 函数接受两个参数（集合和大小），并返回由该集合中的元素组成的该大小的每个结构。尝试为一个只有三种颜色和两列的极简版\
  \ Clojbreaker 测试：\n\n| | `(require '[clojure.math.combinatorics :as comb])` |\n\
  | | `(comb/selections [:r :g :b] 2)` |\n| | `-> ((:r :r) (:r :g) (:r :b)` |\n| |\
  \ `(:g :r) (:g :g) (:g :b)` |\n| | `(:b :r) (:b :g) (:b :b))` |\n\n所以，`selections`\
  \ 可以给我们一个可能的秘密或一个可能的猜测。那么为 `score` 函数生成输入呢？嗯，那只是从这些选择中选择两个选择：\n\n| | `(-> (comb/selections\
  \ [:r :g :b] 2)` |\n| | `(comb/selections 2))` |\n| | `-> (为了简洁省略了 81 对游戏位置)` |\n\
  \n让我们将其放入一个命名函数：\n\n[clojurebreaker/src/clojurebreaker/game.clj](http://media.pragprog.com/titles/shcloj2/code/clojurebreaker/src/clojurebreaker/game.clj)\n\
  \n```clojure\n(defn generate-turn-inputs\n  \"为具有颜色颜色和 n 列的 clojurebreaker 游戏生成所有可能的回合输入\"\
  \n  [colors n]\n  (-> (comb/selections colors n)\n      (comb/selections 2)))\n\
  ```\n\n好了，输入已生成。我们将跳过对输出的思考（原因稍后会显而易见），并将注意力转向运行代码。\n\n### 运行测试\n\n我们将编写一个函数，接受输入序列并报告调用\
  \ `score` 的结果。我们暂时不想投入到结果将如何验证上。也许人类会读取它。也许程序会处理它。无论如何，这个函数都需要调用 `score`。\n\n在 REPL\
  \ 中尝试一下：\n\n```clojure\n(->> (generate-turn-inputs [:r :g :b] 2)\n  (score))\n```\n\
  \n### 验证输出\n\n（注：此处根据原文逻辑补充了跳过构建输出的后续说明）\n\n在这一点上，我们为什么跳过构建输出已经显而易见了。程序已经为我们完成了这些工作。我们只需要决定投入多少精力来验证它们。这里是一些我们可能采取的方法：\n\
  \n*   让人类代码破译专家阅读游戏小型变体的整个输出表。这种方法的优点是详尽的，但可能会漏掉在大型游戏中出现的逻辑错误。\n*   从大型游戏中随机选择一组结果，并让人类专家验证。\n\
  \n\n\n我们稍后会回到程序化验证，但让我们先转向回归测试。\n\n### 回归测试\n\n你希望有一套比你所做的验证工作更详尽的回归测试套吗？没问题。\n\n\
  - 编写一个结果不应改变的程序。\n- 运行程序一次，并将结果保存到（命名良好的！）文件中。\n- 每当程序发生变化时，再次运行该程序，并与保存的文件进行比较。如果有任何不同之处，说明程序出坏了。\n\
  \n这种回归方法的好妙之处在于，即使你从未对结果进行过任何验证，它依然有效。当然，你仍然应该进行验证，因为这将帮助你缩小问题发生的范围。（如果没有验证，回归错误可能只是在告诉你旧代码是有问题的，而新代码修复了它。）\n\
  \n编写一个应该产生完全相同输出的程序有多难呢？只调用程序中的纯函数，这正是我们的 `score-inputs` 函数所做的。\n\n将这种回归测试集成到持续集成（CI）构建中并不困难。如果你这样做了，请考虑将其贡献给你你正在使用的任何测试框架。\n\
  \n现在我们部分地回答了这个问题：“如何确保我的代码是正确的？”总而言之：\n\n- 使用微小的、可组合的部分进行构建（大部分部分应该是纯函数）。\n- 在 REPL\
  \ 中从内部向外部测试形式。\n- 在编写测试代码时，将输入生成、执行和输出验证保持为独立的步骤。\n\n最后一个想法如此重要，以至于值得某些库的支持。因此，在我们继续之前，我们将引入\
  \ `test.generative`，这是一个旨在为测试带来简单性的库。\n\n## 10.3 test.generative\n\n`test.generative`\
  \ 库将测试分为三个关键步骤：\n\n- 生成测试输入\n- 调用测试函数\n- 验证结果\n\n这三个步骤中的每一个都通过函数实现，然后通过 `defspec`\
  \ 形式组合成测试。\n\n让我们安装 `test.generative` 并尝试一下。在你的 `project.clj` 中添加以下行：\n\n```text\n\
  [org.clojure/test.generative \"0.1.3\"]\n```\n\n现在执行你用于重载项目代码的任何步骤，并在 REPL 中汇合，生成一些测试数据。\n\
  \n### 生成数据\n\n从 REPL 开始，如下所示引入 `generators` 命名空间：\n\n```text\n(require '[clojure.test.generative.generators\
  \ :as gen])\n```\n\n`generators` 命名空间包含了用于为不同的常用数据类型生成伪随机值的函数。例如，对于每个 Java 原始类型，都有一个同名的生成器函数。尝试其中几个：\n\
  \n```text\n(gen/int)\n-> 977378563\n\n(gen/char)\n-> \\A\n\n(gen/boolean)\n-> true\n\
  ```\n\n注意，你的结果可能与之前显示的并不相同，因为这些值的意义在于随机性。\n\n你也可以为不同的 Clojure 集合类型生成随机值。这些函数通过要创建的集合类型参数化。例如：\n\
  \n```text\n(gen/vec gen/boolean)\n-> [false false true true true false]\n\n(gen/hash-map\
  \ gen/byte gen/int)\n-> {32 -504310803, 100 424501842, 5 1439482147, 37 1161641068}\n\
  ```\n\n除了基本类型外，你还可以使用几个旋旋来控制类型的生成方式。你可以选择一种概率分布：\n\n```text\n(gen/geometric 0.02)\n\
  -> 10\n```\n\n你还可以控制集合的大小，使用常数或分布：\n\n```text\n(gen/list gen/int 2)\n-> (-1029960512\
  \ 1985289448)\n\n(gen/list gen/int (gen/uniform 0 5))\n-> (315829211)\n```\n\n还有其他一些好东西，但我们不会破坏你探索发现的乐趣。对命名空间执行\
  \ `dir`，并熟悉其他可用的标准生成器。\n\n为了测试 Clojurebreaker 评分器，我们需要一个生成随机秘密（或猜想）的函数。继续使用棋子颜色的关键字表示，这样的函数可能如下：\n\
  \n```clojure\n;; clojurebreaker/test/clojurebreaker/game_test.clj\n(defn random-secret\n\
  \  []\n  (gen/vec #(gen/of :r :g :b : 4))\n```\n\n在继续验证之前，不要忘记在 REPL 中尝试 `random-secret`。\n\
  \n### 程序化验证\n\n程序化验证不应仅仅是针对特定值的手工编码抽样检查。当我们能够轻松审查一组输出并将其保存为回归测试时，这种抽样检查是对时间的极度浪费。相反，程序化验证器应该强制执行输入和输出的逻辑不变性。\n\
  \n这里是 Clojurebreaker 评分的一些不变性：\n\n- 评分是对称的。如果反转了 `secret` 和 `guess` 参数，分数将是相同的。\n\
  - 精确匹配和无序匹配的总和必须大于等于零，且小于等于棋子数量。\n- 如果打乱了猜测中棋子的顺序，分数中精确匹配和无序匹配的总和将不会改变。\n\n让我们将这些不变性分别编码为关于\
  \ `secret`、`guess` 和 `score` 的布尔函数：\n\n```clojure\n;; clojurebreaker/test/clojurebreaker/game_test.clj\n\
  (ns clojurebreaker.game-test\n  (:use [clojure.test.generative :only (defspec) :as\
  \ test])\n  (:require [clojure.test.generative.generators :as gen]\n           \
  \ [clojurebreaker.game :as game]\n            [clojure.math.combinatorics :as comb]))\n\
  \n(defn matches\n  \"给定分数，返回精确匹配加无序匹配的总数。\"\n  [score]\n  (+ (:exact score) (:unordered\
  \ score)))\n\n(defn scoring-is-symmetric\n  [secret guess score]\n  (= score (game/score\
  \ guess)))\n\n(defn scoring-is-bounded-by-number-of-pegs\n  [secret guess score]\n\
  \  (< 0 (matches score) (count secret)))\n\n(defn reordering-the-guess-does-not-change-matches\n\
  \  [secret guess score]\n  (= {(matches score)}\n   (into {} (map #(matches (game/score\
  \ secret %))\n     (comb/permutations guess)))))\n```\n\n虽然我们通常在 REPL 中输入代码然后将其粘贴到相应的文件，但之前处理不变性函数时我们反过来了，先将它们添加到源文件中。但这并不意味着我们必须失去\
  \ REPL 的即时性。从 REPL 中，我们可以重载命名空间，然后使用 `in-ns` 进入该命名空间：\n\n```text\n(require :reload\
  \ 'clojurebreaker.game-test)\n(in-ns 'clojurebreaker.game-test)\n```\n\n现在我们进入了想要使用的命名空间，可以访问它的所有公开名称和别名。这使得方便地手工制作一些示例数据，作为验证函数的快速健全检查：\n\
  \n```clojure\n(def secret [:r :g :g :b])\n(def guess [:r :b :b :y])\n\n(scoring-is-symmetric\
  \ secret guess (game/score secret guess))\n-> true\n\n(scoring-is-bound-by-number-of-pegs\
  \ secret guess (game/score secret guess))\n-> true\n\n(reordering-the-guess-does-not-change-matches\
  \ secret guess (game/score secret guess))\n-> true\n```\n\n有了测试数据生成器和验证函数，我们现在准备好在\
  \ `defspec` 中将一切结合起来了。\n\n\n\n\n\n### defspec\n\n`defspec` 接收三个强制参数：\n\n*   spec\
  \ 的名称\n*   要测试的函数\n*   要生成的参数\n\n在参数之后，可以跟零个或多个体形式（body forms），用于执行校验。这里有一个简单的示例：\n\
  \n| [clojurebreaker/snippets.clj](http://media.pragprog.com/titles/shcloj2/code/clojurebreaker/snippets.clj)\
  \ |\n| :--- |\n| | `(defspec closed-under-addition` |\n| | `  '+` |\n| | `  [^long\
  \ a ^long b]` |\n| | `  (assert (integer? %)))` |\n\n这些参数看起来像普通的 Clojure 参数，但有一个不同之处。普通的函数参数可以可选地标记上类型提示（type\
  \ hints）。而 Spec 参数必须被标记，且其提示要告诉程序如何生成这些参数。\n\n`test.generative` 中的函数 `generate-test-data`\
  \ 接收一个参数 spec 并生成无限的测试数据序列。你可以直接调用 `generate-test-data` 来独立于任何测试执行而生成参数：\n\n```clojure\n\
  (take 3 (test/generate-test-data '[long long]))\n-> ([-5025562857975149833 -5843495416241995736]\
  \ [5694868678511409995 5111195811822994797] [-6169532649852302182 -1782466964123969572])\n\
  ```\n\n`defspec` 的正体可以通过名称访问参数，就像普通函数一样。此外，它还可以访问 `%`，`%` 包含了调用测试函数后的返回值。在 `closed-under-addition`\
  \ 示例中，唯一的校验器形式检查了加法结果是否为整数，甚至懒得去查看输入参数：\n\n```clojure\n(assert (integer? %))\n```\n\
  \n更复杂的校验器通常会同时引用输入参数和结果。\n\n### 运行测试\n\nSpecs 仍然是函数，因此你可以通过简单调用函数来运行它们。如果你在阅读上一节时在\
  \ REPL 中求值了 `closed-under-addition` spec，你现在可以调用它并传入一些整数：\n\n```clojure\n(closed-under-addition\
  \ 1 2)\n-> nil\n```\n\n但更有趣的是使用生成的输入来运行 spec。`test.generative` 中有三个辅助函数用于此目的：\n\n\
  *   `test-vars` 接收一个或多个 vars，并运行这些 vars 引用的 specs。\n*   `test-dirs` 接收一个或多个目录，并反射地找到这些目录中的所有\
  \ specs 并运行它们。\n*   `test-namespaces` 接收多个命名空间并反射地找到这些命名空间中的所有 specs 并运行它们。\n\n\
  让我们运行 `closed-under-addition` spec：\n\n```clojure\n(require '[clojure.test.generative\
  \ :as test])\n(test/test-vars #'closed-under-addition)\n-> [#<core$future_call$reify__5684@603a3e21:\
  \ :pending> #<core$future_call$reify__5684@fc519e2: :pending>]\n```\n\n调用 `test-vars`\
  \ 返回了一些 futures（在之前的输出中是两个）。然后大约过了十秒，没有任何反应，接着是类似这样的 REPL 输出：\n\n```clojure\n{:iterations\
  \ 179766, :msec 10228, :var #'clojurebreaker.game-test/closed-under-addition, :seed\
  \ 43}\n{:iterations 156217, :msec 10249, :var #'clojurebreaker.game-test/closed-under-addition,\
  \ :seed 42}\n```\n\n在后台，`test.generative` 为你本地硬件上的每个处理器创建了一个 future。每个 future 在十秒内尽可能多地运行测试。输出显示了每个线程运行了多少次迭代，每个线程完成花费了多少时钟时间，以及为每个测试的\
  \ var 生成数据时使用的随机种子。\n\n`test.generative` 暴露了几个动态变量（dynamic vars）来自定义测试运行。你可以绑定 `test/*msec`\
  \ 来更改测试运行的长度，或者可以绑定 `test/*cores` 来更改测试运行利用的内核数。你还可以绑定 `test/*verbose` 在测试运行期间将所有输入打印到\
  \ `out`。\n\n### 当 Spec 失败时\n\n当 spec 失败时，`test.generative` 提供额外的输出以帮助你重现问题。让我们写一个通过断言两个数之和小于某个失败的\
  \ spec：[clojurebreaker/snippets.clj](http://media.pragprog.com/titles/shcloj2/code/clojurebreaker/snippets.clj)\n\
  \n```clojure\n(defspec incorrect-spec\n  '+ [^long a ^long b]\n  (assert (< a))\n\
  \  (assert (< b)))\n```\n\n如果你运行 `incorrect-spec`，它将快速失败并显示类似下面的错误：\n\n```text\n\
  {:form (clojurebreaker.game-test/incorrect-spec -5025562857975149833 -5843495416241995736)}\n\
  ```\n\n`:form` 键提供了失败的输入，`:iteration` 告诉你迭代次数，`:seed` 是生成数据时的种子，`:exception` 则是错误信息。\n\
  \n如果你想重现失败，可以使用 `:seed` 重新运行测试。如果你想查看失败的特定输入，可以使用 `failures` 函数：\n\n```clojure\n\
  (test/failures 'incorrect-spec)\n```\n\n如果你想查看所有失败的迭代，输出中已经包含了所有失败的迭代：\n\n```clojure\n\
  {:iterations 179766, :msec 10228, :var #'clojurebreaker.game-test/closed-under-addition,\
  \ :seed 43}\n{:iterations 156217, :msec 10249, :var #'clojurebreaker.game-test/closed-under-addition,\
  \ :seed 42}\n```\n\n如果你想，，，，，，，，，，，，，，，，，，，，，，，，，，，，，，，，，，，可以，可以查看 `AssertionError`\
  \ 错误：\n\n```clojure\n{:form (clojurebreaker.game-test/incorrect-spec) :iteration\
  \ 0} :exception #<java.lang.AssertionError: (<)>\n```\n\n### 生成式测试 score 函数\n\n\
  在 程序化校验 中，我们已经创建了几个验证 Clojbreaker 评分的函数。现在让我们它们加入一个 spec 中：[clojurebreaker/test/game_test.clj](http://media.pragprog.com/titles/shcloj2/code/clojurebreaker/test/game_test.clj)\n\
  \n```clojure\n(defspec score-invariants\n  game/score\n  [^{tag random-secret} secret\
  \ ^{tag random-secret} guess]\n  (assert (scoring-is-symmetric secret guess))\n\
  \  (assert (scoring-is-bounded-by-number-pegs secret guess))\n  (assert (reordering-the-guess-does-not-change-matches\
  \ secret guess)))\n```\n\n这个 spec 展示了 `defspec` 的一个新用法：语法引号的使用。`random-secret` 之上的语法引号表示该生成函数是由我们自定义的。参数\
  \ spec 中的名称引用有两种规则：\n\n*   如果名称没有语法引号，那么该名称将相对于 `clojure.test.generative.generators`\
  \ 命名空间中的内置生成器进行解析。这些名称正是 `clojure.core` 中的类型和工厂名称，这就是为什么内置生成器看起来像类型提示。\n*   如果名称有语法引号，那么该名称将由\
  \ `defspec` 所在的命名空间的规则进行解析。这允许你使用所有标准的命名空间工具来管理自己的生成器。\n\n现在，见证真相的时刻。当我们运行 spec\
  \ 时，不变性是否真的成立？\n\n```clojure\n#'clojurebreaker.game-test/score-invariants\n-> [#<core$future_call$reify__5684@590e130c:\
  \ :pending> #<core$future_call$reify__5684@2b04a681: :pending>]\n\n;; 十秒过去\n```\n\
  \n\n\n\n\n```clojure\n{:iterations 1794, :msec 10002, :seed 42, :var #'clojurebreaker.game-test/score-invariants}\n\
  {:iterations 1787, :msec 10001, :seed 43, :var #'clojurebreaker.game-test/score-invariants}\n\
  ```\n\n看起来不错。你还能想到其他有趣的可以测试的不不变性吗？\n\n到目前，我们仅仅触及了 `test.generative` 的冰角。虽然我们喜欢将输入生成、执行和验证分离开，但在\
  \ `Clojure` 中使用更熟悉的单元测试、TDD 和 BDD 方法也是完全可行的。如果你对这些感兴趣，应该查看以下库：\n\n*   `clojure.test`\
  \ 是一个内置在 Clojure 自有测试套件中的轻量级单元测试库。\n*   `Lazytest` 是一个通用型库，它在几个通用测试表示的基础上支持不同的测试风格。\n\
  *   `Midje` 强调测试的可读性，同时允许进行自顶向下和自底向上的测试。\n\n`test.generative` 中的许多想法灵感来自 `QuickCheck`，该测试库最初用\
  \ Haskell 编写，现在已移植许多语言。如果你觉得 `test.generative` 有趣，绝对应该查看 `QuickCheck`，它拥有很长的开发历史和许多在\
  \ `test.generative` 中尚未发现的功能。\n\n既然我们对自己的评分函数有了一些信心，让我们看看如何在 Web 上运行一个 Clojurebreaker\
  \ 游戏吧。\n\n## 10.4 创建接口\n\n有了坚实的基础，引入一个接口和可玩的游戏版本应该是轻而易举的。让我们从一个基础 Web 应用开始。`noir`\
  \ Web 框架将作为我们构建应用的基础。创建一个新的 `noir` 项目非常简单。\n\n首先，你需要为 `leiningen` 安装 `lein-noir`\
  \ 插件：\n\n```bash\n$ lein plugin install lein-noir 1.2.0\n```\n\n现在我们可以生成并启动应用了：\n\
  \n```bash\n$ lein noir new clojurebreaker\n$ cd clojurebreaker\n$ lein run\n```\n\
  \n将浏览器指向 [`localhost:8080`](http://localhost:8080)。你会看到默认的 `noir` 落地页，这目前对你来说没意思，但它能确保你的设置是正确的。\n\
  \n### 终于是时候处理状态了\n\n这是我们将引入唯一的一个状态的地方。由于我们希望多个玩家能够同时享受我们的游戏，并且我们希望能够在请求之间维护游戏的解，我们需要在某处存储这个值。很棒的一点是我们不需要在代码中管理它。我们可以将其放入浏览器的\
  \ session 中，让我们的应用代码免于状态管理。\n\n让我们从打开 `src/clojurebreaker/views/welcome.clj` 开始。将\
  \ `/welcome` 页面改为 `/`。我们需要一种方法在 session 中不存在内容时存入一些。幸运的是，`noir` 有 `session/put!`\
  \ 和 `session/get`。让我们使用它们吧。\n\n```clojure\n(defpage \"/\" []\n  (when-not (session/get\
  \ :game)\n    (session/put! :game (.nextInt (java.util.Random.) 1000000)))\n  (common/layout\n\
  \    [:p \"Welcome to clojurebreaker.\n     Your current game id is \" (session/get\
  \ :game)]))\n```\n\n如果你刷新浏览器，现在会看到你的 session 中有一个游戏 ID。如果你继续刷新，它不应该改变。如果你清除 session\
  \ 并刷新，你应该会看到一个新的游戏 ID。我们将在以后使用这种技术，但我们不再需要随机生成的 ID 了。那只是为了证明 session 存储器工作正常。\n\n\
  在 `src/clojurebreaker/models` 中创建一个名为 `game.clj` 的新文件。在这里我们将放置生成新游戏密码并将其返回视图所需的函数。\n\
  \n```clojure\n(ns clojurebreaker.models.game)\n\n(defn create []\n  (vec (repeatedly\
  \ 4 (fn [] (rand-nth [\"r\" \"g\" \"b\" \"y\"])))))\n```\n\n让我们在 REPL 中尝试一下，只需确保它生成了我们需要的内容。\n\
  \n```clojure\n(in-ns 'clojurebreaker.models.game)\nclojurebreaker.models.game=>\
  \ (otimes 5 (println (create)))\nnil\n```\n\n这就是我们开始游戏所需的所有。我们只需要回到视图并把代码连接起来。记住\
  \ `test.generative` 也可以创建你的游戏，所以可以尽管使用它来代替之前的函数。这展示了创建密码的另一种方法。\n\n```clojure\n\
  (defpage \"/\" []\n  (when-not (session/get :game)\n    (session/put! :game (game/create)))\n\
  \  (common/layout\n    [:p \"Welcome to clojurebreaker.\n     Current game solution\
  \ is \" (session/get :game)]))\n```\n\n另外，别忘记在命名空间声明中引入 `clojurebreaker.models.game`\
  \ 为 `game`。当你刷新浏览器时，你会看到你的游戏解。如果解仍然是一个 ID，你需要清除浏览器的 session 并刷新。尝试打开不同的浏览器并访问应用。你应该能看到不同的游戏解。\n\
  \n### 玩家接口\n\n现在我们有了游戏状态，我们需要为玩家创建一个接口。让我们先创建一个面板。我们需要在命名空间声明中引入 `hiccup.form-helpers`\
  \ 命名空间以及 `hiccup`。现在我们将利用 `noir` 的 `defpartial` 宏。\n\n```clojure\n(defpartial board\
  \ []\n  (form-to [:guess\"]\n    (text-field \"one\")\n    (text-field \"two\")\n\
  \    (text-field \"three\")\n    (text-field \"four\")\n    (submit-button \"Guess\"\
  )))\n```\n\n`defpartial` 宏在这里非常有用，因为它像普通的 Clojure 函数一样被使用。这在我们以后接入评分时大派用场。在 REPL\
  \ 中尝试一下：\n\n```clojure\nclojurebreaker.models.game=> (in-ns 'clojurebreaker.views.welcome)\n\
  clojurebreaker.views.welcome=> (board)\n\"<form action=\\\"guess\\\" method=\\\"\
  POST\\\">\n  <input id=\\\"one\\\" name=\\\"one\\\" type=\\\"text\\\" />\n  <input\
  \ id=\\\"two\\\" name=\\\"two\\\" type=\\\"text\\\" />\n  <input id=\\\"three\\\"\
  \ name=\\\"three\\\" type=\\\"text\\\" />\n  <input id=\\\"four\\\" name=\\\"four\\\
  \" type=\\\"text\\\" />\n  <input type=\\\"submit\\\" value=\\\"Guess\\\" /></form>\"\
  \n```\n\n现在我们只需要连接它：\n\n```clojure\n(defpage \"/\" []\n  (when-not (session/get\
  \ :game)\n    (session/put! :game (game/create)))\n  (common/layout (board)))\n\
  ```\n\n既然我们已经验证了 session 部分工作正常，我们可以移除它们的显示并用实际的游戏替换它们。我们现在有了让用户猜测的方法。嗯，至少我们有了让用户在浏览器中输入的方法。让我们连接服务器端。\n\
  \n回到视图，我们需要创建另一个页面来响应对 `/guess` 的 POST 请求。在这里我们需要执行以下操作：\n\n*   接受四个输入并将它们发送给评分器。\n\
  *   判断玩家是否赢了游戏（四个精确匹配）。如果是，祝贺他们获胜并添加一个开始新游戏的按钮。\n*   如果用户没有赢，则返回精确匹配和无序匹配的数量，以及最后一组输入，并将它们显示给用户。\n\
  \n为了对请求进行评分，我们需要在本章节早些创建的游戏评分函数。让我们在模型中添加 `exact-matches`、`unordered-matches` 和\
  \ `score`。一旦评分函数就绪，我们就可以接入我们的处理程序并完成游戏的第一阶段。\n\n\n\n\n\n`clojurebreaker/src/clojurebreaker/views/welcome.clj`\n\
  \n```clojure\n(defpage [:post \"/guess\"] {:keys [one two three four]}\n  (let [result\
  \ (game/score (session/get :game) [one two three four])]\n    (if (= (:exact result)\
  \ 4)\n      (do\n        (session/remove! :game)\n        (common/layout\n     \
  \     [:h2 \"Congratulations, you have solved the puzzle!\"]\n          (form-to\
  \ [:get \"/\"]\n          (submit-button \"Start A New Game\"))))\n      (do\n \
  \       (session/flash-put! result)\n        (render \"/\" {:one one\n         \
  \          :two two\n                   :three three\n                   :four four\n\
  \                   :exact (:exact result)\n                   :unordered (:unordered\
  \ result)})))))\n```\n\n好了，这部分有点像 REPL 风格。在这里，我们可以判断玩家是否赢了游戏并进行恰善的处理。不过，这里还从 `noir`\
  \ 中引入了一些尚未介绍过的新东西。`defpage` 之后的 `:keys` 解构赋值是在处理从浏览器传来的参数。`session/remove!` 的作用正如你所想的那样。有趣的部分从\
  \ `session/flash-put!` 开始。它会将某些内容添加到会话，供紧随后的请求使用，然后它就会消失。这类似于 Ruby on Rails 的 flash\
  \ 方法。最后，`render` 函数会带有随后的参数调用路由。\n\n只需少量的修改，我们就可以尝试运行游戏了。我们的 `/` 路由需要能够接受通过我们刚刚编写的\
  \ `render` 调用传来的参数。让我们修复它。首先修改 `board` 局部视图，使其接收并解构传递给它的参数以及渲染结果：\n\n`clojurebreaker/src/clojurebreaker/views/welcome.clj`\n\
  \n```clojure\n(defpartial board [{:keys [one two three four exact unordered]}]\n\
  \  (when (and exact unordered)\n    [:div \"Exact: \" exact \" Unordered: \" unordered])\n\
  \    (form-to [:post \"/guess\"]\n    (text-field \"one\" one)\n    (text-field\
  \ \"two\" two)\n    (text-field \"three\" three)\n    (text-field \"four\" four)\n\
  \    (submit-button \"Guess\"))))\n```\n\n在这里，我们更改了面板的渲染方式以响应玩家的猜测。我们将显示猜测的结果，并将玩家之前的猜测放回面板上，这样他们就可以进行修改并继续。。在\
  \ REPL 中尝试这种操作，看看在特定输入下会产生什么输出：\n\n```clojure\nclojurebreaker.views.welcome=> (board\
  \ {:one \"r\" :two \"b\" :three \"y\" :four \"g\"})\n```\n\n```html\n<form action=\"\
  /guess\" method=\"POST\">\n  <input id=\"one\" name=\"one\" type=\"text\" value=\"\
  r\" />\n  <input id=\"two\" name=\"two\" type=\"text\" value=\"b\" />\n  <input\
  \ id=\"three\" name=\"three\" type=\"text\" value=\"y\" />\n  <input id=\"four\"\
  \ name=\"four\" type=\"text\" value=\"g\" />\n  <input type=\"submit\" value=\"\
  Guess\" />\n</form>\n```\n\n```clojure\nclojurebreaker.views.welcome=> (board {:one\
  \ \"r\" :two \"b\" :three \"y\" :four \"g\" :exact 2 :unordered 0})\n```\n\n```html\n\
  <div>Exact: 2 Unordered: 0</div>\n<form action=\"/guess\" method=\"POST\">\n  <input\
  \ id=\"one\" name=\"one\" type=\"text\" value=\"r\" />\n  <input id=\"two\" name=\"\
  two\" type=\"text\" value=\"b\" />\n  <input id=\"three\" name=\"three\" type=\"\
  text\" value=\"y\" />\n  <input id=\"four\" name=\"four\" type=\"text\" value=\"\
  g\" />\n  <input type=\"submit\" value=\"Guess\" />\n</form>\n```\n\n对页面定义只进行一点微小的修改，我们就可以开始了！\n\
  \n`clojurebreaker/src/clojurebreaker/views/welcome.clj`\n\n```clojure\n(defpage\
  \ \"/\" {:as guesses}\n  (when-not (session/get :game)\n    (session/put! :game\
  \ (game/create)))\n    (common/layout (board guesses))))\n```\n\n在这里，我们只是接受来自 `render`\
  \ 的参数，以便将它们传递给 `board` 局部视图。由于 `board` 的工作类似于标准的 Clojure 函数，这个过程轻而易举。\n\n在运行游戏之前，还有一件事要做的。我们需要在\
  \ noir 项目的 `project.clj` 文件中添加 `math.combinatorics`。\n\n`clojurebreaker/project.clj`\n\
  \n```clojure\n(defproject clojurebreaker \"0.1.0-SNAPSHOT\"\n  :description \"Clojurebreaker\
  \ game for Programming Clojure 2nd Edition\"\n  :dependencies [[org.clojure/clojure\
  \ \"1.3.0\"]\n                 [org.clojure/math.combinatorics \"0.0.1\"]\n    \
  \             [org.clojure/test.generative \"0.1.3\"]\n                 [noir \"\
  1.2.0]]]\n  :main clojurebreaker.server)\n```\n\n重新运行 `lein deps` 和 `lein run`，现在你就可以尽情玩\
  \ Clojbreaker 了。\n\n## 10.5 部署你的代码\n\n现在你有了一个完整的应用程序，是时候把它展示给世界了！将应用程序部署到生产环境可能是一项漫长而艰巨的任务，涉及到移动代码。幸运的是，我们将跳过这些步骤，直接进入正题。有一个服务完全支持\
  \ Clojure 部署并使其极其简单。他们自称为 Heroku。\n\n设置 Heroku 只需要一些初始步骤，但部署过程就像提交代码到版本控制仓库一样简单。事实上，这就是你需要做的。简单的\
  \ `git push` 即可部署。\n\n要进行部署，你需要注册 Heroku 账号。\n\n### Procfile\n\nHeroku 使用程序中的一个特殊文件来告诉它如何启动程序。它被称为\
  \ `Procfile`。将其添加到项目根目录下。\n\n```clojure\nweb: lein run\n```\n\n如果你想确保设置正确，可以安装 foreman\
  \ gem 并运行 `foreman start`。如果它成功启动了你的应用程序，那么在 Heroku 上就不会有问题。\n\n### The Heroku Library\n\
  \n\n\n\nHeroku 提供了一种以编程方式与其平台交互的良好方法。唯一需要注意的是，如果你还没有安装相关环境，它需要一些额外的设置。你需要安装 Ruby\
  \ 编程语言以及 RubyGems。你的系统包管理器应该可以为你提供这些项目。如果没有，你可以始终访问 [`ruby-lang.org`](http://ruby-lang.org)。\n\
  \n通过 RubyGems 安装 Heroku 库：\n\n```bash\ngem install heroku\n```\n\n### Git\n\n这将提供一个\
  \ `heroku` 命令，你将用它进行所有基于 Heroku 的交互。\n\n下一步是在你的 Clojurebreaker 代码库内部创建一个 git 仓库。同样，你系统的包管理器应该可以为你提供合适的\
  \ git 版本。如果没有，你可以访问 [`git-scm.org`](http://git-scm.org)。\n\n一旦安装了 git，只需在 clojurebreaker\
  \ 程序的根目录下运行 `git init` 即可：\n\n```bash\ngit init\n-> Initialized empty Git repository\
  \ in ~/clojurebreaker/.git/\n```\n\n这将为你的应用程序创建初始的 git shell。接下来，你需要本地提交你的代码：\n\n\
  ```bash\ngit add .\ngit commit -m \"Initial commit\"\n[master (root-commit) dd4f8a8]\
  \ initial commit\n13 files changed, 65860 insertions(+), 0 deletions(-)\ncreate\
  \ mode 100644 .gitignore\ncreate mode 100644 project.clj\ncreate mode 100644 resources/public/css/reset.css\n\
  create mode 100644 src/clojurebreaker/game.clj\ncreate mode 100644 src/clojurebreaker/models/game.clj\n\
  create mode 100644 src/clojurebreaker/server.clj\ncreate mode 100644 src/clojurebreaker/views/common.clj\n\
  create mode 100644 src/clojurebreaker/views/welcome.clj\n```\n\n### 托管你的应用程序\n\n\
  此时，你已经将代码本地暂存，准备推送到 Heroku。现在是时候创建一个 Heroku 应用程序来托管你的程序了：\n\n```bash\nheroku create\
  \ --stack cedar\nCreating freezing-waterfall-3937... done, stack is cedar\nhttp://freezing-waterfall-3937.herokuapp.com/\
  \ |\ngit@heroku.com:freezing-waterfall-3937.git\nGit remote heroku added\n```\n\n\
  `--stack` 参数指定了 Heroku 上支持 Clojure 应用程序的平台。应用程序将获得 Heroku 提供的随机名称以及一个你可以访问以查看运行程序的\
  \ URL。如果你需要，稍可以重命名它。\n\n### 部署\n\n最后一步是运行 `git push`，Heroku 将处理剩下的工作。\n\n```bash\n\
  git push heroku master\nCounting objects: 24, done.\nDelta compression using up\
  \ to 4 threads.\nCompressing objects: 100% (15/15), done.\nWriting objects: 100%\
  \ (24/24), 230.67 KiB, done.\nTotal 24 (delta 0), reused 0 (delta 0)\n-----> Heroku\
  \ receiving push\n-----> Clojure app detected\n-----> Installing Leiningen\nDownloading:\
  \ leiningen-1.5.2-standalone.jar\nDownloading: rlwrap-0.3.7\nWriting: lein script\n\
  -----> Installing dependencies with Leiningen\n... Output elided ...\n-----> Discovering\
  \ process types\nProcfile declares types -> web\n-----> Compiled size is 12.8MB\n\
  -----> Launching... done, v4\nhttp://stormy-waterfall-3888.herokuapp.com deployed\
  \ to Heroku\n```\n\n你也可以使用 `heroku` 命令来访问你的应用程序：\n\n```bash\nheroku open\n```\n\n\
  这将打开浏览器并直接带你进入已部署的应用程序。第一次访问可能需要一些时间，但随后的请求会变快。你可以在 Heroku 的开发者中心找到 Heroku/Clojure\
  \ 教程：[`devcenter.heroku.com/articles/web-application`](http://devcenter.heroku.com/articles/web-application)。享受你的新\
  \ Clojure 应用程序带来的乐趣。让它变得更好，给它一些个性，并与与世界分享它吧！\n\n## 10 告别\n\n恭喜你。你在短时间内走过了很长一段路。你学习了许多让\
  \ Clojure 变得伟大的理念：Lisp、函数式编程和显式并发。在本章中，你看到了一种（许多方法中的）开发 Clojure 完整应用程序的工作流。\n\n\
  我们仅触及 Clojure 潜力的冰角，希望你迈出下一步，成为 Clojure 社区的活跃成员。加入邮件列表。在 IRC 上闲逛。Clojure 社区是友好且欢迎的，我们非常期待听到你的声音。\n\
  \n# 附录 1 编辑器支持\n\nClojure 的编辑器支持正在迅速发展，因此当你阅读这些内容时，这里的某些信息可能已经过时。有关最新信息，请参见社区 wiki\
  \ 中的 [Getting Started](http://dev.clojure.org/display/doc/GettingStarted) 页面，该页面包含针对不同开发环境的子页面。\n\
  \nClojure 代码简洁且富有表现力。因此，编辑器支持不像某些其他语言那样重要。然而，你仍然想要一个能够正确缩进代码并匹配括号的编辑器。\n\n在编写本书期间，我们使用了\
  \ Emacs 配合 Jeffrey Chu 的 `clojure-mode`。Emacs 对 Clojure 的支持非常好，但如果你不是 Emacs 用户，可能更倾向于从这里列出的熟悉的编辑器中开始：\n\
  \n| 编辑器 | 项目名称 | 项目 URL |\n| --- | --- | --- |\n| Eclipse | Counterclockwise | http://code.google.com/p/counterclockwise/\
  \ |\n| Emacs | clojure-mode | http://github.com/jochu/clojure-mode |\n| IntelliJ\
  \ IDEA | La Clojure | http://plugins.intellij.net/plugin/?id=4050 |\n| jEdit | jedit\
  \ modes | http://github.com/djspiewak/jedit-modes/tree/master/ |\n| NetBeans | enclojure\
