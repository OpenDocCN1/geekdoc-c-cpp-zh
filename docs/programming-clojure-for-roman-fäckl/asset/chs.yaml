  \ |\n\nClojure 是一种运行在 `JVM` 上的优美、优雅且非常强大的语言。它像是一座大教堂：你可以漫步其中，但你可能更倾向于由一位博学的导游陪同，他能为你提供见解，帮助你理解并欣赏其架构与艺术。在这本书中，你可以享受并受益于两位（而非一位）资深开发者的陪伴，他们拥有你所需要的深度知识和视角。\n\
  \n| → | Venkat Subramaniam 博士 |\n|  | 获奖作者作者，Agile Developer, Inc. 创始人 |\n\n# 第二版序言\n\
  \n自本书第一版出版以来，已经发生了很多变化。是的，语言进行了一些增强，例如协议（protocols）和记录（records）。然而，最显著的是，Clojure\
  \ 已经在各种领域被采用。人们使用 `Clojure` 构建初创公司、分析大型数据集，并进行通信、金融、Web 和数据库工作。一个庞大且支持良好的社区围绕着 `Clojure`\
  \ 建立起来，随之而来的是大量的库。这些库特别令人兴奋，不仅是因为它们提供的功能。其中最好的库拥抱了 `Clojure` 的方法和机制，并在此过程中达到了简单性和互操作性的新高度。\n\
  \n在这一第二版中，Stuart 和 Aaron 确保了涵盖了语言的增强特性，并让你体验到利用某些社区库的感受，同时留心传达让这一切运行起来的概念。这本书仍然是关于\
  \ `Clojure` 的一个令人心潮澎湃的介绍，我希望它激励你加入社区并最终为库生态系统做出贡献。\n\n—Rich Hickey\n`Clojure` 创造者\n\
  \n\n# 第一版序言\n\n我们正淹溺在复杂性之中。其中大部分是偶然的——源于我们解决问题的方式，而不是问题本身。面向对象的编程看起来很容易，但它产生的程序往往是相互连接的可变对象构成的复杂网络。单个对象上的单个方法调用可能会导致整个对象图的级联变化。理解何时会发生什么、事物是如何变成现在状态的，以及如何让它们回到该状态以尝试修复错误，都是非常复杂的。如果加入并发，它会迅速变得不可控。我们向程序中抛入模拟对象和测试套件，但往往没有去质疑我们的工具和编程模型。\n\
  \n函数式编程提供了一种替代方案。通过强调接受并返回不可变值的纯函数，它让副作用成为异常而非常态。随着我们在多核架构中面临日益的并发，这只会变得越来越重要。`Clojure`\
  \ 的设计是为了让商业软件开发人员能够容易且实用地使用函数式编程。它承认了在 `JVM` 等可靠的基础设施上运行的需求，并支持客户对 `Java` 框架和库的现有投资，以及这样做的巨大实用性。\n\
  \nStuart 的这书中最令人兴奋的地方在于他在多大程度上“理解” `Clojure`，因为这种语言的目标群体是像他一样的专业开发者。他显然有足够的经验来理解\
  \ `Clojure` 所解决的痛点，并对其务实的方法表示赞赏。这本书是对 `Clojure` 关键特性的热情之旅，它立足于实际应用，并对可能出现的新概念进行了温和的介绍。我希望它激励你用\
  \ `Clojure` 编写软件，让你回看时可以说：“这不仅完成了任务，而且是以一种健壮且简单的方式完成的，编写它也很有趣！”\n\n—Rich Hickey\n\
