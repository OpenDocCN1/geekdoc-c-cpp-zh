  \ |\n\n\n# 前言\n\n`Clojure` 是一种基于 Java 虚拟机 (`JVM`) 的动态编程语言，具有引入胜的特性：\n\n*   `Clojure`\
  \ 是优雅的。`Clojure` 纯洁的设计让你直击问题本质，没有大量的冗余和仪式。\n*   `Clojure` 是重载的 Lisp。`Clojure` 拥有\
  \ Lisp 内在的力量，但不受其历史限制。\n*   `Clojure` 是一种函数式语言。数据结构是不可变的，大多数函数没有副作用。这使得编写正确的程序以及从小程序组合大程序变得更容易。\n\
  *   `Clojure` 简化了并发编程。许多语言围绕锁构建并发模型，而锁很难正确使用。`Clojure` 提供了锁的替代方案：软件事务内存、代理（agents）、原子（atoms）和动态变量。\n\
  *   `Clojure` 拥抱 Java。从 `Clojure` 调用 `Java` 是直接且快速的，没有转换层。\n*   与许多流行的动态语言不同，`Clojure`\
  \ 很快。`Clojure` 的编写是为了利用现代 `JVM` 上可能的优化。\n\n许多其他语言涵盖了之前列表中的某些特性。在所有语言中，`Clojure`\
  \ 脱颖而出。之前列出的特性都很强大且有趣。它们在 `Clojure` 中的简洁协同非常引人注目。我们将在第一章 *入门 中涵盖这些特性以及更多内容。\n\n\
  ## 本书的读者\n\n`Clojure` 是一种强大的通用编程语言。因此，本书面向追求力量和优雅的经验程序员。对于具有 `C#`、`Java`、`Python`\
  \ 或 `Ruby` 等现代语言经验的人来说，这本书非常有用。\n\n`Clojure` 构建在 Java 虚拟机之上，而且速度很快。对于那些希望在不牺牲性能的情况下获得动态语言表达能力的\
  \ `Java` 程序员来说，这本书将特别具有吸引力。\n\n\n\nClojure 正在帮助重新定义通用语言应该包含哪些特性。如果你使用 Lisp 编程、使用\
  \ Haskell 这样的函数式语言，或者编写显式的并发程序，你将非常喜欢 Clojure。Clojure 结合了 Lisp、函数式编程和并发编程的理念，并让初次接触这些理念的程序员觉得它们更容易上手。\n\
  \nClojure 是更大现象的一部分。Erlang、F#、Haskell 和 Scala 等语言最近因其对函数式编程的支持或其并发模型而受到关注。这些语言的爱好者会发现他们与\
  \ Clojure 有许多共同点。\n\n## 本书内容\n\n第 1 章，`入门` 展示了 Clojure 作为一种通用语言的优雅之处，以及使 Clojure\
  \ 变得独特的函数式风格和并发模型。它还将引导你安装 Clojure 并在 REPL 中交互式开发代码。\n\n第 2 章，`探索 Clojure` 是对 Clojure\
  \ 所有核心构造的广度概述。读完本章后，你将能够读懂大多数日常 Clojure 代码。\n\n接下来的章节涵盖函数式编程。第 3 章，`用序列统一数据` 展示了如何将所有数据在强大的序列比喻下统一。\n\
  \n第 4 章，`函数式编程` 教你如何使用与序列库相同的风格编写函数式代码。\n\n第 5 章，`状态` 深入探讨了 Clojure 的并发模型。Clojure\
  \ 提供了四种处理并发的强大模型，并涵盖了 Java 并发库的所有优点。\n\n第 6 章，`协议与数据类型` 详细介绍了 Clojure 中的记录 (records)、类型\
  \ (types) 和协议 (protocols)。这些概念在 Clojure 1.2.0 中引入，并在 1.3.0 中得到了增强。\n\n第 7 章，`宏`\
  \ 展示了 Lisp 的标志性特性。宏利用 Clojure 代码即数据的这一事实，提供了元编程能力，这种能力在 Lisp 以外的语言中很难或实现。\n\n第 8\
  \ 章，`多方法` 了 Clojure 对多态的回答之一。多态通常意味着“获取第一个参数的类，并根据该类分发方法”。Clojure 的多方法允许你选择所有参数中的任何函数并基于此进行分发。\n\
  \n第 9 章，`底层的 Java 交互` 展示了如何从 Clojure 调用 Java，以及从 Java 调用 Clojure。你将看到如何直接操作底层以获得\
  \ Java 级的性能。\n\n最后，第 10 章，`构建应用程序` 提供了一个完整的 Clojure 工作流视图。你将从零开始构建一个应用程序，通过解决问题的各个部分，并思考简单性与质量。\n\
  \n附录 1，`编辑器支持` 列出了 Clojure 的编辑器支持选项，并提供了每个选项设置说明的链接。\n\n## 如何阅读本书\n\n所有读者都应该按顺序阅读前两章。特别关注第\
  \ 1.1 节`为什么选择 Clojure`，该节概述了 Clojure 的优势。\n\n不断进行实验。Clojure 提供了一个交互式环境，你可以在其中获得时反馈；更多信息请参见`使用\
  \ REPL`。\n\n读完前两章后，可以随意跳读。但在阅读第 5 章`状态`之前，请先阅读第 3 章`用序列统一数据`。这些章节将引导你从 Clojure 的不可变数据结构转向编写正确并发程序的强大模型。\n\
  \n在后面的章节中转向更长的代码示例时，请确保使用提供 Clojure 缩进支持的编辑器。附录 1`编辑器支持`将引导你查看常用的编辑器选项。如果可以，尝试使用支持括号平衡的编辑器，例如\
  \ Emacs 的 paredit 模式或 eclipse 的 CounterClockWise 插件。在你学习用 Clojure 编程时，这项功能将会有巨大的帮助。\n\
  \n### 给函数式程序员\n\n*   Clojure 处理函数式编程（FP）的方法在学术纯洁性和当前代 JVM 的执行现实之间取得了平衡。请仔细阅读第 4\
  \ 章`函数式编程`。\n*   第 5 章`状态` 提供了处理状态的方法。\n\n### 给 Java/C# 程序员\n\n*   仔细阅读第 2 章`探索\
  \ Clojure`。\n*   第 7 章`宏` 对其他语言来说非常异类。\n\n### 给 Lisp 程序员\n\n*   第 7 章`宏` 展示了 Lisp\
  \ 的标志性特性。\n*   Clojure 的并发模型提供了提供了处理副作用的方法。\n\n### 给 Perl/Ruby 程序员\n\n*   第 9 章`底层的\
  \ Java 交互` 直接操作底层以获得 Java 级的性能。\n\n## 符号约定\n\n本书使用了以下符号约定。\n\n字面量代码使用以下字体：\n\n```\n\
