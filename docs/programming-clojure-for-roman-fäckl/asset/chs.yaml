  \ |\n\n\n# 第 1 章：入门\n\n许多因素促成了 Clojure 的快速兴起。快速在 Web 搜索可能会告诉你 Clojure：\n\n* 是一种函数式语言，\n\
  * 是一个用于 JVM 的 Lisp，\n* 具有处理并发的特殊特性。\n\n所有这些点都非常重要，但没有哪一个是理解“用 Clojure 思考”的关键。在我们看来，有两个核心概念驱动了\
  \ Clojure 的其他一切：简单性与强大性。\n\n简单性在软件领域有多种含义，但我们指的定义是原始且最佳的一个：如果一个事物不是复合的，那么它就是简单的。简单的组件允许系统执行设计者的意图，而不会执行其他与当前任务无关的事情。根据我们的经验，无关的复杂性很快就会变成危险的复杂性。\n\
  \n强大有很多含义。我们在这里关心的是完成我们想要承担的任务的充分性。要让一个程序员感到强大，你需要构建在一个本身强大且广泛部署的基底之上，例如 JVM。然后，你的工具必须赋予你对该力量的完全、无限制的访问。对于必须充分利用其平台的项目来说，强大往往是一项门槛要求。\n\
  \n作为程序员，我们花费了多年容忍那些巴洛克般复杂的工具，而这些工具是获取所需能力的唯一途径。为了对编程模型进行理性的简化而接受了强大性的降低，某些权衡是根本性的，但强大与简单并非如此。Clojure\
  \ 展示了强大与简单是可以并并存的。\n\n## 1.1 为什么选择 Clojure？\n\nClojure 的所有独特特性都是为了提供简单性、强大性或两者。这里是一些例子：\n\
  \n* 函数式编程是简单的，因为它将计算与状态隔离开。优点：函数式程序更容易理解、编写、测试、优化和并行化。\n* Clojure 的 Java 交互形式是强大的，让你能直接访问\
  \ Java 语义。优点：你可以获得与 Java 相同的性能。最重要的是，你不需要为了额外的能力而“降级”。\n* Lisp 在两个关键方面是简单的：它将读取与评估分离，语言语法由少数部分组成。\n\
  * Lisp 同样强大，提供了宏系统。\n* Clojure 的时间模型是简单的，将值与状态分离。\n* Protocol（协议）是简单的，将多态与派生分离。\n\
  \n这个特性列表是本书后续内容的路线图，不必担心遵循这里的每一个细节。让我们通过构建一个小应用程序来观察这些特性的运行。在此过程中，你将学习如何加载和执行稍后使用的示例。\n\
  \n### Clojure 是优雅的\n\nClojure 是高信号、低噪声的。结果是，Clojure 程序很短。短的程序构建、部署和维护成本更低。这在程序简洁而非晦涩时尤为如此。例如，请考虑以下\
  \ Java 代码：\n\n```java\npublic class StringUtils {\n    public static boolean isBlank(String\
  \ str) {\n        int strLen;\n        if (str == null || (strLen = str.length())\
  \ == 0) {\n            return true;\n        }\n        for (int i = 0; i < strLen;\
  \ i++) {\n            if ((Character.isWhitespace(str.charAt(i)) == false)) {\n\
  \                return false;\n            }\n        }\n        return true;\n\
  \    }\n}\n```\n\n`isBlank` 方法检查字符串是否为空：空或仅由空白字符组成。这里是 Clojure 中类似的实现：\n\n```clojure\n\
  (defn blank? [str]\n  (every? #(Character/isWhitespace %) str))\n```\n\n\n\n\nClojure\
  \ 版本更短。但更重要的是，它更简单：它没有变量、没有可变状态，也没有分支。这得益于高阶函数。高阶函数是指接受函数作为参数并/或返回函数作为结果的。`every?`\
  \ 函数接受函数和一个集合作为参数，如果该函数对集合中的每个项目都返回 `true`，则它返回 `true`。\n\n由于 Clojure 版本没有分支，它更容易阅读和测试。这些优势在大型程序中会被放大。此外，尽管代码非常简洁，但它仍然具有可读性。事实上，Clojure\
  \ 程序读起来就像是对“空白”的定义：如果一个字符串中的每个字符都是空白空白符，那么它就是空白。这比 Commons 方法好得多，后者将空白的定义隐藏在了循环和\
  \ `if` 语句的实现细节之后。\n\n此外，考虑在 Java 中定义一个简单的 `Person` 类：\n\n```java\npublic class Person\
  \ {\n    private String firstName;\n    private String lastName;\n\n    public Person(String\
  \ firstName, String lastName) {\n        this.firstName = firstName;\n        this.lastName\
  \ = lastName;\n    }\n\n    public String getFirstName() {\n        return firstName;\n\
  \    }\n\n    public void setFirstName(String firstName) {\n        this.firstName\
  \ = firstName;\n    }\n\n    public String getLastName() {\n        return lastName;\n\
  \    }\n\n    public void setLastName(String lastName) {\n        this.lastName\
  \ = lastName;\n    }\n}\n```\n\n在 Clojure 中，你只需要一行就可以定义 `Person`：\n\n```clojure\n\
  (defrecord Person [first-name last-name])\n```\n\n并像这样与记录进行操作：\n\n```clojure\n(def\
  \ foo (->Person \"Aaron\" \"Bedra\"))\n-> #'user/foo\nfoo\n-> #:user.Person{:first-name\
  \ \"Aaron\", :last-name \"Bedra\"}\n```\n\n`defrecord` 和相关函数将在第 6.3 节 Protocols\
  \ 中介绍。\n\n除了长度短了一个数量级之外，Clojure 的方法不同之处在于 Clojure 的 `Person` 是不可变的。不可变数据结构天然是线程安全的，而且当使用\
  \ Clojure 的引用（references）、代理（agents）和原子（atoms）时，可以分层实现更新能力，这些将在第 5 章 State 中介绍。由于记录是不可变的，Clojure\
  \ 还自动提供了 `hashCode` 和 `equals` 的正确实现。\n\nClojure 内置了许多优雅的设计，但如果你发现缺少某些功能，得益于 Lisp\
  \ 的强大，你可以自己添加。\n\n### Clojure 是重塑 Lisp\n\nClojure 是一种 Lisp。几十年来，Lisp 的支持者一直指出 Lisp\
  \ 相比于……其他任何东西的优势。同时，Lisp 的世界统治计划似乎正在缓慢进行。\n\n与其他任何 Lisp 一样，Clojure 面临着两个挑战：\n\n\
  *   Clojure 必须通过说服 Lisp 程序员承认 Clojure 纳了 Lisp 的关键部分，从而作为一个 Lisp 成功。\n*   同时，Clojure\
  \ 需要通过赢得更广泛程序员社区的支持，在以往其他 Lisp 失败的地方取得成功。\n\nClojure 通过提供 Lisp 的元编程能力，同时接受一组语法增强，这些增强使得\
  \ Clojure 对非 Lisp 程序员更友好，从而应对这些挑战。\n\n#### 为什么选择 Lisp？\n\nLisp 拥有极小的语言核心、几乎没有语法，以及强大的宏机制。通过这些特性，你可以弯曲\
  \ Lisp 来满足你的设计，而不是反之。相比之下，考虑以下 Java 代码段：\n\n```java\npublic class Person {\n   \
  \ private String firstName;\n    public String getFirstName() {\n        // 继续...\n\
  \    }\n```\n\n在这段代码中，`getFirstName` 是一个方法。方法是多态的，可以为了满足你的需求而改变。但与其他与其他词的解释是由语言固定的。有时你真的需要改变这些词的含义。例如，你可能会执行以下操作：\n\
  \n*   重新定义 `private`，意味着“对于生产代码是私有的，但对于序列化和单元测试是公开的”。\n*   重新定义 `class` 为私有字段自动生成\
  \ getter 和 setter，除非另有指示。\n*   创建一个 `class` 的子类，为生命周期事件提供回调钩子。例如，一个感知生命周期的类可以在该类的实例被创建时触发事件。\n\
  \n我们见过需要所有这些功能的程序。如果没有它们，程序员就不得不采用重复的变通方法。\n\n在大多数语言中，你得请求语言实现者添加功能。在 Clojure 中，你可以通过宏添加功能（第\
  \ 7 章 Macros）。Clojure 本身是由像 `defrecord` 这样的宏构建的：\n\n```clojure\n(defrecord Person\
  \ [arg1 arg2 arg3])\n```\n\n如果你需要不同的语义，可以编写自己的 `defrecord` 宏，并如下使用：\n\n```clojure\n\
  (defrecord Person [arg1 arg2 arg3]) :allow-nulls false\n```\n\n这种从语言内部重新编程语言的能力是\
  \ Lisp 的独特优势。你将以各种方式看到这一想法的各个方面：\n\n*   Lisp 是同态的（homoiconic）。9 解释了为什么这是如此强大。\n\n\
  Lisp 语法还消除了运算符优先级和结合性规则。你在书中任何地方都找不到运算符优先级或结合性的表格。通过全括号表达式，不存在任何可能的歧义。\n\nLisp 简单、规则语法的缺点（至少对于初学者来说）是它对括号以及对列表作为核心数据类型的痴迷。Clojure\
  \ 提供了一组有趣的特性组合，使得 Lisp 对非 Lisp 程序员更容易上手。\n\n#### 括号更少的 Lisp\n\n对于从其他 Lisp 转过来的程序员来说，Clojure\
  \ 提供了显著优势：\n\n*   Clojure 将 Lisp 的物理列表泛化为名为序列（sequence）的抽象。这保留了列表的力量，同时将这种力量扩展到各种数据结构。\n\
  *   Clojure 对 JVM 的依赖提供了一个标准库和一个影响广泛的部署平台。\n*   Clojure 处理符号解析和语法引用的方法使得编写许多宏变得更容易。\n\
  \n许多 Clojure 程序员对 Lisp 来说是全新的，他们可能听过关于那些括号的坏话。Clojure 保留了括号（以及 Lisp 的力量！），但在以下几个方面改进了传统的\
  \ Lisp 语法：\n\n*   Clojure 为除了列表之外的各种数据结构提供了方便的字面量语法：正则表达式、映射、集合、向量和元数据。这些特性使得 Clojure\
  \ 代码看起来不像大多数 Lisp 那么“列表化”。例如，函数参数指定在向量 `[]` 中，而不是列表 `()` 中。\n\n\n\n\n\n| | `defn\
  \ hello-world [username]` |\n| | `(println (format \"Hello, %s\" username))` |\n\
  \n向量使得参数列表在视觉上跳跃出来，让 Clojure 函数定义变得易于阅读。\n\n*   在 Clojure 中，与大多数 Lisp 不同，逗号是空白字符。\n\
  \n| | `; make vectors look like arrays in other languages` |\n| | `[1, 2, 3, 4]`\
  \ |\n| | `-> [1 2 3 4]` |\n\n*   惯道的 Clojure 不会进行不括号嵌套。考虑存在于 Common Lisp 和 Clojure\
  \ 中的 `cond` 宏。`cond` 评估一组测试/结果对，并返回第一个测试形式为真的结果。每个测试/结果对都用括号分组，如下所示：\n\n```lisp\n\
  ; Common Lisp cond\n(cond (= x 10) \"equal\") ((> x 10) \"more\"))\n```\n\nClojure\
  \ 避免了额外的括号：\n\n```clojure\n; Clojure cond\n(cond (= x 10) \"equal\" (> x 10) \"\
  more\")\n```\n\n这是一种审美上的决策，两种方法都有它们的支持者。重要的是，Clojure 能够在不损害 Lisp 威力的情况下，利用机会表现得不那么“Lisp\
  \ 化”。\n\nClojure 是一门优秀的 Lisp，对于 Lisp 专家和 Lisp 初学者都是如此。\n\n### Clojure 是一种函数式语言\n\
  \nClojure 是一种函数式语言，但不是像 Haskell 那样的纯函数式语言。函数式语言具有以下属性：\n\n*   函数是一等对象。也就是说，函数可以在运行时创建、传递、返回，并通常像任何其他数据类型一样使用。\n\
  *   数据是不可变的。\n*   函数是纯的；也就是说，它们没有副作用。\n\n对于许多任务，函数式程序更容易理解、更不容易出错，并且更容易复用。例如，以下短程序会在作品数据库中搜索每个写过名为“Requiem”作品的作曲家：\n\
  \n```clj\n(for [c compositions :when (= \"Requiem\" (:name c))] (:composer c))\n\
  -> (\"W. A. Mozart\" \"Giuseppe Verdi\")\n```\n\n`for` 名字并没有引入循环，而是引入了列表推导式。将前面的代码读为：“对于\
  \ `compositions` 中的每个 `c`，如果 `c` 的名称为 'Requiem'，返回 `c` 的作曲家。”列表推导式在[转换序列] 中有更完整的介绍。\n\
  \n这个示例具有四个良好的属性：\n\n*   它非常简单；没有循环、变量或可变状态。\n*   它是线程安全的；不需要锁。\n*   它是可并行的；你可以将单个步骤分配给多个线程，而无需更改每个步骤的代码。\n\
  *   它是通用的；`compositions` 可以是一个普通的集合、XML 或数据库结果集。\n\n将函数式程序与命令式程序对比，后者通过显式语句改变程序状态。大多数面向对象的程序以命令风格编写，并不具备前面列出的任何优点：它们异常复杂、不是线程安全的、不可并行，且难以泛化。（要对函数式和命令式风格进行对比比较，请跳转到第\
  \ 2.7 节 [我的 for 循环在哪里?]）。\n\n人们早就知道函数式语言的优势。然而，像 Haskell 这样的纯函数式语言并没有统治世界，因为开发者发现并不是所有内容都能轻松地融入纯函数式的视图中。\n\
  \nClojure 现在比过去函数式语言吸引更多关注的四个原因：\n\n*   函数式编程比以往任何时候都更加迫切。大规模多核硬件触手可尺，函数式语言提供了一种利用它的清晰方法。函数式编程在第\
  \ 4 章 [函数式编程] 中介绍。\n*   纯函数式语言在建模真正需要改变的状态时可能会很笨拙。Clojure 通过软件事务内存和 `refs`、`agents`、`atoms`\
  \ 以及动态绑定提供了一种处理可变状态的结构化机制。\n*   许多函数式语言是静态类型的。Clojure 的动态类型使其更易于上手。\n*   Clojure\
  \ 提供了一种通过软件事务内存 (STM) 处理可变状态的结构化机制，这不仅仅是锁。\n\n### Clojure 简化了并发编程\n\nClojure 对并发的支持使得编写线程安全的代码变得简单。由于数据是不可变的，因此不存在基于另一个线程导致损坏的危险。例如，以下代码创建了一个线程安全的内存数据库：\n\
  \n```clojure\n(def accounts (ref {}))\n(record Account [id balance])\n```\n\n`ref`\
  \ 函数创建了一个指向当前状态的事务保护引用。更新是轻而易事的。以下代码向数据库添加了一个新账户：\n\n```clojure\n(dosync\n (alter\
  \ accounts conj (->Account \"CLJ\" 1000)))\n```\n\n`dosync` 导致对 `accounts` 的更新在事务内部执行。这保证了线程安全，并且比锁更容易使用。有了事务，你永远不需要担心锁定哪些对象或按什么顺序。事务方法在某些使用场景下性能更好，因为（例如）读者永远不会阻塞。\n\
  \n尽管这里的示例非常简单，但这种技术是通用的，并且适用于现实问题。请参第 5 章了解更多关于 Clojure 中并发和 STM 的知识。\n\n### Clojure\
  \ 拥抱 Java 虚拟机\n\nClojure 让你清晰、简单、直接访问 Java。你可以直接调用任何 Java API：\n\n```java\n(System/getProperties)\n\
  ```\n\nClojure 为调用 Java 增加了许多语法糖。我们在这里不涉及细节（见第 2.5 节 [调用 Java]），但请注意，在下面的代码中，Clojure\
  \ 版本比 Java 版本的点更少，括号也更少：\n\n```java\n// Java\n\"hello\".getClass().getProtectionDomain()\n\
  \n; Clojure\n(.. \"hello\" getClass getProtectionDomain)\n```\n\nClojure 提供了简单的函数来实现\
  \ Java 接口和创建 Java 类的子类。此外，Clojure 函数都实现了 `Callable` 和 `Runnable`。这使得将以下匿名函数传递给 Java\
  \ `Thread` 的构造函数变得轻而易举。\n\n\n\n\n```clojure\n(.start (new Thread fn [] (println\
  \ \"Hello\" (Thread/currentThread))))\n```\n```clojure\n-> Hello #<Thread Thread[Thread-0,5,main]>\n\
  ```\n\n这里有趣的输出是 Clojure 打印 Java 实例的方式。`Thread` 是实例的类名，而 `Thread[Thread-0,5,main]`\
  \ 是实例的 `toString` 表示。\n\n（请注意，在前面的示例中，新线程将运行完毕，但它的输出可能会以某种奇怪的方式与 REPL 提示符交错。这并不是\
  \ Clojure 的问题，仅仅是因为有多个线程向输出流写入内容。）\n\n由于 Clojure 中的 Java 调用语法简洁简单，因此直接使用 Java 是符合惯用用法的，而不是将\
  \ Java 隐藏在 Lispy 风格的包装器之后。\n\n既然你已经了解了一些使用 Clojure 的原因，现在是时候开始编写一些代码了。\n\n## 1.2\
  \ Clojure 编程快速上手\n\n要运行 Clojure 和书中的代码，你需要两样东西：\n\n*   一个 Java 运行时。下载 11 并安装 Java\
  \ 5 或更高版本。Java 6 有显著的性能改进和更好的异常报告，如果可能，请选择此版本。\n*   Leiningen。12 Leiningen 是一个用于管理依赖和针对代码启动任务的工具。它也是\
  \ Clojure 领域执行工作最常用的工具。\n\n你将使用 Leiningen 安装 Clojure 以及书中示例代码的所有依赖项。如果你已经安装了 Leiningen，你应该对基础了如指。如果没有，你应该快速浏览一下\
  \ Leiningen 的 GitHub 页面 13，在那里你可以找到安装说明以及基础用法说明。不过，不必担心现在学习所有内容，因为这本书将引导你学习在家里跟随练习所需的全部命令。\n\
  \n在你阅读本书时，请使用与书中示例代码绑定的 Clojure 版本。在读完书后，你可以按照自行构建 Clojure 中的说明来构建最新版本的 Clojure。\n\
  \n有关下载示例代码的说明，请参见下载示例代码。下载示例代码后，你需要使用 Leiningen 获取依赖项。从示例代码文件夹的根目录运行以下命令：\n\n```bash\n\
  lein deps\n```\n\n### 自行构建 Clojure\n\n你可能想从源码构建 Clojure 以获取新功能和错误修复。方法如下：\n\n```bash\n\
  git clone git://github.com/clojure/clojure.git\ncd clojure\nmvn package\n```\n\n\
  示例代码会定期更新以匹配 Clojure 的当前开发主分支。检查示例代码中的 `README` 文件可以查看示例最近测试的修订版本。\n\n依赖项将被下载并放置在适当的位置。你可以通过进入放置示例代码的目录并运行\
  \ Clojure 读取求值打印循环（REPL）来测试安装。Leiningen 包含一个 REPL 启动脚本，它可以加载 Clojure 以及我们在书后面部分需要的依赖项。\n\
  \n```bash\nlein repl\n```\n\n当你成功启动 REPL 时，它应该提示你 `user=>`：\n\n```text\nClojure\n\
  user=>\n```\n\n现在你准备好编写“Hello World”了。\n\n### 使用 REPL\n\n为了查看如何使用 REPL，让我们创建几个变体“Hello\
  \ World”。首先，在 REPL 提示符处输入 `(println \"hello world\")`：\n\n```clojure\nuser=> (println\
  \ \"hello world\")\n-> hello world\n```\n\n第二行 `hello world` 就是你请求的控制输出。\n\n接下来，将你的“Hello\
  \ World”封装在一个函数中，可以通过名称称呼某人：\n\n```clojure\n(defn hello [name] (str \"Hello, \"\
  \ name))\n-> #'user/hello\n```\n\n让我们来拆解一下：\n\n*   `defn` 定义一个函数。\n*   `hello` 是函数名。\n\
  *   `hello` 接收一个参数 `name`。\n*   `str` 是一个函数调用，将任意参数列表拼接成字符串。\n*   `defn`、`hello`、`name`\
  \ 和 `str` 都是符号（symbols），即引用事物的名称。合法的符号定义在符号 中。\n\n看返回值 `#’user/hello`。前缀 `#’` 表示\
  \ `user/hello` 是 `user` 命名空间中的一个函数。这使得工作变得简单：\n\n```clojure\nuser=> (str *1 \" \"\
  \ *2)\n\"1 2\"\n```\n\n### 添加状态\n\n上一节的 `hello` 函数是纯函数；也就是说，它没有副作用。尽管如此，大多数程序都有一些共享状态，并使用不纯函数来管理这些共享状态。让我们扩展\
  \ `hello` 以跟踪过去的访问者。首先，你需要一个数据结构来跟踪访问者。集合（set）就可以解决问题：\n\n\n\n\n\n```markdown\n\
  {}\n-> #{}\n```\n\n`#{}` 是空集合的字面量。接下来，你将需要 `conj`：\n\n```markdown\n(conj coll item)\n\
  ```\n\n`conj` 是 conjoin（连接）的缩写，它构建一个添加了元素的新集合。将一个元素 `conj` 到集合中，可以看到创建了一个新集合：\n\n\
  ```markdown\n(conj #{} \"Stu\")\n-> #{\"Stu\"}\n```\n\n现在你已经可以构建新的集合了，但你需要某种方法来跟踪当前的访问者集合。Clojure\
  \ 提供了几种引用类型（refs）来实现这一目的。最基本的引用类型是 atom：\n\n```markdown\n(atom initial-state)\n\
  ```\n\n要为你的 atom 命名，你可以使用 `def`：\n\n```markdown\n(def symbol initial-value?)\n```\n\
  \n`def` 类似于 `defn` 但更通用。`def` 可以定义函数或数据。使用 `atom` 创建一个 atom，并使用 `def` 将 atom 绑定到名称\
  \ `visitors`：\n\n```markdown\n(def visitors (atom #{}))\n-> #'user/visitors\n```\n\
  \n要更新引用，你必须使用像 `swap!` 这样的函数：\n\n```markdown\n(swap! r update-fn & args)\n```\n\n\
  `swap!` 将 `update-fn` 应用于引用 `r`，必要时带有可选 `args`。尝试使用 `conj` 作为更新函数将一个访问者 `swap!`\
  \ 进入 `visitors`：\n\n```markdown\n(swap! visitors conj \"Stu\")\n-> #{\"Stu\"}\n\
  ```\n\n`atom` 是 Clojure 中几种引用类型之一。选择合适的引用类型需要小心（在第 5 章 State 中进行了讨论）。\n\n在任何时候，你都可以使用\
  \ `deref` 或更短的 `@` 查看引用的内部内容：\n\n```markdown\n(deref visitors)\n-> #{\"Stu\"}\n\n\
  @visitors\n-> #{\"Stu\"}\n```\n\n现在你已经准备好构建新的、更复杂的 `hello` 版本了：\n\n`src/examples/introduction.clj`\n\
  \n```markdown\n(defn hello\n\"向 *out* 写入 hello 消息。通过用户名称呼。\n知道你以前是否来过这里。\"\n[username]\n\
  \ (swap! visitors conj username)\n (str \"Hello, \" username))\n```\n\n接下来，检查访问者是否在内存中被正确跟踪：\n\
  \n```markdown\n(hello \"Rich\")\n-> \"Hello, Rich\"\n\n@visitors\n-> #{\"Aaron\"\
  \ \"Stu\" \"Rich\"}\n```\n\n极有可能，你的访问者列表与这里显示的不同。这就是状态（state）的问题！你的结果会根据事情发生的时间而异。你可以根据直接的局部知识对函数进行推理。而对状态的推理需要对历史有完全理解。\n\
  \n尽可能避免状态。但当你需要时，通过使用像 atoms 这样的引用使其变得合理且易于管理。Atom（以及所有其他 Clojure 引用类型）对于多线程和处理器都是安全的。更好的是，这种安全性不需要任何锁（locks），而锁是出了名的难以使用。\n\
  \n到此为止，你应该已经习惯在 REPL 中输入小段代码了。较大的代码单元并没有太大区别；你也可以从 REPL 加载并运行 Clojure 库。让我们下一步探索这一点。\n\
  \n## 1.3 探索 Clojure 库\n\nClojure 代码被封装在库中。每个 Clojure 库都属于一个命名空间（namespace），它类似于\
  \ Java 包。你可以使用 `require` 加载 Clojure 库：\n\n```markdown\n(require quoted-namespace-symbol)\n\
  ```\n\n当你引入一个名为 `clojure.java.io` 的库时，Clojure 在 `CLASSPATH` 上寻找名为 `clojure/java/io.clj`\
  \ 的文件。尝试一下：\n\n```markdown\nuser=> (require 'clojure.java.io)\n-> nil\n```\n\n前面的单引号（`’）是必要的，它对库名进行引用（引用在第\
  \ 2.2 节 Reader Macros 中介绍）。返回的 `nil` 表示成功。顺便测试一下是否可以加载本章的示例代码 `examples.introduction`：\n\
  \n```markdown\nuser=> (require 'examples.introduction)\n-> nil\n```\n\n`examples.introduction`\
  \ 库包含了斐波那契数的实现，这是函数式语言中传统的“Hello World”。我们将在第 4.2 节 如何变得懒惰 中更详细探索斐波那契数。现在，只需确保你可以执行示例\
  \ `fibs` 即可。在 REPL 中输入以下代码获取前十个数字：\n\n```markdown\n(take 10 examples.introduction/fibs)\n\
  -> (0 1 2 3 5 8 13 34)\n```\n\n如果你看到了这里列出的前十个数字，说明你已成功安装了书籍示例。书籍示例都经过了单元测试，位于 `examples/test`\
  \ 目录。示例本身的测试在书中没有显式介绍，但你可能会发现它们很有参考价值。你可以使用 `lein test` 运行单元测试。\n\n### Require and\
  \ Use\n\n当你 `require` 一个 Clojure 库时，必须使用带命名空间限定的名称引用库中的项。你不能说 `fibs`，而必须说 `examples.introduction/fibs`。确保启动一个新的\
  \ REPL 并尝试一下：\n\n```markdown\n(require 'examples.introduction)\n-> nil\n\n(take\
  \ 10 examples.introduction/fibs)\n-> (0 1 2 3 5 8 13 34)\n```\n\n完全限定名可以很快获取。你可以\
  \ `refer` 一个命名空间，在当前命名空间中为它的所有名称创建映射：\n\n```markdown\n(refer quoted-namespace-symbol)\n\
  ```\n\n对 `examples.introduction` 调用 `refer`，并验证你可以直接调用 `fibs`：\n\n```markdown\n\
  (refer 'examples.introduction)\n-> nil\n\n(take 10 fibs)\n-> (0 1 2 3 5 8 13 34)\n\
  ```\n\n为了方便起见，`use` 函数在一个步骤内完成对库的 `require` 和 `refer`：\n\n```markdown\n(use quoted-namespace-symbol)\n\
  ```\n\n从新的 REPL 中，你应该能够执行以下操作：\n\n```markdown\n(use 'examples.introduction)\n->\
  \ nil\n\n(take 10 fibs)\n-> (0 1 2 3 5 8 13 34)\n```\n\n在你阅读本书时，可以带有 `:reload` 标记调用\
  \ `require` 或 `use` 来强制库重载：\n\n```markdown\n(use :reload 'examples.introduction)\n\
  -> nil\n```\n\n`:reload` 标记在你进行更改并希望在不重启 REPL 的情况下看到结果时非常。\n\n### 查找文档\n\n通常你可以在\
  \ REPL 直接找到需要的文档。最基本的辅助函数是 `doc`：\n\n```markdown\n(doc name)\n```\n\n使用 `doc` 打印\
  \ `str` 的文档：\n\n```markdown\nuser=> (doc str)\n-------------------------\nclojure.core/str\n\
  ([] [x] [x & ys])\n无参数时返回空字符串。有一个参数 x 时返回 x.toString()。(str nil) 返回空字符串。有多个参数时，返回这些参数\
  \ str 值的拼接。\n```\n\n`doc` 输出的第一行包含函数的完全限定名。下一行包含直接从代码生成的可能参数列表。常见的参数名称及其用途在 参数命名约定\
  \ 中进行了解释。最后，剩余行包含函数的文档字符串（如果函数定义中包含了的话）。\n\n### 参数命名约定\n\n`reduce` 和 `areduce` 的文档字符串显示了几个简短的参数名称。以下是一些参数名称及其通常用法：\n\
  \n| 参数 | 用法 |\n| --- | --- |\n| a | 一个 Java 数组 |\n| agt | 一个 agent |\n| coll | 一个集合\
  \ |\n| expr | 一个表达式 |\n| f | 一个函数 |\n| idx | 索引 |\n| r | 一个 ref |\n| v | 一个向量 |\n\
  | val | 一个值 |\n```\n\n\n\n\n\n这些名称可能看起来有些简短，但它们有充分的理由：“好的名称”通常被 Clojure 函数占用了！命名与函数名冲突的参数是合法的，但被认为是不良风格：参数会遮蔽（shadow）函数，在参数的作用域内，该函数将不可用。因此，不要将你的\
  \ refs 命名为 `ref`，将 agents 命名为 `agent` 或将 counts 命名为 `count`。这些名称指的是函数。\n\n你可以通过在函数名后紧跟字符串来为自己的函数添加文档字符串：\n\
  \n| [src/examples/introduction.clj](http://media.pragprog.com/titles/shcloj2/code/src/examples/introduction.clj)\
  \ |\n| | |\n| | `(defn hello` |\n| | `\"Writes hello message to out. Calls you by\
  \ username\"` |\n| | `[username]` |\n| | `(println (str \"Hello, \" username))`\
  \ |\n\n有时你并不知道想要查找文档的确切名称。`find-doc` 函数会搜索任何 `doc` 输出匹配你传递的正则表达式或字符串的项：\n\n| | |\n\
  | | `(find-doc s)` |\n\n使用 `find-doc` 来探索 Clojure 如何进行还原（reduce）：\n\n| user=> (find-doc\
  \ \"reduce\") |\n| ------------------------- |\n| `clojure/areduce` |\n| `([a idx\
  \ ret init expr])` |\n| `Macro` |\n| `.. . details elided .. .` |\n| -------------------------\
  \ |\n| `clojure/reduce` |\n| `([f coll] [f val coll])` |\n| `.. . details elided\
  \ .. .` |\n\n`reduce` 用于还原 Clojure 集合，并在转换序列 中有所介绍。`areduce` 用于与 Java 数组交互，并在使用\
  \ Java 集合 中介绍。\n\nClojure 的大部分是用 Clojure 编写的，阅读源代码是有益的。你可以使用 `repl` 库查看 Clojure\
  \ 函数的 `source`。\n\n```(clojure.repl/source a-symbol)\n```\n\n尝试查看简单函数 `identity`\
  \ 的源码：\n\n```cl\n(use 'clojure.repl)\n(source identity)\n```\n\n```\n-> (defn identity\n\
  \ \"Returns its argument.\"\n {:added \"1.0\"\n :static true}\n [x] x)\n```\n\n\
  当然，你也可以使用 Java 的反射 API。你可以使用 `class`、`ancestors` 和 `instance?` 等方法对底层的 Java 对象模型进行反射，并告诉我们例如，Clojure\
  \ 的集合也是 Java 集合：\n\n```\n(ancestors (class [1 2 3]))\n```\n\n```\n-> #{clojure.lang.ILookup\
  \ clojure.lang.Sequential\n java.lang.Object clojure.lang.Indexed\n java.lang.Iterable\
  \ clojure.lang.IObj\n clojure.lang.IPersistentCollection\n clojure.lang.IPersistentVector\
  \ clojure.lang.AFn\n java.lang.Comparable java.util.RandomAccess\n clojure.lang.Associative\n\
  \ clojure.lang.APersistentVector clojure.lang.Counted\n clojure.lang.Reversible\
  \ clojure.lang.IPersistentStack\n java.util.List clojure.lang.IEditableCollection\n\
  \ clojure.lang.IFn clojure.lang.Seqable\n java.util.Collection java.util.concurrent.Callable\n\
  \ clojure.lang.IMeta java.io.Serializable java.lang.Runnable}\n```\n\nClojure 完整的\
  \ API 文档在线位于 [`clojure.github.com/clojure`](http://clojure.github.com/clojure)。右侧边栏链接到所有函数和宏，左侧边栏链接到关于\
  \ Clojure 特性的概览文章集。\n\n## 1.4 总结\n\n你刚刚完成了一次 Clojure 的旋风之旅。你见到了 Clojure 富有表现力的语法，学习了\
  \ Clojure 处理 Lisp 的方法，并看到了在 Clojure 中调用 Java 代码是多么简单。你已经在自己的环境中运行了 Clojure，并编写了短程序。现在是时候探索整个语言了。\n\
