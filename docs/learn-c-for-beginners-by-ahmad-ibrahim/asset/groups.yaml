    \n### 在本地运行 Hello World：\n\n在 Mac 上，它被称为终端（Terminal）。在 Windows 上，它被称为命令提示符（Command\
    \ Prompt）。\n\n![](img/a6303f820ae398dbe366f0ffbaec1dcd_27_0.png)\n![](img/a6303f820ae398dbe366f0ffbaec1dcd_27_1.png)\n\
    \n## 2) 变量\n\n### 2.1 变量简介\n\n“Hello World!”程序只是向屏幕输出。它不读取任何内容，不进行任何计算，也不允许用户输入。这不好玩！\n\
    \n真正的程序往往根据用户提供的某些输入来产生结果，而不是一直输出相同的内容。\n\n为了从键盘读取内容，我们首先需要在计算机内存中找一个地方存储数据。这就是变量大显身场。\n\
    \n变量仅仅是计算机内存中某部分的名称，该部分被用来存储、检索和使用数据。\n\n在本节课程中，我们将学习一些基础的数据类型：\n\n- int：整数\n\
    - double：双浮点数\n- char：单个字符\n- string：字符序列\n- bool：布尔值（真/假）\n\n每个变量都有一个类型，代表你可以在其中存储的信息类型。它告诉编译器为该变量分配多少内存，并定义了你可以对变量做什么。\n\
    \n"
