    +   • Each has a different number of parameters.


    Overloading enables you to change the way a function behaves depending on what
    is passed in as an argument:


    ```

    void print_cat_ears(char len) {

    std::cout << """ << len << len << """ << "\n";

    std::cout << """ << len << len << len << """ << "\n";

    }


    void print_cat_ears(int num) {

    std::cout << """ << num << num << num << """ << "\n";

    std::cout << num << num << num << num << num << num << """ << "\n";

    }

