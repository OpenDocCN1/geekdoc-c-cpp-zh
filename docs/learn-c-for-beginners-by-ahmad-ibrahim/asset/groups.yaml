  - "[PAGE 99]\n\n2. Aliases cannot be changed to alias something else.\n\n# # 14.3\
    \ Pass-By-Reference\n\nSo, what's a good use case for references? Let's take a\
    \ look.\n\nPreviously, when we passed parameters to a function, we used normal\
    \ variables and that's known as *pass-by-value*. But because the variables passed\
    \ into the function are out of scope, we can't modify the value of the arguments.\n\
    \n*Pass-by-reference* refers to passing parameters to a function using references.\
    \ When called, the function can modify the value of the arguments by using the\
    \ reference passed in.\n\nThis allows us to:\n\n+   - Modify the value of the\
    \ function arguments.\n- Avoid making copies of a variable/object for performance\
    \ reasons.\n\nThe following code shows an example of a pass-by-reference. The\
    \ reference parameters are initialized with the actual arguments when the function\
    \ is called\n\n```\nvoid swap_num(int &i, int &j) {\n    int temp = i;\n    i\
    \ = j;\n    j = temp;\n}\n\nint main() {\n    int a = 100;\n    int b = 200;\n\
    \n    swap_num(a, b);\n\n    std::cout << \"A is \" << a << \"\\n\";\n    std::cout\
    \ << \"B is \" << b << \"\\n\";\n}\n```"
  - "[PAGE 100]\n\nNotice that the int &i and int &j are the parameters of the function\
    \ swap_num().\n\nWhen swap_num() is called, the values of the variables a and\
    \ b will be modified because they are passed by reference. The output will be:\n\
    \n| A is 200 |\n| B is 100 |\n\nSuppose we didn't pass-by-reference here and have\
    \ the parameters simply int i and int j in the swap_num() function, then i and\
    \ j would swap, but a and b would be modified.\n\nAnd the output will then be:\n\
    \n| A is 100 |\n| B is 200 |\n\nTo reiterate, using references as parameters allows\
    \ us to modify the arguments' values. This can be very useful in a lot of cases.\n\
    \n# 14.4) Pass-By-Reference with Const\n\nRemember const? The const keywords tell\
