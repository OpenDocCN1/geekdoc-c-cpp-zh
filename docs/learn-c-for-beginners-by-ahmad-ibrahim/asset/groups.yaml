  mdcn: "\n2. 别名不能更改为其他别名。\n\n## 14.3 引用传递\n\n那么，引用的良好用例是什么呢？让我们来看一下。\n\n之前，当我们向函数传递参数时，我们使用普通变量，这被称为*值传递*。但由于传入函数的变量超出了作用域，我们无法修改参数的值。\n\
    \n*引用传递*（Pass-by-reference）是指使用引用将参数传递给函数。当调用函数时，函数可以使用传入的引用来修改参数的值。\n\n这允许我们：\n\
    \n- 修改函数参数的值。\n- 出于性能考虑，避免创建变量/对象的拷贝。\n\n下面的代码展示了引用传递的示例。在调用函数时，引用参数用实际参数进行初始化：\n\
    \n```\nvoid swap_num(int &i, int &j) {\n    int temp = i;\n    i = j;\n    j =\
    \ temp;\n}\n\nint main() {\n    int a = 100;\n    int b = 200;\n\n    swap_num(a,\
    \ b);\n\n    std::cout << \"A is \" << a << \"\\n\";\n    std::cout << \"B is\
    \ \" << b << \"\\n\";\n}\n```\n\n注意 `int &i` 和 `int &j` 是函数 `swap_num()` 的参数。\n\
    \n当调用 `swap_num()` 时，变量 `a` 和 `b` 的值会被修改，因为它们是通过引用传递的。输出将是：\n\n| A is 200 |\n\
    | B is 100 |\n\n假设我们在这里没有使用引用传递，而是在 `swap_num()` 函数中简单使用参数 `int i` 和 `int j`，那么\
    \ `i` 和 `j` 会交换，但 `a` 和 `b` 不会被修改。\n\n那么输出将是：\n\n| A is 100 |\n| B is 200 |\n\n\
    重申一下，使用引用作为参数允许我们修改参数的值。这在很多情况下非常有用。\n\n## 14.4 带 const 的引用传递\n\n记得 `const` 吗？`const`\
    \ 关键字告诉编译器我们不会改变某些内容。\n\n例如，在下面的代码中，我们告诉编译器 `double` 类型变量 `pi` 在整个程序过程中将保持为 3.14：\n\
    \n```\ndouble const pi = 3.14;\n```\n\n如果我们尝试更改 `pi`，编译器将抛出错误。\n\n有时，我们在函数参数中使用\
    \ `const`；这是当我们确定想要写一个函数，其中参数在函数内部不会改变时使用的。这里有一个例子：\n\n```\nint triple(int const\
    \ i) {\n  return i * 3;\n}\n```\n\n在这个示例中，我们没有修改 `i`。如果在函数 `triple()` 内部更改了 `i`\
    \ 的值，会导致编译错误。\n\n为了给不修改参数值的函数节省计算开销，我们可以更进一步，使用 `const` 引用：\n\n```cpp\nint triple(int\
    \ const &i) {\n    return i * 3;\n}\n```\n\n这将确保相同的结果：参数不会被改变。然而，将 `i` 设为参数的引用可以节省创建参数拷贝的计算开销。\n\
    \n## 14.5 指针\n\n在 C++ 中，指针与其他变量基本相同，可以存储一段数据。与存储值（如 `int`、`double`、`char`）的普通变量不同，指针存储的是内存地址。\n\
    \n虽然引用是起源于 C++ 的较新机制，但我们建议尽可能避免指针；通常引用就能解决问题。但在现实中你会看到很多指针，特别是在旧项目中，它们的使用方式与引用非常相似。\n\
    \n指针在使用之前必须声明，就像普通变量一样。它们在语法上通过 `*` 来区分，因此 `int` 表示“指向 int 的指针”，`double` 表示“指向\
    \ double 的指针”。\n\n```\nint* number;\ndouble* decimal;\nchar* character;\n```\n\
    \n假设我们有一个变量 `gum`：\n\n```\nint gum = 8;\n```\n\n我们可以通过以下方式创建它的指针：\n\n```\nint*\
    \ ptr = &gum;\n```\n\n- `int*` 使成为指针而不是普通变量。\n- `ptr` 是指针名。\n- `&gum` 是变量的地址。\n\
    \n现在 `ptr` 拥有 `gum` 的内存地址。注意：`*` 周围的空格并不重要，但最佳实践是将其放在数据类型之后。\n\n```\nint* number;\n\
    int *number;\nint * number;\n```\n\n## 14.6 解引用\n\n现在我们学习了指针是什么以及如何创建它，但有一种方法可以获取变量所指向的值。星号\
    \ `*` 是跟在指针变量之前的解引用运算符。\n\n```\nint blah = *ptr;\n```\n\n`*` 符号的双重含义初看起来很复杂，所以请记住：\n\
    \n- 当 `*` 用于声明时，它是创建一个指针。\n- 当 `*` 不用于声明时，它是解引用运算符。\n\n## 14.7 空指针\n\n当我们像这样声明指针时，它的内容没有被初始化，这是危险的！但如果我们不知道它指向哪里，可以使用空指针。\n\
    \n- `nullptr` 是 C++11 引入的新关键字，表示空指针。\n- 我们可以这样使用 `nullptr`：\n\n```\nint ptr =\
    \ nullptr;\n```\n\n注意：在旧的 C/C++ 中为此使用 `NULL`。`nullptr` 是 `NULL` 的现代替代品。\n\n##\
    \ 复习\n\n恭喜！你正式完成了。\n\n在本节中，你学习了：\n\n- 引用\n- 引用传递\n- 带 `const` 的引用传递\n- 内存地址以及如何访问它们\n\
    - 指针\n- 指针解引用\n- `nullptr`\n\n```\n// 引用\nint &reference = original;\n\n// 指针\n\
    int* pointer = &original;\n```\n\n## 16 内存分配\n\n到目前看到的每个变量都是局部变量。局部变量在函数结束时超出作用域。但有时这不是我们想要的。这就是堆（free\
    \ store）的作用。堆是长生存变量的内存。\n\n### 16.1 手动内存管理\n\n为了避免内存浪费，你可以在运行时使用 C++ 中的 `new`\
    \ 和 `delete` 运算符动态分配任何内存。\n\n```\nint main() {\n  // 内存分配\n  ptr = new int[num];\n\
    \  ...\n  // 释放内存\n  delete ptr;\n}\n```\n\n`new` 运算符：\n\n```\nptr = new int[num];\n\
    ```\n\n`delete` 运算符：\n\n```\ndelete ptr;\n```\n\n如果你用 `new` 创建了某些东西，最终必须删除它。如果东西没有被删除，会导致内存泄漏。\n\
    \n### 16.2 三规则\n\n三规则是 C++ 中的一条法则，它称如果类定义了以下任意一个特殊函数，它就应该定义所有三个：\n\n- 析构函数\n-\
    \ 拷贝构造函数\n- 赋值运算符\n\n### 16.3 五规则\n\n随着 C++11 的出现了一个新规则：五规则。它在三规则的基础上增加了两个特殊函数：\n\
    \n- 析构函数\n- 拷贝构造函数\n- 赋值运算符\n- 移动构造函数\n- 移动赋值运算符\n\n可以看出，手动内存管理是困难且过时的。与其使用 `new`\
    \ 和 `delete`，标准库中的某些东西会让生活变得简单得多。\n\n### 16.4 标准库智能指针\n\n智能指针是 C++ 在 20 世纪 90\
    \ 年代流行的抽象数据类型。它在模拟指针的同时提供了额外的功能，如自动内存管理。\n\n在标准库中，我们有：\n\n- `unique_ptr`：一种所有并管理另一个对象的智能指针，并在\
    \ `unique_ptr` 超出作用域时释放它。\n- `shared_ptr`：一种通过指针保留对象所有权的智能指针。多个 `shared_ptr` 对象可以拥有同一个对象。\n\
