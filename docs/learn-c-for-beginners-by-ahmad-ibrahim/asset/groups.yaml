    # 1.3) COMPILE & EXECUTE


    Code → Save → Compile → Execute


    C++ is a compiled language. That means that to get a C++ program to run, you must
    first translate it from a human-readable form to something a machine “understand.”
    That translation is done by a program called a compiler.


    When you program in C++, you mainly go through 4 phases during development:


    +   1. Code — writing the program

    2. Save — saving the program

    3. Compile — compiling via the terminal

    4. Execute — executing via the terminal


    ![](img/a6303f820ae398dbe366f0ffbaec1dcd_20_0.png)


    And repeat (debug the errors if needed).'
  - '[PAGE 21]


    Note: Up until now, we''ve been doing the magic for you; Steps 2, 3, and 4 were
    all done by simply pressing the Run button.


    Let''s try compiling and executing using the terminal.


    # 1.3.1) Compile and Execute


    **Compile:** A computer can only understand machine code. A **compiler** can translate
    the C++ programs that we write into machine code. To compile a file, you need
    to type **g++** followed by the file name in the terminal.


    ```

    g++ hello.cpp

    ```


    The compiler will then translate the C++ program hello.cpp and create a machine
    code file called a.out.


    **Execute:** To execute the new machine code file, all you need to do is type
    ./ and the machine code file name in the terminal:


    ```

    ./a.out

    ```


    The executable file will then be loaded to computer memory and the computer''s
    CPU (Central Processing Unit) executes the program one instruction at a time.'
  - '[PAGE 22]


    ![](img/a6303f820ae398dbe366f0ffbaec1dcd_22_0.png)


    # 1.3.2) Compile and Execute (Naming Executables)


    **Compile:** Sometimes when we compile, we want to give the output executable
    file a specific name. To do so, the compile command is slightly different. We
    still need to write **g++** and the file name in the terminal. After that, there
    should be **-o** and then the name that you want to give to the executable file:


    ```

    g++ hello.cpp -o hello

    ```


    The compiler will then translate the C++ program hello.cpp and create a machine
    code file called hello.


    **Execute:** To execute the new machine code file, all you need to do is type
    √ and the machine code file name in the terminal:


    ```

    ./hello

