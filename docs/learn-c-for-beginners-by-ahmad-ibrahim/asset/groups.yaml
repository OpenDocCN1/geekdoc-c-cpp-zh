    \ blah = *ptr;\n```\n\nThe double meaning of * symbol can be tricky at first,\
    \ so make sure to note:\n\n- When * is used in a declaration, it is creating a\
    \ pointer.\n- When * is not used in a declaration, it is a dereference operator.\n\
    \n## 14.7 Null Pointer\n\nWhen we declare a pointer like so, its content is not\
