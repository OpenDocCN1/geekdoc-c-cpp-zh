    # 12.5) Access Control: Public and Private


    Let''s circle back to that public keyword. What was that about?


    By default, everything in a class is private, meaning class members are limited
    to the scope of the class. This makes it easier to keep data from mistakenly being
    altered, and abstracts away all the nifty-gritty details. If you try to access
    a private class member, you''ll get an error:


    error: ''population'' is a private member of ''City''

    But sometimes you need access to class members, and for that, there is public.
    You can use it to make everything below accessible outside the class:


    ```

    class City {

    int population;

    public: // stuff below is public

    void add_resident() {

    population++;

    }

    };

    ```


    There is also a private access modifier for when you want something below public
    to be private to the class:


    ```

    class City {

    int population;

    public:

    void add_resident() {

    population++;

    }

    rivate: // this stuff is private

    bool is_capital;

    };

    ```'
