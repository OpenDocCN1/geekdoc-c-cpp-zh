    # 11.8 How to Build Function Templates


    So how do we implement templates with actual code? Unlike regular functions, templates
    are entirely created in header files.


    Templates let us choose the type implementation right when you call the function.
    The type we choose may apply to the return type, a parameter type, or both.


    Here''s how we could build a template for print_cat_ears() so that the parameter
    type is flexible:


    ```

    <typename T>

    void print_cat_ears(T item) {

