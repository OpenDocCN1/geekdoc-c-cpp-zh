    - 你可以创建一个构造函数来实例化对象。\n\n## 14) 引用和指针\n\n## 14.1 引言\n\n计算机内存是字节的序列。我们可以从 0 到最后对其进行编号。每个数字被称为地址，代表内存中的一个位置。\n\
    \n我们放入内存的每个东西都有地址。例如，当我们声明并初始化一个 `int` 变量 `power`：\n\n```cpp\nint power = 9000;\n\
    ```\n这将在某处为变量留出 `int` 大小的内存并将 9000 放入其中。但某处在哪里？它有什么用？\n\n在本节中，我们将通过学习以下内容回答这些问题：\n\
