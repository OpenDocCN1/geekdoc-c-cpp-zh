  mdcn: "\n\n由于 `animal` 只在 `favorite_animal()` 内部定义且没有返回，因此程序的其余部分无法访问它。\n\n## 11.2)\
    \ 多文件程序\n\n程序的增长非常迅速。通过几个函数，你可以在 `main()` 上方声明函数，然后像这样在 `main()` 下方定义函数：\n\n```cpp\n\
    #include <iostream>\n// 顶部声明：\nvoid eat();\nint main() {\n    eat();\n}\n// 底部定义：\n\
    void eat() {\n    std::cout << \"nom nom nom\\n\";\n}\n```\n\n但当你的代码变长时，这种做法并不是理想的；在多个\
    \ .cpp 文件中使用同一个函数是常见操作。\n\n为了让代码更整洁、更具模块化，你可以将函数定义移动到另一个专门的 .cpp 文件（例如 `my_functions.cpp`），在\
    \ `main()` 上方留下一声明列表。\n\n但是文件和函数一样，是有作用域的。那么 `main()` 程序是如何知道函数定义的呢？\n\n在你的程序编译之前，它会将你在编译语句中列出的任何文件链接成一个单一的可执行文件：\n\
    \n```bash\ng++ main.cpp my_functions.cpp\n```\n搞定！你的程序知道函数定义了。\n\n## 11.3) 自己自己编写头文件\n\
    \n如果你的程序不断增长，你可能在看到 `main()` 之前需要滚动大量的声明。这看起来不是处理问题的最佳方法。而且，你不想为不同的文件反复反复地声明相同的函数——那样修改起来将极其乏味！\n\
    \n嗯，你可以将那些函数声明全部移动到头头文件中——通常与包含所有函数定义的文件同名——扩展名为 `.hpp` 或 `.h`。例如，如果你的函数定义在 `my_functions.cpp`\
    \ 中，那么对应的头文件就是 `my_functions.hpp` 或 `my_functions.h`。\n\n那么，你如何将头文件中的所有内容引入另一个文件的作用域呢？你只是像处理第二个\
    \ .cpp 文件那样，直接在编译语句中链接头文件吗？\n\n事实证明，使用头文件，你只需要在 `main.cpp` 的最顶部添加 `#include \"\
    my_functions.hpp\"`：\n\n```cpp\n#include \"my_functions.hpp\"\n```\n砰！这一行代码将 `my_functions.hpp`\
    \ 中的所有内容全部粘贴进来。现在，你可以访问存储在头文件中所有的函数声明了。\n\n## 11.4) 如何让函数内联\n\n一旦你进入 C++ 开发的世界，你可能会遇到“内联函数”（inline\
    \ functions）这个术语，它具有两种含义。内联函数是一个函数定义，通常在头文件中，并带有所示的 `inline` 修饰：\n\n```cpp\ninline\n\
    void eat() {\n    std::cout << \"nom nom\\n\";\n}\n```\n\n使用 `inline` 允许编译器将函数体插入到调用函数的地方，这有时有助于提高执行速度（有时也会阻碍执行速度）。如果你确实使用了，我们建议测试它对程序执行速度的影响。底线是，`inline`\
    \ 是你可能会遇到、但可能永远不会使用的东西。\n\n然而，你有时也会听到所谓的“内联函数”，指的是仅仅是成员函数（即类内部的函数——我们稍后会解释类），由于函数体非常短，所以它们在头文件中单行内完成了定义和声明：\n\
    \n```cpp\n// cookie_functions.hpp\n\n// Cookie::eat() 属于 Cookie 类：\nvoid Cookie::eat()\
    \ { std::cout << \"nom nom\\n\"; }\n```\n\n请注意，如果你在头文件中内联函数，**始终**应该添加 `inline`关键字（除非你处理的是成员函数，它们会自动为你处理内联）。\n\
    \n## 11.5) 默认参数\n\n如果你在 C++ 中为函数添加了参数，那么调用该函数时就需要一个参数。这里的“需要”意味着什么？嗯，你会得到一个错误。但如果\
    \ 10 次中有 9 次你都使用同一个输入值呢？反复输入相同的值会非常麻烦。\n\n为了让你的代码在在这种情况下更加灵活，你可以在函数声明中添加默认参数。默认参数在函数声明和定义时被分配给参数：\n\
    \n```cpp\n// 声明\nvoid intro(std::string name, std::string lang = \"C++\");\n\n\
    // 定义\nvoid intro(std::string name, std::string lang) {\n    std::cout << \"Hi\
    \ \" << name << \" \" << lang;\n}\n```\n\n等等，我注意到原始 OCR 文本在定义部分被截断/损坏。根据标准的 C++\
    \ 模式，我恢复了默认参数的逻辑。\n\n## 11.6) 函数重载！\n\n如果你想要一个函数接受不同类型怎么办？或者你想让一个函数的参数是可选的怎么办？\n\
    \n在一个名为“重载”（overloading）的过程中，你可以给多个函数起相同的名称。C++ 根据所提供的参数来决定调用哪一个。\n\n```cpp\n\
    void print_data(int i) {\n    std::cout << i << \"\\n\";\n}\n\nvoid print_data(double\
    \ d) {\n    std::cout << d << \"\\n\";\n}\n\nvoid print_data(std::string s) {\n\
    \    std::cout << s << \"\\n\";\n}\n```\n\n重载允许你对概念上相似的操作使用相同的函数名，使代码更具读性。\n\n\
    ## 11.7) 函数模板\n\n重载可能很枯燥。想象你想创建一个可以处理 `int`、`float`、`double` 的新函数。你需要反复重新定义相同的函数体吗？\n\
    \n感谢不需要！当两个函数具有相同的函数体时（如 `print_data()` 所示），有一个更整洁的解决方案可以使用：模板（templates）。\n\n\
    模板是一种 C++ 工具，允许程序员将数据类型作为参数。\n\n## 11.8) 如何构建函数模板\n\n那么我们如何实现模板呢？与普通函数不同，模板完全在头文件中创建。\n\
    \n模板让我们在调用函数时选择类型。我们选择的类型可以应用于返回值、参数类型或两者兼有。\n\n以下是我们如何为 `print_data()` 构建模板，使得参数类型变得灵活：\n\
    \n```cpp\n<typename T>\nvoid print_data(T item) {\n    std::cout << \" \" << item\
    \ << \" \" << item << \"\\n\";\n    std::cout << item << item << item << \" \"\
    \ << item << item << \"\\n\";\n}\n```\n\n我们可以为 `int`、`char`、`std::string` 或 `double`\
    \ 调用该函数：\n\n```cpp\nprint_data(2);\n// 输出：\n// 2 2\n// 222 222\n\nprint_data('A');\n\
    // 输出：\n//  A A \n// AAA AA\n\nprint_data(4);\n// 输出：\n// 4 4\n// 444 444\n```\n\
    \n注意：使用模板会减慢程序的编译时间，但会加快执行时间。\n\n"
