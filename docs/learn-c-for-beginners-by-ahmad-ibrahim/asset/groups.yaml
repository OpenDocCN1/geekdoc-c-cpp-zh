  md: "\n2. Aliases cannot be changed to alias something else.\n\n## 14.3 Pass-By-Reference\n\
    \nSo, what's a good use case for references? Let's take a look.\n\nPreviously,\
    \ when we passed parameters to a function, we used normal variables and that's\
    \ known as *pass-by-value*. But because the variables passed into the function\
    \ are out of scope, we can't modify the value of the arguments.\n\n*Pass-by-reference*\
    \ refers to passing parameters to a function using references. When called, the\
    \ function can modify the value of the arguments by using the reference passed\
    \ in.\n\nThis allows us to:\n\n- Modify the value of the function arguments.\n\
    - Avoid making copies of a variable/object for performance reasons.\n\nThe following\
    \ code shows an example of a pass-by-reference. The reference parameters are initialized\
    \ with the actual arguments when the function is called:\n\n```\nvoid swap_num(int\
    \ &i, int &j) {\n    int temp = i;\n    i = j;\n    j = temp;\n}\n\nint main()\
    \ {\n    int a = 100;\n    int b = 200;\n\n    swap_num(a, b);\n\n    std::cout\
    \ << \"A is \" << a << \"\\n\";\n    std::cout << \"B is \" << b << \"\\n\";\n\
    }\n```\n\nNotice that the int &i and int &j are the parameters of the function\
    \ swap_num().\n\nWhen swap_num() is called, the values of the variables a and\
    \ b will be modified because they are passed by reference. The output will be:\n\
    \n| A is 200 |\n| B is 100 |\n\nSuppose we didn't pass-by-reference here and have\
    \ the parameters simply int i and int j in the swap_num() function, then i and\
    \ j would swap, but a and b would be modified.\n\nAnd the output will then be:\n\
    \n| A is 100 |\n| B is 200 |\n\nTo reiterate, using references as parameters allows\
    \ us to modify the arguments' values. This can be very useful in a lot of cases.\n\
    \n## 14.4 Pass-By-Reference with Const\n\nRemember const? The const keywords tell\
    \ the compiler that we won't change something.\n\nFor example, in the following\
    \ code, we are telling the compiler that the double variable pi will stay at 3.14\
    \ throughout the program:\n\n```\ndouble const pi = 3.14;\n```\n\nIf we try to\
    \ change pi, the compiler will throw an error.\n\nSometimes, we use const in a\
    \ function parameter; this is when we know for a fact that we want to write a\
    \ function where the parameter won't change inside the function. Here's an example:\n\
    \n```\nint triple(int const i) {\n  return i * 3;\n}\n```\n\nIn this example,\
    \ we are not modifying the i. If inside the function triple(), the value of i\
    \ is changed, there will be a compiler error.\n\nTo save the computational cost\
    \ for a function that doesn't modify the parameter value(s), we can go a step\
    \ further and use a const reference:\n\n```\nint triple(int const &i) {\n    return\
    \ i * 3;\n}\n```\n\nThis will ensure the same thing: the parameter won't be changed.\
    \ However, making i a reference to the argument saves the computational cost of\
    \ making a copy of the argument.\n\n## 14.5 Pointers\n\nIn C++, a pointer is mostly\
    \ the same as other variables, which can store a piece of data. Unlike normal\
    \ variables, which store a value (such as an int, double, char), the pointer stores\
    \ a memory address.\n\nWhile references are a newer mechanism that originated\
    \ in C++, we recommend avoiding pointers as much as possible; usually, a reference\
    \ will do the trick. However, you will see pointers a lot in the wild, particularly\
    \ in old projects, where they are used in a very similar way to references.\n\n\
    Pointers must be declared before they can be used, just like a normal variable.\
    \ They are syntactically distinguished by the \"*\", so that int means \"pointer\
    \ to int\" and double means \"pointer to double\".\n\n```\nint* number;\ndouble*\
    \ decimal;\nchar* character;\n```\n\nSo suppose we have a variable called gum:\n\
    \n```\nint gum = 8;\n```\n\nWe can create a pointer to it by:\n\n```\nint* ptr\
    \ = &gum;\n```\n\n- int* makes it a pointer rather than a normal variable.\n-\
    \ ptr is the pointer name.\n- &gum is the memory address of the other variable.\n\
    \nSo now ptr has a value of gum's memory address. Note: Syntactically, spaces\
    \ around * do not matter, but the best practice is to have it after the data type.\n\
    \n```\nint* number;\nint *number;\nint * number;\n```\n\n## 14.6 Dereference\n\
    \nSo now we learned what a pointer is and how to create one, but there is a way\
