    ```bash\ng++ hello.cpp -o hello\nhello\n```\n\n- 单行注释使用 //\n- 多行注释使用 */\n\n##\
    \ 1.5) 流程\n\nC++ 是一种编译型语言。这意味着，要让一个程序运行，你必须先将其从人类可读的形式翻译成机器“理解”的内容。这种翻译是由一个称为编译器的程序完成的。\n\
