    ```


    But this isn''t ideal when your code gets longer; it''s common to use the same
    function in more than one .cpp file.


    To make your code cleaner and more modular, you can move the function definitions
    over another specialized .cpp file (e.g., my_functions.cpp), leaving a list of
    declarations above main().


    But files, like functions, have scope. So how does the main() program know about
    the function definitions?


    Before your program compiles, it links together any files you list in your compilation
    statement into a single executable:


    ```

    g++ main.cpp my_functions.cpp

    And voila! Your program knows the function definitions.

