    # 5.1) whileLoop statement


    +   * A whileloop repeatedly executes the code block within as long as the condition
    is true. The moment the condition becomes false, the program will exit the loop.

    * Note that the while loop might not ever run. If the condition is false initially,
    the code block will be skipped.

    * The while loop looks very similar to an if statement. And just like an if statement,
    it executes the code inside of it if the condition is true. However, the difference
    is that the while loop will continue to execute the code inside of it, over and
    over again, as long as the condition is true.


    Here is what a while loop looks like:


    ```

    while (condition) {


    statements

    }

    ```


    +   * In other words, instead of executing if something is true, it executes while
    that thing is true.'
