    - Copy constructor\n- Copy assignment operator\n\n### 16.3 The Rule of Five\n\n\
    With C++11, a new rule emerged: the rule of five. This adds two more special functions\
    \ to the rule of three list:\n\n- Destructor\n- Copy constructor\n- Copy assignment\
    \ operator\n- Move constructor\n- Move assignment operator\n\nAs you can see,\
    \ manual memory management is difficult and old-fashioned. Instead of using new\
    \ and delete, there's something in the standard library that will make your life\
