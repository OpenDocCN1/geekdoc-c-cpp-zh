  md: '# Introduction to C++


    C++ (pronounced C plus plus) was developed by Bjarne Stroustrup at Bell Labs as
    an extension to C, starting in 1979. C++ adds many new features to the C language
    and is perhaps best thought of as a superset of C, though this is not strictly
    true (as C99 introduced a few features that do not exist in C++). C++''s claim
    to fame object-oriented programming primarily from the fact that it is an object-oriented
    language. As the name implies, C++ was derived from the C language; Bjarne''s
    goal was to add object-oriented programming into C, a language well-respected
    for its portability and low-level functionality. As for what an object is and
    how it differs from traditional programming methods, well, we''ll cover that in
    chapter 8 (Basic object-oriented programming).


    ![](img/a6303f820ae398dbe366f0ffbaec1dcd_10_0.png)


    C++ was standardized in 1998 by the ISO committee (this means the ISO committee
    ratified a document describing the C++ language, to help ensure all'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'compilers adhered to the same set of standards). A minor update was released
    in 2003 (called C++03).


    Three major updates to the C++ language (C++11, C++14, and C++17, ratified in
    2011, 2014, and 2017 accordingly) have been made since then, each adding additional
    functionality. C++11, in particular, added a huge number of new capabilities,
    and at this point is widely considered the new baseline. As of the time of writing,
    C++20 is in the works, bringing even more new capabilities. Future upgrades to
    the language are expected every three or so years.


    Each new formal release of the language is called a language standard (or language
    specification). Standards are named after the year they are released in. For example,
    there is no C++15, because there was no new standard in 2015.


    Why learn C++? Among many other things:


    +   - It is fast and flexible.

    - It is well-supported.

    - It forces you to think in new and creative ways.


    In this lesson, we''ll start learning some basic concepts, and you''ll write your
    very first C++ program.


    Note: Don''t worry if some words don''t make much sense right now. We''ll learn
    about them in a bit!'
