    # ## 10.5) Return Types — Beyond the Void


    When you want your function to return something and pass information

    back to the rest of your program, C++ has got you covered. Just like there are

    many variable types, there are many different return types for functions.


    A function can return most data types we''ve covered,

    including double, int, char, std::string, and std::vector.


    ```

    std::string always_blue() {

    return "bluefn";n}

    ```


    Note: The return statement is the last line of code that a function will execute.

    For example:


    ```

    std::string always_blue() {

    return "bluefn";nstd::cout << "Returned blue!";n}

    ```


    The final line will not execute because a value has already been returned.

    So "Returned blue!" won''t be printed to the terminal.


    # ## 10.6 How Return Values Work


    When functions have a return type other than void, the function has two new

    requirements:


    +   - There must be a value returned from the function.

    - The return value must be the same type as the function''s return type.


    But where does the return value get returned to?'
