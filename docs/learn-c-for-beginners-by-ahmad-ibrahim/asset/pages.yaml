  md: '# # 2) Variables


    # ## 2.1 Introduction to Variables:


    The "Hello World!" program simply writes to the screen. It does not read anything,
    calculate anything, or allow for user input. That''s no fun!


    Real programs tend to produce results based on some input that the user of the
    program gives, rather than just outputting the same thing every time.


    To read something from the keyboard, we first need somewhere in the computer''s
    memory to store data. That is where variables come in.


    A variable is simply a name that represents a particular piece of your computer''s
    memory that has been set aside for you to store, retrieve, and use data.


    In this lesson, we will learn about some the basic data types:


    +   - int: integer numbers

    - double: floating-point numbers

    - char: individual characters

    - string: a sequence of characters

    - bool: true/false values


    Every variable has a type, which represents the kind of information you can store
    inside of it. It tells your compiler how much memory to set aside for the variable,
    and it defines what you can do with the variable.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 2.1.1) Step 1: Declare a Variable


    Every variable in C++ must be declared before it can be used!


    Suppose we are building a game and we want to keep track of a player’s score that
    goes from 0 to 10. We need a variable!


    Before we can use a variable, we must declare, or create, it. To declare a variable,
    we need to provide two things:


    +   1. A type for the variable.

    2. A name for the variable.


    So to declare an integer variable called score, we need to write:


    | Type | Usage | Examples |

    |---|---|---|

    | int | integer numbers | 0, 420 |

    | double | floating-point numbers | 3.14, 200.0 |

    | char | characters | ''a'' |

    | string | sequence of characters | "Hello World!" "Codeacademy" |

    | bool | truth values | true, false |'
  merge: -1
  img_proc: true
