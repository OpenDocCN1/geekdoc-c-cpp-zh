    - Copy assignment operator

    - Move constructor

    - Move assignment operator


    As you can see, manual memory management is difficult and old-fashioned. Instead
    of using new and delete, there''s something in the standard library that will
    make your life a lot easier.


    # 16.4) Standard Library Smart Pointers


    A smart pointer is an abstract data type that was popularized by C++ during the
    early 1990s. It simulates a pointer while providing additional features, such
    as automatic memory management.


    In the standard library, we have the following:


    +   - unique_ptr: a smart pointer that owns and manages another object through
    and disposes of that when the unique_ptr goes out of scope.

    - shared_ptr: a smart pointer that retains shared ownership of an object through
    a pointer. Several shared_ptr objects may own the same object.


