  md: 'Note: Up until now, we''ve been doing the magic for you; Steps 2, 3, and 4
    were all done by simply pressing the Run button.


    Let''s try compiling and executing using the terminal.


    # 1.3.1) Compile and Execute


    **Compile:** A computer can only understand machine code. A **compiler** can translate
    the C++ programs that we write into machine code. To compile a file, you need
    to type **g++** followed by the file name in the terminal.


    ```

    g++ hello.cpp

    ```


    The compiler will then translate the C++ program hello.cpp and create a machine
    code file called a.out.


    **Execute:** To execute the new machine code file, all you need to do is type
    ./ and the machine code file name in the terminal:


    ```

    ./a.out

    ```


    The executable file will then be loaded to computer memory and the computer''s
    CPU (Central Processing Unit) executes the program one instruction at a time.'
  merge: -1
  img_proc: true
