  md: '+   - Division by zero is also known as division error. These types of errors
    are hard to find as the compiler doesn''t point to the line at which the error
    occurs.

    - Trying to open a file that doesn''t exist


    There is no way for the compiler to know about these kinds of errors when the
    program is compiled.


    Here''s an example of a run-time error message:


    ```

    $ g++ example.cpp

    $ ./a.out

    Floating point exception (core dumped)

    ```


    # 7.5) Logic Errors


    Once we have removed the compile-time errors, link-time errors, and run-time errors,
    the program runs successfully. But sometimes, the program doesn''t do what we
    want it to do or no output is produced. H...


    These types of errors that provide incorrect output, but appears to be error-free,
    are called logical errors. These are some of the most common errors that happen
    to beginners and are also usually the most difficult to find and eliminate.


    Logical errors solely depend on the logical thinking of the programmer. Your job
    now is to figure out why the program didn''t do what you wanted it to do.


    Some common logic errors:


    +   - Program logic is flawed

    - Some "silly" mistake in an statement or a for/while loop


    Note: Logic errors don''t have error messages. Sometimes, programmers use a process
    called test-driven development (TDD), a way to give logic errors messages and
    save yourself a lot of headaches!'
