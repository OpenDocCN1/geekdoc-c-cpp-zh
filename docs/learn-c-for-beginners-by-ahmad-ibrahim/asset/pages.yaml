  md: '# HELLO WORLD!


    A C++ program has a very specific structure in terms of how the code is written.
    Let''s take a closer look at the Hello World program — line by line!


    C++ programs have a very specific structure in terms of how the code is written.
    There are some key elements that you use in all your C++ programs.


    Here, we have a program called hello.cpp. It is a classic first program!


    ```

    // This program outputs the message "Hello World!" to the monitor


    #include <iostream>


    int main() {


    std::cout << "Hello World!\n";n

    return 0;


    }

    ```


    This program writes the phrase “Hello, World!” to your terminal.


    C++ is a case sensitive language. Case sensitivity means that your keywords and
    variable declarations must match the case. For example, the C++ keyword for outputting
    is cout. If you were to type Cout or COUT, the compiler would not know that you
    intended to use the keyword count.


    Note: Don''t be intimidated by all the new information. You''ll learn all of these
    things (and a whole lot more)!'
  merge: -1
  img_proc: true
