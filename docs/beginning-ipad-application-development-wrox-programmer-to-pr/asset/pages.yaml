  md: "# Using HTTP POST to Talk to a Web Service\n\nYou can also use the HTTP POST\
    \ method to communicate with the Web service. To talk to a Web service using HTTP\
    \ POST, you just need to modify the buttonClicked: method, like this:\n\n```\n\
    - (IBAction)buttonClicked:(id)sender {\n    NSString *postString =\n    [NSString\
    \ stringWithFormat:@\"V4IPAddress=%@\", ipAddress.text];\n    NSLog(postString);\n\
    \    NSURL *url = [NSURL URLWithString:\n    @\"http://www.ecubicle.net/ip2country.asmx/FindCountryAsXml\"\
    ];\n    NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:url];\n\
    \    NSString *msgLength = [NSString stringWithFormat:@\"%d\", [postString length]];\n\
    \    [req addValue:@\"application/x-www-form-urlencoded\"\n     forHTTPHeaderField:@\"\
    Content-Type\"];\n    [req addValue:msgLength forHTTPHeaderField:@\"Content-Length\"\
    ];\n    [req setHTTPMethod:@\"POST\"];\n    [req setHTTPBody: [postString dataUsingEncoding:NSUTF8StringEncoding]];\n\
    \    [activityIndicator startAnimating];\n    conn = [[NSURLConnection alloc]\
    \ initWithRequest:req delegate:self];\n    if (conn) {\n        webData = [[NSMutableData\
    \ data] retain];\n    }\n}\n```\n\nBasically, you do away with forming the SOAP\
    \ message and simply post a single string to the Web service, such as:\n\n```\n\
    V4IPAddress=34.5.6.7\n```\n\n> **NOTE** Note that in order for HTTP POST to work,\
    \ the Web service must support the HTTP POST method. Always refer to the documentation\
    \ of the Web service (or the test page shown in Figure 14-2) to confirm if the\
    \ Web service supports HTTP POST.\n\nThe result returned from the Web service\
    \ will look like this:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<IPCountryService>\n\
    <Country>United States</Country>\n</IPCountryService>\n```"
