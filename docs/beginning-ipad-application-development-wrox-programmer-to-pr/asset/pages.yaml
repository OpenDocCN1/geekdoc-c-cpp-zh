- pgno: 338
  md: 'To get the ImageView to display the series of images, set its animationImages
    property to the images object. You also set the display mode of the ImageView:


    ```

    imageView.animationImages = images;

    imageView.contentMode = UIViewContentModeScaleAspectFit;

    ```


    To control how fast the images are displayed, you set the animationDuration property
    to a value. This value indicates the number of seconds that the ImageView will
    take to display one complete set of images. The animationRepeatCount property
    enables you to specify how many times you want the animation to occur. Set it
    to 0 if you want it to display indefinitely:


    ```

    imageView.animationDuration = 3;    //---seconds to complete one set

    imageView.animationRepeatCount = 0; //---continuous---

    ```


    Finally, you start the animation by calling the startAnimating method. You also
    need to add the ImageView to the View window by calling the addSubview: method:


    ```

    [imageView startAnimating];

    [self.view addSubview:imageView];

    ```


    # SUMMARY


    In this chapter, you have seen the usefulness of the NSTimer class and how it
    can help you perform some simple animations. You have also learned about the various
    affine transformations supported by the iPhone SDK. Last, you learned about the
    ability of the ImageView to animate a series of images at a regular time interval.


    # EXERCISES


    +   1. Name the three affine transformations supported by the iPhone SDK.

    +   2. How do you pause an NSTimer object and then make it continue?

    +   3. What is the use of enclosing your block of code with the beginAnimations
    and commitAnimations methods of the UIView class?


    ```

    [UIView beginAnimations:@"some_text" context:nil];

    //---code to effect visual change---

    [UIView commitAnimations];

    ```


    Answers to the Exercises can be found in Appendix A.'
