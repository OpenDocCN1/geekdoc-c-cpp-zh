- pgno: 454
  md: '# 17


    # Apple Push Notification Services


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - Understand how to use the Apple Push Notification service

    +   - How to generate a certificate request

    +   - How to generate a development certificate

    +   - How to create an App ID

    +   - How to configure App ID for push notification

    +   - How to create a provisioning profile

    +   - How to provision a device

    +   - How to deploy an iPad application onto a device

    +   - How to use a push notification provider application


    One of the key limitations of the iPad is its constraint on running applications
    in the background, which means that applications requiring a constant state of
    connectivity (such as social networking applications) will not be able to receive
    timely updates when the user switches to another application.


    To overcome this limitation, Apple released the Apple Push Notification service
    (APNs). APNs allows your device to be constantly connected to Apple''s push notification
    server. When you want to send a push notification to an application installed
    on the users'' devices, you (the provider) can contact the APNs so that it can
    deliver a push message to the particular application installed on the intended
    device.'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'When your iPad application uses the Apple Push Notification service, the device
    remains connected to the APNs server using an open TCP/IP connection. To send
    notifications to your application running on iPad devices, you need to write a
    provider application that communicates with that server. Your provider application
    will send messages to the APNs server, which in turn relays the message to the
    various devices running your application by pushing the message to these devices
    through the TCP/IP connection.


    While the steps for programming APNs are straightforward, there are several details
    that you need to perform to enable messages to be pushed successfully to the devices.
    In this chapter, you learn how to create an iPad application using the APNs. The
    following sections take you through the steps for APNs programming in more detail.


    # GENERATING A CERTIFICATE REQUEST


    The first step to using the APNs is to generate a certificate request file so
    that you can use it to request for two development certificates — one for code
    signing your application and one to be used by your provider to send notifications
    to the APNs server. The following Try It Out shows you how to generate the certificate
    request.


    # TRY IT OUT  Generating a Certificate Request


    +   1. Launch the Keychain Access application in your Mac OS X (you can do so
    by typing "Keychain" in Spotlight).

    +   2. Select Keychain Access ⌘ Certificate Assistant ⌘ Request a Certificate
    From a Certificate Authority (see Figure 17-1)

    +   3. Enter the information required and select the "Saved to disk" option. Click
    Continue (see Figure 17-2).


    ![](img/744c5ec15e15ca7891c98be71dc25d13_455_0.png)


    FIGURE 17-1'
  merge: -1
  img_proc: true
