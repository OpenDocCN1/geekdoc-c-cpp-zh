- pgno: 403
  md: "The HTTP method is POST.\n\nThe SOAP request is:\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soap:Body>\n    <FindCountryAsXml xmlns=\"http://www.ecubicle.net/webservices/\"\
    >\n      <V4IPAddress>string</V4IPAddress>\n    </FindCountryAsXml>\n  </soap:Body>\n\
    </soap:Envelope>\n```\n\nThe Content-Length of the SOAP request is the total number\
    \ of characters of the SOAP request.\n\nThe Web service will return the following\
    \ response:\n\n```\nHTTP/1.1 200 OK\nContent-Type: text/xml; charset=utf-8\nContent-Length:\
    \ length\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
    \ xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n \
    \   <FindCountryAsXmlResponse xmlns=\"http://www.ecubicle.net/webservices/\">\n\
    \      <FindCountryAsXmlResult>xml</FindCountryAsXmlResult>\n    </FindCountryAsXmlResponse>\n\
    \  </soap:Body>\n</soap:Envelope>\n```\n\nIn particular, the result (country)\
    \ will be enclosed within the block of XML results. You would need to extract\
    \ it from the XML result.\n\n# Using SOAP 1.2\n\nUsing SOAP 1.2 is very similar\
    \ to using SOAP 1.1. The following shows the SOAP request for SOAP 1.2:\n\n```\n\
    POST /iptocountry.asmx HTTP/1.1\nHost: www.ecubicle.net\nContent-Type: application/soap+xml;\
    \ charset=utf-8\nContent-Length: length\n\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<soap12:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"\
    http://www.w3.org/2001/XMLSchema\" xmlns:soap12=\"http://www.w3.org/2003/05/soap-envelope\"\
    >\n  <soap12:Body>\n    <FindCountryAsXml xmlns=\"http://www.ecubicle.net/webservices/\"\
    >\n      <V4IPAddress>string</V4IPAddress>\n    </FindCountryAsXml>\n  </soap12:Body>\n\
    </soap12:Envelope>\n```"
  merge: -1
  img_proc: true
- pgno: 404
  md: "The SOAP response for SOAP 1.2 would be:\n\n```\nHTTP/1.1 200 OK\nContent-Type:\
    \ application/soap+xml; charset=utf-8\nContent-Length: length\n\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<soap12:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\nxmlns:soap12=\"http://www.w3.org/2003/05/soap-envelope\"\
    >\n  <soap12:Body>\n    <FindCountryAsXmlResponse xmlns=\"http://www.ecubicle.net/webservices/\"\
    >\n      <FindCountryAsXmlResult>xml result</FindCountryAsXmlResult>\n    </FindCountryAsXmlResponse>\n\
    \  </soap12:Body>\n</soap12:Envelope>\n```\n\n# Using HTTP GET\n\nIf you do not\
    \ want to use SOAP, you could use the simpler HTTP GET method. Here is the format\
    \ for sending the request:\n\n```\nGET /iptocountry.asmx/FindCountryAsXml?V4IPAddress=string\
    \ HTTP/1.1\nHost: www.ecubicle.net\nHTTP/1.1 200 OK\nContent-Type: text/xml; charset=utf-8\n\
    Content-Length: length\n```\n\nTake note of the following:\n\n+   - The URL for\
    \ the Web service is http://www.ecubicle.net/iptocountry.asmx/FindCountryAsXml?V4IPAddress=string.\
    \ This URL is formed by joining the Host name (on the second line) with the URL\
    \ on the first line. The data to be sent is formatted as key/value pairs — key1=value1&key2=value2&key3=value3.\n\
    +   - The Content-Type for the request is text/xml; charset=utf-8.\n+   - The\
    \ Content-Length for the request is 0, since there is nothing you need to send\
    \ separately (everything is sent through the query string).\n+   - The HTTP Method\
    \ is GET.\n+   - The result will be returned in the following format:\n+     ```\n\
    +     <?xml version=\"1.0\"?>\n+     xml result\n+     ```\n\n# Using HTTP POST\n\
    \nIn addition to using HTTP GET, you can also use HTTP POST. Here is the format\
    \ for sending the request:\n\n```\nPOST /iptocountry.asmx/FindCountryAsXml HTTP/1.1\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 405
  md: "```\n```\nHost: www.ecubicle.net\nContent-Type: application/x-www-form-urlencoded\n\
    Content-Length: length\n\nV4IPAddress=string\n```\n```\n\nTake note of the following:\n\
    \n+   - The URL for the Web service is `http://www.ecubicle.net/iptocountry.asmx/FindCountryAsXml`.\
    \ This URL is formed by joining the Host name (on the second line) with the URL\
    \ on the first line.\n+   - The `Content-Type` for the request is `application/x-www-form-urlencoded`.\n\
    +   - The `Content-Length` for the request is the length of `V4IPAddress=string`.\
    \ The data to be sent is formatted as key/value pairs — `key1=value1&key2=value2&key3=value3`.\
    \ Unlike HTTP GET, the data are not sent through the query string; it is sent\
    \ after the HTTP headers.\n+   - The HTTP Method is `POST`.\n+   - The result\
    \ will be returned in the following format:\n+     ```\n+     HTTP/1.1 200 OK\n\
    +     Content-Type: text/xml; charset=utf-8\n+     Content-Length: length\n+ \
    \  \n+     <?xml version=\"1.0\"?>\n+     xml result\n+     ```\n\n# CONSUMING\
    \ WEB SERVICES USING SOAP, HTTP GET, AND HTTP POST\n\nNow that you have seen the\
    \ three ways of consuming Web services, which method should you use? Using HTTP\
    \ GET (the simplest), you saw that all the information you need to pass to the\
    \ Web service can be sent through the query string. However, the query string\
    \ has a limit on its length, and is hence not suitable if you need to pass lots\
    \ of data to the Web service. An alternative to this would be to use the HTTP\
    \ POST method, which allows more data to be sent. However, HTTP POST has its limitations\
    \ as well. As with HTTP GET, the data to be sent must be formatted as key/value\
    \ pairs. But each key/value pair is limited in size to 1024 characters. The most\
    \ versatile method is to use the SOAP method, which allows complex data types\
    \ to be sent to the Web service through the SOAP request.\n\n# CONSUMING A WEB\
    \ SERVICE IN YOUR IPAD APPLICATION\n\nNow you're ready to tackle the exciting\
    \ task of consuming a Web service in your iPad application! First, you learn how\
    \ to communicate with the Web service using the SOAP method."
