- pgno: 572
  md: "Note that the statement\n\n```\nNSString *str2 = [[NSString stringWithFormat:@\"\
    %d\", 4];\n```\n\nhas the same effect as\n\n```\nNSString *str2 = @\"4\";\n```\n\
    \nAlthough autorelease objects seem to make your life simple by automatically\
    \ releasing objects that are no longer needed, you have to be careful when using\
    \ them. Consider the following example:\n\n```\nfor (int i=0; i<=99999; i++){\n\
    \    NSString *str = [[NSString stringWithFormat:@\"%d\", i];\n    //...\n   \
    \ //...\n}\n```\n\nYou are creating an NSString object for each iteration of the\
    \ loop. Because the objects are not released until the function exits, you may\
    \ well run out of memory before the autorelease pool (see next section) can kick\
    \ in to release the objects.\n\nOne way to solve this dilemma is to use an autorelease\
    \ pool, as discussed in the next section.\n\n# REFERENCE COUNTING: THE ANALOGY\
    \ CONTINUES\n\nContinuing with our analogy of the room in the library, imagine\
    \ that you are about to sign out with the librarian when you realize that you\
    \ have left your books in the room. You tell the librarian that you are done with\
    \ the room and want to sign out now, but because you left your books in the room,\
    \ you tell the librarian not to switch off the lights yet so that you can go back\
    \ to get the books. At a later time, the librarian can switch off the lights at\
    \ his or her own choosing. This is the behavior of autoreleased objects.\n\n#\
    \ Autorelease Pools\n\nAll autorelease objects are temporary objects and are added\
    \ to an autorelease pool. When the current method exits, all the objects contained\
    \ within it are released. However, sometimes you want to control how the autorelease\
    \ pool is emptied, rather than wait for it to be called by the OS. To do so, you\
    \ can create an instance of the NSAutoreleasePool class, like this:\n\n```\nfor\
    \ (int i=0; i<=99999; i++){\n    NSAutoreleasePool *pool = [[NSAutoreleasePool\
    \ alloc] init];\n    NSString *str1 = [[NSString stringWithFormat:@\"%d\", i];\n\
    \    NSString *str2 = [[NSString stringWithFormat:@\"%d\", i];\n    NSString *str3\
    \ = [[NSString stringWithFormat:@\"%d\", i];\n    //...\n    //...\n    [pool\
    \ release];\n}\n```"
  merge: -1
  img_proc: true
- pgno: 573
  md: "In this example, for each iteration of the loop, an NSAutoreleasePool object\
    \ is created, and all the autorelease objects created within the loop — str1,\
    \ str2, and str3 — go into it. At the end of each iteration, the NSAutoreleasePool\
    \ object is released so that all the objects contained within it are automatically\
    \ released. This ensures that you have at most three autorelease objects in memory\
    \ at any one time.\n\n# dealloc\n\nYou have learned that by using the alloc or\
    \ the new keyword, you own the object that you have created. You have also seen\
    \ how to release the objects you own using the release or autorelease keyword.\
    \ So when is a good time for you to release them?\n\nAs a rule of thumb, you should\
    \ release the objects as soon as you are done with them. So if you created an\
    \ object in a method, you should release it before you exit the method. For properties,\
    \ recall that you can use the @property compiler directive together with the retain\
    \ keyword:\n\n```\n@property (retain, nonatomic) NSString *name;\n```\n\nBecause\
    \ the values of the property will be retained, it is important that you free it\
    \ before you exit the application. A good place to do so is in the dealloc method\
    \ of a class (such as a View Controller):\n\n```\n- (void) dealloc {\n    [self.name\
    \ release];    //---release the name property---\n    [super dealloc];\n}\n```\n\
    \nThe dealloc method of a class is fired whenever the reference count of its object\
    \ reaches 0. Consider the following example:\n\n```\nSomeClass *scl = [[SomeClass\
    \ alloc] initWithName:@\"Wei-Meng Lee\" andRate:35];\n//...do something here...\n\
    [scl release];  //---reference count goes to 0; dealloc will be called---\n```\n\
    \nThe preceding example shows that when the reference count of scl goes to 0 (when\
    \ the release statement is called), the dealloc method defined within the class\
    \ will be called. If you do not define this method in the class, its implementation\
    \ in the base class will be called.\n\n# Memory Management Tips\n\nMemory management\
    \ is a tricky issue in iPad programming. Although there are tools that you can\
    \ use to test for memory leaks, this section presents some simple things you can\
    \ do to detect memory problems that might affect your application.\n\nFirst, ensure\
    \ that you implement the didReceiveMemoryWarning method in your View Controller:\n\
    \n```\n- (void)didReceiveMemoryWarning {\n    //---insert code here to free unused\
    \ objects---\n    [super didReceiveMemoryWarning];\n}\n```"
  merge: -1
  img_proc: true
- pgno: 574
  md: "The didReceiveMemoryWarning method will be called whenever your iPad runs out\
    \ of memory. You should insert code in this method so that you can free resources/objects\
    \ that you do not need.\n\nIn addition, you should also handle the applicationDidReceiveMemoryWarning:\
    \ method in your application delegate:\n\n```\n```objc\n- (void)applicationDidReceiveMemoryWarning:(UIApplication\
    \ *)application {\n    //---insert code here to free unused objects---\n    [[ImageCache\
    \ sharedImageCache] removeAllImagesInMemory];\n}\n```\n```\n\nIn this method,\
    \ you should stop all memory-intensive activities, such as audio and video playback.\
    \ You should also remove all images cached in memory.\n\n# PROTOCOLS\n\nIn Objective-C,\
    \ a protocol declares a programmatic interface that any class can choose to implement.\
    \ A protocol declares a set of methods, and an adopting class may choose to implement\
    \ one or more of its declared methods. The class that defines the protocol is\
    \ expected to call the methods in the protocols that are implemented by the adopting\
    \ class.\n\nThe easiest way to understand protocols is to examine the UIAlertView\
    \ class. As you have experienced in the various chapters in this book, you can\
    \ simply use the UIAlertView class by creating an instance of it and then calling\
    \ its show method:\n\n```\n```objc\nUIAlertView *alert = [[UIAlertView alloc]\n\
    \    initWithTitle:@\"Hello\"\n    message:@\"This is an alert view\"\n    delegate:self\n\
    \    cancelButtonTitle:@\"OK\"\n    otherButtonTitles:nil];\n[alert show];\n```\n\
    ```\n\nThe preceding code displays an alert view with one button — OK. Tapping\
    \ the OK button automatically dismisses the alert view. If you want to display\
    \ additional buttons, you can set the otherButtonTitles: parameter like this:\n\
    \n```\n```objc\nUIAlertView *alert = [[UIAlertView alloc]\n    initWithTitle:@\"\
    Hello\"\n    message:@\"This is an alert view\"\n    delegate:self\n    cancelButtonTitle:@\"\
    OK\"\n    otherButtonTitles:@\"Option 1\", @\"Option 2\", nil];\n```\n```\n\n\
    The alert view now displays three buttons — OK, Option 1, and Option 2. But how\
    \ do you know which button was tapped by the user? You can determine this by handling\
    \ the relevant method(s) that will be fired by the alert view when the buttons\
    \ are clicked. This set of methods is defined by the UIAlertViewDelegate protocol.\
    \ This protocol defines the following methods:\n\n+   - alertView:clickedButtonAtIndex:\n\
    +   - willPresentAlertView:"
