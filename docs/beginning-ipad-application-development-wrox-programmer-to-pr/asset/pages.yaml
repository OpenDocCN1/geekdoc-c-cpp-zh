  md: "```\naddress = [[service addresses] objectAtIndex: i];\nsocketAddress = (struct\
    \ sockaddr_in *) [address bytes];\nipString = [NSString stringWithFormat:@\"%s\"\
    , inet_ntoa(socketAddress->sin_addr)];\nport = socketAddress->sin_port;\ndebug.text\
    \ = [debug.text stringByAppendingFormat:\n    @\"Resolved: %@->%s:%hu\\n\", [service\
    \ hostName], ipString, port];\n}\n[self.tbView reloadData];\n}\n```\n\nWhen services\
    \ are removed from the network, the netServiceBrowser:didRemoveService: method\
    \ will be called, and hence in this method you will remove the service from the\
    \ services mutable array:\n\n```\n-(void)netServiceBrowser:(NSNetServiceBrowser\
    \ *)aBrowser\ndidRemoveService:(NSNetService *)aService moreComing:(BOOL)more\
    \ {\n[services removeObject:aService];\ndebug.text = [debug.text stringByAppendingFormat:@\"\
    Removed: %@\\n\", [aService hostName]];\n[self.tbView reloadData];\n}\n```\n\n\
    The rest of the code involves loading the Table view with the host name of the\
    \ services that have been discovered. In particular, you display the host name\
    \ of each service in the Table view:\n\n```\n//---display the individual rows\
    \ in the TableView---\n- (UITableViewCell *)tableView:(UITableView *)tableView\n\
    cellForRowAtIndexPath:(NSIndexPath *)indexPath {\n\nstatic NSString *CellIdentifier\
    \ = @\"Cell\";\n\nUITableViewCell *cell = [tableView\ndequeueReusableCellWithIdentifier:CellIdentifier];\n\
    if (cell == nil) {\n    cell = [[UITableViewCell alloc]\n        initWithStyle:UITableViewCellStyleDefault\n\
    \        reuseIdentifier:CellIdentifier] autorelease];\n}\n\n//---display the\
    \ hostname of each service---\ncell.textLabel.text = [[services objectAtIndex:indexPath.row]\
    \ hostName];\n\nreturn cell;\n}\n```\n\nWith peers on the network discovered,\
    \ what can you do next? You can use TCP/IP to connect with your peers on the network\
    \ and send messages to them. Using TCP/IP for networking is beyond the scope of\
    \ this book. However, interested users can download a working application from\
    \ the author's website — http://www.learn2develop.net — that illustrates how to\
    \ build a chat application using Bonjour."
