  md: "# How It Works\n\nYou actually start the application in step 7 by creating\
    \ an `NSMutableArray` object called `listOfMovies` containing a list of movie\
    \ names. The items stored in this array will be displayed by the Table view.\n\
    \n```\n```objc\n- (void)viewDidLoad {\n    //---initialize the array---\n    listOfMovies\
