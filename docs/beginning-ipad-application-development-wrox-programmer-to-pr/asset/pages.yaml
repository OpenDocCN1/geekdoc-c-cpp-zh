- pgno: 567
  md: "```\n//...\n}\nreturn self;\n}\n```\n\nThe rule for defining an initializer\
    \ is simple: If a class is initialized properly, it should return a reference\
    \ to self (hence the id type). If it fails, it should return nil.\n\nFor the initWithName:\
    \ initializer implementation, notice that it calls the initWithName:andRate: initializer:\n\
    \n```\n- (id)initWithName:(NSString *) n {\n    return [self initWithName:n andRate:0.0f];\n\
    }\n```\n\nIn general, if you have multiple initializers, each with different parameters,\
    \ you should chain them by ensuring that they all call a single initializer that\
    \ performs the call to the super class's init initializer. In Objective-C, the\
    \ initializer that performs the call to the super class's init initializer is\
    \ called the designated initializer.\n\n> NOTE As a general guide, the designated\
    \ initializer should be the one with the greatest number of parameters.\n\nTo\
    \ use the initializers, you can now call them during instantiation time:\n\n```\n\
    SomeClass *sc1 = [[SomeClass alloc] initWithName:@\"Wei-Meng Lee\" andRate:35];\n\
    SomeClass *sc2 = [[SomeClass alloc] initWithName:@\"Wei-Meng Lee\"];\n```\n\n\
    # MEMORY MANAGEMENT\n\nMemory management in Objective-C programming (especially\
    \ for iPad) is a very important topic that every iPad developer needs to be aware\
    \ of. As do all other popular languages, Objective-C supports garbage collection,\
    \ which helps to remove unused objects when they go out of scope and hence releases\
    \ memory that can be reused. However, because of the severe overhead involved\
    \ in implementing garbage collection, the iPad does not support garbage collection.\
    \ This leaves you, the developer, to manually allocate and de-allocate the memory\
    \ of objects when they are no longer needed.\n\nThis section discusses the various\
    \ aspects of memory management on the iPad.\n\n# Reference Counting\n\nTo help\
    \ you allocate and de-allocate memory for objects, the iPhone OS uses a scheme\
    \ known as reference counting to keep track of objects to determine whether they\
    \ are still needed or can be disposed of. Reference counting basically uses a\
    \ counter for each object, and as each object is created, the count increases\
    \ by 1. When an object is released, the count decreases by 1. When the count reaches\
    \ 0, the memory associated with the object is reclaimed by the OS."
