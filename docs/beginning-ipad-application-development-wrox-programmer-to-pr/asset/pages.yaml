- pgno: 600
  md: '# Related Wrox Books


    # Beginning iPhone SDK Programming with Objective-C


    ISBN: 978-0-470-50097-2


    This information-packed book presents a complete introduction to the iPhone SDK
    and the Xcode tools, as well as the Objective-C language that is necessary to
    create native iPhone applications. Solid coverage and real-world examples walk
    you through the process for developing mobile applications for the iPhone that
    can then be distributed through Apple''s iTunes Application store.


    # Beginning Mac OS X Snow Leopard Programming


    ISBN: 978-0-470-57752-3


    This book serves as a solid guide to getting started with Mac OS X programming.
    You will learn how to use the free software development tools that come with all
    Mac OS X systems to efficiently start writing programs on Mac OS X Snow Leopard.
    The author shows you how to use all of the programming languages together in order
    to create seamless applications.


    # Professional Android 2 Application Development


    ISBN: 978-0-470-56552-0


    Written by an Android authority, this resource shows you how to leverage the features
    of Android 2 to enhance existing products or create innovative new ones. The author
    walks you through a series of sample projects that introduces you to Android''s
    new features and techniques.


    # Professional Xcode 3


    ISBN: 978-0-470-52522-7


    The steady increase in sales of Apple computers has triggered a strong interest
    in gaining a thorough understanding of Xcode and its tools and what they have
    to offer. This book provides you with an inside look at the array of Xcode tools
    from top to bottom. You''ll go beyond the basics and dive into such in-depth topics
    as installing the latest version of Xcode tools, customizing the look and behavior
    of Xcode, creating and managing projects, using the built-in class browser to
    model complex applications and structures, and more. With this book, you''ll be
    able to take full advantage of the range of tools included with Xcode.


    # Safari and WebKit Development for iPhone OS 3.0


    ISBN: 978-0-470-54966-7


    With the unparalleled success of iPhone and iPod touch, iPhone OS 3.0 has emerged
    as a compelling platform for which vast numbers of web developers are designing
    and building web-based mobile applications. This book explores the Safari and
    WebKit development platform that is built into iPhone OS 3.0 and takes you through
    the process of creating an iPhone web application from the ground up. You''ll
    learn how to use existing open source frameworks to speed up your development
    time, imitate qualities of built-in Apple apps, cache data locally and even run
    in offline mode, and more. Whether you''re eager to build new web applications
    for iPhone OS 3.0 or optimize existing web sites for this platform, you have everything
    you need to do so within this book.'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# Learn to develop successful—and profitable—iPad applications


    Eager to start developing applications for the iPad? Then look no further than
    the book in your hands. This comprehensive, hands-on approach to iPad development
    walks you through all the necessary tools and skills required for successful iPad
    app programming. You''ll first familiarize yourself with the iPhone® SDK, Xcode®,
    and Interface Builder tools, all of which provide a solid foundation for developing
    apps. You''ll then explore the features and syntax of the Objective-C™ language,
    which is essential for creating most iPad apps. Plus, you''ll discover how to
    best implement the many features of the iPhone SDK into your apps so that you
    can deploy your applications to the Apple AppStore.


    # Beginning iPad Application Development:


    +   - Explains the various types of iPad applications supported by the iPhone
    SDK

    +   - Discusses the various types of screen orientations and ways to handle rotations

    +   - Covers the new Gesture Recognizers available in this release of the iPhone
    SDK

    +   - Covers the new Split View-based Application project type

    +   - Zeroes in on database storage using SQLite3

    +   - Examines Web Services, Bluetooth programming, and Bonjour programming

    +   - Covers Apple Push Notification Services programming


    Wei-Meng Lee is a technologist and founder of Developer Learning Solutions, a
    technology company specializing in hands-on training in the latest Microsoft and
    Apple technologies. He is also the author of Beginning iPhone SDK Programming
    with Objective-C and writes frequently for online publications.


    Wrox Beginning guides are crafted to make learning programming languages and technologies
    easier than you think, providing a structured, tutorial format that will guide
    you through all the techniques involved.


