- pgno: 367
  md: "# How It Works\n\nThis application works by sensing the user's touch on the\
    \ screen of the iPad. When the user touches the screen, the View or View Controller\
    \ fires a series of events that you can handle. There are four such events:\n\n\
    +   - `touchesBegan:withEvent:`\n+   - `touchesEnded:withEvent:`\n+   - `touchesMoved:withEvent:`\n\
    +   - `touchesCancelled:withEvent:`\n\nTake a closer look at the first event.\
    \ The touchesBegan:withEvent: event is fired when at least one touch is sensed\
    \ on the screen. In this event, you can know how many fingers are on the screen\
    \ by calling the allTouches method of the UIEvent object (event):\n\n```\n```objc\n\
    //---get all touches on the screen---\nNSSet *allTouches = [event allTouches];\n\
    ```\n```\n\nThe allTouches method returns an NSSet object containing a set of\
    \ UITouch objects. To know how many fingers are on the screen, simply count the\
    \ number of UITouch objects in the NSSet object using the count method. In this\
    \ case, you are (at this moment) interested only in a single touch, therefore\
    \ you implement only the case for one touch:\n\n```\n```objc\n//---compare the\
    \ number of touches on the screen---\nswitch ([allTouches count])\n{\n    //---single\
    \ touch---\n    case 1: {\n        //---get info of the touch---\n        UITouch\
    \ *touch = [[allTouches allObjects] objectAtIndex:0];\n\n        //---compare\
    \ the taps---\n        switch ([touch tapCount])\n        {\n            //---single\
    \ tap---\n            case 1: {\n                imageView.contentMode = UIViewContentModeScaleAspectFit;\n\
    \            } break;\n\n            //---double tap---\n            case 2: {\n\
    \                imageView.contentMode = UIViewContentModeCenter;\n          \
    \  } break;\n        }\n    } break;\n}\n```\n```\n\nYou extract details of the\
    \ first touch by using the allObjects method of the NSSet object to return an\
    \ NSArray object. You then use the objectAtIndex: method to obtain the first array\
    \ item.\n\nThe UITouch object (touch) contains the tapCount property, which tells\
    \ you whether the user has single-tapped the screen or performed a double tap\
    \ (or more). If the user single-tapped the screen, you resize the"
  merge: -1
  img_proc: true
- pgno: 368
  md: 'image to fit the entire ImageView view using the UIViewContentModeScaleAspectFit
    constant. If it is a double-tap, you restore it to its original size using the
    UIViewContentModeCenter constant.


    The other three events are not discussed in this section. The touchesEnded:withEvent:
    event is fired when the user''s finger(s) is lifted from the screen. The touchesMoved:withEvent:
    event is fired continuously when the user''s finger or fingers are touching and
    moving on the screen. Finally, if the application is interrupted while the user''s
    finger is on the screen, the touchesCancelled:withEvent: event is fired.


    > NOTE In addition to detecting taps in the touchesBegan:withEvent: event, you
    can also detect them in the touchesEnded:withEvent: event.


    In the next section, you learn how to detect multi-touches in your application.


    # UNDERSTANDING MULTI-TAPPING


    When a user performs a multi-tap on the screen, your application will fire the
    touchesBegan: and touchesEnded: events multiple times. For example, if the user
    taps on the screen once, the touchesBegan: and touchesEnded: events will be fired
    once, with the tapCount property of the UITouch object returning a value of 1.
    However, if the user taps the screen twice (in quick succession), then the touchesBegan:
    and touchesEnded: events will be fired twice; the first time these events are
    fired, the tapCount property will be 1, the second time the tapCount property
    will be 2.


    Understanding the way multi-taps are detected is important because if you are
    detecting double-taps your application might redundantly execute blocks of code
    that are designed for single-tap. For example, in the preceding Try It Out, double-tapping
    on the image will first try to change the mode of the image to UIViewContentModeScaleAspectFit
    (which is what single-tap is supposed to do; in this case, because the image is
    already in the UIViewContentModeScaleAspectFit mode, the user won''t notice any
    difference), then it changes back to the UIViewContentModeCenter mode (which is
    what double-tap is supposed to do). Ideally, it should not need to execute the
    block of code for single-tap.


    To solve this problem, you have to write some code to check if a second tap is
    indeed coming:


    +   - When a single-tap is detected, use a timer using an NSTimer object.

    +   - When a double-tap is detected, stop the timer and check to see if the time
    difference between the second tap and the first tap is small enough (such as a
    fraction of a second) to constitute a double-tap. If it is, execute the code for
    double-tap. If it isn''t, execute the code for single-tap.


    If you are simply detecting for multi-taps in your application, the easiest method
    is to use the UITapGestureRecognizer, illustrated earlier.'
  merge: -1
  img_proc: true
- pgno: 369
  md: "# Detecting Multi-touches\n\nDetecting multi-touches is really very simple\
    \ once you understand the concepts in the previous section. The capability to\
    \ detect for multi-touches is very useful because you can use that to zoom in\
    \ on views in your application.\n\nThe following Try It Out demonstrates how to\
    \ detect multi-touches.\n\n# TRY IT OUT Detecting Multi-touches\n\n+   1. Using\
    \ the same project created in the previous section, modify the `touchesBegan:withEvent:`\
    \ method by adding the following statements that appear in bold:\n\n```\n- (void)\
    \ touchesBegan: (NSSet *) touches withEvent: (UIEvent *) event {\n    //---get\
    \ all touches on the screen---\n    NSSet *allTouches = [event allTouches];\n\n\
    \    //---compare the number of touches on the screen---\n    switch ([allTouches\
    \ count])\n    {\n        //---single touch---\n        case 1: {\n          \
    \  //---get info of the touch---\n            UITouch *touch = [[allTouches allObjects]\
    \ objectAtIndex:0];\n\n            //---compare the taps---\n            switch\
    \ ([touch tapCount])\n            {\n                //---single tap---\n    \
    \            case 1: {\n                    imageView.contentMode = UIViewContentModeScaleAspectFit;\n\
    \                } break;\n                case 2: {\n                    imageView.contentMode\
    \ = UIViewContentModeCenter;\n                } break;\n            }\n      \
    \  } break;\n\n        //---double-touch---\n        case 2: {\n            //---get\
    \ info of first touch---\n            UITouch *touch1 = [[allTouches allObjects]\
    \ objectAtIndex:0];\n\n            //---get info of second touch---\n        \
    \    UITouch *touch2 = [[allTouches allObjects] objectAtIndex:1];\n\n        \
    \    //---get the points touched---\n            CGPoint touch1PT = [touch1 locationInView:[self\
    \ view]];\n            CGPoint touch2PT = [touch2 locationInView:[self view]];\n\
    \n            NSLog(@\"Touch1: %.0f, %.0f\", touch1PT.x, touch1PT.y);\n      \
    \      NSLog(@\"Touch2: %.0f, %.0f\", touch2PT.x, touch2PT.y);\n```"
