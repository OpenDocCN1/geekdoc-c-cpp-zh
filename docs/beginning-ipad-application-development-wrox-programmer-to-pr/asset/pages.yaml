  md: 'You can add items to the toolbar by right-clicking the toolbar and selecting
    Customize Toolbar. A drop-down pane then shows all the items that you can add
    to the toolbar (see Figure B-5). To add an item to the toolbar, drag it directly
    onto the toolbar.


    ![](img/744c5ec15e15ca7891c98be71dc25d13_534_0.png)


    # Code Sense


    One of the most common features of modern IDE is *code completion*, which makes
    the IDE automatically try to complete the statement you are typing based on the
    current context. In Xcode, the code-completion feature is known as Code Sense.
    For example, type the letters uial in a method, such as the viewDidLoad() method,
    and Code Sense automatically suggests the UIAlertView class (see Figure B-6; notice
    that the suggested characters are displayed in gray). To accept the suggested
    word, simply press the Tab or Enter key, or Ctrl-/.


    ![](img/744c5ec15e15ca7891c98be71dc25d13_534_1.png)


    You can also invoke the Code Sense feature by pressing the Esc key (or press F5).
    Code Sense displays a list of words starting with the letters you have typed (see
    Figure B-7).'
