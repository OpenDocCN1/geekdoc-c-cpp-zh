- pgno: 526
  md: '# ## DiT4Edit: 图像编辑的可扩展扩散 Transformer


    Kunyang Han1,2 · Lv Tang2 · Qi Chu2 · Zongxin Yang2 · Junjing Guo2 · Bin Liu2
    · Zhiyuan Zhao2 · Zhenchao Tang2 · Nenghai Yu2


    1 浙江大学 2 中国科学技术大学


    通讯作者: binliu@ustc.edu.cn; yunh@ustc.edu.cn


    **摘要。** 扩散 Transformer (DiT) 在图像生成领域表现出色，但在图像编辑领域尚未充分探索。在本文中，我们提出了一个简单而强大的可扩展
    DiT 框架，用于图像编辑。我们通过直接以文本条件作为输入来统一不同的编辑任务，并设计了一种新颖的互注意力机制来促进文本与图像令牌之间的交互。考虑到编辑任务对细节保持的高要求，我们提出的模型
    (a) 有效处理高频细节的保留，(b) 全面解决多轮编辑中的累积误差问题，以及 (c) 在真实编辑场景中实现卓越的鲁棒性和可扩展性。大量实验证明，我们的方法在定性和定量评估中均达到了最先进水平。


    **关键词: 扩散 transformers · 图像编辑 · 互注意力**


    ![](img/744c5ec15e15ca7891c98be71dc25d13_526_0.png)


    **图 1:** DiT4Edit、Adobe Firefly、InstructPix2Pix、UltraEdit 和 MGEdit 在简单多轮编辑和真实局部编辑场景下的定性比较。


    # ## 1 引言


    近年来，随着扩散模型的出现，图像生成领域经历了深刻的范式转变[27, 40, 42]。尤其是扩散 Transformer (DiT) [35] 的引入，代表了一次关键的理论演进，将扩散模型中的传统
    U-Net 骨干网络[41] 替换为基于 Transformer 的架构。这一变化之所以重要，不仅仅因为它是一种架构上的替代；它构成了向可扩展且灵活的统一框架的根本转变。通过利用
    Transformer 架构，DiT 实现了显著的可扩展性，并受益于大规模预训练，使其成为广泛生成应用中通用且强大的骨干网络。


    然而，DiT 在图像生成中的成功并未平滑地迁移到图像编辑领域。图像生成和图像编辑之间的一个根本区别在于条件机制。在图像编辑中，条件不仅包括简单的类别标签或文本描述，还包括输入图像，而输入图像通常包含需要与用户指令结合考虑的高频细节。这些额外的复杂性使得将
    DiT 直接应用于图像编辑任务变得颇具挑战。尽管诸如基于 UNet 的图像编辑方法[3, 4, 13, 15, 16] 以及最近基于 DiT 的尝试[7,
    44] 探索了这一方向，但现有方法通常在编辑保真度、多轮稳定性和真实场景的泛化能力方面存在不足。我们深入研究了这些挑战，确定了三个核心问题：


    +   1. **高频保留。** 在编辑过程中保留图像的高频细节，对于保持高质量的编辑效果至关重要。然而，Autoencoder (AE) 在对输入图像进行下采样时通常存在高频信息丢失的问题。因此，在生成过程中需要额外的高频补偿机制。现有方法通常通过将输入图像直接馈送到当前采样步骤来缓解此问题[22]，但这种做法导致交互不足，并且限制了模型控制输入条件的能力。


    +   2. **多轮累积误差。** 多轮编辑要求模型在前一轮编辑结果的基础上进行迭代改进，而现有方法往往在传播过程中引入误差和噪声。'
  merge: -1
  img_proc: true
