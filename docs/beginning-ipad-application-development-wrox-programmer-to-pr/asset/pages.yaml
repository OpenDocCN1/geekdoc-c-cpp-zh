  md: "![](img/744c5ec15e15ca7891c98be71dc25d13_426_0.png)\n\nFIGURE 15-4\n\n![](img/744c5ec15e15ca7891c98be71dc25d13_426_1.png)\n\
    \nFIGURE 15-5\n\n![](img/744c5ec15e15ca7891c98be71dc25d13_426_2.png)\n\nFIGURE\
    \ 15-6\n\n# How It Works\n\nThe GKSession object is used to represent a session\
    \ between two connected Bluetooth devices. You use it to send and receive data\
    \ between the two devices. Hence, you first create a variable of type GKSession:\n\
    \n```\nGKSession *currentSession;\n```\n\nThe GKPeerPickerController class provides\
    \ a standard UI to let your application discover and connect to another Bluetooth\
    \ device. This is the easiest way to connect to another Bluetooth device.\n\n\
    To discover and connect to another Bluetooth device, implement the btnConnect:\
    \ method as follows:\n\n```\n- (IBAction) btnConnect:(id) sender {\n  picker =\
    \ [[GKPeerPickerController alloc] init];\n  picker.delegate = self;\n  picker.connectionTypesMask\
    \ = GKPeerPickerConnectionTypeNearby;\n\n  [connect setHidden:YES];\n  [disconnect\
    \ setHidden:NO];\n  [picker show];\n}\n```\n\nThe connectionTypesMask property\
    \ indicates the types of connections that the user can choose from. There are\
    \ two types available: GKPeerPickerConnectionTypeNearby and GKPeerPickerConnectionTypeOnline.\
    \ For Bluetooth communication, use the GKPeerPickerConnectionTypeNearby constant.\
    \ The GKPeerPickerConnectionTypeOnline constant indicates an Internet-based connection.\n\
    \nWhen remote Bluetooth devices are detected and the user has selected and connected\
    \ to one of them, the peerPickerController:didConnectPeer:toSession: method is\
    \ called. It is implemented as follows:\n\n```\n- (void)peerPickerController:(GKPeerPickerController\
    \ *)picker\n  didConnectPeer:(NSString *)peerID\n  toSession:(GKSession *) session\
    \ {\n  self.currentSession = session;\n  session.delegate = self;\n  [session\
    \ setDataReceiveHandler:self withContext:nil];\n  picker.delegate = nil;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 427
  md: "```\n[picker dismiss];\n[picker autorelease];\n}\n```\n\nWhen the user has\
    \ connected to the peer Bluetooth device, you save the `GKSession` object to the\
    \ `currentSession` property. This enables you to use the `GKSession` object to\
    \ communicate with the remote device.\n\nIf the user cancels the Bluetooth Picker,\
    \ the `peerPickerControllerDidCancel:` method is called. It's defined as follows:\n\
    \n```\n- (void)peerPickerControllerDidCancel:(GKPeerPickerController *)picker\
    \ {\n    picker.delegate = nil;\n    [picker autorelease];\n    \n    [connect\
    \ setHidden:NO];\n    [disconnect setHidden:YES];\n}\n```\n\nTo disconnect from\
    \ a connected device, use the `disconnectFromAllPeers` method from the `GKSession`\
    \ object:\n\n```\n-(IBAction)btnDisconnect:(id)sender {\n    [self.currentSession\
    \ disconnectFromAllPeers];\n    [self.currentSession release];\n    currentSession\
    \ = nil;\n    \n    [connect setHidden:NO];\n    [disconnect setHidden:YES];\n\
    }\n```\n\nWhen a device is connected or disconnected, the `session:peer:didChangeState:`\
    \ method is called:\n\n```\n- (void)session:(GKSession *)session\n         peer:(NSString\
    \ *)peerID\n    didChangeState:(GKPeerConnectionState)state {\n    switch (state)\
    \ {\n        case GKPeerStateConnected:\n            NSLog(@\"connected\");\n\
    \            break;\n        case GKPeerStateDisconnected:\n            NSLog(@\"\
    disconnected\");\n            [self.currentSession release];\n            currentSession\
    \ = nil;\n            \n            [connect setHidden:NO];\n            [disconnect\
    \ setHidden:YES];\n            break;\n    }\n}\n```\n\nHandling this event allows\
    \ you to know when a connection is established or ended. For example, when the\
    \ connection is established, you might want to immediately start sending data\
    \ over to the other device."
