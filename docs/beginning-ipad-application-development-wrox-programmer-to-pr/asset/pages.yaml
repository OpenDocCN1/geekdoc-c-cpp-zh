- pgno: 41
  md: '# COMPONENTS OF THE IPHONE SDK


    The iPhone SDK includes a suite of development tools to help you develop applications
    for your iPhone, iPod touch, and iPad. It includes:


    +   - Xcode — Integrated development environment (IDE) that enables you to manage,
    edit, and debug your projects.

    +   - Dashcode — Integrated development environment (IDE) that allows you to develop
    web-based iPhone and iPad applications and Dashboard Widgets. Dashcode is beyond
    the scope of this book.

    +   - iPhone Simulator — Provides a software simulator to simulate an iPhone or
    an iPad on your Mac.

    +   - Interface Builder — Visual editor for designing your user interfaces for
    your iPhone and iPad applications.

    +   - Instruments — Analysis tool to help you optimize your application and monitor
    for memory leaks in real-time.


    The following sections discuss each tool (except Dashcode) in more detail.


    # Xcode


    To launch Xcode, double-click the Xcode icon (located in the /Developer/Applications
    folder; refer to Figure 1-3). Alternatively, go the quicker route and use Spotlight:
    simply type Xcode into the search box and Xcode should be in the Top Hit position.


    Figure 1-4 shows the Xcode Welcome screen.


    ![](img/744c5ec15e15ca7891c98be71dc25d13_41_0.png)


    FIGURE 1-4'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Using Xcode, you can develop different types of iPhone, iPad, and Mac OS X
    applications using the various project templates shown in Figure 1-5.


    ![](img/744c5ec15e15ca7891c98be71dc25d13_42_0.png)


    FIGURE 1-5


    The IDE in Xcode provides many tools and features that make your development life
    much easier. One such feature is Code Completion (see Figure 1-6), which displays
    a pop-up list showing the available classes and members (such as methods, properties,
    and so on).


    > NOTE For a more comprehensive description of some of the most commonly used
    features in Xcode, refer to Appendix B.


    # iPhone Simulator


    The iPhone Simulator (see Figure 1-7) is a very useful tool that you can use to
    test your application without using your actual iPhone/iPod touch/iPad. The iPhone
    Simulator is located in the `/Developer/Platforms/iPhoneSimulator.platform/Developer/Applications`
    folder. Most of the time, you don''t need to launch the iPhone Simulator directly
    — running (or debugging) your application in Xcode automatically brings up the
    iPhone Simulator. Xcode installs the application on the iPhone Simulator automatically.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/744c5ec15e15ca7891c98be71dc25d13_43_0.png)


    FIGURE 1-6


    # THE IPHONE SIMULATOR IS NOT AN EMULATOR


    The iPhone Simulator is a simulator, not an emulator. So what is the difference?
    Well, a simulator tries to mimic the behavior of a real device. In the case of
    the iPhone Simulator, it simulates the real behavior of an actual iPhone/iPad
    device. However, the simulator itself uses the various libraries installed on
    the Mac (such as QuickTime) to perform its rendering so that the effect looks
    the same as an actual iPhone. Also, applications tested on the simulator are compiled
    into x86 code, which is the byte-code understood by the simulator.


    In contrast, an emulator emulates the working of a real device. Applications tested
    on an emulator are compiled into the actual byte-code used by the real device.
    The emulator executes the application by translating the byte-code into a form
    that can be executed by the host computer running the emulator.


    A good way to understand the subtle difference between simulation and emulation
    is this: Imagine you are trying to convince a child that playing with knives is
    dangerous. To simulate this, you pretend to cut yourself with a knife and groan
    in pain. To emulate this, you hold a knife and actually cut yourself.'
  merge: -1
  img_proc: true
- pgno: 44
