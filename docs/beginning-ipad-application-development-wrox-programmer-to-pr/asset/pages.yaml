    # How It Works


    In iPad, you use actions and outlets to connect your code to the various views
    in your UI. Think of actions as methods in the traditional object-oriented programming
    world and outlets as objects references. Actions are represented using the IBAction
    keyword while outlets use the IBOutlet keyword:


    ```

    #import <UIKit/UIKit.h>


    @interface OutletsAndActionsViewController : UIViewController {

    ```'
