- pgno: 53
  md: '+   - 2.0 — Released with iPhone 3G; comes with App Store

    +   - 2.1 — Additional features and bug fixes for 2.0

    +   - 2.2 — Additional features and bug fixes for 2.1

    +   - 3.0 — Third major release of the iPhone OS

    +   - 3.1 — Additional features and bug fixes for 3.0

    +   - 3.2 — This version release for iPad only; see the sidebar for what is new
    in iPhone OS 3.2


    For a detailed description of the features in each release, check out http://en.wikipedia.org/wiki/iPhone_OS_version_history.


    # WHAT''S NEW IN IPHONE OS 3.2


    In January 2010, Apple announced a new device based on the existing iPhone OS
    — the iPad. The iPad is a tablet computer that resembles an iPod touch, except
    that it has a much bigger screen. The iPad comes in six different editions, three
    with Wi-Fi and another three with Wi-Fi and 3G networks. The iPad will be released
    in three storage configurations: 16GB, 32GB, and 64GB.


    Some of the important new features of iPhone OS 3.2 include:


    +   - Support for existing iPhone applications by running them either in their
    original screen size or in pixel-doubled mode.

    +   - New UI features such as Popovers, Split Views, and Custom Input Views.

    +   - Support for external displays.

    +   - Support for gestures detection using Gestures Recognizers.

    +   - Improved Text support to allow applications to have more sophisticated text-handling
    capabilities.

    +   - New File and Document support to facilitate building document-centric applications.


    # Testing on Real Devices


    One of the most common complaints that beginning iPad programmers made was about
    the inability to test iPad applications they have developed on their actual devices.
    It seems odd that as the owner of the device, they can''t even test their applications
    on it. Turns out that for security reasons, Apple requires all applications to
    be signed with a valid certificate, and for testing purposes, a developer certificate
    is required.


    To test your applications on a device, you must sign up for the iPhone Developer
    program and request that a developer certificate be installed onto your device.'
