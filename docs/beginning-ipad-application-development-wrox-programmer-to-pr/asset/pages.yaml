  md: "> **NOTE** Using the iPhone Simulator, the coordinates for the two touches\
    \ are often interchanged as you Option-click the same spot on the screen of the\
    \ Simulator.\n\n# Implementing the Pinch Gesture\n\nYou can combine the `UIPinchGestureRecognizer`,\
    \ which you used earlier in this chapter, with what you've just learned about\
    \ detecting for multi-touches to implement your own pinch gesture recognizer.\n\
    \nIn the earlier pinch gesture example, you used the `CGAffineTransformMakeScale()`\
    \ method to alter the size of the image. In this example, you will see another\
    \ technique for changing the size of an image in the ImageView — you will alter\
    \ the size of the image as it is being pinched.\n\nIn the following Try It Out,\
