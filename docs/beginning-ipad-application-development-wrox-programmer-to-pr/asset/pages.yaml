- pgno: 307
  md: "# CREATING AND OPENING A DATABASE\n\nAfter the necessary library is added to\
    \ the project, you can open a database for usage. You will use the various C functions\
    \ included with SQLite3 to create or open a database, as demonstrated in the following\
    \ Try It Out.\n\n# TRY IT OUT  Opening a Database\n\n+   1. Using the Databases\
    \ project created previously, define the openDB method in the DatabasesViewController.m\
    \ file:\n\n```\n#import \"DatabasesViewController.h\"\n\n@implementation DatabasesViewController\n\
    \n-(NSString *) filePath {\n    //...\n}\n\n-(void) openDB {\n    //---create\
    \ database---\n    if (sqlite3_open([[self filePath] UTF8String], &db) != SQLITE_OK\
    \ ) {\n        sqlite3_close(db);\n        NSAssert(0, @\"Database failed to open.\"\
    );\n    }\n}\n\n- (void)viewDidLoad {\n    [self openDB];\n    [super viewDidLoad];\n\
    }\n\n@end\n```\n\n# How It Works\n\nThe sqlite3_open() C function opens a SQLite\
    \ database whose filename is specified as the first argument:\n\n`[[self filePath]\
    \ UTF8String]`\n\nIn this case, the filename of the database is specified as a\
    \ C string using the UTF8String method of the NSString class because the sqlite3_open()\
    \ C function does not understand an NSString object.\n\nThe second argument contains\
    \ a handle to the sqlite3 object, which in this case is db.\n\nIf the database\
    \ is available, it opens the database. If the specified database is not found,\
    \ a new database is created. If the database is successfully opened, the function\
    \ will return a value of 0 (represented using the SQLITE_OK constant)."
  merge: -1
  img_proc: true
- pgno: 308
  md: 'The following list from http://www.sqlite.org/c3ref/c_abort.html shows the
    result codes returned by the various SQLite functions:


    ```

    #define SQLITE_OK 0 /* Successful result */

    #define SQLITE_ERROR 1 /* SQL error or missing database */

    #define SQLITE_INTERNAL 2 /* Internal logic error in SQLite */

    #define SQLITE_PERM 3 /* Access permission denied */

    #define SQLITE_ABORT 4 /* Callback routine requested an abort */

    #define SQLITE_BUSY 5 /* The database file is locked */

    #define SQLITE_LOCKED 6 /* A table in the database is locked */

    #define SQLITE_NOMEM 7 /* A malloc() failed */

    #define SQLITE_READONLY 8 /* Attempt to write a readonly database */

    #define SQLITE_INTERRUPT 9 /* Operation terminated by sqlite3_interrupt() */

    #define SQLITE_IOERR 10 /* Some kind of disk I/O error occurred */

    #define SQLITE_CORRUPT 11 /* The database disk image is malformed */

    #define SQLITE_NOTFOUND 12 /* NOT USED. Table or record not found */

    #define SQLITE_FULL 13 /* Insertion failed because database is full */

    #define SQLITE_CANTOPEN 14 /* Unable to open the database file */

    #define SQLITE_PROTOCOL 15 /* NOT USED. Database lock protocol error */

    #define SQLITE_EMPTY 16 /* Database is empty */

    #define SQLITE_SCHEMA 17 /* The database schema changed */

    #define SQLITE_TOOBIG 18 /* String or BLOB exceeds size limit */

    #define SQLITE_CONSTRAINT 19 /* Abort due to constraint violation */

    #define SQLITE_MISMATCH 20 /* Data type mismatch */

    #define SQLITE_MISUSE 21 /* Library used incorrectly */

    #define SQLITE_NOLFS 22 /* Uses OS features not supported on host */

    #define SQLITE_AUTH 23 /* Authorization denied */

    #define SQLITE_FORMAT 24 /* Auxiliary database format error */

    #define SQLITE_RANGE 25 /* 2nd parameter to sqlite3_bind out of range */

    #define SQLITE_NOTADB 26 /* File opened that is not a database file */

    #define SQLITE_ROW 100 /* sqlite3_step() has another row ready */

    #define SQLITE_DONE 101 /* sqlite3_step() has finished executing */

    ```


    # Examining the Database Created


