  md: "> **NOTE** Remember to comment out the statements for the pan gesture recognizer.\
    \ The swipe gesture recognizer will not work with the pan gesture recognizer.\n\
    \n# Long Press\n\nUse the long press gesture recognizer to detect if the user\
    \ is touching on a view and then holding onto it. A very common use of the long\
    \ press gesture is when you want to save an image in the mobile Safari Web browser.\
    \ When you long press on an image, an action sheet pops up, allowing you to save\
    \ or copy that image.\n\nThe following Try It Out shows you how to recognize for\
    \ long press using the UILongPressGestureRecognizer.\n\n# TRY IT OUT  Recognizing\
    \ Long Presses\n\n+   1. Using the same project created in the previous Try It\
    \ Out, edit the GesturesViewController.m by adding the following bold statements:\n\
    \n```\n- (void)viewDidLoad {\n    //---tap gesture---\n    UITapGestureRecognizer\
    \ *tapGesture =\n    [[UITapGestureRecognizer alloc]\n        initWithTarget:self\n\
    \        action:@selector(handleTapGesture:)];\n    tapGesture.numberOfTapsRequired\
    \ = 2;\n    [self.imageView addGestureRecognizer:tapGesture];\n    [tapGesture\
    \ release];\n    //---pinch gesture---\n    UIPinchGestureRecognizer *pinchGesture\
    \ =\n    [[UIPinchGestureRecognizer alloc]\n        initWithTarget:self\n    \
    \    action:@selector(handlePinchGesture:)];\n    [imageView addGestureRecognizer:pinchGesture];\n\
    \    [pinchGesture release];\n    //---rotate gesture---\n    UIRotationGestureRecognizer\
    \ *rotateGesture =\n    [[UIRotationGestureRecognizer alloc]\n        initWithTarget:self\n\
