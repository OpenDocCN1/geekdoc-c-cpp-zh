    ![](img/744c5ec15e15ca7891c98be71dc25d13_456_1.png)


    FIGURE 17-3


    # How It Works


    This part is straightforward — use the Keychain Access application to generate
    a certificate request so that you can send it to Apple later to request for certificates.'
