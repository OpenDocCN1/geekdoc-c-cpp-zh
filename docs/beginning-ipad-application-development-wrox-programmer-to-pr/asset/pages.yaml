    \ class implements the following protocols:\n\n+   - **UIPopoverControllerDelegate**\
    \ — It implements this protocol so that if the PopoverView is about to be dismissed,\
    \ you have a chance to be notified (so you can prevent its dismissal, for example).\n\
    +   - **UISplitViewControllerDelegate** — It needs to implement this protocol\
    \ because when the iPad changes orientation, it needs to hide/display the PopoverView.\n\
    \nExamine the content of the DetailsViewController.m file:\n\n```\n#import \"\
    DetailViewController.h\"\n#import \"RootViewController.h\"\n\n@implementation\
    \ DetailViewController\n\n@synthesize navigationBar, popoverController, detailItem;\n\
    \n/*\n ---Other commented out code are omitted from this code listing---\n */\n\
    \n/*\n When setting the detail item, update the view and dismiss\n the popover\
    \ controller if it's showing.\n */\n- (void)setDetailItem:(id)newDetailItem {\n\
    \    if ([detailItem != newDetailItem]) {\n        [detailItem release];\n   \
    \     detailItem = [newDetailItem retain];\n\n        // Update the view.\n  \
    \      navigationBar.topItem.title = [detailItem description];\n    }\n\n    if\
    \ (popoverController != nil) {\n        [popoverController dismissPopoverAnimated:YES];\n\
    \    }\n}\n\n- (void)splitViewController:(UISplitViewController *)svc\n    willHideViewController:(UIViewController\
    \ *)aViewController\n withBarButtonItem:(UIBarButtonItem *)barButtonItem\n  forPopoverController:(UIPopoverController\
    \ *)pc {\n    barButtonItem.title = @\"Root List\";\n    [navigationBar.topItem\
