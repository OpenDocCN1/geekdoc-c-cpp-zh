- pgno: 389
  md: "```\n- (void)accelerometer:(UIAccelerometer *) acc\ndidAccelerate:(UIAcceleration\
    \ *)acceleration {\n    if (fabsf(acceleration.x) > kAccelerationThreshold) {\n\
    \        NSLog(@\"Shake detected\");\n    }\n}\n```\n\nThe fabsf() function returns\
    \ the absolute value of a floating-point number. In this case, if the X-axis value\
    \ registers an absolute value of more than 2.2, it is deemed that the user is\
    \ shaking the device.\n\n# USING SHAKE API TO DETECT SHAKES\n\nBeginning with\
    \ iPhone OS 3.0, Apple announced the availability of the new Shake API that helps\
    \ you to detect shakes in the device. In reality, this API comes in the form of\
    \ three events that you can handle in your code:\n\n+   - motionBegan:\n+   -\
    \ motionEnded:\n+   - motionCancelled:\n\nThese three events are defined in the\
    \ UIResponder class, which is the super class of UIApplication, UIView, and its\
    \ subclasses (including UIWindow). The following Try It Out shows you how to detect\
    \ shakes to your device using these three events.\n\n# TRY IT OUT  Using the Shake\
    \ API\n\ncodefile Shake.zip available for download at Wrox.com\n\n+   1. Using\
    \ Xcode, create a new View-based Application project and name it Shake.\n+   2.\
    \ Double-click the ShakeViewController.xib file to edit it in Interface Builder.\n\
    +   3. Populate the View window with the following views, and you'll see Figure\
    \ 13-4:\n+      - TextField\n+      - DatePicker\n+   4. Insert the following\
    \ statements that appear in bold into the ShakeViewController.h file:\n\n```\n\
    #import <UIKit/UIKit.h>\n\n@interface ShakeViewController : UIViewController {\n\
    \    IBOutlet UITextField *textField;\n    IBOutlet UIDatePicker *datePicker;\n\
    }\n\n@property (nonatomic, retain) UITextField *textField;\n```"
