  md: '# 13


    # Accessing the Accelerometer


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - How to obtain accelerometer data from your iPad

    +   - How to detect shakes to your device


    iPad''s built-in accelerometer allows your program to detect the orientation of
    the device and adapt the content to suit the new orientation. For example, when
    you rotate your device sideways, the Safari Web browser automatically switches
    the screen to landscape mode so that you now have a wider viewing space.


    In this chapter, you learn how to access the accelerometer and how to use the
    Shake API to detect shakes to your iPad.


    # USING THE ACCELEROMETER


    The accelerometer in iPad measures the acceleration of the device relative to
    freefall. A value of 1 indicates that the device is experiencing 1 g of force
    exerting on it (1 g of force being the gravitational pull of the earth, which
    your device experiences when it is stationary). The accelerometer measures the
    acceleration of the device in three different axes: X, Y, and Z. Figure 13-1 shows
    the different axes measured by the accelerometer. Table 13-1 shows the readings
    of the three axes when the device is in the various positions. Bear in mind that
    you will never see the exact same values as these, because they are always fluctuating
    due to the sensitivity of the accelerometer.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '![](img/744c5ec15e15ca7891c98be71dc25d13_385_0.png)


    # FIGURE 13-1


    # TABLE 13-1: The Various Readings of the X, Y, and Z Axes


    | POSITION | X | Y | Z |

    |---|---|---|---|

    | Vertical upright position | 0.0 | -1.0 | 0.0 |

    | Landscape Left | 1.0 | 0.0 | 0.0 |

    | Landscape Right | -1.0 | 0.0 | 0.0 |

    | Upside Down | 0.0 | 1.0 | 0.0 |

    | Flat Up | 0.0 | 0.0 | -1.0 |

    | Flat Down | 0.0 | 0.0 | 1.0 |


    If iPad is held upright and moved to the right quickly, the value of the X-axis
    will increase from 0 to a positive value. If it is moved to the left quickly,
    the value of the X-axis will decrease from 0 to a negative value. If the device
    is moved upward quickly, the value of the Y-axis will increase from -1.0 to a
    larger value. If the device is moved download quickly, the value of the Y-axis
    will decrease from -1.0 to a smaller value.


    If the device is horizontal and then dropped, the value of the Z-axis will decrease
    from -1.0 to a smaller number. If it is moved upward, the value of the Z-axis
    will increase from -1.0 to a bigger number.'
  merge: -1
  img_proc: true
- pgno: 386
  md: "> **NOTE** The accelerometer used on the iPad gives a maximum reading of about\
    \ +/- 2.3 g with a resolution of about 0.018 g.\n\nIn the following Try it Out,\
    \ you programmatically access the data returned by the accelerometer. Obtaining\
    \ the accelerometer data allows you to build very interesting applications, such\
    \ as a spirit level, as well as games that depend on motion detection.\n\n# TRY\
    \ IT OUT  Accessing the Accelerometer Data\n\n*codefile Accelerometer.zip available\
    \ for download at Wrox.com*\n\n+   1. Using Xcode, create a new View-based Application\
    \ project and name it `Accelerometer`.\n+   2. Double-click the `AccelerometerViewController.xib`\
    \ file to edit it in Interface Builder.\n+   3. Populate the View window with\
    \ the six Label views, as shown in Figure 13-2. Label the three labels on the\
    \ left as X-axis, Y-axis, and Z-axis.\n\n![](img/744c5ec15e15ca7891c98be71dc25d13_386_0.png)\n\
    \nFIGURE 13-2\n\n4. In the `AccelerometerViewController.h` file, add the following\
    \ statements that appear in bold:\n\n```\n#import <UIKit/UIKit.h>\n\n@interface\
    \ AccelerometerViewController : UIViewController <UIAccelerometerDelegate> {\n\
    \    IBOutlet UILabel *labelX;\n    IBOutlet UILabel *labelY;\n    IBOutlet UILabel\
    \ *labelZ;\n}\n\n@property (nonatomic, retain) UILabel *labelX;\n@property (nonatomic,\
    \ retain) UILabel *labelY;\n@property (nonatomic, retain) UILabel *labelZ;\n\n\
    @end\n```\n\n5. In Interface Builder, Control-click and drag the File's owner\
    \ item to each of the three Label views (on the right) and select labelX, labelY,\
    \ and labelZ, respectively."
  merge: -1
  img_proc: true
- pgno: 387
  md: "6. In the AccelerometerViewController.m file, add the following statements\
    \ that appear in bold:\n\n```\n#import \"AccelerometerViewController.h\"\n@implementation\
    \ AccelerometerViewController\n@synthesize labelX, labelY, labelZ;\n\n- (void)viewDidLoad\
    \ {\n    UIAccelerometer *acc = [UIAccelerometer sharedAccelerometer];\n    acc.delegate\
    \ = self;\n    acc.updateInterval = 1.0f/60.0f;\n    [super viewDidLoad];\n}\n\
    \n- (void)accelerometer:(UIAccelerometer *)acc didAccelerate:(UIAcceleration *)acceleration\
    \ {\n    NSString *str = [[NSString alloc] initWithFormat:@\"%sg\", acceleration.x];\n\
    \    labelX.text = str;\n\n    str = [[NSString alloc] initWithFormat:@\"%sg\"\
    , acceleration.y];\n    labelY.text = str;\n\n    str = [[NSString alloc] initWithFormat:@\"\
    %sg\", acceleration.z];\n    labelZ.text = str;\n\n    [str release];\n}\n\n-\
    \ (void)dealloc {\n    [labelX release];\n    [labelY release];\n    [labelZ release];\n\
    \n    [super dealloc];\n}\n```\n\n7. Press Command-R to test the application on\
    \ an iPad. Figure 13-3 shows the data displayed on the application when my iPad\
    \ is resting flat on its back.\n\n> NOTE For accelerometer data, you need a real\
    \ device; the iPhone Simulator does not return any readings for accelerometer\
    \ data.\n\n![](img/744c5ec15e15ca7891c98be71dc25d13_387_0.png)\n\nFIGURE 13-3"
