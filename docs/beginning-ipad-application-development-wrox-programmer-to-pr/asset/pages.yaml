  md: '# How It Works


    What you have just created is a View-based Application. By default, the View-based
    Application template includes a single view, controlled by a View Controller class.
    So let''s dissect the inner workings and see how all things gel together.


    First, take a look at the files and folders created for your project in Xcode.
    In particular, observe the Classes and Resources folder listed under the project
    name (see Figure 4-2).


    ![](img/744c5ec15e15ca7891c98be71dc25d13_114_0.png)


    FIGURE 4-2


    As you can see, many files are created for you by default when you create a new
    project. The iPhone SDK tries to make your life simpler by creating some of the
    items that you will use most often when you develop an iPad application. Table
    4-1 describes the use of the various files created in the project.


    > **NOTE** The numbers and types of files created are dependent on the type of
    project you have selected. The View-based Application template is a good starting
    point to understanding the various files involved.'
