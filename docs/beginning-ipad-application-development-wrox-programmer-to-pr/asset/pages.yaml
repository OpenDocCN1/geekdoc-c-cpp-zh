  md: '![](img/744c5ec15e15ca7891c98be71dc25d13_530_0.png)


    # Getting Around in Xcode


    Xcode is the integrated development environment (IDE) that Apple uses for developing
    Mac OS X, iPhone, and iPad applications. It is a suite of applications that includes
    a set of compilers, documentation, and Interface Builder (discussed in Appendix
    C).


    Using Xcode, you can build your iPad applications from the comfort of an intelligent
    text editor, coupled with many different tools to help debug your iPad applications.
    If you are new to Xcode, this appendix can serve as a useful guide to get you
    started quickly. Appendix C covers the Interface Builder in more detail.


    # LAUNCHING XCODE


    The easiest way to launch Xcode is to type **Xcode** in the textbox of Spotlight.
    Alternatively, you can launch Xcode by navigating to the `/Developer/Applications/`
    folder and double-clicking the Xcode icon.


    > > **NOTE**  For convenience, you can also drag the Xcode icon to the Dock so
    that in future you can launch it directly from the Dock.


    At the time of writing, the version of Xcode available is version 3.2.2.


    # Project Types Supported


    Xcode supports the building of iPhone, iPad, and Mac OS X applications. When you
    create a new project in Xcode (which you do by choosing File ➜ New Project), you
    see the New Project dialog, as shown in Figure B-1.


    As you can see, you have two main project types to create (iPhone OS and Mac OS
    X). Under the iPhone OS category, you have the Application and Library items.'
  merge: -1
  img_proc: true
- pgno: 531
  md: '![](img/744c5ec15e15ca7891c98be71dc25d13_531_0.png)


    # FIGURE B-1


    Select the Application item, and you will see all the different project types
    you can create, as follows:


    +   - Navigation-based Application (iPhone only)

    +   - OpenGL ES Application (iPhone and iPad)

    +   - Split View-based Application (iPad only)

    +   - Tab Bar Application (iPhone and iPad)

    +   - Utility Application (iPhone only)

    +   - View-based Application (iPhone and iPad)

    +   - Window-based Application (iPhone and iPad)


    For the Navigation-based Application, Split View-based Application, Utility Application,
    and Window-based project types, you have the option to use Core Data for storage.


    > NOTE Core Data is part of the Cocoa API that was first introduced to the iPhone
    SDK 3.0. It is basically a framework for manipulating data without worrying about
    the details of storage and retrieval. Core Data is beyond the scope of this book.


    Select the project type you want to create and click the Choose button. Then name
    the project.


    When the project is created, Xcode displays all the files that make up your project
    (see Figure B-2).'
