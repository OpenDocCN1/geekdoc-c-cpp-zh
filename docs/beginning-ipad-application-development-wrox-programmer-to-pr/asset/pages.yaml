  md: "```\n```objc\nNSLog(@\"==========\");\n//---return all titles in an array---\n\
    NSArray *titles = [dict valueForKey:@\"category\"];\n//---print out all the titles\
    \ in that category---\nfor (NSString *title in titles) {\n    NSLog(title);\n\
    }\n}\n[dict release];\n```\n```\n\nWhen the application is run for the first time,\
    \ the Apps.plist file is not available, so you load it from the Resources folder:\n\
    \n```\n```objc\nelse {\n    //---load the property list from the Resources folder---\n\
    \    NSString *pListPath =\n        [[NSBundle mainBundle] pathForResource:@\"\
    Apps\" ofType:@\"plist\"];\n\n    NSDictionary *dict =\n        [[NSDictionary\
    \ alloc] initWithContentsOfFile:pListPath];\n    //...\n    //...\n}\n```\n```\n\
    \nBecause you are making changes to the dictionary object, you need to make a\
    \ mutable copy of the dictionary object and assign it to an NSMutableDictionary\
    \ object:\n\n```\n```objc\n//---make a mutable copy of the dictionary object---\n\
    NSMutableDictionary *copyOfDict = [dict mutableCopy];\n```\n```\n\nThis step is\
    \ important because the NSDictionary object is immutable, meaning that after the\
    \ items are populated from the property list, you cannot add content to the dictionary\
    \ object. Using the mutableCopy method of the NSDictionary class allows you to\
    \ create a mutable instance of the dictionary object, which is NSMutableDictionary.\n\
    \nYou then retrieve an array containing all the keys in the mutable dictionary\
    \ object:\n\n```\n```objc\n//---get all the different categories---\nNSArray *categoriesArray\
    \ =\n    [[copyOfDict allKeys] sortedArrayUsingSelector:@selector(compare:)];\n\
    ```\n```\n\nYou use this array to loop through all the keys in the dictionary\
    \ so that you can add some additional titles to each category:\n\n```\n```objc\n\
    //---for each category---\nfor (NSString *category in categoriesArray) {\n}\n\
    ```\n```\n\nNote that you cannot enumerate using the NSMutableDictionary object\
    \ like this:\n\n```\n```objc\nfor (NSString *category in copyOfDict) {\n    //...\n\
    }\n```\n```"
