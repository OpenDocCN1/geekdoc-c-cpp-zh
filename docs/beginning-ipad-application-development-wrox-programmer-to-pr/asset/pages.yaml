    ID. Finally, check all the devices that you want to provision (you can register
    these devices with the iPhone Provisioning Portal through the Devices tab). Click
    Submit (see Figure 17-19).


    3. The provisioning profile is now pending approval. After a few seconds, it appears
    (just refresh the browser if it is not ready). Click the Download button to download
    the provisioning profile (see Figure 17-20).


    4. The downloaded provisioning profile is named `MyDevicesProfile.mobileprovision`.'
