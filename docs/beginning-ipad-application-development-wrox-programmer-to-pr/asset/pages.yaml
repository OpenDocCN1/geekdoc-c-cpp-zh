- pgno: 208
  md: "# willAnimateSecondHalfOfRotationFromInterfaceOrientation:\n\nThe willAnimateSecondHalfOfRotationFromInterfaceOrientation:\
    \ event is fired when the rotation is halfway through. The method looks like this:\n\
    \n```\n- (void)willAnimateSecondHalfOfRotationFromInterfaceOrientation:\n(UIInterfaceOrientation)\
    \ fromInterfaceOrientation\n duration: (NSTimeInterval) duration {\n}\n```\n\n\
    The fromInterfaceOrientation parameter indicates the orientation that it is changing\
    \ from, whereas the duration parameter indicates the duration of the second half\
    \ of the rotation, in seconds.\n\nIn this event, you typically perform tasks such\
    \ as repositioning the views on the View, resuming media playback, and so on.\n\
    \n# willRotateToInterfaceOrientation:\n\nThe previous two events are fired consecutively\
    \ — first the willAnimateFirstHalfOfRotationToInterfaceOrientation:, followed\
    \ by the willAnimateSecondHalfOfRotationFromInterfaceOrientation: event. If you\
    \ do not need two separate events for handling rotation, you can use the simpler\
    \ willRotateToInterfaceOrientation: event.\n\nThe willRotateToInterfaceOrientation:\
    \ event is fired before the orientation starts. In contrast to the previous two\
    \ events, this is a one-step process. Note that if you handle this event, the\
    \ willAnimateFirstHalfOfRotationToInterfaceOrientation: and willAnimateSecondHalfOfRotationFromInterfaceOrientation:\
    \ events will still be fired.\n\nThe method looks like this:\n\n```\n- (void)willRotateToInterfaceOrientation:\n\
    (UIInterfaceOrientation) toInterfaceOrientation\n duration: (NSTimeInterval) duration\
    \ {\n}\n```\n\nThe toInterfaceOrientation parameter indicates the orientation\
    \ that it is changing to, and the duration parameter indicates the duration of\
    \ the rotation, in seconds.\n\n# willAnimateRotationToInterfaceOrientation:\n\n\
    The willAnimateRotationToInterfaceOrientation: event is fired before the animation\
    \ of the rotation starts.\n\n> **NOTE** If you handle both the willRotateToInterfaceOrientation:\
    \ and willAnimateRotationToInterfaceOrientation: events, the former will fire\
    \ first, followed by the latter."
