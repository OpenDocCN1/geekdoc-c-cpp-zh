    \ Table view and then copy the entire list of movie titles from the NSDictionary\
    \ object into the NSMutableArray:\n\n```\n//---Search---\nself.tableView.tableHeaderView\
    \ = searchBar;\nsearchBar.autocorrectionType = UITextAutocorrectionTypeYes;\n\n\
    //---copy all the movie titles in the dictionary into the listOfMovies array---\n\
    listOfMovies = [[NSMutableArray alloc] init];\nfor (NSString *year in array) \
    \ //---get all the years---\n{\n    //---get all the movies for a particular year---\n\
    \    NSarray *movies = [movieTitles objectForKey:year];\n    for (NSString *title\
    \ in movies)\n    {\n        [listOfMovies addObject:title];\n    }\n}\n\n//---used\
    \ for storing the search result---\nsearchResult = [[NSMutableArray alloc] init];\n\
    \nisSearchOn = NO;\ncanSelectRow = YES;\n```\n\nWhen the user taps the Search\
    \ Bar, the searchBarTextDidBeginEditing: event (one of the methods defined in\
    \ the UISearchBarDelegate protocol) fires. In this method, you add a Done button\
    \ to the top-right corner of the screen. When the Done button is clicked, the\
    \ doneSearching: method is called (which you define next).\n\n```\n//---fired\
    \ when the user taps on the searchbar---\n- (void)searchBarTextDidBeginEditing:(UISearchBar\
    \ *)searchBar {\n    isSearchOn = YES;\n    canSelectRow = NO;\n    self.tableView.scrollEnabled\
    \ = NO;\n\n    //---add the Done button at the top---\n    self.navigationItem.rightBarButtonItem\
    \ =\n    [[[UIBarButtonItem alloc]\n        initWithBarButtonSystemItem:UIBarButtonSystemItemDone\n\
    \        target:self action:@selector(doneSearching:)]\n        autorelease];\n\
    }\n```\n\nThe doneSearching: method makes the Search Bar resign its First Responder\
    \ status (thereby hiding the keyboard). At the same time, you reload the Table\
    \ view by calling the reloadData method of the Table view. This causes the various\
    \ events associated with the Table view to be fired again.\n\n```\n//---done with\
    \ the searching---\n- (void) doneSearching:(id)sender {\n    isSearchOn = NO;\n\
    \    canSelectRow = YES;\n```"
