    \ you add three keys representing the category of applications in the AppStore:\
    \ Entertainment, Games, and Utilities. Each category contains a list of application\
    \ titles.\n\nWhen the view is loaded, you look for a file named Apps.plist in\
    \ the Documents directory of your application:\n\n```\n```objc\n//---get the path\
    \ to the property list file---\nNSString *plistFileName =\n    [[self documentsPath]\
    \ stringByAppendingPathComponent:@\"Apps.plist\"];\n```\n```\n\nIf the file is\
    \ found, you load its content into an NSDictionary object:\n\n```\n```objc\n//---if\
    \ the property list file can be found---\nif ([[NSFileManager defaultManager]\
    \ fileExistsAtPath:plistFileName]) {\n    //---load the content of the property\
    \ list file into a NSDictionary\n    // object---\n    NSDictionary *dict = [[NSDictionary\
    \ alloc]\n                          initWithContentsOfFile:plistFileName];\n \
    \   //...\n    //...\n}\n```\n```\n\nNext, you enumerate through all the keys\
    \ in the dictionary object and print the title of each application in the Debugger\
    \ Console window:\n\n```\n```objc\n//---for each category---\nfor (NSString *category\
    \ in dict) {\n    NSLog(category);\n```\n```"
