  md: "# Sending Data\n\nOnce two devices are connected via Bluetooth, you can start\
    \ to send data to each other. The data are transmitted using the NSData object\
    \ (which is actually a bytes buffer), so you are free to define your own data\
    \ format to send any types of data (such as images, text files, binary files,\
    \ and so on).\n\nThe following Try It Out shows how to send a simple text message\
    \ to another Bluetooth-connected device.\n\n# TRY IT OUT  Sending Text to Another\
    \ Device\n\n1. Using the project created in the previous section, add the following\
    \ methods to the BluetoothViewController.m file:\n\n```\n```objc\n- (void) mySendDataToPeers:(NSData\
    \ *) data {\n    if (currentSession)\n        [self.currentSession sendDataToAllPeers:data\n\
    \                                    withDataMode:GKSendDataReliable\n       \
    \                                   error:nil];\n}\n\n- (IBAction) btnSend:(id)\
    \ sender {\n    //---convert an NSString object to NSData---\n    NSData* data;\n\
    \    NSString *str = [NSString stringWithString:txtMessage.text];\n    data =\
    \ [str dataUsingEncoding:NSASCIIStringEncoding];\n    [self mySendDataToPeers:data];\n\
    }\n\n- (void) receiveData:(NSData *)data\n           fromPeer:(NSString *)peer\n\
    \          inSession:(GKSession *)session\n            context:(void *)context\
    \ {\n    //---convert the NSData to NSString---\n    NSString* str;\n    str =\
    \ [[NSString alloc] initWithData:data encoding:NSASCIIStringEncoding];\n    UIAlertView\
    \ *alert = [[UIAlertView alloc] initWithTitle:@\"Data received\"\n           \
    \                                         message:str\n                      \
    \                             delegate:self\n                                \
    \          cancelButtonTitle:@\"OK\"\n                                       \
    \   otherButtonTitles:nil];\n    [alert show];\n    [alert release];\n}\n```\n\
    ```\n\n2. Deploy the application onto two devices. Connect the devices using Bluetooth.\
    \ Now enter some text and start sending to the other device. Data received from\
    \ another device is shown in an alert view (see Figure 15-7).\n\n![](img/744c5ec15e15ca7891c98be71dc25d13_428_0.png)"
