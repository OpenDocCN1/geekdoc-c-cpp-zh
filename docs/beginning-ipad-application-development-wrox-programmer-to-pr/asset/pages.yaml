- pgno: 288
  md: '# 9


    # File Handling


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - Where your applications are stored on the iPad

    +   - The various folders within your `Applications` folder

    +   - How to read and write to files in the `Documents` and `tmp` folders

    +   - How to use a property to store structured data

    +   - How to programmatically retrieve values stored in a property list

    +   - How to modify the values retrieved from a property list and save the changes
    to a file

    +   - How to copy bundled resources to the application''s folder during runtime


    All the applications you have developed up to this point are pretty straightforward
    — the application starts, performs something interesting, and ends. In Chapter
    8, you saw how you can make use of the application settings feature to save the
    preferences of your application to a central location managed by the Settings
    application. Sometimes, however, you simply need to save some data to your application’s
    folder for use later. For example, rather than keep files you download from a
    remote server in memory, a more effective and memory efficient method is to save
    them in a file so that you can use them later (even after the application has
    shut down and restarted).


    In this chapter, you learn more about how you can persist data in your application
    so that you can use it later. You learn the two available approaches: saving the
    data as files and as a property list. You also learn how to bundle resources such
    as text files and database files with your application so that when the application
    is installed on the user’s device, the resources can be copied onto the local
    storage of the device and be used from there.'
  merge: -1
  img_proc: true
- pgno: 289
  md: "# UNDERSTANDING THE APPLICATION FOLDERS\n\nYour applications are stored in\
    \ the iPad file system, so you'll find it useful to understand the folder structure\
    \ of the iPad.\n\nOn the desktop, the content of the iPhone Simulator is stored\
    \ in the `~/Library/Application Support/iPhone Simulator/<version_no>/` folder.\n\
    \n> NOTE The \"~\" (tilde) represents the current user's directory. Specifically,\
    \ the preceding directory is equivalent to:\n> \n> `/Users/<username>/Library/Application\
    \ Support/\n>  iPhone Simulator/<version_no>/`\n\nWithin this folder are five\
    \ subfolders:\n\n+   - Applications\n+   - Library\n+   - Media\n+   - Root\n\
    +   - tmp\n\nThe Applications folder contains all your installed applications\
    \ (see Figure 9-1). Within it are several folders with long filenames. These filenames\
    \ are generated by Xcode to uniquely identify each of your applications. Each\
    \ application's folder holds your application's executable file (the `.app` file,\
    \ which includes all embedded resources), together with a few other folders, such\
    \ as Documents, Library, and tmp. On the iPad, all applications run within their\
    \ own sandboxed environments — that is, an application can access only the files\
    \ stored within its own folder; it cannot access the folders of other applications.\n\
    \n![](img/744c5ec15e15ca7891c98be71dc25d13_289_0.png)\n\nFIGURE 9-1"
  merge: -1
  img_proc: true
- pgno: 290
  md: "# Using the Documents and Library Folders\n\nThe Documents folder is where\
    \ you can store files used by your application, whereas the Library folder stores\
    \ the application-specific settings. The tmp folder stores temporary data required\
    \ by your application.\n\nSo how you do write to these folders? The following\
    \ Try It Out provides an example of doing just that. You can download the indicated\
    \ code files to work through the project.\n\n# TRY IT OUT  Writing and Reading\
    \ from Files\n\ncodefile FilesHandling.zip available for download at Wrox.com\n\
    \n+   1. Using Xcode, create a new View-based Application project and name it\
    \ FilesHandling.\n+   2. In the FilesHandlingViewController.h file, add in the\
    \ following bold statements:\n+   3. In the FilesHandlingViewController.m file,\
    \ add in the following bold statements:\n\n```\n#import <UIKit/UIKit.h>\n\n@interface\
    \ FilesHandlingViewController : UIViewController {\n}\n-(NSString *) documentsPath;\n\
    -(NSString *) readFromFile:(NSString *) filePath;\n-(void) writeToFile:(NSString\
    \ *) text withFileName:(NSString *) filePath;\n@end\n```\n\n```\n#import \"FilesHandlingViewController.h\"\
    \n\n@implementation FilesHandlingViewController\n\n//---finds the path to the\
    \ application's Documents directory---\n-(NSString *) documentsPath {\n    NSArray\
    \ *paths =\n        NSSearchPathForDirectoriesInDomains(\n            NSDocumentDirectory,\
    \ NSUserDomainMask, YES);\n    \n    NSString *documentsDir = [paths objectAtIndex:0];\n\
    \    return documentsDir;\n}\n\n//---write content into a specified file path---\n\
    -(void) writeToFile:(NSString *) text withFileName:(NSString *) filePath {\n \
    \   NSMutableArray *array = [[NSMutableArray alloc] init];\n    [array addObject:text];\n\
    \    [array writeToFile:filePath atomically:YES];\n    [array release];\n}\n```"
  merge: -1
