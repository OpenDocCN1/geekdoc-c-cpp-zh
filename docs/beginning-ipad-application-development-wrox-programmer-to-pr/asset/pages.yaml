    # Creating a Provisioning Profile


    Next, you create a provisioning profile so that your application can be installed
    onto a real iPad device.


    # TRY IT OUT  Creating a Provisioning Profile


    1. In the iPhone Provisioning Portal, click the Provisioning tab and click the
    New Profile button (see Figure 17-18).


