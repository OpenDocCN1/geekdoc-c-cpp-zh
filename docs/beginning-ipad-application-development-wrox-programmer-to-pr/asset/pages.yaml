- pgno: 563
  md: "Prior to Objective-C 2.0, programmers had to declare methods to make the fields\
    \ accessible to other classes, like this:\n\n```\n#import <Foundation/Foundation.h>\n\
    \n@class AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass\
    \ *anotherClass;\n    float rate;\n    NSString *name;\n}\n\n//---expose the rate\
    \ field---\n-(float) rate;          //---get the value of rate---\n-(void) setRate:(float)\
    \ value;  //---set the value of rate\n\n//---expose the name field---\n-(NSString\
    \ *) name;     //---get the value of name---\n-(void) setName:(NSString *) value;\
    \  //---set the value of name---\n\n@end\n```\n\nThese methods are known as getters\
    \ and setters (or sometimes better known as accessors and mutators). The implementation\
    \ of these methods may look like this:\n\n```\n#import \"SomeClass.h\"\n\n@implementation\
    \ SomeClass\n\n-(float) rate {\n    return rate;\n}\n\n-(void) setRate:(float)\
    \ value {\n    rate = value;\n}\n\n-(NSString *) name {\n    return name;\n}\n\
    \n-(void) setName:(NSString *) value {\n    [value retain];\n    [name release];\n\
    \    name = value;\n}\n\n@end\n```\n\nTo set the value of these properties, you\
    \ need to call the methods prefixed with the set keyword:\n\n```\nSomeClass *sc\
    \ = [[SomeClass alloc] init];\n[sc setRate:5.0f];\n[sc setName:@\"Wei-Meng Lee\"\
    ];\n```"
