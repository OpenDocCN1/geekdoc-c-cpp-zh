  md: "# PUBLISHING A SERVICE\n\nWith all the views and outlets wired up, you can\
    \ publish a service using the NSNetService class.\nThe following Try It Out shows\
    \ you how.\n\n# TRY IT OUT  Publishing a Service on the Network\n\n+   1. Using\
    \ the same project created in the previous section, add the following bold statements\
    \ to the BonjourAppDelegate.h file:\n\n```\n#import <UIKit.h>\n\n@class BonjourViewController;\n\
    \n@interface BonjourAppDelegate : NSObject <UIApplicationDelegate> {\n    UIWindow\
    \ *window;\n    BonjourViewController *viewController;\n\n    //---use this to\
    \ publish a service---\n    NSNetService *netService;\n}\n@property (nonatomic,\
    \ retain) IBOutlet UIWindow *window;\n@property (nonatomic, retain) IBOutlet BonjourViewController\
    \ *viewController;\n\n@end\n```\n\n+   2. In the BonjourAppDelegate.m file, add\
    \ the following statements in bold:\n\n```\n#import \"BonjourAppDelegate.h\"\n\
    #import \"BonjourViewController.h\"\n\n@implementation BonjourAppDelegate\n\n\
    @synthesize window;\n@synthesize viewController;\n\n- (BOOL)application:(UIApplication\
    \ *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {\n\
    \    // Override point for customization after app launch\n    [window addSubview:viewController.view];\n\
    \    [window makeKeyAndVisible];\n\n    //---publish the service---\n    netService\
    \ = [[NSNetService alloc]\n        initWithDomain:@\"\"\n        type:@\"_MyService._tcp.\"\
    \n        name:@\"\"\n        port:9876];\n    netService.delegate = self;\n \
    \   [netService publish];\n}\n```"
