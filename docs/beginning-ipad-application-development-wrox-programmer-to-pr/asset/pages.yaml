- pgno: 188
  md: "# Automatically Displaying the Keyboard When the View Is Loaded\n\nSometimes\
    \ you might want to straightaway set a TextField view as the active view and display\
    \ the keyboard without waiting for the user to do so. In such cases, you can use\
    \ the `becomeFirstResponder` method of the view. The following code shows that\
    \ the TextField view will be the First Responder as soon as the View window is\
    \ loaded:\n\n```\n- (void)viewDidLoad {\n    [textField becomeFirstResponder];\n\
    \    [super viewDidLoad];\n}\n```\n\n# DETECTING THE PRESENCE OF THE KEYBOARD\n\
    \nUp to this point, you have seen the various ways to hide the keyboard after\
    \ you are done using it. However, there is one problem that you need to note.\
    \ When the keyboard appears, it takes up a significant portion of the screen.\
    \ If your Textfield view is located at the bottom of the screen, it would be covered\
    \ by the keyboard. As a programmer, it is your duty to ensure that the view is\
    \ relocated to a visible portion of the screen. Surprisingly, this is not taken\
    \ care of by the SDK; you have to do the hard work yourself.\n\n> NOTE The current\
    \ keyboard in the iPad takes up 264 pixels in height when in Portrait mode, and\
    \ 352 pixels when in Landscape mode.\n\nFirst, though, it is important for you\
    \ to understand a few key concepts related to the keyboard:\n\n+   - You need\
    \ to be able to programmatically know when a keyboard is visible or hidden. To\
    \ do so, your application needs to register `UIKeyboardWillShowNotification` and\
    \ `UIKeyboardWillHideNotification`.\n+   - You also need to know when and which\
    \ TextField view is currently being edited so that you can relocate it to a visible\
    \ portion of the screen. You can know these two pieces of information through\
    \ the two delegate protocols — `textFieldDidBeginEditing:` and `textFieldDidEndEditing:`\
    \ — available in the `UITextFieldDelegate` protocol.\n\nConfused? Worry not; the\
    \ following Try It Out makes it all clear.\n\n# TRY IT OUT Shifting Views\n\n\
    *codefile ScrollingViews.zip available for download at Wrox.com*\n\n+   1. Using\
    \ Xcode, create a new View-based Application project and name it `ScrollingViews`."
  merge: -1
