  md: '# Controlling Your UI Using View Controllers


    In iPad programming, you typically use a View Controller to manage a view as well
    as perform navigation and memory management. In the project template for a View-based
    Application, Xcode automatically uses a View Controller to help you manage your
    view. Think of a view as a screen (or window) you see on your iPad.


    Earlier in this chapter, you saw that the MainWindow.xib window contains the View
    Based App View Controller item. When you double-click the item, it shows a window
    of the same name (see Figure 4-7).


    > **NOTE** When creating your project using Xcode, the filename of your View Controller
    will always be appended with the string ViewController. Hence, if the project
    name is viewBasedApp, then the application delegate will be called viewBasedAppViewController.
    When the View Controller is displayed in Interface Builder, Interface Builder
    will examine the name and display the View Controller with spaces inserted whenever
    there is a change in capitalization; e.g., viewBasedAppViewController now becomes
    View Based App View Controller.


    ![](img/744c5ec15e15ca7891c98be71dc25d13_120_0.png)


    FIGURE 4-7'
