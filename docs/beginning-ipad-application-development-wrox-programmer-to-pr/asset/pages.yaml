- pgno: 381
  md: "# How It Works\n\nThe concept for this example is very simple. When a finger\
    \ taps the screen, you check to see whether the position of the finger falls within\
    \ the range of the ImageView:\n\n```\nCGPoint touchPoint = {touch locationInView:[self\
    \ view]};\nif (touchPoint.x > imageView.frame.origin.x &&\n    touchPoint.x <\
    \ imageView.frame.origin.x + imageView.frame.size.width &&\n    touchPoint.y >\
    \ imageView.frame.origin.y &&\n    touchPoint.y < imageView.frame.origin.y + imageView.frame.size.height)\
    \ {\n    [imageView setCenter:touchPoint];\n}\n```\n\nIf it does, you simply reposition\
    \ the ImageView by calling its setCenter property.\n\nUsing this technique, you\
    \ can easily write a jigsaw puzzle application in which users can rearrange the\
    \ different pieces of the jigsaw puzzle simply by dragging them on the screen.\n\
    \n# SUMMARY\n\nIn this chapter, you saw the use of the various gesture recognizers\
    \ included in the iPhone SDK 3.2 that allow you to easily recognize the gestures\
    \ commonly performed on an iPad. In addition, you have seen the various events\
    \ that you can handle if you want to perform your own tracking of the user's touch.\
    \ Using these events, you can write your own routine to detect multiple touches\
    \ in your application and use this knowledge to create some really interesting\
    \ applications.\n\n# EXERCISES\n\n+   1. Name the six gesture recognizers included\
    \ in the iPhone SDK 3.2.\n+   2. Name the gestures that are discrete and those\
    \ that are continuous.\n+   3. Name the four events for detecting touches in your\
    \ application.\n+   4. What is the difference between multi-taps and multi-touches?\n\
    +   5. How do you simulate multi-touch on the iPhone Simulator?\n\nAnswers to\
    \ the Exercises can be found in Appendix A."
  merge: -1
  img_proc: true
