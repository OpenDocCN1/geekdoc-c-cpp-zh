  md: "# TRY IT OUT  Creating a Tab Bar Application\n\n*codefile TabBarApplication.zip\
    \ available for download at Wrox.com*\n\n1. Using Xcode, create a new Tab Bar\
    \ application project and name it `TabBarApplication`.\n\n2. Examine the content\
    \ of the project (see Figure 4-43). Besides the usual application delegate files,\
    \ it also contains two View Controllers (`FirstViewController` and `SecondViewController`)\
    \ and three XIB files: `MainWindow.xib`, `FirstView.xib`, and `SecondView.xib`.\n\
    \n![](img/744c5ec15e15ca7891c98be71dc25d13_165_0.png)\n\nFIGURE 4-43\n\n3. Examine\
    \ the content of the `TabBarApplicationAppDelegate.h` file, which is as follows:\n\
    \n```\n#import <UIKit/UIKit.h>\n@interface TabBarApplicationAppDelegate : NSObject\
    \ <UIApplicationDelegate, UITabBarControllerDelegate> {\n    UIWindow *window;\n\
    \    UITabBarController *tabBarController;\n}\n@property (nonatomic, retain) IBOutlet\
    \ UIWindow *window;\n@property (nonatomic, retain) IBOutlet UITabBarController\
    \ *tabBarController;\n@end\n```\n\nInstead of the usual `UIViewController` class,\
    \ you are now using the `UITabBarController` class, which inherits from the `UIViewController`\
    \ class. A TabBarController is a specialized `UIViewController` class that contains\
    \ a collection of view controllers.\n\n4. When the application has finished loading,\
    \ the current view of the `UITabBarController` instance is loaded, an occurrence\
    \ that is evident in the `TabBarApplicationAppDelegate.m` file:\n\n```\n#import\
    \ \"TabBarApplicationAppDelegate.h\"\n@implementation TabBarApplicationAppDelegate\n\
    ```"
