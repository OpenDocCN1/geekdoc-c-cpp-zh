- pgno: 429
  md: "# How It Works\n\nTo send data to the connected Bluetooth device, use the `sendDataToAllPeers:`\
    \ method of the `GKSession` object. The data that you send is transmitted via\
    \ an `NSData` object.\n\nThe `mySendDataToPeers:` method is defined as follows:\n\
    \n```\n```objc\n- (void) mySendDataToPeers:(NSData *) data {\n    if (currentSession)\n\
    \        [self.currentSession sendDataToAllPeers:data\n            withDataMode:GKSendDataReliable\n\
    \            error:nil];\n}\n```\n```\n\n> **NOTE** Note the use of the `GKSendDataReliable`\
    \ constant. This constant means that the `GKSession` object continues to send\
    \ the data until it is successfully transmitted or the connection times out. The\
    \ data are delivered in the order they were sent. Use this constant when you need\
    \ to ensure guaranteed delivery. On the other hand, the `GKSendDataUnreliable`\
    \ constant indicates that the `GKSession` object sends the data once and does\
    \ not retry if an error occurred. The data sent can be received out of order by\
    \ recipients. Use this constant for small packets of data that must arrive quickly\
    \ to be useful to the recipient.\n\nThe `btnSend:` method allows text entered\
    \ by the user to be sent to the remote device:\n\n```\n```objc\n- (IBAction) btnSend:(id)\
    \ sender {\n    //---convert an NSString object to NSData---\n    NSData * data;\n\
    \    NSString * str = [NSString stringWithString:txtMessage.text];\n    data =\
    \ [str dataUsingEncoding:NSASCIIStringEncoding];\n    [self mySendDataToPeers:data];\n\
    }\n```\n```\n\nWhen data is received from the other device, the `receiveData:fromPeer:inSession:context:`\
    \ method is called:\n\n```\n```objc\n- (void) receiveData:(NSData *)data\n   \
    \ fromPeer:(NSString *)peer\n    inSession:(GKSession *)session\n    context:(void\
    \ *)context {\n    //---convert the NSData to NSString---\n    NSString * str;\n\
    \    str = [[NSString alloc] initWithData:data encoding:NSASCIIStringEncoding];\n\
    \    UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@\"Data received\"\
    \n        message:str\n        delegate:self\n        cancelButtonTitle:@\"OK\"\
    \n        otherButtonTitles:nil];\n```\n```"
  merge: -1
  img_proc: true
