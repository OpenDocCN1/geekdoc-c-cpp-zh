    # SUMMARY


    This chapter explained how to use the Map Kit framework to display the Google
    Maps in your iPad application. You also saw how to use the Core Location framework
    to help you obtain your location information. Combining the Map Kit and the Core
    Location frameworks enables you to create very compelling location-based services.


