  md: "> NOTE The tableView:cellForRowAtIndexPath: event is not fired continuously\
    \ from start to finish. For example, if the Table view has 100 rows to be displayed,\
    \ the event is fired continuously for the first, say, 10 rows that are visible.\
    \ When the user scrolls down the Table view, the tableView:cellForRowAtIndexPath:\
    \ event is fired for the next couple of visible rows.\n\n# Adding a Header and\
    \ Footer\n\nYou can display a header and footer for the Table view by simply implementing\
    \ the following two methods in your View Controller:\n\n```\n- (NSString *)tableView:(UITableView\
    \ *)tableView titleForHeaderInSection:(NSUInteger)section {\n    //---display\
    \ \"Movie List\" as the header---\n    return @\"Movie List\";\n}\n```\n\n```\n\
    - (NSString *)tableView:(UITableView *)tableView titleForFooterInSection:(NSUInteger)section\
    \ {\n    //---display \"by Denzel Washington\" as the footer---\n    return @\"\
    by Denzel Washington\";\n}\n```\n\nInsert the preceding statements in the TableViewExampleViewController.m\
    \ file and rerun the application; you'll see the header and footer of the Table\
    \ view as shown in Figure 7-7.\n\n# Adding an Image\n\nIn addition to text, you\
    \ can display an image next to the text of a cell in a Table view. Suppose you\
    \ have an image named apple.jpeg in the Resources folder of your project (see\
    \ Figure 7-8).\n\n> NOTE You can simply drag and drop an image to the Resources\
    \ folder of Xcode. When prompted, ensure that you save a copy of the image in\
    \ your project.\n\nTo display an image next to the text of a cell, insert the\
    \ following statements that appear in bold into the tableView:cellForRowAtIndexPath:\
    \ method:\n\n```\n- (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath\
    \ *)indexPath {\n```"
