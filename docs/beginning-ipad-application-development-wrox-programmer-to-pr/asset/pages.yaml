- pgno: 569
  md: '> NOTE How do you release str2, then? Well, it is autoreleased. See the "Convenience
    Method and Autorelease" section for more information.


    If you want to make sure that str2 is available even if str is released, you need
    to use the retain keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    [str2 retain];

    [str release];

    ```


    In the preceding case, the reference count for str is now 2. When you release
    str, str2 will still be valid. When you are done with str2, you need to release
    it manually.


    > NOTE As a general rule, if you own an object (using alloc or retain), you need
    to release it.


    # release


    When you are done with an object, you need to manually release it by using the
    release keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    //...do what you want with the object...

    [str release];

    ```


    When you use the release keyword on an object, it causes the reference count of
    that object to decrease by 1. When the reference count reaches 0, the memory used
    by the object is released.


    One important aspect to keep in mind when using the release keyword is that you
    cannot release an object that is not owned by you. For example, consider the example
    used in the previous section:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    [str release];

    [str2 release]; //---this is not OK as you do not own str2---

    ```


    Attempting to release str2 will result in a runtime error because you cannot release
    an object not owned by you. However, if you use the retain keyword to gain ownership
    of an object, you do need to use the release keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    [str2 retain];

    [str release];

    [str2 release]; //---this is now OK as you now own str2---

    ```'
