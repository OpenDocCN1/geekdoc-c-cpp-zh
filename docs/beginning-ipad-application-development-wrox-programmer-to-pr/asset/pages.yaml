  md: "# DISCRETE GESTURES AND CONTINUOUS GESTURES\n\nThere are two types of gestures\
    \ — discrete and continuous. A discrete gesture sends a single message to the\
    \ target when the gesture is recognized. For example, when you double-tap on a\
    \ view and the gesture is detected, the target (method handling the gesture) is\
    \ only invoked once. A continuous gesture, on the other hand, sends multiple messages\
    \ to the target until the gesture ends. An example of a continuous gesture is\
    \ the pinch gesture. As you put your fingers on the screen and pinch on a view,\
    \ the target is called repeatedly, until you lift your fingers off your screen.\n\
    \nThe UITapGestureRecognizer, UISwipeGestureRecognizer, and UILongPressGestureRecognizer\
    \ are all discrete gesture recognizers.\n\nThe UIPinchGestureRecognizer, UIPanGestureRecognizer,\
    \ and UIRotationGestureRecognizer are all continuous gesture recognizers.\n\n\
    # Pinching\n\nThe pinch gesture is very popular on the iPad (and on the iPhone\
    \ and iPod touch). In the pinch gesture, you place two fingers on the screen and\
    \ move them either apart or closer together to indicate your intention to zoom\
    \ in or out of a view. The following Try It Out shows you how to recognize the\
    \ pinch gesture in your application to change the size of an ImageView. Note,\
    \ all the Try it Outs in this chapter use source code and images from the zip\
    \ file you downloaded for the first Try it Out.\n\n# TRY IT OUT  Recognizing Pinching\n\
    \n+   1. Using the same project created in the previous Try It Out, edit the GesturesViewController.m\
    \ by adding the following bold statements:\n\n```\n#import \"GesturesViewController.h\"\
    \n\n@implementation GesturesViewController\n\n@synthesize imageView;\n\nCGFloat\
    \ lastScaleFactor = 1;\n\n- (void)viewDidLoad {\n\n    //---tap gesture---\n \
    \   UITapGestureRecognizer *tapGesture =\n    [[UITapGestureRecognizer alloc]\n\
    \        initWithTarget:self\n        action:@selector(handleTapGesture:)];\n\n\
    \    tapGesture.numberOfTapsRequired = 2;\n    [imageView addGestureRecognizer:tapGesture];\n\
    \    [tapGesture release];\n\n    //---pinch gesture---\n    UIPinchGestureRecognizer\
    \ *pinchGesture =\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: "```\n```objc\n[[UIPinchGestureRecognizer alloc]\n    initWithTarget:self\n\
    \    action:@selector(handlePinchGesture:)];\n[imageView addGestureRecognizer:pinchGesture];\n\
    [pinchGesture release];\n}\n[super viewDidLoad];\n```\n```\n\n```\n```objc\n//---handle\
    \ pinch gesture---\n-(IBAction) handlePinchGesture:(UIGestureRecognizer *) sender\
    \ {\n    CGFloat factor = [(UIPinchGestureRecognizer *) sender scale];\n    if\
    \ (factor > 1) {\n        //---zooming in---\n        sender.view.transform =\
    \ CGAffineTransformMakeScale(\n            lastScaleFactor + (factor-1),\n   \
    \         lastScaleFactor + (factor-1));\n    } else {\n        //---zooming out---\n\
    \        sender.view.transform = CGAffineTransformMakeScale(\n            lastScaleFactor\
    \ * factor,\n            lastScaleFactor * factor);\n    }\n    if (sender.state\
    \ == UIGestureRecognizerStateEnded) {\n        if (factor > 1) {\n           \
    \ lastScaleFactor += (factor-1);\n        } else {\n            lastScaleFactor\
    \ *= factor;\n        }\n    }\n}\n```\n```\n\n+   2. To test the application\
    \ on the iPhone Simulator, press Command-R.\n+   3. Press the Option button and\
    \ you will be able to simulate the touch of two fingers on the screen. You will\
    \ see two translucent white circle dots on the simulator. Click and drag the mouse\
    \ to move them apart. Observe that the size of the image will change as you move\
    \ the mouse (see Figure 12-5).\n\n# How It Works\n\nAs with the UITapGestureRecognizer,\
    \ you first create an instance of the UIPinchGestureRecognizer and then connect\
    \ it to a gesture handler:\n\n```\n```objc\n//---pinch gesture---\nUIPinchGestureRecognizer\
    \ *pinchGesture =\n    [[UIPinchGestureRecognizer alloc]\n    initWithTarget:self\n\
    \    action:@selector(handlePinchGesture:)];\n[imageView addGestureRecognizer:pinchGesture];\n\
    [pinchGesture release];\n```\n```"
