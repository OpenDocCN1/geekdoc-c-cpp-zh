  md: "As an example, imagine that you want to test whether a string contains a valid\
    \ email address. You can add an isEmail method to the NSString class so that you\
    \ can call the isEmail method on any NSString instance, like this:\n\n```\nNSString\
    \ *email = @\"weimenglee@gmail.com\";\nif ([email isEmail]) {\n    ...\n}\n```\n\
    \nTo do so, you can simply create a new class file and code it as follows:\n\n\
    ```\n//---utils.h---\n#import <Foundation/Foundation.h>\n\n//---NSString is the\
    \ class you are extending---\n@interface NSString (stringUtils)\n\n//---the method\
    \ you are adding to the NSString class---\n- (BOOL) isEmail;\n\n@end\n```\n\n\
    Basically, it looks the same as declaring a new class except that it does not\
    \ inherit from any other class. The stringUtils is a name that identifies the\
    \ category you are adding, and you can use any name you want.\n\nNext, you need\
    \ to implement the method(s) you are adding:\n\n```\n//---utils.m---\n#import\
    \ \"Utils.h\"\n\n@implementation NSString (Utilities)\n\n- (BOOL) isEmail {\n\
    \    NSString *emailRegEx = @\"(?... )\";\n    NSPredicate *regExPredicate = [NSPredicate\
    \ predicateWithFormat:@\"SELF MATCHES %@\", emailRegEx];\n    return [regExPredicate\
    \ evaluateWithObject:self];\n}\n\n@end\n```"
