  md: "To connect an action, you control-click and drag a view to the File's Owner\
    \ item. Hence, for the OK Button view, you control-click and drag the OK Button\
    \ view to the File's Owner item and then select the action named btnClicked.\n\
    \n> **WARNING** A quick tip: to connect actions, you drag from the view in the\
    \ View window onto the File's Owner item.\n\nIn the implementation file (.m),\
    \ you use the @synthesize keyword to indicate to the compiler to create the getter\
    \ and setter for the specified property:\n\n> **COMMON MISTAKES** Forgetting to\
    \ add the @synthesize keyword is one of the most common mistakes that developers\
    \ make. Remember to add this statement or else you will encounter a runtime error\
    \ when the application is executed. Appendix D covers getter/setter in more details.\n\
    \n```\n```objc\n#import \"OutletsAndActionsViewController.h\"\n\n@implementation\
    \ OutletsAndActionsViewController\n\n//---synthesize the property---\n@synthesize\
    \ txtName;\n\n//---displays an alert view when the button is clicked---\n-(IBAction)\
    \ btnClicked:(id) sender {\n    NSString *str = [[NSString alloc]\n        initWithFormat:@\"\
    Hello, %@\", txtName.text];\n    UIAlertView *alert = [[UIAlertView alloc]\n \
    \       initWithTitle:@\"Hello!\"\n        message:str\n        delegate:self\n\
    \        cancelButtonTitle:@\"Done\"\n        otherButtonTitles:nil];\n    \n\
    \    [alert show];\n    [str release];\n    [alert release];\n}\n\n- (void)dealloc\
    \ {\n    //---release the outlet---\n    [txtName release];\n    [super dealloc];\n\
    }\n```\n```"
