    # How It Works


    In contrast to the previous example, in which you added a View Controller item,
    an instance of the UIViewController class, and a XIB file to your project, this
    example simply creates an instance of the UIViewController class and adds the
    views programmatically to the main View window.


    In the application delegate, after the application has finished launching, you
    create an instance of the UIViewController class that you have created:


    ```

    //---instantiate the second view controller---

    mySecondViewController = [[MySecondViewController alloc]

    initWithNibName:nil

    bundle:nil];

    ```


    You do not need an XIB file because the various views that you will be using will
    be added programmatically. Hence the initWithNibName: parameter can be set to
    nil.


    To load the View window represented by the instance of the UIViewController class,
    you use the addSubview: method of the UIWindow instance:


    ```

    //---add the view from the second view controller---

    [window addSubview:mySecondViewController.view];

    ```'
