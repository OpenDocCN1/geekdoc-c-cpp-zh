  md: "```\n//---long press gesture---\nUILongPressGestureRecognizer *longpressGesture\
    \ =\n    [[UILongPressGestureRecognizer alloc]\n        initWithTarget:self\n\
    \        action:@selector(handleLongpressGesture:)];\n```\n\nYou configure the\
    \ recognizer so that it only recognizes the long press when the user has clicked\
    \ on the view using one finger, for one second, and does not move his finger more\
    \ than 15 pixels from his original point of contact:\n\n```\nlongpressGesture.minimumPressDuration\
    \ = 1;\nlongpressGesture.allowableMovement = 15;\nlongpressGesture.numberOfTouchesRequired\
    \ = 1;\n```\n\nYou then attach the recognizer to the ImageView:\n\n```\n[imageView\
    \ addGestureRecognizer:longpressGesture];\n[longpressGesture release];\n```\n\n\
    When a long press is detected, the handleLongpressGesture: method is invoked.\
    \ Here, you simply print out an action sheet:\n\n```\n//---handle long press gesture---\n\
    - (IBAction) handleLongpressGesture:(UIGestureRecognizer *) sender {\n    UIActionSheet\
    \ *actionSheet = [[UIActionSheet alloc]\n        initWithTitle:@\"Image options\"\
    \n        delegate:self\n        cancelButtonTitle:nil\n        destructiveButtonTitle:nil\n\
    \        otherButtonTitles:@\"Save Image\",\n            @\"Copy\", nil];\n  \
    \  //---remember to implement the UIActionSheetDelegate protocol in your\n   \
    \ // view controller---\n    [actionSheet showInView:self.view];\n    [actionSheet\
    \ release];\n}\n```\n\n> NOTE You need to implement the necessary action to perform\
    \ when the user clicks on a button in your action sheet. The implementation details\
    \ are not shown in this example. Remember to implement the UIActionSheetControllerDelegate\
    \ protocol in your View Controller, though.\n\n# DETECTING TOUCHES\n\nWhile the\
    \ gesture recognizers greatly simplify your life in detecting gestures, sometimes\
    \ you simply want to detect touches on the screen and perform some custom action\
    \ (such as writing a doodle application when the user can use his fingers to make\
    \ a sketch)."
