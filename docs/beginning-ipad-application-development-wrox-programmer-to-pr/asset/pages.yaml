- pgno: 558
  md: "# Class Instantiation\n\nTo create an instance of a class, you typically use\
    \ the alloc keyword (more on this in the Memory Management section) to allocate\
    \ memory for the object and then return it to a variable of the class type:\n\n\
    ```\nSomeClass *someClass = [SomeClass alloc];\n```\n\nIn Objective-C, you need\
    \ to prefix an object name with the * character when you declare an object. If\
    \ you are declaring a variable of primitive type (such as float, int, CGRect,\
    \ NSUInteger, and so on), the * character is not required. Here are some examples:\n\
    \n```\nCGRect frame;    //---CGRect is a structure---\nint number;      //---int\
    \ is a primitive type---\nNSString *str;   //---NSString is a class\n```\n\nBesides\
    \ specifying the returning class type, you can also use the id type, like this:\n\
    \n```\nid someClass = [SomeClass alloc];\nid str;\n```\n\nThe id type means that\
    \ the variable can refer to any type of object and hence the * is implicitly implied.\n\
    \n# Fields\n\nFields are the data members of objects. For example, the following\
    \ code shows that SomeClass has three fields — anotherClass, rate, and name:\n\
    \n```\n#import <Foundation/Foundation.h>\n\n@class AnotherClass;\n\n@interface\
    \ SomeClass : NSObject {\n    AnotherClass *anotherClass;\n    float rate;\n \
    \   NSString *name;\n}\n@end\n```\n\n# Access Privileges\n\nBy default, the access\
    \ privilege of all fields is @protected. However, the access privilege can also\
    \ be @public or @private. The following list shows the various access privileges:\n\
    \n+   - @private — visible only to the class that declares it\n+   - @public —\
    \ visible to all classes\n+   - @protected — visible to the class that declares\
    \ it as well as to inheriting classes"
