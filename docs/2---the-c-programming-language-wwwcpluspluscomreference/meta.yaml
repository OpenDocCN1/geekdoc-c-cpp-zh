    Reference of the C++ Language Library, with detailed descriptions of its elements
    and examples on how to use its functions.


    The C++ standard library is a collection of functions, constants, classes, objects
    and templates that enable the C++ language providing basic functionality to perform
    various tasks, classes to interact with the operating system, data containers,
    manipulators to operate with and algorithms commonly needed.


    The declarations of these elements are provided by headers that should be included
    in the header of your code to access them:


    | algorithm | complex | exception | list | stack |

    | :--- | :--- | :--- | :--- | :--- |

    | bitset | csetjmp | fstream | locale | stexcept |

    | cassert | cignal | functional | map | strstream |

    | ctype | cname | memory | streambuf | |

    | cerrno | cstddef | ios | new | typeinfo |

    | cfloat | cdio | isfwd | numeric | string |

    | ciso646 | cldblib | istream | ostream | utility |

    | climits | string | queue | valarray | |

    | ctime | iterator | set | vector | |

    | cmath | deque | limits | stream | |


    It can be divided into:


    # C Library


    The elements of the C language library are also included as a subset of the C++
    Standard Library. These cover many aspects, from general utility functions to
    map/input/output functions and memory management functions:


    - assert (assert.h) C Diagnostics Library (header)

    - ctype (ctype.h) Character handling functions (header)

    - errno (errno.h) C Errors (header)

    - cfloat (float.h) Characteristics of floating-point types (header)

    - iso646 (iso646.h) ISO 646 Alternative operator spells (header)

    - limits (limits.h) Sizes of integer types (header)

    - locale (locale.h) C localization library (header)

    - cmath (math.h) Numerics library (header)

    - csetjmp (setjmp.h) Non local jumps (header)

    - cignal (signal.h) C library to handle signals (header)

    - stdarg (stdarg.h) Variable arguments handling (header)

    - stddef (stddef.h) C Standard definitions (header)

    - stdio (stdio.h) C library to perform Input/Output operations (header)

    - stdlib (stdlib.h) C General Utilities Library (header)

    - string (string.h) C Strings (header)

    - ctime (ctime.h) C Time Library (header)


    # C++ Standard Library: Miscellaneous libraries


    Language support library:


    # Reference - C++ Reference


    http://www.cplplus.com/reference/


    | limits | Numeric limits (header) |

    | new | Dynamic memory (header) |

    | typeinfo | Type information (header) |

    | exception | Standard exception class (class) |


    Diagnostics library:


    | stexcept | Exception classes (header) |

    | utility | Utility components (header) |

    | functional | Function objects (header) |

    | memory | Memory elements (header) |


    Strings library:


    | string | C++ Strings library (library) |


    Localization library:


    | locale | Localization library (header) |


    # C++ Standard Library: Standard Template Library (STL)


    Containers library:


    | bitset | Bitset (class template) |

    | deque | Double ended queue (class template) |

    | list | List (class template) |

    | map | Map (class template) |

    | multimap | Multiple-key map (class template) |

    | multiset | Multiple-key set (class template) |

    | priority_queue | Priority queue (class template) |

    | queue | FIFO queue (class template) |

    | set | Set (class template) |

    | stack | LIFO stack (class template) |

    | vector | Vector (class template) |


    Iterators library:


    | iterator | Iterator definitions (header) |


    Algorithms library:


    | STL Algorithms | Standard Template Library: Algorithms (library) |


    Numeric library:


    | complex | Complex numbers library (header) |

    | vararray | Array for numeric values (header) |

    | numeric | Generalized numeric operations (header) |


    # C++ Standard Library: Input/Output Stream Library


    Provides functionality to use abstraction called streams specially designed to
    perform input and output operations on sequences of character, like files or strings.

    This functionality is provided through several related classes, as shown in the
    following relationship map, with the corresponding header file names on top:


    # Reference - C++ Reference


    | <ios> | <iostream> | <iostream> | <fstream> | <sstream> |

    | :--- | :--- | :--- | :--- | :--- |

    | ios_base | istream | | | istream |

    | ios | | cin | fstream | stringstream |

    | | ostream | cout, cerr, clog | ofstream | ostringstream |

    | | | streambuf | filebuf | stringbuf |


    For more info see the reference page for the C++ Input/Output Library.


