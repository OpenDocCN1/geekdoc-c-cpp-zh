    \ improve and the optimizers work around these types’ complexity, it’s still very\
    \ possible for either to add considerable compile-time and runtime overhead.\n\
    \nC++14 lambdas, with generalized capture expressions, are capable of the same\
    \ things that `std::bind` is capable of.\n\n*std::bind to change parameter order*\n\
    \n```\n```cpp\n#include <functional>\n\ndouble divide(double numerator, double\
    \ denominator) {\n    return numerator / denominator;\n}\n\nauto inverted_divide\
    \ = std::bind(divide,\n                                 std::placeholders::_2,\n\
    \                                 std::placeholders::_1);\n```\n```\n\n*Lambda\
    \ to change parameter order*\n\n```\n```cpp\n#include <functional>\n\ndouble divide(double\
    \ numerator, double denominator) {\n    return numerator / denominator;\n}\n\n\
    auto inverted_divide = [](const auto numerator,\n                          const\
    \ auto denominator) {\n```\n```"
