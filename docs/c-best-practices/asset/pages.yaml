  md: "# # 29. De-template-ize Your Generic Code\n\nMove things outside of your templates\
    \ when you can. Use other functions. Use base classes. The compiler is still free\
    \ to inline them or leave them out of line. De-template-ization will improve compile\
    \ times and reduce binary sizes. Both are helpful. It also eliminates the thing\
    \ that people think of as “template code bloat” (which IMO doesn’t exist¹) (article\
    \ formatting got broken at some point, sorry).\n\n*A new lambda for each function\
    \ template instantiation.*\n\n```\n```cpp\ntemplate<typename T>\nvoid do_things()\n\
    {\n  // this lambda must be generated for each\n  // template instantiation\n\
    \  auto lambda = []() { /* some lambda */ };\n  auto value = lambda();\n}\n```\n\
    ```\n\nCompared to:\n\n¹https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html"
  merge: -1
