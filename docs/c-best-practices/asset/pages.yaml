  md: "*Lippincott de-duplicated exception handling.*\n\n```\n~~~cpp\nvoid handle_exception()\
    \ {\n  try {\n    throw; // re-throw exception already in flight\n  } catch (const\
    \ std::runtime_error &) {\n  } catch (const std::exception &) { }\n}\n\nvoid use_thing()\
    \ {\n  try {\n    do_thing();\n  } catch (...) {\n    handle_exception();\n  }\n\
    }\n\nvoid use_other_thing() {\n  try {\n    do_other_thing();\n  } catch (...)\
    \ {\n    handle_exception();\n  }\n}\n~~~\n```\n\nThis technique is not new -\
    \ it has been available since the pre-C++98 days.\n\n![](img/60cb742bacdfc38724280b0dae4597e3_77_0.png)\n\
