    \ all of your warnings, then you will likely get a “not all code paths return\
    \ a value” warning here.Which is technically correct. We could call get_name(static_cast<Values>(15))\
    \ and not violate any part of C++[dcl.enum/5] except for the Undefined Behavior\
    \ of not returning a value from a function.\n\nYou’ll be tempted to fix this code\
    \ like this:"
