- pgno: 66
  md: "# 27. Prefer if constexpr over SFINAE\n\nSFINAE is kind-of write-only code.\
    \ if constexpr doesn’t have the same flexibility, but use it when you can.\n\n\
    Let’s take our previous example:\n\n*C++14 divides template.*\n\n```\ntemplate\
    \ <typename Numerator, typename Denominator>\nauto divide(Numerator numerator,\
    \ Denominator denominator)\n{\n    return numerator / denominator;\n}\n```\n\n\
    We now want to add different behavior if we are doing integral division. Before\
    \ C++17, we would have used SFINAE (\"Substitution Failure Is Not An Error\").\
    \ Essentially this means that if a function fails to compile, then it is removed\
    \ from overload resolution.\n\n*SFINAE divide function.*\n\n```\n#include <stdexcept>\n\
