  md: "# 42. Don't Use initializer_list For Non-Trivial Types\n\n\"Initializer List\"\
    \ is an overloaded term in C++. \"Initializer Lists\" are used to directly initialize\
    \ values. `initializer_list` is used to pass a list of values to a function or\
    \ constructor.\n\n# Exercise: Understand the overhead initializer_list can bring\n\
    \nUse Andreas Fertig's awesome cppinsights.io¹ to understand what these two examples\
