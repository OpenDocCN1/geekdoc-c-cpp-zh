- pgno: 57
  md: "# 24. Never Test for A Reference To Be `nullptr`, It’s UB\n\n*Tests for null\
    \ references are removed*\n\n```\nint get_value(int &thing) {\n  if (&thing ==\
    \ nullptr) {\n    // removed by compiler\n    return 42;\n  } else {\n    return\
    \ thing;\n  }\n}\n```\n\nIt’s UB to make a null reference, don’t try it. Always\
    \ assume a reference refers to a valid object. Use this fact to your advantage\
    \ when designing API’s.\n\n![](img/60cb742bacdfc38724280b0dae4597e3_57_0.png)\n\
    \n# Exercise: Check for checking the address of an object\n\nThere are many valid\
    \ use cases for `&thing ==` to check for a specific address of an object, but\
    \ there are also many ways this check can be wrong.\n\nSearch through your code\
    \ for statements that check an object’s memory address and understand what they\
    \ are doing and how (or if) they work.\n\n![](img/60cb742bacdfc38724280b0dae4597e3_57_1.png)\n\
    \nWhat other ways might the address of an object be checked besides ==?\n\nThis\
    \ exercise gives you some great experience working with various searching / grepping\
    \ tools and playing with regex."
