- pgno: 123
  md: "# 50. Bonus: Understand The Lambda\n\nA surprising complexity hides behind\
    \ the simple lambda of C++. Initially added in C++11, it was initially constrained.\
    \ With each version of C++, the lambda becomes more flexible and powerful.\n\n\
    Lambdas reverse some of the defaults from the rest of C++. Default `const` and\
    \ automatically `constexpr` when possible; they give us some of what we wish the\
    \ rest of the language could have.\n\n*Lambda grammar.*\n\n```\n```text\nlambda-expression:\n\
    \  lambda-introducer lambda-declarator(opt) compound-statement\n  lambda-introducer\
    \ < template-parameter-list > requires-clause(opt)\n      lambda-declarator(opt)\
    \ compound-statement\nlambda-introducer:\n  [ lambda-capture(opt) ]\nlambda-declarator:\n\
    \  ( parameter-declaration-clause ) decl-specifier-seq(opt)\n      noexcept-specifier(opt)\
    \ attribute-specifier-seq(opt)\n      trailing-return-type(opt) requires-clause(opt)\n\
    ```\n```\n\nIf you can [read standard-eze](#), you can dig into all of the features\
    \ of C++20’s lambdas yourself.\n\n¹ http://eel.is/c++draft/expr.prim.lambda"
  merge: -1
  img_proc: true
