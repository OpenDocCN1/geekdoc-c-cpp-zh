  md: '# # 12. `const` Everything That’s Not `constexpr`


    Many people (like Kate Gregory and James McNellis) have said this many times.
    Making objects `const` does two things:


    +   1. It forces us to think about the initialization and lifetime of objects,
    which affects performance.

    +   2. Communicates meaning to the readers of our code.


    And as an aside, if it’s a `static` object, the compiler is now free to move it
    into the constants portion of the binary, which can affect the optimizer.


    # ## Exercise: Look for `const` opportuni-ties.


    As you read through your code, you should look for variables that are not `const`
    and make them `const`.


    +   - If a variable is not `const`, ask why not?

    +   - Would using a lambda or adding a named function allow you to make the value
    `const`?'
  merge: -1
  img_proc: true
