- pgno: 49
  md: "# # 21. If You Must Do Manual Resource Management, Follow the Rule of 5\n\n\
    If you provide a destructor because `std::unique_ptr` doesn't make sense for your\
    \ use case, you must `=delete`, `=default`, or implement the other special member\
    \ functions.\n\nThis rule was initially known as the Rule of 3 and is known as\
    \ the Rule of 5 after C++11.\n\n*The special member functions.*\n\n```\n```cpp\n\
    struct S {\n    S(); // default constructor\n         // does not affect other\
    \ special member functions\n\n    // If you define any of the following, you must\
    \ deal with\n    // all the others.\n    S(const S &);        // copy constructor\n\
    \    S(S&&);              // move constructor\n    S &operator=(const S &); //\
    \ copy assignment operator\n    S &operator=(S &&);  // move assignment operator\n\
    };\n```\n```\n\n![](img/60cb742bacdfc38724280b0dae4597e3_49_0.png)\n\n`=delete`\
    \ is a safe way of dealing with the special member functions if you don't know\
    \ what to do with them!\n\nYou should also follow the Rule of 5 when declaring\
    \ base classes with virtual functions."
  merge: -1
