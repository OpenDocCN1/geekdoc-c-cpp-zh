  md: '# 11. Learn Another Language


    Considering that C++ is not an object-oriented language, you have to know many
    different techniques to make the most of C++.


    The following exercises will help expose you to other languages. But the fact
    is that currently, few languages are pure single paradigm languages.


    Every language has its preferred way of doing things that work within the language’s
    preferred paradigm.


    Ben Deane recommends this set of languages that all programmers should learn¹:


    +   - ALGOL family (C and descendants)

    +   - Forth

    +   - Lisp and dialects

    +   - Haskell

    +   - Smalltalk

    +   - Erlang


