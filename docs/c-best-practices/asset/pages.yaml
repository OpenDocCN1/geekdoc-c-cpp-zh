  md: "# # 15. Prefer ranged-for Loop Syntax Over Old Loops\n\nWe’ll illustrate this\
    \ point with a series of examples.\n\n*int vs std::size_t when looping.*\n\n```\n\
    ```cpp\nfor (int i = 0; i < container.size(); ++i) {\n  // oops mismatched types\n\
    }\n```\n```\n\n*Mismatched containers while looping.*\n\n```\n```cpp\nfor (auto\
    \ itr = container.begin();\n     itr != container2.end();\n     ++itr) {\n  //\
    \ oops, most of us have done this at some point\n}\n```\n```\n\n*Example of ranged-for\
    \ loop.*\n\n```\n```cpp\nfor(const auto &element : container) {\n  // eliminates\
    \ both other problems\n}\n```\n```\n\n![](img/60cb742bacdfc38724280b0dae4597e3_36_0.png)\n\
    \nNever mutate the container itself while iterating inside a ranged-for loop.\n\
    \n![](img/60cb742bacdfc38724280b0dae4597e3_36_1.png)\n\n# ## Exercise: Modernize\
    \ Your Loops"
