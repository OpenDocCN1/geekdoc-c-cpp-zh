    \ int get_value();\n\nint main()\n{\n    // warning, [[nodiscard]] value ignored\n\
    \    get_value();\n}\n```\n```\n\nAnd on types:\n\n`[[nodiscard]]` *on types.*\n\
    \n```\n```cpp\nstruct [[nodiscard]] ErrorCode{};\n\nErrorCode get_value();\n\n\
    int main()\n{\n    // warning, [[nodiscard]] value ignored\n    get_value();\n\
    }\n```\n```\n\nC++20 adds the ability to provide a description."
