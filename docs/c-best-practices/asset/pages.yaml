- pgno: 60
  md: "# ### switch with default to avoid warnings\n\n```\n```cpp\nenum class Values\
    \ {\n  val1,\n  val2\n};\n\nstd::string_view get_name(Values value) {\n  switch\
    \ (value) {\n    case val1: return \"val1\";\n    case val2: return \"val2\";\n\
    \    default: return \"unknown\";\n  }\n}\n```\n```\n\nBut this introduces a new\
    \ problem\n\n# ### Unhandled case\n\n```\n```cpp\nenum class Values {\n  val1,\n\
    \  val2,\n  val3 // added a new value\n};\n\nstd::string_view get_name(Values\
    \ value) {\n  switch (value) {\n    case val1: return \"val1\";\n    case val2:\
    \ return \"val2\";\n    default: return \"unknown\";\n  }\n  // no compiler diagnostic\
    \ that `val3` is unhandled\n}\n```\n```\n\nInstead, prefer code like this:"
  merge: -1
  img_proc: true
- pgno: 61
  md: "# *Preferred version*\n\n```\n```cpp\nenum class Values {\n  val1,\n  val2,\n\
    \  val3 // added a new value\n};\n\nstd::string_view get_name(Values value) {\n\
    \  switch (value) {\n  case val1: return \"val1\";\n  case val2: return \"val2\"\
    ;\n  } // unhandled enum value warning now\n\n  return \"unknown\";\n}\n```\n\
    ```\n\n![](img/60cb742bacdfc38724280b0dae4597e3_61_0.png)\n\nYou shouldn’t ever\
