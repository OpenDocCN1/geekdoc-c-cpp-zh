  md: "# # 9. C++ Is Not Magic\n\nThis section is just a reminder that we can reason\
    \ about all aspects of C++. It's not a black box, and it's not magic.\n\nIf you\
    \ have a question, it's usually easy to construct an experiment that helps you\
    \ answer the question for yourself.\n\nA favorite tool of mine is this simple\
    \ class that prints a debug message whenever a special member function is called.\n\
    \n*Understanding object lifetime tool*\n\n```\n```cpp\n#include <cstdio>\n\nstruct\
    \ S {\n  S() { puts(\"S()\"); }\n  S(const S &) { puts(\"S(const S &)\"); }\n\
    \  S(S &&) { puts(\"S(S &&)\"); }\n  S &operator=(const S &) {\n    puts(\"operator=(const\
    \ S &)\");\n    return *this;\n  }\n  S &operator=(S &&) {\n    puts(\"operator=(S\
    \ &&)\");\n    return *this;\n  }\n  ~S() { puts(\"~S()\"); }\n};\n```\n```\n\n\
    # **Exercise: Build your first C++ experiment.**"
  merge: -1
