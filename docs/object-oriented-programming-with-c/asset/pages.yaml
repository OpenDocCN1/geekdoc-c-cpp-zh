    Although C++ enables us to add multiple meanings to the operators, yet their association
    and precedence remain the same. For example, the multiplication operator will
    continue having higher precedence than the add operator. **Table 3.7** gives the
    precedence and associativity of all the C++ operators. The groups are listed in
    the order of decreasing precedence. The labels *prefix* and *postfix* distinguish
    the uses of ++ and --. Also, the symbols +, -, *, and & are used as both unary
    and binary operators.


    A complete list of ANSI C++ operators and their meanings, precedence, associativity
    and use are given in Appendix E.


