    | Type of noun | Meaning | Example |

    |---|---|---|

    | Common noun | Describe classes of things (entities) | Vehicle, customer income,
    deduction |

    | Proper noun | Names of specific things | Maruti car, John, ABC company |

    | Mass or abstract noun | Describe a quality, Quantity or an activity associated
    with a noun | Salary-income house-loan, feet, traffic |


    It is important to note that the context and semantics must be used to determine
    the noun categories. A particular word may mean a common noun in one context and
    a mass or abstract noun in another.


    These approaches are only a guide and not the ultimate tools. Creative perception
    and intuition of the experienced developers play an important role in identifying
    the objects.


    Using one of the above approaches, prepare a list of objects for the application
    problem. This might include the following tasks:


    +   1. Prepare an object table.

    +   2. Identify the objects that belong to the solution space and those which
    belong to the problem space only. The problem space objects are outside the software
    boundary.

    +   3. Identify the attributes of the solution space objects.


    Remember that not all the nouns will be of interest to the final realization of
    the solution. Consider the following requirement statements of a system:'
