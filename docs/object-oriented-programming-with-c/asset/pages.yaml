    The ISO / ANSI C++ Standard adds several new features to the original C++ specifications.
    Some are added to provide better control in certain situations and others are
    added for providing conveniences to C++ programmers. It is therefore important
    to note that it is technically possible to write full-fledged programs without
    using any of the new features. Important features added are:


    +   1. New data types

    +   • bool

    +   • wchar_t

    +   2 New operators

    +   • const_cast

    +   • static_cast

    +   • dynamic_cast

    +   • reinterpret_cast

    +   • typeid

    +   3. Class implementation

    +   • Explicit constructors

    +   • Mutable members

    +   4. Namespace scope

    +   5. Operator keywords

    +   6. New keywords'
