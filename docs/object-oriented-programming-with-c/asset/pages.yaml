  md: 'Generic programming | Multiple parameters in class templates | Function templates
    | Template functions | Member function templates | Class templates | Template
    classes | Multiple parameters in class templates | Overloading of template functions
    | Nontype template arguments




    _Templates_ is one of the features added to C++ recently. It is a new concept
    which enable us to define generic classes and functions and thus provides support
    for _generic programming_. Generic programming is an approach where generic types
    are used as parameters in algorithms so that they work for a variety of suitable
    data types and data structures.


    A template can be used to create a family of classes or functions. For example,
    a class template for an array class would enable us to create arrays of various
    data types such as int array and float array. Similarly, we can define a template
    for a function, say mul(), that would help us create various versions of mul()
    for multiplying int, float and double type values.


    A template can be considered as a kind of macro. When an object of a specific
    type is defined for actual use, the template definition for that class is substituted
    with the required data type. Since a template is defined with a parameter that
    would be replaced by a specified data type at the time of actual use of the class
    or function, the templates are sometimes called parameterized classes or functions.'
