  md: '# ## 8.11 Constructors in Derived Classes


    As we know, the constructors play an important role in initializing objects. We
    did not use them earlier in the derived classes for the sake of simplicity. One
    important thing to note here is that, as long as no base class constructor takes
    any arguments, the derived class need not have a constructor function. However,
    if any base class contains a constructor with one or more arguments, then it is
    mandatory for the derived class to have a constructor and pass the arguments to
    the base class constructors. Remember, while applying inheritance we usually create
    objects using the derived class. Thus, it makes sense for the derived class to
    pass arguments to the base class constructor. When both the derived and base classes
    contain constructors, the base constructor is executed first and then the constructor
    in the derived class is executed.


    In case of multiple inheritance, the base classes are constructed *in the order
    in which they appear in the declaration of the derived class.* Similarly, in a
    multilevel inheritance, the constructors will be executed *in the order of inheritance.*


    Since the derived class takes the responsibility of supplying initial values to
    its base classes, we supply the initial values that are required by all the classes
    together, when a derived class object is declared. How are they passed to the
    base class constructors so that they can do their job? C++ supports a special
    argument passing mechanism for such situations.


    The constructor of the derived class receives the entire list of values as its
    arguments and passes them on to the base constructors in the order in which they
    are declared in the derived class. The base constructors are called and executed
    before executing the statements in the body of the derived constructor.


    The general form of defining a derived constructor is:'
