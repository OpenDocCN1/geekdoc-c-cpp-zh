    # Problem Understanding


    The first step in the analysis process is to understand the problem of the user.
    The problem statement should be refined and redefined in terms of computer system
    engineering that could suggest a computer-based solution. The problem statement
    should be stated, as far as possible, in a single, grammatically correct sentence.
    This will enable the software engineers to have a highly focussed attention on
    the solution of the problem. The problem statement provides the basis for drawing
    the requirements specification of both the user and the software.'
