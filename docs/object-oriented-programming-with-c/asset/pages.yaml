  md: "# ## 9.6 Virtual Functions\n\nAs mentioned earlier, polymorphism refers to\
    \ the property by which objects belonging to different classes are able to respond\
    \ to the same message, but in different forms. An essential requirement of polymorphism\
    \ is therefore the ability to refer to objects without any regard to their classes.\
    \ This necessitates the use of a single pointer variable to refer to the objects\
    \ of different classes. Here, we use the pointer to base class to refer to all\
    \ the derived objects. But, we just discovered that a base pointer, even when\
    \ it is made to contain the address of a derived class, always executes the function\
    \ in the base class. The compiler simply ignores the contents of the pointer and\
    \ chooses the member function that matches the type of the pointer. How do we\
    \ then achieve polymorphism? It is achieved using what is known as ‘virtual’ functions.\n\
    \nWhen we use the same function name in both the base and derived classes, the\
    \ function in base class is declared as *virtual* using the keyword **virtual**\
    \ preceding its normal declaration. When a function is made **virtual**, **C++**\
    \ determines which function to use at run time based on the type of object pointed\
    \ to by the base pointer, rather than the type of the pointer. Thus, by making\
    \ the base pointer to point to different objects, we can execute different versions\
    \ of the **virtual** function. Program 9.12 illustrates this point.\n\n# ### Program\
    \ 9.12  Virtual Functions\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nclass Base\n{\npublic:\n    void display( ) { cout << \"\\n Display base\
    \ \"; } virtual void\n```\n```"
