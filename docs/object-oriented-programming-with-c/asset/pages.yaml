    the facilities for handling both input and output streams. Three classes, namely,
    **istream_withassign**, **ostream_withassign**, and **iostream_withassign** add
    assignment operators to these classes. Table 10.1 gives the details of these classes.


    **Table 10.1** *Stream classes for console operations*


    | Class name | Contents |

    |---|---|

    | **ios** (General input/output stream class) | • Contains basic facilities that
    are used by all other input and output classes<br>• Also contains a pointer to
