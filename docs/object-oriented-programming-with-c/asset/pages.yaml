  md: 'Consider the following statement that adds two objects and then assigns the
    result to a third object.


    ```

    `v3 = v1 + v2; // v1, v2 and v3 are class type objects`

    ```


    When the objects are of the same class type, the operations of addition and assignment
    are carried out smoothly and the compiler does not make any complaints. We have
    seen, in the case of class objects, that the values of all the data members of
    the right-hand object are simply copied into the corresponding members of the
    object on the left-hand. What if one of the operands is an object and the other
    is a built-in type variable? Or, what if they belong to two different classes?


    Since the user-defined data types are designed by us to suit our requirements,
    the compiler does not support automatic type conversions for such data types.
    We must, therefore, design the conversion routines by ourselves, if such operations
    are required.


    Three types of situations might arise in the data conversion between incompatible
    types:


    +   1. Conversion from basic type to class type.

    +   2. Conversion from class type to basic type.

    +   3. Conversion from one class type to another class type.


    We shall discuss all the three cases in detail.


    # Basic to Class Type


    The conversion from basic type to class type is easy to accomplish. It may be
    recalled that the use of constructors was illustrated in a number of examples
    to initialize objects. For example, a constructor was used to build a vector object
    from an int type array. Similarly, we used another constructor to build a string
    type object from a char* type variable. These are all examples where constructors
    perform a defacto type conversion from the argument''s type to the constructor''s
    class type.'
