  md: '+   2. The file name used for a new file may already exist.

    +   3. We may attempt an invalid operation such as reading past the end-of-file.

    +   4. There may not be any space in the disk for storing more data.

    +   5. We may use an invalid file name.

    +   6. We may attempt to perform an operation when the file is not opened for
    that purpose.


    The C++ file stream inherits a ‘stream-state’ member from the class **ios**. This
    member records information on the status of a file that is being currently used.
    The stream state member uses bit fields to store the status of the error conditions
    stated above.


    The class **ios** supports several member functions that can be used to read the
    status recorded in a file stream. These functions along with their meanings are
    listed in [Table 11.4](#table-11-4).


    **Table 11.4** *Error handling functions*


    | Function | Return value and meaning |

    |---|---|

    | **eof()** | Returns *true* (non-zero value) if end-of-file is encountered while
    reading; Otherwise returns *false* (zero) |

    | **fail()** | Returns *true* when an input or output operation has failed |

