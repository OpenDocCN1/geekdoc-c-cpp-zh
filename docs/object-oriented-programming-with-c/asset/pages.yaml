    # Summary


    +   - A collection of generic classes and functions is called the Standard Template
    Library (STL). STL components are part of C++ standard library.

    +   - The STL consists of three main components: containers, algorithms, and iterators.

    +   - Containers are objects that hold data of same type. Containers are divided
    into three major categories: sequential, associative, and derived.

    +   - Container classes define a large number of functions that can be used to
    manipulate their contents.

    +   - Algorithms are standalone functions that are used to carry out operations
    on the contents of containers, such as sorting, searching, copying, and merging.

    +   - Iterators are like pointers. They are used to access the elements of containers
    thus providing a link between algorithms and containers. Iterators are defined
    for specific containers and used as arguments to algorithms.

    +   - Certain algorithms use what are known as function objects for some operations.
    A function object is created by a class that contains only one overloaded operator
    () function.'
