    # 7.8  Rules for Overloading Operators


    Although it looks simple to redefine the operators, there are certain restrictions
    and limitations in overloading them. Some of them are listed below:


    +   1. Only existing operators can be overloaded. New operators cannot be created.

    +   2. The overloaded operator must have at least one operand that is of user-defined
    type.

    +   3. Overloaded operators follow the syntax rules of the original operators.
    They cannot be overridden.

    +   4. There are some operators that cannot be overloaded. (See Table 7.1.)'
