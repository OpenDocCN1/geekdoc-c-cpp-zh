  md: 'The operator += is known as _compound assignment operator_ or _short-hand assignment
    operator_. The general form of the compound assignment operator is:


    ```

    variable! op= variable2;

    ```


    where op is a binary arithmetic operator. This means that


    ```

    variable1 = variable1 op variable2;

    ```


    # 3.22 Implicit Conversions


    We can mix data types in expressions. For example,


    ```

    m = 5+2.75;

    ```


    is a valid statement. Wherever data types are mixed in an expression, C++ performs
    the conversions automatically. This process is known as implicit or automatic
    conversion.


    When the compiler encounters an expression, it divides the expressions into sub-expressions
    consisting of one operator and one or two operands. For a binary operator, if
    the operands type differ, the compiler converts one of them to match with the
    other, using the rule that the “smaller” type is converted to the “wider” type.
    For example, if one of the operand is an int and the other is a float, the int
    is converted into a float because a float is wider than an int. The “water-fall”
    model shown in Fig. 3.3 illustrates this rule.'
