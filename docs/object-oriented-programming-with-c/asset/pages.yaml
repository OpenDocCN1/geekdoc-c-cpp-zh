  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_556_0.png)


    C++ exception handling mechanism is basically built upon three keywords, namely,
    try, throw, and catch. The keyword try is used to preface a block of statements
    (surrounded by braces) which may generate exceptions. This block of statements
    is known as try block. When an exception is detected, it is thrown using a throw
    statement in the try block. A catch block defined by the keyword catch ''catches''
    the exception ''thrown'' by the throw statement in the try block, and handles
    it appropriately. The relationship is shown in Fig. 13.1.


    The catch block that catches an exception must immediately follow the try block
    that throws the exception. The general form of these two blocks are as follows:


    ```

    ```

    ......

    ......

    try

    {

    ......

    throw    // Block of statements

    exception;   which

