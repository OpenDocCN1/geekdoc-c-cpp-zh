- pgno: 817
  md: '# Introduction


    C++ is one of the most popular languages due to its power and portability. It
    is available for different operating systems such as DOS, OS/2, UNIX, Windows
    and many others. C++ programs when implemented under Windows are called Visual
    C++ programs. Therefore, there is no difference between C++ and Visual C++ programs
    in terms of programming but the difference lies in terms of implementation.


    A C++ compiler designed for implementation under Windows is known as Visual C++.
    A C++ program running under MS-DOS will also run successfully under Windows. This
    is because, the rules of programming are the same; only the environment of implementation
    is different and is shown in Fig. D.1.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_817_0.png)


    **Fig. D.1** *C++ Implementation environments*


    A C++ programmer can easily become a Visual C++ programmer if he knows how to
    use the implementation tools of his Visual C++ system. In this appendix, we introduce
    the features of Microsoft'
  merge: -1
  img_proc: true
- pgno: 818
  md: 'Visual C++ and discuss how to create, compile and execute C++ programs under
    Windows.


    The Microsoft Corporation has introduced a Windows based C++ development environment
    named as **Microsoft Visual C++** (MSVC). This development environment integrates
    a set of tools that enable a programmer to create and run C++ programs with ease
    and style. Microsoft calls this integrated development environment (IDE) as **Visual
    Workbench**. **Microsoft Visual Studio**, a product sold by Microsoft Corporation,
    also includes Visual C++, in addition to other tools like Visual Basic, Visual
    J++, Visual Foxpro, etc.


    # D.2  The Visual Workbench


    It is important to be familiar with the Visual Workbench that will be extensively
    used in the program development. The Visual Workbench is a visual user interface
    designed to help implement C++ programs. This contains various tools that are
    required for creating, editing, compiling, linking and running of C++ programs
    under Windows. These tools include File, Edit, Search, Project, Resource, Debug,
    Tools, Window and Help.


    When we invoke the Microsoft Visual C++ (Version 6.0), the initial screen of the
    Visual Workbench will be displayed as shown in [Fig. D.2](#). As seen from the
    figure, this screen contains five parts: 1) Title bar, 2) Main menu, 3) Tool bar,
    4) Developer window, and 5) Status line.'
  merge: -1
  img_proc: true
- pgno: 819
  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_819_0.png)


    # ## Main Menu


    The main menu lists a number of items that are required for program development
    and execution. They are summarized in Table D.1.


    Once a main menu item is selected, a pull-down menu, containing various options,
    is displayed. This allows us to select an action/command that relates to the main
    menu item.


    It is likely that an option in the pull-down menu is grayed. This means that the
    particular option is currently not available or not valid. For example, the Save
    option in the File menu will be grayed if the workspace is empty.


    **Table D.1 — Main menu of visual workbench**


    | Item | Functions / Options |

    |---|---|'
