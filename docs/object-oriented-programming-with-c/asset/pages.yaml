    In object oriented paradigm, a system can be viewed as a collection of entities
    that interact together to accomplish certain objectives.


    In object oriented analysis, the entities are called objects. Object oriented
    analysis (OOA) refers to the methods of specifying requirements of the software
    in terms of real world objects, their behaviour and their interactions with each
    other.


    Object oriented design (OOD) translates the software requirements into specifications
    for objects, and derives class hierarchies from which the objects can be created.


    Object oriented programming (OOP) refers to the implementation of the program
    using objects, with the help of object oriented programming language such as C++.


    The object oriented analysis (OOA) approach consists of the following steps:


    +   - Defining the problem.

    +   - Estimating requirements of the user and the software.

    +   - Identifying the objects and their attributes.

    +   - Identifying the interface services that each object is supposed to provide.

    +   - Establishing interconnections between the objects in terms of services required
    and services rendered.


    The object oriented design (OOD) approach involves the following steps:


    +   - Review of objects created in the analysis phase.'
