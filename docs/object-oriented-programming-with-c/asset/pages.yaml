  img_proc: true
- pgno: 699
  md: '# ## Requirements Specification


    Once the problem is clearly defined, the next step is to understand what the proposed
    system is required to do. It is important at this stage to generate a list of
    user requirements. A clear understanding should exist between the user and the
    developer of what is required. Based on the user requirements, the specifications
    for the software should be drawn. The developer should state clearly


    +   • What outputs are required.

    +   • What processes are involved to produce these outputs.

    +   • What inputs are necessary.

    +   • What resources are required.


    These specifications often serve as a reference to test the final product for
    its performance of the intended tasks.


    # ## Identification of Objects


    Objects can often be identified in terms of the real-world objects as well as
    the abstract objects. Therefore, the best place to look for objects is the application
    itself. The application may be analyzed by using one of the following two approaches:


    +   1. Data flow diagrams (DFD)

    +   2. Textual analysis (TA)


    # ## Data Flow Diagram


    The application can be represented in the form of a data flow diagram indicating
    how the data moves from one point to another in the system. The boxes and data
    stores in the data flow diagram are good candidates for the objects. The process
    bubbles correspond to the procedures. Figure 17.16 illustrates a typical data
    flow diagram. It is also known as a data flow graph or a bubble chart.


    A DFD can be used to represent a system at any level of abstraction. For example,
    the DFD shown in Fig. 17.16 may be'
