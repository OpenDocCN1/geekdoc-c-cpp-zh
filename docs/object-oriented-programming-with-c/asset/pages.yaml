- pgno: 181
  md: "class the function belongs to. The general form of a member function definition\
    \ is:\n\n```\nreturn-type class-name :: function-name (argument declaration)\n\
    {\n    Function body\n}\n```\n\nThe membership label class-name :: tells the compiler\
    \ that the function function-name belongs to the class class-name. That is, the\
    \ scope of the function is restricted to the class-name specified in the header\
    \ line. The symbol :: is called the scope resolution operator.\n\nFor instance,\
    \ consider the member functions getdata() and putdata() as discussed above. They\
    \ may be coded as follows:\n\n```\nvoid item :: getdata(int a, float b)\n{\n \
    \   number = a;\n    cost = b;\n}\nvoid item :: putdata(void)\n{\n    cout <<\
    \ “Number :” << number << “\\n”\n    cout << “Cost :” << cost << “\\n”\n}\n```\n\
    \nSince these functions do not return any value, their return-type is void. Function\
    \ arguments are declared using the ANSI prototype.\n\nThe member functions have\
    \ some special characteristics that are often used in the program development.\
    \ These characteristics are:\n\n+   • Several different classes can use the same\
