    \ by default\n{\n    members of derived\n};\n```\n```\n\nWhen a base class is\
    \ *privately inherited* by a derived class, ‘public members’ of the base class\
    \ become ‘private members’ of the derived class and therefore the public members\
    \ of the base class can only be accessed by the member functions of the derived\
    \ class. They are inaccessible to the objects of the derived class. Remember,\
