  md: "Example:\n\n```\ninline double cube(double a)\n{\n    return(a*a*a);\n}\n```\n\
    \nThe above inline function can be invoked by statements like\n\n```\nc - cube(3.0);\n\
    d - cube(2.5+1.5);\n```\n\nOn the execution of these statements, the values of\
    \ c and d will be 27 and 64 respectively. If the arguments are expressions such\
    \ as 2.5 + 1.5, the function passes the value of the expression, 4 in this case.\
    \ This makes the inline feature far superior to macros.\n\nIt is easy to make\
    \ a function inline. All we need to do is to prefix the keyword inline to the\
    \ function definition. All inline functions must be defined before they are called.\n\
    \nWe should exercise care before making a function inline. The speed benefits\
    \ of inline functions diminish as the function grows in size. At some point the\
    \ overhead of the function call becomes small compared to the execution of the\
    \ function, and the benefits of inline functions may be lost. In such cases, the\
    \ use of normal functions will be more meaningful. Usually, the functions are\
    \ made inline when they are small enough to be defined in one or two lines. Example:\n\
    \n```\ninline double cube(double a) {return(a*a*a);}\n```\n\nRemember that the\
    \ inline keyword merely sends a request, not a command, to the compiler. The compiler\
    \ may ignore this request if the function definition is too long or too complicated\
    \ and compile the function as a normal function.\n\nSome of the situations where\
    \ inline expansion may not work are:"
