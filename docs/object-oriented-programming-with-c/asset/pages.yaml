- pgno: 713
  md: 'No program works correctly the first time. So testing the program before using
    is an essential part of the software development process. A detailed test plan
    should be drawn as to what, when and how to test. The class interfaces and class
    dependencies are important aspects for testing. The final goal of testing is to
    see that the system performs its intended job satisfactorily.


    # 17.9 Prototyping Paradigm


    Most often the real-world application problems are complex in nature and therefore
    the structure of the system becomes too large to work out the precise requirements
    at the beginning. Some particulars become known and clear only when we build and
    test the system. After a large system is completed, incorporation of any feature
    that has been identified as “missing” at the testing or application stage might
    be too expensive and time consuming. One way of understanding the system design
    and its ramifications before a complete system is built is to build and test a
    working model of the proposed system. The model system is popularly known as a
    _prototype_, and the process is called _prototyping_. Since the object- oriented
    analysis and design approach is evolutionary, it is best suited for _prototyping
    paradigm_ which is illustrated in Fig. 17 22.


    A prototype is a scaled down version of the system and may not have stringent
    performance criteria and resource requirements. Developer and customer agree upon
    certain “outline specifications” of the system and a prototype design is proposed
    with the outline requirements and available resources. The prototype is built
    and evaluated. The major interest is not in the prototype itself but in its performance
    which is used to refine the requirement specifications. Prototypes provide an
    opportunity to experiment and analyze various aspects of the system such as system
    structure, internal design, hardware requirements and the final system requirements.
    The benefits of using the prototype approach are:'
  merge: -1
  img_proc: true
