    # Data Abstraction and Encapsulation


    The wrapping up of data and functions into a single unit (called class) is known
    as *encapsulation*. Data encapsulation is the most striking feature of a class.
    The data is not accessible to the outside world, and only those functions which
    are wrapped in the class can access it. These functions provide the interface
    between the object’s data and the program. This insulation of the data from direct
    access by the program is called *data hiding* or *information hiding*.


    *Abstraction* refers to the act of representing essential features without including
    the background details or explanations. Classes use the concept of abstraction
    and are defined as a list of abstract *attributes* such as size, weight and cost,
    and *functions* to operate on these attributes. They encapsulate all the essential
    properties of the objects that are to be created. The attributes are sometimes
    called *data members* because they hold information. The functions that operate
    on these data are sometimes called *methods* or *member functions*.


    Since the classes use the concept of data abstraction, they are known as *Abstract
    Data Types* (ADT).


    # Inheritance


