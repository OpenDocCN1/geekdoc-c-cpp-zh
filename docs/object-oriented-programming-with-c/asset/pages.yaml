    \ Definition\n\nMember functions that are declared inside a class have to be defined\
    \ separately outside the class. Their definitions are very much like the normal\
    \ functions. They should have a function header and a function body. Since C++\
    \ does not support the old version of function definition, the *ANSI prototype*\
    \ form must be used for defining the function header.\n\nAn important difference\
    \ between a member function and a normal function is that a member function incorporates\
    \ a membership ‘identity label’ in the header. This ‘label’ tells the compiler\
    \ which"
