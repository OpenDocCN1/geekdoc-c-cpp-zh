  md: 'The **setf()**, a member function of the **ios** class, can provide answers
    to these and many other formatting questions. The **setf()** (*setf* stands for
    set flags) function can be used as follows:


    ```

    cout.setf(arg1,arg2)

    ```


    The *arg1* is one of the formatting *flags* defined in the class **ios**. The
    formatting flag specifies the format action required for the output. Another **ios**
    constant, *arg2*, known as bit *field* specifies the group to which the formatting
    flag belongs.


    Table 10.4 shows the bit fields, flags and their format actions. There are three
    bit fields and each has a group of format flags which are mutually exclusive.
    Examples:


    ```

    cout.setf(ios::left, ios::adjustfield);

    cout.setf(ios::scientific, ios::floatfield);

    ```


    | Format required | Flag (arg1) | Bit-field (arg2) |

    |---|---|---|

    | Left-justified output | ios :: left | ios :: adjustfield |

    | Right-justified output | ios :: right | ios :: adjustfield |

    | Padding after sign or base indicator (like +##20) | ios :: internal | ios::
    adjustfield |

    | Scientific notation | ios :: scientific | ios :: floatfield |

    | Fixed point notation | ios :: fixed | ios :: floatfield |

    | Decimal base | ios :: dec | ios :: basefield |

    | Octal base | ios :: oct | ios :: basefield |

    | Hexadecimal base | ios :: hex | ios :: basefield |


    Note that the first argument should be one of the group members of the second
    argument.


    Consider the following segment of code:


    ```

    cout.fill(''*'');

    cout.setf(ios::left, ios::adjustfield);

    ```'
