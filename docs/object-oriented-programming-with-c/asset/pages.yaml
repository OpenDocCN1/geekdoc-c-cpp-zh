    The function **getdata()** can be used to assign values to the member variables
    number and cost, and **putdata()** for displaying their values. These functions
    provide the only access to the data members from outside the class. This means
    that the data cannot be accessed by any function that is not a member of the class
    **item**. Note that the functions are declared, not defined. Actual function definitions
    will appear later in the program. The data members are usually declared as **private**
    and the member functions as **public**. Figure 5.2 shows'
