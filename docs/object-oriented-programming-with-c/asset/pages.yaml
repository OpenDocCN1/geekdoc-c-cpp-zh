  md: "In some situations, we may not be able to anticipate all possible types of\
    \ exceptions and therefore may not be able to design independent **catch** handlers\
    \ to catch them. In such circumstances, we can force a **catch** statement to\
    \ catch all exceptions instead of a certain type alone. This could be achieved\
    \ by defining the **catch** statement using ellipses as follows:\n\n```\n```\n\
    catch(...)\n{\n    // Statements for\n    processing\n    // all exceptions\n\
    }\n```\n```\n\n```\n```\n#include <iostream>\nusing namespace std;\nvoid test(int\
    \ x)\n{\n    try\n    {\n    if(x == 0) throw x;    // int\n    if(x == -1) throw\
    \ 'x';   // char\n    if(x == 1) throw 1.0;    // float\n    }\n    catch(...)\
    \    // catch all\n    {\n    cout << \"Caught an exception \\n\";\n    }\n}\n\
    int main()\n{\n    cout << \"Testing Generic Catch \\n\";\n    test(-1);\n   \
    \ test(0);\n    test(1);\n}\n```\n```"
