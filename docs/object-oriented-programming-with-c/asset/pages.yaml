    the Visual Workbench from Microsoft Windows. To start the Visual Workbench, simply
    select the Visual C++ icon from the Programs group and click on it. This will
    bring up the Visual Workbench screen as shown in **Fig. D.2**. Once you are in
    the Visual Workbench screen, it is simple to create and save a program.


    # ## Entering the Program


    The first thing you need to do before entering a program is to open a new file.
    Select the File menu from the main menu. This will display a pull-down file menu
    as shown in **Fig. D.4**. The options include, among others, opening an existing
    file, creating a new file and saving the new file.'
