  md: "```\ncatch (e)\n{ \ndelete d1; //Deleting the allocated memory before re\n\
    //throwing the exception\nthrow e;\n}\n```\n\nNow consider the case of destructors\
    \ throwing exceptions. An exception raised during the execution of the destructor\
    \ block may also lead to the memory leak situation as the destructor might not\
    \ have released all the reserved memory space before the exception is raised.\
    \ Though, it is possible to handle the exception raised by the destructor inside\
    \ the main block but at times it may lead to the program getting aborted. This\
    \ may happen when the program control has already left the object's context before\
    \ its raised exception could be handled. Thus, it is advisable to handle the exception\
    \ raised by the destructor with in the destructor block, as shown below:\n\n```\n\
    class A\n{ \npublic: \nA() \n{ \n. \n. \n} \n} ~A()\n{ \ntry\n{ \n}\n```"
