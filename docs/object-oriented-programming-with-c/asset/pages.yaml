  md: '# 14.2 **Components of STL**


    The STL contains several components. But at its core are three key components.
    They are:


    +   - containers,

    +   - algorithms, and

    +   - iterators.


    These three components work in conjunction with one another to provide support
    to a variety of programming solutions. The relationship between the three components
    is shown in [Fig. 14.1](#fig-14-1). *Algorithms* employ *iterators* to perform
    operations stored in *containers*.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_590_0.png)


    **Fig. 14.1** *Relationship between the three STL components*


    A *container* is an object that actually stores data. It is a way data is organized
    in memory. The STL containers are implemented by template classes and therefore
    can be easily customized to hold different types of data.'
  merge: -1
  img_proc: true
- pgno: 591
  md: 'An *algorithm* is a procedure that is used to process the data contained in
    the containers. The STL includes many different kinds of algorithms to provide
    support to tasks such as initializing, searching, copying, sorting, and merging.
    Algorithms are implemented by template functions.


    An *iterator* is an object (like a pointer) that points to an element in a container.
    We can use iterators to move through the contents of containers. Iterators are
    handled just like pointers. We can increment or decrement them. Iterators connect
    algorithms with containers and play a key role in the manipulation of data stored
    in the containers.


    # 14.3 Containers


    As stated earlier, containers are objects that hold data (of same type). The STL
    defines ten containers which are grouped into three categories as illustrated
    in **Fig. 14.2**. **Table 14.1** gives the details of all these containers as
    well as header to be included to use each one of them and the type of iterator
    supported by each container class.


    **Table 14.1** *Containers supported by the STL*


    | Container | Description | Header file | Iterator |

    |---|---|---|---|

    | vector | A dynamic array. Allows insertions and deletions at back. Permits direct
    access to any element | `<vector>` | Random access |

    | list | A bidirectional, linear list. Allows insertions and deletions anywhere.
    | `<list>` | Bidirectional |'
