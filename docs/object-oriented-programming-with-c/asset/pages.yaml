  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_821_0.png)


    *Fig. D.3* *Tool bar actions*


    # Developer Window


    Just below the tool bar is the developer window. It is initially divided into
    three parts as shown in **Fig. D.2.**


    +   - View Pane (on the left)

    +   - Document window (on the right)

    +   - Message window (at the bottom)


    The view pane has three tabs for ClassView, FileView and InfoView. Once we have
    a project going, the ClassView will show us the class hierarchy and the FileView
    will show us the files used. InfoView will allow us to navigate through the documentation.


    The document window, also known as workspace, is the place where we enter or display
    our programs. The message window displays messages such as warnings and errors
    when we compile the programs.


    # Accessing Menu Items


    Before we proceed further, it is important to know how to access the menu items.
    There are two ways of accomplishing this:


    +   1. Using the mouse

    +   2. Using the keyboard'
