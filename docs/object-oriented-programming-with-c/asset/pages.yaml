  md: '```

    x = (y = 10);

    or

    x = y = 10;

    ```


    First 10 is assigned to y and then to x.


    A chained statement cannot be used to initialize variables at the time of declaration.
    For instance, the statement


    ```

    float a = b = 12.34;    // wrong

    ```


    is illegal. This may be written as


    ```

    float a = 12.34, b = 12.34    // correct

    ```


    # Embedded Assignment


    ```

    x = (y = 50) + 10;

    ```


    (y = 50) is an assignment expression known as embedded assignment. Here, the value
    50 is assigned to y and then the result 50+10 = 60 is assigned to x. This statement
    is identical to


    ```

    y = 50;

    x = y + 10;

    ```


    # Compound Assignment


    Like C, C++ supports a *compound assignment operator* which is a combination of
    the assignment operator with a binary arithmetic operator. For example, the simple
    assignment statement


    ```

    x = x + 10;

    ```


    may be written as


    ```

    x += 10;

    ```'
