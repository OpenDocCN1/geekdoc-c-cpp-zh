    ```


    All objects of **gamma** class will contain the objects **a** and **b**. This
    kind of relationship is called *containership* or *nesting*. Creation of an object
    that contains another object is very different than the creation of an independent
    object. An independent object is created by its constructor when it is declared
    with arguments. On the other hand, a nested object is created in two stages. First,
    the member objects are created using their respective constructors and then the
    other members are created. This means, constructors of all the member objects
    should be called before its own constructor body is executed. This is accomplished
    using an initialization list in the constructor of the nested class.


    Example:


    ```

    ```cpp

    class gamma

    {

    ....

    alpha a; // a is object of alpha

    beta b; // b is object of beta

    public:

    gamma(arglist): a(arglist1), b(arglist2)

    {

    // constructor body

    }

    };

    ```

    ```


    *arglist* is the list of arguments that is to be supplied when a **gamma** object
    is defined. These parameters are used for initializing the members of **gamma**.
    *arglist1* is the argument list for the constructor of **a** and *arglist2* is
    the argument list for the constructor of **b**. *arglist1* and *arglist2* may
    or may not use the arguments from *arglist*.'
