  md: '# C++ Streams


    The I/O system in C++ is designed to work with a wide variety of devices including
    terminals, disks, and tape drives. Although each device is very different, the
    I/O system supplies an interface to the programmer that is independent of the
    actual device being accessed. This interface is known as *stream*.


    A stream is a sequence of bytes. It acts either as a *source* from which the input
    data can be obtained or as a *destination* to which the output data can be sent.
    The source stream that provides data to the program is called the *input stream*
    and the destination stream that receives output from the program is called the
    *output stream*. In other words, a program *extracts* the bytes from an input
    stream and *inserts* bytes into an output stream as illustrated in Fig. 10.1.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_423_0.png)


    The data in the input stream can come from the keyboard or any other storage device.
    Similarly, the data in the output stream can go to the screen or any other storage
    device. As mentioned earlier, a stream acts as an interface between the program
    and the input/output device. Therefore, a C++ program handles data (input or output)
    independent of the devices used.


    C++ contains several pre-defined streams that are automatically opened when a
    program begins its execution. These include cin and cout which have been used
    very often in our earlier programs. We know that cin represents the input stream
    connected to the standard'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'input device (usually the keyboard) and cout represents the output stream connected
    to the standard output device (usually the screen). Note that the keyboard and
    the screen are default options. We can redirect streams to other devices or files,
    if necessary.




    The C++ I/O system contains a hierarchy of classes that are used to define various
    streams to deal with both the console and disk files. These classes are called
    _stream classes_.Figure 10.2 shows the hierarchy of the stream classes used for
    input and output operations with the console unit. These classes are declared
    in the header file _iostream_.This file should be included in all the programs
    that communicate with the console unit.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_424_0.png)


    As seen in the Fig. 10.2, **ios** is the base class for **istream** (input stream)
    and **ostream** (output stream) which are, in turn, base classes for **iostream**
    (input/output stream). The class **ios** is declared as the virtual base class
    so that only one copy of its members are inherited by the **iostream**.


    The class **ios** provides the basic support for formatted and unformatted I/O
    operations. The class **istream** provides the facilities'
  merge: -1
