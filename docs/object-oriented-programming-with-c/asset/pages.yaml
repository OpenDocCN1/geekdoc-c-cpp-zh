- pgno: 704
  md: '(functions) are improved to denote clearly the kind of processing involved.


    # Class Dependencies


    Analysis of relationships between the classes is central to the structure of a
    system. Therefore, it is important to identify appropriate classes to represent
    the objects in the solution space and establish their relationships. The major
    relationships that are important in the context of design are:


    +   1. Inheritance relationships.

    +   2. Containment relationships.

    +   3. Use relationships.


    **Inheritance relationship** is the highest relationship that can be represented
    in C++. It is a powerful way of representing a hierarchical relationship directly.
    The real appeal and power of the inheritance mechanism is that it allows us to
    reuse a class that is almost, but not exactly, what we want and to tailor the
    class in a way that it does not introduce any unwanted side effects into the rest
    of the class. We must review the attributes and operations of the classes and
    prepare a *inheritance relationship* table as shown in [Table 17.5].


    **Table 17.5  _Inheritance relationship table_**


    | Class | Depends on |

    |---|---|

    | A | ...... |

    | B | A |

    | C | A |

    | D | B |

    | B1 | B |

    | B2 | B |'
  merge: -1
  img_proc: true
- pgno: 705
  md: '**Containment relationship** means the use of an object of a class as a member
    of another class. This is an alternative and complimentary technique to use the
    class inheritance. But, it is often a tricky issue to choose between the two techniques.
    Normally, if there is a need to override attributes or functions, then the inheritance
    is the best choice. On the other hand, if we want to represent a property by a
    variety of types, then the containment relationship is the right method to follow.
    Another place where we need to use an object as a member is when we need to pass
    an attribute of a class as an argument to the constructor of another class. The
    “another” class must have a member object that represents the argument. The inheritance
    represents _is_a_ relationship and the containment represents _has_a_ relationship.


    **Use relationship** gives information such as the various classes a class uses
    and the way it uses them. For example, a class **A** can use classes **B** and
    **C** in several ways:


    +   - **A** reads a member of **B**.

    +   - **A** calls a member of **C**.

    +   - **A** creates **B** using new operator.


    The knowledge of such relationships is important to the design of a program.


    # # Organization of Class Hierarchies


    In the previous step, we examined the inheritance relationships. We must re-examine
    them and create a class hierarchy so that we can reuse as much data and/or functions
    that have been designed already. Organization of the class hierarchies involves
    identification of common attributes and functions among a group of related classes
    and then combining them to form a new class. The new class will serve as the super
    class and the others as subordinate classes (which derive attributes from the
    super class). The new class may or may not have the meaning of an object by itself.
    If the object is created purely to combine the common attributes, it is called
    an _abstract class_.'
  merge: -1
  img_proc: true
- pgno: 706
  md: 'This process may be repeated at different levels of abstraction with the sole
    objective of extending the classes. As hierarchy structure becomes progressively
    higher, the amount of specification and implementation inherited by the lower
    level classes increases. We may repeat the process until we are sure that no new
    class can be formed. Figure 17.18 illustrates a two-level iteration process.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_706_0.png)


    The process of a class organization may finally result in a single- tree model
    as shown in Fig. 17.19(a) or forest model as shown in Fig. 17.19(b).'
