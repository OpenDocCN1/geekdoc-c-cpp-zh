  md: '# D.5


    # Compiling and Linking


    In Visual C++, the process of compiling and linking all the source files to create
    an executable file is called ‘building’. There are three ways of compiling a type
    source code and is shown in **Table D.2**.


    The compile option in the Build menu when selected will compile the source code
    into an executable code if there is no errors or warnings as shown in **Fig. D.7**.


    While compiling a C++ source file the Visual C++ application will prompt a message
    to build a new workspace. Workspace is nothing but an area where we can have a
    number of source files, their compilation files and linking files saved altogether
    known as Project. This will be used when we have to create an application with
    multiple source files.'
