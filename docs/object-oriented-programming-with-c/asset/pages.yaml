    Function _prototyping_ is one of the major improvements added to C++ functions
    . The prototype describes the function interface to the compiler by giving details
    such as the number and type of arguments and the type of return values. With function
    prototyping, a _template_ is always used when declaring and defining a function.
    When a function is called, the compiler uses the template to ensure that proper
    arguments are passed, and the return value is treated correctly. Any violation
    in matching the arguments or the return types will be caught by the compiler at
    the time of compilation itself. These checks and controls did not exist in the
    conventional C functions.'
