    \ *arg* is an optional parameter name. Note that the exception-handling code is\
    \ placed between two braces. The **catch** statement catches an exception whose\
    \ type matches with the type of **catch** argument. When it is caught, the code\
    \ in the catch block is executed.\n\nIf the parameter in the **catch** statement\
    \ is named, then the parameter can be used in the exception-handling code. After\
    \ executing the handler, the control goes to the statement immediately following\
    \ the catch block.\n\nDue to mismatch, if an exception is not caught, abnormal\
    \ program termination will occur. It is important to note that the **catch** block\
    \ is simply skipped if the **catch** statement does not catch an exception.\n\n\
    # Multiple Catch Statements\n\nIt is possible that a program segment has more\
    \ than one condition to throw an exception. In such cases, we can associate more\
    \ than one **catch** statement with a **try** (much like the conditions in a **switch**\
    \ statement) as shown below:\n\n```\n```cpp\ntry\n{\n                     // try\
    \ block\n}\ncatch(type1 arg)\n{\n                     //       catch\nblock1\n\
    }\ncatch(type2 arg)\n{\n                     //       catch\nblock2\n```\n```"
  merge: -1
  img_proc: true
- pgno: 565
  md: "When an exception is thrown, the exception handlers are searched _in order_\
    \ for an appropriate match. The first handler that yields a match is executed.\
    \ After executing the handler, the control goes to the first statement after the\
    \ last `catch` block for that `try`. (In other words, all other handlers are bypassed).\
    \ When no match is found, the program is terminated.\n\nIt is possible that arguments\
    \ of several `catch` statements match the type of an exception. In such cases,\
    \ the first handler that matches the exception type is executed.\n\nProgram 13.3\
    \ shows a simple example where multiple catch statements are used to handle various\
    \ types of exceptions.\n\n# Program 13.3 Multiple Catch Statements\n\n```\n#include\
    \ <iostream>\n\nusing namespace std;\n\nvoid test(int x)\n{\n    try\n    {\n\
    \    if(x == 1) throw x;    // int\n    else\n    if(x == 0) throw `x`;    //\
    \ char\n    }\n}\n```"
  merge: -1
  img_proc: true
