- pgno: 702
  md: '# # Identification of Services


    Once the objects in the solution space have been identified, the next step is
    to identify a set of services that each object should offer. Services are identified
    by examining all the verbs and verb phrases in the problem description statement.
    Verbs which can note actions or occurrences may be classified as shown in [Table
    17.4].


    **Table 17.4 — Classification of verbs**


    | Types of verb | Meaning | Examples |

    |---|---|---|

    | Doing verbs | operations | read, get, display, buy |

    | Being verbs | classifications | is an, belongs to |

    | Having verbs | composition | has an, is part of |

    | Compare verbs | operations | is less than, is equal to |

    | Stative verbs | invariance-condition | to be present, are owned |


    *Doing verbs* and *compare verbs* usually give rise to services (which we call
    as functions in C++). *Being verbs* indicate the existence of the classification
    structure while *having verbs* give rise to the composition structures.


    # # Establishing Interconnections


    This step identifies the services that objects provide and receive. We may use
    an information flow diagram (IFD) or an entity-relationship (ER) diagram to enlist
    this information. Here, we must establish a correspondence between the services
    and the actual information (messages) that are being communicated.


    # ## 17.7 Steps in Object-Oriented Design


    Design is concerned with the mapping of objects in the problem space into objects
    in the solution space, and creating an overall structure (architectural model)
    and computational models of the system. This stage normally uses the bottom-up
    approach to build the'
