  md: 'people. It is therefore important to have a working definition of object-oriented
    programming before we proceed further. We define “object-oriented programming
    as *an approach that provides a way of modularizing programs by creating partitioned
    memory area for both data and functions that can be used as templates for creating
    copies of such modules on demand.*” Thus, an object is considered to be a partitioned
    area of computer memory that stores data and set of operations that can access
    that data. Since the memory partitions are independent, the objects can be used
    in a variety of different programs without modifications.


    # 1.5 Basic Concepts of Object-Oriented Programming


    It is necessary to understand some of the concepts used extensively in object-oriented
    programming. These include:


    +   - Objects

    +   - Classes

    +   - Data abstraction and encapsulation

    +   - Inheritance

    +   - Polymorphism

    +   - Dynamic binding

    +   - Message passing


    We shall discuss these concepts in some detail in this section.


    # Objects


    *Objects* are the basic run-time entities in an object-oriented system. They may
    represent a person, a place, a bank account, a table of data or any item that
    the program has to handle. They may also represent user-defined data such as vectors,
    time and lists. Programming problem is analyzed in terms of objects and the nature
    of communication between them. Program objects should be chosen'
