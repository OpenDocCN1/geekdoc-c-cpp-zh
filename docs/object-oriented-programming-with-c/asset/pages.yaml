    # 3.4    Identifiers and Constants


    *Identifiers* refer to the names of variables, functions, arrays, classes, etc.,
    created by the programmer. They are the fundamental requirement of any language.
    Each language has its own rules for naming these identifiers. The following rules
    are common to both C and C++:


    +   - Only alphabetic characters, digits and underscores are permitted.

    +   - The name cannot start with a digit.

    +   - Uppercase and lowercase letters are distinct.

    +   - A declared keyword cannot be used as a variable name.


    A major difference between C and C++ is the limit on the length of a name. While
    ANSI C recognizes only the first 32 characters in a name, ANSI C++ places no limit
    on its length and, therefore, all the characters in a name are significant.'
