- pgno: 205
  md: 'Like any other data type, an object may be used as a function argument. This
    can be done in two ways:


    +   • A copy of the entire object is passed to the function.


    +   • Only the address of the object is transferred to the function.


    The first method is called pass-by-value. Since a copy of the object is passed
    to the function, any changes made to the object inside the function do not affect
    the object used to call the function. The second method is called pass-by-reference.
    When an address of the object is passed, the called function works directly on
    the actual object used in the call. This means that any changes made to the object
    inside the function will reflect in the actual object. The pass-by reference method
    is more efficient since it requires to pass only the address of the object and
    not the entire object.'
