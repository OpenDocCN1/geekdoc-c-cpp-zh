  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_802_0.png)


    Fig. C.2 *IDE opening screen*


    # ## Main Menu


    The main menu lists a number of items that are required for the program development
    and execution. They are summarized in [Table C.1](#table-c1).


    The main menu can be activated by pressing the F10 key. When we select an item
    on the main menu, a *pull-down menu*, containing various options, is displayed.
    This allows us to select an action that relates to the main menu item.


    # ## Editor Window


    The *editor window* is the place for creating the source code of C++ programs.
    This window is named NONAME00.CPP. This is the temporary name given to a file
    which can be changed while we save the file.


    **Table C.1** *Main menu items*'
  merge: -1
  img_proc: true
- pgno: 803
  md: '| Item | Options |

    |---|---|

    | — | Displays the version number, clears or restores the screen, and executes
    various utility programmes supplied with Turbo C++ |

    | File | Loads and saves files, handles directories, invokes DOS, and exits Turbo
    C+ |

    | Edit | Performs various editing functions |

    | Search | Performs various text searches and replacements |

    | Run | Compiles, links and runs the program currently loaded in the environment
    |

    | Compile | Compiles the program currently in the environment |

    | Debug | Sets various debugger options, including setting break points |

    | Projects | Manages multifile projects |

    | Options | Sets various compiler, linker, and environmental options |

    | Window | Controls the way various windows are displayed |

    | Help | Activates the context-sensitive Help system |


    # Message Window


    The other window on the screen is called the *message window* where various messages
    are displayed. The messages may be compiler and linker messages and error messages
    generated by the compiler.


    # Status Line


    The *status line* which is displayed at the bottom of the screen gives the status
    of the current activity on the screen. For example, when we are working with FILE
    option of main menu, the status line displays the following:


    F1 Help | Locate and open a file'
  merge: -1
  img_proc: true
- pgno: 804
  md: '# C.5 Invoking Turbo C++


    Assuming that you have installed the Turbo C++ compiler correctly, go to the directory
    in which you want to work. Then enter TC at the DOS system prompt:


    C:>TC


    and press RETURN. This will place you into the IDE screen as shown in Fig. C.2.
    Now, you are ready to create your program.


    # C.6 Creating Source Code File


    Once you are in the IDE screen, it is simple to create and save a program. The
    F10 key will take you to main menu and then move the cursor to File. This will
    display the file dialogue window containing various options for file operations
    as shown in Fig. C.3. The options include, among others, opening an existing file,
    creating a new file and saving the new file.'
  merge: -1
  img_proc: true
