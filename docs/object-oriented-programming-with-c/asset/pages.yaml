    data items of object **A**. Similarly, the statement


    ```

    x.getdata(100,2.9 9.95);

    ```


    passes the initial values as arguments to the function **getdata()**, where these
    values are assigned to the private variables of object **x**. All these ‘function
    call’ statements are used with the appropriate objects that have already been
    created. These functions cannot be used to initialize the member variables at
    the time of creation of their objects.


    Providing the initial values as described above does not conform with the philosophy
    of C++ language. We stated earlier that one of the aims of C++ is to create user-defined
    data types such as **class**, that behave very similar to the built-in types.
    This means that we should be able to initialize a **class**type variable (object)
    when it is'
