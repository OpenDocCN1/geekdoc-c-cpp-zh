- pgno: 708
  md: 'important issue is to decide what functions are to be provided. For a class
    to be useful, it must contain the following functions, in addition to the service
    functions:


    +   1. Class management functions.

    +      - How an object is created?

    +      - How an object is destroyed?

    +   2. Class implementation functions.

    +      What operations are performed on the data type of the class?

    +   3. Class access functions.

    +      How do we get information about the internal variables of the class?

    +   4. Class utility functions.

    +      How do we handle errors?


    Other issues that are to be considered are:


    +   1. What kind of access controls are required for the base classes?

    +   2. Which functions can be made virtual?

    +   3. What library classes are expected to be used in a class?

    +   4. The design of the individual classes has a major impact on the overall
    quality of the software.


    Given below are some guidelines which should be considered while designing a class:


    +   1. The public interface of a class should have only functions of the class.

    +   2. An object of one class should not send a message directly to a member of
    another class.

    +   3. A function should be declared public only when it is required to be used
    by the objects of the class.

    +   4. Each function either accesses or modifies some data of the class it represents.

    +   5. A class should be dependent on as few (other) classes as possible.'
  merge: -1
  img_proc: true
- pgno: 709
  md: '+   6. Interactions between two classes must be explicit.

    +   7. Each subordinate class should be designed as a specialization of the base
    class with the sole purpose of adding additional features.

    +   8. The top class of a structure should represent the abstract model of the
    target concept.


    # Design of Member Functions


    We have so far identified


    +   1. classes and objects,

    +   2. data members,

    +   3. interfaces,

    +   4. dependencies, and

    +   5. class hierarchy (structure)


    It is time now to consider the design of the member functions. The member functions
    define the operations that are performed on the object’s data. These functions
    behave like any other C function and therefore we can use the top-down functional
    decomposition technique to design them as shown in Fig. 17.20.


    We may also apply the *structured design* techniques to each module. The basic
    structured techniques supported by C++ are shown in Fig. 17 21. We may implement
    them in any combination and in any order using one-entry, one-exit concept.


    # Design of the Driver Program


    Every C++ program must contain a **main()** function code known as the driver
    program. The execution of the program begins and ends here. The driver program
    is mainly responsible for:


    +   1. receiving data values from the user,

    +   2. creating objects from the class definitions,'
  merge: -1
  img_proc: true
- pgno: 710
  md: '+   3. arranging communication between the objects as a sequence of messages
    for invoking the member functions, and

    +   4. displaying output results in the form required by the user.


    All activities, including processing during the execution of the program, result
    from the mutual interactions of the objects. One major design decision to be made
    is the logical order of the message passing.


    The driver program is the gateway to the users. Therefore, the design of user-system
    interface (USI) should be given due consideration in the design of the driver
    program. The system should be designed to be user-friendly so that users can operate
    in a natural and comfortable way.'
