    +   3. It is a member function of complex.


    The function is expected to add two complex values and return a complex value
    as the result but receives only one value as argument. Where does the other value
    come from? Now let us look at the statement that invokes this function:


    ```

    C3 = C1 + C2; // invokes operator+() function

    ```


    We know that a member function can be invoked only by an object of the same class.
    Here, the object C1 takes the responsibility of invoking the function and C2 plays
    the role of an argument that is passed to the function. The above invocation statement
    is equivalent to


    ```

    C3 = C1.operator+(C2); // usual function call syntax

    ```


    Therefore, in the operator+() function, the data members of C1 are accessed directly
    and the data members of C2 (that is passed as an argument) are accessed using
    the dot operator. Thus, both the objects are available for the function. For example,
    in the statement


    ```

    temp.x = x + c.x;

    ```


    c.x refers to the object C2 and x refers to the object C1.temp.x is the real part
    of temp that has been created specially to hold the results of addition of C1
    and C2. The function returns the complex temp to be assigned to C3. Figure 7.1
