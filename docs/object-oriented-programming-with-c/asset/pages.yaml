    We know that the casting operator function


    Operator typename()


    converts the class object of which it is a member to typename. The typename may
    be a built-in type or a user-defined one (another class type). In the case of
    conversions between objects, typename refers to the destination class. Therefore,
    when a class needs to be converted, a casting operator function can be used (i.e.,
    source class). The conversion takes place in the source class and the result is
    given to the destination class object.


    Now consider a single-argument constructor function which serves as an instruction
    for converting the argument''s type to the class type of which it is a member.
    This implies that the argument belongs to the source class and is passed to the
    destination class for conversion. This makes it necessary that the conversion
    constructor be placed in the destination class. Figure 7.2 illustrates these two
    approaches.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_296_0.png)


    Table 7.3 provides a summary of all the three conversions. It shows that the conversion
    from a class to any other type (or any other class) should make use of a casting
    operator in the source class. Or the other hand, to perform the conversion from
    any other type/class to a class type, a constructor should be used in the destination
    class.


    When a conversion using a constructor is performed in the destination class, we
    must be able to access the data members of the object sent (by the source class)
    as an argument. Since data members of the source class are private, we must use
    special access functions in the source class to facilitate its data flow to the
    destination class.'
