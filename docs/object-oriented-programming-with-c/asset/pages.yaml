    local variables are of type auto by default. |

    | **bool** | It is a data type and is used to hold a Boolean value, **true** or
    **false**. |

    | **break** | A **break** statement is used to cause an exit from the loop and
    switch statements. It is used to provide labels in a switch statement. |

    | **catch** | **catch** is used to describe the *exception handler* code that
    catches the exceptions (unusual conditions in the program). |

    | **char** | It is a fundamental data type and is used to declare character variables
    and arrays. |

    | **class** | **class** is used to create user-defined data types. It binds together
    data and functions that operate on them. Class variables known as *objects* are
    the building blocks of OOP in C++. |

    | **const** | It is a data type qualifier. A data type qualified as **const**
    may not be modified by the program. |

    | **const_cast** | It is a casting operator used to explicitly override **const**
    or **volatile** objects. |

    | **continue** | It causes skipping of statements till the end of a loop in which
    it appears. It is similar to saying “go to end of loop”. |

    | **default** | It is a **default** label in a switch statement. The control is
    transferred to this statement when none of the case labels match the expressions
    in switch. |'
