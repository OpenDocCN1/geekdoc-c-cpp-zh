  md: 'The header file *iomanip* provides a set of functions called *manipulators*
    which can be used to manipulate the output formats. They provide the same features
    as that of the **ios** member functions and flags. Some manipulators are more
    convenient to use than their counterparts in the class **ios**. For example, two
    or more manipulators can be used as a chain in one statement as shown below:


    ```

    cout << manip1 << manip2 << manip3 << item;

    cout << manip1 << item1 << manip2 << item2;

    ```


    This kind of concatenation is useful when we want to display several columns of
    output.


    The most commonly used manipulators are shown in Table 10.6. The table also gives
    their meaning and equivalents. To access these manipulators, we must include the
    file *iomanip* in the program.


    **Table 10.6 — Manipulators and their meanings**


    | Manipulator | Meaning | Equivalent |

    |---|---|---|

    | `setw (int w)` | Set the field width to w. | `width()` |

    | `setprecision(int d)` | Set the floating point precision to d. | `precision()`
    |

    | `setfill(int c)` | Set the fill character to c. | `fill()` |

    | `setiosflags(long f)` | Set the format flag f. | `setf()` |

    | `resetiosflags(long f)` | Clear the flag specified by f. | `unsetf()` |

    | `endl` | Insert new line and flush stream. | `"\n"` |


    Some examples of manipulators are given below:


    ```

    cout << setw(10) << ''12345'';

    ```


    This statement prints the value 12345 right-justified in a field width of 10 characters.
    The output can be made left-justified by modifying the statement as follows:


    ```

    cout << setw(10) << setiosflags(ios::left) << i2345;

    ```'
