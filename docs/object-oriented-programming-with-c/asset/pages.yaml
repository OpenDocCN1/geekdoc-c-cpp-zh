    # 4.6 InlineFunctions


    One of the objectives of using functions in a program is to save some memory space,
    which becomes appreciable when a function is likely to be called many times. However,
    every time a function is called, it takes a lot of extra time in executing a series
    of instructions for tasks such as jumping to the function, saving registers, pushing
    arguments into the stack, and returning to the calling function. When a function
    is small, a substantial percentage of execution time may be spent in such overheads.


    One solution to this problem is to use macro definitions, popularly known as macros.
    Preprocessor macros are popular in C. The major drawback with macros is that they
    are not really functions and therefore, the usual error checking does not occur
    during compilation.


    C++ has a different solution to this problem. To eliminate the cost of calls to
    small functions, C++ proposes a new feature called inline function. An inline
    function is a function that is expanded in line when it is invoked. That is, the
    compiler replaces the function call with the corresponding function code (something
    similar to macros expansion). The inline functions are defined as follows:


    +   inline function-header

    +   {

    +       function body

    +   }'
