    # 5.1  Introduction


    The most important feature of C++ is the “class”. Its significance is highlighted
    by the fact that Stroustrup initially gave the name “C with classes” to his new
    language. A class is an extension of the idea of structure used in C. It is a
    new way of creating and implementing a user-defined data type. We shall discuss,
    in this chapter, the concept of class by first reviewing the traditional structures
    found in C and then the ways in which classes can be designed, implemented and
    applied.


    # 5.2  C Structures Revisited


    We know that one of the unique features of the C language is structures. They
    provide a method for packing together data of different types. A structure is
    a convenient tool for handling a group of logically related data items. It is
    a user-defined data type with a *template* that serves to define its data properties.
    Once the structure type has been defined, we can create variables of that type
    using declarations that are similar to the built-in type declarations. For example,
    consider the following declaration:'
