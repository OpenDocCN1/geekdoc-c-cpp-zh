    # One Class to Another Class Type


    We have just seen data conversion techniques from a basic to class type and a
    class to basic type. But there are situations where we would like to convert one
    class type data to another class type.

    Example:


    ```

    objX = objY; // objects of different types

    ```


    **objX** is an object of class **X** and **objY** is an object of class **Y**.
    The class **Y** type data is converted to the **class X** type data and the converted
    value is assigned to the **objX**. Since the conversion takes place from **class
    Y** to **class X**, Y is known as the source class and X is known as the destination
    class.


    Such conversions between objects of different classes can be carried out by either
    a constructor or a conversion function. The compiler treats them the same way.
    Then, how do we decide which'
