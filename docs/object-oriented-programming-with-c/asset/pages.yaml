- pgno: 576
  md: "# 13.8 Exceptions in Constructors and Destructors\n\nWhat will happen if an\
    \ exception is thrown while executing a constructor routine? Since, the object\
    \ is not yet fully constructed; its destructor would not be called once the program\
    \ control goes out of the object’s context. And, if the constructor had reserved\
    \ some memory before the exception was raised, then there would be no mechanism\
    \ to prevent such memory leak. Hence, appropriate exception handling mechanism\
    \ must be implemented pertaining to the constructor routine to handle exceptions\
    \ that occur during object construction.\n\nNow, the question arises as to where\
    \ shall we catch the exception? Inside the constructor block or inside main? If\
    \ we allow the exception to be handled inside main then we would not be able to\
    \ prevent the memory leak situation that we discussed earlier. Thus, we must catch\
    \ the exception within the constructor block so that we get the chance to free\
    \ up any reserved memory space. However, we must simultaneously rethrow the exception\
    \ to be appropriately handled inside the main block. This scenario is illustrated\
    \ in the following code:\n\n```\nclass A\n{\n    public:\n        A()\n      \
    \  {\n            try\n            {\n                data-type d1;\n        \
    \        //Constructor code\n                throw e;\n            }\n```"
  merge: -1
  img_proc: true
