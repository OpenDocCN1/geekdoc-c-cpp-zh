    # 8.12 Member Classes: Nesting of Classes


    Inheritance is the mechanism of deriving certain properties of one class into
    another. We have seen in detail how this is implemented using the concept of derived
    classes. C++ supports yet another way of inheriting properties of one class into
    another. This approach takes a view that an object can be a collection of many
    other objects. That is, a class can contain objects of other classes as its members
    as shown below:


    ```

    class alpha {...};

    class beta {...};

    ```'
