- pgno: 486
  md: "+   1. Opening a file in `ios::out` mode also opens it in the `ios::trunc`\
    \ mode by default.\n+   2. Both `ios::app` and `ios::ate` take us to the end of\
    \ the file when it is opened. The difference between the two parameters is that\
    \ the `ios::app` allows us to add data to the end of the file only, while `ios::ate`\
    \ mode permits us to add data or to modify the existing data anywhere in the file.\
    \ In both the cases, a file is created by the specified name, if it does not exist.\n\
    +   3. The parameter `ios::app` can be used only with the files capable of output.\n\
    +   4. Creating a stream using `ifstream` implies input and creating a stream\
    \ using `ofstream` implies output. So in these cases, it is not necessary to provide\
    \ the mode parameters.\n+   5. The `fstream` class does not provide a mode by\
    \ default and therefore, we must provide the mode explicitly when using an object\
    \ of `fstream` class.\n+   6. The mode can combine two or more parameters using\
    \ the bitwise OR operator (symbol `|`) as shown below:\n+   \n+      `fout.open(“data”,\
    \ ios::app | ios::nocreate)`\n+   \n+      This opens the file in the append mode\
    \ but fails to open the file if it does not exist.\n\n# 11.6 File Pointers and\
    \ their Manipulations\n\nEach file has two associated pointers known as the *file\
    \ pointers*. One of them is called the input pointer (*or get pointer*) and the\
    \ other is called the output pointer (*or put pointer*). We can use these pointers\
    \ to move through the files while reading or writing. The input pointer is used\
    \ for reading the contents of a given file location and the output pointer is\
    \ used for writing to a given file location. Each time an input or output operation\
    \ takes place, the appropriate pointer is automatically advanced."
