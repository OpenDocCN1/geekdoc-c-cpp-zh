  md: '+   - **seekp()** Moves put pointer(output) to a specified location.

    +   - **tellg()** Gives the current position of the get pointer.

    +   - **tellp()** Gives the current position of the put pointer.


    For example, the statement


    ```

    infile.seekg(10);

    ```


    moves the file pointer to the byte number 10. Remember, the bytes in a file are
    numbered beginning from zero. Therefore, the pointer will be pointing to the 11th
    byte in the file.


    Consider the following statements:


    ```

    ofstream fileout;

    fileout.open("hello", ios::app);

    int p = fileout.tellp();

    ```


    On execution of these statements, the output pointer is moved to the end of the
    file “hello” and the value of p will represent the number of bytes in the file.


    # Specifying the offset


    We have just seen how to move a file pointer to a desired location using the ‘seek’
    functions. The argument to these functions represents the absolute position in
    the file. This is shown in Fig. 11.1.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_488_0.png)'
