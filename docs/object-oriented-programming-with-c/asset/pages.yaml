    # ## Dynamic Binding


    Binding refers to the linking of a procedure call to the code to be executed in
    response to the call. _Dynamic binding_ (also known as late binding) means that
    the code associated with a given procedure call is not known until the time of
    the call at run-time. It is associated with polymorphism and inheritance. A function
    call associated with a polymorphic reference depends on the dynamic type of that
    reference.


    Consider the procedure “draw” in Fig 1.9. By inheritance, every object will have
    this procedure. Its algorithm is, however, unique to each object and so the draw
    procedure will be redefined in each class that defines the object. At run-time,
    the code matching the object under current reference will be called.


