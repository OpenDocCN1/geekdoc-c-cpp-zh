    \ type T\n    // wherever appropriate\n    // .....\n}\n```\n```\n\nThe function\
    \ template syntax is similar to that of the class template except that we are\
    \ defining functions instead of classes. We must use the template parameter T\
    \ as and when necessary in the function body and in its argument list.\n\nThe\
    \ following example declares a **swap()** function template that will swap two\
    \ values of a given type of data.\n\n```\n```\ntemplate<class T>\nvoid swap(T&x,\
    \ T&y)\n{\n    T temp = x;\n    x = y;\n    y = temp;\n}\n```\n```\n\nThis essentially\
    \ declares a set of overloaded functions, one for each type of data. We can invoke\
    \ the **swap()** function like any ordinary function. For example, we can apply\
    \ the **swap()** function as follows:"
