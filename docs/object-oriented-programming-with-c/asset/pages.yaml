    # ## Tool Bar


    The tool bar resides just below the main menu. This provides a shortcut access
    to many of the main menu’s options with a single mouse click. Figure. D.3 shows
    some important tool bar commands that can be used from anywhere within the Workbench.
    Several tool bars like Standard, Build, Edit, Wizard Bar, etc., are available
