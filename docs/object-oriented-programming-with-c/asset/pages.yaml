    # Summary


    +   - C++ provides various types of tokens that include keywords, identifiers,
    constants, strings, and operators.

    +   - Identifiers refer to the names of variables, functions, arrays, classes,
    etc.

    +   - C++ provides an additional use of **void**, for declaration of generic pointers.

    +   - The enumerated data types differ slightly in C++. The tag names of the enumerated
    data types become new type names. That is, we can declare new variables using
    these tag names.

    +   - In C++, the size of character array should be one larger than the number
    of characters in the string.

    +   - C++ adds the concept of constant pointer and pointer to constant. In case
    of constant pointer, we can not modify the address that the pointer is initialized
    to. In case of pointer to a constant, contents of what it points to cannot be
    changed.

    +   - Pointers are widely used in C++ for memory management and to achieve polymorphism.

    +   - C++ provides a qualifier called **const** to declare named constants which
    are just like variables except that their values can not be changed. A **const**
    modifier defaults to an **int**.

    +   - C++ is very strict regarding type checking of variables. It does not allow
    to equate variables of two different data types. The only way to break this rule
    is type casting.'
