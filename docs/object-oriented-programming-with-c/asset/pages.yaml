  md: 'The identifier **employee** is a user-defined data type and can be used to
    create objects that relate to different categories of the employees. Example:


    ```

    employee manager[3];  // array of manager

    employee foreman[15]; // array of foreman

    employee worker[75];  // array of worker

    ```


    The array **manager** contains three objects (managers), namely, **manager[0]**,
    **manager[1]** and **manager[2]**, of type **employee** class. Similarly, the
    **foreman** array contains 15 objects (foremen) and the **worker** array contains
    75 objects (workers).


    Since an array of objects behaves like any other array, we can use the usual array-accessing
    methods to access individual elements, and then the dot member operator to access
    the member functions. For example, the statement


    ```

    manager[i].putdata();

    ```


    will display the data of the ith element of the array **manager**. That is, this
    statement requests the object **manager[i]** to invoke the member function **putdata()**.


    An array of objects is stored inside the memory in the same way as a multi-dimensional
    array. The array manager is represented in Fig. 5.5. Note that only the space
    for data items of the objects is created. Member functions are stored separately
    and will be used by all the objects.'
