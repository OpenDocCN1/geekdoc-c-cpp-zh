- pgno: 595
  md: 'keys. For example, a **set** might store objects of the **student** class which
    are ordered alphabetically using names as keys. We can search for a desired student
    using his name as the key. The main difference between a **set** and a **multiset**
    is that a **multiset** allows duplicate items while a **set** does not.


    Containers **map** and **multimap** are used to store pairs of items, one called
    the *key* and the other called the *value*. We can manipulate the values using
    the keys associated with them. The values are sometimes called *mapped values*.
    The main difference between a **map** and a **multimap** is that a **map** allows
    only one key for a given value to be stored while **multimap** permits multiple
    keys.


    # Derived Containers


    The STL provides three derived containers namely, **stack**, **queue**, and **priority_queue**.
    These are also known as *container adaptors*.


    Stacks, queues and priority queues can be created from different sequence containers.
    The derived containers do not support iterators and therefore we cannot use them
    for data manipulation. However, they support two member functions **pop()** and
    **push()** for implementing deleting and inserting operations.


    # 14.4                           Algorithms


    Algorithms are functions that can be used generally across a variety of containers
    for processing their contents. Although each container provides functions for
    its basic operations, STL provides more than sixty standard algorithms to support
    more extended or complex operations. Standard algorithms also permit us to work
    with two different types of containers at the same time. Remember, STL algorithms
    are not member functions or friends of containers. They are standalone template
    functions.'
