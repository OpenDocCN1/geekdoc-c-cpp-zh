  md: '# # Key Concepts


    C-strings | The string class | Creating string objects | Manipulating strings
    | Relational operations on strings | Comparing strings | String characteristics
    | Swapping strings




    A string is a sequence of characters. We know that C++ does not support a built-in
    string type. We have used earlier null-terminated character arrays to store and
    manipulate strings. These strings are called C-stringsor C-style strings.Operations
    on C-strings often become complex and inefficient. We can also define our own
    string classes with appropriate member functions to manipulate strings. This was
    illustrated in Program 7.4 (Mathematical Operation of Strings).


    ANSI standard C++ now provides a new class called **string**. This class improves
    on the conventional C-strings in several ways. In many situations, the string
    objects may be used like any other built-in type data. Further, although it is
    not considered as a part of the STL, **string** is treated as another container
    class by C++ and therefore all the algorithms that are applicable for containers
    can be used with the **string** objects. For using the **string** class, we must
    include <string> in our program.


    The **string** class is very large and includes many constructors, member functions
    and operators. We may use the constructors, member functions and operators to
    achieve the following:


    +   Creating string objects

    +   Reading string objects from keyboard

    +   Displaying string objects to the screen

    +   Finding a substring from a string'
