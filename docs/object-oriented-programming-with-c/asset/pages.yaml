- pgno: 411
  md: '+   - Polymorphism simply means one name having multiple forms.

    +   - There are two types of polymorphism, namely, compile time polymorphism and
    run time polymorphism.

    +   - Functions and operators overloading are examples of compile time polymorphism.
    The overloaded member functions are selected for invoking by matching arguments,
    both type and number. The compiler knows this information at the compile time
    and, therefore, compiler is able to select the appropriate function for a particular
    call at the compile time itself. This is called early or static binding or static
    linking. It means that an object is bound to its function call at compile time.

    +   - In run time polymorphism, an appropriate member function is selected while
    the program is running. C++ supports run time polymorphism with the help of virtual
    functions. It is called late or dynamic binding because the appropriate function
    is selected dynamically at run time. Dynamic binding requires use of pointers
    to objects and is one of the powerful features of C++.

    +   - Object pointers are useful in creating objects at run time. It can be used
    to access the public members of an object, along with an arrow operator.

    +   - A **this** pointer refers to an object that currently invokes a member function.
    For example, the function call **a.show()** will set the pointer ‘this’ to the
    address of the object ‘a’.

    +   - Pointers to objects of a base class type are compatible with pointers to
    objects of a derived class. Therefore, we can use a single pointer variable to
    point to objects of base class as well as derived classes.'
