  md: "# # Friendly Functions\n\nWe have been emphasizing throughout this chapter\
    \ that the private members cannot be accessed from outside the class. That is,\
    \ a nonmember function cannot have an access to the private data of a class. However,\
    \ there could be a situation where we would like two classes to share a particular\
    \ function. For example, consider a case where two classes, manager and scientist,\
    \ have been defined. We would like to use a function income_tax() to operate on\
    \ the objects of both these classes. In such situations, C++ allows the common\
    \ function to be made friendly with both the classes, thereby allowing the function\
    \ to have access to the private data of these classes. Such a function need not\
    \ be a member of any of these classes.\n\nTo make an outside function “friendly”\
    \ to a class, we have to simply declare this function as a friend of the class\
    \ as shown below:\n\n```\n```\nclass ABC\n{\n    .....\n    .....\npublic:\n \
    \   .....\n    .....\n    friend void xyz(void); // declaration\n};\n```\n```\n\
    \nThe function declaration should be preceded by the keyword friend.The function\
    \ is defined elsewhere in the program like a normal C++ function. The function\
    \ definition does not use either the keyword friend or the scope operator ::.\
    \ The functions that are declared with the keyword friend are known as friend\
    \ functions. A function can be declared as a friend in any number of classes.\
    \ A friend function, although not a member function, has full access rights to\
    \ the private members of the class.\n\nA friend function possesses certain special\
    \ characteristics:"
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - It is not in the scope of the class to which it has been declared as
    **friend**.

    +   - Since it is not in the scope of the class, it cannot be called using the
    object of that class.

    +   - It can be invoked like a normal function without the help of any object.

    +   - Unlike member functions, it cannot access the member names directly and
    has to use an object name and dot membership operator with each member name (e.g.
    A.x).

    +   - It can be declared either in the public or the private part of a class without
    affecting its meaning.

    +   - Usually, it has the objects as arguments.


    The friend functions are often used in operator overloading which will be discussed
    later.


    Program 5.8 illustrates the use of a friend function.


