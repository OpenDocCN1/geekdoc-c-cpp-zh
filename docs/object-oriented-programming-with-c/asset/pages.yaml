  md: '# # About the Author


    **E Balagurusamy**, former Vice Chancellor, Anna University, Chennai and Member,
    Union Public Service Commission, New Delhi, is currently the Chairman of EBG Foundation,
    Coimbatore. He is a teacher, trainer, and consultant in the fields of Information
    Technology and Management. He holds an ME (Hons) in Electrical Engineering and
    PhD in Systems Engineering from the Indian Institute of Technology, Roorkee. His
    areas of interest include *Object-Oriented Software Engineering, E-Governance,
    Technology Management, Business Process Re-engineering,* and *Total Quality Management.*


    A prolific writer, he has authored a large number of research papers and several
    books. His best selling books, among others include –


    +   - *Fundamentals of Computers*

    +   - Computing *Fundamentals and C Programming*

    +   - *Programming in ANSI C*, 5e

    +   - *Programming in Java*, 4e

    +   - *Programming in BASIC*, 3e

    +   - *Programming in C#*, 3e

    +   - *Numerical Methods*

    +   - *Reliability Engineering*


    A recipient of numerous honors and awards, E Balagurusamy has been listed in the
    Directory of Who’s Who of Intellectuals and in the Directory of Distinguished
    Leaders in Education.'
