- pgno: 822
  md: '# Mouse Actions


    Using the mouse for accessing an item is the most common approach in Windows programming.
    We can perform the following actions with the mouse:


    +   - Move the mouse pointer to a desired location by moving the mouse without
    pressing any button.

    +   - Click the left mouse button when the pointer is over the preferred option.


    # Keyboard Actions


    Though the use of mouse is a must for Windows-based applications, the accessing
    can also be done through keyboard. Simultaneously pressing the ALT key and the
    underscored letter of the menu item required will activate the corresponding pull-down
    menu. The underscored letter is known as hot key. Once a pull-down menu is displayed,
    using the down/up arrow keys an option can be highlighted and then pressing the
    ENTER key will activate that option.


    Some of the options in a pull-down menu can be directly activated by using their
    hot key combinations shown against these options. For example, Ctrl+N is the hot
    key combination for the New option in the File menu. Similarly by pressing Ctrl+S,
    a file can be saved without using pull-down menu. This shortcut approach can be
    used from anywhere within the Visual Workbench.


    # D.3  Implementing Visual C++ Programs


    Developing and implementing a computer program written in any high-level language
    involves several steps already described in Appendix C.


    # D.4'
