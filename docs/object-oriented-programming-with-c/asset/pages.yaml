- pgno: 347
  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_347_0.png)


    The header line of *derived-constructor* function contains two parts separated
    by a colon(:). The first part provides the declaration of the arguments that are
    passed to the *derived-constructor* and the second part lists the function calls
    to the base constructors.


    *base1(arglist1), base2(arglist2), ...* are function calls to base constructors
    **base1()**, **base2()**, ... and therefore *arglist1, arglist2, ...* etc. represent
    the actual parameters that are passed to the base constructors. *Arglist1* through
    *ArglistN* are the argument declarations for base constructors *base1* through
    *baseN*. *ArglistD* provides the parameters that are necessary to initialize the
    members of the derived class.


    Example:


    ```

    D(int a1, int a2, float b1, float b2, int d1):

    A(a1, a2), /* call to constructor A */

    B(b1, b2) /* call to constructor B */

    {

    d = d1; // executes its own body

    }

    ```


    A(a1, a2) invokes the base constructor **A()** and B(b1, b2) invokes another base
    constructor **B()**. The constructor **D()** supplies the values for these four
    arguments. In addition, it has one argument of its own. The constructor **D()**
    has a total of five arguments. **D()** may be invoked as follows:


    ```

    ....

    D objD(5, 12, 2.5, 7.54, 30);

    ....

    ```'
