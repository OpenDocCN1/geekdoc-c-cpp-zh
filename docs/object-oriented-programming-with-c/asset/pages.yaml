- pgno: 19
  md: '| FEATURES | BENEFITS | EXAMPLES |

    |---|---|---|

    | Key Concepts and Introduction | Key Concepts provide a quick insight of the
    concepts that will be discussed in the chapter. These are followed by an Introduction
    which introduces the topics to be covered in that chapter and also relates them
    to those already learnt. | Refer to pages 1, 16, 30, 71, and 90 |

    | Program Codes | Program codes with comments are given throughout the book to
    elaborate how the various lines of code work and enhance the programming skills.
    | Refer to pages 21, 46, 50, 77, and 97 |

    | Key Terms | Key Terms lists the list of important terms discussed in the chapter.
    | Refer to pages 13, 27, 66, 86, and 125 |

    | Notes | Language tips and other special considerations highlighted as notes
    wherever essential add value to the concept explanation. | Refer to pages 24,
    53, 85, 116, and 118 |

    | Summary | Summary gives the essence of each chapter in the form of bulleted
    points which will be helpful for a quick review during the examinations. | Refer
    to pages 14, 26, 65, 86, 124 |

    | Exercise Problems | 375 chapter-end exercise problems including review questions,
    debugging exercises and programming exercises are given for the readers to work
    out, practice and implement the concepts. | Refer to pages 15, 28, 69, 87, and
    126 |

    | Programming Projects | The two programming projects (Telephone Billing System
    and Typing Tutor) in Appendix A give an insight on how to integrate and apply
    the various features of C++ in real-life problems. | Refer to pages 450, and 460
    |

    | Proficiency Test | An appendix on proficiency test will help the readers assess
    their level of mastery on the language and prepare for technical interviews. |
    Refer to pages 545, and 554 |


    # Chapter Organization


    The book is organized into 17 chapters and 9 appendices. **Chapters 1 and 2**
    provide a strong foundation and a perspective on Object-Oriented Programming and
    C++. **Chapter 3** deals with the various data types and control structures. This
    chapter now includes'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'differences between Structure and Union, explained with appropriate programs
    and introduction of Storage Classes and its various types.


    **Chapter 4** elucidates the various functions of C++. A separate section discussing
    the Recursion function has been added in this chapter.


    **Chapter 5** covers Classes and Objects, while **Chapter 6** gives a detailed
    study on Constructors and Destructors, the various kinds of Constructors, including
    topics like Parameterized Constructors, Constructor Overloading and the various
    exceptional cases to be noted when working with Destructors. The chapter also
    deals with the Dynamic Initialization of Objects. **Chapter 7** covers in detail
    the concept of Operator overloading and Type conversions, apart from discussing
    Overloading rules and String manipulations. The topic on Exceptions in Operator
    Overloading Operations has been added and explained with sufficient programs to
    support the theory. The various types of Inheritance like single, multiple, and
    hybrid inheritance and its other topics like Derived and Abstract classes can
    be studied in **Chapter 8**.


    **Chapter 9** begins by explaining the vital feature of OOP, i.e., Polymorphism,
    and elucidating on Pointers and Virtual Functions, while the Input and Output
    Operations have been dealt with in **Chapter 10**. An in-depth study of the various
    File Stream Operations and File Pointers has been elucidated in **Chapter 11**.
    Templates and Exception handling, like Exceptions in Constructors and Destructors
    and Exceptions in Operator Overloading Functions can be studied in **Chapters
    12** and **13**, respectively. **Chapter 14** introduces the students to the standard
    template, its components and functions. **Chapter 15** covers the study of Strings
    and its related fields while **Chapter 16** deals with the new features of ANSI
    C++ standards. The concluding chapter, **Chapter 17**, helps students in understanding
    the object-oriented systems.


    Each chapter ends with a set of summary, key terms, review questions, debugging
    exercises and programming problems. For further assistance, students can also
    refer to the website for solutions to questions containing the WEB icon. In addition,
    two new projects'
  merge: -1
  img_proc: true
- pgno: 21
