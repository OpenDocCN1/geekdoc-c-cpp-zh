  md: '# Key Concepts


    Software evolution | Procedure-oriented programming | Object-oriented programming
    | Objects | Classes | Data abstraction | Encapsulation | Inheritance | Polymorphism
    | Dynamic binding | Message passing | Object-oriented languages | Object-based
    languages


    # 1.1  Software Crisis


    Developments in software technology continue to be dynamic. New tools and techniques
    are announced in quick succession. This has forced the software engineers and
    industry to continuously look for new approaches to software design and development,
    and they are becoming more and more critical in view of the increasing complexity
    of software systems as well as the highly competitive nature of the industry.
    These rapid advances appear to have created a situation of crisis within the industry.
    The following issues need to be addressed to face this crisis:


    +   • How to represent real-life entities of problems in system design?

    +   • How to design systems with open interfaces?

    +   • How to ensure reusability and extensibility of modules?

    +   • How to develop modules that are tolerant to any changes in future?

    +   • How to improve software productivity and decrease software cost?

    +   • How to improve the quality of software?

    +   • How to manage time schedules?

    +   • How to industrialize the software development process?


    Many software products are either not finished, or not used, or else are delivered
    with major errors. Figure 1.1 shows the fate of the US'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'defence software projects undertaken in the 1970s. Around 50% of the software
    products were never delivered, and one-third of those which were delivered were
    never used. It is interesting to note that only 2% were used as delivered, without
    being subjected to any changes. This illustrates that the software industry has
    a remarkably bad record in delivering products.


    Changes in user requirements have always been a major problem. Another study (Fig
    1.2) shows that more than 50% of the systems required modifications due to changes
    in user requirements and


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_26_0.png)


    Fig. 1.1 The state of US defence projects (according to the US government)


    data formats. It only illustrates that, in a changing world with a dynamic business
    environment, requests for change are unavoidable and therefore systems must be
    adaptable and tolerant to changes.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_27_0.png)


    # Fig. 1.2 _Breakdown of maintenance costs_


    These studies and other reports on software implementation suggest that software
    products should be evaluated carefully for their quality before they are delivered
    and implemented. Some of the quality issues that must be considered for critical
    evaluation are:


    +   1. Correctness

    +   2. Maintainability

    +   3. Reusability

    +   4. Openness and interoperability

    +   5. Portability

    +   6. Security

    +   7. Integrity

    +   8. User friendliness


    Selection and use of proper software tools would help resolving some of these
    issues.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Ernest Tello, a well-known writer in the field of artificial intelligence,
    compared the evolution of software technology to the growth of a tree. Like a
    tree, the software evolution has had distinct phases or “layers” of growth. These
    layers were built up one by one over the last five decades as shown in Fig 1.3,
    with each layer representing an improvement over the previous one. However, the
    analogy fails if we consider the life of these layers. In software systems, each
    of the layers continues to be functional, whereas in the case of trees, only the
    uppermost layer is functional.


    ![](img/62b7c32e48e4f960a8dc2825a7119fb2_28_0.png)


    Alan Kay, one of the promoters of the object-oriented paradigm and the principal
    designer of Smalltalk, has said: “/As complexity increases, architecture dominates
    the basic material”. To build today’s complex software it is just not enough to
    put together a sequence of programming statements and sets of procedures and modules;
    we'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'need to incorporate sound construction techniques and program structures that
    are easy to comprehend, implement and modify.


    Since the invention of the computer, many programming approaches have been tried.
    These include techniques such as _modular programming, top-down programming, bottom-up
    programming_ and _structured programming_. The primary motivation in each has
    been the concern to handle the increasing complexity of programs that are reliable
    and maintainable. These techniques have become popular among programmers over
    the last two decades.


    With the advent of languages such as C, structured programming became very popular
    and was the main technique of the 1980s. Structured programming was a powerful
    tool that enabled programmers to write moderately complex programs fairly easily.
    However, as the programs grew larger, even the structured approach failed to show
    the desired results in terms of bug-free, easy-to-maintain, and reusable programs.


    _Object-Oriented Programming (OOP)_ is an approach to program organization and
    development that attempts to eliminate some of the pitfalls of conventional programming
    methods by incorporating the best of structured programming features with several
    powerful new concepts. It is a new way of organizing and developing programs and
    has nothing to do with any particular language. However, not all languages are
    suitable to implement the OOP concepts easily.


    # ## 13 Look at Procedure-Oriented Programming


    Conventional programming, using high level languages such as COBOL, FORTRAN and
    C, is commonly known as _procedure- oriented programming (POP)_. In the procedure-oriented
    approach, the problem is viewed as a sequence of things to be done such as reading,
    calculating and printing. A number of functions are written to accomplish these
    tasks. The primary focus is on functions. A typical program structure for procedural
    programming is shown in Fig 1.4.'
