    # 12.6  Overloading of Template Functions


    A template function may be overloaded either by template functions or ordinary
    functions of its name. In such cases, the overloading resolution is accomplished
    as follows:


    +   1. Call an ordinary function that has an exact match.

    +   2. Call a template function that could be created with an exact match.

    +   3. Try normal overloading resolution to ordinary functions and call the one
    that matches.


    An error is generated if no match is found. Note that no automatic conversions
    are applied to arguments on the template functions. Program 12.9 shows how a template
    function is overloaded with an explicit function.


