  md: '# Fig. 8.12 *Multipath inheritance*


    Inheritance by the ‘child’ as shown in Fig. 8.12 might pose some problems. All
    the public and protected members of ‘grandparent’ are inherited into ‘child’ twice,
    first via ‘parent1’ and again via ‘parent2’. This means, ‘child’ would have *duplicate*
    sets of the members inherited from ‘grandparent’. This introduces ambiguity and
    should be avoided.


    The duplication of inherited members due to these multiple paths can be avoided
    by making the common base class (ancestor class) as *virtual base class* while
    declaring the direct or intermediate base classes as shown below:


    ```

    class A // *grandparent*

    {

    ....

    ....

    };

    class B1 : virtual public A // *parent1*

    {

    ....

    ....

    };

    class B2 : public virtual A // *parent2*

    {

    ....

    ....

    };

    class C : public B1, public B2 // *child*

    {

    .... // *only one copy of A*

    .... // *will be inherited*

    };

    ```


