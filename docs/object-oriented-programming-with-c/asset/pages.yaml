- pgno: 489
  md: '# Fig. 11.8 *Action of single argument seek function*


    ‘Seek’ functions **seekg()** and **seekp()** can also be used with two arguments
    as follows:


    ```

    ```cpp

    seekg (offset, refposition);

    seekp (offset, refposition);

    ```

    ```


    The parameter *offset* represents the number of bytes the file pointer is to be
    moved from the location specified by the parameter *refposition*. The *refposition*
    takes one of the following three constants defined in the **ios** class:


    +   - **ios::beg** — start of the file

    +   - **ios::cur** — current position of the pointer

    +   - **ios::end** — End of the file


    The **seekg()** function moves the associated file’s ‘get’ pointer while the **seekp()**
    function moves the associated file’s ‘put’ pointer. [Table 11.3](#table-11-3)
    lists some sample pointer offset calls and their actions. **fout** is an **ofstream**
    object.


    **Table 11.3 — Pointer offset calls**


    | *Seek call* | *Action* |

    |---|---|

    | `fout.seekg(0, ios::beg);` | Go to start |

    | `fout.seekg(0, ios::cur);` | Stay at the current position |

    | `fout.seekg(0, ios::end);` | Go to the end of file |

    | `Fout.seekg(m,ios::beg);` | Move to (m + 1)th byte in the file |

    | `fout.seekg(m,ios::cur);` | Go forward by m byte form the current position |

    | `fout.seekg(-m,ios::cur);` | Go backward by m bytes from the current position
    |'
