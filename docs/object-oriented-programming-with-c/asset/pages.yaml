  md: '# # Key Concepts


    Software development components | Procedure-oriented development tools | Object-oriented
    paradigm | OOP notations and graphs | Data flow diagrams | Object-oriented design
    | Top-down decomposition | System i mplementation | Procedure-oriented paradigm
    | Classic software development life cycle | Fountain model | Object-oriented analysis
    | Textual analysis | Class hierarchies | Structured design | Prototyping paradigm




    Software engineers have been trying various _tools, methods,_ and _procedures_
    to control the process of software development in order to build high-quality
    software with improved productivity. The methods provide “how to ‘s” for building
    the software while the tools provide automated or semi-automated support for the
    methods. They are used in all the stages of software development process, namely,
    planning, analysis, design, development and maintenance. The software development
    procedures integrate the methods and tools together and enable rational and timely
    development of software systems (Fig. 17 1). They provide guidelines as to how
    to apply the methods and tools, how to produce the deliverables at each stage,
    what controls to apply, and what milestones to use to assess the progress.'
  merge: -1
  img_proc: true
- pgno: 681
  md: '![](img/62b7c32e48e4f960a8dc2825a7119fb2_681_0.png)


    # Fig. 17.1 Software development components


    There exist a number of software development paradigms, each using a different
    set of methods and tools. The selection of a particular paradigm depends on the
    nature of the application, the programming language used, and the controls and
    deliverables required. The development of a successful system depends not only
    on the use of the appropriate methods and techniques but also on the developer’s
    commitment to the objectives of the system. A successful system must:


    +   1. satisfy the user requirements,

    +   2. be easy to understand by the users and operators,

    +   3. be easy to operate,

    +   4. have a good user interface,

    +   5. be easy to modify,

    +   6. be expandable,

    +   7. have adequate security controls against misuse of data,

    +   8. handle the errors and exceptions satisfactorily, and

    +   9. be delivered on schedule within the budget.'
  merge: -1
