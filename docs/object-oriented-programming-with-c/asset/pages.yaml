    # ## C.10 Managing Errors I


    It is rare that a program runs successfully the first time itself. It is common
    to make some syntax errors while preparing the program or during typing. Fortunately,
    all such errors are detected by the compiler or linker.


    # ## Compiler Errors


    All syntax errors will be detected by the compiler. For example, if you have missed
    the semicolon at the end of the **return** statement in **test.cpp** program,
    the following message will be displayed in the message window.'
