    \ not specify any return type for the `main()` function which is the starting\
    \ point for the execution of a program. The definition of `main()` would look\
    \ like this:\n\n```\n```c\nmain()\n{\n        // main program statements\n}\n\
    ```\n```\n\nThis is perfectly valid because the `main()` in C does not return\
    \ any value.\n\nIn C++, the `main()` returns a value of type int to the operating\
    \ system. C++, therefore, explicitly defines `main()` as matching one of the following\
    \ prototypes:\n\n```\n```cpp\nint main();\nint main(int argc, char * argv[]);\n\
    ```\n```\n\nThe functions that have a return value should use the return statement\
    \ for termination. The `main()` function in C++ is, therefore, defined as follows:"
