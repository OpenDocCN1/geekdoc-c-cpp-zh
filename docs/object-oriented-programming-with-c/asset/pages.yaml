    The richness of OOP environment has enabled the software industry to improve not
    only the quality of software systems but also its productivity. Object-oriented
    technology is certainly changing the way the software engineers think, analyze,
    design and implement systems.


    # Summary


    +   - Software technology has evolved through a series of phases during the last
    five decades.

    +   - The most popular phase till recently was procedure-oriented programming
    (POP).

    +   - POP employs *top-down* programming approach where a problem is viewed as
    a sequence of tasks to be performed. A number of functions are written to implement
    these tasks.

    +   - POP has two major drawbacks, viz. (1) data move freely around the program
    and are therefore vulnerable to changes caused by any function in the program,
    and (2) it does not model very well the real-world problems.

    +   - Object-oriented programming (OOP) was invented to overcome the drawbacks
    of the POP. It employs the *bottom-up* programming approach. It treats data as
    a critical element in the program development and does not allow it to flow freely
    around the system. It ties data more closely to the functions that operate on
    it in a data structure called **class**. This feature is called **data _encapsulation_**.

    +   - In OOP, a problem is considered as a collection of a number of entities
    called **objects**. Objects are instances of classes.'
