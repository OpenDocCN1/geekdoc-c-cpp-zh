  md: 'As stated earlier, friend functions may be used in the place of member functions
    for overloading a binary operator, the only difference being that a friend function
    requires two arguments to be explicitly passed to it, while a member function
    requires only one.


    The complex number program discussed in the previous section can be modified using
    a friend operator function as follows:


    +   1. Replace the member function declaration by the friend function declaration.


    ```

    friend complex operator+(complex, complex);

    ```


    +   2. Redefine the operator function as follows:


    ```

    complex operator+(complex a, complex b)

    {

    return complex((a.x+b.x),(a.y+b.y));

    }

    ```


    In this case, the statement


    ```

    C3 = C1 + C2;

    ```


    is equivalent to


    ```

    C3 = operator+(C1, C2);

    ```


    In most cases, we will get the same results by the use of either a friend function
    or a member function. Why then an alternative is made available? There are certain
    situations where we would like to use a friend function rather than a member function.
    For instance, consider a situation where we need to use two different types of
    operands for a binary operator, say, one an object and another a built-in type
    data as shown below,


    ```

    A = B + 2; (or A = B * 2;)

    ```'
