  md: "# Key Concepts\n\nReturn types in main( ) | Function prototyping | Call by\
    \ reference | Call by value | Return by reference | Inline functions | Default\
    \ arguments | Constant arguments | Function overloading\n\n# 4.1  Introduction\n\
    \nWe know that functions play an important role in C program development. Dividing\
    \ a program into functions is one of the major principles of top-down, structured\
    \ programming. Another advantage of using functions is that it is possible to\
    \ reduce the size of a program by calling and using them at different places in\
    \ the program.\n\nRecall that we have used a syntax similar to the following in\
    \ developing C programs.\n\n```\nvoid show( );                 /* Function declaration\
    \ */\nmain( )\n{\n    ....\n        show( );               /* Function call */\n\
    \    ....\n}\nvoid show( )                 /* Function definition */\n{\n    ....\n\
    \    ....                         /* Function body */\n    ....\n}\n```\n\nWhen\
    \ the function is called, control is transferred to the first statement in the\
    \ function body. The other statements in the function body are then executed and\
    \ control returns to the main program when the closing brace is encountered. C++\
    \ is no exception."
