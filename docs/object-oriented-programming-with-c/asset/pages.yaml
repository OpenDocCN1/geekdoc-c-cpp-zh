- pgno: 116
  md: 'Relational Expressions yield results of type **bool** which takes a value **true**
    or **false**. Examples:


    ```

    x <= y

    a+b == c+d

    m+n > 100

    ```


    When arithmetic expressions are used on either side of a relational operator,
    they will be evaluated first and then the results compared. Relational expressions
    are also known as *Boolean expressions*.


    # Logical Expressions


    Logical Expressions combine two or more relational expressions and produces **bool**
    type results. Examples:


    ```

    a>b

    x == 10 x == 10 || y == 5

    ```


    # Bitwise Expressions


    Bitwise Expressions are used to manipulate data at bit level. They are basically
    used for testing or shifting bits. Examples:


    ```

    x << 3      // *Shift three bit position to left*

    y >> 1      // *Shift one bit position to right*

    ```


    Shift operators are often used for multiplication and division by powers of two.


    ANSI C++ has introduced what are termed as *operator keywords* that can be used
    as alternative representation for operator symbols. Operator keywords are given
    in Chapter 16.


    # 3.21  Special Assignment Expressions


