    are necessary for handling formatted input and output operations |

    | **istream** (input stream) | • Inherits the properties of ios<br>• Declares
    input functions such as get(), **getline()** and **read()**<br>• Contains overloaded
    extraction operator >> |

    | **ostream** (output stream) | • Inherits the properties of ios<br>• Declares
    output functions put() and **write()**<br>• Contains overloaded insertion operator
    << |

    | **iostream** (input/output stream) | • Inherits the properties of ios, **istream**
    and **ostream** through multiple inheritance and thus contains all the input and
    output functions |

    | **streambuf** | • Provides an interface to physical devices through buffers<br>•
    Acts as a base for **filebuf** class used in ios files |


