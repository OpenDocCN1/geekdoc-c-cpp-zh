    # Summary


    - In C++, the I/O system is designed to work with different I/O devices. This
    I/O system supplies an interface called ‘stream’ to the programmer, which is independent
    of the actual device being used.

    - A stream is a sequence of bytes and serves as a source or destination for an
    I/O data.

    - The source stream that provides data to the program is called the _input stream_and
    the destination stream that receives output from the program is called the _output
    stream_.

    - The C++ I/O system contains a hierarchy of stream classes used for input and
    output operations. These classes are declared in the header file ‘_iostream_’.

    - **cin** represents the input stream connected to the standard input device and
    **cout** represents the output stream connected to the standard output device.

    - The **istream** and **ostream** classes define two member functions **get()**
    and **put()** to handle the single character I/O operations.

    - The **>>** operator is overloaded in the **istream** class as an extraction
    operator and the **<<** operator is overloaded in the **ostream** class as an
    insertion operator.

    - We can read and write a line of text more efficiently using the line oriented
    I/O functions **getline()** and **write()** respectively.'
