    not introduce any undesirable side-effects into the rest of the classes.


    Note that each sub-class defines only those features that are unique to it. Without
    the use of classification, each class would have to explicitly include all of
    its features.


    # Polymorphism


    *Polymorphism* is another important OOP concept. Polymorphism, a Greek term, means
    the ability to take more than one form. An operation may exhibit different behaviours
    in different instances. The behaviour depends upon the types of data used in the
    operation. For example, consider the operation of addition. For two numbers, the
    operation will generate a sum. If the operands are strings, then the operation
    would produce a third string by concatenation. The process of making an operator
    to exhibit different behaviours in different instances is known as *operator overloading*.


    Figure 1.9 illustrates that a single function name can be used to handle different
    number and different types of arguments. This is something similar to a particular
    word having several different meanings depending on the context. Using a single
    function name to perform different types of tasks is known as *function overloading*.


    Polymorphism plays an important role in allowing objects having different internal
    structures to share the same external interface. This means that a general class
    of operations may be accessed in the same manner even though specific actions
    associated with each operation may differ. Polymorphism is extensively used in
    implementing inheritance.'
