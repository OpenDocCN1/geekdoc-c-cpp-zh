  md: '# 对具体行政行为事实问题审查强度的规范分析


    **摘要** 对具体行政行为事实问题的审查强度是行政诉讼法学上的一个核心问题，也是司法实践中的难题。现行法律和司法解释构建了以证据制度为中心的审查框架，但未能为法官提供明确的操作标准。本文通过规范分析认为，事实问题与法律问题并非截然两分，其审查强度应当是一个基于多元变量的动态裁量过程。法院对事实问题的审查强度，应当结合被诉行为所涉行政领域的专业性、对相对人权益的影响程度、行政行为的过程性等因素综合确定，并在司法能动与司法谦抑之间寻求平衡。


    **关键词** 事实问题；审查强度；行政诉讼；司法审查；规范分析


    **Abstract** The intensity of judicial review of factual issues in specific administrative
    acts is a core issue in administrative litigation law and a difficult problem
    in judicial practice. Current laws and judicial interpretations have established
    a review framework centered on evidence rules, but they fail to provide judges
    with clear operational standards. Through normative analysis, this paper argues
    that factual and legal issues are not completely separate, and the intensity of
    review should be a dynamic discretionary process based on multiple variables.
    The court’s intensity of review of factual issues should be comprehensively determined
    by factors such as the professionalism of the administrative field involved, the
    degree of impact on the rights and interests of the private party, and the procedural
    nature of the administrative act, while seeking a balance between judicial activism
    and judicial restraint.


    **Key words** factual issue; intensity of review; administrative litigation; judicial
    review; normative analysis


    一、问题的提出


    行政诉讼的审查对象是具体行政行为的合法性。对事实问题的审查，是法院判断行政行为是否合法的基础性环节，也是必经环节。无论行政行为的作出依据的是何种授权，其都必须建立在行政机关对特定事实的认定之上。人民法院对行政行为进行司法审查时，对行政机关认定的事实应当采取何种态度，尊重到何种程度，即所谓事实问题的审查强度问题。


    然而，对于这一具有根本意义的问题，我国《行政诉讼法》及司法解释并未作出正面、明确的规定。现行法上的审查框架，主要是围绕证据制度展开的：法院通过审查证据的真实性、合法性和关联性，进而判断被诉行政行为所认定的事实是否“证据确凿”。《行政诉讼法》第六十九条规定，行政行为“证据确凿，适用法律、法规正确，符合法定程序的”，人民法院判决驳回原告的诉讼请求；第七十条第（一）项则将“主要证据不足”作为判决撤销的具体情形之一。有学者指出，上述规定形成了一种以“证据是否确实充分”为核心的一元化审查标准，其特点是重证据而轻过程，重结果而轻理由。


    但问题在于，证据与事实认定之间的关系并非单一向度的逻辑推演。对证据的取舍、对证据证明力的评价、对间接证据的推理、对相互矛盾的证据的权衡，这些环节都内含着裁量因素。不同法官面对同一证据材料，可能得出完全不同的事实认定结论。仅凭“主要证据不足”或“证据确凿”这种抽象标准，并不足以指导法官完成对事实问题的审查。二十余年来，最高人民法院通过司法解释和个案批复，不断对审查标准进行微调，引入了“明显缺乏说服力”、“滥用职权”、“显失公正”等概念，但这些概念本身亦属不确定法律概念，其适用依然有待具体化。


    值得注意的是，与我国行政诉讼制度有一定渊源的德国法上，法院对事实问题的审查原则上不受限制，法院应当全面审查行政行为所依据的事实和证据；而在美国法上，法院对行政决定中的事实认定，则根据其所属类型分别适用“实质证据标准”、“专断和反复无常标准”或“法院重新审理标准”。这种差异背后，既有司法体制上的原因，也有行政法与行政诉讼理论上的深刻分歧。本文不拟全面比较两大法系的相关制度，而是试图从规范分析的路径，对我国的审查强度问题作一个理论上的梳理，并尝试提出一个具有解释力的分析框架。'
