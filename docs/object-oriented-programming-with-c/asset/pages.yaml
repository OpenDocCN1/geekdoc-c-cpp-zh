  md: '# Fig. 14.3 *Elements in a sequence container*


    The STL provides three types of sequence containers:


    +   - vector

    +   - list

    +   - deque


    Elements in all these containers can be accessed using an iterator. The difference
    between the three of them is related to only their performance. [Table 14.2](#table-14-2)
    compares their performance in terms of speed of random access and insertion or
    deletion of elements.


    **Table 14.2 — Comparison of sequence containers**


    | Container | Random access | Insertion or deletion in the middle | Insertion
    or deletion at the ends |

    |---|---|---|---|

    | vector | Fast | Slow | Fast at back |

    | list | Slow | Fast | Fast at front |

    | deque | Fast | Slow | Fast at both the ends |


    # Associative Containers


    Associative containers are designed to support direct access to elements using
    keys. They are not sequential. There are four types of associative containers:


    +   - set

    +   - multiset

    +   - map

    +   - multimap


    All these containers store data in a structure called *tree* which facilitates
    fast searching, deletion, and insertion. However, these are very slow for random
    access and inefficient for sorting.


    Containers **set** and **multiset** can store a number of items and provide operations
    for manipulating them using the values as the'
