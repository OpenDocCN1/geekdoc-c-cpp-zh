    SERIAL INTERRUPTS ARE DISABLED WHEN HANDLING BUFFERS


    +   Meanings of receiver states (and related policies) are as follows:

    - NORMAL: Receive buffer is empty or filling, but is not full. Reception should
    proceed normally.


    +   - FULL: Receive buffer has marked full. We need to send an XOFF character
    so that the sender allows us to relieve our buffer.


    +   - EMPTYING: Receive buffer is full or emptying, but is not empty. An OFF character
    has already been sent, so reception should be suspended until the buffer is empty.
    If we permitted reception to completely emptying the buffer, we would put ourselves
    in a situation where it is very likely that the buffer would soon fill up again.
    This would be inefficient, as we wish to keep the XON/XOFF : data rate very low.


    This hysteresis helps to achieve that goal.


