    # 12.7 Interrupts


    Forgotten to protect the PSW Register: If we write an interrupt handler routine,
    it is a very good idea to always save the PSW on the stack and restore it our
    interrupt service routine (ISR) is complete. Many 8051 instructions modify the
    bits within PSW. If our ISR does not guarantee that PSW contains the same data
    exit as it had entry, then our program will behave erratically and unpredictably.
    Moreover it will be tricky to debug the behaviour tend to vary depending on when
    and where in the execution of the program, the interrupted


    Forgetting to protect a Register: We must protect all our registers as explained
    above. If we forget to protect a register that we will use in the ISR and which
    might have been used by other part of our program, very strange values may occur.
    If we have problems with registers changing their value unexpectedly or having
    some arithmetic operations producing wrong answers, it is very likely that we
    have forgotten to protect some registers.


    Forgotten to restore protected values: Another common error is to push registers
    onto the stack to protect them, and then we forget to pop them off (in the wrong
    order) before exiting the interrupt. For example, we may push ACC, B, and PSW
    onto the stack to protect them and subsequently pop only PSW and ACC off the stack
    before exiting. In this case, since the value of register B was not restored (popped),
    an extra value remains on the stack. When the RETI instruction is then executed
    at the end of the ISR, the 8051 will use that as part of the return address instead
    of the correct value. In this case, the program will almost certainly crash. We
    must always ensure that the same number of registers are popped off the stack
    and in the right order:


    ```

    PUSH PSW

    PUSH ACC

    PUSH B

    ...

    ...

    POP B

    POP ACC

    POP PSW

    RETI

    ```'
