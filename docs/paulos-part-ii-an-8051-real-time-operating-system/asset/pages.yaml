    ```


    ; RTOS TICKER INTERRUPT SERVICE ROUTINE (ISR)

    ;

    ; THIS IS THE MAIN RTOS ROUTINE WHICH COMES INTO PLAY

    ; AT EVERY TICK TIME, AND SCHEDULES ANY TASK CHANGES.

    ;

    ; A NORMAL TIME INTERVAL WILL BE EVERY 1 MILLISECOND.

    ;

    ; IT DECREMENTS WAITING TICK TIMES FOR EACH TASK, IF WAITING

    ; AND FORCES A TASK CHANGE IF REQUIRED

    ; BY CHANGING THE STACK CONTENTS.


    OS_TICK_TIMER PROC NEAR

    PUSH_INT_REGS


    ```

    ; FIRST CHECK THE PERIODIC INTERVAL TASKS

    MOV CX,NUM_OF_TASKS

    MOV BX,OFFSET_TASK_PARAM

    MOV DL,PARAM_SIZE

    MOV AL, CL ; TASK RANGE = (0 TO NUM_OF_TASKS - 1)

    CHECK0: DEC AL ; AL NOW CONTAINS THE HIGHEST TASK NUMBER


    MOV SI,AX ; SI CONTAINS OFFSET IN TASK RECORD

    CMP PTR [BX + SI + PERIOD_RELOAD],0

    JZ NEXT_CHECK0 SKIP IF TASK IS NOT WAITING PERIODICALLY

    DEC PTR [BX + SI + PERIOD_CURRENT] ; DECREMENT TIME

    JNZ NEXT_CHECK0

    ```


    ```

    ; IF PERIODIC TIME HAS FINISHED,

    ; FIRST RELOAD PERIODIC CURRENT COUNTER

    MOV AX,WORD PTR [BX + SI + PERIOD_RELOAD]

    MOV WORD PTR [BX + SI + PERIOD_CURRENT],AX

    ```


