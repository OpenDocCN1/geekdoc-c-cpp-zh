  md: '# Appendix F Further Examples


    We list here interesting examples for the 8032 microprocessor. Some of them do
    not use RTOS at all, but rely solely on interrupts.


    # Timer 0 in Mode 3 (split timer) and Timer 1 as a baudrate generator


    The first example is a program showing how we can use Timer 0 in the split mode.
    This is not often found deailed in books, probably because of the advanced versions
    of the 8051 have 4 or more timers available. However, if still using the original
    8051, this mode 3 would effectively increase the number of timers available.


    In this example, the two timers from Timer 0 (here labeled as Timer 00 and Timer
    000) both run as 8-bit timer, generating interrupts. The main program checks if
    the required number of interrupts have been generated, and prints a statement
    accordingly.


    Timer 1 is used as a baudrate generator since Timer 0 is running in mode 3, the
    only way to switch on and off the timer is by changing its mode. If Timer 1 is
    set to mode 3, it is stopped. Thus as an example, we are starting the timer 1
    before printing and switching it off we are done with the printing command.


    ```

    /* TimersMode3.c */

    /*

    Timer 0 runs in mode 3, splitting it into two timers, Timer00 and Timer000:

    Timer 0 generates interrupts every 156.25us, counting 144

    hence 6400 interrupts would be equivalent to 1 second


    Timer 000 generates interrupts every 78.12us, counting 72

    hence 38400 interrupts would be equivalent to 3 seconds.


    Timer 1 is used as the baud-rate generator, switching it on and off

    by switching it out of and into its own mode 3.


    /*

    #include <reg51.h>

    #include <stdio.h>


    void SetTimer0_M3(void);

    void SetTimer1_M3(void);

    char putchar(char c);


    /* Global variables */

    bit T00_FLAG, T000_FLAG; // flags to indicate timer timeouts

    ----------------------------------------------------*/


    /*

    putchar : outputs character, used by the printf command

    */

    ```'
