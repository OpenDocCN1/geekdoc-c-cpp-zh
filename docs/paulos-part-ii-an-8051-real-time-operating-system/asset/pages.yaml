    // Clear timer 2 interrupt flag\nTF2 = 0;\n#endif\n// Loop over each task\nfor\
    \ (k = 0; k < NOOFTASKS; k++) {\n    // Update the task's periodic intervals (if\
    \ applicable)\n    if (task[k].interval_count != NOT_TIMING) {\n        task[k].interval_count--;\n\
    \    }\n\n    // Has the periodic interval elapsed?\n    if (task[k].interval_count\
    \ == NOT_TIMING) {\n        task[k].interval_count = task[k].interval_reload;\n\
    \    } else {\n        // The task has been waiting for the period to elapse,\n\
    \        // place it in the READY queue (if not there already)\n        if ((task[k].flags\
    \ & FLAG_PERIODIC) == FLAG_PERIODIC) {\n            task[k].flags &= -FLAG_PERIODIC;\n\
    \            q = ReadyQTop;\n            On_Q = 0;\n            while (q < ReadyQTop)\
    \ {\n                if (k == *q) {\n                    On_Q = 1;\n         \
    \           break;\n                }\n                q++;\n            }\n \
    \           if (On_Q == 0) {\n                ReadyQTop++;\n                *ReadyQTop\
    \ = k;\n                TinQFlag = 1;\n            }\n        }\n\n        //\
    \ If the task was not waiting for this event,\n        // do not place it in the\
