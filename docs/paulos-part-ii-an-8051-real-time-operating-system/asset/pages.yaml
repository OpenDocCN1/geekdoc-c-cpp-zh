    nvoid init_P3UART_int (unsigned char mode, unsigned int baudrate)

    // Set up UART (P3) under interrupt control


    SCON = mode;      /* Setup serial port control register */

    PCON &= 0x7F;     /* Clear SMIT bit in power control reg - No double baud rate
    */

    TM0 |= 0x0F;      /* Setup timer/counter mode register */

    TM1 &= 0xF0;      /* Clear mode and M1 for timer 1 */

    TM1 |= 0x20;      /* Set MI for 8-bit autoreload timer 1 */

    RCLK = 0;         /* USE TIMER 1 FOR RECEIVE BAUD RATE (8032 only) */

    TCLK = 0;         /* USE TIMER 1 FOR TRANSMIT BAUD RATE (8032 only) */

    TH1 = 256;        /* (2880/BR) */


    witch (baudrate) {

    case 300:

    // set up timer 1 count according to baud rate required

    TH1 = TL1 = 0xA0;

    break;

    case 600:

    TH1 = TL1 = 0xD0;

    break;

    case 1200:

    TH1 = TL1 = 0xE8;

    break;

    case 2400:

    TH1 = TL1 = 0xF4;

    break;

    case 4800:

    TH1 = TL1 = 0xFA;

    break;

    case 9600:

    TH1 = TL1 = 0xFD;

    break;

    case 19200:

    TH1 = TL1 |= 0x80; /* double baudrate (SMOD = 1) */

    break;

    case 57600:

    TH1 = TL1 = 0xFF;

    PCON |= 0x80;      /* double baudrate (SMOD = 1) */

    }

