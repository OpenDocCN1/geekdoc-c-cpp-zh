    # Programming Tips and Pitfalls


    # 12.3 SFRs


    SFRs are used to control the way 8051 peripherals functions. Not all the addresses
    above 80h are assigned to SFRs. However, this area may not be used as additional
    RAM memory even if a given address has not been assigned to an SFR. Free locations
    are reserved for future versions of the controller and if we use that, then our
    program will not be compatible with future versions of the microcontroller, since
    some locations might be used for additional SFRs in the upgraded version. Moreover,
    certain unused locations may actually be non-existent, in the sense that the cells
    for them may not part of the memory mask when being manufactured, and hence if
    we write the code to use these locations, no actual data would be stored!


    It is therefore recommended that we not read from or write to any SFR addresses
    that have not been actually assigned to an SFR. Doing so provoke undefined behaviour
    and may cause our program to be incompatible with some 8051 derivatives that use
    free addresses to store the additional SFRs for some new timer or peripheral included
    in the new derivative.


    If we write a program that utilizes the new SFRs that are specific to a given
    derivative chip (and which therefore were not included in the standard basic 8051
    SFR list), our program will not run properly on a standard 8051 where those simply
    do not exist. Thus, it is best to use non-standard SFRs only if we are sure that
    our program will only have to run on that specific micro-controller. If we happen
    to write code that uses non-standard SFRs and subsequently share it with a third-party,
    we must make sure to let party know that our code is using non-standard SFRs and
    can only be used with that particular device. Good remarks notes and warnings
    within the program source listing would help.


    # 12.4 Port usage


    While the 8051 has four I/O ports (P0, P1, P2, and P3), if our hardware uses external
    RAM or external code memory (i.e. if our program is stored in an internal ROM
    or EPROM or if we use external RAM chips) cannot use P0 or P2. This is because
    the 8051 uses ports P0 and P2 to address the external memory. Thus if we use external
    RAM or code memory we may only use ports P1 (and perhaps P3 with some restrictions
    depending on the application program, since the P3 bits are also used as RD, WR,
    T1, T0, INT, TXD and RXD) for our own use.


    # 12.5 DPTR


    DPTR is really a combination of two 8-bit registers DPH and DPL, taken together
    as a 16-bit value. In reality, we always have to deal with DPTR one byte at a
    time. For example, to push DPTR onto the stack we must first push DPL and then
    push DPH. We cannot simply push DPTR onto the stack as a 16-bit value in one step.'
