  md: '# Appendix A ParrOS.a51


    Round-Robin RTOS


    This is the round-robin real-time operating system called ParrOS (an acronym for
    Paul''s Round-Robin Operating System) and is perhaps the simplest operating system
    which can be written.


    The operation can be explained as follows:


    A timer interrupt is generated at regular intervals. This interrupt is used to
    run periodically a crucial Interrupt Service Routine (ISR). This ISR uses counters
    to accurately determine whether the specified slot time has passed, at which point
    a function is called which the task-swapping problem. Mainly this function stores
    all the stack area for the current task and replaces it with the stack for the
    next task scheduled to run. At this point the jump is made to the new task and
    the program continues seamlessly with the new task until its slot time has elapsed.
    The process repeats indefinitely, looping through all the tasks.


    We start by explaining how the variables are stacked in the internal memory area
    of the 8051. Table A-1 shows the way the variables used in this RTOS program have
    been set up. Most of the variables reside in the internal 256 RAM of the 8032
    micro-processor. The external RAM (from address 8100H to 9FFH for the Flight 32
    board) is used to store the stacks of all the tasks and of the main idle program.
    These stacks are swapped in turn the area reserved for the stack in the internal
    RAM whenever a task swap is necessary.'
  merge: -1
  pgno: 17
