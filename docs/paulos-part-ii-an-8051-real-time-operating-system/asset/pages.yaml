    Notes: The IDATA space overlaps physically the DAT and bits of

    the 8051 CPU. At minimum the memory space occupied by the C51

    -time routines must be set to zero.


    # Reentrant Stack Initialization


    The following EQU statements define the stack pointer for reentrant

    functions and initialise:


    ```

    ; Stack Space for reentrant functions in the SMALL model.

    IBSTACK EQU 1 ; set to 1 if small reentrant is used.

    IBSTACKTOP EQU 0FFH+1 ; set top of stack to highest location+1

    ;IBSTACKTOP EQU          ; set top of stack to highest location+1

    ```


    ```

    ; Stack Space for reentrant functions in the LARGE model.

    XBPSTACK EQU 0 ; set to 1 if large reentrant is used.

    XBPSTACKTOP EQU 0FFFFH+1 ; set top of stack to highest location+1

    ```


    ```

    ; Stack Space for reentrant functions in the COMPACT model.

    PBPSTACK EQU 0 ; set to 1 if compact reentrant is used.

    BPBPSTACKTOP EQU 0FFFFH+1 ; set top of stack to highest location+1

    ```


    Page Definition for the Compact Model with 64 KByte xdata RAM

    The following EQU statements define the xdata page used for pdata

    variables. The PPAGE page used with the PPAGE control used

    in the linker invocation.


    ```

    PPAGE EQU 0 ; set to 1 if pdata object is used.

    PPAGE EQU 0 ; define PPAGE number.

    ```


    ```

    PP_SFR DATA 0AGH ; SFR supplies uppermost address byte

    (most 8051 variants use P2 as uppermost address byte)

    ```'
