    ```\n/*\n********************************************************************\n\
    */\n/*\n********************************************************************\n\
    \ * Function name : OS_RTOS_GO\n * Function type : Initialisation System call\n\
    \ * Description   : This system calls is used to start the RTOS going south\n\
