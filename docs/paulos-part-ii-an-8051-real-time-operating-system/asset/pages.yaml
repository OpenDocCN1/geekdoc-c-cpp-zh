  md: '# PaulOS An 8051 Real-Time Operating System


    # Appendix B


    Part II


    +   - Places the task number in the next available location in Ready Queue, meaning
    that this task is ready to execute. The location pointer in Ready Queue is referred
    to as READYQTOP in the program, and incremented every time this command is issued.

    - Loads the address of the start of the task in the bottom of the stack area in
    external ram allocated to this task. The SP for this task would have been already
    saved, by the INIT_RTOS command, pointing to an offset 13 bytes by this.


    # RTOSGOMSEC(Msec, Priority)


    This system command is used only once in the main program, when the RTOS would
    be required to start supervising the processes. It takes two parameters, namely:


    ''The number of milliseconds, which would be the base reference for other time
    dependent commands, such as PERIODIC, WAITT and WAITS.


    The Priority (0 or 1), if set to 1, implies that tasks placed in the Ready Queue,
    to execute, would be sorted in descending order before the RTOS selects the next
    task to run. A task number of 0 is assigned to the HIGHEST priority task, and
    would obviously be given preference during the sorting.


    ![](img/7a94aaa54913061db4ca134993105b1b_40_0.png)'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# PaulOS An 8051 Real-Time Operating System

    Part II


    An example of the syntax used for this command:


    RTOSGOMSEC(10,1)


    This would start the RTOS ticking, at a reference time signal of 10 milliseconds.
    This 10 milliseconds

    would become the basic reference unit for other system commands which use any
    timeout parameter.


    The RTOS would also be required to execute task sorting prior to any task change.
    It should be pointed

    out, that the RTOS ticker would still be generating interrupts half a millisecond
    (if the

    HALFMSEC is set to 1 in the function ), so as respond to external interrupts relatively
    quickly.


    This system command performs the following:


    +   - Loads the variable DELAY (LO and HI bytes), with the number of BASIC_TICKS
    required

    to obtain a millisecond interval. Since BASIC_TICKS correspond to a half second

    interval in Timer 2, then to get a millisecond interval, DELAY is simply loaded
    with 2.

    - Set the PRIORITY bit according to the parameter supplied.

    - Load RCAP2H and RCAP2L, the timer 2, with the required count in order

    of obtain half millisecond interval between two overflows. The value used

    dends on the crystal frequency used on the board. The clock registers count up
    at the

    telfth clock, using a clock frequency of 11.0592 MHz, each count would

    involve a time delay of 12/11.0592 usec (1.085 us).

    - Therefore to get a delay of half a millisecond (500 ucs), 500/1.085 or 460.8
    counts would

    be needed. Since there is a lot of overhead in the Pushes and Pops involved during
    every

    interrupt, a count of 450 was used. Moreover, since the timers can generate an
    interrupt

    there is an overflow in the registers, the registers are again counted with 65086
    or

    (65536 – 450).

    - Store the reference time signal parameter in GOPARAM and TICKCOUNT.

    - Start timer 2 in 16-bit auto-reload mode.

    - Enable interrupts.

    - Set TF2, which is the timer 2 overflow interrupt flag, causing the 1st interrupt.


    # RUNNING_TASK_ID()


    This system command is used by a task to get the number of the task itself. It
    returns a value (in R7

    bank 0). The same task continues to run after executing this system command.


    An example of the syntax used for this command:


    ```

    X = RUNNING_TASK_ID(); /* where X would be an unsigned integer */

    ```'
