  md: "# PaulOS An 8051 Real-Time Operating System\n\nThe main program is a simple\
    \ clock, displaying time in HH:MM:SS format. It uses three tasks, one task for\
    \ the hour, another task for the minute and the last for the second. The MINUTE\
    \ and HOUR tasks are always waiting for a signal while the SECOND task is simply\
    \ waiting for a delay of 1 second. After 60 seconds have passed, it sends a signal\
    \ to the MINUTE task. Similarly once 60 minutes have passed, the MINUTE task would\
    \ send a signal to the HOUR task.\n\n```\n; CLOCK1.ASM\n; Using BIOS INT to get\
    \ time ticks since midnight\n;\n; Used to generate rtos ticks\n;\n; Written by\
    \ Paul P. Debono ( JAN 2012 )\n;\n====================================================================\n\
    \n; EQUATES\n; APPLICATION SETTINGS\nNUM_OF_TASKS EQU 3\nIDLE_TASK    EQU NUM_OF_TASKS\n\
    Include ostickd.inc\n====================================================================\n\
    \nCODESEG      SEGMENT\nASSUME CS:CODEDESEG; DS:CODEDESEG; SS:CODESEG ; advices\
    \ MASM\n               ; which segments to use\n\nORG 100H ; start at offset 100H\
    \ FOR COM FILE\nSTART:       MOV AX, CS\n               MOV DS, AX\n         \
    \      MOV SS, AX\n               MOV SP, OFFSET TOP_OF_STACK\n              \
    \ MOV WORD PTR [MV_CODE_SEG], CS ; STORAGE FOR CS, WHENEVER NEED\n           \
    \    JMP MAIN\n\n====================================================================\n\
    \ninclude ostickd.inc\n====================================================================\n\
    \n====================================================================\n; START\
    \ OF MAIN TEST (APPLICATION) PROGRAM\n====================================================================\n\
    ```"
