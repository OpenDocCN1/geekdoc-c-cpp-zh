    # Appendix G 8086 PaulOS RTOS


    8086 PaulOS RTOS Demo Program


    Sometimes, we had encountered instances where students wanted to use some 8086-based
    development board as their embedded system. An 8086 version of the basic PaulOS
    RTOS was therefore developed and is being given just here for the benefit of those
    who are on the 8086 processor. This is in fact just a demonstration version of
    the PaulOS RTOS program, written for the Intel 8086/8088 micro-processor. It can
    be compiled on the latest PCs using any good 8086 assembler (such as MASM) to
    produce the .COM file which can be executed directly.


    It is composed of four modules:


    +   - The main module CLOCK1.ASM, which basically contains the application program
    and ''includes'' the other .INC files

    - The RTOS ''include'' file OSTICKHD.INC – header

    - The RTOS ''include'' file OSTICKMD.INC – middle

    - The RTOS ''include'' file OSTICKFT.INC – footer


    The .INC files are the actual PaulOS RTOS program, written in assembly language
