  md: '# End Notes


    +   1. The original idea for this RTOS came from the book "C and the 8051 – Building
    Efficient Applications – Volume II" by Thomas W. Schultz and published by Practice
    Hall (0-13-521121-2). In this book, Prof. Schultz discusses the development of
    two real-time kernels. The first one is the RTKS which I corrected and developed
    into PaulOS co-operative RTOS. The second one is the RTKB which I also corrected,
    modified and developed into MagOS pre-emptive RTOS. Both operating systems, RTKS
    and RTKB as written in the book are not fully functional, contain some errors
    and lack some essential components. I correspond with Prof. Schultz and sent him
    my modifications and final versions of the programs which he later acknowledged
    in the 3rd edition of the book "C and the 8051", again published by Prentice-Hall
    (0-58961-237-X). So I am particularly grateful to Prof. Schultz for being the
    catalyst of my increased interest in RTOS.

    2. The development of a pre-emptive RTOS, named RTKB is described in the book
    "C and the 8051 – Building Efficient Applications – Volume II" published by Prentice-Hall
    (0-13-521121-2. A third edition was later published having the ISBN 1-58961-237-X
    where the author acknowledged my contribution to the development of a working
    version of his original RTOS.'
