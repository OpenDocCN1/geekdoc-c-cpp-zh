    TMOD &= 0x0F; // clear timer 0 control bits only

    TMOD |= 0x02; // mode 2 (8-bit reload), GATE = C/T = 0

    TLO = 112;    // 256 - 144 = 112 => 156.25us for Timer 0

    TH0 = 112;    // reload value in TH0

    TF0 = 0;      // Clear overflow flag

    TR0 = 1;     // Timer 0 ON

    ETO = 1;      // Enable T0 interrupt, from Timer 0 overflows

