  md: '# Appendix B PaulOS A51 version


    The PaulOS RTOS

    This is the A51 assembly language of the PaulOS (Paul''s Operating System) RTOS.
    It has been superseded by its C language version but we have included it for the
    benefit of those who are keen to use the assembly language even in ''large'' projects.
    Many of the explanations have already been included in Chapter 9 but have been
    retained here just be sure so as to make it a self-contained appendix. The idea
    behind the PaulOS RTOS is that any task (part of program) can be in any ONE of
    three states:


    # RUNNING


    It can be RUNNING, (obviously in the 8051 environment, there can only be one task
    which is running.)


    # WAITING


    It can be in the WAITING or SLEEPING queue. Here a task could be waiting for any
    of the following:


    +   - a specified amount of time, selected by the user with WAITT command.

    - a specified amount of time, selected by the user with PERIODIC command.

    - a specified interrupt to occur within a specified time, selected by the user
    with the WAIT command.

    - a signal from some other task within a specified timeout.

    - a signal from some other task indefinitely.

    - finally, a task could be waiting here for ever, effectively behaving as if the
    task did not exist.

    This is specified by the KILL command.


    # READY


    It can also be in the READY QUEUE, waiting for its to execute.


    This can be visualised in Figure 7-1 which shows how the task can move from one
    state to the other.


    The RTOS itself resides in the background, and comes into play:


    +   - At every RTOS TIMER interrupt (usually Timer 2 or Timer 0, every millisecond).

    - At any other interrupt from other timers or external inputs.

    - Whenever an RTOS system command is issued by the main program or tasks.'
