    | 0 | EXTERNAL INT 0 | (IEMASK = 00000001 = 01H)|

    | 1 | TIMER COUNTER 0 | (IEMASK = 00000010 = 02H)|

    | 2 | EXTERNAL INT 1 | (IEMASK = 00000100 = 04H)|

    | 3 | TIMER COUNTER 1 | (IEMASK = 00001000 = 08H)|

    | 4 | SERIAL PORT | (IEMASK = 00010000 = 10H)|

    | 5 | TIMER COUNTER 2 | (IEMASK = 00100000 = 20H)|


    ; CREATE (TSK,SKADDER) Create a new task (0-[n-1]),placing it in the Queue,

    ; and set up correct task address on its stack.


    ; RTOSGEM(TICKTIME)

    ; Start RTOS, interrupt every TICKTIME (1-255) msecs.

    ; PRIORITY = 1 implies Q priority is required.

    ; PRIORITY = 0 implies FIFO function queue.


    | SET_IDLE_MODE() | Puts micro-controller in Idle mode (IDL, bit 0 in PCON)|

    | SET_POWER_DOWN() | Puts micro-controller in Power down (PD, bit 1 in PCON)|


    ; PERIODIC(TIME)

    ; Repeat task every TIME msecs.

    ; CHECK() Check if task has its signal set (Returns 1 or 0).

    ; Signal is cleared if it was found to be set.


    ; SIGNAL(TASKNUMBER)

    ; Set signal bit of specified task (0-[n-1]).

    ; RUNNING_TASK_ID(ID) | Returns the number of the currently executing task


    ; THE FOLLOWING COMMANDS WILL CAUSE A CHANGE IN TASK ONLY

    ; WHEN THE SIGNAL IS NOT ALREADY PRESENT.


    ; WAITS(TIMEOUT)

    ; Wait for signal timeout ticks (TIMEOUT = 1-65535).

    ; Wait for signal indefinitely (TIMEOUT = 0).

    ; If signal already present, proceed with current task.


    ; WAIT()

    Wait for interval to pass.

    ; If interval passed, proceed with current task.


    ; THE FOLLOWING COMMANDS, ALWAYS CAUSE A CHANGE IN TASK:


    ; WAIT(TIMEOUT)

    Wait for timeout ticks (1-65535).

    ; WAIT(INTNUMUM)

    Wait for the given interrupt to occur.


    ; DEFER()

    Stop current task and let it wait for 1 tick.

