    ; User-defined Power-On Initialization of Memory

    ; With the following EQU statements the initialization of memory

    ; at processor reset defined:

    ; the absolute start-address of IDATA memory is always 0

    IDATEL EQ 100H ; the length of IDATA memory in bytes for the 8032 (256 bytes).


    XDATASTART EQ OH ; the absolute start-address of XDATA memory

    XDATALEN EQ OH ; the length of XDATA memory in bytes.


    PDATASTART EQ OH ; the absolute start-address of PDATA memory

    PDATEN EQ OH ; the length of PDATA memory in bytes.


    ;Notes: The IDATA space overlaps physically the DATA and BIT areas of

    ; 8051 CPU. At the memory space occupied from the C51

    ; run-time routines must be set to zero.

    ; ---

    ; Reentrant Stack Initialization

    ; The following EQU statements define the stack pointer for reentrant

    ; functions and initialize it:

    ; Stack Space for reentrant functions in the SMALL model.

    IBPSTACK EQ 0 ; set to 1 if small reentrant is used.

    IBFPSTACK EQ FFH+1 ; set top of stack to highest location+1.

    IBFSTACKTOP EQ 07FH+1 ; set top of stack to highest location+1.

    ; ---

    ; Stack Space for reentrant functions in the LARGE model.

    XBPSTACK EQ 0 ; set to 1 if large reentrant is used.

    XBSTACKTOP EQ 0FFFFH+1 ; set top of stack to highest location+1.

    ; ---

