    # Appendix F


    — EMPTY:


    Receive buffer has the sender been marked empty. We need to send an XON character
    that the sender begins, us to update data again.


    It is worth noting that for Windows communication, a significant receiver buffer
    is required. Furthermore, the threshold level at which XOFF is sent must be significantly
    below the buffer''s capacity. This is required for a couple of reasons.


    First, there might be an incoming byte its way through the UART at the time that
    XOFF is sent. Even assuming an instantaneous response from the RX to XOFF, if
    space does not become available in the buffer prior to the receiving of the interrupt
    for this byte, it will be lost.


    Secondly, and moreover, Windows seems to be very slow in responding to our XOFF,
    if it continues to send data for a significant period before honoring our stop
    request. So, we need space in buffer when incoming data. Received data integrity
    is a priority.


