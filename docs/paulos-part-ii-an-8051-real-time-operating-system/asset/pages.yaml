  md: '# PaulOS En 8051 Real-Time Operating System

    Part II


    An example of the syntax used for this command:


    ```

    KILL();

    /* the task simply stops to execute and a new task would take over.*/

    ```


    # RESUME (Task Number)


    This system command is used in a task to resume another task which had already
    KILLED itself. The parameter passed the number of the task which has to be restarted.
    After executing this command, the calling task itself is DEFERed to give up its
    CPU time to any other task (presumably the resurrected!)


    An example of the syntax used for this command:


    ```

    RESUME(X);      /* where X would be a task number */

    ```


    The task issuing this command, would then be placed in the waiting queue, for
    one tick.


    # DEFER()


    This system command is used by a task in order to hand over processor time to
    another task. The task is simply placed in the Waiting Queue, always waiting for
    just 1 tick, while a new task resumes execution.


    ![](img/7a94aaa54913061db4ca134993105b1b_46_0.png)'
  merge: -1
