  md: '# PaulOS An 8051 Real-Time Operating System

    Programming Tips and Pitfalls

    Part II


    Using the wrong register bank: Another common error occurs when calling another
    function or routine from within ISR. Very often the called would be written with
    a particular register bank in mind, and if the ISR is using another bank, there
    might be problems referring to the registers in the called routine. If we are
    writing our own routine, then in the ISR we can save the register, change the
    register bank and restore the PSW register before exiting from the called routine.

    However, particularly if we are using the C compiler, we might be using functions
    and procedures pre-written in the compiler and we do not have any control over
    it, and therefore can result in program

    functioning not intended.


    This problem is particularly serious when using pre-emptive RTOSs (such as SanctOS
    or MagNOS), where a forced change of switch from task A (which was example for
    using register bank 1) to task B which uses bank 2. For the case of co-operative
    RTOSs (such as PaulOS), we would be in control where we would be able to make
    the necessary precautions.


    Forgetting to re-start a timer: We might turn off a timer to re-load the timer
    register values or to read the counter in an interrupt service routine (ISR) and
    then forget to turn it on again before exiting from the ISR. In this case, the
    ISR would only execute once.


    ![](img/7a94aaa54913061db4ca134993105b1b_14_0.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# PaulOS An 8051 Real-Time Operating System

    Part II


    Forgetting to clear the Timer 2 interrupt flag: When using Timer 2 interrupts,
    the Timer 2 overflow flag

    TF2 is not cleared automatically when the ISR is served. We have to clear it in
    the ISR software (using

    CLR TF2). The same problem occurs if we forget to clear the RI or the TI flags
    when using the Serial

    Interrupt. In this case, the ISR keeps on being called repeatedly.


    Using RETI instead of RETI: Remember that interrupts are always terminated with
    the RETI instruction.

    It is easy to inadvertently use the RETI instruction. However the RETI instruction
    will not end

    nour interrupt smoothly. Usually, using RETI instead of RETI will cause the illusion
    of the main program

    running normally, but the interrupt will only be executed once. If it appears
    that the interrupt mysteriously

    stops executing, we must verify that RETI is being used.


    Certain assemblers contain special features which will issue a warning if the
    programmer fails to protect

    registers or miss some other interrupt-related errors.


    # 12.8 RTOSs pitfalls


    The PaulOS co-operative RTOS is the most robust and secure of the RTOSs which
    we have introduced

    in this text book. This is mainly due to the fact that being a co-operative RTOS,
    the task changes occur

    when we want them since there cannot be forced pre-emptive tasks. However there
    can still

    beidden problems. We should take special care when handling global variables which
    are accessible

    to all tasks. We have to make sure that these variables are allowed to be manipulated
    only when we

    want them to. Otherwise it might happen that a task starts with one value of a
    global variable, then it

    goes on to a wait state, and when it later resumes to run, it might end up with
    the wrong value of

    the same variable.


    This is a very big problem with the SanctOS and MagnOS pre-emptive RTOSs. The
    safest way would be

    to have global variables protected as a resource, allowing them to be changed
    only when it is safe to

    so. These pre-emptive RTOSs (SanctOS and MagnOS) are only written here as a proof
    of concept and

    not as a fully functional robust operating system. This has to be always kept
    in mind.


    The same problem exists in these RTOSs with register banks and tasks which use
    the same functions

    which are non re-entrant.'
  merge: -1
