    /* set Timer 0 mode 3, GATE = C/T = 0 */\n/* splitting two timers, Timer00 and\
    \ Timer000 */\n/* Assuming 11.0592 MHz clock */\n\n/* 156.25 microsecond overflow\
    \ for TFO (normal Timer 00) */\n/* 78.125 microsecond overflow for T1 (extra Timer\
    \ 000) */\nvoid SetupTimer0_m3(void) {\nTMOD &= 0xF0;    /* clear Timer 0 control\
    \ bits only */\nTMOD |= 0x03;    /* mode 3 (split timers), GATE = 0 */\nTL0 =\
    \ 112;      /* 256 - 144 => 156.25us for normal Timer 00 */\nTH0 = 184;      /*\
    \ 256 - 72 => 78.125us for extra Timer 00 */\nTRO = 1;        /* Timer 0 ON */\n\
    TR1 = 1;        /* Timer 00 ON */\nET0 = 0;        /* Enable TFO interrupt, from\
    \ Timer 00 overflow */\nET1 = 1;        /* Enable T1 interrupt, from Timer 000\
    \ overflow */\n}\n\n/*------------------------------------------------------/\n\
    /* set Timer 1 in mode 2, 8-auto-reload, GATE = C/T = 0 */\n/* for 57600 baudrate\
    \ generator */\n/* Assuming 11.0592 MHz clock */\n/* Since Timer 0 is in mode\
    \ 3, timer 1 will be switched on and off\nby setting it to mode 2 (cmf) or mode\
    \ 3 (off) in the application program */\nvoid SetupTimer1(void) {\nTMOD &= 0x0F;\
    \    /* clear timer 1 control bits only (momentarily T1 to mode 0) */\nTMOD |=\
    \ 0x30;    /* initially set to mode 3, i.e. timer off */\nTH1 = TL1 = 0xFF; /*\
    \ set for 28800 or 57600 baudrate (reload value in TH1) */\nPCON = 0x80;     /*\
    \ SMOD = 1 so to double the baudrate */\nSCON = 0x52;     /* 8-bit UART, variable\
    \ baudrate, receiver disabled , \n// transmitter reply T1 = 1 */\n}\n\n/*------------------------------------------------------/\\\
    nvoid T0_ISR (void) interrupt 1 {\nstatic data unsigned int T0_OVF;    // counts\
