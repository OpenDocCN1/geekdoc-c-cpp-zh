    Additionally, there is an instruction to increment DPTR (which INC DPTR). When
    this instruction

    executed, the two bytes are operated upon a 16-bit value. However, there is no
    assembly language

    instruction which decrements DPTR. If we wish to decrement the value of DPTR,
    we must write our

    code to do so, such as:


    ```

    CLR C

    MOV A,DPL

    SUBB A,#1

    MOV DPL,A

    MOV A,DPH

    SUBB A,#0; subtract the carry flag from the first subtraction, if necessary

    MOV DPH,A

    ```


    # 12.6 Serial port (UART)


    To use the 8051''s on-board serial port, it is generally necessary to initialise
    the following four

    s: SCON, PCON, TCON, and TMOD. This is because SCON on its own does not fully
    control the

    serial port. However, in most cases the program will need to use one of the timers
    to establish the serial

    baud rate. In this case, it would be necessary to configure Timer 1 by setting
    TCON and TMOD.

    PCON.7 (known also as SMOD bit, but we should note that PCON is not a bit-addressable
    register), can

    be set to double the baud rate. In this casefore we would also need to program
    bit 7 of a fourth

    register PCON.


    Moreover, if the serial handling routine is to run under interrupt control, the
    appropriate interrupt

    enable bits (ES and EA in the IE SFR) and sometimes the interrupt priority bit
    (PS in the IP SFR)

    have also to be set. This would bring to six the number of SFRs which we need
    to set in order to

    use the UART in interrupt mode.


    TI flag is normally initialized to 0 if using interrupt routines to transmit characters
    stored in some

    software buffer. SBUF is loaded directly with the first character to be transmitted,
    the transmission

    would start, with the start bit, bit 0 to 7 of the data, any parity bit, followed
    by the stop bit. TI would

    be set to 1 automatically when this first character transmission is done and the
    ISR routine is

    trigged which would continue to send any remaining characters in the software
    buffer (TI would need

    be be reset to 0 every time in the ISR code).


    If we are not using serial interrupt routines to transmit data, TI would be initialised
    to 1 in the

    first place, since it is usual practice to start the putchar() routine with:


