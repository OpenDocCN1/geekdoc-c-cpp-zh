  md: "# PaulOS An 8051 Real-Time Operating System\n\n# Appendix E\n\n* number is\
    \ 5.\n\n+   * Arguments : None\n\n+   * Returns : None\n\n```\n/*\n#if ( CPU ==\
    \ 8032) && (TICK_TIMER != 2) && (!STAND_ALONE_ISR_ ) )\nvoid Xtra_Int(void) interrupt\
    \ 5 using 1 {\n  EA = 0;\n  TF2 = 0;\n  Xtra_Int(TIM2_INT); // Pass TIM2_INT for\
