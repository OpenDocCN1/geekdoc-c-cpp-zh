  md: "# PaulOS On 8051 Real-Time Operating System\nPart II\n\nFor the RECEIVER side,\
    \ a character reception from some external source, causes a RI interrupt. The\
    \ RI ISR routine handles any characters which are received. If there is space\
    \ in the RX buffer, it stores it but if the buffer approached the limit, it will\
    \ store character and causes the TX to send an XOFF control to the external source\
    \ (which should also be running an XON/XOFF protocol) so that the external source\
    \ pauses its transmission. Data from the RX buffer will be handled by the main\
    \ program which ensures that the buffers are emptied regularly of any data. Once\
    \ the RX buffer is emptied, an XON character will be sent to the external source\
    \ so that it can resume with its transmission.\n\nIf an XOFF character is received,\
    \ this would cause the TX to be disabled immediately (since this would imply that\
    \ the external source buffer is full). It will be re-enabled once an XON character\
    \ is received.\n\nFor the TRANSMITTER side, data from the main program will be\
    \ written to the buffer. As soon as there is some data in the TX buffer, the TI\
    \ ISR will be triggered to start the transmission. As the TI set once a character\
    \ has been transmitted, this would ensure that the TX buffer is always empty once\
    \ the transmission is started (it is stopped by an XOFF character from the external\
    \ device). There the TI ISR handles the transmission from the buffer to some external\
    \ device. The main program 'printing' routine would place characters directly\
    \ in the TX buffer for transmission, if there is space. If the buffer is full,\
    \ it would simply wait for the buffer, since the transmission would be taking\
    \ under interrupt control.\n\nSince this protocol uses XON/XOFF as special characters,\
    \ it is generally used for text data (which does not have the XON/XOFF characters)\
    \ and cannot be used as it is with any random data since they might have these\
    \ XON/XOFF characters as part of the data itself.\n\nFurther details can be found\
    \ in the remarks within the program listings.\n\n```\n/*\n * XONOFF.H\n */\n\n\
    #ifndef SERIAL_H\n#define SERIAL_H\n\n#include <reg52.h>\n\n// commonly used non-printing\
    \ ASCII codes.\n#define CTRL_C      0x03\n#define CTRL_Q      'q'    // for testing\n\
    //#define CTRL_Q     0x11\n#define CTRL_S      '*'    // for testing\n//#define\
    \ CTRL_Q     0x13\n#define DEL       0x7F\n#define BACKSPACE  0x08\n#define CR\
    \        0x0D\n#define LF        0x0A\n#define BELL      0x07\n```"
