    \ Priority, PT1=1, OTHERS ALL LOW\nMOV IP,#2H\nELSEIF (TICK_TIMER = 2)\n    AND\
    \ ET2=1 (USED FOR RTOS TICK TIME)\nORL A,#00000000\n; Timer 2 High Priority, PT2=1,\
    \ OTHERS ALL LOW\nMOV IP,#2H\nMOV IE,A\n; IN THE ENVIRONMENT, THE KIL SOFT SOFTWARE\
