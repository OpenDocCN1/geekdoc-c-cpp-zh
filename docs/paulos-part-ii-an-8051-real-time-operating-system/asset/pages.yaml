    Table B-4 IEMASK parameter


    This system command performs the following:


    +   - Clears the external memory area which is going to be used to store the stack
    of each task.

    - Sets the IE register (location A8H in the SFR area).

    - Selects edge triggering on the external interrupts. (can be amended if different
    triggering required).

    - Loads the Ready Queue with the main idle task number, so that initially, only
    the main task will execute.

    - Initialises all task as being not waiting for a timeout.

    - Sets up the SP of each task to point to the correct location in the stack area
    of the particular task. The task pointer, initially, is made to point to an offset
    of 14 above the base of the stack [(MAIN_STACK - 1) + NOOPUSHES =2] is seen when
    NOOPUSHES in this case is 13. This is done so as ensure that the first RET instruction
    is executed transferring the stack from external RAM to the 8032 RAM, the SP would
    be pointing correctly to the address of the task to be started. This is seen in
    the QSHFT routine, before the last RET instruction, there is the Pop_Bank0_Reg
    macro which effectively pops 13 registers. The RET instruction would read the
    correct address to jump to the next 2 locations.


    CREATE(Task No., Task Name)


    This system command is used in the main program for each task to be created. It
    takes two parameters, namely the task number (1st task is numbered as 0), and
    the task address, which in the C environment, would simply be the name of the
    procedure. An example of the syntax for this command is:


    CREATE(0,MotorOn);


    This would create a task, number 0. This task would be the MotorOn procedure.


    This system command performs the following:'
