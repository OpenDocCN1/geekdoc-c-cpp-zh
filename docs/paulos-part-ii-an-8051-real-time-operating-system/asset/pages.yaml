    ```\n\n```\n/*\n********************************************************************************\n\
    */\n\n/*\n********************************************************************************\n\
    \n* RTOS FUNCTION DEFINITIONS\n********************************************************************************\n\
    */\n\n/*\n********************************************************************************\n\
    \n* Function name : OS_INIT_RTOS\n\n* Function type : Initialisation System call\n\
    \n* Description : This system call initialises the RTOS variables,\n         \
    \     task SPS and enables any required interrupts\n\n* Arguments : iemask Represents\
    \ the interrupt enable mask which is\n              used to set the IE special\
    \ function.\n              Its value determines which interrupts will be enabled\n\
    \              during the execution of the user's application.\n\n* Returns :\
    \ None\n********************************************************************************\n\
    /\n```\n\n```\nvoid OS_INIT_RTOS(uchar iemask)\n{\n    uchar data i,j;\n    #if\
    \ (TICK_TIMER == 2)\n        IE = (iemask & 0x7f) | 0x20;\n        /* Set up 8051\
    \ IE, using timer 2 */\n    #elif (TICK_TIMER == 1)\n        IE = (iemask & 0x7f)\
    \ | 0x08;\n        /* Set up 8051 IE, using timer 1 */\n        IP = 0x08; /*\
    \ Assign scheduler interrupt high priority */\n    #else\n        IE = (iemask\
    \ & 0x7f) | 0x02;\n        /* Set up 8051 IE, using timer 0 */\n        IP = 0x02;\
    \ /* Assign scheduler interrupt high priority */\n    #endif\n\n    Running =\
    \ IDLE_TASK;    /* Set idle task, the running task, initially */\n    tsknum =\
    \ MINUS_ONE;\n```"
