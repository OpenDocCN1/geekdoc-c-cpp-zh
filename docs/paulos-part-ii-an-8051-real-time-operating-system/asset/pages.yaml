  md: '# PaulOS An 8051 Real-Time Operating System

    Part II


    An example of the syntax used for this command is:


    ```

    SIGNAL(1); // send a signal to a task number 1

    ```


    The following commands perform a change of task:


    WAITI(Interrupt No):


    This system command is called by a task to ''sleep'' and wait for an interrupt
    to occur. Another task, in line in Ready Queue would then take over. If the interrupt
    never occurs, then the task will effectively sleep for ever.


    If required, this command can be modified to allow any timeout parameter to be
    passed, so that if the interrupt does not arrive within the specified timeout,
    the timeout of 0 would leave the task still waiting the interrupt forever. This
    would be similar to the WAITS command explained further down.


    This system command performs the following:


    +   - It sets the bit which correspond to the interrupt number passed on as a
    parameter.

    - It calls the QSHFT routine in order to start the task next in line.


    ![](img/7a94aaa54913061db4ca134993105b1b_43_0.png)'
  merge: -1
