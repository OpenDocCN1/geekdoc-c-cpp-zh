- img_proc: true
  md: 'This system command performs the following:


    +   - It sets its timeout period in the TTS table to 1. The task will therefore
    be ready to execute after the next tick.

    - It then flows on to the QSHFT routine in order to start the task next in line.


    An example of the syntax used for this command is:


    ```

    DEFER();

    /* the task simply stops execution and is placed in the Waiting Queue.*/

    /* A new task would then take over. */

    ```


    # Variables Memory Map


    Table B-5 shows the way the variables used in this RTOS program have been set
    up. Most of the variables reside in the internal 256 RAM of the 8032 micro-processor.
    The external RAM (from address 8100H and higher for the Flight 32 board) is used
    to store the stacks of all the tasks and main idle program. These stacks are then
    swapped in turn with the area reserved for the stack in the internal RAM whenever
    a task swap is necessary.'
