    \     : None\n * Returns      : None\n********************************************************************/\n\
    void OS_RTOS_GO(void)\n{\n    #if (TICK_TIMER == 2)\n        RCAP2H = HiByte(BASIC_TICK);\
    \ /* Configures Timer 2 in 16-bit */\n        RCAP2L = LoByte(BASIC_TICK); /*\
    \ auto-reload mode for the 8032 */\n        T2CON = 0x84; /* TR2 = 1, causes immediate\
    \ interrupt */\n    #elif (TICK_TIMER == 0)\n        TH0 = HiByte(BASIC_TICK);\
    \ /* Configure Timer 0 in 16-bit */\n        TL0 = LoByte(BASIC_TICK); /* timer\
    \ mode for the 8051 */\n        TMOD &= 0xF0; /* Clear T0 mode control, leaving\
    \ T1 untouched */\n        TMOD = 0x10; /* Set T1 mode control */\n        TR0\
    \ = 1; /* Start timer 0 */\n        TF0 = 1; /* Cause first interrupt immediately\
    \ */\n    #elif (TICK_TIMER == 1)\n        TH1 = HiByte(BASIC_TICK); /* Configure\
