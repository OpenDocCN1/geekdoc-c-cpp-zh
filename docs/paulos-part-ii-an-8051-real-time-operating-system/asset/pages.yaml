    # Table B-2 System Calls without any parameters


    The following calls listed in Table B-3 do require parameters, are declared with
    an underscore prefix in the as1 file.


    +   - void INIT_RTOS(uchar IEMASK) - Normally used in Main idle task

    - void RTGOMSEC(uchar msecs, uchar prior) - Normally used in Main idle task

    - void SIGNAL(uchar task)

    - void WAITII(uint intrum) - This commands causes a task change

    - void WAITT(uint ticks) - This commands cause a task change

    - void WAITS(uint ticks) - This commands cause a task change if signal is not
    yet present

    - void CREATE(uchar task,uint *taddsk) - Normally used in Main idle task


    +   - void PERIODIC(uint ticks)

    - void RESUME(uchar task) - This commands causes a task change


    # Table B-3 System calls needing some parameters


    # INIT_RTOS(IEMASK)


    This system command must be the FIRST command to be issued in the main program
    in order to initialise the RTOS variables. It is called from the main program
    and takes the interrupt enable mask (IEMASK) as a parameter. An example of the
    syntax used for this command is:


    ```

    INIT_RTOS(0x30);

    ```


    which would imply that some task is intended to use the Timer 2 interrupt (IEMASK=20H)
    for the RTOS as well as Serial Interrupt (IEMASK=10H). (See Table B-4 ). The default
    mask is 20H which enables just the Timer 2 interrupt. This 20H is always added
    (or ORed) by the RTOS automatically to any other mask. Others masks which are
    valid:'
