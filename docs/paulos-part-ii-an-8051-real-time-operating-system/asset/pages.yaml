    ; Stack Space for reentrant functions in the SMALL model.


    IBPGSTACK EQU 1 ; set to 1 if small reentrant is used.


    IBBPTOP EQU 0FF1 ; set top of stack to highest location+1.


    IBJPSTACK EQU 07FF1 ; set top of stack to highest location+1.


    ; Stack Space for reentrant functions in the LARGE model.


    XBPSTACK EQU 0 ; set to 1 if large reentrant is used.


    XBPSTACK EQU 0FFFFF1 ; set top of stack to highest location+1.


    ; Stack Space for reentrant functions in the COMPACT model.


