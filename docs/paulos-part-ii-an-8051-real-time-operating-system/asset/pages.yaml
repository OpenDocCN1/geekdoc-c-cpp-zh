  md: '# Programming Tips and Pitfalls


    In this final chapter we discuss some programming tips and common pitfalls which
    should be avoided when programming such micro-controllers.


    # 12.1 RAM size


    The 8051 may only address 64KB of RAM. To expand RAM beyond this limit requires
    programming and hardware tricks. We may have to do this “by hand” since many compilers
    and assemblers, while providing support for programs in excess of 64KB, do not
    support more than 64KB of RAM. This strange range since program code can fit in
    64KB but it is often that RAM that is lacking. Thus if we need more than 64KB
    of RAM, we need to check our supporters, but if it does, we must be prepared to
    do it by hand.


    Some assemblers and compilers offer to get around this limit when used with specially
    wired hardware. However, without special compilers and hardware, program code
    is normally limited to 64KB for the standard 8051-controller. Newer derivatives
    of the 8051, such as the Silicon Labs C8051F120 chip, have 128KB of in-system
    flash memory, with special SFRs to handle the extra RAM size. The latest software
    development tools, such as the KEEL IDE provide methods for using this additional
    RAM, by switching in and out of 64KB pages.


    # 12.2 SP setting


    If we use the first register bank (i.e. bank 0), we may use Internal RAM locations
    08h through 1Fh, for our own data use. However if we plan to use register banks
    1, 2, or 3 we must be very careful about using addresses between 20h for our use
    we may end up overwriting or corrupting the values stored in our registers. In
    the SP (used to point to the stack area) by default is loaded with 07 so that
    the stack starts from location 08. For example, if we use Bank 1 with Bank 0,
    we may have to make load SP with a higher value, such as 0F which is the address
    of R7 bank 1 (the highest register in us).


    Similarly, if our program does not use any variables, we may use Internal RAM
    locations 20h through 2Fh (Bit-addressable area) for our own normal data byte
    memory locations. On the other hand, if we intend to use some variables, we must
    be very careful as to which we initialize SP once again we may end up overwriting
    the value of our bits whenever we push on stack. As the stack grows, it starts
    to over-write locations, starting from 08h. If there are a lot of pushes or calls,
    it might end up over-writing the bit variable area. Hence once again, the SP might
    need to be set to 2Fh if we need to preserve all the bit-addressable area.'
  merge: -1
