  md: '# PaulOS An 8051 Real-Time Operating System

    Part II Programming Tips and Pitfalls


    # 12.8 C Tips


    +   - We should always try to keep functions (or tasks) as simple as possible.

    - Use the correct required types for the variables; do not use int type if we
    really need byte or bit type.

    - Use signed or unsigned pointers correctly.

    - Use specified locations for storing pointers. That is use declarations as as


    ```

    char data * xdata str;               /* pointer stored in xdata, pointing to char
    stored in data */

    int xdata * data numtab;                /* pointer stored in data, pointing to
    int stored in xdata */

    long code * idata powtabw;                   /* pointer stored in idata, pointing
    to long stored in code */

    ```


    +   - In order to improve the performance during code execution or to reduce the
    memory size requirement for our code, we should have generated the list file and
    assembly code as to determine which routines can be improved or reduced in size.

    - We should always try to minimize the variable usage by scoping.


    ![](img/7a94aaa54913061db4ca134993105b1b_16_0.png)'
  merge: -1
