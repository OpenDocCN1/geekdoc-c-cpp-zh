  md: "# PaulOS 8051 Real-Time Operating System\nPart II\n\n# WAITT(Timeout)\n\nThis\
    \ system command is called by a task to sleep and wait for a specified timeout\
    \ period. The timeout\n is in units whose value depends on the RTOSGOMSEC parameter\
    \ used. Valid values for the\ntime period are in the range 1 to 655635. A value\
    \ of 0 is reserved for the KILL command, meaning\npermanent sleep, and is therefore\
    \ not allowed for this command. The WAITT system command therefore\nperforms the\
    \ required check on the parameter before accepting the value. A value of 0 is\
    \ changed to a 1.\n\nThis system command performs the following:\n\n+   - If the\
    \ parameter is 0, then set it to 1, to avoid permanent sleep.\n- Saves the correct\
    \ parameter in its correct place in the TTS table.\n- Jumps to the QSHFT routine\
    \ in order to start the next task in.\n\nAn example of the syntax used for this\
    \ command is:\n\n```\nWAITT(60);\n// wait for a signal for 60 units, the value\
    \ of the unit depends on // the RTOSGOMSEC parameter used.\n```\n\nIf example,\
    \ the command RTOSGOMSEC(10,1) was used, the reference unit would be 60 milliseconds,\n\
    and WAITT(60) would then imply waiting or sleeping for 600 milliseconds.\n\nIf\
    \ on the other hand, the command RTOSGOMSEC(250,1) was used, the reference unit\
    \ would be\nquarter of a second, and WAITT(240) would then imply waiting or sleeping\
    \ for 60 seconds or 1 minute.\n\nIn both examples, the task would go into the\
    \ sleep or waiting mode and a new task would take over.\n\n# KILL()\n\nThis system\
    \ command is used by a task in order to stop or terminate the task. As explained\
    \ earlier in\nWAITT, this is simply the command WAITT with an allowed timeout\
    \ of 0. The task is placed\npermanently waiting and never resumes execution.\n\
    \nThis system command performs the following:\n\n+   - It clears any waiting for\
    \ signal or interrupt flags, so that task would definitely never\nrestart.\n-\
    \ It then sets its timeout period in the TTS table to 0, which is the magic number\
    \ the RTOS\nuses to define any non-timing task.\n- It sets the INTVLRD and INTVLCNT\
    \ to 0, again implying not a periodic task.\n- Jumps to the QSHFT routine in order\
    \ to start the next task in line."
