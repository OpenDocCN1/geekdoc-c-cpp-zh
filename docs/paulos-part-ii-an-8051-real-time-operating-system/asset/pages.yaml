  md: '# PaulOS An 8051 Real-Time Operating System

    Part II


    The RTOS which is effectively supervising all the other tasks, then has to make
    a decision whether it to change tasks. There could be various reasons for tasks,
    as explained further on, but in order to do this task swap smoothly, the RTOS
    has to save all the environment of the presently running task and substitute it
    with the environment of the next task which is about to run. This is accomplished
    by saving all the BANK 0 registers, the ACC, B, PSW, DPTR registers. The STACK
    too has to be saved since the task might have pushed some data on the stack (apart
    from the address in the task program, where it has to return after the interrupt).


    # System Commands


    Here is a detailed explanation of all the PaulOS RTOS system commands. They are
    listed in the sequence in which they appear in the PaulOS.A51 source program.
    Note that certain system commands initiate a task change which others do not.


    The following calls listed in Table B-2 do not receive parameters, hence are not
    declared with an underscore prefix in the a51 file.


    ![](img/7a94aaa54913061db4ca134993105b1b_37_0.png)'
