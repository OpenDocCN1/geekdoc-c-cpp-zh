    Note on TICKTIME

    Ensure that TICKTIME''s value is chosen such that this quotient

    and all the following quotients result in an integer.

    In theory, maximum value of TICKTIME is given by the value corresponding

    to CLOCK: 65536, i.e. approx. 70.2.

    However respecting the condition, max acceptable TICKTIME is 50 ms.

    Hence all suitable values are: 1, 2, 4, 5, 8, 10, 25, 40, 50

    For reliable-dependent results a value of 10 or above is recommended

    u upon the application


