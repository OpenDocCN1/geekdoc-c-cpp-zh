- img_proc: true
  md: '# PaulOS 8051 Real-Time Operating System Part II


    An example of the syntax used for this command:


    ```

    WAIT(0); // wait for an interrupt from external int 0

    ```


    The task would then go into the sleep or waiting mode and a new task would take
    over.


    # WAITS(Timeout)


    This system command is called by a task to sleep and wait for a signal to arrive
    from some other task. If the signal is already present (previously set by some
    other task), then the signal is simply cleared and the task continues. If the
    signal does not arrive within the specified period, the task resumes just the
    same. However, a timeout number of 0 would imply the task has to keep waiting
    for a signal indefinitely. If the signal does not arrive, the task never resumes
    to work and effectively kills the task.


    This system command performs the following:


    +   - It first checks whether the signal is already present.

    - If it clears the signal flag, exits and continues waiting

    - If signal is not present, then:

    - It sets its own waiting for signal (SIGW) flag.

    - It also sets the waiting for timeout variable according to the supplied parameter.

    - It then jumps to the QSHFT routine in order to start the task next in line.


    An example of the syntax used for this command:


    ```

    WAITS(50);

    // wait for a signal for 50 units, the value of the unit depends on // the RTOSGOMSEC
    parameter used.

    ```


    If example, the command RTOSGOMSEC(10,1) was used, the reference unit would be
    10 milliseconds, and WAITS(50) would then imply waiting for a signal to arrive
    within 500 milliseconds.


    or you can use:


    ```

    WAITS(0); // this would wait for a signal for ever

    ```


    In both examples, the task would then go into the sleep or waiting mode and a
    new task would take over.'
