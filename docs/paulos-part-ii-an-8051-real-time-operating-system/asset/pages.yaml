    ************************

    FETCH_STACK:

    ; ENTRY A = TASK NUMBER, USES ACC, DPTR, AND R0

    ; EXIT DPTR POINTS TO START OF STACK AREA FOR TASK

    MOV TMPSTORED,A

    MOV DPTR,NEXT_STK_AREA

    MOV R0,#0

    LOOP1:

    MOV A,R0

    CJNE A,TMPSTORE0,CONT1

    RET

    CONT1:

    MOV A,#STACKSIZE

    ADD A,DPL

    MOV DPL,A

    MOV A,DPH

    ADD A,A

    INC R0

    SJMP LOOP1


    ************************

    ; SORT THE READY Q, LOW TASK NUMBER IS THE HIGHEST

    ; PRIORITY, AND THEREFORE AFTER Q SORT PASS,

    ; THE LOWEST NUMBERED TASK ENDS UP AT BOTTOM OF Q,

    ; NEXT IN LINE TO EXECUTE.

    ; IT IS CALLED FROM QSHFT, WHEN READY BANK 1 IS BEING USED.

    ;

    TASK_SORT:

    PUSH A

    PUSH 0

    PUSH B

    MOV RO,#READYTOP      ; RO POINTS IN READY Q AREA

    MOV A,R0

    CJNE A,#READYQ,NEXT_PAIR    ; ONLY ONE TASK, HENCE EXIT

    SJMP EXIT_QSORT

    NEXT_PAIR:

    MOV A,R0

    MOV B,R0

    DEC R0

    CLR C

    SUBB A,R0               ; ENSURE LOWEST TASK NUMBER (HIGHEST PRIORITY)

    JNC NO_SWAP             ; TRICKLES DOWN TO READYQ, READY TO RUN

    SWAP_NO:

    MOV A,R0

    MOV R0,B

    INC R0

    MOV R0,A

    DEC R0

    NO_SWAP:

    CJNE RO,#READYQ,NEXT_PAIR    ; ONE PASS DONE, HENCE EXIT

    EXIT_QSORT:

    POP B

    ```'
