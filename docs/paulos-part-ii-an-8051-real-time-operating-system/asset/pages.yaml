  md: "# SCHECK()\n\nThis system command is used by a task to test whether there was\
    \ any signal sent to it by some other task. It returns a value (in R7 bank 0):\n\
    \n+   1 - Signal is not present\n0 - Signal is present\n\nIf the signal was present,\
    \ it is also cleared before returning to the calling task. The same task continues\
    \ to run, irrespective of the returned value.\n\nAn example of the syntax used\
    \ for this command is:\n\n```\nX = SCHECK(); /** where X would be an unsigned\
    \ integer */\n```\n\nor you may use it in the following example to test the presence\
    \ of the signal bit:\n\n```\nif (SCHECK() == 0)\n{\n  /* do these instructions\
    \ if a signal was present */\n}\n```\n\n# SIGNAL(Task No:)\n\nThis system command\
    \ is used by a task to send a signal to another task. If the other task was already\
    \ waiting for a signal, then the other task is placed in the Ready Queue and its\
    \ waiting for signal flag is cleared. The task issuing the SIGNAL command continues\
    \ to run, irrespective of whether the called task was waiting or not waiting for\
    \ the signal. If you need to halt the task after the SIGNAL command to give away\
    \ other tasks, use the DEFER() system command after the SIGNAL command.\n\nThis\
    \ system command performs the following:\n\n+   * It checks whether the called\
    \ task was already waiting for a signal.\n* If the called task was not waiting,\
    \ it sets its waiting for signal (SIGW) flag and exits to continue the same task.\n\
    * If it was already waiting, it places the called task in the Ready Queue and\
    \ it clears both the waiting for signal (SIGW) and the present signal (SIGS) flags.\n\
    * It also sets a flag (TINFLAG) to indicate that a new task has been placed in\
    \ the Ready Queue. This flag is used by the RTOS_TIMER_INT routine (every half\
    \ a millisecond) in order to be able to decide whether there has to be a task\
    \ change. It exits the routine to continue the same task."
