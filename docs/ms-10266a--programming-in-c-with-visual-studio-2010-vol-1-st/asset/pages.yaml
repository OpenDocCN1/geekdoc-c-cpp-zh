  md: '# Declaring and Assigning Variables


    ```

    Before you can use a variable, you must declare it


    DataType variableName;

    DataType variableName1, variableName2;

    ...\DataType variableName = new DataType();

    ```


    ```

    After you declare a variable, you can assign a value to it


    variableName = Value;

    DataType variableName = Value;

    ```


    NOTE: Variable name is known as an identifier. Identifiers must:

    -Only contain letters, digits, and underscore characters

    -Start with a letter or an underscore

    -Not be one of the keywords that C# reserves for its own use


    # ## Key Points


    Before you can use a variable, you must declare it so that you can specify its
    name and characteristics.


    # ## Identifiers


    The name of a variable is referred to as an identifier. C# has specific rules
    concerning the identifiers that you can use:


    +   - An identifier can only contain letters, digits, and underscore characters.

    - An identifier must start with a letter or an underscore.

    - An identifier for a variable should not be one of the keywords that C# reserves
    for its own use. A full list of C# keywords is provided in the CD content for
    this topic.'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'Note: C# is case-sensitive. If you use the name MyData as the identifier of
    a variable, it is not the same as myData. You can declare two variables at the
    same time called MyData and myData and C# will not confuse them, although this
    is not good practice.


    You should use meaningful names for your variables because this can make your
    code easy to understand. You should also adopt a naming convention and stick to
    it.


    Note: Different organizations may have different naming conventions. Some common
    conventions are described in the CD content for this topic. If your organization
    does not currently follow any specific naming style, you may want to adopt these
    conventions.


    # Declaring a Variable


    When you declare a variable, you reserve some storage space for that variable
    in memory. You must specify the type of data that it will hold. You can declare
    multiple variables in a single declaration using the comma separator; all variables
    declared in this way have the same type. The syntax for declaring variables is
    shown in the following code example.


    ```

    DataType variableName;

    // OR

    DataType variableName1, variableName2;

    ```


    # Assigning a Value to a Variable


    After you declare a variable, you can assign a value to it for later use in the
    application by using an assignment statement. You can change the value in a variable
    as many times as you want during the application.


    The assignment operator (=) assigns a value to a variable. The syntax of a variable
    assignment is shown in the following code example.


    ```

    variableName = value;

    ```


    The value on the right side of the expression is assigned to the variable on the
    left side of the expression.


    The following code example declares an integer called price and assigns the number
    10 to the integer.


    ```

    int price = 10;

    ```'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'The following code example assigns the number 20 to an existing integer variable
    called price.


    ```

    price = 20;

    ```


    You can also assign variables when you declare them. The following code example
    shows the syntax of a variable declaration and assignment.


    ```

    DataType variableName = value;

    ```


    The type of the expression must match the type of the variable, otherwise your
    program will not compile. For example, the code in the following code example
    will not work because you cannot assign a string value to an integer variable.


    ```

    int numberOfEmployees = "Hello";

    numberEmployees = "Hello";

    ```


    > Note: When you declare a variable, it contains a random value until you assign
    a value to it. This was a rich source of bugs in C and C++ programs that created
    a variable and accidentally used it as a source of information before giving it
    a value. C# does not allow you to use an unassigned variable. You must assign
    a value to a variable before you can use it; otherwise, your program might not
    compile.


    # Implicitly Typed Variables


    When you declare variables, you can also use the var keyword instead of specifying
    an explicit data type as int or string. When the compiler sees the var keyword,
    it uses the value that is assigned to the variable to determine the type. Consequently,
    you must initialize a variable that is defined in this way when it is defined,
    as shown in the following code example.


    ```

    var price = 20;

    ```


    In this example, the price variable is an implicitly typed variable. However,
    the var keyword does not mean that you can later assign a value of a different
    type to price. The type of price is fixed, in the same way as if you had explicitly
    declared it to be an integer.


    Implicitly typed variables are useful when you do not know, or if it is difficult
    to establish explicitly, the type of an expression that you want to assign to
    a variable.


    Question: What is the syntax for declaring and assigning a variable?'
