    \ achieve the same result by assigning the value of the Boolean expression directly\
    \ to the validPercentage variable, as this code example shows.\n\n```\nvalidPercentage\
    \ = (percent >= 0) && (percent <= 100);\n```\n\nThe outcome of the || operator\
    \ is true if either of the Boolean expressions on which it operates is true. You\
    \ use the || operator to determine whether any one of a combination of Boolean\
    \ expressions is true. For example, the statement in the following code example\
    \ assigns the value true to invalidPercentage if the value of percent is less\
    \ than 0 or the value of percent is greater than 100."
