  md: '# What Is Variable Scope?


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_119_0.png)


    # Key Points


    The scope of a variable determines the parts of a program that can access that
    variable. If you attempt to reference a variable outside its scope, the compiler
    will generate an error.


    # Levels of Scope


    Variables can have one of the following levels of scope:


    +   * Block

    * Procedure

    * Class

    * Namespace


    These levels of scope progress from the narrowest (block) to the widest (namespace).
    The following sections describe these different scopes.'
  merge: -1
  pgno: 119
- img_proc: true
  md: "# Block Scope\n\nA block is a set of statements that is enclosed within initiating\
    \ and terminating declaration statements, such as a loop. If you declare a variable\
    \ within a block, you can use it only within that block. The lifetime of the variable\
    \ is still that of the entire block. The following code example shows how to declare\
    \ a local variable area with block-level scope.\n\n```\nif (length > 10)\n{\n\
    \    int area = length * length;\n}\n```\n\n# Procedure Scope\n\nVariables that\
    \ are declared within a procedure are not available outside that procedure. Only\
    \ the procedure that contains the declaration can use the variable. When you declare\
    \ variables in a block or procedure, they are known as local variables. The following\
    \ code example shows how to declare a local variable name with procedure-level\
    \ scope.\n\n```\nvoid ShowName()\n{\n    string name = \"Bob\";\n    MessageBox.Show(\"\
    Hello \" + name);\n}\n```\n\n# Class Scope\n\nIf you want the lifetime of a local\
    \ variable to extend beyond the lifetime of the procedure, declare the variable\
    \ at class-level scope. When you declare variables in a class or structure, but\
    \ not inside a procedure, they are known as class variables. You can assign a\
    \ scope to class variables by using an access modifier. The following code example\
    \ shows how to declare a local variable message with class-level scope.\n\n```\n\
    private string message;\nvoid SetString()\n{\n    message = \"Hello World!\";\n\
    }\n\nvoid ShowString()\n{\n    MessageBox.Show(message);\n}\n```"
  merge: -1
  pgno: 120
- img_proc: true
  md: "# Namespace Scope\n\nWhen you declare variables at class level using the public\
    \ keyword, they are available to all procedures within the namespace. The following\
    \ code example shows you how to declare a variable called message in one class\
    \ that you can access in another class.\n\n```\npublic class CreateMessage\n{\n\
    \    public string message = \"Hello\";\n}\n\npublic class DisplayMessage\n{\n\
    \    public void ShowMessage()\n{\n        CreateMessage newMessage = new CreateMessage();\n\
    \        MessageBox.Show(newMessage.message);\n    }\n}\n```\n\nQuestion: You\
    \ are developing an application and you need to declare a variable that is accessible\
    \ to two methods in the same class. What is the easiest way to achieve this?\n\
    \n# Additional Reading\n\nFor more information about scopes, see the 3.7 Scopes\
    \ page at http://go.microsoft.com/fwlink/?LinkId=192893."
  merge: -1
