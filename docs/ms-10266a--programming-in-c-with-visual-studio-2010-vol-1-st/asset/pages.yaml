  md: '# What Is an Interface?


    +   An interface is:

    * A contract that specifies what methods must be exposed by an implementing class

    * Independent of the implementation


    | String | Int32 | Employee |

    | :--- | :--- | :--- |

    | BBB > AAA? | 100 > 99 ? | VP > Worker ? |

    | Alphanumeric comparison | Numeric comparison | Grade comparison |


    Key Points

    Inheriting from a class is a powerful mechanism, but the real power of inheritance
    comes from implementing an interface. An interface does not contain any code or
    data; it just specifies the methods and properties that a class that inherits
    from the interface must provide. Using an interface enables you to completely
    separate the names and signatures of the methods of a class from the method''s
    implementation.


    Interfaces act as a contract; they guarantee that any class that implements the
    interface will expose the members that the interface specifies. This enables you
    to simplify development and standardize your code.


    Interfaces enable you to specify functionality that a class should implement.
    How a class chooses to implement this functionality depends on the concern of
    the class and not a property of the interface. Different classes can implement
    the same interface in different ways, as long as they expose the set of methods
    that the interface defines.


    For example, a frequent requirement in the .NET Framework for classes to define
    a method that enables them to be compared, to determine their relative ordering.
    What it actually means to compare the value of two objects of a given class depends
    on the class itself; the Employee class might determine that'
