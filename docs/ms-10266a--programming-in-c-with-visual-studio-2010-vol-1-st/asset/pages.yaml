  md: "# Read-Only Variables and Constants\n\n| Read-only variables |\n| Declared\
    \ with the readonly keyword\n Initialized at run time |\n| readonly string currentDateTime\
    \ = DateTime.Now.ToString(); |\n\n| Constants |\n| Declared with the const keyword\n\
    \ Initialized at compile time |\n| const double PI = 3.14159;\n int radius = 5;\n\
    \ double area = PI ^ radius ^ radius;\n double circumference = 2 ^ PI ^ radius;\
    \ |\n\nKey Points\nRead-only variables and constants enable you to store data\
    \ just like you can with\ny other variables in C#. However, these variables have\
    \ some subtle differences.\n\nYou can use read-only variables and constants to\
    \ store data that does not change.\nYou can use read-only variables or constants\
    \ for many values such as:\n\n+   * The number of hours in a day.\n* The speed\
    \ of light.\n* The number of degrees in a circle.\n\nComparing Read-Only Variables\
    \ and Constants\nThere is a subtle difference between using a read-only variable\
    \ and using a\nconstant. When you use a constant in an application, you can only\
    \ initialize the\nconstant when it is declared. However, you can initialize a\
    \ read-only variable in its\ndeclaration or in the constructor of the class that\
    \ contains the read-only variable."
