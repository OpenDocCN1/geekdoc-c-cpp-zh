  md: '# Best Practices for Commenting C# Applications


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_47_0.png)


    # Key Points


    It is good programming practice to begin all procedures with a brief comment that
    describes the functional characteristics of the procedure. This is for your own
    benefit and the benefit of anyone else examines the code.


    In Visual C#, comments begin with two slash marks (//). Comments can follow a
    statement on the same line, or occupy an entire line. Both are illustrated in
    the following code example.


    ```

    // This is a comment on a separate line.

    string message = "Hello there!"; // This is an inline comment.

    ```


    # The Comment and Uncomment Toolbar Buttons


    You can add or remove comment symbols for a block of code by selecting the lines
    of code and choosing the Comment or Uncomment buttons on the Text Editor toolbar.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Commenting Guidelines


    As your code becomes more complex, use comments to make your code more readable
    and easier to maintain. You should use comments to explain the purpose of a section
    of code in natural language, especially when the purpose might not be obvious
    or clear.


    The following list provides some guidelines regarding when you should comment
    your code:


    +   - Begin procedures with a comment block. This block should include information
    such as the purpose of the procedure, the value returned, the arguments, and so
    on.

    - In longer procedures, use comments to break up units of work within the procedure.

    - When you declare variables, use a comment to indicate how the variable will
    be used.

    - When you write a decision structure, use a comment to indicate how the decision
    is made and what it implies.


    **Question:** Why is it important for you to comment your code?'
  merge: -1
