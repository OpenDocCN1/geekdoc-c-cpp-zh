  md: '# Lesson 2

    Reading and Writing Files by Using Streams


    +   * What Are Streams?

    * Reading and Writing Binary Data

    * Reading and Writing Text

    * Reading and Writing Primitive Data Types


    Reading and writing data in single atomic operations as described in the previous
    lesson is acceptable with small amounts of data. However, when you are working
    with large data volumes, such operations are inefficient and consume too many
    resources.


    An alternative approach is to use streams. This introduces the .NET Framework
    streaming model, and the classes that you can use to implement streaming in your
    applications.


    # Objectives


    After completing this lesson, you will be able to:


    +   * Describe the purpose of streams.

    * Describe how to read and write binary data.

    * Describe how to read and write text.

    * Describe how to read and write primitive data types.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# What Are Streams?


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_349_0.png)


    # Key Points


    When you work with data, whether the data is stored in a file on the file system
    or on a Web server that is accessible over an HTTPS connection, the data sometimes
    becomes too large to load into memory and transmit in a single atomic operation.
    For example, imagine trying to load a 100-gigabyte video file from the file system
    into memory in a single operation. Not only would the operation take a long time,
    but it would also consume a large amount of memory.


    The NET Framework enables you to use streams. A stream is a sequence of bytes,
    which could come from a file on the file system, a network connection, or memory.
    Streams enable you to read or write to a data source in small manageable data
    packets. Totally, streams provide the following operations:


    +   - Reading chunks of data into a type, such as a byte array.

    - Writing chunks of data from a type to a stream.

    - Querying the current position in the stream and modifying a specific selection
    of bytes at the current position.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Streaming in the .NET Framework


    The .NET Framework provides several stream classes that enable you to work with
    a variety of data and data sources. When choosing which stream classes to use,
    you need to consider the following:


    +   * What type of data are you reading or writing, for example, binary or alphanumeric.


    +   * Where the data is stored, for example, on the local file system, in memory,
    or on a Web server over a network.


    The .NET Framework class library provides several classes in the System.IO namespace
    that you can use to read and write files using streams. At the highest level of
    abstraction, the Stream class defines a generic view of a sequence of bytes together
    with the operations and properties that all streams provide. Internally, a Stream
    object maintains a pointer that refers to the current location in the data source.
    When you first construct a Stream object over a data source, this pointer is positioned
    to the first byte. As you read and write, the Stream class advances the pointer
    to the end of the data that is read or written.


    You cannot use the Stream class directly. Instead, you instantiate specializations
    of this class that are optimized to perform stream-based I/O for specific types
    of data source. For example, the FileStream class implements a stream that uses
    a disk file as the data source, and the MemoryStream class implements a stream
    that uses a block of memory as the data source.


    > Note: The remaining topics in this lesson focus on reading data and writing
    data to files on the file system, so you will use the FileStream class. However,
    these topics involve reading and writing a variety of data, so you will be using
    classes such as BinaryReader, BinaryWriter, StreamReader, and StreamWriter. For
    more information about the FileStream class, see the content for this topic on
    the Course Companion CD.


    Question: What do you think are the benefits of streaming data?


    # Additional Reading


    For more information about the FileStream class, see the FileStream Class page
    at http://go.microsoft.com/fwlinklw/?LinkId=19220.'
  merge: -1
