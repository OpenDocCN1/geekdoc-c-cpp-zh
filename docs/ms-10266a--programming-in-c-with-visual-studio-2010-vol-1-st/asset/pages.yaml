  md: '# Managing Resources in Your Applications


    # Key Points


    Simply using types that implement the IDisposable interface is not sufficient
    to manage resources; you must remember to invoke the Dispose method in your code.


    There are several approaches you can use to dispose of an object when you no longer
    require it:


    +   * You can manually call the Dispose method at an appropriate point in your
    code, as the following code shows.


    ```

    LogFileWriter lfw = new LogFileWriter(...);

    ...


    // Use the LogFileWriter object.

    ...

    lflw.Dispose();

    ```'
