  md: '# Referencing an Object Through an Interface


    Key Points

    In the same way you can reference an object by using a variable that is defined
    as a class that is higher up an inheritance hierarchy, you can reference an object
    by using a variable that is defined as an interface that its class implements.
    Taking the example from the previous topic, you can reference a Calculator object
    by using an ICalculator variable, with the following code example shows.


    ```

    Calculator myCalculator = new Calculator();

    ICalculator iCalculator = myCalculator;

    ```


    This works because all Calculator objects implement the ICalculator interface.
    However, the converse is not true, and you cannot assign an ICalculator object
    to a Calculator variable without casting it to verify that it does reference a
    Calculator object and not some other class that also happens to implement the
    ICalculator interface. You can use the is and as keywords to check that an object
    implements an interface, or to check that an object that an interface references
    is an instance of a particular class.'
  merge: -1
  pgno: 535
- img_proc: true
  md: "# Passing Parameters as Interface References\n\nThe technique of referencing\
    \ an object through an interface is useful because it enables you to define methods\
    \ that can take different types as parameters, as long as the types implement\
    \ a specified interface. For example, the PerformAnalysis method can take any\
    \ argument that implements the ICalculator interface.\n\n```\nint PerformAnalysis(ICalculator\
    \ calculator)\n{\n    ...\n}\n```\n\nNote that, when you reference an object through\
    \ an interface, you can invoke only methods that are visible through the interface.\n\
    \n**Question:** What happens if you attempt to cast an object to an interface\
    \ that it does not implement?"
