- img_proc: true
  md: '# How the Common Language Runtime Loads, Compiles, and

    Runs Assemblies


    Assemblies contain MSIL code, which is not actually executable

    The CLR loads the MSIL code from an assembly and converts it into the

    machine code that the computer requires


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_17_0.png)


    # Key Points


    Assemblies contain MSIL code, which is not executable. When you run a .NET

    Framework application, the CLR loads the MSIL code from an assembly and

    converts it into the machine code that the computer requires.


    The CLR is a fundamental component of the .NET Framework. It handles code

    execution and provides useful services for application development. The CLR

    contains several components that perform the following tasks when you run a

    .NET Framework application:


    +   1. The Class Loader locates and loads all assemblies that the application
    requires.

    The assemblies will already be compiled into MSIL.

    2. The MSIL-to-native compiler verifies the MSIL code and then compiles all

    assemblies into machine code ready for execution.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '> Note: The CLR performs the verification step because it is possible to write
    your own MSIL code. If you use a C# compiler, the MSIL code will be valid, but
    the CLR cannot make any assumptions.


    +   3. The Code Manager loads the executable assembly and runs the Main method.


    +   4. The Garbage Collector provides automatic lifetime memory management of
    all objects that your application creates. The Garbage Collector disposes of any
    objects that your application is no longer using.


    +   5. The Exception Manager provides structured exception handling for .NET applications,
    which is integrated with Windows structured exception handling.


    **Question**: What steps does the CLR perform when you run your application?'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# What Tools Does the .NET Framework Provide?


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_19_0.png)


    # Key Points


    The .NET Framework provides several tools to help simplify the development of
    .NET applications. The following table describes some of the key tools.


    | Tool | Description |

    |---|---|n| Code Access Security Policy Tool (Caspol.exe) | Enables users to modify
    the machine, user, and enterprise security policy. This can include defining a
    custom permission set and adding assemblies to the full trust list. |

    | Certificate Creation Tool (Makecert.exe) | Enables users to create x.509 certificates
    for use in their development environment. Typically, you can use these certificates
    to sign your assemblies and define Secure Sockets Layer (SSL) connections. |

    | Global Assembly Cache Tool (Gacutil.exe) | Enables users to manipulate the assemblies
    in the GAC. This can include installing and uninstalling assemblies in the GAC
    so that multiple applications can access them. |'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introducing C# and the .NET Framework 1-15


    | Tool | Description |

    | Native Image Generator (Ngen.exe) | Enables users to improve the performance
    of .NET applications. The Native Image Generator improves performance by precompiling
    assemblies into images that contain processor-specific machine code. The CLR can
    then run the precompiled images instead of using just-in-time (JIT) compilation.
    Alternatively, if you use JIT compilation, your code is compiled before it is
    executed. |

    | MSIL Disassembler (Ildasm.exe) | Enables users to manipulate assemblies, such
    as determining whether an assembly is managed, or disassembling an assembly to
    view the compiled MSIL code. |

    | Strong Name Tool (Sn.exe) | Enables users to sign assemblies with strong names.
    The Strong Name Tool includes commands to create a new key pair, extract a public
    key from a key pair, and verify assemblies. |


    **Question:** You have created two applications that both use an assembly called
    Contoso.ReportGenerator.dll. Both applications will run on the same machine. What
    is the best approach to share the Contoso.ReportGenerator.dll assembly and which
    tool would you use?


    # **Additional Reading**


    For more information about the tools that the .NET Framework provides, see the
    .NET Framework Tools page at http://go.microsoft.com/fwlink/??LinkId=192882.'
  merge: -1
