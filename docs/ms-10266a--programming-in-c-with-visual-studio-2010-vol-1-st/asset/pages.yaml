  md: "You can use a **try/finally** block and dispose of your object in the **finally**\
    \ block, as the following code example shows.\n\n```\nLogFileWriter lfw;\n\ntry\
    \ {\n    lfw = new LogFileWriter(...);\n    // Use the LogFileWriter object.\n\
    }\n\nfinally {\n    if (lfw != null) {\n        Lfw.Dispose();\n    }\n}\n```\n\
    \nYou can use a **using** block (not to be confused with the **using** keyword\
    \ for importing namespaces) to encapsulate your disposable object, as the following\
    \ code example shows.\n\n```\nusing LogFileWriter lfw = new LogFileWriter (...)\n\
    {\n    // Use the LogFileWriter object.\n}\n```\n\nUsing a **using** block (the\
    \ third option) is the preferred way of guaranteeing that an object is disposed\
    \ of when you have finished using it. When you add a **using** block to your code,\
    \ the variables that you define in the **using** statement are accessible only\
    \ in that block. A **using** block is exception safe, which means that if the\
    \ code in the block throws an exception, the runtime will still dispose of the\
    \ objects specified in the **using** statement.\n\nTo define a **using** block,\
    \ you specify the **using** keyword, followed by brackets. Inside the brackets,\
    \ you declare and initialize the variable that you must use in the block. When\
    \ you add your code, enclosed in braces after the **using** statement.\n\nThe\
    \ following code example defines a **using** block, which declares and initializes\
    \ a `LogFileWriter` variable (as shown previously)."
  merge: -1
