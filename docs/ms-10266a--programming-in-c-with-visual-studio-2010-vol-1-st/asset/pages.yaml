- img_proc: true
  md: "+   HasValue. This is a Boolean property that indicates whether a nullable\
    \ type contains a value or null. If this property is true, it is false; the nullable\
    \ variable is null.\n\n+   Value. This is the value of a variable. You should\
    \ only attempt to read this value if the HasValue property is true; otherwise\
    \ your code will throw an exception.\n\nThe following code example shows how to\
    \ use these properties with a nullable Currency variable.\n\n```\nCurrency? myCurrency\
    \ = null;\n...\nif (myCurrency.HasValue)\n{\n    Console.WriteLine(myCurrency.Value);\n\
    }\n```\n\n**Note:** The Value property of a nullable type is read-only. You can\
    \ use this property to read the value of a variable but not to modify it. To update\
