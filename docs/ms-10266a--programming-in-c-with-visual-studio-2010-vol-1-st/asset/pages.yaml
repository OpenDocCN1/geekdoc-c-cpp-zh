  md: '# Exercise 2: Converting Integer Numeric Data to Binary


    In this exercise, you will create another application that enables the user to
    enter an integer value, generate a string that holds the binary representation
    of this value, and then display the result.


    # Scenario


    Another device has the requirement to display decimal numeric data in a binary
    format. You have been asked to develop some code that can convert a non-negative
    decimal value into a string that contains the binary representation of this value.


    The process for converting the decimal value 6 into its binary representation
    is as follows:


    +   1. Divide the integer by 2, save the integer result, and use the remainder
    as the first binary digit.

    In this example, 6 / 2 is 3 remainder 0. Save the character "0" as the first character
    of the binary representation.

    2. Divide the result of the previous division by 2, save the result, and use the
    remainder as the next binary digit.

    In this example, 3 / 2 is 1 remainder 1. Save the character "1" as the next character
    of the binary representation.

    3. Repeat the process until the result of the division is zero.

    In this example, 1 / 2 is zero remainder 1. Save the character "1" as the final
    character of the binary representation.

    4. Display the characters saved in reverse order.

    In this example, the characters were generated in the sequence "0", "1", "1",
    so display them in the order "1", "1", "0". The value 110 is the binary representation
    of the decimal value 6.


    The main tasks for this exercise are as follows:


    +   1. Create a new WPF Application project.

    2. Create the user interface.

    3. Add code to generate the binary representation of an integer value.

    4. Test the application.'
