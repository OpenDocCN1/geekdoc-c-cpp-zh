  md: '# Best Practices for Performing String Concatenation


    Key Points

    Concatenating multiple strings in C# is simple to achieve by using the + operator.
    However, this is considered bad practice because strings are immutable. This means
    that every time you concatenate a string, you create a new string in memory and
    the old string is discarded. The following code example creates five string values
    as it runs.


    An alternative approach would be to use the StringBuilder class, which enables
    you to build a string dynamically and much more efficiently. The following code
    example shows how to use the StringBuilder class.


    ```

    StringBuilder address = new StringBuilder();

    address.Append("23");

    ```'
