    employee should be ranked by grade (two employees with the same grade are equal,
    but an employee with a grade of “VP” might be considered superior to an employee
    with a grade of “Worker”), whereas the String class uses an alphanumeric comparison
    to determine the relative order of string values. To standardize the way in which
    objects of any type can be compared, the System .NET Framework class library defines
    the IComparable interface. This interface contains a single method called CompareTo
    that has the signature in the following code example.


    ```

    int CompareTo(Object obj)

    ```


    A class that implements the IComparable interface must provide the CompareTo method.
    This method returns zero if the object that is specified as the parameter is considered
    equal to the object which the CompareTo method was invoked; a value less than
    zero if the object is considered to be less than the object that was specified
    as the parameter; and a value greater than zero if the object is considered to
    be greater than the object that is specified as the parameter. It is up to the
    class that is implementing the interface to provide the actual logic for the CompareTo
    method.


