  md: "# Creating and Calling Overloaded Methods\n\n+   An overloaded method:\n* Has\
    \ the same name as an existing method\n* Should perform the same operation as\
    \ the existing method\n* Uses different parameters to perform the operation\n\n\
    The compiler invokes the version that is appropriate to the arguments that are\
    \ specified when the method is called\n\n# Example\n\n```\nvoid Deposit(decimal\
    \ amount)\n{\n  _balance = amount;\n}\nvoid Deposit(int dollars, int cents)\n\
    {\n  _balance += (cents / 100.0m);\n}\n```\n\nThe signature of the Deposit method\
    \ is different for each implementation\n\nKey Points\nSometimes it is useful to\
    \ define several implementations of a method that takes a different set of parameters.\
    \ Each version of the method performs the same operation, it happens to use different\
    \ data. An example of this in the .NET Framework is the WriteLine method of the\
    \ Console class. This method has 19 different versions that you can display data\
    \ as a range of types. For example, the following code displays an integer value\
    \ and a Boolean value using two Console.WriteLine statements. Note that the type\
    \ of the parameter is specified in each case is different.\n\n```\nint intData\
    \ = 99;\nbool boolData = true;\n...\nConsole.WriteLine(intData);\nConsole.WriteLine(boolData);\n\
    ```\n\nThis technique is known as overloading. You can create as many overloaded\
    \ versions of a method as you need as long as the type and number of parameters\
    \ are different for each version (each method signature must be unique)."
