    ```


    The following table shows the precedence of operators from highest to the top
    to lowest at the bottom.


    | Precedence | Operator |

    |---|---|

    | Highest | ++, -- (prefixes), +, - (unary), !, ~ |

    | | *, /, % |

    | | +, - |

    | | <<, >> |

    | | <, >, <=,, >= |

    | | ==, != |

    | | & |

    | | ^ |

    | | | |

    | && |

    | || |

    | | Assignment operators |

    | Lowest | ++, -- (suffixes) |


    # Operator Associativity


    When use operators of the same precedence, the operator associativity are either
    right-associative or left-associative. Left-associative operators are processed
    from left to right, for example, the / operator, as the following code example
    shows.


    ```

    a / 5 / b

    ```


    Here, a is divided by 5 and then the result of that division is divided by b.
    All binary operators are left-associative apart from assignment operators, which
    are right-associative, as the following code example shows.'
