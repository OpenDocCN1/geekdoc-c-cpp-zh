    4. Click Start Collecting. This button runs the StartCollecting method of the
    device that the IMeasuringDevice interface defines.

    5. Wait for 10 seconds to ensure the emulated device has generated some values
    before you perform the following steps.

    6. Click Get Raw Data. You should see up to 10 values in the list box in the lower
    part of the window. This is the data that the device emulator has generated. It
    is stored in the dataCaptured array by the GetMeasurements method in the MeasureLengthDevice
    class. The dataCaptured array acts as a fixed-length buffer. Initially, it contains
    zero values, but as the device emulator reports measurements, they are added to
    this array. When the array is full, it wraps and starts overwriting data beginning
    with the oldest measurement.

    7. Click Get Metric Value and Get Imperial Value. You should see the metric and
    imperial value of the most recently generated measurement. Note that a new measurement
    might have been taken since you clicked the Get Raw Data button.

    8. Click Get Raw Data, and verify that the imperial value that the previous step
    displayed is listed in the raw data values. (The value can appear at any point
    in the list).

    9. Click Stop Collecting.

    10. Choose Metric, and then click Create MeasureLengthDevice Instance. This action
    creates a new instance of the device emulator that uses metric measurements.

    11. Click Start Collecting. This button starts the new device object.

    12. Wait for 10 seconds.

    13. Click Get Metric Value and Get Imperial Value to display the metric and imperial
    value of the latest measurement that the device has taken.'
