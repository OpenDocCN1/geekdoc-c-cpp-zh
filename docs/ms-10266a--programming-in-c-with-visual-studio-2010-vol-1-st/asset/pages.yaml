  md: "# # What Is an Abstract Method?\n\n![](img/a8fed13e9f86d03aa521a7ff9d50e902_550_0.png)\n\
    \n# ## Key Points\n\nAn abstract class can contain abstract methods. An abstract\
    \ method is similar in principle to a virtual method except that it does not contain\
    \ a method body. The derived class must override this method. The following code\
    \ example defines the PayBonus method in the SalariedEmployee class as an abstract\
    \ method. All employees may share some methods, such as a Salary method, but they\
    \ must provide their own implementation of the PayBonus method because the logic\
    \ for paying bonuses may be different for different types of employee. An abstract\
    \ method is useful if it does not make sense to provide a default implementation\
    \ in the abstract class and you want to ensure that an inheriting class provides\
    \ its own implementation of that method.\n\n```\nabstract class SalariedEmployee\
    \ : Employee, ISalariedEmployee\n{\n    abstract void PayBonus();\n    ...\n}\n\
    ```"
