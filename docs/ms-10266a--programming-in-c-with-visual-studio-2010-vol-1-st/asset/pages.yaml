  md: '# Manipulating Files


    Interacting with files is a common requirement for many applications


    The System.IO namespace contains many classes that simplify interactions with
    the file system, such as the File and FileInfo classes


    | The File class includes: | The FileInfo class includes: |

    |--- | --- |

    | Copy() | CopyTo() |

    | Create() | Delete() |

    | Delete() | Length |

    | Exists() | Open() |


    **Key Points**

    A common requirement for many applications is the ability to interact with files
    that are stored on the file system. This can involve creating a new file, copying
    or deleting a file, or moving a file from one directory to the next. To help simplify
    these interactions, the .NET Framework provides several classes in the System.IO
    namespace. These include the File and FileInfo classes.


    # The File Class


    The File class is a utility class that wraps various file-related functions. These
    functions are exposed through static methods. The following table describes some
    of the key methods that the File class provides and shows some code examples.'
