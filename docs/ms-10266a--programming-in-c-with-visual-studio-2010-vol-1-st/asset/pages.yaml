- img_proc: true
  md: "When you use static types, you cannot explicitly invoke a constructor by using\
    \ the new keyword. Typically, the common language runtime (CLR) implicitly invokes\
    \ a static constructor before any code to access or invoke a static member in\
    \ that type. You define before static constructor in a static type, as the following\
    \ code example shows.\n\n```\nstatic class Sales {\n    static Sales() {\n   \
    \ }\n}\n```\n\nWhen you use static constructors in types, you must follow some\
    \ rules to avoid compilation errors. You must define only a single constructor\
    \ that is prefixed with the static modifier. You cannot explicitly invoke a static\
    \ constructor; therefore, the constructor does not need to be accessible outside\
    \ the type, so it always uses the private access modifier. When defining the signature\
    \ for a static constructor, you cannot specify parameters. In addition, a static\
    \ constructor can only reference other static members.\n\n# Implementing the Singleton\
    \ Design Pattern\n\nStatic constructors have many uses; for example, you can define\
    \ objects that adhere to the singleton software engineering pattern. prescribes\
    \ that your code should be restricted to creating one instance of a type. You\
    \ then use the instance whenever you require an instance of that type in your\
    \ application.\n\nIn the following code example, the Sales type implements the\
    \ singleton pattern.\n\n```\nstatic class Sales {\n    static SaleData data =\
    \ null;\n    static Sales() {\n        if (SaleData.WebServerConnectionExists())\
    \ {\n            data = SaleData.GetWeatherData();\n        }\n        else if\
    \ (SaleData.LocalDatabaseConnectionExists()) {\n            data = SaleData.GetDatabaseData();\n\
    \        }\n    }\n}\n```"
