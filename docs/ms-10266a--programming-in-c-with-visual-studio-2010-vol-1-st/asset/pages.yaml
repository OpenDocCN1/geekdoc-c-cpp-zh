    \ username)\n{\n  bool success = false;\n  // Perform some processing here.\n\
    \  return success;\n}\n```\n\n# Key Points\n\nA method contains two elements:\n\
    \n+   1. The method specification\n2. The method body\n\nThe method specification\
    \ defines the name of the method, the parameters that the method can take, the\
    \ return type of the method, and the accessibility of the method. The combination\
    \ of the name of the method and its parameter list are referred to as the method\
    \ signature. Each method in a class must have a unique signature.\n\n> Note: Method\
    \ accessibility will be described in more detail in Module 7.\n\n# Naming Methods\n\
    \nA method name has the same syntactic restrictions as a variable name; it must\
    \ start with a letter or an underscore, and can only contain letters, underscores,\
    \ and"
