  md: '# Lesson 2


    # Raising Exceptions


    +   - Creating an Exception Object

    - Throwing an Exception

    - Best Practices for Handling and Raising Exceptions


    Using a try/catch block enables an application to catch and handle exceptions.
    These exceptions may be thrown by the CLR if an application attempts to perform
    an illegal operation, such as attempting to divide by zero, or access a file for
    which the user running the application does not have permission. However, an application
    may also detect its own fault conditions, such as an invalid combination of arguments
    passed as parameters into a method. In this case, it is useful for the application
    itself to throw an exception that indicates the reason for the fault.


    This lesson explains the key concepts that enable you to create and raise exceptions.


    # Objectives


    After completing this lesson, you will be able to:


    +   - Describe how to create a new exception object by using some of the predefined
    exception types that are provided with the .NET Framework.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '+   * Explain how to throw an exception by using the throw keyword.

    * Describe some of the best practices for raising and handling exceptions.'
  merge: -1
