  md: '# Creating Objects


    | Objects are initially unassigned |

    | Before you can use a class, you must create an instance of that class |

    | You can create a new instance of a class by using the new operator |

    | The new operator does two things:

    | •Causes the CLR to allocate memory for the object

    | •Invokes a constructor to initialize the object |


    ```

    // Create a Flat with 2 bedrooms.

    Residence myFlat = new Residence(ResidenceType.Flat, 2);


    // Create a House with 3 bedrooms and a garage

    Residence myHouse = new Residence(ResidenceType.House, 3, true);


    // Create a Bungalow with 2 bedrooms, a garage, and a garden

    Residence myBungalow = new Residence(ResidenceType.Bungalow, 2, true);

    ```


    # Key Points


    When you declare a class variable, it is initially unassigned. You must create
    an instance of the corresponding class and assign it to the class variable. To
    create an instance of a class, you use the new operator.


    The new operator does two things: it calls the CLR to allocate memory for your
    object, and it invokes a constructor to initialize the fields in that object.
    The version of the constructor that runs depends on the parameters that you specify
    for the new operator. The following code example shows how to create and use instances
    of the Residence class by using the constructors that were defined in the previous
    topic.


    ```

    // Create a Flat with two bedrooms.

    Residence myFlat = new Residence(ResidenceType.Flat, 2);


    // Create a house with three bedrooms and a garage.

    Residence myHouse = new Residence(ResidenceType.House, 3, true);

    // Create a bungalow with two bedrooms, a garage, and a garden.

    Residence myBungalow = new Residence(ResidenceType.Bungalow, 2, true);

    ```'
