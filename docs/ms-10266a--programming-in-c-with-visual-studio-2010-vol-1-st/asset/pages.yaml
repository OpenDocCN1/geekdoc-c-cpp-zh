- img_proc: true
  md: "```\nwriter.Flush();\nwriter.Close();\nwriter = null;\n\n// Indicate that the\
    \ object has been disposed of and\n// resources have been released\nisDisposed\
    \ = true;\n\n// Call Dispose in the parent class\n// (assuming that the parent\
    \ provides this method)\nbase.Dispose(isDisposing);\n```\n\n# Suppressing Finalization\n\
    \nWhen you add a destructor to a class, by default, when the garbage collector\
    \ disposes of resources, the objects are added to the freachable queue for finalization.\
    \ In your public Dispose method, after you have released all of the necessary\
    \ resources, you should call the static SuppressFinalize method of the GC class,\
    \ passing in the current object. This marks the object so that the garbage collector\
    \ does not waste time running the finalization code for your object, which you\
    \ have already cleaned up. The following code example shows this method.\n\n```\n\
    public void Dispose()\n{\n  Dispose(true);\n  GC.SuppressFinalize(this);\n}\n\
    ```\n\nQuestion: What exception should you throw in your class if you attempt\
    \ to use it after it has been disposed of?\n\n# Additional Reading\n\nFor more\
    \ information about the Dispose method, see the Implementing a Dispose Method\
    \ page at http://go.microsoft.com/fwlink/?LinkId=192946."
