  md: '# Guidelines for Choosing a Decision Construct


    | Use an if structure when you have a single condition that controls the execution
    of a single block of code |

    | Use an if/else structure when you have a single condition that controls the
    execution of one of two blocks of code |

    | Use an if/elseif/else structure to run one of several blocks of code based on
    conditions that involve several variables |

    | Use a nested if to perform more complicated analysis of conditions that involve
    several variables |

    | Use a switch statement to perform an action based on the possible values of
    a single variable |


    # Key Points


    In this lesson, you have seen several structures that you can use to implement
    conditional statements. You should choose which structure to use based on the
    functionality that you want to implement.

    The guidelines for choosing a decision structure are as follows:


    +   * Use an if structure when you have a single condition that controls the execution
    of a single block of code.

    nA typical example of this is after you receive a user response to a yes/no question.
    Your code can use an if structure to execute a block of code if the user responds
    with "yes".

    * Use an if/else structure when you have a single condition that controls the
    execution of one of two blocks of code.

    If you prompt a user to choose between two alternatives, this is the structure
    to use.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '+   * Use an if/elseif/else structure to run one of several blocks of code
    based on conditions that involve several variables.


    A good example of this is to check x-coordinates and y-coordinates for points
    that are defined rectangular areas of a surface. You can use an expression for
    each rectangular area in each condition. You can also use this structure to check
    whether a single variable has a value in a certain range or ranges.


    +   * Use a nested if structure to perform more complicated analysis of conditions
    that involve several variables.


    This structure gives you the greatest flexibility, but often leads to code that
    is difficult to read, with several levels of indentation. You can use this structure
    to test multiple variables and conditions to provide a multiple outcome structure.


    +   * Use a switch statement to perform an action based on the possible values
    of a single variable.


    You can use this structure instead of a nested if structure to make your code
    clearer when you are testing the value of a single variable.


    **Question:** Which statement would you use to perform an action based on the
    possible values of a single variable?'
  merge: -1
