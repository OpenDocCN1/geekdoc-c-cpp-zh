  md: '# Converting a Value to a Different Data Type


    | Implicit conversion |

    | Automatically performed by the common language runtime |

    | int a = 4;

    long b; // Implicit conversion of int to long |


    | Explicit conversion |

    | May require you to write code to perform the conversion |

    | DataType variableName = (castDataType) variableName;

    int count = Convert.ToInt32("1234");

    int number = 0;

    if (Int.TryParse("1234", out number)) // Conversion succeeded |


    **Key Points**

    When you designing applications, you may need to convert data from one type to
    another. Conversions are necessary when a value of one type must be assigned to
    a variable of a different type. For example, you might need to convert the string
    value "99" that you have read from a text file into the integer value 99 that
    you can store in an integer variable. The process of converting a value of one
    data type to another is called conversion or casting.


    **Implicit and Explicit Conversions**


    There are two types of conversions in the .NET Framework:


    +   * Implicit conversion. Automatically performed by the common language runtime
    (CLR) on operations that are guaranteed to succeed without losing information.


    +   * Explicit conversion. Requires you to write code to perform a conversion
    that otherwise could lose information or produce an error.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Explicit conversion reduces the possibility of bugs in your code and makes
    your code more efficient. C# prohibits implicit conversions that lose precision.
    However, be aware that some explicit conversions can yield unexpected results.


    # Implicit Conversions


    An implicit conversion occurs when a value is converted automatically from one
    data type to another. The conversion does not require any special syntax in the
    source code. C# only allows safe conversions, such as widening of integers.


    The following code example shows how data is converted implicitly from an integer
    to a long type.


    ```

    int a = 4;

    long b;

    b = a; // Implicit conversion of int to long

    ```


    This conversion always succeeds and never results in a loss of information. However,
    the conversion is not true; you cannot implicitly convert a long value to an int
    type because this conversion risks losing information (the long value might be
    outside the range that the int type supports). The following table shows the implicit
    type conversions that are supported in C#.


    | From | To |

    | sbyte | short, int, long, float, double, decimal |

    | byte | short, ushort, int, uint, long, float, double, decimal |

    | short | int, long, float, double, decimal |

    | ushort | int, uint, long, ulong, float, double, decimal |

    | int | long, float, double, decimal |

    | uint | long, float, float, double, decimal |

    | long, ulong | float, double, decimal |

    | float | double |

    | char | ushort, int, uint, long, ulong, float, double, decimal |'
  merge: -1
