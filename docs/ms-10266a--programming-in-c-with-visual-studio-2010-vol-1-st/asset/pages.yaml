  md: '# Module Overview


    +   * Introduction to Garbage Collection

    * Managing Resources


    All applications use resources. When you build a Microsoft® C#® application, resources
    fall into two broad categories: managed resources that are handled by the common
    language runtime (CLR) and unmanaged resources that are maintained by the operating
    system outside the scope of the CLR. A managed resource is typically an object
    based a class defined by using a managed language, such as Visual#. Examples of
    unmanaged resources include items implemented outside the Microsoft .NET Framework,
    such as Component Object Model (COM) components, file handles, database connections,
    and network connections.


    Resource management is important in any applications that you develop. The NET
    Framework simplifies resource management by automatically reclaiming the resources
    managed by an object when it is no longer referenced by an application. Managed
    resources are handled by the .NET Framework garbage collector. However, unmanaged
    resources are not controlled by the garbage collector; you must take special steps
    to dispose of them properly and prevent them from being held longer than necessary.'
  merge: -1
