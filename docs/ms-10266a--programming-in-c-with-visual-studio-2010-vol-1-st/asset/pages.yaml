  md: "# Creating Static Types and Using Static Constructors\n\n| You can declare\
    \ types as static by using the static modifier |\n| Static types can only contain\
    \ static members |\n| static class Sales {\n Defined with the static modifier\
    \ } |\n| Both static and instance types can have constructors |\n| You can explicitly\
    \ invoke instance constructors with the new keyword |\n| Static constructors are\
    \ invoked implicitly by the CLR |\n\n# Key Points\n\nAn instance type can contain\
    \ both static and instance members, which at times can be very useful. However,\
    \ if you develop a utility class that contains only static members, you can declare\
    \ the type itself as static. To declare a type as static, you must use the static\
    \ modifier in the type's declaration. The following code shows how to create a\
    \ static class.\n\n```\nstatic class Sales {\n ...\n}\n```\n\nIf you declare a\
    \ class as static, that class cannot contain instance members, such as fields,\
    \ methods, and constructors. The class cannot contain an instance constructor;\
    \ therefore, you cannot create objects of that type. However, static types can\
    \ contain static constructors, which behave differently from instance constructors."
  merge: -1
