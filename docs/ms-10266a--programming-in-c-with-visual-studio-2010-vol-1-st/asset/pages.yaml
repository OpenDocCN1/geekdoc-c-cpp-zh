  md: '# How Does the Garbage Collector Work?


    | Stack | Heap | | reachable |

    | --- | --- | --- | --- |

    | James > 6 | Location 2 Refs: 1, 4 | Location 4 Refs: 5 | Location 6 Refs: |

    | John > 4 | Location 1 Refs: | Location 3 Refs: Finalizer | Location 6 Refs:
    | |

    | | | | 5 |


    +   * Mark all objects as dead

    * Map which objects should stay alive

    * Add finalizable dead objects to the reachable queue

    * Remove dead objects and defragment heap

    * Update pointers

    * Start finalization thread


    # Key Points


    The garbage collector releases resources and memory for objects stored on the
    heap.


    The garbage collector runs in its own thread and normally runs automatically,
    under well-defined circumstances. When the garbage collector runs, other threads
    in an application are halted because the garbage collector may move objects in
    memory and must update pointers to the correct addresses for these objects.


    The garbage collector takes the following steps to reclaim resources:


    +   * It marks every object as dead; objects are considered dead unless proved
    otherwise.


    +   * It starts from objects referenced on the stack, marking referenced objects
    as alive. It performs this recursively; if an object that is already marked as
    alive references another object, that object is also marked as alive. The garbage
    collector includes logic to prevent infinite recursion, for example, where there
    is a circular reference between two objects.'
  merge: -1
  pgno: 589
- img_proc: true
  md: '+   3. It checks whether any of the objects that have been marked as dead have
    a destructor that must be run. Running the destructor is referred to as finalization.
    Any objects that require finalization are moved to a data structure maintained
    by the garbage collector called the reachable queue. The reachable queue stores
    pointers to objects that require finalization before their resources can be reclaimed.


    +   4. Objects added to the reachable queue are marked as alive because there
    is now a valid reference to them; the destructor must be run before their memory
    can be reclaimed. Objects are normally added to the reachable queue only once.


    +   5. Objects marked as alive are moved down the heap to form a contiguous block,
    defragmenting the heap. References to objects (on the stack and in other objects
    on the heap) moved by the garbage collector are updated.


    +   6. Other threads resume.


    +   7. On a separate thread, objects added to the reachable queue are finalized.
    After an object is finalized, the pointer to that object is removed from the reachable
    queue. Objects are not removed from memory until the next time the garbage collector
    runs.


    Question: What is the purpose of the reachable queue?'
  merge: -1
