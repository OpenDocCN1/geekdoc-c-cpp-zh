  md: "# Calling a Method Using Named Arguments\n\n| Specify parameters by name: |\n\
    | Arguments can occur in any order |\n| Omitted arguments are assigned default\
    \ values if the corresponding parameter is optional |\n\n```\nvoid MyMethod(\n\
    \  int intData, float floatData = 101.1F, int moreIntData = 99)\n{\n  ...\n}\n\
    \nMyMethod(moreIntData: 100, intData: 10);\n// floatData is assigned default value\n\
    ```\n\n# Key Points\n\nTraditionally, when calling a method, the order and position\
    \ of arguments in the method call should correspond to the order of parameters\
    \ in the method signature. If the arguments were misaligned and the types mismatched,\
    \ you would get a compile error.\n\nIn C#, you can specify parameters by name,\
    \ and supply arguments in a sequence that differs from that defined by the order\
    \ of the parameters in the method signature. To use the named arguments feature,\
    \ you must supply the parameter name and corresponding value separated by a colon.\
    \ The following code example shows the syntax.\n\n```\n// Method declaration\n\
    void MyMethod(int first, double second, string third)\n{\n  ...\n}\n// Method\
    \ call using named arguments\nMyMethod(third: \"Hello\", first: 1234, second:\
    \ 12.12);\n```"
  merge: -1
  pgno: 242
