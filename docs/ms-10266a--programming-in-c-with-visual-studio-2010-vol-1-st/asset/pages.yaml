  md: '# Lesson 3

    Creating and Using Structures


    +   * What Are Structures?

    * Defining and Using a Structure

    * Initializing a Structure


    Classes are very useful when you want to model real-world entities in an application
    and encapsulate their associated business logic and data. However, when you create
    instances of objects, you will incur an overhead, and sometimes you require a
    more lightweight solution. Structures have many of the characteristics of classes
    but without some of the overhead, although they have some limitations.


    This lesson describes how to define structures and explains some of the differences
    between classes and structures.


    # Objectives


    After completing this lesson, you will be able to:


    +   * Describe the purpose of structures.

    * Describe how to add members to structures.

    * Describe how to initialize and access members in a structure.'
  merge: -1
