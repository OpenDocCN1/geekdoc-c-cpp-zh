  md: '```

    Currency myCurrency = new Currency(...);

    object o = myCurrency; // boxing


    Currency anotherCurrency = (Currency)o; // compiles okay

    ```


    If the compiler-generated code that checks the type of the object successfully
    determines that the o variable refers to a Currency variable, this statement extracts
    the value from the boxed Currency object on the heap and copies it to the anotherCurrency
    object (such as an object) which is held on the stack (it is a value type). This
    process is called unboxing. However, if o does not refer to a boxed Currency object,
    there is a type mismatch, which causes the cast to fail, and the compiler-generated
    code throws an InvalidCastException at run time.


    +   Important: Boxing and unboxing only occur when you convert from a value type
    to a reference type (such as an object) and back again. If you convert from one
    reference type to another, no copies are made, and all that happens is that a
    new reference is created to the existing object on the heap.


    Question: Is the following code an example of boxing or unboxing?


    ```

    object amount = "1234";nint convertedAmount = (int)amount;

    ```


    # Additional Reading


    For more information about boxing and unboxing, see the Boxing and Unboxing (C#
    Programming Guide) page at

    http://go.microsoft.com/f/wlink/?LinkId=19229.'
