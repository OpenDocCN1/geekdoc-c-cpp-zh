  md: 'There is no limit to the length of expressions in C# applications, although
    in practice, you are limited by the memory of your computer and your patience
    when typing. However, it is usually advisable to use shorter expressions and assemble
    the results of expression-processing piecemeal. This makes it easier for you to
    see what you are doing, in addition to making it easier to debug your code when
    things don''t work as you expect them to.


    # Examples


    You can combine the basic building blocks of operators and operands to make expressions
    as simple or as complex as you like. At the simplest end of the scale, you can
    use a single operand for an expression, as the following code example


    ```

    a

    ```


    This may not seem very useful, but is, in fact, essential. For example, if you
    wanted to assign a value to a variable, you would require an expression of this
    type.


    You can build more complicated expressions by using operators, as the following
    code example shows.


    ```

    a + 1

    ```


    The operator can operate on different data types, and the result of this expression
    depends on the data types of operands. For example, if a is an integer, the result
    of the expression is an integer with the value 1 greater than a. If a is a double,
    the result is a double with the value 1 greater than a. The difference is subtle,
    but important. In the second case (a is a double), the C# compiler has to generate
    code to convert the constant integer 1 into the constant double 1 before the expression
    can be evaluated. The rule is that the type of the expression is the same as the
    type of operands, although one or more of the operands might need to be converted
    to ensure they are all compatible. It is important, because the expression in
    the following code example contains two integer operands, so the result is an
    integer.


    ```

    5 / 2

    ```


    The value of the result is the integer value 2 (not 2.5). If you convert one of
    the operands to a double, the C# compiler will convert the other operand to a
    double, and the result will be a double. Consequently, the expression in the following
    code example yields the double value 2.5.'
