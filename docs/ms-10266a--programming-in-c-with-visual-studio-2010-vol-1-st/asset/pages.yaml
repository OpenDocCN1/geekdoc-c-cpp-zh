    +   1. If u and v are both even, gcd(u, v) = 2gcd(u/2, v/2) because 2 is a common
    divisor.

    2. If u is even and v is odd, gcd(u, v) = gcd(u/2, v) because 2 is not a common
    divisor

    3. Similarly, if u is odd and v is even, gcd(u, v) = gcd(u, v/2).

    4. If u and v are both odd, u ≥ v, gcd(u, v) = gcd((u - v)/2, v).

    If both are odd and u < v, gcd(u, v) = gcd((v - u)/2, u).

    These are combinations of one step of the simple Euclidean algorithm, which uses
    subtraction at each step, and an application of step 4 above. The division by
    2 results in an integer because the difference of two odd numbers is even.

    5. Repeat steps 3–5 u = v, or (one more step) until u = 0.

    In either case, the result is 2kv, where k is the number of common factors of
    2 found in step 2.


