- img_proc: true
  md: "The following code example shows how to exit a while loop if the value 5 is\
    \ found in an array.\n\n```\nint[] oldNumbers = { 1, 2, 3, 4, 5, 6, 7, 8 };\n\n\
    int count = 0;\n\nwhile (oldNumbers.Length > count)\n{\n    if (oldNumbers[count]\
    \ == 5)\n{\n        break;\n    }\n    count++;\n}\n```\n\nThe break statement\
    \ produces identical behavior when used with the while, do, and for loops.\n\n\
    # The Continue Statement\n\nThe continue statement is similar to the break statement\
    \ except that, instead of exiting the loop entirely, you skip the remaining code\
    \ in the current iteration, test the condition, and start the next iteration of\
    \ the loop. The following code example shows how to add additional logic to a\
    \ while loop that will not execute when the value 5 is found.\n\n```\nint[] oldNumbers\
    \ = { 1, 2, 3, 4, 5, 6, 7, 8 };\n\nint count = 0;\n\nwhile (oldNumbers.Length\
    \ > count)\n{\n    if (oldNumbers[count] == 5)\n{\n        continue;\n    }\n\
    \    // Code that won't be hit when the value 5 is found\n    count++;\n}\n```\n\
    \nThe continue statement produces identical behavior when it is used with the\
    \ while and do loops. The only subtle difference is that, when it is used with\
    \ the for loop, the remaining code in the current iteration is skipped as with\
    \ the other loops, the modifier in the for specification is incremented before\
    \ the condition is tested, and the next iteration begins."
