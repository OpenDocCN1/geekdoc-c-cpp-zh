  md: '# Specifying Operator Precedence


    | Highest | ++, -- (prefixes), +, - (unary), !, ~

    |---||

    | *, /, % |

    | +- |

    | <<, >> |

    | >, <=, >= |

    | ==, != |

    | & |

    | ^ |

    | | |

    | && |

    | || |

    | Assignment operators |

    | Lowest | ++, -- (suffixes) |


    # Key Points


    An expression can contain a complex series of operators and operands. The order
    in which the operators are processed and the operands are evaluated depends on
    the operators themselves. In many cases, there is not always a simple left-to-right
    flow of an expression.


    The operators that you use to build an expression each have an associated precedence
    that determines the order in which they are processed. Also, operators have a
    particular associativity, which determines the order in which they are processed
    in relation to operators with a matching precedence. To make expressions work
    in exactly the way you want them to, you can control the processing order by using
    parentheses.


    # Operator Precedence


    Some operators have a higher precedence than others, which means that they are
    processed before other operators. For example, in the following code example,
    the division is performed before the addition.'
  merge: -1
