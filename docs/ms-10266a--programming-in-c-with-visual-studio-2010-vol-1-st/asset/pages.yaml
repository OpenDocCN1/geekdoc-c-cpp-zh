  md: '# The Structure of Visual Studio Projects and Solutions


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_28_0.png)


    # Key Points


    Visual Studio 2010 uses solutions and projects as conceptual containers to organize
    your source files during development. Categorizing your source files in this simplifies
    the build and deployment process for your .NET Framework applications.


    # Visual Studio Projects


    A project is used to organize source files, references, and project-level configuration
    settings that make up a single .NET Framework application or library. When you
    create a project in Visual Studio, the project is automatically organized into
    a solution.


    The following table describes some of the common file types that you will find
    in a Visual Studio project.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1-24 Programming in C# with Microsoft® Visual Studio® 2010


    | File | Description |

    | --- | --- |

    | .cs | Code files that can belong to a single project solution. This type of
    file can represent any of the following:

    * Modules

    * Windows Forms files

    * Class files |

    | .csproj | Project files that can belong to multiple project solutions. The .csproj
    file also stores settings for the project, such as the output path for the build
    output and the target platform. |

    | .aspx | Files that represent ASP.NET pages. An ASP.NET file can contain your
    Visual C# code or you can use an accompanying .aspx.cs file to store your code
    in addition to the page markup. |

    | .config | Configuration files are XML-based files that you can use to store
    application-level settings such as database connection strings, which you can
    modify without recompiling your application. |

    | .xaml | XAML files are used in WPF and Microsoft Silverlight® applications to
    define user interface elements. |


    # Visual Studio Solutions


    A single Visual Studio solution is a container for one or more projects. By default,
    when you create a new project, Visual Studio automatically creates a solution
    for the project. You can add additional projects to a solution. This is useful,
    for example, you are building a library assembly and an application that tests
    this library. You can build and compile both projects as part of the solution
    rather than having to run multiple instances of Visual Studio.


    A solution can also contain project-independent items that any of the projects
    in the solution can use. For example, an ASP.NET solution can contain a single
    cascading style (.css) file that applies a standard look and feel to the included
    ASP.NET projects.


    Categorizing multiple projects into a single Visual Studio solution provides the
    following advantages:


    +   * It enables you to work on multiple projects within a single Visual Studio
    2010 session.

    * It enables you to apply configuration settings globally to multiple projects.'
  merge: -1
