- img_proc: true
  md: "default:\n...\n[exit case statement]\n\nIn a switch statement, you specify\
    \ the expression to check in [expression to check], and supply values to compare\
    \ with the variable in [testX]. Each comparison is tested in turn, so if [expression\
    \ to check] equals [test1], the first code block is executed, if [expression to\
    \ check] equals [test2], the second code block is executed, and so on. There is\
    \ no limit to the number of comparisons that you can include here, other than\
    \ the memory of computer. If no match is made, the block of code that is specified\
    \ by default: executed. The default block is optional.\n\nThe type of value that\
    \ [expression to check] returns must be an integer, string, or Boolean, and the\
    \ values that are specified by the case statements must match this type.\n\nEach\
    \ comparison ([testX]) is a single value. You can also check for multiple values\
    \ by using multiple consecutive case statements, as the following code example\
    \ shows.\n\n```\nswitch (a)\n{\n    case 0:\n        // Executed if a is 0.\n\
    \        break;\n    case 1:\n    case 2:\n    case 3:\n        // Executed if\
    \ it is 1, 2, or 3.\n        break;\n    default:\n        // Executed if a is\
    \ any other value.\n        break;\n}\n```\n\nEvery block of code in a switch\
    \ statement must end with a statement that explicitly terminates the construct\
    \ (shown as [exit case statement] in the earlier example). If you omit this statement,\
    \ your code will not compile. You can use the following statements:\n\n+   - break;\
    \ This statement terminates processing of the selection statement."
