  md: '# 6-20 Programming in C# with Microsoft® Visual Studio® 2010


    +   - Constructors must not specify a return value, not even void, but they can
    take parameters. You can define any number of constructors in a class, provided
    each constructor has a unique parameter list. A constructor that takes no parameters
    is known as a default constructor.


    +   - Constructors are typically declared with public accessibility to enable
    any part of the application to create and initialize objects. If you want to limit
    the parts of the application that can create and initialize objects, you can define
    a more restrictive access level for the constructors.


    +   - Constructors typically initialize some or all of the fields in the object
    and also perform any additional initialization tasks for the class requires.


    **Important:** If you do not define any constructors for a class, the C# compiler
    automatically generates a default constructor (a constructor that takes no parameters)
    for you. This constructor does nothing, but it enables you to create an instance
    of the class. However, if you define one or more constructors yourself, the C#
    compiler will not generate a default constructor.


