  md: "# What Is an Abstract Class?\n\n+   Abstract classes:\n* Contain common code,\
    \ thereby reducing code duplication\n* Must be inherited\n* Cannot be instantiated\n\
    * Can contain methods, fields, properties, and other members\n* Use the abstract\
    \ keyword\n\n```\nabstract class SalariedEmployee : Employee, ISalaried {\n  void\
    \ PaySalary() {\n    Console.WriteLine(\"Pay salary: (0)\", currentSalary);\n\
    \    // Common code for paying salary.\n  }\n  int currentSalary;\n}\n\nclass\
    \ ManualWorker : SalariedEmployee, ISalaried {\n  ...\n}\n\nclass Manager : SalariedEmployee,\
    \ ISalaried {\n  ...\n}\n```\n\n# Key Points\n\nAn abstract class provides a mechanism\
    \ to factor out common code that several related classes share into a single class.\n\
    For example, using the Employees class hierarchy that was shown earlier in this\
    \ module, you might develop several classes to represent different types of employees,\
    \ such as Manager and ManualWorker. Depending on the number of types of employees\
    \ that you need to represent, the number of classes will increase. In situations\
    \ such as this, it is common for some elements of these classes to have the same\
    \ implementation. As an example, the ManualWorker and Manager classes in the following\
    \ code example both implement the ISalaried interface and provide the PaySalary\
    \ method, which is identical in both classes.\n\n```\ninterface ISalaried {\n\
    \  void PaySalary();\n}\n\nclass ManualWorker : Employee, ISalaried {\n}\n```"
