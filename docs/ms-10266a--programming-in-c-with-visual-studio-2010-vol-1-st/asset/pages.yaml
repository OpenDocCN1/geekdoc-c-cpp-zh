    \ Conditional Logical Operators\n\nC# provides two Boolean operators: the logical\
    \ AND operator, which is represented by &&, and the logical OR operator, which\
    \ is represented by ||. Collectively, these are known as the conditional logical\
    \ operators. Their purpose is to combine two Boolean expressions or values into\
    \ a single Boolean result. These binary operators are similar to the equality\
    \ and relational operators in that the value of the expressions in which they\
    \ appear is either true or false. However, they differ in the values on which\
    \ they operate be either true or false.\n\nThe outcome of the && operator is true\
    \ only if both of the Boolean expressions on which it operates are true. For example,\
    \ the statement in the following code example assigns the value to validPercentage\
    \ only if the value of percent is greater than equal to 0 and the value of percent\
