  md: '# Lesson 4


    # Comparing References to Values


    +   * Comparing Reference Types to Value Types

    * Passing a Value Type by Reference into a Method

    * Boxing and Unboxing

    * Nullable Types


    Structure types, such as user-defined structs and the primitive types that C#
    uses, are also called value types. When you declare a variable as a structure
    type, the compiler generates code that allocates a block of memory enough to hold
    a corresponding value. For example, declaring an int variable causes the compiler
    to allocate 4 bytes of memory (32 bits). A statement that assigns a value (such
    as 42) to the int variable causes the data for this value to be copied into this
    block of memory.


    Class types, such as the Residence class was defined in Lesson 1, are called reference
    types. The CLR handles these types differently. When you declare a Residence variable,
    the compiler does not generate code that allocates a block of memory enough to
    hold a Residence object All the compiler does is allot a small piece of memory
    that can potentially hold the address of (or a reference to) another block of
    memory that contains a Residence object. Finally, compiler initializes this reference
    to the null value to indicate that the object has not yet initialized. The memory
    for the Residence object is allocated only when you use the new keyword to call
    a constructor and create the object.'
