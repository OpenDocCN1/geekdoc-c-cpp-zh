- img_proc: true
  md: 'In addition to unmanaged locks, there are several other problems associated
    with incorrect resource management. For example, some unmanaged types use memory
    buffers to improve performance and only write to the underlying data source when
    either the buffer is full or the object is explicitly instructed to. If you fail
    to flush these buffers when an object is destroyed, the contents of these buffers
    may be lost. As an example, when you write data to a file using the StreamWriter
    class, the data may be buffered by the underlying file type. If you destroy the
    StreamWriter without releasing the resources associated with the file, the buffer
    may not be flushed correctly, and you may lose data. The StreamWriter class provides
    the Flush method to write the contents of the buffer to the file system, which
    you can call to ensure that all data is written to the file before you destroy
    a StreamWriter object.


    Database connections are another resource that are both expensive to maintain
    and often limited. Database servers frequently support only a limited number of
    concurrent connections. If you fail to release database connections when you have
    finished using them, the available database connections will soon deplete, and
    your application may throw unexpected exceptions when it tries to connect to the
    database.


    If you manage resources correctly and ensure that all unmanaged resources are
    released when they are no longer required, you can prevent these problems.


    **Question:** What types of resources may need to be managed correctly?'
