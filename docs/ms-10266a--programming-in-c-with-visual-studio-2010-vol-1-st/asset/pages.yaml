  md: '# Using the Common File System Dialog Boxes


    # Key Points


    When you are building an application with a graphical user interface, it is unreasonable
    to expect users to type long, unwieldy path and file names. Users expect the ability
    to browse to files and directories through dialog boxes.


    Creating a dialog box, such as an open or save file dialog box found in any Microsoft
    application, would take a considerable amount of development and test effort.
    Fortunately, the .NET Framework provides the OpenFileDialog and SaveFileDialog
    classes in the Microsoft.Win32 namespace.


    > Note: You can also find the OpenFileDialog and SaveFileDialog classes in the
    System.Windows.Forms namespace. Before the introduction of Windows Presentation
    Foundation (WPF), Windows Forms were used to be the primary technology for implementing
    Windows-based client applications in the .NET Framework, hence the inclusion in
    the System.Windows.Forms namespace.


    Both the OpenFileDialog and SaveFileDialog classes provide the functionality to
    enable the user to browse for a file or specify a file name and create any folders
    for


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_345_0.png)'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'are required. The functionality is made accessible through various properties
    and methods, which you can use to customize the behavior of the dialog boxes to
    your requirements. However, note that neither dialog box actually opens or saves
    the specified file; all they do construct a path and file name that your application
    can use to open or save the file.


    The following table describes some of the key properties that are common to both
    the OpenFileDialog and SaveFileDialog classes.


    | Property | Description |

    | CheckFileExists | Enables you to instruct the dialog box to display a warning
    if the user specifies a file that does not exist. |

    | FileName | Enables you to get or set the path to the file that is selected in
    the dialog box. |

    | Filter | Enables you to restrict the type of files that the user can select
    from the dialog box. |

    | InitialDirectory | Enables you to get or set the default directory that is displayed
    when the dialog box is first shown. |

    | Title | Enables you to specify a title for the dialog box. |


    # Using the OpenFileDialog and SaveFileDialog Classes


    You can use the OpenFileDialog and SaveFileDialog classes in the same way that
    you would use any other .NET Framework class. The first step is to create an instance
    of the class, as shown in the following code examples.


    ```

    OpenFile dlg = new OpenFileDialog();

    SaveFileDialog dlg = new SaveFileDialog();

    ```


