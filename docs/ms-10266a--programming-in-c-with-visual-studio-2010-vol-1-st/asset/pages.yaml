- img_proc: true
  md: '# Types of Templates


    The following table describes some of the common application templates that you
    can use when you develop .NET Framework applications by using Visual Studio 2010.


    | Template | Description |

    | --- | Provides the environment settings, tools, project references, and starter
    code to develop an application that runs in a command-line interface. This type
    of application is considered lightweight compared to the Windows Forms application
    template there is no graphical user interface |

    | WPF Application | Provides the environment settings, tools, project references,
    and starter code to build a rich Windows application. A WPF application enables
    you to create the next generation of Windows applications, with much more control
    over user interface design. |

    | Class Library | Provides the environment settings, tools, and starter code to
    build a .dll assembly. You can use this type of file to store functionality that
    you might want to invoke from many other applications. |

    | Windows Forms Application | Provides the environment settings, tools, project
    references, and starter code to build a graphical Windows Forms application |

    | ASP.NET Web Application | Provides the environment settings, tools, project
    references, and starter code to create a server-side, compiled ASP.NET Web application
    |

    | ASP.NET MVC 2 Application | Provides the environment settings, tools, project
    references, and starter code to create a Model-View-Controller (MVC) Web application.
    An ASP.NET MVC Web application differs from the standard ASP.NET Web application
    in that the application architecture helps you separate the presentation layer,
    business logic layer, and data access layer |

    | Silverlight Application | Provides the environment settings, tools, project
