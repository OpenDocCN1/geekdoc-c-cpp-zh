  md: "# Creating New Enum Types\n\nDefine enumerations with the enum keyword\n\n\
    ```\nenum Name : DataType { Value1, Value2 . . . };\n```\n\nYou can define enumerations\
    \ in namespaces and classes, but not in methods\n\nEnumerations values start at\
    \ 0 by default, unless explicitly stated\n\n```\nnamespace Fabrikam.CustomEnumerations\n\
    {\n  enum Days : int { Monday = 1, Tuesday = 2, Wednesday = 3 };\n  ...\\n}\n\
    ```\n\n# Key Points\n\nYou can create your own enumeration types by using the\
    \ enum keyword. You must assign a name to the enumeration and then list the values\
    \ that your enumeration accepts. Enumerations are types, so you can declare enumerations\
    \ in a class or a namespace, but not in a method.\n\nThe following code example\
    \ shows the syntax to create an enumeration.\n\n```\nenum Name { Value1, Value2\
    \ . . . };\n```\n\nThe following code declares an enumeration for the seasons\
    \ of the year.\n\n```\nenum Seasons { Spring, Summer, Fall, Winter };\n```\n\n\
    Internally, an enumeration type associates an integer value with each element\
    \ of the enumeration. By default, the numbering starts at 0 for the first element\
    \ and increments in steps of 1. If you prefer, you can associate a specific integer\
    \ constant (such as 1) with an enumeration literal (such as Spring), as in the\
    \ following code-"
  merge: -1
  pgno: 388
- img_proc: true
  md: 'example. In this case, the enumeration literals Summer, Fall, and Winter automatically
    have the values 2, 3, and 4.


    ```

    enum Season { Spring = 1, Summer, Fall, Winter }

    ```


    The numeric value associated with each enumeration literal becomes significant
    if you write code that iterates through the possible values that an enumeration
    variable can have. You can also use the ++ and -- operators on an enumeration
    variable to advance or retract the value that it has.


    You can give more than one enumeration literal the same underlying value. For
    example, in the United Kingdom, fall is referred to as autumn. You can cater to
    both cultures, as the following code example shows:


    ```

    enum Season { Spring, Summer, Fall, Autumn = Fall, Winter }

    ```


    When you declare an enumeration, the enumeration literals are given values of
    type int. You can also base an enumeration on a different integer type. The following
    code example declares that the underlying type of the Season enumeration is a
    short rather than an int.


    ```

    enum Season : short { Spring, Summer, Fall, Winter }

    ```


    The main reason to do this is to save memory; int occupies more memory than a
    short. If you do not require the entire range of values that are available to
    an int, it can make sense to use a smaller data type.


    You can base an enumeration on any of the eight integer types: byte, sbyte, short,
    ushort, int, uint, long, or ulong. The values of all of the enumeration literals
    fit inside the range of the chosen base type.


    Question: Does the following code example show a legal enumeration?


    ```

    enum Season : sbyte{Spring = -3, Summer, Fall, Winter};

    ```


    # Additional Reading


    For more information about enumerations, see the Enumeration Types (C# Programming
    Guide) page at http://go.microsoft.com/fwlinkink/?LinkId=19295.'
