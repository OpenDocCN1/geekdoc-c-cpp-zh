  md: '# Module Overview


    +   * Controlling Visibility of Type Members

    * Sharing Methods and Data


    Previous modules have shown you how to add functionality to Microsoft®-.NET Framework
    applications by using existing types and creating your own types. When you create
    your own types, you will rarely want to expose all of the members in that type,
    because some of these members may represent helper functions and internal state
    data that are not relevant to other classes. Typically, your types should expose
    only the fields and methods that other types can use.


    In addition, all types to this point have been instance types, in that they model
    data and behavior for a specific instance of a type. Sometimes it is useful to
    define shared data and behavior that spans all of the instances of a type.


    This module describes how to use some of the access modifiers that C# provides
    to enable you to implement encapsulation. This module also introduces the static
    modifier, which enables you to define members that can be shared over multiple
    instances of the same type.'
  merge: -1
