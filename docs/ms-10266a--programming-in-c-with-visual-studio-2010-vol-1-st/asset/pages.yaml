- img_proc: true
  md: "# What Are Optional Parameters?\n\nOptional parameters enable you to define\
    \ a method and provide default values for the parameters in the parameter list:\n\
    * They are useful for interoperating with other technologies that support optional\
    \ parameters\n* They can provide an alternative implementation where overloading\
    \ is not appropriate\n\n# Example\n\n```\nvoid MyMethod(\n    int intData, float\
    \ floatData, int moreIntData = 99\n    ...\n);\n```\n\n```\n// Arguments provided\
    \ for all three parameters\nMyMethod(10, 123.45, 99);\n```\n\n```\n// Arguments\
    \ provided for 1st two parameters\nMyMethod(100, 54.321);\n```\n\n# Key Points\n\
    \nBy defining overloaded methods, you can implement different versions of a method\
    \ that takes different parameters. When you build an application that uses overloaded\
    \ methods, the compiler determines which specific instances of each method it\
    \ should use to satisfy each method call.\n\nHowever, there are other languages\
    \ and technologies that developers can use for building Windows-based applications\
    \ and components that do not follow these rules. A key feature of C# and other\
    \ languages that are designed for the .NET Framework is the ability to operate\
    \ with applications and components that are written using other technologies.\
    \ One of the primary technologies that Windows uses is the Component Object Model\
    \ (COM). COM does not support overloaded methods, but instead uses methods that\
    \ can take optional parameters. To make easier to incorporate COM libraries and\
    \ components into a C# solution, C# also supports optional parameters.\n\nOptional\
    \ parameters are also useful in other situations. They provide a compact and simple\
    \ solution when it is not possible to use overloading because the types of the\
    \ parameters do not vary sufficiently to enable the compiler to distinguish"
  merge: -1
  pgno: 238
- img_proc: true
  md: "between implementations. For example, consider the method in the following\
    \ code\nexample.\n\n```\nvoid MyMethod(\n  int intData, float floatData, int moreIntData)\n\
    {\n  ...\n}\n```\n\nThe MyMethod method takes three parameters: two int parameters\
    \ and a float\nparameter. If you wanted to provide an implementation of MyMethod\
    \ that took\nonly two parameters, intData and floatData, you could overload the\
    \ method, as the\nfollowing code example shows.\n\n```\nvoid MyMethod(int intData,\
    \ float floatData)\n{\n  ...\n}\n```\n\nIf you write a statement that calls the\
    \ MyMethod method, you can provide either\ntwo or three parameters of the appropriate\
    \ types, and the compiler uses the type\ninformation to determine which overload\
    \ to call, as the following code example\nshows.\n\n```\nint arg1 = 99;\nfloat\
    \ arg2 = 100.0F;\nint arg3 = 101;\n// Call overload with three parameters\nDoWorkWithData(arg1,\
    \ arg2, arg3);\n// Call overload with two parameters\nDoWorkWithData(arg1, arg2);\n\
    ```\n\nHowever, suppose you want to implement two versions of MyMethod that\n\
    take only the first parameter and the third parameter. You might try to implement\n\
    tthese as shown in the following code example.\n\n```\nvoid MyMethod(int intData)\n\
    {\n  ...\n}\nvoid MyMethod(int moreIntData)\n{\n  ...\n}\n```"
  merge: -1
  pgno: 239
- img_proc: true
  md: "However, these two overloads have the same signature, so the code will fail\
    \ to compile and instead generates the error “Type 'typename' already defines\
    \ a member called 'MyMethod with the same parameter types.”\n\nUsing optional\
    \ parameters can help to solve this problem.\n\n# Defining Optional Parameters\n\
    \nOptional parameters enable you to define a method and provide default values\
    \ for the parameters in the parameter list. You indicate a default value by using\
    \ the assignment operator.\n\nThe following example shows how to define a method\
    \ with an optional parameter. All other parameters are mandatory.\n\n```\nvoid\
    \ MyMethod(int intData, float floatData, int moreIntData = 99)\n{\n  ...\n}}\n\
    ```\n\nWhen using optional parameters, you must specify all mandatory parameters\
    \ before any optional parameters. The following code example causes a compiler\
    \ error.\n\n```\nvoid MyMethod(int intData, float floatData = 101.1F, int moreIntData)\n\
    {\n...\n}\n```\n\n# Calling a Method with Optional Parameters\n\nYou can call\
    \ a method that takes optional parameters in the same way that you call any other\
    \ method; you specify the method name and provide any necessary arguments. The\
    \ difference with methods that take optional parameters is that you can omit the\
    \ corresponding arguments, and the method will use the default value when the\
    \ method runs. In the first code example, the first call to the MyMethod provides\
    \ values for all three parameters.\n\nThe second specifies only two arguments,\
    \ and these values are applied to the first and second parameters. The moreIntData\
    \ parameter receives the default value of 99 when the method runs, as the following\
    \ code example shows.\n\n```\n// Arguments provided for all three parameters\n\
    MyMethod(10, 123.45F, 99);\n// Arguments provided for 1st two parameters only\n\
    MyMethod(100, 54.321F);\n```"
  merge: -1
  pgno: 240
