- img_proc: true
  md: "Note that, in the example above, the name of the interface begins with an uppercase\
    \ I. This is a common naming convention rather than an explicit requirement, but\
    \ the .NET Framework documentation recommends that you adhere to this standard;\
    \ all interfaces in the System namespace are prefixed with this way.\n\n# Implementing\
    \ an Interface\n\nTo implement an interface, you declare a class or structure\
    \ that inherits from the interface, and provides code for every method that the\
    \ interface defines.\n\n> **Note:** Although you cannot create struct types that\
    \ inherit from other struct types or classes, a struct type can implement an interface.\n\
    \nWhen you implement an interface, you must ensure that each method matches its\
    \ corresponding interface method exactly, according to the following rules:\n\n\
    +   * The method names and return types match exactly.\n* Any parameters (including\
    \ ref and out keyword modifiers) match exactly.\n* All methods implementing an\
    \ interface must be publicly accessible. However, if you are using explicit interface\
    \ implementation, the method should not have an access qualifier.\n\nIf there\
    \ is any difference between the interface definition and its declared implementation,\
    \ the class will not compile.\n\nThe following code example shows a class that\
    \ implements the ICalculator interface.\n\n```\nclass Calculator : ICalculator\n\
    {\n    // The methods of the ICalculator interface return test data\n    // in\
