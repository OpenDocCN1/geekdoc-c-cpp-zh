  md: '# Using a Structure


    The CLR manages structures in a different way from classes. When you declare a
    structure variable, the memory for that variable is allocated automatically. Consequently,
    you do not have to use the new operator to create an instance of a structure type;
    you simply declare a variable of that type. You can then assign individual values
    of the fields by using the same dot notation that you use to reference members
    of a class. You can read the values of fields in the same way. The following code
    example shows how to create and use an instance of the


    Currency type.


    ```

    Currency unitedStatesCurrency;


    unitedStatesCurrency.currencyCode = "USD"\unitedStatesCurrency.currencySymbol
    = "$"\unitedStatesCurrency.fractionDigits = 2;

    ```


    **Question:** What keyword do you use to declare a structure?'
