  md: '# Using the Checked and Unchecked Keywords


    > C# applications run with integer numeric overflow checking disabled by default.
    You can change this project setting


    > You can control overflow checking for specific code by using the checked and
    unchecked keywords


    ```

    checked

    {

    int x = ...;

    int y = ...;

    int z = ...;

    }

    ```


    ```

    unchecked

    {

    int x = ...;

    int y = ...;

    int z = ...;

    }

    ```


    ```

    int z = checked(x^y);

    ```


    checked and unchecked blocks operators


    ```

    int z = unchecked(x^y);

    ```


    # Key Points


    Integer arithmetic is a large part of most applications. It is very common to
    use idioms such as the following code example.


    ```

    for (int i = 0; i < 10; i++)

    {

    ...

    n}

    ```


    All numeric variables, including integers, have a maximum value. If you increment
    an integer that has this maximum value, the result is numeric overflow. However,
    integer arithmetic is so common that checking for numeric overflow after every
    integer numeric operation might seriously impact the performance of applications.
    Consequently, Microsoft Visual C# applications run with integer numeric overflow
    checking disabled by default. In these applications, there is a risk that numeric
    overflow may lead to incorrect results; if you increment an integer variable that
    has the largest integer value possible, the result is a negative value.'
  merge: -1
  pgno: 291
- img_proc: true
  md: "If you have a section of code that may cause numeric overflow, you can reinstate\
    \ overflow checking by using the checked keyword.\n\nYou can also enable overflow\
    \ checking for an entire application and disable it locally by using the unchecked\
    \ keyword.\n\n> Note: You can activate and disable overflow checking in Microsoft\
    \ Visual Studio® 2010 by setting the project properties. In Solution Explorer,\
    \ click YourProject (where YourProject is the name of your project). On the Project\
    \ menu, click YourProject Properties. In the Project Properties dialog box, click\
    \ the Build button. Click the Advanced button in the lower-right corner of the\
    \ page. Click the Advanced Build Settings dialog box, select or clear the Check\
    \ for arithmetic overflow/underflow box.\n\n# Using a Checked Block\n\nYou use\
    \ the checked keyword to define a block of code, enclosed in braces, that includes\
    \ numeric overflow checking. If numeric overflow occurs, the statement that caused\
    \ the overflow will cause an OverflowException to be thrown. The following code\
    \ example shows how to enable overflow checking and catch the OverflowException\
    \ exception.\n\n```\nchecked\n{\n  int x = ...;\n  int y = ...;\n  int z = ...;\n\
    \  \n  try {\n    z = x * y; // May cause numeric overflow\n  }\n  catch (OverflowException\
    \ ex) {\n    ... // Handle the overflow exception\n  }\n  }\n```\n\nYou can also\
    \ apply the checked operator to an individual expression, as shown in the following\
    \ code example. The scope of overflow checking is limited to the expression."
  merge: -1
  pgno: 292
- img_proc: true
  md: "```\n...\npublic int Multiply(short operandX, short operandY)\n{\n    return\
    \ checked((short)(operandX * operandY));\n}\n..\n```\n\n# ## Using an Unchecked\
    \ Block\n\nIf you have enabled overflow checking for an application, you can use\
    \ the unchecked keyword to suppress overflow checking in a block or an individual\
    \ expression. The syntax is the same as for a checked block or statement.\n\n\
    **Question:** In what scenario would you want to use the **checked** keyword?\n\
    \n# ## Additional Reading\n\nFor more information about using the **checked**\
    \ and **unchecked** keywords, see the Checked and Unchecked (C# Reference) page\
    \ at\nhttp://go.microsoft.com/fwlink/?LinkId=192914."
  merge: -1
