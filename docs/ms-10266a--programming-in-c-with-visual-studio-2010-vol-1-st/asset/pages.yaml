  md: "using (LogFileWriter lfw = new LogFileWriter ())\n{\n  // Use the LogFileWriter\
    \ object.\n}\n\nThe above example is functionally equivalent to the following\
    \ code example.\n\n```\nLogFileWriter lfw;\n\ntry {\n  lfw = new LogFileWriter\
    \ ();\n\n  // Use the LogFileWriter object.\n}\nfinally {\n  if (lfw != null)\
    \ {\n    lfw.Dispose();\n  }\n}\n```\n\nThe braces that enclose all of the code.\
    \ These braces encapsulate the lfw variable and ensure that no other objects reference\
    \ the lfw object. The object goes out of scope as soon as the flow of control\
    \ leaves the block and makes the object eligible for garbage collection.\n\nIf\
    \ a using statement is not appropriate in your code (if the object does not implement\
    \ the IDisposable interface, for example), using a try/finally block is an exception-safe\
    \ approach to disposing of an object; if the code in the try block throws an exception,\
    \ the finally block will still run calling the Dispose method. You should aim\
    \ to use a try/finally block wherever a using statement cannot be used.\n\nQuestion:\
    \ If you do not dispose of an object when you have finished with it, will the\
    \ runtime call the Dispose method automatically?"
