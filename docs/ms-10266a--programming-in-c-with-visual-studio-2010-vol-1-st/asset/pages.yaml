    # Exercise 3: Creating an Abstract Class


    In this exercise, you will define a class called MeasureMassDevice, which also
    implements the IMeasuringDevice interface. You will notice that, although the
    MetricValue and ImperialValue methods are implemented slightly differently from
    the MeasureLength class, the StartCollecting, StopCollecting, GetRawData, and
    GetMeasurements methods are identical. Code duplication is never a good thing,
    and can lead to maintenance difficulties. Consequently, you will create an abstract
    class MeasureDataDevice that provides default implementations of the duplicated
    methods. Students will modify the MeasureLengthDevice and MeasureMassDevice classes
    to inherit from this class.


