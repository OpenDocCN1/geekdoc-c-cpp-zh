  md: '# Task 5: Test the MeasureLengthDevice class by using the test harness


    +   1. Set the Exercise2TestHarness project to the default startup project.

    2. Start the Exercise2TestHarness application.

    3. Choose Imperial, and then click Create MeasureLengthDevice Instance. This button
