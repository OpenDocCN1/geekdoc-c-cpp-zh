- img_proc: true
  md: '# Types of Iteration Statements


    Iteration statements include:


    ```

    while

    A while loop enables you to execute a block of code zero or more times

    ```


    ```

    do

    A do loop enables you to execute a block of code one or more times

    ```


    ```

    for

    A for loop enables you to execute code repeatedly a set number of times

    ```


    # Key Points


    There are three types of iteration statement that you can use in C# applications.
    Each of these statements works in a slightly different way and has a distinct
    purpose.


    # While Loops


    A while loop enables you to execute a block of code zero or more times. While
    loops do not use a counter variable, although you can implement a counter variable
    by defining it outside the loop and manipulating it for each iteration.


    At the start of each iteration of a while loop, a Boolean condition is checked.
    If this condition evaluates to true, an iteration begins. If the condition evaluates
    to false, the loop terminates.


    While loops can be very useful if you do not know in advance whether you must
    perform iterative processing on a variable.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Do Loops


    Do loops are exactly like while loops apart from one detail. In a do loop, the
    condition is evaluated at the end of the iteration instead of the start. This
    means that a do loop always executes at least once, unlike a while loop, which
    might not execute at all.


    Do loops are very useful when you do not know in advance how many times your code
    needs to execute. For example, you can use a do loop to prompt a user repeatedly
    until the user provides valid input.


    # For Loops


    A for loop enables you to execute code repeatedly a set number of times. To achieve
    this, you define a counter variable for the loop, the value of which is changed
    for each iteration. When the counter variable reaches a limit value that you define,
    the loop terminates.


    The code in the body of a for loop can use the value of the counter variable.
    This means, for example, that you can use a for loop to process each member of
    an array. You can also nest for loops with different counters so that you can
    process multidimensional arrays or examine pixels at specified coordinates.


    **Question:** Which iteration statement would you use to prompt a user for a valid
    response?'
  merge: -1
  pgno: 171
