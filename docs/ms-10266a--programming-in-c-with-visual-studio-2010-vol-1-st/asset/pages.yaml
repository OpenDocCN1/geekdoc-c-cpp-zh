- img_proc: true
  md: 'smaller range and increased memory requirements. However, this accuracy is
    important. One scientific calculation requires the ability to calculate square
    roots to a high degree of accuracy. You decide to implement Newton''s algorithm
    for estimating and successively refining square roots, but generate the result
    by using the **decimal** type.


    The process Newton used for calculating the square root of 10 is as follows:


    +   1. Start with an initial guess: use the value that you want to find the square
    root of and divide by 2.


    In this case, 10 / 2, has the value 5.


    2. Refine the guess by dividing the original number by the previous guess, adding
    the value of the previous guess, and dividing the entire result by 2: calculate
    ((number / guess) + guess) / 2.


    In this example, calculate ((10 / 5) + 3.5) / 2 = 3.17857

    The answer 3.5 becomes the next guess.


    3. Perform the calculation ((number / guess) + guess) / 2 again, with the new
    guess


    In this example, calculate ((10 / 3.5) + 3.5) / 2 = 3.17857

    3.17857 is then the next guess.


    4. Repeat this process until the difference between subsequent guesses is less
    than some predetermined amount. The final guess is the square root of 10 to the
    accuracy that was specified by this predetermined amount.


    The main tasks for this exercise are as follows:


    +   1. Create a new WPF Application project.

    2. Create the user interface.

    3. Calculate square roots by using the Math.Sqrt method of .NET Framework.

    4. Calculate square roots by using Newton''s method.

    5. Test the application.'
