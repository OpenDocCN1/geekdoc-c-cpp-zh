  md: '# # What Is an Exception?


    | An exception is an indication of an error or exceptional condition, such as
    trying to open a file that does not exist |

    | When a method throws an exception, the calling code must be prepared to detect
    and handle the exception |

    | If the calling code cannot handle the exception, the exception is automatically
    propagated to the code that invoked the calling code |

    | The exception is propagated until a section of code handles the exception |

    | If no code handles the exception, the runtime will report an unhandled exception
    and the application will crash |


    # ## Key Points


    Many things can go wrong as an application runs, not just because of faults in
    the logic, but because applications typically depend on many variables outside
    the scope of the application, such as the existence of files on the file system
    and connections to databases. During the design of your application, you must
    consider how to ensure that your application can recover gracefully when problems
    arise. It is common practice to check the return values from methods to ensure
    that they have executed correctly. However, there are issues with this approach:


    +   - Not all methods return a value.

    - You need to know why the method call has failed, not just that it failed.

    - This approach does not cover how to handle unexpected errors such as running
    out of memory.'
  merge: -1
