  md: "# Comparing Reference Types to Value Types\n\n| Reference types (reference\
    \ on stack, value on heap) \n When you assign a reference, you simply refer to\
    \ an object in memory \n If you assign the same reference to two different variables,\
    \ both variables refer to the same object \n If you change the data in the object,\
    \ the changes will be reflected in all variables that reference that object |\
    \ Value types (value on stack) \n When you copy a value type, the variables do\
    \ not refer to the same object \n If you change the data in either variable, the\
    \ changes will not be reflected in other copies |\n\nKey Points\nTheR divides\
    \ its memory into two main areas: the stack and the heap. Most of the time, value\
    \ types are created on the stack, and reference types are created on the heap.\
    \ These two areas use memory in different ways. The details of how memory is managed\
    \ are described in a later module.\n\nThe difference between value types and reference\
    \ types is what happens when you copy them. In the following code examples, the\
    \ Residence type is a class (a reference type), and the Currency is a struct (a\
    \ value type).\n\nWhen you assign a reference, you simply refer to an object in\
    \ memory. If you assign the same reference to two different variables, both variables\
    \ refer to the same object. In the following code example, the myHouse variable\
    \ refers to a new House object. The variable refToHouse refers to the same object.\n\
    \n```\n// Create a two-bedroom House object.\nResidence myHouse = new Residence(ResidenceType.House,\
