  md: "The following code example shows how to define an extension method called NextRand\
    \ for the int type. The method returns a random number that uses the existing\
    \ int object as a seed. The method also accepts a parameter that represents a\
    \ maximum value for the new random number.\n\n```\nnamespace Fabrikam.Extensions\
    \ {\n    static class IntExtension {\n        internal static int NextRand(this\
    \ int seed, int maxValue) {\n            Random randomNumberGenerator = new Random(seed);\n\
    \            return randomNumberGenerator.Next(maxValue);\n        }\n    }\n\
    }\n```\n\n# Using Extension Methods\n\nA client application uses an extension\
    \ method in the same way that it uses a standard method; there is no visible difference.\
    \ You can still invoke the method on an instance of an object.\n\nThe following\
    \ code example shows how to invoke the NextRand method in the Fabrikam.Extensions\
    \ namespace. Notice that the client code does not reference the IntExtension class\
    \ that the NextRand method is declared in.\n\n```\nusing Fabrikam.Extensions;\n\
    namespace Fabrikam.Client {\n    class Program {\n        static void Main() {\n\
    \            int i = 8;\n            int j = i.NextRand(20);\n        }\n    }\n\
    }\n```\n\nQuestion: Briefly explain the difference between a standard method's\
    \ signature and a signature for an extension method."
