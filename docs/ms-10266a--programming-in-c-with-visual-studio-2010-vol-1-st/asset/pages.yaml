    | WaitPendingFinalizers | Suspends the current thread until all of the objects
    in the foreachable queue have been finalized |

    | SuppressFinalize | Prevents finalization of the object passed as the parameter
    |

    | ReRegisterFinalize | Requests finalization for an object that has either already
