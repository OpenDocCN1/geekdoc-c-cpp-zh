    will result in a $3\times5$ matrix.


    > Note: The number of columns in the first matrix must match the number of rows
    in the second matrix. The starter code is provided for you in this lab ensures
    that this is always the case.


    To calculate each element $xa,b$ in the result matrix, you must calculate the
    sum of the products of every value in row $a$ in the first matrix with every value
    $b$ in the second matrix. For example, to calculate the value placed at $x3,2$
    in the first matrix, you calculate the sum of the products of every value in row
    3 in the first matrix with every column 2 in the second matrix:


    $(5\times3)+(4\times2)+(2\times6)+(3\times1)=38$


    You perform this calculation for every element in the result matrix.

