  md: '# Programming in C# with Microsoft® Visual Studio® 2010


    Many older systems used the concept of a global error object. When a piece of
    code caused an error, it would set the data in this object to indicate the cause
    of the error and return to the caller. It was the responsibility of the calling
    code to examine the error object and determine how to handle it. Needless to say,
    this approach was not robust because it was too easy for a programmer to forget
    to handle errors.


    # How Exceptions Propagate


    This is where exceptions in the .NET Framework prove useful. An exception is an
    indication of an error or exceptional condition. A method can throw an exception
    when it detects something unexpected has happened, for example, it tries to open
    a file, but the file does not exist.


    When a method throws an exception, the calling code must be prepared to detect
    and handle this exception. If the calling code does not detect the exception,
    it is aborted and the exception is automatically propagated to the code that invoked
    it. This process continues until a section of code takes responsibility for handling
    the exception. Execution continues in this section of code after the exception-handling
    logic completes.


    As an example, suppose the A method calls the B method. As part of processing,
    the B method calls the C method. While it is running, the C method throws an exception.
    This exception may cause the C method to abort, and the exception is passed back
    to the B method. If the B method is not prepared to handle the method, it also
    aborts and the exception is passed back to the A method. If the A method handles
    the exception, execution continues in the A method after the exception-handling
    logic.


    If the A method is not prepared to handle the exception, the exception will be
    propagated to the method that called the A method. If this is the Main method,
    and Main is not prepared to handle the exception, the application reports the
    unhandled exception to the user and terminates.


    A method can catch and handle its own exceptions to provide a degree of robustness
    that the calling code may not even be aware of. For example, a method that updates
    a database may catch an exception that occurs if the connection to the database
    fails. It may try connecting again, possibly with an alternative of credentials.
    This process can be hidden from the code that called the method.


    # The Exception Type


    In the previous scenario, the A method is not aware that the B method called the
    C method. Consequently, when the B method aborted it could not handle the exception,
    it was the B method that caused the exception as far as the A'
