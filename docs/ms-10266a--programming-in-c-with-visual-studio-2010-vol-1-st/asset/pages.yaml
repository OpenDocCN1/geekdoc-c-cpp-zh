  md: '# What Is Encapsulation?


    Encapsulation is the ability of a type to hide its internal data and implementation
    details, making only specific parts of the type accessible to applications.


    Encapsulation is an essential object-oriented principle. For example, when you
    define a class, you should always define the fields as private members so that
    external code cannot access the fields directly. The only way for external code
    to interact with an object or class is through a well-defined set of public methods
    and properties.


    > Note: Properties provide a structured way to expose the ability to retrieve
    and set the values of private fields. Properties are covered in a later module
    in this course.


    # Benefits of Encapsulation


    Encapsulation enables you to hide information. When you hide information, such
    as the internal and implementation details of a type, the external code focuses
    on only the useful characteristics of the object. For example, the internal mechanism
    of a telephone is hidden from users; the wires, switches, and other internal parts
    of a telephone are encapsulated by its cover and are inaccessible to users. You
    may not have any idea about how a telephone works internally, but you can use
    it.


    In addition, when you hide the state of a type, client applications cannot modify
    or corrupt this state; this prevents changes that can cause the type to malfunction
    and produce unexpected results.


    By encapsulation, you can also easily change the implementation details of your
    type; applications that use your type do not need to be rewritten. As long as
    the public methods and properties that a class exposes do not change, any existing
    client applications still work correctly.


    Question: Discuss your experiences of encapsulation with other students.


    # Additional Reading


    For more information about encapsulation, see the Classes and Structs (C# Programming
    Guide) page at http://go.microsoft.com/fwlink/?LinkId=192935.'
