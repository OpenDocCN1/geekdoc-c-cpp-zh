  md: '# Stepping Through and Over Code


    > You can step through code one statement at a time to see exactly how processing
    proceeds through your application


    | Visual Studio 2010 enables you to: |

    | Step into the current statement |

    | Step over the current statement |

    | Step out of the current statement |


    Key Points

    You can step through code one statement at a time to see exactly how processing
    proceeds through your application. This is an extremely useful debugging technique
    because it enables you to test the logic that your application uses. Between statement
    executions, you can view and edit variable values. Each time your code reaches
    a branching statement such as a conditional statement, you can verify that the
    code correct executes and modify the code if it does not.


    The various tools that you use to step through code enable you to step through
    code in exactly the way you want to. Can, for example, step through each line
    in each method that is executed, or you can ignore the statements inside a method
    that you know is working correctly. You can also skip over code completely, which
    prevents some statements from execution.


    Step Into, Step Over, and Step Out


    There are three debug functions that are essential for stepping through code.
    These are as follows:'
  merge: -1
  pgno: 78
- img_proc: true
  md: '+   Step into. This function executes the statement at the current execution
    position. If the statement is a method call, the current execution position will
    move to the code inside the method. After you have stepped into a method, you
    can continue executing statements inside the method one line at a time. This also
    applies to properties. In addition, you can use the Step into function to start
    an application in Debug mode. If you do this, the application will enter break
    mode as soon as it starts.


    +   Step over. As with Step into, the Step over executes the statement at the
    current execution position. However, this function does not step into code inside
    method or property. Instead, the code inside the method or property is executed
    and the execution position moves to the statement after the method call or property
    access. The exception to this is where the code for the method or property contains
    a breakpoint. If this is the case, execution will continue up to the breakpoint.


    +   Step out. The Step out function enables you to execute the remaining code
    in a method, property accessor, or loop. Execution will continue to the statement
    that called the method or accessed the property, or to the statement following
    the loop code. Execution will pause at this point.


    # Skipping Code


    In break mode, the next statement to be executed is indicated by a yellow arrow
    in the gray bar to the left of the code and a yellow background for the statement.
    You can override this and set a different statement as the next one to execute.
    To do this, right-click the statement that you want to be executed, and then click
    Set next statement. The arrow and yellow background will move to the statement
    you have chosen.


    If you use this technique, you should be aware that you will change the way in
    which your application works. If you skip important code as variable assignments
    or critical method calls, you risk introducing errors that would not otherwise
    occur. You should skip statements with caution.


    # Continuing and Restarting


    When you have finished stepping through your code, you can return to Debug mode
    with the start/continue functions. Execution will then continue you'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'enter break mode again, either with the **Break all** button or if the code
    encounters a breakpoint.


    If you want to terminate the application and then run it again in Debug mode,
    you can use the **Restart** function. This is useful if you want to test the code
    that executes when an application first runs or any code that is only executed
    once when an application is used.


