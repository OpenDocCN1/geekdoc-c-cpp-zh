  md: "# Why Manage Resources in a Managed Environment?\n\n+   * Unmanaged resources\
    \ are not subject to garbage collection:\n  * You must take responsibility for\
    \ releasing them when an object is finalized\n  * Failing to dispose of unmanaged\
    \ objects properly can result in data loss\n\n  Example: Files may be locked,\
    \ preventing other applications from using them\n\n  Example: Data cached in memory\
    \ may be lost if resources are not managed properly\n\n  Example: Connections\
    \ to databases are often limited\n\n# Key Points\n\nThe garbage collector is concerned\
    \ with managed objects. It does not understand how to release the resources associated\
    \ with unmanaged objects. If you reference an unmanaged resource in a class, when\
    \ you remove the last reference to the class, the unmanaged object will not be\
    \ destroyed, it will simply be orphaned. The operating system may not clean up\
    \ the resource until your application terminates.\n\nFor example, the .NET Framework\
    \ class library provides the StreamWriter class that you can use to open a file\
    \ on the local file system and write text to that file. The StreamWriter acts\
    \ as a managed wrapper around text files, which are unmanaged resources controlled\
    \ by the operating system.\n\nWhen the StreamWriter object opens a file, the operating\
    \ system locks the file to ensure that no other processes can write to the same\
    \ file. When you have finished using the StreamWriter object in your code, you\
    \ can remove all references to it. This action will destroy the managed StreamWriter\
    \ object, but it may not release the lock because it is part of an unmanaged resource\
    \ that is not controlled by the garbage collector. You must take additional steps\
    \ to release this lock; otherwise, if you then attempt to create another StreamWriter\
    \ object to write to the same file, it will fail."
