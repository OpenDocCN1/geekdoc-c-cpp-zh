  md: "# Using a Try/Catch Block\n\n![](img/a8fed13e9f86d03aa521a7ff9d50e902_281_0.png)\n\
    \n# Key Points\n\nThe try/catch block is the the key programming construct for\
    \ SEH. You wrap code that may fail and cause an exception in a try block, and\
    \ add one or more catch blocks to handle any exceptions that may occur.\n\n# Try/Catch\
    \ Block Syntax\n\nThe syntax for using a try/catch block is shown in the following\
    \ code example.\n\n```\ntry\n{\n    // Try block.\n}\ncatch ([catch specification\
    \ 1])\n{\n    // Catch block 1.\n}\ncatch ([catch specification n])\n{\n    //\
    \ Catch block n.\n}\n```"
  merge: -1
  pgno: 281
- img_proc: true
  md: "The statements that are enclosed in the braces of the try block can be any\
    \ C# statements, and can invoke methods in other objects. If any of these statements\
    \ cause an exception to be thrown, execution passes to the appropriate catch block.\n\
    \n**Note:** When the code in the catch block has been completed, execution will\
    \ continue at the first statement after the try/catch block.\n\nThe catch specification\
    \ for each block determines what exceptions will be caught and what variable is\
    \ used to store the exception, if any. You can specify catch blocks for different\
    \ types of exceptions. The .NET Framework defines many different exception types\
    \ for many of the exceptions. The System.IO namespace that handle file I/O through\
    \ various classes throws the FileNotFoundException if an application attempts\
    \ to access a nonexistent file. In addition, the common language runtime (CLR)\
    \ itself throws a DivideByZeroException if you attempt to perform numeric division\
    \ by zero.\n\nWhen an exception occurs, you do not have to include a catch block\
    \ for every type of exception, and exceptions that are not matched will be propagated\
    \ as described earlier.\n\nThe most general form of catch block is one that has\
    \ no catch specification, so it catches any type of exception. This is illustrated\
    \ in the following code example.\n\n```\ntry{\n    // Try block.\n}\ncatch{\n\
    \    // Catch block.\n}\n```\n\nIn this code example, any exception that is thrown\
    \ in the try block will transfer control to the catch block. However, you will\
    \ not be able to determine the cause of the exception. To access this information,\
    \ you must provide a variable to use in the catch specification, as the following\
    \ code example shows.\n\n```\ntry{\n    // Try block.\n}\n```"
  merge: -1
  pgno: 282
- img_proc: true
  md: "# 4-10 Programming in C# with Microsoft® Visual Studio® 2010\n\n```\ncatch\
    \ (Exception ex)\n{\n    // Catch block, can access exception in ex.\n}\n```\n\
    \nThe exception information that is generated by the code that threw the exception\
    \ is passed in this variable. Note that this code will also catch any type of\
    \ exception.\n\nYou frequently use the Exception type to catch all exceptions\
    \ that have not been otherwise handled. In the following code example, if the\
    \ code in the try block causes a DivideByZeroException exception the code in the\
    \ corresponding catch block runs. If any other type of exception occurs, the catch\
    \ block for the Exception type runs.\n\n```\ntry\n{\n    // Try block.\ncatch\
    \ (DivideByZeroException ex)\n{\n    // Catch block, can access DivideByZeroException\
    \ exception in ex.\ncatch (Exception ex)\n{\n    // Catch block, can access exception\
    \ in ex.\n}\n```\n\n# Sequencing Catch Blocks\n\nYou must put catch blocks in\
    \ the correct order. When an exception is thrown, the CLR attempts to match the\
    \ exception against each catch block in turn. You must put more specific catch\
    \ blocks before less specific catch blocks, your code will not compile.\n\n> Note:\
    \ Exception types implement a hierarchy of exceptions. For example, the .NET Framework\
    \ provides an exception type called ArithmeticException, which you can use to\
    \ indicate when evaluating an arithmetic expression. DivideByZeroException is\
    \ a specific classification of ArithmeticException (the .NET Framework defines\
    \ two other types of ArithmeticException called OverflowException and NotFiniteNumberException).\
    \ If you catch the DivideByZeroException exception, only that exception is caught.\
    \ However, if you catch the ArithmeticException exception, the catch block will\
    \ trap DivideByZeroException, OverflowException, and NotFiniteNumberException.\
    \ Therefore, if you have multiple catch blocks, you must ensure that you place\
    \ the blocks"
  merge: -1
  pgno: 283
- img_proc: true
  md: "for more specific exceptions before those for less specific ones. The Exception\
    \ type is the least specific of all, and should be the final catch block if you\
    \ use it.\n\n# Nesting Try/Catch Blocks\n\nA try/catch block is a programming\
    \ construct like any statement in C#. You can nest try/catch blocks, so a try\
    \ block can contain a try/catch block, as the following code examples.\n\n```\n\
    try {\n    // Outer try block.\n    ...\n    try {\n        // Nested try block\n\
    \    }\n    catch (FileNotFoundException) {\n        // Catch block for nested\
    \ try block\n    }\n    // Outer try block continued\n} catch (DivideByZeroException)\
    \ {\n    // Catch block, can access DivideByZeroException exception in ex.\n}\
    \ catch (Exception ex) {\n    // Catch block, can access exception in ex.\n}\n\
    ```\n\nIf a FileNotFoundException occurs in the nested try block, the nested catch\
    \ block runs. Execution continues in the nested try block, at the first statement\
    \ after the catch block.\n\nIf any other type of exception occurs in the nested\
    \ try block, the exception is propagated to the outer try block, where it is caught\
    \ by the catch block for the Exception type. Execution then continues at the first\
    \ statement after the outer try/catch block.\n\nNesting provides a convenient\
    \ mechanism for handling and recovering certain types of exception locally within\
    \ a method."
  merge: -1
  pgno: 284
