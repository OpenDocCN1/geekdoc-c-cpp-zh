    to customize their behavior. Most properties that are exposed through both classes
    are the same, but there are some exceptions like the Multiselect property in the
    OpenFileDialog class, and the OverwritePrompt property in the SaveFileDialog class,
    as shown in the following code examples.


    ```

    ...

    dlg.Title = "Browse for a file to open";

    dlg.Multiselect = false;

    dlg.InitialDirectory = @"C:\Users\Student\Documents";

    ```'
