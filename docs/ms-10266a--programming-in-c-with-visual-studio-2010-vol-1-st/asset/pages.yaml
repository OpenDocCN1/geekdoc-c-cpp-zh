    \n### Defining an Interface\nTo define an interface, you use the interface keyword.\
    \ Inside the interface, you declare methods exactly as in a class or a structure\
    \ except that you never specify an access modifier (**public, private, or protected**),\
    \ and you replace the method body with a semicolon, as the following code example\
    \ shows.\n\n```\ninterface ICalculator\n{\n    double Add();\n    double Subtract();\n\
    \    double Multiply();\n    double Divide();\n}\n```"
