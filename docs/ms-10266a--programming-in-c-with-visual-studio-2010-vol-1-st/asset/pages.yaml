  md: "**Note:** It is common practice to place the static modifier after the access\
    \ modifier, as the preceding code example shows, although you can place it before\
    \ the access modifier. Your organization may have a preference.\n\nIf define a\
    \ static method, that method cannot reference any instance members that are declared\
    \ in that class. Static methods can only reference other static members, but instance\
    \ methods can access both instance and static members. Typically, instance methods\
    \ use data that is stored in instance fields, which has been collected during\
    \ the object's initialization and other method calls. Static methods can only\
    \ use data that is stored in static fields and the data that is passed as parameters\
    \ in the method's signature.\n\nFor the example, the **Sales** class in the following\
    \ code example exposes a **GetMonthlySalesTax** method that uses data that is\
    \ passed by the *monthlyProfit* parameter and the private static **salesTaxPercentage**\
    \ field.\n\n```\nclass Sales {\n    private static double salesTaxPercentage =\
    \ 20;\n    public static double GetMonthlySalesTax(double monthlyProfit)\n{\n\
    \        return (salesTaxPercentage * monthlyProfit) / 100;\n    }\n}\n```\n\n\
    The syntax that you use to access a **static** method is different from the syntax\
    \ that you use to access an instance method—you do not need to create an instance\
    \ of the type.\n\nTo access a **static** method on a class, you use the name of\
    \ the class, followed by a period, followed by the name of the method. For example,\
    \ the following code shows how to access the **GetMonthlySalesTax** method in\
    \ the **Sales** class.\n\n```\ndouble monthlySalesTax = Sales.GetMonthlySalesTax(34267);\n\
    ```\n\n```\nclass Sales {\n    public static double salesTaxPercentage = 20;\n\
    \    public static double GetMonthlySalesTax(double monthlyProfit)\n{\n      \
    \  return (salesTaxPercentage * monthlyProfit) / 100;\n    }\n}\n```"
