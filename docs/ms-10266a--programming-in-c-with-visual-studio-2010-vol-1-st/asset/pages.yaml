- img_proc: true
  md: "It is good practice to make the overloaded implementation of the Dispose method\
    \ protected and virtual. In this way, it can only be accessed by code in the class\
    \ and any child classes, but child classes can override it if they define additional\
    \ resources that must be disposed of. The overloaded Dispose method should also\
    \ invoke the Dispose method of any parent class if the parent implements the dispose\
    \ pattern.\n\nThe following code example shows a class that uses this strategy.\n\
    \n```\nclass LogFileWriter : IDisposable\n{\n    private bool isDisposed = false;\n\
    \    private TextWriter writer = ...;\n    private int largeArray[] = ...;\n\n\
    \    public void WriteDataToFile(...)\n    {\n        // Check that the current\
    \ object has not been disposed of\n        if (isDisposed)\n            throw\
    \ new ObjectDisposedException(...);\n    }\n\n    public void Dispose()\n    {\n\
    \        Dispose(true);\n    }\n\n    ~LogFileWriter()\n    {\n        Dispose(false);\n\
    \    }\n\n    protected virtual void Dispose(bool isDisposing)\n    {\n      \
    \  if (!isDisposed)\n        {\n            if (isDisposing)\n            {\n\
    \                // Release managed resources only if Dispose\n              \
    \  // was called by the application\n                largeArray = null;\n    \
    \            ...\n            }\n\n            // Always release unmanaged resources\n\
    \            if (writer != null)\n            {\nn        }\n    }\n}\n```"
  merge: -1
