  md: "# Using the Switch Statement\n\nThe switch statement enables you to execute\
    \ one of several blocks of code depending on the value of a variable or expression\n\
    \n```\nswitch (a)\n{\n    case 0:\n        // Executed if a is 0.\n        break;\n\
    \n    case 1:\n    case 2:\n    case 3:\n        // Executed if a is 1, 2, or\
    \ 3.\n        break;\n\n    default:\n        // Executed if a is any other value.\n\
    \        break;\n}\n```\n\n# Key Points\n\nThe switch statement enables you to\
    \ execute one of several blocks of code depending on the value of a variable or\
    \ expression. These code blocks provide a very simple, easy-to-read structure\
    \ and offer an alternative approach to using if statements.\n\n# Switch Statement\
    \ Syntax\n\nThe basic syntax for the switch statement is shown in the following\
    \ code example.\n\n```\nswitch ([expression to check])\n{\n    case [test1]:\n\
    \        ...\n        [exit case statement]\n\n    case [test2]:\n        ...\n\
    \        [exit case statement];\n```"
  merge: -1
