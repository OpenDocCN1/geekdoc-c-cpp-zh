  md: '# Comparing Internal and Public Types


    | Internal is the default access modifier for types |

    | Internal permits access only to types in the same assembly |

    | Public permits access to other types in other assemblies |


    | Fabrikam.Sales.dll | Types only accessible to types in Fabrikam.Sales.dll |

    | class Sales | Class Costs |

    | { | ... |

    | } | } |

    | | Fabrikam.Services.dll | Fabrikam.Dal.dll |

    | | Fabrikam.Hr.dll | public class Person | public class Record |

    | | ... | ... |

    | | Accessible to types in other assemblies | } |


    # Key Points


    You have already seen how to use access modifiers to show and hide members in
    types; however, you can also use access modifiers to show and hide types themselves.


    > Note: This topic focuses primarily on access modifiers for class definitions,
    although the same principles can be applied to any type, whether it is a class,
    a structure, or an enumeration.


    # Internal Types


    If do not specify an access modifier for a type, the default access level applied
    for the type is internal. The internal access modifier restricts visibility to
    only code in types that are defined in the same assembly. The public access modifier
    makes the type available to code in all types.


    The Sales class definition in the following code example does not explicitly define
    an access modifier, so the internal access modifier is implicitly assigned.'
