  md: '# Using the Debug Windows


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_81_0.png)


    # Key Points


    Visual Studio 2010 includes several windows that you can use to debug your applications.
    These windows are available at run time, mostly in break mode.


    The following table describes some of the commonly used debug windows in Visual
    Studio 2010.


    | Window | Description |

    |---|---|

    | QuickWatch | This is a modal window that enables you to evaluate variables and
    expressions. Type variable names or expressions in **Expression**, and then click
    **Reevaluate** to view the value and type of the variable or the result of the
    expression. Click **Close** to exit the QuickWatch window. |

    | Locals | This window enables you to view and edit local (in-scope) variables.
    You can expand variables, view members, and edit the contents of some variables
    in the **Value** column. |'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Window


    # Description


    Immediate


    This window enables you to evaluate expressions, execute statements, and print
    out variable values. You can use this window to issue Visual Studio 2010 commands
    such as Debug.Print? to print the value of a variable or expression.


    Output


    In this window, you can view error and information messages. One of the main uses
    of this window is to view traces from your applications using the System.Diagnostics.Debug.WriteLine()
    method.


    Memory


    This window enables you to examine and edit the contents of the memory that an
    application uses. This is an advanced function and can cause your application
    to behave unpredictably if you do not use this window carefully.


    Call Stack


    This window enables you to view the stack of method calls that are used to reach
    the current code location. The current position is shown at the top of the window,
    and the series of calls that the application has processed to reach this location
    is shown below.


    Modules


    This window enables you to view information about the modules (assemblies and
    executable files) that an application uses. Each module is listed along with its
    location, version, and other information.


    Processes


    In this window, you can view information about the processes that the debugger
    is attached to.


    Threads


    In this window, you can examine and control threads in an application.


    **Question:** Why would you use the Locals and Immediate windows when developing
    your application?'
  merge: -1
