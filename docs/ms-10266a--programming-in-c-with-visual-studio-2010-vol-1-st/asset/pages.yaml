    \ mark (?) to indicate that a value type is nullable |\n\nCurrency? myCurrency\
    \ = null; // legal\nif (myCurrency == null)\n{\n} |\nNullable types expose the\
    \ HasValue and Value properties |\n\nCurrency? myCurrency = null;\nif (myCurrency.HasValue)\n\
    {\nConsole.WriteLine(myCurrency.Value);\n} |\n\n# Key Points\n\nWhen you create\
    \ a reference variable, it is initially unassigned. You cannot use a reference\
    \ variable until you have assigned it a value, but at the point in your code at\
    \ which you declare the variable, you may not know how to initialize it to. In\
    \ this case, the null value is useful because you can explicitly check for it\
    \ later in your code, and if a reference variable is null, you can initialize\
    \ it by using the new operator, as the following example shows.\n\n```\nResidence\
    \ myHouse = null;\nif (myHouse == null)\n{\n    myHouse = new Residence(...);\n\
    }\n```\n\nThe null value is itself a reference. There is no corresponding value\
    \ for value types. This can cause a problem in your code. For example, it may\
    \ not be easy to determine whether a value type has been initialized (remember\
    \ that if you try to"
