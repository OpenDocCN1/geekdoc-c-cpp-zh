  md: '# What Is an Expression?


    Expressions are the fundamental constructs that you use to evaluate and manipulate
    data


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_129_0.png)


    # Key Points


    Expressions are a central component of practically every C# application. This
    is because expressions are the fundamental constructs that you use to evaluate
    and manipulate data.


    Expressions are collections of operands and operators. These terms are defined
    as follows:


    +   - Operands. Operands are values, for example, numbers and strings. They can
    be constant (literal) values, variables, properties, or method-call results.

    - Operators. define operations to perform on operands, for example, addition or
    multiplications. Operators exist for all of the basic mathematical operations
    in addition to some more advanced operations, such as logical comparison or the
    manipulation of the bits of data that constitutes a value.


    All expressions are evaluated to a single value when your application runs. The
    type of value that an expression produces depends on the types of the operands
    that you use and the operators that you use.'
