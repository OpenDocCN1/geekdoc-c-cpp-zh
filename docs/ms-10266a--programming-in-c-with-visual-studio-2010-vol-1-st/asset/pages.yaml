  md: '# Using Breakpoints


    > When you run an application in Debug mode, you can pause execution and enter
    break mode


    Visual Studio 2010 enables you to:


    +   - Locate a specific line of code and set a breakpoint

    - Locate a breakpoint and disable it

    - Locate a breakpoint and remove it


    # Key Points


    When you run an application in Debug mode, you can pause execution and enter break
    mode. In break mode, no further execution takes place until you restart the break
    mode. or step through the code line by line. You can also view and change variable
    values, execute additional code or evaluate expressions, and. When you are in
    break mode, the current line of code is indicated by a yellow arrow in the gray
    bar to the left of the code and by a yellow background for the next statement
    to be executed.


    The Break All debug function enables you to enter break mode. However, this function
    does not give you much control over exactly where code execution pauses.


    Breakpoints enable you to choose exactly where code execution will pause. If you
    place a breakpoint on a line of code, the application will enter break mode as
    soon as that line of code is reached, before it executes that line of code.'
  merge: -1
  pgno: 75
