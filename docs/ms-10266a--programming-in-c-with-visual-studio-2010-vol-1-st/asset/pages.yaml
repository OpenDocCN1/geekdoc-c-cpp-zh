  md: "# Creating and Using Extension Methods\n\nAdd extension methods to an existing\
    \ class without:\n- Having access to the source of the existing class\n- Modifying\
    \ or recompiling the existing class\n- Deriving a new type from the existing class\n\
    \n```\nnamespace Fabrikam.Extensions\n{\n    static class IntExtension { Static\
    \ method Extension type\n    {\n        internal static int NextRand(int seed,\
    \ int maxValue)\n        {\n            Random randomNumberGenerator = new Random(seed);\n\
    \            return randomNumberGenerator.Next(maxValue);\n        }\n    }\n\
    }\n```\n\n```\nusing Fabrikam.Extensions;\n...\nint i = 8;\nint j = i.NextRand(20);\n\
    ```\n\nNo reference to the\nIntExtension class\n\n# Key Points\n\nThe purpose\
    \ of extension methods is to provide a way to extend types with your own custom\
    \ functionality that does not affect or break other applications that already\
    \ use these types. Before the introduction of extension methods, it was necessary\
    \ to define a new class to wrap the existing functionality and provide the new\
    \ required method. However, this can affect existing code and introduce breaking\
    \ changes.\n\n# Defining Extension Methods\n\nWhen you define an extension method,\
    \ the first parameter in the method's signature indicates the type that is being\
    \ extended and is prefixed with the this keyword to indicate that it is an extension\
    \ method. At run time, the parameter is replaced with an instance of the type,\
    \ and you can manipulate this instance in whatever way you require to implement\
    \ the logic of the extension method.\n\nIt is common to define extension methods\
    \ in static classes and create these classes in a specific namespace. However,\
    \ extension methods must always be defined as static."
