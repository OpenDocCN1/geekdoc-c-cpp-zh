  md: '# Exercise 2: Making the Editor XML Aware


    The applications that control a robotic device read the instructions from the
    file and then encode them as an XML document before passing them to the instruction
    execution module on the device. For example, imagine that a text file contains
    the instructions in the following code example.


    ```

    Move x, 10

    Move y, 20

    If x < y Add x, y

    If x > y Sub x, y

    Store 30

    ```


    The control applications will wrap them in a pair of XML tags, as the following
    code example shows.


    ```

    <ControlApplication>

    <Instructions Code = "

    Move x, 10

    Move y, 20

    If x < y Add x, y

    If x > y Sub x, y

    Store 30"

    >

    </ControlApplication>

    ```


    However, some of the data in these instructions can contain characters such as
    ">" and "<" that might be misinterpreted as XML tags rather than data.


    In this exercise, you will modify the WPF application to look for data that contains
    XML tags in the text file as it is read and encode this data as XML escape sequences
    before displaying it. For example, the ">" character will be replaced with "&gt;",
    and the "<" symbol will be replaced with "&lt;", and so on. The WPF application
    will use a file stream to read the data.


    The main tasks for this exercise are as follows:


    +   1. Open the starter project.

    2. Add a new method to filter XML characters to the TextFormFieldOperations class.

    3. Update the user interface to invoke the new method.

    4. Implement test cases.'
  merge: -1
  pgno: 374
