  md: '# # What Is an Array?


    An array is a sequence of elements that are grouped together


    | Array features include:

    | Every element in the array contains a value |

    | Arrays are zero-indexed |

    | The length of an array is the total number of elements it can contain |

    | The lower bound of an array is the index of its first element |

    | Arrays can be single-dimensional, multidimensional, or jagged |

    | The rank of an array is the number of dimensions in the array |


    **Key Points**

    An array is a set of objects that are grouped together and managed as a unit.

    nYou can think of an array as a sequence of elements. All elements in an array
    have the same type. You can build simple arrays that have one dimension (a list),
    two dimensions (a table), three dimensions (a cube), and so on. Arrays have the
    following features:


    +   - Every element in the array contains a value.

    - Arrays are zero-indexed. The first item in an array is element 0.

    - The length of an array is the total number of elements that it can contain.

    - The lower bound of an array is the index of its first element.

    - Arrays can be single-dimensional, multidimensional, or jagged.

    - The rank of an array is the number of dimensions in the array.'
