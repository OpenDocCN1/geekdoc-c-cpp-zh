  md: '# Reading and Writing to Files


    ### Reading data from files

    ```sharp

    string filePath = "myfile.txt";

    byte[] data = File.ReadAllBytes(filePath); // Binary data.

    string[] lines = File.ReadAllLines(filePath); // Lines from file.

    string data = File.ReadAllText(filePath); // Entire file.

    ```


    ### Writing data to files

    ```sharp

    string filePath = "myfile.txt";

    string[] fileLines = {"Line 1", "Line 2", "Line 3"};

    File.AppendAllLines(filePath, fileLines); // Append lines.

    File.WriteAllLines(filePath, fileLines); // Write all lines to new file.

    string fileContents = "I am writing this text to a file ...";

    File.AppendAllText(filePath, fileContents); // Append all text.

    File.WriteAllText(filePath, fileContents); // Write all lines to new file.

    ```


    # Key Points


    The File and FileInfo classes provide several methods that you can use to read
    from and write to a file.



    The File class contains static methods that you can use to perform atomic operations
    for direct reading and writing to files. These methods are atomic because they
    wrap several underlying functions into a single method call. For example, the
    AppendAllLines method wraps operations to acquire the file handle, open a stream
    to the file, write data to the file, and then release the file handle.


    The FileInfo class contains instance methods that, when reading from and writing
    to files, rely on the FileStream and StreamWriter classes. The use of streams
    is covered in Lesson 2: Reading and Writing Files by Using Streams. This topic
    focuses on the static methods provided by the File class that do not use streams,
    but provide single atomic operations.'
  merge: -1
