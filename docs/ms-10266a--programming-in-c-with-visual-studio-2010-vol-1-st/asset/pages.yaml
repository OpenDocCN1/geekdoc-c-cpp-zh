    # Key Points


    Windows Presentation Foundation is the unified graphical subsystem for Windows
    that provides the foundation for building applications and high-fidelity experiences.
    It unifies how Windows creates, displays, and manipulates documents, media, and
    user interfaces. This enables you to create visually stunning user experiences.


    # Features of Windows Presentation Foundation


    The main features of Windows Presentation Foundation are:


    +   - Extensive support for client application development. Developers can create
    eye-catching, highly functional applications. WPF includes several text-rendering
    features such as OpenType and TrueType.

    - Ease of user interface design. WPF provides a set of built-in controls. It uses
    the concept that there is a logical separation of control from its appearance,
    which is generally considered to be a good architectural principle.'
