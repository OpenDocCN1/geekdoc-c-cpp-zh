    This lesson introduces abstract classes, and how you can use them to reduce code
    duplication, speed development, and reduce the risk of introducing bugs that duplicated
    code causes.


    Abstract classes combine some of the properties of object inheritance with some
    of the properties of interfaces. You can use abstract classes to reduce code duplication
    by using default implementations of methods.


