- img_proc: true
  md: '# What Is the .NET Framework 4?


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_10_0.png)


    # Key Points


    The .NET Framework 4 provides a comprehensive development platform that offers
    a fast and efficient way to build applications and services. Using Visual Studio
    2010, developers can utilize the .NET Framework 4 to create a wide range of solutions
    that operate across a broad range of computing devices.


    The .NET Framework 4 provides three principal elements: the CLR, the .NET Framework
    class library, and a collection of development frameworks.


    # The Common Language Runtime


    The .NET Framework 4 provides an environment called the CLR. The CLR manages the
    execution of code and simplifies the development process by providing a robust
    and secure execution environment that provides common services such as memory
    management, transactions, interprocess communications, multithreading, and many
    other features.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# The .NET Framework Class Library


    The .NET Framework 4 provides a library of reusable classes that developers can
    use build applications. The classes provide a foundation of common functionality
    and constructs that help simplify application development and remove the requirement
    for developers to constantly reinvent logic. For example, the System.File class
    contains functionality that enables developers to manipulate files on the Windows
    file system. In addition to using the classes in the .NET Framework class library,
    you can extend these classes by creating your own libraries of classes.


    # Development Frameworks


    The .NET Framework 4 provides several development frameworks that you can use
    to build common types of applications. These frameworks provide the necessary
    components and infrastructure to get you started. The development frameworks include:


    +   * ASP.NET. Enables you to build server-side Web applications.

    * WPF. Enables you to build rich client applications.

    * Windows Communication Foundation (WCF). Enables you to build secure and reliable
    service-oriented applications.

    * Windows Workflow Foundation (WF). Enables you to build workflow solutions to
    fulfill the complex business requirements of modern organizations.


    Question: What is the purpose of the .NET Framework 4, and the three components
    that it provides?


    # Additional Reading


    For more information about the .NET Framework, see the Microsoft .NET page at
    http://go.microsoft.com/fwlink/??LinkId=192876.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# The Purpose of Visual C#


    | C# |

    | C# is the language of choice for many developers who build .NET Framework applications
    |

    | C# uses a very similar syntax to C, C++, and Java |

    | C# has been standardized and is described by the ECMA-334 C# Language Specification
    |


    # Key Points


    The CLR runs executable code that is generated by using a compiler. You can build
    applications for the .NET Framework by using any language that has a compiler
    that can generate executable code in the format that the CLR recognizes. Visual
    Studio 2010 provides compilers for C++, Visual Basic, F#, and C#. Compilers for
    other languages are available from a variety of third-party vendors.


    C# is the language of choice for many developers. It uses a syntax that is very
    similar to C, C++, and Java, and has several extensions and features that are
    designed for operation with the .NET Framework. Because of its heritage, many
    developers who are familiar with other programming languages find C# easy to learn
    and can be produced quickly.


    The C# language has been standardized and is described by the ECMA-334 C# Language
    Specification. Several vendors apart from Microsoft produce C# compilers. The
    Microsoft implementation is called Visual C#, and is integrated into Visual Studio.
    Visual Studio supports Visual C# with a full-featured code editor, compiler, project
    templates, designers, code wizards, a powerful and easy-to-use debugger, and other
    tools. C# is also available from Microsoft as Visual C# Express'
  merge: -1
