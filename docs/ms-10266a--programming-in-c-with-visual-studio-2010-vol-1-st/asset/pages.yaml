  md: "# Creating and Using Static Fields\n\n| Instance fields contain data pertinent\
    \ to a specific instance of a type |\n| Static fields contain data pertinent to\
    \ the type itself |\n| class Sales {\n  public static double salesTaxPercentage\
    \ = 20;\n} |\n| To access a static field, you use the name of the class, followed\
    \ by a period, followed by the name of the field |\n| Sales.salesTaxPercentage\
    \ = 32; |\n\n# ### Key Points\n\nUntil this point, the primary focus has been\
    \ on how to create and use instance members in types. Instance members typically\
    \ contain data and implement functionality that is pertinent to a specific instance\
    \ of a type. When you create an instance of a type, memory is allocated for each\
    \ field, enabling the instance to hold unique data. For example, in the following\
    \ code example, the **sales2010** object is an instance of the **Sales** class,\
    \ and any data that is stored in the **sales2010** object is only accessible through\
    \ the **sales2010** instance. If you create a second instance of the **Sales**\
    \ class called **sales2011**, it cannot access any of the instance data in the\
    \ **sales2010** object, and the **sales2010** object cannot access its instance\
    \ data.\n\nThe following code example shows how data is not shared across instances\
    \ of the **Sales** class.\n\n```\nsales2010 = new Sales();\nsales2010.SetMonthlyProfit(34672);\n\
    Console.WriteLine(sales2010.GetAnnualProfitForecast());\nsales2011 = new Sales();\n\
    sales2011.SetMonthlyProfit(98675);\nConsole.WriteLine(sales2011.GetAnnualProfitForecast());\n\
    ```"
