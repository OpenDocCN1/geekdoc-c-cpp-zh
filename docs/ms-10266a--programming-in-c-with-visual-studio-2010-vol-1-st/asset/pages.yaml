  md: "```\nint Add(params int[] data)\n{\n    int sum = 0;\n    for (int i = 0; i\
    \ < data.Length; i++)\n    {\n        sum += data[i];\n    }\n    return sum;\n\
    }\n```\n\nNotice that the only difference to the Add method is the use of the\
    \ params keyword. When the Add method is called, the arguments are evaluated.\
    \ If they have a type that matches the type of the array specified by the params\
