  md: '# # Lesson 2

    Specifying Optional Parameters and Output Parameters


    +   * What Are Optional Parameters?

    * Calling a Method by Using Named Arguments

    * What Are Output Parameters?


    You have seen that you can define a method that takes a variable number of arguments
    by using a parameter array. However, sometimes you may want to define a method
    that has a fixed number of parameters, but enables an application to specify arguments
    only for the parameters that it needs. You can achieve this functionality by defining
    a method that takes optional parameters.


    By default, any arguments that you provide when you call a method are passed by
    value into the parameters that the method specifies. When the method completes,
    the parameters are destroyed and any changes that you make to the values in these
    parameters are lost. Output parameters provide a mechanism to enable you to pass
    data from a method back to the code that calls the method.


    This lesson describes how to define and use optional parameters and output parameters.'
  merge: -1
  pgno: 236
