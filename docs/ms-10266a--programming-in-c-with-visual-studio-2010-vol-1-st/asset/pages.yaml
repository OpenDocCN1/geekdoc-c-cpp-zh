    # Programmer Productivity Features


    Visual Studio 2010 provides a host of features that can help you to write code.
    When writing code, developers need to recall information about many program elements.
    Instead of manually looking up information by searching help files or other source
    code, the IntelliSense feature in Visual Studio provides the information that
    developers need directly from the editor. IntelliSense provides the following
    features:


    +   * Quick Info. The Quick Info option displays the code declaration for any
    identifier in your code. Move the mouse so that the cursor rests on an identifier
    to display Quick Info for that identifier, which appears in a yellow pop-up box.


    +   * Complete Word. The Complete Word option types the rest of a variable, command,
    or function name after you have entered characters to disambiguate the term. Type
    the first few letters of the name and then press ALT+RIGHT ARROW or CTRL+SPACEBAR
    to complete the word.


    Often, when you are building a .NET Framework application, you will need to repeat
    common constructs in your code. Examples might be a loop, or code to handle exceptions.
    Code snippets are designed to ease the burden of having to implement such code
    by providing boilerplate code templates that can be readily inserted into your
    code and amended to suit your needs. You can access these snippets by using the
    Code Snippet Picker.


    You can manage code snippets using the Code Snippet Manager dialog box, which
    is available on the Tools menu. The Code Snippet Manager enables you to add new
    code snippets by specifying new folders that the Code Snippet Picker will look
    in for code; by importing code snippets; or by searching for code snippets online.
    The Code Snippets Manager is also useful for discovering the shortcut key sequence
    that is associated with a code snippet.


    Finally, Visual Studio 2010 provides a host of other features on the shortcut
    menu that appears when you right-click a code statement. These include Refactor,
    Organize, Create Unit Tests, Go To Definition, Find All References, and Outline.
    These features will be covered in more detail in later modules.'
