  md: '# Comparing Private and Public Members


    | private | Least permissive access level |

    | --- | --- |

    | class Sales { | Only accessible from within the Sales class |

    | private double monthlyProfit; private void SetMonthlyProfit(double monthlyProfit)
    { this.monthlyProfit = monthlyProfit; } } |


    | public | Most permissive access level |

    | --- | --- |

    | class Sales { | Accessible to any other type |

    | private double monthlyProfit; public void SetMonthlyProfit(double monthlyProfit)
    { this.monthlyProfit = monthlyProfit; } } |


    # Key Points


    C# provides keywords known as access modifiers, which enable you to specify the
    access level for types and methods. You use these access modifiers to hide data
    and methods from applications that consume a type to implement encapsulation.


    C# provides several different access modifiers that provide varying degrees of
    protection. Some of these modifiers apply to types, and others apply to members
    of a type. This topic focuses on how to use the private and public access modifiers
    to hide and expose members.


    # Using the Private and Public Modifiers with Type Members


    If do not specify an access modifier for a member in a type, the default access
    level for the member is private. The member can only be accessed by code in the
    type and is not visible to other types.


    The Sales class definition in the following code example contains a private field
    called monthlyProfit, a private method called SetMonthlyProfit, and a private
    method called GetAnnualProfitForecast.'
