  md: '# The Structure of a Console Application


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_41_0.png)


    # Key Points


    When you create a new console application using the Console Application template,
    Visual Studio 2010 performs the following tasks:


    +   - It creates a new .csproj file to represent the console project and structure
    all of the default components in a console project.

    - It adds references to the assemblies in the .NET Framework class library that
    console applications most commonly require. This set of assemblies includes the
    System assembly.

    - It creates the Program.cs file with a Main method, which provides an entry point
    into the console application.


    The Program.cs file that Visual Studio 2010 creates resembles the following code.'
  merge: -1
  pgno: 41
- img_proc: true
  md: "using System;\n\n```\nnamespace MyFirstApplication\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n        }\n    }\n\
    }\n```\n\nThe following table describes the code items in the Program.cs.\n\n\
    | Code item | Description |\n| --- | --- |\n| using System; | Brings the System\
    \ namespace into scope. |\n| namespace MyFirstApplication { ... } | Defines a\
    \ new namespace called MyFirstApplication. Typically, in a new project, this defaults\
    \ to the project name. |\n| class Program { ... } | Defines a new internal class\
    \ called Program. |\n| static void Main(string[] args) { ... } | Defines a new\
    \ private static Main method with a void return type that accepts a parameter\
    \ of string array. |\n\n# What Is the Main Method?\n\nEvery .NET Framework application\
    \ that compiles into an executable file must have a Main method. This method provides\
    \ the CLR with an entry point into the application. When you run a .NET Framework\
    \ application, the Main method is the first method that the CLR executes."
  merge: -1
  pgno: 42
- img_proc: true
  md: 'When you develop your .NET Framework applications, it is good practice to keep
    the Main method lightweight, and let it serve as just an entry point, not a container
    for most of the logic in your application.


    The Main method has the following significant characteristics:


    +   * It is private. This means that it is not visible to other classes outside
    the Program class.

    * It uses the static key, so it can be called without creating an instance of
    the Program class.

    * It uses the void return type, so it is a method that does not return data.

    * It accepts data in the form of a string array. Therefore, when you run the console
    application, any command-line arguments that you provide will be available in
    the args parameter.


    **Question:** In your console application, you have a method called Main. What
    is the purpose of the Main method?


