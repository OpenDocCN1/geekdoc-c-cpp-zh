    The following table describes some of the key members that the StreamReader class
    provides to enable you to read text from an underlying stream.


    | Member | Description |

    | Close (method) | Enables you to close the StreamReader object and the underlying
    stream. |

    | EndOfStream (property) | Enables you to determine whether you have reached the
    end of the stream. |

    | Peek (method) | Enables you to get the next available character in the stream,
    but does not consume it. |

    | Read (method) | Enables you to get and consume the next available character
    in the stream. This method returns an int variable that represents the binary
    of the character, which you may need to convert. |

    | ReadBlock (method) | Enables you to read an entire block of characters from
    a specific index from the stream. |

    | ReadLine (method) | Enables you to read an entire line of characters from the
    stream. |

    | ReadToEnd (method) | Enables you to read all characters from the current position
    in the stream. |


    The following table shows some of the key members that the StreamWriter class
    provides to enable you to write text to a stream.


    | Member | Description |

    | AutoFlush (property) | Enables you to instruct the StreamWriter object to flush
    data to the underlying stream after every write call. |

    | Close (method) | Enables you to close the StreamWriter object and the underlying
    stream. |'
