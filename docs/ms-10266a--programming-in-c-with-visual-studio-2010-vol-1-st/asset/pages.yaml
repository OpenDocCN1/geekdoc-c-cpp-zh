  md: "```\nint Add(int one, int two, int three, int four)\n{\n    return one + two\
    \ + three + four;\n}\n```\n\nThis solution works well if you want to sum two,\
    \ three, or four integers, but what if you need to sum five, six, seven, or even\
    \ 100 integers? You could define 99 overloads, but how far should you go?\n\n\
    One way around this is to pass parameters as an array to a method. In theory,\
    \ there is no limit to the size of an array (in practice, the maximum size of\
    \ an array is governed by the amount of memory that is available on the computer\
    \ running your application). Using this approach, you could define a single version\
    \ of Add that looks like the following code example.\n\n```\nint Add(int[] data)\n\
    {\n    int sum = 0;\n    for (int i = 0; i < data.Length; i++) {\n        sum\
    \ += data[i];\n    }\n    return sum;\n}\n```\n\nThe downside to this approach\
    \ is that you would then have to manually declare and populate the array with\
    \ data, and then pass the array to the method each time you call it, as the following\
    \ code example shows.\n\n```\nint[] myData = new int[...];\nmyData[0] = 99;\n\
    myData[1] = 2;\nmyData[2] = 55;\nmyData[3] = -26;\n\nint sum = addObject.Add(myData);\n\
    ```\n\n# Using the params Keyword\n\nThe params keyword provides a useful shorthand\
    \ approach to implementing this technique. When you define a method with an array\
    \ parameter prefixed with the params keyword, the C# compiler can automatically\
    \ generate code that creates an array from a set of arguments that is specified\
    \ when the method is invoked. Using the following code example shows how to define\
    \ a method with the params keyword, and how you can invoke this method with a\
    \ variable number of arguments."
