    # Exercise 1: Calculating Square Roots with Improved Accuracy


    In this exercise, you will write a program that prompts the user for a numeric
    value and then uses Newton''s method to calculate the square root of this number.
    You will display the result, and compare it to the `double` value that is calculated
    using the `Math.Sqrt` method in the .NET Framework class library.


    # Scenario


    Some of the software that is being developed to support devices that perform scientific
    analysis analysis requires applications to perform calculations with a high degree
    of accuracy. The .NET Framework uses the `double` type to perform many of its
    calculations. The `double` type has a very large range, but the accuracy is not
    always sufficient. The `decimal` type provides a higher degree of accuracy at
    the cost of a'
