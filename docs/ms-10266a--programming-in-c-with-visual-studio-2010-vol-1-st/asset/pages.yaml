  md: 'contains numeric data, each element will be initialized to zero. If the array
    contains strings, each element will be initialized to the value null.


    The following code example shows the syntax for declaring and initializing a single-dimensional
    array.


    ```

    Type[] arrayName1 = new Type[ Size ];


    Type[] arrayName2 = new Type{element1, element2, ..., elementN};

    ```


    # Multidimensional Arrays


    An array can have more than one dimension. The number of dimensions corresponds
    to the number of indexes that are used to identify an individual element in the
    array. You can specify up to 32 dimensions, but you will rarely need more than
    three.


    You can declare a multidimensional array variable just as you declare a singledimensional
    array, but you separate the dimensions using commas. As with a single-dimensional
    array, you can also specify sets of data for each dimension and the compiler will
    use the number of elements in a set to size the corresponding dimension. You nest
    sets inside braces when you initialize a multidimensional array.


    The following code example shows the syntax for declaring and initializing a multidimensional
    array.


    ```

    Type[ , , . ] arrayName1 = new Type[Size1, Size2, . . . .];

    Type[ , , . ] arrayName2 = {element1, element2, element3},

    {element4, element5, element6},

    {elementN-2, elementN-1, elementN}};

    ```


    When you add dimensions to an array, the total storage of the array increases
    dramatically. Therefore, you should avoid declaring an array that is larger than
    your requirements.


    # Jagged Arrays


    Multidimensional arrays in C# must be rectangular; the number of elements in each
    dimension must be the same. C# also supports jagged arrays. A jagged array is
    simply an array of arrays, and the size of each array can vary. Jagged arrays
    are useful for modeling sparse data structures where you might not always want
    to allocate memory for every item if it is not going to be used.'
