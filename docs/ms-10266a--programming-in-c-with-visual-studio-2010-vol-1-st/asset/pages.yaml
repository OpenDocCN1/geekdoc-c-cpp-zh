    \    DateTime t =;\n    double y =;\n    int x =;\n\n    // x, y, z, and a disappear\
    \ here\n\\})\n```\n\n```\nstring s =;\nMyClass c =;\n\nprivate void MyMethod2(\n\
    {\n    string t = s;\n    MyClass d = c;\n    // References t and d disappear\
    \ here\n    // Objects s and c remain on the heap\n})\n```\n\n# Key Points\n\n\
    The .NET Framework divides the items that a managed application can use into two\
    \ broad categories: value types and reference types.\n\n# Managing Value Types\n\
    \nValue types are managed types that are usually created on the stack. The CLR\
    \ manages the stack. When an object goes out of scope, the memory used by that\
    \ object is reclaimed immediately. For example, at the end of a method, any variables\
    \ based on value types (created on the stack) defined in method are destroyed.\
    \ The stack is a last in, first out (LIFO) structure. The CLR maintains a pointer\
    \ to the top of the stack. When a value type variable is created, it is placed\
    \ at the top of the stack and the stack pointer is moved up. When the variable\
    \ goes out of scope, the stack pointer is moved back down again. In this way,\
    \ new items overwrite old items and memory is reclaimed automatically; memory\
    \ management is therefore a relatively inexpensive operation."
