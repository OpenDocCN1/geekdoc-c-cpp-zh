  md: '# What Are Variables?


    Variables store values required by the application in temporary memory locations


    | Variables have the following facets: |

    | Name |

    | Address |

    | Data type |

    | Value |

    | Scope |

    | Lifetime |


    # Key Points


    A variable represents a named location in memory for a piece of data. An application
    can access a piece of data by using the variable it has been assigned to.


    Variables store values that an application can change while it is running. You
    often need to store values temporarily when you perform calculations or pass data
    between the user, an application, and a database. For example, you might want
    to retrieve several values from a database, compare them, and perform different
    operations on them depending on the result of the comparison.


    A variable has the following six facets:


    +   * Name. Unique identifier that refers to the variable in code.

    * Address. Memory location of the variable.

    * Data type. Type and size of data that the variable can store.

    * Value. Value at the address of the variable.

    * Scope. Defined areas of code that can access and use the variable.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '+   - Lifetime. Period of time that a variable is valid and available for use.


    # Examples of Variables


    You can use variables in many ways, including:


    +   - As a counter for loop structures.

    - As temporary storage for property values.

    - As a container to store a value that was returned from a function.


    **Question:** What is a variable and how are variables used in Microsoft® .NET
    Framework applications?'
