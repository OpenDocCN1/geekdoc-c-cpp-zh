  md: "# Break and Continue Statements\n\n# Break statement\n\n```\nwhile (oldNumbers.Length\
    \ > count)\n{\n    if (oldNumbers[count] == 5)\n    {\n        break; // Enables\
    \ you to exit the loop and skip to the next line of code\n        count++;\n \
    \   }\n}\n```\n\n# Continue statement\n\n```\nwhile (oldNumbers.Length > count)\n\
    {\n    if (oldNumbers[count] == 5)\n    {\n        continue; // Enables you to\
    \ skip the remaining code in the current iteration, test the condition, and then\
    \ start the next iteration of the loop\n    }\n    // Code that won't be hit\n\
    \    count++;\n}\n```\n\n# Key Points\n\nWhen you use the while, do, and for loop\
    \ constructs, you can also use the break and continue statements to modify the\
    \ behavior of the loop.\n\n> Note: Use break and continue with caution. They can\
    \ lead to code that is difficult to understand and maintain.\n\n# The Break Statement\n\
    \nThe break statement enables you to exit the loop entirely, and skip to the next\
    \ line of code outside the loop. The break statement is particularly useful if\
    \ you are iterating through an array looking for a record, and you want to exit\
    \ the loop you have found the record.\n\n> Note: Do not confuse the use of break\
    \ in a loop with break in a switch statement."
  merge: -1
