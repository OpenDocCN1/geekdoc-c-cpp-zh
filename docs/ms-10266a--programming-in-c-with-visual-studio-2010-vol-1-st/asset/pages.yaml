  md: '# The Object Life Cycle


    | 1 | Block of memory allocated |

    | 2 | Memory converted into an object (constructor) |

    | 3 | Object used in application |

    | 4 | Object tidied up (destructor) |

    | 5 | Memory reclaimed |


    # Key Points


    An object has several distinct stages in its life cycle, which starts at creation
    and ends in destruction. As a developer, the process that you use to create an
    object is very simple; you use the `new` keyword to instantiate the new object.
    However, the process that you use to create an object is not really this simple.
    When you create a new object, the following things happen:


    +   - A block of memory is allocated. This block of memory is big enough to hold
    the object.

    - The block of memory is converted to an object. The object is initialized.


    You can control only the second of these two steps—converting the block of memory
    to an object. You can control this step by implementing a constructor.

    The runtime handles the allocation of memory for managed objects; however, if
    you call unmanaged libraries, you may need to manually allocate memory for unmanaged
    objects you create.'
  merge: -1
  pgno: 584
- img_proc: true
  md: 'After an object is created, you can use the properties, methods, and other
    members.


    # Destroying an Object


    When you have finished with an object, it can be destroyed.


    You use destruction to reclaim any resources used by that object. Like creation,
    destruction is a two-phase process:


    +   1. The object is cleaned up; for example, releasing any unmanaged resources
    used by the application, such as file handles and database connections.


    +   2. The memory used by the object is reclaimed.


    You can control only the first of these steps—cleaning the object and releasing
    resources. You can control this step by implementing a destructor.


    The CLR handles the release of memory used by managed objects; however, if you
    use unmanaged objects, you may need to manually release the memory used by these
    items.


    **Question**: How can you control the creation phase for an object?'
