    \ void Work()\n  { ... }\n}\nclass Manager : Employee {\n  public new void Work()\n\
    \  { ... }\n} Hiding: Replace functionality in a base class with new behavior\
    \ (possibly an error) |\n\n# Key Points\n\nWhen you use inheritance to define\
    \ a class, an inheriting class can provide its own methods. It is possible that\
    \ some of these methods have the same names as those are inherited from the base\
    \ class. In these situations, you have to decide whether you want to override\
    \ the inherited methods or hide them.\n\n# Overriding Methods\n\nWhen you override\
    \ a method, you provide an implementation that has the same meaning as the original\
    \ method, but has an implementation that is specific to the class. For example,\
    \ the Object class provides the ToString method, which returns a representation\
    \ of an object as a string. However, the default implementation of the ToString\
    \ method in the Object class simply returns the name of the type as a string.\
    \ You might override this behavior in the Employee class to return a string that\
    \ contains the name of the employee.\n\nTo override a method in a subclass, you\
    \ use the override keyword, as the following code example shows."
