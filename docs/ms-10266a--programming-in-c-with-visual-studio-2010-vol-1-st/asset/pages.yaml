  md: '# Using Partial Classes and Partial Methods


    | Split a class definition across multiple source files |

    | Prefix the class and method declarations with the partial keyword |

    | public partial class Residence { partial void SaleResidence(string name) } |
    Definition of SaleResidence method |

    | public partial class Residence { partial void SaleResidence(string name) { //Logic
    goes here. } } | Implementation of SaleResidence method |

    | All parts of the partial class and method must be available during compilation
    |

    | Compiled into a single entity |


    # Key Points


    There may be situations where you want to split a class definition across multiple
    source files. For example, you may have multiple developers who want to work concurrently
    on a class, or you may have parts of a class that should never be modified. The
    .NET Framework provides the concept of a partial class for this purpose.


    Some classes in the .NET Framework and Visual Studio projects use the partial
    concept. For example, Windows® Presentation Foundation (WPF) applications use
    partial classes to separate out the code that Visual Studio generates to initialize
    a window from the programmatic logic that you add to process the user input and
    display the results.


    # Defining Partial Classes


    Defining a class as partial enables you to split a class over multiple files.
    To define a class as partial, you must use the partial keyword, as the following
    code example shows.'
  merge: -1
  pgno: 410
- img_proc: true
  md: "```\n// File1.cs\nnamespace HouseSystem\n{\n    public partial class Residence\n\
    \    {\n        //...\n    }\n}\n```\n\n```\n// File2.cs\nnamespace HouseSystem\n\
    {\n    public partial class Residence\n    {\n        //...\n    }\n}\n```\n\n\
    The following rules and guidelines apply when you define a partial class:\n\n\
    +   - Each part of the class must be available when your application is compiled,\
    \ because the compiler compiles the class into a single entity.\n\n+   - Each\
    \ part of the class must be prefixed with the partial keyword.\n\n+   - The partial\
    \ type cannot be split over multiple assemblies. Each part of the partial type\
    \ must exist in the same assembly.\n\n+   - The partial keyword must prefix the\
    \ class keyword.\n\n# Defining Partial Methods\n\nWhen you define a partial class,\
    \ you can define one or more methods in that class as partial methods.\n\nA partial\
    \ method specifies the method signature in one file that holds the partial class,\
    \ and it optionally specifies the code that implements the method in another file\
    \ that holds the partial class. If the partial method is not implemented, it is\
    \ effectively removed from the class, and any statements that call that method\
    \ are also ignored when the class is compiled. Partial methods are typically used\
    \ by frameworks; they provide a mechanism for the classes in the framework to\
    \ invoke methods when developers outside the framework implement the code for\
    \ these methods."
