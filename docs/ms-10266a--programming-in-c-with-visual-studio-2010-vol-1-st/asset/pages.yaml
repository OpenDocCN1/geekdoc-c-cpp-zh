  md: "pass an uninitialized value type into a method, your code will not compile.\n\
    Because the null value is a reference, the statement that is shown in the following\
    \ code example is illegal in C#.\n\n```\nCurrency myCurrency = null; // Illegal\n\
    ```\n\nHowever, C# defines a modifier that you can use to declare that a variable\
    \ is a nullable value type. A nullable value type behaves in a similar manner\
    \ to the original value type, but you can assign the null value to it. You use\
    \ a question mark (?) to indicate that a value type is nullable. Later in your\
    \ application, you can ascertain whether a nullable variable contains null by\
    \ testing it in the same way as a reference type, as the following code example\
    \ shows.\n\n```\nCurrency myCurrency = null; // Legal\n...\nif (myCurrency ==\
    \ null)\n{\n    myCurrency = new myCurrency(...);\n}\n```\n\nYou can assign an\
    \ expression of the appropriate value type directly to a nullable variable. The\
    \ following code examples are all legal (remember that int is a value type in\
    \ C#).\n\n```\nint? i = null;\nint j = 99;\ni = 100; // Copy a value-type constant\
    \ to a nullable type.\nj = j;   // Copy a value-type variable to a nullable-type\
    \ variable.\n```\n\nYou should note that the converse is not true. You cannot\
    \ assign a nullable value to an ordinary value-type variable. So, given the definitions\
    \ of variables i and j from the previous example, the statement that is shown\
    \ in the following code example is illegal.\n\n```\nj = i; // Illegal\n```\n\n\
    This is because the variable i may contain null and j variable is a value type\
    \ that cannot contain null. This also means that you cannot use a nullable variable\
    \ as a parameter to a method that expects an ordinary value type.\n\n# Properties\
    \ of Nullable Types\n\nNullable types expose a pair of properties that you can\
    \ use to determine whether a nullable variable has a null value and what its value\
    \ is:"
  merge: -1
