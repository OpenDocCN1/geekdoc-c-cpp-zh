- img_proc: true
  md: "# Explicit Conversions\n\nIn C#, you can use a cast operator to perform explicit\
    \ conversions. A cast specifies the type to convert to, in round brackets. The\
    \ syntax for performing an explicit conversion is shown in the following code\
    \ example.\n\n```\nDataType variableName1 = (castDataType) variableName2;\n```\n\
    \nYou can only perform meaningful conversions in this way, as converting a long\
    \ to an int. You cannot use a cast if the format of the data has to physically\
    \ change, such as if you are converting a string to an integer. To perform these\
    \ types of conversions, you can use the methods of the System.Convert class.\n\
    \n# Using the System.Convert Class\n\nThe System.Convert class provides methods\
    \ that can convert a base type to another base type. These methods have names\
    \ such as ToDouble, ToInt32, ToString, and so on. All languages that the CLR can\
    \ use this class. You might find this easier to use for conversions because Microsoft\
    \ IntelliSense helps you locate the conversion method that you need. The following\
    \ code example converts a string to an int type.\n\n```\nstring possibleInt =\
    \ \"1234\";\nint count = Convert.ToInt32(possibleInt);\n```\n\nIn addition to\
    \ the Convert.ToString method, many types implement their own ToString method.\
    \ The following code example converts an int to a string type.\n\n```\nint number\
    \ = 1234;\nstring numberString = count.ToString();\n```\n\nSome of the built-in\
    \ data types in C# provide a TryParse() method, which allows you to determine\
    \ whether the conversion will succeed before you perform the conversion. The following\
    \ code example shows how to convert a string to an int by using int.TryParse()\
    \ method.\n\n```\nint number = 0;\nstring numberString = \"1234\";\nif (int.TryParse(numberString,\
    \ out number))\n{\n    // Conversion succeeded, number now equals 1234\n}\nelelse\n\
    ```"
