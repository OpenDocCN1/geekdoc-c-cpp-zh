  md: '# Managing Reference Types


    Reference types are allocated memory from the heap. The heap is a block of memory
    also controlled by the CLR, separate from the stack. When you create an object,
    the CLR allocates memory for the object and creates a reference to it on the stack.
    Unlike a value type, a reference type can have several references to the same
    object. If you refer to the same object several times, the reference disappears
    when it goes out of scope, but other references to the same object that are in
    scope remain valid. An object can be destroyed, its destructor run, and its resources
    reclaimed only when the final reference to the object disappears. Consequently,
    the lifetime of an object is not governed by the scope of any single reference
    to that object.


    An important feature of the .NET garbage collector is to monitor an object on
    the heap and determine when the last reference to that object has disappeared.
    Determining when an object has no references can be a time-consuming and expensive
    operation, so the garbage collector performs this task when it needs to, typically
    when the amount of memory available on the heap falls below some threshold.


    A second function of the garbage collector is to defragment the heap. If an application
    attempts to create an object for which there is insufficient contiguous empty
    space available on the heap, the garbage collector will attempt to move some existing
    objects around and compact the resulting free space into a chunk of memory big
    enough to hold the new object. Again, this can be a computationally expensive
    task.


    # Value Types on the Heap


    Value types are usually created on the stack. However, there is one scenario where
    this does not occur. When you develop a class, you can use a value type as a field
    in that class. When you instantiate an object by using this class, the fields
    that constitute the object, including any value type fields, are allocated space
    on the heap. These value type fields remain active until the containing object
    is destroyed and the garbage collector reclaims the space used by these fields.


    If you use a value type as a field in a struct, it will be stored as part of the
    struct. Structs are value types and as such are normally stored on the stack,
    unless they are elements inside a class. If the value type is an element inside
    a class, it is stored on the heap as described in the previous paragraph.


    Question: Is the stack first in, first out (FIFO), LIFO, first in, last out (FILO),
    or random access memory store?'
