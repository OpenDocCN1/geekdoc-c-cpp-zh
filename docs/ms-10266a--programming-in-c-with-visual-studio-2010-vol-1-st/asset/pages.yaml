  md: "# What Are Output Parameters?\n\n| Output parameters enable you to pass a value\
    \ back from a method to an argument:\n| Use the out keyword in the parameter list\
    \ |\n| void MyMethod(int first, double second, out int data) {\n  ...\n  data\
    \ = 99;\n} |\n| Call the method with a variable specified as an out argument |\n\
    \n```\nvoid MyMethod(int first, double second, out int data) {\n  ...\n  data\
    \ = 99;\n}\n```\n\n```\nint value;\nMyMethod(10, 101.1F, out value);\n// value\
    \ = 99\n```\n\n# Key Points\n\nA method can specify a return type, and use a return\
    \ statement to pass a value back to code that calls it. Output parameters enable\
    \ you to return additional data from a method. When you add an output parameter\
    \ to a method, the method body is expected to assign a value to that parameter.\
    \ When the method completes, the value of the output parameter is assigned to\
    \ a variable that is specified as the corresponding argument in the method call.\n\
    \nTo define an output parameter, prefix the parameter in the method signature\
    \ with the out keyword. The following code example shows the syntax.\n\n```\n\
    void MyMethod(int first, double second, out int data) {\n  ...\n  data = 99;\\\
    }\n```\n\nA method can have as many output parameters as required."
