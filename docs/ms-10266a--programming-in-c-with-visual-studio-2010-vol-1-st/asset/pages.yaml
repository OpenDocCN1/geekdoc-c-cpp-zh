  md: '# Boxing and Unboxing


    | Boxing (value type to reference type) |

    | 1. The CLR allocates a piece of memory on the heap |

    | 2. The CLR copies the value from the stack to the new piece of memory |

    | myCurrency = new Currency(); // Value type

    object o = myCurrency; // Box the value type into a reference |


    | Unboxing (reference type to value type) |

    | 1. The CLR checks the type of the boxed variable |

    | 2. If the types match, the CLR copies the value from the heap |

    | myCurrency = new Currency(...);

    object o = myCurrency; // boxing

    ...

    Currency anotherCurrency = (Currency)o; // compiles okay |


    # Key Points


    Reference types refer to objects and value types hold values. The C# language
    defines a special type called object that you can use to refer to any type, as
    the following code example.


    ```

    Residence myHouse = new Residence(...);

    object obj = myHouse;

    ```


    The object type is useful if you define methods that can take parameters of different
    types, and you do not know in advance what those types are. For example, the collection
    classes in the .NET Framework class library enable you to build collections of
    objects of almost any type, and the methods that these classes define use the
    object type. You will see more about the collection classes in a later module.


    > Note: The object type is an alias for the System.Object class. This class underpins
    the entire type system that the .NET Framework implements; all data types are
    really just'
  merge: -1
  pgno: 430
- img_proc: true
  md: 'specialized versions of the object type. The purpose of the System.Object class
    and how it relates to other types is described in more detail in a later module.


    In some cases, you may need to convert a value type to a reference type, such
    as object. You can achieve this quite simply, as the following code example shows.


    ```

    Currency myCurrency = new Currency(); // Value type.

    object o = myCurrency; // Box the value type into a reference.

    ```


    The second statement requires a little explanation. Remember that the myCurrency
    variable is a value type that is created on the stack. If the reference inside
    the object referred directly to the myCurrency variable, the reference would refer
    to the stack. However, all references refer to objects on the heap: creating references
    to items on the stack can easily compromise the robustness of the CLR and create
    a potential security risk, so it is not allowed. Therefore, the CLR allocates
    a piece of memory from the heap, copies the value of the Currency myCurrency to
    this piece of memory, and then refers to the object o to this copy. This automatic
    copying of an item from the stack to the heap is called boxing.


    Because a variable type object can refer to a boxed copy of a value, it is only
    reasonable to allow you to access that boxed value through the variable. You may
    expect to be able to access the boxed Currency value variable that a variable
    refers to by using a simple assignment statement, as the following code example
    shows.


    ```

    Currency anotherCurrency = o;

    ```


    If you try this syntax, you will get a compile-time error. This is because the
    o variable could referencing anything and not just a Currency variable value,
    as the following code example shows.


    ```

    Residence myHouse = new Residence(...);

    Currency myCurrency;

    object o;

    o = myHouse; // o refers to a Residence

    myCurrency = o; // what is stored in myCurrency?

    ```


    To obtain the value of the boxed copy, you must use a cast. The compiler will
    generate code that checks whether it is safe to convert the object variable into
    the specified type. The following code example shows how to use a cast in this
    scenario.'
  merge: -1
