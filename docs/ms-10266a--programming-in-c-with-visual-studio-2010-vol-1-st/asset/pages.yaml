  md: '# Best Practices for Handling and Raising Exceptions


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_304_0.png)


    # Key Points


    The constructs for implementing exception handling in your applications are straightforward
    to use, but as with any programming constructs, it is important to follow a good
    design. The following list explains some of the best practices for handling exceptions:


    +   - Throw an exception that is appropriate to the error condition that is detected.

    - The logic in your application should not rely on **try** and **catch** blocks
    to function under unconditional conditions. You should design your methods so
    that, under normal circumstances, they will not throw exceptions. Only catch and
    throw exceptions for conditions that are outside the expected logical flow of
    an application.

    - When you define multiple **catch** blocks, order them from the most specific
    to the least specific. If you catch the **Exception** type, it must be the final
    handler in a set of **catch** blocks.

    - Catch and log detailed exception messages for diagnostic purposes, and then
    display user-friendly messages to the user. Remember that any text that is'
  merge: -1
  pgno: 304
- img_proc: true
  md: "displayed to the user should be localizable, and the text should be retrieved\
    \ from resource files.\n\nThe following code example shows how you can write a\
    \ message to the Windows® event log.\n\n```\nusing System.Diagnostics;\n...\n\
    // The event source name.\nstring source = \"My C# application\";\n\n// The event\
    \ log to write to.\nstring log = \"Application\";\n\n// The message you want to\
    \ write.\nstring message = \"An error with code ex1032 has occurred...\";\n\n\
    // Check to see if the event source exists, and if not, create it.\nif (!EventLog.SourceExists(source))\n\
    {\n    EventLog.CreateEventSource(source, log);\n}\n\n// Write the message to\
    \ the event log.\nEventLog.WriteEntry(source, message, EventLogType.Error);\n\
    ```\n\n+   Don't display detailed exception messages to the user because a malicious\
    \ user could use detailed information to cause your application to malfunction,\
    \ or even gain access to protected information. A common mistake that is made\
    \ in data access layers is to provide detailed error information resulting from\
    \ an incorrect database query. This can enable a malicious user to understand\
    \ the underlying logic in your application and use knowledge of it to attack your\
    \ system.\n\n+   Effective exception handling should enable your application to\
    \ recover from exceptions, and enable the user to continue using your application.\
    \ In the event of an exception, the user should not lose data, and your application\
