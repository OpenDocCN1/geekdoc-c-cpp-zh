  md: '# Lab Scenario


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_559_0.png)


    Fabrikam, Inc. produces a range of highly sensitive measuring devices that can
    repeatedly measure objects and capture data. These devices can be used to detect
    minuscule changes in objects over time. A measuring device monitors and measures
    one specific aspect of an object, such as its mass, its size in a given dimension
    (height, width, or length), or its distance from the measuring device. The data
    can be captured in metric or imperial units, and the device can convert the data
    that it has captured between the metric and imperial scales.


    You have been asked to implement the software to drive these measuring devices.


    # Exercise 1: Defining an Interface


    In this exercise, you will define an interface called IMeasuringDevice with the
    following public methods:


    +   * MetricValue. This method will return a decimal that represents the metric
    value of the most recent measurement that was captured.

    * ImperialValue. This method will return a decimal that represents the imperial
    value of the most recent measurement that was captured.'
  merge: -1
  pgno: 559
- img_proc: true
  md: '+   * StartCollecting: This method will start the device running. It will begin
    collecting measurements and record them.


    +   * StopCollecting: This method will stop the device. It will cease collecting
    measurements.


    +   * GetRawData: This method will retrieve a copy of all of the recent data that
    the measuring device has captured. The data will be returned as an array of integer
    values.


    The main tasks for this exercise are as follows:


    +   1. Open the starter project.


    +   2. Create the IMeasuringDevice interface.


    #  Task 1: Open the starter project


    +   1. Log on to the 10266A-GEN-DEV machine as Student with the password PaSwOrd.


    +   2. Open Visual Studio 2010.


    +   3. Import the code snippets from the E:\Labfiles\Lab 8\Snippets folder


    +   4. Open the Module8 solution in the E:\Labfiles\Lab 8\Ex1\Starter folder.


    #  Task 2: Create the IMeasuringDevice interface


    +   1. Open the IMeasuringDevice code file.


    +   2. In the IMeasuringDevice namespace, declare the IMeasuringDevice interface.
    The IMeasuringDevice interface must be accessible to code in other assemblies.


    +   3. Add a named method MetricValue that returns a decimal value to the interface.
    The method should take no parameters. Add a comment that describes the purpose
    of the method.


    +   4. Add a named method ImperialValue that returns a decimal value to the interface.
    The method should take no parameters. Add a comment that describes the purpose
    of the method.


    +   5. Add a named method StartCollecting with no return type to the interface.
    This method should take no parameters. Add a comment that describes the purpose
    of the method.'
  merge: -1
  pgno: 560
- img_proc: true
  md: '6. Add a method named StopCollecting with no return type to the interface.
    This method should take parameters. Add a comment that describes the purpose of
    the method.


    7. Add a method named GetRawData that returns an integer array return type to
    the interface. This method should take no parameters. Add a comment that describes
    the purpose of the method.


    8. Build the solution and correct any errors.


    # Exercise 2: Implementing an Interface


    In this exercise, you will define the following enumeration:


    +   - Units: Metric, Imperial


    You will then define a class called MeasureLengthDevice that implements the IMeasuringDevice
    interface and drives a device that measures the length of an object. This class
    will also include the following private fields:


    +   - unitsToUse: Units


    +   - dataCaptured: integer array


    +   - mostRecentMeasure: integer


    When the device starts (when the StartCollecting method is called), the device
    will capture data and store it in the dataCaptured array (you will simulate this
    in the lab by using the code that is provided). This array has a finite, fixed
    size; when the device is full, it will wrap around and overwrite the oldest data.
    Each time that it takes a new measurement, the device copies this measurement
    to the mostRecentMeasure field. The GetRawData method will return the contents
    of the array. The MetricValue and ImperialValue methods will return the value
    in this field, converted to the units that are specified in the unitsToUse field.
    If unitsToUse is Metric, MetricValue simply returns the data and ImperialValue
    performs a calculation to convert the data to imperial units. Similarly, if unitsToUse
    is Imperial, ImperialValue simply returns the data and MetricValue performs a
    calculation to convert the data to metric units.


    The main tasks for this exercise are as follows:


    +   - Open the starter project.'
