- img_proc: true
  md: '# # What Is an Assembly?


    | Building blocks of .NET Framework applications |

    | Collection of types and resources that form a logical unit of functionality
    |


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_14_0.png)


    # ## Key Points


    When you compile a Visual C# application using Visual Studio 2010, the compiler
    generates an executable file that the CLR can run. This file is called an assembly.
    An assembly contains code in the intermediate format called Microsoft intermediate
    language (MSIL). All compilers for the .NET Framework generate code in this format,
    regardless of the programming language that was used to write an application.
    This enables the CLR to run code in the same way, regardless of the language that
    the developer used.


    Assemblies are the building blocks of .NET Framework applications; they form the
    fundamental unit of deployment, version control, reuse, and security.


    You can think of an assembly as a collection of types and resources that work
    together and form a logical unit of functionality. An assembly provides the CLR
    with the information that it needs to be aware of type implementations.


    An assembly can be of two types: an executable program, or a library that contains
    executable code that other programs can reuse. By using a library, developers
    can modularize the development of their applications into logical components.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Typically, when you are distributing assemblies to customers as part of your
    application, you will want to ensure that the assembly contains versioning information,
    and that the assembly is signed.


    Versioning your assemblies is important because ultimately, any applications that
    you build have multiple releases. Versioning information can help you identify
    which versions customers already have and enable you to perform the necessary
    steps to upgrade the application. Similarly versioning information can also help
    when documenting and fixing bugs.


    Signing your assemblies is equally important because it ensures that your assembly
    cannot easily be modified or replaced by an alternative implementation from a
    malicious source, and because it gives the assembly a strong name.


    Information such as the assembly version and security identity is stored as metadata
    in an assembly manifest. The manifest also contains metadata that describes the
    scope of the assembly, and any references to classes and resources. The manifest
    is typically stored in a portable executable (PE) file.


    # Assembly Versioning


    Assembly version information is stored in the assembly manifest and is used with
    the assembly name and culture to derive the assembly’s identity. An assembly version
    number consists of the following:


    +   * Major version number

    * Minor version number

    * Build number

    * Revision number


    # Assembly Signing


    Assembly signing is an important step that developers should include in their
    build process because it provides the following benefits:


    +   * It protects assemblies from modification.

    * It enables you to include the signed assembly in the Global Assembly Cache (GAC),
    so you can share the assembly with multiple applications.

    * It guarantees that the name of the assembly is unique.

    * To sign your assembly, you can use the Sign Tool that is provided with the .NET
    Framework, or you can use the assembly-signing functionality in Visual Studio
    2010.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Question: Why would you choose to distribute an assembly rather than distribute
