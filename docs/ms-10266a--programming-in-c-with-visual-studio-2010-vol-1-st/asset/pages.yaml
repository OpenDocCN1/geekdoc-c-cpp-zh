  md: "# What Is the Dispose Pattern?\n\n```\nclass LogFileWriter : IDisposable\n\
    {\n    private bool isDisposed = false;\n\n    LogFileWriter()\n{\n        Dispose(false);\n\
    \    }\n\n    public void Dispose()\n    {\n        Dispose(true);\n        GC.Finalize(this);\n\
    \    }\n\n    protected virtual void Dispose(bool isDisposed)\n    {\n       \
    \ if (!isDisposed)\n        {\n            if (isDisposed)\n            {\n  \
    \              // clean up managed resources\n            }\n            isDisposed\
    \ = true;\n            base.Dispose(isDisposed);\n        }\n    }\n}\n```\n\n\
    Implement the IDisposable interface\n\nTrack the object status\n\nAdd a public\
    \ Dispose method that disposes of resources and suppresses subsequent finalization\n\
    \nAdd a virtual Dispose method that takes a boolean indicating whether the object\
    \ is currently disposing (or if false, finalizing)\n\n# Key Points\n\nThe pattern\
    \ is a design pattern that frees resources used by an object. The .NET Framework\
    \ provides the IDisposable interface, and objects that implement this interface\
    \ should follow the dispose pattern.\n\n# The IDisposable Interface\n\nThe IDisposable\
    \ interface defines a single method called Dispose, which takes no parameters.\
    \ The Dispose method should release all of the unmanaged resources an object owns.\
    \ It should also release resources owned by its base types by calling the Dispose\
    \ method of the parent type.\n\nC# includes constructs that ensure that resources\
    \ are released in a timely fashion for classes that implement the IDisposable\
    \ interface.\n\nMany of the classes in the .NET Framework wrap unmanaged resources,\
    \ as as the TextWriter, implement the IDisposable interface. You should also implement\
    \ the IDisposable interface when you create your own classes that reference unmanaged\
    \ types."
  merge: -1
  pgno: 603
- img_proc: true
  md: "# Tracking Object Disposal\n\nCalling the Dispose method does not destroy an\
    \ object, and an object remains in existence when the Dispose method completes;\
    \ the object is destroyed only after the final reference to it is removed and\
    \ the garbage collector reclaims any resources it is using. Therefore, when you\
    \ implement the Dispose pattern in a class, you should track the disposal status\
    \ of the object and check whether the method has already been invoked and the\
    \ resources released. A common technique is to add an Disposed Boolean field to\
    \ your class, set it in the Dispose method, and check it in every other method\
    \ in your class. If methods in your class are called after disposal, this is normally\
    \ a mistake, and you should throw an ObjectDisposedException.\n\nThe exception\
    \ to this rule is the Dispose method itself. You should be able to run the Dispose\
    \ method multiple times without throwing anything or resulting in an inconsistent\
    \ state. Your Dispose method should include logic to check the state of resources\
    \ that are about to be released before it releases them. The following code example\
    \ shows an example of a class that incorporates a TextWriter object, and implements\
    \ the IDisposable interface which uses the Dispose method to ensure that the TextWriter\
    \ object is closed correctly and the underlying file resources are reclaimed.\n\
    \n```\nclass LogFileWriter : IDisposable\n{\n    private bool isDisposed = false;\n\
    \    private TextWriter writer = ...;\n    ...\n\n    public void WriteDataToFile(...)\n\
    \    {\n        // Check that the current object has not been disposed of\n  \
    \      if (isDisposed)\n            throw new ObjectDisposedException(...);\n\
    \    }\n\n    public void Dispose()\n    {\n        if (!isDisposed)\n       \
    \ {\n            // Only close the TextWriter if it is not null\n            //\
    \ (in which case it has already been disposed)\n            if (writer != null)\n\
    \            {\n                writer.Flush();\n            }\n        }\n  \
    \  }\n```"
  merge: -1
  pgno: 604
- img_proc: true
  md: "```\nwriter.Close();\nwriter = null;\n\n// Indicate that the object has been\
    \ disposed of and\n// resources have been released\n```\n\n```\nisDisposed = true;\n\
    } \n```\n\n# Calling Dispose from a Destructor\n\nIf you must guarantee that the\
    \ Dispose method is always invoked, you can include it as part of the finalization\
    \ process performed by the garbage collector. To do this, you can add a destructor\
    \ to your class and call the Dispose method. However, remember that finalization\
    \ is a potentially expensive process, so you should implement this strategy only\
    \ if you really must.\n\n# Disposing of Managed Resources Early\n\nIn some cases,\
    \ you may want to dispose of managed resources in addition to unmanaged resources.\
    \ This is typically if a managed resource is no longer required and is expensive\
    \ to maintain, such as a large array. The garbage collector will reclaim this\
    \ memory eventually when your object is destroyed, but you may be able to free\
    \ the memory used by this array early by setting the reference to it to null in\
    \ the Dispose method. Note that this strategy does not guarantee that the memory\
    \ used by the array will be collected, only that it may be. Timing depends on\
    \ the garbage collector.\n\nIf you invoke the Dispose method from a destructor,\
    \ in addition to allowing an application to invoke the Dispose method manually,\
    \ there is little point in trying to dispose of the managed resources more than\
    \ once. In this case, the recommended approach is to overload the Dispose method\
    \ and provide an implementation that sets a Boolean flag indicates whether the\
    \ Dispose method was called as part of the finalization process or directly by\
    \ application code. The convention is to pass the value true if the Dispose method\
    \ is called by an application and false if it is called by a destructor. The overloaded\
    \ Dispose should only dispose of managed resources if it was called directly (the\
    \ parameter is true). When it is false, the managed resources will either already\
    \ been disposed of or will be to be disposed of by the garbage collector anyway.\
    \ In this case, the Dispose method should only attempt to release unmanaged resources.\
    \ The public Dispose method, which takes no parameters and is defined as part\
    \ of the IDisposable interface, can then simply call Dispose(true), and the destructor\
    \ can call Dispose(false)."
  merge: -1
