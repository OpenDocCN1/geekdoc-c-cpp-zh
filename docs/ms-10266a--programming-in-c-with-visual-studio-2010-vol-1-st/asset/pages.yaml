  md: '4-26 Programming in C# with Microsoft® Visual Studio® 2010


    | Exception type | Description |

    | --- | --- |

    | ArgumentException | You can throw this exception if the caller specifies an
    argument to a method that does not conform to the requirements of the method.
    You can use this exception type to indicate generalized errors with arguments,
    or you can use the **ArgumentOutOfRangeException** and **ArgumentNullException**
    types to indicate more specific errors (for example, if you pass the value 100
    to a method, and the method expects a value between 1 and 99, or if you pass the
    value *null* as an argument). |

    | FormatException | You can throw this exception if the caller specified an argument
    that contains data that does not have the required format. For example, if the
    caller passes a string argument that does not contain information in the format
    that the method expects, the method should throw a **FormatException**. |

    | NotImplementedException | You can throw this exception to indicate that you
    have not yet implemented the code in a method. This exception is primarily useful
    while you are developing code when you have defined the method, but have not written
    the code for the body of the method. |

    | NotSupportedException | You can throw this exception if a caller attempts to
    perform an unsupported operation by using your method, such as specifying arguments
    that indicate the caller wants to write to a read-only file. |

    | FileNotFoundException DirectoryNotFoundException | You can throw these exceptions
    in methods that attempt to open files on behalf of a caller. If the name of the
    file that is indicated by arguments that the caller specifies reference a file
    that does not exist, or if the file is in a folder or drive that does not exist.
    |'
