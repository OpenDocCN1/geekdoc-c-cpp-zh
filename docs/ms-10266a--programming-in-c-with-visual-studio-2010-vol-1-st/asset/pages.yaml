  md: "# class Sales\n\n```\nclass Sales {\n    private double monthlyProfit;\n  \
    \  public void SetMonthlyProfit(double monthlyProfit) {\n        this.monthlyProfit\
    \ = monthlyProfit;\n    }\n    public double GetAnnualProfitForecast() {\n   \
    \     return (this.monthlyProfit * 12);\n    }\n}\n```\n\nAlternatively, static\
    \ fields do not belong to an instance of a type; they belong to the type itself.\
    \ Memory is allocated independently of any instance, and all references to a static\
    \ field refer to the same piece of memory. You do not need to create an instance\
    \ of type to access a static member of that type. The member is created and the\
    \ memory is allocated the first time you refer to it.\n\n# Using Static Fields\n\
    \nTo create a static field, you must use the static modifier in the declaration\
    \ of that field. The following code example shows how to declare a static field\
    \ called salesTaxPercentage and assign the field value 20.\n\n```\nclass Sales\
    \ {\n    public static double salesTaxPercentage = 20;\n}\n```\n\nYou can initialize\
    \ a static field in the declaration, the preceding code example shows, or if the\
    \ field is public, you can access the field from any type. You do not need to\
    \ create an instance of the Sales to access the salesTaxPercentage because the\
    \ field is static. Instead, you access the field directly on the Sales type by\
    \ specifying the type name, followed by a period, followed directly by the field\
    \ name, as the following code example shows.\n\nSales.salesTaxPercentage = 32;\n\
    \nNote: You can also initialize static fields from a constructor, which is covered\
    \ in a later topic in this module."
