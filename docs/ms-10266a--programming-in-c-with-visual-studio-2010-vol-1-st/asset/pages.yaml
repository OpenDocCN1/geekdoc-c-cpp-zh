- img_proc: true
  md: "Note: Only use method overloading to provide different methods that do semantically\
    \ the same thing.\n\n# Defining Overloaded Methods\n\nOverloaded methods have\
    \ the same name as each other, to emphasize their common intent. However, each\
    \ overloaded method must have a unique signature, to differentiate it from the\
    \ other overloaded versions of the method in the class.\n\nThe signature of a\
    \ method contains its name and its parameter list; the return type is not part\
    \ of the signature. Therefore, you cannot define overloaded methods that differ\
    \ only in their return type.\n\nThe following code example shows how to define\
    \ three overloaded Deposit methods in a class called BankAccount:\n\n+   - The\
    \ first Deposit method takes a parameter that represents the amount to deposit\
    \ as a fractional number.\n- The second Deposit method takes a parameter that\
    \ represents the amount to deposit as a string.\n- The third Deposit method takes\
    \ two parameters that represent the amount to deposit as dollars and cents.\n\n\
    ```\npublic class BankAccount{\n    private decimal _balance;\n\n    public void\
    \ Deposit(decimal amount)\n    {\n        _balance += amount;\n    }\n\n    public\
    \ void Deposit(string amount)\n    {\n        _balance += decimal.Parse(amount);\n\
    \    }\n\n    public void Deposit(int dollars, int cents)\n    {\n        _balance\
    \ += dollars + (cents / 100.0m);\n    }\n}\n```\n\nWhen you call the Deposit method,\
