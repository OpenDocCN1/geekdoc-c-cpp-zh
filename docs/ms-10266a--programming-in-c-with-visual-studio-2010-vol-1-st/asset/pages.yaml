    Every object that you create has a life cycle, from creation to destruction. When
    an object is destroyed, its state must be cleaned, and any managed resources used
    must be reclaimed. In the .NET Framework, the garbage collector performs these
    tasks.


    This lesson introduces garbage collection in the .NET Framework.


