  md: '# What Are Enumerations?


    | An enumeration type specifies a set of named constants |

    | Days |

    | --- |

    | Monday |

    | Tuesday |

    | Wednesday |

    | ... ||


    Benefits include:


    Code is easier to maintain because you assign only expected values to your variables


    Code is easier to read because you assign easily identifiable names to your values


    Code is easier to write because IntelliSense displays a list of the possible values
    that you can use


    # Key Points


    An enumeration type specifies a set of related, named constants. An enumeration
    type is a scalar type that has a user-defined range of values. You can create
    an enumeration type, declare variables of that type, and assign values to those
    variables in the same way that you can use the built-in scalar types of C#, such
    as int or float. You can use an enumeration type to represent a set of values
    in a specific domain. Enumerations also help to make your code easier to read
    and maintain.


    The .NET Framework base library contains various enumerations that you can use
    in your applications. Many of the .NET Framework classes use these enumerations
    as return value and method parameters.


    You may have used enumerations in other languages, such as Java and C++; however,
    there are a few subtle differences. The difference is that enumerations in Microsoft
    Visual C# are based on the integral data types (such as int and long), whereas
    enumerations in Java derive from objects, which means that each enumeration can
    contain its own modifiable fields. The implementation of enumerations in Visual
    C# and C++ is very similar.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Benefits


    Enumerations provide all of the advantages that constants provide and the following
    additional benefits:


    +   - Code is easier to maintain because you assign only anticipated values to
    your variables.


    +   - Code is easier to read because you assign easily identifiable names to your
    values.


    +   - Code is easier to type because Microsoft IntelliSense® displays a list of
    the possible values that you can use.


    +   - Code is well formed because you can specify a set of constant values and
    define a type that will accept values from only that set.


    **Question:** Discuss with other students and the instructor where and how you
    have used enumerations before.'
