  md: '# What Are Operators?


    Operators are character sequences that you use to define operations that are to
    be performed on operands


    | Arithmetic +, -, *, / | Assignment =, +=, -=, *, /= |

    |--- |--- |

    | Increment, decrement ++, -- | Bit shift <<, >> |

    | Comparison ==, !=, <, <=, >=, is | Type information typeof |

    | String concatenation + | Delegate concatenation +- |

    | Logical/bitwise, |, ^ ~, &, || | Overflow checked, unchecked |

    | Indexing [ ] | Indirection, Address *, ->, [ ], & ] |

    | Casting ( ), as | Conditional (ternary operator) ?: |


    # Key Points


    Operators combine operands together into expressions. C# provides a wide range
    of operators that you can use to perform fundamental mathematical and logical
    operations.


    # Operator Types


    Operators fall into the following three categories:


    +   - Un. This type of operator operates on a single operand. For example, you
    can use the - operator as a unary operator. To do this, you place it immediately
    before a numeric operand, and it converts the value of the operand to its current
    value multiplied by -1.


    +   - Binary. This type of operator operates on two values. This is the most common
    type of operator, for example, \*, which multiplies the value of two operands.


    +   - Ternary. There is only one ternary operator in C#. This is the ? : operator
    and it is used in conditional expressions.'
