    \    {\n        // Code that implements the DoWork method.\n    }\n}\n```\n\n\
    The following rules and guidelines apply when you define partial methods.\n\n\
    +   - All partial methods must be void and cannot return a value.\n\n+   - All\
    \ partial methods are implicitly private. You cannot access a partial method from\
    \ outside the class that it is defined in.\n\n+   - All partial method declarations\
    \ must be prefixed with the partial keyword.\n\n+   - Partial methods can have\
    \ ref parameters but not out parameters. Ref parameters are covered later in this\
