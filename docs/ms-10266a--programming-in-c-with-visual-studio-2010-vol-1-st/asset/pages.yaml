    the number of bedrooms that the residence has, and whether the residence has a
    garage.


    +   - The third constructor takes four parameters and sets the type of residence,
    the number of bedrooms that the residence has, whether the the residence has a
    garage, and whether the residence has a garden.


    **Note:** Notice how the code example uses the **this** keyword to distinguish
    between fields and parameters with the same name.'
