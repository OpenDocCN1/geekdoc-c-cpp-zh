  md: "Inheriting from Classes and Implementing Interfaces\n\n8-5\n\n# # What Is Inheritance?\n\
    \n+   Inheritance enables you to define new types based on existing types:\n*\
    \ For example, **Manager** and **ManualWorker** classes might inherit from an\
    \ own **Employee** class\n* Fields and methods in the **Employee** class are inherited\
    \ by **Manager** and **ManualWorker**\n* **Manager** and **ManualWorker** can\
    \ define their own fields and behavior\n* Define accessible members as protected\
    \ in the base class\n\n```\n// Base class\nclass Employee {\n    protected string\
    \ empnum;\n    protected string empname;\n    protected void doWork()\n}\n\n//\
    \ Inheriting classes\nclass Manager : Employee {\n    public void doWork()\n}\n\
    \nclass ManualWorker : Employee {\n    public void doWork()\n}\n```\n\nC# supports\
    \ single inheritance\n\n![](img/a8fed13e9f86d03aa521a7ff9d50e902_506_0.png)\n\n\
    # # Key Points\n\nInheritance is a key concept in the world of object orientation.\
    \ You can use inheritance as a tool to avoid repetition when you are defining\
    \ different classes that have several features in common and related to each other.\
    \ Perhaps they have different subclasses of the same type, each with its own distinguishing\
    \ feature—for example, managers and manual workers are all employees of a factory.\
    \ If you were writing an application to simulate the factory, how would you specify\
    \ that managers and manual workers have several features that are the same, but\
    \ also other features that are different? For example, they all have an employee\
    \ reference number and a name, but managers have different responsibilities and\
    \ perform different tasks from manual workers.\n\nAs a solution, you might develop\
    \ a class to represent an employee. This class includes fields to hold information\
    \ that is common to all employees, such as the employee reference number and name.\
    \ You can then develop a class to represent a manager and another class to represent\
    \ a manual worker. Both the manager class and the manual worker class would also\
    \ need to store the employee reference number and name. Rather than adding duplicate\
    \ fields to each of these classes, you can simply specify that both of these classes\
    \ inherit from the employee class, which"
  merge: -1
  pgno: 506
- img_proc: true
  md: "already has fields to store these values. In addition, there might be some\
    \ behavior that is common to managers and manual workers. You can implement this\
    \ behavior as a method in the employee class. The manager and manual worker classes\
    \ can inherit this behavior. Using inheritance in this way reduces the need for\
    \ code duplication, which reduces both development time and the risk of bugs introduced.\
    \ You can add additional, specific fields and methods to the manager and manual\
    \ worker classes to model the different data and behaviors of these types.\n\n\
    # Defining an Inherited Class\n\nYou specify that a class inherits from another\
    \ class (called a base class) by using a colon and providing the name of the base\
    \ class. Remember that all of the members in the base class are private by default.\
    \ This means that they cannot be accessed by code in other classes, including\
    \ classes that inherit from the base class. You can make the members of a base\
    \ class visible to inheriting classes, but keep them hidden from other classes\
    \ that are not part of the inheritance hierarchy by using the protected keyword,\
