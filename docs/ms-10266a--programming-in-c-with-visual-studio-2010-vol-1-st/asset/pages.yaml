  md: '# What Are Data Types?


    C# is type-safe language

    The compiler guarantees that values stored in variables are always of the appropriate
    type


    Data types include:


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_113_0.png)


    ### Key Points

    A variable holds data that has a specified type. When you declare a variable to
    store data in an application, you need to choose an appropriate data type for
    that data. C# is a type-safe language, which means that the compiler guarantees
    that values that are stored in variables are always of the appropriate type.


    # Commonly Used Data Types


    The following table shows the commonly used data types in C#, and their characteristics.


    | Type | Description | Size (bytes) | Range |

    |---|---|---|--|

    | int | Whole numbers | 4 | -2,147,483,648 to 2,147,483,647 |

    | long | Whole numbers (bigger range) | 8 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807
    |'
