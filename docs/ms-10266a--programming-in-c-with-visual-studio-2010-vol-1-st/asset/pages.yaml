  md: "# Try/Catch Example\n\nThe following code example shows an example of a try/catch\
    \ block used for file access.\n\n```\nStreamReader reader = null;\ntry{\n    string\
    \ fileName = GetFileName();\n    reader = new StreamReader(fileName);\n    string\
    \ savedData = reader.ReadToEnd();\n}\ncatch (IOException ioex) {\n    // Handle\
    \ the IO exception.\n}\ncatch (Exception ex) {\n    // Handle all other types\
    \ of exceptions.\n}\n```\n\nIn this code example, the try block contains code\
    \ that attempts to read data from a file. If an exception of type IOException\
    \ is thrown, the catch block is executed. If any other type of exception is thrown,\
    \ the generic catch block is executed.\n\n**Question:** How would you use the\
    \ try/catch block to catch all exceptions regardless of type, and then execute\
    \ some generic additional logic?\n\n# Additional Reading\n\nFor more information\
