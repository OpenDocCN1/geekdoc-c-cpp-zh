    # Implicitly Typed Arrays


    Similar to implicitly typed variables where you declare a `var` type, and the
    compiler infers the type from the initializer, you can have implicitly typed arrays.
    The type is inferred from the type of elements that are specified in the initializer.
    The elements that are specified must all be of the same type, otherwise the compiler
    will display an error. The following code example shows how to create an implicitly
    typed array.


