  md: '# What Is a Method?


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_212_0.png)


    # Key Points


    Methods define the behavior of a type. A method contains a block of code that
    defines an action that a type can perform. All code belongs to a method; you cannot
    write a C# program that does not contain at least one method.


    The ability to define and call methods is a fundamental component of object-oriented
    programming because methods enable you to encapsulate operations that protect
    data that is stored inside a type.


    Typically, any application that you develop using the Microsoft .NET Framework
    and Microsoft Visual C# will have many methods, each with a specific purpose.
    Some methods are fundamental to the operation of an application. For example,
    all C# applications must have a method called Main defines the entry point for
    the application; when the user runs a C# application, the common language runtime
    (CLR) executes the Main method for that application.


    Methods can be designed for internal use by a type, and as such are hidden from
    other types. Other methods may be designed to enable other types to request that
    an object performs an action, and are exposed to the outside world.'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'C# supports two classes of methods:


    +   * Instance methods. These methods execute in the context of a specific object,
    and can directly access data that belongs to the object. For example, the ToString
    method that was described in Module 2 is an instance method. You invoke instance
    methods by specifying the object that they belong to.

    * Static methods. These methods are associated with a type rather than a specific
    object. Examples of static methods include those that belong to the Convert class
    that was described in Module 2, such as Convert.ToInt32. You invoke these methods
    by specifying a type rather than an object.


    > Note: Module 7 describes the differences between instance and static methods
    in detail.


    Question: Why do you need to use methods when developing a .NET Framework application
    with C#?'
