    # Scenario


    Some of the data that is collected by devices by Fabrikam, Inc. must be

    encrypted for security purposes. Encryption algorithms often make use of prime

    A part of an algorithm that generates prime numbers needs to calculate

    the GCD of two numbers.


    The GCD of two numbers is the largest number that can exactly divide into the

    numbers. For example, the GCD of 15 and 12 is 3. Three is the largest whole

    number that divides exactly into 15 and 12.


    The process for finding the GCD of 2806 and 345 using Euclid''s algorithm is as

    f.


    +   Keep 345 away from 2806 until less than 345 is left and store the

    remainder.

    In this case, 2806 = (8 × 345) + 46, so the remainder is 46.

    Keep the remainder (46) away from 345 until less than 46 is left, and

    store the remainder.

    345 = (7 × 46) + 23, so the remainder is 23.

    Keep 23 away from 46 until less than 23 is left, and store the remainder.

    46 = (2 × 23) + 0


    The remainder is 0, so the GCD of 2806 and 345 was the value of the

    previously stored remainder, which was 23 in this case.


