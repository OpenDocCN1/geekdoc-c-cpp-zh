  md: '# What Are Classes and Namespaces?


    | A class is essentially a blueprint that defines the characteristics of an entity
    |

    | A namespace represents a logical collection of classes |


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_39_0.png)


    # ### Key Points


    Visual C# is an object-oriented language that uses classes and namespaces to modularize
    .NET Framework applications into logical components.


    A class is essentially a blueprint that defines the characteristics of an entity,
    and includes properties that define the types of data that the object can contain
    and methods that define the behavior of the object. A namespace represents a logical
    collection of classes. Classes are stored in assemblies, and a namespace is simply
    a device to disambiguate classes that might have the same name in different assemblies.


    For example, the System.IO namespace includes the following classes that enable
    you to manipulate the Windows file system. However, you could create classes with
    the same name under your own namespace:


    +   * File

    * FileInfo

    * Directory'
  merge: -1
  pgno: 39
- img_proc: true
  md: '+   * DirectoryInfo

    * Path


    To use a class that is defined in the .NET Framework, perform the following tasks:

    1. Add a reference to the assembly that contains the compiled code for the class.

    2. Bring the namespace that contains the class into scope.


    If you are writing a .NET Framework application to write text to a new file on
    the file system, you can bring the System.IO namespace into scope and then use
    the WriteAllText method of the File class.


    To bring a namespace into scope in a Visual C# application, you can use the using
    statement. The following code example shows how to bring the System.IO, and System.Collections
    namespaces into scope.


    ```

    using System;

    using System.IO;

    using System.Collections;

    ```


    The using statement is simply a convenience and you can manage without it. For
    example, you can use System Console rather than Console.


    Question: In your console application, you want to use the Console class, which
    is part of the System namespace. How do you bring the System namespace into scope?'
  merge: -1
  pgno: 40
