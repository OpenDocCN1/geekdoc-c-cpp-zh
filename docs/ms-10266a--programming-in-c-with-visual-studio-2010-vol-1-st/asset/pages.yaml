  md: '# .NET Framework Inheritance Hierarchy


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_509_0.png)


    # Key Points


    In the .NET Framework, all types inherit either directly or indirectly from the
    Object class in the System namespace. The Object class provides functionality
    that is useful to all types, such as the ToString and Equals methods. When you
    create a new reference type such as a class, it inherits directly from the Object
    class and you do not need to specify this relationship as part of the class definition.
    When you inherit from another class, such as Employee, you automatically inherit
    all of the functionality of the Object class, too.


    Value types such as structs inherit from the System.Value class, which in turn
    inherits from the Object class. Enum types inherit from the System.Enum class,
    which inherits from ValueType. However, unlike classes, this hierarchy is fixed
    and you cannot define your own custom inheritance with value types; for example,
    you cannot explicitly specify that a struct inherits from another struct.


    Question: What types inherit from the Object class?'
