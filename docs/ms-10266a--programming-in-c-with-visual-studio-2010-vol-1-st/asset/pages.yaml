  md: "# Using a Finally Block\n\n> Enables you to release resources and specify code\
    \ that will always run, whether an exception occurs or not\n\n```\ntry {\n   \
    \ OpenFile(\"MyFile\"); // Open a file\n    WriteToFile(..); // Write some data\
    \ to the file\n}\ncatch (IOException ex)\n{\n    MessageBox.Show(ex.Message);\n\
    }\nfinally {\n    CloseFile(\"MyFile\"); // Close the file\n}\n```\n\n![](img/a8fed13e9f86d03aa521a7ff9d50e902_288_0.png)\n\
    \n# Key Points\n\nSome methods may contain critical code that must always be run,\
    \ even if an unhandled exception occurs. For example, a method may need to ensure\
    \ that it closes a file that it was writing to, or releases some other resources\
    \ before it terminates. A **finally** block enables you to handle this situation.\n\
    \nYou specify a **finally** block after any **catch** handlers in a **try/catch**\
    \ block. It specifies code that must be performed when the block finishes, irrespective\
    \ of whether exceptions occurs, handled or unhandled, have occurred. (If an exception\
    \ is caught and handled, the exception handler in the **catch** block will run\
    \ first, before the **finally** block.)\n\nYou can also add a **finally** block\
    \ to code that has no **catch** blocks. In this case, all exceptions are unhandled,\
    \ but the **finally** block will always run.\n\n# Finally Block Syntax\n\nThe\
    \ syntax for using a **finally** block is shown in the following code example."
  merge: -1
  pgno: 288
- img_proc: true
  md: "```\ntry\n{\n  // Try block.\n}\ncatch ([catch specification 1])\n{\n  // Catch\
    \ block 1.\n}\ncatch ([catch specification n])\n{\n  // Catch block n.\n}\nfinally\n\
    {\n  // Finally block.\n}\n```\n\n# Flow of Control for Try/Catch/Finally\n\n\
    When you use finally blocks, the flow of control is more complicated than in try/catch\
    \ blocks. The flow of control is as follows:\n\n+   1. The try block runs.\n\n\
    +   2. If an exception is thrown:\n    * If there is a matching catch block for\
    \ the exception:\n      i. The catch block that matches the exception is executed.\n\
    \      ii. The finally block executes.\n    * If there is a matching catch block\
    \ for the exception, and this catch block itself causes an exception:\n      i.\
    \ The catch block that matches the original exception is executed.\n      ii.\
    \ The finally block executes.\n      iii. The exception caused by the catch handler\
    \ is propagated to any enclosing try/catch block, or to the calling method if\
    \ there is no enclosing try/catch block.\n    * If there is no matching catch\
    \ block for the exception:\n      i. The finally block executes."
  merge: -1
  pgno: 289
- img_proc: true
  md: "ii. The exception is propagated to any enclosing try/catch block, or the calling\
    \ method if there is no enclosing try/catch block.\n\n3. If no exception is thrown,\
    \ the finally block executes.\n\nThe important thing here is that the finally\
    \ block is always executed. This enables the code in a finally block to tidy up\
    \ after an exception before any other code deals with the exception.\n\n# Try/Catch/Finally\
    \ Example\n\nThe following code example shows how to implement a try/catch/finally\
    \ block.\n\n```\ntry {\n  OpenFile(\"MyFile\"); // Open a file\n  WriteToFile(...);\
    \ // Write some data to the file\n} catch (IOException) {\n  Console.WriteLine(ex.Message);\n\
    } finally {\n  CloseFile(\"MyFile\"); // Close the file\n}\n```\n\nThe code in\
    \ the try block calls methods that open a file and write some data to that file.\
    \ If an IOException exception occurs, the catch block displays the details of\
    \ the exception. The finally block calls the CloseFile method to close the file.\
    \ This code will always run and the file will always be closed, no matter what\
    \ exceptions occur.\n\n**Question:** Describe the differences between a catch\
    \ block and a finally block.\n\n# **Additional Reading**\n\nFor more information\
    \ about the finally block, see the try-finally (C# Reference) page at http://go.microsoft.com/fwlink/?LinkIdid=192913."
  merge: -1
