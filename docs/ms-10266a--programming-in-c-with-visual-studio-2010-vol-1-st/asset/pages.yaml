    The statements in the following code example are legal.


    ```

    Manager myManager = new Manager("Fred", "VP");

    Employee myEmployee = myManager;

    // legal, Employee is the base class of Manager

    ```


    This works because the inheritance hierarchy means that you can think of a Manager
    simply as a special type of Employee; it has everything that Employee has with
    a few extra bits you can define by any methods and fields that you add to the
    Manager class.


    You can also make an Employee variable refer to a ManualWorker object. There is
    one significant limitation, however—when you refer to a Manager or ManualWorker
    object by using an Employee variable, you can only access methods and fields that
    are defined by the Employee class. Any additional methods that the Manager or
    ManualWorker classes are not visible through the Employee class. This explains
    why you can assign almost anything to an Object variable. Remember that all classes
    inherit from System.Object directly or indirectly.


    # Converting Object References


    Although you can assign a Manager to an Employee variable, the converse is not
    true; you cannot unversely assign an Employee object to a Manager variable. This
    is not because all Employee objects are Managers; some might be ManualWorker objects.
    However, you can assign an Employee object to a Manager variable as long as you
    check that the Employee is really a Manager first, by using the as or is operators,
    or by using a cast.


    The as operator checks that an object is a reference to a specified type. If it
    is, it returns a new reference by using this type, otherwise it returns null.


