  md: '# Debugging in Visual Studio 2010


    ![](img/a8fed13e9f86d03aa521a7ff9d50e902_72_0.png)


    # Key Points


    Debugging is an essential part of application development. You may notice errors
    as you write code, but some errors—especially logic errors—may only occur in specific
    circumstances that do not test for. Users may report these errors to you, and
    you will have to correct them.


    Visual Studio 2010 provides several tools to help you debug code. You might use
    these while you develop code, during a test phase, or after the application has
    been released. You may use the tools in the same way regardless of the circumstances.


    You can run an application with or without debugging enabled. When debugging is
    enabled, your application is said to be in Debug mode. To access the numerous
    debug functions, including the ability to step through code line by line, you
    can use the controls on the Debug menu, the controls on the Debug toolbar, and
    keyboard shortcuts.


    # Debug Controls


    The following table lists the main debug controls on the Debug menu and the Debug
    toolbar, and the corresponding keyboard shortcuts.'
  merge: -1
