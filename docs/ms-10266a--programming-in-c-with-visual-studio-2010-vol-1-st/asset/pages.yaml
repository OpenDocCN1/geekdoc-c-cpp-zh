  md: '# Lesson 1

    Controlling Visibility of Type Members


    +   * What Is Encapsulation?

    * Comparing Private and Public Members

    * Comparing Internal and Public Types


    Encapsulation is a fundamental object-oriented principle. Encapsulation is the
    ability to hide the private data and inner workings of a type so that it cannot
    be accessed by code that is defined in other types. A type can expose public members
    that define its behavior to the outside world, but it should keep the implementation
    of this behavior private. This feature isolates the way in which a type operates
    from the applications that it uses and can reduce the scope for any inadvertent
    dependencies that may otherwise occur.


    This lesson explains how to use access modifiers to control the visibility of
    types and members in types.


    # Objectives


    After completing this lesson, you will be able to:


    +   * Describe the purpose of encapsulation.

    * Describe the difference between creating public and private members.

    * Describe the difference between creating internal and public types.'
  merge: -1
  pgno: 463
- img_proc: true
  md: '# What Is Encapsulation?


    | Definition |

    | An essential object-oriented principle

    | Hides internal data and algorithms

    | Provides a well-defined public operation |


    | Benefits |

    | Makes external code simpler and more consistent

    | Enables you to change implementation details later |


    # Key Points


    All applications manipulate data. Many older legacy applications built by using
    programming languages that are not object-oriented, such as C and COBOL, typically
    separate the code that processes data from the code that manages and stores this
    data. Data management code was frequently provided in the form of code libraries,
    and the data-processing elements of an application were frequently built into
    the business logic of the application. Several applications that implement different
    parts of a business system might all use the same data that they access through
    a code library, but perform their own operations on data.


    However, in this scenario, if the format of the data changes, the code library
    that manages the data may also need to change. All of the applications that use
    the original code library may need to be refreshed to the new version, and the
    logic in these applications may also need to change to handle the new structure
    of the data. Such changes can be difficult to perform (or even locate), and any
    applications that are not updated correctly may exhibit bugs and generate errors.'
  merge: -1
  pgno: 464
