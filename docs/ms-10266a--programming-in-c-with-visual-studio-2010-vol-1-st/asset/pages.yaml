    \    FormatException(\"Argument has the wrong format\", e);\n}\n```\n\n# Key Points\n\
    \nYou can add your code to your own methods that detect fault conditions, and\
    \ then throw a corresponding exception to indicate the nature of the fault to\
    \ the caller. The calling code can catch and handle the exception, as described\
    \ in the previous lesson.\n\nThe .NET Framework provides a wide range of built-in\
    \ exception types, which all inherit from the Exception class. (You will learn\
    \ more about inheritance in C# in Module 8, \"Inheriting from Classes and Implementing\
    \ Interfaces.\") Each exception type is intended to indicate a specific classification\
    \ of exception. For example, the FileNotFoundException exception type indicates\
    \ that an attempt was made to open a file that does not exist, DivideByZeroException\
    \ is used to indicate an attempt to divide by zero in a mathematical expression.\
    \ There is nothing to stop you throwing any type of exception in a method, but\
    \ it is considered good practice to throw an exception of a type that is appropriate\
    \ to the fault condition that is detected. The following table lists some of the\
    \ more commonly used exception types."
