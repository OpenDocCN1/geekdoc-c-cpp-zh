  md: "# Programming in C# with Microsoft®-Visual Studio® 2010\n\nYou cannot access\
    \ static fields from an instance of the type, because static fields belong to\
    \ the type itself. If you try, you will get a compile error that explains that\
    \ the member cannot be accessed with an instance reference. For example, the following\
    \ code example will generate a compile error.\n\n```\nSales sales = new Sales();\n\
    sales.salesTaxPercentage = 23; // Compile error.\n...\nclass Sales {\n\tpublic\
    \ static double salesTaxPercentage;\n}\n```\n\nHowever, you can access static\
    \ fields from instance methods and constructors, which enables you to share data\
    \ with multiple instances of the same type. For example, the User class in the\
    \ following code example represents a user who accesses the Fabrikam, Inc. Web\
    \ site. Every time a user accesses the site, a new User object is created, and\
    \ the static usersOnline field is incremented. Other instances of the class can\
    \ access the data and increment it because the field is static; therefore, the\
    \ usersOnline field will represent the total number of users online at point in\
    \ time.\n\n```\nclass User {\n\tinternal static int usersOnline;\n\tinternal User()\
    \ {\n\t\tusersOnline++;\n\t}\n}\nUser a = new User();\nUser b = new User();\n\
    User c = new User();\nUser d = new User();\nint totalUsersOnline = User.usersOnline;\
    \ // Returns the value 4.\n```\n\nIf the usersOnline field was not static, data\
    \ would not be shared, and the usersOnline field would only ever reach the value\
    \ of 1, as the following code example shows."
