    < ct, 0 if cs == ct, or positive value if cs > ct. |

    | int | strncmp(cs,ct,n) | Compare at most n characters of string cs to string
    ct; 0 if cs == ct, or positive value if cs > ct. |

    | char * | strchr(cs,c) | Return pointer to first occurrence of c in cs or NULL
    if not present. |

    | char * | strrchr(cs,c) | Return pointer to last occurrence of c in cs or NULL
    if not present. |

    | size_t | strnlen(cs,ct) | Return length of prefix of cs consisting of characters
    in ct. |

    | size_t | strcsp(cs,ct) | Return length of prefix of cs consisting of characters
    not in ct. |

    | char * | strbrk(cs,ct) | Return pointer to first occurrence in string cs of
    any character of ct, or NULL if none present. |

    | char * | strstr(cs,ct) | Return pointer to first occurrence of string ct in
    cs, or NULL if not present. |

    | size_t | strlen(cs) | Return length of cs. |

