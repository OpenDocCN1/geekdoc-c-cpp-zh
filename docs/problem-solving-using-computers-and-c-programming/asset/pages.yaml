  md: "# Problem Solving Using Computers & 'C' Programming\n\n# fread() and fwrite()\
    \ functions:\n\nThese functions are used to read and write a block of data in\
    \ a file i.e. to handle binary files. The format of these functions as below:\n\
    \n```\n```\nread(buff, size, n, fp)\nfwrite(buff, size, n , fp)\n```\n```\n\n\
    where buff is the array or structure variable which is to be written or read size\
    \ is the number of bytes which the input or output data is expected to occupy\
    \ n is the number of items to read or write.\n\n# 14.4 Random Access to Files\
    \ [April 15, 18]\n\nWe have seen different functions in earlier sections which\
    \ are useful for reading and writing data from file sequentially. However, when\
    \ we need to access only a particular part of a file, C has provided special functions\
    \ to access the file randomly.\n\n+   * ftell function(): This function tells\
    \ the relative position of a file pointer. It returns the position of type long.\n\
    \  n=ftell(fp);\nwhere fp is the file pointer, n is relative offset in bytes of\
    \ the current position.\n* rewind(fp): This function reset the file pointer to\
    \ the beginning of the file.\n  rewind(fp);\n  n=ftell(fp);\n  Using the above\
    \ statement the variable n will get value 0. In the file the first byte is numbered\
    \ 0, second is 1, and so on.\n* fseek(): This function moves the file pointer\
    \ to the desired location in the file.\n  fseek(filepointer, offset, pos);\n\n\
    where offset is the long variable of specifies the number of position to be moved\
    \ from the location specified by pos. The parameter pos can take on of the following\
    \ values.\n\n| Constant Name Value Meaning |\n| SEEK_SET | 0 | Beginning of file\
    \ |\n| SEEK_CUR | 1 | Current Position |\n| SEEK_END | 2 | End of file |\n\nWe\
    \ can use either constant name or value as a third parameter in fseek().\nThe\
    \ function fseek() returns 0 on successful, returns -1 on failure."
