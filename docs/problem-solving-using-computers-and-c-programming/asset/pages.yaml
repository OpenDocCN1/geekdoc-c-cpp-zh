    # 3. Algorithm to find the sum of sequence


    S = a₁ + a₂ + a₃ + ... anₙ i.e. ∑ᵢ=1 wayⁿ aᵢ


    +   Step 1: Read the number of terms N.

    Step 2: Initialize sum for zero numbers.

    Step 3: While less than n number have been summed repeatedly,

    (a) read in next number

    (b) compute current sum by adding the number to the most recent sum.

    Step 4: Write or print the sum of n numbers.

