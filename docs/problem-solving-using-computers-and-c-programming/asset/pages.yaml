    \            printf(\"Hello!\\n\");\n\n}\n```\n\nHere are two loops. The first\
    \ (outer) for loop condition has i<=3 and the second (inner) for loop condition\
    \ i<=2. The inner loop will get executed completely for every iteration of the\
    \ outer loop.\n\n```\ni = 1 j = 1 , j = 2\ni = 2 j = 1 , j = 2\ni = 3 j = 1 ,\
    \ j = 2\n```\n\nHence, when in all there will be 3×2 = 6 iterations\n\nThus, 'Hello'\
