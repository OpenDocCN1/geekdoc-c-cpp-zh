  md: "# Problem Solving Using Computers & 'C' Programming\n\n# 11.6 Copying and Comparing\
    \ Structure Variables\n\nWe can copy the content of one structure variable into\
    \ another structure variable of the same type using assignment operator (=). If\
    \ emp1 and emp2 are variables of the type structure empinfo then following statements\
    \ is valid.\n\n```\nemp2=emp1;\n```\n\nThis statement copies the empno of emp1\
    \ into empno of emp2, name of emp2 into name of emp2 and so on.\n\nHowever, we\
    \ cannot compare two structure variables of same type using operators equal to\
    \ (==) and not equal to (!). That means the following expressions are invalid,\n\
    \n```\nemp1==emp2\nemp1!=emp2\n```\n\nIf we need to compare them, then we may\
