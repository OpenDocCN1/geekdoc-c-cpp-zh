    # 6.3.4 else-if Ladder\n\nThe decisions are in the form of a chain and associated\
    \ with each else and if. In this case the conditions are evaluated from top to\
    \ bottom. As soon as the condition becomes true, the statement with it is executed\
    \ and the program control is transferred directly to the next statement after\
    \ else-if ladder. The operation of this we have already seen in Fig. 6.10. The\
    \ syntax is also discussed in Section 6.3.3.\n\nConsider the simple example. A\
    \ student applied for the exam and we have to grade him. The rules applied for\
    \ the gradation are as follows:\n\n| Grade | Marks in percent |\n|---|---|\n|\
    \ Distinction | 75 to 100 |\n| First | 60 to 74 |\n| Second | 50 to 59 |\n| Third\
    \ | 40 to 49 |\n| Fail | 0 to 39 |\n\nBy using else_if ladder we can show this\
    \ gradation:\n\n```\nif (percentage > 75) grade = \"Distinction\"\nelse if (percentage\
    \ > 59) grade = \"First\"\nelse if (percentage > 49) grade = \"Second\"\nelse\
    \ if (percentage > 39) grade = \"Third\"\nelse grade = \"fail\";\n```\n\nprintf(\"\
    %s\", grade);\nThe program 6.9 explains the way using which the result of a student\
