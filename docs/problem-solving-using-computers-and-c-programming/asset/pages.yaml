    Self-referential structures are very useful in applications that involve linked
    data structures, such as lists and trees. Unlike a static data structure as array
    where the number of elements that can be inserted in the array is limited by the
    size of the array, a self-referential structure can dynamically be expanded or
    contracted. Operations like insertion or deletion of nodes in a self-referential
    structure involve simple and straight forward alteration of pointers.


