  md: '# Problem Solving Using Computers & ''C'' Programming Structures and Unions


    # (b) After structure definition:


    Variable associated with a structure can be declared after definition of structure
    as a data type declaration. We treat structure-name as a user defined type and
    declare a data variables of that type.


    ```

    struct empinfo

    {

    int empno;

    char name[30];

    char city[15];

    float salary;

    }

    ```


    We can declare variables of above structure type as,


    ```

    struct empinfo emp1, emp2, emp3;

    ```


    Once, a variable of structure type is declared, it allocates the required space
    in memory. In this example a variable emp1 will allocate 51 bytes in memory.


    | emp1 | empno | name | city | salary |

    | space-> | 2 + 30 + 15 + 4 = 51 bytes |


    The variable can be initialized during declaration as below:


    ```

    struct empinfo emp={11, "Nitin Patil", "Nashik", 9800.00};

    ```


    # 11.5 Accessing Structure Members [April 16]


    The members are treated as separate entities, so can access them individually
    using dot operator(''.'').


    ```

    StructureVariableName.Member

    ```


    The operator (.) is called a structure member operator which connects the structure
    variable name and the structure member.


    Example: empl.empno gives the employee number of empl


    ```

    empl.name gives the employee name of empl

    ```


    # 11.3'
