    # 8.5.2.1 Declaration and Initialization


    Declaration Syntax of array:


    ```

    data_type array_name[rows] [columns];

    ```


    Where,


    +   data_type : The type of the data stored in the array


    +   array_name : Name of the array


    +   rows : Maximum number of rows in the array


    +   columns : Maximum number of columns in the array


    Example : int value[3]; // implies 3 rows and 3 columns


    Initialization : int table[2][3] = {2, 11, 3, 5, 1, 10};


    This initialized two-dimensional array can be stored in the memory in any of the
    three forms mentioned below:


    +   1. Two-dimensional form as follows:


    | col0 | col1 | col2 |

    |---|---|---||

    | row0 | 2 | 11 | 3 |

    | Row 1 | 5 | 1 | 10 |


    +   2. Row-wise linear list: Elements of row0 are stored first and then row1 is
    stored.


    | table[0] | table[1] | table[2] | table[1] [0] | table[1] [1] | table[1] [2]
    |

    |---|---|---|---|---|---||

    | 2 | 3 | | 5 | | 10 |

    | row0 | row1 | | | | | |


    +   3. Column-wise linear list: Elements of col0 are stored first, next col1 and
    col2.


    | table[0][0] | table[0][1] | table[0][2] | table[1][0] | table[1][1] | table[1][2]
    |

    |---|---|---|---|---|---||

    | 2 | 5 | 11 | 1 | 3 | 10 |


    | col0col1 | col2 |

    |---|---|


    Example:


    ```

    int a[3][3];

    ```


    In above example, a is an array of type integer which has storage size of 3 *
    3 matrix. The total size would be 3 * 3 * 2 = 18 bytes. It is also called as ''multidimensional
    array.'''
