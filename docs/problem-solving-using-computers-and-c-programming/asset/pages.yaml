    +   1. #include<stdio.h>

    This line of the program is a preprocessing directive, #include. This causes the
    preprocessor — the first tool to examine source code as it is compiled — to substitute
    the line with the entire text of stdio.h. The header file stdio.h contains declarations
    for standard input and output functions such as printf.


    +   2. int main(void)

    This line indicates that a function name is being defined. The main function serves
    a special purpose in C programs. The run-time environment calls the main function
    to begin program execution. The type specify indicates that the return value,
    the value of evaluating the main function is returned to its invoke (in this case
    the run-time environment), is integer. The keyword as a parameter list indicates
    that the main function takes no arguments.


    +   3.

    This opening curly brace indicates the beginning of the definition of the main
    function.


    +   4. printf("hello world\n")

    This line calls the code for a function printf, which is declared in the included
    header stdio.h and supplied from a standard library. In this call, the printf
    function is passed (provided) with a single argument, the address of the first
    character in the string literal "hello world\n". The semicolon () terminates the
    statement.


    +   5. return 0;

    This line terminates the execution of the main function and causes it to return
    the integer value 0, which is interpreted by the run-time system as an exit code,
    (indicating successful execution).


    +   6.

    This closing curly brace indicates the end of the code for the main function.


