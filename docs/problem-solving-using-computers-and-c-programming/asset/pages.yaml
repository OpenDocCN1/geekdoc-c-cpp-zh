  md: '# Problem Solving Using Computers & ''C'' Programming


    # Input and Output


    The syntax is:


    ```

    printf("information string", arg1, arg2, ... argn);

    ```


    where, information string refer to a string that containing formatting information
    and arg1, arg2...argn are arguments that represent the individual output data
    items.


    The information string contains format specifiers that define the way how the
    subsequent arguments are displayed.


    +   - A format specifier begins with a percent (%) sign and is followed by the
    format code.

    - The number of format specifiers and number of arguments should be exactly.

    - The arguments are marked in order from left to right with the format specifier.


    Example:


    ```

    printf("I like %c %s", "C", "very much");

    ```


    Table 5.2: printf("%c") format specifiers

    | Conversion characters | Meaning |

    |---|---|n| %c | data item is a single character. |

    | %d | data item is a decimal integer.

    | %e | data item is a floating point with an exponent.

    | %f | data item is a floating point without an exponent.

    | %g | uses %c or %f, whichever is shorter.

    | %i | data item is a signed decimal integer.

    | %0 | data item is an octal int, without a leading zero.

    | %s | data item is a string.

    | %u | data item is an unsigned decimal int.

    | %x | data item is a hexadecimal int.

    | %p | displays a pointer. |


    # Table 5.2: printf("%c") format specifiers


