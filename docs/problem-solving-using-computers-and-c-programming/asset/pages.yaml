  md: "# Problem Solving Using Computers & 'C' Programming Functions of C\n\n# 7.6\
    \ Parameter Passing [April 18]\n\nThe function i.e. main() and user-defined function\
    \ interacts with each other through parameters. Parameter passing is basically\
    \ to have communication between called function and calling function.\n\nThe best\
    \ way to exchange information between a function and its reference points is to\
    \ use parameters. Parameters can be classified as:\n\n+   (a) Actual parameters\n\
    (b) Formal parameters.\n\nEach data item is transferred between an actual parameter,\
    \ which is included within the function statement. A formal parameter is defined\
    \ within the function itself. When the function is accessed, the actual parameters\
    \ are substituted for the formal parameters, thus creating an information exchange\
    \ mechanism between the function and its reference point. The information exchange\
    \ between a function and its reference point is illustrated in the following skeletal.\n\
    \nExample:\n\n```\n#include<stdio.h>\n\nint a, b, c, d;\nvoid exchange ( int x,\
    \ int y )\n{\n    /* process the values of x and y */\n}\n\nmain ()\n{\n    exchange(a,\
    \ b);\n    //--\n    exchange(c, d);\n}\n```\n\nHere variables x and y are formal\
    \ parameters defined within the function definition. The actual parameters are\
    \ a, b, c, d. The first call function causes the values of the actual parameters\
    \ a and b to be transferred to the formal parameters x and y. These values of\
    \ x and y will get processed within the function exchange (). For the second function\
    \ call the values of actual parameter c and d are transferred to the formal parameters\
    \ x and y.\n\n7.15"
