    # 8.3 Declaration of an Array


    The way in which we declare variables, in the same way we need to declare an array.
    If we not declare it, we can not use array variable. The syntax for array declaration
    is as follows:


    Syntax:


    ```

    datatype array-name[size];

    ```


    Example:


    ```

    int marks[10];

    ```


    Here, datatype specifies the type of all individual data items. Array name specifies
    the name which we use inside our program code. Size tells us the memory locations
    allocated for that array. Fig. 8.2 shows how the values are stored inside the
    primary memory.


