  md: '# Problem Solving Using Computers & ''C'' Programming


    To construct any loop, three things are required:


    +   1. initial conditions that need to apply before the loop begins to execute.

    2. invariant relation that must apply after each iteration of the loop.

    3. the condition under which the iterative process must terminate.


    +   1. Establishing initial conditions for loops:

    To initialize loop condition, we have to set the loop variables to the values
    that is associated with the loop.


    **Example:** To sum of ''n'' natural numbers in an array we use variable sum and
    initialize the zero.


    ```

    sum = 0

    i := 0   Solution for n = 0

    ```


    +   2. Finding the iterative construct:

    After initialization, we try to find next smallest problem that give the solution
    for n = 1.

    The solution for n = 1 is


    ```

    i := 1

    sum := a[i]  Solution for n = 1

    ```


    where ''a'' is an array of numbers. Now we extend the solution for n > 1

    ie. n = 2 and so on.


    ```

    i := i + 1

    sum := sum + a[i]  Solution for n > 0

    ```


    Now we can construct a loop for all (i - 1)th case.


    ```

    while i < n do

    begin

    i := i + 1;

    sum := sum + a[i]  Solution for array summation problem for n ≥ 1

    end

    ```


    +   3. Termination of loops:

    The termination condition of loop depends on problem. The simplest termination
    condition of a loop occurs when we know in advance how many iterations we want.


    **Example:** Termination unconditionally


    ```

    for i = 1 to n do

    begin

    .

    .

    end

    ```


    This loop terminates unconditionally after ''n'' iterations.'
