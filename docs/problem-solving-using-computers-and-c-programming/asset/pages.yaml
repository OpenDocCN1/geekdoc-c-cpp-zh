    | 1.1 Introduction | [April 15] |


    To write computer program, one must plan the logic of the program. This logic
    is written into steps. It is necessary that every instruction is written in the
    proper sequence. The programmer has to write each and every step for solving a
    given problem. This process is algorithm writing.


    Algorithm represents a logic of the program and also specify how to solve a given
    problem. There are different ways in which an algorithm can be expressed. It can
    be written in pseudo code or it can be expressed in a programming language. If
    it expressed in programming language, it becomes a program. Algorithms can also
    be expressed in the form of flowcharts.


    An algorithm can be thought of as the detailed instructions for carrying all operation.
    Flowchart is a pictorial representation of an algorithm. It has special boxes
    of different shapes for specific purpose i.e. to denote different types of instructions.


    # 1.2 Problem Solving


    We use algorithms to solve every problems in real-life. For example, if we want
    to search a telephone number in a telephone directory, we need to use an algorithm.
    We would never start from page 1 if we want to search name "Jack", since the names
    are in order.


    If the names are unordered, the search is difficult. We have to search name one
    by one. So data organization plays a important role in the performance of the
    algorithm.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_8_0.png)'
