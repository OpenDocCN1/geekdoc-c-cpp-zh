  md: "# Problem Solving Using Computers & 'C' Programming Structures and Unions\n\
    \n# 11.8 Nesting of Structures\n\nStructure within structure is called nesting\
    \ of structure. C language allows to define a structure, which is a member of\
    \ other structure. Nesting of structure are used in such events, where multiple\
    \ data items relate to each other, are grouped within a structure.\n\nConsider\
    \ the following example of employees monthly salary information.\n\n```\nstruct\
    \ salary\n{\n    int empno;\n    char name[25];\n    int basic, hra, ptax, itax;\n\
    \    int netsal;\n}\n```\n\nIn this example, there are three members - basic,\
    \ da and hra speccies income in the salary, which two members - ptax and itax\
    \ specifies the deduction from the salary. So we can declare separate substructures\
    \ within structure as below.\n\n```\nstruct salary\n{\n    int empno;\n    char\
    \ name[25];\n    {\n        int basic;\n        int da, hra;\n    }\n    income;\n\
    {\n        int ptax;\n        int itax;\n    }\n    deduct;\n    int netsal;\n\
    } empsail;\n```\n\nThe structure salary contains a member income, which is itself\
    \ a structure with three members. We can also tag names to define inner structures\
    \ as follows:\n\n```\nstruct incomeinfo\n{\n    int basic;\n    int da, hra;\n\
    }\n    income;\nstruct deductInfo\n{\n    int ptax;\n    int itax;\n}\n    deduct;\n\
    ```"
