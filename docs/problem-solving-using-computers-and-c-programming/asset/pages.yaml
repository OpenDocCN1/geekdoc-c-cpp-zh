  md: '# Chapter 12...


    # C Preprocessor


    # Contents ...


    +   12.1 Introduction


    +   12.2 Working of C Preprocessor


    +   12.3 Preprocessor Directives


    +   12.4 Difference between Macros and Functions


    +   * Questions


    +   * Previous Exams Question and Answers


    # 12.1 Introduction


    We have already seen the different data structures and statements predefined in
    C language. There is a specific ''syntax'' provided for every data structures
    and statements. The C compiler checks the syntax and detects syntax errors in
    given program if any. If there is no syntax error then compiler converts program
    into object code. The preprocessor is a unique feature in C language, it processes
    the program (source code) before it passes to the compiler. We have already used
    preprocessor directives like #include and #define in earlier chapters to a limited
    extent. In this chapter, we will see in detail about the C preprocessor and its
    applications.


    # 12.2 Working of C preprocessor [Oct. 17]


    C processor as name indicates, it processes the program before compiler does the
    compilation. Preprocessor operates under the control or commands, known as preprocessor
    directives. Each preprocessor directive begins with the symbol ''#''. The directives
    give direction to the preprocessor to take certain action to performed.


    From source program, the preprocessor removes all directives i.e the statements
    with ''#'', after taking certain action. This source program without directives
    is passed to C compiler. The Compiler translates that program into the object
    code (machine code). The linker then links that object program with the standard
    C library files to get the executable program.


    We can place the preprocessor directives anywhere in the program, wherever, it
    is required. These are not terminated with semicolon().'
