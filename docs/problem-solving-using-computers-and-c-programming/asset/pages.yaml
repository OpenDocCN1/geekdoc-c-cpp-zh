    \ <--- x ---> | | |\n| <--- y ---> | | |\n\nFor variable, the compiler allocates\
    \ a storage space equal to the largest variable type in union. In above union,\
    \ the variable requires 4 bytes, which is largest among other members. Therefore,\
    \ the union variable requires 4 bytes.\n\nAny member from union can be accessed\
    \ using dot operator similar to structure. sample.x, sample.y, sample.z Union\
    \ variable allocates a space, which is used by any one of its members at a time.\
