  md: '# Problem Solving Using Computers & ''C'' Programming


    # 3. free();


    This function releases the memory block previously allocated using malloc(), calloc()
    or realloc() functions. It is our responsibility to release the memory space,
    when it no longer required.


    Syntax:


    ```

    free(ptr);

    ```


    Where, ptr is pointer to the memory block, which is to be released.


    # 4. realloc();


    Using this memory we can increase or decrease the memory block size, which was
    previously allocated using malloc() or calloc() functions. This process is called
    reallocation of memory.


    Syntax:


    ```

    ptr = (type *) realloc(ptr, newsize);

    ```


    where, ptr is pointer to the memory block, which was previously allocated. This
    function returns the pointer to the first byte of new memory block. If the function
    is unsuccessful in locating additional space, it returns NULL pointer and the
    original block is freed.


    For example:


    ```

    int *ptr;

    ptr=(int *) malloc(10 * sizeof(int)); //original allocation .....

    ptr=realloc(ptr, 40); // reallocation increase by 20 bytes

    ```


