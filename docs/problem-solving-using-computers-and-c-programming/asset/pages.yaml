  md: '# Problem Solving Using Computers & ''C'' Pointers


    Pointers can also be used to access two-dimensional array.


    Let us consider two dimensional array,


    ```

    int mat[5][5], *p;

    p=mat;      //pointer to first row

    (p+i)      //pointer to ith row

    *(p+i)     //pointer to first element to ith row

    *(p+i)+j   //pointer to jth element in the ith row

    *(*(p+i)+j)//value stored in location [i][j], row and jth column

    ```


    | | | | | n4 |

    |---|---|---|---|---||

    | p | | | | | |

    | *(p+1) | | | | | |

    | p+4 | n0 | | | n4 |


    The compiler allocates contiguous memory area for all elements, row-wise. That
    is elements of first row are followed by by all elements of second row and so
    on.


    For example: int mat[3][3]={10,20,30}, {40,50,60}, {70,80,90} };


    The elements of array will be stored as,


    | row0 | row1 | row2 |

    |---|---|---|---|---|---|---|---|n| 10 | 20 | 30 | 40 | 50 | 60 | 70 | 80 | 90
    |


    The statement p=mat, sets the pointer on the first element mat[0][0].


    The statement p++ moves the pointer on the first element of second row, where
    means p is increment by (number of rows x size of each row).


