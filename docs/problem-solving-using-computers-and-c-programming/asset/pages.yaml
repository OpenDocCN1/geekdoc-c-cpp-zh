    # 2.6 Compilers and Interpreters


    # 2.6.1 Compiler


    [April 18]


    Compiler is a software program that translates a high level language program into
    machine language program or object program. Compiler takes a source program as
    an input which is high level language program and produce object program as output.


    The Fig. 2.2 shows the compiler schematic.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_34_0.png)


    Compilers are permanently stored on the secondary storage, whenever a program
    is to be translated, compiler is copied into the main memory of the computer.
    While translating given program, compiler checks each statement in the source
    program, finds errors and generates a sequence of machine instructions. The process
    of compilation is mainly divided into two parts:


    | Analysis of source program | + Synthesis of target code | = Translation of a
    program |


    Source program analysis is based on the grammar of the source language. The main
    job of analysis phase is to understand the meaning of the source program and to
    generate efficient code. In synthesis phase, target code is generated from this
    intermediate code.


    **Example of compiler:** TURBO C compiler is used for ''C'' language on WINDOWS.


    +   - TURBO PROLOG compiler is used for PROLOG language.


    +   - GNU C is used for ''C'' on UNIX or Standard Unix compiler is used.


    # 2.6.2 Interpreter


    Interpreters are used to translate high-level language to machine language. They
    translate high level statement by statement into machine language, which is executed
    immediately. Interpreter does not save the object code since, the translation
    and execution processes alternate.


    The primary advantage of completely eliminating compilation overheads. Instead
    of computer time, requirement of compilation and execution for every step, interpreters
    only requires the interpretation. Interpretation time is the time required to
    fetch the statement, analyze the statement and execute the meaning of the statement.'
