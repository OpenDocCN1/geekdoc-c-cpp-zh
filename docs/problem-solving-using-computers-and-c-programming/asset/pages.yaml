  md: "# Problem Solving Using Computers & 'C' Programming Control Structures\n\n\
    For example:\n\n```\nFor (i = 0; i < 5; i++)\n{\n    printf(\"Hello\");\n    if\
    \ (i == 3) break;\n    printf(\"world\");\n}\n```\n\nHere, initialized value of\
    \ i is 0 at the start. Then it checks for the condition. As zero is less than\
    \ 5. It prints Hello. Again it checks for i value. It is not equal to 3 so it\
    \ prints the world. It is continued until i = 3. Once, the value of i becomes\
    \ 3 statement is true without printing world the program control comes out of\
    \ loop.\n\nThe continue statement is bypass the other statements in loop and continued\
    \ the loop. So when a continue is encountered instead of reading the remaining\
    \ part of loop, the program control is directly transferred to the beginning of\
    \ the loop. Similar to break, continue is used with while, do-while and for loop.\n\
    \nLets see program 6.29, which prints all the numbers in the range of 1 to 100\
    \ and not multiples of 7.\n\nProgram 6.29: Program for printing all the numbers\
    \ in the range of 1 to 100 and not multiples.\n\n```\n#include<stdio.h>\nmain()\n\
    {\n    int i;\n    for (i = 1; i <= 100; i++)\n    {\n        if (i % 7 == 0)\
    \ continue;\n        prints(\"% d \\n\", i);\n    }\n}\n```\n\nRemember one thing\
    \ that both break and continue are acceptable in structured programs only because\
    \ they permit control to be transferred locally i.e. within the immediate neighbourhood\
    \ of the loop."
