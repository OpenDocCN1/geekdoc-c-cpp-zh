  md: '# Problem Solving Using Computers & ''C'' Programming


    # Control Structures


    A situation can arise frequently where a transfer of program control is required
    by comparing two quantities. This is called conditional branching, where a logical
    decision is carried out inside the computer. Sometimes, it is required to alter
    the flow of program execution by transferring control to some remote part of the
    program. This is known as unconditional branching. Another situation arises where
    number of repetitions will not be known in advance. So the group of consecutive
    statements are repeated for a specified number of times or until some condition
    has been satisfied. This is called looping.


    The types of control structure are shown in Fig. 6.2.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_87_0.png)


    The flow of statement execution can be controlled by various control commands.
    Every language have some statements that are used to alter the flow of sequence
    of instructions. These statements are called control structures. This chapter
    talks about unconditional branching [e.g. goto statement], conditional branching
    [e.g. if-else, switch statement] and looping [e.g. while-do, for loop]. The control
    structures are used for compound statements.


    From the above component we understand that there are three main situations where
    we need conditional:


    +   (i) When we want to execute or skip some statements based on a condition.

    (ii) When we want to repeat some statements as long as a condition is true.

    (iii) When we want to choose one path based on values of a variable out of many
    possible execution paths.


    The control structures are used with compound statements.


    # 6.2.1 Compound Statement


    A compound statement is nothing but a sequence of two or more statements written
    within() and separated by semicolon(). A compound statement is executable and
    it does not have any declaration. It is assumed that all the declaration have
    already done in the declaration part of the program.'
