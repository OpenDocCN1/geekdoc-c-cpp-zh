    # 14.1 Introduction


    In earlier programs, we have taken input from the user and displayed output on
    the screen using scanf() and printf() functions respectively. That means we have
    considered console/O. Many applications require that the information is be stored
    permanently in the storage device, which will be accessed and modified whenever
    required. The information in storage device can be stored in the form of file.
    File is a place in storage device like disk, which contains group of related data.


    In this chapter we will see to create, read, and alter files using C programs.
    We will also study different type of files i.e. text files, binary files and their
    operations. In this chapter will see how parameters are passed to programs through
    command line.


    # 14.2 File Types


    C supports for type of files.


    # 14.2.1 Text File Text file consist of sequence of characters organized into
    lines. Each line is terminated by new line character.


    +   * Each new line is stored as combination of Carriage Return and Line Feed.

    * EOF (End Of File), a special character is stored after the last character in
    the text file.

    * Each character occupies byte in storage area. Numeric data is stored as sequence
    of digits, where each digit occupies a single byte.

    While reading a text file, we can check EOF to detect the end of file.


    # 14.2.2 Binary File


    +   * In binary file, there is no separation of data using new line character
    or any other. It is simply a sequence of bytes.

    * In this file, no translation will occur. There is a one to one correspondence
    between byte read and write byte.'
