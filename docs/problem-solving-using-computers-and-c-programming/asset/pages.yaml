    # 6.1 Introduction


    One of the most important characteristics of a computer is its ability to execute
    a series of instructions repeatedly. The main topic in this chapter is the use
    of control structures. These control structures provides the great flexibility
    to the programmer through he/she can have control over how many times a series
    of C statements are executed.


    # 6.2 Control structures


    Till now the programs which we have seen are simple and straight forward. In these
    programs, a computer executes the statements sequentially i.e. one after another
    in the serial order. Let''s be more specific. The computer starts execution with
    the first statement in the main program. Then it executes second statement, then
    third and so on until the last statement is executed. This type of sequential
    execution of a program is shown in Fig. 6.1.


    The sequential execution is not sufficient for solving real or actual problems.
    Sometimes, it may require to change the execution of statements due to the various
    conditions. For example, until some logical condition has been satisfied, execute
    group of consecutive statements repeatedly.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_86_0.png)


    6.1'
