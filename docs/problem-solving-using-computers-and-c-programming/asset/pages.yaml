  md: '# Problem Solving Using Computers & ''C'' Programming C Preprocessor


    # 12.3.1.3 Nesting of Macros


    It is possible to call one macro inside another macro, that is nesting of macros.


    Example:


    ```

    #define SQR(x) ((x) * (x))

    #define CUBE(x) (SQR(x) * (x))

    #define SIXTH(x) (CUBE(x) * (CUBE))

    ```


    The macro CUBE calls a macro SQR, SIXTH calls a macro CUBE.


    # 12.3.2 File Inclusion Directives


    We have used #include directive statements in earlier programs. That means we
    can include any external file in the program so that we need not to rewrite its
    content.


    Example:


    The header file supplied by C language, stdio.h, contains the declaration of all
    functions related to I/O operations. When, we we use I/O operations in the program,
    we include this header file.


    The file include directive statements can be written in two ways


    +   (i) **<filename>**


    The preprocessor will search the file in directory not specified in C environment.


    Example:


    ```

    #include <stdio.h>

    #include <conio.h>

    ```


    +   (ii) **"<filename>"**


    The preprocessor will search the file in the current directory, if directory name
    not specified. Otherwise it will search in a specified directory.


    Example:


    ```

    #include "myfunc.h"

    #include "\fy\myfunc.h"

    #include "\fy\batch1\progl.c"

    ```


    # 12.3.3 Compiler Control Directives (Conditional Compilation)


    The preprocessor provides directives such as #ifdef, #if, #elif, #undef, #ifndef
    etc., helps to write code which can be compiled depending on the conditions stated.


    # 12.3.41 #if statement


    This directive statement tests the expression and decides whether to compile statements
    or not.


    ```

    #if expression

    Statement1;

    ...........

    #else

    Statement1;

    ...........

    #endif

    ```'
