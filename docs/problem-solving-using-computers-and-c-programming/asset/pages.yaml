    # Program 7.8: Call by value.


    # Value Parameter:


    A value parameter is used only to carry or send value into a function. When information
    or value is transferred between an actual parameter and a value parameter, the
    value of the actual parameter is assigned to the value parameter. This value can
    be processed within the function. But change will not be reflected outside the
    function. The changes affect only the locally defined locations and are not carried
    back to the caller function. Thus, value parameters are one-way communication.
    They are considered as a input parameters. Since it is the value of the actual
    parameters that transferred rather than the parameters themselves, there is considerable
    latitude in the manner in which the actual parameters can be written. An actual
    parameter may be expressed as constant, a variable or an expression.


    Passing parameter using value mechanism does not change the contents of the argument
    in the calling function, even if it is changed in the called function.'
