    # 2.3 Machine Language


    The computer can only understand the language of 0''s and 1''s (binary). Machine
    language code is written in binary 0''s and 1''s. The internal circuitry of the
    computer is designed in such a way that it converts the program code into electrical
    signal in order to run the computer.'
