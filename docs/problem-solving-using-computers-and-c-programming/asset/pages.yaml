    # 3.7 C Program Development Life Cycle [April 15]


    The program development life cycle has four steps:


    +   - **Writing the source code**: The program is to be written using a text editor
    or word processor. Most language compilers have their built-in editors. The program
    or source code should be written in the syntax provided by that language. In C
    source have extension.

    - **Compiling the source code**: The source code is compiled using compiler of
    that language (in binary format). The compiler checks the syntax errors in the
    source code.

    - **Linking the object code**: If the object code requires some precompiled library
    routines then the linking of the program with the library routines is done with
    the help of a linker. The linker creates a executable code with extension .exe.

    - **Executing the program**: Executable file is ready-to-run file. In DOS operating
    system, we can run this file by just its name at prompt. In UNIX, it is run using
    ./aut (where a-out is executable file).


    The Fig. 3 shows the steps involved in program development.


