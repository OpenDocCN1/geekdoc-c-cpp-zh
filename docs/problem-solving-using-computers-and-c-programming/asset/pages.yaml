    \    return 0;\n}\n```\n\n# ## 6.5.2 do-while Loop\n\nIn while loop the condition\
    \ is checked prior to the execution of the loop. If condition is false, in do-while\
    \ loop, the condition is checked at the end of the loop. So by default, the statements\
    \ get executed atleast once. The syntax of do-while is as follows:\n\nSyntax:\n\
    \n```\ndo\n    statement1;\n    while (condition);\n```\n\nHere,statement1 is\
    \ executed atleast once and then condition is checked. If condition is true the\
    \ program control will go back to statement1. This loop is executed till the condition\
    \ is true. If condition is false then the loop is terminated. The Fig. 6.18 shows\
    \ the execution of do-while loop.\n\n![](img/19a476c19cc1340c167bd9a8fd2d791b_107_0.png)"
