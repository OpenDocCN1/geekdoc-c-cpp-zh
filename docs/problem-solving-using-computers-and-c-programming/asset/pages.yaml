    \nmain()\n{\n    int total, m1, m2, m3;\n    char grade[10], result, name[15];\n\
    \    float average;\n    /* accept students names and marks */\n    printf(\"\
    Enter name:\");\n    scanf(\"%s\", name);\n    printf(\"Enter marks for three\
    \ subjects:\");\n    scanf(\"%d %d %d\", &m1, &m2, &m3);\n    /* calculate total\
    \ marks and average */\n    total = m1 + m2 + m3;\n    average = total/3;\n}\n\
