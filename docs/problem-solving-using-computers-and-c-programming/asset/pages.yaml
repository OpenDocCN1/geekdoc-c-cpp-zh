    # 3. Passing pointer to structure:


    The address or location of the structure is passed to the function. Therefore,
    any changes to the structure members within a function will be reflected in the
    original structure. Let us consider the example of struct studexam. We can declare
    a pointer ptr which points to an array of struct studexam.


    ```

    struct studexam[50], *ptr;

    ptr=stud;

    ```


    We can pass ptr as an argument to a function, where all structure members are
    referred with help of ptr.


    ```

    calc(ptr); //function call

    ```


    In the function calc(), we refer members of structure as


    ```

    ptr->name,      ptr->mark[i].

    ```


    # 4. Structure Pointer:


    +   - C language allows pointer to structures as it allows pointers to any other
    type of object.

    - Structure pointer are declared by placing * in front of structure variables
    name.

    - For example, struct addr * addr_pointer;

    - In above we define structure addr which declares addr_pointer as a pointer to
    data of that type.

    - There are two ways use structure pointer first is to pass a structure to a function
    using call by reference and to create linked list and other dynamic data structures
    that rely on dynamic allocation.

    - For example, we want to access the employee''s information through structure
    pointer. For that, we declare the structure type st consisting of members id,
    name and address. Then we have declared a structure pointer as:


    ```

    struct st employee, *ptr;

    ```


    We point the pointer to employee with the expression stptr = &employee. Then we
    access the members by de-referencing the pointer. For this, we have used another
    structure selector which works on pointers to structures. If p is a pointer to
    a structure and m is a member of that, then p->m. We set the value of specified
    members as:


    ```

    ptr->id = 1;

    ptr->name = "Akbar";

    ptr->address = "Pune";

    ```


