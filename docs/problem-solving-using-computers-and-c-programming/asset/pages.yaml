  md: '# Problem Solving Using Computers & ''C'' Programming


    # 1.4 Analysis of Algorithms


    # 1.4.1 Characteristics of Good Algorithms


    +   1. They are simply but powerful and general solutions.

    2. They can be easily understood by others.

    3. They can be easily modified if necessary.

    4. They are correct for clearly defined situations.

    5. They can save storage and time.

    6. They are not machine dependent.

    7. They are able to be used as a subprocedure for other program.

    8. They are well documented.

    9. They can be easily coded.

    10. They are more efficient.


    # 1.4.2 Complexity of Algorithm


    Implementation of an algorithm in a computer language is called a program. To
    understand the behaviour of a program, it can be run on a particular computer
    with a particular set of inputs. This approach will be useful because we know
    the behaviour of the program in a particular instance and it depends on the computer
    and the input. In order to know more about an algorithm we must analyze it independent
    of the language the computer and input.


    Consider the size of problem = n. The notation used to compute time for algorithm
    is called O-notation. The Big-Oh (O) notation is the most popular asymptotic notation
    used in the performance analysis of program. We use Big-O notation to describe
    the runtime characteristics as a function. This describes how the behaviour of
    a function is affected by the size of data set.


    +   1. O(1) indicates that the time is constant.

    2. O(n) indicates that the time it increases linearly with the size of the input.

    3. O(n²) indicates that the time grows as a square of the number of times.

    4. O(2^n) indicates that time increases exponentially.

    5. O(log n) indicates logarithmic increase in time.


    In analyzing any given algorithm there are two measures of performance usually
    considered: worst case and average case.


    +   * worst case for a given problem size n corresponds to the maximum complexity
    encountered among all problems of size n. In the worst case algorithm will examine
    all n values.


    +   * the average case analysis, all points of termination are equally likely
    the. probability that x will be found at position 1 is 1/n and at position 2 is
    2/n and so on, if we use linear search in the ordered list of elements for value
    x.


    | 1 | 2 | n |'
