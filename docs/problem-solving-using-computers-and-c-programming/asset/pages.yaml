    \ | [April 15] |\n\nWe have array, which is a data structure used to store collection\
    \ of elements, all are of the similar (homogeneous) type, such as int, float,\
    \ char etc. We cannot store list of elements of different type in the same array.\
    \ C support another data structure known as structure, which can hold collection\
    \ of elements may be of different types. This chapter is devoted to the study\
    \ of structures and their applications in program development. We will also see\
    \ another related concept known as union.\n\n| 11.2 What is Structure? | [April\
    \ 15, 16] |\n\nIn real life situations, we need to store various data items that\
