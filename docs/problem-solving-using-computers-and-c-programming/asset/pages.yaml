  md: "# Problem Solving Using Computers & 'C' Pointers\n\nThe total memory required\
    \ to store this array is 60 bytes. During execution program, when we actually\
    \ store 20 numbers, then remaining 10 locations in the array i.e. 20 bytes will\
    \ be wasted. On the other hand, if we want to store 40 numbers, the array size\
    \ is not sufficient. At run time it is not possible to increase or decrease the\
    \ size of this array. This type of fixed memory allocation is called static memory\
    \ allocation. \n\nC provides some standard library functions to allocate as as\
    \ free memory at run time, as per the requirement. The memory allocation at the\
    \ time of execution of program is called dynamic memory allocation.\n\nThe functions\
    \ provided by C language library for dynamic memory allocation are, All these\
    \ functions are declared in header file <alloc.h>.\n\n+   1. malloc()\n\nThis\
    \ function allocates memory space of a specified size and returns pointer to the\
    \ allocated block of void type.\n\nSyntax:\n\n```\nptr=(type *) malloc(size in\
    \ bytes)\n```\n\nFor example:\n\n```\nint *ptr;\nptr=(int *) malloc(10 * sizeof(int));\n\
    ```\n\nIn this example allocates 20 bytes of heap memory space, if size of single\
    \ integer is 2 bytes. The function returns the pointer of void type, so we need\
    \ to do casting of (int *) because ptr is an integer pointer.\n\nThe built-in\
    \ operator sizeof returns the size of the specified type.\nIf space in memory\
    \ heap is not sufficient to satisfy the request, then the allocation will fail.\
    \ If it fails, it will return a NULL value.\n\n![](img/19a476c19cc1340c167bd9a8fd2d791b_234_0.png)\n\
    \n+   2. calloc()\n\nThis function is similar to malloc(), to allocate the required\
    \ memory dynamically. The only difference is that, calloc() initializes the allocated\
    \ memory space to 0, whereas malloc() keeps the garbage value as it.\n\nSyntax:\n\
    \n```\nptr=(type *) calloc (number of items, size of each item)\n```\n\nFor example:\n\
    \n```\nint *ptr;\nptr=(int *) calloc(10,sizeof(int));\n```"
