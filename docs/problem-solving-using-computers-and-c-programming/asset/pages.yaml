  md: '# Problem Solving Using Computers & ''C'' Functions of C


    If a program has many (multiple) functions, their definition may appear in any
    order. Because each function is independent of one another. A function will carry
    the specific action when we access it. The same function can be accessed from
    many places into that program. When the function action is finished, a program
    control will be returned back to the next statement of a function call.


    # 7.3 Advantages of Function


    +   1. The program length is reduced. So memory space is managed properly.

    2. Easy to handle errors and debug them.

    3. A function can be used by many programs.

    4. Modular programming facilitates top-down approach i.e Big program can be sub-programmed
    and handled easily


    For example, marklist creation program. In this we require marks to be entered.
    Then we need to perform calculations to find percentage and print marks and as
    as result. We can include all the things in a single program without writing a
    function or we can write 3 functions to perform each task separately. So we are
    going from top-to-bottom.

    Fig. 7.1 (a) and (b) shows top-down modular programming with the above example.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_133_0.png)


    There are two types of functions available in ''C'':

    - Standard library functions.

    - User defined functions.'
