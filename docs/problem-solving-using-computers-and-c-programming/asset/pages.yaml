  md: '# Problem Solving Using Computers & ''C'' Programming


    The instruction of machine language consists of:


    +   (a) **Opcode**: It is the command or operation that can be performed by computer.


    +   (b) **Operand**: It is a data or address of data (value).


    # 2.3.1 Advantages of Machine Language


    +   - The machine language program is executed fast by the computer because each
    instruction is written in machine language which is easy to understand by computer
    directly.


    +   - No translator is required.


    # 2.3.2 Disadvantages of Machine Language


    +   - **Difficult in writing a program**: For writing a program in machine language,
    programmer has to remember all code numbers of all commands i.e. opcode and storage
    location of data and instructions.


    +   - **Machine dependent (non-portable)**: The internal circuitry of every type
    of computer is different than any other type of computer, thus requires different
    electrical signals so the language differs from computer to computer. So machine
    language program written on one computer cannot be executed on other computer.


    +   - **Error prone**: The language is simple to write, programmer can make many
    mistakes while writing a program. So chances of error are more.


    +   - **Maintainability**: It is very difficult to maintain and modify the machine
    language program.


    # 2.4 Assembly Language [April 16]


    Assembly language is written in mnemonics or symbol code. It substitutes letters
    and symbols for the numbers in machine language program, so it is also called
    as **symbolic language**. It is low-level language.


    A translator called *assembler* is required to translate an assembly code into
    machine code. The program written in assembly language is called a **source program**.
    Assembler converts source program into object program or machine language program.


    # 2.4.1 Advantages of Assembly Language


    +   - **Low-level language**: Used in system programs like robotics etc.


    +   - **Easy to understand**: Instead of opcodes, mnemonics are used. For example,
    ADD for addition so easy to understand and use. Storage locations need not to
    be remembered, this saves time.


    +   - **Less prone**: Since, mnemonics are used, less errors occur.


    +   - **Easy to modify**: It is easier to locate, correct and modify programs
    whenever required.


    # 2.4.2 Disadvantages of Assembly Language


    +   - **Machine Dependent**: Assembly program is written in mnemonics. The program
    for one machine cannot be used for other machine.'
