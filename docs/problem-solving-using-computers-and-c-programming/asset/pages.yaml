    \ (num != 0);\n}\n```\n\n#  6.5.3 for Loop\n\nIt is the most versatile loop structure\
    \ and easy to understand. It also provides flexibility to the execution of C statements\
    \ depending on some values.\nThe syntax of for loop is as follows:\n\nSyntax:\n\
    for (initialization; condition; expression)\nstatement;\n\nInitialization is to\
    \ set or initialize the variable to be used in the loop, before the loop begins.\
    \ If we want to initialize more than one initialization then we must use comma\
    \ as a separator.\nThe condition is checked and till it is true the statement\
    \ is executed. When condition is false the loop stops. If there are more than\
    \ one conditions then they are separated by comma.\n\n![](img/19a476c19cc1340c167bd9a8fd2d791b_109_0.png)\n\
    \nThe expression is evaluated after every iteration of the loop. Generally, increment\
    \ and decrement operations are written here. We can write more than one expression.\
    \ For that, comma is used to separate them.\n\nIn for loop initialization done\
    \ first then the condition is checked. If the condition is true the statements\
    \ in the loop gets executed. After that expression gets evaluated. Again control\
    \ goes back to the condition. This procedure is continued until condition is true.\
    \ Fig. 6.20 shows the usage of for loop.\n\nThe program 6.19 and Fig. 6.20 shows\
    \ the usage of for loop to calculate sum of 1st 20 natural numbers."
