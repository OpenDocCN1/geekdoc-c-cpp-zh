  md: '# Problem Solving Using Computers & ''C'' Programming


    # 10.5 Copying one String to Another String


    The content of one string variable can not copy into another string variable by
    simply using assignment operator (=).


    That means the statements,


    ```

    str2=str1;

    str2="Hello";

    ```


    are invalid. Str1 and str2 are two string variables.


    We can copy one by one character from str1 to str2 until null character (''\0'')
    is encountered.


    # Program 10.5: Copying one string to another string.


    Output:


    Enter a string to copy: Computer Science

    The Copied string is: Computer Science


    # 10.6 Copying Two Strings together (String Concatenation)


    We cannot join two strings together just by simply arithmetic addition(+).


    That means the statements,


    ```

    str3=str1+str2;

    str3=str1+"string";

    ```


    are not valid. Where str1, str2 and str3 are string variables.


    The characters from str1 and str2 should be copied into str3, one after the other.'
