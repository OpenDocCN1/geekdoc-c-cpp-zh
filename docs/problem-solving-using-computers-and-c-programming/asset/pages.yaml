    # 2.5 High Level Language


    Program written in high-level language uses english words and mathematical symbols.
    The program written in this language is machine independent, means knowledge of
    machine is not required and program written for one machine can be executed on
    other machine.


    For example:

    (a) BASIC (Beginners All Purpose Symbolic Instruction Code) language, requires
    interpreter to translate program in BASIC language to the executable code.

    (b) C compiler translates C program into object code.


    # 2.5.1 Advantages of High-Level Language


    +   * Easy to use: High-level languages are easier to learn than low-level languages.
    The languages used in high-level languages are similar to english language, so
    they are easy to remember. The learning of high-level languages requires little
    or no computer hardware background.

    * Machine independent: Program written in high-level language can be run on different
    computers. Program portability reduces cost and time. Today JAVA has become more
    popular for its portability feature.

    * Fewer errors: Since, the translator is used, the compiler checks the error that
    occurs in the program. So errors can be easily located and corrected.

    * Size: The program has smaller size, since the program is divided into subprograms
    or procedures.

    * Control structure: Most high-level languages offer a programmer a variety of
    powerful control structures which are not available in low-level languages.


    +   For example:

    * Conditional statements (IF-THEN-ELSE, CASE etc.)

    * Looping statement (for, do-while etc.)

    * Nested statement (IF-ELSE IF etc)

    * Block structures.

    * Procedures or Functions.


    These control structures improves programming style and facilitated certain programming
    approaches such as structured programming.


    +   * Debugging: Program written in high-level language is easy to debug.


    # 2.5.2 Disadvantages of High-Level Language


    +   * Lack of flexibility: High-level language does not provide access to some
    special features of the machine as that of assembly language. Thus, some tasks
    cannot be easily performed using high-level language.'
