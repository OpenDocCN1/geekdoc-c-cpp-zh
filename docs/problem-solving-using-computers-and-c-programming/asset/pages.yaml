    # 12.3 Preprocessor Directive [April 16, 18]


    Preprocessor directives are classified into three categories:


    # 12.3.1 Macro Substitution Directives


    A macro is a small program or group of statements. If we want certain sequence
    of code repeatedly in the program, then we can place sequence of code in the macro
    and invoke it with its name, when required. The C preprocessor replaces macro
    call by its code. This replacement process is called macro substitution or expansion.
    There are different forms of macro.


    # 12.3.1.1 Simple Macro


    The formation of defining simple macro as,


    ```

    #define <name> <constant>

    nExamples:

    #define PI 3.142

    #define MAX 100

    #define CITY "NASHIK"

    #define TRUE 1

    #define FALSE 0

    ```


    To identify these macros as symbolic constant, their names are specified in capital
    letters.'
