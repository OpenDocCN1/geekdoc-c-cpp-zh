  md: '# Problem Solving Using Computers & ''C'' Programming


    # Definition:


    Problem-solving is a creative process which disobey systematization. To solve
    the problem, we should know "what must be done" rather than "How to do it". There
    are a number of powerful strategies that are reused in various guides in computing
    science. The most often is the divide-and-conquer strategy. The basic idea of
    divide-and-conquer is to divide the original problem into two or more subproblems
    which can hopefully be solved by efficiency by the same technique. If it is possible
    to processed with this splitting into smaller subproblems, we will reach the stage
    where the subproblems are small enough to be solved without further splitting.
    This way of breaking the solution to a problem has found unique in particular
    with sorting, selection and searching algorithms.


    The other problem solving strategy is dynamic programming. This method is used
    when we have built-up a solution to a problem via a sequence of intermediate steps.
    This method used to find a good or optimal solution to a larger problem. The techniques
    of greedy search, backtracking and branch-and-bound are examples of dynamic programming.


    # 1.2.1 Top-Down Design


    The goal of problem-solving is to implement an algorithm which is capable of design
    efficient computer program. Top-down design is a strategy which can be apply to
    the computer problem to find the solution. In this design complex problem can
    be solve in stepwise fashion. We make general statements that we have about the
    solution, one at a time and break them down into set of more precisely defined
    subtasks. The process of repeatedly breaking a task down into subtasks and each
    subtask into still smaller subtask must continue until we get subtasks that can
    be implemented as a program statements. Fig.1.1 shows the top-down design approach.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_9_0.png)


    # 1.2.2 Construction of Loops


    During program implementation we need to define data structures, series of iterative
    constructs, loops and computable expressions. In this we define how loops or conditionally
    executable statements are define in terms of algorithm.'
