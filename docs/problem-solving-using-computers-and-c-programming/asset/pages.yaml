    \ pointer. It is a variable which points to the data structure FILE. The structure\
    \ FILE is predefined in the header file stdio.h. This structure contains all information\
    \ about the file. The file pointer in C can be declared as:\n\n```\nFILE *fp\n\
    Means fp becomes a pointer to FILE structure.\n```\n\n# 14.3.1 Opening a File\
    \ [April 18]\n\nFile must be opened before any operation performed on it. While\
    \ opening a file, we must specify what we want to do with the file i.e. reading\
    \ or writing or appending.\nFormat of declaring and opening a file is as follows\n\
    \n```\nFILE *fp;\nfp=fopen(\"filename\",\"mode\");\n```\n\nwhere fp is a file\
    \ pointer\nfilename is the name of disk file to be opened\nmode specifies the\
    \ type and what we want to do with file\nFollowing are different modes in which\
    \ the file can be opened.\n\n| Mode string | Meaning |\n| r | Open for reading,only\
    \ |\n| w | Create for writing. If a file by that name already exists, it will\
    \ be overwritten. |\n a | Append, open for writing at end of file, or create for\
    \ writing if the file does not exist. |\n r+ | Open an existing file for update(read\
    \ and write). |\n w+ | Create new file for update (read and write). If a file\
    \ by that name already exists, it will be overwritten. |\n a+ | Open for append\
    \ at the end of file or create if the file does not exist. |\n\n+   - To specify\
    \ the file to be opened in text mode, append 't' to the mode string. (e.g. r,\
    \ r+, rt, wt, w+ etc.)\n- To specify the file to be opened in binary mode, append\
    \ 'b' to the mode string. (e.g. rb, r+b, wb, w+b etc.)"
