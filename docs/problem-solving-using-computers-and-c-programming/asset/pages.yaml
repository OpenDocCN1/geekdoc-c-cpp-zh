  md: '# Problem Solving Using Computers & ''C'' Programming Pointers


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_217_0.png)


    Memory addresses are simply numbers, so they can be assigned to some variables.
    Such variables that hold memory addresses of other variables are called Pointers.


    Let us assume, we assign the address of variable ''data'' to another variable
    ''p''. ''p'' becomes a pointer variable, which holds address of variable ''data''.
    This representation is shown in the Fig. 9.2.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_217_1.png)


    # 9.2.1 Use of Pointer in C Program


    +   1. Pointer can be used to pass information back and forth between a function
    and job reference point.

    2. Pointers provide a way to return multiple data items from a function via function
    arguments.

    3. Pointers also permit references to other functions to be specified as arguments
    to a given function.

    4. Pointers provide an alternate way to access individual array element.

    5. Pointers provide a convenient way to represent multidimensional arrays, allowing
    a single multidimensional array to be replaced by a lower-dimensional array of
    pointers.

    6. Pointers are more efficient in handling complex data structures and data tables.

    7. Pointers reduce the length and complexity of a program.

    8. Pointers increase the execution speed.


    # 9.3 Accessing the address of a variable


    The address of a variable can be obtained using the ampersand (&) operator. We
    have already seen this operator in scanf() function. The address of variable data
    can be retrieved using &data.'
