    \n# 11.3 Defining a Structure\n\nThe format of structure definition is as below:\n\
    \n```\nstruct structname\n{\n    member-type-1 member-1;\n    member-type-2 member-2;\n\
    \    ...\n    Member-type-n member-n\n};\n```\n\nFor example:\n\n```\nstruct empinfo\n\
    {\n    int empno;\n    char name[30];\n    char city[15];\n    float salary;\n\
    };\n```\n\nThe keyword struct declares a structure to hold different fields. In\
    \ the above example empinfo is a structure name, also called as structure tag.\
    \ It contains four members called fields or elements - empno, name, city and salary,\
    \ which belong to different types.\n\n# 11.4 Declaring and Initializing Structure\
    \ Variable\n\nWe can declare a structure variable, after defining a structure.\
    \ There are two ways to declare a variable of structure type.\n\n+   (a) During\
    \ structure definition:\n\nVariables associated with a structure can be declared\
    \ immediately after the definition of structure.\n\n```\nstruct empinfo\n{\n \
    \   int empno;\n    char name[30];\n    char city[15];\n    float salary;\n}\n\
    ```\n\nemp1, emp2, emp3 are structure variables.\n\nwhere emp1, emp2 and emp3\
    \ are structure variables."
