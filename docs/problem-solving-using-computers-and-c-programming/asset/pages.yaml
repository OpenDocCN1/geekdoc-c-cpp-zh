    The process of passing the actual value as an argument to a function is known
    as “function call value”.


    The process of passing the address as an argument to a function is known as “function
    call by reference”.


    Whenever, we pass address to a function, the parameter receiving the address should
    be pointer. The receiving parameter can change the value in a function.'
