    # 7.8 Scope of a Variable


    An variable declared inside a subprogram (i.e. function) is said to be local i.e.
    the variables are specific to that subprogram. It is called a local variable.
    A local variable can only be accessed within the function in which it is created.
    After the end of function, the local variable is automatically destroyed and it
    cannot be utilized elsewhere.


    Variables which are declared in the main program are available to all functions
    declared within it. These are called global variables. This means the global variables
    can be utilized both within and outside of the function.


