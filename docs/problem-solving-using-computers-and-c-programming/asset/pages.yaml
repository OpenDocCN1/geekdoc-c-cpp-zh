    # 3.1 Introduction


    C is a powerful flexible language that provides fast program execution. Its power
    and fast program execution come from its ability to access low level commands,
    similar to assembly language, but with high level syntax. The purpose of this
    chapter is to present an overview of the C programming language its origins, uses
    and program structure.


    # 3.2 C is a Middle-Level Language


    C is a general purpose structured programming language. A structured language
    offers a variety of programming possibilities. It supports control loops such
    as while, do-while, for etc. C is a middle level language because it combines
    the best elements of high-level languages with the control and flexibility of
    assembly language.


    Fig. 3.1 shows the C''s place in programming language.


    ![](img/19a476c19cc1340c167bd9a8fd2d791b_38_0.png)'
