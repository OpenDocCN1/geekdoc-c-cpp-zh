    # Input and Output


    First %s will print complete string and %8.4s will first reserve eight spaces
    for the string, of which only four spaces will be used to write the string; so
    we get four spaces as blank. Only first four characters will be printed and remaining
    four characters will be blank. It will be right aligned as:


    In C language, we have certain flags which are used to format the output. These
    flags are shown in Table 5.3.


    # Table 5.3: Commonly used flags


    | Flag | Meaning |

    | --- | --- |

    | c | o | m | p |

    | - | Data item is left justified. |

    | 0 | The blank spaces are replace by zero. |

    | + /- | The respective sign is given to numeric value. |

    | (blank space) | A blank space will precede each positive signed numeric data
    item. |

    | # | Causes octal and hexadecimal data items. |

    | (with 0 X) | To be preceded by 0 or 0X respectively. |

    | # (with g, e, f) | Causes a decimal point even if there are no decimal digits
    in all members. |


    # Program 5.9: How to use flags in a program.


    ```

    #include <stdio.h>

    main()

    {

    int x = 101;

    float y = 11.0, z = 3.3;

    printf("%6d %7.0f %10.1e \n \n", x, y, z);

    printf("%-6d %7.0f %10.1e \n \n", x, y, z);

    printf("%+6d %7.0f %10.1e \n \n", x, y, z);

    printf("%+6d %7.0f %7q # 7q", y, y, z);

    }

    ```


    The above program displays the output as:


    ```

    101 11 - 3.3e +000

    101 11 - 3.3e +000

    +101 11 - 3.3e +000

    11 11 - 3.3 - 3.300000

    ```


    In first line each number is right justified within its respective field width
    since, no flag is used. In second line -sign is given to the output to the left-justified.
    In 3rd line two operand will be preceded by +sign. In 4th line we have demonstrated
    the use of # flag.'
