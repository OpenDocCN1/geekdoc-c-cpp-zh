  md: "# Problem Solving Using Computers & 'C' Programming\n\nDefinitely we can design\
    \ multiway selection using if ladder. But the complexity increases and it reduces\
    \ both efficiency and readability of a program. The switch statement allows us\
    \ to list several alternate actions and choose one at runtime. The syntax of switch\
    \ statement is given below:\n\n```\nswitch <expression>\n{\n    case value1 :\
    \ statement1;\n        break;\n    case value2 : statement2;\n        break;\n\
    \    .\n    case value n : statement n;\n        break;\n    default : statement;\n\
    \        break;\n}\n```\n\nThe reserved switch is followed by an execution called\
    \ selector. The selector commonly has a value which is one of the original data\
    \ types [integer, character, boolean, subtype or renamed data items]. The value\
    \ of the selector determines the statement to be executed.\n\nEach of the case\
    \ labels represents one of the permissible values of the expression. If the expression\
    \ is of type, the case labels would represent integer values that fall within\
    \ the permissible range. Even though each case label is unique, they do not appear\
    \ in any particular order.\n\nIf there are 'n' cases in a switch statement, the\
    \ last case is a default case. When no value matches with the available cases,\
    \ the default case is evaluated. If default case is not present and no case matches\
    \ then program comes out directly from switch statement.\n\nThe use of break is\
    \ used to quit the switch statement after a particular case is matched. So only\
    \ one case will get executed at a time. If break is not used, then all the statement\
    \ followed by the matched case will get executed. Thus, break is must for the\
