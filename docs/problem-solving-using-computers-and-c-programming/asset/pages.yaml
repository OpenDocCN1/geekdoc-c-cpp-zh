  md: '# Problem Solving Using Computers & ''C'' Programming Pointers


    # 9.4.3 Need of Pointers


    Following points describes of pointers:


    +   1. Pointer is used for creating data structures such as linked lists, trees,
    graphs etc.

    2. Pointer enhances the capability of the language to manipulate data.

    3. Pointers allow working with dynamically allocated memory.

    4. Pointers reduce the length and complexity of the program.

    5. Pointers increases the execution speed.


    # 9.4.4 Advantages of Pointers


    Pointer consists of the following advantages:


    +   1. Pointers provide an alternate way to access individual array element.

    2. Pointers provide a convenient way to represent multi-dimensional arrays, allowing
    a single multidimensional array to be replaced by a lower-dimensional array of
    pointers.

    3. Pointers are more efficient in handling complex data structures and data tables.

    4. Pointers reduce the length of a program.

    5. Pointers increase the program execution speed.


    # 9.4.5 Applications of Pointers


    Applications of pointers are listed below:


    +   1. Pointers can be used to simulate passing parameters by reference i.e. the
    arguments can be modified.

    2. They provide an alternate method to access array elements.

    3. They are used for passing arrays and strings to functions.

    4. They are more efficient in handling complex data structures like linked lists,
    trees, graphs, etc.

    5. One of the most important use of pointer is a dynamic memory allocation where
    memory is allocated and released for a variable during run-time.


    # 9.5 Pointer Declaration and Initialization


    # 9.5.1 Declaration of Pointer


    +   * Pointer variables must be declared before they may be used in a C program.

    * When a pointer variable is declared, the variable name must be preceded by an
    asterisk (*) sign.

    * This identifies the fact that the variable is a pointer. The data type that
    appears in the declaration refers to the object of the pointer.'
