    # 8.5.2 Two-Dimensional Array [April 16]


    The array which is used to represent and store data in a tabular form is called
    as ''two dimensional array''. Such type of array specially used to represent data
    in a matrix form.


    The other option is to have a single array with 2-dimensional (rows and columns),
    which will store all the information as shown in the Fig. 8.7.


    | column 0 | column 1 | | column n |

    |---|---|---|---|---||

    | Subject | Maths | Computer | | |

    | Roll no | | | | | |

    | row 0 | 4001 | ... | ... | ... | ... |

    | row 1 | 4002 | ... | ... | ... | ... |

    | : | : | : | : | : |

    | : | : | ... | ... | ... | ... |

    | row n | : | ... | ... | ... | ... |


    Fig. 8.7: Two-dimensional array


    Here, rows of student roll no and column consists of subjects. So, the total items
    in this array would be,


    rows x columns


    A two dimensional array is referred as a matrix or a table.

    A matrix has two subscripts, one denotes the row and the other denotes the Column.
    The first dimension (i.e. the first index) might refer to the row number, and
    the second dimension (i.e. the second index) to the column number.


    # The general declaration of a 2D array is given as,


    ```

    type name [row][column];

    ```


    where, type specifies data type of the array

    name specifies name of the array

    row specifies number of rows in the array

    column specifies number of columns in the array


    +   - So, an array by the name ''value'' of character data having 3 rows and 1
    column will be declared as,


    ```

    char value [3] [1]

    ```


    +   - Now, a step further. To enter the values into a 2D array, we require nested
    for loops. The inner for loop indicates the column number, while the outer for
    loop indicates the number.


    +   - The rows are represented starting from 0 to n. The columns are represented
    starting from 0 to m. The size of the array, with n rows and m columns is given
    as n x m.'
