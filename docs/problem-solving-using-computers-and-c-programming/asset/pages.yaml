    # 3.4 History of C


    C was developed at Bell Laboratories in 1970 by Dennis Ritchie. Many of its principles
    and ideas were taken from the earlier language B and B''s ancestors BCPL and CPL
    (Combined Programming Language) was developed with the purpose of creating a language
    that was capable of high level, machine independent programming and would still
    allow the programmer to control the behaviour of individual bits of information.
    One major drawback of CPL was that it was too large for use in many applications.
    In 1972, a co-worker of Ken Thompson, Dennis Ritchie returned some of the generality
    found in BCPL to the B language in the process of developing the lang.


    Initially for a long period C was used in Bell laboratories until 1978 by Brian
    Kernigh and Ritchie at definite description of the language. The Kernigh and Ritchie
    description is commonly referred as "K & R". Due to important features of C, computer
    professionals got impressed by it and began to promote the language. C''s power
    and freedom become apparent. Because of this, the Unix operating system which
    was written in assembly, was almost immediately rewritten in C. During the rest
    of the 1970 C spread throughout many colleges and universities because of its
    ties to UNIX and the availability of C compilers. Many different organisation
    began using their own versions of C causing compatibility problems. In response
    to this in 1983, the American National Standards Institute formed a committer
    to establish a standard definition of C which became known as ANSI standard C.
    Today C is in widespread use a rich standard library of functions.'
