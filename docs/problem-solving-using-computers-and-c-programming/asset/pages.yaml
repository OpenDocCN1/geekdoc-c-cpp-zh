    # 11.11 Unions


    Union is similar to structure as a collection of related data items grouped together.
    There is a major distinction between them is that - union can handle only one
    member from a group of members, whereas structure handles all members in a group
    at time.


    Syntax:


    ```

    union union_name

    {

    data_type member1;

    data_type member2;

    } var1, var2, ...;

    ```


    Example:


    ```

    union sampleinfo

    {

    int x;

    float y;

    char z;

    } sample;

    ```'
