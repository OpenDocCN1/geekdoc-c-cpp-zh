    A programming language should be closed to the problem. Each and every problem
    solved by the computer has to be broken down into logical steps which has the
    following basic operations.


    +   1. Input data,

    2. Processed data and

    3. Output data.


    The computer program should be written using exact rules of that language. Unless
    the syntax rules are not followed, the commands would not be understood by the
    computer.


    # 2.2 Language Evolution


    +   1. Toggling switch language: Earlier programming was used to be done with
    computer and the toggling switches during 1950.


    +   2. Machine language: This is the language which is understand by the computer.
