    # 12.4 Difference between Macros and Functions [April 15]


    | Macros | Functions |

    |---|---|n| 1. The macro call gets expanded by macro processor. During the macro
    expansion the macro call is replaced by the macro content. | 1. The function call
    gets compiled by the compiler. During execution, when function calls, the control
    gets transferred to the first statement of the function. The control returns back
    to the caller at the statement after the function call ends. |

    | 2. In macro, there is no need to transfer the control, so execution time is
    less ie faster. | 2. A function requires the transfer of control twice when it
    is called and when it returns. So it takes more time to execute. |

    | 3. Every macro call is replaced by macro content. If the same macro occurs many
    times in a program then every is replaced by same macro content. So more memory
    space is required. | 3. A function call is not replaced by its content, so less
    memory space is required. |

    | 4. With large macros, the expansion time and program translation time would
    get increased compared to function. | 4. With large function, the program translation
    time would get decreased compared to macros. |

    | 5. Macros are called by ''call by name'' technique of parameter passing. | 5.
    Functions are called by ''call by value & call by reference'' techniques. |


