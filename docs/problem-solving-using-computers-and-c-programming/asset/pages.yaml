    # 1.6 Flowchart


    Flowchart is an important tool used by programmers and analysts for tracing the
    information flow and logical sequence for data processing. It helps us in understanding
    logical structure of the problem. Every problem can be represented symbolically
    with the help of flowchart. Flowchart is a pictorial representation of an algorithm
    that uses boxes of different shapes to denote different types of instructions.
    These boxes are connected by solid lines having arrows to indicate the flow of
    operation and the exact sequence in which the instructions are to be executed.
    Flowchart shows the flow of the whole process, which includes the data inputs,
    operations or computations performed, decision taken and output generated.'
