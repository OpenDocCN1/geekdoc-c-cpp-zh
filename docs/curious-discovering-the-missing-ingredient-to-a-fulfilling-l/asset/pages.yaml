  md: '# # Curiosity as an Anxiety Antidote


    Beth Comstock, President of Integrated Media at NBC Universal, attributes her
    career accomplishments to "her passion for new challenges." She explained that
    it''s easy to get anxious and shy when you are surrounded by intelligent people
    and making decisions where millions of dollars are at stake. Asked how she copes,
    she said, "I found that curiosity propels me forward. Sometimes I look back on
    a situation where I was reluctant to speak up, even when I knew I could have added
    value, or was afraid to meet someone new and regret the missed opportunity. That''s
    what I tell myself now: "You don''t want to miss this opportunity. Get in there.""


    Just like Beth, curious people show a readiness to plunge into experiences regardless
    of how it feels and what it looks like. It''s not that curious people are free
    from anxiety. They get anxious just like everyone else (anxiety can range from
    most of the time to rarely). Instead of focusing on how much anxiety they feel,
    curious people benefit from what they do with their anxiety. Curious people act
    on their curiosity and explore whatever is intriguing them, taking those anxious
    feelings and any discomfort they bring along for the ride. Instead of relying
    on premature descriptions of whether feelings are good or bad, people are good
    or bad, or situations are good or bad, curious people test things out. They show
    a willingness to explore.


    By enhancing curiosity, we can become more comfortable tackling change and difficult
    life circumstances. For instance, young children are often scared to go to the
    hospital—and for good reason. Hospitals are filled with the walking wounded, moaning
    and bleeding in the hallways; nurses carrying needles the length of a baby''s
    torso; and rooms filled with beeping sounds, pulsating lights, and strange-looking
    gadgets. Two researchers in Australia wondered if they could reduce children''s
    hospital fears by giving them a chance to physically play with a variety of medical
    equipment and ask questions about how they worked.


    The author''s hypothesis was simple: Children who get to be curious and explore
    scary-looking medical equipment on a safe visit to the hospi-'
