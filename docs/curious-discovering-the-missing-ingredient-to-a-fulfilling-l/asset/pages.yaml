  img_proc: true
- pgno: 49
  md: '40 years later!). Those college-aged youngsters identified as very curious
    in later adulthood had several characteristics in common:


    +   - They had rich emotional lives filled with both positive and negative feelings
    (further evidence that negative emotions are not “bad”).

    +   - They were actively searching for meaning in life (this included questioning
    authority and dominant, widely accepted ideas).

    +   - They didn’t experience themselves as being restricted by social norms.

    +   - They chose careers that gave them opportunities to be genuine, authentic,
    independent, and creative.


    Each of these qualities suggests ways to retain the intense curiosity and preference
    for the novel (over the familiar) that characterizes enlightened youth. They also
    point to the opposite. A hyperfocus on seeking security, avoiding distress, and
    sticking to a comfortable routine lessens one’s curiosity and, in turn, satisfaction
    and meaning in life.


    Contrary to popular belief, our personality can change even if we are no longer
    in our awkward adolescent years. We can’t change our genetic code, gender, age,
    ethnicity, or prior life events (the good, bad, and ugly). But we can change how
    we think and which activities and goals we invest in. Even if you feel little
    connection to these qualities now, you can become a curious explorer. Science
    gives us reasons to be optimistic.


    When we speak about the possibility of change, we have to be concrete about how
    this happens in practice. We know that emotions last for seconds, moods last in
    the vicinity of hours, and our personality is something that is forged over the
