  md: '# Curiosity Helps Us Work through the Conflicts and Uncertainties in Our Relationships


    Don''t take my word for it, the research shows that being curious can help resolve
    our conflicts so that we can find meaning, maturity, and other positive elements
    from difficult events. Exploring our inner world is a backdoor route to make sense
    of difficult personal material as we try to return to a state of emotional equilibrium.


    Returning to Aron''s work on romantic couples from the last chapter, in one study,
    he wanted to know whether participating in a novel activity improved handling
    of negative emotions. You might recall that couples worked their way across a
