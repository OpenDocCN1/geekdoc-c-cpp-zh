  img_proc: true
- pgno: 159
  md: '# ## Your Words Tell a Fraction of the Story


    Be genuine in words and actions. Your posture, the sound of your voice, your facial
    expressions, eye contact, the distance between you and them, how and when you
    touch, all communicate emotions—positive, negative—and whether you are attentive
    and engaged.


    # ## Don''t Be an Energy Vampire!


    Show that you can absorb negative emotions and events and that you don''t dish
    it out excessively or irresponsibly. Provide some reassurance that suffering is
    going to be minimal for the person talking to you. Disagreements, anxiety, and
    anger are all normal and par for the course during challenging first encounters.
    What matters is how you respond. Unless you go for the highly curious, skip-the-rungs-of-intimacy
    approach, start off with low-maintenance interactions that are full of energy
    and enthusiasm. Just as when you are dancing, you need to pay attention to your
    partner. If you fall out of step, observe their movements and fall back into place.


    # ## Be Open


    Expect in advance that you might diverge in some major areas. If you view these
    differences as opportunities instead of dangerous roadblocks, you can get the
    best possible outcome in the situation. Don''t avoid topics out of fear. So what
    if you differ in your views of race, politics, and religion; it might end up being
    a harmonious mix. Just stay open and actively listen to what they have to say.
    If you are afraid you might miss their point, check in and ask: “It sounds as
    if you are saying . . . is this right?” or “Let me see if I am following you .
    . . am I missing anything?” Everybody wants to be understood. Don''t guess. Be
    open, and find out.


    # ## Focus on the Interaction, Not the Ending


    Remember that you only shoulder 50% of a conversation. You can never control the
    outcome, only your actions and perceptions. Judge your performance, not the outcome.
    The worst-case scenario is you don''t make a new friend or start a relationship.
    It might be a civil, friendly conversa-'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'tion where you both accept areas that cannot be bridged. It might end abruptly.
    I can strike up a conversation with a beautiful stranger while standing on line
    to get Rolling Stones tickets. I can be incredibly funny and ask all the right
    questions in all the right places. And yet, when I ask for a phone number, she
    shakes her head and turns away. I might think it''s me and my bad haircut, or
    I might recognize that if she wanted a relationship, I executed my part perfectly,
