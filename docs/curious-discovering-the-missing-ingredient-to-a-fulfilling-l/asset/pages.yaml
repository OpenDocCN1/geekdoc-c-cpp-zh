    # The Intersection of Interest and Meaning


    To understand what intervenes between triggering and enduring interest, we can
    turn to a study of more than 1,000 college students. Before the students began
    an introductory psychology course, they were asked about their general interest
    in the subject. Subsequently, these same students were asked at regular intervals
    about their grades and what they thought about the field of psychology. These
    check-ins continued for two years and the students'' academic records were reviewed
    to see which courses they took and how well they performed in college.


    The scientists leading the study found that students with an initial strong interest
    in psychology were inspired during the semester, enjoyed coming to class, and
    because they were interested and attentive, were more likely to apply the knowledge
    to their own lives. With a stronger personal connection to the material, the more-interested
    students received better grades, enrolled in more psychology courses, were more
    likely to major in psychology, and had higher grades in these courses.


    One reason that interested students performed so well is that their goal was to
    master as much about psychology as possible. In stark contrast, less-interested
    students tried to get by with as little effort as possible to avoid bad grades.
    Different approaches to that very first psychology course led to dramatically
    different college careers.


    The same patterns are found outside the classroom. In another study, researchers
    observed nearly 200 athletes at a summer football camp. Athletes entering camp
    with the greatest interest in football found the greatest enjoyment and value
    in their daily training. When you are interested in something, the little things
    matter—practices, scrimmages, and waking up in the middle of the night to run
    or lift weights. This open, receptive mindset is visible and attractive to others.
    Athletes rated as the most'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'talented and desirable by coaches were not simply the most physically gifted,
    they were the ones who were the most interested when camp started.


    Whether it is school, work, sports, parenting, household chores, or doing taxes,
    we are going to be interested and motivated if we can connect our immediate actions
    to larger, personal values. When we can''t, disengagement, burnout, stress, and
    poor performance are much more likely to occur.


    # On the Basketball Court: When Meaning-Making Fuels Passion


    The athlete Bo Kimble excelled by bringing values into the forefront when faced
    with a heart-breaking personal loss.


    In the late 1980s, Bo Kimble and his best friend, Hank Gathers, held the basketball
    world in thrall. They went to high school together in a rough neighborhood in
    Philadelphia and took their school to the prestigious public league championship
    in 1985. From there, they received full scholarships to attend the University
    of South Carolina. When the coaches who recruited them were fired, they fled together
    to a little-known college basketball team at Loyola Marymount University in Los
    Angeles. While the average college basketball team was lucky to score 100 points,
    Kimble and Gathers shocked the sports world by leading their team to score 157,
    150, and 148 points in three consecutive games over four days.


    In 1989 Hank Gathers became the second player in history to lead the nation in
    both scoring and rebounds with Bo Kimble not far behind him on the list. Then
    in 1990, in the middle of a game—not just any game, the semifinal of the West
    Coast Conference championship tournament—right after making a thunderous dunk
    that drove more than 3,000 fans into a frenzy, Hank Gathers collapsed and died
    on the court.


    When Bo Kimble returned to the basketball court, he led his team through the final
    tournament of the season with the top 64 teams competing. He brought little Loyola
    Marymount past some of the best teams'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'in the country to the final 8. He graced the cover of Sports Illustrated magazine.


    What allowed Bo to focus, what gave him purpose, was to honor his best friend
    by living out their shared dream. Even though Hank Gathers was one of the best
    basketball players, he struggled to shoot free throws. At one point, he practiced
    using only his left hand to get it up to speed with his dominant right hand. After
    Gathers died, Bo shot the first free throw of each game left-handed in honor of
    Gathers. He made the first three shots he attempted, which is no mean feat. And
    just like Gathers the year before, he led the nation in scoring. When he was drafted
    into the NBA with a multimillion-dollar contract, he continued to honor Gathers
    by making his first free throw of each game with only his left-hand.


    I''m sure Bo''s coaches and teammates had mixed feelings about those left-handed
    shots as they were far less likely to sink, costing the team points, and perhaps
    led to a few team losses. But Bo''s coaches would have been foolish to ask him
    to stop, and they didn''t. By connecting his work to profound values about friendship,
    his interest, and effort intensified. Besides his own accomplishments, Bo inspired
    teammates, other teams, and a younger generation to emulate his game and character.


    There is much to learn from Bo and his open-minded coaches and teammates. We,
    too, can learn to connect what we do to our values. If we are trying to motivate
    others, we can help them do the same.


    # Values as a Catalyst and Guide to Meaning


    Our values influence why we do the things we do, and the rewards of moving in
    the direction of our values motivate us to persist despite challenges.


    Identifying our values is critical to creating a fulfilling life and can begin
    with a simple questionnaire. It is based on decades of research by therapists
    helping clients move from thinking about changing to taking the next step of doing
    something about it.


    Some of the values listed below might be irrelevant in your life and some might
    be the guiding forces that drive your behavior and decisions'
