    # Strategy 2: Defusing Nasty, Frightening Thoughts


    Going back to what makes us curious, we might recognize novelty, challenge, and
    uncertainty, but because we don''t think we have the skills to cope or comprehend,
    we get too anxious and leave situations to do something that makes us feel calmer.
    Perhaps we end up in a job far beneath our education and training, we end up in
    a relationship with someone who doesn''t interest or challenge us, or we end up
    bored in our free time because we are unwilling to try new things that might make
    us look silly. Don''t think this pertains to you? Because of these thoughts, people
    often avoid getting out on the dance floor, and if they do, they don''t let it
    all hang out, they play it safe, snapping their fingers, softly clapping their
    hands, swinging their arms just a bit, moving their hips just a bit, nothing that
    might bring attention. The result? Challenges are kept to a minimum, lessening
    our chances for finding meaning. We can handle and comprehend more novelty and
    challenge than we think. What keeps us bored or anxious most of the time are thoughts
    that we accept literally.


    Critical to working with anxiety is recognizing the power of words. What''s problematic
    is when we treat our thoughts as if they cannot be questioned or tested and are,
    instead, the truth. Your friends might ask you to go mountain biking with them
    on an off trail through dense woods, something you have never done before. Your
    mind starts racing: "my friends will laugh," "I can''t do this," blah blah blah.
    If you get caught up and buy into these thoughts you are doing what psychologists
    describe as "fusion." Fusion is about viewing thoughts as the literal truth ("I
    can''t do this") instead of what is actually happening ("I am having the thought
    that I can''t do this"). Fusion makes it nearly impossible to be in the present
    moment and act in ways that fit with cherished interests and values.'
