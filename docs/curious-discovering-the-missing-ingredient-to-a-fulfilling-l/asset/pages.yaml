    two kids. They ground him; they bring him equanimity in a chaotic world. The money
    and benefits of being a lawyer provide security and well-being for his family.
    His work is important and meaningful, but it is secondary to being a doting husband
    and father in his life narrative.


    Carlos’s purpose provides the basis for defining goals and making decisions in
