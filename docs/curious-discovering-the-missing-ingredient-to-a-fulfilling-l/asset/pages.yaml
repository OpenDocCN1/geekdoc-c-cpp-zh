    # Strategies to Live Fully with Anxiety


    The premise that anxiety is bad and harmful and that it must be eliminated is
    an idea that has outlived its time. Therapies to eliminate anxiety shouldn’t be
    trusted. Scientifically informed techniques can help you form better relations
    with your anxiety and not get caught in a death-grip struggle with worry and wear
    yourself out being anxious about being anxious.


    # Strategy 1: A Survival Guide for Quicksand


    We’ve talked about dialing up the Explore knob to begin aiming more and more of
    your actions toward the direction of your stated values instead of futile efforts
    to control anxiety by doing more of the same. With the goal of starting to think
    about working with instead of against anxiety, I want to quote another metaphor
    from the work of Steven Hayes. He calls it the Quicksand metaphor. Why the metaphors?
    By meditating on them, we can get out of our heads and shift perspectives to focus
    on new strategies and face old problems.


    Suppose you came across someone standing in the middle of a pool of quicksand.
    Without ropes or tree branches to reach them, the only way you can help is by
    communicating with them. They shout, “Help, get me out,” and begin to do what
    people usually do when they are stuck in something they fear: struggle to get
    out. When people step into something they want to get out of, be it a briar patch
    or a mud puddle, 99.9% of the time, the effective action to take is to walk, run,
    step, hop, or jump out of trouble.


    This is not so with quicksand. To step out of something it’s necessary'
