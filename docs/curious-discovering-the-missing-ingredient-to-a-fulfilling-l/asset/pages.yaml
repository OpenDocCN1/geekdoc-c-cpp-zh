    Case closed? Not so fast. In the last few years, skeptical neuroscientists working
    independently found new results that challenge this interpretation—among them
    Jaak Panksepp at Bowling Green University, Kent Berridge at the University of
    Michigan, Brian Knutson at Stanford University, and Richard Depue at Cornell University.
    To discover how the brain generates emotional experiences, scientists often have
