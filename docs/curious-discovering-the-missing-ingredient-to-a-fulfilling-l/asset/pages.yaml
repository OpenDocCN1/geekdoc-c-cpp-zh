    cared for and valued because you are showing interest in learning about them.
    This will increase their commitment to what you care about. Second, when rewards
    are linked to their strengths, values, and performance, you create a positive
    memory that is forever linked to the activity.


    If you have an employee who is incredible at keeping work morale high and makes
    the workplace more enjoyable and everyone more productive, give out a citizenship
