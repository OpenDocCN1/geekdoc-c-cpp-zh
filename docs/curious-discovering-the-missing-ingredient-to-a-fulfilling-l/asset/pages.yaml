- pgno: 177
  md: 'As an active member of the relationship, we lose our objectivity, failing to
    see our partners as they are (as other people who are less familiar with them
    would see them). If we want to re-create that initial rush of positive feelings
    and rapid expansion during the early days of our romance, if we want to be interested
    and our partner to feel the same, we have to change mindset—from mindless drone
    to curious explorer.


    I can learn a great deal about my partner by watching her in action with another
    couple. Hearing my partner tell a story that I heard before can take on new meaning
    when I watch other people listen intently, laugh hysterically, or be enthralled
    by my partner. Their attraction to my partner intensifies my own. As social creatures,
    we value the opinions of people we care about. Although it sounds crude, my partner''s
    stock value goes up as I appreciate anew what is so amazing about this person
    whom I decided to bring into my life.


    Besides becoming increasingly grateful and attracted to my partner, I can discover
    new things. My partner is going to learn about my likes and dislikes and because
    of that, she is not going to share everything about her past and everyday actions.
    We all learn what gets a positive reaction, what doesn''t, and then modify what
    we do next based on these rewards and punishments (not responding to what my partner
    cares about is essentially punishment by neglect).


    When we spend time with another couple, two new people with unique tastes that
    differ from my own are going to draw out stories from my partner that I might
    have never heard before. As I witness this, my partner becomes novel and interesting,
    and this effect lasts well beyond any conversation or situation. And it''s not
    just the telling of stories—new people affect how my partner is going to think,
    feel, and act.


    With another couple, my partner might be more assertive and dominant (as opposed
    to falling into a quiet, more submissive role with me) or goofy and playful (as
    opposed to tending toward being serious and intellectual with me because those
    are the kinds of conversations that I regularly draw into her). We can look at
    our partners from new perspectives, collect new details, and begin to grasp how
    complex they really are compared to the false idea that we already know everything
    about them. If'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'you are willing to be open and curious, you can enjoy realizing that there
    are things you think you understood about them that you didn''t, and there is
    always going to be unknown information awaiting discovery.


    Richard Slater, a psychologist at Stanford University, extended research about
    the ways two people can refuel their interest and excitement after being together.
    He matched 60 unacquainted married couples into pairs, and had foursomes do the
    45-minute closeness induction procedure where they picked up cards with intimate
    questions on them and took turns answering them. Other couples worked their way
    through 45 minutes of mind-numbing small-talk questions. His results were amazing.


    First, couples generally felt a great deal closer to other couples after the closeness
    questions than those who worked with the small-talk questions. In fact, many of
    them appeared to be on their way to forming real friendships, passing along phone
    numbers to meet after the experiment was over. In contrast, everybody in the small-talk
    group appeared to be ready to depart quickly when the session ended; they weren''t
    happy or upset, they just felt a lack of energy throughout the conversation.


    Second, each couple in the closeness group felt better about their own relationship
    after the interaction. They felt more satisfied about the partner than they came
    in with after sharing intimacies with another couple.


    Third, the reason they felt more satisfied about their relationship was that they
    felt a surge of positive feelings, they found the entire task to be novel and
    interesting, and they "learned new things about their partners." In a mere 45
    minutes in a sterile laboratory, talking to another couple led them to grow (even
    if only a tiny bit) in their relationships. In the immediate aftermath, they reported
    viewing both their overall relationships and their partners as more interesting
    and satisfying. Although we don''t know how long these thoughts and feelings last,
    just the fact that we change long-standing views suggests these new experiences
    are portals to seeing our partner from new angles and perspectives.


    As my mentor and research collaborator Art Aron said to me, "I think one of the
    ways that couples can make their life richer, fuller, and cope with boredom, is
    with other couples. It is certainly true for me and Elaine. We have one couple
    we are really good friends with and they'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'bring to us things we would never have done, and we do the same for them.


    The research and examples I have been focusing on look at couples, but your relationship
    can expand by bringing any other person or persons into the picture. But be sure
    to look for curious explorers. Look for interesting people, not someone who is
    going to put you in a foul mood.


    Sometimes the worst people to get us to do new things or give us advice are the
    people who know us best, our romantic partners, best friends, or parents. As soon
    as someone else says the exact same thing, we listen and are motivated to go do
    something new. When we are very close to someone and see them as an extension
    or growth of ourselves, we often require another person who is more removed and
    objective to ignite the flame. Other people bring the new into our relationship.
    We get to peak through the beginner’s mind. This is one of the simple truths for
    preserving novelty and interest for the long haul.


    Just remember, you need to share new people in your life with your partner for
    it to influence the relationship. An early death to a relationship is almost assured
    when there is a widening gap of unshared interests, people, and lives.


    If you turn to the appendix of this book, you will find detailed instructions
    for applying these scientifically informed strategies to invigorate your own romantic
    relationship.


    # Final Thoughts


    What this research says is that being more adept at appreciating the mysteries
    and uncertainties of relationships and life is where true fulfillment can be found.
    Go beyond the need to predict, understand, and control your social world. Attend
    to what you don’t know, expand the boundaries of who you are and what you do,
    follow your instinct of what is interesting to you and what is interesting to
    other people, and this will lead to positive changes in your social interactions
    and relationships. Understanding these concepts may be all you need.'
