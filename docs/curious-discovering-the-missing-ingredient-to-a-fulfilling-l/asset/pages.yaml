  img_proc: true
- pgno: 161
  md: 'Paying attention to differences requires us to adopt a new mindset; we break
    out of our assumptions and expectations to see the person or situation in a new
    light, bringing a fresh lens to the relationship.


    So which is better—same or different? And how relevant is the answer, given the
    fact that in matters of the heart, what we “know” is not necessarily what we “do.”
    Scientists know that regardless of what people say, they are not politically correct
    or rational when choosing new friends and lovers. Some people attract us, others
    repulse us, and we often strategically search for certain qualities that we may
    never have articulated.


    If human beings desire growth and challenge (even if it leads to temporary discomfort),
    then similar people will sometimes be less attractive than people with unique
    knowledge and experiences that complement our own. In which case, we should be
    most attracted to new friends or lovers who offer maximum possibilities for expanding
    the self, rather than carbon copies of ourselves who already share our perspectives
    and interests.


    Most of us experience a classic conflict when trying to form a relationship: We
    seek out the rewards of excitement and connection, and we want to prevent possible
    pain and rejection. When considering whether to attempt a new relationship, we
    seek the answers to two questions.


    # Are They Desirable?


    We consider how attractive someone is in terms of how much we think we can expand
    or grow if we entered a relationship with them. There is certainly no reason to
    enter a relationship if we can get everything we want without them.


    # Does This Relationship Have a Chance?


    We consider how realistic it is that we can form and maintain a relationship with
    someone and thus be able to expand.


