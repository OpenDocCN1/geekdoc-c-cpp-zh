    expressions, posture, body movements, tone of voice, and so on. If you want to
    truly connect with someone, listening is insufficient; you must observe them.
    Don''t expect people to verbally express their dismay at hearing another of your
    feeble stories without a plot or punch line. Politeness often prevails. If you
    really want to know what someone is thinking, pay attention and be receptive to
    the myriad of ways they are communicating with you.


    When people aren''t curious, it requires a great deal of effort and energy to
    try and get on the same page with them—what we might call high-maintenance interactions.
    There is persuasive research on the crucial skill of recognizing the emotions
    of other people and rapidly synchronizing with them as they change from one moment
    to the next. Paul Ekman, the distinguished emotion researcher, found that people
    who are open to new experiences and curious in general are more skilled at detecting
    and adjusting to these shifting emotions and thus are better at connecting with
    their conversational partners. Such synchronization allows people to work together
    and to understand what others are thinking, talking about, or doing. These are
    called low-maintenance interactions.'
