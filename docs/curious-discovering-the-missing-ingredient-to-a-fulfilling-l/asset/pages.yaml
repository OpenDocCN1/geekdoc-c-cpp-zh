- pgno: 238
  md: '# Risk-Taking and Intimacy


    The high-sensation seeker is at greater risk for nearly every type of risky sexual
    behavior; sex at a younger age, high number of sexual partners, sex with multiple
    partners, unprotected sex, sex with strangers, sex with prostitutes, combining
    drugs and sex, and unwanted pregnancies. Being a high-sensation seeker doesn''t
    mean these sexual experiences are going to be a problem, but the potential danger
    is substantial. For instance, high-sensation seekers are more likely to have sex
    with someone with genital herpes, HIV, or AIDS. To them, the short-term pleasures
    often outweigh the costs. Worse, they often minimize the costs, being less likely
    to use condoms and birth control. Thus, there is an overabundance of HIV and AIDS
    patients who are high-sensation seekers.


    The sexual risk-taking linked to sensation-seeking is just one contributor to
    their difficulties in forming lasting, meaningful romantic relationships. High-sensation
    seekers tend to see love as a game of flirting, arguing, and challenging each
    other. This also involves devaluing faithfulness and commitment, with sexual mischief
    the norm rather than exception.


    Like highly curious people, high-sensation seekers recognize the value of spending
    time with people different from themselves, people who complement and expand them.
    They also don''t view conflict in black-and-white terms. Showing distress tolerance,
    arguing is often a vehicle for enhancing relationships—a source of sharing, brutal
    honesty, excitement, and energy. High-sensation seekers open the door to greater
    closeness and intimacy, and games and play have their place. But treating love
    as something to be the winner (at you give me more than I give you) is toxic for
    creating healthy relationships.


    Having a partner in constant worry that they are going to bore you doesn''t help
    a relationship. Supporting this idea, high-sensation seekers are less satisfied
    in their relationships and more likely to have affairs and divorce their mates
    than anybody else. Even worse things happen when you put a high- and low-sensation
    seeker together. Infidelity, violent arguments, stonewalling, and breakups are
    extremely likely. They just don''t understand each other''s interests.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'There is one exception to these relationship problems. Partners with similar
    high-sensation-seeking tendencies tend to be extremely compatible, constantly
    finding ways to stimulate and challenge the other.


    # The Appeal of Criminal Activity


    The search for thrills and excitement can also lead to illegal, criminal behavior
    that is far worse than speeding on the highway and serial one-night stands. Why
    do people break into homes but take nothing from them? What would motivate a highly-paid
    and well-known celebrity like Winona Ryder to shoplift from Saks Fifth Avenue?
    Within each of us lies a certain intrigue with deviant behavior and breaking the
    rules. For those who live seemingly straight-laced lives, this curiosity lies
    dormant. It’s so weak that it can be pushed out of consideration by rational thought.
    Then at unexpected times, this intrigue awakens, motivating us to explore dark
    crevices we know we shouldn’t enter. It’s the desire to know what it feels like
    to commit crime. It’s the need to experience the uncertainty of getting caught.
    I interviewed a highly intelligent, well-mannered woman in a white-collar job
    who shared her delinquent moments.


    I have been privileged enough to never lack any material possession or be of any
    distance from monetary access. But at a time when I was working in Europe, I found
    myself shoplifting small-cost products from street kiosks. I recall thinking that
    street kiosks practically invited theft. One vendor, products strewn about, many
    hitching spots, and easy escape. So one day I tried it. I swiped a piece of 5-cent
    gum. To my surprise, I didn’t feel any better or worse about myself afterward.
    I was intrigued at how easy it was. Soon I began stealing bubble gum nearly every
    time I went, regardless of whether I was buying anything else. Then on a couple
    of occasions, I decided to up the risk and go for something larger—like a water
    or juice bottle. Again, it was so easy. I was content knowing that I could do
    this. I didn’t feel ashamed. My crimes were petty, I wasn’t running someone’s
    livelihood. Sure, later I upped the stakes a few times, but I wasn’t doing major
    harm. I loved'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'the exhilaration of outwitting the system. Just a few times, here and there.
    Holding my stash, looking at it later, I felt seductive.


    The exhilaration of not getting caught is a part of these illicit sensation-seeking
    tendencies. Criminal acts add a pleasurable dimension to their personae.


    At the far end of the criminal spectrum are murderers and rapists like Ted Bundy
    and the Ku Klux Klan. Originally, the KKK was designed to be an innocent escape
    from boredom. As historian Wynn Craig Wade describes: “A few charismatic leaders
    lured in unhappy, uneducated youth looking for thrills and adventure. Wearing
    bedsheets to look like ghosts, they had fun scaring slaves who feared ghosts and
    demons and held superstitious beliefs about the dead. Taking advantage of their
    frustrations and failures to gain social mobility, the leaders of this sect slowly
    indoctrinated their members into seeing how superior they were, how they could
    scare and terrorize anyone. The playful pranks degenerated into torture, castration,
    tarring and feathering, beatings, and lynchings. Violent thrills originated from
    humble beginnings.


    Hannah Arendt reached this conclusion when she wrote of “the banality of evil.”
    Meditating on Adolph Eichmann and the Nazi regime, in a moment of clarity she
    realized that great evils in the world are committed by ordinary people. Seduced
    by the appeal of harming other people and ruining their lives, violence often
    originates as an outlandish idea for finding fun and excitement. Burning forests,
    robbing banks, raping men and women, and setting off bombs can be an antidote
    to everyday tedium and pain.


    This idea doesn’t sit well with us. It’s easier to envision acts of senseless
    violence being committed by monsters who are nothing like us. Although it is often
    true, a person with high-sensation seeking who happens to also be impulsive, aggressive,
    and lacking in self-control can find themselves being violent to entertain themselves.
    Surrounded by deviant peers and without proper guidance, curiosity can lead them
    to “the intrinsic appeal of evil.” Of course, we are talking about extremes. Saints
    and sinners are the endpoints on the continuum of curious people.'
