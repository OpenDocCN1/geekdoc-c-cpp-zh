- pgno: 90
  md: 'much of what surrounds us is more captivating than we thought. We are more
    likely to view difficult situations as challenges instead of threats to our safety
    or ego, and generally we enjoy ourselves a little more. Let me explain what I
    mean by this distinction:


    +   - Situations are viewed as *threatening* when we believe the demands of a
    situation outpace our available resources (abilities, social support, etc.), and
    this is intimidating and scary.

    +   - Situations are viewed as *challenges* when we believe the resources needed
    to cope effectively are at our disposal.


    When we are in a good mood, stress is transformed into interest. We are more willing
    to funnel energy and effort into activities. We essentially become the ideal worker,
    student, parent, friend, and athlete that everyone wants on their team.


    # ## Engaging Our Strengths


    We can actually focus on *increasing* the challenge of situations to engage our
    strengths. When we use our strengths, we feel energized and alive. We experience
    a sense of flow, interest, and immersion. We aren''t self-conscious; instead,
    we are focused on the task at hand and perform at our best.


    I had an opportunity to work with a client in therapy named Fred, who intentionally
    created space for his strengths to surface in his work. Fred is a janitor at Grand
    Central Station in New York City. For an unskilled worker, he earns a decent salary,
    but as one of the busiest areas in the city, Grand Central isn''t a pleasant place
    to work as a janitor. For years, he was embarrassed by the repetitive, dead-end
    work that he says "defines him." Eight-hour shifts of cleaning the station to
    perfection undone by careless, garbage-tossing commuters and the bodily fluids
    of homeless people. His actual work is far less interesting than how he ultimately
    deals with the repetition and frustration.


    We talked about his strengths, and of the many that were apparent, one stood out:
    He could create games for any household or street gathering'
