    getting rid of dopamine did not stop their ability to enjoy them-'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'selves. But did stop them from wanting food or, more accurately, from wanting
    to do anything! The rats looked like a pack of apathetic teenagers zoned out in
