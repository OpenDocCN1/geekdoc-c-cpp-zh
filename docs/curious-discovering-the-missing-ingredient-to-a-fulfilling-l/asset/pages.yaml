    A business manager I interviewed noticed that someone had planted new flowers
    in front of the office building and seemed to be tending to them on a regular
    basis. Upon discovering who the person was and expressing gratitude, she decided
    to give the woman a weekly bonus just as she would for a gardener. The result?
    A gesture of love became another work assignment. In all likelihood, the flower-loving
    employee will start to think less about the plants and more about doing well to
    maintain this added income. And if she stopped being paid, what we know is that
    she is likely to stop caring for the garden. Money is not meaningful on its own,
    so it makes sense to skip the money and focus on what you want to enhance—interest
    and meaning for the task at hand. I am not criticizing this particular manager’s
    kind intention: I am pointing out that money often doesn’t provide the incentives
    we want.


    Create rewards with personal meaning attached to them. Discover what that is by
    learning about the values and interests of the person you are trying to motivate
