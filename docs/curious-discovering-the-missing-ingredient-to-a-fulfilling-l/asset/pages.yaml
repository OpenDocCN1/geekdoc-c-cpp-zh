    # # Sensation Seeking: The Need for Speed, Thrills, and Excitement at Any Cost


    To fully understand curiosity, we have to understand people who crave the most
    intense novelty and thrills they can find. These people are best described as
    high-sensation seekers. Love or hate them, sensation seekers are rarely ignored.
    Consider two high-sensation seekers immortalized in history.


    # ## Person A


    He grew up in a relatively poor family. Buried in his books, he saw college as
    his ticket to a better life. It paid off. Earning an academic scholarship, he
    attended a small community college. He excelled and was offered a scholarship
    to study alongside some of the best students in the world at Stanford University.
    In this new terrain, he was transformed. He was'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'good looking, stylish, witty, and refined in his manners. He worked as a counselor
    for a suicide-crisis hotline, saved a three-year-old boy from drowning in a lake,
    and the local police department called him a hero for apprehending a purse snatcher
    on the street. After graduating, he became a rising star in the Republican Party
    and worked on the committees of various governors and congressmen. When he was
