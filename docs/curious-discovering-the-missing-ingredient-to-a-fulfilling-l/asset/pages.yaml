- pgno: 74
  md: '# 4 The Curious Moment Sparking Intrigue in the New and Meaning in the Mundane


    A fulfilling life begins with interesting, meaningful moments. In 2007, the Princeton
    economist Alan Krueger, Nobel laureate Daniel Kahneman, and their colleagues published
    an eye-opening paper called “Are We Having More Fun Yet?” As a result of the massive
    social progress, economic prosperity, and technological advancements of the past
    50 years, an endless array of options has opened up for how to use our free time.
    In the background was a lingering question: Did these new opportunities allow
    us to spend more time doing what we cared about most, thus increasing our satisfaction
    and meaning in life?


    For too many of us, too frequently, the answer is a resounding no. Most people
    spend less than 20% of the day engaged in what could be termed meaningful activity
    (e.g., talking with close friends, spiritual practice and prayer, love-making,
    playing) or meaningful work.


    # A Fulfilling Life Is Made of Fulfilling Moments


    It doesn’t have to be this way. Our lives don’t have to be dominated by the “daily
    grind.” Curiosity can be harnessed to transform mundane, unsatisfying tasks in
    everyday life into something genuinely interesting and'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'enjoyable. These “interest enhancing” strategies allow us to intentionally
    find and sculpt wonder, intrigue, and play out of the everyday events that confront
    us. Once our interest is aroused, curiosity plays a second role in ensuring that
    these moments endure over time.


    Without being interested in what we do, it is nearly impossible to be motivated
    to reach the goals that are most important to us. When we are disinterested, our
    commitment, effort, creativity, perseverance, performance, and a host of other
    valuable qualities suffer.


    These two simple processes—triggering intrigue and sustaining interest—are at
    the heart of a fulfilling life.


    # The Pleasures and Pains of Our Daily Routine


    Given the near-universal desire to be happy, or at least happier than we are,
    we are surprisingly ignorant of what contributes to our happiness quotient. Attempts
    to improve the quality of our lives must begin with insights into how we feel
    about the activities that monopolize our time. A few questions come to mind: How
    much time do we spend doing things that we enjoy the most, giving us a reason
    to wake up in the morning? How much time do we spend in activities that are unsatisfying?
    With freedom to do as we please, do we spend it widely doing things that are truly
    pleasurable and meaningful? Can we make less desirable activities more pleasurable?


    Alan Kruger and Daniel Kahneman opened our eyes to the average American’s daily
    routine. Their approach to studying everyday people was groundbreaking. They recognized
    that each of us is an unreliable reporter of what actually happens in our lives
    and particularly, how we felt at the time something happened. Diswist our recollections
    of the past, often remembering the good as better than it was, remembering the
    bad as being much worse that it was, and telling little white lies so that we
    can make a good impression on other people. So what these scientists did is ask
    thousands of people to walk them through a single day in their lives. Study participants
    relived episodes of their day like a movie, shifting from'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'one scene and location to the next, from when they woke up until they went
    to sleep.


    By capturing what actually happens in people''s lives, we can diagnose problems,
    discover our strengths and how to optimally use them, and make inroads into what
    to accept and what to change.


    # What We Allocate Our Time and Energy to Becomes Our Life


    With these improved scientific tools, we can take a peek behind the curtains of
    people''s lives. To figure out exactly what Americans do in a typical day, interviewers
    talked with a whopping 4,000 Americans. Study participants were asked to split
    up the prior day into 15-minute periods and relive what they did, who they were
    with, and how they felt. We can be confident in the accuracy of the findings because
    these 4,000 people were selected to represent every part of the United States,
    matching census data on age, gender, ethnicity, and so on.


    With the small amount of time that we will be on this planet, what percentage
    of our day is enjoyable, interesting, and meaningful? Do we squander our precious
    opportunities to be alive in the present?


    Discovering what grounds us, what is fulfilling to us, we can look for ways to
    strengthen these moments—doing it more of the time, making them last longer, or
    being more mindful so that we can better savor them. It''s just as important to
    closely examine our unfulfilling moments. You might be surprised at how much of
    your time falls into this realm. With insight, we can ask ourselves if we are
    ready to invest in some attempts to win back some of these unfulfilled moments.
    Are there obvious places to squeeze in more well-being at work, in our relationships,
