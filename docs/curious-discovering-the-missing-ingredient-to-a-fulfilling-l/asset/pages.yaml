  img_proc: true
- pgno: 57
  md: '# # Curiosity as Nature''s Conduit for a Successful Life


    Pull down a recent book on happiness or some other similar topic from the shelves,
    open up the index, and look for the words _curiosity_, _interest_, and the rest
    of the family (_novelty_, _openness_, etc). Maybe curiosity gets a sentence, but
    often there isn’t a single word mentioned in hundreds of pages. As I have learned
    in my more than 10 years studying this topic, we cannot afford to take curiosity
    for granted if we want to move closer to the life we wish to lead.


    Curiosity is not bound by age, gender, race, intellect, or culture. It’s a universal
    quality of humans and the majority of our animal friends. However, we are each
    endowed with a temperament that makes us a bit different in our exploratory tendencies
    and the psychological barriers that block our way. All of this is visible both
    in our actions and in studies of the three-pound blob of neurons between our ears.


    As a better vantage point to capitalize on and cultivate curiosity, we need to
    consider its origins. In the next brief chapter, we will take an evolutionary
    perspective and peek inside the brain.'
