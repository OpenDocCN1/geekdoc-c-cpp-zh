  img_proc: true
- pgno: 25
  md: '# Our Ability to Get Easily Accustomed to Positive and Negative Changes


    There is a reason to be skeptical of curiosity and any new strategies that might
    lead to lasting fulfillment. We possess an amazing ability to rapidly readjust
    our moods and feelings in response to changes in our circumstances. Scientists
    refer to this as our well-being “set-point.” Except for a few major unpleasant
    events such as becoming a widow or becoming stricken by a serious disability,
    disease, or unemployment, we quickly become familiar with changes in our life
    and drift back to how we felt beforehand. This point we return to after bad or
    good things happen to us is our typical mood. This typical mood is genetically
    determined, relatively out of our control, and somewhat immune to what happens
    to us except for brief downward and upward shifts.


    This is a fantastic resource because it prevents us from being overwhelmed by
    life’s challenges and tragedies. Among other unpleasant events, you are going
    to be rejected, you are going to fail at something important, and you will get
    ill and injured more than once. It’s wonderful to know that we overcome most of
    the obstacles thrown our way and bounce back.


    Human beings generally want to predict, understand, and control what happens to
    them. After all, if we didn’t try to gain closure about an event, we would be
    in an eternal state of limbo, incapable of making decisions or drawing conclusions
    about what happens to us. This might seem like a good thing after an unpleasant
    event. After all, being able to gain closure gives us a sense of comfort. We feel
    secure and safe; we feel confident; we feel intelligent.


    But what happens to us after a positive event? When your romantic partner kisses
    you, saying, “I want to spend the rest of my life with you,” you will probably
    experience loving feelings. Among other pleasant events, you are going to feel
    grateful when you experience someone’s kindness, learn something new, accomplish
    difficult feats, and hug, kiss, and make people laugh. Settling on a clear explanation
    and coming to closure about what a positive event means to us, dampens our positive'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'feelings and cuts them short. The parts of our brain that are activated by
    new experiences, the pleasures of savoring the moment, the connections between
    nerve cells that are created when we try to make sense of what is going on, come
    to a screeching halt. The positive experience is over as soon as we label it,
    filing it away in our library of prior knowledge.


    So the big question lingers. Is it possible to shift our set-point upward and
    sustain increases in our well-being? Yes, and the answer lies in curiosity. By
    themselves, simply being optimistic and hopeful will succumb to adaptation. The
    same goes for efforts to increase other strengths such as kindness, forgiveness,
    humor, bravery, or zest. That’s why I am not giving you another book about thinking
    positively or being friendlier.


    If we want to prolong positive experiences, if we want a more fulfilling existence,
    we need a new mindset. Acting on our curiosity is the alternative to seeking closure
    and certainty. What gets in the way of our ability to adapt and return to our
    regular routine is the same way we try so hard to get rid of novelty and uncertainty.
    As long as something is novel, we are still in the process of finding and creating
    meaning. When something is uncertain, there are multiple possible outcomes for
    what can happen next. The ending is unclear and thus, the event is still ongoing.


    Curiosity is different than other ways of being fulfilled in that it’s about appreciating
    and seeking out the new. It’s about being flexible, recognizing the novelty and
    freshness of the familiar. Instead of trying desperately to explain and control
    our world, as a curious explorer we embrace uncertainty. Instead of trying to
    be certain and confident, we see our lives as an enjoyable quest to discover,
    learn, and grow. There is nothing to solve, there is no battle waged within us
    to avoid the tension of being unsure. We don’t take positive events for granted,
    we investigate and explore them further. Recent scientific findings show that
    when we are open to new experiences, when we are flexible in how we approach people
    and tasks, when we relish how the unknown far outweighs what we know, positive
    events linger longer and we extract more pleasure and meaning from our world.
    This book is about unleashing the curious explorer within you.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# The Yin and Yang of a Fulfilling Life:

    A New Approach with Curious Exploration

    as the Engine


    As a clinical psychologist, I treated scores of children and adults suffering
    from debilitating mental health problems. Several of my clients felt life wasn''t
    worth living. I will never forget the people who reached a point in their lives
    where suicide was considered a viable option; they haunt me to this day. I learned
    a great deal about what it means to live fully and completely from working with
    them. The well of despair some patients showed in therapy was certainly tied to
    their suffering. They wanted the pain to go away and saw suicide as the ultimate
    escape from the self. But suffering is not the cause of suicidal thoughts. People
    try to kill themselves because of the absence of the positive. They can''t find
    a reason to live. In their minds, their life lacks meaning and purpose.


    Discovering this was a turning point in my thinking. My ability to understand
    human nature had been strangled by a fanaticism to describe and catalog people''s
    problems while ignoring their positive experiences and strengths. By ignoring
    the positive and focusing on the negative, like many therapists who devote their
    lives to helping people, I was dismissing half of what it means to be human.


    When I contacted clients a year after treatment ended, I discovered that many
    showed few if any signs of the problems that had once rendered them helpless.
    Yet, far too many seemed unfulfilled and lost. Many of my former clients were
    living lives that were little more than a mechanical routine—wake up, work, sit
    in front of a television or computer screen, go to sleep, and repeat—with a few
    scattered moments of deep engagement such as births, weddings, and deaths. I became
    acutely aware that it was not enough to focus solely on what psychologists call
    the "presenting problem." Adding positive experiences with the goal of balancing
    the pull of the negative in a person''s life is a starting point.


    But focusing on the positive is only one part of the equation. I needed a more
    complex model that reflected the actual lives of the people I knew and the people
    I treated. In the often one-sided focus on positive experi-'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'ences and strengths, positive psychology and happiness researchers underestimate
    the value of negative feelings, uncertainty, and stress. Negative thoughts and
    feelings cannot be ignored or avoided. Effectively handling the pain and stress
    that life inevitably brings is an essential part of creating a rich, meaningful
    existence.


    If you search for a tensionless life, you will find little to be satisfying. Coping
    with negative experiences and being psychologically flexible are often springboards
    to peak experiences and personal growth. Throughout this book, we''ll look at
    how this works.


    Both the positive and the negative need to be addressed. Anything less fails to
    capture the entire package of what it means to be human and lead a satisfying,
    fulfilling life.


    # # What You Will Discover in This Book


