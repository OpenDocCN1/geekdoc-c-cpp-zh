    # Basic Psychological Needs Scale


    The Basic Psychological Needs Scale measures several elements of well-being, that
    is, the degree to which a person believes their needs for autonomy, competence,
    and sense of belonging are satisfied.


    Autonomy refers to feeling that one''s choices and activities are self-determined
    as opposed to being controlled by internal (such as guilt) or external pressures
    (such as other people''s rules).


    Competence refers to feeling a sense of confidence and mastery in one''s environment.


    Belonging refers to feeling that satisfying and meaningful connections are being
    made with others and you feel cared for, validated, and understood by others.


    To find how well you satisfy the three basic needs, read each statement and circle
    the number that corresponds to how true the statement is to you.'
