    Sensation seekers are people willing to take on physical, social, financial, and
    legal risks to satisfy their need for novel and intense experiences for their
    own sake. They despise being bored. Often, risk is necessary to satisfy their
    desire to feel alive. But risk-taking is a means to an end, with the rewards being
    new, exciting experiences.


    Low-sensation seekers aren''t merely adverse to risks. They see no point and can''t
    find a good justification for seeking out thrills. Low-sensation seekers are more
    sensitive to pain and other stimulation. They don''t value new sensations. This
    is why high- and low-sensation seekers can''t understand each other and make bad
    bedfellows.'
