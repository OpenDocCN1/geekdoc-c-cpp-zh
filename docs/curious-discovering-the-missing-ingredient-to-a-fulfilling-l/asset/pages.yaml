  md: '# # 8 The Dark Side of Curiosity

    Obsessions, Sensational Thrills,

    Sex, Death, and Detrimental Gossip


    A strange contradiction exists when we closely scrutinize curiosity. Despite all
    of the benefits of being a curious explorer, there is a tipping point. Extreme
    curiosity at the wrong time or in the wrong people introduces a dark, destructive
    side. Just like Russian nested dolls that can be pulled apart to reveal yet another,
    smaller version inside, the dark side of curiosity intrigues us. To some degree,
    this is normal and relatively harmless—think of rubbernecking at the scene of
    a fatal accident, reading newspaper articles about teenage arsonists, and following
    the exploits of celebrities who are living train wrecks. The more extreme or weirder
    it gets, the more curious we become.


    To date, positive psychology writers and researchers have had little to say about
    the yin and yang of the positive and negative. Most of the discussion focuses
    on optimism, gratitude, love, positive emotions, bravery, and happiness, as if
    more is always better. But a fair and balanced story about curiosity has to acknowledge
    that too much of any positive experience or “strength” can become a liability.
    Depending on how it’s expressed, curiosity can be perverted, annoying, meddlesome,
    impairing, and even deadly. Too much curiosity can lead to obsessive behavior,
    dangerous thrill-seeking, and detrimental nosiness.


    A fuzzy boundary exists between healthy and unhealthy interests.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Interests are generally a healthy expression of investing in activities that
    are personally meaningful or nourishing. One person’s interests can be exciting,
    enviable, or inspiring, or the object of ridicule, disgust, or boredom. At one
    party, a group is mesmerized by a marine biologist who shares stories of how seahorses
    are the only creatures where males give birth, how a certain kind of octopus can
    change colors to communicate with friends, and so on. At another party, the same
    biologist is mocked for taking a greater interest in the sex lives of sea creatures
    than his own. Interests can be bizarre or amusing, depending on the context. Although
    most are relatively harmless, some aren’t.


    # Obsessive Passions


    At 38 years old, Steve Wiebe lost his job on the same day he signed the deed to
    his new family home. Married with two kids under nine, unemployment fueled his
    self-loathing. Steve wanted to succeed at something, to be the best at something,
    and this was something that had eluded him his entire life. Of endless possibilities
    he might have pursued, he homed in on breaking the 25-year-old world record score
    of a classic video game called Donkey Kong. He bought an arcade machine and kept
    it in the garage. To pacify his wife’s mixed feelings about his new interest,
    he practiced only at night—that is, every single night, for months.


    On one particular day he was making inroads on the record. All of his playtime
    was videotaped so that he could send it in to the gaming authorities who kept
    track of these historic events. Steve was alone, presumably watching his two kids,
    and working his magic with the joystick when his youngest son started bellowing
    (as captured on the tape):


    > Dad!!

    > I can''t believe this is happening, guys.

    > Wipe my butt!'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Wipe your bottom? I will in a second, bud.

    Can you bring me some toilet paper?

    Derek, Derek, I''m going to get the world record.

    Don''t play! Don''t play!

    Derek

    No! No!

    Derek

    Stop playing . . . Donkey Kooooooong!

    Derek. You stop it.


    And so the backtrack on the tape went as Steve sat mesmerized in front of the
    screen for hours while his kids called for his attention. Steve ended up crushing
    the world record that day. On the car ride to getting his Donkey Kong score immortalized
    in the Guinness Book of World Records, he explained to his nine-year-old daughter,
    Jillian, what it meant to him. She wisely replied, "Some people ruin their lives
    to be in it."


    For many, this sort of obsessive passion comes at a price of broken marriages,
    deteriorating health, and disconnect from the rest of society. Steve was fortunate
    that his wife recognized how important it was for his self-esteem to conquer the
    demons of a lifetime of failed conquests.


    Many of our behaviors are motivated by the attainment of some kind of reward,
    whether extrinsic or intrinsic. Extrinsic rewards are derived from our environment
    such as grades, money, and praise from others. We work hard or take on a task
    to get a carrot. Intrinsic rewards, on the other hand, are things we do for their
    own sake, regardless of the external payoff. Examples of intrinsic rewards include
    personal fulfillment, satisfying an interest, and experiencing a sense of pleasure
    or accomplishment.


    Athletes and musicians are excellent examples of curious explorers motivated by
    intrinsic rewards. Consider the ballet dancer who practices daily despite painfully
    blistered feet. Extreme athletes run ultramarathons, attempt to swim the world''s
    oceans, and peak Mount Everest. A boxer finds the stamina to prevail until the
    final round, nose broken, lip bleeding, and vision fading. Sure, these performers
    may also be motivated by the'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'cheering crowd, lucrative contracts, and recognition. However, the hours and
    effort athletes and artists devote to their pursuits and the pain they endure
    are typically about more than the elusive glory of obtaining a trophy or an encore.
    To sustain these long-term interests and to excel, these people are motivated
    by something more—passion for what they do. Researchers have found that athletes
    and musicians motivated solely by extrinsic rewards perform worse than their abilities
    allow, get injured more often, have worse relationships with peers and coaches,
    and quit more easily during difficult times.


    Not every activity that sparks an interest becomes a passion. Of your various
    hobbies and interests, passions arise when you enjoy the investment. Passionate
    activities begin to define a person and become a fundamental source of meaning.


    Consider 13-year-old Kyle Krichbaum. Whereas most children ask their parents for
    giant water guns, comic books, or bicycles, Kyle asked for a vacuum. According
    to his parents, Kyle has been fascinated with vacuums since he was an infant—he
    was mesmerized when his mother vacuumed the house. So his parents gave him his
    first toy vacuum at the age of one. At the age of two, Kyle dressed up as a Dirt
    Devil for Halloween. Soon, Kyle began to incorporate vacuums into every aspect
    of his life. At school, his artwork had vacuum themes such as (the first?) vacuum
    calendar. At home, he created vacuums out of cardboard and Lego pieces. By the
    time he was in elementary school, Kyle was vacuuming his classroom and principal''s
    office during recess. It''s not that Kyle didn''t like playing with other children,
    he preferred to vacuum.


    Today, at age 13 Kyle owns more than 165 vacuums and uses almost all of them—in
    rotation. When Kyle is not in school, he can be found vacuuming his house, up
    to five times each day. Kyle''s extensive collection includes the first vacuum
    ever made in 1907, the Hoover Model O, now worth an estimated $10,000. In Kyle''s
    house, vacuums can be found in every room of the house, with the exception of
    his sister''s room.


    Intrigued by Kyle''s passion for vacuums, the media highlighted his story in newspapers
    and talk shows. He was even invited to speak at the'
  merge: -1
  img_proc: true
- pgno: 228
  md: '2008 Vacuum Dealers Trade Association national conference. A vacuum savant,
    he found a way to turn his passion into a business by repairing vacuums for neighbors.
    With his profit, Kyle buys more vacuums. This is all a great experience for Kyle,
    who wants to eventually own a vacuum repair shop. But what Kyle really wants to
    do is create the first soundless vacuum.


    But setting these positive benefits aside and acknowledging that Kyle’s parents
    don’t mind having the cleanest floors in the neighborhood, they would prefer he
    go out and play more often. He is at a crucial age for learning effective social
    skills. If over time Kyle continues to spend time alone with his vacuums, it may
    become difficult for him to build successful relationships. In addition, we can
    see how Kyle’s vacuuming disturbs his family life. For Kyle’s parents, they must
    be careful never to leave anything of value lying on the floor. And Kyle’s sister
    wishes for a few moments without the endless buzz of a vacuum.


    Canadian psychologist Robert Vallarand has identified two types of passion—harmonious
    and obsessive. Harmonious passion refers to activities that we choose to engage
    in on our own terms. We decide when to participate and when to stop. With this
    flexibility, we are able to reduce our involvement or stop anytime it becomes
    a hassle. Many if not most of us are able to find passions that occupy significant
    spaces in our lives while leaving room for other pursuits that we care about.


    People with obsessive interests feel controlled by their passions and experience
    unwavanted pressure to persist even when their minds and bodies say otherwise.
    This pressure might come from the outside world such as parents, coaches, and
    teachers, or it might come from internal motives such as guilt or a need to be
    accepted. Vacations, holidays, sicknesses, and other disruptions (positive or
    negative) to their obedient devotion are frustrating. Curious exploration is stifled
    as they ruminate about their lack of dedication and what they should be doing
    instead of being mindful, appreciating whatever lies before them in the present.
    Trapped in the past or future, their well-being is compromised.


    Obsessive passions are all-consuming and people become dependent on them in a
    similar vein as alcohol and drug addictions. While this persistence'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'may lead to benefits such as commitment and skill mastery, the lack of flexibility
    sucks people away from life’s other offerings.


    Obsessive passions also negatively impact physical health. While most surfers
    enjoy the ocean in the spring, summer, and fall, it can become dangerous in harsh
    winter or storm conditions. This knowledge does nothing to deter obsessive surfers.
    The same goes for athletes with injuries and writers with headaches. People with
    obsessive passions ignore signs of deterioration, and by continuing with their
    pursuits, their maladies only worsen.


    At this point, it’s important to differentiate obsessive passions from the obsessive
    acts found in people suffering from the psychotic problem known as obsessive-compulsive
    disorder (OCD). People with OCD engage in repeated compulsive behaviors (checking
    to see if the stove is off, counting stairs) in hopes of neutralizing their unwanted
    thoughts and impulses (such as images of nude children frolicking in a playground).
    Normally, in OCD, there is no curiosity and no intrigue about these uncontrollable
    thoughts and behaviors. In fact, they are quite distressing, which explains their
    attempt to avoid them. People with OCD are curious about their passions, even
    if they don’t always enjoy them.


    For both Steve and Kyle, strong interests degraded into obsessive passions. When
    engaging in activities we’re passionate about, it’s easy to lose control and remain
    oblivious of the consequences. Curiosity-guided activities have the potential
    of becoming obsessive passions. The content of obsessive passions tends to be
    relatively benign. Sometimes the obsession ends up being another human being.'
