    into long-term memory, and it is crucial for us to create new memories.


    Insights about the hippocampus arrive from years of experiments and surgical procedures.
    People with damage to the hippocampus have problems recalling specific personal
    experiences. For us to sustain curious experiences so they can become part of
    our long-term identities, guiding us in the direction of fulfillment, we need
    the hippocampus—a vital portion of the limbic, or “emotion,” system of the brain.


    When the circuitry in the hippocampus is working on all cylinders, we can do more
