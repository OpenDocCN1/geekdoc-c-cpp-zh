    # Anxiety as a Fear of Making Mistakes


    One reason that we don''t get into the fray and explore is because we''re anxious
    about making mistakes (some of us get more upset than others). We get so focused
    on not looking like idiots that we get trapped inside our heads talking to ourselves.
    This leaves us with less energy to be an active part of whatever we are doing.
    Worrying about making mistakes prevents us from being interested and creative.


    There is a nifty study by Ellen Langer, who asked Harvard college students to
    give unprepared speeches to an audience. She wanted to see'
