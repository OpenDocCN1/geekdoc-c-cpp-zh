    Whether it''s childcare, working for a living, spending time with other people,
    or getting along with our next-door neighbors, there are painful, dull, and mundane
    moments that are as frequent as the interesting and exciting ones.


    Important, valuable activities that are unsatisfying put us in a bind.'
