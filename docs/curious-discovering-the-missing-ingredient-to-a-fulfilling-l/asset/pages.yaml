    and enjoy devoting considerable effort to accomplish them.


    # Defining Purpose


    There are several hallmarks of a life defined by purpose. When purpose is a guiding
    force, there is a central theme in a person’s life narrative or story. If you
    think of your identity as a building, purpose is the architectural framework that
    provides an understanding of the totality of who you are. Goals such as completing
    a master’s degree or becoming a better listener with close friends provide an
