  img_proc: true
- pgno: 243
  md: '# Channeling Sensation Seeking


    We can see signs of sensation-seeking in children as young as two years old. Toddlers
    who grow up to be high-sensation-seeking adults are:


    +   - Quicker to reach for and react to new toys and sounds

    +   - Choosing more intense and stimulating toys

    +   - More likely to explore

    +   - More likely to take physical risks

    +   - Less distressed when their parent leaves them when there is sufficient entertainment


    Finding a good way to channel their curiosity and energy is the key from early
    childhood all the way into adulthood. Social influences—from parents and teachers
    to friends, coaches, and mentors—play a huge role in what happens. An adolescent
    sensation seeker can be attracted to risky sports and taken under the wing of
    a caring coach. He might just as easily be attracted to crime and drugs and taken
    under the wing of a local drug dealer. High-sensation-seeking teens are about
    three times more likely than low-sensation-seeking teens to experiment with illicit
    drugs.


    Mentors and peers are important. High-sensation seekers raised in positive and
    loving homes are less likely to engage in negative and illegal thrill-seeking
    activities. The war on drugs, violence, and crime would benefit from a closer
    look at the world of curiosity. It is one of the primary motivators for why people
    do things, and given inadequate guidance, it’s easy for people to take a turn
    toward the darker side.


    Teddy Roosevelt, Chuck Yeager, General Patton were all high-sensation seekers.
    Some historians describe each of them as antisocial thrill seekers who were able
    to lead successful lives (to say the least). It’s all about finding the right
    environment and mentors at as early an age as possible. High-sensation seekers
    can be guided toward healthy substitutes that satisfy their need for intense novel
    and varied experiences.'
  merge: -1
  img_proc: true
