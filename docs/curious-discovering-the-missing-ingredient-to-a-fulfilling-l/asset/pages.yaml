  md: 'I spoke to a middle-aged man about his dating partner of three months. Today,
    his social calendar is packed with dinner plans, parties, and tickets to music
    events in out-of-the-way clubs. He confided, “If only some of these characters
    saw me back then, planted in front of a computer eight hours a day at work only
    to come home, pop in a Pop Tart, and spend the night playing video games. I still
    have my old self and now, with some improvements added to it.”


    Expanding by being in a close relationship is similar to a shared bank account
    where each person has access to the other’s money. But the exchange goes beyond
