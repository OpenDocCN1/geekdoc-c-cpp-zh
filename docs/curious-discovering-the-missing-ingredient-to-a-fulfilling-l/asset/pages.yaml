- pgno: 106
  md: '# # 5 Creating Lasting Interests and Passions


    Moments that are overflowing with interest and excitement make us feel alive and
    hungry for more. Yet, most of our curious moments are short-lived. They may be
    happy experiences that lift our moods momentarily. Or they may be experiences
    that are simply focused on dispelling uncertainty and finding an answer. Pursuing
    a good time is nothing to feel guilty about, but strings of unconnected pleasurable
    moments, are not the secret to a fulfilling life.


    After being exposed to an interesting situation, we can catalog it with other
    positive memories and move on. Or, we can try to hold on to that captivated attention
    and extend it. This is a tricky proposition. We are talking about creating relatively
    enduring preferences, interests, and passions for topics, things, people, and
    places. We are seeking renewable, lasting sources of meaning that can regularly
    feed our curious appetite. Strengthening and deepening interests is typically
    self-generated. What I mean is that we might find ourselves questioning, exploring,
    and creating links to what we find to be important in our lives. This process
    of drawing connections is started by those initial, lingering positive feelings
    you get from an interesting moment that you don''t want to end. There are strategies
    that increase the likelihood that curious explorations set the foundation for
    enduring interest. Enduring interest is largely shaped by the personal meaning
    and value we find in an activity.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# # A Taste of Passionate Pursuit


    I am reminded of my first intense passion of adulthood. As a gawky, uncoordinated
    teenager, I could never find a sport that interested me and that I could excel
    at. These two issues—being good at something and being interested—were hopelessly
    tangled. Football really interested me. Running at full speed, propelling your
    body at full strength into the lone person carrying the ball without reservation
    sounded cathartic. The only problem was that the dream sequence looked different
    on the field. When a 150-pounder smacks into a 300-pound slab of meat, it shreds
    vital muscles and tendons. Yet I didn''t even have the "pleasure" of hitting someone.
    In my very first game, I tried to tackle a wide receiver running up the sideline.
    I dove after him, missed, and snapped shoulder-first into the ground. Within minutes,
    I realized that I couldn''t move my right arm. I spent the next several weeks
    in a body cast, wrapped in plaster from waist to shoulder with a forearm cemented
    across my chest.


    During a long stint of physical therapy, I remember watching the 1988 Olympics,
    particularly the shot put. Once upon a time—776 B.C. in Ancient Olympia, to be
    exact—it was the most popular athletic event in the world. Nowadays, the shot
    put is typically viewed as a silly thing human beings do to entertain themselves,
    and the number of spectators it draws rarely exceeds 20 people. For me, it was
    perfection. One person inside a 7-foot circle with one objective: throw a 12-pound
    metal ball as far as possible. No matter how far that ball went, no matter whether
    you won or lost, only one person was accountable. It was athletic purity. It was
    the perfect test of strength, speed, balance, and discipline.


    I became instantly enthralled, and spoke to my twin brother, who was one of the
    captains of our high school track team, about how to join and whether there were
    any good shot putters on the team. It turned out that we didn''t have a single
    shot putter, none of the coaches had experience training the shot put, and our
    high school had been forfeiting this event for years. I spoke to the coach, and
    my passionate pursuit began.


    I started vigorously training my body, lifting weights, drinking wheat grass and
    protein shakes, and armoring my small frame with muscle. On'
