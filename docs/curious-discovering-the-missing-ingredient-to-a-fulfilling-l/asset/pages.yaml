  md: '# # Acknowledgments


    One of the benefits of writing a book is that I can give a public proclamation
    of gratitude to the important characters in my life.


    It goes without saying that one of the reasons this book came into being is an
    article D. T. Max wrote about me in *The New York Times Magazine* (Sunday, January
    7, 2007) about my course on the science of well-being. I received a large number
    of media requests and a number of invitations to write a book that describes the
    broad complexity of well-being, beyond happiness. It continues to astound me how
    seemingly arbitrary moments can change your life if you are open and willing to
    explore them.


    With boundless support by administrators and fellow faculty members in the psychology
    department at George Mason University, I have been given absolute intellectual
    freedom with my research program. Thank you for providing an environment that
    allowed this project to germinate.


    I also had the generous financial support of several organizations, including
    the National Institute of Health, the Anxiety Disorder Association of America,
    and the Veterans Integrated Service Network, that allowed me to study what I loved.
    I never served in the military and thus, it is with great honor to provide some
    small sign of my appreciation by treating combat veterans suffering from unbearable
    anxiety and producing research showing the strengths that veterans continue to
    possess (decades after their tours of duty). It’s my hope that something in this
    book can aid veterans in their often difficult transition from war back to civilian
    life.


    Science can be a lonely endeavor. Forging the kind of relationships that energize,
    inspire, and allow me to effortlessly be myself has been essential.


    For the colleagues offering collaboration, expertise, mentorship, support, and
    needed input during this enduring passion of mine, thank you: Arthur Aron, Catherine
    Bagwell, Ingrid Brdar, Kirk Brown, Joseph Ciarrochi, R. Lorraine Collins, Ed Diener,
    Susan David, Jon Elhai, Robert'
