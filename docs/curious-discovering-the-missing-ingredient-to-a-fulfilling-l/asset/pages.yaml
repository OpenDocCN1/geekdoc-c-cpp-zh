- pgno: 151
  md: 'It feels good when someone is interested in you. It makes you feel desirable,
    causing you to be more interested in and feel close to the person showering attention
    on you. Perhaps best phrased by Dale Carnegie in his 1936 classic *How to Win
    Friends and Influence People*, “you can’t catch fish with strawberries and cream.”


    Along with scientists at the University of California at Davis, we took another
    step toward understanding what exactly curious people do that made them desirable
    to be around. We wanted to look at how curiosity affected long-lasting relationships
    as well as new ones. There were two parts to this study. Once again, participants
    interacted with strangers for a few minutes to determine what type of impression
    they made. We also conducted interviews with participants’ college friends, “best”
    friend, and parents about their strengths, weaknesses, and how they typically
    act. By combining these perspectives, we created a picture of what it feels like
    to spend time with very curious people.


    After a mere five minutes of getting to know them, strangers said that curious
    explorers were different than less curious conversation partners in several ways.
    Among other things, they tend to exhibit the following traits:


    +   * Display a wide range of interests

    +   * Highly enthusiastic, energetic, and animated

    +   * Talkative

    +   * Dominant in conversation

    +   * Express their ideas well

    +   * Say and do interesting things (they were intriguing and sometimes, surprising)

    +   * Appear relaxed and comfortable

    +   * Completely attentive and engaged in conversation


    What is remarkable is that these strangers picked up nearly the same qualities
    adored by the college friends, best friends, and parents of these same very curious
    people. For instance, here are the qualities that most distinguished very curious
    people from less curious people:'
