- pgno: 94
  md: '+   - Do long-standing family members and friends respect how your personality
    and interests change over time or do they desperately cling to their initial impressions
    of you?


    Be honest in your answers or you will only reinforce unneeded barriers to growth.
    Bands like Metallica and The Clash had millions of doting, frenetic fans after
    their first records were released. As these bands matured, many fans revolted.
    They wanted the same band and the same kinds of songs for eternity. The “true”
    fans respected these natural changes. After all, why stay in a band if you’re
    only going to keep doing the same thing? They accepted that if we evolve, other
    people evolve, too. Change is an inevitable part of life.


    Surround yourself with guides who can handle it instead of struggle with it. With
    the right guides, we can discover and explore much more terrain than we could
    on our own. It is a sign of strength, not weakness, to have this base of security.


    # Find the Unfamiliar in the Familiar


    For some parents, it’s fascinating to watch their toddlers find frays in the carpet
    and paint specks on the wall as if they are on a hunt to find all the little things
    you never notice. For others, it’s just one of many things their children do and
    these tiny epiphanies go unremarked until someone else points it out. What is
    the difference? One distinction is each parent’s willingness to notice the new
    in the seemingly familiar and obvious aspects of everyday life.


    I say “seemingly” because recurring situations may look identical on the surface,
    but in reality any event involving people has some degree of novelty each time
    it happens. We can be open to this novelty or we can classify it away as just
    another moment when my child plays in the kitchen, my romantic partner sings in
    the car, or my boss compliments me on my work.


    One way to become more curious is to intentionally circumvent expectations, categories,
    and labels about “seemingly” familiar activities'
