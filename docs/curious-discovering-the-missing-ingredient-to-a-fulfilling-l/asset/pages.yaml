- pgno: 89
  md: 'The major hurdles are how to persist at tasks that are not inherently engaging
    but necessary and how to encounter more situations that have the potential to
    engage us. Instead of resigning ourselves to lives in which 75% of the day is
    less than enjoyable or at best, neutral, we can find ways to enliven and transform
    these moments.


    # Changing Perspective:

    Manipulating Situations and Tasks


    # Starting with Mood


    For activities that seem to be uninteresting initially, being in a good mood is
    often the first spark for catching interest. You want a rich, exciting moment
    that is arousing, one that captures your attention, and opens your mind to what
    is being offered as opposed to what you expected. From the obligatory (can''t
    get to work without commuting), to the important (those dishes can''t sit in the
    sink forever), to the inescapable (the boss, who makes you uncomfortable, sits
    down at your lunch table only seconds after you arrive), enhancing your mood can
    be the flint that ignites a flicker of passion. It doesn''t have to be complicated.
    You might call a favorite person to get inspired before you begin.


    If you are in a good mood, you will often use this information and figure that
    if I feel good, then I must be doing something interesting and fun. (Note that
    we''re often wrong because sometimes our mood is affected by the weather, hormones,
    or something unrelated to what we''re actually doing.)


    A good mood is often contagious. If your boss strolls into the office and offers
    free sushi to you and your coworkers, those positive feelings (assuming you like
    sushi) can carry over into your work. Whether you know it or not, you often return
    this act of goodwill with a pleasant attitude that translates into persistent
    hard work. Your boss probably knew that before he bought that first unagi roll.


    When we feel good, we are more interested in whatever grabs our attention, and
    we see the world around us differently, discovering that'
