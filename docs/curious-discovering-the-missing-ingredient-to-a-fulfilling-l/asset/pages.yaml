- pgno: 16
  md: '# # 1 Seeking a Fulfilling Life


    # ## Why There Is More to It Than Happiness


    What do you want most in life? For the vast majority of us, the answer is “to
    be happy.” We want to be happy, and we want our children and loved ones to be
    happy too. In a survey of more than 10,000 people from 48 countries, happiness
    was viewed as more important than success, intelligence, knowledge, maturity,
    wisdom, relationships, wealth, and meaning in life.


    Not surprisingly, we spend a lot of time, effort, and money trying to achieve
    this sometimes elusive happiness. Our desire to “be happy” has resulted in a multibillion-dollar
    self-improvement industry with a staggering number of books, tapes, motivational
    speakers, therapists, and gurus. Infomercials plead with us to purchase the latest
    top-secret happiness strategy—appearing when we’re most vulnerable, teetering
    on the edge of sleep at 2 A.M. In recent years, houses of worship have become
    empires, megachurches where members can pray, eat, shop, sing, and work out in
    a one-stop happiness enterprise. It is simply exhausting to think about the myriad
    of choices available to create happiness.


    Despite the commercialization of its pursuit, happiness is a good thing. And though
    some deny this fact, it’s hard to take them seriously. Yet is happiness itself
    truly the thing, the goal, that we should constantly be seeking? Does the pursuit
    of happiness even work? Are we becoming happier?'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 2 Curious?


    I would answer “no” to all of these questions and here’s why: We have been sold
    on the idea that being happy is the only or most important goal in life.


    While acknowledging the importance of happiness to creating a fulfilling life,
    when we focus on it, we lose out on the complexity of being human. We ignore the
    other important pieces of the puzzle, such as meaning in life, maturity, wisdom,
    and compassion.


    Happiness involves feelings or judgments about life. It is a gauge we use to measure
    if our life is going well. But if we do things solely to be happy, what happens
    after this goal is met? We can find ourselves on an endless, fruitless, treadmill
    of “happiness seeking,” never actually feeling all that happy! I believe that
    all the time and energy spent looking at and trying to move the happiness gauge
    a notch higher can be used much more effectively. Instead of constantly trying
    to be happy, we should focus on building a rich, meaningful life, guided by our
    core values and interests.


    This is what the Dalai Lama means when he says that “the very purpose of life
    is to seek happiness.” How is he defining happiness here? He isn’t talking about
    feeling good or satisfied. He is talking about living a life infused with meaning
    while embracing the full range of human experiences—the positive and the negative.


    This is not a happiness book. This is a book about being alive, exploring, discovering
    insights, and living a life that matters. This is a book about the science behind
    creating a fulfilling life, broadly defined.


    You might be feeling as if you want it all. I want to be happy, I want meaning
    and purpose in my life, I want greater flexibility and acceptance, I want to become
    wiser and more mature, I want to be successful and creative, I want to be able
    to tolerate the distress and uncertainty of being human, and so on.


    When we recognize that there is more to a fulfilling life than being happy, then
    we are left with an important question that this entire book hinges on. Namely,
    what is the central ingredient to creating a fulfilling life?


    The answer is curiosity.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Reacquaining Yourself with Curiosity


    On the surface, curiosity is nothing more than what we feel when we are struck
    by something novel. During long car rides, road signs plead with us to pull off
    at the next exit to visit underground caverns and carnival rides. Your carload
    of travelers may pass by these opportunities with mixed responses—teenagers squawling
    with intrigue, Grandma detesting any screwing up her window vista, and your own
    hesitation to spend money to satisfy childish interests. You might experience
    similar moments of beckoning when an odd book title compels you to see what''s
    inside or when you are enthralled as you pass the rising gull-wing doors of a
    parked DeLorean. Commonly, we view curiosity as what we experience when opportunities
    bump into us.


    Curiosity does draw our attention to things that are interesting. But while this
    appears simple, my research and that of others shows that curiosity is a deeper,
    more complex phenomenon that plays a critical role in the pursuit of a meaningful
    life.


    We often make the fatal mistake of thinking growth opportunities come to an end
    when something or someone becomes part of our daily routine. When things become
    familiar and predictable, we become mindless drones. We tune out. As soon as we
    think we understand something, we stop paying attention.


    Novelty is different. We often pay attention to the unfamiliar and listen to new
    people because they grab our attention. What we forget is that novelty always
    exists in the present moment. There is much to learn from the unfamiliar and the
    familiar. No two hugs are the same, no two pizzerias make pizza slices the same
    way, no two times we watch The Godfather are the same, and so it goes. Being curious
    is about recognizing novelty and seizing the pleasures and meaning that they offer
    us.


    Another reason that curiosity is neglected is that it operates below the surface
    of our desires. It''s not as simple as thinking positive, being optimistic, being
    grateful, being kind, or feeling good. Being curious is about how we relate to
    our thoughts and feelings. It''s not about whether we pay attention but how we
    pay attention to what is happening in the present.


    The past and future are nothing more than symbolic representations'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 4 Curious?


    of reality. Mental photographs (past) and dreams (future). Real events happened,
    but once the action is over, they are a figment of reality. These representations
    aren''t even stable; they change. You look at pictures in your photo albums and
    re-create memories. We create stories around the narratives we want to weave about
    ourselves and other people. Was Theodore Roosevelt the last of a dying breed of
    candid, authentic presidents who could swim naked in the pond behind the White
    House in broad daylight, kill hundreds of animals with his shotgun, fight police
    corruption, and be the brave champion of the environment who created the national
    park system? Or was he a sociopath with a grandiose vision of his own importance,
    driven by uncontrollable impulsive urges, who found a good outlet to hide it?
    History is rewritten constantly and the past changes.


    Our moods change constantly and thus our ideas about the past change with them.
    As for the future, it remains unknowing. Anything can happen, and often we are
    wrong. The best we can do with the future is prepare and savor the possibilities
    of what can be done in the present.


    Only in the present can we be liberated to do whatever it is we want. It''s a
    razor-thin moment when we are truly free. When we are curious, we exploit these
    moments by being there, sensitive to what is happening regardless of how it diverges
    from what it looked like before (past) or what we expect it to be (future). We
    are engaged and alive to what is occurring. We are energized. We are open and
    receptive to finding opportunities, making discoveries, and adding to the meaning
    in our life. To reiterate, it''s not about being attentive; it''s about the quality
    of our attention.


    By being open and curious in our moments, we can improve even the most mundane
    aspects of our daily routine. How is it that we walk down a supermarket aisle
    and remain oblivious to the hundreds of items on the shelves? One reason is that
    they don''t interest us. We''ve been in the same store a million times, we''re
    harried, and we might hate grocery shopping in general. If we''re on a mission
    to make a Caesar salad with the aid of a written shopping list, our attention
    is laser-focused on locating the items we need. The owners of the supermarket
    try to outwit us with colorful product displays that force their way into our
    consciousness. Without help to navigate through the flood of objects in our inner
    and outer worlds, chaos would reign. This is where curiosity steps in, if we let
    it.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'If we are open to unplanned opportunities, we intentionally seek out interesting
    items in the store. We may find a new food to get our picky kids to eat, a delicacy
    to spice up our week, or maybe we waste a few dollars on a culinary experiment
    that doesn’t agree with us. Regardless, there is something enjoyable about being
    unsure of what to expect and being willing to seek out discoveries and act on
    opportunities as they arise.


    # Shaping our Abilities and Identities


    Besides transforming trivial moments, curiosity offers a gateway to creating profound
    intimacy, insights, and meaning in life. The best way to grasp curiosity is to
    witness it. Consider Stacy. I was introduced to her through a friend who described
    her as a kid masquerading as a top-notch architect. I wanted to learn a bit more
    about her passion, so we met on a plot of land where a huge, expensive house was
    being built near the Blue Ridge Mountains in Virginia. She had been hired as a
    consultant on the project.


    I watched her as she looked, listened, and hiked a long way out into the forest.
    I asked what grabbed her attention. “The land, and the way it slopes. What could
    you do to capitalize on the view. Where the house should go. How to keep from
    cutting down too many trees.”


    Every so often, she posed her own questions. “What are most of these trees, what
    kind, I mean? Do you know how deep the dirt is? Can you drill a well in this ground?
    After all, there’s lots of shale and limestone.” Without being asked, she shared
    her overall impressions.


    “I think a house should have a relationship with the place it sits, don’t you?
    The house should share a vocabulary with the environment. I mean, think about
    all the people who lived around here and how they lived. When they built houses,
    they built them in a certain style for certain reasons and used what’s local.
    Now we know about designs from all over the world, but should we use them here?”


    When we look at the world through Stacy’s eyes, you can see how curiosity shapes
    our identities and the story of our lives. It’s more than feeling good in the
    moment, it’s more than taking advantage of novelty in front of us, it’s an attitude
    toward living.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 6 Curious?


    Sylvan Tompkins, a pioneer social psychologist, is perhaps the first researcher
    to explore the unique value of positive emotions, 35 years before the “positive
    psychology” movement came along. He believed curiosity was of profound evolutionary
    significance:


    The importance of curiosity to thought and memory are so extensive that the absence
    . . . would jeopardize intellectual development no less than the destruction of
    brain tissue . . . there is no human competence which can be achieved in the absence
    of a sustaining interest.


    Since he made this statement, much work has accumulated to demonstrate the truth
    of this working hypothesis. If we are to find fulfillment more readily and sustain
    it, we need to harness our curiosity. In the words of Tompkins, “I am, above all,
    what excites me.” Just how this mechanism works and how we can more fully understand
    and harness its benefits is made possible by the emergence of a secure, scientific
    foundation.


    Curiosity is hard-wired in the brain, and its specific function is to urge us
    to explore, discover, and grow. It is the engine of our evolving self. Without
    curiosity, we are unable to sustain our attention, we avoid risks, we abort challenging
    tasks, we compromise our intellectual development, we fail to achieve competencies
    and strengths, we limit our ability to form relationships with other people, and
    essentially, stagnate.


    When you look at successful people in history, it becomes clear that curiosity
    motivated them to expand their horizons, and it has to be given at least partial
    credit for their accomplishments. Whether it is scientists, artists, architects,
    politicians, CEOs, owners of mom-and-pop shops, advertising executives, teachers,
    political activists, or nearly anyone trying to discover something, their stories
    highlight the powerful motivator of curiosity in why we do the things we do.


    Curiosity is part of the architecture needed for building a pleasurable, engaging,
    and meaningful life. Understanding this motivation allows us to better understand
    human nature.


    Why is curiosity so important? First, just like Stacy’s quests, curiosity motivates
    us. This is captured by our greater interest in and preference for'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'new experiences and information. When we experience curiosity we are willing
    to leave the familiar and routine and take risks, even if it makes us feel anxious
    and uncomfortable. Those who deal better with novelty, who function more optimally
    in a world that is unpredictable, uncertain, and unstable, I call “curious explorers.”
    Curious explorers are comfortable with the risks of taking on challenges. In fact,
    the most curious among us actually lust for the new.


    Second, curiosity helps us extract and integrate experiences and meaning from
    these new experiences. When we are probing the nooks and crannies of new worlds,
    inevitably we are also learning. This is the ultimate goal of our curiosity system:
    to add to our existing knowledge, skills, and competencies. These additions help
    us to better understand ourselves and the outside world, cope with the challenges
    of everyday life, and improve our ability to handle chaos.


    Resisting our opposing craving for certainty, we discover that the greatest rewards
    come when we question authority, question the status quo, question our beliefs,
    and question everything. Sometimes these rewarding, positive feelings come from
    anticipating the excitement of exploring something that we might not want to end.
    Other times, it’s only after getting the experience we craved that we feel excited,
    satisfied, or content. We have only one life to experiment with, and pulling off
    our blinders can help us get started.


    # The Thieves of Childhood Curiosity


    Children are born with boundless curiosity. In the beginning, infants get excited
    by brightly colored objects, slight changes in the sound of their mother’s voice,
    and anything within their small field of vision. Without any shortage of fascination,
    hours can be devoted to watching the spinning blades of a fan. As their senses
    become more developed with age, their wonder and excitement expands, and they
    venture out a bit further. Every cupboard and drawer hides a mystery worthy of
    investigation. At birthdays and on holidays, boxes and gift wrap are as interesting
    as the'
