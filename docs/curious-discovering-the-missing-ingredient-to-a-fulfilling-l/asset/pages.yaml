    the ground is exactly the same as the towers. The ground is fuzzy and blue just
    like the towers. If I jump up and down, my feet bounce a bit. Where am I?


    The answer was that Richard''s dad was in the blue carpet in the bedroom they
    were sitting in. They placed this game regularly. His goal was to get his son
    out of the habit of seeing the world from a single perspective. The world was
    different depending on your starting point and he wanted Richard to learn that
    there were always different angles and perspectives when looking at a person,
    place, or problem. If you stuck to one perspective, you were blinded from learning
    anything new. This game was just one way that Richard''s dad worked to develop
    his son''s curiosity, flexibility, and creativity.


    Years later, Richard thinks about how his dad influenced him. He credits him for
    turning him on to science. Richard was quite successful, graduating from a top
    college, getting a doctorate in physics, serving as the youngest member of the
    Manhattan Project (the team that built the first atomic bomb), and eventually
    winning the Nobel Prize. Richard Feynman''s life is a testimony to the value of
    being curious. His father taught him this at an early age, and it became the fundamental,
    core ingredient of his life. He describes the influence of his parents that he
    didn''t fully appreciate at the time in his aptly titled autobiography, The Pleasure
    of Finding Things Out.


    In dozens of countries, curiosity is one of the most commonly endorsed strengths.
    Unfortunately, stating that you are curious is not enough to access the profound
