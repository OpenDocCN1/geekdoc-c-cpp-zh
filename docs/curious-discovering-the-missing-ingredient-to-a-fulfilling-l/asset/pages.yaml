- pgno: 34
  md: '# Curiosity Is the Engine of Growth


    If we are aware of and receptive to our curious nature, we can catch serendipity.
    Told he would herd sheep as an adult, a younger version of Ben would have laughed.
    It’s all too easy to pass on intriguing possibilities that fall outside of our
    comfort zone. We put off engaging with the new for a future day. But what are
    we waiting for? Burn out? Retirement? But why wait for big changes to add intriguing
    elements to your lifestyle? Why wait for burnout? Why wait until retirement?


    Ben shows us how curiosity is always available to us and something we can act
    on at any time. When we are interested in anything—friends, shopping, picking
    out a recipe, or looking up the definition of a new word—curiosity is at work.
    When we actively inject variety into our ordinary routine, curiosity is at play.
    Small, innocuous changes—from mixing cereals from four boxes in our cabinet to
    changing our jogging route—can enhance our days and lives. These repeated experiences
    modify our brain, further enhancing our ability to flourish in a world with more
    unknowns than knows.


    But curiosity is not just an effortless and spontaneous experience. It is an intense
    motivation woven into the basic fabric of our personalities. All of us, to varying
    degrees, are driven to seek out new and uncertain experiences. Although you might
    believe that certainty and control over your circumstances brings you pleasure,
    it is often uncertainty and challenge that actually bring you the most profound
    and longest-lasting benefits.


    Curiosity is about recognizing and reaping the rewards of embracing the uncertain,
    the unknown, and the new. There is a simple story line for how curiosity is the
    engine of growth.


    +   - By being curious, we explore.

    +   - By exploring, we discover.

    +   - By this is satisfying, we are more likely to repeat it.

    +   - By repeating it, we develop competence and mastery.

    +   - By developing competence and mastery, our knowledge and skills grow.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'As our knowledge and skills grow, we stretch and expand who we are and what
    our life is about.


    By dealing with novelty, we become more experienced and intelligent, and infuse
    our lives with meaning.


    Curiosity begets more curiosity because the more we know, the more details that
    we attend to, the more we realize what there is to learn. Why? When we embrace
    the unknown, our perspective changes, and we begin to recognize gaps—literal and
    figurative—that weren’t apparent before.


    The physics of rock climbing provides a vivid illustration. Beginning rock-climbers
    rely on their instincts. Their goal is not to fall. They cling close to the face
    of the mountain, and use a lot of upper body strength to pull themselves up. After
    bagging a few peaks, they start to accumulate some counterintuitive tricks. For
    instance, to avoid slipping or falling, you push your body away from the mountain.
    This might seem like a sure-fire way to fall, but what happens is that you can
    get a larger surface area of your toes and feet on the mountain. You have a more
    stable grip, and you are less likely to fall.


    As rock-climbers get more comfortable with their hand and foot positions, they
    start to see places to move their feet and grab with their hands that they didn’t
    see before. Their fingers get stronger and instead of just looking for pieces
    of rock that jut out, they start looking for cracks to stick their fingers and
    toes into. Their expertise allows them to see more gaps and be more creative as
    a rock climber.


    Curiosity isn’t always a joyful process of discovery, and it’s not just an upward
    spiral to some hoped-for peak experience. Sometimes curiosity is an itch that
    we need to scratch. Rather than being motivated to explore because of a sense
    of wonder or intrigue, we crave specific answers to a puzzle.


    We crave specific information that might help us close the gap—and this is what
    brings pleasure. For instance, an adult needs to figure out the last few answers
    of a crossword puzzle; a teenager has to learn about Franz Kafka for a writing
    assignment; a manager wants to figure out the strengths of her workers to maximize
    productivity. There are also questions loaded with palpable tension, from the
    mundane to the cosmic: Am I at risk for Parkinson’s or Huntington’s disease like
    my parents? Is my marriage going to last?'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Sometimes joy is central to our explorations and other times, the sole purpose
    is to release tension and find meaning. In either case, finding answers to specific
    explorations is not the end of our curiosity. The more knowledgeable or skillful
    we become, the easier it is for us to recognize other holes in what we know and
    other questions and interests we want to explore.


    Curiosity is at work whenever we feel open and receptive to experiences that offer
    more than what is already known. Each time we embrace the new, we can help but
    extend and expand ourselves. It could be as simple as listening to a previously
    unheard musical chord on the radio. It could be as profound as reflecting on whether
    the person sweating and panting beside us in bed is just another sexual partner
    or someone we love—and discovering that we are in love.


    # Uncertainty Intensifies and Prolongs Pleasures—and You Don''t Even Know It


    Asked about his daily routine in a televised interview, Deepak Chopra, a leading
    writer and teacher on spirituality and consciousness, extolled the virtues of
    curiosity:


    +   I wake up with the hope this day is even more uncertain than yesterday.


    +   It''s the unknown that we live, breathe, and move in all the time thinking
    it is the known.


    +   If a life can be a series of perpetual surprises, that''s the most joyous
    experience you can have.


    Most of us have not learned this lesson. We don''t realize that trying to make
    sense of the unknown actually adds to the intensity of our positive experiences
    and makes them last longer than pleasures gained from familiar routines.


    The supportive evidence is considerable. In one experiment, thirsty research subjects
    had their brains scanned while drinking water (pleasurable)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'or Kool-Aid (more pleasurable). Some subjects were told what they would be
    drinking and when (certain) and others were left in the dark (uncertain). Brain
    circuits linked to positive feelings lit up like a street carnival when subjects
    knew they were getting a drink but were left wondering what drink was going to
    be served. Just like a busload of gamblers spending eight hours wed to a slot
    machine at a casino, excited about their prospects of winning every time they
    pull the lever, being uncertain enhances the pleasure of positive events.


    Our expectations influence how we are going to feel, and good news is more enjoyable
    when it comes as a surprise. Olympic athletes content to be competing who don''t
    expect to win anything have been shown by scientists to be more likely to gush
    with joy after winning a silver medal than do those who were expecting to win.


    Becoming fulfilled is about much more than the size or type of gifts that life
    presents to us. There is something special and meaningful about being surprised,
    uncertain, and unsure of exactly what is going to happen and how things will turn
    out.


    Interestingly, we are often clueless about what will bring us the strongest, longest-lasting
    pleasure and meaning in life. The psychologist Timothy Wilson was interested in
    why it is particularly meaningful when strangers are kind to us. Is it the gift
    or the unexpected kindness that touches us most? (After all, we are taught at
    a young age to be wary of strangers.) Perhaps “random” acts of kindness are more
    meaningful. When we don''t expect and can''t explain the reason for someone''s
    kindness, the mystery deepens our pleasure and changes the way we view the world
    (maybe people aren''t so annoying). These moments of surprise offer opportunities
    for “meaning making.”


    Wilson''s research team strolled through a college campus giving students cards
    with a silver dollar taped to it. All the cards were signed by “The Smile Society,”
    but some students'' cards included details on what this odd society does, which
    is brighten people''s days. Students who didn''t learn why they received a free
    dollar felt better about the gift, and these feelings lasted longer. Being mystified
    enhanced their positive feelings. In another study, instead of being given a card
    with a silver dollar,'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'subjects were asked to imagine how they would feel if they were the recipient
    of a silver dollar. Half were told they would learn who and why the person gave
    them money; the other half were told they would only be given the stranger''s
    name. Asked to imagine how they would react, people told who gave them the gift
