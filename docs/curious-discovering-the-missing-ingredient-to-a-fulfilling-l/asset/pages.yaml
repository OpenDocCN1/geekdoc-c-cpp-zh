  img_proc: true
- pgno: 77
  md: 'much to be gained by comparing yourself to the average Joe or Jane out there.


    Let’s start with the tastiest, most rewarding slice and work our way around to
    the most annoying, unwanted slice in what I call “the pie of life.”


    # Highly Enjoyable and Meaningful


    Activities such as spiritual practices, parties, exercise, being in nature, listening
