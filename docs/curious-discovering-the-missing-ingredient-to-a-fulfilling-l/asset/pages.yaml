- pgno: 91
  md: 'and by doing so, raise people''s spirits. It never occurred to him that he
    could use the same mindset at work. He transformed the acts of mopping floors,
    emptying trash barrels, and plunging toilets into a sport. At the start of each
    task, he timed his performance and kept a tally of his best times in a small,
    heavily creased, spiral notebook. If there were people in his way or a huge mess
    to be cleaned up, he gave himself a handicap to account for the increased difficulty
    level. These calculations and competitions made his tasks far more interesting.


    When he explained the system to his coworkers, they laughed. But Fred''s personal
    challenge had set something new in motion. A few days later, some of the others
    started keeping their own tallies. They teased each other as they wrestled for
    the position of top dog, trading stories about obnoxious people and grotesque
    "handicaps" (you can imagine these janitors strolling through Dante''s third circle
    of hell—"the gluttonous" dump of waste and refuse). These playful interactions
    magically drew people together who previously worked alone, and they provided
    vitality and more initiative for completing assignments. Leaving work, they weren''t
    the depleted, walking dead that family and friends were accustomed to seeing;
    they now had enough stamina to engage in pleasant activities before work began
