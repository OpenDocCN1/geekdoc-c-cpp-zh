    # Reacting to Life When Opportunities and Challenges Intervene


    The first noble truth of Buddhism is that we are going to encounter hardships.
    Besides feeling pain, these events often alter our very assumptions about ourselves,
    other people, and the world around us. Yet, in spite of the often overwhelming
    obstacles people face, a large number of children, men, and women are able to
    absorb the pain and continue moving forward. That is, they are resilient. Others,
    in dealing with hardships, actually bounce forward. That is, they grow and benefit
    from their struggles.


    To give you an idea of the science behind resiliency and growth following trauma,
    let’s consider one of the most horrifying things that one person can do to another:
    rape. As you might expect, rape victims are at a dramatically greater risk for
    emotional disturbances than people who have never been a crime victims. For instance,
    rape victims are 6 times more likely to develop post-traumatic stress disorder
    at some time in their lives and 13 times more likely to attempt suicide. Responding
    with anxiety, depression, nightmares, and thoughts about suicide are normal reactions.


    But one truly amazing, less-well-understood fact is that after six months, without
    therapy, about 50% of rape survivors bounce back to how they were feeling beforehand.
    Many survivors don’t develop mental or physical problems, and they show only minor
    impairments in their ability to work, socialize, and take part in their regular
    routines.'
