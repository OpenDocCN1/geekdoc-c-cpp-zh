- pgno: 87
  md: 'characters. Abolish categories, labels, and stereotypes. Artificial barriers
    only prevent us from knowing ourselves, making choices that fit our interests,
    and obtaining the required energy nutrients to expand and grow.


    Unaccounted-for activities that are not on our radar (they’ve been rejected or
    never considered). The prior four categories of motions share one thing in common:
    We actively take part in them. Unfortunately, there are many other activities
    that we don’t even consider trying in the first place because we assume without
    any firsthand experience that they will bore us, cause us misery, or be a waste
    of time. Perhaps we learned this from our parents or friends or by listening to
    other people we respect or admire.


    Consider the “machismo” and “rules of the street” that characterize many ghetto
    cultures where protecting honor is of utmost priority. Men from these cultures
    learn from role models that being willing to physically fight others, avoiding
    acts of weakness such as saying “excuse me” or expressing gratitude, and viewing
    authority figures as the enemy are the markings of the strong at the top of the
    social hierarchy. Embracing these views means discounting a lot of activities
    that might be interesting and enjoyable. We can see similar behavior among people
    who try really hard to act the part of the professional, the slacker, the jock,
    or the intellectual, instead of following their own values and interests, which
    might cut across seemingly impermeable boundaries. We lock ourselves into views
    of what is “good” or “bad” by making these premature commitments. There are times
    when we are curious about something, but we hold back and don’t even consider
    acting on it, letting us with what I call “unsatisfied, residual curiosity.” We
    deny ourselves the opportunity to do the things we are most interested in, and
    we end up with regrets and a disconnect between what we are doing and what we
    want to be doing.


    The solution for creating the largest area to roam free and find pleasure and
    meaning in life is to be open and to observe, experiment, play, and revise as
    needed. The worst that happens is that you get to taste a part of life once, and
    the best that happens is you find a new and lasting source of interest, excitement,
    and meaning.'
