    Hopefully, if you are a parent, you view parenting as valuable and important.
    You don''t quit after watching a little hand swipe a bowl of soup onto the carpet
    and walls. Roused at 4 A.M. to soothe a nightmare-induced wail, you endure because
    you care.


    But as the research studies presented earlier show, the activity of parenting
    is stressful and it would be disingenuous to say it doesn''t cause wear and tear
