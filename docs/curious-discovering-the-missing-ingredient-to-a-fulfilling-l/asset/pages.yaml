- pgno: 93
  md: 'judging, evaluating, or criticizing. Entering into the new often brings a mixture
    of the positive and negative. People who understand uncertainty and the complex
    blend of emotions that naturally arise in new situations are good guides.


    The right guides and partners set the stage for us to experience new situations
