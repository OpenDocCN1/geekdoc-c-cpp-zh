- pgno: 183
  md: 'to fight or escape. If we avoid the situation, then nobody gets hurt. At the
    same time, anything new is a potential treasure trove. If new things hold the
    possibility of hidden treasure, then how can we walk away without exploring and
    sucking the nectar dry? And so we duel it out between avoiding (playing it safe)
    and exploring (seeking out rewards).


    Everyone has moments when they are fearful, nervous, and worried that bad things
    are going to happen. Depending on the intensity and how you handle it, anxiety
    can be beneficial or it can be destructive. Learning to work with anxiety makes
    all the difference in creating a high concentration of fulfilling moments wrapped
    inside a fulfilling life.


    One of my students, a grandmother named Christine, shared a story that encapsulates
    life into the moment when anxiety and curiosity collide.


    One day I took Brooke, my 8-year-old granddaughter, to the toy store. Brooke was
    interested in many things as we walked the aisles and seemed fascinated by the
    long row of dolls. She happily pointed to each one and announced, “Baby!” with
    a big smile. Suddenly, we both sensed movement behind us.


    We turned around to see a young couple walking with a small boy, who looked to
    be about Brooke’s age. The couple and the boy stopped when they saw us in their
    path and Brooke smiled at him. The boy’s parents stood quietly, probably thinking
    that the two kids would have a sweet encounter. Instead, the boy rushed full bore
    ahead, stretched out his arms, and shoved Brooke as hard as he could. Brooke went
    flying backwards, sliding on the tile floor until her head hit the shopping cart,
    where she came to a stop. I quickly picked her up, cradling her head and talking
    softly to her as she screamed.


    The parents apologized, and I could see they were appalled. I also heard them
    tell the boy that they were not going to buy a toy for him that day because of
    his behavior. They left and I stood soothing Brooke.


    The young parents returned shortly after the episode. They'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'wanted their son to make amends. I gave them credit for trying to teach their
    son to do the right thing. The parents made sure their son was not positioned
    to charge Brooke again and encouraged him to apologize. Brooke stopped crying,
    but her face was wet with tears. What struck me was this: When the boy returned,
    Brooke didn’t smile or look at him expectantly. The openness that had been there
    at their first meeting was gone, replaced by an expression of wariness and a tighter
    hold on me. Brooke signaled to me that she was unwilling to get down as long as
    the boy was present.


    When Christine told me this story, I recognized that all of us are confronted
    with these conflicts, when events impinge upon our natural desire to seek out
    rewards. I wondered how often in life we are open and curious, only to be met
    with disappointment or a need to be wary. Because we don’t want to experience
    anxiety or fear, we shut the door on possibilities for future experiences.


    Being overruled by anxiety from time to time is not going to ruin your life. In
    fact, it’s often the right decision, as it was for young Brooke. However, patterns
    can develop over time, and this is what we want to examine. Do we take calculated
    risks and aim for the biggest possible rewards? Or do we go out of our way to
    make sure pain, errors, and failures are kept to a minimum?


    If anxiety overwhelms our curiosity system, dictating what we do, then our plans
    for the future get hijacked. On the other hand, if we feel anxious, recognize
    that the future is uncertain, and willingly take part in the things that naturally
    interest us, a different life narrative emerges. This chapter is about understanding
    and harnessing curiosity and anxiety. By doing so, you can unleash your maximum
    potential, ensuring that a greater proportion of your energy is spent doing things
    that offer satisfaction and meaning.'
