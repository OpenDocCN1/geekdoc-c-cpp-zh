    What were we thinking and feeling at the time? How did things appear? With these
    rich details, we can savor curious moments and learn from them. Besides being
    crucial for remembering the backdrop of what happened to us in the past, there
    is recent work showing that the hippocampus is essential to imagining detailed
    scenarios of what might happen to us in the future. Seeds of creativity and imagination
    are sown in this small brain region.


    If the hippocampus is activated at the same time you eagerly anticipate rewards,
    then we don’t just feel curious and want to explore. We are better able to hold
    on to these moments, thus expanding our sense of self. Attempts to find a single
    neural circuit for curiosity are futile. Dopamine, opiates, and the hippocampus
    create the brain ensemble that allows us to gravitate from fulfilling moments
    to a lasting, rich, meaningful existence. Appreciate the importance of getting
    this ensemble to play together.'
