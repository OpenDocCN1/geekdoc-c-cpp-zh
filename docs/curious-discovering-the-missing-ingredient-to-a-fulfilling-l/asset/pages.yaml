- pgno: 155
  md: 'The beauty of this research is that it shows that detecting emotions is a skill
    that can be learned. The next time you are in a social interaction, try for two
    minutes to forget about the impression you are making. Forget about what you are
    planning to say next. Forget your agenda. Instead, be aware, be attentive, and
    be open to exactly what the other person is communicating. Is she tense, excited,
    touching you gently? If it’s a romantic situation, is he mimicking your own movements
    and actions or teasing you in a playful manner—or at least trying his best? If
    so, you have an engaged, interesting person. But look for changes. Do you see
    slight gestures to physically move away or make less eye contact?


    For just these two minutes, get in sync with your partner’s emotions and be respectful
    of what’s being communicated. You might recognize how rare this practice actually
    is and how much you are missing out on in your conversations. Regular practice
    will make you a more engaged, interesting person to be around. If you don’t believe
    me, see if the people who you find interesting and enjoyable in your life happen
    to be the most attuned to your shifting emotions, interests, and needs.


    When we are actively engaged in our social world, we create and beget interest.


    During my first therapy session with a high-powered lawyer, she mentioned being
    “burned enough times by useless conversations and first dates that started nowhere
    and ended nowhere” that she started giving people two minutes before ruling them
    out. This may sound callous, but every decision has an opportunity cost because
    there is something else we could be doing.


    What I have found is that instead of passively waiting for disappointing conversations
    to end, we can actively transform them. In several studies, I brought two strangers
    into the lab to spend 45 minutes getting to know each other. To help them out,
    I gave them a deck of questions to take turns asking each other. Some couples
    were given questions that resemble the banal, boring small-talk that never seems
    to go anywhere at a cocktail party (How do you like the weather? What newspaper
    do you'
