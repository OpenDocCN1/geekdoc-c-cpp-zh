    can be replaced with accurate information. Thus, children gain insight and cope
    better when they require hospital services.


    # Thriving with Strengths and Anxiety: Tuning Our Exploration and Anxiety Modes


    Some aspects of our lives might need to be changed. We might, for example, need
    to eliminate overly aggressive, oppressive, violent, or toxic people from our
    social world. Other times, there may be nothing we can do to bring about change.
    When we are unable to differentiate acceptance and change, we suffer. This delicate
    balance is captured by my colleague, Hank Robb, who slightly reworked the widely
    known serenity prayer:


    > > Let me seek acceptance of life as I find it, even though I may not approve
    of what I find, wisdom to see what would be good to change, willingness to act
    as well as willingness to follow through, and gratitude for the opportunity to
    try to live my life as best I can.'
