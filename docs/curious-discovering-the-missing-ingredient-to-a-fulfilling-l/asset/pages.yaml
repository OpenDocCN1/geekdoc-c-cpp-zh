  img_proc: true
- pgno: 23
  md: 'gifts themselves. Children seek a deeper understanding of the complex world
    around them and play offers a safe opportunity for them to make some of the fearful
    unknown known.


    But something happens to this innocent and courageous exploration. Society gets
    in the way. We are given an endless series of rules and obligations that keeps
    our curiosity in check. Do it now, ask questions later. Stay away from strangers.
    Avoid controversial topics and hot-button issues. Your elders are always right.
    Instead of learning about history, science, and great literature, we are taught
    how to do well on standardized tests. Memorizing facts too often replaces the
    intrigue of being exposed to foreign, exotic territory—the sensation of touching
    the pouch of a mother kangaroo, imagining a time when dinosaurs roamed the earth,
    scrutinizing the merit of improbable ideas such as reincarnation and cryogenic
    immortality.


    Rules are useful because they provide structure and help us avoid doubt and uncertainty.
    But they get in the way of freedom. Following directions conserves energy, but
    following one’s unique direction expands energy.


    Rather than being encouraged to learn about ourselves and our interests, we are
    more often taught how to make decisions about what to do with our lives as early
    as possible so we won’t waste time achieving our goals. Pick an academic major,
    choose a career, and start a family. Whether other interests are squelched isn’t
    important. What’s important is to “make something of yourself,” “be able to support
    yourself,” and “realize that life is more than just having fun.”


    We also live in a climate of fear. Headline news reports bombard us with warnings
    of what we should be wary of. Terrorism, kidnappings, credit-card and Internet
    scams, mad cow disease, sexual predators, plane crashes, killer bees, shark attacks,
    tire recalls, and more. As a result, we do everything in our power to stay out
    of harm’s way.


    But there’s a risk to playing it safe. Our actions are dictated by what we don’t
    want instead of what we do. Aspirations are put on hold. But the things we fear
    are often unlikely to happen. We fear a terrorist attack, a child kidnapping,
    a mad gunman at school—yet the chances of any of these things happening is infinitesimally
    small.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Most people overestimate risk, failure, and danger and underestimate the value
    of being curious. It is time to reclaim our neglected strengths. We can—and should—choose
    how we want to live our lives. Are we governed by fear and the need for safety,
    or are we willing to accept a bit of risk and anxiety in the pursuit of satisfaction,
    growth, and meaning?


    Living a life of curiosity is not about ignoring risk and anxiety. It''s about
    being willing to do what one values, even in the face of risk and anxiety. What
    if we saw things as they really are without judgments of what we expect them or
    want them to be? What if we acted on our curiosity when deciding what to do with
    our free time, what careers to choose, who to spend our time with and devote our
    lives to?


    Curiosity serves as a gateway to what we value and cherish most. We can reclaim
    the lost pleasures of uncertainty, discovery, and play from our youth. Outside
    of childhood, our innate curiosity does not come as easily or naturally, but these
    obstacles can be acknowledged, confronted, and ultimately, overcome. We can cultivate
    curiosity to shape our lives closer toward the direction of where we want it to
    be. Realizing our potential depends on it.


    To be sure, curiosity is not the only quality that contributes to a happy, meaningful,
    and fulfilling life. That being said, it''s hard to think of a human endeavor
    where curiosity doesn''t play a vital role. Think about it: science, technology,
    work, business, sports, education, politics, arts and aesthetics, introspection,
    personality development, relationships—you name it. Few areas are more worthy
    of our time and effort than enhancing our ability to be curious.


    This is not an unsupported claim. As you will see, the ideas in this book and
    my conclusions are supported by a large body of scientific work, much of it known
    only to readers of academic journals and little of it integrated into a meaningful
    picture relevant to our everyday lives. This book will provide tools you can use
    to renew the relationship with the curious explorer within you.'
