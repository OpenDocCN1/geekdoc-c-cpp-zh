- pgno: 135
  md: 'highly effective approaches for motivating others. The following examples are
    just that, examples. These strategies can be applied to nearly any situation in
    which someone is under your watch (managers, parents, teachers, and coaches).
    They can also provide insight into the nutrients you need in your own life to
    strengthen your own enduring interests.


    # 1. Visualize the big picture and share it with people.


    If you manage workers in a large company, allow employees to see the big picture
    and how their work contribute to it. Few people are going to be intensely motivated
    if they are working in a bottling plant without being let in on what products
    are being created, what new ones are being planned, and how their actions contributing
    to increases in sales or prestige. Give employees a taste of the product, ask
    them for ideas, and show the link between their work and important company outcomes.


    Sure, you should reward employees in proportion to how sales move, but knowing
    that they are doing something meaningful for the company is equally important.
    Give them time and allow them to provide input.


    The same goes for when you know there are going to be transitions and changes
    that will affect other people. Whether you are thinking about moving to a new
    city and have yet to tell your kids about the possibility of a major change in
    their lives, thinking about upgrading the technology in your corporation and have
    yet to tell employees how it will affect their responsibilities—the sooner the
    better. What researchers find is that the earlier that people are brought into
    the change process and the more input they have in the process, including sharing
    thoughts and ideas, the more open they become to change. This is true even if
    it means that their lives are going to be shifted or reorganized. By increasing
    their openness, you increase their interest and commitment to the process. Transparency
    about our hopes, dreams, fears, and plans can enhance the interest of people we
    care about, and their positive feelings are often contagious, thus intensifying
    our own interest.


    # 2. Reward people beyond money.


    Money can undermine initial, natural interest in a task. What scientists have
    found is that when people'
