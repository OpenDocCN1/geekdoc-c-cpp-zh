- pgno: 264
  md: 'We see the same thing when combat veterans return home. Some witnessed horrific
    violence and atrocities and some were themselves wounded and almost killed. On
    the news, you hear about an epidemic of post-traumatic stress disorder, depression,
    suicide, and an inability to function as contributing members of society. These
    after-effects are devastating and all too real and urgent for the people affected
    directly and society as a whole. But without minimizing the impairment of a significant
    minority of veterans (and believing we should be doing everything possible as
    a society to express our gratitude for their sacrifice by aiding them), we can
    learn a lot from the veterans who show a profound ability to cope and thrive despite
    the hardships of their experience.


    This phenomenon, which has been studied in extremely violent contexts, also happens
    following more common events. A woman told me, “Like it or not, your life gets
    altered after you give birth.” The same goes for when we lose a job, change jobs,
    move to a new city, retire, fall in love, or get married. Events such as heart
    attacks, serious car accidents, illness and death of children and loved ones,
    being diagnosed with severe and terminal illnesses, and watching the events of
    September 11, 2001 unfold on television are some of the events studied by researchers
    to understand how people cope and thrive.


    From a review of this research, it appears that there are three fundamental ways
    by which people might grow from transitions, difficulties, and crises:


    +   **Relationships are strengthened.** There is greater appreciation of the importance
    of family and friends. Loved ones who didn’t receive proper attention before are
    now elevated to top priority. There might be an increased devotion to caring for
    other people. Interpersonal virtues such as kindness, generosity, forgiveness,
    and gratitude emerge. A renewed sense of connection to others and a desire to
    act upon these feelings is common. We might call this compassion borne out of
