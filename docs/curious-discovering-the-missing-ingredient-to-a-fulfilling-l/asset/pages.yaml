  img_proc: true
- pgno: 180
  md: 'When it comes to romantic relationships, some couples might need a therapist
    to guide them. Note, however, that the research findings and insights in this
    chapter are very different from what many couples want from therapy. Many couples
    want answers. They want to reach a sense of certainty and closure. They want to
    be able to predict their partners’ every move because it releases them from feeling
    anxious and uncomfortable. They want to be absolutely certain they are going to
    stay together and work it out. That might work if you are interested in staying
    together and couldn’t care less about the quality of your time together.


    My guess is that most people want more than physical proximity to others. We want
    to make exciting and meaningful connections. We want our romantic relationships
    not only to last but to continue to contribute to our ongoing growth, happiness,
    and well-being over time. The path offered by science points us in the right direction.'
