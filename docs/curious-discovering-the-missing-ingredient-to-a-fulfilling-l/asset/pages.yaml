- pgno: 80
  md: '# # Getting Honest about Labeling Time as Pleasure, Pain, or the Gray Area
    Between


    Freedom—and fulfillment—originates with knowing how we spend our time and, equally
    important, how exactly it makes us feel. If we remain ignorant of this crucial
    information, we won''t know how to work toward a well-lived life.


    An excellent case in point is the experience of parenting. Whether or not we have
    children, all of us know that parenting is not all hugs and giggles. Then there
    are the heaps of dirty diapers, children waking in the night, inconvenient doctor
    appointments, and nonstop caretaking. Yet ask a parent about how much they enjoy
    being with their kids, and their first response is going to be something akin
    to "I love being with my kids." "What mom doesn''t enjoy it?" I know this from
    first-hand experience. The more casually you know someone who is a parent, the
    more emphatic they are that nothing is better than being a parent. I also know
    this as a researcher. For instance, when researchers asked parents to order a
    list of activities by how enjoyable they were, childcare ranked in the top two.
    Only relaxing was deemed more pleasurable. Spending time with friends, talking
    to friends on the phone, and exercising were all ranked as less enjoyable.


    Yet despite what we might say and what these research participants listed, when
    parents are asked about specific moments in their lives, it turns out they enjoy
    spending time with their kids substantially less than they think.


    When these same parents were asked to reconstruct a day and consider how they
    felt during specific episodes with their kids, childcare dropped down to 12th
    place. The only activities viewed as less enjoyable were commuting to work, housework,
    and working. Now, this doesn''t mean childcare is terrible, it means that with
    an honest assessment, moments of intense joy switch off with moments of great
    strain and feelings of being trapped. Taking a closer look at the real picture
    doesn''t diminish the profound meaning that many parents gain from raising children.
    These findings normalize the pain and discomfort, giving parents the freedom to
    acknowledge how they truly feel. After having children, most'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'parents experience a major drop in pleasure until the kids leave home in early
    adulthood. But positive feelings are only a small part of our well-being, and
