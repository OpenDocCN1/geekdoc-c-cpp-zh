    # Switching Perspectives:

    Strengthening the Interests of Others


    Walking into a typical statistics class is unlikely to change your opinion about
    the subject if you are expecting it to be hard and worried that you are going
    to understand little. You have to believe the payoff is worth the effort, or you
    are going to move on. To develop sustainable interest and engagement, the value
    of subject needs to be clear and personal.


    On April 25, 2008, more than 4,000 high school students poured through the gates
    of Six Flags America for Physics Day. Is there a better way than a ride on a roller
    coaster for teachers to illustrate the gravitational pull of objects toward Earth
