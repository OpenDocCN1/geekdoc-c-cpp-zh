  md: '# # Morbid Curiosity


    Do you watch real-life emergency room shows where people are seriously injured
    and hanging on for their lives? Is it hard to avert your eyes from a gruesome
    scene? Do you ever laugh at violent scenes or situations? Did you watch the Saddam
    Hussein execution video? How about the fall of the World Trade Center buildings?
    How many times?


    Death is largely a mystery. Although we are able to study the physical occurrence
    of death and its aftermath, we have few insights. We want to know about the unknown.
    In fact many people find it intrinsically rewarding to study and learn about violence
    and death. What does a knife wound look like? How does the body decompose after?
    How is it different from one person to the next? How do people behave in the final
    moments prior to death? How do attitudes toward death differ in other cultures
    than my own?


    Numerous books, magazines, and websites have popped up to address these interests.
    One website, Rotten.com, provides instant gratification to the morbidly curious.
    Receiving roughly 15 million hits per day, the website owners claim to document
    only real instances of bad things happening to people. Interested individuals
    can access documentation and grotesque images of injury, death, and dismemberment.
    Those with morbid interests can spend hours amusing themselves by watching YouTube
    videos of morbid events (e.g., clips of wild animals, fish, and reptiles eating
    humans). Even the news media is aware that the ratings are much better for bad
    news than good news. Book publishers and movie producers earn billions of dollars
    annually by focusing on death, destruction, and chaos.


    Most people with a small interest in morbid things can comfortably put their interests
    on hold and return to a more peaceful reality. Far fewer'
