    # Curiosity Patterns in the Brain:

    Seeking versus Having Rewards


    Ask any parent if they think the distinction between seeking and having is arbitrary.
    I interviewed Mary and her daughter Fran. Fran is a typical teenager who won’t
    get out of bed until you yell. On the cusp of flunking out, Fran tells her that
    if she gets her act together, she will buy her a new mountain bike with a titanium
    shell, shock absorbers, and other'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'top-notch accessories. What do you think happened when she learned she might
    get a bike (when the "wanting" kicked in)? Feelings of gratitude littered conversations,
    household chores were completed, and a study group met on a weekly basis, as she
    radiated positivity. What do you think happened when she got the bike? She rode
    day and night, enjoying off-road trails in pure bliss. And at the same time, her
    grades slipped until by the time a month rolled around, she once again became
    the same person we met at the start of the saga.


    When we get rewards, we are satiated. Just like eating a hearty meal, afterward
    we are no longer motivated to do anything. When we are anticipating rewards, we
    are motivated to take action. We are driven to take risks in pursuit of them.
    This process is energizing and often enjoyable. When we are curious and exploring,
    we often get the best of both worlds:


    +   - The anticipatory excitement of seeking new rewards

    +   - The fullfillment of consuming them


    Using brain scans, in study after study scientists found that the striatum was
    an inferno of activity when people didn''t know what was going to happen or if
    they expected something rewarding. If dopamine responds to the possibility of
    rewards, it should energize us to seek out these same rewards. And this is exactly
    what happens. Before people explore, in hopes of being rewarded, the striatum
    lights up. It doesn''t matter if we approach an attractive person at the bar and
    are told to $%#@ off or if they give us their phone number, the striatum lights
    up before we make our move.


    This is very important—our brains prepare us to take action. When we are in a
    novel, uncertain situation and notice something pleasurable that we want (think
    of Charlie and the other kids walking into Willy Wonka''s Chocolate Factory for
    the first time), we can see a surge of dopamine activity in the striatum. The
    striatum prepares our body to capitalize on these novel opportunities.


    Novelty + Open and receptive attitude = new information being integrated into
    the self and personal growth.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Our body is prepared by directing our attention to focus on the present, mobilizing
    energy in case we require intense effort in an upcoming challenge, and initiating
    movements to inch us closer to the source of novelty and any rewards that we can
    absorb from it. A beautiful sunset or piece of music requires us to focus our
    attention in its direction and sustain it there; to capitalize on an intriguing
    comment by someone else, we need to vocalize our thoughts and coordinate our smile
    and posture to show we''re interested.


    This is an important discovery: Not all rewards are equal in releasing dopamine
    from the striatum. When we recognize something as novel, uncertain, or challenging,
    and we push beyond the boundaries of what we know, dopamine is produced and released
    at a greater rate. Furthermore, when the novelty is personally meaningful or important
    to us (picture a five-year-old who can''t sit still, pleading to open Christmas
    gifts), there is a greater cascade of dopamine.


    # Curiosity Feels Good, Sometimes:

    Taking Stock of a Few Curiosity Patterns


    Being curious is not just a neutral, neural process—our feelings come along for
    the ride. Sometimes there are joyous, exciting feelings involved with our curious
    adventures (hiking along an inactive volcano just as the sun is rising), and this
    means that in addition to an active striatum with a dopamine explosion, you are
    also going to see a surge of opiates in the brain. Opiates are the neurotransmitters
    that are most central to that basic feeling of enjoying the rewards life offers.


    # Curiosity Profile #1: Dopamine with Opiates


    Judging by dictionary entries and everyday conversation, curiosity typically refers
    to a joyful, excited state. We enjoy the uncertain and novel because it piques
    our interest. We are drawn to the unknown by a sense of wonder and intrigue. Other
