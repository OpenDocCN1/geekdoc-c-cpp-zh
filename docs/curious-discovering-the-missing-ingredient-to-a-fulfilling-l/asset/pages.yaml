    # Sexual Obsessions


    Think for a moment about what gets you sexually aroused. Seeing your partner dressed
    in a certain way? A particular scent? Watching an erotic film? Sexual preferences
    and the sources of sexual arousal are highly individualized. What is arousing
    to you may be abhorrent to your neighbor. Sexual arousal can be elicited by a
    vast range of things, from common to uncommon parts of human anatomy (breasts,
    buttocks, thighs, ears, clearly defined clavicles) to nonhuman objects (animals,
    garter belts, lingerie, shoes), and the grotesque (urine, feces, amputees, dead
    bodies). If you are cringing at this moment, you are not alone. Whereas most perverse
    thoughts, fantasies, and sexual practices are harmless, some people (or their
    victims) experience significant distress regarding their sexual experiences.


    People with paraphilia possess sexual urges and fantasies that revolve around
    something other than a full-bodied adult. Their sexual interests often become
    obsessions, in which enormous amounts of time and energy are exerted to satisfy
    lustful cravings. Sexual desire might arise from experiencing pain and humiliation
    at the hands of another (masochism) or doing it to someone else (sadism). It might
    arise from exposing one''s genitals to a surprised audience (exhibitionism), spying
    on others, usually while they are disrobing or having sex (voyeurism), or touching
    and rubbing one''s genitals against nonconsenting others (frotteurism). It also
    includes being sexually attracted to inanimate objects or isolated body parts
    (fetishism). More disturbing is when adults focus their sexual fantasies and behavior
    toward prepubescent children (pedophilia). More commonly seen in men, paraphilias
    tend to co-occur with other emotional problems, especially substance abuse, depression,
    and anxiety disorders.


    You may also be wondering how people can come to have seemingly bizarre sexual
    preferences. Just as their sexual preferences are diverse, so are the reasons.
    Focusing on the desire for novelty, uncertainty,'
