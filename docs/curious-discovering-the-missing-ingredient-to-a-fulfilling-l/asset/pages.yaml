- pgno: 187
  md: 'Consider spending time with people, being in places, and doing things that
    are interesting, enjoyable, and personally valued even when there is a lot of
    anxiety. In fact, we can be at our best and use our strengths while having anxiety.


    I am going to ask you to think about the other options available to you when you
    struggle with unwanted, unpleasant feelings such as anxiety. Dr. Steven Hayes
    created a mindfulness-and-acceptance-based intervention called “Acceptance and
    Commitment Therapy,” or ACT, to help people become psychologically flexible and
    commit to behaviors that are aligned with their deepest values. Controlled studies
    comparing ACT to cognitive therapy and medication found impressive gains in treating
    problems as wide ranging as anxiety, pain, smoking, diabetes management, adjustment
    to cancer, and epilepsy. Regardless of whether you are suffering from psychosis
    or seek to cope better with stress and anxiety, it’s helpful for people to begin
    by focusing on a metaphor he calls “Two Systems”—the curiosity and the anxiety
    systems.


    For just a moment, think about the situation where you feel the most anxious and
    uncomfortable. Maybe it’s when you’re speaking in public, going on a job interview,
    talking to an attractive person you want to date, or thinking about how little
    money you have at your disposal. Make the situation personal. Everyone has something
    that causes them at least a little anxiety.


    Think about what you most want to do when you feel that anxiety. Do you want to
    run? Do you freeze? Do you want to hide? Do you want to conquer the moment? With
    this personal image in mind, consider the following metaphor:


    Think of the anxiety and curiosity systems as two knobs, just like the controls
    for volume and balance on a stereo. The one most familiar to us is the Anxiety
    Knob. In theory, this knob can go from 0 to 10, but you might be saying to yourself,
    “I can’t seem to get it lower than 5, and I really can’t stand it when it’s 8
    or higher. It’s uncomfortable. I’ve got to do something about it.” This is probably
    the knob you spend most of your time and energy on.'
