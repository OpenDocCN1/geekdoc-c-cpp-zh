  md: 'EMBRACE UNCERTAINTY. ATTRACT LOVE AND ABUNDANCE. MASTER YOUR LIFE.


    # Aren''t you curious to know more?


    > > Curiosity is what makes for great leaders, great parents, and great friends....
    Curious? is one of those rare books that can make you rethink how you see the
    world. —Arianna Huffington


    > > Todd Kashdan gives us the tools, language, and plan to put a life change into
    effect. And the journey can be as happy as the destination. —Marc Shimoff, author
    of Happy for No Reason


    HARPER an imprint of HarperCollins www.HarperCollins.com


    Visit www.AuthorTracker.com for exclusive updates on your favorite authors! Self-help
    ISBN 978-0-06-166119-8 USA $16.99


    n Curious? Dr. Todd Kashdan offers a profound new message missing from so many
    books on happiness: the greatest opportunities for joy, purpose, personal growth
    don''t, in fact, happen when we''re searching for happiness. They happen when
    we are mindful, when we explore what''s novel, when we live in the moment, when
    we are open to new experiences and relish the unknown.


    Using science, story, and practical exercises, Dr. Kashdan offers a blueprint
    for building lasting, meaningful relationships, improving health, increasing creativity,
    and boosting productivity. You, too, can become a "curious explorer" comfortable
    with risk and challenge, capable of functioning optimally in an unstable, unpredictable
    world.


    ![](img/15db01e3682c9946a66df1669b7978cd_355_0.png)


    TODD KASHDAN, PH.D., is a clinical psychologist and professor of psychology at
    George Mason University. His work has been featured in the New York Times, Wall
    Street Journal, and PBS. He lives with his wife and daughters in Fairfax, Virginia.


