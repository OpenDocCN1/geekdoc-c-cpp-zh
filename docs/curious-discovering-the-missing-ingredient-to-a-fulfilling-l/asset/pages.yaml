  md: 'closely examine how we go about making, finding, and creating meaning, which
    for some people leads to a purpose in life.


    # A Desperate Search for Meaning


    At the center of my own life story is this quest for meaning. A major event kick-started
    it. My twin brother and I lost our mom to breast cancer when we were 13 years
    old. Of the two of us, I was the mama''s boy. Much of my time was spent leaning
    against her, while I listened to music or nibbled on a Good Humor Toasted Almond
    Crunch Bar on a summer afternoon. My father had virtually walked out of our lives
    when we were two years old and to this day he has not come back into it. Suddenly,
    we were left without parents at far too young an age.


    My wife and friends regularly talk about their childhoods. They reminisce about
    family trips to the beach and Wiffle ball games in the street that lasted until
    nightfall. I, on the other hand, hardly remember anything about my life prior
    to age 17. When my mom died, most of my memories went with her. Plenty of psychologists
    will tell you that this reaction is normal. Getting rid of unwanted feelings by
    concealing and suppressing thoughts keeps the pain away.


    Having lost most of the love and meaning in my life, I started looking for replacements
    to fill the emptiness inside me. I didn''t know it at the time, but I was coping
    by making and searching for meaning. Self-exploration is rarely a straightforward
    road. I bounced from one source of meaning to another. I became obsessed with
    my body. In middle school and high school, I found great satisfaction in sculpting
    my pipe cleaner arms and legs, which dangled from my 126-pound frame. I lived
    in the gym, grunting and convulsing as I tossed around dumbbells and barbells.
    By adding 30 pounds of muscle to my frame, I felt strong inside my skin. It was
    a release; it was rewarding. It was the ultimate art form.


    But I wanted something more. In tenth grade, I became obsessed with using my body
    to become an elite athlete. Since I lacked coordination, balance, good reflexes,
    or speed, my options were limited. The arcane'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'shot put became my new holy grail. Needless to say, this hypermasculine attempt
    at physical stardom led me as far astray from high school popularity, but it did
    give me a strong sense of self at a time when most teenagers don''t know who they
    are.


    After I hit puberty, at the age of 15, I lost my interest in sports and discovered
    the opposite sex. By the time I entered college at 18, bodies other than my own
    were my driving interest. I wish I could tell you about the intellectual rewards
    of going to an Ivy League college. I would be lying if I did.


    Like many people, when college ended, I bounced around from job to job. I dressed
    in claustrophobic superhero costumes to sell trading cards outside toy stores,
    worked as the mail boy for a law firm, and modeled men''s jackets at Oriental
    auctions. Even when I started on the road to a real adult life by working on the
    New York Stock Exchange, my lack of satisfaction gnawed at me. In keeping with
    the times, my search for meaning became more deliberate and obsessive. I read
    books on Buddhism, shism, science and the mind, and finally made the leap to turn
    my source of meaning into a career.


    I left my high-paying Wall Street career and took a few unpaid positions to help
    me turn my true interests into a career. Slowly, my source of meaning shifted
    once more and I found my "calling" as a scientist, teacher, and therapist devoted
    to understanding how certain people are resilient and fulfilled regardless of
    the stuff life throws at them. For as long as I can remember, "intense passion"
    and "dedication" are the first words people use to describe me. My own search,
    borne out of suffering, led me to find a guiding direction, or purpose, in life.


    # Looking for Direction


    We live in a time of great uncertainty. As I write this, the United States is
    in an economic crisis, several wars between countries are long underway, and mass
    genocides such as what is happening in the Darfur region are relegated to page
    13 of the newspaper as readers move on to fresher story'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'lines. A number of us are going to have to pursue paths that we never expected
    because a lot of bad things are confronting us. When I think about what people
    need, happiness isn''t the first thing to come to mind.


    Happiness is a sign that things are going well in your life, but it doesn''t say
    anything about the substance or quality of how you are living. Although many happy
    people found profound meaning in their lives, plenty of happy people don''t. Being
    happy doesn''t provide direction for what to do.


    To successfully deal with hardships, take on challenges, and live in the present
    with a receptive state of mind to appreciate and make sense of the richness of
    life as it unfolds moment to moment, we need more than happiness. Meaning is about
    gaining insight into what to do and what not to do when we''re faced with life
    decisions, big and small. Meaning enhances our capacity to work toward a future
