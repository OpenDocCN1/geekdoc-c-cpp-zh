  img_proc: true
- pgno: 237
  md: 'Being a high-sensation seeker isn''t necessarily good or bad. It depends on
    how intense desires for novelty and variety are channeled.


    Sensation-seeking includes taking a walk in a cold breeze, meditation and yoga,
    and the thrill of talking to new people. It affects preferences for food, music,
    movies, and conversational topics. What if you were invited to taste unusual foods
    like snake, slug, gecko, puffin, reindeer, or whale sashimi? For the uninitiated,
    a few squeamish calls for mommy are natural. This is the province of the high-sensation
    seeker. They are less likely to let their initial disgust deter them from a new
    experience.


    High-sensation seekers also enjoy less socially appropriate interests such as
    gambling, cliff diving, drug use, aggressive driving, promiscuity, and for a few,
    violence and serious criminal activity. High-sensation seeking isn''t a disease
    or a recipe for deviency. It''s a personality trait.


    Some high-sensation seekers happen to be evil incarnate, but others are successful
    creators and leaders. Being open to new experiences and pursuing ideas that rival
    conventional wisdom is essential to society. If people weren''t willing to take
    risks, our species would stagnate. The acts of a few high-sensation seekers ensure
    that we continue to evolve.


    # Dangers behind the Wheel


    You don''t want to be driving on the road surrounded by a pack of high-sensation
    seekers. You don''t want to loan your car to a high-sensation seeker. Sensation
    seeking is related to nearly every type of risky driving behavior: driving while
    intoxicated, driving more than 80 miles per hour, not wearing seat belts, keeping
    unsafe distances from other drivers, swearing at other drivers, bobbing and weaving
    in traffic, racing other cars, using the horn when annoyed, and giving people
    the finger among other rude gestures. These drivers are more likely to cross solid
    lane crossings, receive moving violation tickets, and trigger car accidents.


    High-sensation seekers are dangerous because risky driving is exciting and thrilling
    to them.'
