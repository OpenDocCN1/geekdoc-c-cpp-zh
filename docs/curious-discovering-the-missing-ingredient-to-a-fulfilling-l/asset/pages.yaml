  md: '# # Measurement Tools


    In many of the studies that provided the scientific foundation for this book,
    psychologists often ask people to answer questionnaires about certain topics.
    The answers that people give, when they are being honest, often provide tremendous
    insight into what that person thinks, feels, and does.


    The measurement tools that psychologists use are not something that someone just
    made up and printed. Instead, they have been given to hundreds, or even thousands,
    of people in a process called “validation.” Validation allows the researcher who
    developed the tool to know that it measures what it is supposed to measure and
    not something else. The process of validation occurs before the tool is used outside
    of a research laboratory.


    To help you understand yourself better, I received permission from several well-known
    and highly regarded researchers to reprint their measurement tools, as well as
    reprinting one of my own. So work your way through them, and enjoy the process
    of getting to know yourself better. It is important to highlight that there are
    no right and wrong answers, and you are not competing with anyone. The more honest
    you are in responding, the more you gain in understanding yourself.


    # ## The Curiosity and Exploration Inventory-II


    The Curiosity and Exploration Inventory-II uncovers the degree to which you are
    a “curious explorer.” Read each statement and circle the number that best matches
    the description of how much you agree with the statement. Do not think about how
    you wish you could be, or how you might be in the future, but how you actually
    are right now. Be honest with yourself.'
