    cylinders from defunct chemistry labs. In the back room, it was another story.
    Open the curtains and you were welcomed by a wall of dildos and towering stacks
    of pornographic videos and magazines that reached halfway to the ceiling. My twin
    brother and I worked at this metropolis of lust for far too young an age. At the
