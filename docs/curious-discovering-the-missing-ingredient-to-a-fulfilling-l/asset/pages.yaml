  md: "> \"Curious? is a soul-building read that will change forever the way you think\
    \ about embracing new opportunities. Combining well-designed self-help with state-of-the-art\
    \ positive psychology and profoundly inspiring stories, this is the perfect book\
    \ to read when you are having second thoughts about challenging yourself to explore\
    \ that next step in life.\"\n> \n> —Stephen Post, Ph.D., and coauthor of Why Good\
    \ Things Happen to Good People\n\n> \"Curious? will wake you up to the rewards,\
    \ adventures, and meaning inherent in both life’s most significant and most quotidian\
    \ moments.\"\n> \n> —Sonja Lyubomirsky, Ph.D., author of The How of Happiness:\
    \ A Scientific Approach to Getting the Life You Want\n\n> \"How do you know what\
    \ makes you happy? How do you figure out what you really want? By acting on your\
    \ curious impulses! Todd Kashdan gives us the tools, language, and plan to put\
    \ life change into effect. And the journey can be as happy as the destination.\"\
    \n> \n> —Marci Shimoff, author of Happy for No Reason\n\n> \"Curiosity is what\
    \ makes for great leaders, great parents, and great friends. Buttressed by the\
    \ latest scientific research, Curious? is one of those rare books that can make\
    \ you rethink how you see the world.\"\n> \n> —Arianna Huffington\n\n> \"Todd\
    \ Kashdan, a pioneering scientist of positive psychology, has written a book that’s\
    \ more than just another take on positive thinking. Curious? points the way to\
    \ an exploring spirit that leads to wondrous, joy, and meaning. It’s one of those\
    \ rare books that is both research-based and practical.\"\n> \n> —David G. Myers,\
    \ Hope College, author, The Pursuit of Happiness\n\n> \"Todd Kashdan explains\
    \ in practical terms how you can develop your innate curiosity to make your life\
