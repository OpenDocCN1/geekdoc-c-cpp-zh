  img_proc: true
- pgno: 190
  md: 'whether being open and curious could transform public speaking anxiety. How?
    By asking speakers to change their mindset of what constitutes a mistake. Larger
    randomly assigned students to one of three conditions: (1) the “mistakes are bad”
    condition, where they were told not to make a mistake; (2) the “forgiveness” condition,
    where they were reassured that mistakes are fine and instructed to purposely make
    a mistake; and (3) the “openness to novelty” condition, where they were told to
    incorporate any mistakes they made into the speech itself and instructed to purposely
    make a mistake.


    Speakers in all three conditions gave a talk in front of a room full of people
    and were told that they would be judged on how well they performed. The results?
    Speakers in the openness-to-novelty condition judged themselves as more comfortable
    and rated their performance better than speakers in the other conditions. Moreover,
    the audience also judged the speakers in the openness-to-novelty condition as
    being more composed, effective, creative, and intelligent.


    Knowing this, perhaps we can cut ourselves some slack. Confucius said, “being
    ashamed of our mistakes turns them into crimes.” Allowing ourselves space to make
    mistakes and being open to whatever direction the present takes permits us to
    be better speakers and conversation partners.


    I think there is another reason why mistakes and errors draw people in: People
