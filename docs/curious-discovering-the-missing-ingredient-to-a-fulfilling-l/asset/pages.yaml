- pgno: 188
  md: 'There is another knob hidden in the back that''s harder to see. It''s called
    the Explore knob. Just like the Anxiety knob, it can go from 0 to 10. It might
    be the more important of the two because it''s the only one that you can control.
    It refers to how open you are to accepting your own experience as it is. When
    Anxiety is at a 10 and you''re trying to make it go down, to make it go away,
    then you''re unwilling to feel the anxiety that''s registering on the dial. Looked
    at another way, you''ve set the Explore knob to 0.


    This is a terrible combination. If Anxiety is high and Explore is low, there is
    nothing you can do to change your situation. Anxiety can''t go down. You simply
    can''t move it at will. You can''t just tell yourself to be calm. In fact, when
    someone says this to you, it usually just makes you more anxious. When you try
    to relax to feel less anxious, it can make you more anxious because you start
    wondering why you can''t calm down.


    You''ve been trying to play with the Anxiety knob for some time now. It''s not
    that you''re not clever, it simply doesn''t work, and it can be frustrating to
    keep at it. So, keeping your anxiety-producing moment firmly in mind, I now want
