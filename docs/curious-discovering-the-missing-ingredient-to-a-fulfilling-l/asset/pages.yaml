  md: '# Appendix Exercises and Tools


    # Relationship Exercises


    In Chapter 6, I discussed the scientifically based idea that embracing and bringing
    novelty and uncertainty into a relationship can lead to greater satisfaction for
    both partners. The following four-step exercise is one way to improve the excitement
    quotient and, therefore, the satisfaction in your relationship.


    # Exercise 1: How to Invigorate Your Relationship with Your Romantic Partner


    STEP 1: Privately, each person should think about time spent with their partner.
    Without talking about it, each of you should make a list of the shared times together
    that could best be described as “very pleasant” or “exciting.” Think about things
    you do at home, for work, in the community, for leisure, on vacation, or anywhere
    else where you did something with your partner that made you feel excited. For
    instance, think about when the two of you:


    +   * Went to a concert or a club

    +   * Played or watched a sport or games of some kind

    +   * Shopped

    +   * Learned a new skill

    +   * Talked

    +   * Volunteered

    +   * Solved a problem'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   - Took care of other people, animals, or things

    +   - Went to a spiritual or religious event/workshop/meeting

    +   - Played music

    +   - Had sex (the more details, the better)

    +   - Worked out

    +   - Relaxed

    +   - Spent time in a different environment than you are usually in (beach versus
    mountains, suburbs versus city, noisy versus quiet, teaming with people versus
    sparsely populated)

    +   - Engaged in strenuous physical and/or mental exercise

    +   - Joined an organization that you both believed in

    +   - Pursued a hobby

    +   - Worked on the house, the yard, the car, the boat

    +   - Cooked new recipes

    +   - Went to the movies

    +   - Sat in the same room and did your own thing, like read, did needle-work,
    or worked crossword puzzles

    +   - Planned the family budget

    +   - Took a class

    +   - Something else (the sky is the limit—add any activities that fueled you)


    **STEP 2:** Get together with your partner and compare the two lists. Take note
    of which items show up on *both* lists. Create a master list containing those
    items.


    **STEP 3:** This step has three parts. First, think about some activities that
    are similar to the activities you found exciting and are possible for you to do,
    and add them to the master list. Second, be on the lookout for new, novel activities
    that you believe both you and your partner will find exciting, and try them out.
    If your instincts were right, add them to the master list. Third, consider incorporating
    activities that intrigue you that you might ordinarily pass up because you feel
    they are too childish or have a potential to be embarrassing. Stretch by allowing
    yourself to feel some anxiety. As you discover new, exciting activities, add them
    to the master list.'
