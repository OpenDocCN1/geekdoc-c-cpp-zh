- pgno: 288
  md: '# # Meaning in Life Questionnaire


    The Meaning in Life Questionnaire measures how much you find your life, your very
    existence, to be important and significant. It provides a numerical score for
    two subscales, one called the Presence of Meaning and the other called the Search
    for Meaning. Read each statement and circle the number that most truthfully and
    accurately describes how you feel about it. Remember that there is no right or
    wrong answer; whatever you answer is right for you.


    | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|

    | absolutely untrue | mostly untrue | some-what untrue | can''t say true or false
    | some-what true | mostly true | absolutely true |

    | 1. | I understand my life''s meaning. | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    | 2. | I am looking for something that makes my life feel meaningful. | 1 | 2
    | 3 | 4 | 5 | 6 | 7 |

    | 3. | I am always looking to find my life''s purpose. | 1 | 2 | 3 | 4 | 5 | 6
    | 7 |

    | 4. | My life has a clear sense of purpose. | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    | 5. | I have a good sense of what makes my life meaningful. | 1 | 2 | 3 | 4 |
    5 | 6 | 7 |

    | 6. | I have discovered a satisfying life purpose. | 1 | 2 | 3 | 4 | 5 | 6 |
    7 |

    | 7. | I am always searching for something that makes my life feel significant.
    | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    | 8. | I am seeking a purpose or mission for my life. | 1 | 2 | 3 | 4 | 5 | 6
    | 7 |

    | *9. | My life has no clear purpose. | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    | 10. | I am searching for meaning in my life. | 1 | 2 | 3 | 4 | 5 | 6 | 7 |'
