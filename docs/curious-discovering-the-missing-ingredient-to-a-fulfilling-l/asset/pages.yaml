- pgno: 186
  md: 'tal might be less anxious when they need to be treated for a medical condition.
    A group of kids aged 3 to 5 played with chemotherapy glasses, intravenous bags,
    syringes without needles, blood collection tubes, and so on. The children asked
    questions and were exposed to as much information as they desired. Some kids had
    prior experience in a medical setting and showed off their knowledge to the others.
    “Let’s try getting water out of the IV drip ... there, the medicine is coming
