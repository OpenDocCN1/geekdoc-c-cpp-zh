    # 7. Become More Curious by Remembering to Be Curious


    We control only our thoughts and behavior; we have almost no control over other
    people and situations. We often think we have to do new things to be interested
    and engaged in daily tasks. That is one path to fulfillment, but another is to
    find the new. Go into work with the mind-set of looking for the two or three things
    that are novel and three things that can challenge you instead of relying on what
    is familiar and known. What is novel about your coworkers’ attitude? What is novel
    about how your body is working? What is novel about the assignments in front of
    you? What challenge can you bring to your meetings, tasks, time-management, or
    relationships this day or week?


    Treat your workplace like a research laboratory. Even if you can’t lessen the
    number of seemingly mindless tasks that need to be done, you can explore, experiment,
    and discover during the day. In all of these instances, you don’t sit and wait
    for things to happen. You are aware of what is around, you seek things out, and
    you play. It’s strange that we put so little emphasis on fun and so much emphasis
    on how much money we make. It’s strange that people who are trying to hire new
    employees put so much emphasis on education and training and so little emphasis
    on whether they are interested and excited.


    Your work doesn’t have to be your primary source of meaning, but if you do work
    full-time, you can expect to spend about 45% of your time at the heels of your
    occupation. Why not decide to do something that creates more energy than it steals?
    If you don’t enjoy what you are doing, ask yourself whether you can change your
    perspective. If you view your work as serious, painful drudgery, it will bring
    down your mood. If you view your work as fun, challenging, and an opportunity
