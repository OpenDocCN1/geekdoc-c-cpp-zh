    Her rigid need to control her environment limited her zest for life and her ability
    to overcome her dyslexia. Fortunately, with the support of her parents and specialized
    schools, her laser focus on maintaining her equilibrium is easing, and her world
    of learning and friends is beginning to expand.


    Sonja suffers from dyslexia but her story is also characteristic of people who
