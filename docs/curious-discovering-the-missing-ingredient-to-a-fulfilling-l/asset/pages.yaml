    me and I figure it’s best to stick with a don’t ask, don’t tell policy.”


    At the gym, he started working with a personal trainer to change the shape of
    his sphere-shaped torso. In only three months, he lost 20 pounds. As a motivational
    tool, he carries around a picture of a shirtless male model with the physique
    he is after. Proud of this “future self,” he wanted'
