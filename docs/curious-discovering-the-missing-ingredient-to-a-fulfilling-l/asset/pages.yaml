- pgno: 85
  md: 'We can quit and face real, problematic consequences. For example, we can leave
    an unsatisfying job and risk not being able to pay the rent next month. We can
    continue onward as is. However, fatigue, anxiety, hopelessness, and anger are
    the side effects of feeling deprived day after day. Or, there is another option
    that is cause for optimism: We can alter the balance of satisfaction by making
    everyday tasks and activities more meaningful and interesting through the catalyst
    of curiosity, as we’ll see a bit later in this chapter, in the section on “Find
    the Unfamiliar in the Familiar.”


    Some activities give us downtime to replenish our curiosity-seeking energy. Going
    back to the typical day, most of us spend nearly a quarter of every day in mind-numbing
    downtime. It would be a fatal mistake to argue for the need to be curious and
    open every moment of the day. Although we feel energized when curious, we need
    to build our energy supply to tackle the challenges the world offers.


    When you are running or lifting weights, muscles eventually fatigue and require
    rest before they are at maximum strength to begin anew. Contrary to popular belief,
    exercise doesn’t lead to muscle growth. It is when we are relaxing and sleeping
    that microscopic tissue tears are repaired and muscles expand and strengthen.
    If you skip stretching, overtraining causes muscles to weaken and you end up worse
    off than if you do no training at all.


    Likewise, pseudo-badges of honor for working longer, faster, and harder than anyone
    else and getting by on a mere two to four hours of sleep are deceiving. Based
    on his work on sleep deprivation, the psychiatrist David Dinges explained in a
    60 Minutes interview:


    > There’s a cumulative impairment that develops in your ability to think fast,
    to react quickly, to remember things. And it starts right away . . . a single
    night of four hours or five hours or even six [hours] of sleep can in most people,
    begin to show effects in your attention and your memory and the speed with which
