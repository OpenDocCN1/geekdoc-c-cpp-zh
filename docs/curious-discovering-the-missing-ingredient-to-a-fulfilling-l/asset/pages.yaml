    you can''t move at will, the Explore knob is something you can set anywhere. It''s
    not a feeling or a thought; it''s a choice. You may have kept it set at low because
    you didn''t know you could move it, or never thought to. But you can.


    What you need to do is set it high. Now imagine your highly anxious situation,
