    # Person B


    He needed to understand how things worked and so he set up bizarre experiments.
    No living creature was spared. Waiting until mother hens left their nest, he would
    steal fetuses from eggs. What other families kept as pets, he dissected. It''s
    unclear just how many rabbits, birds, cats, and dogs took their last breaths in
    his hands. Many of his nights were spent robbing graves. He would unearth bodies
    buried by loved ones only hours before. With awe and wonder, he peeled back flesh,
    cut through tissue and organs, and removed the smallest shards of human remains.
    He covered his tracks well. His actions led to public outcry and fear in the local
    news. Dissatisfied with the pace of expanding his "collection," he turned inward,
    experimenting on himself. Among other actions, he stabbed his own penis, regularly
    scrutinizing these self-inflicted wounds.


    That well-educated, politically ambitious man who overcame childhood poverty is
    Ted Bundy, perhaps better known as the most notorious serial killer in American
