  img_proc: true
- pgno: 55
  md: '# Happiness


    For many, this is the big kahuna, the fundamental aim of life. So it’s worth ending
    this scientifically guided advertisement for curiosity with a discussion of how
    it contributes to our happiness.


    More than 130,000 people from more than 130 nations, representing 96% of the globe’s
    population, were recently surveyed by the Gallup Organization. Scientific surveys
    have never witnessed anything like this before. The two factors that had the strongest
    influence on how much enjoyment a person experienced on a given day were “being
    able to count on someone for help” and “learned something yesterday.” What this
    Gallup poll confirms is that developing good relationships with other people,
    seeking out the new, and growing as a person are keys to a “happy” life.


    That’s not all. In one of the largest undertakings in the field of psychology,
    Martin Seligman and Chris Peterson devised a scientific classification of the
    basic strengths that human beings can possess. This system was the end result
    of reading the works of ancient philosophers, religious texts, and contemporary
    literature, identifying patterns, and finally subjecting these ideas to rigorous
    scientific tests. Their research led to a final tally of 24 strengths. Some of
    them, such as love, spirituality, and emotional intelligence, are the first that
    come to mind when we think about what will make us happy (perhaps you have read
    books about these claims). When Seligman and Peterson evaluated the 24 strengths,
    curiosity was one of the five most highly associated with


    +   - Experiencing overall life fulfillment and happiness

    +   - Taking satisfaction from one’s work

    +   - Living a pleasurable life

    +   - Living an engaging life

    +   - Living a meaningful life


    Curiosity was more important than other highly touted qualities such as love,
    spirituality, emotional intelligence, kindness, forgiveness, perse-'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'verance, wisdom, and others (beaten out by only hope, zest, and gratitude).
    In case you’re wondering, these studies are based on the answers to website questionnaires
    by samples of 4,000 to more than 12,000 people from countries around the globe.
    For more than 1,000 young adults from the United States and Japan (aged 18–24),
    at the height of discovering their identities, the only strengths with stronger
    links to happiness than curiosity were hope and zest.


    In a survey of 839 Croatian students, my colleagues and I found that of the 24
    strengths, only curiosity and zest were consistently part of the top five strengths
    linked to attaining a pleasurable, engaging, and meaningful life!


    It’s a bit silly putting strengths into a competition where 24 enter and only
    a few emerge as winners. When we look at the top strengths that predict happiness,
    each of them often appears together with curiosity. As an example, in one study,
    about 1,200 teenagers wore a watch that beeped them eight times per day for a
    week. The teenagers carried around a packet of questions with them, and they wrote
    down what they were doing, thinking, and feeling at the time they were beeped.
    It’s a killer approach to studying a day in the life of curious kids. The 207
    kids (the top 10%) who were most interested in what they were doing throughout
    the week were labeled “curious explorers”; the 207 least interested (the bottom
    10%) were labeled “bored kids.” How did curious explorers differ when they were
    beeped as they went through their day? They felt more optimistic and hopeful,
    confident, and believed they were in control of their actions and decisions as
    opposed to feeling governed by what others think. Instead of feeling like “pawns,”
    with no control over their destinies (as bored kids did), curious explorers felt
    a sense of self-determination—a powerful motivator to take the reins of life’s
    offerings and challenges.


    These findings are no more than correlations, but they hint at a bigger story.
    I think, like many others before me, under the right conditions people who relentlessly
    pursue “personal growth” are best suited to thrive. Enjoying the process and the
    outcome, and feeling like the masters of their own destinies, curious people are
    in a great position to create and sustain happiness and more.'
