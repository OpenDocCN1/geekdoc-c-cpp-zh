  md: '# Caveat Emptor: When the Need for Safety Trumps the Need to Explore


    Unfortunately, not all relationships and conversations satisfy our curiosity and
    provide the stimulation we desire. Among the reasons why a relationship can be
    unhealthy or undesirable is an imbalance between the need to feel safe and secure
    and the motivation to grow and learn. Impending danger can squelch attempts to
    act on interest and intrigue. Perhaps the person doesn''t respect and care for
    your well-being and might even be hurting it, whether through neglect, condescension,
    contempt, or even aggressive and violent behavior. Instead of trying to grow and
    enhance a particular relationship, our motivation shifts to avoiding pain, anxiety,
    and misery in order to protect ourselves.


    Danger is a useful spark for triggering excitement and interest, but it is problematic
    for sharing worlds. Think of women who show a preference for “bad boys.” It sounds
    good in the short-term, but there is a trade-off: True intimacy and growth stagnate
    when we need to be vigilant about being hurt. The evidence is clear that when
    our partners view our feelings and our relationship as a game to be played, intimacy
    suffers.


    There is one exception. When couples are similar in their craving for thrills
    and adventure and fears of being bored, they feel closer, have better sex, and
    are more likely to stay together. Two thrill seekers make for a good couple. They
    understand each other’s needs and provide enough stimulation to satisfy each other.


    # All Relationships Start Somewhere: Sparking Excitement to Attract and Be Attractive
    to Other People


    All relationships start somewhere—in chance meetings, ongoing social interactions,
    and friendly connections that percolate over time. All of these situations are
    opportunities that can enhance our lives by expanding our horizons. Creating and
    seizing those opportunities is a shared dance.'
