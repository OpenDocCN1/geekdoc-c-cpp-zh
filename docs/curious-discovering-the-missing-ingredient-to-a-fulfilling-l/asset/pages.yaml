    # Curiosity and Our Social Roles and Identity


    Anxiety, when it isn''t balanced with curiosity, intensifies the need for closure
    and certainty, which plays out in every sense of who we are (our identities) and
    how we connect with others (our social roles). When we lack safety, when we’re
    worried about our acceptance in a group, when we fear making mistakes, it can
    seem easier to simplify our identity.


    We may define ourselves as mom, homemaker, gay, Latino, or war veteran. We may
    label ourselves as reserved, caring, or responsible. Far too many people experience
    great strains from the conflict of managing dual roles such as work and family,
    or surviving the inner city while trying to complete high school and go on to
    college. Only by seeing the various angles of our identities and how they work
    together can we successfully search for meaningful ways to spend our time and
    energy.


    I had an opportunity to talk with a man struggling with his conflicting identities.
    Rasheed was a gay man tucked into a compact 55” frame. Although he is very religious,
    it’s been hard for him to reconcile his faith with the fact that gays are often
