  md: '# 2. Bring Your Strengths into the Workplace


    You will be more motivated, perform better, and feel a stronger connection if
    you can bring what you care about into your work as opposed to waiting until 5
    o''clock or the weekend rolls around. This requires awareness and experimenting
    but the effort is worth it.


    The fact is, the best teams are made of people who stand up for their strengths
    and volunteer them to the team. Thus, by knowing your strengths and wielding them
    at work, you also will create a better group, which is yet another thing to be
    proud of and draw meaning from.


    In a Gallup survey, employees were asked about what they most regularly talk about
    with their managers. The results showed that 36% said it was about fixing weaknesses,
    24% said it was about building strengths, and 40% said they don''t talk about
    these things with them. Don''t wait for your managers to start the conversation,
    let them know what you can do and what you think your strengths are so that you
    can search for the meaning you want, find it, and add it to your identity.


    # 3. Find a Secure Base


    When you feel safe and secure in your position, you can be an engaged and curious
    explorer, taking risks and being creative and innovative. When you don''t feel
    safe, you rely on what doesn''t lead to mistakes and problems. When you start
    worrying about making mistakes and failing, you waste energy trying to control
    circumstances and what will happen in the future instead of being focused on the
    tasks at hand. This slows down your thinking and hampers your creativity, and
    everyone loses.


    # 4. Take Action. The Only Thing Worse Than Doing Something Is Doing Nothing


    Variety and challenge keep you attentive and interested in your work. If you never
    get absorbed and lost in what you are doing, you are not being challenged. Mix
    things up. As soon as you master something, appreciate your accomplishment and
    then ask for new opportunities that require more and more skill. It''s just like
    working out at the gym or playing a video game. Our body actually shuts down once
    it realizes that it''s not'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'being challenged. Remember that your body is designed to conserve energy because
    all it cares about is survival. Don''t fail prey to your lazy mind. When you go
    on autopilot, you lose out on the chance for pleasure, engagement, and meaning.
    Being challenged on a daily basis and feeling supported by others are the twin
    gatekeepers to helping you find and create meaning at work.


    # 5. Focus on People as a Source of Support and Meaning


    People are often the first reason why we rule out work as a source of meaning.
    When we feel the support and connections to the people around us we naturally
    experience a greater sense of meaning. When we leave our jobs, whether by mentally
    tuning out or actually quitting, it''s often because we experience a lack of recognition
    about our strengths or a lack of consideration of what interests us. The best
    thing we can do is be assertive and express what our strengths and interests are
    to other people. Focus on ideas and solutions and not just what isn''t working.
    If you think your manager will oppose change, let them see how your attitude,
    efforts, and performance improve. After all, this is the bottom line they are
    focused on. You will be surprised how flexible organizations can be when you "sell
    yourself" as being underutilized and wanting to be more motivated and productive.
    In this book are some ideas for how to do it. By bringing people into your corner,
    you will gain strong social connections that will spill over into a stronger connection
    with your work. All of this sets the stage to extract greater meaning on a regular
    basis.


    # 6. Find a Link between Your Identity and Both Your Work and the Work Team


    Passion toward work is inevitable whenever we feel as if our real self is being
