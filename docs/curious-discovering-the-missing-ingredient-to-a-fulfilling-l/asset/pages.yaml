- pgno: 153
  md: 'what are called “blended experiences”—those complex situations that simultaneously
    give rise to negative, stressful feelings and exciting, happy ones. A blended
    emotional experience might occur when meeting someone for the first time (the
    excitement of meeting a potential business partner with the anxiety of not knowing
    if they’ll like you or your proposal) or when having a disagreement with a friend
    or family member where you feel angry but also relieved and positive about finally
