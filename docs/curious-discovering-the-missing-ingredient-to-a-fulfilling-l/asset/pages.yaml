    decisions are made in an unpredictable, uncertain world.


    # The 3-Pound Curious Explorer


    If the motivational force of curiosity did evolve, then we should see deeply ingrained
    markers in our modern-day brains. With the technology that exists today, our brains
    can be seen for what they are—archaeological maps into our shared human history.


    In the popular imagination, our brains represent the truth. People get really
    worked up about research showing that whether you are in love, optimistic, religious,
    happy, obsessive, or fearful, it all shows up in the brain. It''s easy to believe
    that your experiences aren''t valid unless they can be traced to your biology.
    But do you need to go into a brain scanner to find out if you love your children
    or whether you are miserable or pessimistic? If so, I would argue that you need
    to seriously consider spending less time hanging out at your local pub and more
    time figuring out who you are.


    This being said, brain science can shed light on the origin of our curious natures
    and whether in fact people get more enjoyment from stability, familiarity, and
    certainty, or if I am right, that the key to intense, lasting fulfillment is seeking
    novelty and embracing uncertainty.


    To begin, let''s start with the most commonly discussed and misunderstood chemical
    in the brain that is linked to happiness—dopamine. Dopamine is a neurotransmitter
    that carries information from one nerve ending to another in the brain, preparing
    our body for action. There is an intense debate in the field of neuroscience as
    to what exactly triggers dopamine and, when it is unleashed, what action it impels.


    High-school biology teachers and many scientists refer to the brain'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'regions housing the largest collection of dopamine receptors (holding docks)
    as the “pleasure center” of the brain. This pleasure center is the nucleus accumbens,
    which is part of the ventral striatum, which has early evolutionary roots in the
    primitive, reptilian part of our brain. The striatum connects us to what is happening
    in the outside world and when a reward opportunity is seen, dopamine surges through
    our brain.


    Modern technology allows researchers to chart active brain regions as people are
    thinking, making decisions, and planning behavior. When volunteers undergo a brain
