- pgno: 58
  md: '# 3 Our Brains Lust for the New


    The priority of our hunter-gatherer ancestors was to look out for anything that
    might be dangerous or deadly. Everything and everyone was evaluated for how much
    trouble they might cause. If I eat those plants, am I going to get sick and die?
    Are those howling sounds distant enough for me to safely venture out for food?
    Is the man in the back of the cave with breath smelling of charred human flesh
    a threat to me?


    In the prehistoric African Serengeti, which had looming predators, injury, illness,
    and starvation, our ancestors realized that their chances of survival improved
    if they were part of a social group. It''s much less threatening to attack a woolly
    mammoth with 10 assistants than single-handedly. As part of a group, our ancestors
    obtained easier access to food, care, protection, and enough sexual invitations
    to ensure survival and the passage of one''s genes.


    With these juicy benefits, the human mind evolved to fear the possibility of being
    rejected by the group.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The Push for the New in the Face of Rejection


    Our brains are hardwired for curiosity—along with its neural twin, worry. Starting
    with the plight of our ancestors from 500,000 years ago, social groups always
    had to be selective. For instance, every cave dwelling had a maximum capacity.
    Groups were more willing to invest their time, energy, and resources if a new
    person appeared to be attractive, intelligent, competent, strong, and cooperative.
    Every human being was vulnerable because they were constantly being evaluated
    by the group. This was not the place to slack off, as the lazy and weak were the
    first to be tossed out to fend for themselves against hungry packs of raptors
    and wolves. To be accepted, our ancestors needed to prove that they could pull
    their own weight.


    How did we protect ourselves against rejection? We constantly monitored where
    we stood from the perspective of other people in the group. Do I contribute enough?
    Am I contributing as much as the others? Am I doing anything foolish to warrant
    rejection and banishment? Over the course of thousands of years, human brains
    evolved to handle the job of hunting, gathering, and other survival challenges.


    Unfortunately, many of the mental tools that aided the survival of our hunter-gatherer
    ancestors get in the way of our ability to enjoy ourselves in today''s modern
    world. For example, prehistoric men and women who worried a lot were more likely
    to survive than their carefree, positive-thinking peers. Thinking negatively served
    as an early warning system. It triggered the brain to recognize actual and potential
    threats in the moment, and it also aided the brain in imagining dangerous scenarios
    that didn''t exist. If people were prepared at all times, they were more apt to
    survive. Even if they were wrong 90% of the time and spent a lot of time worrying
    over nothing, it didn''t matter because survival was the primary goal.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Negativity Bias and the Positivity Offset


    We are hardwired to prepare for the worst. When danger is found—or just anticipated—our
    minds respond quickly with anxious feelings and a compelling desire to escape.
    Just as our ancestors responded with anxiety to the possibility of danger, we
    respond with the same intense fight-or-flight reaction when we rush to get to
    work on time or are about to pay for lunch when we realize that we left our wallet
    at home.


    We spend a lot of time worrying about potentially threatening events that are
    unlikely to happen and, even if they do, are rarely as bad as we think they will
    be. Just as our ancestors worried about being banished from social groups, we
    worry about what other people think of us, and we feel anxious and embarrassed
    when we might be evaluated poorly. Ensuring that we bathe in self-loathing, our
    minds also do a nice job of finding and comparing us to people who are stronger,
    smarter, more attractive, and better equipped to deal with life’s hassles (at
    least that’s we think).


    Knowing the evolutionary design of our brains helps us understand what it takes
    to create a fulfilling life. We are constantly trying to balance the positive
    and negative. Our hardwiring to attend to the negative actually has a name. It’s
    called the negativity bias. Think of our ancestors hearing footsteps behind them
    or the rustling of tree leaves. Their hearts would beat a little faster and they
    would flip their heads around and get ready to fight or flee. We are designed
    to react quickly to potential danger. But more than that, we have the blessed
    curse of being able to dream up all sorts of scenarios in which we can fail, be
    hurt, and die, which naturally leads to even more anxiety and worrying. The negativity
    bias is our intense reaction to potential threat. If you are an anxious person,
    this bias extends further so that ambiguous and uncertain situations are experienced
    as dangerous until proven otherwise.


    There are times when we get a break from a state of anxious alertness. Moments
    when there is absolutely no danger and we feel safe. In this state, we don’t try
    to hide from the world. We can relax and rest. This neutral, inactive state is
    often short-lived. There is another'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'important element of our evolutionary design called the positivity offset.
    What this means is that when we feel safe, we show a slight bias to explore new
    things and seek out new experiences. We are pulled toward rewards and excitement.
    Without this offset, we would never learn, stretch, grow, or evolve.


    # Every Damn Thing Had to Be Discovered by Our Ancestors


    In some capacity, every human is trying to make sense of the world, and this has
    strong evolutionary roots. Whether acquiring resources (tools or shelter), information
    (who to trust in their small tribe), or tangible rewards (food or sexual partners),
    our ancestors needed seeking mechanisms.


    It was only when our ancestors ventured beyond the boundaries of what was known
    that they could add to their knowledge and skills. An increase in knowledge and
    skills could help someone survive another day. Of course, just because something
    was new didn’t mean it helped in the prediction and understanding of anything
    important. Remember, they had to discover everything. Fingering someone’s belly
    button doesn’t do much more than annoy the owner, rocks don’t float, and so forth.
    It was often a creative trial-and-error process. Imagine the number of objects
    our ancestors discarded before they tamed fire. I suppose it’s “possible” that
    a playful caveman picked up flint on the first try. More likely, generations played
    with tree branches, bones, rocks, and anything else they could lift. They probably
    tried to eat, lick, carry, rub, squeeze, hit, shake, toss, dance, and chant these
    objects while waiting for something interesting to happen. Once a fire started,
    they had to learn the connection between what did and didn’t work (cause and effect).


    In an unforgiving environment of animals fighting with each other to live another
    day, there is much to learn. To be motivated to seek out the new, our ancestors
    needed a hard-wired system that would cause them to eagerly anticipate and want
    rewards. This euphoria felt at the possibil-'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'ity of being rewarded compelled them to explore, seek, and investigate. After
    all, it''s the anticipation of being rewarded that motivates and the consumption
    that satisfies. This anticipation and seeking is all about being curious; it is
    evolutionary adaptation at its best.


    # The Social Benefits of Being Curious


    That''s not all. Unarguably, curious explorers were at an advantage in gaining
    social acceptance compared with their less-daring peers. Their new skills would
    have been more attractive to their tribe and in turn would have gained greater
    access to the group''s food, water, tools, and sexual partners. With more resources,
    the explorers survived, and with access to plenty of sexual partners, were more
    likely to pass on these traits to their offspring. It was essential to learn which
    behaviors made them attractive enough to be accepted by a tribe (e.g., providing
    food) and which behaviors ensured rejection (e.g., stealing, being lazy). Over
    generations, curiosity, exploration, and similar traits would be even more common.


    Another behavior aiding the development of relationships is play. At the core
    of play is variety, whether it is devising funny nicknames for friends and teasing
    them, dressing up, climbing trees and buildings, roughhousing, or competing in
    sports and games. Play is curiosity and joy in a blender. Besides being pleasurable,
    play is a training ground for young children and animals to develop essential
    social and problem-solving skills that last a lifetime. In the animal kingdom,
    squirrels choose regular playmates that are outside of their family circle. Even
    when squirrels are separated from their childhood playmates for months and years
    later, when they reunite and that playmate is being attacked by a predator, squirrels
    are more likely to throw themselves into the mix and risk their lives to protect
    them. Those joyful experiences in childhood create lasting friendships that come
    in handy during times of need in the future. Humans show the same pattern. Play
    doesn''t exist without a curiosity system, and regular play often leads to long-standing
    relationships.


    For our ancestors, play, an outgrowth of the curiosity-seeking system,'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'was one of the tools for securing allies and sexual partners, thus increasing
    the likelihood of survival and reproductive success. In play, we experiment with
    different social behaviors, rules, and roles. We expand our toolbox of how to
    relate to other people and what we learn about ourselves. Play is a training ground
    for change.


    # The Dance of Curiosity and Fear


    Of course, not all curious, playful explorers had a happy ending. The unknown
    offers tremendous insights and rewards, but the explorer doesn''t always survive
    to share it. Neighbors sat on their asses during all of these adventures, concerned
    about being comfortable, secure, certain, and in control; compared with the explorers,
    they occupied their time with the familiar and routine. They would have benefited
    by listening to and watching the explorers. Secondhand learning and growth is
    often as good as getting it firsthand, with the added benefit of not having to
    risk injury or death.


    With the goal of being able to effectively navigate the environment, an optimal
    profile of flexibility emerged. The most successful people felt anxious in the
    face of clear and present danger and felt curious in the face of potential rewards
    and learning opportunities. When there was a blend of danger and reward, our ancestors
    experienced a conflict between wanting to escape and survive versus exploring
    and earning all the prizes that came with it—which might help them survive in
    the future.


    Predictions about what might happen in the future were imperfect and, thus, our
    ancestors were plagued with feelings of uncertainty about what to do. We don''t
    spend our lives cowering in fear, thirst, and hunger because our brains evolved
    so that even if we feel mild to moderate discomfort, most of us prefer to explore.
    We are hardwired to experience a rush of excitement when something novel and unpredictable
    breaks through the routine. Alone at the library, we peek at the bare ankle of
    the person next to us only to notice a tattoo with the lyrics to our favorite
    song.


    When we are in unknown territory, leaning toward exploring instead of avoiding
    is the key to a rich, meaningful life; for our ancestors, it was'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'about increasing the chances of life-longevity and reproductive success. Too
    much or too little concern about feeling anxious gets in the way of acting on
    our curiosity. Absent fear, we may go beyond the limits of what''s safe for ourselves
    and those around us. Absent of real danger, when we can''t act on our curiosity,
    we are left with painful regrets of what our lives might have been. Our curiosity
