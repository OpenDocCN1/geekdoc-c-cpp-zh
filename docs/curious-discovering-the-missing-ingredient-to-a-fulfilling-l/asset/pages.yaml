    Richard’s dad played a game with his son called “Where am I?” Richard closed his
    eyes and his dad would ask him to guess his whereabouts: “Whatever direction I
    turn, all I can see are these huge fuzzy blue towers. They’re enormous. They are
    so tall and close together that I can’t tell whether they rise straight into the
