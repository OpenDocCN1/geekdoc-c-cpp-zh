  md: 'to lift one foot and move the other foot forward. When dealing with quicksand,
    that''s a very bad idea. Once one foot is lifted, all of the trapped person''s
    weight rests on only half of the surface area it formerly occupied. This means
    the downward pressure instantly doubles. In addition, the suction of the quicksand
    around the foot being lifted provides more downward pressure on the other foot.
    Only one result can take place: the person will sink deeper into the quicksand.


    As you watch the person stuck in the quicksand, you see this process begin to
    unfold. Is there anything you can shout out that will help? If you understood
    how quicksand works, you would yell at the person to stop struggling and to try
    to lie flat, spread-eagled, to maximize contact with the surface of the pool.
    In that position, the person probably won''t sink and might be able to rollout
    to safety.


    To the person trying to get out of the quicksand, this is an extremely counterintuitive
    idea. Someone struggling to get out of the mud may never realize that the wiser
    and safer action to take would be to get with the mud.


    If you''re like most human beings, too often you get stuck in the quicksand of
    your own anxiety and try to thrash your way to a resolution while bypassing the
    optimal anxiety that adds excitement and leads to peak performance.


    If you want to know what it feels like to be stuck in the quicksand, go to a quiet
