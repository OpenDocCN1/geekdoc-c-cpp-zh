  md: 'Many of the combat veterans returning from the war in Iraq find themselves
    having difficulty transitioning to civilian life. They suffer from nightmares,
    intrusive thoughts about almost being killed and seeing friends get killed, and
    other impairing anxiety symptoms. I spoke to a veteran at Walter Reed Army Medical
    Center as he scoffed at his therapists'' suggestion that he take part in their
    three-week yoga program. He said, "It''s for sissies, not warriors." Two weeks
    later, having started the program, he laughs when I bring up our first conversation.
    What was once completely off his radar, something he despised and ridiculed, became
    a step out of his deepest pain and despair.


    Who knows what each of us is missing out on by our lack of curiosity and exploration.
    It might not even be a brand-new source of interest; it might be recognizing the
    unfamiliar in the seemingly familiar. By taking a step back and looking at something
    as if it is the first time, we see things in people, places, things, and tasks
    that we might have missed by dismissing them too quickly or prejudging what we
    expected them to be. We can use our "unborn Buddha mind" (see Chapter 2) to be
    open and receptive in the present moment.


    # Awakening Interest: A Missing Piece for the Fulfillment Formula


    You might think that it''s all well and good to talk about spending more time
    doing exciting and satisfying things but rather dubious about the likelihood of
    finding such interest in the drudgery of your own life. That''s because there''s
    an important missing link in what we''ve talked about: triggering interest. If
    we look at five of the six kinds of moments that make up a given day, only one
    has to do with things we are already interested in or curious about. Before embarking
    on the quest to create lasting passions, we need to spark interest in the first
    place, and that spark can be hard to find and easy to extinguish. As the famous
    education reformer and psychologist John Dewey wrote in 1913, "You need to catch
    interest before you can hold on to it."'
