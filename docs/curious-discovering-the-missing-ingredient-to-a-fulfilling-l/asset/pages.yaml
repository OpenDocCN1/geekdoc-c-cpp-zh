    # Seeking Purpose, Like Beauty, from Within


    From reading a book, tending to a garden, having a metaphysical epiphany, or searching
    Google for something that was bugging you (When do fish sleep? How can we use
    volcanoes as an energy source?). From the small details to the big searching questions,
    we find meaning and make sense of our world and our place in it. Life is meaningful
    when we “get it.”


    We regularly experience meaning when we make sense of trivial and mundane events
    or when we work through more complex and perhaps frightening matters that affect
    not only ourselves but those we love and care about. Far less often, we experience
    a level of self-understanding that transcends our routine perspective and transforms
    us. These insights can have a profound impact on our well-being. This is the sense-making
    part of meaning. It is about exploring and trying to comprehend who we are and
    how we fit into our little niche in the universe. It is about understanding the
    significance of our lives and the other people and things in them.


    Purpose is a particular type of meaning. It’s when we find a mission or a philosophy
    of life that we abide by. For instance, Gandhi is an exemplar of purpose in life.
    He had at least three: to achieve personal enlightenment, help his fellow citizens
    do the same, and protect the freedom and dignity of human beings (particularly
    the downtrodden and oppressed). Not too shabby for one man.


    Besides Gandhi, plenty of other people devote their lives to protecting fellow
    human beings who can’t protect themselves. Having this type'
