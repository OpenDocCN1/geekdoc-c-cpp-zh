- pgno: 48
  md: 'But stereotype is not destiny, and it wasn''t the ACLU, AARP, or politically
    correct public service announcements that fought the concept of “you’re never
    too old to change.” It was science.


    In the last 10 years, a number of scientific teams began reporting their results
    after following the same people for decades to uncover what parts of our personalities
    remain consistent over the course of our lives and what changes. We are talking
    about scientists observing children until they enter college. In other cases,
    scientists tracked subjects for four decades beginning at age 20! From this laborious
    undertaking, we now know that our personalities, including how curious we are,
    can change across our life spans. For instance, out of 870 intellectually gifted
    kids who were observed from ages 12 to 16: Over these pivotal four years,


    +   - 5% showed a decline in curiosity

    +   - 44% showed an increase in curiosity

    +   - 51% remained the same.


    To put these findings into perspective, 49% of kids changed in their curiosity.
    When you look at the other “big” personality traits, such as being gregarious,
    agreeable, or impulsive, only 34%-38% of kids changed. A hallmark feature of prepubescent
    kids is their difficulties in understanding and handling their negative feelings.
    Yet, only 43% showed a change in their anxiety, embarrassment, and temper tantrums.
    What this means is that of the major, universal personality traits of human beings,
    curiosity and openness are the most malleable.


    Because the playful, boundless curiosity of childhood doesn’t show a slow, steady,
    systematic decline for everyone, it raises an important question. What can we
    do to be in that bracket of people who actually increase (or at least retain)
    their curiosity beyond age 30? This book is devoted to providing the answer to
    that question along with concrete strategies for doing so.


    Based on several studies, we have some tentative answers about the type of behaviors
    at age 20 and 40 that predict openness, curiosity, and the ability to handle and
    even embrace uncertainty at age 60 (a full 20 or'
