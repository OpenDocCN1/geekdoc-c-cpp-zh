  md: 'Shane and Jasmine show that we can intentionally bring creativity to our actions,
    and as Mike shows, we can trigger interest and excitement in our actions. With
    a little effort we can consciously/proactively create intense highs and happy
    endings even when we are doing things that on the surface are annoying, painful,
    or monotonous—and these positive “peak-end” experiences can profoundly affect
    many aspects of our lives.


    # When You Are Leading and Motivating Others


    When I teach my undergraduate and graduate students, I prowl for examples that
    intrigue them—sex, dating, drugs, violence, movies, music, and food. These examples
    and situations are effective because they wake students from their slumber. There’s
    nothing like a brief burst of profanity or a lewd reference to bring a student
    to attention.


    I am very mindful of the mood of students and audiences when I enter them to new
    material—they are apathetic, bored, anxious, or interested? Learning environments
    that include playful group assignments, surprises, and personally meaningful challenges
    can trigger that initial surge of interest. Of course, it shouldn’t be so challenging
    that it causes anxiety or so underwhelming that it causes boredom. By allowing
    people to feel able and competent, they will be less focused on trying to avoid
    looking like an idiot and failing and, in turn, they can be more deeply attentive
    to the task at hand. These are ideal conditions for a sense of wonder and intrigue
    to emerge.


    You might also think work and play should be separated by impenetrable boundaries
    and that there is no room for games, socializing, and food. If this is the case,
    you need to carefully consider the scientific research that shows that when people
    enjoy themselves, they are more creative, efficient, productive, cooperative,
    and are better autonomous decision-makers. What on that list would you not want
    from your captive audience of children, workers, students, athletes, patients,
    or anyone else?


    Finally, you need to remember the goal. If you want people to be interested, committed,
    and willing to devote effort to learning, mastering, and using these skills for
    the long haul, then you can’t avoid the initial step of stimulating excitement.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'It can be especially challenging to engage people who are marginally interested,
    disinterested, or unmotivated. When people are doing tasks under your guidance,
    it helps to be flexible about the ways they can be have and express themselves.


    Rigid rules prevent people from finding their own individualized strategies to
    enhance their interest and only serve to alienate and reduce their performance
    and commitment. Researchers have shown that when people feel they are being observed
    and controlled, they experience greater negative feelings and perform worse.


    The same goes for intense time pressure, which only disrupts interest because
    people become narrowly focused on completing tasks and not failing. Loosening
    the grips of surveillance and oversight and being flexible increase the likelihood
    of getting elevated interest and dedication from those around you.


    # An Important Caveat: Being Attuned to the Differences between the Uninterested
    and the Interested Person


    Not everyone enters a task or topic at the same place. Some people start off with
    a strong initial interest. What happens when you use the same exciting, stimulating
    techniques with those who are less interested? Sure, many will be transformed
    and end up becoming attentive, engaged, and interested, but those who start off
    with a spark of interest actually lose some of their excitement and luster.


    This makes perfect sense. Let’s say that I absolutely love playing Frisbee but
    no one is interested in playing a game of Frisbee Golf except my brother, who
    happens to be a world-class player. To recruit other players, my brother shows
    us some tricks. He spends 45 minutes showing us how to skip the disc off the ground
    and up into the target or an overhead hammer throw where it travels flat side
    down and lands at the target right side up (very weird). Throughout the game,
    he periodically stops the action mid-game so we can get more pointers. These tutorials
    might draw the others in, but the tedious down time'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'might dampen my own interest, preventing me from getting into a rhythm.


    The same thing happens when you try to teach people about home repairs or computers,
    or when you try to get anyone involved in a task in which they already possess
    a strong interest. The bells and whistles can be bothersome and distracting. They
    can feel frustrated and demoralized that you need to resort to tricks to intrigue
    them.


    So it''s important to be mindful of where people are starting from with their
    interest and background knowledge. Overestimate their interest and you might forget
    that they need a little extra incentive to be motivated or they will be at risk
    of dropping out of the picture. Underestimate their interest and you might rob
    them of pleasures they are already prepared to experience. If you have a mix of
    interested and uninterested people, one solution is to bring the interested people
    into the forefront as fellow instructors to show off their talents and potential.


    # A Brief Primer on Practicing Curiosity


    Don''t treat your goal of becoming more curious as something frivolous that you
    can set aside because there are more pressing matters in your life. Health and
    family trumps nearly everything. After that, few things are as important as your
    well-being. Approaching life as a curious explorer is going to help you work toward
    greater well-being. Schedule time for novelty just as you would for work, medical
    appointments, or anything else that you would never miss unless you had a legitimate
    excuse. To be more curious, you need to devote time to change.


    One of the tried-and-true principles of body building is relevant to becoming
    more curious. It''s called muscle confusion. If you want to transform your body—whether
    by gaining more muscle, losing fat, or becoming stronger or more agile—you need
    to consistently alter your routine. Our minds and bodies are designed to conserve
    energy and do the least work possible. If you go to the gym every day and spend
    30 minutes on the treadmill at the same speed, do the same three exercises to
    build your'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'biceps using the same weight, and do everything in the same order, you can
    ensure that you will plateau soon. Your body will learn what it has to do, and
    as soon as it does, it goes on autopilot and although you are still running, jumping,
    pulling, and pushing, your body stops growing. The key to maintaining a healthy
    mind and body is to constantly change the variables in your workout. Change the
    types of exercises you do, the order in which you complete them, the angles in
    which you hold your body, the number of sets and repetitions you do, the length
    of rest periods between sets, and so on. Trick your body so it will have to adapt
    to the challenge. New muscles will be recruited to complete the routines and your
    body will be forced to grow.


    The same goes for becoming more curious. Little things make a difference in changing
    the way you approach life. It is easy to stick with structure and order because
    routines make us feel safe and secure in an uncertain world. But we can open our
    eyes to the fact that novelty and enticing things that can grab our attention
    are everywhere. We can change our habits, change the way we act, and change the
    way we see the world anytime, anyplace. Appreciate and search for more than what
    you already know, already assume, and already expect to happen. I am talking about
    a mindset of expecting there to be things you don''t know and realizing that this
    does not mean you are vulnerable or unintelligent because you can''t predict what
    is going to happen. Rather, it means there are opportunities for learning, discovering,
    and growing.


    Another simple strategy is to remember to avoid early committal to ideas and judgments.
    Hold on to the mantra that there is always another way at looking at things, and
    there is probably something you are paying too much attention to and something
    interesting that you are ignoring or missing. Keep this in mind every time you
    make judgments about yourself, other people, tasks, the world, the past, the present,
    and the future. Wouldn''t it be wonderful if this approach were part of the training
    for doctors making diagnoses, researchers trying to make sense of the world, journalists
    reporting news stories, businesspeople working on projects, and politicians making
    decisions? When we are open to new possibilities, we find them. Be open and skeptical
    of everything.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Practicing curiosity can be difficult. It can’t be done once a week, like a
    psychotherapy session. It has to be done regularly, and sometimes when we are
    just getting started in altering our approach to living, it has to be all encompassing.
    We might use the following guidelines:


    +   - When waking, what am I seeing that I overlooked before?

    +   - When talking, I am going to remain open to whatever transpires without categorizing,
    judging, or reacting, I will let novelty unfold, resisting the temptation to control
    the flow.

    +   - When walking outside the house, I will gently guide my attention so I can
    be intrigued by my every bodily movement and whatever sights, sounds, and smells
    are within my range.

    +   - I will assume or presume nothing except that novelty exists everywhere.


    With this mindset, every single gesture is guided by openness and curiosity.


    Try it for just five minutes every day. After a week, add a little more time to
    your training. Ensure that you practice in different circumstances. One day try
    it at dinner with your family or friends. One day try it at a meeting at work
    or in class at school. Try it while exercising or while taking a walk, cooking,
    eating, sitting on your porch, and so on. This approach will ensure you remain
    flexible, with curiosity unbounded by any particular circumstance.


    Stick with this practice and you will be taking advantage of neural plasticity,
    as experiences change your personality for the better. From triggering interest
    and pockets of meaning, we move on to the creation of lasting interests and passions
    in the pursuit of sustainable well-being.'
