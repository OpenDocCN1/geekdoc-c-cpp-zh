    # # The Search for Lasting Intimacy: Peas in a Pod or Opposites Attract?


    As we''ve seen, making the initial leap to start a relationship, however casual,
    is challenging because we will always be uncertain about what other people think
    and whether they truly like us. That is why we prefer people who are similar to
    us in physical beauty, intelligence, interests, attitudes, and so on (the proverbial
    peas in a pod). It''s an indication that we are acceptable and in sync with them.
    Rejecting a very similar person is like rejecting yourself.


    When we focus on similarities, however, we overlook how little we ever know about
    anyone else. This factor of not knowing is, in fact, a key to strengthening all
    kinds of relationships. "Opposites attract" is a maxim that applies to many relationships.
    There is value in attending to what we don''t know about people and how they differ
    from us.'
