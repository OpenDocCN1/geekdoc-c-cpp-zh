- pgno: 82
  md: '# Not All Moments Are Created Equal:

    The Five Kinds of Moments in Everyday Life


    There''s an inspiring message in this somewhat depressing news about how most
    of us spend so much of our time. We can measure and then shift the balance of
    desirable and undesirable moments in our lives. Before we can add activities that
    optimize our well-being and remove activities that detract from it, we need to
    penetrate the motives behind our movements. Namely, what is it that allows us
    to do what we love and why is it so hard to break free from what we despise? What
    we do and what we might do can be categorized into five kinds of activities, each
    with a different impact on our quality of life.


    +   - Activities we truly enjoy and naturally want to continue doing

    +   - Activities we don''t enjoy, that aren''t necessary, and take a toll on our
    lives

    +   - Activities we don''t enjoy, but for important reasons, are necessary to
    continue

    +   - Activities that allow us to rest and replenish ourselves

    +   - Activities we don''t engage in that might contribute positively to our lives


    Some activities are inherently interesting and enjoyable on their own, and we
    don''t need prodding to continue engaging in them. If you are passionate about
    achieving a specific goal—large or small—you''ll be motivated to achieve it. Your
    interest, engagement, and curiosity will carry you forward.


    Our hobbies, interests, and bursts of play fall into the category of desirable
    activities. (So does work when it is your calling, or purpose, in life.) During
    a task, the more curious we are, the more willing we are to exert effort and energy
    to engage in it. However, it doesn''t feel like effort because when we are absorbed
    and motivated, the effort is enjoyable instead of draining and aversive. When
    we are curious, the critical point at which our energy is depleted is pushed back,
    and we can persist at tasks for longer periods of time.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The interested person naturally has greater stamina and capability, and interest
    is a powerful predictor of effectiveness. Managers, supervisors, coaches, teachers,
    parents, and even relationship partners would be smart to heed this advice: delegate
    tasks to an interested person.


    As for what affects our interest in sticking with something, there are a number
    of important factors. Tabula rasa is a myth as we are not an empty slate. When
    we take up an activity, we carry beliefs about how interesting it appears to be.
    These beliefs are going to influence whether we stick with it or not. We also
    carry beliefs about our ability to handle new, uncertain, or challenging situations.
    Expertise is less important than what we believe about our skills.


    Imagine entering a casino. The baccarat table might appear novel and interesting.
    It is viewed as the most sophisticated game. Players feel like royalty, as it
    is often played in a back room behind velvet curtains. Without confidence in your
    ability to learn how to play the game, your initial interest is sure to be replaced
    quickly by an unwanted surge of anxiety. For curiosity to reign, situations with
    high levels of uncertainty require a matching level of self-efficacy (the belief
    that you can be effective).


    Some activities aren''t personally interesting or valuable, and continuing to
    do them can be hazardous to our health. Deciding to quit is often the best possible
    way to deal with activities and situations we don''t enjoy. Quitting reduces stress
    and conserves our energy for more valuable and engaging outlets.


    Considering this radical idea: There is absolutely no reason to continue doing
    activities we don''t feel compelled to do. And if we do feel compelled, we can
    pay careful attention to "how" and "why" we feel that way in order to recalibrate
    the ratio of pleasurable to painful moments in our daily lives.


    We often allow ourselves to get stuck in unwanted activities because of erroneous
    beliefs and the motivation to avoid pain (as opposed to seeking rewards). Your
    favorite band is coming to town and you were planning to buy tickets, but something
    else that isn''t compelling pulls you away. You might be saying to yourself:'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'If I don''t help my brother-in-law clean his garage, my wife is going to be
    pissed.


    If I work this weekend, my boss will know he can count on me, and he''ll think
    I have management potential.


    I shouldn''t be frivolously spending money on myself.


    None of us are immune to avoiding the wrath of a loved one or trying to make a
    good impression. However, if the toll is too great, if we allow ourselves to continue
    to deviate from our cherished values, we suffer needlessly.


    Some activities are uninteresting and painful, but there are reasons we feel compelled
    to continue doing them. It would be wonderful if every moment of our lives was
    exciting and interesting or, alternately, calm and serene. Unfortunately, an average
    day is filled with mundane and even undesirable tasks that cannot be escaped.
    Cleaning dishes, pumping gas on a blustery winter day, and calling credit card
