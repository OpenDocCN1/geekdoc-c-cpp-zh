- pgno: 305
  md: 'Curiosity is not an only child; it is part of a family of terms used by writers,
    scientists, and everyday people making conversation to capture the essence of
    recognizing, seeking out, and showing a preference for the new. Isolated islands
    of knowledge have proliferated over the last century, and with a few notable exceptions,
    researchers and experts neglected to join them together. Just as all of the continents
    of the world were once interconnected as a single supercontinent named Pangea,
    before they drifted apart to be separated by vast oceans, so curiosity can be
    seen as a Pangea of concepts that are all interconnected but are separated in
    our minds by our fields of study and personal experiences. It’s important to clarify
    concepts that are part of the curiosity family; what makes each of these concepts
    unique is as important as their shared features. If we grasp the totality of this
    big, happy family, then for the first time we can begin to understand the depth
    of scientific discoveries on the benefits of being curious. The curiosity family
    includes the following siblings:


    +   a. Interest is the emotion we feel when we are curious. Interest is one of
    the select universal emotions that you can find in almost any human anywhere in
    the world (and plenty of animals as well). After only a few months, infants show
    a preference for certain sights and sounds in their environments. Describing something
    as “interesting” is so different than saying “it makes us curious.”


    +   b. Flow is a term defined by psychologist Mihaly Csikszentmihalyi as “being
    completely involved in an activity for its own sake. The ego falls away. Time
    flies. Every action, movement, and thought follows inevitably from the previous
    one, like playing jazz. Your whole being is involved, and you’re using your skills
    to the utmost.” As a state of deep concentration and commitment, flow occurs when
    we are interested and challenged in an activity such that nothing else seems to
    matter. Although flow usually occurs when we are working toward a clear goal,
    the reward stems from the activity itself and not any achievement or accomplishment.
    Flow can be considered an extreme variant of being curious. see Csikszentmihalyi,
    M. (1990). Flow: The psychology of optimal experience. New York: Harper & Row.


    +   c. Intrinsic motivation reflects one of the underlying reasons for doing an
    activity, and curiosity happens to be the centerpiece. In the words of the distinguished
    psychologists Richard Ryan and Ed Deci, “Perhaps no single phenomenon reflects
    the positive'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'potential of human nature as much as intrinsic motivation, the inherent tendency
    to seek out novelty and challenges, to extend and exercise one’s capacities, to
    explore, and to learn.” Quoted from Ryan and Deci (2000), op. cit.


    d. Novelty seeking is one impetus for our curiosity. Absolute novelty seeking
    is about engaging in pure newness that has never been experienced before. This
    is quite rare. More common is relative novelty or the uniqueness of objects, people,
    or situations because of a change in context or perspective. Even though I might
    know every beat and lyric to “Hey Joe” by Jimi Hendrix, the tempo might feel faster
    or slower depending on my mood (on the back porch drinking tequila, racing through
    traffic to get home in time to tuck my kids into bed) and what version is being
    sung (live at Woodstock; a rendition by a wedding singer). In segments of this
    book, I will be discussing novelty as one of the most relevant sources in becoming
    curious.


    e. Openness to experience is a broad personality trait that captures the breadth,
    depth, and complexity of a person’s inner world. Five basic, universal personality
    traits discovered by psychologists together can describe a person from almost
    any culture and one of them is openness (among the others are conscientiousness,
    extraversion, agreeableness, and neuroticism—an easy way to remember them is the
    acronym OCEAN). A person open to experiences is intellectually curious, willing
    to try new activities, aware and receptive of their felt emotions. They are also
    imaginative, appreciative of music and other forms of creative expression, and
    skeptical of traditional social, religious, and political values. Thus, openness
    can be considered a badge podge of ingredients, and curiosity happens to be a
    major theme but not the only one. After all, you can be highly curious without
    showing a strong appreciation of the arts or any interest in politics. That being
    said, people who are open extract great pleasure from variety and novelty, show
    a strong desire to explore and seek stimulation, and tend to be independent-minded
    or psychologically flexible. Our knowledge about curiosity can be gleaned from
    work on this particular personality trait. See John, O. P., & Srivastava, S. (1999).
    The Big Five trait taxonomy: History, measurement, and theoretical perspectives.
    In L. A. Pervin and O. P. John (Eds.), Handbook of personality: Theory and research
    (pp. 102–138). New York: Guilford; McCrae, R. R., & Costa, P. T. (1997).'
