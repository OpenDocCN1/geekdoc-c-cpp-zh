    # Finding the Right Home to Align Your Actions with Your Values


    Doing something that is a good “fit” with your values, when you get to use your
    strengths on a regular basis, feels good. These positive feelings spill over into
    the activity itself, so you are more likely to be interested, devote greater effort,
    and persevere longer. It’s a powerful tool for developing, strengthening, and
    maintaining interest and meaning. This notion of “fit” cannot be explained by
    how enjoyable a task is or how much of a positive mood people feel. When your
    values and strengths are linked to an activity, this sparks interest over and
    above feeling good.


    We all know of situations that arm or disarm us, that seem to naturally fit with
    our strengths and values. Some of us are more people-oriented, which means we
    prefer to do things with someone rather than alone. Our strongest values may include
    helping others, sharing love, or being accepted. Ignore this element, and you
    are likely to find yourself in'
