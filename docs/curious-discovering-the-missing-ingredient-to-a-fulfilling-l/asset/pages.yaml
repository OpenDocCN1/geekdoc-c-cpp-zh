    more curious children (those who asked questions and manipulated objects) learned
    more about the equipment and procedures and made more positive comments about
    doctors and hospitals. It was clear that children “have a naïve, joyous curiosity
    about medical equipment.” The more kids are allowed and urged to explore and play,
