    # Three Paths to Purpose in Life


    There are certain venues in which we are most likely to see purpose in action
    (e.g., religion and spirituality, work as a "calling," being a parent, and caring
    for other people). Besides work, a common thread is the use of one''s strengths
    in the service of something larger than the self. These aren''t the only areas
    where a sense of purpose can exist. Plenty of people find purpose from hobbies,
    interests, and passions. There is no single type of purpose, and there is no particular
    time in your life when you are destined to find it.


    I have learned that there is no single approach for creating a purpose. But my
    colleague, Patrick McKnight, and I believe we can define at least three paths
    to developing a purpose in life.


    +   1. We can learn, modeling our behavior on that of other people and adopting
    their values and sources of meaning as our own.

    +   2. We can respond to life-altering events with a mindset of openness and compassion.
    By doing so, we can make meaning and add clarity in the aftermath.

    +   3. We can seek, intentionally opening doors, searching for purpose.'
