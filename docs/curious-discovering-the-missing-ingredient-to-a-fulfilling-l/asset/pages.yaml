    To do so, we interrogate without the openness and awareness that characterizes
    the curious explorer. We can see the difference in the contrasts below:


    +   - Curiosity creates possibilities; the need for certainty narrows them.

    +   - Curiosity creates energy; the need for certainty depletes.'
