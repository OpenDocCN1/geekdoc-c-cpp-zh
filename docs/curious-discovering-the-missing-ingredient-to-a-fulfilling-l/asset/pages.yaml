- pgno: 144
  md: '# # Why Relationships Work for Us


    If there is one characteristic that separates very happy people—the ones who laugh
    and hug strangers while kamikaze pigeons shit in their hair—from the rest of society,
    it’s the quality of their relationships. Very happy people have satisfying and
    meaningful connections with others.


    Robert Biswas-Diener, a happiness researcher, interviewed the homeless in Fresno,
    California and prostitutes in the slums of Calcutta, India. Although people in
    Fresno had greater access to food, shelter, and free health care, the prostitutes
    in Calcutta were happier. Why? Returning to the notion that there is more to a
    fulfilling life than happiness, Robert concludes, “while the poor of Calcutta
    do not lead enviable lives, they do lead meaningful lives.” Prostitutes in Calcutta
    possess stronger social ties and have regular contact with family members, allowing
    them to cope more effectively with the destitution, decay, and degradation. Strong
    social relationships provide meaning and moments of bliss in the surprisingly
    safe, low-pressure center of the cyclone, where theoretically, you can remain
    protected and unscathed even when surrounded by realms of destruction.


    Strong social relationships create meaning and well-being. Daily social interactions
    are equally important as the building blocks for creating good relationships;
    even when they don’t lead to relationships, they are the springboards for the
    best and worst moments in our lives. Feeling rejected and hurt by other people
    is often the cause of intense, lasting pain. Alternately, feeling accepted and
    cared for by other people inspires greatest comforts.


    Although we are no longer solely guided by that ancient, reptilian part of our
    brain that tells us to “cat, %#@!, and kill” so our genes will survive another
    day, our brains still push us to explore and reward us for seeking out the new.
    These are the same strategies that led our ancestors to find new sources of food,
    sexual partners, and creative ways to defeat enemies and increase social status.


    A close look at modern life shows that we spend an enormous amount of time and
    effort to increase our skills, knowledge, experiences, power,'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'and social resources to make inroads toward important goals. Sure, we are motivated
    by the pull toward safety and seek to avoid danger, but we also possess a fundamental
    motivation to expand and grow as human beings. Not only does growth feel good,
    the wisdom and strength of knowing more and increasing our skills gives us an
    advantage at surviving and thriving in an uncertain world.


    Perhaps the best way to expand and grow is to enter into close relationships.
    For example, when two people first enter a romantic relationship, it begins with
    a whirlwind of exhilaration. Being curious and wanting to know about our partner
    is important and by acting on these desires we develop a meaningful relationship
    by “including the other in the self.” This is typically done by spending time
    and sharing experiences together. We mutually disclose the details of who we are
    now and who we were in the past, and we remain open and respectful of how we differ
    from each other and alert to common ideas and interests. From these exchanges,
    we acquire the knowledge, insights, abilities, and possessions accumulated by
    our partner over their lifetimes (and they do the same). This is a period of rapid
    self-expansion as each of us takes turns sharing and absorbing the other into
    our identity (or sense of self).


    You see a similar pattern in the friendships of young girls who spend hours and
    hours talking, emailing, texting, and carving out large chunks of time to be together.
    You also see this pattern of passionate self-expansion in any friendship where
    people are becoming confidants to each other, though with less intensity in men’s
    friendships.


    Especially in beginning romantic relationships, novelty is in abundance and it’s
    arousing and exciting. When our partner is on a quest to get to know us, we feel
    desirable and worthwhile. Someone wants to unravel the superficial layers of our
    personality, penetrating deep into our hopes, fears, aspirations, strengths, weaknesses,
    likes, and dislikes. When we compare ourselves to how we lived before the relationship,
    we recognize how much we’ve grown in a matter of weeks or months and sometimes
    find it hard to imagine who we were or how we lived without this other person
    in our life.'
