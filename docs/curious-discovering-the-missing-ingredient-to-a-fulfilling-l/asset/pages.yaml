  img_proc: true
- pgno: 52
  md: 'The idea of improving people''s intelligence is appealing. Yet, attempts to
    enhance intelligence such as with the Head Start Program (early education program
    for infants and toddlers) more often than not have been colossal failures. It
    is unclear exactly how resistant intelligence is to improvement, but a century
    of research suggests that approximately 50% of our intelligence can be explained
    by our genetic blueprint and another 10% reflects both how we were raised and
    whatever happened during our prenatal womb adventures.


    While intelligence is quite resistant to change, curiosity can be cultivated,
    and it is available to anyone who desires a fulfilling life. Many prodigies in
    a wide variety of disciplines start off by playing music, writing poetry, or shooting
    hoops because it feels good, but this pleasure often obliterated by the pressure
    to succeed. Basically, when curiosity and interest disappears, the benefits go
    with them.


    When we remain hyperfocused on intelligence, we miss out on an important truism:
    The most intelligent people are not necessarily the best and brightest. Curiosity
    predicts better grades and achievement test scores in school, and curiosity in
    the classroom is a better predictor of students'' willingness to transfer knowledge
    learned into long-term interests and careers. Even mentally retarded children
    who are curious show an intense motivation and dedication to learning that rivals
    their "higher-functioning" peers. We need to ask whether the goals of teaching
    children is for them to do well on tests and get into the best colleges or for
    them to be successful. If it is the latter, the cultural obsession with intelligence
    needs to be reconsidered and curiosity needs to be brought to the forefront.


    # Meaning and Purpose in Life


    My own work has shown that curious people possess an optimal orientation to ensuring
    the continual building of a fulfilling life. They are immersed in the present,
    feeling as if their life is infused with meaning, and simultaneously, they are
    receptive to searching and finding meaning and adding it to their existing supply.


    How do we know this? In several studies, we asked people to track'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'what do they each day and to what degree they extracted meaning from these
    activities for several weeks. With this approach, we discovered what people actually
    did in a given day and week, as opposed to relying on retrospective reports of
    what they thought they did. This is important because we know that if you ask
    parents of young children if their lives are enjoyable, they invariably provide
    an enthusiastic “yes” to questions. Yet, if you ask them to report on what happens
    during the course of a particular day, you get drastically different results.
    Parents report extreme frustration and unhappiness more frequently than moments
    of joy. How you reflect on your past is often dramatically different than what
    actually happened in the moment.


    Curiosity is also the entry point to many of life’s greatest sources of meaning.
    We can refer to them as interests, hobbies, and passions. If we are going to find
    our calling and passions in life, it is going to stem from something that unleashes
    our curiosity and fascination. Exploring and discovering is the trial-and-error
    process of following up on things that are interesting and determining which are
    worthy of investment for the long haul. Curiosity is the driving force behind
    finding and creating small and sustainable pockets of meaning. It could be spending
    time with a significant other or the experience that comes from complete immersion
    in a conversation, book, movie, game, or sport and then making sense of the event.
    This process will be discussed at length in a later chapter of this book.


    # Social Relationships


    We don’t often equate curiosity with social relationships. Yet, I firmly believe
    you cannot form and maintain satisfying, significant relationships without an
    attitude of openness and curiosity. One of the top reasons that couples seek counseling
    or therapy is pure boredom. This is often the starting point of resentment, hostility,
    communication breakdowns, and a lack of interest in spending time together (which
    only adds to the initial problem). Curious people report more satisfying relationships
    and marriages. Happy couples describe their partners as interested and responsive.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Besides existing relationships, curious people act in certain ways with strangers
    that allow relationships to develop more easily. In one of my studies, people
    spent five minutes with a stranger of the opposite sex in a conversation to get
    acquainted, and then each partner made judgments about their partner’s personality.
    We also separately questioned people’s closest friends and parents to gain insight
    into the impressions that curious people formed on the people who know them best.
    Acquaintances of a mere five minutes, close friends, and parents all view highly
    curious people as highly enthusiastic and energetic, talkative, interesting in
    what they say and do, displaying a wide range of interests, confident, humorous,
    less likely to express insecurities, and lacking in timidity and anxiety compared
    with less curious people. Curious people ask questions and take an interest in
    learning about partners, and intentionally try to keep interactions interesting
    and playful. This interest contributes to more satisfying and meaningful interactions
    that, in turn, often lead to the development of relationships.


    In the absence of curiosity and openness to experiences, people show an intolerance
    of uncertainty and a strong need for closure in their lives. While these characteristics
    might aid in protecting a person from anxiety and stress, their destructive influences
    on social relationships are far ranging. Less curious people rely on stereotypes
    to describe others and find new information that is inconsistent with these beliefs
    to be threatening. As a result, they cling even more strongly to their first impressions
    even when they are wrong. This closed-mindedness is the springboard of prejudice
    and the rapid rejection of those who disagree or fail to conform.


    To avoid the discomfort of uncertainty in social relationships, less curious people
    quickly shift from love to hate, trust to mistrust, and other forms of black-and-white
    thinking. Curious people are comfortable working through doubts and mixed emotions
    in their relationships. Less curious people view ambivalence about a relationship
    partner as a sign of unworkable problems that quickly escalate into extreme action:
    violent disagreements, rejection and distrust, and abrupt break-ups. The origin
    of societal ills can often be traced to the absence of curiosity.'
