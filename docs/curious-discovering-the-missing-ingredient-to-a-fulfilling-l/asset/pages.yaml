- pgno: 86
  md: 'Distinguishing habit from effectiveness cannot be overlooked. Just because
    we do something regularly doesn’t mean it serves the purpose we think it does.
    Based on Nielsen media research collected in November 2008 in the United States,
    the average household has the television on for an incredible eight hours and
    18 minutes per day! In the United Kingdom and other parts of the world, it’s not
    much better, as the average person watches four hours of TV per day. When asked
    how they feel, it’s not pleasure or relaxation; more often than not it’s a state
    of dullness or mild discontent. Whatever the function of television is, it usually
    doesn’t provide the replenishment we think it does. The same might be true for
    other pieces of your daily repertoire.


    When you pick an activity to replenish your energy, it shouldn’t feel neutral,
    it should feel good. Replenishing activities induce positive energetic states,
    such as excitement, or calmer states, such as serenity and tranquility. What matters
    is that energy is produced rather than expended.


    **We need energy to act on our curiosity, and we need curiosity to discover what
    works to replenish our energy.** We can observe, experiment, and modify our relaxing
    and refueling activities as necessary to discover what works for us. This exercise
    should be nothing more or less than a personal trial-and-error. Instead of going
    on hunches and assumptions, for one week use a notebook to record how you feel
    before and after an activity (interested, energized, relaxed, bored, tired, irritable)
    on a scale from 0 (didn’t feel it) to 10 (very intensely).


    Honor your individuality. You might be extremely extroverted (gregarious, assertive)
    or introverted (reserved, quiet). Some people recharge by being with other people,
    and some people do it alone. Don’t do what you should do (because of your gender,
    age, or career) or what other people do; follow your own sense of wonder and interest.
    If you take a look at a two-year-old, you don’t find limiting categories of what
    interests them. Aberrant as it seems, some teenagers find cleaning dishes to be
    relaxing, some bodybuilders unwind with pedicures, some construction workers fuel
    themselves with a book by Jose Saramago or Milan Kundera, and some homemakers
    recharge their batteries by riding 10 miles of whip-lashing mountain bike trails.
    I know because I met some of these'
