  img_proc: true
- pgno: 241
  md: '# # Sensation Seeking at Work


    High-sensation seekers try to find work that ensures intense novelty and uncertainty
    on a daily basis (or they suffer). When you look at the sensation-seeking levels
    of firefighters and police officers, they are no different than the average criminal.
    Scientists also found that the sensation-seeking levels of criminals are the same
    as people devoted to extreme sports such as snowboarding, skydiving, and rock
    climbing. It makes sense. These outlets provide similar thrills and excitement.


    Even in the throes of major combat, war veterans report excitement and meaning.
    Prisoners of war report thrills and excitement along with their terror and anger.
    Mixed feelings are common, particularly for the high-sensation seeker. They accomplish
    great, heroic feats by taking risks and working with instead of against their
    fear. They cope best in difficult, life-threatening situations.


    Combat veterans who are high-sensation seekers report less trauma, stress, and
    emotional problems in the war zone. However, they often have greater difficulty
    making the transition from the excitement of wartime activity to the domesticated
    life of commuting to work, taking out the garbage, and trimming hedges. The mundane,
    quiet routine is a bad match for their need for speed and thrills. Knowing this,
    we can improve the lives of servicemen -and women- by helping them find new, healthy
    outlets for these needs. Ignoring their biologically based desire for variety
    and novelty is a recipe for unnecessary pain and suffering.


    Other high-sensation seekers become psychologists, surgeons, trial lawyers, and
    investors. In contrast, low-sensation scorers prefer structured, well-defined
    occupations with order and routine. However, sometimes it''s less about what people
    do for a living than how they approach what they do. High-sensation-seeking parents
    find rewards that low-sensation seekers may not be attuned to. For mothers, this
    might include a more intense sensory experience of breast feeding, relishing the
    spontaneity of their older kids, and letting their children''s playful and creative
    games influence them to do the same. Although parents are the guardians and caregivers,
    our kids can be great teachers to us if we are open and curious.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'In one study, parents and teachers were asked what they learn (if anything)
    from children. Life lessons included:


    +   * Shifting life priorities. Stop dwelling on minor hassles and redirect energies
    toward meaningful life aims.

    +   * Being more creative and flexible. Realizing there are multiple ways to reach
    a given goal (and get out of a jam).

    +   * Looking at the world with greater wonder and awe. When children ask “why,”
    we are reminded how rarely we question what goes on in the outside world. We know
    much less than we think. Kids provide a model of how to be ignorant without any
    semblance of embarrassment. The pleasures of finding things out outweighs the
    discomfort of not knowing something.

    +   * Appreciating the pleasures of being playful and goofy. Far too many adults
    mistakenly believe this should end at a certain age and be replaced with a serious,
    somber attitude. Children remind us of what we’re missing without any good reason.


    High-sensation seekers are more apt to recognize these life lessons and be more
    open to adopting them. By finding sensations and transforming situations to be
    more interesting, it becomes easy for sensation seekers to get the most from their
    occupations.


    In general, high-sensation seekers get bored easily, and when they do, they initiate
    problems, including arguing with coworkers or stealing office supplies to fuel
    excitement in an otherwise underwhelming environment. Having to deal with volatile,
    sensation-high-sensation-seeking employees, managers and coworkers often suffer.
    The best way to deal with the situation is to ensure there is a good match between
    a person’s personality and the tasks they are given. Variety is essential. Asking
    and giving feedback is essential. In the end, if a sufficiently stimulating environment
    can’t be provided, sometimes the high-sensation seeker needs to move on to a high-throttle,
    exciting career.'
