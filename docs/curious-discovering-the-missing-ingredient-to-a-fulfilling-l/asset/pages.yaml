  md: '# # Unrequited Love and Erotomania:

    Undying Curiosity for a Disinterested

    Object of Affection


    Earlier, we talked about the universal desire to grow as human beings and the
    important role other people play in that process. We are attracted to people who
    help us to expand who we are and how we see ourselves. Unfortunately, our feelings
    of attraction aren’t always reciprocated.


    When it comes to unrequited love, the desire for a person is enormous but the
    probability of actually being in a relationship is near zero. For myself, I can
    enjoy my crush on Jennifer Connelly (from the movies _A Beautiful Mind_ and _Requiem
    for a Dream_) knowing the only attention I might receive from her is a stock photo
    with a stamped signature—or a pistol whipping from a body guard if I ever get
    close enough to say “hi.”


    Unrequited love becomes much creepier and perverted when people ignore outright
    rejection and stalk the object of their affection. They believe that a relationship
    is possible if they just try harder. They may believe that their love interest
    is also in love with them, or that if they ever met, the object of their affection
    would instantly feel the same way. Curiosity goes awry. Their intrigue about what
    their love interest is doing, and how they “secretly” show their feelings for
    them, adds an elusiveness that makes it even more exciting. The uncertainty and
    enthusiasm of the chase gets mixed into the love cocktail, fueling further interest
    and persistence.


    Due to the public nature of their lives, celebrities are common targets of obsessive
    passions. The name for this kind of romantic interest in someone with a higher
    social status (e.g., politician, celebrity) is erotomania.


    John Hinckley, Jr., attempted to assassinate President Ronald Reagan to gain the
    love and respect of actress Jodie Foster. Margaret Mary Ray is known for stalking
    and claiming to be the wife of late-night-TV host David Letterman and former-astronaut
    Story Musgrave. Other celebrities known to have erotomaniac fans include John
    Lennon, Linda Ronstadt, Madonna, Steven Spielberg, Barbara Mandrell, and Uma Thurman.


    Dr. Park Dietz analyzed more than 5,000 letters written to celebrities'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'from delusional fans. Dietz found that at least 800 of the fans had made an
    attempt to approach the celebrity in person. When the fan failed to get a response,
    they often became more persistent and increasingly violent. The dark side is not
    limited to obsessive passions. Sensation seeking, morbid curiosity, and eccentric
    sexual interests serve as themes in a subset of peoples'' lives. People with these
    interests make up a relatively small percentage of the population, yet in our
    voyeuristic society, we are intrigued by them. How did they develop these extreme
    forms of curiosity that violate social etiquette and, in some cases, the law?
    What causes someone to put their own or someone else''s life on the line for the
    sake of an interesting experience?


    # # Social Information Seeking


    Curious people can also be downright annoying. Does this characterize you?


    +   * My friends would describe me as always peppering them with questions about
    things.

    +   * I sometimes irritate friends and relatives by asking them very personal
    questions about why everything is the way it is.

    +   * People tell me that I am often so distracted by new, exciting things that
    cross my path that I end up being tough to be around.


    It''s fair to say that in the absence of truly caring about people and wanting
    to know them better to connect with them, being curious is a social liability.
    People know when they are being treated as if they are interchangeable with other
    forms of novelty. Nobody wants to be exploited as a vessel of information until
    someone more interesting strolls along. Gathering information about people in
    our social world helps us navigate our social environments. The type of information
    that we seek about others can be public (asking about someone''s profession or
    gender)'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'or private (wanting to know who someone is sleeping with). In most cases, obtaining
    information about other people is acceptable and even expected. This is because
    social curiosity serves several important functions:


    +   - It feeds our curiosity and increases our knowledge about others.

    +   - It provides us with a sense of belonging.

    +   - It helps us evaluate ourselves and our social standing compared to our peers.

    +   - It has entertainment value.


    The motivation to seek information about others varies. Often, we respect social
    curiosity. We expect people to verify the credentials of a nanny or a surgeon
    and learn about the family and friends of romantic partners.


    Many people find it intriguing to gather information about people who are far
    removed from their lives. Our culture’s fascination with celebrities is a great
    example of social curiosity. Supermarket checkout racks are filled to capacity
    with tabloids that feed our interest in the lives of celebrities and noncelebrities
    alike. Is this social curiosity problematic? Hardly. Yet like any personal interest,
    it’s possible to get carried away.


    Social curiosity can lead to the violation of privacy through spying, snooping,
    and eavesdropping. Of course, listening in on another’s conversation, reading
    a sibling’s diary, or checking a child’s backpack to ensure that homework is being
    finished are relatively harmless acts. The consequences of getting caught (for
    instance, a heated argument), are unlikely to be severe or long-lasting. But what
    happens to the employee who intentionally accesses classified company information?
    The neighbor who sifts through other people’s trash? The secretary who pursues
    the medical charts of physically attractive clients to whom she has no legal access?
    In each of these examples, the desire for information is disturbing, prohibited,
    or illegal.


    Using covert tactics to access information can damage personal relationships.
    The privacy-violating acts of people with extreme curiosity'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'may lead to rejection, making it increasingly difficult to satisfy their curiosity.
    When the information acquired is shared with others, as it often is, the repercussions
    can be even more severe.


    Social curiosity has a complementary behavior: gossip. Gossip is pervasive and
    we begin soon after we learn to speak. Some researchers have found that as much
    as 60% of adult conversation can be classified as gossip.


    Gossip is pervasive because it''s useful. We can''t be everywhere, and gossip
    lets us learn about the world, predict and understand other people, develop relationships,
    and learn how to adapt to new situations and groups. We use gossip to entertain,
    gain favor and create tight bonds (trading confidential secrets), and avoid awkward
    silences. Gossip allows us to learn and teach others what behaviors are acceptable
    and what''s frowned upon. Gossip about the man who slept with his married co-worker
    allows others in his community to better judge who''s trustworthy, how much a
    person can get away with, and what alliances are being formed.


    Try to go cold turkey and avoid gossip for a single day and you will discover
    how much it infiltrates your conversations and consciousness. Gossip often involves
    judgments about the third party''s character, reputation, or social status. Among
    the most common topics are sex, money, illegal or salacious activity, and anything
    considered abnormal.


    Simply sharing facts about another person doesn''t constitute gossip ("Karen had
    the baby!"). This statement becomes gossip if you speculate or evaluate her actions.
    ("I don''t think she''s going back to work," "there is no way she can survive
    as a stay-at-home mom!") For gossip to work successfully, the information being
    spread needs to be viewed as truthful, clear, and comprehensive. When the information
    is ambiguous, unverified, or incomplete, gossip often wanes.


    If gossip serves so many useful purposes, why must we feel guilty? Why do we gossip
    in hushed tones? There''s a tipping point when gossip ceases to be useful and
    instead harms.


    Gossipmongers are typically highly curious people who invest far too much time
    and energy on the lives of others. Frequent gossipers tend to be'
