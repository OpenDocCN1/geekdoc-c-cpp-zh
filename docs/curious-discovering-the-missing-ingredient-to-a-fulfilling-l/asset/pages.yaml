- pgno: 44
  md: 'In 2004 a number of scholars met and reached a consensus about how to define
    mindfulness. Finally, the word *curiosity* was introduced as one of two powerful,
    interlocked components.


    +   The first has to do with the self-regulation of our attention. It involves
    our ability to continuously shift and refocus attention on inner experiences or
    the outer world in the present moment. It involves monitoring and sustaining attention
    in a flexible manner to the target of our senses.


    +   The second has to do with the quality of our attention. It has to do with
    the adoption of a specific type of orientation toward immediate experiences and
    is characterized by curiosity, openness, and acceptance. When we are mindful,
    we maintain an inquisitive nature about the thoughts, feelings, behaviors, and
    events experienced in the present. This inquisitive nature allows us to be receptive
    and aware of all aspects of reality.


    Mindfulness is about moments. When taking a shower, you are fully aware of the
    sensation of water hitting and rolling down your body. Standing in the shower
    today is different from any other episode in our lives because of the emotions
    and thoughts we carry, the placement of our bodies, the tenderness and tension
    in various body parts, and so on. When your mind bursts forth with a new idea,
    you can purposely guide attention to it and then gently return to the physical
    feeling of each dose of water. Without openness to experience and flexible attitudes,
    mindfulness doesn’t exist.


    Take Shane, a bridge toll booth collector, as an example of learning to be mindful.
    At work, Shane’s contact with the outside world is limited. For every smile directed
