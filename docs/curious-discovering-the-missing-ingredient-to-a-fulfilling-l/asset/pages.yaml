  img_proc: true
- pgno: 236
  md: 'stole or plagiarized his work, John Hunter avoided confronting his brother
    because he cared more about satisfying his curiosity (intrinsic rewards) and less
    about acknowledgement and prestige (extrinsic rewards). It''s a shame because
    if he was given credit for everything he accomplished, his name would be in the
    ranks of Isaac Newton, Albert Einstein, Nikolai Tesla, Marie Curie, and other
    titans of scientific advancement.


    Countless human lives continue to be saved because of his ground-breaking eighteenth-century
    experiments. Around 1850, in Britain, the life expectancy of the average person
    was pathetic, only 39.5 years! Deplorable public health conditions and beliefs
    in magic and superstition led to unnecessary deaths at the hands of incompetent
    physicians. John Hunter changed this mentality. Hunter''s intense curiosity and
    self-confidence led him to establish new guidelines for training doctors and treating
