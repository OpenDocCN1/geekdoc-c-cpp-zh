- pgno: 158
  md: 'Whatever your next encounter, here is a set of scientifically informed guidelines
    designed to harness curiosity for more meaningful connections and relationships.
    They focus on ways to break through the initial barrier of uncertainty to create
    common ground to get started. They can set the stage for you to shine and are
    likely to lead to some attention-grabbing moments where interest and excitement
    can spark and flourish.


    # Be Risk-Prone and Share


    Anxiety is normal. Trying to make a good impression is normal. Trying not to look
    stupid is normal. So just talk. When people say they have nothing to talk about,
    that’s not what they mean. They mean they think they have nothing interesting
    to talk about, and they are censoring the ideas that pop into their heads. Just
    let it out. Odds are your partner has the same concerns, so guess what, if you
    talk, you’ll both be more comfortable. Now that it’s clear you are going to do
    a number of stupid and foolish things, over and over again, go do them.


    # Get Your Partner to Feel Safe


    Since nobody’s motives are clear in the beginning, create a safe haven. Don’t
    be overly critical, and avoid denigrating people from your past. Remember this
    mantra: The best predictor of future behavior is past behavior. Before you get
    to embarrassing, off-putting, or worrisome stories from your past, even if they
    are interesting, you want to make sure you’ve established a safe place to connect
    and get in sync with each other.


    # Discover Your Partner''s Interests and Really Listen


    Winning someone over is best achieved by getting them to talk about the things
    they care about the most: their interests and passions. Ask questions, and if
    there is common ground, emphasize it. Be constructive and focus on the positives
    of what they are interested in. When your partner opens up to you, share in kind
    what you are thinking, feeling, and what it makes you want to do. Support your
    partner’s concerns, add and embellish with your own feelings and experiences,
    and check in to ensure the conversational adventure is two-sided.'
