- pgno: 50
  md: '# The “Big Five” Benefits of Harnessing Curiosity


    We can see from many vantage points that curiosity provides the motivation to
    explore and grow as a person. Curiosity is a centerpiece of mindfulness, and contrary
    to what we often expect, novel and uncertain events intensify and prolong positive
    experiences. Even though each of us is endowed with a certain level (something
    we can see even in infants), with effort, we can become more curious and in so
    doing, we can change how we approach the world.


    The benefits of curiosity affect all the nooks and crannies of our lives, but
    I like to talk about what I see as the “big five” scientific discoveries on the
    benefits of being curious. They are big because they are not controversial. Each
    is a desirable advantage, no matter where you live, what your life situation is,
    or what your goals are.


    # Health


    It''s hard to argue for something more useful than averting death for a while
    longer. More than 2,000 older adults aged 60 to 86 were carefully observed over
    a five-year period and those who were more curious at the beginning of the study
    were more likely to be alive at the end of the study, even after taking into account
    age, whether they smoked, the presence of cancer or cardiovascular disease, and
    all the rest of the usual markers. It is possible that declining curiosity is
    an initial sign of neurological illness and declining health. Supporting this
    idea, patients with Parkinson''s and Alzheimer''s disease suffer from a degeneration
    in dopamine circuits and, in turn, show a lack of interest in novelty and a general
    unwillingness to explore their environment. The same goes for older adults with
    degeneration in the brain regions linked to curiosity. Why is this important?
    Because with scientific advances in health and nutrition, we are living longer
    but not necessarily better. An unanticipated price of longevity is the estimation
    that one of every eight members of the baby boomer generation will develop Alzheimer''s
    disease. After age 65, the risk of Alzheimer''s disease doubles, and by 2030,
    the number of Americans with'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'this disease is predicted to grow by 50% (from 5.2 to 7.7 million). Nonetheless,
    there are promising signs that enhancing curiosity reduces the risk for these
    diseases and even the potential to reverse some of the natural degeneration that
    occurs.


    We see the same results in the animal world. Female rats who frequently seek out
    new experiences (fiddling around with toys in their cages, exploring wings of
    mazes) live longer than their more cautious peers. Using a strain of laboratory
    rats that all eventually die from tumors, more curious rats lived 25% longer than
    those fearing the unknown. Now if we find anything even remotely like this in
    humans, we need to start taking curiosity seriously and investing in ways to harness
    it.


    # Intelligence


    If intelligence is about analyzing problems and solving them, what could be better
    than being able to handle the novelty and uncertainty that creeps into everyday
    decisions? Supporting this idea, using a sample of 1,795 three-year-old children,
    curiosity and intelligence were measured at age 3 and again eight years later,
    when the kids turned 11. What the researchers found is that even after you take
    into account how intelligent kids are at age 3, being more curious led to greater
    intelligence over the course of eight years. Even more amazing is that highly
    curious kids scored 12 points higher on IQ tests compared to less curious kids.
    To put this into perspective, the average person has an IQ of 100, doing better
    than half of all scorers. An increase of 12 points moves them up so that only
    22% of all scores do better. Quite impressive. Thus, even when you account for
    a child''s initial intelligence, if they also happen to be highly curious, they
    show intense cognitive development in their formative years.


    In adults, higher curiosity is regularly tied to greater analytic ability, problem-solving
    skills, and overall intelligence. Together, high curiosity and high intelligence
    is the powerhouse combination that characterizes the best students, workers, managers,
    scientists, artists, and other luminaries who contribute so much to the people
    and world around them.'
