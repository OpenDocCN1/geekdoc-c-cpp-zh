- pgno: 46
  md: 'are oriented to the world and how we process information. Some people are more
    open, and others are more resistant to change and uncertainty. Curiosity is an
    essential part of our identities, and we all fall somewhere on a continuum. That
    is, it’s not a question of whether or not you are a curious person; rather, it’s
    the degree of curiosity that you possess. To understand where you reside, it’s
    useful to break down the qualities that characterize a very curious person (the
    high end of the continuum).


    The first quality is **intensity.** Highly curious people feel more intense feelings
    of curiosity, interest, and wonder. They show a strong preference for novelty,
    variety, and complexity. The more curious among us are open to new experiences,
    even when familiar and secure ideas and routines are challenged.


    The second quality is **frequency.** Highly curious people feel curious many times
    in a given day, and the urge to explore and investigate is easily triggered. Brief
    sightings, sounds, and tidbits of information fuel their curiosity with the greatest
    of ease. Feeling the breeze of a motor scooter zipp by to leads to a flurry of
    questions about how fast they go, what kind of gas mileage they get, and whether
    there are fewer fatalities and lower maintenance costs than cars, and wonder about
    why they are the most popular transportation in urban parts of Europe and Asia
    but are rare in the United States.


    The third quality is **durability.** A curious person’s sense of intrigue and
    desire to explore often endures for lengthier periods of times. Think of the curious
    sports fan. This person goes nuts for games that are tied and go into overtime.
    Even though all games start with pure uncertainty, the high-curiosity fan is disappointed
    and leaves early when one team demolishes the other. The person with a high-curiosity
    profile wants to prolong the uncertainty as long as possible because the tension
    is exciting. For curious people, the pleasures of novelty and uncertainty linger
    longer and are purposefully extended.


    The fourth and fifth qualities are best understood together as **breadth and depth.**
    Breadth refers to the number of events that make a person feel curious or interested.
    Curious people are interested in a large span of their world such as their work,
    relationships, passions and hobbies, and their'
