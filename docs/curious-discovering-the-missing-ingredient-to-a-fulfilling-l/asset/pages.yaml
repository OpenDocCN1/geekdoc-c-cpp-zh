    that supports the need to invest in curiosity. By the end of the chapter, you
    will understand the nature of curiosity, the benefits linked to curiosity, and
    how curiosity is unique from other positive qualities and human strengths. You
    will become aware that even if you are not a very curious person now, it is a
    strength that we can develop. In Chapter 3, we will adopt an evolutionary perspective
    to understand the origins of curiosity. Then, we''ll explore the latest brain
    science to show that curiosity recruits brain regions that are distinct from those
    that "light up" when we just feel good. Our brains respond with more intense,
    longer-lasting pleasure when we are exploring and growing. At the same time, you
    will learn that there is more than one type of curiosity. From curiosity that
    is accompanied by joy and excitement to curiosity that is best described as an
    intense craving to know in hopes of relieving the tension bubbling inside us.
    There is nothing pleasurable about being curious about that rattling noise in
    your car or wondering whether the red patch on your cheek is a zit, goiter, or
    cancerous sore. You''ll learn that you'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'might not always find pleasure, but you will build knowledge, skills, strengths,
    or meaning, and perhaps all of the above.


    The next part of the book plays a decisive role in showing you how you can apply
    these ideas to your own circumstances and enhance your well-being profile. Chapter
    4 shows you how to invest your most limited and valuable resources—time and energy.
    This investment, when intentionally focused, can radically enhance life’s moments
    and events to be more interesting and engaging. You will become better at creating
    interest even in mundane, trite, and appallingly boring situations. Curiosity
    doesn’t occur by magical happenstance or self-talk; it is set in motion by emotional
    qualities and specific behaviors. You will gain insight into several hands-on
    strategies and the science behind how and why they work. In Chapter 5, we move
    from the story of how to understand and harness the “curious moment” to how these
    moments can be deepened, strengthened, and transformed into lasting interests
    and passions. Once again, you will be presented with a set of detailed strategies
    and learn how to move from understanding the science to applying it to your own
    life. This chapter also addresses ways that you can apply the lessons for sustaining
