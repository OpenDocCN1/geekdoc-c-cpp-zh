- pgno: 290
  md: 'Keep in mind that these measures are not the only tools to measure curiosity
    and well-being. Rather, they have been shown to be useful in scientific research
    and are the easiest to use in a book format. The important thing to remember is
    that no matter how you score on these instruments, using the exercises in this
    book, you can become more curious and attain greater fulfillment in your life.


    # Curiosity and Exploration Inventory-II


    The average adult completing this questionnaire scores about 17.5 on the Stretching,
    and 15.5 on the Embracing elements of curiosity. This means that if you score
    above either of these numbers, you are scoring higher than approximately 50% of
    other adults. If you score above 33 on your total score, this means that about
    50% of other adults are generally less curious than you.


    # Basic Psychological Needs Scale


    If you score above 34 in satisfying Autonomy needs, 30 in satisfying Competence
    needs, and 44.5 in satisfying Relatedness needs, this means that about 50% of
    other adults are less satisfied than you.


    # Acceptance and Action Questionnaire-II


    As for psychological flexibility, college students and older adults in the community
    tend to score higher (averaging a bit below 51) than adults in treatment for emotional
    difficulties (averaging a bit below 40). If your score is higher than people in
    these comparison groups, then you are able to contact the present moment and the
    thoughts and feelings it contains without needless defense, and show greater psychological
    flexibility in persisting toward valued goals than the “average person.”


    # Meaning in Life Questionnaire


    As for meaning in life, age matters much more than the other elements of well-being.
    When it comes to the presence of meaning in life, teenagers tend to score lower
    (averaging about 21), college students tend to score higher (averaging a bit below
    24), working adults aged 25–44 score a bit lower (averaging close to 22.5), older
    adults aged 45–64 score higher'
  merge: -1
  img_proc: true
- pgno: 291
  md: '(averaging close to 25), and older adults aged 65 and up score the highest
    (averaging a bit below 27). If your score is higher than people in your age group,
    then you recognize greater meaning in your life than the “average person.”


    When it comes to searching for meaning in life, people aged 13–44 score the highest
    (averaging about 25), working adults aged 45–64 score lower (averaging close to
    23), and older adults aged 65 and up score the lowest (averaging a bit above 21).


    The next two instruments map onto the discussion of values, interests, passions,
    and purpose in life discussed in Chapters 5 and 9. These two instruments, the
    Valued Living Questionnaire–II (VLQ–II) and the BULLS-eye Instrument about valued
    life (BULLI), will help you judge various areas of your life as to what is meaningful.
    These instruments can help you clarify the most opportune places to begin discovering
    a purpose.


    I suggest that you print out multiple copies of these scales instead of writing
    in this book. This is because you can use these instruments to track whether your
    daily actions are aligned with what you care about, what is meaningful to you,
    and what goals your life purpose. This includes identifying and managing obstacles
    to purposeful living. Try to do this tracking on a regular, weekly basis.


    # Valued Living Questionnaire-II (VLQ-II)


    The VLQ–II has two parts. Below are ten different areas of life that are scored
    by some people. I am concerned about your quality of life in each of these areas.
    In this first part, I want you to ask yourself the following question when you
    make your ratings for each area.


    Current Importance: How important is this area at this time in your life? Rate
    the importance on a scale of 1–10: 1 means the area is not at all important and
    10 means that the area is very important.


    Not everyone will value all of these areas, or value all areas the same. Rate
    each area according to your own personal view of each area. There are no right
    or wrong answers. Circle the answer that reflects how you feel.'
  merge: -1
  img_proc: true
