    \ our natural curiosity with Einstein-like devotion, when we act on our curiosity,\
    \ we feed our brains and are in the greatest position to enrich our lives. Forty-five-year-old\
    \ championship dog trainer Ben is a case in point.\n\nBen was a successful trial\
    \ lawyer. At an early age, he became the"
