    # Making Sense of Your Curiosity and Well-Being Profile Scores


    Now you have determined the degree to which you are a curious explorer (with the
    Curiosity and Exploration Inventory-II), your basic psychological needs are satisfied
    (with the Basic Psychological Needs Scale), you work with instead of avoid negative
    feelings such as anxiety and show signs of psychological flexibility (with the
    Acceptance and Action Questionnaire-II), and your life is meaningful (with the
    Meaning in Life Questionnaire). To make sense of your scores, it is useful to
    compare yourself to the “average person.” The people you consider your comparison
    group depend on what is important to you: gender, sexual orientation, race and
    ethnicity, region of the world in which you are living, occupation, and so on.
    To keep it simple, I am only going to be focusing on age. If you want to know
    more about your score, you can find more information in the articles that I list
    in this book and on my website, www.mason.gmu.edu/tkashdan.'
