    # When You Are Ready for the Next Level


    You probably remember from Chapter 6 that doing something novel and exciting with
    your partner *and* close friends is another great way to enhance a relationship.
    The research shows that people you care about often influence and inspire you
    in positive ways. Additionally, it can be interesting to see parts of your partner''s
    personality emerge in ways that you don''t often see when it is just the two of
