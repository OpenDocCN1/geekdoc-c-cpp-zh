  md: '# # Amplify Interest by Changing the Way We Remember Events: The "Peak-End"
    Rule


    Our memory is a hall of distortions. Some parts are amplified, others are minimized,
    ignored, or forgotten. Reality ends up becoming what we make of the past.


    We remember our experiences through the prism of expectations. What did we expect?
    Were those expectations met? This is important because if we remember an event
    as soothing or exciting, we are more apt to repeat it in the future. If we remember
    an event as annoying or repulsive, the doors could potentially close forever.
    This is a lesser-known fact about how the timing of our emotions affects our memory
    of events.


    Few things will get you less excited than a colonoscopy. Imagine two patients,
    Sylvia and Adele, who both undergo a 30-minute colonoscopy. However, for Adele,
    after the painful suction process is over, the tube is left in for an extra five
    minutes—it feels weird but is far, far less painful than the first 30 minutes.
    Who do you think has a better experience?


    You would think it must be Sylvia. After all, the sooner you get to put your clothes
    back on, the better. You might be surprised to know that Adele had a better experience.
    The reason why Adele fared better can help us all in improving our moments.


    The most intense emotional moments of an event (peak pain or pleasure) and the
    way an event ends (painfully or pleasurably) have a profound impact on how we
    remember it. Even though Sylvia had a briefer procedure, it was the last moments
    that lingered. For Sylvia it was pain, but for Adele, it was an unusual sensation.
    We know that endings affect how we recall events from the infamous colonoscopy
    study conducted by the economist Daniel Kahneman. Half of 682 patients undergoing
    a colonoscopy had the tube left in by the doctors for an extra few minutes after
    the procedure was over. Although leaving the tube in for the extra time was less
    painful than the actual procedure, patients who underwent the longer procedure
    reported a better overall experience immediately afterward and when asked about
    it an hour later. Now, who do you think is more'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'likely to return when a doctor suggests they get probed again? There are real
    consequences to ending on a happy or unhappy note.


    Another study of colonoscopies confirmed this finding. The patients in the sample
    underwent colonoscopies that ranged from 4 to 69 minutes. We would assume that
    the poor creatures with procedures lasting a full hour would remember the event
    as being worse than those lucky enough to get out in less than 10 minutes. Yet,
    amazingly, there was absolutely no relationship between the length of the procedure
    and the remembered pain and unpleasantness (a correlation of .03).


    Our retrospective evaluations of the events in our lives are best predicted by
    the intensity of our peak emotions (highest highs and lowest lows) as well as
    the intensity of our feelings at the very last moment. What this means is that
    we can change our interest and motivation in an activity by taking advantage of
    this so-called peak-end rule.


    I met people who took advantage of this strategy without knowing it. I asked about
    how they deal with tasks that fail to stimulate them but they feel compelled to
    do:


    +   * Shane is trying to lose weight by going to the gym every day, and he ends
    each workout with a 20-minute soak in the hot tub.

    +   * Because of Type 1 diabetes, Jasmine has to take insulin shots twice a day.
    Carrying around a pair of dice, she gives herself one roll after every injection.
    If she rolls a 12, she buys herself a new song for her iPod (only 3!). It’s clear
    from her proud retelling that she enjoys playing the game more than winning.

    +   * Mike manages a natural-food store with three cashiers at any given time.
    He circulates the store every hour and asks customers at that moment whether their
    cashier should get the honor of picking the next song to be played on the store
    loudspeaker. The customers get into it and extoll the virtues of their cashier,
