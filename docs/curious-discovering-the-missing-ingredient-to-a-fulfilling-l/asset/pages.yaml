    be high. And when it''s high it will be high, until it isn''t high anymore. Then
    it will be low again. It''s not teasing you. There just aren''t good words for
    what it''s like to have the Explore knob set high. I can say one thing for sure,
    though—if you want to know for certain where the Anxiety knob will be, there is
    something you can do. Just set Explore very, very low, and'
