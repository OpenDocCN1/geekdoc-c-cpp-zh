    with your personal values.


    # Part 2: Identify Your Obstacles


    Think about the personal values you wrote about in the first exercise of Part
    1. Now, think about how you would like to utilize those values to have the life
    you want to live. Is there a disconnect between living with the values you most
    admire in yourself and the way you live now? If so, what obstacles get in the
    way of living the kind of life you imagine? Describe them below.


    Now, estimate how powerful the obstacle(s) in your life are. Circle the number
    that best describes the likelihood that your obstacle(s) will prevent you from
    living a life that is true to your values.


    | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|

    | doesn''t prevent me at all | | | | | | prevents me completely |


    # Part 3: My Valued Action Plan


    So far you have decided what values are most important to you, how close or how
    far you are from living a life infused with your values, and identified any obstacles
    that exist that might keep you from achieving a life lived according to your values.
    Now, think about any actions that you can take that would move you closer to living
    fully with your values. These actions can be large or small and will be very personal.
    They might be small movements toward a goal or actions that reflect who you want
    to be as a person. Use the anxiety that comes with facing an obstacle and deciding
    to overcome it, or some small part of it, to move closer to living'
