- pgno: 88
  md: '# Automated voice survey


    An automated survey allows end users to call a phone number that will be used
    to conduct a survey that asks questions and prompts the user to provide answers
    to each question.


    Phone surveys are a great way to gather valuable data from our users, and they
    have many business applications, especially in regards to brand awareness, product
    insights, and customer satisfaction.


    First, let''s explain how a voice survey should work using Twilio.


    Twilio gets the call and makes an HTTP request to our TwilioSuccinctly TwiML application—
    e.g., asking for instructions on how to respond.


    The NancyFX app instructs Twilio (using TwiML) to Gather the user''s voice input.
    The user will be asked to provide a unique ID, and we''ll identify them by that.


    After each question, Twilio will make another request to our NancyFX app with
    the user''s input, which our application stores on an Azure table.


    After storing the answer, the app will continue instructing Twilio to redirect
    the user to the next question until the survey is finished. In a nutshell, that''s
    what the voice survey app should do.


    We''ll expand our SimpleAnsweringMachine class to include a method that saves
    data on an Azure table we''ll call ResponsesSuccinctly.


    Our ResponsesSuccinctly table has three fields. On the PartitionKey, we''ll store
    the question''s ID. On the RowKey, we''ll store the user''s ID. Finally, we''ll
    have a third field called Response that will also be a string and will contain
    the user''s response.


    We''ll also need two other tables—one called Questions that will contain the ID
    of the question (PartitionKey) and the actual question itself as a string. We''ll
    also need a PredefinedAnswers table that will contain possible answers for each
    question.


    So, our survey app will read from the Questions and PredefinedAnswers tables and
    store the user''s input on the ResponsesSuccinctly table on Azure.


    Let''s create the Questions and PredefinedAnswers tables using Azure Storage Explorer.
    We''ll start with the Questions table and populate it with sample data.'
  merge: -1
  img_proc: true
