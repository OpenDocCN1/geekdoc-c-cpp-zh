    \n```\nGet[\"/survey/incoming\"] = _ =>\n{\n string res = \"<Response>\" +\n \"\
    <Gather action=\"\\/survey/connect\" method=\"GET\">\" +\n \"<Say voice=\"woman\"\
    >You are about to join the UFO survey.</Say>\" +\n \"<Say voice=\"woman\">What\
    \ is your Social Security Number?</Say>\" +\n \"</Gather>\" +\n \"<Say voice=\"\
    woman\">We didn't get any response. Bye.</Say>\" +\n \"</Response>\";\n\n return\
