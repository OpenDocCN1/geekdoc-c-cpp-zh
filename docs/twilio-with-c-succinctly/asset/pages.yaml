    \ class in detail. In order to use the Twilio API helper library, we need to include\
    \ the **Twilio** namespace.\n\n**TwilioCore** inherits from the **IDisposable**\
    \ interface, which means we can create an instance of **TwilioCore** and later\
    \ have it automatically disposed if it's called inside a **using** statement.\
    \ This is very convenient—it helps us write clean code.\n\nIn order to authenticate,\
    \ Twilio requires an Account SID and an Authorization Token (Auth Token).\n\n\
    These have been added to the **TwilioCore** class as parameters to one of the\
