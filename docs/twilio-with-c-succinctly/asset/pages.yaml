  md: "# Make outbound calls\n\nWe've seen how we can receive calls and process voice\
    \ requests using TwiML. Before closing this chapter and moving into more advanced\
    \ examples, let's discuss how we can make outbound calls using the Twilio C# helper\
    \ library.\n\nWe'll expand our **TwilioCore** class and add a method to make calls.\
    \ Let's implement this method in Code Listing 26\n\n*Code Listing 26: The TwilioCore\
    \ StartCall Method*\n\n```\n```csharp\npublic void StartCall(string from, string\
    \ to, string url)\n{\n    // SID = Twilio AccountSID, aTk = Twilio AuthToken\n\
    \    if (SID != string.Empty && aTk != string.Empty && from !=\n        string.Empty\
    \ && to != string.Empty)\n    {\n        TwilioRestClient client = new TwilioRestClient(SID,\
    \ aTk);\n        client.InitiateOutboundCall(from, to, url);\n    }\n}\n```\n\
    ```\n\nAs you can see, the **StartCall** method is very simple. It has two parameters:\
    \ **from** and **to**, which, respectively, represent the called and receiver\
    \ phone numbers.\n\nThe third parameter is a URL resource that the person on the\
    \ other side of the phone will hear once the call is picked up. This URL needs\
    \ to return a valid TwiML response.\n\nAs we've been doing all along when using\
    \ our **TwilioCore** class methods, let's implement a wrapper method around **StartCall**\
    \ that we can invoke from the **Main program**.\n\n*Code Listing 27: The StartRecordedCall\
    \ Wrapper Method*\n\n```\n```csharp\npublic static void StartRecordedCall()\n\
    {\n    using (TwilioCore tc = new TwilioCore(cStrSid, cStrAuthTk))\n    {\n  \
    \      tc.StartCall(cStrSender, cStrReceiver,\n            \"http://www.edfreitas.me/twilio/sayhello.xml\"\
    );\n    }\n}\n```\n```\n\nNow, we can call this method form the **Main program**.\n\
    \n*Code Listing 28: Calling the StartRecordedCall Wrapper Method from the Main\
    \ Program*\n\n```\n```csharp\nstatic void Main(string[] args)\n```\n```"
