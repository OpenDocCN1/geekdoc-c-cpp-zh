  md: '![](img/7d3e41c7ef83c5fb4ef242998ad60317_89_0.png)


    Figure 52: The Questions Table on Azure


    You can see that the **RowKey** of the table is a short ID representation of the
    question itself, and the actual question is stored on the **Question** field,
    which is also a string.


    Let’s now create the PredefinedAnswers table with Azure Storage Explorer and populate
    it with this sample data.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_89_1.png)


    Figure 53: The PredefinedAnswers Table on Azure


    On the PredefinedAnswers **PartitionKey**, we store the answer number and on the
    **RowKey** we store the question number. The **Answer** field, which is a string,
    contains the actual answer itself.


    We can see all questions have multiple predefined answers, some more than others,
    and these will be the options presented to the users. Their answers will then
    be stored on the ResponsesSuccinctly table.


    With the theory behind us, let’s write some code. First, let’s point our TwiML
    app to our new endpoint, which we will call /survey/incoming.'
