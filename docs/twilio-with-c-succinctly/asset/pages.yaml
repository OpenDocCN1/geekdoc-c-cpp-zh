- pgno: 18
  md: "The **SendSms** method is particularly interesting. This method returns a **Message**\
    \ object that is part of the Twilio API helper library namespace. In order for\
    \ the **SendSms** to do anything, the **SID** and **aTk** properties each need\
    \ a value assigned.\n\nThe **SendSms** method creates an instance of the **TwilioRestClient**\
    \ that is a wrapper of the Twilio API using the [RestSharp](https://www.restsharp.com/)\
    \ library. In order to send an SMS, a call to the **SendMessage** method is executed.\n\
    \nThe **SendMessage** method requires three parameters. The first parameter ***from***\
    \ is the number that sends the message. The second parameter ***to*** is the number\
    \ that receives it. And the third parameter ***msg*** is the actual text of the\
    \ message.\n\nNow that we’ve seen how easily the **TwilioRestClient** class allows\
    \ us to send SMS, let’s write a proper example. In order to do that, we’ll implement\
    \ the **TwilioExample** class.\n\n# Code Listing 2: *The TwilioExample Class*\n\
    \n```\n```\nusing System;\nusing Twilio;\n\nnamespace TwilioSuccinctly\n{\n  \
