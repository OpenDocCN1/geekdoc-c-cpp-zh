- pgno: 63
  md: '# # Chapter 3 Receive and Make Calls


    # ## Introduction


    We''ve seen that Twilio is an easy yet powerful platform for enabling SMS communication,
    for automating certain business processes using SMS, and even for authentication
    through 2FA.


    However, we''ve only started to scratch the surface of what is possible with Twilio.
    One of the fundamental and strongest features of this platform is its ability
    to receive, make, and handle phone calls and build voice-enabled applications.


    You are probably familiar with services like Powwow, WebEx, or GotoMeeting that
    allow you to dial a conference call number, set up a virtual meeting room, and
    speak to other people. You are also likely familiar with automated phone menu
    systems in which you dial your bank or airline and are asked to press 1, 2, or
    3 in order to do X, Y, or Z. We''ve all been there, haven''t we?


    Twilio allows us developers to build any of these services specially tailored
    to suit our own needs—without too much effort and without emptying our pockets.
    However, we must be cautious about what we are building and what potential costs
    we might incur. That said, Twilio is almost always cheaper than building an entire
    telephony infrastructure on our own.


    Twilio takes care of the telephony network infrastructure and completely abstracts
    this complexity away from our development. All we have to do is focus on our business
    logic and let Twilio deal with the inner workings of telephony systems and protocols.


    In this chapter and the next, we''ll explore how we can leverage the power of
    Twilio voice APIs. We''ll also use an XML markup language called TwiML that makes
    it easy to create voice-enabled responses. And we''ll look at the basics of using
    voice features on Twilio, of processing incoming calls and making outbound calls,
    and of creating a simple answering machine.


    By the end of this chapter, you should have the know-how to address these topics
    and the basics for creating voice-enabled responses and applications with Twilio
    and TwiML.


    In chapter 4, we''ll look at more advanced issues with Twilio''s voice-enabled
    features, such as an interactive phone menu, conferencing, and automated voice
    surveys.


    The examples should again be quite easy to follow and fun to implement.


    # ## TwiML


    In order to easily create voice responses with Twilio, you can use an XML markup
    language called TwiML, which is simply a set of instructions you can use to tell
    Twilio what to do when you receive an incoming call or SMS.'
  merge: -1
  img_proc: true
- pgno: 64
  md: "When you receive an SMS or a phone call on your Twilio number, Twilio will\
    \ fetch the URL associated with your Twilio phone number and perform an HTTP(S)\
    \ request to that URL. This URL will contain an XML response with markup instructions\
    \ that indicate which tasks Twilio needs to execute. Some of these tasks will\
    \ record the call, play a message, prompt the caller to enter some digits, etc.\n\
    \nLet's explore a quick example of this in Code Listing 20.\n\n# Code Listing\
    \ 20: TwiML Example\n\n```\n```XML\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <Response>\n  <Say voice=\"man\">I'm not available to take your call, please leave\
    \ a message.</Say>\n  <Record maxLength=\"20\" />\n</Response>\n```\n```\n\nAs\
    \ you can see, telling Twilio to execute a specific action using TwiML is relatively\
    \ simple. The markup language is composed of verbs highlighted in blue that represent\
    \ actions Twilio will execute.\n\nSome of the TwiML verbs available at the time\
    \ of this writing are: **Say**, **Play**, **Dial**, **Record**, **Gather**, **Sms**,\
    \ **Hangup**, **Queue**, **Redirect**, **Pause**, **Conference**, **Reject**,\
    \ and **Message**.\n\nComplete details on how to use these TwiML verbs can be\
    \ found [here](#).\n\n# Receive incoming calls\n\nLet's walk through the process\
    \ of handling incoming calls using TwiML.\n\nYou'll need to provide a publicly\
    \ accessible URL where your TwiML XML markup file will be hosted. Twilio allows\
    \ you to have a default-response TwiML file for both voice and SMS apps. These\
    \ can be hosted on your own webserver or even on services such as Amazon S3 or\
    \ Azure Websites that can host static resources.\n\nYou can configure these URLs\
    \ on your Voice Number's [dashboard](#) within your Twilio account, then click\
    \ your respective Twilio number. This will lead you to the properties of your\
    \ Twilio number, where you can set the Request URL for Voice responses."
  merge: -1
  img_proc: true
