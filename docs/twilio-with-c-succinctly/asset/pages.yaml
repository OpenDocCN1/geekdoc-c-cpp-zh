    \ res = (m?.Status == \"delivered\") ? true : false;\n    }\n    return res;\n\
    }\n```\n\nThe functionality is very straightforward. This method creates an instance\
    \ of the **TwilioCore** class, then invokes **CheckSmsStatus**. The status is\
    \ determined by inspecting the value of the **Status** property of the **Message**\
    \ object returned by **CheckSmsStatus**.\n\nIf the value of the **Status** property\
