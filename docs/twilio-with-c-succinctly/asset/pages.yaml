- pgno: 10
  md: '# # Chapter 1  Working with SMS


    # ## Introduction


    Before social networks took off, SMS was the most common way to exchange short
    messages.


    Even though Wikipedia reports that SMS is still strong and growing, social networking
    messaging services such as Facebook Messenger, WhatsApp, Skype, and Viber, all
    available on smartphones, are increasingly being used to exchange short messages.


    Despite that, SMS is still used widely in enterprise development for marketing,
    Customer Relationship Management (CRM) automation, real-time alerts notifications,
    and two-step verification of a user''s identify.


    The significance of SMS usage in the business world remains incredibly important
    given that the technology is considered mature, widely used, proven, and reliable.


    One of the most prevalent uses cases for the adoption of SMS is two-step verification,
    also known as Two-Factor Authentication (2FA), which consists of strengthening
    or replacing a username or password with one or more SMS codes. This requires
    both the primary password and the user''s mobile phone in order to properly authenticate
    and allow a user to get access to a specific resource.


    Other uses of SMS technology include sending and receiving standard notifications
    and alerts.


    With the Twilio platform, SMS can be sent to mobile phones anywhere in the world,
    and message tracking is built into the platform.


    In this chapter, we''ll explore how to interact with SMS by using the Twilio API
    helper library, how to implement 2FA, how to set up a Twilio account, and how
    to purchase a disposable phone number.


    We''ll start with simple examples of how to send and track SMS, then use that
    to build a simple but powerful 2FA system.


    # ## Setting up a Twilio account


    Before we can send SMS using the Twilio API helper library, we''ll need to sign
    up for the service. Twilio is a pay-as-you-go service, which means you''ll need
    to set up an account and provide your credit card details in order to gain credit
    that will be used to pay for every SMS you send.


    You''ll also need to purchase a Twilio number, which is a regular but disposable
    phone number used to send your messages.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Twilio numbers are available for many countries. They look like any other valid
    phone number, but they are real phone numbers you can dispose when you no longer
    need them. Pretty amazing.


    In order to set up a Twilio account, point your browser to this URL. Once there,
    click Sign Up. You’ll be presented with a screen similar to Figure 1.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_11_0.png)


    As you can see, the sign-up page is fairly straightforward. You’ll need to provide
    your first name, last name, an optional company name, your email address, and
    a strong password (which you must enter twice).


    Twilio also asks for additional information in order to get an idea of what kind
    of apps or project you will initially try with their platform. Once you have filled
    in the details, all you’ll need to do is to click Get Started.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# ## Buying a Twilio number


    When your Twilio account is ready, you’ll need to purchase a disposal phone number
    before you can send SMS.


    In order to add funds to your account, you’ll need to go to this URL. First, click
    Upgrade to a Full Account. Then, to add funds, click Ad Funds, which is linked
    in red.


    You’ll have the option to pay using either a credit card or a PayPal account.
    The minimum starting balance is $20.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_12_0.png)


    With funds in your account, let’s see how to get a number. This will be a real
    phone number that you can dispose at any time. You may choose from which country
    and city you want your number to belong.


    In order to do this, point your browser to this URL, then click Buy a Number.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_12_1.png)


    When you have clicked Buy a Number, you will be presented with a pop-up screen,
    as shown in Figure 4.'
