  md: 'The purpose of the **ProcessQuestion** method is to get Twilio to ask the question
    and describe the possible answers. However, Twilio doesn''t process the response
    to that question. The actual response to the question is processed when the **ProcessQuestion**
    method invokes the /survey/connect endpoint.


    Essentially, /survey/connect is self-repeating, in the sense that in order to
    ask multiple questions and get an answer for each, the **ProcessQuestion** method
    triggers a call to the same endpoint that executes it. This is why maintaining
    state is important.


    When the first question has been asked, the next time /survey/incoming is executed
    (when the answer to the question is processed), the control flow passes to the
    principal **else** statement, which makes the code fetch all the possible predefined
    answers by calling the **GetPredefinedAnswers** method from the **SimpleAnsweringMachine**
    instance.


    The answer received from the caller, contained within the **val** variable, is
    checked in order to make sure it exists within the list of predefined answers
    retrieved from the PredefinedAnswers Azure table. It does this by calling the
    **GetPredefinedAnswers** method.


    If the answer exists within the list of predefined answers for the question being
    asked (the current question being asked is known because the state is kept by
    the **currentQuestion** property), the answer is stored along with the question
    number and **userId** on the ResponsesSuccinctly table by calling the **InsertSurveyResponse**
    method.


    If an incorrect answer to a question is provided, one that is not within the list
    of predefined answers for the question being asked, the survey is terminated.
    This feature can be improved upon in the future, but for now works well enough.


    When all the questions have been asked and the answers gathered and processed,
    the information can be viewed on the ResponsesSuccinctly table on Azure.


