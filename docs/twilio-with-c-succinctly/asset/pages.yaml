- pgno: 20
  md: "# Tracking SMS\n\nSo far, we’ve explored how to send SMS. But how can we track\
    \ it?\n\nIf we take a look at the implementation of **SendSimpleSmsExample**,\
    \ we can see that a **Message** object is returned. This object contains a **Status**\
    \ property that indicates whether the message has been “queued” or “delivered.”\n\
    \nIt usually takes a few seconds (between two and five) for the status to change\
    \ from “queued” to “delivered” even though the SMS might have been received already\
    \ by the receiver number.\n\nNotice that the **Status** value “queued” or “delivered”\
    \ is quoted given that it is internally represented as a string.\n\nTwilio is\
    \ very effective—if your message has been queued, it is very likely to be delivered.\
    \ Nevertheless, it is still useful to verify that the message has indeed been\
    \ effectively delivered.\n\nLet’s explore how we can check this. Let’s add a method\
    \ to the **TwilioCore** class that checks the status of an SMS.\n\n*Code Listing\
    \ 4: The TwilioCore CheckSmsStatus Method*\n\n```\npublic Message CheckSmsStatus(string\
    \ sid)\n{\n    if (SID != string.Empty && aTk != string.Empty)\n    {\n      \
    \  TwilioRestClient client = new TwilioRestClient(SID, aTk);\n\n        return\
    \ client.GetMessage(sid);\n    }\n    else\n        return null;\n}\n```\n\nThe\
    \ **CheckSmsStatus** method checks for the SMS status by invoking **GetMessage**\
    \ from an instance of **TwilioRestClient**.\n\nThe **GetMessage** method requires\
    \ the SMS ID **sid** of the message that we want to check. This is the reason\
    \ why the **SendSms** method of the **TwilioCore** class returns a **Message**\
    \ object—so that we can obtain the SMS ID from it.\n\nNext, let’s implement an\
    \ example within the **TwilioExample** class by adding a **CheckSmsDelivered**\
    \ wrapper method around **SendSms**.\n\n*Code Listing 5: The TwilioExample CheckSmsDelivered\
    \ Wrapper Method*\n\n```\npublic static bool CheckSmsDelivered(string mid)\n{\n\
    ```"
