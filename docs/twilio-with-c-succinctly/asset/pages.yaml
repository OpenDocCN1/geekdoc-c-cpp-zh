  md: '# ## Chapter 2 Automation Using SMS


    # ### Introduction


    We''ve seen how Twilio empowers us to implement SMS communication in an intuitive
    and straightforward way and that it can even be used for enhancing authentication
    using 2FA.


    Using the core principles and examples we''ve learned so far, in this chapter
    we''ll focus on how we can build on that knowledge and create a couple of small
    but useful applications that we can use to optimize and automate business processes
    such as appointment reminders and automated, instant lead alerts.


    By the end of this chapter, you should have a broad understanding of how to implement
    these solutions with SMS and a good appreciation of the overall business logic
    behind both.


    Because some of the samples in this chapter require data storage, we''ll be using
    Azure Table Storage to keep our data safe and easily accessible on the Microsoft
    Cloud.


    The examples presented in this chapter are intended to be easy to follow and fun
    to implement while also being useful in a business context. We''ll continue to
    use the TwilioCore class we developed in Chapter 1.


    # ### Using Azure Table Storage as our backend


    As you may know, Azure is Microsoft''s awesome Cloud Services platform. It offers
    a broad range of services and works across multiple platforms.


    Storage is one of its many useful services, and Azure includes a subservice for
    tables called Table Storage.


    The Table Storage service uses a tabular format to store data. Each record represents
    an entity, and the columns represent the various properties of that entity (fields
    within a table).


    Every entity has a pair of keys (a PartitionKey and RowKey) to uniquely identify
    it. Each entity also has a timestamp column that the Table service uses in order
    to know when the entity was last updated (this happens automatically, and the
    timestamp value cannot be overwritten—it is controlled internally by the service
    itself).


    Extensive documentation about how the Storage and Table Storage services work
    can be found directly on the Azure website, which is an invaluable resource worth
    checking in order to gain a better understanding of both services.


    Nevertheless, we''ll quickly explore how we can get up and running with Azure
    Table Storage.


    In order to get started with a Storage instance on Microsoft Azure, you''ll need
    to sign in or sign up for Azure with a Microsoft account. You can do that by visiting
    https://azure.microsoft.com .'
