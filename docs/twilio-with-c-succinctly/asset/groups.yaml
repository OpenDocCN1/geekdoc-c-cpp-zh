    # Acknowledgements


    My thanks to all the people who contributed to this book, especially Hillary Bowling,
    Tres Watkins, and Morgan Weston, the Syncfusion team that helped make this a reality.
    Thanks also to Manuscript Manager Darren West and Technical Editor James McCaffrey,
    who thoroughly reviewed the book’s organization, code quality, and accuracy. Thank
    you all.


    # Introduction


    Smartphones are now so important to us that they have become almost extensions
    of ourselves. If you lose your phone today, you are in trouble. Everything from
    emails, calendar, messaging, banking, and even our wallets are now linked to our
    phones.


    In today’s vibrant, dynamic, and ever-connected society, having access to vast
    amounts of information at our fingertips can be a blessing, but it can also be
    a curse. Busy professionals nowadays must deal with hundreds of emails on a daily
    or weekly basis, not to mention the many messages and notifications from social
    networks such as Twitter and LinkedIn. Keeping up with all these messages can
    be overwhelming.


    But what if phones could actually help us to alleviate some of this information
    overload by notifying us of important things or allowing us to perform customized
    actions based on Short Message Service (SMS) or voice commands? Imagine if we
    could automate certain processes through messaging or voice. That would be great!


    Most SMS and voice-enabled solutions are platform-specific and cannot be customized.
    However, one platform was designed from the ground up with developers in mind
    and allows anyone with coding skills to create custom messaging and voice-enabled
    solutions. This platform is Twilio.


    Twilio is a messaging, voice, video, and authentication API for every application.
    It has helper libraries and SDKs in many different programming languages that
    help developers create apps that can leverage the power of voice and messaging.


    These services are accessed over HTTP(S) through a RESTful API or through helper
    libraries. Its services are billed based on usage, and the platform is based on
    Amazon Web Services for hosting Twilio’s telephony infrastructure and providing
    connectivity between HTTP and the Public Switched Telephone Network (PSTN) through
    its APIs.


    Twilio has recently extended its API support to Facebook Messenger, which coincides
    with the social networking company’s introduction of support for bots on its Messenger
    platform.


    In this e-book, we will focus on how to use the C# helper library in order to
    build connected voice and messaging apps that leverage the power of the Twilio
    platform. The examples in this e-book require some knowledge of C#, however they
    are otherwise easy to follow and understand. We’ll be using some aspects of the
    most recent C# language features available. The code samples have all been written
    using Visual Studio 2015.


    By the end of this e-book, you should feel comfortable enough to use the Twilio
    C# helper library in order to write voice and messaging apps with Visual Studio
    2015. We’ll explore some common-use cases for voice and messaging apps that are
    helpful for business automation processes and could prove to be an invaluable
    resource for any company.


    **Important:** Some of the phone numbers provided in the sample code that follows,
    e.g., 33484464, are actually invalid (not real) phone numbers, and you should
    provide valid phone numbers with an international format, e.g., +16500000000,
    if you want to have real interactions on your device.


    All the sample code for this e-book is available as a compressed .rar file at
    this URL.


    Have fun!


    # Chapter 1: Working with SMS


    ## Introduction


    Before social networks took off, SMS was the most common way to exchange short
    messages.


    Even though Wikipedia reports that SMS is still strong and growing, social networking
    messaging services such as Facebook Messenger, WhatsApp, Skype, and Viber, all
    available on smartphones, are increasingly being used to exchange short messages.


    Despite that, SMS is still used widely in enterprise development for marketing,
    Customer Relationship Management (CRM) automation, real-time alert notifications,
    and two-step verification of a user''s identity.


    The significance of SMS usage in the business world remains incredibly important
    given that the technology is considered mature, widely used, proven, and reliable.


    One of the most prevalent use cases for the adoption of SMS is two-step verification,
    also known as Two-Factor Authentication (2FA), which consists of strengthening
    or replacing a username or password with one or more SMS codes. This requires
    both the primary password and the user''s mobile phone in order to properly authenticate
    and allow a user to get access to a specific resource.


    Other uses of SMS technology include sending and receiving standard notifications
    and alerts.


    With the Twilio platform, SMS can be sent to mobile phones anywhere in the world,
    and message tracking is built into the platform.


    In this chapter, we''ll explore how to interact with SMS by using the Twilio API
    helper library, how to implement 2FA, how to set up a Twilio account, and how
    to purchase a disposable phone number.


    We''ll start with simple examples of how to send and track SMS, then use that
    to build a simple but powerful 2FA system.


    ## Setting up a Twilio account


    Before we can send SMS using the Twilio API helper library, we''ll need to sign
    up for the service. Twilio is a pay-as-you-go service, which means you''ll need
    to set up an account and provide your credit card details in order to gain credit
    that will be used to pay for every SMS you send.


    You''ll also need to purchase a Twilio number, which is a regular but disposable
    phone number used to send your messages.


    Twilio numbers are available for many countries. They look like any other valid
    phone number, but they are real phone numbers you can dispose of when you no longer
    need them. Pretty amazing.


    In order to set up a Twilio account, point your browser to this URL. Once there,
    click Sign Up. You’ll be presented with a screen similar to Figure 1.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_11_0.png)


    As you can see, the sign-up page is fairly straightforward. You’ll need to provide
    your first name, last name, an optional company name, your email address, and
    a strong password (which you must enter twice).


    Twilio also asks for additional information in order to get an idea of what kind
    of apps or projects you will initially try with their platform. Once you have
    filled in the details, all you’ll need to do is to click Get Started.


    ## Buying a Twilio number


    When your Twilio account is ready, you’ll need to purchase a disposable phone
    number before you can send SMS.


    In order to add funds to your account, you’ll need to go to this URL. First, click
    Upgrade to a Full Account. Then, to add funds, click Add Funds, which is linked
    in red.


    You’ll have the option to pay using either a credit card or a PayPal account.
    The minimum starting balance is $20.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_12_0.png)


    With funds in your account, let’s see how to get a number. This will be a real
    phone number that you can dispose of at any time. You may choose from which country
    and city you want your number to belong.


    In order to do this, point your browser to this URL, then click Buy a Number.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_12_1.png)


    When you have clicked Buy a Number, you will be presented with a pop-up screen,
    as shown in Figure 4.


    ![](img/7d3e41c7ef83c5fb4ef242998ad60317_13_0.png)


    Here you have the option to choose from which country you would like to purchase
    the number and also a specific location.


    You may also indicate if the number will be used solely for SMS or if it will
    also be used for Voice and MMS.


    Once you have purchased your number, you will see a screen with the recently created
    number.


