    \  else\n                    Console.WriteLine(\n                        $\"Could\
    \ not create appointment: {id} - {n} on {t}\");\n            }\n\n           \
    \ return res;\n        }\n    }\n}\n```\n\nThe **AppointmentExample** class does\
    \ two things. It creates an appointment through its **Create** method, and it\
