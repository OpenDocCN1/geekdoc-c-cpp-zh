    Let''s analyze this code. We have defined an **AppointmentData** class that represents
    the data to be stored on Azure Table Storage. The **AppointmentData** class inherits
    from **TableEntity** and contains a **PartitionKey** and **RowKey** properties
    used by Table Storage to index and find data records.


    We''ll store the user''s phone number on the **PartitionKey**, and on the **RowKey**
    we''ll keep the date and time of when the appointment is due as a string, e.g.,
    29042016203000, where 29 is the day, 04 the month, 2016 the year, 20 the hour
    of the day (8 pm), 30 the minutes, and 00 the seconds.


    The **AppointmentData** class also contains a **string Id** property, a **string
    Name** property that represents the name of the appointment, a **string PhoneNumber**
    property that will contain the same data as the **PartitionKey**, a **string Time**
    property that will contain the same data as the **RowKey**, and a **bool Sent**
    property that will represent whether or not an SMS has been sent for that appointment.


    The **AppointmentData** class will be instantiated by the **Appointment** class
    in order to store the information on Azure Table Storage. You can think of the
    **AppointmentData** class as the data layer (Model) and the **Appointment** class
    as the business logic layer (Controller).


    The constructors of the **Appointment** class create an **AppointmentData** instance
    that will be used to store the appointment data on Azure.


    With Table Storage, **DateTime** values should be stored as *string* values. The
    purpose of the **FormatTime** method is to take a date time *string* such as 29042016203000
    and convert it to its equivalent *DateTime* representation (4/29/2016 8:30:00
    PM) as a *string* so it can be displayed on the **Console**.


    The **Create** method is responsible for creating an appointment reminder on Table
    Storage. A connection to the Azure instance is established by passing the **cStrConnStr**
    connection string to the **CloudStorageAccount.Parse** method. Following that,
    an instance of **CloudTableClient** is created, then used to get a reference to
    the AppointmentsSuccinctly table.


    A call to the **Execute** method of the **CloudTable** instance is invoked with
    the **AppointmentData** class as T and **Data.PhoneNumber** as both the **PartitionKey**
    and **RowKey**. We do this in order to get a *TableResult* object so that its
    **Result** property can be cast to an empty **AppointmentData** object. This object
    will be used to set the corresponding appointment properties and will be inserted
    on Table Storage by calling the **TableOperation.Insert** method. Finally, the
    **Execute** method of the **CloudTable** instance commits the **AppointmentData**
    object to Table Storage.'
