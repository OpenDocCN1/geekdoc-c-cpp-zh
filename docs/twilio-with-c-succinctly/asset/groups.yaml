    # ## Automated instant lead alerts


    Instant leads are a great way for sales people to close more deals because they
    allow sales reps to reach out to interested customers moments after they have
    been identified. Automating the process of reaching out to leads is a fantastic
    way to put the power of Twilio to work for you.


    The process of collecting leads starts with having one or more landing pages in
    which you collect information from your website visitors about a product or service
    that your organization offers.


    For simplicity’s sake, we’ll assume that the information being collected is stored
    on Azure Table Storage. This information will consist of the customer’s full name,
    email address, phone number, and which webinar they are interested in. There will
    also be a **FollowedUp** property that will be used to indicate whether or not
    a lead has been followed up on.


    We’ll create a small application that fetches the lead data from Azure, then sends
    an SMS using our **TwilioCore** class.


    Let’s create a **LeadsCore** class responsible for retrieving the leads stored
    on Azure and send an SMS. We’ll manually create the Lead records on Table Storage
    using Azure Storage Explorer.


    First, we create a table called **LeadsSuccinctly** using Storage Explorer. This
    table will be used to keep track of webinars that potential leads might be interested
    in. All the fields will have *string* values except for the **FollowedUp** field,
    which will have a *bool* value.


    The table’s **PartitionKey** should contain the name of the webinar the lead is
    interested in, and the **RowKey** should be the string representation of the date
    and time when the lead was posted on the site.


    Just as we did with the appointment’s reminder code, we’ll use a **Timer** object
    in order to retrieve the first posted lead.


    Let’s consider the leads gathered from our website on Azure, as shown in Figure
    38.'
