    # # Chapter 1  Working with SMS


    # ## Introduction


    Before social networks took off, SMS was the most common way to exchange short
    messages.


    Even though Wikipedia reports that SMS is still strong and growing, social networking
    messaging services such as Facebook Messenger, WhatsApp, Skype, and Viber, all
    available on smartphones, are increasingly being used to exchange short messages.


    Despite that, SMS is still used widely in enterprise development for marketing,
    Customer Relationship Management (CRM) automation, real-time alerts notifications,
    and two-step verification of a user''s identify.


    The significance of SMS usage in the business world remains incredibly important
    given that the technology is considered mature, widely used, proven, and reliable.


    One of the most prevalent uses cases for the adoption of SMS is two-step verification,
    also known as Two-Factor Authentication (2FA), which consists of strengthening
    or replacing a username or password with one or more SMS codes. This requires
    both the primary password and the user''s mobile phone in order to properly authenticate
    and allow a user to get access to a specific resource.


    Other uses of SMS technology include sending and receiving standard notifications
    and alerts.


    With the Twilio platform, SMS can be sent to mobile phones anywhere in the world,
    and message tracking is built into the platform.


    In this chapter, we''ll explore how to interact with SMS by using the Twilio API
    helper library, how to implement 2FA, how to set up a Twilio account, and how
    to purchase a disposable phone number.


    We''ll start with simple examples of how to send and track SMS, then use that
    to build a simple but powerful 2FA system.


    # ## Setting up a Twilio account


    Before we can send SMS using the Twilio API helper library, we''ll need to sign
