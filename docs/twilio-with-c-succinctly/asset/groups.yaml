  - '[PAGE 78]


    # Chapter 4 Automation Using Voice


    # Introduction


    We''ve explored the basics of Twilio''s voice capabilities, which has hopefully
    given you a good idea of what is possible to do with TwiML and the C# helper library
    in order to create voice- enabled applications.


    Let''s now explore how we can expand a bit more and use Twilio''s voice-enabled
    features in order to automate business processes.


    We''ll mostly use TwiML in order to create an interactive phone menu, a simple
    conferencing service, and an exciting, automated voice-survey solution.


    We''ll also be relying on Azure Table Storage and Azure Websites, just as in Chapter
    3, and because we are basing the code that follows on Chapter 3''s code, the examples
    should again be easy to follow and fun to implement.


    # Interactive Phone Menu


    An Interactive Phone Menu is an automated phone software system that can facilitate
    and coordinate the communication between callers and businesses. If you''ve ever
    dialed your insurance company to file a claim and responded to a series of automated
    prompts, you''ve used one of these systems.


    Twilio makes it easy to build this. We''ve already explored some of the basics
    by building a simple answering machine in Chapter 3. Now, let''s create a phone
    menu system for a company that has departments located in different regions. This
    system will connect the caller with a specific department based on the digit entered
    by the caller.


    In order to start the phone menu, we need to configure our Twilio number so that
    it will send our web application an HTTP request when we receive an incoming call.
    We''ll use and modify the existing NancyFX app we created in the previous chapter.


    First, we configure our Twilio number to point to a specific URL that our web
    app will use for processing incoming calls. Next, we modify the TwiML app we called
    TwilioSuuccinctly to point to our new incoming URL. This URL should be the location
    of our NancyFX app on Azure Websites followed by /ipm/incoming.'
