    \ PhoneNumber,\n                                $\"Reminder of appointment {ad.Id}\
    \ -\n                                {ad.Name} on: {a.FormatTime(ad.Time)}\");\n\
    \n                            Console.WriteLine(\n                           \
    \     $\"Reminder of appointment\n                                {ad.Id} - {ad.Name}\
    \ on:\n                                {a.FormatTime(ad.Time)}\");\n\n       \
    \                     ad.Sent = true;\n                        }\n\n         \
    \               a.MarkAsSent(ad);\n                    }\n                }\n\n\
    \                started = false;\n            }\n        }\n\n        public\
    \ static bool Create(string id, string n, string pn,\n            DateTime t)\n\
    \        {\n            bool res = false;\n\n            using (Appointment a\
    \ = new Appointment(id, n, pn, t))\n            {\n                res = a.Create();\n\
    \n                if (res)\n                    Console.WriteLine(\n         \
