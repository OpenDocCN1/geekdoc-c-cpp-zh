    \ callers and businesses. If you've ever dialed your insurance company to file\
    \ a claim and responded to a series of automated prompts, you've used one of these\
    \ systems.\n\nTwilio makes it easy to build this. We've already explored some\
    \ of the basics by building a simple answering machine in Chapter 3. Now, let's\
    \ create a phone menu system for a company that has departments located in different\
    \ regions. This system will connect the caller with a specific department based\
    \ on the digit entered by the caller.\n\nIn order to start the phone menu, we\
    \ need to configure our Twilio number so that it will send our web application\
    \ an HTTP request when we receive an incoming call. We'll use and modify the existing\
    \ NancyFX app we created in the previous chapter.\n\nFirst, we configure our Twilio\
    \ number to point to a specific URL that our web app will use for processing incoming\
    \ calls. Next, we modify the TwiML app we called **TwilioSuccinctly** to point\
    \ to our new incoming URL. This URL should be the location of our NancyFX app\
    \ on Azure Websites followed by `/ipm/incoming`.\n\n### TwilioSuccinctly\n\n|\
    \ Property | Value |\n| :--- | :--- |\n| **SID** | *content obscured* |\n| **Friendly\
    \ Name** | TwilioSuccinctly |\n| **Voice** | |\n| Request URL | http://twiliosuccinctly.azurewebsites.net/ipm/incoming\
    \ | HTTP GET |\n| **Messaging** | |\n| Request URL | *(empty input field)* | HTTP\
    \ POST |\n\n**Save** **Cancel**\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_79_0.png)\n\
    \nBased on Figure 48, we'll assume our phone menu app will receive incoming calls\
    \ through this REST endpoint: `/ipm/incoming`.\n\nWe'll use this to greet our\
    \ callers. Let's add this endpoint logic on our **AnsweringMachineMain** NancyFX\
    \ module.\n\n### Code Listing 29: The Interactive Phone Menu Greeting\n\n```csharp\n\
    // In NancyFX, _ = > indicates that no parameters are used for this route.\nGet[\"\
    /ipm/incoming\"] = _ =>\n{\n    string res = \"<Response>\" +\n        \"<Gather\
    \ action=\\\"/ipm/response\\\" method=\\\"GET\\\">\" +\n        \"<Say voice=\\\
    \"woman\\\">Welcome to Cool Company.</Say>\" +\n        \"<Say voice=\\\"woman\\\
    \">Press 1 to contact Sales.</Say>\" +\n        \"<Say voice=\\\"woman\\\">Press\
    \ 2 to contact Support.</Say>\" +\n        \"<Say voice=\\\"woman\\\">Press 3\
    \ for general inquiries.</Say>\" +\n        \"</Gather>\" +\n        \"<Say voice=\\\
    \"woman\\\">We didn't get any response. Bye.</Say>\" +\n        \"</Response>\"\
    ;\n\n    return Response.AsText(res, \"text/xml\");\n};\n```\n\nUsing Visual Studio,\
    \ let's publish our NancyFX application with this change to Azure Websites. If\
    \ we then call our Twilio number, we should now hear this response. Hurray!\n\n\
    Moving forward, the **Gather** verb on the TwiML response points to another endpoint:\
    \ `/ipm/response`. We'll use this endpoint to create our menu response based on\
    \ the input entered by the caller.\n\nNote that we can still use and expand our\
    \ **SimpleAnsweringMachine** class in order to add any specific logic required\
    \ for our phone menu.\n\nHaving a method that inserts a space after each char\
    \ within a string is also useful. This is done so that Twilio can read the phone\
    \ number digit-by-digit rather than by reading the entire number at once. We'll\
    \ explore that in a bit.\n\nFirst, let's process the caller's input and create\
    \ our `/ipm/response` endpoint on our **AnsweringMachineMain** NancyFX module.\n\
    \nJust as we did with our simple answering machine example in Chapter 3, we'll\
    \ query the **SASuccinctly** table on Azure and retrieve a value.\n\nHowever,\
    \ this value will be a phone number that corresponds to the option the user entered.\
    \ The digit the user entered will be the **PartitionKey** and the phone number\
    \ retrieved will be the **RowKey**. The phone number needs to be in an international\
    \ format, i.e. +14800001111.\n\nLet's add three more rows to our **SASuccinctly**\
    \ table using Azure Storage Explorer.\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_80_0.png)\n\
    \nThis phone number will be used to connect the caller with the corresponding\
    \ department within the company.\n\n### Code Listing 30: The Interactive Phone\
    \ Menu Response Endpoint\n\n```csharp\nGet[\"/ipm/response\"] = _ =>\n{\n    string\
    \ num = \"Unknown\";\n    // ... code continues\n}\n```\n"
  mdcn: "\n## 发起外呼\n\n我们已经了解了如何接听电话并使用 TwiML 处理语音请求。在结束本章并进入更高级的示例之前，让我们讨论一下如何使用 Twilio\
    \ C# 辅助类库发起外呼。\n\n我们将扩展我们的 **TwilioCore** 类，并添加一个方法来拨打电话。让我们在代码清单 26 中实现这个方法。\n\
