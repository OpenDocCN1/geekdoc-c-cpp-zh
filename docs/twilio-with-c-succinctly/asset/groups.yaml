    \ program, we get the appointments created in Figure 35.\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_53_0.png)\n\
    \nAfter these appointments have been created, we wait for a bit and let the program\
    \ look for the first expired appointment.\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_53_1.png)\n\
    \nWe can then inspect the AppointmentsSuccinctly table on Azure to see how the\
    \ data looks after executing the program.\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_54_0.png)\n\
    \nFigure 37: Appointments Data on Azure Table Storage\n\nWe can clearly see the\
    \ **Sent** property has been set to **True** for the BurgerKing (first expired)\
    \ appointment.\n\n## Automated instant lead alerts\n\nInstant leads are a great\
    \ way for sales people to close more deals because they allow sales reps to reach\
    \ out to interested customers moments after they have been identified. Automating\
    \ the process of reaching out to leads is a fantastic way to put the power of\
    \ Twilio to work for you.\n\nThe process of collecting leads starts with having\
    \ one or more landing pages in which you collect information from your website\
    \ visitors about a product or service that your organization offers.\n\nFor simplicity’s\
    \ sake, we’ll assume that the information being collected is stored on Azure Table\
    \ Storage. This information will consist of the customer’s full name, email address,\
    \ phone number, and which webinar they are interested in. There will also be a\
    \ **FollowedUp** property that will be used to indicate whether or not a lead\
    \ has been followed up on.\n\nWe’ll create a small application that fetches the\
    \ lead data from Azure, then sends an SMS using our **TwilioCore** class.\n\n\
    Let’s create a **LeadsCore** class responsible for retrieving the leads stored\
    \ on Azure and send an SMS. We’ll manually create the Lead records on Table Storage\
    \ using Azure Storage Explorer.\n\nFirst, we create a table called **LeadsSuccinctly**\
    \ using Storage Explorer. This table will be used to keep track of webinars that\
    \ potential leads might be interested in. All the fields will have *string* values\
    \ except for the **FollowedUp** field, which will have a *bool* value.\n\nThe\
    \ table’s **PartitionKey** should contain the name of the webinar the lead is\
    \ interested in, and the **RowKey** should be the string representation of the\
    \ date and time when the lead was posted on the site.\n\nJust as we did with the\
    \ appointment’s reminder code, we’ll use a **Timer** object in order to retrieve\
    \ the first posted lead.\n\nLet’s consider the leads gathered from our website\
    \ on Azure, as shown in Figure 38.\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_55_0.png)\n\
    \n*Figure 38: Leads Data on Azure Table Storage*\n\nLet’s write the code. As with\
    \ our earlier example ,we’ll have the core class that interacts with Table Storage,\
    \ then we’ll have a wrapper class around it that actually implements the business\
    \ logic.\n\n### Code Listing 17: LeadsCore Class\n\n```csharp\nusing System;\n\
    using Microsoft.WindowsAzure.Storage;\nusing Microsoft.WindowsAzure.Storage.Table;\n\
    \nnamespace TwilioSuccinctly\n{\n    public class LeadsData : TableEntity\n  \
    \  {\n        public LeadsData(string p, string d)\n        {\n            PartitionKey\
    \ = p;\n            RowKey = d;\n        }\n        public LeadsData(string p)\n\
    \        {\n            PartitionKey = p;\n            RowKey = string.Empty;\n\
    \        }\n\n        public LeadsData()\n        {\n            PartitionKey\
    \ = string.Empty;\n            RowKey = string.Empty;\n        }\n\n        public\
    \ string FullName { get; set; }\n        public string Email { get; set; }\n \
    \       public string Webinar { get; set; }\n    }\n}\n```\n"
