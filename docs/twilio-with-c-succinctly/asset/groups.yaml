    \n然后，我们可以检查 Azure 上的 AppointmentsSuccinctly 表，以查看执行程序后数据的样子。\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_54_0.png)\n\
    \n图 37: Azure 表存储中的预约数据\n\n我们可以清楚地看到，对于 BurgerKing（第一个过期的）预约，**Sent** 属性已被设置为\
    \ **True**。\n\n## 自动即时线索警报\n\n即时线索是销售人员达成更多交易的好方法，因为它们允许销售代表在识别出感兴趣的客户后的几分钟后即可联系他们。自动化联系线索的过程是将\
    \ Twilio 的力量为您所用的一种绝佳方式。\n\n收集线索的过程始于拥有一个或多个落地页，用于收集关于您的组织提供的产品或服务的网站访客信息。\n\n\
    为了简单起见，我们假设所收集的信息存储在 Azure 表存储中。这些信息将包括客户的全名、电子邮件地址、电话号码以及他们感兴趣的网络研讨会。此外，还将有一个\
    \ **FollowedUp** 属性，用于指示是否已跟进该线索。\n\n我们将创建一个小型应用程序，从 Azure 获取线索数据，然后使用我们的 **TwilioCore**\
    \ 类发送短信。\n\n让我们创建一个负责检索存储在 Azure 中的线索并发送短信的 **LeadsCore** 类。我们将使用 Azure Storage\
    \ Explorer 在表存储上手动创建 Lead 记录。\n\n首先，我们使用 Storage Explorer 创建一个名为 **LeadsSuccinctly**\
    \ 的表。该表将用于跟踪潜在线索可能感兴趣的网络研讨会。除了 **FollowedUp** 字段具有 *bool* 值外，所有字段都将具有 *string*\
    \ 值。\n\n该表的 **PartitionKey** 应包含线索感兴趣的网络研讨会的名称，而 **RowKey** 应为线索发布在站点上时日期和时间的字符串表示形式。\n\
    \n就像我们在预约提醒代码中所做的那样，我们将使用 **Timer** 对象来检索第一个发布的线索。\n\n让我们看看 Azure 上从我们网站收集的线索，如图\
