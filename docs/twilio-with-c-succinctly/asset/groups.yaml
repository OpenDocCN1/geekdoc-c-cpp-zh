  - '[PAGE 66]


    Notice that the response has been broken down into several parts by using multiple
    **Say** verbs and also by using one-second **Pause** verbs in between. This happens
    because Twilio uses a text-to-speech engine in order to read out the written text
    to the caller.


    In order to make the experience seem as much like a human answering the call as
    possible, it is important to relay the message in parts and with the necessary
    pauses. Also notice that the sentences are not long and that punctuation signs
    are used.


    There’s no rule of thumb to make a “perfect” TwiML text-to-voice response. In
    order to get this sounding less like a machine, you’ll probably have to play with
    it for a bit until you get the response sound to your liking.


    TwiML is a great resource that allows us to quickly add voice functionality with
    no programming required. However, because responses are based on XML markup, they
    will need to be statically hosted or embedded within server-side software such
    as PHP or ASP.NET.


    One of TwiML’s limitations as a markup language is that it doesn’t allow for the
    usage of variables, so if we want to have responses that are not predefined, we
    must construct the XML on the fly on the server and then return it as a response.


    We can get around this by creating customized TwiML responses. Let’s explore how.


    # ## Simple Answering Machine


    After having explored some of the basics of TwiML, let’s create a Simple Answering
    Machine that will provide specific instructions to callers based on digits they
    type in after the call has been answered.


    We’ll create a `SimpleAnsweringMachine` class that will contain the logic required
    by our answering machine application.


    As TwiML requires a URL endpoint, we’ll create a [NancyFX](http://example.com/nancyfx)
    application that we can deploy as an Azure [website](http://example.com/azure-website).


    If you would like more in-depth information about NancyFX, Syncfusion has a fully
    dedicated [e-book](http://example.com/nancyfx-ebook) that is a great resource
    about the framework and its capabilities. Feel free to have a look at it.


    In order to create a NancyFX application, first make sure to install the [SideWaffle
    Template Pack for Visual Studio](http://example.com/sidewaffle-template). The
    SideWaffle installer is easy to follow and requires only a few clicks.


    After SideWaffle has been installed, you may create a new NancyFX project called
    *TwilioNancyAspNetHost* by selecting *Nancy empty project with ASP.NET host* as
    follows in Figure 41.'
