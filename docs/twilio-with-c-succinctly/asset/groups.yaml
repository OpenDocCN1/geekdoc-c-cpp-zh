    \            \"</Dial>\" +\n                        \"</Response>\";\n       \
    \         }\n            }\n        }\n    }\n\n    return Response.AsText(res,\
    \ \"text/xml\");\n};\n```\n\nThis logic is easy to follow. After the access code\
