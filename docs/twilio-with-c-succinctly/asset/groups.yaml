    \n该应用程序应快速问候来电者，并要求他们输入访问代码，以便在一个名为 SAMSuccinctly 的 Azure 存储表中返回并存储一个秘密代码。\n\n\
    由于我们的 NancyFX (Azure 网站) 应用程序将使用 Azure 存储，请别忘了从 NuGet 安装该包。\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_71_0.png)\n\
    \n现在我们可以使用 Azure Storage Explorer 按图 47 所示创建我们的 SAMSuccinctly 表。让我们将访问代码存储为 PartitionKey，将秘密代码存储为\
    \ RowKey。\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_71_1.png)\n\n我们可以使用以下 TwiML\
    \ 标记来问候来电者并要求他们提供访问代码。\n\n#### 代码清单 23：用于我们应用程序的 TwiML 标记问候\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!-- page located at http://twiliosuccinctly.azurewebsites.net/\
    \ -->\n<Response>\n    <Gather action=\"/sam\" method=\"GET\">\n        <Say>\n\
    \            Please enter your access code,\n            followed by the pound\
    \ sign.\n        </Say>\n    </Gather>\n    <Say>We didn't receive any access\
    \ code. Bye.</Say>\n</Response>\n```\n\n请注意，负责收集访问代码的这个问候响应托管在网站的根目录上 ([http://twiliosuccinctly.azurewebsites.net/](http://twiliosuccinctly.azurewebsites.net/))。然而，动作响应在\
    \ /sam 上可用 ([http://twiliosuccinctly.azurewebsites.net/sam](http://twiliosuccinctly.azurewebsites.net/sam))。\n\
    \n现在，让我们实现我们的 **SimpleAnsweringMachine** 类。\n\n#### 代码清单 24：SimpleAnsweringMachine\
    \ 类\n\n```csharp\nusing System;\nusing Microsoft.WindowsAzure.Storage;\nusing\
    \ Microsoft.WindowsAzure.Storage.Table;\n\nnamespace TwilioSuccinctly\n{\n   \
    \ public class SimpleAnsweringMachineData : TableEntity\n    {\n        public\
    \ SimpleAnsweringMachineData(string p, string d)\n        {\n            PartitionKey\
    \ = p;\n            RowKey = d;\n        }\n\n        public SimpleAnsweringMachineData()\n\
    \        {\n        }\n    }\n\n    public class SimpleAnsweringMachine : IDisposable\n\
    \    {\n        protected bool disposed;\n\n        private const string cStrConnStr\
    \ =\n            \"<< Your Azure Storage Connection String >>\";\n        private\
    \ const string cStrAppTable = \"SAMSuccinctly\";\n\n        public SimpleAnsweringMachine()\n\
    \        {\n        }\n\n        ~SimpleAnsweringMachine()\n        {\n      \
    \      Dispose(false);\n        }\n\n        public virtual void Dispose(bool\
    \ disposing)\n        {\n            if (!disposed)\n            {\n         \
    \       if (disposing)\n                {\n                }\n            }\n\n\
    \            disposed = true;\n        }\n\n        public void Dispose()\n  \
    \      {\n            Dispose(true);\n            GC.SuppressFinalize(this);\n\
    \        }\n\n        public string Get(string ac)\n        {\n            string\
    \ res = string.Empty;\n\n            try\n            {\n                var storageAccount\
    \ =\n                    CloudStorageAccount.Parse(cStrConnStr);\n           \
    \     CloudTableClient tableClient =\n                    storageAccount.CreateCloudTableClient();\n\
    \                CloudTable table =\n                    tableClient.GetTableReference(cStrAppTable);\n\
    \n                TableQuery<SimpleAnsweringMachineData> query = new\n       \
    \             TableQuery<SimpleAnsweringMachineData>().Where(\n              \
    \      TableQuery.GenerateFilterCondition(\"PartitionKey\",\n                \
    \    QueryComparisons.Equal, ac));\n\n                foreach (SimpleAnsweringMachineData\
    \ en in\n                    table.ExecuteQuery(query))\n                {\n \
    \                   res = en.RowKey;\n                    break;\n           \
    \     }\n            }\n            catch (Exception ex)\n            {\n    \
    \            Console.WriteLine(ex.ToString());\n            }\n\n            return\
    \ (res == string.Empty) ? \"Unknown\" : res;\n        }\n    }\n}\n```\n\n我们的\
    \ **SimpleAnsweringMachine** 类实际上非常简单。它有一个 **Get** 方法，使用访问代码（由 **PartitionKey**\
    \ 表示）查询 **SAMSuccinctly** 表，并返回一个也包含秘密代码的 **SimpleAnsweringMachineData** 对象。\n\
    \n如您所见，查询 **SAMSuccinctly** 表与我们在上一章中使用 Azure 类看到的类似。\n\n现在，在代码清单 25 中，让我们看看如何扩展我们的\
    \ **AnsweringMachineMain** NancyFX 模块的功能，以便我们可以实现 **SimpleAnsweringMachine** 类所公开的功能。\n\
    \n### 代码清单 25：扩展的 *AnsweringMachineMain* 类\n\n```csharp\nusing Nancy;\nusing TwilioSuccinctly;\n\
    \nnamespace TwilioNancyAspNetHost\n{\n    public class AnsweringMachineMain :\
    \ NancyModule\n    {\n        public AnsweringMachineMain()\n        {\n     \
    \       Get[\"/\"] = _ =>\n            {\n                return Response.AsText(\n\
    \                    \"<Response> \" +\n                    \"<Gather action=\\\
    \"/sam\\\" method=\\\"GET\\\"> \" +\n                    \"<Say voice=\\\"woman\\\
    \">Please enter your access \" +\n                    \"code, followed by the\
    \ pound sign.</Say>\" +\n                    \"</Gather> \" +\n              \
    \      \"<Say voice=\\\"woman\\\">We didn't receive any \" +\n               \
    \     \"access code. Bye.</Say> \" +\n                    \"</Response>\",\n \
    \                   \"text/xml\"\n                );\n            };\n\n     \
    \       Get[\"/sam\"] = _ =>\n            {\n                string sc = \"Unknown\"\
    ;\n                string ac = Request.Query[\"Digits\"].Value;\n            \
    \    string res = string.Empty;\n\n                res = \"<Response><Say voice=\\\
    \"woman\\\">No access \" +\n                      \"code found.</Say>\" +\n  \
    \                    \"</Response>\";\n\n                if (ac != null && ac\
    \ != string.Empty)\n                {\n                    using (SimpleAnsweringMachine\
    \ sam = new SimpleAnsweringMachine())\n                    {\n               \
    \         if (Request.Query[\"Digits\"] != string.Empty)\n                   \
    \         sc = sam.Get(ac);\n                    }\n\n                    res\
    \ = \"<Response><Say voice=\\\"woman\\\">You entered: \" +\n                 \
    \         ac + \"</Say>\" +\n                          \"<Say voice=\\\"woman\\\
    \">Your secret code is: \" +\n                          sc + \"</Say>\" +\n  \
    \                        \"</Response>\";\n\n                    return Response.AsText(res,\
    \ \"text/xml\");\n                }\n\n                return Response.AsText(res,\
    \ \"text/xml\");\n            };\n        }\n    }\n}\n```\n\n我们的 **AnsweringMachineMain**\
    \ NancyFX 模块实现了两个 REST 端点。根端点向来电者提供问候信息，并通过 **Gather** TwiML 动词收集访问代码，该动词会触发 /sam\
    \ 端点上的动作。\n\n当 /sam 端点被执行时（即来电者输入访问代码数字并按下井号键后），会创建一个 **SimpleAnsweringMachine**\
    \ 类的实例，并调用其 **Get** 方法，传入由来电者输入的数字（这些数字存储在 HTTP **Request.Query** 对象中）。\n\n然后\
    \ **Get** 方法会查询 SAMSuccinctly 表，并返回与正在查询的 **PartitionKey**（访问代码）匹配的 **RowKey**（代表秘密代码）。\n\
    \n为了使 NancyFX 应用程序正常运行，*TwilioNancyAspNetHost* 项目需要发布到 Azure 网站。可以通过拿起电话并拨打与该\
    \ TwiML 应用程序相关的 Twilio 号码来轻松测试此应用程序。\n\n您应该能够输入您的访问代码（SAMSuccinctly 表中现有的两个代码之一），并以语音响应的形式获取您的秘密代码。\n\
    \n"
