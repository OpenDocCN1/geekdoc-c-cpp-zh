    \n## 自动语音调查\n\n自动调查允许最终用户拨打一个电话号码，该电话号码将用于执行询问问题并提示用户提供每个问题答案的调查。\n\n电话调查是从用户那里收集有价值数据的好方法，并且它们有许多业务应用，特别是在品牌知名度、产品洞察和客户满意度方面。\n\
    \n首先，让我们解释一下使用 Twilio 时语音调查应该如何工作。\n\n- Twilio 接收呼叫并向我们的 TwilioSuccinctly TwiML\
