  md: "\nThe **MarkAsSent** methods work in almost exactly the same way as the **Create**\
    \ method. The main difference is that **MarkAsSent** performs an **InsertOrReplace**\
    \ rather than an **Insert**, thus updating the **Sent** property of the **AppointmentData**\
    \ object with the value **true** after the SMS has been sent.\n\nIn turn, the\
    \ **Get** method works almost exactly the same way as the **MarkAsSent** or **Create**\
    \ methods do, however it creates an instance of a **TableQuery** class, then executes\
    \ the **Where** method by chaining it with the **GenerateFilterCondition** method.\
    \ With this in place, a call to **CloudTable.ExecuteQuery** is invoked, returning\
    \ **IEnumerable\\<AppointmentData\\>**.\n\nBecause **GenerateFilterCondition**\
    \ bases its filtering on the **PartitionKey**, all the records with the same phone\
    \ number will be retrieved. By looping through the **IEnumerable\\<AppointmentData\\\
    >** results and by comparing today’s date **tdy** with the appointment’s due date\
    \ **exp**, the first expired appointment with a non-sent SMS (**Sent** property\
    \ set to **false**) will be retrieved and returned to the caller method.\n\nLet’s\
    \ now implement a couple of examples that put all this to work. In Code Listing\
    \ 15, we’ll create an **AppointmentExample** class that will create some appointments\
    \ and send SMS for due ones.\n\n### Code Listing 15: The AppointmentExample Wrapper\
    \ Class\n\n```csharp\nusing System;\nusing System.Timers;\n\nnamespace TwilioSuccinctly\n\
    {\n    public class AppointmentExample\n    {\n        private const string cStrTwilioSid\
