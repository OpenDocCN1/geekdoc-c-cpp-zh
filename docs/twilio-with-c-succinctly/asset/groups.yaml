    # Setting up 2FA using Authy


    Authy is a powerful and advanced 2FA solution that strengthens and can even replace
    the traditional username and password login for websites, SaaS products, and mobile
    apps.


    Authy makes it easy to use 2FA on your online accounts with your smartphone.


    The Authy platform generates secure two-step verification codes on your device
    because using 2FA helps keep your user accounts secure by validating two factors
    of identity. It works by requiring you to identify yourself using two different
    things when you login to a site or an app.


    Most login systems only validate something you user already knows, like a password.
    In simple terms, 2FA consists of registering your mobile number once, then subsequently
    receiving a disposable, one-time code which is used to validate your login credentials
    when authenticating.


    The second factor in the validation is tied to something you own (such as your
    mobile phone). So, you can think of two-factor validation as something you know
    (your password) plus something you have (your mobile phone). Again—adding this
    additional layer of security helps protect your account from hackers and hijackers.'
