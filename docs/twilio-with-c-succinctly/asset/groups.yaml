    \ from the **IDisposable** interface, which means we can create an instance of\
    \ **TwilioCore** and later have it automatically disposed if it's called inside\
    \ a **using** statement. This is very convenient—it helps us write clean code.\n\
    \nIn order to authenticate, Twilio requires an Account SID and an Authorization\
    \ Token (Auth Token).\n\nThese have been added to the **TwilioCore** class as\
    \ parameters to one of the constructors and also as two public properties called\
    \ **SID** and **aTk** respectively. The Account SID and Auth Token can be found\
    \ at this [URL](URL). In order to view them, you'll need to click Show API Credentials,\
    \ as shown in Figure 9.\n\n![](img/7d3e41c7ef83c5fb4ef242998ad60317_17_0.png)\n\
