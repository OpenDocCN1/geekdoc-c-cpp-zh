    \n# 第 4 章 使用语音进行自动化\n\n## 简介\n\n我们已经探索了 Twilio 语音功能的基础，这应该让您对使用 TwiML 和 C# 辅助类库创建语音启用应用程序的可能性有了很好的了解。\n\
