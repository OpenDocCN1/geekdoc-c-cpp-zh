  md: '# Chapter 10


    # Using Excel


    # 10.1 Exporting Data


    When you work within Test & Measurement, you know that no matter how many ways
    your application can show data, the user will always ask: “can I get it in Excel?”
    Users want to calculate, filter, sort and sometimes pivot their data in the well-known
    tool.


    There are libraries for exporting, but again I wanted something simple that is
    easy to maintain. It can be difficult to write in the native formats, but CSV
    - Comma Separated Values - is a simple format that Excel can import.


    The most annoying thing - when using CSV - is that you cannot just doubleclick
    on a file and sit back while Excel opens it. You are always asked about the formatting.
    This is tedious if you are opening many files. However, Excel has a well kept
    “secret”. If the first line in the csv-file contains ‘sep=;’ and nothing else,
    it will silently accept ‘;’ as column separator and newline¹ as row separator.
    The code for this is seen in line 18 in Listing 10.1.'
