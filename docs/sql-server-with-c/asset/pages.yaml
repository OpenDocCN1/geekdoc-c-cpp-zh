  md: '# CHAPTER 2. DATABASE BASICS


    almost everything written in this book is also true for other RDBMS’like Oracle
    and MySQL/MariaDB, although sometimes the syntax deates a little. In this book
    I follow the usual terms - using “RDBMS” for the product that you get from e.g.
    Microsoft, and “database” for the thing you create in it.


    You probably already have an idea of the main terms in databases mean. There are,
    however, many misunderstandings and words with multiple meanings. It is difficult
    to describe some terms without using the others. For this reason I will briefly
    introduce the most important parts of the SQL Server hierarchy in Table 2.1. This
    continues in Table 2.2 with the most important database concepts. We will meet
    them all again.


    The discussion on records & fields versus rows & columns can be a pain. Early
    PC-databases used a mixture of the terms. “Records” and “Fields” are often used
    in UI-software, and “Records” are also used at the file-level in databases. In
    Excel we use “rows” and “columns”. No wonder most of us use “row” and “record”
    for the same thing, the same goes for “column” and “field”. However, the standards
    and even Microsoft says:


    # A DATABASE-TABLE CONSISTS OF ROWS AND COLUMNS.


    Thus we will use “row” and “column” in this book. The term “Field” is also sometimes
    used for a specific column and row intersection. Naturally this will be referred
    to as a Cell.'
