  md: '# 2.6. JOINS


    # 2.6 Joins


    One of the most important database-concepts is the Join. Here we “align” the private
    keys from one table with their specific foreign key counterparts from another
    table - generating a new wider, temporary table. There are a number of different
    ways to do this:


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_35_0.png)


    Figure 2.3: Most important Joins


    +   Join. In SQL, the simple JOIN is the same as the INNER JOIN. This is what
    we see in Figure 2.3 on the left side. Result temporary table created by the join
    consists of only elements where there are matching keys in the two tables. As
    there may be several foreign key instances for the same primary key, the new table
    can have several rows with this private key - one for each of these instances.
    On the other hand, there will be no rows where a key exists only as a private
    key or only as a foreign key. The latter case sounds wrong - how can there be
    a foreign key without a corresponding private key? There may have no constraint
    declared (we will get to this). In fact the two key-columns in the two tables
    may have been created totally independent of each other - not as keys - until
    we just decided to write the SQL JOIN statement where we treat the columns as
    private/foreign keys.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# CHAPTER 2. DATABASE BASICS


    +   Left Join

    This is sometimes known as a LEFT OUTER JOIN. The SQL LEFT JOIN is seen in the
    right side (sorry) of Figure 2.3. In this case all rows from table A appear in
    the resulting temporary table. Where matching keys are found in table B, the rows
    are extended with data from here. These rows are identical to the rows in the
    (INNER) JOIN. The new stuff here is that we also see the rows in table A that
    have no matches in table B. The “missing columns” are filled with NULLs.


    +   Right Join

    This works the same way as a left join - but now with the full B table and the
    matches from A. Personally I never use a right join - I simply reference the tables
    in the opposite order and use the left join.


    +   Full Join

    This is also known as a FULL Outer JOIN and is not shown in the figure. This includes
    all rows from both tables - matched when possible with common keys, and with NULL’s
    in the rest of the columns.


