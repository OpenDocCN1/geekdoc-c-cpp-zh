  md: '# 2.2. CRUD AND ACID


    # 2.2 CRUD and ACID


    You can always count on the programming world to come up with catchy acronyms.


    CRUD refers to Create-Retrieve-Update-Delete


    This summarizes the main operations on a running database. Note that these terms
    are all related to data operations on existing tables - see Table 2.3. In SQL
    there is a CREATE command for creating tables. This is not related to the “Create”
    in CRUD. See Table 2.3 for an explanation. If you are interested in REST-protocols,
    you will find similar CRUD actions in these.


    Table 2.3: CRUD


    | CRUD | SQL | Meaning |

    | --- | --- | --- |

    | Create | INSERT | Insert new row(s) in a database table. It is possible - not
    typical - to insert more than one row per SQL-statement |

    | Retrieve | SELECT | Fetch any number of rows based on various criteria, grouped,
    sorted etc. This is the most complex command. This is where we use JOIN. To most
    people a query is what is implemented by a SELECT |

    | Update | UPDATE | Update selected columns. As SELECT it is possible to work
    on many rows at a time, . |

    | Delete | DELETE | Delete any number of rows based on given criteria. |


    In order to understand some basic database concepts in this chapter we need to
    use the SELECT before we dig further it into Chapter 4.


    ACID refers to ATOMIC-CONSISTENT-ISOLATED-DURABLE.


    Whereas CRUD refers to the functions you use as a programmer or database-administrator,
    ACID refers to the implementation and quality of the RDBMS itself¹. If we were
    to design such a system, we would need


    > ¹And to a degree also to your implementation'
