  md: '# CHAPTER 2. DATABASE BASICS


    Now for the join. The following T-SQL queries may be written in Management Studio''s
    Query Editor. You may need to start all the following T-SQL scripts with the following
    to get the right scope:


    ```

    USE Shop

    Go

    ```


    Oftimes examples start with “SELECT *”. The star is an easy way to get data from
    all columns in the table. The names used in the output corresponds to the table
    column names. It is however not good habit to use the star in real applications.
    Table-changes may lead to columns appearing in another order.


    Another reason for specifically naming columns, instead of using the star, is
    to limit the output - as in Listing 2.5. The join effectively generates a new
    temporary table with all columns from all joined tables. This means that the key
    columns are shown in all their occurrences - as private keys and foreign keys.
    You normally want to see a single instance, or maybe none if they are surrogate
    keys. The resulting table here is so wide, that not only the keys not shown -
    the table is also scaled down to fit the page. Finally, the “AS” in the SELECT
    renames the output column headers - in this case shorter names.


    # Listing 2.5: Joins


