    OrderItem2 etc as columns in Orders table. The programmers first instinct is to
    have a reference to an OrderList - another table. Unfortunately, this would mean
    that each different row in Orders should have its own table with OrderItems -
    dynamically created as orders are created. That is exactly how programs work with
    collections, but it is not how databases are organized.


    Instead the relation is turned upside down, and we have one big table of OrderItems
