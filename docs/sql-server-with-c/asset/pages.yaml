  md: "# 10.3. COPY-PASTE TO FROM EXCEL\n\nInterestingly, the two actions - copy and\
    \ paste - take different routes. If the user presses CTRL-C, there is no action\
    \ handler for this in our code. Thus it is the DataGridView's built-in CTRL-C\
    \ handler that performs the relevant action. If the user activates the menu-item\
    \ for the same thing, the menu-action simply fakes a CTRL-C, and thus again leaves\
    \ it to the DataGridView handler. This is seen in Listing 10.5 line 17.\n\nListing\
    \ 10.5: Event Handlers\n\n```\nprivate void grid_KeyDown(object sender, EventArgs\
    \ e)\n{\n    if (e.Control && e.KeyCode == Keys.V)\n    {\n        if (Clipboard.ContainsText())\n\
    \        {\n            string oneStr = Clipboard.GetText();\n            pasteText(oneStr);\n\
    \        }\n        e.Handled = true;\n    }\n}\nvoid copyCTRLToolStripMenuItem_Click(object\
    \ sender, EventArgs e)\n{\n    Keys.Send(\"^c\");\n}\nvoid pasteCTRLToolStripMenuItem_Click(object\
    \ sender, EventArgs e)\n{\n    if (Clipboard.ContainsText())\n    {\n        string\
    \ oneStr = Clipboard.GetText();\n        pasteText(oneStr);\n    }\n}\n```\n\n\
    For paste it is the other way around. The CTRL-V keystroke is caught by the code\
    \ in Listing 10.5 - line 3. The clipboard content is used as parameter \"pasteText\"\
    . Line 11 assures that the corresponding event-handler in the grid is not called.\
    \ If the corresponding menu-item handler is called (line 20), it too fetches the\
    \ text in the clipboard buffer and hands it over to pasteText.\n\nFinally, Listing\
    \ 10.6 shows selected parts of the paste-handler. The textstring from Excel is\
    \ pretty much like the contents of a CSV-file. Instead of comma-separation it\
    \ uses tabs to separate rows (like many CSV files).\n\nThere are a couple of reasons\
    \ why CTRL-C can be handled by the Data-"
