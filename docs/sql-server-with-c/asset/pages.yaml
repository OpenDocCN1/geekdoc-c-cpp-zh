  md: '56


    CHAPTER 4. SQL


    It is possible to overdo indexing. Small tables are faster without index. Any
    change in a table (UPDATE, INSERT or DELETE) requires an update of the relevant
    indexes. SQL Server makes best use of its indexes and lookups when many rows are
    addressed by the same SQL-statement. Thus indexes really shine when it comes to
    large tables, mainly used in SELECT. When deciding which columns to include in
    start is to look at the WHERE statements in your queries. Columns used in comparisons
    here are good candidates.


    For the TimeReg application I want the daily INSERT’s and UPDATE’s for the developers
    to be fast, in order not to demotivate them. On the other managers with their
    queries can wait. These queries are more rare, and more rewarding. The conclusion
    seems to be: no extra indexes.


    However, all employee updates start with the SELECT of the current week. This
    is data for a given Employee and for a specific range of dates (a week)¹, so would
    it make sense to create an index based on these?


    Let us test Management Studio’s very nice display of the Execution Plan. As described
    earlier, when SQL Server receives a new query “compiles” it into an Execution
    Plan.


    When a query is visible you can press CTRL-M or select “Query” in the main menu,
    then “Include Actual Execution Plan”. Then press F5 to run the query.


    When a third output tab appears after “Results” and “Messages”, named “Execution
    Plan”. This is shown in Figure 4.1. Let’s take a look at the query in the top
    window.


    The query starts with CHECKPOINT DROPCLEANBUFFERS. Together these ensure that
    the query starts from a clean sheet with nothing clever in memory from the previous
    run - e.g. “compiled” SQL statements. After these commands we see:


    ```

    SET STATISTICS TIME ON and

    SET STATISTICS IO ON.

    ```


    > ¹Whether the BETWEEN command is for a range, or two comparisons, makes no difference.'
