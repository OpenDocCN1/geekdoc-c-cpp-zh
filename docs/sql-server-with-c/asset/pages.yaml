    Edward Codd, the inventor of the relational database, described the process of
    Normalization. He described a number of Normal Forms - starting with 1’s Normal
    Form (1NF), stepping up to Fifth Normal Form (5NF) - with each step including
    the rules of the previous, plus more. Later “Boyce-Codd” Normal Form was introduced
    between 3NF and 4NF. Normally 3NF is enough to avoid problems, and going further
    can cause performance problems. A popular summary of the first three normal forms
