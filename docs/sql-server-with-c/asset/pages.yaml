    # 2.4.4 Identity


    Most RDBM’s - including SQL Server - have support for Identity column. This is
    very practical for use as surrogate keys. By definition these can stand alone
    - they are not part of a composite key. In SQL Server identity-based values are
    initialized with a Seed - initial value - as well as an increment value. By default
    both the rows in the identity-column are numbered 1,2,3,4 etc. Whenever a row
    is deleted, a gap remains. For this reason the application software cannot assume
    that e.g. the latest given ID can be used as an indication of the number of rows.
    Identity-based keys are used lots in this book, as we will clearly see in the
    various T-SQL scripts.


    If a new database is created as a clone by restoring a backup of another base,
    and deleting the contents, the Identity will continue where it “left off”. The
    following line will reset the key - in this case on the “Main” table in the TimeReg
    base that we will see later. Do not do this on a non-empty base!


    ```

    DBCC CHECKIDENT (''TimeReg].[dbo].[Main]'', RESEED, 0);

    ```


