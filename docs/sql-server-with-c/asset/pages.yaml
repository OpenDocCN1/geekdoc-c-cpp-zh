  md: '# Chapter 5


    # Overall Design


    # 5.1 Database Frameworks


    Between the Object-Oriented world and the Relational Database world there are
    some inherent clashes:


    > OBJECT ORIENTATION FAVORS INFORMATION HIDING AND ENCAPSULATION. DATABASES ARE
    ALL ABOUT EXPOSING DATA.


    As described in subsection 2.5.4 there are also very different ways to handle
    containment - collections versus relations. Finally, the data-types in the database
    and the Object Oriented Programming-language are typically not the same. On top
    of all this, SQL may not be the programmers favorite language. These are some
    of the reasons various frameworks seem appealing.


    Is there a way to use a database without losing focus on the application at hand?
    Figure 5.1 shows the major choices of frameworks for developing database applications
    with Visual Studio. The frameworks are the grey boxes between the C# application
    and ADO.net. Thus ADO.net is the foundation for all the frameworks, but it can
    also be used directly from application code. ADO.net directly interfaces to SQL
    Server and via older technologies such as ODBC, OLE DB to Excel, XML, Sharepoint
    and other SQL-databases.'
