    # 2.5.6 Order System 3NF


    Returning to the Order system from Figure 2.1, we see that it satisfies 1NF -
    except maybe for the Customer Address. The (street) Address column is probably
    made by several strings like street-name, street-number etc. When is an Address
    a list of values and when is it **atomic**? the jury is still out on this one.
    We have already taken ZIP and Country-code as separate columns. Should street-no
    and floor-no be maybe apartment number be columns of their own? Clearly the street
    address can be broken down, but this process requires us to foresee all sorts
    of addressing schemes. Is it really worth it? Probably not. If we accept the (street)
    Address as being “atomic”, 1NF is satisfied.


    The Order system also satisfies 2NF as all non-key columns depend on the (whole)
    key in all tables. Is 3NF also satisfied? Yes, in all tables the non-key columns
    depend on “nothing but the key”.


    I used a database-interface to “Altium”, which is a Computer-Aided-Design program.
    The interface supplies Altium with a list of electronic components. This table
    can contain hundred-thousands of rows. For each row there is the expected “Component
    Type”, “Unit”, “Value” and other columns, but there are also columns like Manufacturer1,
    Manufacturer2 etc. This violates 1NF. The most annoying consequence was that we
    were limited on the number of Manufacturers (and similar attributes). Probably
    Altium had chosen this layout to make life easy for all those that imported from
    – or continued to use - Excel. It is easy to use a flat excel sheet - at the cost
    of flexibility.'
