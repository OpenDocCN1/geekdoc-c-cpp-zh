  md: "# 4.5 Views\n\nA database-manager can choose to only make certain columns of\
    \ a table accessible for (some) users, by creating a View of the table with only\
    \ the selected columns - and even rename some or all. Programmers work on the\
    \ table via the view, and may think of it as just another table. This is one way\
    \ to use views, where the purpose is limited access or better naming without disturbing\
    \ backward compatibility.\n\nAnother reason for creating views is to simplify\
    \ the client programs. Advanced joins can be written as part of SQL-code embedded\
    \ in your program. Alternatively a view can be created in the database environment.\
    \ This makes all client programs simpler, as they just need to refer to the view\
    \ in the same way as a table. In reality the view is dynamically generated when\
    \ data is requested.\n\nIf a view is based on a single table, it is possible to\
    \ insert, update and delete rows, as if it is a table, and the underlying, real\
    \ table will be updated correctly. However, the view is dynamically created from\
