  md: 'In line 6 a SqlConnection object is created. The tricky thing here is the actual
    connection-string, which we covered in Section 4.8


    The using keyword is a clever standard C# construct, assuring that the object
    created goes out of scope when", and thus leaves us without worries about garbage
    collection. In the case of the SqlConnection it is more complex, ADO.net gives
    us Connection Pooling underneath it all.


    In other words - it may look as if for every (new-query) connection to the database,
    and then close it again. In reality ADO.net manages a pool of open connections
    for us. Nice.


    In line 22 a SqlCommand object is created - here named "cmd". This uses the above
    sql string and the connection object. Again we see the use of "using". Then we
    don''t need to worry about cleaning up after using the SqlCommand-object.


    In lines 24 and 25, the two function input parameters - ProjectID and EmployeeID
    - are used to create SqlParameters, which are inserted into a SqlParameterCollection
    in the newly created SqlCommand object. This is very compact code.


    In line 29 the function ExecuteNonQuery is called on the SqlCommand object.


    All the Sql objects/classes are part of ADO.net.


    The only thing left to say is that we use try-catch to feed errors back to the
    user.


    As stated, the ExecuteNonQuery is almost identical to this INSERT when it comes
