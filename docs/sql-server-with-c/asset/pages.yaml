  md: '# Table 2.2: Important database concepts


    | Name | Meaning |

    | --- | --- |

    | OLTP | On-Line Transaction Processing. As opposed to OLAP. |

    | OLAP | On-Line Analytical Processing. |

    | CRUD | Create, Retrieve, Update and Delete are the main functions of a database.
    |

    | ACID | Atomicity, Consistency, Isolation & Durability. Main features of good
    RDBMS. |

    | Private Key | One or more columns that define a unique row in the given table
    |

    | Foreign Key | One or more columns that together points to a unique row in (typically)
    another table |

    | Normal Form | This is a categorization of how correct the database is structured.
    From non-normalized we step through 1st Normal Form - 1NF - over 2NF, 3NF, 4NF
    and 5NF. Usually we don''t go 3NF because it becomes impractical. |

    | Index | An internal lookup table that speeds up the performance of the database.
    SQL Server creates a few indexes on e.g. Private Keys. |

    | Connection String | A string used in your code to get access to the server and
    database. It can be a pain to get right, although Visual Studio has a good wizard
    for it |

    | SQL | Structured Query Language. This is the “Programming Language” of the database.
    SQL can be kept in the client code, where it is sent to the database to be executed,
    or it can stay inside the database as Stored Procedures. |

    | T-SQL | Transaction SQL. This is Microsoft''s extended SQL - with variables
    and flow-control. |

    | Constraints | Rules that the database will enforce for you. Helps keep the data(base)
    healthy. |

    | Join | Joining foreign and private keys at run-time and selecting relevant columns
    from the resulting “extended table” is the real power of relational databases.
    |

    | Transaction Anomaly | A good database does all or nothing (if an error occurs
    midway through an operation). A poorly designed database can cause anomalies when
    updating, inserting or deleting. |'
