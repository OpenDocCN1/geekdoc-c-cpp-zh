  md: '# 2.6. JOINS


    Note how the output from the join looks very much like an Excel solution in a
    flat table would look from the start. In other words: we start with a flat table,
    which we normalize into several tables. Then we join them back to a flat table.
    The main advantage in the well-normalized database is that it is much easier to
    maintain - no anomalies.


    When doing an (INNER) JOIN we get the Intersection of the tables - only the rows
    where keys match in all the joined tables. To demonstrate the difference between
    (INNER) JOIN and LEFT JOIN we need to start with a table that is not fully “used”
    by the other tables. The Products table is a good example. If an (INNER) JOIN
    is performed again. Note the use of "SELECT *" and how this results in column
    names as in the original tables, and that the keys appear both as primary and
    as foreign keys. Then the same query is done - except this time with a LEFT JOIN.


