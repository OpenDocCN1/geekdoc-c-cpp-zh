  md: '# 1.2 Tools


    All code in the sample as well as all code-snippets and concepts described in
    this book can be created with the help of two Microsoft Tools:


    +   - Microsoft Visual Studio Community EditionnMicrosoft Visual Studio is by
    far the most advanced IDE (Integrated Development Environment) found today. Microsoft
    has a good position in the corporate world, but also aims to become more relevant
    to the "grassroots" and the Open Source community. Years ago Microsoft handed
    the C# language to an independent organ, and now we have the Community Edition
    of Visual Studio - free to use for any single developer as well as certain minor
    organizations.

    The Community Edition is surprisingly powerful and we really don''t need more
    for this book. It runs on Mac OSX. The only programming language used in this
    book is C# - if not considering SQL programming language. With Visual Studio comes
    not only the C# compiler and debugger, but also the class libraries needed. Some
    of the most relevant for databases are ADO.Net and linq.


    +   - Microsoft SQL Management Studio with SQL ExpressnAs stated above, Microsoft
    has the corporate presence, but also to a degree reaches out to the Open Source
    developers. SQL Server now runs on some Linux distributions. It even - optionally
    - runs on Docker. This is a "container" on Linux - which is kind of a lightweight
    Virtual Machine without a guest/host OS.

    SQL Server comes in many editions - from the Enterprise Edition, over the Standard
    Edition to the LocalDB. There is also a Developer Edition which is essentially
    the same as the Enterprise Edition. The Standard and Enterprise SQL Servers are
    not free, but you can get very far with the free Express edition.


    I have not found any functionality in the big SQL Servers that I really miss in
    the Express edition. The main difference is scale: The Express edition "only"
    supports up to 10 GB databases and only utilizes a single CPU¹. makes it a great
    choice for development: it is


