- img_proc: true
  md: '# 5.2. LAYERS AND STATE


    ended with one “library” for interfacing with SQL Server called “DBUtil”, and
    another one for the Oracle export. As this book is about SQL Server, we will focus
    on the first, and show a sample from the latter.


    The UI-layer has classes that are instantiated with the given dialog, and left
    for garbage-collection when the dialog is closed. They only carry transient state.
    The same goes for the DBUtil layer, which mainly serves as a function library.
    It is used for fetching or storing data in the database, but in-between these
    calls it does not keep state. The DBUtil-layer has a number of classes that are
    instantiated and passed to the caller of the static functions. This is also transient
    state. This layer gets assistance from ADO.net - handling connection-state and
    even pooling connections to improve performance.


    Why all this talk about state?


    > IT IS ALWAYS BENEFICIAL TO HAVE A CLEAR IDEA ABOUT WHERE STATE IS KEPT. IF SEVERAL
    LAYERS KEEP OVERL STATE, THERE IS A HUGE RISK THEY ARE GOING TO DISAGREE AT SOMETIME.


    This leads to all kinds of strange behaviors. Better to keep specific state only
    one place. In our case the main keeper of state is obviously the database itself
    - keeping state permanently, even if power is cycled. This is also known as Persistent
    State. Finally, there is also state outside of the database for the duration of
    the client application. This is called Application State.


    Clearly, application state must be preserved somewhere: the identity of the current
    user, the chosen holiday-scheme and whatever sets the user may use. This is kept
    in the Model Layer. This Model layer is implemented as a Singleton class. A singleton
    is a class that always is instantiated exactly once. The singleton pattern is
    practical because it is almost as easy to use from any other class as static functions.
    You do not need to “carry a data-reference around” - you simply invoke the singleton
    when needed. The main reason for the “Model” name is that it contains the most
    complex parts of the Business Model. Table 5.1 is an overview of the layers used
    in TimeReg - from top to bottom.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Table 5.1: Layers in TimeReg Application - Top-Down


    | Layer | State | Function |

    | --- | --- | --- |

    | UI | Transient Dialog | Handle the Look & feel, logic, menus and events for
    each form. |

    | Model | Application | User settings and cached collections |

    | DBUtil | Transient | Helper classes for static functions interface between database
    and Collections. |

    | ADO.net | Connection | ADO implements Connection Pooling and generally keeps
    state for connections. |

    | Database | Persistent | Stores data from all users - always. |


    The most important rule when designing and implementing layers is:


    ANY LAYER MUST NOT “KNOW” ANYTHING ABOUT ANY LAYERS ABOVE IT.


    The database is completely ignorant of the layers above and surely ADO.net knows
    nothing about our code. This is one of the advantages of using a 3rd party party
    library. I believe that the rule also applies for the other layers. There is also
    a secondary layer that says:


    IN A TRULY LAYERED DESIGN EACH LAYER KNOWS ONLY ABOUT THE LAYER DIRECTLY BENEATH
    IT.


    This rule is hard to live up to, and sure enough: in our sample application the
    top UI layer knows the model layer and it knows DBUtil. If this was avoided, we
    would need a lot of functions in the model layer that more or less copied data
    between the layer above and beneath. It did not make sense in this scenario. Incidentally
    - this also applies for the TCP/IP stack where the upper layers know more than
    just the layer directly beneath it..'
