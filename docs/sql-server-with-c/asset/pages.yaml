  md: 'Returning to Listing 10.1, please note the frequent use of –projectsDict– the
    projects dictionary held in the DBUtil layer. This is needed because the SQL behind
    the project-report only returns the ProjectID - not all the attributes of a project.
    This is a flexible solution. As administrators came, the need for additional columns
    in the Project Table grew. With a relative low number of projects it makes sense
    to lookup whatever attributes are needed in a given report, instead of constantly
    modifying the lower level SQL and the Data Transfer Objects that holds data from
    it.


    # 10.2 Importing Data


    Another common task is importing from Excel. In the TimeReg project an import-dialog
    was created - allowing selected users to feed a comma-separated file into a DataGridView.
    If the view looks OK, the data is submitted to the database.


    In this case the file is a list of users, with each line looking like e.g.


    njensen; Niels Jensen; 123456; 6012


    The fields in the file are the given users net, full name, salary number and department.


    This is an easy way to get departments or divisions on board. Someone in the department
    generates an excel sheet with columns as described above, I export to CSV and
    import into TimeReg.


    The code is found in Listing 10.2. Most of the code is input validation - not
    included here to save space, but can be downloaded. In line 3 we once define ’,’
    as separator.


    In line 14 the ’iso-8859-1’ encoding is used. This seems to be the preferred encoding
    used by Excel. It is known as ’Latin-1’, and is very popular in the western world.


    Note that the code allows for two modes: one for inserting new employees, and
    one for updating existing ones. The latter is mainly to be used in organizational
    changes where many users move around between departments.'
