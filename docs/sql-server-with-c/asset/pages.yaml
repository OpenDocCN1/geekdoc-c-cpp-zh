  md: '# 2.1. DATABASE VOCABULARY


    Table 2.1: The SQL Server hierarchy


    | Name | Meaning |

    |---|---|

    | RDBMS | Relational Database Management System - a table-based system with SQL-interface.
    |

    | Server | This can mean the hardware or the SQL Server that runs on it. In this
    book it is the latter. |

    | Database | In daily speak the database is often the same as the server. More
    correctly, a single server hosts one or more databases. In Connection Strings
    you refer to a Catalog. |

    | Schema | Used for grouping tables inside a database - like a namespace in C#.
    It brings the additional ability to have different security schemes inside the
    same database. Generally you can get very far with the default "dbo" schema. |

    | Table | This is the basic entity of a relational database. It is always 2-dimensional.
    The full-name of a table on a given server is <database> . <schema> . <table>>
    |

    | View | A construction within the database that in many ways looks as a table
    to the clients. |

    | Row | This is a row in a table. In an Employees table, one row is one Employee.
    Sometimes called a “Record”. |

    | Column | This is a column in a table. In an Employees table it might be the
    Salary Number. Sometimes called “Field”. |

    | Cell | A specific cell in a table. Sometimes called a “Field”. |'
