  md: '# 4.7. STORED PROCEDURES


    # 4.7 Stored Procedures


    A stored procedure is basically a query where the SQL-text is not part of the
    client program, but instead is stored in SQL Server, together with the database
    and Views etc We see later how ADO.Net attaches the SQL-text, and parameters to
    this, as separate objects in the SqlCommand. When using a stored procedure, we
    still attach the parameters, but instead of attaching the SQL text, we name the
    stored procedure to use.


    Performance-wise this is a little bit faster, because the query is already "compiled"
    into an Execution Plan. If several clients are to use the same database, we can
    put SQL into stored procedures, and thus don''t need to write the same code several
    times. It may also be a good way to split the work in a team.


    There are however, synt differences, and it is yet a thing to learn. This book
    is about SQL Server and C# and we will not go into stored procedures.


