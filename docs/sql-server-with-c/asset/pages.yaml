  md: "# 36\n\n# CHAPTER 2. DATABASE BASICS\n\n![](img/9aee98b7809f9e4bf3647b6ac35a2df7_44_0.png)\n\
    \nFigure 2.4: A Unique Constraint\n\n# Listing 2.9: Create Table with Constraint\n\
    \n```\nCREATE TABLE [dbo].MyProjects(\n    [EmployeeID] [int] NOT NULL,\n    [ProjectID]\
    \ [int] NOT NULL,\n    CONSTRAINT [Unique_MyProjects] UNIQUE NONCLUSTERED\n  \
    \  (\n    [EmployeeID] ASC,\n    [ProjectID] ASC\n) WITH (PAD_INDEX = OFF, STATISTICS_NORECOMPUTE\
    \ = OFF,\nIGNORE_DUP_KEY = OFF, ALLOW_ROW_LOCKS = ON,\nALLOW_PAGE_LOCKS = ON)\
    \ [PRIMARY]\n) [PRIMARY])\n```\n\nThe last type of integrity is Domain Integrity\
    \ when SQL Server is configured to CHECK that values in a column are within a\
    \ specified range. This is pretty much like parameter checking in a program.\n\
    \nThe whole CHECK stuff can be quite confusing. You might actually see text with\
    \ CHECK CHECK.\n\nCHECK enables a constraint while NOCHECK disables a constraint\
    \ that would otherwise automatically be applied.\n\n“WITH CHECK” is used when\
    \ a constraint is added, to tell SQL Server that existing values must also abide\
    \ to the CHECK. If this fails, you will get an error and must sort out the problem\
    \ and try again. “WITH NOCHECK” means that the constraint only applies for new\
    \ values."
