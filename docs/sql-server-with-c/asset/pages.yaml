    personal inventions. Thus, the layer is on one hand tailored to the specific purpose,
    but on the other hand based on patterns that are easily reused. Extending the
    database with new tables and queries is now a routine exercise.


    # 5.2 Layers and State


    One of the major challenges in program-design is to create the right number of
    layers. With too few layers the code gets messy. With too many layers you go through
    a lot of motions that mostly generate heat. It sometimes feels as if the more
    layers you put in - the more advanced and fancy is the design. Of course that''s
    not the case.


    There are many different patterns - Model-View-Control, Model-View-Presenter,
    Model-View-Model etc. TimeReg is a small-one project, and I decided that for the
    UI-part I would simply "go with the flow" and create simple forms that Visual
    Studio facilitates them. This means one class per dialog/screen. I used a simple
    and classic Windows Formsbased approach. I made a fully functional version on
    WPF - Windows Presentation Foundation - but I felt that I lost control and dropped
    it. You may prefer WPF, and you will still be able to use 99% of the patterns
    in this book.


    The major downside of this simple design is that there is no easy to do automated
    testing. Some of the patterns mentioned above test-scripts to "fake it" as real
    users - bypassing only a thin UI-layer. In this project all tests were manual
    - performed on a local SQL Express installation. Regular backups from the production
    server were restored onto its server for tests.


    A completely different alternative to Forms and WPF is to create a Webbased solution
    using ASP - Active Server Pages. This is closer to WPF with its "code behind".
    You can also say that''s just another way of Model-View-Control. I have not tried
    an ASP-version of TimeReg - yet.


    With the application being so database-centric, it was clear that a layer was
    needed that would handle - and isolate - all the database-interactions. Previously
    described, this was not to be a standard Microsoft framework. I'
  merge: -1
