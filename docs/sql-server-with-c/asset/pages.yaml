  md: "# Listing 10.3: Submit Users\n\n```\nprivate void btnSubmit_Click(object sender,\
    \ EventArgs e)\n{\n    if (!chkUpdate.Checked)\n        foreach (DBUTil.Employee\
    \ employee in employees)\n            DBUTil.insertNewEmployee(employee);\n  \
    \  else\n        foreach (DBUTil.Employee employee in employees)\n           \
    \ DBUTil.updateEmployee(employee);\n    // Don't try again\n    btnSubmit.Enabled\
    \ = false;\n}\n```\n\nListing 10.3 shows the simple code needed to submit the\
    \ new or updated users once the super-user has looked at the dialog and accepted\
    \ it. Since the DataGridView was filled from the “employees” list we use this\
    \ list directly. Thus the DataGridView is only written to by the program - never\
    \ read from.\n\n# 10.3 Copy-paste to and from Excel\n\nThere are plenty of scenarios\
    \ where you don't want to import or export whole files from/Excel. In TimeReg\
    \ this is relevant when managers create forecasts in the application. They may\
    \ edit directly in TimeReg - or they might prefer to copy existing data to Excel,\
    \ edit here and copy back to TimeReg.\n\nThe wiring-up of popup-menu events is\
    \ shown in Listing 10.4. This ensures that the user via the menu can activate\
    \ the two functions “pasteCTRLV-ToolStripMenuItem_Click” and “copyCTRLToolStripMenuItem_Click”.\
    \ The user gets a reminder about the use of CTRL-V and CTRL-C as, text-strings\
    \ are also shown in the popup-menu.\n\n# Listing 10.4: Setting Up Events\n\n```\n\
    deleteToolMenuItem.Click += deleteToolMenuItem.Click;\npasteCTRLVToolMenuItem.Click\
    \ += pasteCTRLVToolMenuItem.Click;\npasteCTRLVToolMenuItem.ShortcutKeyString =\
    \ \"Ctrl+V\";\ncopyCTRLToolStripMenuItem.Click += copyCTRLToolStripMenuItem.Click;\n\
    copyCTRLToolStripMenuItem.ShortcutKeyString = \"Ctrl+C\";\n```"
