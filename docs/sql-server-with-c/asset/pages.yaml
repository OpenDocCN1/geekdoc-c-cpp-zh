    system against something failing “midair” which could lead to inconsistent data
    - hence the focus on transactions in OLTP. This is not so relevant in OLAP, where
    the focus is on fast and efficient reads on more static data. Writing may not
    take place at all.


    You can also say that OLTP is for daily business - executing the current strategy,
    while OLAP is for analyzing historical data and thus helps create tomorrows strategy.
    A company may use traditional OLTP in sales & production. Later data is copied
    to an OLAP system where it is not normalized (we will get back to this shortly).
    Here it is analyzed for more strategic purposes.


    Traditional RDBMS’s like SQL Server, Oracle and MySQL are all of the OLTP kind.


    # 2.4 Keys


    When a database is in First Normal Form (INF) or higher, each row is unique as
    we will see when we discuss Normalization. The Private Key in a table is the single
    thing needed to define & find a unique row. When the private keys from table A
    are used in table B they are said to be Foreign Keys in table B. This is because
    they refer back to table A. The private/foreign key Relationship is the main vehicle
    of Joins.


    # 2.4.1 Management Studio and Keys


    Figure 2.1 is generated with the help of Management Studio’s diagram function,
    on a web-shop database called “Shop”. This is called Entity-Relation (ER) diagram,
    simply tables are entities and the keys provide the relations. Here the names
    of the columns are written horizontally - more practical for text. I have given
    the auto-generated diagram a little help by moving the endpoints of all private/foreign
    key relationships to the relevant column-names. Each relationship has a (yellow)
    key at the private key end, and an “infinity symbol” (∞) at the foreign key end.
    This signifies a one-to-many (1:n) relation - in other words that a specific key
    value can occur only once as a private key, but many times as a foreign key.'
