    basic concept in Dapper is that you write data-classes - pretty much like the
    ones in this chapter. Dapper takes the role of an ADO SqlConnection class by extending
    its IDbConnection interface with e.g. a Query method. This new method takes your
    data-class as a template. Thus, instead of writing specific functions like I have
    shown earlier, it is possible to write much more condensed code like Listing 8.3
    - where “conn” is an SqlConnection:


    It is even possible to escape the templated class and instead use “dynamic” objects.
    This can be handy for simple “hipshot” test-scripts, but most will probably prefer
    the typed approach.


    Dapper basically only supports SELECT, but there are 3rd party extensions supporting
    DELETE, UPDATE and INSERT. Obviously this brings us close to the aforementioned
    maintenance-nightmare, but there is a certain beauty in the "Dapper” approach.'
