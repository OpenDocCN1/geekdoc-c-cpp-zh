  md: '7.6. ORACLE MANAGED DATA ACCESS


    # 7.6 Oracle Managed Data Access


    I have stated many times that Oracle Managed Data Access is modeled after ADO.Net.
    This means that coding against Oracle is not much different from coding against
    SQL Server - at least when the previously shown patterns are used.


    Listing 7.5 is a proof of this statement. It is a simple query, SELECT the interesting
    columns of all projects in the relevant Oracle table. The fact that this table
    - apps.comp_projects - actually is a View, changes nothing. The SQL statement
    in lines 3 and 4 is exactly the same as it would be in SQL Server. This is because
    it is a SELECT - an INSERT e.g. looks a bit different from the ones we have seen.


    In line 7 we see the usual “using” - creating a Connection object, with the help
    of a defined connection-string. In lines 26-28 we open a Command object on the
    Connection object. Again this is “packed within a using statement”. In line 33
    we ExecuteReader on the command object. In line 34 we loop on this reader, accessing
    strings and DateTime objects by indexes that originates from the position in the
    SQL text. In between, exceptions are handled - should they arise.


    The above description completely matches that of a similar use of ExecuteReader
    in ADO.net. Looking at the code the only difference is that instead of the ADO
    objects we now use objects from Oracle’s ManagedDataAccess namespace.'
