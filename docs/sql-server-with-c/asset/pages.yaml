  md: '# 2.8. INTEGRITY AND CONSTRAINTS


    As stated, we sometimes want to enforce uniqueness on one or more columns that
    are not part of a key.


    I will go a little ahead of myself and use an association table called “MyProjects”,
    that is created as part of the TimeReg project as an example. In this table we
    have rows that contain two foreign keys - one is ID for Employees and the other
    for Projects. Any employee can work on any project - but it only makes sense to
    have one row for any relevant combination. We want the database to enforce this
    constraint.


    This is a hard little to find in Management Studio - and not very logical, since
    you end up with something in the object tree under keys and indexes - not under
    constraints. Lets walk through it:


    +   ① Right click on the table where you want the constraint.

    ② Select Design in the popup-menu.

    ③ Right click left to the table in the Designer - where you also select and keys.

    ④ In the popup-menu select “Indexes/keys...".

    ⑤ A dialog appears - see Figure 2.4. In this dialog, change the Type from “Index”
    to “Unique Key”. Although it is called “Unique Key” it is not what we normally
    call a key.

    ⑥ You may also change the name - “Unique_MyProjects” is used in the figure.

    ⑦ Click on the next field to Columns and an ellipsis (...) appears. Click on this
    and now the “Index Columns” dialog appears.

    ⑧ Now select the columns that together must be unique.

    ⑨ OK, Close and Save.


    To see the consequence of the above, we can ask Management Studio to “Script the
    table”. The resulting T-SQL is found in Listing 2.9. Aside from the long list
    of defaults given, the syntax is not hard to understand. Note that the foreign
    key constraints are not shown here.'
