  md: 'As described earlier - when doing an INNER JOIN we get the intersection - the
    rows where keys match in all the joined tables. In the original tables there were
    no NULL values in the (inner) joined table. With the LEFT JOIN we get all rows
    from the Products (left) table, with matching rows from OrderItems (right) table.
    Since there are Products that are not sold, the corresponding rows now contain
    NULL values for the OrderItem columns.


    We also see that the rows are common to both outputs are not in the same order.
    SQL guarantees nothing about row order - unless you specify it. We will see this
    in Chapter 4.


    # 2.7 Data Types and NULL


    2.18 shows the most common data-types used in T-SQL. There are four types of strings
    - with and without unicode, and with fixed or dynamic spacing. The reason for
    the strange ''n'' in e.g. "nchar" is that it originally meant "National" chars.
    The real type corresponds to a classic float in C-type languages, whereas the
    T-SQL "float" (without a size-specifier) corresponds to a C-type double.


    Later we see that the TimeReg sample uses the datetime format a lot. That might
    not come as a surprise, however datetime takes up 8 bytes for every timestamp,
    where 3 is enough for storing a relevant date without time. When I designed the
    physical layer (we will get back to this in Section 3.4) it was not clear whether
    a need to compare timestamps on the same date would arise, so I went for the safe
    solution. This has influenced the C# code we will, and a clean-up is probably
    not going to happen.


    We know zero-values like empty string and the value 0 for an integer. These are
    legal values specific for the type. This is different from NULL, which is "missing"
    or "unknown" value - much like a null-pointer in OOP. NULL is necessary in the
    following scenarios:


    +   An outer JOIN as we saw earlier in Table 2.17. In this case we extend existing
    rows with columns from another table. In e.g. the LEFT JOIN we will have rows
    in the left table without matching values in the right table - but we want to
    show something NULL'
