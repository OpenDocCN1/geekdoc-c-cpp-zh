  md: '# 9.2. DATAGRIDVIEW


    # 9.2.3 Edit in Grid


    There are several severe event-handlers for the grid. One handler looks for a
    right-mouse click and allows the user to key in comments when this happens. Another
    is to filter out unwanted characters in the input from the user, when actually
    editing. These and other handlers are not shown here to save space - but can be
    downloaded with the rest.


    However, the main event-handler is shown in Listing 9.7. The function is named
    grid_CellValueChanged and is called whenever the user leaves a cell within the
    grid after having edited it. The use of “suspendCellValue” is explained in the
    previous subsection.


    In line 9 and 10, the current cell''s row and column indexes are read. This is
    much easier than performing a hit-test. In line 14, empty strings are converted
    into the value 0. The model-layer will interpret a value changed as 0 as a SQL
    DELETE in the function updateDatabase.


    Since this grid is the only part of the application that is used by many people
    on a daily basis, it must easy to use. Hours are simply entered as normal decimal
    numbers. However, in Denmark the official decimal separator is “”, while programmers
    often use “” - and we also have people stationed in other countries. To avoid
    people getting error-messages all the time, the code must be forgiving and allow
    the user to use whatever he or she likes.


    After some time a user asked me, if he could enter time as hours:minutes. So this
    was also introduced - again by adapting to the input, as seen in line 21.


    In line 71 we bail out if nothing is really changed. Beginning in line 81 the
    hours are accumulated and written. All sums are re-calculated. For performance
    reasons we might consider only updating the current column and the total, but
    it isn''t worth the risk of doing sums in two different ways.


    In line 87 the Dirty flag is set. After this the Cancel and Submit buttons are
    updated. Since the dirty flag is set, they will be active and colored (they might
    have been already before). Finally we clear the suspendCellValueChanged flag.'
