  md: '48 CHAPTER 4. SQL


    You can find a lot of details on SQL and T-SQL on the internet. One of the best
    places is “w3schools.com”. This shows all the generic SQL commands as well as
    specific T-SQL for SQL Server. In this text we will walk through some samples,
    to get a general understanding.


    # 4.1.1 Parameters


    The samples are taken from the database-interface layer that we will dig further
    into Chapter 7. Here all SQL-statements are built as C# strings. I have removed
    the C# string stuff in the following listings to focus on the T-SQL. I have kept
    the “parameters”. These are variable names that start with a “@”. We shall see
    later that these parameters are not substituted in the C#-string before it is
    handed to SQL server. Instead the parameters are handed over separately in a Command
    object. This improves security - especially when strings originate from the user.
    In such a case, a bandit could supply a full nasty SQL-injection. This is not
    possible with parameters. As a bonus it. It is important to use this syntax when
    getting to use parameters. As a bonus it also makes it clearer which part of the
    SQL that is input from the application. Note that it is perfectly legal to use
    names for parameters that are identical to the relevant column-names.


    Another name for the use of parameters is Binding. Whenever SQL Server receives
    an SQL-statement it is “compiled” into an Execution Plan. This is cached, and
    if SQL Server later runs into the same SQL Statement, it will reuse the execution
    plan. However, the textual SQL statement must be exactly the same, whereas parameters
    may differ without triggering a new execution plan. Naturally, parameters are
    typically where changes are likely found, so binding, or using parameters, can
    greatly enhance performance. We will get back to execution plans when we discuss
    Indexes.


    # 4.1.2 SELECT


    Listing 4.1 is a simple SELECT that should return exactly one row from “Projects”,
    and only the “Name” column from this. The limiting factor is the WHERE clause
    which filters the answer and only gives us that'
