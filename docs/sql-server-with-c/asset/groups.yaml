    }\n\nprivate void filterByCategory(string category)\n{\n    // 为了简洁，省略了实现部分\n\
    }\n```\n\n### 列表 9.12：数据网格填充器\n\n```cs\nprivate void updateTotalPerReport()\n\
    {\n    if (cmbCategories.Text == \"All\")\n    {\n        reportData = model.GetAllReports();\n\
