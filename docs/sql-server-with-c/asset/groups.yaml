    - You cannot mark non-existing cells for copy. In other words, the copy always
    works on a square of existing cells. This is simple to handle for the standard-code
    in the DataGridView. A paste however, may be performed on e.g. the bottom line
    and create a need to add new lines to have something to paste into.


    - When we copy from the application, the DataGridView will supply the visible
    contents of the cells. If these contain project-names and employee-names (which
    the leftmost columns do), the text is copied back to Excel as is. This is what
    the user expects. However, when we paste back into the DataGridView, we may need
    to change the text back into a ProjectID and an EmployeeID. This is because these
    fields are not usual text-fields, but drop-down boxes that allows managers per
    row - to select project and employee. Going further into this will take us too
    far away from the copy-paste theme in this section.


