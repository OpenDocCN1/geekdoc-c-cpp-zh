    The lines starting with “SET”, as well as the assignments in the “WITH” part,
    contain a number of defaults. We see e.g. that if a row is updated, SQL Server
    will lock access to it from other users. This is one way to handle the “Atomic”
    requirement in ACID. Locking-strategies are an important part of database implementations,
    however, we can go very far with the defaults.


    # 2.5.3 Anomalies


    If we decide to avoid abbreviations and change “Adv. Physics” to “Advanced Physics”,
    we will need to update in several places. This is an Update Anomaly. Also, should
    John Grey decide to quit, we have no traces of the class in History anymore. This
    is a Delete Anomaly. Finally, if we want to introduce the class “Religion” we
    have to wait for a student taking this class before we can introduce it. This
    is an Insert Anomaly.


    In my experience, programmers are very aware of the Update Anomaly. Programmers
    hate repeated text-strings. We long to define them “constant” in one way or another.
    This instinct also helps a little with the other anomalies.


    # 2.5.4 Association Tables


    There are situations where the programmer’s normal thinking is no help. We tend
    to work with collections, and collections of collections. That is how databases
    are designed. Take the Shop system from Figure 2.1. A programmer with no database
    experience would think that an Order has many OrderItems. 1NF tells us that we
