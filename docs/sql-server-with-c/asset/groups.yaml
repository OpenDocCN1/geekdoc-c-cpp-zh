    \ Test | 201703 | 1 |\n| 69 | 73 | 121 | FPGA Test | 201704 | 1 |\n\n创建预测后，我们想在\
    \ Power BI 中显示它们。自定义格式与该工具不兼容。为了让 Power BI “正常”读取时间戳，创建了一个视图。这在 Management Studio\
