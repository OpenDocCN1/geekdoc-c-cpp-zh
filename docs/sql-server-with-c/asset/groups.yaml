    | datetime | DateTime | 8 Bytes. Year 1753-9999 & fractions of seconds. |

    | datetime2 | DateTime | 6-8 Bytes. Year 1-9999 & fractions of seconds. |

    | char(n) | Byte Array | n bytes fixed storage. Note that by default strings are
    padded with spaces. Used bytes (max n) + 2 dynamic storage. |

    | varchar(n) | Byte Array | May use less space than char, but slower to address.
    2*n fixed storage - padded with spaces. |

    | nchar(n) | String | 2*(used bytes) + 2 dynamic storage. May use less space than
