    \n## 4.4. 索引\n\n索引通常是为了更快的搜索而创建的。正如提到的：SQL Server 开箱即用。基本上它只是为键创建索引。这是合理的，因为这些键被用于连接（joins）。一个表可以有多个索引，但只能有一个是聚集的（clustered）。聚集索引根据为索引所选的列来组织表。其逻辑结果是所有其他索引都是非聚集的（non-clustered）。\n\
