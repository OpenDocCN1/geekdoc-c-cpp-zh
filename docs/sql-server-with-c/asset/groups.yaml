    ## 4.7. Stored Procedures


    A stored procedure is basically a query where the SQL-text is not part of the
    client program, but instead is stored in SQL Server, together with the database
    and Views etc. We see later how ADO.Net attaches the SQL-text, and parameters
    to this, as separate objects in the SqlCommand. When using a stored procedure,
    we still attach the parameters, but instead of attaching the SQL text, we name
    the stored procedure to use.


    Performance-wise this is a little bit faster, because the query is already "compiled"
    into an Execution Plan. If several clients are to use the same database, we can
    put SQL into stored procedures, and thus don''t need to write the same code several
    times. It may also be a good way to split the work in a team.


    There are however, syntact differences, and it is yet a thing to learn. This book
    is about SQL Server and C# and we will not go into stored procedures.


    ## 4.8 Security and Connection Strings


    For many years the way to setup a connection to a database has involved a Connection
    String. Probably because this is more language independent than e.g. a structure.
    Here is an example:


    ```csharp

    private static string TestLocalConnectionStr = "Data_Source=localhost\sqlexpress;Initial_Catalog=TimeReg;Integrated
    Security=True";

    ```


    - **Data Source = XXX**

    The Data Source is the server to connect to. In the example a server named "sqlexpress"
    on "localhost" (this PC) is used. This is the default name for an SQL Express
    installation.


    - **Initial Catalog = YYY**

    The Catalog is the name of the database on the server selected. In the example
    it is called “TimeReg”.


    - **Integrated Security = ZZZ**

    When “Integrated Security” parameter is set to “True”, the connection uses Windows
    Authentication. Thus, if the user has read and write access rights on the given
    Server+Catalog, he or she can use any of the CRUD commands. If the Integrated
    Security is set to False, the string must contain another way to authenticate.
    Integrated Security is generally considered the safest choice.


    The above three parameters are a “minimal set” - there are many others.


    As stated, the use of a connection string is the traditional way, but it is actually
    possible to work with structures, using `ConnectionStringBuilder`. With this we
    can get/set value-pairs with a classic “member” syntax in lines 3+4 in Listing
    4.12. Alternatively we can use indexers - as lines 6+7.


    ### Listing 4.12: ConnectionStringBuilder


    ```csharp

    1 SqlConnectionStringBuilder builder =

    2     new SqlConnectionStringBuilder(GetConnectionString());

    3 builder.Password = "CrispyChip"

    4 builder.AsynchronousProcessing = true;

    5

    6 builder["Connect_Timeout"] = 2000;

    7 builder["Trusted_Connection"] = true;

    ```


    In the connection-string we use integrated security. Alternatively we might write
    `User ID=TimeRegUser; Password=myPassword`. This is e.g. used with SQL Server
    Authentication.


    Figures 4.3 and 4.4 shows how a user is created using Management Studio.


    - In the Object Explorer there is a “Security” node on the same level as the Catalogs.
    As the figure shows, there is also a “Security” node under the Catalog. Click
    to expand the tree below this.


    - Right click on “Logins” and select “New Login ...”.

