    ## 4.3. Learnings on CRUD


    From the few examples we can deduce a number of rules of thumb:


    - SELECT statements can become quite complex, especially when reports with aggregated
    numbers are needed. This is in line with the discussion on OLTP versus OLAP. This
    database is not tailored specifically towards analysis, so when this is needed,
    things become more complex.

    - DELETE, UPDATE and INSERT typically are rather simple. This is what OLTP excels
    in.

    - Where SELECT may return thousands of rows, the DELETE, UPDATE and INSERT typically
    operate on a single row. Once in a while you may need to do maintenance - in our
    sample it moves from one to another. In such a case UPDATE is typically used on
    several rows.

    - The WHERE clause must not be forgotten in DELETE and UPDATE - all existing rows
    are affected.

    - Use Index to get updated value.


    ## 4.4. Indexing


    Indexes are generally created for faster searches. As stated earlier: SQL Server
    does job out of the box. Basically it simply creates indexes for keys. This makes
    sense as these are used in joins. A table can have many indexes, but only one
    can be clustered. A clustered index organizes the table according to the column(s)
    selected for the index. The logical consequence is all other indexes are non-clustered.


    It is possible to overdo indexing. Small tables are faster without index. Any
    change in a table (UPDATE, INSERT or DELETE) requires an update of the relevant
    indexes. SQL Server makes best use of its indexes and lookups when many rows are
    addressed by the same statement. Thus indexes really shine when it comes to large
    tables, mainly used in SELECT. When deciding which columns to include start is
    to look at the WHERE statements in your queries. Columns here are good candidates.
    For Time application I want the developers to be fast, in order not to demotivate
    them. On managers queries can wait. These queries are rare, and more rewarding.
    The conclusion seems to be: no extra indexes.


    However, all updates start with the SELECT of the current week. This is data for
    a specific range¹, so would it make sense to create an index on these?


    Let us test Management Studio’s nice display of the Execution Plan. As described
    earlier, when SQL Server receives a new query it compiles into an Execution Plan.
    When a query is visible you can press CTRL-M or select “Query” in the main menu,
    then “Include Actual Plan”. Then press F5 to run the query.


    When a third output appears after “Results” and “Messages”, named “Execution Plan”.
    This is shown in Figure 4.1. Let’s take a look at the query in the top window.
    The query starts with CHECKPOINT DROPCLEBUFFERS. Together these ensure that the
    query starts from a clean sheet with nothing in memory from the previous run -
    e.g. “compiled” statements. After these commands we see:


    ```

    SET STATISTICS TIME ON

    SET STATISTICS IO ON.

    ```


    ¹Whether the BETWEEN command is for a range, or two comparisons, makes no difference.


