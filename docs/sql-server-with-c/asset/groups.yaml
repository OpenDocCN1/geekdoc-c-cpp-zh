    # Chapter 4


    # SQL


    # 4.1 Introduction to SQL


    Typically when people talk about SQL-statements they mean queries like the SELECT
    that we have already seen in some examples when discussing JOIN. SELECT together
    with UPDATE, DELETE and INSERT constitutes the “Data Manipulation Language”. We
    have seen them bundled together as CRUD in Chapter 2. We have also seen some commands
    used for creating and deleting tables and databases - like CREATE, ALTER and DROP.
    This is the “Data Definition Language”. These two groups of commands are the most
    important in this book, but altogether there are four groups - as shown in Table
    4.1.


    Table 4.1: T-SQL Language Groups


    | Term | Meaning | Examples |

    |---|---||

    | DML | Data Manipulation Language | SELECT, UPDATE, DELETE, INSERT |

    | DDL | Data Definition Language | ALTER, CREATE, DROP |

    | DCL | Data Control Language | GRANT, REVOKE |

    | TCL | Transactional Control Language | COMMIT, ROLLBACK |'
