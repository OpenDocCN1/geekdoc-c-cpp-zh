    ## 第一章

    ## 引言


    ## 1.1 本书将带你了解什么


    如果你计划编写一个数据库应用程序，但在此之前几乎或没有经验，那么会有很多问题：


    - 什么是 RDBMS - 它与数据库有何区别？

    - 如何选择合适的数据库 - SQL Server 处于什么位置？

    - 他们说 SQL Server 是 OLTP 类型的。这意味着什么 - 替代方案又是什么？

    - 我如何创建数据库及其数据表 - 特别是关系？

    - 在理解上述内容后 - 我如何在“良好”的设计中实现它？

    - 应用程序呢？它是如何分层的？

    - ADO.net 在这一切中处于什么位置？

    - 那些让一切最终能够正常运行的小技巧又是怎么处理的？

    - 我如何将数据导入 Excel - 最好是不使用额外的程序库？

    - 给我看看代码！


    ## 第 1 章 引言


    希望你会发现这些问题以及许多其他问题都得到了解答。有很多工具可以带你达到某个程度，但如果没有更深层次的理解，你就会开始绕圈子，基于存的假设进行修改。本书的目标就是提供这种理解。尽管书中没有练习，但你可以使用微软官方工具进行“跟随编码”——参见第
    1.2 节。


    为了便于阅读，排版格式如下：


    - 项目列表如所示，而顺序列表从 ① 开始编号。

    - 数据库中的表、列等使用 PascalCase（大驼峰命名法）。

    - C# 变量和函数使用 camelCase（小驼峰命名法）。

    - 粗体用于本地首次出现的关键词。

    - 小型大写字母（SMALL CAPS）用于强调性语句。

    - 普通表格用于数据库表和其他计算输出。普通表格在各处都有垂直和水平的单线分隔线。与此相反，作者编写的表格没有垂直线，而是使用了加粗表头和其他格式。

    - 标准标题。这意味着标题位于图片下方，但在代码列表和表格上方。

    - 章节、小节和子节均有编号。

    - 框中的代码和内联代码如：

    `SELECT ProjectID FROM Projects Name = ‘Vacation’`

    SQL 代码采用“紧凑型”格式以节省空间。你可以查看许多免费的在线格式化工具。


    ## 1.2 工具


    示例中的所有代码以及书中描述的所有代码段和概念都可以借助两个微软工具来创建：


    - **Microsoft Visual Studio Community Edition（社区版）**：Visual Studio 是现今发现的最先进的
    IDE（集成开发环境）。微软在企业界拥有良好的地位，但也旨在变得对“草根”和开源社区更具相关性。几年前，微软将 C# 语言交给了一个独立机构，现在我们有了
    Visual Studio 社区版 - 任何个人开发者以及某些小型组织都可以免费。社区版强大得惊人，对于这本书来说我们真的不需要更多。它可以在 Mac OSX
    上运行。书中使用的唯一编程语言是 C# - 如果不 SQL 编程语言的话。Visual Studio 不仅带有 C# 编译器和调试器，还有所需的类库。与数据库最相关的有
    ADO.Net 和 linq。


    - **带有 SQL Express 的 Microsoft SQL Management Studio（SSMS）**：如上所述，微软拥有企业影响力，但在某种程度上也接触开源开发者。SQL
    Server 现在运行在某些 Linux 发行版上。它甚至（可选地）运行在 Docker 上。这是 Linux 上的一个“容器”——类似于没有客/主机操作系统的轻量级虚拟机。SQL
    Server 有许多版本 - 从企业版、标准版到 LocalDB。还有一个开发者版，它本质上与企业版相同。标准版和企业版 SQL Server 不是免费的，但你可以使用免费的
    Express 版取得很大进展。我没有在大型 SQL 服务器中发现任何我真的在 Express 版中感到短缺的功能。主要区别在于规模：Express 版“仅”支持高达
    10 GB 的数据库，且仅利用单个 CPU¹。这使其成为开发的极佳选择：它是


    > ¹在撰写本文时：最大 4 核心，最大 1410 MB 池缓冲区大小和最大 352 MB 列存储段缓存。


    准备好迁移到 SQL Server 了。这实际上使其在小规模的实际部署中也成为一个很有趣的候选者。


    LocalDB 与其他版本不同之处在于，它不作为单独的服务运行。相反，它可以作为应用程序的一部分直接运行。许多用户可能在同一台 PC 上运行他们各自的实例。这使得它的行为更像是
    **MS Access** 的强力版本。


    最后，**Azure SQL** 的模型与 SQL Server 非常相似，甚至你在书中学到的知识也可以应用于 Azure SQL。


    通过安装，我们得到的不仅是服务器，还有用于 SQL 开发的 IDE，其方便的名称是 **Microsoft SQL Server Management Studio**。即使缩写为
    MSSMS，这个名字也很难。好处是，一旦安装，你只需按下 Windows 主页并输入“SQL”即可找到它。在书中我们使用较短的形式“Management Studio”。


    第三工具 - 不是微软的，但强烈推荐 - **是 git**。本书不是关于源码控制的。然而，你不应该在没有源码控制的情况下编写代码。这就是 C# 和版本控制系统存储的地方。好处是它是这样的。


    ## 1.3 Timereg 示例


    在书中，我们将使用一个现有的应用程序作为示例 - 这是一个名为 Timereg 的注册系统。该示例用于 C# 部分。通常只有经理才喜欢用它来控制管理质量。经理可能某天说
    A 项目优先级最高，而第二天又说 B 项目优先级最高。有了时间注册系统，真相将大大白。在这里你可以看到哪个任务或项目目标优先级最高。它对于项目经理或开发者来说可能也是一个很好的工具，因为他们可以说：“我们没有把计划的投入到这个项目中，因为我们必须在任务
    X 上花费大量时间”。如果你在项目中计算速率（Velocity），时间注册也是一种帮助。因此，在某些方面，例如未达到目标的负担现在由管理层共同承担 - 正如该是这样。


    ![aee98b7809f9e4bf364ac352df7_13)


    | 项目 | 3月19日周一 | 3月20日周二 | 3月21日周三 | 3月22日周四 | 3月23日周五 | 3月24日周六 | 3月25日周日 |

    |---|---|---|---|---|---|---|---|

    | Vacation (假期) | | | | | | | |

    | Earth (地球) | | | | | 1 | | |

    | Jupiter (木星) | | | | | | | |

    | Enceladus (恩土卫二) | 2 | 3 | 2 | 4 | 4 | | |

    | Mars (火星) | | | | | | | |

    | Saturn (土星) | | | | | | | |

    | Enclosure (围栏) | 6 | 6 | 6 | | 2 | | | |

    | Sum (总计) | 8 | 9 | 8 | | 7 | 0 | | |


    图 1.1：生成的主界面


    1.1 显示了实现示例程序的主界面。它看起来非常简单，而且确实如此 - 特别是你只需要输入小时。图中显示的屏幕是所有用户在需要输入小时时所看到的界面。这个主工作流是我们密切关注的，但实际上还有许多其他屏幕和工作流。我们将检查其中一些，但并非全部。


