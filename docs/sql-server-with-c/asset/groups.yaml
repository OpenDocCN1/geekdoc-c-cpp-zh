    # 9.2.2 Update Grid


    A central function is updateGridFromTable - see Listing 9.6. This function is
    called whenever we need new data from the database. Thus it is called when the
    page is first shown (after initialization), but also when the user moves to another
    week, or decides to cancel existing entries. It is also called if the user has
    updated his list of projects or has switched database. If the user is a superuser,
    he or she might “alias” as another user to fill in missing data, in case we also
    need updateGridFromTable. This function takes as input the relevant Monday of
    the week to fetch, and in line 12 calls the relevant function in the Model - selectWinCounter.
    This fills the “locallist” from the database as we saw in Chapter 6.


    The basic functionality of updateGridFromTable is not hard to follow, and the
    comments help. There are however, tricks that might need some explanations:


    In line 8 the class flag suspendCellValueChanged is set to true. The grid is wired
    up to call an event-handler grid_CellValueChanged whenever the user has updated
    a again. It is also called when a cell value is programmatically changed. As we
    will see in Subsection 9.2.3, this eventhandler may cause changes to the contents
    of the same or other cells (sums) - which fires the same event-handler again.
    The code is not re-entrant so this could easily get some nasty effects - apart
    from wasting a lot of CPU cycles. The event might also get triggered our updateGridFromTable
    is run, which can also get problems. The flag suspendCellValueChanged is introduced.
    It is set to true when entering either of these functions, and set back to false
    when leaving. If the flag is already set when entering the eventhandler does nothing.
    An alternative is to remove the eventhandler instead of setting the flag, and
    re-install instead of clearing the flag. It is also possible that Microsoft has
    a disable flag somewhere that I haven''t found; once a problem is solved you don''t
    search so hard for alternative solutions.


    In lines 58 to 64 the grid’s autosize parameters are stored before they are disabled,
    and in lines 130 and 131 they are set back to their original values. This speeds
    up the update of the grid.


    Notice the “Magic Numbers” for the index of various weekdays and counters based
    on these. Hard-coded numbers are normally considered'
