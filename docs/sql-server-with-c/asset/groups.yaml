    \n可以在查询中嵌套查询。这被称为子查询（Subqueries）。你还可以进一步——使用公用表表达式（Common Table Expressions）。该名称通常缩写为\
    \ CTE。CTE 可以完成子查询能做的任何事情，此外它是递归的。许多人认为 CTE 比子查询更具可读性。在这里跳过子查询。\n\n在 CTE 的第一部分，创建一个命名的临时表——类似于视图。这部分以“WITH”开头，以及临时表的名称——通常使用“CTE”。在\
    \ CTE 的第二部分，临时表可以使用多次——就像任何其他表一样。如前，TimeReg 项目可以是其他项目的子项目。在 TimeReg 的“报告”部分，需要来自子项目的汇总小时数——以及父项目上的小时数。列表\
    \ 4.11 显示了此处的 CTE（固定日期）。\n\n### 列表 4.11：公用表表达式\n\n```sql\nWITH CTE AS (\n  SELECT\
    \ Year(main.Date) AS Year, Month(main.Date)\n  AS Month, projects.ProjectID, projects.Parent,\
    \ main.Hours,\n  CASE WHEN projects.Parent > 0 THEN projects.Parent\n  ELSE projects.ProjectID\n\
    \  END SuperProj\nFROM projects\n  INNER JOIN Main main\n  ON main.ProjectID =\
    \ projects.ProjectID\n  WHERE main.Date < '2018-04-1' AND main.Date >= '2018-01-1'\n\
    )\nSELECT SuperProj, Year, Month, ROUND(SUM(Hours),0) AS Total\nFROM CTE\nGROUP\
    \ BY SuperProj, Year, Month\nORDER BY SuperProj, Year, Month\n```\n\n在第一部分，临时表中创建了一个“SuperProj”列。如果存在，它是父项目的\
    \ ProjectID。如果不存在，该项目本身就是父项目。\n\n第一部分现在连接连接项目与 Main 表以获取 Hours。因此，我们得到了每个项目的所有小时数，并与\
    \ SuperProj 一起传递给第二部分。\n\nCTE 的第二部分从第12 行开始。它负责根据 SuperProj、Year 和 Month 进行聚合和分组/排序。将此方案与\
    \ 4.2.2 节中的方案比较时，我们发现 CTE 在分组时也减少了我们需要关注的列。\n\n执行列表 4.11 中的代码时的输出见表 4.6。请注意存在缺失条目。例如，SuperProj\
