    \ = OFF, ROW_LOCKS = ON, PAGE_LOCKS = ON)\nGO\n```\n\n这里是脚本的输出：\n- 第一行是“USE Students”。它定义了数据库。\n\
    - 后面是“GO”。它是可选。\n- 接着是“CREATE TABLE [Students]”。这允许我们创建表。\n- 后面是“[]”。这些是分隔符。\n\
