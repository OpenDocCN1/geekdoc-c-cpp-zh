    \n## 2.5.3 关联表\n\n在某些情况下，程序员的常规思维没有任何帮助。我们倾向于处理集合，以及集合的集合。这就是设计的方式。考虑图 2.1 中的商店。没有数据库经验的程序员会认为一个\
    \ Order 有多个 OrderItems。1NF 告诉我们不能在 Orders 表中拥有 OrderItem、Order2 等列。程序员的直觉是有一个\
    \ OrderList 的引用 - 另一个表。不幸的是，这意味着 Orders 中的每一行都应该有自己的 OrderItems 表 - 随着订单的创建而动态创建。这就是程序处理集合的方式，但不是数据库组织的方式。\n\
    \n相反，关系被颠倒了，我们有一个巨大的 OrderItems 表引用 Orders 表和 Products 表。这种处理多:n 关系的方法被称为关联表。关联表只有外键行\
    \ - 没有主键。可能会出现非键列如我们的 Quantity。注意有时关联表被称为中间表。\n\n## 2.5.4 学生数据库 3NF\n\n使用关联表也是我们学生案例的解决方案。我们现在不是一个单表，而是三个表\
    \ - 参见表 2.8、2.9 和 2.10。StudentNo 和 ClassID 分别是这些表中的第一个和第二个表的主键，而它们在第三个表中都是外键。\n\
    \n"
