    让我们仔细观察报告对话框。这在图 9.1 中所示。\n\n![](img/9aee98b7809f9e4bf3647b6ac35a2df7_127_0.png)\n\
    \n报告对话框通过以多种方式使用单个 DataGridView 将其与其他对话框区分开来。这本身并不困难，但在处理根据各种单选按钮、下拉框更新此网格的众多“if-then-else”逻辑时，很容易迷失方向。这个问题通过使用以下模式来解决：\n\
    \n### 列表 9.10：单选按钮处理程序\n\n```cs\nprivate void rdBtnTotalPerEmp_CheckedChanged(object\
    \ sender, EventArgs e)\n{\n    if (((RadioButton) sender).Checked)\n    {\n  \
    \      lblCategories.Enabled = cmbCategories.Enabled = true;\n        reCalculate();\n\
    \    }\n}\n```\n\n## 第 9 章. UI 设计\n\n每个单选按钮都有一个处理程序，只有当按钮被选中时才会执行操作。因此，我们不需要关心所有变为取消状态的按钮。处理程序负责开启与特定场景相关的其他\
    \ UI 元素，同时也关闭那些不相关的元素。当用户要求查看每个项目、每个员工的总工小时数报告时，会调用列表 9.10。在我们需要启用一个带有“类别（Categories）”的下拉列表时，可以用于过滤特定类型的小时。任何处理程序在结束时都会调用\
