    8.2. WEEK CLASS


    # 8.2 Week Class


    The Week class is a very simple data class. It is shown in Listing 8.2. It contains
    a CellData object for each day of the week, and a string with the project-name
    - common to all the cells. It is however imperative that it can be viewed in sorted
    lists - as seen in Section 7.4. C# sorts for if you define the single function
    of IComparable: CompareTo. This function takes as input an object of the same
    class as being called - here called “other”. In this case it calls a static function
    that hierarchically compares two projects - first by their parents, then by themselves.
    This is generally used.


    If you want to use an object in a Dictionary, CompareTo is not enough. You also
    need a function called GetHashCode. This should return something as unique as
    possible. Since ProjectID is a private key, it is as unique as it can be. So GetHashCode
    is overridden. This means that this method will be used instead of the default
    implementation which can always be trusted.


    The last handy function in the comparing-domain is Equals. This is also overridden.


    Together these three functions allow the application programmer to write some
    neat code. It is good practice to implement them - at least when you plan to use
    Collections. You cannot always foresee when C# decides to call the two methods
    that are overridden here.


    Actually, all three implementations have a small flaw. Two Week objects could
    contain the same project - but for different dates. The way TimeReg works, the
    Week objects are only in a common list when they belong to the same calendar week.
    Still, it is an error waiting to happen.


    Another interesting thing in Listing 8.2 is the declaration in lines 41-52. With
    this code, a Week-based object can reference the embedded CellData objects directly
    as array-elements of the Week-based object:


    ```

    float hours = projectWeek[0].Hours;

    ```


    The above code gives us the hours spent Monday on the specific project.'
