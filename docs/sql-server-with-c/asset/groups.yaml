- md: "\n## Chapter 8\n\n## Data Transfer Objects\n\n## 8.1 CellData Class\n\nIt is\
    \ time to look at the data-classes or Data Transfer Objects. We start with **CellData**\
    \ which represents all data to and from the database that end up in a single cell\
    \ in the main view in TimeReg. This is later used by **Week** which is a class\
    \ that represents a week of data from a given Project.\n\nCellData is shown in\
    \ Listing 8.1. The first thing we note is the member variables in lines 3-9, and\
    \ how they have different access modifiers. Some are even **readonly**. This does\
    \ not sound very productive. The point is that they are readonly - once created.\
    \ This means that they are initialized in the constructor and from cannot be changed.\
    \ The ones that are **protected** may be changed by the class itself. This is\
    \ done in **properties**. Note that it is possible to create properties directly\
    \ without underlying member variables. This is the case for “Changed” and “InOracle”.\n\
    \nYou might argue that instead of all above we could simply have public member-variables.\
    \ After all - this class is for moving data in out of a database. No encapsulation\
    \ is here. However, we want to use CellData with databinding to UI-classes - and\
    \ they look for properties - not membervariables. When you allow a UI-object to\
    \ mess with your data, it makes sense to only allow it to write where it needs\
    \ to.\n\n## CHAPTER 8. DATA TRANSFER OBJECTS\n\nThe constructor is created so\
    \ that it is easy to use on dummy-data - Cells that are ready for data from the\
    \ user. Thus it always sets the MainID - the private key for the row to -1. If\
    \ the constructor is used on data fetched from the database, the MainID must be\
    \ explicitly afterwards. The same applies for \"Changed\" and \"InOracle\".\n\n\
    # Listing 8.1: CellData - one project on one day\n\n```c\npublic class CellData\n\
    {\n    protected int m_mainID;\n    readonly int m_employeeID;\n    readonly int\
    \ m_parentID;\n    readonly DateTime m_date;\n    readonly int m_projectID;\n\
    \    protected float m_hours;\n    protected string m_comment;\n\n    public CellData(DateTime\
    \ date, int employeeID,\n        int projectID, int parentID)\n    {\n       \
    \ m_date = date;\n        m_employeeID = employeeID;\n        m_projectID = projectID;\n\
    \        m_parentID = parentID;\n        m_mainID = -1;\n        m_hours = 0;\n\
    \        m_comment = \"\";\n    }\n\n    bool Changed = false;\n    bool InOracle\
    \ = false;\n\n    public int MainID {\n        get { return m_mainID; }\n    \
    \    set { m_mainID = value; }\n    }\n    public int EmployeeID {\n        get\
    \ { return m_employeeID; }\n        set { m_employeeID = value; }\n    }\n   \
    \ public DateTime Date {\n        get { return m_date; }\n        set { m_date\
    \ = value; }\n    }\n    public int ProjectID {\n        get { return m_projectID;\
    \ }\n        set { m_projectID = value; }\n    }\n    public int ParentID {\n\
    \        get { return m_parentID; }\n        set { m_parentID = value; }\n   \
    \ }\n    public float Hours {\n        get { return m_hours; }\n        set {\
    \ m_hours = value; }\n    }\n    public string Comment {\n        get { return\
    \ m_comment; }\n        set { m_comment = value; }\n    }\n    public bool Changed\
    \ {\n        get { return Changed; }\n        set { Changed = value; }\n    }\n\
    \    public bool InOracle {\n        get { return InOracle; }\n        set { InOracle\
    \ = value; }\n    }\n}\n```\n\n## 8.2 Week Class\n\nThe Week class is a simple\
    \ data class. It is shown in Listing 8.2. It contains a CellData object for each\
    \ day of the week, and a string with the projectName - common to all the cells.\
    \ It is however imperative that it can be viewed in sorted lists - as seen in\
    \ Section 7.4. C# sorts if you define the single function of IComparable: CompareTo.\
    \ This function takes as input an object of the same class called “other”. In\
    \ this case it calls a function that hierarchically compares projects - first\
    \ by their parents, then by themselves. This is generally used.\n\nIf you want\
    \ to use an object in a Dictionary, CompareTo is not enough. You also need a function\
    \ called GetHashCode. This should return something as unique as possible. Since\
    \ ProjectID is a private key, it is as unique as it can be. So GetHashCode is\
    \ overridden. This means that this method will be used instead of the default\
    \ implementation which can be trusted.\n\nThe last handy function in the domain\
    \ is Equals. This is also overridden. Together these three functions allow the\
    \ application programmer to write some neat code. It is good practice to implement\
    \ them - at least when you plan to use Collections. You cannot always foresee\
    \ when C# decides to call the methods that are overridden here.\n\nActually, all\
    \ three implementations have a small flaw. Week objects could contain the same\
    \ project but for different dates. The way TimeReg works, the Week objects are\
    \ only in a common list when they belong to the same calendar week. Still, it\
    \ is an error waiting to happen.\n\nAnother interesting thing in Listing 8.2 is\
    \ the declaration in lines 41-52. With this code, a Week-based object can reference\
    \ the embedded CellData objects directly as array elements of the Week-based object:\n\
    \n```csharp\nfloat hours = week[0].Hours;\n```\n\nThe above code gives us the\
    \ hours spent Monday on the specific project.\n\n# Listing 8.2: Week with IComparable\
    \ interface\n\n```csharp\npublic class Week : IComparable<Week>\n{\n    private\
    \ CellData[] Days = new CellData[7];\n    private string projectName;\n\n    public\
    \ string ProjectName { get { return projectName; } set { projectName = value;\
    \ }\n\n    public Week(string projectName)\n    {\n        this.projectName =\
    \ projectName;\n    }\n\n    private Week()\n    {\n    }\n\n    public override\
    \ int CompareTo(Week other)\n    {\n        if (other == null) return 1;\n   \
    \     return DBUtil.CompareTwo(this[0].ProjectID, this[0].ParentID, other[0].ProjectID,\
    \ other[0].ParentID);\n    }\n\n    public override bool Equals(object obj)\n\
    \    {\n        if (obj == null || obj.GetType() != GetType())\n            return\
    \ false;\n        Week otherWeek = obj as Week;\n        return (otherWeek[0].ProjectID\
    \ == this[0].ProjectID &&\n                otherWeek[0].Date == this[0].Date);\n\
    \    }\n\n    public override int GetHashCode()\n    {\n        return this[0].ProjectID;\n\
    \    }\n    public CellData this[int index]\n    {\n        get\n        {\n \
    \           return Days[index];\n        }\n        set\n        {\n         \
    \   Days[index] = value;\n        }\n    }\n}\n```\n\n## 8.3 Classic Class Concept\n\
    \nThe DBUtil layer presented so far is made up of static “worker” functions for\
    \ doing the actual SQL-commands, and nested classes, instantiated into objects,\
    \ holding and transporting the data. The nice thing about this concept is that\
    \ a given nested data-class can be reused by several worker functions. This is\
    \ indeed used.\n\nAs described in Section 4.5, Forecasts were introduced in the\
    \ TimeReg application after a year or so. Just for the fun of it, I decided that\
    \ this time I use a more classic object-oriented approach: Now SQL-commands would\
    \ take place from within instantiated classes (not static), and these classes\
    \ would also do all the data-mapping.\n\nListing all the code would take up much\
    \ space, but you are welcome to download the code and have a look.\n\nNaturally\
    \ this also works. There is a tendency towards becoming more “model-heavy”. Probably\
    \ because they are their own “Data Transfer Object” to speak. The fact that this\
    \ data part is inside the class instead of outside - possibly shared with other\
    \ classes - allows for more specific handling. This is the whole idea of object\
    \ orientation, and is absolutely not a problem.\n\n## 8.4 A Dapper alternative\n\
    \nAs stated earlier, it is easy to get caught up in Microsoft’s “Legacy Land”.\
    \ Maintenance is one reason to get today’s flavor of framework. Another reason\
    \ is that frameworks tend to be so helpful, which makes them huge and complex,\
    \ and thus difficult to customize.\n\nThis has left an open field for minor ORM\
    \ - Object Relational Mapping tools. One tool that shows promise is Dapper.\n"
  mdcn: "\n\n## 第 8 章\n\n## 数据传输对象\n\n## 8.1 CellData 类\n\n现在是时候查看数据类或数据传输对象（Data\
    \ Transfer Objects）了。我们从 **CellData** 开始，它代表了进入数据库的所有数据，并最终位于 TimeReg 主视图中的单个单元格中。这之后会被\
    \ **Week** 类使用，该类代表来自特定项目的一周数据。\n\n列表 8.1 所示了 CellData。我们首先注意到的是第 3-9 行的成员变量，以及它们具有不同的访问修饰符。有些甚至是**只读的**（readonly）。这听起来效率并不高。重点在于它们是只读的——一旦创建便无法更改。这意味着它们在构造函数中初始化，并且无法修改。那些**保护的**（protected）变量可以由类本身修改。这是在**属性**（properties）中实现的。注意，可以直接创建属性而不创建底层的成员变量。“Changed”（已更改）和“InOracle”就是这种情况。\n\
    \n你可能会认为，与其上述所有操作，我们只需要简单的公共成员变量即可。毕竟——这个类是用于在数据库进出之间移动数据的。这里没有封装。然而，我们希望将 CellData\
    \ 与 UI 类进行数据绑定使用——而 UI 类寻找的是属性，而不是成员变量。当你允许 UI 对象干涉你的数据时，只允许它在需要的地方进行写入是有意义的。\n\
    \n## 第 8 章，数据传输对象\n\n创建构造函数的目的是为了方便在虚构数据上使用——即准备好接收用户数据的单元格。因此，它始终将 MainID（该行的主键）设置为\
    \ -1。如果构造函数用于从数据库中获取的数据，则必须在之后显式地设置 MainID。“Changed”和“InOracle”的情况也是如此。\n\n# 列表\
    \ 8.1: CellData - 单日内的单个项目\n\n```c\npublic class CellData\n{\n    protected int\
    \ m_mainID;\n    readonly int m_employeeID;\n    readonly int m_parentID;\n  \
    \  readonly DateTime m_date;\n    readonly int m_projectID;\n    protected float\
    \ m_hours;\n    protected string m_comment;\n\n    public CellData(DateTime date,\
    \ int employeeID,\n        int projectID, int parentID)\n    {\n        m_date\
    \ = date;\n        m_employeeID = employeeID;\n        m_projectID = projectID;\n\
    \        m_parentID = parentID;\n        m_mainID = -1;\n        m_hours = 0;\n\
    \        m_comment = \"\";\n    }\n\n    bool Changed = false;\n    bool InOracle\
    \ = false;\n\n    public int MainID {\n        get { return m_mainID; }\n    \
    \    set { m_mainID = value; }\n    }\n    public int EmployeeID {\n        get\
    \ { return m_employeeID; }\n        set { m_employeeID = value; }\n    }\n   \
    \ public DateTime Date {\n        get { return m_date; }\n        set { m_date\
    \ = value; }\n    }\n    public int ProjectID {\n        get { return m_projectID;\
    \ }\n        set { m_projectID = value; }\n    }\n    public int ParentID {\n\
    \        get { return m_parentID; }\n        set { m_parentID = value; }\n   \
    \ }\n    public float Hours {\n        get { return m_hours; }\n        set {\
    \ m_hours = value; }\n    }\n    public string Comment {\n        get { return\
    \ m_comment; }\n        set { m_comment = value; }\n    }\n    public bool Changed\
    \ {\n        get { return Changed; }\n        set { Changed = value; }\n    }\n\
    \    public bool InOracle {\n        get { return InOracle; }\n        set { InOracle\
    \ = value; }\n    }\n}\n```\n\n## 8.2 Week 类\n\nWeek 类是一个简单的数据类。它在列表 8.2 所示。它包含了每周每一天的\
    \ CellData 对象，以及一个项目名称字符串——该字符串对所有单元格通用。然而，让它能够在排序列表中显示是关重要的——如第 7.4 节所示。如果你定义了\
    \ IComparable 接口的唯一函数：CompareTo，C# 就会进行排序。该函数接收一个名为“other”的同类对象作为输入。在这种情况下，它调用了一个分层比较项目的函数——首先比较它们的父级，然后比较它们本身。这是常用的用法。\n\
    \n如果你想在 Dictionary 中使用对象，仅有 CompareTo 是不够的。你还需要一个名为 GetHashCode 的函数。它应该返回尽可能唯一的值。由于\
    \ ProjectID 是主键，它已经是尽可能唯一的了。因此重写了 GetHashCode。这意味着该方法将取代可以信赖的默认实现。\n\n该领域中最后一个实用的函数是\
    \ Equals。它也被重写了。这三个函数共同允许应用程序程序员编写一些整洁的代码。实现它们是一个良好的习惯——至少当你计划使用集合（Collections）时是这样。你不能总是预见到\
    \ C# 何时会调用这些方法。\n\n```csharp\nfloat hours = week[0];\n```\n\n# 列表 8.2: 带 IComparable\
    \ 接口的 Week\npublic class Week : IComparable<Week>\n{\n    private CellData[] Days\
    \ = new CellData[7];\n    private string projectName;\n\n    public string ProjectName\
    \ { get { return projectName; } set { projectName = value; }\n\n    public Week(string\
    \ projectName)\n    {\n        this.projectName = projectName;\n    }\n\n    private\
    \ Week()\n    {\n    }\n\n    public override int CompareTo(Week other)\n    {\n\
    \        if (other == null) return 1;\n        return DBUtil.CompareTwo(this[0].ProjectID,\
    \ other[0].ProjectID, this[0].ParentID, other[0].ParentID);\n    }\n\n    public\
    \ override bool Equals(object obj)\n    {\n        if (obj == null || obj.GetType()\
    \ != GetType())\n            return false;\n        Week otherWeek = obj as Week;\n\
    \        return (otherWeek[0].ProjectID == this[0].ProjectID &&\n            \
    \    otherWeek[0].Date == this[0].Date);\n    }\n\n    public override int GetHashCode()\n\
    \    {\n        return this[0].ProjectID;\n    }\n    public CellData this[int\
    \ index]\n    {\n        get\n        {\n            return Days[index];\n   \
    \     }\n        set\n        {\n            Days[index] = value;\n        }\n\
    \    }\n}\n```\n\n## 8.3 经典类概念\n\n目前为止介绍的 DBUtil 层由执行实际 SQL 命令的静态“工作”函数以及持有并传输数据的嵌套类组成。这种概念的优点是，给定的嵌套类可以被多个工作函数复用。\n\
    \n正如第 4.5 节所述，预测（Forecasts）在 TimeReg 应用中大约一年后被引入。为了好玩，我决定这次使用一种更经典的面向对象的方法：现在\
