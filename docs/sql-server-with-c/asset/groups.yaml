    # 7.5 SQLDATAAPTER


    # 7.5 SqlDataAdapter


    As described earlier I have in another project used the TableAdapter framework.
    I rejected this because all the surrounding wizardry obscured what was happening
    and changes were hard to track. However, it was possible to work with adapters
    in a more classic coding style. ADO.NET can be used with the same “intro” pattern
    that we saw in the previous section, but instead of an inner-loop with a reader,
    ADO.net fill an untyped DataSet or a subcomponent of it - a DataTable. To do this
    it SqlDataAdapter. With the Fill command, the SELECT is run and the DataTable
    is filled with the result.


    This DataTable can be bound to a UI-element and changes can be fed back to the
    right mixture of DELETE, UPDATE and INSERT. This is extremely code-effective -
    especially if you are working on a single flat table. If the DataTable is filled
    from several tables using JOIN s, update becomes more complex, and requires assistance
    from you.


    For TimeReg I did not go down this path. I tried the SqlDataAdapter in a simple
    scenario. Listing 7.4 shows a simple query that finds the project name for a given
    ProjectID - the private key in Projects. In this case we found exactly one row,
    but that doesn’t change the principle.


    In line 43 the name is returned. Note, how, the time, the name of the column is
    used as index. This line also needs a “ToString()” as the DataTable knows nothing
    about types.


    In the end the code in Listing 7.4 was not really used. With adapters this is
    a lot of work to get a project name - and then similar must be coded if the parent-name
    is needed etc. It would mean a lot of trips to the database. Instead I decided
    to maintain a Projects Dictionary in the DBUtil utility layer for all these simple
    lookups. It would have been more correct to keep it in the Model layer. Linq is
    formidable for searches in this.


    The SqlDataAdapter and its friends, the DataSet and the DataTable, are more hungry
    than the SqlDataReader. This should not be a surprise. The reader only allows
    for reading from one to another, while the adapter-components supports updates
    back to the database and other advanced features.'
