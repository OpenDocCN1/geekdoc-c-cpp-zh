    ## 第 3 章

    ## TimeReg 数据库

    ### 3.1 引言


    我一直尝试让 TimeReg 不仅适用于高层管理。项目经理可以分析子项目的耗时情况，而开发者可以管理自己的休假等。您可以下载示例文件（其中包含一个小型示例数据库），并在阅读本书时使用它。或者，您也可以直接阅读文本并继续。


    ## 3.2 TimeReg 需求


    基本上，TimeReg 应用程序的需求如下：


    > 项目工时的每日报告必须足够简单，因为这是最常见的操作。例如，可以以周为单位的形式——非常类似于学生使用的时间表。如果不仅能记录小时数，还能记录自由文本注释，那就就更好了。用户应该只能看到他们之前选择为相关的项目——“我的项目”，而不是其他人的项目。所有用户都必须能够直接在程序中创建简单的报告。它必须易于以
    Excel 兼容的格式保存这些报告。只有经理应该能够轻松查看其他员工的病假和休假。项目经理应该能够轻松查看项目子部分的累计数字。我们希望能够将项目中的工作分解开来。


    ## 3.3 逻辑设计


    数据库设计是自自而上的。首先是高层设计，在其中定义主要的实体（表）以及基于业务模型的关系。然后是低层设计，其中包含数据类型、索引、约束等。这些内容我们将在第
    4 章重新讨论。这两个层次通常被称为逻辑设计和物理设计。来自硬件和嵌入式软件领域，我发现“物理设计”这个术语令人困惑，但它是常用的。因此，让我们开始 TimeReg
    的逻辑设计：


    ### 3.3 逻辑设计


    查看需求。尝试将所有名词作为实体（表）的候选。然后将它们的所有属性作为表列。具体的项目将成为行。


    在示例需求中发现了以下名词：时间注册、员工、项目、子项目、部门、注释、工时、周、用户、休假、病假、报告、经理、操作、数字、个人、工作。让我们逐一分析：


    - 时间注册

    这是整体目标，因此它不是一个表，而是整个系统。


    - 员工

    这是一个很好的表候选者。此表必须包含与特定员工相关的所有信息——例如“姓名”、工资编号（员工工号）和部门（见下文）。我决定使用标识符，并且我们需要处理这些情况。


    - 部门

    这是一个有趣的案例。正如所说，员工属于一个部门。这是一个 1:n 关系。


    - 项目

    这是另一个表的候选者。


    - 子项目

    这是我们存储工作分解的地方。


    - 我的项目

    这是一个关联表（中间表）。由于一个员工可能参与多个项目，这是一个 m:n 关系。


    '
