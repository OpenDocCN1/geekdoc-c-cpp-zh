    Note how the output from the join looks very much like an Excel solution in a
    flat table would look from the start. In other words: we start with a flat table,
    which we normalize into a flat table. Then we join them back to a flat table.
    The main advantage of the well-normalized database is that it is easier to maintain
    - no anomalies. Doing an (INNER) JOIN gets the Intersection of the tables - only
    rows where match in all tables. To demonstrate the difference between (INNER)
    JOIN and LEFT JOIN we need to start with a table that is not fully used. The same
    query is done again, except this time with a LEFT JOIN.

