    # Chapter 7


    # Database Functions


    # 7.1 Design


    The database layer is implemented in a class named DBUtil. It is a single C#-source
    file that has two main parts. The first part is the nested data-heavy classes
    that are used to communicate with the upper C# classes. The term "nested" means
    that they are classes within a class - in this case DBUtil. I use the term "data-heavy"
    to describe that they are essentially data-carrying and data-exposing classes
    that are used in the interface to the database. These are also called DTOs - Data
    Transfer Objects.


    The use of public properties with the relevant read/write capabilities make these
    classes well suited for use in the UI-layer, where they very directly interface
    to various lists and particularly DataGridView.


    The second part is the actual queries to the database - using the above classes.
    These directly database-interfacing classes are static - which is probably not
    what you would expect. Static functions are super-easy to call, but being static
    means that you cannot do multithreading. There are no local variables per instance.
    However, they are called synchronously directly from the forms - so they are executed
    serially. This is a pretty simplistic approach. You may be thinking: "What about
    worker threads?" or "Why not use async/await?" Microsoft suggests the use of async
    methods when dealing with databases. However, as stated earlier, I agree with'
  - '[PAGE 98]


    Einstein: “Keep it as simple as possible - but not simpler".


    There are two reasons why this works:


    +   - The way the workflow is in the application, the user really hasn''t got
    much to do but wait for the database to answer. What is fastest: Waiting synchronously
    or asynchronously? The asynchronous methods use a lot of energy on setting up
    and tearing down, while the synchronous methods simply wait. Anyway, the simple
    queries are pretty fast. Only when we get to the reports does the user sometimes
    experience a short wait - and again what else is there to do? In the re-ports
    the hourglass is turned on before the query and off afterwards, the user is informed.


    +   - The functions are static but they work on the previously described nested
    data-heavy classes which are not static, but are instantiated into objects. These
    objects do have overlapping lifetimes without problems.


    # 7.2 ExecuteNonQuery


    Sometimes a query is any of the CRUD functions: INSERT, SELECT, UPDATE, DELETE
    - and sometimes the word is taken more literally - - meaning “question” - as opposed
    to “command” - and then only means the SELECT. When it comes to the naming of
    ADO.net functions, Microsoft has chosen the latter view. The ExecuteNonQuery is
    used for INSERT, UPDATE and DELETE where there is no data returned.


    One of the simplest functions in TimeReg is“InsertIntoProjects” which inserts
    a pair of foreign surrogate keys into the association/junction table MyProjects.
    This is found in Listing 7.1. We will examine this, as it has several generally
    usable patterns.


    Lines 3 and 4 show the SQL text-string. We already saw in Listing 4.3 in Chapter
    4. Note that it is possible to add several VALUES pairs, using a comma in-between.
    This is however, typically not practical in normal code looping through objects.'
