    \ 7.1 Design\n\nThe database layer is implemented in a class named DBUtil. It\
    \ is a single C#-source file. It is a single C#-source file. It has two main parts.\
    \ The first part is the nested data-heavy classes that are used in the UI-layer.\
    \ The term \"nested\" means that they are classes within a class - I use the term\
    \ \"data-heavy\" to describe that they are essentially DTOs - Data Transfer Objects.\n\
    \nThe second part is the actual queries to the database - using the above classes.\
    \ These are static - which is probably not you would expect. Static functions\
    \ are super-easy to call, but being static means you cannot do multithreading.\
    \ There are no local variables per instance. However, they are called directly\
    \ from the forms - so they are executed serially. This is a pretty simplistic\
    \ approach.\n\nHowever, I agree with Einstein: “Keep it as simple as possible\
    \ - but not simpler\".\n\nThere are two reasons why this works:\n\n- The way the\
    \ workflow is in the application, the user really hasn't got much to do but wait\
    \ for the database to answer. What is fastest: Waiting synchronously or asynchronously?\
    \ The asynchronous methods use a lot of energy on setting up and tearing down,\
    \ while the synchronous methods simply wait. Anyway, the simple queries are pretty\
    \ fast. Only when we get to the reports does the user experience a short wait\
    \ - and again what else is there to do? In the reports the hourglass is turned\
    \ on before the query and off afterwards, the user is informed.\n\n- The functions\
    \ are static but they work on the previously described data-heavy classes which\
    \ are not static, but are instantiated into objects. These objects do have lifetimes\
    \ without problems.\n\n### 7.2 ExecuteNonQuery\n\nSometimes a query is any of\
    \ the CRUD functions: INSERT, SELECT, UPDATE, DELETE - and sometimes the word\
    \ is taken more literally - meaning “question” - as opposed to “command” - and\
    \ then only means the SELECT. When it comes to the naming of ADO.net functions,\
    \ Microsoft has chosen the latter view. The ExecuteNonQuery is used for INSERT,\
    \ UPDATE and DELETE where there is no data returned.\n\nOne of the simplest functions\
