    \ specified range. This is pretty much like parameter checking in a program.\n\
    \nThe whole CHECK stuff can be quite confusing. You might actually see text with\
    \ CHECK CHECK.\n\nCHECK enables a constraint while NOCHECK disables a constraint\
    \ that would otherwise automatically be applied.\n\n“WITH CHECK” is used when\
    \ a constraint is added, to tell SQL Server that existing values must also abide\
    \ to the CHECK. If this fails, you will get an error and must sort out the problem\
    \ and try again. “WITH NOCHECK” means that the constraint only applies for new\
