    # 6.2 Data for the Main form


    The Model deserves its name from the way data from the database is modeled in
    order to be presented to the user. In most cases, UI Lists and DataGrids use functions
    from DBUtil almost as is - they do not need a pipest in the Model layer. There
    are however exceptions. This is demonstrated in Figure 6.1. To service the main
    form, a localist is created. This is a shadow structure that contains whatever
    is needed to provide input to the form - and to get updates back into the database.


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_93_0.png)


    Localist is a list (also usable as array) of object instances of the Week class.
    Each Week instance contains a projectName and an internal Array called Days, with
    7 CellData objects. Each CellData instance contains a row from the Main-Table
    in the database - joined with Projects and Employees. The basic part is created
    in DBUtil and we will get back to this in Chapter 8.


    The MainID and other keys are needed when updated data needs to be written back
    into the database. Cells that are empty before the user starts editing will have
    a MainID = -1. This means that we will need to INSERT data for these. When MainID
    is >0 we need to UPDATE existing rows.


