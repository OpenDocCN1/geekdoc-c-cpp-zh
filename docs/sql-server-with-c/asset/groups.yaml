    Work. Let''s take them one-by-one:


    - Time-Registration

    This is the overall purpose and thus is not a table, but the entire system.


    - Employees

    This is a good candidate for a table. This table must contain all relevant information
    that pertains to the specific Employee - e.g. “Netname”, Salary-Number (Employee
    Number) and Department (see below). I decided to use Identity key, and we will
    need to handle the cases.


    - Department

    This is an interesting case. As stated, an employee belongs to a department. This
    is a 1:n relation.


    - Projects

    This is another candidate for a table.


    - Sub-part of project

    This is where we store the breakdown of work.


    - MyProjects

    This is an association (junction) table. Since an employee might work on multiple
    projects, this is an m:n relation.

