    - but also huge class. It has tons of members, functions and events. In this section
    we will continue the ongoing sample from the previous chapters. As you may remember,
    we built a "locallist" which is a local shadow containing the data we need to
    show in the main view. The class for this dialog is UserView.cs, and the DataGridView
    instance is simply called "grid". Thus event-handlers are by default named "grid_<
    event> by Visual Studio.


