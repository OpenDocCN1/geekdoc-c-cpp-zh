    LocalDB deviates from the others by not being run as a separate

    service. Instead it can be run directly as a part of an application.

    Many users may run each their instance of this on the same PC. This makes

    it behave more like a powerful version of **MS Access.


    Finally, **Azure SQL** is modeled very closely to SQL Server, Even, and what

    You learn in this book can also be applied to Azure SQL.


    With the installation we get not just the server, and what the IDE

    for SQL-development with the handy name **Microsoft SQL Server

    Management Studio**. Even abbreviated to MSSMS this name is hard

    to remember. The good thing is that once installed, you can just type

    "SQL" after pressing the Windows Home button to find it. In this

    book we use the shorter form "Management Studio".


    A third tool - not from Microsoft, but highly recommended - **is git**. This

    book is not about source-control. However, you should not work with

    code without a source-control system. This is where C#-code and database-

    scripts are stored and version-managed. Surely, any version-control system

    will, but these days "git is it".


    As a single developer you can download and use all the above tools for

    free.


    # 1.3 TimeReg Sample


    Through the book we will use an existing application as a sample - bind-

    ing together database theory, SQL and C# code. The sample is a time-

    istration system called TimeReg.


    The TimeReg sample is used extensively in the C# part of this book. It is a

    good example because it uses terms that most developers are familiar with,

    and thus do not require extra domain knowledge. We can focus on the real

    database subjects.


    Generally only managers like Time-Registration. This might be to control

    the employees, but in reality it is more likely that it controls the quality of'
