    \ - 例如，不是一个值的列表。最后，不允许出现重复的列，例如 Student1, Student3...。 |\n| 2NF | 整个键 | 符合 1NF，且所有非键列都完全依赖于整个键。\
    \ |\n| 3NF | 仅依赖于键 | 符合 2NF，且所有非键都依赖于键。 |\n\n## 2.5.1 案例：学生数据库\n\n让我们尝试一个简单且经典的案例。我们将讨论规范化并尝试在\
