    \ Server 会充分利用其索引和查找（lookups）。因此，索引在处理大表（主要用于 `SELECT`）时大放异彩。在决定包含哪些列时，首先要查看查询中的\
    \ `WHERE` 语句。这里的列是很好的候选对象。对于时间应用，我希望开发者的速度快，以免打击他们的积极性。管理层的查询可以等待。这些查询很少见，且回报价值更高。结论似乎是：不需要额外的索引。\n\
