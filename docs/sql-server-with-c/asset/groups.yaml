    # 4.3. LEARNINGS ON CRUD


    # 4.3 Learnings on CRUD


    From the few examples we can deduce a number of rules of thumb:


    +   - SELECT statements can become quite complex, especially when reports with
    aggregated numbers are needed. This is in line with the discussion on OLTP versus
    OLAP. This database is not tailored specifically towards historical analysis,
    so when this is needed, things become more complex.


    +   - DELETE, UPDATE and INSERT typically are rather simple. This is what the
    OLTP system excels in.


    +   - Where a SELECT may return thousands of rows, the DELETE, UPDATE and INSERT
    typically only operate on a single row. Once in a while you may need to do some
    maintenance - in our sample it could be moves from one project to another. In
    such a case UPDATE is typically used on several rows. The same could happen with
    DELETE, but rarely with INSERT.


    +   - The WHERE clause must not be forgotten in DELETE and UPDATE - without all
    existing rows are affected.


    +   - Use Inserted.<ColumnName> to get an updated Identity value.


    # 4.4 Indexing


    Indexes are generally extra tables created for faster searches. As stated earlier:
    SQL Server does an OK job right out of the box. Basically it simply creates indexes
    for the private keys. This makes sense as these are used in joins. When you create
    a unique constraint - as we have seen earlier - it also creates an index for the
    relevant columns. That''s it. In many scenarios that''s fine.


    A table can have many indexes, but only one can be Clustered. A clustered index
    organizes the actual table according to the column(s) selected for the index.
    The logical consequence is that all other indexes are non-clustered.'
