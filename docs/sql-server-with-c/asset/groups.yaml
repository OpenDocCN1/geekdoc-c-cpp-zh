    ## Part I

    ## SQL Server


    ## Chapter 2

    ## Database Basics


    ### 2.1 Database Vocabulary


    There are several very different types of databases. Twenty years ago I experimented
    with an Object-Oriented Database called “POET”. This concept seemed like a good
    idea - after all, when we work with objects, it is practical to store and retrieve
    them directly to/from the database without any tedious mapping. However there
    was still the need for a mapping, as the database only supported its own basic
    data types, and only its own collections. On top of this, it was not possible
    to analyze the data with 3rd-party tools. Maybe these are the reasons that we
    don’t hear much about Object-Oriented Databases today.


    In this book we are dealing with Relational Databases - which means table-based
    databases. There are many ways to construct a relational database. Vendors give
    their implementation a more or less standardized external interface - allowing
    us to use SQL Structured Query Language. The entire system - low-level implementation
    of tables with SQL interface - is known as an RDBMS Relational Database Management
    System. Specifically in this book we are dealing almost exclusively with Microsoft
    SQL Server.


    As is often the case, the interface (SQL) is not completely standardized - vendors
    need some space for marketing their particular version. Still, almost everything
    written in this book is also true for other RDBMS like Oracle and MySQL/MariaDB,
    although sometimes the syntax deviates a little. In this book I follow the usual
    terms - using “RDBMS” for the product that you get from e.g. Microsoft, and “database”
    for the thing you create in it.


    You probably already have an idea of what the main terms in databases mean. There
    are, however, many misunderstandings and words with multiple meanings. It is difficult
    to describe some terms without using the others. For this reason I will briefly
    introduce the most important parts of the SQL Server hierarchy in Table 2.1. This
    continues in Table 2.2 with the most important database concepts. We will meet
    them all again.


    The discussion on records & fields versus rows & columns can be a pain. Early
    PC-databases used a mixture of the terms. “Records” and “Fields” are often used
    in UI software, and “Records” are also used at the file-level in databases. In
    Excel we use “rows” and “columns”. No wonder most of us use “row” and “record”
    for the same thing, the same goes for “column” and “field”. However, the standards
    and even Microsoft say:


    # A DATABASE-TABLE CONSISTS OF ROWS AND COLUMNS.


    Thus we will use “row” and “column” in this book. The term “Field” is also sometimes
    used for a specific column and row intersection. Naturally this will be referred
    to as a Cell.


    ### 2.1 DATABASE VOCABULARY


    Table 2.1: The SQL Server hierarchy


    | Name | Meaning |

    | --- | --- |

    | RDBMS | Relational Database Management System - a table-based system with SQL
    interface. |

    | Server | This can mean the hardware or the SQL Server that runs on it. In this
    book it is the latter. |

    | Database | In daily speak the database is often the same as the server. More
    correctly, a single server hosts one or more databases. In Connection Strings
    you refer to a Catalog. |

    | Schema | Used for grouping tables inside a database - like a namespace in C#.
    It brings the additional ability to have different security schemes inside the
    same database. Generally you can get very far with the default "dbo" schema. |

    | Table | This is the basic entity of a relational database. It is always 2-dimensional.
    The full-name of a table on a given server is `<database>.<schema>.<table>`. |

    | View | A construction within the database that in many ways looks as a table
    to the clients. |

    | Row | This is a row in a table. In an Employees table, one row is one Employee.
    Sometimes called a “Record”. |

    | Column | This is a column in a table. In an Employees table it might be the
    Salary Number. Sometimes called “Field”. |

    | Cell | A specific cell in a table. Sometimes called a “Field”. |


    Table 2.2: Important database concepts


    | Name | Meaning |

    | --- | --- |

    | OLTP | On-Line Transaction Processing. As opposed to OLAP. |

    | OLAP | On-Line Analytical Processing. |

    | CRUD | Create, Retrieve, Update and Delete are the main functions of a database.
    |

    | ACID | Atomicity, Consistency, Isolation & Durability. Main features of good
    RDBMS. |

    | Private Key | One or more columns that define a unique row in the given table
    |

    | Foreign Key | One or more columns that together points to a unique row in (typically)
    another table |

    | Normal Form | This is a categorization of how correct the database is structured.
    From non-normalized we step through 1st Normal Form - 1NF - over 2NF, 3NF, 4NF
    and 5NF. Usually we don''t go 3NF because it becomes impractical. |

    | Index | An internal lookup table that speeds up the performance of the database.
    SQL Server creates a few indexes on e.g. Private Keys. |

    | Connection String | A string used in your code to get access to the server and
    database. It can be a pain to get right, although Visual Studio has a good wizard
    for it |

    | SQL | Structured Query Language. This is the language for interacting with databases.
    |

    | T-SQL | Transact-SQL, Microsoft''s extension of SQL. |

    | Constraints | Rules that enforce data integrity within the database. |

    | Join | An operation to combine rows from two or more tables based on a related
    column. |

    | Transaction | A logical unit of work that is performed completely or not at
    all. |

    | Anomaly | An inconsistency that occurs in a database due to improper design.
    |


    ### 2.2 CRUD AND ACID


    In order to understand some basic concepts we need to look at CRUD and ACID. CRUD
    refers to Create-Retrieve-Update-Delete. ACID refers to the properties of a database
    transaction.


    Table 2.3: CRUD


    | CRUD | SQL | Meaning |

    | --- | --- | --- |

    | Create | INSERT | Insert new rows into the database. |

    | Retrieve | SELECT | Fetch rows from the database. |

    | Update | UPDATE | Update existing rows. |

    | Delete | DELETE | Delete rows from the database. |


    Table 2.4: ACID


    | ACID | Meaning |

    | --- | --- |

    | Atomic | The Greek word "atom" means indivisible. This is implemented by a Transaction,
    which is either all done or rolled back. |

    | Consistent | As programmers or database administrators, we are given some of
    the responsibility for keeping data consistent. This is done by Constraints, Triggers
    and Cascades. |

    | Isolated | This is really low-level. The RDBMS may split the SQL command in
    parts to run in parallel. The order of these must not affect the result. |

    | Durable | Once data is stored in the database it must stay - also if there is
    a power break down. |


    ### 2.3 OLTP versus OLAP


    SQL Server is often described as an advanced OLTP system. OLTP means On-Line Transaction
    Processing and is often mentioned as the opposite of OLAP - On-Line Analytical
    Processing. In both cases "On-Line" is a marketing term saying that answers are
    fast. The point is whether the system is Transactional or Analytical. This relates
    not only to the design of your database, but also to the design of the entire
    RDBMS. OLTP-systems are used in e.g. web stores and other POS - Point Of Sales
    applications, as well as in production and administration. Data-mining and data-warehouse
    systems on the other hand, are typically of the OLAP-type.


    You could say that OLTP is designed for many users using many small writes, whereas
    OLAP is designed for fewer users doing many large reads. When you are writing
    to a database, it is very important to protect the data integrity, which ACID
    properties provide.

    '
