    ## Chapter 1

    ## Introduction


    ## 1.1 What to expect from this book


    If you are planning to write a database-application and have little or no experience
    beforehand, there are many questions:


    - What is an RDBMS - and how does it differ from a database?

    - How do you pick the right one - and where does SQL Server fit in?

    - They say SQL Server is of the OLTP type. What does that mean - and what is the
    alternative?

    - How do I create a database and its tables - and especially the relations?

    - Understanding the above - how do I do it in a “good” design?

    - What about the application? How is it layered?

    - Where does ADO.net fit into all this?

    - What about all the small tricks that makes it all work in the end?

    - How do I get data into Excel - preferably without additional libraries?

    - Show me the code!


    ## CHAPTER 1. INTRODUCTION


    Hopefully you will find these questions, as well as many others, are answered.
    There are many tools that will get you to a certain point, but without a deeper
    understanding you begin to go in circles, making modifications based on questionable
    assumptions. The aim of this book is to provide this understanding. There are
    no exercises, however it is possible to “code along”, using official Microsoft
    tools - see Section 1.2.


    To help clarify the text, typesetting is as follows:


    - Itemized lists are like this, while sequential lists are numbered starting with:
    ①

    - PascalCase is used for tables, columns etc. in the database.

    - camelCase is used for C# variables and functions.

    - Bold for keywords, the first time they occur locally.

    - SMALL CAPS for emphasized statements.

    - Plain tables are used for database tables and other computed output. A plain
    table has vertical as well as horizontal single-width separating lines all over.
    Contrary to this, authored tables do not have any vertical lines, while they use
    bold headers and other formatting.

    - Standard captions. Meaning that captions are under figures, but above listings
    and tables.

    - Chapters, sections and subsections are numbered.

    - Code in boxes and inline like:

    `SELECT ProjectID FROM Projects Name = ‘Vacation’`

    SQL code is formatted “compact” to save space. Check out some of the many free
    online formatters.


    ## 1.2 Tools


    All code in the sample as well as all code-snippets and concepts described in
    this book can be created with the help of two Microsoft Tools:


    - **Microsoft Visual Studio Community Edition**: Visual Studio is by far the most
    advanced IDE (Integrated Development Environment) found today. Microsoft has a
    good position in the corporate world, but also aims to become more relevant to
    the "grassroots" and the Open Source community. Years ago Microsoft handed the
    C# language to an independent organ, and now we have the Community Edition of
    Visual Studio - free to use for any single developer as well as certain minor
    organizations. The Community Edition is surprisingly powerful and we really don''t
    need more for this book. It runs on Mac OSX. The only programming language used
    in this book is C# - if not considering SQL programming language. With Visual
    Studio comes not only the C# compiler and debugger, but also the class libraries
    needed. Some of the most relevant for databases are ADO.Net and linq.


    - **Microsoft SQL Management Studio with SQL Express**: As stated above, Microsoft
    has the corporate presence, but also to a degree reaches out to the Open Source
    developers. SQL Server now runs on some Linux distributions. It even - optionally
    - runs on Docker. This is a "container" on Linux - which is kind of a lightweight
    Virtual Machine without a guest/host OS. SQL Server comes in many editions - from
    the Enterprise Edition, over the Standard Edition to the LocalDB. There is also
    a Developer Edition which is essentially the same as the Enterprise Edition. The
    Standard and Enterprise SQL Servers are not free, but you can get very far with
    the free Express edition. I have not found any functionality in the big SQL Servers
    that I really miss in the Express edition. The main difference is scale: The Express
    edition "only" supports up to 10 GB databases and only utilizes a single CPU¹.
    makes it a great choice for development: it is


    > ¹At the time of this writing: Max 4 cores, max 1410 MB pool buffer size and
    max 352 MB Column-store segment cache.


    ready to port to SQL Server. It actually makes it an interesting candidate for
    minor real installations.


    LocalDB deviates from the others by not being run as a separate service. Instead
    it can be run directly as a part of an application. Many users may run each their
    instance of this on the same PC. This makes it behave more like a powerful version
    of **MS Access**.


    Finally, **Azure SQL** is modeled very closely to SQL Server, Even, and what You
    learn in this book can also be applied to Azure SQL.


    With the installation we get not just the server, and what the IDE for SQL-development
    with the handy name **Microsoft SQL Server Management Studio**. Even abbreviated
    to MSSMS this name is hard to remember. The good thing is that once installed,
    you can just type "SQL" after pressing the Windows Home button to find it. In
    this book we use the shorter form "Management Studio".


    A third tool - not from Microsoft, but highly recommended - **is git**. This book
    is not about source-control. However, you should not work with code without a
    source-control system. This is where C#-and version-control system are stored.
    The good thing is that it is.


    ## 1.3 Timereg Sample


    Through the book we will use an existing application as a sample - binding together-registration
    system called Timereg. The sample is used in the C# part of. Generally only managers
    like it to control the quality of the management. A manager may say one day that
    project A has the highest priority, and then the next day project B has the highest
    priority. With a Time-Registration system the truth will show out. Here you see
    which task or project goal priority in the end. It may also be a good tool for
    a project manager or developer as he can say: “We did not put the planned effort
    into this project, because we had to spend a lot of time on task X”. If you calculate
    Velocity in a project, time-registration is also a help. Thus, in some ways the
    burden of e.g. not meeting targets is now shared with the management - as it should
    be.


    ![aee98b7809f9e4bf364ac352df7_13)


    | Project | Monday 19-Mar | Tuesday 20-Mar | Wednesday 21-Mar | Thursday 22-Mar
    | Friday 23-Mar | Saturday 24-Mar | Sunday 25-Mar |

    |---|---|---|---|---|---|---|---|

    | Vacation | | | | | | | |

    | Earth | | | | | 1 | | |

    | Jupiter | | | | | | | |

    | Enceladus | 2 | 3 | 2 | 4 | 4 | | |

    | Mars | | | | | | | | |

    | Saturn | | | | | | | | |

    | Enclosure | 6 | 6 | 6 | | 2 | | | |

    | Sum | 8 | 9 | 8 | | 7 | 0 | | |


    Figure 1.1: Resulting Main Screen


    1.1 shows the main screen in the implemented sample program. It looks very simple,
    and indeed it is - especially if you only need to input hours. The screen shown
    on the figure is what all users experience when they need to type in hours. This
    main workflow is the one we look closest into, but there are in fact a number
    of other screens and workflows. We will examine some of these, but far from all.


    If you want to download the sample database and/or the C#-code, please go to https://klauselk.com
    to learn how.

    '
