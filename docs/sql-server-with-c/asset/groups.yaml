- md: "\n## 4.4. INDEXING\n\n![](img/9aee98b7809f9e4bf3647b6ac35a2df7_67_0.png)\n\n\
    Figure 4.2: Execution Plan with Index\n\nThe “Messages” window now says:\n\nDBCC\
    \ execution completed. If DBCC printed error messages, contact your system administrator.\n\
    \nSQL Server Execution Times:\nCPU time = 0 ms, elapsed time = 0 ms.\n\n(17 row(s)\
    \ affected)\nTable ‘Projects’. Scan count 0, logical reads 3, physical reads 2,\n\
    read-ahead reads 0, logical reads 0, physical reads 0,\nlob read-ahead reads 0.\n\
    Table ‘Workable’. Scan count 0, logical reads 0, physical reads 0,\nread-ahead\
    \ reads 0, logical reads 0, physical reads 0,\nlob read-ahead reads 0.\nTable\
    \ ‘Main’. Scan count 1, logical reads 3, physical reads 3,\nread-ahead reads 0,\
    \ logical reads 0, physical reads 0,\nlob read-ahead reads 0.\n\nSQL Server Execution\
    \ Times:\nCPU time = 0 ms, elapsed time = 338 ms.\n\nCPU time is now 0 ms (rounded).\
    \ The I/O explains why.\n\nRelatively this index was a big success. Whether it\
    \ makes sense to go for\n32 ms is another thing. Network delays can easily be\
    \ much longer.\n\n## 4.5 Views\n\nA database-manager can choose to only make certain\
    \ columns of a table accessible for (some) users, by creating a View of the table\
    \ with only the selected columns - and even rename some or all. Programmers work\
    \ on the table via the view, and may think of it as just another table. This is\
    \ one way to use views, where the purpose is limited access or better naming without\
    \ disturbing backward compatibility.\n\nAnother reason for creating views is to\
    \ simplify the client programs. Advanced joins can be written as part of SQL-code\
    \ embedded in your program. Alternatively a view can be created in the database\
    \ environment. This makes all client programs simpler, as they just need to refer\
    \ to the view in the same way as a table. In reality the view is dynamically generated\
    \ when data is requested.\n\nIf a view is based on a single table, it is possible\
    \ to insert, update and delete rows, as if it is a table, and the underlying,\
    \ real table will be updated correctly. However, the view is dynamically created\
    \ from a join, you cannot simply write to the view and have the underlying tables\
    \ updated. This requires the use of something called “Instead of” Triggers that\
    \ is beyond the scope of this book.\n\nAfter running TimeReg for some time with\
    \ a growing user-base and new requirements in small doses, we were faced with\
    \ a completely new requirement: Forecasts. In addition to registering hours, managers\
    \ would estimate man-months per man per month per project.\n\nThe Forecast table\
    \ was created in Management Studio, using the Designer. Using “Script Table as...”\
    \ now gives us Listing 4.9.\n\n### Listing 4.9: Forecast Table\n\n```sql\nCREATE\
    \ TABLE [dbo].[Forecasts] (\n    [TaskID]        [int] IDENTITY(1,1) NOT NULL,\n\
    \    [ProjectID]     [int] NOT NULL,\n    [EmployeeID]    [int] NOT NULL,\n  \
    \  [TaskDesc]      [varchar](200) NOT NULL,\n    [CalMonth]      [int] NOT NULL,\n\
    \    [Effort]        [real] NOT NULL,\n    PRIMARY KEY CLUSTERED (\n    [TaskID]\
    \ ASC\n);\n```\n\n## 4.5. VIEWS\n\nWe recognize the use of an integer surrogate\
    \ key - here named “TaskID”. EmployeeID and ProjectID are well-known by now, and\
    \ “TaskDesc” is a textual description of the job to do. “Effort” is the number\
    \ of months a developer is estimated to put in a task in the given month. Thus\
    \ it should be a number between 0 and 1, but could be more if we start thinking\
    \ in competence pools - e.g. “DSP Developers”.\n\nInstead of the high-resolution\
    \ time-stamps an integer is used. This is called “CalMonth” and is created like:\
    \ Year*100+Month, so by February 2018 becomes 20182. Table 4.4 shows the first\
    \ 10 lines of forecasts in this system.\n\nTable 4.4: Forecast - first 10 lines\n\
    \n| TaskID | ProjID | EmplID | TaskDesc | CalMonth | Effort |\n|---|---|---|---|---|---|\n\
    | 6 | 275 | 18 | Basic Linux | 201612 | 1 |\n| 19 | 275 | 215 | Basic Linux |\
    \ 201612 | 1 |\n| 32 | 275 | 5 | Basic Linux | 201612 | 1 |\n| 63 | 73 | 121 |\
    \ FPGA Design | 201610 | 1 |\n| 64 | 73 | 121 | FPGA Design | 201611 | 0.7 |\n\
    | 65 | 73 | 121 | FPGA Impl | 201612 | 0.7 |\n| 66 | 73 | 121 | FPGA Impl | 201701\
    \ | 0.7 |\n| 67 | 73 | 121 | FPGA Impl | 201702 | 1 |\n| 68 | 73 | 121 | FPGA\
    \ Test | 201703 | 1 |\n| 69 | 73 | 121 | FPGA Test | 201704 | 1 |\n\nAfter the\
    \ forecasts were created we wanted to show them in Power BI. The custom-format\
    \ was not compatible with this tool. In order to give Power BI the ability to\
    \ read timestamps “normally”, a View was created. This is also done in Management\
    \ Studio, by right-clicking on “Views”. You get to a dialog where you can pick\
    \ tables and columns in these. This gives you some SQL that you can edit. It is\
    \ not difficult to write the script directly. The final script is seen in Listing\
    \ 4.10. Finally Table 4.5 shows the first 10 lines of SELECT * on this view. It\
    \ is easy to see the effect of the view. Please note that it is not possible to\
    \ write to this view to get data into the Forecast table. This is not relevant\n\
    \n### Listing 4.10: Forecast View\n\n```sql\nCREATE VIEW [dbo].[ForecastDates]\
    \ AS\nSELECT TaskID, ProjectID, EmployeeID, TaskDesc, Effort,\n(CalMonth/100),\
    \ (CalMonth%100), 1) AS TheDate\nFROM dbo.Forecasts\nGO\n```\n\nTable 4.5: Forecast\
    \ - first 10 lines\n\n| TaskID | ProID | EmpID | TaskDesc | Effort | TheDate |\n\
    |---|---|---|---|---|---|\n| 6 | 275 | 18 | Basic Linux | 1 | 2016-12-01 |\n|\
    \ 19 | 275 | 215 | Basic Linux | 1 | 2016-12-01 |\n| 32 | 275 | 5 | Basic Linux\
    \ | 1 | 2016-12-01 |\n| 63 | 73 | 121 | FPGA Design | 1 | 2016-10-01 |\n| 64 |\
    \ 73 | 121 | FPGA Design | 0.7 | 2016-11-01 |\n| 65 | 73 | 121 | FPGA Impl | 0.7\
    \ | 2016-12-01 |\n| 66 | 73 | 121 | FPGA Impl | 0.7 | 2017-01-01 |\n| 67 | 73\
    \ | 121 | FPGA Impl | 1 | 2017-02-01 |\n| 68 | 73 | 121 | FPGA Test | 1 | 2017-03-01\
    \ |\n| 69 | 73 | 121 | FPGA Test | 1 | 2017-04-01 |\n\n## 4.6 Common Table Expressions\n\
    \nIt is possible to put queries in queries. This is called Subqueries. You can\
    \ also go step further - to Common Table Expressions. This name is often shortened\
    \ to CTE. A CTE can whatever a subquery can do, but on top of this it is recursive.\
    \ Many believe that CTEs are more readable than subqueries. We skip subqueries\
    \ here.\n\nIn the first part of the CTE, a temporary named table is created -\
    \ much like a view. This part starts with “WITH” and the name to use for the temporary\
    \ table - “CTE” is often used. In the second part of the CTE, the temporary table\
    \ can be used one or more times - like any other table. As stated earlier, TimeReg\
    \ projects can be children of other projects. In the “Reports” part of TimeReg\
    \ needed hours from child projects aggregated on the parent - together with hours\
    \ booked on the parent. Listing 4.11 shows the CTE for this (with fixed dates).\n\
    \n### Listing 4.11: Common Table Expressions\n\n```sql\nWITH CTE AS (\n  SELECT\
    \ Year(main.Date) AS Year, Month(main.Date)\n  AS Month, projects.ProjectID, projects.Parent,\
    \ main.Hours,\n  CASE WHEN projects.Parent > 0 THEN projects.Parent\n  ELSE projects.ProjectID\n\
    \  END SuperProj\nFROM projects\n  INNER JOIN Main main\n  ON main.ProjectID =\
    \ projects.ProjectID\n  WHERE main.Date < '2018-04-1' AND main.Date >= '2018-01-1'\n\
    )\nSELECT SuperProj, Year, Month, ROUND(SUM(Hours),0) AS Total\nFROM CTE\nGROUP\
    \ BY SuperProj, Year, Month\nORDER BY SuperProj, Year, Month\n```\n\nIn the first\
    \ part a “SuperProj” column is created in the temporary table. This is the ProjectID\
    \ of the parent project if such exists. If not, the project is a parent itself.\n\
    \nThe first part now continues joining the actual project with the Main table\
    \ to get the Hours. Thus we get all the hours per actual project, pass them on\
    \ to the second part together with the SuperProj.\n\nSecond part of the CTE starts\
    \ in line 12. It is responsible for aggregation and grouping/ordering according\
    \ to the SuperProj, Year and Month. When comparing this to this solution in Subsection\
    \ 4.2.2, we see that the CTE also gives us fewer columns to worry about when grouping.\n\
    \nThe output when executing the code in Listing 4.11 is seen in Table 4.6. Please\
    \ note that there are missing entries. E.g. SuperProj 5 has no line for Month\
    \ 3. SQL Server might have written a Total of 0 - but it doesn't. This can be\
    \ a nasty surprise to a programmer using these data to fill out arrays or writing\
    \ in monthly columns.\n"
