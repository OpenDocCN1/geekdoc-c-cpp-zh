    \ 7.1. We will examine this, as it has several generally usable patterns.\n\n\
    Lines 3 and 4 show the SQL text-string. We already saw in Listing 4.3 in Chapter\
    \ 4. Note that it is possible to add several VALUES pairs, using a comma in-between.\
    \ This is however, typically not practical in normal code looping through objects.\n"
