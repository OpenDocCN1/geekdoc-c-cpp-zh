    # 3.5 TimeReg Data sample


    For use in SQL experiments, screen dumps etc we need neutral project data. A part
    of the design is that we have projects that may have childprojects. Data can be
    accumulated on the parent when presenting to management, whereas B&K Denmark use
    these children for sub-teams like FPGA, Embedded Software etc. while another country
    use the children for various phases in a project.


    In the sample for this book the parent projects are named after the planets in
    our solar-system. The children of the planets are named after their moons - far
    from all moons are included. In the Projects table there is a “Parent” column².
    This contains the ProjectID of the parent project. For the parent projects, the
    value in this column is 0. Projects such as “Vacation” and “Sickness” are special
    since some privacy may be needed. For these the Parent is -1. In Chapter 4 a SELECT
    is done that shows the projects in Table 4.2.


    > A more consistent name would have been “ParentID”'
- md: "\n# Chapter 4\n\n## SQL\n\n## 4.1 Introduction to SQL\n\nTypically when people\
    \ talk about SQL-statements they mean queries like the SELECT that we have already\
    \ seen in some examples when discussing JOIN. SELECT together with UPDATE, DELETE\
    \ and INSERT constitutes the “Data Manipulation Language”. We have seen them bundled\
    \ together as CRUD in Chapter 2. We have also seen some commands used for creating\
    \ and deleting tables and databases - like CREATE, ALTER and DROP. This is the\
    \ “Data Definition Language”. These two groups of commands are the most important\
    \ in this book, but altogether there are four groups - as shown in Table 4.1.\n\
    \nTable 4.1: T-SQL Language Groups\n\n| Term | Meaning | Examples |\n|---|---|---||\n\
    | DML | Data Manipulation Language | SELECT, UPDATE, DELETE, INSERT |\n| DDL |\
    \ Data Definition Language | ALTER, CREATE, DROP |\n| DCL | Data Control Language\
    \ | GRANT, REVOKE |\n| TCL | Transactional Control Language | COMMIT, ROLLBACK\
    \ |\n\nYou can find a lot of details on SQL and T-SQL on the internet. One of\
    \ the best places is “w3schools.com”. This shows all the generic SQL commands\
    \ as well as specific T-SQL for SQL Server. In this text we will walk through\
    \ some samples, to get a general understanding.\n\n### 4.1.1 Parameters\n\nThe\
    \ samples are taken from the database-interface layer that we will dig further\
    \ into Chapter 7. Here all SQL-statements are built as C# strings. I have removed\
    \ the C# string stuff in the following listings to focus on the T-SQL. I have\
    \ kept the “parameters”. These are variable names that start with a “@”. We shall\
    \ see later that these parameters are not substituted in the C#-string before\
    \ it is handed to SQL server. Instead the parameters are handed over separately\
    \ in a Command object. This improves security - especially when strings originate\
    \ from the user. In such a case, a bandit could supply a full nasty SQL-injection.\
    \ This is not possible with parameters. As a bonus, it is important to use this\
    \ syntax when getting to use parameters. As a bonus it also makes it clearer which\
    \ part of the SQL that is input from the application. Note that it is perfectly\
    \ legal to use names for parameters that are identical to the relevant column-names.\n\
    \nAnother name for the use of parameters is Binding. Whenever SQL Server receives\
    \ an SQL-statement it is “compiled” into an Execution Plan. This is cached, and\
    \ if SQL Server later runs into the same SQL Statement, it will reuse the execution\
    \ plan. However, the textual SQL statement must be exactly the same, whereas parameters\
    \ may differ without triggering a new execution plan. Naturally, parameters are\
    \ typically where changes are likely found, so binding, or using parameters, can\
    \ greatly enhance performance. We will get back to execution plans when we discuss\
    \ Indexes.\n\n### 4.1.2 SELECT\n\nListing 4.1 is a simple SELECT that should return\
    \ exactly one row from “Projects”, and only the “Name” column from this. The limiting\
    \ factor is the WHERE clause which filters the answer and only gives us that match\
    \ the expression. WHERE can - and typically should - also be used in UPDATE and\
    \ DELETE.\n\nListing 4.1: Simple Select\n\n```sql\nSELECT Name\nFROM Projects\n\
    WHERE ProjectID = @ProjectID\n```\n\nThere should never be more than one row in\
    \ the result of this query as we are filtering with a private key. We expect more\
    \ than zero rows as we are using a key from an earlier result. But what if the\
    \ project has been deleted? Wouldn't that mean that 0 rows are returned? Yes,\
    \ but in this application, projects are normally deleted - only closed for further\
    \ entries. Otherwise hours would get \"lost\".\n\nAs stated, projects are not\
    \ deleted, but nevertheless there are not many of them. So instead of querying\
    \ for individual pieces of information on single projects in Listing 4.1, it makes\
    \ more sense to fill a C# dictionary for general lookup when the application is\
    \ initialized. The T-SQL for this is shown in Listing 4.2. This time all projects\
    \ are needed - so no WHERE clause.\n\nListing 4.2: Select with Joins\n\n```sql\n\
    SELECT P1.ProjectID, P1.Name, P1.Parent,\nP2.Name As ParentName, E.FullName\n\
    FROM Projects AS P1\nLEFT JOIN Projects AS P2\n  ON P1.Parent = P2.ProjectID\n\
    LEFT JOIN Employees AS E\n  ON P1.ManagerID = E.EmployeeID\n```\n\nNow we have\
    \ two left joins, \"extending\" the rows of the Projects table. First it is joined\
    \ with itself. This is because Projects can have \"Parent Projects\" (but not\
    \ grandparents). To find these, we join on ProjectID - the private key - and Parent\
    \ - technically a \"foreign key\". Finally we join with the Employees table. The\
    \ Projects table only contain the foreign key to the EmployeeID, and to join the\
    \ managers name, we need to join with the Employees table.\n\nTable 4.2 shows\
    \ a sample output when running the SQL from Listing 4.2.\n\nTable 4.2: Projects\
    \ with Parents\n\n| ProjectID | Name | Parent | ParentName | FullName |\n|---|---|---|---|---|\n\
    | 1 | Vacation | -1 | NULL | NULL |\n| 2 | Sickness | -1 | NULL | NULL |\n| 3\
    \ | Venus | 0 | NULL | Klaus Elk |\n| 4 | Mercury | 0 | NULL | Klaus Elk |\n|\
    \ 5 | Earth | 0 | NULL | Klaus Elk |\n| 6 | Mars | 0 | NULL | Klaus Elk |\n| 7\
    \ | Jupiter | 0 | NULL | Peter Nielsen |\n| 8 | Saturn | 0 | NULL | Klaus Elk\
    \ |\n| 9 | Uranus | 0 | NULL | Klaus Elk |\n| 10 | Neptune | 0 | NULL | Klaus\
    \ Elk |\n| 11 | Phobos | 6 | Mars | Klaus Elk |\n| 12 | Deimos | 6 | Mars | Klaus\
    \ Elk |\n| 13 | Moon | 5 | Earth | Klaus Elk |\n| 14 | Titan | 8 | Saturn | Klaus\
    \ Elk |\n| 15 | Enceladus | 8 | Saturn | Klaus Elk |\n| 16 | Io | 7 | Jupiter\
    \ | Peter Nielsen |\n| 17 | Europe | 7 | Jupiter | Peter Nielsen |\n\n### 4.1.3\
    \ INSERT, UPDATE AND DELETE\n\nListing 4.3 shows a typical INSERT. In SQL rows\
    \ are inserted one per command only. It is possible to do an insert with several\
    \ rows. However, the code is cleaner when single rows are inserted - possibly\
    \ inside a loop. The downside is that this causes more trips to the database.\
    \ The upside is that we will reuse the execution plan. There are no private keys\
    \ in the relevant table - MyProjects is an association or pair of foreign keys.\
    \ As stated earlier, it is created with a constraint - assuring that there is\
    \ max 1 row an error in C#. Listing 4.4 shows the corresponding DELETE. Note that\
    \ again we see the WHERE clause. In this case it is very important. Without the\
    \ WHERE, the statement will delete all rows.\n\nListing 4.3: Simple Insert\n```sql\n\
    INSERT INTO MyProjects (ProjectID, EmployeeID)\nVALUES (@ProjectID, @EmployeeID)\n\
    ```\n\nListing 4.4: Simple Delete\n```sql\nDELETE FROM MyProjects\nWHERE ProjectID\
    \ = @ProjectID AND EmployeeID = @EmployeeID\n```\n\nListing 4.5 shows an update\
    \ of an existing row. Again we see the important WHERE clause.\n\nListing 4.5:\
    \ Simple Update\n```sql\nUPDATE Projects\nSET Name = @Name, ProjectID = @ProjectID,\
    \ Category = @Category, GroupID = @GroupID\nWHERE ProjectID = @ProjectID\n```\n\
    \nA good trick when doing DELETEs and UPDATEs is to start by creating a similar\
    \ SELECT to test the WHERE part. When this returns all the relevant rows - and\
    \ only these - you can substitute the SELECT with the command. Still you might\
    \ want to test on a non-production version as well.\n\n## 4.2 Next SQL\n\nIn the\
    \ following we will look at some more advanced T-SQL.\n\n### 4.2.1 Identity\n\n\
    When discussing keys in Chapter 2, I recommended the use of surrogate keys - especially\
    \ the “Identity” running number generated by SQL Server. Often, when a row has\
    \ been inserted and such a key created, you want to know it in your code. One\
    \ reason is that it might be needed right away as a foreign key in another table.\
    \ You could query for it, but this means yet another visit to the database and\
    \ without the key you need it becomes a “Catch-22”. Much more efficient to get\
    \ the key right away. This is demonstrated in Listing 4.6.\n\nListing 4.6: Insert\
    \ with new Identity\n```sql\nINSERT Main (EmployeeID, Date, ProjectID, Hours,\
    \ Comment)\nOUTPUT INSERTED.MainID\nVALUES (@EmployeeID, @Date, @ProjectID, @Hours,\
    \ @Comment)\n```\n\n### 4.2.2 Group By\n\nA report is needed per employee states\
    \ the projects that this person has worked on with monthly sums. The solution\
    \ is found in Listing 4.7. By using the T-SQL \"SUM\" command, a new virtual column\
    \ is created - here named \"Total\". The ROUND function rounds the number to an\
    \ integer. The YEAR and MONTH - together with the GROUP BY - organizes the sums\
    \ into \"amortized\" values per month per year. There is no guarantee that all\
    \ this comes in the right order. This is why there is no ORDER BY.\n\nThis all\
    \ may look a little complex, but it is actually not difficult to write. However,\
    \ you get incredibly value for the few lines of code. The speed with SQL Server\
    \ through all data and sending back aggregated numbers is amazing.\n\nListing\
    \ 4.7: Amortized Sums\n```sql\nSELECT Employees.FullName, Employees.Department,projects.ProjectID\n\
    YEAR(main.Date) AS Year, MONTH(main.Date) AS Month\nROUND(SUM(main.Hours),0) as\
