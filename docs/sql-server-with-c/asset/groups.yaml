    # Chapter 3


    # TimeReg Database


    # 3.1 Introduction


    I have tried to make TimeReg not only for top management. Project managers can
    analyze time-consumption on sub-projects, and developers can manage their vacation
    etc. You may download the sample, complete with a small sample database, and use
    it while you read the book. Or you may simply read the text and continue.


    # 3.2 TimeReg Requirements


    Basically the requirement for the TimeReg application was something like:


    > The daily reporting of hours on projects must be simple, as this is the most
    common operation. This could e.g. be in a week-based form - pretty much like the
    time-table school-children has. Somehow it would be nice if not just hours is
    noted, but also a free-text comment. Users should only see whatever projects they
    have previously selected as relevant - “My Projects”- not other people projects.
    All users must be able to create simple reports directly in the program. It must
    be easy to save these in an Excel-friendly format. Only managers should be able
    to easily see other employees sickness and vacation. A project-manager should
    be able to easily see accumulated numbers on sub-parts of a project. We want to'
  - "[PAGE 46]\n\nable to break down the work on a project into the individuals or\
    \ departments that delivered the work. The program should be able to automatically\
    \ transfer hours on customer-specific projects to another, Oracle-based, database\
    \ from billing is already done (not included in the sample).\n\nFigure 3.1 shows\
    \ a Power-Point version of the main view requirements, created for a review within\
    \ the management team. It may not be the best way to demonstrate a user-interface,\
    \ but the point is that it was easy to create. Compare this to Figure 1.1, which\
    \ shows the resulting program, and you will find that the simple Powerpooint does\
    \ a pretty neat job.\n\n# The User View\n\n| My Projects | Monday 10 | Tuesday\
    \ 11 | Wednesday 12 | Thursday 13 | Friday 14 |\n|---|---|---|---|---|---||\n\
    | Bilbo | 3.5 | | | | |\n| Gandalf | 2 | | | | |\n| Boromir | | | 8.2 | Right\
    \ Click to edit comments (Change background color) | |\n| Prev | | | | | Next\
    \ |\n| Sick | | | | | |\n| Vacation | 5.5 | 7.0 | 8.2 | | |\n\n+   * MyProjects\
    \ are originally chosen from a down box (Special Form)\n    * Any employee can\
    \ choose any existing project\n    * Once a project stays in the employees list....\n\
    \    * Until taken out. No data left in database.\n    * Sick & Vacation are generally\
    \ always there (Use 8hrs/day on this)\n* Hours are entered in the cells – typically\
    \ more accurate than 0.5 hrs - not a req.\n* Right-Click on cell to enter comment.\
    \ Change background if comment exists.\n\nFigure 3.1: Powerpoint Requirement Spec\
    \ for main view\n\n# 3.3 Logical Design\n\nDatabases are designed top-down. There\
    \ is a High-Level design in which the main entities (tables) are found and relations\
    \ are defined, based on the business model. Then there is a low-level design where\
    \ data-types, indexes, constraints and views ect found. All these things we will\
    \ get back to in Chapter 4. These two levels are often called Logical Design and\
    \ Physical Design. Coming from the world of hardware and embedded software, I\
    \ find the term “Physical Design” confusing, but it is commonly used. So let's\
    \ get on with the logical design of TimeReg:"
  - '[PAGE 47]


    # 3.3. LOGICAL DESIGN


    LOOK AT THE REQUIREMENTS. TRY ALL NOUNS AS CANDIDATES FOR ENTITIES (TABLES). THEN
    ALL ATTRIBUTES FOR THESE AS COLUMNS IN THE TABLE. THE INDIVIDUAL ITEMS THEN BECOME
    THE ROWS.


    The following nouns are found in the requirements for the sample: Time-Registration,
    Employees, Projects, Sub-part of project, Departments, Comments, Hours, Weeks,
    Users, Vacation, Sickness, Reports, Managers, Operations, Numbers, Individual,
    Work. Let''s take them one-by-one:


    +   - Time-Registration

    This is the overall purpose and thus is not a table, but the entire system.


    +   - Employees

    This is a good candidate for a table. This table must contain all relevant information
    that pertains to the specific Employee - e.g. “Netname”, Salary-Number (Employee
    Number) and Department (see below). I decided to use Identity key called EmployeeID
    in order to be independent of people changing names etc. I might have used the
    Salary-Number, however, I suspected that there might be people without such -
    e.g. consultants or students.


    +   - Department

    This is an interesting case. As stated above, Department is chosen as an attribute
    of (column in) in the Employees table. This is definitely in the gray-zone. If
    there is a Department without Employees we cannot see it. In fact, we cannot insert
    a new Department - we need to add an Employee within the Department to get it
    into the database. This is the Insert Anomaly. What is wrong? Department is a
    non-key column. According to 2NF these columns must depend on what the primary
    key identifies. Does the Department depend on the Employee? No - at least not
    in a database-technical sense. It would correct to have a foreign key in the Employees
    table, with a relation to a private key in a Departments table. That would make
    it a key-column instead of a non-key column. We would satisfy 2NF, and with a
    Departments table we would be able to insert departments before staffing them
    - no Insertion Anomaly. In this case it makes little sense - should an empty department
    exist, there would be no Hours to register anyway, and we don''t. So for the sake
    of'
  - '[PAGE 48]


    simplicity - and performance - Department become an attribute in Employees.


    Later in the TimeReg project I needed a drop-down list of Departments in order
    to allow managers to filter on the work sourced by their own department. Lacking
    a Departments table, I did not have such list. This is the only time I had to
    resort to the DISTINCT SQL keyword, which traverses a table and gives a list of
    all unique values in a given column. In a larger system, this would not be performance
    optimal.


    +   - Projects

    Another candidate for a table. Projects have attributes that become columns -
    like their number in various external systems and a name. A surrogate Identity
    - ProjectID is introduced. This allows projects to be created independent of various
    formal number-systems. These may be assigned, or not at all. This allows a department-manager
    to have tasks that are not really official projects - like tool-support. As the
    system became more formalized, a ManagerID was later introduced with specific
    access rights.


    +   - Sub-Parts of Projects

    Project managers like to see statistics for sub-parts of a project. I decided
    that a project could be a child of another project but only one level. No grand-parents.
    To handle this, a “Parent” column is introduced. This holds the ProjectID of the
    parent project. ProjectID is an Identity and thus normally 1 or greater. If this
    is less than 1 the Project is a parent. I decided to use 0 for “Normal” parent
    projects and -1 for special projects that are only included in visible exports
    when these are performed by managers. These projects are typically Vacation and
    Holidays. This self-referencing later made queries much more complex than otherwise
    necessary - as we shall see.


    +   - My Projects

    This is another interesting case. Since every employee might work on a multitude
    of projects, we would need to introduce an unknown amount of ProjectID columns
    in the Employee table if this is where we store the projects for a given Employee.
    This would break 1NF. The exact same problem arises if we want to store all relevant
    EmployeeIDs for each Project in the Projects table. The problem is that we do
    not have a 1:n relation, but an m:n relation. The solution to'
  - '[PAGE 49]


    # 3.3. LOGICAL DESIGN


    this problem is an association (or junction) - MyProjects. This table only holds
    two columns: a foreign key with a ProjectID and a ditto with EmployeeID. There
    may be many rows with the same of either of the foreign keys, but only one with
    a given pair - a good case for a Constraint, as described previously. In this
    case we only have two columns, but association tables can have more.


    +   - Operation relates to the manual input of Time-Data and is no candidate for
    a table.


    +   - Report This might sound like a candidate for a table, but as this is the
    output of calculations (typically sums) it should not be a table in our database,
    but the result of one or more SQL operations on data in the database. The TimeReg
    database is Transactional - by the most common action performed, is typing in
    New Hours. If this was a rare thing, while reports were done all the time, we
    would say that it was Analytic. In such a case data might actually go into tables
    for performance reasons - saving a lot of JOIN''s in the SELECT statements sums
    when new data is entered - something that we don''t need in this design.¹ This
    relates to the OLTP versus OLAP discussion.


    +   - Users This is the same as Employees and Individuals. The term “Develop-ers”
    was also used as this was an R&D Department.


    +   - Managers This might seem to be a new table, but managers are also employees.
    In this case I decided to have a binary column in the Employees table called SuperUser,
    as I (correctly) suspected that certain employees in HR or Finance might be given
    the same rights as managers.


    +   - Hours This is yet a candidate for a table. In the end I decided that Hours
    was the name of the most important attribute. Instead I called the table Main.
    The reason for this name is that this becomes ‘the mother of all tables’, being
    the only table that has many daily inserts. Like with Projects and Employees,
    a surrogate private key is used - “MainID”. Main has foreign keys for EmployeeID
    and ProjectID.


    > ¹Reconsider your design if triggers are needed.'
