    \ | 22 |\n\n## 4.3. 关于 CRUD 的收获\n\n从这几个示例中我们可以推断出一些经验法则：\n\n- `SELECT` 语句可能会变得非常复杂，特别是当需要带有聚合数字的报表时。这与\
