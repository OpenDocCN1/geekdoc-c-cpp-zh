    Figure 4.1: Execution Plan without Index


    We see that the query uses 31 ms of CPU time. This deviates from one run to another
    but stays in this area. The Worktable mentioned here is a temporary object created
    by SQL Server. For this exercise we focus on the “Main” table. The logical reads
    are reads from memory cache, while physical reads are from disc. If we look at
