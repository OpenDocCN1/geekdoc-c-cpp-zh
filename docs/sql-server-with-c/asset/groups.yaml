    ## 2.5.6 订单系统 3NF


    回到图 2.1 中的订单系统，我们看到它满足了 1NF - 也许除了地址（Address）。地址列是由多个字符串组成的，如街道名、门号等。地址是否可以拆分？这值得吗？我们已经将邮政编码（ZIP）和国家（Country）作为单独列。街道号（street-no）和楼层号（floor-no）应该是独立的列吗？这真的值得吗？如果我们接受地址（Address）是**原子性**的，那么
    1NF 就满足了。


    订单系统也满足 2NF，因为所有非键列都依赖于主键（whole key）。3NF 也满足吗？在所有表中，所有非键列都依赖于“没有任何”。


    使用数据库接口来“Altium”，它提供了组件列表。这个表可以包含数千行。对于每一行，都有预期的组件类型（Component Type）、值（Value）以及其他列，但这些违反了
    1NF。最麻烦的后果是，Altium 选择了这种布局，为了方便那些人使用 - 或者继续使用 Excel。这样做是以牺牲灵活性为代价。


    ## 2.6 连接 (Joins)


    数据库最重要的概念之一是连接（Join）。在这里，我们将一个表的主键与另一个表的特定外键“对齐”（align），生成一个新的更宽的临时表。有多种方法可以实现：


    ![](img/9aee98b780f9e4bf3647bac352df7_350.png)


    图 2.3：最重要的连接


    连接（Join）。在 SQL 中，简单的 JOIN 等同于 INNER JOIN。这就是我们在图 2.3 左侧看到的。连接生成的临时表仅包含两个表中键匹配的元素。由于同一个主键可能有多个外键实例，新表可能会有多个行，对应每一个这些实例。另一方面，如果键仅作为主键或仅作为外键，后者的情况听起来不对
    - 怎么会有没有对应主键的情况？可能没有声明约束（我们将得到这个）。直到我们决定编写 SQL JOIN 语句。


    左连接 (Left Join)

    这有时被称为 LEFT OUTER JOIN。SQL LEFT JOIN 见图 2.3 右侧。在这种情况下，表 A 中的所有行都会出现在结果临时表中。当在表
    B 中找到匹配的键时，行会从此处扩展数据。而那些“缺失的列”将填充为 NULL。


    右连接 (Right Join)

    它的工作方式与左连接相同 - 但现在是完整的 B 表和来自 A 的匹配。我个人从不用右连接 - 我只需引用表并使用左连接。


    全连接 (Full Join)

    这也被称为 FULL Outer JOIN，图中未显示。它包含了两个表的所有行 - 如果通过公共键可以匹配，其余列则为 NULL。


    为了演示连接，我们将重用商店系统 - 现在有了数据。这些数据被简单写入表 2.11 到 2.14 中，使用了 Management Studio 的“编辑前
    200 行”。在现实生活中，它们是用应用程序写入的。


