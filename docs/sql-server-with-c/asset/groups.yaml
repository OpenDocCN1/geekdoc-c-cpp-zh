    # 2.5. NORMALIZATION


    OrderItem2 etc as columns in Orders table. The programmers first instinct is to
    have a reference to an OrderList - another table. Unfortunately, this would mean
    that each different row in Orders should have its own table with OrderItems -
    dynamically created as orders are created. That is exactly how programs work with
    collections, but it is not how databases are organized.


    Instead the relation is turned upside down, and we have one big table of OrderItems
    referring back to the Orders table. And to the Products table. This way of handling
    m:n relations is called an Association Table. An association table has rows with
    foreign keys only - no private keys. Non-key columns as our Quantity may occur.
    Note that sometimes association tables are called Junction Tables.


    # 2.5.5 Students Database 3NF


    The use of an association table is also the solution to our Students case. Instead
    of a single table we now have three - see Tables 2.8, 2.9 and 2.10. StudentNo
    and ClassID are now private keys respectively in the first and the second of these
    tables, while they are both foreign keys in the third.


