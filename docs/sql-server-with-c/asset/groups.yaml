    # CHAPTER 5. OVERALL DESIGN


    ## C# Application


    | Datasets TableAdapter | LINQ To SQL | Entity Framework | Custom | Custom |

    | :--- | :--- | :--- | :--- | :--- |

    | ADO.net | | | | |

    | SQL-Server | OLE DB | ODBC | | |

    | Oracle Managed Data Access | | | | |

    | Oracle Database | | | | |


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_82_0.png)


    The figure also includes Oracle Managed Data Access, since this is created in
    such a way that it looks pretty much like ADO.net. In this way you can use Oracle
    through one of the frameworks and ADO.net, or you can use it more directly via
    ADO.net - Oracle Managed Data Access. We will look more closely into this in Section
    7.6.


    As mentioned in Subsection 2.5.6, I once developed a database for maintaining
    components for Altium CAD system. The database was created in Management Studio
    and imported into Visual Studio, which generated a number of TableAdapters for
    Datasets - the leftmost framework in Figure 5.1. The outcome is shown in Figure
    5.2 (low quality).


    It was really a quick way to get started, but sometimes very frustrating. There
    is a saying: "crossing the river to get". That was how it felt. Every little change
    was buried deep in a dialog - maybe even had to be written into the code. When
    a solution to a problem was found earlier, I had a hard time finding it whenever
    I wanted to reuse it. It was not fun, and I decided that I would get into this
    again. As we will see later, in Section 7.5, ADO.net actually has its own “adapter”
    named SqlDataAdapter, working with DataSet. This is overlooked in all the noise
    around frameworks due to similarity.


    ## 5.1 DATABASE FRAMEWORKS


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_83_0.png)


    Figure 5.2: Component TableAdapters


    Even though "Entity Framework" is now recommended by Microsoft, and probably better
    than TableAdapters, it is not known for its speed and easy customization. This
    quickly can become old stuff with "LINQ to SQL" which was very hot for a few years.
    Whenever this happens you are probably better off with standard-based code than
    some abandoned. I use LINQ, but only for extension classes that makes it easier
    to work with.


    In reality ADO.net is a very nice framework by itself. Contrary to the many frameworks
    on top of ADO.net, it has been present and useful since version 1.0. To a large
    degree it existed before .net. ADO originally meant ActiveX Data Objects. ActiveX
    is also known as COM. Some of the basic concepts survived. Twenty years ago I
    worked with old ADO. Even then it had "Connection" and "Command" objects etc.


    I recommend "tailored" interface based on ADO.net, following few simple patterns.
    These patterns are used with TimeReg. They were directly reusable when making
    a similar interface to Oracle. We will go into details with the custom interface/layer
    in this book. The patterns basically originate from various application notes
    and personal inventions.


    ## 5.2 Layers and State


    One of the major challenges in program design is to create the right number of
    layers. With too few layers the code gets messy. With too many layers you go through
    a lot of motions that mostly generate heat. It sometimes feels as if the more
    layers you put in - the more advanced and fancy is the design. Of course that
    is not the case.


    There are many different patterns - Model-View-Controller, Model-View-Presenter,
    Model-View-Model etc. TimeReg is a small project, and I decided that for the UI
    part I would simply go with the flow. This means one class per dialog/screen.
    I used a simple and classic Windows Forms approach. I made a fully functional
    version on WPF - Windows Presentation Foundation - but I felt that I lost control
    and dropped it. You may prefer WPF, and you will still be able to use 99% of the
    patterns in this book.


    The major downside of this simple design is that there is no easy to do automated
    testing. Some of the patterns mentioned above "fake it" as real users - bypassing
    only a thin UI layer. In this project all tests were manual - performed on a local
    SQL Express installation. Regular backups from the production server were restored
    onto its server for tests.


    A completely different alternative to Forms and WPF is to create a Web-based solution
    using ASP - Active Server Pages. This is closer to WPF with its "code behind".
    You can also say that''s just another way of Model-View-Controller. I have not
    tried an ASP-version of TimeReg yet.


    With the application being so database-centric, it was clear that a layer was
    needed that would handle - and isolate - all the database interactions. Previously
    described, this was not to be a standard Microsoft framework. I


    CHAPTER 5. OVERALL DESIGN


    ended with one “library” for interfacing with SQL Server called “DBUtil”, and
    another one for the Oracle export. As this book is about SQL Server, we will focus
    on the first, and show a sample from the latter.


    The UI layer has classes that are instantiated with the given dialog, and left
    for garbage collection when the dialog is closed. They only carry transient state.
    The same goes for the DBUtil layer, which mainly serves as a function library.
    It is used for fetching or storing data in the database, but in-between these
    calls it does not keep state. The DBUtil layer has a number of classes that are
    instantiated and passed to the caller of the static functions. This is also transient
    state. This layer gets assistance from ADO.net - handling connection-state and
    even pooling connections to improve performance.


    Why all this talk about state?


    > IT IS ALWAYS BENEFICIAL TO HAVE A CLEAR IDEA ABOUT WHERE STATE IS KEPT. IF SEVERAL
    LAYERS KEEP OVERLAP STATE, THERE IS A HUGE RISK THEY ARE GOING TO DISAGREE AT
    SOME TIME.


    This leads to all kinds of strange behaviors. Better to keep specific state only
    one place. In our case, the main keeper of state is obviously the database itself
    - keeping state permanently, even if power is cycled. This is also known as Persistent
    State. Finally, there is also state outside of the database for the duration of
    the client application. This is called Application State.


    Clearly, application state must be preserved somewhere: the identity of the current
    user, the chosen settings and whatever user may use. TimeReg is a small project,
    and I decided that for the UI part I would simply go with the flow. This means
    one class per dialog/screen. I used a simple and classic Windows Forms approach.
    I made a fully functional version on WPF - Windows Presentation Foundation - but
    I felt that I lost control and dropped it. You may prefer WPF, and you will still
    be able to use 99% of the patterns in this book.


    The major downside of this simple design is that there is no easy to do automated
    testing. Some of the patterns mentioned above "fake it" as real users - bypassing
    only a thin UI layer. In this project all tests were manual - performed on a local
    SQL Express installation.


    The Model layer is implemented as a Singleton class. A singleton is a class that
    always is instantiated once. The singleton pattern is practical because it is
    almost as easy to use from any class as static functions. You do not need to “carry
    a reference around” - you simply invoke the singleton when needed. The main reason
    for the “Model” name is that it contains the most complex parts of business. Table
    5.1 is an overview of the layers used in TimeReg - from top to bottom.


    ## Table 5.1: Layers in TimeReg Application - Top-Down


    | Layer | State | Function |

    | :--- | :--- | :--- |

    | UI | Transient | Handle the Look & feel, logic, menus and events for each form.
    |

    | Model | Application | User settings and cached collections |

    | DBUtil | Transient | Helper classes for static functions interface between database
    and collections |

    | ADO.net | Connection | ADO implements Connection Pooling and generally keeps
    state for connections. |

    | Database | Persistent | Stores data from all users - always. |

