    As mentioned in Subsection 2.5.6, I once developed a database for maintaining
    components for Altium CAD system. The database was created in Management Studio
    and imported into Visual Studio, which generated a number of TableAdapters for
    Datasets - the leftmost framework in Figure 5.1. The outcome is shown in Figure
    5.2 (low quality).


    It was really a quick way to get started, but sometimes very frustrating. There
    is a Saying: "crossing the river to get". That was how it felt. Every little change
    was buried deep in a dialog - or maybe even had to be written into the generated
    code. When a solution to a problem was found earlier, I had a hard time finding
    it whenever I wanted to reuse it. It was not fun, and I decided that I would not
    get into this again. As we will see later, in Section 7.5, ADO.net actually has
    its own powerful “adapter” named SqlDataAdapter, working with a so-called DataSet.
    This is easy overlooked in all the noise around frameworks and especially the
    TableAdapters due to the naming similarity.'
  - '[PAGE 83]


    # 5.1. DATABASE FRAMEWORKS


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_83_0.png)


    Figure 5.2: Component Database TableAdapters


    Even though "Entity Framework" is now recommended by Microsoft, and probably better
    than the TableAdapters, it is not known for its speed and easy customization.


    With Microsoft new fancy stuff quickly can become old "legacy" stuff. This seems
    to have happened with "Ling-To-SQL" which was very hot for a few years. Whenever
    this happens you are probably better off with custom standard-based code than
    some abandoned wizardry. I do use Linq, but only for the extension-classes that
    makes it easier to work with collections using "lampada" expressions.


    In reality ADO.net is a very nice framework by itself. Microsoft refers to it
    as Middleware. Contrary to the many frameworks on top of ADO.net, it has been
    present and useful since .net version 1.0. To a large degree it existed before
    .net. ADO originally meant ActiveX Data Objects. ActiveX is the technology generation
    before .net - also known as COM. Some of the basic concepts have survived all
    they. Twenty years ago I worked with the old ADO. Even then it had "Connection"
    and "Command" objects etc.


    I recommend a custom "tailored" interface based on ADO.net, following a few simple
    patterns. These patterns are used with TimeReg. They were directly reusable when
    making a similar interface to Oracle.


    We will go into details with the custom interface library/layer in this book.
    The patterns basically originate from various application notes and a few'
  - '[PAGE 84]


    # CHAPTER 5. OVERALL DESIGN


    personal inventions. Thus, the layer is on one hand tailored to the specific purpose,
    but on the other hand based on patterns that are easily reused. Extending the
    database with new tables and queries is now a routine exercise.


    # 5.2 Layers and State


    One of the major challenges in program-design is to create the right number of
    layers. With too few layers the code gets messy. With too many layers you go through
    a lot of motions that mostly generate heat. It sometimes feels as if the more
    layers you put in - the more advanced and fancy is the design. Of course that''s
    not the case.


    There are many different patterns - Model-View-Control, Model-View-Presenter,
    Model-View-Model etc. TimeReg is a small-one project, and I decided that for the
    UI-part I would simply "go with the flow" and create simple forms that Visual
    Studio facilitates them. This means one class per dialog/screen. I used a simple
    and classic Windows Formsbased approach. I made a fully functional version on
    WPF - Windows Presentation Foundation - but I felt that I lost control and dropped
    it. You may prefer WPF, and you will still be able to use 99% of the patterns
    in this book.


    The major downside of this simple design is that there is no easy to do automated
    testing. Some of the patterns mentioned above test-scripts to "fake it" as real
    users - bypassing only a thin UI-layer. In this project all tests were manual
    - performed on a local SQL Express installation. Regular backups from the production
    server were restored onto its server for tests.


    A completely different alternative to Forms and WPF is to create a Webbased solution
    using ASP - Active Server Pages. This is closer to WPF with its "code behind".
    You can also say that''s just another way of Model-View-Control. I have not tried
    an ASP-version of TimeReg - yet.


    With the application being so database-centric, it was clear that a layer was
    needed that would handle - and isolate - all the database-interactions. Previously
    described, this was not to be a standard Microsoft framework. I'
  - '[PAGE 85]


    # 5.2. LAYERS AND STATE


    ended with one “library” for interfacing with SQL Server called “DBUtil”, and
    another one for the Oracle export. As this book is about SQL Server, we will focus
    on the first, and show a sample from the latter.


    The UI-layer has classes that are instantiated with the given dialog, and left
    for garbage-collection when the dialog is closed. They only carry transient state.
    The same goes for the DBUtil layer, which mainly serves as a function library.
    It is used for fetching or storing data in the database, but in-between these
    calls it does not keep state. The DBUtil-layer has a number of classes that are
    instantiated and passed to the caller of the static functions. This is also transient
    state. This layer gets assistance from ADO.net - handling connection-state and
    even pooling connections to improve performance.


    Why all this talk about state?


    > IT IS ALWAYS BENEFICIAL TO HAVE A CLEAR IDEA ABOUT WHERE STATE IS KEPT. IF SEVERAL
    LAYERS KEEP OVERL STATE, THERE IS A HUGE RISK THEY ARE GOING TO DISAGREE AT SOMETIME.


    This leads to all kinds of strange behaviors. Better to keep specific state only
    one place. In our case the main keeper of state is obviously the database itself
    - keeping state permanently, even if power is cycled. This is also known as Persistent
    State. Finally, there is also state outside of the database for the duration of
    the client application. This is called Application State.


    Clearly, application state must be preserved somewhere: the identity of the current
    user, the chosen holiday-scheme and whatever sets the user may use. This is kept
    in the Model Layer. This Model layer is implemented as a Singleton class. A singleton
    is a class that always is instantiated exactly once. The singleton pattern is
    practical because it is almost as easy to use from any other class as static functions.
    You do not need to “carry a data-reference around” - you simply invoke the singleton
    when needed. The main reason for the “Model” name is that it contains the most
    complex parts of the Business Model. Table 5.1 is an overview of the layers used
    in TimeReg - from top to bottom.'
  - '[PAGE 86]


    # Table 5.1: Layers in TimeReg Application - Top-Down


    | Layer | State | Function |

    | --- | --- | --- |

    | UI | Transient Dialog | Handle the Look & feel, logic, menus and events for
    each form. |

    | Model | Application | User settings and cached collections |

    | DBUtil | Transient | Helper classes for static functions interface between database
    and Collections. |

    | ADO.net | Connection | ADO implements Connection Pooling and generally keeps
    state for connections. |

    | Database | Persistent | Stores data from all users - always. |


    The most important rule when designing and implementing layers is:


    ANY LAYER MUST NOT “KNOW” ANYTHING ABOUT ANY LAYERS ABOVE IT.


    The database is completely ignorant of the layers above and surely ADO.net knows
    nothing about our code. This is one of the advantages of using a 3rd party party
    library. I believe that the rule also applies for the other layers. There is also
    a secondary layer that says:


    IN A TRULY LAYERED DESIGN EACH LAYER KNOWS ONLY ABOUT THE LAYER DIRECTLY BENEATH
    IT.


    This rule is hard to live up to, and sure enough: in our sample application the
    top UI layer knows the model layer and it knows DBUtil. If this was avoided, we
    would need a lot of functions in the model layer that more or less copied data
    between the layer above and beneath. It did not make sense in this scenario. Incidentally
    - this also applies for the TCP/IP stack where the upper layers know more than
    just the layer directly beneath it..'
