    如前所述——当执行 `INNER JOIN` 时，我们得到的是交集，即在所有连接表中键值匹配的行。在原始表中，（内）连接表中没有 `NULL` 值。通过 `LEFT
    JOIN`，我们获得了来自 `Products`（左表）的所有行，以及来自 `OrderItems`（右表）中匹配的行。由于存在未售出的 `Products`，相应的行现在在
    `OrderItem` 列中包含 `NULL` 值。


    我们还发现，两个输出中的共同行顺序并不相同。SQL 不保证行顺序——除非你显式指定了它。我们将在第 4 章介绍这一点。


    ## 2.7 数据类型与 NULL


    2.18 显示了 T-SQL 中常用的数据类型。字符串有四种类型——包含和不包含 Unicode，以及具有固定或动态长度的间隔。例如 "nchar" 中奇怪的
    ''n'' 原因是它最初意为“National”（国家级）字符。实际类型对应于 C 类语言中的经典 `float`，而 T-SQL 的 "float"（不带长度指定符）对应于
    C 类型的 `double`。


    稍后我们看到 `TimeReg` 示例大量使用了 `datetime` 格式。这可能并不意外，因为 `datetime` 每个时间戳占用 8 字节，而 3
    字节就足够存储一个不带时间的有效日期。当我设计物理层时（我们将在第 3.4 节回到这一点），尚不清楚是否会产生比较同一日期内时间戳的需求，因此我选择了稳妥的解决方案。这影响了我们将编写的
    C# 代码，而且可能不会进行清理。


    我们知道某些零值，如空字符串和整数的数值 0。这些是特定类型的合法值。这与 `NULL` 不同，`NULL` 是“缺失”或“未知”值——非常类似于面向对象编程（OOP）中的空指针。在以下场景中
    `NULL` 是必要的：


    - 外连接（`outer JOIN`），正如我们之前在表 2.17 中看到的那样。在这种情况下，我们用另一个表的列来扩展现有的行。例如在 `LEFT JOIN`
    中，左表中会有某些行在右表中没有匹配的值——但我们希望显示出某些内容，此时 `NULL` 是合理的。不过，可以在 SQL 连接语句中指定要使用的默认值。


    - `INSERT` SQL 语句可能只对某些列提供值。其余部分怎么办？如果在创建表时为相关列设置了默认值，则使用这些默认值；否则使用 `NULL`。


    表 2.18：T-SQL 选数据类型


    | T-SQL | .Net | 含义 |

    | :--- | :--- | :--- |

    | bigint | Int64 | 8 字节有符号整数。 |

    | int | Int32 | 4 字节有符号整数。 |

    | bit | Boolean | 真/假。 |

    | real | Single | 4 字节经典 "float"。 |

    | float | Double | 8 字节经典 "double"。 |

    | date | - | 3 字节。年份 1-9999。 |

    | datetime | DateTime | 8 字节。年份 1753-9999 及秒级分数。 |

    | datetime2 | DateTime | 6-8 字节。年份 1-9999 及秒级分数。 |

    | char(n) | Byte Array | n 字节固定存储。注意：默认情况下字符串会用空格填充。使用字节（最大 n）+ 2 动态存储。 |

    | varchar(n) | Byte Array | 可能比 `char` 节省空间，但访问较慢。2*n 固定存储 - 用空格填充。 |

    | nchar(n) | String | 2*(使用字节) + 2 动态存储。可能比 `nchar` 节省空间，但访问较慢。 |

    | nvarchar(n) | String | |


    处理 `NULL` 值可能会带来问题。如果为所有列定义了默认值，情况会变得简单一些。这些值用于 `INSERT`，但在外连接场景中不适用。有时，C# 的空合并运算符
    `??` 非常有用。它可以测试变量是否为 `null`。它可以与带有后缀 `?` 的可空类型一起使用。


    Listing 2.8：可空数据类型


    ```

    1 int? x = null; // x 可以 NULL 或 int

    2 // 如果 x 不是 NULL，则将 y 设置为 x

    ```


    （注：原文后部分存在大量重复的段落，译文已根据要求去重处理，避免重复输出。）

