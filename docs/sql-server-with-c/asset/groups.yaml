    # 8.3. CLASSIC CLASS CONCEPT


    # 8.3 Classic Class Concept


    The DBUtl layer presented so far is made up of static “worker” functions for doing
    the actual SQL-commands, and nested classes, instantiated into objects, holding
    and transporting the data. The nice thing about this concept is that a given nested
    data-class can be reused by several worker-functions. This is indeed used.


    As described in Section 4.5, Forecasts were introduced in the TimeReg application
    after a year or so. Just for the fun of it, I decided that this time I use a more
    classic object-oriented approach: Now SQL-commands would take place from within
    instantiated classes (not static), and these classes would also do all the data-mapping.


    Listing all the code would take up too much space, but you are welcome to download
    the code and have a look.


    Naturally this also works. There is a tendency towards becoming more “model-heavy”.
    Probably because they are their own “Data Transfer Object” to speak. The fact
    that this data part is inside the class instead of outside - possibly shared with
    other classes - allows for more specific handling. This is the whole idea of object
    orientation, and is absolutely not a problem.


    # 8.4 A Dapper alternative


    As stated earlier, it is easy to get caught up in Microsoft’s “Legacy Land”. Maintenance
    is one reason to get today’s flavor of framework. Another reason is that frameworks
    tend to be so helpful, which makes them huge and complex, and thus difficult to
    customize.


    This has left an open field for minor ORM - Object Relational Mapping tools. One
    tool that shows promise is Dapper. “Dapper” is an adjective that e.g. in old Hollywood
    movies was used about a man. Synonyms are “dashing”, “neat” and “well groomed”.
    Dapper is invented by the developers at StackOverflow - a fantastic site for all
    us developers. If you know StackOverflow, you also know that it works fast and
    efficient. The'
