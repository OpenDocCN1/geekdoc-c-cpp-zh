    # Preface


    In-between working with embedded systems, I have worked with PC-software. Sometimes
    the applications were “real” - sometimes internal tools. Many applications had
    databases within them, and I learned as I went along.


    I have tried various frameworks and tools, “strange” languages like Modular-2,
    and Object Oriented Databases, but it wasn''t until my most recent project that
    it felt really good. So what went right?


    I decided to write this book - to revisit the theory and code, to learn, and hopefully
    to pass on some know-how. I have written about all the subjects that became relevant
    in relation to the project - during design, implementation or maintenance.


    > Einstein said: “Everything should be as simple as possible, but not simpler”.
    You will see that I generally aim for simple solutions and simple tools. There''s
    a beauty in not throwing every tool and every pattern in the book into a solution.


    The first part of the book introduces general database theory and SQL - with SQL
    Server as the specific example. The second part is about the related C# programming.
    ADO.net is used “as is” without frameworks on top - being a time-proven framework
    by itself. The two parts of the book are bridged through a common sample - the
    project already mentioned.


    Full source can be downloaded - see links on https://klauselk.com.


    # About The Author


    Klaus Elk graduated as Master of Science in Electronics from the Danish Technical
    University of Copenhagen in 1984, with a thesis on Digital Signal Processing.
    He also holds a Bachelor degree in Marketing. For 30+ years he has worked in the
    private industry within the domains of telecommunication, medical electronics
    and sound and vibration. He has worked mainly with embedded systems, but also
    with PC software.


    In a period of 10 years Klaus Elk - besides his R&D job - taught at the Danish
    Technical University. The subjects were Object Oriented Programming (C++ and Java),
    and the Internet Protocol Stack. Today he is R&D Manager in Instrumentation at
    Bruel & Kjær Sound & Vibration. Klaus is also the author of "Embedded Software
    for the IoT" - editions 1 and 2.


    # Acknowledgements


    A big “Thank You” goes to my colleagues. They were the first subjected to the
    sample in this book: a time-registration system. Such a system is never popular
    among developers, but they took it standing. In this book I describe how the system
    was created in a way that bothered the developers as little as possible, while
    giving the best possible data to management. It even armored project-managers
    to explain why their projects were some times lagging behind.


    I also want to thank my manager - Lars Agerlin for letting me publish the sample
    code.


    Klaus Elk


    > ¹First edition has the rather lengthy name: Embedded Software Development for
    the Internet of Things


