    | 5 | Chair white | 599 | 3 | 5 | 2 |

    | 2 | Round Table mahogany | 2299 | 4 | 2 | |


    Listing 2.7: Left Join


    ```

    SELECT *

    FROM Products

    LEFT JOIN OrderItems ON

    Products.ProductID = OrderItems.ProductID

