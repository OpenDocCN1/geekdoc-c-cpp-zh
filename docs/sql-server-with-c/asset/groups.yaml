    # # Data Transfer Objects


    # ## 8.1 CellData Class


    It is time to look at the data-classes or Data Transfer Objects. We start with
    **CellData** which represents all data to and from the database that end up in
    a single cell in the main view in TimeReg. This is later used by **Week** which
    is a class that represents a week of data from a given Project.


    CellData is shown in Listing 8.1. The first thing we note is the member variables
    in lines 3-9, and how they have different access modifiers. Some are even **readonly**.
    This does not sound very productive. The point is that they are readonly - once
    created. This means that they are initialized in the constructor and fromหมือน
    cannot be changed. The ones that are **protected** may be changed by the class
    itself. This is done in **properties**. Note that it is possible to create properties
    directly without underlying member variables. This is the case for “Changed” and
    “InOracle”.


    You might argue that instead of all above we could simply have public member-variables.
    After all - this class is for moving data in out of a database. No encapsulation
    is here. However, we want to use CellData with databinding to UI-classes - and
    they look for properties - not membervariables. When you allow a UI-object to
    mess with your data, it makes sense to only allow it to write where it needs to.'
