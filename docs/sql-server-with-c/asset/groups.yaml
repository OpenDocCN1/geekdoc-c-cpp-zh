    ## 2.5.6 Order System 3NF


    Returning to the Order system from Figure 2.1, we see that it satisfies 1NF -
    except maybe for the Customer Address. The (street) Address column is probably
    made by several strings like street-name, street-number etc. When is an Address
    a list of values and when is it **atomic**? the jury is still out on this one.
    We have already taken ZIP and Country-code as separate columns. Should street-no
    and floor-no be maybe apartment number be columns of their own? Clearly the street
    address can be broken down, but this process requires us to foresee all sorts
    of addressing schemes. Is it really worth it? Probably not. If we accept the (street)
    Address as being “atomic”, 1NF is satisfied.


    The Order system also satisfies 2NF as all non-key columns depend on the (whole)
    key in all tables. Is 3NF also satisfied? Yes, in all tables the non-key columns
    depend on “nothing but the key”.


    I used a database-interface to “Altium”, which is a Computer-Aided-Design program.
    The interface supplies Altium with a list of electronic components. This table
    can contain hundred-thousands of rows. For each row there is the expected “Component
    Type”, “Unit”, “Value” and other columns, but there are also columns like Manufacturer1,
    Manufacturer2 etc. This violates 1NF. The most annoying consequence was that we
    were limited on the number of Manufacturers (and similar attributes). Probably
    Altium had chosen this layout to make life easy for all those that imported from
    – or continued to use - Excel. It is easy to use a flat excel sheet - at the cost
    of flexibility.


    ## 2.6. Joins


    One of the most important database-concepts is the Join. Here we “align” the private
    keys from one table with their specific foreign key counterparts from another
    table - generating a new wider, temporary table. There are a number of different
    ways to do this:


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_35_0.png)


    Figure 2.3: Most important Joins


    - Join. In SQL, the simple JOIN is the same as the INNER JOIN. This is what we
    see in Figure 2.3 on the left side. Result temporary table created by the join
    consists of only elements where there are matching keys in the two tables. As
    there may be several foreign key instances for the same primary key, the new table
    can have several rows with this private key - one for each of these instances.
    On the other hand, there will be no rows where a key exists only as a private
    key or only as a foreign key. The latter case sounds wrong - how can there be
    a foreign key without a corresponding private key? There may have no constraint
    declared (we will get to this). In fact the two key-columns in the two tables
    may have been created totally independent of each other - not as keys - until
    we just decided to write the SQL JOIN statement where we treat the columns as
    private/foreign keys.


    - Left Join

    This is sometimes known as a LEFT OUTER JOIN. The SQL LEFT JOIN is seen in the
    right side (sorry) of Figure 2.3. In this case all rows from table A appear in
    the resulting temporary table. Where matching keys are found in table B, the rows
    are extended with data from here. These rows are identical to the rows in the
    (INNER) JOIN. The new stuff here is that we also see the rows in table A that
    have no matches in table B. The “missing columns” are filled with NULLs.


    - Right Join

    This works the same way as a left join - but now with the full B table and the
    matches from A. Personally I never use a right join - I simply reference the tables
    in the opposite order and use the left join.


    - Full Join

    This is also known as a FULL Outer JOIN and is not shown in the figure. This includes
    all rows from both tables - matched when possible with common keys, and with NULL’s
    in the rest of the columns.


    In order to demonstrate joins we will reuse the Shop system - now with data. These
    data were simply written into tables 2.11 through 2.14, using Management Studio’s
    “Edit Top 200 Rows”. In real life they are written with an application.


