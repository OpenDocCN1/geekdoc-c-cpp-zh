    The star is an easy way to get data from all columns in the table. The names used
    in the output corresponds to the table column names. It is however not good habit
    to use the star in real applications. Another reason for specifically naming columns,
    instead of using the star, is to limit the output - as in Listing 2.5. The join
    effectively generates a new temporary table with all columns from all joined tables.
    This means that the key columns are shown in all occurrences - as private keys
    and foreign keys. You normally want to see a single instance, or maybe none if
    they are surrogate keys. The resulting table here is so wide, that not only the
    keys not shown - the table is also scaled down to fit the page. Finally, the “AS”
    in the SELECT renames the output column headers - in this case shorter names.


    Listing 2.5: Joins


    ```sql

    SELECT Orders.OrderNo AS Order, OrderDate, ShippingDate,

    Quantity AS Qty, FirstName AS First, LastName AS Last,

