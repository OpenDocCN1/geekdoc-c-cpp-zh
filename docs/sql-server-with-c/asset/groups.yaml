    \n在执行 DELETE 和 UPDATE 时，一个技巧是先创建一个类似的 SELECT 来测试 WHERE 部分。当它返回所有相关行 - 仅这些行时，你可以将\
    \ SELECT 替换为命令。你可能仍然想在非生产版本上进行测试。\n\n## 4.2 下一个 SQL\n\n接下来我们将查看一些更高级的 T-SQL。\n\
    \n### 4.2.1 Identity\n\n在第 2 章讨论键时，我建议使用代理键（surrogate keys） - 特别是 SQL Server 生成的\
