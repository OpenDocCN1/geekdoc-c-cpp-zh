    \n## 8.4 Dapper 的替代方案\n\n正如前面提到的，很容易陷入微软的“遗留之地”。维护是选择如今框架的原因之一。另一个原因是框架往往过于热心，导致它们变得庞大且复杂，因此难以自定义。\n\
    \n这为轻量级 ORM（对象关系映射）工具留下了开放空间。一种显示出前景的工具是 Dapper。\n\n"
