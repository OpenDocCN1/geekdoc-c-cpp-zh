    | :--- | :--- | :--- | :--- | :--- |

    | ADO.net | | | | |

    | SQL-Server | OLE DB | ODBC | | |

    | Oracle Managed Data Access | | | | |

    | Oracle Database | | | | |


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_82_0.png)


    该图还包含了 Oracle Managed Data Access，因为它的创建方式使得它看起来非常地和 ADO.net 相似。通过这种方式，你可以通过这些框架之一或
    ADO.net 来使用 Oracle，也可以通过 ADO.net - Oracle Managed Data Access 更直接地使用它。我们将在第 7.6
    节中详细讨论这一内容。


    正如第 2.5.6 节中提到的，我曾开发过一个用于维护 Altium CAD 系统组件的数据库。该数据库在 Management Studio 中创建并导入到
    Visual Studio，这为数据集生成了许多 TableAdapters - 即图 5.1 中左侧的框架。结果如图 5.2 所示（低质量）。


    这确实是一个快速上手的方法，但有时也非常令人沮丧。有句俗话说：“过河拆金石”。那种感觉就是如此。每一个微小的变化都深埋在对话框中 - 甚至必须写进代码里。当我之前发现一个问题的解决方案后，每当我想重用它时，都很难找到它。这并不好玩，我决定再次深入研究这个领域。正如我们稍在第
    7.5 节中看到的，ADO.net 实际上有一个名为 `SqlDataAdapter` 的自己的“适配器”，与 DataSet 配合工作。由于相似性，这在所有关于框架的喧嚣中被忽视了。


    ## 5.1 数据库框架


    ![](img/9aee98b7809f9e4bf3647b6ac35a2df7_83_0.png)


    图 5.2：组件 TableAdapters


    尽管微软现在推荐使用“Entity Framework”，它可能比 TableAdapters 更好，但它并不是以速度和易于定制而闻名的。由于“LINQ to
    SQL”在过去几年中非常流行，它很快就会变成过时事物。每当这种情况发生时，你可能使用基于标准的代码比使用某些遗弃的代码要好。我使用 LINQ，但仅用于让工作变得更方便的扩展类。


    事实上，ADO.net 本身就是一个非常优秀的框架。与在 ADO.net 之上的许多框架相反，ADO.net 本身已经足够强大。由于相似性，这在所有关于框架的喧嚣中被忽视了。


