    ## 4.7. 存储过程


    存储过程本质上是一种查询，其 SQL 文本不是客户端程序的一部分，而是存储在 SQL Server 中，与数据库和视图等存储在一起。我们稍后会看到 ADO.Net
    如何将 SQL 文本和参数作为独立对象附加到 `SqlCommand` 中。当使用存储过程时，我们仍然会附加参数，但不是附加 SQL 文本，而是指定要使用的存储过程名称。


    从性能角度来说，这种方式快一点，因为查询已经“编译”成了执行计划。如果多个客户端要使用同一个数据库，我们可以将 SQL 放入存储过程中，从而不需要多次编写相同的代码。这也可以是团队分工协作的好方法。


    然而，语法上存在差异，这仍然是一个需要学习的内容。本书关于 SQL Server 和 C#，我们不会深入讨论存储过程。


    ## 4.8. 安全与连接字符串


    多年来，建立数据库连接的方法一直涉及连接字符串。可能是因为这比结构（structure）更具语言无关性。这是一个示例：


    ```csharp

    private static string TestLocalConnectionStr = "Data_Source=localhost\sqlexpress;Initial_Catalog=TimeReg;Integrated
    Security=True";

    ```


    - **Data Source = XXX**

    Data Source 是要连接的服务器。在示例中，使用了位于 "localhost"（此电脑）上名为 "sqlexpress" 的服务器。这是 SQL Express
    安装的默认名称。


    - **Initial Catalog = YYY**

    Catalog 是所选服务器上的数据库名称。在示例中，它被称为“TimeReg”。


    - **Integrated Security = ZZZ**

    当“Integrated Security”参数设置为“True”时，连接将使用 Windows 身份验证。因此，如果用户对给定的服务器+数据库具有读取和写入权限，他们就可以使用任何
    CRUD 命令。如果 Integrated Security 设置为 False，则字符串必须包含另一种身份验证方式。通常情况下，Integrated Security
    被认为是最安全的选择。


    上述三个参数是一个“最小集合”——还有许多其他参数。


    如前所述，使用连接字符串是传统方法，但实际上可以使用 `ConnectionStringBuilder` 使用结构来完成工作。通过它，我们可以在列表 4.12
