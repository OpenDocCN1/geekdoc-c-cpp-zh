    ## Chapter 3

    ## TimeReg Database

    ### 3.1 Introduction


    I have tried to make TimeReg not only for top management. Project managers can
    analyze time-consumption on sub-projects, and developers can manage their vacation
    etc. You may download the sample, complete with a small sample database, and use
    it while you read the book. Or you may simply read the text and continue.


    ## 3.2 TimeReg Requirements


    Basically the requirement for the TimeReg application was something like:


    > The daily reporting of hours on projects must be simple, as this is the most
    common operation. This could e.g. be in a week-based form - pretty much like the
    time-table school-children has. Somehow it would be nice if not just hours is
    noted, but also a free-text comment. Users should only see whatever projects they
    have previously selected as relevant - “My Projects” - not other people projects.
    All users must be able to create simple reports directly in the program. It must
    be easy to save these in an Excel-friendly format. Only managers should be able
    to easily see other employees'' sickness and vacation. A project-manager should
    be able to easily see accumulated numbers on sub-parts of a project. We want to
    be able to break down the work on a project into the individuals or departments
    that delivered the work. The program should be able to automatically transfer
    hours on customer-specific projects to another, Oracle-based database from billing
    is already done (not included in the sample).


    Figure 3.1 shows a Power-Point version of the main view requirements, created
    for a review within the management team. It may not be the best way to demonstrate
    a user-interface, but the point is that it was easy to create. Compare this to
    Figure 1.1, which shows the resulting program, and you will find that the simple
    PowerPoint does a pretty neat job.


    ## The User View


    | My Projects | Monday 10 | Tuesday 11 | Wednesday 12 | Thursday 13 | Friday 14
    |

    |---|---|---|---|---|---|

    | Bilbo | 3.5 | | | | |

    | Gandalf | 2 | | | | |

    | Boromir | | | 8.2 | Right Click to edit comments (Change background color) |
    |

    | Prev | | | | | Next |

    | Sick | | | | | | |

    | Vacation | 5.5 | 7.0 | 8.2 | | | |


    - MyProjects are originally chosen from a down box (Special Form)

    - Any employee can choose any existing project

    - Once a project stays in the employees list....

    - Until taken out. No data left in database.

    - Sick & Vacation are generally always there (Use 8hrs/day on this)

    - Hours are entered in the cells – typically more accurate than 0.5 hrs - not
    a req.

    - Right-Click on cell to enter comment. Change background if comment exists.


    Figure 3.1: PowerPoint Requirement Spec for main view


    ## 3.3 Logical Design


    Databases are designed top-down. There is a High-Level design in which the main
    entities (tables) are found and relations are defined, based on the business model.
    Then there is a low-level design where data-types, indexes, constraints and views
    ect found. All these things we will get back to in Chapter 4. These two levels
    are often called Logical Design and Physical Design. Coming from the world of
    hardware and embedded software, I find the term “Physical Design” confusing, but
    it is commonly used. So let''s get on with the logical design of TimeReg:


    ### 3.3. LOGICAL DESIGN


    LOOK AT THE REQUIREMENTS. TRY ALL NOUNS AS CANDIDATES FOR ENTITIES (TABLES). THEN
    ALL ATTRIBUTES FOR THESE AS COLUMNS IN THE TABLE. THE INDIVIDUAL ITEMS THEN BECOME
