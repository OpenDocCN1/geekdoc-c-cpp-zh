    # 2.8 Integrity and Constraints


    The RDBMS will check that private keys are unique. This is called Entity Integrity.
    When natural candidates for keys are not used as such, it may be wise to explicitly
    introduce a UNIQUE Constraint. This can specify e.g. a Salary-Number must be unique.


    It is also important to assure that a specific row with a given private key cannot
    be deleted as long as there is a foreign key in another table relating to it.
    Similarly, you should not be allowed to create a foreign key without a matching
    private key. This is called Referential Integrity. Modern RDBMS''s enforce this
    through constraints. If a constraint is not created, you are responsible for this
    enforcement in your client code. As there can be more clients to the same database,
    each client needs to do this check. Surely a constraint in the database is preferred.


    The RDBMS can handle an unlawful delete in two ways: Either it does not perform
    the delete, but returns an error. Or it deletes the row with the private key,
    and also all rows that relates to it via a foreign key. This is known as a Cascade,
    and is something you setup in the “Foreign Key Relationships” dialog from Figure
    2.2.


    If the RDBMS is designed correct, it has taken ACID into consideration. The “C”
    in ACID is “consistency”, and the basic tables may be consistent on their own,
    it is your responsibility to assure consistency between tables, preferably using
    these concepts. On top of this there is also consistency requirements on the application
    level. This will come back to when we get to C#.'
