    offered by organizations; n = 10; 13.2%); and population health promotion (eg,
    cooking classes and general healthy eating tips focused on community inclusion
    and sociability; n = 9; 11.8%). Through searching the website links provided by
    these resources, we discovered an additional 69 secondary sources of food and
    nutrition programming, 10 of which had already been captured through initial searches
    (primary results). Thus, a total of 135 resources for nutrition and food programming
    for PLWH were located across Canada.


    # Gaps in known services and areas for future research


    The results show a lack of peer-reviewed literature on the topic of available
    nutrition and food programming for PLWH in Canada, as most results were from gray
    literature (n = 47/64; 73.4%). This highlights the importance of engaging with
    scoping reviews, because systematic scoping reviews are considered by many policymakers
    to offer the strongest evidence.⁴⁵ Moreover, policymakers, such as public health
    departments and federal governments, most often look to peer-reviewed literature
    and original research when gathering policy-relevant evidence.⁴⁵ For any interventions
    to be made at a policy level, more peer-reviewed research on this topic is needed.
    The results from the gray literature indicate that while there is no standard
    approach to providing nutrition and food programming to PLWH by programs offered
    across Canada by an array of organizations, there are similarities among the provincial
    approaches and supports offered. Four areas were identified as areas for future
    research on the topic of known services: i) limited targeted programming, ii)
    geographical distribution of resources, iii) type of resources offered, and iv)
    resource/program effectiveness as it relates to individual experience.


    First, a limited amount of identified programming was designed for diverse subpopulations.
    For example, many women and children; Indigenous people; transgender and gender-diverse
    people; and Black, African, and Caribbean people have different needs to be addressed.
    Cisgender and transgender women living with HIV, for instance, need trauma-informed
    and gender-safe spaces to access food services.¹⁷ Black, African, and Caribbean
    people, such as the clients of the Black Coalition for AIDS Prevention (Black
    CAP), require programming that considers social barriers such as racism, homophobia,
    and poverty.⁴⁶ Despite this difference in needs, only 36% of results offered targeted
    programming. This leaves many people who have been marginalized without


