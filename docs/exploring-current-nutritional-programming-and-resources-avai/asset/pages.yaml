    We have classified these 76 resources as charitable food provision (eg, food banks,
    soup kitchens, grocery vouchers; n = 21; 27.6%); financial aid (ie, provincial
    government subsidies; n = 14; 18.4%); nutrition care (eg, dietitian services including
    the nutrition care process and MNT; n = 12; 15.8%); providing access to secondary
    sources (ie, websites that do not offer nutrition and food programming but offer
