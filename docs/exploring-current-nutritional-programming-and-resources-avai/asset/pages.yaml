  md: 'common type of resource (10/76; 13.2%) was food and nutrition expertise, which
    included items such as PDFs that offered nutritional guidelines and recommendations
    for PLWH (eg, energy expenditure, micronutrients, dietary supplements). The least-common
    resource identified was population health promotion (9/76; 11.8%), which paired
    the social aspect of sharing food together and learning food skills, such as offering
    cooking classes or community dinners.


    Lastly, the top supports offered in Canada point to a single overarching research
    need: researchers and organizations for nutrition and food programming across
    Canada do not appear to be asking/interacting directly with PLWH on what they
    need as individuals to succeed. This finding is indicated by the needs of PLWH
    consistently being unmet through the currently available programming as demonstrated
    by the continued high rates of food insecurity, poverty, homelessness, and injection
    drug use. The implications of not aligning programs with the feedback of PLWH
    are that, firstly, PLWH are often food insecure, which is positively related to
    poverty (ie, income disparity); second, they may also be receiving suboptimal
    nutritional care; and, third, current resources may be wasted, as they are not
    allocated to the pivotal places that would maximize benefits. As such, current
    programming would benefit from considering the lived experiences of PLWH to be
    most effective.


    # Discussion


    For this scoping review, we mapped the current literature and resources available
    on nutrition and food programming for PLWH in Canada. To this end, we recorded
    what types of nutrition and food resources were offered in locations across Canada.
    We then mapped these resources according to the 7 Partnership for Dietetic Education
    and Practice (PDEP) competencies that dietitians must demonstrate before becoming
    a registered dietitian and entering the practice.⁵¹ The 7 competencies are i)
    food and nutrition expertise, ii) professionalism and ethics, iii) communication
    and collaboration, iv) management and leadership, v) nutrition care, vi) population
    health promotion, and vii) food provision. We found that 3 of the 6 types of resources
    identified in this review reflected the competencies. These were i) food and nutrition
    expertise (eg, nutrient and diet guidelines from professionals; education through
    books, PDFs, and workshops offered by organizations), ii) nutrition care (eg,
    dietitian services including the nutrition care process and MNT), and iii) population
    health promotion (eg, cooking classes and general healthy eating tips focused
    on community inclusion and sociability). The 3 types of resources that did not
    fit within the PDEP competencies were i) charitable food provision (eg, food banks,
    soup kitchens, grocery vouchers), ii) financial aid (ie, provincial government
    subsidies), and iii) providing access to secondary sources (ie, websites that
    do not offer nutrition and food programming but offer links to different websites
    that do). As some resources fit within the PDEP competencies and some did not,
    this helps us to understand what falls beyond the scope of dietitians and highlights
    the need to train those delivering these services to PLWH.


    Most resources identified in this review were charitable food provision services;
    therefore, it appears that long-term approaches/solutions to ensuring PLWH in
    Canada obtain adequate nutrition are needed. While we have noted that charitable
    food provision is a necessary service, it is not sustainable long-term. It may
    be challenging to maintain adequate nutrition for individuals who access charitable
    food provision services as their only source of nutrition to manage their HIV
    conditions. Food banks and meal programs are shown to support daily needs as emergency
    food supply for those in need.⁴,⁹,¹³–¹⁶ They are not shown, however, to provide
    adequate long-term nutrition and food security support for individuals and families,
    especially for PLWH with complex nutrition needs.¹³,¹⁹ Tarasuk and Eakin²⁰ report
    that charitable food provision services may operate with a dissociation between
    food assistance and client need, resulting in food assistance becoming a symbolic
    gesture rather than solely providing food aid. Additionally, charitable food provision
    may be damaging and counterproductive for those in need, as it can decrease income
    supports for individuals, leading them further into poverty.²⁰ More recent work
    by Tarasuk et al.²¹ echoes the same sentiment, stating that charitable food provision
    services are not able to address or assist the root causes of food insecurity,
    such as income disparity and homelessness.


    This scoping review identified a need in available programming in that the majority
    of food programming offered (charitable food provision) is not meeting the complex
    nutritional needs of PLWH in'
