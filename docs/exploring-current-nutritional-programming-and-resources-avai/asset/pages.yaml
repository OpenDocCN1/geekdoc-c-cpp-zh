- pgno: 11
  md: 'Canada.⁴,¹³,¹⁹ Many charitable food provision programs do not have adequate
    supply to address these specific needs, such as fresh fruits and vegetables,¹⁷,¹⁹
    or to address the food insecurity that 49% to 71% of PLWH face.⁸,⁹ Miewald et
    al., among others, have reported that for PLWH, “food insecurity has been linked
    to lower CD4 counts, reduced drug adherence (i.e., ART [antiretroviral therapy])
    and effectiveness, poor viral suppression (viral suppression being the primary
    goal of HIV treatment), and increased risk of mortality.”³¹⁹(p.511–2)


    Additionally, it is evident from the review that distribution of the resources
    across Canada appears to be unequal in both quantity and type of resource offered,
    as most of the results identified were services offered in provinces with high
    populations or larger cities (see Figures 2 and 3). This could indicate that provinces
    and territories with smaller and more remote populations may be left with little
    to no resources. Further, PLWH who also belong to populations that have been marginalized,
    (eg, Black, Indigenous, or person of color; low-income; sexual minorities such
    as transgender, non-binary, or gender-diverse people) may have more difficulty
    finding programming that is specific to their needs and cultural healing practices,
    especially if they reside in less-populated areas of Canada (see Figure 3). For
    instance, Nova Scotia has the highest population of gender-diverse people (of
    those aged 15 to 34 years) among the Canadian provinces,⁵² but as outlined in
    Figure 2, we did not identify current nutrition and food programming in Nova Scotia
    that is specifically targeted for this population. PLWH may also have additional
    chronic conditions or disability considerations, especially as they get older.


    In their study on food access for women living with HIV in Vancouver, Sernick
    et al.¹⁷ highlighted the barriers that some populations face in finding appropriate
    nutrition services including immigrant, Indigenous, women, and transgender PLWH.
    Despite the majority of identified resources targeting the general PLWH population,
    there were some programs identified targeted towards a more specific population
    (eg, women and children, transgender, non-binary, gender-diverse people), which
    are better tailored to their needs. Black CAP⁴⁶ and OAHAS⁴⁷ mentioned previously
    are examples that offer programming for specific populations. These organizations
    demonstrate that specialized care for different population groups is warranted.


    More specialized resources that offer an intersectional approach to nutrition
    and food programming could be beneficial for these population groups in providing
    adequate nutritional support and safe spaces.¹²,¹⁷ For example, Sernick et al.¹⁷
    found that peoples’ safety based on gender (ie, gender identity safety) was a
    main concern for those accessing food banks at the cis and trans women-focused
    centers, which was a main source of food for their study population. Sernick et
    al.¹⁷ demonstrated why it is important for individual experience and accounts
    from PLWH to be a part of the dialogue in research towards nutrition and food
    programming in Canada. Without consulting end users, research on which programming
    should be developed may miss key learnings and opportunities for improving programming.


    We found that the number of results identified increased throughout the years,
    with 40% of results published between 2010 and 2019, and 45% of results between
    2020 and 2021 alone. As many of our results came from service provider websites,
    this large percentage of results from 2020–2021 could be explained by the number
    of service organization websites identified in the review that update their website
    information each year, resulting in a large number of sources identified for the
    year 2021. With 85% of review results published between 2010 and 2021, this signifies
    that the results reported are relatively up-to-date and, thus, an accurate depiction
    of the currently available programming.


    # Strengths of the review


    There are several strengths to be noted in the creation of this scoping review.
    First, we have a dynamic research team with backgrounds including, but not limited
    to, dietetics, applied human nutrition, nursing, anthropology, 2SLGBTQIA+ nutrition
    and health, and Black, Indigenous, or person of color studies. This multitude
    of perspectives provided the review with a degree of depth that may not have been
    accessible had the research team been limited to 1 field of study. Community consultation
    through the DJM technique also provided this review with an additional layer of
    feedback that came from community members and service providers who work with
    PLWH, allowing the review to report more thoroughly on available food and nutrition
    resources for PLWH in Canada. The time and care put into this review from the
    research team and community'
