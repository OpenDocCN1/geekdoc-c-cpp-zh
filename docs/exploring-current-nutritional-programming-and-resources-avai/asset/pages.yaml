    is offered in large cities.


    Second, large cities, such as Vancouver (n = 11/18; 61% of the results from British
    Columbia) and Toronto (n = 7/14; 50% of the results from Ontario), were identified
    as home to most of their provinces’ resources (see Figures 2 and 3), leading to
    speculation that there are not as many resources offered in rural areas. Collectively,
    the programming identified in these regions covered a wide range of needs for
    PLWH, offering different resources for targeted population groups. The resources
    found were mostly provided by nonprofit organizations, private (for-profit) clinics,
    and provincial governments. For example, in British Columbia, we identified 18
