    **Conclusions:** This scoping review demonstrates that current programming relies
    heavily on charitable food provision services for people living with HIV and that
    there is an unequal distribution of resources across Canada. Program expansion
    to target diverse populations with more equal distribution across Canada may improve
    overall health outcomes for people living with HIV. Future research is needed
    to evaluate the effectiveness of available programming and the needs of end users
    (people living with HIV and their supports). FoodNOW will build on these findings
    to further explore and address the needs of people living with HIV.


