    # Introduction


    Human immunodeficiency virus (HIV) attacks the body’s immune system, deteriorating
    and weakening it, and increasing the risk of a person acquiring life-threatening
    infections and diseases (eg, cancer). If left untreated, HIV can progress into
    acquired immunodeficiency syndrome (AIDS) and result in death. There were an estimated
    62,050 Canadians living with HIV by the end of 2018. In 2019, the number of positive
    HIV cases identified in Canada was slightly lower than 2018; however, this decrease
    was not as great as in other countries. For instance, positive HIV cases identified
    among gay, bisexual, and men who have sex with men (gbMSM) have declined by 47%
    in the United Kingdom since 2014, whereas the cases among the same population
    in Canada have decreased by 26% over the past 10 years, providing rationale for
    a Canadian-focused scoping review.


    A cornerstone of HIV treatment is medical nutrition therapy (MNT), which has been
    highlighted by Dietitians of Canada and the American Dietetic Association (now
    named the Academy of Nutrition and Dietetics) in their reports. Through nutrition
    assessment and co-developed support, the nutrition care process and MNT aim to
    prevent and manage the signs, symptoms, and progression of HIV. MNT assessment
    includes nutrition-related problems, causes, and significance; medical, physical,
    social, economic, and dietary history; pharmacotherapy; and recognition/integration
    of social determinants of health. While a referral to a registered dietitian is
    part of the treatment stage of the cascade of care for individuals upon HIV diagnosis,
    there is no guarantee they will have access to subsequent nutrition care in their
    own communities.


    HIV has had “a significant impact on domestic and global health, social, political,
    and economic outcomes.” There were 2122 new cases of HIV reported in Canada in
    2019. Additionally, Dietitians of Canada and the Academy of Nutrition and Dietetics
    reported that virus cases are highest among those who have and continue to experience
    barriers in accessing medical care: 30% (n = 626) were immigrants, and 56% (n
    = 1193) were gbMSM, while approximately 25% (n = 531) of new cases were among
    Indigenous populations. Important to note, Indigenous peoples made up 5% (n =
    1,807,250) of the total population (approximately 37 million) in Canada in 2021.


    A widely accepted definition of *food insecurity*, from Anderson is “limited or
    uncertain availability of nutritionally adequate and safe foods or limited or
    uncertain ability to acquire acceptable foods in socially acceptable ways.” In
    high-income, high-resource settings such as Canada and the United States, 49%
    to 71% (30,404 to 41,055 of 65,050) of people living with HIV (PLWH) experience
    food insecurity, largely due to socioeconomic status. Moreover, PLWH may experience
    a range of nutrient deficiencies, including anemias, antioxidant depletion, or
    protein-energy malnutrition, due to their pathology alone, directly impacting
    nutritional status and adequacy and, thus, their food security. For instance,
    sufficient caloric, micronutrient, and protein intake is key to managing symptoms'
