    have any services available to them. Having fewer resources to reach large, highly
    impacted populations


    can leave programming stretched and potentially unable to meet demand.


    Third, the most common type of nutrition and food programming identified was charitable
    food provision services. This included supports such as food banks, grocery vouchers,
    and soup kitchens, which accounted for 27.6% (21/76) of all nutrition and food
    services identified. These supports do not appear to be different for PLWH than
    for the general population; however, certain food provision services are reserved
    for PLWH. Many of the organizations identified offer charitable food provision
    as their only nutrition-related resource available for PLWH. For example, ACT
    (formerly the AIDS Committee of Toronto) offers hot lunches to PLWH twice per
    week⁴⁹ and the HIV/AIDS Resources and Community Health offers monthly $10 grocery
    store gift cards to PLWH.⁵⁰ For many PLWH, charitable food provision services
    may be the only nutritional support they are receiving to manage their symptoms
    and medication side effects.²¹ Future research would benefit from exploring long-term
    solutions; however, charitable food services are needed in the interim, not as
    a solution, but to meet immediate needs. The second-most common type of support
    identified was financial aid (14/76; 18.4%), as each province and territory has
    its own form of governmental financial aid for PLWH under employment support and
    income assistance if the individual qualifies (ie, referral from a dietitian).
    The amount provided to each individual can consist of allowances for basic food,
    diet supplements, and caloric intake/special diet. The third-most common type
    of support identified was nutrition care (12/76; 15.8%). Nutrition care included
    resources such as access to dietitian services for diet supplement referrals and
    MNT process, which has proven beneficial for PLWH.¹ Secondary sources (ie, organization
    websites that do not offer nutrition and food resources but provide a list/website
    links of others that do) were tied for fourth-most common support identified (10/76;
    13.2%). Secondary sources, however, may be less helpful to those in search of
    nutrition and food support. As a significant number of resources found were from
    service-provider websites offering links to secondary sources, this indicates
    a lack of available support, as some of the secondary sources provide further
    links to tertiary sources, making it challenging to find a tangible resource that
    provides nutrition or foods programming. The other fourth-most'
