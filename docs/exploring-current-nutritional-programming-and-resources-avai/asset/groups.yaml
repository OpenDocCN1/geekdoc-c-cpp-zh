    on specific questions or issues. As an evidence-informed method, the DM is used
    to gather input, feedback, and opinion on questionnaires, reports, and educational
    tools. This method relies on individuals considered to have knowledge on the topic
    (ie, people with lived experience). The expert group aims to reach a consensus
    on a complex and multifaceted topic. In this case, the DM provided a framework
    to guide consultation and subsequent decision-making (eg, how the review will
    inform subsequent surveying). Contributors to the consultation had the opportunity
    to highlight additional references and provide valuable insights about problems
    and ideas that the scoping review alone had not identified. A DM flow chart is
    provided in Appendix II, adapted from Green.


    A list of 13 experts was generated from existing FoodNOW steering and advisory
    committees, as well as colleagues of the research team from relevant fields (ie,
    nutrition, health care providers), who were then invited to participate in the
    DM process. Eight experts agreed to participate as panelists, and the DM was employed
    by a trained facilitator to a group that included registered dietitians (n = 2),
    service providers (n = 4), a medical advisor (n = 1), and a dietitian candidate
    (n = 1). Panelists were invited to share feedback in the form of typed responses
    collected via email or prerecorded video. The scoping review manuscript was provided
    2 weeks in advance of the first feedback submission deadline (round 1). The panelists
    were asked to offer feedback on the practical application of the findings and
    to identify any reservations about materials included and/or excluded. Informed
    by Hemmings et al. and Williams and Webb, the facilitator collated the feedback
    into an anonymous summary report and circulated it back to the DM panelists for
    review 1 week in advance of the round 2 feedback submission deadline. The facilitator
    then integrated all final additional feedback into the review.


    # Data analysis and presentation


    The results of this review are presented in tables and figures, and accompanied
    by a narrative summary that describes how the results relate to the review objective
    and question. The focus of this review was the broad concept of nutrition and
    food programming available to PLWH, and as such, we reported a broad range of
    programming types.


    # Results


    # Study inclusion


    A search of the peer-reviewed literature conducted on July 14, 2021, yielded 696
    results from 5 databases. Gray literature searches conducted on August 24, October
    5, and October 15, 2021 (see Appendix I), yielded another 143 results (see Appendix
    IV). A total of 839 results were recorded. For purposes of this study, identified
    articles (peer-reviewed) and evidence (gray literature) are referred to as results,
    and individual programming and resources available to PLWH or AIDS are referred
    to as programming and resources.


    After duplicates were removed from the published literature, 439 results remained
    for title and abstract screening. Of these, 366 results did not match the research
    inclusion criteria, and 2 results were unable to be retrieved, leaving 213 results
    for full-text-review (71 published and 143 gray literature results). After full-text
    screening, 64 results were included in the review (17 published and 47 gray literature
    results). See Figure 1 for the complete search results and study selection and
    inclusion process. The 6 reasons for exclusion after full-text screening were
    i) not nutrition and food programming (n = 83), ii) not Canadian context (n =
    37), iii) duplicates (n = 22), iv) not focused on PLWH (n = 6), v) conference
    abstract (n = 1), and vi) not in English (n = 1). See Appendix II for the list
    of excluded results. Duplicates identified among the published literature during
    the full-text review were due to multiple records published on the same resource/service
    organization. As the objective of the review was to identify the number of resources
    available in Canada, only 1 record per resource/service organization was eligible
    to be included in the scoping review.


    # Characteristics of included studies


    Details of the 64 results included in the scoping review are provided in Appendix
    IV. Study characteristics were recorded as they relate to the research objectives
    and include full citations. The included results were published between 1993 and
    2021. Four results had no date available. Per decade, the years of publication
    of the remaining 60 results were found to be distributed as such: 1990–1999 (n
    = 4; 6.7%), 2000–2009 (n = 5; 8.3%), 2010–2019 (n = 24; 40%), and 2020–2021 (n
    = 27; 45%). As outlined in the inclusion criteria, the item of data/evidence had
    to be based in Canada and describe/discuss nutrition'
