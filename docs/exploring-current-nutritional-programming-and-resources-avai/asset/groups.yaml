    针对具体问题或议题。作为一种循证方法，德尔菲法用于收集对问卷、报告和教育工具的意见、反馈和看法。该方法依赖于被认为在该主题上具有知识的人（即具有亲身经历的人）。专家组旨在就复杂和多方面的议题达成共识。在本案例中，德尔菲法提供了一个框架来指导咨询和后续决策（例如，综述将如何为后续调查提供信息）。咨询参与者有机会补充额外的参考文献，并就范围综述单独未能发现的问题和想法提供宝贵的见解。德尔菲法流程图见附录II，改编自Green。


    从现有的FoodNOW指导委员会和咨询委员会，以及研究团队在相关领域（即营养、医疗保健提供者）的同事中产生了一份由13名专家组成的名单，随后邀请他们参与德尔菲法过程。八名专家同意作为小组成员参与，德尔菲法由一名受过培训的主持人应用于一个包括注册营养师（n
    = 2）、服务提供者（n = 4）、医学顾问（n = 1）和营养师候选人（n = 1）的小组。小组成员被邀请以电子邮件或预录视频形式提交打字回复。范围综述手稿在第一轮反馈提交截止日期前2周提供。小组成员被要求就研究结果的实际应用提供反馈，并指出对纳入和/或排除材料可能存在的保留意见。参考Hemmings
    *等人*以及Williams和Webb的方法，主持人将反馈汇总为匿名摘要报告，并在第二轮反馈提交截止日期前1周分发给德尔菲法小组成员审阅。然后，主持人将所有最终额外反馈整合到综述中。


    ## 数据分析和呈现


    本综述的结果以表格和图表形式呈现，并附有叙述性摘要，描述结果如何与综述目标和问题相关联。本综述的重点是感染者可获得营养和食品项目的广义概念，因此我们报告了广泛的项目类型。


    ## 结果


    ### 研究纳入


    于2021年7月14日进行的同行评审文献检索从5个数据库中获得696条结果。于2021年8月24日、10月5日和10月15日进行的灰色文献检索（见附录I）又获得143条结果（见附录IV）。共记录839条结果。为本研究之目的，已识别的文章（同行评审）和证据（灰色文献）被称为结果，而感染者或艾滋病患者可获得的个别项目和资源被称为项目和资源。


    在删除已发表文献中的重复项后，剩439条结果进行标题和摘要筛选。其中，366条结果不符合研究纳入标准，2条结果无法获取，剩余213条结果进行全文审查（71条已发表和143条灰色文献结果）。全文筛选后，64条结果纳入综述（17条已发表和47条灰色文献结果）。完整检索结果及研究选择与纳入过程见图1。全文筛选后的排除原因有6种：


    - i) 非营养和食品项目（n = 83），

    - ii) 非加拿大背景（n = 37），

