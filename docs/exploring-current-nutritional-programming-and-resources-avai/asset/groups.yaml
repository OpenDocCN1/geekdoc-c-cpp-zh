    in full. Full-text screening and data extraction was conducted by 2 independent
    reviewers using a data extraction tool designed specifically for the scoping review
    objectives and research inclusion criteria, and any conflicts were resolved through
    discussion. Results are presented in both tabular and diagrammatic formats, with
    a narrative summary.


    **Results:** A total of 581 results were screened (published and gray literature).
    A total of 64 results were included in the review. The 6 reasons for exclusion
    at full-text review were:


    - not nutrition and food programming (n = 83)

    - not Canadian (n = 37)

    - duplicates (n = 22)

    - not focused on people living with HIV (n = 6)

    - conference abstract (n = 1)

    - not in English (n = 1)


    A total of 76 resources were located, as some of the 64 included sources offered
    more than 1 resource. The 76 resources were organized into 6 categories:


    - charitable food provision (n = 21; 27.6%)

    - financial aid (n = 14; 18.4%)

    - nutrition care (n = 12; 15.8%)

    - providing access to secondary sources (n = 10; 13.2%)

    - food and nutrition expertise (n = 10; 13.2%)

    - population health promotion (n = 9; 11.8%)


