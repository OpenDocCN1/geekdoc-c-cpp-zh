    加拿大营养和食物资源可用性对话的前沿。这超出了研究范畴，延伸到实践中。包容性且承认该患者群体及其需求多样性的咨询和沟通至关重要。


    审查结果的传播一直是形成性的（例如，社区会议、咨询）并且将继续如此。结果被用于构建后续的 3 个 FoodNOW 项目阶段，这些阶段已通过传统学术渠道传播，包括会议、论文和报告。创新方法，例如信息图表和短视频，根据受众（例如，资助者、学者、政府、PLWH、服务提供者）而定，也可能被采用。例如，我们已在整合知识转化（iKT）的背景下，通过
    2022 年春季 KT Canada 科学会议的海报展示呈现了初步研究成果。⁵³ 我们还于 2023 年春季 KT 科学会议上以海报和口头报告的形式呈现了研究结果的需求评估摘要。⁵⁴
    与 PLWH 和其他社区成员分享本项目的学习成果以及数据将如何被使用/实施的计划，仍然是我们 iKT 目标的关键优先事项。


    ## 致谢


    感谢我们的指导委员会和咨询委员会的贡献。Mount Saint Vincent University 的 Sheila A. Brown 应用研究中心、食品行动研究中心（FoodARC）、应用人类营养系，以及
    Dalhousie University 的 WK Kellogg 健康科学图书馆在本次研究期间提供了宝贵的资源和支持。Nova Scotia 艾滋病联盟、Healing
    Our Nations、prideHealth、社区为本研究中心以及 Nova Scotia 艾滋病咨询委员会在整个项目中提供了合作和指导。通过 DM 应用进行本次审查的社区咨询的参与者。


    Erna-Snelgrove Clarke，Queen’s University 健康科学学院 JBI 培训师，JBI 综合系统评价培训项目，为 SG、MR、JM
    和 YZ 提供了培训。Peter Stilwell，McGill University，对方案和检索策略提出了意见。


    ## 资助


    进行本次审查的资金由 Research Nova Scotia 在新健康研究员资助/奖项编号：RNS-NHIG-2020-1378 提供，以及 Mount
    Saint Vincent University 研究与出版委员会（CP）的 CN 研究实习（YZ）。资助方对审查的执行或研究结果没有任何影响。


    ## 作者贡献


    SG 主导了本文稿的撰写。JM 和 YZ 撰写了手稿并共同制定了检索策略。MR 和 SG 监督了 JM 和 YZ 的范围审查培训。所有作者都对审查提供了反馈。


