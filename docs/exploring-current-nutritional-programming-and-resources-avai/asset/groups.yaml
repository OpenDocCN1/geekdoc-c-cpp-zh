    探索加拿大艾滋病毒感染者可获得的当前营养项目和资源：范围综述


    Jessica Mannette¹, Yingying Zhang¹, Melissa Rothfus²,³, Chelsey Purdy¹, Winta
    Tesfatsion¹, Mary Lynch⁴, Barbara Hamilton-Hinch⁵, Patricia L. Williams¹,⁶,⁷,
    Phillip Joy¹, Shannan Grant¹,⁸,⁹


    ¹Mount Saint Vincent University 应用人类营养系，加拿大哈利法克斯，NS；²Dalhousie University WK Kellogg
    健康科学图书馆，加拿大哈利法克斯，NS；³Aligning Health Needs and Evidence for Transformative Change
    (AH-NET-C)：Dalhousie University JBI卓越中心，加拿大哈利法克斯，NS；⁴Dalhousie University 麻醉、疼痛管理与围手术期医学系，加拿大哈利法克斯，NS；⁵Dalhousie
    University 健康与人类表现学院，加拿大哈利法克斯，NS；⁶Mount Saint Vincent University 食物行动研究中心 (FoodARC)，加拿大哈利法克斯，NS；⁷Dalhousie
    University 健康人群研究所，加拿大哈利法克斯，NS；⁸IWK Health Centre 产科和妇科系，加拿大哈利法克斯，NS；以及 ⁹Dalhousie
    University 儿科、产科和妇科系，加拿大哈利法克斯，NS


    *通讯作者：* Jessica Mannette, jessica.mannette@msvu.ca


    本文为开放获取文章，发布在知识共享署名-非商业性使用-禁止演绎 4.0 (CC BY-NC-ND) 许可条款下，允许在正确引用的前提下下载和分享作品。未经期刊许可，不得以任何方式更改作品或将其用于商业用途。


    *作者声明无利益冲突。*


    DOI: 10.11124/JBIES-22-00168


    ## 摘要


    **目的：** 本范围综述的目的是绘制加拿大艾滋病毒感染者营养和食物项目及资源相关当前文献和资源的图谱。本综述是名为 FoodNOW (Food to eNhance
    Our Wellness) 的 4 阶段项目中的第 1 阶段，该项目是对加拿大新斯科舍省艾滋病毒感染者进行社区为基础的营养需求评估。


    **引言：** 艾滋病毒感染者可能面临营养挑战，包括与病毒相关的营养缺乏、粮食不安全以及营养-药物相互作用。营养项目通常是艾滋病毒感染者获得最佳护理所必需的。然而，文献尚未得到充分梳理，无法全面呈现现有项目的全貌。本综述为后续研究阶段的发展提供了信息，并将有助于塑造和规划食物项目，以及评估后续系统综述的需求。


    **纳入标准：** 本综述考虑了聚焦于加拿大艾滋病毒感染者营养和食物项目及资源的文献。纳入感兴趣人群的为任何年龄、性别、种族、性别认同或性取向的艾滋病毒感染者，以及孕妇和哺乳期人群。


    **方法：** 检索的数据库为 MEDLINE (Ovid)、CINAHL (EBSCO)、Academic Search Premier (EBSCO)、Social
    Services Abstracts (ProQuest) 和 Scopus。检索的灰色文献来源包括政府和组织网站，以及 Google 搜索。数据库检索于
    2021 年 7 月进行，灰色文献检索于 2021 年 8 月和 10 月进行。检索限定为以英语发表或翻译的证据。两名独立审阅者进行标题和摘要筛选，并调取可能相关的结果全文。全文筛选和数据提取由两名独立审阅者使用专门为范围综述目标和研究纳入标准设计的数据提取工具进行，任何分歧通过讨论解决。结果以表格和图表形式呈现，并附叙述性总结。


    **结果：** 共筛选 581 条结果（已发表文献和灰色文献）。共纳入 64 条结果用于综述。全文审查排除的 6 个原因如下：


    - 非营养和食物项目 (n = 83)

    - 非加拿大 (n = 37)

    - 重复 (n = 22)

    - 非聚焦艾滋病毒感染者 (n = 6)

    - 会议摘要 (n = 1)

    - 非英语 (n = 1)


    共定位到 76 项资源，因为其中 64 项纳入来源提供了不止 1 项资源。76 项资源被归为 6 类：


    - 慈善食物供给 (n = 21; 27.6%)

    - 财政援助 (n = 14; 18.4%)

    - 营养护理 (n = 12; 15.8%)

    - 提供次级来源获取途径 (n = 10; 13.2%)

    - 食物和营养专业知识 (n = 10; 13.2%)

    - 人群健康促进 (n = 9; 11.8%)


    讨论了未来研究和项目的建议。


    **结论：** 本范围综述表明，当前项目在很大程度上依赖于为艾滋病毒感染者提供的慈善食物供给服务，且加拿大各地的资源分布不均。项目扩展以针对多元人群并在加拿大范围内更公平地分布，可能改善艾滋病毒感染者的整体健康结局。未来需要研究来评估现有项目的有效性以及终端用户（艾滋病毒感染者及其支持者）的需求。FoodNOW
    将在这些发现的基础上，进一步探索和解决艾滋病毒感染者的需求。


    **综述注册：** Open Science Framework https://osf.io/97x3r


    **关键词：** 艾滋病；HIV；食物项目；食物供给；营养项目


    *JBI Evid Synth* 2023; 21(10):2022–2081.


    ## 引言


    人类免疫缺陷病毒 (HIV) 攻击人体的免疫系统，使其退化并削弱，增加个体罹患危及生命的感染和疾病（如癌症）的风险。若不治疗，HIV 可进展为获得性免疫缺陷综合征
    (AIDS) 并导致死亡。截至 2018 年底，加拿大约有 62,050 名艾滋病毒感染者。2019 年，加拿大发现的阳性 HIV 病例数量略低于 2018
    年；然而，这一下降幅度不及其他国家。例如，自 2014 年以来，英国男同性恋、双性恋和男性同性行为者 (gbMSM) 中发现的阳性 HIV 病例下降了 47%，而加拿大同类人群在过去
    10 年中仅下降了 26%，这为开展加拿大聚焦的范围综述提供了依据。


    HIV 治疗的基石是医疗营养治疗 (MNT)，该治疗已被加拿大营养师协会和美国饮食协会（现名为营养与饮食学会）在其报告中强调。通过营养评估和共同制定的支持，营养护理流程和
    MNT 旨在预防和管理 HIV 的体征、症状和进展。MNT 评估包括营养相关问题、原因和重要性；医疗、身体、社会、经济和饮食史；药物治疗；以及社会健康决定因素的识别/整合。虽然在个体确诊
    HIV 后，护理阶梯的治疗阶段包括转介至注册营养师，但并不能保证他们在其所在社区获得后续营养护理。


    HIV 对“国内和全球健康、社会、政治和经济结果”产生了“重大影响”。2019 年加拿大报告了 2122 例新发 HIV 病例。此外，加拿大营养师协会和营养与饮食学会报告称，病毒病例在那些持续面临医疗护理获取障碍的人群中最高：30%
    (n = 626) 为移民，56% (n = 1193) 为 gbMSM，而约 25% (n = 531) 的新病例为原住民。值得注意的是，原住民占加拿大
    2021 年总人口（约 3700 万）的 5% (n = 1,807,250)。


    Anderson 对 *粮食不安全* 的广泛接受定义为“营养充足和安全的食物的获取有限或不确定，或以社会可接受的方式获取可接受食物的能力有限或不确定。” 在加拿大和美国等高收入、高资源环境中，49%
    至 71% (62,050 人中的 30,404 至 44,055 人) 的艾滋病毒感染者 (PLWH) 经历粮食不安全，这在很大程度上归因于社会经济地位。此外，PLWH
    可能因其病理本身而经历一系列营养素缺乏，包括贫血、抗氧化剂耗竭或蛋白质-能量营养不良，直接影响营养状况和充足性，从而影响其粮食安全。例如，充足的热量、微量营养素和蛋白质摄入是管理症状的关键


