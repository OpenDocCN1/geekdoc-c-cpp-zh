    常见资源类型（10/76；13.2%）为食物和营养专业知识，其中包括为 PLWH 提供的营养指南和建议的 PDF 文件等项目（例如，能量消耗、微量营养素、膳食补充剂）。识别出的最不常见的资源是人群健康促进（9/76；11.8%），它将分享食物的社交方面与学习食物技能相结合，例如提供烹饪课程或社区晚餐。


    最后，加拿大提供的最主要支持指向一个总体性的研究需求：加拿大各地从事营养和食物项目的科研人员和组织似乎没有直接向 PLWH 询问/互动，了解他们作为个人需要什么才能成功。这一发现表明，PLWH
    的需求通过目前可用的项目持续未得到满足，这一点可从食物不安全、贫困、无家可归和注射吸毒的高持续发生率中看出。不将项目与 PLWH 的反馈相一致的后果是，首先，PLWH
    通常面临食物不安全，这与贫困（即收入差距）呈正相关；其次，他们可能接受的营养护理不佳；第三，现有资源可能被浪费，因为它们没有分配到能够最大化效益的关键场所。因此，目前的项目若要最有效，就应考虑
    PLWH 的 lived experiences。


    ## Discussion


    在本范围综述中，我们绘制了加拿大 PLWH 营养和食物项目的当前文献和资源概况。为此，我们记录了加拿大各地提供的营养和食物资源类型。然后，我们根据营养与饮食教育实践伙伴关系（PDEP）规定的
    7 项胜任力对这些资源进行映射，注册营养师在成为注册营养师并进入执业前必须展示这些胜任力。⁵¹ 这 7 项胜任力为 i) 食物和营养专业知识，ii) 专业精神和伦理，iii)
    沟通与协作，iv) 管理与领导，v) 营养护理，vi) 人群健康促进，以及 vii) 食物供应。我们发现，本综述中确定的 6 种资源类型中有 3 种反映了胜任力。这些为
    i) 食物和营养专业知识（例如，专业人士提供的营养和饮食指南；组织提供的书籍、PDF 和研讨会教育），ii) 营养护理（例如，包括营养护理流程和 MNT 的营养师服务），以及
    iii) 人群健康促进（例如，烹饪课程和以社区包容和社会性为重点的一般健康饮食提示）。不符合 PDEP 胜任力的 3 种资源类型为 i) 慈善食物供应（例如，食物银行、汤厨房、杂货券），ii)
    财政援助（即省级政府补贴），以及 iii) 提供次级来源的渠道（即不提供营养和食物项目的网站，但提供指向不同网站的链接）。由于部分资源符合 PDEP 胜任力而部分不符合，这有助于我们理解超出营养师工作范围的内容，并凸显了对为
    PLWH 提供这些服务的从业人员进行培训的必要性。


    本综述中确定的大多数资源为慈善食物供应服务；因此，似乎需要长期的方法/解决方案来确保加拿大的 PLWH 获得足够的营养。虽然我们已指出慈善食物供应是必要的服务，但它不可长期持续。对于仅依靠慈善食物供应服务作为营养来源以管理其
    HIV 状况的个人而言，保持充足营养可能具有挑战性。食物银行和餐食项目被证明可为有需要者提供日常需求的紧急食物供应。⁴,⁹,¹³–¹⁶ 然而，它们并未被证明能够为个人和家庭提供足够的长期营养和粮食安全支持，尤其是对于具有复杂营养需求的
    PLWH。¹³,¹⁹ Tarasuk 和 Eakin²⁰ 报告称，慈善食物供应服务可能在食物援助与客户需求之间存在脱节，导致食物援助成为象征性姿态，而不仅仅是提供食物援助。此外，慈善食物供应可能对有需要者造成损害且适得其反，因为它可能减少个人的收入支持，使其进一步陷入贫困。²⁰
    Tarasuk 等人²¹ 的最新工作也表达了同样的观点，称慈善食物供应服务无法解决或帮助食物不安全的根源，如收入差距和无家可归。


    本范围综述确定了现有项目中的需求，即所提供的食物项目（慈善食物供应）占多数，未能满足加拿大 PLWH 复杂的营养需求。⁴,¹³,¹⁹ 许多慈善食物供应项目没有足够的供应来满足这些特定需求，例如新鲜水果和蔬菜，¹⁷,¹⁹
    或解决 49% 至 71% PLWH 面临的食物不安全问题。⁸,⁹ Miewald 等人以及其他人报告称，对于 PLWH，“食物不安全与较低的 CD4 计数、药物依从性降低（即抗逆转录病毒治疗
    ART）和疗效、病毒抑制不良（病毒抑制是 HIV 治疗的主要目标）以及死亡风险增加相关。”³¹⁹(p.511–2)


    此外，从综述中可以明显看出，加拿大各地资源的分布在数量和资源类型上似乎不平等，因为大多数识别出的结果是人口较多或大城市省份提供的服务（见图 2 和图 3）。这可能表明人口较少和更偏远的省份和地区可能几乎没有资源。此外，同时属于被边缘化人群的
    PLWH（例如，黑人、原住民或有色人种；低收入；性少数群体，如跨性别、非二元或性别多元人群）可能更难找到针对其需求和文化疗愈实践的项目，尤其是如果他们居住在加拿大人口较少的地区（见图
    3）。例如， Nova Scotia 在加拿大各省中拥有 15 至 34 岁人群中性别多元人群比例最高，⁵² 但如图 2 所示，我们未识别出针对该人群的专门营养和食物项目。PLWH
    也可能有额外的慢性病或残疾考虑，特别是在他们年纪增长时。


    在关于温哥华 HIV 感染女性食物获取的研究中，Sernick 等人¹⁷ 强调了一些人群在寻找合适的营养服务时面临的障碍，包括移民、原住民、女性和跨性别 PLWH。尽管大多数已识别资源针对的是普通
    PLWH 人群，但仍有一些项目针对更具体的群体（例如，妇女和儿童、跨性别、非二元、性别多元人群），这些项目更能满足其需求。之前提到的 Black CAP⁴⁶
    和 OAHAS⁴⁷ 就是为特定人群提供项目的例子。这些组织表明，为不同人群提供专门护理是必要的。


    为这些人群提供更专门的资源，采用营养和食物项目的交叉方法，可能有助于提供足够的营养支持和安全空间。¹²,¹⁷ 例如，Sernick 等人¹⁷ 发现，基于性别的安全性（即性别认同安全）是那些在顺性别和跨性别女性中心的食物银行获取食物的研究人群的主要关切，而这对其研究人群而言是食物的主要来源。Sernick
    等人¹⁷ 证明了将 PLWH 的个人经历和叙述纳入加拿大营养和食物项目研究对话的重要性。如果不咨询终端用户，关于应开发何种项目的研究可能会错过关键的学习和改进项目的机会。


    我们发现识别出的结果数量逐年增加，其中 40% 的结果发表于 2010 年至 2019 年间，45% 的结果仅在 2020 年至 2021 年间发表。由于我们的许多结果来自服务提供者网站，这一大量来自
    2020–2021 年的结果可能可由综述中识别的服务组织网站每年更新其网站信息所解释，导致 2021 年识别的来源数量众多。随着 85% 的综述结果发表于
    2010 年至 2021 年间，这表明所报告的结果相对最新，因而是对当前可用项目的准确描述。


    ## Strengths of the review


    在本范围综述的创建中，有几个优势值得注意。首先，我们拥有一个动态的研究团队，其背景包括但不限于营养学、应用人类营养学、护理学、人类学、2SLGBTQIA+
    营养与健康，以及黑人、原住民或有色人种研究。这种多重视角为综述提供了可能在研究团队仅限于一个研究领域时无法获得的深度。通过 DJM 技术进行的社区咨询也为本综述提供了来自与
    PLWH 合作的社区成员和服务提供者的额外反馈层，使综述能够更全面地报告加拿大 PLWH 可用的食物和营养资源。研究团队和社区投入到本综述中的时间和关怀


