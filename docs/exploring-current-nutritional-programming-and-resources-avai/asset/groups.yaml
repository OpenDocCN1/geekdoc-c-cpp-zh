  mdcn: '


    该人群营养相关免疫功能障碍的情况因人而异，且具有患者或个案特异性。¹ 落实到实践中，这可能意味着需要更高的热量和营养需求，而有限的收入或食物获取途径可能无法满足这些需求。


    个人的整体健康和福祉受到经济和社会交叉因素的影响，这些因素也被称为健康的社会决定因素。⁹ 感染者可能同时经历多种偏见，例如种族、性别、性取向和社会经济地位，这些因素共同构成了复杂的压迫与特权体系。在开展HIV研究时采用交叉性¹⁰视角，已被证明有助于理解感染者及其在获取照护方面所面临的挑战。¹¹,¹²
    因此，将交叉性方法应用于HIV预防和管理，将极大地有利于食品项目的研究和规划，使其更具包容性，同时考虑到感染者通常关联的多重社会身份。


    在加拿大，为了满足感染者的营养需求，存在不同类型的营养和食品项目。例如，食品银行和膳食项目为有需要的人提供紧急食品供应，⁹,¹³–¹⁷ 本综述将其称为*慈善食品供给*。医学营养治疗及其他营养师服务，如社区烹饪课程，旨在治疗营养缺乏、维持瘦体重、改善生活质量和延长寿命、管理症状、促进药物治疗并避免食物与药物的相互作用，以及处理并发症。¹,⁴
    社区烹饪课程也被证明能够改善健康和生活技能，并增加参与营养和食品项目的可能性。⁹,¹³


    慈善食品供给服务最初是为了为急需帮助的人提供紧急食品服务而设立的。¹⁸,¹⁹ 尽管如此，食品银行和施粥所仍常被用作应对食物不安全问题的长期手段，尽管其干预效果有限。¹⁹
    大量研究已经开展，以说明这种方式提供食物为何无法解决食物不安全的根本原因。¹³,¹⁸–²² 例如，尽管在不列颠哥伦比亚省温哥华市中心东区有超过50个免费和低价食品中心在运营，但该地区居民中报告的食物不安全率仍然很高。¹⁹
    研究表明，仅有20%至30%经历食物不安全的人会利用慈善食品供给（如食品银行和膳食项目），因为这些服务具有污名化性质、无法满足人们的实际需求，并且存在许多其他局限性和负面后果。²²
    此外，Miewald *等人*及其他研究者强调，需要考虑HIV、贫困和性别之间的交叉性，以及这种交叉如何通过制造更多导航挑战来影响个体获得适当食品和营养的经历。¹³,¹⁸,¹⁹


    加拿大联邦政府向各省和地区分配医疗资金，旨在满足各地区的具体需求和优先事项。这种联邦拨款与省级或地区服务提供的模式构成了加拿大公共资助的医疗保健体系。²³
    对于原住民群体，非保险健康福利计划提供必要的医疗商品和服务保障。²⁴ 由于每个省都有个性化的资金和项目安排，加拿大没有针对感染者的医学营养治疗或社区营养的国家计划，²⁵,²⁶
    尽管在医学营养治疗对包括HIV在内的慢性病患者有益方面已有循证共识。²⁶,²⁷ 一个协调且全面的方法将有助于确保知识和资源的高效有效共享。²⁶,²⁷ 为了优化结果，服务于特定人群（包括妇女和儿童、老龄化人群以及男男性行为者）的组织可以尝试提供最适合其需求的专业项目。资源往往因地区而异，因此，与当地地理、社会和政治背景相交织的定制化应对措施是常见的，而且往往是满足当地需求所必需的。²⁸


    除了项目本身，为感染者提供服务的医护人员和服务提供者也需获得特定支持，以便提供尽可能最佳的照护。因此，全球卫生人力联盟（2010年）对感染者的医疗保健服务状况进行了审查，并提出了建议，包括加强对初级保健中医护人员和服务人员的支持。²⁹
    所确定的支持包括资源、灵活性、跨专业教育机会和高质量的沟通。加拿大国内外的多项同行评审原创研究也发现了类似的结果。


    对MEDLINE、Cochrane系统评价数据库、PROSPERO的初步检索，以及


