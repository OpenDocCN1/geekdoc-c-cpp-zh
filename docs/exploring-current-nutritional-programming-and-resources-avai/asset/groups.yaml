    forefront of the conversation surrounding available nutrition and food resources
    in Canada. This extends beyond research and into practice. Counseling and communications
    that are inclusive and recognize the diversity of this patient population and
    their needs are key.


    Dissemination of the review results have been and will continue to be formative
    (eg, community meetings, consultation) and summative. Results were used to build
    the subsequent 3 FoodNOW project phases, which have been disseminated via traditional
    academic routes, including conferences, manuscripts, and reports. Innovative approaches,
    such as infographics and short videos, depending on audience (eg, funders, academics,
    government, PLWH, service providers), may also be employed. For instance, we have
    presented preliminary findings in the context of integrated knowledge translation
    (iKT) through a poster presentation at the KT Canada Scientific Meeting in spring
    2022.⁵³ We have also presented a needs assessment summary of the findings in the
    form of a poster and oral presentation at the KT Scientific Meeting in spring
    2023.⁵⁴ Sharing the learnings from this project and plans on how the data will
    be used/implemented with PLWH and other community members remains one of the key
    priorities towards our iKT objectives.


