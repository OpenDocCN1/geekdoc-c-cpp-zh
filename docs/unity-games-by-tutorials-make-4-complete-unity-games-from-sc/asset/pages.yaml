  md: "```\n//2\nvoid OnEnable()\n{\n    UpdateInfo();\n}\nprivate void UpdateInfo()\n\
    {\n    // Calculate new price for upgrade\n    //3\n    upgradePrice = Math.CeilToInt(TowerManager.Instance.\n\
    \    GetPrice(tower.type) * 1.5 * tower.towerLevel;\n\n    //4\n    txtInfo.text\
    \ = tower.type + \" Tower Lv \" + tower.towerLevel;\n    //5\n    if (tower.towerLevel\
    \ < 3)\n    {\n        btnUpgrade.SetActive(true);\n        txtUpgradeCost.text\
    \ = \"Upgrade\\n\" + upgradePrice + \" Gold\";\n    } else\n    {\n        btnUpgrade.SetActive(false);\n\
    \    }\n}\n\n//6\npublic void UpgradeTower()\n{\n    if (GameManager.Instance.gold\
    \ >= upgradePrice)\n    {\n        GameManager.Instance.gold -= upgradePrice;\n\
    \        tower.LevelUp();\n        gameObject.SetActive(false);\n    }\n}\n```\n\
    \nTaking each comment in turn:\n\n+   1. Find the upgrade button.\n2. When the\
