    {\n  blackBackground.SetActive(true);\n  winGameWindow.SetActive(true);\n}\n\n\
    public void ShowLoseScreen()\n{\n  blackBackground.SetActive(true);\n  loseGameWindow.SetActive(true);\n\
    }\n```\n\nEach of these methods opens the corresponding window and enables the\
