  md: "# Unity Games by Tutorials\n\nYou're in the homestretch wherein you'll write\
    \ the final bit of code to interpret JSON level files and dynamically reconstruct\
    \ whatever the player chooses.\n\nOpen GameManager.cs and add the following:\n\
    \n```\nprivate void LoadLevelContent()\n{\n  var existingLevelRoot = GameObject.Find(\"\
    Level\");\n  Destroy(existingLevelRoot);\n  var levelRoot = new GameObject(\"\
    Level\");\n}\n```\n\nThis code runs when the game scene loads. It finds the existing\
    \ Level GameObject, destroys it and creates a new, \"clean\" Level GameObject.\n\
    \nThis might seem a little backward, but there's a good reason for it. The Game\
    \ scene already contains a Level GameObject that has a child level layout, the\
    \ scene was used to design and edit the example levels and save them to JSON.\n\
    \nIf you just reconstruct a level with the Game scene, then you would get duplicate\
    \ objects and a big, sticky mess. When you destroy the level root GameObject and\
    \ its children, you tidy up the scene. When the script creates that new Level\
    \ GameObject, it's ready to host the loaded level.\n\nJust below the last line\
    \ of code inside the LoadLevelContent() method, add the following:\n\n```\n//\
    \ 1\nvar levelJsonContent = File.ReadAllText(selectedLevel);\nvar levelData =\
    \ JsonUtility.FromJson<LevelDataRepresentation>(levelJsonContent);\n// 2\nforeach\
    \ (var li in levelData.items) {\n  var pieceResource = Resources.Load(\"Prefabs/\"\
    \ + li.prefabName);\n  if (pieceResource == null)\n    Debug.LogError(\"Cannot\
    \ find resource: \" + li.prefabName);\n  // 4\n  var piece = (GameObject)Instantiate(pieceResource,\
    \ li.position, Quaternion.identity);\n  var spritePiece = piece.GetComponent<SpriteRenderer>();\n\
    \  if (spritePiece != null) {\n    spritePiece.sortingOrder = li.spriteOrder;\n\
    \    spritePiece.sortingLayer = li.spriteLayer;\n    spritePiece.color = li.spriteColor;\n\
    \  }\n  // 5\n  piece.transform.parent = levelRoot.transform;\n```\n\nChapter\
    \ 14: Saving Data\n\nraywencher.com\n\n408"
