- pgno: 82
  md: 'Descriptive Name and Negative Name are the names presented to the user in the
    Unity game launcher if they want to rename the keys. You can disable the Unity
    game launch and provide your own key mapping interface if you''d, so these aren''t
    required properties.* Negative and Positive Buttons are the actual keys being
    used. Allow buttons to have negative or opposite keys. For instance, the right
    arrow key is positive while the left arrow is. You don''t need to provide a negative
    for all keys — it wouldn''t make sense to provide a negative key for a use.*Alt
    Negative and Alt Positive Buttons are alternative keys. In this case, instead
    of Left and Right Arrow keys, you enable the A and D keys.


    The other fields mostly relate to the functionality of analog sticks. For simplicity,
    this game will only use keyboard input. If you wanted to make the game bonafide
    twin stick shooter, these are the options you''d tweak to create a tight control
    scheme.


    # Accessing input from code


    Now to actually implement the control scheme. In the Project Browser, double-click
    the PlayerController script to launch the editor.


    When the code editor opens, you''ll see your first script. Every new script contains
    empty implementations for Start() and Update().


    Look for a blank line below the first { (a.k.a., “curly bracket”) — that’s the
    class definition. Add the following code:


    ```

    public float moveSpeed = 50.0f;

    ```


    > Note: If you are new to programming languages, it''s critical that you copy
    everything exactly as it is written. Any deviation will produce errors. Programming
    languages are very precise and grumpy when you use the incorrect case or syntax.


    If your script throws an error, carefully review the code to make sure you didn''t
    miss, forget or mess something up.


    moveSpeed is a variable that determines how fast the hero moves around in the
    arena. You set it to a default value of 50 that you can change in Unity''s interface.


    Now, to write the actual moving code. In Update(), add the following:


    ```

    Vector3 pos = transform.position;

    ```'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Unity Games by Tutorials


    This bit of code simply gets the current position of the GameObject — in this
    case, the space marine since that is what this script is attached to — stores
    it in a variable named pos. In Unity, a Vector3 encapsulates the x, y and z of
    a GameObject, i.e., the object''s position in 3D space.


    Now comes the tricky part. Add the following after the previous line:


    ```

    pos.x += moveSpeed * Input.GetAxis("Horizontal") * Time.deltaTime;

    pos.z += moveSpeed * Input.GetAxis("Vertical") * Time.deltaTime;

    ```


    When you move it, it''ll be on z- and x-axes which represents up and down. Because
    there are two different input sources ("Horizontal" for left and right, and "Vertical"
    for up and down), you need to calculate values for each axis separately.


    Input.GetAxis("Horizontal") retrieves a value from the Horizontal component of
    the Input Manager. The value returned is either 1 or -1, with 1 indicating that
    a positive button in the Input Manager is being pressed. According to the settings
    you saw earlier, this is the right arrow or d keys. Similarly, a value of -1 indicates
    that a negative button is being pressed, meaning it was the left arrow or a key.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_83_0.png)


    Whatever the returned value may be, it''s multiplied by the moveSpeed and added
    to the current x position of the GameObject, effectively moving it in the desired
    direction.


    The same thing happens with Input.GetAxis("Vertical"), except it retrieves a value
    from the vertical component of the Input Manager (indicating with the s, down,
    w or up keys), multiplies this (1 or -1) by the moveSpeed and adds it to the z
    position of the GameObject.


    So what? with Time.deltaTime? That value indicates how much time has passed since
    the last Update(). Remember, Update() is called with every frame, so that time
    difference must be taken into account or the space marine would move too fast
    to see.


    TL/DR: Time.deltaTime ensures movement is in sync with the frame rate.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# What do these numbers mean?


    By default, Unity considers one point to be equal to one meter, but you don''t
    have to follow this logic. For instance, you may be making a game about planets,
    and that scale would be too small. For the purposes of simplicity in this book,
    we have sized our models to follow Unity''s default of one point per meter.


    Now that you''ve altered the location, you have to apply it to the SpaceMarine
    GameObject. Add the following after the previous line:


    ```

    transform.position = pos;

    ```


    This updates the SpaceMarine GameObject''s position with the new position.

    Save the script and switch back to Unity. You may be tempted to run your game,
    but there''s a slight problem. The camera is not positioned correctly.


    In the Hierarchy, select the Main Camera, and in the Inspector, set Position to
    (-9.7, 53.6, -56.1) and Rotation to (30, 0, 0). I determined these values by moving
    the camera around manually and looking at the Camera preview in the lower right
