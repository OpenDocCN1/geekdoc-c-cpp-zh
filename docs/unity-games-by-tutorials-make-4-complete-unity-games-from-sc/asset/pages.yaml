  md: '# Fire Tower


    The time has come to create the Fire Tower – a hugely overpowering weapon of mass
    destruction — that will obliterate your foes en masse.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_559_0.png)


    Before being able to set up the Fire Tower, you''ll need to fix up its particles.
    Select the Fire Tower Particles prefab inside the Prefabs ▸ Particles folder and
    notice the component with its script at the bottom of the Inspector. Press the
    selection button next to Missing (Mono script) and select AutoScaler. This should
    re-link the component to its script.


    > Note: This happened because this prefab was created with the original copy of
    AutoScaler.cs. But that was deleted so you could rebuild it in the previous chapter,
    Chapter 18, "Making a Tower Defense Game.\ So now you need to associate your version
    with it. Whenever you find yourself with a missing script like this, remember
    you can just re-link it like you did here — as long as you remember which script
    was unlinked.


    Moving on, the Fire Tower needs a unique script to make it work. Create a C# Script
    named FireTower inside the Scripts ▸ Game ▸ Tower folder and open it in a code
    editor. To derive it from the Tower class, replace this line:


    ```

    public class FireTower : MonoBehaviour {

    ```


    with:


    ```

    public class FireTower : Tower {

    ```


    Now remove both the Start() and Update() methods and add this code in their place:


    ```

    //1

    public GameObject fireParticlesPrefab;

    //2

    protected override void AttackEnemy()

    {

    n//3

    base.AttackEnemy();

    //4

    ```'
