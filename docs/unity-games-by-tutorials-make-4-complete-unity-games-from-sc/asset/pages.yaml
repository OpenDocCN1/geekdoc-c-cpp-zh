- pgno: 479
  md: 'The Graph editor displays a motion graph for selected keyframes. This lets
    you fine-tune the speed of each tween, slowing or speeding up an animation on
    either side of a keyframe. This is called easing.


    The Timeline shows a simplified overview of your entire timeline, with playback
    controls.


    > Note: To move the playhead in any timeline view, Right-click and drag. Zoom
    and Pan controls are almost the same as in the 3D View: Scrollwheel to zoom, and
    Middle-click and drag to pan. Holding Shift to pan is not necessary in a 2D panel.


    # Creating an Action for the tail animation


    Blender allows you to create multiple animations for a single armature, which
    can be triggered independently in Unity. Each animation is called an Action. You''ll
    use Actions to create a looping animation for a swaying tail and a separate, non-looping
    animation for a swaying claw.


    > Note: For more information on how to trigger these animations in Unity, Chapter
    5, "Animations."


    +   1. At the bottom of the Dope Sheet panel, click the Dope Sheet pop-up and
    select Action Editor.


    +   2. Click the New button to create a new Action.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_479_0.png)


    +   3. Click the Action name and change the name to Tail Sway.


    +   4. **Important:** Click the F button next to the name. This gives the Action
    something called a Fake User, and forces Blender to save your action, even if
    it is unlinked. I won''t go into detail on this, except to note that your Action
    may not be saved if you do not press this button!


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_479_1.png)'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# Creating keyframes


    First all, you''ll create a looping animation for the tail, so that it bobs back
    and forth as the minion trund along its path. In the 3D View, press 1 to switch
    to Front view, 5 to turn off perspective. Press N to turn on the Properties shelf.


    You''ll animate the Tail IK bone to move along a path like this:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_480_0.png)


    > Note: I''ll be giving you exact coordinates for each keyframe, but feel free
    to eyeball it and use what looks right to you. The values you may also be slightly
    different, since they are relative to where the Tail IK bone was first created.


    +   1. Make sure you are in Pose mode, and select the Tail IK bone. In the Properties
    shelf, set the Location coordinates to: X 0, Y 3, Z 10.3 (as shown at the top-right
    of the screenshot above).

    2. Make sure the playhead is on frame zero, then right-click on the X field (the
    one you just set to zero) and select Insert Single Keyframe. Do the same for the
    Y field. The fields turn yellow to show that they have been keyed.

    3. Look in the Dope Sheet; a new channel appears for each of the values you have
    keyed, with the name of the value — X Location — followed by the name of the object
    in brackets — (Tail IK). The keyframe itself displays as a diamond on the Dope
    Sheet''s timeline.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_480_1.png)'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# Unity Games by Tutorials


