  md: '# Configuring lighting in your scene


    In the **3D View**, switch the Viewport Shading to **Material**. This will let
    you see the material colors you apply, right in the Main view.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_448_0.png)


    Not much changes, because you haven''t mapped your model yet. But notice that
    with the default lighting in a Blender scene, it can be hard to see your model
    from all angles.


    Orbit around to the bottom of the model and it looks almost completely black.
    When adding color to your model, you want to be able to see it from any angle.


    Select the light in your scene. It looks like this:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_448_1.png)


    > **Note:** You can also select it by clicking the **Lamp** object in the Outliner,
    at the top-right of your screen.


    In the **Properties** panel, click the **Object Data** tab and in the **Lamp**
    section, change it from **Point** to **Sun**.'
  merge: -1
  img_proc: true
