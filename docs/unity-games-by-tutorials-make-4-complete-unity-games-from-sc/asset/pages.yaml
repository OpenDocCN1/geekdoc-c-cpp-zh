  md: 'Unity Games by Tutorials


    polygons of an object. Press Tab to toggle between these two modes. You''ll see
    the pop-up at the bottom of the view change:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_420_0.png)


    > Note: It can be easy to forget which mode you are in while working. Be sure
    to check the pop-up above if something isn''t working as you expect; you might
    be trying to do something in Edit mode that can only be done in Object mode, and
    vice versa.


    # Slice-n-dice with the Knife tool


    The Knife tool creates a new edge on a face, cutting it in two. Create some boards
    on the front of the wheel by cutting it into four separate faces:


    +   1. Press K, click once on the top-middle vertex, then click on the bottom
    vertex and press Enter to complete the operation. (Operation! Polygon surgery...
    Badum-ching!)

    2. Repeat the process for the vertices shown here...

    3. ... and here.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_420_1.png)


    # Mesh Select mode


    While in Edit mode, sometimes you want to work just with points (vertices), sometimes
    with edges, and sometimes with entire faces. There are three options for working
    with these elements of mesh: Vertex Select, Edge Select and Face Select. Switch
    between them by pressing Ctrl-Tab or by using the toggle buttons at the bottom
    of the 3D View.


    Switch to Face Select:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_420_2.png)'
