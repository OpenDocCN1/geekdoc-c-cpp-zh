- pgno: 530
  md: '# # Chapter 19: Making Towers

    By Eric Van de Kerckhove


    In the previous chapter, Chapter 18, "Making a Tower Defense Game," you learned
    how to create paths and spawn your enemies to follow those paths. But that''s
    not much of a game. To even the playing field a little, you need some killer towers
    to lob stones, ice and even fire at your invaders!


    In this chapter, you''ll create all the missing pieces to make the final game.
    In the process, you''ll learn how to:


    +   - Create waves of enemies.

    - Make towers that shoot projectiles.

    - Craft a UI that binds everything together.

    - Make winning and losing logic.


    You can continue from where you left off in Chapter 18, but if you want to start
    fresh, open the starter project in Unity. Open the Game scene and prepare for
    making some awesome scripts!


    First up: Creating a tower.'
