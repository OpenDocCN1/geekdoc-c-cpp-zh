    # # Creating spawn points


    What good are bloodthirsty aliens unless they spawn in mass quantities? In this
    section, you''ll set up spawn points to produce enemies to keep our hero on his
    toes.


    So far, you''ve assembled the game with GameObjects that you want the player to.
    When it comes to spawn points, you don''t want anybody to see them. It''s important
    that you *know* where they lay.


    You could create a 3D cube and place it in your scene to represent a spawn point,
