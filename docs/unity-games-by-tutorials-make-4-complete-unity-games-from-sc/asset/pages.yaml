    # # Prefabs and Resources


    Prefabs are essential to fluid gameplay. Rather than creating hundreds (thousands?)
    of sprites during the game, which nibbles away at processing power, Unity can
    use prefabs as templates to create various GameObjects on demand.


    In the case of Soy Boy, you''ll use prefabs to create levels. They consist of
    multiple copies of a base set of level blocks and shapes. Then you''ll just clone
    these prefabs to make new levels.'
