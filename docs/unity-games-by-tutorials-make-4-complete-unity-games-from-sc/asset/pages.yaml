- pgno: 346
  md: '# Unity Games by Tutorials


    There''s a logic quirk here: The higher in the stack, the lower it renders on
    screen. For instance, the Background layer will render near the bottom of the
    stack, and the UI layer will render above everything else.


    You''d probably like to know what each layer does in the game:


    +   - Default: A layer provided by Unity.


    +   - Background: Background sprites, such as mountains, scenery or background
    blocks that don''t obstruct the player''s path will go here.


    +   - Hazards: Hazards and traps such as the blade will go in this layer.


    +   - Foreground: Super Soy Boy will be placed here with most level elements.


    +   - UI: Another layer that''s specifically for rendering UI elements such as
    buttons and canvases.


    As it stands now, your sprites will almost certainly do a funky rendering dance
    on screen. But now you know what it causes and it probably have some idea of how
    to fix. In the next few steps, you''ll reorganize the sprites with Sorting Layers.


    Select the SoyBoy GameObject in the Inspector, for the Sprite Renderer component.
    Change the Sorting Layer from Default to Foreground and change the Order in Layer
    to 1.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_346_0.png)


    You''re a rendering order of 1 for Super Soy Boy because he''ll be the Foreground
    layer with all the level building blocks—you''ll see when you construct a level.
    Building blocks will all use an Order in Layer value of 0. Therefore, Super Soy
    Boy will always render above the building blocks.


    Next, select the Buzzsaw GameObject in the scene and adjust the Sprite Renderer
    using the Hazards Sorting Layer with an Order in Layer value of 1.'
