    \ in\nUpdate():\n\n```\nalienScript.GetDeathParticles().SetDeathFloor(deathFloor);\n\
    ```\n\nFinally, save all your files and switch to Unity.\n\nIn the Project view,\
    \ expand the Alien prefab and select the AlienParticlesGameObject. Click Add Component\
    \ and under scripts, choose DeathParticles.\n\nNext, select the GameManager in\
    \ the Hierarchy and drag the DeathFloor to the\nDeathFloor property in the Inspector.\n\
