    # # Making the axles


    Add a cylinder to use as an axle:


    +   1. Press Shift-A and select Mesh ▸ Cylinder. In the tool options on the left,
    set the depth to 3.


    +   2. Type R Y 90 and press Enter to rotate it.


    +   3. Type S-X 0.2 followed by Enter to scale the axis. Note that pressing Shift-X
    excludes that axis from the scale operation; the objects scale only on the Z and
    Y axes. This works for move and rotate operations, too.


    > Note: If your new object doesn''t appear at the center of the scene, you may
    have accidentally moved the 3D Cursor (a dotted red and white circle) by right-clicking
    in the 3D View. All new objects are aligned with the 3D cursor. Reset it to the
    center of the scene by pressing Shift-S and selecting Cursor to Center.


    # # Duplicating the wheel


    Click the wheel object to select it.


    +   1. Type G X 1.2 and press Enter to move the wheel to the end of the axle.'
