- pgno: 501
  md: '# Making a path


    To prepare the map for enemies to move about, you''ll need to make a simple waypoint
    system so that they can go from point to point. This is one of the easiest ways
    of doing primitive pathfinding.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_501_0.png)


    To start, create a new empty GameObject in the root of the Hierarchy and name
    it EnemyPaths. Select the object. Then reset its Transform by clicking on the
    Settings in the Inspector panel. In the drop-down, click on Reset.


    Now, make another empty GameObject and name it Path 0. In the Hierarchy panel,
    drag Path 0 onto EnemyPaths to make it a child GameObject.


    There will be two paths that the enemies can traverse; this is the first one.
    It''s named Waypoint (1) because you will use it later in a zero-based array.


    Create a new Sphere (Create > 3D Object > Sphere), set its scale to (0.3, 0.3,
    0.3) and name it Waypoint (1). Set its position to (2, 0, -5) and parent it to
    Path 0. This is the starting point of the path and also the spawning point of
    any enemies that will use this path. Now, duplicate Waypoint (1) by right-clicking
    on it and selecting Duplicate from the Context menu. Set its position to (2, 0,
    4).


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_501_1.png)'
  merge: -1
  img_proc: true
- pgno: 502
