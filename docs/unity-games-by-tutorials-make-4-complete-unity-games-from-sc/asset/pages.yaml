  md: '# Structures and classes


    There are two different ways to organize your data in C#: Structures and classes.
    Let''s take a look at both and explore what the differences are.


    # Structures


    To define a structure, put the following after the last brace of Program.


    ```

    struct Point2D

    {

    }

    ```


    This defines a new object type called Point2D. This isn''t an object itself but,
    rather, a template of one. It doesn''t do much, so add the following between the
    braces:


    ```

    public int X;

    public int Y;

    ```


    The structure now defines a 2D point that contains two properties, an X and a
    Y location. public indicates that the properties can be changed from outside the
    object. If you only wanted to be able to change the properties from within the
    object itself, you would mark them as private.


    In C#, the convention is to capitalize public variables. In Unity, when the variable
    is only intended to be used in the Inspector, then the variable is lowercase.


    Now to create a new Point2D object. In Main(), before the closing brace, add the
    following code:


    ```

    Point2D myPoint = new Point2D();

    ```


    This creates a new Point2D struct object. Now, you need to set the properties
    of the Point2D. Add the following code:


    ```

    myPoint.X = 10;

    myPoint.Y = 20;

    ```


    The way to access the properties is through the dot operator followed by the property
    name, after which you can simply assign a value.


    Now that you''ve defined the state of the structure, you need to define the behavior.
    You do this by creating some methods.'
