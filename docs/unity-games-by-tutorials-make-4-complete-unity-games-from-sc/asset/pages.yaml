- pgno: 647
  md: '# [RequireComponent (typeof (Text))]


    This line of code enforces that a Text component must be available. Unity will
    automatically add the component, and it will prevent you from removing it so long
    as the attribute is there.


    # SerializeFieldField


    You can use this attribute when you want a field to be accessible in the Inspector,
    but not accessible from other scripts.


    ```

    [SerializeField]

    private bool isAlive = true;

    ```


    Using the above code, you can now set the value of isAlive in the Inspector, but
    not from other scripts.


    # HideInInspector


    You can also hide public values in the Inspector as well.


    ```

    [HideInInspector]

    public int Score

    ```


    Here, the variable is exposed to other scripts but will not appear in the Inspector.


    # Setting a range


    Instead of using a text field to set a number, you can use a slider instead. This
    means that a value will never be outside any range.


    ```

    [Range (1,100)]

    public int secretNumber;

    ```


    The field will now look like this in the Inspector:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_647_0.png)


    # Special folders


    Throughout the book, you''ve organized the Project browser according to the assets
    used. Placing assets in these folders alters the behavior of the editor. Typically,
    you do to tweak the editor to your needs, but you can also create a plugin for
    the editor as well.'
  merge: -1
  img_proc: true
- pgno: 648
  md: '# Editor


    Any assets placed in the Editor folder will be treated as editor augmentations.
    These scripts allow you extend the editor and add additional functionality. When
    you build a game, these assets are removed and not included with the final game.


    # Gizmos


    Gizmos are graphics used in the Scene view to help you annotate the scene. For
    instance, you can use them to denote invisible spawn points.


    # Plugins


    The plugin folder contains any code that can extend Unity. These plugin files
    can be DL DLLs (Dynamic Link Library) written in C or C++ that you incorporate
    directly into Unity.


    # Resources


    Resources are additional files you can include with your game that can be loaded
    on-demand. For instance, you might want to use XML to store some of your game
    variables. You would include those XML files inside the Resources folder, and
    then load them on demand.


    # Standard assets


    If you import any of the packages from Unity’s standard assets, these assets will
    be included in this folder.


    # Streaming assets


    These are assets that are streamed from the file system to the player. For instance,
    if you were to include a movie with your game, you’d place the movie file inside
    this folder.


    # Where to go from here?


    As you can see, the Unity API goes very deep.


    By going through this book and this chapter, you now have some practical experience
    making games with Unity, and a firm overview of the Unity API. From here on out,
    we recommend you just dive into making your own game!


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_648_0.png)'
  merge: -1
  img_proc: true
