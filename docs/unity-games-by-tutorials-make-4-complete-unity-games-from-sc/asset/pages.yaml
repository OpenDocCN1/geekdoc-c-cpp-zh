  md: '# Unity Games by Tutorials


    Why did you get console errors in the first place?


    Play the game again and watch the aliens carefully. You''ll see all but one of
    them milling about. You dragged this non-moving alien to the scene a while back
    — it wasn''t created by the GameManager. Hence, it has no target and the GameManager
    doesn''t know about it.


    This seemingly small issue has potential to break the balance of your game. To
    fix this, find the alien in the hierarchy and delete it. Buh-bye little orphan
    alien!


    Move on to the second: Slow-moving aliens. Frankly, this is an easy fix. It''s
    part of the NavMeshAgent properties.


    +   * Speed: How fast the agent moves in world units per second. Set this to 20.


    +   * Angular Speed: Determines rotation speed in angles per second. Set this
    to 120 (the default value).


    +   * Acceleration: How fast the agent increases speed per second. Set this to
    15.5.


    +   * Stopping Distance: How close the agent stops near its goal. Set this to
    0 (the default value).


    +   * Auto Braking: Slow as the agent approaches its goal. Uncheck this.


    | Steering | |

    | --- | --- |

    | Speed | 20 |

    | Angular Speed | 120 |

    | Acceleration | 15.5 |

    | Stopping Distance | 0 |

    | Auto Braking | |


    Those values were obtained by playing the game at a base difficulty. Later, as
    the gameplay progresses, you may want to alter those values to make the game easier
    or harder.


