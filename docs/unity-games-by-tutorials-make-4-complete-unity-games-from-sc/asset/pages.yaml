    - Particle System and how it can make some cool effects.

    - Animation Events and how they can be used to call code from your animation clips.


    Believe it or not, you''ve barely explored Unity''s capabilities and have a lot
    more to look forward to in this book.


    In the next section, you''ll put your skills to use to create a first-person shooter
