  md: '# Unity Games by Tutorials


    Congratulations! You''ve created your first sprite. It''s that simple.


    Unity automatically created a GameObject, with an attached SpriteRenderer, and
    assigned sprite texture. Look at the Inspector to confirm that the GameObject
    was created with a Transform and a SpriteRenderer component.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_329_0.png)


    You might wonder what''s up with the white sprites in the Sprites sub-folder.
    The answer is simple: You can easily color them dynamically in-game, or in the
    editor with your own color choice, without having to create sprites for each color.


    The single-block sprite will serve as the basic block for the ground — a.k.a.
    platform that Super Boy boy runs along. With that in mind, you''ll color it brown
    to represent terrain.


    In the Hierarchy, select the single-block GameObject and click Color in the Inspector
    to bring up a color picker.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_329_1.png)


    Enter the hex value: 59443CFF. Close the color picker.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_329_2.png)


    raywenderlich.com


    330'
  merge: -1
