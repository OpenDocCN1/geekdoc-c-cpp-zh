- pgno: 240
  md: '# # Chapter 9: The Player and Environment

    By Anthony Uccello


    In the next few chapters, you''ll create a first-person shooter game, or FPS as
    it''s more commonly known. Some well-known FPS titles include Halo, Call of Duty,
    and Doom.


    The game that you''ll create **Robot Rampage**; you''ll control a player who has
    to mow down robots to survive. The robots will spawn in waves and the player must
    collect health, ammunition and armor pickups in order to starve the robots as
    long as possible. The longer the player survives, and the more robots they kill,
    the higher the score.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_240_0.png)


    This game is broken down into three parts. In this first part, you''ll set up
    the weapons, add sounds and the code to handle all the firing.


    In the next chapter, you''ll add the robot bad guys, some power-ups and lots of
    flying projectiles.


    In the final chapter, you''ll add all the user interface elements to keep track
    of the score, ammo and even a menu to restart the game when it''s over.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Unity Games by Tutorials


    Chapter 9: The Player and Environment


    In short, you''ll have a completed FPS game.


    # # Getting started


    To get started, open up the starter project in Unity. In the Project browser,
    open the Scenes folder and double-click the Battle scene to open it.


    Believe it or not, the map is mostly set up for you. The map itself consists of
    a floor, surrounded by a series of walls. After you complete the tutorial, feel
    free to create other configurations for the game by adjusting the wall positions.


    To get started, you''ll need to set up the GameObjects so that the robots can
    avoid them. So in this book, you''ve been using layers, but Unity has another
    tool known as tags. A tag is just a bit of text used to identify GameObjects.
    Each GameObject can have only one tag and, thankfully, they''re easy to use. By
    assigning a tag to each GameObject, you''ll be able to set up some pathfinding
    rules for the robots to follow that they can move around walls.


    In the Hierarchy, click on the InnerWalls GameObject. In the Inspector, click
    the Tag drop-down and click Add Tag.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_241_0.png)


    raywenderlich.com


    242'
  merge: -1
  img_proc: true
