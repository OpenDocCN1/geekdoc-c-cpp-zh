- pgno: 483
  md: 'This will create a smoother looping motion, when the animation goes from frame
    80 back to frame 1.


    Smooth out the curves on all the points, so that your path looks looks more like
    this:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_483_0.png)


    > Note: When editing the points on a curve, you need to click and drag a bit to
    get the handle moving, then release the mouse button. The handle will still be
    active, and moving the mouse will reposition it. Click again, to finish the adjustment.


    Press Alt-A to preview the animation. Much better already! But it can be a bit
    better, still.


    Look at the Graph editor; see how the valley and peak of your loop don''t look
    quite right? They''re not quite smooth as they could be. The two keyframes on
    either side are a bit too close together.


    To fix this, you''ll use a familiar tool (Scale), and one new one: Box Select.
    You could Shift-select the two points you want to adjust, but there''s an easier
    way.


    +   1. Press A to Select None, then press B to invoke the Box Select tool.


    +   2. Click and drag around the objects you want to select.


    +   3. The objects are selected.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_483_1.png)


    > Note: Box Select can be used in almost any panel in Blender.


    Now that you have your keyframes selected, simply press S, then drag your mouse
    to scale them. Pull the keyframes away from each other nicely, until you have
    a nice rounded curve. Repeat this for the keyframes at frames 55 and 65, so that
    your graph'
