  md: "```\npublic bool frozen;\n//3\nprivate float freezeTimer;\n```\n\nThese variables\
    \ are going to be used for the enemies to keep track of their freezing state caused\
    \ by the IceTowers\n\n+   1. The duration in seconds this enemy stays frozen.\n\
    2. Is this enemy frozen or not?\n3. This enemy timer counts up while the enemy\
    \ is frozen. When it reaches the timeEnemyStaysFrozenInSeconds duration, the enemy\
    \ defrosts.\n\nAdd these methods under Die():\n\n```\n//1\npublic void Freeze()\
    \ {\n  if (!frozen) {\n    //2\n    frozen = true;\n    moveSpeed /= 2;\n  }\n\
    }\n//3\nvoid DefrostTimer() {\n  freezeTimer = 0f;\n  frozen = false;\n  moveSpeed\
    \ *= 2;\n}\n```\n\nHere's what this code does:\n\n+   1. Freezes the enemy, if\
    \ it wasn't already.\n2. Set the frozen flag and half this enemy's speed.\n3.\
    \ Defrost the enemy by resetting the timer, unsetting the frozen flag and restoring\
    \ the enemy's speed.\n\nNow, add this code to Update(), under the existing if..else\
    \ statement:\n\n```\n//1\nif (frozen) {\n  //2\n  freezeTimer += Time.deltaTime;\n\
    //3\n  if (freezeTimer >= timeEnemyStaysFrozenInSeconds)\n```\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_562_0.png)"
