- pgno: 50
  md: '# # Chapter 2: GameObjects


    By Brian Moakley


    In the last chapter, Chapter 1, "Hello Unity," our brave hero was left alone with
    fantasies in his barely attached bobblehead of encountering aliens to blast.


    In this chapter, you''ll make your dreams come true. But, first, you must understand
    one crucial concept: **GameObjects.**


    > Note: This chapter''s project continues from the previous chapter, Chapter 1,
    "Hello Unity." If you didn''t follow along, or you want to start fresh, please
    use the starter project from this chapter.


    # # Introducing GameObjects


    In Unity, game scenes contain objects with a name that you''ll never guess: GameObjects.
    :]


    There are GameObjects for your player, the aliens, bullets on the screen, the
    actual geometry — basically, everything in the game itself.


    Just as the Project Browser contains all assets, the Hierarchy contains a list
    of GameObjects in your scene.


    To see this, you''ll need to have your project open so, if it isn''t open already,
    do so.


    > Note: Unity''s way of opening project files is a bit strange. You can navigate
    your file system and look for a scene file. Double-click the scene, then Unity
    will open the unity welcome. From that screen, you can select the project that
    you want to open.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Unity Games by Tutorials


    # Chapter 2: GameObjects


    Or, if you start Unity or click **File>Open Project**, you''ll see a project list.
    Select the desired project and Unity will take care of the rest.


    If your project is not listed, click the **Open** button to bring up a system
    dialog box. Instead of searching for a particular file, try navigating to the
    top-level directory of your project and click **Select Folder**. The engine will
    detect the Unity project within the folder and open it.


    When you open an older Unity project or even a project from this book, you may
    get a warning from Unity that the project was created with an older version of
    Unity. All this means that Unity may re-import all your assets. That is, it will
    create new metadata for all your assets. Needless to say, for large games, this
    re-import could take a long time. Also, since Unity is updating your project,
    you should ALWAYS make a backup first.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_51_0.png)


    When your project is open, take a look at your Hierarchy and count the GameObjects.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_51_1.png)


    Your first thought may be three because you added three GameObjects in Chapter
    1: Arena, space marine body and space marine head.


    However, there are two other GameObjects: **Main Camera** and **Directional Light**.
    Remember how Unity creates them by default? Yes, these are also GameObject.


    Yet, there are even more GameObjects. You''ll notice that there are disclosure
    triangles to the left of the GameObjects that you imported.


    Holding down the **Alt button** on PC, or **Option** on Mac, **click** each **disclosure
    triangle**.


    raywenderlich.com


    52'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Unity Games by Tutorials


    # Chapter 2: GameObjects


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_52_0.png)


    As you can see, you have so many GameObjects:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_52_1.png)


    Three important points to remember:


    +   - GameObjects can contain other GameObjects. On a base level, this useful
    behavior allows organizing and parenting of GameObjects that are related to each
    other. More importantly, changes to the parent GameObjects may affect their children
    — more on this in just a moment.


    +   - GameObjects are converted into GameObjects. Unity creates create GameObjects
    for the various pieces of your model that you can alter any other GameObject.


    raywenderlich.com'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Unity Games by Tutorials


    +   * Everything contained in the Hierarchy is a GameObject. Even things such
    as cameras and lights are GameObjects. If it''s in the Hierarchy, it''s a GameObject''s
    subject to your command.


    Our hero is so bold that he''s picking his nose with his gun. You need to get
    him moving but, first, you need to reposition your GameObjects.


    # Moving GameObjects


    Before starting, collapse all the GameObject trees by clicking the disclosure
    triangles.


    Select BobbleArena in the Hierarchy and take a moment to observe the Inspector,
    which provides information about the selected GameObject.


    GameObjects contain a number of components, which you can think of as small units
    of functionality. The one that all GameObjects contain: The Transform component.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_53_0.png)


    The Transform component contains the position, rotation and scale of the GameObject.
    Using the inspector, you can set these to specific numbers instead of having to
    rely upon your eye. When hovering the mouse over the axis name, you will see arrows
    next to the pointer.


    Press the left mouse button and drag the mouse left or right to adjust those numbers.
    This trick is an easy way to adjust the values by small increments.


    With BobbleArena selected, set Position to (-6.624, 13.622, 6.35). As I developed
    this game, the arena ended up in this position. You could just as well have placed
    it in the center of the game of the world. Set the Scale to (2.0, 2.0, 2.0). This
    gives the player more room to navigate the arena.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Unity Games by Tutorials


    # Chapter 2: GameObjects


    If you zoom out of the Scene view, you''ll probably notice the space marine is
    suspended in the void; mostly likely, he''s questioning his assumptions about
    gravity. You could move his head and then his body, your life will be much easier
    if you group his body parts into one GameObject.


    In the Hierarchy, click the Create button and select Create Empty.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_54_0.png)


    An empty is a GameObject that has only the one required component that all GameObjects
    have — the Transform component, as you learned earlier.


    > Note: You can also create an empty GameObject by clicking GameObject>Create
    Empty. This goes for other things such as components. There is no “preferred”
    way to do things — go with whatever works best for your workflow.


    # Parenting the space marine


    In the Hierarchy, you''ll see your new GameObject creatively named: GameObject.
    Single-click the GameObject and name it SpaceMarine.


    You can insert spaces in GameObjects'' names, e.g., Space Marine. However, for
    the sake of consistency, you''ll use camel casing for names in this book.


    Drag BobbleMarine-Body and BobbleMarine-Head into the SpaceMarine GameObject.


    A few things happen when you parent GameObjects. In particular, the position values
    for the children change even though the GameObjects don''t move. This modification
    happens because GameObject positions are always relative to the parent GameObject.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Unity Games by Tutorials


    # Chapter 2: GameObjects


