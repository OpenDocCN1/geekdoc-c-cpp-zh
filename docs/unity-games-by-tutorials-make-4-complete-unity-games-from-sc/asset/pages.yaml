    #  Introducing character controllers


    The hero, not to be forgotten, needs some upgrades.


    In the last chapter, Chapter 3, “Components,” you learned how to make the character
    move by adding a Rigidbody, adding colliders and writing a script to make your
    character move. This was great for learning purposes, but there''s a simpler way:
    The character controller.


    A character controller is a built-in component that makes it easier to make characters
    in your game move based on user input. It combines all of the components that
    you added manually last into one, and provides a simple API to use it.


    Sorry to do this to you all that work in Chapter 3, but you need to strip the
    marine of its Rigidbody. Select the SpaceMarine GameObject in the Hierarchy, and
    in the Inspector, click Rigidbody’s gear icon and select Remove Component.


    | | | |

    |---|---|---|

    | Rigidbody | 1 | Reset |

    | Mass | 0 | Remove Component |

    | Drag | | Move Up |

    | Angular Drag | 0.05 | Move Down |

    | Use Gravity | | |

    | Is Kinematic | ☑ | Copy Component |

    | Interpolate | Hen | |

    | Collision Detection | Dis | Paste Component As New |

    | Constraints | | Paste Component Values |

    | Player Controller (Sc Script | | PlayerController |


    Click the Add Component button, go to the Physics category and choose Character
    Controller.'
