- pgno: 268
  md: '# # Chapter 10: Adding Enemies

    By Anthony Uccello


    In Chapter 9, “The Player and Environment,” you added the first-person controls,
    let the player switch guns, and added visual and audio effects.


    In this chapter, you''ll add some robots to the mix, but to make things interesting,
    there will be evil robots. Evil robots that will try to defeat you. You''ll add
    lots of them and give them the ability to fire — but to make things fair, you''ll
    also add some pickups as well. In short, by the end of this chapter, you''ll have
    yourself an FPS where enemies pose a real threat.


    # ## Creating the robots


    Open the current project in progress, or you can start fresh by opening the starter
    project for this chapter included with the Resources folder. Open the Battle scene
    to pick up where you left off.


    Click on the **Resources** folder and drag **RedRobot**, **YellowRobot** and **BlueRobot**
    onto the scene in front of the player, somewhere above ground level:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_268_0.png)


    You''ll now configure them all together, instead of separately as you have before.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Unity Games by Tutorials


    Click on the RedRobot GameObject, and hold down Control, Command on a Mac, while
    selecting the YellowRobot and the BlueRobot GameObjects.


    > Note: Whenever you''re asked to select the robots in the future, select all
    three of these robot GameObjects in this way.


    Click Add Component and select the New Script option. Make the script Robot. This
    creates a new script in the Assets folder.


    To keep things organized, move the Robot script from the Assets folder to the
    Scripts folder. Open the Robot script in your code editor.


    Add the following variables to your new Robot script inside the class:


    ```

    [SerializeField]

    private string robotType;


    public int health;

    public int range;

    public float fireRate;


    public Transform missileFireSpot;

    Unity.AI.NavMeshAgent agent;


    private Transform player;

    private float timeLastired;


    private bool isDead;

    ```


    robotType is the type of robot: RedRobot, BlueRobot or YellowRobot. Notice that
    you are serializing the variable. Again, this is so you can access it in the Inspector
    but not from other scripts. The value of this field matches a constant defined
    in the Constants script.


    health is how much damage robot can take before dying, range is the distance gun
    can fire, and fireRate is how fast it can fire.


    agent is a reference to the NavMesh Agent component, player is what the robot
    should track, and isDead tracks whether the robot is alive or dead.


    Save your work and switch back to Unity. Click the RedRobot GameObject and enter
    RedRobot in the robotType field. Set Health to 14, the Range value to 150, and
    the Fire Rate to 2. Click Apply when done to apply those changes to the prefab.'
