- pgno: 592
  md: 'Drag the Laser to the VR prefabs folder as well:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_592_0.png)


    You might be wondering why the "laser" is just a long rectangular prism, instead
    of a cylinder or a line renderer:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_592_1.png)


    Coupled with the Unlit material, the cube has all the properties you want from
    a good laser. It always has a consistent width no matter which angle you view
    it, and the caps won''t be visible, so the player won''t even notice it''s not
    a line!


    Select EventSystem and disable itsalone Input Module. You''re going to write your
    own input module for the controller, so you don''t have the mouse cursor fighting
    over the selection.


    In the Project view, create a new folder named VR in the Scripts folder. Create
    a new C# Script in there ViveControllerLookModule. Open it in your favorite code
    editor and remove the Start () and update() methods. Add these two lines to the
    other using statements at the top of the file:


    ```

    using System.Collections.Generic;

    using UnityEngine.EventSystems;

    using Valve.VR;

    ```


    Now replace this line:


    ```

    public class OcculusGazeInputModule : MonoBehaviour

    ```


    With this:


    ```

    public class OcculusGazeInputModule : PointerInputModule

    ```'
