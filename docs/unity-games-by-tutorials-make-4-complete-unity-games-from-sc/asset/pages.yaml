- pgno: 335
  md: '# Scripting: Smooth camera follow


    Scripting is an important part of working in Unity, and you''ll start with a simple
    script that makes the camera follow the player around smoothly. Part of what makes
    it smooth is that you''ll constrain it to a certain plane with X and Y boundaries.


    Open the Scripts folder and double-click CameraLerpTransform to open it in your
    code editor.


    Remove the empty Start() and Update() methods in the script template; this script
    does not require initialization and will use the FixedUpdate() method instead
    of Update() to follow the player because the physics engine will move the player.


    Place the following code into the now-empty CameraLerpTransform class:


    ```

    // 1

    public Transform cameraTarget;

    public float trackingSpeed;

    public float minX;

    public float minY;

    public float maxX;


    // 2

    void FixedUpdate()

    ```


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_335_0.png)'
  merge: -1
  img_proc: true
- pgno: 336
  md: "```\n{\n// 3\nif (camTarget != null) {\\n// 4\n  var newPos = Vector2.Lerp(transform.position,\n\
    \    camTarget.position,\n    Time.deltaTime * trackingSpeed);\n  var camPosition\
    \ = new Vector3(newPos.x, newPos.y, -10f);\n  var v3 = camPosition;\n  var clampX\
    \ = Math.Clamp(v3.x, minX, maxX);\n  var clampY = Math.Clamp(v3.y, minY, maxY);\n\
    \  transform.position = new Vector3(clampX, clampY, -10f);\n}\n}\n```\n\n+   1.\
    \ These public variable fields let you set the target the camera will track, tracking\
    \ speed and the camera's bounds.\n2. FixedUpdate() is called with every fixed-frerate\
    \ frame — it's the best method when dealing with a Rigidbody component of any\
    \ kind. The result is the camera will track the player, who will have a Rigid2D\
    \ attached to it.\n3. This null check ensures that a Transform component was assigned\
    \ to the camTarget field in the editor.\n\n4. Vector2.Lerp() performs linear interpolation\
    \ between two vectors by the third parameter's value (a value between 0 and 1).\
    \ Normally, you'd usually use this to move between positions over time, but here\
    \ actually tracking as you near the camera's target (Soy Boy). The rest of the\
    \ Lerp method ensures that the position calculated is clamped (constrained) to\
    \ the MinX, MinY, MaxX, and MaxY points.\n\nSave the script and return Unity.\n\
    Drag the CameraLerpToUnity script to the Main Camera GameObject in the Hierarchy.\n\
    \nSelect the Main Camera in the Hierarchy. Drag SoyBoy Object onto the Cam Target\
    \ field on the CameraLerpToTransform script, which is now attached to Main Camera.\n\
