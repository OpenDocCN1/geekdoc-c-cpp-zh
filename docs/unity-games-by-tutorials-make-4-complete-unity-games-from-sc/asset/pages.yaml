- pgno: 66
  md: 'Note: Whenever it seems like you should make a duplicate of a GameObject, use
    a prefab instead — it''s another best practice. Some Unity developers insist on
    using prefabs for everything, even unique objects.


    The thinking is that it''s much easier to create a prefab and make duplicates
    than it is to turn a group of existing GameObjects into prefab instance. The former
    method requires minimal work, whereas the latter requires you to extract the commonities
    into a prefab while maintaining any unique changes for each instance. This results
    in a lot of work.


    In the Hierarchy, drag the **BobbleArena-Column** into your **Prefabs** folder
    to turn it into a prefab.


