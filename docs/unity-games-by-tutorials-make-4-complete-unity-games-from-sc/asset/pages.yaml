- pgno: 364
  md: "# Unity Games by Tutorials\n\nIn the FixedUpdate() method, just above the rb.AddForce(...),\
    \ line the following:\n\n```\nvar yVelocity = 0f;\nif (PlayerIsTouchingOrWall()\
    \ && input.y == 1)\n{\n    yVelocity = jump;\n}\nelse\n{\n    yVelocity = rb.velocity.y;\n\
    }\n```\n\nThis ensures that the yVelocity value is set to the jump value of 14\
    \ when the character is jumping from the ground, or from a wall. Otherwise, it's\
    \ set to the current velocity of the rigidbody.\n\nStill in the FixedUpdate()\
    \ method, change the line that reads:\n\n```\nrb.velocity = new Vector2(xVelocity,\
    \ rb.velocity.y);\n```\n\nTo instead read:\n\n```\nrb.velocity = new Vector2(xVelocity,\
    \ yVelocity);\n```\n\nThe yVelocity is now used to modify the velocity of the\
    \ character's Rigidbody.\n\nAt this point, your character can jump up walls, but\
    \ he will just move straight up next to them when jumping. This definitely doesn't\
    \ look right. The right way would be to propel him away from walls in the opposite\
    \ direction jumping.\n\nJust below the PlayerIsTouchingGroundWall() method, add\
    \ another method:\n\n```\npublic int GetWallDirection()\n{\n    bool isWallLeft\
    \ = Physics2D.Raycast(new Vector2(\n        transform.position.x - width, transform.position.y),\n\
    \        Vector2.right, right, raycastLengthCheck);\n    bool isWallRight = Physics2D.Raycast(new\
    \ Vector2(\n        transform.position.x + width, transform.position.y),\n   \
    \     Vector2.right, right, raycastLengthCheck);\n    if (isWallLeft)\n    {\n\
    \        return -1;\n    }\n    else if (isWallRight)\n    {\n        return 1;\n\
    \    }\n    else\n    {\n        return 0;\n    }\n}\n```\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_364_0.png)\n\
    \n365"
  merge: -1
  img_proc: true
- pgno: 365
  md: "# Unity Games by Tutorials\n\nThis returns an integer based on whether the\
    \ wall is left (-1), right (1), or neither (0). You'll use the returned value\
    \ to multiply against the character's x velocity to either him go left or right\
    \ (when wall jumping) based on which side the wall is on.\n\nIn the FixedUpdate()\
    \ method, just the line that now reads:\n\n```\nrb.velocity = new Vector2(xVelocity,\
    \ yVelocity);\n```\n\nadd the following statements:\n\n```\nif (IsWallToLeftRight()\
    \ && !PlayerIsOnGround())\n&& input.y == -1) {\n  rb.velocity = new Vector2(-GetWallDirection()\n\
    \  * speed = 0.75f, rb.velocity.y);\n}\n```\n\nThis checks to see if there is\
    \ a wall to the left or right of the player, that they are not on the ground,\
    \ and they are currently jumping. If this is the case, the character's Rigidbody\
    \ velocity is set to a new velocity, using the current Y velocity, but with a\
    \ change to the X (horizontal) velocity.\n\nThe change in horizontal velocity\
    \ is equal to the opposite direction of the wall, multiplied by the speed factor,\
    \ and then multiplied down by factor of 0.75 (slightly dampen the horizontal movement\
    \ a bit).\n\nThe opposite direction of the wall is calculated by calling the new\
    \ GetWallDirection() method and negating its returned value (-1 becomes 1, and\
    \ 1 becomes -1).\n\nSave your changes and switch back to Unity. Use the Scene\
    \ editor to duplicate some single-block prefabs and move the copies up, on top\
    \ of each other to build some walls. Remember to hold CTRL when moving them in\
    \ the Scene editor to keep them snapped to 1 unit size.\n\nRun the game, and jump\
    \ (Space) against the wall. As you land on the wall, jump again, moving in the\
    \ other direction. With this technique you can now scale!\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_365_0.png)\n\
    \nraywenderlich.com\n\nChapter 13: More Unity 2D"
  merge: -1
  img_proc: true
- pgno: 366
  md: '# Hooking up character animations


    You''ve completed the Character Controller with regard to input, and will now
    complete the animation controller. This will allow you to extend the character
    controller to control animations! If you need to brush up on Unity’s animation,
    please review Chapter 6, "Animation."


    Click the SoyBoy GameObject, then open the Animator window. Inside this window
    click the Parameters tab.


    There are no parameters at the moment. You''ll add these next.


    In the Parameters area of the Animator window, click the + (plus) icon three times,
    each time adding one of the three parameters:


    +   * Speed as a Float with value 0.0.

    * IsJumping as a Bool, unchecked.

    * OnWall as a Bool, unchecked.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_366_0.png)


    Now create states. Start by defining a state change from the default Entry state
    to the IdleAnimation. Right-click the Entry state, select Make Transition and
    then click the IdleAnimation block.


    An arrow is created from Entry pointing to IdleAnimation.


    Now, you need to make the IdleAnimation the new default state (indicated by an
    orange block). Right-click IdleAnimation and click Set as Layer Default.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_366_1.png)


    No condition is required to make this transition. It will happen as the game starts.


    Now create a transition from IdleAnimation to RunAnimation, and again from RunAnimation
    back to IdleAnimation. You may want to drag the state blocks around in the window
    to position them better, too.'
  merge: -1
  img_proc: true
