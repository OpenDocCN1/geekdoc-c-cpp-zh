- pgno: 98
  md: '# Chapter 4: Physics


    Here’s the breakdown of the options:


    +   - The Edit Collider button allows you to move and resize a collider visually
    in the Unity scene editor. Right now, if you zoom in, you''ll notice the sphere
    is much smaller than the alien, and this option would allow you to move and resize
    it to better represent the alien''s shape.


    Alternatively, you can set the center and radius properties manually, as you will
    do shortly.


    +   - The Is Trigger checkbox means that the collider can pass through other colliders.
    Although the collider doesn''t act like a hard surface, you''ll still get collision
    notifications.


    A good use for a trigger is to open a door when a player steps on a certain area.


    +   - The Material option allows you to apply something known as a Physics Material,
    which are materials that have physical properties. For instance, you could create
    a surface that causes players to slide and assign it to ice models to make a skating
    rink.


    +   - The Center is a sphere collider’s center point.


    +   - The Radius determines the size of the collider for the alien to make it
    behave.


    With all that mind, you can fix the collider for the alien to make it behave.

    If the alien isn''t already selected in the Hierarchy, select it now. In the Inspector
    for the sphere collider, set the Center to (0.34, 2.54, 0.57) and the Radius to
    2.52. Check out the Scene view now.


    You’ll see a green outline around the alien — it’s the radius of the collider.


