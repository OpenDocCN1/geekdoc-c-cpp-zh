- pgno: 586
  md: '# Getting started with the HTC Vive


    If you''re not already a proud owner of a HTC Vive headshot, you can buy one on
    their website (https://htcvive.com) or (depending on where you live) in a store
    near you. Be sure your PC meets at least the minimum requirements. Once it''s
    in your possession, download and install the software and set up the hardware.
    Also update the firmware on all devices if there are updates available.


    Open up the **HTC Vive** starter project in Unity and open the **Game** scene:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_586_0.png)


    If you try the game, you''ll notice it''s impossible to add any towers as the
    AddTowerWindow isn''t showing up on-screen. This is because the Screen Space Canvas
    has been replaced by a **World Space Canvas**. This means the elements are free
    to be placed, scaled and rotated in the game world instead of being locked to
    the screen.


    Also take a look at the giant floating UI elements around the camera. These have
    been placed along a curved mesh.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_586_1.png)


    To use the **Vive** in Unity, you''ll need to download and import the newest version
    of the **SteamVR** Plugin from the **Asset Store**.


    Click **Window ▷ Asset Store** to open the **Asset Store**. Now type in **SteamVR**
    in side search box at the top and press **Enter**. Scroll down to the results
    and find the **SteamVR Plugin**. It should be the first entry.'
  merge: -1
  img_proc: true
