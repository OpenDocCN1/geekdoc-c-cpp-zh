- pgno: 189
  md: "# Unity Games by Tutorials\n\nsoundEffectAudio refers to the audio source you\
    \ added to the SoundManager earlier that will be used to play sound effects. Since\
    \ you won't need to adjust the second audio source that plays background music\
    \ in code, there's no reason to create a reference for it.\n\nNext, add the following\
    \ to Start():\n\n```\nif (Instance == null)\n{\n    Instance = this;\n} else if\
    \ (Instance != null)\n{\n    Destroy(gameObject);\n}\n```\n\nThis is a simple\
    \ coding design pattern, known as a singleton pattern, that ensures there is always\
    \ only one copy of this object in existence. If this is the first SoundManager\
    \ created, it sets the Static variable to the current object. If, for some reason,\
    \ a second SoundManager is created, it automatically destroys itself to make sure\
    \ that there is only one SoundManager exists.\n\nNext, add the following after\
    \ the last bit of code:\n\n```\nAudioSource[] sources = GetComponents<AudioSource>();\n\
    foreach (AudioSource source in sources)\n{\n    if (source.clip == null)\n   \
    \     soundEffectAudio = source;\n}\n```\n\nYou need to get a handle to the AudioSource\
    \ component you added to the SoundManager that you'll use to play sound, but currently\
    \ you have two Audio Source components on the GameManager. How can you find the\
    \ correct one? One way is to search through all the Audio Source components for\
    \ the one you're looking for. GetComponents() returns all of the components of\
    \ a particular type. Although Unity tends to return components in the same order\
    \ as they are in the Inspector, you shouldn't count on that as behavior may change.\
    \ Instead, you should look for something that distinguishes the one you're looking\
    \ for. In this case, since you added music to one of the sources, this checks\
    \ for the audio source that has no music before setting soundEffectAudio.\n\n\
    Now you're going to build your sound effects library.\n\nAdd the following instance\
    \ variables after the class definition:\n\n```\npublic AudioClip gunFire;\npublic\
    \ AudioClip upgradedGunFire;\n```\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_189_0.png)"
  merge: -1
  img_proc: true
