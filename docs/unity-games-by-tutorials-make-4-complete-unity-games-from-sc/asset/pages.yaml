    \n```\npublic enum TowerType\n{\n    Stone, Fire, Ice\n}\n```\n\nThis small enum\
    \ will be used throughout several classes so they know what type of tower they're\
    \ dealing with. It contains the three types of towers you'll be adding to the\
    \ project.\n\nAdd this code block right underneath:\n\n```\npublic class Tower\
    \ : MonoBehaviour\n{}\n```\n\nThis is the actual class declaration where you should\
    \ now insert these variables:\n\n```\n//1\npublic float attackPower = 3f;\n//2\n\
    public float timeBetweenAttacksInSeconds = 1f;\n//3\npublic float aggroRadius\
    \ = 15f;\n//4\npublic int towerLevel = 1;\n```"
