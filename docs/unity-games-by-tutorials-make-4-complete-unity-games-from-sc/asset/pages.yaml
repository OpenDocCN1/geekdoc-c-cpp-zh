    Right-click on each field you change and select Insert Keyframe.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_481_1.png)


    +   6. At the bottom of the Blender window, in the Timeline panel, set the End
    field to 80. This gives your animation a duration of 80 frames. Press the Play
    button to preview your animation.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_481_2.png)


    > Tip: Press Alt-A to play/pause the playhead at any time. You can orbit the 3D
