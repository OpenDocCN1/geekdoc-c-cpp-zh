- pgno: 595
  md: "# reticleSize, reticleSize;\n\n```\n```\n//11\n// Pass the pointer data to\
    \ the event system so entering and\n// exiting of objects is detected\nProcessMove(pointerEvent);\n\
    ```\n```\n\nThere's quite a bit going here:\n\n+   1. If there's no PointerEventData\
    \ for the current Event System, create a new one.\n2. Sets the position of the\
    \ virtual pointer to the center of the screen.\n3. Create a list to hold the results\
    \ of the raycasts shot into the scene.\n4. Do a raycast for every enabled raycaster\
    \ in the scene (both for the UI and 3D colliders).\n5. Get the first hit of any\
    \ raycast and save it both currentRaycast and the PointerEventData's raycast.\
    \ The current raycast will be used to move the reticle while the one inside the\
    \ event data will be used for processing input.\n6. Move the reticle to the point\
    \ where the raycast hit.\n7. Move the laser right between the controller and the\
    \ reticle.\n8. Let the laser look at the reticle.\n9. Size the laser's Z-scale\
    \ by the distance between the controller and the reticle.\n10. Resize the reticle\
    \ based on the distance from the controller and the resizeSizeMultiplier.\n11.\
    \ Pass the pointer data to the Event System so the entering and exiting of objects\
    \ are handled correctly.\n\nThis method will make sure the reticle and the laser\
    \ get positioned and scaled correctly.\n\nAdd the IsTriggerPressed() to check\
    \ if the player pressed the Trigger button on their controller:\n\n```\n```\n\
    bool IsTriggerPressed()\n{\n    return SteamVR_Controller.Input((int)\n    RightController.index).GetPressDown(\n\
    EVRButtonId.k_EButton_SteamVR_Trigger);\n```\n```"
