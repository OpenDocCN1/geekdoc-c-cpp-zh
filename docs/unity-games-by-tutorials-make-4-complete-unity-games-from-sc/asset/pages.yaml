- pgno: 229
  md: "You need to get a reference to the particle system, so add the following to\
    \ Start():\n\n```\ndeathParticles = GetComponent<ParticleSystem>();\n```\n\nAdd\
    \ the following method:\n\n```\npublic void Activate(){\n    didStart = true;\n\
    \    deathParticles.Play();\n}\n```\n\nThis starts the particle system and informs\
    \ the script that it started. In Update(), add the following:\n\n```\nif (didStart\
    \ && deathParticles.isStopped){\n    Destroy(gameObject);\n}\n```\n\nOnce the\
    \ particle system stops playing, the script deletes the death particles because\
    \ they are meant to play only once.\n\nFinally, to address the need for a collision\
    \ plane set in code, add the following method:\n\n```\npublic void SetDeathFloor(GameObject\
    \ deathFloor){\n    if (deathParticles == null){\n        deathParticles = GetComponent<ParticleSystem>();\n\
    \    }\n    deathParticles.collision.SetPlane(0, deathFloor.transform);\n}\n```\n\
    \nThe script first checks to see if a particle system has been loaded, which is\
    \ necessary because the Alien prefab is instantiated and used immediately.\n\n\
    In Start() the deathParticles isn't populated, this line populates it. Then it\
    \ sets the collision plane.\n\nNow to activate the particles — it's a similar\
    \ process for the aliens and the marine, but the aliens need a little set-up work.\n\
    \nFirst, you need to get a reference to the particle system and it's a child of\
    \ the Alien GameObject, so you need code to get it.\n\nOpen Alien in your code\
    \ editor, and add the following instance variable:\n\n```\nprivate DeathParticles\
    \ deathParticles;\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: "Then create the following method:\n\n```\npublic DeathParticles GetDeathParticles()\n\
    {\n    if (deathParticles == null)\n    {\n        deathParticles = GetComponentInChildren<DeathParticles>();\n\
    \    }\n    return deathParticles;\n}\n```\n\nThe magic occurs in GetComponentChildren().\
    \ It returns the first death particle script\nit that finds. With only one script\
    \ there's no possibility of grabbing the wrong one.\n\nIn Die(object), add the\
    \ following before Destroy(gameObject):\n\n```\nif (deathParticles)\n{\n    deathParticles.transform.parent\
    \ = null;\n    deathParticles.Activate();\n}\n```\n\nThis makes the blood splatter\
    \ when an alien dies. You have to remove the parent.\nOtherwise, the particles\
    \ are destroyed along with the GameObject.\n\nOpen GameManager add this instance\
