- pgno: 107
  md: "# Unity Games by Tutorials\n\n# Chapter 4: Physics\n\nYou need to delete unused\
    \ bullets as soon as they are out of play to keep the Hierarchy clean and the\
    \ game performing.\n\n# What's the best way to manage used-up bullets?\n\nHere's\
    \ the problem: The game creates a new GameObjects every time the gun fires. Since\
    \ the player can fire continuously, this will result in more and more bullets,\
    \ until eventually your game runs out of memory and crashes. Creating unbounded\
    \ bullets by mistake is a common problem in game design.\n\nYou can delete the\
    \ bullets or you can reuse them using **pools**. For example, after the GameObject\
    \ exits the play area, it's put into a pool of objects to use in the future, rather\
    \ than deleting it.\n\nWhen the player fires again, the game checks if there are\
    \ any available bullets in the pool. If not, the game creates a new bullet. Otherwise,\
    \ it reuses an existing one. After a while, the game reuses bullets instead of\
    \ squandering processing time on the creation and deletion of bullets.\n\nIn this\
    \ chapter, for simplicity's sake you will delete objects, but you may want to\
    \ investigate pools if performance becomes an issue. For more information on object\
    \ pooling, check out https://www.raywender.com/13609j/object-pooling-unity\n\n\
    In the Project Browser, open the **Prefabs** folder and select the **Projectile**\
    \ prefab. Click the **Add Component** button and select **New Script** at the\
    \ bottom. Give it the name **Projectile** then click **Create** and **Add**. Don't\
    \ forget to move the script into the **Scripts** folder to keep things tidy.\n\
    \nDouble-click the script to open it in the editor and add these two methods:\n\
    \n```\nprivate void OnBecomeInvisible()\n{\n    Destroy(gameObject);\n}\n\nprivate\
    \ void OnCollisionEnter(Collision collision)\n{\n    Destroy(gameObject);\n}\n\
    ```\n\nOnBecomeInvisible() is a useful method that is called when the object is\
    \ no longer visible by any camera. In this case, this is called when the bullet\
    \ goes off the screen. This is a perfect time to destroy the bullet, as it's no\
    \ longer needed.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_107_0.png)\n\n108"
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Note: There are two important things to understand about this.


    First, for this work the GameObject must have a renderer component attached to
    it. Otherwise, Unity has no idea if the GameObject is invisible or not.


    Second, Unity considers a GameObject invisible if it''s invisible from all cameras.
    For instance, the GameObject may not be visible in the Game window, but if it''s
    visible in your Scene view, then it''s still considered visible.


    Weird? Yes, but that''s how Unity rolls. :)


    OnCollisionEnter is called during a collision event. The Collision object contains
    information about the actual collision as well as the target object. For example,
    this will be called when a bullet hits an alien or a Wall. When this occurs, you
    simply destroy the bullet.


    Now play your game and fire. Your bullets disappear as they collide into objects.
    What about another test?


    With the game still running, select the SpaceMarine GameObject. In the Character
    Controller component, set Radius to 5.17.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_108_0.png)


    Now, fire your gun. Believe it or not, the gun is firing, but the bullets are
    hitting the marine''s collider, and then being instantly destroyed, so it looks
    as though nothing is happening. You can solve this problem with selective collisions
    that you set up with layers.


    # Setting up collisions and layers


    By default, all GameObjects exist on one physics layer. This means that all GameObjects
    with Rigidbodies will collide with one another.


    As you can see from that the bullets collide with the space marine, the default
    isn''t ideal. You need the bullets to ignore the marine — and to do this, you
    need to create a new layer.'
  merge: -1
  img_proc: true
