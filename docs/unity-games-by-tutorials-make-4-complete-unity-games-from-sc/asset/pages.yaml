  md: 'So far, you''ve only scratched the surface of the possibilities with the audio
    mixer. You can also do things hiding groups and saving them as views to aid your
    focus during various editing tasks. It''s also possible to take Snapshots to save
    different groups of settings — either for the sake of comparison or just for different
    situations.


    # # Where to go from here?


    Wow! You''ve got sound now. With the addition of a few lines of code, your game
    should feel much more awesome.


    In doing so, you''ve learned:


    +   - The basics of Unity sound, such as the difference between **audio listeners**
    and **audio sources**.

    - The import settings for new audio files and how they can affect performance.

    - How to call your sounds in code.

    - How to balance all your sounds with the mixer.

    - **Bonus**: How to create a power-up, complete with sound effects!


    What''s left to do? You''ve got aliens. You''ve got lots of bullets. Sounds like
    you''re all set!


    What you''re missing is an ending. In the next and final chapter for *Bobblehead
    Wars*, you''ll put the finishing touches on the game, e.g., lots of exploding
    aliens and a marine who can''t keep his head on straight. Lastly, you''ll provide
    a winning condition.


    Exciting things are ahead: Stay tuned!'
