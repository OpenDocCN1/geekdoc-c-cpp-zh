- pgno: 633
  md: '# # Chapter 23: Unity API


    Brian Moakley


    Unity is a complicated piece of software. Not only does it need to render high-quality
    games in a variety of resolutions, but it also needs to run on dozens of platforms:
    From mobile to high-end PCs.


    This book covers the basics of creating games with Unity, but as you can imagine,
    the underlying Unity API goes very deep. Understanding this API is critical to
    writing good games in Unity.


    Unlike other chapters, this chapter is not written in the style of a tutorial,
    nor is it meant to be comprehensive. Rather, this is meant to give you a brief
    tour of the various sub-systems used throughout this book so that you can get
    a deeper idea of how why each system is being used.


    So sit back, grab yourself a nice drink and enjoy this tour of the Unity API!


    # ## Vector3


    Throughout your games, you will use lots of Vector3 objects. You use them to represent
    two things: Points and directions.


    First, you can use vectors to represent the (x, y, z) position of a GameObject
    in space. For example, you may set the position of a GameObject to be (100, 100,
    100).


    > Note: Unity contains other Vector objects. The 3 in Vector3 indicates three
    coordinates. When working with 2D, you use Vector2 objects and there is even a
    Vector4 object. For the sake of simplicity, this section will just focus on Vector3
    objects.'
  merge: -1
  img_proc: true
- pgno: 634
  md: 'Second, you can use vectors to represent the direction and magnitude of an
    object. For example, when applying force to an object, you provide a Vector3 object
    to indicate in what direction to apply the force, and how strong it can be. The
    big question: How does Unity extract that information from a single value?


    Well, think back to class when you did some charting. A vector consists of an
    origin (start point), an end point, a magnitude and a direction. The origin is
    the start of the vector, the direction is where the vector is pointing from the
    start point to the end point and the magnitude is the length of the line itself.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_634_0.png)


    The same holds true with Unity. Take this example:


    ```

    Vector3 myVector = new Vector3(10, 20, 10);

    ```


    When you use a vector to indicate magnitude and direction, you are actually setting
    the endpoint of the vector. You didn''t set the origin, because it implied that
    the origin is zero. From this information, you can now determine both the direction
    and the magnitude.


    # Directions


    You''ll use vectors a lot when setting directions. In fact, they are used so much
    that vectors have a bunch of static methods to help you out. There are directions
    for up, down, left and right. There''s also static properties for forward and
    back. You access them like so:


    ```

    Vector3.forward

    ```


    These calls return normalized coordinates (which is a fancy way of saying “vectors
    of length 1") referenced in global space, pointing in the appropriate directions.'
  merge: -1
  img_proc: true
- pgno: 635
  md: 'For example, the forward property will return you the coordinates (0, 0, 1),
    whereas the back property will return: (0, 0, -1). These values will never change
    since they are in global space.


    This is useful when working in global space; for instance, if you were moving
    a GameObject in a global forward direction, you would multiply the speed of the
    movement by the direction.


    > Note: If you want to use local coordinates, try using transform.forward, transform.up,
    and transform.right instead. You''ll learn more about this later in this chapter.


    The positive value means the GameObject moves forward, whereas the negative value
    would send it in reverse. A zero, indicating no direction, means the GameObject
    wouldn''t move at all.


    # Moving


    Most GameObjects move. It''s simply a fact of life.


    In some cases, GameObjects move at a predetermined rate. For instance, you may
    have a spaceship in the middle of the screen that fires a bullet towards the edge
    of the screen.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_635_0.png)


    The bullet''s start position and the edge of screen can be represented by vectors.
    All that''s missing is a time component. By stating that it takes one second for
    the bullet to'
  merge: -1
  img_proc: true
- pgno: 636
  md: 'travel between the two points, you can determine the location of the bullet
    along a timeline.


    When ø seconds have passed, the bullet is located at the start point. At 1 second,
    the bullet can be found at its end point. When half a second has passed, the bullet
    can be found exactly between the two points.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_636_0.png)


    The method of finding the location based on time is called Lerp(). This is a function
    that you''ll use all the time in Unity to move objects across the screen. Here''s
    an example of Lerp():


    ```

    Vector3 result = Vector3.Lerp(start, end, .5f);

    ```


    Both start and end represent Vector3 objects. The last argument is the position
    along the timeline between the start and end points, and ranges between 0 and
    1. The value of ø represents the start position and 1 represents the end position.
    0.5 is the exact midpoint between those two points.'
  merge: -1
  img_proc: true
- pgno: 637
  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_637_0.png)


    Typically, you''ll call this every frame and update the GameObject''s position
    from the result of Lerp(). You store the accumulated time from the start of the
    movement by way of Time.deltaTime. deltaTime is how much time has passed since
    the last frame.


    ```

    float timePasssed += Time.deltaTime;

    ```


    Then, you divide the accumulated time by the length of the animation.


    ```

    float currentTime = timePassed / 1.0f;

    ```


    Since the total length of the animation is one second, you divide timePassed by
    1. The result of this division is passed into Lerp().


    ```

    bullet.position = Vector3.Lerp(startPosition, endPosition, currentTime)

    ```


    This will animate the bullet to the edge of the screen.


    Lerp() moves in a straight line. If you want to move a GameObject along a curve,
    you use Lerp instead which takes the magnitudes of the Vector3 objects into account.


    # Operators


    Vectors also come with overloaded operators, which makes it easy to work between
    vectors. For instance, when adding two vectors, you may be tempted to do this:


    ```

    Vector forward = Vector3.forward;

    Vector down = Vector3.down;

    Vector3 result = new Vector3(forward.X + down.X, forward.Y + down.Y, forward.Z
    + down.Z);

    ```'
  merge: -1
  img_proc: true
- pgno: 638
  md: 'Instead, you can just add them together like so:


    ```

    Vector forward = Vector3.forward;

    Vector down = Vector3.down;

    Vector3 result = forward + down;

    ```


    You can also multiply, divide and subtract vectors as well. This makes the intent
    more clear, with less chance of error.


    # # Transform


    If there''s one property GameObjects share, it''s that they all come with Transform
    components. The Transform provides three things: The position, the scale and the
    rotation.


    The position property is simply a Vector3 indicating the location of the GameObject.
    To set the scale, use the `localScale` property, which is relative to the parent
    GameObject. To set the rotation, you have two options: `localRotation` and rotation.
    `localRotation` is the rotation of the GameObject relative to the parent object,
    whereas rotation is relative to the world.


    When rotating your objects, you use an object called a “quaternion.” You’ll learn
    about quaternions in the next section.


    # # Direction


    When working with GameObjects, it''s critical to understand its concept of direction;
    that is, where is the front, and where is the back? For instance, if your GameObject
    is a spaceship, you might want to move the ship in a forward direction. Unity
    provides a couple of properties to help you out.


    transform.forward gives you the forward direction of the GameObject, transform.right
    determines the right hand side, and transform.up give you the up direction relative
    to your GameObject.'
