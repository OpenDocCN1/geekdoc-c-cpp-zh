- pgno: 377
  md: "Select the SoyBoy GameObject in the Hierarchy, and from the Sounds folder,\
    \ drag and drop the ssb_jump.ogg, ssb_run_short.ogg, and ssb_slide_loop.ogg audio\
    \ clips onto the three new AudioClip fields on the SoyBoyController script.\n\n\
    | Jump | 14 |\n|---|---|\n| Run Clip | ssb_run_short o |\n| Jump Clip | ssb_jump\
    \ o |\n| Slide Clip | ssb_slide_loop o |\n\nAdd an Audio Source component to SoyBoy,\
    \ and then apply the changes on SoyBoy by clicking the Apply in the Inspector.\n\
    \nRun the game, and test that the sound clips now play for music, running, jumping\
    \ and wall sliding.\n\n# # Creating a Game Manager\n\nYou'll create a Game Manager\
    \ that will allow you to manage the win and lose states for the game. To keep\
    \ things simple, this game manager will restart the level when you win or lose.\
    \ For this purpose, you will create a singleton instance script. A singleton is\
    \ essentially an instance of class that should only have one instance at any time.\n\
    \nIn the Scripts folder, create a new script called GameManager. Create a new\
    \ GameObject in the game called GameManager and attach the new GameManager.cs\
    \ script to it.\n\nOpen GameManager.cs in your code editor. At the top of the\
    \ class, add a new public static field that holds the instance reference for the\
    \ GameManager singleton:\n\n```\npublic static GameManager instance;\n```\n\n\
    Create the following Awake() method:\n\n```\nvoid Awake() {\n    if (instance\
    \ == null) {\n        instance = this;\n    }\n    else if (instance != this)\
    \ {\n        Destroy(gameObject);\n    }\n    DontDestroyOnLoad(gameObject);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 378
  md: "This is the core of the singleton pattern. The first time this script executes\
    \ Awake(), instance will be null, and the method will assign the one instance\
    \ of GameManager to instance. Any other time the method runs, instance will no\
    \ longer be null.\n\nIf another GameManager instance exists elsewhere, then that\
    \ instance is destroyed, ensuring that there is ever one instance (the first one\
    \ that was initialized).\n\nNext, you need a centralized way of telling a level\
    \ to reload from the GameManager. Add the following using statement to the top\
    \ of the script, and then two new methods to the class:\n\n```\nusing UnityEngine.SceneManagement;\n\
    \npublic void RestartLevel(float delay)\n{\n    StartCoroutine(RestartLevelDelay(delay));\n\
    }\n\nprivate IEnumerator RestartLevelDelay(float delay)\n{\n    yield return new\
    \ WaitForSeconds(delay);\n    SceneManager.LoadScene(\"Game\");\n}\n```\n\nThe\
    \ public method is simply a proxy method — a way of calling the private routine\
    \ method that actually reloads the game scene. This method is made public so it\
    \ is easy to call from the singleton GameManager instance anywhere else in the\
    \ game code.\n\nSave your changes and open the Hazard.cs script.\n\nAt the bottom\
    \ of the OnCollisionEnter2D() method, immediately after the Destroy() call, add\
    \ the following:\n\n```\nGameManager.instance.RestartLevel(1.25f);\n```\n\nThis\
    \ will call the GameManager's RestartLevel() method, passing in a delay of 1.25\
    \ seconds. This will run the coroutine and restart the level after a 1.25 second\
    \ delay when called, giving enough time for the player to see the death particle\
    \ effect.\n\n# Creating the level goal\n\nCreate a new C# script in the Scripts\
    \ folder called Goal, and open it for editing.\n\nAdd to the top of the class:\n\
    \n```\npublic AudioClip goalClip;\nvoid OnCollisionEnter2D(Collision2D collision)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 379
  md: "```\n{\nif (coll.gameObject.tag == \"Player\")\n{\n    var audioSource = GetComponent<AudioSource>();\n\
    \    if (audioSource != null && goalClip != null)\n    {\n        audioSource.PlayOneShot(goalClip);\n\
    \    }\n    GameManager.instance.RestartLevel(0.5f);\n}\n}\n```\n\nHere, you check\
    \ for player collisions with the Goal GameObject. If this happens, the player\
    \ has reached the goal so you play the goalClip audio clip and restart the level\
    \ after a 0.5 second delay.\n\nSave your changes and head back to Unity. Locate\
    \ and select the Goal prefab in the Resources/Prefabs folder using the Project\
    \ browser, and add the Goal.cs script to this prefab.\n\nDrop a reference to ssb_goal.ogg\
    \ in the Sound folder onto the Goal field on the Goal prefab's component.\n\n\
    | Goal (Script) | Goal |\n|---|---|\n| Goal Clip | ssb_goal |\n\nWith that, your\
    \ GameManager singleton is complete. It will restart the level when the player\
    \ dies and restart the level when the player wins.\n\nDrop a copy of the Goal\
    \ prefab into your Game scene and position it on a platform.\n\nRun the game and\
    \ run into or jump onto the goal sprite. The level should restart after you hear\
    \ the goal SFX play.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_379_0.png)"
