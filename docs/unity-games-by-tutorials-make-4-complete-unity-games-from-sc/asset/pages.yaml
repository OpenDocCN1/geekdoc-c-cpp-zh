    # Copying the animation to the other arm


    If you want your scorpion to be able to give the ol’ one-two-punch, the animation
    you just created needs to be copied to the right arm.


    +   1. In the Dope Sheet, make sure the Claw Attack.L action is selected, and
    press the + (plus) button next to the action name to duplicate it. Rename the
    new one Claw Attack.R. Don''t forget to click the F button.

    2. In the 3D View, select the Arm IK Target.L bone.

    3. In the Graph editor, if your points aren''t selected, press A to Select All.

    4. With the cursor over the Graph editor, press Ctrl-C to copy the animation curves.

    5. In the 3D View, select the Arm IK Target.R bone.

    6. Make sure the playhead is at frame 0, then in the Properties panel, right-click
    one of the Location fields and Insert Keyframes. The X, Y and Z Location channels
    will appear in the Graph editor for the Arm IK Target.R object.

    7. In the GraphEditor, press Ctrl-V to paste the animation data.


    > Note: In my experience, the animation does not always look exactly mirrored,
    so you may need to play with the keyframes a bit if you want them to be exactly
    the same. When animating a living creature, it''s OK if each arm is not exactly
    the


    This process will need to be repeated for each object. Take of the channel(s)
    you are animating, and create an empty keyframe in that channel, so that you have
    somewhere to paste the animation.


    Don''t forget to double-check the XYZ Rotation Order pop-up when you rotate the
    thumb and claw bones – they need to be set to XYZ Euler. Once you paste the rotation
    values for the thumb, you''ll see that it''s rotating in the opposite direction
