  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_112_0.png)


    # # Connecting GameObjects with joints


    When you first started making this game, you called it Bobblehead Wars, but so
    far, it''s been all wars and no bobble. Frankly, Unity physics comes to the rescue
    with joints.


    These aren''t the kinds of joints that would require you to be in Amsterdam, Oregon,
    Colorado or Washington, nor are they the kinds of joints made by the filmmaker
    Spike Lee.


    These are physics joints with a more conventional purpose: Connecting GameObjects
    together in a relationship defined by the physics engine.


    Think about a wrecking ball for a moment — specifically, the chain. Each link
    would be a GameObject, and you''d need to join them together with joints to allow
    each link to move individually but affect its neighbors, and in turn, the whole
    group is influenced by the ball.


    There are many joints available to you:


    +   - A hinge joint ties the movement of one GameObject to another — for instance,
    a door hinge.


    +   - A spring joint acts like an invisible spring between two GameObjects.


    +   - A fixed joint restricts a GameObject''s movement with an unrelated GameObject.
    A good example (from the documentation, even) is a sticky grenade.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   - A character joint allows you to constrain motion to create ragdoll effects.


    +   - A configurable joint incorporates the features of the other joints and more.
    Essence, you use it to modify existing joints or create your own.


    You''ll use a hinge joint to make the head bobble back and forth.


    Playing off the example above, the space marine''s body is the doorframe, and
    his head is the door. Every time the marine moves, you''ll add force to his head
    to make bounce back and forth.


    # Adding joints


    In the Hierarchy, select SpaceMarine and select the BobbleMarine-Head. Then from
    the main menu, click Component\Physics\Hinge Joint. As you can see, there''s more
    than one way to add a component.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_113_0.png)


    Check the Inspector. You''ll see the hinge joint in there now.


    For the hinge joint to work, the connected GameObjects must have Rigidbodies attached
    to them; Unity automatically adds these for you when you create a hinge joint.


    In the Rigidbody component, uncheck the Gravity property.


    In the Hierarchy, select BobbleMarine-Body and in the Inspector, click the Add
    Component button. From the component listing, select Physics and then Rigidbody.
    Click the preset button and select kinematic. Remember, this preset unchecks gravity
    and sets the Rigidbody to be Kinematic.'
  merge: -1
  img_proc: true
