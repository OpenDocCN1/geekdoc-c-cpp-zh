    \    if (isDead)\n    {\n        return;\n    }\n\n    health -= amount;\n\n \
    \   if (health <= 0)\n    {\n        isDead = true;\n        robot.Play(\"Die\"\
    );\n        StartCoroutine(\"DestroyRobot\");\n    }\n}\n\n// 2\nEnumerator DestroyRobot()\n\
    {\n    yield return new WaitForSeconds(1.5f);\n    Destroy(gameObject);\n}\n```\n\
    \nLooking closely at the above:\n\n+   1. This has roughly the same logic as the\
    \ player TakeDamage() method, except when health hits zero, it plays a death animation\
    \ before calling DestroyRobot().\n\n+   2. This adds a delay before destroying\
