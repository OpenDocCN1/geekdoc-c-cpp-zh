    At the bottom of the Update() method, add the following:


    ```

    if (jumpDuration > jumpDurationThreshold) input.y = 0f;

    ```


    This checks for jumpDuration being longer than the jumpDurationThreshold (0.25
    seconds). If the jump button is held in longer than 0. 25 seconds, then the jump
    is effectively cancelled, meaning the player can only jump up to a certain height.


    Now, at the bottom of FixedUpdate(), add the following:


    ```

    if (isJumping && jumpDuration < jumpDurationThreshold)

    {

    rb.velocity = new Vector2(rb.velocity.x, jumpSpeed);

    }

    ```


    This gives Super Boy''s Rigidbody a new velocity if the user has pressed the jump
    button for longer than jumpDurationThreshold. The velocity in the X direction
    is the same as his current sideways speed but his velocity in the Y direction
    is set to jumpSpeed (which is 8). This equates to upward movement, forming a satisfying
    input-duration controlled jump!


    Don''t forget to time the jumpDuration though. If you don''t, Super Boy will perform
    the most insane, neverending upward jump, and will never return back to the ground!
