  md: '# Unity Games by Tutorials


    # Chapter 21: Publishing Your Game


    The editor will now take a while to recompile all assets for the chosen platform.
    When it''s done, open up the Player Settings views.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_607_0.png)


    Notice that things look quite different from the standalone settings. Here are
    the most important settings in the Resolution and Presentation module:


    +   - Default Screen Width and Height: These control the dimensions of the WebGL
    canvas on the webpage. Make sure these are the aspect ratio that your game supports.
