    - alien represents the prefab for the alien. The GameManager will create an instance
    of this object when it''s time to spawn.


    **Save your script** and switch back to Unity. Select the **GameManager** in the
    Hierarchy to see three new fields. You''ll also notice that the script has its
    own custom icon. A GameManager is such a common script in scripts Unity even created
