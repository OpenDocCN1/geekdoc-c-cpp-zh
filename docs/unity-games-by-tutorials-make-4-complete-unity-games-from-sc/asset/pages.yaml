  md: "# Projectiles\n\nThis simple script will follow an enemy around until it hits\
    \ target, damaging it in the process!\n\nMake a new folder in Scripts ▸ Game ▸\
    \ Tower new Weapons and create a new C# Script named FollowingProjectile. Open\
    \ it in a code editor and remove the Start() and Update() methods.\n\nThis class\
    \ will be another abstract class as the actual scripts you'll be putting on the\
    \ projectiles will be derived from it. This makes it easy to add new types of\
    \ projectiles. Add the abstract keyword between public and class to make it into\
    \ an abstract class.\n\n```\npublic abstract class FollowingProjectile : MonoBehaviour\
    \ {\n```\n\nAn abstract is to be subclassed, but can still provide behavior that\
    \ subclasses can inherit. Add this underneath the line you edited:\n\n```\n//1\n\
    public Enemy enemyToFollow;\n//2\npublic float moveSpeed = 15;\n\nprivate void\
    \ Update()\n{\n//3\n    if (enemyToFollow == null)\n{\n        Destroy(gameObject);\n\
    \    }\nelse\n//4\n    transform.LookAt(enemyToFollow.transform);\n    GetComponent<Rigidbody>().velocity\
    \ = transform.forward * moveSpeed;\n}\n\n//5\npublic void OnTriggerEnter(Collider\
    \ other)\n{\n    if (other.GetComponent<Enemy>() == enemyToFollow)\n{\n      \
    \  OnHitEnemy();\n    }\n}\n\n//6\nprotected abstract void OnHitEnemy();\n```"
  merge: -1
  img_proc: true
- pgno: 539
  md: "# Unity Games by Tutorials\n\nHere's the play-by-play:\n\n+   1. The Enemy\
    \ projectile needs to follow.\n\n+   2. Speed at which this projectile moves,\
    \ in units per second.\n\n+   3. If the enemy this projectile is following doesn't\
    \ exist anymore, it should destroy itself.\n\n+   4. As long as there's still\
    \ a target enemy, look at the target and move towards it.\n\n+   5. If this projectile\
    \ hits an object, and it's the enemy it's following, then call OnHitEnemy().\n\
    \n+   6. OnHitEnemy() is an abstract method that needs to be implemented by the\
    \ derived class. It's also protected, which is the same as private except that\
    \ it can be called from derived classes.\n\nSave the script and return to Unity\
    \ to make another script. This time, it's the unique script for the StoneProjectile\
    \ that needs coding. Make a new C# Script in Scripts > Tower Weapons named Stone\
    \ and open it up.\n\nRemove the Start() and Update() methods and replace Following,\
    \ as that's what your class is deriving from. At this point, you'll probably get\
    \ an error saying this class doesn't implement OnHitEnemy() yet. Ignore this and\
    \ add this snippet where you removed the methods:\n\n```\n//1\npublic float damage;\n\
    \n//2\nprotected override void OnHitEnemy()\n{\n    //3\nenemyToFollow.TakeDamage(damage);\n\
    \    Destroy(gameObject);\n}\n```\n\nTaking each numbered comment in turn:\n\n\
    +   1. The amount of damage that gets inflicted to the enemy on impact.\n\n+ \
    \  2. Override FollowingProjectile's OnHitEnemy() method.\n\n+   3. Deal damage\
    \ to the enemy and destroy the projectile.\n\nSave this script and return to Unity.\
    \ Time to link things"
  merge: -1
  img_proc: true
