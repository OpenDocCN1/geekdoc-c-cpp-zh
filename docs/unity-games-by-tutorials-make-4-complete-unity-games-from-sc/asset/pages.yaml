- pgno: 315
  md: "Did you notice that a GameObject was created called EventSystem in the Hierarchy\
    \ after you created the first Button?\n\n# EventSystem\n\nThis is how your UI\
    \ buttons can be clicked to trigger events. The EventSystem GameObject listens\
    \ for these click (or hover) events and dispatches to something that needs to\
    \ know that they've happened. You don't need to worry about how it dispatches\
    \ its events; all that matters is how you intercept them.\n\nCreate a C script,\
    \ name it Menu and open it in the code editor. First, add this import at the top\
    \ of the script:\n\n```\nusing UnityEngine.SceneManagement;\n```\n\nThis allows\
    \ you to use the SceneManager type. This is a class that allows you to manage\
    \ your scenes such as loading, unloading or even searching for a scene.\n\nNow,\
    \ add the following methods to the body of the class:\n\n```\n// 1\npublic void\
    \ StartGame()\n{\n    SceneManager.LoadScene(\"Battle\");\n}\n\n// 2\npublic void\
    \ Quit()\n{\n    Application.Quit();\n}\n```\n\n+   1. This method will be used\
    \ when the user clicks the Begin button; it simply loads the Battle scene.\n2.\
    \ This method will be used to exit the app. However, note that if you are running\
    \ the game in Unity (instead of within a standalone build) this won't do anything.\n\
    \nWith these methods set up, you can now configure the buttons to actually call\
    \ them. Save your work and switch back to Unity.\n\nSelect the MenuUI GameObject\
    \ and drag over the Menu script to it. Now, you must hook the methods to the buttons.\n\
    \nSelect the BeginButton GameObject and click the + in the Button component."
  merge: -1
