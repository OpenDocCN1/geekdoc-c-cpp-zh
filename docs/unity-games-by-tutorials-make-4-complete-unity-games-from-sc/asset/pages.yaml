- pgno: 583
  md: "# Automatically positioning and scaling world UI\n\nThere are some tweaks that\
    \ need to be to the UIManager script for the windows to come into view when you\
    \ click the tower slots or the towers.\n\nOpen the UIManager script (Scripts >\
    \ Game > UI folder) and add this variable under txtEscapedEnemies at the top of\
    \ the script:\n\n```\npublic static float vrUIScaleDivider = 12;\n```\n\nThis\
    \ will be used to automatically scale UI elements based on their distance to the\
    \ player.\n\nNow add this method at the end of ShowAddTowerWindow():\n\n```\n\
    UtilityMethods.MoveUIElementToPosition(addTowerWindow.GetComponent<RectTransform>(),\
    \ towerSlot.transform.position);\n```\n\nAlso add this to the end of ShowTowerInfoWindow()\n\
    \n```\nUtilityMethods.MoveUIElementToPosition(towerInfoWindow.GetComponent<RectTransform>(),\
    \ tower.transform.position);\n```\n\nBoth of these do the same thing: They'll\
    \ make sure the will get moved and resized to the position of either the tower\
    \ slot or the tower that was selected.\n\nMoveUIElementToPosition() needs to be\
    \ updated for this new functionality. You'll do that once the UIManager is complete.\n\
    \nAdd this to the beginning of both of those... methods:\n\n```\nif (GameManager.Instance.gameOver)\
    \ {\n  return;\n}\n```\n\nThis ensures that the windows won't open if the game\
    \ is over.\n\nIn both ShowWinScreen() and ShowLoseScreen(), remove this line:\n\
    \n```\nblackBackground.SetActive(true);\n```\n\nBecause you can fully see the\
    \ world at any time, the background doesn't make much sense and would just distract\
    \ the player."
  merge: -1
  img_proc: true
- pgno: 584
  md: "# Unity Games by Tutorials\n\nSave this script. Open the UtilityMethods script\
    \ (Scripts > Utility folder) and add this method to it:\n\n```\n//1\nprivate static\
    \ void ScaleRectTransformBasedDistanceFromCamera\n(RectTransform rectTransform)\n\
    {\n//2\nfloat distance = Vector3.Distance(Camera.main.transform.\n    position,\
    \ rectTransform.position);\n//3\nrectTransform.localScale = new Vector3(distance\
    \ / UIManager.vrUIScaleDivider, distance / UIManager.vrUIScaleDivider, 1f);\n\
    }\n```\n\nGoing over this quickly:\n\n+   1. Get the RectTransform that needs\
    \ to be scaled as a parameter.\n2. Calculate the distance between the camera and\
    \ the Rect Transform.\n3. Set the Rect Transform's Scale to the distance divided\
    \ by UIManager's vrUIScaleDivider. This make the UI appear the same relative size\
    \ at any distance.\n\nObjects that are further away are scaled down, while objects\
    \ that are right in the player's face are scaled down, making everything the same\
    \ size regardless of actual distance. This increases the readability tremendously.\n\
    \n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_584_0.png)\n\nRemove the contents of\
    \ the MoveUiToWorldPosition() method and replace it with these lines:\n\n```\n\
    //1\nrectTransform.position = worldPosition + new Vector3(0,3);\n//2\n// Needed\
    \ to rotate UI the right way\nrectTransform.LookAt(Camera.main.transform.position\
    \ +\n    Camera.main.transform.forward * 10000);\n//3\nScaleRectTransformBasedDistanceFromCamera(rectTransform);\n\
    ```\n\nHere's what the code does:\n\n+   1. Adds a small offset so objects don't\
    \ appear inside other objects."
  merge: -1
  img_proc: true
