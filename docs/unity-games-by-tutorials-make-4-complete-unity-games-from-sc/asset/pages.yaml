- pgno: 641
  md: 'This rotates the quaternion by 90 degrees along the x-axis, which you can then
    assign back to the Transform.


    Quaternions give you lots of other functions as RotateTowards(), Slerp() and Inverse().
    Finally, if you have two different quaternions, you can multiply them together
    to combine the rotations.


    ```

    Quaternion combined = horizontalRotation * verticalRotation;

    ```


    # GameObjects


    GameObjects are the bread and butter of Unity. You use them all over the place
    to account for all the various objects in your game. Every GameObject can be accessed
    by any of its components like so:


    ```

    transform.gameObject

    ```


    You''ll frequently need to access the components of GameObjects. For instance,
    you might want to change the color of a lighting component. To do so, you call
    GetComponent() like so:


    ```

    Light pointB = GetComponent<Light>();

    ```


    You must pass in the type of the component using generic syntax. If there is no
    light attached to the GameObject, then the return value will be null. While not
    an expensive method to use, a common pattern is to cache the results in a variable
    to avoid making lookup calls.


    There are also methods to get components in children, in parents, or to get a
    listing of components on the current GameObject. In short, you have a variety
    of options to access components of the current GameObject and any related GameObjects.


    # Disabling GameObjects


    You might not need a GameObject in a particular scene, but still it need on-hand
    for later in the game. To disable a GameObject, you call setActive() like so:


    ```

    gameObject.SetActive(false);

    ```


    This means the GameObject will simply disappear from the scene, but it will still
    be present in the Hierarchy. All of its components will be deactivated and it
    won''t interact with any of the current GameObjects.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_641_0.png)'
