- pgno: 575
  md: '# # Sideloading your game


    Finally, build your game and save the APK file to your desktop. If this is the
    first time you''ve used your headset for development, you need to sideload your
    game. You do do this via the Android Debug Bridge (ADB), which is part of the
    Android SDK, which I mentioned earlier. Find the ADB in the **Android SDK platform-tools**
    subdirectory depending on where you installed the Android SDK. Also, you''ll need
    to access it via the command line. To sideload your APK file, just run the command:
    adb install -r


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_575_0.png)


    You''ll receive a message saying that your device is unauthorized. Now, put on
    your headset and confirm that you''d like to use the device for developing. Make
    sure to check the USB Debugging option. Once confirmed, run the same ADB command
    to install your .apk file. It should copy the file with no issues and, once loaded,
    it will show up in your Oculus Go Library. Better still, you can now build and
    run inside of Unity and the game will automatically install on your headset.


    # # Running on the Oculus


    At this point, either the Oculus Rift or Oculus Rift Go can run the game. Make
    sure your Rift is turned on, then save and play the Game scene.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_575_1.png)'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# Unity Games by Tutorials


    If you pick up the Rift and gently sway away, the display will echo that movement
    and rotation. Don''t put on the HMD just yet though, as the camera isn''t set
    up properly yet.


    Disable Main Camera and drag the OVRCameraRig prefab from the OVR ▸ Prefabs folder
    into the Hierarchy.


    Select OVRCameraRig and set its Position to (-1, 7.3, 1.54). This will position
    the camera correctly. Position yourself correctly and get the HMD ready, now run
    the scene and put the Rift on.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_576_0.png)


    Look around at the UI and at the incoming enemies. Everything should work as expected
    — until you try to take a closer look at the scenery or the enemies. When you
    do, you''ll notice you can hardly move around, only look. This is because the
    default scale of the OVRCameraRig is set to be realistic. If you move a bit in
    the real world, the camera will move approximately the same amount in the scene.


    To counter this, you''re going to turn into a giant! Select OVRCameraRig and set
    its scale to (12, 12, 12). Stand up with your HMD ready, make some room so you
    can crouch, and press the play button to test your new-found powers. Now try looking
    and moving around, and crouch to look at the enemies and scenery close.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_576_1.png)


    Pretty cool, right?'
