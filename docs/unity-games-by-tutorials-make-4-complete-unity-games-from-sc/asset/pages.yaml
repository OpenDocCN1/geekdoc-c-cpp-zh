- pgno: 608
  md: '# WebGL memory size


    Three of these settings are extremely important when making WebGL builds:


    This is the amount of memory in megabytes available to the WebGL runtime. This
    is a huge potential pitfall of WebGL development. Instead of being able to dynamically
    increase the size of the heap like other platforms, WebGL needs to know beforehand
    how much memory it needs to set when loading the game. If this value is too low,
    you''ll get out-of-memory errors. If it''s too high, some browsers and platforms
    will not have enough and either fail to load the game or crash. A sticky situation
    ensued.


    It''s recommended you play the game and stress test the worst-case scenarios using
    the Profiler to see how much memory it''s actually using. Then give it that amount
    of memory plus a bit extra overhead. For more information, see this page: https://docs.unity3d.com/Manual/webgl-memory.html.
    Just leave it at 256 for now. Runestife does not require much memory.


    # Enable exceptions


    This setting has three options:


    +   - None: Maximum performance and minimal file size. When an exception occurs,
    the game reports the error and stops running.


    +   - Explicitly Thrown Exceptions Only: Decent performance and build size. Only
    exceptions with a draw statement will get caught and cause the finally to work.


    +   - Full (with and without stacktrace): Worst performance and file size. Every
    exception is thrown, even Null References. Only use this for tracking down unique
    WebGL bugs, this will bring your game to its knees.


    Set Enable Exceptions to None. You know your game runs fine so there''s no need
    to sacrifice any performance.


    # Data caching


    With data caching enabled, the player only has to download the assets for your
    project on the first load. Subsequent visits will load the data from an IndexedDB.
    If the game has been updated, the cache is cleared and the player has to do a
    full re-download. Enable this for Runestife by checking the checkbox.


    That concludes the WebGL player settings. Time to make a build!'
