- pgno: 518
  md: "Here’s what’s happening:\n\n+   1. Only continue if there's an active wave.\n\
    \n+   2. If the spawn counter is higher than the active wave's timeBetweenSpawnsInSeconds\
    \ variable, there's an anomaly that needs to spawn. Also reset the spawn counter,\
    \ in this case.\n\n+   3. Check if there's still enemies in the current wave.\n\
    \n+   4. Spawn the first entry in the enemy list at the position of the first\
    \ waypoint of the wave's path.\n\n+   5. Set the new enemy's pathIndex so it knows\
    \ where it should move.\n\n+   6. Remove the first entry in the list of enemies.\n\
    \n+   7. If the check in //2 fails, there are no more enemies in the current wave.\
    \ Empty the activeWave variable by giving it a null value.\n\n+   8. If the number\
    \ of total waves equals the number if waves that were already activated that means\
    \ all waves are over.\n\nThese parts combined give the WaveManager all needed\
    \ functionality to start spawning enemies!\n\nThere’s still one small method that\
    \ needs to be added so the spawning can be stopped completely if necessary. Add\
    \ this under UpdateActiveWave():\n\n```\npublic void StopSpawning(){\n{\n    elapsed\
    \ = 0;\n    spawnCounter = 0;\n    activeWave = null;\n    activatedWaves.Clear();\n\
    \    enabled = false;\n}\n```\n\nThis resets all variables that hold time value\
    \ and clears both the active wave and the list of waves that were already activated.\
    \ Finally, it disables the WaveManager script completely.\n\nSave this script\
    \ and return to the Unity editor. In the Hierarchy, make a new empty GameObject\
    \ named WaveManager and parent it to Managers. Add the WaveManager component you\
    \ just made to it (Scripts > Wave Manager)."
