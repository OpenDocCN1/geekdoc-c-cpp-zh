  md: '# # About the authors


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_3_0.png)


    **Mike Berg** is a full-time game artist who is fortunate enough to work with
    many indie game developers from all over the world. When he''s not manipulating
    pixel colors, he loves to eat good food, spend time with his family, play games
    and be happy. You can check out his work at [www.weheartgames.com](http://www.weheartgames.com)


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_3_1.png)


    **Sean Duffy** is a software engineer by day, and hobbyist game and tools developer
    by night. He loves working with Unity, and is also a Unity Asset Store developer
    with a special focus on 2D tools to help other game developers. Some of Sean''s
    more popular Unity Assets include his 2D Shooter Bullet and Weapon System and
    2D Homing Missiles assets. You can find Sean on Twitter at [@shogan85](https://twitter.com/shogan85)


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_3_2.png)


    **Brian Moakley** is an instructor who produces video tutorials on iOS, Unity,
    and various other topics. When not writing or coding, Brian enjoys story driven
    first person shooters, reading genre fiction, and epic board game sessions with
    friends.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_3_3.png)


    **Eric Van de Kerckhove** is a Belgian hobbyist game dev and has so for more than
    15 years.He has made a fair share of games over the years, mostly free ones for
    fun and as learning experiences.Eric leads the Unity team.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_3_4.png)


    **Anthony Ucello** is a software consultant who spends his night hours coding
    away making games in Unity. He is married and has 3 dogs and 3 cats.'
