    # # Game Over


    This game is almost done but it needs a Game Over screen. Open up the Battle scene
    (double-clicking in the **Scenes** folder).


    First, create a Panel by right-clicking in the **Hierarchy** and selecting **UI
    ▸ Panel**. Rename it to **GameOverScreen**. Set its **Anchor Preset** to **middle-center**,
    **Position Y** to **0**, its **Width** to **400**, and its **Height** to **500**.
    Set the **SourceImage** in the Image component to **Box**, and set its **Alpha**
    to **1** (just click the **Color** box and slide the A over the right).


    A panel is just another UI control, which you can use to organize your controls.
    All subsequent UI controls will be **children of the GameOverScreen**.


    Create a Text UIGameObject, rename it to **GameOverText** and put it under the
    **GameOverScreen** GameObject (by dragging it under it or by having it selected
