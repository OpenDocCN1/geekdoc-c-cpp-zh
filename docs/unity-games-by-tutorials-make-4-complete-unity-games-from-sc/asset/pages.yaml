  md: "# Automatically positioning and scaling world UI\n\nOpen the UIManager (Scripts\
    \ > Game > UI folder) and add the following variable under txtEscapedEnemies at\
    \ the top of the script:\n\n```\npublic static float vrUIScaleDivider = 12;\n\
    ```\n\nThis will be used to automatically scale UI elements based on the distance\
    \ to the player, similarly to the reticle.\n\nNow add this method at the end of\
    \ ShowAddTowerWindow() :\n\n```\nUtilityMethods.MoveElementToWorldPosition(addTowerWindow.GetComponent<RectTransform>(),\
    \ towerSlot.transform.position);\n```\n\nAlso add this at the end of ShowTowerInfoWindow():\n\
    \n```\nUtilityMethods.MoveElementToWorldPosition(towerInfoWindow.GetComponent<RectTransform>(),\
    \ towerInfo.transform.position);\n```\n\nBoth of these are the same; they'll make\
    \ sure the window is moved and resized to the position of either the tower slot\
    \ or the tower that was selected. MoveElementToWorldPosition() needs to be updated\
    \ for this functionality; you'll need to do this once the UIManager is complete.\n\
    \nAlso, add this to the beginning of Show...Window() methods:\n\n```\nif (GameManager.Instance.gameOver)\n\
    {\n  return;\n}\n```\n\nThis ensures that the windows won't open up if the game\
    \ is over. In both ShowWinScreen() and ShowLoseScreen(), remove this line:\n\n\
    ```\nblackBackground.SetActive(true);\n```\n\nBecause you can see the world at\
    \ any time, the background doesn't make much sense and would just disrupt the\
    \ player.\n\nSave this script and open up the UtilityMethods script (Scripts >\
    \ Utility folder). Add the following method to it:\n\n```\n//1\nprivate static\
    \ void ScaleRectTransformBasedDistanceFromCamera\n```"
