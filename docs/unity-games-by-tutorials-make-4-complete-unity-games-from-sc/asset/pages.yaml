  md: '# Unity Games by Tutorials


    +   - CapsuleCollider2D: A smooth continuous circumference capsule-shaped collider.
    Useful as it doesn''t easily catch on other collider shapes.


    +   - CompositeCollider2D: Allows you to merge multiple Box and Polygon Collider
    shapes to form a single composite collider.


    The following diagram shows an example of each Collider2D component. The green
