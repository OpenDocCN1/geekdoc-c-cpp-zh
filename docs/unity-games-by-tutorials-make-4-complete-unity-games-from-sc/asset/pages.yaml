    # # Pathfinding in Unity


    The aliens have arrived, but they''re little more than decorations at this point.
    They need to get moving!


    Seems like an easy enough task, yes? You could set a target for the aliens, and
    in each frame move them towards the target. Problem solved. End of chapter!


    Of course, it''s not that easy. First, you''d have to rotate the alien constantly
    so it faces the space marine. Second, a real problem occurs when an alien runs
    into a column.


    The aliens will keep walking into the column until something causes them to move
    in a different direction. It''s pretty ridiculous when a single column can block
    an entire mobile.


    Perhaps you could get away with this behavior 20 years ago, but modern gamers
    expect better than this.


    So what do you do?


    Your first inclination may be to write the pathfinding code. For instance, you
    could write code that makes the aliens turn and move until they are free of the
    column, then redirect them towards the hero.


    It''s not that it wouldn''t work, but you''d be treating a fundamental problem
    like an edge case. What would happen if you added another floor to the mix? You''d
    have to apply similar fixes, and then your code quickly becomes an unreadable
    pile of spaghetti.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Thankfully, there''s a better way.


    # Unity''s navigation system


    It turns out Unity has pathfinding solutions you can use right out of the box,
    through its navigation system. Four objects comprise the navigation system:


    +   1. NavMesh: Represents walkable areas. This works on flat and dimensional
    terrain, such as stairs.


    +   2. NavMesh Agent: The actor or agent using the NavMesh. You give your a goal
    and it will find its way using the NavMesh.


    +   3. Off-Mesh Link: A shortcut that can''t be represented on the map, such as
    a gap that characters can actually cross.


    +   4. NavMesh Obstacle: Obstacles that the agent should avoid. Your agents will
    use pathfinding to figure a way around them.


    To get the ai chase the hero, you first need a NavMesh over the entire floor to
    designate it as a walkable area. To start, click Window\Navigation.


    Unity will display the Navigation window (it appears in the right panel where
    the Inspector is usually by default). Take note of the tabs:


    +   * Agents: Defines the various agent sizes.


    +   * Areas: Defines an area mask, much like a physics layer.


    +   * Bake: Configures the NavMesh''s properties.


    +   * Object: Lists the GameObjects you''ve added to the NavMesh.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_135_0.png)'
  merge: -1
  img_proc: true
