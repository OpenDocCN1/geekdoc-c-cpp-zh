- pgno: 604
  md: 'These are some of the most important settings exporting for a standalone platform.
    Most of the defaults are just fine. The common ones:


    +   - **Default Is Full Screen**: Enables Full-Screen mode by default when the
    game starts.


    +   - **Run In Background**: Keep the game running when it is out of focus. This
    is especially handy for networked games as the connection might be lost otherwise.


    +   - **Display Resolution Dialog**: When enabled, pops up the resolution configuration
    dialog at the start of the game. It can also be set to **Hidden By Default**,
    which means the dialog will only show when the players holds down **Alt** (or
    **Option** on a Mac) while starting up the game.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_604_0.png)


    +   **Supported Aspect Ratios**: These checkboxes decide aspect ratios can be
    selected in the resolution dialog at startup if they are supported by the player''s
    montior. Uncheck all checkboxes here except for **16:9**. Runestife only supports
    this aspect ratio, as anything less wide will cause some tower slots to be cut
    off from the screen. You can try it out for yourself by changing the aspect in
    the **Game** view''s control bar.'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# Unity Games by Tutorials


    # Chapter 21: Publishing Your Game


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_605_0.png)


    Everything is now ready for you to create builds!


    Select **File > Build Settings...** to open the Build Settings window. Here, you
    can choose what platform to build for in the **Target Platform** drop-down:


    | Target Platform |

    | --- | --- |

    | Architecture | Windows |

    | Copy PDB files | Mac OS X |

    | Development Build | Linux |

    | Autoconnect Profiler |


    You can also choose the architecture, which means **32-bit, 64-bit or both (or
    for Mac OSX and Linux)**. Almost all computers since around 2006 have 64-bit processors,
    so it''s safe to build for this architecture. You can build for 32-bit if you
    like to be safe. In the case of Mac OSX and Linux, always select the universal
    architecture as that covers both.


    | x86 | x86 | |

    | --- | --- | --- |

    | ✓ | ✓ |

    | x86 | x86,64 | x86,64 |

    | Universal | x86+x64 (Universal) | |

    | Windows | Mac OSX | linux |


    Select **Windows** and **x86,64** in their respective drop-downs and click **Build**
    in the bottom right. Choose a folder to store the build and create a new folder
    at that location named Runestife-Windows. Choose the new folder as the location,
    then click **Save**. Unity will now compile the project into a build. The time
    it takes depends on the size of the project; Runestife shouldn''t take more than
    a minute or so.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_605_1.png)


    raywender.com


