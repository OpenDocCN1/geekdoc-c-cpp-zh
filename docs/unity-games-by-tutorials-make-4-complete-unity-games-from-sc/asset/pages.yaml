- pgno: 601
  md: '# # Chapter 21: Publishing Your Game


    By Eric Van de Kerckhove and Brian Moakley


    Making a game can be rewarding in its own right, but getting it out there for
    people to play and getting awesome feedback is a whole other level of gratification.
    Unity currently supports almost **30 platforms** — and the list is still growing!
    It''s easy to make one game and export it to multiple platforms with minor adjustments.


    In this chapter, you''ll learn how to create builds for the most common platforms:


    +   - Standalone (Windows, Mac OSX & Linux)

    - WebGL

    - Android

    - iOS


    Since the process to submit to stores such as Apple iTunes and Google Play is
    rather involved and changes frequently, we''ve supplied links to tutorials that
    cover the store submission process in depth.'
  merge: -1
  img_proc: true
