- pgno: 168
  md: '# Triggering animations in code


    At this point, you have animation clips, animation states and conditions in place
    to activate your animations.


    Next, you''ll use a collider trigger to put everything together in code.


    Select **BobbleArena** in the Hierarchy then click the **Create** button. From
    the drop-down, select **Create Entity Child** and name **WallTrigger**. Set **Position**
    to **(0, 0, 0)** and **Scale** to **(0.5, 0.5, 0.5)**. Next, click the **Add Component**
    button, and from the **Physics** category, select **Box Collider**.


    In the Box Collider category, check the **Is Trigger** checkbox, set Center to
    **(0, 6.72, -90.6)** and Size to **(250.55, 17.14, 66.7)**


    You should see a large trigger in the Scene view toward the back walls. When the
    space marine walks into this area, you want to lower the walls.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_168_0.png)


    To do this, select the **WallTrigger** then click the **Add Component** button
    and select **New Script**. Name it **ArenaWall** and click the **Create and Add**
    button.


    **Double-click** the new script to edit it, and add this variable inside the class:


    ```

    private Animator arenaAnimator;

    ```


    You could make it a public variable so you can set this in the inspector, but
    this isn''t necessary.


    This is because **WallTrigger** is a child of the **BobbleArena**, so you can
    get a reference to the animator by accessing the **WallTrigger**''s parent property,
    and getting the appropriate component.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "# Unity Games by Tutorials\n\nTo do this, add this to Start():\n\n```\nGameObject\
    \ arena = transform.parent.gameObject;\nrenaAnimator = arena.GetComponent<Animator>();\n\
    ```\n\nFirst, gets the parent GameObject by accessing the parent property on the\
    \ transform. Once it has a reference to the arena GameObject, it calls GetComponent\
    \ for a reference to the animator.\n\nThe above code works because it assumes\
    \ the caller is a child of BobbleArena. It would fail if the caller were moved\
    \ to a different GameObject.\n\nNext add the following before the closing brace:\n\
    \n```\nvoid OnTriggerEnter(Collider other)\n{\n    renaAnimator.SetBool(\"IsLowered\"\
    , true);\n}\n```\n\nWhen the trigger is activated, the code sets IsLowered to\
    \ true. You do do this by calling SetBool().\n\n> Note: There are similar methods\
    \ for other types. For example, for a float, you'd use SetFloat().\n\nNow you\
    \ need to logic raise the walls. Add the following:\n\n```\nvoid OnTriggerExit(Collider\
    \ other)\n{\n    renaAnimator.SetBool(\"IsLowered\", false);\n}\n```\n\nWhen the\
    \ hero leaves the trigger, this code tells the Animator to set IsLowered to false\
    \ to raise the walls.\n\nThere's one outstanding detail for this script. Currently,\
    \ any GameObject that enters the trigger lowers the walls. You need a filter so\
    \ it only applies to the space marine.\n\nSave the file and go back to Unity.\
    \ With WallTrigger still selected, assign it the Wall layer. Navigate to Edit\
    \ -> Project -> Settings -> Physics.\n\nUncheck all the checkboxes in the Wall\
    \ row. In the Wall column, uncheck Alien Head, Bullet, Column and Floor."
  merge: -1
  img_proc: true
