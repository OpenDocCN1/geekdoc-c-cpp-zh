- pgno: 234
  md: 'Select BobbleArena in the Hierarchy. In the Inspector, drag the SpaceMarine
    to the player extend. Expand the BobbleArena and look for a child GameObject named
    Elevator_Platform. Drag it to the Elevator property in BobbleArena.


    You''re down to the last step of calling your code. Frankly, animation events
    can do this. How cool is that?


    # Animation events


    An animation event is very much like a keyframe. You determine a point in the
    animation at to run the code, and then you assign it a method. This approach allows
    precision control over when the code runs.


    > Note: Remember, you can animate all properties, including the collider you''ve
    enabled.


    You imported the animations for summoning and rising in Chapter 1, "Hello, Unity,"
    and just need to associate them with the Animator.


    With BobbleArena selected in the Hierarchy, open the Animator window. You''ll
    see the wall states you set up in Chapter 6, "Animation."


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_234_0.png)


    You need a new state to summon the elevator, and it should be accessible from
    all the states because a win may occur at any time. You could create a transition
    from each state, but Unity has covered you with the "Any State"


    In the Animator, right-click anywhere and select Create State ▸ Empty. Select
    New State, and name it ElevatorSummon in the Inspector. Set Motion to be the ElevatorSummon
    animation clip and Speed to 0.5 to slow the elevator to half its normal speed.
    As-is, it runs a little fast and stops before its audio clip ends. Slowing it
    down keeps the elevator in sync with its audio.'
