- pgno: 424
  md: 'Unity Games by Tutorials


    Chapter 15: Modeling in Blender


    Be sure to Apply Rotation & Scale for each of the wheels as well.


    # Joining objects


    Since these three objects are going to be animated as a single object in Unity,
    it makes them easier to work with if they are combined into a single object.


    Click one of the wheels to select it, then hold Shift, click the other wheel,
    then the axle. It''s important to select the axle last. Press Ctrl-J to join them.


    Note the dot at the center of the object. This dot is the origin of your object.
    Transformations applied to the object center around the origin, both in Blender
    and in Unity. When joining objects, the last object selected is the one that keeps
    its origin.


    > Note: If you ever need to reset an object''s origin, make sure you are in Object
    mode, use the menu at the bottom of the 3D View to select Object > Transform ▸
    Origin to Geometry to snap the origin to the center of its geometry.


    # Renaming objects


    Since you want to animate this object in Unity, it will be helpful to give it
    a recognizable name. The top-right panel in Blender is the Outliner. Double-click
    the cylinder object''s name to change it to axle:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_424_0.png)


    # Adding the base


    +   1. Create a new cube by pressing Shift-A and selecting Mesh > Cube.

    2. Scale it twice: Type S Z 0.2 and press Enter, type S Y 2 and press Enter.


