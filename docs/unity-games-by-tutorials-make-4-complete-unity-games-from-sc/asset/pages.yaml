    # # Animating models


    At some point, you may want to add animations for your models. Unity provides
    for this power; unfortunately, it''s not always the right tool for the job. As
    mentioned in Chapter 1, "Hello, Unity" is more of an integration tool than it
    is a creation tool.


    Although Unity shares many features with popular 3D modeling and animation programs,
    it''s not well-equipped to handle advanced tasks. Many developers prefer to create
    animations in an external program then import them into Unity.


    That said, making simple animations is fine. After, animating a custom model is
    no different from what you just did with the walls.


    Take the alien for an example. Like the space marine, it has a large head that''s
    begging to bobble. For learning purposes, rather than create this effect with
    physics, you''ll use animation to create the effect.


    So you can easily preview the animation you work on, select the **Alien** in the
    Hierarchy, or drag an instance of the **Alien** into the Scene view if it''s not
    there.


    Last time that you created an animation, Unity made the animator controller. This
    time, you''ll do that for yourself.


    Expand the Alien in the Hierarchy to reveal its child GameObjects. Select **BobbleEnemy-Head**
    and click the **Add Component** button. From the **Miscellaneous** section, select
    the **Animator** component.


    raywenderlich.com


