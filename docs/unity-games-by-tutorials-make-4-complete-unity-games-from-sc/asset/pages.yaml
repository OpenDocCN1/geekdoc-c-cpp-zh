- pgno: 439
  md: '# Where to go from here?


    > **Important**: When you finish a model, remember to apply all the Transformations
    on each of your objects before moving on. Select an object in your scene, press
    Ctrl-A and select **Rotation & Scale**. Repeat this for every object.


    Congratulations! You have mastered some of the mystic arts of modeling in Blender.


    So far you''ve learned several core modeling techniques that could be used to
    model almost any shape you can imagine. Experiment with what you''ve learned,
    and see what other kinds of objects you can create! Hopefully you have become
    comfortable working with keyboard shortcuts, and can see how they enable you to
    model efficiently in Blender.


    The following page has a list of the keyboard shortcuts you learned to help you
    along the way.


    In the following chapter, you will learn about UV texturing to add color your
    model.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Summary of keyboard commands


    +   * X - Delete

    * Shift-A - Create new objects

    * G - Move

    * R - Rotate

    * S - Scale

    * K - Knife

    * I - Inset

    * E - Extrude

    * Ctrl-Tab - Mesh Selection mode

    * Shift-D - Duplicate

    * Alt-D - Linked Duplicate

    * Ctrl-B - Bevel

    * Ctrl-A - Apply (Rotation & Scale)

    * Ctrl-R - Loop Cut

    * Alt-M - Merge Points

    * Ctrl-M - Mirror

    * (period) - Move pivot point to 3D Cursor

    * (comma) - Move pivot point to current object

    * Shift-Z - Toggle rendered view


    # 3D View controls:


    +   * 1 - Front view

    * 3 - Side view

    * 7 - Top view

    * 5 - Toggle perspective'
