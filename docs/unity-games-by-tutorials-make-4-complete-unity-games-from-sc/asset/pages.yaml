  img_proc: true
- pgno: 389
  md: "# Unity Games by Tutorials\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.IO;\nusing System.Linq;\nusing System.Runtime.Serialization.Formatters.Binary;\n\
    ```\n\nThese namespaces allow you to work with some language and library features\
    \ in the GameManager.cs script. Linq allows you to use LINQ code to query a list\
    \ of stored level runtimes, and serialization allows you to call code that lets\
    \ work with binary serialization formatters, which you'll use to save and load\
    \ data in binary format.\n\nAdd the following to the GameManager class:\n\n```\n\
    public List<PlayerTimeEntry> LoadPreviousTimes()\n{\n    // 1\n    try {\n   \
    \     var scoresFile = Application.persistentDataPath +\n            \"/\" + playerName\
    \ + \"_times.dat\";\n        using (var stream = File.Open(scoresFile, FileMode.Open))\
    \ {\n            var bin = new BinaryFormatter();\n            var times = (List<PlayerTimeEntry>)bin.Deserialize(stream);\n\
    \            return times;\n        }\n    // 2\n    } catch (IOException exception)\n\
    \    {\n        Debug.LogWarning(\"Couldn't load previous times for: \" +\n  \
    \          playerName + \". Exception: \" + ex.Message);\\n        return new\
    \ List<PlayerTimeEntry>();\n    }\n}\n```\n\n```\npublic void SaveTime(decimal\
    \ time)\n{\n    // 3\n    var times = LoadPreviousTimes();\n    // 4\n    var\
    \ newTime = new PlayerTimeEntry();\n    newTime.entryDate = DateTime.Now;\n  \
    \  newTime.time = time;\n    // 5\n    var bFormatter = new BinaryFormatter();\n\
    \    var filePath = Application.persistentDataPath +\n        \"/\" + playerName\
    \ + \"_times.dat\";\n    using (var file = File.Open(filePath, FileMode.Create))\
    \ {\n        times.Add(newTime);\n        bFormatter.Serialize(file, times);\n\
    \    }\n}\n```\n\n# Chapter 14: Saving Data\n\nraywenderlich.com\n\n390"
  merge: -1
  img_proc: true
- pgno: 390
  md: 'That''s a lot of new code! Essentially, this code handles saving and loading
    of times to and from a binary formatted file kept on local storage.


    +   1. Use you try...catch statement to attempt to load saved time entries for
    the player. You construct the path to the file using a combination of the player''s
    name (stored in PlayerPrefs) and the Application.persistentDataPath.


    The using statement opens a file stream to the file path to read in any existing
    entries using a binary formatter object. You use the Deserialize() method to unpack
    — a snap — the data in the file by passing in the opened file stream. If the read
    is successful, it returns a list of player time entries.


    +   2. If deserialization is unsuccessful, the catch statement finds the errors.
    Here, you log an info message and return an empty list to the caller. This is
    important because the player might not have logged or saved times, e.g., when
    playing the first time.


    +   3. When saving a time, you fetch existing entries first with the LoadPreviousTimes()
    method.


    +   4. You create an instance of the new PlayerTimeEntry object. Then, you use
    the current date and runtime, as passed to the method, in the entryDate and time
    property fields.


    +   5. You create a binary formatter object to do the magic serialization — a.k.a.
    packing — the list of player time entries to a file. You create the file path
    using a combination of the player''s name and the Application.persistentDataPath.
    Again, the using statement opens the file.


    However, this time it uses the FileMode.Create option, which lets you create a
    new or overwrite existing files in the same path. Finally, you add the new time
    entry to the list of pre-existing times before saving them all into the file.


    > Note: The using statement in the code above is a special statement in C# that
    can utilize to deal with objects that implement the IDisposable interface. Most
    file and IO-related operations provided by the framework support this.


    It''s a good idea to wrap these operations in a using statement when supported.
    Once work on the item inside of the using statement finishes, any objects that
    were created are destroyed.


    In the case above, where you''re opening and writing to files, you''re properly
    closing file access when the using statement completes. Hence, you shouldn''t
    have locked file issues when writing to the file at a later point.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_390_0.png)'
  merge: -1
  img_proc: true
- pgno: 391
  md: "# Unity Games by Tutorials\n\nNow that you've added the structure to save and\
    \ load runtime data, you need a way to display the previous times in the game.\n\
    \nGo back to Unity and open the Game scene. On the main Canvas GameObject, create\
    \ a new Text GameObject. Name it PreviousTimes.\n\nSet the anchor and position\
    \ of your UI text component as shown below:\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_391_0.png)\n\
    \nIn the Text component, set the Font to orbitron-medium, Font Size to 16, Line\
    \ Spacing to 1.2 and to right-aligned. Use the Best Fit with Max Size of 16 and\
    \ set Color to solid white, you can also clear the \"New\" text value.\n\nSave\
    \ the scene. Go back to GameManager.cs and add the following to the bottom of\
    \ the class:\n\n```\npublic void DisplayPreviousTimes() {\n  // 1\n var times\
    \ = LoadPreviousTimes();\n var topThree = times.OrderBy(time => time.time).Take(3);\n\
    \  // 2\n var timesLabel = GameObject.Find(\"PreviousTimes\");\n  .GetComponent<Text>();\n\
    \  // 3\n  timesLabel.text = \"BEST TIMES \\n\";\n  foreach (var time in topThree)\
    \ {\n    timesLabel.text += time.entryDate.ToShortDateString() + \": \" + time.time\
    \ + \"\\n\";\n  }\n}\n```\n\nThis code will populate time entries in the newly\
    \ created PreviousTimes UI Text component. Here's what it does in more detail:\n\
    \n+   1. Collects existing times using the LoadPreviousTimes() method. times.OrderBy(time\
    \ => time.time).Take(3) is a LINQ query that sorts times from fastest to slowest,\
    \ and then takes the first three of each.\n2. Finds the PreviousTimes text component.\n\
    3. Changes it to show each time found, separating entries with a line break using\
    \ the \"\\n\" string.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_391_1.png)\n\
    \nChapter 14: Saving Data"
  merge: -1
  img_proc: true
- pgno: 392
  md: 'Note: LINQ stands for Language Integrated Query. It''s a querying language
    that allows you to easily query and manipulate data. There are many useful query
    expressions, and generally, you can chain them together. Read more about LINQ
    at: https://en.wikipedia.org/wiki/Language_Integrated_Query


    The final piece of the binary serialization puzzle is saving level runtimes when
    the player reaches the goal — steaming bowl of delicious noodles.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_392_0.png)


    Open the Timer.cs script and add the following variable declaration:


    ```

    public decimal time;

    ```


    Change the code in Update() to look like this:


    ```

    time = System.Math.Round((decimal) Time.timeSinceLevelLoad, 2);

    timerText.text = time.ToString();

    ```


    By storing the time in the new variable before updating the timer Text value,
    you''re giving others the ability to access the time value.


    Open the Goal.cs script. At the bottom of the OnCollisionEnter2D() method, inside
    the if statement that checks for the Player tag, add the following:


    ```

    // 1

    var timer = FindObjectOfType<Timer>();

    // 2

    GameManager.instance.SaveTime(timer.time);

    ```


    This saves the time when the player reaches the goal.


    +   1. FindObjectOfType finds the timer component instance in the level scene.
    The generic type Timer is indicated here. This Unity method finds the first instance
    of a script of type Timer. As there is only one Timer script per level, which
    is used to track level time, this instance is returned.

    2. The new SaveTime method you created is on the GameManager singleton, passing
    in the current level runtime from the Timer script.'
