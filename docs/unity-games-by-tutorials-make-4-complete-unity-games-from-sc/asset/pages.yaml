- pgno: 593
  md: 'This turns this class into an input module. At this point, you may get an error
    saying this class does not implement an inherited member. Ignore this; you''ll
    be adding the appropriate method in a bit.


    Add these variables underneath the class declaration:


    ```

    //1

    public Camera CameraControllerCamera;

    //2

    public SteamVR_TrackedObject RightController;

    //3

    public GameObject reticle;

    //4

    public Transform laserTransform;

    //5

    private Transform rightControllerTransform;

    //6

    // The size of the reticle will get scaled with this value

    public float reticleSizeMultiplier = 0.02f;

    //7

    private PointerEventData pointerEventData;

    //8

    private RaycastResult currentRaycast;

    //9

    private GameObject currentLookHandler;

    ```


    This is what these variables are for:


    +   1. A reference to the camera attached to the right controller.

    2. This holds a reference to the right controller itself, to be able to get its
    input.

    3. Reference to the Reticle.

    4. A reference to the Laser.

    5. This holds the right controller''s Transform so it can be used to get its position
    and rotation.

    6. The reticle will get scaled based on this value. This is the size the reticle
    will be exactly one unit away from the controller.

    7. This stores all events that will happen with the virtual pointer.

    8. Stores the result of the raycasts into the scene from the controller camera.

    9. This holds the IPointerClick events that should happen when the player presses
    the controller''s trigger button.'
