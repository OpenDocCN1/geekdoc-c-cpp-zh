  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_474_0.png)


    +   7. Click the end of **bone 2** and press **E** to extrude a bone to the midpoint
    of where the large claw meets the “hand.”


    +   8. Press **E** to extrude the bone for the large claw.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_474_1.png)


    > **Note:** Name each bone, and be sure to use “L” at the end of each name. In
