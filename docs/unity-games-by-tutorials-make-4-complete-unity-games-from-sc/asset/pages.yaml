- pgno: 640
  md: 'Unity Games by Tutorials


    Transforms also allows you to search for any child GameGameObjects by name. To
    do this, you use Find(). The problem with Find() is that it''s slow, so if you
    need to use it in a loop or in a repeating method like Update(), store the results
    of Find() in a variable.


    ```

    transform enemy = transform.Find("Enemy");

    ```


    And, of course, to get rid of all those children, you use DetachChildren(). This
    doesn''t destroy the GameObjects. It simply moves them off the current hierarchy.


    ```

    enemy.DetachChildren();

    ```


    Transforms can a lot of additional methods to allow you to do things such as face
    a GameObject towards another, change the name or tags, or move GameObjects by
    way of Translate(). In short, you need to manipulate a GameObject in 3D space,
    check with the Transform first. Chances are, it has a method to do what you need.


    # Quaternions


    A quaternion is an object that represents the rotation of an object. At its heart,
    a quaternion is a complex mathematical construct that will keep you up questioning
    your existence. All jokes aside, although quaternions seem complex at first, they
    aren''t too difficult to work with.


    A quaternion represents an x, y, z, and w coordinate. The x, y, and z coordinates
    represent the coordinate of the rotation, while w indicates the cosine of half
    the rotation angle. Unity recommends that you never directly adjust any of these
    coordinates "you know what you are doing." If you don''t understand the math behind
    the quaternion, let the Quaternion class handle it for you.


    When setting up an object, you''ll often need to set up its default rotation.
    To provide a quaternion without any rotation, you use the identity property like
    so:


    ```

    Quaternion.identity;

    ```


    When working with rotation in the Inspector, you''ll see what are known as Euler
    angles. These make it easy to understand the rotation in terms we''re used to
    thinking about (i.e., "90 degrees around the x-axis"). You can use Euler angles
    to set the rotation of the quaternion like so:


    ```

    Quaternion objectRotation = Quaternion.identity;

    objectRotation.eulerAngles = new Vector3(90, 0, 0);

    ```


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_640_0.png)


    641'
