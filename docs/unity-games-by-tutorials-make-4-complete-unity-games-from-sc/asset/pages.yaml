- pgno: 18
  md: '# What you need


    To follow along with the tutorials in this book, you''ll need the following:


    +   - A PC running Windows 7 SP1+ or later or a Mac running Mountain Lion or later.
    You''ll need this to install the latest version of Unity. Note this book will
    work whether you prefer to develop on Windows or on the Mac, since Unity is cross-platform.

    - Unity 2018.1 or later. You can download the latest version of Unity for free:
    https://store.unity.com/

    - Blender 2.70 or later. A lot of these in the book are Blender files which requires
    the software to be installed on your computer. Don''t worry, it''s free! You can
    download the latest version of Blender for free here: https://www.blender.org/download/

    - (Optional) One or more devices running iOS 7 or Android version 4.1 or later.
    This is required for the chapter on publishing your game. If you choose not to
    read that chapter, you can ignore this requirement.

    - (Optional) A virtual reality headset as the Oculus Rift or HTC Vive. If you
    want to try the chapter on Virtual Reality, you''ll need a headset to test the
    game. If you don''t have a headset don''t worry, you can skip this chapter.

    - (Optional) A GPU with DX9 or DX11 capabilities. For most of the chapters, you
    should be able to run all the examples on an older video card — except for the
    virtual reality chapter, which you''ll need a relatively new card with some processing
    power behind it.


    Once you have these items in place, you''ll be able to follow along with every
    chapter in this book.


    # Who this book is for


    This book is for complete beginners to Unity, or for those who''d like to bring
    their Unity skills to a professional level. The book assumes you have some prior
    programming experience (in a language of your choice).


    If you are a complete beginner, we recommend you learn some basic programming
    skills first. A great way to do that is to watch our free Beginning C# with Unity
    series, which will get you familiar with programming in the context of Unity.'
