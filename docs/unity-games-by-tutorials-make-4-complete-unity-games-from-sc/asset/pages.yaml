  md: '# Giving the marine something to shoot


    First, you need to add a target for the marine. If there isn''t an alien in the
    scene, add one now. In the Project Browser, drag an Alien from the Prefabs folder
    and place it in front of the marine. In the Inspector, select the Alien''s position
    to (-27.67, 13.57, 74.53).


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_96_0.png)


    Play the game and shoot the alien.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_96_1.png)


    Haha! The bullets pass right through without inflicting any harm, which is the
    default behavior for all GameObjects. You have to opt your GameObjects to receiving
    collisions. Sound familiar? Can you guess what component''ll use?


    That''s right; you need another Rigidbody! In the previous chapter, you used this
    to component opt objects into the physics engine. With the Rigidbody in place,
    not only can the GameObject respond to forces like gravity, but it can get a notification
    when another object, such as a bullet, collides with it. Then you can define what
    happens after such a collision, e.g., the alien explodes or vanishes.


    Your alien has no Rigidbody, which is why it''s impervious to our hero''s attack.
    Select the Alien in the Hierarchy. In the Inspector, click the Add Component button.
    Select the Physics category and select Rigidbody.'
