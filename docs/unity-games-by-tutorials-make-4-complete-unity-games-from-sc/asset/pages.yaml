    ```


    This code moves the head when the marine moves. First, you calculate the movement
    direction. If the value equals Vector3.zero, then the marine is standing still.


    AddForce() is how you get the head to move. You provide a direction then multiply
    it by the force amount.


    There are different force types, and you''re using ForceMode.Acceleration, which
    gives a continuous amount of force that ignores the mass.


    > Note: If you wanted to use the mass, you''d use ForceMode.Force. For more detail
