  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_266_0.png)


    There is one issue with the assault rifle. The gun fires faster than the animations.
    This makes the motion out of sync with the action. To fix this, you need to return
    to the Animator.


    If your Animator window is closed, make sure to reopen it by clicking **Window
    > Animator**. In the Hierarchy, select the **2AssaultRifle** GameObject and you''ll
    see its animation states in the Animator.


    By default, animations blend into each other during a transition. This blending
    is referred to as exit time. **Select the transition** from **Fire** to **Base**.
    In the Inspector, you''ll see the visual depiction of the exit time under the
    **Settings** category.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_266_1.png)


    There are two ways to remove exit time. You can uncheck the **Has Exit Time**
    property, but you can only do this when you have a condition. Since you don''t
    have a condition, you can set the duration of the transition to zero. This does
    the same thing.


    To do this, drag the right blue arrow in the timeline all the way to the left:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_266_2.png)'
