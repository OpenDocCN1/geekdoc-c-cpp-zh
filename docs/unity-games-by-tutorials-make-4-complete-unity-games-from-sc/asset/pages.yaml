- pgno: 394
  md: "Here’s an example of some JSON representing a part of a custom Super Soy boy\
    \ level.\n\n```\n{\n  playerStartPosition:\n  cameraSettings:\n  levelItems:\n\
    \    0:\n      rotation:\n      scale:\n      position:\n        prefabName: \"\
    buzzsaw\"\n        spriteOrder: 1\n        spriteLayer: \"Hazards\"\n        spriteColor:\n\
    \          r: 1\n  }\n}\n```\n\nFor the rest of this chapter, you’ll focus on\
    \ building a level editor that has a saving and loading system. It’ll allow you\
    \ to save custom level layouts in JSON and load them back to play.\n\nThe system\
    \ you build will prove how easy it is to add mod support to the game or provide\
    \ players with a way to share custom levels.\n\n# Unity support for working with\
    \ JSON\n\nThere are some limitations around what types of objects Unity’s JsonUtility\
    \ system will support.\n\nMonoBehaviours, ScriptableObjects and plain classes/structs\
    \ with the [Serializable] attribute applied are supported.\n\nAs a rule of thumb,\
    \ the utility only supports the public fields of supported types. For example,\
    \ basic types like integer, string and floats are supported, where dictionaries\
    \ are not. If you want to use arrays, you’ll need to wrap them in a class or struct.\n\
    \nBenchmarks show that Unity’s JsonUtility outperforms popular NET JSON solutions.\
    \ Its speed outweighs the fact that it currently has fewer features than these\
    \ solutions.\n\nPerformance is more important than bells and whistles when it\
    \ comes to designing games."
  merge: -1
  img_proc: true
- pgno: 395
  md: '# Creating a level editor and saving levels


    In this section, you''ll leverage JSON serialization and deserialization to implement
    level saving and loading.


    You''ll be able to construct custom levels in Unity, save them to JSON and share
    them with anyone else playing Super Boy. Whoever you share it with can place the
    JSON in the game directory, fire up the and play the level.


    Here''s the cool part: You don''t have to share any game code or executables!


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_395_0.png)


    # Building a custom editor for saving levels


    You''ll use the Unity editor to design levels and a custom editor script to enumerate
    all the level pieces in the scene as well as automatically save the layout to
    a JSON level file. Information about every level piece will be accounted for,
    including type, position, rotation, sprite color, sprite layer and sprite order
    in the layer.


    Open the Game scene in Unity. In the Project view, go into the Scripts folder
    to make a new folder named Editor (if it doesn''t already exist), and create a
    new C script named LevelEditor. In the Scripts folder, create a new C# script
    named Level.


    LevelEditor will look for a GameObject in the scene named Level and enumerate
    all children GameObjects underneath it. It will save information about each object,
    as information as the starting point for Super Boy and details about the smooth
    follow camera to a JSON file.


    Look at the Hierarchy window to confirm you have a LevelObject that has all the
    level pieces as its children – the custom editor script will end up enumerating
    and saving information about these children.'
  merge: -1
  img_proc: true
