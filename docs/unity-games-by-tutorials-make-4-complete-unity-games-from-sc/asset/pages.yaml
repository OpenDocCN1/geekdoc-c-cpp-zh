- pgno: 382
  md: '# Challenge time


    As a challenge, you can now use your chapter project to create your new level.
    To prepare the Game scene as a template for building a level, you will need to
    do a few things.


    First, start by removing all the GameObjects from the Scene Hierarchy, except
    for Main Camera, Canvas, SoyBoy, EventSystem, GameManager and Music.


    Then create a new GameObject called Level in the root of the Scene Hierarchy.
    Position this GameObject at (0, 0, 0). This is what your Scene Hierarchy should
    now look like:


    | Canvas |

    | Timer |

    | EventSystem |

    | Main Camera |

    | Music |

    | GameManager |

    | Level |


    This will leave you with a blank slate that you can start creating your level
    from. All of your level objects from here on will be placed as children (nested
    under) the new Level GameObject you just created.


    As a hint to get going, the first thing you should generally do, is to decide
    on a layout for your level, and where hazards should be located.


    You''ll create the base platform and level structure first. For this you can use
    the single-block-large prefab located under Resources ▸ Prefabs. Drag and drop
    one into the Scene view.


    Using the Hierarchy editor window, select the newly placed single-block-large
    GameObject and click Ctrl-D on your keyboard (Command-D on a Mac) to duplicate
    it as many times as you need to start building platforms and walls to run along
    and jump up.


    Lastly, when creating your own levels, don''t forget to place the SoyBoy and Goal
    prefabs for the start and goal positions of your level.


    # Where to go from here?


    Congratulations on making it to the end of this chapter! You''ve come a long way,
    and learned much about the Unity 2D asset and scripting workflow.'
