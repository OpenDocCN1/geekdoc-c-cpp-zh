    # # The Game Manager


    There are a few variables and functionality that don''t fit into any specific
    script need to be accessed from many other scripts. A Game Manager fits perfectly
    in this situation. It stores all of global information such as the amount of gold
    the player has or the number of enemies that have escaped. It also contains some
    methods for things like restarting the game and returning to the title screen.


    Create a new C# Script in the Scripts > folder and name it Game Manager. Open
    it in a code editor. Remove the Start() and Update() methods completely. Put this
    below the other using statements at the top of the file:


    ```

    using UnityEngine.SceneManagement;

    ```


    Insert these variable declarations into the class definition:


    ```

    //1

    public static GameManager Instance;

    //2

    public int gold;

    //3

    public int waveNumber;

    //4

    public int escapedEnemies;

    //5

    public int maxAllowedEscapedEnemies = 5;

    //6

    public bool enemySpawningOver;

    //7

    public AudioClip gameWinSound;

    public AudioClip gameLoseSound;

    //8

    private bool gameOver;

    ```


    Here''s the role of each:


    +   1. The static variable for global access.

    2. The amount of gold the player has.

    3. Number of the wave that''s currently being spawned.

    4. Amount of enemies that made it to the exit.

    5. Number of escaped enemies before you lose the game.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_524_0.png)


    525'
