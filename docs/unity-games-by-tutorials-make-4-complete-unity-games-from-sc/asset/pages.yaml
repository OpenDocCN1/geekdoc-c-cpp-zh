  md: '# Building your own game level


    Instead of providing instructions on where to place every single GameObject to
    create a level, a couple of pre-built levels have already been included with the
    Finished project file for this chapter.


    To take a look at these levels, open the Finished project for this chapter, and
    then open either the Level1.scene or the Level2.scene in the Unity editor.


    You''ll see two of fully completed levels, ready to play.


    If you take a closer look, you''ll see that they are constructed by placing the
    building blocks available in the Resources -> Prefabs folder into the scene. The
    level blocks and platform blocks are kept aligned to the grid by holding down
    Ctrl when moving or placing them.


    As the basic building block prefabs are mostly colored white, you can easily change
    their color on the Sprite Renderer component using the color picker to style your
    levels any way you like.


    In order to build your own levels, you''ll place a variety of different building
    block prefabs. These are items like small blocks, large blocks, triangular corner
    pieces, rocks, trees and so on. You learned how to create these building blocks
    in Chapter 12, "Beginning Unity 2D"


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_381_0.png)


    To create a playable level, the level should start off at a certain point (where
    Super Boy is located) and require you to run and jump past some blade obstacles
    (that, if touched, will slice you to bits).


    A noodle bowl point should be placed at the end of the level that you must reach.


    > Note: Remember that the GameManager will reload the Game scene when you die,
    hit the goal, so in the case of the Level1 and Level2 scenes, you''ll be booted
    into the Game scene if you win or lose in these example levels.'
