- pgno: 603
  md: 'Unity Games by Tutorials


    Chapter 21: Publishing Your Game


    To make sure the icon is used for builds, select **File > Build Settings...**
    and click **Player Settings...** to open the **Player Settings view** in the Inspector.
    It''s best to get familiar with opening this view as you''ll be doing a lot throughout
    this chapter.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_603_0.png)


    Click **Next** next to **Default Icon** and choose **Icon** in the list. This
    will make sure that this icon is used across all platforms.


    Next, expand the **Splash Image** module. Click **Select** next to **Config Dialog
    Banner** and select **Rununestife-Banner**.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_603_1.png)


    Also, set up the **Company Name** and **Product Name:**


    | Company Name | RazeWare |

    | Product Name | Rununestife |


    This can be your real name, a pseudonym or the name of your company. Keep the
    **Product Name** as it is for now.


    Now, on to the specifics of building for each platform. **Standalone** is up first.


    # # Standalone


    Windows, Mac OSX and Linux are considered **standalone** platforms. The builds
    have both the executable and the data in a folder you can easily share.


    Open up **Player Settings** and expand the **Resolution and Presentation** module:


    | Settings for PC, Mac & Linux Standalone |

    | Resolution and Presentation |


    raywenderlich.com


    604'
