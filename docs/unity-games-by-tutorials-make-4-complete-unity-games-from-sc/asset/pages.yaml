- pgno: 596
  md: "Now add the following to use the player's input:\n\n```\nvoid HandleSelection()\
    \ {\n  //1\n  if (pointerEventData.pointerEnter != null) {\n    //2\n    currentLookAtHandler\
    \ = ExecuteEvents.GetEventHandler\n      <IPointerClickHandler>(pointerEventData.pointerEnter);\n\
    \    //3\n    if (currentLookAtHandler == null && IsTriggerPressed()) {\n    \
    \  //4\n      ExecuteEvents.ExecuteHierarchy(currentLookAtHandler, pointerEventData,\
    \ ExecuteEvents.pointerClickHandler);\n    }\n  } else {\n    //5\n    currentLookAtHandler\
    \ = null;\n  }\n}\n```\n\nHere's what's going on above:\n\n+   1. Continue only\
    \ if the pointer has entered an object to interact with.\n2. Get the OnPointerClick\\\
    u0028\\0) event of the entered object.\n3. Check that there's still something\
    \ to click on and the player has pressed the Trigger button on their controller.\n\
    4. Execute the object's OnPointerClick() event.\n5. If there's no object to interact\
    \ with, reset the currentLookAtHandler.\n\nFinally, inside the Process() method,\
    \ add these to the methods you just made:\n\n```\nHandleLook();\nHandleSelection();\n\
    ```\n\nThat's it for the input module. Save the script and return to the editor\
    \ to start using it.\n\nIn the Hierarchy, select EventSystem and add the ViveControllerLookModule\
    \ script. In the Inspector panel, press the Add Component button and search for\
    \ it or drag it from the Project panel."
