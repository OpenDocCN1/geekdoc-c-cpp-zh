- pgno: 250
  md: "```\nactiveGun = pistol;\n}\n```\n\nHere, you initialize the starting gun as\
    \ the pistol.\n\nYou now need to load the appropriate gun when the player switches\
    \ weapons. Add the following method:\n\n```\nprivate void loadWeapon(GameObject\
    \ weapon)\n{\npistol.SetActive(false);\nassaultRifle.SetActive(false);\nshotgun.SetActive(false);\n\
    nweapon.SetActive(true);\nactiveGun = weapon;\n}\n```\n\nThis method will turn\
    \ off all GameObjects, the passed-in GameObject as active, then update the activeGun\
    \ reference. You will call this code from Update(). Update that method so that\
    \ it looks like the following:\n\n```\nvoid Update()\n{\n (Input.KeyDown(\"1\"\
    )) {\nloadWeapon(pistol);\nactiveWeaponType = Constants.Pistol;\nloadWeapon(assaultRifle);\n\
    activeWeaponType = Constants.AssaultRifle;\n}\nelse if (Input.KeyDown(\"3\"))\
    \ {\nloadWeapon(shotgun);\nactiveWeaponType = Constants.Shotgun;\n}\n}\n```\n\n\
    The code in if statement checks whether the pressed key is 1, 2 or 3. Checking\
    \ for input in every frame this is known as polling. If one of those number is\
    \ hit, the appropriate block calls loadWeapon() and passes the appropriate weapon\
    \ to activate. It then sets activeWeaponType as a static. This makes it easy for\
    \ other scripts to query which gun the player has equipped themselves with.\n\n\
    Finally add the following convenience method:\n\n```\npublic GameObject GetActiveWeapon()\n\
    {\nreturn activeGun;\n}\n```"
