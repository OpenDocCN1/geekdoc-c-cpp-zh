  md: '# Raycasting


    At this point, you can fire a weapon and push the alien around. Unfortunately,
    our hero still can''t turn. Considering that these aliens love to chew on back
    hair (they are truly alien), the space marine needs to duck, spin and weave.


    During gameplay, you also want the marine to shoot in the direction of the mouse
    pointer. Seems simple enough, right?


    Fundamentally, it''s a tricky problem; the game exists in 3D space but the mouse
    exists in 2D.


    The solution is to convert the mouse pointer to 3D space, then determine where
    it''s pointing. It sounds like a complicated process, but it''s quite easy with
    raycasting.


    Raycasting shoots an invisible ray from a target to a destination, and sends a
    notification when it hits a GameObject. You''ll likely encounter a lot of GameObjects
    that intersect with a ray. Using a mask lets you filter out unwanted objects.


    Raycasts are incredibly useful and serve a variety of purposes. They''re commonly
    used to test if another player was struck by a projectile, but they can help you
    test if there''s geometry underneath a mouse pointer, as you''ll see.


    The following image shows a raycast from a cube to a cone. Since the ray has a
    cone mask on it, it ignores the iconsphere layer and reports a hit to the cone.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_120_0.png)


    You''ll cast a ray from the camera to the mouse pointer. Then the space marine
    will turn to wherever the ray hits, essentially following the mouse.


    Open PlayerController.cs and add the following instance variables:


    ```

    public LayerMask layerMask;

    private Vector3 currentLookTarget = Vector3.zero;

    ```'
