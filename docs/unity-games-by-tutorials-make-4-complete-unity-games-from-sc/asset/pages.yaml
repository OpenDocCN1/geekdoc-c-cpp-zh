- pgno: 458
  md: '# A sneaky, hidden problem


    Something has happened here that is not obvious, but *will cause problems later
    on.*


    Switch the Viewport Shading to **Solid** to see one indication of the problem.
    See how the arm that was flipped a darker gray?


    When you flipped the object, Blender did so by using a scale transformation for
    the X axis of -1. When that object was joined with other objects that did not
    have scale factor, that flipped the faces outside.


    In a game engine, a polygon will only display when you look at it from one side.
    The direction a polygon is facing is called its **Normal**. When the geometry
    was mirrored, the normals got flipped, too.


    This is an easy way to miss because it''s not always obvious — until you get the
    model into Unity.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_458_0.png)


    It''s a bit hard to see unless you can actually rotate around it, but what you''re
    seeing here is the *inside of* the mesh faces with that arm.


    Back in Blender, there''s an easy way to check the normals on a model.


    In the 3D View, press **Tab** to enter Edit mode, then press N to toggle the Properties
    shelf, if it''s not already open.


    Scroll down to the **Mesh Display** section, and click the **Display face normals
    as lines** button. Increase the **Size** to 0.4, to make the lines more noticeable.'
  merge: -1
  img_proc: true
- pgno: 459
  md: 'Unity Games by Tutorials


    Chapter 16: Texturing With Blender


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_459_0.png)


    As you can see, toggling the display of the face normals makes it easy to tell
    which ones are facing the right way.


    Fortunately, it’s easy to fix. Select one of the culprit faces and press **L**
    to Select Linked. In the menu bar at the bottom of the 3D View, select **Mesh
    ▸ Normals ▸ Flip Normals**. Press **Tab** to return to Object mode.


    > Reminder: Don’t forget to save (Ctrl-S).


    raywenderlich.com


