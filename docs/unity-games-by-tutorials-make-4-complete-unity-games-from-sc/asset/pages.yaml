  md: 'This looks almost the same as the code you added to the Pistol script, there''s
    one key difference: Instead of GetMouseButtonDown, this script uses GetMouseButton
    to see if the player is holding down the left mouse button to auto-fire.


    Save and switch back Unity. Set the fireRate of the AssaultRifle to 0.1.


    With the firing in place, you now need to apply your animations. You''ll write
    the actual firing code itself soon.


    # Working with animation states


    Now to add the animation. If you''ve jumped directly to this chapter without reading
    any of the others or you still feel shaky Unity''s animation in general, then
    definitely read Chapter 6, "Animation."


    Right-click on the Animations folder, select Create ▶ Animator Controller and
    name it Pistol. Right-click on your new AnimatorController and click open to bring
    up the Animator window.


    Right-click in the grid area and select Create State ▶ Empty. Click on the new
    state and, in the Inspector, rename it to Fire. Click on the control to the right
    of the Motion box and enter Fire in the Search pop-up. Find Assets ▶ Models RobotRampage_Pistol.fbx
    in the list and double-click it.


    | Default Take |

    | Grip|Fire |

    | Grip |Fire |

    | Grip|Fire |

    | Grip Fire (Animation Clip) Assets/Models/RobotRampage_Pistol.fbx |


    At this point, you have a controller with one job: To fire the gun.


    You need a default for this animation. In the Animator window, create another
    empty state as you did above and name it Base.


    Right-click Fire, then click Make Transition. Drag from Fire to Base.'
