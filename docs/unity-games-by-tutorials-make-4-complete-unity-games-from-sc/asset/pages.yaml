    # Signing your app


    Believe it or not, you still have more configuring to do! Even though you''ve
    enabled developer mode from the Oculus app, you still need to sign your apps.
    Frankly, this particular signing process is very easy. To get your certificate,
    head over to the OSIG Generator. You can find it here: https://dashboard.oculus.com/tools/osig-generator/


    Once you fill out the information about your headset, you''ll be provided with
    your certificate. You need to add it to your Project. In your Project browser,
    add the certificate to the following location (case sensitive): **Assets > Plugins
    > Android > assets/


