- pgno: 555
  md: '# Unity Games by Tutorials


    The variable enemyHealthBars holds a reference to the parent EnemyHealthBars and
    enemyHealthBarPrefab stores a reference to the Health Bar prefab so new ones can
    be spawned.


    Now, add this method underneath ShowLoseScreen() for the actual making of the
    health bar:


    ```

    //1

    public void CreateHealthBarForEnemy(Enemy enemy)

    {

    //2

    GameObject healthBar = Instantiate(enemyHealthBarPrefab);

    //3

    healthBar.transform.SetParent(enemyHealthBars, false);

    //4

    healthBar.GetComponent<EnemyHealthBar>().enemy = enemy;

    }

    ```


    Going over the above method:


    +   1. CreateHealthBarForEnemy accepts the enemy that needs a health bar as its
    parameter.


    +   2. Create a new health bar.


    +   3. Parent the new health bar to EnemyHealthBars.


    +   4. Pass the enemy reference to the health bar.


    Save this script and open up the EnemyManager script located in the Scripts >
    Game Enemy folder. Add this line to the bottom of the RegisterEnemy() method:
    UIManager.Instance.CreateHealthBarForEnemy(enemy);


    This will create a new Health Bar for each enemy that spawns. Save this script
    and return to Unity.


    Select the UIManager and drag Screen Canvas -> EnemyHealthBars from the Hierarchy
    to the Enemy Bars prefab. Then drag the Prefab -> UI -> Health Bar from the Project
    panel to the Enemy Bars prefab field.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_555_0.png)


    raywendlicher.com


    556'
