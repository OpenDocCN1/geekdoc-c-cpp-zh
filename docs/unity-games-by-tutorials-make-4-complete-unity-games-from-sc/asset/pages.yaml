- pgno: 125
  md: '# # Chapter 5: Managers and Pathfinder

    By Brian Moakley


    **Bobblehead Wars** is coming along handsomely! At this point, you have a feisty
    space marine who can turn, shoot and gun down aliens. Also, through the use of
    a hinge joint, his head can wobble back and forth so he can do in in.


    Nevertheless, *Bobblehead Wars* isn''t ready for release. First, there is just
    one alien when the space marine was expecting a horde. Second, the alien currently
    isn''t that scary

    — he just stands around!


    To fix this, you''ll learn how spawn enemies over time and make them chase after
    the space marine, through the power of the GameManager and pathfinding. Let the
    battle

    begin!


    # ## Introducing the game manager


    Unity refers to an object that handles a specific subsystem as a **manager**.
    Given your experience in the workplace, you might think this means they do nothing
    and leave all the work for their underlings, in Unity managers actually give a
    hand. ;


    For instance, an InputManager is an object that lets you adjust all the controls
    for your game. There''s also a SettingsManager that handles all your project settings,
    and a NetworkManager for managing the state of a networked game.


    In this chapter, you''ll create your own kind of manager. Specifically, you''ll
    create a manager so that you can easily tweak your game setting while it''s being
    played. This will make it much easier to balance your game during play testing.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Imagine you''re playing and there are just too many enemies. The space marine
    has no chance. You could make an adjustment to your game manager to dial back
    the aliens hordes in real time.


    Remember, any changes you make while your game is played will be lost, right?
    There''s an exception to this rule that you''ll try out in this chapter.


    # Creating the game manager


    Open your project from Chapter 4, "Physics." If you need to start fresh, please
    find the starter project that''s included with the resources for this chapter.


    In the Hierarchy, click the **Create** button, select **Create Empty** from the
    drop-down name it **GameManager**.


    Congratulations! You''ve made your game manager. That''s all it for this chapter.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_126_0.png)


    Ok, ok, you''re right. That wasn''t very nice. You have *much* more to do. : ]


    Unity doesn''t provide a "stock" game manager component — it would be silly because
    each game is unique. You need to write your own.


    Select the **GameManager** in the Hierarchy and click the **Add Component** button
    in the Inspector. Pick **New Script**, name it **GameManager** then click **Create
    and Add.**'
