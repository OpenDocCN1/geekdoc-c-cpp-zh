  md: "# Unity Games by Tutorials\n\nOpen GameManager in your code editor, and add\
    \ the following before any of the existing code in Update():\n\n```\nif (player\
    \ == null) {\n  return;\n}\n```\n\nIf there's no player, the GameManager won't\
    \ spawn enemies. Save and switch to Unity.\n\nPlay your game and charge the aliens.\
    \ After a bit of time, the marine successfully loses that head. Why is the marine's\
    \ body still standing around?\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_219_0.png)\n\
    \nThis strange behavior is due to gravity and scaling. The typical gravity level\
    \ is set to -9.81. If you scaled the models to one meter per unit, then they'd\
    \ play well with gravity. However, your models are somewhat larger. You can fix\
    \ this by scaling down the models or scaling up the gravity—you will scale the\
    \ gravity in this book.\n\nClick Edit > Project Settings Physics and set Gravity\
    \ to (0, -900, 0).\n\n| Gravity | X:0 | Y:-900 | Z:0 |\n|---|---|---||\n| Default\
    \ Material | None (Physics Material) | | |\n| Bounce Threshold | 2 | | |\n| Sleep\
    \ Threshold | 0.005 | | |\n| Default Contact Offs | 0.01 | | |\n\nNow the player's\
    \ death makes both the head and body fall like you'd see in a episode of Game\
    \ of Thrones."
