- pgno: 348
  md: 'Unity has a Resources class that lets you access assets in your project via
    code — any assets placed in a sub-folder of the Assets folder bears the name Resources
    can be accessed via Resources.Load() methods.


    You''re exploring the Resources class now because you''ll create your own code
    for saving and loading that''ll let you save a new level to a JSON file. This
    file will keep references to items used to create the level, e.g., blocks and
    hazards.


    It''s impractical to add public fields for every prefab used in a level. The JSON
    file will call the Resources.Load() methods to find the referenced objects by
    name.


