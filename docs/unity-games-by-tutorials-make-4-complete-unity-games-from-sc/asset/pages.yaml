- pgno: 380
  md: "# # Adding a simple level timer\n\nNext up, you'll hook up a simple timer script\
    \ that will time your level runs. The timer will just be used as a reference for\
    \ how long you take to do level runs. Later in Chapter 14, \"Saving Data,\" you'll\
    \ extend it to add more functionality to the game.\n\nCreate a new C# script in\
    \ the Scripts folder, called Timer. Open the script for editing.\nAdd the following\
    \ statement to the top of the script:\n\n```\nusing UnityEngine.UI;\n```\n\nNow,\
    \ replace the Start() and Update() methods with the following:\n\n```\nprivate\
    \ Text timerText;\n\nvoid Awake()\n{\n    timerText = GetComponent<Text>();\n\
    }\n\nvoid Update()\n{\n    timerText.text = System.Math.Round((decimal)Time.timeSinceLevelLoad,\
    \ 2).ToString();\n}\n```\n\nThis code will cache a reference to the Text component\
    \ on the same GameObject it exists on. In the Update() loop, the text will be\
    \ changed to display the time since the level last re, rounded to two decimal\
    \ places. Nice and simple!\n\nSave the script and return to Unity.\n\nAttach the\
    \ Timer.cs script to the Timer GameObject, which is nested under the Canvas GameObject.\n\
    \nRun the game, and you'll see the timer counting over the time each time the\
    \ level starts or restarts.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_380_0.png)"
