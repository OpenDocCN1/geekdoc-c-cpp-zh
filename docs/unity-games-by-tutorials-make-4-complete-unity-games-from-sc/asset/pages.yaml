  img_proc: true
- pgno: 345
  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_345_0.png)


    Arranging sprites is also similar to working with layers when you''re editing
    photos.


    Unity uses the order to sort sprite visibility first. Within each layer, it sorts
    sprites further with an order number as 0, 1, 2 and so on, with 0 being the very
    bottom sub-layer.


    Unity places new sprites on the Default Sorting Layer with an Order in Layer number
    of 0. If you set a stack of sprites in the same location but''t change this, then
    you''ll get a little rendering density. Because they''re sharing the same layer
    and order, some sprites might be hidden while others randomly appear and disappear.


    It''s a best practice to define custom Sorting Layer names and assign sprites
    to the right orders as you create them.


    Navigate to Edit > Project Settings > Tags and Layers to bring up the Tags and
    Layers editor in the Inspector.


    Expand the Sorting Layers node. Click the + button three times to add three Sorting
    Layers. Name them Background, Hazards and Foreground.


    The order in which layers appear in this editor determines their render order.
    Use the handles icons to the left of each layer to drag and re-order so they match
    the image below:


    | Tags | |

    |---|---|

    | Sorting Layers | Default |

    | Layer | Default |

    | Layer | Background |

    | Layer | Hazards |

    | Layer | Foreground |

    | Layer | UI |'
  merge: -1
