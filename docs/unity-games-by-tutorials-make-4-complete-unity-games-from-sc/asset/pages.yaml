    \n# Building game hazards\n\nNo platform style game is complete without hazards\
    \ that can hurt the player. In this section you'll be making a saw blade hazard\
    \ that has the ability to chop Super Soy up into minced soy!\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_370_1.png)\n\
    \nStart by creating a new C# Script in the Scripts folder and naming it Hazard.\n\
    \nLocate the Buzzsaw sprite GameObject in the Scene view, and select it.\n\nClick\
