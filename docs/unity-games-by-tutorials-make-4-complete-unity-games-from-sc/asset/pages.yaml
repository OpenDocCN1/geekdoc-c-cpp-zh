- pgno: 61
  md: '# Fixing the models


    The next-to-do is fixing some of your models. In this case, Unity imported your
    models lost references to the textures. You''ll fix this by adding a texture to
    a material.


    In Unity, a material is a texture with a program attached to it, known as a shader.
    You can write your own shaders, which is beyond the scope of this book. A shader
    determines how a texture will look. For instance, you could write a shader to
    make a stone texture look gritty or a metal texture appear glossy. Thankfully,
    Unity comes with its shaders to do that for you.


    In the **Models** folder of your Project Browser, drag a **BobbleArena-Column**
    into the Scene view. You''ll find a dull white material.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_61_0.png)


    If a material name or texture name changes in the source package, Unity will lose
    connection to that material. It tries to fix this by creating a new material for
    you but with no textures attached to it.


    To fix this, you have to assign a new texture to the material. In the Project
    Browser, select the **Models** subfolder and then, expand the **BobbleArena-Column**
    to see all the child objects.'
  merge: -1
  img_proc: true
