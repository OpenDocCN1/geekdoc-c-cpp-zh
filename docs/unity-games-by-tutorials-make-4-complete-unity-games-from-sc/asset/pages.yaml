    # # Importing Assets


    Now that you''ve organized your folders, you''re ready to import the assets for
    the game.

    First, you''ll import the star of this chapter: the space marine.


    In the folder for this chapter, open the **resources** folder and look for three
    files:


    +   1. **BobbleMarine-Head.fbx**

    2. **BobbleMarine-Body.fbx**

    3. **Bobble Wars Marine texture.psd**


    Drag these three files into the Models folder. Don''t copy BobbleWars.unitypackage;
    that comes later.


    > **What is an FBX file?** FBX files typically contain 3D models, but they can
    also include textures and animations. 3D programs, such as Maya and Blender, allow
    you to export your models for import into programs such as Unity using this file
    format.


    Select the **Models** folder and you''ll see that you have a bunch of new files.
    Unity imported and configured the models for you.


    raywenderlich.com


    37'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Unity Games by Tutorials


    # Chapter 1: Hello Unity


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_37_0.png)


    Keep things tidy, move Bobble Wars Marine texture from the Models folder to the
    Textures folder. Textures are the basis of Materials.


    What are materials, do you ask? Materials provide your models with color and texture
    based upon lighting conditions. Materials are what we know as shaders that ultimately
    determine what appears on screen. Shaders are small programs written in a specific
    shader language which is far beyond the scope of this intro book. You can learn
    more about materials through Unity’s included documentation.


    Switch back to the Models folder and select BobbleMarine-Body. The Inspector will
    now display information specific to that model, as well as a preview.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_37_1.png)


    If you see no preview, then your window is closed. At the bottom of the Inspector,
    find a gray bar then drag it upwards with your mouse to expand the preview.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_38_0.png)


    The Inspector allows you to make changes to the model''s configuration, and it
    allows changes to any selected object''s properties. Since objects can be vastly
    different from one another, the Inspector will change context based on the object
    selected.


    # Installing Blender


    At this point, you''ve imported the models and texture for the space marine. The
    models were in FBX format, and the texture was in .PSD format.


    We supplied the space marine models to you in the .FBX format, as this is a popular
    format for artists to deliver assets. But there''s another popular format you
    should understand how to use it as well: Blender files.


    Unlike .FBX, Blender files contain the source model data. This means you can actually
    edit these files inside Blender, and the changes will immediately take effect
    in Unity, unlike an .FBX file.


    With an .FBX, you''d need to export and re-import the model into Unity every time
    you changed it.


    There is a small tradeoff for all this delicious functionality. For Unity to work
    with Blender files, you need Blender installed on your computer. Blender is free,
    and you''ll be happy to know that you''ll use it to make your own models in a
    few chapters.


    Download and install Blender at the following URL: https://www.blender.org/download/'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# # Creative Freedom Starts Here


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_39_0.png)


    **Note:** Blender evolves at a rapid pace, so the version you see on your desktop
    will probably be different than this screenshot.


    After you install Blender, run the app and then quit. That''s it — you can now
    use Blender files with Unity.


    # ## Importing packages


    Now that you''ve installed Blender, you can now import the rest of the assets.


    The rest of the assets are combined into a single bundle called a **Unity package**.
    This is a common way that artists deliver assets for Unity, especially when they
