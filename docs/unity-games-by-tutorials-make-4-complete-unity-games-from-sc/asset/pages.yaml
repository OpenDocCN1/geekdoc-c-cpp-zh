- pgno: 573
  md: '# Unity Games by Tutorials


    # Chapter 20: Virtual Reality


    fill out some information about your company. Once saved, you must return to the
    Oculus app on your phone. You''ll notice that developer mode is still not enabled.
    Tap the button again since you''ve created a developer account on the developer
    site, developer mode will become enabled.


    Before you can play, you need to make a few adjustments. First, open the Build
    Settings and make sure your Unity project is using the Android platform. From
    the Build Settings menu, change Texture Compression to ASTC.


    Next, click the Player Settings button and select the Android tab. First, you
    need to indicate that your game supports VR and you also need to select a VR SDK.
    You can find this in XR Settings. Simply click the Virtual Reality Supported checkbox
    and click the plus sign under Virtual Reality SDKs. Make sure to select Oculus
    as the SDK:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_573_0.png)


    Now, for the Quality Settings. From the menu, select Edit\Project Settings\Quality.
    Oculus suggests the following settings:


    Pixel Light Count: 1


    Texture Quality: Full Res


    Anisotropic Textures: Per Texture


    Anti-Aliasing: 2x Multi Sampling


    raywendlich.com


