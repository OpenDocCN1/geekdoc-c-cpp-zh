- pgno: 393
  md: "# Unity Games by Tutorials\n\nLastly, you need a trigger to display any previous\
    \ runtimes for the level. In GameManager.cs, add the following to the bottom of\
    \ the GameManager class:\n\n```\nprivate void OnSceneLoaded(Scene scene, LoadSceneMode\
    \ loadsceneMode) {\n  if (scene.name == \"Game\") {\n    DisplayPreviousTimes();\n\
    \  }\n}\n```\n\nThe code checks to if the scene is the Game, and if so, displays\
    \ the previous times. Next, add this to the Start() method:\n\n+   - SceneManager.sceneLoaded\
    \ += OnSceneLoaded;\n\nThat line hooks up OnSceneLoaded() to a Unity SceneManager\
    \ event named sceneLoaded that fires when a scene loads. OnSceneLoaded() checks\
    \ the name of the scene. It calls DisplayPreviousTimes() when the result is the\
    \ Game scene.\n\nSave your changes and run the game.\n\nPlay to the end of the\
    \ level. Now when you dive into that bowl of noodles, a.k.a. the goal sprite,\
    \ you'll trigger the save method.\n\nWhen the level restarts, the three fastest\
    \ times show up because the game calls DisplayPreviousTimes(), reads the saved\
    \ times file and feeds the results into the PreviousTimes text component. If you\
    \ haven't yet played through three times, then it'll take a couple of extra tries\
    \ before all three times show up. Success!\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_393_0.png)\n\
    \n# Basic unity JSON serialization usage\n\nUnity's JSON serialization provides\
    \ a super easy way to save and load game data and from the JSON text format."
  merge: -1
