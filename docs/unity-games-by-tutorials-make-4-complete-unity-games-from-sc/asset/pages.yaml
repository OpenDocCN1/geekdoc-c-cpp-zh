    # # Managing Input


    Inputs are the game''s controls, and if you''re developing a game for a desktop
    computer, your users will expect the ability to rebind keys. Unity''s Input Manager
    makes this easy, and is the preferred way for your game to deal with user input.


    To get access to the Input Manager, click Edit.Project Settings\Input.**


    The Inspector will look pretty empty. Click the disclosure triangle next to the
    word Axes.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_80_1.png)


    Once expanded, you''ll see all the pre-configured inputs that are available to
    you.'
