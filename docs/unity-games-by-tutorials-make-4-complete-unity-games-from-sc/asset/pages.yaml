- pgno: 375
  md: "# # Adding sound to the game\n\nA game featuring relentless running, jumping,\
    \ and bouncing around off of walls requires a high-energy retro music backing\
    \ track. Luckily for you, the starter project includes just one of those to get\
    \ you!\n\nYou'll loop the track to provide level music for Super Soy Boy. Looping\
    \ a single music track is perfectly simple with Unity.\n\nCreate a new GameObject\
    \ called Music in the Scene Hierarchy, and add an Audio Source component to it.\n\
    \nFrom the Sound fender, drag and drop the supersboy.ogg audio clip to the AudioClip\
    \ field in the Music Audio Source component. Enable the Loop property and adjust\
    \ the Volume property down to 0.45.\n\nNow you'll hook up some SFX to Super Soy\
    \ Boy.\n\nOpen SoyBoyController.cs in your code editor, and at the top of the\
    \ script, add the following variables:\n\n```\npublic AudioClip runClip;\npublic\
    \ AudioClip jumpClip;\npublic AudioClip slideClip;\nprivate AudioSource audioSource;\n\
    ```\n\nYou should cache a reference to the AudioSource component on start, so\
    \ in the Awake() method, add:\n\n```\naudioSource = GetComponent<AudioSource>();\n\
    ```\n\nWhen playing sound effects, especially from locations like the game Update()\
    \ method, you'll want to ensure they are not already playing, otherwise you could\
    \ end up with sound loops playing over each other.\n\nTo do this, you'll create\
    \ a method that can pass the audio clip you wish to be played.\n\nAdd this method\
    \ to the SoyBoyController.cs script:\n\n```\nvoid PlayAudioClip(AudioClip clip)\n\
    {\n    if (audioSource != null && clip != null)\n    {\n        if (!audioSource.isPlaying)\
    \ audioSource.PlayOneShot(clip);\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 376
  md: "This checks that the audioSource and clip to be playing are valid, and also\
    \ ensures the Audio Source component is not already playing a clip before the\
    \ new clip.\n\nIn the Update() method, change the if statement that checks if\
    \ the player is on the ground and not jumping to look like this:\n\n```\nif (PlayerIsOnGround()\
    \ && !isJumping)\n    if (input.y > 0f)\n        isJumping = true;\n        PlayAudioClip(jumpClip);\n\
    \    animator.SetBool(\"OnWall\", false);\n    if (input.x < 0f || input.x > 0f)\n\
    \        PlayAudioClip(runClip);\n```\n\nNote that the addition of two calls to\
    \ the PlayAudioClip() method you added previously. One plays the jumpClip and\
    \ one plays the runClip.\n\nMoveover to the FixedUpdate() method, and locate the\
    \ section that sets the various Boolean parameters for the animator, right near\
    \ the bottom.\n\nModify this section to add two more calls to PlayAudioClip()\
    \ for the jump and slide clips. This is how it should show now:\n\n```\nif (IsWallToRight()\
    \ && !PlayerIsOnGround())\n&& input.y == 1)\n{\n    rb.velocity = new Vector2(-GetWallDirection()\
    \ * speed\n    * 0.75f, rb.velocity.y);\n    animator.SetBool(\"OnWall\", false);\n\
    \    animator.SetBool(\"IsJumping\", true);\n    PlayAudioClip(jumpClip);\n} else\
    \ if (!IsWallToLeft())\n{\n    animator.SetBool(\"OnWall\", false);\n    animator.SetBool(\"\
    IsJumping\", true);\n} if (IsWallToRight() && !PlayerIsOnGround())\n{\n    animator.SetBool(\"\
    OnWall\", true);\n    PlayAudioClip(slideClip);\n}\n```\n\nLastly, you'll need\
    \ to assign the three new audio clips to the SoyBoyController script on SoyBoy.\
    \ Save your changes and switch back to Unity."
  merge: -1
