    # # Activating particles in code


    Unity allows for all sorts of adjustments to particle systems in code. In your
    case, just need to know if the particle system is running or not.


    In the Project view, select the Scripts folder and click the Create button. Choose
    C# Script and name it DeathParticles. Open the script in your editor.


    Add the following instance variables:


    ```

    private ParticleSystem deathParticles;

    bool didStart = false;

    ```


    deathParticles refers to the current particle system and didStart lets you know
    the particle system has started to play.


    raywenderlich.com


    229'
