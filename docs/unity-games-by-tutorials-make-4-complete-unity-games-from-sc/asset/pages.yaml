- pgno: 139
  md: '# Chapter 5: Managers and Pathfinding


    The Agent Type is currently set to Humanoid. When working with dynamic NavMeshes,
    you can also have dynamic agent types. For our game, we''ll use a fixed type.


    The Base offset is the difference between the center of the agent and the center
    of the GameObject. Since the two are the same, leave it at 0.


    Underneath that section, you''ll notice an Obstacle Avoidance section. Set Radius
    to 1.45 and Height to 6.2.


    Quality determines how the path will be defined. At the highest quality, the path
    will be determined according to obstacles and other agents. At the lowest quality
    — none — the path will ignore agents and merely try to avoid immediate collisions.


    Since there are many agents in play, set the Quality to Low Quality to reduce
    CPU time for calculating the paths.


    You can see visual representations of these figures in the Scene view where a
    green cylinder defines the agent''s bounds.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_139_0.png)


    At this point, you''ve configured the NavMesh Agent, and this new component will
    drive your GameObject. However, there''s a Rigididbody attached. Since the Rigidbody
    won''t be controlled by physics, check the Is Kinematic checkbox.


    Now you need to set the agent''s goal. Click the Add Component button then click
    New Script and name it Alien. Open it in your code editor.'
