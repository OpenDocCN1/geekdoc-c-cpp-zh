- pgno: 508
  md: "Open up the Enemy script in the Scripts > Game > Enemy folder and add these\
    \ methods underneath Die():\n\n```\nvoid Update()\\{\n    // /1\n    if (waypointIndex\
    \ < WaypointManager.Instance.Paths[pathIndex].WayPoints.Count)\n    {\n      \
    \  UpdateMovement();\n    } else {\n        // /2\n        OnToGoLastWaypoint();\n\
    \    }\n}\n\nprivate void UpdateMovement()\n{\n    // /3\n    Vector3 targetPosition\
    \ = WaypointManager.Instance.Paths[pathIndex]\n        .WayPoints[waypointIndex].position;\n\
    \    // /4\n    transform.position = Vector3.MoveTowards(\n        transform.position,\
    \ targetPosition,\n        moveSpeed * Time.deltaTime);\n    // /5\n    transform.LookAt(targetPosition);\n\
    \    // /6\n    if (Vector3.Distance(transform.position, targetPosition) < .1f)\n\
    \    {\n        waypointIndex++;\n    }\n}\n```\n\nTaking each commented section\
    \ in turn:\n\n+   1. While there's still waypoints left, update the movement.\n\
    \n+   2. No more waypoints, so call OnToGoLastWaypoint().\n\n+   3. The next waypoint\
    \ is the target position.\n\n+   4. Move towards the target position.\n\n+   5.\
    \ Look at the target.\n\n+   6. If the enemy is very close to the target waypoint,\
    \ set the next waypoint as the target. You can't just use if(transform.position\
    \ == targetPosition) because that will often fails due to floating point error.\
    \ Floats are not accurate enough to do exact comparisons.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_508_0.png)"
  merge: -1
