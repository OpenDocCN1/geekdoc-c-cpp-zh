    \            pickupAssaultRifleAmmo();\n            break;\n        case Constants.PickUpPistolAmmo:\n\
    \            pickupPistolAmmo();\n            break;\n        case Constants.PickUpShotgunAmmo:\n\
    \    }\n\n```"
