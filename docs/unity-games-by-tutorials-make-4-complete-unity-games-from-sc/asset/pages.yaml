    # Where to go from here?


    Congratulations! You''ve learned how to rig a character and create animations
    in Blender. I hope you had fun, and can see the potential for all kinds of character
    animations and object movement that you can use in your games.


    In this chapter, you''ve learned:


    +   - How to rig a model using bones.


    +   - How to apply a mesh to rig so that it moves when the bones move.


    +   - How to use Inverse Kinematics to make animations easier and more natural.


    +   - How to use Pole Targets to aim a bone at specified object.


    +   - How to animate an armature using keyframes and the Dope Sheet


    +   - How to adjust animation twe to create smooth or sharp animations using the
    Graph editor.


    +   - How to create multiple animations for a single armature using Actions, for
    use in Unity.


    Try creating a separate Tail Smash Action, where the tail takes a swing and smashes
    to the ground — or a Victory Dance Action using the arms.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_495_0.png)


