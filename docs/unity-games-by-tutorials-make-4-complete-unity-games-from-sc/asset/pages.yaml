- pgno: 516
  md: "Here's the play-by-play:\n\n+   1. Just like the WaypointManager, this class\
    \ also uses the singleton pattern to make itself everywhere using this variable.\n\
    \n+   2. The list of enemy waves that'll be spawned by this class.\n\n+   3. This\
    \ keeps track of how much time has passed since the level started in seconds.\n\
    \n+   4. The wave that's currently spawning enemies.\n\n+   5. This keeps track\
    \ of when the last wave spawned. It gets reset to 0 with every spawn, and is incremented\
    \ in every frame while a wave is spawning.\n\n+   6. A list of waves that were\
    \ already started. Any waves in here won't start again.\n\nUnder the variable\
    \ declarations you just added, add these methods:\n\n```\n//1\nvoid Awake()\n\
    {\n    Instance = this;\n}\n//2\nvoid Update()\n{\n    elapsedTime += Time.deltaTime;\n\
    \n    SearchForWave();\n    UpdateActiveWave();\n}\nprivate void SearchForWave()\n\
    {\n    //3\n    foreach (EnemyWave enemyWave in enemyWaves)\n    {\n        //4\n\
    \        if (!activatedWaves.Contains(enemyWave))\n            && enemyWave.startSpawnTimeInSeconds\
    \ <= elapsedTime\n        {\n            //5\n            activeWave = enemyWave;\n\
    \            activatedWaves.Add(enemyWave);\n            spawnCounter = 0f;\n\
    \            //6\n            break;\n        }\n    }\n}\n//7\nprivate void UpdateActiveWave()\n\
    {\n}\n```"
