  md: '# Duplicating the axle for the back wheels


    Start by moving the existing axle.


    +   1. Select the axle and wheels using the Shift key. Move them by typing G Y
    1.3 and pressing Enter.


    +   2. There''s another to duplicate an object called Duplicate Linked. This creates
    a copy of the object — which can be moved, rotated and scaled — that shares the
    same mesh as the original. Changes to one mesh will be made to both objects. This
    will come in handy in the next chapter, Chapter 16, “Texturing with Blender,”
    where you apply color to the mesh; colors applied to one object will be applied
    to both. Create a linked duplicate, and move the axle by typing Alt-D Y -2.6 and
    pressing Enter.


