    );\n}\n\n// 4\nEnumerator hidePickupText()\n{\n    yield return new WaitForSeconds(4);\n\
    \    pickupText.GetComponent<Text>().enabled = false;\n}\n\n// 5\npublic void\
    \ showNewWaveText()\n{\n    StartCoroutine(\"hideNewWaveText\");\n    newWaveText.GetComponent<Text>().enabled\
