- pgno: 100
  md: '# Unity Games by Tutorials


    # Chapter 4: Physics


    Unfortunately, the alien still falls through the floor. This is because there''s
    no collider for the floor — you need to create one for that as well.


    As mentioned, there are many colliders at your disposal and you''re not restricted
    to one. Any GameObject may have multiple colliders, giving you the ability to
    create complex shapes and reactions to collisions.


    You could add a bunch of colliders to the arena to approximate its shape, but
    the arena is quite complicated and that would take a lot of work. So, in this
    case, you use a mesh collider instead.


    A mesh collider creates the collider boundaries from an actual mesh object, i.e.,
    the geometry used to create the model. It''s a great option when you have a complicated
    model. The problem with mesh colliders is that they are "expensive" — it takes
    a lot of resources to maintain the collider and determine if it''s involved in
    collisions. In such cases, it helps to have a very low-poly collider.


    To create a low-poly collider, you just take the original model and strip it of
    extraneous detail until you''re down to the shape. Mike Berg, the artist for Bobblehead
    Wars, has done that for you.


    In the Hierarchy, expand the BobbleArena GameObject and select the World_Center
    GameObject. In the Inspector, click the Add Component button. Select Physics,
    and in the component listing, click Mesh Collider.


    | Mesh Collider | |

    | --- | --- |

    | Convex | |

    | Is Trigger | Mixed ... |

    | Material | None (Physical Material) |

    | Mesh | None (Mesh) |


    Find the BobbleArena-Collider in the Models folder, expand it by clicking the
    disclosure triangle, and drag the Inner_Octagon mesh to the collider''s Mesh property.'
