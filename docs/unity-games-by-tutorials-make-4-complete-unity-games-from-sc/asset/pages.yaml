  md: '```

    //5

    public List<GameObject> listOfEnemies = new List<GameObject>();

    }

    ```


    This is a simple class that will be used as data container to make it easy to
    add waves in the Unity editor. Here''s what happening inside:


    +   1. The [Serializable] attribute makes sure this class is serialized so that
    it can be seen and edited in the editor when used by a MonoBehaviour.


    +   2. The index of the path this wave should take.


    +   3. Time in seconds before this wave starts.


    +   4. Delay in seconds between each spawn.


    +   5. The list of enemies in this wave.


    Now that you have a representation of a wave in code, you can make a manager script
    that will use this data to spawn the enemies in the world.


    Save the EnemyWave script and return it to the editor. In the same folder as EnemyWave,
    make a new C# Script and name it Wave Manager. Open in a code editor and remove
    both the Start() and Update() methods completely.


    The full script is quite large, but you''ll learn each aspect in parts. At the
    very top of the file, right under using UnityEngine; add this line:


    ```

    using System.Collections.Generic;

    ```


    This makes sure you can make List<> objects without errors.


    Under the class declaration add these variable declarations:


    ```

    //1

    public static WaveManager Instance;

    //2

    public List<EnemyWave> enemyWaves = new List<EnemyWave>();

    //3

    private float elapsedTime = 0f;

    //4

    private EnemyWave activeWave;

    //5

    private float spawnCounter = 0f;

    //6

    private List<EnemyWave> activatedWaves = new List<EnemyWave>();

    ```'
