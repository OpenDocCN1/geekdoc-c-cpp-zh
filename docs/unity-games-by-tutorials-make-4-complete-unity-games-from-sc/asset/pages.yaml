    # Getting started


    Open the starter project in Unity and make sure everything works correctly by
    playing the game. This is the finished project from Chapter 19, ‘Making Towers,’
    with two extra files added to the Textures folder — the icon:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_602_0.png)


