- pgno: 146
  md: "# Tuning the pathfinding\n\nAlthough the pathfinding appears to work without\
    \ any issue, you actually have a significant problem to solve. Every time you\
    \ assign a destination to a NavMeshAgent, Unity goes through the process of calculating\
    \ a route to that destination.\n\nIt wouldn't be a big deal if it happened here\
    \ and there, but consider that the game will spawn many aliens and perform this\
    \ calculation each time. Review your implementation with that fact in mind. You'll\
    \ see that you're calculating the pathfinding once per frame.\n\nThis isn't scalable\
    \ — there will be more pathfinding calculations when aliens spawn. Eventually,\
    \ your frame rate will tank and it'll kickoff a tragic chain of events for your\
    \ player.\n\nOpen Alien.cs in your code editor. Under the public variables, add\
    \ the following:\n\n```\npublic float navigationUpdate;\nprivate float navigationTime\
    \ = 0;\n```\n\nnavigationUpdate is the amount of time, in milliseconds, for when\
    \ the alien should update its path. navigationTime is a variable that tracks how\
    \ much time has passed since the previous update.\n\nIn Update(), replace agent.destination\
    \ = target.position with the following:\n\n```\nnavigationTime += Time.deltaTime;\n\
    if (navigationTime > navigationUpdate)\n{\n    agent.destination = target.position;\n\
    \    navigationTime = 0;\n}\n```\n\nThis code checks to see if a certain amount\
    \ of time has passed then updates the path.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_146_0.png)"
  merge: -1
  img_proc: true
- pgno: 147
  md: "Switch back to Unity. In the Project view, select the Alien prefab in the Prefabs\
    \ folder.\nIn the Alien set, set the Navigation Update field to 0.5.\n\nNow play\
    \ your game. You'll notice the aliens are a little slower to dial in on a marine\n\
    but, for the most part, they will get to him.\n\nAt this point, you'd want to\
    \ play around with the variables that affect play and\nperformance to find balance\
    \ point. Testing and profiling your game is the only way\nto find the right config!\n\
    \n# Final touches\n\nYou now have hordes of aliens chasing a marine. There's just\
    \ one thing left to be done\n— you need something to happen when the marine blows\
    \ them to bits.\n\nSwitch back to Alien.cs in your code editor and add the following\
    \ code before the last\nclosing brace:\n\n```\nvoid OnTriggerEnter(Collider other)\n\
    {\n  Destroy(gameObject);\n}\n```\n\nThis code works like a typical collision\
    \ code, except that it makes the collision event\nto a trigger. Why a trigger?\
    \ Remember, you set the alien's Rigidbody to In Kinematic,\nso the Rigidbody won't\
    \ respond to collision events because the navigation system is in\ncontrol.\n\n\
    That said, you can be informed when a Rigidbody crosses a collider through trigger\n\
    ev. That way, you can still respond to them. In this case, you call destroy()\
    \ and\npass in the gameobject, which will delete the alien instance. Save the\
    \ file and switch\nback to Unity.\n\nSelect the Alien in the Prefabs folder, and\
    \ in the Inspector, look for the Sphere\nCollider. Check the Is Trigger checkbox.\n\
    \nAt this point, anything that collides with the alien will kill it — walls, columns,\n\
    marine, etc. You need to opt out of some collisions.\n\nWith the Alien prefab\
    \ selected, assign it to the Alien layer. When prompted to\napply the layer to\
    \ all child objects as well, No, this object only. Next, in the\nProject browser,\
    \ select the BobbleArena-Column in the Prefabs folder. The alien head\nwill be\
    \ used in other physics calculations, so the layer is best used for just the parent\n\
    GameObject.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_147_0.png)"
