- pgno: 191
  md: '# Playing sounds


    In the Hierarchy, expand the SpaceMarine and select BobbleMarine-Body. In the
    Inspector, click the Add Component button, and select Audio Source from the Audio
    category.


    Next, double-click the Gun script to edit it and add the following instance variable:


    ```

    private AudioSource audioSource;

    ```


    Add the following to Start():


    ```

    audioSource = GetComponent<AudioSource>();

    ```


    This just gets a reference to the attached AudioSource — you''ll be using this
    lot. In fireBullet(), add the following PlayOneShot before the closing brace:


    ```

    audioSource.PlayOneShot(SoundManager.Instance.gunFire);

    ```


    This code plays the shooting sound.


    Note that there are two ways to play sound effects via code in Unity:


    +   - PlayOneShot(), as you''ve used here, allows the same sound to play multipiple
    at once, overlapping the sound. For example, the space marine could shoot one
    bullet, and while the sound effect for that was still playing, the space marine
    could quickly fire another bullet, and while you''d hear both sound effects at
    once. The space marines fires quickly, so this is what we want, here.

    - Play() only allows the sound effect to play a single time at once. If you play
    a sound effect, and then call Play() again, it will restart the sound, making
    the first effect sound like it was cut out. The advantage of Play() over PlayOneShot()
    is that Play() can be stopped in progress whereas PlayOneShot() cannot.


    Save the file and go back to Unity. Play your game and fire that gun to hear the
    shooting sounds.


    It''s sounding awesome, but it is a bit disappointing that you don''t hear the
    aliens die when you blast them away. So you will add the sound for the next.


    Note that you can''t make the alien play its own sound as you did for the bullet,
    because when an alien dies, you destroy the Alien GameObject. When you destroy
    a GameObject, any sounds playing on an AudioSource stop instantly.'
  merge: -1
  img_proc: true
- pgno: 192
  md: "So, instead, you'll make the GameManager play the death sounds. Although it's\
    \ tempting to use the SoundManager for all the sounds, so doing would narrow your\
    \ options. You'll learn more about this when you dive into the mixer.\n\nOpen\
    \ the SoundManager script in your code editor, and add the following method:\n\
    \n```\npublic void PlayOneShot(AudioClip clip)\n{\n    soundEffectAudio.PlayOneShot(clip);\n\
    }\n```\n\nThis is a simple wrapper to PlayOneShot().\n\nSave and close the SoundManager\
    \ script, then open the Alien script. In OnTriggerEnter(), add the following before\
    \ the closing brace:\n\n```\nSoundManager.Instance.PlayOneShot(SoundManager.Instance.alienDeath);\n\
    ```\n\nSave the script and head back to Unity. The play game and obliterate all\
    \ aliens.\n\n# Adding power-ups\n\nYou've made it pretty difficult for the space\
    \ marine. In Chapter 4, \"Physics,\" you added an excessive amount of aliens.\
    \ In Chapter 5, \"Pathfinding,\" you've taught the aliens how to chase the space\
    \ marine, out for blood.\n\nWorst of all, you've been making him work without\
    \ them music. Who does that? That's cruel!\n\nNow's a good time to give our hero\
    \ a boost — something to level the playing field. You'll create a power-up that'll\
    \ sound really cool and temporarily triple the rate of fire.\n\nFirst, you need\
    \ to create the triple-shot gun. Open the Gun script, and add the following under\
    \ the instance variables:\n\n```\npublic bool isUpgraded;\npublic float upgradeTime\
    \ = 10.0f;\nprivate float currentTime;\n```\n\n+   - isUpgraded is a flag that\
    \ lets the script know whether to fire one bullet or three.\n\n+   - upgradeTime\
    \ is how long the upgrade will last (in seconds).\n\n+   - currentTime keeps track\
    \ of how long it's been since the gun was upgraded."
  merge: -1
  img_proc: true
- pgno: 193
  md: "# Unity Games by Tutorials\n\nTake a look at fireBullet(). Note how it creates\
    \ each bullet on one line and sets its position on the following line. Instead\
    \ of copying these lines multiple times, you’ll refactor it into a method.\n\n\
    Add the following method:\n\n```\nprivate Rigidbody createBullet()\n{\n    GameObject\
    \ bullet = Instantiate(bulletPrefab) as GameObject;\n    bullet.transform.position\
    \ = launchPosition.position;\n    return bullet.GetComponent<Rigidbody>();\n}\n\
    ```\n\nAs you can see, this method simply encapsulates the bullet creation process.\
    \ It returns a Rigidbody after you create the bullet, all you need to do is set\
    \ its velocity.\n\nNext, replace fireBullet() with the following:\n\n```\nvoid\
    \ fireBullet()\n{\n    Rigidbody bullet = createBullet();\n    bullet.velocity\
    \ = transform.parent.forward * 100;\n}\n```\n\nThis code creates the bullet just\
    \ like the previous version of the script. Now add the following to modify how\
    \ upgraded gun bullets, before the final curve:\n\n```\nif (isUpgraded)\n    Rigidbody\
    \ bullet2 = createBullet();\n    bullet2.velocity =\n        (transform.right\
    \ + transform.forward / 0.5f) * 100;\n    Rigidbody bullet3 = createBullet();\n\
    \    bullet3.velocity =\n        ((transform.right * -1) + transform.forward /\
    \ 0.5f) * 100);\n```\n\nThis bit of code fires the next two bullets at angles.\
    \ It calculates the angle by the forward direction to either the right- or left-hand\
    \ direction and dividing in half. There is no explicit left property, you multiply\
    \ the value by -1 to negate it.\n\nNow, to integrate the sound. Add the following\
    \ before the closing brace:\n\n```\nif (isUpgraded)\n    audioSource.PlayOneShot(SoundManager.Instance.upgradedGunFire);\n\
    else\n    audioSource.PlayOneShot(SoundManager.Instance.gunFire);\n```\n\nraywenderlich.com\n\
    \n194"
  merge: -1
  img_proc: true
- pgno: 194
  md: "This provides the shooting gun. Now you can see how working with SoundManager\n\
    m playing sounds relatively easy.\n\nNext, you need a way to initiate the upgrade.\
    \ Add the following new method:\n\n```\npublic void UpgradeGun()\n{\n    isUpgraded\
    \ = true;\n    currentTime = 0;\n}\n```\n\nThis method lets the gun know it's\
    \ upgraded and sets the counter timer to zero.\n\n**Save** the file and switch\
    \ back to Unity. Since you're firing three bullets at once, there's a chance that\
    \ they'll collide with each other, so you need to disable bullet collisions. Do\
    \ you remember how to do this?\n\nClick **Edit Project Settings > Physics** and\
    \ scroll down to the collision matrix. In the **Bullet** column, **uncheck** the\
    \ **Bullet**.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_194_0.png)\n\nBelieve\
    \ it or not, you can test your power-up already, thanks to the power of live-editing\
    \ values in the Unity editor.\n\nPlay the game and select the **BobbleMarine-Body**.\
    \ In the Inspector, **check** the **Is Upgraded** checkbox and blast away!"
  merge: -1
  img_proc: true
- pgno: 195
  md: "![](img/fd5c2ca20ea33da76d2b61297cc57f6c_195_0.png)\n\n# A power-up pick-up\n\
    \nIt's great that you can test the power-up while debugging, but you need to add\
    \ a way for the space marine to get his awesome new gun without cheating.\n\n\
    But first, you need to make it so that the power-up expires. After all, our hero\
    \ will get spoiled if you leave it like this!\n\nTo do this, switch back to the\
    \ Gun script and add the following to Update():\n\n```\ncurrentTime += Time.deltaTime;\n\
    if (currentTime > upgradeTime && isUpgraded == true)\n{\n    isUpgraded = false;\n\
    }\n```\n\nThis increments the time. If the time is greater than the time the player\
    \ has been upgraded, this code takes the upgrade away.\n\nExcellent work! You've\
    \ successfully coded the powerup and just need to add it to your game. Save the\
    \ file and switch back to Unity.\n\nIn the Project view, open the Prefabs folder\
    \ and select the Pickup prefab. You'll see it has some configuration already.\n\
    \nClick the Add Component button and select New Script. Name it Upgrade and click\
    \ Create and Add."
  merge: -1
  img_proc: true
- pgno: 196
  md: "Open the script in your code editor. Replace the contents of the class with\
    \ the following:\n\n```\npublic Gun gun;\nnvoid OnTriggerEnter(Collider other)\n\
    {\n    gun.UpgradeGun();\n    Destroy(gameObject);\n    SoundManager.Instance.PlayOneShot(SoundManager.Instance.powerUpPickup);\n\
    }\n```\n\nWhen the player collides with the power-up, this sets the gun to Upgrade\
    \ mode, and then it will destroy itself (each pickup is good for one upgrade only).\
    \ Also, a sound plays when the player picks up the upgrade and switches back to\
    \ Unity.\n\n# Save\n\nSince the power-up should only be available to the space\
    \ marine, you will need to adjust the physics layers. Select the Pickup and the\
    \ Layer drop-down, set it to Upgrade. When prompted, select Yes, change children.\n\
