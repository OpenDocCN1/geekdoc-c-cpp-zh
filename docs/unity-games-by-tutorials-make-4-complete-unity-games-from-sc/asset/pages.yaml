- pgno: 590
  md: 'Try playing the scene again with the Vive on and you''ll notice the difference:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_590_0.png)


    You''re now a giant walking on the map! Walk around a bit and crouch to look up
    close at the enemies. Also, test out if the controllers are working properly.


    If the controllers aren''t moving, reboot the headset by the SteamVR Status app.
    If that doesn''t fix it, update to the latest version of SteamVR by deleting the
    SteamVR folder and importing a new package from the asset store.


    The next step is adding interaction with the world by putting down towers.


    # # Interacting with the world


    There are several ways of handling input in VR. But for Runestife,you''ll be using
    one of the controllers to point at the world and the UI to interact with it. The
    SteamVR plugin doesn''t come with such a system out of the box, so you''ll have
    to add it yourself.


    Start off by expanding the ViveRig in the Hierarchy so you can see its children.
    Select Controller (right). Right-click it, and select Camera to create a new camera
    as a child. Name it ControllerCamera.


    This camera wasn''t used to actually see through. It''s going to be used purely
    to firecasts into the scene so you can see and interact with colliders and UI
    elements.


    Change the camera''s Clear Flags to Solid Color, set its Depth to -5 and adjust
    your Target Eye to None (Main Display). Next, remove the Flare Layer, GUI Layer
    and Audio Listener components. This camera wasn''t used for rendering anything.
    It doesn''t need to listen to sounds or music either, so those components aren''t
    necessary.


    Finally, adding a Physics Raycaster component so it can send raycasts to 3D colliders.
    Do this in the Inspector panel by clicking Add Component and searching for it
    by name.'
  merge: -1
  img_proc: true
- pgno: 591
  md: 'Unity Games by Tutorials


    Create a new folder named VR in the Prefabs folder drag the ViveRig into it to
    make it into a prefab.


    The next thing to add is a method to know where the controller is pointing. You''ll
    do this through a combination of a 3D reticle and a laser to make it easy for
    the player:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_591_0.png)


    First up — the reticle in the Hierarchy. Create a new Sphere (3D Object ▸ Sphere)
    and name it Reticle. Reset its Transform, set its scale to (0.1, 0.1, 0.1) and
    remove the Sphere Collider component. Finally, drag the Reticle to the Prefabs
    ▸ VR folder to make it into a prefab.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_591_1.png)


    For the laser, create a new Cube (3D Object ▸ Cube) and name it Laser. Reset its
    Transform and adjust its scale to (0.01, 0.01, 0.1). Remove its Box Collider and
    set its Material to LaserMaterial, which is simply an unlit white material.


    raywenderlich.com


    592'
