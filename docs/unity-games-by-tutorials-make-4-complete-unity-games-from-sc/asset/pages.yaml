  md: 'Unity Games by Tutorials


    Chapter 16: Texturing With Blender


    # # The Material tab


    Open your scorpion model or you can open the scorpion starter project included
    with the Resources folder. Make sure you are in Object mode.


    +   1. Click the body of your model to select it. In the Properties panel on the
    right, click the Material tab, then click the New button.


    +   2. It''s good to get into the habit of naming your material. Do that here.


    +   3. Scroll down to the Options section, and select UV Project.


