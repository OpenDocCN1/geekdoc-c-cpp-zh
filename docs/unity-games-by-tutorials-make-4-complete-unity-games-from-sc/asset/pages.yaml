- pgno: 33
  md: 'The Unity user interface is completely customizable so you can add, remove
    and rearrange views as you see fit.


    When working with Unity, you''ll typically want to rearrange views into a Layout''s
    ideal for a given task. Unity allows you to save layouts for future use.


    In the Editor, look for the Game tab (to the left lower) and right-click it. From
    the drop-down menu, select Add Tab then choose Profiler.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_33_0.png)


    The Profiler view lets you analyze your game while it''s running. Unfortunately,
    the profiler is also blocking the Game view, so you won''t be able to play the
    game while you profile it — not so helpful.


    Click and hold the Profiler tab and drag it to the Scene tab above.


    As you see, views can be moved, docked and arranged. They can also exist outside
    the Editor as floating windows.


    To save the layout, select Window\Layouts\Save Layout... and name it Debugging.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_33_1.png)


    Whenever you need to access this particular layout, you can select the Layout
    button and choose Debugging.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_33_2.png)


    When clicked, you''ll see a listing of all your views.'
  merge: -1
