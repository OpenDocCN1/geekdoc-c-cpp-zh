    Currently, the space marine only knows how to stand like a statue. He needs to
    move around he''s going to avoid some alien''s snack.


    The first thing you''ll add a **Rigidbody** component, which opts the GameObject
    into the physics engine. By adding it, you''ll enable the GameObject to collide
    with other GameObjects.


    You''ll learn much more about Rigidbodies and collisions when you reach the Chapter
    4, ''Physics.'' For now, just take it at face value and move forward.


