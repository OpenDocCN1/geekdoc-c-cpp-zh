    # # Loop cut


    Making a **loop cut** is similar to using the Knife tool, but it makes a cut through
    the middle of multiple connected faces. You want to create a ridge along the back
    of the scorpion that sticks up a bit. The Loop Cut tool is perfect for this.


    +   1. Press **Ctrl-R** to invoke the Loop Cut tool. Hover the cursor over an
    edge and you''ll see a line, showing a preview of how the loop will be. Move your
    mouse over the edge shown here. **Left-click** once.


    +   2. By default, the loop cut is positioned exactly in the center, and that''s
    what you want. Without moving your mouse, **left-click** again to accept the position
    and apply the loop cut.


    > Note: Move your mouse before the second click to move your cut. Scroll the mouse
    wheel to create multiple cuts. Be aware that loop cuts only work with connected
    **quads** (faces with four edges). Modeling with only quads is good form.'
