    Here are the frame numbers and the coordinates for the rest of the keyframes.
    Don''t forget to right-click and select Insert Single Keyframe after you make
    each change, before you move the playhead, or your changes won''t be keyed.


    +   - Frame 25 - X -1.3, Y 3.5

