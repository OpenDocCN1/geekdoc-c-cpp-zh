- pgno: 158
  md: "# Animation states\n\nAs you start creating animations, you'll accrue many\
    \ clips. Some GameObjects are going to have many animations, you'll need a way\
    \ to control which animations run when. It's possible to do this through code,\
    \ but why would you go to the hassle when Unity provides a tool that makes this\
    \ easy?\n\nMeet the Animator.\n\nYou can think of the animator as the director\
    \ in a movie. It runs around giving orders of which animations to play.\n\nFor\
    \ instance, when a character stands idle, the animator could order an animation\
    \ to move the head and portray breathing and fidgeting. When a character's horizontal\
    \ speed increases, the animator could order a walking animation; once speed surpasses\
    \ a defined threshold, the animator could order a running animation.\n\nWith the\
    \ animator, you define the conditions and their animation relationships. Then,\
    \ in essence, the game takes care of itself.\n\nClick Window\\Animator to open\
    \ the Animator window.\n\n> **Note:** When you first start working with Unity,\
    \ you may confuse the Animation and Animator windows.\n\nTry a little memory trick:\
    \ The anima-tion window is where you do crea-tion. The animat-or window is where\
    \ you're an organiz-er. \n\nYou'll probably see an empty window because you didn't\
    \ select a GameObject that has an animator component attached to it.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_158_0.png)"
  merge: -1
  img_proc: true
- pgno: 159
  md: 'In the Hierarchy, check BobbleArena and check if you see the following in the
    Animator window:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_159_0.png)


    You''ll see that the Walls animation is already present in the controller. Any
    new animation clips are added to the current animator controller automatically.


    Each rectangle indicates an animation state:


    +   - The green rectangle is the entry point of the animator.

    - The orange rectangle indicates the default state; it''s always played first.

    - The arrows indicate transitions between states.


    By scrolling your mouse wheel up, you can zoom in on the states. Likewise, scrolling
    down zooms out. Pressing and holding the middle mouse wheel allows you pan over
    the states. These shortcuts are useful when you have a lot of states onscreen
    at once.


    Play your game and move the hero until you can see the lowered walls. The animation
    loops endlessly.


