  md: '# Opening the claws using Forward Kinematics


    For the claws, instead of moving an object that they are aimed at, simply rotate
    them. This is called Forward Kinematics.


    +   Move the playhead to frame 0 then select the Thumb.L bone. Look in the Properties
    shelf, ensure the Rotation Mode popup is set to XYZ Euler, then right-click the
    Z value and create a single keyframe of 0.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_492_0.png)


    +   Move the playhead to frame 20 and change the Z Rotation to -50. Don''t forget
    to right-click and select Insert Single Keyframe.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_492_1.png)


    +   Move the playhead to frame 40 and set a keyframe with the Z Rotation back
    to 0 (remember that you could also duplicate the keyframe at frame zero in the
    Dope Sheet and move it to frame 40).'
  merge: -1
