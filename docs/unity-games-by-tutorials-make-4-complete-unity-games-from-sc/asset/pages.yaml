- pgno: 606
  md: 'Unity Games by Tutorials


    When the build is done, the folder containing the build will open. If you''re
    on Windows, double-click the EXE file to try it out.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_606_0.png)


    Now, follow the same process to create Mac OSX and Linux builds. Create a Runestife-MacOSX
    and a Runestife-Linux folder for it. If you''re on one of these platforms, try
    out the build to see if everything is working correctly.


    You can now submit your builds to websites like itch.io and Game Jolt, or share
    them with your friends and family to play.


    Next up: Creating a WebGL build.


    # # WebGL


    WebGL lets you to incorporate your game directly into a webpage — no plugins needed!
    This build option was first introduced in Unity 5.0, but was hardly usable at
    that point due to several limitations and bugs. The build sizes were also huge
    so people had to wait a long time for the game page to load.


    As of Unity 5.4, WebGL is now a respected platform to target. Most of the limitations
    have been removed, and the builds are now compressed to avoid large downloads.


    To start using WebGL, open the Build Settings window, select WebGL and click Switch
    Platform.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_606_1.png)


    raywenderlich.com


    607'
