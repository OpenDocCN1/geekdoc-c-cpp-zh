- pgno: 477
  md: 'Unity Games by Tutorials


    2. In the menu at the bottom of the 3D View, select Armature ▸ Flip Names to automatically
    rename bones with L to .R, for the right arm.


    3. Switch to **Object Mode**. You''ve created new bones, but they have not had
    their Automatic Weights set up for the mesh. Select the mesh, then **Shift-click**
    the armature. Press **Ctrl-P** and select **Set Parent To Armature Deform ▸ With
    Automatic Weights**. The mesh is already parented to the armature, so now it just
    recalculates the automatic weights; this time for all the new bones.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_477_0.png)


    4. What happened to the right arm? When the bones got flipped, the **Pole Angle**
