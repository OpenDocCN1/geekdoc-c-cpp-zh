- pgno: 642
  md: '# MonoBehaviour


    MonoBehaviour is the base class every script derives from. It has a lot of handy
    methods you can use; for example, MonoBehaviours can create GameObjects with Instantiate()
    and delete GameObjects with Destroy().


    In addition, you can override certain methods on MonoBehaviour to be notified
    upon certain events, which correspond to various phases in the lifecycle of the
    object the script is attached to.


    The following phases occur in the order list.


    # Initialization phase


    These are events that correspond when the MonoBehaviour is first initialized or
    re-enabled.


    +   - Awake: Occurs only when the script is called, after all the objects are
    initialized. This means you can access any other GameObjects without having to
    worry they''ve been instantiated or not.

    - OnEnable: Called when the current script has either been re-enabled or started
    for the first time. This means OnEnable() will be called, at least once, for every
    GameObject.

    - Start: Called immediately before the first Update(), but only if the script
    has been enabled.


    # Physics phase


    These events may occur more than once per frame to calculate the physics of the
    particular GameObject.


    +   - FixedUpdate: Occurs at fixed points in time in conjunction with the physics
    engine, regardless of the frame rate. Any changes in regards to physics should
    occur in this event.

    - OnTriggerEnter: Called when a GameObject with a collider crosses a trigger.

    - OnCollisionEnter: Resembles OnTriggerEnter(), except it''s called when two objects
    collide with each other.'
  merge: -1
  img_proc: true
- pgno: 643
  md: '# Input events phase


    These events occur when the user interacts with the mouse in some fashion.


    +   - OnMouseDown: Occurs when the user presses the mouse button over a collider
    or GUIElement.


    +   - OnMouseUp: Called when the user releases the mouse button.


    +   - OnMouseOver: Called when the mouse is over a collider or GUIElement.


    +   - OnMouseEnter: Called when the mouse enters a collider or GUIElement.


    +   - OnMouseExit: Called when the mouse exits a collider or GUIElement.


    +   - OnMouseDrag: Called when the mouse button is clicked and held over a collider
    or GUIElement.


    +   - OnMouseUpButton: Occurs when a mouse is over a collider or GUIElement and
    the mouse button is pressed and released.


    # Game logic


    These are prime logic events inside your game.


    +   - Update: Occurs once per frame and is where your general game logic occurs.


    +   - LateUpdate: Called after all the calculations have completed in Update().Useful
    when you need to make additional calculations based on the results of Update().


    # Scene rendering


    These events occur with the rendering of all the graphics in the current scene.


    +   - OnCull: Called before the camera determines which GameObjects can be seen.
    This event occurs before the culling process.


    +   - OnWillRenderObject: Called for each camera that can see a GameObject.


    +   - OnBecameInvisible: Occurs when a renderer is no longer visible to a camera.


    +   - OnPreRender: Called just before the scene is rendered by the camera.


    +   - OnPostRender: Called when the camera has finished rendering the scene and
    is meant to be associated with an enabled camera component.'
  merge: -1
  img_proc: true
- pgno: 644
  md: '+   **OnRenderObject**: Called right after the camera has completed rendering
    the scene. This is very similar to OnPostRender it will work well with GameObjects.


    +   **OnRenderImage**: Called after rendering is complete to create an image.
    This allows you to add effects in the post-processing pass, such as turning a
    color image black and white.


    # # Pausing, disabling and decommissioning


    This final batch of events occur when you pause, disable, and decommission GameObjects.


    +   **OnDisable**: Occurs when a component becomes disabled or inactive.


    +   **OnApplicationQuit**: Occurs when the app is about to end or if you are exiting
    Play mode.


    +   **OnDestroy**: Called before the MonoBehaviour is going to be destroyed. If
    you need to do any clean up, this is a good time to do it.


    MonoBehaviour contains a list of events; we haven''t covered them all here. Check
    the Unity documentation to see what more events are available to you.


    # # ScriptableObjects


    When making your games, you might be tempted to put all your game logic in MonoBehaviour
    derived types. After all, this is how you construct all the games in this book.
    A ScriptableObject is another type that you can use to build your games.


    Whereas MonoBehaviour derived scripts can manage the objects of things that appear
    onscreen, ScriptableObjects manage the data associated with those objects. The
    beautiful thing is that these objects can be saved in your project and reused
    much like a prefab.


    For instance, you may have all your level data stored in a text file. Each time
    the game starts, you need to read that text file, parse the information and store
    all that data into memory. For a desktop PC, this may not be an issue, but for
    devices with constrained resources like a phone, you are wasting resources on
    data being used.


    By using a ScriptableObject, all the levels can be broken down into individual
    levels, values can be changed in the inspector and loading them is blazing fast.'
  merge: -1
  img_proc: true
- pgno: 645
  md: "To create a ScriptableObject, you create a new class that derives from ScriptableObject:\n\
    \n```\n[System.Serializable]\npublic class ExplodeBot : ScriptableObject\n{\n\
    \    public int hitPoints;\n    public float moveSpeed;\n    public float damage;\n\
    }\n```\n\nThe System.Serializable is known as an attribute which is covered in\
    \ the next section. This attribute indicates that all the public fields can be\
    \ changed in the editor.\n\nAt this point, you have an object that can be created\
    \ inside of the editor, saved in your Project browser, and editable in the Inspector,\
    \ which is a huge win.\n\nCreating an object is as easy as:\n\n```\nusing UnityEditor;\n\
    public class CreateExplodeBot\n{\n    // 1\n    [MenuItem(\"Assets/Create/Explode\
    \ Bot\")\n    public static ExplodeBot CreateBot()\n    {\n        // 2\n    \
    \    ExplodeBot bot = ScriptableObject.CreateInstance<ExplodeBot>();\n\n     \
    \   // 3\n        AssetDatabase.CreateAsset(bot, \"Assets/ExplodeBot.asset\");\n\
    \        AssetDatabase.SaveAssets();\n        return bot;\n    }\n}\n```\n\nThis\
    \ code does few interesting things.\n\n+   Declares an attribute to add a menu\
    \ item to the Unity editor. Yes, you can augment the editor to assist with the\
    \ creation of your game. In this case, you create a menu item to create ExplodeBot.\n\
    \n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_645_0.png)"
