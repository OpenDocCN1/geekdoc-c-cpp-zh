    # A menu scene to load levels


    Right now, the Menu scene will have a Simple Play button that starts the Game
    scene when clicked. It would suffice if you just wanted some weak single-level
    game, but can''t handle the stress of multiple levels.


    Ideally, the Menu scene should parse any JSON level files stored in the game''s
    directory and display them to the player. When the player clicks a level name,
    the game should interpret the level''s JSON file then build and load it into the
    Game scene.'
