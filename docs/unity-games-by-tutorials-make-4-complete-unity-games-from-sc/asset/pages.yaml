- pgno: 482
  md: '# Frame 80 - X O Y 3.6


    Your Dope Sheet should look like this:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_482_0.png)


    Press Alt-A to preview your animation. It''s getting there, but the motion feels
    a bit wooden; it doesn''t flow as naturally as it could. To fix that, shift your
    attention to the Graph Editor.


    # The Graph editor


    At this point, your Graph editor should look like this:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_482_1.png)


    Feel free to zoom in to see more detail, if your graph looks small. Note also
    that you can drag the panel edges to resize any panel.


    The Graph editor charts a curved line for each animated channel. The horizontal
    axis represents time; the vertical axis represents the value of the channel. The
    points on the line represent keyframes you''ve set.


    # Using the Graph Editor to create smooth motion


    Click the first point on the X Location curve. Once selected, each point has handles
    on either side that control the strength and direction of the curve. Drag the
    handle on the right so that it is approximately 45 degrees:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_482_2.png)'
