  md: "# Tower Manager\n\nThe TowerManager handles creating new towers and holds the\
    \ prices for the different towers.\n\nCreate a new C Script named TowerManager\
    \ inside the Scripts > Game > Tower folder and open it in a code editor. Completely\
    \ remove the Start() and Update() methods and add these lines under the other\
    \ statements:\n\n```\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\n```\n\nAdd the following struct right above public class TowerManager\
    \ : MonoBehaviour :\n\n```\n[Serializable]\npublic struct TowerCost\n{\n    public\
    \ TowerType TowerType;\n    public int Cost;\n}\n```\n\nThis will let the script\
    \ use an external, easily editable list of prices.\n\nNow, inside the class, add\
    \ this code:\n\n```\n//1\npublic static TowerManager Instance;\n\n//2\npublic\
    \ GameObject stoneTowerPrefab;\npublic GameObject fireTowerPrefab;\npublic GameObject\
    \ iceTowerPrefab;\n\n//3\npublic List<TowerCost> TowerCosts = new List<TowerCost>();\n\
    \n//4\nvoid Awake()\n{\n    Instance = this;\n}\n\n//5\npublic void CreateNewTower(GameObject\
    \ slotToFill, TowerType towerType)\n{\n    switch (towerType)\n    {\n       \
    \ case TowerType.Stone:\n            Instantiate(stoneTowerPrefab, slotToFill.transform.position,\
    \ Quaternion.identity);\n            slotToFill.gameObject.SetActive(false);\n\
    \            break;\n```"
  merge: -1
  img_proc: true
- pgno: 542
  md: "Unity Games by Tutorials\n\nChapter 19: Making Towers\n\n```\ncase TowerType.Fire:\n\
    \    Instantiate(fireTowerPrefab, slotToFill.transform.position,\n    Quaternion.identity);\n\
    \    slotToFill.gameObject.SetActive(false);\n    break;\ncase TowerType.Ice:\n\
    \    Instantiate(iceTowerPrefab, slotToFill.transform.position,\n    Quaternion.identity);\n\
    \    slotToFill.gameObject.SetActive(false);\n    break;\n}\n// //\npublic int\
    \ GetTowerPrice(TowerType towerType)\n{\n    return (from towerCost in TowerCosts\n\
    \            where towerCost.TowerType\n            == towerType\n           \
    \ select towerCost.Cost).FirstOrDefault();\n}\n```\n\nHere’s how it works:\n\n\
    +   1. As this is another singleton, a static reference to this script is stored\
    \ away in Instance.\n\n+   2. References to the tower prefabs, needed to spawn\
    \ new instances.\n\n+   3. Store the cost of each type of tower in a list.\n\n\
    +   4. Sets the Instance variable to this script.\n\n+   5. Accepts a tower slot\
    \ and a type of tower as parameters, and create a new copy of the chosen tower\
    \ at the position of the tower slot. It also disables the tower slot so you can’t\
    \ place two towers on one slot.\n\n+   6. A LINQ utility method to easily get\
    \ the price of a tower type.\n\nNow save the script and hop back into Unity.\n\
    \nIn the Hierarchy, create a new empty GameObject. Name it TowerManager and parent\
    \ it to Managers. Add the TowerManager script to it using the Add Component button\
    \ in the Inspector panel and searching for it.\n\nraywenderlich.com\n\n543"
  merge: -1
  img_proc: true
