- pgno: 72
  md: '# # Chapter 3: Components

    By Brian Moakley


    At this point, you''ve accomplished your goal of having all the main actors ready,
    but it''s essentially an empty stage. Sure, you might win some avant-garde awards
    for a poignant point on the lack of free will, but that''s not going to pay the
    bills.


    In this chapter, you''ll add some interactivity to your game through the use of
    Components, which are fundamental to Unity game development. If you were to think
    of a GameObject as a noun, then a component would be a verb, or the part that
    performs the action; a component does something on behalf of a GameObject.


    You''ve learned bit about components already. In previous chapters, you learned
    how each GameObject has one required component: The Transform component, which
    stores the GameObject''s position, rotation and scale.


    | Transform | X | Y | Z |

    |---|---|---||}{

    | Position | -4.9 | 12.54 | 2.58 |

    | Rotation | 0 | 0 | 0 |

    | Scale | 1 | 1 | 1 |


    Unity comes with far more components than that. For instance, there''s a light
    audio component that will produce sound. There''s even a particle system component
    that will generate some impressive visual effects. And, of course, if there isn''t
    a component that does what you want, you can write your own.


    In this chapter, you''ll learn about several types of components, including the
    Rigidbody component, the script component, and more. By the end of this chapter,
    your marine will be running and gunning!'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Getting started


    If you completed the last chapter, **open** your current **Bobblehead Wars** project
    to pick up where you left off. If you got stuck or skipped ahead, open the **Bobblehead
