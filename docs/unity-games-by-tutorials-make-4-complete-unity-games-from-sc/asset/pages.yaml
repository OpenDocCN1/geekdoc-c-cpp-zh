- pgno: 220
  md: "# Managing script order\n\nWhen you play your game, you may see a null reference\
    \ exception in the console.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_220_0.png)\n\
    \nThis line in points to the Gun script where the SoundManager is being accessed.\
    \ Yet, this code worked in the past. What could have possibly changed?\n\n```\n\
    void Start()\n{\n    audioSource = GetComponent<AudioSource>();\n    audioSource.PlayOneShot(SoundManager.Instance.gunfire);\n\
    }\n```\n\nThis is an example of script execution bug. The Gun script loads before\
    \ the SoundManager script, yet the SoundManager needs to run first before it can\
    \ be used.\n\nYou could rewrite the script or you alter the order of the scripts.\
    \ In this case, you'll have to do.\n\nClick Edit > Project Settings > Script Execution\
    \ Order. You will see the following dialog:\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_220_1.png)\n\
    \nIn the center, you'll see a box called Default Time. This is the time scripts\
    \ are loaded in your game. By default, scripts are loaded in an arbitrary time\
    \ during this period.\n\nYou can order your scripts before the default time or\
    \ after the default time.\n\nClick the + to add a new script and select the Gun\
    \ script."
  merge: -1
  img_proc: true
