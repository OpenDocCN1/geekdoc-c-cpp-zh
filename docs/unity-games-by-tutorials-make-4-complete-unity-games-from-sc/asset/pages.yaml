- pgno: 237
  md: "# Chapter 8: Finishing Touches\n\nUnity kicks off the entire process and you\
    \ just need to call it. In AlienDestroyed(), add the following before the closing\
    \ brace:\n\n```\nif (totalAliens == 0)\n{\n    Invoke(\"endGame\", 2.0f);\n}\n\
    ```\n\nYou've done a lot, here, so review how the entire end-game process works:\n\
    \n+   1. Once the count of aliens hits 0, you schedule the endGame() method to\
    \ be called after two seconds.\n\n+   2. This fires the \"PlayerWon\" trigger\
    \ on the Arena Animator.\n\n+   3. Once the Arena Animator detects this, it plays\
    \ the elevator summon animation.\n\n+   4. You configured the elevator summon\
    \ animation to fire an animation event when the animation completes, to call the\
    \ ActivatePlatform() method.\n\n+   5. This enables a collider on the elevator.\n\
    \n+   6. When the player hits the collider, OnTriggerEnter() is called on the\
    \ arena. This attaches the player to the elevator and sets the \"OnElevator\"\
    \ Boolean on the Arena Animator.\n\n+   7. This causes the Arena Animator to play\
    \ the elevator's rise animation.\n\n+   8. Pew! If you understand this sequence,\
    \ pat yourself on the back — you've learned lot about Unity!\n\nSave the code\
    \ and head back to Unity. Select GameManager in the Hierarchy and drag the BobbleArena\
    \ to the Arena Animator property.\n\nNow for the final play test. Kill all the\
    \ aliens and then step on the elevator. Victory is yours!"
