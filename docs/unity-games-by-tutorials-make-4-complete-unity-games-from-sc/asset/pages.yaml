- pgno: 356
  md: '# Setting up physics 2D layers


    To get started, you need to set up the layer collision matrix. You can learn more
    about this matrix in Chapter 4, "Physics".


    # Configuring the Layer Collision Matrix


    Click **Edit > Project Settings > Tags and Layers** to open the **Tags and Layers**
    Inspector.


    Unity provides you with a series of **User Layers** under the **Layers** rollout
    that you can use to define your custom collision layers, in addition to the built-in
    layers.


    Use **Layer 8** and **User Layer 9** to create two new layers called **Player**
    and **Hazards**.


    The player will be placed on the **Player** layer, and the saw blades will use
    the **Hazards** layer.


    Click **Edit > Project Settings > Physics 2D** to open the **Physics2DSettings**
    Inspector. At the bottom you will see the **Layer Collision Matrix**. Expand it
    if it is not already shown.


    You will see that Unity has added your new layers, **(Player and Hazards)**, to
    the matrix.


    Uncheck the boxes where **Hazards** intersects **Hazards**, and ensure the box
    is checked for where **Player** intersects with **Hazards**. Make sure the box
    where **Default** intersects with **Hazards** is also unchecked.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_356_0.png)


    The reasons for these changes:


    +   **Hazards intersection with Hazards removed**: This prevents saw blades that
    are placed close together (or overlapping) from performing collision checks, hitting
    each other in the physics engine, and can help increase performance.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   Player intersection with Hazards enabled: This ensures that the player
    can interact with touch hazards.


    +   Default intersection with Hazards removed: You will be leaving all the level
    / platform building blocks on the Default layer, so you do not want the hazards
    to be collision checking against these. Usually the saw blades will be "embedded"
    or placed behind platform blocks, so disabling collisions here will also save
    on performance.


    In Game scene, select SoyBoy and change the GameObject layer to the new Player
    physics layer. Click Apply to update the prefab instance.


    # Completing the 2D Character Controller


    Up until now, Super Soy Boy has only been able to move left and right and face
    in those directions. You''ll need to get the meat of the controller to provide
    the complete range of platform movement actions.


    # A note on 2D raycasting


    2D raycasting will be used in your Character Controller to determine when you
    are touching the ground, jumping, up against a wall and so on.


    Raycasting in 2D is done with the Physics2D.Raycast(). This method returns the
    RaycastHit2D type, which references the first Collider2D object that the ray hit.
    If the ray does not hit anything then the collider returns null.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_357_0.png)


    In the example above, a raycast is being performed from Super Soy Boy, to his
    right. The ray hits a Collider2D object. In code, a RaycastHit2D object would
    be returned, and the collider property on this would contain a reference to the
    object''s BoxCollider2D.'
  merge: -1
  img_proc: true
