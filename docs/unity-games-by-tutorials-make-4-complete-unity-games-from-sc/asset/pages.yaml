- pgno: 478
  md: 'When you play the animation, the object will move smoothly from the position
    set by the first keyframe, to the position set by the second keyframe. This automatically
    generated motion between keyframes is called tweening.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_478_0.png)


    At the top of the screen, switch to the Animation workspace. There are some new
    panels here:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_478_1.png)


    +   - The Dope Sheet shows you an overview of everything that is animated, in
