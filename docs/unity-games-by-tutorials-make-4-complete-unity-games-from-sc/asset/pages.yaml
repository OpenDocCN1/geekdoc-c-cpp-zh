- pgno: 88
  md: '# Unity Games by Tutorials


    ending positions. Lerp() returns a point in 3D space between the start and end
    positions that''s determined by the last value.


    For example, if the last value is set to 0 then Lerp() will return the start position.
    If the last value is 1, it returns the end position. If the last value is 0.5,
    it returns a point halfway between the start and end positions.


    In this case, you will supply the camera mount position as the start and the player
    position as the end. Finally, you multiply the time since the frame rate by a
    speed multiplier to get a suitable value for the last parameter. Effectively,
    this makes the camera mount position move smoothly to where the player is over.


    Save your code and return to Unity. Select CameraMount in the Hierarchy, and look
    in Inspector. You''ll see two fields named Follow Target and Move Speed. As mentioned
    earlier, these were automatically derived by Unity from the public variables you
    just added to the script. These variables may need some values.


    With CameraMount still selected in the Hierarchy, drag SpaceMarine to the Follow
    Target field and set the Move Speed to 20.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_88_0.png)


    Play your game to see what''s changed.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_88_1.png)


    The marine is a real superstar now, complete with a personal camera movement.
    Granted, he can''t turn, and he walks right through objects like Kitty Pryde,
    but these are easily solvable issues that you''ll tackle in the next chapter,
    Chapter 4, "Physics."'
