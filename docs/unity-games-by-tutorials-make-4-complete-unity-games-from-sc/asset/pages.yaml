  md: '# Unity Games by Tutorials


    # Chapter 8: Finishing Touches


    | | | |

    |---|---|---|n| Planes | DeathFloor (Transform) | |

    | Visualization | Solid |

    | Scale Plane | 1.00 |


    Click the Play button. The blood will pool on the new floor!


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_227_0.png)


    Now you have to address a small rendering issue. In this case, Unity renders the
    particles underneath the floor because it draws the floor *after* it draws the
    particles.


    To avoid this, you need to assign the particles to a Sorting Layer, which will
    determine the order in which Unity renders objects. Typically, you use these with
    Unity 2D, but there are use cases for sorting layers in 3D games, too.


    Expand the **Renderer** section of the particle system. In the **Sorting Layer**
    property, select **Add Sorting Layer...**. The Inspector will change to **Tags
    & Layers**. Click the + and name the sorting layer **Foreground.**


    | Sorting Layers |

    |---|---|

    | Layer | Default |

    | Layer | Foreground |


    Return to the **Renderer** module, and in the **Sorting Layer**, select the **Foreground**
    property. Keep in mind that you''ll need to do the same thing for the space marine.


    Now click the **Apply** button to apply the changes to the prefab.


    You''ve unveiled a new problem: The death floor isn''t added to the prefab because
    it''s an instance in the scene and your Alien prefabs don''t know about it. You''ll
    address this in a moment.'
