    # Organizing your assets


    Beginners to Unity might imagine that you develop your game from start to finish
    in Unity, writing code, creating 3D models and textures, and so on.


    In reality, a better way of thinking about Unity is an integration tool. Typically
    you will write code or create 3D models or textures in a separate program, and
    use Unity to wire everything together.


    For Bobblehead Wars, we''ve created some 3D models for you, because learning how
    to model things in Blender would take an entire book on its own!


    In this chapter, you will learn how to import models into your game.


    Before you do that, it pays to be organized. In this game, you''re going to have
    a lot of assets, so it''s critical to organize them in way that makes them easy
    to find.


    The view where you import and organize assets is called the Project Browser. It
    mimics the organization of your file system.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_34_0.png)


    raywenderlich.com


    35'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'It previous versions of Unity, every Project Browser defaulted with nothing
    in it. With 2018, it now comes with a Scenes folder and a new scene called SampleScene.
    You can think of a scene as a level in your game. You can divide all your levels
    into individual scenes or you can keep everything in one scene. The choice is
    yours.


    In the Project Browser, select the Assets folder and click the Create button.
    Select Folder from the drop-down menu and name it Models. This will be home to
    all your models. You may feel tempted to create folders and manipulate files in
    your file system instead of the Project Browser. That''s a bad idea — do not do
    that, Sam Am I!


    Unity creates metadata for each asset. Creating, altering or deleting assets on
    the system can break this metadata and change your game.


    Create the following folders: Animations, Materials, Prefabs, Presets, Scripts,
    and Textures.


    Your Project Browser should look like this:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_35_0.png)


    Finally, I find large folder icons to be distracting. If you also have a preference,
    you can increase or decrease the size by using the slider at the bottom of the
    Project Browser.


    > Note: All the screenshots in this book from now on will show the smallest setting.


    Finally, you may want to change the name of an asset. For instance, your current
    scene is called SampleScene. Select the Scenes folder, and then select SampleScene
    file. The name will be highlighted. Single click it one more time and you''ll
    be to write a new name. Change it to Main.'
  merge: -1
  img_proc: true
