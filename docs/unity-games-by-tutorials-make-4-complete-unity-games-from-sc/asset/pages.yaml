- pgno: 544
  md: 'The Tower Manager is now ready for use! Before you can buy new towers though,

    Screen Canvas'' child AddTowerWindow needs a script to link its UI to

    TowerManager.


    # Linking the UI


    Create a new C# Script named AddTowerWindow inside the Scripts ▸ Game ▸ UI

    folder. Open the script and add this to the top of the file:


    ```

    using System;

    ```


    Now remove the Start() and Update() methods and insert the following block of
    code

    in their place:


    ```

    //1

    public GameObject towerSlotToAddTowerTo;

    //2

    public void AddTower(string towerTypeAsString)

    {

    //3

    TowerType type = (TowerType)Enum.Parse(typeof(TowerType),

    towerTypeAsString, true);

    //4

    if (TowerManager.Instance.GetTowerPrice(type) <=

    GameManager.Instance.gold)

    //5

    GameManager.Instance.gold -= TowerManager.Instance

    .GetTowerPrice(type);

    //6

    TowerManager.Instance.NewTower(towerSlotToAddTowerTo, type);

    gameObject.SetActive(false);

    }

    ```


    Here''s what each comment references:


    +   1. The reference to the tower slot where the tower should be built.

    2. The AddTower() method takes a single string parameter: The tower''s type.

    3. Convert the string parameter that was passed into the TowerType enum. The reason
    why the method doesn''t simply accept the TowerType as a parameter because enums
    are not supported for Event Triggers.

    4. Check that the player has enough gold to afford the chosen tower.

    5. Subtract the tower''s price from the player''s gold.'
  merge: -1
  img_proc: true
