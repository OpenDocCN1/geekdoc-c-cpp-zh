- pgno: 296
  md: '# Chapter 11: Introducing the UI


    By Anthony Uccello


    In Chapter 10, "Adding Enemies," you added pickups, spawning robots and flying
    bullets to your game. Now, it''s time to add the user interface (UI), wave-spawning
    mechanics, enhanced sound and music, and the capacity to do extra damage by using
    the right gun for the right robot.


    Pre-Unity 4.0, the UI tools were difficult. For the most part, you had to write
    everything inside of MonoBehaviour() and, as your UI grew in complexity, so did
    your code. Frankly, Unity listened to developers and, after many many years, they
    released their new UI in Unity 4.6.


    # Getting started


    In Chapter 9, "Making a First-Person Shooter," you created a canvas named GameUI.
    A canvas is the root object for all UI elements. You used an overlay canvas, but
    there other options. For instance, a world space allows you to create interfaces
    that can be accessed in your own game! Think of the computer terminals from Doom
    3.


    For a canvas to be useful, you need controls, and Unity comes with plenty of them.
    The most common UI elements are Image, Button and Text.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Unity Games by Tutorials


    The canvas is indicated by a giant white box — and you''ll notice that it''s huge!


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_297_0.png)


    This is because the canvas is assuming one pixel of screen space to be one unit
    inside of Unity. The canvas pixel density can be changed using the **canvas scaler**.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_297_1.png)


    The scaler has a property **UI Scale Mode** with some interesting options.


    +   - **Constant Pixel Size** means the UI elements are the same size, regardless
    of screen size.


    +   - **Scale with Screen Size** means UI elements grow bigger with the screen.


    +   - **Constant Physical Size** means the UI elements will always be the same
    size, regardless of screen size or resolution.


    This one component determines how your UI will look on different screen sizes
    and resolutions. For the purposes of this chapter, you''ll be using the default
    values. Although the canvas shares the same space, you can effectively ignore
    it. Like any other GameObject, you can always deactivate it to maintain a clear
    "desk space," to speak.


    An Image is a UI class of objects that lets you render an image on the screen
    via a **Sprite**. **Text**, quite logically, lets you render text on the screen.
    **Button** lets you configure hover and click events. You''ll use these throughout
    this tutorial.


    So you may be wondering, how are controls placed? Unity uses **anchors** and they
    look like arrows pointing at each other.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Unity Games by Tutorials


    Chapter 11: Introducing the UI


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_298_0.png)


    An anchor acts like an anchor in real life: It keeps something in place. If you
    wanted to position a UI element in the top-left corner and always stay relative
    to that top-left corner, you would simply set its anchor to top-left.


    Anchors also can stretch a control. This is useful if you want a control to expand
    or contract based on the screen size. The anchor breaks into individual arrows
    to form a rectangle. This allows you to define the size of the stretching.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_298_1.png)


    When talking about anchors, it''s important to understand what a pivot is. The
    pivot is the point on the Image that the position is applied to, and it''s what
    the anchors use for keeping it in the right place. The pivot point is also the
    rotation point.


    Having the pivot at the top-left corner is the most common position, but it can
    be useful to have the pivot set in various positions. For example, if you want
    something to be positioned in the top-middle of the screen, setting the pivot
    to the top-middle can make things a lot easier.


    The pivot is set in normalized coordinates. This means that it goes from 0 to
    1 for both height and width where (0,0) is the bottom left corner and (1,1) is
    the top right corner.


    raywenderlich.com


    299'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'The pivot point is represented by a blue circle:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_299_0.png)


    Throughout this chapter, you''ll set the position and pivot points of various
    UI controls through the Inspector.


    If you ever want to manually position controls, you can use the **Rect Tool.**


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_299_1.png)


    The Rect Tool is the Swiss Army knife of working with 2D. It allows you to scale,
    rotate and even reset points. It even works with 3D objects, although the tool
    was designed with 2D in mind.


    You''re about to create the UI, so the above theory will make perfect sense after
    you''ve completed the section below. Load the **Battle** scene to start. If you
    need to start fresh, open the starter project in the book project resources.


