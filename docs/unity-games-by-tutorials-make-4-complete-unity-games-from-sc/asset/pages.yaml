    Click the transition arrow pointing from IdleAnimation to RunAnimation. The Inspector
    window should show you the details of this transition.


    Click the + (plus) icon under Conditions, and select the Speed parameter in the
    Condition drop-down. Ensure the check is set to Greater than 0. Uncheck the box
