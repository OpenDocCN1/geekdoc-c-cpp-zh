- pgno: 28
  md: 'If you are developing on the Mac, your screenshots may look slightly different,
    but don''t worry — you should still be able to follow along with this book fine.
    Several of this book''s technical editors are Mac users and have used the tutorials
    successfully while reviewing this book! :]


    By default, you should select the Unity Engine, Documentation and Standard Assets.

    Here''s why they are significant:


    +   - Unity Engine: This is the powerhouse that will drive all of your games.
    When you update the engine, keep this — and only this — selected to avoid downloading
    unnecessary files.


    Don''t worry if your version number is slightly different than what we''ve shown
    — Unity is constantly updating.


    +   - Documentation: This is your lifeline when you run into issues you don''t
    understand. Understanding the documentation frees you from reliance on the internet.
    Having it on hand is particularly helpful when traveling or dealing with unstable
    networks.


    +   - Standard Assets: These are additional objects that help you build games
    such as first-person and third-person character controllers, anti-aliasing and
    other useful items.


    If you plan on reading Chapter 21, ''Publishing Your Game,'' then make sure to
    check Android build support and iOS build support.


    > Note: iOS build support will only work on macOS. For Android build support,
    you''ll need to download Android Studio. Chapter 21 will cover all of this in
    detail.


    After finish reading this book, you may find that you need additional platform
    support, such as tvOS build support.


    In that case, you just run the installer again, uncheck everything and then check
    the required platforms. Follow the installer to completion to install those components.'
