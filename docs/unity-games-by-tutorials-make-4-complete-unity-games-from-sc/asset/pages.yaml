    > Note: One way to remember the difference between the regular suplicate (Shift-D)
    and a Linked Duplicate (Alt-D) is that “Alt” has the letter “L” in it, for “Linked”.


    Don''t forget to press Ctrl-S to save. You can find a copy of this file in the
    Resources folder: Scorpion 02-Base.blend.


    # Modeling the body


    +   1. You need another cube for the body: create one using Shift-A.


    +   2. Scale it: type S 0.7 and press Enter.


