- pgno: 156
  md: '# Unity Games by Tutorials


    # Chapter 6: Animation


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_156_0.png)


    You''ll notice that the entire animation interface is red, letting you know that
    you are currently recording the animation.


    There are two different modes when working with animation: Preview mode and Record
    mode.


    When pressing the Preview button in the timeline, you''ll notice that the timeline
    changes to a light color blue. This means that Unity will only record changes
    made to the current property being animated. Changes to other GameObjects **won''t**
    be recorded.


    If you press the record button, Unity will record any any changes that you make
    in your scene. If a property is not present on the timeline, Unity will automatically
    add it for you. Changes to other GameObjects **will** be recorded.


    If you are animating specific properties, then work in Preview mode. If you need
    to animate a large selection of GameObjects, make sure to animating in Record
    mode. For now, you''ll work in Record mode.


    If you select one of the GameObjects that you''re animating, you''ll also notice
    that its position properties turn red.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_156_1.png)


