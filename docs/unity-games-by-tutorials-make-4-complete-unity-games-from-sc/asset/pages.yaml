    a particular prefab. In this case, this will create a bullet based on the bullet
    prefab. Since Instantiate() returns a type of Object, the result must be cast
    into a GameObject.


    +   2. The bullet''s position is set to the launcher''s position — you''ll set
    the launcher for the barrel of the gun in just a moment.


    +   3. Since the bullet has a Rigidbody attached to it, you can specify its velocity
    to make the bullet move at a constant rate. Direction is determined by the transform
    of the object which this script is attached — you''ll attach it to the body of
