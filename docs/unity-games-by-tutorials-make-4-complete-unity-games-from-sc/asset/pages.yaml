- pgno: 199
  md: '# Introducing the Audio Mixer


    While playing your game, you might notice that the sounds are a little out of
    whack. the music is a bit too loud, the death sounds are a tad too soft and the
    bullets are lacking pizzazz!


    You could tweak each sound individually, but you have better things to do, such
    as killing aliens and designing an epic game.


    Think about it; you''d have to play the game and keep track of the individual
    sound levels then make adjustments. While you could copy some of the changes,
    most of the work would be done by hand.


    Before Unity 5, the painful one-at-a-time process would have been your only option,
    but Unity 5 puts an audio mixer in your hands.


    Go to the Project browser and select the Sounds folder. Click the Create button
    and select Audio Mixer in the drop-down. Name it MasterMix.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_199_0.png)


    Click Window\Audio Mixer and drag the view to a place in the UI where it can expand
    horizontally instead of vertically.'
  merge: -1
  img_proc: true
