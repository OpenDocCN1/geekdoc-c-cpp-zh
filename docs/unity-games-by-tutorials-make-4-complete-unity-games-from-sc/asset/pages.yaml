- pgno: 650
  md: '# # Chapter 24: Visual Studio


    By Brian Moakley


    Prior to Unity 2018.1, Unity shipped with a code editor MonoDevelop. It worked
    well enough, but there were lots of quality issues (such as code highlighting
    inconsistencies) when working with it. Over a period of time, these quality issues
    could make the code editor frustrating to use. This earned it quite a bad reputation
    among developers.


    Thankfully, in 2017, Microsoft released its much-loved Visual Studio for macOS,
    which is now installed by default with Unity. The days of MonoDevelop are behind
    you. That said, the two versions of Visual Studio are not identical and you may
    run into inconsistencies.


    In this chapter, you''ll get an overview of the Windows version; the screenshots
    may look slightly different but functionally, they are the same.'
  merge: -1
  img_proc: true
- pgno: 651
  md: '# Getting used to Visual Studio


    Visual Studio can be intimidating, but it''s not so bad once you get to know it.
    Like Unity, it''s composed of a series of views you can arrange into custom layouts.
    You can save your layouts and reuse them for certain tasks and workflows.


    Here''s a breakdown of the editor:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_651_0.png)


    +   1. This is your standard menubar and toolbar to assist with various tasks.
    An important button is the Attach to Unity button, which you''ll use to start
    debugging.


    +   2. Your code editor. I tend to keep this view open when working on projects,
    as it helps me avoid the distraction that comes from visual noise.


    +   3. Some views will appear underneath the editor. Typically, this is where
    you manage your Debugger and learn of errors in your project.


    +   4. The right-hand column provides another location for tools such as the Solution
    Explorer, which allows you to not only see all your script files, but expand them
    to see all their methods and properties at a glance.


    Like Unity, views can be added, removed and docked. By clicking the View option
    from the menubar, you''ll see that you have a plethora of views at your disposal,
    complete with hotkeys to activate them without the hassle of using your mouse.'
  merge: -1
  img_proc: true
- pgno: 652
  md: 'Unity Games by Tutorials


    Chapter 24: Visual Studio


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_652_0.png)


    # WTF is CR LF?


    When you first open a script in Unity, you may encounter a weird dialog that looks
    like the following:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_652_1.png)


    No warning is fun, never mind those warnings that make absolutely no sense. This
    pesky warning relates to the line endings of the generated script files.


    That''s right, the cause of the problem is the *file itself.*


    Whoever created the file did it in a Unix-based system, whereas you''re using
    a Windows-based system. Unity manages line endings differently than Windows, so
    this error is Visual Studio''s way of asking how to handle these mysterious line
    endings.


    Simply click **OK** and Visual Studio will politely convert the line endings for
    you.


    But wait,” you say, “I get this even when I create a new file! What gets?”


    raywenderlich.com


    653'
  merge: -1
  img_proc: true
- pgno: 653
  md: 'Unity creates new scripts based on templates, and those templates are the cause
    of the line ending issues. To fix the issue, you must change the templates. What
    is with IDEs, or Integrated Development Environments, and their funky templates?


    First, open Visual Studio. Click File > Open File and then head over to the location:
    C > Program Files > Unity > Editor > Data > Resources > ScriptTemplates.


    This directory contains a list of templates that Unity uses to create your scripts.
    For fixing the C# templates, open 81-C# Script-NewBehaviourScript.cs.txt.


    Next, click File > Advanced Save. Here, you''ll see a familiar dialog. The line
    endings are to Windows (CR LF) and click OK.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_653_0.png)


    Now, you''ll no longer get that message. When working with a source control program
    such as git, the Windows line endings will be stripped — don’t be surprised when
    you encounter the message again.


    # Braces and spaces


    If you ever want to start a fight at a developer conference, pick a packed table
    at lunch, declare “tabs for life,” then get out of there before the lasagna starts
    flying so you can livestream the fiasco. Developers have their preferences and
    can be quasi-religious'
  merge: -1
  img_proc: true
- pgno: 654
  md: 'Thankfully, Visual Studio is amiable. It won''t scold you for inserting tabs
    nor will it scoff at you for tapping the space bar. To customize formatting, selecting
    **Tools ▸ Options**. When the window opens, you''ll see a ton of things to configure.
    Frankly, the options contain a search bar to make it easier to find the setting(s)
    you seek.


    To change your indent style, you can find the options under **Text Editor ▸ C#
    ▸ Tabs** the following:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_654_0.png)


    To change your brace style, you can find the options under **Text Editor ▸ C#
    ▸ Formatting ▸ New Lines** like so:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_654_1.png)


    You can set up your braces by reviewing the options and checking the conditions
    for when the brace should be on a new line.'
  merge: -1
  img_proc: true
- pgno: 655
  md: "Keep in mind that any changes that you make to brace options in Visual Studio\
    \ won't be reflected in any new Unity script files. This is because Unity creates\
    \ new scripts based on — you guessed it — templates, as covered in the previous\
    \ section. To change the styling, you'll need to change the template files as\
    \ outlined in the last section. Restart Unity after making your changes.\n\nThese\
    \ changes will only affect new scripts. For existing scripts, you'll have to change\
    \ things manually.\n\n# Debugging\n\nBeing a top-level IDE, Visual Studio also\
    \ comes with a top-level Debugger. Debuggers allow you to pause your game in motion\
    \ and inspect the state of the variables.\n\nTo get started with debugging, you\
    \ first need to create a breakpoint. A breakpoint is an indicator to the Debugger\
    \ that it should pause its execution at your point. You create a breakpoint by\
    \ clicking on the gutter in the left-hand side of the editor. So doing will produce\
    \ a red dot and highlight the line in red.\n\n```\ncsharp\nvoid OnDisable() {\n\
    \    int value = 36;\n    int additionalValue = 0;\n    if (shouldProceed) {\n\
    \        additionalValue = 6;\n    }\n```\n\nThis won't stop your code — yet.\
    \ To start the Debugger, press the Play button and make sure the Unity Editor\
    \ is the current target.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_655_0.png)\n\
    \nOnce you start the Debugger, it will attach itself to the Unity editor. When\
    \ you play the game, the editor will pause at the breakpoint so that you can inspect\
    \ any variables in your game. You can do this with the Autos view."
  merge: -1
  img_proc: true
