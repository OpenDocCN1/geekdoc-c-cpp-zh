- pgno: 570
  md: 'If you try the game, you''ll notice it''s impossible to add any towers as the
    AddTowerWindow GameObject isn''t showing up on-screen. This is because the Screen
    Canvas has been replaced by a World Space Canvas. This means the elements are
    free to be placed, scaled and rotated in the game world instead of being locked
    to the screen.


    Also, take a look at the giant floating UI elements around the camera. These have
    been placed along a curved mesh.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_570_0.png)


    This lets the UI stay at a relatively constant size without being squished. Try
    looking at a poster or a TV screen from a sharp angle, and you''ll immediately
    know what I''m talking about.


    That concludes the tour of the scene. Ont making cool stuff!


    In order to use the Oculus Rift and its remote in Unity, you''ll need to download
    the newest version of the Oculus Utilities found here: https://developer.oculus.com/downloads/unity.


    Once you''ve downloaded the utilities, unzip the file and click the unitypackage.
    Open the Import Package. Press the Import button at the bottom right to import
    the package into Unity. Now, take a look at the Project view. A new folder called
    OVR has been added to the Assets folder.


    | Models |

    | Music |

    | OVR |

    | Plugins |

    | Prefabs |


    This folder includes several prefabs and scripts to help with the development
    progress.


    Before using these though, there are some things that need to be set up inside
    Unity in order for the Oculus Rift headset to work correctly.'
  merge: -1
  img_proc: true
- pgno: 571
  md: '# Setting up Unity for the Oculus Rift headset


    Unity has built-in support for the Oculus Rift headset since version 5.4, so it''s
    easy to start using it!


    Select File > Build Settings..., to open the Build Settings window and click the
    Player Settings... button. This opens up the PlayerSettings in the Inspector.


    Now check the Virtual Reality Supported checkbox to enable the Rift support.


    This list will now appear, showing all detected and enabled built-in VR SDKs:


    | Virtual Reality SDKs |

    | - Oculus |


    With that, jump over to the section called Running in the Oculus.


    # Getting started with the Oculus Go


    At the 2018 F8 developer conference, Facebook made a bit of a splash. Their long-awaited
    VR headset — Oculus Go — was released to the public for an affordable price of
    $199.99. This makes for a great low cost platform for developing VR games. Of
    course, you are limited to only three degrees of movement.'
  merge: -1
  img_proc: true
- pgno: 572
  md: '# Unity Games by Tutorials


    # Chapter 20: Virtual Reality


    The Oculus Go runs a heavily modified version of the Android operating system.
    This means you''ll need to set up Unity for publishing to the Android platform.
    Check out the Chapter 20, "Virtual Reality," on how to do this.


    Setting up your Oculus Go requires a little bit of work on your part. Thankfully,
    once you have it up, testing your game is easy and quick.


    To get started, you have to enable developer mode on the Oculus Go companion app
    on your phone. In the settings of the companion app, select your paired Oculus
    Go headset, and then select **More Settings.** From that menu, select **Developer
    Mode** and then switch it to **On.**


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_572_0.png)


    If this is the first time you are setting up your headset for developer mode,
    you''ll be prompted to set up your developer account on the Oculus website. This
    will require you


