- pgno: 232
  md: '# Winning the game


    Thankfully, you have an alternative to losing your head.


    The winning sequence will run as follows:


    +   - When the marine kills all the aliens, the hatch opens and the elevator rises.

    - Once the space marine steps onto the elevator, the elevator ascends to the ceiling
    — perhaps to elevate the marine to immortal status or the next game level. Who
    knows?


    Take a deep breath and grab your favorite caffeinated beverage — you''re in the
    home stretch!


    This section will be a great review for everything you''ve learned so far.


    First, you need to create a collider for the elevator hatch so that it knows when
    the player steps on it.


    In the Hierarchy, select the **BobbleArena** and click **Add Component**. From
    the Physics category, select **Sphere Collider**.


    First, check the **is Trigger** checkbox. Next, select **Center** to **(0, 0.22,
    0)** and **Radius** to **1.65**. Make sure to **un the component** to make it
    inactive. It only needs to be active when the marine clears the area.


    Next, click **Add Component** and select **New Script**. Name it **Arena** and
    click **Create and Add**. Open the script in your code editor.


    Add the following instance variables:


    ```

    public GameObject player;

    public Transform elevator;

    private Animator arenaAnimator;

    private SphereCollider sphereCollider;

    ```


    You need each of these to win the game:


    +   - You to access both the player and the elevator to raise the marine to the
    top of the arena.

    - The arenaAnimator will kick off the animation.

    - The sphereCollider will initiate the entire sequence.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "In Start(), add the following:\n\n```\narenaAnimator = GetComponent<Animator>();\n\
    sphereCollider = GetComponent<SphereCollider>();\n```\n\nYou should be this by\
    \ now; in here, you're getting access to the components.\n\nThere needs to be\
    \ a chain of events to specify what happens after the marine steps onto the trigger.\n\
    \nYou want the here to ride the elevator to the ceiling. Animating the player\
    \ is one approach that might work, but it's easier to make the marine child of\
    \ the elevator. As it goes up, the marine has no choice but to follow. Additionally,\
    \ the camera will try to follow, so you need to disable it.\n\nAdd the following:\n\
    \n```\nvoid OnTriggerEnter(Collider other)\n{\n    Camera.main.transform.parent.gameObject.\n\
    \    GetComponent<CameraMovement>().enabled = false;\n    player.transform.parent\
    \ = elevator.transform;\n}\n```\n\nThe first line gets the camera disables the\
    \ movement. Then the player is made into a child of the platform.\n\nYou need\
    \ to disable the player's ability to control the marine. Add the following to\
    \ OnTriggerEnter():\n\n```\nplayer.GetComponent<PlayerController>().enabled =\
    \ false;\n```\n\nThis stops the player from turning, shooting or doing anything\
    \ with the marine.\n\nNow you need to an audio cue to alert the player to the\
    \ elevator's arrival. Add the following:\n\n```\nSoundManager.Instance.PlayOneShot(SoundManager.elevatorArrived);\n\
    ```\n\nYou also need to kick off the animation, so add this line after the previous\
    \ code you entered:\n\n```\narenaAnimator.SetBool(\"OnElevator\", true);\n```\n\
    \nThis will start the animation state and work when the player enters the sphere\
    \ collider, but remember that the collider is disabled. It should be active when\
    \ the platform arrives but not before. Save and switch to Unity."
