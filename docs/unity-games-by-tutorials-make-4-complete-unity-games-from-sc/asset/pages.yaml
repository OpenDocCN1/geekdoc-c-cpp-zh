  md: 'Unity Games by Tutorials


    Chapter 6: Animation


    You''ll now have a new empty state.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_162_0.png)


    Select this new state and name it WallsRaise in the Inspector. Next, drag the
    Walls animation from the Animations folder to the Motion property. Finally, set
    the speed to -1.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_162_1.png)


    The Motion property references the actual animation clip. In this case, you''re
    using the same animation clip that you used in WallsLower. The Speed property
    lets designate how fast the clip will play. Setting the speed to 1 indicates that
    it will play at normal speed. Higher numbers make the clip run slower, whereas
    lower numbers make it run faster.


    Why - 1? Negative numbers play the clip in reverse. In this case, you''re using
    the same clip playing it in reverse at normal speed.


    You need one more state: An idle state. Open the Animation window, making sure
    the BobbleArena is selected in the Hierarchy. You''ll see the name of the currently
    displayed animation in the property list, which will be walls.


