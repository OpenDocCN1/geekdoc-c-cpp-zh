- pgno: 145
  md: '# Unity Games by Tutorials


    The problem now is that the NavMesh''s default properties expect smaller agents.
    In the Navigation window, click the **Bake tab**.


    By default, the agents are configured to be larger. Configure the following fields:


    +   - **Agent Radius:** Determines how close an agent can get to an obstacle.
    **Set it to 1.45.**

    - **Agent Height:** Determines minimum height of a ceiling for the agent to pass
    beneath. **Set it to 6.2.**

    - **Max Slope:** Determines the angle at which a slope becomes impassable for
    the agent. Leave as-is.

    - **Step Height:** Determines the minimum height at which a step becomes impassable
    for the agent. **Set it to 0.73.**


    The agent should look like the:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_145_0.png)


    Where did you get those magic numbers? They are from your NavMesh agent''s settings,
    i.e., your alien. Unity recommends you set the values to the **smallest** agent''s
    in use.


    Click the **Bake** button. Play your game once it''s fully baked. The space marine
    will promptly find that he''s the center of attention.'
