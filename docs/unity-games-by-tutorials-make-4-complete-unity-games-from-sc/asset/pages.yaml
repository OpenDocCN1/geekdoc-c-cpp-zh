- pgno: 466
  md: '# # Chapter 17: Animating in Blender

    By Mike Berg


    The journey of bringing your model to life is almost over. The only thing left?

    Animation! Nothing makes a character feel more alive than animation.


    > > Note: This chapter builds on the skills learned and the model made in Chapters

    15, "Modeling with Blender," and 16, "Texturing with Blender" I recommend you

    read through those chapters before this one.


    # ## Getting started


    Like many animation tools, Blender uses something called a **Rig** to create animation.

    Rigs are made up of (among other things) an **Armature**, which consists of one
    or more

    **Bones.** A mesh is then applied to a rig, and when the bones move, the mesh
    moves with

    it. Think of bones in Blender just like bones in your body; they give you joints
    and

    define where and how you can move.


    Here''s what the armature for your scorpion will look like:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_466_0.png)'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Creating the rig


    Start by selecting the Body object, pressing Shift-S, and selecting Cursor to
    Selected. The 3D Cursor snaps to the origin of the Body object. This is a good
    starting point for your armature.


    # Adding the first bone


    +   1. Press Shift-A and select Armature Single Bone to create your first bone.

    2. Press 3 to switch to Side view, and press Tab to enter Edit mode.

    3. It''s a bit tough to see most of the bone is inside the body geometry. In the
    Properties panel, click the Armature tab and select the X-Ray checkbox, so that
    you can see bones even when they are inside an.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_467_0.png)


    Edit mode for bones is slightly different from editing meshes. A bone can be selected
    by clicking on the middle part of the bone. Each bone also has two ends, that
    appear as spheres at the end of each bone. These ends can be selected and moved
    independently by clicking on one and pressing G to grab (move) it.


    > Note: When you have an armature selected, the “Object Mode/Edit mode” pop-up
    has a new item in: Pose mode. Be careful not to accidentally enter Pose mode when
    you need to be in Edit mode. In Pose mode, the bones display with a light blue
    outline.'
  merge: -1
  img_proc: true
- pgno: 468
  md: 'Select the top end of the bone and press G to move it to the right. Line it
    up with the end of the segment — and closer to the top than the bottom — as shown
    here:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_468_0.png)


    # # Using ''Extrude'' to create more bones


    Press E and drag your mouse to the right to Extrude the bone''s end, creating
    a whole new bone. Click when you are happy with the new bone''s position.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_468_1.png)


    Repeat the extrude step to create a bone for each segment of the tail. The curve
    of the tail should be slightly concave; this will help us out, when you curl the
    tail upward.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_468_2.png)


    # # Attaching the mesh to Object armature


    Press Tab to return to Object mode. Press A to Select None. Click the Body object
    to select it, then hold Shift and click the armature, so they are selected. This
    can be hard to do in the 3D View, because the armature is inside the body. If
    so, use the Outliner, at the top-right, to make the selection.


    > Note: Selection order matters. Make sure you select the armature last.'
  merge: -1
  img_proc: true
- pgno: 469
  md: '1. Press Ctrl-P and select Set Parent To Armature Deform ▸ With Automatic Weights.


    2. Nothing will appear to change, but if you look in the Outliner, you''ll see
    that the Body is a child of the Armature.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_469_0.png)


    # # Pose mode


    Here''s where the real fun begins. Click the Object Mode pop-up at the bottom
    of the screen and select Pose mode. Click the second bone in the armature and
    press R to rotate it. The tail moves with it!


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_469_1.png)


    Now, that''s definitely cool, animating this tail by rotating each individual
    joint would be a pain. Frankly, there''s an easier way...


    # # Inverse Kinematics


    The animation style just described (rotating each tail bone one at a time, until
    you get to the end of the tail) is known as Forward Kinematics. Inverse Kinematics
    uses a target bone that the entire chain aims at. Moving the IK Target automatically
    adjusts the rotation of the bones in the chain. This way, you only have to animate
    one'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'Switch back to Edit mode, and right-click to the right of the spiked ball to
    move the 3D Cursor there.


    Press Shift-A to add a new bone. Press A, then click the body of the bone, to
    select the entire.


    In the Properties panel, click the Bone tab and change the name of the bone to
    Tail IK. It''s a good idea to name all your bones, especially the ones you plan
    to animate; you will identify them by later names in the Animation window.


    Near the bottom of the Bone Properties panel, deselect the Deform checkbox. You
    do not want this bone to deform the mesh.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_470_0.png)


    # Creating the IK Target


    Switch to Pose mode. Select the IK bone first, then Shift-select the last bone
    in the tail.


    Press Shift-Ctrl-C to open the Add Constraint (with Targets) menu. Under Tracking,
    select Inverse Kinematics.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_470_1.png)


    Select the last bone in the tail (it is now highlighted yellow). In the Properties
    panel, click the Bone Constraints tab and look for the Chain Length. The tail
    has five bones, so change the Chain Length to 5. This limits the number of bones
    that are affected by the IK target.


    Select the Tail IK bone and press G to move it over the body of the model. Now
    that is magic!'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# Creating a Pole Target for the tail


    This rig is working well, but it can be even better. If you were to animate it
    now, the spiked ball would always lead the way, and the tail would follow. It
    would look a bit like the head of a snake moving around. That might look cool,
    but it would also have the effect of making that spiked ball look light weight.


    Think of a pitcher throwing a baseball. He draws his elbow back first, then his
    forearm and the ball follows.


    To make your spiked ball heavy and feel real, you need to be able to move the
    tail separately, so that it can lead and the ball can follow. To do this, use
    something called a Pole Target.


    +   1. Switch to Edit mode. Notice how the pose you made in Pose mode is not shown;
    the model snaps back to its “Rest Position”. Don’t worry, your pose is still saved.
    Right-click below the tail to move to the 5D Cursor, as shown.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_471_0.png)


    +   2. Press Shift-A to add a bone. Press A to Select None, then click on the
    middle of the bone to select it.


    +   3. In the Properties panel, switch to the Bone tab and rename the bone to
    Tail Pole Target. Don’t forget to deselect the Deform checkbox.'
  merge: -1
  img_proc: true
- pgno: 472
  md: '# Unity Games by Tutorials


    # Chapter 17: Animating in Blender


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_0.png)


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_1.png)


    +   4. Switch back to Pose mode and select the yellow bone at the end of the tail.
    In the Properties panel, click the Bone Constraints tab, click the Pole Target
    field, and select the Armature. Another field appears below lets you choose the
    specific bone. Select the Tail Pole bone.


    +   5. Press 1 to switch to Front view. It doesn''t look quite right... the tail
    is pointed to the side, instead of the Pole Target!


    +   6. Back in the Bone Constraints tab, find the Pole Angle field. Click and
    drag side-to-side to adjust this number and see how the changes affect your model
    in real time. In this case, a value of -90 degrees works perfectly.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_2.png)


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_3.png)


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_4.png)


    3 to go back to Side view, then select the Tail Target bone and press 1 again
    to switch back to Front View. Move the bone left and right (G to grab) to see
    how it affects the tail.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_5.png)


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_472_6.png)


    Fantastic! The rig for the tail is now complete.


    raywenderlich.com


    473'
  merge: -1
