- pgno: 140
  md: '# Unity Games by Tutorials


    First, you need access to the NavMeshAgent classes. Underneath the using statements,

    add the following:


    ```

    using UnityEngine.AI;

    ```


    Add the following variables underneath the opening class brace.


    ```

    public Transform target;

    private NavMeshAgent agent;

    ```


    The target is where the alien should go — notice the variable name doesn''t reference

    hero. You don''t always want the aliens to chase the hero. For instance, the

    hero might throw a noise maker to attract aliens to a certain area and now mow
    them

    or, or maybe he''ll get a powerup that makes the aliens turn on each other.


    By making the enemies'' goal a target instead a certain character, you leave yourself

    open to manage game design opportunities.


    Next, add the following to Start():


    ```

    agent = GetComponent<NavMeshAgent>();

    ```


    This gets a reference to the NavMeshSo you can access it in code. Now, in Update(),

    add the following code:


    ```

    agent.destination = target.position;

    ```


    Save the file and switch over to GameManager.cs to set the target for the alien.


    Return to where you left off in Update(), and add the following code just after
    the line

    sets newAlien.transform.position:


    ```

    Alien alienScript = newAlien.GetComponent<Alien>();

    ```


    This gets a reference to the Alien script. Now, add:


    ```

    alienScript.target = player.transform;

    ```


    This sets the target to the space marine''s current position.


    Finally, the alien should rotate towards the hero right after being spawned. Otherwise,

    it''ll squander time by rotating instead of attacking. Add this to:


    ```

    Vector3 targetRotation = new Vector3(player.transform.position.x,

    newAlien.transform.position.y, player.transform.position.z);

    newAlien.transform.LookAt(targetRotation);

    ```


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_140_0.png)


    141'
  merge: -1
  img_proc: true
