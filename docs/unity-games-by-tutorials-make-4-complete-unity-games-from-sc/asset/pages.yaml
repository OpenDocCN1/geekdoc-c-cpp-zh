- pgno: 512
  md: "# Unity Games by Tutorials\n\nThis simple variable controls both the speed\
    \ of scaling and if the GameObject should shrink or grow. Negative values make\
    \ the object shrink, positive ones — you guessed — makes them grow.\n\nAdd this\
    \ line inside Update():\n\n```\ntransform.localScale += (new Vector3(scaleSpeed,\
    \ scaleSpeed,\nscaleSpeed) * Time.deltaTime;\n```\n\nThis is what actually does\
    \ the scaling. It adds the scaleSpeed to all three axes every frame. There's no\
    \ use case for this yet. But stayed tuned there will be pretty soon!\n\nSave this\
    \ script and open the UtilityMethods script inside the Scripts Utility folder.\n\
    \nThis script is actually a simple class, not a MonoBehaviour. It holds static\
    \ methods that can be called from all scripts.\n\nYou'll add a very useful method\
    \ SmoothlyLook, which allows GameObjects to rotate and look at a certain position\
    \ using interpolation.\n\nAdd this method underneath MoveElementToWorldPosition(),\
    \ right after the last accolade:\n\n```\n// 1\npublic static Quaternion SmoothlyLook(Transform\
    \ fromTransform,\nVector3 toVector3)\n{\n// 2\nif (fromTransform.position == toVector3)\
    \ {\n    return fromTransform.localRotation;\n}\n// 3\nQuaternion currentRotation\
    \ = fromTransform.localRotation;\nQuaternion targetRotation = Quaternion.LookRotation(toVector3\
    \ -\nfromTransform.position);\n// 4\nreturn Quaternion.Slerp(currentRotation,\
    \ targetRotation,\nTime.deltaTime * 10);\n}\n```\n\nHere's what each part does:\n\
    \n+   1. SmoothlyLook() takes two parameters: The Transform, which has to be rotated\
    \ and the position where it wants to look. It returns a Quaternion, which is the\
    \ new local rotation for the Transform.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_512_0.png)"
  merge: -1
  img_proc: true
- pgno: 513
  md: 'It''s also static, which means that — as you may remember — it can be called
    from any class without having to have a reference to beforehand.


    +   2. This check makes sure that the method stops executing the origin point
    and destination are the same, which would create a zero-length vector. The LookRotation()
    method doesn''t float like that so it''s in place.


    +   3. This blocks the current rotation and creates the target rotation for the
    Transform by using the LookRotation() method.


    +   4. This is the actual method that makes the rotation interpolate, Lerp().
    It might sound like some sort of frozen beverage. But in reality it''s a handy
    way of getting a value between two other values (also called tweening) with a
    distinct beginning and end.


    The SmoothlyLook() method can be used to replace the popping rotation of the enemies
    with a nice turn.


    Save this script, open up the Enemy script and remove this line from the UpdateMovement()
    method:


    ```

    transform.LookAt(targetPosition);

    ```


    Put this in its place:


    ```

    transform.localRotation = UtilityMethods.

    SmoothlyLook(transform, targetPosition);

    ```


    Now save the Enemy script and return to the editor. Make sure you have at least
    one enemy in the scene and press the Play button. You should now see the enemy
    turning smoothly at turns and edges. Finally, delete any enemies left in the Hierarchy.


    That''s it! Three handy utilities for Runstrife — and for your own games if you
    like.


