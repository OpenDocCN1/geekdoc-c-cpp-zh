- pgno: 95
  md: '# # Chapter 4: Physics

    By Brian Moakley


    Physics is one of those subjects that triggers nightmare flashbacks of my high
    school days when rolling toy cars down slopes was the peak of intellectual pursuit.
    If you''re like me, then the notion of learning physics is about as exciting as
    watching a download progress meter.


    Don''t worry: Unity makes physics fun. Its built-in physics engine allows you
    to easily create games with explosions, guns and bodies smashing into beautiful
    walls — without having to study a boring textbook.


    In this chapter, you''ll learn how Unity''s physics engine works, and use it to
    add collision detection, raycasts and even bobbleheads into the game. Let''s get
    started!


    # ## Getting started


    Open your existing project, or you can open the starter project for this chapter.


    Currently, the space marine can run around the arena and shoot things. However,
    with no targets and no ability to turn around, he''s bored and prone to sneak
    attacks. He also has the superhero ability of walking through walls. You''re going
    to solve these problems with physics!'
  merge: -1
  img_proc: true
