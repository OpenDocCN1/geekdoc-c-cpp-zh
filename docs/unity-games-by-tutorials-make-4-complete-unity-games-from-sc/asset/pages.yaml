- pgno: 166
  md: '# Unity Games by Tutorials


    The trigger is a distinctive Unity condition type that behaves like a bool, except
    it resets itself after an animation.


    Select the **transition arrow** between ArenaIdle and WallsLower to see your blending
    options in the Inspector.


    **Uncheck Has Exit Time** to tell Unity you want the animation to conclude immediately
    instead of waiting until the end of the animation. Otherwise, Unity will take
    additional time to blend the animation with the next animation.


    In the Conditions section, **click the plus sign**. Since you have only one parameter,
    the IsLowered property will populate the field; set it to **true**.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_166_0.png)


    The reason you did this is because you will set the IsLowered boolean in code
    when you want the animation to trigger. By setting the condition that IsLowered
    must be true for this animation to run, once you set it in code, the animation
    will play.


    You need to make one more small adjustment before playing the game. In the Animator
    window, **right-click ArenaIdle** and elect **Set as Layer Default State** from
    the options.'
