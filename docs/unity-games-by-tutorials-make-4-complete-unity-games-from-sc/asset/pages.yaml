- pgno: 611
  md: '# Unity Games by Tutorials


    The editor will now re-import all assets to optimize them for Android. Open up
    the Build Settings window and click Player Settings... to open the Player Settings
    view in the Inspector.


    Open the Resolution and Presentation module:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_611_0.png)


    Here''s what all of these options:


    +   **Preserve Framebuffer Alpha:** When enabled, it preserves the alpha value
    in the framebuffer to rendering over native UI.


    +   **Resolution Scaling Mode:** When enabled, you can pass a custom fixed DPI
    to use. This allows you to use a lower internal resolution that the screen resolution.
    Doing this can drastically improve performance.


    +   **Blit Type:** This changes how we content is drawn to the screen. **Always**
    is selected by default, it renders the content offscreen then blits (copies) it
    to the screen. **Never** renders directly to the screen and is a lot faster, but
    not compatible with all configurations. **Auto** chooses between offscreen or
    direct.Generally, it''s a good idea to set this to Auto for its performance gains.


    +   **Aspect Ratio Mode:** This lets you define custom aspect ratios. The default
    is Native Aspect Ratio, which uses the device''s native ratio.


    +   **Default Orientation:** By default this is set to **Auto Rotation**, which
    means it will always render the game at the device''s orientation and size, whether
    it''s landscape or portrait.


    This is not usually what you want. Most mobile game developers design the game
    and UI around particular orientation, which is also the case with Runestrike.
    It will only look correct in landscape — unless, is, you want to nail that “peeking
    through a keyhole” feel.


    raywender.com


    612'
  merge: -1
  img_proc: true
- pgno: 612
  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_612_0.png)


    Be sure that **Default Orientation** is set to **Landscape Left** for this project.
    This fixes the orientation so the top of your device goes left while the bottom
    goes right.


    +   **Use 32-bit Display Buffer:** Use 32-bit colors instead of 16-bit. When this
    is off, you may see color banding on gradients and textures using soft alpha blends.
    Keep this unless you really need the memory benefit of turning this off.


    +   **Show Loading Indicator:** Show Android''s native loading indicator in the
    corner. Always set this to **Don''t Show**. The loading indicator looks unprofessional
    and doesn''t add any value.


    Moving on to **Other Settings** and the **Identification** section:


    | Identification | com.raywenderlich.runestrike |

    |---|---|

    | Bundle Identifier Version* | 1.0 |

    | Bundle Version Code | 1 |

    | Minimum API Level | Android 4.4 ''Kit Kat'' (API level 19) |


    These settings are **extremely** important for publishing and updating Android
    games:


    +   **Bundle Identifier:** The string used to uniquely identify your game. You
    set this up once per game, never change it again. Otherwise, it would be considered
    a different game. The format of this string is: **com.[DEVELOPER].\[GAME NAME\]].**


    +   **Version:** The version of the game. This could be **1.0, 2.4.0.1** or **Unicorn
    Rainbow** — it''s your choice.


    +   **Bundle Version Code:** This is the number you have to increment every time
    you build a new version of your game for publication.'
