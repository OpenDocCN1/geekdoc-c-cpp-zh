    > Note: Don''t forget to save. If you want to look at the rig I made, open **02-Scorpion-Rigged.blend**
    in the Resources folder.


    # # Animation


    Creating animation in Blender is similar to most other animation apps; it uses
    **keyframes** and **tweening**.


    A keyframe is a point in the **timeline** where you have specified the position,
    for example, of an object. Then you set another keyframe at a different point
    in time, the object in a different position.'
