- pgno: 252
  md: "# Ammunition logic\n\nTo get the gun firing, you have to determine a fire rate.\
    \ When the player fires a gun, you want there to be a pause between each bullet.\
    \ This means you must keep track of when the last bullet has fired so that you\
    \ can fire the next.\n\nCreate a C# script, name it Gun, edit it and add the following\
    \ variables to the class:\n\n```\npublic float fireRate;\nprotected float lastFireTime;\n\
    ```\n\nfireRate is the speed at which the gun will fire, and lastFireTime tracks\
    \ the last time the gun was fired.\n\nUpdate Start() in Gun to:\n\n```\nvoid Start()\n\
    {\n    lastFireTime = Time.time - 10;\n}\n```\n\nThis sets lastFireTime to 10\
    \ seconds ago. When the game starts, the player will be able to fire the gun immediately.\n\
    \nFinally, replace Update() with the following:\n\n```\nprotected virtual void\
    \ Update()\n{\n}\nprotected void Fire()\n{\n}\n```\n\nYou will subclass these\
    \ later on, as each weapon will have its own slight variation on these methods.\n\
    \nSave your work and switch back to Unity. Create a C# script, name it Pistol\
    \ and replace its contents with the following:\n\n```\nusing UnityEngine;\npublic\
    \ class Pistol : Gun\n{\n    override protected void Update()\n{\n        base.Update();\n\
    \        // Shotgun & Pistol have semi-auto fire rate\n        if (Input.GetMouseButton(0)\
    \ && (Time.time - lastFireTime)\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 253
  md: "> > fireRate\n{\n  lastFireTime = Time.time;\n  Fire();\n}\n\nThis checks whether\
    \ enough time has elapsed between shots to allow for another one. If there is,\
    \ it will trigger the gun firing animation — you'll add that in just a moment.\n\
    \nSave your work and switch back to Unity. Attach your Pistol script to the 1Pistol\
    \ GameObject.\n\nNote that the fireRate hasn't been set. Click on the 1Pistol\
    \ GameObject and set the fireRate to 0.6.\n\nExcellent. Now it's time for the\
    \ shotgun. Select the Pistol script and press Control-D (or Command-D on a Mac).\
    \ This will duplicate the script. Change the name to Shotgun. Open the script\
    \ in your code editor and replace this:\n\n```\npublic class Pistol : Gun\n```\n\
    \nWith this:\n\n```\npublic class Shotgun : Gun\n```\n\nAs with the pistol, this\
    \ will be a semi-automatic weapon but, since it's a shotgun, it needs a longer\
    \ time between shots. Save your work and switch back to Unity. Attach the Shotgun\
    \ script to the 3Shotgun GameObject and set the fireRate to 1.\n\nFinally, you\
    \ need to do the same with the assault rifle. Create a script named AssaultRifle,\
    \ attach it to the 2AssaultRifle GameObject, and replace its contents with the\
    \ following:\n\n```\nusing UnityEngine;\npublic class AssaultRifle : Gun {\n \
    \ override protected void Update() {\n    base.Update();\n    // Automatic Fire\n\
    \    if (Input.GetMouseButton(0) && Time.time - lastTime > fireRate) {\n    lastFireTime\
    \ = Time.time;\n    Fire();\n  }\n}\n```\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_253_0.png)"
  merge: -1
  img_proc: true
