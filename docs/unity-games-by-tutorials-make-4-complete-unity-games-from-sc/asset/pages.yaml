- pgno: 388
  md: "# Unity Games by Tutorials\n\n# Chapter 14: Saving Data\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_388_0.png)\n\
    \nYour first step is to create a new class that will hold two different values\
    \ in public fields.\n\nYou'll use a DateTime type field to store the date and\
    \ the best time run happened, and a Decimal type field to store the actual runtime\
    \ level in seconds.\n\nIn the Project view, open the Scripts folder and right-click\
    \ in the empty space. Choose the option to create a new C# script and name it\
    \ PlayerTimeEntry. Open it for editing.\n\nReplace the contents of the default\
    \ Unity MonoBehaviour script for PlayerTimeEntry.cs with the following:\n\n```\n\
    using System;\n\n[Serializable]\npublic class PlayerTimeEntry\n{\n    public DateTime\
    \ entryDate;\n    public decimal time;\n}\n```\n\nAt the top of the class, you'll\
    \ notice the Serializable marker, which allows the binary formatter to serialize\
    \ and deserialize — a.k.a. pack to pack and unpack — this data class.\n\nSave\
    \ your work.\n\n> Note: By the way, this script is different from your usual MonoBehaviour\
    \ script — it won't inherit from MonoBehaviour. You'll use this class with the\
    \ binary serialization system, and as such, it'll only be used to store data.\
    \ It doesn't need to know or hold anything else except for the two values that'll\
    \ be used to store a time entry.\n\nNext, you'll be extending the GameManager.cs\
    \ singleton script to handle saving and loading level runtime entries.\n\nOpen\
    \ the GameManager.cs script for editing. Add the following new using statements\
    \ to the top:\n\n```\nusing UnityEngine.UI;\n```"
