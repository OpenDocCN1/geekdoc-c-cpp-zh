    to the GameObject to assign to the Head.


    Switch back to PlayerController.cs. Add the following underneath Update():


    ```

    void FixedUpdate(){


    }

    ```


    As you know, Update() runs with every frame and it''s called as often as the frame
    changes, so 40 frames per second means it''s called 40 times per second.


    FixedUpdate() is an entirely different beast. Because it handles physics, it''s
    called at consistent intervals and not subject to frame rate. If you were to use
    the deltaTime between each call to FixedUpdate(), you''d see it change.


    Anything that affects a Rigidbody should be updated in FixedUpdate(). Given that
    you are forcing force to a Rigidbody to move the bobblehead, you need to use FixedUpdate()
    instead of Update().


