- pgno: 4
  md: '# About the editors


    Adrian Strahan is a tech editor of this book. Adrian is a full-time Product Owner
    and part-time iOS developer living in the South West of England. When he''s not
    working, Adrian is either running, gardening or building Lego models.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_4_0.png)


    Manda Frederick is the editor of this book. She has been involved in publishing
    for over years through various creative, educational, medical and technical print
    and digital publications, and is thrilled to bring her experience to the raywenderlich.com
    family as Managing Editor. In her free time, you can find her at the climbing
    gym, backpacking in the backcountry, hanging with her dog, working on poems, playing
    guitar and exploring breweries.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_4_1.png)


    Brian Moakey is the final editor of this book. Brian is an instructor who produces
    video tutorials on iOS, Unity, and various other topics. When not writing or coding,
    Brian enjoys story driven first person shooters, reading genre fiction, and epic
    board game sessions with friends.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_4_2.png)


    # About the artists


    Mike Berg made all of the 3D models, animations, and textures for this book. He
    is a full-time game artist who is fortunate enough to work with many indie game
    developers from all over the world. When he''s not manipulating pixel colors,
    he loves to eat good food, spend time with family, play games and be happy. You
    can check out his work at: www.weheartartgames.com


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_4_3.png)


    Vinnie Prabhu created all of the music and sounds for the games in this book.
    Vinnie is a music composer/software engineer from Northern Virginia who has done
    music sound work for concerts, plays and video games. He''s also a staff member
    on OverClocked ReMix, an online community for music and video game fans. You can
    find Vinnie on Twitter as @palpablevt.


