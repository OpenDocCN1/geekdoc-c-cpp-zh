    # Layers and sorting


    When arranging sprites on screen in a 2D environment, you don''t work with a z-axis
    like you do in 3D. Instead, you think in terms of Sorting Layers and Order in
    Layer.


    Think of this concept as pieces of glass stacked atop each other with sprites
    between each layer. You''re viewing the stack from the top, so what''s visible
    and hidden depends on the stack order.'
