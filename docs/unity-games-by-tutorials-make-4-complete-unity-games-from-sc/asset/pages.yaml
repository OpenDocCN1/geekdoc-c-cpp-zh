- pgno: 277
  md: "# Adding damage effects\n\nNow is the perfect time to add damage logic to the\
    \ game. The missiles should damage the player, and the player's gunshots should\
    \ damage the robots.\n\nCreate a new C# script, name it Player and add the following\
    \ variables:\n\n```\npublic int health;\npublic int armor;\npublic GameUI gameUI;\n\
    private GunEquipper gunEquipper;\nprivate Ammo ammo;\n```\n\nhealth is the remaining\
    \ life of the player. When this hits zero, it's time to grab another quarter!:\n\
    \narmor is a special layer for the player that results in 50% reduced damage.\
    \ Once armor reaches zero, then the player receives full damage.\n\ngameUI and\
    \ gunEquipper are simply references to their respective script types. ammo is\
    \ a reference to the Ammo class you created earlier to track weapon ammo.\n\n\
    Add the following to Start():\n\n```\nvoid Start ()\\{\n  ammo = GetComponent<Ammo>();\n\
    \  gunEquipper = GetComponent<GunEquipper>();\n}\n```\n\nThis just gets the Ammo\
    \ and GunEquipper component attached to the Player GameObject.\n\nAdd the following\
    \ method:\n\n```\npublic void TakeDamage(int amount) G{\n  int healthDamage =\
    \ amount;\n\n  if (armor > 0)\n  {\n    int effectiveArmor = armor * 2;\n    effectiveArmor\
    \ -= healthDamage;\n  }\n  // If there is still armor, don't need to process\n\
    \  // health damage\n  if (effectiveArmor > 0)\n  {\n    armor = effectiveArmor\
    \ / 2;\n    return;\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 278
  md: "# Unity Games by Tutorials\n\n```\narmor = 0;\n}\nhealth -= healthDamage;\n\
    Debug.Log(\"Health is \" + health);\nif (health <= 0)\n{\n  Debug.Log(\"GameOver\"\
    );\n}\n\n```\n\nTakeDamage() takes the incoming damage and reduces its amount\
    \ based on how much the player has remaining. If the player has no armor, then\
    \ you apply the total damage to the player's health.\n\nIf health reaches zero,\
    \ it's game over for the player; for now, you just log this to the console.\n\n\
    Save your work and switch back to Unity. Add the Player script to the Player GameObject.\
    \ Set Health to 100, Armor to 20, and drag the GameUI GameObject over the GameUI\
    \ field. You'll incorporate armor later in the game.\n\nNext, you need to update\
    \ the Missile script to actually tell the player to take damage.\n\nWhen the Missile\
    \ GameObject collides with the Player Capsule Collider, it will damage the player\
    \ via OnCollisionEnter(). Open the Missile script in the code editor and add the\
    \ following method:\n\n```\nvoid OnCollisionEnter(Collision collider)\n{\n  if\
    \ (collider.gameObject.GetComponent<Player>() != null\n  && collider.gameObject.tag\
    \ == \"Player\")\n{\n    collider.gameObject.GetComponent<Player>().TakeDamage(damage);\n\
    \  }\n\n  Destroy(gameObject);\n}\n```\n\nThe script checks if the Missile GameObject\
    \ collided with the Player GameObject based on its tag. It also checks to if the\
    \ player is still active, since the Player component will be disabled later in\
    \ the game-over state. If so, it tells the Player script to take damage and passes\
    \ along its damage value. Once the missile hits the player, it destroys itself.\n\
    \nSave your work and switch back to Unity."
  merge: -1
  img_proc: true
- pgno: 279
  md: "Unity Games by Tutorials\n\nClick Play and stand in the line of missile fire.\
    \ Watch as the console logs out the health of the player. In the Chapter 11, \"\
    Introduction to the UI,\" you'll add a user interface so the the health will be\
    \ clearly visible on screen, but the console will just fine for now.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_279_0.png)\n\
    \nYour game logs GameOver when the player's health hits zero. Later on, you'll\
    \ code a proper game-over screen.\n\nThose pesky robots are still invincible.\
    \ It's time for them to take some damage, too.\n\nOpen the Robot script and add\
