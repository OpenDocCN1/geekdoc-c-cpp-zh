  md: "# Tower Info window and upgrading\n\nThe **Tower Info window** lets players\
    \ check what the level of a tower is and upgrade it if they can afford to.\n\n\
    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_549_0.png)\n\nYou can find the window\
    \ in the scene as a child of the **Screen Canvases**; it's simply a window without\
    \ any functionality at the moment. To add that, create a new **C# Script** named\
    \ **TowerInfoWindow** in the **Scripts ▸ Game ▸ UI** folder and add it in your\
    \ code editor. Remove both the `Start()` and `update()` methods completely and\
    \ add this line under the other using using statements:\n\n```\nusing UnityEngine.UI;\n\
    ```\n\nAdd these variables right under the class declaration:\n\n```\n//1\npublic\
    \ Tower tower;\n//2\npublic Text txtInfo;\npublic Text txtUpgradeCost;\n//3\n\
    private int upgradePrice;\n//4\nprivate GameObject btnUpgrade;\n```\n\nHere's\
    \ what these variables are for:\n\n+   1. Reference to the tower that can be upgraded.\n\
    2. The Text components for the info and the text on the button.\n3. The gold cost\
    \ to upgrade the tower.\n4. Reference to the upgrade button.\n\nNow, add these\
    \ methods underneath:\n\n```\n//1\nvoid Awake()\n{\n    btnUpgrade = txtUpgradeCost.transform.parent.gameObject;\n\
    }\n```"
