- pgno: 568
  md: '# # Chapter 20: Virtual Reality

    By Eric Van de Kerckhove


    For centuries, humans have been fascinated by the idea of virtual worlds taht
    they could step into: An escape from reality where anything is possible. From
    panoramic paintings that were so large they gave the illusion of actually stepping
    into them, to stereoscopic viewers, primitive head mounted displays and Nintendo’s
    Virtual Boy, people have been searching for a portal to the land of endless imagination
    for a long time.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_568_0.png)


    Virtual reality has become an accessible technology in the last few years. Individuals
    can be transported into virtual worlds and interact with its inhabitants from
    the comfort of their homes using modern state-of-the-art head-mounted displays
    (HMD) and unique techniques to accept user input. Two especially popular devices
    are Oculus Rift and HTC Vive, both offering experiences never seen before.


    In this chapter, you’ll learn how to use this bleeding edge tech in Runestife,
    which will get you ready to use it in your own projects. You’ll transform Runestife
    into a VR game, and learn how to use Oculus Rift and HTC Vive with Unity.'
  merge: -1
  img_proc: true
- pgno: 569
  md: "Unity Games by Tutorials\n\nChapter 20: Virtual Reality\n\n> Note: Everyone\
    \ has a different reaction to movement and rotation while wearing an HMD. If it's\
    \ your first time, be sure to take it easy and take a break if you feel nauseated\
    \ or uncomfortable. Most people get used to VR quite quickly. So don't fret if\
    \ you're not feeling well the first few times — the feeling will probably pass.\n\
    \nYou can jump straight to the section that matches your VR device of choice.\
    \ There is a bit of overlap between the two, but they're different enough that\
    \ each warrants its own section!\n\n# Getting started with Oculus Rift\n\nIf you\
    \ don't have an Oculus Rift headset yet, you can order one from the Oculus website\
    \ (www.oculus.com). Make sure your PC meets the recommended requirements. Once\
    \ you've got it by your side, set up the hardware and install the newest software\
    \ drivers.\n\nNow, open up the Oculus app and click on the Settings button:\n\n\
    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_569_0.png)\n\nClick on the text on the\
    \ left that says General to open the General settings. Make sure that Unknown\
    \ Sources is enabled:\n\n| Unknown Sources |\n Allow apps that haven't been reviewed\
    \ by Oculus to run on my Rift. Learn more. |\n\nThis will permit games that haven't\
    \ been reviewed by Oculus (like Runestep) to run on its hardware. It's necessary\
    \ to enable this before you can do any development.\n\nWith that out of the way,\
    \ open up the Oculus starter project in Unity. Open the Game scene and take a\
    \ look around in the Scene view.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_569_1.png)\n\
    \nraywenderlich.com\n\n570"
