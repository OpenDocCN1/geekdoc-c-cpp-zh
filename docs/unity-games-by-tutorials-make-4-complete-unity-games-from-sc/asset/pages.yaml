- pgno: 384
  md: '# # Chapter 14: Saving Data


    By Sean Duffy


    Unity provides a multitude of options for saving game data. In this chapter, you''ll
    learn some excellent ways to store and retrieve player data, such as user profiles,
    level runtimes, scores and even custom levels for the game.


    # ## Getting started


    For this chapter, you''ll pick up where Chapter 13, "More Unity 2D," left off.
    Even if you finish Chapter 13, open the SuperSoyBoy starter project for this chapter
    in the Unity editor — it has some extras that''ll make it easier to get you up
    and running.


    There''s a new Menu scene that includes basic UI to carry you through these exercises
    in saving data. The other notable change is that the GameManager singleton is
    now in the Menu scene.


    Load the Menu scene from the Scenes folder.


    # ## Three ways to work with saved data


    This chapter will walk you through three ways to save and load player data in
    Unity.


    +   - PlayerPrefs: The easiest, fastest way to save and load data.

    - Binary Serialization: A good way to handle sensitive data or accommodate more
    complex objects than PlayerPrefs.

    - Unity JSON Serialization: Unity introduced the JSONUtility class in version
    5.3, which allows you to pack data and unpack data with the popular JSON text-based
    format.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# Storing the player’s name with PlayerPrefs


    > Note: JSON stands for JavaScript Object Notation. It''s a lightweight data-interchange
    format, with a nice benefit of being friendly for humans to read and write. It''s
    also amiable to parsing and generating from your code.


    PlayerPrefs works by using a system of keys (names) with associated values (data).
    To save a value, you use one of the set methods available in the PlayerPrefs class
    to set the value of a key.


    To get a feel for how it works, you''ll write code to save the player''s name
    from the Main menu. Here''s an example of three keys with their corresponding
    values: a string, integer and a float.


    | Key | Value | Type |

    | --- | --- | --- |

    | PlayerName | Sean | String |

    | Score | 1000 | Integer |

    | Distance | 410.0135 | Float |


    The key is like a bookmark that points to the value you need to store. When you
    want to find this value again, you use one of PlayerPrefs'' get("key"), to retrieve
    the value, passing in the name of the desired key.


    +   * PlayerPrefs.SetInt() / PlayerPrefs.GetInt(): Used to save or load integer
    values.

    * PlayerPrefs.SetFloat() / PlayerPrefs.GetFloat(): Used to save or load float
    values.

    * PlayerPrefs.ة() / PlayerPrefs.GetString(): Used to save or load string values.'
  merge: -1
  img_proc: true
