- pgno: 151
  md: '# # Chapter 6: Animation


    By Brian Moakley


    At this point, you''ve learned how to move GameObjects in Unity in a variety of
    ways, including:


    +   **Writing scripts to manually change the position.** You learned this in Chapter
    3, "Components," when you wrote scripts to move the player, camera and bullets.

    **Using the Character Controller.** You learned this in Chapter 4, "Physics,"
    when you replaced the player movement script with the built-in Character Controller,
    which has powerful functionality and is often easier than writing movement scripts
    on your own.

    **Letting the Unity physics engine move objects for you.** You learned this in
    Chapter 4, "Physics," when configured the space marine''s bobblehead by attaching
    it to the body with a joint and periodically applying a force to make it bubble.

    **Employing the navigation system to move objects on your behalf.** You learned
    this in Chapter 5, "Pathfinding," when you configured the aliens as a NavMesh
    agent and gave it a target so that they could pathfind their way to the space
    marine.


    There''s another important way to move GameObjects in Unity that you haven''t
    explored yet: The animation system, otherwise known as Mecanim.

    **Mecanim** is a powerful system that allows you to animate models as well as
    *every exposed property* in Unity.


    That''s right, if you can set a value in the Inspector, and you can animate that
    value over time! Powerful stuff.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Getting started


    The first animation that you will create is a simple animation to make the arena
    walls go up and down.


    This is because, there''s an issue. As the space marine moves towards the camera,
    the wall blocks your view of him. This is *bad mojo*; not only can you see what
    you''re shooting, but the spawning aliens can attack instantly.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_152_0.png)


    Causing people to lose because their view was blocked is no way to win gamers''
    hearts and minds!


    One technique to solve the problem is to make the wall transparent, but that doesn''t
    solve the problem of the partially obscured play area. For slow-paced games, it
    wouldn''t be a serious problem, but fast reaction times are required to win *Bobblehead
    Wars*.


    To solve the problem, you''ll lower the walls of the arena when the player gets
    close and raise them when the player walks away.


    # The animation window


    Open your project from Chapter 5, "Pathfinding." If you''re reading these chapters
    out of order, feel free to open the starter project that''s located in the resources
    for this chapter.


    You''re going to animate various child GameObjects of the BobbleArena. You could
    animate them individually, but this technique will have you grouping child GameObjects
    together, which is far more efficient.


    In the Hierarchy, select the **BobbleArena** GameObject. Click **Window\Animation**
    to open the Animation window.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "The window has several sections, and you'll spend quite a bit of time here\
    \ in this chapter.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_153_0.png)\n\n\
    On the left, you have a Property List where you select the properties you intend\
    \ to animate. On the right, you have the Dope Sheet where you create keyframes\
    \ — more on in a moment.\n\nAbove the dope sheet is the Timeline where you scrub\
    \ back and forth on the animation to preview how it looks. Finally, above the\
    \ property list, you'll see Frame Navigation where you control playback and animation\
    \ events.\n\nAnimation events allow you to run code at certain frames in animation.\n\
    \n# Introducing keyframe animations\n\nUnity anim objects through the use of keyframe\
    \ animation.\n\nIn keyframe animation, you set up a series of pairs (time, value)\
    \ to indicate how you want an object to animate over time. You don't need to specify\
    \ every single second; the beauty is that the game engine will automatically calculate\
    \ the values in your keyframes.\n\nFor example, say you have a cube at ($\theta$,\
    \ $\theta$, $\theta$) that you want to move to ($\theta$, 10, 10, 0) two seconds\
    \ later. Then you would set up two keyframes:\n\n+   - Time 0 seconds: Position\
    \ ($\theta$, $\theta$, $\theta$)\n- Time 2 seconds: Position ($\theta$, 10, 10,\
    \ 0)"
  merge: -1
