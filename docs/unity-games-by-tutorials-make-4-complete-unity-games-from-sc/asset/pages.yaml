- pgno: 280
  md: "# Unity Games by Tutorials\n\nNow comes the fun part — actually shooting back.\
    \ There are two things you need to do:\\Deal damage to the robots but also implement\
    \ zooming (otherwise known as iron sights).\n\nOpen Gun and add the following\
    \ variables:\n\n```\npublic float zoomFactor;\npublic int range;\npublic int damage;\n\
    \nprivate float zoomFOV;\nprivate float zoomSpeed = 6;\n```\n\nzoomFactor controls\
    \ the zoom level when the player hits the right mouse button.\nFOV is the field\
    \ of view based on the zoom factor. range is how far the gun can effectively hit\
    \ its target. The shotgun has the shortest range and the pistol has the longest.\
    \ damage is how much damage the gun causes.\n\nSave your work and switch to Unity.\n\
    \nClick the 1Pistol GameObject and set its Zoom Factor to 1.3, Range to 60 and\
    \ its Damage to 3.\n\nClick the 2AssaultRifle GameObject and set its Zoom Factor\
    \ to 1.4, Range to 30 and its Damage to 1.\n\nClick the 3Shotgun GameObject and\
    \ set its Zoom Factor to 1.1, Range to 10 and its Damage to 10.\n\nOpen the Gun\
    \ script and update Start() to the following:\n\n```\nvoid Start()\n{\n  zoomFOV\
    \ = Constants.CameraDefaultZoom / zoomFactor;\n  lastFrameTime = Time.time - 10;\n\
    }\n```\n\nThis initializes the zoom factor.\n\nModify Update() to the following:\n\
    \n```\nprotected virtual void Update()\n{\n  // Right Click (Zoom)\n  if (Input.GetMouseButton(1))\n\
    {\n    Camera.main.fieldOfView = Math.Lerp(Camera.main.fieldOfView, zoomFOV, zoomSpeed\
    \ * Time.deltaTime);\n  }\n  else\n{\n    Camera.main.fieldOfView = Constants.CameraDefaultZoom;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Creating pickups\n\nIf the player hits the right mouse button, this smoothly\
    \ animates the zoom effect via Mathf.Lerp().\n\nTo determine if the robot was\
    \ hit, you'll use raycasting. Raycasting is when you fire an invisible ray to\
    \ check for collisions. First, you must define the method above. Add the following:\n\
    \n```\nprivate void processHit(GameObject hitObject)\n{\n    if (hitObject.GetComponent<Player>()\
    \ != null)\n    {\n        hitObject.GetComponent<Player>().TakeDamage(damage);\n\
    \    }\n\n    if (hitObject.GetComponent<Robot>() != null)\n    {\n        hitObject.GetComponent<Robot>().TakeDamage(damage);\n\
    \    }\n}\n```\n\nThis passes the damage to the correct GameObject. Now for the\
    \ actual raycasting. You can review raycasting by reading Chapter 4, \"Physics.\"\
    \ To implement raycasting, add the following to the bottom of Fire():\n\n```\n\
    Ray ray = Camera.main.ViewportPointToRay(new Vector3(0.5f, 0.5f, 0));\nRaycastHit\
    \ hit;\nif (Physics.Raycast(ray, out hit, range))\n{\n    processHit(hit.collider.gameObject);\n\
    }\n```\n\nThis creates a ray and checks what it hits. It's simple — a ray fires\
    \ out at the range of the gun, and if it collides with a GameObject, it calls\
    \ processHit(). This determines if the GameObject was hit by a robot; if so, it\
    \ passes the damage.\n\nSave your work and switch back to Unity. Click Play and\
    \ press the right mouse button to zoom, blast those bad robots until they die.\n\
    \nThe player needs a way to gain back health, armor and ammunition. You'll do\
    \ this by adding floating pickups that the player can grab along the way."
  merge: -1
  img_proc: true
