    important techniques, the ones you''ll use in almost every game you make. When
    you reach the end of this section, you''ll be ready to make your own simple game.
    Throughout this section, you will create a 3D action game called Bobblehead Wars,
    where you take the role of a space marine blasting hordes of aliens!


