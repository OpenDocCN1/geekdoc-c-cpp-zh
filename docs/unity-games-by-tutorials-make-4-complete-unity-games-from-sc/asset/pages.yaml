    Before you add force to Super Boy to allow him to jump, you need a way to control
    how high he jump, based on how long the jump button is held on. This will allow
    for very accurate jumps over around obstacles, depending on how close or far they
    are spread.


    Add the new fields to the top of the class:


    ```

    public float jumpDurationThreshold = 0.25f;

