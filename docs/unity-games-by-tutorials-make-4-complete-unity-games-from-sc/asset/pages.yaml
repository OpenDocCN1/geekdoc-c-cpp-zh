- pgno: 262
  md: "# Unity Games by Tutorials\n\nYou've probably guessed that you simply need\
    \ a variable to track the amount of ammunition. That would work, but in Robot\
    \ Ramp you need to worry about the type of ammunition as well. In this case, it\
    \ makes sense to have an Ammo class.\n\nCreate a C# script and name it Ammo. Open\
    \ it in your code editor and add the following import to the top (if it's not\
    \ already):\n\n```\nusing System.Collections.Generic;\n```\n\nThis lets you use\
    \ Dictionary type. In the body of the class at the top, add the following variables:\n\
    \n```\n[SerializeField]\nGameUI gameUI;\n[SerializeField]\nprivate int pistolAmmo\
    \ = 20;\n[SerializeField]\nprivate int shotgunAmmo = 10;\n[SerializeField]\nprivate\
    \ int assaultRifleAmmo = 50;\npublic Dictionary<string, int> tagToAmmo;\n```\n\
    \nThe variables pistolAmmo, shotgunAmmo and assaultRifleAmmo track their ammunition\
    \ counts. tagToAmmo is a dictionary of type string and int, which lets you map\
    \ your gun's type to its ammunition count.\n\nYou need to initialize the Dictionary\
    \ at game start, so add the following method below where you declare the Dictionary:\n\
    \n```\nvoid Awake()\n{\n  tagToAmmo = new Dictionary<string, int>\n{\n    Constants.Pistol,\
    \ pistolAmmo,\n    Constants.Shotgun, shotgunAmmo,\n    Constants.AssaultRifle,\
    \ assaultRifleAmmo,\n},\n}\n```\n\nAwake() is a special method called before Start().\
    \ In this case, you want the Dictionary to initialize before any Start() methods\
    \ to prevent null access errors. This method simply makes each gun type a key\
    \ in the Dictionary and sets each key's value to the appropriate ammunition type.\
    \ If you ever wanted to add another ammunition type, you can simply extend the\
    \ Dictionary.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_262_0.png)"
  merge: -1
  img_proc: true
- pgno: 263
  md: "Unity Games by Tutorials\n\nAdd the following method:\n\n```\npublic void AddAmmo(string\
    \ tag, int ammo)\n{\n    if (!tagAmmo.ContainsKey(tag))\n    {\n        Debug.LogError(\"\
    Unrecognized gun type passed: \" + tag);\n    }\n    tagAmmo[tag] += ammo;\n}\n\
    ```\n\nThis will add ammunition to the appropriate gun type. If you've passed\
    \ in an unrecognized bad gun type, you log it as an error.\n\nNext, add the following\
    \ method:\n\n```\n// Returns true if gun has ammo\npublic bool HasAmmo(string\
    \ tag)\n{\n    if (!tagAmmo.ContainsKey(tag))\n    {\n        Debug.LogError(\"\
    Unrecognized gun type passed: \" + tag);\n    }\n    return tagAmmo[tag] > 0;\n\
    ```\n\nThis will return true if the gun type has at least one bullet, or false\
    \ if it has no more bullets.\n\nAdd the following method as well:\n\n```\npublic\
    \ int GetAmmo(string tag)\n{\n    if (!tagAmmo.ContainsKey(tag))\n    {\n    \
    \    Debug.LogError(\"Unrecognized gun type passed:\" + tag);\n    }\n    return\
    \ tagAmmo[tag];\n```\n\nThis simply returns the bullet count for a gun type.\n\
    \nFinally, you need a method to actually consume ammunition. Add the following:\n\
    \n```\npublic void ConsumeAmmo(string tag)\n{\n    if (!tagAmmo.ContainsKey(tag))\n\
    \    {\n        Debug.LogError(\"Unrecognized gun type passed:\" + tag);\n   \
    \ }\n```\n\nraywenderlich.com\n\nChapter 9: The Player and Environment\n\n264"
