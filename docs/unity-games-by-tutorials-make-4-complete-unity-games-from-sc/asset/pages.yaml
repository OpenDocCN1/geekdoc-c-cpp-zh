- pgno: 503
  md: "# Unity Games by Tutorials\n\n# Chapter 18: Making A Tower Defense Game\n\n\
    Open it and replace the contents with this code:\n\n```\nusing UnityEngine;\n\
    using System.Collections.Generic;\n\npublic class WaypointManager : MonoBehaviour\n\
    {\n    //1\n    public static WaypointManager Instance;\n    //2\n    public List<Path>\
    \ Paths = new List<Path>();\n\n    private void Awake()\n    {\n        //3\n\
    \        Instance = this;\n    }\n    //4\n    public Vector3 GetSpawnPosition(int\
    \ pathIndex)\n    {\n        return Paths[pathIndex].Waypoints[0].position;\n\
    \    }\n}\n//5\n[System.Serializable]\npublic class Path\n{\n    public List<Transform>\
    \ Waypoints = new List<Transform>();n}\n```\n\nThis script stores the paths and\
    \ its waypoints. Here's a detailed explanation of the different parts:\n\n+  \
    \ 1. A static variable that holds a reference to this script. Static values can\
    \ be accessed from all classes without the need for linking components in the\
    \ editor or by way of scripting. This is a simplified version of the singleton\
    \ pattern, which allows easy access to a manager-type class from anywhere. All\
    \ manager scripts will use this pattern and it'll soon clear why this is so handy.\n\
    \n+   2. The list of stored paths. Path is a custom class that's defined in 5\
    \ of this list. Essentially, it's a list of lists: Several paths that contain\
    \ several waypoints.\n\n+   3. Sets the value explained in entry 1. The keyword\
    \ this refers to the class it's written in; this case, WaypointManager.\n\n+ \
    \  4. Returns the position of the enemy spawn point based on what path they will\
    \ take. It does this by taking the first waypoint (index 0) of the chosen path\
    \ and returning that position.\n\nraywenderlich.com\n\n504"
