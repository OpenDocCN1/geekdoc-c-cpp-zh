  md: '# Unity Games by Tutorials


    Notice that each group has three buttons on it. S is for Solo and it lets you
    isolate a certain group. M is for Mute and it works how you''d expect. B is for
    Bypass and it lets you bypass the effects in the group.


    In the Music group, click the M button to mute the background music.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_205_0.png)


