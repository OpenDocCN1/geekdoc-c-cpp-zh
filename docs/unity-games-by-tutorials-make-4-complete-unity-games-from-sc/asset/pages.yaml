- pgno: 210
  md: 'Of course, before you even think about game endings, you need to squash a rather
    big bug that you might not have noticed.


    # Fixing the GameManager


    As the hero shoots aliens, the game takes them off the screen, but the GameManager
    knows nothing of their deaths.


    Why is this important?


    For one thing, the GameManager may want to send condolence cards to the families.
    ]


    Secondly, the manager must know how many aliens are on the screen and to end the
    game. Without that information, the space marine enjoys much down time.


    Thankfully, it''s not an insurmountable problem. Instead of counting the alien
    population, you''ll make it so that the GameManager gets notification of each
    death.


    You''ll do this by using UnityEvent. C# also has an event system, but UnityEvent
    is built right into the engine.


    Open the Alien script in your code editor. Add the following underneath the existing
    using statements:


    ```

    using UnityEngine.Events;

    ```


    This allows you to access UnityEvent in code. Next, add the following instance
    variable inside the class:


    ```

    public UnityEvent OnDestroy;

    ```


    The Unity is a custom event type that you can configure in the Inspector. In this
    case, you''re creating an OnDestroy event. The OnDestroy event will occur with
    each call to an alien.


    Defining an event is only part of the equation. It''s kind of planning a party.
    No matter well you plan, it''s not a party if there are no guests.


    Just as parties need guests, guests need listeners, who do the job of taking notifications
    when something has happened. In the case of Bobble Wars, the GameManager needs
    to subscribe to the OnDestroy event.


    Save and head back to Unity. In the Project browser, select the Alien in the Prefabs
    folder. The Inspector for the Alien component now displays the OnDestroy event.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: "# Unity Games by Tutorials\n\n# Chapter 8: Finishing Touches\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_211_0.png)\n\
    \nBefore you can add GameManager to this list, you need to create a public method\
    \ to subscribe to the event. The GameManager script and add the following at the\
    \ bottom of the file, just before the closing brace:\n\n```\npublic void AlienDestroyed()\n\
    {\n    Debug.Log(\"dead alien\");\n}\n```\n\nThis prints a message to the console\
    \ to let you know that the GameManager got a notification. Save and switch to\
    \ Unity.\n\nIn the Project browser, select the Alien in the Prefabs folder again.\
    \ Find and select OnDestroy in the Inspector and click the + to add a new event.\n\
    \n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_211_1.png)\n\nThis is where you add\
    \ event listeners. You'll notice a drop-down that reads Runtime Only, which means\
    \ the events will run in Play mode.\n\nClick the circle next to where it says\
    \ None, and a Select Object pop-up will appear. Scroll through, and you'll notice\
    \ that the GameManager GameObject does not appear in the list (the script you\
    \ created, but not the GameManager itself). What gives?\n\nThere's a logical explanation\
    \ for this: A prefab can't contain a reference to a GameObject in the Hierarchy\
    \ because object may not be around when the game instantiates the prefab. For\
    \ example, if you link the two together, you're introducing a potential error.\
    \ You could create another scene with aliens in it, but that scene may not have\
    \ a GameManager in the other scene.\n\nraywenderlich.com\n\n212"
  merge: -1
  img_proc: true
- pgno: 212
  md: "# Chapter 8: Finishing Touches\n\nYou can workaround this restriction with\
    \ scripting.\n\nClick the minus button to remove the entry in the OnDestroy()\
    \ list you added a second ago, then open the GameManager script, and find newAlien.transform.LookAt(targetRotation);\
    \ in Update(). Add the following after it:\n\n```\nalienScript.OnDestroy(AlienDestroyed);\n\
    ```\n\nHere, you call AddListener on the event and pass the method to call whenever\
    \ that event occurs — in this case, AlienDestroyed. In short, every time this\
    \ event occurs, the GameManager gets a notification.\n\nNow, you need to generate\
    \ the event. Save your changes and open the Alien script in the editor. Add the\
    \ following method:\n\n```\npublic void Die(){\n    Destroy(gameObject);\n}\n\
    ```\n\nThis destroys the alien.\n\nIn OnTriggerEnter(), replace the line Destroy(gameObject);\
    \ with:\n\n```\nDie();\n```\n\nHere, you've refactored the destroy code into another\
    \ method. It allows other objects to trigger the death behavior.\n\nIn Die(),\
    \ add the following before the Destroy() statement:\n\n```\nOnDestroy.Invoke();\n\
    ```\n\nThis notifies all listeners, including the GameManager, of the alien's\
    \ tragic death.\n\nSave, play the game and shoot some aliens. You'll see a barrage\
    \ of log messages.\n\n| Console | |\n| Clear | Collapse | Clear On Play | Error\
    \ Pause |\n| ! dead alien UnityEngine.Debug:Log(Object) |\n| ! dead alien UnityEngine.Debug:Log(Object)\
    \ |\n| ! dead alien UnityEngine.Debug:Log(Object) |"
  merge: -1
  img_proc: true
- pgno: 213
  md: "# Unity Games by Tutorials\n\nWhen an object has an event is destroyed, the\
    \ best practice is to remove all listeners from that event. Otherwise, you may\
    \ create a memory leak by having a reference cycle.\n\nAfter onDestroy(), InvokeAllListeners();\
    \ add the following:\n\n```\nOnDestroy.RemoveAllListeners();\n```\n\nThis removes\
    \ any listeners that are listening to the event.\n\nNow you need to call the GameManager.\
    \ Open GameManager in your code editor, and replace AlienDestroyed() with the\
    \ following:\n\n```\npublic void AlienDestroyed() {\n  aliensOnScreen -= 1;\n\
    \  totalAliens -= 1;\n}\n```\n\nThis officially decreases the number of aliens\
    \ on screen. Save your work and see how what you did:\n\n+   1. The Alien script\
    \ contains a UnityEvent called onDestroy.\n\n+   2. The GameManager script periodically\
    \ spawns aliens. Each time it spawns an alien, it adds itself as a listener to\
    \ the event.\n\n+   3. The alien collides with something and is about to die,\
    \ it invokes its onDestroy event. This has the effect of notifying the GameManager.\n\
    \n+   4. The GameManager updates the count of aliens on the screen, as well as\
    \ the total number of aliens.\n\n+   5. The alien removes all listeners and destroys\
    \ itself.\n\nNow take a breather — you just squashed that bug with a mega-size\
    \ fly swatter. On more important matters.\n\n# Killing the hero\n\nSo far, life\
    \ has been a little bit too easy on the hero. The marine is impervious to death!\n\
    \nLet's put our Doctor Evil hats on and talk about how we'll kill our hero (mwuahaha).\
    \ Death in Bobblehead Wars will work in this fashion:"
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Once the marine gets hurt, the camera will shake and you''ll hear grunting
    to indicate the marine''s agony.


    The more hits, the harder the shake.


    Finally, when the marine suffers that final blow, he''ll emit a blood-curdling
    cry to signal his inglorious death and his head will pop off. I, wouldn''t it?


    You''ll start with the camera shake effect; this script is pre-included with the
    project for convenience.


    In the Project view, select the CameraShake script and drag it to Main Camera
    in the Hierarchy.


    This script works by providing a shake intensity, then it calls Shake().


    Select Main Camera in the Hierarchy, and in the Inspector, change Shake Decay
    to 0.02 to set the shake''s duration.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_214_0.png)


    Next is providing intensity values. Open PlayerController in your code editor
    and add the following instance variable:


    ```

    public float[] hitForce;

    ```


    This provides an array of force values for the camera.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_214_1.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: "# Unity Games by Tutorials\n\nAt this point, you could call CameraShake() each\
    \ time an alien collides with the hero, but it'll be a little problematic. When\
    \ the hero is swarmed by aliens, he could die in a matter of seconds, and the\
    \ game would come to be fun.\n\nTo avoid this frustration, you'll add a delay\
    \ between each hit to give the player time to react and escape a bad situation.\n\
    \nOpen PlayerController in your code editor and add the following variables:\n\
    \n```\npublic float timeBetweenHits = 2.5f;\nprivate bool isHit = false;\nprivate\
    \ float timeSinceHit = 0;\nprivate int hitNumber = -1;\n```\n\n+   - timeBetweenHits\
    \ is the grace period after the hero sustains damage.\n\n+   - isHit is a flag\
    \ that indicates the hero took a hit.\n\nThe above variables mean the hero won't\
    \ accrue damage for a period of time after taking a hit.\n\n+   - timeSinceHit\
    \ tracks the amount of time in the grace period.\n\n+   - hitNumber references\
    \ the number of times the hero took a hit. It's also used to get the shake intensity\
    \ for the camera shake.\n\nAdd the following method:\n\n```\nvoid OnTriggerEnter(Collider\
    \ other)\n{\n  Alien alien = other.gameObject.GetComponent<Alien>();\n  if (alien\
    \ != null)\n  {\n    // 1\n    if (!isHit)\n    {\n      hitNumber += 1; // 2\n\
    \      CameraShake cameraShake = Camera.main.GetComponent<CameraShake>();\n  \
    \    if (hitNumber < hitForce.Length) // 3\n      {\n        cameraShake.intensity\
    \ = hitForce[hitNumber];\n        cameraShake.Shake();\n      }\n      else\n\
    \      {\n        // death todo\n        isHit = true;\n        SoundManager.Instance.PlayOneShot(SoundManager.Instance.hurt);\n\
    \      }\n    }\n    alien.Die();\n  }\n}\n```\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_215_0.png)"
  merge: -1
  img_proc: true
- pgno: 216
  md: "Unity Games by Tutorials\n\nHere's the breakdown:\n\n+   1. First, you check\
    \ if the colliding object has an Alien script attached to it. If it's an alien\
    \ and the player hasn't been hit, then the player is officially considered hit.\n\
    \n+   2. The hitNumber increases by one, after which you get a reference to CameraShake().\n\
    \n+   3. If the current hitNumber is less than the number of force values for\
    \ the camera shake, then the hero is still alive. From there, you set force for\
    \ the shaking effect and then shake the camera. (You'll come back to the death\
    \ todo in a moment.)\n\n+   4. This sets isHit to true, plays the grunt sound\
    \ and kills the alien.\n\nYou're getting closer to making the hero's day, but\
    \ not quite yet. Once isHit is true, there's no unsetting it and the hero becomes\
    \ invincible — the opposite of what you want to do here.\n\nAdd the following\
    \ code to Update() to strip away divine powers:\n\n```\nif (isHit)\n{\n    timeSinceHit\
    \ += Time.deltaTime;\n    if (timeSinceHit > timeBetweenHits)\n{\n        isHit\
    \ = false;\n        timeSinceHit = 0;\n    }\n}\n```\n\nThis tabulates time since\
    \ the last hit to the hero. If that time exceeds timeBetweenHits, the player can\
    \ take more hits.\n\nPlay your game and charge those aliens. Resistance is futile.\n\
    \n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_216_0.png)"
  merge: -1
  img_proc: true
- pgno: 217
  md: "The hero will now react to each hit until the maximum number of hits. At that\
    \ point, nothing will happen — but you'll fix that, next, in a dramatic way!\n\
    \n# Removing the bobblehead\n\nThere's nothing more terrifying to a bobblehead\
    \ than losing its precious head. Your space marine is no different. It's only\
    \ fitting that the head rolls off the body to make the game's end spectacular\
    \ and undeniable.\n\nTime for a little more scripting. Open PlayerController in\
    \ your editor and add the following instances variable:\n\n```\npublic RigidBody\
    \ marineBody;\nprivate bool isDead = false;\n```\n\nmarineBody is, well, the marine's\
    \ body. You're adding this because you'll make some physics alterations when the\
    \ hero dies. And, of course, isDead keeps track of the player's current death\
    \ state.\n\nTogether, they let the script know if the marine is dead.\n\nNow you\
    \ need a method that manages the death, so add the following:\n\n```\npublic void\
