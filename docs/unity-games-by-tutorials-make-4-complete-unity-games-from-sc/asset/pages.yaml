  md: 'Open the Player Settings and make sure iOS is selected. First, you must choose
    a company name and a product name. The product name is what the game will be called
    on the device.


    | Company Name | RazeWare |

    | --- | --- |

    | Product Name | Runestrife |

    | Default Icon | |


    At this point, you can change specific iOS settings. Here''s the breakdown:


    +   - **Icon**: The icons used in the app. Unity populates the icons based on
    your default icon, but you can override the icon for certain devices.


    +   - **Resolution and Presentation**: Lets you to set the starting orientation,
    whether you''d like the status bar to display, and full screen support.


    +   - **Splash Image**: The first image the user sees when the game is launched.
    Ideally, this should be a static screenshot of the first screen in your game.


    +   - **Debugging and Crash Reporting**: Lets you turn profiling on and determine
    how the app will behave when it encounters an unhandled exception.


    +   - **Other Settings**: Configures build settings and specific device settings.


    +   - **XR Settings**: According to Unity documentation, XR is an umbrella term
    that encompasses Virtual Reality (VR), Augmented Reality (AR), and Mixed Reality
    (MR). At the moment, it has only one setting which is to indicate your game supports
    VR.


    Expand the Resolution and Presentation and set the Default Orientation to Auto
    Rotation. You will see a series of orientations for your game. Uncheck the Portrait
    and Portrait Upside Down.


    Now to customize the launching of your game in iOS. In iOS, Apple recommends you
    provide a screenshot of your first screen. When the user taps your launch icon,
    iOS shows this screenshot, which gives the feeling that the app launches right
    away even though it is still loading.


    Expand the Splash Image section and you will see that you have a lot of options.'
