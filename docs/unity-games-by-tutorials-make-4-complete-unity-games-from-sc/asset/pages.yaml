  md: 'Orbit around your model, and you''ll see that it''s nicely lit up to no matter
    which angle you''re looking from.


    # UV mapping your model


    Now that you''ve got your material, texture and lighting set up, it''s time to
    map the texture to the model!


    # Setting up your workspace


    At the top of the Blender window, Switch to the UV Editing workspace.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_450_0.png)


    The screen layout now shows two panels, the UV/Image editor on the left, and the
    3D View on the right.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_450_1.png)


    > **Tip:** Move your cursor over the 3D View and press T to toggle the Tools panel.
    With your cursor over the UV/Image editor, press N to toggle the Properties panel.
    That gives you a bit more real estate to work with.


    The Viewport Shading mode in the UV editing workspace is controlled independently
    to the Default workspace, so switch this to Material also.'
