    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_235_0.png)


    Create a transition from AnyState to ElevatorSummon and another from ElevatorSummon
    to ElevatorRise. It should look like the following:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_235_1.png)


    Now you need a condition. Click the **parameters** tabs then + , choose **Trigger**
    and name it **PlayerWon.**


    Select the transition from AnyState to ElevatorSummon. In the Inspector, add a
    condition and set it to **PlayerWon**. You don''t have to set a value for the
    condition because it''s a trigger.


    Why use a trigger? By creating a transition from AnyState, then any state can
    reach the condition, including the destination of that transition.


    If you were to use a Boolean condition like you did before, once you transition
    from AnyState to ElevatorSummon, the Animator would repeat the transition until
    the bool value switches to false. It would creates an infinite loop, but using
    a trigger means the transition only occurs once.


    Next, create a new **Bool** parameter and name it **OnElevator.**


    Select the transition between **ElevatorSummon** and **ElevatorRise**. In the
    Inspector, **uncheck Has Exit Time** and give it a new condition: **OnElevator**
    is equal to **true.**'
  merge: -1
  img_proc: true
