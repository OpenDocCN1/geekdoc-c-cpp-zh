    Select the SpaceMarine in the Hierarchy, Go to the Scene view and press F to focus
    on it. Chances, the arena is blocking your view.


    Thankfully, you don''t need to get Dumbledore on speed dial. You can make it disappear!
    Select BobbleArena in the Hierarchy, and in the Inspector, uncheck the box to
    the left of the GameObject''s name. This will make the arena disappear.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_55_1.png)


    You should only see the hero now. Select the SpaceMarine GameObject. In the Inspector,
    mouse over the X position label until you see the scrubber arrows. Hold the left
    mouse button and move your left or right. Notice how all the GameObjects move
    relative to the parent.


    As you can see, having parents does its advantages. No offense to any parentless
    deities out there.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_55_2.png)


    When you parent a GameObject in another, the position of the child GameObject
    won''t change. The difference is that the child GameObject is now positioned relative
    to the parent. That is, setting the child to (0, 0, 0) will move the child to
    the center of the parent versus the center of the game world.


    raywenderlich.com


