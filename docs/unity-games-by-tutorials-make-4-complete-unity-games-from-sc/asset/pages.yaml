    # Modifying the title screen


    Start off by disabling the Main Camera. Drag the OVRCameraRig prefab from the
    OVR > Prefabs folder into the Hierarchy.


    Select EventSystem and disable the Standalone Input Module. Add the Oculus Gaze
    Input Module script to it instead. You can do that through the Inspector panel
    by clicking the Add Component button and searching for it.


    Now drag the Reticle field from the Prefabs > VR folder into the scene and drag
    the new copy into the Reticle field of Oculus Gaze Input Module. Next, expand
    OVRCameraRig and drag CenterEyeAnchor to the Center Eye Transform field.


    Finally, OVRCameraRig''s grandchild CenterEyeAnchor. Set its Clear Flags to Solid
    Color and change the Background color to pure black (00000000).


    Now try the changes by playing the scene with the HMD on and the remote in your
    hand. You should be able to press the Start button to start the game.


    That''s it for Oculus Rift. Congratulations on finishing this section of the chapter!


    In the next section, you''ll learn how to get similar results with the HTC Vive.'
