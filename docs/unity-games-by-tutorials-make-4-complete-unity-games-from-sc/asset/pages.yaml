    # Enemies


    Enemies, often called minions or creeps in tower defense games, are the cannon
    fodder for the towers as they try to reach the exit of the map.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_507_1.png)


    In Runestife, there are three kinds of enemies: A normal one (Knight), a fast
    one (Airship) and a sturdy one (Ram). Each of these have different speeds and
    amount of health but, in essence, they are the same; they all try to reach the
    exit of the player kills them.


    These enemies are located in the Prefabs Enemy folder. Go to the folder and drag
    the Fast Enemy to the Hierarchy and set its Position to (2, 0, -5). Press the
    Play button to see what happens.


    He''s just standing there right now. That''s no good! To make him move, you''ll
    have to edit the Enemy script so it uses the WaypointManager that you made earlier.


    raywenderlich.com


    508'
