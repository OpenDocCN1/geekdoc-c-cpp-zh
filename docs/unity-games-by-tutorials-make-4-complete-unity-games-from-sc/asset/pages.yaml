- pgno: 353
  md: '# Tweaking the gravity settings


    The last tweak will be more noticeable once you''ve added jumping capabilities,
    but even now, the current gravity setting is a bit floaty to be considered a “super-tight”
    character controller.


    By default, Unity 2D projects use a gravity setting of (X:0, -9.81) — that means
    no sideways gravity and a downward force of -9.81. You want a downward gravity
    force of -30.


    Navigate to **Edit > Project Settings > Physics 2D** in the top menu. Change **Y**
    to -30.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_353_0.png)


    This makes the controls “feel” better, at least they will when you''ve finished
    the character controller script in the next chapter.


    Finally, select the **SoyBoy** GameObject in the Hierarchy and change the **Collision
    Detection** on the **RigidBody2D** component to **Continuous**.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_353_1.png)


    This makes collision detection for **SoyBoy** more frequent and prevents weird
    problems like getting stuck in the floor when you jump from a very high platform.


    Apply the changes to the **SoyBoy** prefab and save the project.


    # Where to go from here?


    Congratulations are in order! You''ve learned many of the fundamentals for building
    a solid 2D game in Unity. You''ve also set up the framework for activity in the
    next chapter.


    So far, you''ve learned:


    +   - **Sprites**: How to manipulate, edit, animate and arrange them on separate
    layers.

    - **Orthographic Camera**: What it is, why use it for 2D games, and how to script
    it that it follows the action around smoothly.'
