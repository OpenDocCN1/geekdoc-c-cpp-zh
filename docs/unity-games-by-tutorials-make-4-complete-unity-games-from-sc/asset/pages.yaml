- pgno: 473
  md: '# Adding the arm bones


    Select the existing armature and enter Edit mode. You''ll use the same armature
    for the arm bones.


    +   1. Start in Top view, set your 3D Cursor to the spot where the left arm meets
    the body. Press Shift-A to create the first bone.


    +   2. Press P to switch to front view, as your first bone is created in an upright
    position. Click the middle portion of the bone to select the whole bone. Drag
    the blue arrow up until its base is inline with the center of the arm.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_473_0.png)


    +   3. Press A to deselect, then select the end of the bone, and press G to grab
    it and move it approximately to the elbow.


    +   4. Press 7 to switch to Top view. Drag the green arrow to move the end of
    the bone forward to align it in this view, too.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_473_1.png)


    +   5. Stay in Top view and press E to extrude a new bone to the midpoint of where
    the “thumb” meets the “hand,” shown here.


    +   6. Press E again to extrude a “thumb” bone.'
  merge: -1
  img_proc: true
