  md: "# Interacting with the world\n\nThe next step is to get some interaction going.\
    \ Right now the enemies keep coming, there's no way to use the tower slots to\
    \ put down new towers.\n\nFirst of all, the OVR camera needs a Physics Raycaster\
    \ to fire raycasts into the scene where the player is looking. Select OVRCameraRig\
    \ > TrackingSpace > CenterAyeAnchor in the Hierarchy and add a Physics Raycaster\
    \ component. You can do this in the Inspector panel by clicking the Add Component\
    \ button and searching for Physics Raycaster.\n\nThe next thing is to be a way\
    \ to point and select objects in the world and on the UI. For that, you'll need\
    \ a new Input Module, namely a Gaze Input Module.\n\nGaze input means that there's\
    \ a 3D pointer in the middle of the player's view that lets them easily focus\
    \ on objects.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_577_0.png)\n\nTraditionally,\
    \ you'd select things by staring (or gazing) at the object. But in the case of\
    \ the Oculus, the remote that can be used to quickly confirm your actions. Unfortunately\
    \ this isn't a built-in Input Module in Unity, nor is it supplied by Oculus. No\
    \ worries though, it's easy to make one from scratch.\n\nIn the Project panel,\
    \ find the Scripts folder and create a new sub-folder called VR. Create a new\
    \ C Script in there named OculusGazeInputModule. Open it in your favorite code\
    \ editor and remove the Start() and Update() methods completely. Add these two\
    \ lines to the using statements at the top of the file:\n\n```\nusing System.Collections.Generic;\n\
    using UnityEngine.EventSystems;\n```\n\nNow replace this line:\n\n```\npublic\
    \ class OculusGazeInputModule : MonoBehaviour {\n    with this:\n}\npublic class\
    \ OculusGazeInputModule : PointerInputModule {\n```"
