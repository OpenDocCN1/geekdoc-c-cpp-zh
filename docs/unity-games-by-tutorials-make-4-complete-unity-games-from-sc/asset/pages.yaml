- pgno: 30
  md: '# Unity Games by Tutorials


    You should see the project creation dialog. You''ll notice that you have a few
    options, so fill them in as follows:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_30_0.png)


    Here''s everything on this screen means:


    +   - The **Project name** represents the internal name of the game. It''s not
    published with your final game, so you can name your projects whatever you like.
    Give this one the name _Bobblehead Wars_ .


    +   - The **Location** field is where you''ll save the project and related items.
    **Click the three dots in the Location field** to choose a location on your computer.


    +   - Unity 2018 comes with a new feature known as **Templates**. Unity used to
    only switch between 3D and 2D. It required the end user to turn on a bunch of
    settings to make simple games look good. For instance, if you are developing a
    game for mobile devices, you would choose the Lightweight RP template. Templates
    don''t limit you in any way. They save you time when configuring the editor and
    engine. For now, make sure **3D** is selected.


    +   - The **Add Asset Package** button allows you to include additional assets
    in your game or others from the Unity Asset Store. You don''t need to do anything
    with this for now.


    +   - Finally, you have the option to **Enable Analytics**, which gives you insight
    into your players'' experiences. By reading the data, you can determine areas
    wherein players struggle and make changes based on the feedback. This book will
    not delve into analytics, so set the switch to **off**.


    Once you''re ready, click the **Create project** button. Welcome to the world
    of Unity!'
