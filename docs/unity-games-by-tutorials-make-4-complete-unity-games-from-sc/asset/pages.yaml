- pgno: 244
  md: '# Unity Games by Tutorials


    If you don''t see the Character Controller option, then you didn''t import the
    Standard Assets when you installed Unity. To fix this, re-run the Unity installer
    and only check Standard Assets for the install. A standard Unity Asset is any
    regular package; it''s just a collection of files.


    Click Import in the dialog to import the character assets. When the import is
    completed, you will notice a new folder in the Project browser called Standard
    Assets. This contains everything you imported.


    The first modification is to remove the jumping action and a few other actions
    that you won''t need, such as footsteps and headbobbing. Robot Rampage doesn''t
    jump obstacles, and by default, the Unity Character Controller uses the spacebar
    to jump.


    In the Project browser, open the FirstPersonController in your code editor located
    in Assets > Standard Assets > Characters > FirstPersonCharacter > Scripts.


    Comment out lines 39, 50, 112 to 127, 165–176, and 182–200. To comment out a line,
    simply place // in front of the line. To comment multiple lines put // above the
    last line to comment.


    Save the file and switch back to Unity. Drag the FirstPersonController script
    on top of the Player GameObject. Click the Game GameObject, and use the Inspector
    to set Position to (23.7, 2.68, 24.11). Rotation to (0, -88.18, 0).


    This puts the player in one of the corners and rotates the player facing the hallway
    as opposed to staring at a wall.


    The FirstPersonController script also has values for run speed and walk speed.
    Set the Player Walk Speed to 10, and Run Speed to 20.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_244_0.png)


    Those run and walk values were determined because they work best for this game.
    When you make your games, play around with these values to see what works for
    you.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Adding the camera


    Currently, the camera is divorced from the player when you want them to be united
    as a happy couple, frolicking together through the robot wasteland. Frankly, you
    don''t have to play matchmaker.


    Click the Camera GameObject and drag it onto the Player GameObject to make it
    a child of Player. The camera will now move with the player.


    Set the Camera position as: (0, 0.8, 0) and Rotation to (0, 0, 0).


    Click Play; use the WASD keys to move around and the mouse to look around as you
    move. You can also hold the Shift key to run.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_245_0.png)


    Unfortunately, stopping the game can be a little difficult when using the first-person
    Character Controller since the mouse pointer is not available. There are, however,
    shortcuts. Press Control-P (or Command-P on a Mac) to exit Play mode.


    With the first-person Character Controller added, you just need to configure the
    capsule collider. A first-person Character Controller comes with a plain old Regular
    Character Controller, which already contains a capsule collider. You can learn
    more about character controllers in Chapter 4, "Physics."


    With the Player GameObject still selected, find the Character Controller in the
    Inspector and set the Center property to (0, 0, 0), the Radius to 1.8, and the
    Height to 5.


    | Character Controller | |

    |---|---|

    | Slope Limit | 45 |

    | Step Offset | 0.3 |

    | Skin Width | 0.08 |

    | Min Move Distance | 0.001 |

    | Center | X:0 Y:0 Z:0 |

    | Radius | 1.8 |

    | Height | 5 |


    Next is the fun wherein you get to add three weapons and start shooting them!'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Creating weapons


    In Unity, a gun is just another GameObject. A significant difference is the perspective.
    Putting it close to the camera gives you the perspective of the FPS that we all
    love.


    Select the Camera GameObject, then right-click on it and select Create Empty to
    create an empty GameObject under the Camera. Name your new GameObject 1Pistol.
    The number in front of the name refers to the key the player will use.


    Drag the RobotRampage_Pistol model from the Models folder in the Project browser
    onto the 1Pistol GameObject. By parenting the model to a GameObject, the animations
    you''ll create later will occur in local space.


    Set the Position of the 1Pistol GameObject to (0.69, -0.72, 1.26) and the rotation
    to (0, 0, 0).


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_246_0.png)


    This gives you the perspective of the gun directly in front of you. In the Inspector,
    deactivate the pistol by unchecking the checkbox next to the gun name. This makes
    it disappear so you can add another gun.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_246_1.png)


    Create another empty GameObject under the Camera and name it 2AssaultRifle. You''ll
    usually need to adjust the scale of imported models to fit your game, and this
    is no exception. Drag the RobotRampage_AssaultRifle model underneath your new
    GameObject. Set the 2AssaultRifle position to (0.54, -0.67, 0.913), the rotation
    to (0, 0, 0), and set the scale to (0.01, 0.01, 0.01).


    Deactivate the assault rifle like you did with the pistol.'
  merge: -1
  img_proc: true
