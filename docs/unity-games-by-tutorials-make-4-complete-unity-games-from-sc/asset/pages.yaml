  md: "Open the GameManager.cs script. At the top, just above the existing instance\
    \ field,\nadd this:\n\n```\npublic string playerName;\n```\n\nThis is a new string\
    \ field that keeps track of the player's name.\n\nCreate a new C# script named\
    \ PlayerName in the Scripts folder and then open it for\nediting. At the top,\
    \ use below the following statements, add:\n\n```\nusing UnityEngine.UI;\n```\n\
    \nThis is a using statement to reference the UnityEngine.UI namespace.\n\nInside\
    \ the top of the class, add the following:\n\n```\nprivate InputField input;\n\
    ```\n\nThis variable caches the reference to an InputField component.\n\nModify\
    \ the modifier of the PlayerName script as follows:\n\n```\nvoid Start ()\n  //\
    \ 1\n  input = GetComponent<InputField>();\n  input.valueChanged.AddListener(SavePlayerName);\n\
    \  // 2\n  var savedName = PlayerPrefs.GetString(\"PlayerName\");\n  if (!string.IsNullOrEmpty(savedName))\n\
    \    {\n      input.text = savedName;\n      GameManager.instance.playerName =\
    \ savedName;\n    }\n\nprivate void SavePlayerName(string playerName)\n  {\n \
    \   // 3\n    PlayerPrefs.SetString(\"PlayerName\", playerName);\n    PlayerPrefs.Save();\n\
    \    GameManager.instance.playerName = playerName;\n  }\n```\n\nHere's what you're\
    \ doing:\n\n+   1. Locating and caching the InputField component on the GameObject\
    \ to which\nscript is attached. You then add a new listener method to the onChanged\
    \ event\n all InputFields have by default.Whenever the input value changes, the\n\
    SavePlayerName() method executes."
