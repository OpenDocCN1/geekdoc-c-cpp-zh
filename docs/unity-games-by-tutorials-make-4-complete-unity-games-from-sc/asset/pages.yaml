- pgno: 222
  md: "When you play your game, all your scripts are loaded, followed by the SoundManager,\
    \ and then the Gun script. And with that, the console error is resolved.\n\n#\
    \ # Decapitating the alien\n\nAliens have bobbleheads, too, so they should die\
    \ in the same way as the hero, but you'll have a little fun with the poor aliens'\
    \ heads. Open the Alien script and add the following instance variables:\n\n```\n\
    public Rigidbody head;\npublic bool isAlive = true;\n```\n\nhead() will help you\
    \ launch the head, and isAlive will track the alien's state.\n\nReplace Die()\
    \ with the following:\n\n```\npublic void Die()\n{\n    isAlive = false;\n   \
    \ head.GetComponent<Animator>().enabled = false;\n    head.isKinematic = false;\n\
    \    head.useGravity = true;\n    head.GetComponent<SphereCollider>().enabled\
    \ = true;\n    head.gameObject.transform.parent = null;\n    head.velocity = new\
    \ Vector3(0, 26.0f, 3.0f);\n}\n```\n\nThis code works similarly to the marine's\
    \ death, but you disable the Animator for the alien. In addition, this code launches\
    \ the head off the body. Add this code before the closing brace:\n\n```\nOnDestroy.Invoke();\n\
    OnDestroy.RemoveAllListeners();\nSoundManager.Instance.PlayOneShot(SoundManager.Instance.alienDeath);\n\
    Destroy(gameObject);\n```\n\nThis block notifies the listeners, removes them and\
    \ then deletes the GameObject.\n\nYou want to make sure that you don't call Die()\
    \ more than once, so modify OnTriggerEnter(Collider other) as follows:\n\n```\n\
    void OnTriggerEnter(Collider other)\n{\n    if (isAlive)\n    {\n        Die();\n\
    \        SoundManager.Instance.PlayOneShot(SoundManager.Instance.alienDeath);\n\
    \    }\n}\n```\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_222_0.png)"
