- pgno: 17
  md: 'Unity Games by Tutorials


    Introduction


    specialize in these tools, then you''re set — but if you''re an indie developer
    trying to learn them all, it can be a challenge.


    +   **Can be expensive.** Although Unity starts free, eventually you''ll have
    to move to the paid version (such as if your company earns enough money, or if
    you want to get rid of the splash screen, or access other features). When you
    do move to the paid tier, it can get expensive quickly, especially as your team
    size grows.


    # Unity vs. Apple Game Frameworks


    > **Note:** If you are not an iOS developer, feel free to skip this section.


    If you are familiar with our website, raywenderlich.com, you may know that we
    have released two other books on game development as well:


    +   1. 2D iOS & tvOS Games by Tutorials, which covers making 2D games using Apple''s
    built-in 2D game framework, Scene Kit.


    +   2. 3D iOS Games by Tutorials, which covers making 3D games using Apple''s
    built-in 3D game framework, Scene Kit.


    If you are an iOS developer, you may be wondering which should should use: Unity,
    or one of the Apple game frameworks.


    Here''s our recommendation:


    +   **If you are an experienced iOS developer making a simple game and want to
    target iOS devices only, you may want to consider using one of Apple''s game frameworks.**
    They are very easy to learn and leverage much of your existing iOS development
    experience.


    +   **If you want to target non-iOS devices, or if you want to make games at a
    professional level, you may want to consider using Unity.** Unity is much more
    powerful than the Apple game frameworks, and does not lock you into the iOS ecosystem.
    That''s well worth the increased learning curve.


    raywenderlich.com


