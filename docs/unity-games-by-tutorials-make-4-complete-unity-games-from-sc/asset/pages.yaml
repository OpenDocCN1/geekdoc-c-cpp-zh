- pgno: 23
  md: '# # Chapter 1: Hello Unity


    By Brian Moakley


    To say game development is a challenge would be the understatement of the year.


    Until recently, making 3D games required low-level programming skills and advanced
    math knowledge. It was akin to a black art reserved only for super developers
    who never saw the sunlight.


    That all changed with Unity. Unity has made game programming into a craft that''s
    now accessible to mere mortals. Yet, Unity still contains those complicated AAA
    features so, as you grow as a developer, you can begin to leverage them in your
    games.


    Every game has a beginning and so does your learning journey — and this one be
    hands-on. Sure, you could pore over pages and pages of brain-numbing documentation
    until a lightbulb appears above your head, or you can learn by creating a game.


    You obviously prefer the latter, so in this tutorial, you''ll build a game named
    Bobblehead Wars.


    In this game, you take the role of a kickass space marine, who just finished obliterating
    an alien ship. You may have seen him before; he also starred in our book 2D iOS
    & tvOS Games in a game called Drop Charge.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/fd5c2ca20ea33da76d2b61297cc57f6c_24_0.png)


    After destroying the enemy ship, our space marine decides to vacation on a desolate
    alien planet. However, the aliens manage to interrupt his sun tan — and they are
    out for blood. After all, space marines are delicacies in this part of the galaxy!


    This game is a twin-stick shooter, wherein you blast hordes of hungry aliens that
    relentlessly attack:


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_24_1.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'You''ll toss in some random powerups to keep gameplay interesting, but success
    lies in fast footwork and a happy trigger finger.


    You''ll build the game across the next eight chapters, in stages:


    +   1. Chapter 1, Hello Unity: You are here! You''ll start exploring the Unity
    interface and you''ll learn how to import assets into your project.


    +   2. Chapter 2, GameObjects: Learn about two critical concepts in Unity – GameObjects
    and Prefabs – by adding and laying out the initial objects for Bobblehead Wars.


    +   3. Chapter 3, Components: In Unity, you''ll build your game by combining a
    set of components. In this chapter, you''ll use components to give your hero the
    ability to walk and blast away at the oncoming alien horde.


    +   4. Chapter 4, Physics: Learn the basics of game physics by adding collision
    detection and giving the hero the ability to turn on a dime.


    +   5. Chapter 5, GameManager and Pathfinding: This is where it gets rough for
    the space marine. In this chapter, you''ll create the tools that spawn the aliens,
    and enable them to change after the hero.


    +   6. Chapter 6, Animations: It''s time for some shooting and chomping! Learn
    how to add animations to the marine and the aliens.


    +   7. Chapter 7, Sounds: Bring your game to life by adding background music and
    a variety of sound effects.


    +   8. Chapter 8, Finishing Touches: Games are pointless without winners and losers.
    In this chapter, you''ll add a winning and losing condition, and wrap up the game
    with some classy touches.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Installing and running Unity


    Before you can take on aliens, you need to download the Unity engine itself. Head
    over to the following URL: http://unity3d.com/get-unity. You''ll see a page with
    many options from which to choose:


    | Personal | Plus | Pro |

    | :--- | :--- | :--- |

    | Free | $35 per month | $125 per month |

    | For beginners, students and hobbyists who want to explore and get started with
    Unity | For creators who are serious about bringing their vision to life and plan
    to publish | For professionals who need complete flexibility and craved customization
    |

    | Try Personal Learn More | Get Plus Learn More | Go Pro Learn More |


    You can use Pro if you like, but it''s excessive at this stage of your journey.
    For this version, you can only release a complete game and sell it on Steam with
    the free version.


    Before Unity 5, certain engine features were disabled in the free version. Now,
    all those closed-off features are now available to everybody who uses the personal
    version.


    In case you are curious, here are what the three options mean:


    +   **Unity Personal**: This edition allows you to create a complete game and
    distribute without paying Unity. However, your company must make less than $100,000
    per fiscal year. The other catch is that each game will present a “Made by Unity”
    splash screen that you cannot remove.

    **Unity Plus**: This edition costs $35 per month. It comes with performance-reporting
    tools, the Unity Pro skin and some additional features. This version requires
    your company to make less than $200,000 per year, and it allows you to either
    disable or customize the “Made by Unity” splash screen.

    **Unity Pro**: This is the highest tier available. It costs $125 per month and
    comes with useful services, professional iOS and Android add-ons, and has no splash
    screen. There is no revenue cap either.'
  merge: -1
  img_proc: true
