- pgno: 85
  md: 'Now it''s time to give your game a test run. Look for the play controls at
    the center-top of the editor. Click the Play button.


    > Note: You''ll notice the controls give you two more options: **Pause** and **pause
    stepper**. Pause allows you to, well, pause your game in motion. The stepper allows
    you to step through the animation one frame at a time and is especially useful
    for debugging animation issues.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_85_0.png)


    Now, look at the Game window and move your character by pressing the Arrow keys
    WASD keys. Behold... life!


    # The Game window


    The Game window is where you actually play the game. There are two life-and-death
    thrills to keep in mind as you play.


    First, when you start playing, the interface becomes darker to give a visual queue
    that you''re in play mode.


    Second, when you play your game. you can change anything about it (including changing
    values on components in the inspector) but, when you stop playing the game, ALL
    YOUR CHANGES WILL BE LOST. This is both a blessing and a curse. The blessing is
    that you have the ability to tweak the game without consequence. The curse is
    that sometimes you forget''re in play mode, continue on your game then, for some
    reason, the game stops. *Poof! Buh-bye changes!*


    Thankfully, you can (and should) make play mode really obvious. Select **Edit\Preferences**
    on PC or **Unity\Preferences** on Mac to bring up a list of options.


    **Select** the **Colors** section. Look for **Playmode tint**. Click the **color
    box** next to it, and give it an unmistakable color — 1 pref red. Now play your
    game to see if it''s conspicuous enough.'
