    # Expiration


    After 30 days, you may log in and get a rude awakening about how the evaluation
    period has ended. Once you cross that threshold, there''s no turning back. You
    won''t be able to use the software until you appease the makers — you must register
    with your Microsoft account.


    No fear! If you''re using the community edition, you still don''t have to pay
    to play. All you need is to create a Microsoft account (or use your existing)
    and then answer some questions. After that, it''s business as usual.


    To register your copy of Visual Studio, simply go to Help > Register Product.
    It''s better to do it early in the process rather than waiting until the trial
    end. You know Murphy''s Law works, right? You''ll get that message at the worst
    possible time. It means you won''t worry about jumping through hoops when your
    internet crashed and you have a deadline staring in your face. :]


    # Where to go from here?


    IDEs are meant to assist with your pursuit of being a faster and more productive
    coder. If you find yourself changing your development habits to match the workflow
    of the editor, then you should reconsider the relationship and investigate alternatives.'
  merge: -1
