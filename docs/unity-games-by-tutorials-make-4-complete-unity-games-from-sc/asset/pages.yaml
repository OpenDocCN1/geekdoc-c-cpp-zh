- pgno: 77
  md: '+   Move to Front and Move to Back adjust the ordering of sprites in 2D games.


    +   Remove Component will delete the component from the GameObject — you can undo
    this action.


    +   Copy Component allows you to copy a component from one GameObject and paste
    it onto another.


    +   Paste Component as New will paste a copied component to a GameObject.


    Paste Component Values allows you to overwrite the values of the current component
    from a copied component. Specifically, you can copy the values of a component
    while your game is being played. When you stop the game, you can paste those values
    onto another component. This is quite useful because sometimes it''s useful to
    tweak things as you play to see what works in practice.


    From the menu, select remove component. Now click the add component button again,
    and add a Rigidbody back to the GameObject. It''s in the Physics category. Finally,
    click the presets and select the Kinematic preset.


    Notice that the Rigidbody component was auto-magically updated by your preset.
    But you may be asking, what''s a Rigidbody?


    By adding the Rigidbody component to the space marine, you''ve made it so that
    he can respond to collision events and to gravity. However, you don''t want him
    bouncing off enemies or walls. You definitely want to know about those collisions
    events, but you don''t want the hero to fly out of control just because he bumped
    into a column.


    The kinematic property tells the physics engine that you are manually controlling
    the marine, rather than letting the physics engine move the marine for you. But
    the physics engine is still aware of when the marine collides with an alien, and
    when it collides with something. This engine will notify you so you can make something
    happen — like the space marine getting chomped!


    By unchecking the Gravity option, the space marine won''t be affected by gravity.
    Again — you don''t need this because you''ll be moving the marine manually and
    are using the Rigidbody for collision detection.


    Now comes the fun part: It''s time to make that marine dance! Or move. That''s
    fine, too.


    Unity provides some built-in components to make movement easy, and you''ll use
    them in Chapter 4, "Physics." But for learning purposes, in this chapter, you''ll
    do everything manually through the power of scripting.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_77_0.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Introducing scripting


    For the non-programmer, at best, scripting is a small barrier to entry. At worst,
    scripting is the devil that never sleeps.


    Coming from an arts background, I can say that scripting is not as hard as you
    might imagine. Like anything, it just requires some time and patience to understand
    how it works.


    In this book, you''ll write scripts in C#, which is a popular language developed
    by Microsoft that works for both mobile and desktop apps. It''s feature-rich and
    fully versatile. Unfortunately, I can''t teach it all within the covers of this
    book.


    Thankfully, you can learn C# at raywenderlich.com where there''s a free course
    that teaches the language from the ground up, for complete beginners.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_78_0.png)


    It''s designed for non-programmers and taught within the context of Unity.


    If you''re a beginner to programming, definitely check that out first. If you''re
    an experienced developer, or a particularly brave beginner, feel free to continue
    along, since everything in this book is step-by-step; just understand that there
    may be gaps in your understanding without C# knowledge.


    # Why not JavaScript?


    Back in the day, Unity shipped with Javascript and a python variant called Boo.
    Most developers used C# so in 2017, support was dropped for Javascript. Boo was
    dropped a few years earlier. Now, all scripting is done entirely in C#.


    You may encounter tutorials that reference Javascript, but you can''t even create
    Javascript files in the editor anymore. This is a good thing Unity has focused
    on their C# implementation, updating it to a near contemporary version of the
    language.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Unity Games by Tutorials


    C# may take some time to learn, but you can leverage those programming skills
    outside of Unity. For instance, if you find yourself dising game development (or
    having a hard time making a living) but enjoying the language, you can transition
    those skills into a C# development job, creating desktop or mobile apps, or even
    developing backend servers.


    The way coding works in Unity is that you create scripts. Scripts are simply another
    type of component that you attach to GameObjects, you just get to write the code
    for.


    A script derives from a class called MonoBehaviour, and you can override several
    methods to get notified upon certain events:


    +   - **Update():** This event occurs at every single frame. If your game runs
    at sixty frames per second, Needless to say, you don''t want to do any heavy processing
    in this method.


    +   - **OnEnable():** This is called when a GameObject is enabled and when an
    inactive GameObject suddenly activates. Typically, you deactivate GameObjects
    when you don''t need them for a while but will need a at a later point in time.


    +   - **Start():** This is called in the script''s lifetime and before Update()
    is called. It''s a good place to do setup and initialization.


    +   - **Destroy():** This is called right before the object goes to the GameObject
    after. It''s a good place to clean up, such as shutting down network connections.


    There are many other events that you will discover throughout this book. To see
    a complete listing, head to the MonoBehaviour reference on Unity''s site:


    +   - https://docs.unity3d.com/ScriptReference/MonoBehaviour.html


    # Creating your first script


    It''s showtime!


    You have many options for creating a script. You could click the Add Component
    button and then Select New.


    But I''d like you to try it well: Select the Scripts folder in the Project Browser,
    and then click the Create C# Script from the drop-down menu and name it PlayerController..


    You''ll see that your new script in the Scripts folder. Drag it from the Scripts
    folder onto the SpaceMarine GameObject.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_79_0.png)'
