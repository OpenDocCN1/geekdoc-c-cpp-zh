- pgno: 423
  md: '2. Type Shift-D X -2.4 and press Enter to duplicate the wheel. Adding the axis
    and distance immediately moves your duplicate along the specified axis. The second
    wheel is now exactly where it needs to be.


    3. Type R Z 180 to rotate the wheel so that the beveled faces are pointing outward.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_423_0.png)


    # Applying Transformations


    When modeling for Unity, it''s very important to apply the rotation and scale
    of all objects. After scaling an object to the size you want, applying the Transforms
    will reset the scale to 1 and the rotation values to zero.


    You will have scale and rotation problems with your 3D models in Unity, if you
    don''t this!


    +   1. Click the axle to select it, and press N to display the Properties Region.
    Notice that both the rotation and scale values have been modified.

    2. Press Ctrl-A and select Rotation & Scale.

    3. The object doesn''t change shape, and all the values are now nice and clean.


    ![](img/fd5c2ca20ea33da76d2b61297cc57f6c_423_1.png)'
