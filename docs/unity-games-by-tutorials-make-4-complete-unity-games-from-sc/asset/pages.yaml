- pgno: 517
  md: "Unity Games by Tutorials\n\nChapter 18: Making A Tower Defense Game\n\nHere's\
    \ what these methods do:\n\n+   1. Sets the Instance variable to script itself.\n\
    \n+   2. Add to elapsedTime. Check if a new wave has to be started and update\
    \ the wave that's active every frame.\n\n+   3. Iterate over the enemyWaves.\n\
    \n+   4. Check that a wave wasn't already started before and the time spent in\
    \ the level is the start time of that wave.\n\n+   5. If so, make the enemy wave\
    \ the active. Add it to the list of already activated waves and reset the spawn\
    \ counter.\n\n+   6. Break out of the list iteration as a suitable wave has been\
    \ found.\n\n+   7. An empty method up until now. This is filled in the next part.\n\
    \nNow for the actual spawning. Add this code inside UpdateActiveWave():\n\n```\n\
    //1\nif (activeWave != null)\n{\n    spawnCounter += Time.deltaTime;\n    //2\n\
    \    if (spawnCounter >= activeWave.timeBetweenSpawnsInSeconds)\n        spawnCounter\
    \ = 0;\n    //3\n    if (activeWave.listOfEnemies.Count != 0)\n        //4\n \
