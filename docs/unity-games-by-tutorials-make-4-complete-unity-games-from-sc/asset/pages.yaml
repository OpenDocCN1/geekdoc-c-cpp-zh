- pgno: 371
  md: "Add the following fields to the top of the class:\n\n```\npublic GameObject\
    \ playerDeathPrefab;\npublic AudioClip deathClip;\npublic Sprite hitSprite;\n\
    private SpriteRenderer spriteRenderer;\n```\n\nThese will hold some references\
    \ to assets that will be used when the player touches the saw blade and triggers\
    \ the hazard action.\n\nAdd the following, just above the Start() method:\n\n\
    ```\nvoid Awake()\n{\n    spriteRenderer = GetComponent<SpriteRenderer>();\n}\n\
    ```\n\nThis caches a reference to the SpriteRenderer when the script starts.\n\
    \nYou will now implement the logic that occurs when the player touches the saw\
    \ blade.\n\nThis is handled using the Unity physics 2D method OnCollisionEnter2D().\
    \ This method is called automatically when a collision happens between two physics\
    \ enabled 2D GameObjects.\n\nAdd the following code:\n\n```\nvoid OnCollisionEnter2D(Collision2D\
    \ coll)\n{\n    // 1\n    if (coll.transform.tag == \"Player\")\n    {\n     \
    \   // 2\n        var audioSource = GetComponent<AudioSource>();\n        if (audioSource\
    \ != null && deathClip != null)\n{\n            audioSource.PlayOneShot(deathClip);\n\
    \        }\n        // 3\n        Instantiate(playerDeathPrefab, coll.contacts[0].point,\
    \ Quaternion.identity);\n        spriteRenderer.sprite = hitSprite;\n        //\
    \ 4\n        Destroy(coll.gameObject);\n    }\n}\n```\n\n+   1. First check to\
    \ ensure the GameObject has the \"Player\" tag.\n\n+   2. Next, determine if an\
    \ AudioClip has been assigned to the script and that a valid Audio Source component\
    \ exists. If so, play the deathClip audio effect."
