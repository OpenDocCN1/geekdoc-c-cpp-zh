    # Adding colliders


    Colliders perform a variety of functions. They allow you to define the bounds
    of a GameObject for the purpose of collisions and are also useful for keeping
    your GameObjects from falling through the floor.


    Usually for colliders, you want to use primitive shapes such as spheres and boxes.
    For example, you''ll make a sphere that''s about the same size of the alien. It
    won''t match the shape of the alien exactly, but this is usually ''good enough''
    for collision detection purposes and results in a much faster game. If you need
    more precise collision detection, you can use a mesh collider instead — more on
    that, in just a minute.


    First, let''s stop that alien from dropping through the floor.


    Select the Alien GameObject in the Hierarchy and click the Add Component button
    in the Inspector. Select the Physics category, and from the components listing,
    select Sphere collider.


    You''ll see the collider, with many options, appear in the Inspector.


    | Edit Collider | |

    |---|---|

    | Is Trigger | None (Physics Material) |

    | Material Center | X 0 Y 0 Z 0 |

    | Radius | 0.5 |


