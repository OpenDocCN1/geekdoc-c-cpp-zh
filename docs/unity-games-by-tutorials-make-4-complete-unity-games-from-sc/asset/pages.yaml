    Here''s what these variables are:


    +   1. The amount of damage the tower inflicts to enemies.

    2. Cooldown between shots.

    3. The minimum distance between the tower and the enemy before the tower starts
    targeting the enemy.

    4. Level of the tower, which can be increased with an upgrade.

    5. The type of tower.

    6. The sound effect that plays when this tower shoots.

    7. The Transform that should be aimed at the enemy (the head, for example).

    8. Enemy that this is currently targeting.

    9. This counter will decrement every frame. When it hits 0, the tower may shoot.


    Quite a lot of useful variables! Next up is looking and attacking. Add these methods
    under the variable declarations:


    ```

    private void SmoothlyLookAtTarget(Vector3 target)

    towerPieceToAim.localRotation = UtilityMethods.SmoothlyLook(towerPieceToAim, target);


    protected virtual void AttackEnemy()

    GetComponent<AudioSource>().PlayOneShot(shootSound, .15f);

    ```


    SmoothlyLookAtTarget() uses the SmoothlyLook utility method to look at the enemy
    target. AttackEnemy() simply plays the sound effect. This is because each tower
    will implement its own way of attacking. Notice the virtual keyword. This means
    any classes derived from Tower can use this method as-is, add to it, or override
    it completely.'
