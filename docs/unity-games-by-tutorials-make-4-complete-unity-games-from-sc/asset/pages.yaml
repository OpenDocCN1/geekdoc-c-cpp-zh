  md: "Name it SelfDestruct and click the Create Add button. Open it in your editor.\n\
    Inside the class, replace the contents of the class with the following:\n\n```\n\
    public float destructTime = 3.0f;\npublic void Initiate()\n{\n    Invoke(\"selfDestruct\"\
    , destructTime);\n}\n\nprivate void selfDestruct()\n{\n    Destroy(gameObject);\n\
    }\n```\n\nThis deletes the attached GameObject after a given amount of time. You\
    \ could have named AlienHead, but its general name makes it available throughout\
    \ the game.\n\nOpen Alien and add the following to Die() before the Destroy(gameObject);\
    \ line:\n\n```\nhead.GetComponent<SelfDestruct>().Initiate();\n```\n\nNow play\
    \ the game and watch those heads disappear after three seconds.\n\n# Adding particles\n\
    \nAre you having a trouble believing that the process of dismembering characters\
    \ is so clean? Normally, beheading makes a big mess — this game should be no exception.\
    \ You'll use particles to increase the um, realism a bit.\n\nParticles are small\
    \ bits of geometry created by a game engine that you can use to create effects\
    \ such as fire, water and other chaotic systems.\n\nEver play a game that featured\
    \ snow? In most cases, the effect was produced by a particle emitter directly\
    \ over the character. It probably seemed like it was snowing in the entire game\
    \ world, but the particle emitter was most likely flying around you like a dark\
    \ cloud.\n\nParticles are a deep topic that you should cover in more depth on\
    \ your own. For convenience, in this tutorial, you'll use pre-made particles."
