- pgno: 104
  md: "# Unity Games by Tutorials\n\nNow that you've added a character controller,\
    \ you need to make a few tweaks to your PlayerController script. Start by double-clicking\
    \ the PlayerController script to open it in your editor.\n\nFirst, you need to\
    \ get a reference to CharacterController. You could get this in Update(), but\
    \ it's best to store it in an instance variable during Start(). That way, the\
    \ game doesn't spend unnecessary time fetching components.\n\nAdd the following\
    \ beneath the moveSpeed variable declaration:\n\n```\nprivate CharacterController\
    \ characterController;\n```\n\nThis creates an instance variable to store the\
    \ CharacterController.\n\nIn Start(), add the following to get a reference to\
    \ the component:\n\n```\ncharacterController = GetComponent<CharacterController>();\n\
    ```\n\nGetComponent() gets a reference to the current component passed into the\
    \ script. Replace all the code in Update() with the following:\n\n```\nVector3\
    \ moveDirection = new Vector3(Input.GetAxis(\"Horizontal\"),\n\t\t\t0, Input.GetAxis(\"\
    Vertical\"));\n\t\tcharacterController.SimpleMove(moveDirection * moveSpeed);\n\
    ```\n\nFirst, the above code creates a new Vector3 to store the movement direction\
    \ then it calls SimpleMove() and passes moveDirection multiplied by moveSpeed.\
    \ SimpleMove() is a built-in method that automatically moves the character in\
    \ the given direction, but not allowing the character to move through obstacles.\n\
    \nSave your changes and play the game.\n\n![](img/fd5c2ca20ea33da76d2b61297cc57f6c_104_0.png)"
  merge: -1
  img_proc: true
