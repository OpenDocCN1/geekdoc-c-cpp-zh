- pgno: 283
  md: "```\npickupShotgunAmmo();\nbreak;\ndefault:\n    Debug.LogError(\"Bad pickup\
    \ type passed\" + pickupType);\n    break;\n}\n}\n```\n\nGoing over what you've\
    \ added:\n\nPickupItem() takes an item that represents the type of item being\
    \ picked up. Now that the Player script can process picking up an item, it's time\
    \ to create the pickup prefabs.\n\nThe Constants file references the IDs of all\
    \ pickups. These IDs correspond to the five types of pickups. The ID passed into\
    \ the PickupItem() will be one of these values.\n\nSave your work and switch back\
    \ to Unity. Create a C# script, name it Pickup and add the following inside the\
    \ class:\n\n```\npublic int type;\n```\n\nThis represents the type of the pickup.\
    \ Now add the following:\n\n```\nvoid OnTriggerEnter(Collider collider)\n{\n \
    \   if (collider.gameObject.GetComponent<Player>() != null\n    && collider.gameObject.tag\
    \ == \"Player\")\n    {\n        collider.gameObject.GetComponent<Player>().PickupItem(type);\n\
    \        Destroy(gameObject);\n    }\n}\n```\n\nThis listens for a collision with\
    \ the Player GameObject, calls PickupItem() on it, passes along its item type,\
    \ and then destroys itself. You will add the respawn mechanics shortly.\n\nSave\
    \ your work and switch back to Unity.\n\nIn the Resources folder, select the PickupAmmoAssaultRifle,\
    \ PickupAmmoPistol, PickupAmmoShotgun, PickupHealth and PickupArmor prefabs. With\
    \ all of those selected, click the Add Component from the scripts gallery and\
    \ select the Pickup script.\n\nNext, add a Rigidbody. Check the Is Kinematic box.\
    \ Finally, add a Box Collider. Check the Is Trigger checkbox and set the Size\
    \ to (1.5, 1.5, 1.5)."
