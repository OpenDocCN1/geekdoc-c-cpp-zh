    He''s running! But you might notice that, when he hits an object or falls far
    enough, Super Soy Boy rotates or spins. It happens when force is applied to a
    collider edge. It adds just movement to trigger a spin.


    To fix this, you just need to lock the Rigidbody''s Z-rotation.


