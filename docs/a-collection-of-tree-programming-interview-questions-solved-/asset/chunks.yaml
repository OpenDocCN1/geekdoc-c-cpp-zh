  trans: "\nBST 是一种二叉搜索树，因此中序遍历从左子树开始，然后是当前节点，最后是右子树。\n\n### 代码\n```cpp\ntemplate<typename\
    \ tVal>\nvoid printInorder(binaryTree<tVal> * const node) {\n    if (!node)\n\
    \        return;\n    printInorder(node->left);\n    std::cout << \" n=\" << node->v__;\n\
    \    printInorder(node->right);\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00014.jpeg)),其中\
    \ ![](img/00013.jpeg) 是树中节点的数量。\n\n## 16 在 BST 中实现 findMin 和 findMax\n\n### 解决方案\n\
    最小键位于最左侧的子节点，而最大键位于最右侧的节点。\n\n### 代码\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal>\
    \ * findMin(binaryTree<tVal> * root) {\n    if (!root)\n        return NULL;\n\
    \    while (root->left) { root = root->left; }\n    return root;\n}\n\ntemplate<typename\
    \ tVal>\nbinaryTree<tVal> * findMax(binaryTree<tVal> * root) {\n    if (!root)\n\
    \        return NULL;\n    while (root->right) { root = root->right; }\n    return\
    \ root;\n}\n```\n\n### 复杂度\n平均时间复杂度为![](img/00012.jpeg))，其中 ![](img/00013.jpeg)\
    \ 是树中节点的数量。然而，如果树不是平衡的，复杂度为![](img/00014.jpeg))。\n\n## 17 在 BST 中实现 deleteNode\n\
    \n### 解决方案\n代码 `deleteNode()` 首先在树中查找要删除的键。如果没有该键，算法将返回。否则，有两种不同的情况：\n\n- 如果节点是内部节点，`deleteNode()`\
    \ 会在以节点为根的左子树中找到最大键并找到它。该最大键将替换被搜索的键，从而将其移除。然后通过左子树删除该最大值。\n- 如果节点是外部节点且只有一个孩子（在左侧或右侧），则该子节点替换父节点。在任何情况下，外部节点都会被释放。\n\
    \n以下代码实现了该算法：\n\n### 代码\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal> * deleteNode(binaryTree<tVal>\
    \ * root, const tVal key) {\n    binaryTree<tVal> * tmp;\n    if (!root)\n   \
    \     return NULL;\n    else if (key < root->v__)\n        root->left = deleteNode(root->left,\
    \ key);\n    else if (key > root->v__)\n        root->right = deleteNode(root->right,\
    \ key);\n    else {\n        // 内部节点\n        if (root->left && root->right) {\n\
    \            tmp = findMax(root->left);\n            root->v__ = tmp->v__;\n \
    \           root->left = deleteNode(root->left, root->v__);\n        }\n     \
    \   else {\n            tmp = root;\n            if (root->left == NULL)\n   \
    \             root = root->right;\n            if (root->right == NULL)\n    \
    \            root = root->left;\n            delete tmp;\n        }\n    }\n \
    \   return root;\n}\n```\n\n### 复杂度\n平均时间复杂度为![](img/00012.jpeg))，其中 ![](img/00013.jpeg)\
    \ 是树中节点的数量。然而，如果树不是平衡的，复杂度为![](img/00014.jpeg))。\n\n## 18 在 BST 中实现最低公共祖先\n\n\
    ### 解决方案\n对于以根节点为根的树，两个节点 ![](img/00007.jpeg)（键为 ![](img/00017.jpeg））的最低公共祖先 (LCA)\
    \ 是键为 ![](img/00018.jpeg)的节点，满足 ![](img/00019.jpeg)或 ![](img/00020.jpeg)。如果不满足这些条件，LCA\
    \ 通过向左（如果 ![](img/00021.jpeg））或向右移动来导航三者，直到满足其中一个条件或到达外部节点。\n\n### 代码\n```cpp\n\
    template<typename tVal>\nbinaryTree<tVal> * lca(binaryTree<tVal> * const root,\
    \ binaryTree<tVal> * const n1, binaryTree<tVal> * const n2) {\n    if (!root ||\
    \ !n1 || !n2)\n        return;\n    while (true) {\n        if (((n1->v__ < root->v__)\
    \ && (root->v__ < n2->v__)) || ((n1->v__ > root->v__) && (root->v__ > n2->v__)))\n\
    \            return root;\n        else if n1->v__ < root->v__)\n            root\
    \ = root->left;\n        else\n            root = root->right;\n    }\n}\n```\n\
    \n### 复杂度\n最坏情况下的时间复杂度为![](img/00014.jpeg))。\n\n## 19 检查树是否为 BST\n\n### 解决方案\n\
    可以通过递归计算解决方案，通过检查左子树、当前节点和右子树是否遵循 BST 排序。因此，这种方法很方便。\n\n### 代码\n```cpp\ntemplate<typename\
    \ tVal>\nbool isBST(binaryTree<tVal> * const root, tVal & prev) {\n    if (!root)\n\
    \        return true;\n    if (root->left && !isBST(root->left, prev))\n     \
    \   return false;\n    prev = root->v__;\n    if (root->right && !isBST(root->right,\
    \ prev))\n        return false;\n    return true;\n}\n```\n\n### 复杂度\n最坏情况的时间复杂度为![](img/00014.jpeg))。\n\
    \n## 20 将双链表转换为 BST\n\n### 解决方案\n将双链表转换为 BST 可以轻松实现。节点的右孩子可以作为双链表的前向指针，左孩子作为后向指针。在开始时会发生特殊情况，即双链表的尾部指针如代码所示。\n\
    \n### 代码\n```cpp\ntemplate<typename tVal>\nstruct dLL {\n    tVal v__;\n    struct\
    \ dLL *prev;\n    struct dLL *next;\n    dLL(tVal v) : v__(v), prev(NULL), next(NULL)\
    \ {}\n};\n\ntemplate<typename tVal>\ndLL<tVal> * findMiddleNode(dLL<tVal> *head);\n\
    \ntemplate<typename tVal>\nbinaryTree<tVal> * doubleListToBST(dLL<tVal> * head)\
    \ {\n    dLL<tVal> *tmp, *p, *q;\n    if (!head || !head->next)\n        return\
    \ NULL;\n    tmp = findMiddleNode(head);\n    p = head;\n    while (p->next !=\
    \ tmp)\n        p = p->next;\n    p->next = NULL;\n    q = tmp->next;\n    tmp->next\
    \ = NULL;\n    tmp->v__ = doubleListToBST(head);\n    tmp->next = doubleListToBST(q);\n\
    \    return tmp;\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00014.jpeg))，其中 ![](img/00013.jpeg)\
    \ 是列表中节点的数量。\n\n## 21 将 BST 转换为双链表\n\n### 解决方案\n可以通过递归轻松将 BST 转换为双链表。节点的右孩子可以作为双链表的前向指针，左孩子作为后向指针。算法从开始开始，如代码详细定义。\n\
    \n### 代码\n```cpp\ntemplate <typename tVal>\nvoid bstToDoubleList(binaryTree<tVal>\
    \ *root, binaryTree<tVal> ** head, binaryTree<tVal> ** tail) {\n    if (!root)\n\
    \        return;\n    if (root->left)\n        bstToDoubleList(root->left, head,\
    \ tail);\n    root->left = *tail;\n    if (*tail)\n        (*tail)->right = root;\n\
    \    else\n        *head = root;\n    *tail = root;\n    if (root->right)\n  \
    \      bstToDoubleList(root->right, head, tail);\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00014.jpeg))，其中\
    \ ![](img/00013.jpeg) 是树中节点的数量。\n\n## 22 在 BST 中查找第 k 个元素\n\n### 解决方案\n可以通过保持计数器的引用来递归解决该问题，如下代码所示。\n\
    \n### 代码\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal> * findkth(binaryTree<tVal>\
    \ * const root, const tVal k, unsigned & count) {\n    if (!root)\n        return\
    \ NULL;\n    binaryTree<tVal> * left = findkth(root->left, k, count);\n    if\
    \ (left)\n        return left;\n    if (++count == k)\n        return root;\n\
    \    return findkth(root->right, k, count);\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00022.jpeg))，其中\
    \ ![](img/00023.jpeg) 是要查找键的位置。\n\n## 23 打印 BST 中给定区间内的所有键\n\n### 解决方案\n\n"
- fmt: "\nGiven two keys `![]images/00024.jpeg)` such that `![]images/00025.jpeg)`,\
    \ the `BST` tree is navigated so that if the current node has a key larger or\
    \ equal than `![]images/00023.jpeg)` , the navigation continues recursively with\
    \ the left children. Then the range condition is checked and if it is met, the\
    \ current node is printed. Finally the navigation continues recursively with the\
    \ right children.\n\n### Code\n\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal>\
    \ * rangePrint(binaryTree<tVal> * const root, const tVal k, const tVal h) \n{\n\
    \    if (!root)\n        return NULL;\n    if (root->v__ >= k)\n        rangePrint(root->left,\
    \ k, h);\n    if (root->v__ >= k && root->v__ <= h)\n        std::cout << \" v=\"\
    \ << root->v__;\n    if (root->v__ <= h)\n        rangePrint(root->right, k, h);\n\
    }\n```\n\n### Complexity\n\nThe worst time complexity is `![]images/00014.jpeg))`\
    \ , where `![]images/00013.jpeg)` is the number of nodes in the tree.\n\n## 24\
    \ Merging Two Balanced Binary Search Trees\n\n### Solution\n\nThe most efficient\
    \ method for merging two `BST` is to store each one of them in an array. Then\
    \ the two sorted arrays are merged and the resulting array is converted back to\
    \ a new `BST`.\n\n### Code\n\n```cpp\ntemplate<typename tVal>\nvoid storeInorder(binaryTree<tVal>\
    \ * const root, std::vector<tVal> & inorder) \n{\n    if (!root)\n        return;\n\
    \    storeInorder(root->left, inorder);\n    inorder.push_back(root->v__);\n \
    \   storeInorder(root->right, inorder);\n}\n\ntemplate<typename tVal>\nvoid dumpVector(const\
    \ std::vector<tVal> &v1)\n{\n    std::cout << std::endl;\n    std::vector<tVal>::const_iterator\
    \ it = v1.begin();\n    for (; it != v1.end(); it++)\n        std::cout << *it\
    \ << \" \";\n    std::cout << std::endl;\n}\n\ntemplate<typename tVal>\nvoid merge(const\
    \ std::vector<tVal> & v1, const std::vector<tVal> & v2, std::vector<tVal> & merged)\n\
    {\n    unsigned m = v1.size(), n = v2.size();\n    if (merged.size() != n + m)\n\
    \        return;\n    unsigned i = 0, j = 0, k = 0;\n    while (i < m && j < n)\n\
    \    {\n        if (v1[i] < v2[j])\n            merged[k] = v1[i++];\n       \
    \ else\n            merged[k] = v2[j++];\n        k++;\n    }\n    while (i <\
    \ m)\n        merged[k++] = v1[i++];\n    while (j < n)\n        merged[k++] =\
    \ v2[j++];\n}\n\ntemplate<typename tVal>\nbinaryTree<tVal> * sortedArrayToBST(const\
    \ std::vector<tVal> &v, int start, int end)\n{\n    if (start > end)\n       \
    \ return NULL;\n    int mid = (start + end) / 2;\n    binaryTree<tVal> *root =\
    \ new binaryTree<tVal>(v[mid]);\n    root->left = sortedArrayToBST(v, start, mid\
    \ - 1);\n    root->right = sortedArrayToBST(v, mid + 1, end);\n    return root;\n\
    }\n\ntemplate<typename tVal>\nbinaryTree<tVal> * mergeTrees(binaryTree<tVal> *\
    \ const root1, binaryTree<tVal> * const root2)\n{\n    std::vector<int> v1;\n\
    \    storeInorder(root1, v1);\n    std::vector<int> v2;\n    storeInorder(root2,\
    \ v2);\n    std::vector<int> merged(v1.size() + v2.size());\n    merge(v1, v2,\
    \ merged);\n    dumpVector(merged);\n    return sortedArrayToBST(merged, 0, merged.size()\
    \ - 1);\n}\n\ntemplate<typename tVal>\nvoid dump(binaryTree<tVal> * const root)\n\
    {\n    if (!root)\n        return;\n    else\n        std::cerr << \" v==\" <<\
    \ root->v__ << \" \";\n    if (root->left)\n        std::cerr << \" ->left \"\
    ;\n        dump(root->left);\n    if (root->right)\n        std::cerr << \" ->right\
    \ \";\n        dump(root->right);\n}\n```\n\n### Complexity\n\nThis method has\
    \ complexity `![]images/00026.jpeg)` , where `![]images/00013.jpeg)` and `![]images/00027.jpeg)`\
    \ are the numbers of nodes in the two `BSTs`.\n\n## 25 Finding out there is a\
    \ triplet in a Balanced BST that adds to zero\n\n### Solution\n\nThe optimal solution\
    \ is to convert the `BST` into a double linked list. Then it is possible to iterate\
    \ through the list and for each negative element try to find a pair in the list,\
    \ which is equal to the key of the current node multiplied by `-1`.\n\n### Code\n\
    \n```cpp\ntemplate<typename tVal>\nvoid bstToDoubleList(binaryTree<tVal> *root,\
    \ binaryTree<tVal> ** head, binaryTree<tVal> ** tail) \n{\n    if (!root)\n  \
    \      return;\n    if (root->left)\n        bstToDoubleList(root->left, head,\
    \ tail);\n        root->left = *tail;\n    if (*tail)\n        (*tail)->right\
    \ = root;\n    else\n        *head = root;\n    *tail = root;\n    if (root->right)\n\
    \        bstToDoubleList(root->right, head, tail);\n};\n\ntemplate<typename tVal>\n\
    bool isPresentInDLL(binaryTree<tVal> * head, binaryTree<tVal> * tail, int sum)\
    \ \n{\n    while (head != tail)\n    {\n        int curr = head->v__ + tail->v__;\n\
    \        if (curr == sum)\n            return true;\n        else if (curr > sum)\n\
    \            tail = tail->left;\n        else\n            head = head->right;\n\
    \    }\n    return false;\n}\n\ntemplate<typename tVal>\nbool isTripletPresent(binaryTree<tVal>\
    \ *root) \n{\n    if (!root)\n        return false;\n    binaryTree<tVal>* head\
    \ = NULL;\n    binaryTree<tVal>* tail = NULL;\n    bstToDoubleList(root, &head,\
    \ &tail);\n    while ((head->right != tail) && (head->v__ < 0))\n    {\n     \
    \   if (isPresentInDLL(head->right, tail, -1 * head->v__))\n            return\
    \ true;\n        else\n            head = head->right;\n    }\n    return false;\n\
    }\n```\n\n### Complexity\n\nThis part is left to the reader as an exercise\n\n\
    ## 26 Implementing a B-Tree\n\n### Solution\n\nA `b-tree` allows insertion and\
    \ deletion in logarithmic time and it is typically used for systems that write\
    \ and read large blocks of data such as databases or file systems.\n\nIn `B-trees`\
    \ internal nodes have a variable number of children nodes within a predefined\
    \ range `![]images/00028.jpeg)`. When data is inserted or removed from a node,\
    \ its number of children nodes changes and therefore internal nodes may be joined\
    \ or split for guaranteeing that they don’t exceed the range. Each internal node\
    \ of a `B-tree` will contain a number of sorted keys. Keys act as separation values\
    \ which divide a tree into subtrees as explained in the image below. Therefore\
    \ `![]images/00029.jpeg)` is the minimum branching factor for the tree.\n\n![http://bluerwhite.org/btree/tree1.png](images/00030.jpeg)\n\
    \nThe factor of `2` will guarantee that nodes can be split or combined. If an\
    \ internal node has `![]images/00031.jpeg)` keys, then adding a key to that node\
    \ can be accomplished by splitting the `![]images/00032.jpeg)` key node into two\
    \ `![]images/00033.jpeg)` key nodes and by adding the key to the parent. Each\
    \ split node maintains the required minimum number of keys. Likewise if each internal\
    \ node and its neighbor have `![]images/00033.jpeg)` keys, then a key can be deleted\
    \ from the internal node by joining with its neighbor. Deleting the key would\
    \ leave `![]images/00034.jpeg)` keys to the internal node but joining the neighbor\
    \ would add `![]images/00035.jpeg)` keys plus one more key coming from the neighbor's\
    \ parent. The total is still `![]images/00031.jpeg)` keys. The number of branches\
    \ from a node is one more than the number of keys stored in that node. A B-tree\
    \ is kept balanced by requiring that all leaf-nodes are at the same depth.\n\n\
    More formally a B-tree of order `[]images/00036.jpeg)` is defined as a tree which\
    \ satisfies the following properties:\n\n1. Every node has at most `![]images/00037.jpeg)`\
    \ children.\n2. Every non-leaf node (except for the root) has at least `![]images/00038.jpeg)`\
    \ children.\n3. The root has at least two children if it is not a leaf node.\n\
    4. A non-leaf node with `![]images/00023.jpeg)` children contains `![]images/00039.jpeg)`\
    \ keys.\n5. All leaves appear in the same level\n6. Each internal node’s keys\
    \ act as a separation value which divides its subtrees.\n\nSearch\n\nThis operation\
    \ is similar to the one of searching a binary search tree. Starting from the root,\
    \ the tree is recursively traversed from top to bottom and at each level the search\
    \ chooses the subtree, which has separation keys on both sides of the search value.\
    \ The search within a node can be linear or binary.\n"
