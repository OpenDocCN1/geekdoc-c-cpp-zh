    \n## 10 Find the maximum path sum between two leaves of a binary tree\n\n### Solution\n\
    \nThe maximum path sum between two leaves can either touch the root of the three\
    \ or can be located on a subtree only if it belongs to the tree itself. Hence\
    \ we have the following cases of recursion:\n\n*   The base case is when the root\
    \ is NULL and we return 0\n\n*   Then we compute recursively the maximum path\
    \ sum for the left and right subtree respectively\n\n*   Then we compute the maximum\
    \ for the left subtree, for the right subtree, and for the subtree rooted at the\
    \ current node. If this maximum improves the total maximum observed so far, then\
    \ the total maximum is updated\n\n*   Returning from recursion we compute the\
    \ maximum between the right and left subtrees and add the weight for the current\
    \ node.\n\n### Code\n\ntemplate<typename  tVal>\n\n tVal max(tVal  a, tVal  b)\n\
    \n   {\n\n return (a >= b) ? a : b;\n\n   }\n\n template<typename  tVal>\n\n int\
    \ maxPathSum(binaryTree<tVal> * root, tVal &res)\n\n   {\n\n if (!root)\n\n return\
    \ 0;\n\n int lLPSum = maxPathSum(root->left, res);\n\n int rLPSum = maxPathSum(root->right,\
    \ res);\n\n int curr_sum = max((lLPSum + rLPSum + root->v__),\n\n         max(lLPSum,\
    \ rLPSum));\n\n if (res < curr_sum)\n\n res = curr_sum;\n\n return max(lLPSum,\
    \ rLPSum) + root->v__;\n\n   }\n\n### Complexity\n\nTime complexity is ![](images/00001.jpeg)\
    \ and space complexity is ![](images/00001.jpeg).\n\n## 11 Reconstructing a tree\
    \ given its pre-order and in-order traversals\n\n### Solution\n\nIn a preorder\
    \ visit the root is always the leftmost element of each subtree. So we start to\
    \ put the leftmost element of the preorder array of visits as the root of the\
    \ whole tree. Now: if we search that very element in the inorder array, we can\
    \ immediately infer all elements that are before that very value, belonging to\
    \ the left subtree and all elements after that same value, belonging to the right\
    \ subtree. The solution can be therefore computed recursively.\n\n### Code\n\n\
    \ template<typename  tVal>\n\n unsigned search(std::vector<tVal> inorder,\n\n\
    \ unsigned  start, unsigned  end, tVal  v)\n\n   {\n\n for (unsigned i = start,\
    \ i <= end; i__++)\n\n if (inorder[i] == v)\n\n return i;\n\n   }\n\n template<typename\
    \  tVal>\n\n binaryTree<tVal> * buildBTfromInorderAndPreorder(\n\n const std::vector<tVal>\
    \ & inOrder,\n\n const std::vector<tVal> & preOrder,\n\n unsigned & preIndex,\n\
    \n unsigned  inStart, unsigned  inEnd)\n\n   {\n\n binaryTree<tVal> * n;\n\nn->v__\
    \ = preOrder[preIndex++];\n\n if (inStart == inEnd)\n\n return n;\n\n int inIndex\
    \ =\n\n         search(inOrder, inStart, inEnd, n->v__);\n\n      n->left =\n\n\
             buildBTfromInorderAndPreorder(inOrder, preOrder,\n\n inStart, inIndex\
    \ - 1);\n\n      n->right =\n\n         buildBTfromInorderAndPreorder(inOrder,\
    \ preOrder,\n\ninIndex+1, inEnd);\n\n   }\n\n### Complexity\n\nTime complexity\
    \ is ![](images/00006.jpeg). A question for the interested reader could be, whether\
    \ or not this one is the optimal complexity.\n\n## 12 Printing a zig-zag traversal\n\
    \n### Solution\n\nA Zig-Zag traversal is implemented by using two stacks which\
    \ are swapped at every level. During the visit of currentLevel all children are\
    \ inserted in the nextLevel stack. To be considered: a Boolean value is maintained\
    \ for determining the direction of a visit (either left to right, or right to\
    \ left) and this direction in reversed at every cycle. When a currentLevel stack\
    \ is empty, then it is swapped with nextLevel. By using two stacks, a zig-zag\
    \ visit is a variant of a level order visit.\n\n### Code\n\n template<typename\
    \  tVal>\n\n void printZigZag(binaryTree<tVal> * root)\n\n   {\n\n binaryTree<tVal>\
    \ * tmp;\n\n bool left2right = true;\n\n if (!root)\n\n return;\n\n      std::stack<binaryTree<tVal>\
    \ *> currLevel;\n\n      std::stack<binaryTree<tVal> *> nextLevel;\n\n      currLevel.push(root);\n\
    \n while (!currLevel.empty())\n\n      {\n\n         tmp = currLevel.top();\n\n\
             currLevel.pop();\n\n if (tmp)\n\n         {\n\nstd::cout << \" v=\" <<\
    \ tmp->v__;\n\n if (left2right)\n\n            {\n\n               nextLevel.push(tmp->left);\n\
    \n               nextLevel.push(tmp->right);\n\n            }\n\n else\n\n           \
    \ {\n\n               nextLevel.push(tmp->right);\n\n               nextLevel.push(tmp->left);\n\
    \n            }\n\n         }\n\n if (currLevel.empty())\n\n         {\n\n           \
    \ left2right = !left2right;\n\n            currLevel.swap(nextLevel);\n\n        \
    \ }\n\n      }\n\n   }\n\n### Complexity\n\nTime complexity is ![](images/00001.jpeg)\
    \ and space complexity is ![](images/00001.jpeg).\n\n## 13 Printing the lowest\
    \ common ancestor (LCA)\n\n### Solution\n\nA solution can be computed recursively.\
    \ The lowest common ancestor for two nodes ![](images/00007.jpeg) and ![](images/00008.jpeg)\
    \ is ![](images/00009.jpeg)if the root is ![](images/00010.jpeg)Otherwise the\
    \ LCA is ![](images/00007.jpeg) (respectively![](images/00011.jpeg)) if the root\
    \ is ![](images/00007.jpeg) (respectively![](images/00011.jpeg)). Those are the\
    \ base cases. Then the solution is recursively computed for the left and for the\
    \ right subtree. After returning from recursion, if both left and right are available,\
    \ then the LCA is the current root, otherwise it is left, if this is available\
    \ (respectively right, if this is available).\n\n### Code\n\ntemplate<typename\
    \  tVal>\n\n binaryTree<tVal> * LCA(binaryTree<tVal> * root,\n\n binaryTree<tVal>\
    \ * n1, binaryTree<tVal> * n2)\n\n   {\n\n if (!root)\n\n return  NULL;\n\n if\
    \ (root == n1 || root == n2)\n\n return  root;\n\n binaryTree<tVal> * left =\n\
    \n         LCA(root->left, n1, n2);\n\n binaryTree<tVal> * right =\n\n        \
    \ LCA(root->right, n1, n2);\n\n if (left && right)\n\n return  root;\n\n else\n\
    \n return (left ? left : right);\n\n   }\n\n### Complexity\n\nTime complexity\
    \ is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg).\n\n\
    ## 14 Implementing “find” and “insert” in a Binary Search Tree\n\n### Solution\n\
    \nA Binary Search Tree (BST) is a tree where each node has no more than two children.\
    \ The left subtree of a node contains only nodes with keys being strictly less\
    \ than the node's key. The right subtree of a node contains only nodes with keys\
    \ being greater than the node's key.\n\nFind() begins by examining the [root node](http://en.wikipedia.org/wiki/Tree_(data_structure)#root_nodes).\
    \ If the tree is null, the key does not exist in the tree. If the key equals the\
    \ one of the root, find() returns the root. If the key is less than the one of\
    \ the root, the left subtree is searched. If the key is greater than the one of\
    \ the root, the right subtree is searched. This method is repeated recursively\
    \ or iteratively. Here below we propose a recursive version and we leave to the\
    \ interested reader the task of implementing an iterative version on his own.\n\
    \nInsert() follows a similar approach. The candidate key for insertion is searched\
    \ inside the tree. If it is found, the process returns. Otherwise if the search\
    \ reaches a null node, the key is inserted in that position. The process can be\
    \ either recursive or iterative.\n\n### Code\n\n template<typename  tVal>\n\n\
    \ template<typename  tVal>\n\n struct  binaryTree\n\n   {\n\n tVal v__;\n\n struct\
    \  binaryTree<tVal> * left;\n\n struct  binaryTree<tVal> * right;\n\n      binaryTree(tVal\
    \  v) : v__(v),\n\n         left(NULL), right(NULL) {}\n\n   };\n\n template<typename\
    \  tVal>\n\n binaryTree<tVal> * find(binaryTree<tVal> * const  root,\n\n const\
    \  tVal  k)\n\n   {\n\n if (!root)\n\n return  NULL;\n\n return ((root->v__ <\
    \ k) ? find(root->right, k) :\n\n         (root->v__ > k ? find(root->left, k)\
    \ : root));\n\n   }\n\n template<typename  tVal>\n\n void insert(binaryTree<tVal>\
    \ * & root, const  tVal  k)\n\n   {\n\n if (!root)\n\n      {\n\n root = new \
    \ binaryTree<tVal>(k);\n\n return;\n\n      }\n\n if (root->v__ < k)\n\n        \
    \ insert(root->right, k);\n\n else  if (root->v__ > k)\n\n         insert(root->left,\
    \ k);\n\n   }\n\n### Complexity\n\nAverage time complexity of “insert” and “find”\
