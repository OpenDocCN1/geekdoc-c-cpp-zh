    \n# 跳表 (Skip List)\n\n跳表是一种通过多层索引来通过快速查找、插入和删除的数据结构。它在平均复杂度上可以与平衡二搜索树相比，但实现更为简单。\n\
    \n## 结构\n\n跳表由多个层有序链表组成：\n- 底层是一个全排序的单向链表，包含了所有的元素。\n- 每一层都是作为下层的索引，层越高，元素越稀疏。\n\
    \n## 算法\n\n### 查找 (Search)\n\n从顶层节点开始，向右移动。如果下一个节点的键大于目标值，则向下移动一层，直到找到目标值或到达底部且未找到该键。\n\
    \n### 插入 (Insert)\n\n首先使用查找算法找到元素应该所在的位置。然后，对于每一层，根据给定的概率 $p$（通常为 $0.5$）决定是否在该层创建一个新节点并将其插入。\n\
    \n### 删除 (Delete)\n\n首先查找该元素。如果存在，在所有包含该元素的层中将其删除，并更新相关节点的指针。\n\n## 代码\n\n```cpp\n\
    #ifndef SKIP_HEAD_\n#define SKIP_HEAD_\n#include <iostream>\n#include <cstdlib>\n\
    #define DEBUG2 1\nnamespace Tree{\ntypedef int num;\ntemplate <typename Tkey,\
    \ typename Tval>\nclass Skiplist{\nprivate:\n    struct node {\n        Tkey key_;\
    \ // 键\n        Tval val_; // 值\n        num size_; // 数组大小\n        node **next_;\
    \ // 指针数组\n        node(const Tkey key, const Tval val, num size) :\n        \
    \    key_(key), val_(val), size_(size), next_(new node*[size_]) {\n          \
    \  for (num i = 0; i < size_; ++i) next_[i] = 0;\n        }\n    };\n    typedef\
    \ node* const link;\n    Tkey default_key_; // 跳表的默认键\n    Tval default_val_;\
    \ // 跳表的默认值\n    link head_; // 跳表头\n    num lgN_; // 当前连接层数\n    num lgNmax_;\
    \ // 最大连接层数\n    // 随机跳表扩展\n    num rand_sl_gen__() {\n        num i, j, t = rand();\
    \ // t 在 [0, RAND_MAX]\n        // 生成 j=2, 4, ... i < lgNmax_\n        // t >\
    \ RAND_MAX / 2^i\n        for (i = 1, j = 2; i < lgNmax_; i++, j += j)\n     \
    \       if (t > RAND_MAX / j) break;\n        // t 是一个小于 1/2^i 的数字\n        if\
    \ (i > lgN_) // 扩展当前层\n            lgN_ = i; // 这呈对数增长\n        return i;\n  \
    \  }\n    // 删除一个键和值\n    void remove__(link t, Tkey key, num k) {\n#ifdef DEBUG2\n\
    std::cerr << \"remove__ \" << t << \" key=\"\n```\n"
