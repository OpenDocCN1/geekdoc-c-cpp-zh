    \ © 2015 Antonio Gulli\n保留所有权利。\n\nISBN:\nISBN-13:\n\n《树》是包含 25 章关于算法、问题解决和 C++\
    \ 编程的系列书籍中的第五本。\n\n## 献辞\n致我的妻子 Francesca\n爱总会在宽恕与因果之间找到出路\n\n## 致谢\n\n## 目录\n\
    1. 1 实现二叉树的前序遍历](#\n    - [解决方案]\n    - [代码]\n    - [复杂度]\n14. 14 在二叉搜索树中实现“查找”和“插入”](#\n\
    \    - [解决方案]\n    - [代码]\n    - [复杂度]\n16. 16 在 BST 中实现 findMin 和 findMax](#\n\
    \    - [解决方案]\n    - [代码]\n    - [复杂度]\n28. [28 实现字典树 (Tries)](#\n    - [解决方案]\n\
    \    - [代码]\n    - [复杂度]\n29. [29 实现线段树](#\n    - [解决方案]\n    - [代码]\n    - [复杂度]\n\
    30. [30 实现区间最小查询](#\n    - [解决方案]\n    - [代码]\n    - [复杂度]\n31. [31 实现后缀树](#\n\
    \    - [解决方案]\n    - [代码]\n    - [复杂度]\n\n# 1 实现二叉树的前序遍历\n\n### 解决方案\n\n"
- fmt: "\nA binary tree is a tree where every node has at most two children. The non-recursive\
    \ pre-order visit can be implemented by using a stack.\n\nIn a loop:\n* First\
    \ the current node is visited.\n* Then the left children are pushed until a leaf\
    \ is reached.\n* Then if the stack is empty, we leave the loop. Otherwise the\
    \ top of the stack is popped out and the visit continues towards the right children.\n\
    \n### Code\n```cpp\ntemplate<typename tVal>\nstruct binaryTree {\n    tVal v__;\n\
    \    struct binaryTree<tVal> * left;\n    struct binaryTree<tVal> * right;\n \
    \   binaryTree(tVal v) : v__(v), left(NULL), right(NULL) {}\n};\n\ntemplate<typename\
    \ tVal>\nvoid nonRecursivePreOrder(binaryTree<tVal> * root) {\n    std::stack<binaryTree<tVal>\
    \ *> s;\n    while (true) {\n        //left\n        while (root) {\n        \
    \    std::cout << \" v=\" << root->v__;\n            s.push(root);\n         \
    \   root = root->left;\n        }\n        if (s.empty())\n            break;\n\
    \        // this one\n        root = s.top();\n        s.pop();\n        //right\n\
    \        root = root->right;\n    }\n}\n```\n\n### Complexity\nTime complexity\
    \ is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg)\n\n\
    ## 2 Computing the diameter of a binary tree\n\n### Solution\nThe solution can\
    \ be computed easily with the use of recursion\n\n### Code\n```cpp\ntemplate<typename\
    \ tVal>\nunsigned diameter(binaryTree<tVal> * root, unsigned & dim) {\n    unsigned\
    \ left, right;\n    if (!root)\n        return 0;\n    left = diameter(root->left,\
    \ dim);\n    right = diameter(root->right, dim);\n    if (left + right > dim)\n\
    \        dim = left + right;\n    return ((left > right) ? left : right) + 1;\n\
    }\n```\n\n### Complexity\nTime complexity is ![](images/00001.jpeg) and space\
    \ complexity is ![](images/00001.jpeg).\n\n## 3 Implementing an in-order visit\
    \ for a Binary Tree\n\n### Solution\nA non-recursive in-order visit can be implemented\
    \ by using a stack.\n\nIn a loop:\n* First the left children are pushed until\
    \ a leaf is reached.\n* Then if the stack is empty, we leave the loop. Otherwise\
    \ the top of the stack pops out and the current node is visited.\n* Finally the\
    \ visit continues towards the right children\n\n### Code\n```cpp\ntemplate<typename\
    \ tVal>\nvoid nonRecursiveInOrder(binaryTree<tVal> * root) {\n    std::stack<binaryTree<tVal>\
    \ *> s;\n    while (true) {\n        //left\n        while (root) {\n        \
    \    s.push(root);\n            root = root->left;\n        }\n        if (s.empty())\n\
    \            break;\n        // this one\n        root = s.top();\n        s.pop();\n\
    \        std::cout << \" v=\" << root->v__;\n        //right\n        root = root->right;\n\
    \    }\n}\n```\n\n### Complexity\nTime complexity is ![](images/00001.jpeg) and\
    \ space complexity is ![](images/00001.jpeg)\n\n## 4 Implementing a post-order\
    \ visit for a Binary Tree\n\n### Solution\nDuring post-ordering every single node\
    \ is visited twice: the first time when moving towards the left children and then\
    \ again, when moving towards the right children. In order to differentiate the\
    \ two cases, we can compare if the current element and the right child of the\
    \ element at the top of the stack are the same.\n\n### Code\n```cpp\ntemplate<typename\
    \ tVal>\nvoid nonRecursivePostOrder(binaryTree<tVal> * root) {\n    std::stack<binaryTree<tVal>\
    \ *> s;\n    while (true) {\n        if (root) {\n            s.push(root);\n\
    \            root = root->left;\n        } else {\n            if (s.empty())\n\
    \                break;\n            if (!s.top()->right) {\n                root\
    \ = s.top();\n                s.pop();\n                std::cout << \" v=\" <<\
    \ root->v__;\n                if (root == s.top()->right) {\n                \
    \    std::cout << \" v=\" << s.top()->v__;\n                    s.pop();\n   \
    \             }\n            }\n            if (!s.empty())\n                root\
    \ = s.top()->right;\n            else\n                root = NULL;\n        }\n\
    \    }\n}\n```\n\n### Complexity\nTime complexity is ![](images/00001.jpeg) and\
    \ space complexity is ![](images/00001.jpeg)\n\n## 5 Implementing a level order\
    \ visit for a Binary Tree\n\n### Solution\nLevel order visits can be implemented\
    \ for all nodes at one level before going to the next level. The idea is very\
    \ simple.\n\nIn a loop:\n* First the root is visited\n* Then while traversing\
    \ nodes at ![](images/00002.jpeg)all the nodes at level ![](images/00003.jpeg)\
    \ are stored in a queue\n* The loop is continued until all the levels are completed\n\
    \n### Code\n```cpp\ntemplate<typename tVal>\nvoid nonRecursiveLevelOrder(binaryTree<tVal>\
    \ * root) {\n    std::queue<binaryTree<tVal> *> q;\n    binaryTree<tVal> * tmp;\n\
    \    if (!root)\n        return;\n    q.push(root);\n    while (!q.empty()) {\n\
    \        tmp = q.front();\n        q.pop();\n        std::cout << \" v=\" << tmp->v__;\n\
    \        if (tmp->left)\n            q.push(tmp->left);\n        if (tmp->right)\n\
    \            q.push(tmp->right);\n    }\n}\n```\n\n### Complexity\nTime complexity\
    \ is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg).\n\n\
    ## 6 Counting the number of leaves in a tree\n\n### Solution\nA solution can be\
    \ provided by modifying the level order visit where we increment a counter every\
    \ time we reach a leaf node.\n\n### Code\n```cpp\ntemplate<typename tVal>\nunsigned\
    \ NumLeavesRecursiveLevelOrder(binaryTree<tVal> * root) {\n    std::queue<binaryTree<tVal>\
    \ *> q;\n    binaryTree<tVal> * tmp;\n    unsigned count = 0;\n    if (!root)\n\
    \        return count;\n    q.push(root);\n    while (!q.empty()) {\n        tmp\
    \ = q.front();\n        q.pop();\n        if (!tmp->left && !tmp->right)\n   \
    \         count++; // another leaf\n        else {\n            if (tmp->left)\n\
    \                q.push(tmp->left);\n            if (tmp->right)\n           \
    \     q.push(tmp->right);\n        }\n    }\n    return count;\n}\n```\n\n###\
    \ Complexity\nTime complexity is ![](images/00001.jpeg) and space complexity is\
    \ ![](images/00001.jpeg).\n\n## 7 Checking if two binary trees are structurally\
    \ identical\n\n### Solution\nA solution can be provided by recursion. We consider\
    \ as base cases when both nodes are null, or if only one of them is null. Otherwise\
    \ the algorithm checks if both nodes contain the same value and if both left children\
    \ and right children are recursively structurally identical.\n\n### Code\n```cpp\n\
    template<typename tVal>\nunsigned structIdentical(binaryTree<tVal> * r1, binaryTree<tVal>\
    \ * r2) {\n    if (!r1 && !r2)\n        return true;\n    if (!r1 || !r2)\n  \
    \      return false;\n    return (r1->v__ == r2->v__ && structIdentical(r1->left,\
    \ r2->left) && structIdentical(r1->right, r2->right));\n}\n```\n\n### Complexity\n\
    Time complexity is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg).\n\
    \n## 8 Printing all the paths in a tree\n\n### Solution\nA solution can be provided\
    \ by recursion. The idea is to keep a vector ![](images/00004.jpeg)passing during\
    \ recursion, while every node is pushed_back() to ![](images/00005.jpeg). Every\
    \ time we reach a leaf, the vector is printed.\n\n```cpp\ntemplate<typename tVal>\n\
    void printAllPaths(binaryTree<tVal> * root, std::vector<tVal> path) {\n    if\
    \ (!root)\n        return;\n    path.push_back(root->v__);\n    if (!root->left\
    \ && !root->right) {\n        std::vector<tVal>::iterator it = path.begin();\n\
    \        for (; it != path.end(); it++)\n            std::cout << \" v=\" << *it;\n\
    \        std::cout << std::endl;\n    } else {\n        printAllPaths(root->left,\
    \ path);\n        printAllPaths(root->right, path);\n    }\n}\n```\n\n## 9 Verifying\
    \ if a path sum is equal to an integer\n\n### Solution\nThe idea is to subtract\
    \ the current value from the given sum, while visiting recursively the tree.\n\
    \n```cpp\ntemplate<typename tVal>\nbool hasSum(binaryTree<tVal> * root, int sum)\
    \ {\n    if (!root)\n        return (sum == 0);\n    else {\n        int remainingSum\
    \ = sum - root->v__;\n        if ((root->left && root->right) || (!root->left\
    \ && !root->right))\n            return (hasSum(root->left, remainingSum) || hasSum(root->right,\
    \ remainingSum));\n        else\n            if (root->left)\n               \
    \ return hasSum(root->left, remainingSum);\n            else\n               \
    \ return hasSum(root->right, remainingSum);\n    }\n}\n```\n"
  raw: "A binary tree is a tree where every node has at most two children.  The non-recursive\
    \ pre-order visit can be implemented by using a stack.\n\nIn a loop:\n\n*   First\
    \ the current node is visited.\n\n*   Then the left children are pushed until\
    \ a leaf is reached\n\n*   Then if the stack is empty, we leave the loop. Otherwise\
    \ the top of the stack is popped out and the visit continues towards the right\
    \ children.\n\n### Code\n\ntemplate<typename  tVal>\n\n struct  binaryTree\n\n\
       {\n\n tVal v__;\n\n struct  binaryTree<tVal> * left;\n\n struct  binaryTree<tVal>\
    \ * right;\n\n      binaryTree(tVal  v) : v__(v),\n\n         left(NULL), right(NULL)\
    \ {}\n\n   };\n\n template<typename  tVal>\n\n void nonRecursivePreOrder(binaryTree<tVal>\
    \ * root)\n\n   {\n\n      std::stack<binaryTree<tVal> *> s;\n\n while (true)\n\
    \n      {\n\n //left\n\n while (root)\n\n         {\n\nstd::cout << \" v=\" <<\
    \ root->v__;\n\n            s.push(root);\n\n root = root->left;\n\n         }\n\
    \n if (s.empty())\n\n break;\n\n // this one\n\n root = s.top();\n\n         s.pop();\n\
    \n //right\n\n root = root->right;\n\n      }\n\n   }\n\n### Complexity\n\nTime\
    \ complexity is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg)\n\
    \n## 2 Computing the diameter of a binary tree\n\n### Solution\n\nThe solution\
    \ can be computed easily with the use of recursion\n\n### Code\n\ntemplate<typename\
    \  tVal>\n\n unsigned diameter(binaryTree<tVal> * root, unsigned & dim)\n\n  \
    \ {\n\n unsigned left, right;\n\n if (!root)\n\n return 0;\n\n      left = diameter(root->left,\
    \ dim);\n\n      right = diameter(root->right, dim);\n\n if (left + right > dim)\n\
    \n dim = left + right;\n\n return ((left > right) ? left : right) + 1;\n\n   }\n\
    \n### Complexity\n\nTime complexity is ![](images/00001.jpeg) and space complexity\
    \ is ![](images/00001.jpeg).\n\n## 3 Implementing an in-order visit for a Binary\
    \ Tree\n\n### Solution\n\nA non-recursive in-order visit can be implemented by\
    \ using a stack.\n\nIn a loop:\n\n*   First the left children are pushed until\
    \ a leaf is reached\n\n*   Then if the stack is empty, we leave the loop. Otherwise\
    \ the top of the stack pops out and the current node is visited.\n\n*   Finally\
    \ the visit continues towards the right children\n\n### Code\n\n template<typename\
    \  tVal>\n\n void nonRecursiveInOrder(binaryTree<tVal> * root)\n\n   {\n\n     \
    \ std::stack<binaryTree<tVal> *> s;\n\n while (true)\n\n      {\n\n //left\n\n\
    \ while (root)\n\n         {\n\n            s.push(root);\n\n root = root->left;\n\
    \n         }\n\n if (s.empty())\n\n break;\n\n // this one\n\n root = s.top();\n\
    \n         s.pop();\n\nstd::cout << \" v=\" << root->v__;\n\n //right\n\n root\
    \ = root->right;\n\n      }\n\n   }\n\n### Complexity\n\nTime complexity is ![](images/00001.jpeg)\
    \ and space complexity is ![](images/00001.jpeg)\n\n## 4 Implementing a post-order\
    \ visit for a Binary Tree\n\n### Solution\n\nDuring post-ordering every single\
    \ node is visited twice: the first time when moving towards the left children\
    \ and then again, when moving towards the right children. In order to differentiate\
    \ the two cases, we can compare if the current element and the right child of\
    \ the element at the top of the stack are the same.\n\n### Code\n\n template<typename\
    \  tVal>\n\n void nonRecursivePostOrder(binaryTree<tVal> * root)\n\n   {\n\n     \
    \ std::stack<binaryTree<tVal> *> s;\n\n while (true)\n\n      {\n\n if (root)\n\
    \n         {\n\n            s.push(root);\n\n root = root->left;\n\n         }\n\
    \n else {\n\n if (s.empty())\n\n break;\n\n else\n\n if (!s.top()->right)\n\n\
                   {\n\n root = s.top();\n\n                  s.pop();\n\nstd::cout\
    \ << \" v=\" << root->v__;\n\n if (root == s.top()->right)\n\n                 \
    \ {\n\nstd::cout << \" v=\" << s.top()->v__;\n\n                     s.pop();\n\
    \n                  }\n\n               }\n\n if (!s.empty())\n\n root = s.top()->right;\n\
    \n else\n\n root = NULL;\n\n} // else\n\n} // while\n\n   }\n\n### Complexity\n\
    \nTime complexity is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg)\n\
    \n## 5 Implementing a level order visit for a Binary Tree\n\n### Solution\n\n\
    Level order visits can be implemented for all nodes at one level before going\
    \ to the next level. The idea is very simple.\n\nIn a loop:\n\n*   First the root\
    \ is visited\n\n*   Then while traversing nodes at level ![](images/00002.jpeg)all\
    \ the nodes at level ![](images/00003.jpeg) are stored in a queue\n\n*   The loop\
    \ is continued until all the levels are completed\n\n### Code\n\ntemplate<typename\
    \  tVal>\n\n void nonRecursiveLevelOrder(binaryTree<tVal> * root)\n\n   {\n\n\
          std::queue<binaryTree<tVal> *> q;\n\n binaryTree<tVal> * tmp;\n\n if (!root)\n\
    \n return;\n\n      q.push(root);\n\n while (!q.empty())\n\n      {\n\n        \
    \ tmp = q.front();\n\n         q.pop();\n\nstd::cout << \" v=\" << tmp->v__;\n\
    \n if (tmp->left)\n\n            q.push(tmp->left);\n\n if (tmp->right)\n\n           \
    \ q.push(tmp->right);\n\n      }\n\n   }\n\n### Complexity\n\nTime complexity\
    \ is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg).\n\n\
    ## 6 Counting the number of leaves in a tree\n\n### Solution\n\nA solution can\
    \ be provided by modifying the level order visit where we increment a counter\
    \ every time we reach a leaf node.\n\n### Code\n\ntemplate<typename  tVal>\n\n\
    \ unsigned NumLeavesNonRecursiveLevelOrder(binaryTree<tVal> * root)\n\n   {\n\n\
          std::queue<binaryTree<tVal> *> q;\n\n binaryTree<tVal> * tmp;\n\n unsigned\
    \ count = 0;\n\n if (!root)\n\n return count;\n\n      q.push(root);\n\n while\
    \ (!q.empty())\n\n      {\n\n         tmp = q.front();\n\n         q.pop();\n\n\
    \ if (!tmp->left && !tmp->right)\n\ncount++; // another leaf\n\n else\n\n        \
    \ {\n\n if (tmp->left)\n\n               q.push(tmp->left);\n\n if (tmp->right)\n\
    \n               q.push(tmp->right);\n\n         }\n\n      }\n\n return count;\n\
    \n   }\n\n### Complexity\n\nTime complexity is ![](images/00001.jpeg) and space\
    \ complexity is ![](images/00001.jpeg).\n\n## 7 Checking if two binary trees are\
    \ structurally identical\n\n### Solution\n\nA solution can be provided by recursion.\
    \ We consider as base cases when both nodes are null, or if only one of them is\
    \ null. Otherwise the algorithm checks if both nodes contain the same value and\
    \ if both left children and right children are recursively structurally identical.\n\
    \n### Code\n\ntemplate<typename  tVal>\n\n unsigned structIdentical(binaryTree<tVal>\
    \ * r1, binaryTree<tVal> * r2)\n\n   {\n\n if (!r1 && !r2)\n\n return  true;\n\
    \n if (!r1 || !r2)\n\n return  false;\n\n return (r1->v__ == r2->v__ &&\n\n        \
    \ structIdentical(r1->left, r2->left) &&\n\n         structIdentical(r1->right,\
    \ r2->right));\n\n###  }\n\n### Complexity\n\nTime complexity is ![](images/00001.jpeg)\
    \ and space complexity is ![](images/00001.jpeg).\n\n## 8 Printing all the paths\
    \ in a binary tree\n\n### Solution\n\nA solution can be provided by recursion.\
    \ The idea is to keep a vector ![](images/00004.jpeg)passing during recursion,\
    \ while every node is pushed_back() to ![](images/00005.jpeg). Every time we reach\
    \ a leaf, the vector is printed.\n\n### Code\n\ntemplate<typename  tVal>\n\n void\
    \ printAllPaths(binaryTree<tVal> * root,\n\n      std::vector<tVal> path)\n\n\
       {\n\n if (!root)\n\n return;\n\n path.push_back(root->v__);\n\n if (!root->left\
    \ && !root->right)\n\n      {\n\n         std::vector<tVal>::iterator it = path.begin();\n\
    \n for (; it != path.end(); it++)\n\nstd::cout << \" v=\" << *it;\n\n        \
    \ std::cout << std::endl;\n\n      }\n\n else\n\n      {\n\n         printAllPaths(root->left,\
    \ path);\n\n         printAllPaths(root->right, path);\n\n      }\n\n   }\n\n\
    ### Complexity\n\nTime complexity is ![](images/00001.jpeg) and space complexity\
    \ is ![](images/00001.jpeg).\n\n## 9 Verifying if a path sum is equal to an integer\n\
    \n### Solution\n\nThe idea is to subtract the current value from the given sum,\
    \ while visiting recursively the tree.\n\n### Code\n\ntemplate<typename  tVal>\n\
    \n bool hasSum(binaryTree<tVal> * root,\n\n int  sum)\n\n   {\n\n if (!root)\n\
    \n return (sum == 0);\n\n else\n\n      {\n\n int remainingSum = sum - root->v__;\n\
    \n if ((root->left && root->right) ||\n\n            (!root->left && !root->right))\n\
    \n return (hasSum(root->left, remainingSum) ||\n\n            hasSum(root->right,\
    \ remainingSum));\n\n else\n\n if (root->left)\n\n return hasSum(root->left, remainingSum);\n\
    \n else\n\n return hasSum(root->right, remainingSum);\n\n      }\n\n   }\n\n###\
    \ Complexity"
