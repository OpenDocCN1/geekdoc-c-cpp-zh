    class Trie\n{\nprivate:\n    // a node contains a ptr to array of nodes\n    struct\
    \ node\n    {\n        // branch for this node\n        node **next;\n       \
    \ node() : next(new node*[BRANCHLEVEL])\n        {\n            for (unsigned\
    \ int i = 0; i < BRANCHLEVEL; i++)\n                next[i] = NULL;\n        }\n\
    \    };\n    typedef node *link;\n    link head; // the head\n    // recursive\
    \ deletion of nodes\n    void deleteTrie__(link l)\n    {\n        if (!l)\n \
    \           return;\n        else\n        {\n            for (unsigned int i\
