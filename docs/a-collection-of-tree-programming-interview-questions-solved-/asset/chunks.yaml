  trans: "\n\n二叉树是每个节点最多有两个子节点的树。非递归的前序遍历可以使用栈来实现。\n\n在循环中：\n* 首先访问当前节点。\n* 然后将左子节点推入栈，直到到达叶子节点。\n\
    * 接着，如果栈为空，则退出循环。否则，从栈顶弹出元素并继续向右子节点遍历。\n\n### Code\n```cpp\ntemplate<typename\
    \ tVal>\nstruct binaryTree {\n    tVal v__;\n    struct binaryTree<tVal> * left;\n\
    \    struct binaryTree<tVal> * right;\n    binaryTree(tVal v) : v__(v), left(NULL),\
    \ right(NULL) {}\n};\n\ntemplate<typename tVal>\nvoid nonRecursivePreOrder(binaryTree<tVal>\
    \ * root) {\n    std::stack<binaryTree<tVal> *> s;\n    while (true) {\n     \
    \   //left\n        while (root) {\n            std::cout << \" v=\" << root->v__;\n\
    \            s.push(root);\n            root = root->left;\n        }\n      \
    \  if (s.empty())\n            break;\n        // this one\n        root = s.top();\n\
    \        s.pop();\n        //right\n        root = root->right;\n    }\n}\n```\n\
    \n### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\n##\
    \ 2 计算二叉树的直径\n\n### Solution\n可以使用递归方便地计算该解决方案\n\n### Code\n```cpp\ntemplate<typename\
    \ tVal>\nunsigned diameter(binaryTree<tVal> * root, unsigned & dim) {\n    unsigned\
    \ left, right;\n    if (!root)\n        return 0;\n    left = diameter(root->left,\
    \ dim);\n    right = diameter(root->right, dim);\n    if (left + right > dim)\n\
    \        dim = left + right;\n    return ((left > right) ? left : right) + 1;\n\
    }\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)。\n\
    \n## 3 实现二叉树的中序遍历\n\n### Solution\n非递归的中序遍历可以使用栈来实现。\n\n在循环中：\n* 首先将左子节点推入栈，直到到达叶子节点。\n\
    * 接着，如果栈为空，则退出循环。否则，从栈顶弹出并访问当前节点。\n* 最后，继续向右子节点遍历\n\n### Code\n```cpp\ntemplate<typename\
    \ tVal>\nvoid nonRecursiveInOrder(binaryTree<tVal> * root) {\n    std::stack<binaryTree<tVal>\
    \ *> s;\n    while (true) {\n        //left\n        while (root) {\n        \
    \    s.push(root);\n            root = root->left;\n        }\n        if (s.empty())\n\
    \            break;\n        // this one\n        root = s.top();\n        s.pop();\n\
    \        std::cout << \" v=\" << root->v__;\n        //right\n        root = root->right;\n\
    \    }\n}\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\
    \n## 4 实现二叉树的后序遍历\n\n### Solution\n在后序遍历期间，每个节点都会被访问两次：第一次是在向左子节点移动时，第二次是在向右子节点移动时。为了区分这两种情况，我们可以比较当前元素与栈顶元素的右子节点是否相同。\n\
    \n### Code\n```cpp\ntemplate<typename tVal>\nvoid nonRecursivePostOrder(binaryTree<tVal>\
    \ * root) {\n    std::stack<binaryTree<tVal> *> s;\n    while (true) {\n     \
    \   if (root) {\n            s.push(root);\n            root = root->left;\n \
    \       } else {\n            if (s.empty())\n                break;\n       \
    \     if (!s.top()->right) {\n                root = s.top();\n              \
    \  s.pop();\n                std::cout << \" v=\" << root->v__;\n            \
    \    if (root == s.top()->right) {\n                    std::cout << \" v=\" <<\
    \ s.top()->v__;\n                    s.pop();\n                }\n           \
    \ }\n            if (!s.empty())\n                root = s.top()->right;\n   \
    \         else\n                root = NULL;\n        }\n    }\n}\n```\n\n###\
    \ Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\n## 5 实现二叉树的层序遍历\n\
    \n### Solution\n层序遍历可以在进入下一层之前对该层的所有节点进行遍历。该思路非常简单。\n\n在循环中：\n* 首先访问根节点\n* 然后在遍历\
    \ ![](img/00002.jpeg) 处的节点时，将 ![](img/00003.jpeg) 层上的所有节点存储在队列中\n* 持续循环直到完成所有层级\n\
    \n### Code\n```cpp\ntemplate<typename tVal>\nvoid nonRecursiveLevelOrder(binaryTree<tVal>\
    \ * root) {\n    std::queue<binaryTree<tVal> *> q;\n    binaryTree<tVal> * tmp;\n\
    \    if (!root)\n        return;\n    q.push(root);\n    while (!q.empty()) {\n\
    \        tmp = q.front();\n        q.pop();\n        std::cout << \" v=\" << tmp->v__;\n\
    \        if (tmp->left)\n            q.push(tmp->left);\n        if (tmp->right)\n\
    \            q.push(tmp->right);\n    }\n}\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg)\
    \ 空间复杂度为 ![](img/00001.jpeg)\n\n## 6 计算二叉树的叶子节点数量\n\n### Solution\n可以通过修改层序遍历来实现，每当我们到达叶子节点时增加一个计数器。\n\
    \n### Code\n```cpp\ntemplate<typename tVal>\nunsigned NumLeavesLevelOrder(binaryTree<tVal>\
    \ * root) {\n    std::queue<binaryTree<tVal> *> q;\n    binaryTree<tVal> * tmp;\n\
    \    unsigned count = 0;\n    if (!root)\n        return count;\n    q.push(root);\n\
    \    while (!q.empty()) {\n        tmp = q.front();\n        q.pop();\n      \
    \  if (!tmp->left && !tmp->right)\n            count++;\n        else {\n    \
    \        if (tmp->left)\n                q.push(tmp->left);\n            if (tmp->right)\n\
    \                q.push(tmp->right);\n        }\n    }\n    return count;\n}\n\
    ```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\
    \n## 7 检查两棵二叉树是否结构相同\n\n### Solution\n可以使用递归来实现。基础情况为两个节点都为空，或者其中一个一个为空。否则，算法检查两个节点的值是否相同，以及左子树和右子树是否结构相同。\n\
    \n### Code\n```cpp\ntemplate<typename tVal>\nbool structIdentical(binaryTree<tVal>\
    \ * r1, binaryTree<tVal> * r2) {\n    if (!r1 && !r2)\n        return true;\n\
    \    if (!r1 || !r2)\n        return false;\n    return (r1->v__ == r2->v__ &&\
    \ structIdentical(r1->left, r2->left) && structIdentical(r1->right, r2->right));\n\
    }\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\
    \n## 8 打印树中的所有路径\n\n### Solution\n可以使用递归来实现。该思路是在递归过程中传递一个 vector，并将每个节点 `push_back`\
    \ 进去。每当我们到达叶子节点时，打印该 vector。\n\n### Code\n```cpp\ntemplate<typename tVal>\nvoid\
    \ printAllPaths(binaryTree<tVal> * root, std::vector<tVal> path) {\n    if (!root)\n\
    \        return;\n    path.push_back(root->v__);\n    if (!root->left && !root->right)\
    \ {\n        std::vector<tVal>::iterator it = path.begin();\n        for (; it\
    \ != path.end(); it++)\n            std::cout << \" v=\" << *it;\n        std::cout\
    \ << std::endl;\n    } else {\n        printAllPaths(root->left, path);\n    \
    \    printAllPaths(root->right, path);\n    }\n}\n```\n\n## 9 验证路径之和是否等于某个整数\n\
    \n### Solution\n该思路是在递归遍历树时，从给的和中减去当前值。\n\n```cpp\ntemplate<typename tVal>\nbool\
    \ hasSum(binaryTree<tVal> * root, int sum) {\n    if (!root)\n        return (sum\
    \ == 0);\n    else {\n        int remainingSum = sum - root->v__;\n        if\
    \ ((root->left && root->right) || (!root->left && !root->right))\n           \
    \ return (hasSum(root->left, remainingSum) || hasSum(root->right, remainingSum));\n\
    \        else\n            if (root->left)\n                return hasSum(root->left,\
    \ remainingSum);\n            else\n                return hasSum(root->right,\
    \ remainingSum);\n    }\n}\n```\n"
- fmt: "\nTime complexity is ![](images/00001.jpeg) and space complexity is ![](images/00001.jpeg).\n\
    \n## 10. Find the maximum path sum between two leaves of a binary tree\n\n###\
    \ Solution\nThe maximum path sum between two leaves can either touch the root\
    \ of the three or can be located on a subtree only if it belongs to the tree itself.\
    \ Hence we have the following cases of recursion:\n\n- The base case is when the\
    \ root is `NULL` and we return `0`.\n- Then we compute recursively the maximum\
    \ path sum for the left and right subtree respectively.\n- Then we compute the\
    \ maximum for the left subtree, for the right subtree, and for the subtree rooted\
    \ at the current node. If this maximum improves the total maximum observed so\
    \ far, then the total maximum is updated.\n- Returning from recursion we compute\
    \ the maximum between the right and left subtrees and add the weight for the current\
    \ node.\n\n### Code\n```cpp\ntemplate<typename  tVal>\ntVal max(tVal  a, tVal\
    \  b)\n  {\n  return (a >= b) ? a : b;\n  }\n\ntemplate<typename  tVal>\nint maxPathSum(binaryTree<tVal>\
    \ * root, tVal &res)\n  {\n  if (!root)\n    return 0;\n  int lLPSum = maxPathSum(root->left,\
    \ res);\n  int rLPSum = maxPathSum(root->right, res);\n  int curr_sum = max((lLPSum\
    \ + rLPSum + root->v__),\n         max(lLPSum, rLPSum));\n  if (res < curr_sum)\n\
    \    res = curr_sum;\n  return max(lLPSum, rLPSum) + root->v__;\n  }\n```\n\n\
    ### Complexity\nTime complexity is ![](images/00001.jpeg) and space complexity\
    \ is ![](images/00001.jpeg).\n\n## 11. Reconstructing a tree given its pre-order\
    \ and in-order traversals\n\n### Solution\nIn a preorder visit the root is always\
    \ the leftmost element of each subtree. So we start to put the leftmost element\
    \ of the preorder array of visits as the root of the whole tree. Now: if we search\
    \ that very element in the inorder array, we can immediately infer all elements\
    \ that are before that very value, belonging to the left subtree and all elements\
    \ after that same value, belonging to the right subtree. The solution can be therefore\
    \ computed recursively.\n\n### Code\n```cpp\ntemplate<typename  tVal>\nunsigned\
    \ search(std::vector<tVal> inorder,\n  unsigned  start, unsigned  end, tVal  v)\n\
    \  {\n  for (unsigned i = start; i <= end; i++)\n    if (inorder[i] == v)\n  \
    \    return i;\n  }\n\ntemplate<typename  tVal>\nbinaryTree<tVal> * buildBTfromInorderAndPreorder(\n\
    \  const std::vector<tVal> & inOrder,\n  const std::vector<tVal> & preOrder,\n\
    \  unsigned & preIndex,\n  unsigned  inStart, unsigned  inEnd)\n  {\n  binaryTree<tVal>\
    \ * n;\n  n->v__ = preOrder[preIndex++];\n  if (inStart == inEnd)\n    return\
    \ n;\n  int inIndex =\n      search(inOrder, inStart, inEnd, n->v__);\n\n  n->left\
    \ =\n      buildBTfromInorderAndPreorder(inOrder, preOrder,\n      inStart, inIndex\
    \ - 1);\n  n->right =\n      buildBTfromInorderAndPreorder(inOrder, preOrder,\n\
    \      inIndex+1, inEnd);\n  }\n```\n\n### Complexity\nTime complexity is ![](images/00006.jpeg).\
    \ A question for the interested reader could be, whether or not this one is the\
    \ optimal complexity.\n\n## 12. Printing a zig-zag traversal\n\n### Solution\n\
    A Zig-Zag traversal is implemented by using two stacks which are swapped at every\
    \ level. During the visit of `currentLevel` all children are inserted in the `nextLevel`\
    \ stack. To be considered: a Boolean value is maintained for determining the direction\
    \ of a visit (either left to right, or right to left) and this direction in reversed\
    \ at every cycle. When a `currentLevel` stack is empty, then it is swapped with\
    \ `nextLevel`. By using two stacks, a zig-zag visit is a variant of a level order\
    \ visit.\n\n### Code\n```cpp\ntemplate<typename  tVal>\nvoid printZigZag(binaryTree<tVal>\
    \ * root)\n  {\n  binaryTree<tVal> * tmp;\n  bool left2right = true;\n  if (!root)\n\
    \    return;\n\n      std::stack<binaryTree<tVal> *> currLevel;\n      std::stack<binaryTree<tVal>\
    \ *> nextLevel;\n      currLevel.push(root);\n  while (!currLevel.empty())\n \
    \     {\n        tmp = currLevel.top();\n        currLevel.pop();\n        if\
