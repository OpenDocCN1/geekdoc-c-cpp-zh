  trans: "\n\n# 插入\n\n要插入新键，请遍历树找到叶子节点，即新键应该添加的位置：\n\n* 如果节点包含的元素少于 `images/00042.jpeg`，则有空间容纳新元素，可以按照顺序进行插入。\n\
    * 否则，如果节点已满，则必须将其分为两个节点：\n    * 在叶子节点的元素和新元素之间选择中位数元素。\n    * 小于中位数的放在新的左侧节点中，大于中位数的放在新的右侧节点中。\n\
    \    * 中位数作为分隔值。\n\n分隔键被插入到节点的父节点中，如果父节点也满了，则对其进行拆分。如果该节点是根节点，我们需要在旧根上方创建一个新根节点。\n\
    \n如果拆分一直持续根节点，它将创建一个包含单个分隔键和两个子节点的新根。当一个节点被拆分时，一个键会进入父节点，但会额外增加一个键。\n\n# 删除\n\n\
    思路是找到并删除该项，然后重构树以恢复其不变性。此操作留作练习题。\n\n# 代码\n\n```cpp\n#ifndef BTREE_HEAD_\n#define\
    \ BTREE_HEAD_ 1\n#include <iostream>\n\nnamespace Tree{\ntypedef int tKey;\nclass\
    \ BtreeNode;\ntypedef BtreeNode * BtreeLink;\nclass BtreeNode {\nprivate:\n  \
    \  unsigned t__; // 2t-1 keys, 2t children\n    bool leaf__; // 是否为叶子\n    unsigned\
    \ n__; // 当前数量\n    tKey * keys__; //键数组\n    BtreeLink * children__; // 指子节点数组的指针\n\
    \npublic:\n    // 构造函数\n    BtreeNode(unsigned t, bool leaf) :\n        t__(t),\
    \ leaf__(leaf), n__(0),\n        keys__(new tKey[2 * t__ - 1]),\n        children__(new\
    \ BtreeLink[2 * t__])\n    {};\n\n    // 遍历\n    void traverse(unsigned lev=0)\
    \ {\n        std::cout << \"lev=\" << lev << \" \";\n        // n keys, n+1 childrens\n\
    \        unsigned i = 0;\n        for (; i < n__; i++) {\n            std::cout\
    \ << \" \" << keys__[i];\n            if (!leaf__)\n                children__[i]->traverse(lev+1);\n\
    \        }\n        // 最后一个孩子\n        if (!leaf__)\n            children__[i]->traverse(lev\
    \ + 1);\n    }\n\n    // 删除所有\n    void deleteAll() {\n        //n+1 children\n\
    \        for (unsigned i = 0; i <= n__; i++) {\n            if (!leaf__)\n   \
    \             children__[i]->deleteAll();\n        }\n        delete[] children__;\n\
    \        delete[] keys__;\n    };\n\n    // 析构\n    ~BtreeNode() {\n        deleteAll();\n\
    \    }\n\n    // 在 B 树中搜索\n    BtreeLink search(tKey k) {\n        unsigned i\
    \ = 0;\n        // 查找右位置\n        for (; i < n__ && k > keys__[i]; i++);\n   \
    \     // 找到键\n        if (keys__[i] == k)\n            return this;\n        //\
    \ 未找到\n        if (leaf__)\n            return NULL;\n        // 递归\n        return\
    \ children__[i]->search(k);\n    }\n\n    // 在非满节点中插入\n    void insertNonFull(tKey\
    \ k) {\n        // 最右键\n        int i = n__ - 1;\n        if (leaf__) {\n    \
    \        // 有一个位置可用\n            // 所以复制键并\n            // 找到正确位置\n          \
    \  while (i >= 0 && keys__[i] > k) {\n                keys__[i + 1] = keys__[i];\n\
    \                i--;\n            }\n            // 找到正确位置\n            keys__[i\
    \ + 1] = k;\n            n__++;\n        } else { // 非叶子\n            // 找到正确位置\n\
    \            while (i >= 0 && keys__[i] > k)\n                i--;\n         \
    \   // 满了并递归插入\n            if (children__[i + 1]->n__ == 2 * t__ - 1) {\n   \
    \             splitChild(i + 1, children__[i + 1]);\n                if (keys__[i\
    \ + 1] < k)\n                    i++; // 下一个孩子\n            }\n            children__[i\
    \ + 1]->insertNonFull(k);\n        }\n        std::cout << \"traversing n==\"\
    \ << n__;\n        traverse();\n        std::cout << std::endl;\n    }\n\n   \
    \ void splitChild(int i, BtreeLink l) {\n        BtreeLink m = new BtreeNode(l->t__,\
    \ l->leaf__);\n        m->n__ = t__ - 1;\n        // 从 t 到 2t-1 拷贝右侧键\n      \
    \  for (unsigned j = 0; j < t__ - 1; j++)\n            m->keys__[j] = l->keys__[j\
    \ + t__];\n        // 从 t 到 2t 拷贝孩子\n        if (!l->leaf__) {\n            for\
    \ (unsigned j = 0; j < t__; j++)\n                m->children__[j] = l->children__[j\
    \ + t__];\n        }\n        // 少一个键\n        l->n__ = t__ - 1;\n        // 留出空间\n\
    \        for (int j = n__; j >= i+1; j--)\n            children__[j + 1] = children__[j];\n\
    \        // 连接新节点\n        children__[i + 1] = m;\n        // 留出空间\n        for\
    \ (int j = n__ - 1; j >= i; j--)\n            keys__[j + 1] = keys__[j];\n   \
    \     // 拷贝中间的键\n        keys__[i] = l->keys__[t__ - 1];\n        n__++;\n   \
    \ }\n    friend class Btree;\n};\n\nclass Btree {\n    BtreeNode * root;\n   \
    \ unsigned t__;\npublic:\n    Btree(unsigned t) : root(NULL), t__(t) {};\n\n \
    \   void traverse() {\n        if(root) root->traverse();\n    }\n\n    BtreeLink\
    \ search(tKey k) {\n        return(root ? root->search(k) : NULL);\n    }\n\n\
    \    void insert(tKey k) {\n        if (!root) {\n            root = new BtreeNode(t__,\
    \ true);\n            root->keys__[0] = k;\n            root->n__ = 1;\n     \
    \   } else {\n            if (root->n__ == 2 * t__ - 1) {\n                BtreeNode\
    \ *s = new BtreeNode(t__, false);\n                root = s;\n               \
    \ s->children_[0] = root;\n                splitChild(0, root);\n            }\n\
    \            root->insertNonFull(k);\n        }\n    }\n};\n#endif\n```\n[/content]\n\
