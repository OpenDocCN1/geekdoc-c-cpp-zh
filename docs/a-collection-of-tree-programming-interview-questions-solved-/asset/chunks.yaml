  trans: "\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\n## 10. 寻找二叉树中两个叶子节点之间的最大路径和\n\
    \n### 解决方案\n两个叶子节点之间的最大路径和可能通过根节点，也可能仅位于某个子树中。因此，我们有以下递归情况：\n\n- 基础情况是根为 `NULL`，我们返回\
    \ `0`。\n- 然后我们分别递归计算左子树和右子树的最大路径和。\n- 接着计算左子树、右子树以及以当前节点为根的子树的最大值。如果这个值改进了目前观察到的总最大值，则更新总最大值。\n\
    - 从递归返回时，我们计算左右子树之间的最大值，并加上当前节点的权重。\n\n### 代码\n```cpp\ntemplate<typename  tVal>\n\
    tVal max(tVal  a, tVal  b)\n  {\n  return (a >= b) ? a : b;\n  }\n\ntemplate<typename\
    \  tVal>\nint maxPathSum(binaryTree<tVal> * root, tVal &res)\n  {\n  if (!root)\n\
    \    return 0;\n  int lLPSum = maxPathSum(root->left, res);\n  int rLPSum = maxPathSum(root->right,\
    \ res);\n  int curr_sum = max((lLPSum + rLPSum + root->v__),\n         max(lLPSum,\
    \ rLPSum));\n  if (res < curr_sum)\n    res = curr_sum;\n  return max(lLPSum,\
    \ rLPSum) + root->v__;\n  }\n```\n\n### 复杂度\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为\
    \ ![](img/00001.jpeg)。\n\n## 11. 给定前序和中序遍历重建二叉树\n\n### 解决方案\n在前序遍历中，根节点总是每个子树的最左侧元素。因此我们开始将前序遍历数组中最左侧的元素作为整棵树的根。现在：如果我们在中序数组中搜索该元素，可以立即推断出该值之前的所有元素（属于左子树）以及该值之后的所有元素（属于右子树）。因此，该解决方案可以通过递归计算。\n\
    \n### 代码\n```cpp\ntemplate<typename  tVal>\nunsigned search(std::vector<tVal>\
    \ inorder,\n  unsigned  start, unsigned  end, tVal  v)\n  {\n  for (unsigned i\
    \ = start; i <= end; i++)\n    if (inorder[i] == v)\n      return i;\n  }\n\n\
    template<typename  tVal>\nbinaryTree<tVal> * buildBTfromInorderAndPreorder(\n\
    \  const std::vector<tVal> & inOrder,\n  const std::vector<tVal> & preOrder,\n\
    \  unsigned & preIndex,\n  unsigned  inStart, unsigned  inEnd)\n  {\n  binaryTree<tVal>\
    \ * n;\n  n->v__ = preOrder[preIndex++];\n  if (inStart == inEnd)\n    return\
    \ n;\n  int inIndex =\n      search(inOrder, inStart, inEnd, n->v__);\n\n  n->left\
    \ =\n      buildBTfromInorderAndPreorder(inOrder, preOrder,\n      inStart, inIndex\
    \ - 1);\n  n->right =\n      buildBTfromInorderAndPreorder(inOrder, preOrder,\n\
    \      inIndex+1, inEnd);\n  }\n```\n\n### 复杂度\n时间复杂度为 ![](img/00006.jpeg)。感兴趣的读者可能会思考，这个复杂度是否为最优复杂度。\n\
    \n## 12. 打印之形遍历（Zig-Zag traversal）\n\n### 解决方案\n之形遍历通过使用两个栈实现，并且在每一层之间进行交换。在访问\
    \ `currentLevel` 期间，所有子节点都被插入 `nextLevel` 栈中。需要考虑的是：维护一个布尔值来确定访问方向（从左到右或从右到左），并且该方向在每个循环中反转。当\
    \ `currentLevel` 栈为空时，将其与 `nextLevel` 交换。通过使用两个栈，之形遍历是层序遍历的一种变体。\n\n### 代码\n```cpp\n\
    template<typename  tVal>\nvoid printZigZag(binaryTree<tVal> * root)\n  {\n  binaryTree<tVal>\
    \ * tmp;\n  bool left2right = true;\n  if (!root)\n    return;\n\n      std::stack<binaryTree<tVal>\
    \ *> currLevel;\n      std::stack<binaryTree<tVal> *> nextLevel;\n      currLevel.push(root);\n\
    \  while (!currLevel.empty())\n      {\n        tmp = currLevel.top();\n     \
    \   currLevel.pop();\n        if (tmp)\n        {\n        std::cout << \" v=\"\
    \ << tmp->v__;\n        if (left2right)\n          {\n            nextLevel.push(tmp->left);\n\
    \            nextLevel.push(tmp->right);\n          }\n        else\n        \
    \  {\n            nextLevel.push(tmp->right);\n            nextLevel.push(tmp->left);\n\
    \          }\n        }\n      if (currLevel.empty())\n        {\n        left2right\
    \ = !left2right;\n        currLevel.swap(nextLevel);\n      }\n```\n\n### 复杂度\n\
    时间复杂度为 ![](img/00007.jpeg)，空间复杂度为 ![](img/00007.jpeg)。\n\n## 13. 打印两个节点的公共祖先（LCA）\n\
    \n### 解决方案\n两个节点的公共祖先可以通过根节点，也可能仅位于某个子树中。因此我们有以下递归情况：\n\n- 基础情况是根为 `NULL`，我们返回\
    \ `NULL`。\n- 然后我们递归计算左子树和右子树的公共祖先。\n- 接着计算左子树、右子树以及以当前节点为根的子树的公共祖先。如果这个值改进了目前观察到的总公共祖先，则更新总公共祖先。\n\
    - 从递归返回时，我们计算左右子树之间的公共祖先，并加上当前节点。\n\n### 代码\n```cpp\ntemplate<typename  tVal>\n\
    binaryTree<tVal> * LCA(binaryTree<tVal> * root,\n  binaryTree<tVal> * n1, binaryTree<tVal>\
    \ * n2)\n  {\n  if (!root)\n    return NULL;\n  if (root == n1 || root == n2)\n\
    \    return root;\n  binaryTree<tVal> * left =\n      LCA(root->left, n1, n2);\n\
    \  binaryTree<tVal> * right =\n      LCA(root->right, n1, n2);\n  if (left &&\
    \ right)\n    return root;\n  return (left ? left : right);\n  }\n```\n\n### 复杂度\n\
    时间复杂度为 ![](img/00008.jpeg)，空间复杂度为 ![](img/00008.jpeg)。\n\n## 14. 在二叉搜索树中实现“查找”和“插入”\n\
    \n### 解决方案\n二叉搜索树（BST）是一种每个节点最多有两个子节点的树。其左子树包含所有严格小于节点值的键，右子树包含所有大于节点值的键。\n\n\
    `Find()` 通过检查[根节点](http://en.wikipedia.org/Tree_(data_structure)#root_nodes) 开始。如果树为空，键不在树中。如果键等于根节点，`find()`\
    \ 返回根节点。如果键小于根节点，搜索左子树。如果键大于根节点，搜索右子树。该方法可以递归或迭代地执行。\n\n`Insert()` 遵循类似的方法。在树内部搜索待插入的键。如果已找到，则返回。否则，如果搜索到达空节点，则将键插入该位置。该过程可以是递归的或迭代的。下面我们提供一个递归版本，并将迭代版本的任务留给感兴趣的读者自行实现。\n\
    \n### 代码\n```cpp\ntemplate<typename  tVal>\ntemplate<typename  tVal>\nstruct binaryTree\n\
    \  {\n  tVal v__;\n  struct binaryTree<tVal> * left;\n  struct binaryTree<tVal>\
    \ * right;\n  binaryTree(tVal  v) : v__(v),\n    left(NULL), right(NULL) {}\n\
    \  };\n\ntemplate<typename  tVal>\nbinaryTree<tVal> * find(binaryTree<tVal> *\
    \ const root,\n  const tVal k)\n  {\n  if (!root)\n    return NULL;\n  return\
    \ ((root->v__ < k) ? find(root->right, k) :\n      (root->v__ > k ? find(root->left,\
    \ k) : root));\n  }\n\ntemplate<typename  tVal>\nvoid insert(binaryTree<tVal>\
    \ * & root, const tVal k)\n  {\n  if (!root)\n    {\n    root = new binaryTree<tVal>(k);\n\
    \    return;\n    }\n  if (root->v__ < k)\n    insert(root->right, k);\n  else\
    \ if (root->v__ > k)\n    insert(root->left, k);\n  }\n```\n\n### 复杂度\n“插入”和“查找”的平均时间复杂度为\
    \ ![](img/00012.jpeg)，其中 ![](img/00013.jpeg) 表示树中的节点数。然而，如果树不平衡，复杂度为 ![](img/00014.jpeg))\n\
    \n## 15. 按序打印二叉搜索树\n\n### 解决方案\n\n"
