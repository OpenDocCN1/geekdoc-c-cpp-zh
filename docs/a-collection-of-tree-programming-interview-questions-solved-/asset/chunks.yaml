    \    return;\n    }\n  if (root->v__ < k)\n    insert(root->right, k);\n  else\
    \ if (root->v__ > k)\n    insert(root->left, k);\n  }\n```\n\n### Complexity\n\
    Average time complexity of “insert” and “find” is ![](images/00012.jpeg)) , where\
    \ ![](images/00013.jpeg) expresses the number of nodes in the tree. However if\
    \ the tree is not balanced, complexity is ![](images/00014.jpeg)).\n\n## 15. Print\
    \ a BST in order\n\n### Solution\n"
