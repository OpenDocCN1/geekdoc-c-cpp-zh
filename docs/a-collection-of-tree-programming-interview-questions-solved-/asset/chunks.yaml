  trans: "\n给定两个键 `![]images/00024.jpeg)` 使得 `![]images/00025.jpeg)`，对 `BST` 树进行导航，如果当前节点的键大于或等于\
    \ `![]images/00023.jpeg)`，则递归地向左子节点导航。然后检查范围条件，如果满足，则打印当前节点。最后递归地向右子节点导航。\n\n\
    ### 代码\n\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal> * rangePrint(binaryTree<tVal>\
    \ * const root, const tVal k, const tVal h) \n{\n    if (!root)\n        return\
    \ NULL;\n    if (root->v__ >= k)\n        rangePrint(root->left, k, h);\n    if\
    \ (root->v__ >= k && root->v__ <= h)\n        std::cout << \" v=\" << root->v__;\n\
    \    if (root->v__ <= h)\n        rangePrint(root->right, k, h);\n}\n```\n\n###\
    \ 复杂度\n\n最坏时间复杂度为 `![]images/00014.jpeg))`，其中 `![]images/00013.jpeg)` 是树中的节点数。\n\
    \n## 24 合并两个平衡二叉搜索树\n\n### 解决方案\n\n合并两个 `BST` 的最有效的方法是将它们每一个都存储在数组中。然后合并这两个排序数组，并将生成的数组转换回一个新的\
    \ `BST`。\n\n### 代码\n\n```cpp\ntemplate<typename tVal>\nvoid storeInorder(binaryTree<tVal>\
    \ * const root, std::vector<tVal> & inorder) \n{\n    if (!root)\n        return;\n\
    \    storeInorder(root->left, inorder);\n    inorder.push_back(root->v__);\n \
    \   storeInorder(root->right, inorder);\n}\n\ntemplate<typename tVal>\nvoid dumpVector(const\
    \ std::vector<tVal> &v1)\n{\n    std::cout << std::endl;\n    std::vector<tVal>::const_iterator\
    \ it = v1.begin();\n    for (; it != v1.end(); it++)\n        std::cout << *it\
    \ << \" \";\n    std::cout << std::endl;\n}\n\ntemplate<typename tVal>\nvoid merge(const\
    \ std::vector<tVal> & v1, const std::vector<tVal> & v2, std::vector<tVal> & merged)\n\
    {\n    unsigned m = v1.size(), n = v2.size();\n    if (merged.size() != n + m)\n\
    \        return;\n    unsigned i = 0, j = 0, k = 0;\n    while (i < m && j < n)\n\
    \    {\n        if (v1[i] < v2[j])\n            merged[k] = v1[i++];\n       \
    \ else\n            merged[k] = v2[j++];\n        k++;\n    }\n    while (i <\
    \ m)\n        merged[k++] = v1[i++];\n    while (j < n)\n        merged[k++] =\
    \ v2[j++];\n}\n\ntemplate<typename tVal>\nbinaryTree<tVal> * sortedArrayToBST(const\
    \ std::vector<tVal> &v, int start, int end)\n{\n    if (start > end)\n       \
    \ return NULL;\n    int mid = (start + end) / 2;\n    binaryTree<tVal> *root =\
    \ new binaryTree<tVal>(v[mid]);\n    root->left = sortedArrayToBST(v, start, mid\
    \ - 1);\n    root->right = sortedArrayToBST(v, mid + 1, end);\n    return root;\n\
    }\n\ntemplate<typename tVal>\nbinaryTree<tVal> * mergeTrees(binaryTree<tVal> *\
    \ const root1, binaryTree<tVal> * const root2)\n{\n    std::vector<int> v1;\n\
    \    storeInorder(root1, v1);\n    std::vector<int> v2;\n    storeInorder(root2,\
    \ v2);\n    std::vector<int> merged(v1.size() + v2.size());\n    merge(v1, v2,\
    \ merged);\n    dumpVector(merged);\n    return sortedArrayToBST(merged, 0, merged.size()\
    \ - 1);\n}\n\ntemplate<typename tVal>\nvoid dump(binaryTree<tVal> * const root)\n\
    {\n    if (!root)\n        return;\n    else\n        std::cerr << \" v==\" <<\
    \ root->v__ << \" \";\n    if (root->left)\n        std::cerr << \" ->left \"\
    ;\n        dump(root->left);\n    if (root->right)\n        std::cerr << \" ->right\
    \ \";\n        dump(root->right);\n}\n```\n\n### 复杂度\n\n该方法的复杂度为 `![]images/00026.jpeg)`，其中\
    \ `![]images/00013.jpeg)` 和 `![]images/00027.jpeg)` 是两个 `BST` 中的节点数。\n\n## 25\
    \ 在平衡 BST 中寻找和为 0 的元组\n\n### 解决方案\n\n最优解决方案是将 `BST` 转换为双向链表。然后可以遍历列表，并对于每个负元素尝试在列表中寻找一个等于当前节点键的对。\n\
    \n### 代码\n\n```cpp\ntemplate<typename tVal>\nvoid stToDoubleList(binaryTree<tVal>\
    \ *root, binaryTree<tVal> ** head, binaryTree<tVal> ** tail) \n{\n    if (!root)\n\
    \        return;\n    if (root->left)\n        stToDoubleList(root->left, head,\
    \ tail);\n    if (!*head)\n        *head = root;\n    else\n        (*tail)->right\
    \ = root;\n    *tail = root;\n    if (root->right)\n        stToDoubleList(root->right,\
    \ head, tail);\n}\n\ntemplate<typename tVal>\nbool isPresent(binaryTree<tVal>\
    \ * head, binaryTree<tVal> * tail, int sum) \n{\n    while (head != tail)\n  \
    \  {\n        int curr = head->v__;\n        if (curr == sum)\n            return\
    \ true;\n        else if (curr > sum)\n            tail = head;\n        else\n\
    \            head = head->right;\n    }\n    return false;\n}\n\ntemplate<typename\
    \ tVal>\nbool isTriplet(binaryTree<tVal> *root)\n{\n    if (!root)\n        return\
    \ false;\n    binaryTree<tVal>* head = NULL;\n    binaryTree<tVal>* tail = NULL;\n\
    \    stToDoubleList(root, &head, &tail);\n    while (head != NULL && (head->v__\
    \ < 0))\n    {\n        if (isPresent(head->right, tail, -head->v__))\n      \
    \      return true;\n        else\n            head = head->right;\n    }\n  \
    \  return false;\n}\n```\n\n### 复杂度\n\n## 26 实现 B 树\n\n### 解决方案\n\n`B 树` 允许在对数时间内进行插入，通常用于读写大量数据的系统，如数据库。在\
    \ `B 树` 中，内部节点具有在范围 `![]images/0028.jpeg)` 内的子节点数量。键作为分离值，将树划分为子树，如下所示：![`bluerwhite.org/btree/tree1.png`](img/0029)\n\
    \n 分支因子 `2` 保证了节点可以分裂或合并。如果内部节点有 `![]images/00031.jpeg)` 个键，可以通过将该 `![]images/0032.jpeg)`\
    \ 键节点分裂为两个 `![]images/0033.jpeg)` 键节点并将键添加到父节点来完成。每个分裂节点都维持所需的键数。同样，如果每个内部节点及其邻居都有\
    \ `![]images/0033.jpeg)` 个键，则可以通过与邻居合并来从内部节点删除键。删除键将为内部节点留下 `![]images/0034.jpeg)`\
    \ 个键，但合并邻居将增加 `![]images/0035.jpeg)` 个键，加上来自邻居父的一个键。总数仍为 `![]images/0031.jpeg)`\
    \ 个键。节点的分支数比存储在节点中的键数多一。B 树通过要求所有叶节点处于同一深度来保持平衡。\n\n更正式地说，阶为 `[]images/0036.jpeg)`\
    \ 的 B 树定义为满足以下属性的树：\n\n1. 每个节点最多有 `![]images/0037.jpeg)` 个子。\n2. 非叶节点（根节点外）至少有\
    \ `![]images/0038.jpeg)` 个子。\n3. 如果根节点不是叶节点，则至少有两个子。\n4. 具有 `![]images/0023.jpeg)`\
    \ 个子的非叶节点包含 `![]images/0039.jpeg)` 个键。\n5. 所有叶子节点出现在同一层\n6. 每个内部节点的键都作为分离值，将其子树划分。\n\
    \n### 搜索\n\n此操作与搜索二叉搜索树的操作相似。从根节点开始，递归地从上向下遍历树，并在每一层选择在搜索值两侧都有分离键的子树。节点内的搜索可以是线性搜索或二分搜索。\n\
    \n"
- fmt: "\n# Insertion\n\nTo insert a new key, search the tree to find the leaf node,\
    \ where the new key should be added:\n\n* If the node contains fewer than `images/00042.jpeg`,\
    \ then there is room for the new element, which can be inserted by following the\
    \ order.\n* Otherwise if the node is full and it must be split into two nodes:\n\
    \    * The median element is selected among the leaf's elements and the new element.\n\
    \    * Values less than the median one are put in the new left node and values\
    \ greater than the median one are put in the new right node.\n    * The median\
    \ acts as a separation value.\n\nThe separation key is inserted in the node's\
    \ parent, which should be split, if full. If the node is the root, we need to\
    \ create a new root above the old one.\n\nIf the splitting goes all the way up\
    \ to the root, it creates a new root with a single separator key and two children.\
    \ When a node is split, one key goes to the parent, but one additional key is\
    \ added.\n\n# Deletion\n\nThe idea is to find and delete the item, then restructure\
    \ the tree to regain its invariants. This operation is left as an exercise.\n\n\
    # Code\n\n```cpp\n#ifndef BTREE_HEAD_\n#define BTREE_HEAD_ 1\n#include <iostream>\n\
    \nnamespace Tree{\ntypedef int tKey;\nclass BtreeNode;\ntypedef BtreeNode * BtreeLink;\n\
    class BtreeNode {\nprivate:\n    unsigned t__; // 2t-1 keys, 2t children\n   \
    \ bool leaf__; // is a leaf\n    unsigned n__; // current number\n    tKey * keys__;\
    \ // array of key\n    BtreeLink * children__; // ptr to array of children\n\n\
    public:\n    // constructor\n    BtreeNode(unsigned t, bool leaf) :\n        t__(t),\
    \ leaf__(leaf), n__(0),\n        keys__(new tKey[2 * t__ - 1]),\n        children__(new\
    \ BtreeLink[2 * t__])\n    {};\n\n    // traverse\n    void traverse(unsigned\
    \ lev=0) {\n        std::cout << \"lev=\" << lev << \" \";\n        // n keys,\
    \ n+1 childrens\n        unsigned i = 0;\n        for (; i < n__; i++) {\n   \
    \         std::cout << \" \" << keys__[i];\n            if (!leaf__)\n       \
    \         children__[i]->traverse(lev+1);\n        }\n        // last children\n\
    \        if (!leaf__)\n            children__[i]->traverse(lev + 1);\n    }\n\n\
    \    // delete all\n    void deleteAll() {\n        //n+1 children\n        for\
    \ (unsigned i = 0; i <= n__; i++) {\n            if (!leaf__)\n              \
    \  children__[i]->deleteAll();\n        }\n        delete[] children__;\n    \
    \    delete[] keys__;\n    };\n\n    // dstrc\n    ~BtreeNode() {\n        deleteAll();\n\
    \    }\n\n    // search in btree\n    BtreeLink search(tKey k) {\n        unsigned\
    \ i = 0;\n        // search right location\n        for (; i < n__ && k > keys__[i];\
    \ i++);\n        // found the key\n        if (keys__[i] == k)\n            return\
    \ this;\n        // not found\n        if (leaf__)\n            return NULL;\n\
    \        // recursively\n        return children__[i]->search(k);\n    }\n\n \
    \   // insert in a node that is not full\n    void insertNonFull(tKey k) {\n \
    \       // rightmost key\n        int i = n__ - 1;\n        if (leaf__) {\n  \
    \          // one position is available\n            // so copy the keys and\n\
    \            // find the right spot\n            while (i >= 0 && keys__[i] >\
    \ k) {\n                keys__[i + 1] = keys__[i];\n                i--;\n   \
    \         }\n            // found the right position\n            keys__[i + 1]\
    \ = k;\n            n__++;\n        } else { // non leaf\n            // find\
    \ the right spot\n            while (i >= 0 && keys__[i] > k)\n              \
    \  i--;\n            // full and recursively insert\n            if (children__[i\
    \ + 1]->n__ == 2 * t__ - 1) {\n                splitChild(i + 1, children__[i\
    \ + 1]);\n                if (keys__[i + 1] < k)\n                    i++; //\
    \ next children\n            }\n            children__[i + 1]->insertNonFull(k);\n\
    \        }\n        std::cout << \"traversing n==\" << n__;\n        traverse();\n\
    \        std::cout << std::endl;\n    }\n\n    void splitChild(int i, BtreeLink\
    \ l) {\n        BtreeLink m = new BtreeNode(l->t__, l->leaf__);\n        m->n__\
    \ = t__ - 1;\n        // copy the right keys from t to 2t-1\n        for (unsigned\
    \ j = 0; j < t__ - 1; j++)\n            m->keys__[j] = l->keys__[j + t__];\n \
    \       // copy the children from t to 2t\n        if (!l->leaf__) {\n       \
    \     for (unsigned j = 0; j < t__; j++)\n                m->children__[j] = l->children__[j\
    \ + t__];\n        }\n        // one key less\n        l->n__ = t__ - 1;\n   \
    \     // make room\n        for (int j = n__; j >= i+1; j--)\n            children__[j\
    \ + 1] = children__[j];\n        // connect the new node\n        children__[i\
    \ + 1] = m;\n        // make room\n        for (int j = n__ - 1; j >= i; j--)\n\
    \            keys__[j + 1] = keys__[j];\n        //copy the middle key\n     \
    \   keys__[i] = l->keys__[t__ - 1];\n        n__++;\n    }\n    friend class Btree;\n\
    };\n\nclass Btree {\n    BtreeNode * root;\n    unsigned t__;\npublic:\n    Btree(unsigned\
    \ t) : root(NULL), t__(t) {};\n\n    void traverse() {\n        if(root) root->traverse();\n\
    \    }\n\n    BtreeLink search(tKey k) {\n        return(root ? root->search(k)\
    \ : NULL);\n    }\n\n    void insert(tKey k) {\n        if (!root) {\n       \
    \     root = new BtreeNode(t__, true);\n            root->keys__[0] = k;\n   \
    \         root->n__ = 1;\n        } else {\n            // full root\n       \
    \     if (root->n__ == 2 * t__ - 1) {\n                BtreeLink btn = new BtreeNode(t__,\
    \ false);\n                btn->children__[0] = root;\n                // split\
    \ the root\n                // move 1 key to children\n                splitChild(0,\
    \ root);\n                if (btn->keys__[0] < k)\n                    btn->children__[1]->insertNonFull(k);\n\
    \                else\n                    btn->children__[0]->insertNonFull(k);\n\
    \                // change root\n                root = btn;\n            } else\
    \ {\n                root->insertNonFull(k);\n            }\n        }\n    }\n\
    };\n#endif\n```\n\n# Complexity\n\nThe table below provides space complexity for\
    \ the average and worst case, by reporting also space and time complexity for\
    \ search, insert and delete.\n\n| | Average case | Worst case |\n| --- | :---\
    \ | :--- |\n| Space | `images/00043.jpeg` | `images/00043.jpeg` |\n| Search |\
    \ `images/00044.jpeg` | `images/00044.jpeg` |\n| Insert | `images/00044.jpeg`\
    \ | `images/00044.jpeg` |\n| Delete | `images/00044.jpeg` | `images/00044.jpeg`\
    \ |\n\n# 27 Implementing a Skiplist\n\n### Solution\n\nSkiplists allow to find\
    \ elements in a list with an average logarithmic time. The idea is to maintain\
    \ additional pointers, which allow to skip elements as in the image.\n\n![http://igoro.com/wp-content/uploads/2008/07/skiplist.png](images/00045.jpeg)\n\
    \nA skip list has many layers. The bottom one is an ordinary list. Each higher\
    \ layer acts as \"fast lane\" for the lists below. In particular: an element in\
    \ `images/00046.jpeg` layer appears in `images/00047.jpeg` layer with some probability\
    \ `p(typically images/00048.jpeg)=0.5)`. Each element appears averagely in `images/00049.jpeg`\
    \ lists, and the most frequent ones in `images/00050.jpeg` lists.\n\n### Code\n\
    \n```cpp\n#ifndef SKIP_HEAD_\n#define SKIP_HEAD_\n#include <iostream>\n#define\
    \ DEBUG2 1\nnamespace Tree{\ntypedef int num;\ntemplate <typename Tkey, typename\
    \ Tval>\nclass Skiplist{\nprivate:\n    struct node {\n        Tkey key_; // the\
    \ key\n        Tval val_; // the val\n        num size_; // size of array\n  \
    \      node **next_; // array of pointers\n        node(const Tkey key, const\
    \ Tval val, num size) :\n            key_(key), val_(val), size_(size), next_(new\
    \ node*[size_]) {\n            for (num i = 0; i < size_; ++i) next_[i] = 0;\n\
    \        }\n    };\n    typedef node* const link;\n    Tkey default_key_; // default\
    \ item in skiplist\n    Tval default_val_; // default val in skiplist\n    link\
    \ head_; // head of skiplist\n    num lgN_; // current number of link in skiplist\n\
    \    num lgNmax_; // max number of link in skiplist\n    // random skiplist expansion\n\
    \    num rand_sl_gen__() {\n        num i, j, t = rand(); // t is in [0, RAND_MAX]\n\
    \        // generate j=2, 4, ... i < lgNmax_\n        // t > RAND_MAX / 2^i\n\
    \        for (i = 1, j = 2; i < lgNmax_; i++, j += j)\n            if (t > RAND_MAX\
    \ / j) break;\n        // t is a number < 1/2^i\n        if (i > lgN_) // expand\
    \ current level\n            lgN_ = i; // this grows logaritmcally\n        return\
    \ i;\n    }\n    // remove a key and a val\n    void remove__(link t, Tkey key,\
    \ num k) {\n#ifdef DEBUG2\nstd::cerr << \"remove__ \" << t << \" key=\"\n```\n"
