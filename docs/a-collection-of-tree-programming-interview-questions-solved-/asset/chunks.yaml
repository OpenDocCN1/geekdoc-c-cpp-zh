    \ prev))\n        return false;\n    if (root->v__ < prev)\n        return false;\n\
    \    prev = root->v__;\n    return isBST(root->right, prev);\n}\n```\n\n### Complexity\n\
    The worst case time complexity is![](images/00014.jpeg)).\n\n## 20 Converting\
    \ a Double linked list into a BST\n\n### Solution\nConverting a double linked\
