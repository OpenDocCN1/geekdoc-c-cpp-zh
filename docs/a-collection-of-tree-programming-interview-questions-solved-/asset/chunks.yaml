    \ is ![](images/00001.jpeg).\n\n## 14. Implementing “find” and “insert” in a Binary\
    \ Search Tree\n\n### Solution\nA Binary Search Tree (BST) is a tree where each\
    \ node has no more than two children. The left subtree of a node contains only\
    \ nodes with keys being strictly less than the node's key. The right subtree of\
    \ a node contains only nodes with keys being greater than the node's key.\n\n\
    `Find()` begins by examining the [root node](http://en.wikipedia.org/wiki/Tree_(data_structure)#root_nodes).\
    \ If the tree is null, the key does not exist in the tree. If the key equals the\
    \ one of the root, `find()` returns the root. If the key is less than the one\
    \ of the root, the left subtree is searched. If the key is greater than the one\
    \ of the root, the right subtree is searched. This method is repeated recursively\
    \ or iteratively. Here below we propose a recursive version and we leave to the\
    \ interested reader the task of implementing an iterative version on his own.\n\
    \n`Insert()` follows a similar approach. The candidate key for insertion is searched\
    \ inside the tree. If it is found, the process returns. Otherwise if the search\
    \ reaches a null node, the key is inserted in that position. The process can be\
    \ either recursive or iterative.\n\n### Code\n```cpp\ntemplate<typename  tVal>\n\
    template<typename  tVal>\nstruct binaryTree\n  {\n  tVal v__;\n  struct binaryTree<tVal>\
    \ * left;\n  struct binaryTree<tVal> * right;\n  binaryTree(tVal  v) : v__(v),\n\
    \    left(NULL), right(NULL) {}\n  };\n\ntemplate<typename  tVal>\nbinaryTree<tVal>\
