    \nMinimum is computed with ![](images/00056.jpeg) time complexity. However, there\
    \ is a![](images/00001.jpeg) preprocessing time and ![](images/00064.jpeg)extra\
    \ space required.\n\n## 31 Implementing a suffix tree\n\n### Solution\n\nA Suffix\
    \ Tree (also known as Pat Tree) is a tree containing all the suffixes of a given\
    \ string ![](images/00065.jpeg). The construction of a suffix tree takes linear\
    \ time and also linear space (although with very large constants). Once the suffix\
    \ three is built, it is possible to solve a myriad of problems on textual strings[[1]](#part0000_split_037.html__ftn1) \
    \ such as:\n\n*   Check a string ![](images/00066.jpeg) , if length m is a substring\
    \ of![](images/00067.jpeg) in ![](images/00068.jpeg)time\n\n*   Find  the longest\
    \ common substrings of strings ![](images/00069.jpeg) and ![](images/00070.jpeg)\
    \ in ![](images/00071.jpeg) time\n\nThe list is very long and cannot be reported\
    \ here. The interested reader can find these articles relevant\n\n*   [http://www.di.unipi.it/~grossi/IND/survey.pdf](http://www.di.unipi.it/~grossi/IND/survey.pdf)\n\
    \n*   [http://www.inf.fu-berlin.de/lehre/WS02/ALP3/material/sufficTree.pdf](http://www.inf.fu-berlin.de/lehre/WS02/ALP3/material/sufficTree.pdf)\n\
    \nThe suffix tree for the string ![](images/00065.jpeg) of length ![](images/00013.jpeg) is\
    \ defined as a tree such that:\n\n*   The tree has exactly ![](images/00013.jpeg)\
    \ leaves\n\n*   Every internal node has at least two children, with the only exception\
    \ of the root\n\n*   Each edge is labeled with a non-empty substring of ![](images/00065.jpeg)\n\
    \n*   It is not allowed to have two edges starting out of a node with labels beginning\
    \ with the same character\n\n*   The string obtained by concatenating all the\
    \ labels on the path from the root to leaf ![](images/00046.jpeg) represents suffix\
    \ ![](images/00072.jpeg), ![](images/00073.jpeg)\n\n![](images/00065.jpeg) is\
    \ padded with a terminal symbol not seen in the string (usually denoted ![](images/00074.jpeg)).\
    \ This ensures that no suffix is a prefix of another.\n\n![](images/00075.jpeg)\n\
    \n### Code\n\nThe interested reader can access these libraries:\n\n*   [http://codingplayground.blogspot.de/2010/05/suffix-tree-with-unicode-support.html](http://codingplayground.blogspot.de/2010/05/suffix-tree-with-unicode-support.html)\n\
    \n*   [https://code.google.com/p/patl/](https://code.google.com/p/patl/)\n\n###\
