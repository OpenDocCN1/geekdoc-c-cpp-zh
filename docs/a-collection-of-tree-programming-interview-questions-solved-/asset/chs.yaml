- "# C++ 树形编程面试题集（第 5 卷）\n\n\n\n![](img/00076.jpeg)\n\n\n\n\n\n《树》是包含 25 章关于算法、问题解决和\
  \ C++ 编程的系列书籍中的第五本。\n\n## 献辞\n致我的妻子 Francesca\n爱总会在宽恕与因果之间找到出路\n\n## 致谢\n\n\n##\
  \ 1 实现二叉树的前序遍历\n\n### 解决方案\n\n\n\n\n\n二叉树是每个节点最多有两个子节点的树。非递归的前序遍历可以使用栈来实现。\n\n在循环中：\n\
  * 首先访问当前节点。\n* 然后将左子节点推入栈，直到到达叶子节点。\n* 接着，如果栈为空，则退出循环。否则，从栈顶弹出元素并继续向右子节点遍历。\n\n\
  ### Code\n```cpp\ntemplate<typename tVal>\nstruct binaryTree {\n    tVal v__;\n\
  \    struct binaryTree<tVal> * left;\n    struct binaryTree<tVal> * right;\n   \
  \ binaryTree(tVal v) : v__(v), left(NULL), right(NULL) {}\n};\n\ntemplate<typename\
  \ tVal>\nvoid nonRecursivePreOrder(binaryTree<tVal> * root) {\n    std::stack<binaryTree<tVal>\
  \ *> s;\n    while (true) {\n        //left\n        while (root) {\n          \
  \  std::cout << \" v=\" << root->v__;\n            s.push(root);\n            root\
  \ = root->left;\n        }\n        if (s.empty())\n            break;\n       \
  \ // this one\n        root = s.top();\n        s.pop();\n        //right\n    \
  \    root = root->right;\n    }\n}\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg)\
  \ 空间复杂度为 ![](img/00001.jpeg)\n\n## 2 计算二叉树的直径\n\n### Solution\n可以使用递归方便地计算该解决方案\n\
  \n### Code\n```cpp\ntemplate<typename tVal>\nunsigned diameter(binaryTree<tVal>\
  \ * root, unsigned & dim) {\n    unsigned left, right;\n    if (!root)\n       \
  \ return 0;\n    left = diameter(root->left, dim);\n    right = diameter(root->right,\
  \ dim);\n    if (left + right > dim)\n        dim = left + right;\n    return ((left\
  \ > right) ? left : right) + 1;\n}\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg)\
  \ 空间复杂度为 ![](img/00001.jpeg)。\n\n## 3 实现二叉树的中序遍历\n\n### Solution\n非递归的中序遍历可以使用栈来实现。\n\
  \n在循环中：\n* 首先将左子节点推入栈，直到到达叶子节点。\n* 接着，如果栈为空，则退出循环。否则，从栈顶弹出并访问当前节点。\n* 最后，继续向右子节点遍历\n\
  \n### Code\n```cpp\ntemplate<typename tVal>\nvoid nonRecursiveInOrder(binaryTree<tVal>\
  \ * root) {\n    std::stack<binaryTree<tVal> *> s;\n    while (true) {\n       \
  \ //left\n        while (root) {\n            s.push(root);\n            root =\
  \ root->left;\n        }\n        if (s.empty())\n            break;\n        //\
  \ this one\n        root = s.top();\n        s.pop();\n        std::cout << \" v=\"\
  \ << root->v__;\n        //right\n        root = root->right;\n    }\n}\n```\n\n\
  ### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\n## 4 实现二叉树的后序遍历\n\
  \n### Solution\n在后序遍历期间，每个节点都会被访问两次：第一次是在向左子节点移动时，第二次是在向右子节点移动时。为了区分这两种情况，我们可以比较当前元素与栈顶元素的右子节点是否相同。\n\
  \n### Code\n```cpp\ntemplate<typename tVal>\nvoid nonRecursivePostOrder(binaryTree<tVal>\
  \ * root) {\n    std::stack<binaryTree<tVal> *> s;\n    while (true) {\n       \
  \ if (root) {\n            s.push(root);\n            root = root->left;\n     \
  \   } else {\n            if (s.empty())\n                break;\n            if\
  \ (!s.top()->right) {\n                root = s.top();\n                s.pop();\n\
  \                std::cout << \" v=\" << root->v__;\n                if (root ==\
  \ s.top()->right) {\n                    std::cout << \" v=\" << s.top()->v__;\n\
  \                    s.pop();\n                }\n            }\n            if\
  \ (!s.empty())\n                root = s.top()->right;\n            else\n     \
  \           root = NULL;\n        }\n    }\n}\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg)\
  \ 空间复杂度为 ![](img/00001.jpeg)\n\n## 5 实现二叉树的层序遍历\n\n### Solution\n层序遍历可以在进入下一层之前对该层的所有节点进行遍历。该思路非常简单。\n\
  \n在循环中：\n* 首先访问根节点\n* 然后在遍历 ![](img/00002.jpeg) 处的节点时，将 ![](img/00003.jpeg) 层上的所有节点存储在队列中\n\
  * 持续循环直到完成所有层级\n\n### Code\n```cpp\ntemplate<typename tVal>\nvoid nonRecursiveLevelOrder(binaryTree<tVal>\
  \ * root) {\n    std::queue<binaryTree<tVal> *> q;\n    binaryTree<tVal> * tmp;\n\
  \    if (!root)\n        return;\n    q.push(root);\n    while (!q.empty()) {\n\
  \        tmp = q.front();\n        q.pop();\n        std::cout << \" v=\" << tmp->v__;\n\
  \        if (tmp->left)\n            q.push(tmp->left);\n        if (tmp->right)\n\
  \            q.push(tmp->right);\n    }\n}\n```\n\n### Complexity\n时间复杂度为 ![](img/00001.jpeg)\
  \ 空间复杂度为 ![](img/00001.jpeg)\n\n## 6 计算二叉树的叶子节点数量\n\n### Solution\n可以通过修改层序遍历来实现，每当我们到达叶子节点时增加一个计数器。\n\
  \n### Code\n```cpp\ntemplate<typename tVal>\nunsigned NumLeavesLevelOrder(binaryTree<tVal>\
  \ * root) {\n    std::queue<binaryTree<tVal> *> q;\n    binaryTree<tVal> * tmp;\n\
  \    unsigned count = 0;\n    if (!root)\n        return count;\n    q.push(root);\n\
  \    while (!q.empty()) {\n        tmp = q.front();\n        q.pop();\n        if\
  \ (!tmp->left && !tmp->right)\n            count++;\n        else {\n          \
  \  if (tmp->left)\n                q.push(tmp->left);\n            if (tmp->right)\n\
  \                q.push(tmp->right);\n        }\n    }\n    return count;\n}\n```\n\
  \n### Complexity\n时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\n## 7\
  \ 检查两棵二叉树是否结构相同\n\n### Solution\n可以使用递归来实现。基础情况为两个节点都为空，或者其中一个一个为空。否则，算法检查两个节点的值是否相同，以及左子树和右子树是否结构相同。\n\
  \n### Code\n```cpp\ntemplate<typename tVal>\nbool structIdentical(binaryTree<tVal>\
  \ * r1, binaryTree<tVal> * r2) {\n    if (!r1 && !r2)\n        return true;\n  \
  \  if (!r1 || !r2)\n        return false;\n    return (r1->v__ == r2->v__ && structIdentical(r1->left,\
  \ r2->left) && structIdentical(r1->right, r2->right));\n}\n```\n\n### Complexity\n\
  时间复杂度为 ![](img/00001.jpeg) 空间复杂度为 ![](img/00001.jpeg)\n\n## 8 打印树中的所有路径\n\n### Solution\n\
  可以使用递归来实现。该思路是在递归过程中传递一个 vector，并将每个节点 `push_back` 进去。每当我们到达叶子节点时，打印该 vector。\n\n\
  ### Code\n```cpp\ntemplate<typename tVal>\nvoid printAllPaths(binaryTree<tVal> *\
  \ root, std::vector<tVal> path) {\n    if (!root)\n        return;\n    path.push_back(root->v__);\n\
  \    if (!root->left && !root->right) {\n        std::vector<tVal>::iterator it\
  \ = path.begin();\n        for (; it != path.end(); it++)\n            std::cout\
  \ << \" v=\" << *it;\n        std::cout << std::endl;\n    } else {\n        printAllPaths(root->left,\
  \ path);\n        printAllPaths(root->right, path);\n    }\n}\n```\n\n## 9 验证路径之和是否等于某个整数\n\
  \n### Solution\n该思路是在递归遍历树时，从给的和中减去当前值。\n\n```cpp\ntemplate<typename tVal>\nbool\
  \ hasSum(binaryTree<tVal> * root, int sum) {\n    if (!root)\n        return (sum\
  \ == 0);\n    else {\n        int remainingSum = sum - root->v__;\n        if ((root->left\
  \ && root->right) || (!root->left && !root->right))\n            return (hasSum(root->left,\
  \ remainingSum) || hasSum(root->right, remainingSum));\n        else\n         \
  \   if (root->left)\n                return hasSum(root->left, remainingSum);\n\
  \            else\n                return hasSum(root->right, remainingSum);\n \
  \   }\n}\n```\n\n\n\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\n\
  ## 10. 寻找二叉树中两个叶子节点之间的最大路径和\n\n### 解决方案\n两个叶子节点之间的最大路径和可能通过根节点，也可能仅位于某个子树中。因此，我们有以下递归情况：\n\
  \n- 基础情况是根为 `NULL`，我们返回 `0`。\n- 然后我们分别递归计算左子树和右子树的最大路径和。\n- 接着计算左子树、右子树以及以当前节点为根的子树的最大值。如果这个值改进了目前观察到的总最大值，则更新总最大值。\n\
  - 从递归返回时，我们计算左右子树之间的最大值，并加上当前节点的权重。\n\n### 代码\n```cpp\ntemplate<typename  tVal>\n\
  tVal max(tVal  a, tVal  b)\n  {\n  return (a >= b) ? a : b;\n  }\n\ntemplate<typename\
  \  tVal>\nint maxPathSum(binaryTree<tVal> * root, tVal &res)\n  {\n  if (!root)\n\
  \    return 0;\n  int lLPSum = maxPathSum(root->left, res);\n  int rLPSum = maxPathSum(root->right,\
  \ res);\n  int curr_sum = max((lLPSum + rLPSum + root->v__),\n         max(lLPSum,\
  \ rLPSum));\n  if (res < curr_sum)\n    res = curr_sum;\n  return max(lLPSum, rLPSum)\
  \ + root->v__;\n  }\n```\n\n### 复杂度\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\
  \n## 11. 给定前序和中序遍历重建二叉树\n\n### 解决方案\n在前序遍历中，根节点总是每个子树的最左侧元素。因此我们开始将前序遍历数组中最左侧的元素作为整棵树的根。现在：如果我们在中序数组中搜索该元素，可以立即推断出该值之前的所有元素（属于左子树）以及该值之后的所有元素（属于右子树）。因此，该解决方案可以通过递归计算。\n\
  \n### 代码\n```cpp\ntemplate<typename  tVal>\nunsigned search(std::vector<tVal> inorder,\n\
  \  unsigned  start, unsigned  end, tVal  v)\n  {\n  for (unsigned i = start; i <=\
  \ end; i++)\n    if (inorder[i] == v)\n      return i;\n  }\n\ntemplate<typename\
  \  tVal>\nbinaryTree<tVal> * buildBTfromInorderAndPreorder(\n  const std::vector<tVal>\
  \ & inOrder,\n  const std::vector<tVal> & preOrder,\n  unsigned & preIndex,\n  unsigned\
  \  inStart, unsigned  inEnd)\n  {\n  binaryTree<tVal> * n;\n  n->v__ = preOrder[preIndex++];\n\
  \  if (inStart == inEnd)\n    return n;\n  int inIndex =\n      search(inOrder,\
  \ inStart, inEnd, n->v__);\n\n  n->left =\n      buildBTfromInorderAndPreorder(inOrder,\
  \ preOrder,\n      inStart, inIndex - 1);\n  n->right =\n      buildBTfromInorderAndPreorder(inOrder,\
  \ preOrder,\n      inIndex+1, inEnd);\n  }\n```\n\n### 复杂度\n时间复杂度为 ![](img/00006.jpeg)。感兴趣的读者可能会思考，这个复杂度是否为最优复杂度。\n\
  \n## 12. 打印之形遍历（Zig-Zag traversal）\n\n### 解决方案\n之形遍历通过使用两个栈实现，并且在每一层之间进行交换。在访问 `currentLevel`\
  \ 期间，所有子节点都被插入 `nextLevel` 栈中。需要考虑的是：维护一个布尔值来确定访问方向（从左到右或从右到左），并且该方向在每个循环中反转。当 `currentLevel`\
  \ 栈为空时，将其与 `nextLevel` 交换。通过使用两个栈，之形遍历是层序遍历的一种变体。\n\n### 代码\n```cpp\ntemplate<typename\
  \  tVal>\nvoid printZigZag(binaryTree<tVal> * root)\n  {\n  binaryTree<tVal> * tmp;\n\
  \  bool left2right = true;\n  if (!root)\n    return;\n\n      std::stack<binaryTree<tVal>\
  \ *> currLevel;\n      std::stack<binaryTree<tVal> *> nextLevel;\n      currLevel.push(root);\n\
  \  while (!currLevel.empty())\n      {\n        tmp = currLevel.top();\n       \
  \ currLevel.pop();\n        if (tmp)\n        {\n        std::cout << \" v=\" <<\
  \ tmp->v__;\n        if (left2right)\n          {\n            nextLevel.push(tmp->left);\n\
  \            nextLevel.push(tmp->right);\n          }\n        else\n          {\n\
  \            nextLevel.push(tmp->right);\n            nextLevel.push(tmp->left);\n\
  \          }\n        }\n      if (currLevel.empty())\n        {\n        left2right\
  \ = !left2right;\n        currLevel.swap(nextLevel);\n      }\n```\n\n### 复杂度\n\
  时间复杂度为 ![](img/00007.jpeg)，空间复杂度为 ![](img/00007.jpeg)。\n\n## 13. 打印两个节点的公共祖先（LCA）\n\
  \n### 解决方案\n两个节点的公共祖先可以通过根节点，也可能仅位于某个子树中。因此我们有以下递归情况：\n\n- 基础情况是根为 `NULL`，我们返回 `NULL`。\n\
  - 然后我们递归计算左子树和右子树的公共祖先。\n- 接着计算左子树、右子树以及以当前节点为根的子树的公共祖先。如果这个值改进了目前观察到的总公共祖先，则更新总公共祖先。\n\
  - 从递归返回时，我们计算左右子树之间的公共祖先，并加上当前节点。\n\n### 代码\n```cpp\ntemplate<typename  tVal>\n\
  binaryTree<tVal> * LCA(binaryTree<tVal> * root,\n  binaryTree<tVal> * n1, binaryTree<tVal>\
  \ * n2)\n  {\n  if (!root)\n    return NULL;\n  if (root == n1 || root == n2)\n\
  \    return root;\n  binaryTree<tVal> * left =\n      LCA(root->left, n1, n2);\n\
  \  binaryTree<tVal> * right =\n      LCA(root->right, n1, n2);\n  if (left && right)\n\
  \    return root;\n  return (left ? left : right);\n  }\n```\n\n### 复杂度\n时间复杂度为\
  \ ![](img/00008.jpeg)，空间复杂度为 ![](img/00008.jpeg)。\n\n## 14. 在二叉搜索树中实现“查找”和“插入”\n\
  \n### 解决方案\n二叉搜索树（BST）是一种每个节点最多有两个子节点的树。其左子树包含所有严格小于节点值的键，右子树包含所有大于节点值的键。\n\n`Find()`\
  \ 通过检查[根节点](http://en.wikipedia.org/Tree_(data_structure)#root_nodes) 开始。如果树为空，键不在树中。如果键等于根节点，`find()`\
  \ 返回根节点。如果键小于根节点，搜索左子树。如果键大于根节点，搜索右子树。该方法可以递归或迭代地执行。\n\n`Insert()` 遵循类似的方法。在树内部搜索待插入的键。如果已找到，则返回。否则，如果搜索到达空节点，则将键插入该位置。该过程可以是递归的或迭代的。下面我们提供一个递归版本，并将迭代版本的任务留给感兴趣的读者自行实现。\n\
  \n### 代码\n```cpp\ntemplate<typename  tVal>\ntemplate<typename  tVal>\nstruct binaryTree\n\
  \  {\n  tVal v__;\n  struct binaryTree<tVal> * left;\n  struct binaryTree<tVal>\
  \ * right;\n  binaryTree(tVal  v) : v__(v),\n    left(NULL), right(NULL) {}\n  };\n\
  \ntemplate<typename  tVal>\nbinaryTree<tVal> * find(binaryTree<tVal> * const root,\n\
  \  const tVal k)\n  {\n  if (!root)\n    return NULL;\n  return ((root->v__ < k)\
  \ ? find(root->right, k) :\n      (root->v__ > k ? find(root->left, k) : root));\n\
  \  }\n\ntemplate<typename  tVal>\nvoid insert(binaryTree<tVal> * & root, const tVal\
  \ k)\n  {\n  if (!root)\n    {\n    root = new binaryTree<tVal>(k);\n    return;\n\
  \    }\n  if (root->v__ < k)\n    insert(root->right, k);\n  else if (root->v__\
  \ > k)\n    insert(root->left, k);\n  }\n```\n\n### 复杂度\n“插入”和“查找”的平均时间复杂度为 ![](img/00012.jpeg)，其中\
  \ ![](img/00013.jpeg) 表示树中的节点数。然而，如果树不平衡，复杂度为 ![](img/00014.jpeg))\n\n## 15. 按序打印二叉搜索树\n\
  \n### 解决方案\n\n\n\n\nBST 是一种二叉搜索树，因此中序遍历从左子树开始，然后是当前节点，最后是右子树。\n\n### 代码\n```cpp\n\
  template<typename tVal>\nvoid printInorder(binaryTree<tVal> * const node) {\n  \
  \  if (!node)\n        return;\n    printInorder(node->left);\n    std::cout <<\
  \ \" n=\" << node->v__;\n    printInorder(node->right);\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00014.jpeg)),其中\
  \ ![](img/00013.jpeg) 是树中节点的数量。\n\n## 16 在 BST 中实现 findMin 和 findMax\n\n### 解决方案\n\
  最小键位于最左侧的子节点，而最大键位于最右侧的节点。\n\n### 代码\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal>\
  \ * findMin(binaryTree<tVal> * root) {\n    if (!root)\n        return NULL;\n \
  \   while (root->left) { root = root->left; }\n    return root;\n}\n\ntemplate<typename\
  \ tVal>\nbinaryTree<tVal> * findMax(binaryTree<tVal> * root) {\n    if (!root)\n\
  \        return NULL;\n    while (root->right) { root = root->right; }\n    return\
  \ root;\n}\n```\n\n### 复杂度\n平均时间复杂度为![](img/00012.jpeg))，其中 ![](img/00013.jpeg)\
  \ 是树中节点的数量。然而，如果树不是平衡的，复杂度为![](img/00014.jpeg))。\n\n## 17 在 BST 中实现 deleteNode\n\
  \n### 解决方案\n代码 `deleteNode()` 首先在树中查找要删除的键。如果没有该键，算法将返回。否则，有两种不同的情况：\n\n- 如果节点是内部节点，`deleteNode()`\
  \ 会在以节点为根的左子树中找到最大键并找到它。该最大键将替换被搜索的键，从而将其移除。然后通过左子树删除该最大值。\n- 如果节点是外部节点且只有一个孩子（在左侧或右侧），则该子节点替换父节点。在任何情况下，外部节点都会被释放。\n\
  \n以下代码实现了该算法：\n\n### 代码\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal> * deleteNode(binaryTree<tVal>\
  \ * root, const tVal key) {\n    binaryTree<tVal> * tmp;\n    if (!root)\n     \
  \   return NULL;\n    else if (key < root->v__)\n        root->left = deleteNode(root->left,\
  \ key);\n    else if (key > root->v__)\n        root->right = deleteNode(root->right,\
  \ key);\n    else {\n        // 内部节点\n        if (root->left && root->right) {\n\
  \            tmp = findMax(root->left);\n            root->v__ = tmp->v__;\n   \
  \         root->left = deleteNode(root->left, root->v__);\n        }\n        else\
  \ {\n            tmp = root;\n            if (root->left == NULL)\n            \
  \    root = root->right;\n            if (root->right == NULL)\n               \
  \ root = root->left;\n            delete tmp;\n        }\n    }\n    return root;\n\
  }\n```\n\n### 复杂度\n平均时间复杂度为![](img/00012.jpeg))，其中 ![](img/00013.jpeg) 是树中节点的数量。然而，如果树不是平衡的，复杂度为![](img/00014.jpeg))。\n\
  \n## 18 在 BST 中实现最低公共祖先\n\n### 解决方案\n对于以根节点为根的树，两个节点 ![](img/00007.jpeg)（键为 ![](img/00017.jpeg））的最低公共祖先\
  \ (LCA) 是键为 ![](img/00018.jpeg)的节点，满足 ![](img/00019.jpeg)或 ![](img/00020.jpeg)。如果不满足这些条件，LCA\
  \ 通过向左（如果 ![](img/00021.jpeg））或向右移动来导航三者，直到满足其中一个条件或到达外部节点。\n\n### 代码\n```cpp\n\
  template<typename tVal>\nbinaryTree<tVal> * lca(binaryTree<tVal> * const root, binaryTree<tVal>\
  \ * const n1, binaryTree<tVal> * const n2) {\n    if (!root || !n1 || !n2)\n   \
  \     return;\n    while (true) {\n        if (((n1->v__ < root->v__) && (root->v__\
  \ < n2->v__)) || ((n1->v__ > root->v__) && (root->v__ > n2->v__)))\n           \
  \ return root;\n        else if n1->v__ < root->v__)\n            root = root->left;\n\
  \        else\n            root = root->right;\n    }\n}\n```\n\n### 复杂度\n最坏情况下的时间复杂度为![](img/00014.jpeg))。\n\
  \n## 19 检查树是否为 BST\n\n### 解决方案\n可以通过递归计算解决方案，通过检查左子树、当前节点和右子树是否遵循 BST 排序。因此，这种方法很方便。\n\
  \n### 代码\n```cpp\ntemplate<typename tVal>\nbool isBST(binaryTree<tVal> * const root,\
  \ tVal & prev) {\n    if (!root)\n        return true;\n    if (root->left && !isBST(root->left,\
  \ prev))\n        return false;\n    prev = root->v__;\n    if (root->right && !isBST(root->right,\
  \ prev))\n        return false;\n    return true;\n}\n```\n\n### 复杂度\n最坏情况的时间复杂度为![](img/00014.jpeg))。\n\
  \n## 20 将双链表转换为 BST\n\n### 解决方案\n将双链表转换为 BST 可以轻松实现。节点的右孩子可以作为双链表的前向指针，左孩子作为后向指针。在开始时会发生特殊情况，即双链表的尾部指针如代码所示。\n\
  \n### 代码\n```cpp\ntemplate<typename tVal>\nstruct dLL {\n    tVal v__;\n    struct\
  \ dLL *prev;\n    struct dLL *next;\n    dLL(tVal v) : v__(v), prev(NULL), next(NULL)\
  \ {}\n};\n\ntemplate<typename tVal>\ndLL<tVal> * findMiddleNode(dLL<tVal> *head);\n\
  \ntemplate<typename tVal>\nbinaryTree<tVal> * doubleListToBST(dLL<tVal> * head)\
  \ {\n    dLL<tVal> *tmp, *p, *q;\n    if (!head || !head->next)\n        return\
  \ NULL;\n    tmp = findMiddleNode(head);\n    p = head;\n    while (p->next != tmp)\n\
  \        p = p->next;\n    p->next = NULL;\n    q = tmp->next;\n    tmp->next =\
  \ NULL;\n    tmp->v__ = doubleListToBST(head);\n    tmp->next = doubleListToBST(q);\n\
  \    return tmp;\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00014.jpeg))，其中 ![](img/00013.jpeg)\
  \ 是列表中节点的数量。\n\n## 21 将 BST 转换为双链表\n\n### 解决方案\n可以通过递归轻松将 BST 转换为双链表。节点的右孩子可以作为双链表的前向指针，左孩子作为后向指针。算法从开始开始，如代码详细定义。\n\
  \n### 代码\n```cpp\ntemplate <typename tVal>\nvoid bstToDoubleList(binaryTree<tVal>\
  \ *root, binaryTree<tVal> ** head, binaryTree<tVal> ** tail) {\n    if (!root)\n\
  \        return;\n    if (root->left)\n        bstToDoubleList(root->left, head,\
  \ tail);\n    root->left = *tail;\n    if (*tail)\n        (*tail)->right = root;\n\
  \    else\n        *head = root;\n    *tail = root;\n    if (root->right)\n    \
  \    bstToDoubleList(root->right, head, tail);\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00014.jpeg))，其中\
  \ ![](img/00013.jpeg) 是树中节点的数量。\n\n## 22 在 BST 中查找第 k 个元素\n\n### 解决方案\n可以通过保持计数器的引用来递归解决该问题，如下代码所示。\n\
  \n### 代码\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal> * findkth(binaryTree<tVal>\
  \ * const root, const tVal k, unsigned & count) {\n    if (!root)\n        return\
  \ NULL;\n    binaryTree<tVal> * left = findkth(root->left, k, count);\n    if (left)\n\
  \        return left;\n    if (++count == k)\n        return root;\n    return findkth(root->right,\
  \ k, count);\n}\n```\n\n### 复杂度\n时间复杂度为![](img/00022.jpeg))，其中 ![](img/00023.jpeg)\
  \ 是要查找键的位置。\n\n## 23 打印 BST 中给定区间内的所有键\n\n### 解决方案\n\n\n\n\n给定两个键 `![]images/00024.jpeg)`\
  \ 使得 `![]images/00025.jpeg)`，对 `BST` 树进行导航，如果当前节点的键大于或等于 `![]images/00023.jpeg)`，则递归地向左子节点导航。然后检查范围条件，如果满足，则打印当前节点。最后递归地向右子节点导航。\n\
  \n### 代码\n\n```cpp\ntemplate<typename tVal>\nbinaryTree<tVal> * rangePrint(binaryTree<tVal>\
  \ * const root, const tVal k, const tVal h) \n{\n    if (!root)\n        return\
  \ NULL;\n    if (root->v__ >= k)\n        rangePrint(root->left, k, h);\n    if\
  \ (root->v__ >= k && root->v__ <= h)\n        std::cout << \" v=\" << root->v__;\n\
  \    if (root->v__ <= h)\n        rangePrint(root->right, k, h);\n}\n```\n\n###\
  \ 复杂度\n\n最坏时间复杂度为 `![]images/00014.jpeg))`，其中 `![]images/00013.jpeg)` 是树中的节点数。\n\
  \n## 24 合并两个平衡二叉搜索树\n\n### 解决方案\n\n合并两个 `BST` 的最有效的方法是将它们每一个都存储在数组中。然后合并这两个排序数组，并将生成的数组转换回一个新的\
  \ `BST`。\n\n### 代码\n\n```cpp\ntemplate<typename tVal>\nvoid storeInorder(binaryTree<tVal>\
  \ * const root, std::vector<tVal> & inorder) \n{\n    if (!root)\n        return;\n\
  \    storeInorder(root->left, inorder);\n    inorder.push_back(root->v__);\n   \
  \ storeInorder(root->right, inorder);\n}\n\ntemplate<typename tVal>\nvoid dumpVector(const\
  \ std::vector<tVal> &v1)\n{\n    std::cout << std::endl;\n    std::vector<tVal>::const_iterator\
  \ it = v1.begin();\n    for (; it != v1.end(); it++)\n        std::cout << *it <<\
  \ \" \";\n    std::cout << std::endl;\n}\n\ntemplate<typename tVal>\nvoid merge(const\
  \ std::vector<tVal> & v1, const std::vector<tVal> & v2, std::vector<tVal> & merged)\n\
  {\n    unsigned m = v1.size(), n = v2.size();\n    if (merged.size() != n + m)\n\
  \        return;\n    unsigned i = 0, j = 0, k = 0;\n    while (i < m && j < n)\n\
  \    {\n        if (v1[i] < v2[j])\n            merged[k] = v1[i++];\n        else\n\
  \            merged[k] = v2[j++];\n        k++;\n    }\n    while (i < m)\n    \
  \    merged[k++] = v1[i++];\n    while (j < n)\n        merged[k++] = v2[j++];\n\
  }\n\ntemplate<typename tVal>\nbinaryTree<tVal> * sortedArrayToBST(const std::vector<tVal>\
  \ &v, int start, int end)\n{\n    if (start > end)\n        return NULL;\n    int\
  \ mid = (start + end) / 2;\n    binaryTree<tVal> *root = new binaryTree<tVal>(v[mid]);\n\
  \    root->left = sortedArrayToBST(v, start, mid - 1);\n    root->right = sortedArrayToBST(v,\
  \ mid + 1, end);\n    return root;\n}\n\ntemplate<typename tVal>\nbinaryTree<tVal>\
  \ * mergeTrees(binaryTree<tVal> * const root1, binaryTree<tVal> * const root2)\n\
  {\n    std::vector<int> v1;\n    storeInorder(root1, v1);\n    std::vector<int>\
  \ v2;\n    storeInorder(root2, v2);\n    std::vector<int> merged(v1.size() + v2.size());\n\
  \    merge(v1, v2, merged);\n    dumpVector(merged);\n    return sortedArrayToBST(merged,\
  \ 0, merged.size() - 1);\n}\n\ntemplate<typename tVal>\nvoid dump(binaryTree<tVal>\
  \ * const root)\n{\n    if (!root)\n        return;\n    else\n        std::cerr\
  \ << \" v==\" << root->v__ << \" \";\n    if (root->left)\n        std::cerr <<\
  \ \" ->left \";\n        dump(root->left);\n    if (root->right)\n        std::cerr\
  \ << \" ->right \";\n        dump(root->right);\n}\n```\n\n### 复杂度\n\n该方法的复杂度为 `![]images/00026.jpeg)`，其中\
  \ `![]images/00013.jpeg)` 和 `![]images/00027.jpeg)` 是两个 `BST` 中的节点数。\n\n## 25 在平衡\
  \ BST 中寻找和为 0 的元组\n\n### 解决方案\n\n最优解决方案是将 `BST` 转换为双向链表。然后可以遍历列表，并对于每个负元素尝试在列表中寻找一个等于当前节点键的对。\n\
  \n### 代码\n\n```cpp\ntemplate<typename tVal>\nvoid stToDoubleList(binaryTree<tVal>\
  \ *root, binaryTree<tVal> ** head, binaryTree<tVal> ** tail) \n{\n    if (!root)\n\
  \        return;\n    if (root->left)\n        stToDoubleList(root->left, head,\
  \ tail);\n    if (!*head)\n        *head = root;\n    else\n        (*tail)->right\
  \ = root;\n    *tail = root;\n    if (root->right)\n        stToDoubleList(root->right,\
  \ head, tail);\n}\n\ntemplate<typename tVal>\nbool isPresent(binaryTree<tVal> *\
  \ head, binaryTree<tVal> * tail, int sum) \n{\n    while (head != tail)\n    {\n\
  \        int curr = head->v__;\n        if (curr == sum)\n            return true;\n\
  \        else if (curr > sum)\n            tail = head;\n        else\n        \
  \    head = head->right;\n    }\n    return false;\n}\n\ntemplate<typename tVal>\n\
  bool isTriplet(binaryTree<tVal> *root)\n{\n    if (!root)\n        return false;\n\
  \    binaryTree<tVal>* head = NULL;\n    binaryTree<tVal>* tail = NULL;\n    stToDoubleList(root,\
  \ &head, &tail);\n    while (head != NULL && (head->v__ < 0))\n    {\n        if\
  \ (isPresent(head->right, tail, -head->v__))\n            return true;\n       \
  \ else\n            head = head->right;\n    }\n    return false;\n}\n```\n\n###\
  \ 复杂度\n\n## 26 实现 B 树\n\n### 解决方案\n\n`B 树` 允许在对数时间内进行插入，通常用于读写大量数据的系统，如数据库。在 `B\
  \ 树` 中，内部节点具有在范围 `![]images/0028.jpeg)` 内的子节点数量。键作为分离值，将树划分为子树，如下所示：![`bluerwhite.org/btree/tree1.png`](img/0029)\n\
  \n 分支因子 `2` 保证了节点可以分裂或合并。如果内部节点有 `![]images/00031.jpeg)` 个键，可以通过将该 `![]images/0032.jpeg)`\
  \ 键节点分裂为两个 `![]images/0033.jpeg)` 键节点并将键添加到父节点来完成。每个分裂节点都维持所需的键数。同样，如果每个内部节点及其邻居都有\
  \ `![]images/0033.jpeg)` 个键，则可以通过与邻居合并来从内部节点删除键。删除键将为内部节点留下 `![]images/0034.jpeg)`\
  \ 个键，但合并邻居将增加 `![]images/0035.jpeg)` 个键，加上来自邻居父的一个键。总数仍为 `![]images/0031.jpeg)`\
  \ 个键。节点的分支数比存储在节点中的键数多一。B 树通过要求所有叶节点处于同一深度来保持平衡。\n\n更正式地说，阶为 `[]images/0036.jpeg)`\
  \ 的 B 树定义为满足以下属性的树：\n\n1. 每个节点最多有 `![]images/0037.jpeg)` 个子。\n2. 非叶节点（根节点外）至少有 `![]images/0038.jpeg)`\
  \ 个子。\n3. 如果根节点不是叶节点，则至少有两个子。\n4. 具有 `![]images/0023.jpeg)` 个子的非叶节点包含 `![]images/0039.jpeg)`\
  \ 个键。\n5. 所有叶子节点出现在同一层\n6. 每个内部节点的键都作为分离值，将其子树划分。\n\n### 搜索\n\n此操作与搜索二叉搜索树的操作相似。从根节点开始，递归地从上向下遍历树，并在每一层选择在搜索值两侧都有分离键的子树。节点内的搜索可以是线性搜索或二分搜索。\n\
  \n\n\n\n\n# 插入\n\n要插入新键，请遍历树找到叶子节点，即新键应该添加的位置：\n\n* 如果节点包含的元素少于 `images/00042.jpeg`，则有空间容纳新元素，可以按照顺序进行插入。\n\
  * 否则，如果节点已满，则必须将其分为两个节点：\n    * 在叶子节点的元素和新元素之间选择中位数元素。\n    * 小于中位数的放在新的左侧节点中，大于中位数的放在新的右侧节点中。\n\
  \    * 中位数作为分隔值。\n\n分隔键被插入到节点的父节点中，如果父节点也满了，则对其进行拆分。如果该节点是根节点，我们需要在旧根上方创建一个新根节点。\n\
  \n如果拆分一直持续根节点，它将创建一个包含单个分隔键和两个子节点的新根。当一个节点被拆分时，一个键会进入父节点，但会额外增加一个键。\n\n# 删除\n\n\
  思路是找到并删除该项，然后重构树以恢复其不变性。此操作留作练习题。\n\n### 代码\n\n```cpp\n#ifndef BTREE_HEAD_\n#define\
  \ BTREE_HEAD_ 1\n#include <iostream>\n\nnamespace Tree{\ntypedef int tKey;\nclass\
  \ BtreeNode;\ntypedef BtreeNode * BtreeLink;\nclass BtreeNode {\nprivate:\n    unsigned\
  \ t__; // 2t-1 keys, 2t children\n    bool leaf__; // 是否为叶子\n    unsigned n__; //\
  \ 当前数量\n    tKey * keys__; //键数组\n    BtreeLink * children__; // 指子节点数组的指针\n\npublic:\n\
  \    // 构造函数\n    BtreeNode(unsigned t, bool leaf) :\n        t__(t), leaf__(leaf),\
  \ n__(0),\n        keys__(new tKey[2 * t__ - 1]),\n        children__(new BtreeLink[2\
  \ * t__])\n    {};\n\n    // 遍历\n    void traverse(unsigned lev=0) {\n        std::cout\
  \ << \"lev=\" << lev << \" \";\n        // n keys, n+1 childrens\n        unsigned\
  \ i = 0;\n        for (; i < n__; i++) {\n            std::cout << \" \" << keys__[i];\n\
  \            if (!leaf__)\n                children__[i]->traverse(lev+1);\n   \
  \     }\n        // 最后一个孩子\n        if (!leaf__)\n            children__[i]->traverse(lev\
  \ + 1);\n    }\n\n    // 删除所有\n    void deleteAll() {\n        //n+1 children\n\
  \        for (unsigned i = 0; i <= n__; i++) {\n            if (!leaf__)\n     \
  \           children__[i]->deleteAll();\n        }\n        delete[] children__;\n\
  \        delete[] keys__;\n    };\n\n    // 析构\n    ~BtreeNode() {\n        deleteAll();\n\
  \    }\n\n    // 在 B 树中搜索\n    BtreeLink search(tKey k) {\n        unsigned i =\
  \ 0;\n        // 查找右位置\n        for (; i < n__ && k > keys__[i]; i++);\n       \
  \ // 找到键\n        if (keys__[i] == k)\n            return this;\n        // 未找到\n\
  \        if (leaf__)\n            return NULL;\n        // 递归\n        return children__[i]->search(k);\n\
  \    }\n\n    // 在非满节点中插入\n    void insertNonFull(tKey k) {\n        // 最右键\n  \
  \      int i = n__ - 1;\n        if (leaf__) {\n            // 有一个位置可用\n       \
  \     // 所以复制键并\n            // 找到正确位置\n            while (i >= 0 && keys__[i] >\
  \ k) {\n                keys__[i + 1] = keys__[i];\n                i--;\n     \
  \       }\n            // 找到正确位置\n            keys__[i + 1] = k;\n            n__++;\n\
  \        } else { // 非叶子\n            // 找到正确位置\n            while (i >= 0 && keys__[i]\
  \ > k)\n                i--;\n            // 满了并递归插入\n            if (children__[i\
  \ + 1]->n__ == 2 * t__ - 1) {\n                splitChild(i + 1, children__[i +\
  \ 1]);\n                if (keys__[i + 1] < k)\n                    i++; // 下一个孩子\n\
  \            }\n            children__[i + 1]->insertNonFull(k);\n        }\n  \
  \      std::cout << \"traversing n==\" << n__;\n        traverse();\n        std::cout\
  \ << std::endl;\n    }\n\n    void splitChild(int i, BtreeLink l) {\n        BtreeLink\
  \ m = new BtreeNode(l->t__, l->leaf__);\n        m->n__ = t__ - 1;\n        // 从\
  \ t 到 2t-1 拷贝右侧键\n        for (unsigned j = 0; j < t__ - 1; j++)\n            m->keys__[j]\
  \ = l->keys__[j + t__];\n        // 从 t 到 2t 拷贝孩子\n        if (!l->leaf__) {\n \
  \           for (unsigned j = 0; j < t__; j++)\n                m->children__[j]\
  \ = l->children__[j + t__];\n        }\n        // 少一个键\n        l->n__ = t__ -\
  \ 1;\n        // 留出空间\n        for (int j = n__; j >= i+1; j--)\n            children__[j\
  \ + 1] = children__[j];\n        // 连接新节点\n        children__[i + 1] = m;\n    \
  \    // 留出空间\n        for (int j = n__ - 1; j >= i; j--)\n            keys__[j +\
  \ 1] = keys__[j];\n        // 拷贝中间的键\n        keys__[i] = l->keys__[t__ - 1];\n\
  \        n__++;\n    }\n    friend class Btree;\n};\n\nclass Btree {\n    BtreeNode\
  \ * root;\n    unsigned t__;\npublic:\n    Btree(unsigned t) : root(NULL), t__(t)\
  \ {};\n\n    void traverse() {\n        if(root) root->traverse();\n    }\n\n  \
  \  BtreeLink search(tKey k) {\n        return(root ? root->search(k) : NULL);\n\
  \    }\n\n    void insert(tKey k) {\n        if (!root) {\n            root = new\
  \ BtreeNode(t__, true);\n            root->keys__[0] = k;\n            root->n__\
  \ = 1;\n        } else {\n            if (root->n__ == 2 * t__ - 1) {\n        \
  \        BtreeNode *s = new BtreeNode(t__, false);\n                root = s;\n\
  \                s->children_[0] = root;\n                splitChild(0, root);\n\
  \            }\n            root->insertNonFull(k);\n        }\n    }\n};\n#endif\n\
  ```\n[/content]\n\n翻译：\n\n[content]\n\n# 插入\n\n要插入新键，请遍历树找到叶子节点，即新键应该添加的位置：\n\n\
