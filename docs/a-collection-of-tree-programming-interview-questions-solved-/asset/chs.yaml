  \n# 删除\n\n思路是找到并删除该项，然后重构树以恢复其不变性。此操作留作练习题。\n\n### 代码\n\n```cpp\n#ifndef BTREE_HEAD_\n\
  #define BTREE_HEAD_ 1\n#include <iostream>\n\nnamespace Tree{\ntypedef int tKey;\n\
  class BtreeNode;\ntypedef BtreeNode * BtreeLink;\nclass BtreeNode {\nprivate:\n\
  \    unsigned t__; // 2t-1 keys, 2t children\n    bool leaf__; // 是否为叶子\n    unsigned\
  \ n__; // 当前数量\n    tKey * keys__; //键数组\n    BtreeLink * children__; // 指子节点数组的指针\n\
  \npublic:\n    // 构造函数\n    BtreeNode(unsigned t, bool leaf) :\n        t__(t),\
  \ leaf__(leaf), n__(0),\n        keys__(new tKey[2 * t__ - 1]),\n        children__(new\
