  raw: "After experimenting with what you learned in the previous chapter, you might\
    \ have realized that it was not enough. It was boring. And just displaying what\
    \ you typed in your program is a bit useless.\n\nThis time, this chapter will\
    \ teach you how to create a program that can interact with the user. Check this\
    \ code example:\n\n#include <stdio.h>\n\nint main()\n\n{\n\n              int\
    \ number_container;\n\nprintf( \"Enter any number you want! \" );\n\nscanf( “%d”,\
    \ &number_container );\n\nprintf( \"The number you entered is %d”, number_container\
    \ );\n\ngetchar();\n\nreturn 0;\n\n}\n\n## Variables\n\nYou might have noticed\
    \ the int number_container part in the first line of the code block. int number_container\
    \ is an example of variable declaration. To declare a variable in C, you must\
    \ indicate the variable type first, and then the name of the variable name.\n\n\
    In the example, int was indicated as the variable or data type, which means the\
    \ variable is an integer. There are other variable types in C such as float for\
    \ floating-point numbers, char for characters, etc. Alternatively, the name number_container\
    \ was indicated as the variable’s name or identifier.\n\nVariables are used to\
    \ hold values throughout the program and code blocks. The programmer can let them\
    \ assign a value to it and retrieve its value when it is needed.\n\nFor example:\n\
    \nint number_container;\n\nnumber_container = 3;\n\nprintf ( “The variables value\
    \ is %d”, number_container );\n\nIn that example, the first line declared that\
    \ the program should create an integer variable named number_container. The second\
    \ line assigned a value to the variable. And the third line makes the program\
    \ print the text together with the value of the variable. When executed, the program\
    \ will display:\n\nThe variables value is 3\n\nYou might have noticed the %d on\
    \ the printf line on the example. The %d part indicates that the next value that\
    \ will be printed will be an integer. Also, the quotation on the printf ended\
    \ after %d. Why is that?\n\nIn order to print the value of a variable, it must\
    \ be indicated with the double quotes. If you place double quotes on the variables\
    \ name, the compiler will treat it as a literal string. If you do this:\n\nint\
    \ number_container;\n\nnumber_container = 3;\n\nprintf ( “The variables value\
    \ is number_container” );\n\nThe program will display:\n\nThe variables value\
    \ is number_container\n\nBy the way, you can also use %i as a replacement for\
    \ %d.\n\nAssigning a value to a variable is simple. Just like in the previous\
    \ example, just indicate the name of variable, follow it with an equal sign, and\
    \ declare its value.\n\nWhen creating variables, you must make sure that each\
    \ variable will have unique names. Also, the variables should never have the same\
    \ name as functions. In addition, you can declare multiple variables in one line\
    \ by using commas. Below is an example:\n\nint first_variable, second_variable,\
    \ third_variable;\n\nThose three variables will be int type variables. And again,\
    \ never forget to place a semicolon after your declaration.\n\nWhen assigning\
    \ a value or retrieving the value of a variable, make sure that you declare its\
    \ existence first. If not, the compiler will return an error since it will try\
    \ to access something that does not exist yet.\n\n## Scanf()\n\nIn the first example\
    \ in this chapter, you might have noticed the scanf function. The scanf function\
    \ is also included in the <stdio.h>. Its purpose is to retrieve text user input\
    \ from the user.\n\nAfter the program displays the ‘Enter any number you want’\
    \ text, it will proceed in retrieving a number from the user. The cursor will\
    \ be appear after the text since the new line escape character was no included\
    \ in the printf.\n\nThe cursor will just blink and wait for the user to enter\
    \ any characters or numbers. To let the program get the number the user typed\
    \ and let it proceed to the next line of code, he must press the Enter key. Once\
    \ he does that, the program will display the text ‘The number you entered is’\
    \ and the value of the number the user inputted a while ago.\n\nTo make the scanf\
    \ function work, you must indicate the data type it needs to receive and the location\
    \ of the variable where the value that scanf will get will be stored. In the example:\n\
    \nscanf( “%d”, &number_container );\n\nThe first part “%d” indicates that the\
    \ scanf function must retrieve an integer. On the other hand, the next part indicates\
    \ the location of the variable. You must have noticed the ampersand placed in\
    \ front of the variable’s name. The ampersand retrieves the location of the variable\
    \ and tells it to the function.\n\nUnlike the typical variable value assignment,\
    \ scanf needs the location of the variable instead of its name alone. Due to that,\
    \ without the ampersand, the function will not work.\n\n## Math or Arithmetic\
    \ Operators\n\nAside from simply giving number variables with values by typing\
    \ a number, you can assign values by using math operators. In C, you can add,\
    \ subtract, multiply, and divide numbers and assign the result to variables directly.\
    \ For example:\n\nint sum;\n\nsum = 1 + 2;\n\nIf you print the value of sum, it\
    \ will return a 3, which is the result of the addition of 1 and 2\\. By the way,\
    \ the + sign is for addition, - for subtraction, * for multiplication, and / for\
    \ division.\n\nWith the things you have learned as of now, you can create a simple\
    \ calculator program. Below is an example code:\n\n#include <stdio.h>\n\nint main()\n\
    \n{\n\n              int first_addend, second_addend, sum;\n\nprintf( \"Enter\
    \ the first addend! \" );\n\nscanf( “%d”, &first_addend );\n\nprintf( \"\\nEnter\
    \ the second addend! \" );\n\nscanf( “%d”, &second_addend );\n\nsum = first_addend\
    \ + second_addend;\n\nprintf( \"The sum of the two numbers is %d”, sum );\n\n\
    getchar();\n\nreturn 0;\n\n}\n\n# \n\nChapter 3: Conditional Statements\n\nThe\
    \ calculator program seems nice, is it not? However, the previous example limits\
    \ you on creating programs that only uses one operation, which is a bit disappointing.\
    \ Well, in this chapter, you can improve that program with the help of if or conditional\
    \ statements. And of course, learning this will improve your overall programming\
    \ skills. This is the part where you will be able to make your program ‘think’.\n\
    \n‘If’ statements can allow you to create branches in your code blocks. Using\
    \ them allows you to let the program think and perform specific functions or actions\
    \ depending on certain variables and situations. Below is an example:\n\n#include\
    \ <stdio.h>\n\nint main()\n\n{\n\n              int some_number;\n\nprintf( “Welcome\
    \ to Guess the Magic Number program. \\n” );\n\nprintf( “Guess the magic number\
    \ to win. \\n” );\n\nprintf( \"Type the magic number and press Enter: \" );\n\n\
    scanf( “%d”, &some_number );\n\n              if ( some_number == 3 ) {\n\n             \
    \               printf( \"You guessed the right number! \" );\n\n             \
    \ }\n\ngetchar();\n\nreturn 0;\n\n}\n\nIn the example, the if statement checked\
    \ if the value of the variable some_number is equal to number 3\\. In case the\
    \ user entered the number 3 on the program, the comparison between the variable\
    \ some_number and three will return TRUE since the value of some_number 3 is true.\
    \ Since the value that the if statement received was TRUE, then it will process\
    \ the code block below it. And the result will be:\n\nYou guessed the right number!\n\
    \nIf the user input a number other than three, the comparison will return a FALSE\
    \ value. If that happens, the program will skip the code block in the if statement\
    \ and proceed to the next line of code after the if statement’s code block.\n\n\
    By the way, remember that you need to use the curly braces to enclosed the functions\
    \ that you want to happen in case your if statement returns TRUE. Also, when inserting\
    \ if statement, you do not need to place a semicolon after the if statement or\
    \ its code block’s closing curly brace. However, you will still need to place\
    \ semicolons on the functions inside the code blocks of your if statements.\n\n\
    ## TRUE and FALSE"
