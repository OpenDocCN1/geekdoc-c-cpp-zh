    \n---\n\n## 引言\n\n我想感谢并祝贺你下载了这本书，《C 编程成功 (ind.com/search?q=C+Programming+Success&btnG=Search)——*初学者快速、简单高效学习\
    \ C 编程指南*》。\n\n**重要提示：** 本言已根据上下文恢复进行了部分修正，因为缺少了引用标记。\n\n无论如何，C 语言是目前最流行的编程语言之一。许多专家开发者在学习计算机编程时都是学习\
