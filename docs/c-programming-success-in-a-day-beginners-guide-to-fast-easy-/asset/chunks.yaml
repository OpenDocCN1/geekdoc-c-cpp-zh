  raw: 'You will also notice that referencing the string data from an entry requires
    a different syntax, namely “%s” instead of the “%d” used for integers. As seen
    in this snippet of code below.


      printf( "Book 1 title : %s\n", Book1.title);


       printf( "Book 1 author : %s\n", Book1.author);


       printf( "Book 1 subject : %s\n", Book1.subject);


       printf( "Book 1 book_id : %d\n", Book1.book_id);


    This chunk of code is responsible for this display when the code is run.


    Book 1 title : C Programming


    Book 1 author : Nuha Ali


    Book 1 subject : C Programming Tutorial


    Book 1 book_id : 6495407


    Look at how the last display line contains both strings and integers in one line.
    This shows how structures enable users to mix in different types of data groups
    into one classification without having to create several different variables in
    multiple declarations. It saves programmers a lot of time when it comes to programming.


    Unions


    Apart from structures, unions are another way to group different data types into
    one memory address. Take a look at the following example.


    #include <stdio.h>


    #include <string.h>


    union Data


    {


       int i;


       float f;


       char  str[20];


    };


    int main( )


    {


       union Data data;       


       data.i = 10;


       printf( "data.i : %d\n", data.i);


       data.f = 220.5;


       printf( "data.f : %f\n", data.f);


       strcpy( data.str, "C Programming");


       printf( "data.str : %s\n", data.str);


       return 0;


    }


    This set of code will generate the following lines of display


    data.i : 10


    data.f : 220.500000


    data.str : C Programming


    You would notice that unions are constructed the same way as structures. The main
    difference between the two is that structures have different memory addresses
    for each of the members inside of it. Unions, on the other hand, only hold one
    memory address that contains all of the members. In order to use the individual
    items within the union, you would need a separate declaration of which member
    you want to access such as this.


    data.i = 10;


       printf( "data.i : %d\n", data.i);


    Typedef


    You would notice in the examples that we’ve had so far that the variables we use
    belong to a specific type of data input. It could be an integer or a character.
    Later on within this book you will also encounter other data types that you can
    use within your codes.


    Despite being limited to the kinds of data types you can use, you can actually
    dictate a new type of data and assign it to a variable. This is known as a typedef.
    To understand how it works in detail, take a look at the following example.


    #include <stdio.h>


    #include <string.h>


    typedef struct Books


    {


       char  title[50];


       char  author[50];


       char  subject[100];


       int   book_id;


    } Book;


    int main( )


    {


       Book book;


       strcpy( book.title, "C Programming");


       strcpy( book.author, "Nuha Ali");


       strcpy( book.subject, "C Programming Tutorial");


       book.book_id = 6495407;


       printf( "Book title : %s\n", book.title);


       printf( "Book author : %s\n", book.author);


       printf( "Book subject : %s\n", book.subject);


       printf( "Book book_id : %d\n", book.book_id);


       return 0;


    }


    You will notice that the typedef function in the earlier sections of the code
    introduced a new type of data known as Books. The Books variable was assigned
    as a structure that contained different members. By assigning the variable Books
    via typedef, you can now reference the various members of the structure by using
    the variable Books as shown here:


    strcpy( book.title, "C Programming");


       strcpy( book.author, "Nuha Ali");


       strcpy( book.subject, "C Programming Tutorial");


       book.book_id = 6495407;


    You will notice that you no longer have to use the term struct to reference your
    structure. Instead, you simply use Books since you used tyedef to assign Books
    to represent the structure. By executing the code above, you will get the following
    display.


    Book  title : C Programming


    Book  author : Nuha Ali


    Book  subject : C Programming Tutorial


    Book  book_id : 6495407


    Typedef provides another way through which you can assign your variable if in
    case you’re already using many types of data input. It also prevents you from
    getting confused when you are typing in long codes for larger programs.


    Chapter 7: The other Header Files


    So far, the programs and codes you have been dealing with contained the standard
    header #include at the beginning of the code. This statement allows us to use
    the <stdio.h> library to use functions such as printf and scanf. In the earlier
    chapter, you encountered a new inclusion which was <string.h> which gave you access
    to the strctcpy function. The files <stdio.h> and <string.h> are known as header
    files and they are declared at the beginning of you code to delineate the functions
    and variables that you can use within your program.


    As you might have noticed, there is a vast number of header files available for
    use. On top of that, different compilers have their own set of header files that
    a programmer can use. Some header files do not work on some compilers. A good
    example would be the header file <graphic.h>. This header file contains shapes
    and figures that can be used to form pictures instead of text for a program. Unfortunately,
    this header file does not work with some compilers such as Code::Blocks as it
    was developed for Turbo C. When you attempt larger and more elaborate programs,
    you’ll find more header files with functions that will suit your needs. For a
    meantime, we only need to understand a few more of the basic header files in order
    to add more dimensions to your program.


    <string.h>


    Just as the file name implies, this header file allows you to take action on your
    strings. Another inclusion in this header are the structure-specific functions
    such as strcpy. You will remember that the strcpy function takes the original
    content of one of the strings in a structure so that you could use it with a printf
    function. There are other functions within the <string.h> header that you can
    use with strings. Take a look at this example.


