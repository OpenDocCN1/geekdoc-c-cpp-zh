  raw: "Variables will be discussed at length in a later portion of this book. However,\
    \ we’ll touch on them lightly here to help you distinguish the differences between\
    \ variables and constants and how they are used in C language.\n\nSimply put,\
    \ variables refer to a storage location in your computer’s memory. Its primary\
    \ purpose is to hold data temporarily. Each variable in C should be given a unique\
    \ name. The name you give each variable is only a symbolic name and is only meaningful\
    \ to humans while reading the code. Your compiler will assign a machine readable\
    \ name to the actual variable or memory address being used.\n\nSince variable\
    \ names are identifiers, then you should stick to the rules on creating identifier\
    \ names, which was already mentioned elsewhere in this book. As a quick review\
    \ here are the rules in simple terms:\n\nOnly alphanumeric characters are allowed\
    \ (upper case and lower case) and underscores. Maximum length is 31 characters.\
    \ Names must begin with a letter.\n\nThe Different C Language Constants\n\nConstants\
    \ on the other hand are also like variables. However, unlike variables, the value\
    \ contained in constants can’t be changed. There are different constants used\
    \ in C language, which include the following:\n\n*   Integer constants\n\n*  \
    \ Floating point constants\n\n*   Character constants\n\n*   Escape constants\n\
    \n*   String constants\n\n*   Enumeration constants\n\nEnumeration Constants:\
    \ the enum constant is used in any declaration of enumeration types. For example:\n\
    \nenum color {blue, red, yellow, green};\n\nString Constants: you will see these\
    \ constants in the code as any text that is enclosed within double quotation marks.\
    \ Here are several examples on how to use string constants:\n\nRegular string\
    \ constant – \"okay\"\n\nNull string constant – \"\"\n\nString constant with white\
    \ spaces – \"    \"\n\nString constant with one character – \"a\"\n\nString printed\
    \ on a new line – \"this goes to the next line\"\n\nEscape Sequences: escape sequences\
    \ are used to display quotation marks, tabs, and hard returns. A backslash is\
    \ used as a break from the usual way a compiler will interpret certain lines of\
    \ code. Here are some examples of escape sequences:\n\nNull character – \\0\n\n\
    Question mark – \\?\n\nDouble quotes – \\\"\n\nSingle quote – \\'\n\nBackslash\
    \ – \\\\\n\nVertical tab – \\v\n\nHorizontal tab – \\t\n\nReturn – \\r\n\nNewline\
    \ – \\n\n\nForm feed – \\f\n\nBackspace – \\b\n\nCharacter Constants: character\
    \ constants appear as single characters that are enclosed in single quotes. For\
    \ example: 'o'\n\nFloating Point Constants: floating point constants refer to\
    \ numbers with a fractional component. It also refers to numeric values with exponents.\
    \ Here are a few examples:\n\n-0.11E-4\n\n0.00143\n\n-1.0\n\nInteger Constants:\
    \ integer constants are constants that are associated with a number. These numbers\
    \ should not have any fractional parts. They should also not have an exponent.\
    \ There are three different types of integer constants in C. They are decimal,\
    \ octal, and hexadecimal constants.\n\nExamples of decimal constants include 22,\
    \ -9, and 0\\. Examples of octal constants include 033, 077, and 021\\. Examples\
    \ of hexadecimal constants include 0x521 and 0x7f.\n\nNote that hexadecimal constants\
    \ usually start with a \"0x.\" You can also use lower case letters for hexadecimal\
    \ constants. As you observe from the examples above, octal constants usually start\
    \ with 0.\n\n# \n\nChapter 3: Hello World – the Basics\n\nWhen coding a C program,\
    \ you must start your code with the function ‘main’. By the way, a function is\
    \ a collection of action that aims to achieve one or more goals. For example,\
    \ a vegetable peeler has one function, which is to remove a skin of a vegetable.\
    \ The peeler is composed of parts (such as the blade and handle) that will aid\
    \ you to perform its function. A C function is also composed of such components\
    \ and they are the lines of codes within it.\n\nAlso, take note that in order\
    \ to make your coding life easier, you will need to include some prebuilt headers\
    \ or functions from your compiler.\n\nTo give you an idea on what C code looks\
    \ like, check the sample below:\n\n#include <stdio.h>\n\nint main()\n\n{\n\nprintf(\
    \ \"Hello World!\\n\" );\n\ngetchar();\n\nreturn 0;\n\n}\n\nAs you can see in\
    \ the first line, the code used the #include directive to include the stdio.h\
    \ in the program. In this case, the stdio.h will provide you with access to functions\
    \ such as printf and getchar.\n\n## Main Declaration\n\nAfter that, the second\
    \ line contains int main(). This line tells the compiler that there exist a function\
    \ named main. The int in the line indicates that the function main will return\
    \ an integer or number.\n\n## Curly Braces\n\nThe next line contains a curly brace.\
    \ In C programming, curly braces indicate the start and end of a code block or\
    \ a function. A code block is a series of codes joined together in a series. When\
    \ a function is called by the program, all the line of codes inside it will be\
    \ executed.\n\n## Printf()\n\nThe printf function, which follows the opening curly\
    \ brace is the first line of code in your main function or code block. Like the\
    \ function main, the printf also have a code block within it, which is already\
    \ created and included since you included <stdio.h> in your program. The function\
    \ of printf is to print text into your program’s display window.\n\nBeside printf\
    \ is the value or text that you want to print. It should be enclosed in parentheses\
    \ to abide standard practice. The value that the code want to print is Hello World!.\
    \ To make sure that printf to recognize that you want to print a string and display\
    \ the text properly, it should be enclosed inside double quotation marks.\n\n\
    By the way, in programming, a single character is called a character while a sequence\
    \ of characters is called a string.\n\n## Escape Sequence\n\nYou might have noticed\
    \ that the sentence is followed by a \\n. In C, \\n means new line. Since your\
    \ program will have problems if you put a new line or press enter on the value\
    \ of the printf, it is best to use its text equivalent or the escape sequence\
    \ of the new line.\n\nBy the way, the most common escape sequences used in C are:\n\
    \n\\t = tab\n\n\\f = new page\n\n\\r = carriage return\n\n\\b = backspace\n\n\\\
    v = vertical tab\n\n## Semicolons\n\nAfter the last parenthesis, a semicolon follows.\
    \ And if you look closer, almost every line of code ends with it. The reasoning\
    \ behind that is that the semicolon acts as an indicator that it is the end of\
    \ the line of code or command. Without it, the compiler will think that the following\
    \ lines are included in the printf function. And if that happens, you will get\
    \ a syntax error.\n\n## Getchar()\n\nNext is the getchar() function. Its purpose\
    \ is to receive user input from the keyboard. Many programmers use it as a method\
    \ on pausing a program and letting the program wait for the user to interact with\
    \ it before it executes the next line of code. To make the program move through\
    \ after the getchar() function, the user must press the enter key.\n\nIn the example,\
    \ if you compile or run it without getchar(), the program will open the display\
    \ or the console, display the text, and then immediately close. Without the break\
    \ provided by the getchar() function, the computer will execute those commands\
    \ instantaneously. And the program will open and close so fast that you will not\
    \ be able to even see the Hello World text in the display.\n\n## Return Statement\n\
    \nThe last line of code in the function is return 0\\. The return statement is\
    \ essential in function blocks. When the program reaches this part, the return\
    \ statement will tell the program its value. Returning the 0 value will make the\
    \ program interpret that the function or code block that was executed successfully.\n\
    \nAnd at the last line of the example is the closing curly brace. It signifies\
    \ that the program has reached the end of the function.\n\nIt was not that not\
    \ hard, was it? With that example alone, you can create simple programs that can\
    \ display text. Play around with it a bit and familiarize yourself with C’s basic\
    \ syntax.\n\n# \n\nChapter 2: Basic Input Output"
