    Command Line Arguments\n\nYou have learned from this book that your programs should\
    \ start with a main() line before you start declaring your variables and functions.\
    \ This is standard practice that most beginners just pass off as a simple rule.\
    \ But the main() function can also have values and parameters placed within the\
