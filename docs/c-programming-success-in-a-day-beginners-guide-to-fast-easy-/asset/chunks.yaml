  raw: 'To solve that, you must create loops in the program. Loops are designed to
    let the program execute some of the functions inside its code blocks. It effectively
    eliminates the need to write some same line of codes. It saves the time of the
    programmer and it makes the program run more efficiently.


    There are four different ways in creating a loop in C. In this chapter, two of
    the only used and simplest loop method will be discussed. To grasp the concept
    of looping faster, check the example below:


    #include <stdio.h>


    int main()


    {


                  int some_number;


                  int guess_result;


    guess_result = 0;


    printf( “Welcome to Guess the Magic Number program. \n” );


    printf( “Guess the magic number to win. \n” );


    printf( “You have unlimited chances to guess the number. \n” );


                  while ( guess_result == 0 ) {


    printf( "Guess the magic number: " );


    scanf( “%d”, &some_number );


                  if ( some_number == 3 ) {


                                printf( "You guessed the right number! \n" );


                                guess_result = 1;


                  }


                  else if ( some_number > 3 ){


                                printf( "Your guess is too high! \n" );


                                guess_result = 0;


                  }


                  else {


                                printf( "Your guess is too low! \n" );


                                guess_result = 0;


                  }


    }


    printf( "Thank you for playing. Press Enter to exit this program." );


    getchar();


    return 0;


    }


    ## While Loop


    In this example, the while loop function was used. The while loop allows the program
    to execute the code block inside it as long as the condition is met or the argument
    in it returns TRUE. It is one of the simplest loop function in C. In the example,
    the condition that the while loop requires is that the guess_result variable should
    be equal to 0.


    As you can see, in order to make sure that the while loop will start, the value
    of the guess_result variable was set to 0.


    If you have not noticed it yet, you can actually nest code blocks within code
    blocks. In this case, the code block of the if and else statements were inside
    the code block of the while statement.


    Anyway, every time the code reaches the end of the while statement and the guess_result
    variable is set to 0, it will repeat itself. And to make sure that the program
    or user experience getting stuck into an infinite loop, a safety measure was included.


    In the example, the only way to escape the loop is to guess the magic number.
    If the if statement within the while code block was satisfied, its code block
    will run. In that code block, a line of code sets the variable guess_result’s
    value to 1\. This effectively prevent the while loop from running once more since
    the guess_result’s value is not 0 anymore, which makes the statement return a
    FALSE.


    Once that happens, the code block of the while loop and the code blocks inside
    it will be ignored. It will skip to the last printf line, which will display the
    end program message ‘Thank you for playing. Press Enter to exit this program’.


    ## For Loop


    The for loop is one of the most handy looping function in C. And its main use
    is to perform repetitive commands on a set number of times. Below is an example
    of its use:


    #include <stdio.h>


    int main()


    {


                  int some_number;


                  int x;


                  int y;


    printf( “Welcome to Guess the Magic Number program. \n” );


    printf( “Guess the magic number to win. \n” );


    printf( “You have only three chance of guessing. \n” );


    printf( “If you do not get the correct answer after guessing three times. \n”
    );


    printf( “This program will be terminated. \n” );


                  for (x = 0; x < 3; x++) {


                                y = 3 – x;


                  printf( “The number of guesses that you have left is: %d”, y );


    printf( "\nGuess the magic number: " );


    scanf( “%d”, &some_number );


                  if ( some_number == 3 ) {


                                printf( "You guessed the right number! \n" );


                                x = 4;


                  }


                  else if ( some_number > 3 ){


                                printf( "Your guess is too high! \n " );


                  }


                  else {


                                printf( "Your guess is too low! \n " );


                  }


    }


    printf( “Press the Enter button to close this program. \n” );


    getchar();


    getchar();


    return 0;


    }


    The for statement’s argument section or part requires three things. First, the
    initial value of the variable that will be used. In this case, the example declared
    that x = 0\. Second, the condition. In the example, the for loop will run until
    x has a value lower than 3\. Third, the variable update line. Every time the for
    loop loops, the variable update will be executed. In this case, the variable update
    that will be triggered is x++.


    ### Increment and Decrement Operators


    By the way, x++ is a variable assignment line. The x is the variable and the ++
    is an increment operator. The function of an increment operator is to add 1 to
    the variable where it was placed. In this case, every time the program reads x++,
    the program will add 1 to the variable x. If x has a value of 10, the increment
    operator will change variable x’s value to 11.


    On the other hand, you can also use the decrement operator instead of the increment
    operator. The decrement operator is done by place -- next to a variable. Unlike
    the increment operator, the decrement subtracts 1 to its operand.


    Just like the while loop, the for loop will run as long as its condition returns
    TRUE. However, the for loop has a built in safety measure and variable declaration.
    You do not need to declare the value needed for its condition outside the statement.
    And the safety measure to prevent infinite loop is the variable update. However,
    it does not mean that it will be automatically immune to infinite loops. Poor
    programming can lead to it. For example:


    for (x = 1; x > 1; x++) {


                  /* Insert Code Block Here */


    }


    In this example, the for loop will enter into an infinite loop unless a proper
    means of escape from the loop is coded inside its code block.


    The structure of the for loop example is almost the same with while loop. The
    only difference is that the program is set to loop for only three times. In this
    case, it only allows the user to guess three times or until the value of variable
    x does not reach 3 or higher.


    Every time the user guesses wrong, the value of x is incremented, which puts the
    loop closer in ending. However, in case the user guesses right, the code block
    of the if statement assigns a value higher than 3 to variable x in order to escape
    the loop and end the program.


    The Do While Loop


    This kind of loop is similar to the earlier-explained while loop but with a few
    more differences. Take a look at this example.


    #include<stdio.h>


                  int main()


                  {


                                     int counter, howmuch;


                                     scanf("%d", &howmuch);


                                     counter = 0;


                                     do


                                     {


                                          counter++;


                                          printf("%d\n", counter);


                                     }


                                     while ( counter < howmuch);


                                     return 0;


                  }


    If you would take a look at the while loop, you will notice that there is only
    a “while” statement that provides two sets of outcomes, one that forces the program
    to refer back to another block of code and another that brings about the termination
    of the program. With the do while loop, you are adding another check at the end
    of a condition to keep the program from terminating. If you would incorporate
    a do while loop into the example of the while loop, it would look like this.


