  raw: "The if statement will always return TRUE if the condition is satisfied. For\
    \ example, the condition in the if statement is 10 > 2\\. Since 10 is greater\
    \ than 2, then it is true. On the other hand, the if statement will always return\
    \ FALSE if the condition is not satisfied. For example, the condition in the if\
    \ statement is 5 < 5\\. Since 5 is not less than 5, then the statement will return\
    \ a FALSE.\n\nNote that if statements only return two results: TRUE and FALSE.\
    \ In computer programming, the number equivalent to TRUE is any nonzero number.\
    \ In some cases, it is only the number 1. On the other hand, the number equivalent\
    \ of FALSE is zero.\n\n## Operators\n\nAlso, if statements use comparison, Boolean,\
    \ or relational and logical operators. Some of those operators are:\n\n== – equal\
    \ to\n\n!= – not equal to\n\n> – greater than\n\n< – less than\n\n>= – greater\
    \ than or equal to\n\n<= – less than or equal to\n\n## Quick Tips – Other Operators\
    \ in C Language\n\nThis programming language makes use of several operators to\
    \ define the value of different variables. You have already encountered some of\
    \ these operators earlier. The C language operators include arithmetic operators,\
    \ assignment operators, increment operators, decrement operators, relational operators,\
    \ conditional operators, logical operators, bitwise operators, and bitwise operators.\n\
    \nArithmetic operators include the following:\n\nDivision: \"/\"\n\nMultiplication:\
    \ \"*\"\n\nSubtraction: \"-\" (can also be used as unary minus)\n\nAddition: \"\
    +\" (can also be used as unary plus)\n\nIncrement vs. Decrement Operators\n\n\"\
    ++\" is the operator for increment while \"—\" is the operator for decrements.\
    \ They make one unit increments or decrements to the value of an object. Note\
    \ that increment and decrement operators can be placed before or after a variable.\
    \ When these operators prefix a variable they will increment the value of the\
    \ variable first and then return the new value. However, if they postfix a variable\
    \ then the value of the variable will be returned first and then only will this\
    \ operator increment or decrement the original value.\n\nAssignment Operators\n\
    \nThe equal sign is the assignment operator in C language. It assigns a value\
    \ to the variable. Note that the variable should be on the left side of the operator\
    \ and the value should be on the right. For example: \"a = 25\"\n\nLogical Operators\n\
    \nThese operators combine expressions. There are three logical operators used\
    \ in C. They are \"&&\" (logical and), \"||\" (logical or), and \"!\" (logical\
    \ not).\n\nBitwise Operators\n\nC language also involves bit level programming.\
    \ It will not be covered in this book but at least you know what operators are\
    \ involved or used. The bitwise operators in C language are the following:\n\n\
    Shift right: >>\n\nShift left: <<\n\nBitwise complement: ~\n\nBitwise exclusive\
    \ OR: ^\n\nBitwise OR: |\n\nBitwise AND: &\n\n## Else Statement\n\nThere will\
    \ be times that you would want your program to do something else in case your\
    \ if statement return FALSE. And that is what the else statement is for. Check\
    \ the example below:\n\n#include <stdio.h>\n\nint main()\n\n{\n\n             \
    \ int some_number;\n\nprintf( “Welcome to Guess the Magic Number program. \\n”\
    \ );\n\nprintf( “Guess the magic number to win. \\n” );\n\nprintf( \"Type the\
    \ magic number and press Enter: \" );\n\nscanf( “%d”, &some_number );\n\n             \
    \ if ( some_number == 3 ) {\n\n                            printf( \"You guessed\
    \ the right number! \" );\n\n              }\n\n              else {\n\n             \
    \               printf( \"Sorry. That is the wrong number\" );\n\n             \
    \ }\n\ngetchar();\n\nreturn 0;\n\n}\n\nIf ever the if statement returns FALSE,\
    \ the program will skip next to the else statement immediately. And since the\
    \ if statement returns FALSE, it will immediately process the code block inside\
    \ the else statement.\n\nFor example, if the number the user inputted on the program\
    \ is 2, the if statement will return a FALSE. Due to that, the else statement\
    \ will be processed, and the program will display:\n\nSorry. That is the wrong\
    \ number\n\nOn the other hand, if the if statement returns TRUE, it will process\
    \ the if statement’s code block, but it will bypass all the succeeding else statements\
    \ below it.\n\n## Else If\n\nIf you want more conditional checks on your program,\
    \ you will need to take advantage of else if. Else if is a combination of the\
    \ if and else statement. It will act like an else statement, but instead of letting\
    \ the program execute the code block below it, it will perform another check as\
    \ if it was an if statement. Below is an example:\n\n#include <stdio.h>\n\nint\
    \ main()\n\n{\n\n              int some_number;\n\nprintf( “Welcome to Guess the\
    \ Magic Number program. \\n” );\n\nprintf( “Guess the magic number to win. \\\
    n” );\n\nprintf( \"Type the magic number and press Enter: \" );\n\nscanf( “%d”,\
    \ &some_number );\n\n              if ( some_number == 3 ) {\n\n             \
    \               printf( \"You guessed the right number! \" );\n\n             \
    \ }\n\n              else if ( some_number > 3 ){\n\n                           \
    \ printf( \"Your guess is too high!\" );\n\n              }\n\n              else\
    \ {\n\n                            printf( \"Your guess is too low!\" );\n\n             \
    \ }\n\ngetchar();\n\nreturn 0;\n\n}\n\nIn case the if statement returns FALSE,\
    \ the program will evaluate the else if statement. If it returns TRUE, it will\
    \ execute its code block and ignore the following else statements. However, if\
    \ it is FALSE, it will proceed on the last else statement, and execute its code\
    \ block. And just like before, if the first if statement returns true, it will\
    \ disregard the following else and else if statements.\n\nIn the example, if the\
    \ user inputs 3, he will get the You guessed the right number message. If the\
    \ user inputs 4 or higher, he will get the Your guess is too high message. And\
    \ if he inputs any other number, he will get a Your guess is too low message since\
    \ any number aside from 3 and 4 or higher is automatically lower than 3.\n\nWith\
    \ the knowledge you have now, you can upgrade the example calculator program to\
    \ handle different operations. Look at the example and study it:\n\n#include <stdio.h>\n\
    \nint main()\n\n{\n\n              int first_number, second_number, result, operation;\n\
    \nprintf( \"Enter the first number: \" );\n\nscanf( “%d”, &first_number );\n\n\
    printf( \"\\nEnter the second number: \" );\n\nscanf( “%d”, &second_number );\n\
    \nprintf ( “What operation would you like to use? \\n” );\n\nprintf ( “Enter 1\
    \ for addition. \\n” );\n\nprintf ( “Enter 2 for subtraction. \\n” );\n\nprintf\
    \ ( “Enter 3 for multiplication. \\n” );\n\nprintf ( “Enter 4 for division. \\\
    n” );\n\nscanf( “%d”, &operation );\n\n              if ( operation == 1 ) {\n\
