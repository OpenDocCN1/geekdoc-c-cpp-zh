  trans: "\n\n```c\n  printf(\"String obtained on concatenation is %s\\n\",a);\n\n\
    \  return 0;\n\n}\n```\n\n代码的开头显示正在识别两个字符串，每个字符串的限制为 100 个字符。这些声明中的每一个都跟着一个 `gets`\
    \ 函数，用于从用户获取输入。在 `gets` 函数之后是 `strcat` 函数。请注意，放在函数中的值结合了名之其实宜的字符串 `a` 和 `b`。\n\
    \n在之前使用指针拼接字符串的示例中，你不需要使用更多行代码，只需简单地使用 `strcat` 函数将它们对齐。\n\n有些程序员选择使用指针来合并代码行，而不是使用\
    \ `strcat` 函数。这是因为他们已经精通指针，并且非常熟悉它们在 C 语言中的应用。随着你对编程的深入学习，你还会发现其他可以用指针代替的函数。你可以根据需要使用指针或函数来完成你的任务，因为你的编译器能够识别这两种方法。\n\
    \n### strlen\n\n`<string.h>` 头文件中提供的另一个功能是计算字符串的长度。这可以通过 `strlen` 函数来实现。观察以下示例。\n\
    \n```c\n#include <stdio.h>\n\n#include <string.h>\n\nint main ()\n\n{\n  char\
    \ str[50];\n  int len;\nprintf(\"enter text to be measured here \\n\");\n  gets(str);\n\
    \  len = strlen(str);\n  printf(\"Length of |%s| is |%d|\\n\", str, len);\n  return(0);\n\
    }\n```\n\n这段代码将要求用户输入一个要测量的字符字符串。请注意，我们现在使用 `gets` 函数从用户处获取输入以便于操作。\n\n在声明字符串和字符串长度的整数表示法后，使用\
    \ `strlen` 获取输入的长度并存储该数据。使用 `printf` 函数允许你画出该值并在单独的代码行中显示它。当用户在程序中完成字符串输入后，程序将返回字符串中的字符数量。\n\
    \n不过，需要注意的是，字符串始终会有一个额外的字符来结束其长度。这被称为空字符集（null set）。在为你的字符串设置限制时，请务必通过在总数上加 1\
    \ 来考虑到字符串末尾的空字符。由于空字符占据了第 50 个位置，上面的示例总共只能容纳 49 个字符。\n\n### <time.h>\n\nC 语言中另一个有趣的头文件是\
    \ `<time.h>`。自然地，这让你能够访问操作计算机时间设置的不同函数，以及来自其他时间点的其他时间范围。看看这个示例。\n\n```c\n#include\
    \ <stdio.h>\n\n#include <time.h>\n\nint main ()\n\n{\n  time_t sec;\n  sec = time\
    \ ();\n  printf (\"Number of hours since January 1, 1970 is %ld \\n\", sec/3600);\n\
    \  return 0;\n}\n```\n\n运行这段代码时，它只会显示单行文本，根据你计算机的时钟显示自 1970 年 1 月 1 日以来的小时数。\n\
    \n你可能会好奇 1970 年 1 月 1 日对于 C 编程有什么意义。你会惊讶地发现，第一台 UNIX 计算机就在同一天开始运行的。这被称为计算机的“大爆炸”。示例中提到的时间被称为\
    \ UNIX 时间。\n\n请注意，你必须首先用 `time_t` 类型声明变量 `sec`。该函数引入了一个变量，可以从机器的时间寄存器中提取数据。如果你想显示特定点的时间和日期，在这种情况下仅仅使用\
    \ `int` 将不再有效。\n\n```c\ntime_t sec;\nsec = time ();\n```\n\n在上面的代码段中，`time` 旁的空字符获取了自计算机“大爆炸”以来过去的时间。\n\
    \n### ctime\n\n与其使用 UNIX 时间作为参考点，你也可以使用 `time` 函数使用当前的标准时间。观察以下示例。\n\n```c\n#include\
    \ <time.h>\n\n#include <stdio.h>\n\nint main(void)\n{\ntime_t mytime;\nmytime\
    \ = time();\nprintf(ctime(&mytime));\nreturn 0;\n}\n```\n\n这段代码将产生单行显示，根据你的机器显示你所在地区的当前本地时间。请注意，在这个示例中并没有立即声明\
    \ `ctime` 函数，因为它是编译器中一个已知的函数。\n\n`time_t` 函数将时间传递给变量。当你给变量赋值（如 `time()`）时，它会提示系统以这种格式显示当前日期和时间：`www\
