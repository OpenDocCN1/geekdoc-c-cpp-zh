  raw: 'This parameter may have embedded tags. As you can see in the syntax, the fprintf
    function actually waits for additional arguments, which can actually make the
    format of the stream more complex. The tags have the following basic structure:


    %[flags][width][.precision][length]specifier


    As you can see, this parameter has the following tags: flags, width, precision,
    and length. Let us begin with the first tag. The following are the flags that
    may be used in this parameter:


    | 0 | Pads the number with zeroes. The zero padding is to the left. The amount
    of zero pads will be specified by the sub-specifier called “width” (i.e. the tag
    that follows flags) |


    | # | This forces the output to contain a decimal point. Note that if there will
    be no decimal added if no digits follow. This flag is used with the following
    specifiers: o,x, 0x, X, 0X, g, G, e, and E. |


    | <space> | Inserts a blank space before the specified value if there will be
    no sign written. |


    | + | Forces a + or – to precede the function’s result. Note that the result is
    presumed positive and it will only show a negative sign when the actual output
    is a negative number. |


    | - | Changes the default right justification of the output to left justification.
    |


    The following are the widths (i.e. the second tag) that may be used in this parameter:


    | * | Use this to that the width is not indicated. It acts as an extra integer
    value that precedes the actual argument that should be formatted. |


    | <number> | Specifies the minimum amount of numbers that should be written. In
    case the number that should be written is shorter than the number indicated in
    this tag, then the number to be written will be padded with blank spaces. Note
    that the number will not be truncated even the actual number to be written is
    larger than the number specified here. |


    The following are the values that can be used in the .precision tag:


    | .* | This indicates that the precision is not specified. This acts as an extra
    int value argument that precedes the actual argument that needs formatting. |


    | .number | This is used for the following integer specifiers: X, x, u, o, i,
    and d. This specifies what the minimum number of digits that should appear. If
    the actual value is larger than this precision tag, it will not be truncated.
    If it is shorter then it will be padded with leading zeroes. If a 0 is specified
    for the precision tag then no number is written. Note that all the numbers will
    be printed until the null character is reached.A default precision of 1 is assumed
    when there is no precision value specified. A value of 0 is assumed if only a
    period “.” is indicated.Note that the precision can also be used with G and g
    specifiers, which indicates the maximum number of significant digits that should
    be written. It may also be used with the specifiers f, E, and e, which will indicate
    the number of decimal places. Finally, when used with an s specifier, this precision
    will indicate the total possible amount of digits that will be written. |


    The next tag in this parameter is length. This tag may contain the following values:


    | L | This tag indicates a long double. This also means that it only applies to
    floating point numbers. |


    | l | This tag indicates an unsigned or long int. It works with all integer specifiers.
    It can also work as a specifier for wide characters, such as the case for the
    s and c specifiers. |


    | h | Indicates an unsigned short int or short int. This means it works in tandem
    with integer specifiers. |


    Note that additional arguments can be made, as stated earlier. Each of the extra
    arguments must contain a value that should be included in the place of a tag.
    The rule is that there should be the same number of arguments as there are tags
    that are actually expecting a value to be returned.


    If this function is successful, supply the characters that were written on the
    file. If it fails then a negative number will be returned by this function.


    The following is a sample code that demonstrates the fprintf function:


    #include <stdio.h>


    #include <stdlib.h>


    int main()


    {


       FILE * fp;


       fp = fopen ("sample.txt", "w+");


       fprintf(fp, "%s %s %s %d", "This", "is", "the year", 5022);


       fclose(fp);


       return(0);


    }


    The fscanf Function


    The fscanf() function is the opposite of the fprintf function. Simply put, it
    reads any formatted data from a file. Notice that the syntax for both functions
    is very much alike:


    int fscanf(FILE *stream, const char *format, ...)


    This function also has the same parameters. The format parameter is a string.
    This string contains format specifiers, non-whitespace characters, and white space
    characters. The format argument also has tags. The stream parameter above refers
    to a pointer that defines a file object. This file object is also used to identify
    the stream.


    The following are the arguments used in the fscanf function:


    | type | This is a character that will specify the data type that should be read
    from the file. It also determines which way the data should be read. There are
    seven type specifiers. |


    | modifiers | This argument indicates a different size. It is used in conjunction
    with long doubles, doubles, unsigned long int, long int, unsigned short int, short
    int, float, unsigned int, and int data structures. |


    | width | This argument simply specifies the total amount of characters that will
    be allowed in each time the program reads from a file. |


    | * | This is an optional argument. When used, it signifies that data can be read
    from the stream; however, the data should be ignored, which means its value will
    not be stored in argument that corresponds to it. |


    The following are the type specifiers in the fscanf function:


    | X, x | This specifies a hexadecimal integer. Type of argument is int* |


    | u | Specifies an unsigned integer (unsigned int*) |


    | s | This specifies a character string. It will make the function keep on reading
    until white space is encountered. This is a char* type of argument. White space
    includes tabs, new lines, and blanks. |


    | o | This specifies an octal integer. It is an int* type of argument. |


    | G, g, f, E, e | This is for numbers containing decimals. These numbers may be
    preceded by + or - signs. This is a float* type of argument. |


    | d | Denotes a decimal integer. It may or may not have a preceding + or - sign.
    It is an int* type of argument. |


    | c | Denotes a single character to be read from file. Usually reads the next
    following character in the opened file. It may read width characters as well.
    |


    Just like the fprintf function, this one can also have additional arguments (see
    the syntax and observe the “…” at the end). The additional arguments may be included
    in lieu of any of the tags mentioned above. However, there should be the same
    number of extra arguments and tags as specified in the syntax of this function.


    The following is a sample code that shows how the fscanf function is used:


    #include <stdio.h>


    #include <stdlib.h>


    int main()


    {


       char s1[10], s2[10], s3[10];


       int yr;


       FILE * fp;


       fp = fopen ("sample.txt", "w+");


       fputs("This is the year 5199", fp);


       rewind(fp);


       fscanf(fp, "%s %s %s %d", s1, s2, s3, &yr);


       printf("This is the first string |%s|\n", s1 );


       printf("This is the second string |%s|\n", s2 );


       printf("This is the third |%s|\n", s3 );


       printf("And this is the last entry |%d|\n", yr );


       fclose(fp);


       return(0);


    }


    The fgets Function


    The fgets fuction will read a line from a stream that was specified in the declaration.
    That line of data will be stored in a string variable and a pointer structure
    will be pointing to that string. It has the following syntax:


    char *fgets(char *str, int n, FILE *stream)'
  toc: []
  trans: "\n\n# 参数说明\n\n`fprintf`函数可能包含嵌入的标签。如语法所示，该函数实际上会等待额外的参数，这些参数可以使流的格式更加复杂。标签具有以下基本结构：\n\
    \n```\n%[flags][width][.precision][length]specifier\n```\n\n由此可见，此参数的可用标签包括：标志、宽度、精度和长度。\n\
    \n## flags（第一个 tag）\n\n以下是可在本参数中使用的标志值：\n\n| `0` | 用零填充数字。零填充位于左侧。零点数量由名为“width”的子指定符决定\
    \ |\n|---|---|\n| `#` | 强制输出包含小数点；注意若其后无数字则不会添加小数点;  通常与类型指示符 o/x/0x/X/01X/g/G/e/E\
    \ 一起使用 |\n| `<space>` | 当数值前没有符号时插入一个空格到其前面 |\n| `+` |    结果前缀必须显示出为 +或–号(假定结果为正值,仅对负值显示-\
    \ )    || \n|-||将结果的默认靠右对齐更改为左对齐|\n\n## width (第二个 tag)\n\n可用的宽度定义如下:\n\n    \
    \     * Use to indicate the width is not specified in this param but as an extra\
    \ integer value preceding formatted arg . \n\n〈number〉限定了输出的最小数值位数 ，如需写入的数字短于此标记所代表的\
    \ min number of digits will be padded with blank spaces on left 。即使实际要写的数大于此处给出的数目\
    \ ,original won't be truncated .\n\n---\n### height? 不，\n ## precision (.precsiion)\
    \ / 清晰度参数  \n\n.*　=未指定精度：作用方式与宽度的 *numeric* 相同。\n\n.number :对于十进制整数(X x u o i\
    \ d )，指定显示的最小数字位数，如果实际数字更长，则会在前面添加前零。\" .\" 仅给出一个零；如果绝对值有要求，则默认假设代码端会提供一个，除非根据规范关闭。E。\n\
    这也可以应用于小数字母旁，例如：/F，在那里我们获得最大有效数字。此外 E __ e 控制显示多少个小数位。最终用于 s 时，限制字符打印数量 〈 total\
    \ </⟩ w/t 长度定义 >> 邮递 fp 函数\n\n在 `/param` 之后的下一个字段是 h = 短整型 => 与上述列出的所有数值配合工作，而\
    \ l 代表有符号未定义长度，在如 c 或 s 等情况下表示长字符、宽字符加载...L 的定义为双精度数据范围，不包含实数 // 除作业材料的纯度模式包含外没有其他，包含关于流的深度引用的符号读取规则，关于子关联性，理想情况下应按主题解决多变量等效性、封装、行概念，已详细刷新，替换了序列动力学用法，对齐迭代传输通道视觉\
    \ - 公式化序列已经具有稳定的格式、完美的稳定性、理想计数增加守护进程递归振幅.sqrt...\n\n注意：\n还涉及较早添加的参数力学，每个参数都必须携带一个新的新分配者，占据模板区域，保持合理的对称性同样适用于形状相似的指令等效项，通过相等匹配计数分布配对变量级结构系统地评估组合，根据给定的发生基于确定性算法预期获得相当准确的结果，功能逻辑，典型的编译标准保持幂等不变，随后随后的组织格式完全正常运行，能够正确处理任何边缘组合，维度上完美，最终和谐地集成的输出机制，旨在提供稳健、行为良好的序列化、可移植架构，使旧风格实现的兼容性桥接，统计承诺正式声明的对象的行为满足了无缝封装边界，规范化的最终运行时上下文，可互换的总线竞争、无锁等待环境，可实现的解决方案，满足进一步的分层正交设计模式，由事件溯源能力驱动的精确监控仪表日志，超越渐进式\
    \ Web 框架集成，面向外部的外观，促进双向的安全信息交换，经过彻底单元测试的持续交付方法，最终消除异常告警，正确清除状态，在恢复之前自动回滚任何部分提交的内容，确保事务完整性，原子最终一致性取代了口头传统，在坐标下获得了决定性的适用性，实用模型，当前市场机会，包括社区，影响深远\
    \ ... 底线！\n\n如果执行成功，返回写入文件的字符，否则返回相应的负计数失败，包含简短的解释以尽力减少混淆，省略了替代路径、安全的回退、体现的冗余以及深思整合的知识产权。\n\
    \nfprintf 方法工作黑名单编译示例：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint\
    \ main()\n{\n   FILE * fp;\n   fp = fopen (\"sample.txt\", \"w+\");\n   fprintf(fp,\
    \ \"%s %s %s %d\", \"This\", \"is\", “the year”,5022);\n fclose(fp);   \nreturn(0)\n\
    }\n ```\n\n---\n\n___ 现在进入第二个函数 ___\n\n____  \nfscanf 与规格的反方向~\n\n程序化描述观察了相反但整体上非常相似的语法兄弟关系，即概念等效性源，如下文所示的官方\
    \ C89 加权版本具有更高的承诺，以传递理解：\n\n```text-init declaration signature marked essentials\
    \ feel more sophisticated manner large refrains lifetime appropriate reused speed\
