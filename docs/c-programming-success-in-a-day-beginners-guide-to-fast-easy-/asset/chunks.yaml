    \ Remember that this book only covers the basics which will serve as a foundation\
    \ to help you master the language and move on to more complicated programming\
    \ methods.\n\nChapter 9: File Handling – Creating and Opening Files\n\nCreating\
    \ files that can be saved on a storage device (such as a hard drive, a USB pen\
    \ drive, or some other external storage) will greatly enhance your programming\
    \ skills. It increases the usefulness of any software system that you create.\
    \ A lot of computer programs make use of files for a lot of different reasons.\
    \ Files can serve as records of the processes that have been performed by a program\
    \ you wrote.\n\nThe C programming language allows you to create a file, open any\
    \ file that exists on storage, read the data stored in those files, write any\
    \ necessary data into said files that have been opened, and close a file after\
    \ all processes have been performed. This programming language allows your programs\
    \ to handle both binary files (i.e. system oriented data) as well as text files\
    \ (i.e. stream oriented data).\n\nSystem Oriented vs. Stream Oriented Data Files\n\
    \nText data files are usually called stream oriented data while binary files are\
    \ also called system oriented data. Sometimes you get to wonder how these two\
    \ terms differ. The following are quick and easy definitions:\n\nStream oriented\
    \ data in C language refers to any form of data that is stored just the way you\
    \ see it on a console (i.e. your computer screen). When you use this type of data\
    \ file everything else takes place automatically. This means that data conversions,\
    \ buffering, as well as input and output operations become automatic.\n\nSystem\
    \ oriented data on the other hand doesn’t work that way. Files or data that is\
    \ system oriented are the ones that an operating system usually works on. Well,\
    \ they’re called binary files simply because you’re dealing with strings of ones\
    \ and zeroes. This type of data is usually stored first in a computer’s memory.\
    \ This type of data doesn’t have to be translated into text for it to be stored\
    \ on your hard drive or external storage.\n\nFile Creation and Manipulation Process\
    \ in C Language\n\nThere are five steps in order to create, access, and make changes\
    \ to files that are kept in storage. They are the following:\n\n1.  Use a pointer\
    \ variable to declare a file.\n\n2.  Open the created or a file that is already\
    \ on disk. The fopen library function is used just for that.\n\n3.  Use any suitable\
    \ function in order to manipulate and process the data stored in a file (or files).\
    \ You will need to use read and write functions in this step.\n\n4.  Close the\
    \ file. To close a file, use the fclose() function.\n\nFunctions in C That You\
    \ Can Use for File Handling\n\nThe following are the functions that you can use\
    \ in order to handle a file. Note that a lot of these are input and output functions.\
    \ There is no need to use any other header since these functions are all available\
    \ in the standard input/output library (i.e. stdio).\n\n*   fopen – This is used\
    \ to open a file.\n\n*   feof – This function is for the end of file marker.\n\
    \n*   fputs – This one is used to write a character string.\n\n*   fgets – This\
    \ one reads a character string.\n\n*   fscanf – This is the function used for\
    \ any formatted input coming from a file.\n\n*   fprintf – This one is for writing\
    \ or saving any formatted output to a file.\n\n*   putw – This one is used to\
    \ write an integer to a file.\n\n*   getw – This is the function you’ll use to\
    \ read integers.\n\n*   putc – This one is used to write a character instead of\
    \ a string.\n\n*   getc – This one is used to read a character instead of a string.\n\
    \n*   fclose – This one is the opposite of the fopen function – it closes a specified\
    \ file.\n\nThe fopen Function in C\n\nIt is obvious that you cannot read data\
    \ from or write data to a file that doesn’t exist. In C language and other programming\
    \ languages out there, you also need to open a file that already exists in storage\
    \ first before you can make use of any data stored in it. In order to perform\
    \ both functions, you will need to use the fopen function.\n\nThe syntax for this\
    \ function is as follows:\n\nfile *fopen( const char * filename, const char *\
    \ mode );\n\nThat is the the standard syntax you’ll find in many documentations\
    \ and program code in C language. The following are the parameters used in the\
    \ above mentioned syntax:\n\n*   filename – This part of the syntax will be a\
    \ literal string argument. You will be specifying a specific directory where the\
    \ file is located, so to speak. Consider the following sample:\n\nfp=fopen(\"\
    c:\\\\sample.txt\", \"r\");\n\nNote that you need to use double backslashes (i.e.\
    \ “\\\\”) to identify a directory. In the example above, you’re referring to the\
    \ root directory of a drive “c:” which is where the sample.txt file is located.\
    \ Don’t worry too much about the double backslashes; that’s just the way C language\
    \ handles quoted strings. It basically helps compilers distinguish this code with\
    \ the “\\” key.\n\n*   mode – This is the argument that will define the type of\
    \ access mode.\n\nThis function uses a pointer data structure (please review the\
    \ discussion of pointers mentioned in this book if needed). It points to a file\
    \ that needs to be opened or a file that will be created. Given the syntax of\
    \ the fopen function, you can see that it gives a value to the pointer which points\
    \ to a file. This pointer allows the program to keep track of the file being used.\
    \ Think of it as a type of memory address that identifies the existence of a file.\
    \ Once the file is opened, the FILE pointer will allow the compiler to perform\
    \ various functions. The program can then perform both read and write functions\
    \ on the file that was opened.\n\nAccess Modes\n\nAs you can see from the code\
    \ above, there is a second argument in the syntax of the fopen function. That\
    \ second argument refers to the access mode that fopen() will use. The syntax\
    \ will only accept six possible entries, which are the following:\n\n| a+ | This\
    \ access mode opens a file that already exists in the drive path expressed in\
    \ the first argument. If that file does not exist then this function will create\
    \ the file using the name provided in the “filename” argument. This also means\
    \ that reading any data will begin at the start of the file but any data to be\
    \ added can only be appended at the end. |\n\n| w+ | This mode also creates a\
    \ file if it does not yet exist in the drive path provided in the initial argument.\
    \ It also opens any existing file both for reading and writing data. If the file\
    \ already exists in the drive, any data contained in it will be erased when you\
    \ use this switch. |\n\n| r+ | This switch will open a file that is already on\
    \ the drive for reading and writing. |"
