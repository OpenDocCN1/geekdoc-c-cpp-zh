    The closegraph Function in C


    So far, you’ve seen the glosegraph() function several times now. Well, here’s
    a short explanation what it is for. This function simply closes the graphics mode
    that was initialized by the initgraph() function. This same function also frees
    up the memory that have been allocated by the graphics system. It also restores
    the screen mode to the original mode. The syntax is simple since all you have
    to do is to declare the following:


    closegraph();


    And that’s pretty much it. Remember that you should include a closegraph() at
    the end of your graphics code. You can check out the previous code above to see
    how this function is used.


    The circle Function in C Language


    Since you have already seen how the arc function works, then you ought to know
    how the circle function works. You can’t always use the arc function to create
    circles in C programming. This library function has the following syntax:


    circle(int x, int y, int radius);


    The x and y integers in this syntax provides the center of the circle. The last
    parameter in this function indicates the length of the radius. If you notice,
    the syntax of this function is kind of reminiscent of the formula for a circle
    in geometry.


    The following is a sample code to draw a circle in C language:


    #include<graphics.h>


    #include<conio.h>


    main()


    {


       int mydriver = DETECT, mymode;


        initgraph(&mydriver, & mymode, "c:\\tc\\bgi");


        circle(50, 50, 100);


        closegraph();


       return 0;


    }


    The bar Function in C


    This function draws a rectangle on the screen. The bar is two dimensional and
    it is filled. It has the following syntax:


    bar(int left, int top, int right, int bottom);


    As you can see in the syntax or declaration, this function requires both the bottom
    right corner and the top left corner of the rectangle. Remember that this rectangle
    will be filled. The current fill pattern will be used. Note that you can change
    the default fill pattern and fill color as well. To do that you need to use the
    setfillstyle() function


    #include <graphics.h>


    #include <conio.h>


    main()


    {


       int mydriver = DETECT, mymode;


        initgraph(&mydriver, &mymode, "C:\\TC\\BGI");


        bar(50, 50, 120, 120);


        closegraph();


       return 0;


    }


    The setfillstyle Function


    As stated earlier, this function changes both the fill pattern as well as the
    fill color used by other functions. It has the following syntax declaration:


    setfillstyle( int pattern, int color);


    This function has two parameters. The first one is for the fill pattern while
    the second one is for the fill color. The following are the different fill styles
    that you can use:


    *   USER_FILL


    *   CLOSE_DOT_FILL


    *   WIDE_DOT_FILL


    *   INTERLEAVE_FILL


    *   XHATCH_FILL


    *   HATCH_FILL


    *   LTBKSLASH_FILL


    *   BKSLASH_FILL


    *   SLASH_FILL


    *   LTSLASH_FILL


    *   LINE_FILL


    *   SOLID_FILL


    *   EMPTY_FILL


    The following is a sample code that uses the bar function. Note that you can change
    the values of the parameter for pattern. Experiment on the different fill patterns
    to see how each one of them behaves.


    #include <graphics.h>


    #include <conio.h>


    main()


    {


       int mydriver = DETECT, mymode;


        initgraph(&mydriver, &mymode, "c:\\tc\\bgi");


        setfillstyle(XHATCH_FILL, red);


        bar(50, 50, 120, 120);


        closegraph();


       return 0;


    }


    The bar3d Function


    The bar3d function has the following syntax:


    bar3d(int left, int top, int right, int bottom, int depth, int topflag);


    As you can see, its syntax is pretty much the same as the one for the bar function.
    It has two additional arguments, though. Depth returns an int value that will
    specify the bar’s depth. The last argument, topflag, is used to determine whether
    a three dimensional top should be placed on the bar or not. Note that this function
    will make use of the current fill pattern and fill color, which can be adjusted
    as well.


    The following code shows how to use the bar3d function:


    #include<graphics.h>


    #include<conio.h>


    main()


    {


       int samk1 = DETECT, samk2;


       initgraph(&samk1, & samk2, "c:\\tc\\bgi");


       bar3d(98, 98, 120, 120, 10, 1);


       closegraph();


       return 0;


    }


    The ellipse Function


    The ellipse function has the following syntax or declaration:


    ellipse(int x, int y, int stangle, int endangle, int xradius, int yradius);


    This function is used to draw an ellipse at the coordinates x and y, which is
    the center of the figure. Just like the arc function, it has a start angle and
    an end angle. The last two parameters of this function indicate the horizontal
    and vertical radius of the ellipse that will be drawn.


    The following is a sample code that demonstrates the use of the ellipse function:


    #include<graphics.h>


    #include<conio.h>


    main()


    {


       int samk1 = DETECT, samk2;


       initgraph(&samk1, & samk2, "c:\\tc\\bgi");


       ellipse(45, 45, 0, 360, 75, 35);


       closegraph();


       return 0;


    }


    The fillellipse Function


    An alternative to the ellipse function is the fillellipse function. It has a simpler
    syntax, though the parameters sort of look alike. Try both the ellipse and the
    fillellipse functions to see how each would display on the screen. The fillellipse
    function has the following syntax:


    fillellipse(int x, int y, int xradius, int yradius);


    As usual, the x and y values denote the center of the ellipse and the two remaining
    parameters denote the radii of the ellipse. Try the following sample code and
    change the values to see what happens to the object on the screen.


    #include <graphics.h>


    #include <conio.h>


    int main()


    {


       int samk1 = DETECT, samk2;


      initgraph(&samk1, & samk2, "c:\\tc\\bgi");


      fillellipse(75, 75, 35, 23);


       getch();


      closegraph();


      return 0;


    }


    The cleardevice Function


    The syntax for this library function is as follows:


    cleardevice();


    This function simply clears your screen of any graphics that are displayed. It
    also sets the position of the coordinates at (0,0). The screen is also filled
    with the background color that is currently being used.


    The following code will show what happens if you use the cleardevice() function:


    #include <graphics.h>


    #include <conio.h>


    main()


    {


       int samk1 = DETECT, samk2;


       initgraph(&samk1, & samk1, "c:\\tc\\bgi");


       outtext("To clear screen, press a key");


       getch();


       cleardevice();


       closegraph();


       return 0;


    }


    To make the code more interesting, you can draw any of the objects that we have
    already covered (circle, ellipse, bar, etc.) and then use the cleardevice function
    to clear the screen. Make sure to add a getch() line before cleardevice(). Now,
    even though this function acts a lot like the clrscr() function, you shouldn’t
    use that in graphics mode.


    The floodfill Function


    There are times when you just need to fill a certain section or figure in the
    screen. You can do that using the floodfill function. Just make sure that the
    area you intend to fill is enclosed or else the colors will flood and wreak havoc
    on the screen. This function also uses the current fill color and fill style,
    which you can modify using the setfillstyle function. The floodfill function has
    the following syntax:


    floodfill(int x, int y, int border);


    The x and y parameters will be used to determine the coordinates on the screen.
    You can call that as the target area or the starting area that should be filled.
    The last parameter, border, is used to specify the color of the boundary. The
    following is a sample code that uses the floodfill() function.


    #include <graphics.h>


    #include <conio.h>


    main()


    {


       int samk1 = DETECT, samk2;


       initgraph(&samk1, & samk2, "c:\\tc\\bgi");


        setcolor(RED);


       circle(75,75,100);


       floodfill(75,75,RED);


       getch();


      closegraph();


      return 0;


