    return 0;


    }


    The main difference here is that instead of just having the cycle loop until one
    guesses the number, the user now has a limited number of chances to guess the
    magic number because of the do while statement.


    The Break and Continue


    Another looping method you can use in C is known as the break and continue. Take
    a look at the following example.


    #include<stdio.h>


                  int main()


                  {


                                     int i;


                                i = 0;


                                while ( i < 20 )


                                     {


                                          i++;


                                          if ( i == 10)


                                               break;


                                     }


                                     return 0;


                  }


    This represents the basic syntax of a break. You will notice that it is inside
    a loop in itself. In most cases, the break and continue method is mostly considered
    as a way to break out of loops instead of creating them.


    The main premise of the loop shows that the program will continue to operate as
    long as the value of i is lower than twenty. Based on the way that the program
    has been designed, that might take a while. In order to break from the loop and
    give a sense of termination to the program, another if condition will be used.


    if ( i == 10)


    break;


    This snippet of code will terminate the program because it adds another condition
    that stops the operation of the code.


    Chapter 5: Pointers, Arrays


    Now that you’re getting closer to fully understanding how C programming works,
    it’s time that you get acquainted with the more complicated elements that give
    C language the dynamic range it provides many programmers.


    Pointers


    In the realm of C language, pointers are considered as valuable pathways to memory
    banks of data and other variables that programmers need to access several times
    within the code. In other cases, pointers can direct the machine to repeatedly
    access a certain set of data and use them again and again without having to write
    down the individual elements within the code. Think of them as shortcuts to already-stored
    memory within your code.


    Instead of using functions in order to work, pointers are used with two symbols:
    the asterisk (*) and the ampersand (&).


    Take a look at the following example:


    #include <stdio.h>


    int main()


    {


       int* pc;


       int c;


       c=22;


       printf("Address of c:%d\n",&c);


       printf("Value of c:%d\n\n",c);


       pc=&c;


       printf("Address of pointer pc:%d\n",pc);


       printf("Content of pointer pc:%d\n\n",*pc);


       c=11;


       printf("Address of pointer pc:%d\n",pc);


       printf("Content of pointer pc:%d\n\n",*pc);


       *pc=2;


       printf("Address of c:%d\n",&c);


       printf("Value of c:%d\n\n",c);


       return 0;


    }


    You will notice that the function int under the line of code containing “main”
    is immediately followed by an asterisk. By doing so, you have designated the variable
    pc as a pointer.


    Running this program will show you sets of information pertaining to the addresses
    and the values for both the variables pc and c. In the middle of each set, new
    statements are made to show what kind of relationship lies in between the two
    variables.


    Address of c: 2686784


    Value of c: 22


    Address of pointer pc: 2686784


    Content of pointer pc: 22


    Address of pointer pc: 2686784


    Content of pointer pc: 11


    Address of c: 2686784


    Value of c: 2


    This is what the earlier source code will generate. Take note that the address
    of both c and pc do not change. This is because memory addresses used in code
    do not necessarily have to change, only the content of the memory address changes.


    If you’ll notice in the earlier sections of the code, the value of the variable
    c was declared to be 22\. That is why the first set of displayed lines of the
    program will show the address of the variable c and the actual content which is
    22.


    printf("Address of c:%d\n",&c);


       printf("Value of c:%d\n\n",c);


    Take note that in order to show the memory address of the variable c, you would
    have to precede it with the ampersand, right after the %d and quotation marks.
    Since the variable c was not listed as a pointer, the machine had no other choice
    but to show the direct memory address of the variable.


    pc=&c;


       printf("Address of pointer pc:%d\n",pc);


       printf("Content of pointer pc:%d\n\n",*pc);


    On the other hand, by declaring pc as a pointer by adding an asterisk, you can
    use it to refer to another value. In the example above, after declaring pc as
    a pointer, the value of pc was set as “&c” in the line pc=&c. By doing so, referring
    to *pc in any other line of code would access the memory address of the variable
    pc. Since the content of the memory address was a referenced as &c, then the value
    of c would show, which was 22\.


    Another thing to note is that in order to get the address of pc, you didn’t have
    to use ampersand. This is because you’ve already designated the variable pc as
    a pointer by using an asterisk whereas the variable c was not declared as a pointer.


       *pc=2;


       printf("Address of c:%d\n",&c);


       printf("Value of c:%d\n\n",c);


    This particular line of code changes the content of the memory address. Here you
    see that the variable pointer pc now has a specific value assigned to it. Since
    the value of “pc” was just set to “&c” and “*pc” was set to 2, the machine will
    still use the same memory address for the variable c but will find another value
    instead of 22\. This is because the value of the pointer pc was changed. That
    would also change the value of c, which was what *pc was originally pointing to.


    Arrays


    Think of Arrays as an extension of pointers. With pointers, you are only using
    one variable as a memory address. This limits the amount of things you can reference
    in your code. With arrays, you have larger sets of data to play around with. That
    will come extremely handy when dealing with large and complex programs.


    Arrays are divided into two main categories: one-dimensional and multi-dimensional
    arrays. Fortunately, you can declare the presence of an array in your code the
    same way that you declare variables, with a slight addition:


    int sample_array[array_size]


    This line of code will introduce the set of data you plan to use for your code.
    You will start with the int function and then name your array. Follow that with
    square brackets that enclose how many pieces of data your set contains.


    After you name your array, you will have to list the elements that are inside
    this array. It can be done like this:


    int sample[5] = {1000.0, 2.0, 3.4, 7.0, 50.0};


    Start with a curly brace and then enumerate each element of your array. Separate
    each entry with a comma and end with another brace. Each element in that array
    will be assigned with a specific position. This will give each element a unique
    identifier that you can access within your code.'
