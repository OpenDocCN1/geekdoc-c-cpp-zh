  raw: 'One way to make use of arrays in your programs is by having the user dictate
    the content of your array. Take a look at this example:


    #include <stdio.h>


    int main(){


         int marks[10],i,n,sum=0;


         printf("Enter number of samples: ");


         scanf("%d",&n);


         for(i=0;i<n;++i){


              printf("Enter value of sample%d: ",i+1);


              scanf("%d",&marks[i]);


              sum+=marks[i];


         }


         printf("Sum= %d",sum);


    return 0;


    }


    Running this source code will prompt the user to first indicate the number of
    samples they’re working with. After determining the number of samples, the user
    is asked to assign a value to each sample. Once the user has assigned a value
    to all of the slots in the array, the program automatically adds all of the values
    together and presents the sum.


    You will notice that the name of the array is “marks”. This identifies the array
    as it is to be used within the rest of the code. It is followed by the maximum
    number of allowable entries it can handle. Despite asking the user to determine
    the size of their array, it is important to declare the limit so that the code
    does not return any errors.


    for(i=0;i<n;++i){


              printf("Enter value of sample%d: ",i+1);


              scanf("%d",&marks[i]);


    In this bit of code from the example, you will notice the “for” loop method being
    used to avoid an infinite number of entries requested from the user. The block
    of code under this loop is the portion that asks the user to input the values
    of the array that they want to use.


    Multi-dimensional Arrays


    The earlier example of an array was linear. Imagine having the machine lay out
    all the data you’ve set in front of you in a straight line. That is why it’s called
    linear.


    On the other hand, multi-dimensional arrays set your data across more than one
    dimension and creates a sort of “table” of data to present when the source code
    is compiled. Take a look at this example.


    #include <stdio.h>


    int main()


    {


      int x;


      int y;


      int array[8][8];


      for ( x = 0; x < 8; x++ ) {


        for ( y = 0; y < 8; y++ )


          array[x][y] = x * y;


      }


      printf( "Array Indices:\n" );


      for ( x = 0; x < 8;x++ ) {


        for ( y = 0; y < 8; y++ )


        {


            printf( "[%d][%d]=%d", x, y, array[x][y] );


        }


        printf( "\n" );


      }


      getchar();


    }


    Notice that the declaration of the array has two sizes indicated. Both of the
    sizes have the same value set at 8. Each size represents the extension of that
    array in a particular direction, beginning horizontally and then vertically. This
    will generate a square composed of data entries from the array.


    for ( x = 0; x < 8; x++ ) {


        for ( y = 0; y < 8; y++ )


          array[x][y] = x * y;


    This block of code from the example shows a loop that works like a multiplication
    table. The machine multiplies the x and y variables until they reach a certain
    limit. This is also another application of the increment and decrement operatives
    from earlier.


    Chapter 6: P Strings, Structures, Unions and Typedef


    Now that you have a considerable amount of exposure to the coding programs using
    integers, it’s time to include characters into the mix.


    Similar to arrays , strings operate the same way, it’s just that they work with
    characters. This especially becomes useful when you need to have your user enter
    specific input into your program. Take a look at this example.


    #include <stdio.h>


    int main(){


        char name[30],ch;


        int i=0;


        printf("Enter name: ");


        while(ch!=''\n'')  


        {


            ch=getchar();


            name[i]=ch;


            i++;


        }


        name[i]=''\0'';     


        printf("Name: %s",name);


        return 0;


    }


    When this code is run, it will ask the user to enter a name. This could be any
    name as long as the amount of characters within that name does not go beyond the
    30-character limit. The declaration for the string is indicated as such:


    char name[30]


    You will notice that this is similar to the format of an array. Instead of using
    the usual int function, we use the char function which is also provided by the
    <stdio.h> derivative at the beginning of the code.


    You’ve also set a variable i to help count the number of characters. The increment
    operative indicated further below the code will limit the input and the while(ch!=''\n'')  
    portion will immediately grasp the user input as soon as they press the enter
    key. When this happens, the program will display the input on a separate line,
    minus some of the characters that have come after the user hit the space bar.


    An interesting feature of strings is the name[i]=’\0’ appearance near the end
    of the source code. This indicates a null set \o which is considered part of the
    string. This feature acts as a terminator for the set, meaning that there is nothing
    left that follows.


    Concatenate Strings


    The program above simply displays the content of the string that the user provides.
    This is a very simple yet somewhat meaningless thing to do. One way to add variation
    to this feature is by concatenating two strings. This is known as the process
    of combining two strings into one sequence. Take a look at the following example.


    #include <stdio.h>


    int main()


    {


        char s1[100], s2[100], i, j;


        printf("Enter first string: ");


        scanf("%s",s1);


        printf("Enter second string: ");


        scanf("%s",s2);


        for(i=0; s1[i]!=''\0''; ++i); 


        for(j=0; s2[j]!=''\0''; ++j, ++i)


        {


            s1[i]=s2[j];


        }


        s1[i]=''\0'';


        printf("After concatenation: %s",s1);


        return 0;


    }


    This program will ask the user to enter characters for two different sets. Once
    the user enters input for both sets, the machine puts them together in one sequence.
    You will notice that two strings have been put together in a single display line,
    as if completing a sentence. The machine will take the string input from both
    sources and lay them out in a linear fashion, similar to adding the two statements
    together.


    Structures


    Much of the content you’ve covered so far deals with sets of data an input of
    the same kind. Pointers and arrays are meant for integer-only groups while strings
    are for character-only sets of input.


    Structures, on the other hand, are used to contain data from different types of
    input for easier access within the code. A good application of such a function
    can be found when filling up a profile of a particular person. By using a structure,
    you can combine their age, address, name and other variables into one collective
    element to represent that person. Take a look at this example:


    #include <stdio.h>


    #include <string.h>


    struct Books


    {


       char  title[50];


       char  author[50];


       char  subject[100];


       int   book_id;


    };


    int main( )


    {


       struct Books Book1;       


       struct Books Book2;       


       strcpy( Book1.title, "C Programming");


       strcpy( Book1.author, "Nuha Ali");


       strcpy( Book1.subject, "C Programming Tutorial");


       Book1.book_id = 6495407;


       strcpy( Book2.title, "Telecom Billing");


       strcpy( Book2.author, "Zara Ali");


       strcpy( Book2.subject, "Telecom Billing Tutorial");


       Book2.book_id = 6495700;


       printf( "Book 1 title : %s\n", Book1.title);


       printf( "Book 1 author : %s\n", Book1.author);


       printf( "Book 1 subject : %s\n", Book1.subject);


       printf( "Book 1 book_id : %d\n", Book1.book_id);


       printf( "Book 2 title : %s\n", Book2.title);


       printf( "Book 2 author : %s\n", Book2.author);


       printf( "Book 2 subject : %s\n", Book2.subject);


       printf( "Book 2 book_id : %d\n", Book2.book_id);


       return 0;


    }


    The example above creates two separate structures, namely, Book1 and Book2\. You’ve
    also probably noticed a new directive included in the beginning of the code.


    #include <string.h>


    This line includes the <string.h> library into your code which will allow you
    to use the function “strcpy” which is a shorter version of string copy. Using
    this function tells the machine the obtain the data from a particular element
    within your structure when you need to reference it after your declaration.'
