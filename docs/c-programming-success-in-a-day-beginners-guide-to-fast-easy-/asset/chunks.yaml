  raw: '| a | This access mode also creates a file if it does not exist in the indicated
    drive path. However, this switch will only open a file for appending, which means
    any new data will only be added at the end of the file. |


    | w | This access mode only opens a file for writing. If the file does not exist
    in the drive, then a new file will be created. |


    | r | This access mode only opens an existing text file. |


    Errors and Possible Return Values


    As you write your codes in C language, you may sometimes enter the wrong switches
    or strings in either the “mode” or “filename” arguments. One common error is using
    a value for the access mode that does not create a file. Another possible error
    is when a user specifies a file name and your program tries to open it and doesn’t
    find in on the drive. Other errors can be caused by a write protected file and
    other possible conditions. If the file does not exist, an error occurs, or the
    process returns a failure then the fopen() function returns a NULL. However, if
    the function is a success, then it result in a file stream pointer.


    Here’s a sample code using fopen().


    #include<stdio.h>


    int main()


    {


        FILE *fp;


        fp = fopen("c:\\thisisatest.txt","w");


        return 0;


    }


    This example will create a file in the root directory of drive “c:” with a file
    name of thisisatest.txt. Since the code includes a “w” for the access mode then
    a new file will be created in case it doesn’t yet exist in the drive. The file
    that is opened or created will then be ready for writing new data.


    Chapter 10: File Reading and Writing Data


    You have seen how a new file is created in C language. Along with the sample codes
    provided and the syntax of the fopen() function, you have also learned how to
    open files for reading, writing, and appending. In this chapter we’ll look into
    the other file access functions included in the standard input/output library.


    Closing a File


    All files that have been opened needs to be closed. Remember that fopen() opens
    a memory stream and that needs to be released since it is a resource that should
    also be usable by other programs if it is no longer needed by the one you created.
    To release any memory stream opened by the fopen function, you should include
    an fclose function at the end of your code after all file processes have been
    completed.


    The fclose Function


    The fclose() function has the following declaration:


    int fclose( FILE * stream );


    If the fclose() function fails then it result in an EOF. If it is successful then
    it gives a 0 value.


    Here is a sample code that uses the fclose function.


    #include<stdio.h>


    int main()


    {


        FILE *fp;


        fp = fopen("c:\\thisisatest.txt","w");


        fclose(fp);


        return 0;


    }


    The getc() Function


    Another file handling function that was mentioned earlier was getc. This function
    reads one character from an already opened file. Note that the file should have
    been opened for reading. Note the following syntax:


    int getc( file *stream );


    If the function is successful then it returns the next object that is requested.
    It can also return an EOF, when all the characters in the stream have been accessed.
    It can also return an error in case it is unable to get a character or if something
    goes wrong during the process.


    The following is a sample code that uses the getc() function:


    #include<stdio.h>


    int main()


    {


      FILE *fp = fopen("samplefile.txt", "r");


      int samk1 = getc(fp);


      while (samk1 != EOF)


      {


        putchar(samk1);


        ch = getc(fp);


      }


      if (feof(fp))


         printf("\n this is the end of the file.");


      else


         printf("\n encountered error while accessing file.");


      fclose(fp);


      getchar();


      return 0;


    }


    The putc() Function in C


    You can say that the putc function is the opposite of the getc function. If getc
    reads a character from the specified stream then putc adds a character to the
    stream in the open file. This function has the following syntax:


    int putc( int char, file *stream );


    As you can see, this function has two arguments. The first one is for “char,”
    which is the character that will be written to the file. Note that this will be
    passed to the file in its int promotion.


    The other argument in this syntax is “stream.” It is a pointer – you should have
    guessed that correctly by now by simply looking at the syntax of the code. It
    identifies the stream where the character in the first argument (i.e. char) should
    be written.


    If the function results in an error then it returns an EOF. However, most of the
    time, it returns an unsigned character. Note that the character it will also be
    cast as an int.


    The following is a sample code that demonstrates the use of the putc() function:


    #include <stdio.h>


    int main ()


    {


       FILE *fp;


       int xy;


       fp = fopen("sample.txt", "w");


       for( xy = 33 ; ch <= 100; xy++ )


       {


          putc(xy, fp);


       }


       fclose(fp);


       return(0);


    }


    The getw Function vs. putw Function


    You can also write codes that will read and write integer data into files. The
    getw and the putw are two file handling functions in C that will perform the said
    operations. Writing integer data to file will require the putw function and reading
    integer data will require the getw function.


    The getw function has the following syntax:


    int getw( file * );


    This function, obviously, returns an integer value. It has a single argument,
    which is “file,” which actually indicates the location of the file that will be
    read by your program. The following is a sample code that illustrates how the
    getw function is used:


    void main()


    {


      FILE *fp;


      int x;


        fp = fopen("sampleintfile.txt","r");


        x = getw(fp);


        printf("%d",x);


      fclose(fp);


    }


    In this sample code, the integer value of the file sampleintfile.txt will be accessed.
    It will then be stored in an int variable called x. The value of x will be printed.
    There will be cases when the value of x will return a character when you use printf().
    The character of course is the ASCII value of the int. So, don’t be surprised
    if the output on your screen using the above code returns a letter or some other
    character. Check out its ASCII equivalent, that’s what the code is actually showing
    you.


    Moving on to the putw function; it has the following syntax:


    int putw(integer, file*);


    Unlike the getw function, putw has two arguments. The “integer” argument indicates
    the integer that will be written on the file. The second argument, file*, will
    indicate the location of the file where the new data should be added.


    As you can see from the declaration above, this function will return an integer.
    The following is a sample code that illustrates how the putw function is used:


    void main()


    {


        FILE *fp;


        fp=fopen("sampleintfile1.txt","w");


        putw(66,fp);


        fclose(fp);


    }


    Of course, you won’t see what actually happens since this code does not provide
    any output to the screen. What you can do to verify if your code was a success
    is to open sampleintfile1.txt and see if the value 66 was added. Another way to
    see if the code was a success is to add a printf to the code above so that the
    value of fp can be displayed on screen.


    The fprintf Function


    As stated in an earlier section of this book, fprintf returns a formatted output.
    The formatted output is actually sent to a stream data contained in the file.
    The syntax or declaration of the fprintf function is as follows:


    int fprintf ( file *stream, const char *format, ...)


    This function has two arguments and parameters. The first parameter in the syntax
    above is stream; it is a pointer data structure. It identifies the file object.
    The other parameter in the syntax above is “format.” Simply put, it is the text
    or the string that should be written to the indicated in the first parameter,
    i.e. stream.'
