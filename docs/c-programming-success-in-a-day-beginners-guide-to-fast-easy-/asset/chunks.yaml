  raw: 'To give you some sort of idea what these terms mean, a few short definitions
    will be included below. Note that some of these terms will be discussed at length
    in other places of this book.


    volatile


    This is used to define an object in the code that can be modified by computer
    hardware. The modifications have no specifics.


    void


    This term is used to indicate that functions in C language will not make use of
    arguments thus these functions will not return or provide any value.


    union


    This term indicates that variables of different types are classed or included
    within a single name.


    typedef


    This part of the code associates an identifier to a type.


    struct


    This creates a structure, which can be used to group together different variable
    types.


    static


    This declares a storage structure who’s value will not change for the entire duration
    of the program.


    register


    This defines a variable that is behaves faster compared to regular variables declared
    in C.


    sizeof


    This is used to measure the amount of bytes that are stored in a single object.


    return


    This is used to terminate the operation of functions in C. You will typically
    see this at the end of a code.


    unsigned, signed, long, and short


    These are type modifiers. They are used to define and alter fundamental data types.


    int


    This key word is used to declare a variable that contains integers.


    goto


    This is a rather common piece of code. You can find it in other programming languages
    as well (e.g. BASIC). This term makes the execution of the program to jump to
    a specific set of instructions or a different function or routine.


    for


    This is a reserved term that is used for program looping.


    extern


    This indicates or declares a variable that is outside of the current function.
    The variable that it creates can be modified by other functions in the code.


    enum


    This creates a type of integer data whose value is a constant.


    if - else


    This creates a conditional within the execution of a program. It allows the program
    to execute different commands depending on certain conditions.


    float, double


    These terms declare variables that are floating type numbers. The term float creates
    a single precision variable while double creates a double precision variable.


    do - while


    This also creates a loop in the program execution. However, it also includes a
    conditional statement. This means that a set of instructions or code will be executed
    while a certain condition remains true.


    const


    This makes the value of a variable or even the value of a pointer (will be discussed
    in detail later) to be unchangeable for the duration of the execution of the program.


    char


    This keyword is used to create a variable that will contain a character value.


    default, case, switch


    These statements are used to test the value of different expressions in the code.


    continue – break


    The term “break” is used to go out of a loop inside a code. The term “continue”
    is used to skip certain instructions inside a loop.


    auto


    This code indicates that a certain variable is local to a certain function within
    the code. Outside of that function and in other sections of the code, that variable
    will be meaningless.


    Identifiers in C Language


    When you write code in C, you will usually create data structures that contain
    different values. For instance, when you use int within a code, you are actually
    creating a variable (i.e. a data structure that changes value – just like in algebra)
    that will contain only integers. Here’s an example:


    int xy;


    int ab;


    In these two examples, the code is creating two variables – xy and ab. Both of
    these variables will contain whole numbers (i.e. integers). The terms xy and ab
    are called identifiers. Of course, programmers who write codes using C just can’t
    create any identifier. There are rules for creating these identifiers. They are
    the following:


    1.  You can use either upper case letters or lower case letters when making these
    identifiers. You can also use numbers to go with those letters. You can also add
    an underscore.


    2.  The first letter of an identifier must be either an underscore or a letter.
    In actual practice, almost all programmers avoid starting their identifier names
    with underscores since it can interfere with other processes when compiled especially
    when it comes to other system names.


    3.  Note that even though any identifier name can be any length, in principle,
    in actual fact compilers will only use up to 31 characters when processing identifier
    names.


    4.  You cannot use any of the reserved words and character sets in C language.
    The only special character you can use is an underscore.


    Chapter 2: The Data Types in C Language


    One of the many things that you will do when you code in C is to manipulate and
    make use of data. There are several types of data that can be used in this programming
    language. A data type can be a certain value or even a set of values. The programs
    you write will be more useful when they can make use, store, and organize data
    so that they will become useful to end users.


    Uses of Different Data Types


    Data types in this programming language can be used to identify different variables
    when they are declared. Variables will be discussed in detail later. Functions
    will be discussed later on and these functions will also return different data
    types that will be used in various parts of a program. Functions will also be
    discussed much later.


    Primary and Secondary Data Types


    There are primary and secondary data types in C. The primary data types are the
    following:


    *   Void


    *   Character


    *   Float


    *   Integer


    *   Double


    The secondary types of data in this programming language are as follows:


    *   Union


    *   Structure


    *   Pointer


    *   Array


    Note that there are also built-in data structures in C. They include both the
    primary and secondary data types mentioned above. They are called built-in simply
    because these data structures are already part and parcel of the C language library.
    The fundamental data types include pointer, float, double, char, int, and void.
    From these fundamental data types are formed the derived data types which include
    structure, string, and array.


    However, this programming language is also dynamic. Programmers can also define
    their own data structures. But that is more of an advanced topic, which you should
    learn after you have mastered the basics mentioned here in this book.


    The Fundamental Data Types


    The following are short descriptions of the fundamental data types. They will
    be discussed in greater detail in the other parts of this book. The definitions
    here will help you grasp the different notions used in C.


    | char *, float *, int* | These data types are used to identify a data type called
    pointers (will be discussed in detail later) |


    | double, float | These are used to denote floating point data |


    | char | This is used to designate a single character |


    | int | This is used to denote or declare integers (numeric data) |


    | void | This is data type that is used to denote no value |


    The following are called derived data types. You can say that a sequence of certain
    fundamental data types can be used to create derived data types. Consider the
    following definitions.


    | structure | This data type is a collection of variables that are related to
    one another. The variables may be of the same fundamental data type or it may
    consist of different fundamental data types. |


    | string | This data type is a sequence of different char data types. When you
    combine different characters and arrange them into a sequence then you have a
    character string. |


    | array | This data type can be arranged as a sequence or an entire table. It
    can contain different types of variables of the same fundamental data type. |


    You will learn other data types as you move on to other chapters of this book.


    Variables vs. Constants'
