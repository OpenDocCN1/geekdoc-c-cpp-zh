  trans: "\n\n| a | 这种访问模式如果在指定的驱动器路径不存在该文件，它还会创建一个文件。然而，此开关将仅以追加模式打开文件，这意味着任何新数据都将添加到文件末尾。\
    \ |\n\n| w | 此访问模式仅以写入模式打开文件。如果驱动器不存在该文件，将创建一个新文件。 |\n\n| r | 这种访问模式只打开已存在的文本文件。\
    \ |\n\n## 错误与可能的返回值\n\n当你用 C 语言编写代码时，有时可能会输入错误的开关或字符串参数（在 `mode` 或 `filename`\
    \ 参数中）。其中一种常见的错误是使用非创建文件的值作为所选的“访问”类型；另一种情况是给定的文件名在尝试通过跨驱动器的当前发现路径尝试不同方法时仍无法定位，并伴有与其他剩余条件相关的错误，如[写保护]等……如果通过调用函数打开失败：→那么返回的指针将等于\
    \ `NULL`（`fopen()` 返回 null）。相反，如果成功完成 → 通过相应处理这些新分配的流指针即可获得结果。\n\n以下是使用 `fopen()`\
    \ 的示例代码：\n\n```c\n#include<stdio.h>\n\nint main()\n{\n    FILE *fp;\n    fp =\
    \ fopen(\"c:\\\\thisisatest.txt\",\"w\");\n    return 0；\n}\n```\n\n此示例创建了一个名为“drive\
    \ c”的根目录位置，名称标识符为“thisistest.txt”。由于使用的切换参数包含字母 'w' => 因此不可避免的结果是，无论之前的存在状态如何，在准备好后续初始化写入之前都会构建必要的节点。\n\
    \n---\n\n# 第 10 章：文件读取/写入数据\n\n"
