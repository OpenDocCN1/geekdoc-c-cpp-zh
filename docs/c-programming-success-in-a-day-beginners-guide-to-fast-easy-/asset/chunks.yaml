    \n# \n\nIntroduction\n\nI want to thank you and congratulate you for downloading\
    \ the book, “C Programming Success in a Day – Beginners guide to fast, easy and\
    \ efficient learning of Cc programming”.\n\nC. is one of the most popular and\
    \ most used programming languages back then and today. Many expert developers\
    \ have started with learning C in order to become knowledgeable in computer programming.\
    \ In some grade schools and high schools, C programming is included on their curriculum.\n\
    \nIf you are having doubts learning the language, do not. C is actually easy to\
    \ learn. Compared to C++, C is much simpler and offer little. You do not need\
    \ spend years to become a master of this language.\n\nThis book will tackle the\
    \ basics when it comes to C. It will cover the basic functions you need in order\
    \ to create programs that can produce output and accept input. Also, in the later\
    \ chapters, you will learn how to make your program capable of simple thinking.\
    \ And lastly, the last chapters will deal with teaching you how to create efficient\
    \ programs with the help of loops.\n\nAnyway, before you start programming using\
    \ C, you need to get some things ready. First, you will need a compiler. A compiler\
    \ is a program that will translate, compile, or convert your lines of code as\
    \ an executable file. It means that, you will need a compiler for you to be able\
    \ to run the program you have developed.\n\nIn case you are using this book as\
    \ a supplementary source of information and you are taking a course of C, you\
    \ might already have a compiler given to you by your instructor. If you are not,\
    \ you can get one of the compilers that are available on the internet from MinGW.org.\n\
    \nYou will also need a text editor. One of the best text editors you can use is\
    \ Notepad++. It is free and can be downloadable from the internet. Also, it works\
    \ well with MinGW’s compiler.\n\nIn case you do not have time to configure or\
    \ install those programs, you can go and get Microsoft’s Visual C++ program. It\
    \ contains all the things you need in order to practice developing programs using\
    \ C or C++.\n\nThe content of this book was simplified in order for you to comprehend\
    \ the ideas and practices in developing programs in C easily. Thanks again for\
    \ downloading this book. I hope you enjoy it!\n\n# \n\nChapter 1: Program Structure\
    \ and Foundation\n\nWhen you look at the code used in C language, you will notice\
    \ that it is highly structured, which makes it a bit easier to understand. It\
    \ is actually a high level programming language, which means it uses some phrases\
    \ and words that may be familiar or meaningful to human readers. Dennis Ritchie,\
    \ the creator developed this programming language, he intended it to be a general\
    \ purpose language. Eventually, it was used to develop the UNIX operating system.\
    \ It was first implemented in 1972.\n\nThis means that all the Unix applications\
    \ and the entire operating system itself was built on the foundation of the C\
    \ programming language. Nowadays, this programming language is used to develop\
    \ many different applications.\n\nBenefits of Using C Language\n\nThe following\
    \ are some of the benefits that have been cited by experts and other programmers\
    \ who have used it:\n\n*   The code used for C language can be compiled on many\
    \ different computer systems. It is not restricted to one type of system only.\n\
    \n*   It is powerful enough to handle many low level computing activities.\n\n\
    *   The programs that have been developed using this language have proven to be\
    \ quite efficient.\n\n*   It is a structured language and you can easily decipher\
    \ the meaning of the code.\n\n*   Many new programmers have found that the C language\
    \ is really easy to learn.\n\nOf course, there are a lot of other interesting\
    \ facts about C language. It is the most widely used programming language to create\
    \ various systems. It is the next step from the B language (1970). The entire\
    \ language was formalized by ANSI (American National Standard Institute) in 1988.\n\
    \nC was initially designed to create operating systems. You have to understand\
    \ that that fact alone presents a lot of serious advantages. For one thing, the\
    \ code created using this language can run nearly as fast as some low level languages\
    \ such as Assembly Language. However unlike Assembly, C is better structured and\
    \ easier to learn even for anyone who has no background in programming. C language\
    \ has been used in the development of utilities, language interpreters, data bases,\
    \ more modern programs, network drivers, print spoolers, text editors, assemblers,\
    \ language compilers, and operating systems.\n\nCharacter Set and Reserved Words\n\
    \nC language uses a particular character set as well as other terms that are exclusive\
    \ to the operation of the code. Some of these terms are user supplied, which means\
    \ that the programmer has discretion on what terms to use for certain parts of\
    \ the code. However, there are key words and reserved terms that cannot be used\
    \ by a programmer since they provide a special meaning when they are compiled\
    \ or translated into computer executable code.\n\nThe following are the characters\
    \ that are allowed in C language: all upper case letters from A to Z, all lower\
    \ case letters from a to z, and all digits from 0 to 9.\n\nNote that there are\
    \ special characters in C language that may not be freely used by programmers.\
    \ These special characters have a different meaning in C language. The special\
    \ characters include the following:\n\n*   \\\n\n*   -\n\n*   |\n\n*   /\n\n*\
    \   *\n\n*   !\n\n*   ^\n\n*   \"\n\n*   }\n\n*   {\n\n*   &\n\n*   '\n\n*   [\n\
    \n*   ]\n\n*   %\n\n*   :\n\n*   $\n\n*   ;\n\n*   )\n\n*   (\n\n*   –\n\n*  \
    \ .\n\n*   >\n\n*   <\n\n*   ‘\n\nCharacters Used to Indicate White Space\n\n\
    White space such as form feed, carriage return, tab, new lines, and blank spaces\
    \ are also part of the language. They may be used with certain specifications.\n\
    \nKeywords\n\nAs stated earlier, there are certain terms that are important as\
    \ to how the code is executed. These certain key words may not be coined by programmers.\
    \ These are reserved terms and they have been defined by ANSI. They include the\
    \ following: int, while, auto, volatile, break, void, case, unsigned, char, union,\
    \ const, typedef, continue, switch, goto, default, struct, do, static, double,\
    \ sizeof, else, signed, enum, short, extern, return, float, register, for, and\
    \ long.\n\nNote that these terms do not yet include key words that are used in\
    \ other versions of C. Instance, Turbo C has these extra reserved terms: cdecl,\
    \ huge, near, pascal, interrupt, far, and asm."
