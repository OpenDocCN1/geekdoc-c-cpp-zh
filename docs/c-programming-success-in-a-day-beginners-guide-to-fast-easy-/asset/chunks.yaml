  raw: 'In this sample code, a circle will be drawn first. After that, floodfill will
    fill the circle with the current background color. The boundary of the circle
    will then be colored red. So, you end up with a circle filled with color with
    its perimeter colored red. Best practice is to use the same x and y coordinates
    of the figure you are intending to fill (well, so you won’t miss and mess up the
    fill colors).


    The getbkcolor Function in C


    This library function fetches the current background color in use. It has the
    following syntax/declaration:


    int getbkcolor();


    This function returns an integer for the corresponding background color (e.g.
    if it returns a value of 2 then the current background color is green).


    Note that not all of the graphics functions in C language have been covered here.
    Only the most basic ones have been discussed. If you have gained some interest
    in creating graphics using this programming language, then you may look for more
    extensive sources that have been dedicated to this very subject.


