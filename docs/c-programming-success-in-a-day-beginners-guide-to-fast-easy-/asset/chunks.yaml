  trans: "\n\n在这个示例代码中，首先会绘制一个圆。随后，`floodfill` 会用当前背景色填充该圆形。接着圆的边界会被染成红色。这样你最终得到一个内部被颜色填充、边缘为红色的圆形最佳实践是使用你要填充的图形的相同\
    \ x 和 y 坐标（嗯，这样就不会错过或搞乱填充颜色）。\n\n## C 语言中的 getbkcolor 函数\n\n这个库函数用于获取当前正在使用的背景色其语法声明如下：\n\
    \n```c\nint getbkcolor();\n```\n\n此函数返回一个对应于背景色的整数值（例如如果它返回值 2 则表明当前背景色为绿色）。\n\
