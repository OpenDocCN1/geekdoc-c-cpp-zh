    # Connecting things up with Interface Builder


    Back in Chapter 7, you worked a bit with Interface Builder to connect outlet values
    to their corresponding view elements. You are now going to have to trundle Interface
    Builder in order to connect ReturnViewController with the appropriate text field
    so that the connections are set for you at runtime. Here’s how the process works:


    +   1. In Xcode, open the Resources folder for your ReturnMe project in the Groups
    & Files listing on the left and double-click the ReturnMeViewController.xib file.

    Interface Builder opens on-screen, displaying the main window and the View window
    for inspection.

    2. Right-click the File''s Owner icon in the main window.

    A dialog appears, listing the various connections for File''s Owner.

    3. Select the text field and right-click on it.

    A pop-up menu appears, listing the text field''s connections. Under the first
    section, Outlets (expand if it is not expanded), you will see Delegate.

    4. Drag from the little circle next to the text field''s Delegate item listed
    Outlets in the pop-up menu to the File''s Owner icon in the main window, as seen
    in Figure 8-7.


    The File''s Owner (ReturnMeViewController) is now the delegate for the text field.
    (Want proof? Check the pop-up menu for the text field in Figure 8-8, which lists
    File''s Owner as the delegate under Outlets.)


