    # Navigating the navigation controller


    As the previous section made clear, to give users the option of returning to a
    view higher up in the hierarchy (in our case, the main view), table views are
    paired with navigation bars that enable a user to navigate the hierarchy. Here''s
    what you need to know to make that work:


    +   * The view below the Navigation bar presents the current level of data.

    * A navigation bar includes a title for the top level, a Back button appears if
    the current level is lower than the top level, the back on the left side of the
    bar; the user can tap it to return to the previous level, as shown in Figure 14-14.
    The text in the Back button tells the user which previous level was. In this case,
    it''s the application''s main view, so you will see the name — iPhoneTravel411

    * A navigation bar may also have an Edit button (on the right side) — used to
    enter editing mode for the current view — or custom buttons.


    In the case of your iPhoneTravel411 application, you''ll create a custom button
    — an additional back button. I explain why that is needed shortly.'
