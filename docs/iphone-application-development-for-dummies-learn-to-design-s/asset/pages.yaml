    # Other Runtime Considerations


    Launch, initialize, process, terminate, launch, initialize, process, terminate
    . . it has a nice rhythm to it, doesn''t it? And are the four major stages of
    the application''s life cycle. But life is not simple — and neither is. To mix
    up a bit, your application will also have to come to terms with interruptions
    and memory management.


    # Responding to interruptions


    Various events besides termination can interrupt your application to allow the
    user to respond — for example, including phone calls, SMS messages, calendar alerts,
    or the user pressing the Sleep button on an iPhone. Such interruptions may be
    only temporary. If the user chooses to ignore an interruption, your application
    continues running as before. If the user decides to answer the phone or reply
    to an SMS message, however, your application will be terminated.


    Figure 6-8 shows the sequence of events that occurs during the arrival of a phone
    call, SMS message, or calendar alert. Here''s what that looks like by step:


    +   1. The system detects an incoming phone call or SMS message, or a calendar
    event occurs.

    2. The system sends your application delegate the applicationResignActive: message.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_131_0.png)


    Because these interruptions cause a temporary loss of control by your application
    — meaning that touch events are no longer sent to your applications — it is up
    to you to prevent what is known in the trade as a "negative experience." For example,
    if your application is a game, you should pause the game.'
