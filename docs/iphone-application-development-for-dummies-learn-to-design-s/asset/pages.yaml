  md: '# Part I: Getting Started


    When you get to Paddington Station, you really don''t have a clue where the hotel
    that someone at the office booked for you might be. Touching Around, and the application
    allows you to use the hotel address that is in your iPhone Contacts, and gives
    you your options when it comes to finding that big, comfortable, English bed.
    This includes walking, taking a taxi, and public transit. You Touch Tube, and
    it directs you to the nearest Tube stop, and displays fares, schedules, and how
    to buy a ticket.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_31_0.png)


    Figure 1-1 The MobileTrain411 application can use your current location.


    How much of a fantasy is this?


    Not much. Except for automatically determining your location and giving you public-transit
    directions as well as real-time exchange rates (stuff I''ll be adding in the near
    future), this application already exists. What''s more, it took me a little more
    than two months to develop that application, starting where you are now, with
    no iPhone programming experience.


    # What Makes a Great iPhone Application


    You''ll find a lot of different kinds of applications on the iPhone, ranging from
    utilities like the Weather Application, to games, to The New Times reader, to
    the application I just described. Each of these applications falls on another
    continuum.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 1: Creating Killer iPhone Applications 11


    At one end of this continuum is what I think of as the mobile desktop. These are
    applications you might use if you''re using your desktop or laptop — applications
    you could port to (rewrite for) the iPhone. For example, I have a Weather Application
    on my MacBook Pro which I can read The New York Times as well — and it doesn''t
    take any major leap to see how one can do the Weather/New York Times thing on
    an iPhone. Although I wouldn''t think about writing this book on my iPhone, I
    can easily picture the iPhone as a handy home for note-taking applications, spreadsheet
    apps, and even stock-trading apps.


    At the other end of this continuum are applications that you would never want
    to do on the desktop (or even a laptop), because you don''t have the hardware
    or because, even if you did, doing it that way would be too inconvenient. Imagine
    being at Heathrow, dead tired, taking out your laptop in the middle of a crowded
    terminal, powering it up, and then navigating it with the touch pad to get the
    information I got easily while holding the iPhone in one hand. I want that kind
    of information quickly and conveniently: I don''t want to do my way through menus
    or layers of screens (or even going through the hassle of finding a wireless internet
    connection). Seconds count. By the time a road warrior tired to do this at Heathrow,
    I would already be on the Heathrow Express.


    I like to think of these kinds of applications as here-and-now applications. You
    want to do a specific task, with up-to-date information, which the iPhone can
    access over the Internet through a cell network or Wi-Fi connection. You may want
    the information or tasks tailored to where you are, which are the iPhone can determine
    with its location hardware.


    With all that in mind, I can think of two things that you need to consider — besides
    functionality, of course — when it comes to creating a great iPhone application:


    +   - Create a compelling user experience.

    - Exploit the platform.


    The next few sections dig a little into my Two-Part Rule of Great iPhone Applications.


    # Creating a Compelling User Experience


    The iPhone allows an immediacy and intimacy as it blends mobility and the power
    of the desktop to create a new kind of freedom. I like to use the term user experience
    as it implies more than a pretty user interface and nice'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 12 Part I: Getting Started


    graphics. A compelling user experience enables users to do what they need

    to with a minimum of fuss and bother. But more than that, it forces you

    think past a clean interface and even beyond basic convenience (such as not

    having to scroll through menus to do something simple). It meets-

    expectations of the user based on the context — all the stuff going

    around a user — in which they are using the application.


    A guidebook may have a great user interface, for example, but it

    may not give me the most up-to-date information, or let me know a tour of

    Parliament is leaving in five minutes from the main entrance. Without those

    touched touches, I''m just not willing to consider an app compelling.


    # Exploiting the Platform


    The iPhone''s unique software and hardware allow you to create an applic-

    tion enables the user to do something that is not practical, or even

    with a laptop computer. The iPhone is a smaller, mobile

    personal computer, it is not a replacement for one. It is not intended to produce-documents,
    proposals, or research. The iPhone has the capability to

    extension of the user, seamlessly integrated into his or her everyday life,

    and able to accomplish a singly focused task, or step in a series of tasks, in

    real time, based on where he or she is.


    # Device-guided design


    With the enormous capabilities of the iPhone make it possible to deliver the

    celling user experience, you must take into account the limitations of the

    device as well. Keeping the two in balance is device-guided design. The next

    two sections describe both the features and limitations of the iPhone — and

    how to take them into account as you plan and develop an application. But

    understanding these constraints can inspire you to create some really

    innovative applications. After a closer look at device-guided design, I come

    back to what makes a compelling user experience.


    # Exploiting the features


    One of the keys to creating a great application is to take advantage of what

    the device offers. In the case of a new platform with new possibilities, such

    as the iPhone, this is especially important. Think about the possibilities that

    up to you when your application can easily do the following:'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1: Creating Killer iPhone Applications 13


    +   * Access the Internet.

    * Know the location of the user.

    * Track orientation and motion.

    * Track the action of the user''s fingers on the screen.

    * Play audio and video.

    * Access the user''s contacts.

    * Access the user''s pictures and camera.


    # Accessing the Internet


    The ability to access Web sites and servers on the Internet allows you to create
    applications that can provide real-time information to the user. It can tell me,
    for example, the next tour at the Tate Modern is at 3 p.m. This kind of access
    also allows you, the developer, to go beyond the limited memory and processing
    power of the device and access large amounts of data stored on servers, or even
    overload the processing. I don''t need all the information for every city in the
    world stored on my iPhone or to strain the poor CPU to compute the best way to
    get somewhere on the Tube. A Web browser can send the request to a server and
    do all that work.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_34_0.png)


    This is client-server computing — a well-established software architecture where
    the client provides a way to make requests to a server on a network that''s just
    waiting for the opportunity to do something. A Web browser is an example of a
    client accessing information from other Web sites that acts as servers.


    # Knowing the location of the user


    The iPhone Operating System (OS) and hardware allow a developer to determine the
    device''s current location, or be notified when that location changes. As people
    move, it may make sense for your application to tailor itself to where the user
    is by moment.


    There are already iPhone applications that use location information to tell you
    where the nearest coffee house is, or even where your friends are. The MobileTravel411
    application uses this information to tell you the nearest Tube stop and give you
    directions to your hotel.


    Once you know the user''s location, you can put it on a map, along with other
    places he or she may be interested in. In Chapter 17, I will show you how easy
    that really is.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 14 Part I: Getting Started


    # Tracking orientation and motion


    The iPhone contains three accelerometers — devices that detect changes in movement.
    Each device measures change along one of the primary axes in three-dimensional
    space. You can, for example, know when the user has turned the device from vertical
    to horizontal, and change the view from portrait to landscape if it makes for
    a better user experience. You can also determine other types of motion such as
    a sudden start or stop in movement (think of a car accident or fall), or the user
    shaking the device back and forth. It makes some wavy-cool features easy to implement
    — for example, the Etch-A-Sketch method of shaking a device to reset it, and controlling
    a game by moving the iPhone like a controller.


    # Tracking the action of the user''s fingers on the screen


    People use their fingers, rather than a mouse, to select and manipulate objects
    on the iPhone screen. The moves that do the work, called gestures, give the user
    a heightened sense of control and intimacy with the device. There is a set of
    standard gestures — taps, pinch-close and pinch-open, flicks, and drags — that
    are used in the applications supplied with the iPhone.


    > TIP

    I suggest that you use only the standard gestures in your application. Even so,
    the iPhone''s gesture-recognition hardware and software allow you to go beyond
    standard gestures when appropriate. Because you can monitor the movement of each
    finger to detect gestures, you can create your own, but use that capability sparingly
    — only when it''s undoubtedly the right thing to do in your application.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_35_0.png)


    # Playing audio and video


    The iPhone OS makes it easy to play and include audio and video in your application.
