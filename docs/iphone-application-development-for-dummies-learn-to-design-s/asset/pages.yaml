    # Creating the Program Architecture


    Given the user interface I just described, how did I get from there to here?


    Keeping things at a basic level — a level that will be familiar to those of you
    who worked through the ReturnMe application — the MobileTravel411 is made up of
    the following:


    +   * Models Model objects encapsulate the logic and (data) content of the application.
    There was no model object in ReturnMeTo per se (although I opine on model functionally
    in Chapter 8). For iPhoneTravel411, I show how to design, implement, and use model
    objects.


    +   * Views Present the user experience; you have to decide what information to
    display and how to display it. In the ReturnMe application, there was a single
    content view with controls as subviews. Now, with the iPhoneTravel411 app, there
    will be a main view and several content views.


    +   * Controllers manage the user experience. They connect the views that present
    the user experience with the models that provide the necessary content. In addition
    (as you''ll see), controllers also manage the way the user navigates the application.'
  merge: -1
