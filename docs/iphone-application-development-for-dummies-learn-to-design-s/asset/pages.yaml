  md: '# Chapter 16: Creating Controllers and Their Models 333


    Yea! You''re done with all the tedium! Now let''s get on to the more interesting
    stuff.


    At this point, you have the classes defined for all of the view controller and
    model objects. All that''s left for you to do is to enter the code to do something
    — well, maybe not just *something*. How about *exactly* what you want to do?


    # Implementing the View, View Controller, and the Model


    You now have all the classes/objects you need to actually implement a map view
    similar to what you saw earlier on the left side of Figure 16-3.


    Check out the little things you need to do next.


    # Make sure the AirportController knows about the objects it needs


    Add the following statements to the AirportController.h (and all the other controllers
    you created) file.


    @class Destination;


    The compiler needs to know certain things about classes that you were using, such
    as methods you defined and so on, and the `#import` statement (.m) file generally
    solves that problem. But when you get into objects that point to other objects,
    you also need to provide information in the interface file, which can cause a
    problem if there are circular dependencies (which we avoid). I''m not going to
    get into that here; it''s beyond the scope of this book. To solve this problem,
    we introduce the `@class` keyword. This informs the compiler that `Destination`
    is a class name. At this point, in the interface file, that is enough for the
    compiler, but when you actually use the class (you create an instance of that
    class or send it a message for example), you''ll still have to do the `#import`.


    Add the following import statements to the AirportController.m file. (You''ll
    need to add at least `#import "Destination.h"` to all the other controller .m
    files and any other headers they need as well)'
