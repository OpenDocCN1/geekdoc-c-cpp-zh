  md: '# Chapter 13: Designing Your Application


    # Accessing the Internet


    Accessing the Internet allows you to provide real-time, up-to-date information.
    In addition, it enables you to transcend the CPU and memory limits of the iPhone
    by offloading processing and data storage to a server in the clouds.


    # Tracking orientation and motion


    Used extensively in games, or to enable a user to erase a picture or make a random
    selection by selecting the device, the accelerometers have potential in other
    kinds of applications. I recently saw one that alerts a company if its employees
    have a major change in acceleration. The change could mean any number of things
    — maybe they were driving too fast and suddenly stopped, or maybe just fell off
    a ladder and hit the ground.


    I leave it to you to debate the ethics and morality of these kinds of applications.
    But do they provide some food for thought on other application possibilities,
    and they certainly do get you some interesting context information about the user
    at a point in time.


    # Incorporating the device context


    Not only do you have to take into account the user context, but also need to take
    into account the device context.


    After all, the device is also a context for the user. He or she, based on individual
    experience, expects applications to behave in a certain way. As I explain in Chapter
    1, this expectation provides another perspective on why staying consistent with
    the user interface guidelines is important.


    +   **Limited screen estate:** Although scrolling is built in an iPhone and is
    relatively easy to do, you should require little scrolling as possible, especially
    on navigation pages, and especially on the main page.


    +   **Limitations of a touch-based interface:** While the Multi-Touch interface
    is an iPhone feature, it has its limitations. As a precise mouse pointer, and
    user interface elements need to be large enough and far away so that the user''s
    fingers can find their way around the interface comfortably. You can also do so
    much with fingers. There are definitely fewer possibilities with fingers than
    using the combination of multi-button mouse and keyboard.'
  merge: -1
