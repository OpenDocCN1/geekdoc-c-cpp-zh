  md: '# Chapter 12: Death, Taxes, and the iPhone Provisioning 249


    +   * Availability Date: When your application will be available for purchase.

    * Application Price: Free is easier, but later on I show you what you have to
    do if you want to get paid (a concept) for all the work you did getting your application
    to the public.

    * Localization: Additional languages (besides English) for your metadata. You
    can have your text and images in Italian all Italian-speaking stores, for example.

    * App Store Availability: The territories in which you would like to make your
    application available (the default is all counts supports).


    +   * Artwork: A picture is worth a thousand words, so the App store gives you
    the opportunity to dazzle your app''s potential users with some imagery.


    +   * iPhone/iPad touch Home Screen Icon: Your built application must have a 57x57-pixel
    icon included for it, following the procedure I showed back in Chapter 7. This
    icon will be displayed on the iPod touch or iPhone home screen.


    +   * Large Application Icon: This icon will be used to display your application
    on the App Storefront. It needs to meet the requirements:

    512x512 pixels (flattened, square image)

    72 dpi

    jpeg, or tif format


    +   * Primary Screenshot: This shot will be used on your application product page
    in the App Store.

    Apple doesn''t want you to include the iPhone status bar in your screenshot. The
    shot itself needs to meet these requirements:

    320x460 portrait (without status bar)

    480x300 landscape (without status bar) minimum

    320x480 portrait (full screen)


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_270_0.png)


    Up to four additional optional screenshots can be on the application product page.
    These may be resized to fit the space provided. Follow the same requirements as
    above.


    +   * Additional Artwork: (Optional) If you''re really lucky — (or good) — you
    may be featured on the App Store. Apple will want “high-quality layered artwork
    with a title treatment for your application,” which will be used in small posters
    to feature your application on the App Store.'
