    Originally I planning to stop here in the development of the ReturnMeTo application.
    But as I showed it on my iPhone to prospective users (okay, my friends with iPhones),
    they had a couple of suggestions that made me realize (after first arguing that
    it was okay the way it was) that I wasn''t done:


    +   - One suggestion was that you should be able to touch the phone number and
