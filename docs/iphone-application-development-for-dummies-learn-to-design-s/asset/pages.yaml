  md: '# Chapter 13: Designing Your Application


    # 271


    # No use reinventing the wheel


    To show you the proper (and far less work-intensive) way to think about it, I
    want to review what the models need to do.


    The models own the data and the application logic. In the MobileTravel411 application,
    for example, one model converts U.S. dollars to pounds (or any other currency)
    and vice versa. This kind of model is closely tied to the functionality of it
    supports. How Many Zimbabwean Dollars Can I Get For $2.75 (US) View requires a
    model that can compute exchange rates, and here''s where programming comes into.
    In the MobileTravel411 app, I have a Currency (model) object that knows how to
    compute exchange rates, and a VAT (Value Added Tax) object that does something
    similar. For each view like those I create a model object.


    When it comes to the Aruba Next View, though some approach holds, but not in an
    obvious way. You don''t need a weather object; here the model needs to really
    care about the weather; it really needs to have the logic to go out and get the
    data from a file, database, or server. For my purpose a model object that gets
    weather information and schedule is pretty much. For this object revolves around
    what the data is, how to access the data, and how this data may be connected to
    other data — the logic is not about the content of the data. This means that,
    like the single view I control I only need a single model class to support views
    like those in Figure 13-3, the one on the right in Figure 13-5 and even the one
    on the left in Figure 13-6.


    My path is: in MobileTravel411, I designed objects in the same way I designed
    the view controllers — essentially creating a class that knows what data to include
    and where that data is. (Programmers call such objects parameterized models.)
    All you need to do is initialize the model with the context it needs when the
    model is created.


    All the objects are a subclass of NSObject, because NSObject provides the basic
    interface to the runtime system. It already has methods for allocation, initialization,
    memory management, introspection (what class I?), and decoding (which makes it
    easy to save objects as "objects”), message dispatch, and a host of equally equal
    methods I won''t get into but are required for objects to be able to behave like
    they''re expected to be in an iPhone Objective-C world.


    # Putting property lists to use good


    To implement parameterized models and view controllers, you need something to
    provide the parameters. I used property lists — XML files, in other words — to
    take care of that because they''re really well suited for the task and (more importantly)
    support for them is built in the iPhone frameworks.'
