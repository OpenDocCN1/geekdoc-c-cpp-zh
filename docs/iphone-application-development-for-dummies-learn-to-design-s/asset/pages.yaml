    \ class — specifies that your class has adopted the TextFieldDelegate protocol.\n\
    \nClasses can adopt several protocols. To add more than one protocol, you just\
    \ put them all in the angle brackets, separated by commas.\n\n![](img/d3e98c195a93c941d040bbbc53dc1bd8_178_0.png)"
