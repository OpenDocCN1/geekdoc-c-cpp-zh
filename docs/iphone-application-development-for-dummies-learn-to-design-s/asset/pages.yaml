  md: '# Chapter 2


    # Looking Behind the Screen


    In This Chapter


    +   - Seeing how applications actually work

    - Understanding how to use the fundamental design patterns

    - Doing Windows (even if you say you don''t)

    - Creating an app with a view

    - Manipulating view controllers

    - Listing the frameworks you can use


    One of the things that makes iPhone software development so appealing is the richness
    of the tools and frameworks provided in the Apple''s iPhone Software Development
    Kit for iPhone Applications (SDK). The frameworks are especially important; each
    is a distinct body of code that actually implements your application''s "generic"
    functionality — gives the application its basic way of working, in other words.
    This is especially true of one framework in particular — the UIKit framework,
    the heart of the interface.


    In this chapter, I''m going to lead you on a journey through most of the iPhone''s
    user interface — a mostly static view that explains the various pieces are, what
    each does, and how they interact with each other. This will lay the groundwork
    for developing the ReturnMe Application''s user interface, which you get a chance
    to tackle in Chapter 5. After that''s — before you start major coding — I''ll
    take you on a similar tour of the iPhone application runtime environment — the
    dynamic view of all the pieces working together when, for example, the user launches
    an application or touches a button on the screen.


    # Using Frameworks


    A framework is designed to easily integrate any of the code that gives your application
    its specific functionality — the code that runs your game or delivers the information
    that your user wants, for example. Frameworks are therefore similar to software
    libraries, but with an added twist. Frameworks'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 28 Part I: Getting Started


    also implement a programmer’s flow of control, unlike in a software library it’s
    dictated by the programmer. This means that, instead of the program deciding in
    what order things happen — what messages are sent to what objects and in what
    order when an application launches, or what messages are sent to what objects
    in what order a user touches a button on the screen — all of that is already a
    part of the framework and does not need to be specified by the programmer.


    When you use an application you give a ready-made set of basic functions; you’ve
    told, “Here’s how to act like an application.” With the framework in place, all
    you need to do is add the application’s specific functionality you want — the
    content and the controls and views that enable the user to access and use that
    content — to the frameworks.


    The frameworks and the iPhone OS provide some pretty complex functionality, such
    as:


    +   - Launching the application and displaying a window on the screen

    - Displaying controls on the screen and responding to a user action — changing
    a toggle switch for example, or scrolling a view, like the list of your contacts

    - Accessing sites on the Internet, not just through a browser, but from within
    your own program

    - Managing user preferences

    - Playing sounds and movies

    - The list goes on — you get the picture


    Some developers talk in terms of “using a framework”; I think about the matter
    differently. You don’t use frameworks so much as they “use”. You provide the functions
    that the framework accesses; it needs your code in order to become an application
    that does something other start up, display a blank window, and then end. This
    perspective makes figuring how to work with a framework much easier. (For one,
    it lets the programmer where or she is essential.)


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_49_0.png)


    If this seems too good to be true, okay, it is — all that complexity (and convenience)
    comes at a cost. It can be really difficult to get your head around the whole
    thing and know exactly where (and how) to add your application’s functionality
    to supplied by the framework. Thats where design patterns come in. Understanding
    the design patterns behind the framework gives you a way of thinking about a framework,
    especially UIKit, that doesn’t make your head explode.'
