    \ you with a list of albums, and when you select an album, it shows you a list\
    \ of songs on\n\nBelow is the code that shows how to create a single dictionary\
    \ for a row. I'll show you how to create all of the dictionaries and where all\
    \ this code needs to go.\n\n```\nmenuList = [[NSMutableArray alloc] init];\n[menuList\
    \ addObject:[NSMutableDictionary \ndictictionaryWithObjectsAndKeys:\nLocalizedString(@\"\
    Heathrow\",\n@\"Heathrow Section\"), kSelectKey,\nLocalizedString(@\"International\
    \ airport\",\n@\"Heathrow Explain\"), kDescriptor,\nnil, kControllerKey, nil]];\n\
    ```\n\n![](img/d3e98c195a93c941d040bbbc53dc1bd8_309_0.png)"
