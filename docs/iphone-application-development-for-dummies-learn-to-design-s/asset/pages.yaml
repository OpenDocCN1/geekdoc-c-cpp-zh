    # The iPhone Simulator


    When you run your application, Xcode installs it on the iPhone Simulator (or a
    real iPhone device if you specified the device as the active SDK) and launches
    it. Using the Hardware menu and the keyboard and mouse, the Simulator mimics most
    of what a user can do on a real iPhone, albeit with some limitations I point out
    shortly.


    # Hardware interaction


    You use the iPhone Simulator Hardware menu (refer to Figure 4-8) when you want
    your device to do the following:


    +   * Rotate Left: Choosing Hardware->Rotate Left rotates the Simulator to the
    left. This enables you to see the Simulator in Landscape mode.


    +   * Rotate Right: Choosing Hardware->Rotate Right rotates the Simulator to the
    right.'
