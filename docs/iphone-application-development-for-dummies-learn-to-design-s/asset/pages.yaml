    +   ✓ Checking for initialization: Finally, notice the value of i in Figure 10-8.
    That long, seemingly random number is the way it is because it hasn''t been initialized.
    The instruction that was going to initialize it the one that generated a runtime
    error — because I tried to initialize i with the result of a divide-by-zero operation.


    As you can see, the debugger can be really useful when your program isn''t doing
    what you expect. For the blatant errors, the debugger can show you exactly where
    on the error occurred. It provides you with a trail of how you got to where you
    are, highlights the problem instruction, and shows your variables and their values
    at point. Had the cause of the error in this case been more subtle, looking at
    the value of the variable would have given me a good hint about what was going
    on.


    What''s just as valuable is how the debugger can help you with logic errors. Sending
    a message to nil is not uncommon, especially when you''re making changes to the
    user interface and forget to set up an outlet, for example. In such situations,
    the ability to look at the object references can really help. And what can really
    help you is the ability to set breakpoints, which is the subject of the next section.


    # Using Breakpoints


    Xcode''s Debugger feature is a great tool for tracking down runtime errors, as
    earlier sections in this chapter make clear. I want to highlight another useful
    feature of the Debugger — its capability of setting breakpoints. If you''re stymied
    by a logic error, setting breakpoints is a great way to break that logjam.


    A breakpoint is an instruction to the Debugger to stop execution at that instruction
    and wait for further instructions (no pun intended). By setting breakpoints at
    various methods in my program, I can step through its execution, at the instruction
    level, to see exactly what it''s doing. I can also examine the variables the program
    is setting and using, which will allow me to determine if that''s where the problem
    lies.


    In 10-9, I''ve set a breakpoint simply by clicking in the left-far column of the
    Editor window (I also deleted the statement that did the division by zero). When
    I build and run the program again (as you can see in the Debugger window in Figure
    10-10), the program has stopped execution right at the breakpoint I set. (You''ve
    also see that same thing in the Editor window.)'
