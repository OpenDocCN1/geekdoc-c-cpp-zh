  md: '# Notification


    Notification is a system that allows objects within an application to learn about
    changes that occur elsewhere in that application. Usually, objects get information
    by messages that come to them. But that means the object that sends the message
    must know what it needs to update whenever it does something that those objects
    care about. And let''s face it, the UIWindow object, being as it is in the keyboard
    displaying business, has no clue about my ReturnToViewController object.


    That''s where notification comes in. Notification is a broadcast model where I
    can register icons to be notified of a particular event. I can even post a notification,
    although I am not interested in doing that here. Notifications are managed by
    a single object, NSNotificationCenter, which is accessed using the method defaultCenter::


    For our ReturnMeTo application, we want to be notified when a UIKeyboardWillShowNotification
    is posted. That notification is posted by the Window class.


    # Registering a notification


