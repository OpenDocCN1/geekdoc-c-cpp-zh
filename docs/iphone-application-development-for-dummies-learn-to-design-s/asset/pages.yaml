  md: '# Part I: Getting Started


    # Engaging the user


    While we''re on the subject of the users, here''s another aspect of a compelling
    application: direct manipulation and immediate feedback.


    +   Direct manipulation makes people feel more in control. On the desktop, that
    means a keyboard and mouse; on the iPhone, the Multi-Touch interface serves the
    same purpose. In fact, using fingers give a user a more immediate sense of control;
    there''s no intermediary (such as a mouse) between the user and the object on-screen.
    To make this effect happen in your application, keep your on-screen objects visible
    while the user manipulates them, for example.


    +   Immediate feedback keeps the users engaged. Great applications respond to
    every user action with some visual feedback — such as highlighting lists briefly
    when users tap them.


    Because of the limitations imposed by using fingers, applications need to be forgiving.
    For example, the iPhone doesn''t pester the user to confirm every action, it also
    won''t the user perform potentially destructive, non-recoverable actions (such
    as deleting all contacts or restarting a game) without asking, “Are you sure?”
    Your application should also allow the user to easily stop a task that''s taking
    too long to complete.


    Notice how the iPhone uses animation to provide feedback. (I especially the flickering
    transitions in the Weather Application when I touch the Info button.) But keep
    it simple; excessive or pointless animation interferes with the application flow,
    reduces performance, and can annoy the user.


    # Why Develop iPhone Applications?


    Because you can. Because it''s time. And because it''s fun. Developing my iPhone
    applications has been the most fun I''ve had in many years (don''t tell my wife!)
    Here''s what makes it so fun (for me, anyway):


    +   iPhone apps are usually bit-sized — small enough to get your head around.
    A single developer — one with a partner and maybe some graphics support — can
    do plenty. You don''t need a 20-person project with endless procedures and processes
    to create something valuable.


    +   The applications are crisp and clean, focusing on what the user wants to do
    at a particular time and/or place. They are simple but simplistic. This makes
    application design (and subsequent implementation) much easier — and faster.


    +   The free iPhone Software Development Kit (SDK) makes development as easy as
    possible. I reveal its splendors to you throughout this book.'
