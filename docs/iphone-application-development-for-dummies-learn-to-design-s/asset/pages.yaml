    # Create your iPhone Distribution Provisioning Profile for App Store Distribution.


    To build your application successfully with Xcode for distribution via the App
    Store, first you must have to create and download an App Store Distribution Provisioning
    Profile—which is (let we forget) from the Development Provisioning Profiles I
    talk about in the previous section.


    Apple will only accept an application when it''s built with an App Store Distribution
    Provisioning Profile.


    3. Click the Click and Download Your iPhone Distribution Provisioning Profile
    for App Store Distribution link.


    The link (refer to Figure 12-5) leads you through this process.


    4. When you''re done creating the Distribution Provisioning Profile, download
    it and drag it into Xcode in the dock.


    That loads your Distribution Profile into Xcode, and you''re ready to build an
    app you can distribute for use on actual iPhones.


    5. (Optional) You can also create and download a Distribution Provisioning Profile
    for Ad Hoc Distribution.'
