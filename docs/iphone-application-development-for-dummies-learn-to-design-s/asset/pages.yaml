  md: '# Chapter 14: Setting the Table


    The navigation bar for each level is managed by a navigation controller — again
    as mentioned in the previous section. The navigation controller maintains a stack
    of view controllers, one for each of the views displayed, starting with the root
    view controller (hence the name RootViewController) given to the view controller
    by the template. The root view controller is the very first view controller that
    the navigation controller pushes onto its stack when a user launches the application;
    it remains active until the user selects the next view to look at.


    Time for a concrete example. When the user taps a row of the table view to get
    the Heathrow Express information, the root view controller pushes the next controller
    onto the stack. The new controller''s view (the Heathrow Express information)
    slides into place, and the navigation bar items are updated appropriately. When
    the user taps the Back button in the navigation bar, the current view controller
    pops off the stack, the view slides (so to speak) back in the main (table) view.


    A stack is a commonly used data structure that works on the principle of last
    in, first out. Imagine an “ideal” boarding scenario for an airplane: You would
    start with the seat in the last row, and board the plane in back-to-front order
    until you got to the seat in the first row — would be the last person to board.
    When you go to your destination deplane (is that really a word?) in the reverse
    order. That last person — the person in one seat — would be the first person off.


    A computer stack is pretty much the same. Adding an object is called a push —
    in this case, when you select Heathrow, the view controller for Heathrow is pushed
    onto the stack. Removing an object is called a pop — touching the Back button
    pops the view controller for Heathrow. When you pop an object off the stack, it’s
    always the last one you pushed onto it. The controller that was before is still
    there, and now becomes the active one —


    I mentioned that I wanted two Back buttons in place. Now you get to find why.
    In my design, I wanted to tap a link in the content views to access a Web site.
    (You can see a link on the left in Figure 14-4) When you do, the iPhone111 application
    replaces the content of the view, rather creating it in any way, the bottom button
    won’t change; you won’t be able to get back to a previous view — you’ll only go
    back to the main view, as the controller tells you. To solve this, I created another
    button and labeled it “Back”, so the user knows he or she can get back to the
    previous view. I show how to create a Back button in Chapter 17.


    That being said, Apple’s Human Interface Guidelines say, “In addition to playing
    web content, a web view presents elements that support navigation through open
    webpages. Although you can choose to present webpage navigation, it’s best to
    avoid creating an application that looks and behaves like a mini web browser.”
    If you want to follow Apple’s suggestion, I’ll show how to handle links in Chapter
    17.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_322_0.png)'
