  md: '# Chapter 17: Finding Your Way 357


    When you initialize a map view, you can specify the initial region for that map
    to display. You do this by setting the region property of the map. A region is
    defined by a center point and a horizontal and vertical distance, referred to
    as the span. The span defines how much of the map will be visible and in a zoom
    level. The smaller the span, the greater the zoom.


    The map view supports the standard map gestures.


    +   - Scroll

    - Pinch zoom

    - Double-tap to zoom out (you might not even know about that one)


    You can also specify the map type — regular, satellite, or hybrid — by changing
    a property.


    Since MapKit was written from scratch, it was developed with the limitations of
    the iPhone in mind. As a result, it optimizes performance on caching data as well
    as managing memory and seamlessly handling connectivity changes (like moving 3g
    to Wi-Fi, for example).


    The map data itself is Google-hosted map data, and network connectivity is required.
    And since the Map framework uses Google services to provide map data, using it
    binds you to the Google Maps/Earth API terms of service.


    Although you do not subclass the MKMapView class, you can tailor a map view''s
    behavior by providing a delegating object. The delegate object can be any object
    in your application as it conforms to the MKMapDelegate protocol, and as you''ll
    see, you can easily use the model you developed in Chapter 16 to do that. (I wasn''t
    kidding when I said you were done with the tedious creation of files!)


    # Enhancing the Map


    Having this nice map centered on the United States is kind of interesting, but
    not very useful if you are planning to go to London. Let''s look at what you would
    have to do to make the map more useful as well as Heathrow and London.


    In Chapter 16, you created a view controller (MapController) with the right outlets
    and a nib file that creates a MKMapView object and sets all the outlets for when
    the user selects Map from the main view. You can also have an initialization method
    set up.'
