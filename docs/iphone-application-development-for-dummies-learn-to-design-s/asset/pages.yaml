  md: "# Chapter 11: Buttoning Down and Calling Home 213\n\napplication later on (in\
    \ Chapters 13 through 17), but for now, I'm just interested in loading an HTML\
    \ string — our beloved phone number.\n\nThe thing for you to remember is that,\
    \ by default, a Web view recognizes a phone number and converts that to a Phone\
    \ Link. When the user taps a Phone Link, the Phone application launches and dials\
    \ the number — which is precisely what you want.\n\n# Tweaking the code\n\nOur\
    \ ReturnMeTo application has managed so far with just a label view, simply because\
    \ you only wanted the label to display a phone number. Now that you want the number\
    \ dialed when it touches, you're going to replace the label view you're currently\
    \ using with a Web view. To do that successfully, you need to tackle the following\
    \ tasks:\n\n+   1. Identify and modify all the places that assign the phone number\
    \ to the label. Right, to display the number in the label, all you have to do\
    \ is assign it to `label`, and it gets displayed. It will now take a little more\
    \ work to display it (but its' worth it) because you'll have to replace each assignment\
    \ with a message to the WebView to load the HTML string into `webView`.\n2. Create\
    \ the HTML string you want displayed.\n3. Replace the UILabel with a UIWebView\
    \ in Interface Builder and connect everything.\n\nListing 11-5 shows the code\
    \ you'll need. I started by making the necessary changes to the interface in the\
    \ ReturnMeToViewController.h file. I replaced the label with a WebView outlet,\
    \ and also added an instance variable `urlString` to compose the text I load into\
    \ the Web view. The changes are in bold; I have commented out (with `double-strikethrough`)\
    \ the deletions.\n\n# Listing 11-5: Update the interface\n\n```\n@interface ReturnMeToViewController\
    \ : UIViewController\n<UITextFieldDelegate>\n\n    IBOutlet UITextField *textField;\n\
    \    IBOutlet UILabel *label;\n    IBOutlet UIWebView *webView;\n    BOOL moveViewUp;\n\
    \    CGFloat scrollAmount;\n    NSString *callNumber;\n    NSString *urlString;\n\
    \n@end (continued)\n```\n\n(continued)"
