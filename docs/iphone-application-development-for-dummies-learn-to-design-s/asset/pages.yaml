  md: '# Chapter 2: Looking Behind the Screen


    # Text and Web views


    Text and Web views provide a way to display formatted text in your application.
    The UITextView class supports the display and editing of multiple lines of text
    in a scrollable area. The WebView class provides a way to display HTML content.
    These views can be used as a content view, or as used in the same way as a display
    view above, as a subview of a content view. I use a UIWebView in Chapter 11 to
    allow someone who has found an iPhone to call the owner''s number by simply tapping
    it. UIViews are also the primary way to include graphics and formatted text in
    display views. (I use them when I show how to develop iPhoneTravel411.)


    # Alert views and action sheets


    Alert views and action sheets present a message to the user, along with buttons
    that allow the user to respond to the message. Alert views and sheets are similar
    in function but look and behave differently. For example, the UIAlert class displays
    a blue box that pops up on the screen, and the UIActionSheet class displays a
    box that slides from the bottom of the screen.


    # Navigation views


    Tab bars and navigation bars work in conjunction with View controllers to provide
    tools for navigating in your application. Normally, you don''t need to create
    a UITabBar or UINavigationBar directly — it is easier to configure these views
    through a tab bar or navigation controller.


    # The window


    A window provides a surface for drawing content and the root container for all
    other views.


    There is typically only one window per application.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_58_0.png)


