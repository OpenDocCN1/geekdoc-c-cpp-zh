    > ve said it before and I''ll say it again: One of the things that really got
    me excited about the iPhone was how easy it was to develop applications. The Software
    Development Kit (SDK) comes with so many tools, you''d think development must
    be really easy. Well, to be truthful, it''s relatively easy.


    In this chapter, I introduce you to the SDK. It''s going to be a low-key, acquainted
    kind of affair. I''ll show you the real nuts-and-bolts stuff in later chapters,
    when I actually develop the two sample applications.


    # Developing Using the SDK


    The Software Development Kit (SDK) supports the kind of development process that''s
    my own heart: You can develop your applications without tying your brain in knots.
    The development environment allows you to rapidly get a user interface and running
    to see what it looks like. The idea is here to add your code incrementally — step
    by step — so you can always step back and see what you just did affected the Big
    Picture. Your general steps in development would look something like this:


    +   - Start with Xcode, Apple''s development environment for the OS X operating
    system.

    - Design the user interface.'
