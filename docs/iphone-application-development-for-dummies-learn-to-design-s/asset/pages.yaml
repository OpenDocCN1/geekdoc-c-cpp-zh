    Your application should do what it needs to do in order to terminate gracefully.


    The way Sleep/Wake button is handled is a little different. When the application
    enters or resumes from a sleep state, messages are sent to the application delegate:
    applicationWillResignActive: and applicationDidBecomeActive;, respectively. In
    this case, your application always resumes, though the user might immediately
    launch a different application.


    # Seeing how memory management works on the iPhone


    One of the main responsibilities of all good applications is to deal with low
    memory. So the first line of defense is (obviously) to understand how you as a
    programmer can help avoid getting into that state.


    In the iPhone OS, each program uses the virtual-memory mechanism found in all
    modern operating systems. But virtual memory is limited to the amount of physical
    memory available. This is because the iPhone OS doesn''t store "changeable" memory
    (such as object data) on the disk to free up space, and read it in when it''s
    needed. Instead, the iPhone OS tries to keep the running application it needs
    — using memory pages that contain read-only contents (such as code, where all
    it has to do is load the "originals" back into memory when they''re needed. Of
    course, this may be only a temporary fix if those resources are needed again a
    short time later.


    If memory continues to be limited, the system may also send notifications to the
    running application, asking it to free up additional memory. This is one of the
    critical events that all applications must respond to.'
