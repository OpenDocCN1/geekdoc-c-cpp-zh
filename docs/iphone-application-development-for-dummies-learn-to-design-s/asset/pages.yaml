    # Finding Your Way Around the Code


    When you look in Listing 8-18 (it''s on my Web site), you''ll see several #pragma
    statements. For example, this one:


    ```

    #pragma mark - ViewController methods

    ```


    Any statement that begins with #pragma is actually a compiler directive — meaning
    that it has nothing to do with code; it passes information to the compiler, or
    in this case, code editor. It tells Xcode''s editor to put a “heading” in the
    pop-up menu at the top of the Editor Pane that stores a running list of methods
    and functions used in the project. You can pop up this list by selecting the up
    and down arrows highlighted in Figure 8-11. The field to the right displays the
    last method you were in, in this case viewDidLoad. Choose a method or function
    from the pop-up menu, and you''re brought to the implementation of that method
    in the code.


    Some of your classes, especially some of your controller classes, are likely to
    have a lot of code. If you make it a habit to use this gem of a pop-up menu, you''ll
    find it much easier to find things.


