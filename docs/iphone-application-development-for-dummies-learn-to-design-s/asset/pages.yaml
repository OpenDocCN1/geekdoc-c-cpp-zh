  md: "# Part IV: An Industrial-Strength Application\n\napplications you can download\
    \ from the App Store. (Obvious examples: Almost all the views in the Mail, iPod,\
    \ and Contacts are table views.) Table views not only display data, but also serve\
    \ as a way to navigate a hierarchy.\n\nIf you take a look at an application such\
    \ as Mail or iPod, you will find table views present a scrollable list of items\
    \ (or rows or entries — I use all terms interchangeably) that may be divided into\
    \ sections. A row can display text or images. So, when you select a row, you may\
