  md: '# 204 Part III: From “Gee, That’s a Good Idea,” to the App Store


    So be prepared for comments from the peanut gallery about how "this and such"
    is what your app needs to make it better/faster/stronger. Be confident enough
    in your own skills as a developer to actually take such suggestions, dispassionately
    evaluate each one, and incorporate the better ones into your work. I thought comments
    about the ReturnMeTO application a lot of sense, so I put my coder''s cap on and
    retooled the ReturnMeTO application so that the iPhone acted as the enabling trigger
    for updating the phone number (requested) and the iPhone “phonesome” when somebody
    touched the displayed phone number (requested). This chapter shows the steps I
    had to go through in order to incorporate these suggestions.


    # Adding a Button to Your iPhone Interface


    If made your way through enough of the coding in this book to get to this point
    (Chapter 11), more than likely you won''t have trouble adding a messy button to
    the interface. If you remember that buttons use the Target-Action design pattern
    I talk about in Chapter 2, you''ll get your head around the whole button concept
    quickly.


    Ready? Let''s get started.


    # The Target-Action pattern


    Use the Target-Action pattern (see Chapter 2) to let your application know that
    a user has done something. When he or she taps a button for example, your application
    is supposed to respond — which usually happens in due course the button invokes
    some method that you specified in your code. The method that gets invoked is (usually)
    in the view controller that manages the view in which the particular button resides.
    In case of our ReturnMeTO application, that view controller would be ReturnMeTOViewController.


    In 11-1 I have added a UIControl (a button). By you can see, whenever the user
    taps the button, it sends the buttonPressed: message to ReturnMeTOViewController.


    End of story — well, at for what happens when the button is tapped. Here''m replacing
    one control (the label) with another control (the button). It really comes down
    a plumbing issue, and makes the point that when you use the Model-View-Controller
    design pattern, making a user interface change is almost trivial — it requires
    a little replumbing in the controller. And, yes, a little bit of replumbing in
    Interface Builder as well.'
