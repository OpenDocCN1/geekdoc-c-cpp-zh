    # Responding to the user selection


    You''ve set up so that when the view is first created — or the user taps a control
    — the AirportController''s selectTransportation is called, allowing the AirportController
    to hook up what the view needs to display with the model it has. Listing 16-2
    shows the necessary code in all its elegance.


    # List 16-2: selectTransportation


    ```

    (void)selectTransportation:(id) sender {

    [airport loadRequest:(NSURLRequest requestURL:

    [destination returnTransportation:((UISSegmentedControl*)sender).selectedIndex]))];


    ```


    This is the code that gets executed when the user selects one of the segmented
    controls (Train, Taxi, Other) that you added to the view ((UISSegmentedControl*)sender).selectedIndex
    gives you the segment number. You''ll notice, the controller itself has no idea
    — should it care — what was selected. It just passes what was selected on the
    model. That kind of logic should be (and, as you will see, is) in the model.


    All this does send a message to the model to find out where the Web view is located,
    [destination returnTransportation:((UISSegmentedControl*)sender).selectedIndex]],
    and then send a message to the Web view to load it. This is more or less what
    you did in Chapter 11, but I''ll explain more about the mechanics of this shortly.'
