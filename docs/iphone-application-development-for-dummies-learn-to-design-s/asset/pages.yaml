  md: '# # Chapter 17


    # # Finding Your Way


    # **In This Chapter


    +   - Using the map framework

    - Specifying the location and zoom level of a map

    - Annotating significant locations on the map

    - Identifying the iPhone’s current location


    p until now, the functionality I have been focusing on is the kind that enables
    you to do what you need in a context, like get from the airport to your hotel,
    change money, tip appropriately, and so. There’s also another side to context,
    and that the iPhone can provide information about the context. Weather is one
    example, and a map is another.


    Including the ability to display a map in MobileTravel411 became important as
    people began to realize the kinds of solutions that could be delivered on the
    iPhone. In many travelers, nothing brands you as a tourist than unfolding a large
    map (except of course looking through a thick guidebook). In this chapter, I’ll
    show you how to take advantage of the iPhone’s built-in capability to display
    a map of virtually anywhere in the world, as well as determine your location and
    then indicate it in the map. As I said earlier, awareness of your location is
    one of the things that enables you to develop a totally new kind of application
    and differentiate an iPhone application from a desktop.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_376_0.png)


    For that reason, in this chapter, I return to the (more or less) step-by-format
    I used in showing you how to build the ReturnMeTo application. Being able to build
    maps into your application is an important new feature in the iPhone 3.0 SDK and
    beyond, I want to be sure you really understand how to use it. If you want to
    follow along with me, you can start with the project in the folder named iPhoneTravel411
    Chapter 16 on my Web site. The final version of what you have done can be found
    in the folder iPhoneTravel411 Chapter 17.


    Oh, and by the way, it turns out working with maps is one of the most fun things
    you can do on the iPhone because Apple makes it so easy. In fact, you saw this
    in Chapter 16 where you displayed a map that supported the standard panning and
    zooming gestures by simply creating a view controller and a nib file.'
