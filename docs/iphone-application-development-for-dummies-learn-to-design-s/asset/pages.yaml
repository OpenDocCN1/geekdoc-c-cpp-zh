  md: '# Introduction


    n the first edition of iPhone Application Development For Dummies, I said that
    when Apple opened up the iPhone to developers, I got as excited about developing
    software as I did when I first discovered the power of the Mac. And what you know,
    I am still am.


    As you continue to explore the iPhone as a new platform, I keep finding more possibilities
    for applications that never existed before. It is a mobile computer, but not simply
    a mobile desktop. Its hardware and software make it possible to wander the world,
    or your own neighborhood, connected to whoever and whatever you want to. It enables
    a new class of here-and-now applications that allow you to do what you need to,
    based on what is going on around you and where you are.


    The first edition of iPhone Application Development For Dummies was based on iPhone
    OS 2.2. When iPhone OS 3.0 was released, and then quickly followed by OS 3.1,
    I knew that I had to make a second edition. There were some additional features
    that wanted showed how to use. The new MapKit, for example, makes it much easier
    to use the location-based features of the iPhone in an application. This is a
    significant step forward since one of the hallmarks of a great iPhone app is that
    it leverages the iPhone''s unique hardware, especially its to know where the user
    is. The new MapKit makes it possible for even a beginner developer to take full
    advantage of the location hardware, and I added a new chapter to show you how.
    There are also other changes to the nuts and bolts of how to develop iPhone applications
    that required changes in the examples I showed about how to use the SDK to create
    real applications.


    But as important iPhone OS 3.1 is, Snow Leopard and its accompanying Xcode 3.2
    (almost) as important. Xcode 2.2 and Xcode 3.1 provided a set of mature, easy-to-use,
    and best part free tools. The frameworks were amazing! I used frameworks before,
    but the ones that came with the iPhone were especially rich and mature. All I
    really had to add my application''s user interface and functionality to the framework,
    and then "pool" ... an instant application.


    But you are ready for this — from a developer''s standpoint, Xcode 3.2 is a lot,
    lot better and easier to use. This became obvious when I first started using a
    beta version. In fact, I subsequently moved all of my own and my team''s development
    to Xcode 3.2, and when I have to use Xcode 3.1, I find myself grumbling the entire
    time.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# iPhone Application Development For Dummies, 2nd Edition


    As a result, this new edition is based on iPhone OS 3.1 and Xcode 3.2. If you
    want to learn how to develop applications, this is the set of tools you absolutely
    need to use to do it the right way.


    If this seems too good to be true, well, okay, it is, sort of. All that convenience
    comes at a cost. At first, it was really difficult to get my head around the whole
    thing, conceptually speaking; sometimes I found it difficult to figure out exactly
    where (and how) to add my application''s functionality to that supplied by the
    framework.


    And there were lots of resources, the problem was exactly that: There were lots
    of resources! As, thousands of pages of documentation I could read, and lots of
    sample code to look at. I could only get a small fraction of the documentation
    before I couldn''t stand the suspense and starting coding. Naturally enough, there
    were a few false starts and blind alleys until I found my way, and it has been
    (pretty much) smooth sailing ever since.


    That''s why, the Dummies folks asked me to write a book about developing software
    for the iPhone, I jumped at the chance. Here was an opportunity for me to write
    the book I''d had when I started developing iPhone software.


    # About This Book


    iPhone Application Development For Dummies is a beginner''s guide to developing
    iPhone applications. And not only do you need any iPhone development experience
    to get started, you don''t need any Macintosh development either. I expect you
    to come as a blank slate, ready to be filled with useful information and new ways
    to do things.


    Because of the nature of the iPhone, you can create small, bite-sized applications
    that can be really powerful. And since you can start small and create real applications
    that do something important for a user, it''s relatively easy to transform yourself
    from "knowing nothing" to a developer who, though not (yet) a superstar, you can
    chill out quite a respectable application.


    But the iPhone can come home some pretty fancy software as well — so I''ll take
    you on a journey building an industrial-strength application and show you the
    ropes for developing one on your own.


    This book distills the hundreds (or thousands) of pages of Apple documentation,
    not to mention my own development experience, into only what''s necessary to start
    developing real applications. But this is no'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    recipe book that leaves it up to you to put it all together; rather, it takes
    you through the frameworks and iPhone architecture in a way that gives you a solid
    foundation in how applications really work on the iPhone — and acts as a roadmap
    to expand your knowledge as you need to.


    It''s a multicourse banquet, intended to make you feel satisfied (and really full)
    at the end.


    # Conventions Used in This Book


    This book guides you through the process of building iPhone applications. Throughout,
    you used the provided iPhone framework classes (create new ones, of course) and
    code them using the Objective-C programming language.


    Code examples in this book appear in a monospaced font so they stand out a bit
    better. The means you''ll see like this:


    ```

    #import UIKit/ UIKit.h

    ```


    Objective-C is based on C, which (I want to remind you) is case-sensitive, so
    please enter the code that appears in this book exactly as it appears in the text.
    I also use the standard Objective-C naming conventions — for example, class names
    always start with a capital letter, and the names of methods and instance variables
    always start with a lowercase letter.


    Let me throw out that all URLs in this book appear in a monospaced font as well:


    ```

    www.nealgoldstein.com

    ```


    If you''re ever uncertain about anything in the code


    # Foolish Assumptions


    To begin programming your iPhone applications, you''ll need an Intel-based Macintosh
    computer with the latest version of the Mac OS on it. (No, you can''t program
    iPhone applications on the iPhone.) You will also need'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 4 iPhone Application Development For Dummies, 2nd Edition


    download the iPhone Software Development Kit (SDK) — which is free — but you have
    to become a registered iPhone developer before you can do that (Don''t worry;
    I show you how to do both.) And, oh yeah, you''ll need an iPhone. You won''t start
    your application on it right away—you''ll use the Simulator that Apple provides
    the iPhone SDK during the initial stages of development — but at some point, you''ll
    want to test your application on a real, iPhone.


    I''m going to assume that you have some programming knowledge and that you have
    at least a passing acquaintance with object-oriented programming, using some variant
    of the C language (such as C++, C#, or even Objective-C). If not, I''ll point
    out some resources that can help you get up to speed. The examples in this book
    are focused on the frameworks that come with the SDK; the code is pretty simple
    (usually) and straightforward. (I won''t use this as book as a platform to dazzle
    you with fancy coding techniques.)


    I''m also going to assume that you''re familiar with the iPhone itself, and that
    you''ve explored Apple''s included applications to get a working sense of the
    iPhone look and feel. It would also help if you browse the App Store to see the
    kinds of applications available there, and maybe even download a few ones (as
    if I could stop you).


    # How This Book Is Organized


    iPhone Application Development For Dummies has five main parts.


    # Part 1: Getting Started


    Part I introduces you to the iPhone world. You''ll find out what makes a great
    iPhone application, and how an iPhone application is structured. You also find
    out how to become an "official" iPhone developer and what you need to do in order
    to be able to distribute your applications through Apple''s Store.


    # Part II: Using the iPhone Development Tools


    I start Part II by showing you how to download the Development Kit (SDK) — and
    then unpack all the goodies contained therein, including Xcode (Apple''s development
    environment for the OS X operating system) and Interface Builder. (You''ll soon
    discover that the latter is more than your'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    run-of-the-mill program for building graphical user interfaces.) I''ll also explain
    how everything works together at runtime, which should give you a real feel for
    how an iPhone application works. Parts I and II give you the fundamental background
    that you need to develop iPhone applications.


    # Part III: From Gee, That''s a Good Idea,

    to to the App Store


    With the basics behind you and a good understanding of the application architecture
    under your belt, it''s finally time to have some doing useful. In this part, I
    show how to create a simple application that people can actually use — it displays
    a phone number to call if you lose your iPhone. (My friends thought it was sheer
    genius.) What''s more, the Good Samaritan who finds your phone only has to tap
    that number where it''s shown-screen, and the phone dials the number automatically.
    Putting this handy app together will give you some practice at creating a useful,
    single-screen program with controls. It''s a great application to learn about
    iPhone development — big enough to be useful, but small not to make your head
    explode.


    It is also a "real" application. I go through the process I used to (successfully)
    submit it to the App Store, and you can download it and see it for yourself.


    # Part IV: An Industrial-Strength

    Application


    Part IV takes you into the world of applications that contains major functionality.
    I show you how to design an application with lots of data, views, and access to
    the Web. We won''t go slogging through every detail, but I will demonstrate almost
    all the technology you need to master if you''re going to create a compelling
    application like this on your own. I also touch on a few advanced topics — such
    as creating self-configuring objects so you don''t find your classes multiplying
    like rabbits.


    # Part V: The Part of the Tens


    Part V consists of some tips to help you avoid having to learn everything the
    hard way. I talk about approaching application development in an "adult" way right
    from the beginning (without taking the fun out of it, assure you). I also take
    you on a tour of the iPhone sample code, pointing out some samples I really like
    and have found to be the most useful.'
  merge: -1
