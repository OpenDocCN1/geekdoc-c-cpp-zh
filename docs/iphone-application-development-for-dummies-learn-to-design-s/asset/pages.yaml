  md: '# Chapter 6


    # While Your Application Is Running


    In This Chapter


    +   - Seeing how applications actually work

    - Getting a handle on how nib files work

    - Following what goes on when the user taps your application icon

    - Managing events

    - Creating an app with a view

    - Remembering memory management

    - Knowing what else you should be aware of runtime


    Taking a peek at the iPhone application architecture (Chapter 2) and working through
    the steps of creating the user interface for an application (Chapter 5) are all
    fine and dainty, but at some point, you have to add some code — and to do that,
    you need an additional frame of reference: You need to know how all stuff works
    at runtime.


    Uncovering the mysteries of runtime is the goal of this chapter.


    Okay, if you can''t wait, then by all means skip to the next chapter. Honestly,
    if I were you (or without benefit of hindsight), I''d be itching to do the same
    thing. But you''ll probably run into trouble, just as I did, if you don''t take
    some beforehand to examine how the objects work together to deliver the user''s
