  md: '# 172 Part III: From “Gee, That’s a Good Idea,” to the App Store


    Storing the data in the file system rather than in memory gives an easy way to
    store application-specific information. With the help of NSUserDefaults, you can
    easily store the state the user was in when she quits the application — or something
    simple like a phone number — which just happens to be precisely what we need for
    our ReturnMeTo application.


    # Saving data using NSUserDefaults


    Enough background information; it’s time to actually save some data to NSUserDefaults.


    The first thing you need to decide is where in your application you plan on loading
    and saving your data. As Figure 9-1 makes clear, the obvious places to do that
    are in applicationDidFinishTerminate: the very methods I use in Chapter 8 to perform
    initialization and termination at the application level.


