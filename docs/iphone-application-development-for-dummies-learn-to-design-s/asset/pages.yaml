  md: '# 326 Part IV: An Industrial-Strength Application


    # Creating the View Controller, Nib, and Model Files


    Standard operating procedure for iPhone applications is to have a user tap an
    entry in a main view to get to a subsequent view. For this work, you need to create
    a new controller and push it onto the stack. (For more controllers and stacks
    as they apply to the iPhoneTravel411 application, see Chapter 14.) To make it
    happen, you need to code your view controller interface and implementation files,
    your nib files, and your model interface and implementation files. (Yes, we''re
    talking a lot of files here — it''s all good, so deal with it as best you can.)


    Going abstract to concrete, as I spell out what you need to have in place before
    your users jump from one view to another in iPhone-Travel411 — say, when a user
    selects the "Harrow" in the main view of the app and fully expects to find a new
    view of information about (yep) Heathrow airport (although in this example, I''ll
    illustrate only transportation from and to the airport). This will be the general
    pattern you can follow for the rest of the rows in this application, or in any
    application that uses a table view. (For more table views, check out Chapter 14.)


    # Adding the controller and nib file


    So many files, so little time. Actually, after you get a rhythm going, cranking
    out the various view controller, nib, and model files to fill your application
    architecture with content isn''t that much work. While I want to start with what
    happens when the user taps Heathrow, because it allows me to explain a bit about
    navigating between views in your program, now is a good time to create all those
    files you''ll need to create.


    Okay, check out how easy it is to come up with the view controller and nib files:


    +   1. In the iPhoneTravel411 project window, select the Classes folder, and then
    Select: New from the main menu (or press ⌘+N) to get the New File view you see
    in Figure 16-4.


    +   2. In the left column of the dialog, select Cocoa Touch Classes in the iPhone
    OS heading, select the ViewController subclass template in the top-right pane
    and then click Next (see Figure 16-4).


    Be sure the With XIB for User Interface is also checked.

    You''ll see a new dialog asking for some more information.'
