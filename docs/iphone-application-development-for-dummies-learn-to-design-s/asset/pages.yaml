  md: '# Chapter 8: Entering and Managing Data


    Listing 8-8: Implement textFieldShouldReturn:

    -(BOOL) textFieldShouldReturn: (UITextField *)


    ```

    [theTextField resignFirstResponder];

    if (moveUp) [self scrollAndView:NO];


    return YES;}

    ```


    The method textFieldShouldReturn: is passed the current text field that is being
    edited — namely, the textField.


    +   1. Send [textField resignFirstResponder] message.

    If you were wondering how to dismiss the keyboard, this does the trick:

    [textField resignFirstResponder];


    +   2. At times the view has been scrolled up (yes, this is one of those situations),
    send the scrollAndView, message with the argument of NO, to restore the view to
    its original position:


    ```

    if (moveUp) [self scrollAndView:NO];

    ```


    moveViewUp lets the textFieldShouldReturn: method know that the view has been
    scrolled and it needs to be restored.


    +   3. Return YES.

    This tells the text field to implement its default behavior for the Return key.


    Now the keyboard has been dismissed and the view restored to its original position.
    All because you already took care of the code for unregistering the notification
    earlier in the chapter, you''ve completed the five-step plan that puts in place
    a system for efficiently scrolling your content view and down as needed. Now all
    you have to tie up a few loose (code) strings and you''re set — except for the
    compiling and testing, of course.'
