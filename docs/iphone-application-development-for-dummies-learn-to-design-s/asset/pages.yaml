    # # Provisioning Your Application

    for the App Store


    Although there''s no dedicated Assistant to help you provision your application
    for the App Store, that process is actually a little easier which may be if it
    didn''t bother coming up with an Assistant for it. You start at the Developer
    Portal (refer to Figure 12-2), but this time you select Distribution from the
    menu on the left side of the page. Doing so takes you to the screen shown in Figure
    12-5 — an overview of the service, as well as links that take you where you need
    to go when you click them.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_260_1.png)


    You actually jump through some of the very same hoops you did when you provisioned
    your device for development — except this time you''re going after a distribution
    certificate.


    Here''s the step-by-step account:


    +   1. Obtain your iPhone Distribution Certificate.


    In order to distribute your iOS application, a Team Agent has to create an iPhone
    Distribution Certificate. This works much like the Development Certificate, except
    only the Team Agent (or whoever is enrolled as an Individual developer) can get
    one. Clicking the Obtaining iPhone Distribution Certificate link (shown in Figure
    12-5) leads you through the process.'
