  md: '# Chapter 7: Actually Writing Code


    # # The Xcode Code Editor


    The main tool you use to code for an iPhone application is the Xcode text editor.
    Apple has gone out of its way to make the text editor as user-friendly as possible,
    as evidenced by the following list of (quite convenient) features:


    +   **Code Sense:** As you type, you can have the Editor by inserting text that
    completes the name of whatever Xcode thinks you''re going to enter.


    Using Code Sense can be really useful, especially if you''re like me and forget
    exactly what the arguments are for a function. When Code Sense is active (it is
    by default), Xcode uses the text you typed, as well as the context which you typed
    it, to provide suggestions for completing what it thinks you are going to. You
    can accept suggestions by pressing Tab or Return. You may also display a list
    of completions by pressing Escaping.


    +   **Code Folding:** With code folding, you can collapse the code that you''re
    not working on and display only the code that catches your attention. You do this
    by clicking the column to the left of the code you want to hide.


    +   **Switching between header and implementation:** On the toolbar above the
    editor, you click the last icon before the lock to switch from h to .m (header
    and implementation), and vice versa. While the header lets you see the class''s
    instance variables and method declarations, you find your actual code in the implementation
    file. If you look in the Groups & Files pane of the project window, you can see
    the separate and .m files for the classes we have started with.


    +   **Launching a file in a separate window:** Double-click the filename to launch
    the file in a new window. This enables you folks with big monitors, or multiple
    monitors, to look at more than one file at a time. You could, for example, look
    at the method of one class and the method it invokes in the same, or even a different
    class.


    # # Accessing Documentation


    Like many developers, you may find wanting to dig deeper into a bit of code. That''s
    when you really appreciate Xcode''s Quick Help, header file access, Documentation
    window, Help menu, and Find tools. With these tools, you can quickly access the
    documentation for a particular class, method, or property.'
