  md: '# Part III: From “Gee, That''s a Good Idea,” to the App Store


    # We''re not done yet


    If you''re going to charge for your application, you have to provide even more
    information. Most of it is pretty straightforward, except for some of the banking
    information, which you do to have available. To change this information after
    you have entered it, you''ll have to e-mail iTunes technical support. It behooves
    you to get it right the first time.


    Here''s what I''m talking about:


    +   * Bank name

    * Bank address

    * Branch/Branch ID

    * ABA/Routing Transit Number: Generally, this number is the first nine digits
    at the bottom of your checks that contains the account number. If you aren''t
    sure what the routing is, contact your bank.

    * Your Swift Code: You will have to get that from your bank.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_271_0.png)


    Take it from me; it''s far easier if you have all bits and pieces together you
    start the actual upload process, rather than having to scramble at 3 a.m. to find
    some obscure piece of information it wants. (The Bank Swift Code was the one that
    got me)


    # Uploading your information


    At this point, you can start the application-upload process by clicking the Manage
    Applications link on the iTunes Connect main page. (Refer to Figure 12-2) But
    hold it. Better to look before leaving: Check out the requisite Contracts, Tax
    & Banking Information.


    Here''s why: If you plan on selling your application, you''ll need to have your
    commercial agreement in place and signed before your application can be posted
    to the App Store.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_271_1.png)


    If your application is free, you''ve already entered into the freeware distribution
    agreement by not going to charge for the ReturnMeTo application, but just like
    with anything else at Apple, contract approval can take a while, so you should
    probably fail out the contract information just to get it out of the way. That''s
    my style, and if it''s not yours, feel free to skip to the next section.'
  merge: -1
  pgno: 271
