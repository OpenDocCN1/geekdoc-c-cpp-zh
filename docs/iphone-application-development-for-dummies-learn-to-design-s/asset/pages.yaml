    # # A Bug


    In the spirit of making this real-world exercise and not some piece of theory,
    I have to confess when I was testing this application for the final time, three
    days before the final, final chapters were due, I found a bug. It doesn''t get
    much more real-world than that, does it?


    When I replaced the label with the Web view, there was an unintended consequence
    (the polite way of saying I introduced a logic error in my code).


    The way that I handled dismissing the keyboard and restoring the view when the
    user touched the screen (see Chapter 8) was by capturing the touches that were
    passed to the view controller in `touchesBegan:` :


    Even worked if the user touched the label, because the label passed the touches
    on. But while the Web view does (It captures can detect when you touch a Web or
    Phone Link and load the URL or initiate the dialing of the number.) That meant
    that if the user happened to touch the screen in the Web view I just added — say,
    to indicate that he or she was done entering the number — `touchesBegan:` : in
    the controller would never be invoked.'
