    Dictionaries manage keys and values. Each of these key-value pairs is an entry.
    Each entry has two objects; one object represents the key, and a second object
    is that key''s value. An NSDictionary manages a static array — an array whose
    keys and values can be added to or deleted (although individual elements can be
    modified).


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_168_0.png)


