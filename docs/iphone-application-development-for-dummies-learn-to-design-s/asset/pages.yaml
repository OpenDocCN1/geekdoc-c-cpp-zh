  md: '# Chapter 1: Creating Killer iPhone Applications


    +   - Getting around a city, especially an unfamiliar one


    +   - Finding any special events happening while you''re in the city


    +   - Handling traveler''s tasks — such as making phone calls, tipping, or finding
    a bank or ATM — with aplomb


    +   - Checking the current weather and the forecast


    +   - Staying safe in unfamiliar territory — places you shouldn''t, what to do
    if you get in trouble, and so on


    This is only a partial list, of. I get into this aspect of application design
    in more detail when I take you through the design of MobileTravel411.


    I suppose there are other ways to divide the tasks, but anything different would
    be ignoring the user''s mental model — which would mean the application would
    not meet some of the user''s expectations. It would be less pleasant to use because
    it would impose an unfamiliar way of looking at things instead of building on
    the knowledge and experiences those users have already.


    When possible, model your application''s objects and objects and actions in the
    real world. For example, the iPhone has a set of iPod-style playback controls,
    tapping controls to make things happen, sliding on-off switches, and flickering
    through the data shown on Picker wheels. All of these are based on physical counterparts
    in the real world.


    Your application''s text should be based on the target user. For example, if your
    user isn''t steeped in technical jargon, avoid it in the user interface.


    This does not mean that you have to "dumb down" the application. Here are some
    guidelines:


    +   - If your application is targeted for a set of users who already use (and
    expect) a certain kind of specialized language, then sure, you can use the jargon
    in your application. Just do your homework first and make sure you use those terms
    right.


    For example, if your application is targeted at high-powered foreign-exchange
    traders, your application might use pip ("price interest point") — the smallest
    a price can move, as a stock price advances by one cent. In fact, a foreign exchange
    trader expects to see price movement in pips, and not only can you, but you should
    use that term in your user interface.


    +   - If your application requires the user to have a certain amount of specialized
    knowledge about a task in order to use your application, identify what that knowledge
    is upfront.'
