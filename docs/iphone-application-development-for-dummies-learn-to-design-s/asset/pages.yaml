    # The Controller object


    ReturnMeToViewController is the controller responsible for managing the application’s
    view — what the user sees and interacts with, including text editing. There are
    three methods I want to call your attention to:


    +   - viewDidLoad

    - viewWillAppear

    - viewWillDisappear


    viewDidLoad message is sent right after the view has been loaded from the nib
    file — check out Chapter 6 for a complete explanation of that loading process.
    This is the place where you insert your code for view initialization, which in
    this case means updating the text in the label to show the phone number.


    viewWillAppear: message is sent right before the view will appear. This is the
    place to insert your code for anything needed before the view becomes visible.


    viewWillDisappear: message is sent right before a view is dismissed or covered
    up. This is the place to insert your code for anything you need to do before a
    view may be released or freed.


    These methods are declared in the ViewController class and are invoked at the
    appropriate times by the framework. In this case, ReturnMeToViewController is
    derived from the ViewController class, I will override these methods. To do that,
    I simply implement a new method with the same name as one defined in the ViewController
    class in the ReturnMeToViewController implementation.'
