  md: "# Part IV: An Industrial-Strength Application\n\n# Creating the row model\n\
    \nAs good iPhone app developers know, the model-view-controller (MVC) design pattern\
    \ is the basis for the design of the framework you use to develop your applications.\
    \ In this design pattern, each element (model, view, or controller) concentrates\
    \ on the task at hand; it doesn't care much what the other elements are doing.\
    \ For table views, that means the method that draws the content doesn't know what\
    \ the content is — and the method that decides what to do when a selection in\
    \ a particular row is equally ignorant of what the selection is. The important\
    \ thing is to have a model object — one for each row to hold and provide information.\n\
    \nIn this kind of situation, you usually want to deal with the model-object business\
    \ by creating an array of models, one for each row. In our case, the object will\
    \ be a dictionary that holds the following three items:\n\n+   - The selection\
