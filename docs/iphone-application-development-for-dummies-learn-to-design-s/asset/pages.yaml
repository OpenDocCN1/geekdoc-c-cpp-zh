  md: '# # Chapter 19


    # # Ten Ways to Be a HappynDeveloper


    In This Chapter


    +   - How not to paint yourself into a corner

    - Avoiding “There’s no way to get there from here.”


    There here are lots of things you know you’re supposed to do, but you don’t because
    you think they’ll never catch up with you. (After all, not flossing won''t cause
    you problems until your teeth fall out from now, right?)


    But in iPhone application development, those things catch up with you early and
    often, so I want to tell you about I’ve learned to pay attention to from the very
    start in app development, as well as a few tips and tricks that lead to happy
    and healthy users.


    # # It Never Early Enough to StartnSpeaking a Foreign Language


    With the world growing flatter, and the iPhone available in more than 80 countries,
    the potential market for your app is considerably larger than just people who
    speak English. Localizing an application isn’t just difficult, tedious. Some of
    it you can get away with doing late in the project, but when it comes to the strings
    you use in your application, you’d better build them right — and build them from
    the start. The painless way: Use the NSLocalizedString macro (refer to Chapter
    14) from the very start, and you’ll still be a happy camper at the end.'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# Part V: The Part of Tens


    # Remember Memory


    The iPhone OS does not store "changeable" memory (such as object data) on the
    disk to free up space and then read it back later when needed. It also doesn''t
    have garbage collection — which means there is a real potential for memory leaks
    unless you tidy up your app. and follow the memory rules in Chapter 6 — in particular,
    these:


    +   - Memory management is creating pairs of messages. Balance every alloc, new,
    and retain with a release.


    +   - When you assign an instance variable using an accessor with a property attribute
    of retain, you now own the object. When you''re done with it, release it in a
    dealloc method.


    # Constantly Use Constants


    In the iPhoneTravel411 application, I put all my constants in one file. When I
    was developing the MobileTravel411 projects, I did the same. The why of it is
    simple: As I changed things during the development process, having to find constants
    made life much easier.


    # Don''t Fall Off the Cutting Edge


    The iPhone is cutting-enough that there are plenty of opportunities to expand
    its capabilities — and many of them are (relatively) easy to implement. You are
    also working with a very mature framework. So if you think something your app
    is going to be really difficult, check the framework; somewhere there you may
    find an easy way to do what you have in mind. If there isn''t a ready-made fix,
    consider the iPhone''s limited resources — and at least question that nifty task
    you had in mind is your app should be doing at all. Again, if you really need
    to track orbital debris with your iPhone app, go for it — someone needs to lead
    the way. Why shouldn''t it be?


    # Start by Initializing the Right Way


    A lot of my really messy code that I found myself re-doing up that reason I didn''t
    think through initialization. For example, adding initialization-like methods
    after objects are already initialized is a late late in the game, and so on.)
    Reread and heed Chapter 16; the initialization process is important in implementing
    view controllers and models.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Chapter 19: Ten Ways to Be a Happy Developer


    # Keep the Order Straight


    One of the things that can really foul your day as a developer is the order in
    which objects are called. If you expect an to be there (and it isn''t) or to have
    been initialized (and wasn''t), you may be in the wrong method. Copy Table 19-1
    and paste it into a file — and/or print it out and tack it up where you can easily
    find it.


    | Table 19-1 | The Natural Order of Things |

    | --- | --- |

    | Object | Method |

    | View Controller | awakeFromNib |

    | Application Delegate | applicationDidFinishLaunching: |

    | View Controller | viewDidLoad |

    | View Controller | viewWillAppear: |

    | View Controller | viewWillDisappear: |

    | Delegate | applicationWillTerminate: |


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_406_0.png)


    What trips up view controller (the one you see when the application starts) is
    sent before the applicationDidFinishLaunching: message. If you have a problem
    with that, what do you need to do in ViewDidLoad.


    # Avoid Mistakes in Error Handling


    A lot of opportunities for errors are out there; use common sense in figuring
    out which ones you should spend time on. For example, don''t panic over handling
    a missing directory in your code. On the iPhone, it''s supposed to be there; if
    it''s not, look for a bug in your program. If it''s really not there, then the
    user has problems, and you probably won''t be able to do anything to avert the
    oncoming hassle.


    There are, however, some potential pitfalls you have to pay attention to, such
    as these two ones:


    +   - Your app goes out to load something off the Internet, and (for a variety
    of reasons) the item isn''t there or the app can''t get to it.

    - An object can''t initialize itself (for a similar range of perverse reasons).'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# 386 Part V: The Part of Tens


    When, not if, those things happen, your code and your user interface must be able
    to deal with the error.


    # Remember the User


    I''ve been singing this song since Chapter 1, and I''m still singing it now: Keep
    your app simple and easy to use. Don''t build long pages that take lots of scrolling
    to get through, and don''t create really deep hierarchies. Focus on what the user
    wants to accomplish, and be mindful of the device limitations, especially battery
    life. And don''t forget international roaming charges.


    In other words, try to follow the Apple''s iPhone Human Interface Guidelines,
    with all the other documentation in the iPhone Dev Web site at http://developer.apple.com/iphone/
    under the iPhone Reference Library section — Required Reading. Don''t even think
    about bending those rules until you, really understand them.


    # Keep in Mind that the Software Isn''t Finished Until the Last User Is Dead


    If there is one thing I can guarantee about app development, it''s that Nobody
    Gets It The First Time. The design for MobileTravel411 evolved over time, as I
    learned the capabilities and intricacies of the platform and the impact of my
    design choices. Object-orientation makes your application (not to mention fixing
    bugs) easier, so pay attention to the principles.


    # Keep It Fun


    When I started programming the iPhone, it was the most fun I''d had in years.
    Keep things in perspective: Except for a few tedious tasks (such as provisioning
    and getting your application into the App Store), lo, I prophecy: Developing iPhone
    apps will be fun for you, so. Don''t take it too seriously.


    > the fun part at 4 a.m., when you''ve spent the last hours looking for a bug.
    Here''s a handy way to do that: My editor here by Wiley told me he knows someone
    who downloaded an iPhone app with little buttons on-screen like the holes on an
    ocarina; the idea is to blow into the iPhone and play it way. She''s organizing
    an iPhone virtual-quasar quartet. Imagine them playing "Wild Thing" — that''ll
    keep things in perspective.'
