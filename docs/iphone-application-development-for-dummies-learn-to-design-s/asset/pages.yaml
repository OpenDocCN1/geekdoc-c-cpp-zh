    # # Working through your button code


    If you add a button to your interface, you need to add a method to handle those
    times when somebody decides to actually tap the button — the *action*, in other
    words.


    Okay, it''s time to start. First, you''ll need to add the action method to the
    interface (as shown in Listing 11-1). You''ll do this in the ReturnMeToViewController.h
    file.


    # ### Listing 11-1: Add the action


    ```

    @interface ReturnMeToViewController : UIViewControllern<UITextFieldDelegate>{


    IBIBOutlet UITextField *textField;

    IBIBOutlet UILabel *label;

    BOOL moveViewUp;

    CGFloat scrollAmount;

    NSString *callNumber;


    }


    @property (nonatomic, retain) UITextField *textField;

    ```

    ```


