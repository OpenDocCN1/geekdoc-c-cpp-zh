  md: '# Chapter 1: Creating Killer iPhone Applications


    The iPhone OS is particularly unforgiving when it comes to memory usage. When
    you run out of memory, it will simply shut you down.


    This just goes to show that not *all* limitations can be exploited as “features.”


    # A Compelling User Experience


    When you''ve got a handle on the possibilities and limitations of the iPhone,
    your imagination is free to soar to create a compelling user experience. Which
    reminds me: It''s worth considering what “compelling user experience” really means.


    For openers, a compelling user experience has to result from the interaction of
    several factors:


    +   - Interesting, useful, plentiful content

    - Powerful, fast, versatile functionality

    - An intuitive, well-designed user interface


    # Compelling content


    As said earlier, there are a lot of different kinds of applications on the iPhone.
    What most of the really good ones have in common is focus. They address a well-defined
    task that can be done within a time span that is appropriate for that task. If
    I need to look something up, I want it right now! If I am playing a game while
    waiting in line, I want it to be of short duration, or broken up into a series
    of short and enchanting steps.


    The application content itself then, especially for here-and-now applications,
    must be streamlined and focused on the fundamental pieces of the task. Although
    you can provide a near-infinity of details to get a single task done, here''s
    a word to the wise: Don''t. You need to extract the essence of each task; focus
    on the details that make a difference.


    Here is an example: The other night, my wife and I were standing with friends
    inside the lobby of a movie theater, trying to decide where to go some dinner.
    It was cold (at least by California standards), but we wanted to walk to the restaurant
    from the theater. We had two iPhones, switching from application to application,
    trying to get enough information to make a decision. None of the applications
    gave us what we really needed — restaurants ranked by distance and type, with
    reviews and directions.'
