  md: '# 322 Part IV: An Industrial-Strength Application


    To kick off the process, you will first need to decide what you want to see in
    each view whenever the user selects a particular row in the main view. You''ll
    also need to decide where that information is going to be located. You have a
    number of options here. It can be a program resource (kind of like a local file,
    I''ll get to later), a Web page, or data located on a server on the Internet.
    To ease your mind, I''ll show you how to work with all three. And, as you started
    to do in Chapter 15, you''ll also have to make some decisions about what you want
    to do if the user is offline.


    My examples in this chapter are going to implementing the Currency, Weather, and
    Heathrow selections for the iPhoneTravel411 application, with an introduction
    to the Map selection that may surprise you. I cover the Map selection in detail
    17. To see the full listings of each of those, you''ll have to go to my Web site
    — www.nealdstein.com at this stage of the game, the listings have gotten so big
    that it would be a bear for you to flip back and forth between them in printed-text
    format. Having them in electronic form also means that, if you download them,
    you can create an Xcode project and work and experiment with changing parameters
    or even logic to see what happens — both are very helpful in learning what''s
    going on.


    You''ll work with the project in the folder named iPhoneTravel411 Chapter 16,
    which will have the code for the finished application through Chapter 16. The
    folder iPhoneTravel411 Chapter 17 will have the code for the complete application.


    Let''s go to work.


    # Specifying the Content


    If the user selects Currency from the main view in the iPhoneTravel411 application,
    or she will see some basic information about exchange rates, as illustrated in
    Figure 16-1. Since this information changes rarely (if ever), I''m going to include
    this information in the application. The way to do this is to include it as a
    resource, which I will explain in a later section. The user sees will be the same
    whether the user is online or in stored data mode.


    If the user selects Weather from the main view, what the user sees depend on whether
    the device is online or in stored data mode. If the device is offline, the user
    sees a Web page from a Web site with the weather information, as illustrated in
    Figure 16-2 (left). When in stored data mode, the user gets a message stating
    that weather data is unavailable when offline, as you can see in Figure 16-2 (right).'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Chapter 16: Creating Controllers and Their Models


    If the user selects Heathrow from the main view, he or sees what''s illustrated
    in Figure 16-3: a view of one particular means of transportation (Heath Express,
    for example) with tabs that will enable her or him to look at the others. When
    the user is online, the application gets this off a server on the Internet where
    I (personally) keep the (up-to-date) information. The only difference between
    being online and being in stored mode (offline) is the freshness of the data.
    In stored mode, what the user sees is a copy of the information that the application
    saved the last time the user was online.


    If the user selects Map from the main view, he or sees what''s illustrated in
    Figure 16-3: a map of the destination and some other features I cover in Chapter
    17. To see a map, the user must be online (at least in this implementation). When
    in stored mode, the user gets a message stating that data is unavailable offline.


