  md: '# 360 Part IV: An Industrial-Strength Application


    A region is a map view property that specifies four things (as illustrated in
    Figure 17-3).


    +   region.center.latitude specifies the latitude of the center of the map.


    +   region.center.longitude specifies the longitude of the center of the map.


    For example, if I were to set those values as


    ```

    region.center.latitude = 51.471184

    region.center.longitude = -0.4525242;

    ```


    the map of you would be at Heathrow airport.


    +   region.span.latitudeDelta specifies the north-to-south distance (in degrees)
    to display on the map. One degree of latitude is always approximately 111 kilometers
    (69 miles). region.span.latitudeDelta = 0.0036 specifies a north-to-south distance
    on the map of about a quarter of a mile. Latitude north of the equator have positive
    values, and latitudes of the equator have negative values.


    +   region.span.longitudeDelta specifies the east-to-west distance (in degrees)
    to display on the map. Unfortunately, the number of miles in one degree of longitude
    varies by the latitude. For example, one degree of longitude is approximately
    69 miles at the equator but shrinks to 0 miles at the poles. Longitudes east of
    the zero meridian (by international convention, the zero or Prime meridian passes
    through the Royal Observatory, Greenwich, in east London) have positive values,
    and longitudes east of the zero meridian have negative values.


    When the span values provide an implicit zoom value for the map, the actual region
    you see displayed may not equal the span you specify because the map will go to
    the zoom level that fits the region that is set. This also means that if you just
    change the center coordinate in the map, the zoom level may change distances represented
    by a span change at different latitudes and longitudes. To account for that, smart
    developers at Apple included a property you can set that will change the center
    coordinate without changing the zoom level.


    ```

    @property (nonatomic) CLLocationCoordinate2D

    centerCoordinate

    ```


    When you change this property, the map is centered on the new coordinate and updates
    span to maintain the current zoom level.


    That CLLocationCoordinate2D type is something you''ll be using a lot, so I''d
    like to explain that before I take you any further.'
