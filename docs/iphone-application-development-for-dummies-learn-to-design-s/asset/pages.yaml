    # Gestures


    On the real device, a gesture is something you do with your fingers to make something
    happen in the device, like a tap, or a drag, and so on. Table 4-1 shows you how
    to simulate gestures using your mouse and keyboard.


    | Table 4-1 Gestures in the Simulator |

    | Gesture | iPhone Action |

    | Tap | Click the mouse. |

    | Touch and hold | Hold down the mouse button. |

    | Double tap | Double-click the mouse. |

    | Swipe | 1. Click where you want to start and hold the mouse button down.

    2. Move the mouse in the direction of the swipe and release the mouse button.
    |

    | Flick | 1. Click where you want to start and hold the mouse button down.

    2. Move the mouse quickly in the direction of the flick and then release the mouse
    button. |'
  merge: -1
