  md: '# Chapter 14: Setting the Table


    For the iPhoneTravel411 application, I''m going to show you the table-of-contents
    approach; in Chapter 18, I direct you to some Apple-supplied sample code that
    deals with data hierarchies.


    Move from one content view to a new (content) view, first you need to create a
    new view controller for that view; then you launch it and it creates and installs
    the view on the screen. But you also have to give the user a way to get back to
    the main view!


    Brass-tacks time: What kind of code-writing gymnastics do you have to do to get
