  md: '# Chapter 6: While Your Application Is Running


    3. The system displays an alert panel with information about the event.


    The user can choose to ignore the event or respond to it.


    4. If the user ignores the event, the system sends your application delegate applicationDidBecomeActive:
    message and resumes the delivery of touch events to your application.


    You can use this delegate to restore the application to the state it was in before
