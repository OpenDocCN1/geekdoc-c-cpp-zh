    # Container views


    Container views are a technical (Apple) term for content views that do more than
    just lie there on the screen and display your controls and other content.


    The UIScrollView class, for example, adds scrolling without having to do any.


    UITableView inherits its scrolling capability from UIScrollView and adds the ability
    to display lists and respond to the selections of an item in list. Think of the
    Contacts application (and a host of others). UITableView is one of the primary
    navigation views on the iPhone; you’ll work a lot with table views starting with
    Chapter 13.


    Another container view, the UIToolbar class, contains button-like controls and
    you find them everywhere on the iPhone. In Mail, for example, you touch an icon
    in the bottom toolbar to respond to an e-mail.


    # Controls


    Controls are the fingertipfriendly graphics you use extensively in a typical application’s
    user interface. Controls are actually subclasses of the UIControl superclass,
    a subclass of the UIView class. They include touchable items like buttons, text
    fields, sliders, and switches, as well as text fields which you enter.


    Controls make heavy use of the Target-Action design pattern, which I’ll get to
    soon. (I talk more about controls and how they fit into the Target-Action pattern
    in Chapter 11.)


    # Display views


    Think of display views as controls that look good, but don’t really do anything
    except, well, look good. These include UIImageView, UILabel (which I use in Chapter
    5 to display the ReturnMe application’s phone number), UIProgressView, and UIActivityIndicator.'
