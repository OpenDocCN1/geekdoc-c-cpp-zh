    Observing low-memory warnings

    When the system dispatches a low-memory notification to your application, it is
    something you must pay attention to. If you don''t, it is a reliable recipe for
    disaster. (Think of your low-fuel light going on as you approach a sign says "Next
    services 100 miles.") UIKit provides several ways of setting up your application
    that you receive low-memory notifications:


    +   * Implement the applicationDidReceiveMemoryWarning: method of your application
    delegate. Your application delegate could then release any data structure or objects
    it owns — notify the objects to release memory they.

    * Override the didReceiveMemoryWarning: method in your custom UIViewController
    subclass. The view controller could then release views — or even other view controllers
    that are off-screen.

    * Register to receive the UIApplicationDidReceiveMemoryWarning Notification: notification.
    A model object could then release data structures or objects it owns that doesn''t
    need immediately and can re-create later.'
