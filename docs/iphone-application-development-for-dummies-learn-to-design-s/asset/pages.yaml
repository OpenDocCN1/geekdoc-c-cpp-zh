    And replacing it with code that creates an HTML-formatted string.


    To start, you need to create a formatted HTML string, which surrounds the same
    appDelegate.savedNumber with the formatting information. Notice the appDelegate.savedNumber
    buried here:


    ```

    htmlString = `<div style="font-family:Helvetica, Arial, sans-serif; font-size:14pt;\align=center\">

    htmlString = [NSString stringByAppendingString:appDelegate.savedNumber];

    htmlString = [NSString stringByAppendingString:@"<span>];`

    ```


    To create the HTML string with the saved number in it, I use the stringBy-AppendingString:method
    — which creates a string by adding one after another. The only tricky here is
    that I had to use the backslash character before the embedded quotes in the HTML
    string.


    I won’t go into the HTML here. If you want to delve further into HTML, feel free
    to check out HTML, XHTML & CSS For Dummies by Ed Tittle and Jeff Noble.


    Then simply tell the View to load the HTML string:


    ```

    webView loadHTMLString:htmlString baseURL:nil;

    ```


    Here the loadHTMLString:method does exactly what it needs to do — it takes a string
    (with HTML formatting information embedded) and loads it into the Web View. Here’s
    a closer look at the method’s arguments:


    +   - The first argument, htmlString is the string I just formatted. Nothing surprising
    there.

    - The second argument, baseURL is an NSURL object. An NSURL object, to no one’s
    surprise, is an object that contains either a Web site or a local file. (It’s
    not necessary here since you’re not telling the View access to a URL)


    In effect, Listings 11-6, 11-7, and 11-8 all show you doing the same thing — in
    different places.


    Even though the HTML strings in the listings this span multiple lines, you can’t
    do that in Xcode. You’ll get errors such


