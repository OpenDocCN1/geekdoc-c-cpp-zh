  md: '# Chapter 3: Enlisting in the Developer Corps


    # Exploring the iPhone Dev Center


    I spend some time later in this section talking a little bit about some of the
    resources available to you in the iPhone Dev Center, but for the moment, let''s
    focus on what you''re really after. I''m talking about the iPhone SDK 3.1 download
    that you''ll see in Figure 3-4 when you scroll to the bottom of the iPhone Dev
    Center.


    The SDK includes a host of tools for you to develop your application. Here''s
    a handy list to help you keep them all:


    +   Xcode: This refers to Apple''s complete development environment, which integrates
    all these features: a code editor, build system, graphical debugger, and project
    management. (I introduce to the code editor''s features more detail in Chapter
    7.)


    +   Frameworks: The iPhone has multiple frameworks help make it easy to develop.
    Creating an application-specific behavior to a framework. The frameworks do all
    the rest. For example, UIKit provides fundamental code for building your application—the
    required behavior, classes for windows, views (including those that display text
    and Web content), controllers and viewers. (All of the things I covered in Chapter
    2, in other words.) The UIKit framework also provides interfaces to core location
    data, the user''s contacts and photo library, accelerometer data, and the iPhone''s
    built-in camera.


    +   Interface Builder: I use Interface Builder in Chapter 5 to build the interface
    for ReturnMeTo. But Interface Builder is more run-of-the-mill program that builds
    graphical interfaces. In Chapter 7, I show you how Xcode and Interface Builder
    work together to give you ways to build (and automatically create at runtime)
    the interface—as well as to create objects that provide the infrastructure for
    your application.


    +   iPhone Simulator: The simulator allows you to debug your application and do
    some testing on your Mac by simulating the iPhone. The Simulator will run most
    iPhone programs, but it doesn''t support hardware-dependent features; I give you
    a rundown on the Simulator in Chapter 4.


    +   Instruments: The Instruments application lets you measure your application
    metrics while it is running on a device. It gives you a number of performance
    metrics, including those for testing memory and network use. It will also work
    (in a limited way) on the iPhone Simulator, and you can test some aspects of your
    design there.'
