    Each of these strategies gives a different part of your application a chance to
    free up the memory it no longer needs (or doesn''t need right now). As for how
    you actually get these strategies working for you, I will mention a strategy for
    implementing the view controller''s `didReceiveMemoryWarning`: in Chapter 14,
    this is something that is dependent on your application''s architecture. That
