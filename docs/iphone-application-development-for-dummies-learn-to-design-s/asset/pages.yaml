  md: '# Chapter 5: Building the User Interface


    # # Adding Graphics and the Rest of the Elements


    All background color and text make Jack a dull boy, so you''ll definitely want
    to add some graphics to keep Jack''s (or Jill''s) interest. Originally, I created
    my own little iPhone graphic (I''ll explain why I didn''t use it in Chapter 12),
    but instead I am using a royalty-free image (I found on the Internet), and I will
    show you how to get it safely into an application. (I''ll admit that I didn''t
    give up a promising career as a graphic artist to become a software developer,
    but it''s the thought that counts, right?)


    To get an image placed in your application, you first need (well, yeah) an image.


    The preferred format for the image is .png. Although most common formats will
    display correctly, Xcode optimizes .png images at build time to make them the
    fastest and most efficient image type for use in applications.


    After you have imported, do the following:


    +   1. Back in Xcode, drag the graphics file into the Resources folder for your
    project window, as shown in Figure 5-8.


    Xcode asks whether you want to make a copy of the icon file. The advantage of
    using a pointer is that if you modify the image later, Xcode will use that modified
    version. The disadvantage is that Xcode will not be able to find the image if
    you move it.


    I''m all for copying.


