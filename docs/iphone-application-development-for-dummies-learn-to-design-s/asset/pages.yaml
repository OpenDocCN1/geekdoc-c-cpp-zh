  md: '# 34 Part I: Getting Started


    As you will see, there are two ways you need to think about views. From the user
    perspective, the views sit on top of each other. From a programming perspective,
    the views that are on top of the windows are visually subviews inside the window
    view. I''ll explain that more as we continue.


    # What views do


    Views are the main way for your application to interact with a user. This interaction
    happens in two ways:


    +   * Views display content. For example, making drawing and animation on-screen.

    * In essence, the View object displays the data from the Model object.

    * Views handle touch events. They respond when the user touches a button, for
    example.

    * Handling touch events is part of a responder chain (a special logical sequence
    detailed in Chapter 6).


    # The view hierarchy


    Views and subviews create a view hierarchy. There are two ways of looking at it
    (no pun intended this) — visually (how the user perceives it) and programmatically
    (how you create it). You must be clear about the differences, or you will find
    yourself in a state of confusion that resembles Times Square on New Year''s Eve.


    Looking at it, the window is at the base of this hierarchy with a content view
    on top of it (a transparent view that fills the window''s Content rectangle).
    The content view displays information and also allows the user to interact with
    the application, using (preferably standard) user-interface items such as text
    fields, buttons, controls, and bars.


    In your program, relationship is different. The content view is added to the window
    view as a subview.


    +   * Views added to the content view become subviews of it.

    * Views added to the content view become the superviews of any views added to
    them.

    * A view can have one (and only one) supervisor and zero or more subviews.


    It seems counterintuitive, but a subview is displayed on top of its parent view
    (that is, on top of its supervisor). Think about this relationship as containment:
    a supervisor contains its subviews. Figure 2-3 shows an example of a view hierarchy.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_55_0.png)


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_55_1.png)'
