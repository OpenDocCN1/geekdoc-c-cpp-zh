    — usually a disclosure indicator.


    In this case, use UITableViewCellCellAccessoryDisclosureIndicator (the one shaped
    like a chevron). It lets the user know that tapping this entry will result in
    something (hopefully wonderful) happening — the display of the current weather
    conditions, for example.


