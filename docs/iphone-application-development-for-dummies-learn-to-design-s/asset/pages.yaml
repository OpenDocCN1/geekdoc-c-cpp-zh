    # Saving and Restoring State


    When the user taps the Home button, the iPhone OS terminates your application
    and returns to the Home screen. The applicationWillTerminate method is called,
    and your application is terminated — no ifs, ands, or buts. That means you have
    to save any unsaved data — if you want to restore the application to its previous
    state the next time the user launches. Now, in situations like this one, you have
    to use common sense to decide what state really means. Generally, you wouldn''t
    need to restore the position where the user last stopped in a scrollable list,
    for example. For purposes of explanation, I chose to save the last category view
    that the user selected in the main table view, which corresponds to a row in a
    section in the table view. You, the reader, might also consider saving that last
    view that was selected in that category.'
