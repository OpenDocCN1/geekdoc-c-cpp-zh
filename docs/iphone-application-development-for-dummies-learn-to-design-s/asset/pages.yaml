    # iTunes Connect


    iTunes Connect is a group of Web-based tools that enables developers to submit
    and manage their applications for sale via the App Store. It''s actually the very
    same set of tools that the other content providers — the music and video types
    — use to get their content into iTunes. In iTunes Connect, you can check on your
    contracts, manage users, and submit your application with all its supporting documentation
    — the *metadata*, as Apple calls it — the App Store. This is also where you get
    financial reports and daily/weekly sales trend data (yealy).


    Your stopping point is the App Store, Logo Licensing, and Affiliate Program page
    (shown in Figure 12-11). Here''s how you get there:


    +   * Select the App Store tab in the Distribution section of the Developer Portal.


    (Select Learn More under the App Store heading if you don''t see what I have in
    Figure 12-11.)'
