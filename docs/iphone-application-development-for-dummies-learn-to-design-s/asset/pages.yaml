    # Managing the keyboard


    When the user taps a view, that view becomes the first responder — the first object
    in the responder chain given the opportunity to respond to an event. (For more
    responders and responder chains, see Chapter 6.1) If the view is a text field
    (or any other object that has editable text), then editing session starts, and
    the keyboard is displayed automatically — you don''t have to lift a finger to
    make the keyboard.


    Return or Done button on the keyboard or, in this case, when the user touches
    the view.


    To dismiss the keyboard, you send the resignFirstResponder message to the text
    field — the initial responder. When the text field resigns, it is no longer the
    responder — just like Nixon was no longer president of the United States after
    he resigned.


    But just because the keyboard displayed automatically doesn''t mean that the keyboard
    will be dismissed automatically. In fact, it is your responsibility to dismiss
    the keyboard at the appropriate time, when the user taps the


    This may sound a bit convoluted, but it''s the only way to dismiss the keyboard.
    You can send a message to the keyboard directly — as in, “Hey, you''re fired.
    Pack your things and go!” You can only make the keyboard disappear by having it
    resign first-responder status of the text field.


    # Polishing the Chrome and Adding the Vinyl Pinstriping


    It could come as no surprise to you that the last of the last section — the aptly
    named textFieldShouldReturn: method — is a method within a particular context,
    just like the applicationDidFinishLaunching: and applicationTerminate: methods
    were also methods within a protocol. In this, the textFieldShouldReturn: method
    is a member of the UITextFieldDelegate protocol — the protocol that sets the rules
    for messages to a text field delegate as part of editing the sequence.


    Now, properly declare methods that can be implemented by any class. In response
    to certain events, the framework checks whether a delegate that implements a certain
    method — and if there is, it will invoke that method. If you have your ReturnMeToViewController
    class adopt the UITextFieldDelegate and then implement the textFieldShouldReturn:
    method, the UITextFieldDelegate protocol kicks into action and the textFieldShouldReturn:
    is invoked automatically.


    Sounds great! But do you have to jump through a few hooks to have your ReturnMeToViewController
    class adopt the UITextFieldDelegate protocol. The bird''s-eye view in two easy
    steps:


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_177_0.png)'
