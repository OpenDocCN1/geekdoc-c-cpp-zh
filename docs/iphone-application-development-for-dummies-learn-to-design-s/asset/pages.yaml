  md: '# 128 Part III: From “Gee, That’s a Good Idea,” to the App Store


    # Objective-C properties


    As you''ll soon discover, you''re going to use properties a lot. In the previous
    section, I had you blindly follow me and add the properties. But by now you''ve
    probably figured out that I don''t believe you should be doing things blindly,
    so in this section, I get to explain what you need to know about properties.


    Now, you may remember that, in object-oriented programming, a class''s instance
    variables are tucked away inside an object and shouldn''t be accessed directly.
    If you need to create accessor methods for other objects in your program, for
    that particular instance variable. (This will sound familiar from the previous
    section.)


    For example, in Chapter 9, you''re going to add an instance variable saved Number
    to the ReturnMeToAppDelegate. You''ll do that something to the phone number someone''s
    to call when he or finds your lost iPhone. The ReturnMeToAppDelegate saves that
    when the application terminates, and loads when it launches. The ReturnMeToViewController
    needs access to that to display in the view, and needs to update it when the user
    enters a new number.


    The methods that provide access to the instance variables of an object are called
    accessor methods, and effectively they get (using a getter method) and set (a
    setter method) the values for an instance variable. Although you could code those
    methods yourself, it can be rather tedious. This is where properties come in.
    The Objective-C Declared Properties feature provides a simple way to declare and
    implement an object''s accessor methods. The compiler can synthesize accessor
    methods for you, according to the way you told it in the property declaration.


    Objective-C gets the getter and setter methods for you using an @property declaration
    in the interface file, combined with the @synthesize declaration in the implementation
    file. The default names for the getter and setter methods with a property are
    whateverThePropertyName: for the getter and setWhateverThePropertyNameIs: for
    the setter. (You replace it in italics with the actual property name). For example,
    the accessors generated in our ReturnMeToApplication are textField as the getter
    and setTextField: as the setter. Similarly, the names for the labelors are label
    and setLabel: for the getter and setter, respectively.


    All that being said, at the end of the day, you''ll need to do three things in
    your code to have the compiler create accessors for you:


    +   1. Declare an instance variable in the interface file.


    +   2. Add an @property declaration of that instance variable in the same interface
    file (usually with attributes nonatomic and retain).'
