  md: '# 170 Part III: From “Gee, That’s a Good Idea,” to the App Store


    Saving user entry and then controlling the editing process are two good skills
    to master when you''re developing iPhone applications. By the end of this chapter,
    you should be an old hand at both skills.


    # Saving User-Entry Data


    The iPhone is, first and foremost, a phone; as such you would expect it to be
    able to deal with numbers — phone numbers, especially. So it’s quite reasonable
    for the user to expect the ReturnMeTo application to save phone numbers entered
    into the user-entry text field. (And quite frankly, what would the point of the
    application be if it didn’t?)


    The iPhone gives you three ways to save a phone number:


    +   - Save the number in a file: A perfectly respectable option, which we discuss
    in greater detail in Chapter 15.

    - Save the number in a database: iPhone has a built-in SQL database that’s efficient
    at storing and retrieving amounts of (structured) data.

    - Save the number as an application preference: The iPhone provides support for
    user preferences — allowing users to customize applications or keep track of configuration
    settings from launch to launch. (Hmm, the phone number to call if you lose your
    iPhone comes mind here.)


    So many choices. But we’re definitely going with Door #3. Let me explain why.


    # Preferences


    Most people these days have spent enough time around computers that they know
    what we mean when we throw the term “preferences” around. On your desktop, for
    example, you can set preferences at the system level for things like security,
    searing, printing, and file sharing — just to name a few. But keep in mind that
    preferences aren’t just a system-level thing; you can easily set preferences at
    the application level. You could, for example, set all sorts of preferences in
    Xcode — not to mention all preferences in your browser and word-processing programs.


    The latter are application-specific settings used to configure the behavior or
    appearance of an application. On the iPhone, application preferences are supported
    well, but instead of having to re-create a user interface for each separate application,
    the iPhone displays all application-level preferences through the system-supplied
    Settings application (its icon looks like a bunch of gears on your iPhone’s home
    screen). Okay, you don’t have to forego'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Chapter 9: Saving Data and Creating a Secret Button


    creating a separate settings feature in your application — but keep this in mind:
    Whatever separate settings feature you come up has to function within the framework
    of iPhone''s Settings application; in effect, the Settings application makes you
    color within the lines.


    What (guide)lines does the iPhone impose? Here''s a short summary:


    +   - If you have preference values that are typically configured once and rarely
    changed: Leave the task of setting preferences to the system Settings application.
    On an iPhone, this would apply to things like enabling/disabling Wi-Fi, setting
    wallpaper displays, setting up mail accounts, and any other preference you would
    want and then leave in place for a while.


    +   - If you have preference values that the user might want to change regularly:
    In this situation, you should consider having users the options in your application.


    The iPhone''s weather app is a good example: Let''s say I have this thing for
    Dubrovnik — where it happens to be 48° F as I am writing this — and I''d like
    to add it to my list of preferred cities that I want the app to keep taps on.
    To load Dubrovnik into the weather app, all I have to do is tap the info button
    at the bottom of the screen; the view will flip around, and I can add it to my
    list of cities. That''s a lot easier than going back to the home screen, launching
    the Settings application, adding the new city, and then launching the Weather
    application.


    The reason I'' how to use the Settings application to set user preferences — that
    actually comes in Chapter 15, in time — but because the iPhone has a built-in,
    easy-to-use class that lets you read and set user preferences — NSUserDefaults.
    It''s even used by the Settings application itself, which has graciously consented
    to let us peons use it as well — and I''m going to show you how to put that power
    to work so that your application can read and set user preferences.


    # The UserDefaults class


    You use UserDefaults to read and store preference data to a data base, using a
    key value, just as you''d access data from NSDictionary. (For more key-value pairs
    in general and NSDictionary see Chapter 8.) The difference is that NSUserDefaults
    data is stored in the file system rather than in memory — objects, after all,
    go away when the application terminates.


    By the way, don''t ask me why they stick Defaults in the name rather fewer letters,
    maybe — that''s the way it is. Just don''t let their naming idiosyncrasies confuse
    you.'
