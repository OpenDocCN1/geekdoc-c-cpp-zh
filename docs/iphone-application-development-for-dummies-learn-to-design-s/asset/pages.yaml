    id result = [object methodWithCount:count];

    ```


    Note that the results refer to line numbers. This is why I made a point of explaining
    how to turn on line numbers in Xcode in Chapter 4.


    As I''ve mentioned before, memory management is a big deal on the iPhone.


    Before you get your application into the App Store, or even run it on anyone''s
    iPhone, you need to make sure it''s behaving properly. By doing that I mean not
    only delivering the promised functionality, but also avoiding the unintentional
    misuse of iPhone resources. Keep in mind that the iPhone, as cool as it may well
    be, is nevertheless resource-constrained when it comes to using memory and battery
    life. Such restraints can have a direct effect on what you can do (and can''t)
    in your application.


    While the Static Analyzer can help you detect leaks, the real champ at doing that
    is Xcode Instruments application, which also lets you know how your application
    uses iPhone resources such as CPU, network, and so on.


    The Instruments allows you to observe the performance of your application while
    running it on the iPhone, and to a lesser extent, while running it on the Simulator.
    Here instrument means a specialized feature of the Instruments application that
    zeroes in a particular aspect of your app''s performance (such as memory usage,
    system load, disk usage, and the likes) and measures. What''s really neat, however,
    is the fact that you can look at these different aspects simultaneously along
    a timeline — and then store data from multiple runs, so you get a picture of how
    your application''s performance changes when you tune it.'
