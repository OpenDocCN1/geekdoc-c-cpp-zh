  md: '# Chapter 13: Designing Your Application


    +   Getting around the city: Same kind of pickle as getting and from the airport
    — what''s available and best for a traveler''s purposes? I once spent days in
    Barcelona before I realized there was a subway system.


    +   Seeing what''s happening right now in the city: Guidebooks are fine for visiting
    the sights, and I had not to re-create one on the iPhone. I would like to know
    if there''s anything special happening when I''m in some particular place at some
    particular time. Bastille Day in Paris can be fun if you know about the Bastille
    Day parade, and less of a hassle if you know not to cross the Champs-Élysées for
    a few hours.


    +   Knowing the practical day-to-day stuff: How do you make calls, out of, and
    within a given city? How much and when should I tip? What is acceptable and unacceptable
    behavior? For example, it might be impolite to eat or drink while walking down
    the street in Japan might not occur to someone from New City.


    +   Staying safe: Being informed of breaking news that could make things unsafe
    — large demonstrations or terrorist attacks, for example — would be high on my
    wish list. But even the more mundane things like the “dangerous” neighborhoods
    are important. What should you do in an emergency? A friend of ours had her passport
    stolen in Prague — at times like that, it would be nice to have the locations
    and phone numbers of embassies. This is stuff you would hardly ever need, but
    when you need it, you need right away.


    +   What to do before I go: In the past, I have forgotten to call my phone company
