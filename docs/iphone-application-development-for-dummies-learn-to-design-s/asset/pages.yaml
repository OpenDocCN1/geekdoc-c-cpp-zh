  md: '# About the Author


    **Neal Goldstein** is a recognized leader in making state-of-the-art and cutting-edge
    technologies practical for commercial and enterprise development. He was one of
    the first technologists to work with commercial developers at firms such as Apple
    Computer, Lucasfilm, and Microsoft to develop commercial applications using object-based
    programming technologies. He was a pioneer in moving that approach into the world
    for developers at Liberty Mutual Insurance, USWest (now Verizon), National Car
    Rental, and Continental Airlines, showing them how object-oriented programming
    could solve enterprise-wide problems. His book *Developing Object-Oriented Software
    for the Macintosh* (Addison Wesley, 1992), introduced the idea of scenarios and
    patterns to developers. He was an early advocate of the Microsoft .NET framework,
    and successfully introduced it into many enterprises, including Charles Schwab.
    He was one of the earliest developers of Service Oriented Architecture (SOA),
    and as Senior Vice President of Technology and the Chief Architect at Charles
    Schwab, he built an integrated SOA solution that spanned the enterprise, from
    desktop PCs to servers to network mainframes. (He holds three patents as a result.)
    As one of IBM’s largest customers, he introduced them to SOA at the enterprise
    level and encouraged them to head in that direction. He is currently leading an
    iPhone startup that is developing an application that will radically change how
    people can use iPhones to manage information.'
