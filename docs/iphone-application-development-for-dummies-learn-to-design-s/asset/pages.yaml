    # # Lowering the view when all is said and done


    The way we set up the ReturnMe application is that, after the user is entering
    the necessary text into the text field — in this case, a telephone number — the
    keyboard is supposed to disappear, and the view is meant to move back down to
    its original position. (If you remember, you added the capability to do this in
    Listing 8-6, and more specifically in Step 4 in the section "Moving the view.")
    As it happens, the UITextViewDelegate''s textFieldDidReturn: message is sent when
    the user taps the Return key on the keyboard, giving any functionality needed
    when the user is entering text. As you can see in Figure 8-6, this is the perfect
    place to add code that restores the view to its original position. The user is
    done editing, so all you have to dismiss the keyboard and restore the view to
    its original position. You do do that by adding the code in Listing 8-8 to the
    ReturnMeViewController.m file, right before the @end statement.


