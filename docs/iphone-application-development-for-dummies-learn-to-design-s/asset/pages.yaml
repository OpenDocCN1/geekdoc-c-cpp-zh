    Here''s the logic behind all cells lying around that you can use.


    +   1. **Determine if there are any cells around that you can use.**nAlthough
    a table view can display only a few rows at a time on iPhone''s small screen,
    the table itself can conceivably hold a lot more. A large table would use a lot
    of memory if you were to create cells for every row. Fortunately, table views
    are designed to reuse cells. As a view''s cells scroll off the screen, they''re
    placed in a queue of cells available to be reused.

    2. **Create a cell identifier that indicates what cell type you are using.** Add
    this to Constants.h file:


    ```

    #define kCellIdentifier "Cell"

    ```


    Table views support multiple cell types, which makes the identifier necessary.
    In this case, you need only one cell type, but sometimes you may want more than
    one.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_316_0.png)'
