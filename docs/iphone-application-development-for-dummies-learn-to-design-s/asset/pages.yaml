  md: '# Chapter 9


    # # Saving Data and Creating a Secret Button


    +   **In This Chapter**

    - Setting and accessing user preferences

    - Saving data in user preferences

    - Disabling and enabling text fields

    - Responding to user touches


    Putting together a great iPhone application, a big part of the whole involves
    getting your application to work well from the user interface perspective. Your
    potential user should be able to scroll the keyboard, with text fields, enter
    stuff, delete stuff, admire your fashion sense it comes to images and background
    color, and generally have a grand-old time exploring the corners of your app.


    Interfaces are important — so important, in fact, that most of the chapters so
    far in this book deal explicitly with how to set up a user-friendly interface
    — but interfaces are not the only things in the iPhone app. For your application
    to function as an application, it has to do application-like stuff. For example,
    it has to be able to save data entered by a user for the next time he she fires
    up. In this chapter, I tackle how to get your app to save data entered by the
    user. Again, I''m going to try out my ReturnMeTo application as means of imparting
    this little lesson in data saving.


    Wait! That''s not all! It occurred while I was showing people my handy ReturnMeTo
    application that showed my iPhone could accidentally enter a number in the text
    field — corrupting the crime scene, as it were and then wouldn''t know where to
    call me. So I decided that after the user saved a number for the first time, I
    would make it a little more of a challenge to write over that data. If there''s
    a saved number, I''m going to disable the text field — and require the user to
    know where to tap in the content view to enable it.'
