  md: '# Dedication


    To my mother, Anne, who would have loved to see this second edition.


    To my brother, Jay, who has continued to be a pillar of support and enabled me
    to stay focused.


    To my children, Sarah and Evan, who have always inspired me and never let me get
    too carried away with my own magnificence (especially after the success of the
    first edition).


    Most of all, to my wife Linda, who understands my absences, even when I am in
    the same room, and has enthusiastically accompanied me on all my adventures. She
    deserves an award (a Nobel Prize will do) for living through, not one, not two,
    but three books in one year with equanimity and grace.'
