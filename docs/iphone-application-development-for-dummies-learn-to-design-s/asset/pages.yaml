  md: '# 262 Part IV: An Industrial-Strength Application


    +   - Limited computer power, memory, and battery life: As an application designer
    for the iPhone, you have to keep these issues in mind. The iPhone OS is particularly
    unforgiving when it comes to memory usage. If you run out of memory, the iPhone
    OS will simply shut your app down.


    +   - Connection limitations: There’s always a possibility that the user may be
    out of range, or on a plane, or has decided not to pay exorbitant roaming fees,
    or is using an iPod Touch, which doesn’t have Internet access except via WiFi.
    You need to account for that possibility in your application and preserve as much
    functionality as possible. This usually means allowing the user to download and
    use the current real-time information, where applicable.


    Again, all of this is covered in the detail you need in Chapter 1 and throughout
    the book.


    Some of these goals overlap, of course, and that’s where the real challenges are.


    # Categorizing the problems and defining the solutions


    Because the app’s requirements — common sense — precluded scrolling through lots
    of information to get what I needed, I had to create a hierarchy — a way of ordering
    the information or functionality into groups that makes sense to the user. On
    desktop or laptop machines, features are often categorized by function, but given
    the way the iPhone is used (as in Chapter 1), categorizing by context makes more
    sense. (If you’re interested in the versus context discussion, check out my site
    at www.goldstein.com for more information.) Once I settled the information and
    functionality I needed when I was traveling, I grouped them into the following
    contexts.


    +   - Getting and using money: What is the country’s currency (including denominations
    and coins), and what’s the best way to exchange currency for it? I want to understand
    the costs of using credit cards versus an ATM card, or exchanging at a bureau
    of change. I also want to be able to understand how the dreaded VAT (value-added
    tax) really works.


    +   - Getting to from the airport: What choices do I really have when it comes
    to things terminal? What are the costs, advantages, and disadvantages — and logistics
    — of each? Do I have to buy a ticket in advance? How do I find said ticket? What
    is the schedule?'
