    how to use the Debugger to remove at least some of these obstacles. The Debugger
    works best for Case 2 (the runtime errors), but as I point out later, it can also
    help you track the logic errors in Case 3.


    # Using the Debugger


    In Figure 10-4, I have deliberately created a situation that will give me a runtime
    error: I am going to divide by zero — a mathematical no-no that any able-bodied
    fifth-grader would berate me for — which will enable me to show how to approach
    runtime errors in general.


    Here’s the drill: After introducing my boneheaded error while writing my code
    in Xcode, I chose Build<Run from Xcode Build.


    The application started up and immediately shut down, but the compiler was not
    enough to tell me what I was doing.


    You can see in the top of Figure 10-4 that I got a warning message Division by
    zero by a 2, which means another warning is there. In the bottom half of 10-4,
    I clicked on the 2, and it revealed a second warning, Unused variable I. Pay attention
    to those numbers since the subsequent message can help you precisely understand
    what the compiler is complaining about.


    Before you scoff and say that I should have caught such a basic error, okay, you’re
    right to — but I want to point out some things:


    +   - First, in the middle of development, I may have been pelted with compiler
    warnings that I didn’t really need to care of because they had no impact on the
    execution of the program. As a result, I might have noticed one more compiler
    warning that actually had an impact — a big one.


    +   - Second, if my app was a bit more complicated, I could conceivably up dividing
    by zero without realizing it. (Remember, stuff happens).


    +   - Finally, if you happen to save this code and debug it again, you won’t see
    the compiler warning in the status bar because there were no changes to that file
    — so it wouldn’t be recompiled. (This is definitely something to remember). This
    is one reason to set the Xcode Building preference Build Results Window: Open
    during builds: Always — it will continually remind you about those warnings.


    How can the Debugger help me determine the source of a runtime error this one?
    The next section gives you the details.'
