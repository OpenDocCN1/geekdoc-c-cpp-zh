    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_41_0.png)


    # The user interface — form following function


    Basing your application on how the user interacts and thinks about the world makes
    designing a great user interface easier.


    Don''t underestimate the effect of the user interface on the people who are trying
    to use it. A bad user interface can make even a great application painful to use.
    If users can''t quickly figure out how to use your application, or if the user
    interface is cluttered or obscure, they''re likely to move on and complain loudly
    about the application to anyone who will listen.


    Simplicity and ease are fundamental principles for all types of software—in iPhone
    applications, they are critical. Why? One word: multitasking. iPhone OS users
    are probably doing other things simultaneously while they use your application.


    The iPhone hardware and software is an outstanding example of following function;
    the user interfaces of great applications follow that principle as well. In fact,
    even the iPhone''s limitations (except for battery life) are a result of following
    the functional requirements of a mobile device user. Just think how the iPhone
    fulfills the mobile device wish list:


    +   - Small footprint

    - Thin

    - Light weight

    - Self-contained — no need for an external keyboard or mouse

    - Task-oriented


    It''s a pretty safe bet that part of the appeal of the iPhone to many people —
    especially to non-technical users (like most of my friends) — is aesthetic: The
    device is sleek, compact, and fun to use. But the aesthetics of an iPhone application
    aren''t just about how "beautiful" your application is on screen. Eye candy is
    all well and good, but how well does your user interface match its function —
    that, is its job?'
