    It''s not that I would actually expect you to use the Source and Disassembly option
    — at this point, I don''t. But sometimes, as you explore interfaces, end up not
    looking the way you used to. In my experience, this occurs because a different
    display option has been chosen — either by accident or because


    Examine the top-right pane in the Debugger window. You''ll see a display of the
    program''s variables. I''ve clicked the disclosure next to self and appDelegate,
    and you can see the appDelegate instance variables that you saw in the datatip
    in the Editor window — For example, namedNumber, which is (still) 650 555 1212,
    which is what you would expect. You can also see the instance variables for the
    ReturnViewController under self, which is under Arguments.


    This is for a couple of reasons:


    +   **Checking variables:** If the view is not showing the correct number, I can
    look in the Variable pane to see what value of the variable actually is. If the
    value is correct here, then I can conclude that either it gets changed by mistake,
    or I''m displaying something other than I intended to display.


    +   **Checking messages sent:** When you encounter the result of what some people
    call a "feature" and others a "design flaw" in Objective-C: For reasons, which
    are not particularly important here, Objective-C, unlike some other languages,
    allow you to send a message to a nil object without generating a runtime error.
    If you do, you should expect to subsequently see some sort of logic error, since
    a message to a nil object does nothing.


    Now, how I use the variable pane to help me understand that? If you look at an
    object reference instance variable and its value is 0x0, any messages to that
    object are simply ignored. So when I get a logic error, the first thing I''m going
    to check is whether any of the object references am using have 0x0 as their values,
    informing me that the reference was never initialized.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_216_0.png)'
