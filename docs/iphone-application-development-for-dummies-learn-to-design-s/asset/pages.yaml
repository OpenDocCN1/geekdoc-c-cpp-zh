    design.


    # Consistency with the user''s world


    Great applications are based on the world people — users — think and work. When
    you make your application a natural extension of the user''s world, it makes the
    application much easier and more pleasant to use — and to learn.


    Your users already have a mental model that describes your task software is enabling.
    The users also have their own mental models of how the devices work. At the levels
    of both content and user interface, your application must be consistent with these
    models if you want to create a superb user experience (which in turn creates loyalty
    — to your application).


    The user interface in MobileTravel41 was based on how people divide the experience
    of traveling. Here are typical categories:


    +   - Foreign currency — how it really costs and what''s the best way to convert
    and buy things abroad

    - Getting to and from the airport with maximum efficiency and minimum hassle


