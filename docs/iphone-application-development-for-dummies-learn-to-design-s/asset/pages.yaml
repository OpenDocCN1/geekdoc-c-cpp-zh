  md: '# Chapter 13: Designing Your Application


    # 269


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_290_0.png)


    Figure 13-6: Weather views.


    These second types of views (and all the views in the iPhoneTravel411 application)
    are Web views for some good practical reasons. First and foremost, some of the
    views must be updated regularly. If I want the current price and schedule of the
    Heathrow Express (or even last week) may not help me. I also want the most current
    information about what''s happening in the city I plan to visit.


    Web views, in that context, are the perfect solution; they make it easy to access
    data from a central repository on the Internet. (Client-server is alive and well!)


    As for other benefits of Web views, keep in mind that real-time access is always
    necessary — sometimes it''s perfectly fine to store some data on the iPhone. It
    turns out that Web views can easily display data that is locally stored — very
    handy. (You took advantage of that when building the ReturnMeTo application.)


