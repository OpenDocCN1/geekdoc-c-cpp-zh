  md: '# Chapter 15: Enhancing the User Experience 319


    Here''s what happens when a user makes a selection in the main view:


    +   1. Deselelect the row the user selected.


    ```

    [tableView deselectRowAtIndexPath:indexPathPath animated:YES];

    ```


    It stands to reason that you want your app to move on to a new view, you have
    to deselect the row where you are currently.


    +   2. Compute the offset (based on section and row) into the menu array.


    ```

    int menuOffset = (indexPath.section*kSectionRows) + indexPath.row;

    ```


    You need to figure out where your app want to land, right?


    +   3. Save the section and row that the user last tapped. I covered that in Step
    4 in the section, "Saving state information."


    +   4. Check to see whether the controller for that particular view has been created.


    ```

    UIViewController *targetController = [menuList objectAtIndex:menuOffset forKey:kController];

    if (targetController == nil) {

    ```


    +   5. If no controller exists, create and initialize a new controller if you
    should.


    I explain the mechanics of creating and initializing a new controller in Chapter
    16. As you can see, you''re going to use another switch state to get to the right
    controller.


    ```

    switch (menuOffset) {

    ```


    For many of the selections, you''ll always create a new controller.


    ```

    case 4:

    targetController = [[AirportController alloc] initWithWithDestination:destination
    identifier:1];

    break;

    ```


    But for some selections, like Weather, you have decided to inform a user online,
    you can''t deliver the quality of information (saved current weather conditions
    is an oxymoron). For other selections, Map for example, a network connection is
    required (right now no caching is available). In that case, you send an alert
    to the user (see Listing 15-12) informing him or her the selection that is unavailable.'
