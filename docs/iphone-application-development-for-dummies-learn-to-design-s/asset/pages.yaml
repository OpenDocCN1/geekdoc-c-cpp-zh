    # Geocoding


    But not being satisfied with seeing where I am on the map, I''d also like to know
    the address. (If I have the address, I could write some code to turn the iPhone''s
    current address into an Address Book contact, but I''ll allow you the pleasure
    of figuring that out.)


    Being able to go from a coordinate on a map is called reverse geocoding, and thankfully
    the ability to do that is supplied by the MapKit. Forward geocoding, (also called
    geocoding), which converts an address to a coordinate, does not come with the
    MapKit, although many free and commercial services are available.


    > Keep in mind that the location may not be accurate — remember horizontalAccuracy
    in the earlier "Going to the Current Location" section. For example, since my
    office is very close to my property line, my location sometimes shows up with
    my next-door''s address.


    Adding reverse geocoding to iPhoneTravel411 will enable you to display the address
    of the current location. Just follow these steps:'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# 372 Part IV: An Industrial-Strength Application


    1. Import the reverse geocoder framework into MapController.h, and have MapController
    adopt the MKReverseGeocoderDelegate protocol.


    ```

    #import MapKit/MKReverseGeocoder.h


    @interface MapController : UIView

    <MKReverseGeocoderDelegate> {

    ```


    2. Add an instance variable to hold a reference to the geocoder.


    ```

    MKReverseGeocoder *reverseGeocoder;

    ```


    You''ll use this to release the MKReverseGeocoder once you have the current address.


    3. Add the methods reverseGeocoder:didFindPlacemark: and reverseGeocoder:didFailWithError:
    to MapController.


    ```

    (void)reverseGeocoder:(MKReverseGeocoder *) geocoder

    didFindPlacemark:(MKPlacemark *) placemark {

    NSMutableString* addressString = [[NSMutableString alloc]

    initWithString:placemark.subThoroughfare];

    [addressString appendString:@"];

    [addressString appendString:placemark.thoroughfare];

    mapKey.userLocation.subtitle = placemark.locality;

    mapKey.userLocation.title = addressString;

    [addressString release];

    }


    (void)reverseGeocoder:(MKReverseGeocoder *) geocoder

    didFailWithError:(NSError *) error {

    NSLog(@"Reverse Geocoder Errored:%@", error);

    }

    ```


    The reverseGeocoder:didFindPlacemark: message to the delegate is sent when the
    MKReverseGeocoder object successfully obtains placemark information for its coordinate.
    An MKPlacemark object stores placemark data for a given latitude and longitude.
    Placemark data includes the properties that hold the country, state, city, and
    street address (and other information) associated with the specified coordinate,
    for example (several other pieces of data are available that you might want to
    examine):


    +   country: Name of country

    administrativeArea: State

    locality: City

    thoroughfare: Street'
