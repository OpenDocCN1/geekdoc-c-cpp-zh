  md: '# Chapter 12: Death, Taxes, and the iPhone Provisioning 247


    At the time I did that, I really didn''t think it was a big deal (this was early
    on in the process), but it is now.


    After fixing those of issues, you can now find ReturnMeTo in the App Store.


    So how do you get your app into the App Store? Actually, the Uploading Your Application
    to the App Store part is pretty easy. The hard part is collecting all the little
    bits of information you''ll need to enter into all the text fields in the upload
    page.


    Here''s an overview of the kind of information you''ll need (for more information,
    download the Developer Guide — see Figure 12-14):


    +   Metadata: The ever-present data about data. Here''s what Apple wants from
    you:


    +   Application Name: It must conform to guidelines for using Apple trademarks
    and copyrights. They take this very seriously, as evidenced by Apple sending a
    cease-and-desist order to my MSP when I tried to use iPhoneDev411 as my domain
    name. (A to the word: Don''t mess with Apple.)


    +   Application Description: When you go through the process of uploading your
    data, the field you have to paste into this will say you''re limited to 4,000
    characters. Apple suggests no more than 700.


    This is what users will see when they click on your app in the App Store, so it''s
    important that this description will be well written and point out all your app''s
    features.


    Don''t include HTML tags; they will be stripped out when the data is uploaded.
    One line breaks are respected.


    +   Device: Basically, we''re talking iPhone and/or iPod touch.


    +   Primary Category: There will be a drop-down menu from which to choose the
    primary category for your app. There are about 20 choices, ranging from Business
    to Social Networking to Utility Travel.


    +   Secondary Category: (Optional) Same categories as above.


    +   Rating Information: Later, you''ll be asked to provide additional information
    describing the content. You''ll see things like Cartoon or Fantasy Violence, Simulated
    Gambling, Mature/Sensitive Themes, and so on. For each type of content, you''ll
    need to describe the frequency — None, Infrequent/Mild, Frequent/Intense. This
    allows you to rate your applications for the purpose of parental controls on the
    App Store. Apple has strict rules stating that an app must not contain any obscene,
    pornographic, or offensive content. And by the way, it''s entirely up to Apple
    what is to be considered offensive or inappropriate.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_268_0.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: '+   * End License Agreement: (Optional) If you don’t know what this is, don’t
    worry. The legal document that spells out to the users what they’re agreeing to
    do in order to use your app. Fortunately, the iTunes Store has a standard one.
    By this time, I think it probably knows what it’s doing — but you should read
    it anyway before you use it.'
