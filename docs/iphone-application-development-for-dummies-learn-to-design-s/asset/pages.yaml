    # Upload your application and its data


    After you''ve set the wheels in motion, then you can go back to the iTunes Connect
    main page and upload your data. Click the Manage Your Applications link (refer
    to Figure 12-12) to call up the Manage Applications page shown in Figure 12-14.
    In that page, click the Add New Application button and go to town. Fill in all
    the blanks, using all that info I asked you to collect in the “What you''ll need
    to get your application into the App Store” section, earlier in the chapter. Along
    the way, you will upload your metadata and the application itself to Apple.'
