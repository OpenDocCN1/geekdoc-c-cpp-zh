    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_377_0.png)


    # Using MapKit


    One of the great features of iPhone 3.0 SDK and beyond is a new framework—MapKit.
    As you saw in Chapter 16, MapKit enables you to bring in a simple map, and also
    do things with your map without having to do much work at all.


    The map looks like the maps in the built-in applications and creates a seamless-less
    mapping experience across multiple applications.


    # MKMapView


    The essence of mapping on the iPhone is the MKMapView.subclass, and you can use
    it out of the box to create a world map. You use this class as-is to display map
    information and manipulate the map contents from your application. It enables
    you to center the map on a given coordinate, specify the size of the area you
    want to display, and annotate the map with custom information.


    You added the MapKit framework to the project in Chapter 16.'
