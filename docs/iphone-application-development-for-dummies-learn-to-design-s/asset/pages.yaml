    # A Lot Accomplished Very Quickly


    In a few pages, you''ve accomplished quite a bit. I want to emphasize, as you
    will see, that what I have done is not just a design. What you see here is the
    specification for “code” that will take what I have laid out in Interface Builder
    and create the objects that will implement it at runtime.


    I have to write code, however, if I want the application to actually do something.
    But before I get into that subject in detail, it is important that you understand
    how the application works at runtime — how the objects fit together and communicate.
    I explain what you need to know about that whole business in the next chapter.'
