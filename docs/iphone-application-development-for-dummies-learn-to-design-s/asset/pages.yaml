    View controllers implement the Controller component of the Model-View-Controller
    design pattern. These Controller objects contain the code that connects the application''s
    views to its Model objects. They provide the data to the view. Whenever the view
    needs to display something, the View controller gets out and gets what the view
    needs from the model. Similarly, view controllers respond to controls in your
    content view and may do things like tell the model to update its data (when the
    user adds or'
