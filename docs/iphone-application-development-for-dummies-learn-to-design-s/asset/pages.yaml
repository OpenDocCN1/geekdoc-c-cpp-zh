    # Respecting User Preferences


    15-1 shows you the Settings screen for my MobileTravel411 applica-tion. You can
    see that I''ve provisioned my app with three preferences.

    in this chapter, I show how to implement the most critical of these

    preferences — The Used Data option.


    Use Stored Data tells the application to use the last version of the data that

    it accessed, rather than going out on the Internet for the latest information.

