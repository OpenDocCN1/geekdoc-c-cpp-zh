  md: '# 296 Part IV: An Industrial-Strength Application


    REMEMBER


    If the system runs on memory, the table view gets rid of the cells in the queue,
    but as long as it has some available memory for them, it will hold on to them
    in case you want to use them again.


    You can ask the table view for a reusable cell object by sending it a dequeueReusableCellWithIdentifier:message:


    ```

    UITableView *cell = [tableView

    dequeueReusableCellWithIdentifier:kCellIdentifier];

    ```


    This asks whether any cells of the type you want are available.


    +   3. If there aren''t any cells lying around, you''ll have to create a cell,
    using the identifier you just created.


    ```

    if (cell == nil) {

    cell = [[UITableViewCell alloc]

    initWithStyle:UITableViewCellStyleDefault

    reuseIdentifier:kCellIdentifier] autorelease];

    }

    ```


    You now have a table view that you can return to the table view.


    UITableViewCellStyleDefault gives you a simple cell with a text label (both and
    left-aligned) and an optional image view. There are also other styles:


    > UITableViewCellStyleValue gives you a cell with a left-aligned black text label
    on the left side of the cell and smaller blue text and right-aligned label on
    the right side. (The Settings application uses this style).


    > UITableViewCellStyle2 gives you a cell with a right-aligned blue label on the
    left side of the cell and a left-aligned black label on the right side of the
    cell.


    > UITableViewCellStyleSubtitle gives you a cell with a left-aligned label across
    the top and a left-aligned label below it in smaller gray text. (The iPod application
    uses cells in this style.)


    +   4. Define the accessory type for the cell.


    ```

    cell.accessoryType =

    UITableViewCellAccessoryDisclosureIndicator;

    ```


