    # Joining the iPhone Developer Program


    Okay, the simulator that comes with the iPhone SDK is a great tool for learning
    to program, but it does have some limitations. It doesn''t support hardware-dependent
    features, and when it comes to testing, it can''t emulate every iPhone realities
    as CPU speed and throughput.


    Minor anomalies, you might say, and you might be right. The real issue, however,
    is that registering as a developer doesn''t get you one very important thing—
    the ability to actually run your application on Apple''s iPhone App Store. Remember
    that the App Store is the only way for commercial developers to distribute their
    applications to more than a few people.) To run your app on a real iPhone or get
    a chance to profile your app in the iPhone App store, you have to enroll in either
    the Standard or Enterprise version of the iPhone Developer Program. There is much
    speculation behind the reason for this, but the bottom line is that''s simply
    the way it is. At least (I might note) it isn''t all that expensive.'
