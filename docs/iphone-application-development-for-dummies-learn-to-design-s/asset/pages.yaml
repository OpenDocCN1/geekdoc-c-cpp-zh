    # Looking forward to using the SDK


    The tools in the SDK support a development process that most people find comfortable.
    They allow you to rapidly build a user interface and running to see what it actually
    looks like. You can add code at a time to, and run it after each new addition
    to see how it works. I take you through this incremental process as I develop
    the ReturnMe to iPhone application; for now, here''s a bird''s-eye view of iPhone
    development, one step at a time:


    # 1. Start with Xcode.


    Xcode provides several project templates that you can use to get off to a start
    fast. (In Chapter 5, I do just to get my user interface up and running quickly.)


    # 2. Design and create the user interface.


    Interface Builder has graphic-design tools you can use to create your application''s
    user interface. This saves a great deal of time and effort.'
