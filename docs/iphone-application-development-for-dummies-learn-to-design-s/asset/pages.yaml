  md: '# 258 Part IV: An Industrial-Strength Application


    I was a little concerned about the logistics. I thought we would have to go back
    to the airport terminal and then get on a water bus or water taxi. Both the water
    taxi stand and the water bus stop are a distance from the terminal, and that meant
    more time and more trudging about. The water taxi was the fastest way, but very
    pricey (around $140 USD at the time). The water bus was much cheaper but confusing
    — and only once an hour.


    My friends said, "Why not we take a taxi or a bus?"


    I said, "A bus to Venice — it''s an island, for crying out loud."


    Okay, it is an island, but there''s a causeway running from the mainland to Piazzale
    Roma, where you can then get a water bus or water taxi — or meet friends.


    Although it''s more romantic to arrive by sea, it''s a lot easier by land. Having
    been to Venice a couple times before, and considering our time constraints, we
    opted for the land.


    Now, I''m sure that information was in a guidebook, but we had taken a lot of
    work to do it out; most guidebooks focus on attractions. Also, guidebooks go out
    of date quickly; the one I had for Venice was two years old. Of course, I could
    have used the Internet before I left home to find the information, but that can
    also be a real chore.


    What I wanted was easier to travel — reducing those hassles — to and from a strange
    airport, getting around the city, getting the best exchange rate, knowing how
    much I should tip in the restaurant — that sort of thing. (Not too much to ask,
    right?)


    Don''t get me wrong — I do a lot of research I someplace, and often I have information
    handy already. But I end up with lots of paper because I usually don''t use a
    laptop on my vacation; even when I do, terribly inconvenient to take it out on
    a bus or in an airline terminal to find some information. And then there''s the
    challenge of finding a Wi-Fi connection when you really need it.


    The iPhone is the perfect device to solve all problems, so I decided to develop
    an iPhone application. It became MobileTravel41.


    # Designing the User Experience


    To meet my Venetian (and other travel) needs, I didn''t need a lot of information
    at any time. In fact, what I wanted was as little as possible — just the facts
    ma am — but I wanted it to be as current as possible. It doesn''t help to have
    last year''s train schedule.'
