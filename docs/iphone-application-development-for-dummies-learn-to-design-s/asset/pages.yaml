  md: '# # Got a good idea? Turn it into an app, have some fun, and pick up some cash!


    Make the most of the new 3.1 OS and Apple''s Xcode 3.2! Neal Goldstein shows you
    how, and even illustrates the process with one of his own apps''s currently being
    sold. If you''re not a programming pro, you can turn your bright idea into an
    app you can market, and Neal even shows you how to get it into the App Store!


    +   * **Mobile is different** — learn what makes a great app for mobile devices
    and how an iPhone app is structured

    * **What you need** — download the free Software Development Kit, start using
    Xcode, and become an “official” iPhone developer

    * **The nitty-gritty** — get the hang of frameworks and iPhone architecture

    * **Get busy with apps** — discover how to make Xcode for you to support app development

    * **Off to the store** — get valuable advice on what goes your apps into the App
    Store

    * **Want to go further?** — explore what goes into industrial-strength apps


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_436_0.png)


    +   * What it takes to become a registered Apple developer

    * How to debug your app

    * What''s new in iPhone 3.1 and Xcode 3.2

    * What goes into a good interface for a small device

    * How applications work in the iPhone environment

    * Why you must think like a user

    * What the App Store expects of you

    * What makes a great iPhone app


    The book''s companion Web site at **www.dummies.com/go/iphoneappdevfd2** for source
    code and additional information on iPhone app development


    Neal Goldstein is a recognized expert at making cutting-edge technologies practical
    for commercial and enterprise development. He is currently leading an iPhone startup
    that is developing an application that will radically change how people use iPhones
    to manage information, and he holds a patent on an enterprise-wide SOA-based architecture.


    Go to Dummies*

    for videos, step-by-step examples, how-articles, or to shop!


    For Dummies*

    A Branded Imprint of

    WILEY


    $29.99 US / $35.99 CN / $21.99 UK

    ISBN 978-0-470-56843-9


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_436_1.png)'
