  md: '# Chapter 2: Looking Behind the Screen


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_56_0.png)


    **Figure 2-3: The view hierarchy is both visual and structural.**


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_56_1.png)


    Controls — such as buttons, text fields, and the like — are really view subclasses
    that become subviews. So as are any other display areas you may specify. The view
    must manage its subviews, as well as resize itself with respect to its superviews.
    Fortunately, much of what the view must do is already coded for you. The UIKit
    framework supplies the code that defines view behavior.


    The view hierarchy plays a key role in both drawing and event handling. When a
    window is sent a message to display itself, the window asks its view to render
    itself first. If a view has a subview, it asks its *subview* to render itself
    first, going down the structural hierarchy (or the up structure) until the last
    subview is reached. It then renders and returns to its caller, and so on.


    You create or modify a view hierarchy whenever you add a view to another view,
    either programmatically or with the help of the Interface Builder. UIKit framework
    handles all the relationships associated with the view hierarchy.


