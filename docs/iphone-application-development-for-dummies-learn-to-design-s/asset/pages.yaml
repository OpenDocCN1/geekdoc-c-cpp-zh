    +   The iPhone Reference Library: This is all of the documentation you could ever
    need (except, of course, the answer to 3 a.m., but that''s how it goes). To be
    honest, most of this only turns out to be really useful after you have a good
    handle on what you''re doing. As you go through this book, an easier way to access
