  md: '# Chapter 12


    # Death, Taxes, and the iPhone Provisioning


    +   * Running your application on the iPhone

    * Getting them ready for distribution

    * Taking the app to market — that is, the Apple Store


    > Benjamin Franklin once said, "In this world nothing can be said to be certain,
    except death and taxes. I''ve discovered one other certainty in this earthly vale
    of tears: Everybody has the same hoops to jump to get an application onto an iPhone
    and then the App Store — nobody likes them, but there they are"


    So you''re working on your application, running it in the Simulator, as happy
    as a virtual claim, and all of a sudden you get this urge to see what your creation
    look like on the iPhone itself. Assuming that you have joined the requisite developer
    program (see Chapter 3), what do you have to do to get it to run on the iPhone?


    For most developers, getting their applications to run on the iPhone during development
    can be one of the most frustrating things about developing software for the iPhone.
    The sticking point has to to do with a technical concept called code signing,
    a rather complicated process designed to ensure the integrity of the code and
    positively identify the code''s originator. Apple requires all applications to
    be digitally signed with a signing certificate — one issued by Apple to a registered
    iPhone developer — before the application can be run on a development system and
    before they are submitted to Apple for distribution. I mention earlier, this signature
    authenticates the identity of the developer of the application and ensures that
    there have been no changes to the application after it was signed. As to why this
    is a big deal, here''s the short and sweet (and, to my ears, convincing) answer:
    Code signing is your way of guaranteeing that no bad guys have done anything to
    your code that can harm the innocent user.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 232 Part III: From “Gee, That’s a Good Idea,” to the App Store


    Now, as I said, nobody really likes the process, but it''s doable. In this chapter,
    I''m going to start by giving you an overview of how it works by jumping right
    to point where you''re getting your application ready to be uploaded to the App
    Store and distributed to users. I realize starting at the end of the process,
    which for all practical purposes begins with your application to run on a device
    during development, I''m doing the overview in this order because the hoops you
    have to jump to get an application to run on a single iPhone during development
    are a direct consequence of code signing, and of how Apple manages it through
    the App Store and on the device.


    After the overview, which will give you some context for the whole process, I''ll
    revert back to the natural order of things and start with your application to
    run on your iPhone during development.


    # How the Process Works


    It''s very important to keep clear that there are two different processes that
    you''ll have to go through. For development, but similarly named certificates
    and profiles, these processes produce difference, but you''ll need to pay attention
    to keep them straight. As I said earlier, I''ll start with the distribution process
    — how you get your app to run on other people''s iPhones. Then I''ll go back and
    talk about the development process — how to get your app running on your iPhone
    during development.


    # The Distribution process


    Before you can build a version of your application that will actually run on your
    users'' iPhones, Apple insists that you have the following:


    +   A Distribution Certificate: An electronic document that associates a digital
    identity (which creates) with other information that identifies you, including
    a name, e-mail address, or business that you have provided. The Distribution Certificate
    is placed on your keychain — place on your Mac that securely stores passwords,
    keys, certificates, and for users.


    +   A Distribution Provisioning Profile: These profiles are code elements that
    Xcode builds into your application, creating a kind of “code fingerprint” that
    acts as a unique digital signature.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Chapter 12: Death, Taxes, and the iPhone Provisioning 233


    After you''ve built your application for distribution, you then send it to Apple
    for approval and distribution. Apple verifies the signature to be sure that the
    code came from a registered developer (you) and has not been corrupted. Apple
    adds its own digital signature to your signed application. The iPhone OS will
    only run applications that have that digital signature. Doing this ensures iPhone
    owners that the applications they download from iTunes have been written by registered
    developers and not been altered since they were created.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_254_0.png)


    To install your distribution-ready application on a device, you can also install
    an Ad Hoc Provisioning Profile, which allows you to actually have your application
    used up to 100 devices.


    While the system for getting apps on other people''s iPhones works perfectly,
    leaving aside the fact that Apple essentially has veto on every application that
    comes its way, there are some significant consequences for developers. In this
    system, there is really no mechanism for testing your application it''s going
    to run on:


    +   * You can''t run your app on an account device until it''s code-signed by
    Apple, but Apple is hardly going to code-sign something that may not be working
    correctly.

    * Even if did sign an app that hadn''t run on an iPhone, that would mean an additional
    hassle: Every time you recompiled, you''d have to upload the app to the App Store
    again — and have it code-signed again because you had changed it, and then download
    it to your device.


    Bit of a Catch-22 here:


    # The Development process


    To deal with this problem, Apple has developed a process in which you can create
    a Development Certificate (as opposed to a Distribution Certificate that I explained
    at the start of this section) and a Development Provisioning Profile (as opposed
    to a Distribution Provisioning Profile that I also explained at the start of this
    section). It''s easy to get these confuse — the key words are Distribution and
    Development. With these items in hand, you can run your application on a specific
    device.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_254_1.png)


    Remember, this process is only required because of the code-signing requirements
    of the distribution process.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 234 Part III: From “Gee, That’s a Good Idea,” to the App Store


    The Development Provisioning Profile is a collection of your App ID, Apple device
    UDID (a unique identifier for each iPhone), and iPhone Development Certificate
    (belonging to a specific developer). This Profile must be installed on each device
    on you want to run your application code (you''ll see how that is done later).
    Devices specified within the Development Provisioning Profile can be used for
    testing only by developers whose Development Certificates are included in the
    Provisioning Profile. A single device can also contain multiple provisioning profiles.


    It''s important to realize that a development provisioning profile (as opposed
    to a distribution one) is tied to a device and a developer.


    Even with your provisioning profile(s) in place, when you compile your program,
    Xcode will only build and sign (the required signature for) your application if
    it finds one of those Development Certificates in your Keychain. Then, when you
    install a signed application on your provisioned device, the iPhone verifies the
    signature to make sure that (a) the application was signed and (b) the application
    has not been altered since it was. If the signature is not valid or if you don''t
    sign the code, the iPhone will not run the application.


    This means that each Development Provisioning Profile is also tied to a particular
    Development Certificate.


    And to make sure the message has really gotten across:


    > A Development Provisioning Profile is tied to a specific device and a specific
    Development Certificate.


    > Your application, during development, must be tied to a specific Development
    Provisioning Profile (which is easily changeable).


    The process you''re about to go through is akin to filling out taxes: You have
    to follow the rules, or there will be dire consequences. But if you do follow
    the rules, everything works out, and you don''t have to worry about it again.
    (Until it''s time to develop the next app, of course.)


    While this is definitely not my favorite part of iPhone development, I''ve made
    peace with it, and so now I''ll go to the natural order of things and start by
    explaining the process of getting your device ready for development. I''m happy
    to give you an overview of the process, but it will be up to you to go through
    it step by step on your own. Although Apple documents the steps very well, keep
    in mind that you really have to carry them out in exactly the way Apple tells
    you. There are no shortcuts! But if you do it the way it prescribes, you''ll be
    up and running on a real device quickly.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_255_0.png)'
