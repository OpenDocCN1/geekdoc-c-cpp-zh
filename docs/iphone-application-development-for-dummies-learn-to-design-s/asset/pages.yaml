    # Adding Your Own Application''s Behavior


    Earlier in this chapter (by now it probably seems like a million years ago), I
    mentioned two design patterns used in addition to the Model-View-Controller (MVC)
    pattern. If you have a photographic memory, you won''t need telling me that those
    two patterns are the Delegation pattern and the Target-Action pattern. These patterns,
    along with the MVC pattern and subclassing, provides the mechanisms for you to
    add your application-specific behavior to the UIKit (or any other framework).


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_61_0.png)


    I have already talked about the first way to add behavior, and that is through
    Model objects in the MVC pattern. Model objects contain the data and logic that
    make, your application.


    The second—the way people traditionally think about adding behavior to an object-oriented
    program, if you want to know the truth— is subclassing where you create a new
    (sub) class that inherits behavior and instance variables from another (super)
    class and then add additional behavior, instance variables, and properties (I''ll
    explain properties in Chapter 7) to the mix until you have with what you want.
    The idea here is to start with something basic and add it to — kind of taking
    a deuce coupe (1932 Ford) and you''d subclass a view controller for example, to
    respond to controls.


    The third way to add behavior involves using the Delegation pattern, which allows
    you to customize an object''s behavior without subclassing by basically forcing
    another object to do the first object''s work for it. For example, the Delegation
    design pattern is used at application startup to invoke a method applicationFinishLaunching:
    that gives you a place to do your application-specific initialization. All you
    do is is add your code to the method.'
