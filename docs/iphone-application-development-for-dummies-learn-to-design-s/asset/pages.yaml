  md: '# 130 Part III: From “Gee, That’s a Good Idea,” to the App Store


    created the ReturnMeTo application. Now, recall that in Step 9 in the earlier
    section “Adding Outlets to the View Controller,” I asked you to add


    ```

    [textField release];n[label release];

    ```


    the dealloc method, so the end product looks like the following:


    ```

    -(void)dealloc {


    [textField release];

    [label release];


    [super dealloc];

    }

    ```


    Well, here why: Adding these bits of code releases textField and label.


    Chapter 6 gave you some handy memory-management rules. Here’s one of them:


    An object you create with alloc or new or if it contains copies or if you send
    it a retain message. That means you are responsible for telling the memory-management
    system you’re done with.


    In other words, you have to release it you’re done.


    So when, you might ask, do I have to release textField and label? If I created
    the textField and label using alloc or new, obviously it would be my to release
    them. But I didn’t do that — or did?


    No, I didn’t, but what I did do was send a retain message to both textField and
    label.


    “Oh, yeah?” “Where?” you might ask.


    Check out the @property declarations you made earlier:


    ```

    @property (nonatomic, retain) UITextField *textField;

    @property (nonatomic, retain) UILabel *label;

    ```


    You see, and hold, retain.


    The impact of adding that simple two-syllable word retain is any time I assign
    to instance variable — assigning a phone number to a label, for example — a retain
    message will be sent to it — and that is precisely what happens at runtime for
    the outlets.'
