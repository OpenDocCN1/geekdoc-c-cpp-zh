  md: '# Chapter 18


    # # Top Ten Apple Sample

    Applications (with Code!)


    > > Good artists copy. Great steal.

    — Pablo Picasso


    One way to really learn how to do things on the iPhone is to look at (correct)
    sample code. Apple provides a lot of it. The only problem with learning from samples
    is that, while it can show you how to do a specific thing (like a view), it doesn''t
    give you the overall architectural understanding-you need to create an application.


    After going through this book, you know enough to take real advantage of all this
    sample code. By all means, take what you can from the samples and use it where
    you can jumpstart your own application development.


    Here are the ten samples I like the best. You can find them at the iPhone Dev
    Center Web site at http://developer.apple.com/iphone/ under the Sample Code section
    on the left side of the page.


    They all come as Xcode projects, so you can check out the code, compile the project,
    and then load it into the simulator or even onto your development iPhone.


    # AppPrefs


    If you want to get a good handle on preferences and how to set, access, and use
    them in your application, this is the place to get that grip. This app even has
    a table view with flip animation that explains the application on the flipside.'
