  md: '# Chapter 14: Setting the Table 275


    # Creating the table view


    Although powerful, table views are surprisingly easy to work with. To create a
    table, you need only to do four — count’em, four — things, in the following order:


    +   1. Create and format the view itself.


    This includes specifying the table style and a few other parameters — most of
    which is done in Interface Builder.


    +   2. Specify the table view configuration.


    Not too complicated, actually. Let UITableView know how many sections you want,
    how many rows you want in each section, and what you want to call your section
    headers. You do that with the help of the numberOfRowsInTableView: method, the
    tableView:method, and the tableView:titleForHeaderSection: method, respectively.


    +   3. Supply the text (or graph) for each row.


    You return from the implementation of the tableView:cellForRowPath: method. This
    message is sent for each row in the table, and you return a table view to display
    the text or graph.


    +   4. Respond to a user selection of the row.


    You use the UITableView:didSelectRowAtIndexPath: method to make care of this task.
    In this method, you create a controller and a new view. For example, when the
    user maps in Figure 14-1, this method is called, and then a Map controller and
    Map view are created and displayed.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_296_0.png)


    A UITableView object must have a data source and a delegate. The data source supplies
    the content of the table view, and the delegate manages the appearance and behavior
    of the table view. The data adopts the UITableViewDataSource protocol — no surprises
    there. Of the preceding methods, the UITableView:didSelectRowAtIndexPath: is included
    in the UITableViewDelegate protocol. All the others listed earlier are included
    in the UITableViewDataSource protocol.


    The data source and the delegate are (but not necessarily) implemented in the
    same object — which is a subclass of UITViewController. I plan to use the RootViewController
    for my iPhone41Travel app.


    Implementing these five (count’em, five) methods and Interface Builder for a spin
    or two, along with the same kind of initialization methods and the standard memory-management
    methods you used in the ReturnMeApp, creates a table view that can respond to
    a selection made in the table.


    Not bad.'
