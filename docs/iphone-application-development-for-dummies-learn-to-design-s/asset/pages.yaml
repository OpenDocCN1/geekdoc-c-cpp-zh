  md: '# Part IV: An Industrial-Strength Application


    If it finds one, it loads the localized version of the resource instead of the
    base version — the one you''re working in.


    Showing all the ins and outs of localizing your application is a bit too Byzantine
    for this book. But I will show you what you must do to make your application localizable
    when you''re ready to tackle the chore on your own.


    What you have to get — right from the start — are the strings you use in your
    application that presented to the user. (If the user speaks Spanish or her language
    of choice, what is expected in the main view is now Moneda, not Currency.) You
    ensure that the users see what they''re expecting by storing the strings you use
    in your application a strings text file; this file contains a list of strings,
    each identified by a comment. You would create one of these files for each language
    you use.


