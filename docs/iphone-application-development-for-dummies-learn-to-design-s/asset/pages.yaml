  md: '# 206 Part III: From “Gee, That’s a Good Idea,” to the App Store


    # Listing 11-1 (continued)


    ```

    @property (nonatomic, retain) UILabel *label;

    @property (nonatomic, retain) NSString *callNumber;


    - (void) scroll:(BOOL)movedUp;

    - (void) updateCallNumber;

    - (IBAction)buttonPressed:(id)sender;


    @end

    ```


    Here’ve declared a new method — buttonPressed — with a new keyword right small
    in front of it — IBAction.


    IBAction is one of those little tricks, like IBOutlet, that does nothing in the
    code but provide a way to inform Interface Builder (hence, the IB in them) that
    this method can be used as an action for Target-connections. All IBAction “does”
    is act as a action for Interface Builder — identifying this method (action) as
    you can connect to an object (the button) in a nib file. In this respect, while
    IBAction trick is similar to the IBOutlet mechanism I discuss in Chapter 7. In
    case, however, you were tagging instance variables, in this case, method. Same
    difference.


    You will use IBAction later when you launch Interface Builder and connect the
    new button with the ReturnViewController method. IBAction is actually defined
    as a void, if you think about it, all you’ve done declare a new method with type
    of void.


    ```

    (IBAction)buttonPressed:(id)sender; =

    (void)buttonPressed:(id)sender);

    ```


    This simply means you’ve declared a method that doesn’t return anything to whoever
    invoked it.


    The actual name you get can be anything you want, but it must have a return type
    of IBAction. Usually the action takes one argument — typically defined as id,
    a pointer to the instance variables of an object — which is given the name sender.
    The control that triggers your action will use the sender to pass a reference
    to it. So, for example, if your method was invoked as the result of a button tap,
    the argument sender would contain.


    A word to wise — having the sender contain a reference to the specific button
    that was tapped is a very handy mechanism, even if you’re not going to take advantage
    of that in the ReturnMe application. With that reference in hand, you can access
    the variables of the control that was tapped.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_227_0.png)'
