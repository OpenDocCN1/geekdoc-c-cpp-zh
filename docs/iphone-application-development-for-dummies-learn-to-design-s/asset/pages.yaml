    software for the iPhone. The most annoying part was figuring out what Apple calls
    “provisioning” your iPhone — the hoops you have to jump through to actually run
    your application on a real, tangible, existing iPhone. I take you through the
    provisioning process in Chapter 12, and frankly, that process explained is worth
