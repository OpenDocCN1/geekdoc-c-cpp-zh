  md: '# 312 Part IV: An Industrial-Strength Application


    In the MobileTravel411 application, I use property extensively as a way to “parameterize”
    view controllers and models. (I de-buzz this word and provide details in the next
    chapter.)


    Property lists have a single root node — a Dictionary, which means it stores items
    using a key-value pair, just as NSDictionary does: All dictionary entries must
    have both a key and a value. In this dictionary, there are two keys:


    +   - StringsTable

    - PreferenceSpecifiers


    The value for the first entries is a string — the name of a strings used for localization,
    which I won’t get into here. The second entry is an array of dictionaries — one
    for each preference. You’ll probably need some time to wrap your head around that.
    It’ll become clearer as I take you through it.


    PreferenceSpecifiers is where you put a toggle so the user can choose to use (or
    not use) only stored data — I’ll refer to that later as stored data. Here’s how
    it’s done:


    +   1. In the Groups & Files page of the project window, select the triangle next
    to the Settings.bundle file to find the Root.plist file, and double-click the
    Root.plist file to open it in a separate window, as shown in Figure 15-3.


    Okay, you don’t really have to do this, but it’s easier to work with this file
    when it’s sitting in its own window.


    +   2. In the Root.plist window you opened, expand the triangles next to all the
    nodes by clicking all those, as shown in Figure 15-3.


    +   3. Under the PreferenceSpecifiers heading in the Root.plist window, move to
    Item 1.


    PreferenceSpecifiers is an array designed to hold a set of dictionary nodes, each
    item listed in the array, the first row has a key of Type: every property list
    in the PreferenceSpecifiers array must have an entry with this key, which identifies
    what kind of entry this is. The value for the current item 1 — GROUPSpecifier
    — is used to indicate that a new group should be started. The label for this key
    actually creates a section here for a table view (like you created in Chapter
    14). Double-click the value next to Title and delete the default Group, as I have
    in Figure 15-4 (or you can put in iPhoneTravel411 Preferences, or be creative
    if you like).'
