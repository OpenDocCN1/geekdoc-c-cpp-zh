  md: '# Chapter 17: Finding Your Way


    # The annotation


    An annotation plays a similar role to the dictionary you created in Chapter 16
    to hold the text to be displayed in the cell of a table view. Both of them act
    as a model for their corresponding view, with a view connecting the two.


    Annotation objects are any object that conforms to the MKAnnotation protocol and
    are typically existing classes in your application''s model. The job of an annotation
    object is to know its location (coordinate) on the map along with the text to
    be displayed in the call. The MKAnnotation protocol requires a class that adopts
    the coordinate property. It makes sense for the Airport and City model objects
    to add the responsibilities of an annotation object to their bag of tricks. After
    all, the Airport and City model objects already know what airport or city they
    represent, respectively. It makes sense for these objects to have the coordinate
    and cutout as well.


    Here''s what you need to do to make that:


    +   1. Add the MapKit include to the Airport and City.h files.

    # <MapKit/MapKit.h>


    +   2. Have the City and Airport adopt the MKAnnotation protocol.

    @interface City : NSObject <MKAnnotation> {

    @interface Airport : NSObject <MKAnnotation> {


    +   3. Add following information variables to both the Airport and City.h files.

    CLLocationCoordinate2D coordinate;

    City.h files.


    +   4. Add the following property and method to both the Airport and City files.

    @property (nonatomic) CLLocationCoordinate2D coordinate;

    (NSString*) title;


    The MKAnnotation protocol requires a coordinate property — the title method is
    optional.


    +   5. Add a synthesize statement to both the Airport and City.m files.

    @synthesize coordinate;


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_386_0.png)'
