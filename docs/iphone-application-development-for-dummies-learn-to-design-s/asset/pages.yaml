    # BubbleLevel


    I can''t help it. I love this application. It includes a lot of things any iPhone
    app developer would want to know how to do, including graphics and audio, and
    how to develop an application with a landscape view. It also allows you to calibrate
    the level with directions on the flipside of the level view. I actually keep this
    app on my iPhone. You never know when you might need a level to straighten a picture
    or build a build:


    # LocateMe


    I want to extend the iPhoneTravel411 application and base the user''s available
    options on his or her current location, you can start here. This app shows you
    how to use core location, but remember that the simulator shows you a world with
    only one location — Apple''s headquarters in Cupertino, California.


    # NavBar


    Navigation bars crop up in the book from time to time (in particular, in Chapter
    16), and I show you how to add a Back button in Chapter 16. If you want to customize
    an existing navigation bar even more, this app has the code that shows how to
    do it. You can add custom left and right buttons and even change the style of
    the Navigation Bar. It also illustrates how to use multiple nib fables — each
    page has its own.


    # Reachability


    If you''re a network geek, this one is great — otherwise, you can use this code
    to get your app to determine network state and check whether a particular site
    is available. This app also shows you, if you uncomment a line of code, how to
    run in asynchronous mode and notify the application of a change in device status.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Chapter 18: Top Ten Apple Sample Applications (with Code!)


    # iPhoneCoreDataRecipes


    This sample shows you how to do a lot of things, among them using view controllers,
    table views, and Core Data in an iPhone application. It uses the view controller
    to manage information, table views to display and edit data. What is more important,
    though, is its use of Core Data. Core Data is the way you should think about saving
    objects and retrieving them from a persistent store (such as a file on disk),
    and the sample shows you how to implement a Core Data persistent store.


    # UICatalog


    This sample illustrates all the elements you''d want to use in your app''s interface.
    You know — all those buttons, icons, and bangles that the user sees on-screen.)
    This application shows you how to implement all of them.


    # URLCache


    URLCache demonstrates how to download a resource, store it in the data directory,
    and use the local copy. Very useful for anything you want your app to do on the
    Web. It also includes a framework for asynchronous processing. If you need to
    download a lot o'' data when the application starts, this sample shows you how
    to tell your app to start a download and go off and do other things until the
    download completes. It also includes an activity-indicator view that tells the
    user your application is actually at work, and not on a lunch break.


    # XML


    There are actually two XML samples I can recommend. The first one, SeismicXML,
    shows you how to work with XML documents. When you launch it, it gets and parses
    an RSS feed. This particular feed is from the U.S. Geological Survey that provides
    data on recent earthquakes around the world. (I live in Northern California, so
    you can bet I keep this one on my iPhone as well.)'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Part V: The Part of Tens


    The second sample, XMLPerformance, parses XML by using the two APIs provided in
    the SDK. This sample allows the user to choose between the two APIs, tracks the
    statistics of each parse, and stores data in an SQLite database. There''s a good
    discussion of performance in the ReadMe file. In addition, the app’s RSS feed
    uses the “Top 300” songs from iTunes, so you can keep up to date on tones.


    # Tables


    There are a number of samples that show you how to implement the functionality
    in the table view. I''ll just list them here, and you can examine them at your
    leisure:


    +   - Accessory implements a checkbox button in a custom accessory view.

    - DateCell shows how to format date objects in a table view cell and then use
    a date picker to edit the dates.


    +   - DrillDownSave saves the current location in a hierarchy and then relaunches
    the current location when the user relaunches the application. (Hmm. I wonder
    where I''ve seen that before?)


    +   - EditableDetail shows how to insert, delete, and move rows.


    +   - HeaderFooterDown shows customized header and footer views.


    +   - TableSearch implements searching using UISearchBar and UISearchController
    then filtering content. This is similar to what the Mail application does when
    you start to type an e-mail address in the Field when you are composing an e-mail.


    +   - TableView shows a list of table views.


    +   - Elements is a very robust application. It allows you to sort data in multiple
    formats. It uses a tab bar, displays in and grouped table views, uses navigation
    controllers to navigate deeper into a data structure, creates custom table view
    cells with multiple subviews, accesses a Web site using Safari, reacts to taps
    in a view, flips view content from front to back, and reflects a view. Makes me
    tired just to think about it.


    +   - TouchCells implements controls in a table view.'
