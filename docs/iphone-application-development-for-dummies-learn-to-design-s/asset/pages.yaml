  md: '# Chapter 4: Getting to Know the SDK


    # Exploring Your Project


    To develop an iPhone application, you have to work within the context of an Xcode
    project. It turns out that you do most of your work on projects using the project
    window very much like the one in Figure 4-3. If you have a nice, large monitor,
    expand the project window so you can see everything in it as big as life. This
    is, in effect, Command Central for developing your application; it displays and
    organizes your source files and the other resources needed to build your application.


    If you take another peek at Figure 4-3, you''ll see the following:


    +   The Groups & Files list: An outline of everything in your project, containing
    all of your project''s files — source code, frameworks, graphics, as well as settings
    files. You can move files and folders around and add new folders. If you select
    an item in the Groups & Files list, the contents of the item are displayed in
    the topmost-pane to the right — otherwise known as the Detail view.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_86_0.png)


    You''ll notice that some of the items in the Groups & Files list are folders,
    whereas others are just icons. Most have a little triangle (disclosure triangle)
    next to them. Clicking the little triangle to the left of a folder expands the
    folder to show what''s in it. Click the triangle to hide what it contains.


    +   The Detail view: Here you get detailed information about the item selected
    in the Groups & Files list.


    +   The Toolbar: Here you can find quick access to the most common Xcode commands.
    You can customize the toolbar to your heart''s content by right-clicking and selecting
    Customize Toolbar from the contextual menu that appears. You can also view View:Customize
    Toolbar.


    +   * The Building and Run button compiles code, links, and toggles your application.


    +   * The Breakpoints buttons turn breakpoints on and off the Build and Run button
    to Build and Debug. (I''ll explain this in Chapter 10.)


    +   * The Tasks button allows you to stop the execution of your program you''ve
    built.


    +   * The Info button opens a window that displays information and settings for
    your project.


    +   * The Status bar: Look here for messages about your project. For example,
    when you are building your project, Xcode updates the status bar to show where
    you are in the process — and if the process completed successfully or not.'
