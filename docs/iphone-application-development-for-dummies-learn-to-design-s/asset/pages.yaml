    the iPhone OS heading, this select the Objective-C class template in the topmost
    pane, make sure the drop-down menu Sub of NSObject selected and then click Next.


    You''ll see a new dialog asking for more information.


    +   3. Enter Destination in the File Name field and then click Finish.


