  md: '# Chapter 2: Looking Behind the Screen


    The final way to add behavior involves the Target-Action design pattern, which
    allows your application to respond to an event. When a user touches a button,
    for example, you specify which method should be invoked to respond to the button
    touch. What is interesting about this pattern is that it also requires subclassing
    — usually a view controller (see above) — in order to add the code to handle the
    event.


    In the few sections, I''ll go into a little more detail about Delegation patterns
    and Target-Action patterns.


    # The Delegation pattern


    Delegation is a pattern used extensively in the iPhone framework, so much so that
    it''s very important to clearly understand. In fact, I have no problems telling
    you, once you understand it, your life will be easier. Until light bulb won for
    me, I sometimes felt like I was trying to make my way through one of those london
    pea soup fogs.


    As said in the previous section, delegation is a way of customizing the behavior
    of an object without subclassing it. Instead, one object (frame-work object) delegates
    the task of implementing one of its responsibilities to another object. You are
    using a behavior-rich object supplied by the framework as is, and putting the
    code for program-specific behavior in a separate (delegate) object. When a request
    is made of the framework object, the method of the delegate that implements the
    program-specific behavior is automatically called.


    For example, the UIApplication object handles most of the actual work to run the
    application. But, as you will see, it sends your application delegateDidFinishLaunching:
    message to give you an opportunity to restore the application''s window and view
    to where it was when the user previously left off. You can also use this method
    to create objects that are unique to your application.


    When a framework object has been designed to implement delegates certain behaviors,
    the behaviors it requires (or gives you the option to implement) are defined in
    a protocol.


    Protocols define an interface that the delegate object implements. On the iPhone,
    protocols can be formal or informal, although I''m going to concentrate solely
    on the former since it includes support for things like type checking and runtime
    checking to see if an object conforms to the protocol.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# 42 Part I: Getting Started


    In a formal protocol, you usually don''t have to implement all of the methods,
    many are declared optional, meaning you only have to implement the ones relevant
    to your application. Before it attempts to send a message to its delegate, the
    host object determines whether the delegate implements the method (via a respondsToSelector:
    message) to avoid the embarrassment of branching into nowhere if the method is
    not implemented.


    You''ll find out more about delegation and the Delegation pattern when you develop
    the ReturnMeTo and especially the iPhoneTravel411 applications in later chapters.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_63_0.png)


    # The Target-Action pattern


    The Target-Action pattern is used to let your application know that a user has
    done something. He or may have tapped a button or entered some text, for example.
    The control — a button, say — sends a message (the Action message) that you specify
    to the target you have selected to handle that particular action. The receiving
    object, or the Target, is usually a View Controller object.


    If you wanted to start your car from your iPhone (not a bad idea if ever lived
    in some place like Minneapolis), you could display two buttons, Start and Heater.
    When you tapped Start, you could use Interface Builder to specify that the target
    is the CarController object and that the method to invoke is ignition. Figure
    2-5 shows the Target-Action mechanism in action. (If you''re curious about IBAction
    and (id) sender, I''ll explain what they are when I show you how to use the Target-Action
    pattern in your application.)


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_63_1.png)


    Figure 2-5: The Target-Action mechanism.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Chapter 2: Looking Behind the Screen 43


    The Target-Action mechanism enables you to create a control object and tell it
    not only what object you are handling the event, but also the message to send.
    For example, if the user touches a “Ring Bell” button on-screen, I want to send
    a “Ring Bell” message to the view controller. But if the “Wave Flag” button on
    the screen is touched, I want to be able to send the same view controller the
    “Wave Flag” message. If I couldn''t specify the message, all buttons would have
    to send the same message. It would make the coding more difficult and complex,
    since I would have to identify which button sent the message and what to do in
    response, and changing the user interface work more and more error prone.


    As you''ll discover when creating your application, you can set a control''s target
    and action through the Interface Builder. This allows you to specify which method
    in the object should respond to a control without having to write any code.


    You can also change the target and action dynamically by sending the control or
    its cell `setTarget:` and `setAction:` messages.


    For on the Interface Builder application, check out Chapter 5.


    # Doing What When?


    The UIKit framework provides a great deal of ready-made functionality, the beauty
    of UIKit lies in the fact — as this chapter has made clear — you can customize
    your behavior using three distinct mechanisms.


    +   - Subclassing

    - Target-Action

    - Delegation


    One of the challenges facing a new developer is to determine which of these mechanisms
    to use when (That was certainly the case for me.) To ensure that you have an overall
    conceptual picture of the iPhone application architecture, check the Cheat Sheet
    for this book, where I give you a summary of which mechanisms are used. (I wish
    I''d had this when I started developing my application — but at least you do now.)
    You can find the Cheat Sheet for this book at www.dummies.com/cheatsheet/iPhoneApplicationDevelopment.'
