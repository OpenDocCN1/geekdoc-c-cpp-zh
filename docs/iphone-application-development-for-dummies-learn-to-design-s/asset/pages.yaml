    so it can pass the content from the model to the view. To do that, you need to
    create an outlet (a special kind of instance that refers to the nib in the view
    controller, just as you did back in Chapter 7 when you were working on the ReturnMeAction.
    The outlet will be "filled in" automatically when your application is initialized.


    Here''s how you should deal with this outlet business (it''s the same thing you
    did in Chapter 7 to set up the ReturnMeViewController, so if you''re a little
    hazy, you want to go back and review what you did there):


    +   1. Within Xcode, add an airportView (UIWebView) outlet to the AirportController.interface
    file.


