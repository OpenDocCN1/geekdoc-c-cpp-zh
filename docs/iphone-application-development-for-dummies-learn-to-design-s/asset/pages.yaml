  md: '# 266 Part IV: An Industrial-Strength Application


    No big surprises here — especially because the MVC model (Model-View-Controller)
    is pretty much the basis for all iPhone application development projects. The
    trick here is coming with just the right views, controllers, and model objects
    to get your project off the ground. Within the requirements I spelled out in the
    "Designing the User Experience" earlier in the chapter, I came up with the elements
    highlighted in the next sections.


    I''m going to start with the views, since they determine the functionality and
    information available in a given context — being at an airport and needing to
    get into the city for example.


    # A main view


    This was a no-brainer. The main view for MobileTravel411 (and for iPhoneTravel411)
    is a UITableView, no question about it. Table views are used in iPhone applications
    to do things:


    +   **Display hierarchical data**: Think of the iPod application, contexts): Now
    of the Settings application, which gives you a list of applications that you can
    select one for. When you select one of those applications from the list, it takes
    you to a view that lists preferences you are able to set, and a way to set them.

    **Act as a table of contents** (or for my purposes, contexts)


    # Content views


    Content views are views that display the information the user wants — stuff how
    many Zimbabwean dollars I can get for $2.75 or the weather in Aruba next week.


    The views you create are based on the information and functionality that a user
    needs in that context. At the risk of oversimplification, I had to think about
    two types of views:


    +   **The Many Zimbabwean Dollars I Can Get For $2.75 (US) View**: These kind
    of views are characterized by the fact that user input is required to be able
    to deliver the goods. The user would have to enter $2.75 US and then request to
    see the equivalent amount in Zimbabwean Dollars. (According to MobileTravel411,
    the answer by the way, in mid July 2009, is a little less than 103 million.)'
