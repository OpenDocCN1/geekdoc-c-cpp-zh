  md: '# 30 Part I: Getting Started


    # The Model-View-Controller (MVC) pattern


    The iPhone frameworks are object-oriented. The easiest way to understand what
    that really means is to think about a team. The work that needs to get done is
    up and assigned to individual team members (objects). Every member of a team has
    a job and works with other team members to get things done. What''s more, a "good"
    team doesn''t butt in on what other members are doing — just like objects in object-oriented
    programming spend their time taking care of business and not caring what the object
    in the virtual却是 is doing.


    Object-oriented programming was originally developed to make code maintainable,
    reusable, extensible, and understandable (a concept!) by tucking all the functionality
    behind well-defined interfaces — the actual details of how something works (as
    well as its data) is hidden. This makes modifying and extending an application
    much easier.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_51_0.png)


    Great — so far — a pesky question still plagues programmers:


    > Exactly how do you decide on the objects and what each one does?


    Sometimes the answer to question is pretty easy — just use the real world as a
    model (Eureka). In the MobileTravel411 application that serves as an example in
    this book, some of the classes I use Airport and Currency. When it comes to a
    generic program structure, how do you decide what the objects should be? That
    may not be obvious.


    The MVC pattern is a well-established way to group application functions into
    objects. Variations of it have been around at since the early days of Smalltalk,
    one of the very first object-oriented languages. The MVC is a high-level pattern
    — it addresses the architecture of an application and classifies objects according
    the general roles they play in an application.


    The MVC pattern creates, a miniature universe for the application, populated with
    three kinds of objects. It also specifies roles and responsibilities for all three
    objects and the way they''re structured to interact with each other. To make things
    more (that, how we keep from exploding), imagine a big, beautiful, 60-inch flat
    screen TV. Here''s the gist:


    +   - Model objects: these objects comprise the content "engine" of your application.
    They contain the application''s data and logic — making your application more
    than just a pretty face. In the MobileTravel411 application, the model "knows"
    the various ways to get from Heathrow to London as well as some logic to decide
    the best alternative based on time of day, price, and some other considerations.


    You can think of the model (which may be one object or several that interact)
    as a particular television program. One, quite frankly, does not give a h about
    what TV set it is being shown on.'
