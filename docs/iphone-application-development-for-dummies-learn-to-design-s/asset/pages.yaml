  md: "# Chapter 16\n\n# Creating Controllers\n Their Models\n\n# In This Chapter\n\
    \n+   - Taking another look at model objects\n- Taking advantage of reusable view\
    \ controllers and models\n- Accessing data on the Internet\n- Saving and reading\
    \ files\n\nGetting the infrastructure in place for a new iPhone application is\
    \ certainly a crucial part of the development process, but in the grand scheme\
    \ of things, it's only the spadework prepares the way for the really cool stuff.\
    \ After all is said and done, you still need to add the content that the users\
    \ will see or interact with. Content is, after all, the reason they bought this\
    \ application.\n\nChapter 14 was all about infrastructure — and a very interesting\
    \ chapter it — but this chapter moves from one to content views and how to implement\
    \ them.\n\nThis is actually less difficult than it sounds. The real key to creating\
    \ an extensible application — one where you can easily add new views — is the\
    \ program architecture. Once you have a table view in place, you have the structure\
    \ necessary for navigation in your application. With that navigation architecture\
    \ — along with the MVC pattern I've been telling along — creating the views, view\
    \ controllers, and the model turns out to be somewhat pedestrian. You do more\
    \ or less the same thing again for every new content view. (Oh well, boring is\
    \ sometimes good.)\n\nIf you've dutifully following along in this book chapter\
    \ by, you probably already know the basics of creating a view and its controller.\
    \ If so, no big surprise that what I do here is almost identical to creating the\
    \ view controller for my other sample application (the ReturnTo app) in Chapters\
    \ 5, 7, 8, 9 and 11 — although this time I get to do it in a single chapter!"
