    Not freeing enough memory will result in the iPhone''s OS sending you the `applicationWillTerminate`:
    message and shutting down. For many applications, though, the best defense is
    a good offense, and you need to manage your memory effectively and eliminate leaks
    in your code.


    # Avoiding the warnings


    When you create an object — a window or button for example — memory is allocated
    to hold that object''s data. The more objects you create, the more memory you
    use, and the less there is for additional objects you might need. Obviously, it''s
    important to make available (deallocate) the memory that an object was using when
    the object is no longer needed. This is what we mean by memory management.


    The Objective-C language — the application-programming language used to develop
    iOS applications — uses reference counting to figure out when to release the memory
    allocated to an object. It''s your responsibility (as a programmer) to keep the
    memory-management system informed when an object is no longer needed.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_134_0.png)


    Reference counting a pretty simple concept. When you create the object, it is
    given a reference count of 1. As other objects use this object, they use methods
    to increase the reference count, and decrease it when they are done. When the
    reference count reaches 0, the object is no longer needed, and the memory is deallocated.


    # Some basic memory-management rules you shouldn''t forget


    For those who "Do" and "Don''t" lists, here are the fundamental rules when it
    comes to memory management:


    +   - Any object you create using `alloc` or `new`, any object that contains copy,
    and any object you send a `retain` message is to you — you own. It means you''re
    responsible for telling the memory-management system when you no longer need the
    object and that its memory can be used elsewhere.


    +   - Within a block of code, the number of times you use `new`, `copy`, `alloc`,
    and `retain` should equal the number of times you use `release` and `autorelease`.
    You should think of memory management as consisting of pairs of messages. If you
    balance every `alloc` and every `retain` with a `release`, your object will eventually
    be freed when you''re done with it.'
