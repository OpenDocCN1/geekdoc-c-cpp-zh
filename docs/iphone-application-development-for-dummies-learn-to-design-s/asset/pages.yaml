  md: "# Chapter 8: Entering and Managing Data\n\n+   1. Signal to the compliant that\
    \ the TextFieldDelegate protocol has been adopted by the delegate — in this case,\
    \ ReturnMeToViewController.\n\n+   2. Connect the ReturnMeToViewController to\
    \ the textField to let know in no uncertain terms that ReturnMeToViewController\
    \ Controller is its delegate.\n\nThat’s the bird’s-eye view. The next few sections\
    \ show what the process looks like down on the ground.\n\n# Adopting a protocol\n\
    \nAdopting a protocol is a pretty straightforward process. You’ll be working with\
    \ the header file for your case — ReturnMeToViewController.h, in this case. The\
    \ idea here is to update the @interface declaration so the left hand knows what\
    \ the right hand is doing.\n\nThe change is in binding 8-9.\n\n# Listing 8-9:\
    \ Add protocol declaration to the interface\n\n```\n@interface ReturnMeToViewController\
    \ : UIViewController\n(\n    IBOutlet UITextField *textField;\n    IBOutlet UILabel\
    \ *label;\n    BOOL moveViewUp;\n    CGfloat scrollAmount;\n)\n\n@property (nonatomic,\
