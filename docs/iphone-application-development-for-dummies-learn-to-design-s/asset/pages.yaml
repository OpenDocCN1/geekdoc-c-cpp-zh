  md: '# Chapter 2: Looking Behind the Screen


    In fact, the model shouldn''t give a hoot. Even though it owns its data, it should
    have no connection at all to the user interface and should be blissfully ignorant
    about what is being done with its data.


    +   View objects: These objects display things on the screen and respond to user
    actions. Pretty much you can see is a kind of view object — the window and all
    the controls, for example. Your views know how to display information that it
    has gotten from the model object, and how to get any input from the user model
    may. The view itself should know nothing about the model. It may handle a request
    to tell the user the fastest way to London, but it doesn''t bother itself with
    what request means. It may display the different ways to get to London, although
    it doesn''t care about the content it displays for.


    You can think of the view as a television screen that doesn''t care about what
    program is showing or what channel you selected.


    The UIKit framework provides many kinds of views, as you''ll find out later in
    this chapter.


    If the views knows nothing about the model, and the model knows about the view,
    how do you get and other notifications from one to the other? To that conversation
    started ("Model: I''ve updated my data." View: "Hey, give me something to display,"
    for example), you need the third element in the MVC trivariate.


    +   Controller objects: These objects connect the application''s view objects
    to its model objects. They supply the view objects with what they need to display
    (getting it from the model), and also provide the model with user input from the
    view.


    You can think of the controller as the circuitry that pulls the show off of the
    cable, and sends it to the screen, or requests a particular pay-per-view show.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_52_0.png)


    # The MVC in action


