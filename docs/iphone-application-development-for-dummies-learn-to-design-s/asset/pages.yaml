- img_proc: true
  md: '# Chapter 12: Death, Taxes, and the iPhone Provisioning 235


    With your app up and running, it''s time for the next step: getting your creation
    ready for distribution. (I find that process to be somewhat easier.)

    Finally, you''ll definitely want to find out how to get your application into
    the App Store. I aim to please, so I spell out those steps as well. After, all
    you have to do is sit back and wait for fortune to come your way.


    This is the way things looked when I was writing this book. What you see when
    you go through this process might be slightly different from what you see here.
    Don''t panic. It''s because Apple changes things from time to time.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_256_0.png)


    # Provisioning Your Device for Development


    Until just recently, getting your application to run on the iPhone during development
    was a really painful process. In fact, I had written a 30-page chapter on it,
    detailing step after painful step. Then, lo and behold, right when I put the finishing
    touches on my magnum opus, Apple changed the process and actually made it much
    easier. In fact, the process is now so easy that there''s no real need to linger
    over the details. (Okay, I have some mixed feelings about that — they''re mostly
    relief.)


    Here''s the drill:


    +   1. Go to the iPhone Dev Center Web site


    ```

    http://developer.apple.com/iphone/

    ```


    The Program Portal Button in the iPhone Developer Program section on the right
    side of the Web page (shown in Figure 12-1) appears. (Well, it does if you''re
    a registered developer. You did care of that, right? If not, look at Chapter 3
    for more on how to register.)


    +   2. Click the Program Portal Button.


    The Program Portal screen appears, as shown in Figure 12-2.


    +   3. Assuming you''re either a Team Admin or Agent, or enrolled in the Developer
    Program as an individual, use the Development Provisioning Assistant to create
    and install a Provisioning Profile and iPhone Development Certificate, as shown
    in the next section.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_256_1.png)


    You need to build and install applications on the iPhone. But you know that.'
