  md: '# Chapter 13: Designing Your Application 259


    To get the design ball of my application rolling, I started by thinking about
    what I wanted from the application, not necessarily the features, but what the
    experience of using the application should be like.


    # Understanding the real-world context


    You can reach the goal of seamlessness and transparency that I describe in the
    previous section by following some very simple principles you design the user
    experience — especially with respect to the user interface.


    # Become the champion of relevance


    +   - Search and destroy anything that is not relevant to what the user is doing
    while he she is a particular part of your application.

    - Include and make easily accessible — everything a user needs doing something
    supported by a particular part of your application.


    You want to avoid distracting the user from what he or she is doing. The application
    should be integrated into the task, a natural part of the flow, and not something
    that causes a detour. Your goal is to supply the user with only the information
    that''s applicable to the task at hand. If users just want to get from an airport
    to a city, they couldn''t care if the city has a world-renowned underground or
    subway system if it doesn''t come out to the airport.


    # Seconds count


    At first, the “seconds count” admonition may appear to fall into the “blinding
    flash of the obvious” — of course a user wants to accomplish a task as quickly
    as possible. If the user has to scroll through lots of menus, or figure out how
    the application works, then the app''s value drops exponentially with the amount
    of time it takes to get to where the user needs to be.


    But there are some subtleties to this issue. If the user can do things as quickly
    as possible, then he or she is a lot distracted from the task at hand — and both
    results are desirable. As relevance, this goal requires a seamless and transparent
    application.


    Combine these ideas and the principle of Simply Connect: You want to be able to
    connect — to a network, to the information you need, or to the task you want to
    do. For example, a friend of mine was telling me he uses his iPhone when watching
    TV so he can look up things in an online dictionary or Wikipedia. (He must watch
    a lot of Public TV.)'
  merge: -1
