  md: '# Chapter 7: Actually Writing Code


    This is what you did in Step 4 in the previous section. The declaration specifies
    the name and type of the property and some attributes that provide the compiler
    with information about how exactly you want the accessor methods to be implemented.


    For example, the declaration

    @property (nonatomic, retain) UITextField *textField;

    declares a property named textField, which is a pointer to a UITextField object.
    As for the two attributes — nonatomic and retain — nonatomic tells the compiler
    to create an accessor to return the value directly, which is another way of saying
    that the accessors can be interrupted while in use. (This works for applications
    like this).


    The second value, retain, tells the compiler to create an access method that sends
    a retain message to any object that is assigned to this property. This will keep
    it from being deallocated — having its memory taken by the iPhone OS to elsewhere
    — while you''re still using it. (I go into a bit more when I explain the dealloc
    method created for you).


    +   3. Use @synthesize in the implementation file so that Objective-C generates
    it.


    The @property declaration (like the two you placed in the interface file in Step
    4 in the previous section) only declares that there are accessors. It is the @synthesize
    statement (like the two you placed in the implementation file in Step 7 in the
    previous section) tells the compiler to create them for you. @synthesize results
    in four methods.


    ```

    textField

    setText:

    label

    setLabel:

    ```


    If I didn''t @synthesize, it would be up to me to implement the methods myself,
    using the attributes in the @property statement. If I were to write my own accessors,
    I would be responsible for sending a retain message to the textField or label
    when it is assigned to the instance variables. While there are circumstances when
    you want to do that, I will not get into them in this book.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_150_0.png)


