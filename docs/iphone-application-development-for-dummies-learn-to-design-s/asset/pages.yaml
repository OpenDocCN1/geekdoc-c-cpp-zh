    +   - Get the user enters into the text field.

    - Display the user input in the label you created.


    In effect, you have to connect things up so the left hand knows what the right
    hand is doing.


    Fortunately, the framework was designed to allow you to do this easily and gracefully.
    The view controller can refer to objects from the nib file by using a special
    kind of instance variable (a variable defined as part of a class, with each object
    of that class having its own copy) referred to as an outlet. If you (for example)
    be able to access the text field object in my ReturnMeTo application, I take two
    steps:


    +   1. Declare an outlet in my code.

    2. Use Interface Builder to point the outlet to the text field I created.


    Then, my application is initialized, the text field outlet is automatically initialized
    with a pointer to the text field. You can then use that outlet from within my
    code to get the user entered in the text field.


    The fact that a connection between an object and its outlets is actually stored
    in a nib file. When the nib file is loaded, each connection is reconstructed and
    re-established — thus enabling you to send messages to the object. IBOutlet is
    the keyword that allows an instance-variable declaration so the Interface Builder
    knows that a particular instance variable is an outlet and can then enable the
    connection to it Xcode.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_139_0.png)


    In my code, it turns out I need to create two outlets — one to point to the text
    field and one to point the label where I will display the number user enters.
    To get this outlet business started, I need to declare it, which do I do with
    the help of the aforementioned IBOutlet keyword.


    Okay, I''m guessing you realize declaring something in programming doesn''t involve
    standing on a soapbox in Hyde Park and saying something at the top of your lungs.
    Declaring something code-wise involves ... writing code. (You know that.) More
    specifically, in iPhone application development, declaring something code-wise
    involves writing code using the Xcode editor — which leads us right to the next
    section.'
