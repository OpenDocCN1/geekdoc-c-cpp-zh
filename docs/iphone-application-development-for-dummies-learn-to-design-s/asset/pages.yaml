  md: '# 178 Part III: From “Gee, That’s a Good Idea,” to the App Store


    +   3. If there is no data, create a new entry in the NSUserDefaults database.


    I know that''s easy for me to say. Let me show you how.


    +   a. Create new dictionary.


    ```

    savedNumber = @"650 555 1212";nNSDictionary *savedNumberDict = =

    [NSDictionary dictionaryWithObject:savedNumber ForKey:kNumberLocationKey];

    ```


    In order to use objectForKey (to read reference data) or setObject (to update
    data), you have to create an entry for the item you want to read or update in
    standardUserDefaults. (For NSUserDefaults to know anything about your preferences,
    you have to tell it about them first, right?) To let NSUserDefaults know what''s
    going on, you to create a dictionary listing of all the key-value pairs you are
    using here — all of them, since all you need is the savedNumber forKey:kNumberLocationKey
    pair.

    dictionaryWithObject:forKey: creates and returns a dictionary containing the key
    and value you give it. It passes savedNumber, which you initialized with 650 555
    1212 (the value), and kNumberLocationKey (the key). I had you use the same value
    — 650 555 1212 — to initialize the preference you used for the text field in Interface
    Builder back in Chapter 7, so not to confuse the user.


    +   b. Register the defaults using registerDefaults:


    ```

    [NSUserDefaults standardUserDefaults]

    registerDefaults:savedNumberDict];

    ```


    RegisterDefaults: simply tells the NSUserDefaults object to add this key to its
    value for this application. You have to do that only once, and then you can simply
    access it (using objectForKey) or update it (using setObject).


    +   4. If there is a saved number, I''m fine, and I can go all the way merry.


    Dictionaries manage pairs of keys and values. A key-value pair within a dictionary
    is an entry. Each entry consists of one object that represents the key and a second
    object that is that key''s value.


    If you had more one preference, you could have used dictionaryWithObjectsAndKeys::
    That method creates and returns a dictionary containing entries constructed from
    the specified set of keys and values:


