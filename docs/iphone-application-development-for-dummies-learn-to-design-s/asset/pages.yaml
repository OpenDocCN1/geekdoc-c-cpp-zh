    same as touching the label before. And it''s so much prettier.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_233_0.png)


    # Phoning Home


    Why then push buttons when you can just one? I originally designed my ReturnMe
    application so that any Good Samaritan found my lost iPhone could see the right
    contact phone number and give me a call so I could arrange a handover. When I
    showed this to my friends, in particular looked at me bit incredulously when I
    told him he couldn''t just press the phone number to make the call. “Why not?”
    he asked.

    “Lots of allocations to do."


    I realized here, and it''s pretty easy to do that using a Web view (UIWebView),
    a class that is part of the UIKit. It already has the ability to automatically
    recognize a phone number and initiate a call.


    You use WebView to not only embed Web content in your app, but to display anything
    coded with HTML — making it the number-one choice for displaying text in your
    app. To do so, simply create a WebView object. You can have the view the whole
    window (as I will in the iPhoneTravel411 application in Chapter 16), or also treat
    it as a control and make it a subview of your content view (which is functionally
    equivalent to how you used the label), as I will do here. In either case, all
    you need to do is tell it to show some HTML, and presto change, you''re done.
    anywhere on the Internet, stored locally, or as a string to create your program.
    I show you how to deal with HTML content from the Internet and stored locally
    when I walk through the iPhoneTravel411'
