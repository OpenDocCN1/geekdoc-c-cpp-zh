- img_proc: true
  md: '# Chapter 4: Getting to Know the SDK


    Objective-C class that will be created automatically for you when this nib file
    is loaded.


    Interface Builder does not generate any code that you have to modify or even look
    at. Instead, it creates "instant" Objective-C objects that the nib loading reconstitutes
    and turns into reals at runtime.


    If you were to take a closer look at the objects in the ReturnMeToViewController.xib
    file window — if you had a pal who knew the Interface backwards and forwards —
    you''d find out the following about each object:


    +   The File''s owner object: This is the controller object that is responsible
    for the contents of the nib file. In this case, the File''s owner is actually
    the ReturnMeToViewController that was created by Xcode and will be the primary
    object you''ll use to implement your application''s functionality. The File''s
    owner is not created from the nib file. It is created in one ways — either from
    another (previous) nib file or by a programmer who codes it manually.


    +   First Responder proxy object: This object is the first entry in an application''s
    dynamically constructed responder chain (a term I explain in Chapter 6) and is
    the object with which the user is currently interacting. For a view, it is usually
    going to start out as the View Controller object. If, the user taps a text field
    to enter some data, the first responder would then become the Text field.


    Although I use the responder mechanism quite a bit as I build the ReturnApplication,
    there''s actually nothing I have to manage. It''s automatically set and maintained
    by the UIKit framework.


    +   View object: The View icon represents an instance of the UIView class. A UIView
    is an area that you can see and interact with. In this application, you''ll only
    have to deal with the one view.


    If you take another look at Figure 4-13, you''ll notice two other windows besides
    the main window. Look at the window that has the View Word in the title bar. The
    window is the graphical representation of the View icon. If you close the View
    window and double-click the View icon, this window will open up again. It''s your
    canvas for creating your user interface: It''s where you drag user-interface elements
    such as buttons and text fields. These objects come from the Library window (the
    third window you see in Figure 4-13).'
