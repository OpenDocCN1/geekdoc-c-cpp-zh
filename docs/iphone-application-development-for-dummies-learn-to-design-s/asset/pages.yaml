    \ for example.\n- The view controller to be created when the user selects that:\
    \ AirportController, for example.\n\nYou can see all three items illustrated in\
    \ Figure 14-1.\n\nIn more complex applications, you could provide a dictionary\
    \ within the dictionary and use it to provide the same kind of information for\
