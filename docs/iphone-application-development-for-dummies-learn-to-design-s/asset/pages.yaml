  md: '# Chapter 3


    # Enlisting in the Developer Corps


    In This Chapter


    +   - Registering as a developer

    - Exploring the iPhone Dev Center

    - Installing the SDK

    - Looking at why and how to join the Developer Program


    Personally, I''m not much of a joiner. I like to keep a low profile and just get
    on with having fun what I do.


    But if you want to develop software for the iPhone, you do have to get involved
    (with another) major corporation and its policies and procedures. Apple''s iPhone
    Software Development Kit (SDK) is free, you do have to register as an iPhone developer
    first. That will give you access to all the documentation and other resources
    found on the iPhone Developer Web site. This whole ritual transforms you into
    a Registered iPhone Developer.


    Becoming a Registered Developer is free, but there''s a catch: If you actually
    want to run your application on your iPhone, as opposed to only on the Simulator
    with the SDK, you have to join the developer program. Fortunately, membership
    only costs $99; but then again, you have no choice if you want your application
    to see the light of day on the iPhone. This is called joining the iPhone Program.


    In this chapter, I lead you through the process of becoming a Registered Developer,
    signing on — and then exploring — the iPhone Dev Center Website, downloading the
    SDK so you can start it, and then (finally) joining the developer program.


    What you see when you go through this process yourself might be slightly different
    from what you see here. Don''t panic. It''s because Apple changes the site from
    time to time. For example, some of the figures in this chapter show iPhone SDK
    3.0 instead of iPhone SDK 3.1 (see these screen shots were taken right after announced
    iPhone OS 3-5 for an example). By the time you get this book, however (it takes
    a while to print them), the Web sites have been updated, and you will see iPhone
    SDK 3.1 (or whatever the current SDK is) plastered all over the Web site.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_66_0.png)'
