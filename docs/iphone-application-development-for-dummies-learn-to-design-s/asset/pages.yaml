    - (IBAction)goBack:(id) sender (\n  if ([airportView canGoBack] == NO )\n    [navigationController\n\
    \      popViewControllerAnimated:YES];\nelse\n    [airportView goBack];\n)\n```\n\
    \nIn 14, I explain why we need two ways to go back from a view. The first way\
    \ is the left button on the Navigation bar, which sends the user back to the previous\
    \ view controller and its view — the main (table) view.\n\nThe second way — a\
    \ Back button — is needed in order to return back to a \"parallel\" view — when\
    \ the user touches in a view that you sent him or her to an external Web view.\
    \ For example, in the viewDidLoad method, I show you how to create that and specify\
    \ there that when the user touches the button, the goBack: message should be sent\
    \ to AirportViewController.\n\nThe WebView actually implements much of the behavior\
    \ you need. When the user touches the Back button and this message is sent, you\
    \ first check with the Web view to see whether there's someplace to go back (it\
    \ a backward and forward list). If there's an appropriate retreat, you send the\
    \ WebView message (goBack:) that returns the previous page. If Not, it means you\
    \ are at the content page, and you \"pop\" (from the stack) the ViewController\
    \ to return to the main window — the same thing the button on the left side of\
    \ the navigation bar.\n\nFinally, you need to disable links when you're in stored\
    \ data mode — if the user's online, there's no way to go back to it. shouldStartWithRequest:\
    \ is a UIScrollView delegate method. (Remember, I made the AirportController a\
    \ UIScrollView delegate earlier when you added the airportView outlet). It's called\
    \ before a Web view begins loading content to what you want to load. I'm only\
    \ interested in doing something if the user touched a link when or she is in stored\
    \ data mode. Listing 16-4 shows the code, you'd need to disable links in such\
    \ a situation. (If you look at the complete listing on my Web site, you'll have\
    \ to do this in the City view controller as well.)"
