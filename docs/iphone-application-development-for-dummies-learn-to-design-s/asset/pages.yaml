  md: '# Chapter 2: Looking Behind the Screen


    # Using Design Patterns


    A major theme of this chapter is the fact that when it comes to iPhone app development,
    the UIKit framework does a lot of the heavy lifting for you. That''s all well
    and good, but it''s a little more complicated than that: the framework is designed
    around certain programming paradigms, also known as design patterns. The design
    pattern is a model that your own code must be consistent with.


    To understand how to take best advantage of the power of the framework — or better
    put — how the frameworks want to use you — to understand design patterns. If you
    don''t understand them — if you try to work around them because you''re sure you
    have a “better” way of doing things — it will actually make your job much more
    difficult.(Developing software can be hard enough, making your job more difficult
    is something you want to avoid.) Getting a handle on the basic design patterns
    used (by) the framework helps you develop applications that make the best of the
    frameworks. This means the least amount of work in the shortest amount of time.


    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_50_0.png)


    The iPhone design patterns can help you to understand not only how to structure
    your code, but also how the framework itself is structured. They describe relationships
    and interactions between classes or objects, as well as how responsibilities should
    be distributed amongst classes so the iPhone does what you want it to.


    The common definition of a design pattern is “a solution to a problem in context.”
    (Uh, that''s not too helpful.) At that level of abstraction, the concept gets
    fuzzy and ambiguous. So here''s how we use the term through this:


    In programming terms, a design pattern is a commonly used template that gives
    you a consistent way to get a particular task done.


    There are three basic design patterns you need to be comfortable with:


    +   - Model-View-Controller (MVC)

    - Delegation

    - Target-Action


    Of these, the Model-View-Controller design pattern is the key to understanding
    how an iPhone application works. I''ll defer the discussion of the last two until
