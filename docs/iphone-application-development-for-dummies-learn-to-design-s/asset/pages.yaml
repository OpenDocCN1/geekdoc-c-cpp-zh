    ![](img/d3e98c195a93c941d040bbbc53dc1bd8_99_0.png)


    Figure 4-13: The ReturnMeViewController in Interface Builder.


    Interface Builder supports two file types: an older format that utilizes the .nib
    and a newer format that utilizes the extension .xib. The iPhone projects use .xib
    files. While the file extension is .xib, everyone still calls them nib files.
    The term “nib” and the corresponding file extension .xib were originally developed
    on NeXT Computer, which OPENSTEP operating system was used for creating Mac OS
    X.


    The window labeled ReturnMeViewController.xib (the far-left window in Figure 4-13)
    is the nib''s main window. It acts as a table of contents for the nib file. With
    the exception of the first two icons (File''s Owner and First Responder), every
    icon in this window (in this case, there''s only one, and you''ll find more as
    you get into nib files) represents a single instance of'
  merge: -1
