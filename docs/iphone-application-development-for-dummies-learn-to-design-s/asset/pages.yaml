  md: '# 256 Part IV: An Industrial-Strength Application


    Because of its ease of use and convenience, its awareness of your location, and
    its ability to connect seamlessly to the Internet from most places, the iPhone
    lets you develop a totally new kind of application — one that integrates seamlessly
    with what the user is doing when he or she is living in the real world (a concept).
    It frees the user to take advantage of technology away from the tether of the
    desk or coffee shop, and hunt for a place to spread out the hardware. I refer
    to such applications as here-and-now apps that take advantage of technology to
    help you do a specific task with up-to-date information, wherever and whenever
    you''d like.


    All features inherent in iPhone applications enable you to add a depth to the
    user''s experience that you wouldn''t find in laptop- or desktop-based applications
    — in, a third dimension. Not only does the use of the application on the iPhone
    become embedded in where the user is and what the user is doing, the reverse is
    also happening: Where the user is and what the user is doing can be embedded in
    the application itself. This mutual embedding further blurs the boundaries between
    technology and user, as well as user and task. Finally, developers can achieve
    a goal that has been elusive for years — the seamless integration of technology
    into everyday life.


    The why-bother-l-have-my-laptop crowd still has to wrestle with the level of technology,
    especially those who haven''t grown up with it. They will look at an iPhone as
    a poor substitute for laptop or desktop — well, okay, for certain tasks, that''s
    true. But an iPhone application triggers the laptop or desktop big in two ways:


    +   - The iPhone''s portability lets you do not easily done on a laptop or desktop
    — on site and right now — as the MobileTravel411 application you to learn about.

    - The iPhone is integrated into the activity itself, creating a transparency that
    makes it unobtrusive and undistracting as possible. This advantage — more important
    than portability — is the result of context-driven design.


    The key to designing a killer application is understanding that the iPhone is
    not a small, more portable version of a laptop computer. It''s another animal
    tool, and is therefore used entirely differently. So when you go out and design
    (say) the ultimate word-processing program for an iPhone (Given the device''s
    limitations, I''d rather use a laptop.) But for point-in-time, 30-second tasks
    that may provide valuable information — and in so making someone''s life much
    easier — the iPhone can''t be.


    In this chapter, I take you through an overview of the design cycle of a complex
    application (MobileTravel411) and the resulting user interface and program architecture.
    While there are at least a dozen models for the process (I''m a recovering software
    development Methodist myself), I''ll go through here pretty simple and is well
    suited for the iPhone to boot.'
