    # Stored data mode, saving state, and localization


    Using the application design I''ve described, adding these particular features

    is easy; Easy as I work through the implementation in Chapters 14 and

    15. Although I don''t go too deeply into localization in this book, I show

    how to build your application so that you can easily include that handy

