    # About the Authors


    Dhruv has worked for the CERT at the Software Engineering Institute and continues
    to collaborate to improve the state of security awareness in the programming community.
    Dhruv obtained his M.S. in information security policy and management from Carnegie
    Mellon University. He has an undergraduate degree in computer engineering from
    Pune University, India. Dhruv is also a coauthor of The CERT® Oracle® Secure Coding
