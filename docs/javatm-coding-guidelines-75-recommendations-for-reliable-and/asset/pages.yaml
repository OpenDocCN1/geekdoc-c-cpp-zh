  md: '# Addison Wesley | Software Engineering Institute | Carnegie Mellon


    ![](img/2b355befde518a840aa335e50b7160ce_303_0.png)


    ISBN-13: 978-0-321-80395-5


    “In the Java world, security is not viewed as an add-on feature. It is a pervasive
    way of thinking. Those who forget to think in a secure mind-set end up in trouble.
    But just because the facilities are there doesn''t mean that security is assured
    automatically. A set of standard practices has evolved over the years. The CERT®
    Oracle® Secure Coding Standard for Java™ is a compilation of these practices.
    These are not research papers or product marketing blurbs. This is all serious,
    mission-critical, battle-tested, enterprise-scale staff.”


