    A security manager may be associated with any Java code. The applet manager denies
    all the most essential privileges. It is designed to protect against inadvertent
    system modification, information leakage, and user impersonation. The use of security
    managers is not limited to client-side protection. Web servers, such as Tomcat
    and WebSphere, use this facility to isolate trojan servlets and malicious Java
    Server Pages (JSP) as well to protect sensitive system resources from inadvertent
    access.


    Java applications that run from the command line can create a default or custom
    security manager using a command-flag line. Alternatively, it is possible to install
    a security manager programmatically. Installing a security manager programmatically
    helps create a default sandbox that allows or denies sensitive actions on the
    basis of the security policy in effect.


    From Java 2 SE Platform onward, SecurityManager is a nonabstract class. As a result,
    there is no explicit requirement to override its methods. To use and create a
    security manager programmatically, the code must have runtime permissions createSecurity(to
    instantiate SecurityManager) and setSecurity(to install it). These permissions
    are checked only if a security manager is already installed. This is useful for
    situations when a default security manager is in place, such as on a virtual host,
    and the latter must devote the requisite permissions for overriding the default
    security manager with a custom one.


    The security manager is closely tied to the AccessController class. The former
    is used as a hub for access control, whereas the latter provides the actual implementation
    of the access control algorithm. The security manager supports


    +   * Providing backward compatibility: Legacy code often contains implementations
    of the security manager class because it was originally abstract.


    +   * Defining custom policies: Subclassing the security manager permits definition
    of custom security policies (for example, multilevel, coarse, or fine grain).


    Regarding the implementation and use of custom security managers as opposed to
    default ones, the Java architecture specification [SecuritySpec2010] states:


    We encourage the use of AccessController in application code, while customization
    of a security manager (via subclassing) should be the last resort and should be
    done with extreme care. Moreover, a customized security manager, such as one that
    always checks the time of the day before invoking standard security checks, and
    should utilize the algorithm provided by AccessController whenever appropriate.


