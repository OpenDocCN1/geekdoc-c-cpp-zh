    # Issues Not Addressed


    A number of issues are not addressed by this secure coding standard.


    # Content


    These coding guidelines apply broadly to all platforms; specific to only one Java-based
    platform are beyond the scope of these guidelines. For example, guidelines that
    are applicable to Android, Java Micro Edition (ME), or Java Enterprise Edition
    (EE) alone and not Java Standard Edition (SE) are typically excluded. In Java
    SE, APIs that deal with the user interface (user interface toolkits) or the web
    interface for providing features such as sound, graphical rendering,'
  merge: -1
