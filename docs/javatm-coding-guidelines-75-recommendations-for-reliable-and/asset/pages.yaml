  md: "# 60. Convert integers to floating-point for floating-point operations\n\n\
    # 60. Convert integers to floating-point for floating-point operations\n\nIncautious\
    \ use of integer arithmetic to calculate a value for assignment to a floating-point\
    \ variable can result in loss of information. For example, integer arithmetic\
    \ always produces integral results, discarding information about any possible\
    \ fractional remainder. Furthermore, there can be loss of precision when converting\
    \ integers to floating-point values. See The CERT® Oracle® Secure Coding Standard\
    \ for Java™ [Long 2012], \"NUM13-J. Avoid loss of precision when converting primitive\
    \ integers to floating-point,\" for additional information. Correct programming\
    \ of expressions that combine integer and floating-point values requires careful\
    \ consideration.\n\nOperations that could suffer from integer overflow or loss\
    \ of a fractional remainder should be performed on floating-point values, rather\
    \ than integral values.\n\n# Noncompliant Code Example\n\nIn this noncompliant\
    \ code example, the division and multiplication operations are performed on integer\
    \ values; the results of these operations are then converted to floating-point.\n\
    \n```\nshort a = 533;\nint b = 6789;\nlong c = 4664382371590123456L;\n\nfloat\
    \ d = a / 7;      // d is 76.0 (truncated)\ndouble e = b / 30; // e is 226.0 (truncated)\n\
    double f = c * 2;   // f is -9.1179973305293046E18\n                     // because\
    \ of integer overflow\n```\n\nThe results of the integral operations are truncated\
    \ to the nearest integer and can also overflow. The floating-point variables d,\
    \ e, and f are initialized incorrectly because the truncation and overflow take\
