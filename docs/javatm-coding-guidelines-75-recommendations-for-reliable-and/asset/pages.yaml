  md: "load a privileged class. If its class loader lacks permission to load the requested\
    \ privileged class on its own, but the class loader is permitted to delegate the\
    \ class loading to a trusted class's class, privilege escalation can occur. Furthermore,\
    \ if the trusted code accepts inputs, the trusted code's class loader could be\
    \ persuaded to load privileged, malicious classes on behalf of the untrusted code.\n\
    \nClasses that have the same class loader will exist in the same namespace, but\
    \ they can have different privileges depending on the security policy. Security\
    \ vulnerabilities can arise when privileged code coexists with unprivileged (or\
    \ less privileged code) that was loaded by the same class loader. In this case,\
    \ the privileged code can freely access members of the privileged code according\
    \ to the privileged code declared accessibility. When the privileged code uses\
    \ any of the trusted APIs, it bypasses security manager checks (with the exception\
    \ of loadLibrary() and load()).\n\nThis guideline is for the CERT® Oracle® Secure\
    \ Coding Standard for Java™ [Long 2012], \"SEC03-J. Do not load trusted classes\
    \ after untrusted code to load arbitrary classes.\" Many examples also violate\
    \ \"SEC00-J. Do not allow privileged sensitive information across a trust boundary.\n\
    \n# Noncompliant Code Example\n\nIn this noncompliant code example, a call to\
    \ System.loadLibrary() is embedded in a doPrivileged block.\n\n```\npublic void\
    \ load(String libName) {\nAccessController.doPrivileged(new PrivilegedAction()\
    \ {\n    public Object run() {\n        System.loadLibrary(libName);\n       \
    \ return null;\n    }\n}\n);\n```\n\nThis code is insecure because it could be\
    \ used to load a library on behalf of untrusted code. In essence, the untrusted\
    \ code's class loader may be able to use this code to load a library even though\
    \ it lacks sufficient permissions to do so. After loading the library, the untrusted\
    \ code can call native methods from the library, if those methods are accessible,\
    \ because the doPrivileged block prevents security manager checks from being applied\
    \ to callers further up the execution stack.\n\nNonnative library code can also\
    \ be susceptible to related security flaws. Suppose there exists a library that\
    \ contains a vulnerability that is not directly exposed,"
