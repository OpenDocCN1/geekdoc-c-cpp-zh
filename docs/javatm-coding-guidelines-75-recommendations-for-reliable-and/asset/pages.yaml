    **normalization** Lossy conversion of the data to its simplest (and anticipated)
    form. “When implementations keep strings in a normalized form, they can be assured
    that equivalent strings have a unique binary representation” [Davis 2008].


    **obscure** One identifier obscures another in a conflicting scope if the two
    identifiers are the same but the obscuring identifier does not shadow the obscured
    identifier. This can happen if the obscuring identifier is a variable and the
    obscured identifier is a type, for example. See the JLS, §6.4.2, “Obscuring” [JLS
    2013], for more information.


    **override** One class overrides a method in a superclass if they have compatible
    signatures. The overridden method is still accessible from the class via the super
    keyword. See the JLS, §8.4.1, “Overriding (by Instance Methods)” [JLS 2013], for
    the formal definition. Contrast with hide.


    **publishing objects** “Publishing an object means making available to code outside
    of its scope, such by storing a reference to it where other code can find, returning
    it from a nonprivate method, or passing it to a method in another class” [Goetz
    2006].


    **race condition** “General races cause nondeterministic execution and failures
    in programs intended to be deterministic” [Netzer 1992]; “A race condition occurs
    when the correctness of a computation depends on the relative timing or interleaving
    of multiple threads by the runtime” [Goetz 2006].


    **safe publication** “To publish an object safely, both the reference to the object
    and the [state of the object] must be visible to other threads at the same time.
    A properly constructed object can be published by:


    +   - Initializing an object reference from a static initializer;

    - Storing a reference to it into a volatile field or AtomicReference;

    - Storing a reference to it into a final field of a properly constructed object;
    or

    - Storing a reference to it into a field that is properly guarded by a “lock”
    [Goetz 2006, §3.5 “Safe Publication”].


    **safety** Its main goal is to ensure that all objects maintain consistent states
