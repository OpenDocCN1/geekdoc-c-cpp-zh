    # 29. Be aware of numeric promotion behavior


    Numeric promotions are used to convert the operands of a numeric operator to a
    common type so that an operation can be performed. When using arithmetic operators
    with mixed operand sizes, narrower operands are promoted to the type of the wider
    operand.


    # Promotion Rules


    The JLS, §5.6, “Numeric Promotions” [JLS 2013], describes numeric promotion as
    the following:


    +   1. If any of the operands is of a reference type, unboxing conversion is performed.

    2. If either operand is of type double, the other is converted to double.

    3. Otherwise, if either operand is of type float, the other is converted to float.

    4. Otherwise, if either operand is of type long, the other is converted to long.

    5. Otherwise, both operands are converted to type int.


    Widening conversions, resulting from integer promotions, preserve the overall
    magnitude of the number. However, promotions in which the operands are converted
    from an int to a float or from a long to a double can cause a loss of precision.
    (See the CERT Oracle Secure Coding Standard for Java) [Long 2012], “NUM13-J. Avoid
    loss of precision when converting primitive integers to floating-point,” for more
    details.)


    These conversions can occur when using multiplicative operators (*, %, /), additive
    operators (+, -), comparison operators (<, <=, >=), equality operators (=, !=),
    and integer bitwise operators (&, |).


    # Examples


    In the following example, a is promoted to a double before the + operator is:


    ```

