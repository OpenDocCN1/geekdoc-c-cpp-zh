  md: "# 63. Detect and remove superfluous code and values 199\n\nThe condition in\
    \ the second statement, (x != 0), will never evaluate to true because the only\
    \ path where x can be assigned a nonzero value ends with a return statement.\n\
    \n# Compliant Solution\n\nRemediation of dead code requires the programmer to\
    \ determine not only why the code is never executed, but also whether the code\
    \ should have been executed, and then to resolve that situation appropriately.\
    \ This compliant solution assumes that the dead code should have executed, and\
    \ consequently the body of the first conditional statement no longer ends with\
    \ a return.\n\n```\nint func(boolean condition) {\n    int x = 0;\n    if (condition)\
    \ {\n        x = foo();\n        /* Process x */\n    }\n    /* ... */\n    if\
    \ (x != 0) {\n        /* This code is now executed */\n        return 0;\n   \
    \ }\n}\n```\n\n# Noncompliant Code Example (Dead Code)\n\nIn this example, the\
    \ length() function is used to limit the number of times the string_loop() iterates.\
    \ The condition of the if statement inside the loop evaluates to true when the\
    \ current index is the length of str.length(). However, because i is always strictly\
    \ less than str.length(), that can never happen.\n\n```\npublic int string_loop(String\
    \ str) {\n    for (int i=0; i < str.length(); i++) {\n        /* ... */\n    \
    \    if (i == str.length()) {\n            /* This code is never executed */\n\
    \        }\n    }\n    return 0;\n}\n```"
