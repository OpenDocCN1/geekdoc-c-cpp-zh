    # Applicability


    Confusing reference equality and object equality can lead to unexpected results.
    Using reference equality in place of object equality is permitted only when the
    defining classes guarantee the existence of at most one object instance for each
    possible object value. The use of static factory methods, rather than public constructors,
    facilitates instance control; this is a key enabling technique. Another technique
    is to use an enum type.


    Use reference equality to determine whether two references point to the same object.


