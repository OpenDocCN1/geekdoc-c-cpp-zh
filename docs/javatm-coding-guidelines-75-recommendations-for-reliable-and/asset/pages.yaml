  md: '# 18. Do not expose methods that use reduced-security checks to untrusted code
    57


    architecture controls interaction between code loaded from different sources by
    allowing the use of different class loaders. This separation of class loaders
    is fundamental to the separation of code: it prevents malicious code from gaining
    access to and subverting trusted code.


    Several methods which are charged with loading classes delegate their work to
    the class loader of the class of the method that called them. The security checks
    associated with loading classes are performed by the class loaders. Consequently,
    any method that invokes one of these class loaders must guarantee that these methods
    cannot act on behalf of untrusted code. These methods are listed in Table 1–3.


    With the exception of the loadLibrary() and load() methods, the tabulated methods
    do not perform any security checks; they delegate to the appropriate class loader.


    In practice, the trusted code''s class loader frequently allows these methods
    to be invoked, the untrusted code class loader may lack these privileges. However,
    when the untrusted code class loader delegates to the trusted code''s class loader,
    the untrusted code gains visibility to the trusted code. In the absence of a delegation
    relationship, the class loaders would fail to observe namespace separation; consequently,
    the untrusted code would be unable to observe or invoke methods belonging to the
    trusted code.


    The class loader delegation model is fundamental to many Java implementations
    and frameworks. Avoid exposing the methods listed in Tables 1–2 and 1–3 to untrusted
    code. Consider, for example, an attack scenario where untrusted code is attempting
    to


