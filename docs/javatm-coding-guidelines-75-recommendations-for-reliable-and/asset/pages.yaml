  md: "# 38\n\n# Chapter 1 Security\n\nA good practice is to append a salt to the\
    \ password being hashed. A salt is a unique (often sequential) or randomly generated\
    \ piece of data that is stored along with the hash value. The use of a salt helps\
    \ prevent brute-force attacks against the hash value, provided that the salt is\
    \ long enough to generate sufficient entropy (shorter salt values cannot significantly\
    \ slow down a brute-force attack). Each password should have its own salt associated\
    \ with it. If a single salt were used for more than one password, two users would\
    \ be able to see whether their passwords are the same.\n\nThe choice of hash function\
    \ and salt length presents a trade-off between security and performance. Increasing\
    \ the effort for effective brute-force attacks by choosing a stronger hash function\
    \ can increase the time to validate a password. Increasing the length of the salt\
    \ makes brute-force attacks more difficult but requires additional storage space.\n\
    \nMessageDigest class implementations of various cryptographic hash functions.\
    \ MD5). Hash functions such as Secure Hash Algorithm (SHA-1) and SHA-2 are maintained\
    \ by the National Security Agency, and are currently considered safe. In practice,\
    \ many applications use SHA-256 because this hash function has reasonable performance\
    \ while still being secured.\n\n# Noncompliant Code Example\n\nThis noncompliant\
    \ code example encrypts and decrypts the password stored in password.bin using\
