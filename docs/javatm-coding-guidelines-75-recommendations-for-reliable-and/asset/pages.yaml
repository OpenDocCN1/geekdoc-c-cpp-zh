  md: '# Bibliography


    [API 2013] Class Object


    # 62. Use comments consistently and in a readable fashion


    Mixing the use of traditional or block comments (starting with /* and ending with
    *) and end-of-line comments (from // to the end of the line) can lead to misleading
    and confusing code, which may result in errors.


    # Noncompliant Code Example


    The following noncompliant code examples may show mixed comments that may be misunderstood.


    ```

    /* */  /* Comment, not syntax error */

    f = g/*//h;  /* Equivalent to f = g / h; */

    */; 1O);  /* Equivalent to 1O; */

    m = n//*o  /* Equivalent to m = n + p; */

    + p;

    a = b //divisor:*c  /* Equivalent to a = b + d; */

    ```


    # Compliant Solution


    Use a consistent style of commenting.


    ```

    // Nice simple comment

    int i; // Counter

    ```


    # Noncompliant Code Example


    There are other misuses of comments that should be avoided. This noncompliant
    code example uses the character sequence /* to begin a comment, but neglects to
    use the delimiter *// to end the comment. Consequently, the call to the security-critical
    method is not executed. A reviewer examining this page could incorrectly assume
    that the code is executed.'
