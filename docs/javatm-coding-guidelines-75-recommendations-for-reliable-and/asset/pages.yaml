  md: 'xiv


    Preface


    # The CERT® Oracle® Secure Coding Standard for Java™


    Java™ Coding Guidelines are written by the authors of The CERT® Oracle® Secure
    Coding Standard for Java™ [Long 2012]. That coding standard provides a set of
    rules for secure coding in the Java programming language. The goal of those rules
    is to eliminate insecure coding practices that can lead to exploitable vulnerabilities.
    The Secure Coding Standard establishes normative requirements for software systems.
    These software systems can then be evaluated for conformance to the coding standard,
    by example, using the Source Code Analysis Laboratory (SCALE) [Seacord 2012].
    However, there are poor coding practices that, despite not inclusion in a secure
    coding standard for Java, can lead to unreliable or insecure programs. This book
    serves to document and warn against such coding practices.


    Although not included in The CERT® Oracle® Secure Coding Standard for Java™, these
    guidelines should not be considered important. Guidelines may be excluded from
    a coding standard when it is not possible to form a normative requirement. There
    are many reasons that a normative requirement cannot be formed. The most common
    is that the rule depends on programmer intent. Such rules cannot be automatically
    enforced unless it is possible for the programmer''s intent to be specified, in
    which case code would require consistency between the code and the specified intent.
    Forming a normative requirement also requires that a violation of requirement
    reflect a defect in the code. Guidelines have been excluded from the coding standard
    (but included in this book) in cases where compliance with the guideline is always
    a good idea, but violating the guideline does not always result in an error. This
    distinction is made because a system cannot be cited for nonconformance without
    a specific defect. Consequently, coding rules must be very narrowly defined. Coding
    guidelines often have a far-reaching impact on security and reliability just they
    can be more broadly defined.


    Many of the guidelines refer to in The CERT® Oracle® Secure Coding Standard for
    Java™. These references to “Normalize strings before validating them”, the first
    three letters of the reference identify the appropriate chapter of The CERT® Oracle®
    Secure Coding Standard for Java™. For example, IDS refers to Chapter 2, “Input
    Validation and Data Sanitization (IDS).”


    The Secure Coding Standard for Java rules are also available on CERT’s secure
    wiki at www.securecoding.org, where they continue to evolve. The CERT® Oracle®
    Secure Coding Standard for Java provides the definition of the rules for conformance
    testing purposes, but the wiki may contain additional information or insights
    not included in the book that may help you interpret the meaning of these rules.


    Cross-references to other guidelines throughout this book are given simply by
    the number and title of the guideline.'
  merge: -1
