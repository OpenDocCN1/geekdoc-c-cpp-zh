  md: '# Glossary


    **atomicity** When applied to an operation on primitive data, indicates that other
    threads that might access the data might see the data as it exists before the
    operation occurs or after the operation has completed, but may never see an intermediate
    value of the data.


    **canonicalization** Reducing the input to its equivalent simplest known form.


    **class variable** "A class variable is a field declared using the keyword static
    within a class declaration, with or without the keyword static within an interface
    declaration. A class variable is created when its class or interface is prepared
    and is initialized to a default value. The class variable effectively ceases to
    exist when its class or interface is unloaded" [JLS 2013, §12.3, “Kinds of Variables"].


    **condition predicate** An expression constructed from the state variables of
    a class that must be true for a thread to continue execution. The thread pauses
    execution, via Object.wait(), Thread.sleep(), or some other mechanism, and is
    resumed later, presumably when the requirement is true and it is notified [Goetz
    2006].


    **controlling expression** The top-level expression in the conditional expression
    of an if, while, do...while, or switch statement.


    **data race** "When a program contains two conflicting accesses that are not ordered
    by a happens-before relationship, it is said to contain a data race" [JLS 2013,
    §17.4.5, “Happens-before Order"].'
