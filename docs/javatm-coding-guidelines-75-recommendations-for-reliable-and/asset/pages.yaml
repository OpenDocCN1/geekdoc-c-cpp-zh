  md: "# 62. Use comments consistently and in a readable fashion\n\n```\n/* Comment\
    \ with end comment marker unintentionally omitted\nsecurity_critical_method();\n\
    /* Some other comment */\n```\n\nUsing an editor that provides syntax highlighting\
    \ or that formats the code to identify issues as missing end comment delimiters\
    \ can help detect accidental omissions.\n\nBecause missing end delimiters are\
    \ error prone and often viewed as a mistake, this approach is not recommended\
    \ for commenting out code.\n\n# Compliant Solution\n\nThis compliant solution\
    \ demonstrates the recommended way to mark code as \"dead.\" It also takes advantage\
    \ of the compiler's ability to remove unreachable (dead) code. The code inside\
    \ the if block must be syntactically correct. If other parts of the program change\
    \ in a way that would cause syntax errors, the unreachable code must be brought\
    \ up to date to correct the problem. Then, if it is needed again in the future,\
    \ the programmer need only remove the surrounding if statement and the NOTREACHED\
    \ comment.\n\nThe NOTREACHED comment could tell some compilers and static analysis\
    \ tools not to complain about this unreachable code. It also serves as documentation.\n\
    \n```\nif(false) { /* Use of critical security method no\n longer necessary, for\
    \ now */\n/* NOTREACHED */\nsecurity_critical_method();\n/* Some other comment\
    \ */\n}\n```\n\nThis is an example of an exceptional situation described in Guideline\
    \ 63, \"Detect and remove superfluous code and values.\"\n\n# Applicability\n\n\
    Confusion over which instructions are executed and which are not can result in\
    \ serious programming errors and vulnerabilities, including denial of service,\
    \ abnormal program termination, and data integrity violation. This problem is\
    \ mitigated by the use of interactive development environments (IDEs) and editors\
    \ that use fonts, colors, or other mechanisms to differentiate between comments\
    \ and code. However, the problem can still manifest, for example, when reviewing\
    \ source code printed on a black-and-white printer."
