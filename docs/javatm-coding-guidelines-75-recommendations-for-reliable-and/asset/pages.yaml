  md: "# 73. Never confuse the immutability of a reference with that of the referenced\
    \ object\n\nImmutability helps to support security reasoning. It is safe to share\
    \ immutable objects without risking modification by the recipient [Mettler 2010].\n\
    \nProgrammers often incorrectly assume that declaring a final variable makes the\
    \ referenced object immutable. Declaring variables that are a primitive type to\
    \ be final prevents changes to their values after initialization (by normal Java\
    \ processing). However, when the variable has a reference type, the presence of\
    \ a final clause in the declaration only makes the reference itself immutable.\
    \ The final clause has no effect on the referenced object. Consequently, the referenced\
    \ object may be mutable. For example, according to the JLS, §4.12.4, “final Variables”\
    \ [JLS 2013],\n\nIf a final variable holds a reference to an object, then the\
    \ state of the object may be changed by operations on the object, but the variable\
    \ will always refer to the same object.\n\nThis also applies to arrays, because\
    \ arrays are objects; if a final variable holds a reference to an array, the components\
    \ of the array may still be changed by operations on the array, but the variable\
    \ will always refer to the same array.\nSimilarly, a final method parameter obtains\
    \ an immutable copy of the object reference. Again, this has no effect on the\
    \ mutability of the referenced data.\n\n# Noncompliant Code Example (Mutable Class,\
    \ final Reference)\n\nIn this noncompliant code example, the programmer has declared\
    \ the reference to the point instance under the incorrect assumption that doing\
    \ so prevents modification of the values of the instance variables x and y. The\
    \ values of the instance variables can be changed after their initialization because\
    \ the final clause applies only to the reference to the point instance and not\
    \ to the referenced object.\n\n```\nclass Point {\n    private int x;\n    private\
    \ int y;\n\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n\
    \    }\n}\n```"
