  md: '# 52. Avoid in-band error indicators


    When overloading variable arity methods, it is important to avoid any ambiguity
    regarding which method should be invoked. The preceding code sample avoids the
    possibility of incorrect method selection by using unambiguous method signatures.
    Automated detection is straightforward.


    # Bibliography


    +   - [Bloch 2008] Use “Use Varags Judiciously"

    - [Steinberg 2008] Using the Varags Language Feature

    - [Oracle 2011b] Varags


    # 52. Avoid in-band error indicators


    An in-band error indicator is a value returned by a method that indicates either
    a legitimate return value or an illegitimate value that denotes an error. Some
    common examples of in-band error indicators include


    +   - A valid object or a null reference.

    - An integer indicating a positive value, or -1 to indicate that an error occurred.

    - An array of valid objects or a null reference addressing the absence of valid
    objects. (This topic is further addressed in Guideline 41, “Return an empty array
    or collection instead of a null value for methods that return an array or collection.")


    In-band error indicators require the caller to check for the error; however, this
    checking is often overlooked. Failure to check for such conditions only violates
    the CERT® Oracle® Secure Coding Standard for Java” [Long 2012], “EXP00-J. Do not
    ignore values returned by methods,” but also has the unfortunate effect of propagating
    invalid values that may subsequently be treated as valid in later computations.


    Avoid the use of in-band error indicators. They are much less common in Java’s
    core library than in other programming languages; nevertheless, they are used
    in the `read(byte[] b, int off, int len)` and `read(char[] cbuf, int off, int
    len)` families of methods in java.io.


    In Java, the best way to indicate an exceptional situation is by throwing an exception
    rather than returning an error code. Exceptions are propagated across scopes and
    cannot be ignored as easily as error codes can. When using exceptions, the error-detection
    and error-handling code kept separate from the main flow of control.'
