  md: "# 90 Chapter 2 Defensive Programming\n\nMachine (JVM) for examination. Several\
    \ annotations are available for documenting thread-safety or the lack thereof.\n\
    \n# Obtaining Concurrency Annotations\n\nTwo sets of concurrency annotations are\
    \ freely available and licensed for use in any code. The first set consists of\
    \ four annotations described in Java Concurrency in Practice (JCIP) [Goetz 2006],\
    \ which can be downloaded from http://jcip.net. The JCIP annotations are released\
    \ under the Creative Commons Attribution License.\n\nThe second, larger set of\
    \ concurrency annotations is available from and supported by SureLogic. These\
    \ annotations are released under the Apache Software License, Version 2.0, and\
    \ can be downloaded at www.surelogic.com. The annotations can be verified by the\
    \ SureLogic Jsure tool, and they remain useful for documenting code when the tool\
    \ is unavailable. These annotations include the JCIP annotations because they\
    \ are supported by the Jsure tool (SureLogic also supports use of the JCIP JAR\
    \ file.)\n\nTo use the annotations, download and add one or both of the aforementioned\
    \ JAR files to the code's build path. The use of these annotations to document\
    \ threadsafety is described in the following sections.\n\n# Documented Thread-Safety\n\
    \nJCIP provides three class-level annotations to describe the programmer's design\
    \ intent with respect to thread-safety.\n\n@ThreadSafe annotation is applied to\
    \ a class to indicate that it is thread-safe. This means that no sequences of\
    \ accesses (reads and writes to public fields, calls to public methods) can leave\
    \ the object in an inconsistent state, regardless of the interleaving of these\
    \ accesses by the runtime or any external synchronization or coordination by the\
    \ part of the caller.\n\nFor example, the following AircraftSafe class specifies\
    \ that it is thread-safe as part of its locking policy documentation. This class\
    \ protects the x and y fields using a reentrant lock.\n\n```\n@ThreadSafe\n@Region(\"\
    AircraftState\")\n@RegionLock(\"StateLock isLock protects AircraftState\")\npublic\
    \ final class Aircraft {\n    private final Lock stateLock = new ReentrantLock();\n\
    \    // ...\n    @InRegion(\"AircraftState\")\n    private long x, y;\n    //\
    \ ...\n```"
