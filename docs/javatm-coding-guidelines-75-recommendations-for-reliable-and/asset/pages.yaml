  md: "# 16. Avoid granting excess privileges\n\ncontaining the public key(s) corresponding\
    \ to the private key(s) used to digitally sign the code. Reference to the certificate(s)\
    \ is pertinent only if the code was digitally signed. A protection domain encompasses\
    \ CodeSource and the permissions granted to code from CodeSource, as determined\
    \ by the security policy currently in effect. classes signed by the same key and\
    \ originating from the same URL are placed in the same protection domain. A class\
    \ belongs to one and only one protection domain. Classes that have the same permissions\
    \ but are from different code sources belong to different domains.\n\nEach Java\
    \ class runs in its appropriate domain, as determined by its code source. For\
    \ any code running under a security manager to perform a secured action such as\
    \ reading or writing a file, the code must be granted permission to perform that\
    \ particular action. Privileged code can access privileged resources on behalf\
    \ of an unprivileged caller using AccessController.doPrivileged() method. This\
    \ is necessary, for example, when a system needs to open a font file in behalf\
    \ of the user the application lacks permission to do so. To perform this action,\
    \ the system utilizes its full privileges for obtaining the fonts, ignoring the\
    \ privileges of the caller. Privileged code runs with all the privileges of the\
    \ protection domain associated with the code source. These often exceed those\
    \ required to perform the privileged operation. Ideally, code should be granted\
    \ only the minimum set of privileges required to complete its operation.\n\nGuideline\
    \ 19, \"Define custom security permissions for fine-grained security,\" describes\
    \ another approach to eliminating excess privileges.\n\n# Noncompliant Code Example\n\
    \nThis noncompliant code example shows a library method that allows callers to\
    \ perform a privileged operation (reading a file) using the wrapper method performActionOnFile():\n\
    \n```\nprivate FileInputStream openFile() {\n    final FileInputStream f[] = {\
    \ null };\n\nAccessController.doPrivileged(new PrivilegedAction() {\n    public\
    \ Object run() {\n        try {\n            f[0] = new FileInputStream(\"file\"\
    );\n        } catch (FileNotFoundException fnf) {\n            // Forward to handler\n\
    \        }\n        return null;\n    }\n});\n```"
