    # 27. Identify files using multiple file attributes


    Many file-related security vulnerabilities result from a program accessing an
    uninin-

    ted object. This often happens because file names are only loosely bound

    to underlying files objects. Files provide no information regarding the nature
    of

    the file itself. Furthermore, the binding of a file name to a file object is

    evaluated each time the file name is used in an operation. This revaluation can

    introduce time-of-check, time-of-use (TOCTOU) race condition into an applica-

    tion of type java.io.File and of type java.nio.file.Path are bound to

    underlying files by the operating system when the file is accessed.


    The java.io.File constructors and the java.nio.File renameTo() and

    delete() rely solely on file names for file identification. The same holds for
    the

    java.nio.file.Path.get() methods for creating Path objects and the move() and

    delete() methods of java.nio.file.Files. Use all of methods with caution.


    Fortunately, files can be identified by other attributes in addition to the

    file name—by comparing file creation times or modification times.

    Information about a file that has been created and closed can be stored and then

    to validate the identity of the file if it must be reopened. Comparing multiple

    attributes of the file increases the likelihood that the reopend file is the same
    file

    that was previously opened.


    File identification is less crucial for applications that maintain their files
    in

    secure directories where they can be accessed only by the owner of the file and
    (pos-

    sibly) by a system administrator (see the CERT® Oracle® Secure Coding Standard
    for

    Java” [Long 2012], "FIO00-J. Do not operate on files in shared directories").'
