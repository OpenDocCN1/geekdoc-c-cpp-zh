  md: '# 24. Minimize the accessibility of classes and their members


    | Access Specifier | Class | Package | Subclass | World |

    |---|---|---|---|--|

    | private | x | | | |

    | None | | x | x* | |

    | protected | x | x | x** | |

    | public | x | x | | x |


    *Subclasses within the same package can also access members that lack access specifiers
    (default or package-private visibility). An additional requirement for access
    is that the subclasses must be loaded by the class loader that loaded the class
    containing the package-private members. Subclasses in a different package cannot
    access such package-private members.

    **To reference a protected member, the accessing code must be contained in either
    the class that defines the protected member or in a subclass of that defining
    class. Subclass access is permitted without regard to the package location of
    the subclass.


    Table 2–1 presents a simplified view of the access control rules. An x indicates
    that the particular access is permitted from within that domain. For example,
    an x in the class column means that the class is accessible to code present within
    the same class which it is declared. Similarly, the package member is accessible
    from any class (or subclass) defined in the same package, provided that the class
    (or subclass) is loaded by the class loader that loaded the member. The same class
    loader condition applies only to package-private member access.


    Classes and class members must be given the minimum possible access so that malicious
    code has the least opportunity to compromise security. As far as possible, classes
    should avoid exposing methods that contain (or invoke) sensitive code through
    interfaces; interfaces allow only publicly accessible methods, and methods are
    part of the public programming interface (API) of the class. (Note that this is
    the opposite of Joshua Bloch''s recommendation to prefer interfaces for APIs [Bloch,
    2008, 16]). One exception is if one is implementing an unmodifiable interface
    that exposes a public immutable value of a mutable object. (See The CERT® Oracle
    Secure Coding Standard for Java”) [Long, 2012], “OBJ04-J. Provide mutable classes
    with functionality to safely allow instances to untrusted code.”) Note that even
    if a nonlocal class''s visibility is default, it can be susceptible to misuse
    if it contains public methods. Methods that perform all necessary security checks
    and sanitize all inputs may be exposed through interfaces.


    Protected accessibility is invalid for non-nested classes, but nested classes
    may be declared protected. Fields of nonfinal public classes should rarely be
    declared'
