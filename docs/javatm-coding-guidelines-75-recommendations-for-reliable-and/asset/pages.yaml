    \ annotations that can document thread-confinement policies. Their approach allows\
    \ verification of the annotations against as-written code [Sutherland 2010].\n\
    \nFor example, the following annotations express the design intent that a program\
    \ has, at most, one Abstract Window Toolkit (AWT) event dispatch thread and compute\
