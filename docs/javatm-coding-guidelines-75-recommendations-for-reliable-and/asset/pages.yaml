    \ >>=, >==, and &=.\n\nAccording to the JLS §15.26.22, “Compound Assignment Operators”\
    \ [JLS 2013],\n\nA compound assignment expression of the form E1 op= E2 is equivalent\
    \ to E1 = (T)(E1 op (E2)), where T is the type of E1, except that E1 is evaluated\
    \ only once.\n\nThat is, the compound assignment expression implicitly casts the\
    \ resulting computation to the type of the left-hand operand.\n\nWhen the operands\
    \ are different types, multiple conversions can occur. For example, when E1 is\
