  md: '# Table 4-1. Misleading Characters


    | Intended Character | Could Be Mistaken for This Character, and Vice Verse |

    |---|---|

    | 0 (zero) | O (capital $o$) |

    | | D (capital $d$) |

    | 1 (one) | 1 (capital $l$) |

    | | 1 (lowercase $L$) |

    | 2 (two) | Z (capital $z$) |

    | 5 (five) | S (capital $s$) |

    | 8 (eight) | B (capital $b$) |

    | n (lowercase $N$) | h (lowercase $H$) |

    | rn (lowercase $R$, lowercase $N$) | m (lowercase $M$) |


    Avoid defining identifiers that include Unicode characters with overloaded glyphs.
    One straightforward approach is to use only ASCII or Latin-1 characters in identifiers.
    Note that the ASCII character set is a subset of Unicode.


    Do not use multiple identifiers that vary only by one or more visually similar
    characters. Also, make the initial portions of long identifiers distinct to aid
    recognition. According to the JLS, §83.10.1, “Integer Literals” [JLS 2013],


    An integer literal is of type `long` if it is suffixed with an ASCII letter `L`
    or 1 (ell); otherwise, it is of type `int`. The suffix `L` is preferred because
    the letter `l` is often hard to distinguish from the digit 1 (one).


    Consequently, use `L`, not 1, to clarify programmer intent when indicating that
    an integer literal is of type `long`.


    Integer literals with leading zeros, in actuality, denote octal values not decimal
    values. According to §83.10.1, “Integer Literals,” of the JLS [JLS 2013],


    An octal numeral consists of an ASCII digit 0 followed by one or more of the digits
    0 through 7 interspersed with underscores, and can represent a positive, zero,
    or negative integer.


    This misinterpretation may result in programming errors and is more likely to
    occur while declaring multiple constants and trying to enhance the formatting
    with zero padding.'
