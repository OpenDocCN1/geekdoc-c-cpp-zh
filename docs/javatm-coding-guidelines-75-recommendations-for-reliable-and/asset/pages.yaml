    # 24. Minimize the accessibility of classes and their members


    Classes and class members (classes, interfaces, fields, and methods) are accesscontrolled
    in Java. Access is indicated by an access modifier (public, protected, or private)
    or by the absence of an access modifier (the default access, also called package-private
    access).'
