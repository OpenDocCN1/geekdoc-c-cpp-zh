  md: 'in the namespace of a single class loader (not necessarily the primordial class
    loader). In such cases, the security policy must make this distinction clear by
    assigning appropriate privileges to trusted code while denying the same from untrusted
    code.


    **untrusted Code** of unknown origin can potentially cause some harm when executed.
    Untrusted code may not always be malicious, but it is usually hard to determine
    automatically. Consequently, untrusted code should be run in a sandboxed environment.


    **volatile** "A write to a volatile field happens-before every subsequent read
    of that field" [JLS 2013, 817.4.5, "Happens-before Order"]. "Operations on the
    master copies of volatile variables on behalf of the thread requested are performed
    by the main memory in exactly the order that the thread requested" [JVMSpec 1999].
    Accesses to a volatile variable are exempt from compiler optimizations, which
    also means that the operations are sequentially consistent, Declaring a variable
    volatile ensures that all threads see the most up-to-date value of the variable
    if any thread modifies it. Volatile guarantees atomic reads and writes of primitive
    values, but does not guarantee the atomicity of composite operations such as variable
    incrementation (read-modify-write sequence).


    **vulnerability** "A set of conditions that allows an attacker to violate an explicit
    or implicit security policy" [Seacord 2013].'
