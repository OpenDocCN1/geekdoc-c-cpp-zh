    # Applicability


    Use of mathematically and computationally insecure cryptographic algorithms can
    result in the disclosure of sensitive information.


    Weak cryptographic algorithms can be disabled in Java SE 7; see the Java™ PKI
    Programmer’s Guide, Appendix D, “Disabling Cryptographic Algorithms” [Oracle 2011a].


    Weak cryptographic algorithms may be used in scenarios that specifically call
    for a break cipher. For example, the ROT13 cipher is commonly used on bulletin
    boards and websites when the purpose of encryption is to protect people from information,
    rather than protect information from people.


    # Bibliography


    +   [Oracle 2011a] Appendix D, “Disabling Cryptographic Algorithms”

    [Oracle 2013b] Java Cryptography Architecture (JCA) Reference Guide


    # 13. Store passwords using a hash function


    Programs that store passwords as cleartext (unencrypted text data) risk exposure
    of those passwords in a variety of ways. Although programs generally receive passwords
    from users as cleartext, they should ensure that the passwords are not stored
    as cleartext.


    An acceptable technique for limiting the exposure of passwords is the use of hash
    functions, which allow programs to indirectly compare an input password to the
    original password string without storing a cleartext or decryptable version of
    the password. This approach minimizes the exposure of the password without incurring
    any practical disadvantages.


    # Cryptographic Hash Functions


    The value produced by a hash function is the hash value or message digest. Hash
    functions are computationally feasible whose inverses are computationally infeasible.
    In practice, a password can be encoded to a hash value, but decoding remains infeasible.
    The equality of the passwords can be tested through the equality of their hash
    values.'
