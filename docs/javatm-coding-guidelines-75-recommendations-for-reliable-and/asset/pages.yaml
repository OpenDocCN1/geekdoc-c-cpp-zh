  md: '# 71. Understand escape characters are interpreted when strings are loaded


    to the JLS, §33.10.6, “Escape Sequences for Character and String Literals"

    [JLS 2013],


    The character and string escape sequences allow for the representation of nongraphic
    characters as well as the single quote, double quote, and backslash in character
    literals (§33.10.4) and string literals (§33.10.5).


    Correct use of escape sequences in string literals requires understanding how
    the escape sequences are interpreted by the Java compiler, as well as how they
    are interpreted by any subsequent processor, such as an SQL engine. SQL statements
    may require escape sequences (for example, sequences containing \t, \n, \r) in
    certain cases. When representing SQL statements in Java literals, each escape
    sequence must be preceded by an extra backslash for correct interpretation.


    Another example, consider the Pattern class in performing regular expression-related
    tasks. A string literal for pattern matching is compiled into an instance of the
    Pattern type. When the pattern to be matched contains a sequence of characters
    identical to one of the Java escape sequences—“\" and "\n", for example—the Java
    compiler treats that portion of the string as a Java escape sequence and transforms
    the sequence. To insert a newline sequence, rather than a literal newline character,
    the programmer must precede the "\n" sequence with an additional backslash to
    prevent the Java compiler from replacing it with a newline character. The string
    constructed from the resulting sequence,


    ```

    \n

    ```


    consequently contains the correct two-character sequence \n and correctly denotes
    the escape sequence for newline in the pattern.


    In general, for a particular escape character of the form \X, the equivalent Java
    representation is


    ```

    \X

    ```


