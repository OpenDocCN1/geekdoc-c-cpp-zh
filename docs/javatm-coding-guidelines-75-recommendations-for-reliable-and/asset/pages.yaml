    perform operations such searching and modifying records in directories. LDAP injection
    results from inadequate input sanitization and validation, allows malicious users
    to glean restricted information from the directory service.


    A whitelist can be used to restrict input to a list of valid characters. Characters
    and character sequences that must be excluded from whitelists—including Java Naming
    and Directory Interface (JNDI) metacters and LDAP special characters—are listed
    in Table 1–1.'
