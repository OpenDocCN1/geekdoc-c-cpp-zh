  md: "# 28. Do not attach significance to the ordinal associated with an enum\n\n\
    Although this noncompliant code example behaves as expected, its maintenance is\
    \ likely to be problematic. If the enum constants were reordered, the getNumberOfCarbons()\
    \ method would return incorrect values. Furthermore, adding an additional BENZENE\
    \ constant to the model would break the invariant assumed by the getNumberOfCarbons()\
    \ method, because benzene has six carbons, but the ordinal value is already taken\
    \ by hexane.\n\n# Compliant Solution\n\nIn this compliant solution, enum constants\
    \ are explicitly associated with the corresponding integer values for the number\
    \ of carbon atoms they:\n\n```\nenum Hydrocarbon {\n    METHANE(1), ETHANE(2),\
    \ PROPANE(3), BUTANE(4), PENTANE(5),\n    HEXANE(6), BENZENE(6), HEPTANE(7), OCTANE(8),\
    \ NONANE(9),\n    DECANE(10);\n\n    private int numberOfCarbons;\n\n    Hydrocarbon(int\
    \ carbons) { this.numberOfCarbons = carbons; }\n\n    public int getNumberOfCarbons()\
    \ {\n        return numberOfCarbons;\n    }\n}\n```\n\nThe getNumberOfCarbons()\
    \ method no longer uses the ordinal() to discover the number of carbon atoms for\
    \ each value. Different enum constants may be associated with the same value,\
    \ as shown for HEXANE and BENZENE. Furthermore, this solution lacks any dependence\
    \ on the order of the enumeration; the getNumberOfCarbons() method would continue\
    \ to work correctly even if the enumeration were reordered.\n\n# Applicability\n\
    \nIt is acceptable to use the ordinals associated with an enumerated type when\
    \ the order of the enumeration constants is standard and extras cannot be added.\
    \ For example, the use of ordinals is permitted with the following enumerated\
    \ type:\n\n```\npublic enum Day { SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY,\
    \ FRIDAY, SATURDAY }\n```\n\nIn general, the use of ordinals to derive integer\
    \ values reduces the program’s maintainability and can lead to errors in the program."
