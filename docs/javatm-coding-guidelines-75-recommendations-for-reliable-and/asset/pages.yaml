    by double, and the computed value of f (9.328764743180247E18) differs from the
    exact mathematical result (9328564743180246912). This loss of precision is one
    of the many reasons correct programming of expressions that mix integer and floating-point
    operations or values requires careful consideration. See "NUM13-J. Avoid loss
    of precision when converting primitive integers to floating-point" [Long 2012],
    for more information about integer-to-floating-point conversion. Even with this
    loss of'
