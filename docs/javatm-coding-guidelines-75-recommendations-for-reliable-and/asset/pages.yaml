  md: 'than one and testing for equality to a specified value to terminate the loop.
    In this case, it is possible that the loop counter will leapfrog the specified
    value and execute forever, or until the counter wraps around and reaches its final
    value. This problem may also be caused by naive testing against limits; for example,
    looping while a counter is less than or equal to Integer.MAX_VALUE or greater
    than equal to Integer.MIN_VALUE.


    # Noncompliant Code Example


    This noncompliant code example appears to iterate five times.


    ```

    for (i = 1; i != 10; i += 2) {

    // ...

    }

    ```


    However, the loop never terminates. Successive values of i are 1, 3, 5, 7, 9,
    11, and so on; the comparison with 10 never evaluates to true. The value reaches
    the maximum representative positive number (Integer.MAX_VALUE), then wraps to
    the second lowest negative number (Integer.MIN_VALUE + 1). It works its way to
    -1, then 1, and proceeds as described earlier.


    # Noncompliant Code Example


    This noncompliant code example terminates but performs many more iterations than
    expected:


    ```

    for (i = 1; i != 10; i += 5) {

    // ...

    }

    ```


    Successive values of i are 1, 6, and 11, skipping 10. The value of i then wraps
    from near the maximum positive value to the lowest negative value and wraps its
    way upward to 0. It then assumes 2, 7, and 12, skipping 10 again. After the value
    wraps from the high positive to the low negative side three more times, it finally
    reaches 0, 5, and 10, terminating the loop.


    # Compliant Solution


    One solution is to ensure the loop termination condition is reached before the
    counter inadvertently wraps.


    ```

    for (i = 1; i == 11; i += 2) {

    // ...

    }

    ```'
