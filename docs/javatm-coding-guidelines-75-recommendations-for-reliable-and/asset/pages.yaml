    # Bibliography


    +   [LSJ 2013] §14.20.3, "try-with-resources"


    +   [Long 2012] ERR05-J. Do not let checked exceptions escape from a finally block

    FIO03-J. Remove temporary files before termination

    FIO04-J. Close resources when they are no longer needed


    +   [Tutorials 2013] The try-with-resources Statement


    # 44. Do not use assertions to verify the absence of runtime errors


    Diagnostic tests can be incorporated into programs by using the assert statement.
    Assertions are primarily intended for use during debugging and are often turned
    off before code is deployed by using -disableassertions (or -da) runtime switch.
    Consequently, assertions should be used to protect against incorrect programmer
    assumptions, and not for runtime error checking.


    Assertions should never be used to verify the absence of runtime (as opposed to
    logic) errors, such as


    +   Invalid user input (including command-line arguments and environment variables)


    +   File errors (for example, errors opening, reading, or writing files)


    +   Network errors (including network protocol errors)


    +   Out-of-memory conditions (when the Java Virtual Machine cannot allocate space
    for a new object, and the garbage collector cannot make sufficient space)


    +   System resource exhaustion (for example, out-of-file descriptors, processes,
    threads)


    +   System call errors (for example, errors executing files or locking or unlocking
    mutexes)


    +   Invalid permissions (for example, file, memory, user)


    Code protects against an I/O error, for example, cannot be implemented as an assertion
    because it must be present in the deployed executable.


    Assertions are generally unsuitable for server programs or embedded systems in
    deployment. A failed assertion can lead to a denial-of-service (DoS) attack triggered
    by a malicious user. In such situations, a soft failure mode, such as writing
    to a log file, is more appropriate.'
