    by storing the integers in the floating-point variables before performing the
    arithmetic operations:


    ```

    short a = 533;

    int b = 6789;

    long c = 4664382371590123456;


    float d = a;

    double e = b;

    double f = c;


    d /= 7;      // d is 76.14286

    e /= 30;     // e is 226.3

    f *= 2;      // f is 9.328764743180247E18

    ```


    As in the previous compliant solution, this practice ensures that at least one
    of the operands of each operation is a floating-point number. Consequently, the
    operations are performed on floating-point values.


    In both solutions, the original value of c cannot be represented exactly as a
    double. The representation of type double has only 48 mantissa bits, but a precise
