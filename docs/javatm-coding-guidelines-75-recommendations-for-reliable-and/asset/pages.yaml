    \ See “ENV01-J. Place all security-sensitive code in a single JAR and sign it”\
    \ [Long 2012]. A package insertion attack occurs when, at runtime, any package-private\
    \ members of a class can be called directly by a class that is maliciously inserted\
    \ into the same package. However, this attack is difficult to carry out in practice\
    \ because, in addition to the requirement of infiltrating the package, the target\
