  md: "# 204\n\n# Chapter 4 Program Understandability\n\nThe original ConvertDays()\
    \ C function in the real-time clock (RTC) routines for the MC13783 PMIC RTC takes\
    \ the number of days since January 1, 1980, and computes the correct year and\
    \ number of days since January 1 of the correct year.\n\nThe flaw in the code\
