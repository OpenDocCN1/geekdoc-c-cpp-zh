  md: "# 92 Chapter 2 Defensive Programming\n\nAccording to Joshua Bloch [Bloch 2008],\n\
    \nIt is not necessary to document the immutability of enum types. Unless it is\
    \ obvious from the return type, static factories must document the thread safety\
    \ of the returned object, as demonstrated by Collections.synchronizedMap.\n\n\
    The @NotThreadSafe annotation is applied to classes that are not thread-safe.\
    \ Many classes fail to document whether they are safe for multithread use. Consequently,\
    \ a programmer has no easy way to determine whether the class is thread-safe.\
    \ This annotation provides clear indication of the class's lack of thread-safety.\n\
    \nFor example, most of the collection implementations provided in java.util are\
    \ not thread-safe. The class java.util.ArrayList could document this as follows:\n\
    \n```\npackage java.util.ArrayList;\n\n@NotThreadSafe\npublic class ArrayList<E>\
    \ extends ... {\n    // ...\n}\n```\n\n# Documenting Locking Policies\n\nIt is\
    \ important to document all the locks that are being used to protect shared state.\
    \ According to Brian Goetz and colleagues [Goetz 2006],\n\n> For each mutable\
    \ state variable that may be accessed by more than one thread, all accesses to\
    \ that variable must be performed with the same lock held. In this case, we say\
    \ that the variable is guarded by that lock. (p. 28)\n\nJCIP provides the @GuardedBy\
    \ annotation for this purpose, and SureLogic provides the @RegionLock annotation.\
    \ The field or method which the @GuardedBy annotation is applied can be accessed\
    \ only when holding a particular lock or a dynamic lock such as java.util.concurrent.Lock.\n\
    \nFor example, the following MovablePoint class implements a movable point that\
    \ can remember its past locations using memo array list:\n\n```\n@ThreadSafe\n\
    public final class MovablePoint {\n\n    @GuardedBy(\"this\")\n    double xPos\
    \ = 1.0;\n```"
