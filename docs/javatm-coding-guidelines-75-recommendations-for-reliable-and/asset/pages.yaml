    # Bibliography


    [JLS 2013] §14.10, “The assert Statement”


    # 45. Use the same type for the second and third operands in conditional expressions


    The conditional operator ?: uses the boolean value of its first operand to decide
    which of the other two expressions will be evaluated. (See §15.25, “Conditional
    Operator ?:\”, of the JLS [JLS 2013])


    The general form of a Java conditional expression is operand1 ? operand2 : operand3.


    +   * If the value of the first operand (operand1) is true, then the second expression
    (operand2) is chosen.


    +   * If the value of the first operand is false, then the third operand expression
    (operand3) is chosen.


    The conditional operator ?:atb is syntactically right-associative. For example,
    a?b:c?d:e?f:g) is equivalent to (c?d:(e?f:g)).


    The JLS rules for determining the result type of a conditional expression (see
    Table 3–1) are complicated; programmers could be surprised by the type required
    for expressions they have written.


    Result type begins from the top of the table; the compiler applies the first match.
    The Operand 2 and Operand 3 columns refer to operand2 and operand3 (from the previous
    definition) respectively. In the constant, int refers to constants of type int
    (such as ''0'' or variables final).


    For the final row, S1 and S2 are the types of the second and third operands, T1
    is the type that results from applying boxing conversion to S1, and T2 is the
    type that results from applying boxing conversion to S2. The type of the conditional
    expression is the result of applying capture conversion to the upper bound of
    T1 and T2. See §15.1.7, “Boxing Conversion,” §5.1.10, “Capture Conversion,” and
    §15.1.22, “Inferring Arguments Based on Actuals” of the JLS for additional information
    [JLS 2013].


    The complexity of the rules that determine the result type of a conditional expression
    can result in unintended type conversions. Consequently, the second and third
    operands of each conditional expression should have identical types. This recommendation
    also applies to boxed primitives.'
