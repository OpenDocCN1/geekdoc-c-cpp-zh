    [Long 2012] EXP03-J. Do not use the equality operators when comparing valued primitives

    MET09-J. Classes that define an equals() method must also define a hashCode()
    method


    # 70. Understand the differences between bitwise and logical operators


    The conditional AND and OR operators (&& and ||, respectively) exhibit short-circuit
    behavior. That is, the second operand is evaluated only when the result of the
    conditional operator cannot be deduced solely by evaluating the first operand.
    Consequently, when the result of the conditional operator can be deduced solely
    from the first operand, the second operand remains unevaluated; its side effects,
    if any, will never occur.


    The bitwise AND and OR operators (& and |) lack short-circuit behavior. Similar
    to most Java operators, they evaluate both operands. They return the same Boolean
    results as && and || respectively, but can have different overall effects depending
    on the presence or absence of side effects in the second operand.'
