  md: "# 65. Avoid ambiguous or confusing uses of overloading\n\nMethod and constructor\
    \ overloading allows declaration of methods and constructors with the same name\
    \ but different parameter lists. The compiler inspects each call to an overloaded\
    \ method or constructor and uses the declared types of the method parameters to\
    \ decide which method to invoke. In some cases, however, confusion may arise because\
    \ of the presence of relatively new language features as autoboxing and generics.\n\
    \nFurthermore, methods or constructors with the same parameter types that differ\
    \ only in their declaration order are typically flagged by Java compilers. Errors\
    \ can result when a developer fails to consult the documentation at each use of\
    \ a method or constructor. A related pitfall is to associate different semantics\
    \ with each of the overloaded methods or constructors. Defining different semantics\
    \ necessitates different orders of the same method parameters, creating a vicious\
    \ cycle. Consider, for example, an overloaded distance() method in which one overloaded\
    \ method returns the distance from the source while another (with reordered parameters)\
    \ returns the remaining distance to the destination. Implementers may fail to\
    \ realize the difference unless they consult the documentation at each use.\n\n\
    # Noncompliant Code Example (Constructor)\n\nConstructors cannot be overridden\
    \ and can only be overloaded. This noncompliant code example shows the class Con\
    \ with three overloaded constructors:\n\n```\nclass Con {\n    public Con(int\
    \ i, String s) {\n        // Initialization Sequence #1\n    }\n    public Con(String\
    \ s, int i) {\n        // Initialization Sequence #2\n    }\n    public Con(Integer\
    \ i, String s) {\n        // Initialization Sequence #3\n    }\n}\n```\n\nFailure\
    \ to exercise caution while passing arguments to these constructors can create\
    \ confusion because calls to these constructors contain the same number of similarly\
    \ typed actual parameters. Overloading must also be avoided when the overloaded"
