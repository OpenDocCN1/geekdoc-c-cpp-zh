  md: "# 65. Avoid ambiguous or confusing uses of overloading\n\n```\n// Checks whether\
    \ the ssn exists\n@Override public Integer get(Object data) {\n    // SecurityManagerCheck()\n\
    \nfor (Map.Entry<Integer, Integer> entry : hm.entrySet()) {\n    if (entry.getValue().equals(data))\
    \ {\n        return entry.getValue(); // Exists\n    }\n    return null;\n}\n\n\
    public static void main(String[] args) {\n    OverLoader bo = new OverLoader();\n\
    \    // Get record at index '3'\n    System.out.println(bo.getData(3));\n    //\
    \ Get record containing data '111990000'\n    System.out.println(bo.getData((Integer)111990000));\n\
    }\n```\n\nFor purposes of overload resolution, the signatures of the getData()\
    \ methods differ only in the static type of their formal parameters. The OverLoader\
    \ class inherits from java.util.HashMap and overrides its get() method to provide\
    \ the checking functionality. This implementation can be extremely confusing to\
    \ the client who expects both getData() methods to behave in a similar fashion\
    \ and not depend on an index of the record or the value to be retrieved.\n\nAlthough\
    \ the client programmer may eventually deduce such behavior, other cases such\
    \ as with the List interface, may go unnoticed, as Joshua Bloch [Blo 2008] describes:\n\
    \nThe List<E> interface has two overloads of the remove method: remove(E) and\
    \ remove(int). Prior to 1.5 when it was \"generated\", the List interface had\
    \ a remove(Object) method in place of remove(E), and the corresponding parameter\
