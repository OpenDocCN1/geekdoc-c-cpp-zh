  md: "# Compliant Solution (Secure Sandbox)\n\nAn alternative approach is to create\
    \ a secure sandbox using a security manager (Guideline 20, \"Create a secure sandbox\
    \ using a security manager\\). The application should prevent the script from\
    \ executing arbitrary commands, such as querying the local system. The two-argument\
    \ form of doPrivileged() can be used to lower privileges when the application\
    \ must operate with higher privileges, but the scripting engine must not. RestrictedAccessControlContext\
    \ reduces the permissions granted in the default policy to those of the newly\
    \ created protection domain. The effective permissions are the intersection of\
    \ the permissions of the newly created domain and the systemwide security policy.\
    \ Refer to Guideline 16, \"Avoid granting excess privileges,\" for more details\
    \ on the two-argument form of doPrivileged().\n\nThis compliant solution illustrates\
    \ the use of AccessControlContext in the two-argument form of doPrivileged().\n\
    \n```\nclass ACC {\n    private static RestrictedAccessControlContext {\n    private\
    \ static final AccessControlContext INSTANCE;\n\n    static {\n        INSTANCE\
    \ = new AccessControlContext(\nnew ProtectionDomain[] {\nnew ProtectionDomain(null,\
    \ null) // No permissions\n});\n    }\n\n    private static void evalScript(final\
    \ String firstName)\throws ScriptException\nScriptEngineManager manager = new\
    \ ScriptEngineManager();\nfinal ScriptEngine engine = manager.getByName(\"javascript\"\
