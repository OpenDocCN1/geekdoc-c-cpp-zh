  md: '# 12. Do not use insecure or weak cryptographic algorithms


    Security-intensive applications must avoid use of insecure or weak cryptographic
    primitives. The computational capacity of modern computers permits circumvention
    of such cryptography by brute-force attacks. For example, the Data Encryption
    Standard (DES) encryption algorithm is considered highly insecure; messages using
    DES have been decrypted by brute force within a single day by machines such as
    the Electronic Frontier''s (EFF) Deep Crack.


    # Noncompliant Code Example


    This noncompliant code example encrypts a String input using a weak cryptographic
    algorithm (DES)


    ```

    SecretKey key = KeyGenerator.getInstance("DES").generateKey();

    Cipher cipher = Cipher.getInstance("DES");

    cipher.init(cipher.ENCRYPT_MODE, key);


    // Encode bytes as UTF8, strToBeEncrypted contains

    // the input string that is to be encrypted

    byte[] encoded = strToBeEncrypted.getBytes("UTF8");


    // Perform encryption

    byte[] encrypted = cipher.doFinal(encoded);

    ```


    # Compliant Solution


    This compliant solution uses the more secure Advanced Encryption Standard (AES)
    algorithm to perform the encryption.


    ```

    Cipher cipher = Cipher.getInstance("AES");

    KeyGenerator kgen = KeyGenerator.getInstance("AES");

    kngen.init(128); // 192 and 256 bits may be unavailable


    SecretKey key = kgen.generateKey();

    byte[] raw = key.getEncoded();


    SecretKeySpec keySpec = new SecretKeySpec(raw, "AES");

    cipher.init(cipher.ENCRYPT_MODE, keySpec);


    // Encode bytes as UTF8, strToBeEncrypted contains

    // the input string that is to be encrypted

    byte[] encoded = strToBeEncrypted.getBytes("UTF8");

    ```'
