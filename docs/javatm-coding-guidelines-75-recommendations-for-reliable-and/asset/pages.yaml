  md: '# 36. Write garbage collection-friendly code


    or abnormally prolonged object retention. For example, some versions of the GC
    could halt all executing threads to keep up with incoming allocation requests
    that trigger increased heap management activity. System throughput rapidly diminishes
    in this scenario.


    Real-time systems, in particular, are vulnerable to a more subtle heap-exhaustion
    DoS attack, perpetrated by stealing CPU cycles. An attacker can perform memory
    allocations in a way that increases the consumption of resources (such as CPU,
    battery power, and memory) without triggering an OutOfMemoryError. Writing garbage
    collection-friendly code restricts many attackers.


    # Avoid Short-Lived Immutable Objects


    Beginning with JDK 1.2, the generational GC has reduced memory allocation costs,
    in many cases to lower than in C or C++. Generational garbage collection reduces
    costs by grouping objects into generations. The younger generation consists of
    short-lived objects. The GC performs a minor collection on the younger generation
    when it fills up with dead objects [Oracle 2010a]. Improved garbage collection
    algorithms have reduced the cost of garbage collection so that it is proportional
    to the number of live objects in the younger generation, rather than to the number
    of objects allocated since the last garbage collection.


    Note that objects in the younger generation that persist for longer durations
    are tenured and move to the tenured generation. Few younger-generation objects
    continue to live through the next garbage-collection cycle. The rest ready to
    be collected in the pending collection cycle [Oracle 2010a].


    With GCs, use of short-lived immutable objects is generally more efficient than
    use of long-lived mutable objects, such as object pools. Avoiding object pools
    improves the GC efficiency. Object pools bring additional costs and risks: they
    can create synchronization problems and require explicit management of deallocations,
    possibly creating problems with dangling pointers. Further, determining the correct
    amount of memory to reserve for an object pool can be difficult, especially for
    mission-critical code. Using long-lived mutable objects remains appropriate when
    allocation of objects is particularly expensive (for example, when performing
    multiple joins across databases). Similarly, object pools are appropriate design
    choice when the objects represent scarce resources, such as thread pools and database
    connections.


    # Avoid Large Objects


    The allocation of large objects is expensive, in part because the cost to initialize
    their fields is proportional to their size. Additionally, frequent allocation
    of large objects of different sizes can cause fragmentation issues or compacting
    operations.'
