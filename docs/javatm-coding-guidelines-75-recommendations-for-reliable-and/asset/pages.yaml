  md: '# 14. Ensure SecureRandom is properly seeded


    # Noncompliant Code Example


    This noncompliant code example constructs a secure random number generator that
    is seeded with the specified seed bytes.


    ```

    SecureRandom random = new SecureRandom(

    String.valueOf(new Date().getTime())).getBytes()

    );

    ```


    This constructor searches a registry of security providers and returns the first
    provider that supports secure random number generation. If no such provider exists,
    an implementation-specific default is selected. Furthermore, the default system-provided
    seed is overridden by a seed provided by the programmer. Using the current time
    as the seed is predictable, and can result in the generation of random numbers
    with insufficient entropy.


    # Compliant Solution


    Prefer the no-argument constructor of SecureRandom that uses the system-specified
    seed value to generate a 128-byte-long random number.


    ```

    byte[] randomBytes = new byte[128];

    SecureRandom random = new SecureRandom();

    random.nextBytes(randomBytes);

    ```


    It is also good practice to specify the exact random number generator and provider
    for better portability.


    # Applicability


    Insufficient secure random numbers enable attackers to gain specific information
    about the context in which they are used.


    Insecure random numbers are useful in some contexts that do not require security.
    These are addressed in the exceptions to “MSC02-J. Generate random numbers” [Long
    2012].


    # Bibliography


    +   - [API 2013] SecureRandom

    - [Sethi 2009] Proper Use of Java''s SecureRandom

    - [Long 2012] MSC02-J. Generate strong random numbers'
