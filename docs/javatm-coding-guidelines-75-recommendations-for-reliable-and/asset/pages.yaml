    \ to be given to the region of the state that is being protected. That name makes\
    \ it clear the state and locking policy belong together, as demonstrated in the\
    \ following example:\n\n```\n@Region(\"private AircraftPosition\")\n@RegionLock(\"\
    StateLock protects AircraftPosition\")\npublic final class Aircraft {\n    private\
    \ final Lock stateLock = new ReentrantLock();\n\n    @Region(\"AircraftPosition\"\
    )\n    private long x, y;\n\n    @Region(\"AircraftPosition\")\n    private long\
    \ altitude;\n    // ...\n    public void setPosition(long x, long y) {\n     \
    \   stateLock.lock();\n        try {\n            this.x = x;\n            this.y\
    \ = y;\n        } finally {\n            stateLock.unlock();\n        }\n    }\n\
    \    // ...\n}\n```\n\nIn this example, a locking policy named StateLock is used\
    \ to indicate that lockingLock protects the named AircraftPosition region, which\
    \ includes the mutable state used to represent the position of the aircraft.\n\
    \n# Construction of Mutable Objects\n\nTypically, object construction is considered\
    \ an exception to the locking policy because objects are thread-confined when\
    \ they are first created. An object is confined to the thread that uses the new\
    \ operator to create its instance. After creation, the object can be published\
    \ to other threads safely. However, the object is not shared until the thread\
    \ created it allows it to be shared. Safe publication approaches discussed in\
    \ The CERT® Oracle® Secure Coding Standard for Java™ [Long 2012], \"TSM let1-J\
    \ escape reference escape object object construction\" can be expressed succinctly\
    \ with the @Unique(\"return\") annotation."
