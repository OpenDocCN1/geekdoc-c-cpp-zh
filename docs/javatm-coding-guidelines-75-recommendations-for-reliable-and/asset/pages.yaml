    # 37. Do not shadow or obscure identifiers in subscopes


    Reuse of identifier names in subscopes leads to obscuration or shadowing. Reused
    identifiers in the current scope can render those inaccessible elsewhere. Although
    the Java Language Specification (JLS) [JLS 2013] clearly resolves syntactic ambiguity
    from obscuring or shadowing, such ambiguity burdens source code maintainers and
    auditors, especially when code requires access to the original name entity and
    the inaccessible one. The problem is exacerbated when the reused name is defined
    in a different package.


    According to §6.4.2, “Obscuring,” of the JLS [JLS 2013],


    A simple name may occur in contexts where it may potentially be interpreted as
    the name of a variable, a type, or a package. In these situations, the rules of
    §6.5 specify that a variable will be chosen in preference to a type, and that
    a type will be chosen in preference to a package.


    This implies that a variable can obscure a type or a package. Shadowing, on the
    other hand, refers to one variable rendering another variable inaccessible in
    a containing scope. One type can also shadow another variable inaccessible in
    a containing scope.


    No identifier should obscure or shadow another identifier in a containing scope.
    For example, a local variable should not reuse the name of a class field or method
    or a class name or package. Similarly, an inner class name should not reuse the
    name of an outer class or package.


    Both overriding and shadowing differ from hiding, in which an accessible member
    (typically non-private) that should have been inherited by a subclass is replaced
    by a locally declared subclass member that assures the same name but has a different,
    incompatible method signature.


    # Noncompliant Code Example (Field Shadowing)


    This noncompliant code example reuses the name of the va1 field in the scope of
    an instance method.'
