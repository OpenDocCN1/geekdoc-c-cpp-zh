  md: '# Preface


    Java™ Coding Guidelines: 75 Recommendations for Reliable and Secure Programs provides
    specific advice to Java programmers. The application of these Java guidelines
    will lead to better systems that are more robust and more resistant to attack.
    These guidelines cover a wide range of products coded in Java for devices such
    as PCs, game players, mobile phones, tablets, home appliances, and automotive
    electronics.


    Developers in any programming language should follow a set of guidelines to control
    the structures of their programs over and above what is specified by the programming
    language definition, and this is no less the case in Java.


    Java programmers need more help than provided by the Java Language Specification
    (JLS) [JLS 2013] to produce reliable and secure Java programs. Java contains language
    features and APIs that can easily be misused, and guidance is needed to avoid
    these pitfalls.


    For a program to be reliable, it must work in all situations and in the face of
    all possible input. Inevitably, any nontrivial program will encounter a unexpected
    input, and errors will occur. When such errors occur, it is important that the
    impact be limited, which is best achieved by localizing the error and dealing
    with it as soon as possible. Programmers can benefit from the experience of others
    in anticipating unusual input or programming situations and adopting a defensive
    strategy of programming.


    Some of these guidelines may be deemed stylistic, but they are nonetheless important
    for readability and maintainability of the code. For Java, Oracle provides a set
    of code conventions [Conventions 2009] to help programmers produce a consistent
    programming style, and these conventions are widely adopted by Java programmers.'
  merge: -1
