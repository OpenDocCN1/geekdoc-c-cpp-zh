  md: "# 22. Minimize the scope of variables\n\nScope minimization helps developers\
    \ avoid common programming errors, improves code readability by connecting the\
    \ declaration and actual use of a variable, and improves maintainability because\
    \ unused variables are more easily detected and removed. It may also allow objects\
    \ to be recovered by the garbage collector quickly, and it prevents violations\
    \ of Guideline 37, “Do not shadow or obscure identifiers in subscopes.\"\n\n#\
    \ Noncompliant Code Example\n\nThis noncompliant code example shows a variable\
    \ that is declared outside the for loop.\n\n```\npublic class Scope {\n    public\
    \ static void main(String[] args) {\n        int i = 0;\n        for (int i =\
    \ 0; i < 10; i++) {\n            // Do operations\n        }\n    }\n}\n```\n\n\
    This code is noncompliant because, even though variable i is not used outside\
    \ the for loop, it is declared in method scope. One of the few scenarios where\
    \ variable i needs to be declared in method scope is when the loop contains a\
    \ break statement, and the value of i must be inspected after conclusion of the\
    \ loop.\n\n# Compliant Solution\n\nMinimize the scope of variables where possible.\
    \ For example, declare loop indices within the statement:\n\n```\npublic class\
    \ Scope {\n    public static void main(String[] args) {\n        for (int i =\
    \ 0; i < 10; i++) { // Contains declaration\n            // Do operations\n  \
    \  }\n}\n```"
