  md: '# Do Not Explicitly Invoke the Garbage Collector


    The GC can be explicitly invoked by calling the System.gc() method. Even though
    the documentation says that it "runs the garbage collector," there is no guarantee
    as to when or whether the GC will actually run. In fact, the call merely suggests
    that the GC should subsequently execute; the JVM is free to ignore this suggestion.


    Irresponsible use of this feature can severely degrade system performance by triggering
    garbage collection in inopportune moments, rather than waiting until ripe periods
    when it is safe to garbagecollect without significant interruption of the program''s
    execution.


    In the Java HotSpot VM (default since JDK 1.2), System.gc() forces an explicit
    garbage collection. Calls can be buried deep within libraries, where they might
    be difficult to trace. To ignore all such cases, use the flag -XX:+DisableExplicitGC.
    To avoid pauses while performing a full garbage collection, a less demanding cycle
    may be invoked by specifying the flag -XX:+ExplicitInvokedConcurrent.


    # Applicability


    Misusing garbage-collection utilizes can cause severe performance degradation,
    which can be exploited to cause a DoS attack. The Apache Geronimo and Tomcat vulnerability
    GERONIMO-4574, reported in March 2009, resulted from PolicyContext handler data
    objects being in a thread and never released, causing these data objects to remain
    in memory longer than necessary.


    When an application goes through several phases, such as an initialization and
    a ready phase, it could require heap compaction between phases. The System.gc()
    method may be invoked in such cases, provided a suitable unprevent period occurs
    between phases.


