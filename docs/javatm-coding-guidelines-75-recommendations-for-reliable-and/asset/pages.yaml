  md: '# Chapter 3


    # Reliability


    ISO/IEC/IEEE 24765:2010, Systems and software engineering—Vocabulary, defines
    reliability as the ability of a system or component to perform its required functions
    under stated conditions for a specified period of time [ISO/IEC/IEEE 24765:2010].nISO/IEC
    9126-1:2001, Software engineering—Product quality—Part 1: Quality model, provides
    a similar definition of reliability as the capability of the software product
    to maintain a specified level of performance when used under specified conditions
    [ISO/IEC 9126-1:2001].


    Software reliability is an important factor affecting software reliability. It
    differs from hardware reliability in that it reflects design perfection, rather
    than manufacturing performance. Wear or aging does not occur in software. Limitations
    in reliability are the results of faults in requirements, design, and implementation.
    Failures resulting from these faults depend on the way the software product is
    used and the program selected over elapsed time.


    ISO/IEC/IEEE 24765:2010 defines reliability as the probability that software will
    not cause the failure of a system for a specified time under specified conditions
    [ISO/IEC/IEEE 24765:2010]. The probability is a function not only of the inputs
    to and use of the system, but also the existence of faults in the software.

    The high complexity of software is the major contributing factor to software reliability
    problems.


    These guidelines deal with Java language features that can easily be misused by
    the unwary. The Java language allows a great deal of flexibility in the ways in
    which it is used, but some of these uses can lead to obscure techniques and code
    that is difficult to understand and maintain. By following these guidelines, programmers
    will produce code that is less prone to bugs and runtime failure.'
