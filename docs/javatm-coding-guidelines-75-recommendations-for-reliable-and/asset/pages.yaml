  md: '# happens-before order


    Two actions can be ordered by a happens-before relationship. If one action happens-before
    another, the first is visible and ordered before the second.... It should be noted
    that the presence of a happens-before relationship between two actions does not
    necessarily imply that they have to take place in that order in an implementation.
    If the reordering produces consistent with a legal execution, it is not illegal.
    . More specifically, if two actions share a happens-before relationship, they
    do not necessarily have to appear to have happened in order to any code with which
    they do not share a happens-before relationship. Writes in one thread that are
    in a data race with another thread, for example, appear to occur out of order
    to these reads [JLS 2013, §17.4.5, “Happens-before Order”].


    heap memory “Memory that can be shared between threads is called final or heap
    memory.... Local variables, static fields and array elements are stored in heap
    memory.... formal method parameters or exception handlers are never shared and
    are unaffected by the memory model” [JLS 2013, §17.4.1, “Shared Variables”].


    hide One class has field in a superclass if they have the same identifier. The
    hidden field is not accessible from the class. Likewise, a class method hides
    a method in a superclass if they have the same identifier, but incompatible signatures.
    The hidden method is not accessible from the class. See the JLS, §§8.4.2., “Hiding
    by Class Methods)” [JLS 2013] for the formal definition. Contrast with override.


    immutable When applied to an object, immutable means that its state cannot be
    changed after being initialized. An object is immutable if


    +   - Its state can be modified after construction;


    +   - All its fields are final; and


    +   - It is properly constructed (this reference does not escape during construction)
    [Goetz 2006].


    It is technically possible to have an immutable object without all fields final.
    String is such a class but this relies on reasoning about benign data races that
    requires a deep understanding of the Java Memory Model.


    liveness Every operation or method executes to completion without interruptions,
    even if it goes against safety.


    memory model “The rules that determine how memory accesses are ordered and when
    they are guaranteed to be visible are known as the memory model of the Java programming
    language” [Arnold 2006]. A memory model describes, given a'
