  md: '# About the Authors


    Fred Long is a senior lecturer in the Department of Computer Science at Aberystwyth
    University in the United Kingdom. He lectures on formal methods; Java, C++, and
    C programming; and programming-related security issues. He is chairman of the
    British Computer Society’s MidWales branch. Fred has been a visiting scientist
    at the Software Engineering Institute since 1992. Recently, his research has involved
    the investigation of vulnerabilities in Java. Fred is a coauthor of The CERT®
    Oracle® Secure Coding Standard for Java (Addison-Wesley, 2012).


    ![](img/2b355befde518a840aa335e50b7160ce_21_0.png)


    Dhruv Mohindra is a technical lead in the security practices group that is part
    of the CTO’s office at Persistent Systems Limited, India, where he provides information
    security consulting solutions across various various technology verticals such
    as cloud, collaboration, banking and finance, telecommunications, enterprise,
    mobility, life sciences, and health care. He regularly consults for senior management
    and development teams of Fortune 500 companies, small and medium-sized enterprises,
    and the software-development life cycle.


