  md: '# 56. Finish every set of statements associated with a case label with a break
    statement 181


    # Noncompliant Code Example


    In this noncompliant code example, a semicolon is used immediately following an
    if condition.


    ```

    if (a == b); {

    /* ... */

    }

    ```


    The statements in the apparent body of the if statement are always evaluated,
    regardless of the result of the condition expression.


    # Compliant Solution


    This compliant solution eliminates the semicolon and ensures that the body of
    the if statement is executed only when the condition expression is true:


    ```

    if (a == b) {

    /* ... */

    }

    ```


    # Applicability


    Placing a semicolon immediately following an if, for, or while condition may result
    in unexpected behavior.


    # Bibliography


    [Hatton 1995] §2.7.2, "Errors of Omission and Addition"


    +   56. Finish every set of statements associated with a case label with a break
    statement


    A switch block comprises several case labels and an optional but highly recommended
    default label. Statements that follow each case label must end with a break statement,
    which is responsible for transferring the control to the end of the switch block.
    When omitted, the statements in the subsequent case label are executed. Because
    the break statement is optional, omitting it produces no compiler warnings. When
    this behavior is unintentional, it can cause unexpected control flow.


    # Noncompliant Code Example


    In this noncompliant code example, the case where the card is 11 lacks a break
    statement. As a result, execution continues with the statements for card = 12.'
