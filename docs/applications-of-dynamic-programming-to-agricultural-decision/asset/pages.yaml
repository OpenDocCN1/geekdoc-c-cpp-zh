    # Tax Calculations


    In order to choose between the farming and CRP alternatives for each eligible
    field, the whole-farm, after-tax alternatives must be compared for each field.
    Thus, returns by field must be aggregated to their before-tax total and the tax
    calculations completed in order to make the comparison. For this analysis, taxes
    were calculated for a couple with two children filing jointly. The taxes paid
    include self-employment tax, federal income tax, and Illinois state income tax.
    No capital gains or losses, investment tax credits, or corporate taxes are included
    in the calculations.¹14


    # Results


    For each farm, CRP enrollment decisions are examined for the following baseline
    scenario: the producer does not participate in commodity programs, uses a 5 percent
    discount rate to calculate present value over a 15 year planning horizon, and
    make CRP enrollment decisions based on the county bid caps. Once the baseline
    is established, higher and lower discount rates are examined to determine their
    influence on CRP enrollment decisions, and county bids are varied to evaluate
    their impact. The analysis concludes by comparing enrollment decisions based on
    before-tax returns with those based on after-tax returns to see whether a whole-farm,
    after-tax model is actually required to investigate policy alternatives, or whether
    a field-specific model would suffice.


