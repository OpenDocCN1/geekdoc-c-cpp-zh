    # Estimation of Transition Probabilities


    Numerical solution of the investment model required state transition probabilities
    which were derived from estimated state transition equations. This section describes
    the data and estimation procedures for the hog return (HR), stock price (PS) and
    interest rate (ROF) state transition equations.


    Monthly hog returns were based on budgets reported in the Livestock Meat Situation
    and Outlook Report published by USDA. Data from the Illinois Farm Business Management
    Association (FBFM) were used to adjust the return series to reflect Illinois costs
    of production as closely as possible.


    Monthly stock prices (S&P 500 index) were collected from the Standard and Poor’s
    Statistical Reporting Service and dividend data were based on information provided
    by Ibbotson and Associates. Short term interest rate data were from the Economic
    Report of the President. All series covered the period from the beginning of 1974
    to the third quarter of 1987.


    Modelling of multiple stochastic state variables provides a special problem in
    transition relationships originate from multivariate stochastic processes. Thus,
    a state variable''s transition relationship may include not only its own lagged
    variables but other lagged state variables as well.


    The nature of the economic variables in this model provided an additional problem.
    An index was used to represent stock prices. The index showed a continual upward
    trend which was the result of economic growth. Likewise, interest rates, expressed
    in nominal terms, have also trended upwards over the sample period. In terms of
    time series analysis, the existence of trends results in non-stationary.'
