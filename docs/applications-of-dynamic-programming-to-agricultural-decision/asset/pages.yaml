  md: '# 5


    # Optimal Crop Rotations to Control Cephalosporium Stripe in Winter Wheat


    Joan Danielelson


    Cephalosporium stripe is a fungal vascular disease of winter wheat caused by the
    soil borne pathogen Cephalosporium gramineum. Infested winter wheat plants produce
    fewer and smaller kernels than healthy plants, resulting in significant yield
    losses. Once an area is infested, control of the disease is important because
    the fungus survives for long periods of time in winter wheat residues, enabling
    it to affect subsequent winter wheat crops.


    Rotating to non-host spring crops or fallow is the primary method of controlling
    the disease. This allows time for residue decomposition before winter wheat is
    seeded again. The number of years of fallow and spring crops between winter wheat
    crops, together with the Cephalosporium stripe infection level in the last winter
    wheat crop, determine the level of infection in the current winter wheat crop.


    Crop rotation and Cephalosporium stripe infestations are both dynamic processes.
    As such, current decisions have impacts on future conditions. For example, if
    the current decision is fallow, the immediate returns will be negative (the variable
    cost of fallow); but if a crop is planted in the next growing season, yields are
    generally improved. In addition, fallow adds to the years between winter wheat
    crops, so future Cephalosporium stripe infection levels will also be affected.
    The decision to plant a non-host spring crop will usually yield positive immediate
    returns, but if a crop is planted in the succeeding year, yields will generally
    be lower than if fallow had been chosen. Spring crops also add a year to the control
    process so that future winter wheat yields will be affected through future Cephalosporium
    stripe infection levels. A winter wheat decision has higher expected immediate
    returns, but has future'
