  md: '# Before-Tax and After-Tax Decisions


    The analyses were repeated using before-tax returns as a basis for the enrollment
    decision to see whether the decisions would vary from those based on after-tax
    returns. One would expect the decisions to differ when before-tax returns to farming
    or CRP enrollment served to push the producer into a higher tax bracket and reduced
    his after-tax returns relative to the other alternative.


    Some of the scenarios analyzed identical decision rules in both cases, and in
    other cases the decision rules differed.¹17 Overall, results were fairly consistent
    with the two sets of returns. Table 6.7 presents the enrollment decisions for
    the baseline scenario using before-tax returns rather than after-tax returns,
    which were used in making the decisions presented in Table 6.6. Using before-tax
    returns, Field 5 does not enter the CRP in 1988 and Field 11 does not enter in
    1989 and 1990 using before-tax returns. Otherwise, the enrollment decisions for
    the baseline scenarios are identical. The CRP enrollment alternative is slightly
    less attractive than farming when before-tax returns constitute the basis for
    making the decision.


    To estimate the maximum financial loss associated with using before-tax than after-tax
    returns to make enrollment decisions, results from the most discrepant case were
    compared with returns using the before-tax decision rule in the after-tax model.
    In the context of this problem, the before-tax decision rule is by definition
    suboptimal. The greatest discrepancy in discounted net value of returns over the
    15 year planning horizon was $31,789, which represents a difference of almost
    6 percent between the two decision rules. The maximum expected value of the difference
    between the two decision rules was determined by multiplying the unconditional
    probability associated with each state by the dollar difference between the before-
    and after-tax decisions (Howard 1960). The maximum expected cost of using the
    before-tax model to make CRP enrollment decisions for the Jackson farm was calculated
    to be $2,479 or $165 per year over a 15 year planning horizon.


    The fact that the more- and differ only slightly can be attributed in part to
    the Tax Reform Act of 1987. The new tax laws create a much more linear tax function
    with fewer discontinuities than previously prevailed. In this problem, the producer’s
    entire income derives from farming, and his taxes were free of carryover from
    previous years.'
