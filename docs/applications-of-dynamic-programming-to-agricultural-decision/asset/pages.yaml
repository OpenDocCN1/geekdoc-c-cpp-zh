  md: '# Counterintuitive Decision Rules: A Case Study


    The decision model is developed for the Texas Agricultural Research ranch in the
    Rio Grande plains of south texas. This area is characterized by a bimodal rainfall
    distribution with peak amounts of precipitation in June and September. Drought
    is defined as occurring when there are 3 or more consecutive months during the
    growing season in 50% or less of the long-term monthly average precipitation is
    received each month. Given this definition, the area typically experiences drought
    in 3 out of every 10 years. The primary enterprise is a spring calving-calf operation
    on 2700 acres of rangeland. A conservative stocking rate of 27 acres per cow-unit
    requires little supplemental feeding in late winter in most years and in periods
    of drought conditions is assumed. Production of coastal bermuda grass on 20 acres
    constitutes a secondary enterprise. Two cuttings of hay occur during the year,
    June and October. Hay yield in each period is related to stochastic weather patterns.
    Harvested hay may be sold at the prevailing price or stored in a 270 ton capacity
    facility. Hay may also be purchased and stored for future use.


    Range shortages are met by supplemental feeding of either stored or purchased
    to meet cattle requirements. Demands for forage are calculated on a monthly basis,
    as a function of stocking rate, animal unit equivalents, utilization rate, organic
    matter intake as a percent of body weight, and number of days within the month.
    All parameters except stocking rate by month and range condition. The difference
    between the demand for forage and available forage must be made-up by supplemental
    feeding of hay.


    Range conditions are represented by a monthly index of forage production conditions
    based on weather (Texas Crop and Livestock Reporting Service). The index is divided
    into five classes ranging from excellent to extreme drought. Forage production
    and hay yield were related to the index values based on clipping data over several
    years and expert opinion (Stuth).


    # Specification of the Dynamic Programming Model


    Successful application of DP requires the appropriate specification of stages,
    decision alternatives, state variables, and state variable transition equations
    (Bellman; Burt; Nemhauser; Kennedy). Stage length for the DP model is one month.
    Using months as stages provides an interval that allows for seasonal fluctuations
    in hay prices and forage production. The trade-off between using a monthly interval
    instead of a longer period is that even with presenting only the convergent decision
    rule, a large number of decisions must be discussed. Two stochastic state variables'
