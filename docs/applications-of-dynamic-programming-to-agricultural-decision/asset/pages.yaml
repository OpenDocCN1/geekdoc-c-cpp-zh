    # # Representation of Preferences in Dynamic Optimization Models Under Uncertainty


    Thomas P. Zacharias


    Applied economists, operations researchers, and management scientists have been
    actively involved in the optimization of intertemporal choice problems for some
    time now. The applications are numerous and quite varied. In particular, agricultural
    applications have been shown to be quite challenging. Broadly defined, agricultural
    applications encompass such topics as forestry, fisheries, field crop management,
    farm equipment replacement, and farm-firm growth. Each of the above mentioned
    agricultural processes can be modeled using a systems approach. Such systems are
    generally characterized by intertemporal and stochastic elements. For certain
    agricultural systems, spatial dynamics come into play as well.


    The importance of the intertemporal and stochastic nature of agricultural decision-making
    has been well documented (Barry; Kennedy). Moreover, casual inspection of the
    literature suggests that agricultural economists are keenly interested in prescriptive
    modeling of such systems. What has been lacking in the economics literature, however,
    is a discussion of the theoretical literature concerning the representation of
    decision maker preferences in a dynamic stochastic setting. Improper conceptualization
    of our intertemporal models will inevitably result in errant inference and prescription.
    The purpose of this paper will be to address the set of conceptual issues confronting
    the applied economist who is involved in prescriptive dynamic stochastic modeling
    at the firm-level. It is hoped that the following discussion will improve future
    modeling efforts and contribute to the profession''s understanding of intertemporal
    decision making under risk -- a topic which I believe to be the essence of agriculture.'
