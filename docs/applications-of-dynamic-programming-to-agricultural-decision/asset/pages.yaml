- img_proc: true
  md: '160


    A. Featherstone, T. Baker, and P. Peckel


    short-run, a one dollar change in the real returns to rotation corn and soybeans
    will raise real cash rent by 8.1 cents. In the long-run, a one dollar change in
    returns will increase cash rent by 60.3 cents.


    The modeling of land price under alternative policies is based upon the familiar
    capitalization formula. Land price is a function of rent and lagged land. Land
    price exhibits cyclical behavior similar to that documented by Burt. In the short-run,
    a one dollar increase in cash rent is capitalized at the real rate of 16.8%. In
    the long-run, a one dollar increase in rent is capitalized at the real rate of
    5.7%.


    The probability distributions specified above are continuous. However, discrete
    outcomes are necessary for the DSP model. A multivariate discrete approximation
    was made for the multivariate continuous probability space. The method used for
    this study divided the multivariate probability space into regions. For each region,
    the probability of being in the region and the conditional means of the region
    were calculated using the numerical integration technique discussed in Kaylen
    and Peckel. The vector of conditional means in each region was then chosen as
    the discrete outcomes.


    The farm model was chosen to be a four year model with 900 terminal nodes. The
    model had 4,262 constraints, 6,225 attributes, and 900 nonlinear variables. Nine
    states of nature were chosen for the first year, 5 states for the second and third
    years and 4 states for the fourth year. The model was solved using MINOS 5.0 on
    an IBM 3083 mainframe computer. Moving from the expected maximizing solution (LP)
    to the Pratt-Arrow relative risk aversion level of 3.75 required 11 minutes and
    11 seconds of CPU time. The time required to obtain the linear programming solution
    was roughly 2 hours of CPU time. The cost of each CPU hour was $500.


    # Results


    The farm level effects of the 1985 programs are examined for a representative
    Midwestern corn-soybean hog farm under two initial leverage positions (40% and
    70% debt to assets). The initial conditions were assumed to be those farmers were
    facing at the beginning of 1986. The models were identical except for the initial
    amounts of debt, equity and credit available. The 40% debt farm has initial equity
    of $750,000, initial debt of $500,000 and a 50% debt-to-asset credit limit. The
    70% farm has $375,000 of initial equity, $875,000 of initial debt, and a 75% debt-to-asset
    credit limit. For each initial debt position, the effect of risk aversion on the
    optimal portfolio of investments is examined. Eight levels of risk aversion are
    studied ranging from a Pratt-Arrow measure'
