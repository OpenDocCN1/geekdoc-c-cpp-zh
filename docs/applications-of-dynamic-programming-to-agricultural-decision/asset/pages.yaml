  md: '# Review of Literature


    As early as 1948, Heady recognized government program provisions influence crop
    mix decisions, but it was not until 1972 that a mathematical model of a farm firm
    included government program provisions. This model, developed by Scott and Baker,
    was a quadratic programming model of a central Illinois cash grain farm. Because
    program participation at that time reduced expected income, their analysis focused
    on the risk-income trade-off of participation versus nonparticipation. Several
    subsequent studies (Persaud and Mapp; Kramer and Pope; Musser and Stamoullis)
    focused on the same issue.


    Currently, farm program participation usually increases expected income, depending
    on the percentage of acreage in eligible bases. On a per acre basis, it is almost
    profitable to participate in the farm program. Participation, however, precludes
    planting any program crops beyond their program limits, and thus, on a whole-farm
    basis, participation may reduce profits if the initial bases are small and nonprogram
    crops unprofitable.


    The crop-mix and program participation decisions for any given year are complicated
    by the dynamic nature of the program base, which is an historic average of acreage
    in the commodity. Thus, out of the program and planting increased acreage in certain
    program crops may result in reduced profits expected program over a longer time
    horizon. The multi-year decision environment for program crops has been examined
    by Perry and by Mims et. Perry used quadratic programming to analyze the participation/crop-mix
    decision for Texas crop farms and found that with a two year base producers are
    often willing to exit the program for one or two years to adjust planting patterns,
