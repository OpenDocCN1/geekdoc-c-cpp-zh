  md: '# 11


    # A Dynamic Programming Analysis of a Variable Amortization Loan Plan


    Gary D. Schnitkey and Frank S. Novak


    Returns to agricultural assets are risky and are generally viewed as being dynamic.
    While returns vary, obligations on debt instruments traditionally have remained
    constant over time. Constant debt obligations tend to destabilize the farm''s
    financial position, because loan obligations are not positively correlated with
    returns to assets. If loan terms allow for a positive correlation between returns
    to assets and debt obligations, the firm''s financial position may be enhanced.
    Various "innovative" loan instruments which allow for this positive correlation
    have been proposed (see Lee and Baker for a review).


    The purpose of this paper is to analyze the performance of a variable amortization
    loan plan. This plan has been proposed by Baker (1976, 1986) and is unique in
    that it allows for a debt reserve, which provides liquidity in periods of adverse
    incomes. The variable amortization loan plan''s performance is compared to a straight
    amortization loan and a flexible amortization loan. These alternative loan plans
    are described in the next section.


    In comparing the three plans, dynamic programming models are used. These programs
    model an investment in a hog finishing operation under differing loan repayment
    plans and loan levels, considering the conflicting objectives of borrowers and
    lenders. The models determine the optimal decisions rules for withdrawing funds
    from the operation and the yearly repayment on principal. Criteria for evaluating
    alternative loan plans include the future value of withdrawals from the hog finishing
    operation, the probability of suffering a cash shortfall, and the amount of debt
    outstanding at the end of the loan term.'
