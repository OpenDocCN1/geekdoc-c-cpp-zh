    # Cephalosporium Stripe Dynamics


    The DP model must consider the effect of the number of years of control on future
    infection levels. As shown in equation (1), the level of infection is assumed
    to depend on the level of infection in the last winter wheat crop, the number
    of years of control, and a random error component.


    ```

    (1) I_(t+1),C = f(I_t, C, ε_(t+1),C) C = 1,2,3...N

    ```


    +   where

    I = the percent of infected plants in a winter wheat field at time t;

    C = the number of years of control (of fallow and/or nonhost spring crops between
    winter wheat crops);

    I_(t+1),C = the percent of infected plants in the same field the next time winter
    wheat is planted; and

    ε_(t+1),C = the random error term.


    The CEPHLOSS output indicates that infection does not begin to decrease until
    there have been three years of control. After three years of control a type of
    discontinuous geometric decline begins as years of control increase. single equation
    that exhibits a continuous geometric decline in infection with increasing years
    of control is assumed to be a reasonable approximation of this relationship.


    Based on these considerations, the following equation was selected for the Cephalosporium
    stripe model:


    ```

    (2) I_(t+1),C = exp(α+ βC + ε_(t+1),C) * I_t

    ```


    # Yield-Infection Relationship


    Winter wheat yields are assumed to depend on the previous land use (fallow or
    spring crop), and the level of Cephalosporium stripe infestation in the current
    winter wheat crop. Previous land use is included to reflect the higher yields,
    other things equal, associated with winter wheat crops planted on fallowed land
    versus crops planted on spring stubble. An additional assumption is that a given
    level of Cephalosporium stripe infestation will result in the same percentage
    reduction in yield irrespective of the previous land use (spring crop or fallow).


    Equations (3) and (4) illustrate these hypothesized relationships.'
