    This paper formulates a cashflow-constrained stochastic programming model of optimal
    farm machinery replacement. The model''s solution illustrates the tradeoffs between
    the conflicting objectives of minimizing expected cost of machinery services over
    a finite planning horizon, limiting unanticipated machine downtime, and maintaining
    cash balances. Sources of uncertainty in the decision environment include variable
    fund availability and untimely machine failure. Following sections develop the
    model and apply it to a combine replacement decision on a western Minnesota cash
    grain farm.


    # Replacement Model


    Optimal replacement of farm machinery is critical to the financial management
    of modern, capital-intensive agricultural firms. The decision involves selection
    of a series of assets which minimize expected costs of providing a constant flow
    of services over a finite planning horizon, N.¹ At stage or period, the firm must
    decide whether to replace an existing asset. If replacement is the long-run least
    cost alternative and sufficient cash reserves are available, a new machine is
    purchased. Otherwise the existing machine is retained for another period.


    In addition to planned replacement, involuntary replacement of farm machinery
    occurs. When a machine unexpectedly fails, the firm can either (1) repair the
    existing machine and incur its operating costs and chances of failure in future
    periods, or (2) involuntarily trade the failed machine for a new one with lower
    operating costs and chances of failure at some future date. Hence, simultaneity
    exists because involuntary decisions are contingent on planned replacement decisions,
    and vice versa.


    At any stage k of the horizon, the firm''s decision is a direct function of the
    system''s state as reflected by machine age j at the start of period (e.g. age
    is assumed to be a proxy for productivity and condition). Primary factors influenced
    by age include:


    ```

    Cⱼ = annual after-tax operating and ownership costs of a machine which is age
    j, including fuel, repairs, financial payments, insurance, tax depreciation deductions,
    and interest on equity capital;

    ```'
