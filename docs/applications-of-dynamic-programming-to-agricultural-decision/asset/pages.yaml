- img_proc: true
  md: '# Analysis of a Variable Amortization Loan Plan


    These results suggest that the variable amortization has potential as a viable
    loan instrument in the agriculture sector. From the lenders perspective, loan
    terms have to be scheduled such that additional debt is not generated by profit-maximizing
    farmers. This is an area requiring further research. Moreover, the results of
    the loan have to be simplified such that they are easily implementable.


    # Notes


    +   1. An objective of minimizing the probability of cash shortfalls is also appropriate.
    The dynamic programming models were solved using this objective. Similar results
    were obtained.


    # References


    Baker, C.B. "A Variable Amortization Plan to Manage Farm Mortgage Risk.\'
