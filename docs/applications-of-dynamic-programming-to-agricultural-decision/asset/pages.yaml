  md: '# 7


    # A Profit Comparison of Range Culling Decisions in the Southwest


    Russell Tronstad and Russell Gum


    Pregnancy testing of range cattle is usually done to determine if cows should
    be culled from the herd. That is, the traditional standard rule of thumb when
    pregnancy testing is to sell cows that are open and keep cows that are pregnant
    feeding a cow for almost another year in order to receive a live calf is generally
    equated with losing money. Trapp, Innes and Carman conclude that other factors
    such as the age of the cow and market prices will also influence an optimal culling
    rule in a dynamic framework. However, these studies did not consider the pregnancy
    state of the cow in determining optimal culling decisions. Consequently, the objective
    of this analysis is to solve for dynamically optimal culling decisions that consider
    the pregnancy state of the cow, age of cow, and stochastic nature of current market
    conditions (i.e., replacement price, culling price, and calf price), and compare
    the expected discounted present value of returns from these optimal decisions
    to the traditional rule of culling whenever a cow is open.


    Optimal culling decisions are generated under the assumption of a multi-period
    horizon where the cow is presumed to maximize expected wealth (i.e., risk neutrality).¹
    Two commonly utilized frameworks which incorporate the elements of time and uncertainty
    in decision problems are Stochastic Dynamic Programming (SDP) and optimal control
    theory. SDP is selected over optimal control theory for this analysis since explicit
    solution is not achieved for many problems when using optimal control theory (Burt)
    and this problem is exacerbated when stochastic variants are present (Whittle).


    The SDP recursive equation for determining optimal culling decisions is presented
    in the next section. Joint calculation of calf and replacement price transition
    probabilities is discussed in the third section, while the fourth section discusses
    other critical input features and values of the'
  merge: -1
