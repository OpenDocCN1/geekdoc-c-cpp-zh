    # Range Condition Transition Equation


    Estimation of the range condition transitions is complicated by the data set being
    incomplete. Monthly data on range condition indices for the study data were available
    for March, 1961 through November, 1971 and March, 1978 through July, 1987. Because
    of differences in weather patterns between the years within these data blocks
    along potential differences in the development and collection of the indices,
    heteroscedasticity of the indices between blocks was suspected. Tests indicated
    this was indeed the case.


    Further, the indices in the first block exhibited first order autocorrelation.
    Therefore, a slightly modified version of an estimator suggested by Theil and
    Goldberger was employed to estimate the range condition transition equations.
    This estimator is similar to the estimator suggested by Judge et al. to correct
    for heteroscedasticity when variances are constant within subgroups of observations.


    The equation is estimated of the form,


