  md: '128


    F. Novak and G. Schnitkey


    cash returns and asset appreciation and how these factors influence the firm’s
    operating structure and growth. In a dynamic world, decisions made in one time
    period affect decisions in later periods by altering financial structure and the
    nature of productive assets. The dynamics of asset accumulation are these major
    point of interest as well. The analysis of investment decisions should incorporate
    these dynamic interrelations in a multiperiod model.


    The objective of this paper is to address the issue of dynamic investment problems
    in agriculture. Specifically, the potential effects of stock investment outside
    of an agricultural enterprise on a firm’s financial structure are analyzed. The
    study also considers the influence of financial structure and returns to the agricultural
    enterprise on optimal investment decision rules. This is accomplished by specifying
    and numerically solving a stochastic dynamic programming (SDP) model for an Illinois
    hog finishing operation.


    The paper also addresses some of the inherent problems associated with firm level
    financial models. Specifically, the issues of modelling bankruptcy and dealing
    with multiple stochastic state variables are considered. The calculation and use
    of conditional probability methods which have been adapted to the dynamic programming
    framework were also discussed and illustrated.


    # The Dynamic Programming Model


    A monthly dynamic programming model was specified and solved to determine the
    optimal stock investment decision rule for an Illinois hog finishing operation.
    It was assumed that the decision maker could invest his funds into either stocks
    (S) or other financial instruments (OF) such as a money fund. The stock investment
    could be easily achieved through a mutual fund. Returns to stock investment were
    calculated as changes in the price of the fund from period to period plus any
    dividend income. The model contained three stochastic state variables: hog returns
    (HR)defined as revenue minus costs, stock prices (PS), and return on other financial
    instruments (ROF), and two deterministic state variables: holdings of other financial
    instruments (OF), and stock holdings (S). Investments in other financial instruments
    represented an asset held in positive amounts or a liability when negative (i.e.,
    operating credit). The decision in each period was the level of stocks to buy
    or sell (DS).


    The stock investment model was formulated as a terminal wealth maximization problem
    rather than the standard present value'
