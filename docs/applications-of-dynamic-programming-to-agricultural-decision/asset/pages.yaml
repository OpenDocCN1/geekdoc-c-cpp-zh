  md: '# 6


    # C. Robert Taylor


    Most textbook treatments of the DP curse of dimensionality are misleading in the
    state variables that they usually refer to the curse in the context of the number
    of state variables (e.g., Bellman 1957, p. ix; Bellman and Kalaba 1965, p. 61;
    Hadley 1964, Bellman 1961, p. 94, 1997), when it is actually the total number
    of states that limits application of the technique. The total number of states
    is defined as the product of the number of states for each state variable. It
    is the total number of states which largely determines state storage requirements
    and computational time requirements to numerically solve a DP model.


    Although the significance of the total number of states was undoubtedly clear
    to Bellman, wording in the literature can easily mislead beginning students of
    DP. The subtle distinction between the number of state variables and the number
    of states is quite important for two reasons. First, we often have state variables
    that naturally have only a few. For example, in a flex cropping model, one state
    variable would be a field that was cropped or followed the previous year; there
    are only two states for this state variable. Second, it has been my experience
    that many newcomers to DP overestimate the number of states required for most
    variables in agricultural decision models. For example, we think of prices as
    being variables of great significance, I have found that only five states for
    each state variable often gives a level of accuracy in excess of the accuracy
    of the parameters of the model. Use of interpolation of the optimal value function
    in the right-hand side of (3) combined with interpolation of the resulting decision
    rule often gives a very high degree of accuracy.


    Another aspect of the curse refers to the computer storage requirements which
    grow exponentially with the total number of states. Storage of all arrays used
    in the DP calculation (which are the one-period return function, optimal value
    function for all stages, optimal decision rule for all states and stages, and
    transition probabilities for all states, stages and decision alternatives), can
    easily exceed available memory on even a supercomputer for a moderately sized
    DP problem. However, beginning practitioners of DP need to recognize that much
    of this information does not have to be stored in memory. First, due to the recursive
    nature of the calculations, no elements of the optimal decision rule need to be
    stored (the optimal decision associated with a given state can be printed to a
    file when it is computed; it is no longer needed in the computations), although
    it is advisable to store a few elements of this matrix for efficient footprint
    of the results. Second, we do not have to store the optimal value function for
    all stages; rather, we only need to store the optimal value function in the previous
    stage in the computations (i.e., V_{t+1} on the right-hand side of recursive equation
    (3)), and the optimal value function for the current stage in the computations
    (i.e. V(t)), which'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Dynamic Programming and the Curses of Dimensionality


    will be used in computations for the next stage, working backwards through time.


    Third, it is seldom necessary to store a fully dimensioned transition probability
    matrix. Most applied dynamic programming models of agricultural decisions have
    a mix of deterministic and stochastic state variables. A full transition probability
    matrix (the matrix for all states) will be comprised of large null sub-matrices
    which need not be stored or even looped through in computing the expected value
    on the right-hand side of recursive equation (3). If the stochastic state variables
    are independent, transition probability matrices for individual state variables
    can be stored to further reduce memory requirements.


    Finally, if a mathematical expression is used to compute transition probabilities
    can be completely eliminated if memory limits are restricted. Transition probabilities
    can be computed as needed. Although repeated computation of the same probabilities
    will substantially increase compute time it will allow solution of large models
    on computers with limited memory, such as a personal computer.


    Use of minimal memory required to solve a DP problem combined with the powerful
    and relatively inexpensive computers now allow us to solve quite large dynamic
    programming problems on desktop computers. With current personal computer technology
    it is now possible to solve stochastic dynamic programming problems with a few
    hundred thousand states by letting them run for a day or two.


    Variants of five DP models solved on computers ranging from a 8086 personal computer
    to a Cray supercomputer are benchmarked in Taylor. DP models benchmarked in Taylor
    along with the very large DP models reported at this conference clearly demonstrate
    that present computational power, combined with efficient use of computer memory,
