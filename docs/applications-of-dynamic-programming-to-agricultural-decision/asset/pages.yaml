    # Involuntary Replacement


    The costs of premature trading discussed above could be incurred if the existing
    asset is involuntarily replaced as a result of an unexpected failure. Whether
    a failed combine is repaired and retained or traded for a new machine depends
    in part on the opportunity cost and amount of downtime associated with the breakdown
    and the degree to which the price of a machine with a known failure is discounted.


    With the trade-in value of a failed machine equal to 95 percent of actual value
    less costs of repair, the optimal decision in this analysis is generally to repair
    rather than trade a failed machine. The costs of premature replacement and discount
    applied to a failed machine exceed the opportunity cost of leasing a temporary
    combine during the time an existing machine is repaired. Involuntary replacement
    occur in 36 percent of all possible situations–near the period when voluntary
    trading would naturally occur. The sensitivity of the decision rule to changes
    in these variables is illustrated in Table 4.2. As the value of a failed machine
    is more deeply discounted and opportunity costs of repairing it diminish, the
