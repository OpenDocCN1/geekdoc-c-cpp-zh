  md: '# An Application to Agricultural Investment


    Stationarity is required to ensure that the estimated transition probabilities
    are derived from a process which is time invariant. Stationarity was achieved
    by differencing the stock price and interest rate series once.


    Tentative dynamic interrelations between hog returns, stock prices and interest
    rates were originally identified through time series techniques (Granger and Newold).
    Sample autocorrelations and cross-correlations suggested that hog returns were
    not correlated with either interest rates or stock prices. Hog returns showed
    evidence of lower order autoregressive structure. Autocorrelations and partial
    autocorrelations for stock price and interest rate suggested that these variables
    were interrelated and that lower level autoregressive models adequately capture
    their Markovian relationships.


    # Hog Return Transition Relationship


    Examination of autocorrelations and partial autocorrelations suggested that the
    hog return relationship could be modelled with a second order autoregressive process,
