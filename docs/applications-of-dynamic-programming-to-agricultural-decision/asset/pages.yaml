  md: '# Conclusions


    The modeling of optimal capital structure has confronted agricultural economists
    for many years. This paper has demonstrated the use of discrete stochastic programming
    (DSP) to model optimal capital structure. DSP was chosen because of its ability
    to handle factors such as liquidity risk and credit reserve risk. These are difficult
    to handle because the consequence of a sequence of unfavorable outcomes are not
    simply the opposite of consequences following a sequences of unfavorable outcomes.
    Direct expected utility maximization using a nonlinear utility function can also
    be handled in the DSP framework. DSP was also used because of the ease that shadow
    prices can be calculated and interpreted. This allows the modeler to draw important
    inferences which may be unavailable by simply examining the primal solution.


    In the process of building the DSP model, several issues were raised that deserve
    further research. Perhaps the most critical is the discrete approximation to the
    probability distributions. The probability distributions were constructed in a
    manner such that the means were equal. A recent paper by Miller and Rice demonstrates
    that in the univariate case using the conditional mean and the associated probability
    will underestimate the variance of the distribution. Other moments of the distributions
    such as skewness and kurtosis are also underestimated. They suggest an alternative
    procedure over Gaussian quadrature. In the case of subjective, continuous distributions,
    Gaussian quadrature must be used twice, once to calculate the subjective distributions,
    and once to calculate the discrete distribution. Generalizing the technique to
    the multivariate case would help the modeler to have more confidence that the
    selection of the discrete states would not bias the results in an unknown direction.


    Another area of study needing further study is the choice of an appropriate objective
    function. In this paper, it was assumed that the maximization of expected utility
    of ternary net worth was appropriate subject to the subtraction of a fixed consumption
    amount. Do farmers behave this way or do they adjust consumption by changes in
    net worth? A final area of study would be the appropriate length of planning horizon
    to get "realistic" first period decisions when considering optimal capital structure
    choice. This paper used a year model. Although the "curse of dimensionality" is
    retreating this will still be a relevant question for DSP users. There will always
    be a tradeoff between the quality of the probability information and the length
    of the planning horizon. However, DSP is a viable alternative for modeling dynamic
    and stochastic processes.'
