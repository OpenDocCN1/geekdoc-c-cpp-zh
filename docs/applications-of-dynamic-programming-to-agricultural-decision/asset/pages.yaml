  md: '# 10


    # Modeling Dynamics and Risk Using

    Discrete Stochastic Programming: A

    Farm Capital Structure Application


    Allen M. Featherstone, Timothy G. Baker,

    and Paul V. Preckel


    The choice of capital structure is one of the most difficult problems

    farmers face. The optimal capital structure of a farm is dependent on a

    number of factors including the return on assets, the cost of debt, and

    availability of debt and the farmer''s risk preference. Sanint and Barry

    have modeled the optimal leverage decision using a mean-variance

    multiperiod risk-programming model. Even though roughness in cash

    flow is important, Sanint and Barry cash flow dynamics as a linear

    (symmetric) response to the random variable. However, important

    factors in the optimal leverage decision such as liquidity risk and credit

    reserve risk are likely asymmetric. The asymmetry arises primarily

    because the consequences of a sequence of unfavorable outcomes are not

    simple the opposite of consequences following a sequence of favorable

    outcomes.


    There is a need for liquidity in the normal course of a farm''s operation

    because of the variability in farm income. Many times, however, a

    reduction in liquidity occurs precisely at the time when a farm needs the

    extra cash to meet its obligations. This is known as liquidity risk. The

    farmer''s ability to meet cash obligations is in jeopardy when a

    sequence of bad years occurs. If he has not carried sufficient liquidity

    erves, productive assets may have to be sold off at low prices to meet

    cash obligations. The lower than normal prices occur because buyers of

    farm assets are often farmers themselves, and when it is necessary for one

    farmer to sell assets to cover cash obligations other farmers are likely to

    have similar needs. Therefore, supply may greatly exceed demand

    causing low prices.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'Barry, Baker, and Sanit discuss forces that determine the supply of credit.
    These include determinants originating in the financial markets, such as monetary
    and fiscal policies and aggregate economic performance, along with determinants
    originating in agriculture, such as market conditions for commodities and load.
    The latter group primarily affect the lender''s assessment of the farmer''s credit
    worthiness. Credit reserve risk arises because available credit is positively
    correlated with expected income and asset values. Thus, holding credit reserves
    as a means of maintaining liquidity is risky during those times when credit reserves
    are needed to be used for liquidity, the actual credit available tends to decrease.


    Interest rate risk is another factor important in the leverage decision. Interest
    rate risk arises because farmers are not able to borrow at a constant real interest
    rate. Although some loans may have a fixed nominal rate, the real rate of interest
    varies with inflation, thus the farmer is subject to interest rate risk.


    Discrete stochastic programming (DSP) is one methodology that can be used to model
    optimal capital structure decisions. The purpose of this paper is to illustrate
    the use of DSP in modeling farm capital structure. Dynamics and stochastics are
    modeled, not to forecast, but to capture the effects of random variable and dynamic
    interactions on the current decisions. Because of liquidity risk, divestment decisions
    are especially costly, therefore it is especially important to consider probability
    weighted future events when making investment decisions.


    # Modeling with Discrete Stochastic Programming


    Problems modeled using DSP may be viewed as finite horizon dynamic programming
    problems with discrete random events and continuous choice variables. DSP is a
    type of mathematical programming which can model uncertainties in the right-hand
    sides, technical coefficients, and objective function. Because of the "curse of
    dimensionality", there have been only a modest number of applications of DSP since
    its development in 1969 by Cocks. DSP has been used to model fresh vegetable storage
    (Rae), investment in grain dryers and storage (Klemme), participation in government
    programs (Kaiser and Apland), the choice between fixed and variable loans (Leatham
    and Baker), the marketing of white wheat (Lambert and McCarroll), and the marketing
    of cattle (Schroeder and Featherstone).


    A schematic describing a simple DSP model is illustrated in Figure 1. The model
    is represented by a tree structure which is a collection of nodes and arcs with
    special properties. Moving forward through time'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Modeling Dynamics and Risk Using Discrete Stochastic Programming


    corresponds to traversing the tree from left to right. Three types of nodes, random
    events, decisions, and payoffs represented by rectangles, bold rectangles, and
    at the right-hand side, terminal nodes of the tree, respectively. When a random
    event node is encountered, the value of the associated random variable is realized.
    In a DSP random variables are assumed to have discrete distributions with each
    possible outcome represented by an arc to the right of the node with probability
    (p). When a decision node is encountered an irreversible decision is made, possibly
    subject to a set of constraints. This decision is made with knowledge of all past
    decisions and realized random variables (to the left), and knowledge of the distributions
    of future random variables (to the right). At the extreme right of the tree appears
    a payoff (terminal) node for all realizations of the random variables. The payoff
    (Z) is a function of the realizations of the random variables and the choice variables
    encountered along that path. Thus, the terminal nodes represent the marginal probability
    of payoffs which are functions of the decisions. The marginal probability of each
    payoff node is the product of the conditional probabilities of the realizations
    of the random variables along the associated path. For instance, in the diagram
    probability of the top-most payoff is (1.0) x (.3) x (.4) x (.1) = 0.012, and
    the probability of the bottom-most is (1.0) x (.7) x (.5) x (.6) = .21.


    A stage is defined as the decision node and the realization of that decision.
    The realizations of the random variables after a decision node are called states
    of nature. In the schematic, subscripts refer to stages and superscripts refer
    to states. In contrast to dynamic programming (DP), a DSP model simultaneously
    computes the optimal choices for all decision nodes. Like DP all decisions are
    consistent with the overall problem objective. This means that each decision is
    affected not only by prior realizations and decisions, but also by future decisions
    and conditional distributions of future events.


