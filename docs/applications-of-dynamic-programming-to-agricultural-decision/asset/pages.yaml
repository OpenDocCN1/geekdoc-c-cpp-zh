    Second, von Weissacker''s discussion of satisficing behavior seems to be the most
    operational criterion which could be readily used by prescriptive models. Use
    of target aspiration levels has a great deal of practical merit, particularly
    in the field of farm management. Target levels could be financial in nature (solvency
    or liquidity measures, etc.) and easily quantifiable. In addition, one could employ
    (probably without a great deal of effort) many of the numerical and analytical
    results which are currently available in the macroeconomic literature. As a means
    of comparison, one could solve target-based dynamic optimizations and expected
    value optimizations. Results of the analysis could reveal potential trade-offs,
    trajectories of the state variables, and the variance in income.


    Third, the separable nature of DP formulations should be given careful scrutiny
    in certain applications. The issue of functional separability has been given much
    attention in the duality literature. However, the implications of intertemporal
    separability in prescriptive models is probably not widely recognized. The implications
    of intertemporal separability would seem to be a major concern in the areas of
    natural resource and environmental economics.


    # Limitations of the Expected Utility Model


    Applications of the expected utility (EU) model and associated risk-efficiency
    criteria have been widespread in the agricultural economics literature. The EU
    model has been and continues to be a powerful tool, but it was never designed
    to deal with dynamic optimization problems. Thus, its use in agricultural applications
    must be seriously questioned on a case by basis. If the EU model is to be used
    in a dynamic choice problem, then the behavioral implications should be fully
    explored in terms of inference and prescription. Failure to adequately address
    the implications of such research efforts leads to nothing more than machinations.


    At this point in time, temporal von Neumann-Morgenstern is an operational criterion
    and DP applications should be pursued. Initially, these applications should probably
    be of low dimensionality with a great deal of attention given to sensitivity analysis.
    Temporal von Neumann-Morgenstern also has implications for information theory.
