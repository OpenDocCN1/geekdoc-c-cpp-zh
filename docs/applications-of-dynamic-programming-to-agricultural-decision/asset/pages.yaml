  md: '# An Application to Agricultural Investment


    Resulting state probability vectors represented a joint probability density function,
    conditional on the beginning state variables, presumably that the optimal decision
    rule was followed. Standard discrete probability techniques (see, for example,
    Hogg and Craig) were used to find a state variable''s marginal distribution. This
    required finding the probability of being in each of the state variables'' intervals.
    For example, the probability of occupying the of, financial holdings state interval
    equal:


    ```

    Pr(of_j) = \sum_{hr} \sum_{ps} \sum_{s} \pi_i (hr, ps, rof, of_j, s)

    ```


    Repeating the above operation for all financial holdings state intervals resulted
    in the marginal distribution. Marginal distributions were found for financial
    holdings and stock holdings levels.


    Application of conditional probability theory (Hogg and Craig) to the marginal
    distributions developed above yields important information on the linkages between
    the state variables. The probability of being in the of, financial holdings state
    interval given a particular stock holdings, s_i is calculated as:


    ```

    Pr(of_j | s_i) = \frac{\sum_{hr} \sum_{ps} \sum_{for} \pi_i (hr, ps, rof, of_j,
    s_i)}{Pr(of_j)}

    ```


    Completing this calculation for all financial holdings states gives the financial
    holdings distribution conditional on the stock holdings state s_j.


    The effects of bankruptcy were investigated using this method. Financial holdings
    and stock holdings distributions conditional on being solvent were calculated.
    For example, the conditional probability of being in the of, state equaled:


    ```

    Pr(of_j|solvent) = Pr(of_j) / (1 - Pr(bankruptcy))

    ```


    Where Pr(bankruptcy) equals the probability in the bankruptcy state. Repeating
    the above operation for all state intervals resulted in the conditional distribution.
    A similar process was conducted for the stock holdings interval.


    Also, expected wealth levels were calculated using the state probability vector.
    This was accomplished by summing the result of each state interval''s probability
    times each state interval''s wealth.'
