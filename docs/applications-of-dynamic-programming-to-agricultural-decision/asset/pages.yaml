    When the producer''s income includes depreciation, capital gains, or off-farm
    income, tax considerations may become more important. However, as income from
    other sources increases,¹⁰ the tax impact of the enrollment decision for a single
    field decreases in relative importance.

    The empirical and practical rationale for using a whole-farm model to analyze
    CRP enrollment decisions is less compelling. A field-specific model would accommodate
    more state variables, stochastic and/or deterministic, and thus incorporate more
    factors into the decision process. The biggest advantage of using a field-specific
    model would be having the option to analyze as many fields on a farm as desired.
    The number of eligible fields that could be evaluated would not be limited, as
    it is with the whole-farm model in its present configuration. A field-specific
    model could be expected to yield optimal decisions for the majority of fields,
    but some decisions would be suboptimal from an after-tax standpoint.'
