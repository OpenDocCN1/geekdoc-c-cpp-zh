    # Solving the Dynamic Programming Models


    Numerical solutions are generated, requiring all state variables to be discretized.
    Per hog direct returns have 6 states in equal increments from -$20 to $40. Taxable
    income ranges from -$60,000 to $60,000 in $15,000, resulting in 9 states. The
    debt/saving balance ranges from -$400,000 to $400,000 in $10,000 increments, resulting
    in 81 states. This yields a total of 4,374 states for the BASIC and AMOR DP models.
    In addition to the above states, the FLEX AMOR and VAR AMOR DP models have 11
    additional states associated with the principal outstanding state variable. These
    states are divided such that each represents a principal payment under the amortization
    plan. The second column of panels A and B respectively show the states for the
    $20,000 and $40,000 loan for the FLEX AMOR DP model. These additional states result
    in a total of 48,114 states for the FLEX AMOR and VAR DEBT DP models.


    All models are recursively solved beginning the final period. Linear interpolation
    of the objective function is used for the taxable income and debt/saving balance
    state variables. This is in order to reduce biases from discrete states and to
    increase the convergence rate. The BASIC DP program is recursively solved for
    five years, at which point the optimal decision rules converge. During the period
    in which the loan existed, the remaining models do not converge because the debt/saving
    balance state transition equation varies over the years of the amortization loans.
    To account for non-convergence, the remaining models are solved for a fifteen
    year period. During the first five years—'
