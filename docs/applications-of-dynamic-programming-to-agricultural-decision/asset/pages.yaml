  md: '# Optimal Farm Program Participation and Base Acreage Adjustment Under Alternative
    Program Provisions


    Patricia A. Duffy


    Participation in the farm program can drastically alter farmers'' income, costs,
    and crop-mix. In deciding whether to participate, producers must consider prevailing
    prices, acreage reduction rates, and limits on plantings of program crops imposed
    by participation. In exchange for direct payments and other program incentives,
    participants are limited to planting only a portion of their eligible "base" acreage
    in each program commodity. Under the 1981 farm bill, a producer''s eligible base
    in a commodity was a simple two-year average of acreage planted and considered
    "planted" is acreage idled because of the provisions of the program for that commodity.
    Under the 1985 farm bill, the base is calculated as a five-year average, with
    the stipulation that the base cannot exceed the two-year average. Under the 1985
    farm bill, therefore, producers would be much more limited in their ability to
    increase their eligible acreage of a profitable program crop.


    The objective of this study is to examine the optimal decision rules for crop
    mix and participation in the farm bill for a representative Alabama cotton and
    soybean farm under alternative base calculation provisions, two-year and five
    averages. The problem is formulated as a multi-stage dynamic programming problem.
    The paper builds upon previous work by Mims et al. by considering the stochastic
    nature of cotton and soybean prices and by extending the five-year planning horizon
    used in the Mims study to twenty years. The twenty-year horizon was chosen because
    it is sufficiently long that further time consideration will not influence the
    current decisions.'
