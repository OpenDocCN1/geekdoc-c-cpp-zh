    # The Flexible Amortization Dynamic Programming (FLEX AMOR DP) Model


    The FLEX AMOR DP model defines the terms of the previously described amortization
    loan. Under the flexible amortization loan terms, principal payments can be paid
    ahead of schedule.


    The specification of the FLEX AMOR DP model requires an additional state variable
    giving the principal outstanding (P$_t$). Also, an decision variable is required.
    This decision variable is the amount of principal paid each year (PP$_t$). The
    recursive equation for this model then becomes:


    ```

