    # Stochastic Environment


    The above mathematical model allows for many stochastic variables. These include
    prices, yields, land values, cash rents and interest rates. This section describes
    the procedures used to define the stochastic environment. The real interest rate
    is assumed to follow a stochastic process that is independent of all other prices.
    That is:


    +   (16) rₜ = rₜ₋₁ + eₜ


    where r is the real interest rate for year t, e is the random component; it is
    assumed to be distributed normally with a zero mean and standard deviation equal
    to .02 based on 1960 through 1985 data.


    Gallagher provides evidence that U.S. corn yields are negatively skewed with an
    upper limit on output and occasional low yields. Based on Gallagher''s work, it
    is assumed that corn yield has a negatively skewed distribution. It is also assumed
    that soybean and wheat yields are negatively skewed. The stochastic nature of
    corn yield is modeled in the following:


    +   (17) Yₜ = Mₜ + bₜₜ - eₜ


    where Yₜ is the corn yield in year t, Mₜ is the maximum potential yield for corn,
    which is assumed to be 20% greater than the maximum detrended yield observed from
    1960 through 1984 in district #4 in Indiana, bₜ is the estimated time trend in
    yield, and eₜ is the detrended deviation from maximum. The yields of soybeans
