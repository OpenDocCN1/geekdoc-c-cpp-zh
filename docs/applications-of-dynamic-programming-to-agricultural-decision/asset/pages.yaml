  md: '# Optimal Stochastic Replacement of Farm Machinery


    # Application


    The above model was applied to a combine replacement decision on a typical cash
    grain farm in western Minnesota. A panel comprised of six machinery dealers and
    three farmers in the vicinity of Ottertail County provided necessary empirical
    data to estimate the replacement model. Medium-sized combines in the area are
    used an average of 300 hours per year for harvesting corn, soybeans and small
    grains. The purchase price of such a combine was $80,000 in the spring of 1989.


    # Operating Costs


    Variable costs of operating a combine include fuel, lubrication, labor, repair,
    and downtime losses that occur when the machine unexpectedly fails. Fuel, lubrication
    and labor costs were calculated by formulas provided in the Agricultural Engineers
    Yearbook. Total costs of repairing a combine consisting of routine repair and
    maintenance costs as well as costs associated with a major breakdown. With the
    exception of costs incurred during the first year of operation, which are presumed
    to be covered by warranty, total costs of repairing the combine in this study
    were based on recent survey data (Hardesty and Carman) and allocated between the
    two categories in the following manner.


    First, service managers at each of the panel dealers in this study were informally
    asked to describe the nature of untimely breakdowns. The average cost of such
    a breakdown was reported to be $7,000. Next, they were asked to subjectively estimate
    the probability that such a breakdown would occur each year of the combine''s
    useful life. These probabilities were estimated to be 5 percent in one year of
    operation and up to 50 percent by year ten. Interestingly, the estimated probabilities
    were not conditional on the timing of previous breakdowns. Service managers noted
    that modern combines consist of numerous independent systems (i.g. engine, hydraulics,
    final drives, thrashing components) and that a failure of one does not influence
    the probability of another system failing. Further, replacement parts are also
    subject to failure.


    Expected costs of a major breakdown were derived based on the above responses.
    These costs were then subtracted from total repair costs to yield routine costs
    of repairing and maintaining the combine. To assure accuracy, the panel of participating
    dealers and farmers were asked to review their responses. Each stated the pattern
    of routine costs appeared reasonable when the value of the farmer''s labor and
    investment in tools and repair facilities were included.'
