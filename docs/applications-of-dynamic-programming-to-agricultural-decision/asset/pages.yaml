    # Conclusions


    This paper is basically a literature review dealing with some selected

    topics in the area of intertemporal decision making. The paper is not an\exhaustive
    review nor is it intended to be. The primary motivation is to

    suggest that applied economists, agricultural economists in particular,

    carefully evaluate the behavioral underpinnings of their prescriptive

    intertemporal models. With regard to the stochastic DP efforts in

    agricultural economics, progress has been made in a wide variety of

    applications. However, the behavioral underpinnings have not changed\appreciably
    since Oscar Burt''s pioneering efforts in the 1960s.


    It would seem as though agricultural economists have been remiss in

    they duty to be aware of theoretical developments in economics. The

    time lag between published theory and agricultural economics\applications is painfully
    slow in some cases. The areas of applied DP

    and applied risk management are in desperate need of the "regenerative

    forces of the parent discipline..." (Harl). Agricultural economists must

    build stronger ties with the general economics province. Accordingly,

    graduate training in agricultural economics must be strengthened.


    Lastly, the conceptual issues discussed in this paper have not been\fully resolved
    in the economics literature. The implications of these

    issues are relevant to literally all areas of agricultural decision-making.

    it is hoped that agricultural economists will find meaningful applications

    for existing theory and that such applications will in turn stimulate

    further theoretical development.


