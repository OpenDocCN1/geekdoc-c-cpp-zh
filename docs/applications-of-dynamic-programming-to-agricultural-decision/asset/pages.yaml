    Kennedy''s extensive literature review indicates that the profession has not adequately
    provided a solution procedure for the inter/intraseasonal allocation problem,
    even under conditions of risk neutrality. Moreover, a preference ordering leading
    to a cardinality index does not appear to be available at present to accommodate
