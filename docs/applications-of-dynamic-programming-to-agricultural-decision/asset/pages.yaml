  md: '# 14 Thomas P. Zacharias


    A very readable and useful discussion of the endogenous taste problem as it relates
    to immediate and long range planning is found on Weizsacker.


    Another possible interpretation between short-run and long-run demand changes
    could be given by the theory of satisficing instead of maximizing behavior. People
    set themselves levels of aspiration then they compare these levels with their
    present situation. If this situation is inferior to the aspired level of satisfaction,
    they find ways to improve their present situation. After for a while they have
    achieved their goal or failed to do. In the latter case, they will tend to lower
    their standards, i.e., the desired level of aspiration, and they will try to again
    attain this lower goal. If they have achieved the goal by themselves, they become
    more ambitious, and they will revise upwards the goal to be achieved. It is not
    difficult to see that this method of satisficing - given the feedback between
    setting and achieving goals - will, in the long run, yield similar results to
    maximization.


