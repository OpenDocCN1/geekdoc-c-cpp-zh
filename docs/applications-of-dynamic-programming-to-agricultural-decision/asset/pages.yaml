    associated with state intervals resulting in bankruptcy. Thus, each state probability
    vector contained 43,561 elements (4 hog return states x 15 stock prices x 6 interest
    rate states x 11 financial holdings states x 11 stock holdings level states +
    1 bankruptcy state). Each element of the state probability vector representing
    a solvent state was referenced as:


    ```

    π(hr,ps,ps, rof,of,s)

    ```


    where hr, ps, rof, of, and s were state interval indices for the hog return, stock
