  md: '# The Conservation Reserve Program


    A producer maximizing expected profits would make the decision to enroll a field
    in the CRP if he expected returns from program participation to exceed net returns
    from farming the field. Since the contract encompasses ten years, the producer
    would compare the discounted expected returns from farming the field during that
    period with the discounted returns he would receive on the contract price. The
    producer would make a decision to enter a field in the CRP when the following
    inequality held:


    ```

    $$\sum_{t=1}^{10} E \left( \frac{1}{1+d} \right) R_t < \sum_{t=1}^{10} E \left(
    \frac{1}{1+d} \right) C$$

    ```


    where

    t = year;

    E = expectations operator;

    d = producer’s rate for discounting;

    R = net returns from farming;

    C = contract rental rate.


    He would not enter his field if the inequality were reversed.

    In the above inequality, the rental rate is a constant amount, while net returns
    to farming are a function of time. This implies that returns to a CRP contract
    are certain, while returns to farming are stochastic because they depend on yield
    and price uncertainties beyond the producer’s control. Yield fluctuates with climate
    and with biological cycles of pests; price fluctuates with market conditions,
    government policies, and macro own factors.


    The inequality just presented is illustrative but oversimplified. A maximizer
    of expected profits will evaluate after-tax rather than before-tax returns, and
    in order to properly evaluate after-tax returns, the producer must look at returns
    for the whole farm. He cannot calculate after-tax returns for a single field because
    taxes are a function of total income. Therefore, he must compare the whole-farm,
    after-tax returns to farming with to CRP participation for all combinations of
    eligible fields to determine the profit-maximizing combination of alternatives.


    # A Farm-Level Model of CRP Entry Decisions


    The stochastic, multi-year nature of the producer’s CRP enrollment decision process
    makes his problem particularly amenable to solution by dynamic programming (DP),
    which describes a problem as a system in terms of stage, state, and decision variables.
    Each stage (or time period)'
