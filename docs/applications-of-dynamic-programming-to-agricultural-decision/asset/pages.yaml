  md: '# Dynamic Programming and the Curses of Dimensionality


    C. Robert Taylor


    Stochastic and dynamic features characterize many optimization problems in agricultural
    decision sciences. Yet, use of numerical techniques appropriate for such problems,
    such as stochastic dynamic programming (DP), are not widespread. A reason often
    cited for the low adoption of this and other numerical techniques for solving
    stochastic dynamic optimization problems is what Richard Bellman, the father of
    dynamic programming, termed the "curse of dimensionality" (Burt). The curse of
    dimensionality refers to the exceedingly large memory and time requirements for
    numerically solving problems.


    The theme of this article is that there is not one, but at least four curses associated
    with stochastic dynamic programming and other stochastic optimization techniques.
    These are: (a) the formulation curse, which refers to conceptualization difficulties
    with stochastic dynamic models of empirical problems; (b) the computational curse
    discussed by Bellman; (c) the curse of a complex decision rule, especially for
    large DP models, which means that the decision rule is difficult to visualize,
    rationalize, and understand; (d) the acceptance curse which applies not only to
    professionals not well trained in DP, but also to potential clients (decision
    makers) that might use the results from such a model.


    The computational curse of dimensionality, was a central problem with DP since
    its development in the 1950s, has faded appreciably in the 1980s with dramatic
    advances in computational power and cost (Taylor). The other curses, particularly
    the decision rule curse, are now central problems in development and implementation
    of applied DP models. The purpose of this article is to discuss these curses and
    to suggest strategies for coping with them. Before discussing these curses, however,
    it may be useful for those who are not intimately familiar with dynamic programming
    to review this method.'
  merge: -1
  pgno: 15
