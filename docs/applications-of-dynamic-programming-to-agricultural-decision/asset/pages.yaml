    # Recursive Equation, Inventory State Variable, and Decision Alternatives


    The inventory model maximizes the present value of hay usage (production, storage,
    feeding, marketing) over the planning horizon. Applying Bellman''s Principle of
    Optimization to the inventory decision process gives


    ```

    Vₜ(I,RC,P) = R + max {πₜ(I,RC,P,D) + β Eₚ EₜRC Vₜ₁(I,RC,P)}

    ```


    where t represents the stage (month), I is the inventory level, RC is the range
    condition, P is the price, R represents returns from required actions, max is
    the maximization operator, D is the decision alternative, πₜ is the immediate
    returns which depend on I, RC, P and D, β is a period discount factor, Eₚ and
    E_RC are conditional expectation operators over the price and range condition
    state variables, Vₜ(I,RC,P) is the expected value from following an optimal policy
    from stage t to the terminal stage. For simplicity, the subscripts associated
    with the state variables I, P, and RC have been suppressed in equation (4). The
    terminal value is the value of the hay at the prevailing stage, that is


    ```

    Vₜ(I,RC,P) = Pₜ * Iₜ

    ```


    Immediate returns, πₜ(I,RC,P,D), includes the cost of purchasing hay and returns
    from selling hay. Also included in πₜ are monthly costs for producing hay. These
    costs are based on Texas Agricultural Extension Service Budgets. For most months
    the costs are zero. For months in which fertilizer is applied or harvest occurs
    the costs are positive. Further, harvesting costs vary by range condition. A yearly
    interest rate of 6% is used in calculating the monthly discount factor, β.


    An unique aspect of the inventory model is the required actions within the recursive
    equation. Two components make up the required actions. The first pertains to the
    requirement of meeting any deficit in forage production if the demand is greater
    than new hay production plus current inventory levels, then hay must be purchased
    to meet the demand. The value of R, in equation (4) represents the cost of purchasing
    this hay. The second'
