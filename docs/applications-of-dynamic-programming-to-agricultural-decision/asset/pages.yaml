  md: '# The Conservation Reserve Program


    Field 11 on the Jackson farm is more likely to be enrolled in the CRP than any
    other field because its soil quality is so poor that it is in compliance with
    conservation standards only when wheat and hay are incorporated into the crop
    rotation. Requiring this rotation drastically lowers mean returns for this field.
    Field 11 enters the CRP in all but the highest returns states. Fields 9 and 10
    are less erosive, so erosion can be controlled to acceptable levels with a corn/soybean
    rotation that employs conservation tillage. Fields 9 and 10 are always farmed
    under these circumstances.


    # Variations of the Baseline Scenario


    Repeating the analysis with discount rates of 2 percent and 10 percent showed
    that the CRP enrollment decision was not highly sensitive to the magnitude of
    the discount rate. With only three eligible fields, changes are harder to identify
    than they would be with a larger number of eligible fields representing a greater
    continuum of productivity and erodibility. However, the analyses did show¹⁵ as
    the discount rate increased, land was more likely to be enrolled when returns
    to farming were low and less likely to be enrolled when they were high.


    Surveys of producers who did not participate in the CRP indicate that many consider
    the rental rates inadequate compensation for withdrawing their fields from production.
    To test the impact of higher rental rates on the enrollment decision, the analysis
    was repeated using the approved rates of $115 and $70 per acre for the Champaign
    and Jackson farms, respectively. Hypothetical bid caps of $125 per acre in Champaign
    and $100 per acre in Jackson were also tested.


    A bid of $115 in Champaign drew Field 5 into the CRP when last year''s returns
    were $127 per acre, and Field 6 when the returns were below $247. At a cap of
    $125, those fields entered at slightly higher levels of returns, and even Field
    4 was drawn at the lowest level. Field 11 on the Jackson farm entered at all levels
    of returns with a bid of $70, and Field 10 entered at the two lowest levels when
    the bid reached $100. Field 9 was never enrolled in the CRP.¹⁶


    Reluctance to enroll Fields 9 and 10 on the Jackson farm can be attributed to
    the fact that those fields represent that''s most productive land. The constraint
    in enrollment decisions for the Champaign and Jackson farms is particularly interesting
    because in terms of productivity and erodibility characteristics, Field 5 parallels
    Field 9, and Field 6 roughly parallels Field 10. This contrasting illustrates
    how the government''s policy of paying different rental rates for land of similar
    quality makes rental rate rather than erodibility the primary factor in the land
    composition of the CRP.'
