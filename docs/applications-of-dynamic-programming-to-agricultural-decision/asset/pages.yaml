    # Results


    Summarizing and presenting the results of large dynamic models represents one
    obstacle to implementing such models as decision aids. This problem is exaggerated
    when dealing with a monthly versus a yearly model. With a monthly model in which
    the immediate returns and transition probabilities vary by month, the optimal
    policy will not converge between stages. The optimal policy may be independent
    if the same months are compared between years. That is, the optimal policy for
    January in year i is compared to January’s policy in year t+1, February’s policy
    in year i is compared to February’s in year t+1, etc. Thus, the optimal policy
    may converge between stages. Even with convergence, presenting the convergent
    policy for a monthly model requires twelve policies to be presented. In contrast,
    a yearly model requires only one convergent policy to be discussed. Development
    of computer decision aids which search the optimal decision table for a set of
    conditions which alleviates the problem in actual use and not in presenting a
    model’s results to an audience. The acceptability of a model is enhanced if results
    can be concisely presented.


    The inventory model developed here is a prime example of the decision rule curse
    (Chapter 1). The model suffers somewhat from the computational cost (Chapter 1).
    First, being a monthly model with 19 inventory states, 10 price states and 5 range
    condition states, the decision rule is difficult to summarize. Both state variable
    and stage effects are evident in the convergent policy. Second, the convergent
    decision rules suffer from counterintuitive decisions. Finally, the hay model
    is modest in size when compared to some DP models, but it still requires approximately
    four hours to solve for 10 years on an IBM with a math chip.


