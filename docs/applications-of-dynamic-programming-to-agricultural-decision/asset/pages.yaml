    # Conclusions


    The first objective of this paper was to address the issue of off-farm investment
    in a dynamic framework, incorporating the effects of farm financial structure
    and market conditions. A second objective was to illustrate some of the important
    issues and techniques which arise when developing and solving stochastic dynamic
    firm decision models.'
