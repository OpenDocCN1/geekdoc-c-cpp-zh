    The formula for calculating the number of possible alternatives, or states, in
    a DP problem is a multiplicative function of the number of possibilities associated
    with stages, state variables, and decisions:


    number of stages × number of states × number of decisions


    For multiple state variables, the number of states is a multiplicative function
    of the number of discrete categories associated with each state variable:


    variable 1 × variable 2 × variable 3 × variable 4 ...

    categories categories


    The producer''s planning horizon comprises 15 stages. There are two state variables,
    net returns to farming and number of years in the CRP. Farm returns are divided
    into 10 discrete categories from low to high. The number of years in the CRP ranges
    from 0 (farming) to 10 (1-10 years of elapsed contract), yielding 11 possible
    alternatives for the land-use status of a field. The decision alternatives are
    two: farm the land, or enroll it in the CRP.


    Given the assumption that the producer will maximize whole-farm, after-tax returns,
    the number of CRP-eligible fields becomes the limiting factor in model formulation
    because of the need to consider all possible combinations of years enrolled for
    all possible eligible fields. The possible number of states associated with the
    years is thus the number of fields. The more restrictive the model, the more one
    can constrain the number of combinations, and the greater the number of eligible
    fields that can be included. However, given the exponential relationship between
    years and fields, the number of eligible fields will necessarily remain fairly
    small.


