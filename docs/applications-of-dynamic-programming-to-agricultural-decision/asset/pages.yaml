  md: 'is characterized by several possible states, which are defined by the values
    of the various state variables that describe the system. A decision is made at
    each stage that optimizes an objective function and controls the state of the
    system during the next stage.


    The model developed here is not intended to be a complex replication of the producer''s
    decision process. Rather, the intent is to create a relatively simple model that
    captures the essential aspects of the process yet is still flexible enough to
    be operational for investigation of different incentives that might be offered
    for enrolling land in the CRP.


    # Underlying Assumptions


    The producer''s objective is to find the combination of farming CRP enrollment
    decisions for his eligible fields that maximizes the present value of expected
    net returns over his entire planning horizon. The 15-year planning horizon for
    this problem reflects the fact that the length of the enrollment period (5 years)
    and the length of the contract (10 years) are fixed by the 1985 Food Security
    Act. Each passing year of the enrollment period effectively shortens the producer''s
    planning horizon for CRP participation.


    The producer is assumed to own a farm composed of a number of different fields,
    some of which are highly erosible and eligible for enrollment in the CRP, and
    some of which do not meet CRP entry requirements and thus will always be farmed.
    For the purposes of this analysis, two representative farms were defined, based
    on the dissimilar soil composition of two Illinois counties. Farm size of 700
    acres remains fixed throughout the planning horizon. Once entered in the CRP,
    a field remains in the duration of the contract.


    The producer maximizes whole-farm, after-tax returns when making his land-use
    decisions. His returns include not only current profits, but discounted present
    value of future returns. His entire income is derived from his farm, either through
    the sale of crops or from rental payments for acreage enrolled in the CRP. In
    this analysis, the producer does not participate in federal commodity programs.
    He does land in compliance with conservation standards established for the State
    of Illinois'' T-by-2000 program, however (Illinois Department of Agriculture 1985a
    and 1985b).


    # Basic Variables


    **Stage Variable.** The stage for this model is defined to be a year, since planting
    decisions must be made annually. The planning horizon thus consists of fifteen
    stages.'
