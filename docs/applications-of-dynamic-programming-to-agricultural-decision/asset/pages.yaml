    The final five years of the time frame—decision rules are generated. This results
    in a converged decision rule similar to that from the BASIC DP model. Then, decision
    rules for the ten year loan repayment period are generated.


    When evaluating the alternative loan repayment plans, state variable distributions
    resulting from following the optimal decision rule are more useful than the decision
    rules. Therefore, optimal decision rules and the state transition equations are
    used to construct future state variable probability distributions following conditional
    probability methods (see Howard for a discussion). By using these methods, discrete
    joint probability density functions of the hog direct returns, taxable income,
    and debt/saving balance can be ex ante forecasted, conditional on initial state
    variable levels and permitting that the optimal decision rules are followed. From
    the joint probability density function, discrete marginal distributions of a single
    state variable can be found. These marginal distributions then can be used to
    calculate expected values (see Schnitsky, or Novak and Schnitsky for a more detailed
    discussion of these methods).


    Yearly conditional probability distributions have been computed using the same
    variable distribution as in the dynamic programming models. Unless noted otherwise,
    all conditional probabilities are calculated using initial states of a $10 per
    hog direct returns, a $0 taxable income, and a $0 debt/saving balance. The alternative
    loan repayment plans are evaluated using the following criteria: (1) the yearly
    expected values of the debt/saving balance, (2) the yearly expected values of
    the debt/saving balance, (3) the probabilities of having additional debt (i.e.,
    having a negative debt/saving balances), and (4) the marginal debt/saving balance
    distributions at the end of the amortization loans (in year 10).


