    # Optimal Culling Decisions Versus Culling When Open


    This section presents optimal converged culling decisions from the previously
    presented SDP model. Optimal culling decisions are only given for the cow states
    of open and no calf at side (state 4) or open and sale calf at side (state 3)
    since all of the other states had essentially a constant decision rule to always
    keep the cow if it had a newborn calf at its side and always keep the cow if it
    was pregnant, providing that the cow wasn''t over 9 years old and replacement
    prices were above $420 per head. This result emphasizes the importance of considering
    the pregnancy state of the cow in conjunction with market price considerations,
    unlike previous studies have done (e.g., Trapp, Inmes and Carnam). Because the
    decision rule was the same for cow states 3 and 4 above, only one decision rule
    is given for the Spring (May) and Fall (November) pregnancy test times in Table
    7.4.


    Optimal culling decisions are given in Table 7.4 for different cow ages (i.e.,
    2, 6, 8.5, and 10 years), and all possible replacement and calf states. Although,
    the probability of being at a very high replacement price and low calf price or
    vice versa, is not very high, Table 7.4 gives all possible price combinations
    to illustrate the importance of price in optimal culling decisions. For both May
    and November, results indicate that one should only replace an open 2 year old
    if calf prices are above $85/c. when bred replacements can be purchased for $420/head
    or if calf prices are above $95/c.wt. However, the decision to replace instead
    of keep an open cow increases rapidly as the cow approaches 8 years in age.


    The decision to replace occurs less frequently for November than May, due to calf
    prices being estimated as seasonally higher for May than November (equation 10).
    That is, cows which test open in November and are kept in the herd, should be
    tested as pregnant in May, calve in six months, and have a sale size calf at their
    side in May when calf prices are most seasonably favorable. Whereas, a replacement
    purchased in November would have a sale size calf at its side the following November
    when calf prices are not seasonably favorable. At an age of 10 years, the decision
    rule is to always replace an open cow, except for November''s highest replacement
    price and lowest calf price combination.'
