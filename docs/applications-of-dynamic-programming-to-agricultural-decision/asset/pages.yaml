    optimal culling compared to culling when open are presented in the fifth section.
    Finally, a section of concluding comments discusses some implications for researchers
    and producers in making optimal culling decisions.


    # Stochastic Dynamic Programming Model


    When specifying any model, an evaluation needs to be made between the trade off
    model complexity and the value of information added to a model that is more complex.
    Considering the stochastic nature of replacement, culling, and calf prices in
    the SDP formulation, cull prices are hypothesized to be adequately captured by
    current replacement and calf prices in the tradeoff between model complexity and
    more precise information. That is, cull prices are hypothesized to be primarily
    driven by a demand to be maintained in the breeding herd (captured by replacement
    price information) or slaughtered for meat (adequately captured by current calf
    prices). The following equation supports this hypothesis²


