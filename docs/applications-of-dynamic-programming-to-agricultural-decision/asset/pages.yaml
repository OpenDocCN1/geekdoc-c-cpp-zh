  md: "# Overview of Dynamic Programming\n\nThe problem of interest is to maximize\
    \ the expected present value (EPV) of returns (or utility) from a T-period (stage)\
    \ decision process,\n\n```\n(1) MAX_X EPV = MAX_X \\sum_{t=1}^{T} \\beta^{-t}\
    \ R(S_t, X_t, e_t)\n```\n\nwhere E() is the expectation operator, R() is the one-period\
    \ return function, e is a vector of time independent random variables, $\beta$\
    \ is the discount factor, X_t is a vector of decision variables at period t, and\
    \ S is a vector of state variables that describe the dynamics of the system. Maximization\
    \ of (1) is subject to a dynamic process which can be described by the set of\
    \ first-order difference (state transition) equations for the state variables,\n\
    \n```\n(2) S_{t+1} = H(S_t, X_t, e_t)\n```\n\nwhere $\\epsilon$ is a vector of\
    \ time independent random variables. Maximization in (1) is also subject to given\
    \ initial conditions, S_1.\n\nAlthough DP is commonly thought of simply as a *technique*\
    \ for solving dynamic optimization problems, it is more appropriate to think of\
    \ it first as an *approach* to solving dynamic optimization problems, as reflected\
    \ by the principle of optimality and the resulting recursive equation, and second\
    \ as a *numerical* solution procedure. Dynamic programming, viewed as either an\
    \ approach or as a numerical solution procedure, is based on the principle of\
    \ optimality, which states:\n\n> An optimal policy has the property that whatever\
    \ the initial state and decisions are, the remaining decisions must constitute\
    \ an optimal policy with regard to the state resulting from the first decision.\n\
    \nThe Southern corollary to this could be stated as:\n\n> If you don't do the\
    \ best you can with what happen to have got, you'll never do the best you might\
    \ have done with what you should have had.\n\nWith an additive return function,\
    \ as in (1), this principle of optimality allows one to decompose a T-period problem\
    \ into T one-period optimization problems, which is reflected in the DP recursive\
    \ equation,"
  merge: -1
