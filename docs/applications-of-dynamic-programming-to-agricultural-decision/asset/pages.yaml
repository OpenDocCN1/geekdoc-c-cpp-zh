  md: '# Modeling Dynamics and Risk Using Discrete Stochastic Programming 159


    assumed to be nonstochastic for this study. Machinery complements chosen and further
    information can be found in Featherstone.


    # Policy Environment


    This section describes the policy environment and the modeling of variables affected
    by government farm programs. This study examines optimal capital structure under
    loan rates and target prices at the 1985-86 level. PC-WHEATSIM and FEEDSIM models
    (Holland and Sharples; Chattin, Hill, and Holland) were used to stochastically
    simulate corn, soybean, and wheat prices under the 1985 programs. These models
    were chosen because they are designed to perform stochastic simulations of alternative
    farm programs.


    To facilitate input into the mathematical programming model, the results from
    PC-WHEATSIM and FEEDSIM were further transformed. For this study, it is assumed
    that the decision maker corn, soybean and wheat prices to follow a stochastic
    process in which the price of corn is a function of the previous years price,
    plus a mean change in price, and a normally distributed zero-mean random error
    term. The data used to calculate the mean change and the random error term were
    generated by FEEDSIM and PCWHEATSIM.


    The price of hogs is assumed to follow a similar stochastic process. Annual hog
    price is affected by the previous year''s hog price, the previous years corn price,
    an expected change in hog price, and a zero mean random error process. More formally,
    hog prices are assumed to have the following stochastic process:


    ```

    (18) P_{Ht}=19.61 + .39 P_{Hb-1} + 4.52 \bar{P}_{Ct-1} + \Delta\bar{P}_{Ht} +
    e_{Ht}\n(1.69) (1.79) (1.24)

    ```


    where \Delta\bar{P}_{Ht} represents the mean change in price in year t, and e_{Ht}
    represents the random shock to hog prices in year t. Equation 18 was estimated
    using Indiana data from 1960 through 1983. The values in parentheses below the
    parameter estimates. The random errors of the corn price, soybean price, the wheat
    price, and the hog price equations are distributed multivariate normal with a
    mean of zero.


    Agricultural policies are assumed to affect cash rent via the effect on crop prices
    and affect land values through cash rent (Featherstone and Baker). Equations for
    cash rent and land values were estimated using historical nominal returns, cash
    rent, and land values in Indiana from 1960 to 1984. Cash rent is a function of
    past cash rent and the residual returns to an acre of corn and soybeans grown
    in rotation. In the'
  merge: -1
