    A general recommendation from these results would be to follow a three-year control
    sequence when Cephalosporium stripe infections are low, but to consider longer
    sequences when infection levels are more severe. These findings are consistent
    with the recommendations of the Montana Small Grain Guide (1985) which suggests
    a minimum of three years without winter wheat when Cephalosporium stripe has been
    observed.


    # Conclusions


    The results of this study indicate that the Cephalosporium stripe problem is not
    trivial in terms of returns to the winter wheat producer. However, the quality
    of the results are data dependent. The most obvious inadequacy in the model is
    the lack of experimental data to statistically estimate the infection relationship.
    Experimentation designed to provide such data would improve the reliability of
    the results.


    The results are also region specific, especially with regard to the method of
    control. The choice of spring crop is separable from the control/no control decision.
    The effect of fallow on crop yields is largely determined by soil composition
    and depth. Two years of fallow may be optimal in some areas. In others, one year
    may not have the impact on yield shown in this study, thus reducing the number
    of fallow decisions.


    The model could be extended to all decisions regarding land use to be made in
    the spring as well as the fall. In a semi-annual model, the'
