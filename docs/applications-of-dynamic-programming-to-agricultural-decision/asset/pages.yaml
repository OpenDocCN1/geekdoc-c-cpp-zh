    # Optimal Decision Rules


    Figures 1 and 2 are graphical representations of the optimal decision rules for
    the cotton farm under the alternative base acreage specifications. In Figure 8.1,
    program and nonprogram cotton acreage for the five-year base are presented for
    five possible bases, 0, 25%, 50%, 75%, and 100%. In Figure 2, acreages for the
    same set of possible bases are presented for the two-year base calculation. For
    the five-year base, there are many possible routes by which the farm could arrive
    at any base. Ccursion inquiry, however, revealed little or no effect on the optimal
    decision rule. Hence, the optimal decision rules are presented only for the case
    of identical history (i.e, all previous years have planting patterns equal to
    current base).


    For the 0 beginning base situation, the primary difference between the two-and
    five-year base calculation is the level of lagged soybean price required before
    all acreage is switched from nonprogram cotton to soybeans at low cotton prices.
    For the five-year base, soybeans are planted on all of the acreage when their
    price is greater or equal to $7.67 and cotton price is $0.45. At higher cotton
    prices, the entire acreage is planted regardless of price. For the twoyear base,
    acreage is switched to soybeans only when the lagged soybean price rises to $8.33
    and the lagged cotton price falls to $0.45. Because current nonprogram plantings
    in a given year are worth more in a future under the two-year rather than the
    five-year base, it is not surprising that it takes higher soybean prices to induce
    the producer not to plant cotton.


    With a 25% base and five-year calculation, 100% nonprogram cotton is always chosen
    when the lagged cotton price is greater or equal to $0.55. At lower prices, acreage
    will be split between program cotton and soybeans, depending on the price of soybeans.
    With a two-year base calculation, the pattern is identical, but in every case
    it takes a higher soybean price to induce out of nonprogram cotton.'
