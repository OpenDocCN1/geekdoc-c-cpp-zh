  md: '# Preferences in Dynamic Optimization Models


    Strotz''s work seemingly lay dormant until the late 1960s when at that time a
    series of "planning" papers began to appear in the Review of Economic Studies.
    These studies along with Strotz''s 1955 paper represent the core of the planning
    literature and for the most part address the fundamental sources of inconsistency
    in dynamic choice problems.


    Pollak''s 1968 paper entitled "Consistent Planning" was perhaps the initial follow-up
    to Strotz. In this paper, Pollak introduced the terminology naive versus sophisticated
    planning. Naive planning is simply a series of mycop single period optimizations
    when viewed as post sense at all. Sophisticated planning, on the other hand, essentially
    refers to a standard dynamic programming (DP) solution where the decision-maker
    allocates a given amount of stock at each stage toward his/her consumption choices
    to maximize a series of instantaneous utility functions. The sophisticated optimization
    is typically solved beginning with the last consumption period. Consumption in
    the final period is dependent upon the remaining stock with the constraint ultimately
    absorbed into the utility function.


    In his discussion of naive and sophisticated optimization, Pollak used both a
    discrete and continuous time framework to reveal a flaw in Strotz''s original
    argument as well as point out an important source of intertemporal inconsistency
    associated with the optimization. For lack of a better term, Pollak focused on
    the "interval" problem. These are: (1) how is optimal consumption organized within
    a subinterval and (2) how is the initial stock allocated among the subintervals?
    According to Pollak, Strotz''s results implied that as subintervals converge,
    the conditions which determine the allocation of the stock across subintervals
    become irrelevant while Pollak provided a counter-example to Strotz revealing
    that as subintervals converge, the more pressing problem as subintervals converge.
    Pollak did not, however, provide a general solution to the continuous decision
    sophisticated optimum tastes.


    Another source of inconsistency is changing tastes. Changes in tastes may be endogenous
    or exogenous. Endogenous taste changes may be due to habit formation or choice
    of a particular consumption stream where exogenous taste changes may be due to
    advertising or the relationship between generations.


    According to Hammond, the endogenous taste literature has focused on two basic
    questions. First, can valid judgments be made if choices are derived from endogenous
    tastes? Second, does a long-run utility function exist which corresponds to long-run
    equilibrium choices? Hammond chooses not to address these questions, instead,
