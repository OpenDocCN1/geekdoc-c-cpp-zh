  md: '# # Preface and

    Acknowledgments


    Perceptions about the computational "curse of dimensionality" along with a shortage
    of classroom treatment of applied dynamic programming have limited the application
    of this and other techniques for solving stochastic, multi-period optimization
    problems. The dimensionality curse has faded appreciably, however, in large part
    to dramatic advances in computational power and in small part to refinement of
    the "art" of dynamic programming.


    The primary purpose of this book is to demonstrate the application of stochastic
    dynamic programming to a wide variety of decision problems in agriculture. Articles
    published in this book were presented at a conference held at Auburn University
    on May 9-10, 1989.


    The authors and editor wish to express their appreciation to Beth Rush for the
    outstanding desktop publishing job she did in converting all text and charts to
    camera-ready form. Gratitude is also expressed to Professor Earl Swanson for his
    additional editorial comments.


    C. Robert Taylor'
