    # Concluding Remarks


    Dynamic programming remains the most promising approach and numerical solution
    technique for many stochastic dynamic optimization problems. The decision rule
    from such a model is of value to researchers and decision makers alike, but post-DP
    computation of probabilities of various states can be of great value for normative
    policy analysis. To fully exploit the potential of DP and post-DP Markovian analysis,
    we must provide more in-depth training of graduate students as well as retooling
    of current faculty. In addition, to overcome the acceptance of results by potential
    clients, we must develop Extension programs that complement research efforts.'
