    # (6) PROB = m


    In a sense, the firm''s decision to involuntarily replace a machine is conditional
    on similar factors influencing planned investment, including relative future operating
    costs, remaining values, capital costs, and cash availability. Repair and retention
    of the existing asset implies the existing machine with its pattern of repairs
    will be used in following periods. However, unique factors affect involuntary
    replacement as well. If the failed machine is repaired, downtime costs are incurred
    in addition to costs of fixing the machine. If the failed machine is traded unrepaired,
    it is assumed the new machine is available immediately and downtime costs are
    negated. Hence, the decision to involuntarily replace is contingent upon total
    costs of fixing, level of downtime incurred, and value received for the failed
    machine.


    # Solution Procedure


    The procedure for solving the replacement problem begins with specification of
    boundary conditions for the last period. Boundary conditions for this problem
    are determined by replacing $S_{j,k+1}$ in the right hand side of equation (1)
    with the remaining value of the asset realized at the end of the planning horizon,
    $R_j$, if the asset is in working condition and $T_j$ if the asset failed.


    Working backward stage by stage from the end of the horizon, the remainder of
    the problem is recursively solved according to the algorithm of dynamic programming
    and principle of optimality. At each stage, expected present costs of keeping
    the existing machine and buying a replacement are calculated for every possible
    state of the system. An important part of the decision involves future benefits
    of the present decision, $S_{j,k}$ (the minimum cost of providing machine services
    from $k$ to the horizon). However, the optimal decision is derived by working
    backward, the value of $S_{j,k}$ is already known. Given this information and
    expected costs of the current period, the firm can choose the minimum cost of
    either keeping or replacing the current machine and assign the respective value
    to $S_{j,k}$ since the principle of optimality ensures that no nonoptimal continuation
    from year $k+1$ to $N$ need be considered (Dreyfus and Law). The decision for
    remaining stages is independent of historical replacement policies; it depends
    solely on current and future information. Eventually the firm arrives at $S_{j,1}$.
    The resulting sequence minimizes the expected present cost of machine services
    until the horizon.'
