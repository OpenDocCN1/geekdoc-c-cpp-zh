  md: '# Optimal Farm Program Participation


    # Methods


    The representative farm developed for this study is a cotton and soybean farm
    in Northwest Alabama. The farm is similar in many respects to one of the farms
    developed by Mims et al. but has been simplified for the dynamic programming formulation.
    Per acre yields and costs were developed using records from the Alabama Farm Analysis
    Association and budgets from the Alabama Cooperative Extension Service. Cotton
    yields were assumed to be 726 lb/acre, while soybean yields were assumed to be
    28 bu/acre. Variable costs are $263.50 per acre for cotton, $82.35 for soybeans,
    and $5.00 for any land idle due to farm program participation. Nonland fixed costs
    are $59.67/acre.


    The target price for cotton is fixed at $0.70 for every year of the planning horizon.
    This target price is lower than the 1990 target price of $729 to reflect further
    declines in future years. Unlike the Mims study in which price variability was
    not considered, market prices are treated as stochastic variables that follow
    a first order Markov process. In any year of the planning horizon, lagged market
    prices for soybeans and cotton are known but this year''s prices are not known
    at planting time. Conditional probabilities of receiving a particular market price
    in the current year were thus developed from a set of econometric estimates linked
    to current prices. In any given year, the expected (mean) prices will be:


    +   - E(PCT) = 0.96*PC$_{t-1}$^{81588}


    +   - E(PSB) = 2.00*PS$_{t-1}$^{66706}


    where PC is market price of cotton, PS is the market price of soybeans, E is the
    expectation operator, t is a time subscript, and EXP is the natural exponent function.
    The two prices are assumed to have a bivariate normal distribution with a standard
    deviations of 0.17869 for cotton and 0.1512 for soybeans and a correlation coefficient
    of 0.35044. From this information, the joint probability of receiving particular
    ranges of prices can be calculated using double numerical integration.


    In any given year, the producer must decide whether or not to participate in the
    farm program and how to allocate acreage between cotton and soybeans. If the producer
    decides to participate in the farm program, the one-period profit will be:


    ```

    Π = (MAX(TP,PC)*YC-VCC)*APGC - SA*CSA

    ```


    ```

    + (PSB,*YS-VCS)*AS - FC

    ```'
