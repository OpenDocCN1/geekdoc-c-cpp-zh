    \ The third period's decisions are chosen given the current random variables,\
    \ past decisions, and the distributions of random variables in the future. Finally,\
    \ the random variables in the fourth period are realized, and all ending equity\
    \ is calculated. Both revenues and profits are functions of the choice variables,\
    \ $X_t^i$. Thus, the tree describes a probability distribution for profits. Standard\
    \ objective functions for modeling decision making under uncertainty may be used\
    \ to value the payoffs.\n\nAt any stage, the distributions of future events are\
    \ conditional on the realizations of the random variables up to that point. Thus,\
    \ even if the realized prices $R_t^i$ and $R_t^j$ are the same, differences in\
    \ the conditional distributions of future random variables may cause the decisions\
    \ $(X_t^i, X_t^j)$ to differ. Statistical dependencies such as autocorrelation\
    \ in the marginal distribution of the random variables would result in these conditional\
    \ distributions being different. However, if the past and future variables are\
    \ stochastically independent, then the conditional distributions are the same\
    \ across all states in a given stage.\n\nIt is straightforward, in the DSP framework,\
    \ to include constraints on the choice variables. Total debt might be limited\
    \ to a fixed quantity, S. The choice of $X_t^i$ would then be subject to the constraint\
    \ $X_t^i + X_t^j \\leq S$. The constraints may also include coefficients involving\
    \ the random variables. For instance, the amount of capital available for purchases\
    \ might be limited to $C_1$ in the first period, $C_2$ in the second period, and\
    \ so on. Thus, the capital constraint for the choice of $X_t^i$ would be $\bar{R}_t^i\
    \ X_t^i + \bar{R}_t^j X_t^j \\leq C_3$.\n\nSince there are decision variables\
    \ in every state in every stage, the number of optimal values which must be computed\
    \ rises rapidly as In, if the number of states at each stage is $s$ and the number\
    \ of stages is $k$, then the corresponding schematic $s^k$ decision nodes. If\
    \ the number of decision variables in each stage/stage combination is $n$ and\
    \ the number of constraints on those is $m$, then the problem will contain on\
    \ the order of $ns^k$ variables and $ms^k$ constraints. Both of these grow very\
    \ rapidly as the number of states, $k$ and the number of states, $s$, increase.\
    \ This rapid rate of problem growth has dubbed the curse of dimensionality.\n\n\
    The ability to incorporate dynamics, random events, and constraints that differ\
    \ across states makes the DSP framework ideal for use in modeling liquidity risk\
    \ for a farm firm. The decision variables for a DSP model focused on farm planning\
