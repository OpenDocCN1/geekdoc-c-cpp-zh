    Second, given similar $\lambda$ values, each of the remaining models'' decision
    rules are the same as the BASIC DP models'' decision rules after the ten amortization
    loans have expired.


    Converged optimal decision rules from the BASIC DP models can be described based
    on the debt/saving balance that is maintained. These balances vary depending on
    the level of $\lambda$. For $\lambda = 1$, withdrawals occur whenever positive
    debt/saving balances exist. These withdrawals equal the amount of the positive
    debt/saving balances. For $\lambda = .33$, withdrawals occur such that a $30,000
    saving balance is built and maintained. Any funds which would result in debt/saving
    balances above $350,000 are withdrawn. For $\lambda = 0$, a positive debt/saving
    balance of $350,000 is built. Once debt/saving balances reach this level, withdrawals
    occur.


    Expected withdrawals and debt/saving balances respectively are shown in panels
    A and B of Figure 11.1 for the alternative $\lambda$ values. (All figures have
    been placed at the end of the chapter.) In early years, withdrawals are higher
    for higher $\lambda$ values. This occurs because smaller savings balances are
    built to counter adverse outcomes. In later years, however, expected withdrawals
    are higher for lower $\lambda$ values have built saving balances that generate
    5 percent returns. This produces greater taxable income, allowing larger withdrawals.


    Note that consumption withdrawals trend downward from year 2 onward for $\lambda
    = .33$ and from year 5 onward for others. This occurs because an increasing probability
    is in the debt region of the debt/saving balance. Transition matrices resulting
    from the BASIC DP model are not ergodic (see Howard for a discussion). A trapping
    state exists at approximately a $350,000 debt/saving balance. At this debt level,
    interest costs exceed taxable income for any combination of per hog returns. Thus,
    more debt is continually accumulated. This trapping state is equivalent to bankruptcy.
    This explains the downward trends in withdrawals (panel A of Figure 11.1) and
    debt/saving balance (panel B) for the two models. The rate at which withdrawals
    and debt levels decline on the initial debt level. This is illustrated in Figure
    11.2 which shows expected withdrawals and debt/saving levels for $\lambda = .33$
    and beginning/saving balances of $0 and $40,000.


    The BASIC DP model with $\lambda = 0$ has two trapping states: one at the $350,000
    debt/saving balance (i.e., bankruptcy) and the other at a $350,000 debt/saving
    balance. Once a $350,000 debt/saving balance has been reached, no probability
    exists of falling into debt. Thus, the firm never goes bankrupt. For beginning
    state intervals of a $10 per hog direct return, a $0 taxable income, and a $0
    debt/saving balance, the convergent probability of bankruptcy equals approximately
    3 percent.


