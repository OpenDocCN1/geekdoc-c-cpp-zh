  md: '# Internal Credit Rationing


    A credit constraint, imposed either internally or externally, increases the present
    cost of an optimal policy ceteris paribus because the optimal timing of replacement
    is delayed. Under external rationing, the firm is unable to replace a machine
    when it desires because of insufficient availability. Of particular interest in
    study are the rewards and management responses that accrue from internal rationing.


    Rationing may allow the firm to take advantage of unforeseen investment opportunities.
    The surface of Figure 4.2 illustrates the necessary reduction in price that would
    be required before various degrees of constraint are self-imposed. The graph shows
    rather large degrees of constraint have only a minor impact on the value of an
    optimal policy. This occurs because costs of suboptimal trading are slight over
    a broad range of initial values.


    As a result, small price discounts induce large changes in replacement patterns.
    In this analysis, a firm would be willing to forego normal replacement 33 percent
    of the time if it could realize a 2 percent discount on the purchase price of
    a new combine.


    capital rationing can also reduce the costs and need for external financing. Rather
    than invest in an optimal manner and incur financing charges, a firm may delay
    replacement until sufficient internal funding is available—at the expense of suboptimal
    replacement. However, as in the previous example, the firm can tolerate considerable
    delays in replacement before debt financing becomes effective because costs of
    suboptimal trading are minimal (Figure 4.3).


    # Conclusions


    This study develops a combine replacement strategy for a western Minnesota cash
    grain farm. The decision is based on a function of observed and unobserved state
    variables and the solution to a stochastic dynamic programming model which formalizes
    the tradeoffs between cost minimization, maintenance of cash balances and limitation
    of unanticipated downtime. Conditions under which both planned and involuntary
    replacement occur are described. The rewards and management responses that accrue
    from internal capital rationing are also discussed.


    Results of this study have important implications for aggregate investment behavior
    studies which base replacement on a proportional decay of a continuous capital
    stock. This fairly smooth representation is'
