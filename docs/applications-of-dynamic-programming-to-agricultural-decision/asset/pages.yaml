    The transition matrix was constructed using the optimal stock investment decision
    rule. This matrix was a square matrix of dimension 43,561. The 43,561st row represented
    bankruptcy. The remaining rows of the transition matrix were decomposed as follows:


    [HR] ⊗ [PSR] ⊗ [OFS_{hr,ps,rod}]


    where [HR] was the hog returns state transition matrix, [PSR] was the stock price-interest
    rate state transition matrix, and [OFS_{hr,ps,rod}] were matrices giving other
