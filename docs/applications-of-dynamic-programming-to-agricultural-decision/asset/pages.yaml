  md: 'In the optimal policy, most of the winter wheat decisions occur at the two
    lowest infection levels when the years of control are one, two, or three, unless
    the winter wheat price is in the upper range. Thus, many of the fallow decisions
    where the given winter wheat price is low to medium, are probably the first of
    a three-year control sequence (for example, F-B-F). This sequence allows both
    a barley and a wheat crop to be planted on fallow. Once the barley price becomes
    high enough, a different type of control sequence (such as B-B-F) may be optimal
    for a given winter wheat price.


    Not all of the fallow decisions in these tables should be interpreted as the beginning
    of a longer sequence of control. Fallow associated with the two lowest infection
    levels is most likely indicative of the end of a control sequence. In the optimal
    policy, all of the barley decisions at the lowest past infection level are eventually
    replaced by fallow decisions, as the winter wheat price rises. Some of the barley
    decisions in the 5 to 10 percent past infection level range also change to fallow
    under these circumstances. The relatively high winter wheat price, together with
    the low past infection level, prompts a change in order to exploit the increase
    in yield associated with a fallow-wheat rather than barley-wheat sequence.


    The importance of previous land use is shown in Table 5.9. There are more winter
    wheat decisions, things equal, when the previous land use is fallow. If the previous
    land use is barley and there is a high probability of winter wheat in the next
    period, the current decision is fallow.


    It should be noted that row 1 of Table 5.9, fallow is not one of the decision
    alternatives. However, assuming the returns (further increases) to a second year
    of fallow are in fact marginal, the decisions should not be biased.


