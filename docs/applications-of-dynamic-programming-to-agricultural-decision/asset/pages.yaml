  md: '# Conclusions


    CRP enrollment decisions made in a stochastic, dynamic framework differ from those
    which prevail in a static problem with certain returns. When returns are stochastic,
    they are likely to change over time—low returns tend to rise in the future, and
    high returns tend to fall. When farming and CRP alternatives are considered over
    a multiyear horizon, these probable trends in net returns affect the attractiveness
    of the CRP relative to the static problem. When current returns are low, a producer
    viewing the decision myopically is more likely to enroll fields than a producer
    viewing the problem over a longer horizon. Similarly, when returns are high, the
    producer with the static viewpoint is less likely to enroll.


    The probability transition matrices calculated for each of the representative
    farms constitute another advantage of using stochastic, dynamic model, and represent
    a potential contribution to policy making. In the last section of this paper,
    the unconditional probabilities were used to calculate the maximum expected cost
    of using the before-tax model to make CRP enrollment decisions. Transition probabilities
    can also be used to calculate the probability of any particular field entering
    the CRP, given any particular starting level of net returns to farming.


    Using a whole-farm model as a basis for decision making is probably not necessary
    in this application. A field-specific model would permit more variability in prices,
    yields, and costs, and the majority of decisions resulting from such a model should
    be optimal before and after taxes. If the federal government extends the Conservation
    Reserve Program in the 1990 Farm Bill beyond the currently legislated limits,
    this could be a fruitful avenue for future research.


