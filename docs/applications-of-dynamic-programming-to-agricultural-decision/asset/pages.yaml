  md: '# 9

    Stochastic Dynamic Programming

    Models: An Application to

    Agricultural Investment


    Frank S. Novak and Gary D. Schnitkey


    The nature of farm firms has special implications for the choice of risk management
    strategies. Most farms are small and have a nonincorporate ownership structure
    which prevents spreading of risks among many individuals. Benefits derived from
    specialization in production and resource limitations restrict opportunities for
    enterprise diversification. This has spurred an interest in finding alternative
    methods of reducing the variability of cash flows and introducing greater diversity
    into the asset and liability structure of farm firms (Young and Barry). One method
    which has received limited attention in financial assets. By allocating resources
    outside of the farm, cash flows may be stabilized by the inherent losses in productive
    efficiency which often accompany diversification into other agricultural enterprises.
    Young and Barry approached the problem of handling financial assets as part of
    a long term portfolio. Their results suggest that investment in financial assets
    may stabilize long term cash flows.


    To date, few years have explicitly considered the stochastic, dynamic nature of
    investment returns in models of firm growth and investment (Schnitkey and Taylor;
    Larson, Staub and Burt). Theoretical studies (Robison and Barry; Robison and Brake)
    have outlined the limitations of conventional portfolio theory as a farm planning
    and decision making tool. Since conventional portfolio analysis is static, it
    does not result in an operational investment strategy and ignores some key determinants
    of financial performance. Portfolio models fail to incorporate the implications
    of asset indivisibility, the liquidity characteristics of assets, tax impacts,
    and the costs of altering investment portfolios. Farm managers are concerned with
    the distinction between'
