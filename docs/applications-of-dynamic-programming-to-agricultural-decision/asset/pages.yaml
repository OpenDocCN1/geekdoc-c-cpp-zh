  md: '# An Application to Agricultural Investment


    # Calculation of Conditional Probabilities


    Discrete conditional probability methods were used to determine ex ante distributional
    forecasts of financial holdings and stock holdings. The general approach for calculating
    conditional probabilities requires constructing an N dimensional state probability
    vector denoted as $\Pi_t$, where N is the number of state intervals and t equals
    the number of the stage. The i''th element of them $\pi_{(x,i)}$ gives the probability
    of being in the i''th state at time t. To satisfy the basic properties of probabilities,
    each element must be between zero and one and the sum of all elements must equal
    one. The state probability vector for the initial state $\Pi_0$ contains one element
    that is one while the rest are zero, indicating that the beginning state is known
    with certainty.


    The movements of the system between points in time are given by an N by transition
    matrix (P). The rows of P correspond to states at the current point in time while
    the columns correspond to states at the next point in time. The elements of the
    i''th row give the probability of moving from state i to any of N possible states
    at the end of the period.


    Multiplication of the initial state probability vector by the transition matrix
    yields the state probability vector for the next time period:


    ```

    $\Pi_L = \Pi_{L-1}P$

    ```


    The i''th element of the $\Pi_L$ vector gives the probability of being in state
    i in one period conditional on the probabilities in the $\Pi_O$ vector. In general,
    the transition during time period L is given by:


    ```

    $\Pi_L = \Pi_{L-1}P$

    = \Pi_{L-2}P^2$

    = \Pi_0P^L$

    ```


    where $\Pi L$ indicates that the P matrix is postmultiplied L times. The vector
    gives the probabilities of being in each of the states at time L. These probabilities
    represent an ex ante forecast given the initial state.


    The investment model''s state probability vector contains five dimensions represented
    as:


    $\pi(hr, ps, rof, of, s)$


    where hr, ps, rof, of, and s are state interval indices for hog returns, stock
    price, interest rate, financial holdings and stock holdings respectively.'
