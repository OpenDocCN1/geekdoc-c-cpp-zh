    # Dynamic Programming


    Dynamic programming is a mathematical optimization technique for solving multistage
    decision problems (Bellman, 1957). In the dynamic programming formulation, decisions
    under one period will affect future returns. The whole time over which decisions
    are made is called the planning horizon. Each interval in the planning horizon
    is referred to as a stage, and in every stage, the system can be represented by
    a group of state variables. The planning horizon for the cotton farm problem is
    twenty years with each year representing a stage. State variables are the lagged
    cotton and soybean prices and the five year planting history that determine the
    base acreage. Thus, there are seven state variables in the problem.


    The objective function for the problem can be expressed as:


    +   (6) Maximize [Σ_t=¹ E(Π_t(PC_t,PS_t,Base_t,U_t))]'
