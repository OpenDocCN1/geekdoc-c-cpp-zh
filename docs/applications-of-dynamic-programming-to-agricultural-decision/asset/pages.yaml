    of $20,000. Additional debt of $14,000 is needed for the variable amortization
    loan.


    Higher debt levels under the amortization loan are primarily due to a higher probability
    of having additional debt, as shown in Figure 11.5. The yearly probabilities in
    Figure 11.5 give the probabilities of having negative debt/saving balances. Negative
    debt/saving balances result from cash shortfalls. The terms of variable amortization
    loan allow for more of the cash shortfalls to be covered by the amortization loan,
    thus the lower probabilities.


    While the variable amortization loan results in lower probability of having debt
    in years 1 through 9, it does not result in lower probabilities in year 10, the
    final year of the amortization loan. This is illustrated in Table 11.2 which contains
    two panels giving results for the $20,000 amortization loan and the $40,000 amortization
    loan. For each loan size and the three loan repayment plans, the expected ending
    debt/saving balance, future value of withdrawals, and expected debt/saving balance
    plus withdrawals is given. Expected future value of withdrawals is the withdrawals
    from years 1 through 10 compounded to year 10. The expected debt/saving plus balances
    can be used to evaluate the profitability of the loan repayment plans to the borrower.
    In addition,'
