  md: '# An Application to Agricultural Investment


    Methods were presented for estimating probabilities for interrelated stochastic
    state variables and reducing model dimensions. Conditional probability methods
    which enhance the information available from stochastic dynamic programming models
    were discussed and illustrated.


    The dynamic programming model of a hog finishing operation identified the effects
    of interest rate levels, stock prices and financial structure on optimal stock
    purchases. Higher interest rates were shown to dampen stock purchases over all
    ranges of financial holdings and stock prices. The absolute levels for buy/sell
    breakpoints were dependent upon financial holdings and stock prices. The model
    also identified the effects of different hog return levels on investment decisions.
    Greater profits in hog production implied greater stock purchases for given levels
    of interest rates or financial holdings.


    Conditional probability methods were used to project future financial structure
    and investment holdings for different states. A correlation between stock holdings
    and financial holdings was identified and illustrated. Greater stock holdings
    implied the use of larger amounts of short term debt. Initial financial holdings
    were shown to affect the probability of bankruptcy and expected terminal wealth
    but had little influence on the distributions of financial and stock holdings.


    It is worth noting that static investment models would only provide information
    on the mix of investments given some static objective function. The dynamic investment
    model provides an operational investment strategy as well as providing ex ante
    forecasts of future financial structure and investment mix when the optimal decision
    rule is followed. The extra information obtained from the dynamic model should
    be of interest to decision makers.


    # Notes


    +   1. Quarterly and annual models were investigated for all three stochastic
    state variables but no Markovian structure could be identified.


    +   2. The model was also solved using a finer grid with 6 hog return states and
    11 interest rate states for a total of 127,776 states. The results were essentially
    the same as for this smaller version.'
