  md: '# The Conservation Reserve Program 81


    State Variables. Each field of highly erodible land is characterized by two state
    variables, stochastic and the other deterministic. The deterministic state variable
    indicates the number of years that a field has in the CRP. Values of this variable
    range from 0 to 10, where 0 denotes farming and 1-10 encompass the possible contract
    years. A deterministic state transition equation describes the movement between
    states from one to the next.


    The stochastic state variable indicates the net returns to farming a field over
    ten possible states. Returns must be treated as stochastic because the requirements
    for certainty equivalence are not met in this problem. The state transition information
    for the stochastic returns variable is provided by a farm-specific probability
    transition matrix rather than by a deterministic transition equation. Since there
    are ten possible states, the 10x10 matrix for each farm consists of 100 probabilities,
    each indicating the probability of making a transition between a returns state
    at time t and a returns state at time t+1.


    Decision Variables. For each highly erodible land, the producer must make a decision
    to farm or enroll it in the CRP. There must be a decision variable associated
    with each field. The decision fields are interdependent, however, because the
    producer''s final set of land-use decisions is based on whole-farm, after-tax
    returns rather than before-tax returns that can be calculated for individual fields.


    Once the decisions have been made, each field''s land status becomes the starting
    point for next year''s land use decisions. When a field is enrolled in the CRP,
    the land-use decision is determined for ten years. After the contract expires,
    the field is farmed once again. Through this annual decision process, the state
    of the entire system is revealed by the values of the state variables in any stage.
    It is not necessary to know decisions from previous stages because those decisions
    are captured by the values of the state variables in the current stage. Attribute
    of the decision process satisfies the Markovian requirement of dynamic programming
    (Kennedy 1981).


