    # Formulation Curse


    The slowness with which DP has been adopted in the decision sciences has surprised
    some of the early practitioners of the technique. Burt stated that in the 1960s
    he thought DP would be routinely used by now as linear programming, which is obviously
    not the case. He attributes the slowness with which DP has been adopted to conceptualization
    difficulties; that is, understanding how to formulate an empirical situation with
    many candidate state and decision variables as a computationally manageable DP
    model. Also, most economic applications of DP are sufficiently unique as to prevent
    the use of canned DP solution algorithms. This has been a barrier, especially
    for analysts trained in mathematical programming.


    As noted Dreyfus and Law in the preface to their text and by Burt, overcoming
    the formulation curse requires a considerable amount of active participation by
    the student in formulating and solving applied problems. The implication of this
    for graduate training is obvious; we must offer courses on DP and other stochastic
    dynamics to overcome this curse. The cursory treatment given to DP in many operations
    research or quantitative methods courses is inadequate. For most students, a thorough
    understanding of DP is developed only by extensive practice formulating and numerically
    solving practical problems. It is'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Dynamic Programming and the Curses of Dimensionality


    encouraging a few universities have recently instituted such training, often as
    a seminar series.


    Motivation of students to make the large time investment required to fully understand
    and appreciate DP is certainly not helped by the textbook references to the curse
    of dimensionality associated with DP (but not mentioned for alternative techniques),
    and by the fact that the strengths of DP are subtle, while weakness are obvious
    compared to techniques (e.g., programming approximations) commonly taught in graduate
    courses. One subtle strength arises when the certainty equivalence requirements
    are not satisfied, which means that the solution to a deterministic formulation
    of a stochastic problem is not exact. a second subtle strength arises because
    the solution to the DP model gives the complete decision rule, while many approximations,
    such as multiperiod programming models give the solution only for few initial
    conditions. Thus, implementing the programming formulation requires repeated solution
    of the model, while the DP model must be solved only once.


    # Curse of Dimensionality


    Once the formulation curse is overcome, the computational curse may become a problem.
    The traditional term, "curse of dimensionality" was coined by Bellman to refer
    to the computational time and storage requirements necessary to numerically solve
    dynamic programming models with several state variables. Textbook treatments of
    DP as well as Bellman’s books emphasize this curse so strongly that they appear
    to inappropriately drive away many practitioners. While the computational curse
    clearly restricted solution of large DP models in the 1950s, dramatic advances
    in computational speed, storage, and cost have made this curse fade rapidly in
    the 1970s and 1980s.


    Although the label is usually associated only with DP, it must be recognized that
    the curse applies to non-DP techniques (Bert) such as use of Pontryagin’s maximum
    principle to deterministic problems or application of Ito’s stochastic control
    to stochastic problems. A curse exists with a control theory approach because
    it is necessary to analytically or numerically solve a set (one equation for each
    state variable) of simultaneous, often nonlinear, differential or difference equations.
    In the stochastic case, the set of differential equations to be simultaneously
    solved are stochastic, which makes the curse much more severe. In fact, Ito’s
    stochastic control does not appear at all useful in obtaining a numerical solution
    (Whittle), although it may be more useful than DP for characterizing a solution.'
