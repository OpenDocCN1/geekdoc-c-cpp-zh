    The results presented so far were derived with the condition that the decision
    maker would consider a maximum of six years of control. To compare the effect
    of maximum years of control on monetary returns in a given situation, additional
    results were obtained when the maximum years of control were reduced to one, two,
    three, and four years, respectively. Each of the different control specifications
    yields a set of net values for each state at each stage of the 25-year planning
    horizon. Given a vector of the state variables, the discounted expected returns
    associated with each of the specified values for maximum years of control can
    be compared. The results are an indicator of the economic value of considering
    the specified values for maximum years of control.


    The significance of the difference in monetary returns due to the length of the
    years of control maximums are more meaningful when presented on an annual basis
    rather than a discounted net value for the planning horizon. Therefore, the net
    present values were amortized to derive the comparable annual return figures,
    given a vector of state variable values under a 25-year planning horizon, is presented
    in Table 5.10.


    Looking down each of the columns of Table 5.10, the cost of limiting the number
    of years between winter wheat crops to one, two or three throughout the planning
    horizon is clearly illustrated. For example, if the Cephalosporium stripe infection
    level in the last winter wheat crop was in the zero to five percent interval (column
    one), the amortized returns for a maximum one, two-, and three-year control sequence
    are $28.47, $40.17, and $42.30 per acre, respectively.


    Looking at the same column but comparing the amortized returns to maximum three,
    four, and six years of control shows gains associated with allowing six-year control
    sequences. The gains are small when past infection levels are in the lower range,
