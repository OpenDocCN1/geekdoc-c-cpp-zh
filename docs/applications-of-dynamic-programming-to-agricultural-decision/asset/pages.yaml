    # Expected Immediate Returns


    The expected immediate returns are defined in general as expected total revenue
    minus variable cost on a per-acre basis. Variable costs of crop production and
    fallow for a representative Judith Basin dryland grain farm were obtained from
    Montana State University Cooperative Extension Service costs and returns publications.
    Since prices and infection levels are statistically independent, their expectations
    can be calculated and used to derive the expected gross revenue.


    A conditional expectation of product price is used in determining the expected
    immediate returns because there is approximately one year lag between the decision
    point (winter wheat seeding time) and the receipt of any revenue from the crop.
    The state variables, PW, and PB, give the current winter wheat and barley price,
    respectively. With this information, expectations of winter wheat and barley prices
    at marketing are formed. These expectations, though formed and implemented in
    stage $t$, are actually the conditional expectations of $PW_{it}$ and $PB_{it}$.


    If the decision in stage $t$ is winter wheat, an additional source of uncertainty,
    expected infection level, enters the expected immediate returns function. This
    expectation is conditional on the levels of control and the level of Cephalosporium
    stripe in the last winter wheat crop. The expectation of the infection in a winter
    wheat crop in stage $t$ is the conditional expectation of $I_{it}$. That is, in
    stage $t+1$, the level of infection in the winter wheat crop ($I_{it}$) would
    be equal to the actual level of infection experienced in stage $t$.


    Equations (16) and (17) give the parameters for the winter wheat yield-infection
    relationship discussed earlier (equations (3) and (4)).


    ```

    (16) YF_i = 35.3 (1 - .605 (I_i))

    ```


    ```

    (17) YC_i = 26.2 (1 - .605 (I_i))

    ```


    These equations indicate that if infection is 100% (I_i = 1), there will be approximately
    a 60% reduction in winter wheat yield.'
