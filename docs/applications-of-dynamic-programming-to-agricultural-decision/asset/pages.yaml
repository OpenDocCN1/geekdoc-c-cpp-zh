    # Optimal Stock Investment Decision Rule


    The optimal stock investment decision rule was derived using a value-iteration
    dynamic programming algorithm. Numerical solution required specification of discrete
    state and decision variable levels. Four hog returns ranging from -$20 to $40
    produced state levels of -20, 0, 20, and 40 dollars respectively. Stock prices
    15 intervals ranging from 100 to 310 and stock holdings ranging from 0 to 2,000
    units in increments of 200. Financial instrument holdings covered the range -$350,000
    to $350,000 in $70,000 increments and return on financial instruments ranged from
    6 percent to 16 percent in two percent increments. This formulation resulted in
    43,560 states. The stock purchase decision was allowed to take on values of -200
    (sell), 0, or 200 (buy).


    The optimal investment rule was obtained by backward recursion beginning at the
    final year of the planning horizon. Linear interpolation of the objective function
    was used to increase the convergence rate and reduce biases resulting from discretizing
    the state variables. Interpolation was used on the financial holdings variable
    the ending values for this variable did not necessarily match the state interval
    midpoints. Optimal decisions were found for all state intervals except those combinations
    which defined technical bankruptcy (i.e. negative wealth). In the case of bankruptcy,
    the farming operation was presumed to be liquidated. Optimal decision rules were
    generated until the optimal decision rules converged, which occurred by month
    six of year three. Thus, the converged decision rule was applicable to all periods
    up to the'
