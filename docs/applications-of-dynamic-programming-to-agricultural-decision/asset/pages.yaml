    # Limitations on the Model


    The producer''s decision consists of selecting one of a number of alternative
    states, each of which involves a different land-use combination of fields. The
    number of possible alternatives increases dramatically with the number of eligible
    fields because the producer must consider all possible combinations of years in
    the CRP for all eligible fields. Such an evaluation is necessary because with
    multiple eligible fields there may be an optimal order of entry into the CRP.
    During the five-year enrollment period, the producer need not make all his CRP
    contracts in a single year.'
