  md: '# 4 C. Robert Taylor


    DP is typically used as a numerical solution procedure applied to the maximization
    of recursive equation (3) for discretized state and decision variables. The numerical
    search procedure involves searching over all values of X_i (decision alternatives)
    for given S_j (states). As Bellman demonstrated, application of this numerical
    procedure involves exponentially fewer numerical computations and comparisons
    than exhaustive search applied to a non-DP approach using (1) and (2). For stochastic
    models, it is conventional to restate (3) for discretized state and decision variables
    as a Markovian DP recursive equation,


    ```

    (5) V_i(i) = MAX_k [r(i,k) + βP_ij^k V_j(t+1)]

    ```


    where i is a "index" for states (defined for each combination of states of all
    individual state variables) and j is a "to" index for states, k is an index for
    decision alternatives (defined for each combination of values of all individual
    decision variables), and p_ij^k is the probability of going from state i at stage
    t to state j at stage (t+1) decision alternative k. Note that the state transition
