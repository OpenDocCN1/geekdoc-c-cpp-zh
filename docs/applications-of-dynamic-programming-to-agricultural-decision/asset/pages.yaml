    [HR] matrix was a square matrix of dimension 4. The [PSR] was a square matrix
    of dimension 90 (15 stock price x 6 interest rate states). The [OFS_{hr,ps,rod}]
    matrices were square matrices with dimension 121 (11 financial holdings states
    x 11 stock holdings). To calculate these matrices, the hog return, stock price,
    and return on other financial asset states had to be known. Thus, there were 360
    matrices, with one matrix corresponding to each hog return, stock price, and return
    on other financial asset combination. These matrices were calculated using all
    state transition equations and the optimal decision rule.


    Within the computer program which calculated conditional probabilities, the [HR]
    and [PSR] matrices were calculated once and stored in RAM. Elements within the
