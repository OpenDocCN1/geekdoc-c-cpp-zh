  md: '188


    G. Schnitkey and F. Novak


    These results again are similar to those shown for $\lambda = .33$: the expected
    debt/saving balance plus withdrawals is higher under the variable amortization
    plan, the probability of having debt is lower under the variable amortization
    plan, and the probability of having debt/saving balances below $-\$55,000 is lower
    under the variable amortization plan.


    # Summary of Results


    Results from the DP models can be summarized as follows:


    +   1. For all $\lambda$ values and initial amortization debt levels, the variable
    amortization loan results in higher expected withdrawals plus ending debt/saving
    balances than the other two repayment plans. Thus, the variable amortization loan
    is more profitable from a borrowers standpoint, regardless of the level of emphasis
    given to the lender''s objectives.


    +   2. For $\lambda$ values of .33 and 0, the probability of having debt is lower
    and the expected debt/saving balance is higher under the variable amortization
    loan plan than the other two loan plans. This suggests that the variable amortization
    loan plan has advantages for lenders.


    +   3. At a $\lambda$ value of 1, the variable amortization loan plan results
    in higher probabilities of having debt and smaller debt/saving balances than the
    other two loan plans. This suggests that lenders would not prefer this loan plan
    for profit maximizing, risk neutral borrowers.


    +   4. Loan size does not influence the direction of results. Thus, debt levels
    do not seem to be a factor in preferring one loan plan over another.


    # Conclusions


    Stochastic dynamic programming models have been solved which analysis the performance
    of three loan repayment plans: a traditional amortization loan, a flexible amortization
    loan, and a variable amortization loan. Performance has been monitored using differing
    loan sizes and objectives representing a borrower''s perspective, a lender''s
    perspective, and a combination of a borrower''s and lender''s perspective. Results
    indicate that borrowers may prefer the variable amortization loan because it has
    a debt reserve. This reserve serves as a liquidity source during periods of adverse
    income. Results also indicate that lenders may prefer the variable amortization
    plan, given that some restrictions are placed on withdrawals of the borrower.'
