    the system to zero years of control. The system is also put in a continuous-crop
    versus a fallow-crop situation if the next decision is a spring crop.


    An additional complicating factor is the stochastic nature of product prices and
    Cephalosporium stripe infection levels. At the time of decision making, the magnitude
    of these variables is not known with certainty. Therefore revenues will not be
    known with certainty. Accordingly, the problem should be viewed as stochastic,
    and returns should be viewed in an expected value framework.


    In summary, the optimal strategy for control of Cephalosporium stripe infestations
    in winter wheat involves determination of the sequence of decisions regarding
    cropping or following the land, such that the expected value of net returns is
    maximized. A decision specifies one of the possible alternatives, given expected
    economic and physical conditions at a particular point in time. A stochastic dynamic
    problem such as is efficiently handled by dynamic programming.


    The remainder of the paper is organized as follows: the next section develops
    a general model for Cephalosporium stripe dynamics and winter wheat yield relationships.
    This is followed by the general decision model and recursive equation. Then the
