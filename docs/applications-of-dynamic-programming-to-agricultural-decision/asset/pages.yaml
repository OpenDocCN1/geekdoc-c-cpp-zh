  md: '# Optimal Farm Program Participation


    121


    Even with a fifty percent base, the optimal decision under the five-year base
    calculation is all nonprogram cotton whenever the cotton price of $0.55 or higher.
    For soybean prices below $7.00, 100% nonprogram cotton is planted for cotton prices
    at or above $0.50. The response for the two-year average has more diversity across
    soybean prices, but is otherwise dissimilar.


    With a 75% base, producers move to 100% nonprogram cotton at a $0.55 cotton price
    and low soybean prices, or at a $0.60 cotton price with higher soybean prices.
    Results for the two-year base calculation are quite similar, except that the levels
    of soybean prices at which strategies change are higher. With a 100% base, soybeans
    are never chosen and the strategies are identical for the two-year and five-year
    base calculations. 100% program cotton is planted until the market price exceeds
    $0.60, then 100% nonprogram cotton is planted.


    # Conclusions


    Results of this study are different from those in Mims et al. where large changes
    in strategy resulted from a change from a two-year to a five-year base calculation.
    In this study, strategies were often the same.


    In this study, soybeans were not an attractive alternative to nonprogram cotton,
    but would be planted in combination with program cotton if soybean prices were
    sufficiently high and cotton prices sufficiently low that the combination was
    more desirable than 100% nonprogram cotton. The major differences in this study
    found between the two- and five-year base were that farmers would be less willing
    to plant soybeans, even at very low cotton prices. Under the two-year base, farmers
    move to 100% nonprogram cotton somewhat more readily than the five-year base.
    This result may have occurred because, under the two-year calculation, current
    nonprogram plantings translate into much higher future bases.


    It is not altogether surprising that results here differ substantially from those
    of Mims et al. That study used a much higher target price ($0.794/lb) making the
    farm program much more attractive than it was. Also, the Mims et al. study included
    several program crops besides cotton, providing far more alternatives than were
    used here. Finally, the Mims et al. study ignored price variability and examined
    strategies based on expected future prices.'
