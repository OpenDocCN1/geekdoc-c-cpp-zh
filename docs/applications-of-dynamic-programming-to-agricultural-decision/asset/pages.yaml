    to review Antle''s discussion of risk and dynamics in the 1983 American Journal
    of Agricultural Economics. In this discussion, Antle was able to analytically
    show that risk mattered in a dynamic decision even if the objective functional
    had a risk-neutral structure in the Arrow-Pratt sense. An empirical demonstration
    of Antle''s claim was provided by Zacharias et al. Antle went on to argue that
    dynamic stochastic production models using an expected value maximization criterion
    may be of greater value than static risk efficiency approaches that ignore the
    dynamics of a particular process.


