  md: '# 3


    # Counterintuitive Decision Rules

    in Complex Dynamic Models:

    A Case Study


    James W. Mjjelde, Lee Garoian,

    and J. Richard Conner


    The current trend in agricultural research is to develop increasingly complex
    computer models. Numerous reasons ranging from increased computer skills and technology
    to professional acceptance explain this trend. Associated with this increasing
    complexity are a myriad of problems. This paper discusses one problem that may
    arise when using complex dynamic optimization models, that of counterintuitive
    decision rules.


    Counterintuitive decision rules are defined as a set of decisions in which one
    or more of the decisions appear to be inconsistent. To clarify this definition
    consider the following example involving a set of decisions for four price levels.
    One possible counterintuitive decision rule would be: 1) buy at the lowest price
    level, 2) do nothing at the second lowest price level, 3) buy at the second highest
    price level, and 4) sell at the highest price level. As shown in this paper, such
    rules occasionally result from use of complex dynamic models. It is hypothesized
    that the complex interactions within such models lead to these counterintuitive
    rules.


    The discussion in this paper centers around a dynamic programming (DP) model of
    monthly inventory levels for a cattle operation. The objective of the model was
    to develop an effective hay inventory strategy which incorporates stochastic range
    conditions, production possibilities, and hay prices, along with intertemporal
    affects. Once developed, the model displayed counterintuitive decision rules at
    several stages.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'To explore the potential causes of counterintuitive decision rules, this paper
    is organized as follows. First, background of the hay inventory decision environment
    is presented. Next, the hay inventory DP model is developed. Third, selected results
    are given. Within the results selection, several tests used to investigate potential
    causes of the counterintuitive decision rules are presented. Finally, questions
    concerning counterintuitive decision rules are posed.


    # Decision Environment


    Range conditions vary between excellent and severe drought with weather being
    the primary determinant of range forage quality and quantity. The resulting uncertainty
    associated with forage production is an important concern of range cattle producers.
    This uncertainty is more dramatic when the result is insufficient forage. Strategies
    for combating insufficient forage include selling livestock, renting additional
    land, and feeding hay.


    A characteristic of range forage shortages or droughts is that the duration is
    unknown. Selling livestock is an expensive alternative that ranchers are reluctant
    to use under most conditions. Availability of grazing land, associated costs,
    and uncertain drought duration limit the use of rented land. In this environment,
    feeding hay is a more appealing alternative. The response of ranchers throughout
    the South during the drought in 1986 vividly illustrates the reliance on hay.
    In drought prone areas, it is common for ranchers to carry hay inventories to
    meet unexpected forage demands.


    Determination of optimal hay inventories concerned with uncertain forage production
    has been an area of study (Mauldon and Dillon; Dillon). A common approach is to
    use an inventory model to determine the cost minimizing level of inventory to
    meet a drought of unknown length. Initial inventories are acquired at the prevailing
    price and any shortages that occur are obtained by purchasing at a higher arbitrarily
    penalty price. Pursuing an optimal hay policy in this manner ignores all range
    conditions other than severe drought. In many areas of the south the probability
    of severe drought is much less than for excellent conditions.


    Because prices are stochastic, the timing of hay purchases may have a large effect
    on costs. Also, there may be opportunities to sell inventories at a profit. Consideration
    of the buy and sell possibilities becomes more important when hay production is
    an enterprise of the ranch. In addition to buying hay, the possibility of selling
    and storing ranch produced hay exists.'
  merge: -1
  pgno: 38
