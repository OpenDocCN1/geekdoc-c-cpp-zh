    Recursively solving (3) for value of $S_t$ from stage T to stage 1 yields a global
    solution to the entire T-stage problem. Once a solution has been obtained using
    (3), the problem is composed, or put back together, by applying $X_1^*$, the optimal
    solution for $S_1$. When $S_2$ has been observed (or alternatively, when the random
    event, $\varepsilon_r$, has been observed and $S_2$ computed with equation (2)),
    the optimal decisions, $X_t^*$, are obtained. The time paths of the state variables
    and the decision variables are thus traced through from the beginning to the end
    of the planning horizon once the random events occur. Note that in stochastic
    model, time paths of the optimal decisions and the state variables cannot be traced
    without values for all random variables at each stage.


    The DP approach to solving stochastic dynamic optimization problems is reflected
    in the recursive equation which follows from the principle of optimality. Taking
    such an approach to a problem requires clear specification of state variables,
    decision variables, and random influences on the process. This formulation and
    specification often gives insight and understanding complex decision processes,
    even if the model is not explicitly solved. This is an often overlooked advantage
    of dynamic programming, especially compared to multiperiod programming models.


    In principle, recursive equation (3) can be used to analytically solve the problem
    if all variables are continuous, the one-period and state transition equations
    are concave, and an interior solution exists. An analytical solution is obtained
    by recursively solving the first-order condition for the maximization in the recursive
    equation,


    (4) $$\frac{\partial W_t}{\partial X_t} = \frac{\partial E(R(S_t, X_t, \varepsilon_t))}{\partial
    X_t} + \beta E[\frac{\partial V_{t+1}}{\partial S_{t+1}} \cdot \frac{\partial
    S_{t+1}}{\partial X_t}] = 0$$


    beginning at the last stage and working backwards. In practice, however, mathematical
    functions are intractable or discontinuities exist that prevent analytical solution
    of all but the simplest problems.


    Equation (4) may be useful for certain theoretical derivations because it characterizes
    the solution to the stochastic dynamic optimization problem. In certain cases,
    such a characterization can be used to derive marginal economic principles, although
    it stochastic control may give more insight into the solution than DP.'
