    # Results for a .33 λ Value


    Yearly expected withdrawals from the AMOR, FLEX AMOR, and VAR

    AMOR models are shown in Figure 11.6. Similar to results from the DP

    hmodels having λ = 1, the variable amortization loan results in higher

    withdrawals in all years except in year 10. The variable amortization

    plan’s withdrawals are above the flexible amortization loan plan

    until 7.


    Debt/saving balances are lower under the variable amortization loan

    plan than the other two loan plans until least year 7 (Figure 11.7). This

    primarily results from the ability to retire debt instead of holding savings.

    Thus, the debt/saving distribution is partially truncated in the saving

    range. Note that the expected debt/saving balance is distinctly different

    bween the flexible amortization and variable amortization loan plans,

    enough the flexible amortization plan allows the amortization loan’s

    principle to be repaid. Differences result from the debt reserve under

    the variable amortization plan, which allows cash shortfalls to be covered.


    As a result, the probability of having additional debt is lower under

    t variable amortization loan plan (Figure 11.8). Note also the

    probability of having additional debt differs between the

    amortization and flexible amortization loan plans. This suggests that the

    deb reserve under the variable amortization loan plan is key in

    providing flexibility in meeting cash shortfalls.


    Table 11.3 presents summary conditional probability results in year 10.

    Similar to results when λ = 1, the expected debt/saving balance plus

    withdrawals is higher for the variable amortization plan than it is for the

    tother two plans. Also, the probability of having a debt/saving balance

    less than -$55,000 is lower under the variable amortization plan. Unlike

    the case when λ = 1, however, the probability of being in debt is lower.'
