- img_proc: true
  md: '# Alternative Loan Repayment Plans


    One of the more common loan repayment plans is a traditional amortization loan.
    Under this plan, total periodic loan obligations remain constant over the loan''s
    life. Thus, over time, the principal and interest portions of the total payment
    vary, with the interest payment constituting a larger portion of the total payment
    in earlier years than in later years. The advantage of this plan is simplicity.
    A disadvantage is that loan repayments do not vary with assets.


    Another repayment plan is what is termed here as a flexible amortization loan.
    This plan is offered by the Farm Credit System, and is essentially equivalent
    to a plan proposed by Lee. Under this plan, total debt obligations are calculated
    as under the amortization loan. In each year, the principal must be reduced to
    the level prescribed by the amortization schedule. In any given year, farmers
    can further reduce the principal portion of the loan. Reducing principal then
    reduces interest payments. In a future year, a principal payment may not have
    to be made if the principal has been previously paid.


    One advantage of the flexible amortization plan over the traditional amortization
    plan is that farmers can repay principal payments in years of high income. Thus,
    the plan provides some flexibility in matching returns from assets to loan repayments.
    If, however, principal has not been prepaid, the plan does not allow for lower
    debt repayments in adverse income years.


    An alternative to the flexible amortization plan is Baker''s variable amortization
    plan. This plan includes two key elements. First, a debt reserve is added to the
    total loan obligation. This debt reserve, equaling a certain percentage of the
    total loan, can be drawn on adverse income years. For example, a 10 percent debt
    reserve would be added to the loan. This means that a $4,000 reserve exists on
    a $40,000 loan. The second component involves scheduling of loan repayments. According
    to Baker, loan debt obligations can be determined using an amortization schedule
    based on the loan plus. Then, the loan obligation would be allowed to "flex" based
    on returns to assets. The repayment during a year could be determined by an index
    of revenues and costs (see Baker (1986) for an example and further description).
    An advantage of the variable amortization plan is that it allows loan repayments
    to be positively correlated to return on assets. It also allows more flexibility
    than does the flexible amortization plan.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Analysis of a Variable Amortization Loan Plan


    # Evaluating Alternative Loan Repayment Plans


    When evaluating the alternative loan repayment plans, two perspectives are considered:
    the borrower''s (i.e., farmer''s) perspective and lender''s perspective. Profit-maximizing,
    risk neutral borrowers prefer loan plans with lower interest costs and allow for
    faster withdrawals from the debt-financed investment. In the case of a farm, withdrawals
    of funds allow for firm growth, investment in off-farm assets, and family living
    expenses. An objective that incorporates this perspective is the maximization
    of the present value of withdrawals.


    Lenders, on the other hand, prefer plans that have the highest probability of
    meeting loan obligations. In addition, lenders prefer that borrowers maintain
    liquid funds, such as in a savings account. This liquidity source then can be
    used to meet loan obligations in adverse income years. An objective which minimizes
    the discounted present value of cash shortfalls can capture this perspective.


    # The Stochastic Dynamic Programming Models


    Stochastic dynamic programming (DP) models are solved to evaluate the three alternative
    loan repayment plans. Results from the models are generated for three differing
    perspectives: a farmer''s (i.e., borrower''s) perspective, and a combination of
    the farmer''s and lender''s perspectives. The DP models are of a hog facility
    investment which costs $80,000. With this hog facility, 2000 hogs can be finished
    in a year. This investment is financed with $20,000 of debt or $40,000 of debt.
    In either case, the loan is ten years in length, with loan obligations due at
    the end of each year.


    The DP models evaluate the ability of the hog facility investment to be self liquidating.
    As such, funds from other enterprises are not considered. This focus ignores possible
    flows from farm enterprises which may provide funds to repay loan obligations.
    However, since the flexibilities of loan plans are being evaluated, this perspective
    is judged as being appropriate.


    Four DP models containing alternative loan repayment plans are solved. The first
    model, which is entitled "BASIC DP", models the firm with no debt financing. Results
    are used as a benchmark for the remaining loan repayment plans. The remaining
    three DP models are modifications of the BASIC DP model and incorporate the traditional
    amortization, flexible amortization, and variable amortization loan repayment
    plans. Each of the four models are described in the following sub-sections.'
  merge: -1
  pgno: 187
