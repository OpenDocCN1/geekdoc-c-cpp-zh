    A closer study of the inventory model is revealing in examining the hypothesis
    that complex models can give rise to counterintuitive decision rules. Within the
    model, many different components are interacting at each stage. Potentially, it
    is these interactions which give rise to the counterintuitive decisions. First,
    both the price and range equations were estimated using monthly dummies. In 7
    of the 12 months, the signs of the coefficients associated with the monthly dummies
    in each equation are identical. Thus, conflicting signals are passed to the decision
    model. For example, consider a positive monthly dummy for next month in both equations.
    For the price equation the positive sign indicates the probability of higher prices
    next month is increasing, suggesting that purchasing of hay in the current month
    may be profitable. A positive sign associated with the range condition indicates
    a higher probability of improved range conditions, suggesting that purchasing
