  md: '# 6


    # Optimal Participation in the Conservation Reserve Program


    Celia Ahrens Johnson


    In December of 1985, the 99th Congress passed and the President signed into law
    a farm bill to govern federal agricultural and food policy for the next five years.
    This paper investigates the impact of this legislation on land retirement decisions
    made by individual producers. Specifically, a stochastic, dynamic program is presented
    which models a profit maximizing Illinois producer''s decision to enroll highly
    erible farmland in the Conservation Reserve Program.


    # The Conservation Reserve Program


    The conservation compliance provision of the 1985 Food Security Act requires that
    all producers cropping highly erible land begin implementing a conservation plan
    by January 1, 1990, in order to be eligible for program benefits; implementation
    of the plan must be completed by January 1, 1995. The conservation reserve provision
    of the Act establishes a national reserve of highly erible land, scheduled to
    encompass 40-45 million acres, which is approximately 10 percent of the nation''s
    cropland, by 1990 (U.S. Congress 1985).


    A producer wishing to participate in the Conservation Reserve Program (CRP) must
    submit a bid for annual government payments based on the costs associated with
    removing the land from production and establishing a conservation cover. If the
    producer''s bid is accepted, he is paid half the cost of planting perennial grasses
    or trees plus an annual fee for conservation maintenance during a ten-year contract
    term. The plan must be approved by the local conservation district, and the producer
    must agree not to harvest, graze, or otherwise commercially use the vegetative
    cover. A producer who returns land to production before'
  merge: -1
  pgno: 91
- img_proc: true
  md: '78


    Celia Ahrens Johnson


    his contract expires must repay the government, with interest, all of its contributions
    to date (Glaser 1986).


    Of the conservation techniques available to control soil loss, the CRP represents
    the most extreme measure: removing land from production and planting perennial
    vegetation to halt erosion. Generally speaking, the more erosive the land and
    the lower its productivity, the greater the social benefits from withdrawing land
    from crop production. To the producer, however, the net benefits of land retirement
    are seldom high enough to prompt this action unless the government reimburses
    him for his conservation efforts. Many studies have found economic incentives
    for soil conservation to be weak (see, for example, Seitz and Swanson 1980; Burt
    1980; Lee et al. 1975; Narayanan et al. 1974; Swanson and MacCallum 1969). The
    CRP transfers some of the conservation costs from the producer to the current
    and future citizens who reap many of the benefits of soil conservation.


    The intent of the framers of CRP legislation was that producers would bid competitively
    for the opportunity to enroll in the CRP. Under a truly competitive bidding system,
    a producer’s bid would reflect the marginal returns associated with farming his
    highly erosible cropland. During the initial bidding process, however, the government
    established bid caps for each county. Once the existence of bid caps became known,
    producers began bidding the maximum rental rates allowable in their counties.


    The lack of a true bidding system makes the rates quite generous for relatively
    unproductive erosible land, but too low to motivate enrollment of land which is
    both highly productive and highly erosible. A substantial portion of Illinois
    cropland eligible for the CRP falls in this latter category. This paper investigates
    the CRP enrollment decision from the perspective of an Illinois producer assumed
