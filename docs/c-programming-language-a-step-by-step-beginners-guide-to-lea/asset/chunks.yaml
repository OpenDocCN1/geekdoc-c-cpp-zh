  raw: "If you have no idea about precedence, you might be tempted to go the linear\
    \ way, adding 5 to 3 and then multiplying their sum by 4; in which case you would\
    \ have 32\\. However, this is not correct in C programming where the multiplication\
    \ operator is higher in precedence than the addition operator. So the correct\
    \ way is to multiply 3 by 4, whereby you will get their product as 12; then add\
    \ 5 to 12 and you get 17\\. That is the same way you are expected to treat different\
    \ operators within the same expression – according to the precedence each has\
    \ in C.\n\nBelow is a table showing the precedence of various operators in descending\
    \ order:\n\n1.  Operators taking the highest precedence: number one overall:\n\
    \n    1.  A suffix and postfix, being increment as well as decrement ; from left\
    \ to right, that is, ++—\n\n    2.  A function call, which is, ()\n\n    3.  An\
    \ operator of array subscripting, which is, []\n\n    4.  An operator of structure,\
    \ as well as union member access, which is.\n\n    5.  An operator of structure\
    \ as well as union member via pointer, and that is, ->\n\n    6.  The compound\
    \ literal or C99, which is, (type){list}\n\nAll the above operators have left\
    \ to right associativity; or you can call it fixity. It is indication of how you\
    \ are expected to understand precedence in each case even when no parenthesis\
    \ is used.\n\n1.  Operators taking the second position in precedence\n\n    1.\
    \  A prefix increment as well as decrement, both denoted by ++—\n\n    2.  Unary\
    \ plus as well as minus, both denoted by +-\n\n    3.  The logical NOT as well\
    \ as the bitwise NOT, both denoted by !~\n\n    4.  The type cast as denoted by\
    \ (type)\n\n    5.  Indirection, or otherwise, dereference, represented by *\n\
    \n    6.  Address-of, represented by operator, &\n\n    7.  The size as denoted\
    \ by sizeof\n\n    8.  Requiring alignment, or otherwise, C11; and that is represented\
    \ by alignof\n\nThe associativity of this category of operators is right to left.\n\
    \n1.  These are the operators coming third in precedence\n\nThey include operators\
    \ of multiplication, of division, and any remainder; and they are considered from\
    \ left to the right. They are denoted by */% and have associativity of left to\
    \ right.\n\n1.  Here are operators taking fourth position in precedence. They\
    \ comprise those of addition and also subtraction, as denoted by +-. Here too,\
    \ associativity is from left to right.\n\n2.  The operators taking precedence\
    \ in this fifth position have associativity of left to right. They include the\
    \ bitwise left shift as well as the right shift. The operators themselves are\
    \ <<>>\n\n3.  The operators taking this sixth position in precedence include relational\
    \ operators, which are:\n\n    1.  < as well as <=\n\n    2.  > as well as >=\n\
    \nSo, essentially, the operators in play are <<= and >>= with associativity of\
    \ left to right. \n\n1.  Seventh in order of precedence are other relational operators.\n\
    \nThey are specifically ==!= and their associativity is also from left to right.\n\
    \n1.  Eighth in order of precedence is the bitwise AND, simply denoted by &.\n\
    \nThis, too, has associativity of left to right.\n\n1.  Ninth in precedence is\
    \ the exclusive bitwise operator OR.\n\nThis is the one denoted by the operator\
    \ ^; and it has left to right associativity as well.\n\n1.  Tenth in order of\
    \ precedence is bitwise OR, which you can term the inclusive OR. It has left to\
    \ right associativity also, and it is the one denoted by the operator, |\n\n2.\
    \  Eleventh in line is the Logical AND. This one also has left to right associativity.\
    \ It is denoted by &&.\n\n3.  The logical OR follows in order of precedence in\
    \ twelfth position. Its associativity is also left to right. This operator is\
    \ denoted by ||\n\n4.  This operator that is thirteenth in precedence is the ternary\
    \ conditional. It is denoted by [note 1] and its associativity is right to left.\n\
    \n5.  The operators that take fourteenth position happen to be simple assignment\n\
    \n1.  This is an assignment of sum as well as difference and it is denoted by\
    \ +=-=\n\n2.  Another one is assignment involving product and quotient; as well\
    \ as remainder. It is denoted by *=/=%=\n\n3.  In, this category too is bitwise\
    \ assignment, which happens to comprise the left as well the right shift. These\
    \ are denoted by << = >>\n\n4.  There is also another bitwise assignment, and\
    \ that involves there operators, which are AND, also XOR, and lastly OR; denoted\
    \ as &=^=|=\n\n1.  The last one in line, ranking 15th, is the comma, and its associativity\
    \ is from left to right. It is denoted by ,\n\n# Chapter 6: Making Decisions In\
    \ C\n\nWhat does decision making entail within the context of C language programming?\
    \ Well, you need to know the best order to execute certain expressions or statements\
    \ provided; or those you have personally designed.  There is a way you can lay\
    \ out your statements and your program fails to return any usable results; possibly\
    \ returning errors. Some sets of statements actually require repeating before\
    \ they can meet the conditions needed. As a programmer, the reason you go to these\
    \ lengths is to be able to make pertinent decisions relating to your programming.\
    \ The true or false results that your program returns are very important because\
    \ they come about through a thorough process of evaluation. Essentially what C\
    \ does is help you weigh different conditions against one another, in a bid to\
    \ solve one or more problems that you are faced with. \n\nAs a programmer using\
    \ C, you are expected to be able to specify one condition, or even more, which\
    \ the program will evaluate and test. These are handled together with a given\
    \ statement or a select set of statements, and they are then executed if the condition\
    \ or conditions you specified prove to be true. Otherwise, if the condition or\
    \ conditions do not prove to be true, meaning they are proven as false, the alternative\
    \ statements may be executed.\n\nThe C language handles decision making in a simple\
    \ but organized manner. Here are statements that C supports for the sake of decision-making:\n\
    \n(1) The if-statement\n\n(2) The switch statement\n\n(3) The conditional operator\
    \ statement\n\n(4) The goto statement\n\nHow The if-Statement Works:\n\nThis one\
    \ comes in four different forms as shown below:\n\n1.  The simple one\n\nThis\
    \ one simply mentions one condition or supposition and states that something specific\
    \ is going to happen if that supposition holds true. However, if that supposition\
    \ does not hold true, the suggested thing does not occur; rather the situation\
    \ becomes different. In programming, and in this case C, you need to put that\
    \ situation in form of a statement, so that your program can evaluate the condition\
    \ and execute commands appropriately.\n\nHere is how you express it:\n\n*   If\
    \ (your chosen expression) {this inside statement;} this outside statement\n\n\
    1.  If...else\n\nIn this statement, you have two specified possibilities, so that\
    \ if your expression does hold true, your first statement works; or else, which\
    \ essentially means your expression failing to hold true, your second statement\
    \ works. You could also have a situation where, should the condition be true,\
    \ the program executes a set of statements; and if the condition is not true,\
    \ the program executes a different set of statements.\n\nHere is how you express\
    \ it in readiness for execution:\n\n*   If (your chosen expression) {1^(st) statement;}\
    \ else {2^(nd) statement 2}\n\n*   If (your chosen condition) {1^(st) statement;\
    \ 2^(nd) statement;} else {3^(rd) statement; 4^(th) statement}\n\n1.  If...else;\
    \ nested\n\nThis one is very near like if...else, only that it has a third alternative\
    \ statement. Here is a situation where you may find it necessary to insert an\
    \ if-statement or if...else statement right within another.\n\nHere is how you\
    \ express a nested if:\n\n*   If (your 1st condition) {1st statement ;) else _\
    \ if (your 2nd condition) {2nd statement ;} else 3^(rd) statement.\n\n1.  Else...if\
    \ ladder"
