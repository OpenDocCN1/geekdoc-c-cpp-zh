  raw: 'In this form of statement, you have your chosen expression tested starting
    from the upper part of the ladder and progressing downwards, and in the process
    trying to verify the condition present. Only if the condition is found as expected
    is the related statement executed.


    Points worth Noting:


    *   In C, values that are non-zero or non-null are the only ones that can hold
    true. So, for a value that is zero or even null, the program automatically returns
    results as false.


    *   You can have one single statement within the if-statement that is not enclosed
    in curly braces – {}


    See this example:


    Int a = 6


    If (a > 5)


    Printf (“success”)


    As you can see, no curly braces have been used in the above example, and none
    were needed. However, if the situation were different such that there was an additional
    statement within the if-condition, you would need to enclose those statements
    within curly braces.


    *   The operators, == need to be used carefully to avoid confusion between it
    and the = operator. The only time you can use == appropriately within an expression
    that has an if-condition is if you are making a comparison. Otherwise the = operator
    in such an environment executes an assignment; not at all a comparison.


    *   Anything you enter as condition in an if-statement will hold true if it is
    not a nil/zero (0) value


    Example:


    if (25)


    Printf (“hi”);


    In this particular example, you can be sure to see hi printed.


    What you have been using all along as the syntax of the if-condition is the Boolean
    expression. And what, exactly, is the Boolean expression? Simple: It is the expression
    you use in programming to produce a Boolean value after evaluation. By value here
    we simply mean the true or false results we have mentioned elsewhere in the book.
    In actual fact, these two alternatives – true and false – are values of the Boolean
    data type. They are the outcome of logic when working with Boolean algebra.


    And what would we say Boolean algebra is? Well, it is simply a branch of algebra
    that deals with the variables of truth; denoting true and false in terms of 1
    and 0 respectively, as the case may be. The first person to initiate this algebraic
    system that deals with logic mathematically went by the name of George Boole;
    the reason the terminologies of Boolean value, Boolean expression and so on are
    in use today. As you can deduce, being able to return values through logic is
    very important because it means any decision you are going to make on the basis
    of those values has a solid basis. It means you are certain what conditions are
    bound to work and which ones are bound to fail. Hence it is fair to say that C
    helps in making verified data based decisions. 


    How the switch-Statement Works:


    Just like the if-statement, the switch statement also influences a program’s flow
    in case the condition being tested proves to be true. One thing you need to note
    about the switch statement is that it sometimes has varied conditions. The way
    it goes is that if the statement has a variable that meets the first condition
    contained in the switch statement, whatever command there is goes through and
    is executed. In fact, you can enter a default within a switch statement but it
    is not mandatory. In case you have included a default, and all the variables within
    the switch statement fail to meet the condition given, the default you have in
    place takes place. 


    In practice, switch statements come in handy in solving problems of a multiple-option
    nature; especially when dealing with a program like a menu, where you have particular
    values associated with specific options.


    How the conditional operator-Statement Works:


    You can denote the conditional operator like this:?: operator


    This is a statement that you can use in place of the if...else statement. Here
    is an example of the form this statement takes:


    Exp1 ? Exp2 : Exp3;


    Each of these – Exp1, Exp2 and Exp3 – is an expression on its own. It is important
    that you do not forget to put the colon in its right position as illustrated above.


    How to determine the value of any given expression within the statement:


    (i)  Evaluation of Exp1 takes place first.


    *   What happens if it is found to be true? Evaluation of Exp2 immediately takes
    place. At the end of the day, it is the value of Exp2 that is taken as the entire
    expression’s value.


    (ii) Evaluation of Exp1 takes place first.


    *   What happens if it is found to be false? Exp2 is ignored, and instead evaluation
    of Exp3 is immediately takes place. The resultant value of the entire expression
    is that of Exp3.


    How The goto-Statement Works


    This one actually alters the conventional sequence of C programming. It is known
    for instigating a jump on unconditional basis, to a location within the function
    where there is a labeled statement. What happens then is that you can easily lose
    trace of the program flow; and that is not a good thing as it makes it difficult
    for you to modify the program even if you so wanted.  Suffice it to say, there
    are experts who discourage programmers from using the goto statement.


    # Chapter 7: The Role Of Loops In C Programming


    What, exactly, is a loop? Within the context of C programming, a loop is that
    programming function that enables iteration of a statement, or of a condition,
    on the basis of specific boundaries. Incidentally, the way loops work is more
    or less similar across different programming languages.


    Notably, when you are working with a given statement, or with a set of instructions,
    execution continues until such a time as a specified boundary condition – the
    anticipated loop body – is met. Thereafter, repetitions of that initial cycle
    of operation can continue, involving the whole loop body, until execution of the
    entire code block is accomplished as required. Still, on the overall, you get
    statements being executed in a sequential order. In short, if you have more than
    one statement in the same function, the program executes the first statement first;
    the second one follows; and so on. It is worth noting that you can have different
    execution paths even when they are complex. The main reason loops are important
    in programming is that it is their statements that facilitate execution other
    statements severally.


    Different Loops And How They Work:


    1.  The while loop


    The while loop operates while a certain condition happens to be true, repeating
    a statement or set of statements. It actually performs the evaluation of the test
    expression. It then ensures the condition is tested before it can execute the
    loop body. However, if the test expression proves to be false, what follows is
    the termination of the while loop.


    This is how while loop syntax looks like:


    while (condition) {statement;}


    Note that the statement needs not be one; there could be more.


    1.  The for loop


    In this loop, execution of the initialization statement occurs just once. What
    follows immediately after is the testing of the expression. If ever it is found
    false, returning zero (0), the loop gets terminated. However, in case the result
    returned is non-zero, meaning the test has proven the expression to be true, the
    codes within for loop are automatically executed. Also the expression gets an
    update. After several repetitions of this process, the expression being tested
    finally turns false. You need to note that you use for loop mostly when you have
    a known number of iterations.


    This is how for loop syntax looks like:


    For (init; condition; increment) {statement;}


    Here, too, the statement can be more than one.


    1.  Do...while loop'
