  trans: "\n\n正如之前提到的，你可以用少至三行或多达任意行的代码来编写一个 C 程序。文本文件需要具有\"`.c`\"扩展名。例如，当你的源语句包含\
    \ `hi` 时，你可以将其保存为 `hi.c`。要编写 C 程序，你需要使用像 `vi`, `vim`, `Emacs`等文本编辑器。\n\n据悉 IBM\
    \ 公司曾使用 XEDIT 终端编辑器；UNIX 系统用户则偏好*Emacs*或**Vi**（可视编辑器的简称）。对于初学者来说，也许更青睐 Pico 这种入门级工具——它没有大菜单和图标界面,完全依靠组合键完成布局指令\
    \ ,这使得它的速度远超绝大多数文字处理器 .\n\n### 环境设置\n\n在本章中您将学习如何配置自己的工作台：如果你是打算亲自实践这条路的话请继续阅读;否则若只是想体验测试我们的服务可以直接访问线上入口试行哦～\n\
    \n明确一下目标范围:读者能够选择是搭建本地开发平台还是快速利用云端资源进行探索 。\n\n现在进入主题：\n\n####  设定 C 语言编程区 \n要想组装一间专门用来运行那些灰框黑底编译实验的房间必须备齐两大件缺一不可:\n\
    \n- **第一项**:源代码书写器 （即 \"***text editor *** \")\n这个角色非常单纯 ，我们用它敲出一行一行字符序列的组合体形成的小册子在业内被称为源码对应生成特定的工程工程项目\
    \ .市面上随手可找例子除了上面提及的类型还包括 Windows 自带的记事本乃至老 DOS 命令行下的 Edit 命令等等 。简单一句话 ：少了此物技术宅寸步难移！\n\
    \n-\n\n第二样法宝更具神奇 --->能把纸面人语变成机器跳动的二进制对象么？是的！它就是加工流水线核心分拣设备→编译器 (compiler )!网上有海量的免费版本任你下载其中\
    \ GNU 家族的 GCC 系列堪称无冕之王:::当然具体依据宿主属于 Unix 大家庭或者苹果族亦或是 Win 血统有所不同下文会仔细诉说他们之间的移植问题诀窍咧!\n\
    \n检查是否已预装该神器可以用打开一个小黑盒子然后键入 \n\n```\n$ which gcc\n```\n\n如果返回路径如 ⏎ /usr/bin/gcc\
