  raw: 'You may, for instance, wish to have a long-value integer into just a simple
    one. In such a case, you could typecast long onto int. Alternatively, you could
    do your value conversion from one integer to another by overtly making use of
    the cast operator.


    You can also explain type casting as alteration of a particular expression associated
    with a particular type so that it now belongs to a different type. Type casting
    is a common thing in C language programming. It is generally advisable to alter
    lower data type turning it to a higher data type because that way you do not risk
    losing data. On the other hand, whenever you convert higher data type to a lower
    data type, you find your data having been truncated. Just to give you an idea,
    if you were to convert float to int, all data coming after the decimal disappears.


    Another yet simpler explanation of what typecasting is indicates that it is one
    way of making a type of variable to behave as if it were another type. You can
    take an example of an int acting as if it were a char; and the behavior alluded
    to here is a one-time thing – only during the operation at hand. If you want an
    easy way to typecast, simply pick the variable type of your choice, and then put
    it within parenthesis before the variable whose behavior you want altered. For
    example, (char)a outright makes variable a to function as if it is a char.


    ––––––––


    See one illustration below:


    (type_name) expression


    You may also wish to learn from a situation where a floating point operation takes
    place. In such a scenario, you have the cast operator causing a split of an integer
    variable, actually being done by another. Look at the illustration here below:


    #include <stdio.h> #include <stdio.h> main() { int sum = 17, count = 5; double
    mean;  mean = (double) sum / count; printf(“Value of mean : %f\n”, mean );


    The result returned after compilation and also execution of the code laid out
    above is as follows:


    Value of mean : 3.400000


    What you need to know at this point is that the program’s cast operator takes
    priority, or has precedence over any integer division or division of any other
    sort. Consequently, the sum value is straightaway converted into type double;
    and only after that is it divided following count with a double value.


    At times, however, you have type conversions that are implicit, being done automatically
    by the C compiler. Other times, the type conversions happening explicitly via
    the employment of the program cast operator. Good practice calls for you to engage
    the cast operator when you need to make type conversions.


    How the integer promotion works


    Integer promotion in C is the simple process whereby integer type values smaller
    than int, or otherwise unsigned int, happen to undergo conversion so that they
    become either int, or alternatively, unsigned int.


    Here is an example where you add a character accompanied by an integer:


    #include <stdio.h> main() { int i = 17; char c = ‘c’; /* ascii values is 99 */
    int sum; sum = i + c; printf(“value of sum : %d/n”,  sum ); }


    Have you any idea what result you get after compilation and subsequent execution
    of the code just above? Here it is:


    Value of sum : 116


    # Chapter 13: Benefits Of Using The C Language


    It is an established fact that C, as a programming language, is very popular,
    in spite of the fact that it came into the market more than three decades ago.
    It is popular too notwithstanding the emergence of newer programming languages.
    A beginner may wonder: What is it that attracts users to pick C and not any other
    programming language, or in some cases, in addition?


    Here are some of the positive things users have said about C:


    1.  The C language provides a foundation for several other programming languages.
    Not only does it have a lot in common with its newer variations, like C++ and
    others, but other computer languages have picked fundamental principles from it.
    For that reason, C is taken to be the main building block for many computer languages
    existing in the market today.


    2.  The C programming language is rich in data types and has a wide range of operators.
    These operators are not just many but they are also very powerful in their execution
    of commands and functions. It is for this reason that many users have found C
    to be highly efficient, impressively fast, and also pretty easy to comprehend
    and use.


    3.  C is one computer language that you can aptly term portable. What does that
    portability entail? Well, the C language is one that you can write purposely for
    one computer, and then you find it easy to run and use on an entirely different
    computer. Often you are able to do that without having to alter a thing, and if
    it is necessary to make some changes, they are often minimal.


    4.  The C programming language has a range of keywords that you can remember with
    ease. They are just 32 in number. However, C has the advantage of having built
    in functions, and these make the use of C all the more efficient. C has at its
    disposal a reasonable number of standard functions, and these enable users to
    develop programs with relative ease.


    5.  C can be said to be versatile. With the great number of functions that it
    spools from its library, it does not only extend itself as need be, but it also
    enables the user to add personalized functions to the library with relative ease.
    On the overall, C makes programming easy whether you are a beginner or a veteran.


    6.  The C programming language is among the best structured languages in use in
    the computer world. For that reason, as a user, you are able to think of a challenge
    in terms of C’s function modules; or what you might call blocks.


    Being well structured brings other advantages. For starters, being able to fit
    a problem to where it belongs in terms of function blocks, means you can rectify
    the problem faster. Also the fact that C is an assembly of modules making a whole
    program means understanding and dealing with the entire program is easy. By the
    same token, it becomes easy for someone to debug, test and also maintain this
    modular structure that is the C programming language.


    1.  C is procedure oriented


    Where does the advantage lie in this case? Well, it is in your ability to create
    your customized procedures or even functions, which you can then apply to suit
    your environment, executing your tasks as you deem appropriate.


    Another benefit that comes with being procedure oriented is that of ease of learning.
    This is because C adheres to specific algorithms in executing your statements.


    1.  The compilation speed experienced in C is far ahead of other programming languages.
    In actual fact, C’s compiler is capable of compiling about a thousand code lines
    in one or two seconds. The speed is further enhanced by optimization of the code
    making execution exemplary fast.


    2.  C’s syntax is easy to understand for its language. You will find its keywords
    mainly in English, which makes it easy for many users to remember them. Some examples
    of English words in the syntax are switch; if; else; and so on.


    3.  The C programming languages accords you great preparation for other programming
    languages. Once you master C, you are in a position to easily learn application
    development.


    The Challenges Faced By Users


    In most cases, there is more than one side to an issue. In our case, to this highly
    popular programming language.  Good and handy as it is, the C language does present
    some challenges sometimes. Here they are:


    (1) The C programming language does not have Object Oriented Programming System,
    otherwise referred to as OOPS. Be that as it may, developers of C have gotten
    over that hitch through development of the more modern C++, a variant of the original
    C.


    (2) C does not avail runtime checking


    (3) The rules of C are not very stringent especially when it comes to type checking.
    That is why you can easily overlook an integer value.


    (4) There is a challenge relating to floating data type'
