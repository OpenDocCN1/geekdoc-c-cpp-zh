    \n关于白空格用法解析如下 ：完全空白的行会被自动忽略然而这并不局限于单纯的空白还包括换页(\\n)制表tab及注释部分实际上起到分隔语句元素的作用使得编译器可以准确理解每个组成部分的意义表达式int\
    \ main只有通过whitespace才能区分出关键词类型声明举例来说dessert = cream + candy; //获取全部甜点在赋值号两侧加或不添加入皆可并不会影响解释器对其理解请根据易读性自行裁量即可务必保证整体语义清晰不发生歧义；\n\
    \n重要数据类型划分包括两大类别：\n**(一). 原始(Primary/Basic):**\nInt代表整型Float浮点数Char字符无返回值void情形对应那些既不产生结果也不接收参数的子例程示例如\
    \ exit (status )……同理亦可依样写出 rand(void)。\n\n具体字节占用情况见表格描述。（略）\n*(二)*.**派生**:包括数组(struct\
    \ union)、指针(*Pointer*)概念说明:某特殊类型的var存储另一地址值可通过解引用访问内容通用形式 “type * var-name”；典型用例\
