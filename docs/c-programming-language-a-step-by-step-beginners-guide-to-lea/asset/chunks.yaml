    \ already built in  \nTarget : i386-redhat-linux   \nConfigured with: ../configure\
    \ —prefix=/usr .......\nThread model : posix    \ngcc version 4.1.2　20080704 (Red\
    \ Hat -46 )\n\n倘若是拒绝的回复也无需慌张 ~到域名所在位置 [`www.gnu.org/software/gcc/ `](http://www.gnu.org)\n\
    \n按步骤马上下载解压即可～另外果粉们的 mac 也有官方配套礼物虽然门槛稍低但长相肯定不陌生嘿嘿直接开箱就能拥抱开发者净土哟指代号称腿长话不多的 Xcode\
