    is Oak Ridge National Laboratory in the US, and its user is the United States
    Department of Energy.


    (iii)  Sequoia


    This is another US supercomputer, and it is located in Lawrence Livermore National
    Laboratory in the state of California.  It has been used largely in matters of
    climate, energy, as well as astronomy.


    (iv)  K Computer


    The K Computer is a product of Fujitsu, who built it at the Advanced Institute
    for Computational Science (AICS). This institute is within RIKEN, Japan’s biggest
    research institution, situated in the city of Kobe.


    (v)  Mira


    This is another of US’s supercomputers. It is located within the Argonne National
    Laboratory, which is at the outskirts of Chicago, and is largely used the US Department
    of Energy.


    (vi)  Piz Daint


    This one is to be found in Switzerland, precisely in its southern city of Lugano.
    It is located at the Swiss National Supercomputing Center. Europe does not have
    a more powerful supercomputer than this one.


    (vii)  Shaheen II


    This supercomputer is located at the King Abdullah University of Science and Technology
    in Saudi Arabia, and is the newest amongst the top 10, having gone live in 2015.


    (viii)  Stampede


    This one is located within the Texas Advanced Computing Center in the US.


    (ix)  Juqueen


    This supercomputer, which is found in Germany, is Europe’s second to make the
    list of Top 10\. It is located within Forschungszentrum Juelich.


    (x)  Vulcan


    This is a US supercomputer located within the Lawrence Livermore National Laboratory.


    1.  Mac


    The Mac is entirely run on C, including its drivers and programs, and that applies
    on all its models, just as happens in Windows and the Linux.


    1.  Mobile Phones


    When it comes to the Windows phone, the android, and also the iOS, their kennels
    are in the C language. In short, their kernels are written just like those ones
    in the computers described above, only they are mobile adaptations.


    1.  Databases


    Most databases used in financial systems; telecommunications; entertainment; health
    and education systems; the general web and elsewhere; are mostly written in C;
    or even C++. These include the most popularly used, like the Oracle, MySQL, MS
    SQL Server, and even PostgreSQSL.


    Main Advantages of Using the C Programming Language


    1)  It is a structured language


    2)  It is relatively easy for someone to learn from scratch


    3)  It is efficient in the writing of programs


    4)  It does well in different computer platforms


    5)  It also does fine with low-level activity.


    Everyday Use of C


    It may be helpful, for the sake of beginners, to provide a breakdown of where
    the C programming language is most commonly used. The C language is actually easy
    to find, not just in Operating Systems, but also in Language Compilers; Assemblers;
    Text Editors; Print Spoolers; Network Drivers; Language Interpreters; Utilities;
    Network Drivers; and as already mentioned, in modern programs and databases.


    Suffice it to say, the C programming language is very popular with writers of
    modern software applications, some of which are used in 3D movies and embedded
    systems like those used in TVs, remote controls, and so on.


    Taking the example of a common utility item, the motor vehicle, here are some
    of its features that have been programmed in the C language:


    1.  The automatic transmission


    2.  The systems that detect the vehicle tire pressure


    3.  The sensors that monitor the levels of oxygen, temperature and oil


    4.  The various memory categories, including that of mirror settings


    5.  The dashboard display


    6.  The anti lock brakes


    7.  The vehicle stability control, which is automatic


    8.  The cruise as well as the airbag controls


    9.  The child proof locking system


    10.  The climate control


    The motor vehicle example is just one among other utility items that have systems
    written in C. Even many vending machines from where you buy soda have C language
    systems. Many cash registers at shopping stores are also run in programs written
    in the C language.


    What these devices that make life relatively easy have in common are embedded
    systems that run like small computers that have program running microprocessors
    written in C. That is why the systems detect it when someone presses a key and
    they react in ways pre-set. They also display relevant information accordingly.
    Many manufacturers of utility items prefer to have programs written in the C language
    because it has features that allow for flexibility; enhance efficiency; and which
    are compatible with many types of hardware.


    Why Bother Learning The C Programming Language?


    Is C the only programming language accessible to users today? Of course not! There
    are other programming languages that programmers and other computer users can
    learn and utilize, some low than C, and still some higher and more modern than
    C. So why C...? 


    There are other reasons for wanting to learn the C programming language, besides
    the ones already mentioned in this book. First of all, the C programming language
    existed long before many other computer languages were ever thought of. As such,
    it has built a rich source code base. In short, you can learn a lot and there
    is a rich pool of resources to tap from in this regard. C also has lots of functions
    that you can use to meet your program needs.


    At the same time, for the same reason that the C programming language has been
    in use for a long time, you are unlikely to find challenges in its use that you
    cannot get solutions to fast. Users of C have, over the years posted questions
    over the internet and received solutions from other users as well as experts,
    and you can learn a lot about C from those discussions. In addition, there are
    many tutorials provided free on the web, and those too make it relatively easy
    for someone with interest to learn the C language.


    Another plus for C is that it is the computer language that UNIX uses, and UNIX
    is among the leading computer software. Other great operating systems use the
    C programming language as well. For that reason, C has become more like the lingua
    franca of the programming world. It is also worthwhile noting that the way C expresses
    ideas makes it easy for users to appreciate them and also implement them with
    little or no support.


    Something else that would encourage you to learn the C programming language is
    that it has been the basis for other computer languages, and many other languages
    have picked something worthwhile from C. You will, for example, find some principles
    and some commands being in use in C and also in use in other computer languages.
    What this means that you can share tips with other programmers who use other languages
    and communicate easily with them too.


    # Chapter 2: Setting Up Your Local Environment


    It often helps to have a strategy when trying to learn something new. In the case
    of learning the C programming language, it is imperative that you proceed from
    the basics to the more complex aspects. That is why it is a good thing we began
    the book by laying out the beginnings of C and how it has helped build other programming
    languages.


    Preparing To Learn The C Programming Language


    It is a good idea to begin by downloading and then installing the compiler. The
    reason you need to do this early is so as to have a program that can interpret
    your C code, and converting it into computer friendly signals.


    Is there a universal compiler available?


    The answer is in the negative, as there are some programs that are suitable for
    Windows and not great with other operating systems, or great for Linux and not
    very good with other operating systems.


    Here are some helpful suggestions:


    *   Install Microsoft Visual Studio Express, or even MinGW, if your computer is
    running on Windows.


    *   Install XCode in case your computer is running on Mac


    *   Install gcc if your computer has Linux as the operating system'
