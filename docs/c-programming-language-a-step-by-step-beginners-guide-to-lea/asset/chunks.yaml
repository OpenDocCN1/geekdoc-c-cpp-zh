  raw: 'At this juncture, you need to learn how to go about saving your source code,
    and also running it. Remember we mentioned entering your source code so that your
    computer’s CPU can process it accordingly.


    The easy steps to follow:


    *   Get your text editor open, and then type in the source code that you have


    *   Next, save your file in the name of hello.c


    *   The next action is opening a command prompt and moving to the specific directory
    where you have just saved your file.


    *   Once there, type, gcc hello.c


    *   Tap enter after typing that and you will have compiled your code


    *   In case your process has been good and you have no errors within your code,
    you will be prompted to proceed to the line that follows. After this, you will
    see an executable file generated – a.out


    *   You now need to type a.out to have your program executed.


    *   Everything having gone well, you should be able to view your output – Hello
    learners! – displayed on your screen.


    *   So, basically, what you should be seeing on your screen is something like
    this:


    $ gcc hello.c


    $ ./a.out


    Hello, learners!


    Basic C Syntax


    For any process to work well, and for you to be able to issue the right commands,
    you should be able to identify every item for what it is. That will avoid confusion
    and minimize errors. For that reason, in C programming, you need identifiers.


    What, Exactly, Is An Identifier?


    In C language programming, an identifier helps you to locate a variable; a function;
    and any other item that you, as the user, may have defined.  You will see an identifier
    beginning with an alphabet – anywhere from A up to Z; and sometimes an underscore:
    ‘_’, which is then followed by a zero and sometimes letters or more underscores.
    Sometimes digits, anywhere from 0 to 9, may follow.


    Note:


    *   When using the C language programming, you cannot use punctuation like @,
    %, £, and such, within your identifiers.


    *   The C language is also case sensitive. In other words, the lower case cannot
    respond to the upper case situation. For example, learners and Learners are recognized
    as two entirely different identifiers.


    To make it more clear, below are some identifiers that are acceptable when using
    C:


    abc; hername30; a40c9; retVal; _temp; a


    In C language programming, there are some words that you cannot use at all whether
    as constants, as variables, or as identifier names. They are said to be reserved
    keywords.


    Reserved keywords in C include auto, else, long, switch, break, enum, register,
    typedef,  case, char, extern, float, return, short, union, unsigned, const, continue,
    for, goto, signed, sizeof, volatile, default, do, int, if, struct, static, packed,
    while and double.


    Use of White Space in C


    If there is a line that is entirely blank, the compiler automatically ignores
    it. Such a line is termed white space. However, white spaces are not restricted
    to blank spaces alone. They also include newline characters (e.g. \n) as well
    as tabs and comments.


    Does a white space accomplish anything in the C programming language? Yes, it
    does. It shows the end of one statement element and marks the beginning of another.
    In short, ordinarily a statement is made up of different parts, each carrying
    some meaning; and those parts combine within the statement to convey some information.
    For that information to be understood in the C language, and with precision, you
    need to input your text in a way that the compiler will identify each bit for
    what it is.


    Example:


    When you have an expression like int main, the only way the compiler is going
    to recognize int and main correctly is by having some whitespace character separating
    them. In such a case, space is the most commonly used. However, there are situations
    where you are at liberty to either use whitespace or leave it out altogether.


    Example:


    In the statement, dessert=cream + candy; //get the entire dessert, you can include
    some space between dessert and the equals sign or leave it out altogether. Likewise,
    you can put space between the equals sign and cream or leave it out. In such instances,
    you would be expected to use your discretion in a manner to enhance readability.
    Otherwise, whether you use the whitespace or not will not affect the way the compiler
    picks that part of the statement.


    Types Of Data In C


    Why is type important when it comes to a programming language? Well, there are
    different reasons, including the storage space some types occupy on your machine
    as opposed to others. In the C programming language, there are data types that
    represent variables whereas others are used to declare functions. The type of
    data does not just determine storage space but also the manner in which its bit
    pattern is understood during processing.


    Here are the main data types in C:


    (1) The basic


    The basic data type in C is also referred to as the primary data type.  It includes
    the arithmetic type, which is further categorized as integer, abbreviated as int;
    floating, usually represented as float; and character, usually represented by
    char and sometimes void. When void is specified, it means that no value is being
    returned or reflected; and as for the integer, they represent variables.


    Here is a simple table to demonstrate how the basic data type is categorized:


    | Basic/Primary Type of Data |


    | Character | Integer | Float | Void |


    |  | signed  | unsigned |  |  |


    | Char | Int | int | float |  |


    | signed char | short int | short int | double |  |


    | unsigned char | long int | long int | long double |  |


    |  |  |  |  |  |


    Note that the integer data type stores whole numbers. In this regard, taking a
    16-bit computer as an example, the signed int takes up two bytes; the unsigned
    int takes up two bytes; the signed short int takes up one byte; while the signed
    and unsigned long int take up space of four bytes each.


    When it comes to the float type of data, plain float takes up space of four bytes;
    the double takes up eight bytes; while the long double takes up ten bytes.


    And as for the character type of data, which basically stores the value of characters,
    signed char takes up space of just a byte, and the same case applies to the unsigned
    char.


    The void type of data ordinarily represents functions that produce no value whatsoever.
    Sometimes these are functions that do not accept any parameters.


    As has been noted, functions in the C language whose return type is void are those
    returning no value. Here is how they look like:


    void exit (int status)


    Again, there are those functions in C that accept no parameter. However, a function
    not accepting parameters can, nevertheless, accept void as in the example below:


    int rand(void)


    (2) Derived


    Under the derived type of data are functions; various data structures; and also
    pointers.


    What could pointers be?


    Well, a pointer happens to be a variable that has an address of another variable.
    It gives direction as to where that other variable is, helping to recall the contents
    of that other variable. You need to realize that pointers have nothing to do with
    object type. Take the following function, for example:


    void *malloc(size_t size)


    This function, which obviously has a pointer to no other value but void, is one
    that can always be casted to any type of data you have. Remember to always declare
    your pointer before beginning to use it for storage of whatever variable address
    you want. Below is a demonstration of the general form you use for pointer declaration:


    type *var-name;


    Type, in this case, stands for the base type of your pointer, which needs to be
    a valid data type used in the C language. var-name is the pointer variable’s name.
    You need to know that although the asterisk used is the same one you ordinarily
    use for multiplication, within the C language you use it to mark the designation
    of the variable as pointer.


    Real examples of pointer declarations:


    | int | *ip; | /*pointer to an integer*/ |


    | double | *dp; | /*pointer to a double*/ |


    | float | *fp; | /*pointer to a float*/ |'
