    \ also accepts an array of pointers. |\n\n|  \n\n1.  Returning pointer from function\n\
    \n | This involves allowing a function to actually return a pointer to a variable\
    \ that is local, static, and one with memory that is dynamically allocated. |\n\
    \nClarification of Pointer to Pointer\n\nThis is a case of having pointers in\
    \ a form of chain. Ordinarily what you have is a pointer with a variable address.\
    \ However, with a case of pointer to pointer, the pointer you create first has\
    \ an address of your second pointer. That second pointer, in turn, has the location\
    \ where the actual value you want is. You are required to always declare when\
    \ you have a pointer to pointer variable. And how do you do that? Well, you add\
    \ one more asterisk next to the usual one that you place before the pointer name.\
    \ Then you end up with something like this:\n\nint **var;\n\nStill, what, exactly,\
    \ are Variables?\n\nVariables come up often in conversation, and they appear in\
    \ many functions, not least in the C language. When it comes to the C programming\
    \ language, a variable is simply a representative of storage area. It is the place\
    \ where programs in C perform their manipulations. Practically, you can use variables\
    \ to store various data value. Variables are different from constants because\
    \ as you execute your program in the C language, you can alter your variables,\
    \ something you cannot do with constants. During programming, you may give your\
    \ variables names that have ordinary meaning, like height or weight; age; average;\
    \ and such.\n\nIt is important to note that variables are of specific types and\
    \ the type of each determines its memory size as well as its layout. It also determines\
    \ the value range that can be accommodated within the memory. The variable type\
    \ also determines the particular operations that you can apply to the variable\
    \ in question.\n\nHow do variables look like? Well, they come in form of digits;\
    \ also letters, as well as the underscore.  And you need to declare them before\
    \ you begin using your program for two major reasons:\n\na)  So that the compiler\
    \ can recognize the name of the variable\n\nb)  So that it can be aptly categorized\
    \ – given its appropriate data type\n\nAlso when defining a variable in the C\
    \ language, you need to follow some stringent rules.\n\nVariable related rules:\n\
    \n*   Provide a variable name that does not exceed eight characters\n\n*   The\
    \ name you provide should not have a digit at the beginning\n\n*   Do not include\
    \ blanks or any space within your chosen variable name\n\n*   Use digits or alphabets;\
    \ and even special symbols such as underscore (_) as you wish in creating a variable\
    \ name.\n\n*   You cannot use keywords to represent variable names\n\nIn fact,\
    \ whenever you are declaring names of variables or for functions, or you are declaring\
    \ your constants, be keen not to include a C keyword.\n\nIncidentally, what are\
    \ keywords within the C programming language?\n\nThe C keywords are grouped as\
    \ auto, double, int and struct. Normally, the compiler will do the categorizations\
    \ of the keywords, the keywords essentially making part of the C syntax. C keywords\
    \ are actually pre-defined and so you just need to know which ones they are.\n\
    \nTake the example: int cash\n\nCash happens to be the variable, and its type\
    \ is integer. The keyword indicating cash then is int.\n\nWhat You Need To Know\
    \ About Keywords In C:\n\n1  In C, keywords are also referred to as reserved words.\n\
    \n2  The keywords used in C are 32 in number.\n\n3  You need to learn the specific\
    \ C keywords so that you do not use them as variables in functions.\n\n4  When\
    \ using a C keyword, you are required to assume the meaning the compiler has provided\
    \ or defined for that keyword.\n\nHere are the 32 keywords used in C programming:\n\
    \nauto\n\nThe C keywords under auto are specifically break; case; char; const;\
    \ continue; default; as well as do. These plus auto make a total of eight.\n\n\
    double\n\nUnder double are the keywords else; enum; extern; float; for; goto as\
    \ well as if. These plus double make a total of eight.\n\nint\n\nThe C keywords\
    \ under int are long; register; return; short; signed; sizeof; as well as static.\
    \ These ones plus int make a total of eight.\n\nstruct\n\nThe C keywords under\
    \ struct are specifically switch; typedef; union; unsigned; void; volatile; as\
    \ well as while. These keywords plus struct add up to eight.\n\n# Chapter 4: C\
    \ Constants and Literals\n\nIn the C programming language, the term literal can\
    \ also be used in place of constant. Now, what, exactly, is a constant in the\
    \ context of C programming? Well, it is the term used for a fixed value in the\
    \ data being entered in the program, which the program cannot alter in the course\
    \ of execution. Constants come in all data types – floating, character, integer\
    \ and even string. You can also find constants of enumeration.\n\nWhen it comes\
    \ to actual C programming, you use constants in the same way you use regular variables;\
    \ only that with constants you would not be able to modify their values after\
    \ you have defined them.\n\nWhat would happen if you tried to alter the value\
    \ of a constant? Simple: The program will return an error message. After clarifying\
    \ the nature of constants, let us go through some basic rules that will help in\
    \ using them.\n\nRules to observe in constructing constants in C:\n\n(1) Integer\
    \ Constants\n\na.  Every integer constant needs to have a digit\n\nb.  No integer\
    \ constant should have a decimal\n\nc.  It is alright for an integer constant\
    \ to be either positive or even negative\n\nd.  You must not add a comma or even\
    \ a blank anywhere within your integer constant\n\ne.  Whenever there is no sign\
    \ preceding an integer constant, the assumption is that the constant is positive\n\
    \nf.  For the sake of processing in your computer program, when you are selecting\
    \ your integer constants, the range you have to work with is from -32768 to 32767.\n\
    \n(2) C language real constants\n\nIncidentally, these are the same ones we referred\
    \ to earlier as floating point constants.\n\na.  Each of them also needs at least\
    \ a single digit\n\nb.  It is also necessary that it contains a decimal\n\nc. \
    \ Just like with integer constants, it is acceptable as positive or negative\n\
    \nd.  Here too, in case you do not put a sign before the constant, it is interpreted\
    \ as being positive\n\ne.  And as for commas and blanks, here too they are not\
    \ acceptable.\n\n(3) Character constants\n\n1.  This one comes in singular: one\
    \ alphabet, one digit, or even one special symbol. In short, its length is always\
    \ one character."
