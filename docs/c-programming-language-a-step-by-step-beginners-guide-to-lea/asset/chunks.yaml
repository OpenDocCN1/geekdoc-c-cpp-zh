    \ memory size : 20\n```\n\n## How To Access Union Members\n\n为了访问联合体（`union`）的成员，需要使用所谓的**成员访问运算符**。虽然听起来有点技术性，但理解起来很简单：它就是一个小数点（`.`）。这个小数点位于联合体变量名和要访问的特定联合体成员之间。在定义联合类型变量时，需要使用的关键字是\
