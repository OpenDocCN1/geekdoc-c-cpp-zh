    # USING A BUBBLE SORT


    A bubble sort is one of the easiest sorting techniques to understand. However,
    while it is logically simple, it is not very efficient. If the list contains n
    values, the bubble sort will make n - 1 passes over the list. For example, if
    the list contains 100 values, the bubble sort will make 99 passes over the data.
    During each pass, it examines successive overlapped pairs and swaps or exchanges
    those values that are out of order. After one pass over the data, the heaviest
    (largest) value has sunk to the bottom and is in the correct position in the list.


    In *Programming Logic and Design, Fifth Edition*, you learned several ways to
    refine the bubble sort algorithm. One way is to reduce unnecessary comparisons
    by ignoring the last value in the list in the second pass through the data because
    you can be sure the last value is already positioned correctly. On the third pass,
    you can ignore the last two values in the list because you know they are already
    positioned correctly. Thus, in each pass, you can reduce the number of items to
    be compared, and possibly swapped, by one.


    Another refinement to the bubble sort is to eliminate unnecessary passes over
    the data in the list. When items in the array to be sorted are not entirely out
    of order, it may not be necessary to make n - 1 passes over the data because after
    several passes, they may already be in order. You can add a flag variable to the
    bubble sort program, and then test the value of that flag variable to determine
    whether any swaps have been made in any single pass over the data. If no swaps
    have been made, you know that the list is in order, and therefore you do not need
    to continue with additional passes.


    In *Programming Logic and Design, Fifth Edition* and in this book, you have learned
    about using a constant for the size of the array to make your logic easier to
    understand and your programs easier to change and maintain. Finally, you have
    learned how to sort a list of varying size by counting the number of items placed
    in the array as you read items.


    All of these refinements are included in the pseudocode for the score sorting
    program in Figure 9-1. The C++ code that implements the score sorting logic is
    provided in Figure 9-2. The line numbers shown in Figure 9-2 are not part of the
    C++ code. They are provided for reference only.'
