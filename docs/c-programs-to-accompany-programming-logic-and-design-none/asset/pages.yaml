    \ \"whole\")\n    // code written here executes if true\nelse\n    // code written\
    \ here executes if false\n~~~\n```\n\n# # DECISION STATEMENTS\n\nEvery decision\
    \ in a program is based on whether an expression evaluates to `true` or `false`.\
    \ Programmers use decision statements to change the flow of control in a program.\
    \ **Flow of control** means the order in which statements are executed. Decision\
    \ statements are also known as branching statements because they cause the computer\
    \ to make a decision, choosing from one or more branches (or paths) in the program.\n\
    \nThere are different types of decision statements in C++. We will begin with\
    \ the `if` statement.\n\n# ## THE IF STATEMENT\n\nThe `if` statement is a single-path\
    \ decision statement. As you learned in *Programming Logic and Design, Fifth Edition*,\
    \ `if` statements are also referred to as “single alternative” or “single-sided”\
    \ statements.\n\nWhen we use the term “single-path,” we mean that if an expression\
    \ evaluates to `true`, your program executes one or more statements; but if the\
    \ expression evaluates to `false`, your program will not execute these statements.\
    \ There is only one defined path—the path taken if the expression evaluates to\
    \ `true`. In either case, the statement following the `if` statement is executed.\n\
    \nThe syntax, or set of rules, for writing an `if` statement in C++ is as follows:\n\
    \n```\n~~~cpp\nif (expression)\n    statementA;\n~~~\n```\n\nNote that when you\
    \ type the keyword `if` to begin an `if` statement, you follow it with an expression\
    \ placed within parentheses.\n\nWhen the compiler encounters an `if` statement,\
    \ the expression within the parentheses is evaluated. If the expression evaluates\
    \ to `true`, then the computer executes `statementA`. If the expression in parentheses\
    \ evaluates to `false`, then the computer will not execute `statementA`. Remember\
    \ that whether the expression evaluates to `true` and executes `statementA`, or\
    \ the expression evaluates to `false` and does not execute `statementA`, the statement\
    \ following the `if` executes next.\n\nNote that a C++ statement, such as an `if`\
    \ statement, can be either a simple statement or a block statement. A **block**\
    \ statement is made up of multiple C++ statements. C++ defines a"
