- pgno: 46
  md: "function. So to start the number-doubling program, we will first create a function\
    \ named `main` because it is always the first function that executes in a C++\
    \ program. Thus, the code that follows starts the number-doubling program by creating\
    \ a `main` function:\n\n```\n```cpp\nint main()\n{\n}\n```\n```\n\n> **NOTE**\
    \ If you are typing the code as it is presented here, remember to save the program\
    \ in a file that has an appropriate name, such as `NumberDouble.cpp`.\n\nThe next\
    \ line of the pseudocode instructs you to get the `inputNumber`. In other words,\
    \ you need to write the input statement that primes the loop. You learned about\
    \ priming read statements in Chapter 2 of *Programming Logic and Design, Fifth\
    \ Edition*. In Chapter 2 of this book, you learned how to use interactive input\
    \ statements in programs to allow the user to input data. You also learned to\
    \ prompt the user to explain what the program expects to receive as input. The\
    \ following example includes the code that implements the priming read by displaying\
    \ a prompt for the user and then retrieving the number the user wants to be doubled.\n\
    \nNote that the code in boldface has been added to the number-doubling program.\
    \ If you were writing this code yourself, you would start by writing the code\
    \ for the number-doubling program as shown above, and then edit it to add the\
    \ boldface code shown here:\n\n```\n```cpp\nint main()\n{\n    cout << \"Enter\
    \ a number to double: \" << endl;\n    cin >> inputNumber;\n}\n```\n```\n\nNext,\
    \ the pseudocode instructs you to begin a `while` loop with `eof` (end of file)\
    \ used as the condition to exit the loop.\n\nSince we are using interactive input\
    \ in this program, it requires no eof marker. Instead we will use the number 0\
