    \n# USING A DERIVED CLASS IN A C++ PROGRAM\n\nNow that the derived Automobile\
    \ class is defined, you can use it in a C++ program. The C++ program (`MyAutomobileClassProgram.cpp`)\
    \ shown in Figure 10-9 includes a comment on line 1. Line 2 includes the file,\
    \ `Automobile.cpp`, that contains the Automobile class definition, line 3 includes\
    \ `<iostream>`, and the `using` statement is on line 4. An Automobile object (`automobileOne`)\
    \ is then created on line 7 and a `bool` variable (`convertible`) is declared\
    \ on line 8.\n\n```\n```cpp\n// This program uses the programmer-defined Automobile\
    \ class.\n#include \"Automobile.cpp\"\n#include <iostream>\nusing namespace std;\n\
    int main()\n{\n    Automobile automobileOne;\n    bool convertible;\n\n    automobileOne.setMaxSpeed(100.0);\n\
    \    automobileOne.setSpeed(35.0);\n    automobileOne.accelerate(10.0);\n    cout\
    \ << \"The current speed is \" << automobileOne.getSpeed() << endl;\n\n    automobileOne.accelerate(60.0);\n\
    \    cout << \"The current speed is \" << automobileOne.getSpeed() << endl;\n\n\
    \    automobileOne.setConvertibleStatus(true);\n    convertible = automobileOne.getConvertibleStatus();\n\
    \n    if(convertible == true)\n        cout << \"This automobile is a convertible\"\
    \ << endl;\n    else\n        cout << \"This automobile is not a convertible\"\
    \ << endl;\n\n    return 0;\n}\n```\n```\n\n**Figure 10-9** `MyAutomobileClassProgram`\
    \ that uses the Automobile class"
