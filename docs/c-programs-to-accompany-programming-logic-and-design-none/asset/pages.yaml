    \ special meaning. To understand the keyword `int` you need to know that functions\
    \ often send values back to a calling function (for example, the result of a calculation),\
    \ which can then be used elsewhere in the program. Another way to say this is\
    \ that functions sometimes return a value. In Figure 1-1, the keyword `int` indicates\
    \ that the `main` function returns an integer. You will learn more about functions\
    \ returning values in Chapter 7 of this book.\n\nThe opening curly brace `{}`\
    \ on the fourth line of Figure 1-1 marks the beginning of the body of the `main`\
    \ function and the closing curly brace `{}` on the last line of Figure 1-1 marks\
    \ the end of the `main` function. All the code within this pair of curly braces\
    \ executes when the `main` function executes. In Figure 1-1, there are two lines\
    \ of code between the curly braces. The first is:\n\n```\n```cpp\ncout << \"Hello\
    \ World\" << endl;\n```\n```\n\nThis is the line that causes the words `Hello\
    \ World` to appear on the user’s screen. This line consists of multiple parts.\
    \ The first part, `cout`, is the name of an object that represents the user’s\
    \ screen. Next, you see `<<` which is called the **insertion** or **output** operator.\
    \ You use `cout` and `<<` to output what follows, which in this example is the\
    \ string constant `\"Hello World\"`. (The quotation marks will not appear on the\
    \ screen, but they are necessary to make the program work.) After `\"Hello World\"\
    ` you see another `<<` which causes `endl` to be displayed (after `Hello World`)\
    \ on the user’s screen. For now, think of `endl` as a **newline** that causes\
    \ the cursor to be positioned on the line after `Hello World`. You will learn\
    \ more about `endl` in Chapter 9 of this book. Note that the semicolon that ends\
    \ the `cout << \"Hello World\" << endl;` statement is required because it tells\
    \ the compiler that this is the end of the statement.\n\n> **NOTE**  \n> Don’t\
    \ confuse the last character in `endl`, `l` (ell), with the digit `1` (one).\n\
    \nThe next line of code is `return 0;`. This statement instructs the compiler\
    \ to return the value 0 from the `main` function. Remember, when you saw the header\
    \ for the `main` function on the third line of this program, you used the keyword\
    \ `int` to specify that the `main` function returns an integer; 0 is the returned\
    \ integer. Conventionally, when a program returns a 0, it means “everything went\
    \ well and the program is finished.”\n\nNext, you learn about the C++ development\
    \ cycle so that later in this chapter, you can compile the Hello World program\
