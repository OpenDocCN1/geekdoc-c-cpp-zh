    \ is the next one to execute.\n\nThe C++ code sample that follows illustrates\
    \ a nested if statement.\n\n```\n```cpp\nif(empDept <= 3)\n    supervisorName\
    \ = \"Dillon\";\nelse if(empDept <= 7)\n    supervisorName = \"Escher\";\nelse\n\
    \    supervisorName = \"Fontana\";\ncout << \"Supervisor: \" << supervisorName\
