  md: "# USING A SENTINEL VALUE TO CONTROL A LOOP\n\nAs you learned in Chapter 2 of\
    \ *Programming Logic and Design, Fifth Edition*, a **sentinel value** is a value\
    \ such as “Y” or “N” that a user must supply to stop a loop. To learn about sentinel\
    \ values in C++, we will look at a program discussed in Chapter 5 of *Programming\
    \ Logic and Design, Fifth Edition*. The program displays a bank customer’s current\
    \ bank balance, and then asks if the user wants to calculate the customer’s balance\
    \ after one year of interest has accumulated. Each time the user indicates he\
    \ or she wants to continue, an increased balance appears. When the user indicates\
    \ he or she is done, the program ends. This program includes a while loop and\
    \ uses a sentinel value to determine when the loop executes or when the loop is\
    \ exited. The pseudocode is shown below:\n\n```\nstart\n    num bankBal\n    num\
    \ intRate\n    string response\n    print \"Enter your starting balance... \"\n\
    \    get bankBal\n    print \"Enter your interest rate... \"\n    get intRate\n\
    \    print \"Do you want to see your current balance? Y or N . . .\"\n    get\
    \ response\n    while response = 'Y'\n        print \"Bank balance is \" bankBal\n\
    \        bankBal = bankBal + bankBal * intRate\n        print \"Do you want to\
    \ see next year's balance? Y or N . . .\"\n        get response\n    endwhile\n\
    \    print \"Have a nice day!\"\nstop\n```\n\nNote that a priming read is included\
