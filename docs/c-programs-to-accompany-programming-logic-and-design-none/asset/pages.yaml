  md: "![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_23_0.png)\n\nLet’s begin by learning\
    \ about Step 1, writing the C++ source code.\n\n# WRITING C++ SOURCE CODE\n\n\
    As you learned in the previous section, you write a C++ program by creating a\
    \ function named main that contains C++ statements. But what do you use to write\
    \ the program, and where do you save it?\n\nOne method you can use to write a\
    \ C++ program is to use a text editor, such as the Windows text editor, Notepad.\
    \ You can use any text editor, but the steps in this book assume you are using\
    \ Notepad. To start Notepad, click the Start button, select Programs or All Programs,\
    \ select Accessories, and then select Notepad. Once Notepad starts, you simply\
    \ type in your C++ source code. **Source code** is the name used for the statements\
    \ that make up a C++ program. For example, the code shown earlier in Figure 1-1\
    \ is source code.\n\nWhen you save the file that contains the source code, it\
    \ is important to give the file a meaningful name, and then add the extension\
    \ `.cpp`. For the Hello World program, an appropriate name for the source code\
    \ file is `HelloWorld.cpp`. Of course, it is also important to remember the location\
    \ of the folder in which you choose to save your source code file.\n\nYou move\
    \ on to Step 2 of the C++ development cycle after saving your source code file.\
    \ In Step 2, you compile the source code.\n\n# COMPILING A C++ PROGRAM\n\nThe\
    \ Visual C++ compiler is named `cl`. It is a program that is responsible for a\
    \ two-step process that takes your source code and transforms it into object code\
    \ and then links the object code to create executable code.\n\n> **NOTE**  \n\
    > The Visual C++ compiler, `cl`, is actually a compiler and a linker.\n\n**Object\
    \ code** is code in computer-readable form that is linked with libraries to create\
