  md: "# # FEATURES OF THE TEXT\n\nEvery chapter in this book includes the following\
    \ features. These features are both conducive to learning in the classroom and\
    \ enable students to learn the material at their own pace.\n\n+   » **Objectives:**\
    \ Each chapter begins with a list of objectives so the student knows the topics\
    \ that will be presented in the chapter. In addition to providing a quick reference\
    \ to topics covered, this feature provides a useful study aid.\n+   \n+   » **Figures\
    \ and illustrations:** This book has plenty of visuals, which provide the reader\
    \ with a more complete learning experience, rather than one that involves simply\
    \ studying text.\n+   \n+   » **Notes:** These notes provide additional information—for\
    \ example, a common error to watch out for.\n+   \n+   » **Exercises:** Each section\
    \ of each chapter includes meaningful paper and pencil exercises that allow students\
    \ to practice the skills and concepts they are learning in the section.\n+   \n\
    +   » **Labs:** Each section of each chapter includes meaningful lab work that\
    \ allows students to write and execute programs that implement their logic and\
    \ program design.\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_14_0.png)\n\n# #\
    \ ACKNOWLEDGMENTS\n\nI would like to thank all of the people who helped to make\
    \ this book possible, especially Ann Shaffer, Developmental Editor, whose expertise\
    \ and attention to detail have made this a better textbook. She also provided\
    \ encouragement, patience, humor, and flexibility when needed. Thanks also to\
    \ Tricia Coia, Managing Editor, for her help and encouragement. It is a pleasure\
    \ to work with these fine people who are dedicated to producing quality instructional\
    \ materials.\n\nI am grateful to the many reviewers who provided helpful and insightful\
    \ comments during the development of this book, including Matthew Alimagham, Spartanburg\
    \ Community College; Ruth Tucker Bogart, University of Phoenix – Online; Fred\
    \ D’Angelo, Pima Community College; and Robert Dollinger, University of Wisconsin\
    \ – Stevens Point.\n\nI am dedicating this book to all of the teachers I have\
    \ had the honor to know.\n\nJo Ann Smith\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_14_1.png)"
