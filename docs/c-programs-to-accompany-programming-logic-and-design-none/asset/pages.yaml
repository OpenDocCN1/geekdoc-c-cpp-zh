    # WRITING DATA TO AN OUTPUT FILE


    Once you have opened the output file, you are ready to write data to the file.
    You can use the insertion operator `<<` just as you used it with `cout`.


    As an example, assume that an employee''s `firstName`, `lastName`, and `salary`
    have been read from an input file as in the previous example, and that the employee
    is to receive a 15% salary increase that is calculated as follows:


    ```

    ~~~cpp

    const double INCREASE = 1.15;

    double newSalary;

    newSalary = salary * INCREASE;

    ~~~

    ```


    You now want to write the employee''s `firstName`, `lastName`, and `newSalary`
    to the output file named `outputFile.dat`. The code that follows accomplishes
    this task:


    ```

    ~~~cpp

    ofstream data_out;

    data_out.open("outputFile.dat");

    data_out << firstName << endl;

    data_out << lastName << endl;

    data_out << newSalary << endl;

    data_out.close();

    ~~~

    ```


    The last line in the previous example uses `data_out` and the `close` method to
    close the output file. It is a good programming practice to close input and output
    files when they'
