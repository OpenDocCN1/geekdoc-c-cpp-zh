  md: "# WRITING PROGRAMS USING LOOPS\n\n> **NOTE** If `testTotal` is not initialized,\
    \ it may contain an unknown value referred to as a “garbage” value. The C++ compiler\
    \ issues a warning message for uninitialized variables.\n\n```\n```cpp\n{\n  \
    \  // Input student test score\n    cout << \"Enter student's score: \";\n   \
    \ cin >> testScore;\n    // Accumulate total of test scores\n    testTotal +=\
    \ testScore;\n}\n// Calculate average test score\naverage = testTotal / stuCount;\n\
    // Output number of students and average test score\ncout << \"Number of Students:\
    \ \" << stuCount << endl;\ncout << \"Average Test Score: \" << average << endl;\n\
    return 0;\n}\n```\n```\n\nIn the code you use the `cout` statement to ask your\
    \ user to tell you how many students took the test. Then you use `cin` to retrieve\
    \ the user input and store it in the variable named `numStudents`. Next, the accumulator,\
    \ `testTotal`, is initialized to 0.\n\nAfter the accumulator is initialized, the\
    \ code uses a `for` loop and the loop control variable, `stuCount`, to control\
    \ the loop. A `for` loop is a good choice because, at this point in the program,\
    \ you know how many times the loop should execute. You use the `for` loop’s first\
    \ expression to initialize `stuCount`, and then the second expression is evaluated\
    \ to see if `stuCount` is less than `numStudents`. If this is true, the body of\
    \ the loop executes, using `cout` and `cin` again, this time asking the user to\
    \ enter a test score and retrieving the input and storing it in `testScore`.\n\
    \n> **NOTE** You must calculate the average outside of the loop, not inside the\
    \ loop. The only way you could calculate the average inside the loop is do it\
    \ each time the loop executes, but this is inefficient.\n\nNext, you must add\
    \ the value of `testScore` to the accumulator, `testTotal`. The loop control variable,\
    \ `stuCount`, is then incremented, and the incremented value is tested to see\
    \ if it is less than `numStudents`. If this is true again, the loop executes a\
    \ second time. The loop continues to execute until the value of `stuCount < numStudents`\
    \ is false. Outside the `for` loop, you calculate the average test score by dividing\
    \ `testTotal` by `stuCount`.\n\n> **NOTE** If a user enters a 0, meaning 0 students\
    \ took the midterm, the `for` loop does not execute because the value of `numStudents`\
    \ is 0 and the value of `stuCount` is also 0, and the first time the second expression\
    \ in the `for` loop is evaluated, it is false.\n\nThe entire C++ program is saved\
    \ in a file named `TestAverage.cpp`. You may want to study the source code, compile\
    \ it, and execute the program to experience how accumulators and counters behave.\
    \ The output from this program with five students whose test scores are 76, 65,\
    \ 88, 90, and 92 is displayed in Figure 5-3."
