  md: "# EXERCISE 10-2: USING INHERITANCE TO CREATE A DERIVED CLASS IN C++\n\nIn this\
    \ exercise, you use what you have learned about using inheritance to create a\
    \ derived class to answer some questions.\n\n+   1. Which line of code is used\
    \ to create a derived class named SubWidget from a base class named Widget?\n\
    +   \n+      a. `class Widget : public SubWidget`\n+   \n+      b. `class SubWidget\
    \ : base public Widget`\n+   \n+      c. `class Widget : derived public SubWidget`\n\
    +   \n+      d. `class SubWidget : public Widget`\n\n+   2. An advantage of using\
    \ inheritance is:\n+   \n+      a. It maximizes the number of functions.\n+  \
    \ \n+      b. It allows reuse of code.\n+   \n+      c. It requires no coding.\n\
    \n+   3. True or False. The methods in a derived class have direct access to the\
    \ base class private data members.\n\n+   4. True or False. A derived class may\
    \ add new methods or override existing methods when inheriting from a base class.\n\
    \n# LAB 10-2: USING INHERITANCE TO CREATE A DERIVED CLASS IN C++\n\nIn this lab,\
    \ you create a derived class from a base class and then use the derived class\
    \ in a C++ program. The program should create two Motorcycle objects and then\
    \ set the Motorcycle’s speed, accelerate the Motorcycle object, and check its\
    \ status. Use the Vehicle and Automobile classes that you worked with earlier\
    \ in this chapter as a guide.\n\n+   1. Open the file named Motorcycle.cpp using\
    \ Notepad or the text editor of your choice.\n+   \n+   2. Create the Motorcycle\
    \ class by deriving it from the Vehicle class. Use a public derivation.\n+   \n\
    +   3. In the Motorcycle class, create a private attribute named sidecar. The\
    \ sidecar attribute should be data type bool."
  merge: -1
  img_proc: true
