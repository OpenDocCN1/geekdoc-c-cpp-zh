  md: "comparison `num < NUM_TIMES` is made for the first time when the value of num\
    \ is 0. The 0 is compared to, and found to be less than, 3, which means the condition\
    \ is true, and the text “Welcome to C++ Programming.” is displayed for the first\
    \ time. The next statement, `num++;`, causes 1 to be added to the value of num.\
    \ The second time the comparison is made, the value of num is 1, which is still\
    \ less than 3, and causes the text to appear a second time followed by adding\
    \ 1 to the value of num. The third comparison also results in a true value because\
    \ the value of num is now 2, and 2 is still less than 3; as a result, the text\
    \ appears a third time and num is incremented again. The fourth time the comparison\
    \ is made, the value of num is 3, which is not less than 3; as a result, the program\
    \ exits the loop.\n\nThe loop in the next code example produces the same results\
    \ as the previous example. The text “Welcome to C++ Programming.” is displayed\
    \ three times.\n\n```\n```cpp\nconst int NUM_TIMES = 3;\nnum = 0;\nwhile (num++\
    \ < NUM_TIMES)\n    cout << \"Welcome to C++ Programming.\" << endl;\n```\n```\n\
    \nBe sure you understand why the postfix increment operator is used in the expression\
    \ `num++ < NUM_TIMES`.\n\nThe first time this comparison is made, the value of\
    \ num is 0. The 0 is then compared to, and found to be less than, 3, which means\
    \ the condition is true, and the text “Welcome to C++ Programming.” is displayed.\n\
    \nThe second time the comparison is made, the value of num is 1, which is still\
    \ less than 3, which causes the text to appear a second time. The third comparison\
    \ also results in a true value because the value of num is now 2, and 2 is still\
    \ less than 3; as a result, the text appears a third time. The fourth time the\
    \ comparison is made, the value of num is 3, which is not less than 3; as a result,\
    \ the program exits the loop.\n\nIf the prefix increment operator is used in the\
    \ expression `++num < NUM_TIMES`, the loop executes twice instead of three times.\
    \ The loop executes twice because the first time this comparison is made, num\
    \ is incremented before the comparison is done. This results in num having a value\
    \ of 1 the first time “Welcome to C++ Programming.” is displayed and a value of\
    \ 2 the second time it is displayed. Then, when the value of num is 3, the condition\
    \ is `false`, causing the program to exit the loop. This time, “Welcome to C++\
    \ Programming.” is not displayed.\n\n> **NOTE:** When you use the postfix increment\
    \ operator, the value of num is not incremented until after the comparison is\
    \ made.\n\n> **NOTE:** Failing to learn the difference between the prefix and\
    \ postfix forms of the increment and decrement operators can result in serious\
    \ program errors.\n\n# EXERCISE 5-2: USING A WHILE LOOP\n\nIn this exercise, you\
    \ use what you have learned about writing `while` loops to study the following\
    \ code and then answer the subsequent questions.\n\nFirst, study the C++ code:\n\
    \n```\n```cpp\nconst int NUM_LOOPS = 5;\nint numTimes = NUM_LOOPS;\nwhile (numTimes++\
    \ < NUM_LOOPS)\n    cout << \"Value of numTimes is \" << numTimes << endl;\n```\n\
    ```"
