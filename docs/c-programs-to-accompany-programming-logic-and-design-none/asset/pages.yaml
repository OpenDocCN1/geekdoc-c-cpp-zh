  md: "# READ THIS BEFORE YOU BEGIN\n\n# UPDATING YOUR PATH ENVIRONMENT VARIABLE\n\
    \n+   » Setting the PATH variable allows you to use the compiler (cl) and execute\
    \ your programs without having to specify the full path for the command.\n+  \
    \ \n+   » To set the PATH permanently in Windows XP and Vista:\n+      1. Open\
    \ the Control Panel, and then double click **System**.\n+      2. In Windows XP,\
    \ select the **Advanced** Tab and then click the **Environment Variables** button.\
    \ In Windows Vista, click the **Advanced system settings** link, click **Continue**\
    \ in the User Account Control window, and then click the **Environment Variables**\
    \ button.\n+      3. Look for “PATH” or “Path” in the User variables or System\
    \ variables area. Select **PATH** or **Path**, click **Edit**, and then edit the\
    \ PATH variable by adding ;C:\\Program Files\\Microsoft Visual Studio 9.0\\vc\\\
    bin. If you are not sure where to add the path, add it to the right end of the\
    \ “PATH”. A typical PATH might look like this: C:\\Windows;C:\\Windows\\Command;C:\\\
    Program Files\\Microsoft Visual Studio 9.0\\vc\\bin.\n+   \n+   » Capitalization\
    \ does not matter when you are setting the PATH variable. The PATH is a series\
    \ of folders separated by semi-colons (;). Windows searches for programs in the\
    \ PATH folders in order, from left to right.\n+   \n+   » To find out the current\
    \ value of your PATH, open a Command Prompt window, type: **path** and then press\
    \ **Enter**\n+   \n+   » Once your PATH is set, you must execute the following\
    \ command in a Command Prompt window to set the environment variables for the\
    \ Visual C++ compiler: type **vcvars32** and then press **Enter**\n\n# TO THE\
    \ INSTRUCTOR\n\nTo complete some of the Exercises and Labs in this book, your\
    \ students must use the data files provided with this book. These files are available\
    \ on the Course Technology Web site at *www.course.com*. Follow the instructions\
    \ in the Help file to copy the data files to your server or standalone computer.\
    \ You can view the Help file using a text editor such as WordPad or Notepad. Once\
    \ the files are copied, you may instruct your students to copy the files to their\
    \ own computers or workstations.\n\n# COURSE TECHNOLOGY DATA FILES\n\nYou are\
    \ granted a license to copy the data files to any computer or computer network\
    \ used by individuals who have purchased this book."
