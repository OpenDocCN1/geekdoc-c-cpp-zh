  md: '# ADDING METHODS TO A CLASS


    The next step is to add methods to the `Employee` class. The pseudocode versions
    of these methods, shown on lines 6 through 27 in Figure 10-1, are nonstatic methods.
    As you learned in Chapter 11 of *Programming Logic and Design, Fifth Edition,
    Comprehensive*, **nonstatic methods** are methods that are meant to be used with
    an object created from a class. In other words, to use these methods, we must
    create an object of the `Employee` class first and then use that object to **invoke**
    (or call) the method.


    The code shown in Figure 10-2 shows how to include methods in the `Employee` class
    using C++. We will start the discussion with the set methods. You learned in *Programming
    Logic and Design, Fifth Edition, Comprehensive* that **set methods** are those
    whose purpose is to set the values of attributes (data fields) within the class.
    There are three data fields in the `Employee` class but we will only add two set
    methods: `setLastName` and `setHourlyWage`. We will not add a `setWeeklyPay` method
    because the `weeklyPay` data field will be set by the `setHourlyWage` method.
    The `setHourlyWage` method uses another method, `calculateWeeklyPay`, to accomplish
    this.


    The `setLastName` method is shown on lines 19 through 23 in Figure 10-2, and the
    `setHourlyWage` method is shown on lines 24 through 29. Also notice that these
    two methods are declared in the public section of the class on lines 7 and 8.
    The public section of the class is specified by using the keyword `public` followed
    by a colon on line 6. Including methods in the **public** section means that programs
    may use these methods to gain access to the **private** data. The `calculateWeeklyPay`
    method, shown on lines 42 through 47 in Figure 10-2, is private, which means it
    can only be called from within another method that already belongs to the class.
    Notice that the `calculateWeeklyPay` method is declared in the private section
    in the `Employee` class on line 16. The `calculateWeeklyPay` method is called
    from the `setHourlyWage` method (line 27), and ensures that the class retains
    full control over when and how the `calculateWeeklyPay` method is used.


    The `setLastName` method (lines 19 through 23) begins with the keyword `void`,
    followed by the name of the class, `Employee`, followed by the scope resolution
    operator (`::`), followed by the name of the method, `setLastName`. The **scope
    resolution operator** is used to associate the method with the class. In this
    case, the `setLastName` method is associated with the `Employee` class. The `setLastName`
    method accepts one argument, `string name`, that is assigned to the private attribute
    `lastName`. This sets the value of `lastName`. The `setLastName` method is a void
    method—that is, it returns nothing. Notice that the declaration of the `setLastName`
    method on line 7 agrees with the method definition; that is, both specify a return
    value of `void` and a single `string` argument.


    The `setHourlyWage` method (lines 24 through 29) accepts one argument, `double
    wage`, that is assigned to the private attribute `hourlyWage`. This sets the value
    of `hourlyWage`. Next, it calls the private method `calculateWeeklyPay` on line
    27. The `calculateWeeklyPay` method does not accept arguments. Within the method,
    on line 44, a constant, `const int WORK_WEEK_HOURS`, is declared and initialized
    with the value 40. The `calculateWeeklyPay` method then calculates weekly pay
    (line 45) by multiplying the private attribute `hourlyWage` by `WORK_WEEK_HOURS`.
    The result is assigned to the private attribute `weeklyPay`.'
