  md: "Business applications typically have to manipulate large amounts of data. This\
    \ data is stored in one or more files. As you learned in Chapter 1 of *Programming\
    \ Logic and Design, Fifth Edition*, data is organized in a hierarchy. At the lowest\
    \ level of the hierarchy is a **field**, which is a group of characters. On the\
    \ next level up is a **record**, which is a group of related fields. For example,\
    \ you could write a program that processes employee records where each employee\
    \ record consists of three fields: the employee’s first name, the employee’s last\
    \ name, and the employee’s department number.\n\nIn C++, to use the data stored\
    \ in a file, the program must first open the file and then read the data from\
    \ the file. You use prewritten classes that are part of a C++ library to accomplish\
    \ this. Next, you learn how to use these classes to open a file, close a file,\
    \ read data from a file, and write data to a file.\n\n# USING INPUT AND OUTPUT\
    \ CLASSES\n\nTo use the classes that you need to perform file input (`ifstream`)\
    \ and output (`ofstream`), you must add the following preprocessor directive at\
    \ the beginning of your C++ program:\n\n```\n```cpp\n#include <fstream>\n```\n\
    ```\n\nThe classes included in the `fstream` class are prewritten for you by the\
    \ C++ development team and allow you to simplify your programming tasks by creating\
    \ objects using these classes. You can then use the attributes and methods of\
    \ these objects in your C++ programs.\n\n# OPENING A FILE FOR READING\n\nTo open\
    \ a file in C++ to read data into your program, you declare a file input stream\
    \ object (variable) as shown below:\n\n```\n```cpp\nifstream data_in;\n```\n```\n\
    \nYou then use the open method (function) to specify the name of the file to open.\
    \ Look at the following example:\n\n```\n```cpp\ndata_in.open(\"inputFile.dat\"\
    );\n```\n```\n\nIn the example, you use the `ifstream` object (`data_in`), followed\
    \ by a dot (`.`), followed by the name of the method (`open`) to open a file for\
    \ input. Within the parentheses, you place the name of the file you want to open\
    \ enclosed in double quotes. This statement opens the file named `inputFile.dat`\
    \ for reading. This means that the program can now read data from the file. In\
    \ this example, the file named `inputFile.dat` must be saved in the same folder\
    \ as the C++ program that is using the file. To open a file that is saved in a\
    \ different folder, a path must be specified as in the next example:\n\n```\n\
    ```cpp\ndata_in.open(\"C:\\\\myC++Programs\\\\Chapter9\\\\inputFile.dat\");\n\
    ```\n```\n\n> > **NOTE**  \n> > You can think of the `istream` as the data type\
