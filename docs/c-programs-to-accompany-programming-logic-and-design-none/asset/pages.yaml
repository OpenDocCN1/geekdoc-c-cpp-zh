  md: "```\n~~~cpp\n// The next statement evaluates to true because the contents of\
    \ s2,\n// \"whale\", are less than the contents of s1, \"whole\".\nif (s2 < s1)\n\
    \    // code written here executes if true\nelse\n    // code written here executes\
