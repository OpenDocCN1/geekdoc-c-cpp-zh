    \ second curly brace in the third to seventh line.\n\n```\n```cpp\nint customerAge\
    \ = 53;\nint discount = 10, numUnder_65 = 0;\nif(customerAge < 65)\n{\n    discount\
    \ = 0;\n    numUnder_65 += 1;\n}\ncout << \"Discount : \" << discount << endl;\n\
    cout << \"Number of customers under 65 is: \" << numUnder_65 << endl;\n```\n```\n\
    \nIn the preceding code, the variable named `customerAge` is initialized to the\
    \ value 53. Because 53 is less than 65, the expression `customerAge < 65` evaluates\
    \ to true and the block statement executes. The block statement is made up of\
    \ the two assignment statements within the curly braces: `discount = 0;` and `numUnder_65\
    \ += 1;`. If the expression evaluates to false, the block statement does not execute.\
    \ In either case, the next statement to execute is the output statement `cout\
    \ << \"Discount : \" << discount << endl;`.\n\nNotice that you do not include\
    \ a semicolon at the end of the line with the `if` and the expression to be tested.\
    \ Doing so is not a syntax error, but it can create a logic error in your program.\
    \ A **logic error** causes your program to produce incorrect results. In C++,\
    \ the semicolon (;) is called the null statement and is considered a legal statement.\
    \ The **null** statement is a statement that does nothing. Examine the following\
    \ code:\n\n```\n```cpp\nif (customerAge < 65); // semicolon here is not correct\n\
    {\n    discount = 0;\n    numUnder_65 += 1;\n}\n```\n```\n\nIf you write an `if`\
    \ statement as shown in the preceding code, your program will test the expression\
    \ `customerAge < 65`. If it evaluates to true, the null statement executes, which\
    \ means your program does nothing, and then the statement `discount = 0;` executes\
    \ because this is the next statement following the `if` statement. This does not\
    \ cause a logic error in your program, but consider what happens when the expression\
    \ in the `if` statement evaluates to false. If false, the null statement does\
    \ not execute, but the statement `discount = 0;` will execute because it is the\
