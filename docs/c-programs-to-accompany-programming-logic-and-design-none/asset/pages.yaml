  md: "# ACCUMULATING TOTALS IN A LOOP\n\nYou can use a loop in C++ to accumulate\
    \ a total as your program executes. For example, assume that your computer science\
    \ instructor has asked you to design and write a program that she can use to calculate\
    \ an average score for the midterm exam she gave last week. To find the average\
    \ test score, you need to add all the students’ test scores, and then divide that\
    \ sum by the number of students who took the midterm.\n\nNote that the logic for\
    \ this program should include a loop that will execute for each student in the\
    \ class. In the loop, you get a student’s test score as input and add that value\
    \ to a total. After you get all of the test scores and accumulate the sum of all\
    \ the test scores, you divide that sum by the number of students. You should plan\
    \ to ask the user to input the number of student test scores that will be entered\
    \ because your instructor wants to reuse this program using a different number\
    \ of students each time it is executed.\n\nAs you review your work, you realize\
    \ that the program will accumulate a sum within the loop and that you will also\
    \ need to keep a count for the number of students. You learned in *Programming\
    \ Logic and Design, Fifth Edition* that you add 1 to a counter each time a loop\
    \ executes and that you add some other value to an accumulator. For this program,\
    \ that other value added to the accumulator is a student’s test score.\n\nThe\
    \ following C++ program includes the loop required for this program. Notice that\
    \ the loop body includes an accumulator and a counter.\n\n```\n```cpp\n// This\
    \ program calculates an average test score given individual\n// test scores.\n\
    // Input: Interactive - Student Test Scores\n// Output: Number of Students taking\
    \ the test and the test score\n// average\n#include <iostream>\n#include <string>\n\
    using namespace std;\nint main()\n{\n    // Declare variables\n    int testScore;\n\
    \    int numStudents;\n    int stuCount;\n    double testTotal;\n    double average;\n\
    \    // Get user input to control loop\n    cout << \"Enter number of students:\
    \ \";\n    cin >> numStudents;\n    // Initialize accumulator variable to 0\n\
    \    testTotal = 0;\n    // Loop for each student\n    for(stuCount = 0; stuCount\
    \ < numStudents; stuCount++)\n```\n```"
  merge: -1
  img_proc: true
