- pgno: 227
  md: '# C++ Programs to

    Accompany Programming

    Logic and Design


    *C++ Programs to Accompany Programming Logic and Design* is designed to be paired
    with the Fifth Edition of the highly successful *Programming Logic and Design*
    by Joyce Farrell. The two books together provide the perfect opportunity for those
    who want to learn the fundamentals of programming and also get a taste of an actual
    programming language. Users can discover how real C++ code behaves while remaining
    within the context of the traditional language-independent logic and design course.


    # Features


    +   - Creates an ideal environment for learning the basics of logic and design,
    while also providing an introduction to C++

    +   - Contains ten concise chapters that correspond to chapters in *Programming
    Logic and Design, Fifth Edition*

    +   - Contains exercises and labs that provide an opportunity to apply new programming
    concepts

    +   - Works well with both the Introductory and Comprehensive versions of *Programming
    Logic and Design, Fifth Edition*


    # About the Author


    Jo Ann Smith is currently working as a computer consultant in the higher education
    space. She was formerly an Assistant Professor of Computer Information Systems
    at Harper College in Palatine, Illinois. Jo Ann also taught at the College of
    DuPage in Glen Ellyn, Illinois, and at the University of St. Francis in Joliet,
    Illinois. Her industry experience includes running a computer-training company
    in the Chicago area for seven years and working for nine years at AT&T Bell Laboratories.


    *C++ Programs to Accompany Programming Logic and Design* is designed to be used
    with…


    ![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_227_0.png)


    **Programming Logic and Design, Fifth Edition**


    By Joyce Farrell


    Introductory: 978-1-4239-0195-2

    Comprehensive: 978-1-4239-0196-9


    # Also available


    ![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_227_1.png)


    **Java Programs to Accompany Programming Logic and Design, Second Edition**


    By Jo Ann Smith


    ISBN: 978-1-4239-0229-4


