  md: '# # PREFACE


    ***C++ Programs to Accompany Programming Logic and Design*** (also known as *C++
    PAL*) is designed to provide students with an opportunity to write C++ programs
    as part of an Introductory Programming Logic course. It is written to be a companion
    text to the student’s primary text, *Programming Logic and Design, Fifth Edition*,
    by Joyce Farrell. This textbook assumes no programming language experience and
    provides the beginning programmer with a guide to writing structured programs
    and simple object-oriented programs using introductory elements of the popular
    C++ programming language. It is not intended to be a textbook for a course in
    C++ programming. The writing is non-technical and emphasizes good programming
    practices. The examples do not assume mathematical background beyond high school
    math. Additionally, the examples illustrate one or two major points; they do not
    contain so many features that students become lost following irrelevant and extraneous
    details.


    The examples in C++ PAL are often examples presented in the primary textbook,
    *Programming Logic and Design, Fifth Edition*. The following table shows the correlation
    between topics in the two books.


    | C++ PAL | Programming Logic and Design, Fifth Edition |

    |---|---|

    | Chapter 1: An Introduction to C++ and the C++ Programming Environment | Chapter
    1: An Overview of Computers and Logic |

    | Chapter 2: Variables, Operators, and Writing Programs Using Sequential Statements
    | Chapter 1: An Overview of Computers and Logic |

    | Chapter 3: Writing Structured C++ Programs | Chapter 2: Understanding Structure<br>Chapter
    3: The Program Planning Process: Documentation and Design |

    | Chapter 4: Writing Programs that Make Decisions | Chapter 4: Making Decisions
    |

    | Chapter 5: Writing Programs Using Loops | Chapter 5: Looping |

    | Chapter 6: Using Arrays in C++ Programs | Chapter 6: Arrays |

    | Chapter 7: Using Functions in C++ Programs | Chapter 7: Using Methods |

    | Chapter 8: Writing Control Break Programs in C++ | Chapter 8: Control Breaks
    |

    | Chapter 9: Sorting Data and File Input/Output | Chapter 9: Advanced Array Manipulation<br>Chapter
    10: File Handling and Applications<br>(Comprehensive edition only) |

    | Chapter 10: Object Oriented C++ | Chapter 11: Object-oriented Programming<br>(Comprehensive
    edition only) |'
