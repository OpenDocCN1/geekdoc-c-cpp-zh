    # # OVERLOADING FUNCTIONS


    You can overload functions by giving the same name and different parameter lists
    to multiple functions. Overloading a function is useful when you need to perform
    the same action on different types of inputs. For example, you may want to write
    multiple versions of an `add` function—one that can add two `ints`, another that
    can add two `doubles`, another that can add three `ints`, and another that can
    add two `ints` and a `double`, to name just a few different types of inputs. Overloaded
    functions have the same name but require a different number of arguments, or the
    arguments must be of different data types. C++ figures out which function to call
    based on the function''s name and its arguments, the combination of which is known
    as the function''s **signature**. It''s important to understand that the signature
    of a function consists of the function''s name and its argument list; it does
    not include the function''s return type.


    Overloading functions allows a C++ programmer to choose meaningful names for functions
    and also permits the use of polymorphic code. **Polymorphic** code is code that
    acts appropriately depending on the context. (The word “*polymorphic*” is derived
    from the Greek words “*poly*”, meaning “many,” and “*morph*”, meaning “form.”)
    Polymorphic functions in C++ can take many forms. You will learn more about polymorphism
    in other C++ courses, when you learn more about object-oriented programming. For
    now, you can use overloading to write functions that perform the same task but
    with different data types.


    In Chapter 7 of *Programming Logic and Design, Fifth Edition*, you studied the
    design for an overloaded function named `printBill`; one version includes a numeric
    parameter, a second version includes two numeric parameters, a third version includes
    a numeric parameter and a string parameter, and a fourth version includes two
    numeric parameters and a string parameter. All versions of the `printBill` function
    have the same name with a different signature; therefore, it is an overloaded
    function. In *Figure 7-12* you see a C++ program that includes the four versions
    of the `printBill` function.'
