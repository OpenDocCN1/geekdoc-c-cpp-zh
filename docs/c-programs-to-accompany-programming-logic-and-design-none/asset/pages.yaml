    # PASS BY REFERENCE


    Passing an argument to a function by reference allows the called function to access
    a variable in the calling function. In other words, the called function gains
    the ability to change the value of a local variable in the calling function. The
    argument in the called function becomes an alias (another name) for the variable
    in the calling function.


