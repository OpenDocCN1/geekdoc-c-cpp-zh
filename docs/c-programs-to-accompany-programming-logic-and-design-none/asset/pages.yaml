    # STAYING WITHIN THE BOUNDS OF AN ARRAY


    As a C++ programmer, you must be careful to ensure that the subscript values you
    use to access array elements are within the legal bounds. Unlike most other programming
    languages, the C++ compiler does *not* check to make sure that a subscript used
    in your program is greater than or equal to 0 and less than the length of the
    array. For example, suppose you declare an array named *numbers* as follows:


    ```

    ~~~cpp

    int numbers[10];

    ~~~

    ```


    In this case, the C++ compiler does *not* check to make sure the subscripts you
    use to access this array are integer values between 0 and 9.


    > > **NOTE:** When using a loop to access the elements in an array, be sure that
    the test you use to terminate the loop keeps you within the legal bounds, 0 to
    *n*-1, where *n* is the number of items stored in the array.


    However, when you execute your program, if you use an array subscript that is
    *not* in the legal bounds, a garbage value is accessed. As an example, consider
    the highlighted operator in the following code, which is taken from the previous
    C++ program example:


    ```

    ~~~cpp

    double source[] = {1.0, 5.5, 7.9};

    int loopIndex;

    for (loopIndex = 0; loopIndex < 3; loopIndex++)

    ~~~

    ```'
