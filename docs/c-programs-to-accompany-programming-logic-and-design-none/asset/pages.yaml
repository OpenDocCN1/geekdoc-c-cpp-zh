- pgno: 75
  md: "The syntax for writing a `switch` statement in C++ is as follows:\n\n```\n\
    ```cpp\nswitch(expression)\n{\n    case constant: statement(s);\n    case constant:\
    \ statement(s);\n    case constant: statement(s);\n    default:       statement(s);\n\
    }\n```\n```\n\n> **NOTE**\n> \n> If you omit a `break` statement in a `case`,\
    \ all the code up to the next `break` statement or a closing curly brace is executed.\
    \ This is probably not what you intend.\n\nYou begin writing a `switch` statement\
    \ with the keyword `switch`. Then, within parentheses, you include an expression\
    \ that evaluates to an integer value. Cases are then defined within the `switch`\
    \ statement by using the keyword `case` as a label, and including an integer value\
    \ after this label. For example, you could include an integer constant such as\
    \ 10 or an arithmetic expression that evaluates to an integer such as `10/2`.\
    \ The computer evaluates the expression in the `switch` statement and then compares\
    \ it to the integer values following the case labels. If the expression and the\
    \ integer value match, then the computer executes the statement(s) that follow\
    \ until it encounters a `break` statement or a closing curly brace. The `break`\
    \ statement causes an exit from the `switch` statement. You can use the keyword\
    \ `default` to establish a case for values that do not match any of the integer\
    \ values following the case labels. Note also that all of the cases, including\
    \ the default case, are enclosed within curly braces.\n\nThe following code sample\
    \ illustrates the use of the `switch` statement in C++:\n\n```\n```cpp\nint deptNum;\n\
    string deptName;\ndeptNum = 2;\nswitch(deptNum)\n{\n    case 1:    deptName =\
    \ \"Marketing\";\n               break;\n    case 2:    deptName = \"Development\"\
    ;\n               break;\n    case 3:    deptName = \"Sales\";\n             \
    \  break;\n    default:   deptName = \"Unknown\";\n               break;\n}\n\
    cout << \"Department: \" << deptName << endl;\n```\n```\n\nIn the preceding example,\
    \ when the program encounters the `switch` statement, the value of the variable\
    \ named `deptNum` is 2. The value 2 matches the integer constant 2 in the second\
    \ case of the `switch` statement. Therefore, the string constant `\"Development\"\
    ` is assigned to the string object named `deptName`. A `break` statement is encountered\
    \ next, and causes the program to exit from the `switch` statement. The statement\
    \ following the `switch` statement `cout << \"Department: \" << deptName << endl;`\
    \ executes next."
