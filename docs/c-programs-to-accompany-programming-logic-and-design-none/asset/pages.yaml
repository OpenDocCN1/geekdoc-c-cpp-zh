- pgno: 45
  md: "In this chapter, you begin to learn how to write structured C++ programs. As\
    \ you will see, creating a flowchart and writing pseudocode before you actually\
    \ write the program ensures that you fully understand the program's intended design.\
    \ We begin by looking at a structured flowchart and pseudocode from your text,\
    \ *Programming Logic and Design, Fifth Edition*. You should do the exercises and\
    \ labs in this chapter only after you have finished Chapters 2 and 3 of your book,\
    \ *Programming Logic and Design, Fifth Edition*.\n\n# # USING FLOWCHARTS AND PSEUDOCODE\
    \ TO WRITE A C++ PROGRAM\n\nIn Chapters 1 and 2 of *Programming Logic and Design,\
    \ Fifth Edition*, you studied flowcharts and pseudocode for the number-doubling\
    \ program. Figure 3-1 shows the functional, structured flowchart and pseudocode\
    \ for this program.\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_45_0.png)\n\n\
    ```\nstart\n    get inputNumber\n    while not eof\n        calculatedAnswer =\
    \ inputNumber * 2\n        print calculatedAnswer\n        get inputNumber\n \
    \   endwhile\n    stop\n```\n\n**Figure 3-1** Functional, structured flowchart\
    \ and pseudocode for the number-doubling problem\n\nBy studying the flowchart\
    \ and pseudocode, you can see that this program makes use of the sequence and\
    \ loop structures you have been introduced to in *Programming Logic and Design,\
    \ Fifth Edition*. You must learn more about C++ before you can expect to write\
    \ this program by yourself. The remainder of this section walks you through the\
    \ C++ code for this program. The explanations assume that you are simply reading\
    \ along, but if you want, you can type the code as it is presented. The goal of\
    \ this section is to help you get a feel for how flowcharts and pseudocode can\
    \ serve as a guide as you write C++ programs.\n\n> > **NOTE**\n> >\n> > Notice\
    \ that each opening curly brace is matched by a closing curly brace.\n\nIn Figure\
    \ 3-1, the first line of the pseudocode is the word `start`. How do we translate\
    \ this pseudocode command into the C++ code that will start the number-doubling\
    \ program? In Chapter 1 of this book, you learned that to start a C++ program,\
    \ you first create a `main`"
