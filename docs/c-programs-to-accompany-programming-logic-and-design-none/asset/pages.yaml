    \ file `Payoff.cpp`.\n+   \n+   5. Execute the program. Input the following:\n\
    +   \n+       Account Number: 6789A\n+   \n+       Customer Name: Jeanne Johnson\n\
    +   \n+       Balance: 120.00\n+   \n+   6. Record the final balance amount when\
    \ the loan may be paid off.\n\n# ## WRITING A FOR LOOP IN C++\n\nIn Chapter 5\
    \ of *Programming Logic and Design, Fifth Edition*, you learned that a `for` loop\
    \ is a **definite** loop; this means this type of loop will execute a definite\
    \ number of times. The following is the syntax for a `for` loop in C++:\n\n```\n\
    ```cpp\nfor (expression1; expression2; expression3)\n    statement;\n```\n```"
