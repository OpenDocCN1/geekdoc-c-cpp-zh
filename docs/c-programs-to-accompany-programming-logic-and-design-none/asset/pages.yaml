- pgno: 92
  md: "In C++, the `for` loop consists of three expressions that are separated by\
    \ semicolons and enclosed within parentheses. The `for` loop executes as follows:\n\
    \n+   » The first time the `for` loop is encountered, the first expression is\
    \ evaluated. Usually, this expression initializes a variable that is used to control\
    \ the `for` loop.\n+   \n+   » Next, the second expression is evaluated. The second\
    \ expression usually evaluates the variable that was initialized in the first\
    \ expression. If the second expression evaluates to `true`, the loop statement\
    \ executes. If the second expression evaluates to `false`, the loop is exited.\n\
    +   \n+   » After the loop statement executes, the third expression is evaluated.\
    \ The third expression usually increments or decrements the variable that you\
    \ initialized in the first expression and compared in the second expression.\n\
    +   \n+   » After the third expression is evaluated, the second expression is\
    \ evaluated again. If the second expression still evaluates to `true`, the loop\
    \ statement executes again, and then the third expression is evaluated again.\
    \ This process continues until the second expression evaluates to `false`.\n\n\
    The following code sample illustrates a C++ `for` loop. Notice that the code uses\
    \ a block statement in the `for` loop.\n\n```\nint number = 0;\nint count;\nconst\
    \ int NUM_LOOPS = 10;\nfor(count = 0; count < NUM_LOOPS; count++)\n{\n    number\
    \ += count;\n    cout << \"Value of number is: \" << number << endl;\n}\n```\n\
    \nIn this `for` loop example, the variable named `count` is initialized to 0 in\
    \ the first expression. The second expression is a Boolean expression that evaluates\
    \ to true or false. When the expression `count < NUM_LOOPS` is evaluated the first\
    \ time, the value of `count` is 0 and the result is true. The loop body is then\
    \ entered. This is where a new value is computed and assigned to the variable\
    \ named `number` and then is displayed. The first time through the loop, the output\
    \ is as follows: `Value of number is: 0.`\n\nAfter the output is displayed, the\
    \ third expression in the `for` loop is evaluated; this adds 1 to the value of\
    \ `count`, making the new value of `count` equal to 1. When expression two is\
    \ evaluated a second time, the value of `count` is 1. The program then tests to\
    \ see if the value of `count` is less than `NUM_LOOPS`. This results in a true\
    \ value and causes the loop body to execute again where a new value is computed\
    \ for `number` and then displayed. The second time through the loop, the output\
    \ is as follows: `Value of number is: 1.`\n\nNext, expression three is evaluated;\
    \ this adds 1 to the value of `count`. The value of `count` is now 2. Expression\
    \ two is evaluated a third time and again is true because 2 is less than `NUM_LOOPS`.\
    \ The third time through, the loop body changes the value of `number` to 3 and\
    \ then displays the new value. The output is as follows: `Value of number is:\
    \ 3.`"
  merge: -1
  img_proc: true
