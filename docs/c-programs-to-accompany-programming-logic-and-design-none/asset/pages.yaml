  md: "```\n~~~cpp\n    cout << \"Fahrenheit temperature:\" << fahrenheit << endl;\n\
    \    cout << \"Celsius temperature:\" << celsius << endl;\n\n    return 0;\n \
    \   }\n~~~\n```\n\nThis program is made up of sequential statements that execute\
    \ one after the other. It also includes comments explaining the code. The comments\
    \ are the lines that begin with `//`. After the variables `fahrenheit` and `celsius`\
    \ are declared (using the `double` data type), the following statements execute:\n\
    \n```\n~~~cpp\n    // Prompt user\n    cout << \"Enter Fahrenheit temperature:\
    \ \";\n    // Get interactive user input\n    cin >> fahrenheit;\n~~~\n```\n\n\
    > > **NOTE**\n> > Remember that `endl` causes the cursor to be displayed on the\
    \ line following the output.\n\nThe `cout` statement is used to prompt the user\
    \ for the Fahrenheit temperature so that the program can convert it to Celsius.\
    \ Notice that `endl` is not included in this `cout` statement. This is done to\
    \ position the cursor on the same line as the displayed prompt.\n\nThe next statement,\
    \ `cin >> fahrenheit;`, is used to retrieve the user's input. This line consists\
    \ of multiple parts. The first part, `cin`, is the name of an object that represents\
    \ the user's standard input device, which is usually a keyboard. Next, you see\
    \ `>>`, which is called the **extraction** or **input** operator. After `>>`,\
    \ you see `fahrenheit`, which is the name of the variable that will store the\
    \ data that is going to be extracted. The C++ extraction operator `>>` automatically\
    \ converts input typed at the keyboard to the appropriate data type. In this example,\
    \ `>>` will convert the user's input to the `double` data type because the variable\
    \ `fahrenheit` is declared as data type `double`.\n\nThe next statement to execute\
    \ is an assignment statement, as follows:\n\n```\n~~~cpp\n    celsius = (fahrenheit\
    \ - 32.0) * (5.0 / 9.0);\n~~~\n```\n\nThe formula that converts Fahrenheit temperatures\
    \ to Celsius is used on the right side of this assignment statement. Notice the\
    \ use of parentheses in the expression to control precedence. The expression is\
    \ evaluated and the resulting value is assigned to the variable named `celsius`.\n\
    \nNotice that the division uses the values `5.0` and `9.0`. This is an example\
    \ of floating-point division, which results in a value that includes a fraction.\
    \ If the values `5` and `9` were used, integer division would be performed, and\
    \ the fractional portion would be truncated.\n\nThe next two statements to execute\
    \ in sequence are both output statements, as follows:\n\n```\n~~~cpp\n    cout\
    \ << \"Fahrenheit temperature:\" << fahrenheit << endl;\n    cout << \"Celsius\
    \ temperature:\" << celsius << endl;\n~~~\n```\n\nThe statement `cout << Fahrenheit\
    \ temperature: << fahrenheit << endl;` is used to display the string `Fahrenheit\
    \ temperature:` followed by the value stored in the variable `fahrenheit`, followed\
    \ by a newline character. The second output statement displays the words `Celsius\
    \ temperature:` followed by the value stored in the variable `celsius`, followed\
    \ by a newline character."
