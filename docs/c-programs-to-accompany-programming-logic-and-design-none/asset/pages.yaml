    are passed to the function. The `categoryChange` function, which begins on line
    73, does the following:


    +   1. Prints six tab characters followed by the value of the local constant named
    `CATEGORY_FOOTER` and the value of `categoryTotal`, which contains the count of
    books in the current category (line 77).

    +   2. Adds the value of `categoryTotal` to `grandTotal`, which is the variable
    used to accumulate the total of all books (line 78).

    +   3. Returns the value of `grandTotal` (line 79) to the location in the `main`
    function where the `categoryChange` function was called (line 44).


    When the `categoryChange` function is finished executing, the following occurs:


    +   - The function’s return value is assigned to the variable named `grandTotal`
    on line 44, thereby updating the total number of books.

    +   - The variable named `categoryTotal` is assigned the value 0 to prepare for
    the beginning of a new category (line 45).

    +   - The previous category variable, `prevCategory`, is assigned the value of
    the current category (`category`) to prepare for a new category (line 46).


    The next statement to execute (line 48) adds 1 to the category counter variable
    named `categoryTotal`. It is important to understand that this statement executes
    both when a category changes and when a category does not change. Finally, lines
    49 through 64 print the title of the current book and then get the next book’s
    input data using the same technique as in the priming read. The condition in the
    `while` loop on line 40 is then tested again, causing the loop to continue executing
    until the user enters the word “done” instead of a book’s title.


    When the `while` loop is exited, the last section of the program executes. This
    consists of:


    +   - Printing six tab characters followed by the value of the local constant
    named `CATEGORY_FOOTER` along with the value of `categoryTotal` (which is the
    total of the last category input by the user) on line 66.

    +   - Adding the value of `categoryTotal` to the variable named `grandTotal` on
    line 67.

    +   - Printing six tab characters followed by the value of the local constant
    named `FOOTER` along with the value of `grandTotal`, which now contains the total
    of all books carried by the bookstore on line 68.


