    \ book.\n\n# THE IF-ELSE STATEMENT\n\nThe if-else statement is a dual-path or\
    \ dual-alternative decision statement. That is, your program will take one of\
    \ two paths as a result of evaluating an expression in an if-else statement.\n\
    \nThe syntax for writing an if-else statement in C++ is as follows:\n\n```\nif\
    \ (expression)\n    statementA;\nelse\n    statementB;\n```\n\nWhen the compiler\
    \ encounters an if-else statement, the expression in the parentheses is evaluated.\
