  md: "```\n```cpp\n// EvenOrOdd.cpp - This program determines if a number input by\
    \ the user is an\n// even number or an odd number.\n// Input:  Interactive\n//\
    \ Output:  The number entered and whether it is even or odd\n\n#include <iostream>\n\
    #include <string>\nvoid evenOrOdd(int);\nusing namespace std;\n\nint main()\n\
    {\n    int number;\n    cout << \"Enter a number or 999 to quit: \";\n    cin\
    \ >> number;\n\n    while(number != 999)\n    {\n        evenOrOdd(number);\n\
    \        cout << \"Enter a number or 999 to quit: \";\n        cin >> number;\n\
    \    }\n    return 0;\n} // End of main function\n\nvoid evenOrOdd(int number)\n\
    {\n    if((number % 2) == 0)\n        cout << \"Number: \" << number << \" is\
    \ even.\" << endl;\n    else\n        cout << \"Number: \" << number << \" is\
    \ odd.\" << endl;\n} // End of evenOrOdd function\n```\n```\n\n> The variable\
    \ named number is local to the main function. Its value is stored at one memory\
    \ location. For example, it may be stored at memory location 2000.\n\n> The value\
    \ of the formal parameter, number, is stored at a different memory location and\
    \ is local to the evenOrOdd function. For example, it may be stored at memory\
    \ location 7800.\n\n**Figure 7-2** C++ code for even or odd number program\n\n\
    > NOTICE the function declaration on line 8 specifies that the evenOrOdd function\
    \ does not return a value (void) and expects a single argument of data type int.\n\
    \nOn line 14 in this program, the user is asked to enter a number or the sentinel\
    \ value, 999, when she is finished entering numbers and wants to quit the program.\
    \ (You learned about sentinel values in Chapter 5 of this book.) On line 15, the\
    \ input value is retrieved and then stored in the variable named number. Next,\
    \ if the user did not enter the sentinel value 999, the while loop is entered\
    \ and the function named evenOrOdd is called (line 19) using the following syntax:\n\
    \n`evenOrOdd(number);`\n\nNotice that the int variable number is placed within\
    \ the parentheses, which means that the value of number is passed to the evenOrOdd\
    \ function. This is referred to as passing an argument by value. **Passing an\
    \ argument by value** means that a copy of the value of the argument is passed\
    \ to the function. Within the function, the value is stored"
