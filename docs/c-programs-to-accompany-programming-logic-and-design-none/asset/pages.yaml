    # ## WRITING FUNCTIONS THAT REQUIRE A SINGLE PARAMETER


    As you learned in *Programming Logic and Design, Fifth Edition*, some functions
    require data to accomplish their task. You also learned that designing a program
    so that it sends data (which can be different each time the program runs) to a
    function (which doesn''t change) keeps you from having to write multiple functions
    to handle similar situations. For example, suppose you are writing a program that
    has to determine if a number is even or odd. It is certainly better to write a
    single function, to which the program can pass a number entered by the user, than
    to write individual functions for every number.


    In Figure 7-2, you see the C++ code for a program that includes a function that
    can determine if a number is odd or even. The line numbers are not actually part
    of the program but are included for reference only. The program allows the user
    to enter a number, and then passes that number to a function as an argument. After
    it receives the argument, the function can determine if the number is an even
    number or an odd number.'
