    \ is \" << bankBal << endl;\n    bankBal = bankBal + bankBal * intRate;\n    cout\
    \ << \"Do you want to see next year's balance? Y or N: \";\n    cin >> response;\n\
    }\ncout << \"Have a nice day!\" << endl;\n```\n\nIn this code example, the variable\
    \ named response is the loop control variable. It is assigned a value when the\
    \ program asks the user, “Do you want to see your current balance? Y or N:”"
