    The keyword `public` specifies a derivation type. A **public derivation** means
    that all of the public members of the base class will be public in the derived
    class. Therefore, you do not have to repeat these members in the derived class;
    you simply use the inherited members. This means that the new Automobile class
    inherits, and will be able to use, the public methods from the Vehicle class.
    These methods are: `setSpeed`, `getSpeed`, `accelerate`, `setFuelCapacity`, `getFuelCapacity`,
    `setMaxSpeed`, and `getMaxSpeed`. Now, in the Automobile class, you are able to
    use these public methods to gain access to the private members (`fuelCapacity`,
    `maxSpeed`, and `currentSpeed`) in the Vehicle class. In the derived Automobile
    class, you can also add new members or modify the inherited members. There are
    additional derivation types in C++, but in this book, you will always use the
    public derivation type. You will learn more about derivation types when you take
    additional courses in C++.


    On line 12 in Figure 10-8, you see that one private data member, `convertibleStatus`,
