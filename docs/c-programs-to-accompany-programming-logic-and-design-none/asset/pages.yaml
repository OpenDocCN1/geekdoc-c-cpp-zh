    # THE sortArray FUNCTION


    In the sortArray function, the program uses a refined bubble sort to rearrange
    the student scores in the array named score in ascending order. Refer to Figure
    9-1, which includes the pseudocode, and Figure 9-2, which includes the C++ code
    that implements the sortArray function.


    As you can see on line 57 in Figure 9-2, this function receives two arguments:
    int score[] (the array of items to sort) and int els (the number of scores stored
    in the array). Lines 59 through 61 declare variables. Notice on line 60 that the
    variable pairsToCompare is initialized with a value that represents the number
    of pairs that will be compared in the first pass of the bubble sort. The number
    of pairs is calculated by subtracting 1 from els, the number of elements in the
    array. This ensures that the program does not attempt to compare item x with item
    x+1, when x is the last item in the array. Line 61 initializes the flag variable,
    switchOccurred, to true because, at this point in the program, it is assumed that
    items will need to be swapped.


    The outer loop, while (switchOccurred == true), controls the number of passes
    over the data. This logic implements one of the refinements discussed earlier—eliminating
    unnecessary passes over the data. As long as switchOccurred is true, the program
    knows that swaps have been made and that, therefore, the data is still out of
    order. Thus, when switchOccurred is true, the program enters the loop. The first
    statement in the body of the loop (line 66) is x = 0;. The program assigns the
    value 0 to x because x is used as the array subscript. Recall, in C++, the first
    subscript in an array is 0.


    Next, to prepare for comparing the elements in the array, line 67 assigns the
    value false to switchOccurred. This is necessary because the program has not yet
    swapped any values in the array on this pass. The inner loop begins on line 69.
    The test x < pairsToCompare controls the number of pairs of values in the array
    that the program compares on one pass over the data. This implements another of
    the refinements discussed earlier—reducing unnecessary comparisons. The last statement
    in the outer loop (line 78), pairsToCompare--; decrements the value of pairsToCompare
    by 1 each time the outer loop executes. The program decrements pairsToCompare
    because when a complete pass is made over the data, it knows an item is positioned
    in the array correctly. Comparing the value of pairsToCompare with the value of
    x in the inner loop reduces the number of necessary comparisons made when this
    loop executes.'
