  md: "# THE STRUCTURE OF A C++ PROGRAM\n\nWhen a programmer learns a new programming\
    \ language, the first program he or she traditionally writes is a Hello World\
    \ program—a program that displays the message “Hello World” on the screen. Creating\
    \ this simple program illustrates that the language is capable of instructing\
    \ the computer to communicate with the “outside” world. The C++ version of the\
    \ Hello World program is shown in Figure 1-1:\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main()\n{\n    cout << \"Hello World\" << endl;\n  \
    \  return 0;\n}\n```\n```\n\n**Figure 1-1** Hello World program\n\nAt this point,\
    \ you’re not expected to understand all the code in Figure 1-1. Just notice that\
    \ the code begins with the preprocessor directive, `#include <iostream>`. The\
    \ **C++ preprocessor** is a program that processes your C++ program before the\
    \ compiler processes it. The `#include` directive tells the compiler to include\
    \ another file when the program is compiled. This makes it easy for you to use\
    \ code previously written by you or others in your programs without having to\
    \ recreate it. You will learn more about the Visual C++ compiler later in this\
    \ chapter. Following the `#include` you see `<iostream>`, which is the name of\
    \ a header file you want to include in this program. The **iostream header file**\
    \ gives your program access to what it needs to perform input and output in a\
    \ C++ program. The name of the header file is placed within angle brackets (`<\
    \ >`). The angle brackets tell the compiler to look for this file in a directory\
    \ that is specified by the compiler you are using. You will learn more about preprocessor\
    \ directives throughout this book.\n\n> **NOTE 1**\n> \n> Namespaces are a relatively\
    \ new addition to C++ and are used primarily in large programs. In this book,\
    \ the only namespace you will use is the `std` namespace.\n\nThe next line (`using\
    \ namespace std;`) instructs the compiler to use the std namespace. You can think\
    \ of a **namespace** as a container that holds various program elements. The **std\
    \ namespace** contains everything C++ programs need to use the Standard C++ library.\
    \ The **Standard C++ library** adds functionality to the C++ programming language.\
    \ For example, this program needs to use the `std` namespace to have access to\
    \ `cout` and `endl`, which you see on the fifth line in Figure 1-1. Notice that\
    \ this line ends with a semicolon (`;`). In fact, all C++ statements end with\
    \ a semicolon. The reason the previous line, `#include <iostream>`, does not end\
    \ with a semicolon is that it is a preprocessor directive, not a C++ statement.\n\
    \n> **NOTE 2**\n> \n> You can tell `main` is a function because of the parentheses;\
    \ all C++ function names are followed by parentheses.\n\nOn the third line you\
    \ see the start of a function named `main`. A **function** is a group of C++ statements\
    \ that perform a specified task. This is a special function in a C++ program;\
    \ the `main` function is the first function that executes when any program runs.\
    \ The programs in the"
