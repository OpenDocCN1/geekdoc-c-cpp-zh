    \   cout << \"Enter a number to double or 0 to end: \" << endl;\n    cin >> inputNumber;\n\
    \    while( inputNumber != 0)\n    {\n    }\n}\n```\n```\n\n> **NOTE** You have\
    \ not learned enough about while loops to write this code yourself, but you can\
