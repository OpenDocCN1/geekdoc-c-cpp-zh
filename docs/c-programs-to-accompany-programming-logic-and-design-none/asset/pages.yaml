  md: '# # Aaron Yorek


    # ## ...Got a Job in Computing


    ![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_1_0.png)


    Aaron is an IT and Security Compliance Manager at BioScrip, Inc. He graduated
    from St. Cloud State University in 2006 with a major in Computer Information Systems.
    He provides testing and regulatory oversight to ensure compliance with audits.
    He also manages participation in developing and monitoring corrective action programs
    and plans to address identified deficiencies.


    **What are your hobbies when you’re not at work?**


    I enjoy reading—almost always nonfiction. Another favorite pastime is attempting
    to complete the crossword puzzle.


    **What is the best career advice you could give to an IT student about to graduate?**


    Accept every interview you’re offered. It gives great practice at refining your
    responses and making you more comfortable with the whole process.


    **What has surprised you most about the IT industry?**


    I am continually surprised by how quickly the IT business changes. It’s a challenge
    trying to stay current but interesting to see how the industry grows and changes.


    **What is your favorite thing about your job?**


    I receive satisfaction knowing every day, in a small way, I am directly helping
    the company and its employees and I’m helping make their entire IT structure more
    secure.


    **Where do you see yourself professionally in 10 years?**


    Ten years from now I see myself working as a CIO for a medium sized business.
    I prefer small to medium sized businesses because it seems more like a team when
    you know everyone who works there.


    **As a child, what did you think you’d be doing at this age?**


    When I was young I knew I would either be doing something with computers or nuclear
    medicine. I’m not sure why I thought nuclear medicine, but it sounded intriguing.
    I’m glad I stuck with computers though!'
