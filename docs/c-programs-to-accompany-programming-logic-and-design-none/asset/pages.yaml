    \ is the output?\n\n3. What is the output if the code is changed to `while (numTimes++\
    \ <= NUM_LOOPS)`?\n\n4. What is the output if the code is changed to `while (++numTimes\
    \ <= NUM_LOOPS)`?\n\n# USING A COUNTER TO CONTROL A LOOP\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_87_0.png)\n\
    \nIn Chapter 5 of *Programming Logic and Design, Fifth Edition*, you learned that\
    \ you can use a counter to control a while loop. With a counter, you set up the\
    \ loop to execute a specified number of times. Also recall that a while loop may\
    \ execute zero times if the expression used in the comparison immediately evaluates\
    \ to `false`. In that case, the computer does not execute the body of the loop\
    \ at all.\n\nChapter 5 of *Programming Logic and Design, Fifth Edition* discusses\
    \ a counter-controlled loop that controls how many times the word “Hello” is printed.\
    \ Let’s take a look at the following pseudocode for this counter-controlled loop:\n\
    \n```\nnum count = 0\nwhile count < 4\n    print \"Hello\"\n    count = count\
    \ + 1\nendwhile\n```\n\nThe counter for this loop is a variable named count, which\
    \ is assigned the value 0 and the sentinel value is 4. The Boolean expression\
    \ `count < 4` is tested to see if the value of count is less than 4. If true,\
    \ the loop executes. If false, the program exits the loop. If the loop executes,\
    \ the program displays the word “Hello,” and then adds 1 to the value of count.\
    \ Given this pseudocode, the loop body executes four times and the word “Hello”\
    \ is displayed four times.\n\nNow, let’s see what the code looks like when you\
    \ translate the pseudocode to C++:\n\n```\nint count = 0;\nwhile(count < 4)\n\
    {\n    cout << \"Hello\" << endl;\n    count++;\n}\n```\n\nFirst, the variable\
    \ count is assigned a value of 0 and is used as the counter variable to control\
    \ the `while` loop. The `while` loop follows and includes the Boolean expression\
    \ `count < 4` within parentheses. The counter-controlled loop executes a block\
    \ statement that is marked"
