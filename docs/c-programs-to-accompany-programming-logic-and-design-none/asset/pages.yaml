- pgno: 19
  md: "You should do the exercises and labs in this chapter only after you have finished\
    \ Chapter 1 of your book, *Programming Logic and Design, Fifth Edition*, by Joyce\
    \ Farrell. This chapter introduces the C++ programming language and its history.\
    \ It explains some introductory object-oriented concepts, and describes the process\
    \ of compiling and executing a C++ program. You begin writing C++ programs in\
    \ Chapter 2 of this book.\n\n# THE C++ PROGRAMMING LANGUAGE\n\nThe C programming\
    \ language was written in the early 1970s by Dennis Ritchie at AT&T Bell Labs.\
    \ C is an important programming language because it is both a high level and a\
    \ low level programming language. It is a **high level language**, which means\
    \ that it is more English-like and easier for programmers to use than a low level\
    \ language. At the same time, it possesses **low level language** capabilities\
    \ that allow programmers to directly manipulate the underlying computer hardware.\n\
    \nThe C++ programming language was developed by Bjarne Stroustrup at AT&T Bell\
    \ Labs in 1979 and inherited the wide-spread popularity of C. Because many programmers\
    \ liked using the powerful C programming language, it was an easy step to move\
    \ on to the new C++ language.\n\n> > **NOTE**  \n> > Due to their power, C and\
    \ C++ have been used in the programming of special effects for action movies and\
    \ video games.\n\nWhat makes C++ especially useful for today’s programmers is\
    \ that it is an object-oriented programming language. The term **object-oriented**\
    \ encompasses a number of concepts explained later in this chapter and throughout\
    \ this book. For now, all you need to know is that an object-oriented programming\
    \ language is modular in nature, allowing the programmer to build a program from\
    \ reusable parts of programs called classes.\n\n# AN INTRODUCTION TO OBJECT-ORIENTED\
    \ TERMINOLOGY\n\nYou must understand a few object-oriented concepts to be successful\
    \ at reading and working with C++ programs in this book. Note, however, that you\
    \ will not learn enough to make you a C++ programmer. You will have to take additional\
    \ courses in C++ to become a C++ programmer. This book teaches you only the basics.\n\
    \nTo fully understand the term “object-oriented,” you need to know a little about\
    \ procedural programming. Procedural programming is a style of programming that\
    \ is older than object-oriented programming. Procedural programs consist of statements\
    \ that the computer runs or **executes**. Many of the statements make calls (a\
    \ request to run or execute) to groups of other statements that are known as procedures,\
    \ modules, methods, or subroutines. Therefore, these programs are known as “procedural”\
    \ because they perform a sequence of procedures. Procedural programming focuses\
    \ on writing code that takes some data (for example, some sales figures), performs\
    \ a specific task using the data (for example, adding up the sales figures), and\
    \ then produces output (for example, a sales report). When people who use procedural\
    \ programs (the **users**) decide that they want their programs to do something\
    \ slightly different, a programmer revises the program code, taking great care\
    \ not to introduce errors into the logic of the program."
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # CHAPTER ONE


    Today, we need computer programs that are more flexible and easier to revise.
    Object-oriented programming languages, including C++, were introduced to meet
    this need. In object-oriented programming, the programmer can focus on the data
    that he or she wants to manipulate, rather than the individual lines of code required
    to manipulate that data (although those individual lines still must be written
    eventually). An **object** represents something in the real world, such as a car,
    an employee, a video game character, or an item in an inventory. An object includes
    (or **encapsulates**) both the data related to the object and the tasks you can
    perform on that data. The term **behavior** is sometimes used to refer to the
    tasks you can perform on an object’s data. For example, the data for an inventory
    object might include a list of inventory items, the number of each item in stock,
    the number of days each item has been in stock, and so on. The behaviors of the
    inventory object might include calculations that add up the total number of items
    in stock and calculations that determine the average amount of time each item
    remains in inventory.


    In object-oriented programming, the data items within an object are known collectively
    as the object’s **attributes**. You can think of an attribute as one of the characteristics
    of an object, such as its shape, its color, or its name. The tasks the object
    performs on that data are known as the object’s **methods**. (You can also think
    of a method as an object’s behavior.) Because methods are built into objects,
    when you create a C++ program, you don’t always have to write line after line
    of code telling the programmer exactly how to manipulate the object’s data. Instead,
    you can write a shorter line of code, known as a **call**, that passes a message
    to the method indicating that you need it to do something.


    For example, you can display dialog boxes, scroll bars, and buttons for a user
    of your program to type in or click on simply by sending a message to an existing
    object because programmers at Microsoft included these classes that you can use.
    At other times, you will be responsible for creating your own classes and writing
    the code for the methods that are part of that class. Whether you use existing,
    prewritten classes or create your own classes, one of your main jobs as a C++
    programmer is to communicate with the various objects in a program (and the methods
    of those objects) by passing messages. Individual objects in a program can also
    pass messages to other objects.


    When programmers write an object-oriented program, they begin by creating a class.
    A **class** can be thought of as a template for a group of similar objects. In
    a class, the programmer specifies the data (attributes) and behaviors (methods)
    for all objects that belong to that class. An object is sometimes referred to
    as an **instance** of a class, and the process of creating an object is referred
    to as **instantiation**.


    To understand the terms “class,” “instance,” and “instantiation,” it’s helpful
    to think of them in terms of a real-world example—baking a chocolate cake. The
    recipe is similar to a class and an actual cake is an object. If you wanted to,
    you could create many chocolate cakes that are all based on the same recipe. For
    example, your mother’s birthday cake, your sister’s anniversary cake, and the
    cake for your neighborhood bake sale all might be based on a single recipe that
    contains the same data (ingredients) and methods (instructions). In object-oriented
    programming, you can create as many objects as you need in your program from the
    same class.


    > > **NOTE**

    > > The preceding assumes you are using classes that someone else previously developed.
    That programmer must write code that manipulates the object’s data.'
