    \ Compile the source code file `NewDoubleTriple.cpp`.\n+   6. Execute the program.\
    \ Is the output the same?\n\n# WRITING A DO-WHILE LOOP IN C++\n\nIn Chapter 5\
    \ of *Programming Logic and Design, Fifth Edition*, you learned about the do-until\
    \ loop. C++ does not support a do-until loop, but it does have a do-while loop.\
    \ The do-while loop uses logic that can be stated as “do a while b is true.” This\
    \ is the same as a while loop, except that the condition is tested after the do-while\
    \ loop body executes once. As a result, you should choose a do-while loop when\
    \ your program logic requires the body of the loop to execute at least once. The\
    \ body of a do-while loop continues to execute as long as the expression evaluates\
    \ to true. The do-while syntax is as follows:\n\n```\n```cpp\ndo\n    statement;\n\
    while(expression);\n```\n```\n\nThe following do-while loop is a revised version\
    \ of the while loop you saw earlier, which prints the word \"Hello\" four times.\
    \ In this version, the loop is rewritten as a do-while loop.\n\n```\n```cpp\n\
    counter = 0;\ndo\n{\n    cout << \"Hello\" << endl;\n    counter++;\n} while(counter\
    \ < 4);\n```\n```"
