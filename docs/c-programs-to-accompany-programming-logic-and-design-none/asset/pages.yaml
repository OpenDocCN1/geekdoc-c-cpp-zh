- pgno: 34
  md: 'In order to write C++ code that manipulates variables in this way, you need
    to be familiar with operators. An **operator** is a symbol that tells the computer
    to perform a mathematical or logical operation. C++ has a large assortment of
    operators. We begin the discussion with a group of operators known as the arithmetic
    operators.


    # ARITHMETIC OPERATORS


    **Arithmetic operators** are the symbols used to perform arithmetic calculations.
    You are probably already very familiar with the arithmetic operators for addition
    (+) and subtraction (−). Table 2-2 lists and explains C++’s arithmetic operators.


    | Operator Name | Symbol | Example | Comment |

    |---|---|---|---|

    | Addition | + | `num1 + num2` | |

    | Subtraction | − | `num1 − num2` | |

    | Multiplication | * | `num1 * num2` | |

    | Division | / | `15/2`<br><br>`15.0 / 2.0`<br><br>`15.0 / 2` | Integer division;
    result is 7; fraction is truncated.<br><br>Floating point division; result is
    7.5.<br><br>Floating point division because one of the operands is a floating
    point number; result is 7.5. |

    | Modulus | % | `hours % 24` | Performs division and finds the remainder; result
    is 1 if the value of hours is 25. |

    | Unary plus | + | `+num1` | Maintains the value of the expression; if the value
    of num1 is 3, then +num1 is 3. |

    | Unary minus | − | `−(num1 − num2)` | If value of (num1 − num2) is 10, then −(num1
    − num2) is −10. |


    **Table 2-2** C++ arithmetic operators


    You can combine arithmetic operators and variables to create **expressions**.
    The computer evaluates each expression, and the result is a value. To give you
    an idea of how this works, assume that the value of num1 is 3 and num2 is 20,
    and that both are of data type int. With this information in mind, study the examples
    of expressions and their values in Table 2-3.


    ![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '| Expression | Value | Explanation |

    |---|---:|---|

    | `num1 + num2` | 23 | because 3 + 20 = 23 |

    | `num1 - num2` | -17 | because 3 − 20 = −17 |

    | `num2 % num1` | 2 | because 20 / 3 = 6 remainder 2 |

    | `num1 * num2` | 60 | because 3 * 20 = 60 |

    | `num2 / num1` | 6 | because 20 / 3 = 6 (remainder is truncated) |

    | `−num1` | −3 | because value of num1 is 3, therefore −num1 is −3 |


    **Table 2-3** Expressions and values


    # ASSIGNMENT OPERATORS AND THE ASSIGNMENT STATEMENT


    Another type of operator is an assignment operator. You use an assignment operator
    to assign a value to a variable. A statement that assigns a value to a variable
    is known as an **assignment statement**. In C++, there are several types of assignment
    operators. The one you will use most often is the = assignment operator, which
    simply assigns a value to a variable. Table 2-4 lists and explains some of C++’s
    assignment operators.


    | Operator Name | Symbol | Example | Comment |

    |---|---|---|---|

    | Assignment | `=` | `count = 5;` | Places the value on the right side into the
    memory location named on the left side. |

    | Initialization | `=` | `int count = 5;` | Places the value on the right side
    into the memory location named on the left side when the variable is declared.
    |

    | Assignment | `+=` | `num += 20;` | Equivalent to `num = num + 20;` |

    |  | `-=` | `num -= 20;` | Equivalent to `num = num - 20;` |

    |  | `*=` | `num *= 20;` | Equivalent to `num = num * 20;` |

    |  | `/=` | `num /= 20;` | Equivalent to `num = num / 20;` |

    |  | `%=` | `num %= 20;` | Equivalent to `num = num % 20;` |


    **Table 2-4** C++ assignment operators


    When an assignment statement executes, the computer evaluates the expression on
    the right side of the assignment operator and then assigns the result to the memory
    location associated with the variable named on the left side of the assignment
    operator. An example of an assignment statement is shown in the following code.
    Notice that the statement ends with a semicolon. In C++, assignment statements
    always end with a semicolon.


    ```

    answer = num1 * num2;

    ```'
