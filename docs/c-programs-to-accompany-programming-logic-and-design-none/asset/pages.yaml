  md: "# USING AND LOGIC\n\nWhen you write C++ programs, you can use the AND operator\
    \ (&&) to make multiple comparisons in a single decision statement. Remember when\
    \ using AND logic that all expressions must evaluate to true for the entire expression\
    \ to be true.\n\nThe C++ code that follows illustrates a decision statement that\
    \ uses the AND operator (&&) to implement AND logic:\n\n```\n```cpp\nstring medicalPlan\
    \ = \"Y\";\nstring dentalPlan = \"Y\";\nif((medicalPlan == \"Y\") && (dentalPlan\
    \ == \"Y\"))\n    cout << \"Employee has medical insurance\" <<\n         \" and\
    \ also has dental insurance.\" << endl;\nelse\n    cout << \"Employee may have\
    \ medical insurance or may \" <<\n         \"have dental insurance, but does not\
    \ have both \" <<\n         \"medical and dental insurance.\" << endl;\n```\n\
    ```\n\nIn this example, the variables named medicalPlan and dentalPlan have both\
    \ been initialized to the string constant \"Y\". When the expression medicalPlan\
    \ == \"Y\" is evaluated, the result is true. When the expression dentalPlan ==\
    \ \"Y\" is evaluated, the result is also true. Because both expressions evaluate\
    \ to true, the entire expression medicalPlan == \"Y\" && dentalPlan == \"Y\" evaluates\
    \ to true. Because the entire expression is true, the output generated is “Employee\
    \ has medical insurance and also has dental insurance.”\n\nIf you initialize either\
    \ of the variables medicalPlan or dentalPlan with a value other than \"Y\", then\
    \ the expression medicalPlan == \"Y\" && dentalPlan == \"Y\" evaluates to false,\
    \ and the output generated is “Employee may have medical insurance or may have\
    \ dental insurance, but does not have both medical and dental insurance.”\n\n\
    # USING OR LOGIC\n\nYou can use OR logic when you want to make multiple comparisons\
    \ in a single decision statement. Of course, you must remember when using OR logic\
    \ that only one expression must evaluate to true for the entire expression to\
    \ be true.\n\nThe C++ code that follows illustrates a decision statement that\
    \ uses the OR operator (||) to implement OR logic:\n\n```\n```cpp\nstring medicalPlan\
    \ = \"Y\";\nstring dentalPlan = \"N\";\nif(medicalPlan == \"Y\" || dentalPlan\
    \ == \"Y\")\n    cout << \"Employee has medical insurance or dental \" <<\n  \
    \       \"insurance or both.\" << endl;\nelse\n    cout << \"Employee does not\
    \ have medical insurance \" <<\n         \"and also does not have dental insurance.\"\
    \ << endl;\n```\n```\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_78_0.png)"
