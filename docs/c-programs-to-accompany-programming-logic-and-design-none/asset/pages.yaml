    (.), followed by the name of the method (`open`) to open a file for output. Within
    the parentheses, you place the name of the file you want to open enclosed in double
    quotes. This statement opens the file named `outputFile.dat` for writing. This
    means that the program can now write data to the file. In this example, the file
    named `outputFile.dat` is saved in the same folder as the C++ program that is
    using the file. To open a file that is saved in a different folder, a path must
    be specified as in the next example:


