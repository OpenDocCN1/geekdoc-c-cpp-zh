    \ this book.\n\n6. Execute the program. Your output should be as follows:\n\n\
    ```\nItem Name: Dishwasher\nRetail Price: $425\nWholesale Price: $275\nProfit:\
    \ $150\nSale Price: $361.25\nSale Profit: $86.25\n```\n\nNext, you will see how\
    \ to put together all you have learned in this chapter to write a C++ program\
    \ that uses sequential statements and interactive input statements.\n\n# # SEQUENTIAL\
    \ STATEMENTS AND\n# INTERACTIVE INPUT STATEMENTS\n\nThe term **sequential statements**,\
    \ or **sequence**, refers to a series of statements that must be performed in\
    \ sequential order, one after another. You use a sequence in programs when you\
    \ want to perform actions one after the other. A sequence can contain any number\
    \ of actions, but those actions must be in the proper order, and no action in\
    \ the sequence can be skipped. Note that a sequence can contain comments, which\
    \ are not considered part of the sequence itself. Comments serve as documentation,\
    \ explaining the code to the programmer and any other people who might read it.\
    \ You will learn more about comments in Chapter 3 of this book.\n\nA sequence\
    \ often includes **interactive input statements**, which are statements that ask,\
    \ or **prompt**, the user to input data. The C++ program in the following example\
    \ uses sequential statements and interactive input statements to convert a Fahrenheit\
    \ temperature to its Celsius equivalent:\n\n```\n```cpp\n// This C++ program converts\
    \ a Fahrenheit temperature to Celsius.\n// Input: Interactive\n// Output: Fahrenheit\
    \ temperature followed by Celsius temperature\n\n#include <iostream>\nusing namespace\
    \ std;\n\nint main()\n{\n    double fahrenheit;\n    double celsius;\n\n    //\
    \ Prompt user\n    cout << \"Enter Fahrenheit temperature: \";\n    // Get interactive\
    \ user input\n    cin >> fahrenheit;\n    // Calculate celsius\n    celsius =\
    \ (fahrenheit - 32.0) * (5.0/9.0);\n    // Output\n```\n```"
