- pgno: 47
  md: "> > **NOTE** Notice that a beginning curly brace (`{`) and an ending curly\
    \ brace (`}`) are used in C++ to mark the beginning and end of code that executes\
    \ as part of a loop.\n\nAccording to the pseudocode, the body of the loop is made\
    \ up of three sequential statements. The first statement calculates the `inputNumber`\
    \ multiplied by 2; the second statement prints the `calculatedAnswer`; and the\
    \ third statement retrieves the next `inputNumber` from the user. In C++, we actually\
    \ need to add an additional statement between the curly braces that mark the body\
    \ of the `while` loop. This additional statement prompts the user to enter the\
    \ next number to be doubled.\n\nIn the following example, the code that makes\
    \ up the body of the loop is in bold:\n\n```\n```cpp\nint main()\n{\n    cout\
    \ << \"Enter a number to double or 0 to end: \" << endl;\n    cin >> inputNumber;\n\
    \    while( inputNumber != 0)\n    {\n        calculatedAnswer = inputNumber *\
    \ 2;\n        cout << inputNumber << \" doubled is \" << calculatedAnswer << endl;\n\
    \        cout << \"Enter a number to double or 0 to end: \" << endl;\n       \
    \ cin >> inputNumber;\n    }\n}\n```\n```\n\nThe last line of the pseudocode instructs\
    \ you to end the program. In C++, the closing curly brace (`}`) for the `main`\
    \ function signifies the end of the `main` function and therefore the end of the\
    \ program. Note that the preceding code includes two closing curly braces. The\
    \ last one is the one that ends the `main` function and the second to last one\
    \ ends the `while` loop.\n\nWe are almost finished translating the pseudocode\
