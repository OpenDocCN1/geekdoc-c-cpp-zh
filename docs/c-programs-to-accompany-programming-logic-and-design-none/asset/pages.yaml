    # ACCUMULATING TOTALS IN SINGLE-LEVEL CONTROL BREAK PROGRAMS


    A **single-level control break** program causes a break in the logic based on
    the value of a single variable. In Chapter 8 of *Programming Logic and Design,
    Fifth Edition*, you learned about techniques you can employ to implement a single-level
    control break program. Be sure you understand these techniques before you continue
    on with this chapter. The Bookstore program described in Chapter 8 of *Programming
    Logic and Design, Fifth Edition*, is an example of a single-level control break
    program. The Bookstore program reads a record for each book that a bookstore sells,
    keeps a count of the number of books in each category, and keeps a grand total
    of all of the books carried by the bookstore. As shown in Figure 8-1, the report
    generated by this program includes book titles, a count of the number of books
    in each category, and a count of all books. The output lines that make up the
    report are shown interspersed with the program’s input. Once you learn to perform
    file input in the next chapter, the input lines will no longer appear.


