    # A PROGRAMMER-DEFINED CLASS


    Before you continue with this chapter, you should take a moment to review the
    object-oriented terminology (`class`, `attribute`, and `method`) presented in
    Chapter 1 of this book and in Chapter 11 of *Programming Logic and Design, Fifth
    Edition, Comprehensive*.


    You have been using prewritten classes, objects, and methods throughout this book.
    For example, you have used the open method that is a member of the `ifstream`
    and `ofstream` class to open input and output files. In this section, you learn
    how to create your own class that includes attributes and methods of your choice.
    In programming terminology, a class created by the programmer is referred to as
    a **programmer-defined class** or a **custom class**.


    To review, remember that procedural programming focuses on: 1) declaring data;
    2) defining functions that are separate from the data; and 3) calling those functions
    to operate on the data. This is the style of programming you have been using in
    Chapters 1 through 9 of this book. Object-oriented programming also focuses on
    data and the functions that you need to manipulate that data. However, object-oriented
    programming is quite different from procedural programming. Data and functions
    (which are called “methods” in object-oriented programming) are **encapsulated**,
    or contained, within a class. Individual objects are created as an instance of
    a class. The program tells an object to perform tasks by passing messages to it.
    Such a message consists of an instruction to execute one of the class’s methods.
    The class method then manipulates the data (which is part of the object itself).


    # CREATING A PROGRAMMER-DEFINED CLASS


    In Chapter 11 of *Programming Logic and Design, Fifth Edition, Comprehensive*,
    you studied pseudocode for the Employee class. This pseudocode is shown in Figure
    10-1. The C++ code that implements the Employee class is shown in Figure 10-2.


