- pgno: 109
  md: "You should do the exercises and labs in this chapter after you have finished\
    \ Chapter 6 of *Programming Logic and Design, Fifth Edition*, by Joyce Farrell.\
    \ In this chapter, you learn how to use C++ to declare and initialize arrays.\
    \ You then access the elements of an array to assign values and process them within\
    \ your program. You also learn why it is important to stay within the bounds of\
    \ an array. In addition, you study some programs written in C++ that implement\
    \ the logic and design presented in *Programming Logic and Design, Fifth Edition*.\n\
    \n# ARRAY BASICS\n\nAn **array** is a group of data items in which all items have\
    \ the same data type, are referenced using the same variable name, and are stored\
    \ in consecutive memory locations. To reference an individual element in an array,\
    \ you use a subscript. Think of a **subscript** as the position number of a value\
    \ within an array. It is important for you to know that in C++, subscript values\
    \ begin with 0 (zero) and end with *n*-1, where *n* is the number of items stored\
    \ in the array.\n\nTo use an array in a C++ program, you must first learn how\
    \ to declare an array, initialize an array with predetermined values, access array\
    \ elements, and stay within the bounds of an array. In the next section you’ll\
    \ focus on the first step, declaring arrays.\n\n# DECLARING ARRAYS\n\nBefore you\
    \ can use an array in a C++ program, you must first declare it. That is, you must\
    \ give it a name and specify the data type for the data that will be stored in\
    \ it. In some cases, you also specify the number of items that will be stored\
    \ in the array. The following code shows how to declare an array named `cityPopulations`\
    \ that will be used to store four `int`s, and an array named `cities` that will\
    \ be used to store four `string`s:\n\n```\n    int cityPopulations[4];\n    string\
    \ cities[4];\n```\n\nAs you can see in this example, you begin by specifying the\
    \ data type of the items that will be stored in the array. The data type is followed\
    \ by the name of the array and then a pair of square brackets. Within the square\
    \ brackets, you see an integer value that specifies the number of elements this\
    \ array can hold.\n\nAs shown in Figure 6-1, the compiler allocates enough consecutive\
    \ memory locations to store four elements of data type `int` for the array named\
    \ `cityPopulations`. If `cityPopulations[0]` is stored at memory address 1000,\
    \ then the address of `cityPopulations[1]` is 1004 because each `int` requires\
    \ 4 bytes of memory. Similarly, `cityPopulations[3]` is at address 1012.\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_109_0.png)\n\
    \n> > **NOTE**\n> > If an array is declared to store items of data type `double`,\
    \ 8 bytes are allocated for each item in the array."
  merge: -1
  img_proc: true
- pgno: 110
  md: "The `cityPopulations` array provides an example of how memory is allocated\
    \ for arrays that contain primitive data types. Memory allocation is different\
    \ for arrays of `strings` because a `string` is an object in C++, not a primitive\
    \ data type. Using the Visual C++ compiler and Windows Vista, 28 bytes of memory\
    \ are allocated for a `string` object. This represents the size of the object.\n\
    \nAdditional memory for the characters that make up the string might be allocated\
    \ **dynamically** (as your program runs) when a value is stored in the `string`\
    \ object. This is shown in Figure 6-2.\n\n> **NOTE**\n> \n> The amount of memory\
    \ allocated for a string object may be different on your system.\n\n```\nstring\
    \ cities[4];\ncities[0] = \"Chicago\";\n```\n\n![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_110_0.png)\n\
    \n**Figure 6-2** Memory allocation for `cities` array\n\nIn Figure 6-2, the compiler\
    \ allocates enough consecutive memory locations to store four `string` objects\
    \ for the array named `cities`. If the address of `cities[0]` is 1000, the address\
    \ of `cities[1]` is 1028, and the address of `cities[3]` is 1084 because each\
    \ reference requires 28 bytes of memory. When a string is assigned to `cities[0]`,\
    \ memory is dynamically allocated at another memory address. This address is then\
    \ stored in the array. When the statement `cities[0] = \"Chicago\";` executes,\
    \ the memory dynamically allocated for Chicago begins at address 5000 and then\
    \ that address (5000) is stored in the first element of the array. An example\
    \ of creating `string` objects is presented later in this chapter.\n\n> **NOTE**\n\
    > \n> Dynamic memory allocation is an advanced topic that you will learn more\
    \ about when you take additional courses in C++ programming.\n\n# INITIALIZING\
    \ ARRAYS\n\nIn C++, array elements are not automatically initialized to any value\
    \ when the array is declared. Therefore, all of the elements of an array contain\
    \ a **garbage value**, which means they contain the values last stored at the\
    \ memory location assigned to your array. Because these values are not useful\
    \ in your program, it is a good idea to initialize arrays to all zeroes for arrays\
    \ that store numbers and to empty strings for arrays that store strings. Two double\
    \ quotes with no space between, `\"\"`, is the empty string in C++.\n\n> **NOTE**\n\
    > \n> When you initialize an array when you declare it, you do not specify the\
    \ array's size within the square brackets. Instead, you use an empty pair of square\
    \ brackets.\n\nYou can and will sometimes want to initialize arrays with values\
    \ that you choose. You do this when you declare the array. To initialize an array\
    \ when you declare it, use curly braces to surround a comma-delimited list of\
    \ data items, as shown in the following example:\n\n```\nint cityPopulations[]\
    \ = {9500000, 871100, 23900, 40100};\nstring cities[] = {\"Chicago\", \"Detroit\"\
    , \"Batavia\", \"Lima\"};\n```\n\nYou can also use assignment statements to provide\
    \ values for array elements after an array is declared, as in the following example:\n\
    \n> **NOTE**\n> \n> These initializations create four elements for each array\
    \ and assign values to them.\n\n```\ncityPopulations[0] = 9500000;\ncities[0]\
    \ = \"Chicago\";\n```"
  merge: -1
  img_proc: true
