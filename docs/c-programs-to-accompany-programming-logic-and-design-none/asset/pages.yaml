  md: 'As shown in Table 4-3, the AND operator has a higher **precedence** than the
    OR operator, meaning its Boolean values are evaluated first. Also notice that
    the relational operators have higher precedence than the equality operators and
    both the relational and equality operators have higher precedence than the AND
    and OR operators. All of these operators have left-to-right associativity.


    To see how to use the logical operators and the relational operators in expressions,
    first assume that the variables number1 and number2 are declared and initialized
    as shown in the following code:


    ```

    ```cpp

    int number1 = 10;

    int number2 = 15;

    ```

    ```


    Now, you write the following expression in C++:


    ```

    ```cpp

    number1 == 8 && number2 == number1 || number2 == 15

    ```

    ```


    Looking at Table 4-3, you can see that the equality operator (==) has a higher
    level of precedence than the AND operator (&&) and the AND operator (&&) has a
    higher level of precedence than the OR operator (||). Also, notice that there
    are three == operators in the expression; thus, the left-to-right associativity
    rule applies. Figure 4-1 illustrates the order in which the operators are used.


    ![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_62_0.png)


    > > Remember that you can change the order of precedence by using parentheses.


    As you can see in Figure 4-1, it takes five steps, following the rules of precedence
    and associativity, to determine the value of the expression.'
