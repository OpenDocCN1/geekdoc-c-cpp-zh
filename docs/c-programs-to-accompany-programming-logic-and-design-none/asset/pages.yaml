- pgno: 29
  md: 'In this chapter, you learn about writing programs that use variables and arithmetic
    operators, and that receive interactive input from a user of your programs. We
    begin by reviewing variables and learning how to use them in a C++ program. You
    should do the exercises and labs in this chapter only after you have finished
    Chapter 1 of your book, *Programming Logic and Design, Fifth Edition*, by Joyce
    Farrell.


    # VARIABLES


    As you know, a **variable** is a named location in the computer’s memory whose
    contents can vary (thus the term variable). You use a variable in a program when
    you need to store values. The values stored in variables often change as a program
    executes.


    In C++, you must declare variables before you can use them in a program. Declaring
    a variable is a two-part process: you give the variable a name, and you specify
    its data type. You’ll learn about data types shortly. But first, we’ll focus on
    the rules for naming variables in C++.


    # VARIABLE NAMES


    Variable names in C++ can consist of letters, numerical digits, and the underscore
    character, but they cannot begin with a digit. Also, you cannot use a C++ keyword
    for a variable name. As you learned in Chapter 1 of this book, a keyword is a
    word with a special meaning in C++. The following are all examples of legal variable
    names in C++: `my_var`, `num6`, `intValue`, and `firstName`. Table 2-1 lists some
    examples of invalid variable names, and explains why each is invalid.


    | Name of Variable | Explanation |

    |---|---|

    | `3wrong` | Invalid because it begins with a digit |

    | `$don''t` | Invalid because it contains a single quotation mark and begins with
    a dollar sign |

    | `int` | Invalid because it is a C++ keyword |

    | `first name` | Invalid because it contains a space |


    **Table 2-1** Invalid variable names


    When naming variables, keep in mind that C++ is case sensitive—in other words,
    C++ knows the difference between uppercase and lowercase characters. That means
    `value`, `Value`, and `VaLuE` are three different variable names in C++.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '> **NOTE** By convention, variable names in C++ begin with a lowercase letter;
    all other words in the name begin with an uppercase letter, for example, `firstName`.
    You cannot include spaces between the words in a variable name. This naming convention
    is called camel case. C++ programmers sometimes use other conventions, but in
    this book variables are named using the camel case convention.


    In C++, variable names can be as long as you want. A good rule is to give variables
    meaningful names that are long enough to describe how the variable is used, but
    not so long that you make your program hard to read or cause yourself unnecessary
    typing. For example, a variable named `firstName` will clearly be used to store
    someone’s first name. The variable name `freshmanStudentFirstName` is descriptive
    but inconveniently long; the variable name `fn` is too short to be meaningful
    at first glance. The variable name `x2rh5` is not meaningful.


    # C++ DATA TYPES


    In addition to specifying a name for a variable, you also need to specify a particular
    data type for that variable. A variable’s **data type** dictates the amount of
    memory that is allocated for the variable, the type of data that you can store
    in the variable, and the types of operations that can be performed using the variable.
    There are many different kinds of data types, but in this book we will focus on
    the most basic kind of data types, known as **primitive data types**. There are
    five primitive data types in C++: `int`, `float`, `double`, `char`, and `bool`.
    Some of these data types (such as `int`, `double`, and `float`) are used for variables
    that will store numeric values, and are referred to as numeric data types. The
    others have specialized purposes. For example, the `bool` data type is used to
    store a value of either true or false and the `char` data type is used to store
    a single character.


    You will not use all of C++’s primitive data types in the programs you write in
    this book. Instead, you will focus on two of the numeric data types (`int` and
    `double`). The `int` data type is used for values that are whole numbers. For
    example, you could use a variable with the data type `int` to store someone’s
    age (for example, 25) or the number of students in a class (for example, 35).
    A variable of the `int` data type consists of 32 bits (4 bytes) of space in memory.
    You use the data type `double` to store a floating-point value (that is, a fractional
    value), such as the price of an item in dollars and cents (2.95) or a measurement
    in feet or inches (2.5). A variable of the `double` data type consists of 64 bits
    (8 bytes) of space in memory. You will learn about using other data types as you
    continue to learn more about C++ in subsequent courses.


    The `int` and `double` data types will be adequate for all the numeric variables
    you will use in this book. But what about when you need to store a group of characters
    (such as a person’s name) in a variable? In programming, we refer to a group of
    one or more characters as a **string**. An example of a string is the last name
    “Wallace” or a product type such as a “desk”. There is no primitive data type
    in C++ for storing strings; instead, they are stored in an object known as a string
    object. In addition to working with the `int` and `double` data types in this
    book, you will also work with strings.


    > **NOTE** You used the `int` data type in Chapter 1 as the return type for the
    `main` function in the Hello World program.


    > **NOTE** The actual size of the built-in data types may be different on different
    computers, but the sizes noted in this book indicate the usual sizes on a 32-bit
    computer.


    > **NOTE** In *Programming Logic and Design, Fifth Edition*, data type `num` is
    used to refer to all numeric data types. A distinction is not made between `int`
    and `double` as it is in C++.'
  merge: -1
  img_proc: true
