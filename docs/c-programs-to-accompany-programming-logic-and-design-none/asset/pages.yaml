- pgno: 83
  md: "In this chapter, you learn how to use C++ to program three types of loops:\
    \ a while loop, a do-while loop, and a for loop. You also learn how to nest loops,\
    \ how to use a loop to help you accumulate a total in your programs, and how to\
    \ use a loop to validate user input. But before you get started with learning\
    \ about C++’s loops, it is helpful to learn about two additional operators: the\
    \ increment and decrement operators.\n\nYou should do the exercises and labs in\
    \ this chapter after you have finished Chapter 5 in your book, *Programming Logic\
    \ and Design, Fifth Edition*, by Joyce Farrell. In that chapter, you learned that\
    \ loops change the flow of control in a program by allowing a programmer to direct\
    \ the computer to execute a statement or a group of statements multiple times.\n\
    \n# # THE INCREMENT (++) AND DECREMENT (--) OPERATORS\n\n> > **NOTE**  \n> > The\
    \ “l” in “lvalue” represents “left.”\n\n> > **NOTE**  \n> > The increment and\
    \ decrement operators may be used only with integer data types.\n\nYou often use\
    \ the increment and decrement operators when your programs require loops. These\
    \ operators provide a concise, efficient method for adding 1 to (incrementing)\
    \ or subtracting 1 from (decrementing) a value. An **lvalue** is an area of memory\
    \ in which a value that your program needs may be stored. In C++ code, you place\
    \ an lvalue on the left side of an assignment statement. Recall that an assignment\
    \ statement stores a value at a memory location that is associated with a variable,\
    \ and you place a variable name on the left side of an assignment statement.\n\
    \nFor example, the C++ assignment statement.\n\n```\n```cpp\nnumber = 10;\n```\n\
    ```\n\nassigns the value 10 to the variable named `number`. This causes the computer\
    \ to store the value 10 at the memory location associated with `number`. Because\
    \ the increment and decrement operators add 1 to or subtract 1 from an lvalue,\
    \ the statement `number++;` is equivalent to `number = number + 1;` and the statement\
    \ `number--;` is equivalent to `number = number - 1;`. Each expression in these\
    \ statements changes or writes to the memory location associated with the variable\
    \ named `number`.\n\nBoth the increment and decrement operators have prefix and\
    \ postfix forms. Which form you use depends on when you want to increment or decrement\
    \ the value stored in the variable. When you use the **prefix form**, as in `++number`,\
    \ you place the operator in front of the name of the variable. This increments\
    \ or decrements the value immediately. When you use the **postfix form**, as in\
    \ `number++`, you place the operator after the name of the variable. This increments\
    \ or decrements the value after it is used.\n\nThe example that follows illustrates\
    \ the use of both forms of the increment operator in C++:\n\n```\n```cpp\nx =\
    \ 5;\ny = x++;   // Postfix form\n           // y is assigned the value of x,\n\
    \           // then x is incremented.\n           // Value of y is 5.\n      \
    \     // Value of x is 6.\n```\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "```\n    x = 5;\n    y = ++x;   // Prefix form\n               // x is incremented\
    \ first, then\n               // the value of x is assigned to y.\n          \
    \     // Value of y is 6.\n               // Value of x is 6.\n```\n\nYou might\
    \ understand the postfix form better if you think of the statement y = x++; as\n\
    being the same as the following:\n\n```\n    x = 5;\n    y = x;\n    x = x + 1;\n\
    ```\n\nTo understand the prefix form better, think of y = ++x; as being the same\
    \ as the following:\n\n```\n    x = 5;\n    x = x + 1;\n    y = x;\n```\n\n# ##\
    \ EXERCISE 5-1: USING THE INCREMENT AND DECREMENT OPERATORS\n\nIn this exercise,\
    \ you examine the code and use what you have learned about C++'s increment\nand\
    \ decrement operators to answer the related questions.\n\n+   1. Examine the following\
    \ code:\n+   \n+           x = 7;\n+           y = ++x;\n+   \n+       After this\
    \ code executes, what is the value of x? ____ y? ____\n+   2. Examine the following\
    \ code:\n+   \n+           x = 7;\n+           y = x++;\n+   \n+       After this\
    \ code executes, what is the value of x? ____ y? ____\n+   3. Examine the following\
    \ code:\n+   \n+           x = 7;\n+           y = --x;\n+   \n+       After this\
    \ code executes, what is the value of x? ____ y? ____\n+   4. Examine the following\
    \ code:\n+   \n+           x = 7;\n+           y = x--;\n+   \n+       After this\
    \ code executes, what is the value of x? ____ y? ____"
