- pgno: 210
  md: 'Next, on line 10, the maximum speed for automobileOne is set to 100.0 miles
    per hour (mph) using the inherited setMaxSpeed method. Line 11 uses the inherited
    setSpeed method to set the current speed for automobileOne at 35.0 mph and on
    line 12 automobileOne accelerates by 10.0 mph using the accelerate method that
    was overridden in the Automobile class. The cout statement on line 13 produces
    the following output: “The current speed is 45”. Notice that the inherited getSpeed
    method is used in the cout statement to retrieve automobileOne’s current speed.
    On line 15, automobileOne invokes the overridden accelerate method again; this
    time to accelerate by 60.0 mph. Accelerating by 60.0 mph would cause automobileOne
    to travel faster than its maximum speed, and causes the accelerate method that
    was overridden in the Automobile class to produce the following output: “This
    Automobile cannot go that fast”. This output shows that the overridden accelerate
    method is used with an Automobile object. The cout statement on line 16 produces
    the following output: “The current speed is 45”. This output shows that the accelerate
    method will not allow this Automobile object to travel faster than its maximum
    speed.


    Next, on line 18, automobileOne invokes the setConvertibleStatus method and passes
    a true value that indicates this Automobile object is a convertible. The getConvertibleStatus
    method is invoked on line 19 where its return value is assigned to the bool variable
    convertible. The value of convertible is tested in the if statement on line 21.
    If the value of convertible is true, the cout statement on line 22 executes, generating
    the following output: “This automobile is a convertible”. If the value of convertible
    is false, the cout statement on line 24 executes, generating the following output:
    “This automobile is not a convertible”.


    The output from the MyAutomobileClassProgram is shown in Figure 10-10.


