    # C++ COMMENTS


    In Chapter 3 of your book, *Programming Logic and Design, Fifth Edition*, you
    learned about **program comments**, which are statements that do not execute.
    You use comments in C++ programs to explain your logic to people who read your
    source code. The C++ compiler ignores comments.


    You can choose from two commenting styles in C++. In the first, you type two forward
    slash characters (`//`) at the beginning of each comment that you want the compiler
    to ignore. This style is useful when you only want to mark a single line or part
    of a line as a comment. In the second style, you enclose a block of lines with
    the characters `/*` and `*/`. This style is useful when you want to mark several
    lines as a comment. You may place comments anywhere in a C++ program except within
    a statement.


    The following example shows both styles of comments added to the number-doubling
    program from the previous section. Note that the first eight lines of the program
    make up a multiline, block comment that explains some basic information about
    the program.


    A second block comment follows this first one, introducing the code that creates
    the number-doubling program. Next, several single-line comments are included throughout
    to describe various parts of the program.


    > > **NOTE**

    > > It is a good programming practice to include header comments that provide
    basic information about a program.'
