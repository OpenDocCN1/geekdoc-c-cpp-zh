  md: "This process continues until the value of `count` becomes 10. At this time,\
    \ 10 is not less than `NUM_LOOPS`, so the second expression results in a false\
    \ value, and causes an exit from the `for` loop.\n\nThe counter-controlled loop\
    \ that displays the word “Hello” four times (explained in the “Using a Counter\
    \ to Control a Loop” section of this chapter) can be rewritten using a `for` loop\
    \ instead of the `while` loop. In fact, when you know how many times a loop will\
    \ execute, it is considered a good programming practice to use a `for` loop instead\
    \ of a `while` loop.\n\nTo rewrite the `while` loop as a `for` loop, you can change\
    \ the statement `int counter = 0;` to `int counter;` because you initialize `counter`\
    \ with the value 0 in expression one. You can also delete `counter++;` from the\
    \ loop body because you increment `counter` in expression three. You continue\
    \ to print the word “Hello” in the body of the loop. The following code sample\
    \ illustrates this `for` loop:\n\n```\n```cpp\nint counter;\nfor(counter = 0;\
    \ counter < 4; counter++)\n{\n    cout << \"Hello\" << endl;\n}\n```\n```\n\n\
    > > **NOTE:** The curly braces are not required because now the loop body contains\
    \ just one statement. However, it is considered a good programming practice to\
    \ include them, as it makes the code more readable and may help prevent an error\
    \ later if additional statements are added to the body of the loop.\n\n# EXERCISE\
    \ 5-5: USING A FOR LOOP\n\nIn this exercise, you use what you have learned about\
    \ `for` loops to answer questions about the following code:\n\n```\n```cpp\nconst\
