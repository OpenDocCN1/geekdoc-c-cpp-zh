- pgno: 60
  md: 'The following code samples illustrate how relational operators are used in
    expressions:


    +   - » number1 < number2 evaluates to `true` because 10 is less than 15.

    +   - » number1 <= number2 evaluates to `true` because 10 is less than or equal
    to 15.

    +   - » number1 > number2 evaluates to `false` because 10 is not greater than
    15.

    +   - » number1 >= number2 evaluates to `false` because 10 is not greater than
    or equal to 15.

    +   - » number1 == number2 evaluates to `false` because 10 is not equal to 15.

    +   - » number1 != number2 evaluates to `true` because 10 is not equal to 15.


    # ### LOGICAL OPERATORS


    You can use another type of Boolean operator, **logical operators**, when you
    need to ask more than one question but you want to receive only one answer. For
    example, in a program, you may want to ask if a number is between the values 1
    and 10. This actually involves two questions. You need to ask if the number is
    greater than 1 AND if the number is less than 10. Here, you are asking two questions
    but you want only one answer—either yes (`true`) or no (`false`).


    Like statements that contain relational expressions, statements that contain logical
    operators evaluate to `true` or `false`, thereby permitting decision-making in
    your programs.


    Table 4-2 lists the logical operators used in C++.


    | Operator | Name | Description |

    |---|---|---|

    | `&&` | AND | All expressions must evaluate to `true` for the entire expression
    to be `true`; this operator is written as two `&` symbols with no space between
    them. |

    | `\|\|` | OR | Only one expression must evaluate to `true` for the entire expression
    to be `true`; this operator is written as two `\|` symbols with no space between
    them. |

    | `!` | NOT | This operator reverses the value of the expression; for example,
    if the expression evaluates to `false`, then reverse it so that the expression
    evaluates to `true`. |


    **Table 4-2** Logical operators


    To see how to use the logical operators, suppose you declare two variables: an
    `int` named `number1` that you initialize with the value 10; and another `int`
    variable named `number2` that you initialize with the value 15. The declaration
    statements for these variables are shown in the following code:


    ```

    ```cpp

    int number1 = 10;

    int number2 = 15;

    ```

    ```


    ![](img/08ab7b9c5b7606ff5c1616ca55d8b41c_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The following code samples illustrate how you can use the logical operators
    along with the relational operators in expressions:


    +   - `(number1 > number2) || (number1 == 10)` evaluates to `true` because the
    first expression evaluates to `false`, 10 is not greater than 15, and the second
    expression evaluates to `true`, 10 is equal to 10. Only one expression needs to
    be true using OR logic for the entire expression to be `true`.

    +   - `(number1 > number2) && (number1 == 10)` evaluates to `false` because the
    first expression is `false`, 10 is not greater than 15, and the second expression
    is `true`, 10 is equal to 10. Using AND logic, both expressions must be `true`
    for the entire expression to be `true`.

    +   - `(number1 != number2) && (number1 == 10)` evaluates to `true` because both
    expressions are `true`; that is, 10 is not equal to 15 and 10 is equal to 10.
    Using AND logic, if both expressions are `true`, then the entire expression is
    `true`.

    +   - `!(number1 == number2)` evaluates to `true` because the expression evaluates
    to `false`, 10 is not equal to 15. The `!` operator then reverses `false`, which
    results in a `true` value.


    # RELATIONAL AND LOGICAL OPERATOR PRECEDENCE AND ASSOCIATIVITY


    Like the arithmetic operators discussed in Chapter 2, the relational and logical
    operators are evaluated according to specific rules of associativity and precedence.
    Table 4-3 shows the precedence and associativity of the operators discussed thus
    far in this book.


    | Operator Name | Operator Symbol(s) | Order of Precedence | Associativity |

    |---|---|---|---|

    | Parentheses | `()` | First | Left to right |

    | Unary | `- + !` | Second | Right to left |

    | Multiplication, division, and modulus | `* / %` | Third | Left to right |

    | Addition and subtraction | `+ -` | Fourth | Left to right |

    | Relational | `< > <= >=` | Fifth | Left to right |

    | Equality | `== !=` | Sixth | Left to right |

    | AND | `&&` | Seventh | Left to right |

    | OR | `&#124;&#124;` | Eighth | Left to right |

    | Assignment | `= += -= *= /= %=` | Ninth | Right to left |


    Table 4-3 Order of precedence and associativity


    > > **NOTE** Some symbols appear in Table 4-3 more than once because they have
    more than one meaning. For example, when the − operator is used before a number
    or a variable that contains a number, it is interpreted as the unary − operator.
    When the − operator is used between operands, it is interpreted as the subtraction
    operator.'
