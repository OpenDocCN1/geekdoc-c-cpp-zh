  md: "A loop is often used to assign values to the elements in an array, as shown\
    \ here:\n\n```\n```cpp\nint loopIndex;\nfor(loopIndex = 0; loopIndex < 3; loopIndex++)\n\
    {\n    cityPopulations[loopIndex] = 12345;\n    cities[loopIndex] = \"AnyCity\"\
    ;\n}\n```\n```\n\nThe first time this loop is encountered, loopIndex is assigned\
    \ the value 0. Because 0 is less than 3, the body of the loop executes, assigning\
    \ the value 12345 to cityPopulations[0] and the value “AnyCity” to cities[0].\
    \ Next, the value of loopIndex is incremented and takes on the value 1. Because\
    \ 1 is less than 3, the loop executes a second time and the value 12345 is assigned\
    \ to cityPopulations[1] and “AnyCity” is assigned to cities[1]. Each time the\
    \ loop executes, the value of loopIndex is incremented. This allows you to access\
    \ a different location in the arrays each time the body of the loop executes.\n\
    \n> > **NOTE**\n> > Remember that subscript values begin with 0 (zero) in C++.\n\
    \n# ## ACCESSING ARRAY ELEMENTS\n\nYou need to access individual locations in\
    \ an array when you assign a value to an array element, print its value, change\
    \ its value, assign the value to another variable, and so forth. In C++, you use\
    \ an integer expression placed in square brackets to indicate which element in\
    \ the array you want to access. This integer expression is the subscript.\n\n\
    > > **NOTE**\n> > Later in this chapter, you will learn to use a named constant\
    \ in an array declaration.\n\nThe following C++ program declares two arrays of\
    \ data type double, initializes an array of data type double, copies values from\
    \ one array to another, changes several values stored in the array named target,\
    \ and prints the values of the arrays named source and target. You can compile\
    \ and execute this program if you like. It is stored in the file named ArrayTest.cpp.\
    \ Figure 6-3 shows the output generated by the ArrayTest program.\n\n```\n```cpp\n\
    #include <iostream>\n#include <string>\nusing namespace std;\nint main()\n{\n\
    \    double target[3];\n    double source[] = {1.0, 5.5, 7.9};\n    int loopIndex;\n\
    \    // Copy values from source to target\n    for(loopIndex = 0; loopIndex <\
    \ 3; loopIndex++)\n        target[loopIndex] = source[loopIndex];\n    // Assign\
    \ values to two elements of target\n    target[0] = 2.0;\n    target[1] = 4.5;\n\
    \    // Print values stored in source and target\n    for(loopIndex = 0; loopIndex\
    \ < 3; loopIndex++)\n    {\n        cout << \"Source \" << source[loopIndex] <<\
    \ endl;\n        cout << \"Target \" << target[loopIndex] << endl;\n    }\n}\n\
    ```\n```"
