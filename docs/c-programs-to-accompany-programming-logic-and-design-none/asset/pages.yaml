  md: 'As you can see in Figure 8-3, the C++ program begins on line 1 with comments
    that describe what the program does. (Remember, the line numbers shown in this
    program are not part of the C++ code. They are included for reference only.) The
    program also includes comments that describe the program’s input and output. Next
    come two preprocessor directives on lines 6 and 7, the `using namespace std;`
    statement on line 8, and the function declaration for the `categoryChange` function
    on line 9. Notice that the `categoryChange` function returns an `int` and accepts
    two `int`s as arguments. The C++ code that begins the `main` function is on line
    10.


    Within the `main` function, lines 12 through 23 declare variables and constants,
    initialize them when appropriate, and then print the heading for the report. The
    `cout` statement on line 23 includes the string “\t\t\t\t\t\t” as part of the
    output it generates. In C++, “\t” represents a tab character. Thus, the string
    “\t\t\t\t\t\t” represents a string of six tab characters. Including this string
    in a `cout` statement forces lines to be indented six tabs. That means the statement
    `cout << "\t\t\t\t\t\t" << HEADING << endl;` indents six times before printing
    the constant `HEADING` and a newline character.


    The next step is to perform a priming read to get the first input record, which
    consists of a single book’s title, author, price, and category. You learned about
    performing a priming read in Chapter 3 of this book and in Chapter 2 of *Programming
    Logic and Design, Fifth Edition*.


    Notice that the C++ code in the priming read (lines 24 and 25) is a little different
    than the pseudocode. When the user is asked to input a book’s title, he or she
    is also instructed to enter the word “done” after inputting records. Also, an
    `if` statement is used on line 26 to test if the user entered a book’s title or
    the word “done”. If the user is done entering records, the result of this test
    will be `true`, causing the `bool` value `false` to be assigned to the variable
    named `notDone` on line 28 and the remainder of the input statements asking for
    the author, category, and price will not execute. The `bool` variable named `notDone`
    is used later in the program to control the `while` loop. If the user is not finished
    entering records, he or she is prompted to enter the rest of the book’s data:
    the author, category, and price on lines 32 through 37. On line 38, the value
    of the current book’s category (`category`) is assigned to the variable named
    `prevCategory`. The variable `category` serves as the control break variable.


    > > **NOTE** For the sake of simplicity, this example program only allows the
    user to enter single-word book titles and the author’s last name. This simplification
    is designed to keep the input straightforward. Inputting strings that contain
    multiple words involves learning some intricacies of C++ that you will be introduced
    to when you take a C++ course.


    Next comes the `while` loop (line 40), which continues to execute as long as the
    value of the `bool` variable `notDone` is `true`. Within the body of the `while`
    loop, the `if` statement tests the control break variable `category` on line 42.
    The `if` statement’s job is to determine if the record the user is currently working
    with has the same category as the previous record’s category. If it does not,
    this indicates the beginning of a new category. As a result, the program calls
    the `categoryChange` function (line 44), which is the control'
