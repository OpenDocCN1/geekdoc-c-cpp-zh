    \ how a nested if statement works. If expressionA, which is enclosed in parentheses,\
    \ evaluates to true, then the computer executes statementA. If expressionA evaluates\
    \ to false, then the computer will evaluate expressionB. If expressionB evaluates\
    \ to true, then the computer will execute statementB. If expressionA and expressionB\
