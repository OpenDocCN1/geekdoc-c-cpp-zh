  md: 'You should complete the exercises and labs in this chapter only after you have
    finished Chapter 4 of your book, *Programming Logic and Design, Fifth Edition*,
    by Joyce Farrell. In this chapter, you practice using C++’s relational and logical
    operators to write Boolean expressions. You also learn the C++ syntax for decision
    statements, including the `if` statement, the `if-else` statement, nested `if`
    statements, and `switch` statements. Finally, you learn to write C++ statements
    that make multiple comparisons.


    # BOOLEAN OPERATORS


    You use Boolean operators in expressions when you want to compare values in an
    expression. When you use a Boolean operator in an expression, the evaluation of
    that expression results in a value that is true or false. In C++, you can subdivide
    the **Boolean operators** into two groups: relational operators and logical operators.
    We begin the discussion with the relational operators.


    # RELATIONAL OPERATORS


    In the context of programming, the term **relational** refers to the connections,
    or relationships, between values. For example, one value might be greater than
    another, less than another, or equal to the other value. The terms “greater than,”
    “less than,” and “equal to” all refer to a relationship between two values. As
    with all Boolean operators, a **relational operator** allows you to ask a question
    that results in a true or false answer. Depending on the answer, your program
    will execute different statements that can perform different actions.


    Table 4-1 lists the relational operators used in C++.


    | Operator | Meaning |

    |---|---|

    | `<` | Less than |

    | `<=` | Less than or equal to |

    | `>` | Greater than |

    | `>=` | Greater than or equal to |

    | `==` | Equal to (two equal signs with no space between them) |

    | `!=` | Not equal to |


    **Table 4-1** Relational operators


    To see how to use relational operators, suppose you declare two variables: an
    int named number1 that you initialize with the value 10 and another int variable
    named number2 that you initialize with the value 15. The following code shows
    the declaration statements for these variables:


    ```

    ```cpp

    int number1 = 10;

    int number2 = 15;

    ```

    ```'
