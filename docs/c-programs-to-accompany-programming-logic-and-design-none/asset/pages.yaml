- pgno: 37
  md: "As you can see in Table 2-5, the parentheses operator, ( ), has the highest\
    \ precedence. You use this operator to change the order in which operations are\
    \ performed. Note the following example:\n\n```\naverage = test1 + test2 / 2;\n\
    ```\n\nThe task of this statement is to find the average of two test scores. The\
    \ way this statement is currently written, the compiler will divide the value\
    \ in the test2 variable by 2, and then add it to the value in the test1 variable.\
    \ So, for example, if the value of test1 is 90 and the value of test2 is 88, then\
    \ the value assigned to average will be 134, which is obviously not the correct\
    \ average of these two test scores. By using the parentheses operator in this\
    \ example, you can force the addition to occur before the division. The correct\
    \ statement looks like this:\n\n```\naverage = (test1 + test2) / 2;\n```\n\nIn\
    \ this example, the value of test1, 90, is added to the value of test2, 88, and\
    \ then the sum is divided by 2. The value assigned to average, 89, is the correct\
    \ result.\n\n# EXERCISE 2-3: UNDERSTANDING OPERATOR PRECEDENCE AND ASSOCIATIVITY\n\
    \nIn this exercise, you use what you have learned about operator precedence and\
    \ associativity in C++. Study the following code and then answer the subsequent\
    \ questions.\n\n```\n```cpp\n// This program demonstrates the precedence and\n\
    // associativity of operators.\n#include <iostream>\nusing namespace std;\nint\
    \ main()\n{\n    int value1 = 9;\n    int value2 = 3;\n    int value3 = 10;\n\
    \    int answer1, answer2, answer3;\n    int answer4, answer5, answer6;\n\n  \
    \  answer1 = value1 * value2 + value3;\n    cout << \"Answer 1: \" << answer1\
    \ << endl;\n\n    answer2 = value1 * (value2 + value3);\n    cout << \"Answer\
    \ 2: \" << answer2 << endl;\n\n    answer3 = value1 + value2 - value3;\n    cout\
    \ << \"Answer 3: \" << answer3 << endl;\n\n    answer4 = value1 + (value2 - value3);\n\
    \    cout << \"Answer 4: \" << answer4 << endl;\n```\n```"
