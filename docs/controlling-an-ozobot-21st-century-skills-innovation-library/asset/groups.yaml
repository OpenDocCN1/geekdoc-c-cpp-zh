    - Benson, Pete. *Scratch*. Ann Arbor, MI: Cherry Lake Publishing, 2016.

    - Roslund, Samantha, and Emily Puckett Rodgers. *Makerspaces*. Ann Arbor, MI:
    Cherry Lake Publishing, 2014.


    ### Web Sites


    - **OzoBlockly** *www.ozoblockly.com* Use your computer to control Ozobot using
    OzoBlockly.

    - **Ozobot** *www.ozobot.com* Find lots of fun things to do with Ozobot on the
    Ozobot Web site.

    - **YouTube–Ozobot** *www.youtube.com/user/OZOBOT/videos* Watch videos and learn
    more about Ozobot.


