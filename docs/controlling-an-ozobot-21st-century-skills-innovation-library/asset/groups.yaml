    ## What Is an Ozobot?


    Ozobot is a robot. It moves on two wheels. It can also spin and flash its lights.
    The most special thing about Ozobot is that it can see. Ozobot uses its **sensors**
    to see the colors red, green, blue, and black. This lets Ozobot follow paths drawn
    in these colors.


    ### What Can I Do with Ozobot?


    You can control Ozobot by drawing paths for it on paper. You can also control
    Ozobot with a computer. Ozobot can help you learn more about how computers work
    by using **code**.


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_7_0.png)


    Ozobot Bit can follow paths drawn on a tablet with the Ozobot app.


    ## Types of Ozobots


    There are two kinds of Ozobots. The first is called Ozobot 1.0. Ozobot 1.0 can
    follow the lines you draw for it. It can also read special codes called **OzoCodes**.
    The second kind of Ozobot is the Ozobot Bit. This Ozobot can do everything Ozobot
    1.0 does. It can also be controlled using a computer or tablet.


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_9_0.png)


    Main Board


    Power Button


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_9_1.png)


    Optical Sensors


    An Ozobot is made up of many smaller parts.


    ## What Are the Parts of an Ozobot?


    ### Outside Ozobot


    - **Main board**: The main board is a tiny computer. It is the Ozobot’s brain.

    - **Sensors**: Ozobot’s **optical** sensors are like its eyes. They see light
    and follow your paths.

    - **Power button**: This button turns Ozobot on and off.


    ### Inside Ozobot


    - **Battery**: The battery powers Ozobot.

    - **Motors**: Motors make Ozobot’s wheels turn.


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_11_0.png)


    Ozobot’s light will turn from blue to white when it is ready to calibrate.


    ## Starting with Ozobot


    It’s a good idea to **calibrate** your Ozobot when you use it on a new kind of
    paper.


    1. Draw a black circle on the paper you are going to use.

    2. Hold down Ozobot’s power button. The lights will blink.

    3. Put Ozobot on the circle.

    4. Ozobot will drive to the edge of the circle. Its lights will flash green.


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_13_0.png)


    You can use Ozobot with OzoCards like the ones in this picture.


    ## Drawing Paths


    Ozobot comes with special cards called OzoCards. They have paths printed on them
    that Ozobot can follow. You can also draw your own paths for Ozobot using markers.
    You can use regular markers or permanent markers. Remember, the only colors Ozobot
    can see are red, blue, green, and black!


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_15_0.png)


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_15_1.png)


    Making your turns curved like the box on the right will make it easier for Ozobot
    to follow your path.


    ## Adding Turns


    You can add turns to your path. It is easier for Ozobot to follow curved turns.
    Sharp turns are harder to follow. It is a lot of fun to watch Ozobot follow a
    complicated path! Try taping several pieces of paper together to draw longer paths
    for Ozobot. You can also use big rolls of paper.


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_17_0.png)


    Can you figure out what these OzoCodes do? Try re-creating them with your Ozobot
    and see what happens! What happens if you change the direction Ozobot is going?


    ## My Neighborhood


    ![](img/ec35b89b3c0fd34a5cff60626d0c6d91_19_0.png)


    Make sure to use curved lines that are easy for Ozobot to follow.


    ## Your Neighborhood


    Show Ozobot around your neighborhood! Use black, red, blue, and green markers
    to draw a map of your neighborhood on white paper. Make sure the map has a path
    for Ozobot to follow. You can make your path more complicated by adding forks
    and turns.


    ### What Is in Your Neighborhood?


    Mark important locations on your neighborhood map. Here are some places you might
    include:


    - Your house

    - Your school

    - Friends’ houses

    - Parks and playgrounds

    - Stores you visit

    - The library


    ## Explore with Ozobot


    When Ozobot reaches a part of your neighborhood that is special, try using OzoCodes.
    For example, you can make Ozobot spin in front of your favorite places. Now watch
    and see which path Ozobot takes around your neighborhood!


    ## Glossary


    - **calibrate** (KAL-uh-brayt) to adjust a device so it works correctly in different
    situations

    - **code** (KODE) ideas written using computer language

    - **optical** (AHP-ti-kuhl) having to do with sight

    - **OzoCodes** (OH-zoh-kohdz) special codes that Ozobot can read and understand

    - **programs** (PROH-gramz) sets of instructions for computers to follow

    - **sensors** (SEN-surz) electronic devices that can detect things such as light,
    color, or sound


    ## Find Out More


    ### Books


    - Benovich Gilby, Nancy. *FIRST Robotics*. Ann Arbor, MI: Cherry Lake Publishing,
