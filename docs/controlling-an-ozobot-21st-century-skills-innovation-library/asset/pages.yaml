- pgno: 20
  md: '# # Your Neighborhood


    Show Ozobot around your neighborhood! Use black, red, blue, and green markers
    to draw a map of your neighborhood on white paper. Make sure the map has a path
    for Ozobot to follow. You can make your path more complicated by adding forks
    and turns.


    # ## What Is in Your Neighborhood?


    Mark important locations on your neighborhood map. Here are some places you might
    include:


    +   - Your house

    +   - Your school

    +   - Friends’ houses

    +   - Parks and playgrounds

    +   - Stores you visit

    +   - The library'
  merge: -1
  img_proc: true
