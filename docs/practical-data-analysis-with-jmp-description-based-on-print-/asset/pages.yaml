  md: '# Practical Data Analysis with JMP


    approximately 90% of people with PD have “some form of vocal impairment. Vocal
    impairment might also be one of the earliest indicators for the onset of the illness,
    and the measurement of voice is noninvasive and simple to administer” (ibid.,
    p. 2). The practical question, then, is whether a clinician could record a patient’s
    voice—even remotely—and by measuring changes in the type and degree of vocal impairment,
    draw conclusions about progress of Parkinson’s disease in the patient.


    In our example, we''ll use the data from Little, McSherry et al. in simplified
    fashion to differentiate subjects with PD and without. The researchers actually
    developed a new composite measure of vocal impairment, but we''ll restrict our
    attention to some of the standard measures of voice quality. In our sample, we
    have 32 patients; 24 of them have Parkinson’s and do not.


    Vocal measurement usually involves having the patient read a standard paragraph
    or a sustained vowel or word. Two common measurements of a patient’s voice refer
    to the wave form of sound: technicians vary in amplitude (volume) and frequency
    (pitch) of the voice. We will look at three measures:


    +   * MDVP(FoH): vocal fundamental frequency (baseline measure of pitch)

    * MDVP(JitterAbs): jitter refers to variation in pitch

    * MDVP(Shimmerbb): shimmer refers to variation in volume


    In this example we estimate a logistic regression model that uses all three of
    these measures to interpret the output. Interpretation is much like multiple regression,
    except we''re no longer estimating the absolute size of the change in Y given
    one-unit changes in each of the independent variables. In a logistic model, we
    conceive of X as changing the probability, or more specifically the odds-ratio,
    of Y Fundamentally, in logistic regression goal of the model is to estimate the
    likelihood that Y is either “yes” or “no” depending on the values of the independent
    variables.


    More specifically, the specified model estimates ln(p/(1-p)), where p is the probability
    that Y=1. Each estimated coefficient represents the change in the estimated log-odds
    ratio for a unit change in X, holding other variables constant—hard an intuitive
    quantity! Without becoming too much by the specifics, but bear in mind this that
    a positive coefficient only indicates a factor that increases the chance that
    Y equals 1, which in this case means that a patient has Parkinson''s.


    MDVP stands for the Kay-Pentax Multi-Dimensional Voice Program, which computes
    these measures based on voice recordings.


