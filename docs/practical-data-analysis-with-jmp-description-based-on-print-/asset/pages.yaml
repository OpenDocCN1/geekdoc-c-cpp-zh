  md: '# 90 Practical Data Analysis with JMP


    We''ll think of the table as having three main regions, as indicated in Figure
    5.3. This particular study defined seven seven different events, which are all
    named in the left and upper margins of the table. To find the probability (relative
    frequency) of any one event, we look in the opposite margin. For instance, 88
    of 189 dolphins were observed to be feeding. The relative frequency was 46.56%,
    so we find that Pr(Feed) = 0.4656.


    Within the interior cells, the cell is the joint frequency showing the number
    of times that Dr. Rasmussen observed a particular behavior at a particular time.
    The next is the joint probability. In her observations, she did not see any dolphins
    in the afternoon but she did see dolphins feeding in the evening. The joint probability
    Pr(Feed and Evening) = 0.2963.


    The upper-left of the table reports the column percentage and the row percentage.
    In terms of assigning probabilities, these are conditional values. A column percentage
    is the relative frequency of the row within the column only. In other words, restricting
    ourselves to the condition represented by the column, it is the relative frequency
    of each row. Similarly, the row percentages give the probability of the column
    events conditioned on row.


    So, Pr(Noon|Feed) = .0455, but Pr(Feed|Noon) = .2667.


    With this contingency, we can easily check for independence of any two events
    by comparing the conditional probability Pr(A|B). If they are equal, the events
    are independent; if they are unequal the events are not independent. So, for instance,
    we''ve just noted that Pr(Feed|Noon) = .2667. Our earlier glance at the bottom
    margin of the table shows that Pr(Feed) = .04656. Since these two probabilities
    are unequal, we''d conclude that feeding behavior is not independent of the noon
    condition.


    Looking at the mosaic plot (not reproduced here) you might notice that feeding
    is more common at evening than at any other time of day, and we might be tempted
    to conclude that dolphins tend to eat in the evening. Because we''re looking at
    sample data rather than definitive information about all dolphins at times, this
    is an oversimplification, but it is a useful guide at this point in the course.
    In Chapter 11 we''ll see a more sophisticated way to interpret these results.


    > For the sake of clarity, this section spells events rather than using symbols.
    Feed refers to the event "observed a dolphin feeding."


