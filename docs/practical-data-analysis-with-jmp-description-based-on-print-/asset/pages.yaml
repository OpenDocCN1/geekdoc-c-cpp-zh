    # # Chi-Square Test of Independence


    The chi-square test of independence uses sample data to test the null hypothesis
    that two categorical variables are independent of one another. In this example,
    if ignition is independent of incident type, then gas is just as likely to ignite
    one type of incident in another. Or, to put another way, knowing the type of disruption
    would give no information about the chance of ignition.


