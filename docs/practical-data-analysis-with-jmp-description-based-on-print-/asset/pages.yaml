    # Integer


    The integer distribution (sometimes called the uniform discrete distribution)
    applies to situations in which there are n numerical outcomes of consecutive integers,
    each of which is equally likely. A roulette is a good example of a process generating
    values following an integer distribution.


    In our example we''ll consider integer random variable that assumes values of
    0 to 20. With 21 possible values and the characteristic of equal probabilities,
    we don''t need software to tell us that for each value the probability equals
    1/21. Note that if we know the number of possible values (n) we can do the computation;
    we refer to n as the parameter of the integer distribution. We''ll start here
    to demonstrate how JMP handles cases for simple and not-so-simple formulas.


    +   6. Select Cols -> New Column. Rename Column 2 as Integer, and under Column
    Properties, select Formula. Then click Edit Formula within the Formula area of
    the dialog box.


