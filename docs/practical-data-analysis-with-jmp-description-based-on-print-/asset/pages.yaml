    # # Exporting JMP Results to a Word-Processor Document


    As a statistic you may often want or need to include some of your results within
    a paper or project that you''re writing for class. As we wrap up this lesson,
    here''s a quick way to capture output and transfer it to your paper. To follow
    along, first open your word processing software, and write a sentence introducing
    the graph you''ve been working with. Return to the JMP analysis window.


    Our analysis includes a graph and a table. To include the graph only, do this:


    +   1. Select Tools -> Selection. Your cursor will now become an open cross.


    +   2. Click and drag the cursor across the graph until the entire graph is highlighted.


    +   3. Select Edit -> Copy.


    +   4. Now move to your word processor and paste your copied graph.


    The graph should look something like the one shown below in Figure 1.11. Note
    that the graph will look slightly different from its appearance within JMP, but
    this demonstration should illustrate how easy it is to incorporate JMP results
    into a document.


