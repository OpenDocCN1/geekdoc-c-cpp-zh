    # Learning to Reason Statistically with Real Data


    We live in a world of uncertainty. The goal of applied statistical analysis is
    to calibrate, cope with, and sometimes influence that uncertainty. Business decisions,
    government policies, scientific research, news reporting, and public opinion are
    all shaped by statistical analysis and reasoning. Statistical thinking is at the
    core of the “quality revolution” in manufacturing and service operations around
    the world. This book will help you to discriminate among and use some fundamental
    techniques of statistical analysis, and it will also help you to engage in statistical
    thinking by analyzing real problems.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright 2010, SAS Institute
    Inc., Cary, North Carolina, USA.

