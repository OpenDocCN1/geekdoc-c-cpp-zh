  md: '# 126 Practical Data Analysis with JMP


    +   - Eight percent of the samples will yield information that is quite misleading,
    leading to estimates of 3/6 = 50% or 6/6 = 100%. The large majority of samples
    (82%) will yield estimates that are close to the correct value.

    - There is absolutely no way to know whether the investigator''s one sample comes
    from the large majority in the middle or from the tails of the distribution shown
    in Figure 7.3.


    In this example we can fix these facts specifically because the scale of the problem
    is small enough for us to enumerate the complete list of samples. When the population
    is larger or when the range of possible sample values is larger—for example, with
    a continuous random variable rather than a categorical variable—we cannot list
    the complete set of potential samples. Still, this example illustrates the nature
    of sampling variation and its impact. To move to the next level in our understanding
    of how we can begin to tame sampling variation, we turn to the simulation capabilities
    of JMP.


    # Extent of Sampling Variation


    All samples vary, and the relevant variation is slightly different depending on
    whether we''re looking at quantitative data or qualitative ordinal or nominal
    data. In this section we''ll look more closely at how we can gauge and characterize
    the sampling distribution of the sample proportion for qualitative, categorical
    data and the sampling distribution of the sample mean for continuous data.


    # Sampling Distribution of the Sample Proportion


    In the expanded NHANES data table the last column categorizes respondents'' households
    by level of food security, referring to the reliability of adequate nutrition
    in the household. In this sample of 10,348 respondents, we find that 19.1% of
    households are classified as having low or very low food security. For the sake
    of this section, let''s treat the value of 19.1% as a population parameter and
    think about what would happen if we were to select a sample in order to estimate
    the parameter. In other words, we''ll again create the artificial notion of using
    a simple sample to estimate a parameter whose value we already know.


