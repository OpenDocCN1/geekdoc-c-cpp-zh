    # Non-Random Sampling


    This book is about practical data analysis, and in practice many data tables contain
    data that were not generated by anything like a random sampling process. Most
    collected data within business and non-profit organizations come from the normal
    operations of the organization rather than a carefully constructed process of
    sampling. We can summarize the data within a non-random sample, but should we
    be cautious about the temptation to generalize from samples. Whether we are conducting
    the analysis or reading about it, we always want to ask whether a sample is likely
    to misrepresent the process or from which it came. Voluntary response surveys,
    for example, are very likely to mislead us if only highly motivated individuals
    respond. On the other hand, if we watch the variation in stock during an eventful
    period in the stock markets, we might reasonably expect that the sample could
    represent the process of stock market transactions.'
