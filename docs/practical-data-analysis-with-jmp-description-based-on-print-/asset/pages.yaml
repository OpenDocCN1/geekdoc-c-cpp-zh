    # From Simulation to Generalization


    It''s easy to imagine that the distribution in Figure 7.7 might be reasonably
    approximated by a normal distribution. In fact, the normal approximation has long
    been the traditional approach in analyzing sampling distributions. With inexpensive
    computers and software like JMP it is equally practical to make a more direct
    and accurate approach. If we take 50-person random samples from a large population
    with a population proportion of 0.19, then we can use the binomial to describe
    the theoretical sampling distribution precisely. If we define $p$ as the sample
    proportion of households in a 50-person random sample with low or very low income
    security, then the distribution of $p$ is described by a binomial distribution
    with parameters $n=50$ and $p=0.19$. If we did this with samples of Chinese zodiac
    symbols, we can compute the likelihood of drawing a random sample that lies a
    specific distance from the population proportion.


    For example, in the simulation we saw that although the population proportion
    is 19.1% it is possible to draw a random sample that would mislead us into estimating
    that the population proportion is 10% or less. How likely is it? In other words,
    how likely is it that an investigator would observe five or fewer high-risk households
    in a sample of 50?


