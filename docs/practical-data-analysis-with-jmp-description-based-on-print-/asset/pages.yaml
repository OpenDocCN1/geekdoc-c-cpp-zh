  md: 'Chapter 9: Inference for a Single Continuous Variable 165


    We interpret the $P$-values just as we do in any hypothesis test, and further
    information is available within the JMP Help system. At this point it is useful
    to know that the $t$-test is not the only viable approach.


    If the sample is small and strongly skewed, then inference is risky. If possible,
    one should gather more data. If costs or time constraints prohibit that, and if
    the costs of indecision exceed those of an inferential error, then the techniques
    illustrated above might need to inform the eventual decision, however imperfectly—with
    the understanding that the estimates of error risk are inaccurate.


    # #Matched Pairs: One Variable, Two Measurements


    The $t$-distributions that underlie most of this chapter were the theoretical
    contribution of one William Gosset, so it is appropriate to conclude this chapter
    with some data originally collected by Gosset, whose expertise was in agriculture
    as it related to the production of beer and ale, the industry in which he worked
    as an employee of the Guinness Brewery.


    This particular set of data contains measurements of crop yields from eleven types
    of barley (referred to as corn) in a *split plot* experiment. Each seed of type
    was divided into two groups. Half of the seeds were dried in a kiln, and the other
    were not. All of the seeds were planted in pairs of farm plots, so that the kiln-dried
    and regular seeds of one variety were in adjacent plots.


    As such, the data table contains 22 measurements of the sample: crop yield (pounds
    of barley per acre). However, the measurements are not independent of one another,
    because adjacent plots used the same variety and were presumably subject to similar
    conditions. The point of the experiment was to learn if kiln-dried seeds increased
    the yields in comparison to conventional air-dried seeds. It is important that
    the analysis compares variety by variety, isolating the effect of drying method.


    The appropriate technique is equivalent to the one-sample $t$-test, and rather
    than treating the data as 22 distinct observations, we treat it as *11 matched
    pairs* of data. Rather than analyze the individual values, we analyze the *differences*
    for each pair. Because we have a small sample, the key condition here is that
    the population differences are approximately normal, just as in the one-sample
    $t$-test.


