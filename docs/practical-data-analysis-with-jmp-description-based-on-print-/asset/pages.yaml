    # Parameter Estimates


    As noted earlier, we don''t interpret the parameter estimates directly in a logistic
    model. Because each estimate is the marginal change in the log of the odds-ratio,
    sometimes we do a bit of algebra and complete the following computation for each
    estimated $\beta$:


    ```

    $e^{\beta} - 1$

    ```


    The result is the estimated change in the odds corresponding to a one-unit change
    in the independent variable. Of course, we want to interpret the coefficients
    only if they are statistically significant. To make judgments about significance,
    we look at the next panel of output.


