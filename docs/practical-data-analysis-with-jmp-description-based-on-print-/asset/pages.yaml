  md: '# Visualizing Multiple Regression


    This to begin, let''s consider the influence of water and Portland cement. In
    general, the compressive strength of concrete comes from the cementitious ingredients;
    additional water tends to diminish the compressive strength during curing.


    In a simple bivariate regression model, we visualized the relationship between
    X and Y using a scatterplot. With two independent variables, we could think of
    the relationship between the response variable and the independent variables in
    three-dimensional space. JMP makes this easy.


    +   1. Open the data table called Concrete 28.


    +   2. Select Graph -> Scatterplot options. Select the columns Cement, Water,
    and Compressive Strength, and cast them into the Y role. then click OK.


