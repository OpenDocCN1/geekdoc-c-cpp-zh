- img_proc: true
  md: '# Practical Data Analysis with JMP


    strata within the population and then randomly sample from each stratum. For example,
    imagine a public health study focusing on diet and blood pressure among adults
    in the U.S. We might randomly stratify the population by gender and age group.


    **Clustering:** Clusters are often geographical or arbitrary groupings within
    a population such that there is no particular reason to expect individuals within
    a cluster to be more or less heterogeneous than individuals across clusters. In
    a *cluster sample*, we identify clusters within a population, randomly sample
    a small number of clusters, and then proceed to sample individuals from those.


    For example, many telephone surveys cluster the population by area code and randomly
    select a group of area codes, and subsequently the pollsters use computers to
    randomly dial seven-digit telephone numbers. In such a process, where the sample
    is built up in stages, the area codes are referred to as the Primary Sampling
    Units (PSUs).


    **Complex sampling** refers to both stratification and clustering. Whether a sample
    is complex, stratified, or clustered, analysis of the sample data will generally
    require weighting if we want to generalize from the sample to the entire population.
    In a random sample of *n* individuals from a population with *N* members, each
    of the individuals represents the same fraction of the total population (*n/N*).
    However, different area codes what happens when a polster calls households within
    two different area codes. The entire state of Wyoming (population of approximately
    0.5 million) is covered by area code 307. In New York City, area code 212 covers
    part of Manhattan that is home to about 1.6 million people. If the pollster were
    to phone 10 people in each of these area codes, the Wyoming sample would be representing
    about 5,000 people while the Manhattan sample would be representing nearly three
    thousand that.


    When we use a data table (as one will use later in this chapter) assembled from
    a complex sample, we will typically find one or more weights—sometimes identified
    as *post-stratification weights*—and a PSU column. Most of the analysis in JMP
    provide the option of specifying a *weight* column, which would be used if we
    use data from a complex sample.


    Clustering and stratification both rely on random selection. Looking back at U.N.
    table of counties you can understand how we might proceed if we wanted, say, to
    cluster by sub-regions. We would establish a data table listing the regions and
    sub-regions, randomly subset those, and proceed through the process.


    The Subset platform enables us to use columns already in the data table. Let''s
    stratify by Region, there are five regions in this table. To illustrate the concept
    of sampling weights, we''ll choose four countries from each region, recognizing
    that with varying numbers of counties in each part of the world, a sample with
    an equal number of rows from each region will misrepresent the world.'
