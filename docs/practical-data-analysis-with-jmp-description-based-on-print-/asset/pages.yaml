    +   7. Click the red triangle next to Mammals and choose Histogram Options ->
    Show Percents.


    This analysis displays the sampling distribution of the number of mammals in a
    sample of 6 zodiac symbols. The number of mammals in sample varies between 3 and
    6, with values of 4 and 5 being more likely than the other. (See Figure 7.3.)
    If investigator randomly selects just one sample, Pr(4 mammals) = .41 and Pr(5
    mammals) = .41. Consequently the most likely results of the sampling exercise
    is an estimate of 4/6 = 67% or 83%, or Pr(estimate = 67%) = .41 and Pr(estimate
    = 83%) = .41.


    Notice that none of the samples actually leads directly to the correct value of
    75% mammals simply due to the fact that in a sample of six items, it''s impossible
    to observe 75% (4 out of 6) mammals. If it''s very important to the investigation
    to be dial in a value like 75%, the investigator should sample more than six symbols.


    # Figure 7.3 Distribution of Mammals


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_141_0.png)


    What can we say about these samples from this population? And what can we say
    about the estimates that would result from one sample drawn at random from this
    set of all possible samples? We can note the following:


    +   - There is variation among these samples, so that sampling error is inevitable.

    - The mean of all possible samples is 4.5 out of 6 mammals—or 75%.'
