  md: '# Response Surface Designs


    Earlier in the chapter we introduced the idea of a response surface that might
    be non-linear. In our examples up to this point, we''ve tested high and low values
    of factors for the implicit assumption that the response variable would change
    in linear fashion. For example, if the response increases when a factor level
    shifts from low to high we might infer that at an intermediate level the response
    variable would also take on an intermediate value. But what if the response actually
    curves, so that between the two tested factors it declines?


    It is possible to design an experiment explicitly for the purpose of exploring
    curvature in the response surface. To illustrate the concept and basic structure
    of a response surface experimental design, we''ll introduce another example. Many
    retailers operate customer loyalty programs where they offer rewards and incentives
    to regulate customers. Most customers accept a complimentary bar-coded card, which
    they present at the register when making a purchase. The retailer adds the specific
    details of each transaction to their data warehouse, tracking consumer purchases.


    Among the common rewards programs are offers generated at the register. A retailer
    might present the card-holding customers with a coupon worth a discount on their
    next purchase of a specific product, or a free item if they return to the store
    within many days.


    For this example, suppose that a retailer wants to conduct a two-factor experiment
    with their customer loyalty program. The response variable is sales lift, a common
    term for the increase in the amount customers spend in a given period and beyond
    their normal purchases. For example, a grocery store could have a great deal of
    data about prior buying behavior. If customers receiving special offers spend
    an average of $20 per month more than customers not receiving offers, the sales
    lift would be $20.


    Suppose that the two factors are the dollar amount of the discount offered and
    the length of time before the offer expires. With each of these, it might be reasonable
    to anticipate curvature in the response. A very small discount might not provide
    incentive, but too large a discount might offset any sales lift. Similarly, if
    the coupon expires too soon customers might not need a return visit in itself.
    If the coupon expires too far into the future, customers might forget about it
    and not use it. The retailer might want to dial in the right combination of collars
    and days to maximize sales lift and will distribute coupons with different offers
    over the next month. As a first approximation we''ll assume that the response
    curves are quadratic (in other words, parabolic in shape).


    Because the factors are continuous and could conceivably be set at any number
    of levels, we need a strategy to select starting levels and evaluate the quality
    of those choices. One measure of the design quality is the variance or standard
    errors of the coefficients'
