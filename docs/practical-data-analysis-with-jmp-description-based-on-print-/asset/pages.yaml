    # ## What Are We Assuming?


    This chapter introduces several techniques that we can use when we have a continuous
    response variable and one or more categorical (or ordinal) factors. As a very
    simple example, we might consider an experiment in which subjects are asked to
    complete a simple crossword puzzle, and our response variable is the amount of
    time required to complete the puzzle. We randomly divide the subjects into three
    groups. One group'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Practical Data Analysis with JMP


    completes the puzzle with rock music plays loudly in the room. The second group
    completes the puzzle with the recorded sound of a large truck engine idling outside
    the window. The third group completes the puzzle in a relatively quiet room.


    Our question might be this: the mean completion time depend on the sound conditions
    prevailing for the group? In other words, we''ll ask if the means are the same
    for the three groups or different.


    We might model the completion time for each individual (x_i) as consisting of
    three separate elements, minus an overall population mean, plus minus a treatment
    effect, plus minus individual variation. For example, we might anticipate that
    the control group''s minutes might enable us to estimate a baseline value for
    completion times. Further, we might hypothesize that rock music helps people work
    more quickly and efficiently, and therefore that individuals in the rock music
    condition complete the puzzle faster, regardless of whether individuals are simply
    variable for dozens of unacceptable reasons.


    Symbolically, we express this as follows:


    ```

    x_{ik} = μ + τ_{ik} + ε_{ik}

    ```


    μ representing the underlying unknown population mean,

    τ_{k} is the unknown deviation from the population mean (that, is the treatment
    effect) for level k, and

    ε_{ik} is unique individual variation, or error.


    Our null hypothesis is that all groups share a single mean value, which is to
    say that the treatment effect for all factors (τ_k) is zero. We can express this
    null in this way:


    ```

    H_0: τ_1 = τ_2 = ... = τ_k = 0 versus the complementary alternative hypothesis
    that H_1 is not true.

    ```


    The first technique will be called one-way analysis of variance (ANOVA), which
    is a reliable method of inference when our study satisfies these three assumptions:


    +   - All observations are independent of one another.

    - The individual error terms are normally distributed.

    - The variance of the individual errors is the same across treatment groups.


    Alternatively, we might express this assumption as saying that the individual
    responses are normally distributed within each group.'
