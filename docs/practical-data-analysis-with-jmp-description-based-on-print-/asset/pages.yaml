    # Binomial


    Binomial distributions describe random variables representing the number of times
    we observe an outcome in repeated trials. More specifically, a binomial variable
    is the number of observed outcomes (“successes”) in $n$ trials where the following
    is true:


    +   - Each trial is conducted in the same fashion.

    - There are just two complementary outcomes on each trial, traditionally *success*
    and *failure*.

    - The probability, $p$, of the outcome of interest is the same each trial.

    - Each trial is independent of the one before.


    The computation of binomial probabilities is far more complex than integer probabilities,
    but JMP does all of the work for you once we specify the two parameters of'
