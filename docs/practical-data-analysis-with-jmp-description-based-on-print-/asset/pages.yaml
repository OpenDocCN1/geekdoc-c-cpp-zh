  md: "# Chapter 8: Inference for a Single Categorical Variable 147\n\nTable 8.1 Forms\
    \ of the Alternative Hypothesis\n\n| Name | Example | Usage |\n| --- | --- | ---\
    \ |\n| One-sided | $H_a: p > .75$ | Investigator suspects the population proportion\
    \ is more than a specific value. |\n| | $H_a: p < .75$ | Investigator suspects\
    \ the population proportion is less than a specific value. |\n| Two-sided | $H_a:\
    \ p \neq .75$ | Investigator suspects the population proportion is not equal to\
    \ a specific value. |\n\nThe alternative hypothesis represents the reason for\
    \ the investigation, and it is tested against the null hypothesis ($H_0$). The\
    \ null hypothesis is the contrarian proposition about asserting that the alternative\
    \ hypothesis is untrue.\n\nTo summarize: we suspect, for example, that more than\
    \ 75% of gas pipeline disruptions ignite. We plan to collect data about actual\
    \ major incidents, and count the number of fires. To test our suspicion, we initially\
    \ assume that no more than 75% of the disruptions burn. Why would we begin the\
    \ test in this way?\n\nRemember, we can't look at all incidents but can observe\
    \ only a sample. Samples vary, and our sample will imperfectly represent the entire\
    \ population. So we reason in this fashion:\n\n+   - Assume initially the null\
    \ hypothesis is true.\n- Gather our sample data and compute the sample proportion.\
    \ Take note of the discrepancy between our sample proportion and the null hypothesis\
    \ statement about the population.\n- Knowing what we know about sampling variation,\
    \ estimate the probability that a parent population like the one described in\
    \ the null hypothesis would yield up a sample similar to the one we observed.\n\
    - Decision time:\n  - If a sample like ours would be extraordinary under the conditions\
    \ described, then conclude that the null hypothesis is not credible and instead\
    \ believe the alternative.\n  - If a sample like ours would not be extraordinary,\
    \ then conclude that the discrepancy we witnessed is plausibly consistent with\
    \ ordinary sampling variation.\n\nNOTE: If we decide against rejecting the null\
    \ hypothesis, the sample data do not “prove” that the null hypothesis is true.\
    \ The sample data simply are insufficient to conclude that the null hypothesis\
    \ is false. At first, this difference might appear to be one of semantics, but\
    \ it is essential to the logic of statistical inference.\n\nCarver, Robert. Practical\
    \ Data Analysis with JMP®. Copyright © 2010, SAS Institute Inc., Cary, North Carolina,\
    \ USA.\nALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing."
