- img_proc: true
  md: 'example, the winning time in the new Olympic marathon is a continuous variable:
    no matter how thinly we slice the imaginable values, it is always possible that
    the winner’s time will fall between two values that we imagined. As a practical
    matter, we tend to measure continuous variables discretely—the official scores
    report times to the nearest 100*—but that does not change the fact that time is
    continuous.


    Because of the nature of continuous data, our discrete model of probability distributions
    doesn''t apply to continuous data. We cannot list all possible values of a continuous
    random variable and because of the infinitesimal nature of the variables each
    possible value has a probability of zero. We need a different approach.


    # Density Functions


    For a continuous random variable $X$, we''ll think about the probability that
    $X$ lies between two values instead of thinking about $X$ assuming one specific.
    In other words, rather than solving for $Pr(X = a)$ we''ll solve for $Pr(a \le
    X \le b)$. Fortunately, the software handles all of the computational issues,
    but it''s helpful to have some basic grounding in the underlying theory.


    With continuous random variables, probability values are derived from the specific
    density function that describes the variable. From the standpoint of data analysis,
    density functions se have little direct application. You might want to think of
    a density function representing the concentration of probability near different
    possible values of $X$.


    To illustrate this concept, we''ll take advantage of one of the graphing features
    of JMP and look at histograms in a new way.


    +   1. Open NHANES data


