    # Using Sampling Weights (optional section)


    The NHANES data comes from a complex sample, and the data table includes sampling
    weights. To conduct inferential analysis properly with surveys like NHANES, we
    should apply the post-stratification weights. The weights alter the estimated
    means and standard errors, and therefore lead to slightly different conclusions.
    We interpret weighted results exactly as described, and the software makes it
    very easy to apply the weights.


