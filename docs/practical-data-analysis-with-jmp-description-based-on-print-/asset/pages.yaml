    The three indexes of process capability are CP, CPK, and CPM. For this discussion
    it is less important to know the specific formulas* for these indexes than it
    is to understand what they measure. In a capable process, the large majority of
    observed measurements fall within the specification limits. In a capable process,
    all three indexes would be


    > *Here are the formulas, in which USL and LSL are the upper and lower specification
    limits.


    ```

    USL - LSL

    CP = 6s

    CPK = min(\frac{USL-\bar{X}}{3s}, \frac{\bar{X}-LSL}{3s})

    CPM = \frac{min(T-LSL, USL-T)}{3\sqrt{s^2-(\bar{X}-T)^2}} , where T is the target
    mean.

    ```


