    \ mean, and so) are far in the upper corner. Grab the square at the left as shown\
    \ in Figure 9.7 and slide all of it to the right so that you can see it clearly.\n\
    \nThis graph is more complex than the earlier one. We initially see two distributions.\
    \ The red one, centered at 180, showing the sampling distribution based on the\
    \ assumption expressed in the null hypothesis. The blue curve shows an alternative\
    \ distribution (a parallel universe, if you like) based on the possibility that\
    \ $\\mu$ is actually equal to 149.018, the value of the sample mean.\n\nSo this\
    \ graph lays out our pre-sampling scenario of two competing visions. The red vision\
    \ depicts the position of the null hypothesis: the population mean is truly 180,\
    \ and samples are around it. The blue vision says “Here's one possible reality:\
    \ the population mean just so happens to be 149.018.” We'll be able to relocate\
