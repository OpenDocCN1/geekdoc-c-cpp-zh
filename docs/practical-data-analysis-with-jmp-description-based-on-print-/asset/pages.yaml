    # Evaluating Alternative Models


    With multiple regression analysis we often want to compare two or more competing
    models. In our concrete example, for instance, earlier estimated a model with
    three significant factors, reasonably well-behaved residuals, and which accounted
    about 72% of the observed variance in compressive strength. Perhaps a four-variable
    model would better?


    The process of comparing models can easily devolve into a chaotic flurry of trial-and-error
    attempts. When estimating several models for a single Y variable, take these points
    into consideration:


    +   - Do all of the independent factors make logical sense in the model? Are there
    solid theoretical reasons to include each factor? If not, why include factors?

    - Does the model under consideration have acceptable residual plots? Does an alternative
    model more closely meet the conditions for inference? Other things being equal,
    a model with “good” residuals is preferable.

    - Are there signs of collinearity? If so, deal with it. A model with collinearity
    useless.'
