    when the output from JMP makes it a natural extension of a more elementary topic.


    Third, nearly all of the data sets in the book are real and drawn from those disciplines
    whose practitioners are the primary users of JMP software. Inasmuch most undergraduate
    programs now require coursework in statistics, the examples major areas in which
    statistical analysis is an important way of knowing. These areas include engineering,
    life sciences, business, and economics.


    Fourth, each chapter invites students to practice the habits of thought that are
    essential to statistical reasoning. Long after readers forget the details of a
    particular procedure or the options available in a specific JMP analysis platform,
    this book may continue to resonate with valuable lessons about variability, uncertainty,
    and the logic of inference.


    Each chapter concludes with a set of “application scenarios,” which lay out problems
    or investigative context that is in supported by a data table. Each scenario includes
    a set of questions that implicitly require the application of the techniques and
    concepts presented in the chapter. Solutions to the scenarios are available through
    support.sas.com/authors; instructors who adopt the book will be able to access
    all solutions. Students and other readers can find solutions to the even-numbered
    problems at the same site.


    # The Data Files


    As previously noted, each of the data tables referenced within the book contains
