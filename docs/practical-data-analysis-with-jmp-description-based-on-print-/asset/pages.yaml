    # Charts for Proportions


    For processes we might be concerned with a categorical attribute of a product
    or service rather than a measurable variable. For example, manufactured products
    might be unacceptable for distribution to customers by one or more defects. The
    major types of attribute charts are known as P charts, which represent proportions
    or relative frequency of occurrence, and NP charts, which illustrate simple counts
    of events. To illustrate how control charting can help monitor attribute data,
    let us turn to some additional data about airline delays.'
