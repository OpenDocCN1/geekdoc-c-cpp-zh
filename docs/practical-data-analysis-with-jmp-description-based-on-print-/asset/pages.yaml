    Early in this book, we''ve seen examples in which there is a clear relationship
    between $X$ and $Y$, but the relationship does not have to be linear. In some
    disciplines, there are well-established techniques to describe a relationship,
    such as Newton''s laws of motion. In other disciplines, non-linear relationships
    might be less clear. researchers often use regression analysis to explore such
    relationships. This section of the chapter introduces two common functions that
    frequently do a good job of fitting curvilinear data.


    # Quadratic Models


    We begin with a simple descriptive example of a fairly well-known quadratic relationship.
    A quadratic function is one that includes an $X^2$ term. Quadratic functions belong
    to the class of polynomial functions, which are defined as functions that contain
    certain terms with $X$ raised to a positive integer power. It''s how this shows
    up in our solar system.


