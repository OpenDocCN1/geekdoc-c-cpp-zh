    * Using JMP to Conduct a Significance Test 146

    * A Few Words About Error 150

    * Application 151


    # Two Inferential Tasks


    Beginning with this chapter, we enter the realm of inferential statistics, where
    we generalize from a single sample to draw conclusions about an entire population
    or process. When statisticians use the term inference, it refers to two basic
    activities. Sometimes we want to estimate the value of a population parameter,
    and sometimes we want to ask whether the parameter is or not equal to a specific
    value. In this chapter,


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_157_0.png)'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'We''ll restrict our attention to categorical dichotomous data and focus on
    the proportion of a population that falls in one category.


    We''ll discuss the ideas of confidence interval estimation and of significance
    testing (often called hypothesis testing). Along the way, we will illustrate these
    techniques and using data tables with two formats common to categorical data.
    We often find categorical data summarized in a frequency table, but sometimes
    we have detailed case-by-data.


    The main message of the previous chapter is that sampling always carries the risk
    of inaccurately representing the larger group. We can eliminate the possibility
    that one particular sample will lead us to an incorrect conclusion about a population,
    but we can at least calibrate the risk that it will. To do so, it''s important
    to consider the form and origin of our data before rushing ahead to generalize
    from a sample. There are also other considerations to take into account and these
    are the topic of the next section.


    # Statistical Inference Is Always Conditional


    Under a wide range of common conditions, good data generally leads to good conclusions.
    Learning to reason statistically involves what those conditions are, what constitutes
    good data, and how to move logically data to conclusions. If we are working with
    sample data, we need to recognize that we simply cannot infer one characteristic
    (parameter) of a population without making some assumptions about the nature of
    the sampling process and at least some of the other attributes of the population.


    As we introduce the techniques of inference for a population proportion, we start
    with some basic conditions. If these conditions accurately describe the study,
    the conclusions we draw from the techniques are most trustworthy. To the extent
    that the situation substantially departs from the conditions, we should doubt
    that the results can generalize to the population. Thus, our approach is to ask
    if we can reasonably assume that a given set of conditions applies to a particular
    situation.


    At a minimum, we should be able to assume the following about our sample data:


    +   Each observation is independent of the others. Simple random sampling assures
    that, and it is possible in a non-SRS we preserve independence.


    +   Our sample is no more than 10% of the population. When we sample too a segment
    of the population, in essence we no longer preserve the condition of independent
    observations.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Chapter 8: Inference for a Single Categorical Variable 143


    We''ll take note of other conditions along the way, but these form a starting
    point. In our first example, we will look again at the pipeline safety incident
    data. This is not a simple random sample, even though it may be reasonable to
    think that one major pipeline interruption is independent of another. Because
    we are sampling from an ongoing nationwide of having pipelines carry natural gas,
    it is also reasonable to assume that our data table is less than 10% of all disruptions
    that will ever occur. We''ll go ahead and use this data to represent pipeline
    disruptions in general.


    # Confidence Intervals


    In this first example, let''s estimate the proportion of major pipeline disturbances
    in the United States in which natural gas actually ignites. We already know how
    to calculate the proportion of ignites within our sample (about 0.81 or 81%),
    but that only describes the sample rather than the entire population. We shouldn''t
    say that 81% of all disruptions involve fires, because that is overestimating
    what we know. What we want to say something like this: "Because our sample proportion
    was 0.81 and because we know a bit about sampling variability, we can comfortably
    conclude that the population is ...."


    We will use a confidence interval to express an inferential estimate. A confidence
    interval estimates the parameter, while acknowledging the uncertainty that unavoidably
    comes with sampling. The technique is rooted in the sampling distributions we
    studied in the prior chapter. Simply put, rather than estimating the parameter
    as a single value between 0 and 1, we estimate lower bounds for the parameter,
    and tag the bounded region with a specific degree of confidence. In most fields
    of endeavor, we customarily use confidence levels of 90%, 95%, or 99%. There is
    nothing sacred about these values (although you might think so after reading statistics
    texts); they are conventional for sensible reasons. Like most statistical software,
    JMP assumes we''ll use one of these confidence levels, but it also offers the
    ability to choose any level.


    # Using JMP to Estimate a Population Proportion


    We already have a table of individual incident reports. In this section, we''ll
    analyze the data in two ways. First, we''ll see how JMP creates a confidence interval
    from raw data in a data table. Next, we''ll see how we might conduct the same
    analysis if all we have a summary of the full data table.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute,
    Inc., Cary, North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
