  md: '# Confidence Intervals for Y|X


    As noted above, we can use the estimated equation to compute one or more predicted
    (or fitted) values of Y corresponding to specific values of X. Such an estimate
    of Y is sometimes called Y-hat, denoted Y-hat. Computing a Y-hat value is a simple
    matter of substituting a specific value for X and solving the regression equation.
    If we want to build an interval around a fitted value of Y, we first need to look
    to the context of the estimate.


    A confidence––d interval for X estimates the mean value of Y given the value of
    X. In our current model of BMI, for example, we might want to estimate the mean
    BMI among wen 77 cm. The point estimate would be


    ```

    BMXBMI = -5.88872 + 0.3410071 * 77 = 20.37/kg^2

    ```


    This value, which is the location of the estimated line at X=77, becomes the center
    of the confidence interval, and then JMP computes an appropriate margin of error
    to form the interval. In the next chapter we will discuss how JMP constructs a
    confidence band along the entire length of the estimated line. This is most easily
    done using the Fit by X platform.


    +   16. Select Analyze → Fit by Y. Cast BMXBMI as Y and BMXWAIST as X and click
    OK.


    +   17. Click the red triangle and select Fit Line.


    +   18. To view the next step, click and drag the lower-right corner of the scatterplot
    down to the right to enlarge the graph.


    +   19. Click the red triangle to select Linear Fit and select Confid Fit.


    +   20. Repeat to select Confid Shaded Fit. Your graph should now look like Figure
