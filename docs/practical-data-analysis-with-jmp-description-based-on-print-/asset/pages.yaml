  md: 'tighten our tolerance for Type I error, we expose ourselves to a greater chance
    of Type II error and also diminish the power of the test.


    +   17. Restore Alpha to 0.05, and now double the Sample Size to 910. You''ll
    need to rescale the vertical axis (the upper portion with the hand tool) to see
    the full curves after doing this.


    Doubling the size of the sample radically diminishes beta and increases power
    substantially from 0.87 to 0.99. So there''s a lesson here: another good reason
    for large samples is that they makes more powerful in detecting a true alternative
    hypothesis.


    +   18. Finally, grab the small square at the top of the blue curve, and slide
    it to the right until the true mean is approximately 170 minutes.


    This action reveals another vertical line. It is green and to the point, however,
    see what has happened to the power and the chance of a Type II error. When we
    place the "true" mean at 170 minutes, the alternative is true and the null hypothesis
    is false: the population mean is not 180 as hypothesized, but 10 minutes less.


    When the discrepancy shrinks between the hypothesized mean and the reality, the
    power of the test falls off and the risk of Type II error increases again. This
    illustrates a thorny property of power and one that represents a real challenge.
    Hypothesis testing is better at spotting large discrepancies than small ones.
    If our null hypothesis is literally false but happens to be close to the truth,
    there will be a relatively good chance that a hypothesis will lead us to the incorrect
    conclusion. Enlarging the sample size would help, if that is feasible and cost-effective.


    # # If Conditions Aren''t Satisfied?


    The pipeline data table contains a large number of observations so that we could
    use the t-test despite the indications of a very skewed population. What are our
    options if we don''t meet the conditions for the t-test?


    If the population is reasonably symmetric, but normality is questionable, we could
    use the Wilcoxon Rank test. This is an option presented in the Test Means command,
    as illustrated in Figure 9.4. Wilcox''s test is identified as a non-parametric
    test, which indicates that its reliability does not depend on the population following
    any specific probability distribution. Rather than testing the mean, the test
    statistic computes the difference between each observation and the median, and
    ranks the differences. This is why symmetry is important: in a skewed dataset
    the gap between mean and median is relatively large.'
