  md: '# Winters'' Method


    In time series estimation, there are two fundamental approaches to seasonality.
    One set of models are additive, treating each season as routinely deviating by
    a fixed amount above or below the general trend. The other family of models is
    multiplicative, positing that seasonal variation is a fixed percentage of the
    overall trend. In JMP, the implementation of Winters'' method, named for Peter
    Winters who proposed it in 1960, is an additive model. Let''s see how it works,
    and as a starting point we will assume there are four seasons per year, consisting
    of three months.


    +   10. Click the red triangle and select Smoothing Models → Linear Exponential
    Smoothing.

    11. In the specification panel, change the Number of Periods per Season from 12
    to 3, accept the other default settings and click Estimate.


    The resulting estimates and graph are shown in Figure 17.6. The graph is enlarged
    to more clearly show the forecast for the next three months. Notice in the parameter
    estimates that there are three weights, corresponding to the three series components.
    In the graph, we see a more refined set of future estimates that continue the
    upward trend, but show a dip in the second month down the road.


    # Figure 17.6 Results of Winters'' Method


    | Term | Estimate | Std Error | Ratio | Prob>|t |

    |---|---|---|---||

    | Level Smoothing | 0.2315205 | 0.0859223 | 2.69 | 0.0022* |

    | Trend Smoothing | 0.04488391 | 0.0420626 | 1.07 | 0.2884 |

    | Seasonal Smoothing | 0.01201735 | 0.0619741 | 0.19 | 0.8466 |


