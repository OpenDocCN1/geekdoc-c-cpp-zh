    # ## Customizing Scale and Bars in a Histogram


    When we use the distribution plot to analyze a continuous variable, JMP automatically
    determines how to divide the axis and how to create “bins” for grouping observations.
    These automatic choices potentially can distort the appearance of the shape of
    a distribution. We can modify the default choices in several ways, and in this
    we''ll learn three ways to customize the appearance of a histogram.


    First, we can alter the number of bars in the histogram. When we do this, we create
    boundaries between groups of observations, and observations shift from one bar
    to the next.


    +   12. From the menu bar, select the tool  (also called the gallery).


    +   13. Position the hand anywhere on the bars in the 2010 histogram, and holding
    the down mouse button, drag the tool straight up down. In doing so, you''ll change
    the number and width of the bars, sometimes changing the apparent shape of the
    graph dramatically.


    +   Second, we can change the scale of the horizontal axis interactively. Initially,
    JMP set the left endpoint of this graph at 40 years and the right endpoint at
    85 years and we changed it when we chose scaling. Suppose we want the axis to
    begin at 20 and end at 90.


    +   14. Move the cursor to the left end of the horizontal axis, and notice that
    the hand now points to the left. (This is true whether or not you''ve previously
