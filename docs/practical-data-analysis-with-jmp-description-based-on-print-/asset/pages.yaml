    Plot.


    Figure 14.6 Histogram and Normal Quantile Plot of Residuals


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_258_0.png)


    The residuals are shown in Figure 14.6. Here we are looking for any red flag that
    would suggest the residuals are grossly non-normal. We want to be able to continue
    to interpret the residuals, and would want stop for corrective measures if the
    residuals were heavily skewed or multimodal.


    What kind of corrective measures can we take? Generally speaking, non-normal residuals
    might indicate that there are other factors in X that should be considered. In
    other words, there could be a lurking factor that accounts for the non-random
    residuals. Sometimes it is helpful to transform the response variable or the factor
    using logarithms. In Chapter 15 we''ll see how we can account for additional factors
    and use transformations.'
