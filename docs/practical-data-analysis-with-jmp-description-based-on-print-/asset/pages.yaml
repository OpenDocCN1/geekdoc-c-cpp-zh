    # Experimental and Observational Studies


    In Chapter 2 we discussed the difference between experimental and observational
    studies. In an experiment, the investigator creates a controlled setting in which
    she or he can deliberately manipulate the values of some variables (factors or
    independent variables) and measure the values of one or more response (or dependent)
    variables. We can confidently draw inferences about causation based on well-designed
    experiments.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'In contrast, researchers exercise little or no control in observational studies.
    We gather data, sometimes for the fact, about events or subjects and then use
    methods that we''ve studied to analyze the effect of interdependence among variables.
    Even the bestdesigned observational study does not permit us to conclude that
    one variable causes another.


    The data tables that accompany this book typify observational and experimental
    research as well as survey research. We have no choice but to use observational
    data, because a properly designed experiment would be prohibitively expensive,
    would raise ethical issues, or would be impractical or impossible for one reason
    or another. For example, engineers concerned with buildings that can withstand
    earthquakes randomly assign some cities to an earthquake. For ethical reasons,
    public health officials should not randomly assign some citizens to pollution
    or disease.


    When we can design an experiment, we should. If we need to establish the efficacy
    of a new treatment, we need to control relevant factors intentionally so that
    we can assess and understand their impact on the course of a disease or on patients''
    symptoms. In this chapter, we''ll begin with a simplified version of the experiment
    presented in Chapter One. Concrete is a mixture of ingredients that include water,
    cement, some kind of coarse aggregate like gravel, and fine aggregate like sand.
    The investigator, Dr. Yeh was interested in testing the compressive strength of
    concrete, particularly when substituting other ingredients for the material called
    fly ash, as a by-product of coal combustion. We observed that the compressive
    strength vary predictably as a result of the particular mixture of cement, water,
    and other component materials, the goal of the experiment was to develop a reliable
    model of compressive strength.


    In this chapter, after a brief description of the purposes of experimental design
    and design definitions, we''ll learn several standard approaches to DOE—the Design
    of Experiments. As we do, our focus is on the structure of the experiments and
    the generation of data. We won''t analyze the data that a design would generate,
    but instead devote this chapter to some of the fundamental concepts and issues
    in the design process. It is also important to note that DOE is a large and complex
    topic. This single chapter cannot deal with all aspects. The goal is to introduce
    the reader to some foundational concepts.


    # # Goals of Experimental Design


    DOE refers to the systematic process of planning the variation among factors so
    that suitable data can be collected for analysis in such a way that an investigator
    is able to generalize from their experiment. In other words, one major objective
    in the statistical'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'Chapter 18: Elements of Experimental Design 315


    design of experiments is to ensure that our experiments yield useful data that
    can be analyzed to draw valid conclusions and make better decisions.


    Hoer and Snee (2002), referring to industrial experimentation, identify three
    experimental environments, suggesting three broad goals for experimentation. Each
    environment is characterized by its own fundamental question, although any particular
    experiment might be a hybrid of the three categories.


    +   * Screening: Which variables have the largest effect on the response variable?

    * Characterization: How large are the effects of the most important variables?
    Are there any important interactions among these variables? Are relationships
    linear or curvilinear?

    * Optimization: At what values of the independent and control variables does the
    response variable attain a desired minimum, maximum, or target value?


    In this concrete example the ultimate goal is characterization: to build a model
    that predicts the compressive strength of a mixture of concrete. How do we do
    this? There are many components that influence strength: types of coarse and fine
    aggregates, water, cement, and other additives. A screening experiment would seek
    to identify a few factors affecting the strength. A characterization experiment
    would focus on factors identified by screening, and to understand how they collectively
    affect the strength. More, it might also assess possible interactions whereby
    the effect of one factor changes depending on the values of other factors. With
    the relevant variables and relationships identified, we would finally use an optimization
    approach to fine-tune the variables to a batch of cement with the desired compressive
    strength for a particular structure. We''ll begin with some standard approaches
    to screening experiments and define some important terms.


    # Factors, Blocks, and Randomization


    We will refer to the components that might affect compressive strength as factors.
    In general, a factor is a variable that can affect the response variable of interest.
    Factors might be categorical or numerical. The strategy in a screening experiment
    is to test a number of factors in order to discover which ones have the greatest
    impact on the response variable. When we design an experiment, we ideally take
    into account all potential sources of variation in the response variable. We generally
    do this in several ways within an experiment.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '+   We deliberately manipulate—that is, the set values of—some factors (sometimes
    called *treatments*) that we believe affect the response variable.


    +   We control other factors by holding them constant. For instance, because we
    understand that the strength of concrete depends on the temperature at which it
    cures, we test all combinations at the same temperature.


    +   We often repeat, or *replicate*, the measurements of the response variable
    for a given treatment condition through a series of *experimental runs*. We use
    this to gauge and control for measurement error.


    +   We might block some runs to account for similarities among runs. We when we
    have good reason to expect that some measurements will tend to be due to the shared
    factor being blocked.


    +   We randomize experimental runs to account for those factors that we cannot
    control, block, or manipulate. Thus, if we changes in barometric pressure could
    affect the outcome, we randomly assign the sequence of testing formulations.


    # # Multi-factor Experiments and Factorial Designs


    It might be natural to think that one should experiment by holding all factors
    constant except for one, and systematically alter the values or levels of that
    single factor. Se, for example, we might want to test varying amounts of sand
    in concrete mixtures with other components being held at given quantities. The
    shortcoming of such an approach is it can conceal an important influence of two
    or more factors. Perhaps the sand quality is not as important as the ratio of
    sand to coarser aggregate. When two variables combine to lead to a result, we
    say that there is an *interaction* between the two, and, in reality, an interaction
    to be found, we would never find it by examining only one factor or the other.
    We need to use multiple factors at a time.


    Another way to conceive of the issue is in terms of a *three-dimensional response
    surface*. Imagine that we have a response variable and two factors. If both factors
    were to contribute to the response in a simple additive and linear fashion (more
    of component A increases strength, more of component B weakens strength) then
    it would not matter if we vary A and B individually or jointly. The response variable
    would vary by strictly increasing one direction and decreasing in the other. The
    three variables together would form a plane, and by varying A and then B, we''d
    essentially be sliding up or down the plane in one direction or the other.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Chapter 18: Elements of Experimental Design 317


    But if the situation is more complex, that the response values vary on a surface
    that is curved in one or both dimensions, we''d need to explore a great deal of
    the surface to develop a more complete model. If the surface had multiple peaks
    and we only one factor at a time, it would be anomalous to traverse the surface
    from north to south or from east to west. We''d be characterizing one narrow region
    of the surface, and could potentially miss the peaks.


    Although single-factor experiments can be inadequate, multi-factor experiments
    can become very expensive and time-consuming. Let''s say we have identified ten
    possible factors affecting compressive strength. For screening is to test each
    factor at two levels initially—high and large, small and with without. A full
    experimental design enables us to measure the response variable at all possible
    combinations of all factors. In this case, a full factorial design would require
    us to create enough concrete blends to cover all possible combinations of different
    levels. That would require 2¹⁰ or 1,024 different designs. If we were to replicate
    each foundation ten times to estimate mean strength, we''d need to have 10,240
    experimental runs—at whatever cost of materials and time would involve


    There are several DOE strategies to accommodate many factors far more efficiently
    than just described. In practice, researchers usually rely on their experience
    with similar situations to select factors most likely to affect the outcomes of
    interest. Additionally, we typically design experiments to seek answers to specific
    questions; therefore, a designer allows the researchers questions to guide the
    selection of factors and interactions to


    To illustrate the fundamental logic and approach of factorial designs, we will
    begin with a modest number of factors. In general, a given factor might have several
    possible levels or values. For our first example, let''s consider three factors
    with two levels. Specifically, we''d design a full-factorial experiment as follows:


    +   - **Coarse Aggregate**: The amount (kg) of crushed stone per one cubic meter
    of concrete. The levels tested are 850 kg. and 1100 kg.

    - **Water**: The amount of water (kg) per cubic meter of concrete. The two levels
    will be 150 kg. and 200 kg.

    - **Slag**: Slag is a by-product in the production of iron from iron ore. Pulverized
    slag is a binding agent used in combination with or as a substitute for Portland
    cement, which is the most common cementitious ingredient in concrete. Slag is
    also measured in kg/cubic meter, and the amounts to test are 0 and 150 kg.


