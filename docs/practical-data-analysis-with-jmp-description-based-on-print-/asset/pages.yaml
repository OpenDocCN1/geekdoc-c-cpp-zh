  md: '# Chapter 7: Sampling and Sampling Distributions


    This chapter should help you understand the nature of simple random sampling.
    This chapter may also help you to become a more critical consumer of statistical
    studies by teaching you to ask questions about the implications of sampling methods
    other than simple random sampling. So-called complex methods, such as stratification
    and clustering, can also lead to excellent representative samples, which are generally
    considered to be beyond the scope of an introductory course. We''ll concentrate
    on the SRS in this chapter to develop a good foundation in the logic of statistical
    inference.


    One appealing feature of simple random sampling is that we can use a computer
    to visualize the variety of samples that are possible from a particular population.
    In fact, we''ll start our examination of sampling variance using the simulation
    capabilities of JMP to do that. We''ll begin with an artificially small population
    from which we''ll select some random samples. Our goal is twofold: first to learn
    how JMP can help us sample a random sample, and second, to develop an understanding
    of the ways in which a sample might miss a researcher. If we were truly working
    with such small population, we''d include every observation in the analysis. Our
    second goal is subtle but important—we''re starting small so that we can examine
    all possible samples from this population.


    # Using JMP to Select a Simple Random Sample


    The concept of a random sample is straightforward: choose a subset of a population,
    taking steps to ensure that all equal subsets share the same chance of selection.
    In practice, there are two common obstacles to random sampling: We often don''t
    know the size or the identities of members of the population. While these obstacles
    are easily overcome, the resulting samples are not simple random samples, strictly
    speaking. In this section, we''ll confine our attention to two ways in which we
    can use JMP to select a simple random sample.


    To choose n observations as a simple random sample, we need a way to gather or
    list all elements in the population. This is known as a *sampling frame*—the set
    from which the random subset is drawn. We also need some type of randomizing algorithm
    or method.


    By illustration, let''s revisit the NHANES survey data once again. This time,
    let''s suppose that the people interviewed for the NHANES are our population of
