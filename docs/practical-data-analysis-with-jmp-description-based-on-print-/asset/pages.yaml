  md: '# Chapter 5: Elementary Probability and Discrete Distributions 87


    the probability of each outcome is 1/n. Among other things, the classical method
    is applicable to games of chance (like card games) and to activities like simple
    random sampling.

    Here we also note that computations using classical probabilities often refer
    to outcomes that are composites of numerous outcomes. So, for example, when rolling
    two dice, we can think of the elementary outcomes for each die being faces with
    six spots. In dice, we sum the numbers on the two. In the context of the game,
    the events of interest—rolling a seven, or doubles—are not equally likely, but
    the fundamental outcomes for each die share the same probability of 1/6.


    +   - The Relative frequency applies to situations in which we can know and list
    the possible outcomes, but cannot assume that the outcomes are equally likely.
    This method relies on observation of a large number of repetitions of the situation,
    and then computing relative frequencies (number of occurrences divided by total
    number of observations). Observing dolphin behavior is one situation. Other examples
    include rates of disease incidence, batting averages, and college graduation rates.


    +   - The Subjective method applies to situations in which we lack information
    about possible outcomes or their relative frequency or both. In such instances,
    opinion forms the basis for probability assignments. Problems requiring expert
    opinion are beyond the scope of an introductory course, and will receive no further
    attention here.


    For elementary classical problems involving one or two events, a calculator is
    the tool of choice. For relative frequency problems, we are well served to use
    software like JMP to construct univariate frequency tables or bivariate contingency
    tables. We''ll use the dolphin example to illustrate.


