  md: 'Below the graph are two graphs and a table of diagnostic statistics. Although
    these are a basic feature of the JMP Time Series platform, they go beyond the
    typical content of an introduction to these techniques. We''ll bypass them for
    now.


    In the next two sections of the chapter we will introduce two common methods for
    smoothing the irregular sawtooth movement in a time series, both to better reveal
    the other components and to develop short-term forecasts. We''ll also introduce
    statistics to summarize the performance of the models.


    It is valuable to understand at the outset that the techniques of time series
    analysis share a particular logic. In each of the techniques presented in this
    chapter, we''ll apply the method to a sample of observations to generate retrospective
    "forecasts" for all or most of the observed data values. We then compare the forecasts
    to the values that were actually observed, asking "if we had been using this forecasting
    method at all, how accurate would the forecasts have been?" We''ll select a method
    for continued use, based on its past performance with a particular set of data.


    # Smoothing Methods


    As a first step in time series analysis it is often helpful to neutralize the
    effects of the random irregular component and thereby more visualize the behavior
    of the other three components. Perhaps the simplest method of summarizing a time
    series is known as a moving average. As the name suggests, the method relies on
    computing the average of the first few observations from say, $y_1$ through $y_m$.
    That average corresponds to the chronological center of the first $m$ observations
    or serves as the "prediction" for $y_{i}$. We then move along the series, computing
    the average of $y$ through $y_{i,j}$. This continues until we''ve passed the entire
    sample, continually taking averages of $m$ observations at a time, but always
    a different group of observations.


    Moving averages are commonly used, chiefly for their simplicity and computability
    if not for their usefulness as a forecasting method. In JMP, simple moving averages
    are favored among control chart methods discussed in Chapter 19 of this book.
    To introduce the concept of a smoothing method, we''ll turn first to three techniques
    known as exponential smoothing methods. JMP offers six variations of exponential
    smoothing, and we''ll consider three of them.


    Unlike moving averages, in which each estimate relies on a relatively small subset
    of the data, exponential smoothing uses a weighted combination of all prior values
    to compute each successive estimate. The computed values incorporate a weight,
    or smoothing constant, traditionally selected through an iterative trial-and-error
    process.'
