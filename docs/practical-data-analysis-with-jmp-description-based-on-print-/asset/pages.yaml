    # # Appendix A

    Data Sources


    +   Introduction 361

    Data Tables and Sources 362


    # ## Introduction


    Almost all of the data used for chapter examples and for application scenarios
    contain real data. This appendix provides the citations and initial source of
    each table. Most are from public-domain Web sites, and those that are not also
    cite the original author or compiler who granted permission for the data table
    to be used in this book. Those generous individuals are also listed in the "Preface."
    When the data initially accompanied a published journal article or book, the detailed
    citations appear in the bibliography.


    The University of California at Irvine Knowledge Discovery in Databases (KDD)
    Archive has proved an especially valuable source of data (http://kdd.ics.uci.edu),
    as noted in the table beginning the next page. Readers are encouraged to visit
    the KDD site for additional data tables. Similarly; the Data and Story Library
    (DASL, lib.stat.cmu.edu/DASL), maintained at Cornell University, is a very rich
    source of data sets.'
