  md: '86 Practical Data Analysis with JMP


    +   - Mutually exclusive events: If two events cannot possibly occur together,
    we call them mutually exclusive or *disjoint*. In the dolphin study, socializing
    and traveling are mutually exclusive exclusive.

    - Joint probability: Joint probability refers to the simultaneous occurrence of
    two events. It is expressed as the probability of events *A* and *B* occurring
    together, or the probability of the *intersection* of events *A* and *B*.

    - Union of two events: The union of two events refers to the situation in which
    one or the other event occurs, including their joint occurrence. It is expressed
    as *A* or *B*.

    - Conditional Probability: Sometimes the occurrence or non-occurrence of event
    *B*. Conditional probability refers to the probability of event *A* under the
    condition that another event has occurred. For example, in the dolphin study let''s
    designate event *A* as "observing a dolphin who is feeding". In general, there
    is probability at any time of observing a feeding dolphin; call it *Pr(A)*. We
    might ask whether probability is the same at different times of day. For instance,
    we might want to know the probability of observing a dolphin if we are looking
    at noon. Commonly, we''d speak of the conditional probability of feeding given
    it is noon, and we''d write this as *Pr(A|B)* or *Pr(Feeding|Noon).* Conditional
    is different from joint probability. When we ask about the probability that we
    observe a dolphin behavior and it is noon the implication is that we don''t know
    either the behavior or the time. When we ask about the probability that we observe
    a dolphin feeding given it is noon our situation is different. We know that it''s
    noon, but we don''t know what the dolphin knows.

    - Independence: Two events are independent if the occurrence of one provides no
    information about the occurrence of the other. More formally, if *P(A|B) = P(A)*
    we say that events *A* and *B* are independent. So, if dolphins are more likely
    to eat at one time of day than another, we''d find that the feeding is not independent
    of the event noon.


    # # Assigning Probability Values


    We''ve learned that a probability value is a number between 0 and 1, and it''s
    time to discuss we determine which value should attach to events. There are three
    basic methods for assigning probabilities—they are known as the Classical, Relative
    Frequency, and Subjective methods. The approach that we use depends on the circumstances
    of the particular activity we''re conducting.


    +   - The Classical method applies to activities in which we know and can list
    the possible outcomes, and can reasonably assume that all outcomes share the same
    likelihood of occurrence. If there are *n* equally likely outcomes, then


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute
    Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/publishing.'
