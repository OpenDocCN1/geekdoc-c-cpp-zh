  md: "# # Autoregressive Models\n\nWhen we use regression analysis to model the trend\
    \ of a time series, the dependent variable is the observed data $Y$, and the independent\
    \ variable is just the time period, $t$. An alternative approach is to model $Y$,\
    \ as a function of one or more prior observations of $Y$. As exponential smoothing,\
    \ there are many variations on this basic idea of an autoregressive model. In\
    \ this section, we'll examine one model from the general class of Autoregressive\
    \ Integrated Moving Average, or ARIMA models. These are also called Box-Jenkins\
    \ models, after the statisticians George Box and Gwilym Jenkins who developed\
    \ the techniques in the 1960s and early 1970s.\n\nThe ARIMA analysis properly\
    \ is performed on a stationary (without trend) time series. If there is a trend,\
    \ the Box-Jenkins approach first transforms $Y$ into a stationary series, usually\
    \ by means of making differences. If we were a steadily increasing series, we\
    \ might find that the first differences, $Y'_t = Y_t - Y_{t-1}$, is a stationary\
    \ series.\n\nAn ARIMA model has three parameters:\n\n| Parameter | Role Within\
    \ the ARIMA Model |\n|---|---|\n| p | Autoregressive order: the number of lagged\
    \ (prior) values of $Y$ to include in the model. A model that uses only one period\
    \ has an AR order=1. If the model includes the most recent periods, it has AR\
    \ order=2, and so on. |\n d | Differencing order: the number of times $Y$ is differenced\
    \ to generate the stationary series |\n q | Moving average order: the number of\
    \ lagged values of error terms (residuals) to include in the model.\n\nThe typically\
    \ notation for an ARIMA model references all three parameters, or at least the\
    \ nonzero parameters. Then, an AR(1,1) model uses one lagged value of the observed\
    \ values of $Y$. An AR(1,1) model uses one lagged value of the first differences\
    \ of $Y$ and so forth.\n\nOur time series is not *stationary*, so we will want\
    \ to use differencing to “flatten” the curve. However, to illustrate the techniques\
    \ we'll first estimate an AR(1) model, and then an AR(1,1) model. We'll compare\
    \ the results of the two to each other and to their exponential smoothing estimates.\n\
    \n+   15. Return to the Time Series window.\n\n+   16. Once again, click the triangle\
    \ at the top of the results window and now select ARIMA.\n\n+   17. This opens\
    \ a new panel; complete it as shown in Figure 17.9 and click Estimate."
  merge: -1
