  md: '# Practical Data Analysis with JMP


    covariation of bivariate data, which is to say we need methods to summarize the
    ways in which two variables vary together.


    The organization of this chapter is simple. We''ll classify data as either categorical
    (the modeling types nominal and ordinal) or continuous. If we focus on two variables
    in a study, there are three possible combinations to consider. We can look at
    two categorical variables, two continuous variables, or one of each. In the prior
    chapter, we first introduced graphical methods to display the variation of a distribution,
    and then presented summary statistics for those distributions.


    In this chapter, we''ll learn common methods for each of the three ways to pair
    bivariate data. We''ll use a single data table for all of the illustrations in
    this chapter: Birthrate 2005. This data table contains several columns related
    to the variation in the birth rate and the risks related to childbirth around
    the world as of 2005. In this data table, the United Nations reports figures for
    194 countries.


    +   Open the Birthrate 2005 data table now, and take a moment to scroll through
    the columns. We''ll explain each column as we work through the examples.


    # Describing Covariation: Two Categorical Variables


