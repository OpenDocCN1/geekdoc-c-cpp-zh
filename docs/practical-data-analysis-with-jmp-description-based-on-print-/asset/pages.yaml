  md: '# Figure 18.13 The Half-Fractional Factorial Design


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_344_0.png)


    As with any compromise, we gain something and lose something in this half-fractional
    design. We gain the efficiency by using only half of the possible runs. This comes
    at the cost of valuable information: because we run only some of the possible
    combinations, we will not test all possible interactions, and some effects will
    be confounded with others. We may not be able to determine whether a particular
    response is due to the main effects of the factors or their interactions. We refer
    to the confounded main effects and interactions as *aliases*.


    Now we may be able to understand the alias issue better. Look at the formulations
    that we are testing. We test only high coarse aggregate with (a) low water and
    low slag and (b) high water and high slag. We never test high aggregate with say,
    low water and high slag.


    Because there will be effects that cannot be clearly identified, we say that this
    half-fractional design has a weaker resolution than the comparable full-factorial
    design. We say that this is a Resolution III design. Fractional experimental designs
    are commonly classified as having the following resolutions:


    +   * Resolution III: Main effects can be confounded with two-factor interactions,
    but not with other effects.

    * Resolution IV: Main effects are not aliased with either or with two-factor interactions,
    but two-factor interactions are aliased with one another.

    * Resolution V: Neither main effects nor two-factor interactions are aliased with
    one another, but two-factor interactions are aliased with three-factor interactions.


    Selection of appropriate resolution goes well beyond the scope of this chapter,
    but it is important to understand that some experimental designs provide more
    information to an investigator than others. Designs of different resolution all
    have their places in practice.'
