    # ## Conditions for Least Squares Estimation


    Regression analysis is a powerful and flexible technique that we can reliably
    apply under certain conditions. Given a data table with continuous X-Y pairs we
    can always use the ordinary least squares (OLS) method to fit a line and generate
    results like those we saw in'
