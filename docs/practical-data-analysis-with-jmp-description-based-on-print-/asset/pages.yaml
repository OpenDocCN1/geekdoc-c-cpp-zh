    # ## Detecting Patterns Over Time


    For much of this book, we have examined variation across individuals measured
    simultaneously. This chapter is devoted to variation over time, working with data
    tables in which columns represent a single variable measured repeatedly and rows
    represent regularly spaced time intervals. In many instances, time series data
    exhibit common, predictable patterns that we can use to make forecasts about future
    time periods. As we'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# 296 Practical Data Analysis with JMP


    move through the chapter, we''ll learn several common techniques for summarizing
    variation over time and for projecting future values.


    Typically, we classify patterns in a series as a combination of the following:


    +   - Trend: Long-term movement upward or downward.

    - Cycle: Multi-year oscillations with regular frequency.

    - Season: Repeated, predictable oscillations within a year.

    - Irregular: Random movement up or down, akin to random disturbances in regression
    modeling.


    To illustrate these patterns, we''ll consider industrial production in India.
    India is one of the largest and fastest-growing economies in the world. Industrial
    production refers to the manufacture of goods within the country, in this example
    by India''s Index of Industrial Production (IIP). The IIP is a figure that compares
    a weighted average of industrial output from different sectors of the economy
    (for example, textiles, agriculture, manufacturing) to a reference year in which
    the index is anchored at 100. As a result, we can interpret the IIP as a percentage
    of what industrial output was in the base year. For instance, if the IIP equals
    150 we know that production was 50% higher than it was in the base year.


    +   1. Open the table called Industrial Production.


    This table contains IIPs for different segments of the Indian economy. All figures
    are reported monthly from January 2000 through June 2009.


