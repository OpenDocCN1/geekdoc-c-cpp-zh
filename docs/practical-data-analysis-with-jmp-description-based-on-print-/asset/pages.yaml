    # Dichotomous Dependent Variable


    Next consider studies in which the dependent variable is dichotomous. In such
    cases there are at least two issues that lead us away from using ordinary least
    squares and a linear model. First, because Y can take only two values (such as
    0 and 1) it is illogical to expect that a line provides a good model. A linear
    model will produce estimates that reach beyond the0-1 limits. Second, because
    observed values of Y will be either 0 or 1, it is not possible that the error
    terms in the model will have a normal distribution or a constant variance.


    With a dichotomous dependent variable, one approach is to use logistic regression.
    To illustrate, a logistic model is straightforward in JMP. We''ll turn to an example
    from the literature (Little, McSherry et al. 2008) on Parkinson''s disease (PD).
    PD is a neurological disorder affecting millions of adults around the world. The
    disorder tends to be prevalent in people over age 60, and as populations age,
    specialists expect the number of people living with PD to rise. Among the common
