  md: '# Probability Theory and Data Analysis


    In the prior chapters we''ve discussed ways to summarize collections of data visually
    and numerically. At this point our attention turns from the analysis of empirical
    information—data collected through observation—to the consideration of some useful
    theoretical constructs and models. Probability theory is a large and useful body
    of material and is the subject of entire courses in its own right. In an elementary
    statistics course, and in this book, probability is especially germinate in two
    respects. First, the goal of data analysis is to approximate the likelihoods of
    events or outcomes that are important to a decision-maker. For example, people
    who plan communications or transportation networks know the likelihood of traffic
    at different locations during the day.


    Second, probability theory provides the bridge between purely descriptive analysis
    and statistical inference, or the practice of drawing general conclusions from
    a single sample. Whenever we rely on one sample to represent a population, we
    need to be aware that our sample is one of many possible samples we might have
    taken. Each imperfect imperfect represents the present population, and samples
    in their representativeness. Because it''s impossible to know how representative
    any sample is, sampling creates an unavoidable risk of drawing erroneous conclusions
    about a population. To manage the risk, we''ll (hopefully) use probability theory.


    In this chapter we''ll confine our attention to a few probability topics that
    pertain to these two uses. If you are using an introductory statistics course,
    your principal text might include additional topics. The next section of this
    chapter selectively reviews some of the elementary vocabulary and rules of probability
    theory. It does not provide an exhaustive treatment but recapitates the terms
    and ideas covered by your major text.


    # Elements of Probability Theory


    In the next section of this chapter we''ll look at some data collected by Professor
    Marianne Rasmussen of the University of Southern Denmark who was observing the
    behavior of dolphins off the coast of Iceland. Let''s use this activity—observing
    dolphins in their typical corners and goings—as an illustrative framework for
    defining terms and concepts.


    Professor Rasmussen''s basic activity was to watch the behavior of dolphins at
    different times of day, and to record what they were up. She identified three
    basic activities: traveling quickly, feeding, or socializing. Dolphins tend to
    engage in these activities in'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 5: Elementary Probability and Discrete Distributions 85


    groups, she also tallied how many dolphins engaged in each activity. She also
    noted the time of day: morning, noon, afternoon, or evening.


    Consider the activity of observing the behavior of one dolphin. In the language
    of probability, an event is observing an observable result of an activity. So,
    we might define the event A as observing a dolphin who is traveling quickly, or
    event B as a feeding dolphin (by the same taken, we could call these events T
    or F). In Dr. Rasmussen''s study, we have three possible events of interest.


    Similarly, we can define events as outcomes of noting the time of day, and we
    have four possible events. For each of the two research activities in this study,
    we have defined lists of events (traveling, feeding, or socializing and morning,
    noon, afternoon, and evening). For the purposes of this study, any time she spots
    a dolphin it will be one of the three defined activities, and she does whether
    four times a day.


    # Probability of an Event


    We''ll assign a numerical value to the probability of an event as being proportional
    to its relative frequency of occurrence in the long run. For any event A we can
    write Pr(A) to represent this numerical value. In assigning probabilities to events
    there are just two rules:


    +   - The probability of an event is a value between 0 and 1, 0 ≤ Pr(A) ≤ 1. An
    event that is impossible has a probability of 0, and an event that is certain
    to happen has a probability of 1.

    - For any activity, if S is the complete set of all possible outcomes, Pr(S) =
    1. For the dolphins, this means that if Dr. Rasmussen sees a dolphin it will surely
    be traveling, feeding, or socializing.


    As a direct consequence of these two rules, we can always define an event A as
    the complement of event A. The complement of event A refers to all possible outcomes
    excluding the event, and Pr(A) = 1 - Pr(A). To illustrate, if event A is a feeding
    dolphin, then Ä is seeing a dolphin who is not feeding, or rather one who is traveling
    or socializing.


    # Rules for Two Events


    In many situations, we''re interested in two events at a time, and ask questions
    about the interaction or co-occurrence of two events. This section briefly reviews
    several important definitions and possible relationships between two events.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright ©2010, SAS Institute
    Inc., Cary, North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
