  md: 'xii Practical Data Analysis with JMP


    To be an effective analyst, you must know how to use these techniques, know when
    to use them, and how to communicate their implications. The same applies to becoming
    a knowledgeable and critical consumer of analyses. Knowing how to use these techniques
    requires mastery of computer software like JMP. Knowing when to use these techniques
    requires an understanding of the theory underlying the techniques, and practice
    with applications of the theory. Knowing how to effectively communicate requires
    a clear understanding of the theory and techniques, as well as clarity of expression,
    directed toward a particular audience.


    There was a time when a first course in statistics emphasized abstract theory,
    laborious computation, and small sets of artificial data—but not practical data
    analysis or interpretation. These days are thankfully past, and now we can address
    all three of the skills just cited.


    This book is intended to supplement an introductory college-level statistics course
    with real investigations of important and engaging problems. Each chapter presents
    a set of self-paced exercises to help students learn the skills of quantitative
    reasoning by performing the kind of analyses that typically form the core of a
    first course in statistics. Students can learn the software skills outside of
    class. Instructors devote time to statistics and statistics other than to rudimentary
    software instruction. Both students and teachers can direct their energies to
    the practice of data analysis in ways that inform students ''understanding'' of
    the world through investigations of problems that matter in various fields of
    study.


    # # Scope and Structure of This Book


    As a discipline, statistics is large and growing; the same is true of JMP. One
    paperback book must limit its scope, and the content boundaries of this book are
    set along several dimensions. First, this book provides considerable training
    in the basic functions of JMP. JMP is a full-featured, highly interactive, visual,
    and comprehensive package. The book assumes that you have the software at your
    school or office. The software''s capabilities extend far beyond an introductory
    course, and this book makes no attempt to "cover" the entire program. The book
    introduces students to its major platforms and essential features, and should
    leave students with sufficient background and confidence to continue exploring
    on their own. Fortunately, the Help system and accompanying manuals are quite
    extensive, as are the learning resources available online at www.jmp.com.


    Second, the chapters largely follow a traditional sequence, making the book compatible
    with many texts. As such, instructors and students will find it easy to use the
    book as a companion volume in an introductory course. Chapters are organized around
    core'
