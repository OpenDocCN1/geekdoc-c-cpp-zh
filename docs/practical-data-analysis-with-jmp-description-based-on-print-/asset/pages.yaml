  md: "# Testing for a Slope Other Than Zero\n\nIn some investigations we might begin\
    \ with a theoretical model that specifies a value for the slope or the intercept.\
    \ In that case, we come to the analysis with hypothesized values of either β or\
    \ β, or both, and we want to test these values. The Fit Y by X platform does not\
    \ accommodate such tests, but we used Fit Model in the prior chapter to perform\
    \ a two-way ANOVA. In this example, we'll use it to test for a specific slope\
    \ value other than zero.\n\nWe'll illustrate with an example from the field of\
    \ classical music, drawn from an article by Prof. Jesper Rydén of Uppsala University\
    \ in Sweden (Ryden 2007). The article focuses on piano sonatas by Franz Hayden\
    \ (1732–1809) and Wolfgang Mozart investigates the idea that these two composers\
    \ incorporated the golden mean within their compositions. A sonata is a form of\
    \ instrumental music consisting of two parts. In the first part, the composer\
    \ introduces a melody—the basic tune of the piece—known formally as the exposition.\
    \ Following the exposition comes a second part that elaborates the music body,\
    \ developing it more fully, offering some variations, and recapitulating or repeating\
    \ the melody. Many music scholars believe that Hayden and Mozart strove for an\
    \ aesthetically balance in the lengths of the sections specifically, they might\
    \ have divided their sonatas (deliberately or not) so that the relative lengths\
    \ of the shorter and longer portions approximated the golden mean.\n\nThe golden\
    \ mean (sometimes called the golden ratio), characterized and studied in the West\
    \ at least since the ancient Greeks, refers to the division of a line into shorter\
    \ segment a, and a longer segment b, such that the ratio of a:b equals the ratio\
    \ of b:(a+b). Equivalently,\n\n$$\\frac{a}{a+b} \\approx 0.61803$$\n\nWe have\
    \ a data table Mozart containing the lengths, in musical measures, of the shorter\
    \ and longer portions of 29 Mozart sonatas. If, in fact, Mozart was aiming for\
    \ the golden ratio in these compositions, then we should find a linear trend in\
    \ the data. Moreover, it should be characterized by this line:\n\n$a = 0 + 0.61803(b)$\n\
    \nSo, we'll want to test the hypothesis that $\\beta_1 = 0.61803$ rather than\
    \ 0.\n\n+   1. Open the data table Mozart.\n\n+   2. Select Analyze $\rightarrow$\
    \ Fit Model. Select Part as Y, then add Partb as the only model effect, and run\
    \ the model."
  merge: -1
