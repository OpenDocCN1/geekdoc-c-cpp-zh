  md: '# Chapter 15: Multiple Regression 263


    # Figure 15.8 Checking Residuals for Normality


    | Residual Compressive Strength |


    This distribution looks good. Although it is slightly asymmetric, there are no
    important departures from normality here. As such, we can conclude that we have
    the conditions in place to draw general conclusions based on this sample and our
    least squares regression estimates. That is, we''re almost in the clear to go
    ahead and draw conclusions. Because this is a multiple regression model, there''s
    one additional issue to consider.


    # # Collinearity


    In a multiple regression it is also important that the $X$ variables vary independently
    of each other within our sample. If any of the $X$ variables are highly correlated
    with any subset of $X$''s—a condition called *multicollinearity* or sometimes
    *collinearity*—the estimates of the regression coefficients will likely be distorted
    and some lead to nonsensical results. Think of it this way: if the experimenters
    increased the slag content of mixture every time they increased the cement component,
    they would never be able to determine how much the strength is affected by each
    ingredient.


    Two important aspects of collinearity. First, it is a property of a sample rather
    than the parent population. Whether or not the factors are correlated in the population
    we''ll have a problem if they are correlated in the sample. Second, it can occur
    when any subset of $X$''s is correlated with any other subset of $X$''s. This
    can mean that two factors are correlated or that several $X$''s are jointly correlated
    with another $X$. In this section, we''ll consider two regression models—one without
    collinearity and one with


