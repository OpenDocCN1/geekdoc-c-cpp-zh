    With continuous variables, probability is computed as the area under two points
    a and b. Some density curves have infinite domains, others have minima and maxima.
    For all density functions the area under the entire curve equals 1, analogous
    to the property that probabilities for a discrete variable sums to 1. As you advance
    through your study of statistics and encounter an increasing portfolio of applications,
    you will eventually work with several commonly used classes of density functions.
    In this chapter, we''ll focus on the normal (also known at the Gaussian) density
    function, which has wide application and is particularly relevant to the analysis
    of data from simple random samples.


    # # The Normal Model


    As in Chapter 5, we''ll rely on your principal textbook to provide an extensive
    introduction to normal distributions, and in this section review several attributes
    of the normal distributions that are essential for practical data analysis. Though
    we can use normal distributions in many ways, one frequent application is as a
