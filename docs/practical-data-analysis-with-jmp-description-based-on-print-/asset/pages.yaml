    # # Message for Instructors


    This book is used as a supplementary text in an introductory-level statistics
    course. I assume that, like me, you view class time as a resource scarce. One
    of my goals in writing this book was to strive for clarity throughout, so that
    students can be expected to work through the book on their own and learn through
    their encounters with the examples and exercises.


    Instructors might selectively use exercises as in-class demonstrations or group
    activities, interspersing instruction or discussion with computer work. More often,
    the chapters and scenarios can serve as homework exercises or assignments, either
    to prepare for other work, to acquire skills and understanding, or to demonstrate
    progress and mastery. Finally, some instructors may want to assign a chapter in
    connection with an independent analysis project. Some of the data tables contain
    additional variables that are not used within chapters. These variables may also
    be for original analyses or explorations.


    The bibliography may also aid instructors seeking additional data sources or background
    material for exercises and assignments. Tips for classroom use of JMP are also
    available at the book''s Web site through support.sas.com/authors.


    # # Message for Students


    Remember the primary goal of this book is to help you understand the concepts
    and techniques of statistical analysis. As it happens, JMP provides a wonderful
    software environment to do just that. Naturally, each chapter is "about" the software
    and at times you will find yourself focusing on the particular details of a JMP
    analysis platform and its options. If you find yourself becoming engaged in the
    specifics of a particular problem, step back and try to refocus on the main statistical
    ideas rather than software issues.


    This book should supplement but not replace your primary textbook or your classroom
    time. To get the maximum benefit from the book, you should take your time and
    work carefully. Read through a chapter before you sit down at the computer. Each
    chapter should require roughly 30 minutes of computer time; work at your own pace
    and take your time.


    The application scenarios at the end of each chapter are designed to reinforce
    and extend what you''ve learned in the chapter. The questions in this section
    are designed to challenge you. Sometimes, it is quite obvious how to proceed with
    your analysis; sometimes, you will need to think a bit before you issue your first
    command. The goal is to get to engage in statistical thinking, integrating what
    you have learned


