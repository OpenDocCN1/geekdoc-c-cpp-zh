  md: '# Normality


    Earlier we asked JMP to save the residual values. To do so it used the estimated
    regression equation and computed a fitted Y for each observed X value. Then we
    subtracted the fitted value from the observed Y and placed the difference in a
    new data table column Residual BMXBXMI. Although we can''t examine the distribution
