  md: '# An Example Free of Collinearity Problems


    In a well-designed experiment like this, the experimenter will have taken care
    to vary the $X$ variables independently. After all, in an experiment the researcher
    selects and controls the $X$ values. In observational or survey studies, collinearity
    is often a problem and we''ll look at such an example shortly. First, let''s see
    how we can check for its presence or absence.


