  md: '# Chapter 1: Getting Started: Introduction to JMP 3


    In this particular example we have two variables that we will represent as two
    columns within a data table. A variable is an attribute that we can count, measure,
    or record. The two variables in the Michelson data are “Velocity#(the measurement
    that he wrote down) and “Trial#, indicating the group to which each individual
    measurement belonged. Typically, we’ll record or capture multiple observations
    of each variable—whether we’re repeated measurements as Michelson did, or we’re
    recording facts from numerous respondents in a survey or individual items on an
    assembly line. Each observation (often called a case or subject in survey data)
    occupies a row in a data table.


    Whenever we analyze a data set in JMP, we’ll work with a data table. The columns
    of the table contain different variables, and the rows of the table contain observations
    of each variable. In your statistics course, you’ll probably use the terms data
    set, variable, and observation (or case). In JMP we more commonly speak of tables,
    columns, and


    One of the principles you’ll notice in this software is the differentiation among
    data types and modeling types. The columns that you will work with in this book
    are all numeric or character data types, much like data in a spreadsheet or numeric.


    In your statistics course you’ll be learning about the distinctions between different
    kinds of quantitative and qualitative data. In JMP these distinctions are called
    modeling types and JMP recognizes three types:


    +   - Continuous columns are inherently numeric; their data type is numeric; you
    can sum, averages, and so on), and assume an infinite number of values. Most measurements
    and financial figures are continuous. Michelson’s measurements of light’s velocity
    are continuous.

    - Ordinal columns either reflect a sequence of groups (for example, small, medium,
    large), chronology (for example, pre- and post-event), or any other classification
    with an inherent ordering of observations. In our data table, we have an ordinal
    variable indicating the sequence of Michelson’s five measurement groups. Ordinal
    columns can be either numeric or character.

    - Nominal columns simply differentiate among groups within the data. For example,
    if we are analyzing health data from different countries, we might want to compare
    figures by continent. In that case, continent would be considered a nominal (also
    known as categorical) variable. Nominal variables can also be numeric or character.
    So names are nominal, as are postal codes or telephone numbers.


    As we’ll soon see, understanding the differences among these modeling types is
    helpful in understanding how JMP treats our data and presents us with choices.'
