- img_proc: true
  md: '# Thinking About Linearity


    If two variables have a linear relationship, their scatterplot forms a line or
    at least suggests a linear pattern. In this example, our variables have a positive
    relationship: as X increases, Y increases. In another case, the relationship might
    be negative, with Y decreasing as X increases. But what does it mean to say that
    two variables have a linear relationship? What kind of underlying dynamic accounts
    for a linear pattern?


    As noted earlier, linearity involves a change in Y each time X changes by one
    unit. Y might rise or fall, but the key feature of a linear relationship is that
    the shifts in Y do not accelerate or diminish at different levels of X. If we
    plan to generalize from our sample, it is important to ask if it is reasonable
    to expect Y to vary in this particular way as we move through the domain of realistically
    possible values.


    # Random Error


    The regression model also posits that empirical observations tend to deviate from
    the linear pattern, and that the deviations are a random variable. We''ll have
    considerably more to say about the random deviations in Chapter 14, but it is
    very useful at the outset to understand this aspect of the regression model.


    Linear regression analysis doesn''t demand that all points line up perfectly,
    or that the two continuous variables have a very close association. On the other
    hand, if groups of observations systematically depart from the general linear
    pattern, should we ask if the deviations are truly random, or if there is some
    other factor to consider as we untangle the relationship between Y and X.


    # What Are We Assuming?


    The preceding discussion outlines the conditions under which we can generalize
    regression analysis. First, we need a logical or theoretical reason to anticipate
    that Y and X have a linear relationship. Second, the default method that we use
    to estimate the line of best fits works reliably. We know that the method works
    reliably when the random errors, satisfy four conditions:


    +   * They are normally distributed.

    * They have a mean value of 0.


    > Like all statistical software, J uses a default method for line-fitting that
    is known as ordinary least squares estimation, or OLS. A full discussion of OLS
    is well beyond the scope of this book, but it''s worth noting that these assumptions
    hold for OLS in partial, not to regression in general.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '+   They have a constant variance, $\sigma^2$, regardless of the value of $X$.


    +   They are independent across observations.


    At this early stage in the presentation of this technique, it might be difficult
    to grasp all of the implications of these conditions. Start by understanding that
    the following might be red flags to look for in a scatterplot with a fitted line:


    +   The points seem snugly around the line.


    +   There are a small number of outliers that stand well apart from the mass of
    the points.


    +   The points seem snugly concentrated near one end of the line, but far out
    toward the other end.


    +   There seem be greater concentrations of points distant from the line, but
    not many points concentrated near the line.


    In case none of these true signs is present. In the next chapter, we''ll learn
    more about looking for problems with the important conditions for inference. For
    now, let''s proceed.


