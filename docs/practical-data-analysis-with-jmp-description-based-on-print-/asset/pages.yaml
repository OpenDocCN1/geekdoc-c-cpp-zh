  md: 'Chapter 2: Understanding Data 27


    # Cross-Sectional and Time Series Sampling


    When the research concerns a population, the sampling approach is often cross-sectional,
    which is to say the researchers select individuals from the population at one
    period of intervals. Again, the individuals can be people, animals, firms, cells,
    plants, or anything of interest to the researchers.


    When the research concerns a process, the sampling approach is more likely to
    be time series or longitudinal, whereby a single individual is repeatedly measured
    at regular time intervals. A great deal of business and economic data is longitudinal.
    For example, companies and governmental agencies track and report monthly sales,
    quarterly earnings, or annual employment.


    Panel studies combine cross-sectional and time series approaches. In a panel study,
    researchers repeatedly gather data about the same group of individuals. Some long-term
    health studies follow panels of individuals for many years; some marketing researchers
    use consumer panels to monitor changes in taste and consumer preferences.


    # Study Design: Experiment, Observation, Surveying


    If the goal of a study is to demonstrate a cause-and-effect relationship, the
    ideal approach is a designed experiment. The hallmark feature of an experiment
    is that the investigator controls and manipulates the values of one or more variables
    and observes changes in the response variable. For example, in the concrete industry
    engineers might want to know how varying the amount of different additives affects
    the strength of the concrete. A research team would plan an experiment in which
    they would systematically vary additives and conditions, and then measure the
    strength of the resulting batch of concrete.


    Similarly, consider a large retail company that has a “customer loyalty” program,
    offering discounts to regular customers who present their bar-coded keys at the
    checkout counter. Suppose the firm wants to nudge customers to return to their
    stores more frequently, and generates discount coupons that can be redeemed if
    the customer visits the store within so many days. The marketing analysts in the
    company could design an experiment in which they vary the size of the discount
    and the expiration date of the offer, and then see when customers return.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright ©2010, SAS Institute
    Inc., Cary, North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
