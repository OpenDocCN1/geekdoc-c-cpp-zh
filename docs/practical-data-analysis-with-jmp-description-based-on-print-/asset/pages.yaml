  md: "driven by the desire to minimize the risk of a Type I error (rejecting a true\
    \ null hypothesis). We also do well to think about the capacity of a particular\
    \ test to discern a true alternative hypothesis. That capacity is called the power\
    \ of the test.\n\n# # The Power of a Test\n\nWe know that $\\alpha$ represents\
    \ the investigator's tolerance for a Type I error. There is another probability\
    \ known as $\beta$, which represents the probability of a Type II error in a hypothesis\
    \ test. The power of a test equals $1-\beta$. In planning a test, we can specify\
    \ the acceptable $\\alpha$ level in advance, and accept or reject the null hypothesis\
    \ when we compare the $P$-value to $\\alpha$. This is partly because the $P$-value\
    \ depends on a single hypothesized value of $\\mu$, as expressed in the null hypothesis.\n\
    \nThe situation is not as simple with $\beta$. A Type II error occurs when we\
    \ don't reject the null hypothesis, but we would have done so. That is say, the\
    \ alternative hypothesis—which is always an inequality—true, but we missed it.\
    \ In our example, where the alternative hypothesis was $\\mu=180$, there are an\
    \ infinite number of possible means that satisfy the alternative hypothesis. To\
    \ estimate $\beta$, we need to make an educated guess at an actual value of $\\\
    mu$. JMP provides another way to visualize the effects of various possible $\\\
    mu$ values.\n\nFor this discussion of power, we'll all over our example and the\
    \ two-sided version of the significance test: is the mean different from 180 minutes?\n\
    \n+   14. Click the red triangle next to **Test Mean*Value** and select **Power\
