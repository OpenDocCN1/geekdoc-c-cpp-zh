    # Stratification, Clustering, and Complex Sampling


    As noted previously, simple random sampling requires that we can identify and
    access all N elements in a population. This is not always practical, or there
    are several alternative strategies at length. It would be well worth the scope
    of this book to discuss these strategies at length, but many of JMP analysts anticipate
    the use of these methods, so a short introduction in order.


    Two common approaches break up population into groups, and then use random sampling
    to gather a probability sample based on the groups. Fundamentally, we use in one
    of two ways:


    *Stratification:* Strata (the singular form of stratum) are local or natural subgroups
    within a population such that individuals within a stratum tend to share similar
    characteristics, but those characteristics are likely to vary across strata. In
    a *stratified sample*, we identify


