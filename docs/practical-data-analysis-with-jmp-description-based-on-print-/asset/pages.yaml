    # ## Goals of Data Analysis: Description and Inference


    The central goal of this book is to help you build your capacity as a statistical
    thinker through progressive experience with the techniques and approaches of data
    analysis, specifically by using the features of JMP. As such, we will begin with
    some remarks about activities that require data analysis, and then we will begin
    using JMP.'
