  md: '+   4. The upper white rectangle is an editable field for adding a title; type
    Golden Mean in the box.


    +   5. In the next box to Partb, change the 0 to a 1 to indicate that we want
    to test the coefficient of Partb.


    +   6. Finally, enter the hypothesized value of the golden mean, . 61803 in the
    box next to «, and click the Done button.


    The Custom Test panel now becomes a results panel, presenting both a t-test and
    an F test, as shown in Figure 13.10. As we showed above, the estimated slope is
    only about 0.26 standard errors from the hypothesized value, which is very close.
    Based on the large P-value of 0.798, we fail to reject the null hypothesis that
    the slope equals the golden mean.


    In other words, the golden mean theory is credible. Note that because we can''t
    prove a null hypothesis, this analysis does not definitively establish that Mozart’
    sonatas conform to the golden mean. This is an important distinction in the logic
    of statistical testing: our tests are able to discredit a null hypothesis with
    a high degree of certainty, but we cannot confirm a null hypothesis. We can say
    that we have put a hypothesis to the test, and it is still plausible.


