  md: 'Chapter 3: Describing a Single Variable 43


    | Categorical types | Quantitative types |

    |---|--|

    | Nominal | Interval |

    | Ordinal | Ratio |


    One reason that it is important to understand the differences among data types
    is that we analyze in different ways. In JMP, we differentiate between nominal,
    ordinal, and continuous data. Both nominal and ordinal variables are categorical,
    distinguishing one observation from another qualitative, non-measurable variable.
    Interval and ratio data are numeric. Interval variables are artificially constructed,
    like a temperature scale or stock index, with arbitrarily zero points. Most measurement
    data is considered ratio data, because ratios of values are meaningful. For example,
    a film that lasts 120 minutes is twice as long as one lasting 60 minutes. In contrast,
    120 degrees Celsius is not as hot as 60 degrees Celsius.


