  md: '# Figure 16.12 A Log-Linear Model


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_306_0.png)


    The coefficient of Year tells us how the logarithm of subscribers increases each
    year. How can we use this coefficient to estimate the annual percentage growth
    rate of cell phone subscribers in Thailand from 1990 through 2006? We need to
    do some algebra arising from the differing process of steady annual percentage
    growth. If we let $Y_i$ represent the initial value of the series of numbers and
    $t$ let the unknown annual growth rate, the number of subscribers per 100 population
    at any future time, $t$, equals


    $Y_t = Y_0(1+r)^t$$


    If we take the log of both sides of this equation, we get the following:


    $$\ln(Y_t) = \ln(Y_0) + t\ln(1+r)$


    Because that $Y_0$ is a fixed value, this function is linear in form. The intercept
    of the line is $\ln(Y_0)$, the slope of the line is $\ln(1+r)$, and the independent
    variable is $t$. Moreover, we solve for the annual rate of increase, $r$, as follows:


    ```

    $$\hat{\beta} = \ln(1+r)\ne^{\hat{\beta}} = 1+r\nr = e^{\hat{\beta}}-1$$

    ```


    So, in this model the estimated slope is .3694427. If we raise $e$ to that power
    and subtract we find the rate: $e^{.3694427}-1=1.4469-.449$, or 44.69% per year.


    We can also estimate a log-linear model using the Fit Model platform. As we did
    earlier, we transform the response variable to equal the log of the number of
    subscribers.'
