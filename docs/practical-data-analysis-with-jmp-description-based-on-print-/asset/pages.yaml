    Let''s look closely at the cell in the upper left of the table that correspond
    to leaks that did not ignite. There are four numbers in the cell, as are in each
    cell of the table. The legend again appears in the upper-left corner of the table.


    Each cell contains the observed count, the expected count, the deviation (O -
    E), and the cell chi-square value. We''ll consider these one at a time. In Figure
    11.4, we see that 25 of the 424 incidents were in, fact, leaks where gas did not
    ignite. Next is the expected count of 16.3962, computed in the following way.


    Among all incidents 79 of 424, or 18.631%, did not ignite. If the null hypothesis
    is true—that in the on-going process of pipeline disruptions ignition is independent
    of disruption—then we would expect 18.63% of all incidents to be free from ignition,
    regardless of incident type. If so, 18.63% of the 88 leaks would have no ignition,
    18.621% of all 16.3962.


    The deviation of 8.6077 is just the difference between the observed and expected
    frequencies: Oi - Ei.


    Finally, the cell Chi^2 is $\frac{(O_i - E_i)^2}{E_i}$, or $8.6077^2/16.3962 =
    4.5148$.


    Each cell''s deviation makes a contribution to the aggregated chi-square value,
    which is reported at the bottom of the table. Pearson''s chi-square for the two-dimensional
    contingency is 7.055. In a contingency table, the number of degrees of freedom
    equals (the number of rows - 1) × (the number of columns - 1). Here, we have four
    rows and two columns, so DF = 3. If the null hypothesis is true, the chance of
    obtaining a chi-square statistic of 7.055 or larger is about 0.07. Assuming a
    conventional significance level of α = 0.05, we''d conclude this evidence is insufficient
    to reject the null. Although the evidence raises doubt about the independence
    of these two variables, the evidence is not compelling enough to conclude that
    they are related.


    The assumptions for this test are the same as for the goodness-of-fit test. We
    can rely on the results if our observations are independent and if the expected
    count in each cell exceeds 5.


    Notice that, with the t-tests of earlier chapters, there is no assumption here
    about the shape or nature of the population distribution. For this reason, chi-square
    tests are sometimes classified as “distribution-free” or nonparametric methods.
    The reliability of the test results is not dependent on how the categorical variables
    are distributed in the entire population.


