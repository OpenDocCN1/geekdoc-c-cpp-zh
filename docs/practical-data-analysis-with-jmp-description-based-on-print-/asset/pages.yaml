    # Approaches When Conditions Are Not Satisfied


    In this example data were consistent with the assumptions of normality and equal
    variances. What happens when the sample data does not meet the necessary conditions?
    In introductory courses, this question doesn''t arise or if it receives very brief
    treatment. As such, we will deal with it in a very limited way. Frankly, JMP makes
    it easy to accommodate "uncooperative" data.


    Earlier we noted that the assumption of equal variances is critical for reliable
    results in an ANOVA, and we saw how to test for the equality of variances. If
    there are significant differences in variance across the groups, we should not
    rely on the ANOVA table to provide statistical connections. Instead, JMP provides
    us with the results of Welch''s ANOVA, a procedure that takes the differences
    in subgroup variation into account.


    +   11. Look back in your output for the Test that the Variances are Equal (which
    appears in Figure 12.3).


    At the bottom of that output you''ll find the results of Welch''s test. In our
    example, that test finds F = 11.5283 with p < 0.0001. We would decide to reject
    the null hypothesis and conclude that the group means are not all equal. With
    Welch''s test, there are no procedures to accommodate Tukey''s HSD to determine
    where the differences lie.


    If the residuals are not even close to looking normal—multimodal, very strongly
    skewed, or the like—we can use a nonparametric equivalent test. Nonparametric
    tests make no assumptions about the underlying distributions of our data (some
    statisticians refer to them as "distribution-free" methods).


    +   12. Return to the hotspot, and select Nonparametric → Wilcox Test.'
