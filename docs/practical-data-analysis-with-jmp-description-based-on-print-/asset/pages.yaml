  md: '# Observational Data—An Example


    Of course, experiments are not always practical, ethical, or legal. Medical and
    pharmaceutical researchers must follow extensive regulations, and can experiment
    with dosages and formulations of medications, but cannot randomly expose patients
    to diseases. Investors do not have the ability to manipulate stock prices (if
    they do and get caught, they go to prison).


    Now open the data table called Stock Index Weekly. This data table contains time
    series for six major international stock markets. A stock index is a weighted
    average of the prices of a sample of publicly traded companies. In this table
    we find the weekly index for the following stock market indexes, as well as the
    average of shares traded per week:


    +   * Nikkei 225 Index – Tokyo

    * FTSE100 Index – London

    * S&P 500 Index – New York

    * Hang Seng Index – Hong Kong

    * IBM Index – Madrid

    * TA100 Index – Tel Aviv


    The first column (or variable) is the observation date; note that the observations
    are basically every seven days after the second week. All of the other columns
    simply record the index and value as they occurred. It was not possible to set
    or otherwise control any of these values.


