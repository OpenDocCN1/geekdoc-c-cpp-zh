  md: '# Chapter 12: Analysis of Variance 199


    These three conditions form the foundation for drawing inferences for ANOVA. In
    practice, it is helpful, though not necessary to have samples of roughly equal
    size. With varying sample sizes, the technique is particularly sensitive to the
    equal variance assumption, which is to say that the statistical results can be
    misleading if our sample data deviate too far from approximately equal variances.
    Therefore, an important step in the conduct of analysis of variance is the evaluation
    of the extent to which our data set challenges the validity of these assumptions.


