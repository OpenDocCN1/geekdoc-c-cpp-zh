    # # Poisson


    Similar to the binomial distribution the Poisson distribution refers to the number
    of times

    an event occurs. Unlike the binomial Poisson refers to the number of occurrences

    over a continuous span of time or distance rather than a discrete number of trials.

    Because of this difference, a Poisson-distributed variable has no logical maximum.


    A Poisson distribution has a single parameter, conventionally known as λ (lambda),

    which is equal to the mean number of occurrences within one unit of time or distance.

    For the sake of this, we''ll compute probabilities for a Poisson random variable

    with a mean rate of λ = 5.


    Notice that the values with the highest probabilities are k = 5 and k = 6. There
    is

    o maximum possible value, the probability of 20 successes is 2.64114e-7, or a

    tiny probability of 0.00000264.


    The integer, binomial, and Poisson distributions are commonly included in introductory

    statistics courses. We have seen that the list of discrete distribution functions
    is quite

