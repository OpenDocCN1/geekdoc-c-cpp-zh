    # Moving Data from Excel Files into a JMP Data Table


    There''s a good chance that you''ll want to begin an analysis with data that you
    already have in an Excel workbook file. There are several ways to transport data
    from Excel and other formats into JMP; Chapter 2 of the JMP User Guide covers
    this topic but in this first section of the chapter, we will see one simple approach.


    This method only works if the spreadsheet is already structured like a JMP data
    table: each column of the worksheet should represent a single variable, and each
    observation. It''s best if the top row is reserved for column names and the observations
    start in row 2. We''ll assume there''s just a single sheet within the workbook
    file.


    Finally, it''s important to understand if there are formulas or functions in the
    Excel file, they will not be imported into JMP. JMP will read the results of a
    formula into a cell. If Column C of the spreadsheet equals the sum of Columns
    A and B, JMP will read the sum but not the formula.


    To illustrate this method, let''s suppose we have the same Customer data in a
    spreadsheet called Customers.xls.


