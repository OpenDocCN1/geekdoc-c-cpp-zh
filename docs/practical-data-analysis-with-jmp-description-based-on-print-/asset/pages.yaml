- img_proc: true
  md: '# Summary of Fit


    Under the heading **Summary of Fit**, we find five statistics that describe the
    fit between the data and the model.


    +   - **RSquare and RSquare Adj** both summarize the strength of the linear relationship
    between the two continuous variables. The RSquare statistics range from 0.0 and
    1.0, where 1.0 is a perfect fit. Just as in Chapter 4, think of RSquare as the
    proportion of variance in $Y$ that is explained by $X$. Both statistics are approximately
    0.86, suggesting that a man''s waist measurement could be a very good predictor
    of BMI

    - **Root Mean Square Error (RMSE)** is a measure of the dispersion of the points
    from the estimated line, as is the sample standard deviation of the random noise
    in the model. Think of it: when points are tightly clustered near the line, this
    statistic is relatively small. When points are widely scattered from the line,
    the statistic is relatively large. Comparing the RMSE to the mean of the response
    variable (next statistic) is one way to decide whether it is comparatively large
    or small.

    - **Mean of Response** is just the mean value of $Y$.

    - **Observations** is the sample size. In this table, we have complete waist and
    BMI for 107 men.


    # Lack of Fit


    The next heading is **Lack of Fit**, but this panel is initially minimized in
    this case, Lack of Fit tests are typically considered for more advanced statistics
    courses, so we only mention them without further comment.


    # Analysis of Variance


    ANOVA results should look familiar if you''ve just completed Chapter 12. In the
    context of regression, ANOVA gives us an overall test of significance for the
    regression model. In a one-way ANOVA, we hypothesized that the mean of a response
    variable was the same across several categories. In regression, we essentially
    hypothesize that the mean of the response is variable regardless of $X$—that is
    to say that $Y$ does not vary with $X$.


    We read the table just as in the previous chapter, focusing on the F-ratio and
    the corresponding $P$-value. Here F is over 658 and the $P$-value is smaller than
    0.0001. This probability is so small that it is highly unlikely that the computed
    F-ratio came through sampling error. We reject the null hypothesis that waist
    circumference and BMI are unrelated, and conclude that we''ve found a statistically
    significant relationship.'
