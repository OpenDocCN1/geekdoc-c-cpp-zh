  md: '# Chapter 8: Inference for a Single Categorical Variable 145


    # Figure 8.2 Confidence Interval for a Proportion


    | Level | Count | Prob | Lower CI | Upper CI | 1-Alpha |

    |---|---|---|---|---|--|

    | No | 95 | 0.21987 | 0.15796 | 0.23129 | 0.950 |

    | Yes | 358 | 0.80813 | 0.76887 | 0.84204 | 0.950 |

    | Total | 443 | | | | |

    Note: Computed using score confidence intervals.


    This interval estimate acknowledges our uncertainty in two respects: the width
    of the interval says "this interval probably captures the actual parameter" and
    the confidence says "there''s about a 5% chance that the sample we drew led us
    to an interval that excludes the actual parameter."


    Notice that the sample proportion of .808 is just about midway (but not exactly)
    between the upper and lower CI boundaries. That is not an accident; confidence
    intervals are computed by adding and subtracting a small margin of error to the
    sample proportion. There are several common methods for estimating the center
    of the interval and the margin of error. One elementary method takes the number
    of observed occurrences divided by the sample size ($p$) as the center, and computes
    the margin of error based on properties of the Normal distribution. JMP uses an
    alternative method, as noted the intervals. JMP uses "score confidence intervals,"
    which are sometimes called the Wilson Estimator. The Wilson estimator does not
    center the interval at $\hat{p}$ at a slightly adjusted value.


    For most purposes, the computational details behind the interval are less important
    than the assumptions required in connection with interpreting the interval. If
    our sample meets the two earlier conditions, we can rely on this interval estimate
    with 95% confidence if our sample size is large enough. Specifically, this estimation
    method captures the population interval within the interval about 95% of the time
    if:


    > The sample size, n, is sufficiently large that $n\hat{p} > 5$ and $n(1-\hat{p})
    > 5$.


