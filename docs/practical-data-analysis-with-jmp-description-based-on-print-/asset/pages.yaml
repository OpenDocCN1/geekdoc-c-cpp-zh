  md: '# Discrete Random Variables: From Events to Numbers


    In the dolphin study, we framed the research questions in terms of categorical
    behaviors and times of day. In some instances, the research variables were numerical
    rather than categorical: during a flu outbreak, how many children in the school
    system will become ill? In a random sample of customer accounts, how many billing
    errors will we find? In such cases, we''re focusing on a discrete variable—one
    that assumes countable integer values. If we''re talking about a flu outbreak,
    we may find 0, 1, 2, 3... sick children and each of these values may occur with
    a unique probability.


    If the variable of interest takes on the probability distribution of the variable.
    In practice, we can use one of several theoretical discrete distributions to build
    a model of such situations. It will beyond the scope of this book to provide a
    full treatment of discrete random variables. The following sections assume your
    familiarity with the concept of a random variable, which theoretical distribution
    you want to apply to a problem, and you want to use JMP to calculate probability
    values for a random variable or to generate random data conforming to a known
    discrete distribution. The goal here is to introduce how JMP handles discrete
    distributions, but not to provide an exhaustive treatment of the subject.


    # Three Common Discrete Distributions


    There are quite a large number of theoretical discrete distributions. This section
    and the next demonstrate how JMP implements only three of them, but others work
    similarly. In this section, we''ll see how to build a data table that computes
    probability values for each distribution; in the next section we''ll simulate
    random observations to conform to each distribution.


    For these illustrations, we''ll consider three random variables, each of which
    can assume values starting at 0 up to a maximum value of 20. To begin, we''ll
    set up a new data table where first column is a list of integers from 0 to 20.


    +   3. Select File → New → Data Table (CTRL-N).


    +   4. Double-click the word Untitled in the table panel, and name this table
    Discrete Distributions.'
