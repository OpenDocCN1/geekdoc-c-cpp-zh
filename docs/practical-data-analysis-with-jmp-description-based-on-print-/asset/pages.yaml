    # # A Few Words About Error


    Whatever we conclude, there is chance that we''ve come to the wrong conclusion
    about the population proportion. This has nothing to do with computational mistakes
    or data entry errors (it''s always wise to double check) and everything to do
    with sampling variability. When we construct a 95% confidence interval, we''re
    gambling that our sample is from the 95% whose sample proportions lie a modest
    distance from the actual parameter. By bad luck, we might draw a sample from the
    other 5% of possible samples.


    With hypothesis testing, the situation is slightly different because we can go
    astray whether we reject the null hypothesis or not. If our P-value is small,
    there is still a chance that we''re rejecting the null hypothesis when we should
    not. This is called a Type I Error, and hypothesis testing is really designed
    to minimize the risk of encountering this situation.


    Alternatively, a larger P-value (which leads us to persist in believing the null
    hypothesis) also carries the risk of a (Type II) error, whereby we should reject
    the null hypothesis, but not because our evidence doesn''t convince us to do so.
    If you can come to understand what these errors imply and why they are important
    to decision-making, you''ll more quickly come to incorporate the logic of significance
    testing in your thinking.'
