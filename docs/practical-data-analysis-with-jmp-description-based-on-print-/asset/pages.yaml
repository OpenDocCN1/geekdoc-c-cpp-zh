  md: 'Chapter 17: Basic Forecasting Techniques 307


    # Figure 17.11 Parameter Estimates for AR(1,1) Model


    # ▼ Parameter Estimates


    | Term | Lag | Estimate | Std Error | t Ratio | Prob(>t) | Constant Estimate |

    |---|---|---|---|---|---|---|

    | AR1 | 1 | -0.7487255 | 0.0654711 | -11.43 | <0.001* | 1.48287326 |

    | Intercept | 0 | 0.8479237 | 0.369152 | 2.30 | 0.0235* | |


    We cannot compare these estimates to those for the AR(1,1) model, because prior
    to estimating, JMP calculated the first differences. At the margin, the incremental
    change in the monthly change in the index is about 75% less than the month. The
    negative coefficient leads to oscillations, if one month has a positive change,
    the forecast will be for a reduction in the following period and if a month has
    a negative change, the forecast will be positive. Although the computations are
    for the relatively stationary series of differences, JMP reconstructs the time
    series for the sake of the forecast, showing the general upward trend.


    Now let''s compare our autoregressive models to each other and to the smoothing
    models. Everything we need is in the Model Comparison panel, as shown in Figure
    17.12. Because the panel is so wide, we''ve eliminated some of the reported statistics,
    focusing on the ones we''ve discussed earlier.


    # Figure 17.12 Comparing Time Series Methods


    # ▼ Model Comparison


    | Model | DF | RSquare | AIC | SBC Rank | MAPE | MAE |

    |---|---|---|---|---|---|---||

    | Simple Exponential Smoothing | 109 | 0.956621 | 0.934 | 4 | 3.176537 | 5.986035
    |

    | Linear (Holt) Exponential Smoothing | 107 | 0.9421563 | 0.934 | 3 | 3.236453
    | 6.043397 |

    | Winters Method (Additive) | 104 | 0.9971156 | 0.940 | 2 | 2.315726 | 6.109666
    |

    | AR(1) | 109 | 0.991185 | 0.978 | 5 | 4.290917 | 7.913429 |

    | AR(1,1) | 108 | 0.9832048 | 0.949 | 2 | 2.779901 | 5.367523 |


    Every series is different, and we cannot categorically say one method will be
    better than another. In this example, the AR(1,1) model outperforms the others
    on our four criteria that we have studied. It has the smallest variance, MAPE,
    and MAE of the four as well as the highest RSquare. Although we did not discuss
    the AIC (Akaike''s “A” Information Criterion), we might note that it ranks second
    among the models using that standard.


