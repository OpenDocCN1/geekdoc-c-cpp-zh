  md: 'Along with the *median*, the mean and median are usually quite close in value.
    In a symmetric distribution, the mean and median are essentially equal. When the
    distribution is strongly left-skewed like this one, the mean will tend to be smaller
    than the median. In a right-skewed distribution, the opposite is true.


    +   - The standard deviation (Std Dev) is a measure of spread, and you might think
    of it (almost correctly) as the average distance of a value from the mean of the
    distribution. It is usually represented by the symbol $s$, and is computed as
    follows:


    ```

    $s = \sqrt{\frac{\Sigma(X-\bar{X})^2}{(n-1)}}$

    ```


    We''ll have more to say about the standard deviation in later chapters, but for
    now note that it must be greater than or equal to zero, and that highly dispersed
    variables have larger standard deviations than consistent variables.


    +   - n refers to the number of observations in the sample.


    # # Outlier Box Plots


    Now that we''ve discussed the five-number summary, we can interpret the box plot
    just above the histogram back in Figure 3.7. The key to interpreting an outlier
    plot is to understand that it is essentially a diagram of the five-number summary.


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_74_0.png)


    In a box plot there is a rectangle with an intersecting line. Two edges of the
    rectangle are located at the first (Q1) and third (Q3) quartile values, and the
    line is located at the median. In other words, the rectangular box spans the *interquartile
    range* (IQR). Extending from the ends of the box are two lines (whiskers). In
    a distribution that is free of outliers, the whiskers reach to the minimum and
    maximum values. Otherwise, the plot limits the reach of the whiskers by the *upper*
    and *lower* fences. The fences are located at a distance of 1.5 IQRs from each
    quartile. In our distribution, we have a cluster of six'
