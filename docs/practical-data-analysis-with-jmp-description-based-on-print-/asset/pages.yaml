    # Analysis Platforms—A Descriptive Analysis


    With Michelson''s data, let''s take a look at his measurements. As you peruse
    the list of values, you might notice that they vary. Variation is supposed to
    be invisible, but the very fact they vary is what leads us to analyze them. Think
    about it. Michelson was measuring something that we now think of as a constant:
    the speed of light. In his time, the idea that light travels at a speed was not
    universally accepted, and what''s more he and his contemporaries did not know
    the value of that constant. Hence, he was trying to measure this unknown constant.
    His instrumentation was imperfect, and he couldn''t look up the correct value
    in the back of his physics textbook.


