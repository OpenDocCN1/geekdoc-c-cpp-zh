    # Capability Analysis


    In most settings, it is not sufficient that a process be in statistical control.
    It is also important that the results of the process meet the requirements of
    clients, customers, or beneficiaries of the process. To return to our earlier
    example, if the extrusion process consistently produces tubing that is either
    the wrong diameter or highly inconsistent, the tubing might not be suitable for
    the intended medical purposes.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute
    Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional resources,
    visit support.sas.com/publishing.'
