    The graph displays a two-sided test. In the red curve, the pink-shaded areas represent
    not the P-value but rather $\alpha = 05$. That is, each tail is shaded to show
    2.5% of the curve beneath the shaded areas. If we take a sample and find the sample
    mean lying in each pink region, we''ll reject the null hypothesis. In advantage
    of sampling, we decided to make the size of those regions 5%. This is the rejection
    rule for this particular test.


    The blue-shaded area shows $\beta$. As it is depicted, with the population mean
    really at 149.018, the null hypothesis is false and should be rejected. Among
    the possible samples from the blue universe (where the samples really come from)
    about 13% of them are outside the rejection region of the test, and in those 13%
    of possible samples, we''d erroneously fail to reject the null hypothesis. The
    power of this test is 0.87, which is to say that if the true mean were really
    149.018 minutes, this test would correctly reject the null hypothesis in 87% of
