  md: '# All Possible Samples: Sampling Distributions


    Cultures across the globe have developed myths and stories about the stars, and
    many cultures have associated animals, symbols, or characters with specific constellations.
    In China, as in the Western world, there are 12 astrological signs. Unlike the
    Western version, the Chinese zodiac refers to 12 different animals: the Rat, Ox,
    Tiger, Rabbit, Dragon, Snake, Horse, Monkey, Rooster, Dog, and Pig. Nine of these
    are mammals and three are not.


    In this example we''re going to focus on the dichotomous attribute of whether
    or not a given sign refers to a mammal. Further, we''ll consider the process of
    randomly sampling six signs of this zodiac and counting the number of mammals
    in a sample. In particular, we want to reason as follows.


    This is a fairly situation. There are twelve signs, of which nine are mammals.
    An investigator who does not have the advantage of our full knowledge is to select
    a random sample of just six signs; and, based on that, the investigator estimates
    how many of twelve are mammals.


    Because the random sampling process is probabilistic, it is impossible to know
    whether the investigator will ultimately make an accurate estimate. However, we
    can precisely describe the distribution of all possible samples. In fact, we have
    a data table that lists all them.


    +   4. Open the data table called Chinese Zodiac.


    This table has columns and 924 rows and each row represents one sample of six
    zodiac signs. The first column is a sequential identifier. The next six columns
    are the specific animals selected for the sample. The final column is the number
    of mammals in the sample.


    Remember, our researcher will randomly choose one of these rows, and that sample
    will determine the estimate of the proportion of mammals in the population. As
    you scroll through the rows, notice that the number of mammals in each sample
    range from three to six. As a consequence the investigator''s estimate will have
    to be a number between 50% and 100%. Whichever sample emerges from the sampling
    process, we already see that there is a limit to how inaccurate an estimate can
    be. The investigator could be misled into believing, say, that 100% of the animals
    are mammals, but could never conclude that only 30% are mammals.


    > ith a population of 12 items, the number of possible 6-item samples is equal
    to the number of combinations of 12 items taken 6 at a time. This is calculated
    by the formula ${12 \choose 6} = 924$.'
