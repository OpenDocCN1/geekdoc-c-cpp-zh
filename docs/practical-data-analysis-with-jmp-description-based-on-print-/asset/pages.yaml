  md: '# Chapter 15: Multiple Regression 261


    Now look below the group of graphs at three of the next four panels—all of which
    we''ve seen before. We interpret these statistics as the simple case with a few
    notable exceptions:


    +   - In the Summary of Fit panel, we note that now the RSquare and RSquare Adj
    statistics are unequal. Adding X variables inflates RS, we prefer the adjusted
    figure because it is a more useful measure when comparing models with different
    numbers of model effects.

    - Although the ANOVA table is identical to its counterpart in the bivariate context,
    the unstated null hypothesis has changed. In multiple regression, our null hypothesis
    is that is no association between Y and any of the X variables.

    - The Parameter Estimates panel has expanded, with a row for the intercept and
    additional rows for each of the X variables in the model.


    There are two important interpretations in here. First, the coefficients for the
    slope estimates now represent the estimated change in Y corresponding to a one-unit
    change in X assuming that all other variables remain unchanged. For example, the
    estimated coefficient of Cement in this model is approximately 0.112. We''ll interpret
    this by saying that the compressive strength of a mixture increases by 0.112 megapascals
    for each additional 1 kg. of cement if there is no change in the amount of slag
    or water in the mixture.


    Similarly, the negative coefficient of Water means that, adding the amount of
    cement and slag constant will weaken the mixture.


    The second change is the way we interpret the t-statistic and P-value. As before,
    a very small P indicates statistical significance. We now note whether a variable
    makes a significant contribution to the model once all of the other variables
    have been accounted for. Another way to think about this is that the individual
    test is testing whether the full model that we''ve specified—with three factors—fits
    the data better than a reduced model with just two factors. In this example, all
    of the individual tests are significant. In other words, each of our three X variables
    is significant in the presence of the other two.


    > As we did earlier, we''ll bypass the Lack of Fit panel because its contents
    go beyond the usual coverage of an introductory course.


