  md: '# Chapter 17: Basic Forecasting Techniques 301


    Notice that each of the forecasts is the same value, represented in the graph
    by the horizontal red line—reflecting the problem with applying this simple approach
    to forecasting with a strong trend. For that, we need a method that captures the
    trend component. Holt''s method does just that.


    # Linear Exponential Smoothing (Holt''s Method)


    Linear exponential smoothing, developed by Charles Holt in 1957, expands the model
    of exponential smoothing by incorporating a linear trend element. Operationally,
    we proceed much as we do in generating a simple exponential smoothing model.


