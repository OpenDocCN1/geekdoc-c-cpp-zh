  md: '# Chapter 19: Quality Improvement 343


    Before looking at the resulting chart, it is valuable to understand a few essential
    ideas about the structure and use of these charts. An XBar Chart, as the name
    implies, is a graph of sample means. In this example, we have six daily measurements
    of diameter over a period of 20 days. We''re specifying that we want to chart
    the daily sample means for the duration of Phase 1, the chart will display 20
    points.


    # Figure 19.3 Specifications for an XBar Chart


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_359_0.png)


    In parlance of statistical process control, a process is in control if the variation
    exhibited by the process (as measured by the sample means) remains within the
    bounds of an upper and lower control limits. There are different methods for establishing
    the control limits, and the default method in JMP is to define them as three deviations
    above and below the mean of the process. The Parameters of the chart are initially
    defined as k sigma from the mean, where the default value of k = 3 (See Figure
    19.4). We know that in a normal distribution, about 99.7% of cases fall within
    three standard deviations of the mean.


    # Figure 19.4 Specifying Method and Parameter for Control Limits


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_359_1.png)


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute
    Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit sas.com/publishing.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '344 Practical Data Analysis with JMP


    We could specify the control limits—known as the UCL and LCL for upper and lower
    control limits—by specifying tail probabilities, such as 0.025 if we want the
    boundaries to comprise 95% of the probability around the mean.


    A process cannot be in control if the variance is not constant throughout the
    observation period. In other words, there is a requirement for homoskedasticity
    in order to draw conclusions about whether a process is in control. Traditionally,
    there are two methods to judge the stability of the process variance: by charting
    the sample ranges (R chart) or by charting the sample deviations (S chart).


    The virtue of an R chart over an S chart in a factory setting is the computational
    simplicity: if an operator makes sample measurements, plotting the range requires
    only the subtraction of two measurements. Computing a standard deviation might
    have been an intrusive burden on a production worker. With software, the S chart
    is readily available and probably the better choice. We''ll illustrate both.


    In JMP we must choose between XBar-R combination or an XBar-S-chart combination.
    The default setting, in a nod to history, is the R chart. (See Figure 19.5.)


    # Figure 19.5 Choosing the Charts to Display


    +   - XBar

    R

    S


    The resulting control charts are shown in Figure 19.6. You should develop the
    habit of interpreting these charts by looking at the lower R chart to decide whether
    this manufacturing process exhibits stable variability. In the range chart, we
    see a center line, representing the mean of the ranges of the twenty samples.
    Above and below the center line are control limits.


    When we scrutinize a control chart, we''re looking for specific indications of
    non-random variation such as:


    +   - Do an excessive number of points falls outside of control limits?

    - Is there systematic clustering of consecutive points above or below the center
    line?

    - Does the series consistently drift either upward or downward? An increase in
    sample ranges indicates greater inconsistency in the process.


    > There are some standard criteria against which JMP can report important deviations.
    This list is intended to introduce the concept of specific tests by which to judge
    process stability.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute
    Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/publishing.'
