    The reported test statistic was computed using this formula:


    $$\chi^2 = \sum_{i=1}^{k} \frac{(O_i - E_i)^2}{E_i}$$


    where $O_i$ is the observed frequency of category $i$ and $E_i$ is the expected
    frequency of category $i$ assuming that the null hypothesis is true. In this example,
    the expected frequency for each of the four categories is 111.75, as explained
    earlier.


    Pearson’s chi-square statistic aggregates the discrepancies between the observed
    and expected counts for each category. If the data perfectly corresponded to the
    model, the numerator of each term in the sum would be zero, and the test statistic
    would equal zero. To the extent that the data and the model don’t correspond,
    the statistic grows.


    When the null is true, there will be some aggregated discrepancy due to sampling
    error and the fact that observed frequencies are integers. That aggregated discrepancy
    follows a chi-square distribution, enabling JMP to compute a P-value for the test
    statistic. When the discrepancy is so large as to cause doubt on the null hypothesis
    (as reflected in a very tiny P-value), we reject the null. That’s the case in
    this instance. The P-value is reported as smaller than 0.0001, so we reject the
    null hypothesis and conclude that our initial model of equal likelihoods does
    not fit with the data.


    > *The statistic is more commonly presented in introductory statistics texts.'
