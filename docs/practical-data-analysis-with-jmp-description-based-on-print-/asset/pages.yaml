  md: '# Chapter 13: Simple Linear Regression 227


    Not can we say that the pattern describes the sample, we can say with confidence
    that the relationship generalizes to the entire population of men over age 17
    in the United States.


    # Parameter Estimates and t-tests


    The final panel in the results provides the estimated intercept and slope of the
    regression line, and the individual t-tests for each. The slope and intercept
    are sometimes called the coefficients of the regression equation, and we treat
    them as the parameters of the linear regression model.


    In Figure 13.7, we find the parameter estimate panel, which contains five columns.
    The first two columns—Term and Estimate—repeat the estimated intercept and slope
    that we saw earlier in the output of the regression line.


    # Figure 13.7 Parameter Estimates


    | Term | Estimate | Std Error | t Ratio | Prob>|t| |

    |---|---|---|---||}{

    | intercept | -5.88872 | 1.346137 | -4.37 | < 0.001* |

    | SLOPE | 0.341001 | 0.013291 | 25.66 | < 0.001* |


    Because we''re using a sample of the full population, our estimates are subject
    to sampling error. The StdError estimates the variance attributable to sampling.
    The t Ratio and Prob>|t| columns show the results of a two-sided test of the null
    hypothesis that a parameter is truly equal to 0.


    Why we test the hypotheses that the intercept and slope equal zero? The reason
    is to relate to the slope and a zero slope represents. If X and Y are genuinely
    independent and unrelated, then changes in the value of X have no influence or
    bearing the values of Y. In other words, the slope of a line of best fit for such
    variables should be zero. For this reason, we may have to look closely at the
    significance test for the slope. Depending on the study and the meaning of the
    data, for the intercept may or not have practical importance.


    In a simple linear regression the ANOVA and t-test for the slope will always lead
    to some conclusion* about the hypothesized independence of the response and factor
    variables. We find here that our estimated slope of 0.341 kg/m² change in BMI
    per 1 cm. increase in waist circumference is very convincingly different from
    0; in fact, it''s more than 25 standard errors away from 0. It''s inconceivable
    that such an observed difference is the coincidental result of random sampling.


    > * will have identical P-values and the F-ratio will be the square of the t ratio.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute
    Inc., Cary, North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
