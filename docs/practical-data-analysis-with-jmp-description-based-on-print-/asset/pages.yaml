  md: 'For a process that is in statistical control, process capability refers to
    the likelihood that the process as designed can actually meet the engineering
    or design criteria. We analyze capability only for numerical measurement data,
    not for attributes. Thus, for example, if our tubing needs the tubing to have
    an average diameter of 4.4 mm with a tolerance of ± 0.1 mm, then the process is
    in control (that is, Phase 2), what they want for the individual observations
    to remain in the range between 4.3 and 4.5 mm.


    In a capability analysis the fundamental question is whether the process is capable
    of delivering tubing that meets the standards. There are several methods for generating
    a capability analysis within JMP, and we''ll illustrate one of them that is an
    extension of the Phased XBar-S control chart that we made earlier. First, we''ll
    hide and exclude the Phase 1 data.


    +   1. We need to return to the data table of tubing diameters: select -> Diameter
    to make this data table active.


    +   2. Select Window -> Data Filter for Diameter. Again, select, show, and include
    rows where Phase equals 1.


    +   3. Select Graph -> Control Chart -> XBar. We want another XBar-S of DIAMETER,
    using a Sample Size of 6 measurements. In the lower right of the dialog box, select
    the Capability option and click OK, which opens the dialog box shown in Figure
    19.12.


    # Figure 19.12 Capability Analysis, Setting Specification Limits ''DIAMETER''


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_368_0.png)


    The results window now contains two charts as before, but they are restricted
    to the Phase 2 data. In addition, we see a distributional analysis of the DIAMETER
    column, including a histogram and normal quantile plot. From this output panel
    (see Figure 19.13)'
