  md: '# Chapter 15: Multiple Regression 265


    Second, a common indicator of collinearity is that the F test has a small P-value
    indicating a significant model, but the P-values for the individual t tests are
    all larger. In this example, the individual tests are all quite significant and
    consistent with the F test.


    A third diagnostic tool is the Leverage Plot which JMP creates for each factor
    variable at the top of the regression results. Figure 15.10 shows the leverage
    plot for the Cement variable. The main purpose of a leverage plot is to visually
    distinguish significant factors from non-significant ones, but these plots can
    also help show whether a variable is collinear with other X variables.


    The horizontal blue line represents the reduced regression model excluding the
    Cement variable. The stopped red line with confidence bands represents the full
    model. Consider a single point in the graph. The vertical distance between the
    point and the fitted line is the residual for that observed value of Y. The vertical
    distance between the point and the horizontal blue line represents the residual
    in a model that excludes Cement from the group of factors. Because the cement
    variable is significant in this regression, the red line (that is, the full model)
    “carries” the points better than the blue line. In other words, the model is better
    when we use cement as a predictor variable.


    # Figure 15.10 a Leverage Plot Showing No Collinearity


    +   - Cement

    - Leverage Plot


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_281_0.png)


    Figure 15.9 typifies the kind of pattern we''re looking for. The red curves exclude
    the blue horizontal line, except for the small region in the center of the graph
    where they overlap. If collinearity were a problem in this regression, we''d note
    that the red dashed curves would largely enclose the blue horizontal line and
    the points would clump near the center of the graph.


    Another useful diagnostic is the Variance Inflation Factor (VIF). When we have
    collinearity among X variables, the least squares technique tends to overestimate
    the standard errors of the estimated regression slopes. JMP computes a VIF for
    each factor in a model to measure how much the standard errors are inflated.


