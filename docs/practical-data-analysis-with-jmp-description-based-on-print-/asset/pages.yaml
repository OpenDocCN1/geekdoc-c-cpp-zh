    # ## Further Inference for Categorical Variables


    This chapter takes us further into inferential analysis of categorical (that is,
    nominal and ordinal) data. Up to now, two chapters have concentrated on categorical
    variables. In Chapter 5 we learned to compute relative frequencies, which we then
    used to illustrate concepts and rules of probability. In Chapter 8 we focused
    on dichotomous categorical variables to learn about confidence intervals and hypothesis
    tests for a single population proportion.'
