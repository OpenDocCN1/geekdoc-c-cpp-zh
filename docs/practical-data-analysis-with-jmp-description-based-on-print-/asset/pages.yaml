    # # Non-Linearity


    What do we do when we find a non-linear pattern? We actually have several options,
    which are discussed in Chapter 16. For the moment, the most important thing to
    recognize that we should not interpret or apply the results of a simple linear
    regression if the residual plot indicates curvature. Without a linear pattern,
    the results will be of limited use and could lead to poor decisions.


    # # Influential Observations


    Another issue related to linearity is that of influential observations. These
    are points that are outliers in either the $X$ or the $Y$ directions. Such points
    tend to bias the estimate of the intercept, slope, or both.


    For example, look back at the scatterplot with the fitted line (Figure 14.3).
    Notice the point farthest to the upper-right corner of the graph. This point represents
    a man whose waist circumference was 158.6 cm, or 62.4 inches and BMI was 49.8
    kg/m², the second highest in the sample—lies very close to the line. The value
    of this high $X$, the OLS method results in a line that might be positioned in
    such a way that it nearly passes through the point.


    As another example, the point that is circled in Figure 14.3. This represents
    a man whose waist is not unusual nor his BMI especially large or small. Yet this
    point is a bivariate outlier that departs from the overall linear pattern of the
    points. His BMI is low considering his waistline.


    With outliers such as we can take one or more of the following steps, even in
    the context of introductory statistics course:


    +   - If possible, verify the accuracy of the data. Are the measurements correct?
    Is there a typographical error or obvious mistake in a respondent''s answer?'
