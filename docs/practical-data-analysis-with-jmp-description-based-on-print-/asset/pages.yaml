    and select **WINTN2YR** as **Weight**.


    All other instructions and interpretations are as described above. Similarly,
    you can use the **Weight** option in the **Fit by X** platform.


    # Equal vs. Unequal Variances


    The t-test procedure we have just performed presumed that the variance in pulse
    rates for women and men are unequal, and estimated the variance and standard deviation
    separately by the two samples. That is a conservative and reasonable thing to
    do.


    If we assume that the populations do not share a common shape (or that the Central
    Limit Theorem applies because both samples are large) but also share a common
    degree of spread, we can combine the data from the two samples to estimate that
    shared variance. With smaller samples there is some gain in efficiency if we can
    combine, or **pool**, the data to estimate the unknown population variances. Later
    in this chapter we''ll see a way to test whether the variances are equal or not.
    At this point, having noted that the samples seem to have similar spread, let''s
    see how the pooled-variance version of this test operates.'
