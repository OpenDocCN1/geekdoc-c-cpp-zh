    # A More Complex Model


    We also note that this model has a modest Rsquare and the points scatter well
    away from the estimated plane. We can improve the model by adding the third predictor
    variable: slag. Slag is another "cementitious" component of concrete mixes that
    serves to bind the mixture.


    +   16. Return to the Fit Model dialog box (still open head behind your results)
    and Add Slag to the list of Model Effects.


    +   17. Change the Emphasis from Minimal Report to Effect Screening: we do this
    to request additional output that helps us decide which factors are influential.


    The first portion of the results is a group of four graphs. Let''s consider the
    graph on the far left, bypassing others until a later section. The first graph
    (Figure 15.6) is essentially a visualization of the goodness of the fit of the
    model. On the horizontal axis, we find the predicted (fitted) values computed
    our model; on the vertical axis, we find the actual values of compressive strength.


    If our model perfectly accounted for all variation in compressive strength, the
    points would lie exactly on a 45-degree line. To the extent that the model is
    imperfect and over- or underestimates compressive strength, the points will scatter
    in the vicinity of the red line. In this graph, we can see that the model performs
    reasonably, with predicted values regularly falling close to the actual observed
    values.


