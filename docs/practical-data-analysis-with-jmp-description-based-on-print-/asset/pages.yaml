    # Row States\n\nOur data table contains 200 cells: two variables with 100 observations\
    \ each,, in two columns and 100 rows. One guiding principle in statistical analysis\
    \ is that we generally want to make use of our data. We don't casually discard\
    \ or omit any portion of the data we've collected (often at substantial effort\
    \ or expense). There are times, however that we might want to focus on a portion\
    \ of the data table or examine the impact of a small number of extraordinary observations.\n\
    \nBy default, when we analyze one or more variables using JMP, every observation\
    \ is included in the results and graphs. You can use row states to confine the\
    \ analysis to particular observations or to highlight observations in graphs.\n\
    \nThere are four basic row states in JMP. They can be one of the following:\n\n\
    +   * **Selected**: selected rows appear bolded or otherwise highlighted in a\
    \ graph.\n * **Excluded**: when you exclude rows, those observations are temporarily\
    \ omitted from calculated statistics such as the mean. The rows remain in the\
    \ data table, but as long as they are excluded they play no role in any computations.\n\
    \ * **Hidden**: when you hide rows, those observations do not appear in graphs,\
    \ but are included in any calculations such as the mean."
