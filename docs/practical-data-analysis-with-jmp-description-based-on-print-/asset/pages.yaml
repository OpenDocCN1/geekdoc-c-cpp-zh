- img_proc: true
  md: 'One of the core ideas in the realm of quality improvement is the distinction
    between common cause variation and special (or assignable) cause variation. Take,
    for example, the case of a company that manufactures plastic tubing for hospitals
    and medical uses. Tubing is made by an extrusion process where liquefied material
    is forced through an opening to form a continuous tube with pre-specified inside
    and outside diameters. By controlling the temperature, composition the rate of
    flow, and the cleanliness of the equipment, the manufacturer can ensure a high
    degree of consistency in the diameters. During the design of the manufacturing
    process, and after months of continuous high-speed operation,


    One of the challenges in managing any process is to distinguish variation that
    indicates a problem and variation that is simply part of the fluctuations of any
    system. We''ll conceive of the routine, chance variation that characterizes an
    imperfect process as being attributable to common causes. Special variation is
    typically attributable to a process that requires attention or a temporary, passing
    event. If special causes are rare and most of the variation is attributable to
    common causes, we say the process is in control. If special variation is unably
    frequent or pronounced, the process is "out of control" and the manager needs
    to intercede and restore the process to its desired state. Sometimes management
    will want to improve a process either by shifting its overall level or by understanding
    and reducing common variance.


    # Control Charts


    A control chart is a time series graph of measurements taken from an on-going
    process. Control charts are visual tools that were created so people on a factory
    floor could make real-time judgments about whether to intervene in a process to
    adjust equipment or otherwise respond to a process that was slipping out of control.
    There are several types of control charts suitable for different data types and
    different analytical goals. In this section, we''ll use a single example to introduce
    several techniques.


    Depending on the product or process being observed, we''ll first distinguish charts
    for measurements and charts for counted events. If we are observing a process
    and measuring a key outcome (for example, the size or weight of a product) we''ll
    be charting continuous data, principally by charting means. On the other hand,
    if we are observing the frequency with which particular attributes occur (for
    example, defects of a certain


    > Control charts are sometimes referred to Shewhart charts after Walter Shewhart,
    an engineer at Bell Laboratories who introduced them in the 1930s.'
