    # Processes and Variation


    We expect to observe variation in the ordinary operation of natural and artificial
    processes. In this chapter we will study several techniques commonly used in manufacturing
    and service operations. Each of these techniques plays a role in efforts to monitor,
    assure, and improve the quality of processes that provide services or manufacture
    goods. You will recognize concepts and approaches that you encounter these techniques,
    which we have seen earlier, but now we will combine them in different ways.'
