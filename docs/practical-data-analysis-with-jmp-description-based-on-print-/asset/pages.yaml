    # # What Are We Assuming?


    This chi-square test has comparatively few assumptions. As with other forms of
    inference, we can generalize to the population if we can assume that the sample
    is representative of the population, and hence we need to believe that the observations
    in the sample are independent of one another. If the sample is randomly selected,
    we can safely assume independence.


