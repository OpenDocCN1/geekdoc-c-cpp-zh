- img_proc: true
  md: '# Practical Data Analysis with JMP


    People gather and analyze data for many different reasons. Engineers test materials
    or new designs to determine their utility or safety. Coaches and owners of professional
    sports teams track their players'' performance in different situations to structure
    rosters and negotiate salary offers. Chemists and medical researchers conduct
    clinical trials to investigate the safety and efficacy of new treatments. Demographers
    describe the characteristics of population and market segments. Investment analysts
    study recent data to tune investment portfolios. All of the individuals who are
    engaged in these activities have consequential, needing for information, and they
    turn to the techniques of statistics to meet their needs.


    There are two basic types of statistical analysis: description and inference.
    We do descriptive analysis in order to summarize an ongoing process or the current
    state of a population—a group of individuals or items that is of interest to us.
    Sometimes we collect data from every individual in a population (every professional
    athlete in a sport, or every firm in which we currently stock), but more often
    we are dealing with a subset of a population—that is with a sample from the population.


    If a company reviews the records of all its clients to summarize last month''s
    sales to all customers, the same company wants to use that information to make
    a forecast of sales for next month, the company needs to engage in inference.
    When we use data to make a conclusion about something we cannot observe, or something
    that hasn''t happened yet, we are drawing an inference. As we''ll come to understand,
    inferential thinking requires risk-taking, and it can be done well or poorly.
    To minimize the risks inherent in inference is a large part of the study of statistics.


    # Types of Data


    The practice of statistical analysis requires data—when we “do” analysis, we''re
    analyzing data. It is important to understand that analysis is just one phase
    in a statistical study.


    Later in this chapter we''ll look at some data collected in 1879 by Albert A.
    Michelson, who was measuring the speed of light. He carefully designed his experiments
    and his instruments, taking repeated measurements to come up with an accurate
    estimate of the speed of light. He did this well; in 1907 he received the Nobel
    Prize in Physics for his work. In the data we''ll analyze, his measurements are
    grouped into a sequence of five “trials,” each consisting of 20 measurements.'
  merge: -1
