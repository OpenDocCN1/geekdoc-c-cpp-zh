  md: '# Chapter 14: Regression Conditions and Estimation 243


    # # Constant Variance


    Look back at Figures 14.3 and 14.4. In an ideal illustration, we would see the
    residuals scattered randomly above and below the horizontal zero line. Figure
    14.3, even though it''s not a perfect illustration, comes closer to the ideal
    than Figure 14.4. In Figure 14.4 not only do the residuals curve, but as the view
    from left to right they increase in variability. On the left side, they are tightly
    packed together, and as we slide to the right, they drift farther and farther
    from the center line. The variability of the residuals is not constant, but variable
    in itself.


    The constant variance assumption goes by a few other names, well, such as homogeneity
    of variance or heteroskedasticity. Valid inference from a regression analysis
    depends quite on this particular assumption. When we have non-constant variance
    (or, as you guessed, *heterogeneity of variance or heteroscedastic*) we should
    refrain from drawing inferences or using the regression model to estimate values
    of Y. Essentially, this is because heteroskedasticity makes the reported errors
    unreliable, which in turn biases the *t* and *F*-factors.


    What to do? Sometimes a variable transformation helps. In other instances, multiple
    regression (Chapter 15) can cancel the variability. In such instances, we turn
    to robust regression techniques that do not use the standard OLS technique. These
    techniques typically go beyond topics in an introductory course.


    # # Independence


    The final condition for OLS is that the random errors are independent of each
    other. As a general rule, this is a common problem with time series data but much
    so with a cross-sectional sample like NHANES. Like the other conditions, we check
    for warning signs of severe non-independence with an inclination to continue the
    analysis unless there are compelling reasons to stop.


    To illustrate this method, we will use both our current example as well as some
    time series data. In both cases, we basically want to graph the residuals in sequence
    of observation, looking for consecutive clusters of positive and negative residuals.
    JMP provides several graphs that can accomplish this; we''ll use the Overlay Plot
    because it enables us to easily connect residuals with lines to clearly visualize
    their sequence.


    +   Select **Graph → Overlay Plot**. As shown in Figure 14.7, select **BXMBMI**
    as **Y**. Clear the **Sort X** option and click **OK**.


    > One option is to click the red triangle at the Top of the Fit Least Squares
    window, and select Row Diagnostics → Plot Residual by Row. This creates a graph
    identical to the default overlay plot. The difference is that we cannot easily
    connect the dots to map out the chronology of residuals.


    Carver, Robert. Practical Data Analysis with JMP®. Copyright © 2010, SAS Institute
    Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/publishing.'
  merge: -1
