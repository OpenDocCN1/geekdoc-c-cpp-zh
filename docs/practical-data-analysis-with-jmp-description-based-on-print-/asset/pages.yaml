- img_proc: true
  md: "236 Practical Data Analysis with JMP\n\nChapter 13. However, if we want to\
    \ draw general conclusions or use an estimated regression equation to estimate,\
    \ predict, or project Y values, it is critical that we decide whether our data\
    \ satisfies the conditions underlying OLS estimation.\n\nRecall that the linear\
    \ regression model is\n\n```\n$Y_i = \\beta_0 + \\beta_i X_i + \\varepsilon_i$\n\
    ```\n\nwhere Y and $X_i$ are the observed values for one case, $\beta_0$ and $\b\
    eta_i$ are the intercept and slope of the underlying relationship, and $\\varepsilon_i$\
    \ is the amount by which an individual response deviates from the line.\n\nOLS\
    \ will generate the equation of a line approximating $\\beta_0 + \\beta_i X$ so\
    \ the first condition is that the relationship between $X$ and Y is linear. Additionally,\
    \ the model treats $\\varepsilon$ as a normal variable whose mean is zero, whose\
    \ variance is all along the line and whose observations are independent of each\
    \ other. Thus, we have four other conditions to verify before using our OLS results.\
    \ Also, the logic of the simple linear model is that $X$ is the only variable\
    \ that accounts for a substantial amount of the observed variation in Y.\n\nIn\
    \ this chapter, we will first learn techniques to evaluate whether the sample\
    \ satisfies the OLS conditions, and then learn to put a regression line to work\
    \ when the conditions permit. We will consider all of the conditions in sequence\
    \ and briefly explain criteria for judging whether they are satisfied in a data\
    \ table, as well as pointing out how to deal with samples that do not satisfy\
    \ the conditions.\n\n# Residual Analysis\n\nSeveral of the conditions cited refer\
    \ directly to the random error term in the model, $\\varepsilon$. Because we cannot\
    \ know the precise location of the theoretical regression line, we cannot know\
    \ the precise values of the $\\varepsilon$s. The random error term values are\
    \ the difference between the observed values of Y and the position of the theoretical\
    \ line. Although we don't know where the theoretical line is, we have a fitted\
    \ line and we'll use the differences between observed Y, and the fitted line to\
    \ approximate $\\varepsilon$ values.\n\nThese are called *residuals*. Again, a\
    \ residual is the difference between an observed value of Y and the fitted value\
    \ of Y corresponding to the observed value of X. Visually, it is the vertical\
    \ distance between an observed point and the fitted line. If the point lies above\
    \ the line, the residual is positive, and if the point lies below the line, the\
    \ residual is negative. By examining the residuals after fitting a line, we can\
    \ judge how well the sample satisfies the conditions. To illustrate the steps\
    \ of a residual analysis, we'll\n\nCarver, Robert. Practical Data Analysis with\
    \ JMP®. Copyright © 2010, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/publishing."
