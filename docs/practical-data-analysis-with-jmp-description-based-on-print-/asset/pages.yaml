- img_proc: true
  md: 'As in the bar charts we studied earlier, there are two dimensions in the graph.
    Here, the horizontal axis displays values of the variable, and the vertical axis
    displays the frequency of each small interval of values. For example, we can see
    that only a few countries have projected life expectations of 40 to 45 years,
    but many have life expect between 70 and 75 years.


    When we look at a histogram, we want to develop the habit of looking for three
    things: the shape, the central tendency, and the spread of the distribution. This
    histogram can often (but not always) clearly represent these three aspects of
    the distribution.


    # 3.7 A Typical Histogram


    ![](img/6f2b98afe2b48aef63a6f5c56ac192ad_66_0.png)


    Shape: refers both the symmetry of the histogram and to the number of peaks in
    the graph. If a graph is symmetric you could find a vertical line in the center
    defining two sides that are mirror images of one another. In Figure 3.7, we see
    an asymmetrical graph. There are few observations in the tails on the left, and
    the bulk of the observations clump on the right side. Conventionally we call this
    a left-skewed (or negatively skewed) distribution.


    Many distributions have one or more peaks—data values that occur more often than
    the other values. Here we have a distinct peak around 70 to 75 years. Some distributions
    have multiple peaks, and some have no distinctive peaks at all.


    In short, we describe the shape of this distribution as "single-peaked and left-skewed.\
    Now, what about center and spread?


    **Center (central tendency):** The issue is here "where the values congregate
    on the number line?" In other words, what types of values does this variable typically
    assume? As you may already know, there are several definitions of center as reflected
    in the mean, median and mode statistics. Visually, we might think of the center
    of a histogram as the half-point of the horizontal axis (the median, which is
    approximately 60–65 in this case), as the highest-frequency region (the mode,
    which is 70–75), perhaps as a kind of balancing point (the mean, which is approximately
    63–70, or in some other way.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Chapter 3: Describing a Single Variable 51


    Any of these interpretations have legitimacy, and all respond to the question
    in slightly

    different way.


    **Spread:** While the concept of spread focuses on the typical, the concept of
    spread focuses

    departures from the typical. The question here is "how much does this vary?"

    and again there are several reasonable ways to respond. We might think in terms
    of the

    lowest and highest observed values (from about 40 to 85), in terms of a vicinity
    of the

    center (for, "life expectancy tends to vary in many countries between between
