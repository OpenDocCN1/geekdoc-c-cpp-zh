  md: '# Chapter 16: Categorical and Non-Linear Regression Models 281


    JMP produces logistic parameter estimates using a maximum likelihood estimation
    (MLE) approach rather than the usual OLS (ordinary least squares method). For
    practical purposes, this has two implications for us. First, rather than relying
    on F or t-tests to evaluate significance, JMP provides Chi-square test results,
    which are more appropriate for MLE methods. Second, the residual analysis that
    we typically perform in a regression analysis is motivated by the assumptions
    of OLS estimation. With MLE, the key assumption is the independence of observations,
    but we no longer look for linearity, normality, or equal variance.


