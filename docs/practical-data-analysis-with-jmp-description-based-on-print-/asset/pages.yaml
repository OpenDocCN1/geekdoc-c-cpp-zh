- img_proc: true
  md: 'Practical Data Analysis with JMP


    In this chapter we will consider two basic issues. First, we''ll learn some ways
    to draw inferences about a categorical variable that can take on more than two
    possible values. Second, we will see how we can use sample data to infer whether
    two categorical variables are independent or somehow related. The thread that
    unifies the discussion in this chapter is another family of continuous density
    functions called chi-square distributions. The tests that we''ll encounter in
    this chapter follow the shape and proportions of a chi-square (²) distribution
    enabling us to calibrate the likelihood of sampling error.


    # Chi-Square Goodness-of-Fit Test


    In Chapter 8 we worked with the Pipeline Safety data table to learn about estimating
    a population proportion. In that chapter, we looked at the IGNITE column—a dichotomous
    variable indicating natural gas ignited in connection with a reported disruption.
    At this point, let''s consider a different variable in the data table that indicates
    the type of disruption. The LRTYPE column shows four different values: LEAK, RUPTURE,
    OTHER, and NIA (not available) corresponding to the reported type of disruption
    in the pipeline incident. Suppose we natively wondered whether all disruption
    types are equally to consider.


    Here''s how we''ll approach the question. First we''ll specify a hypothesis reflecting
    our question and express the hypothesis as a model describing the cases. There
    are four categories, and we''ll be reساوي asserting that all four categories happen
    with probability in the United States. In short, our hypothesis becomes:


    > H₀: Pr/Pr(RUPTURE) = Pr(OTHER) = Pr(NIA) = 0.25


    Next we''ll examine the sample data in comparison to the model. As the usual does
    the heavy work, the underlying logic is simple. For this variable, our sample
    size is n=447. Before we look at the distribution of the observed data, we will
    note that if our null hypothesis is true, then we anticipate observing that approximately
    0.25 x 447 = 111.75 are classified as each of the four types.


    Obviously, we''ve not observed 111.75 instances of any type—that''s not possible.
    If the model is credible, we should discover somewhere in the vicinity of 112
