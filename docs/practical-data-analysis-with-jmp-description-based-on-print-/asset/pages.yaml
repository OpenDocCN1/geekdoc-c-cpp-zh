  md: 'Practical Data Analysis with JMP


    standard tools that we can use to examine how a variable varies, to detect the
    pattern of variation that a variable exhibits, and to look as well for departures
    from the overall pattern. When we speak of a variable''s distribution, we are
    referring to a pattern of values. The distribution describes the different values
    the variable can assume, and how often it assumes each value.


    In our first example, we''ll consider the ways in which life expectancy differs
    around the world. The data we''ll use to come to us from the United Nations, which
    in turn has assembled these figures from most of the countries around the globe.


    # Variable Types and Their Distributions


    Let''s look at this data.


    1. Select File → Open, and select the Life Expectancy data table and click Open.

    Before any analysis, make sure that you can answer these questions:


    +   * What population does this data table represent?

    * Is this data of a sample?

    * What is the source of the data?

    * How many variables are in the table?

    * What data type is each variable?

    * What does each variable represent?

    * How many observations are there?


    Take special note of way this particular data table has been organized. We have
    13 annual observations for each country, and they are "stacked" one upon the other.
    Surprisingly, JMP refers to this arrangement as stacked data.


    In this portion of the chapter, we''ll raise some questions about how life expectancy
    at birth varies in different parts of the world. We''ll want to summarize the
    patterns of variation in this data, and there are far too many observations for
    us to get a general sense of the variation by scanning the table visually. We
    need some sensible ways to find the patterns among the large number of rows. We''ll
    begin our analysis by looking at the nominal variable called Region.


    Statisticians generally distinguish among four types of data:


