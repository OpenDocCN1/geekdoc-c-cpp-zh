  md: '# Populations, Processes, and Samples


    We analyze data because we want to understand about variation within a population—a
    collection of people or objects that we''re interested in. Sometimes we''re more
    interested in the variability of a process—an ongoing natural or artificial activity
    (like the occurrences of earthquakes or fluctuating stocks). We identify one or
    more variables of interest and count or measure them.


    In most cases it is impossible or impractical to gather data from every single
    individual within a population or every instance from an on-going process. Marine
    biologists wanting to know among dolphins cannot possibly measure every living
    dolphin. Manufacturers wanting to know quickly a building material degrades in
    the outdoors cannot destroy all of their products without testing, or they will
    have nothing left to sell. Thanks to databases and powerful software, analysts
    interested in future performance of a particular stock actually analyze every
    single trade for stock, but they cannot analyze trades that have not yet occurred.


    As we begin to learn data analysis, it is important to be clear about the concepts
    of a population and process. In many statistical studies, the situation is as
    follows (this example refers to a population, but the same applies to a process):


    +   - We''re interested in the variation within one or more attributes of a population.

    - We cannot gather data from every single individual within the population.

    - Hence, we choose some individuals from the population and gather data from in
    order to generalize about the entire population.


    We gather and analyze data from the sample of individuals (that''s what we call
    the group of individuals we chose) in placing do so for the population. The particular
    individuals within the sample are not the group we''re ultimately interested in
    knowing about. We want to learn about the variability within the population. Therefore,
    it is important that we choose a sample in a way that it can represent the population
    or process.


    We also want to think about the timeframe for sampling. If we''re interested in
    the current state of a population, we should select a cross-section of individuals
    at one time. On the other hand, if we want to see how a process unfolds over time,
    we should select a time series by sampling the ideal data repeatedly at specific
    intervals.


    Depending on what we want to learn about a process or population, we also concern
    ourselves with the method by which we generate and gather data. Do we want to
    characterize or describe the extent of temperature variation that occurs in a
    particular part of the world? Do we want to understand how patients with a disease
    respond to'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 2: Understanding Data 21


    specific dosage of medication? Or do we want to predict which incentives are most
    likely to induce consumers to buy a particular product?


    The next three sections of this chapter discuss approaches to selecting a sample,
    some important differences between cross-sectional and time series data, and three
    major strategies for data collection.


    # Representativeness and Sampling


    If we plan to draw general conclusions about a population or process from one
    sample, it''s important that we expect the sample to represent the population.
    Whenever we rely on sample information, we run the risk that the sample could
    misrepresent the population (in general, we call this sampling error). Statisticians
    state no method can guarantee that a particular sample accurately represents the
    population, but methods carry smaller risks of sampling error than others. What''s
    more, some methods have predictable risks of a sampling error while others do
    not. We''ll see later in the book, if we can predict the extent of the error,
    then we can minimize from sample; if we cannot, sacrifice our ability to generalize.
    JMP can accommodate different methods of representative sampling, by helping us
    select samples and by taking the sampling method into account when analyzing data.
    At this point, our focus is on understanding different approaches to sampling
    by examining data tables that originated from different designs. We will also
    take a first look using JMP to select representative samples. In Chapters 7 and
    18 we''ll revisit the subject more deeply.


    # Simple Random Sampling


    As you begin your study of statistics, the logical starting point for discussion
    of representative sampling is the concept of a simple random sample (SRS). Imagine
    a population consisting of N elements (for example, a pond with N=1,437 fish),
    which we want to take an SRS of n=20 fish. With a little thought we recognize
    there are many different 20-fish samples we might draw from the pond. If we use
