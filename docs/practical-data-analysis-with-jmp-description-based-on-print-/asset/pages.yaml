    # # Estimation


    Once we confirmed that our sample satisfies the conditions for inference, we can
    use the results in three estimation contexts. This section explains the three
    common ways that regression results can be used and introduces ways to use JMP
    in all three contexts.


    +   * In some studies, the goal is to estimate the magnitude and direction of
    the linear relationship between $X$ and $Y$, or the magnitude of the intercept,
    or both.

    * In some situations, the goal is to estimate the mean value of $Y$ corresponding
    to a particular value of $X$.

    * In some situations, the goal is to estimate an individual value of $Y$ corresponding
    to a particular value of $X$.


    Earlier, we estimated this regression line based on our random sample:


    ```

    BMXMI = -5.88872 + 0.341007 * BMXWAIST

    ```


    If we had a drawn random sample, the estimates of the intercept and slope would
    have been different just because the individuals in the sample would have been
    different. To put it another way, the specific parameter estimates in the equation
    would have been estimated with some degree of sampling error. The sampling error
    cascades through any calculations that we make using the estimated line. For example,
    if we want to estimate BMI for those whose waist are 77 cm (about 30 inches),
    that calculation is necessarily affected by the slope and intercept estimates,
    which in turn depend on the particular sample that we drew.'
  merge: -1
