    \    - An Example Free of Collinearity Problems 264\n    - An Example of Collinearity\
    \ 266\n    - Dealing with Collinearity 268\nEvaluating Alternative Models 269\n\
    Application 271\n\n# The Multiple Regression Model\n\nThe past two chapters have\
    \ introduced most of the major concepts important to the practice of regression\
    \ analysis. At this point we'll extend the discussion to consider situations in\
    \ which a response variable $Y$ has simultaneous linear relationships with more"
  merge: -1
  pgno: 269
- img_proc: true
  md: 'than one independent factor. We have been interpreting RSquare as the fraction
    of the variation in Y accounted for variation in X. We''ve seen examples where
    a single factor accounts for most of the variation in X, but we''ve also seen
    examples where one X accounts for a small portion of Y''s variation. In such cases,
    we might use multiple regression analysis to identify additional factors.


    Multiple regression substantially expands our ability to build models for variation
    in Y, by enabling us to incorporate the separate effects of more than one factor,
    and by enabling us to examine how factors interact with one another. The multiple
    regression accommodates accommodates than one predictive factor:


    ```

    $Y = \beta_0 + \beta_1X_1 + \beta_2X_2 + ... + \beta_kX_k + \epsilon_i$

    ```


    where $Y$ is an observed value of the response variable, each $X_i$ is an observed
    value for a distinct factor, and each of the $\beta_i$ is a parameter of the model.
    As in the simple model, $\epsilon$ is the by which an individual response deviates
    from the model.


    As our first illustration, we will return to a subset of the Concrete data. Recall
    that Prof. Yeh conducted an experiment in the industry (Yeh 1998) that compressive
    strength increases as a batch of concrete cures, or after mixture. To simplify
    our example, we''ll restrict our attention to a sample of concrete batches all
    measured after 28 days.


    Concrete is a mixture of water, aggregates (stones, pebbles, sand), and cementitious
    material. Cementitious materials serve as the binders that hold the mixture together
    as the water evaporates curing and are the key source of compressive strength.
    The most common binder is Portland cement, and manufacturers use various cementitious
    additives to achieve desired properties depending the structural application.


    In our central example, we''ll focus on three ingredients: water, Portland cement,
    and slag—a waste product of iron melting, which is another cementitious material.
    We''ll build a multiple regression model to predict the compressive strength of
    concrete after 28 days. Along the way, we''ll point out similarities and differences
    with simple regression analysis. All of the prior conditions and caveats still
    apply—independent observations, linear relationships, and assumptions about random
    errors. In addition, we''ll add one new concern called collinearity, and we''ll
    use a new JMP analysis platform.'
  merge: -1
  pgno: 270
