    # The Central Limit Theorem


    The symmetric shape of the distribution and the clustering near the population
    is

    actually predictable. The Central Limit Theorem (CLT) applies to the variation
    among

    sample means for continuous variables. The theorem essentially states that regardless
    of the

    hape of the parent population, for large samples the distribution of all

    possible sample means is approximately normal in shape, with a mean value of $\mu$
    (the

    population mean) and a standard deviation of $\sigma/\sqrt{n}$. So as to distinguish
    the standard

    deviation of the sampling distribution from the standard deviation of the population
    in

    is book, we will restrict the term standard deviation to refer to the variation
    among'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Chapter 7: Sampling and Sampling Distributions 135


    individual cases in a sample or population, using the symbols $s$ and $\sigma$
    respectively. In reference to a sampling distribution, we''ll use the term *standard
    error*. In this section, we''re asking about variability of the sample mean, so
    we''ll refer to the *standard error of the mean*, denoted as $\sigma_s$.


    Precisely, the sampling distribution is described by a $t$ distribution. The $t$
    distributions are another family of mound-shaped symmetrical distributions, similar
    in shape to normal curves but with more area in the tails. Unlike the normal distributions,
    there are a large number of $t$ distributions, each uniquely and completely identified
    by one parameter known as *degrees of freedom* (df). For a t distribution, we
    calculate degrees of freedom as $df = n - 1$.


    According the CLT the means of all possible 45-observation random samples from
    this population will follow a $t$ distribution with 44 degrees of freedom. Their
    distribution will have a mean of 149.02 and a standard error of $212.64/\sqrt{45}=31.7$.
    We''ve already seen in the simulation that the mean of more than 20,000 samples
    is close to 149. Now let''s check the standard error.


    29. In the upper-left corner of the simulation window, choose **Shape** to **Investigate**.
    Now look below the histogram of the distribution of sample means. You''ll see
    a small report similar to the one shown in Figure 7.2. Before we calculated the
    standard error of the mean to be 31.7, there is speak of the theoretical distribution
    of all possible means. In the simulation illustrated, the standard deviation of
    the collection of 20,024 simulated means was about 30.6. Although not perfect
    over the span of 20,000 samples, the CLT does an impressive job of informing us
    the ways in which sampling distorts our estimates of the population mean.


    # Figure 7.2 Typical Approximation of the Standard Error


    | Means Summary Table |

    | Std Dev of Sample Means: | 30.582 |

    | No of Sample Means: | 20024 |


    Armed with the CLT and an understanding of $t$ distributions, we can estimate
    how often far we are to be misled by our samples. With a normal model, we could
    confidently say that 95% of all observations lie within almost two standard deviations
    of the mean. Similarly with a normal model we could say that 95% of all possible
    samples have means within about two standard *errors* of the mean.


    JMP has a $t$ distribution function that we can use to calculate the proportion
    of sample means lying more than two standard errors from the mean, assuming a
    sample size of 45.'
