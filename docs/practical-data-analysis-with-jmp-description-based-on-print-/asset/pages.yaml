  md: '# Chapter 12: Analysis of Variance


    Now look at the results, labeled Wilcoxon/Kruskal-Wallis Tests. A first note on
    terminology: strictly speaking, the Wilcoxon test is the nonparametric equivalent
    of the two-sample t-test, while the Kruskal-Wallis test is the equivalent of the
    one-way ANOVA.


    These tests rely chi-squared, rather than the F, distribution to evaluate the
    test statistic. Without laying out the theory of these tests, suffice it to say
    that the null hypothesis of this: the distributions of the groups are centered
    in the same place. A P-value less than 0.05 conventionally means we''ll decide
    to reject the null.


    # Two-Way ANOVA


    Earlier we noted that our model accounted for relatively little of the variation
    in national birth rates, and that other factors might play a role. To investigate
    the importance of a second categorical variable, we can extend our Analysis of
    Variance to include a second factor. The appropriate technique is called two-way
    ANOVA.


    In some countries typically have length maternity leaves from their jobs, while
    in the usual practice is to offer much more brief time off work. Let''s see the
    variation in this respect prevailing national policies as an indication of a country''s
    commitment to the well-being of who give birth. We''ll focus on the factor called
    MattLeave90+, a dichotomous variable indicating whether a country provides 90
    days or more of maternity leave for new mothers.


    +   13. As we use Analyze → Distribution. This time, BirthRate, Provider, and
    MattLeave90+ as the Y, Columns.


    +   14. Click on differ bars in the three graphs, looking for any obvious differences
    in birth rates in countries with different insurance and maternity leave practices.
    Think about what you see in this part of the analysis.


    Before performing the two-way analysis, we need to consider one complication.
    It is possible that the duration of the maternity leave and the provider of benefits
    each have separate and independent associations with birth rate, and it is also
    possible that the impact of one variable is different in the presence or absence
    of the other. In other words, perhaps the duration of the leave is relevant where
    it is privately provided, but not where it''s publicly provided.


    > Different nonparametric procedures take different approaches to the concept
    of a distribution''s "center." None use the mean per se as the One-Way ANOVA does.'
