  md: '# XML IN SCIENTIFIC COMPUTING


    Binary files implementing the xsltproc processor in Windows include executables
    and dynamic link libraries (dll). The following executable files (exe) and dynamic
    link libraries (dll) are necessary for running xsltproc from a command-line window:


    ```

    iconv.dll libxslt.dll libxslt.dll xmlcatalog.exe xsltproc.exe

    iconv.exe libxml2.dll minigzip.exe xmllint.exe zlib1.dll

    ```


    These files should be copied into directories (folders) that are included in the
    path of executables.


    To process an xml file name myxmmldata.xml, subject to an accompanying xsl file
    referenced in the xml file by way of a processing instruction (PI), we issue the
    following statement in a terminal:


    ```

    xsltproc myxmdata.xml -o newxmmldata.xml

    ```


    The output is recorded in a file named newxmmldata.xml. If the optional argument
    is omitted, the output will be shown on the screen. If the xml file contains a
    processing instruction (PI), we type:


    ```

    xsltproc myscode.xml myxmmldata.xml -o newxmmldata.xml

    ```


    Other optional features of xsltproc are available. To obtain further information
    on a unix system, we launch the manual pages by typing:


    ```

    man xsltproc

    ```


    On Windows, we issue the statement xsltproc in a command-line window.


    Other xsl processors


    Other xsl processors associated with advanced programming languages and frameworks
    are available, including saxon, xalan, and xcreces.


    Processing with a web browser


    Xsl processors are embedded in standard web browsers. To process the xml data,
    we simply open the Open Option in the File drop-down menu of a web browser. The
    accompanying xsl file must be declared in the xml document through a processing
    instruction (PI). If the output of the xsl processor is html or other related
    code familiar to the browser, the processed formatted output will be shown in
    the browser window.


    > *http://www.zlatkovic.com/libxmlen.html'
