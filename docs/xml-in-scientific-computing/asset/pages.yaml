    If the argument numstring is omitted, the string content of the current node is
    assumed. For example, number(''-100.3'') returns -100.3, whereas number(''one_hundred'')
    returns NaN (not a number).


    ceiling(number) : Returns the smallest integer that is greater than the number.
    For example, ceiling(1.49) returns 2.


    floor(number) : Returns the largest integer that is not greater than the number.
    For example, ceiling(1.49) returns 1.


    sum(target.node) : Returns the sum of the numerical values of a targeted node.
    A typical usage is:


    ```

    <xsl:value-of select="sum(element/child)"/>

    ```


    count(target.node) : Returns total element count of a targeted node. A typical
    usage is:


    ```

    <xsl:value-of select="count(element/child)"/>

    ```


    true() : Returns the Boolean value true.


    false() : Returns the Boolean value false.


    boolean(argument) : Returns a Boolean value for a number, string, node set, or
    object. True is returned for a non-zero and not-a-number (NaN) number, a non-empty
    node-set, and a string with non-zero length. For example, boolean(1) returns true.


    not(argument) : Returns a Boolean value for a number, string, or node or object.
    The argument is first reduced to a Boolean value by applying the boolean function,
    and then the negation condition is applied.


    round(number) : Rounds a real number specified in the argument to the nearest
    integer. For example, round(1.51) returns 2.


    TABLE D.2 Xpath 1.0 functions of interest in scientific computing to be used with
    xslt 1.0 elements. Note the single quotes inside the parentheses the function
    arguments.'
