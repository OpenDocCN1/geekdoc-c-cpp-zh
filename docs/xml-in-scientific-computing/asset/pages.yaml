    # Character sets


    The unicode is a protocol mapping over one million characters, including letters,
    numbers, and other symbols, to a set of integers ranging from 0 to 1, 114. Two
    mapping methods are available: the unicode transformation format (UTF) and the
    universal character set (UCS).


    The UTF-8 and UTF-16 encodings are commonly employed.* UTF-8 maps characters to
    integers represented by 8 bits (one byte), whereas UTF-16 maps characters to integers
    represented by 16 bits (two bytes). The UTF-8 set is most compatible with the
    legacy American Standard Code for Information Interchange (ascii) mapping listed
    in Appendix A.


    If western European languages are only used, the single byte ISO-8859-xx character
    set can be adopted, where xx is the version number. The ISO-8859-1 set is used
    by default in documents whose media type is text, such as those handled by a web
    server.


    # Character encoding and standalone specification


    A typical xml declaration stating consistency with xml version 1.0 and the use
    of the ISO-8859-1 character set is:


    ```

    <?xml version="1.0" encoding="ISO-8859-1"?>

    ```


    The xml data and possible processing instructions follow this, as discussed later
    in this section. The most general xml declaration has the typical form:


    ```

    <?xml version="1.0" encoding="ISO-8859-1" standalone="yo"?>

    ```


    we yo can be yes or no. The optional standalone attribute is used when an internal
    document type definition (dtd) is employed, as discussed in Section 2.10.


    It is worth emphasizing that the xml declaration becomes relevant only when an
    xml document is supplied for processing to an application. Particular applications
    may demand specific character sets.


