    # The root element of an xml data file is not a main program


    Scientific computer programmers may be tempted to make a correspondence between
    the root element of the xml document containing data, the main program of a fortran
    code, the main function of a C or C++ code. However, this correspondence is false.
    The false similarity is that an xml data file may have one root element, and a
    C or C++ code may have only one main function.


    In the xml/xsl framework discussed in Chapters 3 and 4, the root element of an
    xml document triggers the execution of the xsl code. The notion of data driving
    the execution is foreign to scientific programmers who are used to regarding data
    as optional components of a standalone code.


    # The root element of an xml program file is not a main program


    An xml file may contain code implementing language instructions, as discussed
    in Section 2.12. Even in these cases, the root element is not a main program or
    function, but only serves to introduce and set up the language processor, as discussed
    in Chapters 3 and 4 in the xml/xsl framework.


