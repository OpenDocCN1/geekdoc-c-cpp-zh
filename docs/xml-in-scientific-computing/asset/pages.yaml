    The Xsl processor embedded in the browser recognizes the contents of the elements
    number1 and number2 are numbers, not character strings, performing sensible numerical
    addition instead of string concatenation. If we try to add a number and a character
    string, clearly defining the rules of algebra, we will obtain NaN (Not a Number)
    in the output.


    The xml code contained in the addition.xml file appears similar to a fortran or
    C++ code that it fetches data from the xml file and performs a calculation using
    the xml processor embedded in the web browser as a computational engine.


    # 4.1.1 Using variables


    With reference to our last example, precisely the same output can be obtained
    by assigning each number to be added to a variable, and adding and printing the
    values of the two variables to the following code:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:template match="algebra">

    <html>


    <xsl:variable name="n1">

    <xsl:value-of select="number1"/>

    </xsl:variable>


    <xsl:variable name="n2">

    <xsl:value-of select="number2"/>

    </xsl:variable>


    <xsl:value-of select="$n1"/> + <xsl:value-of select="$n2"/>

    = <xsl:value-of select="$n1 + $n2"/>

    ```'
