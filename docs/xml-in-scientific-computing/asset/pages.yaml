    # Importing xml data


    Writing forroutines that read data from an xml file with an arbitrary tree structure
    can be daunting. Because fortran is meant to be used for numerical computation,
    it is not suitable for character and string manipulation. The opposite for the
    xsl language discussed in Chapters 3 and 4, and for other system programming or
    object-oriented languages, as perl and C++, as discussed later in this chapter.
    Our best option for importing xml data into a fortran code is to employ available
    libraries containing suitable import and export functions. Alternatively, we may
    use fortran for numerical computation and another language for xml data manipulation.'
