  md: 'concat(''item1'', ''item2'', ...) : Concatenates a list of character strings
    into a united string. For example the following statement returns hello:


    ```

    <xsl:value-of select="concat(''hell'',''o'')/>

    ```


    contains(string, substring) : Returns true if the string contains the substring,
    and false otherwise. For example, the following statement returns true:


    ```

    <xsl:value-of select="contains(''hello'',''hell'')/>

    ```


    normalize-space(''string'') : Returns a string after removing extraneous blank
    space(s) prepended or appended to the string. If the argument is omitted, string
    is the name of the current xml context node. For example, the following statement
    returns hello:


    ```

    <xsl:value-of select="normalize-space(''hello'')/>

    ```


    starts-with(''string'', substring'') : Returns true if string starts with substring,
    and false otherwise. For example, the following statement returns true:


    ```

    <xsl:value-of select="starts-with(''hello'',''hell'')/>

    ```


    string(''somestring'') : Returns the string equivalent of somestring which could
    be a number. If the argument is omitted, the string equivalent of the current
    xml context node is returned.


    string-length(''string'') : Returns the number of characters in string. If the
    argument is omitted, the number or characters in the current xml context node
    is returned. For example, the following statement returns 5:


    ```

    <xsl:value-of select="string-length(''hello'')/>

    ```


    substring(''string'', n, m) : Returns a portion of string consisting of m characters
    after the nth character. The argument m is optional. For example, the following
    statement returns genval:


    ```

    <xsl:value-of select="substring(''eigenvalue'',3,6)/>

    ```


    Table D.4 XPath 1.0 functions for string manipulation to be used with xml elements.
    Note the single quotes inside the parentheses holding the arguments.'
