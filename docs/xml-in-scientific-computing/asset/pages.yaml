    the scalar variable *primary_colors[0]*, the second scalar element is the scalar
    variable *primary_colors[1]*, and the third element is the scalar variable *primary_colors[2]*.
    Note that array indices are enclosed by square brackets. The scalar *#primary_colors*
    is the index of the last element of the array.


