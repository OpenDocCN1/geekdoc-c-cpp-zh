    # 5.2 Perl


    The perl programming language was introduced in Section 1.6.4 with special attention
    to perl hashes. A brief outline of the basic language structure can be found in
    Appendix B. Perl employs scalar variables, arrays, and inhomogeneous arrays that
    may contain the same or different data types, including integers, real numbers,
    and character strings.


    A perl hash is an associative array linking keys (variable names) to values (numbers
    or strings). Thus, a perl hash defines and describes data in terms of keys. To
    define or extract the content of a perl hash, we prepend the sign (%) to the hash
    name.


    Perl employs modules (pm) playing the role of language libraries. Xml modules
    are available, to independent developers. For example, a perl module implementing
    an interface to the comprehensive library libxml is available. Libxml is an xml
    parser and toolkit written in C, developed for the gnome project.


    > *http://xml-fortran.sourceforge.net

    †http://nn-online.org/code/xml

    ‡http://fortranwiki.org/fortran/show/FoX\§http://cpan.uwinnipeg.ca/dist/XML-LibXML'
