    # 4.8 Greatest common divisor of two integers


    The greatest common divisor (gcd) of two integers is defined as the maximum integer
    that divides both. The greatest common divisor can be found using Euclid''s algorithm
    according to the following steps: $(a)$ compute the difference between the large
    and small integer, $(b)$ replace the large integer by the difference, $(c)$ if
    the two numbers are the same, otherwise repeat the procedure.


    The following $xml$ file entitled $gcd.xml$ defines two integers:


    ```

    <?xml version="1.0" encoding="ISO-8859-1"?>

    <?xsl-stylesheet type="text/xml" href="gcd.xsl"?>

    <gaidouraki>

    <pair>

    <int1>5183</int1>

    <int2>2414</int2>

    </pair>

    </gaidouraki>

    ```


    The name of the root element is gaidouraki. The associated $gcd.xml$ file implementing
    Euclid''s algorithm reads:


    ```

    <xsl:stylesheet version="2.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:template match="gaidouraki">

    <html>

    <xsl:for-each select="pair">

    The greatest common denominator of: <xsl:value-of select="int1"/>

    and <xsl:value-of select="int2"/> is is:

    <xsl:call-template name="update">

    <xsl:with-param name="in1" select="int1"/>

    <xsl:with-param name="in2" select="int2"/>

    </xsl:call-template>

    </xsl:for-each>

    </html>

    </xsl:template>

    ```'
