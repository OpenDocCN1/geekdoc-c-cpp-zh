  md: '# 2 Xml essential grammar


    In Chapter 1, we explained the motivation behind xml data and statement formatting,
    outlined the basic structure of an xml document, and discussed possible applications.
    In this chapter, we summarize the basic xml grammar and illustrate the implementation
    of a document type definition (dtd) or xml schema definition (xsd) for the purpose
    of document validation. Recall that validation is necessary only when an xml document
    structure is required to conform with agreed conventions.


    We have already emphasized that computer programming experience is not necessary
    for generating and editing an xml document containing data. Consequently, this
    chapter can be read and understood in its entirety by a person who has never written
    a computer code.


    # 2.1 Xml tags


    Xml grammar and syntax are sensible and intuitive. Xml tags are enclosed by pointy
    brackets, called angle brackets,


    < ... >


    where the three dots represent an uninterrupted string of appropriate characters
    defining the tag name, followed by optional attributes, as discussed in Section
    2.2.1. For a document to be well-formed, an opening tag, such as


    ```

    <dian>

    ```


    must be succeeded by a corresponding closing tag indicated by a slash (/)


    ```

    </dianxin>

    ```


    where dianxin is an arbitrary tag name. Words, sentences, numbers, solitary tags,
    or nested tags can be enclosed between an opening tag and its closure. In fact,
    a whole book can be written inside a single tag and its closure.'
