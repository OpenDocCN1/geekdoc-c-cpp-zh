    An xml data file created by a person or automatically by an application (program)
    can be sent to another person or application to be used as input. For example,
    data generated by a spreadsheet can be stored in an xml file under agreed conventions,
    and then imported into another application using different conventions. In fact,
    an xml document can serve as an interface between applications with different
    native formats: pdf may be converted into xml and imported into a spreadsheet,
    and vice versa.


