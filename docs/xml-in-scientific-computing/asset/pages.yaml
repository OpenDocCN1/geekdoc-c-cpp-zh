    # 5.4.2 Using to generate xml output


    Java is an object-oriented compiled programming language similar to C++, with
    a different object model. An attractive feature of java is that it handles memory
    allocation and deallocation efficiently in a way that is transparent to the programmer.
    A thorough understanding of java is not necessary for generating xml output from
    a Matlab code.


    jvm


    When a java code is compiled, a binary object file is produced in bytecode. This
    is not machine language, but rather an intermediate language that must be translated
    into machine language before execution. The translation is done by a program called
    the java virtual machine (jvm).


    # Java methods


    Scientific programmers can identify a java method with a program function or subroutine.
    When the name of a method is encountered in a calling program, the method is executed.
    After the execution of the method has been concluded, data are transferred internally
    and control is passed to the calling program. Java is endowed with a wealth of
    methods arranged in different libraries.


    # Java and xml in Matlab


    A xml library written in java and embedded in Matlab allows us to produce, import,
    and manipulate xml data. To read from a xml document, we convert the xml document
    into a java object and extract its constituents. The use of java is mandated by
    the unavailability of native xml objects in Matlab.'
