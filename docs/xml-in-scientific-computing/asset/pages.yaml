  md: '# 3.2 The main program


    # 3.2.6 File name conventions


    The name of an xsl program file accompanying an xml data file can be arbitrary,
    bearing no relation to the name of the xml data file. However, the name of the
    xsl file must be referenced correctly in the href attribute of the processing
    instruction near the beginning of the xml data file. Similarly, the name of the
    root element of the xml data file must be referenced correctly in the match attribute
    of the root template of the xsl file.


    # 3.2.7 Inverting namespaces


    In the example discussed in this, we have used an explicit xsl namespace and an
    implicit default html namespace. The roles can be reversed by explicitly defining
    the html namespace and introducing an implicit default xsl namespace.


    As an example, we consider the following xml document titled hiya.xml containing
    a self-closing root element polite:


    ```

