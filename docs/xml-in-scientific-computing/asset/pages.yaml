  md: '# 5.2 Perl


    # 5.2.1 XML::Simple


    We discuss an elegant xml module XML::Simple written by Grant McLean.* The current
    version of XML::Simple numbered 2.18 was released in August, 2007.† A simpler
    version of XML::Simple, named XML::Simpler, released in April 2002.‡ In this section,
    we will discuss the original version.


    The functions implemented in XML::Simple allow us to extract data from an xml
    file, placing it into perl data structure. Specifically, XML::Simple parses an
    xml document and maps each element onto an anonymous perl hash accessed by a reference.
    The xml elements may be retrieved using standard perl array manipulations. Conversely,
    XML::Simple allows us to print xml data from native perl data structures consistent
    with an xml tree.


    XML::Simple employs the XML::Parser perl module. Both modules are incorporated
    in most perl distributions. Alternatively, XML::Simple can be downloaded from
    the comprehensive cpan archive network (cpan) using the cpan shell.


    # Installation


    To install XML::Simple in a unix system, we open a terminal (command-line window)
    and issue the command:


    ```

    $ sudo perl -MCPAN -e shell

    ```


    followed by the ENTER keystroke, the dollar sign ($) is a unix shell prompt. After
    entering the administrative password, we enter the cpan environment and issue
    the command:


    ```

    cpan[1]> install XML::Simple

    ```


    when cpan[1]> is a cpan prompt. When the installation finishes, we exit by typing:


    ```

    cpan[2]> quit

    ```


    Dependencies are automatically downloaded.


    In Windows, we open a terminal (command-line window) and issue the command:


    ```

    $ ppm install XML::Simple

    ```


    > *http://www.mclean.net.nz/cpan

    †http://search.cpan.org/grantm/XML-Simple

    ‡http://www.mclean.net.nz/cpan/xmlsimpler/XML-Simpler.html'
