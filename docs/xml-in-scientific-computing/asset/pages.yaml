    # 3.10.3 Matched and named templates


    The general statement of a matched and named template is:


    ```

    <xsl:template match="xml_node_name" name="somename"

    priority="index" mode="modename">

    <xsl:with-param name="somename" select="some_expression"/>

    <xsl:with-param name="lastname" select="last_expression"/>

    </xsl:template>

    ```


    We have seen that all matched templates are executed using the statement:


    ```

    <xsl:apply-templates>

    ```


    and one chosen matched template can be executed using the statement:


    ```

    <xsl:apply-templates select="nodename">

    ```


    A named template is executed using the statement:


    ```

    <xsl:call-template name="templatename">/>

    ```


    A matched and named template can be executed either way.'
