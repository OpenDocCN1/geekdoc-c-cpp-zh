    syntax, as discussed in Chapter 2. In particular, the first statement:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    ```


    defines the root element of the xsl file, regarded as an xml file, and specifies
    the xsl version number as an attribute. A dedicated xsl namespace is defined by
    the attribute xmlns:xsl, and a web address (url) is provided as a uri further
    information can be obtained, as discussed in Section 2.11.


    # Xsl programming elements


    Since xsl file is also an xml document, it must be well-formed. All elements inside
    the root element of the xsl file must follow xml conventions and grammar. The
    grammar of xsl statements in an xml file is similar that of xml elements in an
    xml data file, including the possible presence of element attributes. This similarity
    justifies refring to xsl statements as xsl elements. The terminology can be confusing,
    since a distinction must be made between xml data elements and xsl programming
    elements.


    # 3.2.2 Root template


    When we start processing the greet.xml file, control is passed to the greet.xsl
    code that is a child of the root element of the xml code that launches a root
    template with a match evaluated as the name of the root element of the xml file,
    hello, as specified in the second line of the xsl file under discussion:


    ```

    <xsl:template match="hello">

    ```


    The root template of the xsl code is the root element of the root element of the
    xsl code. The match attribute specifies that the main program will employ data
    residing inside the root element of the xml file. Scientific computing programmers
    should immediately make the correspondence:


    > root template → main program or main function


    For convenience, the root element of the xml data file can be denoted by a slash.
    Thus, the second line in the xsl file can be replaced by the line:


    ```

    <xsl:template match="//">

    ```


    The use of the slash to indicate a root (element or directory) is commonplace
    in unix.


