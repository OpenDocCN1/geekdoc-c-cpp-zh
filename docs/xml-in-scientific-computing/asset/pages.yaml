  md: '# ASCII code


    Ascii is an acronym of the American Standard Code for Information Interchange.
    The ascii code maps 128 characters to an equal number of integers in the range
    0-127 represented by the seven binary digits (bits). Ascii characters include
    letters of the English alphabet, digits, control characters, and other special
    symbols. The following general guidelines apply:


    +   - Control characters for printers and other devices are encoded by the first
    32 integers, 01. Code 32 represents the empty space between words.

    - Codes 22-126 represent printable characters.

    - The capital or upper-case letters of the English alphabet, A-Z, are encoded
    by successive integers in the range 65-90.

    - The lower-case letters of the English alphabet, a-z, are encoded by successive
    integers in the range 97-122.

    - The last code 127 is the Escape character.


    The complete range of ascii characters is listed below:


