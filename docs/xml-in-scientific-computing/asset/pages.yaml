    # DOM and SAX


    Conversely, data encapsulated in an xml file can be imported and transformed into
    objects that can be manipulated or queried using an application written in a scientific
    language of our choice, such as fortran or C++. This methodology is the cornerstone
    of the document object model (DOM) where xml file is mapped directly into a generalized
    object. The methods used to access an object are contained in the application
    programming interface (API).


    The document object model (DOM) is useful for data sets with small or moderate
    size, but inappropriate for data contained in a large database. Direct query of
    the database using, for, the simple API for xml (SAX) incorporating event callbacks
    is preferred in the second case.


    # Heterogeneous arrays and objects


    If the data contained in a conceptual object is homogeneous (of the same data
    type), the object can be accommodated in a matrix (array) in fortran or C, subject
    to agreed conventions regarding the meaning of the columns or rows. Heterogeneous
    arrays are available in perl and other system programming languages. Arrays containing
    mixed data types can be stored as objects inoriented languages, such as C++.


