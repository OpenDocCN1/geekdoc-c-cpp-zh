    # 1.6.5 Computing environments


    We have seen that the information encapsulated in an xml file can be arranged
    into homogeneous or inhomogeneous data structures of advanced programming languages,
    such as perl. Proprietary computing environments, such as Matlab and Mathematica,
    have made pertinent accommodations. For example, a Matlab structure can be defined
    using the statements:


    ```

    student.name = ''Kathryne Marple'';

    student.gpa = ''4.0'';

    ```


    An array of structures can be built into arrays and accessed by indices, as previously
    discussed in this section for perl. The Mathematica environment makes analogous
    accommodations.


    # 1.6.6 Summary


    Three main features of the xml framework are: (a) separation of data from code,
    (b) ability to collect, record, and retrieve data with a generic application in
    mind, and (c) lack of the requirement for computer programming skills. Specific
    data contained in an xml database can be extracted, mined or retrieved, imported,
    and manipulated by a person or program (application) with a particular goal in
    mind.


    The two salient questions posed earlier in this chapter must be addressed: how
    can we get a computer to generate and record xml output in a file? how can xml
    data be read efficiently from a code? An overview of available options will be
    given in this book.


