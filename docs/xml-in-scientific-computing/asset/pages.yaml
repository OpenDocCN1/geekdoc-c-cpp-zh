    # 5.4.3 Importing an xml document as a java object


    We have seen that data can be arranged in an xml tree implemented as a java object.
    Conversely, an existing xml document can be imported into a Matlab session as
    a java object using the xmlread function.


    For example, the eigen.xml document listed in Section 5.4.1 can be imported into
    a Matlab session as a java object arbitrarily named eigen_jo by the statement:


    ```

    eigen_jo = xmlread(''eigen.jo'')

    ```


    When printed on the screen by typing its name, the java object appears cryptically
    as:


    ```

    eigen_jo = [ #document: null ]

    ```


    The word null should not be alarming.


    The xml document can be recreated from the java object using the xmlwrite function
    discussed in Section 5.4.2, by issuing the statement:


    ```

    recreated = xmlwrite(eigen_jo)

    ```


    recreated is an arbitrary name. When printed on the screen, the recreated Matlab
    object appears:


    ```

    <?xml version="1.0" encoding="utf-8"?>

    <?xml-stylesheet type="text/xsl" href="eigenvalues.xsl"?>

    <eigenvalues>

    ```'
