- img_proc: true
  md: 'xii


    To demonstrate the concept of data sharing and reuse, we deliver the same instructions
    to a painter and a sculptor, and ask them to produce corresponding pieces of art.
    The xml encapsulated in these instructions acquire meaning only when the tags
    describing the data are implemented by the artists to produce physical objects.


    # Scientific computing


    In scientific computing, we are accustomed to compiling and running a code (application)
    written in a language of our choice, such as C, C++, fortran, or Matlab®. The
    code utilizes parameters and input data that are either embedded in the program
    (monolithic structure) or read from companion data files (modular structure).
    Emphasis is placed on the code and the output is generated readily by running
    the executable. In most applications, the code is more valuable than the output.
    The opposite is generally true in the xml framework where the data play a prominent
    role and may even serve to launch an application, as in the case of a telephone
    that rings only when it receives data.


    # Xml and scientific computing


    Xml has received a great deal of attention in the web programming and software
    engineering disciplines with reference to data encoding and structure, but far
    less attention in the mainstream computational science and engineering disciplines.
    Two main issues of interest in scientific computing are: (a) producing xml for
    formatted output from code and (b) reading xml input from a data file, converting
    it into its appropriate data structure. It is revealing environments familiar
    to scientists and engineers, such as Matlab®, Mathica®, and Mathematica®, have
    embraced the xml framework and incorporated add-on libraries to facilitate the
    handling of xml input and output.


    # Goals of this book


    Currently available texts and web tutorials on xml data formatting discuss xml
    in the context of computer science with a focus on web and database programming.


    The first goal of this book is to introduce and describe xml to scientists and
    engineers with some typesetting and programming experience.


    The second goal is to introduce the extensible stylesheet language (xsl) with
    applications in xml data processing and numerical computation. Strange though
    it may seem, an xsl code is written according to xml conventions, that xsl is
    an xml implementation.


    The third and perhaps most important goal of this book is to review possible ways
    of saving, importing, and sharing xml data in code written in programming languages
    used most frequently by scientists and engineers. Although references'
