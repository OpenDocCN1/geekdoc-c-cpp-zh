    # 2.6 Language processing instructions


    An instruction implemented in an appropriate language, such as xsl, perl, python,
    java, and others, or application, is called a processing instruction (Pt). To
    include a processing instruction in an xml document, we place it in a container
    opening with the pair < and closing with the mirroring pair ?. A processing instruction
    becomes relevant only at the stage where an xml document is supplied to a processor
    for manipulation, bearing no relevance to the structure of the xml document.


    # Extensible stylesheet (xsl)


    For example, an xml document may contain the following processing instruction
    whose meaning will be discussed in Chapter 3 in the context of the xsl processor:


    ```

    < xml-stylesheet type="text/xsl" href="bilo.xsl" ?>

    ```


    Briefly, this invokes an extensible stylesheet (xsl) residing in a file whose
    name (bilo.xsl) is provided as a hypertext reference (href) attribute.


    # Cascading stylesheet (css)


    Processing instructions are used routinely to link an xml or html document to
    a cascading stylesheet (css) by the typical statement:


    ```

    < xml-stylesheet href="style.css" type="text/css" ?>

    ```


    A cascading stylesheet defines the formatting of typesetting elements in an xml
    or html file. For example, a css may define the default display font, as discussed
    in Section 3.13.


    # Proprietary and other applications


    Processing instructions can be used to convey information to a proprietary application,
    such as a word processor or a spreadsheet. A typical usage is:


    ```

    < mso-applicationid="Excel.Sheet" ?>

    ```


    The name of the application (Excel.Sheet) is provided as a program id (progid)
    attribute.'
