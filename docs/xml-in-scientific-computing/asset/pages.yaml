  md: '# Functions called by xslt elements


    Internal (core) xslt and xpath functions are available for evaluating the attributes
    of xslt programming elements, as discussed in Appendix C. Version 1.0 functions
    are implemented in standard xsl processors and web browsers. Xslt functions are
    shown in Table D.1, xpath functions of interest in numerical computation are shown
    in Table D.2, xpath functions of general interest are shown in Table D.3, and
    xpath functions for string manipulation are shown in Tables D.4 and D.5. Detailed
    explanations on the precise syntax and usage of these functions can be found in
    xslt texts and Internet tutorials.


    # Use of single quotes


    It is important to note that string arguments of functions used to evaluate xslt
    element attributes are enclosed by single quotes (''''), whereas the functions
    themselves are enclosed by double quotes (").


    # Add-on libraries


    Add-xslt function libraries are available. The Xslt standard library (xslsl) contains
    a collection of templates written purely in xslt, including a limited number of
    mathematical templates used in scientific computing. The Xslt library contains
    xslt templates implemented natively in xslt or in javascript.


    # Xslt 2.0 functions


    A broader set of functions is available in version 2.0 of xslt and xpath. Selected
    functions are listed in Table D.6. Unfortunately, not all xslt processors and
    webbrowsers can process these functions. For example, xslt 2.0 libraries must
    be installed as an add-on in the Firefox browser. The lack of extensive libraries
    makes xslt attractive to scientific programmers who are challenged to demonstrate
    that a task can be accomplished with a minimum set of tools. From an educational
    perspective, xslt is an effective platform for teaching and developing programming
    skills.


    > *http://xslt.source.net

    †http://www.xslt.org

    ‡http://www.w3.org/TR/Xslt20'
  merge: -1
