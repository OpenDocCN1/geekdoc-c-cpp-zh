  md: '# Summary of xslt elements


    In this appendix, we summarize available xslt 1.0 programming elements and illustrate
    their application. Elements that are deemed most useful in scientific computing
    are discussed in detail.


    # C.1 Stylesheet declaration, import, and inclusion


    A stylesheet must be declared in the first line of an xslt file. Stylesheet import
    is available for splitting a code into multiple files.


    +   * stylesheets

    Aheet declaration at the beginning of an xslt file serves as a root element, to
    be closed at the end of the file. The general stylesheet declaration is:


    ```

    <xslt:stylesheet version="1.0"

    xmlns:xslt="http://www.w3.org/XSL/Transform"

    id="someid" exclude-result-prefixes="list"

    extension-element-prefixes="list">


    </xslt:stylesheet>

    ```


    where the three dots indicate line of xml code. The optional id identifies the
    stylesheet, the optional exclude-result-prefixes contains a list of namespace
    prefixes that will not be copied to the output, and the optional extension-element-prefixes
    contains a list of namespace prefixes used for extension elements.


    Only the following eight xslt elements can be placed immediately after the stylesheet
    declaration:


    | xslt:template xslt:attribute-set xslt:import xslt:include |

    | xslt:output xslt:param xslt:script xslt:variable |


    Additional stylesheets can be imported from other files using the import and include
    elements.'
  merge: -1
  pgno: 238
- img_proc: true
  md: "# Summary of xslt elements\n\n+   * transform\n\nThe transform declaration\
    \ is synonymous to the stylesheet declaration. The general transform declaration\
    \ is:\n\n```\n<xsl:transform version=\"1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
    \nid=\"smeid\" exclude-result-prefixes=\"list\"\nextension-element-prefixes=\"\
    list\" >\n\n  <xsl:stylesheet>\n```\n\nwhere the three dots indicate lines of\
    \ xml code.\n\n+   * import\n\nThe import element is used to import the contents\
    \ of one stylesheet into another stylesheet according to the syntax:\n\n```\n\
    <xsl:import href=\"othersheet.xsl\"/>\n```\n\nAn imported stylesheet has lower\
    \ precedence over the importing stylesheet.\n\n+   * apply-imports\n\nThe apply-imports\
    \ element is used to apply a template rule from an imported stylesheet according\
    \ to the syntax:\n\n```\n<xsl:apply-imports/>\n```\n\nRules stated in an imported\
    \ stylesheet are overridden by those stated in the importing stylesheet. The apply-imports\
    \ element can be used at any time to enforce an imported stylesheet.\n\n+   *\
    \ include\n\nThe include element is used to incorporate the contents of one stylesheet\
    \ into another stylesheet according to the syntax:\n\n```\n<xsl:included href=\"\
    othersheet.xsl\"/>\n```\n\nAn included stylesheet has the same precedence as the\
    \ including stylesheet.\n\n# C.2 Alternative code\n\nIf an xslt processor does\
    \ not support a particular xslt element, alternative arrangements can be made."
  merge: -1
  pgno: 239
- img_proc: true
  md: "224\n\nXML IN SCIENTIFIC COMPUTING\n\n+   * fallback\n\nThe fallback element\
    \ encloses alternative code to be used if the xslt processor does not support\
    \ an xslt element. A typical usage is:\n\n```\n<xsl:unrecognized.element>\n  <xsl:fallback>\n\
    \  ...\n  </xsl:fallback>\n</xsl:unrecognized_element>\n```\n\nwhere the three\
    \ dots indicate lines of alternative (fallback) code.\n\n# C.3 Output formatting\n\
    \nAn xsl produces output that can be stored in a file or processed and displayed\
    \ in a terminal or window of a web browser.\n\n+   * output\n\nThe output element\
    \ specifies the format of the output document according to the syntax:\n\n```\n\
    <xsl:output\n  method = \"xml|html|text|name\"\n  version = \"...\"\n  encoding\
    \ = \"...\"\n  omit-xml-declaration = \"yes|no\"\n  standalone = \"yes|no\"\n\
    \  doctype = \"...\"\n  doctype-system = \"...\"\n  doctype-section-elements =\
    \ \"yes|no\"\n  indent = \"yes|no\"\n  media-type = \"...\"\n/>\n```\n\nwhere\
    \ the three dots denote a suitable string and a vertical bar denotes a choice.\
    \ For example, unformatted data can be printed by specifying that method=\"text\"\
    . The default choice is method=\"xml\".\n\n+   * decimal-format\n\nThe decimal-format\
    \ element defines characters and symbols to be used when converting numbers into\
    \ strings with the format-number function listed in Table D.1, Appendix D, according\
    \ to the syntax:\n\n```\n<xsl:decimal-format\n  name=\"decimal_format_name\"\n\
    ```"
  merge: -1
  pgno: 240
- img_proc: true
  md: "# C Summary of xslt elements\n\n```\ndecimal-separator=\"character\"\ndigit=\"\
    character\"\ngrouping-separator=\"character\"\ninfinity=\"string\"\nminus-sign=\"\
    character\"\nNaN=\"string\"\npattern-separator=\"character\"\npercent=\"character\"\
    \nper-mille=\"character\"\nzero-digit=\"character\"\n/>\n```\n\nThe decimal-format\
    \ element affects neither the number element, nor the value-element, nor the string\
    \ function.\n\n+   * number\n\nThe number element is used to format a number or\
    \ else determine the integer position of the current xml node in a list of nodes\
    \ according to the syntax:\n\n```\n<xsl:number\n  count=\"pattern\"\n  format={\
    \ string }\"\n  from=\"pattern\"\n  grouping-separator=\" character }\"\n  grouping-size=\"\
    \ number }\"\n  lang=\"languagecode }\"\n  letter-value={ alphabetic|traditional\
    \ }\n  level=\"any|multiple|single\"\n  value=\"expression\"\n/>\n```\n\nSee Also\
    \ Section C.9.\n\n+   * namespace-alias\n\nThe namespace-alias element replaces\
    \ a namespace in the stylesheet with a different namespace in the output according\
    \ to the syntax:\n\n```\n<xsl:namespace-alias stylesheet-prefix=\"unwanted_name\"\
    \n  result-prefix=\"wanted_name\" />\n```\n\n+   * key\n\nThe key element declares\
    \ a named key that can be used in the stylesheet with the key function explained\
    \ in Table D.3, Appendix D."
  merge: -1
  pgno: 241
- img_proc: true
  md: '# C.4 Comments, messages, and text


    Comments can be inserted to explain symbols, insert clarifications, and announce
    important messages during execution.


    +   - comment


    The comment element is used to print a comment in the output enclosed between
    the standard <!-- and --> delimiters according to the syntax:


    ```

    <xsl:comment> this could be a clarification </xsl:comment>

    ```


    +   - message


    The message element is used to print a message and optionally terminate the processing
    of an xml document using a yes or no flag according to the syntax:


    ```

    <xsl:message terminate="yes|no">

    The iterations did not converge.

    </xsl:message>

    ```


    Other xml elements may be included the message element. In practice, the message
    element is used primarily to report errors.


    +   - text


    The text element is used to print text and optionally disable the interpretation
    of special characters such as the greater than (>) character aliased by the &gt;
    string. A typical usage is:


    ```

    <xsl:text disable-output-escaping="yes/no">

    The iterations did not converge.

    </xsl:text>

    ```


    Xsl elements may not be included the text element.


    +   - processing-instruction


    The processing-instruction element adds a processing instruction to the output.
    For example, the lines:


    ```

    <xsl:processing-instruction name="xml-stylesheet"

    type="text/css" href="memo.css"

    </xsl:processing-instruction>

    ```


    produce the processing instruction:


    ```

    <?xml-stylesheet type="text/css" href="memo.css" ?>

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: "# C Summary of xslt elements\n\n# C.5 Xml element manipulation\n\nAn xsl code\
    \ can modify the elements of an xml source document, thereby producing a new xml\
    \ document with new, suppressed, or altered elements.\n\n+   - element\n\nThe\
    \ element programming element generates an xml element node at the output according\
    \ to the syntax:\n\n```\n```\n<xsl:element name=\"somename\"\n  namespace=\"URI\"\
    \ use-attribute-sets=\"somelist\"\n  ....\n</xsl:element>\n```\n```\n\nwhere URI\
    \ stands for a chosen universal resource identifier and the three lines indicate\
    \ additional lines of code. The namespace and use-attribute-sets attributes are\
    \ optional.\n\n+   - attribute\n\nThe attribute element adds an attribute to an\
    \ xml element according to the syntax:\n\n```\n```\n<xsl:attribute name=\"somename\"\
    \ namespace=\"URI\">\n</xsl:attribute>\n```\n```\n\nwhere the three lines indicate\
    \ additional lines of code. The namespace attribute is optional.\n\n+   - attribute-set\n\
    \nThe attribute-set element defines a named set of attributes according to the\
    \ syntax:\n\n```\n```\n<xsl:attribute-set name=\"somename\" use-attribute-sets=\"\
    somelist\"\n</xsl:attribute-set>\n```\n```\n\nwhere the three lines indicate additional\
    \ lines of code. The use-attribute-sets attribute is optional.\n\n+   - copy\n\
    \nThe copy element creates a copy of the current node, omitting children nodes\
    \ and attributes."
  merge: -1
  pgno: 243
- img_proc: true
  md: '228


    XML IN SCIENTIFIC COMPUTING


    +   - copy-of


    The copy-of element creates a copy of an xml node, including child nodes and attributes.


    +   - strip-space


    The strip-space element specifies a list of xml elements containing white (invisible)
    space to be removed from the output according to the syntax:


    ```

    ```xml:strip-space elements="ISBN price" />```

    ```


    In this example, the ISBN number and the price of a book are not provided in the
    corresponding xml elements, and are therefore not included in the output.


    +   - preserve-space


    The preserve-space element reverses the action of the strip-space element according
    to the syntax:


    ```

    ```xml:strip-space elements="ISBN edition" />```

    ```


    # C.6 Logical constructs


    Logical constructs are employed to repeat or selectively take an action, as discussed
    in Chapters 3 and 4.


    +   - if


    A typical usage of the if element is:


    ```

    ```xml:if test="this.is.true or that_is.true"

    ...

    </xml:if>```

    ```


    where the three dots indicate additional lines of code. Logical or and and can
    be employed to combine tested conditions.


    +   - for-each


    The for-each element implements a repetition loop running over instances of a
    targeted xml node. A typical usage is:


    ```

    ```xml:for-each select="xml.target.element"

    ...

    </xml:for-each>```

    ```


    where the three dots indicate additional lines of code.'
  merge: -1
  pgno: 244
- img_proc: true
  md: "# C Summary of xslt elements 229\n\n+   * choose, when, and otherwise\n\nThe\
    \ choose, when, and otherwise elements implement conditional choices triggered\
    \ by the veracity of tested expressions according to the syntax:\n\n```\n<xsl:choose>\n\
    \  <xsl:when test=\"onecondition\">\n    ...\n  </xsl:when>\n  <xsl:otherwise>\n\
    \    ...\n  </xsl:otherwise>\n</xsl:choose>\n```\n\nthe three dots indicate additional\
    \ lines of code.\n\n# C.7 Variables and parameters\n\nLocal or global variables\
    \ and parameters can be defined and evaluated in an xslt code by local assignment\
    \ or by using xml data, discussed in Chapters 3 and 4. Global variables and parameters\
    \ are declared before the root template of an xslt document, whereas local variables\
    \ are declared inside the root template.\n\n+   * variable\n\nThe variable element\
    \ introduces and possibly evaluates a variable. One example is:\n\n```\n<xsl:variable\
    \ name=\"radius\">\n  ...\n</xsl:variable>\n```\n\nwhere the tree dots represent\
    \ statements that evaluate the variable. A variable can be introduced and evaluated\
    \ in a self-closing statement. Examples are:\n\n```\n<xsl:variable name=\"method\"\
    \ select=\"FFT\"/>\n<xsl:variable name=\"spectral_radius\" select=\"1.1\"/>\n\
    ```\n\nFurther examples are discussed in Chapters 3 and 4.\n\n+   * param\n\n\
    The param element introduces and possibly evaluates a parameter. Examples are:\n\
    \n```\n<xsl:param name=\"radius\">\n  ...\n</xsl:param>\n```"
  merge: -1
  pgno: 245
- img_proc: true
  md: "where the tree dots represent statements that evaluate the parameter. Additional\
    \ examples are:\n\n```\n<xsl:param name=\"method\" select=\"GFEM\"/>\n<xsl:param\
    \ name=\"accuracy\" select=\"0.0001\"/>\n```\n\nWe see that a parameter can be\
    \ introduced and evaluated in a self-closing statement.\n\n+   * with-param\n\n\
    The with-param element introduces and possibly evaluates a parameter for use with\
    \ a template according to the syntax:\n\n```\n<xsl:with-param name=\"sename\"\
    \ select=\"some_expression/>\n```\n\nExamples are discussed in Chapters 3 and\
    \ 4.\n\n# C.8 Templates\n\nTemplates are the counterparts of functions and subroutines.\
    \ Matched, named, and matched and named templates are available. The use of templates\
    \ is discussed extensively in Chapters 3 and 4.\n\n+   * template\n\nThe template\
    \ element defines a matched, named, or matched or named template. The declaration\
    \ of a named template is:\n\n```\n<xsl:template match=\"xml_node_name\" priority=\"\
    index\" mode=\"modename\">\n  <xsl:with-param name=\"sename\" select=\"some_expression/>\n\
    \  ...\n  <xsl:with-param name=\"lastname\" select=\"last.expression\"/>\n\n</xsl:template>\n\
    ```\n\nwhere the tree dots indicate additional with-param elements, and the six\
    \ dots indicate additional code. The value of the priority attribute, index, is\
    \ a real number in the range [-9.0.0] with default value 0. The priority and mode\
    \ attributes are optional. The mode attribute allows an xml node to be processed\
    \ more than one. A matched template is called by the apply-templates element.\n\
    \nThe declaration of a named template is:\n\n```\n<xsl:template name=\"template_name\"\
    \ >\n  <xsl:with-param name=\"sename\" select=\"some_expression\"/>\n  ...\n \
    \ <xsl:with-param name=\"lastname\" select=\"last.expression\"/>\n```"
  merge: -1
