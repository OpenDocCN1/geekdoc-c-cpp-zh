  md: '# Computing


    “Modern computational science and engineering address realistic multi-physics
    applications with complex data-driven parametric input. XML in Scientific Computing
    is the first of its kind to discuss the seamless integration of data and code.
    The text is written by one of the most authoritative researchers in computational
    science.”—Professor George M. Karniadakis, Brown University


    While the extensible markup language (XML) has received a great deal of attention
    in web programming and software engineering, for less attention has been paid
    to XML in mainstream computational science and engineering. Correcting this imbalance,
    XML in Scientific Computing introduces XML to scientists and engineers in a way
    that illustrates the similarities and differences with traditional programming
    languages and suggests new ways of saving and sharing the results of scientific
    calculations. The author discusses XML in the context of scientific computing
    (XSL) can be used to perform various calculations, and explains how to create
    and navigate through XML documents using traditional languages such as Fortran,
    C++, and MATLAB®. A suite of computer programs are available on the author''s
    website.


    # About the Author


    C. Pozrikidis is a professor at the University of Massachusetts, Amherst. He is
    well known for his contributions in fluid mechanics and biomechanics, applied
    mathematics, and scientific computing. He has published numerous research papers
    and is the author of eight books and the editor of two contributed volumes.


