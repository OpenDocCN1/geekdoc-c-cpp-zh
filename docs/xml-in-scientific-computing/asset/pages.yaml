    The code implements the decimal-to-binary conversion algorithm discussed earlier
    in this section using the floor function. In the xsl implementation, a user-defined
    template name is reduced recursively with two parameters, x and n. Each time a
    binary digit is found and printed, the binary n is reduced by one unit. The computations
    terminate when n becomes zero.


    Opening the binary.xml file with a web browser produces the display:


    | The binary representation of 0.250 is 0.0100000000 |

    | The binary representation of 0.500 is 0.1000000000 |

    | The binary representation of 0.345 is 0.0101100001 |

    | The binary representation of 0.999 is 0.1111111110 |


    The results in the first two lines confirm that, when a number is multiplied by
    2, the binary point is shifted to the right by one.


    Like C and C++, unlike fortran, the xsl language supports recursive function calling.
    This means that a template can call itself an unspecified number of times to produce
    an intended nested sequence. In fact, recursive function calling is an essential
    feature of xsl. Without it, we would be extremely limited in our ability to implement
    even numerical algorithms.


    # 4.2.3 Binary representation of any number


    We have noted that, each time a number is multiplied by 2, the binary point is
    shifted to the left by one. Conversely, each time a number is multiplied by 1/2
    (divided by 2), the binary point is shifted to the right by one.


    These observations provide us with a practical method of deducing the binary representation
    of an arbitrary number based on the algorithm discussed in Section 4.2.2 for a
    fractional number: (a) a given number is repeatedly divided by 2 until it becomes
    less than 1, (b) the binary representation of the transformed number is found,
    and (c) the binary point is shifted to the right by the number of divisions carried
    out.'
