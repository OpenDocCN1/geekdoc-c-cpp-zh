  md: '# # Producing and importing xml data


    Numbers generated by a scientific code can be recorded in a file according to
    xml conventions and grammar. These xml data may then be imported for processing
    into another code or viewed in a web browser with the aid of an xml stylesheets
    in Chapters 3 and 4. Three main tasks of interest in scientific computing are
    (a) creating xml formatted output from scientific code, (b) reading xml formatted
    input and accommodating it into data structure of a chosen programming language,
    and (c) navigating through an xml document with the objective of retrieving desired
    pieces of information.


    The simplest method of generating xml output in any computer language is by hard-coding
    xml, including tags, attributes, and element content. Although this approach could
    be belittled, scientific programmers are known to favor convenient shortcuts to
    ameliorate the steepness of a learning curve and minimize the net programming
    effort. Hard-coding of xml data is used routinely for sending formatted information
    packets over the Internet.


    Importing data from an xml document into data structures of a chosen computer
    language can be cumbersome, especially when files of large size are involved.
    In one shortcut, xml tags are stripped to produce data columns using a suitable
    string manipulation language, such as perl, set, or awk. The unformatted files
    are used as input, subject to implicit conventions. In a related shortcut, running
    a code, an xml formatted file and another unformatted text file containing the
    same data are produced in the output. The former is used for xml documentation
    and the latter is used as input to the same or another scientific code.


    Language libraries and modules that generate and import xml data are available
    in several scientific languages that support advanced data structures and object-oriented
    programming, such as C++, perl, and java. Only a limited number of such facilities
    are available in procedural languages, such as fortran. Perl is particularly attractive
    due to the availability of associative arrays (hashes) that can be used to define
    and describe in words heterogeneous objects, as discussed in Section 1.6.4 and
    Appendix B. Scientific computing languages'
