  md: '# # Computing with xml/xsl


    In Chapters 1 and 2 we discussed the motivation behind xml formatting and introduced
    the basic xml grammar. In Chapter 3 we explained how an xml document can be processed
    according to a companion xsl program to produce desired output that can be stored
    in a file or displayed in a web browser. In science and engineering applications,
    we are primarily interested in arithmetic data manipulation and in this chapter,
    we discuss numerical computation in the xml/xsl framework.


    The case studies in this chapter will confirm the assertion that, intended to
    be a web programming and data manipulation language, xsl is highly appropriate
    for scientific computation and should be used only for elementary calculations.
    Nevertheless, the lack of numerical facilities in the xsl processor will welcome
    as a challenge for exercising creativity and a motivation for sharpening programming
    skills.


    # ## 4.1 Elementary operations


    Elementary mathematical operations in an xsl code are implemented by the operands:


    ```

    + * div

    ```


    for addition, subtraction, multiplication, and division, respectively.


    It is important to keep in mind that expressions on either side of the subtraction
    operator (-) must be separated by white space. Otherwise, the minus sign will
    be misinterpreted as a dash connecting characters, and an error message will be
    issued by the xsl processor. For example, 4 -5 will return -1, but 4-5 will not
    be recognized as an arithmetic multiplication.


    The modulo (mod) operator returns the numerator of the fractional remainder in
    division. For example, since 13/4 = 3 + 1/4, the operation 13 mod 4 returns 1.


    Relational and logical operands of interest in scientific computing are summarized
    in Table 4.1 in six programming languages, including xsl. The equal'
