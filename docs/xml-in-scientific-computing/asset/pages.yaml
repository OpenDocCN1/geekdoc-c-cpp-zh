  md: '# Text and data formatting 1


    An attractive document contains well structured and sensibly formatted sentences,
    paragraphs, tables, and other elements. To create a document in a computer, we
    type words, characters, punctuation and other symbols in an electronic file, and
    then insert tags implementing formatting. In practice, most documents are created
    using advanced word editing programs (applications). Formatting is typically enforced
    by selecting (highlighting) text with the computer mouse and then clicking on
    embellishing buttons to underline, in bold face, change the font size, or implement
    a wide range of features offered in menus. The application automatically generates
    formatting tags that are implicitly contained in the document but are not displayed
    on the computer screen, unless optionally requested.


    Different applications employ different tagging systems for implementing formatting
    instructions. A tagging system is also known as a markup language. The characterization
    of a tagging system as a language is not entirely appropriate. A computer language
    conveys instructions that implement deliberate procedures, such as algorithms,
    whereas a spoken language conveys content (data) and form (markup). Although unwanted
    are used, markup without data comprises an empty form. Nevertheless, the terminology
    markup language is broadly accepted to indicate a tagging system as standard semantics.


    Reviewing two popular markup languages, latex and html, naturally leads to the
    concept of the extensible markup language (xml), where data are presented and
    described using tags of our choice in a self-contained document. The information
    contained in an xml file can be read by a person or by a computer application
    written in a computer language of choice. The data can be parsed and modified
    in some desirable fashion, or else imported into a computer code for use in professional,
    scientific, and engineering applications. In fact, we will see that xml provides
    us with a framework for implementing computer instructions and formatting programming
    components. The salient features of xml and its relevance in scientific computing
    will be reviewed in this chapter.'
  merge: -1
  pgno: 17
