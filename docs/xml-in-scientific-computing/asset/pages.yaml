    # Xsl constituents


    The xsl processor encapsulates three interacting libraries with complementary
    tasks:


    +   - Xslt (transformations) is a language for transforming an xml document (input)
    into another xml document (output), including an html document or any other text
    (ascii).

    - XPath is a language for navigating inside an xml document by returning references
    to xml element nodes.

    - Xsl-fo is a language for formatting an xml document.


    Xslt allows us to rearrange, suppress, modify, and add to the information contained
    in the xml data file, as discussed in Chapters 3 and 4. Xslt uses xpath to match
    and select coherent data blocks. When a match is found, xslt applies the requested
    transformations. An xsl procedure or function is sometimes delineated as an xslt
    or xpath element or function to accurately describe its implementation.


    Since the internal organization of the xsl processor is of marginal interest in
    scientific computing, we will generally refer to xsl in place of xslt or xpath
    when a distinction is not necessary.


