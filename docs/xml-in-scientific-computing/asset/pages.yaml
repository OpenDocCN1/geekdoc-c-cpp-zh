  md: '# Value of the executable


    In scientific computing, a great deal of effort is expended toward parametric
    generating efficient code compiled into an executable. In parametric investigations,
    the same program is run with different input to generate reliable output that
    can be analyzed by post-processing, visualization, or animation. The central goal
    of the discipline of high-performance scientific computing is to develop efficient
    mathematical, numerical, and memory management algorithms that reduce the demand
    on hardware and central processing unit (CPU) time.


    # Separating program from data


    In scientific computing, we routinely separate the computer program (code) from
    the input data, placing them in different files. The program is written in a main
    file accompanied by function or subroutine files recognized by appropriate suffixes,
    such as .f, .e, .cc, and .sce, for *fortran*, C, C++, and *scilab*. The input
    data reside in other files recognized by standard or arbitrary suffixes, such
    as .dat, .conf, or .inp. The output is printed in data named after the code and
    produced during the execution.


    If we change the input data or parameters inside a code, we must recompile the
    code to generate a new executable. This major inconvenience explains why it is
    highly desirable for the data to be separated from code. In the basic html implementation,
    formatting instructions and data reside in the same file. This monolithic structure
    considerably complicates data extraction, manipulation, reformatting, and portability
    across hardware platforms. One advantage is that only one computer file needs
    to be edited, processed, or communicated.


