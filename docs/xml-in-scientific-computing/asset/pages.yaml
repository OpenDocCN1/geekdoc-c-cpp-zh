  md: '# 3.10 Templates 97


    the inventory root element of the xml file. All templates defined in the xml file
    are then applied to each element inside the root element of the xml file in order
    of appearance, as instructed by the self-closing xml element (declaration):


    ```

    xsl:apply-templates

    ```


    If a template match is found, that is, if the name of the xml node matches the
    value of the match attribute stated in the template, the action specified inside
    the template is taken.


    Scientific programmers will recognize that a matched template is a function or
    subroutine receives input from a specific element of an xml file. However, the
    idea of subjecting data to different templates for the purpose of finding a match
    is novel to scientific programmers who are used to running templates (functions
    or subroutines) with specified data, as opposed to querying data by different
    methods.


    # Absence of templates


    What happens if no templates are implemented in an xsl file? Absent a default
    template, as discussed in the next section, the xsl processor will print the content
    of the parsed elements. In our example, opening the autos.xml file with a web
    browser will produce the display:


    ```

    Ford Chevrolet GM

    ```


    # Default template


    An unimplemented matched template reverts to a default template, if present, whose
    general statement is:


    ```

    <xsl:template match="*">

    ...

    </xsl:template>

    ```


    where the three lines indicate additional lines of code. In computer programming,
    an asterisk (*) is known as a wildcard. As an example, we replace the two templates
    in the autos.xml file with a single default template defined as:


    ```

    <xsl:template match="*">

    Vehicle: <xsl:value of select="."/> <br/>

    </xsl:template>

    ```


    Opening the autos.xml file with a web browser produces the display:


    Vehicle: Ford

    Vehicle: Chevrolet

    Vehicle: GM'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'In practice, a default template is used to avoid repetitive code in cases where
    the same action is taken on multiple elements of an xml document.


    # Priority


    Priority must be assigned when two or a higher number of templates match the same
    xml element according to the following syntax:


    ```

    <xsl:template match="xml_element_name" priority="index">


    </xsl:template>

    ```


    where the three dots indicate additional lines of code, and index is a real number
    in the range [-9.0, 9.0] with default value 0. The priority attribute is optional.


    # Matched templates with parameters


    Matched templates with parameters can be regarded as functions or subroutines
    with arguments that convey information that is complementary to that contained
    in the processed xml file.


    As an example, the xml document titled dimensionless.xml contains the names of
    dimensionless in fluid mechanics and heat transport:


    ```

    ?xml version="1.0" encoding="ISO-8859-1"?>

    <xsl:stylesheet type="text/xsl" href="dimless.xsl"?>

    <dimensionless>


    <fluid.mech>Reynolds</fluid.mech>

    <heat.trans>Peclet</heat.trans>


    </dimensionless>

    ```


    The name of the root element is dimensionless. The companion dimensionless.xml
    file reference in the second line reads:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:template match="dimensionless">

    <html>


    <xsl:apply-templates>

    <xsl:with-param name="before" select="The ''"/>

    <xsl:with-param name="after" select="''" number appears in '' ''"/>

    </xsl:apply-templates>


    </html>

    </xsl:template>

    ```'
