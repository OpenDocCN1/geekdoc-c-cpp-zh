  md: "# 3.10 Templates\n\n# 3.10 Templates\n\nWe have seen that a root template (main\
    \ program) associated with the root element of the xml file is mandatory in an\
    \ xsl file. Other lower-level templates can be defined and executed (applied).\
    \ Templates are similar to functions and subroutines in scientific computer programming,\
    \ in that they receive input and produce output. An important feature of xsl templates\
    \ is that they are granted full implicit access to all data contained in a processed\
    \ xml document. Xsl employs matched templates and named templates to achieve complementary\
    \ and overlapping goals.\n\n# 3.10.1 Matched templates\n\nConsider the data contained\
    \ in the following xml file entitled autos.xml:\n\n```\n<xml version=\"1.0\" encoding=\"\
    ISO-8859-1\"?>\n<xsl-stylesheet type=\"text/xsl\" href=\"autos.xsl\"?>\n<inventory>\n\
    \n<car>Ford</car>\n  <truck>Chevrolet</truck>\n  <car>GM</car>\n\n\n</inventory>\n\
    ```\n\nThe name of the root element is inventory. The accompanying autos.xml file\
    \ referenced in the second line prints cars and trucks:\n\n```\n<xsl:stylesheet\
    \ version=\"1.0\"\n    xmlns=\"http://www.w3.org/1999/XSL/Transform\">\n<xsl:template\
    \ match=\"inventory\">\n<html>\n\n  <xsl:for-each select=\"car\">\n  Auto: <xsl:value-of\
