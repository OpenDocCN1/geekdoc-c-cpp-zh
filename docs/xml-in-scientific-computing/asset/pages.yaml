  md: "# C.9 Sorting and ranking\n\nXsl elements are available for sorting a specified\
    \ list of numbers, characters, or strings in ascending or descending order, and\
    \ for ranking the order of appearance of an element in a list or procedure.\n\n\
    +   - sort\n\nThe sort element sorts a homogeneous list consisting of entries\
    \ with the data type, including integers and character strings, in numerical or\
    \ alphanumeric order according to the syntax:\n\n```\n<xsl:sort\n  select=\"something\"\
    \n  order=\"ascending\" or \"descending\"\n  data-type=\"number\" or \"qname\"\
    \ or \"text\"\n  case-order=\"upper-first\" or \"lower-first\"\n  lang=\"Language-key\"\
    \n/>\n```\n\nAll attributes are optional. The default order is ascending. The\
    \ attribute data-type = \"qname\" is chosen for a user-defined data type.\n\n\
    +   - number\n\nThe number element determines the integer position of the current\
    \ xml node in a list of nodes. Alternatively, the number element is used to format\
    \ a number, as discussed in Section C.3."
  merge: -1
