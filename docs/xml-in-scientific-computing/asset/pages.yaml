    perl hash referenced by the scalar ganske, enclosed by the curly brackets {}.
    The anonymous hash has a single key named izes, which is the name of the root
    element of the xml file. This key represents an anonymous array of anonymous hashes
    enclosed by square brackets {}. The elements of the anonymous array are enclosed
    by square brackets [].


    Scientific computing programmers will interpret the perl structure referenced
    by ganske as a generalized vector whose elements are enclosed by the outer brackets
    {}. The square brackets [] are containers of an anonymous vector. The innermost
    brackets hold additional vectors (associative arrays). Overall, the generated
    perl structure consists of a tree-like cascade of vectors reminiscent of an xml
    tree.


