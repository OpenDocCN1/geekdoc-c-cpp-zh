  md: '# 1.1 Text formatting with latex html


    to typeset the equation

    $$E = \frac{a+b}{c+d} \quad (1.1)$$


    including an equation number, we use the following lines:


    ```

    \begin{equation}

    E = \frac{a+b}{c+d}

    \end{equation}

    ```


    frac stands for fraction and the rest of the tags have obvious meanings. In fact,
    this book was typeset in latex under the ubuntu operating system, and the preceding
    lines were verbatim in the source file.


    Figures and graphics elements, simple tables, colored tables, long tables, floating
    mechanics, and other components can be easily imported or typeset in a latex document.
    A key idea is the concept of a local environment entered by the \begin{...} tag
    and exited by the complementary \end{...} tag, where the three dots represent
    an appropriate keyword. Examples are the figure and figure environments.


    # Human readable code


    An ordinary person can easily extract and understand the information contained
    between a latex markup tag and its closure. This means that latex is human readable
    even when it involves equations and advanced elements, such as tables, schematics,
    and figures. Graduates typically learn the basic rules of latex typesetting in
    a few days based on a handed-down template. Experienced latex users are able to
    edit a latex document while mentally processing and simultaneously interpreting
    the typesetting tags and visualizing the final product in their minds. Computer
    programming experience is not necessary for typesetting a latex document. Typing
    skills and basic deductive ability are all prerequisites.


    # Latex tag processing (interpretation)


    When and how are the latex tags interpreted to produce the final document, such
    as appearing on the pages of this book? Once a latex source file has been composed,
