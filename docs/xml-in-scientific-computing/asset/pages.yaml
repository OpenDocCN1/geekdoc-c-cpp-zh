    We see that a reference (VAR1) to an anonymous hash referenced by gamgee appears.
    The anonymous hash has a single key named roots pointing to an interior anonymous
    hash containing three keys named root, croot, and iroot. Each one of these keys
    points to an anonymous array of scalars or numbers.


    The corresponding data tree is shown in Table 5.2(b). The numbers inside the square
    brackets are indices of arrays, starting at zero, representing a node list.


