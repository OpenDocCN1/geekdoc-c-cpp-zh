    </xsl:template>\n</xsl:stylesheet>\n```\n\nOpening the autos.xml file with a web\
    \ browser produces the expected screen:\n\n```\nAuto: Ford\nAuto: GM\nCamion:\
    \ Chevrolet\n```"
