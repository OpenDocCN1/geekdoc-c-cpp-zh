    # Printing


    The print function allows us to display character strings and numerical values
    on the screen. For example, we may state in a perl code:


    ```

    print "avocado\n";

    ```


    The character represented by the \n pair forces a line break. This statement prints
    the word avocado in a terminal, and moves the cursor to the next line.


    To append the content to a file named myfile.txt, we issue the statement:


    ```

    open(codename, ''>>somefile.txt'');

    print somename "this is an example\n"

    close(codename)

    ```


    Note that the double >> symbol is used. To overwrite existing information in a
    file, we use a single > symbol.


    # Scalar variables


    The value of a scalar alphanumeric variable can be defined or extracted by prepending
    the dollar sign ($) to the variable name. For example, the following statements
    define and evaluate scalar variables:


    ```

    $coefficient = 1.4;

    $shape = "heptagon";

    $somenumber = "345.6";

    ```


    The dollar sign should be read as value of. Perl recognizes that the last variable
    holds a number, even though the numerical characters are enclosed by double quotes
    for character strings. Perl variables are sensitive and cannot begin with numbers.


    The backslash indicates that the dollar sign is a literal (\$) to be treated as
    a character in a string, not as a scalar indicator. Thus, the statement:


    ```

    print "This will cost you \$100.00 \n";

    ```


