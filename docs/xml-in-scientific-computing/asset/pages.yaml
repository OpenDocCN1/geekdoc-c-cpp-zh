    # Xml programming language implementation


    Programming languages that employ xml grammar and syntax are available. An example
    is the extensible stylesheet language (xsl) discussed in Chapters 3 and 4. A comprehensive
    list of other languages is available on the Internet.


    In using an xsl compliant language, two xml files are necessary: an xml data file
    containing input, and an xml program file implementing language instructions.
    Each file has its own root element serving a different purpose. Conversely, an
    arbitrary xml file can contain either data or computer programming instructions.


    # Xsl


    The typical structure of an xsl program file is:


    ```

    <?xml version="1.0"?>

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">


    <!-- -->

    -->

    ```


    where the three dots indicate additional lines of code, as discussed in Chapters
    3 and 4. The first line is an xml declaration. The second line introduces the
    root element named xsl:stylesheet and defines the xsl namespace. Other namespaces
    could be added to this, if necessary. Since xsl statements adhere to xml standards,
    the first line of code is not mandatory.


    > *http://en.wikipedia.org/wiki/List_of_XML_markup_languages'
