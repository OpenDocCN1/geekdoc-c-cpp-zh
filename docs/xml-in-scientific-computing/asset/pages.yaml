    ```


    translate(''string1'', ''string2'', ''string3'') : Returns a string that arises
    by replacing string1 the characters of string2 with corresponding substitute characters
    contained in string3. For example, the following statement returns EigenEnValE:


    ```

    <xsl:value-of select="translate(''eigenvalue'',''ev'',''EV'')/>

