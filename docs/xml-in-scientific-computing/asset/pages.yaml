    # 3.2 The main program


    Consider the following *xml* data file named *greet.xml* containing only three
    lines:


    ```

    <?xml version="1.0" encoding="ISO-8859-1"?>

    <xsl:stylesheet type="text/xml" href="greet.xsl">

    <hello>

    </hello>

    ```


    The first line declares the specific version of *xml* and the character encoding
    type, as discussed in Section 2.4. The second line is a processing instruction
    (P1) declaring the use of an *xsl* stylesheet (program). The name of the file
    where the stylesheet resides, *greet.xsl*, is specified by the hypert reference
    attribute (href). The first two lines are standard in any *xml* document to be
    processed by an *xsl* file.


    In our example, the main body of the *xml* document contains an obligatory root
    element named *hello* that happens to be self-closing. Normally, data and nested
    tags implementing children elements will reside inside the root element, and element
    attributes will be present.


    # 3.2.1 Xsl code


    The accompanying *greet.xsl* file referenced in the processing instruction stated
    in the second line of the *xml* file contains the following:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:template match="hello">

    <html>

    <b>Hello and welcome</b>

    </html>

    </xsl:template>

    </xsl:stylesheet>

    ```


    The first line continues onto the second line. The first and last statements mark
    the beginning and the end of the *xsl* code. These statements are mandatory in
    any *xsl* code.


    Xsl employs xml syntax


    It is remarkable that the *xsl* file is written according to *xml* grammar and'
