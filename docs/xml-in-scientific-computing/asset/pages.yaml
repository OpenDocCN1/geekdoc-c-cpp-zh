    Opening the variables.xml file with a web browser produces the screen display:


    | 13.3 is the same as 13.3 |

    | 15.4 is the same as 15.4 |


    The xsl processor recognizes that the variable holds a numerical value rather
    than a character string. Conversion of a numerical character string into a numerical
    value is possible, as discussed in Section 3.10.


    We can introduce, name, and evaluate by literal a variable by stating,


    ```

    <xsl:variable name="pi" select="3.14159265358"/>

    ```


    The variable may be printed using the statement:


    ```

    <xsl:value-of select="$pi/>

    ```


    Definition and evaluation by literal is useful when a variable is, in fact, a
    constant.


    # Global variables


    A global variable can be defined immediately after the stylesheet declaration
    and before the root template statement in an xsl document. A global variable is
    accessible to all templates (function or subroutines), as discussed in Sections
    3.10 and 3.11.


    # Parameters


    Parameters are variables used by templates representing user-defined functions
    and subroutines. The declaration, usage, and passing of parameters are discussed
    in Sections 3.10 and 3.11.


