  md: 'abs (number) : Returns the absolute value of a number or numerical variable
    supplied in the argument. For example, abs(-4.14) returns 4.14.


    round-half-to-even(number, precision) : Receives a number and optionally a precision,
    and returns the number rounded to the nearest even integer with a specified precision.
    For example,


    +   * round-half-to-even(0.5) returns 0

    * round-half-to-even(1.5) returns 2

    * round-half-to-even(2.5) returns 2

    * round-half-to-even(2.512, 1) returns 2.5

    * round-half-to-even(2.512, 0) returns 2


    avg (sequence) : Returns the average of the argument values. For example, avg((1,2,3))
    returns 2.


    max (sequence) : Returns the argument that is greater than all others in a sequence.
    For example, max((1,2,3)) returns 3 and max(''a'', ''k'')) returns k.


    min (sequence) : Returns the argument that is the lowest than all others in a
    sequence. For example, min((1,2,3)) returns 1 and min(''a'', ''k'')) returns a.


