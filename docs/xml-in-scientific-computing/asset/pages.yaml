    # Arithmetic operations


    The usual arithmetic operations can be performed between scalar variables holding
    numbers. Relational and logical operands for arithmetic operations are listed
    in Table 4.1. As in *fortran*, the power of a number is indicated by a double
    asterisk (**). Thus, the example, the following line may appear in a *perl* script:


    ```

    $power = $base ** exponent;

    ```


    The persistent use of the scalar value of operator ($) is a distinctive feature
    of perl.


    # String operations


    Relational and logical operands for string manipulation are listed in Table 4.1.
    For example, the following code puts a hyphen between two words:


    ```

    $a = "conversion"; $b = "-"; $c = "diffusion";

    $d = $a.$b.$c;

    print "$d";

    ```


    The script produces the output:


