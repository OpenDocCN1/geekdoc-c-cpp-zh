  md: '# C Summary of xslt elements 231


    ......

    <xsl:template>


    A named template is called by the call-template element.


    The declaration of a matched and named template is:


    ```

    <xsl:template match="node" name="somename"

    priority="index" mode="modename">

    <xsl:with-param name="somename" select="some.expression"/>

    ...

    <xsl:with-param name="lastname" select="last.expression"/>

    ...

    n</xsl:template>

    ```


    A matched and named template is either called by the apply-templates element

    or by the call-template element.


    +   - apply-templates


    The apply-templates element applies all matched templates or a specific selected

    matched template according to the syntax: for example:


    ```

    <apply-templates select="xmlnodename" mode="somemode">

    <xsl:with-param name="somename" select="some.text"/>

    ...

    <xsl:with-param name="lastname" select="34.87"/>

    <xsl:sort select="some.element" order="ascending"/>

    ...

    </xsl:apply-templates>

    ```


    The with-param and sort elements inside the apply-templates element are optional.


    +   - call-template


    The call-template element calls for the execution of a named template according

    to the syntax:


    ```

    <xsl:call-template name="somename">

    <xsl:with-param name="gac" select="9.81"/>

    <xsl:with-param name="name" select="gravity"/>

    </xsl:apply-template>

    ```


    The with-param element inside the call-template element is optional.'
