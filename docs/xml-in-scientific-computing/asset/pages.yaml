  md: '# Perl quick reference


    Perl is a powerful interpreted programming language invented by Larry Wall, used
    in a wide variety of applications.* The term *interpreted* conveys that a *perl*
    program, typically called a *perl* script, does not have to be compiled into a
    binary executable. *Perl* is an acronym of the Practical Extraction and Reporting
    Language.


    Locating the interpreter


    The first statement in a *perl* script reveals the directory where the *perl*
    interpreter resides. In a standard *unix* system, this line reads:


    ```

    #!/usr/bin/perl

    ```


    Normally, the number sign (#) indicates a comment. However, the combination (#),
    known as the *shebang*, is special.


    To discover the location of the *perl* interpreter in a *unix* system, we may
    open a terminal (command-line window) and issue the command:


    ```

    which perl

    ```


    followed by the ENTER keystroke. The shell will reply with


    ```

    /usr/bin/perl

    ```


    Execution


    To execute a *perl* script, we open a terminal and type the name of the file hosting
    the script followed by the ENTER keystroke,


    ```

    .perlfile.pl

    ```


    where *perlfile.pl* can be any file name. To ensure that the path of executables
    includes the current directory, we have inserted the dot-slash pair (./) in front
    of the *perl* file name.


    > *http://www.perl.com'
