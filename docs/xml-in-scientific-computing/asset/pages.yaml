    # 2.3 Comments


    Comments are extremely helpful for providing explanations, documentation, and
    ancillary information in a data file or computer code. Comments can be inserted
    anywhere in an xml file according to the following format:


    ```

    <<!-- This was written on February 29, 2012 -->

    ```


    or


    ```

    <<!-- The test of a first-rate intelligence is the ability to hold two opposed
    ideas in the mind at the same time and still retain the ability to function.

    F. Scott Fitzgerald -->

    ```


    Xml parsers are trained to ignore material content between the delimiters <!--
    and --. The xml comment convention is the same as that used in html. Latex accepts
    comments indicated by the percent mark (%) at the beginning of each comment line
    or at any place in partially commenting.


    Two consecutive dashes (--) may not appear inside an xml comment. For example,
    the following comment is not permissible:


    ```

    <<!-- use the Crank--Nicolson method -->

    ```


    Although a comment may contain xml elements, an xml tag may not contain comments.
    Comments can be inserted inside the document type declaration DOYPE block defining
    a document type definition (dtd), as discussed in Section 2.10.


