  md: '# Preface


    Xml stands for extensible markup language. In fact, xml is not a language, but
    a systematic way of encoding and formatting data and statements contained in an
    electronic file according to a chosen tagging system. A tag may represent a general
    entity, a physical, mathematical, or abstract object, an instruction, or a computer
    language construct. The data can describe cars and trucks in a dealer''s lot,
    the chapters of a book, the input or output of a scientific experiment or calculation,
    the eigenvalues of a matrix, and anything else can be described by numbers and
    words.


    Data presentation and description


    In the xml framework, information is described and presented in the same document,
    circumventing the need for legends and explanations. For example, we may order:


    ```

    <breakfast> toast and eggs </breakfast>

    ```


    Data reuse


    Xml data (input) can be read by a person or parsed and processed by a program
    (application) that produces a new set of data (output). Although the input depends
    on the interpretation of the tags formatting the data. The inherent polymorphism
    allows us to materialize the same original data in different ways. For example:


    +   1. An author may write a book inserting formatting tags between words, equations,
    and figures according to xml conventions and grammar. The text (data) file can
    be processed to produce books with different appearances.

    2. A scientist may write a finite-element code that produces output tagged according
    to xml conventions. The elements can be visualized using different graphics programs
    and the data can be sent to any person or program to serve as input.

    3. A conversation can be transcribed using xml grammar and then printed on paper
    or sent to a telephone to be heard by the recipient. It is not necessary to duplicate
    the data.

    4. A computer program could be written according to generic xml conventions. The
    instructions can be interpreted to produce corresponding code in a chosen programming
    language.'
  merge: -1
