  md: '# 5.1 fortran


    First point (1) Last point (2)


    FIGURE 5.1 Discretization of a straight segment into $N$ elements. The length
    of the elements, $s$, increases or decreases geometrically from the first segment
    to the last segment point so that $s_N/s_1$ ratio has a specified value. In the
    illustration shown, ratio < 1.


    that take advantage of *xml* data structures in the spirit of *xsl* are not available
    at the present time.


    In this chapter, possible ways of handling *xml* data in *fortran*, *perl*, C++,
    and *Matlab* are discussed with the objective of illustrating typical procedures.


    # 5.1 Fortran


    **Fortran 77** is a remarkable computer language with a long and distinguished
    history in scientific computing. *Xml* data can be produced by a *fortran* code
    using formatted *print* or *write* statements. The procedure will be illustrated
    in this section by an example.


    # Discretization of a straight segment


    We are interested in dividing a straight segment in the $xy$ plane, beginning
    at one point, $(x_1, y_1)$, and ending at another point, $(x_2, y_2)$, into $N$
    straight elements. The length of the elements should increase or decrease geometrically
    by a constant factor, $\alpha$, as shown in Figure 5.1. This means


    ```

    $s_{m+1} = \alpha s_m = \alpha^2 s_{m-1} = \dots = \alpha^m s_1$

    ```


    for $m = 1, \dots, N-1$, where $s_i$ is the length of the $i$th element. Consequently,


    ```

    $r = \frac{s_N}{s_1} = \alpha^{N-1}$

    ```


    and $r$ is a specified ratio. The total length of the line


    ```

    $\alpha = r^{1/(N-1)}$

    ```


    ```

    $L = s_1 + s_2 + \dots + s_N = s_1 (1 + \alpha + \dots + \alpha^{N-1}) = s_1 \frac{1-\alpha^N}{1-\alpha}$.

    ```'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'Inverting the relation, we obtain the length of the first segment in terms
    of the total length of the line,


    ```

    $s_1 = \frac{1-\alpha}{1-\alpha^N}L. \quad (5.5)$

    ```


    Provisions must be made for the special case $N = 1$ or when $r = 1$ where all
    elements have the same length, $\alpha = 1$ and $s_1 = L/N$.


    # Discretization subroutine


    The discretization is performed by a subroutine contained in the following file
    entitled elm_line1.f where the meaning of the variables employed is described
    in a legend:


    ```

    subroutine elm_line1

    +

    +(N)

    +,ratio

    +,X1,Y1

    +,X2,Y2

    +,sinit

    +,Xe,Ye,se

    +,Qm,Ym,sm

    +)

    ----------------------------------------------------------------------

    c Discretization of a line segment

    c into a graded mesh of N elements

    c

    c X1,Y1:      coordinates of the first point

    c X2,Y2:      coordinates of the last point

    c ratio:      element stretch ratio

    c alpha:      geometric factor ratio

    c sinit:      specified arc length at (X1, Y1)

    c

    c se:         arc length at the element end-nodes

    c sm:         arc length at the element mid-nodes

    c

    c xe,ye:     element end nodes

    c xm,ym:     element mid nodes

    ----------------------------------------------------------------------

    c---

    ```


    ```

