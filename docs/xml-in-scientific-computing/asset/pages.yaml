  md: '# Xml data processing with xsl


    Data contained in an xml document are typically manipulated by a computer program
    (application) written in a suitable computer language. The output is displayed
    on screen, printed on paper, or stored in a file to be recalled at an opportune
    time. Xml data processing and manipulation are best illustrated with reference
    to the extensible stylesheet language (xsl) introduced in Section 1.5.2 and discussed
    in detail in this chapter. Scientific computing programmers should make a correspondence
    between an xsl processor and a computer language interpreter or compiler.


    The basic features of the xsl language will be reviewed in this chapter and available
    procedures for data manipulation will be discussed and demonstrated by example.
    Applications of the xsl programming language in numerical computation will be
    discussed in Chapter 4.


    Readers who are not particularly interested in the xsl programming language may
    skip Chapters 3 and 4 and proceed to Chapter 5 where methods of importing and
    exporting xml data from scientific code are outlined.


    # 3.1 Xsl processors


    To process and parse data contained in an xml file using an xsl processor, we
    write an xsl program file (code) containing instructions concerning data parsing
    and manipulation. Processing several options are available.


    An xml file can be transformed into another xml file according to a specified
    xsl file using the xsltproc application, available in linux distributions and
    other operating systems. In fact, xsltproc is a command-line interface of the
    libxml2 parser and toolkit written by Daniel Veillard.* The application and its
    constituent libraries are written entirely in C. Installation on a unix system
    is straightforward using a software package manager.


    > *http://www.xmlsoft.org'
