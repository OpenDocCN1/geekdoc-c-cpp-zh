    in a way that is unfamiliar to scientific computing programmers. The self-closing
    tag value-of implements an xml element that carries information by way of the
    select attribute. We recall that, in xsl, the dot indicates the content of the
    current xml node. In the unix operating system, dot denotes the current directory,
    and two dots denote the parental directory.'
