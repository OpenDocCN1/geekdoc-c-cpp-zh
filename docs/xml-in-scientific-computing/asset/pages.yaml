  md: '# 3.4 Extracting data with value-of


    Note that, once we find ourselves inside the first for-each loop, we make local
    element name selections. Thus, replacing inside the second for-each loop the line:


    ```

    <xsl:for-each select="thanks">

    ```


    with the revised line:


    ```

    <xsl:for-each select="salutation/thanks">

    ```


    would be wrong. The reason is that the revision implies the presence of an instance
    of salutation inside an instance of salutation (not that this would be wrong).


    Scientific programmers will note the similarity between the for-each nested structure
    and the generic nested structure of a scientific code:


    ```

    for i=1:10

    for j=1:14

    ...

    end

    ```


    where the three dots represent additional lines of code. To underscore the main
    difference, we emphasize again that the range of the repetition index in a for-each
    loop of an xsl code is determined by the content of the processed xml data file
    in an event-driven framework.


