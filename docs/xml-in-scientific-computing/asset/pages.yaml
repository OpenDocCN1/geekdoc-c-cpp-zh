  md: 'substring-after (''string'', ''substring'') : Returns the portion of a specified
    string following a specified substring. For example, the following statement returns
    value:


    ```

    <xsl:value-of select="substring-after(''eigenvalue'',''eigen'')/>

    ```


    substring-before (''string'', ''substring'') : Returns the portion of a specified
    string preceding a specified substring. For example, the following statement returns
    eigen:


    ```

