  md: '# Text formatting with latex and html


    Two important markup languages (tagging systems) are the latex markup language
    used for typesetting documents, and the hypertext markup language (html) used
    for displaying documents in an Internet browser.* Latex was conceived by computer
    science Donald Knith and first released in 1978 with scientific document preparation
    in mind. Html was developed at the dawn of the Internet in the 1980s with electronic
    document communication in mind. In spite of differences in intended usage, the
    two languages share a similar structure and a parallel design. Contemplating the
    similarities and differences between these two languages naturally leads us to
    the concept of xml as a generalized framework.


    # 1.1 Latex


    A latex tag is a keyword preceded by the backslash (\). Square and curly brackets
    following enclose data and parameters. A perfectly valid complete latex entitled
    sample.tex may contain the following lines:


    ```

    \documentclass{lipt, letter]{article}

    \begin{document}

    \text{\it This sentence is set in italic}}

    \end{document}

    ```


    The first line defines the size of the standard font (eleven points) to be used
    in the document, the dimensions of the paper where the text will be printed (letter-sized
    paper), and the type of document to be produced (article). If we were writing
    a book, we would have entered book instead of article in the first line. Document
    classes are available for scientific papers and seminar presentations.


    The beginning of the latex document is declared in the second line of the sample.tex.
    An empty line was inserted for visual clarity after this declaration. To typeset
    a sentence in italic, we enclosed it in brackets {} and appended it to the fourth
    line. If we were to typeset the same sentence in boldface, we would have used
    the \textbf tag. For typewriter face, we would use the \texttt tag. Finally, we
    mark the end of the last line of the latex file.


    # Equations, graphics, and other elements


    A variety of latex tags are available for formatting text and composing tables
    and equations, as explained in books, manuals, and web tutorials. For example,


    > *The capitalization of the Internet indicates the word wide web (web), as opposed
    to an arbitrary network.'
