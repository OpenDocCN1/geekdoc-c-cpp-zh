  md: '# D Functions called by xslt elements


    id(''id1 id2 ..'') : Returns a set of nodes whose ID matches that specified in
    the argument.


    lang (language) : Returns true if the language matches that of the context node,
    and false otherwise. The context node differs from the current node, only when
    it is tested for match.


    last () : Returns the count of the last node in a list processed by the xsl:for-each
    or xsl:apply-templates element; see also the position function.


    local-name (nodename) : Returns the local name of the qualified name consisting
    of an optional prefix accompanied by a colon, and the node name. If the argument
    is omitted, the name of the current xml context node is returned.


    name (nodename) : Returns the name of a node consisting of an optional prefix
    accompanied by a colon, and the node local name. If the argument is omitted, the
    name of the current xml context node is returned.


    namespace-uri (nodename) : Returns the node namespace uri of a node. If the argument
    is omitted, the name of the current xml context node is returned.


    position() : Returns the rank of the current node in a list processed by the xsl:for-each
    or xsl:apply-templates element; see also the last function.


    Table D.3 XPath 1.0 functions of general interest to be used with xslt elements.
    Note the single quotes inside the parentheses holding the function arguments.'
