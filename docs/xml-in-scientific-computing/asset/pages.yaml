    # 1.6 Relevance of xml in scientific computing


    Our main goal in this book is to discuss the relevance of xml in scientific computing,
    which can be contrasted with web and professional applications computing. The
    xml framework is consistent with the standard protocol of scientific computing
    involving input, processing, and output.


    When we write a scientific code in a compiled computer language, such as fortran,
    C, or C++, we follow three basic steps:


    +   1. We write a program containing the language instructions.

    2. We compile the program and link all object files and necessary libraries into
    an executable file, which is a binary file containing machine language instructions.

    3. We run the executable.


    The input data can be contained in the program, entered manually through the input
    devices (keyboard and mouse) during execution, or read from input data files named
    in the program. Interpreted code is handled in similar ways.'
