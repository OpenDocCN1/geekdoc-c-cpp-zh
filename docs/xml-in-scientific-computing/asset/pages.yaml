    representation of a number Section 4.2.3: (a) the given number is repeatedly divided
    by 16 until it becomes less than 1, (b) the hexadecimal representation of the
    transformed number is found, and (c) the hexadecimal point is shifted to the right
    by the number of divisions carried out.


