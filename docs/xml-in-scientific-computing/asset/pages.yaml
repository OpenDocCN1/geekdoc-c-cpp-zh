  md: '# 2.8 Xml root element


    An xml file must contain a root element that encloses data and statements to be
    read by a person or processed by an application. Sometimes the root element is
    called the document.


    The first tag in an xml file following the xml declaration and processing instructions
    defines the root element, and the last tag defines the closure of the root element.
    The typical structure of an xml document is:


    ```

    <<?xml version="1.0" encoding="ISO-08859-1"?>

    <root_element_name>

    ...

    </root_element_name>

    ```


    where root_element.name can be any suitable name, and the three dots indicate
    additional data. The root element can be endowed with attributes. The root element
    of an xhtml document is <html>, and its closure is </html>. All elements inside
    the root element are children or descendants of the root element.


    # Self-closing root element


    Strange though it may appear, a self-closing root element could be meaningful.
    For example, the following xml file may serve a purpose:


    ```

    <xml version="1.0" encoding="ISO-08859-1"?>

    <shutdown what="system" when="now"/>

    ```


    The name of the root element defined in the second line is shutdown. The mere
    presence of the root element is capable of triggering a specific type of action
    when the xml document is parsed to be processed by an application.


    # DOCTYPE declaration


    The name of the root element in an xml document can be stated explicitly in the
    preamble by the statement:


    ```

    <!DOCTYPE root_element_name>

    ```


    More generally, the DOCTYPE declaration defines a data type definition (dtd),
    as discussed in Section 2.10.


    Only one root element may be present in an xml file


    Under no circumstances an xml file may have two root elements. Thus, the following
    structure is not acceptable:'
