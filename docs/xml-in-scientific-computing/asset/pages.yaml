    # Anonymous data\n\nWe wish to reserve space in memory for anticipated data of\
    \ a desired type that are not named, but point to the data instead by a reference\
    \ instead. To achieve this goal, we use anonymous data. Anonymous arrays are enclosed\
    \ by square brackets [] instead of parentheses, and anonymous hashes are enclosed\
    \ by curly brackets {} instead of parentheses. An arrow composed of two ascii\
    \ characters -> is used for dereferencing anonymous data.\n\nAs an example, we\
    \ consider the following script:\n\n```\n@squares = (0, 1, 2, \"four\", \"nine\"\
    ); # named array\n$gondor = @squares;                   # reference to a named\
    \ array\n$squirrel = [0, 1, 2, \"four\", \"nine\"]; # anonymous array\n```\n\n\
    ```\nprint \"$gondor[0] $squirrel->[1] @gondor[2]\\n$squirrel->[3] @gondor[4]\
    \ \\n\";\n```\n\nRunning the script produces the output:\n\n```\n0 1 2 four nine\n\
    ```"
