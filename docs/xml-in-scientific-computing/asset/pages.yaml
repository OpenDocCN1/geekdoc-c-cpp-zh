    # 4.6 Natural logarithm of a number


    The natural logarithm of a given positive number, $x$, can be computed from the
    Taylor series expansion of the logarithmic function about unity being,


    ```

    $$\ln x = t - \frac{1}{2}t^2 + \frac{1}{3}t^3 - \frac{1}{4}t^4 + \dots, \quad
    (4.1)$

    ```


    where $t = x-1$, that $0 < x < 2$ so that $-1 < t < 1$. For values $x \ge 2$,
    the Taylor series does not converge. If only four terms are kept in the Taylor
    series, the sum can be rearranged into a nested product,


    ```

    $$\ln x = t(1 - \frac{1}{2}(t - \frac{1}{3}(t - \frac{1}{4}t))), \quad (4.2)$

    ```


    which suggests computing the recursive sequence


    ```

    $w_1 = 1 - \frac{1}{4}t, \quad w_2 = 1 - \frac{2}{3}tw_1, \quad w_3 = 1 - \frac{1}{2}tw_2,
    \quad \ln x \simeq tw_3. \quad (4.3)$

    ```'
