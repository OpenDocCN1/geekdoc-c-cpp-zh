    </famous_resident>

    </country>

    ```


    Note that the name tag appears with different meanings in this data structure.
    This is perfectly acceptable, for the context in which each name appears is clear.


    # White space


    White space is generated by pressing the space bar, the TAB key, the ENTER or
    RETURN key. Xml parsers are trained to retain white space inside an element, ignore
    white space between elements, and normalize white space by condensing it into
    a single space in attribute evaluations.'
