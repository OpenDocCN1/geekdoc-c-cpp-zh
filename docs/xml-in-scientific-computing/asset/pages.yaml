  md: '# Summary of XML::Simple functions


    To use XML::Simple, we insert the following statement at the beginning of a perl
    code declaring the use of the XML::Simple module:


    ```

    use XML::Simple;

    ```


    XML::Simple allows us to call two main functions for reading and writing xml data.


    The function


    ```

    $somereference = XMLIn("somefile.xml", someoptions);

    ```


    reads an xml file and returns a reference to an anonymous hash. By convention,
    XMLIn reads an xml file called somename.xml, whose name is the same as that of
    the perl file calling the function, somename.pl.


    The function


    ```

    $xmlereference = XMLOut($hashreference, options);

    ```


    converts a hash represented by a reference to an xml document represented by another
    reference.


    # Constructing and evaluating objects


    Alternatively, an XML::Simple object accessible by a reference can be constructed
    by issuing the statement:


    ```

    $somereference = XML::Simple->new(options);

    ```


    or the statement:


    ```

    $somereference = new XML::Simple(options);

    ```


    The object can be subsequently evaluated by issuing the statement:


    ```

    $otherreference = $somereference->XMLIn("somefile.xml", options);

    ```


    where otherreference is a reference to the evaluated object.


    To convert a hash reference into an xml document represented by another reference,
    we use the line:


    ```

    $xmlereference = $somereference->XMLOut($hashreference, options);

    ```'
