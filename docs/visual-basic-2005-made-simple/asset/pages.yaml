- img_proc: true
  md: 'Each event results in some action taken by Windows itself. For instance, clicking
    on a button causes it to change its appearance while the mouse button is held
    down; clicking on a window’s Minimise button reduces the window to an icon. These
    actions are encapsulated in the objects’ definitions; they are part of the code
    that you get when you choose those objects.


    In these cases, you cannot alter the object''s behaviour but you can add to it;
    for example, you may activate a new form when the command button is clicked or
    display a message when form is minimised.


    Therefore, the next task, after creating the user interface, is to decide the
    events that are to be handled and create the appropriate procedures.


    > Tip

    Don''t try to create procedures for every possible event. For each object, look
    through the list of events and choose the ones that are essential. You can always
    add new procedures later.


    > Take note

    The button has a Click event; however, the user cannot double-click a button.


    # Common events


    A number of events are common to most of the standard Visual Basic controls. (This
    is because of the way objects are related, allowing behaviour in one class to
    be inherited by those classes that are derived from it.)


    A brief description is given here but for a full list of events view the relevant
    topic in the MSD library. This contains a help page listing all object’s members:
    the properties, events and methods (described on page 95). The first item in the
    list is the Constructor, a special method that is used to create an instance of
    the object. Next come all the object’s properties, followed by the methods and
    then the events.


    For a full description of any event, click on the event name.'
