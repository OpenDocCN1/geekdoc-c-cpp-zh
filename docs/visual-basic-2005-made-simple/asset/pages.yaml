  md: 'SelectionMode allows you to select more than one item in the list. The property
    can take the following settings:


    +   - **None**: No items can be selected.


    +   - **One**: Only a single item can be selected (the default setting).


    +   - **MultiSimple**: Several items can be selected. Clicking on an item selects
    or deselects it.


    +   - **MultiExtended**: A series of items can be selected by clicking on the
    first item, holding down [Shift] and clicking on the last item. Individual items
    can be selected by holding down [Ctrl] while clicking.


    The **MultiColumn** property determines whether the list appears in a single column
    with a vertical scroll bar (False) or is divided into many columns as are necessary
    to fit all the entries into the height available (True). For multi-column lists,
    you may need to set the **HorizontalScrollbar** property to True. The width of
    each column is determined by the **ColumnWidth** property; leave this as 0 if
    you want the columns to be given the default width.


    If you want the list to display only whole items, set **IntegralHeight** to True;
    the box will be resized vertically so that it fits an exact number of items.


