  md: 'The Height and Width properties give the total dimensions of the form, including
    the title bar and borders; when setting the height of a control you should always
    allow for the depth of the title bar. (In the example above, 24 pixels have been
    allowed for the title bar and 8 pixels for the vertical borders of the window.)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_99_0.png)


    The word ''Me'' is a shorthand way of referring to the current form. Although
    you could specify the variable that holds the form (e.g. frmvCompanyDescription)
    it is quicker to use just ''Me''. This also has a number of other advantages:


    +   - The code is easier to read.

    - If you change the form name, the code will still be. right.

    - You can copy a set of instructions from one form to another without revising
    the form name in each instruction.


    If the statements above are included in the frmCompanyDescription_Resize procedure,
    the text box will always fill the full width of the window, leaving an area at
    the bottom for the two buttons.'
