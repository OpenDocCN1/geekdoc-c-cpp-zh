  md: '# # Leaving Visual Basic


    You can get out of Visual Studio at any time, either temporarily (while you are
    on some other application) or permanently.


    # ## Suspending Visual Studio


    To suspend Visual Studio temporarily, click on the Minimise button on the main
    window and then start another application.


    To get back into Visual Studio, use one of these methods:


    +   - If Visual Studio was minimised, click on the project''s taskbar button.

    - If any part of the Visual Studio window is visible, click on it.

    - Press [Alt-Esc] or [Alt-Tab] repeatedly to cycle through the open applications
    until Visual Studio is active.


    The program will be exactly as you left it.


    # ## Exiting Visual Studio


    To close down Visual Studio altogether, select FileExit. Alternatively, click
    on the Close button on the main window. If you have made changes to the project
    you are asked if you want to save them:


    +   - Click on Save (or press [Enter]) to save the changes.

    - Click on Discard to abandon the changes - no further confirmation is requested.

    - Click on Cancel (or press [Esc]) to continue working in Visual Studio.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_29_0.png)


    If you attempt to close down the computer without ending Visual Studio, Windows
    will close Visual Studio for you and the same options will be given for any unsaved
    projects.


    21'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Restarting Visual Studio


    You can add Visual Basic to the Start menu by right-clicking on the entry in the
    All Programs list and selecting ‘Pin to Start menu’. You can then re-run Visual
    Basic by simply clicking on the Start button and then on the Visual Basic icon.


    Click to restart


    ![](img/dd2d93f16b3cb78149c4221e4752898b_30_0.png)


    # Take note


    You can run Visual Studio and open an existing project in a single action by locating
    the VBPROJ file using Windows Explorer and double-clicking on it. In this case,
    the Start Tab will not be opened.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_30_1.png)


    The projects you have worked on recently are listed in the Visual Start Page.
    Click on a project name to open it.


    Click to open


    To open a project that is not included in the Start page:


    +   1. On the Start Page, click on the Open button.

    2. Locate the project directory.

    3. Click on the file with an SLN extension and then on Open.


    22'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Upgrading old projects


    There are big differences in the format of application files between previous
    versions of Visual Basic (e.g. VB 6.0) and Visual Basic .NET. There are also differences
    between VB .NET and VB 2005. However, Visual Basic lets you upgrade an application
    without too much difficulty:


    +   1 Create the directory where you want to store the upgraded project. (The
    upgrade process does not this automatically for you.)


    +   2 On the Visual Studio Start Page, click on the Open File button and select
    the project to be upgraded.


    +   3 The Visual Studio Conversion wizard starts. Click on Next to start the wizard.


    +   4 Decide whether or to create a backup of the existing project. Click on Next
    to continue.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_31_0.png)


    +   5 A summary is displayed. Click on Finish to start the conversion process.
    The upgrade may take quite a while for large projects.


    +   6 On completion, the new version of the project is displayed in the Solution
    Explorer window and the application can be edited as required. Included in the
    Solution Explorer is a file called _UpgradeReport.htm, which gives details of
    the upgrade process and any errors that were encountered.


    +   7 Click on the Save All button to save the upgraded application, accepting
    the default name suggested for the solution filename.'
  merge: -1
