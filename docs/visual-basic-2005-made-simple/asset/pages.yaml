  pgno: 267
- img_proc: true
  md: '# Creating sequential files


    There are three stages in creating a sequential file: opening the file, writing
    the data

    and closing the file.


    The file is **opened** with a statement in the form:


    ```

    FileOpen(number, filename, OpenMode.mode)

    ```


    If the mode is ''Output'', a new file is created and any existing file with the
    same

    data is deleted. If the mode is ''Append'', the new data is added to the end of
    the existing

    existing file (or a new file is created, if one does not exist).


    The number identifies the file in the rest of the program and must be in the range

    1 255. The number is linked to the file only as long as the file is open. When
    the

    file is closed, the number can be re-used for another file; if a file is re-opened
    it does

    not have to be assigned the same number as before.


    Data is written to a sequential file with the **Print, PrintLine, Write** or **WriteLine**

    statements. Each statement writes one line of data to the file. The format of
    these

    statements is as follows:


    ```

    Print(number, value1, value2, ...)

    PrintLine(number, value1, value2, ...)

    Write(number, value1, value2, ...)

    WriteLine(number, value1, value2, ...)

    ```


    The Print statement writes data with tabs between separate items; this statement
    is

    useful for writing text files (with just one item per line). The Write statement
    stores

    data in comma-delimited format.


    By default, the Print and PrintLine functions write data with a tab between the

    separate items. The only difference between them is that PrintLine also writes
    a

    criage return sequence to the file; therefore PrintLine is suitable for writing
    a

    single line of text to an ASCII file.


    You can also include Tab() and Spc() functions in the list of items to output.
    Tab()

    prints the next item at the specified column number, while Spc() prints the

    number of spaces.


    The Write and WriteLine functions store data in comma-delimited format, the only

    diffence being that WriteLine adds a carriage return.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Comma-delimited file


    ![](img/dd2d93f16b3cb78149c4221e4752898b_269_0.png)


    The file is **closed** with a statement in the form:


    ```

    FileClose(number)

    ```


    The FileClose statement is essential, as it stores away unwritten data held in
    memory.


    # Reading sequential files


    Corresponding to the creation of a sequential file, there are three stages for
    reading a file like: opening the file, reading the data and closing the file.


    The file is **opened** with the following statement:


    ```

    FileOpen(number, filename, OpenMode.Input)

    ```


    Data is read from the file with one of these statements:


    ```

    variable = LineInput(number)

    ```


    ```

    Input(number, variable1)

    ```


    The **Input** statement reads an entire line into a *string variable* and is suitable
    for text files. Each call to the LineInput function reads the next complete line
    of the file.


    The **Input** function should be used where files have been written with the Write
    or WriteLine functions. Each call to the Input function reads the next item from
    the file. The function can only read one item at a time, so a series of calls
    are needed for each line in a comma-delimited file.


    The **FileClose** statement is the same as before.


    261'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'Sequential files are always read from the beginning of the file. You can use
    the EOF function to detect the end of the file. (The function returns a True value
    when the end-of-file marker has been reached.) The LOF function gives you the
    length of the file (in bytes) and LOC returns the current location (in terms)
    of the number of characters so far. All three functions take the file number as
    their argument.


    The FileLen function gives you the length of any file. The function takes the
    length of the file. If the file is open, the function returns the length of the
    file when it was opened.


    The following procedures demonstrate how FileOpen and FileSave commands can be
    used to read and write data entered in the Calendar program from the Chapter 8
    Exercises. The FileSave procedure stores the contents of the calendar boxes in
    a sequential file, with one line for each box. The filename is based on the year
    and month of the calendar. The FileOpen procedure reads the text back into the
    boxes.




    Take note

    You can also create binary files, where data is written and read a character at
    a time. This gives you complete control over the file, without having to worry
    about the structure imposed by comma-delimited files or record-based files. However,
    your program must keep precise track of the position and size of data in the file.


    262'
