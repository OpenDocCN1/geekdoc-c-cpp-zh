  md: "# Folder operations\n\nThe System.IO.Directory class has a range of methods\
    \ for manipulating folders:\n\n+   * The Delete method deletes the specified directory,\
    \ including any subdirectories and files it contains.\n* The CreateDirectory method\
    \ creates the specified directory. If necessary, it will create all folders in\
    \ the path.\n* The Move method moves a directory to a new location, renaming the\
    \ directory if required. You can also use this method to rename a directory without\
    \ moving it.\n* The Exists method returns True if a specified directory exists,\
    \ otherwise False.\n\n# File properties\n\nThe System.IO.File class has a number\
    \ of methods that allow you to retrieve the file's attributes and other properties.\
    \ The attributes (archive, hidden, system etc.) are packed into a long integer\
    \ as a set of True/False flags. The value contains the following attributes:\n\
    \n| Archive | Directory | Hidden | Normal |\n| ReadOnly | System | Temporary |\n\
    \nThe attributes are retrieved with the GetAttributes method. You can then use\
    \ the And operator to determine whether or not a particular attribute is set.\
    \ For example:\n\n```\nDim FileAtts As Long\nDim booReadOnly As Boolean\n\nFileAtts\
    \ = System.IO.File.GetAttributes(strSelectedFile)\nbooReadOnly = Bool(FileAtts\
    \ And \nnSystem.IO.FileAttributes.ReadOnly)\n\nIf booReadOnly = True Then\n\t\
    MessageBox.Show(\"Read only file\")\nElse\n\tMessageBox.Show(\"File is not read\
    \ only\")\nEnd If\n```"
