    # Numeric properties


    Most properties have numeric values; for instance, Height, Width, Left, Right,
    MaxLength and SmallChange are all numeric properties. These must be assigned numeric
    expressions, consisting of numbers and other numeric properties.


    For example, the following statement changes the size of a command button:


    ```

    btnOK.Height = 40

    btnOK.Width = 100

    ```


    (Sizes are in pixels - see page 31.)


    A text box can be expanded or contracted to fit the inside of a resizable form
    as follows:


    ```

    txtCoDesc.Top = 0

    txtCoDesc.Left = 0

    txtCoDesc.Height = Me.Height - 64

    txtCoDesc.Width = MeWidth - 8

    ```'
