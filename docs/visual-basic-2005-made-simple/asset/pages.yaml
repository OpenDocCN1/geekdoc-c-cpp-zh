- img_proc: true
  md: '# Size and Location


    The size and position of a control are determined by the same set of four properties
    as a form: Width and Height for the size, Left and Top for position. As for forms,
    you can enter these properties individually or use the combined properties, Size
    and Location. Left and Top give the position of the top-left corner of the control
    relative to the top-left corner of the inside of the form.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_66_0.png)


    These properties can be changed either by dragging the sizing handles on the corners
    and sides of the control or by entering new settings directly. Usually, dragging
    the sizing handles is satisfactory, as it enables you to set the size and position
    by eye. For precise settings, however, the values can be adjusted in the Properties
    window.


    The size and location of controls are measured in pixels, as for forms.


    When developing a form there is a background grid of points for aligning controls.
    If you change the control size or position by dragging, the control corners ''snap''
    to the nearest grid points. The grid can be changed (or switched off) by choosing
    Tools|Options and clicking on the Windows Form Designer folder on the left; the
    Width and Height of the grid square can be changed and the grid snap can be turned
    off.


    58'
  merge: -1
