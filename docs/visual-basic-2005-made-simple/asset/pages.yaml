  md: "# Conditional statements\n\nSo far, the statements in a procedure have followed\
    \ a linear, unbroken path; the program starts at the first line and works down\
    \ through each line in turn until the last line has been completed.\n\nProcedures\
    \ are rarely like this, however. Most of the time there are choices to be made,\
    \ and as a result, statements to be executed only if a condition is true. for\
    \ example, if a value entered in a text box exceeds some limit you may want to\
    \ display an error message.\n\nSuch decisions are made using the If...Then...End\
    \ If set of statements, which take the form:\n\n+   - if condition Then\n  statements\n\
    \  End If\n\nThe statements are executed only if the condition is true. The condition\
    \ usually takes the form:\n\n+   - expression operator expression\n\nAny valid\
    \ expressions can be used, with the restriction that both must be numeric or both\
    \ text; you cannot mix the two types.\n\nThe operator is one of the following:\n\
    \n+   - = Equal to\n- <> Not equal to\n- < Less than\n- <= Less than equal to\n\
    - > Greater than\n- >= Greater than or equal to\n\nFor example, the following\
    \ procedure tests the value of an entry in a text box when the focus is moved\
    \ to another control. If the value is too high when you try to Tab out of the\
    \ text box, it is replaced by the maximum allowed, a warning message is displayed\
    \ and the cursor is put back in the text box."
  merge: -1
