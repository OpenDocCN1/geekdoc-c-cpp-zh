  md: '# Adding existing forms


    Existing form files can be added to the project at any time. Select Project/Add
    Item and then choose the file with VB extension from the file list. In this way,
    you can restore forms that were previously removed. You can also add forms that
    were created for other projects.


    # Removing forms


    +   - If a form is no longer needed, it can be removed from the project:


    +   - The form can be permanently deleted. On the Solution Explorer window, right-click
    on its form name and select Delete from the pop-up menu. You are asked to confirm
    the action, following which the form is removed from the project and the two form
    files are deleted from the project directory.


    +   - Depending on the type of project, the form may be temporarily excluded.
    On the Solution Explorer window, right-click on the form name and select Exclude
    From Project (or use ProjectExclude from Project). Although the form is removed
    from the project, the form file is unaffected and can be restored later if required.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_46_0.png)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_46_1.png)


    > Tip

    When changing form properties, make sure you are working with the correct form.
    The name of the current form is shown at the top of the Properties window.


    Right-click on form name to show pop-up menu'
