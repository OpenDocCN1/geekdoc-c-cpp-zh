  md: '# User-defined functions


    Visual Basic provides many built-in functions for handling text and numbers there
    will be others that you must create yourself. One way of doing this would be to
    use a procedure. For example, the following procedure converts inches to centimetres:


    ```

    Sub InchesToCmP(ByRef sngInches As Single, ByRef sngCm As Single)

    Const sngCmPerInch = 2.54

    sngCm = (Int(sngInches * sngCmPerInch * 100) + 0.5) / 100

    End Sub

    ```


    The converted value can be displayed in a text box with the following code:


    ```

    Dim inches As Single, sngCm As Single

    sngInches = txtEntry.Text

    InchesToCm(sngInches, sngCm)

    txtResult.Text = sngCm

    ```


    +   1 Display the Code window for the module or form where you need the function.
    (If the function is to be called entirely from within a form''s procedures, otherwise,
    insert it to: a module.)


    +   2 At some point after the first procedure to call the function, create a blank
    line and type the function declaration in the form:

    Function function(ByVal argument1 As type, ...) As type


    The function follows the same rules as procedure names. The arguments are the
    variables being passed to the function and must be a given type. You must also
    specify the type of the function itself (i.e. the type of the returned value).


    +   3 When you press [Enter] the End Function statement will be added for you.
    Insert the function code in the space above End Function.


    The function returns a single value, calculated in the function code using a variable
    that has the same name and type as the function itself.'
