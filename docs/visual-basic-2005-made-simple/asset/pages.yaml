  md: 'The window can be hidden by clicking the (Auto Hide) button on its toolbar;
    the window will then appear as an icon at the edge of the Visual Studio display.


    The window can be closed by clicking on its (Close) button.


    # Floating windows


    A floating window can be changed to suit your requirements:


    +   The window can be moved by dragging its title bar or resized by dragging any
    of its edges.


    +   The window can be docked by dragging it to any edge of the Visual Studio display.


    +   The window can be docked with another window by dragging it onto the top part
    of the second window. (Initially, the Solution Explorer and Properties windows
    are docked together in this way.)


    +   The window can be closed.


    You can also dock or unlock a window by double-clicking on the title bar.


    # Hidden windows


    Several options exist for the hidden windows:


    +   If you move the mouse pointer over the window''s button, the window is temporarily
    displayed (as a docked window). When you move the pointer away, the window is
    hidden again; but for the window is enlarged to show the window name, while the
    other buttons are reduced in size.


    +   You can keep the window permanently open (and docked) by clicking on its (Auto
    Hide) button. The button image changes depending on whether the window is temporarily
    or permanently open.


    Click to open window permanently


    ![](img/dd2d93f16b3cb78149c4221e4752898b_18_0.png)


    Move pointer to show hidden window


    10'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Closed windows


    A closed window can be opened by selecting the relevant option from the View menu
    (or pressing the corresponding shortcut key). For example, to re-open the Properties
    window, select View|Properties Window (or press key [F4]).


    # Window tabs


    To add a further layer of complication, design windows can be combined into a
    single window with multiple tabs. For instance, the Solution Explorer window that
    you see initially also contains the Data Sources. If you click on the Data Sources
    tab, this window is brought in front of the Solution Explorer window.


    # Data Sources window


    ![](img/dd2d93f16b3cb78149c4221e4752898b_19_0.png)


    > Tip

    If the Start Page has been closed you can redislay it at any time using View|Other
    Windows|Start Page.


    Click on the Solution Explorer tab to get the Solution Explorer window back again.
    It is up to you how the windows are combined:


    +   - Drag a tab off to create a open window.

    - Drag an open window onto the tab area of an existing window (with tabs) to add
    the window as a new tab.

    - Drag an open window onto the title bar of an existing window with no tabs to
    create a multi-tabbed window.

    - Drag a tab to a new position within the row of tabs to change the order of the
    tabs.

    - Drag a tab from one set of tabs to another.


    11'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/dd2d93f16b3cb78149c4221e4752898b_20_0.png)


    # Take note


    You can restore the windows and tabs to their original settings with Tools>Options.
    From the Window menu, select the Reset Window Layout.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_20_1.png)


    # Window tabs


    Using all these methods, you can set the appearance of Visual Studio to suit the
    way in which you want to work at any time.


    # Form Design tab


    A Visual Basic application usually consists of one or more windows. At the design
    stage, these windows are called forms. To start you off, Visual Studio supplies
    a single form, called Form1. This form will be renamed and resized when you begin
    to develop the application; other forms will be added as required. The forms are
    held in separate tabs in the main Visual Studio window.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_20_2.png)


    # Take note


    It is possible to create an application that has no forms at all; for example,
    an application to display a reminder at a specific time. In such cases, you need
    to delete Form1 — see page 38.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_20_3.png)


    12'
  merge: -1
