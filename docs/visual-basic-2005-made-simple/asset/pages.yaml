  md: '# Checked list boxes


    The **checked list box** is a combination of the list box and the check box. The
    list is always visible and each item in the list has a check box next to it.


    The list items are held in the **Items** collection, and for list boxes, you can
    use the methods that apply to that collection: Add, Insert, Remove, RemoveAt.


    The check boxes can take values of Checked, Unchecked and Indeterminate, for normal
    check boxes.


    The list items that are currently Checked or Indeterminate are held in the **CheckedItems**
    collection, with the corresponding index numbers in the **CheckedIndices** collection.
    These collections are members of the checked list box.


    You can determine the state of a particular item with the **ListItemCheckState**
    property, specifying the index number in brackets. For example, to see if the
    third item in a checked list name clbDays has been selected, refer to clbDays.GetListItemCheckState(2).


    The example below transfers the contents of a checked list box (clbCountries)
    to a normal list box (lstCountries)


    Variables are explained in Chapter 5: ''For'' loops are discussed in Chapter 6.


    lstSelectedCountries


    clbCountries,


