  md: 'The TrackBar is the modern equivalent of the standalone scroll bar and is the
    standard control for tasks where a value must be selected from a range. The bar
    has a set of marks on a horizontal scale, with a button indicating a proportion
    of the maximum value (for instance, the volume level in a music program or the
    proportion of a task that has been completed).


    The control has Minimum, Maximum, LargeChange and Value properties that are identical
    to those of the scroll bars.


    The Orientation property determines whether the track is Horizontal or Vertical.
    The TickFrequency lets you set the number of ticks on the scale.


