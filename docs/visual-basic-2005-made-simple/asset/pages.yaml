    For example, the following function converts inches to centimetres:


    ```

    Function InchesToCm(ByVal sngInches As Single)

    Const sngCmPerInch = 2.54

    InchesToCm = (Int(sngInches * sngCmPerInch * 100) + 0.5) / 100

    ```


    This function could be used to supply the value for a text box, named txtResult,
    as follows:

    txtResult.Text = InchesToCm(txtEntry)


    When this statement is executed, the InchesToCm function is called and the value
    in the txtEntry box is passed to it. The function calculates the value in centimetres
    using the passed value and the sngCmPerInch constant, defined in the function.
    The calculated value is held in the InchesToCm variable (defined as Single in
    the function header).


    The calculated value is then slotted back into the original expression and hence
    into the text box''s Text property.


    Rather than place the result of the function in a variable, you can use the Return
    keyword as an alternative. Whatever follows ‘Return’ is the value passed back.


    > Tip Use a function when just one value is to be returned to the calling procedures;
    use a procedure when two or more values are returned, or when there are no return
    values.


    > Take note In the same way as for procedures, several variables can be passed
    to a function. The types of the variables passed to the function must be an exact
    match for those defined in the function header.


