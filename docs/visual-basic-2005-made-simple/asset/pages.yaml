  md: '# Adding menus at run-time


    You can add menus, sub-menus and menu options while a program is running and

    change the properties of existing menu items.


    The following code adds a main menu object to a form:


    ```

    Dim MainMenu2 As New MenuStrip

    MainMenu2.Controls.Add(MainMenu2)

    MainMenu2.MainMenuStrip = MainMenuStrip

    ```


    This code creates the object (MainMenu2) and makes it the main menu for the

    current form.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_244_0.png)


    To add a menu to your menu system, use the code in the following:


    ```

    Dim mnuMenu1 As New ToolStripMenuItem("&mnuMenu1 name")

    MainMenu2.Items.AddRange(New ToolStripItem() {mnunuMenu1})

    ```


    The following code adds an item to an existing menu:


    ```

    Dim mnuMenu1Option1 As New

    ToolStripMenuItem("&Option1 name")

    mnuMenu1.DropDownItems.Items.AddRange(New

    ToolStripItem() {mnunuMenu1Option1})

    ```


    Finally, you can change the properties for a menu or menu item:


    ```

    mnuMenu1.Name = "&Save"

    mnuMenu1Option1.Visible = False

    ```'
  merge: -1
