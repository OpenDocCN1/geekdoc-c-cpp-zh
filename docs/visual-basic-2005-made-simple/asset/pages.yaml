- img_proc: true
  md: '# # Non-numeric variables


    As well as numeric variables and values, expressions can also include string variables
    (for handling text) and properties (both string and numeric). However, you cannot
    usually mix numeric and string variables.


    You will also need to define variables for handling objects and data where the
    type is not known in advance.


    # String variables


    String variables are much simpler to use numeric variables. You can assign a particular
    item of text by enclosing it in double quotes:


    ```

    strHomeCountry = "UK"

    ```


    You can also combine strings. (This is called concatenation.) The & & operator
    adds one to another. For instance:


    ```

    strFullName = strFirstName & " " & strSurname

    ```


    Here, the two parts of the name are added together with a space in the middle.


    | Tip

    Unlike other operators, it is essential to put a space on either side of the &
    symbol; otherwise, it will not be recognised. | Take note

    You can use + instead of &; the effect is the same. However, it is better to use
    & to avoid ambiguity. |


    # Properties


    You can use properties in expressions the same way as you would variables. The
    following statements place a text box in the middle of the form, the height of
    the box being provided by a variable, intHistHt:


    ```

    txtHistory.Height = intHistHt

    txtHistory.Top = (frmHist.ScaleHeight - intHistHt) / 2

    ```


    The text box can be filled by the value of a string variable, strHistText, as
    follows:


    ```

    txtHistory.Text = strHistText

    ```'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Numeric expressions can only include numeric properties and string expressions

    can only include text properties.


    However, you can put a numeric value in a text property or copy the contents of

    a text box into a numeric variable. For example:


    ```

    txtNewDist.Text = decMiles

    txtTotalDist.Text = txtNewDist.Text + txtOldDist.Text

    decMPG = txtTotalDist.Text / decGallons

    ```


    All the conversions between text and numeric values are carried out for you when

    dealing with properties.


    # ## Object variables


    If you define a variable as type Object, it can hold data of any type (text or
    numeric).

    Such variables can then be included in either numeric or string expressions without

    causing errors. This can be useful if you are not certain what type of data you
    will

    dealing with (for example, when using the contents of a text box that the user

    can enter numbers or text).


    However, these general-purpose variables should be used sparingly, as they take

    a large amount of memory. The variable itself holds a pointer to the data, which

    is stored at another location in memory and is as large as is needed for each

    articular occasion.


    A more common use of the Object variable is to create a specific instance of

    opart class. An Object variable was used in Chapter 4 to create and display an

    instance of a form class:


    ```

    Dim frmCompanyDetails As New frmCompanyDetails

    frmCompanyDetails.Show()

    ```


    The first statement creates a specific instance of the form class, resulting in
    a new

    object of that type (a window). Since the object was specified when the

    variable declared, the new object (frmCompanyDetails) inherits all the

    properties and methods of the class (frmCompanyDetails). Thus the Show method

    an be invoked to display the new window.


    There are many uses for Object variables in Visual Basic 2005, for example when

    selecting fonts, drawing lines and printing. Other examples are given later.


    125'
  merge: -1
