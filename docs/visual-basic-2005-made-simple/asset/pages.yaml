  md: '# Message boxes


    A particularly useful function, MessageBox.Show, displays a temporary dialog box.
    The box contains a line of text and one or more command buttons. The function
    is invoked with a statement in the following format:


    ```

    variable = MessageBox.Show(message, title, buttons, icon, default)

    ```


    The message is any line of text;title the text to be displayed in the title bar;buttons
    is a coding the buttons to be included;icon specifies the symbol to be shown to
    the left of the message; and default is another code for the default button (the
    one that is activated when you press [Enter]).


    The buttons and icon values are inserted as standard Visual Basic constants; for
    example, a value of MessageBoxButtons.YesCancel places three buttons on the dialog
    box. The variable indicates the button that was pressed.


    As you type the statement, the parameters are shown in a pop-up box. Note that
    there are 12 versions of this function, depending on the parameters you enter;
    the function is said to be overloaded. Although you can select the version you
    want, Visual Basic knows which version you are using from the parameters you enter.


    When you reach the parameters for the buttons and icons, further pop-up boxes
    appear. List the possible values available to you; select one by clicking or on
    pressing [Tab].\For example:


    ```

    Dim buttonVal As Byte

    buttonVal = MessageBox.Show("File already exists.

    Overwrite?", "Save", MessageBoxButtons.YesNoCancel,

    MessageBoxIcon.Warning, MessageBoxDefaultButton.3)

    ```


    ![](img/dd2d93f16b3cb78149c4221e4752898b_151_0.png)


    A dialog box is displayed, with a warning icon and three buttons (Cancel is the
    default). The variable buttonVal is returned with a value indicating the button
    that was pressed (e.g. DialogResult.Cancel if the Cancel button was pressed).


    Alternatively, if the key press is unimportant, you can omit the return variable:

    MessageBox.Show("File saved successfully", "Save Done",

    MessageBoxButtons.OK, MessageBoxIcon.Information,

    MessageBoxDefaultButton.1)


    This version of the statement is only really useful if there is only one button
    on the message box.'
  merge: -1
