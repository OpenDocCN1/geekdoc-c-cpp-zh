- img_proc: true
  md: 'on. Most controls have a large number of properties, some of which are similar
    to those forms. For instance, a button has the same size and position properties
    as a form but also includes properties to determine which keys can be used to
    activate it. Each type of control has a different set of properties. For each
    control, you can change the settings of individual properties (so all buttons
    but their settings are different).


    The Properties window displays the properties for the selected form or control,
    and allows you to change their settings. The properties are listed on the left,
    with the corresponding settings on the right. Some of the important properties
    are described in Chapters 2 and 3.


    Initially, the properties are divided into categories: for instance, those that
    determine the appearance of the object and those that specify its behaviour. However,
    this format can be confusing, so you can list all the properties in alphabetical
    order by clicking on ![image] button. To return to the listing by category, click
    on ![image]


    # Take note


    Some properties can also be changed more simply; for instance, the position or
    size of a form or control can be altered by dragging the object or its borders.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_24_0.png)


    # Tip


    To make the screen as uncluttered as possible, maximise the main window, dock
    the toolbar and reduce its width, close the Data Sources window and dock the Solution
    Explorer and Properties windows. Reduce the height of the Solution Explorer window.


