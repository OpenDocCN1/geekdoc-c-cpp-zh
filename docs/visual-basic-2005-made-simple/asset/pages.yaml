  md: '# Pictures


    The picture box control displays any type of image file, icon file or metafile.

    The Image property can be set at at design time and specifies the picture to be
    displayed. In that case, the picture file is incorporated into the form file (and
    hence in the executable file, making it considerably larger). Alternatively, you
    can specify the picture at run-time; the picture file is then held separately
    from the executable file (but must be supplied with the application). The value
    of the Image property must be specified as a Bitmap object.


    The Height and Width properties set the size of the picture box; the Left and
    Top properties determine the position of the picture on the form. The Move method
    moves the picture to a new position.


    The SizeMode property determines the way in which the picture is displayed, as
    follows:


    +   - Normal: The picture is displayed at its normal size and is positioned in
    the top left-hand corner of the picture box. If the box is not large enough for
    the whole picture, only the top left-hand corner is shown.


    +   - CenterImage: The picture is displayed at normal size in the centre of the
    box.


    +   - StretchImage: The image is stretched horizontally and vertically so that
    it fills the box.


    +   - Auto: The picture box is resized to fit the image. The top left-hand corner
    stays in the same position.


    If you need a border around the edge of the picture box, this is applied with
    the BorderStyle property.


    The Visible property can be set to False to hide the picture.


    The procedure below extends the File Viewer program from Chapter 10 to display
    the contents of an image file. The name of the file is stored in a label above
    the picture box. The full specification of the filename (including the path) is
    stored in a string. This string is then used to define a new Bitmap object, which
    in turn is used as the new value for the Image property.'
