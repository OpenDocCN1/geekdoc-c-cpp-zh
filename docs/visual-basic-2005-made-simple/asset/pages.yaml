  md: '# Restoring a form


    To restore a form that has been previously excluded:


    +   1 Select ProjectShow All Files. The list in the Solution Explorer is expanded.

    Among the new items (which were previously hidden from view) is the excluded form
    file, next to a white icon.


    +   2 Right-click on the file and select Include In Project (or use ProjectInclude
    In Project). The form’s content is restored in the Solution Explorer.


    +   3 SelectProjectShow All Files, this time to hide the other (system) files.


    +   4 There is currently no tab on the Visual Studio display for the form, double-click
    on the VB file in the Solution Explorer to display the form again.


