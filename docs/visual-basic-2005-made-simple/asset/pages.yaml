  md: '# Procedure names


    Event procedures are automatically named for you. Their names are not necessarily
    unique in the project as a whole; for example, if two forms each have a btnOK
    button, then both will have a btnOK_Click procedure. However, this is not a problem,
    since the procedures can only be called from within their own forms.


    On the other hand, each general-purpose procedure in a project must be given a
    unique name.


    The rules for naming procedures are the same as those for variables: no more than
    255 characters; starting with a letter; no spaces or symbols apart from the underscore.


    Use capital letters to identify individual words within the name; this helps to
    make the name meaningful.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_160_0.png)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_160_1.png)


    # Calling procedures


    A general-purpose procedure is executed by calling it from another procedure.
    The procedure is called by entering the name on a line of its own in the code.


    The empty brackets at the end of the procedure name will be added for you when
    you move out of the statement line.'
  merge: -1
  pgno: 160
