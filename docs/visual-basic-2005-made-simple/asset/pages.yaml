  md: '# Context menus


    The context menus that are displayed when you right-click on the screen can be
    added to your program in much the same way as the main menu strip:


    +   Drag the ContextMenuStrip control from the Toolbox onto a blank area of the
    form or onto a control. The context menu is added to the component tray.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_246_0.png)


    You can have different context menus for each part of the form. For example, individual
    controls (such as labels) can have their own context menu. The context menu for
    the form pops up when the user clicks on any control that does not have its own
    context menu.


    +   Add items to the context menu in the same way as for a main menu, including
    access keys where required. Items within a context menu can also lead to sub-menus.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_246_1.png)


    In the properties for the form or control to which the context menu is to apply,
    change the ContextMenuStrip property to the relevant ContextMenuStrip control.
    The available menus are listed in the drop-down box.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '![](img/dd2d93f16b3cb78149c4221e4752898b_247_0.png)


    +   4 Change the properties of the context menu items. The properties are displayed
    when you click on an item in the menu editor. The same properties are available
    as for main menu items, including the Name of the individual items.


    +   5 Create Click events for each of the context menu items by double-cliking
    on the items in the menu editor.


    When you run the program, the context menu will be displayed when you right-click
    on form or control.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_247_1.png)


    239'
