  md: '# Lists


    Several types of control are used for selecting an item from a list. The choice
    of control depends on the options you want the user to have.


    # Listboxes


    The list box allows the user to select from a list of options. The box consists
    of a rectangle containing a list of items, with a vertical scroll bar on the right-hand
    side (if the list is too long to fit in the box). The size of the box is specified
    when you add it to the form (though you can change this by varying the Height
    and Width properties while the program is running.


    You can specify the contents of a list box at design time using the Items property.
    This property holds the Itemscollection. The collection is a list of items that
    appear in the list box.


    | IstCountries System.Windows.Forms.ListBox |

    | --- | --- |

    | HorizontalExtent | 0 |

    | HorizontalScrollBar | False |

    | Mode | NoControl |

