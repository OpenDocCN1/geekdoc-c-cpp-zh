  md: '# Lines and shapes


    Lines and shapes are drawn on a form or the surface of a control using the Graphics
    object. Drawing is usually done inside an object''s Paint event procedure. The
    first task is to declare a Graphics variable with a Dim statement, following which
    the object is given a value that is reference to the form or control''s Graphics
    object; for example:


    ```

    Dim objG As System.Drawing.Graphics

    objG = e.Graphics

    ```


    The ''e'' parameter supplied with the Paint event has a Graphics property that
    points to the form or control''s Graphics. The Paint event is called whenever
    the contents of the object need to be redrawn; for example, when the form is loaded
    or moved when the window is brought to the top of the display. You can force an
    object to be redrawn by calling its Invalid method.


    To draw a line or shape, you also need to specify the colour, width and other
    parameters of the drawing. This is done with two further objects:


    +   - The Pen object defines the colour, width and style (e.g. unbroken or dotted)
    of lines.

    - The Brush object defines the colour and style (solid, hatched etc.) of filled
    objects. You use a different object for solid filling (SolidBrush) and hatched
    filling (HatchBrush).


    The pen and brush are created with statements as follows:


    ```

    Dim objPen As New Pen(Color.colour, width)

    Dim objBrush As New SolidBrush(Color.colour)

    ```


    The colour value is a standard Windows colour; width is a single value representing
    line width.


    When the pen and brush have been created, their properties can be changed. For
    example:


    ```

    ObjPen.Width = 2.5

    ObjPen.Color = Color.Blue

    ObjPen.DashStyle = Drawing2D.DashStyle.DashDot

    ```'
