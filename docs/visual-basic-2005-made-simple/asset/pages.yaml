- img_proc: true
  md: '> Tip

    Unless you want a window to remain available to the user, include a statement
    in the Click event for each form''s ''exit'' buttons (e.g. OK and Cancel). This
    ensures that unwanted windows are not left cluttering up the screen.


    > Tip

    If you unload the start-up form, the whole application should be closed down and
    all other forms should also be closed. (The Un event should be executed for each
    one.) To make sure you catch all the possible exit points, the Close statements
    for other forms should be included in the start-up form''s Unload event procedure.


    # Collections


    Visual Basic makes extensive use of collections. A collection is simply a set
    of objects. For example, when you add a list box to a form, the items in the box
    make up a collection.


    Similarly, you can have a collection of objects. For instance, every form has
    a Controls collection that contains all the controls you have added to the form.
    This provides you with a means of inspecting and changing the objects on the form.


    Collections have properties themselves and these tell you about the collection
    as a whole. Most importantly, a collection''sCount property tells you how many
    objects there are in the list.


    For example, collections are used for storing the items shown on a list box, as
    described below.'
