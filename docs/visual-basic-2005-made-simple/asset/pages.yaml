- img_proc: true
  md: "# Error messages\n\nWhenever a trappable error occurs, the system generates\
    \ an error number to identify the type of error. You can use this number in your\
    \ error-handling code to decide how best to deal with the error.\n\nThe error\
    \ information is returned in the Err object. This object has two particularly\
    \ important properties:\n\n+   - The Number property holds the error number. This\
    \ is the value you can use to drive your error-handling code.\n- The Description\
    \ property holds a detailed description of the error, including the values of\
    \ relevant variables.\n\nIn addition, the ErrorToString function returns a simple,\
    \ general error message for a given error number.\n\nThe following code displays\
    \ a message box containing the error number, simple message and full description:\n\
    \n```\nDim intError As Integer\nDim strSimpleError As String\nDim strFullError\
    \ As String\nDim strErrorMsg As String\n\nintError = Err.Number\nstrSimpleError\
    \ = ErrorToString(intError)\nstrFullError = Err.Description\n\nstrErrorMsg = \"\
    Error\" & Str(intError) & \": \" & strSimpleError & \\\n              \" Details:\
    \ \" & strFullError\n\nMsgBox(strErrorMsg)\n```\n\nCode such as this can be included\
    \ in the error-handling section of a procedure.\n\nErr.Number ErrorToString Err.Description\n\
    \n![](img/dd2d93f16b3cb78149c4221e4752898b_226_0.png)\n\n218"
  merge: -1
  pgno: 226
