- img_proc: true
  md: '# Getting help


    Visual Basic contains a wide range of controls and other elements. Deciding which
    ones to use can be a problem. However, Visual Studio holds all the information
    you will need in the form of on-line help. The information available includes
    help specific to Visual Basic and the more general MSN Library. Because the help
    is very extensive you may have chosen not to install the MSN files; these are
    still available, provided you are connected to the Internet.


    The easiest way to get help is via the Help menu:


    +   1. From the Help menu, select Index.

    2. In the ‘Look for’ box, type the word or phrase for which you need help.

    3. Click on the appropriate topic: for instance, the Form Designer window or an
    item on the Toolbox or Properties windows.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_25_0.png)


    Click on an item to see corresponding help


