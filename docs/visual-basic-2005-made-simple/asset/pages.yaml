  md: '# Data Sources window


    The Data Sources window, which is currently available as a tab on the Solution
    Explorer window, lists the sources of data available to an application: for example,
    external database files and web sources.


    Close the Data Sources window. You can redisplay the window with DataShow Sources.


    # Properties window


    Each form, and each control on a form, has a set of properties. These determine
    the appearance of the form or control and the way in which it behaves. A form
    has properties that specify how big it is and where it is visible when the application
    starts, whether it has Minimise and Maximum buttons, and


    Form or control whose properties are shown


    Property


    Properties by category


    ![](img/dd2d93f16b3cb78149c4221e4752898b_23_0.png)


    Setting


    Properties in alphabetical


    The text associated with the control.


    15'
  merge: -1
