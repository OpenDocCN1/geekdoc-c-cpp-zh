  md: '# FolderBrowserDialog


    The FolderBrowserDialog control has the following properties:


    +   - The **Description** property sets the text that is displayed above the folder
    list in the dialog.


    +   - The **RootFolder** property sets the initial directory from which the search
    will start. The directory must be one of the standard folder names (such as ''Desktop''
    and ''My Computers''). These names are held in the Environment.SpecialFolderFolder
    list.


    +   - The **ShowNewFolder** property determines whether the New Folder button
    is included in the dialog. By default, the property is True, allowing users to
    create folders from within the dialog.


    +   - The **SelectedPath** property holds the full path of the folder selected
    by the user. You can use this property to set the initial directory, if you do
    not want to use one of the standard folder names.


    Note that the SelectedPath value will end with ''\'' if a root directory is selected
    not for any other folder.


    The procedure below illustrates the use of the FolderBrowserDialog for retrieving
    the contents of a folder. When the Select Folder button is clicked, the filenames
    are added to a list box. This is done using the built-in **Dir function, which
    retrieves the first file from the directory specified. Note that you only need
    to give the file specification once; if no parameter is given, subsequent calls
    to the function return the next file in the directory.


    > Tip

    The FolderBrowserDialog will appear in most of your programs and when the code
    has been set up the first time it can be copied easily from one program to another.
    With these dialogs, you should use the default names rather than make up your
    own, as this makes the code more transportable.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_254_0.png)'
