    Function SimplifyText(ByVal strTextIn As String)

    strTextOut As String, chr1 As Char

    booWordStart As Boolean, i As Integer

    booWordStart = True

    i = 1

    strTextOut ="

    Do While i <= Len(strTextIn)

    chr1 = Mid(strTextIn, i, 1)

    If UCase(chr1) = "A" And UCase(chr1) = "Z" Then

    If booWordStart Then ''Character is a letter

    chr1 = UCase(chr1)

    booWordStart = False

    End If

    strTextOut = strTextOut & chr1 ''Add to output string

    Else

    ''Character not letter - therefore next ''Add is start of new word

    booWordStart = True

    End If

    i += 1

    Loop

    Return strTextOut

    End Function

