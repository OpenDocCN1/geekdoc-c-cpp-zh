  md: '# Version numbers


    Each time you build an application it is given a version number, consisting of
    up to four parts:


    +   * **Major number**: This is the main version number. When you completely rewrite
    an application you should increment the major version number. Two applications
    with different major numbers will not necessarily be compatible.


    +   * **Minor number**: This number is used to indicate that there have been significant
    changes to the application but that it is still compatible with earlier versions
    that have the same version number.


    +   * **Build number**: This number indicates the way in which the application
    has been built. For example, versions of an application for different processors
    would have different build numbers.


    +   * **Revision number**: This number is used for small changes to the application,
    such as bug fixes, testing and continuing development.


    Every application must have major and minor numbers; the other two parts of the
    version number are optional.


    The version number is held as part of the assembly information in AssemblyInfo.vb.
    Click on this file in the Solution Explorer and scroll to the bottom of the AssemblyInfo.vb
    tab to view or change the version number.


    The version number is given in the form:


    ```

    major_minor.build.revision

    ```


    By default, the version number is 1.0.*. The meaning of this number is as follows:


    +   * The major version is 1.


    +   * The minor version is 0.


    +   * The * tells the compiler to apply the build number itself.


    +   * There is no revision number.


    It is up to you system that you choose for numbering versions of your software
    you should ensure that the system is logical and that it is not too difficult
    to maintain. The system you use should be consistent between different applications.'
  merge: -1
