  md: '# Executable files


    Up until this point, the program has been run from within Visual Studio by pressing
    [F5]. As your program begins to develop, you can also test it as a standalone
    EXE program (which can be run directly from Windows).


    When you run the program (with [F5]), Visual Studio compiles the various components
    – forms, procedures etc. – into a single executable file. This .EXE file is held
    in the bin folder of your project directory. It is a completely standalone file,
    which can be copied to any other folder and can be run without having Visual Studio
    running at the same time.


    Unless you specify otherwise, the file will be the default program icon. To change
    the icon (before building the application):


    +   1 Right-click on the project name in the Solution Explorer and select Properties.


    +   2 In the list on the left of the Property Pages, check that the Application
    tab is selected.


    +   3 Select a new icon (with an ICO extension) and click on OK.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_118_0.png)'
