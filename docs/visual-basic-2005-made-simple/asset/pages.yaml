  md: 'When a list box has been filled:


    +   - The SelectedIndex property returns the index number of the item that is
    currently highlighted. If no item is selected, SelectedIndex is -1.


    +   - The Text property contains the text of the selected item.


    +   - The Items.Count property gives you the number of items in the list.


    +   - The Items.Item(index) property returns the item with the given number.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_109_0.png)


    These properties are available only at run-time.


    An item can be removed from the list using the Items.Remove and Items.RemoveAt
    methods, which take the forms:


    ```

    listbox.Items.Remove(listitem)

    listbox.Items.RemoveAt(index)

    ```


    For example, the first statement deletes ''Italy'' from a list box (named LTypes)
    and the second deletes the fourth item in the list:


    ```

    LTypes.Items.Remove("Italy")

    Types.Items.RemoveAt(3)

    ```


    ![](img/dd2d93f16b3cb78149c4221e4752898b_109_1.png)


    The Remove method is case sensitive. If you do not get the case of the list item
    exactly right, it will not be removed from the list.


    Take care if using the index number to remove items. Remember that every time
    you remove an item, the index numbers will change for all list items that followed
    the deleted item.


