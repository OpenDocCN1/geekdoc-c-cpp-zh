- img_proc: true
  md: '# Other controls


    In addition to the simple controls described above, there are a number of other
    standard controls on the toolbox:


    +   - The picture box control allows you to add bitmaps; picture boxes also provide
    simple drawing facilities (see page 274).

    - The timer lets you generate events at predefined times. (Add the control to
    the form and then set the Interval between timer events, giving a value in milliseconds.)
    (See page 281.)

    - List boxes, checked boxes and combo boxes allow you to choose from lists. Variations
    are provided by list views and tree views (see page 99).

    - A number of controls provide standard Windows dialogs, such as those for opening
    files, saving files, changing font or colour, or accessing the printer (see page
    244).


    In addition to these, there are many other controls for performing more specialised
    tasks. Some of these are supplied on the Toolbox tabs; many others are available
    from third-party suppliers. Additional controls are added with the Project/Add
    New item.


    # Re-running the application


    Try out some of these controls (examples are given over the page). You can see
    what your application will look like by pressing [FS] to run it. Clicking on a
    button won''t do anything but you will see the button change as it is clicked.
    You can click on a radio button, and check boxes can be switched on or off.


    Always save the project before running it. Occasionally, the system may ''hang''
    but providing you have saved your work, this should not be a problem. Remember
    that you can get out of an application by switching to Visual Studio and Debug/Stop
    Debugging.


    By this stage you should be able to create a fairly impressive ''front end'' to
    your application – all without writing a line of code. Now, to make the windows
    and controls respond to the user''s actions, you need to start adding program
    code.'
