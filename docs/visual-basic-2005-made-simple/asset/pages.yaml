  md: "# # String functions\n\nVisual Basic provides a number of ways for manipulating\
    \ text. In addition to a variety of built-in functions that allow you to change\
    \ or extract text, there is a string class that has methods for every type of\
    \ operation imaginable.\n\n# ## Built-in functions\n\nThere are many built-in\
    \ string functions. Some of the most useful functions are that act on one string\
    \ to produce another. These include:\n\n+   * **Left(string,length)** Returns\
    \ a string of given length from the left-hand side of the string\n  e.g. Left(\"\
    South\", 2) returns 'So'\n* **Right(string,length)** Returns a string of given\
    \ length from the right-hand side of the string\n  e.g. Right(\"South\", 2) returns\
    \ 'th'\n* **Mid(string, start, length)** Returns a string of given length for\
    \ the specified string, beginning at the start character position; if no length\
    \ is given, the text returned continues to the end of the string\n  e.g. Mid(\"\
    South\", 2, 3) returns 'out'\n* **Len(string)** Returns the length of the string\n\
    \  e.g. Len(\"South\") is 5\n* **LTrim(string)** Removes leading spaces from string\n\
    \  e.g. LTrim(\"South\") is 'South'\n* **RTrim(string)** Removes trailing spaces\
    \ from string\n  e.g. RTrim(\"South\") is 'South'\n* **Trim(string)** Removes\
    \ spaces at both ends of the string\n  e.g. Trim(\" South\") is 'South'\n* **UCase(string)**\
    \ Converts the string to capitals\n  e.g. UCase(\"South\") returns 'SOUTH'\n*\
    \ **LCase(string)** Converts the string to lower case\n  e.g. LCase(\"South\"\
    ) returns 'south'\n\nThe programs later in this book contain many examples of\
    \ these functions."
