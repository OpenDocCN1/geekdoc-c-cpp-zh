  md: '# Case statements


    When you are choosing between a number of alternatives, the Case statement is
    more appropriate than the IF statement. The structure for a Case statement is
    as follows:


    +   Select Case expression

    Case test1

    statements1

    Case test2

    ...

    Case Else

    statementsN

    End Select


    > Take note

    The Case Else section is not essential, but it lets you mop up any missing values.The
    Select statement must always be included, however.


    The expression is evaluated and the result is compared against the various tests.
    If the expression evaluates to test1, then statements1 are executed; if it is
    test2, statements2 are executed; and so on. If none of the tests matches the expression,
    the final set of statements (statementsN) is executed.


    The tests for each case can be any of the following:


    +   - A number or numeric expression (e.g. 7, sqrt(intA))

    - A string or string expression (e.g. "Yes", strUsername)

    - A range of values (e.g. 2 To 6, "A" To "AZ")

    - A comparative value (e.g Is > 6, Is < "M")


    You can combine any of these, separating them with commas; for example:

    Case 3, 6 To 8, Is > 12


    Here, the corresponding code is executed if the expression evaluates to 3, 6,
    7, 8 or a value greater than 12.


    The most important thing to remember is that the expression and the tests must
    be all numeric or all string.


    An example is given below. (Include the ''Imports VB = Microsoft.VisualBasic statement
    at the top of the class.)'
