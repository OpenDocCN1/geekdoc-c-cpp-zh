- img_proc: true
  md: '# # Using variables


    While an application is running, you will want to store information temporarily.
    For example, if a set of statements is to be processed a number of times you need
    to hold the repeat number and update a count each time the loop is completed;
    when users enter information in text boxes, this new data may have to be kept
    somewhere until you use it. All this information is stored in **variables.


    A variable is a named location in memory where a single item of data is held.
    Variables are created by being **declared** within a procedure or form. They can
    then be given values and these values can be retrieved or changed.


    In the same way as for variables, variables fall into two categories:


    +   - **Numeric** hold numbers (whole numbers, decimals, percentages, currency
    amounts and date values) and the settings for numeric properties.

    - **String variables** hold items of text and the settings for text properties.


    You cannot mix these two types; for instance, a numeric variable cannot hold a
    text unless the string has first been converted to a number.


    # ## Variable names


    Variable names must follow these rules:


    +   - A variable name can be up to 255 characters long, consisting of letters,
    numbers and the underscore character.

    - The name must start with a letter.

    - There must be no spaces or other symbols in the name.

    - Upper and lower case letters are treated as being the same.

    - You must not use reserved words (names that have a special meaning within Visual
    Basic, such as If And Left). These are listed in the various topics under ''keywords''
    in the Visual Basic on-line help.


    You should choose sensible names for your variables; programs are much more readable
    if names are meaningful. The aim should be to create a set of names whose content
    is reasonably obvious: for example, Current and AddressLine1. The use of capitals
    helps separate words within the name; for example, ''LastTypeToProcess'' is more
    quickly and easily understood than the equivalent ''lasttypetoprocess''.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'It is a good idea to start each name with a three-letter prefix to identify
    the type of data being stored.


    # Declaring variables


    Before you can use a variable it should be **declared**. A declaration is a statement
    specifying the name of a variable and its type.


    The point at which a variable is declared determines its **scope**: the scope
    of a variable affects where else in the project it may use:


    +   - **Local variables**, declared at the start of a procedure, are available
    only within procedure.


    +   - **Form-level variables**, declared at the top of the form class (immediately
    below the ''Inherits'' statement), are available to all procedures in the form.


    Local variables are declared using the **Dim** keyword as follows:


    ```

    Dim variable As type

    ```


    For example:


    ```

    Dim BoxWidth As Integer

    ```


    ![](img/dd2d93f16b3cb78149c4221e4752898b_125_0.png)


    Take note


    Properties can be thought of as predefined variables attached to particular objects;
    the property names are equivalent to the variable names and the property settings
    are the variable values.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_125_1.png)


    Take note


    You can use the Static keyword as an alternative to Dim. The values of Static
    variables are remembered after you leave a procedure and will be the same when
    the procedure is called again; the values of variables declared with the Dim keyword
    are cleared (to zero for numeric variables or the null string for string variables)
    every time the procedure is called.


    117'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'The type can be any of the following:


    | Type | Bytes | Use |

    | Boolean | 2 | Values that can be either True or False |

    | Byte | 1 | Whole numbers in the range 0 to 255 |

    | Integer | 2 | Whole numbers in the range –32,768 to +32,767 |

    | Long | 4 | Very large numbers (±2,000,000,000) |

    | Currency | 8 | Numbers with an exact number of decimal places (depending on
    your Country settings in Windows Control Panel) |

    | Single | 4 | Floating-point (decimal) numbers with up to 7 significant figures
    |

    | Double | 8 | Floating-point numbers, up to 14 sig. figs. |

    | Date | 8 | Floating-point numbers representing a combined date and time |

    | String | * | Text values |

    | Object | ** | Capable of holding any type of value, including objects |

    | * | | Strings require 1 byte per character |

    | ** | | Object values require 4 bytes plus 1 extra byte per character


    When declaring a numeric variable, use a type from high in this list as possible.
    For instance, if you know that a variable will always be a whole number, choose
    Integer rather than Single; if the value will be in the range 1–100, choose Byte.
    The types higher in the list use less memory and programs run faster.


    Form-level variables are declared immediately below the Inherits statement, using
    the Private keyword:


    Private variable As type


    These variables can be used by any procedure in the form. You can also use Dim
    instead of Private; the effect is the same.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Constants


    Constants variables have fixed values that cannot be changed, either by the user
    or a procedure. These can be declared as constants using the Const keyword.


    +   - Constants declared in a procedure are local to that procedure.

    - Constants declared at the top of a form are available throughout the form.

    - Constant declarations take the form:


    Const variable As type = value

    Constants help to make your program easier to understand. They also reduce the
    risk of things going wrong, inadvertently.


    > (Declarations) section


    ```

    FrmDetails.vb* FrmDetails.vb* [Design] FrmConstants.vb* [Design] FrmMain.vb* []

    FrmDetails

    Option Explicit Go

    Friend Class Embedded

    Inherits System.Windows.Form

    Private btnNewMember As

    Private getTotal As Integer

    Private strMemberName As String

    Private defFullsub, decassub As Decimal

    Const deminFullSub As Decimal = 25.25

    Const deminimumSub As Decimal = 12.85

