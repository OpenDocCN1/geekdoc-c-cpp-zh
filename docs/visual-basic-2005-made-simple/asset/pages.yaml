  md: '# Debugoptions


    There are two ways of starting your application:


    +   - Selecting DebugStart runs the program with debugging turned on, so that
    you can interrupt the program at any time and find out how it is operating.

    - Selecting DebugStart Without Debugging runs the program independently of Visual
    Studio. You cannot interrupt the program but you are able to carry working in
    Visual Studio. In this case, the Output window shows only the Build stage of the
    compilation.


    Build window


    ![](img/dd2d93f16b3cb78149c4221e4752898b_53_0.png)


    Messages show actions carried out while the application was built


    # EXE files


    When you build and run an application, an EXE version of the application is also
    built. This file can be found in the ''bin'' subdirectory of your project directory.


    You can run the EXE file at any time, even when Visual Studio is not running.
    However, you should take care to ensure that the program is not going to ''hang'';
    you will not be able to break into it via Visual Studio and the only option will
    be[Ctrl-Alt-Del].'
