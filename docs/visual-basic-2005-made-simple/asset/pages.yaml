- img_proc: true
  md: '# The first form


    Any Windows application is made up of one or more distinct windows. A window can
    be used to display information, to allow the user to enter data or to provide
    options for the user to select. At the development stage, the windows that make
    up a finished Visual Basic application are called forms. The forms you create
    become the windows through which the user accesses your application.


    It is up to you, when designing a form, to decide how the window will behave:
    whether it is on-screen initial; whether the user can minimize or resize it; what
    objects it displays; and so on. However, you should remember that once a window
    has been displayed it the user who decides the order in which things happen and
    when the window will be closed down. The more objects (buttons, scroll bars, text
    boxes...) you put on a form, the less control you have over the user''s actions.


    A form starts off as an empty window, which may have a title bar and control buttons
    (Control-menu box, Minimise button, Maximise button, Close button). Within this,
    you may add other objects: buttons, lists, check boxes etc.


    # Form files


    The details of each form are stored in two form files, with extensions of vb resx.
    These hold information such as the initial size of the form and its position,
    the objects on the form and so on.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_34_0.png)


    Forms are also used for most dialog boxes (e.g. those to select a file or enter
    a password) though some simple message boxes can be created as and when required
    within the code (see page 143).


    Because a form is totally self-contained (the form file contains both a description
    of the form and all the code attached to it), the same form can be used in other
    applications. This means that all your applications can have the same ''look and
    feel'', as well as reducing the amount of time you spend creating applications.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'There will usually be some Visual Basic code attached to the form, determining
    how the application will respond when the user takes action on the window''s controls.
    For instance, when the user closes the window, the code attached to the form should
    take any necessary action on data that has been entered and remove the window.
    The code for a particular form is stored in the corresponding vbf file.


    The forms in an application are listed in the Solution Explorer window. (To display
    the Solution Explorer, if it has been closed, select View(Solution Explorer).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_35_0.png)


    # Form1


    Visual Basic supplies a default form to start the project: Form1. You can use
    this as your application''s front-end window. You can increase or decrease the
    size of the window by dragging the handles on the form''s edges and corners.


    Other changes to the window and the way in which it behaves are made by altering
    the form''s properties.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_35_1.png)


    Drag side to resize horizontally


    Drag corner to resize horizontally and vertically


    27'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Form properties


    The appearance and behaviour of a window are determined by the corresponding form''s
    **properties**. These specify such details as the size and position of the window
    and whether it can be minimised or closed. For each property, there is a single
    setting.


    When you click on Form in the main window, the properties are listed in the Properties
    window, in the left-hand column. The corresponding settings are shown on the right.
    Any property can be changed by clicking on the appropriate item. In some cases,
    there is a fixed number of options and you must choose from a drop-down list;
    for others, a value for the setting can be typed in directly.


    Object whose properties

    are being displayed


    Click to

    properties

    by category


    ![](img/dd2d93f16b3cb78149c4221e4752898b_36_0.png)


    Click to

    show more

    settings


    Property


    Setting


    Text

    The text associated with the control.


    28'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Name and Text


    The **Name** of the form is the name that appears in the Solution Explorer window;
    the **Text** is the piece of text that appears in the title bar (for the front-end
    window, this is usually the application title). Either of these properties can
    be changed by clicking on the existing name and typing over it.


    The Name property is shown in brackets that it appears at the top of the alphabetical
    list. Its setting should be changed to tell you what the form does.


    > Take note


    In earlier version of Visual Basic the Text property was called the Caption property.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_37_0.png)


    Adopt a suitable convention for naming forms and controls. For example, identify
    forms by setting the first three characters to be ''frm'', such as ''frmFront''
    for the front-end window. The Name will be used when referring to the form in
    the code.


    # Form Name


    | Property | Value |

    | --- | --- |

    | Location | False |

    | Locked | False |

    | Membership | (none) |

    | ReadOnly | False |

    | MaximumSize | 0,0 |

    | MinimumSize | 0,0 |

    | Opacity | 100% |

    | Padding | 0,0,0 |

    | RightLeft | False |

    | ShowIcon | True |

    | ShowTaskList | Auto |

    | Size | 300,2 |


    # Tip


    The values you have changed are shown in bold type; the settings in normal type
    represent default values. If you change a value back to the default, it returns
    to normal type.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_37_1.png)


    Although the properties are set as you develop the form, you can also write code
    to change them while the application is running - see page 89.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_37_2.png)


    Text on title bar'
  merge: -1
  pgno: 37
- img_proc: true
  md: "# The border style\n\nThe FormBorderStyle property specifies the type of border\
    \ and the elements that may appear in the title area. The most useful options\
    \ are:\n\n+   - None\n  - FixedSingle\n    There is no border; the window has\
    \ no title bar or control buttons — useful for message boxes.\n\n+   - FixedSingle\n\
    \  The window may have a title bar, Control-menu box, Close button, Minimise button\
    \ and Maximise button. The user cannot change the window size by dragging the\
    \ border. This style is used for windows with a fixed number of controls (e.g.\
    \ data-entry forms).\n\n+   - Fixed3D\n  As for FixedStyle but with three-dimensional\
    \ border.\n\n+   - Sizable\n  The window may have any of the Fixed controls and\
    \ cannot have the other control buttons. may also be resized by the user. This\
    \ is the default for all new forms and is used anywhere where the user may need\
    \ to resize the form (e.g. text windows, spreadsheets, pictures).\n\n+   - FixedDialog\n\
    \  The window is a dialog box. It may have a title bar and Control-menu button\
    \ but cannot have the other control buttons. It cannot be resized by the user.\n\
    \nTwo others, FixedToolWindow and SizableToolWindow, are used in the creation\
    \ of toolbars. For more information on these options, see the one help.\n\nTo\
    \ select a order, click on FormBorderStyle. A down-arrow button appears on the\
    \ right of the current setting. Click on this, and a drop-down list is displayed.\
    \ Click on one of the options to change the setting.\n\nPrevious versions of VB\
    \ had a BorderStyle property rather than FormBorderStyle.\n\n![](img/dd2d93f16b3cb78149c4221e4752898b_38_0.png)"
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Title bar and buttons


    If FormBorderStyle is None, the window will have no title bar and therefore no
    buttons. For any other setting a title bar is displayed and may contain the usual
    Windows buttons. The inclusion of a Control-menu box, Minimise button and Maximise
    button are determined by the settings of the **ControlBox, MinButton and MaxButton**
    properties respectively.


    Each of these properties has two possible settings: True or False. The True setting
    indicates that the button is included (and therefore that the user may click on
    it); False means that the button will not be available.


    The Close button is included only when there is a Control-menu box.


    The **ShowInTaskbar** property determines whether an icon for the form is added
    to the Windows taskbar. If the property is set to False and the form is minimised,
    it will appear as a small window in the bottom left of the screen.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_39_0.png)


    # Size and Position


    The size of a form can be altered by dragging its borders and is held in the **Size**
    property.


    This property is actually a combination of two independent properties:


    +   - **Width** Width of form (including borders)

    - **Height** Height of form (including borders and title bar)


    For a more precise form size, the Width and Height can be entered directly in
    the Properties window. Entering the settings directly ensures consistency between
    windows.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'You can set the property directly in two ways:


    +   - Click on the Size setting and enter values for width and height, separated
    by a comma.


    +   - Click on the button to the left of the Size property and then enter the
    Width and Height individually.


    All sizes are measured in pixels. Therefore the physical size of the window will
    depend on the resolution of the user''s screen.


    For high-resolution screens, windows will be smaller and take up less space on
    the screen; text appears much smaller and can be fitted on the screen.


    The initial position of the form in the screen is determined by the StartPosition
    property, which can take the following values:


    | WindowsDefaultLocation | The position is set by Windows when the program starts.
    (This is the default setting for all new forms.) |

    | WindowsDefaultBounds | The position and size are set by Windows when the program
    starts. |

    | CenterScreen | The window is centred on the screen. |

    | CenterParent | The window is contained in another window and is centred within
    that window. |

    | Manual | The position is determined by the Location property. |


    > > Tip When developing on a high-resolution screen, remember that end users may
    have screens of lower resolution. Either make sure that windows will have an initial
    position towards the left and top of the screen, or get the user''s screen dimensions
    and use them to calculate the position and size at run time — see Chapter 4.


    32'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Set the value by clicking on StartPosition and then selecting from the drop-down
    list.

    If you choose Manual, you must also set the Location property, which is a combination
    of two other properties:


    +   - Distance from left-hand side of screen or parent window

    - Distance from top of screen or parent window


    Both properties are specified in pixels. As for the Size property, you can either
    enter the Location values separated by comma or specify the X and Y values individually.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_41_0.png)


    # Visible and Enabled


    A window should be displayed only when it is needed; this is controlled by the
    form’s Visible property. When Visible is True, the window appears on the screen
    in its predefined position; when Visible is False, the window is hidden. Usually,
    the first form is visible; making the first form invisible when the program starts
    up some additional programming (see ‘Making a Startup Windows Form Visible’ in
    the MSDN help for details). Other forms are usually displayed as needed and then
    hidden when no longer required. With most properties, the settings can be changed
    when the program is running.


    Only one window can be active at a time; the colour of the title bar is used by
    Windows to show which window is active. Clicking on a window makes it active (deactivates
    all other windows).


    Even though a form is visible, you may not want the user to be able to access
    it. For instance, when a dialog box is displayed, you may not want the user to
    click on the window behind it until the dialog is closed. When the Enabled property
    for a form is True, users can click on the corresponding window to make it active;
    when the property is False, clicking on the window has no effect.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# # Saving the form


    Like all other computer applications, you should save your work regularly. It
    can take a long time to set up a form just as you want it and it takes only a
    few seconds to save it.


    As described above, the details of the form will be saved in a pair of form files.
    These files hold everything that is needed to construct the form: its properties,
    its controls and they give the form a name FileSaveFront. and the code attached
    to the form.


    The form files have been created in the project directory, with the default name
    Form1. Before beginning the task of customising the form, you should give it a
    more appropriate name. To save the current form with a new name, select FileSaveformname.vb
    As from the Visual Studio menu bar. The project directory is shown and you can
    give the form a suitable name (e.g. fmFront.vb for a form named fmFront). If you
    type a new name, Visual Basic will add a VB extension. Remember that you are choosing
    a name for the form, not for the project as a whole. Visual Studio will be choosing
    the corresponding RESX file.


    After saving the form, the filename you specified appears in the Solution Explorer
    window.


    You should change the Name property for the form to match the filename; you should
    also change the Text property so that suitable text is displayed in the title
    bar.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_42_0.png)


    New filename shown in Solution Explorer window


    > Tip In future, you can quickly save the current form by pressing [Ctrl-S]. Do
    this every few minutes.


    > Take note The original Form1 files will also still exist in the project directory
    and can be deleted.


    34'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Adding new forms


    Most applications need a number of windows, and the forms for these can be created
    in much the same way as the first form. To add a new form, select Project/Add
    Windows Form from the Visual Studio menu, click on the Windows Form icon (if not
    selected), type a filename for the form and then click on Add.


    New Windows form


