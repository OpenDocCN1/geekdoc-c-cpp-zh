  md: "# Loops\n\nThe conditional statements give you the opportunity to decide whether\
    \ or not piece of code is to be executed but this still restricts you to a linear\
    \ flow down through a procedure, from top to bottom. There are occasions when\
    \ you also need to repeat a set of statements. Visual Basic provides looping instructions\
    \ for every occasion:\n\n+   - Repeating a section of code a number of times\n\
    - Repeating while a condition is true\n- Repeating until a condition becomes true\n\
    - Repeating indefinitely\n\nEach of these alternatives has its own set of Visual\
    \ Basic instructions.\n\n# For...Nextloops\n\nThe simplest approach to looping\
    \ is to repeat a group of statements a given number of times. This is achieved\
    \ with the For...Next statements, which have the following structure:\n\n```\n\
    For variable = start To End Step step\n  statements\n  Next variable\n```\n\n\
    The loop begins with the variable set to the start value and the statements are\
    \ executed. When the Next statement is reached the value is increased by the step\
    \ amount. If this is greater than the end value, the loop ends and continues with\
    \ the statement below Next. Otherwise, the statements are executed again. This\
    \ continues until the end value is exceeded.\n\nThe Step can be omitted, which\
    \ can the variable increases by 1 each time. The step may also be negative, reducing\
    \ the variable value each time: in this case, the end should be less than the\
    \ start.\n\nFor example:\n\n```\nFor i = Len(strTextIn) To 1 Step -1\n  strTextOut\
    \ = strTextOut & Mid(strTextIn, i, 1)\nNext\n```\n\n166"
  merge: -1
