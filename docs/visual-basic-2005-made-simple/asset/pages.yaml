  md: "# Displaying other forms\n\nWhen you run an application, the form specified\
    \ as the Startup Object is loaded into memory and displayed as a window. Other\
    \ forms can be loaded and displayed using the Show method. For example, the following\
    \ procedure loads the Details form when the Member Details button is clicked:\n\
    \n```\nPrivate Sub btnDetails_Click()\n    Dim frmvCompanyDetails As New frmCompanyDetails\n\
    \    frmvCompanyDetails.Show()\nEnd Sub\n```\n\nRemember that when you design\
    \ a form you are creating a class. Running the procedure above results in an object\
    \ (the window) being created from that class. On the other hand, when you add\
    \ a control to a form at the design stage, you are adding a specific object (on\
    \ the control's class).\n\nThe statement 'New' loads a window into memory but\
    \ does not display it. Therefore if the new window has been created, you can carry\
    \ out other instructions on it before you use the Show instruction. For example,\
    \ you may want to set the size of the window or decide which of its controls will\
    \ be visible and True.\n\nNote that the Show method has the same effect as setting\
    \ the Visible property to True.\n\n# Hiding and unloading forms\n\nA form can\
    \ be hidden again with the Hide method; for example:\n\n```\nMe.Hide\n```\n\n\
    This is the same as setting the Visible property to False.\n\nAfter a form has\
    \ been hidden, it is still held in memory. To free the memory used by the form,\
    \ use the Close method; for example:\n\n```\nMe.Close()\n```\n\nThis statement\
    \ removes the form from the screen, deletes the form's data from memory. Just\
    \ before a form is unloaded, its Unload event is executed. The Unload event is\
    \ also executed when the window is closed in any other way: double-clicking on\
    \ the Control-menu box, clicking on the Close button or selecting the Visual Studio\
    \ Debug!Stop Debugging option."
