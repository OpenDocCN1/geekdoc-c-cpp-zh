- img_proc: true
  md: '# Tab stops and focus


    When the user clicks on a window, the window is said to have the focus; that is,
    it is the active window. The title bar of the window with the focus has a different
    colour to the others. (In the default Windows colours, the window with the focus
    has a blue title bar, the rest are grey.) Only one window can have the focus at
    any time.


    Similarly, one (and only one) control on the window has the focus. This is usually
    indicated by a thicker border around the control, by highlighting or by the appearance
    of a cursor in text boxes.


    When the user presses the [Tab] key, the focus moves from one control to the next.
    The order in which the focus moves is determined by two properties: TabStop and
    TabIndex. The TabStop setting specifies whether or not the control can have the
    focus (a setting of True if it can), while TabIndex gives the order in which the
    controls have the focus. Each control on the form has a unique tab index number.
    Initially, the tab numbers match the order in which the controls were added to
    the form.


    To change the tab order, change the Tab setting for a control. All the index numbers
    will be updated to take account of the new order. For example, if there are four
    controls on the form, the index numbers will be 0, 1, 2 and 3. To move the last
    control into second place, change its index number from 3 to 1. The system will
    then renumber the two controls in the middle from 1 and 2 to 2 and 3 respectively.
    By changing the tab index for several objects, you can put the controls into any
    order you like.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_71_0.png)


    > Take note All controls have a TabIndex number but those for TabStop is False
    ignored. No two controls on a form have the same TabIndex.


    > Tip Don''t worry about the tab settings until the form is complete – then you
    can set the tab index for all the controls at once, when you have a better idea
    of the order you want.


    63'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Visible and Enabled


    The **Visible** property determines whether the control can be seen and **Enabled**
    decides whether it can be used. As a general rule, it is less confusing for the
    user if controls are always visible but not necessarily enabled. When a control
    is not enabled (its Enabled setting is False), any text displayed on it is grey
    and clicking on the control has no effect. Naturally, if a control is not visible
    (its Visible setting is False), the user cannot click on it and its Enabled property
    is irrelevant.


    For example, you may have a Save button on your form that is enabled only when
    new data has been entered in text boxes. (The alternative would be to make the
    Save button when a change is made to the data but a button popping up on the window
    is disconcerting for the user.)


    The Enabled property can also be used for making a text box read-only. If Enabled
    to False the user can see the text but cannot change it.


    The Visible property may be used when the value of one control affects the applicability
    of others. For instance, on an accounts form a pair of radio buttons may allow
    you to choose between a payment and a receipt. Other controls on the form – such
    as a text box for the cheque number – will make visible visible depending on the
    radio button that is clicked. When the user clicks the payment button, the cheque
    number is made visible; when the receipt button is set to False while a text box
    containing the delivery date could be made visible


    In another case, a button may be clicked to display additional information in
    the window; when the button is clicked, the Visible property on a text box could
    be set to True.


    > **Tip**nTwo controls may occupy the same space on the form, providing they are
    never both visible at the same time. For instance, the same area may be used for
    a cheque number for payments and the delivery date for receipts.'
  merge: -1
