  md: '# Using text


    You can also draw text on a graphics object. For this you need to define a font
    using

    the Font object. This object is created in a similar way to the pen and brush:


    ```

    Dim fontobject As New Font(font, size, style)

    ```


    The style is optional and specifies the use of bold, italic etc. You can combine
    two

    or more styles with the Or operator (for instance, ''FontStyle.Bold Or FontStyle.Underline'').
    For example:


    ```

    Dim objFont As New Font("Arial", 12, FontStyle.Bold)

    ```


    The text is drawn using the DrawString method which has as its parameters the

    , font, brush and co-ordinates of the top-hand corner of the text; for example:


    ```

    objGraphics.DrawString("Lights!", objFont, objBrush, 30, 0)

    ```


    Note that you can use ''Me.Font'' if you want to use the current font from the
    form

    or control.


    Text added by

    DrawString method


