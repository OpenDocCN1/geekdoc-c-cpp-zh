- img_proc: true
  md: 'MaxLength sets a limit to the number of characters that can be entered in the
    box. For instance, a setting of 8 could be used when entering a password. If MaxLength
    is 0 (the default), the amount of text is limited only by the computer''s memory.


    For large amounts of text, where MultiLine is True, you may want to add scroll
    bars. The ScrollBars property can take the following settings:


    +   - **None** No scroll bars. Use this when the amount of text is limited.


    +   - **Horizontal** Horizontal scroll bar. The user can keep typing to the right,
    beyond the end of the box. Use where there are no paragraphs (e.g. program code).


    +   - **Vertical** Vertical scroll bar. This is the most useful option, giving
    a clear indication of how much text has been typed and where the cursor is, relative
    to the text as a whole.


    +   - **Both** Both scroll bars. Use this for text that can spread in directions.


    If there is no horizontal scroll bar, the text for a multi-line box automatically
    wraps to the next line when the right-hand edge of the box is reached. However,
    when there is no vertical scroll bar, the text will still scroll upwards when
    the box is full, unless you set MaxLength. Therefore, you should usually have
    a vertical scroll bar for multi-line text.


    The PasswordChar property is useful when asking the user to enter a password.
    The setting can be any single character (though it is usually *); this character
    will be displayed regardless of what the user types but the actual entry will
    be held in the Text property.


    # Radio buttons and check boxes


    Radio buttons and check boxes provide two different methods of giving the user
    choices.


    **Radio buttons** usually appear in groups of two or more, and all the buttons
    on a form are interrelated (unless they split into groups – see page 72). The
    control consists of a circle with a piece of text next to it. The text is held
    in the **Text** property.'
