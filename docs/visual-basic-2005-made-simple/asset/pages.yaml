- img_proc: true
  md: '# Debugging


    When the program encounters a problem it cannot handle, it displays an error message
    and highlights the line in the program that is causing the problem. The program
    is now in Break mode.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_214_0.png)


    Line that caused crash is highlighted | Description of error | Possible actions
    | Suggestions for resolving the problem


    The code window is displayed with the line that caused the problem highlighted
    by a yellow box. The program has not halted; it has only been temporarily suspended.
    Therefore, if the error is not too serious, you can make a correction and continue
    running.


    The error box has three sections:


    +   - At the top of the box is a description of the error that has occurred. This
    will be enough in most cases to tell you what needs to be done to correct the
    error.

    - The middle point points to relevant sections of the on-line.'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'The bottom of the box lets you display more detail relating to the error or
    copy some of the detail to the clipboard (for pasting into Notepad, for example).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_215_0.png)


    The toolbar is displayed at the top of the window.


    Show next statement


    Watch


    ![](img/dd2d93f16b3cb78149c4221e4752898b_215_1.png)


    Locals


    Click on the Locals button. The box below the Code window lists the values of
    relevant variables. These values are held by the variables before the line is
    executed.


    # Variable name


    # Current value


    ![](img/dd2d93f16b3cb78149c4221e4752898b_215_2.png)


    Tabs for debug views


    207'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'Click on the Watch window to see the values of other selected variables.


    | Name | Value | Type |

    | --- | --- | --- |

    | debugValueOfDayNumber + 1 | Unable to evaluate the expression. | |

    | firstDayOfWeek, Text | | String |


    During Break mode, the following options are available:


    +   - You can inspect the line that caused the problem, and the values of relevant
    variables; then press [F5] (Debug/Continue) to continue running the program. The
    system will attempt to handle the error.

    - You can close down the program so you can make changes to the code by pressing
    [Ctrl-Alt-Break] (Debug/Stop Debugging).

    - You can restart the program from a different point in the current procedure
    by clicking on another line, right-clicking and selecting Set Next Statement;
    then press [F5] (Debug/Continue). This may allow you to skip a troublesome portion
    of code but is not usually a viable option.


    If you lose your place in the program, right-clicking and selecting Show Next
    Statement displays the procedure containing the next statement to be executed.


    While the program is halted, you can also inspect the values of other variables
    or expressions (see Watching variables on page 215).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_216_0.png)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_216_1.png)


    Take note


    For earlier versions of Visual Basic, several of the Debug options are in the
    Run menu.


    Take note


    When a program crashes, pressing [F5] restarts it at the line that caused the
    problem, not the following line.


    208'
  merge: -1
