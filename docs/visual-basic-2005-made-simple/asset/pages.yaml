- img_proc: true
  md: '# Main window


    The **main window** contains all the elements you would expect to find in a Windows
    application:


    +   - The **title bar** contains the name of your new project and tells you that
    you are in Visual Basic 2005. On the right are the usual buttons for minimising,
    maximising and closing the window.

    - The Visual Studio **menu bar** includes 11 drop-down menus. Many of the options
    in these menus are described later in the book.

    - The **toolbar** contains a row of icons that provide shortcuts to the most frequently
    used Visual Basic operations.


    Title bar


    ![](img/dd2d93f16b3cb78149c4221e4752898b_16_0.png)


    Other windows are ''docked'' by dragging them to the sides of the main window


    Toolbar


    Menu bar


    Below the toolbars are two tabs:


    ![](img/dd2d93f16b3cb78149c4221e4752898b_16_1.png)


    Navigation


    +   - The first tab, Form1.vb [Design], is where you will design the first window
    for your application.

    - The second tab, Start Page, was the tab that appeared when you entered Visual
    Studio. Click on this tab and you will see the same display as before. Here you
    can start a new project or change to an existing project.


    Other tabs will be added as the application progresses. If there are too many
    tabs to fit the display, the buttons on the right left you navigate between them.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Design windows


    The main Visual Studio window can contain a number of other design windows. Initially,
    the design windows are ''docked'' at the sides of the Visual Studio display or
    are represented by buttons. There are a number of options for how these windows
    can be displayed and these can be confusing at first. The appearance of the windows
    can be changed to suit your method of working:


    +   - The windows can be kept at all times (as is the case initially with the
    Solution Explorer and Properties windows on the right).

    - The windows can be made to ''float'' to any position on the screen.

    - The windows can be made to hidden down the side of the Visual Studio display
    (as for the Toolbox below it).

    - The windows can be closed. (There are a number of closed windows, which will
    be displayed as they are needed.)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_17_0.png)


    # Open windows


    When a window is open, you can change its appearance:


    +   - The width of the window can be changed by dragging the edge opposite the
    docked edge.

    - The window can be made to ''float'' by dragging the bar into the main window.


