  md: 'The following program uses two text boxes for entering the dates (txtDate1
    and txtDate2) and two for showing the results (txtDays and txtWeeks). The calculation
    is initiated by clicking on a button (btnCalculate).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_313_0.png)


    Public Class frmDateComparisons

    Inherits System.Windows.Forms.Form


    #Region "Windows Form Designer generated code"

    #End Region


    ```

    Private Sub btnCalculate_Click(...) Handles btnCalculate.Click

    Dim dteDate1, dteDate2 As DateTime

    Dim intTotalDays As Integer

    Dim shoNumWeeks, shoNumDays As Short

    ''Get dates into date/time variables

    teDate1 = DateValue(txtDate1.Text)

    teDate2 = DateValue(txtDate2.Text)

    ''Get difference in number of days

    intTotalDays = dteDate2.ToDate - dteDate1.ToDate

    ''Convert to weeks and days

    shoNumWeeks = Int(intTotalDays) / 7

    shoNumDays = intTotalDays Mod 7

    ''Put answers back in text box

    txtWeeks.Text = shoNumWeeks

    txtDays.Text = shoNumDays

    End Sub

    End Class

    ```


