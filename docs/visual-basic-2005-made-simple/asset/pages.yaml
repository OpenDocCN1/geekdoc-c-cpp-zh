  md: '# DoLoops


    The **Do...Loop** group of statements provides an alternative to For...Next loops,
    repeating the loop until some condition is either true or false. There are five
    varieties of this loop:


    +   - **Do statements Loop**: Repeats until an Exit Do statement is encountered
    or the user presses [Ctrl-Break]

    - **Do While condition statements**: Repeats as long as the condition is true;
    loop is never executed if the condition is false initially

    - **Do statements While condition**: Repeats as long as the condition is true;
    loop is always executed at least once

    - **Do Until statements Loop**: Repeats until the condition is true; loop is never
    executed if the condition is true initially

    - **Do statements Loop Until condition**: Repeats until the condition is true;
    loop is always executed at least once


    Each of these is useful in particular circumstances. The most important decision
    is whether to place the While/Until part of the structure at the top or bottom
    of the loop; this depends on whether or not you want the loop to be executed at
    least once, regardless of the initial state of the condition.


    Choose between Until and While depending on which makes the condition easier to
    understand. An Until statement can be converted into a While by putting Not in
    front of the condition: for example, While A > 0 is the same as Until Not A >
    0 or Until A <= 0.


    You can use Exit Do to jump out of any loop, where possible, this statement should
    be avoided; it is neater to exit via the Loop statement. The program below demonstrates
    the use of these loops.'
