  md: '# Text


    Many controls have a fixed item of text that appears on the surface of the control;
    for example, buttons, check boxes and labels. The fixed text is held in the Text
    property. The restrictions on the Name do not apply to the Text; this is a purely
    cosmetic piece of text and you can enter whatever you like.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_64_0.png)


    You can include an & in front of any character in the Name to denote that character
    as an access key. When there is an access key, the user can ''click'' the control
    by pressing [Alt] and the access key together. For example, if the access key
    is S, the control can be clicked by pressing [Alt]+S]. The access key character
    is underlined in the control''s caption. If you need to include an & in the Text
    itself, type ''&amp;''; only one will be displayed.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_64_1.png)


    Caption: &Start Access key: s

    Caption: Option &4 Access key: 4


    56'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'It is usual to select the first letter of the Text as the access key, unless
    that letter has already been used by another control on the same form (in which
    case you can select any suitable character in the Text).


    If two controls have the same access key, pressing that combination will select
    each one of them in turn. However, this is confusing for users and should be avoided!
    Other controls allow users to type an entry. These also have a Text property,
    which holds the user''s input. In some cases, you can set a default value for
    the Text property, which is shown when the form is first displayed and which the
    user can overwrite. For other controls, the Text property cannot be set during
    development but you can change it (and the user can add text) while the application
    is running.


    | Properties |

    |---|---|

    | btnStop | System.Windows.Forms.Button |

    | TabStop | True |

    | Tag | &Cancel |

    | TextAlign | MiddleCenter |

    | TextImageRelation | Overlay |

    | UseCompatibleText | False |

    | UserName | True |


    You can add read-only controls to the form (where the user cannot change the text)
    by changing the controls'' Enabled property to False (see page 64).


    > Take note


    In earlier versions of Visual Basic, the Text property is referred to as the Caption
    property.


    57'
