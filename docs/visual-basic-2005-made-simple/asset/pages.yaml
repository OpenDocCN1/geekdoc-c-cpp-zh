- img_proc: true
  md: 'You can also add a context menu while the program is running. The steps required
    are similar to those for adding the menu at the design stage:


    +   1. Define a ContextMenuStrip object and the required number of ToolStripMenuItem
    objects.


    +   2. Attach the context menu to the form (or a control) by setting the form
    or control''s ContextMenuStrip property to the name of the ContextMenuStrip object.
    Include an & in front of any access key.


    +   3. Add the text to the menu using the context menu object''s Items.AddRange
    method.


    +   4. Specify the text to be displayed in the menu by setting each menu item''s
    Text property. Include an & in front of any access key.


    +   5. Change any other menu item properties (for example, to give the item a
    shortcut key or to disable it).


    +   6. Create Click procedures for each menu option.


    The example procedure below adds a context menu to the Membership Database front-end
    window, with options to display the other windows or exit the program. This procedure
    could be called from the form''s Load procedure.


    The Click events for the three menu items are also given.


    > Tip

    To edit an existing menu, click on its icon in the component tray. The menu temporarily
    appears below the main menu in the top left-hand corner of the form.'
  merge: -1
