  md: "# The Else statement\n\nThe conditional statements can provide alternatives\
    \ for when the condition is false by including an Else statement, as follows:\n\
    \n```\nIf condition Then\n    true_statements\nElse\n    false_statements\nEnd\
    \ If\n```\n\nIf the condition is true, the true_statements are executed; otherwise,\
    \ the false_statements are performed. For example:\n\n```\nIf boolLeapYear = True\
    \ Then\n    intDaysInFeb = 29\nElse\n    intDaysInFeb = 28\nEnd If\n```\n\nThe\
    \ use of Else allows you to provide two alternative sets of statements, only one\
    \ which will ever be executed.\n\n# Nested Ifs\n\nFor complex conditions you can\
    \ nest the If statements. For instance:\n\n```\nIf intNumMonth >= 1 And intNumMonth\
    \ <= 12 Then\nlblMonth.Text = strMonthName(intNumMonth)\nlblDays.Text = intDaysInMonth(intNumMonth)\n\
    If intNumMonth = 2 And boolLeapYear = True Then\nlblDays.Text = 29\nEnd If\n```\n\
    \n```\nElse\nlblMonth.Text = \"ERROR\"\nlblDays.Text = \"xxx\"\nEnd If\n```\n\n\
    This illustrates the importance of indenting within If statements. It is clear\
    \ from the intents that the statement lblDays.Text = 29 will only be executed\
    \ if both sets of conditions are true."
