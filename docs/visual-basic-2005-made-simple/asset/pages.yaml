  md: '# Dates and times


    The DateTime structure holds a floating-point number that represents a combined
    date and time. The integer part of the number returns the date, representing the
    number of days since 30-Dec-1899. Therefore 1 represents 31-Dec-1899, 2 is 1-Jan-1900
    and 36526 is 1-Jan-2000. Negative numbers give you dates before 30-Dec-1899. (The
    3526 dates are accurate back to 1752, the Gregorian calendar was introduced but
    theoretically go back as far as 1-Jan-0001.)


    ```

    Take note

    This is the system that is used on Excel and other spreadsheet programs. However,
    some versions of Excel are inaccurate for dates before 1-Mar-1900 and will produce
    different results to Visual Basic.

    Excel and Lotus do not allow negative dates. Excel 95 stops at 31-Dec-2078 (65380)
    while Lotus continues to 31-Dec-2099 (73050); dates in Visual Basic and later
    versions of Excel go on the year 9999.

    ```


    The decimal part of the date/value represents the time as a proportion of the
    day. For instance, 6 a.m. is represented by 0.25, midday is 0.5 and midnight is
    0.

    The combination of the two numbers gives a complete date and time; so 36526.25
    represents 1-Jan-2000 6 a.m.


    You can define a variable as being of type DateTime, in which the case properties
    and methods of the structure are available to you.


    For example, the Day, Month and Year properties extract appropriate values from
    a date/time value. Similarly, Hour, Minute, Second and Millisecond extract the
    relevant times.


    Date returns the just part of the value, while TimeOfDay gives you the time portion.
    DayOfWeek returns a number representing the day of the week (by default, 1 for
    Sunday, 2 for Monday etc.) and DayOfYear gives the day number as measured from
    1st January. WeekdayName converts the day week to the corresponding string.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Time spans


    You can use the TimeSpan structure for days and times; variables of this type
    are used to represent time intervals (in terms of days and parts of a day). Thus
    a TimeSpan variable can hold the number of days between two dates or the time
    that has elapsed since a specific date/time value.


    The properties for the TimeSpan structure includes Days, Hours, Minutes, Seconds
    and Milliseconds; these return the number of whole days, hours etc. included in
    the TimeSpan value. The TotalDays returns the number of days as a decimal value,
    TotalHours gives the total number of hours (and parts of an hour), and so on.


    # Currenttime


    The DateTime structure, the Today property returns a date/time value representing
    the current system date; Now returns a value representing both date and time.
    Today and Now are expressed as properties of the general DateTime class, rather
    than specific date/time variables: i.e. DateTime.Today and DateTime.Now.


    To convert the current time, use DateTime.Now.OfDay. You can convert this value
    to a string using the ToString method.


    # Date and time methods


    The DateTime structure has a number of methods that let you manipulate date/time
    values. For example, the Add method adds a TimeSpan value, AddYears adds a specific
    number of years and there are similar methods for the other time units. The Subtract
    method subtracts either a DateTime or a TimeSpan value.


    The Compare method returns the difference (in days) between two specified DateTime
    values. The DaysInMonth method returns the number of days in the month for the
    specified DateTime value and IsLeYear returns a True or False to tell you whether
    the DateTime value falls in a leap year.


    The TimeSpan structure also has Add, Subtract and Compare methods.


    > Take note

    There are a large number of options when dealing with dates and times; full details
    of all the functions are given in the on-line help.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_143_0.png)'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Visual Basic dates and times


    The DateTime structure is part of the .NET framework. Visual Basic includes an
    equivalent Date data type. Variables of this type represent a date and time in
    the same way as DateTime variables.


    There are several Visual Basic functions for manipulating such dates:


    +   * DateAdd adds a specific value to part of a date.

    * DateDiff returns the difference between two dates (for a specific part of)

    * DatePart returns just one unit (days, hours, etc.) from the date.

    * Format returns the date as the string with a specified layout.


    For full details of these functions, see the on-line help.


    # Date/time conversions


    DateTime converts a string to a date value; for example, DateValue("31 Dec, 2005")
    returns the date ''31/12/05''. Similarly, TimeValue converts a string to a time
    value; for instance, TimeValue("6:00 PM") and TimeValue("18:00") both return the
    time ''18:00:00''.


    In both cases, the functions return date/time variables. If you display these
    in text boxes, their string representations are shown. However, in calculations
    they are treated as numbers.


    DateSerial and TimeSerial return similar values but take three arguments: year,
    month and day for DateSerial, or hour, minute and second for TimeSerial. To get
    the same values as the examples above you could use DateSerial(2005, 12, 31) and
    TimeSerial(18, 0, 0).


    Use DateValue and TimeValue when dealing with text entered by the user or derived
    from some other source; use DateSerial and TimeSerial where the separate date/time
    components are available.


    The following program converts a date/time value to real date and gives the day
    of the week; it also calculates the date/time value for a real date and adds or
    subtracts a given number of days to give a second date.'
