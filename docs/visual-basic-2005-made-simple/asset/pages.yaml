- img_proc: true
  md: '# # Numeric functions


    Visual Basic incorporates a number of built-in functions. These are routines that
    carry out specific operations on one or more values and return a result.


    The values supplied to a function are called arguments and are enclosed in brackets,
    following the function name. Multiple arguments are separated by commas. (If you
    do not put spaces after the comma, Visual Studio will insert them for you.)


    Each argument can be a specific value or an expression. For example, the Int function
    returns the integer part of a floating-number:


    ```

    intLengthMetres = Int(decTotalLength)

    intNearestInt = Int(sngX + 0.5)

    ```


    In the first example, the value of decTotalLength is rounded down to the nearest
    whole number, with the answer stored in intLengthMetres. In the second case, the
    argument is an expression and has the effect of rounding sngX to the nearest number.
    The Fix function truncates the value. This produces the same effect as Int for
    positive numbers; the value is rounded up.


    # # Mathematical functions


    Visual Basic provides many numeric functions as part of the Math class, including:


    | Abs | Absolute (positive value) |

    | Sign | Sign of value (returns 1 if positive, -1 if negative and 0 if negative)
    |

    | Round | Rounds to nearest whole number |

    | Min | Smaller of two numbers |

    | Max | Larger of two numbers |

    | Sqrt | Square root |

    | Log | Natural logarithm |

    | Exp | Exponential value |

    | Sin | Sine of angle in radians |

    | Cos | Cosine of angle in radians |

    | Tan | Tangent of angle in radians |

    | Atan | Arctangent (angle whose tangent is given) |


    > Take note In VB6, the Sign, Sqrt and Atan functions appear as Sgn, Sqr and Atn
    respectively.'
  merge: -1
