  md: '# Toolbox window


    Any window contains a number of different objects: buttons, text boxes, labels
    and so on. These are called **controls**. When you are creating a window within
    Visual Studio, these controls can be added by dragging them from the Toolbox window.
    The Pointer object at the top of the toolbox is for selecting existing controls
    so that they can be moved, resized or changed in some other way.


    Title bar: when docked, drag to move toolbox to new position


    The toolbox controls are described in detail in Chapter 3.


    Common controls (collection of controls)


    Start by making the toolbox into a docked window by placing the cursor over the
    Toolbox button and then clicking on the (Auto Hide) button.


    Pointer: select existing controls


    The controls are divided into a number of categories (Common Controls, Containers
    etc.) Click on the button next to a category to display its contents; click on
    it to hide them again.


    Standard controls


    ![](img/dd2d93f16b3cb78149c4221e4752898b_21_0.png)


    Toolbox


    Other controls -


    Show contents


    > Take note


    The controls included in the toolbox depend on the version of Visual Basic you
    are using.


    There are no other controls in this group. Drag them onto this text to add it
    to the button.


    13'
  merge: -1
