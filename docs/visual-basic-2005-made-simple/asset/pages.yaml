  md: '# File operations


    Within a program, you may want to delete, rename or copy a file, or carry out
    directory operations. The file actions can be carried out using methods from the
    System.IO.File class:


    +   * The **Delete(filespec)** method deletes a file.

    The filespec is a string containing the name of the file to be deleted. You may
    use the * and wildcards (e.g. *.TMP to delete all TMP files).

    * The **Copy(source, destination, overwrite)** method copies a file.

    The source is a string containing the name of the file to be copied. The destination
    is the name of the new file. Both filenames may include the directory and drive
    if necessary. Only one file can be copied at a time. If overwrite is True the
    destination file will be overwritten if it already exists.

    * The **Move(source, destination)** method moves or renames a file. The source
    is the specification of the file to be moved, the destination is its new location
    and filename. If the source and destination are in different folders the file
    will be moved (and its name changed, if but a different filename is given, the
    file will be renamed.

    * The **Exists(filespec)** method returns a value of True if the file exists,
    otherwise False.


    The procedures below demonstrate the use of these methods. The buttons and procedures
    can be added to the File Viewer program, allowing you to select a folder and then
    copy, rename or delete any of the files. To be really useful, you should add error-checking
    code to ensure that new filenames are valid.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_257_0.png)


