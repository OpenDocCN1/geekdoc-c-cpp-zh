  md: '# Logical operators


    You can combine conditions with the following **logical operators:**


    +   - And Both conditions must be true for the combined condition to be true

    - Or One (or both) of the conditions must be true

    - X One of the conditions must be true but not both (Exclusive Or)


    The two sets of conditions can be either numeric or text, independently of each
    other.


    For example:


    ```

    intDaysFeb = 28

    If intNumMonth = 2 And boolLeapYear = True Then

    intDaysFeb = 29

    ```


    In this case, if intNumMonth is not equal to 2 or boolLeapYear is ''False'', the
    value of DaysInFeb would remain at 28. If both conditions are true (intNumMonth
    equals 2 and boolLeapYear has a ''True'' value) the If statement is executed and
    the value of intDaysFeb is changed to 29.


    You can also negate a condition by putting **Not** in front of it. The Not operator
    is applied first, followed by the other logical operators in the order given above
    (for example, And and operators are implemented before Or).


    > ### Tip

    Using brackets, you can combine as many conditions as you like into a single If
    statement. However, to avoid any possibility of confusion, it is better to break
    up complex conditions using brackets or split them into a series of related If
    statements.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_170_0.png)'
  merge: -1
  pgno: 170
