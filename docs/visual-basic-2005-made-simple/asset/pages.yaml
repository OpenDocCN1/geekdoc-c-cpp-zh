  md: '# Sequential files


    Sequential files consist of a series of lines of text, and are often referred
    to as ASCII files. Each line of text is terminated by a carriage-return character
    (ASCII 13) and the file ends with Ctrl-Z (ASCII 26). Although ASCII files can
    include extended ASCII characters, they are usually restricted to the standard
    characters, in the range 32 to 126. Sequential files are stored with one byte
    for each character and can be viewed, edited or created by Notepad or other text
    editors.


    Visual Basic provides a group of instructions for handling sequential files. At
    their simplest, sequential files are written or read one complete line at a time
    (a line consisting of everything up to the next carriage-return character). Therefore,
    they are suitable for storing text: for example, the output from a multi-line
    text box.


    Sequential files can also be saved in comma-delimited format. Each line consists
    of one or more data values, separated by commas. Text items should be enclosed
    in double quotes. When a line of data is read from a sequential file, each value
    is assigned to a variable.


    # Text file (ASCII)


    # Comma-delimited file


    | First joined December, 1997 |

    | Originally Associate |

    | Became Full member January, |


    | "Jim Smith", 1023, "Full", 20, "South" |

    |Jo Edwards", 1036, "Full", 20, "East" |

    |Ellen Howe", 1045, "Associate", 12, "South" |


    ![](img/dd2d93f16b3cb78149c4221e4752898b_267_0.png)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_267_1.png)


    You cannot both read and write to a sequential file at the same time. Each time
    you open a file it is for either reading or writing.


    Text in comma-delimited files does not have to be enclosed in quotes but is less
    confusing if it is. If the text contains a comma, double quotes must be used around
    the item containing the comma, otherwise it will be treated as two separate items.


    259'
