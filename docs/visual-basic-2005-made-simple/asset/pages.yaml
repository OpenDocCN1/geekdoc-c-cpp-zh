- img_proc: true
  md: '# Expressions


    Values are assigned to variables using **expressions**. Such statements take the
    form:


    ```

    variable = expression

    ```


    The expression can be either a specific value or a combination of variables and
    values, linked together by **operators**. For example:


    ```

    intStartPos = 5

    intEndPos = intStartPos + 37

    ```


    In the first case, the variable intStartPos is given an explicit value of 5. In
    the second case, 37 is added to the value of intStartPos and the result is stored
    in intEndPos; if intStartPos is 5, intEndPos will be 42. The value of the variable
    on the left of the expression is always changed by the statement; any variables
    in the expression itself are never changed.


    Variables can also refer to themselves, as in this example:


    ```

    intStock = 32

    intCurrentStock = intCurrentStock + intStock

    ```


    The value of intStock (32) is added to the existing value of intCurrentStock.
    So, if intCurrentStock was originally 68, its value is now 100.


    This statement can be abbreviated using ''+='':


    ```

    intCurrentStock += intStock

    ```


    The effect is same as before, increasing the value of intCurrentStock by the value
    of intStock.


    You can do the same thing with the other arithmetic symbols; for example, ''*=''
    to multiply the variable on the left by the amount on the right.


    > Take note

    When declaring variables, you can put several variables of the same type on a
    single line (as demonstrated on the previous page).'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Numericoperators


    For numeric expressions, you can combine variables and values using the following
    operators:


    +   - Raising to the power (e.g. 5 ^ 2 is 5 squared, or 25)

    - Multiplication (e.g. 6 * 7 is 42)

    - Division (e.g. 14 / 5 is 2.8)

    - Integer division (e.g. 14\ 5 is 2)


    Mod Remainder (e.g. 14 Mod 5 is 4)


    +   - Addition

    - Subtraction


    Where an expression contains more than one operator, the calculation is not done
    from left to right but according to the following **order of precedence:**


    +   - Raising to the power

    - Negation (when the operator starts the expression; e.g. -2)

    - Multiplication and division

    - Integer division


    Mod Remainder


    +   - Addition and subtraction


    For example:


    137 - 6 ^ 2 * 3 = 137 - 36 * 3 = 137 - 108 = 29


    However, to avoid confusion, it is better to use brackets.


    > Take note

    For very large or very small numbers, values are displayed in exponential form,
    n.nn±pp where n.nn is in the range 1.00 to 9.99 and pp is a power of ten; e.g.
    8,750 is represented by 8.75E+03 (i.e. 8.75 x 1000) and 0.000875 is 8.75E−04 (i.e.
    8.75 / 10,000).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_129_0.png)


    121'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Brackets


    Inserting brackets in an expression changes the order of calculation. Anything
    inside a pair of brackets is calculated first. Brackets must always be in matching
    pairs. Use only round brackets ( ), square brackets [] or braces {}.


    If brackets are nested – one pair another – the calculations start with the innermost
    pair of brackets and work outwards. For example:


    ```

    8 + (3 * (10 / 2)) ^ 2

    = 8 + (3 * 2) ^ 2

    = 8 + 6 ^ 2

    = 44

    ```


    However, it is usually better to split complex expressions over two or more lines.

    The following program demonstrates the use of some simple expressions.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_130_0.png)


    Calculate amounts


    Close window and exit


    Set by frmVAT_Load


    Calculated by btnCalculate_Click'
