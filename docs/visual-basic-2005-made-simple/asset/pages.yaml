- img_proc: true
  md: '# Object-oriented programming


    In a very short time, you have built a fully functioning Windows application –
    something that would take you many weeks to accomplish if you had to do it from
    scratch. This has all been achieved with the object-oriented programming structures
    that under Visual Basic. This section gives a very brief introduction to object-oriented
    programming (OOP).


    # Objects and their use


    In traditional programming systems, a program consists of a linear series of instructions,
    through which control flows in an ordered and predictable manner; data is stored
    separately from object. Object-oriented programs, on the other hand, have a much
    looser structure, in which programs and data are bound together in independent
    units and control lies freely in the hands of the user.


    The windows in your application and their components–buttons, labels, scroll bars,
    menus etc. – are all objects. An object is self-contained; it comprises both the
    procedures to perform its tasks and the data that these procedures need. In a
    process called encapsulation, the procedures and data are insulated from the rest
    of the program. There should be no danger of control jumping unexpectedly from
    one object''s procedures into the middle of that another; nor it be possible for
    one object to inadvertently change the data belonging to another object.


    Information – data and instructions – is passed between objects in the form of
    messages. For instance, when a button is clicked, Windows sends a particular message
    to the button object. The button-click procedure is executed and another message
    is sent back to you that the action has been processed.


    All objects of the same type come from the same class. The class defines the procedures
    and data for the object. Visual Basic uses a set of related classes called the
    .NET Framework Library and all objects in your programs will be derived from one
    of these. This library is made up of a number of namespaces. Each namespace contains
    a collection of classes.


    For instance, all buttons come from a class called Button in the System.Windows
    Forms namespace. The class is a template for objects of that type; individual
    objects are created as instances of that class.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'Take note

    You find out more about any of these classes by searching for the class name in
    the on-line help. To see the full class hierarchy, search for ''System.Windows.Forms
    namespace''. Full details of the hierarchy can be found in the MSDN help at .NET
    Developer/.NET Framework SDK/.NET Framework/Reference/Class Library/System.Windows.Forms.'
