  md: '# Dealing with errors


    Various errors may occur while you are creating procedures and running the application.


    If you make a mistake while typing one of the program statements, so that Visual
    Studio cannot interpret it, the offending text will be marked with a wavy blue
    line. This may be because you have typed something incorrectly, referred to something
    that has not yet been defined or tried to use an invalid object, method or property.
    You can either make a correction - or if you want to leave it as it is for the
    moment - just move out of the line. In this way, many of your errors will be picked
    up as soon as you move the line; you will discover many of the errors in your
    code.


    Error while typing an instruction


