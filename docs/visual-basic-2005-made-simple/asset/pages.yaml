- img_proc: true
  md: '# Breakpoints


    You can force Visual Basic to halt execution at a particular point in the program
    by setting a breakpoint. Put the cursor on the required line and press [F9]; alternatively,
    click on the grey area to the left of the line or right-click on the line and
    select Insert Breakpoint.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_217_0.png)


    The line is shown with a red background and a circle is displayed in the grey
    area. When the program is run, it will halt at this point, before the line is
    executed.


    Having interrupted the program in this way, you can inspect the contents of variables,
    step through the code at a time, make minor changes to the code, or continue execution
    by pressing [F5].


    You can set several breakpoints at once; the program halts each time a breakpoint
    is encountered. A breakpoint can be cancelled by clicking on the breakpoint line
    and pressing [F9] again; all breakpoints can be cancelled with Debug|Delete All
    Breakpoints.


    > Take note

    You can also break into a program by pressing [Ctrl-Break] or by switching to
    the Code Window and selecting Debug|Break All.


    209'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'Alternatively, you can temporarily deactivate a breakpoint by right-clicking
    on it and selecting Breakpoint!Disable Breakpoint; the Enable Breakpoint command
    restores- the disabled breakpoint.


    # Single-stepping


    When a program halts because of an error or a breakpoint, the line that is about
    to be executed is highlighted in yellow and a yellow arrow appears on the left-hand
    side of the current line.


    Breakpoint


    ![](img/dd2d93f16b3cb78149c4221e4752898b_218_0.png)


    Line about to be executed


    You can now run the line at a time using with the following options:


    +   - Press [F8] (DebugStep Into) to execute the line; if the line contains a
    procedure or a function, the procedure is displayed and you can continue to step
    through it a line at a time. This is called single-stepping.

    - Press [Shift-F8] (DebugStep Over) to execute the line, including any procedure
    or function call; the next line in the current procedure is then highlighted.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '+   Press [Ctrl-Shift-F8] (Debug|Step Out) to finish running the current procedure
    or function and then continue execution until control returns to the procedure
    or function.


    +   Move the cursor to some other point in the program, right-click and select
    Run To Cursor; execution restarts and continues until this point is reached.


    When you have finished single-stepping, you can use the Debug options either to
    continue or to end the program.


    # Breakpointoptions


    There are several ways in which you can make more sophisticated use of a breakpoint,
    rather than stopping the program every time the breakpoint is reached. Note that
    these options apply to Visual Basic .NET and Visual Basic 2005 Standard Edition
    and Professional Edition; the breakpoint options are not available in the Expression
    Edition.


    Right-click on a breakpoint and select Breakpoint Properties to display a dialog
    containing the breakpoint options.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_219_0.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'The Breakpoint Properties dialog shows you, on the File tab, the line at which
    the break occurs. (As an alternative, you can set the breakpoint in terms of its
    position within a particular function or at a specific memory address.)


    Click on the Condition button to set a condition that must be satisfied for a
    break to occur. For example, you may specify that a variable must equal a particular
    value or that one expression must be larger than another. This is useful if a
    program is only going wrong when particular values are encountered.


    Breakpoint condition: break

    when condition is true


    ![](img/dd2d93f16b3cb78149c4221e4752898b_220_0.png)


    Alternatively, you can enter an expression and specify that the break should occur
    only when the value of the expression changes. This is a useful option if you
    are trying to detect the point at which some limit is reached or the status of
    a variable changes.


    Breakpoint condition: break

    when value has changed


    ![](img/dd2d93f16b3cb78149c4221e4752898b_220_1.png)'
  merge: -1
