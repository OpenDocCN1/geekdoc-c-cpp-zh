- img_proc: true
  md: 'Finally, you can specify the break occurs when the breakpoint has been reached
    a specific number of times. For example, you may want to execute a For...Next
    loop until the last time through, in which case you would specify one less the
    final value of the loop counter.


    Click on Hit Count and choose from the following options:


    +   - Break every time the breakpoint is reached (the default)

    - Break after a specific number of ''hits''

    - Break when the hit count is a multiple of a specified number (for example, break
    every fifth time through a loop).


    Hit Count condition: break when the hit count is a multiple of 5


    ![](img/dd2d93f16b3cb78149c4221e4752898b_221_0.png)


    +   - Break every time after the hit count has reached a specific number.


    These options allow you to set up the most efficient way for reaching a particular
    point in the program. For example, you may want to break when a particular piece
    of data has been read from a file or after you have been through a loop a specific
    number of times.'
  merge: -1
