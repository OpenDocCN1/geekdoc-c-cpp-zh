  md: '# # Arrays


    When handling many values or strings, the use of simple variables can be rather
    cumbersome. For instance, if you want to hold the values to fill a large list
    box you do not want a separate variable for each item, nor do you want a separate
    statement for adding each item to the list. You can overcome these problems by
    the use of arrays.


    An **array** is a set of variables, represented by a single name. The individual
    values are called **elements** and are identified by **index numbers**. The index
    number is given in brackets after the name. The first index number is always 0.


    For example, the array MonthDays could hold the number of days in the month; MonthDays(1)
    would hold the number of days in January, MonthDays(2) is for February and so
    on to MonthDays(12), which would represent the number of days in December.


    Arrays are declared in the same way as variables. You must declare the type of
    the array and, within the brackets, specify the largest index number. For example:


    ```

    Dim MonthDays(12) As Integer

    ```


    This statement declares an array of 13 elements (numbered from 0 to 12), each
    of which can hold an integer value.


    An array may have more than one **dimension**. For example:


    ```

    Dim MaxTemp(12, 31) As Single

    ```


    Each possible combination of the two index numbers identifies a different element.
    In this case there are 416 single-precision values in the array, which can be
    used for storing the maximum temperature in each day of the year. For instance,
    MaxTemp(4, 17) would hold the value for 17 April. Some elements, such as MaxTemp(11,
    31) and all with an index number of 0, will never be used.


    Arrays consume a considerable amount of memory. To save space, you may need to
    calculate the index number from a ''real-world'' number. For example, an AnnualSales
    array may be set up to hold a value for each year from 1980 to 2009:


    ```

    Dim AnnualSales(29) As Double

    ```


    If the variable intCurrentYear holds a year, the corresponding array value can
    be derived from AnnualSales(intCurrentYear – 1980).


    140'
