  md: '# Control arrays


    Visual Basic allows you to create control arrays, providing you with the ability
    to place a number of similar contols on a form. The array is set up and manipulated
    from within the program, so that you can decide how many controls to add at run.
    By using the array, you can change the properties of individual controls as needed;
    since all the controls share the same name, all you need to know is the index
    number for a particular control in order to change its properties.


    The code for handling such an array is spread throughout the application:


    +   - The creation and manipulation of the controls is handled by a new class
    (which is created as a Visual Basic program within the project).


    +   - The controls are added to the form by inserting the relevant code in the
    form’s procedures; this code calls the methods that are part of the new class.


    +   - You need to keep track of the controls; the variables that do this must
    be available to both the form’s procedures and the new class’s methods. Therefore,
    these variables must be held in a separate code module.


    The example generates a very simple form containing a set of numbered buttons.
    Also included on the form are standard buttons that allow you to delete or move
    a selected button, and add further numbered buttons. By itself, this is not a
    useful program but the code can be copied and amended in other applications, letting
    you perform a wide range of control-based operations.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_200_0.png)'
