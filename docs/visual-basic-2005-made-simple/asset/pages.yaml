  md: "# Structured error handling\n\nThe On Error method of error trapping described\
    \ above provides an unstructured approach. When an error occurs, control jumps\
    \ to the end of the procedure; after dealing with the error, control returns to\
    \ a point higher up the procedure. As an alternative, you can use use the Try...Catch...Finally\
    \ group of statements to provide structured error-handling.\n\nThe statements\
    \ take the following form:\n\n```\nTry\n  'Statements that may cause an error\n\
    \  Catch condition1\n    'Statements to be executed when condition1 is satisfied\n\
    \  Catch condition2\n    'Statements to be executed when condition2 is satisfied\n\
    \  ...\n  Finally\n    Tidying-up statements\nEnd Try\n```\n\nThe statements that\
    \ may cause an error are placed immediately below the Try statement. The conditions\
    \ are tests for various errors that may occur. If an error occurs in the Try section\
    \ control moves down to the first Catch statement that satisfies the error condition\
    \ (if any) and the code within that block is executed. The code below the Finally\
    \ statement is always executed, regardless of whether there is an error or not.\
    \ Therefore this is a good place to sort out any potential problems: deleting\
    \ unwanted objects, closing files, freeing up memory.\n\nUsing the previous example,\
    \ the On Error statements can be replaced by a much simpler Try...Catch structure.\
    \ In this procedure, the only statement to cause an error is the line that converts\
    \ the input text to a date value. The only possible error is error 13, Type Mismatch.\n\
    \nTherefore there is just one statement in the Try section and there is only one\
    \ Catch statement; the code within the Catch block deals with the error in exactly\
    \ the same way as for the On Error method. There is no tidying to be done, so\
    \ the Finally block is omitted."
  merge: -1
  pgno: 228
- img_proc: true
