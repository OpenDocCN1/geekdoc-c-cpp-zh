  md: '# Solution Explorerwindow


    For each window in your final application there is a corresponding Visual Basic
    form, and each form has its own file on disk. Usually, there is at least one file
    containing the program code for the application and, if your forms use any third
    party tools, these will be held in additional files. Finally, there are a number
    of files used by the system. All these files go together to make up the project
    from which a distributable program is compiled.


    For large applications, you may have several projects, forming a solution.


    The Solution Explorer window lists the projects that make up the solution and
    the files in each project. The files are listed in a tree structure, similar to
    that used for Windows Explorer.


    You can add existing files to a project or remove files. A file can be part of
    more than one project; for example, you may use the same window in two independent
    applications. Files can be removed from a project if they are no longer required.


    At this stage, the Solution Explorer contains just one project (My Project) and
    the file for Form1.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_22_0.png)


    > Click to show project properties


    > Details for highlighted shown in Properties window below


    > Take note


    The Solution Explorer replaces the Project Explorer from previous versions of
    Visual Basic.


    Click for Solution Explorer


    Click to show Data Sources window'
  merge: -1
