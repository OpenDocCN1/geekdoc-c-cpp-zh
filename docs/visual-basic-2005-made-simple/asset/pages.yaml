  md: '# Random access files


    **Random access files** store data in a record-based format. The file consists
    of a number of records, each of which has the same size and layout. The advantage
    over sequential files is that you can read and write records in any order; records
    are accessed by specifying a record number. However, random access files are not
    suitable for variable-length data.


    # Record structure


    You must define the structure of the records before attempting to read or write
    them. This is done with a **Structure** declaration, which has the following form:


    ```

    Structure recordtype

    Public variable1 As type1

    Public variable2 As type2

    ...

    End Structure

    ```


    Any string variables must be given an explicit length by declaring them as follows:

    <VBFixedString(length)> Public variable As String

    <VBFixedString(40)> Public CompanyName As String


    For example:

    This allows you to store a company name of up to 40 characters. If the string
    is shorter than the specified length, it is padded with spaces; if it is longer,
    the string is truncated.


    The Structure statement is usually included in the Declarations section of the
    file or module.


    # Accessing records


    Records are read or written in three stages: opening the file; reading or writing
    the data; and closing the file.


    **The FileOpen** statement has the following format:


    ```

    FileOpen(number, filename, OpenMode.Random, , recordlength)

    ```


    The easiest way to calculate the *recordlength* is using the **Len** function,
    whose argument is a record variable of the record type defined in the Structure
    statement.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'Once opened, you can both write to and read from the file; you do not need
    to close

    the file in between the writing and reading operations.


    To write records, you must first declare a variable of the record type previously

    defined. This will be in the format:


    ```

    Dim recordvariable As recordtype

    ```


    You must then fill the record by assigning values to the individual variables,
    using

    statements in the format:


    ```

    recordvariable.variable = expression

    ```


    A completed record is written with a FilePut statement, as follows:


    ```

    FilePut(number, recordvariable, recordnumber)

    ```


    The recordnumber starts at 1 for the first record. If the number is beyond the
    current

    -of-file, the file is extended. (Unused records will contain rubbish unless

    specially cleared.)


    Data is read from the file using a FileGet statement, as follows:


    ```

    FileGet(number, recordvariable, recordnumber)

    ```


    The individual variables in the recordvariable are filled with the corresponding

    data from the record. Close the file with FileClose, as before.


    The procedures below provide alternative File operations for the Calendar

    program, time storing the data in a random access file.




    Take note

    The EOF, LOC and LOF functions can be used

    with random access files. EOF is of little

    use, since you are not usually reading a file

    from beginning to end. LOF gives the length

    of the file in bytes. LOC returns the number

    of the last record read or written.


    Tip

    You can calculate the number of

    records in a random access file by

    dividing LOF by the record length.

    to get the record length, use LEN

    with the record variable as its

    argument.


    # 267'
