  md: '# Watching variables


    Having broken into a program, you can inspect the values of any variables or expressions.
    If you put the cursor on a variable name in the code, the current value pops up
    below the name.


    You can also see how the value changes as the program progresses. Click on a variable
    name or highlight an expression in the code; then right-click and select Add Watch.
    The Watch window is displayed. This shows the expression and its current value.
    Each time you use Add Watch, another expression is added to the Watch window.
    Now, as you-step through the program, you will be able to see the values of variables
    are affected by the code, making it much easier to identify the causes of problems.


    Click to calculate expression


    | Name | Value | Type |

    |---|---|---||

    | toNumber | 1 Because this evaluation could cause side effects, it will not be
    executed until user | Int |

    | dayOfWeek | Monday | String |


    Drag the dividers between the column headers to change the widths of the columns
    in the Watch window.


    To remove an expression from the Watch window, right-click on it and select Delete
    Watch.


    If you only want to check the value of an expression once, mark the expression,
    right-click and select Quick Watch. The Quick:Watch dialog shows the current value
    of the expression. You can add this expression to the list in the Watch window
    by clicking on Add Watch. Alternatively, select another recently-watched expression
    from the drop-list and click on Recalculate to see its current value.


    > Take note: Whenever the value changes in the Watch window it is highlighted
    in red until the next statement is executed.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_223_0.png)


    215'
