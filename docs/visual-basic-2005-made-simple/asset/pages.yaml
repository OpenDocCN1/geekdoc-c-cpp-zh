  md: '# Scroll bars and progress bars


    Scroll bars (HScrollBar and VScrollBar) frequently appear on text boxes but you
    can also add them in other places. They can be added on their own (for instance,
    to indicate the progress of some activity or as an alternative data entry method),
    though standalone scroll bars tend to look rather peculiar. Usually, they can
    be attached to the edge of windows (for instance, one displaying part of a bitmap).
    In such cases, the properties are usually set while the program is running.


    The Minimum and Maximum properties give the limits of the values that can be represented
    by the scroll bar; the Value represents the current position of the button on
    the scroll bar, as a proportion of the distance from one end of the scroll bar
    to the other. For instance, suppose that Minimum is 100 and Maximum is 200. When
    the button is at the top (or left) of the scroll bar, the Value is 100; when at
    the other end, the Value is 200; and in the middle of the bar, the Value is 150.


    SmallChange specifies the amount by which Value will change when an arrow at the
    end of the scroll bar is clicked; LargeChange gives the change in Value when the
    bar itself is clicked (between an arrow and the scroll button).


    In the illustration below, two procedures are used: the first sets the Text value
    of the text box to the scroll bar when it is adjusted; the second revises the
    scroll bar Value when the scroll bar is adjusted (and hence the position of the
    button on the scroll bar) when the Text in the text box is changed. Information
    on procedures is given in Chapter 4.


    +   - Click to decrease

    Value by SmallChange

