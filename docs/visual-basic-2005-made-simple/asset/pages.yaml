- img_proc: true
  md: "# The event-led environment\n\nIn traditional programming languages, the programmer\
    \ is in complete control while the program is running. The program consists of\
    \ a linear sequence of coded instructions, with branches to particular points\
    \ in the program. At each stage of the program, the user is offered a limited\
    \ number of options and the program branches to the relevant section of code,\
    \ according to the choice that has been made. If the code has been written correctly,\
    \ there should be no surprises.\n\n\r\nr\nWindows programming languages, such\
    \ as Visual Basic, start from a very different viewpoint. At any one time there\
    \ will be many objects on the screen: windows, buttons, text boxes and so on.\
    \ The user is free to click, draw or type on any object and, in most circumstances,\
    \ is not constrained to follow a linear path through a fixed sequence of actions.\n\
    \n\\**Event-led** environment requires the programmer to take a completely new\
    \ approach. Rather than confines the user to a limited number of actions, the\
    \ programmer must create an application that reacts correctly to whatever the\
    \ user does. This is not as daunting as it sounds; there are, of, ways of limiting\
    \ the user's scope (for example, making forms and controls invisible or greying\
    \ out check boxes) but the simplest action is to do nothing\n\nForm name\n\nObject\
    \ name\n\nEvent\n\nCode\nwindow\n\n![](img/dd2d93f16b3cb78149c4221e4752898b_88_0.png)\n\
    \nProcedure\nobject/event\n(see page 85)\n\n80"
  merge: -1
  pgno: 88
- img_proc: true
  md: 'For each object on the screen there are a number of possible events. Some of
    these are generated by the user: for instance, clicking or double-clicking the
    mouse-button, dragging an object across the screen or pressing a key. Others arise
    as a result of some other event occurring in the system: for example, a window
    opening or closing, a control getting or losing the focus, or the system time
    reaching some predefined value. You can also force an event to occur by including
    suitable instructions in your program.


    The code to respond to these events is contained in Visual Basic procedures. For
    any object, there is a procedure for each possible event; initially every procedure
    is empty, so nothing happens when the event occurs. Theoretically, you could create
    a procedure for every event but in practice you will only fill in the procedures
    for those events that are of interest.


    For example, a button''s events include being clicked, and losing the focus, and
    the mouse button being pressed and released. However, you may only want to provide
    code for the Click event; any other events would be ignored.


    User clicks button


    ![](img/dd2d93f16b3cb78149c4221e4752898b_89_0.png)


    Windows changes appearance of button


    Programmer''s Click event is executed


