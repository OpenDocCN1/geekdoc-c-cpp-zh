  md: '# Preface


    Visual Basic has changed dramatically over the last few years, evolving from a
    beginners'' language to a fully-fledged object-oriented programming environment.
    Its structures are no longer simple to understand, particularly for those new
    to programming, but nevertheless it makes a good starting point for anyone who
    wants to develop sophisticated, effective software.


    Visual Basic 2005 provides a good introduction to Windows programming and can
    still be used to create Windows applications with the minimum of effort and time.
    Since an application''s windows are ''drawn'' on the screen, you can always see
    what the eventual application will look like, without having to guess. All of
    this is achieved without writing a line of code and, as a result, Visual Basic
    bypasses the long-winged trial-and-error approach to designing screen displays
    of the older programming languages.


    Creating the user interface is only the start, and there is a great deal of work
    to be done to complete an application. Even so, the Visual Basic 2005 programming
    language is powerful and, once mastered, even complex tasks can be finished surprisingly
    quickly.


    The latest version of Visual Basic is radically different to VB 6.0 and earlier
    versions. However, many of the principles are the same and can be applied well
    to any of the earlier versions of the product. Where there are significant variations
    between the versions, the differences are noted.


    This new edition of the book has been revised to cover the changes made in VB
    2005. There is also an additional chapter introducing Visual Basic''s facilities
    for creating classes.


    This book is aimed at those who are new to programming, or new to Visual Basic.
    No previous programming experience is necessary, though familiarity with the use
    of Windows is assumed. However, Visual Basic is a substantial programming language
    and, in a book of this size, it is only possible to give a brief introduction.
    Nevertheless, the information given here should be enough to start you on some
    interesting projects and to show what may be achieved with practice.


    # Acknowledgements


    I would like to thank Mike Cash of Elsevier for his assistance and patience, Natalia
    Żak for her hard work and dedication during the production of the book.'
  merge: -1
