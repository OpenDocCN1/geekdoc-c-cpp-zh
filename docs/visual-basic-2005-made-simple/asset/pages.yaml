- img_proc: true
  md: "# Trapping errors\n\nYou will have noticed that some of the programs you have\
    \ been writing crash if an invalid entry is made (for instance, if a text box\
    \ is supposed to contain a date is blank when a button is clicked). You can test\
    \ for some errors – and correct them using a control's LostFocus event. To be\
    \ sure of handling all errors, however, you should include error-trapping statements\
    \ in your code. These statements are activated when an error occurs.\n\nError-trapping\
    \ is implemented as follows:\n\n+   1 Turn error-trapping on with a statement\
    \ in the form:\n Error GoTo label\n When a tappable error occurs (the that On\
    \ Error Goto can handle), the program jumps to the code pointed by the label.\n\
    2 Identify the end of the normal part of the procedure with an Exit Sub statement\
    \ (just above End Sub).\n3 After Exit Sub, insert the label, adding a colon (:)\
    \ to the end of it.\n4 Following the label, insert the statements that will correct\
    \ the error (for instance, statements to display a warning message or change the\
    \ contents of a text box).\n5 End the error-handling statements with a Resume\
    \ statement (see below).\n6 If the Resume statement includes a label, insert the\
    \ label (with a colon) at the appropriate point in the procedure.\n\nThe Resume\
    \ statement must be one of the following:\n\n+   Resume Re-execute the statement\
    \ that caused the problem.\nResume Next Continue with the statement following\
    \ the one that caused the error.\nResume label2 Resume execution on the line following\
    \ label2.\n\nMost errors can be trapped, though only certain types of error are\
    \ likely to occur in any procedure.\n\nThe procedure below demonstrates the use\
    \ of error-trapping statements."
  merge: -1
  pgno: 224
- img_proc: true
  md: "# Errortrapping\n\n```\nPrivate Sub btnCalculate_Click(...)\nHandles btnCalculate_Click\n\
    Dim dteDateNumber, dteResultNumber As DateTime\nDim intNumberOfOfDays As Integer\n\
    Dim shoDayNumber As Short\nConst sp As String = \"Constants for creating strings\"\
    \nOn Error Goto BadDate\n\nErrorRestart:\n    Calculate date/time value\nteDateNumber\
    \ = DateValue(txtDateIn.Text)\nintNumberOfOfDays = dteDateNumber.ToADate\nextxtTime.Text\
    \ = intNumberOfOfDays\n\n    Calculate day of week\nshoDayNumber = dteDateNumber.DayOfWeek\n\
    extxtDayOnWeek.Text = WeekdayName(shoDayNumber) + 1,\n        FirstDayWeek.Sunday\n\
    \n    Calculate value for Result box\ndteResultNumber = dteNumber.AddDays(Val(txtAddDays.Text))\n\
    extxtResult.Text = dteResultNumber\n    Update date/time label\nlblNow.Text =\
    \ \"Date/time of last entry: \" &\nNow.ToLongString & sp & Now.ToLongTimeString\n\
    Exit Sub\n\nBadDate:\n    'This routine is invoked if any error occurs but at\n\
    \    'this stage handles only one type of error.\n    'Insert current date in\
    \ text box and then continue\nextxtDateIn.Text = Today\n    Jump back to start\
    \ of procedure\nEnd Sub\n```\n\nSample procedure taken from Date Conversions program\
    \ on pages 137-139.\n\n217"
  merge: -1
