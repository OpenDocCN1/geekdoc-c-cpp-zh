- img_proc: true
  md: 'The NumericUpDown control provides a way for the user to select a value in
    a range, where there is no necessity to change the value from within the program
    (though, of course, you can do so if you need to). The control consists of a box
    displaying a numeric value, with up and down arrows to the right. Clicking on
    the arrows increases or decreases the value.


    The control has Minimum, Maximum and Value properties, with Value usually determined
    by the user. The setting that you give to Value at the design stage is the number
    that is displayed initially.


    The DecimalPlaces property allows you to specify decimal values, with the Increment
    setting giving the amount by which the Value changes with each click of the arrows.
    For large numeric values you can specify that with a comma (or whatever character
    the thousands are separated from the last three digits) by a character (the user
    has selected on their Windows Regional Options).


    The size of the text (and hence height of the box) is determined by the Font property;
    you can set the Width to any value.


    If ReadOnly is False, the user can type a value in the text box (which has a white
    background); if True, the user cannot enter a value directly and the box is grey.


