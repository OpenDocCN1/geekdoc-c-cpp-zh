  md: '# Adding controls


    All windows have one or more controls. These are objects that display information
    or allow the user to perform an action: for instance, buttons, text boxes, option
    buttons and scroll bars.


    Any combination of controls can be placed on a form but you should remember that
    the application is run the user will be free to use the controls in any order
    (subject to any restrictions you impose at development time).


    For example, the message box that is displayed if you try to delete a form, in
    effect, four controls: two buttons (marked OK and Cancel), a label (containing
    the text of the message) and an image control (the icon). The program forces you
    to click on one of the buttons but it''s up to you which you. The action taken
    by the program depends on which button is clicked.(In fact, message boxes are
    created in a special way.)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_58_0.png)


    The toolbox


    Visual Studio supplies a standard number of controls for use on forms. These are
    represented by icons in the Toolbox. Controls can be added to a form in three
    ways:


    +   - Double-click on the control in the Toolbox to create an object of default
    size in the top left-hand corner of the form.

    - Click on the control and click on the form to create an object of default size
    at that point on the form.

    - Click on the control in the Toolbox, drag the pointer over the area of the form
    to be covered by the control.


    Whichever method you use, you can change the size and position later (See Control
    properties below). The standard controls are described from page 65 onwards.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_58_1.png)


    Double-click here...'
  merge: -1
