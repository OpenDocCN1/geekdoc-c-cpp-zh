    | Windows Form | Dialog | Explorer Form | MDI Parent Form | About Box | Login
    Form | Splash Screen | Class |

    |---|---|---|---|---|---|---|---|n| Module | Dataset | SQL Database | User Control
    | Text File |


    Enter filename for new file; VB extension will be added


    Click to create new form


    A blank form is displayed in a new tab, with the same default settings as the
    original Form 1. An entry for this form will have been added to the Solution Explorer
    window.


    The property settings for either form can be changed by clicking on the appropriate
    tab in the Visual Studio window and then changing the values in the Properties
    window.


    35'
