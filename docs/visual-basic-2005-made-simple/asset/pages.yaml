  md: '# # Timers


    The Timer control allows you to create programs in which events occur at particular
    times or after specific periods: for instance, clocks, reminder programs and programs
    that require a sequence of regular events. The previous example used a timer to
    change the graphics display every two or four seconds.


    The Timer control is added to the component tray; it has no visible element. There
    are two important properties:


    +   - The **Enabled** property is set to True when you want the timer to start
    running.

    - The **Interval** property specifies how frequently you want the timer event
    to be generated.


    The value for the Interval is given in milliseconds (so a value of 5000 would
    generate an event every 5 seconds). When the specified interval has elapsed the
    timer''s **Tick** event occurs and the timer starts counting again.


    The program below demonstrates the use of a timer for generating a reminder at
    by the user.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_289_0.png)


    Enter time at which reminder is to be displayed


    Cancel reminder after it has been set


    Switch on reminder


    Reminder message


    Acknowledge reminder'
