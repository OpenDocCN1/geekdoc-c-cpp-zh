  md: '# The MenuStrip control


    You can add a drop-down menu to a form using the MenuStrip control. Display the
    form to which you want to add a menu and double-click on the MenuStrip control
    in the Menus & Toolbars section of the toolbox. "Type Here" is added at the top
    of the form and the MenuStrip object is shown in an area below the form (called
    the component tray).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_232_0.png)


    MenuStrip control added to component tray


    > Take note

    This is one of a number of controls that are not physically displayed on the form
    but are shown in this special part of the Form window.


    224'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Adding options


    To add the first menu name to the menu system, click on the ''Type Here'' box
    and type the menu name. Include an & in front of the character that is to be used
    as an access key: this is the letter, when pressed in combination with [Alt],
    will invoke the menu. For example, type ''&File'' for a File menu that is accessed
    by pressing [Alt F].


    As you type the menu name, further ''Type Here'' boxes are added to the right
    below.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_233_0.png)


    Include & in front of access key


    When you press [Enter] or click away from the menu name the menu is displayed
    as it will appear on the form.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_233_1.png)


    225'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'Click on the ''Type Here'' box below the menu name to add the first menu option.
    Again, include an access key, if required. Further ''Type Here'' boxes are added
    the right and below.


    # Type menu name

    (including access

    key)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_234_0.png)


    You can now extend the menu system in every direction:


    +   - Add further options below the latest entry to extend the menu.

    - Add another menu by typing in the box to the right of the first menu name.

    - Add sub-menu options by typing on the right of an existing menu option.


    Add menu


    Add sub-menu option


    ![](img/dd2d93f16b3cb78149c4221e4752898b_234_1.png)


    226'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'As a general rule, you should give each menu, sub-menu and option an access
    key with no two menus or options in a menu having the same key. By convention,
    any option that leads to a dialog box should have three dots (...) at the end
    of its name. Options that lead to sub-menus will be given an arrow on the right
    of the name. You can edit any part of the menu by clicking on it.


    # Sub-menus


    Sub-menus are created by adding options at a second level of indent, so that the
    first-level option effectively becomes a sub-menu.


    The sub-menu options can themselves become a further level of sub-menu by indenting
    the next set of items to a third level. In all, you can have up to four levels
    of sub-menus, though it is unusual to go beyond the first sub-menu.


    Adding sub-menus


    ![](img/dd2d93f16b3cb78149c4221e4752898b_235_0.png)


    > Tip

    Don''t get too carried away with sub-menus. Keep the menu structure as simple
    as possible so that users can navigate with ease.


    227'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Separator bars


    For long menus, it is useful to split the options into groups. This is done by
    inserting a separator bar.


    To add a separator bar above a particular option, right-click on the option and
    select Insert!Separator. The bar can be moved around in the same way as any other
    menu item and right-clicking on it results in the same pop-up menu.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_236_0.png)


    # Editing the menus


    You can select any menu item by clicking on it. When an item is highlighted, you
    have the following options:


    +   - Click on the item again to edit the text.

    - Right-click and select Insert!MenuItem to add another option above the current
    option or another menu to the left of the selected menu.

    - Right-click and select Delete to remove the option or menu.

    - Drag an option up or down the list to change the order within the menu. You
    can also drag separator bars to new positions.

    - Drag a menu name to the left or right to change the order of the menus.

    - Use the Cut and Paste options from the pop-up menu to move any option, sub-menu
    or menu to another menu or to a point on the row of menu names to change its status.
    For example, you can make a sub-menu into a top-level menu or vice versa. Any
    options within a menu or sub-menu will follow it to the new location.


    228'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# # Menu properties


    Each menu, sub-menu and option within the menu system is a separate object, with
    its own set of properties. Separator bars are also independent objects, with their
    own properties.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_237_0.png)


    # # Menu item names


    Like all other objects, each menu item (whether it''s a menu name, sub-menu option
    or separator bar) has a unique name. By default, these names are allocated as
    the items created. However, to make life easier when coding menu events you should
    change these names to easier to handle. The convention is to give names consisting
    of ''mnu'' followed by the sequence of options (e.g. mnuFile for the File menu
    and mnuFileSave for the FileSave option).


    ![](img/dd2d93f16b3cb78149c4221e4752898b_237_1.png)


    229'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'You can change the Name for each individual item by clicking on the item and
    then editing the name in the Properties window. Alternatively, you can change
    all the names for a whole menu by right-clicking on any item and selecting Edit
    DropItems.The Items Collection Editor is displayed. Clicking on an item on the
    left results in the item''s properties being shown on the right.


    Click on each item in turn and replace the default name with a meaningful alternative.
    You can also use the editor to add or delete menu items or move items up and down
    in the menu.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_238_0.png)


    > Tip

    Editing names requires a couple of clicks on each item. Take care not to click
    too quickly; otherwise the clicks will be interpreted as double-click and you
    will find yourself back in the Code window, ready to edit the menu''s Click event.


    After you have edited the names, right-click on a menu item and select Edit Names
    again to hide the display of object names.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Boolean properties


    Each menu item has three useful Boolean properties:


    +   - The **Checked** property, when True, places a tick on the left of the menu
    option.

    - The **Enabled** property, when False, greys out the menu or option; clicking
    on the menu or option has no effect.

    - The **Visible** property, when False, hides the option when the menu is displayed
    (hides the menu).


    Usually, you will want to leave the properties as they are when developing the
    menu system but change them while the program is running. For instance, an option
    may be used for switching some feature of the program or off. Clicking on the
    option will set Enabled to True (and place a tick against it); clicking on it
    again will set Enabled to False (and remove it). As another example, after saving
    a file FileSave may have its Enabled property set to False; as soon as further
    changes are made to the data Enabled property can be set to True again. Visible
    property may be used for restricting; for instance, some options may be visible
    only to users with certain passwords.


    # Shortcutkeys


    You can attach a **shortcut key** to any option in any of the menus. This is a
    key combination that you can press to activate the menu option without having
    to click on the itself. For example, it is useful for the FileSave option to have
    a **[Ctrl-S]** shortcut, so that the save routine is invoked when the user presses
    **[Ctrl-S]**.


    A shortcut is attached to an item by clicking on the ShortcutKeys and then choosing
    a modifier key and shortcut key. When you run the program and display the menu,
    the shortcut is shown to the right of the option name.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_239_0.png)


    231'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'Whether or not the shortcut is shown on the menu is determined by the ShowShortcut
    property.


    All menu items should have access key (a key used in combination with [Alt] to
    activate the option). Only the most frequently-used options should use keys other
    than [Alt].


    ![](img/dd2d93f16b3cb78149c4221e4752898b_240_0.png)


    # Other properties


    When you have created a menu system for a form, you can alter others using the
    Properties window. Select the menu item from the drop-down list at the top of
    the window or click on the menu item and then change the properties in the usual
    way.


    In Visual Basic .NET, four other properties may be useful in more complex applications:


    +   - Index property sets the position of the menu on the menu bar or an option
    within a menu. The position is numbered from 0 on the extreme left or top of the
    menu. When you change the index for one item the rest are renumbered accordingly.

    - DefaultItem property, when True, indicates that the option is the default option
    in the menu or sub-menu. The item is displayed in bold and double-clicking the
    menu or sub-menu results in the default item selected.

    - MdiList property, when True, results in a list of all subsidiary windows currently
    open in the main window being added to the menu.

    - RadioCheck property, when True, replaces the tick for checked items with a radio
    button.


    These properties are not available in Visual Basic 2005.


    For more information on menu properties, search the Visual Basic on-line help
    for the MenuItem class.


    232'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Menu events


    Menu controls respond to a Click event, which is activated either by clicking
    on the menu option or by pressing the access key or shortcut.


    > Take note

    nYou can set up a Click event for a menu or sub-menu; for example, you may want
    to change the contents of a menu each time it is displayed.


    For menus and sub-menus, the Click event results in the list of options dropping
    down. For menus, you need to supply a Click procedure. The code for this is added
    in exactly the same way as any other event. (You can either select the menu object
    and event name in the boxes at the top of the Code window or double-click on the
    item in the form.)


    # The Edit menu


    Most applications have an Edit menu with the following options:


    +   - Cut: Deletes highlighted text and copies to clipboard

    - Copy: Copies highlighted text to clipboard

    - Paste: Pastes text from clipboard at cursor position (replacing highlighted
    text)

    - Clear: Deletes highlighted text


    The implementation of these options, shown below, will be very similar in most
    applications.


    # The clipboard


    The clipboard is an object that is supplied with every Windows application. It
    does not have any physical appearance or events but it does two useful methods:


    +   - SetDataObject: Copies the specified text to the clipboard


    +   - GetDataObject: Returns the contents of the clipboard


    The clipboard can hold data in a number of formats - not just text. Therefore
    the retrieval of data from the clipboard is not entirely straightforward. The
    GetDataObject'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'method returns data as an object of type IDataObject. In order to retrieve
    the data from IDataObject you must use the object''s GetData method and specify
    the format of the data (which will be one of the standard formats specified by
    the DataFormats class.


    The Edit menu example below illustrates the usual way of doing this for the mnuEditPaste_Click
    procedure (It is usually only the Paste operation that requires you to retrieve
    data from the clipboard). The procedure consists of two statements:


    +   - The Dim statement performs two operations: defining a variable of type IDataObject
    and giving it the current clipboard

    - The second statement uses the new variable''s GetData method to retrieve the
    data in the text format, converting the result into a string that is placed in
    the text box''s Text property.


    The clipboard methods can be used in conjunction with the following text box properties:


    +   **SelectedText** String highlighted characters (blank if none selected)

    **SelectionLength** Length of highlighted string

    **SelectionStart** Current cursor position (0 if in front of first character)


    The procedures below show how the Edit menu options are usually implemented.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_242_0.png)'
