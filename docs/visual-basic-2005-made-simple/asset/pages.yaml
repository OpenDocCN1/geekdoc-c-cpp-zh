  md: '# 1 Overview (p24)


    +   1 Click on the Start button and All Programs. Click on the Microsoft Visual
    Basic 2005 application icon.


    Click on the New Project button. In the Name box, replace ''WindowsApplication1''
    with ''Membership Database'' and click on OK.


    Select File|Save All. Click on the Browse button


    +   2 Select Window|Reset Window Layout. Click on OK to confirm and then on OK
    on the Options dialog.


    The main window should contain the Form Design tab (containing Form1). The Solution
    Explorer and Properties windows should be docked and there should be a tab for
    the Data Sources window. The Toolbox window should be hidden.


    +   3 Click on the Toolbox button to show the window, then click on [image]


    Drag the Data Sources tab into the main window, then click on its Close button.


    Click on the [image] button to show the properties in alphabetical order.


    Move windows by dragging the title bar; resize by dragging the edges or corners.
    Maximise by clicking on the Maximise button.


    +   4 Click on the Help menu, then on Index. In the ‘filtered by’ box, select
    ‘Visual Basic’; in the ‘Look for’ box, type ‘properties w’; click on ‘Properties
    Window’ at the top of the list of topics. After using the help, click on the Close
    button on the help page.


    +   5 Click on the Minimise button in the main window. Then click on the Membership
    Database button in the taskbar.


    +   6 Click on File in the main window menu bar and then on Exit. If you are asked
    to save the changes, click on Yes.'
