- img_proc: true
  md: '# String conversions


    As we seen, Visual Basic makes a very clear distinction between numeric and string
    variables. The only time you may be able to mix numbers and text in an expression
    is when using Object variables or properties. Two functions, Str and Val, convert
    values from one format to the other.


    Str converts a number (or the contents of a numeric variable or expression) to
    a string. The first character of the string is a space if the value is positive
    or zero; the string starts with ''-'' if the value is negative.


    Most data types also have a ToString method that converts the value into a string.


    The following code assumes that intHouseNum is a numeric variable and strStreet
    is a string:


    ```

    Dim strHouseNumS As String, strFullAddress As String

    strHouseNumS = Trim(Str(intHouseNum))

    strFullAddress = strHouseNumS & Chr(23) & strStreet

    ```


    If intHouseNum has the value 23 and strStreet is ''High Street'', the contents
    of strFullAddress = ''23 High Street''.


    The Val function reverses this process, converting a string to a numeric value.
    The function uses as much of the string as it can, ignoring spaces. Using the
    example above, Val(strFullAddress) would return 23.


    There are also a number of functions for converting values to each of the Visual
    Basic data types. For instance, CInt converts a number to an integer, CStr converts
    a number or text value to a string and CDate converts a number or string to a
    date (see below). Other functions include CBool, CByte, CChar, CDbl, CDec, Clng,
    CObj, CShort and CSng.


    As an alternative, you can use the Convert class. This includes methods such as
    ToDouble, ToString and ToDateTime.


    txtFromASCII txtToChar


    ![](img/dd2d93f16b3cb78149c4221e4752898b_140_0.png)


    132'
