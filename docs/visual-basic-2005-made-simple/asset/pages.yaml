  md: '![](img/dd2d93f16b3cb78149c4221e4752898b_92_0.png)


    Sometimes, you may want to split the Click event into its two component parts:
    **MouseDown** and **MouseUp**. For instance, you may want to change the appearance
    of a control when the button is pressed and restore it when the button is released.
    You also need to use these events to find out which mouse button was pressed and
    whether the **[Shift]**, **[Ctrl]** or **[Alt]** keys were also pressed. (The
    Click event provides no extra information.)


    The **MouseMove** event occurs when the pointer passes over the top of the object
    (useful for changing the appearance of the pointer at different places on the
    screen). **DragOver** occurs when an item is being dragged over the object and
    the **DragDrop** event is generated at the end of a drag operation when the mouse
    button is released. For these drag operations you can determine what object was
    being dragged, and the appropriate action.


    **GotFocus** and **LostFocus** occur when a control gets or loses the focus, respectively.
    GotFocus can be used to set initial values, while LostFocus is useful for checking
    the user''s input. For instance, you might use GotFocus to give an empty text
    box a default value and then test the user input with LostFocus; if the entry
    is invalid, the cursor can be put back into the text box by giving the focus again
    (but make sure the user does not get stuck in a loop!)


    In some circumstances you may want to test for keyboard activity. **KeyPress**
    occurs when a key is pressed; this may be split into the **KeyDown** and **KeyUp**
    events.


    You can also find out what the user is doing by writing a procedure for an object''s
    **TextChanged** event. This event occurs whenever the value of a label or text
    box changes. Similarly, **CheckedChanged** is generated wherever there is a change
    to a check box or radio button.'
