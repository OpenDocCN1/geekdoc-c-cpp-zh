  md: 'Select HelpSearch to search the help for a particular word or phrase. Matching
    topics are listed in the Search tab. Double-click on a topic to display the corresponding
    help. You can reduce the number of topics found by specifying a particular part
    of the extensive help (e.g. Visual Basic).


