  md: '# # Installing Visual Basic


    Visual Basic 2005 provides a sophisticated Windows programming environment that
    is capable of producing powerful programs. Since it is a ''Visual'' system you
    can create the visual part of a self-contained Windows application in a very short
    time, without the need to write any program code at all. You can then add short
    procedures for performing specific tasks, using the powerful programming language.
    This book shows you how to create fully-fledged Windows applications, quickly
    and effectively.


    # ## Visual Basic versions


    Visual Basic 2005 is an attempt updated version of Visual Basic .NET and is supplied
    in the following editions:


    +   - The Express Edition is a cut-down version of Visual Basic, offering full
    functionality but limited application templates and design tools.

    - The Standard Edition provides additional templates and further tools, such as
    a report viewer.

    - The Professional Edition includes the full set of templates and a number of
    extra tools, such as a web form designer and component designer.


    # ## Installation


    The easiest way to start using Visual Basic 2005 is to download the Express Edition
    from the Microsoft website. This edition is initially available free but a registration
    may be payable in the future.


    +   1. Go to msdn.microsoft.com/vstudio/express/vb.

    2. Click on Download Now.

    3. Click on the Download button and follow the instructions.


    At the end of the set-up process, an option will be added to the All Programs
    menu, leading to the main Visual Basic program.


    The full Visual Basic 2005 Express Edition takes up to 1.3 Gb. If you are short
    of hard disk space you need only install Visual Basic Express and the .NET Framework
    2.0 (requiring 500 Mb).'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Running Visual Basic


    The installation process will have created icons that can be used to run the application.


    Visual Basic 2005 is part of the.NET Framework. This is a collection of languages
    that share a set of development tools. Visual Basic 2005 applications are developed
    using Visual Studio, a program used for the design of all .NET framework applications.


    # Starting the program


    To start Visual Basic:


    +   1. Click on the Start button to display the Start menu.

    2. Move the pointer to All Programs.

    3. Click on the Microsoft Visual Basic 2005 Express option.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_11_0.png)


    > Take note

    The operation of Visual Studio the same in all versions of Windows. In this book,
    the illustrations are taken from the Express Edition in Windows XP but the same
    principles apply in other versions of Windows.'
  merge: -1
