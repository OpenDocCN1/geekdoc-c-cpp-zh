  md: '# File selection


    Visual Basic 2005 provides three standard controls in the Toolbox that give you
    access to familiar Windows dialog boxes:


    +   - OpenFileDialog allows you to access existing files.

    - SaveFileDialog lets you create new files.

    - FolderBrowserDialog allows you to select a folder or create a new folder.


    There are also controls for other standard dialogs, such as Print, Font and Color.
    All these dialogs can be found in the Dialogs section of the toolbox.


    When you add one of the standard dialogs to a form, the icon appears in the component
    tray (below the form).


    > Take note

    Earlier versions of Visual Basic had separate controls for selecting a drive,
    folder and file. These are no longer necessary as all the functionality is included
    in the standard dialogs.


    # OpenFileDialog


    The OpenFileDialog control has a number of useful properties:


    +   - The InitialDirectory property specifies the folder that is displayed when
    the dialog opens.

    - The Filter property allows you to restrict the files to matching a particular
    file specification.(The Filter is shown in the ''Files of type'' box.) The value
    of the filter is in two parts, separated by a vertical bar (|): a description
    and the file specification.

    - The MultiSelect property, if True, allows more than one file to be selected
    from the dialog.

    - The CheckFileExists property determines whether a warning is displayed if an
    invalid filename is typed into the ''File name'' box.


