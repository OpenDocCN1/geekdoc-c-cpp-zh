  md: '# Visual Basic functions


    In some cases, where there could be confusion between a function and a property

    with the same name, you need to specify that it is a Visual Basic internal function

    by preceding the function with Microsoft.VisualBasic.


    For example:


    ```

    Microsoft.VisualBasic.Left(strName, 1)

    ```


    This avoids any confusion with the form''s Left property.

    To make things easier, you can include the line at the top of the form code:


    ```

    Imports VB = Microsoft.VisualBasic

    ```


    You need only refer to ''VB'' when specifying the function. For example:

    VB.Left(strName, 1)


    # String searches


    The InStr function allows you to search for one string within another. There may

    up to two arguments for the function, which takes the following:


    ```

    InStr(start, main, search)

    ```


    The function searches the main string for the first occurrence of the search string,

    beginning the search at the start position. (Characters in the main string are

    numbered from 1 on the left-hand side.)


    ![](img/dd2d93f16b3cb78149c4221e4752898b_137_0.png)


    Tip

    Rather than using a space

    in a pair of double quotes

    (see the example below),

    it is usually better to use

    a constant or the Chr(32)

    function — page 131.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_137_1.png)


    Take note

    InStr is case sensitive; it dist-\inguishes between upper and lower case

    letters when searching. If in doubt,

    use UCase to convert the main string to

    citals and enter the search string in

    upper case as well.


    129'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'If no start value is given, the whole string is searched. For example, the
    following code extracts the surname from a text box:


    ```

    Dim strSurname As String

    Dim intSpacePos As Integer

    intSpacePos = In(txtFullName.Text, " \)

    strSurname = Mid(txtFullName.Text, intSpacePos + 1)

    ```


    The first two lines declare the variables that are used in the routine. The third
    line searches for a text box (named txtFullName), putting the position of the
    space in the intSpacePos variable. The final line extracts the text starting from
    the character after the space, putting it in the string variable strSurname.


    Make sure that you put exactly one space between the double quotes; otherwise,
    the search will not be successful. If the search is not found, the function returns
    a value of 0.


    # String class


    You can use the methods provided by the String class to perform all the operations
    described above, along with several others. In some cases, the methods work in
    the same way as built-in functions. For example, the Concat method combines two
    or more strings in a string variable:


    ```

    strName = String.Concat(strName, " ", strName)

    ```


    Here, the contents of the two variables strName and strName are combined into
    a single variable, strName, with the two items separated by a space.


    Since any string variable is derived from the String class, the methods of the
    class can be applied directly to the string variable. For instance:


    ```

    chrInitial = strName.Chars(1)

    ```


    In this case the Chars method of the String class extracts a specified number
    of characters from the left-hand side of the string. Therefore this statement
    has the same effect as:


    ```

    chrInitial = Microsoft.VisualBasic.Left(strName, 1)

    ```'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'You can create a string containing a given number of characters by initialising
    a new instance of the String class. For example:

    strFilledS = new String("S", 4)


    This statement creates the string variable strFilledS and gives it an initial
    value of ''SSSS''.


    # ## Character conversions


    Each character in a string is represented in memory by a numeric code 0 to 255.
    The codes used are the ASCII character set. In this system, A is represented by
    65, B by 66 and so on; lower-case letters start at 97, numeric digits at 48; the
    space character is 32. If you specify one of these codes in a string, the required
    character will be displayed on screen or printed.


    The first 128 ASCII codes are most standard and should produce the same result
    in any character font. 0-31 are used for control characters, which are often embedded
    in files. The most useful control characters are 9 (tab character), 10 (line feed),
    11 (form feed) and 13 (carriage return). The codes between 32 and 126 are all
    printable characters.


    The codes for 128 onwards are rather more variable and their interpretation depends
    on how the computer or printer is set up and the fonts being used. These are the
    extended ASCII codes. For you create a string of Greek characters on one computer
    they may appear as a completely different set of characters on another screen
    or when printed.


    > Take note: Two characters that may cause problems are 35 (which can appear as
    # or €, depending on the delete selected) and 127 (the delete character).


    For this reason, the extended characters are best avoided unless you are controlling
    the fonts that are used. Remember that you may have to supply users with unusual
    fonts that you are using.


    The Chr function returns the whose ASCII code is given; for example, Chr(32) returns
    a space. The reverse of this is the Asc function, which converts a character to
    its ASCII code. So Chr(74) is ''J'' and Asc("J") is 74. Examples are given below.'
  merge: -1
