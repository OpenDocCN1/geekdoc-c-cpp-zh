  md: '# Combobox


    A combo box is a combination of a text box and a list box. An item can be selected
    from the list either by clicking on an item or typing an item name in the text
    box at the top of the control. Depending on how the combo box is set up, the user
    may also be able to type new values in the text box; these are then added to the
    list. Visual Basic use combo boxes in a number of places: for example, the object
    and procedure boxes on the code tab are combo boxes.


    The operation of a combo box is controlled by the DropDown property, which may
    take the following settings:


    +   - DropDown Clicking on the arrow makes the drop down. An item can be selected
    by clicking or typing in the text box. New items can be inserted in the text box.

    - Simple Similar to DropDown but the list is displayed at all times.

    - DropDownList Clicking on the arrow makes the drop down. An item can be selected
    by clicking on it.


    The properties for combo boxes are similar to those for list boxes but the following
    points should be noted:


    +   - For the DropDown and Simple styles, a TextChanged event is generated when
    the entry in the text box is edited. The ListIndex property is set to -1 for new
    entries.

    - When you click on an item in the list, the Click, TextChanged and SelectedChanged
    events are generated (in that order).


    Combo boxes are useful when you want to give the user option of extending the
    list. They also take less space on the form than a simple list box.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_112_0.png)


    104'
  merge: -1
  pgno: 112
