- img_proc: true
  md: '# Saving and running


    Usually, an application is made up of several windows, each of which is created
    from a form in a VB file. The application as a whole has a project file, which
    defines the forms and other files that go together to make up the finished project.


    The project is defined by a number of files in the project directory; the main
    file has the name to the project initially and the extension VBPROJ.


    The project has two properties: the filename and its location. You can change
    the name of the project at any time by clicking on the project name at the top
    of the Solution Explorer and then changing the Project File setting in the Properties
    window. The immediate effect is that name changes in the Solution Explorer and
    the two physical files are renamed.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_48_0.png)


    The project comprises part of a solution (which may contain other projects as
    well). The solution is defined in two further files, by SLN and SLO extensions.
    Initially, the name of the solution is the same as the project name.


    The solution also has a number of properties, which you can display by clicking
    on the solution name at the top of the Solution Explorer. You can change the Name
    of the solution in the Properties window; the names of the solution files are
    updated immediately but there is no change to the project filename or project
    folder name.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Solution name


    ![](img/dd2d93f16b3cb78149c4221e4752898b_49_0.png)


    You can save any changes to the project or solution by clicking on the appropriate
    item in the Solution Explorer and selecting the relevant Save option from the
    File menu. Any changed forms are saved at the same time.


    More simply, you can save all your changes (to forms, the project and the solution)
    at any time by selecting FormlSave All or by clicking on the Save All button on
    the toolbar.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_49_1.png)


    If you have set up a SourceSafe database, you will also be asked if you want to
    save the project in SourceSafe. This is a file management system, which stores
    previous versions of your files so you can recover them at any time. SourceSafe
    is particularly useful if several people are working on a project at the same
    time. For information on SourceSafe and setting up a SourceSafe database, see
    the on-line help.


