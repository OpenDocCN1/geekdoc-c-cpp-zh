  md: '# Printing


    Printing is achieved by creating an instance of the PrintDocument class. You can
    then set the properties of this document and fill it with text, before finally
    sending it to the printer with the Print method.


    Text and pictures are added to the document using the methods of the Graphics
    object, as described earlier. The Graphics object is available as a parameter
    in the document''s PrintPage event, which occurs each time the document is required
    (for example, when previewing or printing the document).


    Margins and other document settings are available in the document''s DefaultPageSettings
    property.


    A number of standard dialog boxes are available as controls to help you set up
    a document:


    +   - PrintDialog displays a standard Print dialog and can be used to adjust printer
    settings just before the document is printed.


    +   - The PageSetupDialog allows you to change paper size, orientation and margins,
    as well as giving you access to the printer settings.


    +   - The PrintPreviewDialog produces a display of the document as it will appear
    when printed, with all the standard options available.


    +   - The PrintPreviewControl object displays a preview of document in an area
    on the form, without any of the standard preview options.


    In each case, there is a Document property, which must be set to the name of your
    PrintDocument before the dialogs are displayed.


    You can also use the FontDialog to change the font for a text selection.


    The example below illustrates the use of all these features. Text can be entered
    in the top left-hand text box to be printed as a title. Below that is a rich text
    box, which allows you to change the font (including typeface, point size and text
    style) for any part of the text. The following buttons affect the rich text box:


    +   - The Load button calls a standard Open dialog to select an RTF file, which
    is added to the rich text box.


    +   - The Save button saves the contents of the box in a named file.


    +   - The Font button lets you change the font for the text selected in the'
