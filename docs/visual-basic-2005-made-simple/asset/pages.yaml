- img_proc: true
  md: 'The lines and shapes are drawn with the various Graphics methods:


    +   - The DrawLinemethod draws a straight line with a specified pen between two
    pairs of co-ordinates.


    +   - The DrawRectangle method draws a rectangle with a specified pen; the rectangle
    is defined by the co-ordinates of the top left-hand corner, the width and height.


    +   - The DrawEllipsemethod draws an ellipse with a specified pen; the height
    and width of the ellipse are determined by a bounding rectangle, defined as above.
    If the height and width are the same, the result is a circle.


    +   - The FillEllipse method draws a filled ellipse with the fill colour defined
    by a brush.


    These are several variations of these methods, depending on what parameters you
    want to use. There are also a number of other drawing tools.


    The program below demonstrates the use of these graphical features. The program
    also makes use of a timer to generate changes to the display; timers are described
    in the next section.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_285_0.png)


