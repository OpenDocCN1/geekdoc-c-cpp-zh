  md: '# Public and passed variables


    When you call an event-driven procedure, no other information is needed for the
    procedure to be executed. However, for general-purpose procedures, you usually
    need to make further details available to it and the procedure will often need
    to pass back some result. For instance, a procedure to calculate the number of
    days between two dates needs to know the dates used in the calculation and must
    be able to return the answer; if a procedure is used for setting up an array,
    the contents of the array may be made available to other procedures. All this
    is handled by the use of public variables and by passing the contents of variables
    to from procedures.


    # Private and public variables


    Variables declared in a procedure (with a Dim statement) are local to that procedure
    – they have no meaning elsewhere in the project. Form-level variables declared
    in the Declarations section (with a Private statement) are available throughout
    the form – but not in other forms or modules.


    Modules also have a Declarations section where variables can be declared. The
    declarations take the following forms:


    +   * Private variable As Type

    * Public variable As Type


    The private variables are available throughout the module but not in other modules
    or forms.

    The Public variables are available throughout the whole project. The value of
    a public variable can be used by any procedure, in any form or module. For example,
    a user name entered on one window may be needed elsewhere in the program, and
    its value must not be lost.


    As a general rule, you should make variables as local as possible; use local variables
    in preference to private (form-level or module-level) variables, and private variables
    in preference to public variables. This reduces memory requirements and helps
    you to keep track of your variables and their values.


    To add module-level variables, make some space at the top of the module (just
    above the first Sub statement) and type them in the usual way.


    (After declaring the variables, any statements that use them will no longer have
    errors highlighted.)'
  merge: -1
  pgno: 162
- img_proc: true
  md: "# Public variables\n\n```\nmodMainCode.vb  frmDebit.vb  frmDetails.vb  frmDesign.vb\
    \  frmHttp.vb\nmodMainCode\n[ ]PaymentSelected\nModule modMainCode\n    Public\
    \ Decl IsChequeNumber As Integer\n    Public strPaymentType As String\n\n    Sub\
    \ PaymentSelections()\n        Increment cheque number and set payment type\n\
    \        IsChequeNumber = IsChequeNumber + 1\n        strPaymentType = \"Cheque\"\
    \n    End Sub\nEnd Module\n```\n\n# Private and public constants\n\nConstants\
    \ can also be declared in the Declarations section of a module. By default, constants\
    \ are private and therefore available to all procedures in the module but not\
    \ to other modules or forms.\n\nYou can also make constants **public**, making\
    \ their values accessible to all procedures in the project:\n\nPublic Const variable\
    \ As type = value\n\nFor example:\n\nPublic Const strProgVersion As String = \"\
    1.4\"\nPublic Const intStartYear As Integer = 1997\n\nThese statements can be\
    \ included in the Declarations section of any module.\n\n# Passing variables to\
    \ procedures\n\nOne way of exchanging information with procedures would be to\
    \ hold the values in public module-level variables. However, it is more efficient\
    \ to **pass the values** across when the procedure is called. The variables that\
    \ are passed to the procedure must be declared in the Sub statement, in the brackets\
    \ following the procedure name. The first line of the procedure will be as follows:\n\
    \n```\nSub procname(variable As type, ...)\n```\n\n155"
  merge: -1
  pgno: 163
- img_proc: true
  md: "The brackets can contain more than one variable (when more than one value is\
    \ passed). If no variables are passed, the brackets are empty. The brackets should\
    \ also contain any variables that are to be passed back to the calling procedure.\n\
    \nWhen the procedure is called the values are listed in the brackets following\
    \ the procedure name. For example, the following procedure extracts the house\
    \ name or number from the first line of an address:\n\n```\nSub ExtractHouse(ByRef\
    \ strStreetName As String, ByRef_\n    strIntCommaPos As Integer)\n    'Find comma\n\
    \    intCommaPos = InStr(strStreetName, \",\")\n    'Get house name/no. from left\
    \ of street name\n    strStreetName = Left(strStreetName, intCommaPos - 1)\n \
    \   'Remove house from street\n    strStreetName = Trim(Mid(strStreetName, intCommaPos\
    \ + 1))\nEnd Sub\n```\n\nThere is no need to specify that 'Left' is a VB function,\
    \ as this code is in a module, rather than a form (and therefore there is no 'Left'\
    \ property to cause confusion).\n\nHere, strStreetName is used for passing a value\
    \ to the procedure; the procedure uses strHouseName for passing a value back and\
    \ it also changes strStreetName, passing back a different value.\n\nThe ByRef\
    \ specifies that the procedure may change the values of the variables. The variable\
    \ intCommaPos is a local variable, which exists only while the procedure is running.\n\
    \nIf you want to stop a variable being changed when passed back from a procedure,\
    \ include the ByVal keyword before the variable name in the procedure definition:\
    \ e.g. FillArray(ByVal intCount As Integer). Here, any change to intCount will\
    \ not be passed back to the calling procedure. By including ByVal in the Sub line\
    \ you are effectively declaring the variables as local for that procedure.\n\n\
    If you don't place any keyword in front of the variable name, then the variable\
    \ is assumed to be by ByVal and its value will not be passed back to the calling\
    \ procedure.\n\n156"
  merge: -1
  pgno: 164
- img_proc: true
  md: "The following procedure, which is invoked by clicking on a button, gets the\
