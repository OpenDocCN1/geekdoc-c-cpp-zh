  md: '# Starting a new project


    As you enter the application, the Visual Basic window is displayed, with the Start
    Page tab open open, and within this, the Recent Projects pane. If this is the
    first time you run the program, the Recent Projects pane will be empty. To create
    your first application:


    +   1 Click on the New Project button. The New Project dialog is displayed.


    New project button


    +   2 Check that the Windows Application icon is highlighted.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_13_0.png)


    > Take note You can create several types of project, such as class libraries and
    console applications. For more information on these, see the on-line help.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '3 Enter a Name for the application.


    4 Click on OK to create the new project. The location for the project will be
    selected when you first save the files.


    You now have a blank application, ready to customise.


    # Saving the project


    Before going any further, you should save the project and select a location for
    the project files:


    +   1 In the Visual Studio window, select FileSave All.


    +   2 If you do not want to save your project in the default location, click on
    the Browse button to choose a new location.


    +   3 Check the ''Create directory'' box if you want to create a directory for
    the files. The folder name is the same as the solution name.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_14_0.png)


    Directory where solution will be stored


    Check box to create directory


    4 Click on Save.


    The solution directory is created, along with a number of subdirectories. A number
    of files will be created here and updated as you develop your project. In general,
    you should not make any changes to these files from outside Visual Basic.'
  merge: -1
