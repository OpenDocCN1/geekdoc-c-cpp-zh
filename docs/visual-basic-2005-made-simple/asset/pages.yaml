  md: 'Items in list collection will appear in list box at run-time


    ![](img/dd2d93f16b3cb78149c4221e4752898b_108_0.png)


    Alternatively, items can be added to the list at run-time (for example, in the
    form’s Load procedure) using the Add or Insert methods of the Items collection.
    These take the forms:


    ```

    listbox.Items.Add(listitem)

    listbox.Items.Insert(index, listitem)

    ```


    The listitem is the text item to be added to the list; index specifies the position
    for the new item in the list (starting at 0 for the top of the list).


    For example:


    ```

    lstTypes.Items.Add("France")

    lstTypes.Items.Add(3, "Germany")

    ```


    The first statement adds the item ‘France’ to the bottom of the list; the second
    statement adds ‘Germany’ as the fourth item in the list.


    As an alternative to specifying the index number, setting the list box’s Sorted
    property to True sorts the list items in alphabetical order.


    100'
