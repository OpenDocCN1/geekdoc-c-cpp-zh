  md: '# Multiple properties


    You can select a group of controls in one of the following ways:


    +   - Hold down the [Shift] key and then click on two or more controls. Each time
    you click on an additional control, the other selected controls are identified
    with white sizing handles.

    - Move the pointer to a blank area of the form and drag it over the controls.
    Any control that is at least partly covered by the marked rectangle is given sizing
    handles.

    - A control can be removed from the group by holding down [Shift] and clicking
    on it again.


    This method is normally used for dragging controls to another part of the form
    but it can also be used for changing the settings for all the marked controls
    at the same time. If you change a setting in the Properties window, the setting
    is applied to all selected controls; for instance, you can change the width of
    a group of controls.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_61_0.png)


    > Tip

    You can find out any property is used for by looking for the relevant entry in
    the System.Windows.Forms section in the MSDN library. Every control has an entry
    in the on-line help, giving an overview and a link to a list of all the control''s
    members (including the properties).


    53'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Common properties


    A large number of properties are common to all or most controls; these provide
    the basic functionality of the controls. Each type of control has its own additional
    properties, which regulate those features that are peculiar to the control. For
    instance, most controls can have their size and position changed but only a text
    box has a PasswordChar property, which allows the box to be used for entering
    a password. The most useful common properties are described here.


    # Name


    Every control has a Name, which is used when referring to the control in a procedure
    (for instance, when changing the control''s properties at run time). Visual Studio
    gives each new control a default name, consisting of the number: Button1, Button2,
    ..., Text1, Text2 etc.


    You should change these names to something more meaningful. Although you could
    keep the defaults, you should change the Name for all controls, even those you
    think you are unlikely to use in your program.


    The rules for names are as follows:


    +   - Names may consist of letters, numbers and underscore (_); no other characters
    or spaces are allowed.

    - Names must start with a letter. You can use numbers or underscores anywhere
    in the Name after the first character.

    - Upper and lower case letters are treated as being the same but a mixture can
    be used to make the name easier to identify (btnSaveAs is more recognisable than
    btnsaves both refer to the same control).

    - Names can be any length but for ease of use you should keep them shorter than
    this.


    To make easier to identify controls from their names, you should adopt a suitable
    naming convention. A common convention is that the first three characters are
    lower-case letters and indicate the type of control; all buttons begin ''btn'',
    all text boxes ''txt'' and so on. A suggested naming convention is given in the
    on-line help. If you adopt the standard naming convention, keep to it for all
    controls.'
  merge: -1
