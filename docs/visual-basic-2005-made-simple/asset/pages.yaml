    # Labels


    The label control adds text to the form: titles, instructions, text for data-entry
    boxes and so on. The user cannot do anything with these controls but you may wish
    to change the text itself at run time; for example, after a file has been selected
    a label may be used to display the filename.


    The text of the label is held in the Text property. The position of the text within
    the label area is set by the TextAlign property.


    You can place the text on the left, center or right of the label area, and at
    the top, middle or bottom. The alignment is chosen by clicking on the setting
    and then on the appropriate green rectangle on the drop-down box.


    If the text will not fit in the label area, setting AutoSize True allow the label
    to expand its area if necessary.


