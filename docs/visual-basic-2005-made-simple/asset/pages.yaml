  md: '# Running the application


    To test the program, select Start Debugging from the Debug menu (or press [F5]).

    An Output window appears at the bottom of the Visual Studio window and a few messages
    will flash by (if the window has been selected for display).


    The first window should pop up very quickly. It may not appear very impressive
    but all the buttons on the window should behave as you would expect. The Minimise
    and Maximise the buttons (if included) reduce the application to an icon or blow
    it up to full-screen size, respectively. The window can be moved or resized (depending
    on the setting for BorderStyle). Other windows are not visible yet—you need to
    add some program code before they can be seen.


    The Visual Studio window is still open, behind Form1, but you cannot make any
    changes to your application. The title bar shows ‘Running’ and some of the windows
    are hidden.


    Visual Studio visible in background


    ![](img/dd2d93f16b3cb78149c4221e4752898b_51_0.png)


    Some windows hidden while application is running


    Application running in the foreground


