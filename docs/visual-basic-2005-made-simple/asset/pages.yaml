  md: '# Random number functions


    The Rnd function generates a random number between 0 and 1. If a negative number
    is given as the argument for the first call to the function, the same sequence
    is generated each time; the argument is the ''seed'' for the random number sequence.


    If you want a different sequence each time, use the Randomize statement to initialise
    the random number sequence. If no argument is given for Randomize, the system
    timer is used to generate the seed, giving a genuinely random starting point.


    An example of the use of the random number generator is given below.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_135_0.png)'
