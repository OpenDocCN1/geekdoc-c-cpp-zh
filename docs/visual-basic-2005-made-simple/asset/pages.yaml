  md: 'There are three statements at the top of the class code:


    +   - The **Inherits** statement declares that the new class will be based on
    the standard CollectionBase class. This means that the buttons in the array will
    be contained in a collection and all the normal collection properties and methods
    will be available.


    +   - The second statement defines a form variable (ThisForm). The array of buttons
    will be placed on the form identified by ThisForm.


    +   - The third statement sets the width and height of the new buttons as a constant.
    Changing the value here alters the size and position of the buttons.


    The remainder of the code defines the class''s methods, events:


    +   - The **AddButton** method adds a button to the collection and hence to the
    form. This is declared as a Function rather than a Sub procedure, as it has to
    return the new button to the calling procedure.


    +   - The **Remove** method deletes a button from the collection (and the form).


    +   - The **New** method generates the initial array of nine buttons.


    +   - There is a default property that returns a reference to a specified button
    in the array.


    +   - The **ButtonClick** procedure provides the code that is executed when one
    of the array buttons is clicked.


    Each of these is described below.


    # AddButton method


    The AddButton method adds a button to the array and to the form. The method starts
    by creating an instance of a button (btnNew) and adds this to the collection (using
    the collection''s List.Add method); it also adds the button to the form''s collection
    of controls.


    Two integers (intX and intY) are used to identify individual buttons on the array;
    the buttons form a grid three wide. The current button is identified by Me.Count
    – 1, which gives an index number starting at 0. Therefore for the first button,
    Me.Count is 1 and the index number is 0; the second button has value 2 for Me.Count
    and index 1; and so on. The index numbers are then converted into (intX, intY)-coordinates.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'The Left, Top, Width and Height properties for the new button are calculated
    from the button''s co-ordinates and the button size. Most importantly, the button''s
    index number is stored in the button''s Tag property; this is essential, as it
    is the only way that the form can identify which button in the array has been
    clicked.


    The global variables are updated:


    ```

    intTotalButtons += 1

    ibtnNew.Text = intTotalButtons

    intCurrentButton = Me.Count - 1

    ```


    The first statement increments the number of buttons in the array; the second
    statement uses this number as the text to be displayed on the button surface;
    and the third statement stores the new button''s index number in the intCurrentButton
    variable.


    The BringFront method (which is available for any standard button) ensures that
    the new button is displayed on top of any existing controls.


    The AddHandler statement associates the button''s Click event with the ButtonClickHandler
    procedure; all buttons in the array use the same event procedure for their Click
    events.


    Finally, the function returns the button to the calling procedure.


    # Remove method


    The Remove method deletes a specified button from the array. The argument passed
    to the method is the index number of the button to be deleted.


    The code is executed only if there is a button to be removed. The button was added
    to both the collection and the form''s control collection and must therefore be
    removed from both collections. The button is removed from the form''s control
    collection using its Controls.Remove method; similarly, it is removed from the
    array collection using the List.RemoveAt method. In all these statements ''Me''
    refers to the class (i.e. the array collection).


    If the button being removed is the last one in the array, the button that is now
    the last one becomes the current button.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# New method


    The New method is called when the array is created. The argument passed to the
    method is the name of the form to which the buttons are being added.


    The method stores the identity of the form in the class''s ThisForm variable (for
    use in the other methods).


    Nine buttons are added to the form by calling the AddButton method times.


    # Defaultproperty


    The default property returns a reference to a button with a specified index number.
    This allows you to refer to buttons and their properties using their index (e.g.
    arrButtons(index)) where arrButtons is a variable of type clsButtonsArray).


    # ButtonClickprocedure


    The ButtonClickHandler procedure handles the Click event for all the buttons in
    the array.


    The first statement makes the button that has been clicked the ''current'' button
    by storing its index number in the intCurrentButton global variable. Any actions
    carried out on the current button will refer to this button. The index number
    is available in the Tag property of the button that has been clicked.


    The second statement changes the background colour of the button.


    # Controlarrayform


    The final stage is to create a form that will display the control array and allow
    you to perform operations on individual controls.


    The main part of the form will be used for displaying the array of buttons. Three
    further buttons (which are not included in the array) are needed:


    +   - An Add button to add a button to the array

    - An Delete button to remove the current button from the array.

    - A Move button to shift the current button one space to the right.


    You can also add a label to provide instructions for using the program.'
  merge: -1
