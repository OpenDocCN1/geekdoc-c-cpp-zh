- img_proc: true
  md: 'The TextAlign property has the same options as labels, allowing the text position
    to be set horizontally and vertically. The Checked property has a setting of either
    True or False, depending on whether or not the button has been selected. Only
    one button can be selected at a time, when the user clicks on a radio button for
    that button is set to True and for all other buttons to False.


    Check boxes work in a similar way to radio buttons, the main difference being
    that they operate independently of each other. The user may select several boxes
    at the same time by clicking on them – or turn all boxes off.


    The box has three possible states, defined by the CheckState property:


    +   - Unchecked: The box is empty.

    - checked: The box contains a black tick.

    - Indeterminate: The box contains a grey tick.


    You can choose any of these values to be the setting that is displayed when the
    program is run. The options available to the user depend on the setting of the
    ThreeState property. When ThreeState is True, clicking on the check box moves
    the user through each of the three states in turn; when False, the box can only
    be Checked or Unchecked.


    > Tip

    The Indeterminate setting is useful when options are mandatory. For instance,
    the choice of an option button may make a particular check item essential.


    > To make a check box temporarily unavailable, set its Enabled property to False.
    It is less disconcerting for a user to see a check box greyed out for that it
    to disappear completely (by setting Visible to False).'
