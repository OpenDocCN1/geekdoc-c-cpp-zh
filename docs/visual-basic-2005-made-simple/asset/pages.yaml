  md: '# Creating a procedure


    Procedures are created in a tab on the Visual Studio window. This tab is displayed
    either by clicking on the View Code button in the Solution Explorer window, or
    more simply, by double-clicking on either a control or a blank part of the form.
    The Code has two list boxes below the title bar:


    +   - **The Object** box on the left shows the current object (the form or a control).

    - **The Procedure** box on the right shows the event being coded.


    You can choose a new object and event at any time; when you do so, the procedure
    code for that object and event is displayed.


    Every procedure must have a name that is unique within the form. Event-driven
    procedures are named for you, the name consisting of the object name, an underscore
    and the event instance. For procedure corresponding to the Click event for a command
    called ''btnExit'' will be named ''btnExit_Click''.


    The procedure is written in the format:


    ```

    Private Sub object_event(parameters) Handles object.event_statements

    End Sub

    ```


    The first and last lines are provided for you; all you have to do is fill in the
    statements in the middle. When the event occurs, the procedure Click procedure
    will be executed. For example, when the user clicks on the Exit button the btnExit_Click
    procedure


    | Object box: | Enter | Procedure | Procedure box: |

    | current object | code here | name | current_event |


