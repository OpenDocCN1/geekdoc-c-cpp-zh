  md: '# Boolean properties


    A number of properties can take a Boolean value: True or False. In such cases
    you can either assign values of ''True'' or ''False'' (without quotes) to the
    properties, or give them numeric values. A value of 0 (zero) is treated as False;
    any other value is regarded as True. (True and False are Visual Basic constants,
    whose numeric values are fixed. In a numeric expression, True is evaluated as
    -1.)


    For instance, a button can be greyed out with the statement:


    ```

    btnPostcode.Enabled = False

    ```


    When this statement has been executed, the button''s caption will be greyed out
    and clicking on it will not generate a Click.


    # Property references


    Although most references to properties are in the form control.property, there
    are some variations.


    As shown in the example above, you can use ''Me'' to refer to the current form,
    rather than a specific control.


    Within a form''s procedures, you can omit the object name completely when referring
    to the form. For instance, the following two statements are identical:


    ```

    Me.Height = 100

    Height = 100

    ```


    However, it is less likely to cause confusion if you always use ''Me'' when referring
    to the current form''s properties.


    All objects are assumed to be on the current form unless specified otherwise.
    You can refer to objects on other forms by prefixing the control name with the
    form name.


    For instance, the following statement disables a button on frmSaveData form:


    ```

    frmSaveData.btnSave.Enabled = False

    ```


    (This instruction must appear in a procedure in which the form variable, frmSaveData,
    has been defined.)


    Using the full name you can access the properties for any controls or forms included
    in the project.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Methods


    Each object has a number of methods available. These are internal procedures,
    which can be executed from within a normal procedure. The methods are used for
    performing some action on the object. For instance, a text box has a Focus method,
    which moves the focus to the text box.


    The methods are part of the definition of the class from which the object is created.
    All objects from the same class have the same set of methods. Some methods are
    inherited from classes higher up the class structure and therefore appear in several
    classes; for example, the Focus method applies to all selectable controls but
    not to non-selectable controls (such as Label and GroupBox).


    To execute one of these methods, it must be specified in the format:


    ```

    object.method

    ```


    For example, if a value is required for a particular text box you can force the
    text to make an entry with an instruction such as:


    ```

    txtCompanyName.Focus()

    ```


    As for properties and events, the methods available depend on the type of object.
    An object''s methods, properties and events make the object''s members.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_103_0.png)


    > Take note


    It is important to make the distinction between properties, methods, and events:

    - Properties are items of information that describe an object (e.g. txtName.TabStop
    determines whether pressing the [Tab] key can give the text box the focus).

    - Methods are built-in procedures that take some action on an object (e.g. txtName.Focus
    gives the focus to the text box).

    - Events are user actions for which customised procedures may be written (e.g.
    txtName_GotFocus is executed when the text box gets the focus).


    TabStop, Focus and GotFocus are all members of TextBox.'
  merge: -1
