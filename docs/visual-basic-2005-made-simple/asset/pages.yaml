  md: '# Modules


    Much of the work done by an application is performed by event-driven procedures;
    these provide the responses to the user''s actions. However, some code will be
    needed for more general-purpose actions, such as reading data from a file or checking
    that a date is valid. This code is put in a **code module**.


    A module is a separate file that contains a collection of general-purpose procedures,
    which are available throughout the application. Procedures within modules are
    called **module-level** procedures; those in forms are **form-level**. There is
    no particular order to a module''s procedures and they will be listed alphabetically
    in the Procedure box.


    Most applications will have at least one code module, containing procedures for
    performing frequently-used tasks. These procedures are called as needed. This
    has a number of advantages:


    +   - The code has to be written only once; when it has been tested satisfactorily
    you will be able to use it elsewhere in the application without having to go through
    the coding process again.


    +   - Since there is only one copy of the code, there is no danger that the same
    process somewhere else in the application will work in a slightly different way.


    +   - If you need to make a change to the way a procedure works, this has to be
    done only once; there is no need to search through your program looking for other
    occurrences of the same code.


    +   - Code modules can be re-used by other applications; when you have developed
    a set of general-purpose procedures, these can be incorporated in other projects,
    helping to give all your applications the same ''look and feel''.


    You can have any number of code modules in your project so it is a good idea to
    split up your general-purpose procedures. For instance, you may have one module
    for text-handling procedures, another for date routines and a third for dealing
    with graphics.


    If you decide that part of a form procedure will be useful elsewhere, you can
    move it to a code module using cut-and-paste operations.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Scope


    When designing the overall structure of your application it is essential to have
    an understanding of the **scope** of procedures. This determines what procedures
    are available in any part of the application. The rules are as follows:


    +   - Any module-level procedure can call any other module-level procedure, from
    any module in the project (but cannot call any form-level procedures).

    - Any form-level procedure can call any procedure in the same form or any module-level
    procedure (but not any procedures in other forms).


    This is illustrated below.


    You can declare a module-level procedure as *Private*, rather than Public, in
    which case it is available only to other procedures within that module.


    Note that procedures in forms and modules can refer to any control property providing
    you specify the form name. See page 147 for more information on the scope of variables.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_155_0.png)'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Creating modules and procedures


    New modules and procedures are created with a few simple commands.


    # Creating modules


    To create a new code module:


    +   1 Select Project/Add Module. The Add New Item dialog is displayed, with the

    Module template selected.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_156_0.png)


    +   2 Type a name for the module (the vb extention will be added for you) and
    click

    on Open. A code window is displayed.


    ![](img/dd2d93f16b3cb78149c4221e4752898b_156_1.png)'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'The new module is included in the Solution Explorer window. Click on the module
    name to see the module''s properties.


    > Tip

    Start the module filename with ''mod'' so you can easily identify it among the
    vb files.


    Properties

    modCode.vb File Properties

    | Build Action | Compile |

    |---|---|n| Copy to Output | Do not copy |

    | Custom Tool | |

    | Custom Tool Na | |

    | File Name | modCode.vb |

    | Full Path | C:\1 Work (F-Hiz_b |


    If you choose the code window you can redraw it at any time by highlighting the
    module name in the Solution Explorer window and then clicking on the View Code
    button.


    # # Changing modules


    You can add an existing module to the project with Project/Add Existing Item.
    Select a file with a vb extension to add either a form or a module.


    > Take note

    Removing a module from the project does not affect the vb file; that will still
    exist in the project directory.


    To remove a module, click on its name in the Project Explorer window and then
    select Project/Exclude From Project.


    # # Creating procedures in modules


    To add a general-purpose procedure to a code module:


    +   - Double-click on the module name in the Project Explorer window and then
    on the View Code button. The code window is displayed.


    Initially, the only ''objects'' for a code module are ''General'' and the module
    name. This is because there are no visible objects for the module (such as buttons
    and list boxes) and therefore no events.


    149'
