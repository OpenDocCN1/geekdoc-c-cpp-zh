- img_proc: true
  md: '# Control properties


    The appearance and behaviour of a control is determined by its properties, in
    the same way as for a form. The properties include not only cosmetic items – the
    size, colour and position of the control, for example – but also those characteristics
    that affect the way a control is used: whether it is enabled, the user actions
    that are allowed etc.


    The properties are different for each type of control and in each case the system
    provides a default. Most defaults are quite satisfactory so there are usually
    only a few properties that need to be changed.


    As for, you will set the properties when developing the project but they may also
    be changed while the application is running.


    Some properties apply to most or all of the controls – for instance, every control
    has a Name – and can be changed. The most important properties are described below
    for the standard controls.


    A number of, more advanced properties are included in most controls and may be
    useful when an application reaches a late stage of development. You are unlikely
    to use these properties but it is worth knowing they are.


    # Changing properties


    To change the properties for a control, first click on the control so that it
    is selected. Small square ‘handles’ will appear at each corner and in the middle
    of each side. The Properties window will show the properties for the selected
    control. This will include the name of control at the top (initially a default
    name, the control type and a number); you will see the properties that are listed
    change each time you select a different type of control.


    Remember that all controls of the same type will have the same properties but
    each control of that type will be given different settings. Therefore, when you
    click on different controls of the same type you will see the same list of properties
    but with different settings in each case. For example, all buttons have Name,
    Width and Text properties; the settings for one button may be btnOK, 128 and OK
    respectively, and for another, btnHelp, 96 and Help.


    To change the control properties, click on a control and then on a property in
    the Properties window. Either type a new setting in the right-hand column or (where
    appropriate) select the setting from a drop-down list.


    51'
  merge: -1
