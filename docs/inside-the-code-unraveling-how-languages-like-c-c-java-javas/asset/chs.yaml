  \ in the directory\n\nfiles = os.listdir()\n\n# Rename files with a specific prefix\n\
  \nprefix = \"new_\"\n\nfor file in files:\n    if file.endswith(\".txt\"):\n   \
  \     new_name = prefix + file\n        os.rename(file, new_name)\n```\n\n### 自动化\n\
  \nPython 在自动化方面表现出色，允许你简化工作流并减少人工干预。它可以自动化发送电子邮件、管理文件以及与外部系统交互等任务。\n\n例如，你可以使用 Python\
  \ 的 `smtplib` 库来编程发送电子邮件：\n\n```python\nimport smtplib\nfrom email.mime.text import\
  \ MIMEText\nfrom email.mime.multipart import MIMEMultipart\n\n# Email configuration\n\
  \nsender_email = \"your_email@gmail.com\"\nreceiver_email = \"recipient_email@gmail.com\"\
  \npassword = \"your_password\"\n\n# Create the email content\n\nmessage = MIMEMultipart()\n\
  message[\"From\"] = sender_email\nmessage[\"To\"] = receiver_email\nmessage[\"Subject\"\
  ] = \"Automated Email\"\nbody = \"This is an automated email sent from Python.\"\
  \nmessage.attach(MIMEText(body, \"plain\"))\n\n# Send the email\n\ntry:\n    server\
  \ = smtplib.SMTP(\"smtp.gmail.com\", 587)\n    server.starttls()\n    server.login(sender_email,\
  \ password)\n    text = message.as_string()\n    server.sendmail(sender_email, receiver_email,\
  \ text)\n    server.quit()\n    print(\"Email sent successfully!\")\nexcept Exception\
  \ as e:\n    print(f\"Email could not be sent. Error: {e}\")\n```\n\n### Web 开发\n\
