    \ << std::endl;\n}\n\nint main() {\n    std::thread p(producer);\n    std::thread\
    \ c(consumer);\n    p.join();\n    c.join();\n    return 0;\n}\n```\n\n在这个示例中，在生产者中使用使用了\
    \ `std::memory_order_release`，确保在设置 `data_ready` 标志位之前，对 `shared_data` 的更新对消费者线程可见。相反，消费者中的\
    \ `std::memory_order_acquire` 确保消费者只有在看到 `data_ready` 标志被设置后，才读取更新后的 `shared_data`\
    \ 值。\n\n### 内存障：强制操作间的排序\n\n内存障充当线程内的屏障，为内存障两侧的操作强制特定的内存排序。它们本身不执行任何同步，但保证某些内存访问发生在内存障之前或之后。\n\
    \n### 内存障类型：\n\n- `std::atomic_thread_fence(order)`：对当前线程中内存障前后的内存访问强制指定的内存排序。\n\
    - `std::atomic_signal_fence(order)`：确保内存障之前的所有内存访问对执行后续获取操作的其他线程可见。\n- `std::atomic_fence(order)`：结合了\
    \ `std::atomic_thread_fence` 和 `std::atomic_signal_fence` 的行为。\n\n### 示例：内存障与重排序\n\
    \n```cpp\n#include <iostream>\n#include <atomic>\n#include <thread>\n\nstd::atomic<int>\
    \ x(0), y(0);\n\nvoid thread1() {\n    x.store(1, std::memory_order_relaxed);\n\
    \    std::atomic_thread_fence(std::memory_order_seq_cst); // 在此处强制排序\n    y.store(1,\
    \ std::memory_order_relaxed);\n}\n\nvoid thread2() {\n    while (y.load(std::memory_order_relaxed)\
    \ == 0) {\n        ;\n    }\n    std::cout << x.load(std::memory_order_relaxed)\
    \ << std::endl; // 可能打印 0!\n}\n\nint main() {\n    std::thread t1(thread1);\n\
    \    std::thread t2(thread2);\n    t1.join();\n    t2.join();\n    return 0;\n\
    }\n```\n\n# 第 5 章：互斥锁与条件变量\n\n## C++ 高级并发：掌握互斥锁与条件变量\n\n多线程 C++ 编程领域依赖于协调共享数据的访问以及管理线程执行流的能力。本指南将深入探讨互斥锁（mutex）和条件变量（condition\
    \ variables），这是并发程序中同步和通信的两个基础构建模块。\n\n### 互斥的需求\n\n想象一个团队正在处理一份共享文档。如果没有适当的协调，当多个成员同时编辑它时就会出现不一致之处。同样，在并发\
