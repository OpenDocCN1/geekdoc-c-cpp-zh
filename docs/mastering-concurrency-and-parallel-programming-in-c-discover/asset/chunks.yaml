    \ 在构造时自动获取锁并在离开作用域时释放锁，确保了正确的同步。\n\n### 互斥之外：通过条件变量进行通信\n\n虽然互斥锁保证了线程安全，但线程之间的通信同样重要。条件变量充当受互斥锁保护的临界区域内的通信通道。线程可以在条件变量上等待，本质上是进入一个“等待室”，直到另一个线程发出特定条件的信号。\n\
