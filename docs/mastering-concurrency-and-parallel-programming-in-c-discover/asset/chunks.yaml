  trans: "\n\n- **复杂性增加**：与使用预定义选项相比，自定义并行算法通常涉及更复杂的代码。\n- **调试挑战**：由于非确定性行为，带有自定义线程管理的并行代码调试可能更具挑战性。\n\
    - **可移植性问题**：自定义实现在不同 C++ 库或平台之间的移植性可能较低。\n\n## 何时应该考虑自定义并行算法\n\n- **非标准操作**：当现有的并行算法无法直接支持所需的操作时。\n\
    - **性能优化**：对于对性能极其敏感的任务，自定义算法可以释放额外的性能提升。\n- **高级并发需求**：当特定的调度或同步要求超过了预定义算法的能力范围时。\n\
    \n## 结论\n\n自定义并行算法使你具备了根据特定的 C++ 需求来量身定制并发处理的能力。通过理解自定义方法、模式和权衡，你可以编写出高效且可扩展的代码，从而为你的独特应用程序充分利用多核处理器的潜力。\n\
    \n## 前路之路\n\n-C++ 并发的世界提供了一个广阔的探索领域。你可以深入研究以下高级主题：\n\n- **工作窃取机制的库 (Work-Stealing\
    \ Libraries)**：探索如 `TBB` 这样的库，它们实现了工作窃取技术，用于在动态负载中实现高效负载均衡。\n- **高级同步技术**：学习高级同步原语，如`atomic\
    \ operations`（原子操作）或`concurrent data structures`（并发结构），用于复杂的数据共享场景。\n- **性能分析与优化**：利用性能分析工具识别瓶颈，并针对特定的硬件和负载优化你的自定义并行算法。\n\
    - **特定领域的并行算法**：探索为特定领域定制的并行算法库或框架，例如数值计算（如 `Eigen`）或图论算法（如 `Parallel BGL`）。\n\
    - **异步编程**：考虑如 `std::async` 或 `C++ coroutines`（C++协程）等异步编程模型，以实现非阻塞操作并提高应用程序的响应能力。\n\
    \n记住，自定义并行算法是一种强大的工具，但要谨慎使用。对于常见操作，请利用 `STL` 或更高层次库中丰富的预定义并行算法。然而，当你需要突破预构建选项的局限性时，自定义并行算法将使你能够编写出与特定并发需求完美契合的高性能、可扩展的\
    \ C++ 代码。\n\n# 第 18 章：协程 (C++20)\n\n### 掌握异步流：C++20 协程指南\n\n在-C++ 编程领域，与传统的回调相比，协程提供了一种强大的机制，以更具结构化且更熟悉的方式来处理异步操作。本指南将深入探讨-C++20\
    \ 中引入的协程，使你能够为异步任务编写优雅且高效的代码。\n\n## 超回调：协程的兴起\n\n基于回调的编程虽然常见，但会导致代码复杂且容易出错，特别是在处理异步操作链时。协程提供了一种更有结构化的方法，允许你定义可以挂起并在以后执行的函数，模拟任务的协程。\n\
    \n## 协程的核心概念 (C++20)\n\n- **协程函数 (Coroutine Functions)**：用 `co_return` 类型说明符标记，这些函数可以在特定点挂起和恢复执行。\n\
    - **co_await 表达式**：在协程内部用于挂起执行并等待异步操作完成，然后恢复。\n- **协程承诺 (Coroutine Promises)**：管理协程状态的对象，包括挂起点和返回值。\n\
    \n## 常见的协程模式\n\n- **顺序异步任务**：以可读的顺序方式结构化异步操作链，与嵌套回调相比提高了了代码的清晰度。\n- **协作式取消 (Cooperative\
    \ Cancellation)**：实现能够优雅取消等待异步操作的协程的机制。\n- **迭代协程 (Iterative Coroutines)**：创建可以产生多个值的协程，从而创建自定义迭代器或生成器。\n\
    \n## 简化示例：使用协程顺序下载文件 (C++20)\n\n```cpp\n#include <coroutine>\n#include <future>\n\
    #include <iostream>\n\n// 模拟异步文件下载\nstd::future<std::string> downloadFile(const\
    \ std::string& url) {\n    // 模拟下载时间\n    std::this_thread::sleep_for(std::chrono::seconds(2));\n\
    \    return std::string(\"Downloaded content from \") + url;\n}\n\n// 下载文件的协程\n\
    std::string co_download(const std::string& url) {\n    auto download_future =\
    \ downloadFile(url);\n    co_await download_future; // 挂起直到下载完成\n    return download_future.get();\n\
    }\n\nint main() {\n    std::vector<std::string> urls = {\"url1.com\", \"url2.com\"\
    , \"url3.com\"};\n    for (const std::string& url : urls) {\n        std::cout\
    \ << co_download(url) << std::endl;\n    }\n    return 0;\n}\n```\n\n在这个示例中，`co_download`\
    \ 协程使用 `co_await` 挂起执行，直到异步下载操作完成。这允许在不依赖嵌套回调的情况下顺序处理下载。\n\n## 协程的优点\n\n- **提高可读性**：与回调相比，协程以更顺序、直观的方式表达异步工作流。\n\
    - **错误处理**：协程可以通过程调用链传播异常，简化异步操作的错误处理。\n- **减少栈使用**：通过挂起执行，协程可以避免与嵌套回调函数相关的深度栈使用。\n\
    \n## 权衡与考虑\n\n- **编译器支持**：协程是一个相对新的特性，编译的支持可能有所不同。\n- **调试复杂度**：由于其异步性质，调试协程可能更具挑战性。请利用异步调试工具和技术。\n\
    - **性能开销**：与简单的回调方法相比，协程的创建和管理可能会引入一些开销。\n\n## 何时考虑协程\n\n- **复杂的异步工作流**：在处理异步操作链时，协程提供了一种更有结构且易管理的方法。\n\
    - **提高代码可读性**：对于复杂的异步逻辑，协程可以显著增强代码的清晰性和维护性。\n- **异步操作中的错误处理**：当健壮的错误处理对于异步任务至关重要时，协程提供了一种更的异常传播方式。\n\
    \n## 结论\n\n协程使你能够为++20 中的异步操作编写优雅且高效的代码。通过理解核心概念、识别合适的模式并仔细考虑权衡，你可以释放协程的潜力，用于构建响应迅速且可维护的\
    \ C++ 应用程序。\n\n## 前路之路\n\n-C++ 并发的世界提供了一个广阔的探索领域。你可以深入研究以下高级主题：\n\n- **带协程的异步库**：探索如\
    \ `std::async` 或利用协程简化异步编程的高级抽象库。\n- **将协程与其他并发技术结合**：学习如何将协程与线程、任务和未来对象结合，以构建复杂的异步应用程序。\n\
    - **高级协程用法**：发现迭代协程、取消机制和自定义协程执行器的技术，以对异步工作流进行更强大的控制。\n- **与事件驱动编程的集成**：探索如何将协程与事件驱动编程模型结合使用，以构建反应式和响应的应用程序。\n\
    \n"
- fmt: "\n● Asynchronous I/O with Coroutines: Utilize libraries like `asio` that leverage\
    \ coroutines for efficient handling of asynchronous I/O operations, creating non-blocking\
    \ network applications.\n\nRemember, coroutines are a powerful tool in your C++\
    \ concurrency toolbox. However, choose them judiciously. For simple asynchronous\
    \ tasks, callbacks or `promises` might be sufficient. When dealing with complex\
    \ asynchronous workflows, error handling, and improved code readability, coroutines\
    \ offer a compelling alternative, empowering you to write elegant and efficient\
    \ asynchronous C++ code.\n\n# Coroutine Promises\n\n## Demystifying the Middle\
    \ Ground: A Guide to Coroutine Promises in C++20\n\nCoroutines, introduced in\
    \ `C++20`, offer a powerful mechanism for handling asynchronous operations. But\
    \ how do you manage the state and results of these coroutines? Enter `coroutine\
    \ promises` – the unsung heroes that bridge the gap between coroutines and the\
    \ outside world. This guide delves into `coroutine promises`, empowering you to\
    \ write robust and efficient asynchronous code.\n\n## Coordinating Coroutines:\
    \ The Role of Promises\n\nCoroutine functions can suspend and resume execution,\
    \ but they need a way to communicate their state and results. This is where `coroutine\
    \ promises` come in. A `coroutine promise` acts as a container, holding information\
