  trans: "\n并发映射和集合能够让你在多线程环境中高效地管理键值对和唯一元素。通过理解其设计模式、优势、权衡以及高级技术，你可以选择合适的方法，为你的 C++\
    \ 程序构建健壮且高性能的并发数据结构。\n\n## 前路之路\n\nC++ 高级并发的旅程仍在继续。探索诸如并发搜索树（例如并发红黑树）、内存排序技术以及高级同步原语等主题，以便对数据结构的并发访问和修改进行细粒度的控制。\n\
    \n# 非阻塞数据结构\n\n## 高级 C++ 并发：拥抱非阻塞数据结构\n\n在多线程编程领域，效率是至重要的。本指南深入探讨非阻塞数据结构，这是一种线程安全数据管理的强大方法，它消除了线程等待释放锁的阻塞（等待）。在高竞争或频繁修改的场景下，这可以释放显著的性能提升。\n\
    \n### 挑战：超越互斥锁瓶颈\n传统的并发数据结构通常依赖 `mutexes` 来确保线程安全。虽然这种有效，但 `mutexes` 可能会引入开销，特别是当多个线程频繁争抢访问时。这会导致高并发应用程序出现性能瓶颈。\n\
    \n### 引入非阻塞数据结构：释放效率\n非阻塞数据结构专门设计用于避免在并发访问期间阻塞线程。它们通过以下技术实现这一点：\n\n● **原子操作**：这些操作在单个不可分割的步骤中修改内存位置，确保即使在并发访问时也能保持数据一致性。\n\
    ● **乐观并发控制 (OCC)**：线程尝试进行修改，如果由于并发更改引发冲突，则采用重试或更复杂的解决机制。\n\n### 释放功能：无锁访问的模式\n\
    虽然非阻塞数据结构消除了显式锁，但它们利用了复杂的技术来确保线程安全。以下是常见模式概述：\n\n● **比较并交换 (CAS)**：这种原子操作将内存位置上的预期值与实际值进行比较。如果它们匹配，则交换入新值，确保只有一个线程能成功修改数据。\n\
    ● **无等待 (Wait-Free) 与无锁 (Lock-Free)**：非阻塞数据结构可以分类为 `wait-free` 或 `lock-free`。`wait-free`\
    \ 结构保证线程最终会进展（完成操作），而无需等待另一个线程。`lock-free` 结构提供更高的性能，但可能无法始终为线程提供立即进展。\n\n###\
    \ 使用 CAS 的非阻塞栈（简化示例）：\n\n```cpp\n#include <atomic>\n\nclass NonBlockingStack {\n\
    private:\n    struct Node {\n        int value;\n        std::atomic<Node*> next;\n\
    \    };\n    std::atomic<Node*> head;\n\npublic:\n    void push(int value) {\n\
    \        Node* new_node = new Node{value};\n        new_node->next = head.load();\n\
    \        while (!head.compare_exchange_weak(new_node->next, new_node));\n    }\n\
    };\n```\n\n这个简化示例展示了一个非阻塞栈，它使用 `CAS` 在 `push` 操作期间原子性地更新 `head` 指针。这消除了对显式锁的需求。\n\
    \n### 非阻塞数据结构的优势与权衡：\n● **高性能**：非阻塞数据结构的性能显著优于基于互斥锁的方法，特别是在高竞争或频繁修改的场景下。\n● **复杂性**：与基于互斥锁的实现相比，设计和推理非阻塞数据结构需要对并发概念有更深的理解。\n\
    ● **可用性限制**：C++ 标准库提供的非阻塞数据结构有限。第三方库提供了更多选项。\n\n### 高级技术与考虑：\n● **危险指针 (Hazard\
    \ Pointers)**：危险指针等技术可以解决非阻塞实现中潜在的内存泄漏问题。\n● **内存排序**：理解内存保证对于设计正确且高效的非阻塞数据结构至关重要。\n\
    ● **无等待与无锁的选择**：`wait-free` 和 `lock-free` 结构的选择取决于性能需求、对复杂性的忍度和场景。\n\n### 何时考虑非阻塞数据结构：\n\
    ● **高并发应用**：如果你的应用程序在数据访问上存在高竞争或频繁修改，非阻塞数据结构可以提供显著的性能提升。\n● **性能关键区域**：当基于锁的方法成为瓶颈时，考虑为代码中的特定数据结构使用非阻塞替代方案。\n\
    ● **理解权衡**：在代码库中采用非阻塞数据结构之前，仔细评估其复杂性和潜在的性能收益。\n\n## 结论\n非阻塞数据结构让你能够构建高并发且高性能的\
    \ C++ 应用程序。通过理解设计模式、优势、权衡和高级技术，你可以就何时以及如何利用这些高级数据结构来实现高效线程安全数据管理做出明智决策。\n\n##\
    \ 前路之路\nC++ 并发的世界是广阔的。探索高级主题，如具有非阻塞保证的并发搜索树、自旋锁等高级同步原语、用于非阻塞数据结构的内存回收技术，以及提供丰富的非阻塞数据结构实现的第三方库。\n\
    \n# 第 10 章：实现线程安全的类\n\n## 高级 C++ 并发：构构建线程安全的类\n\n在 C++ 编程的多线程领域，确保数据完整性和类成员函数的安全性至关重要。本指南深入探讨实现线程安全类的技术，让你能够构建健壮且可靠的对象，这些对象可以从多个线程进行并发访问和修改。\n\
    \n### 挑战：超越单线程对象\n为单线程环境设计的类可能不适用于并发访问。如果多个线程在没有适当同步的情况下同时访问它们，成员变量和函数可能会损坏。\n\
    \n### 引入线程安全类：保护对象状态\n线程安全类确保其成员变量和函数可以从多个线程安全地访问和修改，而不会产生数据竞态或不一致。通过以下技术实现：\n\
    \n● **互斥锁 (Mutexes)**：这些同步原语提供了互斥性，保证只有一个线程可以访问修改对象状态的代码段。\n● **原子操作**：如比较并交换内存的操作（比较并交换\
    \ `CAS`）可用于特定的成员变量更新，以确保线程安全的修改。\n● **不可变对象**：在特定场景下，使对象不可变（创建后不可更改）可以通过消除对修改的需求来简化线程安全。\n\
    \n### 使用互斥锁的线程安全计数器（简化示例）：\n\n```cpp\n#include <mutex>\n\nclass Counter {\nprivate:\n\
    \    int value;\n    std::mutex mtx;\n\npublic:\n    void increment() {\n    \
    \    std::lock_guard<std::mutex> lock(mtx);\n        value++;\n    }\n    int\
    \ get() const {\n        std::lock_guard<std::mutex> lock(mtx);\n        return\
    \ value;\n    }\n};\n```\n\n这个示例展示了一个线程安全的计数器类，它使用 `mutex` 在 `increment` 和 `get`\
    \ 操作期间保护成员变量 `value`。\n\n### 高级线程安全技术：\n● **成员函数保护**：创建自动获取和释放互斥锁的成员函数，简化了用法但可能会引入开销。\n\
    ● **双重检查锁定 (Double-Checked Locking)**：这种优化可以用于性能关键的成员变量，但需要细致的设计和内存排序考虑以避免竞态条件。\n"
- fmt: "\n- `Thread-Local Storage`: Utilize thread-local storage for member variables\
    \ that are specific to a thread, reducing contention for shared data.\n\n### Immutable\
    \ Objects for Thread Safety (Simplified Example):\n\n```cpp\nclass Point {\nprivate:\n\
    \    int x, y;\npublic:\n    Point(int x, int y) : x(x), y(y) {}\n    int get_x()\
    \ const { return x; }\n    int get_y() const { return y; }\n};\n```\n\nThis example\
    \ showcases an immutable `Point` class. Since the object's state cannot be modified\
