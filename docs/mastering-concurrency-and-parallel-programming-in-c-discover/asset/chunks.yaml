  trans: "\n\n传统的可变对象允许在创建后更改其内部状态，这会导致复杂性。理解它们的行为变得具有挑战性，特别是在多个线程可能会访问并修改对象状态的并发环境中。\n\
    \n## 引入不可变模式：不可改变的对象\n\n不可变模式规定对象以完全初始化的状态被创建，并且其内部状态在整个生命周期内保持不变。这带来了几个优势：\n\n\
    - **简单性**：理解不可变对象的行为非常直观，因为它的状态不会发生意外变化。\n- **线程安全**：由于状态是固定的，因此不需要像`mutexes`这样的显式同步机制，使得不可变对象本质上是线程安全的。\n\
    - **引用透明性**：不可变对象在传递或复制时行为一致，因为它们的状态保持相同。\n\n## 解锁功能：不可变性技术\n\n以下是实现不可变模式的常用技术一览：\n\
    \n- **final 成员变量**：将成员变量声明为 `final` 以防止在对象初始化后对其进行修改。\n- **拷贝构造函数和赋值运算符**：实现拷贝构造函数和赋值运算符，创建带有复制状态的新对象，而不是修改现有对象。\n\
    - **不可变辅助对象**：在不可变对象内部创建用于特定功能的辅助对象，以促进封装和不可变性。\n\n### 不变 Point 类（简化示例）：\n\n```cpp\n\
    class Point {\nprivate:\n    final int x, y;\npublic:\n    Point(int x, int y)\
    \ : x(x), y(y) {}\n    int get_x() const { return x; }\n    int get_y() const\
    \ { return y; }\n    // 创建一个具有修改坐标的新 Point 对象\n    Point move_x(int delta) const\
    \ {\n        return Point(x + delta, y);\n    }\n};\n```\n\n此示例演示了一个不可变的 `Point`\
    \ 类。成员变量是 `final`，像 `move_x` 这样的方法创建一个具有修改坐标的新 `Point` 对象，而不是更改原始对象。\n\n## 不可变模式的优势与挑战\n\
    \n- **提高推理能力**：不可变对象简化了对程序行为和潜在副作用的理解。\n- **增强线程安全**：不可变性消除了对显式同步的需求，这些对象在并发访问时是安全的。\n\
    - **潜在的性能开销**：与可变对象相比，为修改而创建新对象可能会引入开销。\n\n## 高级技术与考虑\n\n- **深度不可变性**：确保不可变对象内部所有的成员对象也是不可变的，以保证完全的状态不可变性。\n\
    - **构建器模式**：可以使用 `Builder Pattern` 来简化具有许多初始值的复杂不可变对象的创建过程。\n- **性能优化**：可以探索对象池或写时复制（copy-on-write）语义等技术，以优化特定场景下不可变性带来的性能影响。\n\
    \n## 何时考虑不可变模式\n\n- **线程安全**：如果线程安全是首要考虑，不可变对象提供了一种简单有效的方法。\n- **状态管理复杂性**：在管理复杂对象状态时，不可变性可以简化对对象行为的理解并减少潜在错误。\n\
    - **函数式编程风格**：不可变模式与函数式编程原则高度一致，促进不可变性和引用透明性。\n\n## 结论\n\n不可变模式使你能够在 `C++` 中设计出健壮、可维护且线程安全的对象。通过理解这些技术、优势、挑战和高级考虑，你可以明智地决定何时以及如何利用不可变性来增强你的\
    \ `C++` 代码库的质量和安全性。\n\n## 前路：\n\n高级 `C++` 设计的旅程仍在继续。探索函数式编程概念、智能指针等高级内存管理技术，以及针对特定用例的设计模式，如\
    \ `Factory Pattern` 或 `Observer Pattern`。\n\n# 第 11 章：高级主题：协程 (C++20)\n\n## 高级\
    \ C++ 并发：深入理解协程 (C++20)\n\n`C++20` 中协程的引入标志着编写异步非阻塞代码的一次飞跃。本指南探索了协程的高级主题，使你能够编写优雅高效的并发程序。\n\
    \n## 超越基础：解码高级协程概念\n\n虽然 `co_return`、`co_await` 和 `co_yield` 的基础提供了坚实的基础，但高级协程解锁了新的可能性：\n\
    \n- **协程构建器 (Coroutine Builders)**：这些函数简化了协程的创建和管理。像 `Boost.Coroutine2` 这样的库提供了构建器函数，以便更方便使用协程。\n\
    - **承诺对象 (Promise Objects)**：这些对象代表协程的最终结果。它们可用于管理异步操作及其完成状态。\n\n### 使用 Boost.Coroutine2\
    \ 的协程构建器（简化示例）：\n\n```cpp\n#include <boost/coroutine2/coroutine.hpp>\n\nboost::coroutines::coroutine<int>\
    \ coro_function() {\n    int result = 0;\n    // 在此处执行某些异步操作\n    co_await /*\
    \ 等待操作完成 */;\n    // 处理结果\n    result = /* ... */;\n    co_return result;\n}\n\
    \nint main() {\n    auto coro = coro_function();\n    int final_result = coro();\
    \ // 启动并等待协程\n    // 使用 final_result\n    return 0;\n}\n```\n\n此示例演示了一个协程构建器函数\
    \ (`coro_function`) 以及如何结合 `Boost.Coroutine2` 使用来创建和管理协程。\n\n### 用于异步操作的承诺（简化示例）：\n\
    \n```cpp\n#include <future>\n\nstd::future<int> some_async_operation() {\n   \
    \ // 在此处执行某些异步操作\n    ...\n    return std::promise<int>().get_future();\n}\n\n\
    int main() {\n    auto future = some_async_operation();\n    // 在操作进行期间执行其他工作\n\
    \    int result = future.get(); // 等待操作完成并获取结果\n    return 0;\n}\n```\n\n此示例展示了配合\
    \ `std::future` 使用的 `promise` 对象，用于表示异步操作的最终结果。\n\n## 高级协程的优势与挑战\n\n- **提高代码可读性**：协程构建器和可以通过分离协程创建与结果处理来增强代码清晰度。\n\
    - **异步编程抽象**：与原始回调相比，这些特性为异步编程提供了更高层次的抽象。\n- **潜在的复杂性**：引入额外的库和概念可能会增加初始学习复杂度。\n\
    \n## 高级技术与考虑\n\n- **协程流水线 (Coroutine Pipelines)**：将多个协程链联起来创建异步工作流。变变模板等技术可以用于灵活的流水线构建。\n\
    - **错误处理**：考虑通过协程和承诺链传播错误的机制，以实现健壮的错误管理。\n- **上下文管理**：探索使用 `RAII`（资源获取即初始化）技术在协程内管理资源，确保正确清理。\n\
    \n## 何时考虑高级协程\n\n- **复杂的异步工作流**：当你的应用程序涉及复杂的异步操作序列时，协程构建器和流水线可以简化代码结构和管理。\n- **提高代码可读性**：如果代码清晰度是优先级，利用承诺和构建器可以增强异步代码段的可读性。\n\
    - **理解权衡**：在采用高级协程特性之前，仔细评估额外库和概念带来的复杂度开销。\n\n## 结论\n\n`C++20` 中的高级协程为构建复杂的异步应用程序提供了强大的工具。通过理解协程构建器、承诺对象和高级技术，你可以为编写高效可维护的并发代码开启更高层次的控制力和表达力。\n\
    \n"
