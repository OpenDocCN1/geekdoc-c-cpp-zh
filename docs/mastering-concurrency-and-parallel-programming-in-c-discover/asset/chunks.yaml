    # Chapter 5: Mutexes and Condition Variables


    Advanced Concurrency in C++: Mastering Mutexes and Condition Variables


    The realm of multithreaded C++ programming hinges on the ability to coordinate
    access to shared data and manage thread execution flow. This guide delves into
    mutexes and condition variables, two fundamental building blocks for synchronization
    and communication in concurrent programs.


    The Need for Mutual Exclusion:


    Imagine a team working on a shared document. Without proper coordination, inconsistencies
    can arise if multiple members edit it simultaneously. Similarly, in concurrent
    C++, multiple threads can access and modify shared data concurrently, leading
    to data races and unpredictable program behavior.


    Mutexes: Guardians of Shared Data


    Mutexes (Mutual Exclusion objects) act as guardians of shared data. Only one thread
    can acquire the mutex lock at a time, ensuring exclusive access to the critical
    section of code that modifies the protected data. Other threads attempting to
    acquire the lock are blocked until the first thread releases it.


    Unlocking Functionality with std::mutex:


    The <mutex> header provides the std::mutex class for managing mutex locks:


    C++


    #include <iostream>


    #include <mutex>


    std::mutex mtx;


    int shared_data = 0;


    void  increment() {


    std::lock_guard<std::mutex> lock(mtx); // Acquire the lock automatically


    shared_data++; // Critical section: Code modifying shared data


    }


    int  main() {


    std::thread t1(increment);


    std::thread t2(increment);


    t1.join();


    t2.join();


    std::cout << "Final counter value: " << shared_data << std::endl;


    return  0;


    }


    In this example, mtx is a mutex that protects the shared_data variable. The std::lock_guard
    automatically acquires the lock when it''s constructed and releases it when it
    goes out of scope, ensuring proper synchronization.


    Beyond Mutual Exclusion: Communication with Condition Variables


    While mutexes guarantee thread safety, communication between threads is equally
    important. Condition variables act as communication channels within a critical
    section protected by a mutex. Threads can wait on a condition variable, essentially
    going into a "waiting room" until a specific condition is signaled by another
    thread.


    Leveraging std::condition_variable for Coordination:


    The <condition_variable> header provides the std::condition_variable class for
    coordinated execution:


    C++


    #include <iostream>


    #include <thread>


    #include <mutex>


    #include <condition_variable>


    std::mutex mtx;


    bool data_ready = false;


    std::condition_variable cond;


    void  producer() {


    std::lock_guard<std::mutex> lock(mtx);


    // Simulate data production


    data_ready = true;


    cond.notify_one(); // Signal that data is ready


    }


    void  consumer() {


    std::unique_lock<std::mutex> lock(mtx);


    while (!data_ready) {


    cond.wait(lock); // Wait until data is ready


    }


    // Process the data


    }


    int  main() {


    std::thread p(producer);


    std::thread c(consumer);


    p.join();


    c.join();


    return  0;


