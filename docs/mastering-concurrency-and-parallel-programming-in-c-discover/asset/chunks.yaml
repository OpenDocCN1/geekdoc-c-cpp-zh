  trans: "\n\n# 带修改的复制\n创建一个新的集合，其元素从源范围复制，并在复制过程中可能会应用某些修改。\n\n## 简化示例：使用 `std::transform`\
    \ 使元素倍 (C++11):\n\n```cpp\n#include <vector>\n#include <algorithm>\n\nint  main()\
    \ {\n  std::vector<int> data = {1, 2, 3, 4};\n  std::vector<int> doubledData(data.size());\n\
    \  std::transform(data.begin(), data.end(), doubledData.begin(), [](int value)\
    \ { return value * 2; });\n  // 打印翻倍后的元素\n  for (int value : doubledData) {\n\
    \    std::cout << value << \" \";\n  }\n  std::cout << std::endl;\n  return  0;\n\
    }\n```\n\n在此示例中，使用 `std::transform` 应用一个 lambda 函数，将 `data` 向量中的每个元素翻倍，并将结果存储在\
    \ `doubledData` 向量中。\n\n# 归约：聚合你的数据\n\n归约算法将范围内的所有元素合并为一个值。它们提供了一种计算统计数据、执行累加或根据特定标准查找特定元素的简洁方法。\n\
    \n## 归约的核心概念：\n- **源范围**：指定包含要合并元素的范围。\n- **初始值**：定义归约操作的起始值（可选，默认为类型的零值）。\n-\
    \ **归约函数（二元运算符）**：定义用于合并元素对的逻辑逻辑（例如，用于求和的加法，用于寻找最大元素的最大值函数）。\n\n## 常见的归约模式：\n\
    - **求和**：计算范围内所有元素的之和。\n- **乘积**：计算范围内所有元素的乘积。\n- **最小值/最大值**：在范围内找到具有最小值或最大值的元素。\n\
    - **自定义归约**：实现用于合并元素的自定义逻辑，为各种聚合场景提供灵活性。\n\n## 简化示例：使用 `std::accumulate` 计算元素之和\
    \ (C++11):\n\n```cpp\n#include <vector>\n#include <numeric>\n\nint  main() {\n\
    \  std::vector<int> data = {1, 2, 3, 4};\n  int sum = std::accumulate(data.begin(),\
    \ data.end(), 0);\n  std::cout << \"Sum of elements: \" << sum << std::endl;\n\
    \  return  0;\n}\n```\n\n在此示例中，使用 `std::accumulate` 相加 `data` 向量中的所有元素，并将结果存储在\
    \ `sum` 变量中。初始值 `0` 作为第三参数提供。\n\n## 变换与归约的优势：\n- **可读性和可维护性**：通过声明式方式表示数据操作和聚合，这些算法提供了清晰且简洁的代码。\n\
    - **灵活性**：广泛的算法满足各种变换和归约需求，允许针对特定用例进行自定义。\n- **性能优化**：某些 STL 实现可能提供这些算法的优化版本以实现更快的执行。\n\
    \n## 权衡与考虑：\n- **延迟求值的复杂度**：与立即执行相比，延迟求值可能会为某些操作引入额外的开销。\n- **自定义归约**：定义自定义归约函数需要仔细的设计和测试，以确保行为正确。\n\
    \n## 何时考虑变换和归约：\n- **数据操作**：当你需要修改或过滤集合中的元素时，变换算法提供了一种简洁且表达力的方法。\n- **数据聚合**：对于计算统计数据、执行累加或查找特定元素，归约算法提供了总结你数据的强大工具。\n\
    - **提高可读性**：这些算法优先考虑代码的清晰性，使你的数据处理逻辑更容易被理解和维护。\n\n## 结论：\n变换和归约是 C++ 中处理集合的基基石。通过掌握这些模式，你可以编写出高效、可读且富有表达力的代码，在\
    \ C++ 中操纵和总结你的数据。\n\n## 前景：\nSTL 算法的世界提供了广阔的探索领域。深入研究高级主题，例如：\n- **针对排序和分区范围的算法**：探索专门针对排序或分区数据的运行算法，提供更高效的处理。\n\
    - **自定义算法**：虽然 STL 提供了丰富的算法集，但定义自己的自定义算法使你能够应对特定的数据处理需求。\n- **基于范围的 for 循环语法**：利用基于范围的\
    \ for 循环语法，以更简洁、易读的方式遍历集合并应用变换或归约。\n\n记住，变换和归约是你 C++ 数据处理工具箱中宝贵的工具。通过为你的特定需求选择合适的算法并理解权衡，你可以编写出优雅且高性能的代码来处理你的数据集合。\n\
    \n# 在 C++ 中自定义并行算法\n\n## 定制并发性：C++ 并行算法自定义指南\n\nC++ 标准模板库 (STL) 提供了了一套强大的并行算法，但有时你需要超越提供的选项。本指南深入探讨了并行算法的自定义，使你能够编写出高效且可扩展的代码，完美契合你的特定并发需求。\n\
    \n## 超越内置选项：自定义的性\n虽然 STL 提供了一系列并行算法，但在某些情况下：\n- 预定义的算法无法直接支持所需的操作。\n- 你需要对并行化策略进行更细细粒度的控制（例如，任务调度或同步）。\n\
    - 对于你独特的工作负载需要特定的性能优化。\n\n## 自定义方法：\n- **自定义函数对象**：设计自定义函数对象或 lambda 来封装你想并行化的逻辑。然后你可以将它们与\
    \ `std::for_each` 或 `std::transform` 等现有并行算法一起使用。\n- **高层抽象**：如 `TBB` 等库提供了如 `parallel_for`\
    \ 等抽象，允许你定义循环体、任务粒度和调度策略。\n- **手动线程管理**：在高级场景下，你可能会选择使用 `std::thread` 等库直接管理线程，以对并行化和同步进行完全控制。\n\
    \n## 常见的自定义模式：\n- **任务颗粒**：控制每个线程处理的任务单元大小。合适的粒度在线程创建开销与并行带来的潜在收益之间取得平衡。\n- **自定义调度**：根据你的需求优先特定任务或不均匀分配工作。\n\
    - **数据分区**：将你的数据分成更小的块进行并行处理，确保高效的内存访问并避免伪共享问题。\n\n## 简化示例：用于并行字符串变换的自定义对象 (C++11):\n\
    \n```cpp\n#include <thread>\n#include <vector>\n#include <string>\n#include <algorithm>\n\
    \nstruct ToUpper {\n  void  operator()(std::string& str) {\n    std::transform(str.begin(),\
    \ str.end(), str.begin(), ::toupper);\n  }\n};\n\nint  main() {\n  std::vector<std::string>\
    \ strings = {\"hello\", \"world\", \"C++\"};\n  std::vector<std::thread> threads;\n\
    \  for (auto& str : strings) {\n    threads.emplace_back(ToUpper(), std::ref(str));\n\
    \  }\n  for (auto& thread : threads) {\n    thread.join();\n  }\n  // 打印大写后的字符串\n\
    \  for (const  std::string& str : strings) {\n    std::cout << str << \" \";\n\
    \  }\n  std::cout << std::endl;\n  return  0;\n}\n```\n\n在此示例中，使用自定义的 `ToUpper`\
    \ 函数对象并行地将每个字符串转换为大写。每个线程将该对象应用于 `strings` 向量中的字符串引用。\n\n"
