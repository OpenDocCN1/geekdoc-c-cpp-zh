  trans: "\n\nC++ 并发世界提供了一个广阔的探索领域。深入学习如带协程的异步 I/O、信号量等高级同步原语，以及并发程序的测试与调试技术等主题。\n\
    \n# 生成器函数与协作式多任务\n\n## 高级 JavaScript：使用生成器函数掌握协作式多任务\n\nJavaScript 以单线程著称，但可以从模拟多任务的技术中获益。本指南深入探讨生成器函数和协作式多任务，让你能够编写优雅且高效的代码，这些代码看起来在并发执行多个任务。\n\
    \n### 挑战：超越事件循环\n\n虽然 JavaScript 的事件循环在处理异步操作方面表现出色，但并不是真正的多任务。在等待 I/O 或定时器时代码执行会暂停，但一次只有一个任务在运行。这在频繁进行异步操作的场景中可能会限制响应能力。\n\
    \n### 引入生成器函数：暂停和恢复执行\n\n生成器函数是 JavaScript 中的一项强大功能，允许你在特定点暂停和恢复执行。它们将控制权交还给引擎，允许其他代码的执行，然后在需要时恢复。这创造了并发执行的错觉。\n\
    \n### 解锁功能：协作式多任务的模式\n\n以下是生成器函数如何促进协作多任务的概述：\n\n● **交出控制权**：`yield` 关键字会暂停生成器函数的执行并向调用者返回一个值。之后可以恢复生成器以从\
    \ yield 点继续执行。\n\n● **协作式调度**：通过交出控制权并允许其他代码运行，生成器函数实现了协作式的多任务方法。何时恢复生成器的决定权取决于控制它的代码。\n\
    \n#### 使用生成器的简单文件读取器（简化示例）：\n\n```javascript\nfunction* readFileLineByLine(filename)\
    \ {\n  const reader = new FileReader();\n  reader.readAsText(filename);\n  yield\
    \  new Promise((resolve, reject) => {\n    reader.onload = () => resolve(reader.result);\n\
    \    reader.onerror = reject;\n  });\n  for (const line of reader.result.split('\\\
    n')) {\n    yield line;\n  }\n}\n\nasync function main() {\n  const reader = readFileLineByLine('myfile.txt');\n\
    \  let line;\n  while ((line = await reader.next()) !== undefined) {\n    console.log(line);\n\
    \  }\n}\n\nmain();\n```\n\n此示例展示了一个生成器函数 `readFileLineByLine`，它在启动文件读取操作后交出控制权，并在读取每一行时再次交出控制权。`main`\
    \ 函数异步地遍历产生出的值，模拟了一个逐行读取的过程，该过程看起来似乎与其他代码的执行并发发生。\n\n### 协作式多任务的优势与权衡：\n\n● **提高可读性**：生成器函数可以创建出类似于顺序执行的代码，同时处理异步操作，从而增强了可读性。\n\
    \n● **更简单的错误处理**：错误可以通过生成器传播，与基于回调的方法相比，这简化了错误处理。\n\n● **有限的控制力**：控制代码决定了何时恢复生成器，这与抢占式多任务相比，限制了精细粒度的控制。\n\
    \n### 高级技术与注意事项：\n\n● **通道 (Channels)**：像 `Redux-Saga` 或 `generator-chan` 这样的库提供了通道通信机制，允许生成器通过发送和接收消息进行更复杂的协作。\n\
    \n● **使用 `try...finally` 进行错误处理**：在生成器内部使用 `try...finally` 块，以确保即使发生异常也能进行适当的资源清理。\n\
    \n● **性能考量**：虽然协作式多任务提高了响应能力，但对于高度密集的任务，它可能不是性能最优。\n\n### 何时考虑生成器函数和协作式多任务：\n\n\
    ● **异步工作流**：在处理顺序的异步操作时，生成器可以简化代码结构并提高可读性。\n\n● **模拟并发**：如果你的应用程序需要处理多个看起来在并发运行的异步任务，生成器函数提供了一个很好的方法。\n\
    \n● **理解权衡**：在采用生成器协作式多任务之前，要仔细评估控制和性能方面的潜在局限性。\n\n### 结论：\n\n生成器函数是管理 JavaScript\
    \ 中异步任务的强大工具。通过理解它们如何实现协作式多任务，你可以编写更整洁、更易读的代码，在 JavaScript 的单线程环境中高效处理类并发操作。\n\
    \n### 前行之路：\n\n高级 JavaScript 并发的旅程仍在继续。探索诸如使用 `async/await` 的异步控制流、用于管理异步操作的 `promises`\
    \ 以及用于在特定场景下实现真正并行的 `web workers` 等主题。\n\n# 高级协程技术\n\n## 高级协程技术：解锁力量与效率\n\n协程已成为各种编程语言中编写异步非阻塞代码的基石。本指南深入探讨高级协程技术，让你能够编写优雅、高效且健壮的并发程序。\n\
    \n### 超越基础：揭示高级协程概念\n\n虽然核心协程功能提供了坚的基础，但高级技术解锁了新的可能性：\n\n● **协程层级**：通过从父协程启动子协程来结构化复杂的工作流。这使得创建分层执行模式成为可能。\n\
    \n● **取消**：在协程完成之前优雅地终止，允许进行适当的资源清理并处理意外事件。\n\n● **通道 (Channels)**：在协程之间建立通信通道，用于并发任务中的数据交换、同步和协作。\n\
    \n#### 带取消功能的协程层级（简化示例）：\n\n```python\nasync def parent_coroutine():\n  try:\n\
    \    child_1 = asyncio.create_task(child_coroutine(1))\n    child_2 = asyncio.create_task(child_coroutine(2))\n\
    \    await child_1# 等待 child_1 完成\n    await child_2# 等待 child_2 完成\n  except\
    \ asyncio.CancelledError:\n    print(\"父协程被取消\")\n    # 处理取消逻辑\n\nasync def child_coroutine(id):\n\
    \  # 模拟某些工作\n  await asyncio.sleep(1)\n  print(f\"子协程 {id} 完成\")\n\nasyncio.run(parent_coroutine())\n\
    ```\n\n此示例展示了一个父协程启动子协程并等待其完成的过程。父协程中包含了取消逻辑以展示如何处理意外终止。\n\n#### 用于协程通信的通道（简化示例）：\n\
    \n```go\npackage main\n\nimport (\n  \"fmt\"\n)\n\nfunc worker(id int, ch chan\
    \ int) {\n  // 模拟某些工作\n  fmt.Printf(\"Worker %d 开始\\n\", id)\n  <-ch // 等待通道信号\n\
    \  fmt.Printf(\"Worker %d 完成\\n\", id)\n}\n\nfunc main() {\n  ch := make(chan\
    \ int)\n  for i := 0; i < 3; i++ {\n    go worker(i+1, ch)\n  }\n  // 在主协程中模拟某些工作\n\
    \  ...\n  for i := 0; i < 3; i++ {\n    ch <- 1 // 向每个 worker 发送信号\n  }\n  fmt.Println(\"\
    等待 worker 完成...\")\n  time.Sleep(time.Second) // 等待 worker 完成\n}\n```\n\n此示例展示了\
    \ `Go` 中用于协程（程）之间通信的通道。worker 在继续执行之前等待通道上的信号。\n\n### 高级协程的优势与权衡：\n\n● **增强的控制流**：协程层级和取消允许对并发工作流进行复杂的控制，并优雅地处理意外情况。\n\
    \n● **改进的协作**：通道为协程之间的数据交换和同步提供了健壮的通信机制，促进了并发任务中的协作。\n\n● **潜在的复杂性**：引入复杂的层级和通信机制可能会增加某些语言的初始学习复杂度。\n\
    \n"
