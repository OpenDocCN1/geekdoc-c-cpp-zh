    \ Approach\n\nThe `Michael-Scott Queue` is a lock-free concurrent queue algorithm.\
    \ It eliminates the need for explicit locks by using atomic operations and node\
    \ reference counting to maintain consistency. This leads to potentially better\
    \ performance compared to traditionally locked queues, especially in scenarios\
    \ with high contention.\n\n### Unlocking Functionality: Understanding the Algorithm\n\
    \nThe `Michael-Scott Queue` relies on two key components:\n\n- **Atomic Operations**:\
