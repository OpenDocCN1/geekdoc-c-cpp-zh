    \ << std::endl;\n  return 0;\n}\n```\n\n此示例展示了启动多个异步任务并使用 `std::when_all` 等待它们全部完成。\n\
    \n### 高 Future 用用的优点与权衡：\n\n-   **组合工作流**：Future 链允许创建具有依赖关系的复杂异步工作流。\n-   **健壮的错误处理**：高级技术允许在\
