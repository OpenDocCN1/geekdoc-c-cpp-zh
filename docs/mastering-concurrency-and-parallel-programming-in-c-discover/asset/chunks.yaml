    ## 附录 A：时间库


    `<ctime>` 头文件提供了一组用于处理 C++ 中时间与日期信息的函数。虽然它们不是专门为多线程环境设计的，但理解这些函数对于许多 C++ 并发应用至关重要。本附录为专家级程序员简要概述
    C++ 中重要的时间相关函数。


    ### 基础时间函数


    ● `time_t time(time_t* timer);`：返回自纪元（1970 年 1 月 1 日 00:00:00 UTC）以来经过的秒数作为当前日历时间。


    **注意**：`time` 不是线程安全的。如果多个线程同时调用 `time`，它们可能会覆盖 `timer` 参数所指向的值，导致意外结果。在现代 C++
    中，请考虑使用 `std::chrono::high_resolution_clock::now` 等替代方案进行线程安全的计时测量。


    ● `char* ctime(const time_t* timer);`：将 `timer` 指向的日历时间转换为可读的字符串表示（例如 "Sun Jul
    14 12:50:23 2024"）。


    **线程安全考虑**：`ctime` 的返回值指向库内部的静态分配缓冲区。多个线程的并发调用可能会覆盖此缓冲区，导致数据损坏。在多线程环境中使用 `ctime`
    时要小心。必要时考虑将返回的字符串存储在线程安全的位置。


    ### 高级时间函数


    ● `struct tm* localtime(const time_t* timer);`：将 `timer` 指向的日历时间转换为拆分结构体 (`tm`)，其中包含年、月、日、时、分、秒等独立组件。


    **线程安全考虑**：与 `ctime` 类似，`localtime` 也返回一个指向静态分配缓冲区的指针。注意多线程场景下潜在的数据损坏。必要时将返回的结构体存储在线程安全的位置。


    ● `char* strftime(char* str, size_t maxsize, const char* format, const tm* timeptr);`：根据用户指定的格式字符串
    (`format`) 对时间和日期进行格式化，并将结果存储在 `str` 缓冲区中。`timeptr` 参数指向包含时间和日期组件的 `tm` 结构体。


    **线程安全考虑**：`strftime` 函数本身是线程安全的。然而，请确保 `str` 缓冲区是线程安全的，并且有足够的空间 (`maxsize`) 来容纳格式化后的输出。


    ### 结论


    `<ctime>` 库提供了处理 C++ 中时间和日期信息的本质函数。然而，请注意与 `ctime` 和 `localtime` 等函数相关的线程安全局限性。在现代
    C++ 中，对于多线程环境下的操作，请考虑使用 `<chrono>` 头中的线程安全替代方案。记住，理解这些时间函数的功能和陷阱对于处理并发的专家 C++
    程序员至关重要。


    # 附录 B：C++ 内存 - 概述


    虽然同步和线程安全在并发编程中至关重要，但理解内存管理对于专家级程序员仍然是必须的。本附录提供了 C++ 内存管理的高级概述，重点关注多线程编程相关的概念。


    ### 栈与堆


    ● **栈 (Stack)**：一种后进先出 (LIFO) 数据结构，用于局部变量、函数参数和返回地址。栈上的内存在函数进入和退出时自动分配和释放，使其具有线程安全性，但大小和生命周期受到限制。

    ● **堆 (Heap)**：由程序管理的动态分配内存池。开发者使用 `new` 和 `delete` 运算符显式地分配和释放内存。堆提供了更大的灵活性，但需要仔细管理以避免内存泄漏和悬指针（指向已释放内存的指针）。


    ### 线程安全考虑


    ● **线程本地存储 (TLS)**：C++ 标准库（自 C++11 起）提供了线程本地存储（TLS）机制。TLS 允许每个线程在堆上拥有自己的私有分配空间，确保了使用
    TLS 分配数据的线程安全。

    ● **内存分配与释放**：在多线程环境中使用动态内存分配时，同步至关重要。并发访问或释放单个堆位置的内存会导致数据损坏。利用同步原语（如 `mutexes`）保护多线程场景中的堆操作。


