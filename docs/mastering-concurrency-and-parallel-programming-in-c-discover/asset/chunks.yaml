    update to shared_data becomes visible to the consumer thread before the data_ready
    flag is set. Conversely, std::memory_order_acquire in the consumer ensures the
    consumer reads the updated value of shared_data only after it sees the data_ready
    flag set.


    Memory Fences: Enforcing Ordering Across Operations


    Memory fences act as barriers within a thread, enforcing specific memory orderings
    for operations on either side of the fence. They don''t perform any synchronization
    themselves but guarantee that certain memory accesses happen before or after the
    fence.


