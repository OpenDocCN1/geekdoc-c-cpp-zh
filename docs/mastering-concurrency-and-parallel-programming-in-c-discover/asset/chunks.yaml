    \ isn't).\n\n### Simplified Example: Producer-Consumer with Condition Variables\
    \ (C++11):\n\n```cpp\n#include <thread>\n#include <mutex>\n#include <condition_variable>\n\
    #include <queue>\n\nstd::mutex mtx;\nstd::condition_variable cv;\nstd::queue<int>\
    \ data;\nbool newData = false;\n\nvoid producer() {\n    for (int i = 0; i < 10;\
    \ ++i) {\n        std::lock_guard<std::mutex> lock(mtx);\n        data.push(i);\n\
    \        newData = true;\n        cv.notify_one(); // Signal the consumer\n  \
    \  }\n}\n\nvoid consumer() {\n    while (true) {\n        std::unique_lock<std::mutex>\
