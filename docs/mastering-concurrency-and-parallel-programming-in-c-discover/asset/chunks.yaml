    \    std::cout << \"Final counter value: \" << counter << std::endl;\n    return\
    \ 0;\n}\n```\n\nIn this example, the `mtx` mutex protects the `counter` variable.\
    \ The `std::lock_guard` object automatically acquires the lock when it's constructed\
    \ and releases it when it goes out of scope, ensuring proper synchronization.\n\
    \n### Beyond the Basics: Thread Pools and Work Queues\nWhile creating individual\
    \ threads offers flexibility, managing numerous threads can become cumbersome.\
    \ Thread pools and work queues provide a more efficient approach. A thread pool\
    \ maintains a fixed number of worker threads that can execute tasks submitted\
    \ to a work queue. This simplifies thread management and resource utilization.\n"
