    \ Exclusion objects）充当共享数据的守护者。一次只有一个线程可以获取互斥锁，确保对修改受保护数据的临界区域进行独占访问。其他尝试获取锁的线程将被阻塞，直到第一个线程释放它。\n\
    \n### 使用 std::mutex 实现锁定功能\n\n`<mutex>` 头文件提供了 `std::mutex` 类来管理互斥锁：\n\n```cpp\n\
