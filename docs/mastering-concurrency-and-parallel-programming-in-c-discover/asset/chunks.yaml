    ● std::atomic_thread_fence(order): Enforces the specified memory order for all
    memory accesses in the current thread before and after the fence.


    ● std::atomic_signal_fence(order): Ensures all memory accesses before the fence
    become visible to other threads that perform subsequent acquiring operations.


    ●     std::atomic_fence(order): Combines both std::atomic_thread_fence and std::atomic_signal_fence
