    \    c. `std::execution::par_vectorized`：并行且向量执行（如果硬件支持）。\n- 自定义执行策略：高级用户可以根据特定的并发需求创建自定义执行策略。如\
    \ `TBB` (Threading Building Blocks) 等库通常提供对执行策略更更细粒度的控制。\n- 任务粒度：分配到线程的工作单元大小会显著影响性能。探索任务拆分或动态调整等技术，为你的算法和工作负载找到最佳粒度。\n\
    \n### 定制模式：使用 TBB 进行粒度控制\n\n```cpp\n#include <tbb/task_group.h>\n#include <vector>\n\
    \nvoid process_element(int element, size_t threshold) {\n    // 对元素执行某些操作\n  \
    \  if (element > threshold) {\n        // 如果元素值超过阈值，则拆分任务\n        tbb::split;\n\
    \    }\n}\n\nint main() {\n    std::vector<int> data = {10, 5, 15, 2, 20};\n \
    \   size_t threshold = 10;\n    tbb::task_group group;\n    group.run([&data,\
    \ threshold] {\n        tbb::parallel_for(data.begin(), data.end(),\n        \
    \    tbb::make_policy<decltype(process_element)>(process_element, threshold));\n\
    \    });\n    group.wait();\n    return 0;\n}\n```\n\n在此示例中，`TBB` 的 `parallel_for`\
    \ 配合自定义策略使用，该策略根据元素阈值动态拆分任务。这有助于控制工作负载分布并可能提高性能。\n\n### 定制的优势与权衡：\n\n- 性能优化：通过将算法行为定制到特定的工作负载，仔细的定制可以显著提升性能。\n\
    - 增加复杂度：定制算法增加了复杂性，并要求对并发概念有更深入理解。\n- 可移植性考虑：使用 `TBB` 等库的自定义解决方案可能没有标准 `STL` 算法那样可移植。\n\
    \n### 高级定制技术：\n\n- 数据分区：探索分区数据以进行高效并行处理的技术，特别是对于具有不规则访问模式的算法。\n- 线程本地存储：利用线程本地存储来减少并行执行期间频繁内存访问带来的开销。\n\
    - 工作窃取（Work Stealing）：考虑工作窃取技术以平衡线程之间的工作负载并提高整体效率。\n\n### 何时考虑定制并行算法：\n\n- 性能瓶颈：如果你在并行代码中识别了性能瓶颈，可能需要进行定制来解锁进一步的优化。\n\
    - 特定的工作负载特性：在处理特定的数据访问模式或工作负载特性时，定制可以帮助调整算法以获得最佳性能。\n- 理解权衡：在定制并行算法之前，仔细评估潜在的性能收益与增加的复杂性以及潜在的可移植性问题之间的平衡。\n\
    \n### 结论：\n\n定制并行算法让你能够针对 C++ 的特定用例微调 `STL` 的能力。通过理解涉及的技术、优势和权衡，你可以设计出有效利用多核处理器的高性能并发程序。\n\
    \n### 前路展望：\n\n高级 C++ 并发的之旅仍在继续。探索高级执行策略、自定义任务调度器、并发数据结构（例如并发队列）以及用于底层并行执行控制的同步原语等。\n\
    \n# 第 9 章：设计并发数据结构\n\n## 高级 C++ 并发：构建线程安全的数据结构\n\nC++ 编程领域需要高效管理数据，特别是在多线程环境中。本指南深入探讨并发数据结构的设计，使能够构建用于线程访问的安全且高效的数据结构。\n\
    \n### 挑战：超越传统数据结构\n\n标准数据结构（如数组或链表）可能并不适用于多线程并发访问。对每个操作使用互斥可能会引入巨大的开销。\n\n###\
    \ 引入并发数据结构：线程安全的访问\n\n并发数据结构专门设计用于多个线程同时访问和修改，同时维护数据的完整性。它们利用原子操作和同步机制来确保线程安全。\n\
    \n- 原子性：如比较并交换（`CAS`）等操作被用于确保一次只有一个线程可以修改数据结构。\n- 互斥锁（Mutexes）：互斥锁提供互斥访问，确保只有一个线程可以访问修改数据结构的关键区域。然而，过度使用会引入开销。\n\
    \n"
