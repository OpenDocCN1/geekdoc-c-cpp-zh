    \ `std::when_all` 或自定义实现等技术允许等待多个 futures 并发完成，或等待第一个完成。\n\n### 带有错误处理的 Future\
    \ 链（简化示例）：\n\n```cpp++\n#include <future>\n\nint operation1(int x) {\n  // 模拟一些工作\n\
    \  return x * 2;\n}\n\nint operation2(int y) {\n  // 模拟一些工作\n  if (y < 0) {\n\
    \    throw std::runtime_error(\"y must be non-negative\");\n  }\n  return y *\
    \ y;\n}\n\nint main() {\n  std::future<int> future1 = std::async(operation1, 5);\n\
    \  try {\n    int result1 = future1.get();\n    std::future<int> future2 = std::async(operation2,\
    \ result1);\n    int result2 = future2.get();\n    std::cout << \"Final result:\
    \ \" << result2 << std::endl;\n  } catch (const std::exception& e) {\n    std::cerr\
    \ << \"Error: \" << e.what() << std::endl;\n  }\n  return 0;\n}\n```\n\n此示例演示了\
    \ future 链，其中 `operation2` 将 `operation1` 的结果作为输入。异常在 `operation2` 中抛出并在 `main`\
    \ 函数中捕获，展示了链中的错误处理。\n\n### 合并 Futures 以获得更多控制（简化示例）：\n\n```cpp++\n#include <future>\n\
    \nstd::vector<std::future<int>> launch_multiple_tasks(int num_tasks) {\n  std::vector<std::future<int>>\
