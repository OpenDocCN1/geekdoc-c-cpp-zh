    - 基于策略的执行（可选）：某些执行器允许配置线程池大小和调度策略。\n\n### async 函数：启动异步任务\n\n`async` 函数仍然是启动异步任务的主要工具。以下是它如何与执行器交互的：\n\
    \n- 结合执行器的 async：你可以将执行器对象作为第二个参数传递给 `async`。这指示 `async` 将任务提交给指定的执行器进行执行。\n-\
    \ Future 对象：无论是否使用执行器，`async` 都会返回一个 `std::future` 对象。可以使用此 future 来获取任务结果、检查其状态，或可能将其取消（取决于执行器的具体实现）。\n\
    \n### 执行器与 Async 的常见模式：\n\n- 简单的异步任务提交：使用带执行器的 `async` 提交单个异步任务。执行器处理执行，而 `future`\
    \ 对象允许你稍后获取结果。\n- 异步任务链链：将已完成任务的 `future` 对象作为新 `async` 调用的依赖项。这创建了一个异步操作序列，其中每个任务都依赖于前一个任务的结果。\n\
    - 取消：如果执行器支持取消功能，你可以使用 `future` 对象在关联的异步任务完成之前尝试取消它。\n\n### 简化示例：使用执行器的链式异步下载（C++23\
    \ 模拟）：\n\n```cpp\n#include <iostream>\n#include <future>\n\n// 模拟可能产生错误的异步下载\n\
    std::future<std::string> downloadFile(const std::string& url) {\n    if (url ==\
    \ \"error_url\") {\n        throw std::runtime_error(\"Download failed!\");\n\
    \    }\n    // 模拟下载时间\n    std::this_thread::sleep_for(std::chrono::seconds(2));\n\
    \    return std::string(\"Downloaded content from \") + url;\n}\n\n// 带有 spawn()\
    \ 函数的执行器（模拟 C++23 ）\nclass SimpleExecutor {\npublic:\n    template <typename Callable>\n\
    \    auto spawn(Callable&& task) -> decltype(task()) {\n        // 模拟执行器行为：将任务提交给线程池\n\
    \        // (为了简单起见隐藏了实现细节)\n        return std::future<decltype(task())>(std::async(std::launch::async,\
    \ std::forward<Callable>(task)));\n    }\n};\n\nint main() {\n    SimpleExecutor\
    \ executor;\n    // 异步下载文件 1\n    std::future<std::string> future1 = executor.spawn(downloadFile,\
    \ \"url1.com\");\n    // 链式另一个依赖 future1 结果的下载任务\n    std::future<std::string>\
    \ future2 = executor.spawn([&future1] {\n        if (future1.status() == std::future_status::ready)\
    \ {\n            try {\n                std::string content1 = future1.get();\n\
    \                return content1 + \"\\nDownloaded content from url2.com\";\n\
    \            } catch (const std::exception& e) {\n                return \"Error\
    \ in first download: \" + e.what();\n            }\n        } else {\n       \
    \     return \"Download 1 not ready yet\";\n        }\n    });\n\n    // 从 futures\
    \ 中获取结果\n    if (future1.status() == std::future_status::ready) {\n        try\
    \ {\n            std::cout << future1.get() << std::endl;\n        } catch (const\
    \ std::exception& e) {\n            std::cerr << e.what() << std::endl;\n    \
    \    }\n    }\n}\n```\n\n# 自定义执行器\n\n### 定制化异步工作：在 C++ 中自定义执行器（预计 C++23）\n\n执行器概念（预计\
    \ C++23 引入）为管理异步工作提供了强大的抽象。虽然标准执行器提供了基础，但特定的用例可能需要自定义。本指南探讨了创建自定义执行器的模式，深入研究了考虑因素、权衡和以定制执行行为的最佳实践。\n\
    \n### 标准执行器：异步工作的基础\n\nC++ 标准库预计将提供各种执行器类型，例如 `std::thread_pool` 和 `std::cached_executor`。这些执行器提供了基本的调度和线程池管理。\n\
    \n### 自定义的需求\n\n虽然标准执行器非常通用，但特定场景可能需要自定义：\n\n- 细粒度线程管理：标准执行器可能无法控制线程创建或销毁策略。\n\
    - 特殊调度策略：你可能需要自定义调度算法来处理任务优先级或限流。\n- 与现有线程池集成：某些应用程序已经管理了线程池，将执行器与它们集成可能会很有益处。\n\
    \n### 自定义执行器的模式\n\n以下是创建自定义执行器的常用方法：\n\n- 继承 Executor：`Executor` 接口（预计 C++23 引入）是自定义执行器的基类型。你可以继承此接口并实现\
    \ `spawn` 方法，以定义如何提交和执行任务。\n- 组合与适配器：你可以通过组合现有的执行器或标准库组件（如带有自定义逻辑的 `std::async`）来创建自定义执行器。适配器可以连接自定义执行行为与\
    \ `Executor` 接口。\n- 利用第三方库：`asio` 等现有异步编程库可能提供类似执行器的抽象，可以对其进行适配或扩展以创建自定义执行器。\n\
    \n### 设计自定义执行器\n\n在设计自定义执行器时，请考虑以下因素：\n\n- 线程池管理：决定线程创建、销毁和生命周期管理策略。\n- 调度策略：如果标准调度不足，请实现自定义调度算法。这可能涉及优先级队列或自定义的任务排序逻辑。\n\
    \n"
