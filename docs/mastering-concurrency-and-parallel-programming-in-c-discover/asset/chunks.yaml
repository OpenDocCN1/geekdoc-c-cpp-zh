  trans: "\n\n- `Thread-Local Storage`：利用线程本地存储来处理特定线程的成员变量，减少对共享数据的竞争。\n\n### 用于线程安全的不可变对象（简化示例）：\n\
    \n```cpp\nclass Point {\nprivate:\n    int x, y;\npublic:\n    Point(int x, int\
    \ y) : x(x), y(y) {}\n    int get_x() const { return x; }\n    int get_y() const\
    \ { return y; }\n};\n```\n\n此示例展示了一个不可变的 `Point` 类。由于对象的状态在创建后无法被修改，因此固有保证了线程安全，不需要显式的同步。\n\
    \n### 线程安全类的优势与权衡：\n\n- `数据完整性`：线程安全的类确保即使多个线程并发访问，对象的状态也能保持一致。\n- `性能考量`：`Mutexes`\
    \ 和 `atomic` 操作可能会引入开销。请根据您的应用程序需求评估安全性与性能之间的权衡。\n- `复杂度`：与非安全的类相比，设计和推理线程安全的类需要对并发概念有良好的理解。\n\
    \n### 高级技术与考虑：\n\n- `友元类与线程安全`：在授予友元类访问成员变量或函数时，请仔细考虑对线程安全的影响。\n- `静态成员变量`：静态成员变量需要额外关注线程安全，因为它们被类的所有实例共享。\n\
    - `线程特定数据`：诸如线程本地存储等技术可以与线程安全的类结合，用于管理对象内的线程特定数据。\n\n### 何时实现线程安全的类：\n\n- `多线程应用程序`：如果您的应用程序涉及多个线程对对象的并发访问，请考虑实现线程安全的类以确保数据完整性。\n\
    - `可重用性`：通过设计线程安全的类，您可以创建可以在并发环境中安全使用的可重用组件。\n- `理解权衡`：在为类实现线程安全之前，仔细评估复杂性和潜在的性能开销。\n\
    \n### 结论：\n\n实现线程安全的类让您能够构建健壮且可靠的 `C++` 对象，这些对象可以在多线程应用程序中有效使用。通过理解设计模式、优势、权衡和高级技术，您可以对如何创建在代码库中平衡安全性、性能和维护性的线程安全类做出明智决策。\n\
    \n### 前行之路：\n\n高级 `C++` 并发的旅程仍在继续。探索诸如线程安全集合（例如 `concurrent maps` 和 `sets`）、高级同步原语（例如\
    \ `condition variables`）以及用于自动清理同步资源的 `RAII`（资源获取获取即初始化）等主题。\n\n# 线程特定数据模式\n\n\
    高级 C++ 并发：利用线程特定数据模式\n\n在 `C++` 编程的多线程领域，高效地管理线程特定数据至关重要。本指南将深入探讨`线程特定数据`（`TSD`）模式，这是一种强大的方法，可以在不需要显式传递或使用全局变量的情况下，将数据与单个线程关联。\n\
    \n### 挑战：管理线程特定状态\n\n管理线程特定数据的传统方法涉及将数据结构传递给函数或依赖全局变量。这些方法可能非常繁琐、容易出错并导致命名冲突。\n\
    \n### 引入线程特定数据模式：线程本地存储\n\n`TSD` 模式利用操作系统提供的线程本地存储（`TLS`）。`TLS` 允许每个线程拥有自己的私有变量存储区域。这使得您能够：\n\
    \n- 在线程整个生命周期内将数据与线程关联。\n- 从任何线程函数访问这些数据，而无需显式传递。\n- 避免与全局变量相关的竞态和数据损坏问题。\n\n\
    ### 解锁功能：线程特定数据的技术\n\n以下是实现 `TSD` 模式的常用技术：\n\n- `平台特定 API`：操作系统提供了分配和访问线程本地存储的\
    \ API。这些 API 可能是底层的，可能需要特定平台的实现。\n- `C++ 库`：如 `Boost.Thread` 或 `Pthreads` 等库为线程本地存储提供了更高层次的抽象，简化了在\
    \ `C++` 中使用 `TSD` 模式。\n\n### 使用 Pthreads 的 TSD（简化示例）：\n\n```cpp\n#include <pthread.h>\n\
    \npthread_key_t key;\n\nvoid* thread_function(void* arg) {\n    // 访问存储在 key 中的线程特定数据\n\
    \    int* data = (int*) pthread_getspecific(key);\n    // 使用数据\n    ...\n    return\
    \ nullptr;\n}\n\nint main() {\n    pthread_key_create(&key, nullptr);\n    int\
    \ value = 10;\n    pthread_setspecific(key, &value);\n    // 使用 thread_function\
    \ 创建并运行线程\n    pthread_join(...); // 等线程完成\n    pthread_key_delete(key);\n   \
    \ return 0;\n}\n```\n\n在这个简化示例中，`Pthreads` 的 `pthread_key_create`、`pthread_getspecific`\
    \ 和 `pthread_setspecific` 分别用于创建线程特定键、获取当前线程关联的数据以及为当前线程设置数据。\n\n### TSD 模式的优势与权衡：\n\
    \n- `线程局部性`：数据特定于线程，简化了访问并避免了竞态。\n- `降低耦合`：函数不需要显式接收线程特定数据，提高了代码清晰度。\n- `可移植性限制`：平台特定的\
    \ API 可能需要针对不同的操作系统进行适配。\n\n### 高级技术与考虑：\n\n- `线程初始化与清理`：考虑在线程创建和销毁时使用技术来初始化和清理线程特定数据。\n\
    - `线程池与 TSD`：在线程池中使用 `TSD` 时要小心，因为线程可能会被重用，需要在重用前进行适当的数据清理。\n- `替代方案`：在特定场景下，探索如函数对象（functors）或依赖注入等管理线程特定状态的替代方法。\n\
    \n### 何时考虑线程特定数据模式：\n\n- `线程特定状态管理`：如果您的应用程序需要在线程整个生命周期内管理特定于线程的数据，`TSD` 模式提供了一种方便的方法。\n\
    - `减少代码复杂度`：当函数严重依赖线程特定数据时，使用 `TSD` 可以减少显式数据传递并提高代码可读性。\n- `理解权衡`：在采用 `TSD` 模式之前，仔细评估可移植性影响和潜在的复杂度。\n\
    \n### 结论：\n\n线程特定数据模式让您能够在 `C++` 应用程序中有效地管理线程特定状态。通过理解技术、优势、权衡和高级考虑，您可以对何时以及如何利用\
    \ `TSD` 构建更整洁、易于维护且线程并发代码做出明智决策。\n\n"
- fmt: "\nTraditional mutable objects, where internal state can be changed after creation,\
    \ can lead to complexities. Reasoning about their behavior becomes challenging,\
    \ especially in concurrent environments where multiple threads might access and\
    \ modify the object's state.\n\n## Enter the Immutable Pattern: Unchangeable Objects\n\
    \nThe Immutable Pattern dictates that objects are created in a fully initialized\
    \ state and their internal state remains constant throughout their lifetime. This\
    \ offers several advantages:\n\n- **Simplicity**: Reasoning about the behavior\
    \ of an immutable object is straightforward, as its state cannot change unexpectedly.\n\
    - **Thread Safety**: Since the state is fixed, there's no need for explicit synchronization\
    \ mechanisms like `mutexes`, making immutable objects inherently thread-safe.\n\
    - **Referential Transparency**: Immutable objects behave consistently when passed\
    \ around or copied, as their state remains the same.\n\n## Unlocking Functionality:\
    \ Techniques for Immutability\n\nHere's a glimpse into common techniques for implementing\
    \ the Immutable Pattern:\n\n- **Final Member Variables**: Declare member variables\
    \ as `final` to prevent their modification after object initialization.\n- **Copy\
    \ Constructors and Assignment Operators**: Implement copy constructors and assignment\
    \ operators that create new objects with copied state, instead of modifying the\
    \ existing object.\n- **Immutable Helper Objects**: Create helper objects within\
    \ the immutable object for specific functionalities, promoting encapsulation and\
    \ immutability.\n\n### Immutable Point Class (Simplified Example):\n\n```cpp\n\
    class Point {\nprivate:\n    final int x, y;\npublic:\n    Point(int x, int y)\
    \ : x(x), y(y) {}\n    int get_x() const { return x; }\n    int get_y() const\
    \ { return y; }\n    // Create a new Point object with a modified coordinate\n\
    \    Point move_x(int delta) const {\n        return Point(x + delta, y);\n  \
    \  }\n};\n```\n\nThis example demonstrates an immutable `Point` class. Member\
    \ variables are `final`, and methods like `move_x` create a new `Point` object\
    \ with the modified coordinate instead of changing the original object.\n\n##\
    \ Benefits and Trade-offs of the Immutable Pattern\n\n- **Improved Reasoning**:\
    \ Immutable objects simplify reasoning about program behavior and potential side\
    \ effects.\n- **Enhanced Thread Safety**: Immutability eliminates the need for\
    \ explicit synchronization, making these objects safe for concurrent access.\n\
    - **Potential Performance Overhead**: Creating new objects for modifications might\
    \ introduce overhead compared to mutable objects.\n\n## Advanced Techniques and\
    \ Considerations\n\n- **Deep Immutability**: Ensure all member objects within\
    \ an immutable object are also immutable to guarantee complete state immutability.\n\
    - **Builder Pattern**: The `Builder Pattern` can be used to simplify the creation\
    \ of complex immutable objects with many initial values.\n- **Performance Optimization**:\
    \ Techniques like object pooling or copy-on-write semantics can be explored to\
    \ optimize performance implications of immutability in specific scenarios.\n\n\
    ## When to Consider the Immutable Pattern\n\n- **Thread Safety**: If thread safety\
    \ is a primary concern, immutable objects offer a simple and effective approach.\n\
    - **State Management Complexity**: When managing complex object state, immutability\
    \ can simplify reasoning about object behavior and reduce potential errors.\n\
    - **Functional Programming Style**: The Immutable Pattern aligns well with functional\
    \ programming principles, promoting immutability and referential transparency.\n\
    \n## Conclusion\n\nThe Immutable Pattern empowers you to design robust, maintainable,\
    \ and thread-safe objects in `C++. By understanding the techniques, benefits,\
    \ trade-offs, and advanced considerations, you can make informed decisions about\
    \ when and how to leverage immutability to enhance the quality and safety of your\
    \ `C++` codebase.\n\n## The Road Ahead:\n\nThe journey into advanced `C++` design\
    \ continues. Explore topics like functional programming concepts, advanced memory\
    \ management techniques like smart pointers, and design patterns for specific\
    \ use cases like the `Factory Pattern` or the `Observer Pattern`.\n\n# Chapter\
    \ 11: Advanced Topics: Coroutines (C++20)\n\n## Advanced C++ Concurrency: Delving\
    \ into Coroutines (C++20)\n\nThe introduction of coroutines in `C++20` marked\
    \ a significant leap in writing asynchronous and non-blocking code. This guide\
    \ explores advanced topics in coroutines, empowering you to write elegant and\
    \ efficient concurrent programs.\n\n## Beyond the Basics: Decoding Advanced Coroutine\
    \ Concepts\n\nWhile the fundamentals of `co_return`, `co_await`, and `co_yield`\
    \ provide a solid foundation, advanced coroutines unlock new possibilities:\n\n\
    - **Coroutine Builders**: These functions simplify coroutine creation and management.\
    \ Libraries like `Boost.Coroutine2` provide builder functions for easier coroutine\
    \ usage.\n- **Promise Objects**: These objects represent the eventual result of\
    \ a coroutine. They can be used to manage asynchronous operations and their completion\
    \ states.\n\n### Coroutine Builder with Boost.Coroutine2 (Simplified Example):\n\
    \n```cpp\n#include <boost/coroutine2/coroutine.hpp>\n\nboost::coroutines::coroutine<int>\
    \ coro_function() {\n    int result = 0;\n    // Perform some asynchronous operation\
    \ here\n    co_await /* await for operation completion */;\n    // Process the\
    \ result\n    result = /* ... */;\n    co_return result;\n}\n\nint main() {\n\
    \    auto coro = coro_function();\n    int final_result = coro(); // Start and\
    \ wait for coroutine\n    // Use the final_result\n    return 0;\n}\n```\n\nThis\
    \ example demonstrates a coroutine builder function (`coro_function`) and how\
    \ it's used with `Boost.Coroutine2` to create and manage a coroutine.\n\n### Promises\
    \ for Asynchronous Operations (Simplified Example):\n\n```cpp\n#include <future>\n\
    \nstd::future<int> some_async_operation() {\n    // Perform some asynchronous\
    \ operation here\n    ...\n    return std::promise<int>().get_future();\n}\n\n\
    int main() {\n    auto future = some_async_operation();\n    // Do other work\
    \ while the operation is ongoing\n    int result = future.get(); // Wait for the\
    \ operation to finish and get the result\n    return 0;\n}\n```\n\nThis example\
    \ showcases a `promise` object used with `std::future` to represent the eventual\
    \ result of an asynchronous operation.\n\n## Benefits and Trade-offs of Advanced\
    \ Coroutines\n\n- **Improved Code Readability**: Coroutine builders and promises\
    \ can enhance code clarity by separating coroutine creation and result handling.\n\
    - **Asynchronous Programming Abstraction**: These features provide a higher-level\
    \ abstraction for asynchronous programming compared to raw callbacks.\n- **Potential\
    \ Complexity**: Introducing additional libraries and concepts might increase initial\
    \ learning complexity.\n\n## Advanced Techniques and Considerations\n\n- **Coroutine\
    \ Pipelines**: Chain multiple coroutines together to create asynchronous workflows.\
    \ Techniques like variadic templates can be used for flexible pipeline construction.\n\
    - **Error Handling**: Consider mechanisms for propagating errors through coroutines\
    \ and promise chains for robust error management.\n- **Context Management**: Explore\
    \ techniques like `RAII` (Resource Acquisition Is Initialization) for managing\
    \ resources within coroutines, ensuring proper cleanup.\n\n## When to Consider\
    \ Advanced Coroutines\n\n- **Complex Asynchronous Workflows**: When your application\
    \ involves intricate sequences of asynchronous operations, coroutine builders\
    \ and pipelines can simplify code structure and management.\n- **Improved Code\
    \ Readability**: If code clarity is a priority, leveraging promises and builders\
    \ can enhance the readability of asynchronous code sections.\n- **Understanding\
    \ the Trade-offs**: Carefully evaluate the complexity overhead of additional libraries\
    \ and concepts before adopting advanced coroutine features.\n\n## Conclusion\n\
    \nAdvanced coroutines in `C++20` offer powerful tools for building sophisticated\
    \ asynchronous applications. By understanding coroutine builders, promise objects,\
    \ and advanced techniques, you can unlock a new level of control and expressiveness\
    \ for writing efficient and maintainable concurrent code.\n"
  raw: 'Traditional mutable objects, where internal state can be changed after creation,
    can lead to complexities. Reasoning about their behavior becomes challenging,
    especially in concurrent environments where multiple threads might access and
    modify the object''s state.


    Enter the Immutable Pattern: Unchangeable Objects


    The Immutable Pattern dictates that objects are created in a fully initialized
    state and their internal state remains constant throughout their lifetime. This
    offers several advantages:


    ● Simplicity: Reasoning about the behavior of an immutable object is straightforward,
    as its state cannot change unexpectedly.


    ● Thread Safety: Since the state is fixed, there''s no need for explicit synchronization
    mechanisms like mutexes, making immutable objects inherently thread-safe.


    ● Referential Transparency: Immutable objects behave consistently when passed
    around or copied, as their state remains the same.


    Unlocking Functionality: Techniques for Immutability


    Here''s a glimpse into common techniques for implementing the Immutable Pattern:


    ● Final Member Variables: Declare member variables as final to prevent their modification
    after object initialization.


    ● Copy Constructors and Assignment Operators: Implement copy constructors and
    assignment operators that create new objects with copied state, instead of modifying
    the existing object.


    ● Immutable Helper Objects: Create helper objects within the immutable object
    for specific functionalities, promoting encapsulation and immutability.


    Immutable Point Class (Simplified Example):


    C++


    class Point {


    private:


    final  int x, y;


    public:


    Point(int x, int y) : x(x), y(y) {}


    int  get_x() const { return x; }


    int  get_y() const { return y; }


    // Create a new Point object with a modified coordinate


    Point move_x(int delta) const {


    return Point(x + delta, y);


    }


    };


    This example demonstrates an immutable Point class. Member variables are final,
    and methods like move_x create a new Point object with the modified coordinate
    instead of changing the original object.


    Benefits and Trade-offs of the Immutable Pattern:


    ● Improved Reasoning: Immutable objects simplify reasoning about program behavior
    and potential side effects.


    ● Enhanced Thread Safety: Immutability eliminates the need for explicit synchronization,
    making these objects safe for concurrent access.


    ● Potential Performance Overhead: Creating new objects for modifications might
    introduce overhead compared to mutable objects.


    Advanced Techniques and Considerations:


    ● Deep Immutability: Ensure all member objects within an immutable object are
    also immutable to guarantee complete state immutability.


    ● Builder Pattern: The Builder Pattern can be used to simplify the creation of
    complex immutable objects with many initial values.


    ● Performance Optimization: Techniques like object pooling or copy-on-write semantics
    can be explored to optimize performance implications of immutability in specific
    scenarios.


    When to Consider the Immutable Pattern:


    ● Thread Safety: If thread safety is a primary concern, immutable objects offer
    a simple and effective approach.


    ● State Management Complexity: When managing complex object state, immutability
    can simplify reasoning about object behavior and reduce potential errors.


    ● Functional Programming Style: The Immutable Pattern aligns well with functional
    programming principles, promoting immutability and referential transparency.


    Conclusion:


    The Immutable Pattern empowers you to design robust, maintainable, and thread-safe
    objects in C++. By understanding the techniques, benefits, trade-offs, and advanced
    considerations, you can make informed decisions about when and how to leverage
    immutability to enhance the quality and safety of your C++ codebase.


    The Road Ahead:


    The journey into advanced C++ design continues. Explore topics like functional
    programming concepts, advanced memory management techniques like smart pointers,
    and design patterns for specific use cases like the Factory Pattern or the Observer
    Pattern.


    # Chapter 11: Advanced Topics: Coroutines (C++20)


    Advanced C++ Concurrency: Delving into Coroutines (C++20)


    The introduction of coroutines in C++20 marked a significant leap in writing asynchronous
    and non-blocking code. This guide explores advanced topics in coroutines, empowering
    you to write elegant and efficient concurrent programs.


    Beyond the Basics: Decoding Advanced Coroutine Concepts


    While the fundamentals of co_return, co_await, and co_yield provide a solid foundation,
    advanced coroutines unlock new possibilities:


    ● Coroutine Builders: These functions simplify coroutine creation and management.
    Libraries like Boost.Coroutine2 provide builder functions for easier coroutine
    usage.


    ● Promise Objects: These objects represent the eventual result of a coroutine.
    They can be used to manage asynchronous operations and their completion states.


    Coroutine Builder with Boost.Coroutine2 (Simplified Example):


    C++


    #include <boost/coroutine2/coroutine.hpp>


    boost::coroutines::coroutine<int> coro_function() {


    int result = 0;


    // Perform some asynchronous operation here


    co_await  /* await for operation completion */;


    // Process the result


    result = /* ... */;


    co_return result;


    }


    int  main() {


    auto coro = coro_function();


    int final_result = coro(); // Start and wait for coroutine


    // Use the final_result


    return  0;


    }


    This example demonstrates a coroutine builder function (coro_function) and how
    it''s used with Boost.Coroutine2 to create and manage a coroutine.


    Promises for Asynchronous Operations (Simplified Example):


    C++


    #include <future>


    std::future<int> some_async_operation() {


    // Perform some asynchronous operation here


    ...


    return  std::promise<int>().get_future();


    }


    int  main() {


    auto  future = some_async_operation();


    // Do other work while the operation is ongoing


    int result = future.get(); // Wait for the operation to finish and get the result


    return  0;


    }


    This example showcases a promise object used with std::future to represent the
    eventual result of an asynchronous operation.


    Benefits and Trade-offs of Advanced Coroutines:


    ● Improved Code Readability: Coroutine builders and promises can enhance code
    clarity by separating coroutine creation and result handling.


    ● Asynchronous Programming Abstraction: These features provide a higher-level
    abstraction for asynchronous programming compared to raw callbacks.


    ● Potential Complexity: Introducing additional libraries and concepts might increase
    initial learning complexity.


    Advanced Techniques and Considerations:


    ● Coroutine Pipelines: Chain multiple coroutines together to create asynchronous
    workflows. Techniques like variadic templates can be used for flexible pipeline
    construction.


    ● Error Handling: Consider mechanisms for propagating errors through coroutines
    and promise chains for robust error management.


    ● Context Management: Explore techniques like RAII (Resource Acquisition Is Initialization)
    for managing resources within coroutines, ensuring proper cleanup.


    When to Consider Advanced Coroutines:


    ● Complex Asynchronous Workflows: When your application involves intricate sequences
    of asynchronous operations, coroutine builders and pipelines can simplify code
    structure and management.


    ● Improved Code Readability: If code clarity is a priority, leveraging promises
    and builders can enhance the readability of asynchronous code sections.


    ● Understanding the Trade-offs: Carefully evaluate the complexity overhead of
    additional libraries and concepts before adopting advanced coroutine features.


    Conclusion:


    Advanced coroutines in C++20 offer powerful tools for building sophisticated asynchronous
    applications. By understanding coroutine builders, promise objects, and advanced
    techniques, you can unlock a new level of control and expressiveness for writing
    efficient and maintainable concurrent code.


